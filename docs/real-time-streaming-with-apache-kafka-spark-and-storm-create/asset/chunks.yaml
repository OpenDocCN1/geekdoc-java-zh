  trans: "\n*   执行 Kafka 生产者\n*   理解 Kafka 中发送消息的不同方式\n*   学习确认（acknowledgement）的类型\n\
    *   Kafka 生成者的应用\n\n# Kafka 生产者 API\n\n`KafkaProducer` 类包含了 Java 中的 Kafka 生产者函数。它是用于发布消息的\
    \ Kafka 客户端。该实例是线程安全的。[表 4.1] 显示了类中提供的构造函数和方法：\n\n| 序号 | 方法 | 说明 |\n| :--- | :---\
    \ | :--- |\n| 1 | `void abortTransaction()` | 取消正在进行的事务。 |\n| 2 | `void beginTransaction()`\
    \ | 在事务开始之前，必须调用此方法。 |\n| 3 | `void commitTransaction()` | 提交当前激活的事务。 |\n| 4 |\
    \ `void initTransactions()` | 必须首先调用此方法。 |\n| 5 | `java.util.Map<MetricName,?\
    \ extends Metric>Metrics()` | 返回每个生产者指标。 |\n| 6 | `send(ProducerRecord<K,V> record)`\
    \ | 异步向主题发送记录。 |\n| 7 | `send Of fsets To Transaction()` | 此方法向消费者组发送偏移量。 |\n\
    | 8 | `Close()` | 此方法将关闭生产者。 |\n| 9 | `Flush()` | 缓冲区中的所有记录将被刷新。 |\n\n**表 4.1：**\
    \ 生产者 API\n\nKafka 类的上述函数将在实现过程中使用。在下一节中，我们将查看 Java 中 Kafka 生产者的实现。\n\n# Java\
    \ 中的生产者实现\n\n在本节中，我们用用 Java 实现 `KafkaProducer`，并学习使用 `ProducerRecord` 对象处理记录。该项目的\
    \ `pom.xml` 代码如下：\n\n```xml\n<project xmlns=http://maven.apache.org/POM/4.0.0\
    \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"\
    http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\"\
    >\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>KafkaProject</groupId>\n \
    \ <artifactId>KafkaProject</artifactId>\n  <version>0.0.1-SNAPSHOT</version>\n\
    \  <parent>\n    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-starter-parent</artifactId>\n\
    \    <version>2.0.0.RELEASE</version>\n    <relativePath/><><!----lookup parent\
    \ from repository -->\n  </parent>\n  <properties>\n    <maven-jar-plugin.version>2.6</maven-jar-plugin.version>\n\
    \    <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>\n    <project.reporting.outputEncoding>UTF-8</project.reporting.outputEncoding>\n\
    \    <java.version>1.8</java.version>\n  </properties>\n  <dependencies>\n   \
    \ <dependency>\n      <groupId>org.springframework.boot</groupId>\n      <artifactId>spring-boot-starter-web</artifactId>\n\
    \    </dependency>\n    <dependency>\n      <groupId>org.springframework.boot</groupId>\n\
    \      <artifactId>spring-boot-devtools</artifactId>\n      <scope>runtime</scope>\n\
    \    </dependency>\n    <dependency>\n      <groupId>org.springframework.boot</groupId>\n\
    \      <artifactId>spring-boot-starter-test</artifactId>\n      <scope>test</scope>\n\
    \    </dependency>\n    <dependency>\n      <groupId>org.apache.kafka</groupId>\n\
    \      <artifactId>kafka_2.12</artifactId>\n      <version>1.0.1</version>\n \
    \   </dependency>\n  </dependencies>\n</project>\n```\n\n依赖 `spring-boot-starter-web`\
    \ 包含了 spring boot 的库。`spring-boot-devtools` 依赖提供了当项目文件发生变化时自动重启应用程序的运行时支持。`spring-boot-starter-test`\
    \ 包含了测试 spring boot 应用程序的库。`kafka_2.12` 包含了实现 Kafka 需要的所有库。\n\n以下是 Kafka 生产者的实现：\n\
    \n```java\n//import util.properties packages\nimport java.util.Properties;\n//import\
    \ KafkaProducer packages\nimport org.apache.kafka.clients.producer.KafkaProducer;\n\
    //import ProducerRecord packages\nimport org.apache.kafka.clients.producer.ProducerRecord;\n\
    \npublic class Producer {\n    public static void main(String[] args) throws Exception\
    \ {\n        // 为要产生的消息提供一个主题名称\n        String topicName = \"Test-Kafka5\";\n\
    \        // 创建 Properties 实例以使用属性\n        Properties props = new Properties();\n\
    \        // 将本地 id 分配给服务器属性\n        props.put(\"bootstrap.servers\", \"localhost:9092\"\
    );\n        // 提供批大小\n        props.put(\"batch.size\", 16384);\n        // 当请求失败时，可以重试次数\n\
    \        props.put(\"retries\", 0);\n        // 设置确认机制\n        props.put(\"acks\"\
    , \"all\");\n        // 减少小于值\n        props.put(\"linger.ms\", 1);\n        //\
    \ 是可用的内存总量\n        props.put(\"buffer.memory\", 3355432);\n        // 设置序列化器\n\
    \        props.put(\"key.serializer\", \"org.apache.kafka.common.serialization.StringSerializer\"\
    );\n        props.put(\"value.serializer\", \"org.apache.kafka.common.serialization.StringSerializer\"\
    );\n\n        KafkaProducer<String, String> producer = new KafkaProducer<>(props);\n\
    \n        for (int i = 0; i < 30; i++) {\n            // 使用 send 方法发送消息\n    \
    \        producer.send(new ProducerRecord<>(topicName, Integer.toString(i)));\n\
    \            System.out.println(\"Sending message: \" + Integer.toString(i));\n\
    \        }\n        System.out.println(\"All messages have been sent successfully\"\
    );\n        // 关闭生产者实例\n        producer.close();\n    }\n}\n```（注：由于原文中存在大量重复和格式混乱，上述译文已根据提供的核心逻辑内容进行了去重和整理。）\n"
- fmt: "\n*   **Synchronous send**: In this approach, we will send the message and\
    \ wait for an acknowledgement. The `get()` method is used to fetch the acknowledgement\
    \ to know if the message was sent successfully.\n\n    The syntax is as follows:\n\
    \n```java\n//Create a message\nProducerRecord<String, String>kafkaMessageContent=\
    \ new ProducerRecord<String, String>(\"Kafka topic name\", kafka_key, kafka_message);\n\
    \n//Send the message\nproducer.send(kafkaMessageContent).get();\n```\n\n*   **Asynchronous\
    \ send**: In this approach, the `send` method is called along with a `callback`\
    \ function. This `callback` function is called after the message has been sent\
    \ successfully:\n\n```java\n//Create a call back class\nCallBackClasscallbackFunction\
    \ = new CallBackClass();\n\n//Create the message\nProducerRecord<String, String>kafkaMessageContent=\
    \ new ProducerRecord<String, String>(\"Kafka topic name\", kafka_key, kafka_message);\n\
    \n//Send the message\nproducer.send(kafkaMessageContent, callbackFunction);\n\n\
    private static class CallBackClass implements Callback {\n  public void onCompletion(RecordMetadatarecordMetadata,\
    \ Exception e) {\n    if (e != null) {\n      System.out.println(\"Error while\
    \ producing message to topic :\" + recordMetadata);\n      e.printStackTrace();\n\
    \    } else {\n      String message = String.format(\"Message sent to topic:%s\
    \ partition:%s offset:%s\", recordMetadata.topic(), recordMetadata.partition(),\
    \ recordMetadata.offset());\n      System.out.println(message);\n    }\n  }\n\
    }\n```\n\nAccording to the application that uses the producer, any one of the\
    \ above types will be used.\n\n# Types of acknowledgments\n\nThe messages that\
    \ are sent to the publisher needs to be acknowledged. There are three types of\
    \ acknowledgements. Depending on the type of acknowledgement provided, the publisher\
    \ waits for the acknowledgement from the broker:\n\n| Type | Description |\n|\
    \ :--- | :--- |\n| `Acknowledgement = 0` | There will be no acknowledgement sent\
    \ in this case. The producer will not have to wait for it. |\n| `Acknowledgement\
    \ = 1` | In this case, an acknowledgement will be sent by the leader. The replicas\
    \ won’t need to send an acknowledgement |\n| `Acknowledgement = all` | In this\
    \ scenario, the broker will check whether all the replicas have received the message\
    \ sent by the producer. When received by all, the broker will send the acknowledgement.\
    \ |\n\n**Table 4.2:** Acknowledgement types\n\nThe type of acknowledgement chosen\
    \ will be depending on the design of the system.\n\n# Applications of a Kafka\
    \ producer\n\n*   **Monitoring website activity**: On an e-commerce platform,\
    \ it can be used to process the transactions that occur. The producer will send\
    \ the data belonging to the purchase transactions that the customer does.\n* \
    \  **Messaging**: When we send messages from one system to another, they need\
    \ to be processed; the producer can be used to group them into topics and send\
    \ them accordingly for processing.\n*   **Log aggregation**: Logs are generated\
    \ from various applications from web servers, database systems, server logs, and\
    \ so on. The Kafka producer can be used to collect the logs from the various applications\
    \ and send for consumption.\n*   **ETL**: Kafka Connect can be used to read databases\
    \ and group them into Kafka topics; this can be produced as streams of data for\
    \ processing with low latency.\n*   **Twitter sentiment analysis application**:\
    \ As and when people tweet, the producer can send these messages to the cluster.\
    \ The consumer will then read these messages and send them to application to process\
    \ the sentiments in the tweets.\n*   **Fraud detection system**: On an online\
    \ store, we can send the transactions, such as the products being bought by the\
    \ customers as data to be produced by the Kafka producer. Later the consumer can\
    \ process this data to determine whether the transaction is fraudulent.\n\nThe\
    \ above applications are the frequently-used use cases for Kafka Producer. So,\
    \ in real-time problem-solving and architecting any similar use cases that we\
    \ encounter can use Kafka as well.\n\n# Conclusion\n\nIn this chapter, we have\
    \ learnt the list of Kafka APIs that are used during the development of Kafka\
    \ producers. The important APIs include `send()`, which is used to send the Kafka\
    \ messages. The producer implementation in Java was described along with the code.\
    \ The `pom.xml` file contains the dependencies required by the project. The implementation\
    \ of the producer in Java was explained in detail. The execution process of the\
    \ producer program was seen.\n\nThe three ways of sending a Kafka message has\
    \ been illustrated. The different acknowledgement types for the Kafka messages\
    \ sent were shown. The applications that use the Kafka producer were also listed.\
    \ This chapter aims to create an understanding of the implementation of a Kafka\
    \ Producer in Java. You should be able to customize it and use it for your own\
    \ use cases.\n\nIn the next chapter, we will learn the implementation of Kafka\
    \ Consumer. The various APIs used during the implementation of the consumer will\
    \ be understood in detail.\n\n# Questions\n\n1.  **Which API is used to create\
    \ as Kafka Producer?**\n2.  **Can one instance of the producer be shared by multiple\
    \ instances? Is the Producer class threadsafe?**\n3.  **Which of the following\
    \ method of sending Kafka messages doesn't receive an acknowledgement?**\n   \
    \ 1. Fire and forgot\n    2. Synchronous send\n    3. Asynchronous send\n    4.\
    \ Default\n4.  **In which type of acknowledgement does the broker wait for all\
    \ the replicas to received the message?**\n    1. Acknowledgement=1\n    2. Acknowledgement\
    \ =0\n    3. Acknowledgement =all\n5.  **Which of the following is not an application\
    \ of Kafka Producer?**\n    1. Prediction systems\n    2. ETL\n    3. Sentiment\
    \ analysis\n    4. Messaging\n6.  **Which API is used for implementing the ETL\
    \ application?**\n7.  **In asynchronous send method, what is the function called,\
    \ which is called after the message is sent?**\n\n# Answers\n\n1.  `KafkaProducer()`\n\
    2.  Yes.\n3.  Fire and Forgot\n4.  `Acknowledgement =all`\n5.  Prediction systems\n\
    6.  `Connect API`\n7.  `callback`\n\n# CHAPTER 5\n\n# Kafka Consumers\n\n# Introduction\n\
    \nIn the previous chapter, we learnt about the Kafka producers. In this chapter,\
    \ we will learn to implement Kafka consumer in Java. We will understand functionalities\
    \ of consumer groups and the group coordination protocol. The Java APIs for Kafka\
    \ consumers is introduced here, which can be used during the implementation of\
    \ Kafka consumers using Java. The previous chapter's Java producer client will\
    \ be used to test the Kafka consumer. The implementation of the consumer will\
    \ be explained in detail. In the end, we will look at the process of execution\
    \ of the consumer in order to consume messages from the broker.\n\n# Structure\n\
    \nWe will study the following topics in this chapter:\n\n*   Overview of Kafka\
    \ consumer\n*   Consumer groups\n*   Group coordination protocol\n*   API for\
    \ Kafka consumer\n*   Consumer implementation in Java\n*   Execution of the Kafka\
    \ consumers\n\n# Objectives\n\nAfter studying this chapter, you would understand\
    \ the following:\n\n*   Introduction to Kafka consumer\n*   Consumer groups\n\
    *   Group coordination protocol\n*   Overview of Kafka consumer API in Java\n\
    *   Implementing the Kafka consumer in Java\n*   Executing the Kafka consumer\n\
    \n# Kafka consumer\n\nKafka consumer is the client that reads records from the\
    \ Kafka cluster. The consumer reads from topics using offset values. A consumer\
    \ can subscribe to multiple topics. As set of consumers reading from similar topics\
    \ are grouped together, these are called **consumer groups**.\n\n# Consumer groups\n"
