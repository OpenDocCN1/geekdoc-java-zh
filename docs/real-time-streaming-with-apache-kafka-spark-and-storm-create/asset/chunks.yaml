  trans: '


    Hadoop 和 Storm 都用于数据计算。以下是它们之间的区别：


    | Hadoop | Storm |

    | :--- | :--- |

    | 以批处理进行数据计算。 | 对实时流式数据进行计算。 |

    | 采用主从架构，以作业和任务的形式存在。可能没有 Zookeeper 来管理实例。 | 架构是主从式的，主节点称为 `Nimbus`，从节点称为 `supervisors`。使用
    `Zookeeper` 来管理集群。 |

    | 它存储并维护状态。 | 它是无状态的。 |

    | 它包含 map/reduce 作业，并在所有作业完成后结束。 | 集群一直运行直到用户关闭实例。 |

    | MapReduce 框架的处理时间可能需要几小时或几分钟。 | `storm` 中的任务处理需要几秒或毫秒。 |

    | 容易搭建，但操作集群相对复杂。 | 容易搭建且容易使用。 |


    表 6.2：Hadoop 和 Storm 的对比


    上表说明了 Hadoop 和 Storm 之间的关键区别。


    ## Storm 的核心组件


    以下是 Storm 集群的组件：


    *   **节点 (Nodes)**：一个 `storm` 集群包含两种节点：主节点和工作节点。

    *   **Nimbus**：`Nimbus` 节点是 `Storm` 集群的主节点。`nimbus` 守护进程的主要职责是管理、协调和监控在集群上运行的拓扑，包括拓扑部署、任务分配以及故障时的任务重新分配。`Nimbus`
    是无状态的，并将所有数据存储在 `Zookeeper` 中。

    *   **Supervisor**：这是由工作节点运行的进程。它执行主节点分配给它的任务。一个 `supervisor` 可以拥有多个工作节点。`supervisor`
    将任务分配给工作节点，并可以拥有完成任务所需的资源。它负责创建、启动和停止工作进程以执行分配给该节点的任务。与 `Nimbus` 类似，`supervisor`
    进程也是快速失败的，并将所有状态存储在 `Zookeeper` 中，以便其在不丢失任何状态的情况下重启。

    *   **流 (Stream)**：从数据源流入拓扑的数据流包含元组（Tuples）。`Tuple` 是 `storm` 集群的组件。这个 `tuple`
    包含数据源发送到 `spout` 的数据元素列表。它们是 `Storm` 中的主要数据结构。它们是各种值的命名列表，如整数、字节、浮点数和字节数组。

    *   **Spouts**：从数据源的输入流被发送到 `Spout`。它持续读取数据并在发送到 `bolt` 之前创建元组。例如，它可以从 `Kafka`
    消息队列、数据库或文件系统读取。

    *   **Bolts**：`Bolts` 是 `Storm` 中所有逻辑处理的核心；来自 `spout` 的数据被发送到 `bolt` 进行处理。这些 `bolt`
    可以对数据进行计算。`bolt` 可以将数据发送到另一个 `bolt` 进行进一步处理，或将输出存储在数据库中。

    *   **任务 (Task)**：`task` 意味着在 `storm` 集群中以某种形式处理数据。它可以是一个 `spout` 或 `bolt`。尽管拓扑中的组件数量及其任务保持不变，但这些任务的执行器是可以更改的。执行器可能会根据给给
    `bolt` 处理的输入负载而增加或减少。默认情况下，`Storm` 将在一个线程中运行一个任务。

    *   **拓扑 (Topologies)**：一个 `storm` 拓扑包含 `storm` 组件，即 `spout` 和 `bolts`。它是由多个 spouts
    和 bolts 形成的网络。每个组件都会处理数据并将其输出发送到连接的组件；因此，它是一个为了实现目标而组织的由 spouts 和 bolts 构成的互连网络。

    *   **Zookeeper**：`storm` 集群状态由 `Zookeeper` 维护。`storm` 中的守护进程是无状态的。当主节点或从节点发生故障时，它们将重启。


    ## Apache Storm 架构


    `Storm` 的架构由 spouts 和 bolts 组成。输入数据由 `spouts` 读取。可能会有很多 spouts 从不同的数据源读取数据。`Bolts`
    将处理来自 `spout` 的输出数据元组。bolts 可以将其输出发送到另一个 `bolt` 进行更多计算。最后，结果可以存储在数据库或任何持久化存储中：


    ![](img/6.1.jpg)


    图 6.1：Apache Storm 架构


    上图说明了多个 spouts 和 bolts 之间的交互。这是一个简单的拓扑。


    ## Storm 的优势


    `Storm` 的优势如下：


    *   **可靠性 (Reliable)**：它具有高可靠性，因为它能快速检测故障，并通过立即替换故障的工作节点来确保每个元组/数据至少处理一次。在故障期间，数据处理可能会发生多次，但数据永远不会被遗漏。

    *   **容错性 (Fault-tolerant)**：如果任何工作节点失败，任务将重新分配到新节点进行处理，因此具有很高的容错性。

    *   **开源 (Open source)**：由于软件是开源的，更容易下载和实现我们开发实时分布式处理器所需的组件。它提供的示例和文档对用户友好，可以快速启动开发。

    *   **速度 (Speed)**：`Storm` 中的数据处理速度极快。它可以在几秒内生成结果。这是 `Storm` 组件设计的关键特征之一。

    *   **可扩展性 (Scalability)**：`Storm` 组件可以通过添加更多资源或机器并将任务分配到多台机器来扩展。因此，随着输入负载的增加，很容易扩展由
    bolts 执行的处理和计算。

    *   **易于开发 (Ease of development)**：开发实时流式和处理应用非常耗时。使用 Apache `Storm`，我们很容易为我们的目标构建一个实时分布式应用。

    *   **支持多种编程语言 (Supports multiple programming languages)**：`Storm` 支持任何可以使用封装库实现并与
    `Storm` API 集成的编程语言。

    *   支持数据的实时流式传输


    ## Storm 的应用


    `Storm` 在流处理和计算领域都有应用；以下是它的一些应用：


    *   实时分析

    *   在线机器学习

    *   持续计算

    *   分布式 RPC

    *   ETL（提取、转换、加载）


    使用 Storm 处理的一些公司包括：


    *   **Spotify**：这里提供了音乐流服务，并使用 `storm` 对其进行各种分析。

    *   **Twitter**：为了在发现、实时分析、个性化、搜索、收益优化等范围应用范围内处理每条推文，使用了 `Storm`。它与 Twitter 的其他基础设施集成，包括数据库系统（Cassandra、Memcached
    等）、消息基础设施、Mesos 以及监控/告警系统。

    *   **Groupon**：`Storm` 用于分析、清洗和规范化大量数据。

    *   **Yahoo**：`Storm` 用于处理用户事件、内容馈和应用程序日志。

    *   **淘宝**：这里使用 `Storm` 实时生成日志统计数据。

    *   **阿里巴巴**：这里使用 `Storm` 处理应用程序日志，为其应用程序提供实时统计数据。


    ## 总结


    在本章中，我们理解了 Storm 的架构及其组件。我们学习了 storm、hadoop 和 Kafka 之间的区别。说明了使用 storm 的优势。描述了
    storm 的应用以及一些使用 storm 的公司。


