    # Installing and using Eclipse and Maven](#toc.xhtml_s38a)


    Eclipse IDE can be used for the development of Kafka producers and consumers.
    Therefore, in this section, we will learn to download and set up Eclipse IDE for
    implementing Kafka messaging. The following steps details the method of downloading
    the eclipse software and creating a Maven project:


    1. Navigate to this URL: [https://www.eclipse.org/mars/](https://www.eclipse.org/mars/)


    2. Click on the `Download` button as shown in the following screenshot:


    ![](images/3.19.jpg)


    **Figure 3.19:** Eclipse source


    3. Click on the `Download XX` according to your OS:


    ![](images/3.20.jpg)


    **Figure 3.20:** Eclipse URL


    4. The `.exe` file will be downloaded to your system. Run the `.exe` file to install
    the eclipse. Navigate to the `eclipse` directory to open an eclipse application
    as shown in the following screenshot:


    ![](images/3.21.jpg)


    **Figure 3.21:** Eclipse shortcut


    5. Once eclipse is opened, click on the `Help` menu and choose `Eclipse Marketplace`
    as shown in the following screenshot:


    ![](images/3.22.jpg)


    **Figure 3.22:** Eclipse Help menu


    6. Search for `spring` in the `Find` textbox as shown in the following screenshot:


    ![](images/3.23.jpg)


    **Figure 3.23:** Eclipse Marketplace


    7. Go to the `File` menu, click on `New` | `Maven Project`:


    ![](images/3.24.jpg)


    **Figure 3.24:** Creating new Maven Project


    8. Choose `Maven Project` as shown in the following screenshot:


    ![](images/3.25.jpg)


    **Figure 3.25:** Select Wizard


    9. Click on `Next`:


    ![](images/3.26.jpg)


    **Figure 3.26:** Project path


    10. Click on `Next` as shown in the following screenshot


    ![](images/3.27.jpg)


    **Figure 3.27:** Project creation archetype


    11. Provide a name for `Artifact Id` as shown in the following screenshot. Click
    on `Finish`:


    ![](images/3.28.jpg)


    **Figure 3.28:** Artifact Id Name


    12. The Maven project will be created as shown in the following screenshot:


    ![](images/3.29.jpg)


    **Figure 3.29:** Project Explorer


    In this section, we have installed Eclipse IDE and created a sample Maven Project
    successfully. The Maven project will be used later to create the Kafka producers
    and consumers.


    # Installing IntelliJ IDE](#toc.xhtml_s39a)


    IntelliJ IDE is another development environment where the Kafka components can
    be developed. In this section, we will learn to download and set up the IntelliJ
    IDE. The dependences required by the Kafka architecture are also added to the
    projects.


    The following are the steps for installing and setting up the Maven dependencies
    within the IDE for development:


    1. Navigate to the following URL: [https://www.jetbrains.com/idea/download/#section=windows](https://www.jetbrains.com/idea/download/#section=windows)


    2. Click on the `Download` button:


    ![](images/3.30.jpg)


    **Figure 3.30:** IntelliJ source


    3. Download the community version of the IDE:


    ![](images/3.31.jpg)


    **Figure 3.31:** Executable file


    4. Click on `Next` as shown in the following screenshot:


    ![](images/3.32.jpg)


    **Figure 3.32:** Setup wizard


    5. Follow the steps and complete the installation.


    6. Click on the `Start` button and search for IntelliJ. Select the icon shown
    in the following screenshot:


    ![](images/3.33.jpg)


    **Figure 3.33:** Software icon file


    7. Click on `File` | `New` | `Project`:


    ![](images/3.34.jpg)


    **Figure 3.34:** New Project wizard


    8. Choose `Maven`:


    ![](images/3.35.jpg)


    **Figure 3.35:** Choosing Maven project


    9. Key in a name for the project and click on `Finish`:


    ![](images/3.36.jpg)


    **Figure 3.36:** Project Name Screen


    10. You should see the new project and the `pom.xml` file as shown in the following
    screenshot:


    ![](images/3.37.jpg)


    **Figure 3.37:** New Project Explorer


    We will be implementing Kafka producers and consumers in subsequent chapters using
    any one IDE. It is not required to install both of them.


    In this section, we have set up IntelliJ IDE. This IDE can also be used for the
    development of Kafka producers and consumers.


