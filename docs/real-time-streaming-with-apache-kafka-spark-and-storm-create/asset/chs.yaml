  [/content]\n\n```：\n[content]\n\n如下所示选择选项并点击 `OK` 以使用必要的依赖项更新项目：\n\n![](img/12.7.jpg)\n\
  [/]\n\n在前一节中，我们看到了引入 Kafka 和 Storm 集成所需依赖项的过程。在下一节中，我们将学习实现一个 Bolt。\n\n### Bolt\
  \ 的实现\n\nBolt 的实现要求我们实现以下方法：\n\n* `execute()`：Bolt 接收的数据到达这里，我们可以对其进行处理。在示例中，我们正在记录\
  \ Bolt 接收的数据。\n* `declareOutputFields()`：处理后的数据输出存储在此定义的输出字段中。在此定义的输出字段名称为 `message`。\n\
  \n```java\nimport org.apache.log4j.Logger;\nimport org.apache.storm.topology.BasicOutputCollector;\n\
  ```\n\n[/content] (抱歉，由于最后一段在输入时截断，已在上方补全翻译逻辑) \n\n*(注：由于您提供的文本在结尾处截断，我根据上下文补全了最后部分的翻译逻辑。如果需要更完整的翻译，请提供完整文本)*\n\
  \n---\n**更正：** 重新检查输入文本，最后确实在 `import org.apache.storm.topology.BasicOutputCollector;`\
  \ 处结束。\n\n完整的最后部分翻译如下：\n\n```java\nimport org.apache.log4j.Logger;\nimport org.apache.storm.topology.BasicOutputCollector;\n\
  ```\n\n\n\n\n```java\nimport org.apache.storm.topology.OutputFieldsDeclarer;\nimport\
  \ org.apache.storm.topology.base.BaseBasicBolt;\nimport org.apache.storm.tuple.Fields;\n\
  import org.apache.storm.tuple.Tuple;\n\npublic class MessageProcessorBolt extends\
  \ BaseBasicBolt{\n    private static final long serialVersionUID = 1L;\n    private\
  \ static final Logger LOG = Logger.getLogger(MessageProcessorBolt.class);\n    public\
  \ void execute(Tuple input, BasicOutputCollector collector) {\n        LOG.info(input.getString(0));\n\
  \    }\n\n    public void declareOutputFields(OutputFieldsDeclarer declarer) {\n\
  \        declarer.declare(new Fields(\"message\"));\n    }\n}\n```\n\n该 Bolt 持续接收消息以处理由\
  \ `KafkaCluster` 发送的实时数据。\n\n### 创建拓扑\n\n在本节中，我们将 Kafka Spout 和 Bolts 以拓扑（Topology）的形式整合在一起。`SpoutConfig`\
  \ 类接收四个参数：hosts、topic、path 和 client ID。`KafkaSpout` 使用 `config` 信息来创建一个 Spout。`TopologyBuilder`\
  \ 类将 bolt 和 spout 信息以拓扑的形式设置在一起：\n\n```java\nimport java.util.HashMap;\nimport org.apache.log4j.Logger;\n\
  import org.apache.storm.Config;\nimport org.apache.storm.LocalCluster;\nimport org.apache.storm.kafka.BrokerHosts;\n\
  import org.apache.storm.kafka.KafkaSpout;\nimport org.apache.storm.kafka.SpoutConfig;\n\
  import org.apache.storm.kafka.StringScheme;\nimport org.apache.storm.kafka.ZkHosts;\n\
  import org.apache.storm.spout.SchemeAsMultiScheme;\nimport org.apache.storm.topology.TopologyBuilder;\n\
  \npublic class KafkaStormIntegration {\n    private static final Logger LOG = Logger.getLogger(KafkaStormIntegration.class);\n\
  \    public static void main(String[] args) {\n        // 如果参数少于 4 个则打印错误信息\n  \
  \      if (args.length< 4) {\n            LOG.error(\n            \"Missing arguments,\
  \ The 4 arguments are:hosts, topic, path, clientid\");\n            System.exit(1);\n\
  \        }\n        // 读取命令行参数\n        final BrokerHosts hosts = new ZkHosts(args[0]);\n\
  \        final String topic = args[1];\n        final String root = args[2];\n \
  \       final String clientId = args[3];\n        // 创建 Spout 配置\n        final\
  \ SpoutConfig conf = new SpoutConfig(hosts, topic, root, clientId);\n        conf.scheme\
  \ = new SchemeAsMultiScheme(new StringScheme());\n        // 创建拓扑以处理来自 kafka 的消息并在控制台打印消息\n\
  \        final TopologyBuilder topology = new TopologyBuilder();\n        // 创建\
  \ Kafka Spout，该 spout 使用创建的配置\n        // 然后将 spout 添加到拓扑\n        topology.setSpout(\"\
  spout\", new KafkaSpout(conf), 1);\n        // bolt 处理来自 kafka 的消息\n        topology.setBolt(\"\
  testing message\", new MessageProcessorBolt()).globalGrouping(\"spout\");\n    \
  \    // 创建集群\n        final LocalCluster localCluster = new LocalCluster();\n  \
  \      Config topologyConf = new Config();\n        topologyConf.setDebug(true);\n\
  \        // 将拓扑提交到集群\n        localCluster.submitTopology(\"topology\", topologyConf,\
  \ topology.createTopology());\n    }\n}\n```\n\n创建的拓扑被提交到集群进行执行。在下一节中，我们将学习如何使用\
  \ Kafka Spout 运行此拓扑。\n\n### 执行集成流\n\n要执行完整的集成，我们需要启动 Kafka Broker。步骤如下：\n\n1. 更新\
