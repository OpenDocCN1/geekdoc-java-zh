  5. `get()`\n\n# 第 11 章：Kafka 与 Spark 的集成\n\n### 引言\n\n在本章中，我们将学习 Kafka 和 Spark 的集成。Kafka\
  \ 可以通过多种方法与 Spark Streaming 集成。我们将学习 Kafka 与 Spark 的结构化流集成。我们将学习 Kafka 和 Spark API\
  \ 的实现，这些 API 支持 Spark Streaming 从 Kafka 流中读取数据。\n\n### 结构\n\n本章的结构如下：\n\n* Kafka\
  \ 和 Spark 的集成\n* Kafka 和 Spark 的集成方法\n* Kafka 和 Spark 的结构化流集成\n* Kafka 和 Spark Streaming\
  \ 的实现\n\n### 目标\n\n本章的目标是：\n\n* 理解 Apache Kafka 和 Spark 集成的概念\n* 学习集成的不同方法\n* 学习\
  \ Kafka 的结构化流集成\n* 理解 Kafka 和 Spark Streaming 的实现\n\n### Kafka 和 Spark 的集成\n\nApache\
  \ Kafka 可以与 Spark Streaming 集成，其中 Spark Streaming 接收来自 Kafka 的数据。集成可以通过两种方法进行：\n\
  \n* 基于接收器的方法 (Receiver-based approach)\n* 直接方法 (Direct approach)\n\n如下所示，Kafka 流可以将数据发送到\
  \ Spark Streaming 组件。Spark 引擎可以对数据进行任何所需的计算。处理后的数据将存储在数据库中：\n\n![](img/11.1.jpg)\n\
  \n**图 11.1:** Kafka 与 Spark 集成\n\n还有与 Kafka 的结构化流集成，数据从 Kafka 流中读取，由 Spark 引擎处理并写回\
  \ Kafka，如下所示：\n\n![](img/11.2.jpg)\n\n**图 11.2:** 结构化流 Kafka 与 Spark 集成\n\nKafka\
  \ 提供了库和 API 来支持 Spark 引擎与其输入输出流的集成。\n\n### 集成方法\n\n在本节中，我们将两种方法，即基于接收器的方法和直接方法：\n\
  \n* **基于接收器的方法**：这是初始方法，使用 Kafka API 实现并使用接收器。数据被传递给 Spark Streaming。\n* **直接方法**：这是不使用接收器的新方法。\n\
  \n### Kafka 与 Spark 的结构化流集成\n\n在本节中，我们将学习如何实现从 Kafka 读取的函数。\n\n### 创建批查询的 Kafka\
  \ 源\n\n以下显示了对一个主题的订阅，当未提供起始和结束偏移量时，默认使用最早和最新的偏移量：\n\n```scala\nval df = spark.read\n\
  \  .format(\"kafka\")\n  .option(\"kafka.bootstrap.servers\", \"localhost:9092\"\
  )\n  .option(\"subscribe\", \"topic1\")\n  .load()\n```\n\n\n\n\n```scala\n// 订阅\
  \ 1 topic，默认使用最早和最后的偏移量\nvaldf=spark\n.read\n  .format(\"kafka\")\n  .option(\"\
  kafka.bootstrap.servers\",\"host1:port1,host2:port2\")\n  .option(\"subscribe\"\
  ,\"topic1\")\n  .load()\ndf.selectExpr(\"CAST(key AS STRING)\",\"CAST(value AS STRING)\"\
  )\n.as[(String, String)]\n```\n\n以下展示了订阅多个 topic 并指定特定的偏移量：\n\n```scala\n// 订阅多个\
  \ topic，并指定特定的 Kafka 偏移量\nvaldf=spark\n.read\n  .format(\"kafka\")\n  .option(\"\
  kafka.bootstrap.servers\",\"host1:port1,host2:port2\")\n  .option(\"subscribe\"\
  ,\"topic1,topic2\")\n  .option(\"startingOffsets\",\"\"\"{\"topic1\":{\"0\":23,\"\
  1\":-2},\"topic2\":{\"0\":-2}}\"\"\")\n  .option(\"endingOffsets\",\"\"\"{\"topic1\"\
  :{\"0\":50,\"1\":-1},\"topic2\":{\"0\":-1}}\"\"\")\n  .load()\ndf.selectExpr(\"\
  CAST(key AS STRING)\",\"CAST(value AS STRING)\")\n.as[(String, String)]\n```\n\n\
  以下展示了按照模式订阅并指定最早和最后的偏移量：\n\n```scala\n// 按照模式订阅，使用最早和最后的偏移量\nvaldf=spark\n.read\n\
  \  .format(\"kafka\")\n  .option(\"kafka.bootstrap.servers\",\"host1:port1,host2:port2\"\
  )\n  .option(\"subscribePattern\",\"topic.*\")\n  .option(\"startingOffsets\",\"\
  earliest\")\n  .option(\"endingOffsets\",\"latest\")\n  .load()\ndf.selectExpr(\"\
  CAST(key AS STRING)\",\"CAST(value AS STRING)\")\n.as[(String, String)]\n```\n\n\
  ### 2. 消费者缓存\n\n初始化消费者需要时间；因此，使用缓存机制来存储频繁使用的消费者。topic 名称、topic 分区和 group ID 被用缓存键来缓存消费者。\n\
  \n`spark.kafka.consumer.cache.capacity` 决定了池的大小。`spark.kafka.consumer.cache.timeout`\
  \ 是消费者可以空置的时间。如果它空置超过了指定的时间，它将被剔出。\n\n### 3. 将数据写入 Kafka\n\n流式查询和批量查询都可以写入 Kafka。Kafka\
  \ 支持至少一次（at least once）的写入机制，即数据会被写入一次；如果 broker 没有发送确认，则将重新发送。因此，存在重复的可能性。\n\n\
  写入 Kafka 的数据框中必须包含的列有：key、value、headers、topic 和 partition。\n\n### 4. 为流式查询创建 sink\n\
  \n使用以下代码，我们可以将 key 和 value 写入特定的 topic，该 topic 通过 `option()` 函数提供：\n\n```scala\n\
  // 将 DataFrame 中的 key-value 数据写入在 option 中指定的特定 Kafka topic\nvalds=df\n.selectExpr(\"\
  CAST(key AS STRING)\",\"CAST(value AS STRING)\")\n.writeStream\n  .format(\"kafka\"\
  )\n  .option(\"kafka.bootstrap.servers\",\"host1:port1,host2:port2\")\n  .option(\"\
  topic\",\"topic1\")\n  .start()\n```\n\n使用以下代码，将 key value 写入数据中指定的 topic 中：\n\n\
  ```scala\n// 使用数据中指定的 topic 将 DataFrame 中的 key-value 数据写入 Kafka\nvalds=df\n.selectExpr(\"\
  topic\",\"CAST(key AS STRING)\",\"CAST(value AS STRING)\")\n.writeStream\n  .format(\"\
  kafka\")\n  .option(\"kafka.bootstrap.servers\",\"host1:port1,host2:port2\")\n \
  \ .start()\n```\n\n### 5. 将批量查询的输出写入 Kafka\n\n对于批量查询，数据以 key value 形式写入通过 `option()`\
  \ 函数指定的 topic 中。以下代码展示了 `option()` 的用法：\n\n```scala\n// 将 DataFrame 中的 key-value\
  \ 数据写入在 option 中指定的特定 Kafka topic\ndf.selectExpr(\"CAST(key AS STRING)\",\"CAST(value\
  \ AS STRING)\")\n.write\n  .format(\"kafka\")\n  .option(\"kafka.bootstrap.servers\"\
  ,\"host1:port1,host2:port2\")\n  .option(\"topic\",\"topic1\")\n  .save()\n```\n\
  \n对于批量查询，数据以 key value 形式写入通过数据指定的 topic 中。以下代码展示了其用法：\n\n```scala\n// 使用数据中指定的\
  \ topic 将 DataFrame 中的 key-value 数据写入 Kafka\ndf.selectExpr(\"topic\",\"CAST(key\
  \ AS STRING)\",\"CAST(value AS STRING)\")\n.write\n  .format(\"kafka\")\n  .option(\"\
  kafka.bootstrap.servers\",\"host1:port1,host2:port2\")\n  .save()\n```\n\n在上面的章节中，我们学习了创建\
  \ Kafka 源、缓存以及将数据写入 Kafka 的。\n\n## Kafka 和 Spark Streaming 的实现\n\nApache Kafka 提供了发布-订阅系统。生产者发布数据，订阅者消费数据。\n\
  \n*   **链接 (Linking):**\n    链接是集成 Spark 和 Kafka 的过程。这种方法仅支持 Scala/Java。使用以下构组件：\n\
  \    `groupId = org.apache.spark`\n    `artifactId = spark-kafka-0-10_22`\n    `version\
  \ = 3.0.0`\n\n*   **创建直接流 (Creating Direct Stream)**\n    `Record` 对象用于表示数据。每个流被分配一个\
  \ group ID。topic 名称创建在数组中。参数被传递给 `Subscribe()`。\n\n```scala\nimport org.apache.kafka.clients.consumer.ConsumerRecord\n\
  import org.apache.kafka.common.serialization.StringDeserializer\nimport org.apache.spark.streaming.kafka10._\n\
  import org.apache.spark.streaming.kafka10.LocationStrategies.PreferConsistent\n\
  import org.apache.spark.streaming.kafka10.ConsumerStrategies.Subscribe\n\nval kafkaParams\
  \ = MapString, Object\n)\n\nval topics = Array(\"topicA\", \"topicB\")\nval stream\
  \ = KafkaUtils.createDirectStreamString, String\n)\n\nstream.map(record => (record.key,\
  \ record.value))\n```\n\n*   **位置策略 (Location strategies)**\n    Kafka 消费者缓在 Spark\
  \ 的执行器上。常用的策略是 `LocationStrategies.PreferConsistent`。这意味着消费者被均匀分布在执行器上。位置策略允许 `DirectKafkaInputStream`\
  \ 请求 Spark 执行器尽可能靠近 topic 分区的 leader 来执行 Kafka 消费者。当 `DirectKafkaInputStream` 为给定的批次计算\
  \ `KafkaRDD` 时使用了位置策略\n\n*   **消费者策略 (Consumer strategies)**\n    Kafka 消费者 API\
  \ 可以通过多种方式指定 Kafka topic。`ConsumerStrategies.Subscribe` 我们可以订阅预定义的 topic 集合。使用 `assign()`，我们可以提供分区集。`PartitionsConsumerStrategy`\
  \ 是在 Spark Streaming 中创建 Kafka 消费者的合约，允许在创建消费者后对其配置进行自定义。Kafka 消费者和 Kafka 集群中的分区记录。可以使用\
  \ `ConsumerStrategies` 工厂对象访问预定义的消费者策略实现。\n\n*   **部署 (Deploying)**\n    使用 `spark-submit`\
  \ 启动应用程序。`spark-streaming-kafka-0-10_2.11` 及其依赖项应打包在应用程序 JAR 中。`spark-core_2.11`\
  \ 和 `spark-streaming_2.11` 应该标记为提供的依赖项。\n\n\n\n\n\n在本章中，我们学习了 Spark 与 Kafka 的各种集成选项。我们理解了两种集成方法。我们学习了实现\
  \ Kafka 和 Spark 的结构化流处理（structured streaming）。我们为流查询和批量查询创建了 Kafka 源，并理解了消费者缓存的必要性。我们还学习了如何将数据写入\
  \ Kafka，创建了 Kafka 节点（sink），并理解了缓存的必要性。\n\n我们看到了直接流的实现。我们理解了消费者策略和位置策略。讨论了部署步骤。\n\
  \n在下一章中，我们将理解 Apache Kafka 与 Storm 的集成。\n\n### 问题\n\n1. **使用哪种方法创建直接流？**\n    1.\
