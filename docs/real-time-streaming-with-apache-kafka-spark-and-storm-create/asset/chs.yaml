  \ MLOps 和数据分析系统的生产化。\n\n## 关于评审员\n\n**Hossein Narghani** 目前在伊朗德黑兰工作，专注于大数据领域。他在不同规模应用的设计和开发方面拥有十多年的经验。他最新的项目引导他走向更深层次分布式数据工程，在那里广泛使用\
  \ Apache Spark、`Kafka`、`Sqoop`、`Flume`、`Java` 等工具。他在电信和金融行业的大数据解决方案端到端生命周期拥有多年经验。他的专业知识扩展到大数据分析的\
  \ DevOps 和管理方面。他还为许多学生开设了大数据、Hadoop、Apache Spark、Apache Flink、`Flume`、`Pyspark`\
  \ 和 `Kafka` 课程。\n\n## 致谢\n\n我要感谢几位提供支持的人。首先，我要感谢家人在整个旅程中给予的支持。我也感谢 BPB Publications\
  \ 团队给我提供写这本书的机会。如果没有我的父母 Jeyaraman 先生和 Patturani 女士，我的丈夫 Suneet 以及我的孩子 Riaan 和 Riya，我永远无法完成它。\n\
  \n## 前言\n\n本书专注于 Apache Kafka、`Storm` 和 `Spark` 等实时流技术。实时流处理是指与批处理相比，立即处理数据。我们将学习\
  \ `Kafka` 与 `Storm` 以及 `Spark` 的集成。\n\n# 第 1 章\n\n## Kafka 简介\n\n### 引言\n\n随着互联网和数字时代的到来，产生了大量数据。我们有许多应用程序每秒都在生成数据。例如，我们的社交媒体应用包含用户执行的所有活动，导致每天产生大量信息。因此，为了处理这些数据，我们需要实时流工具，它们可以读取并处理数据流。Apache\
  \ Kafka 可以以分布式方式处理实时数据流。在本章中，我们将理解 Apache Kafka 的核心 API，并讨论 Kafka 的各种应用。Kafka 的架构由生产者、消费者、代理（broker）、主题（topics）和分区（partitions）组成。我们将详细描述架构的每个组件。\n\
  \n### 结构\n* Apache Kafka 简介\n* Kafka 与传统消息传递\n* Kafka 架构：生产者、消费者和代理\n* Kafka 架构：主题与分区\n\
  * Kafka 核心 API\n* 使用 Kafka 的优势\n* 使用 Kafka 的应用\n\n### 目标\n* 理解 Apache Kafka 的概念\n\
  * 了解 Kafka 的好处\n* 学习 Kafka 的应用\n* 理解 Kafka 的架构\n* Kafka 内部组件概述\n\n## Apache Kafka\
  \ 简介\n\nApache Kafka 提供发布-订阅系统。生产者发布数据，订阅者消费数据。数据流在几秒内被快速高效地处理。它能够处理实时数据流。流的数据和信息也以容错的方式存储。发送到\
  \ Kafka 的消息存储在多个代理中以确保容错性。Apache Kafka 使用 Scala 和 Java 编写。它是一个开源平台；因此，无需支付许可费用即可使用。\n\
  \n用户可以指定数据存储的时间长度以及需要存储的数据量。在指定的时间长度之后，数据将被清除。Kafka 消息带有时间戳存储在分区中：\n\n![](img/1.1.jpg)\n\
  \n**图 1.1：** Kafka 高级概览\n\n图 1.1 显示了 Kafka 中消息流的高级概览。有 `n` 个生产者产生消息，有 `m` 个消费者消费消息。生产者产生的消息由一个名为\
  \ `topic` 的名称标识，消费者可以从多个主题中消费。这些消息从生产者到消费者的中继及其管理由 zookeeper 完成。\n\n## Kafka 与传统消息队列\n\
  \n以下是传统消息队列和 Kafka 之间的一些区别：\n\n* 在传统消息队列中，消息一旦被读取，就会从队列中移除。但在 Kafka 中，消息在被读取后仍然存在。消息持续的时间持续可以配置。\n\
  \n* 由于 Kafka 消息在被读取后仍持久化在存储中，因此这些消息也可以根据需要进行跟踪、再次读取和重新处理。这种功能在消息队列中是不可能的。\n\n* 在\
  \ Kafka 中，由生产者发布的消息被发布到主题中，订阅者订阅该主题并读取消息。因此，没有传统消息传递中使用的队列。\n\n* Kafka 中的主题包含多个分区；因此，这允许并行处理和高吞吐量。这些概念将在后续章节中详细介绍。传统消息传递不提供这些。\n\
  \n* Kafka 在不同的代理和多个服务器上复制消息；因此，数据的可用性很高，并且具有良好的故障恢复方法。传统消息传递不提供消息复制。\n\n* 负载均衡在\
  \ Kafka 架构内部提供，而在其他队列中则需要在外部配置。\n\n因此，通过上述对比，我们可以理解使用 Kafka 相比传统队列有很多优势。由于这些因素，它被应用于各种场景。\n\
  \n## Kafka 架构：生产者、消费者和代理\n\n图 1.2 显示了 Kafka 的架构。Kafka 架构由 Kafka 集群组成。集群包含多个节点。代理在集群中运行。多个代理共同构成\
  \ Kafka 集群。\n\n在非常高层级，如如下所示，生产者向集群发送消息，消费者消费这些消息。消息也通称为 `records`。\n\nZookeeper\
  \ 被用于管理 Kafka 集群的服务。它负责识别集群中存在的代理状态。每当添加新代理或某个代理不再活动时，它都会通知节点。任何更改都会通过 Zookeeper\
  \ 通知给所有节点。\n\nZookeeper 维护生产者和消费者的数据配额。Zookeeper 跟踪主题的副本，如果某个节点故障，Zookeeper 将使用另一个副本节点。因此，它包含了哪些节点存储不同主题的信息。\n\
  \n对于消费者，Zookeeper 跟踪偏移量（offset）值，这是消费者从分区读取数据时使用的值。\n\n分区\n\n\n\n\n每个 Broker 都包含\
  \ Kafka 主题（Topics）。主题是 Kafka 生产者写入数据的接口。消费者可以订阅某个主题并从中读取数据。许多消费者可以订阅同一个主题。同样，消费者也可以订阅多个主题。\n\
  \n每个 Kafka 主题被划分为多个分区（Partitions）。分区的内容，即记录将在集群中的多个节点上复制。这确保了记录的高可用性，并有助于在记录发生故障或丢失时进行恢复。\n\
  \n每个分区都有一个有序的序列且是不可变的。数据以日志的形式存储在这些分区中。该日志是结构化且有序的。日志中的记录包含序列号，不同的消费者将其用作偏移量（offset）。\n\
  \n其中一个分区被指定为领导（leader）。每当主题接收消息时，记录的写入和读取都通过 leader 进行。每当记录发生变化时，leader 会复制内容并更新副本。如果\
  \ leader 分区由于某种原因失败，副本将被分配为 leader。\n\n![](img/1.3.jpg)\n\n**图 1.3:** 主题与分区\n\n\
  由于许多消费者从主题读取数据，每个消费者都使用偏移量值来跟踪读取过程。在接下来的示例中，在`图 1.4`中，消费者 1 的偏移量为 `3`，消费者 2 的偏移量为\
  \ `6`：\n\n![](img/1.4.jpg)\n\n**图 1.4:** 偏移量操作\n\n因此，当消费者 1 执行读取操作时，使用偏移量值 `3` 并读取随后的记录\
  \ `4`。同样，当消费者 2 从分区读取时，引用偏移量值 `6` 并读取接下来的记录，即 `7`。\n\n# Kafka 核心 API\n\nKafka 拥有以下核心\
  \ API 来支持其关键功能。如`图 1.5`所示，Kafka 集群使用这些 API 与其生产者和消费者通信：\n\n![](img/1.5.jpg)\n\n\
  **图 1.5:** Kafka APIs\n\n*   **Producer API**: 此 API 用于将记录发布到主题。\n*   **Consumer\
  \ API**: 使用消费者 API，消费者可以订阅多个主题并处理写入这些主题的记录。\n*   **Streams API**: 此 API 从输入流中读取记录流并发送到输出流。\n\
  *   **Connector API**: 此 API 用于连接关系型数据库等数据系统到 Kafka 主题。一旦定义了 API，表的更改将发布到主题。\n*\
  \   **AdminClient API**: 此 API 用于支持 broker 和主题的管理。\n\n因此，上述 API 是 Kafka 消息传递的核心，在后面的章节中，我们将看到它们如何被用于消息传递。\n\
  \n# 使用 Kafka 的优势\n\n以下是使用 Kafka 流框架的一些优势：\n\n*   **高可扩展性**: Kafka 可以处理海量数据。由于其架构，它可以很容易地扩展以处理记录。\n\
  *   **容错性**: 由于 Kafka 中的记录在不同的节点和服务器上进行复制，它可以容忍故障。\n*   **低停机时间**: 从 Kafka 获取数据的停机时间较短。\n\
  *   **可靠性**: Kafka 中的记录在不同的节点和服务器上复制，它可以容忍故障。\n*   **高吞吐量**: Kafka 可以处理海量数据。由于其架构，它可以很容易地扩展以处理记录。\n\
  \n# Kafka 的应用\n\n以下是使用 Kafka 的一些应用：\n\n*   **Twitter**: Kafka 用于处理海量的推文流。\n*   **LinkedIn**:\
  \ Kafka 用于实时数据处理。\n*   **Netflix**: Kafka 用于推荐引擎和监控。\n*   **Spotify**: Kafka 用于实时分析。\n\
  *   **Uber**: Kafka 用于追踪和匹配。\n\n### 总结\n\n在本章中，我们学习了 Kafka 的架构。我们还理解了主题和分区及其使用方法。我们看到了\
  \ Kafka 的优势。并提供了 Kafka 的核心 API。下一章将提供安装 Kafka 及其依赖项的步骤。\n\n### 问题\n\n1. **Kafka\
  \ 中哪个组件负责管理从生产者到消费者的消息中继？**\n   a. 集群 Cluster\n   b. Zookeeper\n   c. Broker\n \
  \  d. Stream\n\n2. **以下哪项不是 Kafka 的应用？**\n   a. 流处理\n   b. 构建网站\n   c. 日志聚合\n  \
  \ d. 消息传递\n\n3. **以下哪项不是 Kafka 的优势？**\n   a. 不容错\n   b. 高吞吐量\n   c. 可扩展性\n   d.\
  \ 可靠\n\n4. **哪个 API 从生产者读取消息并发送到消费者？**\n   a. Consumer API\n   b. Connector API\n\
  \   c. Streams API\n   d. Producer API\n\n5. **哪个 API 用于管理 broker 和主题？**\n   a.\
  \ Connector API\n   b. Streams API\n   c. Producer API\n   d. AdminClient API\n\n\
  6. **Kafka 如何确保高可用性？**\n   答：通过在多个节点和集群中对记录进行复制\n\n7. **以下哪项不是 Kafka 架构中的组件？**\n\
  \   a. Admin API\n   b. Brokers\n   c. Producers\n   d. Consumers\n   e. Zookeeper\n\
  \n### 答案\n\n1. b\n2. b\n3. a\n4. c\n5. d\n6. a\n\n# 第 2 章\n\n## 安装 Kafka\n\n###\
  \ 引言\n\n在本章中，我们将学习运行 Kafka 集群所需的软件安装。我们将详细介绍 JDK、Zookeeper 和 Kafka 的安装。设置 Kafka\
  \ 集群对于实现和执行 Kafka 生产者和消费者非常重要。\n\n### 结构\n\n*   安装 JDK\n*   安装 Zookeeper\n*   运行\
  \ Zookeeper\n*   Zookeeper 可配置参数\n*   Apache Kafka 安装\n*   运行 Kafka 服务器\n\n\n\n\n\
  \n### 目标\n\n*   学习在 Windows 中安装 Java\n*   学习在 Windows 中安装和运行 Zookeeper 的过程\n*  \
  \ 理解 Zookeeper 的配置参数\n*   学习在 Windows 中安装 Apache Kafka 的过程\n*   运行 Apache Kafka\
  \ 服务器\n\n### 安装 JDK\n\n在本节中，将提供 JDK 的安装说明，JDK 是 Kafka 消息传递的前决条件。可以按照以下步骤下载并安装软件：\n\
  \n1.  访问 `[`www.oracle.com/technetwork/java/javase/downloads/index.html`](https://www.oracle.com/technetwork/java/javase/downloads/index.html)`\n\
  \n    ![](img/2.1.jpg)\n\n    **图 2.1:** JDK 来源\n\n2.  选择你想安装的 JDK 版本，并如下截图所示点击\
  \ `Download`：\n\n    ![](img/2.2.jpg)\n\n    **图 2.2:** JDK 版本\n\n3.  向下滚动查看适用于不同操作系统的可用安装列表。\n\
  \n4.  点击 `Accept License Agreement`（接受许可协议）。\n\n5.  点击下载列下的安装程序（例如 `jdk-13.0.1_windows-x64_bin.exe`）。\n\
  \n6.  运行下载的软件。\n\n7.  提供安装路径：\n\n    ![](img/2.3.jpg)\n\n    **图 2.3:** JDK 安装路径\n\
  \n8.  点击 `Next` 并等待安装完成：\n\n    ![](img/2.4.jpg)\n\n    **图 2.4:** JDK 安装进度\n\n\
  9.  如下截图所示，将 `JAVA_HOME` 添加到环境变量路径。可以按照此顺序访问：\n\n    `控制面板` | `系统` | `高级系统设置` |\
  \ `环境变量`:\n\n    ![](img/2.5.jpg)\n\n    **图 2.5:** JAVA_HOME 设置\n\n10. 在 `系统变量`中，编辑\
  \ `Path` 变量并如下截图所示添加 `%JAVA_HOME%\\bin`：\n\n    ![](img/2.6.jpg)\n\n    **图 2.6:**\
  \ JAVA_HOME 的 Path 变量\n\n通过上述步骤，JDK 的安装已完成。在下一节中，我们将介绍安装 Zookeeper 的步骤。\n\n### 安装\
  \ Zookeeper\n\nZookeeper 是 Kafka 架构中的一个重要组件。在启动 Kafka 服务器之前，应该配置并运行 Zookeeper。请按照以下步骤安装\
  \ Zookeeper：\n\n1.  访问 URL：`[`zookeeper.apache.org/releases#download`](https://zookeeper.apache.org/releases#download)`\n\
  \n2.  点击 `Download` 超链接：\n\n    ![](img/2.7.jpg)\n\n    **图 2.7:** Zookeeper 源码\
  \ \n\n3.  在此页面上，如下所示点击镜像站点：\n\n    ![](img/2.8.jpg)\n\n    **图 2.8:** Zookeeper\
  \ 安装链接\n\n4.  点击下方图中用黄色高亮的 `zookeeper-3.4.14/` 文件夹：\n\n    ![](img/2.9.jpg)\n\n\
  \    **图 2.9:** Zookeeper 发布版本\n\n5.  点击并下载黄色高亮的 zookeeper：\n\n    ![](img/2.10.jpg)\n\
  \n    **图 2.10:** Zookeeper 版本\n\n6.  导航到包含 `zookeeper-3.4.14.tar.gz` 文件的目录并执行以下命令：\n\
  \n    ```\n    tar -zxf zookeeper-3.4.14.tar.gz\n    ```\n\n    ![](img/2.11.jpg)\n\
  \n    **图 2.11:** 解压命令\n\n7.  这将在 `kafka` 目录下创建一个文件夹：\n\n    ![](img/2.12.jpg)\n\
  \n    **图 2.12:** Zookeeper 目录\n\n8.  进入文件夹 `C:\\kafka\\zookeeper-3.4.14` 并创建一个名为\
  \ `inputdata` 的新文件夹：\n\n    ![](img/2.13.jpg)\n\n    **图 2.13:** Zookeeper 输入数据\n\
  \n9.  打开 `C:\\kafka\\zookeeper-3.4.14\\conf` 内的 `zoo_sample.cfg` 文件。\n\n    为 `dataDir`\
  \ 提供路径。同时，将文件重命名为 `zoo.cfg`。\n\n    ![](img/2.14.jpg)\n\n    **图 2.14:** Zookeeper\
  \ 配置文件\n\n10. 使用以下命令将 Zookeeper 路径添加到环境变量：\n\n    ```\n    setx path \"%PATH%;C:\\\
  kafka\\zookeepr-3.4.14\\bin\"\n    ```\n\n    ![](img/2.15.jpg)\n\n    **图 2.15:**\
  \ 设置 Zookeeper 路径\n\n在本节中，我们学习了如何安装 Zookeeper。详细查看了设置 Zookeeper 的配置。\n\n### 运行 Zookeeper\n\
  \n本节将介绍运行 Zookeeper 的命令。在启动 Kafka 服务器之前，应该配置并运行 Zookeeper。请按照以下步骤安装（注：此处原文应为运行）：\n\
  \n1.  按下以下：\n\n    ```\n    cd C:\\kafka\\zookeeper-3.4.14\n    ```\n\n    ![](img/2.16.jpg)\n\
  \n    **图 2.16:** 启动 Zookeeper\n\n2.  输入 `zkServer`：\n\n    ```\n    zkServer-server.start\n\
  \    ```\n\n    ![](img/2.17.jpg)\n\n    **图 2.17:** 运行 Zookeeper\n\n3.  使用以下命令检查进程正在运行：\n\
  \n    ```\n    ps aux | grep zkServer\n    ```\n\n    ![](img/2.18.jpg)\n\n    **图\
  \ 2.18:** 运行 Zookeeper\n\n在本节中，我们学习了如何安装 Zookeeper。详细查看了设置 Zookeeper 的配置。\n\n###\
  \ Zookeeper 中的可配置参数\n\nZookeeper 有多个可配置的参数。以下是 `config` 文件中使用的部分参数：\n\n| 序号 | 参数\
  \ | 说明 |\n| :--- | :--- | :--- |\n| 1 | `dataDir` | 快照存储在此目录中。 |\n| 2 | `clientPort`\
  \ | 客户端连接的端口。 |\n| 3 | `tickTime` | 一个 tick（滴）的持续时间，这是 zookeeper 使用的单位。 |\n| 4 |\
  \ `initTime` | 节点连接到领导者的持续时间（tick 单位）。 |\n| 5 | `syncLimit` | 客户端与领导者同步的持续时间（tick\
  \ 单位）。 |\n| 6 | `server.x=[name]:port1[:port2]` | zookeeper 多个服务器；`x` 是服务器编号；`name`\
  \ 是主机名；`port1` 用于连接领导者的端口；`port2` 用于选举领导者的端口。 |\n| 7 | `dataLogDir` | 此路径可用于写入对数据库执行的操作日志。\
  \ |\n\n**表 2.1:** Zookeeper 配置参数\n\n上述表格包含了 Zookeeper 的重要参数；可用于相应的用途。配置时需要遵循描述中的语法。\n\
