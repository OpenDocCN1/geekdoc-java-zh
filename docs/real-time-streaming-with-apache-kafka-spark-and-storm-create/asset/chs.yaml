  \n## Kafka 生产者 API\n\n`KafkaProducer` 类包含了 Java 中的 Kafka 生产者函数。它是用于发布消息的 Kafka 客户端。该实例是线程安全的。[表\
  \ 4.1] 显示了类中提供的构造函数和方法：\n\n| 序号 | 方法 | 说明 |\n| :--- | :--- | :--- |\n| 1 | `void\
  \ abortTransaction()` | 取消正在进行的事务。 |\n| 2 | `void beginTransaction()` | 在事务开始之前，必须调用此方法。\
  \ |\n| 3 | `void commitTransaction()` | 提交当前激活的事务。 |\n| 4 | `void initTransactions()`\
  \ | 必须首先调用此方法。 |\n| 5 | `java.util.Map<MetricName,? extends Metric>Metrics()` |\
  \ 返回每个生产者指标。 |\n| 6 | `send(ProducerRecord<K,V> record)` | 异步向主题发送记录。 |\n| 7 | `send\
  \ Of fsets To Transaction()` | 此方法向消费者组发送偏移量。 |\n| 8 | `Close()` | 此方法将关闭生产者。 |\n\
  | 9 | `Flush()` | 缓冲区中的所有记录将被刷新。 |\n\n**表 4.1：** 生产者 API\n\nKafka 类的上述函数将在实现过程中使用。在下一节中，我们将查看\
  \ Java 中 Kafka 生产者的实现。\n\n### Java 中的生产者实现\n\n在本节中，我们用用 Java 实现 `KafkaProducer`，并学习使用\
  \ `ProducerRecord` 对象处理记录。该项目的 `pom.xml` 代码如下：\n\n```xml\n<project xmlns=http://maven.apache.org/POM/4.0.0\
  \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"\
  http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\"\
  >\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>KafkaProject</groupId>\n  <artifactId>KafkaProject</artifactId>\n\
  \  <version>0.0.1-SNAPSHOT</version>\n  <parent>\n    <groupId>org.springframework.boot</groupId>\n\
  \    <artifactId>spring-boot-starter-parent</artifactId>\n    <version>2.0.0.RELEASE</version>\n\
  \    <relativePath/><><!----lookup parent from repository -->\n  </parent>\n  <properties>\n\
  \    <maven-jar-plugin.version>2.6</maven-jar-plugin.version>\n    <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>\n\
  \    <project.reporting.outputEncoding>UTF-8</project.reporting.outputEncoding>\n\
  \    <java.version>1.8</java.version>\n  </properties>\n  <dependencies>\n    <dependency>\n\
  \      <groupId>org.springframework.boot</groupId>\n      <artifactId>spring-boot-starter-web</artifactId>\n\
  \    </dependency>\n    <dependency>\n      <groupId>org.springframework.boot</groupId>\n\
  \      <artifactId>spring-boot-devtools</artifactId>\n      <scope>runtime</scope>\n\
  \    </dependency>\n    <dependency>\n      <groupId>org.springframework.boot</groupId>\n\
  \      <artifactId>spring-boot-starter-test</artifactId>\n      <scope>test</scope>\n\
  \    </dependency>\n    <dependency>\n      <groupId>org.apache.kafka</groupId>\n\
  \      <artifactId>kafka_2.12</artifactId>\n      <version>1.0.1</version>\n   \
  \ </dependency>\n  </dependencies>\n</project>\n```\n\n依赖 `spring-boot-starter-web`\
  \ 包含了 spring boot 的库。`spring-boot-devtools` 依赖提供了当项目文件发生变化时自动重启应用程序的运行时支持。`spring-boot-starter-test`\
  \ 包含了测试 spring boot 应用程序的库。`kafka_2.12` 包含了实现 Kafka 需要的所有库。\n\n以下是 Kafka 生产者的实现：\n\
  \n```java\n//import util.properties packages\nimport java.util.Properties;\n//import\
  \ KafkaProducer packages\nimport org.apache.kafka.clients.producer.KafkaProducer;\n\
  //import ProducerRecord packages\nimport org.apache.kafka.clients.producer.ProducerRecord;\n\
  \npublic class Producer {\n    public static void main(String[] args) throws Exception\
  \ {\n        // 为要产生的消息提供一个主题名称\n        String topicName = \"Test-Kafka5\";\n \
  \       // 创建 Properties 实例以使用属性\n        Properties props = new Properties();\n\
  \        // 将本地 id 分配给服务器属性\n        props.put(\"bootstrap.servers\", \"localhost:9092\"\
  );\n        // 提供批大小\n        props.put(\"batch.size\", 16384);\n        // 当请求失败时，可以重试次数\n\
  \        props.put(\"retries\", 0);\n        // 设置确认机制\n        props.put(\"acks\"\
  , \"all\");\n        // 减少小于值\n        props.put(\"linger.ms\", 1);\n        //\
  \ 是可用的内存总量\n        props.put(\"buffer.memory\", 3355432);\n        // 设置序列化器\n\
  \        props.put(\"key.serializer\", \"org.apache.kafka.common.serialization.StringSerializer\"\
  );\n        props.put(\"value.serializer\", \"org.apache.kafka.common.serialization.StringSerializer\"\
  );\n\n        KafkaProducer<String, String> producer = new KafkaProducer<>(props);\n\
  \n        for (int i = 0; i < 30; i++) {\n            // 使用 send 方法发送消息\n      \
  \      producer.send(new ProducerRecord<>(topicName, Integer.toString(i)));\n  \
  \          System.out.println(\"Sending message: \" + Integer.toString(i));\n  \
  \      }\n        System.out.println(\"All messages have been sent successfully\"\
  );\n        // 关闭生产者实例\n        producer.close();\n    }\n}\n```（注：由于原文中存在大量重复和格式混乱，上述译文已根据提供的核心逻辑内容进行了去重和整理。）\n\
  \n\n\n\n*   **同步发送**：在这种方法中，我们将发送消息并等待确认。使用 `get()` 方法来获取确认，以确定消息是否发送成功。\n\n   \
  \ 语法如下：\n\n```java\n//Create a message\nProducerRecord<String, String>kafkaMessageContent=\
  \ new ProducerRecord<String, String>(\"Kafka topic name\", kafka_key, kafka_message);\n\
  \n//Send the message\nproducer.send(kafkaMessageContent).get();\n```\n\n*   **异步发送**：在这种方法下，调用\
  \ `send` 方法的同时会传入一个 `callback` 回调函数。该 `callback` 函数在消息成功发送后被调用：\n\n```java\n//Create\
  \ a call back class\nCallBackClasscallbackFunction = new CallBackClass();\n\n//Create\
  \ the message\nProducerRecord<String, String>kafkaMessageContent= new ProducerRecord<String,\
  \ String>(\"Kafka topic name\", kafka_key, kafka_message);\n\n//Send the message\n\
  producer.send(kafkaMessageContent, callbackFunction);\n\nprivate static class CallBackClass\
  \ implements Callback {\n  public void onCompletion(RecordMetadatarecordMetadata,\
  \ Exception e) {\n    if (e != null) {\n      System.out.println(\"Error while producing\
  \ message to topic :\" + recordMetadata);\n      e.printStackTrace();\n    } else\
  \ {\n      String message = String.format(\"Message sent to topic:%s partition:%s\
  \ offset:%s\", recordMetadata.topic(), recordMetadata.partition(), recordMetadata.offset());\n\
  \      System.out.println(message);\n    }\n  }\n}\n```\n\n根据使用生产者的应用程序，将使用上述类型中的任何一种。\n\
  \n### 确认类型 (Types of acknowledgments)\n\n发送到发布者的消息需要被确认。三种确认。根据提供的确认类型，发布者将等待代理（broker）的确认：\n\
  \n| 类型 | 描述 |\n| :--- | :--- |\n| `Acknowledgement = 0` | 在这种情况下不会发送确认。生产者不需要等待。\
  \ |\n| `Acknowledgement = 1` | 在这种情况下，由领导（leader）发送确认。副本（replicas）不需要发送确认。 |\n|\
  \ `Acknowledgement = all` | 在这种情况下，代理将检查所有副本是否都已收到发送的消息。当所有副本都收到后，代理将发送确认。 |\n\n\
  **表 4.2：** 确认类型\n\n选择的确认类型取决于系统的设计。\n\n### Kafka 生产者的应用\n\n*   **监控网站活动**：在电子商务平台上，它可以用于处理发生的交易。生产者将发送属于客户执行的购买交易的数据。\n\
  *   **消息传递**：当我们从一个系统发送消息到另一个系统时，这些消息需要被处理；可以使用生产者将它们分组到主题中并相应地发送进行处理。\n*   **日志聚合**：来自\
  \ Web 服务器、数据库系统、服务器日志等各种应用程序生成日志。Kafka 生产者可以用于收集各种应用程序的日志并发送进行消费。\n*   **ETL**：Kafka\
  \ Connect 可读取数据库并将其分组到 Kafka 主题中；这些可以作为数据流产生，用于低延迟处理。\n*   **Twitter 情感分析应用**：当人们发布推文时，生产者可以将这些消息发送到集群。消费者将读取这些消息并将其发送到应用程序以处理推文中的情感。\n\
  *   **欺诈检测系统**：在在线商店中，我们可以将交易（例如客户购买的产品）作为数据由 Kafka 生产者产生。稍后，消费者可以处理这些数据以判断交易是否为欺诈。\n\
  \n上述应用是 Kafka 生产者经常使用的用例。因此，在实时问题解决和架构任何我们遇到的类似用例时，也可以使用 Kafka。\n\n### 结论\n\n在本章中，我们学习了使用\
  \ Kafka 的生产者。介绍了 Java 中 Kafka 消费者的实现。使用生产者的 API 包含了 `send()`。本章通过 Java 实现了 Kafka\
  \ 消费者的实现。展示了发送 Kafka 消息的三种方式。展示了 Kafka 的确认类型。列出了 Kafka 生产者的应用。目标是能够实现 Kafka 消费者\
  \ Java。\n\n在下一章节中，我们将详细介绍 Kafka 消费者的实现。\n\n### 问题\n\n1.  **哪个 API 用于创建生产者？**\n2.\
  \  **生产者可以被多个实例共享吗？生产者是线程安全的吗？**\n3.  **以下哪种发送消息的方法不接收确认？**\n    - 忘记\n    - 异步\n\
  \    - 默认\n4.  **哪种确认类型会等待所有副本收到消息？**\n    - Acknowledgement=1\n    - Acknowledgement\
  \ =0\n    - Acknowledgement = all\n5.  **以下哪项不是 Kafka 生产者的应用？**\n    - 预测系统\n  \
  \  - ETL\n    - 情感分析\n    - 消息传递\n6.  **哪个 API 用于实现 ETL 应用？**\n7.  **在异步发送方法中，哪个函数在消息发送后调用？**\n\
  \n### 回答\n\n1.  `KafkaProducer()`\n2.  是的。\n3.  异步发送\n4.  `Acknowledgement =all`\n\
  5.  预测系统\n6.  `Connect API`\n7.  `callback`\n\n\n\n\nKafka 中的一个主题（topic）被写入多个名为\
  \ `partitions`（分区）的日志。生产者向这些日志的末尾写入，而消费者可以按照自己的速度从这些日志中消费。消息以顺序方式从这些分区中读取。\n\n从不同分区进行读取的原因是为了扩展消费者对数据的消费能力。在`图\
  \ 5.1`中，`Topic A` 存储三个分区中。该主题有两个消费者，`Consumer 1` 和 `Consumer 2`。它们组成了一个消费者组。每个分区被分配给一个消费者进行读取。\n\
  \n消费者组中的每个消费者将获得分区的独占份额。在一个消费者组内，不会有超过一个消费者读取同一个分区。每个组通过其其中一个消费者读取一个分区。这就是消费者组实现负载均衡的方式。\n\
  \n如果分区数量少于消费者组数量，则某些消费者组将保持空闲状态，并在故障转移期间使用。如果分区数量多于消费者组，则少数消费者组可能会从多个分区读取。\n\n每个消费者组对每个分区都有自己的偏移量（offset）。该偏移量可能与其他消费者组不同：\n\
  \n消费者 2\n\n![](img/5.1.jpg)\n\n**图 5.1：** 消费者组\n\n在本节中，我们学习了消费者组以及它们在从分区读取时如何进行负载均衡。将在下一节中查看组遵循的协议。\n\
  \n## 组协调协议\n\n当创建一个消费者组时，需要管理组内的消费者。使用组协调协议来管理消费者。每个组都有一个指定的 broker 被分配为组协调员。该协调员负责管理组的状态。协调员的职责如下：\n\
  \n* 将日志分区分配给消费者进行读取。\n* 如果添加了新消费者，则为其分配分区。\n* 当现有消费者离开时，管理组的状态。\n* 如果主题发生变化，相应地分配分区。\n\
  \n当发生读取操作时，分区内部是顺序读取的。在读取少量记录后，消费者可能会提交已读取的记录。\n\n`图 5.2`显示了一个带有位置的典型分区日志。在`图 5.2`中，`Last\
  \ Committed Offset`（最后提交偏移量）是消费者已提交读取记录的位置。消费者随后继续读取到位置 4，这是其当前的读取点。\n\n在此阶段，发生了故障，消费者被一个新消费者替换，新消费者需要从偏移量\
  \ 2 开始读取，即之前保存的记录。位置 2 和 4 之间的读取记录需要重新读取。\n\n记录也会被复制到其他分区，作为数据复制过程的一部分，以实现数据的高可用性。因此，已保存到其他日志分区的记录位置是高水位点（high\
  \ watermark point）。消费者可以安全地读取到此点，超过此点后如果消费者继续读取，可能会出现一种情况：如果记录丢失，在其他地方将没有它的副本：\n\
  \n![](img/5.2.jpg)\n\n**图 5.2：** 消费者日志及其偏移量\n\n因此，使用该协议，消费者能够协调并以高可用性访问数据。\n\n##\
  \ Kafka 消费者的 API\n\nJava 提供了许多实现 Kafka 消费者的函数。以下是执行其活动所需的 API：\n\n| 序号 | 方法 | 说明\
  \ |\n| :--- | :--- | :--- |\n| 1 | `void assign(Collection<TopicPartition> partitions)`\
  \ | 分区可以手动分配给消费者。 |\n| 2 | `Set<TopicPartition>assignment()` | 获取当前分配给消费者的分区。 |\n\
  | 3 | `void commitAsync()` | 对于 `poll` 命令返回的偏移量，提交主题和分区列表的偏移量。 |\n| 4 | `Map<String,List<PartitionInfo>>listTics()`\
  \ | 列出关于所有主题分区的元数据。 |\n| 5 | `java.util.Map<MetricName,? extends Metric> Metrics()`\
  \ | 这返回每个消费者中存在的指标（metrics）。 |\n| 6 | `ConsumerRecords<K,V>poll(Duration timeout)`\
  \ | 获取订阅的主题或分区的数据。 |\n| 7 | `void subscribe(Collection<String> topics)` | 订阅给定的主题列表。\
  \ |\n| 8 | `void Close()` | 此方法将关闭消费者。 |\n| 9 | `Set<String>subscription()` | 获取当前的订阅。\
  \ |\n| 10 | `void unsubscribe()` | 取消订阅当前订阅的主题。 |\n\n**表 5.1：** Kafka 消费者 API\n\n\
  在本节中，我们简要概述了 Kafka 消费者使用的一组 API。\n\n### Java 中的消费者实现\n\n以下是 Kafka 消费者的 Java 实现：\n\
  \n```java\nimport java.util.Properties;\nimport java.util.Arrays;\nimport org.apache.kafka.clients.consumer.KafkaConsumer;\n\
  import org.apache.kafka.clients.consumer.ConsumerRecords;\nimport org.apache.kafka.clients.consumer.ConsumerRecord;\n\
  \npublic class Consumer {\n    public static void main(String[] args) throws Exception\
  \ {\n        //Kafka 配置设置\n        String topicName=\"Kafka-Topic\";\n        Properties\
  \ props = new Properties();\n        //Kafka 消费者设置\n        props.put(\"bootstrap.servers\"\
  , \"localhost:9092\");\n        //消费者所属的组\n        props.put(\"group.id\", \"kafkroup\"\
  );\n        // 偏移量根据 auto.commit.ms 指定的频率自动提交\n        props.put(\"enable.auto.commit\"\
  , \"true\");\n        // auto.commit.ms 是提交数据的间隔\n        props.put(\"auto.commit.ms\"\
  , \"1000\");\n        // 超时时间\n        props.put(\"session.timeout.ms\", \"30000\"\
  );\n        props.put(\"key.deserializer\", \"org.apache.kafka.clients.serialization.StringDeserializer\"\
  );\n        props.put(\"value.deserializer\", \"org.apache.kafka.clients.serialization.StringDeserializer\"\
  );\n        // 创建消费者实例\n        KafkaConsumer<String, String>consumer = new KafkaConsumer<String,\
  \ String>(props);\n        // Kafka 消费者在此订阅主题列表\n        consumer.subscribe(Arrays.asList(topicName));\n\
  \        // 打印主题名称\n        System.out.println(\"Subscribing to the topic \" + topicName);\n\
  \        while (true) {\n            // 每轮询 10 条记录\n            ConsumerRecords<String,\
  \ String>records = consumer.poll(10);\n            // 遍历轮询记录\n            for (ConsumerRecord<String,\
  \ String>record : records) {\n                // 打印收到的消费者记录的偏移量、键和值\n          \
  \      System.out.printf(\"offset is %d, key is %s, value is %s\\n\",\n        \
  \        record.offset(), record.key(), record.value());\n            }\n      \
  \  }\n    }\n}\n```\n\n\n\n\n\n*   如果消费者没有发送心跳 `forsession.timeout.ms`，它将被认为已死亡，并且它正在读取的分区将被重新分配。\n\
