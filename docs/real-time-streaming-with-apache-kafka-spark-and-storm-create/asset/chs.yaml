  \n# 第 3 章\n\n## Kafka 消息传递\n\n### 引言\n\n在本章中，我们将讨论如何使用生产者发送 Kafka 消息以及如何使用消费者接收\
  \ Kafka 消息。在 Kafka 消息架构中，生产者生成消息，消费者接收这些消息。我们将深入研究 Kafka 代理（brokers）以及分区的使用方法。我们将理解\
  \ Kafka 提供的故障机制。在本章中，我们将学习通过命令行运行 Kafka 消息传递。我们将理解实现多个代理的过程以及如何处理副本的故障。将说明使用 Maven\
  \ 构建在 Java 中实现 Kafka 时安装 Eclipse IDE 和 IntelliJ IDE 的步骤。\n\n### 结构\n\n* Kafka 消息传递的组件\n\
  * 创建 Kafka 主题\n* 删除 Kafka 主题\n* 通过命令行发送和接收消息\n* 创建多个代理\n* 安装和使用 Eclipse 和 Maven\n\
  * 安装 IntelliJ IDE\n\n### 目标\n\n* 理解 Kafka 消息传递的组件\n* 学习创建 Kafka 主题\n* 删除 Kafka 主题的过程\n\
  * 学习通过命令行发送和接收消息。\n* 创建多个代理并观察 zookeeper 的分配\n* 理解如何使用 Eclipse 和 Maven\n* 使用 IntelliJ\
  \ IDE 进行 Kafka 实现\n\n### 消息传递中的组件\n\nKafka 消息系统中有多个组件。这些包括 Kafka 代理和分区。它们构成了消息架构的核心。在下一节中，我们将学习这些组件的功能及其对消息系统的重要性。\n\
  \n### Kafka 代理和 Kafka 分区\n\n下图显示了 Kafka 消息传递的一些重要组件。架构中有多个代理。每个代理都有多个分区（例如，P1、P2\
  \ 等）。当生产者为特定主题生成消息时，内容将存储在这些分区中。在某个代理内部，会有一个领导分区（leader partition），其他分区存储属于该主题的消息。当领导分区故障时，另一个分区将接管成为领导分区。\n\
  \n生产者将始终写入领导分区。然后由领导者决定数据存储和复制的位置。数据可以存储在同一代理的分区或不同代理的分区中。领导者决定副本的位置，从而对从生产者接收的消息进行某种负载均衡：\n\
  \n![](img/3.1.jpg)\n\n**图 3.1:** 代理和分区\n\n如前图所示，代理共同工作以接收生产者发送到某个主题的消息。领导分区在将这些消息路由到所有分区方面起着重要作用。\n\
  \n### Kafka 故障转移\n\n领导分区或副本分区都可能发生。以下是故障的可能性：\n\n* **仅领导者故障**：在这种情况下，Kafka 控制器将从分区池中选择另一个领导者。故障发生后消息处理将出现停机，因为会抛出\
  \ `LeaderNotAvailable` 异常。但一旦选定领导者，消息将继续传输。数据不会丢失。\n* **一个副本故障**：在这种情况下，副本将停止存储消息，并与领导者及其副本不同步。尽管一旦副本分区修复并激活，它将与领导者保持同步。当副本宕机时，消费者将从其他副本获取最新数据。\n\
  * **多个副本故障**：在这种情况下，故障的副本将停止接收生产者的数据。领导者仍然包含数据副本，因此消费者可以从领导者获取。一旦所有副本再次激活，它们将与丢失的所有数据同步。\n\
  * **所有副本故障（包括领导者）**：当包括领导者在内的所有副本故障时，可以修复领导者并激活以重启消息接收过程。领导者将包含它崩溃之前接收的所有数据。激活后，它将继续接收最新消息。另一种方案是从另一个代理中选举另一个领导者，但旧领导者接收的消息将丢失。新领导者将开始接收新数据。\n\
  \n上述场景是 Kafka 消息系统中可能常见的故障转移。\n\n### 创建 Kafka 主题\n\n要创建 Kafka 主题，我们需要提供以下参数：\n\n\
  | 参数 | 说明 |\n| :--- | :--- |\n| Zoo Keeper 实例 | zookeeper 运行的端口。 |\n| 副本因子 | Kafka\
  \ 集群中数据副本的数量 |\n| 分区 | 数据存储的分区数量。 |\n| 主题名称 | 要创建的主题名称。 |\n\n**表 3.1:** 创建 Kafka\
  \ 主题的参数\n\n可以按照以下步骤创建 Kafka 主题：\n\n1.  导航到 `Kafka` 目录。\n\n\n\n\n\n### 2. 执行以下命令：\n\
  \n```\nbin\\windows\\kafka-topics.bat --create --zookeeper localhost:2181 --replication-factor\
  \ 1 --partitions 1 --topic Kafka-Topic\n```\n\n![](img/3.2.jpg)\n\n**图 3.2：** 创建\
  \ Kafka topic\n\n如果 topic 创建成功，你会看到 `Created topic <<Topic name>>`。在这里我们也创建一个单分区，并将副本设置为\
  \ 1。\n\n### 3.要列出所有创建的 topic，使用以下命令：\n\n```\nbin\\windows\\kafka-topics.bat --list\
  \ --zookeeper localhost:2181\n```\n\n![](img/3.3.jpg)\n\n**图 3.3：** 列出所有 Kafka topic\n\
  \n通过上述步骤，我们可以成功创建一个 Kafka Topic 并列出所有创建的 topic。可以通过列出 topic 来确认其已创建。\n\n### 删除 Kafka\
  \ topic\n\n要删除 Kafka topic，请执行以下步骤：\n\n1. 在 `server.properties` 文件中添加 `delete.topic.enable=true`。\n\
  2. 停止 Kafka 服务器。\n3. 重新启动服务器。\n4. 执行以下命令：\n\n```\nbin\\windows\\kafka-topics.bat\
  \ --zookeeper localhost:2181 --delete --topic Test-Kafka5\n```\n\n![](img/3.4.jpg)\n\
  \n**图 3.4：** 删除 Kafka topic\n\n通过上述步骤，我们可以成功删除一个 Kafka topic。删除 topic 后，我们可以列出 Kafka\
  \ topics 来检查其是否已成功删除。\n\n### 通过命令行发送和接收消息\n\n在本节中，我们将学习如何使用 Kafka producer 发送消息。我们将运行\
  \ consumer 来接收这些消息。\n\n### 创建 producer\n\n要发送消息，我们需要创建一个 producer。在命令提示符中打开新窗口并导航到\
  \ `Kafka` 目录。以下命令将 Kafka 服务器运行的端口作为输入，以及消息需要发送到的 topic 名称作为输入：\n\n```\nbin\\windows\\\
  kafka-console-producer.bat --broker-list localhost:9092 --topic Kafka-Topic\n```\n\
  \n![](img/3.5.jpg)\n\n**图 3.5：** 创建 Kafka producer\n\n如上所示，提示符正在等待我们输入消息。在发送消息之前，让我们先创建一个\
  \ consumer。\n\n### 创建 consumer\n\n要创建一个 consumer，需要提供 Kafka 运行的端口和 topic 名称作为输入。在命令提示符中打开新窗口并导航到\
  \ `Kafka` 目录。以下命令创建一个 consumer：\n\n```\nbin\\windows\\kafka-console-consumer.bat\
  \ --bootstrap-server localhost:9092 --topic Kafka-Topic --from-beginning\n```\n\n\
  ![](img/3.6.jpg)\n\n**图 3.6：** 创建 Kafka consumer\n\n参数 `from-beginning` 确保 consumer\
  \ 从头读取属于该 topic 的所有消息。\n\n现在，我们已经在两个独立的窗口中运行了 producer 和 consumer，我们可以在 producer\
  \ 提示符中输入消息，并在 consumer 提示符中查看相同的消息（因为它正被 consumer 读取）。下方的截图演示了这一消息发送过程：\n\n![](img/3.7.jpg)\n\
  \n**图 3.7：** producer 和 consumer 控制台\n\n通过前面的示例，我们已经看到了从 producer 发送 Kafka 消息以及\
  \ consumer 接收消息的过程。\n\n### 创建多个 brokers\n\n在上一节中，我们创建了一个 broker。在这里，我们将创建两个 brokers。因此，我们需要使用以下命令复制服务器配置\
  \ `config`：\n\n```\ncopy config\\server.properties config\\server-broker1.properties\n\
  copy config\\server.properties config\\server-broker2.properties\n```\n\n![](img/3.8.jpg)\n\
  \n**图 3.8：** 复制服务器属性\n\n现在，我们需要用以下内容编辑这些文件的每一个：\n\n* `Broker.id` 必须是唯一的，因此为第一个 broker\
  \ 提供 1。\n* Listeners 必须监听新端口，因此提供一个唯一的端口，例如 `9093`。\n* `log` 目录也必须是唯一的，因此给一个新名称，例如\
  \ `\\logs2`。\n\n下方的截图显示了 `server-broker1.properties` 示例供参考。对于服务器 `1`，`listeners`\
  \ 参数显示如下：\n\n![](img/3.9.jpg)\n\n**图 3.9：** 服务器 1 属性文件：listeners\n\n对应的截图显示了服务器\
  \ `1` 的 `log.dirs` 参数。这里提供了 `log` 目录的路径。消息传递过程中生成的日志将存储在这里：\n\n![](img/3.10.jpg)\n\
  \n**图 3.10：** 服务器 1 属性文件：Log\n\n以类似的方式编辑第二个服务器属性。下方的截图显示了 `server-broker2.properties`\
  \ 的示例配置。对于服务器 `2`，`listeners` 参数显示如下：\n\n![](img/3.11.jpg)\n\n**图 3.11：** 服务器 2\
  \ 属性文件：listeners\n\n对应的截图显示了服务器 `2` 的 `log.dirs` 参数。这里提供了 `log` 目录的路径。消息传递过程中生成的日志将存储在这里：\n\
  \n![](img/3.12.jpg)\n\n**图 3.12：** 服务器 2 属性文件：Log\n\n要启动这两个 brokers，我们将使用以下：\n\n\
  1. 启动 broker 1：\n```\nbin\\windows\\kafka-server.bat config\\server-broker1.properties\n\
  ```\n\n2. 启动 broker 2：\n```\nbin\\windows\\kafka-server.bat config\\server-broker2.properties\n\
  ```\n\n一旦启动启动，我们现在创建一个 topic：\n\n```\nbin\\windows\\kafka-topics.bat --create --bootstrap-server\
  \ localhost:9092 --replication-factor 3 --partitions 1 --topic multi-topic\n```\n\
  \n![](img/3.13.jpg)\n\n**图 3.13：** 创建 Kafka topic\n\n3. 使用 `describe` 参数，我们可以查看使用的使用情况。以下输出显示\
  \ leader 为 0，副本为 0, 2 和 1：\n\n```\nbin\\windows\\kafka-topics.bat --describe --bootstrap-server\
  \ localhost:9092 --topic multi-topic\n```\n\n![](img/3.14.jpg)\n\n**图 3.14：** Broker\
  \ 描述\n\n4. 以下说明了上述输出的含义：\n\n* **Leader**（领导者）：负责读取和写入数据到其他 broker 的分区。\n* **Replicas**（副本）：用于存储数据的活跃分区。\n\
  * **Isr**（同步副本）：同步副本，意味着当前活跃且可处理数据的副本。失败的副本不会列在此处。\n\n5. 为了测试我们的容错性，我们将获取进程 ID 并杀死它。\n\
  \n使用以下命令获取进程 ID：\n\n```\nwmic process where \"caption = 'java.exe' and commandline\
  \ like '%server-broker1.properties%'\" get processid\n```\n\n杀死进程，请使用 `taskkill\
  \ /pid <PID> /f`。\n\n\n\n\n如你从前面的输出所示，同步副本 `isr` 现在仅包含 0 和 2。副本 1 已经被杀死。\n\n###\
