  \n    **答：** `poll()` 方法\n\n# 第 6 章\n\n### Storm 简介\n\n### 引言\n\n在本章中，将介绍 Apache\
  \ Storm。它是一个实时处理器。将描述 Storm 和 Kafka 之间的比较。讨论了 Storm 的架构和核心概念。解释了 Storm 的各种优势。并将简述\
  \ Storm 的应用场景。\n\n### 结构\n\n*   Apache Storm 简介\n*   Storm 与 Kafka 的比较\n*   结合 Hadoop\
  \ 的 Storm\n*   Storm 架构\n*   Storm 的优势\n*   应用\n\n### 目标\n\n*   Storm 简介\n*   Storm\
  \ 与 Kafka 的比较\n*   Storm 与 Hadoop 的比较\n*   Storm 架构概览\n*   理解核心概念\n*   Storm 的优势\n\
  *   应用\n\n### Storm 简介\n\nApache Storm 是一个实时处理系统。它也可以从数据源进行实时数据流处理。由于其设计，它可以处理海量的实时数据。它是开源的，因此可以被中小型企业使用。它易于设置且用户友好，这使其非常适合实时处理开发。它的处理能力类似于\
  \ Hadoop。Storm 的基准是每节点处理百万个元组（tuples）。它的高可靠性保证了数据至少会被处理一次。\n\n### Kafka 与 Storm\
  \ 的比较\n\n虽然 Kafka 和 Storm 都是实时数据处理系统，但目标略有不同。以下是一些区别：\n\n| **Kafka** | **Storm**\
  \ |\n| :--- | :--- |\n| 它用于从数据源读取实时数据流。 | 它读取数据并在数据进行计算并转换。 |\n| 可能会丢失数据，不保证 100%\
  \ 数据安全。 | 它为安全处理数据提供 100% 的保证。 |\n| 它以日志的形式存储在本地文件系统中。 | 它处理并传递给下一个组件；输出可以选择存储在数据库中。\
  \ |\n| 数据直接从原始源读取。 | Storm 可能从其他流应用程序（如 Kafka）读取数据。 |\n| Zookeeper 是 Kafka 运行必需的。\
  \ | Zookeeper 不是必需的。 |\n| Kafka 是容错的，由 Zookeeper 管理。 | Storm 也是容错的，通过守护进程自动重启机制进行自我管理。\
  \ |\n| 由 LinkedIn 开发。 | 由 Twitter 开发。 |\n| 延迟取决于数据源且小于 1-2 秒。 | Storm 的延迟是毫秒级的。\
  \ |\n| 支持多种语言，但在 Java 中效果最好。 | 支持多种语言且在所有语言中表现均良好。 |\n\n**表 6.1：** Kafka 与 Storm\
  \ 比较\n\n通过上述比较，我们可以理解 Kafka 和 Storm 之间的差异特征。\n\n### Hadoop 与 Storm 的比较\n\n\n\n\n\
  \nHadoop 和 Storm 都用于数据计算。以下是它们之间的区别：\n\n| Hadoop | Storm |\n| :--- | :--- |\n| 以批处理进行数据计算。\
  \ | 对实时流式数据进行计算。 |\n| 采用主从架构，以作业和任务的形式存在。可能没有 Zookeeper 来管理实例。 | 架构是主从式的，主节点称为 `Nimbus`，从节点称为\
  \ `supervisors`。使用 `Zookeeper` 来管理集群。 |\n| 它存储并维护状态。 | 它是无状态的。 |\n| 它包含 map/reduce\
  \ 作业，并在所有作业完成后结束。 | 集群一直运行直到用户关闭实例。 |\n| MapReduce 框架的处理时间可能需要几小时或几分钟。 | `storm`\
  \ 中的任务处理需要几秒或毫秒。 |\n| 容易搭建，但操作集群相对复杂。 | 容易搭建且容易使用。 |\n\n表 6.2：Hadoop 和 Storm 的对比\n\
  \n上表说明了 Hadoop 和 Storm 之间的关键区别。\n\n### Storm 的核心组件\n\n以下是 Storm 集群的组件：\n\n*   **节点\
  \ (Nodes)**：一个 `storm` 集群包含两种节点：主节点和工作节点。\n*   **Nimbus**：`Nimbus` 节点是 `Storm` 集群的主节点。`nimbus`\
  \ 守护进程的主要职责是管理、协调和监控在集群上运行的拓扑，包括拓扑部署、任务分配以及故障时的任务重新分配。`Nimbus` 是无状态的，并将所有数据存储在 `Zookeeper`\
  \ 中。\n*   **Supervisor**：这是由工作节点运行的进程。它执行主节点分配给它的任务。一个 `supervisor` 可以拥有多个工作节点。`supervisor`\
  \ 将任务分配给工作节点，并可以拥有完成任务所需的资源。它负责创建、启动和停止工作进程以执行分配给该节点的任务。与 `Nimbus` 类似，`supervisor`\
  \ 进程也是快速失败的，并将所有状态存储在 `Zookeeper` 中，以便其在不丢失任何状态的情况下重启。\n*   **流 (Stream)**：从数据源流入拓扑的数据流包含元组（Tuples）。`Tuple`\
  \ 是 `storm` 集群的组件。这个 `tuple` 包含数据源发送到 `spout` 的数据元素列表。它们是 `Storm` 中的主要数据结构。它们是各种值的命名列表，如整数、字节、浮点数和字节数组。\n\
  *   **Spouts**：从数据源的输入流被发送到 `Spout`。它持续读取数据并在发送到 `bolt` 之前创建元组。例如，它可以从 `Kafka` 消息队列、数据库或文件系统读取。\n\
  *   **Bolts**：`Bolts` 是 `Storm` 中所有逻辑处理的核心；来自 `spout` 的数据被发送到 `bolt` 进行处理。这些 `bolt`\
  \ 可以对数据进行计算。`bolt` 可以将数据发送到另一个 `bolt` 进行进一步处理，或将输出存储在数据库中。\n*   **任务 (Task)**：`task`\
  \ 意味着在 `storm` 集群中以某种形式处理数据。它可以是一个 `spout` 或 `bolt`。尽管拓扑中的组件数量及其任务保持不变，但这些任务的执行器是可以更改的。执行器可能会根据给给\
  \ `bolt` 处理的输入负载而增加或减少。默认情况下，`Storm` 将在一个线程中运行一个任务。\n*   **拓扑 (Topologies)**：一个\
  \ `storm` 拓扑包含 `storm` 组件，即 `spout` 和 `bolts`。它是由多个 spouts 和 bolts 形成的网络。每个组件都会处理数据并将其输出发送到连接的组件；因此，它是一个为了实现目标而组织的由\
  \ spouts 和 bolts 构成的互连网络。\n*   **Zookeeper**：`storm` 集群状态由 `Zookeeper` 维护。`storm`\
  \ 中的守护进程是无状态的。当主节点或从节点发生故障时，它们将重启。\n\n### Apache Storm 架构\n\n`Storm` 的架构由 spouts\
  \ 和 bolts 组成。输入数据由 `spouts` 读取。可能会有很多 spouts 从不同的数据源读取数据。`Bolts` 将处理来自 `spout` 的输出数据元组。bolts\
  \ 可以将其输出发送到另一个 `bolt` 进行更多计算。最后，结果可以存储在数据库或任何持久化存储中：\n\n![](img/6.1.jpg)\n\n图 6.1：Apache\
  \ Storm 架构\n\n上图说明了多个 spouts 和 bolts 之间的交互。这是一个简单的拓扑。\n\n### Storm 的优势\n\n`Storm`\
  \ 的优势如下：\n\n*   **可靠性 (Reliable)**：它具有高可靠性，因为它能快速检测故障，并通过立即替换故障的工作节点来确保每个元组/数据至少处理一次。在故障期间，数据处理可能会发生多次，但数据永远不会被遗漏。\n\
  *   **容错性 (Fault-tolerant)**：如果任何工作节点失败，任务将重新分配到新节点进行处理，因此具有很高的容错性。\n*   **开源 (Open\
  \ source)**：由于软件是开源的，更容易下载和实现我们开发实时分布式处理器所需的组件。它提供的示例和文档对用户友好，可以快速启动开发。\n*   **速度\
  \ (Speed)**：`Storm` 中的数据处理速度极快。它可以在几秒内生成结果。这是 `Storm` 组件设计的关键特征之一。\n*   **可扩展性 (Scalability)**：`Storm`\
  \ 组件可以通过添加更多资源或机器并将任务分配到多台机器来扩展。因此，随着输入负载的增加，很容易扩展由 bolts 执行的处理和计算。\n*   **易于开发\
  \ (Ease of development)**：开发实时流式和处理应用非常耗时。使用 Apache `Storm`，我们很容易为我们的目标构建一个实时分布式应用。\n\
  *   **支持多种编程语言 (Supports multiple programming languages)**：`Storm` 支持任何可以使用封装库实现并与\
  \ `Storm` API 集成的编程语言。\n*   支持数据的实时流式传输\n\n### Storm 的应用\n\n`Storm` 在流处理和计算领域都有应用；以下是它的一些应用：\n\
  \n*   实时分析\n*   在线机器学习\n*   持续计算\n*   分布式 RPC\n*   ETL（提取、转换、加载）\n\n使用 Storm 处理的一些公司包括：\n\
  \n*   **Spotify**：这里提供了音乐流服务，并使用 `storm` 对其进行各种分析。\n*   **Twitter**：为了在发现、实时分析、个性化、搜索、收益优化等范围应用范围内处理每条推文，使用了\
  \ `Storm`。它与 Twitter 的其他基础设施集成，包括数据库系统（Cassandra、Memcached 等）、消息基础设施、Mesos 以及监控/告警系统。\n\
  *   **Groupon**：`Storm` 用于分析、清洗和规范化大量数据。\n*   **Yahoo**：`Storm` 用于处理用户事件、内容馈和应用程序日志。\n\
  *   **淘宝**：这里使用 `Storm` 实时生成日志统计数据。\n*   **阿里巴巴**：这里使用 `Storm` 处理应用程序日志，为其应用程序提供实时统计数据。\n\
  \n### 总结\n\n在本章中，我们理解了 Storm 的架构及其组件。我们学习了 storm、hadoop 和 Kafka 之间的区别。说明了使用 storm\
  \ 的优势。描述了 storm 的应用以及一些使用 storm 的公司。\n\n\n\n\n本章旨在理解使用 Storm 的动机以及 Apache Storm\
  \ 的用途。Kafka 和 Storm 的主要区别在于 Kafka 不对数据流进行计算。Storm 和 Hadoop 之间的区别在于 Hadoop 仅对批数据进行计算，而\
  \ Storm 提供了实时计算能力。\n\n在下一章中，我们将学习下载并安装 Storm 及其依赖项。我们还将设置一个 Storm 集群作为示例。\n\n###\
  \ 问题\n\n1. **哪个系统处理消息的速度更快？**\n    1. Hadoop\n    2. Storm\n    3. Kafka\n\n2. **Storm\
  \ 的哪个组件用于从输入源读取数据？**\n    **答：** Spout\n\n3. **Storm 的哪个组件用于处理数据？**\n    **答：**\
  \ Bolt\n\n4. **拓扑（Topology）可以有多个 spout 吗？(是/否)**\n    **答：** 是\n\n5. **Bolt 可以将其处理后的结果发送给另一个\
  \ bolt 吗？(是/否)**\n    **答：** 是\n\n6. **Kafka 会对其读取的数据进行计算吗？(是/否)**\n    **答：** 否\n\
  \n7. **Storm 是无状态的吗？(是/否)**\n    **答：** 是\n\n### 答案\n\n1. b\n\n# 第 7 章\n\n# Storm\
