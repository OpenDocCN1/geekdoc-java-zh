  \nKafka, spark, integration, spark streaming\n\n# 第 12 章\n\n## Kafka 与 Storm 的集成\n\
  \n### 引言\n\n在本章中，我们将学习构建一个使用 Apache Kafka 和 Storm 的简单应用程序。Apache Kafka 是一个消息系统，消息可以在其中实时处理。Kafka\
  \ 和 Storm 之间集成良好，因为来自 Kafka 的流可以传递到 Storm 集群，使用 Storm 的核心能力处理数据。本章介绍了 Kafka Spouts\
  \ 和 Storm Bolts 的实现，以及它们相互通信以处理消息的方式。实现使用了 Maven 构建和 Eclipse IDE。\n\n### 结构\n\n\
  在本章中，我们将讨论以下主题：\n\n* Kafka-Storm 集成引言\n* 实现 Maven 项目\n* Kafka 和 Storm 的依赖项\n* Storm\
  \ Bolts 的实现\n* 创建拓扑结构（topology）\n* 执行集成流\n\n### 目标\n\n学习本章后，你将学习以下内容：\n\n* 理解 Kafka-Storm\
  \ 集成\n* 学习实现 Kafka Spouts\n* 学习实现一个 Bolt\n* 理解 Spouts 和 Bolts 的拓扑结构\n* 执行项目\n\n\
  ### Kafka-Storm 集成引言\n\nKafka 可以读取数据并将数据发射到 Kafka Spouts，因此成为流的源。Storm 集群中的 Bolts\
  \ 则可以处理这些数据并执行实时流分析。\n\n下面的图显示了 Kafka 和 Storm 的集成。Kafka Spout 从 Kafka 集群读取数据。Storm\
  \ 集群有多个 bolt 组件。Bolts 可以处理数据并将结果存储在 Hadoop HDFS 或数据库中：\n\n![](img/12.1.jpg)\n\n\
  **图 12.1：** Kafka Storm 集成架构\n\n上述集成流可以使用 Java 实现。下一节将展示如何使用 Eclipse IDE 创建项目并实现\
  \ spouts 和 bolts。\n\n### 创建 Maven 项目\n\n在本节中，我们将使用 Eclipse IDE 创建一个 maven 项目。创建项目的步骤如如下节所示：\n\
