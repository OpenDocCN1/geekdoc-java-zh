  ### Spout 实现\n\n在后续节中，我们将查看 spout 的实现。spout 的代码如下：\n\n```java\nTransactionReaderSpout.java\n\
  package TransactionAlertsSystemGrpId.TransactionAlertsSystem;\n\nimport java.util.Map;\n\
  import org.apache.storm.spout.SpoutOutputCollector;\nimport org.apache.storm.task.TopologyContext;\n\
  import org.apache.storm.topology.IRichSpout;\nimport org.apache.storm.topology.OutputFieldsDeclarer;\n\
  import org.apache.storm.tuple.Fields;\nimport org.apache.storm.tuple.Values;\n\n\
  public class TransactionReaderSpout implements IRichSpout {\n    /**\n     *\n \
  \    */\n    private static final long serialVersionUID = 441925018520917L;\n}\n\
  ```\n\n\n\n\n```java\nprivate SpoutOutputCollector collector;\n\n// the customer\
  \ id, timestamp, transaction id and transaction amount\nprivate String[] transactionData\
  \ = {\"CUS1, 2020-03-04,8345,9000\", \"CUS2, 2020-03-04,88345,4000\",\n\"CUS3, 2020-03-04,58345,900\"\
  , \"CUS4, 2020-03-04,48345,300\", \"CUS1, 2020-03-04,83425,3000\",\n\"CUS1, 2020-03-04,18345,4000\"\
  };\nboolean isCompleted;\nString fileName;\n\n@Override\npublic void open(Map conf,\
  \ TopologyContext context, SpoutOutputCollector collector) {\nthis.collector = collector;\n\
  }\n\n@Override\npublic void close() {\n// TODO Auto-generated method stub\n}\n\n\
  @Override\npublic void activate() {\n// TODO Auto-generated method stub\n}\n\n@Override\n\
  public void deactivate() {\n// TODO Auto-generated method stub\n}\n\n@Override\n\
  public void nextTuple() {\nif (!isCompleted) {\nfor (String transaction : transactionData)\
  \ {\nthis.collector.emit(new Values(transaction));\n}\nisCompleted = true;\n} else\
  \ {\nthis.close();\n}\n}\n\n@Override\npublic void ack(Object msgId) {\n// TODO\
  \ Auto-generated method stub\n}\n\n@Override\npublic void fail(Object msgId) {\n\
  // TODO Auto-generated method stub\n}\n\n@Override\npublic void declareOutputFields(OutputFieldsDeclarer\
  \ declarer) {\ndeclarer.declare(new Fields(\"transaction_data\"));\n}\n\n@Override\n\
  public Map<String, Object> getComponentConfiguration() {\n// TODO Auto-generated\
  \ method stub\nreturn null;\n}\n}\n```\n\n上述代码中使用的变量和函数描述如下：\n\n- `transactionData`\
  \ 是包含交易信息的数组。\n- 示例：`CUS1, 2020-03-04,8345,9000` 对应客户 ID、时间戳、交易 ID 和交易金额。\n- `nextTuple()`\
  \ 遍历 `transactionData`并将每条交易发送到下一个步骤。\n- 在 `declareOutputFields()` 中，提供了输出字段的名称，即\
  \ `transaction_data`。\n\n### Bolt 实现\n\n在接下来的部分，我们将查看各种 Bolt 的实现。解析交易的 Bolt 代码如下：\n\
  \n### TransactionParserBolt.java\n\n```java\npackage TransactionAlertsSystemGrpId.TransactionAlertsSystem;\n\
  import java.util.HashMap;\nimport java.util.Map;\nimport org.apache.storm.task.OutputCollector;\n\
  import org.apache.storm.task.TopologyContext;\nimport org.apache.storm.topology.IRichBolt;\n\
  import org.apache.storm.topology.OutputFieldsDeclarer;\nimport org.apache.storm.tuple.Fields;\n\
  import org.apache.storm.tuple.Tuple;\nimport org.apache.storm.tuple.Values;\n\n\
  public class TransactionParserBolt implements IRichBolt {\n    /**\n    *\n    */\n\
  \    private static final long serialVersionUID = -4130092930769665618L;\n    Map\
  \ < String, Integer > counters;\n    Integer id;\n    String name;\n    String fileName;\n\
  \    private OutputCollector collector;\n\n    @Override\n    public void prepare(Map\
  \ stormConf, TopologyContext context, OutputCollector collector) {\n        this.counters\
  \ = new HashMap < ();\n        this.name = context.getThisComponentId();\n     \
  \   this.id = context.getThisTaskId();\n        this.collector = collector;\n  \
  \  }\n\n    @Override\n    public void execute(Tuple input) {\n        String transactionData\
  \ = input.getStringByField(\"transaction_data\");\n        String[] transactionDataArray=transactionData.split(\"\
  ,\");\n        if (transactionDataArray.length==4){\n            this.collector.emit(new\
  \ Values(transactionDataArray[0], transactionDataArray[1], transactionDataArray[3]));\n\
  \        }\n    }\n\n    @Override\n    public void cleanup() {\n    }\n\n    @Override\n\
  \    public void declareOutputFields(OutputFieldsDeclarer declarer) {\n        //\
  \ TODO Auto-generated method stub\n        declarer.declare(new Fields(\"customer_id\"\
  , \"timestamp\",\"transaction_amount\"));\n    }\n\n    @Override\n    public Map\
  \ < String, Object > getComponentConfiguration() {\n        // TODO Auto-generated\
  \ method stub\n        return null;\n    }\n}\n```\n\n在 `execute()` 中，读取了 Bolt 发送的\
  \ `transactionData` 数组。该数据通过 `,` 分割。如果长度为 `4`，意味着所有数据字段都有有效值，则将其被发送到下一个 Bolt。发送到\
  \ Bolt 的值为交易 ID、时间戳和金额。在 `declareOutputFields()` 中，提供了输出字段描述 `new Fields(\"customer_id\"\
  , \"timestamp\",\"transaction_amount\")`。\n\n统计交易数的 Bolt 代码如下：\n\n### TransactionCountTrackerBolt.java\n\
  \n```java\npackage TransactionAlertsSystemGrpId.TransactionAlertsSystem;\nimport\
  \ java.util.HashMap;\nimport java.util.Map;\nimport org.apache.storm.task.OutputCollector;\n\
  import org.apache.storm.task.TopologyContext;\nimport org.apache.storm.topology.IRichBolt;\n\
  import org.apache.storm.topology.OutputFieldsDeclarer;\nimport org.apache.storm.tuple.Fields;\n\
  import org.apache.storm.tuple.Tuple;\nimport org.apache.storm.tuple.Values;\n\n\
  public class TransactionCountTrackerBolt implements IRichBolt {\n    // ... (根据逻辑实现)\n\
  }\n```\n\n告警交易的 Bolt 代码如下：\n\n### TransactionAlertBolt.java\n\n```java\npackage\
  \ TransactionAlertsSystemGrpId.TransactionAlertsSystem;\nimport java.util.HashMap;\n\
  import java.util.Map;\n```\n\n\n\n```java\nimport org.apache.storm.task.OutputCollector;\n\
  import org.apache.storm.task.TopologyContext;\nimport org.apache.storm.topology.IRichBolt;\n\
  import org.apache.storm.topology.OutputFieldsDeclarer;\nimport org.apache.storm.tuple.Fields;\n\
  import org.apache.storm.tuple.Tuple;\nimport org.apache.storm.tuple.Values;\n\n\
  public class TransactionAlertBolt implements IRichBolt {\n    /**\n     *\n    \
  \ */\n    private static final long serialVersionUID = -4130092930769665618L;\n\
  \    Map<String, Integer> counters;\n    Integer id;\n    String name;\n    String\
  \ fileName;\n    OutputCollector collector;\n\n    @Override\n    public void prepare(Map\
  \ stormConf, TopologyContext context, OutputCollector collector) {\n        this.counters\
  \ = new HashMap<>();\n        this.name = context.getThisComponentId();\n      \
  \  this.id = context.getThisTaskId();\n        this.collector = collector;\n   \
  \ }\n\n    @Override\n    public void execute(Tuple input) {\n        String custID\
  \ = input.getString(0);\n        Integer count = input.getInteger(1);\n        Integer\
  \ cumulativeTransactionAmount = input.getInteger(2);\n        if(cumulativeTransactionAmount>1000\
  \ && count>2){\n            System.out.println(\"Alert yes for \"+custID+\" cumulativeTransactionAmount\
  \ \"+cumulativeTransactionAmount.toString()\n            +\" count \"+count.toString());\n\
  \            this.collector.emit(new Values(\"yes\"));\n        }\n    }\n\n   \
  \ @Override\n    public void cleanup() {\n    }\n\n    @Override\n    public void\
  \ declareOutputFields(OutputFieldsDeclarer declarer) {\n        // TODO Auto-generated\
  \ method stub\n        declarer.declare(new Fields(\"alert\"));\n    }\n\n    @Override\n\
  \    public Map<String, Object> getComponentConfiguration() {\n        // TODO Auto-generated\
  \ method stub\n        return null;\n    }\n}\n```\n\n在 `execute()` 方法中，可以使用 `input.getString()`\
  \ 方法访问上一个 bolt 发送的值。如果 `cumulativeTransactionAmount >1000` 且 `count >2`，则会发送警报。此\
  \ bolt 将 \"yes\" 或 \"no\" 作为警报发送。在 `declareOutputFields()` 中，提供了输出字段描述 `declarer.declare(new\
  \ Fields(\"alert\"));`。\n\n### 创建拓扑\n\n在本节中，将详细介绍拓扑的创建。该拓扑集成了我们已经实现的所有上述组件。拓扑的代码如下：\n\
  \n```java\npackage TransactionAlertsSystemGrpId.TransactionAlertsSystem;\nimport\
  \ org.apache.storm.Config;\nimport org.apache.storm.LocalCluster;\nimport org.apache.storm.topology.TopologyBuilder;\n\
  import org.apache.storm.tuple.Fields;\npublic class TransactionAlertTopology {\n\
  \    public static void main(String args[]) {\n        TopologyBuilder builder =\
  \ new TopologyBuilder();\n        builder.setSpout(\"transactions-reader\", new\
  \ TransactionReaderSpout());\n        builder.setBolt(\"transaction_parser\", new\
  \ TransactionParserBolt(), 1).shuffleGrouping(\"transactions-reader\");\n      \
  \  builder.setBolt(\"transaction_count\", new TransactionCountTrackerBolt()).shuffleGrouping(\"\
  transaction_parser\");\n        builder.setBolt(\"transaction_alert\", new TransactionAlertBolt()).shuffleGrouping(\"\
  transaction_count\");\n        Config conf = new Config();\n        conf.setDebug(true);\n\
  \        LocalCluster localCluster = new LocalCluster();\n        localCluster.submitTopology(\"\
  transaction-alert-topology\", conf, builder.createTopology());\n        try {\n\
  \            Thread.sleep(10000);\n            localCluster.shutdown();\n      \
  \  } catch (InterruptedException e) {\n            // TODO Auto-generated catch\
  \ block\n            e.printStackTrace();\n            localCluster.shutdown();\n\
  \        }\n    }\n}\n```\n\n`transactionData` 对象是包含交易信息的数组。使用 `builder.setSpout()`\
  \ 设置 spout。使用 `builder.setBolt()` 函数设置 bolts。所有的 bolt 都是使用上述方法设置。通过以下行创建并提交本地集群拓扑：\n\
  \n`localCluster.submitTopology(\"transaction-alert-topology\", conf, builder.createTopology()).`\n\
