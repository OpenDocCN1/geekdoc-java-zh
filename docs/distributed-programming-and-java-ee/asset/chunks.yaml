    如果你观察我迄为止编写数据库应用程序的方式，最全面的类型系统之一过于 SQL SELECT 语句——至少在正确编写它们方面是如此，JPA 也是一样。要编写和执行
    SELECT 语句，你必须使用一个 `Query` 对象，而 JPA 定义了一种类似于 SQL 的语言，称为 `JPQL`。该语言的语法与 SQL 基本相同，在书中不会对其进行显式处理。当很难正确编写
    SQL SELECT 语句时，是因为它们仅仅是文本，因此编译器无法验证其语法。JPQL 也存在相同的问题，为了帮助解决这个问题，定义了一个名为 `Criteria
    API` 的 API。事实上，使用这个 API 编写 SELECT 语句并不更容易，但 SELECT 表达式的不同部分是使用 Java 类定义的，因此编译器可以验证表达式的编写是否正确。在书中，我将在大部分地方使用此
    `Criteria API`，以下是对其语法的简要介绍。


    该 API 用于定义准则查询（criteria queries），这本质上是一个对象图，你通过构建这样一个图来定义准则查询。这是通过类型为 `CriteriaBuilder`的对象实现的，该对象可以创建准则查询组成的部分，由于它完全关乎表示
    SELECT 语句，这意味着对表、列以及从数据库中提取行的条件进行了面向对象的表示。例如，你可以通过如下形式的语句从 `EntityManager` 获取一个
    `CriteriaBuilder`：


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder();

    ```


    其中 `em` 是一个 `EntityManager`。这样的构建器有三个返回准则查询的方法：


    - `CriteriaQuery<T> createQuery(Class<T>)`

    - `CriteriaQuery<Tuple> createTupleQuery()`

    - `CriteriaQuery<Object> createQuery()`


    区别在于查询返回的对象类型。在拥有了创建查询的准则构建器后，任务是初始化这个查询，而这正是 API 发挥用场的地方。


    我想从上述第一个方法开始，该方法创建一个查询，其中参数类型指示了查询结果的预期对象类型，原则上它可以是任何任意对象类型。例如，下面显示了一个准则查询，用于确定图库数据库中所有页码值为
    520 的书：


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<Book> cq = cb.createQuery(Book.class);
    Root<Book> root = cq.from(Book.class); cq.select(root); cq.where(cb.equal(root.get(Book_.pages),
    520)); return em.createQuery(cq).getResultList();

    ```


    注意如何创建 `CriteriaBuilder`（`em` 是一个 `EntityManager`）以及如何使用它为 `Book` 对象创建准则查询。对于此查询，为对象图创建了一个
    `root`，并定义查询对象必须从此根提取对象。`root` 随后对应于 SQL SELECT 语句中的 FROM 部分。接下来，通过 `select()`
    方法定义哪些属性是结果的一部分，这里是根，意味着 `Book` 对象。因此，`select()` 函数指示了要包含哪些列。最后，定义了必须仅在页码为 520
    时提取对象，因此对应于 SELECT 语句中的 WHERE 部分。结果是这些对象的集合。你特别应该注意如何引用列 `pages`（`Book` 类中的属性
    `pages`）。该查询也可以写写所示：


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<Book> cq = cb.createQuery(Book.class);
    Root<Book> root = cq.from(Book.class); return em.createQuery(cq.select(root).where(cb.equal(root.get("pages"),
    520))).getResultList();

    ```


    它除了稍微短一点外没有特殊优势，因此它看起来更像是一个 SQL SELECT 语句。然而，你必须注意我以另一种方式定义了列（pages），即作为字符串，这应该是
    `Book` 类中该属性的名称。


    如果你查看代码，可以发现准则查询对象具有以下方法：


    - `from()`

    - `select()`

    - `where()`


    其含义从 SELECT 语句中是广为人知的，如果你检查 `CriteriaQuery` 类型，你会发现还有用于 SELECT 的其他部分的方法，如 `ORDER
    BY`、`GROUP BY` 等。最后，你可以注意到 `CriteriaBuilder` 类除了创建 `CriteriaQuery` 对象外，还有定义条件——谓词（predicates）——的方法以及许多其他方法（在上面的示例中使用了
    `equals`），在下面展示了其中几个示例。


    作为另一个例子，下面的查询确定了所有书的页码，其中标题包含文本 "Fedora"：


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<Integer> cq = cb.createQuery(Integer.class);
    Root<Book> root = cq.from(Book.class); cq.select(root.get(Book_.pages)); cq.where(cb.like(root.get(Book_.title),
    "%Fedora%")); List<Integer> pages = em.createQuery(cq).getResultList();

    ```


    作为进一步的示例，显示了一个确定书中最大页码的查询，你应该首先注意到准则构建器支持多个函数（这里是 `max` 函数），并且由 `getSingleResult()`
    而不是 `getResultList()` 决定：


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<Integer> cq = cb.createQuery(Integer.class);
    Root<Book> root = cq.from(Book.class); cq.select(cb.max(root.get(Book_.pages)));
    Integer pages = em.createQuery(cq).getSingleResult();

    ```


    或者更短的：


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<Integer> cq = cb.createQuery(Integer.class);
    Integer pages = em.createQuery(cq.select(cb.max(cq.from(Book.class).get("pages")))).getSingleResult();

    ```


    我随后将通过一些示例展示如何确定特定列（即实体类中特定属性）的值。下一个查询确定页码大于 300 的所有 Book 对象的 id 和标题：


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<Object[]> cq = cb.createQuery(Object[].class);
    Root<Book> root = cq.from(Book.class); Path<Integer> idPath = root.get(Book_.id);
    Path<String> titlePath = root.get(Book_.title);

    ```

