  trans: "\n如果你点击“高级”（Advanced），你会看到以下选项（这是一个警告）：\n\n![](img/00251.jpeg)\n\n如果你点击该按钮，将会收到另一个警告：\n\
    \n![](img/00252.jpeg)\n\n点击最后一个按钮就意味着你已经接受了该不安全的证书，随后会弹出常规的登录窗口。如果你关闭浏览器并重新打开程序，将不会再看到上述警告，登录窗口将立即打开。\n\
    \n你需要注意，如果你通过常规方式输入地址打开程序：\n\n`http://localhost:8080/SecurityApp1/`\n\n将会显示所示的登录窗口。也就是说，地址被自动重定向到了\
    \ HTTPS 协议和 8181 端口：\n\n![](img/00253.jpeg)\n\n![](img/00254.jpeg)7.3![](img/00255.jpeg)[](images/00256.jpeg)[](images/00257.jpeg)[](images/00258.jpeg)[](images/00259.jpeg)[](images/00260.jpeg)[](images/00261.jpeg)[](images/00262.jpeg)[](images/00263.jpeg)\n\
    \n## 表单认证 (FORM AUTHENTICATION)\n\n在上面的示例中，是由浏览器显示登录窗口，这在原理上很好，但你也可以编写自己的登录表单。这样做至少有两个理由，包括你可以决定表单的外观，它还允许你实现注销功能。在下面的示例中，我将展示如何实现，但首先我会修改程序本身。\n\
    \n介绍性项目包含三个 HTML 页面，但在实践中它们将是带有后端豆（backing beans）的 JSF 页面，这需要一些更改。与之前的项目相比，`SecurityApp2`\
    \ 项目增加了两个新的 JSF 页面，此外，原始三个页面也被改为 JSF 页面：![](img/00264.jpeg)\n\n错误页面非常简单，仅由文本和指向\
    \ `login.xhtml` 的链接组成，当你输入未找到的用户或错误的密码时，就会使用该页面。示例中最重要的部分是 `login.xhtml` 页面：\n\
    \n```xml\n<?xml version='1.0' encoding='UTF-8' ?>\n<!DOCTYPE html PUBLIC \"\"\
    \ \">\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xmlns:h=\"http://xmlns.jcp.org/jsf/html\"\
    >\n<h:head>\n<title>Facelet Title</title>\n</h:head>\n<h:body>\n<h2>Enter username\
    \ and password</h2>\n<form method=\"POST\" action=\"j_security_check\">\n<table\
    \ cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n<tr>\n<td align=\"right\"\
    >Username:&nbsp;</td>\n<td><input type=\"text\" name=\"j_username\"/></td>\n</tr>\n\
    <tr>\n<td colspan=\"2\" style=\"height:10px\"></td>\n</tr>\n<tr>\n<td align=\"\
    right\">Password:&nbsp;</td>\n<td><input type=\"password\" name=\"j_password\"\
    /></td>\n</tr>\n<tr>\n<td colspan=\"2\" style=\"height:20px\"></td>\n</tr>\n<tr>\n\
    <td></td>\n<td><input type=\"submit\" value=\"Login\"/></td>\n</tr>\n</table>\n\
    </form>\n</h:body>\n</html>\n```\n\n这是一个 JSF 页面，但没有使用任何 JSF 元素，特别是 `form` 元素不能\
    \ `h:form` 元素，这一点很重要。在这里你需要注意 `action` 属性，它指向 `j_security_check`，这指定了应用程序执行的代码。由于相同的原因，两个输入字段必须命名为\
    \ `j_username` 和 `j_password`。\n\n使用表单认证的最后一步是修改 `web.xml`，将 `login-config` 元素更改如下：\n\
    \n```xml\n<login-config>\n<auth-method>FORM</auth-method>\n<realm-name>file</realm-name>\n\
    <form-login-config>\n<form-login-page>/faces/login.xhtml</form-login-page>\n<form-error-page>/faces/error.xhtml</form-error-page>\n\
    </form-login-config>\n</login-config>\n```\n\n当你打开应用程序时，你会看到下面的窗口，在其中输入用户名和密码。在这种情况下，这是一个非常简单的表单，但你当然可以修改\
    \ `login.xhtml`，从而获得一个符合当前应用程序的更漂亮的设计。注意地址栏显示正在使用安全的互联网连接。\n\n![](img/00265.jpeg)\
    \ ![](img/00266.jpeg)[](images/00267.jpeg)输入用户名和密码后，你将进入 `index.xhtml`：\n\n![](img/00268.jpeg)\n\
    \n窗口看起来有点不同，但确保有一个注销链接很重要。如上述，该页面有一个托管豆（managed bean）：\n\n```java\npackage securityapp.beans;\
    \ import javax.inject.Named;\n\nimport javax.enterprise.context.SessionScoped;\
    \ import java.io.Serializable;\n\n@Named(value = \"indexBean\")\n@SessionScoped\n\
    public class IndexBean implements Serializable\n{\n    public String admin()\n\
    \    {\n        return \"admin/start?faces-redirect=true\";\n    }\n    public\
    \ String enter()\n    {\n        return \"enter?faces-redirect=true\";\n    }\n\
    }\n```\n\n这两个动作方法除了除了重定向到 `start.xhtml` 和 `enter.xhtml` 页面（在点击其中一个按钮时发生）之外不应该做任何事情。当\
    \ JSF 页面执行动作时，它是通过 POST 方法执行的，执行的不是重定向，而是转发（forward）。因此，用户角色不会通过验证（或者只有在你再次离开页面时才会进行验证）。为了解决这个问题（让应用程序像之前的应用程序一样工作），如上所述，你必须强制重定向。\n\
    \n点击注销链接，会调用 `LogoutBean.java` 托管豆中的 `logout()` 方法：\n\n```java\npackage securityapp.beans;\
    \ import javax.inject.Named;\n\nimport javax.enterprise.context.RequestScoped;\n\
    \nimport javax.faces.context.*; import javax.servlet.http.*;\n\n@Named(value =\
    \ \"logoutBean\") @RequestScoped\n```\n"
