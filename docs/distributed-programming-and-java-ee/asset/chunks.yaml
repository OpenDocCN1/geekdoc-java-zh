    ## 序言


    本书是软件开发系列书籍中的第十三本。编程语言是 `Java`，该语言及其语法和语义涵盖了大量内容，但这些书籍很大程度上关注流程以及如何开发良好且健壮的应用程序。本书是
    `Java 11`内容的延续，但重点是企业级应用的开发。这些程序使用托管在不同计算机、位于不同位置的组件或服务执行工作，并通过网络进行通信和协调工作。主要主题是
    `Java EE` 技术。

    '
- fmt: "\nIn the previous two books, I have been working on developing web applications,\
    \ and this book is a natural continuation, but focusing on the development of\
    \ distributed programs. They are programs that perform their work using components\
    \ or services hosted on different computers, which communicate and coordinate\
    \ their work over a network. The whole idea is that these components largely have\
    \ their own lives and live independently of each other and generally without knowing\
    \ the clients who uses the services they provide. In fact, it is not easy to precisely\
    \ define what we understand with a distributed program, but typically we will\
    \ understand a program that is characterized by:\n\n1. that there are several\
    \ independent computing units (computers), each of which has their own local memory.\n\
    2. the computing units communicate by sending messages to each other over a network.\n\
    \nThe goal of a distributed program (or system) may be to solve a particular task,\
    \ and users will then perceive the family of computing units as a single device\
    \ (or system), but instead, they may be a service-oriented system that offers\
    \ a range of services which users can use and perceive as shared resources. Distributed\
    \ programs will also be characterized by parallelity, where multiple activities\
    \ are performed simultaneously on multiple computers and locations.\n\nYou can\
    \ also sometimes see distributed programming described as a further development\
    \ of object-oriented programming. An object-oriented program consists of objects\
    \ with each of their internal data and logic hidden from the outside world and\
    \ only known through the services that the object makes available in the form\
    \ of public methods. These objects then work together to solve the task to be\
    \ solved. Similarly, you can see a distributed program as a program that solves\
    \ the task by providing a number of services that live independently of each other\
    \ on computers around the world where applications can use them if they otherwise\
    \ will be allowed.\n\nIn addition to showing how to develop distributed programs\
    \ in practice (or perhaps more in relation to this), the goal is also to describe\
    \ more specific technologies as in headings are:\n\n- `Java Persistence API`\n\
    - `Java Enterprise Beans`\n- `Contexts and Dependency Injection`\n- `Java Web\
    \ Services`\n- `RESTFul web services`\n- `Java EE security`\n\nAs it appears,\
    \ the book describes a number of `Java APIs`, and much of the substance is directly\
    \ related to `NetBeans` and `GlassFish`.\n\n# 2 JAVA PERSISTENCE API\n\nIn the\
    \ previous books (from `Java 6` onwards) and including `Java 11` on web applications,\
    \ I have considered several examples that uses databases. It has always included\
    \ programming an object oriented encapsulation of the database in the form of\
    \ model classes for each of the database tables and one or more classes that encapsulates\
    \ the `SQL` statements that will manipulate the content of the relational database.\
    \ This has meant that for each example, many lines have been required to write\
    \ the Java code, and although it may be affordable, as it is in principle the\
    \ same thing that should happen every time, it can be done easier (and better),\
    \ as `Java EE` offers an API called `Java Persistence API`, which has the exact\
    \ task of offering an object-oriented interface to a relational database. The\
    \ aim of this chapter is to give an introduction to this API, and the content\
    \ largely characterizes “how to do”.\n\nI will start with a copy of the project\
    \ `ChangeAddress3` from the book `Java 11`, where I have called the copy `ChangeAddress1`.\
    \ If you open the application in the browser, you get the following window...\
    \ [clicking on the bottom link], you get another window that shows an overview\
    \ of the addresses that were entered.\n\n![](images/00005.jpeg)\n\nWhen entering\
    \ addresses, they are stored in a list of `Person` objects. However, data is not\
    \ stored persistently. As I have shown in previous examples, it is relatively\
    \ simple to create a database with a table, and then save data in this table.\
    \ In this example, I will show you how to do it using `JPA`.\n\nIn this example,\
    \ I want to use `JavaDB` as database product. Primarily to show this database,\
    \ since it is useful and easy to use in many contexts where you need a simple\
    \ database. It is a standard `SQL` database server, supported by the `Glassfish`\
    \ server, which does not require any special installation, and the product is\
    \ also supported by `NetBeans`.\n\nThe method is basically defining an entity\
    \ class for each database table, and I would like to start by associating a class\
    \ to the `model` package. It must be an `Entity Class`:\n\n![](images/00006.jpeg)\n\
    \nand it should be called `Address`:\n\n![](images/00007.jpeg)\n\nYou should note\
    \ that the correct package name has been selected (can be entered if it is not\
    \ in the list) and that the `Create Persistence Unit` has been ticked. A persistence\
    \ unit is an XML configuration file called `persistence.xml`, created by `NetBeans`.\
    \ When you click `Next` in the window above, you get a window to initialize this\
    \ XML file. You can change the name if you wish, and note that `Use Java Transaction\
    \ APIs` have been ticked. By default, `Create` has been selected, which means\
    \ that the database must be created if it is not already.\n\n![](images/00008.jpeg)\n\
    \nHowever, the most important is the `Data Source` field, which is a reference\
    \ to the current database. Here you can choose an existing `data source`, or you\
    \ can create a new one:\n\n![](images/00009.jpeg)\n\nIf you click on `New Data\
    \ Source`, you get a window to create a data source:\n\n![](images/00010.jpeg)\n\
    \nwhere I have entered the name `addresses`. A connection to the database must\
    \ also be defined. Here you can either choose an existing one or create a new\
    \ one. In this case, you must create a new one, and choose a driver where I have\
    \ selected `Java DB (Network)`:\n\n![](images/00011.jpeg)\n![](images/00012.jpeg)\n\
    ![](images/00013.jpeg)\n\nWhen clicking `Next`, enter information about the database:\n\
    \n![](images/00014.jpeg)\n\nThe database server – the `Glassfish` server – runs\
    \ on `localhost` and uses `1527` as port number. I have chosen that the database\
    \ should be called `addresses`. `Java DB` has a default user called `APP`, and\
    \ I have entered a password (1234). Then I click `Next` twice and finally `Finish`,\
    \ after which the data source has been created:\n\n![](images/00015.jpeg)\n\n\
    When I click `OK`, the `Entity class class is created:\n\n![](images/00016.jpeg)\n\
    \nand then I click `Finish`, `NetBeans` has created the following class (where\
    \ I have removed comments and modified `equals()` a bit):\n\n```java\npackage\
    \ changeaddress.models;\n\nimport java.io.Serializable;\nimport javax.persistence.*;\n\
    \n@Entity\npublic class Address implements Serializable\n{\n    private static\
    \ final long serialVersionUID = 1L; \n    @Id\n    @GeneratedValue(strategy =\
    \ GenerationType.AUTO) \n    private Long id;\n\n    public Long getId()\n   \
    \ {\n        return id;\n    }\n\n    public void setId(Long id)\n    {\n    \
    \    this.id = id;\n    }\n\n    @Override\n    public int hashCode()\n    {\n\
    \        int hash = 0;\n        hash += (id != null ? id.hashCode() : 0);\n  \
    \      return hash;\n    }\n\n    @Override\n    public boolean equals(Object\
    \ object)\n    {\n        if (!(object instanceof Address)) return false; \n \
    \       return id.equals(((Address)object).id);\n    }\n\n    @Override\n    public\
    \ String toString()\n    {\n        return \"changeaddress.models.Address[ id=\"\
    \ + id + \" ]\";\n    }\n}\n```\n"
  raw: 'In the previous two books, I have been working on developing web applications,
    and this  book is a natural continuation, but focusing on the development of distributed
    programs.    They are programs that perform their work using components or services
    hosted on different computers, which communicate and coordinate their work over
    a network.  The whole idea is that these components largely have their own lives
    and live independently of each other  and generally without knowing the clients
    who uses the services they provide. In fact, it is   not easy to precisely define
    what we understand with a distributed program, but typically     we  will  understand  a  program  that  is  characterized  by


    1. that  there  are  several  independent  computing  units  (computers),  each  of  which  has
    their own local  memory


    2. the  computing  units  communicate  by  sending  messages  to  each  other  over  a  network


    The goal of a distributed program (or system) may be to solve a particular task,
    and users  will then perceive the family of computing units as a single device
    (or system), but instead,  they may be a service-oriented system that offers a
    range of services which users can use and perceive as shared resources. Distributed
    programs will also be characterized by parallelity,  where  multiple  activities  are  performed  simultaneously  on  multiple  computers  and  locations.


    You  can  also  sometimes  see  distributed  programming  described  as  a  further  development  of
    object-oriented programming. An object-oriented program consists of objects with
    each of their internal data and logic hidden from the outside world and only known
    through the services that the object makes available in the form of public methods.  These
    objects then work together to solve the task to be solved. Similarly, you can
    see a distributed program as  a  program  that  solves  the  task  by  providing  a  number  of  services  that  live  independently
    of each other on computers around the world where applications can use them if
    they otherwise will be  allowed.


    In addition to showing how to develop distributed programs in practice (or perhaps
    more       in  relation  to  this),  the  goal  is  also  to  describe  more  specific  technologies  as  in  headings  are


    -Java Persistence API


    -Java Enterprise Beans


    -Contexts and Dependency  Injection


    -Java Web Services


    -RESTFul web services


    -Java EE security


    As it appears, the book describes a number of Java APIs, and much of the substance
    is  directly  related  to  NetBeans  and  GlassFish.


    2 JAVA PERSISTENCE  API


    In the previous books (from Java 6 onwards) and including Java 11 on web applications,
    I have  considered  several  examples  that  uses  databases.  It  has  always  included  programming
    an object oriented encapsulation of the database in the form of model classes
    for each of the database tables and one or more classes that encapsulates the
    SQL statements that will manipulate the content of the relational database.  This
    has meant that for each example, many lines have been required to write the Java
    code, and although it may be affordable, as it is in principle the same thing
    that should happen every time, it can be done easier (and  better)  ,  as  Java  EE  offers  an  API  called  Java  Persistence  API,  which  has  the  exact  task
    of offering an object-oriented interface to a relational database.  The aim of
    this chapter is  to  give  an  introduction  to  this  API,  and  the  content  largely  characterizes  “how  to  do”.


    I will start with a copy of the project  ChangeAddress3  from the book Java 11,
    where I have called the copy  ChangeAddress1. If you open the application in the
    browser, you get the following window, where you can to enter an address, and
    if you click on the bottom link,  you  get  another  window  that  shows  an  overview  of  the  addresses  that  were  entered.


    ![](images/00005.jpeg)


    When entering addresses, they are stored in a list of  Person  objects. However,
    data is not stored persistently. As I have shown in previous examples, it is relatively
    simple to create


    a database with a table, and then save data in this table. In this example, I
    will show you    how  to  do  it  using  JPA.


    In  this  example,  I  want  to  use  JavaDB  as  database  product.  Primarily  to  show  this  database,
    since it is useful and easy to use in many contexts where you need a simple database.
    It is a standard SQL database server, supported by the Glassfish server, which
    does not require any  special  installation,  and  the  product  is  also  supported  by  NetBeans.


    The method is basically defining an entity class for each database table, and
    I would like      to  start  by  associating  a  class  to  the  model  package.  It  must  be  an  Entity  Class:


    ![](images/00006.jpeg)


    and it should be called  Address:


    ![](images/00007.jpeg)


    You should note that the correct package name has been selected (can be entered
    if it is      not in the list) and that the  Create Persistence Unit  has been
    ticked. A persistence unit is an XML  configuration  file  called  persistence.xml,  created  by  NetBeans.  When  you  click  Next  in
    the window above, you get a window to initialize this XML  file. You can change
    the name if you wish, and note that  Use Java Transaction APIs  have been ticked.
    By default,  Create  has  been  selected,  which  means  that  the  database  must  be  created  if  it  is  not  already.


    ![](images/00008.jpeg)


    However, the most important is the  Data Source field, which is a reference to
    the current  database. Here you can choose an existing data source, or you can
    create a new one:


    ![](images/00009.jpeg)


    If you click on  New Data Source, you get a window to create a data source:


    ![](images/00010.jpeg)


    where  I  have  entered  the  name  addresses.  A  connection  to  the  database  must  also  be  defined.
    Here you can either choose an existing one or create a new one. In this case,
    you must create a new one, and choose a driver where I have selected  Java DB  (Network):


    ![](images/00011.jpeg)


    ![](images/00012.jpeg)<map name="awmap2" class="calibre1"><area shape="rect" href="http://www.deloitte.ca/careers"
    coords="120, 426, 310, 444" class="calibre39"></map>![](images/00013.jpeg)When
    clicking Next, enter information about the database:


    ![](images/00014.jpeg)


    The database server –  the Glassfish server –  runs on localhost and uses 1527
    as port number.   I  have  chosen  that  the  database  should  be  called  addresses.  Java  DB  has  a  default  user  called


    APP, and I have entered a password (1234).  Then I click  Next  twice and  finally  Finish,
    after which the data source has been created:


    ![](images/00015.jpeg)


    When I click  OK, the Entity class is created:


    ![](images/00016.jpeg)


    and then I click  Finish, NetBeans has created the following class (where I have
    removed comments and modified  equals()  a  bit):


    package changeaddress.models;


    import java.io.Serializable; import javax.persistence.*;


    @Entity


    public class Address implements Serializable


    {


    private static final long serialVersionUID = 1L; @Id


    @GeneratedValue(strategy = GenerationType.AUTO) private Long id;


    public Long getId()


    {


    return id;


    }


    public void setId(Long id)


    {


    this.id = id;


    }


    @Override


    public int hashCode()


    {


    int hash = 0;


    hash += (id != null ? id.hashCode() : 0);


    return hash;


    }


    @Override


    public boolean equals(Object object)


    {


    if (!(object instanceof Address)) return false; return id.equals(((Address)object).id);


    }


    @Override


    public String toString()


    {


    return "changeaddress.models.Address[ id=" + id + " ]";


    }'
