    \ `book` 表和 `author` 表之间的多对多关系。特别地，你应该意识到 `BookJpaController` 类处理了更新数据库所需的所有内容，包括在连接\
    \ `INSERT`、`UPDATE` 和 `DELETE` 操作时维护关系。实际上，正是在这里你体会到了 JPA 的巨大优势，否则正如之前之前的书籍中的示例所示，需要编写大量的代码。此外，应该补充一点，`JPA`\
    \ 甚至是极其有效的。\n\n### 问题 1\n\n数据库 `padata` 包含三个表：\n\n1. `world`，包含该世界的大洲名称。\n2. `currency`，包含一个货币表。\n\
    3. `country`，包含相关信息。\n\n任务是编写一个 Web 应用程序，当使用 JPA 执行数据库操作时能够维护这些表。应用程序必须包含三个页面。起始页面应如下所示，仅显示几个国家：\n\
    \n```sql\ncreate table world (\n    code char(2) PRIMARY KEY,\n    name varchar(15)\
    \ NOT NULL\n);\n\ncreate table currency (\n    code char(3) PRIMARY KEY,\n   \
    \ name varchar(30) NOT NULL,\n    rate decimal(10,4)\n);\n\ncreate table country\
    \ (\n    code char(2) PRIMARY KEY,\n    name varchar(50) NOT NULL,\n    area int,\n\
    \    number int,\n    continent char(2) REFERENCES world(code),\n    currency\
    \ char(3) REFERENCES currency(code)\n);\n\ninsert INTO world VALUES('AS', 'Asia');\n\
    insert INTO world VALUES('AF', 'Africa');\ninsert INTO world VALUES('NA', 'North\
    \ America');\ninsert INTO world VALUES('SA', 'South America');\ninsert INTO world\
    \ VALUES('AN', 'Antarctica');\ninsert INTO world VALUES('EU', 'Europe');\ninsert\
    \ INTO world VALUES('OC', 'Oceania');\n```\n\n工程的力量\n\n![](img/00070.jpeg)\n\n\
    ![](img/00071.jpeg)50\n\n![](img/00072.jpeg)\n\n顶部有一个链接指向一个用于创建国家的页面——如果你点击列表中的国家代码，同一个页面也用于编辑国家信息。`Currency`\
    \ 链接用于维护货币表。最后，有一个下拉框，你可以在其中选择一个大洲，点击 `Update` 链接后，列表将更新为只显示所选大洲的国家。\n\n维护国家信息的页面如下所示，点击安多拉（Andora）的代码后：\n\
    \n![](img/0073.jpeg)\n\n最后，下方显示了维护货币表的页面（只显示了几种货币）：\n\n![](img/0074.jpeg)\n\n\
    该页面应该是不言自明的的。\n\n![](img/0075.jpeg)3 ![](img/0076.jpeg)企业级 Java Bean\n\n"
- fmt: "\n# Enterprise Java Beans (EJB)\n\nare components that live on a server and\
    \ enclose business logic, and here they can be used by other applications such\
    \ as web applications and standalone applications. You could thus think of an\
    \ EJB as a component that is developed, tested and hosted on an application server\
    \ (such as Glassfish), and as other applications may apply. It is not quite simple\
    \ to develop EJBs and get them hosted on an application server, and the architecture\
    \ is also not so easy to review, but NetBeans helps as it has projects specifically\
    \ aimed for developing EJBs. In this chapter, I will partly demonstrate how to\
    \ develop and use EJBs using NetBeans and explain the most important concepts.\n\
    \nThe advantage of using EJBs is that, in addition to providing the same services\
    \ to multiple applications, the application server addresses a variety of conditions\
    \ such as transactions and security issues, and EJB components can thus simplify\
    \ the development of an enterprise application. EJBs therefore play an important\
    \ role in the development of modern applications, including distributed applications,\
    \ but it should be mentioned immediately that they are no longer playing the same\
    \ role because of web services.\n\n## EJB Variants\n\nThere are three variants:\n\
    \n- **Stateless**, which are components where the state is not preserved between\
    \ several calls to the component’s methods.\n- **Stateful**, that are components\
    \ where the state is maintained throughout the life of the component as compared\
    \ to the current application.\n- **Singleton**, which is a component that exists\
    \ in exactly one version relative to an application.\n\n## Developing EJB Modules\n\
    \nHaving said that it is not easy to write EJB modules, it is not so much to write\
    \ the individual EJB classes, as that are no different from writing other classes,\
    \ but the problems arise in connection with deployment and the use of the modules\
    \ from client programs, and thus relates more to `Glassfish` than to writing the\
    \ code. Therefore, I will start simple and create an Enterprise Application project,\
    \ consisting of a single EJB module, as well as a web application that uses this\
    \ module. The EJB module should consist of a single stateless session bean that\
    \ provides five methods (services) available to clients that here are the web\
    \ application.\n\nIn the following I will describe the procedure. I start with\
    \ a new project by selecting `Java EE` and `Enterprise Application`:\n\n![](images/00077.jpeg)\n\
    \nAfter clicking `Next`, I will enter the project name in the next window where\
    \ I have entered `CalcEJB`. After clicking `Next` again, I get the following window,\
    \ which by default consists of a single EJB module and a Web Application:\n\n\
    ![](images/00078.jpeg)\n\nWhen you click `Finish`, NetBeans creates an Enterprise\
    \ Application, which has attached two projects:\n\n![](images/00079.jpeg)\n\n\
    where the first one is an EJB Module project named `CalcEJB-ejb`, while the other\
    \ is a Web Application project called `CalcEJB-war`. Note that it is NetBeans\
    \ who has chosen the names and they can of course be changed if desired.\n\nAs\
    \ a next step, the `CalcEJB-ejb` project should have an EJB. To do this, right-click\
    \ on the project and select `Enterprise Javabeans` and then `Session Bean`:\n\n\
    ![](images/00080.jpeg)![](images/00081.jpeg)\n\n![](images/00082.jpeg)\n\nWhen\
    \ you clicks `Next` you get the following window, where you must enter a name\
    \ for your EJB (here `CalcSession`) and a name on a package (here `calcejb.ejbs`):\n\
    \n![](images/00083.jpeg)\n\nIn addition, choose a `Session Type` where `Stateless`\
    \ has been selected. Finally, `Local` has been ticked. This means that an interface\
    \ that defines the EJB is created. When here selected `Local`, it means that it\
    \ is an EJB that can be used by a web applications hosted on the same application\
    \ server (what will often be the case in practice) and, precisely, it means an\
    \ application performed by the same JVM as the EJB module. After clicking `Finish`,\
    \ NetBeans creates a class and interface:\n\n![](images/00084.jpeg)\n\nThe class\
    \ is as follows:\n\n```java\npackage calcejb.ejbs;\n import javax.ejb.Stateless;\
    \ \n@Stateless\npublic class CalcSession implements CalcSessionLocal\n{\n\n}\n\
    ```\n\nand you can partly see that it implements the interface and that it is\
    \ decorated with an annotation telling that it is a stateless session bean. The\
    \ interface is an empty interface but decorated with an annotation that tells\
    \ you that it is a local session bean:\n\n```java\npackage calcejb.ejbs; \nimport\
    \ javax.ejb.Local; \n@Local\npublic interface CalcSessionLocal\n{\n\n}\n```\n\n\
    Next, methods for the EJB class should be added. To do this, right-click on the\
    \ class and select `Insert Code`, and in the follow, choose `Add Method`, after\
    \ which you get the following:\n\n![](images/00085.jpeg)\n![](images/00086.jpeg)\n\
    \nHere, NetBeans adds a method. The advantage of using the tool is that it updates\
    \ the interface. Below is the completed interface, which defines the `5` methods:\n\
    \n```java\npackage calcejb.ejbs;\nimport javax.ejb.Local;\n@Local\npublic interface\
    \ CalcSessionLocal\n{\nint add(int a, int b);\nint sub(int a, int b);\nint mul(int\
    \ a, int b);\nint div(int a, int b);\nint mod(int a, int b);\n}\n```\n\nThe finished\
    \ class is as follows:\n\n```java\npackage calcejb.ejbs; \nimport javax.ejb.Stateless;\
    \ \n@Stateless\npublic class CalcSession implements CalcSessionLocal\n{\n@Override\n\
    public int add(int a, int b) {\n    return a + b;\n}\n@Override\npublic int sub(int\
    \ a, int b) {\n    return a - b;\n}\n@Override\npublic int mul(int a, int b) {\n\
    \    return a * b;\n}\n@Override\npublic int div(int a, int b) {\n    try {\n\
    \        return a / b;\n    } catch (Exception ex) {\n        return 0;\n    }\n\
    }\n@Override\npublic int mod(int a, int b) {\n    try {\n        return a % b;\n\
    \    } catch (Exception ex) {\n        return 0;\n    }\n}\n}\n```\n\nNow my session\
    \ bean is complete, and then the client must be written. First, I have added a\
    \ named bean called `CalcBean` (to the package `calcejb.beans`). After I added\
    \ the class, I right-clicked on the name and selected `Insert Code` and here again\
    \ `Enterprise Bean`, after which the result is:\n\n```java\npackage calcejb.beans;\n\
    import calcejb.ejbs.CalcSessionLocal;\nimport javax.inject.Named;\nimport javax.enterprise.context.SessionScoped;\
    \ \nimport java.io.Serializable;\nimport javax.ejb.EJB;\n\n@Named(value = \"calcBean\"\
    )\n@SessionScoped\npublic class CalcBean implements Serializable\n{\n@EJB\nprivate\
    \ CalcSessionLocal calcSession; \npublic CalcBean()\n{\n}\n// methods would be\
    \ called here\n}\n```\n\nThat is, a reference has been made to the EJB module,\
    \ and the important thing here is that it is decorated with `@EJB`. This means\
    \ that the relevant session bean can be used by the class’s methods. The finished\
    \ name bean is as follows:\n\n![](images/00088.jpeg)![](images/00089.jpeg)\n\n\
    ```java\npackage calcejb.beans;\nimport calcejb.ejbs.CalcSessionLocal;\nimport\
    \ javax.inject.Named;\nimport javax.enterprise.context.SessionScoped; \nimport\
    \ java.io.Serializable;\nimport javax.ejb.EJB;\n\n@Named(value = \"calcBean\"\
    )\n@SessionScoped\npublic class CalcBean implements Serializable\n{\n@EJB\nprivate\
    \ CalcSessionLocal calcSession;\n\nprivate int value1; \nprivate int value2; \n\
    private int value3;\n\npublic CalcBean()\n{\n}\n\npublic int getValue1() {\n \
    \   return value1;\n}\n\npublic void setValue1(int value1) {\n    this.value1\
    \ = value1;\n}\n\npublic int getValue2() {\n    return value2;\n}\n\npublic void\
    \ setValue2(int value2) {\n    this.value2 = value2;\n}\n\npublic int getValue3()\
    \ {\n    return value3;\n}\n\npublic void setValue3(int value3) {\n    this.value3\
    \ = value3;\n}\n}\n```\n"
