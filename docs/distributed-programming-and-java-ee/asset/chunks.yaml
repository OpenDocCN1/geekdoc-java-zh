  trans: "\n\n# 企业级 Java Beans (EJB)\n\n是运行在服务器上并封装业务逻辑的组件，在这里它们被其他应用程序（如 Web 应用程序和独立应用程序）使用。因此，你可以将\
    \ EJB 视为一个在应用程序服务器（如 Glassfish）上开发、测试和托管的组件，就像其他应用程序可以调用它一样。开发 EJB 并将它们托管在应用程序服务器上并不简单，其架构也不易于审查，但\
    \ NetBeans 提供了帮助，因为它有专门用于开发 EJB 的项目。在本章中，我将部分演示如何使用 NetBeans 开发和使用 EJB，并解释最核心的概念。\n\
    \n使用 EJB 的优势在于，除了能为多个应用程序提供相同的服务外，应用程序服务器还处理如事务和安全问题等各种情况，因此 EJB 组件可以简化企业级应用程序的开发。因此，EJB\
    \ 在现代应用程序（包括分布式应用程序）的开发中起着重要作用，但必须指出，由于 Web 服务的出现，它们不再扮演同样的角色。\n\n## EJB 变体\n\n\
    有三种变体：\n\n- **无状态（Stateless）**：即在组件方法的多次调用之间不保留状态的组件。\n- **有状态（Stateful）**：与当前应用程序相比，在组件整个生命周期内维护状态的组件。\n\
    - **单例（Singleton）**：相对于一个应用程序，恰好存在一个版本的组件。\n\n## 开发 EJB 模块\n\n虽说编写 EJB 模块并不容易，但问题不在于编写单个\
    \ EJB 类（因为这与其他类的编写无异），而在于部署以及从客户端程序使用这些模块，这更多是与 `Glassfish` 相关，而不是编写代码。因此，我将从简单的开始，创建一个企业级应用程序项目，包含一个的\
    \ EJB 模块以及使用该模块的 Web 应用程序。该 EJB 模块应包含一个无状态会话 Bean，它为客户端（此处为 Web 应用程序）提供五个方法（服务）。\n\
    \n下面我将描述操作步骤。我首先通过选择 `Java EE` 和 `Enterprise Application` 开始创建一个新项目：\n\n![](img/00077.jpeg)\n\
    \n点击 `Next` 后，我在下一个窗口中输入项目名称，输入了 `CalcEJB`。再次点击 `Next` 后，我得到了以下窗口，该窗口默认由单个 EJB\
    \ 模块和一个 Web 应用程序组成：\n\n![](img/00078.jpeg)\n\n当你点击 `Finish` 时，NetBeans 会创建一个企业级应用程序，它包含了两个项目：\n\
    \n![](img/00079.jpeg)\n\n其中第一个是名为 `CalcEJB-ejb` 的 EJB 模块项目，另一个是名为 `CalcEJB-war`\
    \ 的 Web 应用程序项目。注意名称是由 NetBeans 选择的，你可以根据需要进行更改。\n\n下一步，`CalcEJB-ejb` 项目应该拥有一个\
    \ EJB。为此，右键点击项目并选择 `Enterprise Javabeans`，然后选择 `Session Bean`：\n\n![](img/00080.jpeg)![](img/00081.jpeg)\n\
    \n![](img/00082.jpeg)\n\n点击 `Next` 后你会得到以下窗口，在其中你必须为你的 EJB 输入名称（此处为 `CalcSession`）和一个包名称（此处为\
    \ `calcejb.ejbs`）：\n\n![](img/00083.jpeg)\n\n此外，选择 `Session Type`，已选择 `Stateless`。最后，勾选了\
    \ `Local`。这意味着将创建一个定义 EJB 的接口。在这里选择 `Local`，意味着该 EJB 可以被托管在同一应用程序服务器上的 Web 应用程序使用（这在实践中通常如此），并且准确地说，意味着由与\
    \ EJB 模块相同的 JVM 执行的应用程序。点击 `Finish` 后，NetBeans 会创建一个类和一个接口：\n\n![](img/00084.jpeg)\n\
    \n该类如下：\n\n```java\npackage calcejb.ejbs;\n import javax.ejb.Stateless; \n@Stateless\n\
    public class CalcSession implements CalcSessionLocal\n{\n\n}\n```\n\n你可以部分看到它实现了该接口，并且被一个注解装饰，说明它是一个无状态会话\
    \ Bean。接口是一个空接口，但带有一个注解，告诉你是它是一个本地会话 Bean：\n\n```java\npackage calcejb.ejbs; \n\
    import javax.ejb.Local; \n@Local\npublic interface CalcSessionLocal\n{\n\n}\n\
    ```\n\n接下来，应该为 EJB 类添加方法。为此，右键点击该类并选择 `Insert Code`，在随后的选项选择 `Add Method`，然后得到如下内容：\n\
