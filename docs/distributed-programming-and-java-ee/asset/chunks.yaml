    public boolean delCategory(Category  category); public List<Category>  getCategories();


    public boolean addPublisher(Publisher  publisher); public boolean modPublisher(Publisher  publisher);
    public boolean delPublisher(Publisher  publisher); public List<Publisher>  getPublishers();


    public boolean addAuthor(Author author); public boolean modAuthor(Author author);
    public boolean delAuthor(Author author); public List<Author> getAuthors();


    public boolean addBook(Book book); public boolean modBook(Book book); public boolean
    delBook(Book book);


