    {


    BigDecimal evaluate(String text, int precision) throws  Exception; List<String>
    reserved();


    }


    The project FunctionsEJB


    This project is an EJB module project and has a single EJB, which is a stateless
    session   bean.  The project consists of three  files, with the middle being the
    bean class, while the   other  two  are  the  classes  for  the  treatment  of  an  expression:


    ![](images/00348.jpeg)


