  trans: "\n结果是一个包含单个属性 `ID` 的类，类型为 `Long`。你应该注意，该属性被两个注解装饰着：第一个表示它是一个主键，另一个告诉该值应该由数据库服务器分配为自动递增数字。最后，你应该注意该类还被装饰了一个注解，告诉它是一个实体类。然后，该类必须扩展以下属性：\n\
    \n```java\nprivate String firstname;\nprivate String lastname;\nprivate String\
    \ address;\nprivate String code;\nprivate String city;\nprivate String email;\n\
    private String date;\nprivate String title;\n```\n\n并带有相应的 get 和 set 方法。然后，我删除了模型类\
    \ `Person`，在 `IndexController` 中，所有对 `Person` 的引用必须更改为 `Address`，并且应该删除 `add()`\
    \ 方法中的代码。之后，再次可以在浏览器中打开程序。\n\n![](img/00017.jpeg)<map name=\"awmap3\" class=\"\
    calibre1\"><area shape=\"rect\" href=\"http://www.employerforlife.com/\" coords=\"\
    544, 421, 554, 435\" class=\"calibre39\"><area shape=\"rect\" href=\"http://www.employerforlife.com/\"\
    \ coords=\"544, 407, 676, 421\" class=\"calibre39\"></map>![](img/00018.jpeg)在\
    \ `IndexController` 中，你必须添加一些额外的语句：\n\n```java\npackage changeaddress.beans;\n\
    import java.util.*;\n\nimport javax.inject.Named;\nimport javax.enterprise.context.SessionScoped;\n\
    import java.io.Serializable;\n\nimport javax.persistence.*;\nimport javax.transaction.*;\n\
    import javax.annotation.*;\nimport javax.persistence.criteria.CriteriaQuery;\n\
    \nimport changeaddress.models.*;\n\n@Named(value = \"indexController\")\n@SessionScoped\n\
    public class IndexController implements Serializable\n{\n    @PersistenceUnit\
    \ EntityManagerFactory emf;\n    @PersistenceContext EntityManager em;\n\n   \
    \ @Resource UserTransaction utx;\n    private Address person = new Address();\n\
    \    private List<Address> persons = new ArrayList();\n\n    …\n\n    public List<Address>\
    \ getPersons()\n    {\n        try\n        {\n            CriteriaQuery cq =\
    \ em.getCriteriaBuilder().createQuery();\n            cq.select(cq.from(Address.class));\n\
    \            Query q = em.createQuery(cq);\n            return persons = q.getResultList();\n\
    \        }\n        catch (Exception ex)\n        {\n        }\n        return\
    \ persons;\n    }\n\n    public void add()\n    {\n        try\n        {\n  \
    \          utx.begin();\n            em.persist(person);\n            utx.commit();\n\
    \            person = new Address();\n        }\n        catch (Exception ex)\n\
    \        {\n            try\n            {\n                utx.rollback();\n\
    \            }\n            catch (Exception e)\n            {\n            }\n\
    \        }\n    }\n}\n```\n\n在类的开头，定义了三个对象，每个对象装饰有一个注解。这种符号的确切含义在第 4 章中解释，但作为一个示例，变量\
    \ `em` 的类型为 `EntityManager`，前面的注解意味着基于项目的持久化单元（Persistence Unit），JPA 实例化了一个类型为\
    \ `EntityManager` 的对象，这是一个 JPA 类型，代表一个数据库表并提供可以执行数据库操作的服务。最后一个变量 `utx` 定义了一个数据库操作的事务。这些对象被用于\
    \ `getPersons()` 和 `add()` 方法中。例如，如果你看最后一个，它启动了一个事务，然后 `persist()` 方法将对象 `person`\
    \ 写入数据库。在应用程序可以使用之前，必须创建数据库。这在 Services（服务）下通过右键点击 DB：![](img/00019.jpeg)并选择 Create\
    \ Database（创建数据库）。通过这些更改，程序的运行方式与 Java 书中相同，但现在地址存储在数据库表中。\n\n### 改进的地址程序\n\n\
    在本节中，我想展示上述程序的另一个版本，它在两个方面进行了更改：\n1. 这次数据库是一个已存在的 MySQL 数据库。\n2. 数据库操作已移动到数据库控制器（database\
    \ controller）。\n\n在完成任务之前，我必须创建数据库：\n\n```sql\nuse mysql;\ncreate database addresses;\n\
    use addresses;\ncreate table address (\n    id int not null auto_increment,\n\
    \    firstname varchar(50),\n    lastname varchar(30),\n    address varchar(50),\n\
    \    code varchar(4),\n    city varchar(30),\n    mail varchar(50),\n    date\
    \ varchar(10),\n    title varchar(50)\n);\n```\n\n![](img/0020.jpeg)<map name=\"\
    awmap4\" class=\"calibre1\"><area shape=\"rect\" href=\"http://www.discovermitas.com/\"\
    \ coords=\"596, 68, 609, 83\" class=\"calibre39\"><area shape=\"rect\" href=\"\
    http://www.discovermitas.com/\" coords=\"588, 68, 596, 83\" class=\"calibre39\"\
    ><area shape=\"rect\" href=\"http://www.discovermitas.com/\" coords=\"580, 68,\
    \ 587, 83\" class=\"calibre39\"><area shape=\"rect\" href=\"http://www.discovermitas.com/\"\
    \ coords=\"719, 52, 723, 68\" class=\"calibre39\"></map>\n"
- fmt: "\nYou should examine the class `Address`, where many annotations have been\
    \ added (all properties are decorated), but you can easily understand the meaning.\
    \ You must note that all annotations are determined by NetBeans by retrieving\
    \ information from the database. Also try to examine the glassfish resource `resources.xml`\
    \ configuration file.\n\nI will make a single change. With an `EntityManager`\
    \ object and a `UserTransaction` object, you can perform database operations without\
    \ the need to write very much and without knowing SQL. Since it’s the same thing\
    \ that’s going to happen every time, you can encapsulate these operations into\
    \ a class that can be used no matter what database table it is. This happens by\
    \ adding a database controller (here to `changeaddress.models`), which is a class\
    \ of the type `JPA Controller Classes` from Entity:\n\n![](images/00032.jpeg)\n\
    \nWhen you click Next, you must select the entity class for which the object should\
    \ be controller for:\n\n![](images/00033.jpeg)![](images/00034.jpeg)\n\n![](images/00035.jpeg)\n\
    \nIn this case, there is only one option, and when added to `Selected Entity Classes`,\
    \ you can create the controller class. The class is called `AddressJpaController`\
    \ and it encapsulates what is necessary to maintain the database table as well\
    \ as methods so that you can read the row with a particular primary key as well\
    \ as a few methods to retrieve multiple rows. The code is shown below:\n\n```java\n\
    package changeaddress.models;\n\nimport changeaddress.models.exceptions.*; import\
    \ java.io.Serializable;\n\nimport java.util.List;\n\nimport javax.persistence.*;\n\
    \nimport javax.persistence.criteria.*;\n\nimport javax.transaction.UserTransaction;\n\
    \npublic class AddressJpaController implements Serializable\n{\n\n    private\
    \ UserTransaction utx = null; private EntityManagerFactory emf = null;\n\n   \
    \ public AddressJpaController(UserTransaction utx, EntityManagerFactory emf)\n\
    \    {\n        this.utx = utx; this.emf = emf;\n    }\n\n    public EntityManager\
    \ getEntityManager()\n    {\n        return emf.createEntityManager();\n    }\n\
    \n    public void create(Address address) throws RollbackFailureExceptionE,xception\n\
    \    {\n        EntityManager em = null;\n        try\n        {\n           \
    \ utx.begin();\n            em = getEntityManager(); em.persist(address); utx.commit();\n\
    \        }\n        catch (Exception ex)\n        {\n            try\n       \
    \     {\n                utx.rollback();\n            }\n            catch (Exception\
    \ re)\n            {\n                throw new RollbackFailureException(\" …\
    \ \", re);\n            }\n            throw ex;\n        }\n        finally\n\
    \        {\n            if (em != null)\n            {\n                em.close();\n\
    \            }\n        }\n    }\n\n    public void edit(Address address) throws\
    \ NonexistentEntityException, RollbackFailureException, Exception\n    {\n   \
    \     EntityManager em = null;\n        try\n        {\n            utx.begin();\n\
    \            em = getEntityManager(); address = em.merge(address); utx.commit();\n\
    \        }\n        catch (Exception ex)\n        {\n            try\n       \
    \     {\n                utx.rollback();\n            }\n            catch (Exception\
    \ re)\n            {\n                throw new RollbackFailureException(\" …\
    \ \", re);\n            }\n            String msg = ex.getLocalizedMessage();\
    \ if (msg == null || msg.length() == 0)\n            {\n                Integer\
    \ id = address.getId(); if (findAddress(id) == null)\n                {\n    \
    \                throw new NonexistentEntityException(\" … \");\n            \
    \    }\n            }\n            throw ex;\n        }\n        finally\n   \
    \     {\n            if (em != null)\n            {\n                em.close();\n\
    \            }\n        }\n    }\n```\n\n![](images/00036.jpeg)![](images/00037.jpeg)\n\
    \n```java\npublic void destroy(Integer idthrows NonexistentEntityException, RollbackFailureException,\
    \ Exception\n{\n    EntityManager em = null;\n    try\n    {\n        utx.begin();\n\
    \        em = getEntityManager();\n        Address address; try\n        {\n \
    \           address = em.getReference(Address.class, id); address.getId();\n \
    \       }\n        catch (EntityNotFoundException enfe)\n        {\n         \
    \   throw new NonexistentEntityException(\" … \", enfe);\n        }\n        em.remove(address);\
    \ utx.commit();\n    }\n    catch (Exception ex)\n    {\n        try\n       \
    \ {\n            utx.rollback();\n        }\n        catch (Exception re)\n  \
    \      {\n            throw new RollbackFailureException(\" … \", re);\n     \
    \   }\n        throw ex;\n    }\n    finally\n    {\n        if (em != null)\n\
    \        {\n            em.close();\n        }\n    }\n}\n\npublic List<Address>\
    \ findAddressEntities()\n{\n    return findAddressEntities(true, -1, -1);\n}\n\
    \npublic List<Address> findAddressEntities(int maxResults, int firstResult)\n\
    {\n    return findAddressEntities(false, maxResults, firstResult);\n}\n\nprivate\
    \ List<Address> findAddressEntities(boolean all, int maxResults, int firstResult)\n\
    {\n    EntityManager em = getEntityManager();\n    try\n    {\n        CriteriaQuery\
    \ cq = em.getCriteriaBuilder().createQuery(); cq.select(cq.from(Address.class));\n\
    \        Query q = em.createQuery(cq); if (!all)\n        {\n            q.setMaxResults(maxResults);\n\
    \        }\n        q.setFirstResult(firstResult);\n        return q.getResultList();\n\
    \    }\n    finally\n    {\n        em.close();\n    }\n}\n\npublic Address findAddress(Integer\
    \ id)\n{\n    EntityManager em = getEntityManager();\n    try\n    {\n       \
    \ return em.find(Address.class, id);\n    }\n    finally\n    {\n        em.close();\n\
    \    }\n}\n\npublic int getAddressCount()\n{\n    EntityManager em = getEntityManager();\n\
    \    try\n    {\n        CriteriaQuery cq = em.getCriteriaBuilder().createQuery();\
    \ Root<Address> rt = cq.from(Address.class); cq.select(em.getCriteriaBuilder().count(rt));\n\
    \        Query q = em.createQuery(cq);\n        return ((Long) q.getSingleResult()).intValue();\n\
    \    }\n    finally\n    {\n        em.close();\n    }\n}\n```\n\nThe code fills,\
    \ but the class is easy enough to understand and the most important thing is that\
    \ everything about database is encapsulated in methods including the necessary\
    \ rollback. In addition, the class defines some simple methods that can return\
    \ an object with a specific id or list of objects. Note the `CriteriaQuery` and\
    \ `Query` types as explained below, but based on the names (and the application)\
