- fmt: "\nThe class is simple and consists primarily of methods that delegate work\
    \ to the EJB instance. The example shows in many ways the use of enterprise java\
    \ beans as objects that encapsulate business logic and move it away from named\
    \ beans used as controller for the user interface. In this way, you simplify the\
    \ individual named beans.\n\nFinally, there is the code for `index.xhtml`, which\
    \ contains no new, and which I do not want to show here.\n\n![](images/00098.jpeg)3.2![](images/00099.jpeg)\
    \ A REMOTE SINGLETON SESSION BEAN\n\nIn the first two examples, both the session\
    \ bean and the client application have been part of the same enterprise application.\
    \ In this section I will show an example of a session bean developed as single\
    \ module and deployed independently to the server. Next, the example will include\
    \ a common web application that is developed independently of the above bean,\
    \ but uses the session bean. This means that the application and the bean could\
    \ be hosted on each application server.\n\nThe actual session bean should also\
    \ be written as a singleton – primarily to show how. A singleton session bean\
    \ is a session bean, where there is exactly one instance per. application server.\
    \ A typical application is a bean that must initialize some data exactly once,\
    \ which should otherwise be available throughout the entire life of the application.\
    \ Often, the data in question is initialized from a database, and you want to\
    \ decorate a method with `@PostConstruct`, where data can be initialized. It is\
    \ not currently used in the present case as data is hard-coded to make the current\
    \ bean simple.\n\nIn the same way as in the previous two examples I start of creating\
