    \ are essentially unchanged with the difference that the bean references have\
    \ been changed. I do not want to show the two pages here.\n\n### EXERCISE 3\n\n\
    In this exercise you must solve the same exercise as in the previous exercise,\
    \ but with the difference that the kings should be loaded from a database. The\
    \ database `padata` has a table `history` that contains information about Danish\
    \ kings. If the table does not exist, you can see in the book `Java 6` how to\
    \ create this table – the book’s examples contains scripts that creates and initializes\
    \ the table. To solve the exercise, you can proceed as follows:\n\n1. Create a\
    \ new Enterprise Application project called `HistoryEJB`, which should only have\
    \ an EJB module. NetBeans creates the `HistoryEJB-ejb` module.\n2. Create a `Class\
    \ Library` project, which you can call `HistoryEJBRemote`. In addition, add the\
    \ class `King` from the previous exercise.\n3. Add a stateful session bean called\
    \ `HistorySession` to `HistoryEJB-ejb` when it should have a remote interface\
    \ that is added to `HistoryEJBRemote`. The interface should be the same as in\
    \ the previous exercise (two methods that return a `List<King>`). The implementation\
    \ must have an instance variable of the type `List<King>` and you must initialize\
    \ it in a `@PostConstruct` method by loading data from the table `history` in\
    \ the database. This you can do easy in the same way as in the previous example\
    \ to create an `Entity Class` from Database.\n4. Translate and deploy `HistoryEJB`.\n\
    5. Create a client, which is basically the same client as in exercise 2.\n6. Test\
    \ the application and that all is working.\n\n### 3.4 TRANSACTIONS\n\nOne of the\
    \ major advantages of using enterprise java beans is that an EJB uses transactions,\
    \ which generally means that the changes a method are performed, if all are executed\
    \ correctly, otherwise nothing is done corresponding to a rollback. The latter\
    \ is the case if there is an exception. Immediately, it’s fine, but it’s not obvious\
    \ how it works if a method is called while a transaction is in progress. Should\
    \ the method be part of the current transaction, must the existing transaction\
    \ be suspended while creating a new transaction for the new method call? Due to\
    \ such questions, it is possible to configure how transactions should work. This\
    \ happens with an annotation `@TransactionAttribute`:\n\n```java\n@Stateless\n\
    public class Helloworld\n{\n    @Override \n    @TransactionAttribute(TransactionAttributeType.REQUIRES_NEW)\
    \ \n    public String hello()\n    {\n        return \"Hello World\";\n    }\n\
    }\n```\n\nwhere the value with `TransactionAttribute` indicates how the transactions\
    \ work. There are the following options:\n\n1. `TransactionAttributeType.MANDATORY`:\
    \ The method can only be performed as part of an existing transaction. If the\
    \ method is called outside a transaction, an exception is raised.\n2. `TransactionAttributeType.NEVER`:\
    \ If the method is called from a client, no transaction is created. If the method\
    \ is called part of a transaction, an exception is raised.\n3. `TransactionAttributeType.NOT_SUPPORTED`:\
    \ If the method is called part of an existing transaction, it is suspended and\
    \ the method is performed outside of transaction. If the method is called outside\
    \ a transaction, no transaction is created.\n4. `TransactionAttributeType.REQUIRED`:\
    \ If the method is performed part of an existing transaction, it will be executed\
    \ as part of this transaction. If the method is called outside of a transaction,\
    \ a new transaction is created.\n5. `TransactionAttributeType.REQUIRES_NEW`: If\
    \ the method is called part of an existing transaction, it will be suspended and\
    \ a new transaction will be created. After the method is completed, the previous\
    \ transaction will be resumed. If the method is called outside of an existing\
    \ transaction, a new transaction is created.\n6. `TransactionAttributeType.SUPPORTS`:\
    \ If the method is performed as part of an existing transaction, it is performed\
    \ as part of this transaction. If the method is called outside of a transaction,\
    \ no new transaction is initiated.\n\nAbove is shown how to decorate a method\
    \ for transactions, but you can also decorate the class and the decoration will\
    \ then relate to all class’s methods.\n\n### 3.5 INTERCEPTION\n\nWhen performing\
    \ a method in a session bean, one may sometimes be interested in an action before\
    \ the method is executed (when called) and immediately after the method has been\
    \ completed. The typical reason is debugging, for example, you can write to the\
    \ server’s log file. As an example, I have added the following class to the `AddressEJB-ejb`\
    \ project:\n\n```java\npackage addressejb.beans;\n\nimport javax.interceptor.AroundInvoke;\n\
    import javax.interceptor.InvocationContext;\nimport java.lang.reflect.Method;\n\
    \npublic class AddressInterceptor\n{\n    @AroundInvoke\n    public Object logMethodCall(InvocationContext\
    \ invocationContext) throws Exception\n    {\n        Object interceptedObject\
    \ = invocationContext.getTarget(); \n        Method interceptedMethod = invocationContext.getMethod();\n\
    \n        System.out.println(\"Entereding: \" + interceptedObject.getClass().getName()\
    \ + \".\" + interceptedMethod.getName() + \"()\");\n\n        Object obj = invocationContext.proceed();\n\
    \        System.out.println(\"Leaving: \" + interceptedObject.getClass().getName()\
    \ + \".\" + interceptedMethod.getName() + \"()\");\n\n        return obj;\n  \
    \  }\n}\n```\n"
