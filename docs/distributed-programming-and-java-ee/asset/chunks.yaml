    ![](images/00234.jpeg)7 ![](images/00235.jpeg)SECURITY


    When developing applications that are used over a network (web applications, enterprice
    applications, etc.), at the same time – or very often – there is a security issue
    that needs to  be solved. It is a problem that I have overlooked in both this
    book and the two previous  books. Basically it is  about


    1. that only allowed users may use a program or parts of an application and that
    all users  should  not  have  the  same  rights


    2. that unauthorized users may not necessarily access the data sent over a network
    between users and  servers


    ![](images/00236.jpeg)The  first issue is solved by using user identification
    and passwords, while the other issue is solved by using encryption so nobody can
    read the data sent over the network. In principle,  it  sounds simple, but it’s
    no matter what the many cyber attacks, as one hears in the press, also testifies.
    Perhaps it’s actually impossible to completely secure an enterprise application,
    but you can do a lot, and more than often it is not done.


    | This e-bookis  made  withSETASIGNSetaPDF![](images/00091.jpeg)PDF components
    for PHP developers |


    | www.setasign.com |


    Many of the challenges associated with security are not so much because we do
    not know how, but more that they make everyday work difficult, and for that reason,
    many may be tempted to relax security policies. Studies actually shows that most
    security issues are due     to how the programs are used, more than how the programs
    are made. In this chapter I       will give an introduction to what safety matters
    there are as part of the development work,  and mention that it does not help
    much unless users of IT solutions also take the security  issue  seriously.


    In turn, the challenges of encryption are the easiest to solve, as it is primarily
    a question        of using a secure transmission line where data is sent encrypted,
    and the problem is solved by properly configuring the program. However, the authentication
    and user authorization issues can be solved by two sites, namely by the container
    (the application server), which      is a configuration task, and by program itself,
    where it is the programmer who will solve     the  task.


    7.1 THE DEMO APPLICATION


    I use a simple web application called  SecurityApp1.  The application consists
    of only three simple HTML pages, where the  index.html  is the start page and
    opens the following window:


