  raw: 'The result is a class with a single property  ID  of the type  Long. You should
    note that this property is decorated with two annotations,  first indicating that
    it is a primary key, while    the other tells that the value should be assigned
    by the database server as an auto number. Finally, you should note that the class
    is also decorated with an annotation that tells that        it  is  an  entity  class.  The  class  must  then  be  expanded  with  the  following  properties:


    private String firstname; private String lastname; private String address; private
    String code; private String city; private String email; private String date; private
    String title;


    with associated get and set methods.  Then I have deleted the model class  Person,
    and in  IndexController, all references to  Person  must be changed to  Address,
    and the code in the  add()  method should be deleted. After that, the program
    can be opened in the browser again.


