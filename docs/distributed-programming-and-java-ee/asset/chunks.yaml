    FOREWORD


    This book is the thirteenth in a series of books on software development.  The
    programming language is Java, and the language and its syntax and semantics  fills
    obviously much, but    the books have also largely focus on the process and how
    to develop good and robust applications.  This book is a continuation of the subjects
    in Java 11, but with focus on the development of enterprise applications.  They
    are programs that performs their work using components or services hosted on different
    computers and located  on  different  places,  which communicate and coordinate
    their work over a network. Primary topics are Java EE technologies as JPA, EJB
    and Web Services.  The book requires knowledge of programming of  web  applications  similar  to  what  has  been  dealt  with  in  the  books  Java  11  and  Java  12.


    As the title says this series of books deals with software development, and the
    goal is to teach the reader how to develop applications in Java. It can be learned
    by reading about the subject and by studying complete sample programs, but most
    importantly by yourself to do it and write your own programs from scratch.  Therefore,
    an important part of the books  is  exercises  and  problems,  where  the  reader  has  to  write  programs  that  correspond  to
    the substance being treated in the books. All books in the series is built around
    the same skeleton and will consist of text and examples and exercises and problems
    that are placed in  the  text  where  they  naturally  belongs.  The  difference  between  exercises  and  problems  is
    that  the  exercises  largely  deals  with  repetitions  of  the  substance  that  is  presented  in  the  text,
    and furthermore it is relatively accurately described what to do. Problems are
    in turn more loosely  described,  and  are  typically  a  little  bigger  and  there  is  rarely  any  clear  best  solution.  These
    are books to be read from start to  finish, but the many code examples, including
    exercises and problems plays a central role, and it is important that the reader
    predict in detail studying the code to the many examples and also solves the exercises
    and problems or  possibly  just  studying  the  recommended  solutions.


    All  books  ends  with  one  or  two  larger  sample  programs,  which  focus  primarily  is  on  process
    and  an  explanation  of  how  the  program  is  written.  On  the  other  hand  appears  the  code  only
    to a limited extent – if at all – and the reader should instead study the  finished
    program code perhaps while testing the program. In addition to show the development
    of programs that are larger than the examples, which otherwise is presented, the
    aim of the concluding examples also is to show program examples from varying  fields
    of  application.


    Most books also ends with an appendix dealing with a subject that would not be
    treated  in the books. It may be issues on the installation of software or other
    topics in computer technology, which are not about software development, but where
    it is necessary to have an introductory knowledge. If the reader already is familiar
    with the subject, the current appendix can be  skipped.


    The programming language is, as mentioned Java, and besides the books use the
    following  products:


    1. NetBeans  as  IDE  for  application  development


    2. MySQL to the extent there is a need for a database server (from the book Java
    6 onwards)


    3. GlassFish  as  a  web  server  and  application  server  (from  the  book  Java  11  onwards)


    It  is  products  that  are  free  of  charge  and  free  to  install,  and  there  is  even  talk  about  products,
    where the installation is progressing all by itself and without major efforts
    and challenges. In  addition,  there  are  on  the  web  detailed  installation  instructions  for  all  the  three  products.  The  products  are  available  on  Windows  and  Linux,  and  it  therefore  plays  no  special  role  if
    you use Linux or  Windows.


    All sample programs are developed and tested on machines running Linux. In fact,
    it plays no major role, as both Java and other products work in exactly the same
    way whether the platform is one or the other. Some places will be in the books
    where you could see that       the platform is Linux, and this applies primarily
    commands that concerning the  file system.  Otherwise it has no meaning to the
    reader that the programs are developed on a Linux machine, and they can immediately
    also run under Windows unless a program refers to       the  file  system  where  it  may  be  necessary  to  change  the  name  of  a  file.


    Finally  a  little  about  what  the  books  are  not.  It  is  not  “how  to
     write”  or  for  that  matter reference manuals in Java, but it is as the title
    says books on software development. It is my hope that the reader when reading
    the books and through the many examples can  find inspiration for how to write
    good programs, but also can be used as a source collection with a number of examples
    of solutions to concrete everyday programming problems that you regularly face
    as a software  developer.


