    User rights are defined as  security-constraint  elements, and in this case there
    are three. A  security-constraint  element defines which pages it concerns and
    what role the user should  have.  The  first happens with an  url-pattern  element,
    while the other happens with a  role- name  element. Looking at the  first  security-constraint  it
    applies to all pages where the name starts with  admin, and thus all pages in
    the  admin  folder. Only users whose role is  admin   can access these pages.  The
    next  security-constraint  element applies to all pages, but here it is a requirement
    that the user should have the role  staf. Finally, there is the last  security-
    constraint  that  applies  to  a  concrete  page  (start  page)  and  for  users  whose  role  is  student.


    The  last  element  is  called  login-config  and  is  used  to  define  how  authentication  should  take
    place.  There are basically three  options


    1. BASIC,  where  it  is  left  to  the  browser  to  make  authentication


    2. FORM  where  it  is  left  for  the  program  to  perform  authentication


    3. CLIENT-CERT, which requires a  certificate


    Looking at the above role names, they refer only to the current application, but
    not to the specific user groups.  There must therefore be a mapping of these names,
    which takes place in  glassfish  web.xml:


    <?xml version="1.0" encoding="UTF-8"?>


    <!DOCTYPE glassfish-web-app PUBLIC  "  … ">


    <glassfish-web-app error-url="">


    <security-role-mapping>


    <role-name>admin</role-name>


    <group-name>admin</group-name>


    </security-role-mapping>


    <security-role-mapping>


    <role-name>staf</role-name>


    <group-name>staf</group-name>


    </security-role-mapping>


    <security-role-mapping>


    <role-name>student</role-name>


    <group-name>student</group-name>


    </security-role-mapping>


    <class-loader delegate="true"/>


    <jsp-config>


    <property name="keepgenerated" value="true">


    <description>Keep a copy … </description>


    </property>


    </jsp-config>


    </glassfish-web-app>


    In this case, the names are the same, but the meaning is of course that they do
    not have to be.  The  server  will  typically  have  relatively  few  groups,  while  the  applications  define  roles
    independently  of  which  user  groups  the  server  has  defined.


