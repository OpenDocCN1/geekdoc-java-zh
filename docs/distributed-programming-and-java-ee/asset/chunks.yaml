    coords="544, 407, 676, 421" class="calibre39"></map>![](images/00018.jpeg)In  IndexController,
    you must add some additional statements:


    package changeaddress.beans; import java.util.*;


    import javax.inject.Named;


    import javax.enterprise.context.SessionScoped; import java.io.Serializable;


    import javax.persistence.*; import javax.transaction.*; import javax.annotation.*;


    import javax.persistence.criteria.CriteriaQuery;


    import changeaddress.models.*;


    @Named(value = "indexController")


    @SessionScoped


    public class IndexController implements Serializable


    {


    @PersistenceUnit EntityManagerFactory emf; @PersistenceContext EntityManager em;


    @Resource UserTransaction utx;


    private Address person = new Address();


    private List<Address> persons = new ArrayList();


    …


    public List<Address> getPersons()


    {


    try


    {


    CriteriaQuery cq = em.getCriteriaBuilder().createQuery(); cq.select(cq.from(Address.class));


    Query q = em.createQuery(cq); return persons =  q.getResultList();


    }


    catch (Exception ex)


    {


    }


    return persons;


    }


    public void add()


    {


    try


    {


    utx.begin(); em.persist(person); utx.commit();


    person = new Address();


    }


    catch (Exception ex)


    {


    try


    {


    utx.rollback();


    }


    catch (Exception e)


    {


    }


    }


    }


    }


    At the start of the class, three objects are defined each decorated with an annotation.  The
    exact  meaning  of  this  notation  is  explained  in  chapter  4,  but  as  example,  the  variable  em


    has the type  EntityManager  and the preceding annotation means that, on the basis
    of the  Persistence Unit  for the project, JPA instantiates an object to the type  EntityManager  that
    is a JPA type, which represents a database table and offers services that can
    perform database  operations.  The last variable  utx  defines a transaction for
    a database operation.  These objects are used in the methods  getPersons()  and  add().
    For example, if you look at the last one, it starts a transaction and then the
    method  persist()  writes the object  person  to the database. Before the application
    can be used, the database must be created. It happens under  Services   by right-click  Java  DB:


    ![](images/00019.jpeg)


    and here you choose  Create Database. With these changes, the program works the
    same as  in  the  book  Java  11,  but  now  the  addresses  are  stored  in  a  database  table.


