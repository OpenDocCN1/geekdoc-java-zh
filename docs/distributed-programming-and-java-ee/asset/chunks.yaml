    In the example above, it is the browser that has shown the login window and it
    is, in principle,  excellent,  but  you  can  also  write  your  own  login  form.  There  may  be  at  least  two
    reasons for it, including that you decide how the form should look, but it also
    allows you to implement a logout function. In the following example I will show
    how to do, but  first I will change the program  itself.


    In the introductory example, the project consists of three HTML pages, but in
    practice it will typically be JSF pages with backing beans, which requires a few
    changes.  The  SecurityApp2  project is expanded with two new JSF pages compared
    to the previous project, and in  addition,  the  three  original  pages  have  been  changed  to  JSF  pages:


    ![](images/00264.jpeg)


    The  three  original  pages  index.xhtml,  enter.xhtml  and  start.xhtml  now  have  a  backing  bean.
    A managed bean with the name  LogoutBean.java  has also been added.  The design
    of the  first three pages has changed a bit, but in principle it works in the
    same way. The  error.  xhtml   page is trivial and consists solely of a text and
    a link to  login.xhtml, and the page     is used if you enter a user that is not
    found or you have entered an illegal password.  The  most  important  thing  about  the  example  is  the  page  login.xhtm:


    <?xml version=''1.0'' encoding=''UTF-8'' ?>


    <!DOCTYPE html PUBLIC " … ">


    <html [xmlns="http://www.w3.org/1999/](http://www.w3.org/1999/xhtml)xhtml" [xmlns:h="http://xmlns.jcp.org/jsf/html">](http://xmlns.jcp.org/jsf/html)


    <h:head>


    <title>Facelet Title</title>


    </h:head>


    <h:body>


    <h2>Enter username and password</h2>


    <form method="POST" action="j_security_check">


    <table cellpadding="0" cellspacing="0" border="0">


    <tr>


    <td align="right">Username:&nbsp;</td>


    <td><input type="text" name="j_username"/></td>


    </tr>


    <tr><td colspan="2" style="height:10px"></td></tr>


    <tr>


    <td align="right">Password:&nbsp;</td>


    <td><input type="password" name="j_password"/></td>


    </tr>


    <tr><td colspan="2" style="height:20px"></td></tr>


    <tr>


    <td></td>


    <td><input type="submit" value="Login"/></td>


    </tr>


    </table>


    </form>


    </h:body>


    </html>


    It is a JSF page, but no JSF elements are used, and in particular it is important
    that the       form  element is not a  h:form  element. Here you should note the  action   attribute,
    which  refers to  j_security_check, which specifies the code that the application
    server performs. For the  same  reasons,  the  two  input  fields  must  be  named  j_username  and  j_password.


    The  last  thing  that  must  happen  to  use  form  authentication  is  the  change  of  web.xml,  where
    the  login-config  element is changed to the  following:


    <login-config>


    <auth-method>FORM</auth-method>


    <realm-name>file</realm-name>


    <form-login-config>


    <form-login-page>/faces/login.xhtml</form-login-page>


    <form-error-page>/faces/error.xhtml</form-error-page>


    </form-login-config>


    </login-config>


    When you opens the application, you will see the window below, where you will
    enter the username  and  password.  In  this  case,  it  is  a  very  simple  form,  but  you  can  of  course  modify  login.xhtml,  so  you  get  a  nicer  design  that  fits  the  current  application.  Note  that  the  address
    bar  shows  that  a  secure  internet  connection  is  being  used.


    ![](images/00265.jpeg)


    ![](images/00266.jpeg)![](images/00267.jpeg)After entering your username and password,
    you will get to  index.xhtml:


    ![](images/00268.jpeg)


    The window looks a bit different, but it is important that there is a link to
    logout. As mentioned above, the page has a managed bean:


    package securityapp.beans; import javax.inject.Named;


    import javax.enterprise.context.SessionScoped; import java.io.Serializable;


    @Named(value = "indexBean")


    @SessionScoped


    public class IndexBean implements Serializable


    {


    public String admin()


    {


    return "admin/start?faces-redirect=true";


    }


    public String enter()


    {


    return "enter?faces-redirect=true";


    }


    }


    The  two  action  methods  should  do  nothing  but  redirect  to  the  two  pages  start.xhtml  and  enter.
    xhtml  that happens when you click on one of the two buttons. When a JSF page
    performs an action, it happens with the POST method, and instead of performing
    a redirection, a forward is performed.  Therefore, the user role is not validated
    (or it only happens when you leave a page again). To solve the problem (so the
    application works like the previous application),  as  described  above,  you  must  force  a  redirection.


    Clicking on the  Logout  link, is called a method  logout()  in a manged bean  LogoutBean.java:


    package securityapp.beans; import javax.inject.Named;


    import javax.enterprise.context.RequestScoped;


    import javax.faces.context.*; import javax.servlet.http.*;


    @Named(value = "logoutBean") @RequestScoped'
