    3.4 TRANSACTIONS


    One of the major advantages of using enterpris java beans is that an EJB uses
    transactions, which generally means that the changes a method are performed, if
    all are executed correctly, otherwise nothing is done corresponding to a rollback.  The
    latter is the case if there is an exception.  Immediately,  it’s  fine,  but  it’s
     not  obvious  how  it  works  if  a  method  is  called while a transaction is
    in progress. Should the method be part of the current transaction,     must the
    existing transaction be suspended while creating a new transaction for the new 
    method call? Due to such questions, it is possible to configure how transactions
    should    work.  This happens with an annotation  @TransactionAttribute:


    @Stateless


    public class Helloworld


    {


    @Override @TransactionAttribute(TransactionAttributeType.REQUIRES_NEW) public
    String hello()


    {


    return "Hello World";


    }


    }


    where the value with  TransactionAttribute  indicates how the transactions will
    work.  There are the following options:


    1.  TransactionAttributeType.MANDATORY:  The method can only be performed as part
    of an existing transaction. If the method is called outside of a transaction,
    a  TransactionRequiredException  exception is  raised.


    2.  TransactionAttributeType.NEVER:  If  the  method  is  called  from  a  client,  no  transaction
    is created. If the method is called as part of a transaction, a  RemoteException  exception
    is  raised.


    3.  TransactionAttributeType.NOT_SUPPORTED:  If  the  method  is  called  as  part  of  an
    existing transaction, it is suspended and the method is performed outside of the 
    transaction.  If  the  method  is  called  outside  of  a  transaction,  no  transaction  is  created.


    4.  TransactionAttributeType.REQUIRED: If the method is performed as part of an
    existing transaction, the method will be executed as part of this transaction.
    If the method is called outside of an existing transaction, a new transaction
    will be  created.


    5.  TransactionAttributeType.REQUIRES_NEW: If the method is called as part of
    an existing transaction, it will be suspended and a new transaction will be created.  
    After the method is completed, the previous transaction will be resumed. If the
    method  is  called  outside  of  an  existing  transaction,  a  new  transaction  is  created.


    6.  TransactionAttributeType.SUPPORTS: If the method is performed as part of an
    existing transaction, it is performed as part of this transaction. If the method
    is   called  outside  of  a  transaction,  no  new  transaction  is  initiated.


    Above is shown how to decorate a method for transactions, but you can also decorate
    the class and the decoration will then relate to all class’s methods.


    3.5 INTERCEPTION


    When performing a method in a session bean, one may sometimes be interested in
    an action before the method is executed (when called) and immediately after the
    method has been completed.  The  typical  reason  is  debugging,  for  example,
     you  can  write  to  in  the  server’s log  file.  As  an  example,  I  have  added  the  following  class  to  the  AddressEJB-ejb  project:


    ![](images/00126.jpeg)<map name="awmap14" class="calibre1"><area shape="rect"
    href="http://www.ligsuniversity.com/" coords="173, 433, 413, 459" class="calibre39"></map>![](images/00127.jpeg)


    package addressejb.beans;


    import javax.interceptor.AroundInvoke; import  javax.interceptor.InvocationContext;
    import  java.lang.reflect.Method;


    public class  AddressInterceptor


    {


    @AroundInvoke


    public Object  logMethodCall(InvocationContext invocationContext) throws Exception


    {


    Object interceptedObject = invocationContext.getTarget(); Method interceptedMethod
    = invocationContext.getMethod();


    System.out.println("Entereding: " + interceptedObject.getClass().getName()  +
    "." + interceptedMethod.getName() + "()");


    Object obj = invocationContext.proceed(); System.out.println("Leaving: " +  interceptedObject.


    getClass().getName() + "." + interceptedMethod.getName() +  "()");


    return obj;


    }


