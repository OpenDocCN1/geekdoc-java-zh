    which is just a class enclosing `id` and `title` for a book. The query can then\
    \ be written as follows:\n\n```java\nCriteriaBuilder cb = em.getCriteriaBuilder();\
    \ CriteriaQuery<BookWrapper> cq = cb.createQuery(BookWrapper.class); Root<Book>\
    \ root = cq.from(Book.class);\ncq.select( cb.construct(BookWrapper.class, root.get(Book_.id),\
    \ root.get(Book_.title))); cq.where(cb.gt(root.get(Book_.pages), 300)); List<BookWrapper>\
    \ list = em.createQuery(cq).getResultList();\n```\n\nFirst, note that you define\
