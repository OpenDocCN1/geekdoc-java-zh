- fmt: "\nIn the above examples, it is the application server that has handled authentication,\
    \ and in many cases it is also the way to do it, but the method is best to control\
    \ the application’s authentication and thus whether a user has access to a particular\
    \ application. On the other hand, if you want to ensure that all users do not\
    \ have access to the same features (pages) in a web application, you need a bit\
    \ more, and you can use a database that contains roles for the individual users\
    \ and then in the application test which roles are available. In this section\
    \ I will illustrate it with a copy of the example `SecurityApp2`, which I have\
    \ called `SecurityApp4`.\n\nBasically, it is the same application with the same\
    \ pages `index.xhtml`, `enter.xhtml` and `start.xhtml` (the last in the folder\
    \ `admin`) and they have the same backing beans. However, another trivial page\
    \ has been added named `list.xhtml` and its associated backing bean, to which\
    \ there is a link from `index.xhtml`. The whole application is thus trivial so\
    \ far, and the sole purpose is to show how to implement authentication, and in\
    \ addition to how to make access to each page depending on what it is for a user\
    \ that is logged in.\n\n### Database Setup\n\nInitially, I have created a database\
    \ called `authentication` and with a single table `user`:\n\n```sql\nuse sys;\n\
    \ndrop database if exists authentication; create database authentication;\n\n\
    use authentication;\n\ncreate table user (\n  name varchar(256) not null, role\
    \ varchar(2048),\n  primary key (name)\n);\n\ninsert into user (name, role) values\
    \ ('poul', 'student:root'); \ninsert into user (name, role) values ('knud', 'admin:staf:student');\
    \ \ninsert into user (name, role) values ('svend', 'staf:student'); \ninsert into\
    \ user (name, role) values ('valdemar', 'student');\n```\n\nThe table has only\
    \ two columns, where the first represents the name of a user and is the primary\
    \ key, while the second column indicates user roles according to the same syntax\
    \ as in Glassfish. As examples, 4 users are added to the table.\n\n### EJB Implementation\n\
    \nIn the project, I have deleted `LogoutBean` and instead added another named\
    \ bean with the name `AuthenticationCtrl`, but before I look at it, I will show\
    \ an EJB that contains the most important to login. It is still the application\
    \ server that needs to authenticate and thus check the user’s username and password.\
    \ Note that the above database table does not contain the user’s password, and\
    \ it is thus the server who is responsible for storing the password encrypted.\n\
    \nTo write the EJB, I have created an EJB Module project named `AuthenticationEJB`.\
    \ Then here I created a class library project named `AuthenticationRemote` and\
    \ added an entity class for the above table. This class has not been changed in\
    \ relation to what NetBeans has generated and the content is not new and will\
    \ not appear here. For `AuthenticationEJB`, I’ve added a reference to the above\
    \ class library and added a stateless session bean named `AuthenticationBean`\
    \ with a remote interface located in the class library. The interface is as follows:\n\
    \n```java\npackage authenticationejb.beans;\n\nimport javax.ejb.Remote;\nimport\
    \ authenticationremote.entities.User;\n\n@Remote\npublic interface AuthenticationBeanRemote\n\
    {\n    public String getPassword();\n    public void setPassword(String password);\
    \ \n    public User getUser();\n    public void setUser(User user); \n    public\
    \ boolean login();\n}\n```\n\nwhich defines two properties, one being the user’s\
    \ password (`AuthenticationBean` must use it to perform authentication using Glassfish),\
    \ and an object of the type `User`, which is the entity type from the class library.\
    \ Finally, there is the method `login()`, which is the method of authentication.\
    \ Below is the class `AuthenticationBean`:\n\n```java\n@Stateless\npublic class\
    \ AuthenticationBean implements AuthenticationBeanRemote\n{\n    @PersistenceContext(unitName\
    \ = \"AuthenticationEJBPU\")\n    private EntityManager em; \n    private String\
    \ password; \n    private User user;\n\n    public AuthenticationBean()\n    }\n\
    \n    @Override\n    public boolean login()\n    {\n        HttpSession session\
    \ = getSession();\n        HttpServletRequest request = null;\n        try\n \
    \       {\n            request = (HttpServletRequest) FaceContext.getCurrentInstance().getExternalContext().getRequest();\n\
    \            session.setMaxInactiveInterval(600); // 10 minutes\n            session.setAttribute(\"\
    authenticated\", true);\n            em.flush();\n\n            Query query =\
    \ em.createQuery(\"select count(u) from User where u.name = :name\");\n      \
    \      query.setParameter(\"name\", getUser());\n            Long count = (Long)\
    \ query.getSingleResult();\n\n            if (count > 0)\n            {\n    \
    \            query = em.createQuery(\"select object(u) from User where u.name\
    \ = :name\");\n                query.setParameter(\"name\", getUser());\n    \
    \            setUser((User) query.getSingleResult());\n            }\n       \
    \     return true;\n        }\n        catch (Exception ex)\n        {\n     \
    \       setUser(null);\n            session = getSession();\n            session.setAttribute(\"\
    authenticated\", false);\n            if (request != null)\n            {\n  \
    \              try\n                {\n                    request.logout();\n\
    \                }\n                catch (Exception e)\n                {\n \
    \               }\n            }\n            return false;\n        }\n     \
    \   finally\n        {\n            setPassword(null);\n        }\n    }\n\n \
    \   public HttpSession getSession()\n    {\n        HttpServletRequest request\
    \ = (HttpServletRequest) FaceContext.getCurrentInstance().getExternalContext().getRequest();\n\
    \        return request.getSession(false);\n    }\n\n    @Override\n    public\
    \ String getPassword()\n    {\n        return this.password;\n    }\n\n    @Override\n\
    \    public void setPassword(String password)\n    {\n        this.password =\
    \ password;\n    }\n\n    @Override\n    public User getUser()\n    {\n      \
    \  if (this.user == null) user = new User();\n        return user;\n    }\n\n\
    \    @Override\n    public void setUser(User user)\n    {\n        this.user =\
    \ user;\n    }\n}\n```\n\n### Managed Bean\n\nThe class implements two properties,\
    \ which do not require any particular explanation, and the important thing is\
    \ naturally the method `login()`.\n\n```java\n@Named(value = \"authenticationCtrl\"\
    )\n@SessionScoped\npublic class AuthenticationCtrl implements Serializable\n{\n\
    \    @EJB\n    private AuthenticationBeanRemote authenticationBean; \n    private\
    \ User user;\n    private boolean authenticated = false;\n\n    public AuthenticationCtrl()\n\
    \    {\n    }\n\n    public String getUsername()\n    {\n        return getUser().getName();\n\
    \    }\n\n    public void setUsername(String username)\n    {\n        getUser().setName(username);\n\
    \    }\n}\n```\n"
