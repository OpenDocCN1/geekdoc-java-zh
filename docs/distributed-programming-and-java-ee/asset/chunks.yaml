    multiple functions (here the  max  function) and that the result is determined
    by  getSingleResult()  instead of  getResultList():


    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<Integer> cq =  cb.createQuery(Integer.class);
    Root<Book> root = cq.from(Book.class); cq.select(cb.max(root.get(Book_.pages)));


    Integer pages = em.createQuery(cq).getSingleResult();


    or shorter:


    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<Integer> cq =  cb.createQuery(Integer.class);
    Integer pages = em.createQuery(


    cq.select(cb.max(cq.from(Book.class).get("pages")))).getSingleResult();


    I will then show with some examples how to determine the values for specific columns,    
    and thus specific properties in the entity class.  The next query determines  id  and  title  of     
    all  Book  objects  where  the  page  number  are  greater  than  300:


    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<Object[]> cq =  cb.createQuery(Object[].class);
    Root<Book> root = cq.from(Book.class);


    Path<Integer> idPath = root.get(Book_.id); Path<String> titlePath = root.get(Book_.title);


