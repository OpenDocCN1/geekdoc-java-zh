    If you go back to the start page and click the  Administration  link, you will
    get the following page where you can edit a time (which will not be saved):


    ![](images/00239.jpeg)


    The code is trivial and will not be shown here. Below are the project  files,
    and here you should note that the page  start.html  is located in a folder  admin,
    and that in WEB-INF is  added a configuration  file  glassfish-web.xml  (a Glassfish
    Descriptor  file):


    ![](images/00240.jpeg)<map name="awmap25" class="calibre1"><area shape="rect"
    href="http://www.sylvania.com/" coords="141, 38, 237, 49" class="calibre39"></map>![](images/00241.jpeg)


    ![](images/00242.jpeg)


    7.2 CONTAINER MANAGED  AUTHENTICATION AND AUTHORIZATION


    I  will  start  by  showing  how  to  let  the  container  (the  Glassfish  server)  control  users’  access  to
    the individual pages.  This is done solely with the configuration  files, and
    without changing the  application’s  code,  as  well  as  by  creating  Glassfish  users.


    Glassfish  manages  user  and  user  rights  using  so-called  security  realms,  which  basically  is  a
    collection of users with associated security groups. A user can be linked to one
    or more groups,  and  these  groups  defines  what  actions  the  container  will  allow  the  user  to  perform.
    For example, an application may have regular users who can only perform specific
    tasks and  administrators  who  can  perform  all  tasks.


    Glassfish has three realms from the start, but you can create your own.  The three
    predefined realms are:'
