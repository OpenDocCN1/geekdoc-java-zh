  trans: "\n一个带有简单方法的 `Java` 类非常常见，首先要注意到的一点是该方法被一个注解所装饰了。该方法有一个 `InvocationContext`\
    \ 参数，可以提供更多服务。`getTarget()` 方法返回执行该方法的对象，而 `getMethod()` 方法返回一个代表 `interceptedObject`\
    \ 对象中被执行的方法的对象。最后，有一个 `proceed()` 方法，它负责执行 `interceptedMethod()` 方法。在调用 `proceed()`\
    \ 的前后两边都执行了 `System.out.println()`，这简单来说就意味着在 Glassfish 服务器的日志中写入一行。结果是，如果一个方法执行了\
    \ `logMethodCall()`，日志文件中就会写入一行，之后执行该方法，然后再次写入日志文件。\n\n那么问题在于，如何获取被执行的方法并让它发生，而这（当然）是通过注解完成的：\n\
    \n```java\n@Override\n@Interceptors({AddressInterceptor.class})\npublic void save(Address\
    \ address) throws Exception\n{\n    EntityManager em = null;\n    try\n    {\n\
    \        em = Persistence.createEntityManagerFactory(\"AddressEJB-ejbPU\").createEntityManager();\n\
    \        em.getTransaction().begin();\n        em.persist(address);\n        em.getTransaction().commit();\n\
    \    }\n    catch (Exception ex)\n    {\n        throw new Exception();\n    }\n\
    \    finally\n    {\n        if (em != null) em.close();\n    }\n}\n```\n\n也就是说，在创建地址之前写入日志文件，在数据库更新后再次写入。\n\
    \n### 3.6 定时器服务 (TIMER SERVICE)\n\n有一种实现定时器的会话 bean（session bean）特殊变体。因此，你可以让实际\
    \ bean 在特定的间隔内执行操作，例如向日志文件中写入内容。在这种情况下，我将编写一个会话 bean，每半秒确定一次下一个素数。我从一个名为 `PrimesEJB`\
    \ 的企业级项目开始，包含一个 EJB 模块和一个 Web 应用程序。对于 EJB 模块，我添加了一个 EJB，但这次是一个定时会话 bean：\n\n![](img/00128.jpeg)\n\
    \n随后你将看到以下窗口，你应该像通常一样输入一个名称（这里是 `PrimesSession`）和一个包名（`primes.ejbs`）。我还选择了它必须是\
    \ `Singleton`（单例），并且应该创建一个 `Local` 接口：\n\n![](img/00129.jpeg)\n\n![](img/00130.jpeg)![](img/00131.jpeg)最后，我设置了定时器跳动的时间间隔。在这种情况下，该模式意味着定时器必须每半分钟跳动一次。点击“Finish”后，NetBeans\
    \ 会创建以下类：\n\n```java\npackage primesejb.ejbs;\n\nimport javax.ejb.Schedule;\n\
    import javax.ejb.Singleton;\n\n@Singleton\npublic class PrimesSession implements\
    \ PrimesSessionLocal\n{\n    @Schedule(hour = \"*\", minute = \"*\", second =\
    \ \"*/30\")\n    public void myTimer()\n    {\n    }\n}\n```\n\n以及一个定义的接口。可见，它是一个普通的会话\
    \ bean，唯一的区别是了一个定时器方法，并用 `@Schedule` 注解定义了它是一个定时函数以及它应该跳动的频率。完成后的接口是：\n\n```java\n\
    package primesejb.ejbs;\n\nimport javax.ejb.Local;\nimport java.math.BigInteger;\n\
    \n@Local\npublic interface PrimesSessionLocal\n{\n    public void myTimer();\n\
    \    public void reset();\n    public BigInteger getPrime();\n    public int getIndex();\n\
    }\n```\n\n其中除了定时器外，还定义了三个方法。`PrimesSession` 类将该接口：\n\n```java\npackage primesejb.ejbs;\n\
    \nimport java.math.BigInteger;\nimport javax.ejb.Schedule;\nimport javax.ejb.Singleton;\n\
    \n@Singleton\npublic class PrimesSession implements PrimesSessionLocal\n{\n  \
    \  private BigInteger two = new BigInteger(\"2\");\n    private BigInteger prime\
    \ = new BigInteger(\"2\");\n    private int index = 0;\n\n    @Schedule(hour =\
    \ \"*\", minute = \"*\", second = \"*/30\")\n    public void myTimer()\n    {\n\
    \        if (prime.equals(two)) prime = new BigInteger(\"3\");\n        else\n\
    \        {\n            prime = prime.add(two);\n            while (!prime.isProbablePrime(50))\
    \ prime = prime.add(two);\n        }\n        ++index;\n    }\n\n    public void\
    \ reset()\n    {\n        prime = two;\n        index = 0;\n    }\n\n    public\
    \ BigInteger getPrime()\n    {\n        return prime;\n    }\n\n    public int\
    \ getIndex()\n    {\n        return index;\n    }\n}\n```\n\n你应该注意，该类有三个实例变量，由于它是一个单例会话\
    \ bean，这些变量将从 `PrimesSession` 类首次初始化开始保留其值，直到 Glassfish 服务器停止。也就是说，多次启动应用程序，会话\
    \ bean 的状态也将得以保留。该类最重要的部分当然是定时器方法，它修改了变量 `index`。EJB 模块已完成。我在 Web 应用程序中添加了一个命名的\
    \ bean：\n\n```java\npackage primesejb.beans;\n\nimport javax.inject.Named;\nimport\
    \ javax.enterprise.context.RequestScoped;\nimport java.math.BigInteger;\nimport\
    \ javax.ejb.EJB;\nimport primesejb.ejbs.PrimesSessionLocal;\n\n@Named\n@RequestScoped\n\
    public class PrimesBean\n{\n    @EJB\n    private PrimesSessionLocal sessionSession;\n\
    \n    public PrimesBean() {\n    }\n\n    public BigInteger getPrime()\n    {\n\
    \        return sessionSession.getPrime();\n    }\n\n    public int getIndex()\n\
    \    {\n        return sessionSession.getIndex();\n    }\n\n    public void reset()\n\
    \    {\n        sessionSession.reset();\n    }\n}\n```\n\n这是一个非常简单的 bean，没什么特别需要注意的，但你需要意识到它使用了\
    \ session bean。JSF 页面同样简单并在浏览器中打开。\n\n### 3.7 单表 CRUD\n\n在数据库上下文中，CRUD 代表创建（Create）、读取（Read）、更新（Update）和删除（Delete）操作，在本节中我将向你展示如何使用\
    \ EJB 在单表上执行这些操作。应用程序必须使用带有远程接口的 EJB。作为示例，我将使用数据库 `padata` 中的 `zipcode` 表，应用程序应该打开如上所示的窗口，其中搜索了邮编\
    \ 78。按钮的含义应该是显而易懂的，点击表格中的链接会将邮编插入顶部的两个字段中以便进行编辑。接下来，我将解释如何编写程序以及相应的过程。\n\n我开始创建一个\
    \ EJB 模块项目，命名为 `ZipcodesEJB`。然后我创建了一个普通的类库项目，命名为 `ZipcodesRemote`。对于该项目，我添加了 `ZipcodeRemote`\
    \ 类，它应该代表在 Web 应用程序和会话 bean 对象之间传输的对象（未显示 get setter 方法）：\n\n```java\npackage\
    \ zipcodes.beans;\n\nimport javax.ejb.Remote;\nimport java.io.Serializable;\n\n\
    @Remote\npublic class ZipcodeRemote implements java.io.Serializable\n{\n    private\
    \ String code;\n    private String city;\n\n    public ZipcodeRemote() {\n   \
    \ }\n}\n```\n\n然后我向 `ZipcodesEJB` 项目添加了一个命名的远程无状态会话 bean，名为"
