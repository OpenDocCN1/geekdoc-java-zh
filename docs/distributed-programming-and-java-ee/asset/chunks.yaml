    2. `WorldEJB`, which is a EJB Module projct\n3. `WorldClient`, which is a web\
    \ application\n\n![](images/00157.jpeg) 4![](images/00158.jpeg)\n\n### CDI\n\n\
    CDI stands for `Context and Dependency Injection` and describes how the application\
    \ server creates and remove objects, and especially what you can and should write\
    \ in the code. For example, if you consider a JSF page with a backing bean, which\
    \ is just a common Java class, then you do not need to do anything to create an\
    \ object of the class and how long the object lives is determined by its scope\
    \ with an annotation.\n\n![](images/00159.jpeg) A JavaBean is just a class that\
    \ is written from a specific and simple pattern, and the programmer creates an\
    \ object (a bean) using the `new` operator. After that, it is the garbage collector\
    \ who is responsible for removing the object when there are no longer any references\
    \ to it. In contrast, a managed bean is a bean, where it is the container in the\
    \ form of the application server, which is responsible for creating an object\
    \ and removing the object again when the program goes out of the object’s scope.\
    \ Such a bean is also called a CDI object. You can not create a managed bean with\
    \ `new`. CDI objects are instead created using a technique called injection, which\
    \ means that it is the container that takes care of it. When defining a bean with\
    \ injection, the container will examine whether the bean is created and if not,\
    \ it will instantiate a new object and perform injection on all beans to which\
    \ the current bean depends and finally, a method decorated with `@PostConstruct`\
    \ is performed.\n\n| This e-book is made with SETASIGNSetaPDF PDF components for\
    \ PHP developers ![](images/00091.jpeg) |\n| :--- |\n| www.setasign.com |\n\n\
    Then you can use the object’s methods. When the bean has to be removed, the container\
    \ will first perform a method decorated with `@PreDestroy`, after which it is\
    \ the container that remove the object. It can be illustrated by the following\
    \ figure:\n\n![](images/00160.gif)\n\nCDI objects have a scope that is called\
    \ `context`, and it can basically be request-application-conversation. As an example,\
    \ below is shown a simple bean:\n\n```java\npackage cdiprogram.beans;\nimport\
    \ javax.inject.Named;\nimport javax.enterprise.context.SessionScoped;\nimport\
    \ java.io.Serializable;\n\n@Named(value = \"person\")\n@SessionScoped\npublic\
    \ class Person\n{\n    private String firstName;\n    private String lastName;\n\
    \n    public Person()\n    {\n    }\n\n    public String getFirstName()\n    {\n\
    \        return firstName;\n    }\n\n    public void setFirstName(String firstName)\n\
    \    {\n        this.firstName = firstName;\n    }\n\n    public String getLastName()\n\
    \    {\n        return lastName;\n    }\n\n    public void setLastName(String\
    \ lastName)\n    {\n        this.lastName = lastName;\n    }\n}\n```\n\nThe interesting\
    \ thing is to open the page, the Glassfish server will inject a `Person` object\
    \ with context session, without the programmer being – or can – doing something\
    \ to create the object.\n\nIn the previous examples I have often had to use a\
    \ named bean from another named bean, which has been done by means of statements\
    \ of the form\n\n```\nELContext elc = FacesContext.getCurrentInstance().getELContext();\n\
    SomeBean someBean = (SomeBean)FacesContext.getCurrentInstance().getApplication().getELResolver().getValue(elc,\
    \ null, \"person\");\n```\n\nThere’s nothing wrong with it, but it’s hard to write\
    \ and impossible to remember. One can, however, facilitate the syntax by the use\
    \ of CDI. With the above bean available you can write the following JSF page:\n\
    \n```xml\n<?xml version='1.0' encoding='UTF-8' ?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
    \ XHTML 1.0 Transitional//EN\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    \ xmlns:h=\"http://xmlns.jcp.org/jsf/html\">\n<h:head>\n    <title>Facelet Title</title>\n\
    </h:head>\n<h:body>\n    <h:form>\n        <h:panelGrid columns=\"2\">\n     \
    \       <h:outputLabel for=\"firstName\" value=\"First Name\"/>\n            <h:inputText\
    \ id=\"firstName\" value=\"#{person.firstName}\"/>\n            <h:outputLabel\
    \ for=\"lastName\" value=\"Last Name\"/>\n            <h:inputText id=\"lastName\"\
    \ value=\"#{person.lastName}\"/>\n            <h:commandButton value=\"OK\" />\n\
    \        </h:panelGrid>\n    </h:form>\n</h:body>\n</html>\n```\n\n![](images/00161.jpeg)<map\
    \ name=\"aw17\" class=\"calibre74\"><area shape=\"rect\" href=\"http://www.sylvania.com/\"\
