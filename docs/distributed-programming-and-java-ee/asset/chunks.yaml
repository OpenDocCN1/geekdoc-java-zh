    First, there should be a reference to the class library  HelloRemote.  Then an
    object of the  type  Message  is created, and the return type for  getXml()  has
    been changed to  Message.  The method’s  MediaType  is  still  XML.  As  a  result,  the  object  msg  is  encoded  as  XML  before  it
    is sent to a client. Similarly,  putXml()  is changed, so it has a  Message  object
    as parameter, and the method updates the  msg   object.  This is of course pseudo,
    since the changes are     not  used  for  something  –  the  message  msg  does  not  exist  between  two  calls  of  the  service.


    After the service has been changed and after a deploy, the client program must
    also be updated. First, the class  HelloService  should be changed slightly.  The
    resource is represented by an object of the type  WebTarget, and if you on this
    object performs the method  request()  it  calls  the  service’s  get  method
     (here  it  is  getXml()  that  is  decorated  with  @GET).  It  tells to encode
    data as XML. Finally, with the  get()  method, you specify how the result should  be  converted  and  before  it  was  to  a  String.  It’s  changed  to  the  type  Message,  and  that’s  all
    that’s  necessary  to  change  in  the  HelloClient  class:


    public String getXml() throws ClientErrorException


    {


    WebTarget resource = webTarget;


    return resource.request(javax.ws.rs.core.MediaType.APPLICATION_XML). get( Message.class);


    }


    Finally, the  main()  method in  HelloREST  must be changed:


    package hellorest;


    import helloremote.entities.Message;


    public class HelloREST


    {


    public static void main(String[] args)


    {


    Message msg;


    HelloClient client = new HelloClient(); System.out.println(msg = client.getXml());
    msg.setJob("Danish Viking"); client.putXml(msg);


    client.close(); System.out.println(); System.out.println(msg);


    }


    }


