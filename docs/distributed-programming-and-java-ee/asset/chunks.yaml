  trans: "\n\n## 领域定义 (Realms Definition)\n\n1. `admin-realm`: 用于 `Glassfish` 管理 Web\
    \ 应用的用户维护，不应用于其他应用程序的用户。\n2. `certificate`: 用于用户身份验证的客户端证书。\n3. `file`: 存储普通用户信息。\n\
    \n![](img/00243.jpeg)\n\n点击 `file` 领域将获得该区域的属性，点击 `Manage Users`（管理用户）按钮将提供用户概览。我创建了三个用户，将在后续使用：\n\
    \n![](img/00244.jpeg)\n\n现在我将在以下情况下使用这些用户对上述应用程序进行页面验证：\n\n1. 仅属于 `student` 组的用户必须访问\
    \ `index.html`\n2. 属于 `staf` 组的用户必须访问 `index.xhtml` 和 `enter.html`\n3. 属于 `admin`\
    \ 组的用户必须访问所有三个页面。\n\n我添加了以下 `web.xml`:\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<web-app xmlns=\"http://xmlns.jcp.org/xml/ns/javaee\" xmlns:xsi=\"\
    http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"http://xmlns.jcp.org/xml/ns/javaee\
    \ http://xmlns.jcp.org/xml/ns/javaee/web-app_3_1.xsd\" version=\"3.1\">\n    <session-config>\n\
    \        <session-timeout>30</session-timeout>\n    </session-config>\n    <security-constraint>\n\
    \        <web-resource-collection>\n            <web-resource-name>Admin Pages</web-resource-name>\n\
    \            <url-pattern>/admin/*</url-pattern>\n        </web-resource-collection>\n\
    \        <auth-constraint>\n            <role-name>admin</role-name>\n       \
    \ </auth-constraint>\n    </security-constraint>\n```\n\n![](img/00245.jpeg)<<map\
    \ name=\"awmap26\" class=\"calibre1\"><area shape=\"rect\" href=\"http://www.deloitte.ca/careers\"\
    \ coords=\"120, 426, 310, 444\" class=\"calibre39\"></map>![](img/00246.jpeg)\n\
    \n```xml\n    <security-constraint>\n        <web-resource-collection>\n     \
    \       <web-resource-name>AllPages</web-resource-name>\n            <url-pattern>/*</url-pattern>\n\
    \        </web-resource-collection>\n        <auth-constraint>\n            <role-name>staf</role-name>\n\
    \        </auth-constraint>\n    </security-constraint>\n    <security-constraint>\n\
    \        <web-resource-collection>\n            <web-resource-name>Start Page</web-resource-name>\n\
    \            <url-pattern>/index.html</url-pattern>\n        </web-resource-collection>\n\
    \        <auth-constraint>\n            <role-name>student</role-name>\n     \
    \   </auth-constraint>\n    </security-constraint>\n    <login-config>\n     \
    \   <auth-method>BASIC</auth-method>\n        <realm-name>file</realm-name>\n\
    \    </login-config>\n</web-app>\n```\n\n## 安全配置分析\n\n用户权限定义为 `security-constraint`\
    \ 元素，在本例中共有三个。`security-constraint` 元素定义了它涉及的页面以及用户应该拥有的角色。第一个通过 `url-pattern`\
    \ 元素实现，而其他通过 `role-name` 元素实现。\n\n查看第一个 `security-constraint`，它适用于所有名称以 `admin`\
    \ 开头的页面，即 `admin` 文件夹下的所有页面。只有拥有 `admin` 角色的用户才能访问这些页面。下一个 `security-constraint`\
    \ 元素适用于所有页面，但要求用户拥有 `staf` 角色。最后是 `security-constraint`，它适用于特定的页面（起始页）以及拥有 `student`\
    \ 角色的用户。\n\n最后一个元素称为 `login-config`，用于定义如何进行身份验证。基本上有三种选项：\n\n1. `BASIC`：交给浏览器进行身份验证。\n\
    2. `FORM`：交给程序执行身份验证。\n3. `CLIENT-CERT`：需要证书。\n\n查看上述角色名称，它们仅引用当前应用程序，而不引用特定的用户组。因此，必须对这些名称进行映射，映射在\
    \ `glassfish` 的 `web.xml` 中完成：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n<!DOCTYPE glassfish-web>\n<glassfish-web>\n    <security-role>\n        <role-name>admin</role-name>\n\
    \        <group-name>admin</group-name>\n    </security-role>\n    <security-role>\n\
    \        <role-name>staf</role-name>\n        <group-name>staf</group-name>\n\
    \    </security-role>\n    <security-role>\n        <role-name>student</role-name>\n\
    \        <group-name>student</group-name>\n    </security-role>\n</glassfish-web>\n\
    ```\n\n## HTTPS 与 SSL\n\n通常，安全的 Internet 连接需要从`证书颁发机构`（CA）购买证书，例如 `Verisign` 或\
    \ `Thawte`。这种证书需要花费费用（约 500 美元）并且每年需要更新。这对于开发目的可能不太方便，因此 Glassfish 自带了一个自签名证书，并预配置为支持在\
    \ 8181 端口上的 HTTPS。这种自签名证书任何人都可以制作，因此是不可靠的。如果你在上述更改 `web.xml` 后打开应用程序，将看到以下窗口（Firefox）：\n\
    \n![](img/00250.jpeg)\n\n"
- fmt: "\nIf you click Advanced, you get the following option (which is a warning):\n\
    \n![](images/00251.jpeg)\n\nIf you click on the button, you’ll get another warning:\n\
    \n![](images/00252.jpeg)\n\nand clicking on the last button means that you have\
    \ accepted the unsecured certificate and the usual login window appears. If you\
    \ close the browser and reopen the program, you will not get the above warnings,\
    \ and the login window will open immediately.\n\nYou should note that if you opens\
    \ the program in the usual way by entering the address\n\n`http://localhost:8080/SecurityApp1/`\n\
    \nit is the login window as shown below. That is, the address is automatically\
    \ redirected to the HTTPS protocol and port 8181:\n\n![](images/00253.jpeg)\n\n\
    ![](images/00254.jpeg)7.3![](images/00255.jpeg)[](images/00256.jpeg)[](images/00257.jpeg)[](images/00258.jpeg)[](images/00259.jpeg)[](images/00260.jpeg)[](images/00261.jpeg)[](images/00262.jpeg)[](images/00263.jpeg)\n\
    \n## FORM AUTHENTICATION\n\nIn the example above, it is the browser that has shown\
    \ the login window and it is, in principle, excellent but you can also write your\
    \ own login form. There may be at least two reasons for it including that you\
    \ decide how the form should look but it also allows you to implement a logout\
    \ function. In the following example I will show how to do but first I will change\
    \ the program itself.\n\nThe introductory example, the project consists of three\
    \ HTML pages but in practice it will be JSF pages with backing beans, which requires\
    \ a few changes. The `SecurityApp2` project is expanded with two new JSF pages\
    \ compared to the previous project, and in addition, the three original pages\
    \ have been changed to JSF pages: ![](images/00264.jpeg)\n\nThe error page is\
    \ trivial and consists solely of a text and a link to `login.xhtml`, and the page\
    \ is used if you enter a user is not found or you entered an illegal password.\
    \ The most important thing about the example is the `login.xhtml` page:\n\n```xml\n\
    <?xml version='1.0' encoding='UTF-8' ?>\n<!DOCTYPE html PUBLIC \"\" \">\n<html\
    \ xmlns=\"http://www.w3.org/1999/xhtml\" xmlns:h=\"http://xmlns.jcp.org/jsf/html\"\
    >\n<h:head>\n<title>Facelet Title</title>\n</h:head>\n<h:body>\n<h2>Enter username\
    \ and password</h2>\n<form method=\"POST\" action=\"j_security_check\">\n<table\
    \ cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n<tr>\n<td align=\"right\"\
    >Username:&nbsp;</td>\n<td><input type=\"text\" name=\"j_username\"/></td>\n</tr>\n\
    <tr>\n<td colspan=\"2\" style=\"height:10px\"></td>\n</tr>\n<tr>\n<td align=\"\
    right\">Password:&nbsp;</td>\n<td><input type=\"password\" name=\"j_password\"\
    /></td>\n</tr>\n<tr>\n<td colspan=\"2\" style=\"height:20px\"></td>\n</tr>\n<tr>\n\
    <td></td>\n<td><input type=\"submit\" value=\"Login\"/></td>\n</tr>\n</table>\n\
    </form>\n</h:body>\n</html>\n```\n\nIt is a JSF page, but no JSF elements are\
    \ used, and in particular it is important that the `form` element is not a `h:form`\
    \ element. Here you should note the `action` attribute, which refers to `j_security_check`,\
    \ which specifies the code that the application performs. For the same reasons,\
    \ the two input fields must be named `j_username` and `j_password`.\n\nThe last\
    \ thing that must happen to use form authentication is the change of `web.xml`,\
    \ where the `login-config` element is changed to the following:\n\n```xml\n<login-config>\n\
    <auth-method>FORM</auth-method>\n<realm-name>file</realm-name>\n<form-login-config>\n\
    <form-login-page>/faces/login.xhtml</form-login-page>\n<form-error-page>/faces/error.xhtml</form-error-page>\n\
    </form-login-config>\n</login-config>\n```\n\nWhen you opens the application,\
    \ you will see the window below, where you will enter the username and password.\
    \ In this case, it is a very simple form, but you can of course modify `login.xhtml`,\
    \ so you get a nicer design that fits the current application. Note that the address\
    \ bar shows that a secure internet connection is being used.\n\n![](images/00265.jpeg)\
    \ ![](images/00266.jpeg)[](images/00267.jpeg)After entering your username and\
    \ password, you will get to `index.xhtml`:\n\n![](images/00268.jpeg)\n\nThe window\
    \ looks a bit different, but it is important that there is a link to logout. As\
    \ mentioned above, the page has a managed bean:\n\n```java\npackage securityapp.beans;\
    \ import javax.inject.Named;\n\nimport javax.enterprise.context.SessionScoped;\
    \ import java.io.Serializable;\n\n@Named(value = \"indexBean\")\n@SessionScoped\n\
    public class IndexBean implements Serializable\n{\n    public String admin()\n\
    \    {\n        return \"admin/start?faces-redirect=true\";\n    }\n    public\
    \ String enter()\n    {\n        return \"enter?faces-redirect=true\";\n    }\n\
    }\n```\n\nThe two action methods should do nothing but redirect to the two pages\
    \ `start.xhtml` and `enter.xhtml` that happens when you click on one of the two\
    \ buttons. When a JSF page performs an action, it happens with the POST method,\
    \ and instead of performing a redirection, a forward is performed. Therefore,\
    \ the user role is not validated (or it only happens when you leave a page again).\
    \ To solve the problem (so the application works like the previous application),\
    \ as described above, you must force a redirection.\n\nClicking on the Logout\
    \ link, is called a method `logout()` in a manged bean `LogoutBean.java`:\n\n\
    ```java\npackage securityapp.beans; import javax.inject.Named;\n\nimport javax.enterprise.context.RequestScoped;\n\
    \nimport javax.faces.context.*; import javax.servlet.http.*;\n\n@Named(value =\
    \ \"logoutBean\") @RequestScoped\n```\n"
