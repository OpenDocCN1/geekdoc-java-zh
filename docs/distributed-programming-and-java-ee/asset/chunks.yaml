  trans: "\n\n如上所示，Web 服务无非是一个装饰了几个注解的普通 Java 类，并整体被封装在一个 Web 应用程序中。你也可以使用无状态会话豆（stateless\
    \ session bean）作为 Web 服务。它允许从 Java 以外的其他语言使用无状态 EJB，并可以使用企业级 Java Bean（enterprise\
    \ beans）的其他属性，例如事务。事实上，你可以通过两种方式实现：通过在 EJB 中创建 Web 服务，或者将 EJB 嵌入为 Web 服务。\n\n\
    ## 示例 1：带有无状态会话豆的 EJB 模块\n\n![](img/00201.jpeg)\n<map name=\"awmap22\" class=\"\
    calibre474\"><area shape=\"rect\" href=\"http://www.ligsuniversity.com/\" coords=\"\
    173, 433, 413, 459\" class=\"calibre475\"></map>\n![](img/00202.jpeg)\n\n作为一个示例，我建立了一个\
    \ EJB 模块项目，将其命名为 `EJBConversion`。对于这个项目，我添加了一个名为 `Conversion` 的 Web 服务：\n\n![](img/00203.jpeg)\n\
    \n注意，我选择了 `Create Web Service from Scratch`（从头创建 Web 服务），并勾选了底部的复选框。点击 `Finish`\
    \ 后，创建了一个 Web 服务，其中主要的区别在于，它是一个无状态会话豆。完成后的服务所示：\n\n```java\npackage ejbconversion.services;\n\
    \nimport javax.jws.WebService; import javax.jws.WebMethod; import javax.jws.WebParam;\
    \ import javax.ejb.Stateless;\n\n@WebService(serviceName = \"Conversions\") @Stateless()\n\
    \npublic class Conversions\n{\n\n@WebMethod(operationName = \"celsiusToFahrenheit\"\
    )\npublic double celsiusToFahrenheit(@WebParam(name = \"value\") double value)\n\
    {\nreturn 1.8 * value + 32;\n}\n\n@WebMethod(operationName = \"fahrenheitToCelsius\"\
    )\npublic double fahrenheitToCelsius(@WebParam(name = \"value\") double value)\n\
    {\nreturn (value – 32) / 1.8;\n}\n\n}\n```\n\n然后就可以按照通常方式构建并部署该项目。`ConversionProgram`\
    \ 项目与 `ConversionClient` 相同，区别仅于使用了另一个 Web 服务（如所示），这是一个作为企业级 Java Bean 托管的 Web\
    \ 服务。\n\n## 示例 2：使用现有的 EJB\n\n作为最后一个示例，我将编写一个使用现有 EJB 的 Web 服务，我将使用 `ZipcodesEJB`，它对数据库\
    \ `padata` 中的 `zipcode` 表执行 CRUD（增删改查）操作。相关的 EJB 提供了 4 个服务，目标是通过 Web 服务提供这些服务。\n\
    \n起点是一个名为 `ZipcodesServices` 的空 Web 应用程序。第一步，我放入了对 jar 文件 `ZipcodesRemote` 的引用，它是\
    \ `ZipcodesEJB` 的远程接口。接下来，我向项目添加了一个名为 `ZipcodesWS` 的 Web 服务：\n\n![](img/00204.jpeg)\n\
    \n在这里你应该特别注意，我选择了 `Create Web Service from Existing Session Bean`（从现有会话豆创建 Web\
    \ 服务），然后我浏览到了那个特定的豆。当你点击 `Finish` 时，NetBeans 会创建以下 Web 服务：\n\n```java\npackage\
    \ zipcodesservices;\n\nimport java.util.List; import javax.ejb.EJB; import javax.jws.WebMethod;\
    \ import  javax.jws.WebParam;\nimport javax.jws.WebService;\nimport zipcodes.beans.ZipcodeRemote;\n\
    import zipcodes.beans.ZipcodesSessionRemote;\n\n@WebService(serviceName = \"ZipcodesWS\"\
    ) public class ZipcodesWS\n{\n\n@EJB\nprivate ZipcodesSessionRemote ejbRef;\n\n\
    @WebMethod(operationName = \"create\")\npublic boolean create(@WebParam(name =\
    \ \"obj\") ZipcodeRemote obj)\n{\nreturn ejbRef.create(obj);\n}\n```\n\n![](img/00205.jpeg)!(images/00206.jpeg)\n\
    \n@WebMethod(operationName = \"update\")\npublic boolean update(@WebParam(name\
    \ = \"obj\") ZipcodeRemote obj)\n{\nreturn ejbRef.update(obj);\n}\n\n@WebMethod(operationName\
    \ = \"remove\")\npublic boolean remove(@WebParam(name = \"code\") String code)\n\
    {\nreturn ejbRef.remove(code);\n}\n\n@WebMethod(operationName = \"search\")\n\
    public List<ZipcodeRemote> search(@WebParam(name = \"code\") String code, @WebParam(name\
    \ = \"City\") String City)\n{\nreturn ejbRef.search(code, City);\n}\n\n}\n```\n\
    \n正如你看到的，它仅仅是 `ZipcodesEJB` 的一个封装器。服务随后完成后，可以被翻译并托管在服务器上。\n\n然后我写了一个客户端，这是一个名为\
    \ `ConversionProgram` 的 Web 应用程序。它基本上与 `ConversionClient` 相同，区别在于添加了一个 Web 服务，我不想展示代码。\n\
    \n## 理解 REST 服务\n\nREST 代表表象层状态转移（Representational State Transfer）。与其他 Web 服务一样，它们可以被视为由\
    \ URI 标识的资源，数据通常以 XML 形式发送。`HTTP` 方法：\n1. `GET`: 用于检索现有资源\n2. `POST`: 用于创建新资源\n\
    3. `PUT`: 用于更新现有资源\n4. `DELETE`: 用于删除现有资源\n\n我想从一个简单的（hello）Web 应用程序开始，我将其命名为\
    \ `HelloApp`。创建项目后，我添加了 RESTful Web Services：\n\n![](img/0208.jpeg)\n![](img/0209.jpeg)\n\
    \n我输入了 Resource、`Path` 和类名。注意 MIME 类型为 XML。当我随后点击 `Finish` 时，NetBeans 创建了两个文件：\n\
    \n![](img/0210.jpeg)\n\n加入马斯里希特大学商学院：\n- 第 33 名：全球硕士\n- 第 1 名：国际商务硕士\n- 第 1 名：管理硕士\n\
    - ...：计量经济学与运筹硕士\n\n![](img/0211.jpeg)\n<map name=\"awmap23\" class=\"calibre1\"\
    ><area shape=\"rect\" href=\"http://www.ligsuniversity.com/\" coords=\"498, 416,\
    \ 517, 438\" class=\"calibre39\"><area shape=\"rect\" href=\"http://www.ligsuniversity.com/\"\
    \ coords=\"498, 394, 707, 416\" class=\"calibre39\"></map> \n\n![](img/0212.jpeg)\n\
    \n最后一个是我的 RESTful Web 服务。代码如下，我删除了注释，并在 `getXml()` 方法中输入了代码：\n\n```java\npackage\
    \ helloapp.services;\n\nimport javax.ws.rs.core.Context; import javax.ws.rs.core.UriInfo;\
    \ import javax.ws.rs.Produces; import javax.ws.rs.Consumes; import  javax.ws.rs.GET;\n\
    import javax.ws.rs.Path; import  javax.ws.rs.PUT;\nimport javax.ws.rs.core.MediaType;\n\
    \n@Path(\"hello\")\npublic class HelloResource\n{\n\n@Context\nprivate UriInfo\
    \ context;\n\npublic HelloResource()\n{\n}\n\n@GET\n@Produces(MediaType.APPLICATION_XML)\
    \ public String getXml()\n{\nreturn\n\"<message>\\n\"\n+ \"<hello>Hello from</hello>\\\
    n\"\n+ \"<firstName>Ragnar</firstName>\\n\"\n+ \"<lastName>Lodbrog</lastName>\\\
    n\"\n+ \"<job>Viking</job>\\n\"\n+ \"</message>\\n\";\n}\n\n@PUT\n@Consumes(MediaType.APPLICATION_XML)\
    \ public void putXml(String content)\n{\n}\n\n}\n```\n"
- fmt: "\nYou must note the different annotations. Here, `@Path` specifies the name\
    \ for which the current service (resource) will be known. `@GET` defines a method\
    \ that is performed if an HTTP `GET` occurs from a browser, and similarly, `@PUT`\
    \ defines a method for an HTTP `PUT`. Note that the first method is decorated\
    \ with `@Produces`, which indicates that the method returns XML while the other\
    \ is decorated with `@Consumes`, which indicates that the method interprets the\
    \ content of the parameter as XML. In this case, the last method is empty, while\
    \ the first returns some XML.\n\nThe container must know what the resource is\
    \ called and that is the purpose of the second class:\n\n```java\npackage helloapp.services;\
    \ import java.util.Set;\n\nimport javax.ws.rs.core.Application;\n\n@javax.ws.rs.ApplicationPath(\"\
    webresources\") public class ApplicationConfig extends Application\n\n{\n    @Override\n\
    \    public Set<Class<?>> getClasses() {\n        Set<Class<?>> resources = new\
    \ java.util.HashSet<>(); addRestResourceClasses(resources);\n        return resources;\n\
    \    }\n\n    private void addRestResourceClasses(Set<Class<?>> resources)\n \
    \   {\n        resources.add(helloapp.services.HelloResource.class);\n    }\n\
    }\n```\n\nIt is a class inheriting `Application`, and the class is decorated with\
    \ `@ApplicationPath`, which specifies a name (here it is `webresources`) that\
    \ is included in the resource’s URI. The last method adds the actual resource\
    \ object to a collection (here it is a `HashSet`). The result of all that is,\
    \ the resource’s URI is `http://localhost:8080/helloapp/webresources/hello`\n\n\
    If you translate the project and perform a deploy, the resource is ready for use.\
    \ An RESTful Web Services item is created and if you right click on `HelloResource`\
    \ [hello]:\n\n![](images/00213.jpeg)\n\n![](images/00214.jpeg)![](images/00215.jpeg)you\
    \ can you choose Test Resource URI, after which the browser opens the following\
    \ window:\n\n![](images/00216.jpeg)\n\nThe result is that the method `getXml()`\
    \ is performed and the method has sent a response to the browser. As a next step,\
    \ I will write a client that uses the resource and it should be a simple console\
    \ application. I have therefore created a Java Application project called `HelloREST`.\
    \ For this project I have added a RESTful Java Client:\n\n![](images/00217.jpeg)\n\
    \nWhen you click Next, you get the following window:\n\n![](images/00218.jpeg)\n\
    \nHere I have entered Class Name, selected a package, and used the Browse button\
    \ set a reference to the resource. Note that Authentication is NONE (which is\
    \ default). After clicking Finish, NetBeans creates the following class that represents\
    \ the service to the client:\n\n```java\npackage hellorest;\n\nimport javax.ws.rs.ClientErrorException;\
    \ import javax.ws.rs.client.Client; import javax.ws.rs.client.WebTarget;\n\npublic\
    \ class HelloClient\n{\n    private WebTarget webTarget;\n    private Client client;\n\
