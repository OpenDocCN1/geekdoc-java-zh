  trans: "\n\n在之前的两本书中，我一直致力于 Web 应用程序，而这本书是其自然的延续，但侧重于分布式程序的开发。这些程序使用托管在不同计算机上的组件或服务来执行工作，这些组件通过网络进行通信和工作协作。其核心思想是，这些组件在很大程度上拥有自己的生命周期，相互独立运行，并且通常不知道使用它们提供的服务的客户端。事实上，要精确定义我们所理解的分布式程序并不容易，但通常我们将其理解为具有以下特征的程序：\n\
    \n1. 存在多个独立的计算单元（计算机），每个单元都有自己的本地内存。\n2. 计算单元通过在网络上相互发送消息来 get 通信。\n\n分布式程序（或系统）的目标可能是解决某个特定任务，用户会将这一系列计算单元感知为一个单一设备（或系统），但实质上，它们可能是一个面向服务的系统，提供了一系列用户可以使用并感知为共享资源的服务。分布式程序还具有并行性特征，即在多台计算机和多个位置同时执行多个活动。\n\
    \n你有时也会看到分布式编程被描述为面向对象编程的进一步发展。面向对象的程序由对象组成，每个对象的内部数据和逻辑对外部世界隐藏的，仅通过对象以公共方法形式提供的服务来感知。这些对象共同工作以解决要解决的任务。同样，你可以将分布式程序看作一种程序，它通过提供许多在世界各地计算机独立运行的服务来解决任务，如果允许的话，应用程序可以使用这些服务。\n\
    \n除了展示如何在实践中开发分布式程序（或者可能与此更相关）外，目标也是描述如标题所示的更具体的技术：\n\n- `Java Persistence API`\n\
    - `Java Enterprise Beans`\n- `Contexts and Dependency Injection`\n- `Java Web\
    \ Services`\n- `RESTFul web services`\n- `Java EE security`\n\n如书所示，这本书描述了许多 `Java\
    \ APIs`，并且大部分内容与 `NetBeans` 和 `GlassFish` 直接相关。\n\n# 2 JAVA PERSISTENCE API\n\n\
    在之前的书中（从 `Java 6` 开始）以及包括 `Java 11` 在内的 Web 应用程序中，我考虑过几个使用数据库的示例。这始终包括对数据库进行面向对象的封装，形式为每个数据库表创建一个模型类，并创建一个或多个封装了\
    \ `SQL` 语句的类，这些语句用于操作关系型数据库的内容。这意味着对于每个示例都需要编写大量的 Java 代码，虽然这是可以接受的（因为从原则上讲每次都应该发生相同的事情），但可以通过更简单（且更好）的方式完成，因为\
    \ `Java EE` 提供了一个名为 `Java Persistence API` 的 API，它的任务恰好是为关系数据库提供面向对象的接口。本章的目的是介绍这个\
    \ API，其内容很大程度上描述了“如何做”。\n\n我将从 `Java 11` 书中的项目 `ChangeAddress3` 的副本开始，我将副本命名为\
    \ `ChangeAddress1`。如果你在浏览器中打开该应用程序，你会看到以下窗口... [点击底部的链接]，你会得到另一个窗口，显示已输入地址的概览。\n\
    \n![](img/00005.jpeg)\n\n在输入地址时，它们被存储在 `Person` 对象的列表中。然而，数据并没有持久化存储。正如我在之前的示例中所示，创建一个带有表的数据库并在该表中保存数据是相对较的。在这个示例中，我将向你展示如何使用\
    \ `JPA` 来完成。\n\n在这个示例中，我想使用 `JavaDB` 作为数据库产品。主要是为了展示这个数据库，因为它在许多需要简单数据库的语境下非常有用且易于使用。它是一个标准的\
    \ `SQL` 数据库服务器，由 `Glassfish` 服务器支持，不需要任何特殊安装，该产品也受 `NetBeans` 支持。\n\n方法基本上是为每个数据库表定义一个实体类，我想从将一个类与\
    \ `model` 包关联开始。它必须是一个 `Entity Class`：\n\n![](img/00006.jpeg)\n\n并且应该命名为 `Address`：\n\
    \n![](img/00007.jpeg)\n\n你应该注意已选择了正确的包名（如果不在列表中可以手动输入），并且勾选了 `Create Persistence\
    \ Unit`。持久化单元是一个名为 `persistence.xml` 的 XML 配置文件，由 `NetBeans` 创建。当你点击上述窗口中的 `Next`\
    \ 时，你会得到一个初始化此 XML 文件的窗口。如果你愿意，可以更改名称，并注意已勾选 `Use Java Transaction APIs`。默认情况下选择了\
    \ `Create`，这意味着如果数据库尚未创建，则必须创建。\n\n![](img/00008.jpeg)\n\n然而，最重要的是 `Data Source`\
    \ 字段，它是对当前数据库的引用。在这里你可以选择现有的 `data source`，也可以创建一个新的：\n\n![](img/00009.jpeg)\n\
    \n如果你点击 `New Data Source`，你会得到一个创建数据源的窗口：\n\n![](img/00010.jpeg)\n\n我在其中输入了名称\
    \ `addresses`。还必须定义到数据库的连接。在这里你可以选择现有的，也可以创建一个新的。在这种情况下，你必须创建一个新的，并选择一个驱动，我选择了\
    \ `Java DB (Network)`：\n\n![](img/00011.jpeg)\n![](img/00012.jpeg)\n![](img/00013.jpeg)\n\
    \n点击 `Next` 后，输入数据库信息：\n\n![](img/00014.jpeg)\n\n数据库服务器——`Glassfish` 服务器——运行在\
    \ `localhost` 上并使用端口 `1527`。我选择了数据库名称为 `addresses`。`Java DB` 有一个默认用户 `APP`，我输入了密码（1234）。然后点击两次\
    \ `Next` 最后点击 `Finish`，之后数据源已创建：\n\n![](img/00015.jpeg)\n\n当我点击 `OK` 时，`Entity\
    \ class` 被创建：\n\n![](img/00016.jpeg)\n\n然后我点击 `Finish`，`NetBeans` 创建了以下类（我删除了注释并稍微修改了\
    \ `equals()`）：\n\n```java\npackage changeaddress.models;\n\nimport java.io.Serializable;\n\
    import javax.persistence.*;\n\n@Entity\npublic class Address implements Serializable\n\
    {\n    private static final long serialVersionUID = 1L; \n    @Id\n    @GeneratedValue(strategy\
    \ = GenerationType.AUTO) \n    private Long id;\n\n    public Long getId()\n \
    \   {\n        return id;\n    }\n\n    public void setId(Long id)\n    {\n  \
    \      this.id = id;\n    }\n\n    @Override\n    public int hashCode()\n    {\n\
    \        int hash = 0;\n        hash += (id != null ? id.hashCode() : 0);\n  \
    \      return hash;\n    }\n\n    @Override\n    public boolean equals(Object\
    \ object)\n    {\n        if (!(object instanceof Address)) return false; \n \
    \       return id.equals(((Address)object).id);\n    }\n\n    @Override\n    public\
    \ String toString()\n    {\n        return \"changeaddress.models.Address[ id=\"\
    \ + id + \" ]\";\n    }\n}\n```\n"
- fmt: "\nThe result is a class with a single property `ID` of the type `Long`. You\
    \ should note that this property is decorated with two annotations, first indicating\
    \ that it is a primary key, while the other tells that the value should be assigned\
    \ by the database server as an auto number. Finally, you should note that the\
    \ class is also decorated with an annotation that tells that it is an entity class.\
    \ The class must then be expanded with the following properties:\n\n```java\n\
    private String firstname;\nprivate String lastname;\nprivate String address;\n\
    private String code;\nprivate String city;\nprivate String email;\nprivate String\
    \ date;\nprivate String title;\n```\n\nwith associated get and set methods. Then\
    \ I have deleted the model class `Person`, and in `IndexController`, all references\
    \ to `Person` must be changed to `Address`, and the code in the `add()` method\
    \ should be deleted. After that, the program can be opened in the browser again.\n\
    \n![](images/00017.jpeg)<map name=\"awmap3\" class=\"calibre1\"><area shape=\"\
    rect\" href=\"http://www.employerforlife.com/\" coords=\"544, 421, 554, 435\"\
    \ class=\"calibre39\"><area shape=\"rect\" href=\"http://www.employerforlife.com/\"\
    \ coords=\"544, 407, 676, 421\" class=\"calibre39\"></map>![](images/00018.jpeg)In\
    \ `IndexController`, you must add some additional statements:\n\n```java\npackage\
    \ changeaddress.beans;\nimport java.util.*;\n\nimport javax.inject.Named;\nimport\
    \ javax.enterprise.context.SessionScoped;\nimport java.io.Serializable;\n\nimport\
    \ javax.persistence.*;\nimport javax.transaction.*;\nimport javax.annotation.*;\n\
    import javax.persistence.criteria.CriteriaQuery;\n\nimport changeaddress.models.*;\n\
    \n@Named(value = \"indexController\")\n@SessionScoped\npublic class IndexController\
    \ implements Serializable\n{\n    @PersistenceUnit EntityManagerFactory emf;\n\
    \    @PersistenceContext EntityManager em;\n\n    @Resource UserTransaction utx;\n\
    \    private Address person = new Address();\n    private List<Address> persons\
    \ = new ArrayList();\n\n    …\n\n    public List<Address> getPersons()\n    {\n\
    \        try\n        {\n            CriteriaQuery cq = em.getCriteriaBuilder().createQuery();\n\
    \            cq.select(cq.from(Address.class));\n            Query q = em.createQuery(cq);\n\
    \            return persons = q.getResultList();\n        }\n        catch (Exception\
    \ ex)\n        {\n        }\n        return persons;\n    }\n\n    public void\
    \ add()\n    {\n        try\n        {\n            utx.begin();\n           \
    \ em.persist(person);\n            utx.commit();\n            person = new Address();\n\
    \        }\n        catch (Exception ex)\n        {\n            try\n       \
    \     {\n                utx.rollback();\n            }\n            catch (Exception\
    \ e)\n            {\n            }\n        }\n    }\n}\n```\n\nAt the start of\
    \ the class, three objects are defined each decorated with an annotation. The\
    \ exact meaning of this notation is explained in chapter 4, but as example, the\
    \ variable `em` has the type `EntityManager` and the preceding annotation means\
    \ that, on the basis of the Persistence Unit for the project, JPA instantiates\
    \ an object to the type `EntityManager` that is a JPA type, which represents a\
    \ database table and offers services that can perform database operations. The\
    \ last variable `utx` defines a transaction for a database operation. These objects\
    \ are used in the methods `getPersons()` and `add()`. For example, if you look\
    \ at the last one, it starts a transaction and then the method `persist()` writes\
    \ the object `person` to the database. Before the application can be used, the\
    \ database must be created. It happens under Services by right-click DB: ![](images/00019.jpeg)and\
    \ you choose Create Database. With these changes, the program works the same as\
