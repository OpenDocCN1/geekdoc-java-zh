    \ {\n        Set<Class<?>> resources = new java.util.HashSet<>(); addRestResourceClasses(resources);\n\
    \        return resources;\n    }\n\n    private void addRestResourceClasses(Set<Class<?>>\
    \ resources)\n    {\n        resources.add(helloapp.services.HelloResource.class);\n\
    \    }\n}\n```\n\n这是一个继承自 `Application` 的类，该类被 `@ApplicationPath` 装饰，它指定了一个名称（这里是\
