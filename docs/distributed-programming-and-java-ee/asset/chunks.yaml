    href="http://www.rug.nl/feb/education" coords="114, 429, 146, 453" class="calibre475"><area
    shape="rect" href="http://www.rug.nl/feb/education" coords="114, 405, 341, 428"
    class="calibre475"></map>![](images/00042.jpeg)![](images/00043.jpeg)![](images/00044.jpeg)![](images/00045.jpeg)![](images/00046.jpeg)![](images/00047.jpeg)Fields.
    Note that a  Named Query  is an example of a SELECT statement written as a variant
    of SQL called  JPQL.


    ![](images/00048.jpeg)


    ![](images/00049.jpeg)


    As a next step, you need to add a database controller, named  ZipcodeJpaController,
    for your entity class like in the previous example.


    You must create a named bean for  index.xhtml  when the result must be the above
    window, which shows a table with the zip codes.  The bottom entry  fields should
    act as a  filter:


    1. the  content  of  the  first  field  must  match  all  zip  codes  starting  with  the  value


    2. the  content  of  the  second  field  must  match  all  city  names  that  contains  the  value


    The  Clear  link should clear the two entry  fields (but should not update the
    table), while the  Update  link  should  update  the  table  corresponding  to  the  content  of  the  filter.  Loading
    the  database  table  should  only  take  place,  when  the  program  starts.
    You  can  do  that  in  your bean  to  write  a  method  init()  and  decorate  it  as  shown  below:


    @PostConstruct private void init()


    {


    ZipcodeJpaController ctrl = new ZipcodeJpaController(utx,  emf); zipcodes = ctrl.findZipcodeEntities();


    }


    It is a method that is performed immediately after the object is instantiated.


    2.2 RELATED  TABLES


    Writing a web application like the above is because of JPA  quite simple, but
    of course it      is also a simple application and primarily because the database
    has only one single table.      In this section I will show an example where the
    database has more tables and where there  are relationships between the individual
    tables, and here the benefits of JPA become even more  pronounced.


    As an example, I will use the Database Library from the book Java 7:


    ![](images/00050.gif)


    I will only use the four entities  book,  publisher,  category  and  author. Here
    you should note that there is a many-to-one relationship between  publisher  and  book  as
    well as between  category  and  book. In addition, there is a many-many relationship
    between  book  and  author.  The example is a web application called  PaBooks,
    and it should generally be able to maintain the tables corresponding to the above
    four entities. It should be noted that the user interface  is simple – simply
    to keep focus on database transactions and JPA. In the following, as in  the  first
    two examples of this chapter, I will primarily focus on how the program is made,  
    and  especially  how  to  use  a  JPA  to  develop  a  database  application.


    The start is a web application called  PaBooks, and after the application has
    been created, I have  selected  Entity  Classes  from  Database,  and  here  I  created  a  data  source  booklibrary  that
    creates a connection to the  library   database and after doing that, you get
    an overview of    the database  tables:


    ![](images/00051.jpeg)


    Here  are  the  tables


    -author


    -book


    -category


    -publisher


    -written


    added to  Selected Tables:


    ![](images/00052.jpeg)<map name="awmap6" class="calibre1"><area shape="rect" href="http://www.ligsuniversity.com/"
    coords="173, 433, 413, 459" class="calibre39"></map>![](images/00053.jpeg)


    ![](images/00054.jpeg)


    Note especially that the table  written  appears as bold, and it is because it
    is a relationship table between  book  and  author. When you click  Next, you
    get the following window:


    ![](images/00055.jpeg)


    Here you can see that four entity classes are created, and note that you can change
    the      name of those classes if you wish. I will not in this case. Also note
    the name of the package  where the classes should be created, which I have called  pabooks.models.
    When you click  Next, you get the following  window:


    ![](images/00056.jpeg)


    and when you click  Finish, the four entity classes are created. Generally, it
    is rarely necessary to  change  these  entity  classes,  but  sometimes  I  change  the  classes’  toString()  method,  which  I
    have  also  done  in  this  case  for  the  classes  Author,  Category  and  Publisher.  You  are  encouraged
    to  study  the  code.  Here  you  should  note,  among  other  things,  that  the  Publisher  class  has  a


    collection  bookCollection  for  Book  objects.  It  represents  a  foreign  key  to  Book  objects  and  thus
    references  to  the  Book  objects  published  on  this  publisher.  The  same  goes  for  the  Category  class.
    If you study the  Book  class, you should note that it has a reference to a  Publisher  object  and  a  Category  object,  and  thus  the  other  side  of  the  two  many-to-one  relationships.  The  Book  class  also  has  a  collection  authorCollection  with  Author  objects  that  represent  the
    many-to-many  relationship  between  book  and  author.  Examining  the  class  Author  will  you
    see  that  this  class  has  a  corresponding  collection  bookCollection  for  Book  objects  that  is  the
    other side of the many-to-many relationship. When examining the classes, pay attention
    to the  annotations  that  decorate  the  above  properties  for  the  relationships.


    After adding entity classes, I want to add controller classes by selecting  JPA
    Controller Classes from Entity Classes:


    ![](images/00057.jpeg)


    A controller must be created for all four entity classes that are added to  Selected
    Entity Classes, and after clicking  Next  and selecting the desired package (here  pabooks.models)
    and clicking  Finish, the four controller classes are created:


    -AuthorJpaController


    -BookJpaController


    -CategoryJpaController


    -PublisherJpaController


    Generally, these classes are not changed, however, it may be  necessary  to  expand 
    the classes with methods for queries on the database, and in this case, I have
    extended the  BookJpaController  class with a new method. However, it requires
    some syntax for how to  write  a  SQL  SELECT  statement  in  JPA.


    ![](images/00058.jpeg)![](images/00059.jpeg)Criteria API'
