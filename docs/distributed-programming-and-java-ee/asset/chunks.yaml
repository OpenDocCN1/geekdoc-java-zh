    public void save()\n{\n    try\n    {\n        addressSession.save(address); \n\
    \        address = new Address();\n    }\n    catch (Exception ex)\n    {\n  \
    \  }\n}\n```\n\n在那里有 `index.xhtml` 和 `list.xhtml`，页面基本上没有变化，区别在于 bean 的引用已经发生了变化。我不想在这里展示这两个页面。\n\
    \n### 练习 3\n\n在这个练习中，你必须解决与上一个练习相同的练习，但不同之处在于国王应该从数据库加载。数据库 `padata` 有一个名为 `history`\
    \ 的表，其中包含关于丹麦国王的信息。如果该表不存在，你可以在 `Java 6` 书中查看如何创建此表——书中的示例包含了创建和初始化该表的脚本。要解决这个练习，你可以按照以下步骤进行：\n\
    \n1. 创建一个名为 `HistoryEJB` 的企业级应用程序项目，它应该只包含一个 EJB 模块。NetBeans 会创建 `HistoryEJB-ejb`\
    \ 。\n2. 创建一个 `Class Library` 项目，你可以命名为 `HistoryEJBRemote`。此外，添加上一个练习中的 `King`\
    \ 类。\n3. 向 `HistoryEJB-ejb` 中添加一个名为 `HistorySession` 的状态会话豆，它应该有一个被添加到 `HistoryEJBRemote`\
    \ 中的远程接口。该接口应该与上一个练习中的相同（两个返回 `List<King>` 的方法）。实现必须有一个 `List<King>` 类型的实例变量，并且必须在\
    \ `@PostConstruct` 方法中通过从数据库的 `history` 表加载数据来初始化它。你可以按照之前示例中从数据库创建 `Entity Class`\
    \ 的相同方法轻松地完成。\n4. 翻译并部署 `HistoryEJB`。\n5. 创建一个客户端，它基本上与练习 2 中的客户端相同。\n6. 测试应用程序并确保一切运行正常。\n\
    \n### 3.4 事务 (TRANSACTIONS)\n\n使用企业级 Java 豆（EJB）的巨大优势之一是 EJB 使用事务，这通常意味着如果所有操作都执行正确，方法的更改将会执行，否则不执行任何操作（对应回滚）。如果发生异常，则属于后者。立即来看这没问题，但如果在事务进行期间调用一个方法，其工作原理就不显而易见了。该方法应该是当前事务的一部分，还是在为新的方法调用创建新事务时必须挂起现有事务？由于这些问题，可以配置事务应该如何工作。这是通过\
    \ `@TransactionAttribute` 注解实现的：\n\n```java\n@Stateless\npublic class Helloworld\n\
    {\n    @Override \n    @TransactionAttribute(TransactionAttributeType.REQUIRES_NEW)\
    \ \n    public String hello()\n    {\n        return \"Hello World\";\n    }\n\
    }\n```\n\n其中 `TransactionAttribute` 的值指示了事务的工作方式。有以下选项：\n\n1. `TransactionAttributeType.MANDATORY`：方法只能作为现有事务的一部分执行。如果在事务之外调用该方法，将抛出异常。\n\
    2. `TransactionAttributeType.NEVER`：如果从客户端调用方法，则不会创建事务。如果方法作为事务的一部分被调用，将抛出异常。\n\
    3. `TransactionAttributeType.NOT_SUPPORTED`：如果方法作为现有事务的一部分被调用，它将被挂起，并且方法将在事务之外执行。如果在事务之外调用方法，则不会创建事务。\n\
    4. `TransactionAttributeType.REQUIRED`：如果方法作为现有事务的一部分执行，它将作为该事务的一部分执行。如果在事务之外调用该方法，将创建一个新事务。\n\
    5. `TransactionAttributeType.REQUIRES_NEW`：如果方法作为现有事务的一部分被调用，它将被挂起并创建一个新事务。在方法完成后，之前的事务将恢复。如果在现有事务之外调用该方法，将创建一个新事务。\n\
    6. `TransactionAttributeType.SUPPORTS`：如果方法作为现有事务的一部分执行，则它将作为该事务的一部分执行。如果在事务之外调用该方法，则不会启动新事务。\n\
    \n上面显示了如何对方法进行装饰，但你也可以装饰类，这样装饰将关系到类的所有方法。\n\n### 3.5 拦截 (INTERCEPTION)\n\n在会话豆中执行方法时，人们有时会对方法执行之前（被调用时）以及方法完成后立即执行的操作感兴趣。典型的理由是调试，例如，你可以写入服务器的日志文件。作为示例，我向\
    \ `AddressEJB-ejb` 项目添加了以下类：\n\n```java\npackage addressejb.beans;\n\nimport javax.interceptor.AroundInvoke;\n\
    import javax.interceptor.InvocationContext;\nimport java.lang.reflect.Method;\n\
    \npublic class AddressInterceptor\n{\n    @AroundInvoke\n    public Object logMethodCall(InvocationContext\
    \ invocationContext) throws Exception\n    {\n        Object interceptedObject\
    \ = invocationContext.getTarget(); \n        Method interceptedMethod = invocationContext.getMethod();\n\
    \n        System.out.println(\"Entereding: \" + interceptedObject.getClass().getName()\
    \ + \".\" + interceptedMethod.getName() + \"()\");\n\n        Object obj = invocationContext.proceed();\n\
    \        System.out.println(\"Leaving: \" + interceptedObject.getClass().getName()\
    \ + \".\" + interceptedMethod.getName() + \"()\");\n\n        return obj;\n  \
    \  }\n}\n```\n\n"
- fmt: "\nIt’s quite common `Java` class with a simple method and the first thing\
    \ to notice is that the method is decorated with an annotation. The method has\
    \ an `InvocationContext` parameter that provides more services. The method `getTarget()`\
    \ returns the object that has performed the method, while `getMethod()` returns\
    \ an object representing the method in the `interceptedObject` object that has\
    \ been performed. Finally, there is the method `proceed()` which performs the\
    \ method `interceptedMethod()`. On both sides of the call to `proceed()`, a `System.out.println()`\
    \ is executed, which simply means writing a line in the Glassfish server’s log.\
    \ The result is that if a method performs `logMethodCall()`, a line is written\
    \ in the log file, after which the method is executed and the log file is written\
    \ again.\n\nThe question is then how to get the method executed and it happens\
    \ (of course) with an annotation:\n\n```java\n@Override\n@Interceptors({AddressInterceptor.class})\n\
    public void save(Address address) throws Exception\n{\n    EntityManager em =\
    \ null;\n    try\n    {\n        em = Persistence.createEntityManagerFactory(\"\
    AddressEJB-ejbPU\").createEntityManager();\n        em.getTransaction().begin();\n\
    \        em.persist(address);\n        em.getTransaction().commit();\n    }\n\
    \    catch (Exception ex)\n    {\n        throw new Exception();\n    }\n    finally\n\
    \    {\n        if (em != null) em.close();\n    }\n}\n```\n\nThat is, writing\
    \ in the log file before creating an address and again after the database is updated.\n\
    \n### 3.6 A TIMER SERVICE\n\nThere is a special variant of a session bean that\
    \ implements a timer. You can therefore have the actual bean to perform an operation\
    \ at certain intervals, for example, you can write in the log file. In this case,\
    \ I will write a session bean that determines the next prime every half second.\
