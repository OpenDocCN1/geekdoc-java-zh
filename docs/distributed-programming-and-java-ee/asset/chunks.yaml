    public class CategoryDAO


    {


    public EntityManager getEntityManager()


    {


    return Persistence.createEntityManagerFactory("BooksRemotePU"). createEntityManager();


    }


    public void create(Category category) throws Exception


    {


    if (category.getBookCollection() == null) category.setBookCollection(new ArrayList<Book>());
    EntityManager em = null;


    try


    {


    em = getEntityManager();


    em.getTransaction().begin();


    Collection<Book> attachedBookCollection = new ArrayList<Book>(); for  (Book  bookCollectionBookToAttach  :  category.getBookCollection())


    {


    bookCollectionBookToAttach = em.getReference(bookCollectionBookToAttach.getClass(),
    bookCollectionBookToAttach.getId()); attachedBookCollection.add(bookCollectionBookToAttach);


    }


    category.setBookCollection(attachedBookCollection); em.persist(category);


    for (Book bookCollectionBook : category.getBookCollection())


    {


    Category  oldCatidOfBookCollectionBook  =  bookCollectionBook.getCatid(); bookCollectionBook.setCatid(category);


    bookCollectionBook  =  em.merge(bookCollectionBook); if (oldCatidOfBookCollectionBook
    != null)


    {


    oldCatidOfBookCollectionBook.getBookCollection(). remove(bookCollectionBook);


    oldCatidOfBookCollectionBook = em.merge(oldCatidOfBookCollectionBook);


    }


    }


    em.getTransaction().commit();


    }


    catch (Exception ex)


    {


    if (em != null) em.getTransaction().rollback();


    throw ex;


    }


    finally


    {


    if (em != null) em.close();


    }


    }


    In addition, I have changed the classes so that they alone raises an  Exception  and
    deleted the other exception types. Of course, there is no special reason for and
    is something of an attitude question, but I feel that it results in a code that
    is slightly easier to read.


