    \ cb = em.getCriteriaBuilder(); CriteriaQuery<Tuple> cq = cb.createTupleQuery();\
    \ Root<Book> root = cq.from(Book.class); Path<Integer> idPath = root.get(Book_.id);\
    \ Path<String> titlePath = root.get(Book_.title); cq.multiselect(idPath, titlePath);\
    \ cq.where(cb.gt(root.get(Book_.pages), 300));\nList<Tuple> list = em.createQuery(cq).getResultList();\n\
    ```\n\nThe advantage is that you do not have to write a wrapper class. Note the\
    \ use of `multiselect()` to specify the columns to be included in the result,\
    \ which are used to specify multiple properties in the result. Another thing is\
    \ how to use the individual `Tuple` objects. I do not want to go into details\
    \ here (and you are encouraged to investigate the type `Tuple` – which is an interface),\
    \ but can you write the following (although the code does not make much sense\
    \ in this context):\n\n![](images/00062.jpeg)![](images/00063.jpeg)\n\n```java\n\
    for (Tuple t : list) {\n    Integer id = t.get(idPath); String str1 = (String)t.get(1);\n\
    \    String str2 = t.get(1, String.class);\n}\n```\n\nA criteria query object\
