    \ { \"Gorm den Gamle\", \"\", \"958\" },\n    { \"Harald Blåtand\", \"958\", \"\
    986\" },\n    { \"Svend Tveskæg\", \"986\", \"1014\" },\n    …\n    { \"Margrethe\
    \ d. 2.\", \"1972\", \"\" }\n};\n```\n\nThere is nothing new about this session\
    \ bean except that it is defined as a `Singleton` session bean. Note, however,\
    \ that the class implements both interfaces, thus implementing all four methods.\n\
    \nThe `EJB` module is complete and can be translated and then it can be deployed\
    \ to the server.\n\n![](images/00114.jpeg)!(images/00115.jpeg)Then there is the\
    \ client application, where I have created a usual Web Application project named\
    \ `KingsClient`. In order for the application to refer to `KingsSession`, it must\
    \ know the definition of the `KingsSessionRemote` interface. I have therefore\
    \ added the jar file with this interface to the project. As the next step I have\
    \ defined a named bean:\n\n```java\npackage kingsclient.beans; import javax.inject.Named;\n\
    import javax.enterprise.context.SessionScoped; import java.util.*;\nimport javax.ejb.EJB;\n\
    import kingsejb.ejbs.KingsSessionRemote;\n\n@Named(value = \"kingsBean\")\n@SessionScoped\n\
    public class KingsBean implements java.io.Serializable\n{\n    @EJB\n    private\
    \ KingsSessionRemote kingsSession;\n    private int year1; private int year2;\n\
    \    private List<String> names = new ArrayList();\n    public KingsBean() {\n\
    \    }\n\n    public int getYear1() { return year1;\n    }\n\n    public void\
    \ setYear1(int year1) { this.year1 = year1;\n    }\n\n    public int getYear2()\
    \ { return year2;\n    }\n\n    public void setYear2(int year2) { this.year2 =\
    \ year2;\n    }\n\n    public List<String> getNames()\n    {\n        return names;\n\
    \    }\n\n    public void search()\n    {\n        String[] arr = year2 > 0 ?\
    \ kingsSession.getKingsRemote(year1, year2) : kingsSession.getKingRemote(year1);\n\
    \        names.clear();\n        for (String name : arr) names.add(name);\n  \
    \  }\n}\n```\n\nAlso, here is not much news, but note that the class uses the\
    \ EJB module `KingsEJB`. It happens as in the previous examples by right-clicking\
    \ on the name of the class, choosing `Insert Code`, and then `Call Enterprise\
    \ Bean`. The relevant bean is used in the method `Search()`.\n\nIf you perform\
    \ the application (opens it in the browser), you get the following window, which\
    \ has been applied to all kings ruling from 1200 to 1300:\n\n![](images/00116.jpeg)\n\
    \nI do not want to display the code for `index.xhtml` as it does not shows anything\
    \ new.\n\n### EXERCISE 2\n\nIn this exercise, write a program that performs almost\
    \ the same as the example above, where you can search for Danish kings, but the\
    \ user interface needs to be changed so that it also shows the rule period:\n\n\
    ![](images/00117.jpeg)\n\n![](images/00118.jpeg)!(images/00119.jpeg)Start creating\
    \ a new project that you can call `KingsEJB-ejb`, but this time it should not\
    \ be an `Enterprise Application` project, but an `EJB Module` project:\n\n![](images/00120.jpeg)\n\
    \nNext, you should create a usual `Class Library` project, as you can call `KingsEJBRemote`.\
    \ For this library you must in a package `kingsejb.ejbs` add the following class:\n\
    \n```java\npackage kingsejb.ejbs; import javax.ejb.Remote; @Remote\npublic class\
    \ King implements java.io.Serializable\n{\n    private String name; private int\
    \ from; private int to;\n    public King(String name, int from, int to)\n    {\n\
    \        this.name = name; this.from = from; this.to = to;\n    }\n\n    public\
    \ String getName()\n    {\n        return name;\n    }\n\n    public int getFrom()\n\
    \    {\n        return from;\n    }\n\n    public int getTo()\n    {\n       \
    \ return to;\n    }\n}\n```\n"
