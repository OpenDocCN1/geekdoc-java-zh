    \       <h:outputLabel for=\"firstName\" value=\"First Name\"/>\n            <h:inputText\
    \ id=\"firstName\" value=\"#{student.person.firstName}\"/>\n            <h:outputLabel\
    \ for=\"lastName\" value=\"Last Name\"/>\n            <h:inputText id=\"lastName\"\
    \ value=\"#{student.person.lastName}\"/>\n            <h:outputLabel for=\"subject\"\
    \ value=\"Subject\"/>\n            <h:inputText id=\"subject\" value=\"#{student.subject}\"\
    />\n            <h:commandButton value=\"OK\" />\n            <h:panelGroup/>\n\
    \        </h:panelGrid>\n    </h:form>\n</h:body>\n</html>\n```\n\n### 4.1 QUALIFIERS\n\
    \nIf you consider the bean `Student`, it has a dependence to the bean `Person`.\
    \ I will now define a derivative class, which I have called `Man`, but first I\
    \ will made the class `Person` abstract and expanded with an `abstract` method\
    \ that will return a person’s gender:\n\n```java\n@Named(value = \"person\")\n\
    @SessionScoped\npublic abstract class Person implements Serializable\n{\n    …\n\
    \    public abstract String getGender();\n}\n```\n\nI can then write the following\
    \ bean:\n\n```java\npackage cdiprogram.beans; \nimport javax.inject.Named;\nimport\
    \ javax.enterprise.context.SessionScoped; \nimport java.io.Serializable;\n\n@Named(value\
    \ = \"man\")\n@SessionScoped @Male\npublic class Man extends Person implements\
    \ Serializable\n{\n    public Man()\n    {\n    }\n    public String getGender()\n\
    \    {\n        return \"A man\";\n    }\n}\n```\n\nIf you disregard the `@Male`\
    \ annotation, there is nothing new in this class. It’s a managed bean that inherits\
    \ a managed bean, and a bean is just a class. If you see the `Student` class from\
    \ the container, it defines a variable `person` whose type is `Person`, and the\
    \ container must then create an actual object, such as a `Man` object. Since the\
    \ class `Person` could have more derived classes, one should be able to tell the\
    \ container what it is for an object to be instantiated and it happens with a\
    \ qualifier. `Male` is a qualifier and is an interface that can be defined as\
    \ follows:\n\n```java\npackage cdiprogram.beans;\nimport static java.lang.annotation.ElementType.TYPE;\
    \ \nimport static java.lang.annotation.ElementType.FIELD; \nimport static java.lang.annotation.ElementType.PARAMETER;\
    \ \nimport static java.lang.annotation.ElementType.METHOD;\nimport static java.lang.annotation.RetentionPolicy.RUNTIME;\
    \ \nimport java.lang.annotation.Retention;\nimport java.lang.annotation.Target;\
    \ \nimport javax.inject.Qualifier;\n\n@Qualifier @Retention(RUNTIME)\n@Target({METHOD,\
    \ FIELD, PARAMETER, TYPE})\npublic @interface Male\n{\n}\n```\n\nIn the class\
    \ `Man`, you tell with `@Male` that the class is identified with the qualifier\
    \ `Male`. The `CDIProgram` project also defines a derived class `Woman`, identified\
    \ with a qualifier `Female`. In principle, it’s simple to write a qualifier, but\
    \ the syntax can be hard to remember, and NetBeans therefore has a `File Type`\
    \ for the purpose:\n\nIf you then want the `Student` class to create a `Woman`\
    \ object, the syntax is as follows:\n\n```java\npublic class Student implements\
    \ Serializable\n{\n    @Inject\n    @Female\n    private Person person;\n}\n```\n\
    \nLooking at the above solution, it is simple enough to define the specific type\
    \ the container needs to create. However, if you think of a situation where `Person`\
    \ has many subclasses, many qualifications must be written. Instead, you can define\
    \ a parameter:\n\n```java\npackage cdiprogram.beans;\nimport static java.lang.annotation.ElementType.TYPE;\
    \ \nimport static java.lang.annotation.ElementType.FIELD; \nimport static java.lang.annotation.ElementType.PARAMETER;\
    \ \nimport static java.lang.annotation.ElementType.METHOD;\nimport static java.lang.annotation.RetentionPolicy.RUNTIME;\
    \ \nimport java.lang.annotation.Retention;\nimport java.lang.annotation.Target;\
    \ \nimport javax.inject.Qualifier;\n\n@Qualifier @Retention(RUNTIME)\n@Target({METHOD,\
    \ FIELD, PARAMETER, TYPE})\npublic @interface Gender\n{\n}\n```\n\nThis qualifier\
    \ now has an attribute called `value`. Note that a qualifier may well have more\
    \ attributes. You can then decorate classes `Man` and `Woman` as follows:\n\n\
    ```java\n@Named(value = \"man\")\n@SessionScoped\n@Gender(value = \"Male\")\n\
    public class Man extends Person implements Serializable\n{\n}\n```\n\nand for\
    \ injection you can write:\n\n```java\n@Named(value = \"student\")\n@SessionScoped\n\
    public class Student implements Serializable\n{\n    @Inject\n    @Gender(value\
    \ = \"Female\")\n    private Person person;\n    private String subject;\n}\n\
    ```\n\n### 4.2 CONTEXTS\n\nWhen a managed bean is needed either by injection or\
    \ because it is referenced from a JSF page, CDI will try to find an instance in\
    \ the scope of the particular bean. If successful, otherwise an object belonging\
    \ to the current scope will be created. Often, one object (a managed bean) must\
    \ “live” across multiple pages, and you cannot use `RequestScoped` as it relates\
    \ only to the current page. The object is created each time a page request is\
    \ made. So far (both in this book and the two previous books) I have solved this\
    \ problem by defining the beans as `SessionScoped`. It works, but is also the\
    \ easy solution, and there is also a disadvantage to `SessionScoped` beans. Firstly,\
    \ these beans live throughout the session and even for a period after the session\
    \ is completed. This means that session objects fill unnecessarily in the machine’s\
    \ memory. An even bigger problem, however, is that since `SessionScoped` beans\
    \ (and, for that matter, all session objects) live longer than is needed for them,\
    \ there is a risk that they will be used after they logically no longer exist.\
    \ The latter is actually something that can make it very difficult to correct\
    \ errors in a web application.\n"
