    \ that they can be used by the client program. The four classes should not be\
    \ changed in relation to the code created by NetBeans, except for `I`, for `Author`,\
    \ `Publisher` and `Category`, have changed `toString()`. \n\n![](images/00147.jpeg)\n\
    \nAs a next step, I have added to the project `BooksEJB` a stateless session bean:\n\
    \n![](images/00148.jpeg)\n\nI have defined that a remote interface has to be added\
    \ to my class library, and the result is that NetBeans creates an interface named\
    \ `LibraryDAORemote`.\n\nIn the `BooksEJB` project I have created a package called\
    \ `booksejb.daos`. For this package I have added a `JPA Controller Classes from\
    \ Entity Classes`:\n\n![](images/00149.jpeg)![](images/00150.jpeg)\n\n![](images/00151.jpeg)\n\
    \nThese 4 classes are all modified a bit, but it is solely a question that the\
    \ constructor has been removed that the `getEntityManager()` method has been changed\
    \ and the transactions are defined differently. The code for these classes fills\
    \ a lot and I do not want to show them here, but below is the start of the class\
    \ `CategoryDAO` and the method `create()`:\n\n```java\npublic class CategoryDAO\n\
    {\n    public EntityManager getEntityManager()\n    {\n        return Persistence.createEntityManagerFactory(\"\
    BooksRemotePU\"). createEntityManager();\n    }\n\n    public void create(Category\
    \ category) throws Exception\n    {\n        if (category.getBookCollection()\
    \ == null) category.setBookCollection(new ArrayList<Book>());\n        EntityManager\
    \ em = null;\n        try\n        {\n            em = getEntityManager();\n \
    \           em.getTransaction().begin();\n            Collection<Book> attachedBookCollection\
    \ = new ArrayList<Book>();\n            for (Book bookCollectionBookToAttach :\
    \ category.getBookCollection())\n            {\n                bookCollectionBookToAttach\
    \ = em.getReference(bookCollectionBookToAttach.getClass(), bookCollectionBookToAttach.getId());\n\
    \                attachedBookCollection.add(bookCollectionBookToAttach);\n   \
    \         }\n            category.setBookCollection(attachedBookCollection);\n\
    \            em.persist(category);\n\n            for (Book bookCollectionBook\
    \ : category.getBookCollection())\n            {\n                Category oldCatidOfBookCollectionBook\
    \ = bookCollectionBook.getCatid();\n                bookCollectionBook.setCatid(category);\n\
    \                bookCollectionBook = em.merge(bookCollectionBook);\n        \
    \        if (oldCatidOfBookCollectionBook != null)\n                {\n      \
    \              oldCatidOfBookCollectionBook.getBookCollection(). remove(bookCollectionBook);\n\
    \                    oldCatidOfBookCollectionBook = em.merge(oldCatidOfBookCollectionBook);\n\
    \                }\n            }\n            em.getTransaction().commit();\n\
    \        }\n        catch (Exception ex)\n        {\n            if (em != null)\
    \ em.getTransaction().rollback();\n            throw ex;\n        }\n        finally\n\
    \        {\n            if (em != null) em.close();\n        }\n    }\n}\n```\n\
    \nIn addition, I have changed the classes so that they alone raises an `Exception`\
    \ and deleted the other exception types. Of course, there is no special reason\
    \ for and is something of an attitude question, but I feel that it results in\
    \ a code that is slightly easier to read.\n\nFinally, the `BookDAO` class has\
    \ added a method that determines `Book` objects for the search criteria used,\
    \ but it is the same method that is written in the `PaBooks` program.\n\nNote\
    \ that until this place I have not written quite a lot of code, but NetBeans has\
    \ essentially created it all. All that is missing is to define the `LibraryDAORemote`\
    \ interface and implement `LibraryDAO`. The interface is defined as follows:\n\
    \n```java\npackage booksejb.beans;\n\nimport javax.ejb.Remote;\nimport java.util.List;\n\
    \n@Remote\npublic interface LibraryDAORemote\n{\n    public boolean addCategory(Category\
    \ category);\n    public boolean modCategory(Category category);\n    public boolean\
    \ delCategory(Category category);\n    public List<Category> getCategories();\n\
    \n    public boolean addPublisher(Publisher publisher);\n    public boolean modPublisher(Publisher\
    \ publisher);\n    public boolean delPublisher(Publisher publisher);\n    public\
    \ List<Publisher> getPublishers();\n\n    public boolean addAuthor(Author author);\n\
    \    public boolean modAuthor(Author author);\n    public boolean delAuthor(Author\
    \ author);\n    public List<Author> getAuthors();\n\n    public boolean addBook(Book\
    \ book);\n    public boolean modBook(Book book);\n    public boolean delBook(Book\
    \ book);\n\n    public List<Book> getBooks(String title, String pubname, String\
    \ catname);\n}\n```\n\nThe names of the individual methods should explain what\
    \ they should be used for. Since there are 12 methods (4 for each entity), the\
    \ `LibraryDAO`’s code is a part, but since the implementation is essentially the\
    \ same for each entity, I will show only the code for the entity `Category`:\n\
    \n![](images/00152.jpeg)![](images/00153.jpeg)\n\n```java\npackage booksejb.beans;\n\
    \nimport javax.ejb.Stateless;\nimport java.util.List;\nimport booksejb.daos.*;\n\
    \n@Stateless\npublic class LibraryDAO implements LibraryDAORemote\n{\n    @Override\n\
    \    public boolean addCategory(Category category)\n    {\n        try\n     \
    \   {\n            CategoryDAO dao = new CategoryDAO();\n            dao.create(category);\n\
    \            return true;\n        }\n        catch (Exception ex)\n        {\n\
    \            return false;\n        }\n    }\n\n    @Override\n    public boolean\
    \ modCategory(Category category)\n    {\n        try\n        {\n            CategoryDAO\
    \ dao = new CategoryDAO();\n            dao.edit(category);\n            return\
    \ true;\n        }\n        catch (Exception ex)\n        {\n            return\
    \ false;\n        }\n    }\n\n    @Override\n    public boolean delCategory(Category\
    \ category)\n    {\n        try\n        {\n            CategoryDAO dao = new\
    \ CategoryDAO();\n            dao.destroy(category);\n            return true;\n\
    \        }\n        catch (Exception ex)\n        {\n            return false;\n\
    \        }\n    }\n\n    @Override\n    public List<Category> getCategories()\n\
    \    {\n        List<Category> list = (new CategoryDAO()).findEntities();\n  \
    \      for (Category c : list) c.getBookCollection().size();\n        return list;\n\
    \    }\n}\n```\n\nThe code is simple, as all work is performed by the DAO classes,\
    \ and in principle, it is about creating an DAO object and calling the methods.\
    \ However, there is a problem that is called LAZY update. For example, if you\
    \ take the entity `Category`, it has a collection `bookCollection` that contains\
    \ all `Book` that are categorized under that. These objects must thus be initialized\
    \ when you read the database, and since these objects are far always used, JPA\
    \ use a technique where the objects are first created (by reading the database)\
    \ when referring to them. This is the purpose of the loop that occurs in the method\
    \ `getCategories()`.\n\nAfter the `LibraryDAO` class is implemented, `BooksEJB`\
    \ is complete and can be translated and hosted on the server.\n\nBack there is\
    \ the client program, which can be copied from `PaBooks`. I have created a Web\
    \ Application project named `BooksClient`. The project should have a reference\
    \ to `BooksRemote`, but otherwise there should be the following files that can\
    \ be copied from `PaBooks`:\n\n![](images/00154.jpeg)\n\nHowever, the five named\
    \ bean classes must be changed a bit, and as an example, I have shown `CategoryBean`,\
    \ which is a named bean for `categories.xhtml`:\n\n![](images/00155.jpeg)\n![](images/00156.jpeg)\n\
    \n```java\npackage booksclient.beans;\n\nimport booksejb.beans.LibraryDAORemote;\n\
    import javax.ejb.EJB;\nimport javax.inject.Named;\nimport javax.enterprise.context.SessionScoped;\n\
    import java.util.*;\nimport booksejb.beans.*;\n\n@Named(value = \"categoryBean\"\
    )\n@SessionScoped\npublic class CategoryBean\n{\n    // Implementation\n}\n```\n"
