  trans: "\n\n该类非常简单，主要由将工作委托给 EJB 实例的方法组成。示例以多种方式展示了如何将企业级 Bean（EJB）作为封装业务逻辑的对象，并将其与用作用户界面控制器的具名\
    \ Bean 分离开来。通过这种方式，你简化了单个具名 Bean。\n\n最后是 `index.xhtml` 的代码，它不包含任何新内容，我不想在这里展示。\n\
    \n![](img/00098.jpeg)3.2![](img/00099.jpeg) 远程单例会话 Bean（REMOTE SINGLETON SESSION\
    \ BEAN）\n\n在前两个示例中，session Bean 和客户端应用程序都是同一个企业应用程序的一部分。在本节中，我将展示一个作为一个单模块开发并独立部署到服务器的\
    \ session Bean 示例。接下来，示例将包含一个与上述 Bean 独立开发的通用 Web 应用程序，但使用了该 session Bean。这意味着应用程序和\
    \ Bean 可以托管在每个应用程序服务器上。\n\n实际的 session Bean 也应该被写成单例（singleton）——主要是为了演示如何实现。单例\
    \ session Bean 是一种 session Bean，每个应用程序服务器上恰好有一个实例。一个典型的应用是必须精确初始化某些数据的 Bean，这些数据在应用程序的整个生命周期内应该是可。通常，相关数据是从数据库初始化的，你希望用\
    \ `@PostConstruct` 装饰一个方法，在其中初始化数据。在本例中目前未使用，因为数据是硬编码的以保持当前 Bean 的简单。\n\n与前两个示例一样，我开始创建一个名为\
    \ `KingsEJB` 的企业应用程序项目，当我进入“Server and Settings”窗口时，我清空了“Create Web Application\
    \ Module”：\n\n![](img/00100.jpeg)\n\n当你点击“Finish”时，NetBeans 会创建一个企业应用程序，但只包含一个\
    \ EJB 模块。这次必须对 EJB 进行远程访问，因此它必须通过接口进行定义。作为下一步，我创建了一个名为 `KingsEJBRemote` 的常规类库项目。\n\
    \n现在必须编写一个企业级 Bean，它必须包含两个服务，两者都返回字符串数组。第一个方法必须根据年份返回统治该年份的丹麦国王名称（如果该年份是宗教更迭的年份，可能有两个国王）。另一个方法的工作相同，但必须有两个年份作为参数，且该方法必须返回在该时期内统治过的所有国王名称。为了创建这个\
    \ Bean，我右键点击了 `KingsEJB-ejb` 模块并选择了“Session Bean”。随后你会看到下面的窗口，我在其中将 `KingsSession`\
    \ 作为包名 `kingsejb.ejbs` 输入。此外，我将其选为单例（Singleton）。最后，规定必须创建一个本地（Local）和一个远程（Remote）接口。在勾选“Remote”时，选择包含接口的类库，在这种情况下是\
    \ `KingsEJBRemote`。对于当前的示例，不需要本地接口，当我选择它时，仅仅是为了说明 session Bean 可以同时拥有本地接口和远程接口。\n\
    \n![](img/00101.jpeg)\n\n点击“Finish”后，NetBeans 创建了所需的 session Bean 以及两个接口：\n\n\
    ![](img/00102.jpeg)\n\n接下来，应该添加两个方法。我右键点击类名 `KingsSession` 并选择了“Insert Code”，在这里再次选择了“Add\
    \ Business Method”（见下窗）。第一个方法必须被命名为 `getKing`，并应该返回一个字符串数组并有一个 `int` 类型的单个参数。在底部，我点击了最后一个单选按钮，表示应同时使用两个接口。你应该注意，NetBeans\
    \ 提供了一个警告，提示该方法在两个接口中将相同的名称。\n\n![](img/00104.jpeg)(images/00105.jpeg)(images/00106.jpeg)(images/00107.jpeg)(images/00108.jpeg)(images/00109.jpeg)(images/00110.jpeg)(images/00111.jpeg)\n\
    \n![](img/00112.jpeg)\n\n![](img/00113.jpeg) 当你点击“OK”时，NetBeans 将创建方法并在两个接口中插入原型。考虑到上述警告，我将它们分别重命名为\n\
    \n`getKingLocal(int year)`\n`getKingRemote(int year)`\n结果是 `KingsSession` 类必须实现这两个方法。另一个服务必须相应地定义，例如，我在下方展示了\
    \ `KingsSessionRemote` 接口：\n\n```java\npackage kingsejb.ejbs; import javax.ejb.Remote;\
    \ @Remote\npublic interface KingsSessionRemote\n{\n    String[] getKingRemote(int\
    \ year);\n    String[] getKingsRemote(int year1, int year2);\n}\n```\n\n这些方法必须在\
    \ `KingsSession` 类中实现，我在其中仅展示了几行数据：\n\n```java\npackage kingsejb.ejbs;\n\nimport\
    \ javax.ejb.Singleton; import java.util.*;\n\n@Singleton\npublic class KingsSession\
    \ implements KingsSessionRemote, KingsSessionLocal\n{\n    @Override\n    public\
    \ String[] getKingRemote(int year)\n    {\n        return getKing(year);\n   \
    \ }\n\n    @Override\n    public String[] getKingsRemote(int year1, int year2)\n\
    \    {\n        return getKings(year1, year2);\n    }\n\n    @Override\n    public\
    \ String[] getKingLocal(int year)\n    {\n        return getKing(year);\n    }\n\
    \n    @Override\n    public String[] getKingsLocal(int year1, int year2)\n   \
    \ {\n        return getKings(year1, year2);\n    }\n}\n```\n\n"
