    which is just a class enclosing  id  and  title  for a book.  The query can then
    be written as follows:


    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<BookWrapper> cq =  cb.createQuery(BookWrapper.class);
    Root<Book> root =  cq.from(Book.class);


    cq.select( cb.construct(BookWrapper.class,  root.


    get(Book_.id), root.get(Book_.title))); cq.where(cb.gt(root.get(Book_.pages),
    300)); List<BookWrapper> list =  em.createQuery(cq).getResultList();


    First, note that you define a criteria query for  BookWrapper  objects. Next,
    you use  select()  and  a  construct()  method  from  the  builder,  which  tells  you  to  construct  BookWrapper  objects.  The  rest  is  in  principle  the  same  as  in  the  previous  example.


    A query can also return  Tuple  objects, and for the syntax is the biggest difference
    that the query object is created with  createTupleQuery():


    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<Tuple> cq = cb.createTupleQuery();
    Root<Book> root = cq.from(Book.class); Path<Integer> idPath = root.get(Book_.id);
    Path<String> titlePath = root.get(Book_.title); cq.multiselect(idPath, titlePath);
    cq.where(cb.gt(root.get(Book_.pages), 300));


    List<Tuple> list = em.createQuery(cq).getResultList();


    The advantage is that you do not have to write a wrapper class. Note the use of  multiselect()  to
    specify the columns to be included in the result, which are used to specify multiple
    properties in the result. Another thing is how to use the individual  Tuple objects.
    I do not  want to go into details here (and you are encouraged to investigate
    the type  Tuple –  which  is an interface), but can you write the following (although
    the code does not make much   sense in this  context):


    ![](images/00062.jpeg)![](images/00063.jpeg)


    for (Tuple t : list)


    {


    Integer id = t.get(idPath); String str1 = (String)t.get(1);


    String str2 = t.get(1, String.class);


    }


    A criteria query object defines a query from one or more entities (in the above
    examples   only one that has been  Book  each time). Of course, you can specify
    more entities that correspond to a join operation in SQL. I will start with a
    query that determines all books where  the  name  of  the  publisher  starts  with  the  word  Sams:


    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<Book> cq = cb.createQuery(Book.class);
    Root<Book> books = cq.from(Book.class);


    Join<Book, Publisher> pubs = books.join("pubid"); cq.select(books).where(cb.like(pubs.get("name"),
    "Sams%")); return em.createQuery(cq).getResultList();


    First  of  all,  I  have  created  a  query  for  Book  objects  and  defined  a  root  for  the  entity  class


    Book  –  which  has  been  named  books  this  time.  There  is  a  one-to-many  relationship  between


    books and publishers, so that more books can be published on the same publisher
    while a book is always published on a particular publisher. I then define a  join  between  Book  and  Publisher
    (two entity classes) called  pubs  by specifying the property  pubid  in the entity
    class  Book  as join property. The rest does not contain anything new, but you
    should note how to in the  method  where()  to  references  the  property  name  in  the  Publisher  class  using  the  name  pubs.


    The next example is the same join, but the query determines all books where the
    title  contains  the  word  Fedora  or  the  publisher  starts  with  the  word  Sams:


    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<Book> query =  cb.createQuery(Book.class);
    Root<Book> books = query.from(Book.class);


    Join<Book, Publisher> pubs = books.join("pubid"); query.select(books).where(


    cb.or(cb.like(books.get("title"), "%Fedora%"),


    cb.like(pubs.get("name"), "Sams%")));


    return em.createQuery(query).getResultList();


    You should primarily note how the the method  or()  is used to construct a condition.


    There  is  also  a  one-to-many  relationship  between  Book  and  Category,  so  you  can  also  define
    a  join  from  Book  to  Category.  The  following  query  determines  all  Book  objects  where  the
    title contains a search value, the name of the publisher contains a search value
    and the name  of  the  category  contains  a  search  value:


    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<Book> query =  cb.createQuery(Book.class);
    Root<Book> books = query.from(Book.class);


    Join<Book, Publisher> pubs =  books.join("pubid"); Join<Book, Category> cats =  books.join("catid");


    Predicate pc = cb.and(cb.like(books.get("title"), "%" + title +  "%"), cb.like(pubs.get("name"),
    "%" + pubname +  "%"),


    cb.like(cats.get("name"), "%" + catname + "%")); query.select(books).where(pc);


    return em.createQuery(query).getResultList();


    Note that two join objects are defined for the object graph. Next, a  Predicate  object
    is  defined which represents a condition. In this case, there is an  and  of three  equal()  functions,
    and the predicate is used as parameters for the  where()  function. You should
    especially note how  to  use  variables  in  search  strings.


    As the last example, I will show how with a query that can  find all authors for
    a particular book.  There is a many-to-many relationship between  Book  and  Author,
    and that query can  be written as follows:


    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<Author> cq =  cb.createQuery(Author.class);
    Root<Author> root = cq.from(Author.class);


    Join<Author, Book> books = root.join("bookCollection"); cq.where(cb.equal(books.get("isbn10"),
    "0-672-32584-5")); cq.select(root);


    List<Author> list = em.createQuery(cq).getResultList();


    First, a query is created for  Author  objects while  root  is defined for the
    entity class  Author. Next, a join from  Author  to  Book  is defined, and with
    the  where()  method, it is defined that all authors who have written the book
    with isbn 0-672-32584-5 must be selected.


    In this case (the  example  PaBooks), on the start page, I want to show an overview
    of all     the  books  in  the  database,  but  such  that  you  can  filter  books  by  searching  for  those  books


    1. where  the  title  contains  a  specific  search  text


    2. where  the  name  of  the  publisher  contains  a  specific  search  text


    3. where  the  name  of  the  category  contains  a  specific  search  text'
