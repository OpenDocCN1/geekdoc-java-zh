- fmt: '

    If you look at how I have written database applications so far, some of the most
    comprehensive types of typing are SQL SELECT statements – at least to write them
    correctly, and the same applies to JPA. To write and execute SELECT statements,
    you have to use a `Query` object, and JPA defines an SQL similar language, called
    `JPQL`. The language has essentially the same syntax as SQL and will not be treated
    explicitly in this book. When it is difficult to write SQL SELECT statements correctly,
    it is because it is only text and therefore the syntax can not be validated by
    the compiler. The problems are the same with JPQL, and to help with that, an API
    is defined called `Criteria API`. In fact, it is not easier to write SELECT statements
    using this API, but the different parts of a SELECT expression are defined using
    Java classes, and the compiler can thus validate if the expression is written
    correctly. In this book, I will use this `Criteria API` in most places, and the
    following is a brief introduction to the syntax.


    The API is used to define criteria queries, which basically is an object graph,
    and you define a criteria query by building such a graph. This happens with an
    object of the type `CriteriaBuilder` that can create the parts that a criteria
    query consists of, and since it is all about representing a SELECT statement,
    it means object-oriented representation of tables, columns, and conditions for
    which rows to extract from the database. For example, you can get a `CriteriaBuilder`
    from an `EntityManager` by a statement of the form:


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder();

    ```


    where `em` is an `EntityManager`. Such a builder has three methods that return
    a criteria query:


    - `CriteriaQuery<T> createQuery(Class<T>)`

    - `CriteriaQuery<Tuple> createTupleQuery()`

    - `CriteriaQuery<Object> createQuery()`


    and the difference is what kind of objects the query returns. After having a criteria
    builder that has created a query, the task is to initialize this query, and this
    is where the API comes on the path.


    I want to start with the first of the above methods that creates a query where
    the parameter type indicates the expected type of objects that are the result
    of the query, and in principle it can be any arbitrary object type. As an example,
    below is shown a criteria query that determines all books in the library database,
    where pages have the value 520:


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<Book> cq = cb.createQuery(Book.class);
    Root<Book> root = cq.from(Book.class); cq.select(root); cq.where(cb.equal(root.get(Book_.pages),
    520)); return em.createQuery(cq).getResultList();

    ```


    Note how to create a `CriteriaBuilder` (`em` is an `EntityManager`) and how it
    is used to create a criteria query for `Book` objects. For this query, a `root`
    is created for the object graph, and it is defined that the query object must
    extract objects from this root. `root` then corresponds to the FROM section in
    a SQL SELECT statement. Next, it is defined by the method `select()` which properties
    are part of the result, and here is the root which means `Book` objects. The `select()`
    function thus indicates which columns are to be included. Finally, it is defined
    that objects must only be extracted where the page number is 520, and thus corresponds
    to the WHERE section in a SELECT statement. The result is a collection of these
    objects. You should especially note how to refer to the column `pages` (the property
    `pages` in `Book`). The query can also be written as follows:


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<Book> cq = cb.createQuery(Book.class);
    Root<Book> root = cq.from(Book.class); return em.createQuery(cq.select(root).where(cb.equal(root.get("pages"),
    520))).getResultList();

    ```


    It has no special advantages besides being a bit shorter, and so it may look more
    like a SQL SELECT statement. However, you must note that I have defined the column
    (pages) in another way, namely, as a string, which should be the name of that
    property in the `Book` class.


    If you look at the code, you can notice that a criteria query object has the following
    methods:


    - `from()`

    - `select()`

    - `where()`


    where the meaning is known from a SELECT statement, and if you examine the type
    `CriteriaQuery`, you will see that there are methods for the other parts of a
    SELECT as `ORDER BY`, `GROUP BY`, and more. Finally, you can note that the `CriteriaBuilder`
    class, in addition to creating `CriteriaQuery` objects, has methods that define
    conditions – predicates – and many others (in the example above `equals`), where
    a few are illustrated below.


    As another example, the query below determines the page number of all books, where
    the title contains the text Fedora:


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<Integer> cq = cb.createQuery(Integer.class);
    Root<Book> root = cq.from(Book.class); cq.select(root.get(Book_.pages)); cq.where(cb.like(root.get(Book_.title),
    "%Fedora%")); List<Integer> pages = em.createQuery(cq).getResultList();

    ```


    As a further example, a query is shown which determines the largest page number
    in book, where you should first notice that a criteria builder supports multiple
    functions (here `max` function) and that the result is determined by `getSingleResult()`
    instead of `getResultList()`:


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<Integer> cq = cb.createQuery(Integer.class);
    Root<Book> root = cq.from(Book.class); cq.select(cb.max(root.get(Book_.pages)));
    Integer pages = em.createQuery(cq).getSingleResult();

    ```


    or shorter:


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<Integer> cq = cb.createQuery(Integer.class);
    Integer pages = em.createQuery(cq.select(cb.max(cq.from(Book.class).get("pages")))).getSingleResult();

    ```


    I will then show with some examples how to determine the values for specific columns,
    and thus specific properties in the entity class. The next query determines id
    and title of all Book objects where the page number are greater than 300:


    ```

    CriteriaBuilder cb = em.getCriteriaBuilder(); CriteriaQuery<Object[]> cq = cb.createQuery(Object[].class);
    Root<Book> root = cq.from(Book.class); Path<Integer> idPath = root.get(Book_.id);
    Path<String> titlePath = root.get(Book_.title);

    ```

    '
