  trans: "\n\n存在一种名为 `conversation`（对话）的上下文，bean 可以在多个页面之间存在，但不会跨越整个会话（session），它的目标正是为了解决会话上下文带来的挑战。代价是，程序员必须告诉容器对话何时开始以及何时结束。我想通过\
    \ `ChangeAddress` 示例来展示 `ConversationScoped` 是如何工作的，在这个示例中，区别在于输入地址的表单被无分地分成了三个页面——并没有什么特殊原因。我将从一个名为\
    \ `ChangeAddress4` 的项目开始，它是 `ChangeAddress1` 的副本。除了 `list.xhtml`（未更改）外，还有三个新的\
    \ JSF 页面，地址的输入通过这三个 JSF 页面的向导完成：\n\n![](img/00168.gif)\n\n`index.xhtml` 现在被简化为以下非常简单的页面：\n\
    \n```xml\n<?xml version='1.0' encoding='UTF-8' ?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
    \ XHTML 1.0 Transitional//EN\" … >\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    \ xmlns:h=\"http://xmlns.jcp.org/jsf/html\" xmlns:f=\"http://xmlns.jcp.org/jsf/core\"\
    >\n<h:head>\n    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
    />\n    <title>Change address</title>\n    <h:outputStylesheet library=\"css\"\
    \ name=\"styles.css\"/>\n</h:head>\n<h:body>\n    <h1>Change address</h1>\n  \
    \  <h:form>\n        <p><h:commandLink value=\"Create new address\" action=\"\
    #{indexController.page1()}\" /></p>\n        <p><h:commandLink value=\"Show addresses\"\
    \ action=\"list\" /></p>\n    </h:form>\n</h:body>\n</html>\n```\n\n它会打开以下窗口：\n\
    \n![](img/00169.jpeg)\n\n点击顶部的链接将进入一个输入名称的页面，`ChangeAddress1` 项目的表单通常分为三个页面，如下所示。这三个页面称为：\n\
    \n- `page1.xhtml`\n- `page2.xhtml`\n- `page3.xhtml`\n\n实体类 `Address` 与之前保持不变，但定义了一个简单的包装类\
    \ `Person`（一个托管 bean），你只需要注意的是它是一个被定义为 `ConversationScoped` 的命名 bean：\n\n![](img/00170.jpeg)\n\
    ![](img/00171.jpeg)\n\n```java\npackage changeaddress.beans;\n\nimport javax.inject.Named;\n\
    import javax.enterprise.context.ConversationScoped;\nimport java.io.Serializable;\n\
    import changeaddress.models.Address;\n\n@Named(value = \"person\")\n@ConversationScoped\n\
    public class Person implements Serializable {\n    private Address address;\n\n\
    \    public Person() {\n        address = new Address();\n    }\n\n    public\
    \ Address getAddress() {\n        return address;\n    }\n\n    public void setAddress(Address\
    \ address) {\n        this.address = address;\n    }\n}\n```\n\n三个新 JSF 页面的代码非常简单，我不想在这里展示，但新的变动在已过的\
    \ `IndexController` 中。代码如下所示，但我没有显示 `get` 和 `set` 方法，因为它们和之前的一样：\n\n```java\n\
    package changeaddress.beans;\n\nimport java.util.*;\nimport javax.inject.*;\n\
    import javax.enterprise.context.*;\nimport java.io.Serializable;\nimport javax.persistence.*;\n\
    import javax.transaction.*;\nimport javax.annotation.*;\nimport changeaddress.models.*;\n\
    import javax.persistence.criteria.CriteriaQuery;\n\n@Named(value = \"indexController\"\
    )\n@RequestScoped\npublic class IndexController implements Serializable {\n  \
    \  @Inject\n    private Conversation conversation;\n\n    @Inject\n    private\
    \ Person person;\n\n    @PersistenceUnit\n    EntityManagerFactory emf;\n\n  \
    \  @PersistenceContext\n    EntityManager em;\n\n    @Resource\n    UserTransaction\
    \ utx;\n\n    private List<Address> persons = new ArrayList();\n\n    public IndexController()\
    \ {\n    }\n\n    public String cancel() {\n        conversation.end();\n    \
    \    return \"index\";\n    }\n\n    public String page1() {\n        conversation.begin();\n\
    \        return \"page1\";\n    }\n\n    public List<Address> getPersons() {\n\
    \        try {\n            CriteriaQuery cq = em.getCriteriaBuilder().createQuery();\n\
    \            cq.select(cq.from(Address.class));\n            Query q = em.createQuery(cq);\n\
    \            return persons = q.getResultList();\n        } catch (Exception ex)\
    \ {\n        }\n        return persons;\n    }\n\n    public String add() {\n\
    \        try {\n            utx.begin();\n            em.persist(person.getAddress());\n\
    \            utx.commit();\n            conversation.end();\n            return\
    \ \"index\";\n        } catch (Exception ex) {\n            try {\n          \
    \      utx.rollback();\n            } catch (Exception e) {\n            }\n \
    \       }\n        return \"\";\n    }\n}\n```\n\n在这里你应该注意，现在的上下文是 `RequestScoped`。此外，注意\
    \ `page1()` 和 `cancel()` 两个方法。第一个从 `index.xhtml` 调用，如果你选择创建一个新地址。它调用 `conversation.begin()`\
    \ 方法，这会启动一个新的对话。`cancel()` 方法在三个编辑页面之一中点击“取消”时被调用，重要的是它执行了 `conversation.end()`\
    \ 方法来完成正在进行的对话。这意味着容器将移除该 bean。\n\n"
- fmt: "\nA web service is a component that can be hosted on a web server and provides\
    \ services to clients, and web services can to some extent be perceived as an\
    \ alternative to enterprise java beans. Web services are characterized by being\
    \ easy to develop and are platform independent. The latter means that communication\
    \ between a web service and clients occurs as `XML` and after a protocol called\
    \ `SOAP`, and thus exclusively as text. Therefore, the use of web services is\
    \ perceived as a secure technology, and the price is encoding of messages such\
    \ as `XML` may cost a little on performance. A web service and its services must\
    \ be defined to clients with regard to parameters and return values, and it is\
    \ done using an XML document called a `Web Service Definition Language (WSDL)`\
    \ document. The biggest challenge in writing web services is to write this document,\
    \ which is quite complex (difficult and comprehensive syntax), but here NetBeans\
    \ helps as it generates it all, and you can actually write web services without\
