    \ EJB 中，由它使用 JPA 维护数据库。因此你需要编写三个项目：\n\n1. `WorldRemote`，这是一个远程接口\n2. `WorldEJB`，这是一个\
    \ EJB 模块项目\n3. `WorldClient`，这是一个 Web 应用\n\n![](img/00157.jpeg) 4![](img/00158.jpeg)\n\
    \n### CDI\n\nCDI 代表 `Context and Dependency Injection`（上下文与依赖注入），描述了应用服务器如何创建和移除对象，特别是你可以在代码中写以及应该写什么。例如，如果你考虑一个带有备用豆（backing\
    \ bean）的 JSF 页面，它只是一个普通的 Java 类，那么你不需要做任何操作来创建该类的对象，对象的生命周期由其注解定义的范围决定。\n\n![](img/00159.jpeg)\
    \ JavaBean 只是按照特定且简单的模式编写的类，程序员使用 `new` 操作符创建对象（豆）。之后，垃圾回收器负责在不再有引用它时移除该对象。相比之下，托管豆（managed\
    \ bean）是一种豆，它由应用服务器形式的容器负责创建对象，并在程序离开对象范围时再次移除该对象。这种豆也称为 CDI 对象。你不能用 `new` 创建托管豆。CDI\
    \ 对象是使用称为“注入”（injection）的技术创建的，这意味着由容器来处理。在定义带有注入的 bean 时，容器将检查该 bean 是否已创建，如果没有创建，它将实例化新对象，并对所有当前\
    \ bean 依赖的 bean 执行注入，最后执行被 `@PostConstruct` 装饰过的方法。\n\n| 本电子书使用 SETASIGNSetaPDF\
    \ PDF 组件制作，供 PHP 开发者使用![](img/00091.jpeg) |\n| :--- |\n| www.setasign.com |\n\n\
    然后你就可以使用对象的方法。当 bean 必须被移除时，容器将首先执行被 `@PreDestroy` 装饰过的方法，然后由容器移除该对象。可以通过下面的图来说：\n\
    \n![](img/00160.gif)\n\nCDI 对象有一个名为 `context`（上下文）的范围，它基本上可以是请求-应用-会话（request-application-conversation）。例如，下面展示了一个简单的\
    \ bean：\n\n```java\npackage cdiprogram.beans;\nimport javax.inject.Named;\nimport\
    \ javax.enterprise.context.SessionScoped;\nimport java.io.Serializable;\n\n@Named(value\
    \ = \"person\")\n@SessionScoped\npublic class Person\n{\n    private String firstName;\n\
    \    private String lastName;\n\n    public Person()\n    {\n    }\n\n    public\
    \ String getFirstName()\n    {\n        return firstName;\n    }\n\n    public\
    \ void setFirstName(String firstName)\n    {\n        this.firstName = firstName;\n\
    \    }\n\n    public String getLastName()\n    {\n        return lastName;\n \
    \   }\n\n    public void setLastName(String lastName)\n    {\n        this.lastName\
    \ = lastName;\n    }\n}\n```\n\n有趣的地方在于打开页面时，Glassfish 服务器会注入一个 `Person` 对象到会话中，而程序员不需要做任何事情来创建对象。\n\
    \n在之前的示例中，我经常必须通过以下语句从命名 bean 获取命名 bean：\n\n```\nELContext elc = FacesContext.getCurrentInstance().ELContext();\n\
    SomeBean someBean = (SomeBean)FacesContext.getCurrentInstance().getApplication().ELResolver().getValue(elc,\
    \ null, \"person\");\n```\n\n这种写法没有错，但很难记忆。然而，你可以通过使用 CDI 来简化语法。在使用上述 bean 时，你可以编写以下\
    \ JSF 页面：\n\n```xml\n<?xml version='1.0' encoding='UTF-8' ?>\n<!DOCTYPE html PUBLIC\
    \ \"-//W3C//DTD XHTML 1.0 Transitional//EN\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    \ xmlns:h=\"http://xmlns.jcp.org/jsf/html\">\n<h:head>\n    <title>Facelet Title</title>\n\
    </h:head>\n<h:body>\n    <h:form>\n        <h:panelGrid columns=\"2\">\n     \
    \       <h:outputLabel for=\"firstName\" value=\"First Name\"/>\n            <h:inputText\
    \ id=\"firstName\" value=\"#{person.firstName}\"/>\n            <h:outputLabel\
    \ for=\"lastName\" value=\"Last Name\"/>\n            <h:inputText id=\"lastName\"\
    \ value=\"#{person.lastName}\"/>\n            <h:commandButton value=\"OK\" />\n\
    \        </h:panelGrid>\n    </h:form>\n</h:body>\n</html>\n```\n\n![](img/00161.jpeg)<map\
    \ name=\"aw17\" class=\"calibre74\"><area shape=\"rect\" href=\"http://www.sylvania.com/\"\
    \ coords=\"141,38,237,49\" class=\"calibre75\"></map>![](img/00162.jpeg)\n\n考虑以下命名\
    \ bean，它代表一个带有名字和科目的学生：\n\n```java\npackage cdiprogram.beans;\nimport javax.inject.Named;\n\
    import javax.inject.Inject;\nimport javax.enterprise.context.SessionScoped;\n\
    import java.io.Serializable;\n\n@Named(value = \"student\")\n@SessionScoped\n\
    public class Student\n{\n    @Inject\n    private Person person;\n    private\
    \ String subject;\n\n    public Student()\n    {\n    }\n\n    public Person getPerson()\n\
    \    {\n        return person;\n    }\n}\n```\n\n"
