- fmt: "\nIn this exercise you must write a web application that opens and displays\
    \ the content of the table `zipcode` in the database `padata` when the application\
    \ has to use JPA. Start with a new web application project, which you can call\
    \ `ZipcodePage`. You must then add an entity class as an `Entity` from `Datebase`.\
    \ You must define a `Data Source` for database `padata` and after you have done\
    \ so, you should be able to view all tables in the database. Here you have to\
    \ choose the table `zipcode`. \n\nWhen you get to the next window (see below),\
    \ you must select a package and remove some checkmarks, but not the last checkmark.\
    \ After you run the wizard, you’ve created an entity class named `Zipcode`, and\
    \ when you examine the code, you should note that fewer named queries have been\
    \ created this time. The reason is that the following window is not checked for\
    \ `Generate Named Query Annotations for Persistent Fields`.\n\n![](images/00040.jpeg)30\n\
    \n![](images/00041.jpeg)<map name=\"awmap5\" class=\"calibre474\"><area shape=\"\
    rect\" href=\"http://www.rug.nl/feb/education\" coords=\"114, 429, 146, 453\"\
    \ class=\"calibre475\"><area shape=\"rect\" href=\"http://www.rug.nl/feb/education\"\
    \ coords=\"114, 405, 341, 428\" class=\"calibre475\"></map>![](images/00042.jpeg)![](images/00043.jpeg)![](images/00044.jpeg)![](images/00045.jpeg)![](images/00046.jpeg)![](images/00047.jpeg)Note\
    \ that a `Named Query` is an example of a `SELECT` statement written as a variant\
    \ of SQL called `JPQL`.\n\n![](images/00048.jpeg)\n\n![](images/00049.jpeg)\n\n\
    ### Controller\n\nAs a next step, you need to add a database controller, named\
    \ `ZipcodeJpaController`, for your entity class like in the previous example.\n\
    \nYou must create a named bean for `index.xhtml` when the result must be the above\
    \ window, which shows a table with the zip codes. The bottom entry fields should\
    \ act as a filter:\n\n1. the content of the first field must match all `zip codes`\
    \ starting with the value\n2. the content of the second field must match all `city\
    \ names` that contains the value\n\nThe `Clear` link should clear the two entry\
    \ fields (but should not update the table), while the `Update` link should update\
    \ the table corresponding to the content of the filter. Loading the database table\
    \ should only take place, when the program starts. You can do that in your bean\
    \ to write a method `init()` and decorate it as shown below:\n\n```java\n@PostConstruct\
    \ private void init() \n{\n    ZipcodeJpaController ctrl = new ZipcodeJpaController(utx,\
    \ emf); \n    zipcodes = ctrl.findZipcodeEntities();\n}\n```\n\nIt is a method\
    \ that is performed immediately after the object is instantiated.\n\n### 2.2 RELATED\
    \ TABLES\n\nWriting a web application like the above is because of JPA quite simple,\
    \ but of course it is also a simple application and primarily because the database\
    \ has only one single table. In this section I will show an example where the\
    \ database has more tables and where there are relationships between the individual\
    \ tables, and here the benefits of JPA become even more pronounced.\n\nAs an example,\
    \ I will use the Database Library from the book `Java 7`:\n\n![](images/00050.gif)\n\
    \nI will only use the four entities `book`, `publisher`, `category` and `author`.\
    \ Here you should note that there is a many-to-one relationship between `publisher`\
    \ and `book` as well as between `category` and `book`. In addition, there is a\
    \ many-many relationship between `book` and `author`. The example is a web application\
    \ called `PaBooks`, and it should generally be able to maintain the tables corresponding\
    \ to the above four entities. It should be noted that the user interface is simple\
    \ – simply to keep focus on database transactions and JPA. In the following, as\
    \ in the first two examples of this chapter, I will primarily focus on how the\
    \ program is made, and especially how to use a `JPA` to develop a database application.\n\
    \nThe start is a web application called `PaBooks`, and after the application has\
    \ been created, I have selected `Entity Classes` from `Database`, and here I created\
    \ a data source `booklibrary` that creates a connection to the `library` database\
    \ and after doing that, you get an overview of the database tables:\n\n![](images/00051.jpeg)\n\
    \nHere are the tables:\n- `author`\n- `book`\n- `category`\n- `publisher`\n- `written`\n\
    \nadded to `Selected Tables`:\n\n![](images/00052.jpeg)<map name=\"awmap6\" class=\"\
    calibre4\"><area shape=\"rect\" href=\"http://suniversity.com/\" coords=\"173,\
    \ 433, 413, 459\" class=\"calibre39\"></map>![](images/00053.jpeg)\n\n![](images/00054.jpeg)Note\
    \ that the table `written` appears as bold, and it is a relationship between `book`\
    \ and `author`. When you click `Next`, you get the following window:\n\n![](images/00055.jpeg)Here\
    \ you can see four entity classes, and note that you can change the name of those\
    \ classes if you wish. Also note the name of the package where the classes should\
    \ be created, which I have called `pabooks.models`. When you click `Next`, you\
    \ get the following window:\n\n![](images/00056.jpeg)and when you click `Finish`,\
    \ the entity classes are created. Generally, it is rarely necessary to change\
    \ these entity classes, but sometimes I change the classes’ `toString()` method,\
    \ which I have also done in this case for the classes `Author`, `Category` and\
    \ `Publisher`. You are encouraged to study the code. Here you should note, among\
    \ other things, that the `Publisher` class has a `bookCollection` for `book` objects.\
    \ It represents a foreign key to `book` objects and thus references to the `book`\
    \ objects published on this publisher. The same goes for the `Category` class.\
    \ If you study the `book` class, you should note that it has a reference to a\
    \ `Publisher` object and a `Category` object, and thus the other side of the two\
    \ many-to-one relationships. The `book` class also has an `authorCollection` with\
    \ `Author` objects that represent the many-many relationship between `book` and\
    \ `author`. Examining the class `Author` you will see that this class has a corresponding\
    \ `bookCollection` for `book` objects that is the other side of the many-many\
    \ relationship.\n\nAfter adding entity classes, I want to add controller classes\
    \ by selecting `JPA Controller Classes` from `Entity Classes`:\n\n![](images/00057.jpeg)\n\
    \nA controller must be created for all four entity classes that are added to `Selected\
    \ Entity Classes`, and after clicking `Next` and selecting the desired package\
    \ (here `pabooks.models`) and clicking `Finish`, the four controller classes are\
    \ created:\n\n- `AuthorJpaController`\n- `BookJpaController`\n- `CategoryJpaController`\n\
    - `PublisherJpaController`\n\nGenerally, these classes are not changed, however,\
    \ it may be necessary to expand the classes with methods for queries on the database,\
    \ and in this case, I have extended the `BookJpaController` class with a new method.\
    \ However, it requires some syntax for how to write a `SQL SELECT` statement in\
    \ `JPA`.\n\n![](images/00058.jpeg)![](images/00059.jpeg)Criteria API\n"
