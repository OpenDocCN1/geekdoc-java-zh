    List<Object[]> arr = em.createQuery( cq.select(cb.array(root.get(\"id\"), root.get(\"\
    title\"))).where(cb.gt(root.get(\"pages\"), 300))).getResultList();\n```\n\n但在这种情况下，这个表达式并不易读，而且至少要求你深入掌握\
    \ `Criteria` API。\n\n上面的示例并没有很强的类型——结果是数组类型对象的列表。这可以通过包装类来解决：\n\n```java\npackage\
    \ pabooks.models\n\npublic class BookWrapper {\n    private int id; private String\
    \ title;\n\n    public BookWrapper(int id, String title) {\n        this.id =\
    \ id; this.title = title;\n    }\n\n    public int getId() {\n        return id;\n\
    \    }\n\n    public String getTitle() {\n        return title;\n    }\n\n   \
    \ public void setId(int id) {\n        this.id = id;\n    }\n\n    public void\
    \ setTitle(String title) {\n        this.title = title;\n    }\n}\n```\n\n这只是一个封装了书籍\
    \ `id` 和 `title` 的类。此时查询可以这样写：\n\n```java\nCriteriaBuilder cb = em.getCriteriaBuilder();\
    \ CriteriaQuery<BookWrapper> cq = cb.createQuery(BookWrapper.class); Root<Book>\
    \ root = cq.from(Book.class);\ncq.select( cb.construct(BookWrapper.class, root.get(Book_.id),\
    \ root.get(Book_.title))); cq.where(cb.gt(root.get(Book_.pages), 300)); List<BookWrapper>\
    \ list = em.createQuery(cq).getResultList();\n```\n\n首先，注意你为 `BookWrapper` 对象定义了一个准则查询。接下来，你使用构建器中的\
    \ `select()` 和 `construct()` 方法，它告诉你构建 `BookWrapper` 对象。其余部分原则上与上一个示例相同。\n\n查询也可以返回\
    \ `Tuple` 对象，在语法上最大的区别是查询对象是使用 `createTupleQuery()` 创建的：\n\n```java\nCriteriaBuilder\
    \ cb = em.getCriteriaBuilder(); CriteriaQuery<Tuple> cq = cb.createTupleQuery();\
    \ Root<Book> root = cq.from(Book.class); Path<Integer> idPath = root.get(Book_.id);\
    \ Path<String> titlePath = root.get(Book_.title); cq.multiselect(idPath, titlePath);\
    \ cq.where(cb.gt(root.get(Book_.pages), 300));\nList<Tuple> list = em.createQuery(cq).getResultList();\n\
    ```\n\n优点是你可以不需要编写包装类。注意使用 `multiselect()` 来指定包含在结果中的列，它们用于指定结果中的多个属性。另外一点是如何使用单个的\
    \ `Tuple` 对象。我不在这里详细介绍（鼓励你去研究 `Tuple` 类型——它是一个接口），但你可以写下面的代码（尽管代码在这种语境下没有太大意义）：\n\
    \n![](img/00062.jpeg)![](img/00063.jpeg)\n\n```java\nfor (Tuple t : list) {\n\
    \    Integer id = t.get(idPath); String str1 = (String)t.get(1);\n    String str2\
    \ = t.get(1, String.class);\n}\n```\n\n准则查询对象定义了从一个或多个实体的查询（在上面的示例中，每次只有一个实体 `Book`）。当然，你可以指定更多的实体，它们对应于\
    \ SQL 中的连接操作。我将从一个确定所有出版商名称以 `Sams` 开头的书籍查询开始：\n\n```java\nCriteriaBuilder cb\
    \ = em.getCriteriaBuilder(); CriteriaQuery<Book> cq = cb.createQuery(Book.class);\
    \ Root<Book> books = cq.from(Book.class);\nJoin<Book, Publisher> pubs = books.join(\"\
    pubid\"); cq.select(books).where(cb.like(pubs.get(\"name\"), \"Sams\"));\nreturn\
    \ em.createQuery(cq);\n```\n\n首先，准则查询对象定义了从一个或多个实体的查询。注意 `Book` 和 `Publisher`\
    \ 之间存在多对多的关系。下一个示例相同，但查询确定了所有标题包含 `Fedora` 单词书籍：\n\n```java\nCriteriaBuilder cb\
    \ = em.getCriteriaBuilder(); CriteriaQuery<Book> cq = cb.createQuery(Book.class);\
    \ Root<Book> books = cq.from(Book.class);\nJoin<Book, Publisher> pubs = books.join(\"\
    pubid\"); cq.select(books).where(cb.or(cb.like(books.get(\"title\"), \"%Fedora%\"\
    ), cb.like(pubs.get(\"name\"), \"Sams%\")));\nreturn em.createQuery(cq).getResultList();\n\
    ```\n\n下一个查询确定所有标题包含搜索值、名称包含搜索值且类别包含搜索值的书籍：\n\n```java\nCriteriaBuilder cb = em.getCriteriaBuilder();\
    \ CriteriaQuery<Book> cq = cb.createQuery(Book.class); Root<Book> books = cq.from(Book.class);\n\
    Join<Book, Publisher> pubs = books.join(\"pubid\"); Join<Book, Category> cats\
    \ = books.join(\"catid\");\nPredicate pc = cb.and(cb.like(books.get(\"title\"\
    ), \"%\" + title + \"%\"), cb.like(pubs.get(\"name\"), \"%\" + pubname + \"%\"\
    ), cb.like(cats.get(\"name\"), \"%\" + catname + \"%\"));\ncq.select(books).where(pc);\n\
    return em.createQuery(cq).getResultList();\n```\n\n作为最后一个示例，我将展示如何通过查询查找特定书籍的所有作者。`Book`\
    \ 和 `Author` 之间存在多对多的关系：\n\n```java\nCriteriaBuilder cb = em.getCriteriaBuilder();\
    \ CriteriaQuery<Author> cq = cb.createQuery(Author.class); Root<Author> root =\
    \ cq.from(Author.class);\nJoin<Author, Book> books = root.join(\"bookCollection\"\
    ); cq.where(cb.equal(books.get(\"isbn10\"), \"0-672-32584-5\")); cq.select(root);\n\
    List<Author> list = em.createQuery(cq).getResultList();\n```\n\n"
