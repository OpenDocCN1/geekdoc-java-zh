    字母不区分大小写，且名称不能为保留字（函数名）。所存储的值为 `result` 字段的值。如果你输入一个现有变量的名称并点击 `RCL`，该值将显示在 `result`
    字段中。


    例如，如果我想将 2 的平方根保存到变量 `X2` 中，我必须输入公式：


    ```

    sqrt(2)

    ```


    然后点击 `Calculate`，该值就会被添加到 `result` 字段中。要保存该值，你必须在 `STO` 之后输入名称 `X2` 并点击 `STO`。如果你现在想在公式中使用该变量，请如下方式输入变量：


    ```

    sqr(@x2) + 3

    ```


    由于我选择了这种语法，由于变量的值可能非常长并直接插入到公式中，很容易导致产生无法阅读的表达式。


    该应用程序只有一个页面，非常简单，但它有一个使用我的 session bean 的后端 bean（backing bean）。没什么新奇，我不想在这里展示代码，但当你研究代码时，请注意，是这个
    bean 在表达式发送到我的 session bean 之前替换了变量的值。


    ![](img/00040.jpeg)228


    '
