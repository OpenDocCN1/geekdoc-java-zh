    \ em.getTransaction().rollback();\n            throw ex;\n        }\n        finally\n\
    \        {\n            if (em != null) em.close();\n        }\n    }\n}\n```\n\
    \n此外，我修改了这些类，使它们只抛出 `Exception`，并删除了其他异常类型。当然，这没有特别的理由，更多是一个态度问题，但我认为这使得代码变得稍微易读一些。\n\
    \n最后，`BookDAO` 类添加了一个方法，用于根据所使用的搜索标准确定 `Book` 对象，但这方法与 `PaBooks` 程序中写的是同一个。\n\n\
    注意，到目前为止我还没有写很多代码，但 NetBeans 基本上已经创建了所有内容。现在缺失的是定义 `LibraryDAORemote` 接口并实现 `LibraryDAO`。接口定义如下：\n\
    \n```java\npackage booksejb.beans;\n\nimport javax.ejb.Remote;\nimport java.util.List;\n\
    \n@Remote\npublic interface LibraryDAORemote\n{\n    public boolean addCategory(Category\
    \ category);\n    public boolean modCategory(Category category);\n    public boolean\
    \ delCategory(Category category);\n    public List<Category> getCategories();\n\
    \n    public boolean addPublisher(Publisher publisher);\n    public boolean modPublisher(Publisher\
    \ publisher);\n    public boolean delPublisher(Publisher publisher);\n    public\
    \ List<Publisher> getPublishers();\n\n    public boolean addAuthor(Author author);\n\
    \    public boolean modAuthor(Author author);\n    public boolean delAuthor(Author\
    \ author);\n    public List<Author> getAuthors();\n\n    public boolean addBook(Book\
    \ book);\n    public boolean modBook(Book book);\n    public boolean delBook(Book\
    \ book);\n\n    public List<Book> getBooks(String title, String pubname, String\
    \ catname);\n}\n```\n\n各个方法的名称应该能够解释它们的用途。由于有 12 个方法（每个实体 4 个），`LibraryDAO` 的代码量会很大，但由于每个实体的实现基本上是相同的，我将只展示实体\
    \ `Category` 的代码：\n\n![](img/00152.jpeg)![](img/00153.jpeg)\n\n```java\npackage\
    \ booksejb.beans;\n\nimport javax.ejb.Stateless;\nimport java.util.List;\nimport\
    \ booksejb.daos.*;\n\n@Stateless\npublic class LibraryDAO implements LibraryDAORemote\n\
    {\n    @Override\n    public boolean addCategory(Category category)\n    {\n \
    \       try\n        {\n            CategoryDAO dao = new CategoryDAO();\n   \
    \         dao.create(category);\n            return true;\n        }\n       \
    \ catch (Exception ex)\n        {\n            return false;\n        }\n    }\n\
    \n    @Override\n    public boolean modCategory(Category category)\n    {\n  \
    \      try\n        {\n            CategoryDAO dao = new CategoryDAO();\n    \
    \        dao.edit(category);\n            return true;\n        }\n        catch\
    \ (Exception ex)\n        {\n            return false;\n        }\n    }\n\n \
    \   @Override\n    public boolean delCategory(Category category)\n    {\n    \
    \    try\n        {\n            CategoryDAO dao = new CategoryDAO();\n      \
    \      dao.destroy(category);\n            return true;\n        }\n        catch\
    \ (Exception ex)\n        {\n            return false;\n        }\n    }\n\n \
    \   @Override\n    public List<Category> getCategories()\n    {\n        List<Category>\
    \ list = (new CategoryDAO()).findEntities();\n        for (Category c : list)\
    \ c.getBookCollection().size();\n        return list;\n    }\n}\n```\n\n代码非常简单，所有的工作由\
    \ DAO 类完成，原则上就是创建 DAO 对象并调用方法。但是这里有一个被称为懒加载（LAZY）的问题。例如，如果你获取 `Category` 实体，它有一个\
    \ `bookCollection` 集合，包含了分类下的所有 `Book`。因此这些对象在读取数据库时必须初始化，并且由于这些对象经常被使用，JPA 在引用它们时会先创建它们。这就是\
    \ `getCategories()` 方法中出现的循环的目的。\n\n在 `LibraryDAO` 类实现后，`BooksEJB` 就完成了，并可以翻译并托管在服务器上。\n\
    \n最后是客户端程序，它可以从 `PaBooks` 复制。我创建了一个名为 `BooksClient` 的 Web 项目。该项目应该包含 `BooksRemote`\
    \ 的引用，除此之外，还应该从 `PaBooks` 复制以下文件：\n\n![](img/00154.jpeg)\n\n然而，这五个命名 Bean 类（named\
    \ bean classes）必须进行一些修改，作为示例，我展示了 `CategoryBean`，它是 `categories.xhtml` 的命名 Bean：\n\
    \n![](img/00155.jpeg)\n![](img/00156.jpeg)\n\n```java\npackage booksclient.beans;\n\
    \nimport booksejb.beans.LibraryDAORemote;\nimport javax.ejb.EJB;\nimport javax.inject.Named;\n\
    import javax.enterprise.context.SessionScoped;\nimport java.util.*;\nimport booksejb.beans.*;\n\
    \n@Named(value = \"categoryBean\")\n@SessionScoped\npublic class CategoryBean\n\
    {\n    // Implementation\n}\n```\n"
