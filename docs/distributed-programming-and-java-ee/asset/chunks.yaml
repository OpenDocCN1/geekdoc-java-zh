    \n```java\npackage zipcodes.beans;\n\nimport javax.ejb.Remote; import java.util.List;\n\
    \n@Remote\npublic interface ZipcodesSessionRemote\n{\n    public boolean create(ZipcodeRemote\
    \ obj); \n    public boolean update(ZipcodeRemote obj); \n    public boolean remove(String\
    \ code);\n    public List<ZipcodeRemote> search(String code, String City);\n}\n\
    ```\n\nThe biggest work is to implement the class `ZipcodesSession`. In the `zipcodes.models`\
    \ package I have added an entity class `Zipcode` for the database table. This\
    \ class is unchanged from the code generated by NetBeans. I would like to add\
    \ a class for database operations, but a JPA controller class can not be directly\
    \ used from an EJB, so I added my own (which is nothing but a modified and scaled-down\
    \ version of the controller class created by NetBeans – see also the next example),\
    \ which I have called `ZipcodeDAO`:\n\n![](images/00136.jpeg)!(images/00137.jpeg)\n\
    \n```java\npackage zipcodes.models;\n\nimport java.util.*;\nimport javax.persistence.*;\n\
    \npublic class ZipcodeDAO\n{\n    public EntityManager getEntityManager()\n  \
    \  {\n        return Persistence. createEntityManagerFactory(\"ZipcodesEJBPU\"\
    ).createEntityManager();\n    }\n\n    public void create(Zipcode zipcode) throws\
    \ Exception\n    {\n        EntityManager em = null;\n        try\n        {\n\
    \            em = getEntityManager(); em.getTransaction().begin(); em.persist(zipcode);\
    \ em.getTransaction().commit();\n        }\n        catch (Exception ex)\n   \
    \     {\n            if (em != null) em.getTransaction().rollback(); throw ex;\n\
    \        }\n        finally\n        {\n            if (em != null) em.close();\n\
    \        }\n    }\n\n    public void edit(Zipcode zipcode) throws Exception\n\
    \    {\n        EntityManager em = null;\n        try\n        {\n           \
    \ em = getEntityManager(); em.getTransaction().begin(); em.merge(zipcode); em.getTransaction().commit();\n\
    \        }\n        catch (Exception ex)\n        {\n            if (em != null)\
    \ em.getTransaction().rollback(); throw ex;\n        }\n        finally\n    \
    \    {\n            if (em != null) em.close();\n        }\n    }\n\n    public\
    \ void destroy(String code) throws Exception\n    {\n        EntityManager em\
    \ = null;\n        try\n        {\n            em = getEntityManager(); em.getTransaction().begin();\
    \ Zipcode zipcode;\n            try\n            {\n                zipcode =\
    \ em.getReference(Zipcode.class, code); zipcode.getCode();\n            }\n  \
    \          catch (Exception e)\n            {\n                throw new Exception(\"\
    The zipcode with id \" + code + \" no longer exists\");\n            }\n     \
    \       em.remove(zipcode); em.getTransaction().commit();\n        }\n       \
    \ catch (Exception ex)\n        {\n            if (em != null) em.getTransaction().rollback();\
    \ throw ex;\n        }\n        finally\n        {\n            if (em != null)\
    \ em.close();\n        }\n    }\n\n    public List<Zipcode> getZipcodes(String\
    \ code, String city)\n    {\n        if (code == null) code = \"\"; if (city ==\
    \ null) city = \"\"; EntityManager em = null;\n        try\n        {\n      \
    \      em = getEntityManager(); Query cq = em.createQuery(\n            \"SELECT\
    \ z FROM Zipcode z WHERE z.code like :code AND z.city like :city\"); cq.setParameter(\"\
    code\", code + \"%\");\n            cq.setParameter(\"city\", \"%\" + city + \"\
    %\"); return cq.getResultList();\n        }\n        catch (Exception ex)\n  \
    \      {\n            return new ArrayList();\n        }\n        finally\n  \
    \      {\n            if (em != null) em.close();\n        }\n    }\n}\n```\n\n\
    The class is very similar to the DAO (Data Access Object) classes that NetBeans\
    \ creates, but you should note how to create an `EntityManager` object and how\
    \ to define transactions associated with `Create`, `Update` and `Delete`. Also\
    \ note the last method, which is the search method. Here, `JPQL` is used instead\
    \ of the `Criteria API`. It’s a matter of taste, if you do one or the other, but\
    \ if you know `SQL`, it’s easiest to use `JPQL`.\n\nWith these two classes in\
    \ place, you can write the class `ZipcodesSession`, where the code is actually\
    \ quite simple as all the work is delegated to the DAO class:\n\n![](images/00138.jpeg)!(images/00139.jpeg)!(images/00140.jpeg)!(images/00067.jpeg)\n\
    \n```java\npackage zipcodes.beans;\n\nimport java.util.*;\nimport javax.ejb.Stateless;\n\
    import zipcodes.models.*;\n\n@Stateless\npublic class ZipcodesSession implements\
    \ ZipcodesSessionRemote\n{\n    @Override\n    public boolean create(ZipcodeRemote\
    \ obj)\n    {\n        try\n        {\n            (new ZipcodeDAO()).create(new\
    \ Zipcode(obj.getCode(), obj.getCity()));\n            return true;\n        }\n\
    \        catch (Exception ex)\n        {\n            return false;\n        }\n\
    \    }\n\n    @Override\n    public boolean update(ZipcodeRemote obj)\n    {\n\
    \        try\n        {\n            (new ZipcodeDAO()).edit(obj);\n         \
    \   return true;\n        }\n        catch (Exception ex)\n        {\n       \
    \     return false;\n        }\n    }\n\n    @Override\n    public boolean remove(String\
    \ code)\n    {\n        try\n        {\n            (new ZipcodeDAO()).destroy(code);\n\
    \            return true;\n        }\n        catch (Exception ex)\n        {\n\
    \            return false;\n        }\n    }\n\n    @Override\n    public List<Zipcode>\
    \ search(String code, String city)\n    {\n        return (new ZipcodeDAO()).getZipcodes(code,\
    \ city);\n    }\n}\n```\n\n### 3.8 CRUD WITH MORE TABLES\n\nAs the last example\
    \ of Enterprise Java Beans, I will review the `Books` program from the previous\
    \ chapter. It must be the same with only one change in which the entire logic\
    \ must be moved to an EJB, which uses JPA to maintain the database. There will\
    \ be three projects:\n\n1. `BooksEJB`, which is an Enterprise Bean hosted on the\
    \ server, and which can maintain the database.\n2. `BooksRemote`, which is a library\
    \ that defines a remote interface to the above EJB.\n3. `BooksClient`, which is\
    \ the web application, which uses `BooksEJB`.\n\nIn the following I will describe\
    \ the process and the main challenges.\n\nI have started creating an EJB Module\
    \ project:\n\n![](images/0141.jpeg)\n\nI have called the project `BooksEJB`.\n\
    \nAs a next step, I’ve created a classic library project called `BooksRemote`.\
    \ For this library I have selected Entity Classes from Database and selected a\
    \ connection to the database:\n\n![](images/0142.jpeg)\n\nI have then chosen the\
    \ 5 tables that I will apply and in the following window I have entered the name\
