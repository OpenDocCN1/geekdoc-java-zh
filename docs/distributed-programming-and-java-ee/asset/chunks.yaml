    \ em.createQuery(\"select count(u) from User where u.name = :name\");\n      \
    \      query.setParameter(\"name\", getUser());\n            Long count = (Long)\
    \ query.getSingleResult();\n\n            if (count > 0)\n            {\n    \
    \            query = em.createQuery(\"select object(u) from User where u.name\
    \ = :name\");\n                query.setParameter(\"name\", getUser());\n    \
    \            setUser((User) query.getSingleResult());\n            }\n       \
    \     return true;\n        }\n        catch (Exception ex)\n        {\n     \
    \       setUser(null);\n            session = getSession();\n            session.setAttribute(\"\
    authenticated\", false);\n            if (request != null)\n            {\n  \
    \              try\n                {\n                    request.logout();\n\
    \                }\n                catch (Exception e) {\n                {\n\
    \                }\n            }\n            return false;\n        }\n    \
    \    finally\n        {\n            setPassword(null);\n        }\n    }\n\n\
    \    public HttpSession getSession()\n    {\n        HttpServletRequest request\
    \ = (HttpServletRequest) FaceContext.getCurrentInstance().getExternalContext().getRequest();\n\
    \        return request.getSession(false);\n    }\n\n    @Override\n    public\
    \ String getPassword()\n    {\n        return this.password;\n    }\n\n    @Override\n\
    \    public void setPassword(String password)\n    {\n        this.password =\
    \ password;\n    }\n\n    @Override\n    public User getUser()\n    {\n      \
    \  if (this.user == null) user = new User();\n        return user;\n    }\n\n\
    \    @Override\n    public void setUser(User user)\n    {\n        this.user =\
    \ user;\n    }\n}\n```\n\n### Managed Bean\n\n该类实现了两个属性，它们不需要特殊的解释，重要的部分自然是 `login()`\
    \ 方法。\n\n```java\n@Named(value = \"authenticationCtrl\")\n@SessionScoped\npublic\
    \ class AuthenticationCtrl implements Serializable\n{\n    @EJB\n    private AuthenticationBeanRemote\
    \ authenticationBean; \n    private User user;\n    private boolean authenticated\
    \ = false;\n\n    public AuthenticationCtrl()\n    {\n    }\n\n    public String\
    \ getUsername()\n    {\n        return getUser().getName();\n    }\n\n    public\
    \ void setUsername(String username)\n    {\n        getUser().setName(username);\n\
    \    }\n}\n```\n"
