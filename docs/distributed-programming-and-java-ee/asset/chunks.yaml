    \ Module and a Web Application. For the EJB Module, I have added an EJB, but this\
    \ time it’s a Timer Session Bean:\n\n![](images/00128.jpeg)\n\nYou will then get\
    \ the following window, where you should as usual must enter a name (here `PrimesSession`)\
    \ and a package (`primes.ejbs`). I have also selected that it must be a `Singleton`\
    \ and that a `Local` interface should be created:\n\n![](images/00129.jpeg)\n\n\
    ![](images/00130.jpeg)![](images/00131.jpeg)Finally, I have set the time interval\
    \ for when the timer has to tick. In this case, the pattern means that the timer\
    \ must tick every half-minute. After clicking Finish, NetBeans creates the following\
    \ class:\n\n```java\npackage primesejb.ejbs;\n\nimport javax.ejb.Schedule;\nimport\
    \ javax.ejb.Singleton;\n\n@Singleton\npublic class PrimesSession implements PrimesSessionLocal\n\
    {\n    @Schedule(hour = \"*\", minute = \"*\", second = \"*/30\")\n    public\
    \ void myTimer()\n    {\n    }\n}\n```\n\nas well as a defining interface. As\
    \ can be seen, it is a usual session bean with the only difference that a timer\
    \ method has been created, with a `@Schedule` annotation defining that it is a\
    \ timer function and how often it should tick. The finished interface is:\n\n\
    ```java\npackage primesejb.ejbs;\n\nimport javax.ejb.Local;\nimport java.math.BigInteger;\n\
    \n@Local\npublic interface PrimesSessionLocal\n{\n    public void myTimer();\n\
    \    public void reset();\n    public BigInteger getPrime();\n    public int getIndex();\n\
    }\n```\n\nwhere in addition to the timer, three methods are defined. The class\
    \ `PrimesSession` will implement the interface:\n\n```java\npackage primesejb.ejbs;\n\
    \nimport java.math.BigInteger;\nimport javax.ejb.Schedule;\nimport javax.ejb.Singleton;\n\
    \n@Singleton\npublic class PrimesSession implements PrimesSessionLocal\n{\n  \
    \  private BigInteger two = new BigInteger(\"2\");\n    private BigInteger prime\
    \ = new BigInteger(\"2\");\n    private int index = 0;\n\n    @Schedule(hour =\
    \ \"*\", minute = \"*\", second = \"*/30\")\n    public void myTimer()\n    {\n\
    \        if (prime.equals(two)) prime = new BigInteger(\"3\");\n        else\n\
    \        {\n            prime = prime.add(two);\n            while (!prime.isProbablePrime(50))\
    \ prime = prime.add(two);\n        }\n        ++index;\n    }\n\n    public void\
    \ reset()\n    {\n        prime = two;\n        index = 0;\n    }\n\n    public\
    \ BigInteger getPrime()\n    {\n        return prime;\n    }\n\n    public int\
    \ getIndex()\n    {\n        return index;\n    }\n}\n```\n\nYou should note that\
    \ the class has three instance variables, and since it is a singleton session\
    \ bean, these variables will retain their values from the class `PrimesSession`\
    \ is initialized for the first time until the Glassfish server is stopped. That\
    \ is, starting the application multiple times, the state of the session bean will\
    \ be preserved. The most important thing about the class is, of course, the timer\
    \ method, which modifies the variable `index`. The EJB module is complete. I have\
    \ added a named bean to the web application:\n\n```java\npackage primesejb.beans;\n\
    \nimport javax.inject.Named;\nimport javax.enterprise.context.RequestScoped;\n\
    import java.math.BigInteger;\nimport javax.ejb.EJB;\nimport primesejb.ejbs.PrimesSessionLocal;\n\
    \n@Named\n@RequestScoped\npublic class PrimesBean\n{\n    @EJB\n    private PrimesSessionLocal\
