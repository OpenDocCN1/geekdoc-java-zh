    \ 定义了用于 HTTP `PUT` 方法。注意，第一个方法被 `@Produces` 装饰，这表示该方法返回 XML；而另一个方法被 `@Consumes`\
    \ 装饰，这表示该方法将参数的内容解释为 XML。在这种情况下，最后一个方法是空的，而第一个方法返回了一些 XML。\n\n容器必须知道资源被称为什么，这就是第二个类的目的：\n\
