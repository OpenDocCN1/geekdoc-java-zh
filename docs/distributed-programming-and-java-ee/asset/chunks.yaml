- fmt: "\nAs shown above, a web service is not much more than a usual Java class decorated\
    \ with a few annotations and it all wrapped up in a web application. It is also\
    \ possible to use a stateless session bean as a web service. It allows for using\
    \ a stateless EJB from languages other than Java, as well as using other properties\
    \ of enterprise java beans such as transactions. In fact, you can do it in two\
    \ ways by either creating a web service in an EJB or by embedding an EJB as a\
    \ web service.\n\n## Example 1: EJB Module with Stateless Session Bean\n\n![](images/00201.jpeg)\n\
    <map name=\"awmap22\" class=\"calibre474\"><area shape=\"rect\" href=\"http://www.ligsuniversity.com/\"\
    \ coords=\"173, 433, 413, 459\" class=\"calibre475\"></map>\n![](images/00202.jpeg)\n\
    \nAs an example, I have set up an EJB Module project, which I have called `EJBConversion`.\
    \ For this project I have added a web service called `Conversion`:\n\n![](images/00203.jpeg)\n\
    \nNote that `Create Web Service from Scratch` has been selected, and the bottom\
    \ check box has been ticked. After clicking `Finish`, a web service has been created,\
    \ where there is primarily one difference, namely, that it is a stateless session\
    \ bean. The completed service is shown below:\n\n```java\npackage ejbconversion.services;\n\
    \nimport javax.jws.WebService; import javax.jws.WebMethod; import javax.jws.WebParam;\
    \ import javax.ejb.Stateless;\n\n@WebService(serviceName = \"Conversions\") @Stateless()\n\
    \npublic class Conversions\n{\n\n@WebMethod(operationName = \"celsiusToFahrenheit\"\
    )\npublic double celsiusToFahrenheit(@WebParam(name = \"value\") double value)\n\
    {\nreturn 1.8 * value + 32;\n}\n\n@WebMethod(operationName = \"fahrenheitToCelsius\"\
    )\npublic double fahrenheitToCelsius(@WebParam(name = \"value\") double value)\n\
    {\nreturn (value – 32) / 1.8;\n}\n\n}\n```\n\nThen the project can be built and\
    \ deployed in the usual way. The `ConversionProgram` project is identical to `ConversionClient`,\
    \ only with the difference that another web service is used, as above, which is\
    \ a web service hosted as an enterprise java bean.\n\n## Example 2: Using an Existing\
    \ EJB\n\nAs the last example, I will write a web service that uses an existing\
    \ EJB, and I will use `ZipcodesEJB`, which performs CRUD operations on the table\
    \ `zipcode` in the database `padata`. The EJB concerned offers 4 services, and\
    \ the goal is to provide these services with a web service.\n\nThe starting point\
    \ is an empty web application called `ZipcodesServices`. As a first step, I have\
    \ put a reference to the jar file `ZipcodesRemote`, which is the remote interface\
    \ for `ZipcodesEJB`. Next, I have added a web service called `ZipcodesWS` to the\
    \ project:\n\n![](images/00204.jpeg)\n\nHere you should especially note that `Create\
    \ Web Service from Existing Session Bean` has been selected, and I have then browsed\
    \ me to that particular bean. When you click `Finish`, NetBeans creates the following\
    \ web service:\n\n```java\npackage zipcodesservices;\n\nimport java.util.List;\
    \ import javax.ejb.EJB; import javax.jws.WebMethod; import  javax.jws.WebParam;\n\
    import javax.jws.WebService;\nimport zipcodes.beans.ZipcodeRemote;\nimport zipcodes.beans.ZipcodesSessionRemote;\n\
    \n@WebService(serviceName = \"ZipcodesWS\") public class ZipcodesWS\n{\n\n@EJB\n\
    private ZipcodesSessionRemote ejbRef;\n\n@WebMethod(operationName = \"create\"\
    )\npublic boolean create(@WebParam(name = \"obj\") ZipcodeRemote obj)\n{\nreturn\
    \ ejbRef.create(obj);\n}\n```\n\n![](images/00205.jpeg)!(images/00206.jpeg)\n\n\
    @WebMethod(operationName = \"update\")\npublic boolean update(@WebParam(name =\
    \ \"obj\") ZipcodeRemote obj)\n{\nreturn ejbRef.update(obj);\n}\n\n@WebMethod(operationName\
    \ = \"remove\")\npublic boolean remove(@WebParam(name = \"code\") String code)\n\
    {\nreturn ejbRef.remove(code);\n}\n\n@WebMethod(operationName = \"search\")\n\
    public List<ZipcodeRemote> search(@WebParam(name = \"code\") String code, @WebParam(name\
    \ = \"City\") String City)\n{\nreturn ejbRef.search(code, City);\n}\n\n}\n```\n\
    \nand as you can see, it’s not much more than a wrapper for `ZipcodesEJB`. The\
    \ service is then completed, can be translated and hosted on the server.\n\nI\
    \ have then written a client, which is a web application called `ConversionProgram`.\
    \ It is basically the same as `ConversionClient`, the difference is that a Web\
    \ Service has been added and I do not want to show the code.\n\n## Understanding\
    \ REST Services\n\nREST stands for Representational State Transfer. Like other\
    \ web services, they can be perceived as resources identified by an URI, and generally\
    \ data sent as XML. `HTTP` methods:\n1. `GET`: used to retrieve an existing resource\n\
    2. `POST`: used to create a new resource\n3. `PUT`: used to update an existing\
    \ resource\n4. `DELETE`: used to delete an existing resource\n\nI want to start\
    \ with a simple (hello) web application, which I have called `HelloApp`. After\
    \ I created the project, I added RESTful Web Services:\n\n![](images/0208.jpeg)\n\
    ![](images/0209.jpeg)\n\nwhere I have entered Resource, `Path` and Class Name.\
    \ You should note that the MIME type is XML. When I then click `Finish`, NetBeans\
    \ creates two files:\n\n![](images/0210.jpeg)\n\nJoin the best at Maastricht University\
    \ School of Business and Economics:\n- 33rd place: Global Masters\n- 1st place:\
    \ MSc International Business\n- 1st place: MSc Management of Learning\n- ...:\
    \ MSc Econometrics and Operations Research\n\n![](images/0211.jpeg)\n<map name=\"\
    awmap23\" class=\"calibre1\"><area shape=\"rect\" href=\"http://www.ligsuniversity.com/\"\
    \ coords=\"498, 416, 517, 438\" class=\"calibre39\"><area shape=\"rect\" href=\"\
    http://www.ligsuniversity.com/\" coords=\"498, 394, 707, 416\" class=\"calibre39\"\
    ></map> \n\n![](images/0212.jpeg)\n\nHere’s the last one is my RESTful web service.\
    \ The code is the following where I deleted comments, as well as entered code\
    \ in the method `getXml()`:\n\n```java\npackage helloapp.services;\n\nimport javax.ws.rs.core.Context;\
    \ import javax.ws.rs.core.UriInfo; import javax.ws.rs.Produces; import javax.ws.rs.Consumes;\
    \ import  javax.ws.rs.GET;\nimport javax.ws.rs.Path; import  javax.ws.rs.PUT;\n\
    import javax.ws.rs.core.MediaType;\n\n@Path(\"hello\")\npublic class HelloResource\n\
    {\n\n@Context\nprivate UriInfo context;\n\npublic HelloResource()\n{\n}\n\n@GET\n\
    @Produces(MediaType.APPLICATION_XML) public String getXml()\n{\nreturn\n\"<message>\\\
    n\"\n+ \"<hello>Hello from</hello>\\n\"\n+ \"<firstName>Ragnar</firstName>\\n\"\
    \n+ \"<lastName>Lodbrog</lastName>\\n\"\n+ \"<job>Viking</job>\\n\"\n+ \"</message>\\\
    n\";\n}\n\n@PUT\n@Consumes(MediaType.APPLICATION_XML) public void putXml(String\
    \ content)\n{\n}\n\n}\n```\n"
  raw: 'As  shown  above,  a  web  service  is  not  much  more  than  a  usual  Java  class  decorated  with  a  few
    annotations and it all wrapped up in a web application. It is also possible to
    use a stateless session  bean  as  a  web  service.  It  allows  for  using  a  stateless  EJB  from  languages  other  than
    Java,  as  well  as  using  other  properties  of  enterprise  java  beans  such  as  transactions.  In  fact,
    you can do it in two ways by either creating a web service in an EJB or by embedding
    an EJB as a web service.


    ![](images/00201.jpeg)<map name="awmap22" class="calibre474"><area shape="rect"
    href="http://www.ligsuniversity.com/" coords="173, 433, 413, 459" class="calibre475"></map>![](images/00202.jpeg)As
    an example, I have set up an  EJB Module  project, which I have called  EJBConversion.
    For this project I have added a web service called  Conversion:


    ![](images/00203.jpeg)


    Note that  Create Web Service from Scratch  has been selected, and the bottom
    check box has been  ticked.  After  clicking  Finish,  a  web  service  has  been  created,  where  there  is  primarily  one
    difference,  namely,  that  it  is  a  stateless  session  bean.  The  completed  service  is  shown  below:


    package ejbconversion.services;


    import javax.jws.WebService; import javax.jws.WebMethod; import javax.jws.WebParam;
    import javax.ejb.Stateless;


    @WebService(serviceName = "Conversions") @Stateless()


    public class Conversions


    {


    @WebMethod(operationName = "celsiusToFahrenheit")


    public double celsiusToFahrenheit(@WebParam(name = "value") double value)


    {


    return 1.8 * value + 32;


    }


    @WebMethod(operationName = "fahrenheitToCelsius")


    public double fahrenheitToCelsius(@WebParam(name = "value") double value)


    {


    return (value – 32) / 1.8;


    }


    }


    Then the project can be built and deployed in the usual way. The  ConversionProgram   project 
    is identical to  ConversionClient, only with the difference that another web service
    is used,         as  above,  which  is  a  web  service  hosted  as  an  enterprise  java  bean.


    As the last example, I will write a web service that uses an existing EJB, and
    I will use  ZipcodesEJB, which performs CRUD operations on the table  zipcode  in 
    the  database   padata.  The EJB concerned offers 4 services, and the goal is
    to provide these services with    a web  service.


    The  starting  point  is  an  empty  web  application  called  ZipcodesServices.  As  a  first  step,  I  have
    put  a  reference  to  the  jar  file  ZipcodesRemote,  which  is  the  remote  interface  for  ZipcodesEJB.
    Next,  I  have  added  a  web  service  called  ZipcodesWS  to  the  project:


    ![](images/00204.jpeg)


    Here you should especially note that  Create Web Service from Existing Session
    Bean  has been selected, and I have then browsed me to that particular bean. When
    you click  Finish, NetBeans creates the following web service:


    package zipcodesservices;


    import java.util.List; import javax.ejb.EJB; import javax.jws.WebMethod; import  javax.jws.WebParam;


    import javax.jws.WebService;


    import zipcodes.beans.ZipcodeRemote;


    import zipcodes.beans.ZipcodesSessionRemote;


    @WebService(serviceName = "ZipcodesWS") public class ZipcodesWS


    {


    @EJB


    private ZipcodesSessionRemote ejbRef;


    @WebMethod(operationName = "create")


    public boolean create(@WebParam(name = "obj") ZipcodeRemote obj)


    {


    return ejbRef.create(obj);


    }


    ![](images/00205.jpeg)![](images/00206.jpeg)


    @WebMethod(operationName = "update")


    public boolean update(@WebParam(name = "obj") ZipcodeRemote obj)


    {


    return ejbRef.update(obj);


    }


    @WebMethod(operationName = "remove")


    public boolean remove(@WebParam(name = "code") String code)


    {


    return ejbRef.remove(code);


    }


    @WebMethod(operationName = "search")


    public List<ZipcodeRemote> search(@WebParam(name = "code") String  code, @WebParam(name
    = "City") String City)


    {


    return ejbRef.search(code, City);


    }


    }


    and as you can see, it’s not much more than a wrapper for ZipcodesEJB. The service
    is then completed, can be translated and hosted on the server.


    I  have  then  written  a  client,  which  is  a  web  application  called  ZipcodesProgram.  It  is  basically
    the same as  ZipcodesClient, and the difference is that a  Web Service Client  has
    been added and  the  program’s  named  bean  is  changed  a  bit.  I  do  not  want  to  show  the  code  here.


    EXERCISE 6


    You must write a program that corresponds to the above  ZipcodesProgram  which
    uses the web service  ZipcodesWS  to perform CRUD operations on the table  zipcode,
    but instead of   a web application, it must be a GUI application, which you can
    call  Zipcodes.  The user interface  should  be  as  shown  below:


    ![](images/00207.jpeg)


    6 REST WEB SERVICES


    REST  stands  for  Representational  State  Transfer  and  is  also  called  for  a  RESTful  web  services.
    Like other web services, they can be perceived as resources made available and
    identified by an URI, and they are characterized by being easy to develop and
    are specifically intended     as a frontend for a database table. RESTful web
    services are generally very  flexible, and     the communication between client
    and service can be done in several ways, but generally,  data is sent either as
    XML or JSON. A web service must support at least one of four       HTTP  methods:


    1. GET,  which  is  used  to  retrieve  an  existing  resource


    2. POST,  which  is  used  to  update  an  existing  resource


    3. PUT,  which  is  used  to  create  a  new  resource


    4. DELETE,  which  is  used  to  delete  an  existing  resource


    I want to start with a simple “hello” service and I have set up a usual (blank)
    web application project, which I have called HelloApp. After I’ve created the
    project, I’ve added a RESTful Web Services from Patterns:


    ![](images/00208.jpeg)


    and after I click  Next  twice, I come to the following window:


    ![](images/00209.jpeg)


    where I have entered  Resource Package,  Path  and  Class Name. You should note
    that the MIME type is XML. When I then click  Finsh, NetBeans creates two  files:


    ![](images/00210.jpeg)


