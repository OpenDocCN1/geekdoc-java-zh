    all  four  methods.


    The EJB module is complete and can be translated and then it can be deployed to
    the server.


    ![](images/00114.jpeg)![](images/00115.jpeg)Then there is the client application,
    where I have created a usual Web Application project named  KingsClient. In order
    for the application to refer to  KingsSession, it must know the definition of
    the  KingsSessionRemote  interface. I have therefore added the jar  file with
    this interface to the project. As the next step I have defined a named bean:


    package kingsclient.beans; import javax.inject.Named;


    import javax.enterprise.context.SessionScoped; import java.util.*;


    import javax.ejb.EJB;


    import kingsejb.ejbs.KingsSessionRemote;


    @Named(value = "kingsBean")


    @SessionScoped


    public class KingsBean implements java.io.Serializable


    {


    @EJB


    private KingsSessionRemote kingsSession;


    private int year1; private int year2;


    private List<String> names = new ArrayList();


    public KingsBean() {


    }


    public int getYear1() { return year1;


    }


    public void setYear1(int year1) { this.year1 = year1;


    }


    public int getYear2() { return year2;


    }


    public void setYear2(int year2) { this.year2 = year2;


    }


    public List<String> getNames()


    {


    return names;


    }


    public void search()


    {


    String[] arr = year2 > 0 ? kingsSession.getKingsRemote(year1, year2)  : kingsSession.getKingRemote(year1);


    names.clear();


    for (String name : arr) names.add(name);


    }


    }


    Also, here is not much news, but note that the class uses the EJB module  KingsEJB.
    It happens as in the previous examples by right-clicking on the name of the class,
    choosing  Insert  Code,  and  then  Call  Enterprise  Bean.  The  relevant  bean  is  used  in  the  method  Search().


