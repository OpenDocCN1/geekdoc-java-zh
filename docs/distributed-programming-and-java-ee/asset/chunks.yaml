    \n### 安全性\n\n在开发在网络上使用的应用程序（Web 应用、企业级应用等）时，同时——或者非常经常——存在一个需要解决的安全问题。这是我在本书以及之前的两本书中都忽略的问题。基本上，它是关于：\n\
    \n1. 只有被允许的用户才能使用程序或应用程序的一部分，且所有用户不应具有相同的权限。\n2. 未经授权的用户可能无法访问用户和服务器之间通过网络传输的数据。\n\
    \n第一个问题通过使用用户识别和密码来解决，而另一个问题通过使用加密来解决，这样没有人可以读取通过网络传输的数据。原则上来说，这听起来很简单，但正如媒体中听到的许多网络攻击所证明的那样。也许完全安全地保护应用程序是不可能的，但你可以做到。\n\
    \n### 7.1 演示应用程序\n\n我使用了一个名为 `SecurityApp` 的简单 Web 。该应用程序由三个 HTML 页面组成，其中 `index.html`\
    \ 是起始页。\n\n如果你点击顶部的链接，将得到一个输入名称的窗口。\n\n如果你返回首页并点击 Administration（管理）链接，你将得到下面的页面，可以在那里编辑时间。\n\
    \n代码非常简单将不再显示。以下是项目文件，在这里你应该注意页面 `start.html` 位于 `admin` 文件夹，并且在 `WEB-INF` 中添加了配置文件\
    \ `glassfish-web.xml`（Glassfish 描述符文件）。\n\n### 7.2 容器管理的身份验证与授权\n\n我将首先展示如何让容器（Glassfish\
    \ 服务器）控制用户对单个页面的访问。这完全通过配置文件完成，无需更改应用程序代码，并通过创建 Glassfish 用户来实现。\n\nGlassfish\
    \ 使用所谓的安全域（security realms）来管理用户和用户权限，安全域基本上是带有关联的安全组的用户集合。用户可以关联到一个或多个组，而这些组定义了容器允许用户执行的操作。例如，一个应用程序可能有只能执行特定任务的普通用户和可以执行所有任务的管理员。\n\
    \nGlassfish 默认就有三个安全域，但你可以创建自己的。这三个预定义的安全域是：\n\n"
- fmt: "\n## Realms Definition\n\n1. `admin-realm`: used solely for the maintenance\
    \ of users for the `Glassfish` administration web application and should not be\
    \ used for users of other applications.\n2. `certificate`: used for client-side\
    \ certificate for authentication of users.\n3. `file`: that stores general user\
    \ information.\n\n![](images/00243.jpeg)\n\nClicking on `file` realm you will\
    \ get the properties of this realm and clicking the `Manage Users` button will\
    \ give you an overview of the users. I have created three that I will apply in\
    \ the following:\n\n![](images/00244.jpeg)\n\nI will now use these users for authentication\
    \ of pages to the above application when:\n\n1. users belonging to the `student`\
    \ group alone must have access to `index.html`\n2. users belonging to the group\
    \ `staf` must have access to `index.xhtml` and `enter.html`\n3. users belonging\
    \ to the `admin` group must have access to all three pages.\n\nI have added the\
    \ following `web.xml`:\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\
    <web-app xmlns=\"http://xmlns.jcp.org/xml/ns/javaee\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \ xsi:schemaLocation=\"http://xmlns.jcp.org/xml/ns/javaee http://xmlns.jcp.org/xml/ns/javaee/web-app_3_1.xsd\"\
    \ version=\"3.1\">\n    <session-config>\n        <session-timeout>30</session-timeout>\n\
    \    </session-config>\n    <security-constraint>\n        <web-resource-collection>\n\
    \            <web-resource-name>Admin Pages</web-resource-name>\n            <url-pattern>/admin/*</url-pattern>\n\
    \        </web-resource-collection>\n        <auth-constraint>\n            <role-name>admin</role-name>\n\
    \        </auth-constraint>\n    </security-constraint>\n```\n\n![](images/00245.jpeg)<<map\
    \ name=\"awmap26\" class=\"calibre1\"><area shape=\"rect\" href=\"http://www.deloitte.ca/careers\"\
    \ coords=\"120, 426, 310, 444\" class=\"calibre39\"></map>![](images/00246.jpeg)\n\
    \n```xml\n    <security-constraint>\n        <web-resource-collection>\n     \
    \       <web-resource-name>AllPages</web-resource-name>\n            <url-pattern>/*</url-pattern>\n\
    \        </web-resource-collection>\n        <auth-constraint>\n            <role-name>staf</role-name>\n\
    \        </auth-constraint>\n    </security-constraint>\n    <security-constraint>\n\
    \        <web-resource-collection>\n            <web-resource-name>Start Page</web-resource-name>\n\
    \            <url-pattern>/index.html</url-pattern>\n        </web-resource-collection>\n\
    \        <auth-constraint>\n            <role-name>student</role-name>\n     \
    \   </auth-constraint>\n    </security-constraint>\n    <login-config>\n     \
    \   <auth-method>BASIC</auth-method>\n        <realm-name>file</realm-name>\n\
    \    </login-config>\n</web-app>\n```\n\n## Security Configuration Analysis\n\n\
    User rights are defined as `security-constraint` elements, and in this case there\
    \ are three. A `security-constraint` element defines which pages it concerns and\
    \ what role the user should have. The first happens with an `url-pattern` element,\
    \ while the other happens with a `role-name` element. \n\nLooking at the first\
    \ `security-constraint` it applies to all pages where the name starts with `admin`,\
    \ and thus all pages in the `admin` folder. Only users whose role is `admin` can\
    \ access these pages. The next `security-constraint` element applies to all pages,\
    \ but here it is a requirement that the user should have the role `staf`. Finally,\
    \ there is the last `security-constraint` that applies to a concrete page (start\
    \ page) and for users whose role is `student`.\n\nThe last element is called `login-config`\
    \ and is used to define how authentication should take place. There are basically\
    \ three options:\n\n1. `BASIC`, where it is left to the browser to make authentication.\n\
    2. `FORM` where it is left for the program to perform authentication.\n3. `CLIENT-CERT`,\
    \ which requires a certificate.\n\nLooking at the above role names, they refer\
    \ only to the current application, but not to the specific user groups. There\
    \ must therefore be a mapping of these names, which takes place in `glassfish`\
    \ `web.xml`:\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE\
    \ glassfish-web>\n<glassfish-web>\n    <security-role>\n        <role-name>admin</role-name>\n\
    \        <group-name>admin</group-name>\n    </security-role>\n    <security-role>\n\
    \        <role-name>staf</role-name>\n        <group-name>staf</group-name>\n\
    \    </security-role>\n    <security-role>\n        <role-name>student</role-name>\n\
    \        <group-name>student</group-name>\n    </security-role>\n</glassfish-web>\n\
    ```\n\n## HTTPS and SSL\n\nGenerally, a secure Internet connection requires a\
    \ certificate that you purchase from a `Certificate Authority` (CA) such as `Verisign`\
    \ or `Thawte`. Such a certificate costs something (about $500) and needs a renewal\
    \ every year. It may be a bit unfortunate for development purposes and therefore\
    \ Glassfish comes with a self-certificate and is pre-configured to support HTTPS\
    \ at port 8181. Such a self-certificate can be made by everyone and is therefore\
    \ not sure. If, after the above change of `web.xml`, you open the application,\
    \ you get the following window (Firefox):\n\n![](images/00250.jpeg)\n"
