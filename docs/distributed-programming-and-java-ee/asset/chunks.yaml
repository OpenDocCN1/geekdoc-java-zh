  raw: 'You should examine the class  Address, where many annotations have been added
    (all properties are decorated), but you can easily understand the meaning. You
    must note that     all annotations are determined by NetBeans by retrieving information
    from the database.   Also try to examine the glassfish resource  resources.xml  configuration  file.


    I will make a single change. With an  EntityManager  object and a  UserTransaction  object,
    you can perform database operations without the need to write very much and without
    knowing SQL.  Since  it’s  the  same  thing  that’s  going  to  happen  every  time,  you  can  encapsulate  these
    operations into a class that  can  be  used  no  matter  what  database  table 
    it  is.   This  happens by adding a database controller (here to  changeaddress.models),
    which is a class of the type      JPA Controller Classes from  Entity:


    ![](images/00032.jpeg)


    When you click Next, you must select the entity class for which the object should
    be controller for:


    ![](images/00033.jpeg)![](images/00034.jpeg)


    ![](images/00035.jpeg)


    In this case, there is only one option, and when added to  Selected  Entity  Classes,
    you can   create the controller class.  The class is called  AddressJpaController  and
    it encapsulates what      is necessary to maintain the database table as well
    as methods so that you can read the row       with a particular primary key as
    well as a few methods to retrieve multiple rows.  The code           is shown  below:


    package changeaddress.models;


    import changeaddress.models.exceptions.*; import java.io.Serializable;


    import java.util.List;


    import javax.persistence.*;


    import javax.persistence.criteria.*;


    import javax.transaction.UserTransaction;


    public class AddressJpaController implements Serializable


    {


    private UserTransaction utx = null; private EntityManagerFactory emf = null;


    public AddressJpaController(UserTransaction utx, EntityManagerFactory emf)


    {


    this.utx = utx; this.emf = emf;


    }


    public EntityManager getEntityManager()


    {


    return emf.createEntityManager();


    }


    public  void  create(Address  address)  throws  RollbackFailureExceptionE,xception


    {


    EntityManager em = null;


    try


    {


    utx.begin();


    em = getEntityManager(); em.persist(address); utx.commit();


    }


    catch (Exception ex)


    {


    try


    {


    utx.rollback();


    }


    catch (Exception re)


    {


    throw new RollbackFailureException(" … ", re);


    }


    throw ex;


    }


    finally


    {


    if (em != null)


    {


    em.close();


    }


    }


    }


    public void edit(Address address) throws NonexistentEntityException, RollbackFailureException,
    Exception


    {


    EntityManager em = null;


    try


    {


    utx.begin();


    em = getEntityManager(); address = em.merge(address); utx.commit();


    }


    catch (Exception ex)


    {


    try


    {


    utx.rollback();


    }


    catch (Exception re)


    {


    throw new RollbackFailureException(" … ", re);


    }


    String msg = ex.getLocalizedMessage(); if (msg == null || msg.length() == 0)


    {


    Integer id = address.getId(); if (findAddress(id) == null)


    {


    throw new NonexistentEntityException(" … ");


    }


    }


    throw ex;


    }


    finally


    {


    if (em != null)


    {


    em.close();


    }


    }


    }


    ![](images/00036.jpeg)![](images/00037.jpeg)


    public void  destroy(Integer  idthrows  NonexistentEntityException, RollbackFailureException,  Exception


    {


    EntityManager em = null;


    try


    {


    utx.begin();


    em = getEntityManager();


    Address address; try


    {


    address  =  em.getReference(Address.class,  id); address.getId();


    }


    catch (EntityNotFoundException enfe)


    {


    throw new NonexistentEntityException(" … ", enfe);


    }


    em.remove(address); utx.commit();


    }


    catch (Exception ex)


    {


    try


    {


    utx.rollback();


    }


    catch (Exception re)


    {


    throw new RollbackFailureException(" … ", re);


    }


    throw ex;


    }


    finally


    {


    if (em != null)


    {


    em.close();


    }


    }


    }


    public List<Address>  findAddressEntities()


    {


    return  findAddressEntities(true, -1, -1);


    }


    public List<Address>  findAddressEntities(int maxResults, int  firstResult)


    {


    return  findAddressEntities(false, maxResults,  firstResult);


    }


    private List<Address>  findAddressEntities(boolean all, int maxResults, int  firstResult)


    {


    EntityManager em = getEntityManager();


    try


    {


    CriteriaQuery cq =  em.getCriteriaBuilder().createQuery(); cq.select(cq.from(Address.class));


    Query q = em.createQuery(cq); if (!all)


    {


    q.setMaxResults(maxResults); q.setFirstResult(firstResult);


    }


    return q.getResultList();


    }


    finally


    {


    em.close();


    }


    }


    public Address  findAddress(Integer id)


    {


    EntityManager em = getEntityManager();


    try


    {


    return em.find(Address.class, id);


    }


    finally


    {


    em.close();


    }


    }


    public int getAddressCount()


    {


    EntityManager em = getEntityManager();


    try


    {


    CriteriaQuery cq =  em.getCriteriaBuilder().createQuery(); Root<Address> rt =
    cq.from(Address.class); cq.select(em.getCriteriaBuilder().count(rt));


    Query q = em.createQuery(cq);


    return ((Long) q.getSingleResult()).intValue();


    }


    finally


    {


    em.close();


    }


    }


    }


    The code  fills, but the class is easy enough to understand and the most important
    thing is   that everything about updates to the database is encapsulated in methods,
    including the necessary logic for rollback. In addition, the class defines some
    simple  find()  methods that can return an object with a specific  id  or list
    of objects that typically will be all objects.  These  find()  methods uses a
    private  find()  method, and here you should note the  CriteriaQuery   and  Query  types
    as explained below, but based on the names (and the application) you can  see
    that these are the types that will be used to build a SQL SELECT. Finally, note
    that      the  class  also  has  a  method  that  returns  the  number  of  rows  in  the  database  table.


    After the class has been added to the project, the  IndexController  class must
    be changed:


    ![](images/00038.jpeg)![](images/00039.jpeg)


    public class IndexController implements Serializable


    {


    @PersistenceUnit EntityManagerFactory  emf; @Resource


    UserTransaction utx;


    private Address person = new Address();


    private List<Address> persons = new ArrayList();


    public IndexController()


    {


    }


    …


    public List<Address> getPersons()


    {


    try


    {


    AddressJpaController ctrl = new AddressJpaController(utx, emf);


    persons = ctrl.findAddressEntities();


    }


    catch (Exception ex)


    {


    }


    return persons;


    }


    public void add()


    {


    try


    {


    AddressJpaController ctrl = new AddressJpaController(utx, emf); ctrl.create(person);


    person = new Address();


    }


    catch (Exception ex)


    {


    }


    }


    }


    Here,  the  most  important  are  the  first  two  statements,  which  define  an  EntityManagerFactory  and  a  UserTransaction.  In  particular,  note  the  two  annotations  that  defines  the  two  objects
    to be instantiated. You should also note that the two methods that returns all
    addresses  and create an address now have been changed so that the entire logic
    regarding database operations  has  been  moved  to  the  controller  class.


    If you look at the example, you should note that everything about SQL is gone
    and has been moved to code that is part of the JPA API. As a result, the code
    to be written is significantly  reduced,  and  in  particular,  you  should  note  that  the  AddressJpaController  class
    is autogenerated by  NetBeans.


    EXERCISE 1'
