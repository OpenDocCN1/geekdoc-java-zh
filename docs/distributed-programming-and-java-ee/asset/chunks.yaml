    \ FIELD, PARAMETER, TYPE})\npublic @interface Male\n{\n}\n```\n\n在 `Man` 类中，你通过\
    \ `@Male` 告诉该类标识为限定符 `Male`。`CDIProgram` 项目还定义了一个派生类 `Woman`，由限定符 `Female` 标识。原则上讲，编写限定符是简单的，但语法可能很难记忆，因此\
    \ NetBeans 为此提供了一个 `File Type`（文件类型）：\n\n如果你随后想让 `Student` 类创建一个 `Woman` 对象，语法如下：\n\
    \n```java\npublic class Student implements Serializable\n{\n    @Inject\n    @Female\n\
    \    private Person person;\n}\n```\n\n查看上面的解决方案，定义容器需要创建的特定类型非常简单。然而，如果你考虑 `Person`\
    \ 有许多子类的情况，则必须编写许多限定符。相反，你可以定义一个参数：\n\n```java\npackage cdiprogram.beans;\nimport\
    \ static java.lang.annotation.ElementType.TYPE; \nimport static java.lang.annotation.ElementType.FIELD;\
    \ \nimport static java.lang.annotation.ElementType.PARAMETER; \nimport static\
    \ java.lang.annotation.ElementType.METHOD;\nimport static java.lang.annotation.RetentionPolicy.RUNTIME;\
    \ \nimport java.lang.annotation.Retention;\nimport java.lang.annotation.Target;\
    \ \nimport javax.inject.Qualifier;\n\n@Qualifier @Retention(RUNTIME)\n@Target({METHOD,\
    \ FIELD, PARAMETER, TYPE})\npublic @interface Gender\n{\n}\n```\n\n这个限定符现在有一个名为\
    \ `value` 的属性。请注意，限定符完全可以更多属性。然后你可以如下方式装饰类 `Man` 和 `Woman`：\n\n```java\n@Named(value\
    \ = \"man\")\n@SessionScoped\n@Gender(value = \"Male\")\npublic class Man extends\
    \ Person implements Serializable\n{\n}\n```\n\n对于注入，你可以写：\n\n```java\n@Named(value\
    \ = \"student\")\n@SessionScoped\npublic class Student implements Serializable\n\
    {\n    @Inject\n    @Gender(value = \"Female\")\n    private Person person;\n\
    \    private String subject;\n}\n```\n\n### 4.2 作用域 (CONTEXTS)\n\n当通过注入或从 JSF\
    \ 页面引用需要托管 bean 时，CDI 将尝试在特定 bean 的作用域内查找实例。如果成功，否则将创建一个属于当前作用域的对象。通常，一个对象（托管\
    \ bean）必须跨越多个页面“生存”，而你不能使用 `RequestScoped`，因为它只关系当前页面。每当进行页面请求时，对象都会被创建。到目前为止（在这本书和之前的两本书中都是如此），我通过将\
    \ bean 定义为 `SessionScoped` 来解决这个问题。这种方法可行，但也是简单的解决方案，而且 `SessionScoped` bean 也有缺点。首先，这些\
    \ bean 在整个会话期间存在，并在会话结束后一段时间内仍然存在。这意味着会话对象会不必要的占用机器内存。更大的问题是，由于 `SessionScoped`\
    \ bean（以及所有的会话对象）的寿命比需要的时间长，因此存在在逻辑上已不存在后仍被使用的风险。后者实际上可能会使修复 Web 应用程序中的错误变得非常困难。\n\
    \n"
- fmt: "\nThere is a context called `conversation`, and where a bean can live over\
    \ several pages, but not through an entire session, and which precisely aims to\
    \ solve the challenges that the session context poses. The price is that it is\
    \ the programmer who has to tell the container when a conversation starts and\
    \ when it ends. I want to show how with the `ChangeAddress` example, where the\
    \ difference should be that the form for entering the address is divided into\
    \ three pages – without any reason, in addition to showing how `ConversationScoped`\
    \ works. I start with a project called `ChangeAddress4` and which is a copy of\
    \ `ChangeAddress1`. In addition to `list.xhtml` (which is unchanged) there are\
    \ three new JSF pages, and the entry of an an address occurs as a wizard with\
    \ these three JSF pages:\n\n![](images/00168.gif)\n\n`index.xhtml` is now reduced\
    \ to the following very simple page:\n\n```xml\n<?xml version='1.0' encoding='UTF-8'\
    \ ?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\" … >\n<html\
    \ xmlns=\"http://www.w3.org/1999/xhtml\" xmlns:h=\"http://xmlns.jcp.org/jsf/html\"\
    \ xmlns:f=\"http://xmlns.jcp.org/jsf/core\">\n<h:head>\n    <meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=UTF-8\"/>\n    <title>Change address</title>\n\
    \    <h:outputStylesheet library=\"css\" name=\"styles.css\"/>\n</h:head>\n<h:body>\n\
    \    <h1>Change address</h1>\n    <h:form>\n        <p><h:commandLink value=\"\
    Create new address\" action=\"#{indexController.page1()}\" /></p>\n        <p><h:commandLink\
    \ value=\"Show addresses\" action=\"list\" /></p>\n    </h:form>\n</h:body>\n\
    </html>\n```\n\nthat opens the following window:\n\n![](images/00169.jpeg)\n\n\
    Clicking on the top link will give you a page for entering the name, and the form\
    \ of the `ChangeAddress1` project is generally divided into three pages, as shown\
    \ below. The three pages are called:\n\n- `page1.xhtml`\n- `page2.xhtml`\n- `page3.xhtml`\n\
    \nThe entity class `Address` is unchanged from previously, but a simple wrapper\
    \ class `Person` (a managed bean) is defined and all you need to note is that\
    \ it is a named bean defined as `ConversationScoped`:\n\n![](images/00170.jpeg)\n\
    ![](images/00171.jpeg)\n\n```java\npackage changeaddress.beans;\n\nimport javax.inject.Named;\n\
    import javax.enterprise.context.ConversationScoped;\nimport java.io.Serializable;\n\
    import changeaddress.models.Address;\n\n@Named(value = \"person\")\n@ConversationScoped\n\
    public class Person implements Serializable {\n    private Address address;\n\n\
    \    public Person() {\n        address = new Address();\n    }\n\n    public\
    \ Address getAddress() {\n        return address;\n    }\n\n    public void setAddress(Address\
    \ address) {\n        this.address = address;\n    }\n}\n```\n\nThe code for the\
    \ three new JSF pages is simple and I do not want to show it here, but new is\
    \ in `IndexController`, which has been changed. The code is shown below, but I\
    \ have not shown `get` and `set` methods since they are before:\n\n```java\npackage\
    \ changeaddress.beans;\n\nimport java.util.*;\nimport javax.inject.*;\nimport\
    \ javax.enterprise.context.*;\nimport java.io.Serializable;\nimport javax.persistence.*;\n\
    import javax.transaction.*;\nimport javax.annotation.*;\nimport changeaddress.models.*;\n\
    import javax.persistence.criteria.CriteriaQuery;\n\n@Named(value = \"indexController\"\
    )\n@RequestScoped\npublic class IndexController implements Serializable {\n  \
    \  @Inject\n    private Conversation conversation;\n\n    @Inject\n    private\
    \ Person person;\n\n    @PersistenceUnit\n    EntityManagerFactory emf;\n\n  \
    \  @PersistenceContext\n    EntityManager em;\n\n    @Resource\n    UserTransaction\
    \ utx;\n\n    private List<Address> persons = new ArrayList();\n\n    public IndexController()\
    \ {\n    }\n\n    public String cancel() {\n        conversation.end();\n    \
    \    return \"index\";\n    }\n\n    public String page1() {\n        conversation.begin();\n\
    \        return \"page1\";\n    }\n\n    public List<Address> getPersons() {\n\
    \        try {\n            CriteriaQuery cq = em.getCriteriaBuilder().createQuery();\n\
    \            cq.select(cq.from(Address.class));\n            Query q = em.createQuery(cq);\n\
    \            return persons = q.getResultList();\n        } catch (Exception ex)\
    \ {\n        }\n        return persons;\n    }\n\n    public String add() {\n\
    \        try {\n            utx.begin();\n            em.persist(person.getAddress());\n\
    \            utx.commit();\n            conversation.end();\n            return\
    \ \"index\";\n        } catch (Exception ex) {\n            try {\n          \
    \      utx.rollback();\n            } catch (Exception e) {\n            }\n \
    \       }\n        return \"\";\n    }\n}\n```\n\nHere you should note that the\
    \ context is now `RequestScoped`. In addition, note the two methods `page1()`\
    \ and `cancel()`. The first is called from `index.xhtml`, if you chooses to create\
    \ a new address. It calls the method `conversation.begin()`, which starts a new\
    \ conversation. The method `cancel()` is called from one of the three editing\
    \ pages if you click Cancel, and it is important that it performs the method `conversation.end()`\
    \ that completes the conversation that is in progress. This means that the container\
    \ remove the bean. The method `getPersons()` is unchanged from previously, while\
    \ the method `add()` has changed a bit. Most importantly, after an address is\
    \ stored in the database, a `conversation.end()` is executed.\n\nIn order for\
    \ it all to work, the class must instantiate a `Conversation` object, which occurs\
    \ when using injection at the start of the class. A `Person` object must also\
    \ be created, which also occurs by injection.\n\nAlso note how the class instantiate\
    \ objects to JPA in the same way as in the previous example. In fact, it also\
    \ happens by injection, only other annotations are used.\n"
