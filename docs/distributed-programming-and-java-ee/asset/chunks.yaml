    The code is simple, as all work is performed by the DAO classes, and in principle,
    it is about creating  an  DAO  object  and  calling  the  current  DAO’s  methods.  However,  there  is  a  single
    problem that requires a special solution. JPA uses what is called LAZY update.
    For example, if you take the entity class  Category, it has a collection  bookCollection  that
    contains a  Book  object for all the books that are categorized under that category.  These
    objects must thus      be initialized when you read the database, and since these
    objects are far from always used,  JPA use a technique where the objects are  first
    created (by reading in the database) when referring  to  them.  Of  course,  the  reason  is  performance,  and  you  should  keep  in  mind  that


    all categories have such a collection, and the same goes for publishers, authors
    and books. It is this technique, that is called LAZY update, but there is a problem
    when objects are        to be serialized of a remote client, as they can risk
    the objects being serialized before the relevant collections are updated.  There
    are various suggestions on how to solve this problem, and one of them is – and
    probably the simplest, but perhaps not the best – that before the objects are
    serialized, the method performs the  size()  method of the collections in question
    (resulting in the objects being initialized by reading in the database).  This
    is the purpose       of  the  loop  that  occurs  in  the  method  getCategories().


    After the  LibraryDAO  class is implemented,  BooksEJB  is complete and can be
    translated  and hosted on the  server.


