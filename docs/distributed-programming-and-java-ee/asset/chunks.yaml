    \ 应该相同。命令完成后，当前目录下已创建一个名为 `client_keystore.p12` 的密钥库。\n\n![](img/00269.jpeg)!(images/00270.jpeg)\n\
    \n密钥库必须导入浏览器，你的操作方法（在 Firefox 中）是选择“设置”和“高级”，在这里你必须选择“证书”并再次点击“显示证书”：\n\n![](img/00271.jpeg)\n\
    \n在后续窗口中，你将看到浏览器中安装的证书列表，点击“导入”按钮，你可以浏览到你的密钥库（文件 `client_keystore.p12`）并将其安装。\n\
    \n证书必须导出到 Glassfish，并且必须先转换为 Glassfish 可以使用的格式。这仍然可以使用 `keytool` 完成：\n\n```bash\n\
    ./keytool -export -alias pakey -keystore client_keystore.p12 -storetype PKCS12\
    \ -storepass Volmer1234 -rfc -file pasigned.cer\n```\n证书已存储在文件 `<pasigned.cer>`\
    \ 中\n\n结果是一个名为 `pasigned.cer` 的文件。名称并不重要，但建议以 `.cer` 结尾。Glassfish 有一个包含受信任的证书颁发机构名称的文件（它已经认识\
    \ Verisign 和 Thaute），这些名称可以在文件中找到：\n\n`glassfish/domains/domain1/config/cacerts.jks`\n\
    \n为了让 Glassfish 使用我的自签名证书，它必须认识我——并信任我是一个证书颁发机构——我可以使用 `keytool` 将 `pasigned.cer`\
    \ 文件导出到 Glassfish：\n\n```bash\n./keytool -import -file pasigned.cer -keystore\
