    EXERCISE 2


    In this exercise, write a program that performs almost the same as the example
    above, where you can search for Danish kings, but the user interface needs to
    be changed so that it also shows the rule period:


    ![](images/00117.jpeg)


    ![](images/00118.jpeg)![](images/00119.jpeg)Start creating a new project that
    you can call  KingsEJB-ejb, but this time it should not be    an  Enterprise Application  project,
    but an  EJB Module  project:


    ![](images/00120.jpeg)


    Next, you should create a usual  Class Library  project, as you can call  KingsEJBRemote.
    For this  library  you  must  in  a  package  kingsejb.ejbs  add  the  following  class:


    package kingsejb.ejbs; import javax.ejb.Remote; @Remote


    public class King implements java.io.Serializable


    {


    private String name; private int from; private int to;


    public King(String name, int from, int to)


    {


    this.name = name; this.from = from; this.to = to;


    }


    public String getName()


    {


    return name;


    }


    public int getFrom()


    {


    return from;


    }


    public int getTo()


    {


    return to;


    }


    }


    which  represents  a  king.  Basically,  it’s  a  common  Java  class,  but  you  should  note  that  it  is
    decorated with  @Remote  and is  serializable, which means that objects of this
    type can be  sent  to  clients  over  a  network.


    To KingsEJB-ejb, you should add a singleton session bean called  KingsSession  with
    a remote interface (but this time no local interface) as in the previous example.  The
    interface must     be  created  in  your  class  library  and  the  content  must  be:


    package  kingsejb.ejbs;


    import javax.ejb.Remote; import  java.util.List;


    @Remote


    public interface KingsSessionRemote extends java.io.Serializable


    {


    List<King> getKing(int year);


    List<King> getKings(int year1, int year2);


    The difference is that the two methods this time returns a list of  King  objects
    rather than strings. It is exactly the purpose of the exercise to show how to
    write a session bean, which  returns custom types instead of simple java types
    and strings.  The procedure is that the type must be defined serializable in the
    remote interface and decorated with  @Remote.


    You must then implement  KingsSession, which should essentially be a copy of the
    class  from the previous example, with the difference that the two methods will
    return lists of      King  objects.


    Finally, you must implement the user interface, which is almost identical to the
    previous example, but as shown above, the table has three columns, and the  KingsBean  class
    must be changed slightly corresponding to the new session bean. Finally, add a
    converter, so years  that  are  unknown  (are  0)  are  shown  as  blank.


    3.3 EJB AND  JPA


    In this section I will show an application that creates objects and stores them
    in a database when database operations are to be performed in an EJB using JPA.
    As an example, I will use  the  form  for  entering  addresses,  and  compared  to  the  last  version  of  the  previous  chapter,
    it is only a question that the code for saving data and retrieving data has been
    moved from the controller to a session  bean.


    I have started with an Enterprise Application project with a single EJB module
    and a Web Application:


    ![](images/00121.jpeg)


    ![](images/00122.jpeg)![](images/00123.jpeg)I have then added an entity class
    that represents the  Address  table in database  addresses.  The class is identical
    to what is shown in the previous chapter and is not showed here. Next, I  have  added  a  stateless  session  bean  called  AddressSession  and  with  a  local  interface:


    package addressejb.beans;


    import javax.ejb.Local; import java.util.List;


    @Local


    public interface AddressSessionLocal


    {


    void save(Address address) throws Exception; List<Address> getAddresses();


    }


    Then there is the bean class itself, which implements the interface:


    package addressejb.beans;


    import java.util.*;


    import  javax.ejb.Stateless; import  javax.persistence.*;


    @Stateless


    public class AddressSession implements AddressSessionLocal


    {


    @Override


    public void save(Address address) throws Exception


    {


    EntityManager em = null;


    try


    {


    em  =  Persistence.createEntityManagerFactory( "AddressEJB-ejbPU").createEntityManager();
    em.getTransaction().begin(); em.persist(address); em.getTransaction().commit();


    }


    catch (Exception ex)


    {


    throw new Exception();


    }


    finally


    {


    if (em != null) em.close();


    }


    }


    @Override


    public List<Address> getAddresses()


    {


    List<Address> list; EntityManager em =  null;


    try


    {


    em  =  Persistence.createEntityManagerFactory( "AddressEJB-ejbPU").createEntityManager();


    list  =  em.createNamedQuery("Address.findAll").getResultList();


    }


    catch (Exception ex)


    {


    list = new ArrayList();


    }


    finally


    {


    if (em != null) em.close();


    }


    return list;


    }


