  trans: "\n在上面的示例中，是由应用服务器处理身份验证的，在很多情况下这也是处理方法，但最好的方法是由应用程序本身来控制身份验证，从而控制用户是否有权访问特定的应用程序。另一方面，如果你想确保所有用户不能访问\
    \ Web 应用程序中的相同功能（页面），你需要更多的一些操作，你可以使用一个包含各个用户角色的数据库，然后在应用程序中测试哪些角色是可用。在本节中，我将通过\
    \ `SecurityApp2` 示例的副本来说明这一点，我将其命名为 `SecurityApp4`。\n\n基本上，它是同一个应用程序，具有相同的页面 `index.xhtml`、`enter.xhtml`\
    \ 和 `start.xhtml`（后者位于 `admin` 文件夹中），并且它们拥有相同的后端 Bean（backing beans）。然而，又添加了一个名为\
    \ `list.xhtml` 的简单页面及其关联的后端 Bean，在 `index.xhtml` 中有一个指向该页面的链接。到目前，整个应用程序都非常简单，唯一的目的是展示如何实现身份验证，以及如何根据登录用户的身份来控制对每个页面的访问权限。\n\
    \n### 数据库设置\n\n最初，我创建了一个名为 `authentication` 的数据库，并包含一个单表 `user`：\n\n```sql\nuse\
    \ sys;\n\ndrop database if exists authentication; create database authentication;\n\
    \nuse authentication;\n\ncreate table user (\n  name varchar(256) not null, role\
    \ varchar(2048),\n  primary key (name)\n);\n\ninsert into user (name, role) values\
    \ ('poul', 'student:root'); \ninsert into user (name, role) values ('knud', 'admin:staf:student');\
    \ \ninsert into user (name, role) values ('svend', 'staf:student'); \ninsert into\
    \ user (name, role) values ('valdemar', 'student');\n```\n\n该表只有两列，第一列代表用户名并作为主键，第二列根据与\
    \ Glassfish 相同的语法指示用户角色。作为示例，表中添加了 4 个用户。\n\n### EJB 实现\n\n在项目中，我删除了 `LogoutBean`，并而之添加了另一个名为\
    \ `AuthenticationCtrl` 的 Bean，但在查看它之前，我将展示一个包含登录最重要的逻辑的 EJB。仍然由应用服务器进行身份验证，并检查用户的用户名和密码。注意，上面的数据库表不包含用户的密码，因此由服务器负责存储加密后的密码。\n\
    \n为了编写该 EJB，我创建了一个名为 `AuthenticationEJB` 的 EJB 项目。然后在这里我创建了一个名为 `AuthenticationRemote`\
    \ 的类库项目，并为上述表添加了实体类。该类相对于 NetBeans 生成的内容没有更改，且内容不是新的，不会在此出现。对于 `AuthenticationEJB`，我添加了上述类库的引用，并添加了一个名为\
    \ `AuthenticationBean` 的无状态会 Bean（stateless session bean），其远程接口位于类库中。接口如下：\n\n\
    ```java\npackage authenticationejb.beans;\n\nimport javax.ejb.Remote;\nimport\
    \ authenticationremote.entities.User;\n\n@Remote\npublic interface AuthenticationBeanRemote\n\
    {\n    public String getPassword();\n    public void setPassword(String password);\
    \ \n    public User getUser();\n    public void setUser(User user); \n    public\
    \ boolean login();\n}\n```\n\n它定义了两个属性，一个是用户的密码（`AuthenticationBean` 必须使用它来通过\
    \ Glassfish 执行身份验证），另一个是 `User` 类型的对象，它是类库中的实体类型。最后，有一个 `login()` 方法，这是身份验证的方法。下面是\
    \ `AuthenticationBean` 类：\n\n```java\n@Stateless\npublic class AuthenticationBean\
    \ implements AuthenticationBeanRemote\n{\n    @PersistenceContext(unitName = \"\
    AuthenticationEJBPU\")\n    private EntityManager em; \n    private String password;\
    \ \n    private User user;\n\n    public AuthenticationBean()\n    }\n\n    @Override\n\
    \    public boolean login()\n    {\n        HttpSession session = getSession();\n\
    \        HttpServletRequest request = null;\n        try\n        {\n        \
    \    request = (HttpServletRequest) FaceContext.getCurrentInstance().getExternalContext().getRequest();\n\
    \            session.setMaxInactiveInterval(600); // 10 分钟\n            session.setAttribute(\"\
