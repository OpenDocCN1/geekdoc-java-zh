    \ 继承了 `eat` 方法，也可以定义自己的方法，例如 `bark`。\n\n## 7.1.3 利用保护 访问修饰符\n\n`protected` 访问修饰符在继承中起着至关重要的作用。在父类中声明为\
    \ `protected` 的成员可以被子类访问（包括包外的子类），但无法被包外的其他类访问。\n\n该修饰符有助于封装父类的成员，允许对它们进行受控的访问，而不是\
    \ `public` 访问（这可能会暴露过多父类的内部细节）或 `private` 访问（这会阻止子类访问重要成员）。\n\n## 7.1.4 探索继承层次结构和多重继承问题\n\
    \n当一个类继承自子类时，就会产生继承层次结构，创建一个具有多个级别的类“族树”。这允许在每个子类层级上实现更具体的分类和行为。\n\nJava 不支持通过类来实现多重继承，以避免“菱问题”（该问题是指一个类继承自两个具有相同签名签名方法的类，这可能会让编译器困惑应该调用哪一个方法。然而，Java\
    \ 通过允许类实现多个接口来解决多重继承的需求。\n\n继承层次结构的示例：\n\n```\nclass Animal {\n    void eat()\
    \ {\n        System.out.println(\"This animal eats.\");\n    }\n}\n\nclass Mammal\
    \ extends Animal {\n    void breathe() {\n        System.out.println(\"This mammal\
    \ breathes.\");\n    }\n}\n\nclass Bat extends Mammal {\n    void fly() {\n  \
    \      System.out.println(\"This bat can fly.\");\n    }\n}\n```\n\n在这里，`Bat`\
    \ 继承自 `Mammal`，而 `Mammal` 又继承自 `Animal`，形成了一个层次结构。通过正确理解和实现继承，开发者可以创建灵活且可维护的代码库。\n\
    \n## 7.2 使用 'super' 和方法重写\n\n`super` 关键字的使用和方法重写的概念在 Java 继承中起着重要作用，增强了功能性和多态性。\n\
    \n### 7.2.1 'super' 关键字在访问父类成员中的作用\n\nJava 中的 `super` 关键字是一个引用变量，用于引用父类对象。它可以用于访问在子类中被重写或隐藏的父类方法和构造函数。\n\
    \n- 访问父类方法：可以使用 `super` 调用在子类中被重写的父类方法。当你希望在子类中同时访问方法的父类和子类版本时，这特别有用。\n- 调用父类构造函数：`super()`\
    \ 可以调用父类构造函数。`super()` 的调用必须是子类每个构造函数的第一个语句。如果子类构造函数没有显式调用父类构造函数，Java 编译器会自动插入对父类无参数构造函数的调用。\n\
    \n```\nclass Animal {\n    void move() {\n        System.out.println(\"Animals\
    \ can move\");\n    }\n}\nclass Dog extends Animal {\n    void move() {\n    \
    \    super.move(); // 调用 Animal 类中的方法\n        System.out.println(\"Dogs can walk\
    \ and run\");\n    }\n}\n```\n\n### 7.2.2 在子类中重写方法\n\n方法重写发生在子类重新定义父类中的方法时。重写允许子类对其父类提供的方法提供特定的实现。\n\
    \n重写规则：参数列表必须与被重写的方法完全匹配。返回类型也必须相同或是子类型（协变返回类型）。此外，子类不能重写声明为 `final` 或 `static`\
    \ 的方法。\n\n重写的示例：\n\n```\nclass Vehicle {\n    void run() {\n        System.out.println(\"\
    The vehicle is running\");\n    }\n}\n\nclass Car extends Vehicle {\n    @Override\n\
    \    void run() {\n        System.out.println(\"The car is running safely\");\n\
    \    }\n}\n```\n\n### 7.2.3 方法重写的规则和最佳实践\n\n1. 签名匹配：方法名和参数必须与父类中的方法签名完全匹配。\n2.\
    \ 访问级别：访问级别不能比被重写方法的访问级别更严格。\n3. 返回类型：必须与父类方法的返回类型相同或为子类型（协变返回类型）。\n4. 调用父类方法：有时，在重写的方法中使用\
    \ `super` 调用父类版本是有益的。\n\n遵循这些规则可以确保继承层次结构整洁、具有功能性且行为可预测。\n\n### 7.2.4 注解 @Override\
    \ 的重要意义\n\n`@Override` 注解表示该方法意图重写父类中的方法。如果该方法实际上没有重写父类，编译器将产生错误。此注解提高了代码的清晰度，并帮助发现错误，例如拼错方法名或参数不匹配。\n\
    \n带有 @Override 的示例：\n\n```\nclass Animal {\n    void eat() {\n        System.out.println(\"\
    This animal eats.\");\n    }\n}\nclass Dog extends Animal {\n    @Override\n \
    \   void eat() {\n        System.out.println(\"A dog eats.\");\n    }\n}\n```\n\
    \n## 7.3 接口和抽象类\n\n接口和抽象类是 Java 中用于实现抽象和多重继承（通过接口）两个核心概念。它们为类设定了蓝图，指导类必须具备哪些方法。\n\
    \n### 7.3.1 定义和实现接口\n\nJava 中的接口是一种引用类型，类似于类，但只能包含常量、方法签名、默认方法、静态方法和嵌套类型。接口不能包含实例字段。接口中的方法默认是抽象的。\n\
    \n要定义接口，你使用 `interface` 关键字。类实现接口，并且必须为接口中的所有抽象方法提供具体的实现。\n\n```\ninterface Animal\
    \ {\n    void eat();\n    void travel();\n}\n\nclass Mammal implements Animal\
    \ {\n    public void eat() {\n        System.out.println(\"Mammal eats\");\n \
    \   }\n\n    public void travel() {\n        System.out.println(\"Mammal travels\"\
    );\n    }\n}\n```\n\n### 7.3.2 接口与抽象类的比较\n\n接口和抽象类都可以拥有抽象方法，但它们存在关键区别：\n\n- 抽象类：可以包含带有实现或不带实现的方法。子类只能扩展一个抽象类。\n\
    - 接口：在 Java 8 之前，接口只能包含不带实现的抽象方法。从 Java 8 开始，它们可以包含默认方法和静态方法。一个类可以实现多个接口。\n\n\
    抽象类用于子类共享带有实现的方法的情况。接口通常用于定义一组公共功能，这些功能由任何类提供，无论其在类层次结构中的位置如何。\n\n### 7.3.3 在接口中使用默认和静态方法\n\
    \nJava 8 引入了通过默认方法和静态方法在接口中定义具体方法的能力。这允许向接口中添加新功能，而不影响实现这些接口的类。\n\n"
