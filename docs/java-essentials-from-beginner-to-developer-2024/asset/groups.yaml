    \ syncQueue = new SynchronousQueue<>();\nThread producer = new Thread(() -> syncQueue.put(\"\
    hello\"));\nThread consumer = new Thread(() -> String received = syncQueue.take());\n\
    producer.start();\nconsumer.start();\n```\n\nPhaser: A reusable synchronization\
    \ barrier, similar in functionality to CyclicBarrier and CountDownLatch with more\
    \ flexibility. A Phaser can handle a dynamic number of parties (threads) registered\
