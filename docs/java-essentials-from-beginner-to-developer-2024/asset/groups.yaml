    \n### 11.3.2 并发集合 (ConcurrentHashMap, BlockingQueue)\n\nConcurrentHashMap：`HashMap`\
    \ 的线程安全变体，专为并发设计。它允许并发的读取和更新，而不需要同步锁。通过分段锁机制，ConcurrentHashMap 实现了高吞吐量和可扩展性。\n\
