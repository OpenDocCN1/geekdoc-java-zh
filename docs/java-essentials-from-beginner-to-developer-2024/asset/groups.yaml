- md: "\nInfinite Loops and Loop Control\n\nAn infinite loop occurs when the loop\
    \ condition never turns false. It's sometimes used intentionally with a break\
    \ statement to exit the loop based on a condition inside the loop body.\n\n##\
    \ 3.4.3 The do-while Loop\n\nDifferences from while Loop The do-while loop is\
    \ similar to the while loop, with the main difference being that the do-while\
    \ loop is guaranteed to execute at least once. This is because the condition is\
    \ checked after the loop body is executed.\n\n```\ndo {\n  // block of code to\
    \ be executed\n} while(condition);\n```\n\nPractical Examples of Usage Do-while\
    \ loops are particularly useful when the loop body needs to be executed at least\
    \ once before the condition can be evaluated, such as when displaying a menu in\
    \ a user input loop.\n\n## 3.4.4 Loop Control Statements\n\nbreak and continue\
    \ in Loops\n\n- The break statement is used to exit from the loop immediately,\
    \ skipping any remaining iterations.\n- The continue statement skips the current\
    \ iteration and proceeds with the next iteration of the loop.\n\n**Nested Loops**\
    \ Nested loops are loops inside another loop. They are commonly used for iterating\
    \ over multidimensional arrays, among other tasks.\n\nLoop control structures\
    \ such as break and continue can be applied within nested loops, affecting the\
    \ flow of both inner and outer loops. Accurate control and understanding of loops\
    \ are essential for creating efficient Java programs that handle repetitive tasks\
    \ effectively.\n\n## Chapter 4: Diving Deeper: Arrays and Strings\n\n## 4.1 Working\
    \ with Arrays\n\n### 4.1.1 Introduction to Arrays: Definition and Declaration\n\
    \nAn **array** is a container object that holds a fixed number of values of a\
    \ single type. The length of an array is established at the time of creation and\
    \ cannot be changed. Arrays in Java are zero-based, meaning that the initial element\
    \ of an array is accessed at the index 0.\n\nTo declare an array in Java, you\
    \ specify the type of elements it will hold, followed by square brackets, and\
    \ then the array’s name:\n\n```\nint[] myIntArray;\nString[] myStringArray;\n\
    ```\n\nYou can also place the brackets after the array's name:\n\n```\nint myIntArray[];\n\
    String myStringArray[];\n```\n\nHowever, the former declaration is more commonly\
