    \ of inner classes, static nested classes do not require an instance of the outer\
    \ class to be created. They cannot access non-static members of the outer class\
    \ directly. They are typically used to associate a class with another class where\
    \ the inner class needs to be accessed in a static context. Each type of inner\
    \ class serves a unique purpose and offers different capabilities and restrictions,\
    \ providing flexible options for organizing and structuring Java applications.\n\
    \n# ### 12.4 Understanding Static and Final\n\n# #### 12.4.1 Static Keyword: Variables\
    \ and Methods\n\nThe static keyword in Java is used to indicate that a particular\
    \ member (variable or method) belongs to the"
  - '[PAGE 174]


    class, rather than instances of the class. This means that a single copy of the
    static member is created and shared across all instances of the class.


    +   * Static Variables: Also known as class variables, these are declared with
    the static keyword within a class, but outside any method. They are initialized
    when the class is loaded.


    +   * Static Methods: These methods can be called without creating an instance
    of the class. Static methods cannot access instance variables directly; they must
    use an object reference.


    ```

    final int finalVariable = 10; // Cannot be reassigned a new value

    ```


    # 12.4.2 Final Keyword: Immutable States


    The final keyword in Java is used to declare constants, prevent inheritance, and
    prevent methods from being overridden. When applied to variables, it makes them
    unchangeable after they are initialized. When applied to classes and methods,
    it restricts inheritance and overriding, respectively.


    +   * Final Variables: These variables must be initialized when declared or within
    the constructor.


    +   * Final Parameters: Parameters of a method declared as final cannot be modified
    within the method.'
