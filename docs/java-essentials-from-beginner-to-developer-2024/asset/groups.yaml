    Show with String: \" + s);\n    }\n}\n```\n\n- 动态多态通过方法重写实现，这意味着要调用的确切方法是在运行时根据对象的实例化确定的。动态多态的示例：\n\
    \n## 7.4.2 方法重载 vs 方法重写\n\n- 方法重载（静态多态）：它允许一个类拥有多个同名方法，但方法签名不同（即不同的参数列表）。通过根据输入参数以不同方式处理相同的方法，它提高了代码的可读性和重用性。\n\
    \n- 方法重写（动态多态）：它允许子类为其父类中已经提供的方法提供特定的实现。子类中的方法在名称、返回类型和参数上必须与父类中的方法相同。\n\n## 7.4.3\
    \ 动态方法分发\n\n动态方法分发是一种机制，其中对重写方法的调用在运行时而非编译时进行解析。这是 Java 实现运行时多态的方式。在这种场景下，引用类型\
    \ `Animal` 并不决定调用哪个版本的 `sound()`。要调用的方法是由实例类型在运行时决定的。\n\n## 7.4.4 多态的现实世界示例\n\n\
    - 1 图形用户界面 (GUI) 元素：不同的对象（如按钮、文本框和复选框）可能继承自一个公共父类（例如 Component）。每个对象都可能重写 `draw()`\
    \ 方法来渲染自己。在遍历组件集合并调用 `draw()` 时，多态确保了每个元素都调用了正确的方法。\n\n- 2 支付处理系统：在支付系统中，不同的支付方式（信用卡、PayPal、银行转账）可能派自\
    \ Payment 父类。每种方法都有其自己的 `processPayment()` 方法实现。多态允许系统以统一的方式处理不同的支付类型，增强了代码的重用性和活性。\n\
    \n多态（无论是静态还是动态）在简化复杂性方面起着至关重要的作用，允许同一个接口用于不同的底层形式（数据类型或类），促进了代码的重用。\n\n# 异常处理\n\
    \n## 理解异常\n\n异常是程序执行过程中发生的、中断指令执行流的事件。在 Java 中，处理异常允许你的程序继续运行，而不是因为意外问题而崩溃。\n\n\
    ### 8.1.1 什么是异常？\n\n异常可以是程序遇到的任何错误状况或意外行为。当出现这种状况时，会创建一个表示该异常的对象，并从导致该异常的方法中抛出。如果该方法没有处理异常，运行时系统将尝试在调用栈中寻找另一个能够处理异常的方法。\n\
    \n### 8.1.2 异常类型\n\nJava 中的异常主要分为两类：检异常（checked exceptions）和未检异常（unchecked exceptions）。\n\
    \n- 检异常：检异常是在编译时进行检查的异常，这意味着编译器要求代码要么处理这些异常或使用 `throws` 声明它们。检异常的存在标志着预期的但可以预防的问题，合理的应用程序应该预见到并从中恢复。检异常的一个示例是\
    \ `FileNotFoundException`。\n\n- 未检异常：未检异常代表程序中的缺陷（bug）——通常是逻辑错误。这些异常在编译时不进行检查，而是在运行时检查。示例包括\
    \ `NullPointerException` 和 `ArrayIndexOutOfBoundsException`。\n\n### 8.1.3 异常层次结构\n\
    \n所有异常类都是 `Throwable` 类的后代。`Throwable` 类分为两个主要的子类：`Error`（用于普通应用程序不应尝试捕获的错误状况）和\
    \ `Exception`，后者进一步分为检异常和运行时异常（未检异常）。\n\n### 8.1.4 常见异常场景和处理策略\n\n- 输入/输出操作：这些操作很容易因为许多原因失败，如文件不存在或硬件故障。处理策略包括使用\
    \ `try` 处理这些异常或使用 `throws` 声明它们。\n\n- 空指针访问：像访问数组一样访问或修改 `null` 的槽位。在访问方法或字段之前进行预防性的空检查可以缓解这种问题。\n\
    \n- 数组索引越界：尝试访问超出数组大小的元素。在访问数组之前确保索引边界检查可以防止此类问题。\n\n- 类型转换异常：尝试将对象转换为其不是其实例的子类。可以通过在转换之前使用\
    \ `instanceof` 检查来防止这种异常。\n\n"
