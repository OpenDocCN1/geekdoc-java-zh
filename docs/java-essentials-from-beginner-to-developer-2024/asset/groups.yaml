    World\");\n    }\n}\n```\n\nLambda expressions provide a clear and concise way\
    \ to represent one method interfaces (or functional interfaces).\n\n## 12.3 Inner\
    \ Classes in Depth\n\n### 12.3.1 Overview of Inner Classes\n\nIn Java, an inner\
    \ class is defined within another class. Inner classes are divided into several\
