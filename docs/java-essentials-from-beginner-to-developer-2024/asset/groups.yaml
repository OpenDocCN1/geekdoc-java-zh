    # 10.2.2 Buffers: The Core of NIO


    Buffers are a core concept in NIO, representing a contiguous block of memory where
    data is temporarily stored during I/O operations. Unlike streams in the traditional
    I/O model, which process data in a linear, sequential manner, buffers allow data
    to be read and written randomly. Buffers in Java NIO are typed; i.e., there are
    separate buffer classes for different data types such as ByteBuffer, CharBuffer,
    IntBuffer, etc. These buffers operate under a flip mechanism where the buffer
    switches from writing mode to reading mode, ensuring efficient data access and
    manipulation.


    # 10.2.3 Channels: A New Way to Handle IO


    Channels can be thought of as conduits through which data is transferred between
    buffers and the external entity (e.g., a file or a network socket). They provide
    a unified API for managing various types of I/O operations reading from and writing
    to files, as well as network communications. The primary channel types include
    FileChannel for file I/O, SocketChannel for TCP network I/O, and DatagramChannel
    for UDP network I/O. In contrast to streams, channels support both reading and
    writing on the same instance, facilitating more versatile and powerful data handling
    capabilities.'
  - '[PAGE 141]


    # 10.2.4 Selector: Multiplexing with NIO


    The Selector component is a mechanism allowing a single thread to monitor multiple
    channels for events, such as data arrival, connection openings, or readiness for
    reading/writing. This capability enables the development of highly scalable network
    applications that do not require a thread per connection, significantly reducing
    resource consumption and increasing performance. By registering multiple channels
    with a selector, an application can efficiently manage thousands of open connections
    in a non-blocking manner, checking for I/O events and handling them as they occur.
    This is particularly useful for implementing servers that handle many concurrent
    connections, such as web or application servers.


    Java NIO''s introduction of buffers, channels, and selectors marked a significant
    enhancement in Java''s I/O capabilities, providing developers with the tools to
    build highly scalable and efficient networking and file I/O applications. The
    shift from a stream-based to a buffer-oriented model allows more control and flexibility
    in how data is processed, making Java NIO an essential component in modern Java
    application development.


