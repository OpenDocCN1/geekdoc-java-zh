    \ Executors for Time-based Task Execution\n\nScheduledExecutor allows you to schedule\
    \ commands to run after a given delay or to execute periodically. This is useful\
    \ for implementing timeouts, heartbeats.\n\n```java\nScheduledExecutorService\
    \ scheduler = Executors.newScheduledThreadPool(1);\n\nRunnable task = () -> System.out.println(\"\
    Task executed after delay\");\nScheduledFuture<?> scheduledFuture = scheduler.schedule(task,\
    \ 5, TimeUnit.SECONDS);\n\nscheduler.shutdown();\n```\n\n### 11.4.4 Customizing\
    \ Thread Pool via ThreadPoolExecutor\n\nIf the executor services provided by the\
    \ Executors class don't meet your needs, you can create a ThreadPoolExecutor directly\
    \ and customize it. When creating ThreadPoolExecutor, you can specify core and\
    \ maximum pool sizes, keep-alive time for idle threads, a blocking queue for tasks\
    \ waiting to be executed, and a thread factory to create new threads.\n\n```java\n\
    int corePoolSize = 2;\nint maxPoolSize = 4;\nlong keepAliveTime = 10;\n\nThreadPoolExecutor\
