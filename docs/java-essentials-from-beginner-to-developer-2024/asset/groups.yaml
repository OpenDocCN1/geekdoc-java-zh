- md: "\n### 7.1.1 Understanding the Basics of Inheritance\n\nInheritance enables\
    \ a new class, known as the subclass or derived class, to absorb the members (fields,\
    \ methods, and constructors) of another class, referred to as the super or base\
    \ class. The primary advantage is the ability to define a common base class that\
    \ can share code across multiple derived classes.\n\nKey concepts include:\n\n\
    - Superclass and Subclass: The superclass is the class from which others inherit,\
    \ whereas the subclass is the class that inherits from the superclass.\n- extends\
    \ Keyword: In Java, the extends keyword is used by a class to declare that it\
    \ inherits from another class.\n\n### 7.1.2 Creating and Extending Superclasses\n\
    \nCreating a superclass involves defining a regular class that other classes will\
    \ inherit from. Extending this class is done using the extends keyword. For example,\
    \ if Animal is a superclass, creating a subclass Dog that inherits from Animal\
    \ can be done as follows: By extending Animal, Dog inherits the eat method and\
    \ can also define its own methods, such as bark.\n\n## 7.1.3 Utilizing Protected\
    \ Access Modifiers\n\nThe protected access modifier plays a crucial role in inheritance.\
    \ Members declared as protected in a super-class can be accessed by the subclass\
    \ (including subclasses outside the package), but are not accessible by other\
    \ classes outside the package.\n\nThis modifier helps in encapsulating the superclass's\
    \ members, allowing controlled access to them, as opposed to public access (which\
    \ could expose too much of the superclass's internal details), or private access\
    \ (which would prevent the subclass from accessing important members).\n\n## 7.1.4\
    \ Exploring Inheritance Hierarchies and Multiple Inheritance Issues\n\nInheritance\
    \ hierarchies occur when a class inherits from a subclass, creating a \"family\
    \ tree\" of classes with multiple levels. This allows for more specific categorizations\
    \ and behaviors at each subclass level.\n\nJava does not support multiple inheritance\
    \ through classes to avoid the diamond problem, where a class inherits from two\
    \ classes that have a method with the same signature. This could confuse the compiler\
    \ as to which method to invoke. However, Java tackles the need for multiple inheritances\
    \ by allowing a class to implement multiple interfaces.\n\nExample of inheritance\
    \ hierarchy:\n\n```\nclass Animal {\n    void eat() {\n        System.out.println(\"\
    This animal eats.\");\n    }\n}\n\nclass Mammal extends Animal {\n    void breathe()\
    \ {\n        System.out.println(\"This mammal breathes.\");\n    }\n}\n\nclass\
    \ Bat extends Mammal {\n    void fly() {\n        System.out.println(\"This bat\
    \ can fly.\");\n    }\n}\n```\n\nHere, Bat inherits from Mammal, which in turn\
    \ inherits from Animal, forming a hierarchy. By understanding and implementing\
    \ inheritance appropriately, developers can create flexible and maintainable codebases.\n\
    \n## 7.2 Using 'super' and Method Overriding\n\nThe concepts of super keyword\
    \ utilization and method overriding play significant roles in the implementation\
    \ of inheritance in Java, enhancing both functionality and polymorphism.\n\n###\
    \ 7.2.1 The Role of the 'super' Keyword in Accessing Superclass Members\n\nThe\
    \ super keyword in Java is a reference variable that is used to refer to the immediate\
    \ parent class object. It can be employed to access superclass methods and constructors\
    \ that are overridden or hidden in the subclass.\n\n- Access Superclass Methods:\
    \ super can be used to call superclass methods that have been overridden in the\
    \ subclass. This is particularly useful when you want both the superclass and\
    \ subclass versions of a method to be accessible from the subclass.\n- Calling\
    \ Superclass Constructors: super() can call superclass constructors. The call\
    \ to super() must be the first statement in each constructor of a subclass. If\
    \ a subclass constructor does not explicitly call a superclass constructor, the\
    \ Java compiler automatically inserts a call to the no-argument constructor of\
    \ the superclass.\n\n```\nclass Animal {\n    void move() {\n        System.out.println(\"\
    Animals can move\");\n    }\n}\nclass Dog extends Animal {\n    void move() {\n\
    \        super.move(); // Calls the method in Animal class\n        System.out.println(\"\
    Dogs can walk and run\");\n    }\n}\n```\n\n### 7.2.2 Overriding Methods in the\
    \ Subclass\n\nMethod overriding occurs when a subclass redefines a method in its\
    \ superclass. Overriding allows a subclass to provide a specific implementation\
    \ of a method already provided its superclass.\n\nOverriding Rules: The argument\
    \ list must exactly match that of the overridden method. The return type must\
    \ also be the same or a subtype (covariant return type). Furthermore, a subclass\
    \ can not override methods that are declared final or static.\n\nExample of overriding:\n\
    \n```\nclass Vehicle {\n    void run() {\n        System.out.println(\"The vehicle\
    \ is running\");\n    }\n}\n\nclass Car extends Vehicle {\n    @Override\n   \
    \ void run() {\n        System.out.println(\"The car is running safely\");\n \
    \   }\n}\n```\n\n### 7.2.3 Rules and Best Practices for Method Overriding\n\n\
    1. Signature Match: The method name and parameters must exactly match the method’s\
    \ signature in the superclass.\n2. Access Level: The access level cannot be more\
    \ restrictive than the overridden method's access level.\n3. Return Type: Must\
    \ be the same or a subtype of the return type in the superclass method (covariant\
    \ return type).\n4. Invocation of Superclass Method: Sometimes, it's beneficial\
    \ to call the superclass's version in the overridden method using super.\n\nFollowing\
    \ these rules ensures clean, functional inheritance hierarchies with predictable\
    \ behaviors.\n\n### 7.2.4 The Significance of Annotation @Override\n\nThe @Override\
    \ annotation indicates that a method is intended to override a method in its superclass.\
    \ If the method does not actually override a superclass, the compiler produces\
    \ an error. This annotation improves code clarity and helps errors, such as misspelling\
    \ a method name or not matching the parameters.\n\nExample with @Override:\n\n\
    ```\nclass Animal {\n    void eat() {\n        System.out.println(\"This animal\
    \ eats.\");\n    }\n}\nclass Dog extends Animal {\n    @Override\n    void eat()\
    \ {\n        System.out.println(\"A dog eats.\");\n    }\n}\n```\n\n## 7.3 Interfaces\
    \ and Abstract Classes\n\nInterfaces and abstract classes are two pivotal concepts\
    \ in Java used to achieve abstraction and multiple inheritance (through interfaces).\
    \ They set a blueprint for classes, guiding them on what methods they must.\n\n\
    ### 7.3.1 Defining and Implementing Interfaces\n\nAn interface in Java is a reference\
    \ type, similar to a class, that can contain only constants, method signatures,\
    \ default methods, static methods, and nested types. Interfaces cannot contain\
    \ instance fields. The methods in interfaces are abstract by default.\n\nTo define\
    \ an interface, you use the interface keyword. Classes implement interfaces and\
    \ must provide concrete implementations for all abstract methods in the interface.\n\
    \n```\ninterface Animal {\n    void eat();\n    void travel();\n}\n\nclass Mammal\
    \ implements Animal {\n    public void eat() {\n        System.out.println(\"\
    Mammal eats\");\n    }\n\n    public void travel() {\n        System.out.println(\"\
    Mammal travels\");\n    }\n}\n```\n\n### 7.3.2 Comparing Interfaces With Abstract\
    \ Classes\n\nBoth interfaces and abstract classes can have abstract methods, but\
    \ there are key differences:\n\n- Abstract Classes: Can have a mix of methods\
    \ with or without implementations. Only one abstract class can be extended by\
    \ a subclass.\n- Interfaces: Before Java 8, interfaces could only have abstract\
    \ methods without implementations. From Java 8 onwards, they can have default\
    \ and static methods. A class can implement multiple interfaces.\n\nAbstract classes\
    \ are used when subclasses share methods with implementations. Interfaces are\
    \ typically used to define a common set of functionalities that can be provided\
    \ by any class, regardless of its place in the class hierarchy.\n\n### 7.3.3 Using\
    \ Default and Static Methods in Interfaces\n\nJava 8 introduced the ability to\
    \ define concrete methods in interfaces using default and static methods. This\
    \ allows for new functionalities to be added to interfaces without affecting the\
    \ classes that implement these interfaces.\n"
