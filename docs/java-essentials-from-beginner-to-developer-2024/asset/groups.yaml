    # 7.3.2 Comparing Interfaces With Abstract Classes


    Both interfaces and abstract classes can have abstract methods, but there are
    key differences:


    +   - Abstract Classes: Can have a mix of methods with or without implementations.
    Only one abstract class can be extended by a subclass.

    - Interfaces: Before Java 8, interfaces could only have abstract methods without
    implementations. From Java 8 onwards, they can have default and static methods
    with bodies. A class can implement multiple interfaces.


    Abstract classes are used when subclasses share methods with implementations.
    Interfaces are typically used to define a common set of functionalities that can
    be provided by any class, regardless of its place in the class hierarchy.


    # 7.3.3 Using Default and Static Methods in Interfaces


    Java 8 introduced the ability to define concrete methods in interfaces using default
    and static methods. This allows for new functionalities to be added to interfaces
    without affecting the classes that implement these interfaces.'
