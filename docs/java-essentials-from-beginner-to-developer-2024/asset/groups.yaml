    \n## 5.3 方法重载\n\n### 5.3.1 方法重载的概念\n\n方法重载是 Java 的一项特性，允许在同一个类中具有多个相同名称的方法。\n\n\
    方法重载是 Java 的一项特性，允许在同一个类中具有多个相同名称的方法。这种概念对于基本类型和引用类型行为在参数列表上有所不同。\n\n### 5.3.2\
    \ 不同参数类型的方法重载\n\n方法重载是 Java 的一项特性，允许在同一个类中具有多个相同名称的方法。这允许方法处理不同的类型。\n\n```java\n\
    public class Calculator {\n    public int add(int a, int b) {\n        return\
    \ a + b;\n    }\n\n    public double add(double a, double b) {\n        return\
    \ a + b;\n    }\n}\n```\n\n### 3 不同参数个数的方法重载\n\n方法重载是 Java 的一项特性，允许在同一个类中具有多个相同名称的方法。这允许方法处理不同参数个数。\n\
    \n```java\npublic class Calculator {\n    public int add(int a, int b) {\n   \
    \     return a + b;\n    }\n\n    public int add(int a, int b, int c) {\n    \
    \    return a + b + c;\n    }\n}\n```\n\n### 5.3.4 方法重载的最佳实践\n\n虽然重载增加了灵活性，但遵循以下最佳实践很重要：\n\
    \n1. 谨慎使用重载：仅在合理时重载。\n2. 保持逻辑一致性：确保重载方法执行相同的任务。\n3. 使用清晰且描述性的参数：这有助于清晰度。\n4. 针对相同类型考虑变长参数：这简化了。\n\
    \n## 5.4 理解作用域与访问性\n\n### 5.4.1 方法中变量的作用域\n\n变量的作用域决定了在代码的哪些部分可以访问它。方法变量（称为局部变量）定义在方法内部，并且仅在该方法内可用。它们在方法执行完成后就会消失。这种有限的作用域有助于减少命名冲突和内存占用。\n\
    \n```\npublic void myMethod() {\n    int local = 5;\n}\n```\n\n### 5.4.2 全局变量与局部变量\n\
    \n- 局部变量：这些变量定义在方法内部，只能在该方法内访问。它们在每次调用方法时初始化，并且在方法作用域外不可见。\n\n```java\npublic\
