    \ the Collections API in Java 8, allowing new methods to be added without affecting\
    \ existing code.\n\n## 12.2.4 Functional Interfaces and Lambda Expressions\n\n\
    A functional interface in Java is an interface that contains exactly one abstract\
    \ method. It can have more than one method, but all other methods must have default\
    \ implementations or be static. These interfaces are intended to be used primarily\
    \ with lambda expressions, which provide a clear and concise way to represent\
    \ one method interfaces (or functional interfaces).\n\n```java\n@FunctionalInterface\n\
    public interface Greeting {\n    void sayHello(String message);\n}\n\npublic class\
