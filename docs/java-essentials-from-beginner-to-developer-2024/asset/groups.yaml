  - '[PAGE 137]


    Streams in Java are sequences of data that can be read from or written to. They
    serve as a conduit for data flow between your Java program and a variety of sources
    or destinations, including memory, files, pipes, and network sockets. Java categorizes
    streams into two main types: byte streams (for binary data) and character streams
    (for text data). Byte streams use classes such as InputStream and OutputStream
    as their foundation, while character streams use Reader and Writer classes.


    # 10.1.2 File Handling Basics


    File handling in Java revolves around creating, reading, writing, and manipulating
    files on the filesystem. This functionality is facilitated primarily through classes
    found in the java.io package for traditional I/O operations and the java.nio.file
    package in the New I/O (NIO) library for newer, more flexible file handling. Key
    classes include File, FileInputStream, FileOutputStream, FileReader, FileWriter,
    and the NIO Files and Path classes. Understanding how to use these classes is
    essential for tasks like reading configuration files, storing application data,
    and managing logs.


    # 10.1.3 Common File Operations: Reading, Writing, Appending


    Reading: Java provides multiple ways to read from files. For binary data, one
    might use FileInputStream, while FileReader is useful for reading characters.
    The NIO package also offers the Files.readAllBytes(Path) and Files.new-BufferedReader(Path)
    methods for efficient file reading.'
