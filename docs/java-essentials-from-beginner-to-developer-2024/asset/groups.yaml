    Show with String: \" + s);\n    }\n}\n```\n\n- Dynamic Polymorphism occurs through\
    \ method overriding, meaning that the exact method to be called is determined\
    \ at runtime based on the object's instantiation. Example of dynamic polymorphism:\n\
    \n## 7.4.2 Method Overloading vs. Method Overriding\n\n- Method Overloading (Static\
    \ Polymorphism): It allows a class to have more than one method with the same\
