  - '[PAGE 11]


    Java programs are written in plain text, so feel free to use any text editor to
    write your code. To turn your Java program into something that can be run, you
    first need to compile it into bytecode using the Java compiler (javac). This process
    takes your .java file and creates a .class file which the Java Virtual Machine
    (JVM) can execute. The basic commands to compile and run your program in the command
    line are:


    ```

    javac HelloWorld.java

    java HelloWorld

    ```


    The first command compiles the HelloWorld.java source file into a HelloWorld.class
    bytecode file. The second command runs the compiled bytecode on the JVM.


    # 1.2.4 Common Errors and Troubleshooting


    When starting out, it''s typical to run into errors. The most common types include:


    +   - Syntax errors: Missing semicolons, unpaired braces, or misspelled keywords.


    +   - Runtime errors: Errors that occur during the execution of your program,
    often due to logic errors such as dividing by zero.


    +   - Compilation errors: Issues found during the compilation process, typically
    due to syntax errors or issues with the classpath.


    Troubleshooting involves carefully reading error messages, which often give hints
    as to what and where the problem might be, and incrementally testing your program
    by compiling and running frequently after making changes.'
