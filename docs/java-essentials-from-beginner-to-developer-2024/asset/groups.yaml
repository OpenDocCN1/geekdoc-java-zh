    \ are respectively suited for binary and character data. For appending data, constructors\
    \ for these classes accept a boolean parameter to indicate whether content should\
    \ be appended to the end of the file.\n\nAppending: When you want to add to the\
    \ existing contents of a file without overwriting it, you can use constructors\
    \ or methods that support the append mode. In NIO, the Files.write(Path, byte[],\
    \ StandardOpenOption.APPEND) method facilitates this operation.\n\n## 10.1.4 Try-with-Resources\
    \ and AutoCloseable Interface\n\nA significant concern with file handling and\
    \ stream manipulation is ensuring that resources are properly closed after use\
    \ to prevent resource leaks. Java's try-with-resources statement, introduced in\
    \ Java 7, simplifies this task. It automatically manages resource closure at the\
    \ end of the statement's execution. To be compatible with this statement, a resource\
    \ must implement the AutoCloseable interface, which includes all most streams\
    \ and related resources. Here is a concise example of its usage:\n\n```\ntry (FileReader\
    \ reader = new FileReader(\"input.txt\")) {\n    int data;\n    while ((data =\
    \ reader.read()) != -1) {\n        System.out.print((char) data);\n    }\n} catch\
    \ (IOException e) {\n    e.printStackTrace();\n}\n```\n\nIn this example, FileReader\
    \ is a resource that implements AutoCloseable. It gets automatically closed once\
    \ the try block is exited, either normally or due to an exception, significantly\
    \ reducing boilerplate code and minimizing the risk of resource leaks.\n\n## 10.2\
    \ The NIO Package\n\n### 10.2.1 Introduction to Java NIO\n\nJava NIO (New Input/Output)\
    \ was introduced in Java 1.4 as an alternative and complement to the standard\
    \ Java I/O API. It offers non-blocking IO operations, a buffer-oriented data manipulation\
    \ approach, and the ability to manage multiple network connections through a single\
    \ thread. The key components of NIO include Channels, Buffers, Selectors, and\
    \ character sets, enabling faster and more scalable I/O operations, especially\
    \ for applications that require managing numerous connections simultaneously,\
    \ such as web servers.\n\n### 10.2.2 Buffers: The Core of NIO\n\nBuffers are a\
    \ core concept in NIO, representing a contiguous block of memory where data is\
    \ temporarily stored during I/O operations. Unlike streams in the traditional\
    \ I/O model, which process data in a linear, sequential manner, buffers allow\
    \ data to be read and written randomly. Buffers in Java NIO are typed; i.e., there\
    \ are separate buffer classes for different data types such as ByteBuffer, CharBuffer,\
    \ IntBuffer, etc. These buffers operate under a flip mechanism where the buffer\
    \ switches from writing mode to reading mode, ensuring efficient data access and\
    \ manipulation.\n\n### 10.2.3 Channels: A New Way to Handle IO\n\nChannels can\
    \ be thought of as conduits through which data is transferred between buffers\
    \ and the external entity (e.g., a file or a network socket). They provide a unified\
    \ API for managing various types of I/O operations reading from and writing to\
    \ files, as well as network communications. The primary channel types include\
    \ FileChannel for file I/O, SocketChannel for TCP network I/O, and DatagramChannel\
    \ for UDP network I/O. In contrast to streams, channels support both reading and\
    \ writing on the same instance, facilitating more versatile and powerful data\
    \ handling capabilities.\n\n### 10.2.4 Selector: Multiplexing with NIO\n\nThe\
    \ Selector component is a mechanism allowing a single thread to monitor multiple\
    \ channels for events, such as data arrival, connection openings, or readiness\
    \ for reading/writing. This capability enables the development of highly scalable\
    \ network applications that do not require a thread per connection, significantly\
    \ reducing resource consumption and increasing performance. By registering multiple\
    \ channels with a selector, an application can efficiently manage thousands of\
    \ open connections in a non-blocking manner, checking for I/O events and handling\
    \ them as they occur. This is particularly useful for implementing servers that\
    \ handle many concurrent connections, such as web or application servers.\n\n\
    Java NIO's introduction of buffers, channels, and selectors marked a significant\
    \ enhancement in Java's I/O capabilities, providing developers with the tools\
    \ to build highly scalable and efficient networking and file I/O applications.\
    \ The shift from a stream-based to a buffer-oriented model allows more control\
    \ and flexibility in how data is processed, making Java NIO an essential component\
    \ in modern Java application development.\n\n## 10.3 Reading and Writing Files\
    \ in Java\n\n### 10.3.1 Using FileInputStream and FileOutputStream\n\nFileInputStream\
    \ and OutputStream are classes from the java.io package designed for reading from\
    \ and writing files as streams of bytes, making them highly effective for handling\
    \ binary data such as images and executable files.\n\n- FileInputStream: It's\
    \ used for reading data from files. Data is read in byte format, meaning it reads\
    \ data by byte by byte, making it suitable for reading binary files.\n\n```\n\
    FileInputStream fis = new FileInputStream(\"example.txt\");\nint i;\nwhile ((i\
    \ = fis.read()) != -1) {\n    System.out.print((char) i);\n}\nfis.close();\n```\n\
    \n- OutputStream: This class is utilized for writing data to files. Like FileInputStream,\
    \ it operates on data by byte by byte. It's especially useful for writing binary\
    \ data to a file.\n\n```\nOutputStream fos = new OutputStream(\"output.txt\");\n\
    String data = \"Hello World!\";\nfos.write(data.getBytes());\nfos.close();\n```\n\
    \n### 10.3.2 Reader and Writer Classes\n\nFor character-oriented data (like text\
    \ files), Java provides Reader and Writer abstract classes within the java.io\
    \ package.\n\n- FileReader and FileWriter are subclasses for reading and writing\
    \ characters. Unlike byte streams (FileInputStream/FileOutputStream), these are\
    \ designed to handle characters, which makes them perfect for dealing with text.\n\
    \n### 10.3.3 Using Files Class for Efficient IO\n\nThe Files class in java.nio.file\
    \ offers a set of static methods to operate on files and directories. These methods\
    \ are designed to use Path objects, making file operations more efficient.\n\n\
    - Reading a file:\n\n```\nPath path = Paths.get(\"example.txt\");\nbyte[] fileArray\
    \ = Files.readAllBytes(path);\n```\n\n- Writing to a file:\n\n```\nPath newPath\
    \ = Paths.get(\"newfile.txt\");\nbyte[] data = \"Sample text\".getBytes();\nFiles.write(newPath,\
    \ data, StandardOpenOption.CREATE);\n```\n\n### 10.3.4 Path and Paths: NIO 2 Enhancements\n\
    \nIntroduced in Java 7, the NIO.2 file API added the Path interface and Paths\
    \ utility class to provide a more comprehensive approach for file systems.\n\n\
    - Path: Represents a system-dependent file path. It is an object that may be used\
    \ to locate a file in a file system. It offers methods to inspect, locate, and\
    \ manipulate file objects.\n\n- Paths: A utility class that contains static methods\
    \ to return a Path by converting a path string to URI.\n\nAdopting the Files class\
    \ and the Path/Paths interfaces can lead to more readable and maintainable code\
    \ for I/O operations, offering advanced functionalities like symbolic links handling,\
    \ file attribute access, and directory walking, which are not directly available\
    \ through the traditional I/O streams.\n\n## 10.4 Understanding Byte Streams and\
    \ Character Streams\n\n### 10.4.1 Difference Between Byte Streams and Character\
    \ Streams\n\nJava I/O streams are categorized into two main types: byte streams\
    \ and character streams. Byte streams (InputStream OutputStream subclasses) are\
    \ primarily used for handling raw binary data, such as image files, audio files,\
    \ and serialized objects. They read and write data byte by byte. Character streams\
    \ (Reader and writer subclasses), on the other hand, are designed for handling\
    \ character data, like text files. They read and write data character by character,\
    \ automatically handling character encoding and decoding, thus the complexity\
    \ of converting between characters and bytes.\n\n### 10.4.2 When to Use Byte Streams\
    \ Over Character Streams\n\nByte streams should be used when dealing with raw\
    \ data or binary files where data does not necessarily represent characters. Examples\
    \ include:\n\n- Reading or writing binary files (e.g., images, videos).\n- Working\
    \ with serialized objects.\n- Interacting with data streams that come from sources\
    \ or go to destinations that do\n"
  mdcn: "\n\n写入：写入文件同样非常灵活。`OutputStream` 和 `FileWriter` 分别适用于二进制数据和字符数据。对于追加数据，这些类的构造函数接受一个布尔参数，用以指示是否将内容追加到文件末尾。\n\
    \n追加：当你想要向文件的现有内容添加内容而不覆盖原有内容时，可以使用支持追加模式的构造函数或方法。在 NIO 中，`Files.write(Path, byte[],\
    \ StandardOpenOption.APPEND)` 方法方便了这种操作。\n\n## 10.1.4 Try-with-Resources 和 AutoCloseable\
    \ 接口\n\n文件处理和流操作中的一个重要问题是确保在使用后正确关闭资源以防止资源泄漏。Java 7 引入的 `try-with-resources` 语句简化了这项任务。它在语句执行结束时自动管理资源的关闭。为了兼容此语句，资源必须实现\
    \ `AutoCloseable` 接口，该接口包含了大多数流和相关资源。以下是一个简洁的用法示例：\n\n```\ntry (FileReader reader\
    \ = new FileReader(\"input.txt\")) {\n    int data;\n    while ((data = reader.read())\
    \ != -1) {\n        System.out.print((char) data);\n    }\n} catch (IOException\
    \ e) {\n    e.printStackTrace();\n}\n```\n\n在这个示例中，`FileReader` 是实现 `AutoCloseable`\
    \ 的资源。一旦退出 `try` 块（无论是正常退出还是由于异常），它就会自动关闭，显著减少了样板代码并最小化了资源泄漏的风险。\n\n## 10.2 NIO\
    \ 包\n\n### 10.2.1 Java NIO 简介\n\nJava NIO（新输入/输出）在 Java 1.4 中引入，作为标准 Java I/O\
    \ API 的替代方案和补充。它提供了非阻塞 IO 操作、面向缓冲区的数据处理方法，以及通过单个线程管理多个网络连接的能力。NIO 的核心组件包括通道（Channels）、缓冲区（Buffers）、选择器（Selectors）和字符集，能够实现更快、更具扩展性的\
    \ I/O 操作，特别是对于需要同时管理大量连接的应用程序（如 Web 服务器）。\n\n### 10.2.2 缓冲区：NIO 的核心\n\n缓冲区（Buffers）是\
    \ NIO 的核心概念，代表一个连续的内存块，数据在 I/O 操作期间临时存储在其中。与传统的 I/O 模型中以线性、顺序方式处理数据的流不同，缓冲区允许随机读写数据。Java\
    \ NIO 中的缓冲区是带类型的；即，针对不同类型的数据类型（如 `ByteBuffer`、`CharBuffer`、`IntBuffer` 等）有独立的缓冲区类。这些缓冲区在\
    \ `flip` 机制下运行，缓冲区从写入模式切换到读取模式，确保了数据的高效访问和处理。\n\n### 10.2.3 通道：处理 IO 的新方式\n\n\
    通道（Channels）可以被看作是管道，数据在缓冲区和外部实体（例如文件或网络套字）之间传输。它们提供了一个统一的 API，用于管理各种类型的文件读写 I/O\
    \ 操作以及网络通信。主要的通道类型包括用于文件 I/O 的 `FileChannel`、用于 TCP 网络 I/O 的 `SocketChannel` 以及用于\
    \ UDP 网络 I/O 的 `DatagramChannel`。与流不同，通道支持在同一个实例上同时读取和写入，从而提供了更灵活、更强大的数据处理能力。\n\
    \n### 10.2.4 选择器：使用 NIO 进行多路复用\n\n选择器（Selector）组件允许单个线程监控多个通道事件的机制，例如数据到达、连接打开或读/写就绪。这种能力能够开发无需为每个连接创建一个线程的高度扩展性网络应用程序，显著减少了资源消耗并提高了性能。通过向选择器注册多个通道，应用程序可以以后阻塞的方式高效管理数千个打开的连接，检查\
    \ I/O 事件并在发生时进行处理。这对于实现处理许多并发连接的服务器（如 Web 或应用服务器）特别有用。\n\nJava NIO 引入缓冲区、通道和选择器标志着\
    \ Java I/O 能力的重大增强，为开发者提供了构建高度可扩展且高效的网络和文件 I/O 应用程序的工具。从基于流的模型向面向缓冲区的模型转变，使得数据处理具有更多的控制和灵活性，使\
    \ Java NIO 成为现代 Java 应用开发中的核心组件。\n\n## 10.3 在 Java 中读写文件\n\n### 10.3.1 使用 FileInputStream\
    \ 和 FileOutputStream\n\n`FileInputStream` 和 `OutputStream` 是 `java.io` 包中的类，设计用于以字节流的形式读取和写入文件，使它们在处理图像和可执行文件等二进制数据时非常有效。\n\
    \n- FileInputStream：用于从文件中读取数据。数据以字节格式读取，意味着它是逐字节读取的，因此适合读取二进制文件。\n\n```\nFileInputStream\
    \ fis = new FileInputStream(\"example.txt\");\nint i;\nwhile ((i = fis.read())\
    \ != -1) {\n    System.out.print((char) i);\n}\nfis.close();\n```\n\n- OutputStream：此类用于向文件写入数据。与\
    \ `FileInputStream` 类似，它逐字节地处理数据。它对于向文件写入二进制数据特别有用。\n\n```\nOutputStream fos =\
    \ new OutputStream(\"output.txt\");\nString data = \"Hello World!\";\nfos.write(data.getBytes());\n\
    fos.close();\n```\n\n### 10.3.2 Reader 和 Writer 类\n\n对于面向向字符的数据（如文本文件），Java 在\
    \ `java.io` 包中提供了 `Reader` 和 `Writer` 抽象类。\n\n- `FileReader` 和 `FileWriter` 是读取和写入字符的子类。与字节流（`FileInputStream`/`FileOutputStream`）不同，这些设计用于处理字符，使其非常适合处理文本。\n\
    \n### 10.3.3 使用 Files 类进行高效 IO\n\n`java.nio.file` 中的 `Files` 类提供了一系列用于操作文件和目录的静态方法。这些方法使用\
    \ `Path` 对象，使得文件操作更加高效。\n\n- 读取文件：\n\n```\nPath path = Paths.get(\"example.txt\"\
    );\nbyte[] fileArray = Files.readAllBytes(path);\n```\n\n- 写入文件：\n\n```\nPath\
    \ newPath = Paths.get(\"newfile.txt\");\nbyte[] data = \"Sample text\".getBytes();\n\
    Files.write(newPath, data, StandardOpenOption.CREATE);\n```\n\n### 10.3.4 Path\
    \ 和 Paths：NIO 增强\n\nJava 7 引入的 NIO.2 文件 API 增加了 `Path` 接口和 `Paths` 工具类，为文件系统提供了更全面的方法。\n\
    \n- Path：表示系统的路径。它是用于定位文件的对象，提供了检查、定位和操作文件对象的方法。\n\n- Paths：一个工具类，包含静态方法可以将路径字符串转换为\
    \ `Path`。\n\n采用 `Files` 类以及 `Path`/`Paths` 接口可以使 I/O 操作的代码更具可读性和维护性，并提供了符号链接处理、文件属性访问和目录遍历等高级功能，这些功能在传统的流中是直接实现的。\n\
    \n## 10.4 理解字节流和字符流\n\n### 10.4.1 字节流与字符流的区别\n\nJava I/O 流分为两大类：字节流和字符流。字节流（`InputStream`\
