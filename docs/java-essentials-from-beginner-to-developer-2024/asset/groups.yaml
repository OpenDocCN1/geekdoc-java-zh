    \ (runtime).\n\n### 7.4.1 Demonstrating Static and Dynamic Polymorphism\n\n- Static\
    \ Polymorphism is achieved through method overloading. It occurs at compile-time.\
    \ In static polymorphism, the response to a function is determined by the parameter\
