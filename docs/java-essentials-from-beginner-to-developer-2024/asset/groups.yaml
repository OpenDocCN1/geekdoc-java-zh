    \ This is how Java implements runtime polymorphism. In this scenario, the reference\
    \ type Animal does not determine which version of sound() is called. The method\
    \ to be called is determined at runtime by the type of the instance.\n\n## 7.4.4\
    \ Real-world Examples of Polymorphism\n\n- 1 Graphical User Interface (GUI) Elements:\
    \ Different objects (such as buttons, textboxes, and checkboxes) might inherit\
    \ from a common superclass (e.g., Component). Each object might override a draw()\
    \ method to render itself. When iterating through a collection of components and\
