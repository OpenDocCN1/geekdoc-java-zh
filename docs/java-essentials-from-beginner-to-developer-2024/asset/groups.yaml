    ## 4.3.2 Arrays Class: Sorting and Searching


    The java.util.Arrays class provides static methods to perform sorting and searching
    on arrays. These utilities ease the manipulation of arrays significantly.


    - Sorting


    To sort an array, you can use the Arrays.sort() method. It modifies the array
    in place, arranging the elements in ascending order.


    ```java

    import java.util.Arrays;


    int[] numbers = {5, 3, 9, 1};

    Arrays.sort(numbers); // The numbers array is now sorted

    ```


    - Searching


    After sorting an array, you can perform a binary search using the Arrays.binarySearch()
    method. It returns the index of the searched value if it is found; otherwise,
    it returns a negative number.


    ```

    int[] numbers = {1, 3, 5, 9}; // Must be sorted for binary search

    int index = Arrays.binarySearch(numbers, 5); // Returns 2

    ```


    ## 4.3.3 Array Conversions: From Arrays to Collections and Back


    Java provides mechanisms to convert between arrays and collections, such as List,
    Set, and Map, allowing you to leverage the utilities offered by the Collections
    Framework.


    - Array to Collection


    You can convert an array to a list using Arrays.asList() method. Collection to
    Array Collections can be converted back to arrays using the toArray() method.


