- - '###'
  - 著作权法：冲突还是互补的法律秩序？尽管知识产权通常被认为与竞争法和政策的目标不可调和的¹⁴⁸，因为知识产权对作品的利用创造了“垄断”，并排除第三方未经许可使用受保护的内容，但这种观点并不准确。在工业政策和经济增长的框架内，这两个学科都通过鼓励创新和市场准入，或通过创造替代商品来刺激创造力来发挥作用¹⁴⁹。事实上，排他性权利的一个核心正当理由是通过为作者或权利人的创作活动提供保护来增强创新¹⁵⁰。为此，著作权防止各方在创新活动和投资上搭便车，同时通过“替代竞争”而非“模仿竞争”来鼓励竞争¹⁵¹。
