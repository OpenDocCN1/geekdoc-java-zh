    \ \n\nthe necessity of the wife and daughter to migrate for work, though the tale\
    \ leaves \n\nambiguous whether structural conditions or individual agency is to\
    \ blame for \n\ntheir migrations. Regardless, the tale expresses the “evidence”\
    \ as well as the hope \n\nthat when migration objectives are accomplished, and\
    \ the man’s wife and daugh-\n\nter finally return home for good, he, and individuals\
    \ like him, will be healthy and \n\nwhole again.\n\nSickness etiologies are thus\
