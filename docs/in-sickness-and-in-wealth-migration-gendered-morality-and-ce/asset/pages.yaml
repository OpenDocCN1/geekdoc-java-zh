  md: "*Introduction | 9 *\n\nThe concept of moral economies is particularly useful\
    \ to this study for its \n\n“capacity to highlight the ambiguous logics and values\
    \ that guide and sustain \n\nlivelihood practices” (Palomera and Vetta 2016, 415).\
    \ The idea of a moral economy \n\nis most often attributed to historian Edward\
    \ P. Thompson’s (1971) influential stud-\n\nies of the widespread food riots by\
    \ English peasants in the eighteenth century in \n\nresponse to unfair prices\
    \ of a “free” market economy. Anthropologist James Scott \n\nlater popularized\
    \ this concept through examining the livelihoods of Southeast \n\nAsian rice farmers\
    \ (Scott 1976). Both scholars sought to situate economic activi-\n\nties within\
    \ the realm of politics, religion, and social relations, to understand how \n\n\
    the collective actions of those then considered “premodern” or “precapitalist”\
    \ \n\nwere “grounded upon a consistent traditional view of social norms and obliga-\n\
    \ntions” (Thompson 1971, 76–79), and patterned “fears, habits, and values” (Scott\
    \ \n\n1976, 2–4). Current uses of the concept have moved away from these associations\
    \ \n\nof moral economy with the “premodern.”\n\nThompson and Scott’s conceptions\
    \ of the moral economy have been criticized \n\nas largely homogenous and presuming\
    \ amoral or “less moral” capitalist economies. \n\nCurrent scholarship, in response,\
    \ addresses the intersection of economic, social, \n\nand moral values under late\
    \ capitalism, but yields little agreement on the boundar-\n\nies of the moral\
    \ and the economic (Simoni 2016). Nevertheless, my “economies” \n\n(plural) build\
    \ on feminist substantivists who highlight the dynamic and contested \n\nnature\
    \ of human relations and action and are reluctant to strictly define the “eco-\n\
    \nnomic.” This “feminist economic” approach critiques the assumption of rational\
    \ \n\nand autonomous economic actors and behavior, pointing to the centrality\
    \ of emo-\n\ntion and personal relations of interdependency as central to social\
    \ reproduction.6 \n\nThus I understand the economic as always constituted by complex\
