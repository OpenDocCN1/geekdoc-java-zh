    \ (Munro 2015, 169; Boellstorff and Lindquist 2004). It is in this \n\nsense that\
    \ malu is also closely related to a gendered sense of dignity and self-worth.\n\
    \nMalu is relational and implies a moral hierarchy between the one who \n\nought\
    \ to feel shame and those affected by the shameful actions of another. It \n\n\
    distinguishes those who acted out of step from those who have better man-\n\n\
    aged to achieve expectations and standards (at least temporarily). Learning to\
    \ \n\ncultivate malu is an important part of Javanese children’s emotional develop-\n\
    \nment, and involves the acquiring of particular social norms: how to behave and\
    \ \n\nrespond appropriately to others in terms of their gender, age, and social\
    \ status \n\n(Keeler 1983). Closely intertwined with the performance or transgression\
