  md: "*42 | In Sickness and In Wealth*\n\nErwiana’s case points to how responsibility\
    \ for migratory processes and \n\ninjustices is often actively dispersed among\
    \ multiple institutions and individuals, \n\nsuch as bureaucrats, NGOs, commercial\
    \ recruitment intermediaries, employers, \n\nand migrants. In the event of fraud,\
    \ unpaid wages, or work injuries, migrants \n\nand migrant activists often blame\
    \ deceptive recruitment agents, exploitative \n\nemployers, or governments for\
    \ weak labor laws. Recruitment agents may absolve \n\nthemselves of responsibility\
    \ by claiming they are only facilitating the demands \n\nof employers, governments\
    \ or “market mechanisms” and working within estab-\n\nlished labor laws (Lindquist\
    \ 2012; 2015; Wise 2013). The Indonesian or migrant-\n\norigin state may shift\
    \ the responsibility for protecting their citizens abroad onto \n\nforeign/destination\
    \ states, blame recruitment agencies for not conforming to \n\nstate-imposed regulatory\
    \ guidelines, and/or deflect discussion from migrant \n\ninjury and systemic debt\
    \ to focus on ways to make “better economies” (Simoni \n\n2016) through educating\
