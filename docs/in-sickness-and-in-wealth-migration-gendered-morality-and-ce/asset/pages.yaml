    \nor being poor. A female former migrant said that wirang or aib was rarely used,\
    \ and only \n\nin severe cases. She cited an example of aib: if a woman returns\
    \ pregnant from abroad, but \n\nshe is already married in Indonesia. Someone caught\
    \ having an affair (*selingkuh*) should feel \n\naib which in turn causes the\
    \ family to experience aib. Aibrefers to a more public form of \n\ndisgrace, dishonor,\
    \ and humiliation, in relation to violating social taboos.\n\n \n\n3\\. Several\
