  md: "*166 | In Sickness and In Wealth*\n\nMany women in similar circumstances as\
    \ Titin deferred to their husbands’ \n\ndecisions, even if they expressed a reluctance\
    \ to comply. Some women also told \n\nme that they wanted to migrate, or wished\
    \ to migrate for a second time, but did \n\nnot, because their husbands, fiancés,\
    \ or boyfriends did not permit it. They sug-\n\ngested that their partners did\
    \ not approve of their desires to migrate largely due \n\nto fears that the women\
    \ would be unfaithful, or that other migrants or foreign \n\nemployers would sexually\
    \ abuse them. Titin’s framing of her return in terms of \n\nher gendered familial\
    \ duties echoes Anju Paul’s (2015) observations that some \n\nFilipina migrant\
    \ women tended to reinforce normative gendered expectations \n\nthrough their\
    \ narratives of migration, rather than transforming gender roles \n\nthrough independent\
    \ labor migration. That some Central Javanese women frame \n\ntheir mobility practices\
