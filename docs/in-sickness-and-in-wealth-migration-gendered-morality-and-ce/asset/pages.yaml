    \ to the vices of men.\n\n*Debt, Fraud, and Conspicuous Consumption*\n\nDebt or\
    \ *hutang* in Indonesian, typically referring to financial debt, is often used\
    \ \n\nas a dirty, negative, and shameful word. Whenever the term was mentioned\
    \ in \n\ncasual conversations or interviews, Central Javanese residents lowered\
    \ their \n\nvoices or whispered it. This remains true despite the long history\
    \ of microcredit \n\ninstitutions in rural Central Java, beginning from 1895 (Steinwand\
    \ 2013, 95). The \n\nmajority of migrants from Central Java embark on their journeys\
    \ with large \n\nfinancial debts. Yet the uncertainties surrounding migration\
    \ journeys and con-\n\nsequences are at odds with the predictability and pressures\
    \ of their loan repay-\n\nments. The opportunities and risks for obtaining credit\
    \ and forms of repayment \n\nare also gendered. Female domestic workers are usually\
    \ indebted to migrant \n\nbrokers who pay for their journeys up front, before\
    \ docking their pay for seven \n\nmonths to a year (Constable 2007; Lindquist\
    \ 2012; Rudnyckyj 2004; Platt et al. \n\n2013; Silvey 2004). This practice has\
    \ also been applied to an increasing number \n\nof male migrants heading for Korea.\
    \ In other cases where migrants take on fac-\n\ntory, hospitality, construction,\
    \ or fishing work, they have to pay recruitment \n\nagents and agencies prior\
    \ to leaving the country. Such fees include inflated costs \n\nof travel, food\
    \ and accommodation in migrant training centers, medical fees, \n\nand unspecified\
    \ administrative fees for multiple actors and institutions involved. \n\nIn these\
    \ cases, prospective migrants may borrow money from ostensibly reliable \n\nsources,\
    \ including extensive kinship networks, neighbors, banks, or informal \n\nloan\
    \ sharks to finance their journeys (Lindquist 2012; Spaan 1994).\n\nFinancial\
    \ debt in my field sites was intricately linked to forms of social and \n\nmoral\
