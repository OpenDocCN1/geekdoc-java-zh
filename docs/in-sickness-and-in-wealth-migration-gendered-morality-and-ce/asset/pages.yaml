    \ \n\n12\\. Indonesian migrant women employed as domestic workers in Singapore\
    \ may pay up to \n\neight months’ worth of salary for brokerage fees (Platt et\
    \ al. 2013).\n\n \n\n13\\. In one sense, neighbors are usually in fact extended\
    \ kin due to the division of \n\ninherited land, and new houses built can be seen\
    \ as expansions of older existing houses \n\n(Carsten 1991). However, the rituals\
    \ conducted among neighbors also actively create kinship \n\nties among fellow\
    \ villagers, including the sharing of local cemetery compounds. As Kostas \n\n\
    Retsikas writes about Javanese siblingship, “during ritual exchanges, food, ancestors\
    \ and \n\nprayers are assembled in new configurations which make possible for\
    \ the characterization of \n\nneighbours as siblings” (2014, 104).\n\n \n\n14\\\
    . Research on Filipino migrants has found similar discourses blaming migrants\
    \ for \n\ntheir failures (Aguilar 1999, 115–16; Tadiar 2004, 118).\n\n \n\n15\\\
    . While residents often lamented the increase in divorce rates locally and attributed\
    \ this \n\nphenomenon to migration, several ethnographies of Java have observed\
    \ that divorce was not \n\nthat rare (Hatley 1990). Furthermore, I came across\
    \ multiple cases of divorced men and women \n\nwhere neither spouse was a migrant.\
    \ Nevertheless, some scholars have noted that divorce rates \n\namong the Javanese\
    \ declined drastically after the 1960s, likely associated with self-selection\
    \ \n\nof spouses as opposed to arranged marriages (Malhotra 1997) and the cultural\
    \ desirability \n\nof “durable unions” due to an “increase in Islamic consciousness\
    \ and modern ideas about \n\nromantic love propagated in popular culture” (Retsikas\
    \ 2014, 74; see also Arijaya 2011). \n\n \n\n16\\. For more examples, see Chan\
    \ 2017b.\n\n \n\n17\\. For example, in a study of Senegalese (male) boat migration,\
    \ such an attempt is \n\nperceived “as a courageous action to fulfill the duty\
