  md: "*Contesting the Terms of Belonging | 167 *\n\nIn cases of explicit moral transgression,\
    \ as Linda Bennett observed in \n\nEastern Indonesia, it is not “enough to ignore\
    \ or tacitly disapprove of cohabita-\n\ntion but \\[some villagers must\\] publicly\
