  md: "*Faith | 127 *\n\nC: But what is the difference between takdir and nasib?\n\
    \nN: Actually, sometimes they can be the same . . .\n\nC: Bu Musliah, do you think\
    \ we can change our nasib?\n\nBu M: Nasib depends on God too, and what he wants\
    \ for us. But if we are in \n\na bad situation . . . of course we can work hard\
    \ to change it. If we are lazy, \n\nthen we won’t be able to change our fate.\n\
    \nVarious former migrants and residents—like Nurul and Bu Musliah—often \n\nemphasized\
    \ that human effort was central to changing and shaping one’s fate. \n\nI argue\
    \ that villagers’ nasib discourses enable a view of faith as a form of labor \n\
    \ncentral to their decisions to migrate, stay, or return. For the Central Javanese\
    \ \n\nI met, practicing one’s faith was intimately tied to caring for kin and\
    \ community \n\nin gender-specific ways. This chapter elaborates on how the development,\
    \ mobili-\n\nzation, and practice of faith is an important way for former migrants,\
    \ prospective \n\nmigrants, and their families to negotiate uncertainties, risks,\
    \ and shame associ-\n\nated with migration, return, and staying behind.\n\nNasib\
    \ is not only an abstract or theoretical concept used to refer to or evalu-\n\n\
    ate others’ efforts or circumstances. It is also invoked to reflect and act on\
    \ the \n\npresent, based on an understanding of how one’s past actions and hopes\
    \ show \n\npromise or not. For example, a young mother from Cilacap framed her\
    \ own fail-\n\nure to migrate in terms of nasib. She said, “People here believe\
    \ in nasib. . . . If \n\nyour nasib is good, and you make an effort, it will be\
    \ ok, but you must make an \n\neffort.” She compared it to destiny, saying, “It\
    \ is similar . . . but \\[unlike destiny\\] \n\nyou can change your fate, and\
    \ make your fate, if you try.” She was taking care of \n\nsome plantations and\
    \ agriculture (*tanaman*) at the time. Her circumstances may \n\nbe modest now,\
    \ she said, gesturing to her small and cramped house with bare \n\ncement floors.\
    \ “But hopefully I can change my nasib slowly. Maybe my nasib \n\nwasn’t to be\
    \ a TKW \\[migrant worker\\] . . . but hopefully with the tanaman, it will \n\n\
    get better. I can only make an effort.” By reframing past experiences, nasib dis-\n\
    \ncourses were also self-evaluations of one’s present circumstances. They served\
    \ to \n\nreorient persons’ hopes and actions toward different futures. In other\
    \ words, not \n\nall who had failed to migrate saw themselves as “bad” people\
    \ who deserved their \n\nbad fates, but simply that being a migrant was not their\
    \ fate at a particular point \n\nof time, and the solution was to work harder\
    \ or differently at achieving better \n\nfutures.\n\nMy approach to nasib is informed\
    \ by Hirokazu Mizayaki’s criticism of schol-\n\nars who view faith as “beyond\
