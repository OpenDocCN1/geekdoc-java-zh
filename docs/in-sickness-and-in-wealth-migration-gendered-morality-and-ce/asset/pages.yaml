    \ humiliation and shame provoke violence or \n\ndepression in some men, or prompt\
    \ their decisions to delay their return to their \n\nvillages of origin.17 Malu\
    \ or shame is thus a fundamental moral condition that \n\norganizes and mediates\
    \ Central Javanese villagers’ gendered mobility and motility."
