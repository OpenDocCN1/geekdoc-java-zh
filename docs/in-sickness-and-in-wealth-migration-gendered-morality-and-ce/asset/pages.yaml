    \ of death becomes, for many of our informants, framed in a \n\nnarrative of honor\
    \ and sacrifice” (Hernández-Carretero and Carling 2012, 412).\n\n \n\n18\\. Ellen\
    \ Prusinski, in her research among Indonesian women preparing for transnational\
    \ \n\nmigration journeys, also observed that being “*siap mental* (mentally ready)\
    \ is the most \n\nimportant element of becoming educated and prepared for migration.”\
    \ For these women \n\nthis means being “personally resilient, independent, and\
    \ brave. For others, being *siap mental* \n\nspecifically meant adopting certain\
    \ attitudes associated with domestic workers, particularly \n\ndeference and agreeability,\
    \ in order to keep an employer happy” (2016b, 11).\n\n \n\n19\\. Despite substantial\
    \ empirical evidence that some nonmigrants do not attempt or \n\ndesire to migrate,\
    \ due to their relatively stable or secure socioeconomic situations (e.g., Khoo\
    \ \n\net al. 2014, 15–19; 27–29; Massey et al. 2005), labor migrants in general\
    \ are still represented \n\nand perceived in international and national media\
    \ in Indonesia as more ambitious, more \n\nresourceful, skilled or capable than\
