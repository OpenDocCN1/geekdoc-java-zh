  md: "Faith\n\nWhen i asked a former migrant woman in Cilacap why people still migrate\
    \ \n\ndespite horror stories in the news, she said,\n\nThey migrate . . . for\
    \ economic reasons. But mostly it is *nasib*. Your nasib can \n\nchange, but it\
    \ is something personal. It depends on people themselves. . . . If \n\nyou get\
    \ a bad employer, you can find out how to change your situation. If not, \n\n\
    for those who are lazy or ignorant, they will get stuck in their situation. But\
    \ \n\nnasib to some extent is determined by God, of course. Or how do we explain\
    \ \n\nwhy some people land in much worse situations than others? It is a bit like\
    \ \n\nluck. . . . Good people can have bad nasib and the reverse is also true.\
    \ It depends \n\non how you handle your given life situation.\n\nNasib, or “fate,”\
    \ was a central element of how return migrants or nonmi-\n\ngrant residents explained\
    \ migrant tragedy or success. Typical responses included \n\nthat migrant success\
    \ or failure depends on fate, or that everyone has their own \n\nfate (*nasib-nasiban*).\
    \ Fate was not necessarily always used in a fatalistic sense. \n\nInstead, the\
    \ meaning of nasib in relation to human agency and uncertainty shifted \n\nin\
    \ context, along a spectrum that emphasized both “human effort” (*usaha*) and\
    \ \n\nGod’s “will” or “destiny” (*takdir*). Nasib discourse was also salient among\
    \ migrant \n\nactivists, mainstream journalists writing in Indonesian and in English\
    \ (who use \n\nthe term “fate”), as well as state authorities.\n\nThrough discourses\
    \ of fate and destiny, migrants and their families can \n\nsometimes temporarily\
    \ or contextually be absolved of blame and responsibil-\n\nity for their “shameful”\
    \ actions. Furthermore, human responsibility can also \n\nbe displaced and reconfigured\
    \ by acknowledging the role of divine agency in \n\nhuman strivings (Liebelt 2008;\
    \ Pingol 2008). In a conversation with Nurul and \n\nBu Musliah, two former migrant\
    \ women, I asked, “What does nasib depend \n\non \\[*tergantung apa*\\]?” The\
    \ following discussion ensued.\n\nBu Musliah: \\[Fate depends on\\] God, but also\
    \ our own selves \\[*kita sendiri*\\].\n\nC: Can we change our nasib?\n\nNurul:\
    \ Yes, if we make an effort \\[*berusaha*\\], we can change what God has given\
    \ \n\nto us. For example, God gives us our destiny \\[takdir\\]. This is the first\
    \ level. \n\nBut we can, with effort, get to higher levels . . . have better lives\
    \ than what \n\nwe are given.\n\n5"
