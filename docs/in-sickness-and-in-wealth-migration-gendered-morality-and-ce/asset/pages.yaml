    \ as transgressive persons or the state as an entity, in \n\norder to influence\
    \ politicians’ decisions on other issues of gender and sexuality, \n\nsuch as\
    \ pornography (Hoestery 2013; Weintraub 2008).\n\nWhile state policies and discourses\
    \ may have practical and affective impact \n\non the everyday and structural organization\
    \ of gender and sexuality in Indonesia, \n\nI build on the work of scholars who\
    \ argue that malu also works “through subal-\n\ntern networks of village biopower,\
    \ effectively regulating behaviour” (Davies 2014, \n\n47). Shame may pressure\
    \ or coerce individuals into conforming to gender and \n\nsocial norms, but it\
