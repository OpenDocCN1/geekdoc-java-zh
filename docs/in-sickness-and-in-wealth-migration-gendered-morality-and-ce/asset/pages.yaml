  md: "*Introduction | 3 *\n\nDespite the widespread sensational news of migrant abuses,\
    \ sicknesses, and \n\ndeaths in destination countries of Southeast Asia and the\
    \ Middle East, hundreds \n\nof thousands of Indonesians continue to migrate annually\
    \ for work abroad.2 Why \n\ndo they continue to embark on expensive and uncertain\
    \ journeys, to take on \n\nprecarious jobs? What kinds of comparative risks or\
    \ value are there in staying in \n\nthe village or working in nearby cities? Although\
    \ Sita’s young cousin remarked \n\nthat her fellow villagers are “only talking\
    \ about money,” I argue that money and \n\nmigration are valued in moral terms,\
    \ shaped by local discourses and attitudes \n\ntowards gender and sexuality, local\
    \ customary laws (*adat*), and Islam. Indeed, \n\nhow money—specifically money\
    \ earned by migrants abroad—is talked about \n\nilluminates essential moral dilemmas\
    \ and landscapes that characterize the every-\n\nday lives and aspirations of\
    \ many residents of migrant-origin villages, partly due \n\nto the tension for\
    \ money to be both “an instrument of individual desire,” and “an \n\ninstrument\
    \ of collective dependency” (Narotzky and Besnier 2014, 9; see also \n\nZelizer\
    \ 2000).\n\nResidents, particularly women, are often caught between competing\
    \ desires \n\nand embodied expectations that appear incommensurable, such as migrating\
    \ to \n\nfinancially provide for children, parents, and spouses, or staying to\
    \ physically \n\ntake care of these same family members. This individual moral\
    \ dilemma is com-\n\nplicated by the elusive nature of human intentions and desires,\
    \ which provoke \n\nothers’ moral judgments or discussions about specific individuals’\
    \ “true” selfish, \n\naltruistic, or socially acceptable motivations behind migrating\
    \ or staying. Moral \n\njudgments and reputation matter to persons deciding whether\
    \ to migrate, stay, \n\nor return, in a context of relatively profound social\
    \ interdependence, in which the \n\nhelp, goodwill, and trust of neighbors and\
    \ fellow villagers are central not only in \n\ntimes of need, but also integral\
    \ to one’s sense of social and self-worth.\n\nWhile researchers and journalists\
    \ have examined and described the experi-\n\nences of migrants in countries where\
    \ they work and live, less is known about \n\nhow residents of migrant-origin\
    \ locales perceive and experience migration. \n\nMigration is still largely understood\
    \ in popular and scholarly discourses from \n\nthe perspectives of those who move,\
    \ or in broad structural terms such as poverty \n\nand unemployment. In contrast,\
    \ this book traces the diverse and surprising ways \n\nthat migrant-origin villagers\
