    \ parents and spouses, afford siblings’ or \n\nchildren’s education, buy prestige\
    \ goods, and build concrete houses to boost their \n\nfamily’s social status.\
    \ In focusing on shame and migrant failures in this chapter, \n\nI do not mean\
    \ to suggest that most Central Javanese are against the migration of \n\nwomen\
    \ and supportive of the migration of men, as is the case in countries where \n\
    \nmale migration is the norm (Bylander 2015; Rao 2014). On the contrary, women\
    \ \n\nmake up the majority of migrants from my field sites, and parents, husbands,\
    \ and \n\neven some children, encourage women to migrate.\n\nVillagers’ talk about\
    \ migration appears inconsistent because their expressed \n\nviews and responses\
    \ to migratory outcomes or practices are highly contextual. \n\nRather than simply\
    \ being “for” or “against” the migration of women and men, \n\ncirculations and\
    \ cultivations of shame respectively urge and constitute certain \n\nprecautionary\
    \ measures or behaviors which aim to avoid failing at migratory \n\nprojects or\
    \ return as failures. Looking at the production, mobilization, and nego-\n\ntiation\
    \ of shame thus provides alternative viewpoints to how return migrants \n\nand\
    \ others perceive, evaluate, and respond to migration-associated risks.\n\nAttention\
    \ to the various ways migrants, neighbors, and relatives negotiate \n\nshame and\
    \ its risk sheds light on seemingly irrational or ignorant migrant deci-\n\nsions\
    \ and practices, such as moving from documented to undocumented work or \n\nvisa\
    \ status, agreeing to disproportionately large amounts of debt, cutting off contact\
    \ \n\nwith family in Indonesia, or committing extreme acts of violence. These\
    \ seemingly \n\nirrational acts make sense when considering migrants’ temporal\
    \ and often hopeful \n\norientation to the future, in relation to the precariousness\
    \ of the present. Tracing \n\nthe mobilization and cultivation of shame in migrant-origin\
    \ villages illuminates \n\nvillagers’ everyday practices of “getting by” and “moving\
    \ on,” amidst these “pulls” \n\nof transnationalized futures, or in response to\
    \ lost futures and plans. In these ways, \n\nvillagers’ mobilizations and cultivations\
    \ of shame play a key role in shaping how, \n\nwhere, and when individuals produce,\
    \ circulate, and value their labor and money.\n\nNotes\n\n \n\n1\\. The video\
