    \ doctrine and law. In Indonesia, this is \n\nusually represented by MUI, a body\
    \ comprised of the majority of Indonesian \n\nMuslim groups with various approaches\
    \ to Islam.\n\nNGO non-governmental organization\n\nSBMI (*Serikat Buruh Migran\
    \ Indonesia*) National Migrant Labor Union of \n\nIndonesia\n\nPPTKIS (*Perusahaan\
    \ Penempatan Tenaga Kerja Indonesia Swasta*) Privatized/\n\nCommercial Agency\
    \ for the Placement of Indonesian Migrant Workers. Besides \n\nplacing workers\
    \ in jobs abroad, PPTKIS is also typically involved in recruiting \n\nand training\
    \ migrants prior to their departure.\n\nPRT (*Pekerja/Pembantu Rumah Tangga*)\
    \ Domestic Worker/Helper\n\nTKI (*Tenaga Kerja Indonesia*) Indonesian Migrant\
