  md: "*178 | In Sickness and In Wealth*\n\nAssumptions about the agency, intentions,\
    \ or knowledge of prospective \n\nmigrants and their fellow villagers significantly\
    \ impact how policymakers, \n\ndevelopment workers, migrant activists, recruitment\
    \ agents, and state rep-\n\nresentatives approach migration as a problem or solution\
    \ to issues of rural \n\nunemployment, education, poverty, health, and gender\
    \ equality. Scholarship \n\nand discussions about migration that examine or assume\
    \ moral or economic \n\nrationality behind human behavior do not provide holistic\
    \ accounts of the ways \n\nthat ideas about the “moral” is gendered, organized,\
    \ and mediated through \n\nsituated forms of communication and exchange (see Mattingly\
    \ 2014). Indeed, \n\nhow migrant money is perceived to be earned and used produces\
    \ its value and \n\nmeaning partially through village talk. In addition to the\
    \ role of national and \n\ninternational media, this book has shown how gendered\
    \ moral economies of \n\nmigration are constituted and sustained through seemingly\
    \ mundane everyday \n\nvillage talk about migrant success and failure: their money,\
    \ houses, sickness, \n\nand deaths.\n\nAlthough longer term research is required\
    \ to elucidate the fine and fragile \n\nsocial dynamics and bonds of villagers\
    \ of Cilacap and Yogyakarta, migrant-\n\norigin villagers’ (variously positioned)\
    \ moral judgments of migrants and \n\nmigration can also be read as ethical and\
    \ practical responses to the moral and \n\nexistential anxieties regarding the\
    \ inherent risks and arbitrary nature of the \n\nmigration process. Villagers’\
    \ circulation of stories of failure and shame can \n\nserve as cautionary tales\
    \ to prospective and current migrants, by explaining \n\nmigration’s many known\
    \ risks. As partial criticisms of the debts and moral \n\nand mortal risks of\
    \ migration, stories of migrant failure and shame are used \n\nby some villagers\
    \ to justify and validate their desires and decisions to stay \n\namidst social\
    \ pressures to migrate. At the same time, discourses of shame exert \n\nimmense\
    \ pressures on those who leave to put in the “proper effort” and faith to \n\n\
    return with “good fates.”\n\nSurprisingly, even though the Indonesian state strongly\
    \ promotes and \n\nfacilitates migration, partially through regulating and licensing\
    \ commercial \n\nrecruitment and insurance agencies, migrant-origin villagers\
    \ seldom held the \n\nstate accountable or responsible for migrants’ risky journeys.\
    \ With the excep-\n\ntion of cases where mass media and NGOs intervened, state\
    \ institutions were \n\nseldom considered by the Cilacap and Yogyakarta villagers\
    \ as viable options \n\nfor migration-related problem resolution or compensation.\
    \ Apart from a few \n\noutstanding examples that I am aware of in Wonosobo and\
    \ East Java, there is \n\na notable paucity of village-level political action\
    \ or grassroots organization in \n\nmigrant-origin villages around migration-related\
    \ issues.2\n\nThis does not point to a general political indifference in Cilacap\
    \ and \n\nYogyakata: there were organized protests against foreign corporations\
    \ and their \n\nforeign workers in Cilacap city during my main fieldwork period.\
    \ In the same"
