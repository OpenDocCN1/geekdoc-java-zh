    \ in another, over a year). Although scholars have \n\nemphasized that Indonesian\
    \ recruitment agents often depend on their social and \n\nmoral reputations for\
    \ business (Lindquist 2010; Rudnyckyj 2004; Spaan 1994), \n\nI found that operating\
    \ recruiters in Cilacap and Yogyakarta typically had terrible \n\nmoral reputations—as\
    \ liars and thieves—based on their track records with fellow \n\nvillagers who\
    \ migrated. Despite bad track records, including providing little infor-\n\nmation\
    \ about the circumstances of migrant relatives’ disappearances or deaths \n\n\
    abroad, residents still approached these recruitment agents for help to migrate.\n\
    \nWhat accounts for the apparent collective political inaction of villagers, in\
    \ \n\nthe context of evident mortal, social, and economic costs of migration on\
    \ families \n\nand villagers? This situation is in stark opposition to widespread\
    \ labor activism \n\nparticularly in Java, in the 1980s and 1990s, when workers\
    \ generally organized \n\nalong the lines of occupation and gender (Silvey 2003a;\
    \ Tjandraningsih 2000). \n\nI disagree with the view that villagers’ beliefs in\
    \ destiny simply point to their pas-\n\nsive resignation to existing socioeconomic\
    \ and political disorders. Instead, as I \n\nhave argued in previous chapters,\
    \ villagers’ discourses of destiny and fate should \n\nbe contextualized in terms\
