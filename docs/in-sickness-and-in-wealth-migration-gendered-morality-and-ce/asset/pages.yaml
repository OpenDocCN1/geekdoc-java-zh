  md: "*Shame | 91 *\n\nabout masculinity to defend and restore shame violations relating\
    \ to sexuality” \n\n(2014, 35). Pam Nilan, Argyo Demartoto, and Alex Broom argue\
    \ that “compen-\n\nsatory aggressive behaviour” of Indonesian men is shaped historically\
    \ by fac-\n\ntors including the “residual effects of 300 years of Dutch colonization,\
    \ resistance \n\nagainst the Japanese invasion, the subsequent war against the\
    \ Dutch for inde-\n\npendence, and the late twentieth-century struggle for democracy”\
    \ (2013, 5). In \n\nother words, while malu or the threat of malu may provoke\
    \ women to preserve \n\ntheir honor, these may provoke men instead to perform\
    \ in ways that restore their \n\nhonor and sense of masculinity.\n\nThe gendered\
    \ associations of malu as positive and necessary are significant \n\nin maintaining\
    \ social and political hierarchies in Indonesia in relation to class \n\nand national\
    \ identity (Collins and Bahar 2000; Wieringa 2003; Wichelen 2010). \n\nRecent\
    \ analyses of malu describe how individuals may experience it in relation \n\n\
    to particular gendered national values and expectations, or threats to perceived\
    \ \n\nnational values (Munro 2015, 169). For example, the malu that men experience\
    \ in \n\nrelation to their failures to live up to breadwinner roles can be related\
    \ to late New \n\nOrder state discourses for Indonesian men to be “‘strong males’\
    \ as an expression \n\nof national character,” as fathers, husbands, and providers\
    \ (Nilan et al. 2013, 6). \n\nSimilarly, the New Order state explicitly built\
    \ on Islamic discourses of kodrat to \n\narticulate women, nationalism, and development\
    \ in terms of women’s primar-\n\nily domestic roles. This idealized notion of\
    \ femininity that naturalized women \n\nas “devoted to the maintenance of a stable,\
    \ nurturing, domestic environment \n\nwere central to the state’s vision of an\
    \ orderly and morally controlled nation” \n\n(Silvey 2004, 252; Wichelen 2010).\
    \ These ideologies were produced and reinforced \n\nin institutions established\
    \ by the New Order state that still exist today, in which \n\nthe family is taken\
    \ as a metaphor for the nation.3 In the post–New Order era, \n\nthese gendered\
    \ ideas about the family were “deployed by nationalist and \\[liberal\\] \n\n\
    feminist, as well as Muslim and Islamist groups” for their own respective politi-\n\
    \ncal ends (Wichelen 2010, 111).\n\nIn other words, Indonesian citizenship is\
    \ communitarian and explicitly \n\ngendered and heteronormative. Thus scholars\
