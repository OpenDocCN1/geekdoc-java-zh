  md: "*140 | In Sickness and In Wealth*\n\nVillagers’ acknowledgement of a complex\
    \ migration infrastructure is \n\nevident in stories of death that are recounted\
    \ simply to remind others that even \n\nthe best laid plans fail. Such tragic\
    \ stories of sickness and death partly serve to \n\nremind migrant-origin villagers\
    \ and migrants that they have limited control \n\nover the outcomes of their efforts,\
    \ and ultimately God is in control of a migrant \n\nworker’s destiny to succeed\
    \ or fail, live or die. One such story with no clear moral \n\ntakeaway was the\
    \ following, told to me by a Yogyakarta nonmigrant, about her \n\nmigrant neighbor.\n\
    \nA migrant domestic worker in Saudi Arabia regularly sent money home \n\nfor\
    \ her only child, a son, to get a good education. Her son graduated from high\
    \ \n\nschool with above average grades. Pleased, his migrant mother sent even\
    \ more \n\nmoney for him to buy a motorbike when he turned eighteen. Unfortunately,\
    \ a \n\nfew days before she returned for Idul Fitri holidays, her son got into\
    \ a road acci-\n\ndent and died instantly. To this resident, the migrant had failed\
    \ in her migratory \n\nproject because she had lost her son—the reason for which\
    \ she migrated in the \n\nfirst place.6 The story was made more tragic by the\
    \ fact that this migrant had \n\nbought the motorbike for her son with her remittances,\
    \ which ultimately led \n\nhim to his death.\n\nIt may be that most villagers\
    \ accept deaths because they believe that no \n\naction can bring the dead back\
    \ to life. Yet, attributing death to destiny may also \n\nbe a way that villagers\
    \ negotiate the uncertainties of migration, through empha-\n\nsizing individual\
    \ strategies of self-discipline, and highlighting the limits of \n\nhuman agency\
    \ to cope with and avoid certain risks. Of course, some residents do \n\nacknowledge\
    \ the responsibility of and place blame on the Indonesian and foreign \n\nstates\
    \ for perpetuating these precarious labor migrations, particularly former \n\n\
    migrants, failed migrants, and individuals involved previously or currently with\
    \ \n\nthe political and social activism of NGOs. Nonetheless, as noted in chapter\
    \ 3, for-\n\nmer migrants who have had sustained interactions and experiences\
    \ with NGOs \n\nare also often those who qualify as “failed” migrants who encountered\
    \ NGOs \n\ndue to circumstances in which they needed assistance regarding their\
    \ (un)docu-\n\nmented status or working conditions. As such, such persons may\
    \ withdraw from \n\nexplicitly defending other “failed” migrants in political\
