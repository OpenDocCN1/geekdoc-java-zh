  md: "Contesting the Terms of Belonging: \n\nViews of/from Elsewhere\n\n“I worked\
    \ hard for this family, for the children. . . . I’ve never asked for anything\
    \ \n\nelse. All I want is a divorce.”\n\n— Overheard, Anisa, a migrant woman in\
    \ her late 30s who recently \n\nreturned from Taiwan, shouting at her husband,\
    \ Cilacap.\n\n“Before I left \\[Taiwan\\], we \\[my employers and I\\] cried and\
    \ cried. They understood \n\nI had to leave because I have family too in Indonesia.\
    \ . . . Why did it have to be like \n\nthis? It was like we were fated to be,\
    \ you know, *yuan fen*, and it was so sad that we \n\nhad to part. . . .1 I was\
    \ really at home there. They took me as part of the family.”\n\n— Titin, a migrant\
    \ woman in her late 30s who recently returned from \n\nTaiwan, Yogyakarta.\n\n\
    “I just want to see the world. . . . I think I’m just really bored here, there’s\
    \ \n\nnothing to do.”\n\n— Indah, a prospective migrant woman in her mid 20s who\
    \ tried and \n\nfailed to migrate, Cilacap.\n\nMigration may create new differences\
    \ and exacerbate existing ones, not \n\nonly in terms of material wealth, but\
    \ also diverging gendered behavior and \n\nrelated moral-religious perspectives.\
    \ In the preceding chapters, I have suggested \n\nways that migrant-origin villagers\
    \ were aware—to varying degrees—of the \n\nworking and living conditions of migrants\
    \ abroad. This chapter explores the vil-\n\nlagers’ views of foreign places and\
    \ the threats they pose. Cilacap and Yogyakarta \n\nresidents do not only attribute\
    \ blame or responsibility for migrants’ successes \n\nor failures to divine agency,\
    \ recruitment agencies, or migrants themselves. They \n\nalso locate such blame\
    \ or responsibility in foreign employers and foreign coun-\n\ntries, which is\
    \ evident through their representations and discussions of “foreign” \n\ngender\
    \ and sexual practices. Such talk often encodes knowledge about different \n\n\
    immigration and labor regulations abroad, which villagers may attribute to for-\n\
    \neign “cultural” norms. Discussions among former migrants and nonmigrants \n\n\
    about foreign gender and sexual norms may challenge, reaffirm, or destabilize\
    \ \n\nideas about what kinds of gendered relations are locally acceptable, such\
    \ as \n\ndivorce and premarital cohabitation.\n\n6"
