  md: "*66 | In Sickness and In Wealth*\n\nThis increasing emphasis on migrants’ need\
    \ for capital and savings coincides \n\nwith the time period (2012–2013) when\
    \ the Indonesian state started to explic-\n\nitly draw on international migration-for-development\
    \ discourses to talk about \n\nmigrant remittances. During this time, institutions\
    \ such as USAid (U.S. gov-\n\nernment), AusAID (Australian government), and the\
    \ International Monetary \n\nFund (IMF) actively implemented and encouraged entrepreneurship\
    \ programs \n\nin Indonesia as a pathway to sustainable development (Kevin 2012;\
    \ Koo 2013; \n\nLagarde 2015; May 2012; University of Sydney Business School 2015).\
    \ I mention \n\nthese to suggest that villagers’ temporally oriented perceptions\
    \ about the ideal \n\nsituation of return migrants, or ideal motivations and aims\
    \ for prospective or \n\ncurrent migrants, were likely influenced by these state\
    \ and international dis-\n\ncourses and projects of migration and development.\n\
