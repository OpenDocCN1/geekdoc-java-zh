    \ and unevenly enforced in \n\nCentral Java. Thousands of Central Javanese Muslim\
    \ women not only continue to \n\nmigrate annually, but are also, in many cases,\
    \ publicly and privately encouraged \n\nand praised for doing so.\n\nTransnational\
    \ gendered labor migration from Indonesia is thus shaped \n\nand encouraged through\
    \ changing ideas about gendered and moral duties to \n\nthe family and nation,\
    \ in terms of the economic and spiritual development of \n\nthe individual and\
    \ the nation. State endorsement and placement of migrants, \n\nalongside the relative\
    \ lack of effective mechanisms of protection and redress for \n\nmigrants abroad\
    \ (see next chapter), must be contextualized within Indonesia’s \n\nweaker economic\
    \ and political bargaining position vis-à-vis migrant destina-\n\ntion countries\
    \ (Silvey 2004), and rivalry between state institutions in charge of \n\nmigration\
    \ (Palmer 2016). Although transnational labor migration is regulated by \n\nthe\
    \ state, it is largely carried out by a diverse range of commercial recruitment,\
    \ \n\ntraining, and travel agencies. A complex and dense network of commercial,\
    \ state-\n\nlicensed recruitment agencies, informal recruitment agents and fieldworkers,\
    \ \n\nNGOs, and migrant labor activists (Lindquist 2010; Lindquist, Xiang, and\
    \ Yeoh \n\n2012; Rudnyckyj 2004) also draw on the state’s discourses about migration,\
    \ devel-\n\nopment, and nationhood to criticize the industry or to justify their\
    \ respective \n\nroles within the migration infrastructure."
