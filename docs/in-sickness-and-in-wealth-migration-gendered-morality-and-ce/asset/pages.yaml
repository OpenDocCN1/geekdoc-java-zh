    \ \n\nand mobility of villagers; it conditions their decisions to stay, migrate,\
    \ or return. \n\nNarratives and circulations of shame reflect and respond to migration-related\
    \ as \n\nwell as broader socioeconomic anxieties in migrant-sending communities.\n\
    \nMalu\n\nMalu, an Indonesian word with Malay origins, is commonly translated\
    \ into the \n\nEnglish term “shame.” In Indonesia, “to be accused of having no\
