  md: "*Evaluating Migrant Success and Failure | 79 *\n\nwere important elements of\
    \ Hazam and Desi’s experiences as former migrants \n\n(Silvey 2007a). Even if\
    \ they never actually boarded a plane, or passed through \n\nimmigration, the\
    \ airport is a space most nonmigrant kin and neighbors would \n\nhave seldom inhabited.\
    \ At the time of my research, obtaining or applying for a \n\npassport or identity\
    \ documents such as the Overseas Worker Card (KTKLN) was \n\nalso part of being\
    \ formally identified and identifying as a migrant, even if the \n\ndocuments\
    \ were never used (Killias 2010; Lindquist 2010; 2012). Finally, before \n\npeople\
    \ left home for the center or airport, it was customary to bid a formal fare-\n\
    \nwell to their neighbors and relatives. Villagers usually wished them safe jour-\n\
    \nneys and expected them to return only upon finishing their contracts overseas\
    \ \n\n(Allerton 2013, chapter 6). Thus when Hazam and Desi returned home, they\
    \ were \n\nreceived as former migrants—people who had already embarked on their\
    \ jour-\n\nneys abroad, whether or not they had actually left the country.\n\n\
    The sites, processes, and networks that facilitate transnational journeys and\
    \ \n\nthat determine how migrants are documented, the nature of their work, and\
    \ to \n\nwhich destination country they are sent, can also simultaneously lead\
    \ or discour-\n\nage others from eventual migration or returning home. In the\
    \ cases of Hazam \n\nand Desi, social networks such as the ties of friends and\
    \ families to migrant bro-\n\nkers or representations of life abroad played an\
    \ important part in shaping their \n\ndecisions and attitudes—including uncertainty,\
    \ curiosity, and a sense of adven-\n\nture (Bélanger and Wang 2013; Lindquist\
    \ 2012; Spaan 1994; Stoll 2013). The com-\n\nmercial agents who facilitated the\
    \ predeparture processes (and negotiated the \n\nregulatory mechanisms) whereby\
    \ women like Desi are moved to and confined in \n\ntraining centers (Lindquist\
    \ et al. 2012) are a powerful factor. The eventual non-\n\ndeparture of prospective\
    \ migrants can also be provoked by restrictions to their \n\nmovement, agency,\
    \ and communications in the training centers or by actual acts \n\nof prevention—for\
    \ example, when Hazam’s agent ran away or when the police \n\nsent Desi home.\
    \ Women’s departures or escapes from the training centers are \n\nusually facilitated—as\
    \ in the case of Desi—by the intervention or advice of fam-\n\nily members (see\
    \ also Chan 2017b; Lindquist 2010). Desi’s return to her home-\n\nvillage marked\
    \ her departure from the path of achieving migration, and thus her \n\ntransition\
    \ to being a former migrant who failed. The new and ambiguous social \n\nidentities\
    \ of such former migrants are often accompanied by actual shifts in their \n\n\
    mobility or immobility. These can occur through fear of running into recruit-\n\
    \nment agents (to whom they might owe money), debt or the loss of nearly all their\
    \ \n\nsavings, and/or the absence of the national identity documents needed to\
    \ obtain \n\njobs in cities or to buy a vehicle.\n\nIn these ways, it becomes\
    \ clear that the migration infrastructure not only \n\nfacilitates mobility but\
    \ also shapes “non-cases of mobility, those . . . stopped before \n\nthey start”\
    \ (Salter 2013, 10). Those who fall between migrant categories often expe-\n\n\
    rience deep ambivalence about what to do after their failed migration attempts."
