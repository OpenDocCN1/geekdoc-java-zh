    \ language test thrice (Singh 2012). The \n\nnews report suggested that she did\
    \ so because she faced substantial debt upon \n\nher likely return to Indonesia.\
    \ Given that she had “reportedly borrowed seven \n\nmillion rupiah from relatives\
    \ to work” in Singapore, it was likely that her return \n\nwould disappoint many\
    \ in her home village.\n\nIn short, these acts of violence to self or others are\
    \ responses to extreme dis-\n\ntress, when individuals experience the limits of\
    \ their abilities to respond to their \n\nmultiple obligations and circumstances.\
    \ These acts expose individuals’ inabilities \n\nto imagine possible futures,\
    \ and ways to live in dignity.\n\nShame Mediating Mobilities\n\nMigrant-origin\
    \ villagers’ experiences and practices of shame reveal the multiple \n\nsources\
    \ of shared anxieties and uncertainties, whether or not they choose to \n\nmigrate,\
    \ return, or stay. While migrants are often blamed for their own failures, \n\n\
    their kin and neighbors can also be blamed or associated with migration-related\
    \ \n\nshame. Migrants also participate in shaming and blaming others, sometimes\
    \ in \n\nan effort to redirect speculative gossip and attention away from their\
    \ own migra-\n\ntory experiences. Shame is highly gendered, intimately linked\
    \ to and produced \n\nby socioeconomic insecurity and opportunity. In a context\
    \ of normalized trans-\n\nnational labor migration, the circulation of shame in\
    \ discussions of migration \n\nin Central Javanese villages, however, is largely\
    \ directed at influencing women’s \n\nmobilities and motilities. Nevertheless,\
