  md: "iupress.indiana.edu\n\nVillagers in Indonesia hear a steady stream of stories\
    \ about the injuries, abuses, and even deaths \n\nsuffered by those who migrate\
    \ in search of work. So why do hundreds of thousands of Indonesian \n\nworkers\
    \ continue to migrate every year? Carol Chan explores this question from the perspective\
    \ of \n\nthe origin community and provides a fascinating look at how gender, faith,\
    \ and shame shape these \n\ndecisions to migrate. Villagers evaluate men’s and\
    \ women’s migrations differently, leading to different \n\nLGHDVDERXWZKLFKNLQGVRIKXPDQRUƓQDQFLDOŴRZVVKRXOGEHHQFRXUDJHGDQGZKLFKVKRXOGEH\n\
    \ndiscouraged or even criminalized. Despite routine and well-documented instances\
    \ of exploitation \n\nof Indonesian migrant workers, some villagers still emphasize\
    \ that a migrant’s success or failure \n\nultimately depends on that individual’s\
    \ morality, fate, and destiny. Indonesian villagers construct \n\nstrategies for\
    \ avoiding migration-related risks that are closely linked to faith and belief\
    \ in supernatural \n\nDJHQF\\\\7KHVHVWUDWHJLHVVKDSHWKHŴRZRIPLJUDWLRQIURPWKHFRXQWU\\\
    \\DQGKHOSWRHQVXUHWKHFRQWLQXHG\n\nFRQƓGHQFH,QGRQHVLDQSHRSOHKDYHLQPLJUDWLRQDVDQDFWRISURPLVHDQGKRSH\n\
    \n**Carol Chan** is a postdoctoral fellow with the Interdisciplinary Program for\
    \ Migration Studies (PRIEM) \n\nat Universidad Alberto Hurtado, Chile. \n\n“A\
    \ superbly rich ethnographic account of the social and moral worlds of Indonesian\
    \ \n\nmigrant women. . . . Indonesian women represent the largest group of migrant\
    \ \n\ndomestic workers globally yet they remain vastly understudied. This book\
    \ not only \n\nƓOOVWKLVPXFKQHHGHGHPSLULFDOJDSEXWLWWKHRUHWLFDOO\\\\HQULFKHVRXUXQGHUVWDQGLQJ\n\
    \nof gendered migration in its nuanced and multi-layered investigation of the\
    \ ways \n\nmorals inform and constrain the actions of Indonesian workers.”\n\n\
    —Rhacel Salazar Parreñas, author of *Servants of Globalization: Migration and\
    \ Domestic Work*\n\n“In this book, Carol Chan distills the moral core of migration.\
    \ . . . In her richly \n\ntextured ethnography, migrants, stayers, prospective\
    \ migrants, return migrants, \n\n‘failed’ migrants and their families, kin, friends,\
    \ neighbors, and community leaders \n\nemerge in quick succession as inextricably\
    \ linked, self-responsibilized participants—\n\ndrawn together by the entangled\
    \ threads of gendered moralities—as they partake in \n\nfashioning social worth\
    \ and recuperative futures.”\n\n—Brenda S. A. Yeoh, editor (with Gracia Liu-Farre)\
    \ of *Routledge Handbook of Asian Migrations*\n\nANTHROPOLOGY, ASIA, GLOBAL STUDIES\n\
    \n**Hilary E. Kahn and Deborah Piston-Hatlen, editors**"
