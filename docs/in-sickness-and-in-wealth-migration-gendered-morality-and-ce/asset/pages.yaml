    \ incompatible with Islam, I observed that some Cilacap villagers still subscribed\
    \ to \n\nmany Javanism-linked beliefs about spirits, and sometimes turned to local\
    \ men known to be \n\nknowledgeable about such affairs to advise them on matters\
    \ of “luck” and healing. Despite \n\nthe endurance of some such obviously syncretic\
    \ Javanese-Muslim practices, it was much \n\nmore common for residents to posit\
    \ a dichotomy between Muslims and Javanists."
