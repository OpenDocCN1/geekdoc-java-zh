  md: "*82 | In Sickness and In Wealth*\n\nless advantaged as compared to their migrant\
    \ counterparts.19 The liminal positions \n\nand dual subjectivities of those who\
    \ have failed to migrate illuminate the infra-\n\nstructural conditions that both\
    \ enable and constrain transnational mobilities.\n\nValuing Migrants and Money\n\
    \nResidents of migrant-origin villages define and talk about migrant success or\
    \ \n\nfailure in moral and temporal terms. Financial contributions of migrants\
    \ to their \n\nfamilies are only one potential indicator of success. Instead,\
    \ migrants’ gendered \n\nperformances and social positions give value and meaning\
    \ to their money and \n\ngifts. The gendered and moral nature of such evaluations\
    \ illuminates how local \n\nnarratives and standards of migrant failure and success\
    \ are mutually contrasting \n\nand complementary. Harsh gendered assessments of\
    \ migrant morality alongside \n\nhigh normative expectations for migrants to succeed\
    \ financially illuminate why \n\nresidents may often say that most migrants are\
    \ successful, yet some may also \n\nremark that “nobody is successful yet.”\n\n\
    Those considered to be failed migrants also experience shame in gendered \n\n\
    and temporal ways. In the next chapter, I elaborate on how migrants and their\
    \ \n\nkin experience and cope with gendered shame upon return to Indonesia or\
    \ their \n\nhome villages. Some such coping strategies have been highlighted through\
    \ the \n\nexamples of Hazam and Desi, persons who attempted to but failed to migrate.\
    \ To \n\navoid the teasing, shame, or stigma associated with failed migration,\
