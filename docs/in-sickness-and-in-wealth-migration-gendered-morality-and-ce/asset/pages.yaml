    \ recovered her belongings nor identity documents.\n\nMigration Infrastructure\
    \ and Migrant Subjectivities\n\nThe common categories of migrant and nonmigrant\
    \ are mutually exclusive in \n\nmigration studies, in which the crossing of national\
    \ borders importantly distin-\n\nguishes migrants from nonmigrants. However, as\
    \ the cases of Hazam and Desi \n\nreveal, in Central Java, in an important sense,\
    \ migratory journeys are perceived \n\nand experienced as beginning as soon as\
    \ someone decides to work abroad.16 \n\nThese people inhabit an ambiguous space\
    \ in between leaving and staying. They \n\nare (former) migrants because they\
    \ are perceived to have embarked on trans-\n\nnationally oriented journeys as\
    \ candidates who have applied to leave the coun-\n\ntry. These active (though\
    \ failed) attempts to migrate overseas differentiate them \n\nfrom other residents\
    \ or typical “nonmigrants” who never left the village, domes-\n\ntic (internal)\
    \ migrants, and others who decided to stay and never thought about \n\nmigrating\
    \ abroad. Yet, they are also nonmigrants, because even in their locally \n\nlegible\
    \ status as failed or former migrants, their experiences of the migration \n\n\
    processes are incomplete and distinct from persons who have worked and lived \n\
    \nin foreign countries.\n\nScholars have examined the forms of discipline and\
    \ governance that turn \n\nprospective migrants into productive and ideal workers\
    \ both prior to their jour-\n\nneys (Guevarra 2006; 2010; Hugo and Stahl 2004;\
    \ Rodriguez 2010; Rodriguez and \n\nSchwenken 2013; Rudnyckyj 2004) and in the\
    \ destination countries (Constable \n\n2007; Lan 2006). I argue, however, that\
    \ other factors also shape migrant sub-\n\njectivity. These include the ways in\
    \ which prospective migrants imagine and \n\nconstruct the spatial boundaries\
    \ of the village, the recruitment agent’s house \n\nor office, the training center,\
    \ and the airport as particular spaces “in-between” \n\nnational boundaries or\
    \ gateways to other countries. In Central Java, individuals \n\nwho identified\
    \ as former migrants tend to emphasize the migration application \n\nprocess (*daftar*)—paying\
    \ recruitment fees, preparing the relevant documents, \n\nundergoing medical tests,\
