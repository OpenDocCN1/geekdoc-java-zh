  md: "The Politics of Morality and Identity \n\nin Central Java\n\nComing from Singapore,\
    \ I was keenly aware of the moralizing and sexualizing \n\ndiscourses in the media\
    \ and everyday public discussions about Indonesian and \n\nFilipina migrant domestic\
    \ workers. These notions of the migrant woman (and \n\nethnic other) as a “seductress”\
    \ to be wary of, “abused victim” to be rescued, or \n\n“sacrificial mother” supporting\
    \ her own poor family and village are not unique \n\nto Singapore, but are also\
    \ present in diverse cultural and geographical con-\n\ntexts of migrant destination\
    \ countries. When I first arrived in Yogyakarta and \n\nCilacap, I was thus naively\
    \ surprised by how some of these stereotypes and tropes \n\nof Indonesian migrant\
    \ women were also circulated and reproduced not only in \n\nIndonesian national\
    \ media, but also among migrants’ own kin and neighbors. \n\nVery quickly, my\
    \ simplistic assumptions about grateful families as receivers of \n\nremittances\
    \ were replaced by a necessity and desire to navigate the nuanced \n\nmeanings,\
    \ differences, and effects of such moralizing tropes about migrants in \n\nmigrant-origin\
    \ villages.\n\nThis chapter introduces the three main migrant-origin villages\
    \ of Cilacap \n\nand Yogyakarta where the bulk of this research was conducted,\
    \ in addition to \n\nother participants and places comprising this work. To contextualize\
    \ the book’s \n\ndiscussion of gender and faith in Central Java, this chapter\
    \ also provides an over-\n\nview of the history and politics of morality and identity\
    \ in Indonesia. The cen-\n\ntrality of morality in contemporary Indonesian politics,\
    \ public discourse, and \n\nsocial life, is closely linked to struggles between\
    \ groups and leaders over defining \n\nvalues and identities linked to Islam,\
    \ gender, family, and the nation. The follow-\n\ning sections address the history\
    \ of migration in Indonesia, earlier ethnographies \n\nof Javanese gender and\
    \ family paradigms, and the ways in which political and \n\nreligious leaders\
    \ and organizations in Indonesia have cooperated and clashed \n\nin determining\
    \ and regulating moral discourse and behavior. Gender—which \n\nis closely tied\
    \ to conceptions of the “family” and familial responsibilities—often \n\ntakes\
    \ center stage in mediating the relationship between “religion” and “the \n\n\
    state.” Alongside industrialization and the feminization of domestic and trans-\n\
    \nnational migration, Indonesian women’s activities and mobilities emerge as a\
    \ key \n\nsite and topic of enduring institutional and public contestations over\
    \ morality, \n\nfamily roles, and ethnic, national, and religious identity.\n\n\
    1"
