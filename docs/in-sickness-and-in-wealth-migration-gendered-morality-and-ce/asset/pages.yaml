    \ of extreme cases in the public sphere \n\ntend to frame these cases of abuse\
    \ as exceptional, unintentionally supporting the \n\nIndonesian state’s official\
    \ stance that “success” is the likely achievable norm of \n\nthe pious and self-responsible\
    \ “good” migrant. In comparison, everyday forms of \n\nlabor exploitation—such\
    \ as long working hours, inadequate rest or food, poor living \n\nconditions,\
    \ and delays in wage payments—appear mundane, tolerable, and normal.\n\nWhen migrant\
    \ workers, activists, and scholars have called for greater state \n\naccountability\
    \ in the face of labor exploitation and abuse, these are usually framed \n\nin\
    \ terms of human, migrants’ and labor rights. However, scholars have pointed \n\
    \nout that “rights” discourses are not abstract, universal, or value-free (Choo\
    \ 2013; \n\nLai 2011). Instead, the politics of migrants’ and women’s activisms\
    \ are complex, \n\nand may contribute to reinforcing moral and gendered hierarchies\
    \ embedded in \n\nunderstandings of victimhood, exploitation, violence, and protection.\n\
    \nIndeed, global human rights discourse broadly engages with, critiques, and \n\
    \nreproduces the hero-victim dichotomy (Bernstein 2010; Brennan 2014; Kempadoo\
    \ \n\n2012), including discussions of Indonesia migration in terms of human traffick-\n\
    \ning (Ford 2002; Ford and Lyons 2012; Palmer 2012). These Indonesian images \n\
    \nand tropes of victimhood and heroism linked to migrants’ gendered morality \n\
    \nfind striking parallels in the case of the Philippines (Parreñas 2005; Pratt\
    \ 2012; \n\nRafael 1997; Rodriguez 2010). Elaborating on what makes a hero or\
    \ victim in the \n\ncontemporary Indonesian migration context, I present examples\
    \ below to argue \n\nthat discourses of victimhood are not simply contrasted with\
    \ those of “heroic” \n\nagency. The category “victim” is not a homogenous one\
