  md: "*Faith | 153 *\n\nsuperstition, I argue that villagers’ fate and faith narratives\
    \ enable them to act in \n\npragmatic and strategic ways.\n\nIn Central Java,\
    \ nasib or fate often implies human effort in relation to divine \n\nagency, while\
    \ takdir or destiny emphasizes the ultimate authority of God in \n\nhuman life\
    \ and strivings. The multiple and context-specific uses of these faith \n\nnarratives\
    \ can serve to overemphasize, suspend, or displace the role of indi-\n\nvidual’s\
    \ agency in their present life circumstances, with reference to nonhu-\n\nman\
    \ actors. On the one hand, acknowledging supernatural and divine agency \n\nencourages\
    \ a sense of resignation and fatality, particularly when individuals \n\nhave\
    \ already been possessed or are very ill. On the other hand, such recognition\
    \ \n\nof the limits of human agency mobilizes faith in the preventive or redemptive\
    \ \n\npower of Islamic (and to a lesser degree, Javanese) prayers, chants, and\
    \ rituals. \n\nLocal discussions of suicide and mental illness illustrate how\
    \ resignation and \n\nfaith-driven human efforts, blame and empathy, are not contradictory\
    \ but con-\n\nstitutive of one another.\n\nDespite the lack of explicit criticism\
    \ of the state and labor regimes, villag-\n\ners’ discussions of fate and destiny\
    \ are grounded in an awareness and acknowl-\n\nedgment of the complicity and partial\
    \ responsibility of employers, recruitment \n\nagents, and state institutions\
    \ when things go wrong for migrants. Instead of fully \n\narticulated critiques\
    \ of exploitation in class or feminist terms, villagers’ talk about \n\nfate,\
    \ destiny, and spirit possession are partial yet ultimately ineffective responses\
    \ \n\nto the state’s failure to guarantee villagers’ transnational security or\
    \ livelihoods \n\n(cf. Ong 2010). In the absence of alternative access to livelihoods,\
    \ fate and faith \n\ndiscourses are tactics to assert and defend one’s moral status\
    \ when migrants con-\n\nfront an exploitative, risky, yet potentially rewarding\
    \ migration landscape (ibid.). \n\nThe example of spirit possession, however,\
    \ is a clear example of how discourses of \n\nreligiously inflected moral discipline\
