  md: "*Mobilizing and Moralizing Indonesia | 57 *\n\nDede’s recruitment agent separately\
    \ informed her family that she was poisoned \n\n(*Solopos* 2012). In response\
    \ to the family’s request for an official explanation, \n\nBNP2TKI released a\
    \ report to confirm that Dede had died due to “drinking \n\norganic phosphoric\
    \ chemicals” (BNP2TKI 2012). Despite this detail, the report \n\nconcluded that\
    \ upon reexamination, the cause of death was “natural,” due to “a \n\ndecrease\
    \ in cardiac function in the respiratory tract.”\n\nMedical anthropologists argue\
    \ that diseases and illness are seldom simply \n\n“natural,” but also the result\
    \ of improper and irregular diets, and environmen-\n\ntal conditions that are\
    \ usually social and political (Hamdy 2008). Yet, state and \n\nmedia accounts\
    \ of these sicknesses may sometimes naturalize and uncritically \n\nframe these\
    \ cases as “bad luck” and “ill fate,” although some minority critical \n\nvoices\
    \ are calling for enforcing autopsies on all Indonesian bodies that died over-\n\
    \nseas (Knight 2013).\n\nDispersing Responsibility and Blame\n\nResponsibility\
    \ and blame for migrants’ problems are often dispersed by and \n\namong multiple\
    \ institutions and actors, often via moral discourses. The dis-\n\ncourses in\
    \ Indonesia linking gender, migration, and morality produce a double-\n\nedged\
    \ view of women as, on the one hand, highly individualistic and conscious \n\n\
    agents of their own fate; and on the other hand, highly vulnerable to worldly\
    \ \n\ntemptations and thus requiring protection and discipline. While these two\
    \ \n\napparently incompatible views of women as clever, rational, economic agents\
    \ and \n\novertly emotional, irrational beings has been traced by older ethnographies\
    \ of \n\ngender in Java (see chapter 1), the political, economic, and sociocultural\
    \ stakes of \n\nevoking both discourses by institutions on a national scale are\
    \ heightened in the \n\ncontext of feminized transnational migration. In this\
    \ contemporary manifesta-\n\ntion of the dual gender paradigm, migrants, particularly\
    \ women, bear the bulk of \n\nthe blame and burden of ensuring “successful” migration\
    \ outcomes, and endur-\n\ning the shame associated with failing such expectations.\n\
    \nIndonesian migrants, particularly domestic workers, are represented in \n\n\
    overlapping and intersecting ways by the Indonesian state, activists, and journal-\n\
    \nists. Whether (female) labor migration is represented by these actors as exploit-\n\
    \native or a positive economic force for families and the Indonesian nation depends\
    \ \n\non how they frame the role of and relationship among the Indonesian state,\
    \ the \n\nglobal market economy, and the gendered moral responsibility of the\
    \ Indonesian \n\ncitizen/worker. This chapter has argued that the precarious labor\
    \ migration \n\nof Indonesian women in particular is legitimated, tolerated, and\
    \ sustained by \n\nIndonesian policy-makers and the general public due to the\
    \ often overlooked \n\ngendered and moralistic aspects of dominant narratives\
    \ about migration and \n\ndevelopment in Indonesia. A gendered moral hierarchy\
    \ of heroes and victims"
