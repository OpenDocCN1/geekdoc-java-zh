    \ to Islam was deemed superficial, since they continued their previous religious\
    \ \n\npractices (Woodward 1996, 17). “Indonesian Islam” emerged as an object of\
    \ analysis after \n\nthe 1980s among scholars, as well as the apparent Islamicization\
    \ of Indonesia (Bowen 1993; \n\nHooker 2003; Varisco 2005). This is as opposed\
    \ to previous work (drawing on Geertz) which \n\ndenied various local ritual practices\
