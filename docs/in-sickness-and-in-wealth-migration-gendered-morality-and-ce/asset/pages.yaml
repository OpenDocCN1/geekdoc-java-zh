  md: "*20 | In Sickness and In Wealth*\n\nTraveling Between Sites: Villages, Fairs,\
    \ \n\nWorkshops, and NGO Offices\n\nMost of the data for this research are based\
    \ on participant observation and \n\n130 semi-structured interviews conducted\
    \ mainly in Java, Indonesia. A main \n\nresearch period between September 2014\
    \ and August 2015 was supplemented \n\nby shorter research trips in 2012, 2013,\
    \ and 2016.1 Most interviews and informal \n\nconversations were conducted in\
    \ Indonesian, with a minority in English (with \n\nactivists or former migrants\
    \ who spoke English) and partial Javanese. The bulk \n\nof ethnographic data for\
    \ this book is based on fieldwork conducted in three main \n\nmigrant-origin villages,\
    \ two located in Cilacap and one in Yogyakarta. All are \n\ngeographically based\
    \ in Central Java.2 In 2014, 21 percent of Indonesian docu-\n\nmented migrant\
    \ workers originated from the Province of Central Java, the sec-\n\nond largest\
    \ migrant-origin province nationwide (BNP2TKI 2015).\n\nI was first introduced\
    \ to Cilacap in 2012 when, while learning Bahasa \n\nIndonesia in Yogyakarta,\
    \ I met Sita, who was introduced at the beginning of this \n\nbook. Sita had lived\
    \ in the city of Yogyakarta for about five years by the time we \n\nmet, and she\
    \ shared my curiosity about why so many of her Cilacap neighbors \n\nand fellow\
    \ villagers migrated abroad, despite the many known risks. She invited \n\nme\
    \ to visit and stay with her family in Cilacap for a few days. With her help trans-\n\
    \nlating, due to my intermediate Indonesian and nonexistent understanding of the\
