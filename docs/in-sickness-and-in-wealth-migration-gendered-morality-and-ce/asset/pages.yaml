  md: "*58 | In Sickness and In Wealth*\n\nin these narratives renders invisible,\
    \ mundane, or irrelevant to policy-makers \n\nand public attention those who might\
    \ not be suffering as visibly or extremely as \n\nErwiana and other “innocent\
    \ victims,” but who are not yet successful enough \n\nto return to Indonesia as\
    \ “foreign exchange heroes.” Furthermore, these expec-\n\ntations for migrants\
    \ to succeed in being economic providers and good women \n\nand men mean that\
    \ migrants often represent themselves and their host coun-\n\ntries to their families\
    \ and communities of origin in positive terms, in which the \n\nhost countries\
    \ are safe, and the migrants are achieving relative social mobility \n\n(Kankonde\
    \ 2010). These pressures to represent migration in terms of success sus-\n\ntain\
    \ the development narratives, desires, and fantasies of their nonmigrant peers:\
    \ \n\nthat migration may remedy local struggles for livelihood and better futures.\n\
    \nWhether Erwiana’s case can lead to substantial changes in laws to enhance \n\
    \nmigrant workers’ welfare and political positions in their countries of origin\
    \ and \n\nwork depends on whether the outrage and grief over her suffering can\
    \ not only \n\neffectively highlight the global structural inequalities, but also\
    \ the culturally \n\nspecific gendered moral inequalities that contributed to\
    \ her plight. In her case, \n\nmigrant activists managed to provoke enough public\
    \ uproar that unprecedented \n\nattention was given to the case by state actors\
    \ in Hong Kong and Indonesia. The \n\nlimits of such outrage and attention may\
    \ lie in the fact that Erwiana fits repre-\n\nsentations of the “good” and innocent\
    \ victim, as a young, fresh-faced woman \n\nwhose experiences in Hong Kong reduced\
    \ her to an undernourished, barely \n\nwalking, heavily bruised body. Although\
    \ these are crucial moments of negotia-\n\ntion between states and migrant-centered\
    \ NGOs on a wide variety of issues, the \n\npotential for critique of broader\
    \ structural inequalities is limited by the pervasive \n\ndual and narrow visions\
    \ of migration as a tool for development, or migration as \n\na form of trafficking.\n\
    \nGendered moral assumptions underlying representations of violence against \n\
    \nmigrant workers have significant consequences for whether international or \n\
    \nstate policies and regulations further restrict mobility and choice for migrants,\
    \ \n\nor address cultural and structural conditions of migration and violence.\
    \ While \n\nstate institutions articulate a vision of women who can (and should)\
    \ be both good \n\nfamily members as well as migrants who live and work away from\
    \ their families, \n\nthe next chapters examine how migrants and migrant-origin\
    \ villagers struggle to \n\nreconcile women’s identities and responsibilities\
    \ as family members and migrant \n\nworkers. The following chapters will elaborate\
    \ on how the stigmatization and \n\npathologization of migrants deemed “immoral”\
    \ crucially affect their access to \n\nlocal social support networks upon return\
    \ to their hometowns, particularly for \n\nwomen. Nevertheless, overemphasizing\
    \ women as victims overlooks migrant \n\nmen’s experiences of gendered risks and\
    \ violence, such as the harsh working \n\nconditions of construction workers,\
    \ and the malnourishment and nonpayment \n\nof irregular migrants in the international\
    \ fishing industry (see Palmer 2017)."
