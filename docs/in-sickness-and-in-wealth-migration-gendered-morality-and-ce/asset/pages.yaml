    \ Indonesia’s history of secularism, democracy, and explicit state focus on women’s\
    \ rights \n\nand education.\n\n \n\n2\\. Certain grassroots migrant welfare organizations\
    \ have been effective both in \n\nfacilitating legal and economic redress for\
    \ return migrants who have experienced abuse or \n\nfraud, as well as in highlighting\
    \ migrant labor issues at the national level. I argue, however, \n\nthat these\
    \ are exceptional cases in which individual former migrants “brought home” \n\n\
    advocacy skills typically learned in Jakarta or from migrant-centered NGOs in\
    \ destination \n\ncountries. The vast majority of migrant-origin villages, however,\
    \ lack such access to local \n\ngrassroots organizations and NGOs and their discourses\
    \ of migrant and labor rights.\n\n \n\n3\\. The Indonesian government did not\
    \ fulfill its plan to ban the migration of all domestic \n\nworkers by 2017. “A\
