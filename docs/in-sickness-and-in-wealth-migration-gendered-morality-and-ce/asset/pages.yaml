    \ governs how people meet and part \n\n(Yang and Ho 1988).\n\n \n\n2\\. A recent\
    \ study conducted in a migrant-origin village in East Java describes similar \n\
    \naccounts of women wishing to migrate to escape domesticity temporarily, or simply\
    \ due to \n\ndesires to explore the world beyond familiar places (Khoo et al.\
    \ 2015, 17).\n\n \n\n3\\. On characterizations of Indonesian Islam as moderate,\
    \ see Halim 2015, Hefner 2000, \n\nand Woodward 1996.\n\n \n\n4\\. There were\
    \ very few stories or generalizations about Malaysia in terms of a “culture,”\
    \ \n\nperhaps due to the fact that Malaysia is very similar to Indonesia in terms\
    \ of some of the \n\ncountries’ ethnic and religious politics. Domestic workers\
    \ also often worked for Chinese \n\nemployers in Malaysia, and those who did work\
    \ for Malay employers in Malaysia or \n\nSingapore would comment more generally\
    \ on how they were strict. These complaints were \n\nthus less about characterizing\
    \ the Malays as a cultural group than simply noting that these \n\nemployers were\
    \ fussy and particular. While there were certainly women who worked for \n\nCaucasian\
    \ employers in these countries (Singapore, Malaysia, Taiwan, Hong Kong, UAE) \n\
    \nwho come from the North America, Europe, or Australia, these were in the minority.\
    \ I \n\nnoticed that although two women had unpleasant experiences and relationships\
    \ with their \n\nCaucasian female employers, they nevertheless did not broadly\
    \ stereotype “Westerners” \n\nnegatively, but rather, continued to reproduce the\
    \ common idea among migrant domestic \n\nworkers that working and living conditions\
    \ would be good and better with Caucasian \n\nemployers as compared to employers\
    \ of other ethno-cultural backgrounds. \n\n \n\n5\\. The responses of individuals\
    \ to migrants’ transgressions importantly depend on the \n\nrelationships between\
