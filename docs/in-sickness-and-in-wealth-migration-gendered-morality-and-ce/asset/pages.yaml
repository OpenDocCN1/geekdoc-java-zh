    \ of politics, reli-\n\ngion, and gender in Indonesia broadly and Java in particular.\
    \ Migration, women’s \n\nmigration, and Islam are not new phenomena in Indonesia.\
    \ Yet, the twenty-first \n\ncentury has seen the institutionalization of Islam\
