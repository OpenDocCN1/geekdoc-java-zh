  md: "*Contesting the Terms of Belonging | 157 *\n\nThrough such work of imagining\
    \ the self in relation to others, migration \n\npresents wider alternative venues\
    \ and possibilities—liberating, dangerous, or \n\nambivalent—of how villagers\
    \ experience and understand gender identity and \n\nrelations, the world, and\
    \ their place in it. Feminist and queer migration schol-\n\narship has looked\
    \ at the ways in which migration has enabled women and \n\ngender-queers to achieve,\
    \ contest, or escape heteronormative expectations in \n\ntheir places of origin\
    \ (Luibhéid 2004; Mahler and Pessar 2006; Manalasan 2003). \n\nEthnographers have\
    \ looked at the ambivalence migrants feel prior to returning to \n\ntheir home\
    \ countries and families (Cheng 2010; Constable 1999; Lai 2011; Margold \n\n1995),\
    \ and diasporic processes of “making home” elsewhere (Fortier et al. 2003; \n\n\
    Schiller et al. 1995). While some migrants may return with a sense of relative\
    \ \n\npride and prestige (Thai 2014), others may feel a sense of cultural alienation\
    \ upon \n\nreturn, where, by contrast, their hometowns may seem shamefully underdevel-\n\
    \noped (McKay 2005). Indeed, the migration of some Cilacap and Yogyakarta vil-\n\
    \nlagers has not only shaped the subjectivities of migrants in relation to home\
    \ and \n\nfamily, but their mobilities have also influenced the subjectivities\
    \ and anxieties \n\nof their kin and neighbors who have never left the country.\n\
    \nThrough villagers’ idioms of restlessness (*bosan, tidak betah*), desires for\
    \ \n\nelsewhere (*ingin pergi, merantau*), feeling “at home” (*betah, kerasan*)\
    \ or not, \n\nthis chapter points to how migration to other Islamic and non-Islamic\
    \ coun-\n\ntries presents subtle but significant challenges to local gendered\
    \ expectations, \n\nmoralities, and kinship. Narratives of “home” and “belonging”\
    \ in terms of \n\nidentity—Javanese, Indonesian, Muslim—are often attempts to\
    \ either chal-\n\nlenge or domesticate the boundaries of ethnicity, citizenship,\
    \ kinship, gender, \n\nsexuality, and moral communities. What constitutes households\
    \ and families is \n\nnever a given, nor are they necessarily harmonious. Being\
    \ “part of the family”—\n\nwhether at “home” or “away”—is typically fraught with\
    \ power hierarchies and \n\ntensions (Bapat 2014; Ehrenreich and Hoschschild 2004;\
    \ Lai 2010; 2011; Paul \n\n2015; Wolf 1992). In addressing cases of migrants who\
    \ struggle between com-\n\npeting desires to stay abroad or to return home, to\
    \ escape or to conform to gen-\n\ndered expectations, Sealing Cheng asks, “What\
    \ happens to the excess affects \n\nthat refuse to be domesticated?” (2010, 169).\
    \ With this provocative question in \n\nmind, I now turn to experiences of “restlessness”\
    \ and feeling “at home” (or not) \n\nin Cilacap and Yogyakarta. These illuminate\
    \ residents’ dynamic processes of \n\ndomesticating, resisting, or exceeding the\
    \ gendered and moral boundaries of \n\n“home” and “elsewhere.”\n\nRestless in\
    \ Central Java\n\nIndah’s situation exemplifies the restlessness and ambivalence\
    \ that I refer to. \n\nDespite her repeated resolutions not to migrate, Indah’s\
    \ desire for transna-\n\ntional mobility sat in tension with her attempts to contain\
    \ these desires. When"
