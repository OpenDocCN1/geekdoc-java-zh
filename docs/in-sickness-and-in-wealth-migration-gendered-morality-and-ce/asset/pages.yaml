    \ wealthier siblings, \n\ncousins, or other villagers may buy land from families\
    \ willing to sell in times of hardship, or in \n\norder to afford important rituals\
    \ such as weddings. Remittances from transnational migrants \n\nexacerbated this\
    \ inequality in Central Javanese villages: many residents complained that due\
    \ to \n\nthe higher purchasing capacity of migrants, nonmigrant residents (or\
    \ less successful migrants) \n\nwould either be very tempted to sell their land,\
    \ or never be able to afford to buy their own.\n\n \n\n7\\. *Dangdut* is a genre\
    \ of Indonesian popular music that is hybrid, “blending Indonesian \n\nlyrics\
    \ with instruments, rhythms, melodies, and electronic production techniques from\
    \ Indian \n\nfilm music, Malay and middle-Eastern popular music, American disco,\
    \ English pop and rock, \n\nand Latin dance music” (Weintraub 2008, 370). Dangdut’s\
    \ lyrics tend to express “themes of \n\neveryday life, love, social criticism\
    \ against class inequality, and Islamic messages” (ibid.).\n\n \n\n8\\. Additionally,\
    \ although Nurul’s siblings had moved from Cilacap to different parts of \n\n\
    West and East Java with their respective partners, they often turned to Nurul\
    \ to fund their \n\nweddings and even their children’s education. Siblingship\
    \ in Central Java is important as in \n\nother parts of Java and Southeast Asia\
    \ (Carsten 1991; Errington 1987; Retsikas 2014; White \n\nand Schweizer 1998).\
    \ The negotiation of one’s financial obligations to siblings depends highly \n\
    \non emotional manipulation and relationships between siblings, in which a sibling\
    \ who is \n\nperceived to be doing well may be obligated to partly provide for\
    \ (or offer loans to) multiple \n\nother siblings, and even cousins, including\
    \ sometimes their children. How sibling obligations \n\naffect individuals’ financial\
    \ situations depends on how persons find ways to refuse, reduce, or \n\ndelay\
    \ financial requests, as well as how siblings recruit other family members and\
    \ neighbors \n\ninto pressurising or even shaming the sibling who is perceived\
    \ as “better off.”\n\n \n\n9\\. Migrants are legally obliged to sign up for private\
    \ health and life insurance to cover \n\ntheir medical expenses from the time\
    \ they begin training in Indonesian recruitment centers, \n\ntill the time they\
    \ return to the country. Recruitment agents usually are linked to a few \n\nlicensed\
    \ insurance companies who monopolize the provision of migrant-specific insurance\
    \ \n\npackages. Recruiters are often solely responsible for arranging for the\
    \ relevant documents for \n\nmigrants, and keeping their policy documents and\
    \ reference numbers as well, rather than \n\ngiving this information to the migrants.\n\
    \n \n\n10\\. Indeed, perceptions of migrant success resonate with earlier ethnographies\
    \ on \n\nsocial status in Java, in which prestige may not be neatly related to\
    \ wealth. Status instead is \n\n“measured on less tangible qualities such as cultural\
