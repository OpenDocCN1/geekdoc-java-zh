  md: "*182 | In Sickness and In Wealth*\n\nmodels for geographically diverse prospective\
    \ migrants and current migrants to \n\nshare experience-based information on specific\
    \ recruitment agencies and insur-\n\nance companies.6 Those who see nasib as grounded\
    \ in national and foreign laws, \n\nsuch as SBMI, have also focused on paralegal\
    \ training for village leaders and \n\nlocal volunteers, so that they may address\
    \ the needs of fellow villagers who seek \n\ncompensation or satisfactory answers\
    \ from recruitment companies and local \n\ngovernmental representatives in the\
    \ event of fraud, disappearance, sickness, or \n\ndeath of a migrant kin or peer.\n\
    \nSome of these NGO and activist efforts have resulted in important infra-\n\n\
    structural changes in some migrant-origin villages, such as the building of \n\
    \nBP3TKI or its subsidiary P4TKI closer to migrant-origin areas. I agree that\
    \ an \n\neffective way to reduce irregular migration and costs is to make it simpler\
    \ for \n\nprospective migrants to independently navigate migration procedures\
    \ (Patunru \n\nand Uddarojat 2015), and one way to do so is through providing\
    \ the necessary \n\nand accessible infrastructure to populations more likely to\
    \ migrate. Reducing \n\nunnecessary bureaucratic procedures is also a potentially\
    \ effective strategy, as \n\nopposed to the current impetus to increase bureaucracy\
    \ and checks ostensibly \n\nto “protect” migrants from exploitation and high fees;\
    \ these efforts have instead \n\nbeen found to increase migrants’ dependence on\
    \ brokers, and the associated \n\nvulnerabilities and costs (ibid; Killias 2010).\
    \ In the case of the Yogyakarta site, \n\nthe presence of NGO actors helps the\
    \ facilitation of insurance claims and access \n\nto skill-training programs for\
    \ return migrants who may have experienced \n\nlegal, financial, or medical issues\
    \ abroad. The lack of access to these in Cilacap \n\narguably contributes to more\
    \ precarious forms of migration from Cilacap as \n\ncompared to Yogyakarta, as\
    \ well as higher levels of migration and more failed \n\nattempts to migrate.\
    \ Nevertheless, both structural and discursive interventions \n\ncan be effective\
    \ in addressing migrant-origin villagers’ concerns and anxieties \n\nonly if they\
    \ are sensitive to their situated knowledges and gendered experiences \n\nof risk.\n\
    \nMany Indonesia-based migrant-centered activist groups have also been \n\nadvocating\
    \ for changes to current migration regulations in order to place more \n\nlegal\
    \ responsibility for the welfare of migrant workers on Indonesian and foreign\
    \ \n\nstate agencies, rather than mainly limit the state’s role to ensuring and\
    \ regulat-\n\ning the recruitment and placement of Indonesian migrant workers\
    \ abroad. In \n\nthe 2015 discussions over how to redraft the National Regulation\
    \ of Placement \n\nand Protection for Migrant Workers (which, at the time of writing,\
    \ is still under \n\nrevision), SBMI recommended that although recruitment agencies\
