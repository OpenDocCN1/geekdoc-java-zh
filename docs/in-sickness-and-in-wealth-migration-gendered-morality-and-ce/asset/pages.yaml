  md: "*44 | In Sickness and In Wealth*\n\nwealth or sickness obscures broader transnational\
    \ relations of power, knowledge, \n\nand capital that articulate persons as particular\
    \ migrant and labor subjects.\n\nMigrants as Heroes of Development\n\nThe Indonesian\
    \ state officially began regulating transnational labor migration \n\nin 2004,\
    \ largely in response to the rapid increase in female labor migration after \n\
    \nthe Asian Financial Crisis and the fall of Suharto’s New Order State during\
    \ 1998 \n\nand 1999. I outlined in the previous chapter how the New Order government,\
