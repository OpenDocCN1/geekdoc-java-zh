  md: "Mobilizing and Moralizing Indonesia\n\nAn emaciated, badly burned, and scarred\
    \ twenty-three-year-old Indonesian \n\nwoman was found limping at the Hong Kong\
    \ International Airport in January \n\n2014, barely able to walk (Mam 2014). The\
    \ extreme abuse and violence that this \n\nwoman, Erwiana Sulistyaningsih, suffered\
    \ during her employment as a domes-\n\ntic worker in Hong Kong came to light only\
    \ after various graphic images of her \n\nscarred face, bruised body, peeling\
    \ skin on her fingers, and blackened feet and \n\nhands, were circulated and went\
    \ “viral” among Indonesian migrant and activist \n\ngroups on Facebook. Pressure\
    \ from these online communities led to an orga-\n\nnized five-thousand-strong\
    \ protest march in Hong Kong under the slogan of \n\n“Justice for Erwiana.” Migrant\
    \ domestic workers, sympathetic employers, and \n\nHong Kong residents participated.\
    \ These events arguably led to a widely publi-\n\ncized legal case against Erwiana’s\
    \ previous employer, Lo Wan-Tung—a case of \n\nalleged torture, which was initially\
    \ classified as “miscellaneous” until the protest \n\nmarch (*Jakarta Post* 2014b).\
    \ Yet, when Lo was arrested and questioned, investi-\n\ngators reported that “documents\
    \ were also shown to our officers indicating the \n\nmaid quit of her own accord”\
    \ (Lo and Ngo 2013). When asked why Erwiana, in \n\nher visibly injured condition,\
    \ had gone unnoticed by Hong Kong immigration \n\nofficers, the Director of the\
    \ Immigration Department said, “It is difficult to judge \n\nwhether there were\
    \ injuries because of her complexion. We cannot blame the \n\nofficer” (Siu 2014).\n\
    \nThis example highlights the processes through which forms of abuse and \n\n\
    violence committed against migrant workers can be made publicly visible and \n\
    \ninvisible simultaneously, where issues of responsibility and blame can be elusive.\
    \ \n\nErwiana’s physical wounds are literally documented via graphic images made\
    \ \n\npublic. Yet her abuse was undocumented and undetectable via her official\
    \ migra-\n\ntion papers or by customs officials. As one of the six million Indonesian\
    \ labor \n\nmigrants, Erwiana’s plight is familiar, the abuse and protests unexceptional.\
    \ They \n\nhave instead become part of a transnational landscape of long-term,\
    \ ongoing, \n\nprecarious migrations of domestic workers, alongside the large\
    \ presence of rel-\n\nevant migrant and labor activist groups. Why and how do\
    \ some cases of migrant \n\nlabor abuse—such as Erwiana’s—garner extensive public\
    \ support and state atten-\n\ntion, while many others remain undocumented, tolerated,\
    \ and apparently less \n\nrelevant to public concern?\n\n2"
