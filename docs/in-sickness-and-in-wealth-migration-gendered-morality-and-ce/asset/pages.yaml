  md: "*Faith | 131 *\n\nThe situated knowledges and experiences of return migrants\
    \ thus \n\ncontextualize and explain why most Yogyakarta and Cilacap villagers’\
    \ under-\n\nstandings of nasib, and associated notions of human choice and risk,\
    \ departed \n\nsignificantly from those of some NGO workers, government officials,\
    \ and traf-\n\nficking experts. Central to return migrants’ expressions of how\
    \ people can \n\nchange their fate was that God was the final judge of the consequences\
    \ of human \n\nstrivings and efforts (see Qur’an, 95.6). For example, in a discussion\
    \ with Rina \n\nin Cilacap about whether or not local shamanistic healers \\[*dhukun*\\\
    ] had real \n\npower \\[*sakti*\\], she reframed my question to imply that the\
    \ source of shamanis-\n\ntic power is ultimately God. She said, “Yes, this power\
    \ is from God. For us, we \n\njust make an effort. When we are sick, we look for\
    \ who and where can heal us. \n\nMaybe it will be a dhukun or someone else. If\
    \ it’s suitable, yes of course you can \n\n\\[recover\\]. We only make an effort.\
    \ God is the one who decides.”\n\nThis emphasis on the role and limit of human\
    \ effort in influencing nasib\n\nopens the possibility for thinking about residents’\
    \ labor in terms of faith, and \n\nfaith as a form of labor. Villagers’ labors\
    \ of faith and faithful labor critically con-\n\ntribute to morally sustaining\
    \ and shaping the transnational circulation of human \n\nbodies, labor, and finance.\
    \ Attending to the culturally specific notion of human \n\neffort and agency in\
