  md: "*xi*\n\nNote on Names and Indonesian \n\nCurrency\n\nMost personal names in\
    \ this book are pseudonyms, except for officials quoted \n\nfrom news sources\
    \ or official public speeches at events which I attended. This is \n\nin accordance\
    \ with academic convention to safeguard the privacy and anonym-\n\nity of those\
    \ who spoke to me and participated in this research. For individuals \n\nfacing\
    \ particularly delicate social situations, I shared different aspects of their\
    \ \n\nstories under two names, in order to deter possible identification. As per\
    \ social \n\nconvention in Java, where appropriate, I refer to persons with gendered\
    \ honorif-\n\nics of *Mba* (Miss or older sister), *Bu* (Mrs), *Mas* (brother),\
    \ or *Pak* (Mr). For ease \n\nof reference and to ensure the anonymity of the\
    \ sites and its residents, I refer to \n\nthe main field sites in this book simply\
    \ as either based in Cilacap or Yogyakarta, \n\nrather than assigning them specific\
    \ names.\n\nRegarding the Indonesian rupiah (IDR), I roughly convert the amounts\
    \ \n\nbased on the average and standard exchange rate of United States Dollar\
    \ (USD) \n\n1 to IDR 10,000."
