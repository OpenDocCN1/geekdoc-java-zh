  md: "*Contesting the Terms of Belonging | 159 *\n\nassessment that, due to her personality,\
    \ Indah would not be able to navigate the \n\nrisks and trials of migration well.\
    \ The common view of Indah’s unsuitability for \n\nmigration was ostensibly confirmed\
    \ after her first failed attempt to migrate. This \n\ngenerated further judgemental\
    \ remarks by those around her, sometimes in front \n\nof Indah herself, that she\
    \ was not “mentally strong” enough or that she did not \n\nreally try hard enough\
    \ to persevere through the conditions of the training center, \n\nunlike other\
    \ candidates who managed to migrate.\n\nA few weeks after her application to migrate\
    \ for the second time, Indah \n\nchanged her mind. However, whenever we met ostensibly\
    \ successful migrant \n\nwomen who returned from working overseas, Indah still\
    \ asked them, “Do you \n\nhave a job for me? Take me with you!” On one such occasion,\
    \ out of confusion, I \n\nasked Indah if she really intended to go abroad, or\
    \ if she was still resolute about \n\nstaying. She replied that she was only joking\
    \ about leaving. During one such con-\n\nversation, a nonmigrant neighbor joked,\
    \ “Yes, Indah, even when you’re near you \n\ndon’t feel at home (betah), what\
    \ more if you go somewhere far away.” Indah then \n\nasked herself aloud, “Why,\
    \ Indah? Before you went to the \\[recruitment\\] agency, \n\nwhy didn’t you think\
    \ of that?”\n\nThis sense of ambivalence and restlessness “at home” and the suggestion\
    \ that \n\nsome persons might be “at home” elsewhere powerfully illustrate how\
    \ feminized \n\nlabor migration from Central Java has troubled and unsettled gender\
    \ and kin-\n\nship in embodied ways, even for those who do not leave Indonesia.\
    \ Indah’s rest-\n\nlessness highlights how gendered migration from Central Javanese\
    \ villages has \n\nalso shaped the subjectivities of residents who have not (yet)\
    \ moved.2 Attention \n\nto residents’ varying potential and desire to migrate\
    \ shifts analyses of migra-\n\ntion away from indicators of “accessibility” to\
    \ material and financial resources \n\nto embark on journeys (Reeves 2011; Stoll\
    \ 2013). Instead, residents’ potential to \n\nmigrate encompasses and shapes gender-specific\
    \ anxieties and desires, where \n\nquestions of social belonging and displacement\
    \ are intimately linked to trans-\n\nnational movement (Fortier et al. 2003; Manalasan\
    \ 2012). This goes beyond an \n\nanalysis of mobility versus immobility, migrant\
    \ versus nonmigrant, to examine \n\nalso those “who are stopped before they start”\
    \ (Salter 2013, 10; Kellerman 2012), \n\nincluding those ambivalent about migrating,\
    \ or in the process of making deci-\n\nsions about moving or staying.\n\nFocusing\
    \ on the “loose ends” of residents’ attitudes towards home and away \n\nbalances\
    \ the previous chapters’ emphasis on how villagers contain the effects or \n\n\
    threats of shame, stigma, and migratory risks. Another example of such undo-\n\
    \nmesticated, “loose” affects is Titin’s quote in the beginning of this chapter\
    \ about \n\nher reluctance to leave her employer-as-kin in Taiwan. Such kinship\
    \ is based on \n\nmutual care and affinity that transcends and comments on biological,\
    \ ethnic, or \n\nnational boundaries of kinship. Significantly, Titin’s longing\
    \ for her fictive kin \n\nin Taiwan is intimately linked to her obligations to\
    \ stay in Central Java as a wife"
