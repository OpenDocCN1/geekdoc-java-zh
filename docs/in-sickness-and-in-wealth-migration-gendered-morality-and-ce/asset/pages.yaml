    \ is \n\nalso often associated with supernatural or spiritual issues (Nitibaskara\
    \ 1993). \n\nThis section focuses on sickness etiologies in Cilacap and Yogyakarta\
    \ to examine \n\nsome ways in which residents employ narratives of sickness and\
    \ injury to vari-\n\nously locate responsibility, agency, and hope in relation\
    \ to migration. Sickness \n\netiologies often imply that migrants and their families\
    \ can insure against physi-\n\ncal, financial, and moral risks of migration by\
    \ performing gendered moral expec-\n\ntations and practicing religious faith.\n\
    \nNarratives of migration-related sickness do not only serve to blame, shame,\
    \ \n\nor cast judgment on migrants and their kin. Some stories may not target\
    \ indi-\n\nviduals, but criticize circumstances where migration is perceived to\
    \ disrupt \n\nnormative familial structures or deprive individuals of social support\
    \ from or \n\ncompanionship of their migrant kin. A local “cautionary tale” in\
    \ Yogyakarta \n\ninvolved a neighbor whose wife and daughter were both working\
    \ in Taiwan. He \n\nwas a bit “stressed” (*stres*, an Indonesian term borrowed\
    \ from the English lan-\n\nguage, usually used as a euphemism for someone who\
    \ is mentally unstable) due \n\nto loneliness and being left behind (see Good\
    \ and Brodwin 1994; Klein 1988). \n\nWhenever his wife returned, however, he appeared\
    \ well again and the house was \n\noften peaceful and quiet, with no domestic\
    \ arguments. While such tales also con-\n\ntain or imply cautions against adultery,\
    \ divorce, negligent parents, or unfilial, \n\nungrateful children, they mainly\
    \ highlight ways migration can disrupt social \n\nand familial harmony and order.\
    \ The moral aspect of these sickness diagnoses is \n\nevident in how the suggested\
    \ “cures” (*obat*) involve exhortations for people to be \n\nreligiously pious\
    \ (*taqwa*), to fulfill familial obligations, or formally ask others for \n\n\
