  md: "*Conclusion | 177 *\n\ndestiny collectively shape attitudes in the village\
    \ and nation towards what kinds \n\nof bodies and subjects should (or should not)\
    \ circulate transnationally.\n\nHow a society values people gives them their sense\
    \ of “social worth,” and \n\nthe negotiations of the value of persons, their time,\
    \ and labor is “a central aspect \n\nof what the economy is about” (Narotzy and\
    \ Besnier 2014, S10). *Gendered moral *\n\n*economies of migration* refers to\
    \ these ways in which transnational migrations \n\nfrom and returns to Central\
    \ Java are actively shaped and sustained by multiscalar \n\ngendered and moral\
    \ discourses about bodies, labor, and finance. I have argued that \n\nthe lack\
    \ of or pursuit of money is not what keeps people in motion, but rather how \n\
    \npeople value (and contest other ways of valuing) money and mobility in gendered\
    \ \n\nand moral ways. Appreciating how residents of migrant-origin villages—whether\
    \ \n\nas “stayers,” “nonmigrants,” “failed” or “successful” migrants—experience\
    \ and \n\nshape these places and social relations within them critically demonstrates\
    \ how \n\n“economic” reasons for migration are deeply enmeshed in local and cultural\
    \ \n\nregimes of value such as morality.\n\nStories of “immoral” migrants and\
    \ gender practices that destabilize the \n\nfigure of the ideal parent, spouse,\
    \ or child, however, may illuminate alterna-\n\ntive paths to current forms of\
    \ migration and work, to achieve different kinds of \n\nhopeful futures. By weaving\
    \ together the views and narratives of migrant-origin \n\nvillagers—including\
    \ return migrants, prospective migrants, current migrants \n\nwho are back for\
    \ short visits, and those who have never migrated—this book \n\nhas complicated\
    \ common categories or analyses associated with mobility/immo-\n\nbility and migrant/nonmigrant.\
    \ Instead, in migrant-origin villages, migrant \n\ncategories are much messier.\
    \ For example, those who have never left Indonesia \n\nare considered former transnational\
    \ migrants in their failed attempts to cross \n\nnational borders. These cases\
    \ of nondeparture demonstrate the expansive social \n\nand spatial effects of\
    \ migration infrastructure beyond the facilitation of transna-\n\ntional movement.\
    \ Instead, the same infrastructure enabling some people to leave \n\nthe country\
    \ substantially shapes relative immobilities, intranational movements, \n\nand\
    \ associated subjectivities within migrants’ countries of origin.\n\nNarratives\
    \ about Islamic-inflected fate and destiny in the Cilacap and \n\nYogyakarta villages\
    \ show that “nonmigrants” are not passively “left behind,” but \n\nthat they actively\
    \ negotiate the terms of migration, mobility, and motility. “Failed \n\nmigrants”\
    \ and those who have not migrated draw on fate and destiny narratives \n\nto justify\
    \ reasons for staying, in staking their faith in alternatives to migration \n\n\
    such as local agriculture, opening small shops, selling homemade snacks, or \n\
    \nworking in urban Indonesian cities. While the banner of Islam appeals to vari-\n\
    \nous demographics for diverse reasons (chapter 1), scholars of Indonesia generally\
    \ \n\nagree that Islamic discourses and identities enable citizens to negotiate\
    \ moral \n\nanxieties in the context of a sense of greater individual responsibility\
    \ and liability \n\nthat comes with more opportunities, mobility, and choice (Brenner\
    \ 1996; 1998).1"
