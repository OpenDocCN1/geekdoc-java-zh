  md: "*174 | In Sickness and In Wealth*\n\nmigration experiences have enabled women\
    \ and men to criticize perceived \n\nstrict regulations or laws targeting sexuality\
    \ or women. Nevertheless, these \n\nnarratives and practices are still ultimately\
    \ subordinate to and do not question \n\nthe heteronormativity associated with\
    \ Javanese-Indonesian Muslim selves and \n\nfamilies.\n\nThe emerging gender dynamics\
    \ described in this chapter—greater attempts \n\nby Islamic religious leaders\
    \ and some husbands to regulate women’s mobilities, \n\nand villagers’ harsh or\
    \ ambivalent responses to women’s moral and gendered \n\ntransgressions—are not\
    \ entirely new, but depart in several ways from previ-\n\nous ethnographies of\
    \ gender in Central Java. Before industrialization, Javanese \n\nwomen and men\
    \ shared equal agricultural workloads and women were not par-\n\nticularly restricted\
    \ in terms of mobility (Brenner 1995; Wolf 1992; for a comparison \n\nto Sulawesi,\
    \ see Elmhirst 2002). The gradual development of social and village \n\nnetworks\
    \ around some rural women’s internal migrations in the 1980s for factory \n\n\
    work arguably curtailed moral panic about young women’s mobilities. In contrast,\
    \ \n\ncurrent migrations of women to labor in intimate household spaces so cultur-\n\
    \nally and geographically distant from “home,” as well as the uncertainty linked\
    \ \n\nto the vastly uneven outcomes of such journeys, have fueled stronger patriarchal\
    \ \n\ndiscourses locally, alongside the greater influence of Islamic leaders and\
    \ groups \n\nin other areas of political and social life in Java and Indonesia.\
    \ This chapter has \n\noutlined some of the desires of and actions by women’s\
    \ families, and local and \n\nnational authorities in Cilacap and Yogyakarta,\
    \ to exert control over women’s \n\nmobility, sexuality, and behavior, often effectively.\
    \ Yet, in exceptional cases, trans-\n\nnational migration has also radically offered\
    \ unprecedented economic, social, and \n\ngeographical opportunities for some\
    \ women to make new identities, “homes,” and \n\nkin elsewhere.\n\nWhether the\
    \ benefits of migration have outweighed its costs for migrant-\n\norigin villagers,\
    \ or whether transnational migration has led to more gendered \n\nfreedoms or\
    \ constraints, these remain open-ended questions. The answers \n\ndepend on who\
    \ is speaking, for whom, and what moralities, identities, or sense \n\nof security\
    \ or “homeness,” are at stake. For many women—like Indah who has \n\nnever left\
    \ the country, and Titin, a former migrant—the ubiquity of transna-\n\ntional\
    \ gendered migration and the option to move away, as long as they are will-\n\n\
    ing, have resulted in their sense of restlessness in and ambivalence toward their\
    \ \n\n(migrant-origin) villages. These feelings are accompanied by a questioning\
    \ of \n\ntheir attachments to “home” and “family,” in terms of their expected\
    \ duties as \n\nmothers, wives, and primarily female members of the village. Although\
    \ she has \n\nnot migrated, Indah’s ambivalence about staying or going may point\
