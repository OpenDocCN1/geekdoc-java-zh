  md: "*2 | In Sickness and In Wealth*\n\nand teenagers sometimes sat in on our conversations,\
    \ occasionally participating. \n\nEveryone had an opinion or story about migration,\
    \ especially regarding women’s \n\njourneys.\n\nOn the one hand, most people,\
    \ especially the middle-aged and the elderly, \n\nrepeatedly said that migration\
    \ was good. Many asked if I was actually a recruit-\n\nment agent who could find\
    \ them jobs. They said that the money was good and the \n\nwork seemed easy. They\
    \ talked about how local income-generating alternatives \n\nsuch as planting rice\
    \ or running restaurants (*warungs*) yielded very little, hardly \n\nenough to\
    \ cover necessary expenses. The more “successful” return migrants were \n\npresent\
    \ or nearby to validate these views: their remittances contributed to start-\n\
    \ning motorbike repair shops, building bigger houses, or buying land from neigh-\n\
    \nbors. They also perpetuated images of “the good life” overseas. One woman who\
    \ \n\nused to work in Singapore said to me almost apologetically, “Here are my\
    \ chil-\n\ndren. Look at them, they’re so dirty. . . . This is *kampung* \\[village\\\
    ] life. So dirty. . . . \n\nNot like modern Singapore, so clean.”\n\nOn the other\
    \ hand, when I asked about return migrants—those who had \n\nworked overseas and\
    \ come back—the stories were more specific and grim. \n\nCharacters from these\
    \ stories were heard of, often in whispers, but seldom seen. \n\nCouples got divorced,\
    \ mostly due to adultery by either the migrant woman or the \n\nleft-behind husband.\
    \ Single women came back pregnant with “mixed-race”chil-\n\ndren.1 Many returned\
    \ with mysterious physical or psychological illnesses, despite \n\nleaving in\
    \ the pink of health. For example, some stayed in bed for months before \n\npassing\
    \ away; others were depressed, stopped talking, or else went mad (*gila*) \n\n\
    talking to themselves. A few died abroad, and little formal explanation was given\
    \ \n\nto the families by recruitment agencies, foreign doctors, or Indonesian\
    \ or foreign \n\ngovernmental representatives, beyond statements that “accidents”\
    \ (*kecelakaan*) \n\nhappen. Sometimes, the repatriation of these bodies took\
    \ far too long. It was puz-\n\nzling for me to hear these dark stories one moment,\
    \ while the next, unhesitant \n\naffirmations that migration was largely a good\
    \ and promising endeavour.\n\nOne evening, I took a walk to the nearby rice fields\
    \ with Sita’s young cousin. \n\nShe was twelve, and very bright. She had been\
    \ sitting in on many of our discus-\n\nsions on migration. I asked her what she\
    \ wanted to do in the future, and she \n\nreplied that she wanted to be a teacher.\
    \ “Don’t you want to migrate too?” I asked, \n\n“Everyone seems to think it is\
    \ good, you heard.” (In fact, her relatives had joked \n\nthat it would be her\
    \ turn someday soon.) She cried out immediately, “No, no, \n\nI don’t want to.”\
    \ When I asked why, she said that it was obvious, and told me \n\nconfidentially\
    \ specific rumors of adultery, divorce, single parents, death, and \n\nsickness.\
    \ She had highlighted the source of my confusion, so I asked, “Why is it \n\n\
    that everyone knows these things yet still talks about how migration is good?”\
    \ \n\nWithout missing a beat, she replied, “Because when they talk about that,\
    \ they’re \n\nonly talking about money.”"
