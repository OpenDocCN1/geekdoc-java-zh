    \ of the confused migrant who returned with nothing to \n\ndo but “sit at home”\
    \ and wait for a future opportunity contrasts with perceptions \n\nof migrants\
    \ who have achieved long-term success. The latter refers to those who \n\neither\
    \ continue to stay abroad and send money home, or those who have returned \n\n\
    with enough money to start profitable or sustainable businesses. Migrants who\
    \ \n\nmanaged to save a lot—who returned with larger consumption capacities—were\
    \ \n\nviewed as more hardworking and pious while abroad. Those who started busi-\n\
    \nnesses were commonly referred to as being smart (*pintar*) with managing money.\
    \ \n\nThey were typically contrasted against their selfish, hedonistic, and less\
    \ wealthy \n\npeers, who were assumed to have spent their earnings lavishly on\
    \ themselves and \n\nconsumer items. Other migrants perceived as having long-term\
    \ success were cir-\n\ncular migrants, or those who “come and go multiple times”\
    \ (*pulang pergi berkali-*\n\n*kali*). The majority of circular migrants were\
    \ women. This term describes their \n\nspecific pattern of mobility, in which\
    \ migrants embark on multiple consecutive \n\ntrips, each consisting of two- or\
    \ three-year contracts with employers and compa-\n\nnies. These comings and goings\
    \ can be sustained for five or ten to twenty years, if \n\nnot longer. Their success\
    \ as circular, continuous migrants is often associated by \n\nresidents with migrants’\
    \ good luck or fate, in being able to secure good employ-\n\ners, and in their\
    \ ability to adapt to a foreign land and feel at home (*betah*). Success \n\n\
    is also attributed to their ability to endure and persevere for the sake of their\
    \ \n\nfamilies at home despite harsh living and working conditions.\n\nAt the\
    \ time of my fieldwork between 2014 and 2015, the majority of the \n\n people\
