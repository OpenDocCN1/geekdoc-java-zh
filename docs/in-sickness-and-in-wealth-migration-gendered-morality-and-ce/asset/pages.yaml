  md: "Conclusion: Gendered Moral \n\nEconomies of Migration\n\nResidents in migrant-origin\
    \ villages of Cilacap and Yogyakarta appear to \n\nremain both hopeful and fatalistic\
    \ about the future. “*Kalau orang baik, nasib *\n\n*baik*” was a common refrain\
    \ in response to my persistent questions about what \n\nresidents in migrant-origin\
    \ villages thought about migrants’ money and sick-\n\nness, successes and failures.\
    \ “If a person is good, (his/her) fate will be good.” One \n\nwoman claimed that\
    \ nearly all migrants were “successful.” Yet simultaneously \n\nand paradoxically,\
    \ she participated alongside fellow villagers in the circulation \n\nof individualized\
    \ stories of migrant injuries, debt, and failures, concluding that \n\nnobody\
    \ could really be considered successful *yet*.\n\nThis book has shown how stories\
    \ of failed migration journeys and projects \n\ntend to mobilize fear and gendered\
    \ shame in migrant-origin villages. While the \n\nthreat of shame strongly encourages\
    \ some against migrating or frames deci-\n\nsions to stay in positive terms of\
    \ “having shame,” shame also discourages some \n\nmigrants from returning to the\
    \ villages or Indonesia before having achieved (or \n\nappearing to achieve) “success.”\
    \ Simultaneously, through employing discourses \n\nof fate and destiny to explain\
    \ and individualize migration failures, residents of \n\nmigrant-origin villages\
    \ actively develop and sustain faith in the promised “suc-\n\ncesses” of migration.\
    \ Villagers thus mutually shape and cultivate relative mobil-\n\nities and motilities\
    \ in relation to risk, by mobilizing and dispersing gendered \n\nresponsibility\
    \ and blame for migration’s losses and gains.\n\nBy circulating and developing\
    \ faith and shame, villagers draw on gendered \n\nand religiously inflected discourses\
    \ of fate and morality to frame and explain the \n\npast, to act strategically\
    \ on the present, in order to construct “better” futures. \n\nVillagers’ moral\
    \ narratives, including those about (deserved, desirable, or inev-\n\nitable)\
    \ fate and destiny, must be contextualized in terms of the way in which \n\nmoral\
    \ responsibility for migration has been institutionally and discursively \n\n\
    refracted by invested institutions and individuals—through discussions over \n\
    \nwho ought to intervene, and in what ways, in processes and consequences of \n\
    \nmigration. State agencies, national newsmakers, migrant labor NGOs, recruit-\n\
    \nment agents, and residents of migrant-origin villages interact in dynamic ways\
    \ \n\nto account for migrant successes and failures. This book has shown how these\
