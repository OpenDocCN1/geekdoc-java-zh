  md: "*56 | In Sickness and In Wealth*\n\nwill, or due to her sacrifices as a mother\
    \ when she migrated to provide for her \n\nfamily. On the other hand, women’s\
    \ agency and intentions are depicted as mor-\n\nally suspect where women have\
    \ professed some prior desire for adventure, plea-\n\nsure, or wealth. Even in\
    \ cases where women do not profess such “deviant” desires, \n\nwhere sexual abuse\
    \ is concerned, the moral innocence of women seems suspect \n\nby default, as\
    \ in the case of rape being represented as adultery. This focus on moral \n\n\
    agency contributes to shifting the location of blame for violence onto migrants\
    \ \n\nthemselves. This also sanctions only a particular motive for migration—for\
    \ eco-\n\nnomic reasons, and supporting one’s family—as opposed to addressing\
