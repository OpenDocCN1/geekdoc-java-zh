    \ “forced” to do things, or passively “accepted” these \n\nexploitative and illegal\
    \ practices. Furthermore, unfair practices by recruitment \n\nagents and employers\
    \ were taken for granted by prospective migrants and return \n\nmigrants as part\
    \ of “regular” or “formal” channels of migration, and could not be \n\navoided\
    \ as simply as suggested by the NGO staff.\n\nGendered moral assumptions, as well\
    \ as a mainly theoretical-legal under-\n\nstanding of migration processes, prevented\
    \ the workshop’s facilitators from \n\ngrasping the women’s apparent resignation\
    \ to and complicity in trafficking-like \n\npractices. This was evident in a young\
    \ staff member’s moralizing tone when she \n\nadmonished the women for “not thinking”\
    \ before choosing to go abroad and leav-\n\ning their “poor children” behind.1\
    \ She pleaded with them to think of the social and \n\nnot only economic consequences\
    \ of their movements, thus limiting her ability to \n\nperceive how social and\
    \ economic obligations were intimately linked for many \n\nprospective and current\
    \ migrants (Constable 2014; Gamburd 2000; Parreñas \n\n2005; Pratt 2012). Even\
    \ the “trafficking expert” and invited speaker, who had \n\napparently written\
    \ several books on the issue, repeatedly asked very basic ques-\n\ntions about\
