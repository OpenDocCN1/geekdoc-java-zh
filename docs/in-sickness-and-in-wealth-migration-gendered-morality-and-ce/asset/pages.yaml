  md: "*The Politics of Morality and Identity in Central Java | 37 *\n\nIndeed, contemporary\
    \ migration in Indonesia and elsewhere is not “deter-\n\nmined by autonomous markets,\
    \ policy logic, nor according to individual migrant \n\nagency” (Xiang and Lindquist\
    \ 2014, S143), but rather is a result of “systematically \n\ninterlinked technologies,\
    \ institutions, and actors that facilitate and condition \n\nmobility” (Xiang\
    \ and Lindquist 2014, S124). The decentralization of governance \n\nand deregulation\
    \ of labor regimes in the post-Suharto era saw an overwhelm-\n\ning increase in\
    \ recruitment agencies (also known as PPTKIS, an abbrevia-\n\ntion in Indonesian\
    \ for Privatized Agency for the Placement of Indonesian \n\nMigrant Workers).\
    \ Hence, most workers now apply for jobs through middle-\n\nmen and PPTKIS rather\
    \ than directly to a company or employer (Lindquist \n\n2010; Lindquist, Xiang\
    \ and Yeoh 2012; Silvey 2004; Tjandraningsih 2013). While \n\nrecruitment agencies\
    \ were previously regulated and linked to state patronage, \n\ndecentralization\
    \ witnessed not only the rise of registered private agencies, but \n\nalso, due\
    \ to the ineffective enforcement of existing laws, informal and unregis-\n\ntered\
    \ ones (Lindquist 2010; Silvey 2004; Tjandraningsih 2013). Practices of labor\
    \ \n\noutsourcing and the centrality of “middleman” companies are trends applicable\
    \ \n\nto both the domestic and international labor market for those engaged in\
    \ manu-\n\nfacturing, construction, or domestic labor and services. These new\
    \ trends and \n\npractices give workers less control over their employment and\
    \ labor conditions; \n\norganized protests against an employer, recruitment agent,\
    \ or the state would no \n\nlonger be as effective in the context of these reformed\
    \ relationships of codepen-\n\ndence and complicity.\n\nThe contemporary transnational\
    \ migration infrastructure thus includes \n\nvarious actors and institutions involved\
    \ in processing, facilitating, or addressing \n\nany issue or practice involved\
    \ in migrants’ preparation for departure, training, \n\narrival, employment, return,\
    \ deportation, or post-return reintegration. I view \n\nthese parts as constitutive\
    \ of one another and propose these actors and institu-\n\ntions share and disperse\
    \ social, economic, and political risks in uneven ways. \n\nFor example, both\
    \ NGO workers and recruitment brokers depend “on the inher-\n\nently unpredictable\
    \ circulation of capital that in different ways set migrants in \n\nmotion” (Lindquist\
    \ 2015, 171). NGOs, recruitment agencies, and state agencies \n\nare diverse in\
    \ their practices and intentions, as well as the persons who work for \n\nthem\
    \ (Lindquist 2015; Palmer 2012; 2016). Following Johan Lindquist (2015), I do\
    \ \n\nnot assume that recruitment agents or NGO staff occupy particular or mutu-\n\
    \nally exclusive positions in a moral spectrum, in which the former are typically\
    \ \n\nassociated with immorality or deception and the latter with altruism and\
    \ justice. \n\nShifting the focus away from existing scholarship on these broader\
    \ political and \n\neconomic structures facilitating transnational movement, this\
    \ book examines \n\ninstead how such broader political and economic dynamics of\
    \ the migration \n\nindustry are negotiated and shaped in relation to gender,\
    \ morality, and faith in \n\nCentral Javanese migrant-origin villages."
