  md: "*Introduction | 11 *\n\nsuch gendered and moral representations of migration,\
    \ and its potential rewards \n\n(“development”), or costs (“slavery”), are experienced,\
    \ reproduced, complicated, \n\nor challenged by residents of migrant-origin locales.\n\
    \nWhile there have been debates over whether “the moral” constitutes a unique\
    \ \n\nsphere separate from ordinary life or is intimately present and remade in\
    \ every-\n\nday life, I agree with the latter view.9 Moral discourse and action\
    \ are context-\n\ndependent, and thus can at times be more explicitly verbalized\
    \ and understood as \n\na process of conscious reflection, and at other times,\
    \ take the form of embodied, \n\ninstinctive, and unreflective responses to the\
    \ needs of intimate others around \n\nthem. In the former scenario, interviewees\
    \ and friends in Central Java sometimes \n\nperceived morality and justified particular\
    \ decisions, actions, or consequences by \n\nappealing to what they considered\
    \ an objective moral source, such as the Qur’an, \n\ngovernment regulations, or\
    \ local customary law (*adat*). Nevertheless, villagers’ \n\nmoral judgments of\
    \ others are not always internally or collectively consistent, \n\nand people\
    \ clearly do not merely follow or abide by fixed moral codes or rules, \n\nalthough\
    \ there might be some agreement as to what the social norms are *generally*. \n\
    \nThe generality and broad nature of “objective” moral rules highlight that there\
    \ \n\nare always ways for individuals to reconsider how applicable those rules\
    \ are in \n\nspecific and temporal circumstances confronting persons. These discussions,\
    \ \n\nmoral judgments, and pluralistic moral attitudes reveal the necessary remak-\n\
    \ning of explicit norms and implicit practices within everyday life and interactions\
    \ \n\n(Brandom 2008, 20; Zigon 2014), partially through taking into account, assum-\n\
    \ning, and/or discussing the intentions of others (Duranti 2015; Keane 2007).\
    \ I take \n\nseriously the observation that “freedom does not lie merely in the\
    \ absence of \n\nrules” (Heywood 2015, 200), but that individuals continue to\
    \ negotiate freedom \n\nand agency in relation to other people and to both formal\
    \ and informal codes \n\nof conduct (Laidlaw 2002). In other words, a prerequisite\
    \ of moral codes is their \n\nreliance on ethical reflexivity, where “the activities\
    \ of gossip do not simply repro-\n\nduce values but exert new pressures on them”\
    \ (Keane 2014, 12, see chapter 6).\n\nMoving beyond the current scholarly focus\
