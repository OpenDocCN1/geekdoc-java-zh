    \ have framed their focus on material or ritual practices, \n\nsymbols, or discourse,\
    \ in relation to how “true” piety is difficult to prove and \n\nascertain empirically\
    \ (Blackburn 2004; Jones 2010). Following Miyazaki, I take"
