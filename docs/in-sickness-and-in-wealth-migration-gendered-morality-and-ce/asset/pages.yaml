  md: "*Conclusion | 181 *\n\nprospective migrants increase the costs of migration\
    \ and symbolically target \n\nmigrants’ own mental conditions as a root “problem”\
    \ of migration. These pro-\n\ngrams and discourses importantly diffuse what Aihwa\
    \ Ong (2010) calls “idioms \n\nof resistance” (such as spirit possession, chapter\
    \ 5), by reinforcing popular per-\n\nceptions that migrant success and failure\
    \ mainly are a matter of individual \n\nresponsibility or luck, while at the same\
    \ time, paradoxically overregulating \n\nmigration.\n\nDue to a complex set of\
    \ historical and contemporary factors, Cilacap and \n\nYogyakarta villagers, like\
    \ the vast majority of Indonesian citizens, perceive and \n\nexperience increasing\
    \ pressures to identify with Islam, or find Islamic practices \n\nmore relevant\
    \ to their life worlds than before (Bennett 2005a; Boellstorff 2005; \n\nBowen\
    \ 1993; Brenner 1996; 1998; Hefner 1987; 2000; Smith-Hefner 2007). This \n\nbook\
    \ has shown some of the ways that these emerging Islamic subjectivities limit\
    \ \n\nand/or enable the critique of exploitative or unfair labor and migration\
    \ laws, and \n\nlocal norms of gendered morality, through a focus on individual\
    \ fate, divine pun-\n\nishment, and divine justice, as opposed to (worldly) social\
    \ justice. While some \n\nmigrants and activists draw on and reinforce gendered\
    \ moral expectations to \n\ndraw sympathy for their causes (often successfully),\
    \ such as in representations of \n\nthe ideal feminine victim or migrant worker,\
    \ there are also many that challenge \n\nor sidestep these assumptions.5\n\nSome\
    \ Indonesian activists employ ethical and moral rhetoric based on \n\nIslam and\
    \ citizenship to advocate for and participate in programs involving \n\nmigrant\
    \ welfare and rights, while suspending judgement on individual actors. \n\nSeveral\
    \ activists affiliated with migrant-centered or women’s NGOs have \n\npoliticized\
    \ nasib (fate) discourses, in expressing that migrants’ nasib depends \n\non employers\
