    \ 2013; Ford and \n\nLyons 2012). During the workshop, it was clear that women\
    \ emphasized their \n\neveryday and “hidden” strategies to mitigate the risks\
    \ of going abroad. Common \n\nexamples included hiding food or important phone\
    \ numbers of NGOs and the \n\nIndonesian Consulate inside of ballpoint pens or\
    \ their bras. Despite taking such \n\nsubtle precautionary measures, the women\
    \ “allowed” employers to keep their \n\npassports and “allowed” recruitment agents\
    \ to falsify their documents. Women’s \n\nawareness of and justifications for\
