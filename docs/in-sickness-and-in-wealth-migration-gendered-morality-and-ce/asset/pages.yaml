    \ such as a dependent, employer, colleague, and NGO volunteer \n\nhave given me\
    \ a long-term view of the dynamics and issues concerning gender, \n\nlabor, and\
    \ migration, not only in Singapore, but also in Southeast Asia broadly.\n\nJavanese\
    \ and Indonesian Mobilities\n\nTemporary migration within Indonesia has a long\
    \ history. The internal and \n\ninternational migration of men in many parts of\
    \ the Indonesian archipelago—\n\noften known as *merantau*—has since the early\
    \ twentieth century been socially \n\nsanctioned as a rite of passage into adulthood\
    \ for male youth, and linked to \n\nsocial expectations for men to financially\
    \ contribute to the family as migratory \n\n“breadwinners” (Hugo 1982; Nas 2003).\
    \ It was not uncommon for Javanese men \n\nto move temporarily to find work in\
    \ neighboring areas, provinces, or islands \n\nwithin Indonesia, for periods as\
    \ short as a few days to months to years (Hugo \n\n1982). Women typically stayed\
    \ behind to take care of agriculture and the chil-\n\ndren. Men’s circular migrations\
    \ to and from the household were seasonal, and \n\ntheir movements often occurred\
    \ in between planting and harvesting seasons, \n\nwhen there was little work to\
    \ be done (Hugo 1982).\n\nThe Suharto government’s later institutionalization\
    \ of transnational labor \n\nmigration as a pathway to national economic development\
    \ has a historical prec-\n\nedent in the state’s *transmigrasi *(transmigration)\
    \ program. As part of Suharto’s \n\nbroader project to engineer Indonesia’s demographics\
    \ in the pursuit of eco-\n\nnomic growth and national integration, from the 1970s\
    \ to 1990s the Ministry of \n\nTransmigration was restructured to facilitate coerced\
    \ mass-migration of Javanese \n\npeasants in populated areas to the outer islands,\
    \ such as Irian Jaya (West Papua), \n\nSumatra, and Borneo (Tirtosudarmo 2003).\
