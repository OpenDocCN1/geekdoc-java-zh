    \ makes some victims pitiable and oth-\n\ners “blameable.” Mainstream news media\
    \ and activists in Indonesia have evoked \n\nparticular, culturally salient gendered\
    \ and moral assumptions in representing \n\ncases of labor abuse, violence, and\
    \ illness of migrant domestic workers. These \n\nrepresentations of blame and\
