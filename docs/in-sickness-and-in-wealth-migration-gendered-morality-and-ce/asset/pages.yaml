  md: "Introduction: Faith in Migration\n\nThis book is about how and why residents\
    \ of migrant-origin villages develop \n\nand sustain faith in transnational migration’s\
    \ uncertain promises, despite its \n\nmany financial, physical, moral, and mortal\
    \ risks. It begins with the day I took \n\na four-hour bus journey from Yogyakarta\
    \ city to Cilacap, an area in Central \n\nJava where many Indonesian transnational\
    \ migrants are from. I was traveling \n\nwith Sita, a self-defined labor activist\
    \ in her early thirties who worked for vari-\n\nous nongovernmental organizations\
    \ on social justice issues, including women’s \n\nhealth. Through mutual friends,\
    \ we met in Yogyakarta, where, strikingly, as I \n\ntold her of how I was raised\
    \ by and among different migrant Filipina domestic \n\nworkers in my home who\
    \ were employed by my extended family in Singapore, \n\nSita spoke of growing\
    \ up in a rural village in Cilacap, where it was the norm for \n\nyoung women\
    \ to migrate abroad for domestic work. Such work often encom-\n\npasses cleaning,\
    \ cooking, and taking care of the elderly and/or young children \n\nof an employer’s\
    \ household, where the worker is also expected to live with the \n\nfamily. Sita\
    \ always knew that becoming a migrant domestic worker was an \n\noption for her,\
    \ but none of her immediate kin had ever migrated at the time. She \n\neventually\
    \ became one of the village’s few university graduates. We got off the \n\nbus\
    \ in the middle of a small highway, where her brother and sister-in-law picked\
    \ \n\nus up with their motorbikes. The road to their village and house was unpaved\
    \ \n\nand rocky.\n\nHere, almost everyone had one or more family members working\
    \ overseas, \n\nwho formerly worked overseas, and/or who were planning to work\
    \ abroad, even \n\nfor persons in typical “nonmigrant families” like Sita, whose\
    \ younger brother \n\n(and later, his wife) had tried and failed to migrate several\
    \ times. Her older \n\nbrother married the daughter of a migrant woman who seldom\
    \ returned to visit, \n\nbut regularly sent them money. At the time of my fieldwork,\
    \ this daughter (Sita’s \n\nsister-in-law) was waiting for her mother’s unlikely\
    \ return, so that she, too, could \n\nwork abroad. Women who migrated usually\
    \ did factory or domestic work in \n\nMalaysia, Hong Kong, Taiwan, Singapore,\
    \ or Saudi Arabia. Men labored on plan-\n\ntations in Malaysia, were private chauffeurs\
    \ in Saudi Arabia, or worked in fac-\n\ntories in Taiwan and Korea. Village neighbors\
    \ heard about my arrival and soon \n\ncame to Sita’s house to chat or invite us\
    \ to their homes. Some of them were Sita’s \n\nextended kin: they included return\
    \ migrants, migrant applicants (prospective \n\nmigrants), migrants’ close kin,\
    \ and those who did not plan to migrate. Children"
