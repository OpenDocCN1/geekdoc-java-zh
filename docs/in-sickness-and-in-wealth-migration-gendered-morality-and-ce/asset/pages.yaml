    \ be questionable (ibid., 33). Thus \n\ncritics of Geertz’ early models of Javanese\
    \ socioreligious order argued for a more dynamic \n\nand contextual understanding\
    \ of religious practice and Islam.\n\n \n\n10\\. The *ulama* is a body of scholars\
    \ trained in Islamic law and science, usually seen as \n\nauthorities of interpreting\
