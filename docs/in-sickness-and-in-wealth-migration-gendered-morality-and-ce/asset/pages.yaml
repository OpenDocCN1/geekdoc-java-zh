  md: "*128 | In Sickness and In Wealth*\n\nthe “character of faith” as “ethnographically\
    \ accessible,” through a focus on how \n\nindividuals generate, through discourse\
    \ and practices, “the capacity to place \n\none’s agency in abeyance” (Miyazaki\
    \ 2000, 44). This chapter examines how and \n\nwhen Cilacap and Yogyakarta residents\
    \ suspend, displace, or reconfigure their \n\nagency in relation to nonhuman actors.\
    \ This offers a complementary but differ-\n\nent perspective to migrant research\
    \ that typically focuses on structural processes \n\nand regulation, human agency,\
    \ and social networks.\n\nMainstream media, village leaders, and government officials\
    \ often cast \n\nvillagers’ narratives of fate and destiny in terms of their ignorance\
    \ and resigna-\n\ntion to broader structural and supernatural forces (Prusinski\
    \ 2016a). Instead, \n\nI argue that narratives of fate and destiny are grounded\
    \ in villagers’ awareness of \n\nthe complicities and dispersed responsibilities\
    \ of employers, recruitment agents, \n\nand state institutions when things go\
    \ wrong for migrants. Responsibility, human \n\nintentions, and decisions are\
    \ always intersubjective and fundamentally socially \n\nconstituted (Duranti 2015;\
    \ Keane 2014). Narratives of fate and faith serve to shape \n\ntransnational migration\
    \ flows by continually reconfiguring villagers’ agency in \n\nrelation to what\
    \ they are willing to risk (e.g., debt, sickness, loneliness, adultery, \n\ndeath),\
    \ and what they are not willing to forsake (e.g., social interdependency, \n\n\
    patron relations to local government officials, and hope for long-term success).\
    \ In \n\nthis chapter, I argue that villagers’ talk about fate, destiny, and spirit\
    \ possession \n\nare partial yet ultimately ineffective responses to the state’s\
    \ inability to guarantee \n\nvillagers’ transnational security or livelihoods.\
    \ This chapter thus traces the ways \n\nvillagers have come to depend on the ambiguities\
    \ and ambivalences present in \n\nunevenly implemented state regulations of migration,\
    \ even as these very ambiva-\n\nlences have contributed to the risks of their\
    \ endeavors.\n\nFate and faith discourse and practices in these field sites are\
    \ partially influ-\n\nenced by Islamic ideas and discourse. While anthropological\
    \ and theological \n\napproaches to Islam have been the subject of much debate\
    \ among anthropolo-\n\ngists (Asad 2003; Varisco 2005), I align with ethnographers\
    \ who focus on how \n\nand to what extent Indonesians negotiate their beliefs\
    \ and practices with refer-\n\nence to ideas about Islam (Bowen 1993; Varisco\
    \ 2005; Woodward 1989; Kim 2007). \n\nInterpretations of the Qur’an and Islam\
    \ in people’s lives are diverse and often \n\nconflicting, as evident in enduring\
    \ public debates over the nature of “Indonesian \n\nIslam” and the presence of\
    \ “radical” Islamic groups (Munjid 2012). Nevertheless, \n\nIslamic discourses\
    \ or associated notions—such as fate and destiny—are salient \n\nand important\
    \ to Central Javanese residents’ discussions, evaluations, and reflec-\n\ntions\
    \ of their own actions and those of others. Everyday talk about or debates \n\n\
    over morality and the role of human agency—based on a shared orientation to \n\
    \nGod, other supernatural agents, and the afterlife—illuminate how Islamic sub-\n\
    \njectivities and ideas are explicitly and intimately negotiated in the context\
    \ of \n\ntransnational labor migration."
