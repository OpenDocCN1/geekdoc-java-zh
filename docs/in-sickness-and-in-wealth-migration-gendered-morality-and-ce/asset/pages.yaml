  md: "Evaluating Migrant Success and \n\nFailure\n\n“Here, almost everyone \\[who\
    \ is a migrant\\] is successful.”\n\n—Elderly female resident, who has never left\
    \ Indonesia (Yogyakarta)\n\n“If you ask me, in this whole village, nobody is successful\
    \ yet.”\n\n— Former migrant woman who worked in Malaysia, mid-twenties, \n\nmarried\
    \ to a former migrant to Korea (Yogyakarta)\n\n“\\[Success or failure\\] depends\
    \ on our own selves and our family. For example, \n\nit depends on whether we\
    \ work hard or not, but also how our children and \n\nspouses are . . . if they\
    \ are lazy or if they work, and if children spend a lot of \n\nmoney or not. Sometimes\
    \ we \\[migrants\\] are just the same when we are working \n\noverseas \\[*sama\
    \ saja*\\] but our families here are spending it on other things.”\n\n— Former\
    \ migrant woman who worked in Taiwan, early thirties, who \n\nreturned to Taiwan\
    \ to work after this interview \n\nin late 2014 (Cilacap)\n\nIt was a clear, sunny\
    \ November morning in Cilacap. I had been staying in a \n\nmigrant-origin village\
    \ there for about a week with Nurul, a woman in her forties \n\nwho had worked\
    \ in Malaysia and Singapore for more than twenty years before \n\nreturning to\
    \ Cilacap. On this day, Nurul took me to visit her close friend, Rina, \n\nwho\
    \ had also worked in Singapore as a domestic worker in the 1990s. Rina’s house\
    \ \n\nhad newly painted concrete walls, a bigger than average living room with\
    \ cush-\n\nioned Javanese wooden chairs, and a large photo of Mecca in Saudi Arabia.\
    \ This \n\nspacious abode was a stark contrast to Nurul’s small and modest house,\
    \ which had \n\na mat instead of chairs for guests, and had only been tiled six\
    \ months previously. \n\nRina served us warm sweet tea, along with a generous\
    \ variety of local snacks such \n\nas sour mandarins and fried corn fritters.\
