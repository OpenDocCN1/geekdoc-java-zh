    \ asking \n\nwhy Central Javanese risk the things and relations they value in\
    \ order to migrate \n\nor help another to migrate, this chapter explores how migration-related\
    \ knowl-\n\nedge and risk are situationally and relationally constituted through\
    \ circulating \n\nand embodying shame.\n\nEveryday gossip, acts of shaming, and\
    \ negotiating threats of shame gen-\n\nerate specific forms of knowledge about\
    \ risk, particularly in villagers’ self-\n\nawareness that their knowledge is\
    \ always partial and incomplete (see Elyachar \n\n2012). Furthermore, gossip—or\
