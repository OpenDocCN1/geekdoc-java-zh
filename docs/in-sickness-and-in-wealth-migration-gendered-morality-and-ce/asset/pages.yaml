  md: "*vii*\n\nAcknowledgments\n\nThis work would not have been possible without\
    \ the patience and kindness \n\nof the residents of the three migrant-origin villages\
    \ in Cilacap and Yogyakarta. \n\nI am deeply grateful for the opportunity to hear\
    \ and witness the hopes, regrets, \n\nand sources of shame and faith that you\
    \ have so generously shared with me, and \n\nhope that I have done your stories,\
    \ lives, and struggles justice. Elsewhere in Java, \n\nI owe special gratitude\
    \ to Ratih Pratiwi Anwar, who provided me with much \n\nintellectual, personal,\
    \ and practical support from the very beginning of this proj-\n\nect. I thank\
    \ her for our engaging discussions on migration and development, for \n\nher countless\
    \ invitations and introductions to migrant-related forums, activities, \n\ninstitutions,\
    \ and contacts, and above all, for her deep friendship, care, and com-\n\npany.\
    \ As a friend and occasional research assistant, Yuna (Pratina Ikhtiyarini) \n\
    \nintroduced me to several migrant labor activists and networks in Indonesia.\
    \ Her \n\ncompanionship and insights during our field trips were invaluable.\n\
    \nThe following organizations in Indonesia and Singapore have also been \n\nextremely\
    \ helpful in the development of this work: Serikat Buruh Migran Indonesia \n\n\
    (SBMI), Buruh Migran Yogyakarta (Infest), Wisma Bahasa (Yogyakarta), Koalisi \n\
    \nPerempuan Cilacap, Yayasan Kembang, Solidaritas Perempuan, Daya Anisa, \n\n\
    Nahdlatul Ulama, Indonesia Family Network (IFN), Asosiasi Tenaga Kerja \n\nIndonesia\
    \ (ATKI), and Humanitarian Organization for Migration Economics \n\n(HOME). In\
    \ particular, I would like to thank Jolovan Wham, Bu Erna Murniaty, \n\nMas Hariyanto,\
    \ Mba Maizidah Salas, Mas Aan, Mas Bobi Anwar Ma’Arif, Mas \n\nFathulloh Muzamiel,\
    \ Mba Fendy Sri Rahuyu, Pak Abdul Rahim Sitoris, Mba \n\nErwiana Sulistyaningsih,\
    \ and Nisrina Muthahari, for their time and patience, \n\nand for sharing their\
