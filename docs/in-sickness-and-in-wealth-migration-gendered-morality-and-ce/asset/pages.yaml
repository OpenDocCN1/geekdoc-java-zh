  md: "*Conclusion | 183 *\n\nand prospective migrants to these brokers. The flipside\
    \ is also that recruitment \n\nagencies may be bearing too much responsibility\
    \ in running training processes \n\nand facilitating migration paperwork, and\
    \ are sometimes easily and unfairly \n\ntargeted as criminals in discussions about\
    \ precarious migration. Instead, \n\nIndonesian-based migrant organizations like\
    \ SBMI suggest that the presently \n\nhighly commercialized training facilities\
    \ could be run as public (or semipri-\n\nvate) educational institutions. Migrants’\
    \ associations in destination countries \n\nare also drawing attention to the\
    \ negligence of some Indonesian Consulates and \n\nEmbassies abroad that are inadequately\
    \ staffed or unprepared to deal with cases \n\nof migrant abuse and labor disagreements\
    \ (see also Palmer 2016).\n\nThese actions and proposals that focus on changing\
    \ or improving infra-\n\nstructural and legal provisions for migrant workers and\
    \ migrant-origin vil-\n\nlagers often require the discursive reframing of moral,\
    \ legal, and financial \n\nresponsibility within migration processes and the migration\
    \ industry.7 Seeing \n\nmigration in terms of gendered moral economies reminds\
    \ us that the stories \n\nwe tell about migrants and where they come from relative\
    \ to where they are \n\ngoing to—in terms of their work, pay, sexuality, and family\
    \ lives—all contrib-\n\nute to dismissing or legitimizing certain perspectives\
    \ and actions or inactions \n\nregarding people’s abilities, capacities, and desires\
    \ to move or stay in their place \n\nor country of birth. In future extensions\
    \ of this project, it would be produc-\n\ntive to focus in more detail on comparing\
    \ the gendered experiences and per-\n\nceptions of contemporary intranational\
    \ migration and associated livelihoods \n\nin relation to transnational migration.\
    \ The migration of men has also become \n\nincreasingly vulnerable in recent years\
    \ (see Palmer 2017). More migrant seafar-\n\ners are involved in illegal fishing\
    \ industries, and the migrants involved were \n\noften misled into thinking that\
    \ they are going to work in cruise ships or in con-\n\nstruction work abroad.\
    \ Irregular forms of migration and brokerage—mainly of \n\nmen—to Korea and Japan\
    \ have also grown. Ironically, these migration corri-\n\ndors have been increasingly\
    \ popular due to general perceptions of better wages \n\nand stricter labor protection\
    \ laws, perceptions which are reinforced by the \n\nIndonesian state’s determination\
    \ to promote all state-facilitated and predomi-\n\nnantly male migration to Korea\
    \ and Japan as “formal” (hence, not precarious) \n\nwork. In this context, the\
    \ Indonesian government has declared it an achieve-\n\nment that the numbers of\
    \ documented female domestic labor migrants seem to \n\nbe decreasing, which they\
    \ link to their effective ban against migration to the \n\nMiddle East. Such statistics\
    \ disguise the fact that risks are not reduced for all \n\nmigrants, but may be\
    \ simply justified, hidden, or transferred to other gendered \n\nindustries. Future\
    \ enquiry should attend to how migrant-origin villagers them-\n\nselves, alongside\
    \ other invested actors including researchers, participate in sus-\n\ntaining\
    \ or containing faith in these new and continuing forms of precarious \n\nmobilities."
