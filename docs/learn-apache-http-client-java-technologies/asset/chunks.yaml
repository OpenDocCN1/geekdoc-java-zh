    # Multiple Threads


    A multi-threaded program contains two or more parts that can run concurrently
    and each part can handle a different task at the same time making optimal use
    of the available resources.


    You can execute requests from multiple threads by writing a multithreaded HttpClient
    program.


    If you want to execute multiple client requests from threads consecutively, you
    need to create a **ClientConnectionPoolManager** . It maintains a pool of **HttpClientConnections**
     and serves multiple requests from threads.


    The connections manager pools the connections based on the route. If the manager
    has connections for a particular route, then it serves new requests in those routes
    by leasing an existing connection from the pool, instead of creating a new one.


    Follow the steps to execute requests from multiple threads −


    ## Step 1 - Creating the Client Connection Pool Manager


    Create the Client Connection Pool Manager by instantiating the **PoolingHttpClientConnectionManager**
     class.


