    Following example demonstrates the execution of HTTP requests simultaneously from
    multiple threads. In this example, we are trying to execute various requests from
    various threads and trying to print the status, and the number of bytes read by
    each client.


    ```java

    import org . apache . http . HttpEntity ;


    import org .apache . http . client . methods . CloseableHttpResponse ;


    import org .apache . http . client . methods . HttpGet ;


    import org .apache . http . impl . client . CloseableHttpClient ;


    import org .apache . http . impl . client . HttpClientBuilder ;

    import org .apache . http . impl . client . HttpClients ;


    import org .apache . http . impl . conn . PoolingHttpClientConnectionManager ;


    import org .apache . http . util . EntityUtils ;


    public class ClientMultiThreaded extends Thread {


    CloseableHttpClient httpClient ;


    HttpGet httpget ;


    int id ;


    public ClientMultiThreaded ( CloseableHttpClient httpClient , HttpGet httpget
    ,


    int id ) {


    this . httpClient = httpClient ;


    this . httpget = httpget ;


    this . id = id ;

    }


    @Override

    public void run () {


    try {

    //Executing the request

    CloseableHttpResponse httpresponse = httpClient . execute ( httpget );


    //Displaying the status of the request.

    System . out . println ( "status of thread " + id + ":"+ httpresponse . getStatusLine
    ());


    //Retrieving the HttpEntity and displaying the no.of bytes read

    HttpEntity entity = httpresponse . getEntity ();


    if ( entity != null ) {


    System . out . println ( "Bytes read by thread thread " + id + ":


    " + EntityUtils . toByteArray ( entity ). length );

    }

    } catch ( Exception e ) {


    System . out . println ( e . getMessage ());

    }

    }


    public static void main ( String [] args ) throws Exception {

    //Creating the Client Connection Pool Manager by instantiating the PoolingHttpClientConnectionManager
    class.

    PoolingHttpClientConnectionManager connManager = new PoolingHttpClientConnectionManager
    ();


    //Set the maximum number of connections in the pool

    connManager . setMaxTotal ( 100 );


    //Create a ClientBuilder Object by setting the connection manager

    HttpClientBuilder clientbuilder = HttpClients . custom (). setConnectionManager
    ( connManager );


    //Build the CloseableHttpClient object using the build() method.

    CloseableHttpClient httpclient = clientbuilder . build ();


    //Creating the HttpGet requests

    HttpGet httpget1 = new HttpGet ( "http://www.tutorialspoint.com/" );

    HttpGet httpget2 = new HttpGet ( "http://www.google.com/" );

    HttpGet httpget3 = new HttpGet ( "https://www.qries.com/" );

    HttpGet httpget4 = new HttpGet ( "https://in.yahoo.com/" );


    //Creating the Thread objects

    ClientMultiThreaded thread1 = new ClientMultiThreaded ( httpclient , httpget1
    , 1 );

    ClientMultiThreaded thread2 = new ClientMultiThreaded ( httpclient , httpget2
    , 2 );

    ClientMultiThreaded thread3 = new ClientMultiThreaded ( httpclient , httpget3
    , 3 );

    ClientMultiThreaded thread4 = new ClientMultiThreaded ( httpclient , httpget4
    , 4 );


    //Starting all the threads

    thread1 . start ();

    thread2 . start ();

    thread3 . start ();

    thread4 . start ();


    //Joining all the threads

    thread1 . join ();

    thread2 . join ();

    thread3 . join ();

    thread4 . join ();

    }

    }

    ```


    ## Output


    On executing, the above program generates the following output −


    status of thread 1: HTTP/1.1 200 OK

    Bytes read by thread thread 1: 36907

    status of thread 2: HTTP/1.1 200 OK

    Bytes read by thread thread 2: 13725

    status of thread 3: HTTP/1.1 200 OK

    Bytes read by thread thread 3: 17319

    status of thread 4: HTTP/1.1 200 OK

    Bytes read by thread thread 4: 127018


    # Custom SSL Context


    Using Secure Socket Layer, you can establish a secured connection between the
    client and server. It helps to safeguard sensitive information such as credit
    card numbers, usernames, passwords, pins, etc.


    You can make connections more secure by creating your own SSL context using the
    `HttpClient` library.


    Follow the steps given below to customize SSLContext using HttpClient library
    −


    ## Step 1 - Create SSLContextBuilder object


    `SSLContextBuilder` is the builder for the SSLContext objects. Create its object
    using the `custom()` method of the `SSLContexts` class.


    ```java

    //Creating SSLContextBuilder object

    SSLContextBuilder SSLBuilder = SSLContexts.custom();

    ```


    ## Step 2 - Load the Keystore


    In the path `Java_home_directory/jre/lib/security/`, you can find a file named
    cacerts. Save this as your key store file (with extension .jks). Load the keystore
    file and, its password (which is `changeit` by default) using the `loadTrustMaterial()`
    method of the `SSLContextBuilder` class.


    ```java

    //Loading the Keystore file

    File file = new File("mykeystore.jks");

    SSLBuilder = SSLBuilder.loadTrustMaterial(file, "changeit".toCharArray());

    ```


    ## Step 3 - build an SSLContext object


    An SSLContext object represents a secure socket protocol implementation. Build
    an SSLContext using the `build()` method.


    ```java

    //Building the SSLContext

    SSLContext sslContext = SSLBuilder.build();

    ```


    ## Step 4 - Creating SSLConnectionFactory


    `SSLConnectionFactory` is a layered socket for TLS and SSL connections. Using
    this, you can verify the Https server.


    You can create this in many ways. Depending on the way you create, allow all hosts,
    allow self-signed certificates, allow only particular protocols, etc. To allow
    only particular protocols, create `SSLConnectionFactory` object by passing an
    SSLContext, string array representing the protocols to be supported, string array
    representing the cipher suits to be supported and a HostnameVerifier object to
    its constructor. (Note: The step description follows logical flow).


    ## Step 5 - Create an HttpClientBuilder object


    Create an HttpClientBuilder object using the `custom()` method of the `HttpClients`
    class.


    ```java

    //Creating HttpClientBuilder

    HttpClientBuilder clientbuilder = HttpClients.custom();

    ```


    ## Step 6 - Set the SSLConnectionFactory object


    Set the SSLConnectionFactory object to the `HttpClientBuilder` using the `setSSLSocketFactory()`
    method.


    ```java

    //Setting the SSLConnectionFactory

    clientbuilder = clientbuilder.setSSLSocketFactory(sslConSocFactory);

    ```


    ## Step 7 - Build the CloseableHttpClient object


    Build the `CloseableHttpClient` object by calling the `build()` method.


    ```java

    //Building the CloseableHttpClient

    CloseableHttpClient httpclient = clientbuilder.build();

    ```


    ## Step 8 - Create an HttpGet object


    The `HttpGet` class represents the HTTP GET request which retrieves the information
    of the given server using a URI. Create a HTTP GET request by instantiating the
    HttpGet class by passing a string representing the URI.


    ```java

    //Creating the HttpGet request

    HttpGet httpget = new HttpGet("https://example.com/");

    ```


    ## Step 9 - Execute the request


    Execute the request using the `execute()` method.


    ```java

    //Executing the request

    HttpResponse httpresponse = httpclient.execute(httpget);

    ```


    ## Example


    Following example demonstrates the customization of the SSLContrext −


    ```java

    import java . io . File ;

    import javax . net . ssl . SSLContext ;

    import org .apache . http . HttpEntity ;

    import org .apache . http . HttpResponse ;

    import org .apache . http . client . methods . HttpGet ;

    import org .apache . http . conn . ssl . NoopHostnameVerifier ;

    import org .apache . http . conn . ssl . SSLConnectionSocketFactory ;

    import org .apache . http . impl . client . CloseableHttpClient ;

    ```

