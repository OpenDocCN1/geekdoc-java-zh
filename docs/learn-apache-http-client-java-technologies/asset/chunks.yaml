    # Overview


    The Hypertext Transfer Protocol (HTTP) is an application-level protocol for distributed,
    collaborative, hypermedia information systems. This is the foundation for data
    communication for the World Wide Web (i.e., Internet) since 1990\. HTTP is a generic
    and stateless protocol which can be used for other purposes as well using extensions
    of its request methods, error codes, and headers.


    Basically, HTTP is a TCP/IP based communication protocol, that is used to deliver
    data (HTML files, image files, query results, etc.) on the World Wide Web. The
    default port is TCP 80, but other ports can be used as well. It provides a standardized
    way for computers to communicate with each other. HTTP specification defines how
    clients'' request data will be constructed and sent to the server, and how the
    servers respond to these requests.


    ## What is Http Client


    Http client is a transfer library, it resides on the client side, sends and receives
    HTTP messages. It provides up to date, feature-rich and, efficient implementation
    which meets the recent HTTP standards.


    In addition to this using client library, one can build HTTP based applications
    such as web browsers, web service clients, etc.


    ## Features of Http Client


    Following are the prominent features of Http client −


    *   HttpClient library implements all the available HTTP methods.


    *   HttpClient library provides APIs to secure the requests using the Secure Socket
    Layer protocol.


    *   Using HttpClient, you can establish connections using proxies.


    *   You can authenticate connections using authentication schemes such as Basic,
    Digest, NTLMv1, NTLMv2, NTLM2 Session etc.


    *   HttpClient library supports sending requests through multiple threads. It
    manages multiple connections established from various threads using **ClientConnectionPoolManager**
    .


    *   Using Apache HttpClient library, you can set connection timeouts.


    # Environment Setup


    In this chapter, we will explain how to set an environment for HttpClient in Eclipse
    IDE. Before proceeding with the installation, make sure that you already have
    Eclipse installed in your system. If not, download and install Eclipse.


    For more information on Eclipse, please refer to our **Eclipse Tutorial** .


    ## Step 1 - Download the dependency JAR file


    Open the official **homepage**  of the HttpClient (components) website and go
    to the download page


    ![Image](OEBPS/Image00000.jpg)


    Then, download the latest stable version of HttpClient . Here, throughout the
    tutorial, we are using the version 4.5.6 hence download the file **4.5.6.zip**
    .


    Within the downloaded folder, you will find a folder named **lib**  and this contains
    the required Jar files that are to be added in the classpath of your project,
    to work with HttpClient.


    ## Step 2 - Create a project and set build path


    Open eclipse and create a sample project. Right click on the project select the
    option **Build Path → Configure Build Path**  as shown below.


    ![Image](OEBPS/Image00001.jpg)


    In the **Java Build Path**  frame in the **Libraries**  tab, click on **Add External
    JARs** .


    ![Image](OEBPS/Image00002.jpg)


    And select all the jar files in the lib folder and, click on **Apply and Close**
    .


    ![Image](OEBPS/Image00003.jpg)


    You are all set to work with HttpClient library in eclipse.


    # Http Get Request


    The GET method is used to retrieve information from the given server using a given
    URI. Requests using GET should only retrieve data and should have no other effect
    on the data.


    The HttpClient API provides a class named **HttpGet**  which represents the get
    request method.


    Follow the steps given below to send a get request using HttpClient library


    ## Step 1 - Create a HttpClient object


    The **createDefault()**  method of the **HttpClients**  class returns a **CloseableHttpClient**
     object, which is the base implementation of the **HttpClient**  interface.


    Using this method, create an HttpClient object as shown below −


    CloseableHttpClient httpclient = HttpClients.createDefault();


    ## Step 2 - Create an HttpGet Object


    The **HttpGet**  class represents the HTTPGET request which retrieves the information
    of the given server using a URI.


    Create a HTTP GET request by instantiating this class. The constructor of this
    class accepts a String value representing the URI.


    HttpGet httpget = new HttpGet("http://www.tutorialspoint.com/");


    ## Step 3 - Execute the Get Request


    The **execute()**  method of the **CloseableHttpClient**  class accepts a HttpUriRequest
    (interface) object (i.e. HttpGet, HttpPost, HttpPut, HttpHead etc.) and returns
    a response object.


    Execute the request using this method as shown below −


    HttpResponse httpresponse = httpclient.execute(httpget);


    ## Example


    Following is an example which demonstrates the execution of the HTTP GET request
    using HttpClient library.


    import java . util . Scanner ;


    import org . apache . http . HttpResponse ;


    import org . apache . http . client . methods . HttpGet ;


    import org . apache . http . impl . client . CloseableHttpClient ;


    import org . apache . http . impl . client . HttpClients ;


    public class HttpGetExample {


    public static void main ( String args []) throws Exception {


    //Creating a HttpClient object


    CloseableHttpClient httpclient = HttpClients . createDefault ();


    //Creating a HttpGet object


    HttpGet httpget = new HttpGet ( "https://www.tutorialspoint.com/ " );


    //Printing the method used


    System . out . println ( "Request Type: " + httpget . getMethod ());


    //Executing the Get request


    HttpResponse httpresponse = httpclient . execute ( httpget );


    Scanner sc = new Scanner ( httpresponse . getEntity (). getContent ());


    //Printing the status line


    System . out . println ( httpresponse . getStatusLine ());


    while ( sc . hasNext ()) {


    System . out . println ( sc . nextLine ());


    }


    }


    }


    ## Output


    The above program generates the following output −


    Request Type: GET


    <!DOCTYPE html>


    <!--[if IE 8]><html class = "ie ie8"> <![endif]-->


    <!--[if IE 9]><html class = "ie ie9"> <![endif]-->


    <!--[if gt IE 9]><!-->


    <html lang = "en-US"> <!--<![endif]-->


