    \ original cookies in the server. You can create a client cookie by instantiating\
    \ the `BasicClientCookie` class. To the constructor of this class, you need to\
    \ pass the key-value pair that you desired to store in that particular cookie.\n\
    \n```java\n//Creating client cookie\nBasicClientCookie clientCookie = new BasicClientCookie(\"\
    name\",\"Raju\");\n```\n\n### Step 3 - Set values to the cookie\n\nTo a client\
    \ cookie, you can set/remove path, value, version, expiry date, domain, comment,\
    \ and attribute using the respective methods.\n\n```java\nCalendar myCal = new\
    \ GregorianCalendar(2018, 9, 26);\nDate expiryDate = myCal.getTime();\nclientcookie.setExpiryDate(expiryDate);\n\
    clientcookie.setPath(\"/\");\nclientcookie.setSecure(true);\nclientcookie.setValue(\"\
    25\");\nclientcookie.setVersion(5);\n```\n\n### Step 4 - Add cookie to the cookie\
    \ store\n\nYou can add cookies to the cookie store using the `addCookie()` method\
    \ of the `BasicCookieStore` class.\n\nAdd the required cookies to the `Cookiestore`.\n\
    \n```java\n//Adding the created cookies to cookie store\ncookiestore.addCookie(clientcookie);\n\
    ```\n\n## Example\n\nFollowing example demonstrates how to create cookies and\
    \ add them to a cookie store. Here, we created a cookie store, a bunch of cookies\
    \ by setting the domain and path values, and added these to the cookie store.\n\
    \n```java\nimport org.apache.http.client.CookieStore;\nimport org.apache.http.impl.client.BasicCookieStore;\n\
    import org.apache.http.impl.cookie.BasicClientCookie;\n\npublic class CookieHandlingExample\
    \ {\n    public static void main(String args[]) throws Exception {\n        //Creating\
    \ the CookieStore object\n        CookieStore cookiestore = new BasicCookieStore();\n\
    \        //Creating client cookies\n        BasicClientCookie clientcookie1 =\
    \ new BasicClientCookie(\"name\", \"Raju\");\n        BasicClientCookie clientcookie2\
    \ = new BasicClientCookie(\"age\", \"28\");\n        BasicClientCookie clientcookie3\
    \ = new BasicClientCookie(\"place\", \"Hyderabad\");\n        //Setting domains\
    \ and paths to the created cookies\n        clientcookie1.setDomain(\".sample.com\"\
    );\n        clientcookie2.setDomain(\".sample.com\");\n        clientcookie3.setDomain(\"\
    .sample.com\");\n        clientcookie1.setPath(\"/\");\n        clientcookie2.setPath(\"\
    /\");\n        clientcookie3.setPath(\"/\");\n        //Adding the created cookies\
    \ to cookie store\n        cookiestore.addCookie(clientcookie1);\n        cookiestore.addCookie(clientcookie2);\n\
    \        cookiestore.addCookie(clientcookie3);\n    }\n}\n```\n\n## Retrieving\
    \ a cookie\n\nYou can get the cookies added to a cookie store using `getCookies()`\
    \ method of the `asicCookieStore` class. This method returns a list which holds\
    \ all the cookies in the cookie store.\n\nYou can print the contents of a cookie\
    \ store using the `Iterator` as shown below −\n\n```java\n//Retrieving the cookies\n\
    List list = cookieStore.getCookies();\n//Creating an iterator to the obtained\
    \ list\nIterator it = list.iterator();\nwhile (it.hasNext()) {\n    System.out.println(it.next());\n\
    }\n```\n\n## Example\n\nFollowing example demonstrates how to retrieve cookies\
    \ from a cookie store. Here, we are adding a bunch of cookies to a cookie store\
    \ and retrieving them back.\n\n```java\nimport org.apache.http.client.CookieStore;\n\
    import org.apache.http.impl.client.BasicCookieStore;\nimport org.apache.http.impl.cookie.BasicClientCookie;\n\
    \npublic class CookieHandlingExample {\n    public static void main(String args[])\
    \ throws Exception {\n        //Creating the CookieStore object\n        CookieStore\
    \ cookiestore = new BasicCookieStore();\n        //Creating client cookies\n \
    \       BasicClientCookie clientcookie1 = new BasicClientCookie(\"name\", \"Raju\"\
    );\n        BasicClientCookie clientcookie2 = new BasicClientCookie(\"age\", \"\
    28\");\n        BasicClientCookie clientcookie3 = new BasicClientCookie(\"place\"\
    , \"Hyderabad\");\n        //Setting domains and paths to the created cookies\n\
    \        clientcookie1.setDomain(\".sample.com\");\n        clientcookie2.setDomain(\"\
    .sample.com\");\n        clientcookie3.setDomain(\".sample.com\");\n        clientcookie1.setPath(\"\
    /\");\n        clientcookie2.setPath(\"/\");\n        clientcookie3.setPath(\"\
    /\");\n        //Adding the created cookies to cookie store\n        cookiestore.addCookie(clientcookie1);\n\
    \        cookiestore.addCookie(clientcookie2);\n        cookiestore.addCookie(clientcookie3);\n\
    \    }\n}\n```\n\n## Output\n\nOn executing, this program generates the following\
    \ output −\n\n[version: 0][name: age][value: 28][domain: .sample.com][path: /][expiry:\
    \ null]\n[version: 0][name: name][value: Raju][domain: my.example.com][path: /][expiry:\
    \ null]\n[version: 0][name: place][value: Hyderabad][domain: .sample.com][path:\
    \ /][expiry: null]\n\n# Multiple Threads\n\nA multi-threaded program contains\
    \ two or more parts that can run concurrently and each part can handle a different\
    \ task at the same time making optimal use of the available resources.\n\nYou\
    \ can execute requests from multiple threads by writing a multithreaded `HttpClient`\
    \ program.\n\nIf you want to execute multiple client requests from threads consecutively,\
    \ you need to create a `ClientConnectionManager`. It maintains a pool of `Connections`\
    \ based on the route. If the manager has connections for a particular route, it\
    \ serves new requests from the pool instead of creating a new one. Follow the\
    \ steps to execute requests from multiple threads −\n\n### Step 1 - Creating the\
    \ Connection Pool Manager\n\nCreate the Connection Pool Manager by instantiating\
    \ the `PoolingHttpClientConnectionManager` class.\n\n```java\nPoolingHttpClientConnectionManager\
    \ connManager = new PoolingHttpClientConnectionManager();\n```\n\n### Step 2 -\
    \ Set the maximum number of connections\n\nSet the maximum number of connections\
    \ in the pool using the `setMaxTotal()` method.\n\n```java\nconnManager.setMaxTotal(100);\n\
    ```\n\n### Step 3 - Create a ClientBuilder Object\n\nCreate a `ClientBuilder`\
    \ Object by setting the connection manager using the `setConnectionManager()`\
    \ method as below −\n\n```java\nHttpClientBuilder clientbuilder = HttpClients.custom().setConnectionManager(connManager);\n\
    ```\n\n### Step 4 - Create the HttpGet request objects\n\nInstantiate the `HttpGet`\
    \ class by passing the desired `URI` to its constructor.\n\n```java\nHttpGet httpget1\
    \ = new HttpGet(\"URI1\");\nHttpGet httpget2 = new HttpGet(\"URI2\");\n```\n\n\
    ### Step 5 - Implementing the run method\n\nMake sure that you have created a\
    \ class, made it a thread (either by extending the Thread class or implementing\
    \ the `Runnable` interface) and implemented the `run` method.\n\n```java\npublic\
    \ class ClientMultiThreaded extends Thread {\n    public void run() {\n      \
    \  //Run method implementation\n    }\n}\n```\n\n### Step 6 - Create Thread objects\n\
    \nCreate thread objects by instantiating the Thread class (`ClientMultiThreaded`)\
    \ created above. Pass a `HttpClient` object, respective `HttpGet` object and,\
    \ an integer representing the ID to these threads.\n\n```java\nClientMultiThreaded\
    \ thread1 = new ClientMultiThreaded(httpclient,httpget1, 1);\nClientMultiThreaded\
    \ thread2 = new ClientMultiThreaded(httpclient,httpget2, 2);\n```\n\n### Step\
    \ 7 - Start and join the threads\n\nStart all the threads using `start()` method\
    \ and join them using the `join()` method.\n\n```java\nthread1.start();\nthread2.start();\n\
    thread1.join();\nthread2.join();\n```\n\n### Step 8 - Run method implementation\n\
    \nWithin the run method, execute the request, retrieve the response and print\
    \ the results.\n"
