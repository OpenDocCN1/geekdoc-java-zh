    # Interceptors


    Interceptors are those which helps to obstruct or change requests or responses.
    Protocol interceptors in general act upon a specific header or a group of related
    headers. HttpClient library provides support for interceptors.


    ## Request interceptor


    The **HttpRequestInterceptor**  interface represents the request interceptors.
    This interface contains a method known as a process in which you need to write
    the chunk of code to intercept the requests.


    On the client side, this method verifies/processes the requests before sending
    them to the server and, on the server side, this method is executed before evaluating
    the body of the request.


    ### Creating request interceptor


    You can create a request interceptor by following the steps given below.


    Step 1 - Create an object of HttpRequestInterceptor


    Create an object of the HttpRequestInterceptor interface by implementing its abstract
    method process.


    HttpRequestInterceptor requestInterceptor **= new** HttpRequestInterceptor() {


    @Override


    public void process ( HttpRequest request , HttpContext context ) throws


    HttpException , IOException {


    //Method implementation . . . . .


    };


    Step 2 - Instantiate CloseableHttpClient object


    Build a custom **CloseableHttpClient**  object by adding above created interceptor
    to it as shown below −


    //Creating a CloseableHttpClient object


    CloseableHttpClient httpclient =


    HttpClients.*custom()* .addInterceptorFirst(requestInterceptor).build();


    Using this object, you can carry out the request executions as usual.


    ### Example


    Following example demonstrates the usage of request interceptors. In this example,
    we have created a HTTP GET request object and added three headers: sample-header,
    demoheader, and test-header to it.


    In the **processor()**  method of the interceptor, we are verifying the headers
    of the request sent; if any of those headers is **sample-header** , we are trying
    to remove it and display the list of headers of that particular request.


    import java . io . IOException ;


    import org . apache . http . Header ;


    import org . apache . http . HttpException ;


    import org . apache . http . HttpRequest ;


    import org . apache . http . HttpRequestInterceptor ;


    import org . apache . http . HttpResponse ;


    import org . apache . http . client . methods . HttpGet ;


    import org . apache . http . impl . client . CloseableHttpClient ;


    import org . apache . http . impl . client . HttpClients ;


    import org . apache . http . message . BasicHeader ;


    import org . apache . http . protocol . HttpContext ;


    public class InterceptorsExample {


    public static void main ( String args []) throws Exception {


    //Creating an HttpRequestInterceptor


    HttpRequestInterceptor requestInterceptor = new HttpRequestInterceptor () {


    @Override


    public void process ( HttpRequest request , HttpContext context ) throws


    HttpException , IOException {


    if ( request . containsHeader ( "sample-header" )) {


    System . out . println ( "Contains header sample-header, removing it.." );


    request . removeHeaders ( "sample-header" );


    }


    //Printing remaining list of headers


    Header [] headers = request . getAllHeaders ();


    for ( int i = 0 ; i < headers . length ; i ++) {


    System . out . println ( headers [ i ]. getName ());


    }


    }


    };


    //Creating a CloseableHttpClient object


    CloseableHttpClient httpclient =


    HttpClients . custom () . addInterceptorFirst ( requestInterceptor ). build ();


    //Creating a request object


    HttpGet httpget1 = new HttpGet ( "https://www.tutorialspoint.com/" );


    //Setting the header to it


    httpget1 . setHeader ( new BasicHeader ( "sample-header" , "My first header" ));


    httpget1 . setHeader ( new BasicHeader ( "demo-header" , "My second header" ));


    httpget1 . setHeader ( new BasicHeader ( "test-header" , "My third header" ));


    //Executing the request


    HttpResponse httpresponse = httpclient . execute ( httpget1 );


    //Printing the status line


    System . out . println ( httpresponse . getStatusLine ());


    }


    }


