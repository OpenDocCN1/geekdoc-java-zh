    # Aborting a Request


    You can abort the current HTTP request using the **abort()**  method, i.e., after
    invoking this method, on a particular request, execution of it will be aborted.


    If this method is invoked after one execution, responses of that execution will
    not be affected and the subsequent executions will be aborted.


    ## Example


    If you observe the following example, we have created a HttpGet request, printed
    the request format used using the **getMethod()** .


    Then, we have carried out another execution with the same request. Printed the
    status line using the 1 ^(st)  execution again. Finally, printed the status line
    of the second execution.


    As discussed, the responses of the 1 ^(st)  execution (execution before abort
    method) are printed (including the second status line that is written after the
    abort method) and, all the subsequent executions of the current request after
    the abort method are failed invoking an exception.


