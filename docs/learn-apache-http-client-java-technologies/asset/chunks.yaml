    \ are those which helps to obstruct or change requests or responses. Protocol\
    \ interceptors in general act upon a specific header or a group of related headers.\
    \ `HttpClient` library provides support for interceptors.\n\n### Request interceptor\n\
    \nThe `HttpRequestInterceptor` interface represents the request interceptors.\
    \ This interface contains a method known as a `process` in which you need to write\
    \ the chunk of code to intercept the requests.\n\nOn the client side, this method\
    \ verifies/processes the requests before sending them to the server and, on the\
    \ server side, this method is executed before evaluating the body of the request.\n\
    \n### Creating request interceptor\n\nYou can create a request interceptor by\
    \ following the steps given below.\n\n#### Step 1 - Create an object of `HttpRequestInterceptor`\n\
    \nCreate an object of the `HttpRequestInterceptor` interface by implementing its\
    \ abstract method `process`.\n\n```java\nHttpRequestInterceptor requestInterceptor\
    \ = new HttpRequestInterceptor() {\n    @Override\n    public void process ( HttpRequest\
