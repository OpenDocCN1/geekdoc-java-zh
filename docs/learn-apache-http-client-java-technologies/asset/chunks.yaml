    # Response Handlers


    Processing the HTTP responses using the response handlers is recommended. In this
    chapter, we are going to discuss how to create response handlers and how to use
    them to process a response.


    If you use the response handler, all the HTTP connections will be released automatically.


    ## Creating a response handler


    The HttpClient API provides an interface known as **ResponseHandler**  in the
    package **org.apache.http.client.**  In order to create a response handler, implement
    this interface and override its **handleResponse()**  method.


    Every response has a status code and if the status code is in between 200 and
    300, that means the action was successfully received, understood, and accepted.
    Therefore, in our example, we will handle the entities of the responses with such
    status codes.


    ## Executing the request using response handler


    Follow the steps given below to execute the request using a response handler.


    ## Step 1 - Create an HttpClient Object


    The **createDefault()**  method of the **HttpClients**  class returns an object
    of the class **CloseableHttpClient** , which is the base implementation of the **HttpClient**
     interface. Using this method create an HttpClient object


    CloseableHttpClient httpclient = HttpClients.createDefault();


    ## Step 2 - Instantiate the Response Handler


    Instantiate the response handler object created above using the following line
    of code −


    ResponseHandler<String> responseHandler = new MyResponseHandler();


    ## Step 3 - Create a HttpGet Object


    The **HttpGet**  class represents the HTTP GET request which retrieves the information
    of the given server using a URI.


    Create an HttpGet request by instantiating the HttpGet class and by passing a
    string representing the URI as a parameter to its constructor.


    ResponseHandler<String> responseHandler = new MyResponseHandler();


    ## Step 4 - Execute the Get request using response handler


    The **CloseableHttpClient**  class has a variant of **execute()**  method which
    accepts two objects **ResponseHandler**  and HttpUriRequest, and returns a response
    object.


    String httpResponse = httpclient.execute(httpget, responseHandler);


    ## Example


    Following example demonstrates the usage of response handlers.


    import java . io . IOException ;


    import org . apache . http . HttpEntity ;


    import org . apache . http . HttpResponse ;


    import org . apache . http . client . ResponseHandler ;


    import org . apache . http . client . methods . HttpGet ;


    import org . apache . http . impl . client . CloseableHttpClient ;


    import org . apache . http . impl . client . HttpClients ;


    import org . apache . http . util . EntityUtils ;'
