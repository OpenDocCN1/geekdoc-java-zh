    \n# Overview\n\nThe Hypertext Transfer Protocol (HTTP) is an application-level\
    \ protocol for distributed, collaborative, hypermedia information systems. This\
    \ is the foundation for data communication for the World Wide Web (i.e., Internet)\
    \ since 1990. HTTP is a generic and stateless protocol which can be used for other\
    \ purposes as well using extensions of its request methods, error codes, and headers.\n\
    \nBasically, HTTP is a TCP/IP based communication protocol, that is used to deliver\
    \ data (HTML files, image files, query results, etc.) on the World Wide Web. The\
    \ default port is TCP 80, but other ports can be used as well. It provides a standardized\
    \ way for computers to communicate with each other. HTTP specification defines\
    \ how clients' request data will be constructed and sent to the server, and how\
    \ the servers respond to these requests.\n\n## What is Http Client\n\nHttp client\
    \ is a transfer library, it resides on the client side, sends and receives HTTP\
    \ messages. It provides up to date, feature-rich and, efficient implementation\
    \ which meets the recent HTTP standards.\n\nIn addition to this using client library,\
    \ one can build HTTP based applications such as web browsers, web service clients,\
    \ etc.\n\n## Features of Http Client\n\nFollowing are the prominent features of\
    \ Http client:\n\n- `HttpClient` library implements all the available HTTP methods.\n\
    - `HttpClient` library provides APIs to secure the requests using the Secure Socket\
    \ Layer protocol.\n- Using `HttpClient`, you can establish connections using proxies.\n\
    - You can authenticate connections using authentication schemes such as Basic,\
    \ Digest, NTLMv1, NTLMv2, NTLM2 Session etc.\n- `HttpClient` library supports\
    \ sending requests through multiple threads. It manages multiple connections established\
    \ from various threads using `ClientConnectionPoolManager`.\n- Using Apache `HttpClient`\
    \ library, you can set connection timeouts.\n\n# Environment Setup\n\nIn this\
    \ chapter, we will explain how to set an environment for `HttpClient` in Eclipse\
    \ IDE. Before proceeding with the installation, make sure that you already have\
    \ Eclipse installed in your system. If not, download and install Eclipse.\n\n\
    For more information on Eclipse, please refer to our `Eclipse Tutorial`.\n\n##\
    \ Step 1 - Download the dependency JAR file\n\nOpen the official `homepage` of\
    \ the `HttpClient` (components) website and go to the download page.\n\n![Image](OEBPS/Image00000.jpg)\n\
    \nThen, download the latest stable version of `HttpClient`. Here, throughout the\
    \ tutorial, we are using the version 4.5.6 hence download the file `4.5.6.zip`.\n\
    \nWithin the downloaded folder, you will find a folder named `lib` and this contains\
    \ the required Jar files that are to be added in the classpath of your project,\
    \ to work with `HttpClient`.\n\n## Step 2 - Create a project and set build path\n\
    \nOpen eclipse and create a sample project. Right click on the project select\
    \ the option `Build Path → Configure Build Path` as shown below.\n\n![Image](OEBPS/Image00001.jpg)\n\
    \nIn the `Java Build Path` frame in the `Libraries` tab, click on `Add External\
    \ JARs`.\n\n![Image](OEBPS/Image00002.jpg)\n\nAnd select all the jar files in\
    \ the `lib` folder and, click on `Apply and Close`.\n\n![Image](OEBPS/Image00003.jpg)\n\
    \n# Http Get Request\n\nThe `GET` method is used to retrieve information from\
    \ the given server. Using `GET` should only retrieve data and have no other effect\
    \ on the data.\n\n## Step 1 - Create a HttpClient object\n\nThe `createDefault()`\
    \ method of `HttpClients` returns a `CloseableHttpClient` object.\n\n`CloseableHttpClient\
    \ httpclient = HttpClients.createDefault();`\n\n## Step 2 - Create an HttpGet\
    \ Object\n\nThe constructor of this class accepts a String value representing\
    \ the URI.\n\n`HttpGet httpget = new HttpGet(\"http://www.tutorialpoint.com/\"\
    );`\n\n## Step 3 - Execute the Get Request\n\nThe `execute()` method of `CloseableHttpClient`\
    \ accepts a `HttpRequest` object and returns a `HttpResponse`.\n\n`HttpResponse\
    \ httpresponse = httpclient.execute(httpget);`\n\n## Example\n\nFollowing is an\
    \ example which demonstrates the execution of the HTTP GET request using HttpClient\
    \ library.\n\n```java\nimport java.util.Scanner;\nimport org.apache.http.HttpResponse;\n\
    import org.apache.http.client.HttpGet;\nimport org.apache.http.impl.client.CloseableHttpClient;\n\
    import org.apache.http.impl.client.HttpClients;\n\npublic class HttpGetExample\
    \ {\n    public static void main(String[] args) throws Exception {\n        //\
    \ Creating a HttpClient object\n        CloseableHttpClient httpclient = HttpClients.createDefault();\n\
    \n        // Creating a HttpGet object\n        HttpGet httpget = new HttpGet(\"\
    https://www.tutorialpoint.com/\");\n\n        // Printing the method used\n  \
    \      System.out.println(\"Request Type: \" + httpget.getMethod());\n\n     \
    \   // Executing the Get request\n        HttpResponse httpresponse = httpclient.execute(httpget);\n\
    \        Scanner sc = new Scanner(httpresponse.getEntity().getContent());\n\n\
    \        // Printing the status line\n        System.out.println(httpresponse.getStatusLine());\n\
    \        while (sc.hasNext()) {\n            System.out.println(sc.nextLine());\n\
    \        }\n    }\n}\n```\n\n## Output\n\nThe above program generates the following\
    \ output:\n\n```\nRequest Type: GET\n<!DOCTYPE html>\n<!--[if IE 8]><html class\
    \ = \"ie8\"> <![endif]-->\n<!--[if IE 9]><html class = \"ie9\"> <![endif]-->\n\
    <!--[if gt IE 9]><!-->\n<html lang = \"en-US\"> <!--<!endif]-->\n...\n```\n"
