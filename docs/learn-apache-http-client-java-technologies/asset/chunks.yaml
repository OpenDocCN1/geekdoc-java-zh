    \   //Method implementation . . . . .\n    }\n};\n```\n\n#### Step 2 - Instantiate\
    \ `CloseableHttpClient` object\n\nBuild a custom `CloseableHttpClient` object\
    \ by adding above created interceptor to it as shown below −\n\n```java\n//Creating\
    \ a CloseableHttpClient object\nCloseableHttpClient httpclient =\nHttpClients.custom().addInterceptorFirst(requestInterceptor).build();\n\
    ```\n\nUsing this object, you can carry out the request executions as usual.\n\
    \n### Example\n\nFollowing example demonstrates the usage of request interceptors.\
    \ In this example, we have created a HTTP GET request object and added three headers:\
    \ `sample-header`, `demoheader`, and `test-header` to it.\n\nIn the `processor()`\
    \ method of the interceptor, we are verifying the headers of the request sent;\
    \ if any of those headers is `sample-header`, we are trying to remove it and display\
    \ the list of headers of that particular request.\n\n```java\nimport java . io\
    \ . IOException ;\nimport org . apache . http . Header ;\nimport org . apache\
    \ . http . HttpException ;\nimport org . apache . http . HttpRequest ;\nimport\
    \ org . apache . http . HttpRequestInterceptor ;\nimport org . apache . http .\
    \ HttpResponse ;\nimport org . apache . http . client . methods . HttpGet ;\n\
    import org . apache . http . impl . client . CloseableHttpClient ;\nimport org\
    \ . apache . http . impl . client . HttpClients ;\nimport org . apache . http\
    \ . message . BasicHeader ;\nimport org . apache . http . protocol . HttpContext\
    \ ;\n\npublic class InterceptorsExample {\n    public static void main ( String\
    \ args []) throws Exception {\n        //Creating an HttpRequestInterceptor\n\
    \        HttpRequestInterceptor requestInterceptor = new HttpRequestInterceptor\
    \ () {\n            @Override\n            public void process ( HttpRequest request\
    \ , HttpContext context ) throws HttpException , IOException {\n             \
    \   if ( request . containsHeader ( \"sample-header\" )) {\n                 \
    \   System . out . println ( \"Contains header sample-header, removing it..\"\
    \ );\n                    request . removeHeaders ( \"sample-header\" );\n   \
    \             }\n                //Printing remaining list of headers\n      \
    \          Header [] headers = request . getAllHeaders ();\n                for\
    \ ( int i = 0 ; i < headers . length ; i ++) {\n                    System . out\
    \ . println ( headers [ i ]. getName ());\n                }\n            }\n\
    \        };\n\n        //Creating a CloseableHttpClient object\n        CloseableHttpClient\
    \ httpclient =\n        HttpClients . custom () . addInterceptorFirst ( requestInterceptor\
    \ ). build ();\n\n        //Creating a request object\n        HttpGet httpget1\
    \ = new HttpGet ( \"https://www.tutorialspoint.com/\" );\n\n        //Setting\
    \ the header to it\n        httpget1 . setHeader ( new BasicHeader ( \"sample-header\"\
