    # Multipart Upload


    Using HttpClient, we can perform Multipart upload, i.e., we can upload larger
    objects in smaller parts. In this chapter, we demonstrate the multipart upload
    in HTTP client by uploading a simple text file.


    In general, any multipart upload contains three parts.


    *   Initiation of the upload


    *   Uploading the object parts


    *   Completing the Multipart upload


    For the multipart upload using HttpClient, we need to follow the below steps −


    *   Create a multipart builder.


    *   Add desired parts to it.


    *   Complete the build and obtain a multipart HttpEntity.


    *   Build request by setting the above muti-part entity.


    *   Execute the request.


    Following are the steps to upload a multipart entity using the HttpClient library.


    ## Step 1 - Create an HttpClient object


    The **createDefault()**  method of the **HttpClients**  class returns an object
    of the class **CloseableHttpClient** , which is the base implementation of the
    HttpClient interface. Using this method, create an HttpClient object −


    //Creating CloseableHttpClient object


    CloseableHttpClient httpclient = HttpClients.createDefault();


    ## Step 2 - Create a FileBody object


    **FileBody**  class represents the binary body part backed by a file. Instantiate
    this class by passing a **File**  object and a **ContentType**  object representing
    the type of the content.


    //Creating a File object


    File file = new File("sample.txt");


    //Creating the FileBody object


    FileBody filebody = new FileBody(file, ContentType.DEFAULT_BINARY);


    ## Step 3 - Create a MultipartEntityBuilder


    The **MultipartEntityBuilder**  class is used to build the multi-part **HttpEntity**
     object. Create its object using the **create()**  method (of the same class).


    //Creating the MultipartEntityBuilder


    MultipartEntityBuilder entitybuilder = MultipartEntityBuilder.create();


    ## Step 4 - Set the mode


    A **MultipartEntityBuilder**  has three modes: STRICT, RFC6532, and BROWSER_COMPATIBLE.
    Set it to the desired mode using the **setMode()**  method.


    //Setting the mode


    entitybuilder.setMode(HttpMultipartMode.BROWSER_COMPATIBLE);


    ## Step 5 - Add various the desired parts


    Using the methods **addTextBody()** , addPart() and, **addBinaryBody()** , you
    can add simple text, files, streams, and other objects to a **MultipartBuilder**
    . Add the desired contents using these methods.


    //Adding text


    entitybuilder.addTextBody("sample_text", "This is the text part of our file");


    //Adding a file


    entitybuilder.addBinaryBody("image", new File("logo.png"));


    ## Step 6 - Building single entity


    You can build all these parts to a single entity using the **build()**  method
    of the **MultipartEntityBuilder**  class. Using this method, build all the parts
    into a single **HttpEntity** .


    //Building a single entity using the parts


    HttpEntity mutiPartHttpEntity = entityBuilder.build();


    ## Step 7 - Create a RequestBuilder object


    The class **RequestBuilder**  is used to build request by adding parameters to
    it. If the request is of type PUT or POST, it adds the parameters to the request
    as URL encoded entity.


    Create a RequestBuilder object (of type POST) using the **post()**  method. And
    pass the Uri to which you wanted to send the request it as a parameter.


    //Building the post request object


    RequestBuilder reqbuilder = RequestBuilder.post("http://httpbin.org/post");


    ## Step 8 - Set the entity object to the RequestBuilder


    Set the above created multipart entity to the RequestBuilder using the **setEntity()**
     method of the **RequestBuilder**  class.


    //Setting the entity object to the RequestBuilder


    reqbuilder.setEntity(mutiPartHttpEntity);


    ## Step 9 - Build the HttpUriRequest


    Build a **HttpUriRequest**  request object using the **build()**  method of the **RequestBuilder**
     class.


    //Building the request


    HttpUriRequest multipartRequest = reqbuilder.build();


    ## Step 10 - Execute the request


    Using the **execute()**  method, execute the request built in the previous step
    (bypassing the request as a parameter to this method).


    //Executing the request


    HttpResponse httpresponse = httpclient.execute(multipartRequest);


