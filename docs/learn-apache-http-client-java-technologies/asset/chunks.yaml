    \n## 响应拦截器\n\n`HttpResponseInterceptor` 接口表示响应拦截器。该接口包含一个名为 `process()` 的方法。在此方法中，你需要编写拦截响应的代码。\n\
    \n在服务器端，此方法在将响应发送到客户端之前对其进行验证/处理；在客户端，此方法在评估响应体之前被执行。\n\n### 创建响应拦截器\n\n你可以按照下面的步骤创建响应拦截器：\n\
