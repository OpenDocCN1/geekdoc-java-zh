    \ apache . http . message . BasicHeader ;\nimport org . apache . http . protocol\
    \ . HttpContext ;\n\npublic class InterceptorsExample {\n    public static void\
    \ main ( String args []) throws Exception {\n        // 创建一个 HttpRequestInterceptor\n\
    \        HttpRequestInterceptor requestInterceptor = new HttpRequestInterceptor\
    \ () {\n            @Override\n            public void process ( HttpRequest request\
    \ , HttpContext context ) throws HttpException , IOException {\n             \
    \   if ( request . containsHeader ( \"sample-header\" )) {\n                 \
    \   System . out . println ( \"Contains header sample-header, removing it..\"\
    \ );\n                    request . removeHeaders ( \"sample-header\" );\n   \
    \             }\n                // 打印剩余的头列表\n                Header [] headers\
    \ = request .getAllHeaders ();\n                for ( int i = 0 ; i < headers\
    \ . length ; i ++) {\n                    System . out . println ( headers [ i\
    \ ].getName ());\n                }\n            }\n        };\n\n        // 创建一个\
    \ CloseableHttpClient 对象\n        CloseableHttpClient httpclient =\n        HttpClients\
    \ . custom () . addInterceptorFirst ( requestInterceptor ). build ();\n\n    \
    \    // 创建一个请求对象\n        HttpGet httpget1 = new HttpGet ( \"https://www.tutorialspoint.com/\"\
    \ );\n\n        // 为其设置头\n        httpget1 . setHeader ( new BasicHeader ( \"\
    sample-header\" , \"My first header\" ));\n        httpget1 . setHeader ( new\
    \ BasicHeader ( \"demo-header\" , \"My second header\" ));\n        httpget1 .\
    \ setHeader ( new BasicHeader ( \"test-header\" , \"My third header\" ));\n\n\
    \        // 执行请求\n        HttpResponse httpresponse = httpclient . execute ( httpget1\
    \ );\n\n        // 打印状态行\n        System . out . println ( httpresponse . getStatusLine\
    \ ());\n    }\n}\n```\n\n#### 输出\n\n执行上述程序后，生成的如下输出 −\n\n```\nContains header\
