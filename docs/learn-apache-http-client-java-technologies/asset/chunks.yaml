    ```\n\n#### Step 2 - Instantiate `CloseableHttpClient` object\n\nBuild a custom\
    \ `CloseableHttpClient` object by adding above created interceptor to it as shown\
    \ below −\n\n```java\n//Creating a CloseableHttpClient object\nCloseableHttpClient\
