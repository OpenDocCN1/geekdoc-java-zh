- "# 学习 Apache HTTP Client (JAVA 技术)\n\n\n\n\n\n\n我想将这本书献给将使用它的学生们。祝愿你们未来的职业取得成功，希望你们永不停学习。\n\
  \n\n# 概述\n\n超文本传输协议 (HTTP) 是一种用于分布式、协作、超媒体信息系统的应用程序协议。自 1990 年以来，它是万维网（即互联网）数据通信的基础。HTTP\
  \ 是一种通用且无状态的协议，可以通过扩展其请求方法、错误代码和请求头用于其他用途。\n\n简单来说，HTTP 是一种基于 TCP/IP 的通信协议，用于在万维网上上传输数据（HTML\
  \ 文件、图像文件、查询结果等）。默认端口是 TCP 80，但也可以使用其他端口。它为计算机之间的通信提供了标准化方法。HTTP 规范定义了客户端请求数据如何构建并发送到服务器，以及服务器如何响应这些请求。\n\
  \n## 什么是 Http Client\n\nHttp client 是一个传输库，它位于客户端，负责发送和接收 HTTP 消息。它提供了最新的、功能丰富且高效的实现，符合最近\
  \ HTTP 标准。\n\n此外，使用客户端库可以构建基于 HTTP 的应用程序，如 Web 浏览器、Web 服务客户端等。\n\n## Http Client\
  \ 的特性\n\n以下是 Http client 的显著特性：\n\n- `HttpClient` 库实现了所有可用的 HTTP 方法。\n- `HttpClient`\
  \ 库提供了使用安全套接层（SSL）协议保护请求的 API。\n- 使用 `HttpClient`，你可以通过代理建立连接。\n- 你可以使用 Basic、Digest、NTLMv1、NTLMv2、NTLM2\
  \ Session 等认证方案对连接进行认证。\n- `HttpClient` 库支持通过多线程发送请求。它使用 `ClientConnectionPoolManager`\
  \ 管理从各个线程建立的多个连接。\n- 使用 Apache `HttpClient` 库，你可以设置连接超时。\n\n# 环境搭建\n\n在本章中，我们将解释如何在\
  \ Eclipse IDE 中为 `HttpClient` 设置环境。在继续安装之前，请确保你的系统中已经安装了 Eclipse。如果没有，请下载并安装 Eclipse。\n\
  \n有关 Eclipse 的更多信息，请参阅我们的 `Eclipse 教程`。\n\n## 第一步 - 下载依赖 JAR 文件\n\n打开 `HttpClient`（组件）网站的官方`首页`\
  \ 并进入下载页面。\n\n![Image](img/Image00000.jpg)\n\n然后，下载最新版本的 `HttpClient`。在整个教程中，我们使用的版本是\
  \ 4.5.6，因此下载文件 `4.5.6.zip`。\n\n在下载的文件夹中，你会找到一个名为 `lib` 的文件夹，其中包含了需要添加到项目类路径（classpath）的所需的\
  \ Jar 文件，以便 `HttpClient`## 第二步 - 创建项目并设置构建路径\n\n打开 eclipse 并创建一个项目。右键点击项目，选择所示的\
  \ `Build Path → Configure Build Path`。![Image](img/Image0001.jpg)\n\n在 `Java Build\
  \ Path` 窗口中，点击 `Libraries` 选项卡。![Image](img/Image0002.jpg)\n\n选择 `lib` 文件夹中的所有 jar\
  \ 文件，然后点击 `Apply and Close`。![Image](img/Image0003.jpg)\n\n# Http Get 请求\n\n`GET`\
  \ 方法用于从指定的服务器检索信息。使用 `GET` 只会检索数据而不产生其他影响。\n\n## 第一步 - 创建 HttpClient 对象\n\n`HttpClients`\
  \ 的 `createDefault()` 方法返回一个 `CloseableHttpClient` 对象。\n\n`CloseableHttpClient httpclient\
  \ = HttpClients.createDefault();`\n\n## 第二步 - 创建 HttpGet 对象\n\n该类的构造函数接受代表 URI 的字符串值。\n\
  \n`HttpGet httpget = new HttpGet(\"http://www.tutorialpoint.com/\");`\n\n## 第三步\
  \ - 执行 Get 请求\n\n`CloseableHttpClient` 的 `execute()` 方法接受一个 `HttpRequest` 对象并返回一个\
  \ `HttpResponse`。\n\n`HttpResponse httpresponse = httpclient.execute(httpget);`\n\
  \n### 示例\n\n下面的示例演示了使用 HttpClient 库执行 HTTP GET 请求。\n\n```java\nimport java.util.Scanner;\n\
  import org.apache.http.HttpResponse;\nimport org.apache.http.client.HttpGet;\nimport\
  \ org.apache.http.impl.client.CloseableHttpClient;\nimport org.apache.http.impl.client.HttpClients;\n\
  \npublic class HttpGetExample {\n    public static void main(String[] args) throws\
  \ Exception {\n        // 创建 HttpClient 对象\n        CloseableHttpClient httpclient\
  \ = HttpClients.createDefault();\n\n        // 创建 HttpGet 对象\n        HttpGet httpget\
  \ = new HttpGet(\"https://www.tutorialpoint.com/\");\n\n        // 打印方法\n      \
  \  System.out.println(\"Request Type: \" + httpget.getMethod());\n\n        // 执行\
  \ Get 请求\n        HttpResponse httpresponse = httpclient.execute(httpget);\n   \
  \     Scanner sc = new Scanner(httpresponse.getEntity().getContent());\n\n     \
  \   // 打印状态行\n        System.out.println(httpresponse.getStatusLine());\n      \
  \  while (sc.hasNext()) {\n            System.out.println(sc.nextLine());\n    \
  \    }\n    }\n}\n```\n\n#### 输出\n\n上面的程序产生以下输出：\n\n```\nRequest Type: GET\n<!DOCTYPE\
  \ html>\n<!--[if IE 8]><html class = \"ie8\"> <![endif]-->\n<!--[if IE 9]><html\
  \ class = \"ie9\"> <![endif]-->\n<!--[if gt IE 9]><!-->\n<html lang = \"en-US\"\
  > <!--<!endif]-->\n...\n```\n\n\n\n\n\n# Http Post 请求\n\nPOST 请求用于向服务器发送数据；例如使用\
  \ HTML 表单发送客户信息、文件上传等。\n\n`HttpClient` API 提供一个名为 `HttpPost` 的类，该类表示 POST 请求。\n\n\
  请按照下面提供的步骤，使用 HttpClient 库发送 HTTP POST 请求。\n\n## 步骤 1 - 创建 HttpClient 对象\n\n`HttpClients`\
  \ 类的 `createDefault()` 方法返回一个 `CloseableHttpClient` 类的对象，该类是 `HttpClient` 接口的基础实现。\n\
  \n使用该方法可以创建一个 HttpClient 对象。\n\n```java\nCloseableHttpClient httpClient = HttpClients.createDefault();\n\
  ```\n\n## 步骤 2 - 创建 HttpPost 对象\n\n`HttpPost` 类表示 `HTTP POST` 请求。它使用 URI 发送所需的数据并获取指定服务器的信息。\n\
  \n通过实例化 `HttpPost` 类来创建此请求，并将代表 URI 的字符串值作为参数传递给构造函数。\n\n```java\nHttpGet httpGet\
  \ = new HttpGet(\"http://www.tutorialspoint.com/\");\n```\n\n## 步骤 3 - 执行 Get 请求\n\
  \n`CloseableHttpClient` 对象的 `execute()` 方法接受一个 `HttpUriRequest`（接口）对象（即 `HttpGet`、`HttpPost`、`HttpPut`、`HttpHead`\
  \ 等）并返回响应对象。\n\n```java\nHttpResponse httpResponse = httpclient.execute(httpget);\n\
  ```\n\n### 示例\n\n下面是一个演示如何使用 HttpClient 库执行 HTTP POST 请求的示例。\n\n```java\nimport\
  \ org . apache . http . HttpResponse ;\nimport org .apache . http . client . methods\
  \ . HttpPost ;\nimport org .apache . http . impl . client . CloseableHttpClient\
  \ ;\nimport org .apache . http . impl . client . HttpClients ;\n\npublic class HttpPostExample\
  \ {\n    public static void main ( String args []) throws Exception {\n        //Creating\
  \ a HttpClient object\n        CloseableHttpClient httpclient = HttpClients . createDefault\
  \ ();\n        //Creating a HttpGet object\n        HttpPost httppost = new HttpPost\
  \ ( \"https://www.tutorialspoint.com/\" );\n        //Printing the method used\n\
  \        System . out . println ( \"Request Type: \" + httppost . getMethod ());\n\
  \        //Executing the Get request\n        HttpResponse httpresponse = httpclient\
  \ . execute ( httppost );\n        Scanner sc = new Scanner ( httpresponse . getEntity\
  \ (). getContent ());\n        //Printing the status line\n        System . out\
  \ . println ( httpresponse . getStatusLine ());\n        while ( sc . hasNext ())\
  \ {\n            System . out . println ( sc . nextLine ());\n        }\n    }\n\
  }\n```\n\n#### 输出\n\n上述程序将生成以下输出。\n\n\n\n\n```java\nclass MyResponseHandler implements\
  \ ResponseHandler < String > {\n\n    public String handleResponse(final HttpResponse\
  \ response) throws IOException {\n        //Get the status of the response\n   \
  \     int status = response.getStatusLine().getStatusCode();\n        if (status\
  \ >= 200 && status < 300) {\n            HttpEntity entity = response.getEntity();\n\
  \            if (entity == null) {\n                return \"\";\n            }\
  \ else {\n                return EntityUtils.toString(entity);\n            }\n\
  \        } else {\n            return \"\" + status;\n        }\n    }\n}\n\npublic\
  \ class ResponseHandlerExample {\n    public static void main(String args[]) throws\
  \ Exception {\n        //Create an HttpClient object\n        CloseableHttpClient\
  \ httpclient = HttpClients.createDefault();\n        //instantiate the response\
  \ handler\n        ResponseHandler < String > responseHandler = new MyResponseHandler();\n\
  \        //Create an HttpGet object\n        HttpGet httpget = new HttpGet(\"http://www.tutorialspoint.com/\"\
  );\n        //Execute the Get request by passing the response handler object and\
  \ HttpGet object\n        String httpresponse = httpclient.execute(httpget, responseHandler);\n\
  \        System.out.println(httpresponse);\n    }\n}\n```\n\n上述程序生成了以下输出 −\n\n```html\n\
  <!DOCTYPE html>\n<!--[if IE 8]><html class = \"ie ie8\"> <![endif]-->\n<!--[if IE\
  \ 9]><html class = \"ie ie9\"> <![endif]-->\n<!--[if gt IE 9]><!-->\n<html lang\
  \ = \"en-US\"> <!--<!endif]-->\n<head>\n<!-- Basic -->\n<meta charset = \"utf-8\"\
  >\n<meta http-equiv = \"X-UA-Compatible\" content = \"IE = edge\">\n<meta name =\
  \ \"viewport\" content = \"width = device-width,initial-scale = 1.0,userscalable\
  \ = yes\">\n<link href = \"https://cdn.muicss.com/mui-0.9.39/extra/mui-rem.min.css\"\
  \ rel = \"stylesheet\" type = \"text/css\" />\n<link rel = \"stylesheet\" href =\
  \ \"/questions/css/home.css?v = 3\" />\n<script src = \"/questions/js/jquery.min.js\"\
  ></script>\n<script src = \"/questions/js/fontawesome.js\"></script>\n<script src\
  \ = \"https://cdn.muicss.com/mui-0.9.39/js/mui.min.js\"></script>\n</head>\n. .\
  \ . . . . . . . . . .\n<script>\nwindow.dataLayer = window.dataLayer || [];\nfunction\
  \ gtag() {dataLayer.push(arguments);}\ngtag('js', new Date());\ngtag('config', 'UA-232293-17');\n\
  </script>\n</body\n```\n\n# 关闭连接\n\n如果你是手动处理 HTTP 响应而不是使用响应处理器，你需要手动关闭所有的 http 连接。本章解释了如何手动关闭连接。\n\
  \n在手动关闭 HTTP 连接时请遵循以下步骤 −\n\n## 第 1 步 - 创建 HttpClient 对象\n\n`HttpClients` 类的 `createDefault()`\
  \ 方法返回 `CloseableHttpClient` 类的对象，它是 `HttpClient` 接口的基础实现。\n\n使用此方法创建如下所示的 `HttpClient`\
  \ 对象 −\n\n```java\nCloseableHttpClient httpClient = HttpClients.createDefault();\n\
  ```\n\n## 第 2 步 - 启动 try-finally 块\n\n启动一个 try-finally 块，将程序中的剩余代码写入 try 块，并在 finally\
  \ 块中关闭 `CloseableHttpClient` 对象。\n\n```java\nCloseableHttpClient httpClient = HttpClients.createDefault();\n\
  try {\n    //剩余代码 . . . . . . . . . . . .\n} finally {\n    httpClient.close();\n\
  }\n```\n\n## 第 3 步 - 创建 HttpGet 对象\n\n`HttpGet` 类表示 HTTP GET 请求，它使用 URI 获取给定服务器的信息。\n\
  \n通过传递表示 URI 的字符串实例化 `HttpGet` 类来创建 HTTP GET 请求。\n\n```java\nHttpGet httpGet = new\
  \ HttpGet(\"http://www.tutorialspoint.com/\");\n```\n\n## 第 4 步 - 执行 Get 请求\n\n\
  `CloseableHttpClient` 对象的 `execute()` 方法接受 `HttpUriRequest`（接口）对象（例如 `HttpGet`、`HttpPost`、`HttpPut`、`HttpHead`\
  \ 等）并返回响应对象。\n\n使用给定的方法执行请求 −\n\n```java\nHttpResponse httpResponse = httpclient.execute(httpGet);\n\
  ```\n\n## 第 5 步 - 启动另一个（嵌套）try-finally\n\n启动另一个 try-finally 块（嵌套在之前的 try-finally\
  \ 块中），将程序中的剩余代码写入此 try 块，并在 finally 块中关闭 `HttpResponse` 对象。\n\n```java\nCloseableHttpClient\
  \ httpclient = HttpClients.createDefault();\ntry {\n    . . . . . . .\n    . . .\
  \ . . . .\n    CloseableHttpResponse httpresponse = httpclient.execute(httpget);\n\
  \    try {\n        . . . . . . .\n        . . . . . . .\n    } finally {\n    \
  \    httpresponse.close();\n    }\n} finally {\n    httpclient.close();\n}\n```\n\
  \n每当你创建/获取如请求之类的对象时，启动一个 try-finally 块，在 try 内部编写剩余代码并在 finally 块中关闭相应的对象，如下例所示所示\
  \ −\n\n（注意：下方的示例代码已集成到上述描述的逻辑中）。\n\n### 示例\n\n如果你观察下面的示例，我们创建了一个 `HttpGet` 请求，使用\
  \ `getMethod()` 打印了使用的请求格式。\n\n然后，我们使用同一个请求执行了另一次操作。再次使用第 1 次执行打印了状态行。最后，打印了第二次执行的状态行。\n\
  \n如前所述，第 1 次执行（abort 方法之前的执行）的响应将被打印（包括在 abort 方法之后写入的第二次状态行），并且在 abort 方法之后对当前请求的所有后续执行将失败并抛出异常。\n\
  \n```java\nimport org.apache.http.HttpResponse;\nimport org.apache.http.client.methods.HttpGet;\n\
  ```\n\n\n\n\n\n执行上述程序后，会生成如下输出 −\n\n```\nGET\nHTTP/1.1 200 OK\n-1\nException in\
  \ thread \"main\" org.apache.http.impl.execchain.RequestAbortedException:\nRequest\
  \ aborted\nat org.apache.http.impl.execchain.MainClientExec.execute(MainClientExec.java:180)\n\
  at org.apache.http.impl.execchain.ProtocolExec.execute(ProtocolExec.java:185)\n\
  at org.apache.http.impl.execchain.RetryExec.execute(RetryExec.java:89)\nat org.apache.http.impl.execchain.RedirectExec.execute(RedirectExec.java:110)\n\
  at org.apache.http.impl.client.InternalHttpClient.doExecute(InternalHttpClient.java:185)\n\
  at org.apache.http.impl.client.CloseableHttpClient.execute(CloseableHttpClient.java:83)\n\
  at org.apache.http.impl.client.CloseableHttpClient.execute(CloseableHttpClient.java:108)\n\
  at HttpGetExample.main(HttpGetExample.java:32)\n```\n\n## 拦截器\n\n拦截器（Interceptors）是用于拦截或更改请求或响应的。协议拦截器通常作用于特定的头信息或一组相关的头。`HttpClient`\
  \ 库提供了对拦截器的支持。\n\n## 请求拦截器\n\n`HttpRequestInterceptor` 接口表示请求拦截器。该接口包含一个名为 `process`\
  \ 的方法，你需要在其中编写拦截请求的代码块代码。\n\n在客户端，此方法在将请求发送到服务器之前对其进行验证/处理；在服务器端，此方法在评估请求体之前被执行。\n\
  \n### 创建请求拦截器\n\n你可以按照下面的步骤创建请求拦截器。\n\n#### 步骤 1 - 创建 `HttpRequestInterceptor` 对象\n\
  \n通过实现其抽象方法 `process` 来创建 `HttpRequestInterceptor` 接口的实例。\n\n```java\nHttpRequestInterceptor\
  \ requestInterceptor = new HttpRequestInterceptor() {\n    @Override\n    public\
  \ void process ( HttpRequest request , HttpContext context ) throws HttpException\
  \ , IOException {\n        //方法实现 . . . . . .\n    }\n};\n```\n\n#### 步骤 2 - 实例化\
  \ `CloseableHttpClient` 对象\n\n通过将上面创建的拦截器添加到其中（如下所示），构建自定义的 `CloseableHttpClient`\
  \ 对象 −\n\n```java\n// 创建一个 CloseableHttpClient 对象\nCloseableHttpClient httpclient\
  \ =\nHttpClients.custom().addInterceptorFirst(requestInterceptor).build();\n```\n\
  \n使用该对象，你可以像往常一样执行请求。\n\n### 示例\n\n下面的示例演示了请求拦截器的用法。在此示例中，我们创建了一个 HTTP GET 请求对象，并为其添加了三个头：`sample-header`、`demoheader`\
  \ 和 `test-header`。\n\n在拦截器的 `processor()` 方法中，我们正在验证所发送请求的头；如果这些头中的任何一个是 `sample-header`，我们将尝试移除它并显示该特定请求的头列表。\n\
  \n```java\nimport java . io . IOException ;\nimport org . apache . http . Header\
  \ ;\nimport org . apache . http . HttpException ;\nimport org . apache . http .\
  \ HttpRequest ;\nimport org . apache . http . HttpRequestInterceptor ;\nimport org\
  \ . apache . http . HttpResponse ;\nimport org . apache . http . client . methods\
  \ . HttpGet ;\nimport org . apache . http . impl . client . CloseableHttpClient\
  \ ;\nimport org . apache . http . impl . client . HttpClients ;\nimport org . apache\
  \ . http . message . BasicHeader ;\nimport org . apache . http . protocol . HttpContext\
  \ ;\n\npublic class InterceptorsExample {\n    public static void main ( String\
  \ args []) throws Exception {\n        // 创建一个 HttpRequestInterceptor\n        HttpRequestInterceptor\
  \ requestInterceptor = new HttpRequestInterceptor () {\n            @Override\n\
  \            public void process ( HttpRequest request , HttpContext context ) throws\
  \ HttpException , IOException {\n                if ( request . containsHeader (\
  \ \"sample-header\" )) {\n                    System . out . println ( \"Contains\
  \ header sample-header, removing it..\" );\n                    request . removeHeaders\
  \ ( \"sample-header\" );\n                }\n                // 打印剩余的头列表\n     \
  \           Header [] headers = request .getAllHeaders ();\n                for\
  \ ( int i = 0 ; i < headers . length ; i ++) {\n                    System . out\
  \ . println ( headers [ i ].getName ());\n                }\n            }\n   \
  \     };\n\n        // 创建一个 CloseableHttpClient 对象\n        CloseableHttpClient\
  \ httpclient =\n        HttpClients . custom () . addInterceptorFirst ( requestInterceptor\
  \ ). build ();\n\n        // 创建一个请求对象\n        HttpGet httpget1 = new HttpGet (\
  \ \"https://www.tutorialspoint.com/\" );\n\n        // 为其设置头\n        httpget1 .\
  \ setHeader ( new BasicHeader ( \"sample-header\" , \"My first header\" ));\n  \
  \      httpget1 . setHeader ( new BasicHeader ( \"demo-header\" , \"My second header\"\
  \ ));\n        httpget1 . setHeader ( new BasicHeader ( \"test-header\" , \"My third\
  \ header\" ));\n\n        // 执行请求\n        HttpResponse httpresponse = httpclient\
  \ . execute ( httpget1 );\n\n        // 打印状态行\n        System . out . println (\
  \ httpresponse . getStatusLine ());\n    }\n}\n```\n\n#### 输出\n\n执行上述程序后，生成的如下输出\
  \ −\n\n```\nContains header sample-header, removing it..\ndemo-header\ntest-header\n\
  HTTP/1.1 200 OK\n```\n\n## 响应拦截器\n\n`HttpResponseInterceptor` 接口表示响应拦截器。该接口包含一个名为\
  \ `process()` 的方法。在此方法中，你需要编写拦截响应的代码。\n\n在服务器端，此方法在将响应发送到客户端之前对其进行验证/处理；在客户端，此方法在评估响应体之前被执行。\n\
  \n### 创建响应拦截器\n\n你可以按照下面的步骤创建响应拦截器：\n\n#### 步骤 1 - 创建 `HttpResponseInterceptor`\
  \ 对象\n\n通过实现其抽象方法 `process` 来创建 `HttpResponseInterceptor` 接口的实例。\n\n```java\nHttpResponseInterceptor\
  \ responseInterceptor = new HttpResponseInterceptor() {\n    @Override\n    public\
  \ void process ( HttpResponse response , HttpContext context ) throws HttpException\
  \ , IOException {\n        //方法实现 . . . . . . .\n    }\n};\n```\n\n#### 步骤 2 - 实例化\
  \ `CloseableHttpClient` 对象\n\n通过将上面创建的拦截器添加到其中（如下所示），构建自定义的 `CloseableHttpClient`\
  \ 对象 −\n\n```java\n// 创建一个 CloseableHttpClient 对象\nCloseableHttpClient httpclient\
  \ =\nHttpClients.custom().addInterceptorFirst(responseInterceptor).build();\n```\n\
  \n使用该对象，你可以像往常一样执行请求。\n\n### 示例\n\n下面的示例演示了响应拦截器的用法。在此示例中，我们在处理器中为响应添加了三个头：`sample-header`、`demo-header`\
  \ 和 `test-header`。\n\n在执行请求并获取响应后，我们使用 `getAllHeaders()` 方法打印了响应的所有头信息。\n\n在输出中，你可以看到列表中有三个头的名称。\n\
  \n```java\nimport java . io . IOException ;\nimport org . apache . http . Header\
  \ ;\nimport org . apache . http . HttpException ;\nimport org . apache . http .\
  \ HttpResponse ;\nimport org . apache . http . HttpResponseInterceptor ;\n```\n\n\
  \n\n\n```java\nimport org . apache . http . client . methods . HttpGet ;\nimport\
  \ org .apache . http . impl . client . CloseableHttpClient ;\nimport org .apache\
  \ . http . impl . client . HttpClients ;\nimport org .apache . http . protocol .\
  \ HttpContext ;\n\npublic class ResponseInterceptorsExample {\n\n    public static\
  \ void main ( String args []) throws Exception {\n        //Creating an HttpRequestInterceptor\n\
  \        HttpResponseInterceptor responseInterceptor = new HttpResponseInterceptor\
  \ () {\n            @Override\n            public void process ( HttpResponse response\
  \ , HttpContext context ) throws\n            HttpException , IOException {\n  \
  \              System . out . println ( \"Adding header sample_header, demo-header,\
  \ test_header to the response\" );\n                response . setHeader ( \"sample-header\"\
  \ , \"My first header\" );\n                response . setHeader ( \"demo-header\"\
  \ , \"My second header\" );\n                response . setHeader ( \"test-header\"\
  \ , \"My third header\" );\n            }\n        };\n\n        //Creating a CloseableHttpClient\
  \ object\n        CloseableHttpClient httpclient = HttpClients . custom (). addInterceptorFirst\
  \ ( responseInterceptor ). build ();\n\n        //Creating a request object\n  \
  \      HttpGet httpget1 = new HttpGet ( \"https://www.tutorialspoint.com/\" );\n\
  \n        //Executing the request\n        HttpResponse httpresponse = httpclient\
  \ . execute ( httpget1 );\n\n        //Printing remaining list of headers\n    \
  \    Header [] headers = httpresponse . getAllHeaders ();\n        for ( int i =\
  \ 0 ; i < headers . length ; i ++) {\n            System . out . println ( headers\
  \ [ i ]. getName ());\n        }\n    }\n}\n```\n\n执行上述程序后，会生成以下结果 −\n\n执行上述程序会生成以下输出。\n\
  \nAdding header sample_header, demo-header, test_header to the response\nAccept-Ranges\n\
  Access-Control-Allow-Headers\nAccess-Control-Allow-Origin\nCache-Control\nContent-Type\n\
  Date\nExpires\nLast-Modified\nServer\nVary\nX-Cache\nsample-header\ndemo-header\n\
  test-header\n\n# 用户身份验证\n\n使用 `HttpClient`，你可以连接到需要用户名和密码的网站。本章将解释如何针对要求用户名和密码的站点执行客户端请求。\n\
  \n## 步骤 1 - 创建 CredentialsProvider 对象\n\n`CredentialsProvider` 接口维护一个用于用户登录凭据的集合。你可以通过实例化\
  \ `BasicCredentialsProvider` 类来创建它的对象，它是该接口的默认实现。\n\n`CredentialsProvider credentialsPovider\
  \ **=** BasicCredentialsProvider();`\n\n## 步骤 2 - 设置凭据\n\n你可以使用 `setCredentials()`\
  \ 方法为 `CredentialsProvider` 对象设置所需的凭据。\n\n该方法接受如下所示两个对象 −\n\n*   `AuthScope object`\
  \ — 身份验证范围，指定主机名、端口号和身份验证方案名称等细节。\n*   `Credentials object` — 指定凭据（用户名、密码）。\n\n\
  如下所示，使用 `setCredentials()` 方法为主机和代理设置凭据 −\n\n`credsProvider.setCredentials(new AuthScope(\"\
  example.com\", 80), new UsernamePasswordCredentials(\"user\", \"mypass\"));`\n`credsProvider.setCredentials(new\
  \ AuthScope(\"localhost\", 8000), new UsernamePasswordCredentials(\"abc\", \"passwd\"\
  ));`\n\n## 步骤 3 - 创建 HttpClientBuilder 对象\n\n使用 `HttpClients` 类的 `custom()` 方法创建一个\
  \ `HttpClientBuilder`。\n\n```java\n//Creating the HttpClientBuilder\nHttpClientBuilder\
  \ clientbuilder = HttpClients.custom();\n```\n\n## 步骤 4 - 设置 credentialsPovider\n\
  \n你可以使用 `setDefaultCredentialsProvider()` 方法将上述创建的 `credentialsPovider` 对象设置到 `HttpClientBuilder`\
  \ 中。\n\n如下所示，将上一步创建的 CredentialProvider 对象通过传递给 `CredentialsProvider object()` 方法设置到客户端构建器中。\n\
  \n`clientbuilder = clientbuilder.setDefaultCredentialsProvider(credsProvider);`\n\
  \n## 步骤 5 - 构建 CloseableHttpClient\n\n使用 `HttpClientBuilder` 类的 `build()` 方法构建 `CloseableHttpClient`\
  \ 对象。\n\n`CloseableHttpClient httpclient = clientbuilder.build()`\n\n## 步骤 6 - 创建\
  \ HttpGet 对象并执行它\n\n通过实例化 `HttpGet` 类来创建 `HttpRequest` 对象。使用 `execute()` 方法执行此请求。\n\
  \n```java\n//Creating a HttpGet object\nHttpGet httpget = new HttpGet(\"https://www.tutorialspoint.com/\
  \ \");\n//Executing the Get request\nHttpResponse httpresponse = httpclient.execute(httpget);\n\
  ```\n\n### 示例\n\n以下是一个示例程序，演示了如何针对需要用户验证的目标站点执行 HTTP 请求。\n\n```java\nimport org\
  \ . apache . http . Header ;\nimport org . apache . http . HttpResponse ;\nimport\
  \ org .apache . http . auth . AuthScope ;\nimport org .apache . http . auth . Credentials\
  \ ;\nimport org .apache . http . auth . UsernamePasswordCredentials ;\nimport org\
  \ .apache . http . client . CredentialsProvider ;\nimport org .apache . http . client\
  \ . methods . HttpGet ;\nimport org .apache . http . impl . client . BasicCredentialsProvider\
  \ ;\nimport org .apache . http . impl . client . CloseableHttpClient ;\nimport org\
  \ .apache . http . impl . client . HttpClientBuilder ;\nimport org .apache . http\
  \ . impl . client . HttpClients ;\n\npublic class UserAuthenticationExample {\n\
  \    public static void main ( String args []) throws Exception {\n        //Create\
  \ an object of credentialsProvider\n        CredentialsProvider credentialsPovider\
  \ = new BasicCredentialsProvider ();\n        //Set the credentials\n        AuthScope\
  \ scope = new AuthScope ( \"https://www.tutorialspoint.com/questions/\" , 80 );\n\
  \        Credentials credentials = new UsernamePasswordCredentials ( \"USERNAME\"\
  \ , \"PASSWORD\" );\n        credentialsPovider . setCredentials ( scope , credentials\
  \ );\n        //Creating the HttpClientBuilder\n        HttpClientBuilder clientbuilder\
  \ = HttpClients . custom ();\n        //Setting the CredentialProvider\n       \
  \ clientbuilder = clientbuilder . setDefaultCredentialsProvider ( credentialsPovider\
  \ );\n        //Building the CloseableHttpClient object\n        CloseableHttpClient\
  \ httpclient = clientbuilder . build ();\n        //Creating a HttpGet object\n\
  \        HttpGet httpget = new HttpGet ( \"https://www.tutorialspoint.com/questions/index.php\"\
  \ );\n        //Printing the method used\n        System . out . println ( httpget\
  \ . getMethod ());\n        //Executing the Get request\n        HttpResponse httpresponse\
  \ = httpclient . execute ( httpget );\n        //Printing the status line\n    \
  \    System . out . println ( httpresponse . getStatusLine ());\n        int statusCode\
  \ = httpresponse . getStatusLine (). getStatusCode ();\n        System . out . println\
  \ ( statusCode );\n        Header [] headers = httpresponse . getAllHeaders ();\n\
  \        for ( int i = 0 ; i < headers . length ; i ++) {\n            System .\
  \ out . println ( headers [ i ]. getName ());\n        }\n    }\n}\n```\n\n####\
  \ 输出\n\n执行上述程序后，会生成以下输出。\n\nGET\nHTTP/1.1 200 OK\n200\n\n# 使用代理\n\n代理服务器是客户端和互联网之间的中间服务器。代理服务器提供以下基本功能\
  \ −\n\n*   防火墙和网络数据过滤\n*   网络连接共享\n*   数据缓存\n\n使用 HttpClient 库，你可以通过代理发送 HTTP 请求。遵循下述步骤\
  \ −\n\n## 步骤 1 - 创建 HttpHost 对象\n\n通过向构造函数传递代表代理主机名称（你需要发送请求的主机）的字符串参数，实例化 `org.apache.http`\
  \ 包中的 `HttpHost` 类。\n\n```java\n//Creating an HttpHost object for proxy\nHttpHost\
  \ proxyHost = new HttpHost(\"localhost\");\n```\n\n同样，创建另一个 HttpHost 对象来表示需要请求的目标主机。\n\
  \n```java\n//Creating an HttpHost object for target\nHttpHost targetHost = new HttpHost(\"\
  google.com\");\n```\n\n## 步骤 2 - 创建 HttpRoutePlanner 对象\n\n`HttpRoutePlanner` 接口计算指定节点的路由。通过实例化\
  \ `DefaultProxyRoutePlanner` 类（该接口的实现）来创建该接口的对象。在它的构造函数参数中，传递上述创建的代理主机 −\n\n```java\n\
  //creating a RoutePlanner object\n```\n\n\n\n\n```java\nHttpRoutePlanner routePlanner\
  \ = new DefaultProxyRoutePlanner(proxyhost);\n```\n\n## 第 3  - 将路由规划器设置客户端构建器\n\n\
  使用 `HttpClients` 类的 `custom()` 方法创建一个 `HttpClientBuilder` 对象，并使用 `setRoutePlanner()`\
  \ 方法为该对象之前创建的路由规划器。\n\n```java\n//将路由规划器设置到 HttpClientBuilder 对象\nHttpClientBuilder\
  \ clientBuilder = HttpClients.custom();\nclientBuilder = clientBuilder.setRoutePlanner(routePlanner);\n\
  ```\n\n## 第 4  - 构建 CloseableHttpClient 对象\n\n通过 `build()` 方法构建 `CloseableHttpClient`\
  \ 对象。\n\n```java\n// 构建一个 CloseableHttpClient\nCloseableHttpClient httpClient =\
  \ clientBuilder.build();\n```\n\n## 第 5  - 创建一个 HttpGet 对象\n\n通过实例化 `HttpGet` 类来创建一个\
  \ HTTP GET 请求。\n\n```java\n// 创建一个 HttpGet 对象\nHttpGet httpGet = new HttpGet(\"\
  /\");\n```\n\n## 第 6  - 执行请求\n\n`execute()` 方法的一个变体接受 `HttpHost` 和 `HttpRequest`\
  \ 对象并执行请求。使用此方法执行请求 ——\n\n```java\n// 执行 Get 请求\nHttpResponse httpResponse = httpclient.execute(targetHost,\
  \ httpGet);\n```\n\n### 示例\n\n以下示例演示了如何通过代理向服务器发送 HTTP 请求。在示例中，我们通过 localhost 向\
  \ google.com 发送了一个 HTTP GET 请求。我们打印了响应的头信息和响应正文。\n\n```java\nimport org . apache\
  \ . http . Header ;\nimport org .apache . http . HttpEntity ;\nimport org .apache\
  \ . http . HttpHost ;\nimport org .apache . http . HttpResponse ;\nimport org .apache\
  \ . http . client . methods . HttpGet ;\nimport org .apache . http . conn . routing\
  \ . HttpRoutePlanner ;\nimport org .apache . http . impl . client . CloseableHttpClient\
  \ ;\nimport org .apache . http . impl . client . HttpClientBuilder ;\nimport org\
  \ .apache . http . impl . client . HttpClients ;\nimport org .apache . http . impl\
  \ . conn . DefaultProxyRoutePlanner ;\nimport org .apache . http . util . EntityUtils\
  \ ;\n\npublic class RequestViaProxyExample {\n    public static void main ( String\
  \ args []) throws Exception {\n        // 为代理创建一个 HttpHost 对象\n        HttpHost\
  \ proxyhost = new HttpHost ( \"localhost\" );\n        // 为目标创建一个 HttpHost 对象\n\
  \        HttpHost targethost = new HttpHost ( \"google.com\" );\n        // 创建一个\
  \ RoutePlanner 对象\n        HttpRoutePlanner routePlanner = new DefaultProxyRoutePlanner\
  \ ( proxyhost );\n        //将路由规划器设置到 HttpClientBuilder 对象\n        HttpClientBuilder\
  \ clientBuilder = HttpClients . custom ();\n        clientBuilder = clientBuilder\
  \ . setRoutePlanner ( routePlanner );\n        // 构建一个 CloseableHttpClient\n   \
  \     CloseableHttpClient httpclient = clientBuilder . build ();\n        // 创建一个\
  \ HttpGet 对象\n        HttpGet httpget = new HttpGet ( \"/\" );\n        // 执行 Get\
  \ 请求\n        HttpResponse httpresponse = httpclient . execute ( targethost , httpget\
  \ );\n        // 打印状态行\n        System . out . println ( httpresponse . getStatusLine\
  \ ());\n        // 打印响应的所有头信息\n        Header [] headers = httpresponse .getAllHeaders\
  \ ();\n        for ( int i = 0 ; i < headers . length ; i ++) {\n            System\
  \ . out . println ( headers [ i ]);\n        }\n        // 打印响应正文\n        HttpEntity\
  \ entity = httpresponse . getEntity ();\n        if ( entity != null ) {\n     \
  \       System . out . println ( EntityUtils . toString ( entity ));\n        }\n\
  \    }\n}\n```\n\n#### 输出\n\n执行上述程序后将生成如下输出 ——\n\n```text\nHTTP/1.1 200 OK\nDate:\
  \ Sun, 23 Dec 2018 10:21:47 GMT\nServer: Apache/2.4.9 (Win64) PHP/5.5.13\nLast-Modified:\
  \ Tue, 24 Jun 2014 10:46:24 GMT\nETag: \"2e-4fc92abc3c000\"\nAccept-Ranges: bytes\n\
  Content-Length: 46\nContent-Type: text/html\n<html><body><h1>It works!</h1></body></html>\n\
  ```\n\n# 代理认证\n\n在本章中，我们将通过示例学习如何使用用户名和密码创建经过认证的 HttpRequest，并通过代理将其隧道到目标主机。\n\n\
  ## 第 1  - 创建一个 CredentialsProvider 对象\n\n`CredentialsProvider` 接口维护一个存储用户登录凭据的集合。你可以通过实例化\
  \ `BasicCredentialsProvider` 类（该接口的默认实现）来创建其对象。\n\n```java\nCredentialsProvider\
  \ credentialsPovider = new BasicCredentialsProvider();\n```\n\n## 第 2  - 设置凭据\n\n\
  你可以使用 `setCredentials()` 方法为 `CredentialsProvider` 对象设置所需的凭据。该方法接受两个对象 ——\n\n- `AuthScope`\
  \ 对象 – 认证范围，指定主机名、端口号和认证方案名称等详细信息。\n- `Credentials` 对象 – 指定凭据（用户名、密码）。如下所示，使用 `setCredentials()`\
  \ 方法为主机和代理设置凭据。\n\n```java\ncredsProvider.setCredentials(new AuthScope(\"example.com\"\
  , 80), new UsernamePasswordCredentials(\"user\", \"mypass\"));\ncredsProvider.setCredentials(new\
  \ AuthScope(\"localhost\", 8000), new UsernamePasswordCredentials(\"abc\", \"passwd\"\
  ));\n```\n\n## 第 3  - 创建一个 HttpClientBuilder 对象\n\n如下所示，使用 `HttpClients` 类的 `custom()`\
  \ 方法创建一个 `HttpClientBuilder` 对象。\n\n```java\n// 创建 HttpClientBuilder\nHttpClientBuilder\
  \ clientBuilder = HttpClients.custom();\n```\n\n## 第 4  - 设置 CredentialsProvider\n\
  \n使用 `setDefaultCredentialsProvider()` 方法为 `HttpClientBuilder` 对象设置 `CredentialsProvider`\
  \ 对象。将之前创建的 `CredentialsProvider` 对象传递给此方法。\n\n```java\nclientBuilder = clientBuilder.setDefaultCredentialsProvider(credsProvider);\n\
  ```\n\n## 第 5  - 构建 CloseableHttpClient\n\n通过 `build()` 方法构建 `CloseableHttpClient`\
  \ 对象。\n\n```java\nCloseableHttpClient httpclient = clientBuilder.build();\n```\n\
  \n## 第 6  - 创建代理和目标主机\n\n通过实例化 `HttpHost` 类创建目标和代理主机。\n\n```java\n// 创建目标和代理主机\n\
  HttpHost target = new HttpHost(\"example.com\", 80, \"http\");\nHttpHost proxy =\
  \ new HttpHost(\"localhost\", 8000, \"http\");\n```\n\n## 第 7  - 设置代理并构建 Request\
  \ 对象\n\n使用 `custom()` 方法创建一个 `RequestConfig.Builder` 对象。使用 `setProxy()` 方法将之前创建的\
  \ `proxyHost` 对象设置给 `RequestConfig.Builder`。最后，使用 `build()` 方法构建 `RequestConfig`\
  \ 对象。\n\n```java\nRequestConfig.Builder reqconfigconbuilder = RequestConfig.custom();\n\
  reqconfigconbuilder = reqconfigconbuilder.setProxy(proxyHost);\nRequestConfig config\
  \ = reqconfigconbuilder.build();\n```\n\n## 第 8  - 创建 HttpGet 请求对象并为其设置配置对象\n\n\
  通过实例化 `HttpGet` 类创建一个 `HttpGet` 对象。使用 `setConfig()` 方法将上一步创建的 `config` 对象设置给该对象。\n\
  \n```java\n// 创建 HttpGet 请求对象\nHttpGet httpGet = new HttpGet(\"/\");\n// 将配置设置为请求\n\
  httpget.setConfig(config);\n```\n\n## 第 9 - - 执行请求\n\n通过将 `HttpHost` 对象（目标）和请求（HttpGet）作为参数传递给\
  \ `execute()` 方法来执行请求。\n\n```java\nHttpResponse httpResponse = httpclient.execute(targetHost,\
  \ httpget);\n```\n\n\n\n```java\npublic static void main ( String [] args ) throws\
  \ Exception {\n\n  //Creating the CredentialsProvider object\n  CredentialsProvider\
  \ credsProvider = new BasicCredentialsProvider ();\n\n  //Setting the credentials\n\
  \  credsProvider . setCredentials ( new AuthScope ( \"example.com\" , 80 ),\n  new\
  \ UsernamePasswordCredentials ( \"user\" , \"mypass\" ));\n\n  credsProvider . setCredentials\
  \ ( new AuthScope ( \"localhost\" , 8000 ),\n  new UsernamePasswordCredentials (\
  \ \"abc\" , \"passwd\" ));\n\n  //Creating the HttpClientBuilder\n  HttpClientBuilder\
  \ clientbuilder = HttpClients . custom ();\n\n  //Setting the credentials\n  clientbuilder\
  \ = clientbuilder . setDefaultCredentialsProvider ( credsProvider );\n\n  //Building\
  \ the CloseableHttpClient object\n  CloseableHttpClient httpclient = clientbuilder\
  \ . build ();\n\n  //Create the target and proxy hosts\n  HttpHost targetHost =\
  \ new HttpHost ( \"example.com\" , 80 , \"http\" );\n  HttpHost proxyHost = new\
  \ HttpHost ( \"localhost\" , 8000 , \"http\" );\n\n  //Setting the proxy\n  RequestConfig\
  \ . Builder reqconfigconbuilder = RequestConfig . custom ();\n  reqconfigconbuilder\
  \ = reqconfigconbuilder . setProxy ( proxyHost );\n  RequestConfig config = reqconfigconbuilder\
  \ . build ();\n\n  //Create the HttpGet request object\n  HttpGet httpget = new\
  \ HttpGet ( \"/\" );\n\n  //Setting the config to the request\n  httpget . setConfig\
  \ ( config );\n\n  //Printing the status line\n  HttpResponse response = httpclient\
  \ . execute ( targetHost , httpget );\n  System . out . println ( response . getStatusLine\
  \ ());\n}\n```\n\n\n\n\n除了 cookie 的功能外，`ClientCookie` 还可以获取服务器上的原始 cookie。你可以通过实例化\
  \ `BasicClientCookie` 类来创建一个客户端 cookie。对于该类的构造函数，你需要传递你想要存储在该特定 cookie 中的键值对。\n\n\
  ```java\n//Creating client cookie\nBasicClientCookie clientCookie = new BasicClientCookie(\"\
  name\",\"Raju\");\n```\n\n### 第 3  - 为 cookie 设置值\n\n对于客户端 cookie，你可以使用相应的方法设置/移除路径（path）、值、版本、过期日期、域名、注释和属性。\n\
  \n```java\nCalendar myCal = new GregorianCalendar(2018, 9, 26);\nDate expiryDate\
  \ = myCal.getTime();\nclientcookie.setExpiryDate(expiryDate);\nclientcookie.setPath(\"\
  /\");\nclientcookie.setSecure(true);\nclientcookie.setValue(\"25\");\nclientcookie.setVersion(5);\n\
  ```\n\n### 第 4  - 将 cookie 添加到 cookie 存储\n\n你可以使用 `BasicCookieStore` 类的 `addCookie()`\
  \ 方法将 cookie 添加到 cookie 存储中。\n\n将所需的 cookie 添加到 `Cookiestore` 中。\n\n```java\n//Adding\
  \ the created cookies to cookie store\ncookiestore.addCookie(clientcookie);\n```\n\
  \n### 示例\n\n以下示例演示了如何创建 cookie 并将其添加到 cookie 存储中。在这里，我们创建了一个 cookie 存储，通过设置域名和路径值创建了一组\
