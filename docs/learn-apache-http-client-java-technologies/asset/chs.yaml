  \ thread thread 4: 127018\n\n# 自定义 SSL Context\n\n使用安全套层（Secure Socket Layer），你可以在客户端和服务器之间建立一个安全的连接。这有助于保护敏感信息，如信用卡号、用户名、密码、密码码等。\n\
  \n你可以使用 `HttpClient` 库创建自己的 SSL 上文来使连接更加安全。\n\n请按照以下步骤使用 HttpClient 库自定义 SSLContext\
  \ ：\n\n## 步骤 1 - 创建 SSLContextBuilder 对象\n\n`SSLContextBuilder` 是用于构建 SSLContext\
  \ 对象的构建器。使用 `SSLContexts` 类的 `custom()` 方法创建其对象。\n\n```java\n// 创建 SSLContextBuilder\
  \ 对象\nSSLContextBuilder SSLBuilder = SSLContexts.custom();\n```\n\n## 步骤 2 - 加载密钥库\n\
  \n在路径 `Java_home_directory/jre/lib/security/` 下，你可以找到一个名为 `cacerts` 的文件。将其保存为你的密钥库文件（扩展名为\
  \ .jks）。使用 `SSLContextBuilder` 类的 `loadTrustMaterial()` 方法加载密钥库文件及其密码（默认为 `changeit`）。\n\
  \n```java\n// 加载密钥库文件\nFile file = new File(\"mykeystore.jks\");\nSSLBuilder = SSLBuilder.loadTrustMaterial(file,\
  \ \"changeit\".toCharArray());\n```\n\n## 步骤 3 - 构建 SSLContext 对象\n\nSSLContext\
  \ 对象代表安全套接协议的实现。使用 `build()` 方法构建 SSLContext。\n\n```java\n// 构建 SSLContext\nSSLContext\
  \ sslContext = SSLBuilder.build();\n```\n\n## 步骤 4 - 创建 SSLConnectionFactory\n\n\
  `SSLConnectionFactory` 是用于 TLS 和 SSL 连接的层级套接字。通过它，你可以验证 Https 服务器。\n\n你可以通过多种方式创建它。根据创建方式的不同，允许所有主机、允许自签名证书、仅允许特定协议等。要仅允许特定协议，可以通过向其构造函数传递\
  \ SSLContext、代表支持的的字符串数组、代表支持的加密套件的字符串数组以及 `HostnameVerifier` 对象来创建 `SSLConnectionFactory`\
  \ 对象。（注意：步骤描述遵循逻辑流）。\n\n## 步骤 5 - 创建 HttpClientBuilder 对象\n\n使用 `HttpClients` 类的\
  \ `custom()` 方法创建 HttpClientBuilder 对象。\n\n```java\n// 创建 HttpClientBuilder\nHttpClientBuilder\
  \ clientbuilder = HttpClients.custom();\n```\n\n## 步骤 6 - 设置 SSLConnectionFactory\
  \ 对象\n\n使用 `setSSLSocketFactory()` 方法将 `SSLConnectionFactory` 对象设置到 `HttpClientBuilder`。\n\
  \n```java\n// 设置 SSLConnectionFactory\nclientbuilder = clientbuilder.setSSLSocketFactory(sslConSocFactory);\n\
  ```\n\n## 步骤 7 - 构建 CloseableHttpClient 对象\n\n调用 `build()` 方法构建 `CloseableHttpClient`\
  \ 对象。\n\n```java\n// 构建 CloseableHttpClient\nCloseableHttpClient httpclient = clientbuilder.build();\n\
  ```\n\n## 步骤 8 - 创建 HttpGet 对象\n\n`HttpGet` 类代表使用 URI 获取给定服务器信息的 HTTP GET 请求。通过实例化\
