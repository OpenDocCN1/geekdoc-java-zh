  trans: "\n\n*   标记您希望稍后查看的 Java 认证考试题。您标记的所有题目将列在右侧的“已标记题目”（marked questions）部分。您可以从此列表直接跳转到题目。\n\
    \n*   如果您想查看某个题目的正确答案，只需点击 `Solution`（解决方案）按钮。在解决方案部分，您可以检查自己的答案并找到完整的解释。\n\n\
    *   请留意倒计时。它将告诉您剩余多少时间。倒计时结束后，测试将自动提交。\n\n*   一旦提交测试，结果部分将展开。在这里，您可以查看测试的所有题目。从这里，您也可以直接导航到每个题目。\n\
    \n关于 1Z0-803 考试更多信息：更多信息请访问：[Oracle Java8 1Z0-803 考试参考](https://education.oracle.com/pls/web_prod-plq-dad/db_pages.getpage?page_id=5001&get_params=p_exam_id:1Z0-803)1Z0-803\
    \ 示例练习题\n\n问题： 1 单选题\n给定代码片段：\n\n![](img/Image00002.jpg)\n结果是什么？\n答案：A) 3 false\
    \ 1\nB) 2 true 3\nC) 2 false 3\nD) 3 true 1\nE) 3 false 3\nF) 2 true 1\nG) 2 false\
    \ 1\n解答： D\n解释：\n解释：索引为 0 的元素 `{0, 1, 2}` 的长度为 3。输出：3。索引为 1 的元素 `{3, 4, 5, 6}`\
    \ 是数组类型。输出：true。索引为 0 的元素 `{0, 1, 2}` 中索引为 1 的元素是：1。输出：1\n\n问题： 2 单选题\n给定：\n\n\
    ![](img/Image00003.jpg)\n结果是什么？\n答案：A) 6 5 6 4\nB) 6 5 5 4\nC) 6 5 6 6\nD) 6 5\
    \ 6 5\n解答： A\n解释：\n解释：在 `main` 中，`z` 被赋值为 6。打印 `z`。输出：6。在 `doStuff` 中，`z` 被赋值为\
    \ 5。`DoStuff2` 本地将 `z` 设置为 4（但 `MyScope.z` 被设置为 4），但在 `Dostuff` 中 `z` 仍然是 5。打印\
    \ `z`。输出：5。再次在 `main` 中打印 `z`（此时本地 `z` 设置为 6）。输出：6。最后打印 `MyScope.z`。`MyScope.z`\
    \ 已在 `doStuff2()` 中被设置为 4。输出：4\n\n问题： 3 单选题\n在方法 `dosomething()` 中发生了一个未检查的异常。是否需要在\
    \ `dosomething()` 方法中添加其他代码以使其编译和执行？\n答案：A) 必须捕获该异常\nB) 必须声明抛出该异常。\nC) 必须捕获或声明抛出该异常。\n\
    D) 不需要添加其他代码。\n解答： D\n解释：\n解释：因为 Java 语言并不要求方法捕获或指定未检查异常（`RuntimeException`、`Error`\
    \ 及其子类），程序员可能会倾向于编写只抛出未检查异常的代码，或者让他们所有的异常子类继承自 `RuntimeException`。这两种快捷方法都允许程序员编写代码，而无需担心编译器错误，也不必担心指定或捕获任何异常。虽然这对于程序员来说可能很方便，但它规避了捕获或指定要求的的意图，并可能给使用你类的人带来问题。\n\
    \n问题： 4 单选题\n给定代码片段：\n```java\ninterface SampleClosable { \n    public void close\
    \ () throws java.io.IOException; \n}\n```\n哪三个实现方案是有效的？\n\n![](img/Image00004.jpg)\n\
    答案：A) Option A\nB) Option B\nC) Option C\nD) Option D\nE) Option E\n解答： A, C,\
    \ E\n解释：\n解释：A：抛出相同的异常是可以的。C：使用 `java.io.IOException` 的子类（此处为 `java.io.FileNotFoundException`）是可以的。E：不使用\
    \ throw 子句是可以的。错误答案：B：该异常不是 `java.io.IOException` 的子类，不能在此处使用。D：没有 extends。`SampleCloseable`\
    \ 不能作为 `Test` 的父类，父类必须是一个类。（接口扩展其他接口。）\n\n问题： 5 单选题\n给定代码片段：\n\n![](img/Image00005.jpg)\n\
    结果是什么？\n答案：A) 4 Null\nB) Null 4\nC) 运行时抛出 IllegalArgumentException\nD) 4 运行时抛出\
    \ ArrayIndexOutOfBoundException\n解答： D\n解释：\n解释：第一个 `println` 语句 `System.out.println(array\
    \ [4][1]);` 运行正常。它选取了索引为 4 的元素/数组 `{0, 4, 8, 12, 16}`，并从该数组中选择了索引为 1 的元素 4。输出：4。第二个\
    \ `println` 语句 `System.out.println(array) [1][4]);` 失败了。它选择了索引为 1 的数组 `{0, 1}`，并尝试从该数组选择索引为\
    \ 4 的元素。这导致了异常。输出：4 线程 \"main\" `java.lang.ArrayIndexOutOfBoundsException`: 4\n\
    \n问题： 6 单选题\n查看示例：\n\n![](img/Image00006.jpg)\n给定：\n\n![](img/Image00007.jpg)\n\
    执行此程序的结果是什么？\n答案：A) Bob's:\nB) Bob's Name\nC) 无输出\nD) Bob's name\n解答： B\n解释：\n\
    解释：执行语句 `jian = bob;` 后，`jian` 将引用同一个对象。\n\n问题： 7 单选题\n给定代码片段：\n\n![](img/Image00008.jpg)\n\
    结果是什么？\n答案：A) 有效\nB) 无效\nC) 编译失败\nD) 运行时抛出 IllegalArgumentException\n解答： C\n解释：\n\
    解释：在片段 `if (valid)` 中 `valid` 必须是布尔类型，但它是字符串。这导致编译失败。\n\n问题： 8 单选题\n哪两个多维数组的实例化和初始化是有效的？\n\
    \n![](img/Image00009.jpg)\n答案：\n\nA) Option A\nB) Option B\nC) Option C\nD) Option\
    \ D\nE) Option E\n解答： A, D\n\n问题： 9 单选题\n给定代码片段：\n\n![](img/Image00010.jpg)\n\
    结果是什么？\n答案：A) 2 2\nB) 1 2\nC) 3 2\nD) 3 3\n解答： A\n解释：\n解释：变量 `b` 被赋值为 4。`b` 减至\
    \ 3。变量 `b` 减至 2 然后被打印。输出：2。打印变量 `b`。输出：2\n\n问题： 10 单选题\n给定：\n\n![](img/Image00011.jpg)\n\
    输出中 2 被打印了多少次？\n答案：A) 零\nB) 一次\nC) 次\nD) 三次\nE) 编译失败。\n解答： A\n\n"
- fmt: "\n# More info for 1Z0-804 Exam\nFor more info visit: [Oracle Java8 1Z0-804\
    \ Exam Reference](https://education.oracle.com/pls/web_prod-plq-dad/db_pages.getpage?page_id=5001&get_params=p_exam_id:1Z0-804)\n\
    \n## Sample Practice Test for 1Z0-804\n\n### Question: 1\nOne Answer Is Right\n\
    **Given:** ![](Image00012.jpg)\nWhich three values will appear in the output?\n\
    **Answers:**\nA) 5\nB) 7\nC) a1\nD) a2\nE) b1\nF) b2\n**Solution:** A, D, E\n\
    **Explanation:**\nExplanation: Static method of base class is invoked >> A\n```java\n\
    A myA = new B();\nSystem.out.print(myA.doA() + myA.doA2() + myA.a);\nclass B {\n\
    \    String doA() {\n        return \"b1 \";\n    }\n    int a = 7;\n}\nclass\
    \ A {\n    protected static String doA2 () {\n        return \"a2 \";\n    }\n\
    }\n```\n\n### Question: 2\nOne Answer Is Right\n**Given:** ![](Image00013.jpg)\n\
    What is the result?\n**Answers:**\nA) false false\nB) true false\nC) true true\n\
    D) Compilation fails\nE) An exception is thrown at runtime\n**Solution:** A\n\
    **Explanation:**\nExplanation: `(this == obj)` is the object implementation of\
    \ `equals()` and therefore FALSE, if the reference points to various objects and\
    \ then the `super.equals()` is invoked, the object method `equals()` what still\
    \ result in FALSE better override of `equals()` is to compare the attributes like:\n\
    ```java\npublic boolean equals (Object obj) {\n    if (obj != null){\n       \
    \ Product p = (Product)obj;\n        return this.id == p.id;\n    }\n    return\
    \ false;\n}\n```\n\n### Question: 3\nOne Answer Is Right\n**Given:** ![](Image00014.jpg)\n\
    **What is the result?\n**Answers:**\nA) tolting cantering tolting\nB) cantering\
    \ cantering cantering\nC) compilation fails\nD) an exception is thrown at runtime\n\
    **Solution:** C\n**Explanation:**\nExplanation: Compiler says: Cannot reduce the\
    \ visibility of the inherited method from `Rideable`. mÃ¼ssen PUBLIC sein\n```java\n\
    public String ride() {\n    return \"cantering \";\n}\npublic String ride() {\n\
    \    return \"tolting \";\n}\n```\nif this is given then the result would be:\
    \ A : tolting cantering tolting\n\n### Question: 4\nOne Answer Is Right\n**Given\
    \ these facts about Java types in an application:** \n- Type `x` is a template\
    \ for other types in the application.\n- Type `x` implements `dostuff()`.\n- Type\
    \ `x` declares, but does NOT implement `doit()`.\n- Type `y` declares `doOther()`.\n\
    Which three are true?\n**Answers:**\nA) Type `y` must be an interface.\nB) Type\
    \ `x` must be an abstract class.\nC) Type `y` must be an abstract class.\nD) Type\
    \ `x` could implement or extend from Type `y`.\nE) Type `x` could be an abstract\
    \ class or an interface.\nF) Type `y` could be an abstract class or an interface.\n\
    **Solution:** B, D, F\n**Explanation:**\nExplanation: Unlike interfaces, abstract\
    \ classes can contain fields that are not static and final, and they can contain\
    \ implemented methods. Such abstract classes are similar to interfaces, except\
    \ that they provide a partial implementation, leaving it to subclasses to complete\
    \ the implementation. If an abstract class contains only abstract method declarations,\
    \ it should be declared as an interface instead.\n**Note:** An interface in the\
    \ Java programming language is an abstract type that is used to specify an interface\
    \ (in the generic sense of the term) that classes must implement. Interfaces are\
    \ declared using the `interface` keyword, and may only contain method signature\
    \ and constant declarations (variable declarations that are declared to be both\
    \ static and final). An interface may never contain method definitions.\n**Note\
    \ 2:** an abstract class is a class that is declared abstract--it may or may not\
    \ include abstract methods. Abstract classes cannot be instantiated, but they\
    \ can be subclassed. An abstract method is a method that is declared without an\
    \ implementation (without braces, and followed by a semicolon)\n\n### Question:\
    \ 5\nOne Answer Is Right\n**Given:** ![](Image00015.jpg)\nWhat two changes, made\
    \ independently, will enable the code to compile?\n**Answers:**\nA) Change the\
    \ signature of `Account` to: `public class Account`.\nB) Change the signature\
    \ of `CheckingAccount` to: `public abstract CheckingAccount`\nC) Implement private\
    \ methods for `deposit` and `withdraw` in `CheckingAccount`.\nD) Implement public\
    \ methods for `deposit` and `withdraw` in `CheckingAccount`.\nE) Change Signature\
    \ of `checkingAccount` to: `CheckingAccount implements Account`.\nF. Make `Account`\
    \ an interface.\n**Solution:** B, D\n**Explanation:**\nExplanation: Compiler say:\
    \ - Der Typ CheckingAccount muss die Ã¼bernommene abstrakte Methode `Account.deposit(double)`\
    \ implementieren - Der Typ CheckingAccount muss die Ã¼bernommene abstrakte Methode\
    \ `Account.withdraw(double)` implementieren ODER Typ CheckingAccount als abstract\
    \ definieren\n\n### Question: 6\nOne Answer Is Right\nWhich two forms of abstraction\
    \ can a programmer use in Java?\n**Answers:**\nA) enums\nB) interfaces\nC) primitives\n\
    D) abstract classes\nE) concrete classes\nF) primitive wrappers\n**Solution:**\
    \ B, D\n**Explanation:**\n**When To Use Interfaces** An interface allows somebody\
    \ to start from scratch to implement your interface or implement your interface\
    \ in some other code whose original or primary purpose was quite different from\
    \ your interface. To them, your interface is only incidental, something that have\
    \ to add on to the their code to be able to use your package. The disadvantage\
    \ is every method in the interface must be public. You might not want to expose\
    \ everything.\n**When To Use Abstract classes** An abstract class, in contrast,\
    \ provides more structure. It usually defines some default implementations and\
    \ provides some tools useful for a full implementation. The catch is, code using\
    \ it must use your class as the base. That may be highly inconvenient if the other\
    \ programmers wanting to use your package have already developed their own class\
    \ hierarchy independently. In Java, a class can inherit from only one base class.\n\
    **When to Use Both** You can offer the best of both worlds, an interface and an\
    \ abstract class. Implementors can ignore your abstract class if they choose.\
    \ The only drawback of doing that is calling methods via interface is slightly\
    \ slower than calling them via abstract class name. Reference: http://mindprod.com/interfacevsabstract\n\
    \n### Question: 7\nOne Answer Is Right\n**Given:** ![](Image00016.jpg)\nWhat is\
    \ the result?\n**Answers:**\nA) Up Down\nB) Up Up\nC) Up null\nD) Compilation\
    \ fails\nE) An exception is thrown at runtime\n**Solution:** D\n**Explanation:**\n\
    Explanation: ------ Exception in thread \"main\" `java.lang.ExceptionInitializerError`\
    \ at `garden.main` Caused by: `java.lang.RuntimeException`: Uncompilable source\
    \ - `garden.Plant` is not abstract and does not override abstract method `growthDirection()`\
    \ in `garden.Plant`\n\n### Question: 8\nOne Answer Is Right\nWhich four are syntactically\
    \ correct?\n**Answers:**\nA) `package abc; package def; import Java.util . *;\
    \ public class Test { }`\nB) `package abc; import Java.util.*; import Java.util.regex.*\
    \ ; public class Test { }`\nC) `package abc; public class Test {} import.util.*;`\n\
    D) `import Java.util.*; package abc; public class Test {}`\nE) `package abc; import\
    \ java.util. *; class Test{}`\nF) `public class Test{} package abc; import java.util.*}`\n\
    G) `import java.util.*; class Test{}`\nH) `package abc; class test {}`\n**Solution:**\
    \ B, E, G, H\n\n### Question: 9\nOne Answer Is Right\n**Given:** ![](Image00017.jpg)\n\
    Which fragment, inserted in the `Books` interface, enables the code to compile?\n\
    **Answers:**\nA) `public abstract String type; public abstract String getType()`\n\
    B) `public static String type; public abstract String getType()`\nC) `public String\
    \ type = \"Fiction\"; public static String getType()`\nD) `public String type\
    \ = \"Fiction\"; public abstract String getType()`\n**Solution:** D\n\n### Question:\
    \ 10\nOne Answer Is Right\n**Given:** ![](Image00018.jpg)\nWhat is the result?\n\
    **Answers:**\nA) Event Quiz\nB) Event Event\nC) Quiz Quiz\nD) Quiz Event\nE) Compilation\
    \ fails\n**Solution:** E\n\n## Chapter 3: 1Z0-808 - Java SE 8 Programmer IExam\
    \ Guide\n\n### Java 1Z0-808 Free Test\nJava8 Associate Web Simulator\nThe Java\
    \ 1Z0-808 Free Test is a test created to demonstrate all the features of our Java8\
    \ Associate Web Simulator. You will be able to access 25 complete questions and\
    \ will have 53 minutes to finish the test. There are several components you can\
    \ interact with when you take our mock exams:\n\n*   Take a look at the progress\
    \ bar at the top; it will tell how you are progressing throughout the exam.\n\
