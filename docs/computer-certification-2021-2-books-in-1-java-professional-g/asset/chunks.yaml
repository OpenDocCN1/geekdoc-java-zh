    # 考试难度


    在准备 `1z0-813` 认证考试时，需要实战经验才能有通过 `1z0-813` 考试的概率。Oracle 推荐的课程不能替代经验的要求。因此，没有经验的候选人想要通过
    `1z0-813` 考试是非常困难的。


    ## 为什么使用 Certification-questions.com 进行学习：

    `Certification-questions.com` 是所有寻找认证考试信息和资源的人的枢纽，我们创建一个极其准确且忠实的网页和移动考试模拟器。`Certification-questions`
    提供了一套带有答案的 `1z0-813` 考试题。`1z0-813` 模拟题旨在模仿真实考试。


    ## 考试将验证候选人的哪些知识：

    `1z0-813` 认证考试将验证通过者是否具备 `Java SE 8 编程`的重要知识和技能，包括`语言增强`、`并发`、、本地化`、`Java 文件 I/O`、`Lambda`、`Java
    集合`和 `Java 流`。


    ## 通过认证考试后的职业优势：

    拥有 `Oracle Certified Professional - Java SE 8 Programmer` 认证在招聘经理查看你的简历时无疑会为你带来优势。与没有证书的人相比，拥有证书在职位竞争中是一个显著优势。如果你拥有证书，你可以在公司的职业阶梯上晋升，或者进入公司内更好、薪水更高的工作。你还可以加入一个独特的认证且高技能的专业人士群体。许多公司支持员工获得这些认证，这甚至可能带来晋升和加薪。许多公司要求专业人员每两到三年重新认证一次。


    ## 市场趋势：

    `Oracle Certified Professional - Java SE 8 Programmer` 认证考试在市场上具有高价值，因为它附带了 Oracle
    的品牌价值。


    ## 1Z0-813 模拟测试题


    ### 题 1：单选题

    关于应用程序的本地化，哪两个陈述是正确的？（选择两个。）


    **答案：**

    A) 语言代码使用小写，区域代码使用大写字母。

    B) 资源包文件包含日期和货币信息。

    C) 使用本地化数据创建特定语言和地区的程序。

    D) 支持新的区域语言不需要重新编译代码。

    E) 文本元素（消息和 GUI 标签）硬编码在代码中。


    **解析：** A, C


    **解释：**

    **A:** 以下示例为加拿大的法语、美国的英语和英国的英语创建了 `Locale` 对象。

    ```

    aLocale = new Locale("fr", "CA");

    bLocale = new Locale("en", "US");

    cLocale = new Locale("en", "GB");

    ```

    **C:** 本地化是将国际化应用程序进行适配以支持特定区域或语言环境的过程。


    **错误选项：**

    **B:** 资源包文件不包含日期和货币信息。日期和货币信息存储在 locales 中，而不是资源包文件中。

    **D:** 不需要重新编译。

    **E:** 文本元素没有硬编码在代码中。


    **参考：**

    - https://docs.oracle.com/javase/tutorial/i18n/locale/create.html

    - http://docs.oracle.com/javaee/6/tutorial/doc/bnaxw.html


    ### 题 2：单选题

    给定：![](img/Image00019.jpg)

    哪种结果是可能的？


    **答案：**

    A) 编译失败。

    B) L1 L2 L3

    C) L2 L3

    D) L1 L3

    E) L3


    **解析：** B


    **解释：**

    `Runnable` 接口应该由任何旨在由线程执行实例的类实现。该类必须定义一个无参数的名为 `run` 方法。该接口的设计是为了为在活动状态下执行代码的对象提供一种通用协议。

    **参考：** http://docs.oracle.com/javase/7/docs/api/java/lang/Runnable.html


    ### 题 3：单选题

    给定片段：![](img/Image00020.jpg)

    在行 `n1` 处插入哪个代码片段可以使代码打印 ABCD？


    **答案：**

    A) `String str = sList.stream().reduce("”,(s1, s2) -> s1.concat(s2));`

    B) `String str = sList.stream().reduce("A”,(s1, s2) -> s1.concat(s2));`

    C) `String str = sList.stream().reduce((s1, s2) -> s1.concat(s2));`

    D) `String str = sList.stream().reduce("A”,String::concat);`


    **解析：** A


    **解释：**

    `java.util.Arrays.asList(T... a)` 返回一个由指定数组支持的固定大小列表。

    **注意：** 使用以下导入语句以便运行代码。

    ```

    import java.util.Arrays;

    import java.util.List;

    ```

    **错误选项：**

    **B, D:** 输出为 AABCD

    **参考：** https://www.tutorialspoint.com/java/util/arrays_aslist.htm


    ### 题 4：单选题

    给定代码片段：![](img/Image00021.jpg)

    结果是什么？


    **答案：**

    A) `[x, x] [x, x, x, x]`

    B) `[x, x]`

    C) `[x] [x, x]`

    D) `[x] [x, x]`


    **解析：** D


    **解释：**

    `CyclicBarrier` 是一个允许一组线程等待彼此到达共同点的同步辅助。

    **参考：** https://docs.oracle.com/javase/7/docs/api/java/util/concurrent/CyclicBarrier.html


    ### 题 5：单选题

    给定：![](img/Image00022.jpg)

    结果是什么？


    **答案：**

    A) 编译错误。

    B) 2000.0

    C) 1500.0

    D) 0.0


    **解析：** A


    **解释：**

    `mapToInt(GetSalary)` 会导致编译错误。如果替换为以下语句，在行开头添加 "."，结果为 1500。


    ### 题 6：单选题

    给定：![](img/Image00023.jpg)

    在行 `n1` 处插入哪个代码片段可以使代码打印平均 = 2.5？


    **答案：**

    A) `String str = Stream.of(1, 2, 3, 4);`

    B) `IntStream str = IntStream.of(1, 2, 3, 4);`

    C) `DoubleStream str = Stream.of(1.0, 2.0, 3.0, 4.0);`

    D) `IntStream str = Stream.of(1, 2, 3, 4);`


    ### 题 7：单选题

    给定代码片段：![](img/Image00024.jpg)

    结果是什么？


    **答案：**

    A) 编译错误。

