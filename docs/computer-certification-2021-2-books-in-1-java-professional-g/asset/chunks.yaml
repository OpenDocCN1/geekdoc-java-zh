    内容所需的技能。


    本指南详细概述了 PCAP - Python 编程认证助理员 (PCAP-31-02) 认证，包括考试的所有先决条件、考试格式、涵盖的主题、考试难度、准备方法以及目标读者画像。


    #### PCAP - Python 编程认证助理员 (PCAP-31-02) 考试简介：

    `PCAP - Certified Python Programming Associate (PCAP-31-02)` 资格是一项技术证书，用于测试在 Python
    语言中执行编码任务的能力，这些涉及编程基础以及面向对象编程中使用的基本概念和技术。


    `PCAP - Certified Associate in Python Programming (PCAP-31-02)` 认证表示该人员熟悉通用计算机编程概念，如条件执行、循环、Python
    编程语言的语法、语义和运行时环境，以及通用编码和面向对象编程技术。


    通过 PCAP 认证可以确保你完全熟悉 `Python 3` 提供的所有主要手段，让你开始自己的学习并开启开发者职业的道路。


    #### PCAP - Python 编程认证助理员 (PCAP-31-02) 考试主题：

    PCAP - Python 编程认证助理员 (PCAP-31-02) 考试大纲详细列如下，涵盖了每个章节及其主题：


    **1. 控制与评估 (25%)**

    本节涵盖的目标：

    * 基础概念：解释与与解释器、编译与编译器、语言元素、词法、语法和语义、Python 关键字、指令、缩进

    * 字面量：布尔值、整数、浮点数、科学计数法数字、字符串

    * 运算符：单元和二元运算符、优先级和绑定

    * 数值运算符：`* / % // + –`

    * 位运算运算符：`~ & ^ | << >>`

    * 字符串运算符：`* +`

    * 布尔运算符：`not and or`

    * 关系运算符（`== != > < <=`）、构建布尔表达式

    * 赋值和快捷运算符

    * 浮点数的精度

    * 基础输入输出：`input()`、`print()`、`int()`、`float()`、`str()` 函数

    * 使用 `end=` 和 `sep=` 参数格式化 `print()` 输出

    * 条件语句：`if`、`if-else`、`if-elif`、`if-elif-else`

    * `pass` 指令

    * 列表：构建向量、索引和切片、`len()` 函数

    * 简单字符串：构建、赋值、索引、切片比较、不可变性

    * 构建循环：`while`、`for`、`range()`、`in`、遍历序列

    * 扩展循环：`while-else`、`for-else`、嵌套循环和条件语句

    * 控制循环执行：`break`、`continue`


    **2. 数据聚合 (25%)**

    本节涵盖的目标：

    * 字符串详解：ASCII、Unicode、UTF-8、不可变性、使用 `\` 字符转义、字符串内部引号、多行字符串、复制与克隆、高级切片、字符串与字符串、字符串与非字符串、基础字符串方法（`upper()`、`lower()`、`isxxx()`、`capitalize()`、`split()`、`join()`
    等）和函数（`len()`、`chr()`、`ord()`）、转义字符


