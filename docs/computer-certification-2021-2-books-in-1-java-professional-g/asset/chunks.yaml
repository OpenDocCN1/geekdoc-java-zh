    * 具备 `Java 8` 编程的专业知识


    ## 如何学习 1z0-813 考试

    Oracle 提供了以下课程来帮助您准备认证考试。


    * [Java SE 7 新特性](https://education.oracle.com/pls/web_prod-plq-dad/db_pages.getpage?page_id=609&get_params=dc:D74798)

    * [Java SE 8 新特性](https://education.oracle.com/pls/web_prod-plq-dad/db_pages.getpage?page_id=609&get_params=dc:D80895)


    在参加 `1z0-813` 认证考试之前，建议参加此课程，但并非强制。在准备 `1z0-813` 认证考试时，请记住，需要实战经验才能有合理的机会通过 `1z0-813`
    考试。


