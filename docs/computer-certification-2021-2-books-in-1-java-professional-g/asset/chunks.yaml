    * 区分类继承与接口继承（包括抽象类）\n* 声明和使用 `List` 和 `ArrayList` 实例\n* 理解 Lambda 表达式\n\n## 12.\
    \ 理解模块\n* 描述模块化 `JDK`\n* 声明模块并启用模块间的访问\n* 描述模块化项目的编译和运行\n\n### 谁应该参加 1Z0-815:Java\
