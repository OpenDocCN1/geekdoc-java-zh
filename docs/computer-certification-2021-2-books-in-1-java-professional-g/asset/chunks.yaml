    Java Programmer Certification. This exam validates the ability to create executable
    Java Applications with a `main` method run a Java Program from the command line
    including console output determine the effect upon object references and primitive
    values when they are passed into methods that change the values develop code that
    demonstrates the use of polymorphisms including overriding and object type versus
    reference type differentiate among checked exceptions, unchecked exceptions, and
    errors. It also validates the ability to manipulate data using the `string builder`
    class and its methods and write a symbol lambda expression that consumes a lambda
    predicate expression application. Application Developers, Web Administrators,
    and Oracle Project Managers usually hold or pursue this certification and you
    can expect the same job role after completion of this certification.


