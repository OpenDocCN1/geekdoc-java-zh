    C) `String str = sList.stream().reduce((s1, s2) -> s1.concat(s2));`

    D) `String str = sList.stream().reduce("A”,String::concat);`


    **Solution:** A


    **Explanation:**

    The `java.util.Arrays.asList(T... a)` returns a fixed-size list backed by the
