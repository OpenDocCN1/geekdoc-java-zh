    many objects are created in the memory runtime?Answers:A) 1B) 2C) 3D) 4Solution:
    BExplanation:Explanation: obj1 and obj3\. when you do obj2 = obj1 you''re copying
    object references - you''re not making a copy of the object - and so the variables
    obj1 and obj2 will both point to the same object.Question: 8 Multiple Answers
    Are RightGiven the classes: * AssertionError * ArithmeticException * ArrayIndexOutOfBoundsException
    * FileNotFoundException * IllegalArgumentException * IOError * IOException * NumberFormatException
    * SQLException Which option lists only those classes that belong to the unchecked
    exception category?Answers:A) ArrayIndexOutOfBoundsException, ArithmeticExceptionB)
    AssertionError, IOError, IOExceptionC) ArithmeticException, FileNotFoundException,
    NumberFormatExceptionD) FileNotFoundException, IOException, SQLExceptionE) ArrayIndexOutOfBoundException,
    IllegalArgumentException, FileNotFoundExceptionSolution: AExplanation:Explanation:
    Not B: IOError and IOException are both checked errors. Not C, not D, not E: FileNotFoundException
    is a checked error. Note: Checked exceptions: * represent invalid conditions in
    areas outside the immediate control of the program (invalid user input, database
    problems, network outages, absent files) * are subclasses of Exception * a method
    is obliged to establish a policy for all checked exceptions thrown by its implementation
    (either pass the checked exception further up the stack, or handle it somehow)
    Note: Unchecked exceptions: * represent defects in the program (bugs) - often
    invalid arguments passed to a non-private method. To quote from The Java Programming
    Language, by Gosling, Arnold, and Holmes: "Unchecked runtime exceptions represent
    conditions that, generally speaking, reflect errors in your program''s logic and
    cannot be reasonably recovered from at run time." * are subclasses of RuntimeException,
    and are usually implemented using IllegalArgumentException, NullPointerException,
    or IllegalStateException * method is not obliged to establish a policy for the
    unchecked exceptions thrown by its implementation (and they almost always do not
    do so)Question: 9 Multiple Answers Are RightGiven: abstract class X { public abstract
    void methodX(); } interface Y{ public void methodY(); } Which two code fragments
    are valid? A) class Z extends X implements Y { public void methodZ(){} } B) abstract
    class Z extends X implements Y { public void methodZ(){} } C) class Z extends
    X implements Y { public void methodX(){} public void methodY(){} } D) abstract
    class Z extends X implements Y { } E) class Z extends X implements Y { public
    void methodY(){} }Answers:A) Option AB) Option BC) Option CD) Option DE) Option
    ESolution: B, C, DExplanation:Explanation: When an abstract class is subclassed,
    the subclass usually provides implementations for all of the abstract methods
    in its parent class (C). However, if it does not, then the subclass must also
    be declared abstract (B)(D). Note: An abstract class is a class that is declared
    abstract--it may or may not include abstract methods. Abstract classes cannot
    be instantiated, but they can be subclassed.Question: 10 Multiple Answers Are
    RightWhich of the following data types will allow the following code snippet to
    compile? float i=4; float j=2; ____z=i+j;Answers:A) longB) doubleC) intD) floatE)
    byteSolution: B, DExplanation:Explanation: Option B and D are the correct answer.
