  trans: "\n\n更多信息请访问：[Oracle Java8 1Z0-809 考试参考资料](https://education.oracle.com/pls/web_prod-plq-dad/db_pages.getpage?page_id=5001&get_params=p_exam_id:1Z0-809)\n\
    \n1Z0-809 示例练习题\n\n### 题：：1\n单项选择\n考虑以下类：\n```java\npublic final class Program\
    \ {\n    final private String name;\n    Program (String name){\n        this.name\
    \ = name;\n        getName();\n    }\n    //在此处编写代码\n}\n```\n以下哪种代码会使该类的实例变为不可变的？\n\
    \n**答案：**\nA) `public String getName(){return name;}`\nB) `public String getName(String\
    \ value){ name=value; return value;}`\nC) `private String getName(){return name+\"\
    a\";}`\nD) `public final String getName(){return name+=\"a\";}`\nE) 以上都是。\n\n\
    **解析：** A, C\n\n**解释：** 选项 `B` 和 `D` 存在编译错误，因为变量 `name` 是 `final` 的。选项 `C` 是 `private`\
    \ 且没有改变 `name` 的值。选项 `A` 是 `public` 且没有改变 `name` 的值。\n\n**考试目标：** 封装与子类 - 使类不可变。\n\
    **Oracle 参考：** https://docs.oracle.com/javase/tutorial/essential/concurrency/imstrat.html\n\
    \n---\n\n### 题：：2\n单项选择\n给定以下类：\n```java\n1. public class Test {\n2. public static\
    \ void main(String args[]) {\n3. //在此处写代码\n4. Thread thread = new Thread(r);\n\
    5. thread.start();\n6. }\n7. }\n```\n以下哪行提供了有效的 Thread 创建？\n\n**答案：**\nA) `Thread\
    \ r = () -> System.out.println(\"Running\");`\nB) `Run r = () -> System.out.println(\"\
    Running\");`\nC) `Runnable r = () -> System.out.println(\"Running\");`\nD) `Executable\
    \ r = () -> System.out.println(\"Running\");`\nE) 以上皆非\n\n**解析：** C\n\n**解释：**\
    \ 选项 `A`、`B` 和 `D` 是错误的，因为它们不是函数接口，所以 `C` 是唯一有效选项。\n\n**考试目标：** 并发 - 使用 Runnable\
    \ 和 Callable 创建工作线程。\n**Oracle 参考：** https://docs.oracle.com/javase/tutorial/essential/concurrency/\n\
    \n---\n\n### 题：：3\n单项选择\n给定以下类：\n```java\n1. class Singleton {\n2. private int\
    \ count = 0;\n3. private Singleton(){};\n4. public static final Singleton getInstance(){\
    \ return new Singleton(); };\n5. public void add(int i){ count+=i; };\n6. public\
    \ int getCount(){ return count;};\n7. }\n8.\n9. public class Program {\n10. public\
    \ static void main(String[] args) {\n11. Singleton s1 = Singleton.getInstance();\n\
    12. s1.add(3);\n13. Singleton s2 = Singleton.getInstance();\n14. s2.add(2);\n\
    15. Singleton s3 = Singleton.getInstance();\n16. s2.add(1);\n17. System.out.println(s1.getCount()+s2.getCount()+s3.getCount());\n\
    18. }\n19. }\n```\n结果将是什么？\n\n**答案：**\nA) 18\nB) 7\nC) 6\nD) 代码无法编译。\nE) 以上都不是\n\
    \n**解析：** C\n\n**解释：** `Singleton` 类并不是真正的单例类，实际上在每次调用 `getInstance()` 方法时都会创建一个新对象，因此\
    \ `s1`、`s2`、`s3` 的实例变量 count 分别为 `3`、`2`、`1`，选项 `C` 是正确的。\n\n**考试目标：** Java 类设计\
    \ - 创建和使用单例类和不可变类。\n**Oracle 参考：** https://docs.oracle.com/javase/tutorial/essential/concurrency/imstrat.html\n\
    \n---\n\n### 题：：4\n单项选择\n给定以下类：\n```java\n1. public class Program {\n2.\n3. public\
    \ static void main(String[] args) {\n4.\n5. List list = Arrays.asList(4,6,12,66,3);\n\
    6.\n7. String s = list.stream().map( i -> {\n8. return \"\"+(i+1);\n9. }).reduce(\"\
    \", String::concat);\n10.\n11. System.out.println(s);\n12. }\n13. }\n```\n结果将是什么？\n\
    \n**答案：**\nA) 4612663\nB) 5713674\nC) 3661264\nD) 因为第 7 行代码无法编译\nE) 第 8 行未处理的异常类型\
    \ NumberFormatException\n\n**解析：** B\n\n**解释：** `Program` 对从 `list` 生成的流应用了 `map`\
    \ 函数。对于每个 `Integer` 元素 `i`，函数返回一个值为 `i+1` 的新 `String`。该流通过 `String::concat` 归还原为一个\
    \ `String`。因此选项 `B` 是正确的。\n\n**考试目标：** 集合流，过滤器 - 使用 lambda 语法遍历集合。\n**Oracle 参考：**\
    \ https://docs.oracle.com/javase/8/docs/api/java/util/stream/package-summary\n\
    \n---\n\n### 题：：5\n单项选择\n考虑以下类：\n```java\n1. public class Test {\n2. public static\
    \ int count(T[] array, T elem) {\n3. int count = 0;\n4. for (T e : array)\n5.\
    \ if(e.compareTo(elem) > 0) ++count;\n6.\n7. return count;\n8. }\n9. public static\
    \ void main(String[] args) {\n10. Integer[] a = {1,2,3,4,5};\n11. int n = count(a,\
    \ 3);\n12. System.out.println(n);\n13. }\n14. }\n```\n结果是什么？\n\n**答案：**\nA) 2\n\
    B) 3\nC) 因为第 5 行代码无法编译。\nD) 出了异常。\nE) 以上都不是。\n\n**解析：** C\n\n**解释：** `C` 是正确的，因为变量\
    \ `e` 是泛型 `T` 类型，编译器不知道 `compareTo` 方法。为了使其通过编译，第 5 行需要修改为 `public static int\
    \ count(T[] array, T elem)`。\n\n**考试目标：** 集合与泛型 - 创建泛型类。\n**Oracle 参考：** https://docs.oracle.com/javase/tutorial/java/generics/methods.html\n\
    \n---\n\n### 题：：6\n单项选择\n给定以下类：\n```java\n1. public class Program {\n2. public\
    \ static void main(String[] args) {\n3.\n4. Thread th = new Thread(new Runnable(){\n\
    5.\n6. static {\n7. System.out.println(\"initial\");\n8. }\n9.\n10. @Override\n\
    11. public void run() {\n12. System.out.println(\"start\");\n13. }\n14. });\n\
    15. th.start();\n16. }\n17. }\n```\n结果是什么？\n\n**答案：**\nA) start\nB) initial start\n\
    C) initial\nD) 出了运行时异常。\nE) 因为第 6 行无法编译。\n\n**解析：** E\n\n**解释：** 因为在匿名类中不能声明静态初始化器，第\
    \ 6 行编译失败，所以 `E` 是正确的，`A`、`D` 是错误的。\n\n**考试目标：** 接口与 Lambda 表达式 - 匿名内部类。\n**Oracle\
    \ 参考：** https://docs.oracle.com/javase/tutorial/java/anonymousclasses.html\n\n\
    ---\n\n### 题：：7\n单项选择\n考虑以下类：\n```java\n1. final class A{\n2. private String s;\n\
    3. public A(String s){\n4. this.s = s;\n5. }\n6. public String toString(){ return\
    \ s; };\n7. public void setA(String a){ this.s+= a; };\n8. }\n9.\n10. public class\
    \ Immutable {\n11. private final A a;\n12. public Immutable(A a){\n13. this.a\
    \ = a;\n14. }\n15. public String toString(){ return a.toString();};\n16. public\
    \ static void main(String[] args){\n17.\n18. A a = new A(\"Bye\");\n19. Immutable\
    \ im = new Immutable(a);\n20. System.out.print(im);\n21.\n22. a.setA(\" bye\"\
    );\n23. System.out.print(im);\n24. }\n25. }\n```\n结果将是什么？\n\n**答案：**\nA) Bye bye\n\
    B) Bye Bye\nC) ByeBye bye\nD) 编译失败\nE) 以上都不是\n\n**解析：** C\n\n**解释：** 为了使 `immutable`\
    \ 类成为不可变类，它需要满足以下属性：\n1. 不要提供“setter”方法 - 修改字段或字段引用的方法。\n2. 将所有字段设为 `final` 和\
    \ `private`。\n3. 不允许子类覆盖方法。简单的方法是将类声明为 `final`。更高级的方法是将构造函数设为 `private` 并在工厂方法中构造实例。\n\
    4. 如果实例字段包含可变对象的引用，不允许这些对象被改变。\n属性 `1,2,3` 已满足，但遗憾的是最后一个没有满足，因此对象 `a` 是可变的，因为它通过引用传递而没有创建保护拷贝。因此选项\
    \ `C` 是正确的，`A`、`B`、`D`、`E` 是错误的。\n\n**考试目标：** 封装与子类 - 使类不可变。\n**Oracle 参考：** https://docs.oracle.com/javase/tutorial/essential/concurrency/imstrat.html\n\
    \n---\n\n### 题：：8\n单项选择\n给定以下代码：\n```java\n1. //在此处写代码\n2. @Override\n3. public\
    \ void run() {\n4. for(int i = 0;i<10;i++)\n5. System.out.print(i);\n6. }\n7.\
    \ }\n8.\n9. public class Test {\n10. public static void main(String args) {\n\
    11. Runnable t = ...\n12. Thread thread = new Thread(t);\n13. thread.start();\n\
    14. }\n15. }\n```\n以下哪行提供了有效的 Thread 创建？（注：原文代码片段不完整，根据逻辑推断）\n\n**答案：**\nA) `Thread\
    \ r = () -> System.out.println(\"Running\");`\nB) `Run r = () -> System.out.println(\"\
    Running\");`\nC) `Runnable r = () -> System.out.println(\"Running\");`\nD) `Executable\
    \ r = () -> System.out.println(\"Running\");`\nE) 以上皆非\n\n**解析：** C\n\n**解释：**\
    \ 选项 `A`、`B` 和 `D` 是错误的，因为它们不是函数接口，所以 `C` 是唯一有效选项。\n\n**考试目标：** 并发 - 使用 Runnable\
    \ 和 Callable 创建工作线程。\n\n---\n\n### 题：：9\n单项选择\n考虑以下类：\n```java\n1. class Singleton\
    \ {\n2. private int count = 0;\n3. private Singleton(){};\n4. public static final\
    \ Singleton getInstance(){ return new Singleton(); };\n5. public void add(int\
    \ i){ count+=i; };\n6. public int getCount(){ return count;};\n7. }\n8.\n9. public\
    \ class Program {\n10. public static void main(String[] args) {\n11. Singleton\
    \ s1 = Singleton.getInstance();\n12. s1.add(3);\n13. Singleton s2 = Singleton.getInstance();\n\
    14. s2.add(2);\n15. Singleton s3 = Singleton.getInstance();\n16. s2.add(1);\n\
    17. System.out.println(s1.getCount()+s2.getCount()+s3.getCount());\n18. }\n19.\
    \ }\n```\n结果将是什么？\n\n**答案：**\nA) 18\nB) 7\nC) 6\nD) 代码无法编译。\nE) 以上都不是\n\n**解析：**\
    \ C\n\n**解释：** `Singleton` 类并不是真正的单例类，实际上在每次调用 `getInstance()` 方法时都会创建一个新对象，因此\
    \ `s1`、`s2`、`s3` 的实例变量 count 分别为 `3`、`2`、`1`，选项 `C` 是正确的。\n\n**考试目标：** Java 类设计\
    \ - 创建和使用单例类和不可变类。\n**Oracle 参考：** https://docs.oracle.com/javase/tutorial/essential/concurrency/imstrat.html\n\
    \n---\n\n### 题：：10\n单项选择\n以下哪些是有效的 Executors 工厂方法？\nI. `ExecutorService es1 =\
    \ Executors.newSingleThreadExecutor(4);`\nII. `ExecutorService es1 = Executors.newFixedThreadPool(10);`\n\
    III. `ExecutorService es1 = Executors.newScheduledThreadPool();`\nIV. `ExecutorService\
    \ es1 = Executors.newScheduledThreadPool(10);`\nV. `ExecutorService es1 = Executors.newSingleThreadScheduledExecutor();`\n\
    \n**答案：**\nA) I, II, III\nB) II, III, IV\nC) I, IV, V\nD) II, IV, V\nE) 全部\n\n\
    **解析：** D\n\n**解释：** `newSingleThreadExecutor` 不能接受参数所以 `I` 是错误的，且带参数的 `newScheduledThreadPool`\
    \ 方法不存在所以 `III` 是错误的。\n\n**考试目标：** 并发 - 使用 ExecutorService 并发执行任务。\n**Oracle 参考：**\
    \ https://docs.oracle.com/javase/tutorial/essential/concurrency/\n\n---\n\n###\
    \ 第 5 章：1Z0-813 - 升级到 Java 8 OCP 考试指南\n1z0-813 考试是新的 Oracle Certified Professional\
    \ - Java SE 8 认证的一部分。该考试衡量与 Java SE 8 编程能力和技能，包括语言增强、并发、本地化、Java 文件 I/O、Lambda、Java\
    \ 集合和 Java 流。我们的 1z0-813 题库将包含这些主题。\n\n"
