- fmt: "\n*   Mark the Java Certification Questions you wish to review later. All\
    \ the questions you have marked will be listed in the right section \"marked questions\"\
    . You will be able to jump directly to the question from this list.\n\n*   if\
    \ you want to take a look at the correct answers for a question, just click the\
    \ `Solution` button. In the solution section you will be able to check your answers\
    \ as well as find a full explanation.\n\n*   Keep an eye on the countdown . This\
    \ will tell you how much time is left. When the countdown expires, the test will\
    \ be automatically submitted.\n\n*   Once the test is submitted, the result section\
    \ will expand. Here, you will be able to review all the questions of the test\
    \ . From here, you can also navigate directly to each question.\n\nMore Info for\
    \ 1Z0-803 Exam:For more info visit: [Oracle Java8 1Z0-803 Exam Reference](https://education.oracle.com/pls/web_prod-plq-dad/db_pages.getpage?page_id=5001&get_params=p_exam_id:1Z0-803)Sample\
    \ Practice Test for 1Z0-803\n\nQuestion: 1 One Answer Is Right\nGiven the code\
    \ fragment:\n\n![](Image00002.jpg)\nWhat is the result?\nAnswers:A) 3 false 1\n\
    B) 2 true 3\nC) 2 false 3\nD) 3 true 1\nE) 3 false 3\nF) 2 true 1\nG) 2 false\
    \ 1\nSolution: D\nExplanation:\nExplanation: The length of the element with index\
    \ 0, `{0, 1, 2}`, is 3. Output: 3 The element with index 1, `{3, 4, 5, 6}`, is\
    \ of type array. Output: true The element with index 0, `{0, 1, 2}` has the element\
    \ with index 1: 1\\. Output: 1\n\nQuestion: 2 One Answer Is Right\nGiven:\n\n\
    ![](Image00003.jpg)\nWhat is the result?\nAnswers:A) 6 5 6 4\nB) 6 5 5 4\nC) 6\
    \ 5 6 6\nD) 6 5 6 5\nSolution: A\nExplanation:\nExplanation: Within `main` `z`\
    \ is assigned 6\\. `z` is printed. Output: 6 Within `doStuff` `z` is assigned\
    \ 5. `DoStuff2` locally sets `z` to 4 (but `MyScope.z` is set to 4), but in `Dostuff`\
    \ `z` is still 5\\. `z` is printed. Output: 5 Again `z` is printed within `main`\
    \ (with local `z` set to 6). Output: 6 Finally `MyScope.z` is printed. `MyScope.z`\
    \ has been set to 4 within `doStuff2()`. Output: 4\n\nQuestion: 3 One Answer Is\
    \ Right\nAn unchecked exception occurs in a method `dosomething()` Should other\
    \ code be added in the `dosomething()` method for it to compile and execute?\n\
    Answers:A) The Exception must be caught\nB) The Exception must be declared to\
    \ be thrown.\nC) The Exception must be caught or declared to be thrown.\nD) No\
    \ other code needs to be added.\nSolution: D\nExplanation:\nExplanation: Because\
    \ the Java programming language does not require methods to catch or to specify\
    \ unchecked exceptions (`RuntimeException`, `Error`, and their subclasses), programmers\
    \ may be tempted to write code that throws only unchecked exceptions or to make\
    \ all their exception subclasses inherit from `RuntimeException`. Both of these\
    \ shortcuts allow programmers to write code without bothering with compiler errors\
    \ and without bothering to specify or to catch any exceptions. Although this may\
    \ seem convenient to the programmer, it sidesteps the intent of the catch or specify\
    \ requirement and can cause problems for others using your classes.\n\nQuestion:\
    \ 4 One Answer Is Right\nGiven the code fragment: \n```java\ninterface SampleClosable\
    \ { \n    public void close () throws java.io.IOException; \n}\n```\nWhich three\
    \ implementations are valid?\n\n![](Image00004.jpg)\nAnswers:A) Option A\nB) Option\
    \ B\nC) Option C\nD) Option D\nE) Option E\nSolution: A, C, E\nExplanation:\n\
    Explanation: A: Throwing the same exception is fine. C: Using a subclass of `java.io.IOException`\
    \ (here `java.io.FileNotFoundException`) is fine E: Not using a throw clause is\
    \ fine. Incorrect answers: B: Exception is not a subclass of `java.io.IOException`\
    \ and cannot be used here. D: Not extends. `SampleCloseable` cannot be the superclass\
    \ of `Test`, a superclass must be a class. (An interface extends other interfaces.)\n\
    \nQuestion: 5 One Answer Is Right\nGiven the code fragment:\n\n![](Image00005.jpg)\n\
    What is the result?\nAnswers:A) 4 Null\nB) Null 4\nC) An IllegalArgumentException\
    \ is thrown at run time\nD) 4 An ArrayIndexOutOfBoundException is thrown at run\
    \ time\nSolution: D\nExplanation:\nExplanation: The first `println` statement,\
    \ `System.out.println(array [4][1]);`, works fine. It selects the element/array\
    \ with index 4, `{0, 4, 8, 12, 16}`, and from this array it selects the element\
    \ with index 1, 4. Output: 4 The second `println` statement, `System.out.println(array)\
    \ [1][4]);`, fails. It selects the array/element with index 1, `{0, 1}`, and from\
    \ this array it try to select the element with index 4\\. This causes an exception.\
    \ Output: 4 Exception in thread \"main\" `java.lang.ArrayIndexOutOfBoundsException`:\
    \ 4\n\nQuestion: 6 One Answer Is Right\nView the exhibit:\n\n![](Image00006.jpg)\n\
    Given:\n\n![](Image00007.jpg)\nWhat is the result when this program is executed?\n\
    Answers:A) Bob's:\nB) Bob's Name\nC) Nothing prints\nD) Bob's name\nSolution:\
    \ B\nExplanation:\nExplanation: After the statement `jian = bob;` `jian` will\
    \ reference the same object.\n\nQuestion: 7 One Answer Is Right\nGiven the code\
    \ fragment:\n\n![](Image00008.jpg)\nWhat is the result?\nAnswers:A) Valid\nB)\
    \ Not valid\nC) Compilation fails\nD) An IllegalArgumentException is thrown at\
    \ run time\nSolution: C\nExplanation:\nExplanation: In segment `if (valid)` `valid`\
    \ must be of boolean, but it is a string. This makes the compilation fail.\n\n\
    Question: 8 One Answer Is Right\nWhich two are valid instantiations and initializations\
