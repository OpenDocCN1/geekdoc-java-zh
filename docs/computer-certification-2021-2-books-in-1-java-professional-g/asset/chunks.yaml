    ## Data Structures


    - lists in detail: indexing, slicing, basic methods (`append()`, `insert()`, `index()`)
    and functions (`len()`, `sorted()`, etc.), `del` instruction, iterating lists
    with the `for` loop, initializing, `in` and `not in` operators, list comprehension,
    copying and cloning

    - lists in lists: matrices and cubes

    - tuples: indexing, slicing, building, immutability

    - tuples vs. lists: similarities and differences, lists inside tuples and tuples
    inside lists

    - dictionaries: building, indexing, adding and removing keys, iterating through
    dictionaries as well as their keys and values, checking key existence, `keys()`,
    `items()` and `values()` methods


    ## 3. Functions and Modules (25%)


    ### Objectives covered by this section:


    - defining and invoking your own functions and generators

    - `return` and `yield` keywords, returning results, the `None` keyword, recursion

    - parameters vs. arguments, positional keyword and mixed argument passing, default
    parameter values

    - converting generator objects into lists using the `list()` function

    - name scopes, name hiding (shadowing), the `global` keyword

    - `lambda` functions, defining and using

    - `map()`, `filter()`, `reduce()`, `reversed()`, `sorted()` functions and the
    `sort()` method

    - the `if` operator

    - import directives, qualifying entities with module names, initializing modules

    - writing and using modules, the `name` variable

    - `pyc` file creation and usage

    - constructing and distributing packages, packages vs. directories, the role of
    the `__init__.py` file

    - hiding module entities

    - Python hashbangs, using multiline strings as module documentation


    ## 4. Classes, Objects, and Exceptions (25%)


    ### Objectives covered by this section:


    - defining your own classes, superclasses, subclasses, inheritance, searching
    for missing class components, creating objects

    - class attributes: class variables and instance variables, defining, adding and
    removing attributes, explicit constructor invocation

    - class methods: defining and using, the `self` parameter meaning and usage

    - inheritance and overriding, finding class/object components

    - single inheritance vs. multiple inheritance

    - name mangling

    - invoking methods, passing and using the `self` argument/parameter

    - the `__init__` method

    - the role of the `__str__` method

    - introspection: `__dict__`, `__name__`, `__module__`, `__bases__` properties,
    examining class/object structure

    - writing and using constructors

    - `hasattr()`, `type()`, `issubclass()`, `isinstance()`, `super()` functions

    - using predefined exceptions and defining your own ones

    - the `try-except-else-finally` block, the `raise` statement, the `except-as`
    variant

    - exceptions hierarchy, assigning more than one exception to one except branch

    - adding your own exceptions to an existing hierarchy

    - assertions

    - the anatomy of an exception object

    - input/output basics: opening files with the `open()` function, stream objects,
    binary vs. text files, newline character translation, reading and writing files,
    `bytearray` objects

    - `read()`, `readinto()`, `readline()`, `write()`, `close()` methods


    ## Who should take the PCAP - Certified Associate in Python Programming (PCAP-31-02)
    Exam


    The qualification for the PCAP - Certified Associate in Python Programming (PCAP-31-02)
    exam is a globally recognised validation that recognises individuals who receive
    it as having Python programming skills. If candidates want major changes in their
    career advancement, they need better knowledge, skills and talents. Evidence of
    this advanced knowledge and ability is presented by the PCAP - Certified Associate
    in Python Programming (PCAP-31-02) Exam certification. If an applicant has the
    knowledge and skills needed to pass the PCAP - Certified Associate in Python Programming
    (PCAP-31-02) exam, Python Programming Language Syntax, Semantics, Runtime Setting,
    General Coding Techniques, and Object-Oriented Programming, then he can take this
    examination.


    The following students can take the PCAP - Certified Associate in Python Programming
    (PCAP-31-02) Exam. The ability to use a personal computer and very basic mathematical
    skills is the only preliminary prerequisite:


    - Students with little to no previous programming awareness

    - High school students

    - Students of universities

    - Vocational school students

    - Anyone involved in computer training


    ## How to study the PCAP - Certified Associate in Python Programming (PCAP-31-02)
    Exam


    Preparation and study materials for the PCAP - Certified Associate in Python Programming
    (PCAP-31-02) Exam are provided by several online platforms including the Python
    Institute for free. Interested candidates can simply search online with the name
    of the exam and can find learning materials or take the higly recommended PCAP-31-02
    practice exams. In order to use the material provided by Python Institute, sign
    up for PCAP - Certified Associate in Python Programming (PCAP-31-02) course to
    immerse yourself in programming and to learn Python from scratch. Their course
    will train you for jobs and professions related to the widely known development
    of the software, which involves not only developing the code itself as a junior
    developer, but also designing computer systems and testing software.


    Completing this course can be a step-stone for learning some other language of
    programming and exploring technologies that use Python as a basis (e.g., Django).
    This introductory course is characterised by its student affordability, friendliness,
    and transparency. It all starts from the absolute basics, leading you to complex
    problems step by step, making you a responsible software developer capable of
    taking on numerous challenges in many IT industry positions. Refer to the links
    at the end of this document for more information on study materials.


    ## PCAP - Certified Associate in Python Programming (PCAP-31-02) Certification
    Path


    The Certified Associate in Python Programming Certification includes only one
    PCAP-31-02 exam. There are no official prerequisites for the exam but the applicants
    are recommended to have little prior knowlegde of any programming language, should
    have very basic knowledge of Mathematics and have attempted the PCAP-31-02 practice
    tests.


    ## How much PCAP - Certified Associate in Python Programming (PCAP-31-02) Exam
    Cost


    The full fee for the PCAP - Certified Associate in Python Programming (PCAP-31-02)
    exam is USD 295. This fee includes a free exam retake aswell. However, students
    can be eligible for discounts. Students who take the online learning course from
    Python Institute will be eligible for a 50% discount, making the exam fee USD
    147.5. Students who take the instructor-led course from Cisco Networking Academy
    will be eligible for a 51% discount, making the exam fee USD 144.55. For more
    information related to exam price, please visit [Python Institute Exam Fees](https://pythoninstitute.org/certification/pcap-certification-associate/pcap-exam-fees/).


    ## How to book the PCAP - Certified Associate in Python Programming (PCAP-31-02)
    Exam


    You have to follow these steps in order to participate for the PCAP - Certified
    Associate in Python Programming (PCAP-31-02) Exam:


    - Step 1:ower on to the official website of [Python Institute](https://pythoninstitute.org/certification/pcap-certification-associate/)

    - Step 2: Tap on "Schedule Exam" in the options on the website

    - Step 3: Create a user account, or sign in if you already have an account

    - Step 4: Select the exam, date, time and confirm application by paying for the
    exam


    ## What is the duration, language, and format of PCAP - Certified Associate in
    Python Programming (PCAP-31-02) Exam


    - Duration of Exam: 65 minutes + 10 minutes(Non-Disclosure Agreement/Tutorial)

    - Number of Questions: 40

    - Passing Score: 70%

    - Type of Questions: Single-choice and multiple-choice questions

    - Language of Exam: English

