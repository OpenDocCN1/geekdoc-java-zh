    and the target audience profile.


    #### Introduction to PCAP - Certified Associate in Python Programming (PCAP-31-02)
    Exam:

    `PCAP - Certified Python Programming Associate (PCAP-31-02)` qualification is
    a technical certificate that tests the ability to perform coding tasks in the
    Python language related to the fundamentals of programming and the basic notions
    and techniques used in object-oriented programming.


    `PCAP - Certified Associate in Python Programming (PCAP-31-02)` certification
    indicates that the person is familiar with general computer programming concepts
    such as conditional execution, loops, syntax of the Python programming language,
    semantics, and runtime environment, as well as general coding and object-oriented
    programming techniques.


    Becoming certified by PCAP ensures that you are fully familiar with all the primary
    means offered by `Python 3` to enable you to begin your own studies and open up
    a path to the career of the developer.


    #### Topics of PCAP - Certified Associate in Python Programming (PCAP-31-02) Exam:

    The syllabus for the PCAP - Certified Associate in Python Programming (PCAP-31-02)
    examination is listed below in detail of each section and their topics:


    **1. Control and Evaluations (25%)**

    Objectives covered by this section:

    * basic concepts: interpreting and the interpreter, compilation and the compiler,
    language elements, lexis, syntax and semantics, Python keywords, instructions,
    indenting

    * literals: Boolean, integer, floating-point numbers, scientific notation, strings

    * operators: unary and binary, priorities and binding

    * numeric operators: `* / % // + –`

    * bitwise operators: `~ & ^ | << >>`

    * string operators: `* +`

    * Boolean operators: `not and or`

    * relational operators (`== != > >= < <=`), building complex Boolean expressions

    * assignments and shortcut operators

    * accuracy of floating-point numbers

    * basic input and output: `input()`, `print()`, `int()`, `float()`, `str()` functions

    * formatting `print()` output with `end=` and `sep=` arguments

    * conditional statements: `if`, `if-else`, `if-elif`, `if-elif-else`

    * the `pass` instruction

    * simple lists: constructing vectors, indexing and slicing, the `len()` function

    * simple strings: constructing, assigning, indexing, slicing comparing, immutability

    * building loops: `while`, `for`, `range()`, `in`, iterating through sequences

    * expanding loops: `while-else`, `for-else`, nesting loops and conditional statements

    * controlling loop execution: `break`, `continue`


    **2. Data Aggregates (25%)**

    Objectives covered by this section:

    * strings in detail: ASCII, UNICODE, UTF-8, immutability, escaping using the `\`
    character, quotes and apostrophes inside strings, multiline strings, copying vs.
    cloning, advanced slicing, string vs. string, string vs. non-string, basic string
    methods (`upper()`, `lower()`, `isxxx()`, `capitalize()`, `split()`, `join()`,
    etc.) and functions (`len()`, `chr()`, `ord()`), escape characters

