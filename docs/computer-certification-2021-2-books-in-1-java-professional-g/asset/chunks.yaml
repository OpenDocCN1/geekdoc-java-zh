    ## 数据结构


    - 列表详解：索引、切片、基本方法（`append()`，`insert()`，`index()`）和函数（`len()`，`sorted()`，等）、`del`
    指令、使用 `for` 循环遍历列表、初始化、`in` 和 `not in` 运算符、列表推导式、复制与克隆

    - 嵌套列表：矩阵和三维数组

    - 元组：索引、切片、构建、不可变性

    - 元组与列表对比：相似点与区别、元组中的列表和列表中的元组

    - 字典：构建、索引、添加和删除键、遍历字典及其键和值、检查键是否存在、`keys()`，`items()` 和 `values()` 方法


    ## 3. 函数与模块 (25%)


    ### 本节涵盖的学习目标：


    - 定义和调用你自己的函数和生成器

    - `return` 和 `yield` 关键字、返回结果、`None` 关键字、递归

    - 参数（parameters）与实参（arguments）、位置参数、关键字参数和混合传参、默认参数值

    - 使用 `list()` 函数将生成器对象转换为列表

    - 作用域、名称隐藏（遮蔽）、`global` 关键字

    - `lambda` 函数，的定义与使用

    - `map()`，`filter()`，`reduce()`，`reversed()`，`sorted()` 函数和 `sort()` 方法

    - `if` 运算符

    - 导入指令、使用模块名限定实体、初始化模块

    - 编写和使用模块、`name` 变量

    - `pyc` 文件的创建与使用

    - 包的构建与发布、包与目录的区别、`__init__.py` 文件的作用

    - 隐藏模块实体

    - Python 头部（hashbang）、使用多行字符串作为模块文档


    ## 4. 类、对象与异常 (25%)


    ### 本节涵盖的学习目标：


    - 定义你自己的类、父类、子类、继承、查找缺失的类组件、创建对象

    - 类属性：类变量和实例变量、属性的定义、添加和删除、显式构造函数调用

    - 类方法：的定义与使用、`self` 参数的含义与用法

    - 继承与重写、查找类/对象组件

    - 单继承与多重继承

    - 名称修饰（name mangling）

    - 调用方法、传递和使用 `self` 参数/参数

    - `__init__` 方法

    - `__str__` 方法的作用

    - 内省：`__dict__`，`__name__`，`__module__`，`__bases__` 属性、检查类/对象结构

    - 编写和使用构造函数

    - `hasattr()`，`type()`，`issubclass()`，`isinstance()`，`super()` 函数

    - 使用预定义异常并自定义异常

    - `try-except-else-finally` 块、`raise` 语句、`except-as` 变体

    - 异常层次结构、在一个 except 分支分配多个异常

    - 在现有层次中添加你自己的异常

    - 断言

    - 异常对象的构造

    - 输入/输出基础：使用 `open()` 函数打开文件、流对象、二进制与文本文件、换行符转换、文件的读与写、`bytearray` 对象

    - `read()`，`readinto()`，`readline()`，`write()`，`close()` 方法


