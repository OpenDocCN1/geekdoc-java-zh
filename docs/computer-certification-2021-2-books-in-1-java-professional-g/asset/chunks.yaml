- fmt: "\nFor more info visit: [Oracle Java8 1Z0-809 Exam Reference](https://education.oracle.com/pls/web_prod-plq-dad/db_pages.getpage?page_id=5001&get_params=p_exam_id:1Z0-809)\n\
    \nSample Practice Test for 1Z0-809\n\n### Question: 1\nOne Answer Is Right\nConsider\
    \ the following class:\n```java\npublic final class Program {\n    final private\
    \ String name;\n    Program (String name){\n        this.name = name;\n      \
    \  getName();\n    }\n    //code here\n}\n```\nWhich of the following codes will\
    \ make an instance of this class immutable?\n\n**Answers:**\nA) `public String\
    \ getName(){return name;}`\nB) `public String getName(String value){ name=value;\
    \ return value;}`\nC) `private String getName(){return name+\"a\";}`\nD) `public\
    \ final String getName(){return name+=\"a\";}`\nE) All of Above.\n\n**Solution:**\
    \ A, C\n\n**Explanation:** Option `B` and `D` have a compile error since `name`\
    \ variable is `final`. Option `C` is `private` and doesn't change the `name` value.\
    \ Option `A` is `public` and doesn't change the `name` value.\n\n**Exam Objective:**\
    \ Encapsulation and Subclassing - Making classes immutable.\n**Oracle Reference:**\
    \ https://docs.oracle.com/javase/tutorial/essential/concurrency/imstrat.html\n\
    \n---\n\n### Question: 2\nOne Answer Is Right\nGiven the following class:\n```java\n\
    1. public class Test {\n2. public static void main(String args[]) {\n3. //Code\
    \ Here\n4. Thread thread = new Thread(r);\n5. thread.start();\n6. }\n7. }\n```\n\
    Which of the following lines will give a valid Thread creation?\n\n**Answers:**\n\
    A) `Thread r = () -> System.out.println(\"Running\");`\nB) `Run r = () -> System.out.println(\"\
    Running\");`\nC) `Runnable r = () -> System.out.println(\"Running\");`\nD) `Executable\
    \ r = () -> System.out.println(\"Running\");`\nE) None Of Above \n\n**Solution:**\
    \ C\n\n**Explanation:** Option `A`, `B`, and `D` are incorrect as they are not\
    \ functional interfaces, so `C` is the only valid option.\n\n**Exam Objective:**\
    \ Concurrency - Creating worker threads using Runnable and Callable.\n**Oracle\
    \ Reference:** https://docs.oracle.com/javase/tutorial/essential/concurrency/\n\
    \n---\n\n### Question: 3\nOne Answer Is Right\nGiven the following class:\n```java\n\
    1. class Singleton {\n2. private int count = 0;\n3. private Singleton(){};\n4.\
    \ public static final Singleton getInstance(){ return new Singleton(); };\n5.\
    \ public void add(int i){ count+=i; };\n6. public int getCount(){ return count;};\n\
    7. }\n8.\n9. public class Program {\n10. public static void main(String[] args)\
    \ {\n11. Singleton s1 = Singleton.getInstance();\n12. s1.add(3);\n13. Singleton\
    \ s2 = Singleton.getInstance();\n14. s2.add(2);\n15. Singleton s3 = Singleton.getInstance();\n\
    16. s2.add(1);\n17. System.out.println(s1.getCount()+s2.getCount()+s3.getCount());\n\
    18. }\n19. }\n```\nWhat will be the result?\n\n**Answers:**\nA) 18\nB) 7\nC) 6\n\
    D) The code will not compile.\nE) None of above\n\n**Solution:** C\n\n**Explanation:**\
    \ The class `Singleton` is not a real singleton class, in fact at each `getInstance()`\
    \ method invocation a new object is created, so `s1`, `s2`, `s3` count instance\
    \ variable are `3`, `2`, `1`, and then option `C` is correct.\n\n**Exam Objective:**\
    \ Java Class Design - Create and use singleton classes and immutable classes.\n\
    **Oracle Reference:** https://docs.oracle.com/javase/tutorial/essential/concurrency/imstrat.html\n\
    \n---\n\n### Question: 4\nOne Answer Is Right\nGiven the following class:\n```java\n\
    1. public class Program {\n2.\n3. public static void main(String[] args) {\n4.\n\
    5. List list = Arrays.asList(4,6,12,66,3);\n6.\n7. String s = list.stream().map(\
    \ i -> {\n8. return \"\"+(i+1);\n9. }).reduce(\"\", String::concat);\n10.\n11.\
    \ System.out.println(s);\n12. }\n13. }\n```\nWhat will be the result?\n\n**Answers:**\n\
    A) 4612663\nB) 5713674\nC) 3661264\nD) The code will not compile because of line\
    \ 7.\nE) Unhandled exception type NumberFormatException al line 8\n\n**Solution:**\
    \ B\n\n**Explanation:** The `Program` is applying a `map` function to the stream\
    \ generated from `list`. For each `Integer` element `i` the function returns a\
    \ new `String` with value `i+1`. The stream is then reduced to a `String` by the\
    \ `String::concat` function. So Option `B` is correct, and `A`, `C`, `D`, `E`\
    \ are incorrect.\n\n**Exam Objective:** Collections Streams, and Filters - Iterating\
    \ through a collection using lambda syntax.\n**Oracle Reference:** https://docs.oracle.com/javase/8/docs/api/java/util/stream/package-summary.html\n\
    \n---\n\n### Question: 5\nOne Answer Is Right\nConsider the following class:\n\
    ```java\n1. public class Test {\n2. public static int count(T[] array, T elem)\
    \ {\n3. int count = 0;\n4. for (T e : array)\n5. if( e.compareTo(elem) > 0) ++count;\n\
    6.\n7. return count;\n8. }\n9. public static void main(String[] args) {\n10. Integer[]\
    \ a = {1,2,3,4,5};\n11. int n = Test.count(a, 3);\n12. System.out.println(n);\n\
    13. }\n14. }\n```\nWhat will be the result?\n\n**Answers:**\nA) 2\nB) 3\nC) The\
    \ code will not compile because line 5.\nD) An exception is thrown.\nE) None of\
    \ Above.\n\n**Solution:** C\n\n**Explanation:** `C` is correct because the variable\
    \ `e` is a generic `T` type so compile has no knowledge of method `compareTo`.\
    \ In order to make it compile line 5 needs to be changed in: `public static int\
    \ count(T[] array, T elem)`.\n\n**Exam Objective:** Collections and Generics -\
    \ Creating a custom generic class.\n**Oracle Reference:** https://docs.oracle.com/javase/tutorial/java/generics/methods.html\n\
    \n---\n\n### Question: 6\nOne Answer Is Right\nGiven the following class:\n```java\n\
    1. public class Program {\n2. public static void main(String[] args) {\n3.\n4.\
    \ Thread th = new Thread(new Runnable(){\n5.\n6. static {\n7. System.out.println(\"\
    initial\");\n8. }\n9.\n10. @Override\n11. public void run() {\n12. System.out.println(\"\
    start\");\n13. }\n14. });\n15. th.start();\n16. }\n17. }\n```\nWhat will be the\
    \ result?\n\n**Answers:**\nA) start\nB) initial start\nC) initial\nD) A runtime\
    \ exception is thrown.\nE) The code will not compile because line 6.\n\n**Solution:**\
    \ E\n\n**Explanation:** Because you cannot declare static initializers in an anonymous\
    \ class, the compilation at line 6, so `E` is correct and `A`, `B`, `D` are incorrect.\n\
    \n**Exam Objective:** Interfaces and Lambda Expressions - Anonymous inner classes.\n\
    **Oracle Reference:** https://docs.oracle.com/javase/tutorial/java/java/anonymousclasses.html\n\
    \n---\n\n### Question: 7\nOne Answer Is Right\nConsider the following class:\n\
    ```java\n1. final class A{\n2. private String s;\n3. public A(String s){\n4. this.s\
    \ = s;\n5. }\n6. public String toString(){ return s; };\n7. public void setA(String\
    \ a){ this.s+= a; };\n8. }\n9.\n10. public class Immutable {\n11. private final\
    \ A a;\n12. public Immutable(A a){\n13. this.a = a;\n14. }\n15. public String\
    \ toString(){ return a.toString();};\n16. public static void main(String[] args){\n\
    17.\n18. A a = new A(\"Bye\");\n19. Immutable im = new Immutable(a);\n20. System.out.print(im);\n\
    21.\n22. a.setA(\" bye\");\n23. System.out.print(im);\n24. }\n25. }\n```\nWhat\
    \ will be the result?\n\n**Answers:**\nA) Bye bye\nB) Bye Bye\nC) ByeBye bye\n\
    D) Compilation failure\nE) None of\n\n**Solution:** C\n\n**Explanation:** In order\
    \ for the class `immutable` to be an immutable class it needs to satisfy the following\
    \ properties:\n1. Don't provide \"setter\" methods - methods that modify fields\
    \ or objects referred to by fields.\n2. Make all fields `final` and private.\n\
    3. Don't allow subclasses to override methods. The simplest way to do this is\
    \ to declare the class as `final`. A more sophisticated approach is to make the\
    \ constructor `private` and construct instances in factory methods.\n4. If the\
    \ instance fields include references to mutable objects, don't allow those objects\
    \ to be changed.\nProperties `1,2,3` are satisfied, but unfortunately the last\
    \ one is not, so the object `a` is mutable because it is passed by reference without\
    \ making a protection copy of it. So option `C` is correct and `A`, `B`, `D`,\
    \ `E` are incorrect.\n\n**Exam Objective:** Encapsulation and Subclassing - Making\
    \ classes immutable.\n**Oracle Reference:** https://docs.oracle.com/javase/tutorial/essential/concurrency/imstrat.html\n\
    \n---\n\n### Question: 8\nOne Answer Is Right\nGiven the following code:\n```java\n\
    1. // Code Here\n2. @Override\n3. public void run() {\n4. for(int i = 0;i<10;i++)\n\
    5. System.out.print(i);\n6. }\n7. }\n8.\n9. public class Test {\n10. public static\
    \ void main(String args[]) {\n11. Task t = new Task();\n12. Thread thread = new\
    \ Thread(t);\n13. thread.start();\n14. }\n15. }\n```\nWhich of the following lines\
    \ will give the result 0123456789?\n\n**Answers:**\nA) `class Task extends Runnable\
    \ {`\nB) `class Task implements Runnable {`\nC) `class Task implements Thread\
    \ {`\nD) `class Task extends Thread {`\nE) None Of Above\n\n**Solution:** B\n\n\
    **Explanation:** We can create a `Thread` by passing an implementation of `Runnable`\
    \ to a `Thread` constructor, so the only correct option is B.\n\n**Exam Objective:**\
    \ Concurrency - Creating worker threads using Runnable and Callable.\n**Oracle\
    \ Reference:** https://docs.oracle.com/javase/tutorial/essential/concurrency/\n\
    \n---\n\n### Question: 9\nOne Answer Is Right\nConsider the following class:\n\
    ```java\n1. public class Program {\n2.\n3. public static void main(String[] args){\n\
    4.\n5. Callable c = new Callable(){\n6. @Override\n7. public String call() throws\
    \ Exception {\n8. String s=\"\";\n9. for (int i = 0; i < 10; i++) { s+=i;}\n10.\
    \ return s;\n11. }\n12. };\n13.\n14. ExecutorService executor = Executors.newThreadExecutor();\n\
    15. Future future = executor.submit(c);\n16. try {\n17. String result = future.wait();\n\
    18. System.out.println(result);\n19. } catch (ExecutionException e) {\n20. e.printStackTrace();\n\
    21. }\n22. }\n23. }\n```\nWhat will be the result?\n\n**Answers:**\nA) 0123456789\n\
    B) 123456789\nC) Unhandled exception type InterruptedException al line 17\nD)\
    \ The code will not compile because line 5.\nE) The code will not compile because\
    \ line 17.\n\n**Solution:** E\n\n**Explanation:** We are creating a `Callable`\
    \ object with an anonymous class at line 5, the syntax is correct so option C\
    \ is incorrect. Passing the object `c` to an executor will get as return type\
    \ `Future` to wait for thread ends. But at line 17 `wait()` doesn't exist so `E`\
    \ is correct.\n\n**Exam Objective:** Concurrency - Creating worker threads using\
    \ Runnable and Callable.\n\n---\n\n### Question: 10\nOne Answer Is Right\nWhich\
    \ of the following are valid Executors factory methods?\nI. `ExecutorService es1\
    \ = Executors.newSingleThreadExecutor(4);`\nII. `ExecutorService es1 = Executors.newFixedThreadPool(10);`\n\
    III. `ExecutorService es1 = Executors.newScheduledThreadPool();`\nIV. `ExecutorService\
    \ es1 = Executors.newScheduledThreadPool(10);`\nV. `ExecutorService es1 = Executors.newSingleThreadScheduledExecutor();`\n\
    \n**Answers:**\nA) I, II, III\nB) II, III, IV\nC) I, IV, V\nD) II, IV, V\nE) All\n\
    \n**Solution:** D\n\n**Explanation:** The method `newSingleThreadExecutor` cannot\
    \ accept parameters so `I` is incorrect, and the method `newScheduledThreadPool`\
    \ with parameters doesn't exist so `III` is incorrect.\n\n**Exam Objective:**\
    \ Concurrency - Using an ExecutorService to concurrently execute tasks.\n**Oracle\
    \ Reference:** https://docs.oracle.com/javase/tutorial/essential/concurrency/\n\
    \n---\n\n### Chapter 5: 1Z0-813 - Upgrade to Java SE 8 OCP-Exam Guide\n1z0-813\
    \ exam is part of the new Oracle Certified Professional - Java SE 8 Programmer\
    \ certification. This exam measures your ability and skills related to Java SE\
    \ 8 Programming include Language Enhancements, Concurrency, Localization, Java\
    \ File I/O, Lambda, Java Collections, and Java Streams. Our 1z0-813 dumps will\
    \ include those topics.\n"
