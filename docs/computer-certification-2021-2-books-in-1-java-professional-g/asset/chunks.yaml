    3\. Don''t allow subclasses to override methods. The simplest way to do this is
    to declare the class as final. A more sophisticated approach is to make the constructor
    private and construct instances in factory methods. 4\. If the instance fields
    include references to mutable objects, don''t allow those objects to be changed.
    Properties 1,2,3 are satisfied, but unfortunately the last one is not, so the
    object "a" is mutable because it is passed by reference without making a protection
    copy of it. So option C is correct and A,B,D,E are incorrect. Exam Objective :
    Encapsulation and Subclassing - Making classes immutable. Oracle Reference : https://docs.oracle.com/javase/tutorial/essential/concurrency/imstrat.htmlQuestion:
    8 One Answer Is RightGiven the following code: 1\. // Code Here 2\. @Override
    3\. public void run() { 4\. for(int i = 0;i<10;i++) 5\. System.out.print(i); 6\.
    } 7\. } 8\. 9\. public class Test { 10\. public static void main(String args[])
    { 11\. Task t = new Task(); 12\. Thread thread = new Thread(t); 13. thread.start();
    14\. } 15\. } Which of the following lines will give the result 0123456789?Answers:A)
    class Task extends Runnable {B) class Task implements Runnable {C) class Task
    implements Thread {D) class Task extends Thread {E) None Of AboveSolution: BExplanation:We
    can create a Thread by passing an implementation of Runnable to a Thread constructor,
    so the only correct option is B. Exam Objective : Concurrency - Creating worker
    threads using Runnable and Callable. Oracle Reference : https://docs.oracle.com/javase/tutorial/essential/concurrency/Question:
    9 One Answer Is RightConsider the following class: 1\. public class Program {
    2\. 3\. public static void main(String[] args){ 4\. 5\. Callable c = new Callable(){
    6. @Override 7\. public String call() throws Exception { 8\. String s=""; 9. for
    (int i = 0; i < 10; i++) { s+=i;} 10\. return s; 11\. } 12\. }; 13. 14\. ExecutorService
    executor = Executors.newSingleThreadExecutor(); 15\. Future future = executor.submit(c);
    16\. try { 17\. String result = future.wait(); 18. System.out.println(result);
    19\. } catch (ExecutionException e) { 20. e.printStackTrace(); 21\. } 22\. } 23\.
    } What will be the result?Answers:A) 0123456789B) 12345678910C) Unhandled exception
    type InterruptedException al line 17D) The code will not compile because of line
    5.E) The code will not compile because of line 17.Solution: EExplanation:We are
    creating a Callable object with an anonymous class at line 5, the syntax is correct
    so option C is incorrect. Passing the object "c" to an executor will get as return
    type a Future to wait for thread ends. But at line 17 method wait of Class Future
    doesn''t exist so E is correct. Exam Objective : Concurrency - Creating worker
    threads using Runnable and Callable. Oracle Reference : https://docs.oracle.com/javase/tutorial/essential/concurrency/Question:
    10 One Answer Is RightWhich of the following are valid Executors factory methods?
    I. ExecutorService es1 = Executors.newSingleThreadExecutor(4); II. ExecutorService
    es1 = Executors.newFixedThreadPool(10); III. ExecutorService es1 = Executors.newScheduledThreadPool();
    IV. ExecutorService es1 = Executors.newScheduledThreadPool(10); V. ExecutorService
    es1 = Executors.newSingleThreadScheduledExecutor();Answers:A) I, II, IIIB) II,
    III, IV, VC) I, IV, VD) II, IV, VE) AllSolution: DExplanation:The method "newSingleThreadExecutor"
    cannot accept parameters so I is incorrect, and the method "newScheduledThreadPool"
    with parameters doesn''t exist so III is incorrect. Exam Objective : Concurrency
    - Using an ExecutorService to concurrently execute tasks. Oracle Reference : https://docs.oracle.com/javase/tutorial/essential/concurrency
