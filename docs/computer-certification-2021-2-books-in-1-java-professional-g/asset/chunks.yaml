  trans: "\n\n# 1. 描述 Java 技术与 Java 开发\n* 识别 Java 语言的关键特征\n\n## 2. 使用 Java 原始数据类型和\
    \ String 接口\n* 声明和初始化变量（包括原始数据类型的类型转换和提升）\n* 识别变量的作用域\n* 使用局部变量类型推断\n* 创建和操作 `Strings`\n\
    * 使用 `StringBuilder` 类及其方法处理数据\n\n## 3. 使用 Java 数组\n* 声明、实例化、初始化和使用一维数组\n* 声明、实例化、初始化和使用二维数组\n\
    \n## 4. 创建和使用方法\n* 创建带有参数和返回值的方法及构造函数\n* 创建并调用重重载方法\n* 在方法和字段上应用 `static` 关键字\n\
    \n## 5. 通过继承重用实现\n* 创建和使用子类与父类\n* 创建并扩展抽象类\n* 通过重写方法实现多态性\n* 利用多态进行类型转换和方法调用，区分对象类型与引用类型\n\
    * 区分重载、重写和隐藏\n\n## 6. 异常处理\n* 描述 `Exception` 处理的优势，并区分检查异常、未检查异常和 `Errors`\n*\
    \ 创建 `try-catch` 块并确定异常如何改变程序流\n* 创建并调用抛出异常的方法\n\n## 7. 创建一个简单的 Java 程序\n* 创建带有\
    \ `main` 类的可执行 Java 程序\n* 从命令行编译并运行 Java 程序\n* 创建并导入包\n\n## 8. 使用运算符和决策结构\n* 使用\
    \ Java 运算符，包括使用括号覆盖运算符优先级\n* 使用 Java 控制语句，包括 `if`、`if/else`、`switch`\n* 创建和使用\
    \ `do/while`、`while`、`for` 和 `for each` 循环，包括嵌套循环、`break` 和 `continue` 语句\n\n\
