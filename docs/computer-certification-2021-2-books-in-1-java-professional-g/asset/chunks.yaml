    ### Question: 1: One Answer Is Right

    Which two statements are true about localizing an application? (Choose two.)


    **Answers:**

    A) Language codes use lowercase and region codes use uppercase letters.

    B) Resource bundle files include date and currency information.

    C) Language and region-specific programs are created using localized data.

    D) Support for new regional languages does not require recompilation of the code.

    E) Textual elements (messages and GUI labels) are hard-coded on the code.


    **Solution:** A, C


    **Explanation:**

    **A:** The following examples create `Locale` objects for the French language
    in Canada, the English language in the U.S. and Great Britain.

    ```

    aLocale = new Locale("fr", "CA");

    bLocale = new Locale("en", "US");

    cLocale = new Locale("en", "GB");

    ```

    **C:** Localization is the process of adapting an internationalized application
    to support a specific region or locale.


    **Incorrect Answers:**

    **B:** Resource bundle files does not include date a currency information. Date
    and currency information are stored in locales, not in resource bundle files.

    **D:** Recompilation is not necessary.

    **E:** Textual elements are not hard-coded on the code.


    **References:**

    - https://docs.oracle.com/javase/tutorial/i18n/locale/create.html

    - http://docs.oracle.com/javaee/6/tutorial/doc/bnaxw.html


