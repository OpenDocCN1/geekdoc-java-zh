    4 One Answer Is RightGiven these facts about Java types in an application: - Type
    x is a template for other types in the application. - Type x implements dostuff
    (). - Type x declares, but does NOT implement doit(). - Type y declares doOther()
    . Which three are true?Answers:A) Type y must be an interface.B) Type x must be
    an abstract class.C) Type y must be an abstract class.D) Type x could implement
    or extend from Type y.E) Type x could be an abstract class or an interface.F)
    Type y could be an abstract class or an interface.Solution: B, D, FExplanation:Explanation:
    Unlike interfaces, abstract classes can contain fields that are not static and
    final, and they can contain implemented methods. Such abstract classes are similar
    to interfaces, except that they provide a partial implementation, leaving it to
    subclasses to complete the implementation. If an abstract class contains only
    abstract method declarations, it should be declared as an interface instead. Note:
    An interface in the Java programming language is an abstract type that is used
    to specify an interface (in the generic sense of the term) that classes must implement.
    Interfaces are declared using the interface keyword, and may only contain method
    signature and constant declarations (variable declarations that are declared to
    be both static and final). An interface may never contain method definitions.
    Note 2: an abstract class is a class that is declared abstract--it may or may
    not include abstract methods. Abstract classes cannot be instantiated, but they
    can be subclassed. An abstract method is a method that is declared without an
    implementation (without braces, and followed by a semicolon)Question: 5 One Answer
    Is RightGiven:![](Image00015.jpg)What two changes, made independently, will enable
    the code to compile?Answers:A) Change the signature of Account to: public class
    Account.B) Change the signature of CheckingAccount to: public abstract CheckingAccountC)
    Implement private methods for deposit and withdraw in CheckingAccount.D) Implement
    public methods for deposit and withdraw in CheckingAccount.E) Change Signature
    of checkingAccount to: CheckingAccount implements Account.F) Make Account an interface.Solution:
    B, DExplanation:Explanation: Compiler say: - Der Typ CheckingAccount muss die
    Ã¼bernommene abstrakte Methode Account.deposit(double) implementieren - Der Typ
    CheckingAccount muss die Ã¼bernommene abstrakte Methode Account.withdraw(double)
    implementieren ODER Typ CheckingAccount als abstract definierenQuestion: 6 One
    Answer Is RightWhich two forms of abstraction can a programmer use in Java?Answers:A)
    enumsB) interfacesC) primitivesD) abstract classesE) concrete classesF) primitive
    wrappersSolution: B, DExplanation:Explanation: When To Use Interfaces An interface
    allows somebody to start from scratch to implement your interface or implement
    your interface in some other code whose original or primary purpose was quite
    different from your interface. To them, your interface is only incidental, something
    that have to add on to the their code to be able to use your package. The disadvantage
    is every method in the interface must be public. You might not want to expose
    everything. *When To Use Abstract classes An abstract class, in contrast, provides
    more structure. It usually defines some default implementations and provides some
    tools useful for a full implementation. The catch is, code using it must use your
    class as the base. That may be highly inconvenient if the other programmers wanting
    to use your package have already developed their own class hierarchy independently.
    In Java, a class can inherit from only one base class. *When to Use Both You can
    offer the best of both worlds, an interface and an abstract class. Implementors
    can ignore your abstract class if they choose. The only drawback of doing that
    is calling methods via their interface name is slightly slower than calling them
    via their abstract class name. Reference: http://mindprod.com/jgloss/interfacevsabstract.htmlQuestion:
