  trans: "\n\n# 1Z0-804 考试更多信息\n更多更多信息请访问：[Oracle Java8 1Z0-804 考试参考](https://education.oracle.com/pls/web_prod-plq-dad/db_pages.getpage?page_id=5001&get_params=p_exam_id:1Z0-804)\n\
    \n## 1Z0-804 示例练习题\n\n### 题目：1\n单选题\n**给定条件：** ![](img/Image00012.jpg)\n输出结果中将出现哪三个值？\n\
    **答案：**\nA) 5\nB) 7\nC) a1\nD) a2\nE) b1\nF) b2\n**解析：** A, D, E\n**详细说明：**\n\
    解释：调用了基类的静态方法 >> A\n```java\nA myA = new B();\nSystem.out.print(myA.doA() + myA.doA2()\
    \ + myA.a);\nclass B {\n    String doA() {\n        return \"b1 \";\n    }\n \
    \   int a = 7;\n}\nclass A {\n    protected static String doA2 () {\n        return\
    \ \"a2 \";\n    }\n}\n```\n\n### 题目：2\n单选题\n**给定条件：** ![](img/Image00013.jpg)\n\
    结果是什么？\n**答案：**\nA) false false\nB) true false\nC) true true\nD) 编译失败\nE) 运行时抛出异常\n\
    **解析：** A\n**详细说明：**\n解释：`(this == obj)` 是 `equals()` 的对象级实现，因此，如果引用指向不同的对象然后调用了\
    \ `super.equals()`，对象方法 `equals()` 的结果仍然是 FALSE。更好的 `equals()` 重写方法是比较属性，例如：\n\
    ```java\npublic boolean equals (Object obj) {\n    if (obj != null){\n       \
    \ Product p = (Product)obj;\n        return this.id == p.id;\n    }\n    return\
    \ false;\n}\n```\n\n### 题目：3\n单选题\n**给定条件：** ![](img/Image00014.jpg)\n**结果是什么？**\n\
    **答案：**\nA) tolting cantering tolting\nB) cantering cantering cantering\nC) 编译失败\n\
    D) 运行时抛出异常\n**解析：** C\n**详细说明：**\n解释：编译器提示：无法降低从 `Rideable` 继承的方法的可见性。必须是 PUBLIC。\n\
    ```java\npublic String ride() {\n    return \"cantering \";\n}\npublic String\
    \ ride() {\n    return \"tolting \";\n}\n```\n如果给定上述代码，结果将是：A : tolting cantering\
    \ tolting\n\n### 题目：4\n单选题\n**根据关于应用程序中 Java 类型的以下事实：** \n- 类型 `x` 是应用程序中其他类型的模板。\n\
    - 类型 `x` 实现了 `dostuff()`。\n- 类型 `x` 声明了但**没有实现 `doit()`。\n- 类型 `y` 声明了 `doOther()`。\n\
    以下哪三个是正确的？\n**答案：**\nA) 类型 `y` 必须是一个接口。\nB) 类型 `x` 必须是一个抽象类。\nC) 类型 `y` 必须是一个抽象类。\n\
    D) 类型 `x` 可以实现或继承自类型 `y`。\nE) 类型 `x` 可以是抽象类或接口。\nF) 类型 `y` 可以是抽象类或接口。\n**解析：**\
    \ B, D, F\n**详细说明：**\n解释：与接口不同，抽象类可以包含非静态且最终的字段，并且它们可以包含已实现的方法。此类抽象类与接口相似，不同之处在于它们提供了部分实现，将完整的实现留给子类来完成。如果一个抽象类只包含抽象方法声明，则应该被声明为接口。\n\
    **注意：** Java 编程语言中的接口是一种抽象类型，用于指定类必须实现的接口（广义意义上的术语）。接口使用 `interface` 关键字声明，并且只能包含方法签名和常量声明（声明为同时\
    \ `static` 和 `final` 的变量声明）。接口永远不能包含方法定义。\n**注意 2：** 抽象类是声明为 `abstract` 的类——它可能包含也可以不包含抽象方法。抽象类不能被实例化，但可以被子类化。抽象方法是声明时没有实现的方法（不带大括号，后跟分号）。\n\
    \n### 题目：5\n单选题\n**给定条件：** ![](img/Image00015.jpg)\n独立进行哪两个更改将使代码通过编译？\n**答案：**\n\
    A) 将 `Account` 的签名改为：`public class Account`。\nB) 将 `CheckingAccount` 的签名改为：`public\
    \ abstract CheckingAccount`。\nC) 在 `CheckingAccount` 中为 `deposit` 和 `withdraw`\
    \ 实现私有方法。\nD) 在 `CheckingAccount` 中为 `deposit` 和 `withdraw` 实现公共方法。\nE) 将 `checkingAccount`\
    \ 的签名改为：`CheckingAccount implements Account`。\nF. 使 `Account` 接口。\n**解析：** B,\
    \ D\n**详细说明：**\n解释：编译器提示：类型 CheckingAccount 必须实现继承的抽象方法 `Account.deposit(double)`\
    \ - 类型 CheckingAccount 必须实现继承的抽象方法 `Account.withdraw(double)` 或者将类型 CheckingAccount\
    \ 定义为 abstract。\n\n### 题目：6\n单选题\n**给定条件：** ![](img/Image00015.jpg)\n哪两种形式可以在\
    \ Java 中使用？\n**答案：**\nA) 枚举\nB) 接口\nC) 原始类型\nD) 抽象类\nE) 内部类\n**解析：** B, D\n**详细说明：**\n\
    解释：与类可以可以提供提供的，，它们可以包含已实现的方法。此类抽象类与接口相似，不同在于它们提供了部分实现，将完整实现留给子类来完成。接口接口可以可以可以，，，，，。。。可以。抽象类可以可以可以，，可以可以可以可以。。。，，可以调用一个类。。调用调用调用类是特殊。。。。调用，，可以可以调用方法。参考：http://mindprod.com/interfaceabstract\n\
    \n### 题目：7\n单选题\n**给定条件：** ![](img/Image00016.jpg)\n结果是什么？\n**答案：**\nA) Down\n\
    B) Up\nC) null\nD) 编译失败\nE) 运行时抛出异常\n**解析：** D\n**详细说明：**\n解释：在 \"main\" 线程中抛出\
    \ `java.lang.Exception` 位于 `garden.main`，由于：`java.lang.RuntimeException`：源文件错误\
    \ - `garden.Plant` 不是抽象的且没有重写 `garden.Plant` 中的抽象方法\n\n### 题目：8\n单选题\n以下四个在语法上是正确的？\n\
    **答案：**\nA) `package abc; package def; import Java.util . *; public class Test\
    \ { }`\nB) `package abc; import Java.util.*; import Java.regex.*; public class\
    \ Test { }`\nC) `package abc; public class Test {} import.util.*;`\nD) `import\
    \ Java.util.*; package abc; public class Test {}`\nE) `package abc; import java.util.\
    \ *; class Test{}`（注：原文为 `package abc; import java.util. *`）\n**解析：** B, E, G,\
    \ H\n\n### 题目：9\n单选题\n**给定条件：** ![](img/Image00017.jpg)\n插入 `Books` 接口的哪个片段可以使代码通过编译？\n\
    **答案：**\nA) `public abstract String type; public abstract String getType()`\n\
    B) `public static String type; public abstract String getType()`\nC) `public String\
    \ type = \"Fiction\"; public static String getType()`\nD) `public String type\
    \ = \"Fiction\"; public abstract String getType()`\n**解析：** D\n\n### 题目：10\n单选题\n\
    **给定条件：** ![](img/Image00018.jpg)\n结果是什么？\n**答案：**\nA) Event Quiz\nB) Event Event\n\
    C) Quiz Quiz\nD) Quiz Event\nE) 编译失败\n**解析：** E\n\n## 第 3 章：1Z0-804 - Java SE\
    \ 8 程序员 I 考试指南\n\n### Java 1Z0-804 免费测试\nJava8 Associate 模拟器\nJava 1Z0-804 免费测试是一个旨在演示我们\
    \ Java8 Associate 模拟器所有功能的测试。你将访问 25 个完整问题，并有 53 分完成测试。在参加我们的模拟考试时，有几个可以交互的组件：\n\
    \n*   查看顶部的进度条；它会告诉你你在整个考试中的进度。\n*   阅读问题并勾选相应的复选框选择你认为正确的答案。\n\n"
