    \        return z;\n    }\n\n    public static void main(String ar[ ] )\n{\n \
    \       int a = 5, b = 6;\n        Add ob = new Add();\n        int c = ob.addition(a,b);\n\
    \        System.out.println(\"Add: \"+c);\n    }\n}\n```\n\n## 逐行执行 (Step Over)\n\
    \n逐行执行也执行下一行。但如果下一行是函数调用，它会在后台执行该函数并返回结果。\n\n让我们来看一个例子。在下面的代码中，箭头标记定义了代码中的控制。\n\
    \n```java\npublic class Add\n{\n```\n\n![](img/bf2d1ac3cc200346937a3b901a9ff2f3_27_0.png)\n\
    \n```java\npublic int addition(int x, int y)\n{\n    int z = x+y;\n    return\
    \ z;\n}\npublic static void main(String ar[ ]\n{\n    int a = 5, b = 6;\n    Add\
    \ ob = new Add();\n    int c = ob.addition(a,b);\n    System.out.println(\"Add:\
    \ \"+c);\n}\n```\n\n逐行执行命令将控制移动到下一行，即“int c = ob.addition(a,b)”。在这一行，有一个函数调用 `addition(int,\
