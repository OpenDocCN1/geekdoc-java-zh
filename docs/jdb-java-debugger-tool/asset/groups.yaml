    # 3. SYNTAX


    This chapter explains the syntax of JDB command. The syntax contains four sections
    listed as follows:


    +   - JDB

    - option

    - class

    - arguments


    # Syntax


    The syntax of JDB is as follows.


    ```

    jdb [ options ] [ class ] [ arguments ]

    ```


    # JDB


    It calls jdb.exe from the Java Development Kit.


    # Options


    These include the command line options used to debug a Java program in efficient
    way. The JDB launcher accepts all the options (such as -D, -classpath, and -X)
    and some additional advanced options such as (-attach, -listen, -launch, etc.).


    # Class


    It is the class name on which you want to perform debugging operations.


    # Arguments


    These are the input values given to a program at runtime. For example, arg[0],
    arg[1] to the main() method.


    In the above four segments, options is the most important one.


    ![](img/bf2d1ac3cc200346937a3b901a9ff2f3_12_0.png)'
  - '[PAGE 13]


    # # 4. OPTIONS


    This chapter describes the important options available in JDB that are submitted
    as arguments with the jdb command.


    # ## Options


    The following table contains a list of options accepted by JDB:


    | Name | Description |

    | - | - |

    | -help | Displays the help message and lists the related options. |

    | -sourcepath | Uses the given path for source files if path is not specified,
    then it takes the default path ".", i.e., the current directory. |

    | -attach | Attaches the debugger to the running VM by specifying the VM address.
    |

    | -listen | Waits for the running VM to connect using standard connector. |

    | -listenany | Waits for the running VM to connect using any address. |

    | -launch | Launches the debugged application immediately up startup job. |

    | -listconnectors | Lists the connectors available in this VM. |

    | -connect | Connects to the target VM using named connector with listed argument
    values. |

    | -dbtrace | Prints information for debugging jdb. |

    | -tclient | Runs the application in Java Hotspot VM (client). |

    | -tserver | Runs the application in Java Hotspot VM (server). |

    | -Joption | Passes the option to the Java virtual machine used to run JDB. |


    ![](img/bf2d1ac3cc200346937a3b901a9ff2f3_13_0.png)'
