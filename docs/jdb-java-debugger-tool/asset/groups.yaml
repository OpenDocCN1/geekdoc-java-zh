    此外，我们还有可以用于调试程序的高级概念，例如：


    - 单步执行 (stepping)，

    - 断点 (breakpoints)，以及

    - 异常或观察点 (exceptions)。


    ## 调试类型


    我们可以使用多种方法调试程序：


    - 使用 Java 字节码（Java 代码的编译版本）

    - 使用程序内部的注释

    - 将类挂载到运行中的程序

    - 远程调试

    - 需需调试

    - 优化后的代码调试


    ## Java 调试器


    以下是市面上可用的一些 Java 调试器示例：


    - Eclipse、Netbeans 等 IDE 包含它们自带的调试器（Visual cafe, Borland, JBuilder）

    - 独立的调试器 GUI（如 Jikes、Java 平台调试器和 JProbe）

    - 命令行调试器（Sun 的 JDB）

    - 记事本或 VI 驱动（堆栈跟踪）


    本教程将介绍如何使用命令行调试器 **jdb.**。


    ## JDB


    Java 调试器 (JDB) 是一个用于在命令行调试 Java 类的工具。它实现了 Java 平台调试器架构。它通过 Java 调试接口 (JDI) 帮助检测并修复
    Java 程序中的错误。


    ![](img/bf2d1ac3cc200346937a3b901a9ff2f3_6_0.png)


    ## JDK 中的 JDB


    以下架构定义了 JDB 在 JDK 中的角色。它主要包含三个单元：


    1. Java 虚拟机工具接口 (JVM TI)

    2. Java 调试接线池 (JDWP)

    3. Java 调试器接口 (JDI)


    ![](img/bf2d1ac3cc200346937a3b901a9ff2f3_7_0.png)


    JVM TI 是由 VM 实现的本地编程接口。它提供了检查和调试在 VM 上运行的应用状态的方法。它允许实现者（VM 实现者）很容易地封装到调试架构中。它还使用名为
    JDWP 的第三方通道进行通信。


    ## JDWP


    它定义了在调试器进程和调试器前端之间传递的信息格式和请求。拥有 Java 调试器 JDWP 的主要目的是允许被调试程序和调试器在不同的 VM 或不同的平台上运行时进行通信。


    ## JDI


    它是一个实现为前端的高级 Java 接口。它定义了用户代码级别的变量信息。建议在所有调试器开发中使用 JDI 层。它使用 JDWP 与被调试的 JVM 通信。


    ## 2. 安装


    本章介绍了如何在 Windows 和 Linux 系统上安装 JDB。JDB 是 JDK 的一部分。因此，只需安装 JDK 即可在命令提示符中使用 JDB。


    ## 系统要求


    以下是安装 JDB 的系统要求：


