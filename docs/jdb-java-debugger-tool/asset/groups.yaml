    \ |\n| print | 显示 Java 对象和基本类型值。 |\n| dump | 对于基本类型值，此命令与 print 相同。对于对象，它打印对象中定义的每个字段的当前值。包含静态字段和实例字段。\
    \ |\n| threads | 列出当前运行的线程。 |\n| thread | 选择一个线程作为当前线程。 |\n| where | 转储当前线程的栈。\
