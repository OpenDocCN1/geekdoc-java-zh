    Add: \"+c);\n    }\n```\n```java\n}\n```\n\n如果你使用步出命令，控制器将移动到下一行，即“int c = ob.addition(a,b)”。\n\
    \n```java\npublic class Add\n{\n    public int addition( int x, int y)\n    {\n\
    \        int z = x+y;\n        return z;\n    }\n\n    public static void main(\
    \ String ar[ )\n    {\n        int a = 5, b = 6;\n        Add ob = new Add();\n\
    \        int c = ob.addition(a,b);\n        System.out.println(\"Add: \"+c);\n\
    \    }\n}\n```\n\n## 9. 异常 (EXCEPTION)\n\n本章解释了如何使用 JDB 处理异常。通常情况下，当程序在没有 catch\
    \ 语句的情况下产生异常时，VM 会打印异常行并退出。如果带有 catch 语句抛出异常，则异常将由 catch 语句处理。在使用 JDB 运行类时，它也会抛出未捕获的异常。该异常可以使用\
