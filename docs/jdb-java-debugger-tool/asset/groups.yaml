    \    at dbException.main(dbException.java:?)\nThe application exited\nC:\\Users\\\
    Satish Kumar\\Desktop\\db\\>```\n\n## 10. Eclipse 中的 JDB\n\n本章解释如何在 Eclipse 中使用\
