- md: "\n# 5. SESSION\n\nThis chapter describes how to start a JDB session in different\
    \ ways. JDB launch is the frequently used technique to start a JDB session.\n\n\
    There are two different ways to start a JDB session:\n\n- Starting JDB session\
    \ by adding class (main class name) to it.\n- Adding JDB to running JVM to start\
    \ session.\n\n## Start a Session by Adding DB Class\n\nThe following command starts\
    \ a JDB session:\n\n### Syntax\n\n```\n>jdb <classname>\n```\n\n### Example\n\n\
    Let us assume we have a class named TestClass. The following command starts a\
    \ JDB session from the TestClass.\n\n```\n>jdb TestClass\n```\n\nIf you follow\
    \ this command, it starts a new Java VM with any specified parameters. Thereafter\
    \ it loads the class and stops it before executing the first statement of the\
    \ class.\n\n## Start a Session by Adding JDB to a Running JVM\n\nGiven below is\
    \ the syntax and example to start a JDB session by adding the JDB to a running\
    \ JVM.\n\n### Syntax\n\nThe following syntax is for JDB session:\n\n```\n-agentlib:jdwp=transport=dt_shmem,address=<add>,server=y,suspend=n\n\
    ```\n\n![](img/bf2d1ac3cc200346937a3b901a9ff2f3_15_0.png)\n\n### Example\n\nLet\
    \ us assume the main class name is TestClass and JVM allows the JDB to connect\
    \ it later. The following is the command to add JDB to JVM:\n\n```java\n-agentlib:jdwp=transport=dt_shmem,address=jdbconn,server=y,suspend=n\
    \ TestClass\n```\n\nNow you can attach the JDB to the JVM with the following command:\n\
    \n```\njdb -attach jdbconn\n```\n\n**Note:** Here, the TestClass is not added\
    \ to the JDB command, because JDB is connected to the running VM instead of launching\
    \ a new one.\n\n# 6. BASIC COMMANDS\n\nThis chapter takes you through the basic\
    \ commands of JDB. After launching a session, these commands are used for debugging\
    \ a program.\nThe following is the list of commands used for debugging.\n\n| Name\
    \ | Description |\n| --- | --- |\n| help or ? | The most important JDB command;\
    \ it displays a list of the recognized commands with a brief description. |\n\
    | run | After starting JDB and setting the necessary breakpoints, you can use\
    \ this command to start execution and debug an application. |\n| cont | Continues\
    \ execution of the debugged application after a breakpoint, exception, or step.\
    \ |\n| print | Displays Java objects and primitive values. |\n| dump | For primitive\
    \ values, this command is identical to print. For objects, it prints the current\
    \ value of each field defined in the object. Static and instance fields are included.\
    \ |\n| threads | Lists the threads that are currently running. |\n| thread | Selects\
    \ a thread to be the current thread. |\n| where | Dumps the stack of the current\
    \ thread. |\n\n### Example\nLet us assume we have a sample class called Add for\
    \ the following examples:\n\nAdd.java\n\n```java\npublic class Add\n{}\n```\n\n\
    ![](img/bf2d1ac3cc200346937a3b901a9ff2f3_17_0.png)\n\n```java\npublic int addition(int\
    \ x, int y)\n{\n    int z = x+y;\n    return z;\n}\n\npublic static void main(String\
    \ ar[] )\n{\n    int a = 5, b = 6;\n    Add ob = new Add();\n    int c = ob.addition(a,b);\n\
    \    System.out.println(\"Add: \"+c);\n}\n```\n\nCompile this class Add.java using\
    \ the following command:\n\n```\n\\javac Add.java\n```\n\n### Run\n\nThis command\
    \ executes the main class file, which is added to JDB for debugging. Execute the\
    \ following commands to run the Add class.\n\n```\n\\jdb Add\ninitializing jdb\
    \ ...\n>run\n```\n\nOn executing these commands, you get to see the following\
    \ output:\n\n![](img/bf2d1ac3cc200346937a3b901a9ff2f3_19_0.png)\n\n# 7. BREAKPOINTS\n\
    \nThis chapter explains the concept of breakpoints and how to set breakpoints\
    \ in a program. A breakpoint introduces an explicit stop or pause in the execution\
    \ of a program at a particular line of code while debugging. It is useful to acquire\
    \ knowledge about variables in the program.\n\n### Syntax\n\nThe following command\
    \ sets up a breakpoint at a particular line:\n\n```\n> stop at <class name>:::<Line\
    \ no\n```\n\nThe following command sets up a breakpoint on a particular method\
    \ or a particular variable:\n\n```\n> stop in <class name>::<Method name | Variable\
    \ name\n```\n\n### Example\n\nThe following example shows how to set a breakpoint\
    \ in a class.\n\n```java\npublic class Add\n{\n    public int addition(int x,\
    \ int y)\n    {\n        int z = x+y;\n        return z;\n    }\n    public static\
    \ void main(String[] )\n    {\n        int a = 5, b = 6;\n        Add ob = new\
    \ Add();\n        int c = ob.addition(a,b);\n        System.out.println(\"Add:\
    \ \"+c);\n    }\n}\n```\n\nSave the above file as Add.java. Compile this file\
    \ using the following command:\n\n```\n\\javac Add.java\n```\n\n### Debugging\n\
    \nLet us take an example for debugging. Here, we start the debugging process by\
    \ setting up a breakpoint on main(). Given below are the steps followed in the\
    \ debugging process:\n\n### Step 1: Start a JDB Session\n\nThe following command\
    \ starts JDB session on the Add class for debugging:\n\n```\n> jdb Add\n```\n\n\
    ### Step 2: Set a Breakpoint\n\nThe following command sets up a breakpoint on\
    \ the main() method of Add class.\n\n```\n> stop in Add.main\n```\n\nIf the breakpoint\
    \ is set successfully, you get to see the following output after the class is\
    \ loaded:\n\n### Step 3: Start Debugging\n\nThe following command starts execution\
    \ of the class:\n\n```\n> run Add\n```\n\nIf you run this command, you get to\
    \ see the following output. In this output, you find that the execution stops\
    \ at the breakpoint position, that is at the main() function.\n\n```\nC:\\Windows\\\
    system32\\cmd.exe - jdb Add\n> run\nrun Add\nCaught java.lang.Breakpoint\nCaught\
    \ java.lang.Breakpoint\nStarted: \"thread-main\". Add.main(), line=11 bci=0\n\
    11 int a=5, b=6;\n```\n\nThe execution stops at the first line of the main method,\
    \ that is at \"int a=5, b=6;\" or line 11 in the code. You can observe this information\
    \ in the output.\n\n### Step 4: Continue Execution\n\nThe following command continues\
    \ the program execution:\n\n```\ncont\n```\n\nIt gives you the remaining execution\
    \ part and output as follows:\n\n```\n> Add:11\nThe application exited\n>\n```\n\
    \n# 8. STEPPING\n\nThis chapter explains how to use the concept of stepping in\
    \ debugging a program. Stepping is a debugger feature that lets you execute the\
    \ code by stepping through line by line. Using this, you can examine each line\
    \ of the code to ensure they are behaving as intended.\n\nThe following commands\
    \ are used in the stepping process:\n\n- step: steps to the next line of execution\n\
    - list: examines where you are in the code\n- cont: continues the remaining execution\n\
    \n### Example\n\nThe following class uses the Add class that we used in the previous\
    \ chapter:\n\n```java\npublic class Add\n{\n    public int addition(int x, int\
    \ y)\n    {\n        int z = x+y;\n        return z;\n    }\n\n    public static\
    \ void main(String ar[] ])\n    {\n        int a = 5, b = 6;\n        Add ob =\
    \ new Add();\n        int c = ob.addition(a,b);\n        System.out.println(\"\
    Add: \"+c);\n    }\n}\n```\n\nSave the above file as Add.java. Compile this file\
    \ using the following command:\n\n```\n\\javac Add.java\n```\n\nLet us assume\
    \ the breakpoint is set on the main() method of the Add class. The following steps\
    \ show how to apply stepping in the Add class.\n\n### Step 1: Execute the Job\n\
    \nThe following command starts executing the class named Add.\n\n```\n> run Add\n\
    ```\n\nIf you execute this command, you get to see the following output. In this\
    \ output, you can find that the execution stops at the breakpoint position, i.e.,\
    \ at the main() method.\n\n![](img/bf2d1ac3cc200346937a3b901a9ff2f3_24_0.png)\n\
    \nThe execution stops at the first line of the main method, that is at \"int a=5,\
    \ b=6;\" or line no: 11 in the code. You can observe this information in the output.\n\
    \n### Step 2: Step through the Code\n\nThe following command steps the execution\
    \ to the next line.\n\n```\nmain[1] step\n```\n\nNow the execution steps to line\
    \ no: 12. You get to see the following output.\n\n### Java Debugger\n\n```\nC:\\\
    Windows\\system32\\cmd.exe\nmain[1] step\nStep completed: \"thread-main\", Add.main(),\
    \ line=12 bci=5\n  Add ob = new Add();\n```\n\n### Step 3: List the Code\n\nThe\
    \ following command lists the code:\n\n```\nmain[1] list\n```\n\nYou get the following\
    \ output. List command is used to let you know the line in the code up to which\
    \ the program control has reached. Notice the arrow mark => in the following screenshot\
    \ that shows the current position of the program control.\n\n```C:\\Windows\\\
    system32\\cmd.exe\nmain[i] list\n  public static void main(String[] j) {\n   \
