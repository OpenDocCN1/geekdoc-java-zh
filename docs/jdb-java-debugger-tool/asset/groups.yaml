    \        int z = x+y;\n        return z;\n    }\n\n    public static void main(\
    \ String ar[ )\n    {\n        int a = 5, b = 6;\n        Add ob = new Add();\n\
    \        int c = ob.addition(a,b);\n        System.out.println(\"Add: \"+c);\n\
    \    }\n}\n```\n\n## 9. EXCEPTION\n\nThis chapter explains how to handle the exception\
    \ JDB. Generally, whenever a program raises an exception without catch statement,\
    \ the VM prints the exception line, the cause of exception, and exits. If the\
    \ exception has been raised with catch statement, then the exception is handled\
    \ by the catch statement. Here, the VM prints the output with the cause of exception.\
    \ When the class raises the exception is running using JDB, it also throws uncaught\
    \ exception. That exception can be handled using the catch command.\n\n### Example\n\
    \nLet us take an example of the class dbException:\n\n```java\npublic class dbException\n\
    {\n    public static void main(String ar[]) throws Exception\n    {\n        int\
    \ a=8, b=0;\n        System.out.println(\"Welcome\");\n        System.out.println(\"\
    Ex: \"+(a/b));\n    }\n}\n```\n\nSave the above file with the name dbException.java.\
    \ Compile this file using the following command:\n\n```bash\njavac dbException.java\n\
    ```\n\nFollow the steps below to handle the exception.\n\n### Step 1: Run the\
    \ Class\n\nThe following command executes the class named dbException as:\n\n\
    ```bash\njava dbException\n>run\n```\n\ndbException class contains an exception,\
    \ hence you get to see the following output:\n\n![](img/bf2d1ac3cc200346937a3b901a9ff2f3_32_0.png)\n\
    \n### Step 2: Catch the Exception\n\nThe following command catches the exception:\n\
    \n```bash\ncatch java.lang.ArithmeticException\n```\n\nIt will give you the following\
    \ output:\n\n```\nSet java.lang.ArithmeticException\n```\n\n### Step 3: Continue\
    \ Execution\n\nThe following command continues the execution. Now the catch handles\
    \ the arithmetic exception as follows:\n\n```bash\nC:\\Windows\\system32\\cmd.exe\n\
    main> cont: Exception in thread \"main\" java.lang.ArithmeticException: by zero\n\
    \    at dbException.main(dbException.java:?)\nThe application exited\nC:\\Users\\\
    Satish Kumar\\Desktop\\db\\>\n```\n\n## 10. JDB IN ECLIPSE\n\nThis chapter explains\
    \ how to use JDB in Eclipse. Before proceeding further, you need to install Eclipse\
    \ Indigo. Follow the steps below to install Eclipse Indigo on your system.\n\n\
    ### Step 1: Download and Install Eclipse\n\nYou can download Eclipse from the\
    \ following link: https://www.eclipse.org/downloads/packages/eclipse-ide-java-developers/indigo.\n\
    \n### Step 2: Create a New Project and a New Class\n\n- Create a new Java project\
