    .\n- Create a new class by right clicking on the sampledebug project.\n- Select\
    \ options -> new -> class\n- Name it as \"Add.java\"\n\n### Add.java\n\n```java\n\
    public class Add\n{\n    public int addition(int x, int y)\n    {\n        int\
    \ z = x+y;\n        return z;\n    }\n\n    public static void main(String ar[]\
    \ )\n    {\n      int a = 5, b = 6;\n      Add ob = new Add();\n      int c =\
    \ ob.addition(a,b);\n      System.out.println(\"Add: \"+c);\n    }\n}\n```\n\n\
    ### Step 3: Open the Debug Perspective\n\nFollow the instructions given below\
    \ to open the debug perspective. On the Eclipse IDE, go to Window -> Open perspective\
    \ -> Debug. Now you get the debug perspective for the program Add.java. You get\
    \ to see the following window.\n\n![](img/bf2d1ac3cc200346937a3b901a9ff2f3_35_0.png)\n\
    \n## Java Debugger\n\n## Sections in Debug Perspective\n\nThe sections in the\
