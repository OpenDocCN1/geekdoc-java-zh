    Observe the following options in the given screenshot:


    +   1. Using the check box in the left, we can select or deselect a breakpoint.
    Here, we use one breakpoint, i.e., Add class-main() method.

    2. The single cross icon "X" is used to delete the selected breakpoint.

    3. The double cross icon "XX" is used to delete all the breakpoints in your code.

    4. The arrow pointer is used to point to the code where the selected breakpoint
    is applied.


    The remaining functionalities in the breakpoint section are as follows:


    +   - **Hitcount**: It shows how many times the control hits this breakpoint.
