  md: "# 1. INTRODUCTION\n\nDebugging is a technical procedure to find and remove\
    \ bugs or defects in a program and get expected results. Debugging includes testing\
    \ and monitoring. It is very complex when the subunits of a program are tightly\
    \ coupled. We can debug a program using the debugger tools that follow the prescribed\
    \ APIs. A debugger allows you to step through every aspect of a code, inspect\
    \ all the elements, and remove errors, if any.\n\n# Debugging Techniques\n\nThere\
    \ are different kinds of techniques to debug a Java program. The old method of\
    \ debugging is by using print statements at the end of every segment which will\
    \ print the trace statements on the console. Take a look at the following code.\n\
    \n```\npublic class Add\n{\n    public static void main(String ar[])\n    {\n\
    \        int a=ar[0];\n        system.out.println(\"A : \" +a);\n\n        int\
    \ b=ar[1];\n        system.out.println(\"B : \" +b);\n\n        int c = a + b;\n\
    \        system.out.println(\"C = a + b : \" +c);\n    }\n}\n```\n\nHere, we have\
    \ a program that adds two numbers and prints the output. Notice at each step,\
    \ we have introduced a print statement that prints the state of the program on\
    \ the console. This is the traditional approach to debug a program.\n\n![](img/bf2d1ac3cc200346937a3b901a9ff2f3_5_0.png)"
  merge: -1
