  md: "# 7. BREAKPOINTS\n\nThis chapter explains the concept of breakpoints and how\
    \ to set breakpoints in a program. A breakpoint introduces an explicit stop or\
    \ pause in the execution of a program at a particular line of code while debugging.\
    \ It is useful to acquire knowledge about variables in the program in its execution.\n\
    \n# Syntax\n\nThe following command sets up a breakpoint at a particular line\
    \ number:\n\n```\n> stop at <class name>:::<Line no\n```\n\nThe following command\
    \ sets up a breakpoint on a particular method or on a particular variable:\n\n\
    ```\n> stop in <class name>::: Method name | Variable name>\n```\n\n# Example\n\
    \nThe following example shows how to set up a breakpoint in a class.\n\n```\n\
    public class Add\n{\n    public int addition( int x, int y)\n    {\n        int\
    \ z = x+y;\n        return z;\n    }\n    public static void main( String[] )\n\
    {\n        int a = 5, b = 6;\n    }\n```"
