  md: "# 9. EXCEPTION\n\nThis chapter explains how to handle the exception class JDB.\
    \ Generally, whenever a program raises an exception without a catch statement,\
    \ then the VM prints the exception line, the cause of the exception, and exits.\
    \ If the exception has been raised with a catch statement, then the exception\
    \ is handled by the catch statement. Here, the VM prints the output with the cause\
    \ of exception.\n\nWhen the class raises the exception is running using JDB, it\
    \ also throws the **uncaught** exception. That exception can be handled using\
    \ the **catch** command.\n\n# Example\n\nLet us take an example of the class JdbException:\n\
    \n```\npublic class JdbException\n{\n    public static void main(String ar[])\
    \ throws Exception\n    {\n        int a=8, b=0;\n        System.out.println(\"\
    Welcome\");\n        System.out.println(\"Ex: \"+(a/b));\n    }\n}\n```\n\nSave\
    \ the above file with the name JdbException.java. Compile this file using the\
    \ following command:\n\n```\n\\javac JdbException.java\n```\n\nFollow the steps\
    \ given below to handle the exception."
