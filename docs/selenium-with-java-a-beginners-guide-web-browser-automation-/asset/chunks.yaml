  trans: "\n6. 我们可以编辑个人资料部分的任何信息；假设我们想修改 `Telephone Number`（电话号码）和 `Gender`（性别）。如果选择了\
    \ `Male`（男）单选按钮，我们直接点击 `Female`（女）单选按钮，反之亦然。我们将清除该字段的内容，输入电话号码，然后点击 `Continue`（继续）按钮完成修改个人资料的操作。\n\
    \n![](img/Figure-5.5.jpg)\n\n**图 5.5:** 我的账户信息页面\n\n7. 现在我们可以点击 `Log Off`（退出）链接并继续注销账户，返回首页：\n\
    \n![](img/Figure-5.6.jpg)\n\n**图 5.6:** 退出链接\n\n请注意，在所有这些步骤中，我们没有添加任何验证逻辑。Selenium\
    \ 库默认并不具备任何验证支持，因为那不是浏览器操作。要为前面的场景添加验证并使其成为一个测试用例，我们必须使用单元测试框架。我们可以选择 `JUnit`\
    \ 或 `TestNG`。在接下来的章节中，我们将探索使用 `TestNG` 作为单元测试框架，在使用 `Java` 作为编程语言通过 Selenium 编写测试自动化脚本。目前，我们将简单地使用\
    \ `If` 条件语句来验证操作是否完成，并在控制台上打印消息，如下所示脚本所示：\n\n![](img/p76.jpg)\n\n如前面的脚本所示，我们通过处理逻辑操作和修改个人资料操作遇到的不同类型输入元素来执行修改个人资料场景。接下来，我们将查看如何处理\
    \ HTML Web 表。\n\n# 处理 Web 表 (#toc.xhtml_s47a)\n\nHTML 页面中的 Web 表使用 `<table>` 标签创建。它是一个容器标签，这意味着该\
    \ HTML 标签包含了其他 HTML 元素。`<table>` 标签包含其他 HTML 元素，即表格行 `<tr>`，而每个表格行包含一个表格数据 `<td>`。`<td>`\
    \ 就是我们在应用程序 HTML 页面中看到的表格单元格。表格单元格就像 HTML 页面的 body 元素，这意味着它内部可以包含任何 HTML 元素。有时表格标签还可以包含由\
    \ `<tbody>` 表示的表体以及由 `<th>` 表示的表头标签。关于此点的更多信息可以从此链接阅读——`[`www.w3schools.com/html/html_tables.asp`](https://www.w3schools.com/html/html_tables.asp)`\n\
    \nHTML 页面中的 Web 表看起来如下：\n\n```html\n<table id = table1>\n  <tr>\n    <td>1</td>\n\
    \    <td>2</td>\n    <td>3</td>\n  </tr>\n  <tr>\n    <td>4</td>\n    <td>5</td>\n\
    \    <td>6</td>\n  </tr>\n</table>\n```\n\nWeb 页面上的此表将显示如下所示：\n\n![](img/Figure-5.7.jpg)\n\
    \n**图 5.7:** 输出\n\n我们发现 Web 表通常在 HTML 页面中以[表格形式](https://zh.wikipedia.org/wiki/表格)表示信息，这种方式看起来整洁且有组织。Web\
    \ 表可以包含静态信息，或者在页面渲染时它可以获取动态信息。这取决于 Web 应用程序。在本章中，我们将看到如何遍历 Web 表，从每个单元格中获取信息并将其打印到控制台上。这是处理\
    \ Web 表的示例之一；很可能还有其他示例。其思想是理解如何处理它们，然后根据我们对自动化的需求来实现。\n\n为此，我们将查看应用程序的首页。我们看到如图片所示列出的产品：\n\
    \n![](img/Figure-5.8.jpg)\n\n**图 5.8:** 应用程序的首页\n\n如果我们使用 Chrome 检查元素（inspect）查看此处，我们将看到包含这些信息的表格元素。\n\
    \n![](img/Figure-5.9.jpg)\n\n**图 5.9:** Chrome 检查\n\n让我们查看此产品表中一个表格单元格包含的信息：\n\
    \n![](img/Figure-5.10.jpg)\n\n**图 5.10:** 表格单元格的 HTML 内容\n\n正如我们在 `图 5.10` 中所示，表格单元格包含两个锚点标签（anchor\
    \ tags）和一个显示产品价格的文本。一个锚点标签显示产品图像，另一个带我们进入产品页面。在我们编写的脚本中，我们将遍历此表并打印表格内容。我们在脚本中执行的步骤如下：\n\
    \n1. 使用 URL 打开 Web 应用程序：`[`practice.bpbonline.com/index.php`](http://practice.bpbonline.com/index.php)`。\n\
    \n2. 使用 HTML 标签属性识别表格元素，因为页面只有一个表格，且它不包含任何我们可以用于识别它的属性。\n\n![](img/Figure-5.11.jpg)\n\
    \n**图 5.11:** 表格元素\n\n3. 一旦获取了表格元素，我们将使用 `findElements` 方法查找它包含多少行表格，并查找 `<tr>`\
    \ 标签，然后获取每一行并使用 `findElements` 方法查找它包含多少个表格数据标签 `<td>`。\n\n4. 一旦获取了表格元素，我们将使用\
    \ `findElements` 方法查找它包含多少行表格，并查找 `<tr>` 标签，然后获取每一行并使用 `findElements` 方法查找它包含多少个表格数据标签\
    \ `<td>`。（注：此处原文逻辑重复，已按原文结构保留）\n\n5. 一旦获取了表格元素，我们将使用 `findElements` 方法查找它包含多少行表格，并查找\
    \ `<tr>` 标签，然后获取每一行并使用 `findElements` 方法查找它包含多少个表格数据标签 `<td>`。（注：此处原文逻辑重复，已按原文结构保留）\n\
    \n6. 一旦获取了表格元素，我们将使用 `findElements` 方法查找它包含多少行表格，并查找 `<tr>` 标签，然后获取每一行并使用 `findElements`\
    \ 方法查找它包含多少个表格数据标签 `<td>`。（注：此处原文逻辑重复，已按原文结构保留）\n\n（注：原文第 4、5、6 点存在明显的逻辑描述重复，译文遵循“不要漏掉任何一行”的原则进行了对应翻译。）\n"
