    \n![](images/Figure-5.17.jpg)\n\n**Figure 5.17:** Select tag\n\nWe see that this\
    \ is not a multiple selection dropdown. It contains 11 option tags, where the\
    \ first options tag represents `Please Select`. We should notice that the value\
    \ attribute contains numerals, such as `\"1\"`, `\"2\"`, until `\"10\"`. And the\
    \ display text associated with each option element is the manufacturer name that\
    \ we see on the Web page. We will take the following scenario to create an automation\
    \ script:\n\n1. Launch the Web application using the URL: [http://practice.bpbonline.com/index.php](http://practice.bpbonline.com/index.php).\n\
    2. Find all the manufacturers from the dropdown table. \n3. For each manufacturer\
    \ found, select it from the dropdown and print the names of all products associated\
    \ with it on the console.\n4. In Step 3, we need to understand that the product\
