    # [CHAPTER 6](#toc.xhtml_c06)


    # [Working with WebElement—Alert, Frame, IFrame, and Window](#toc.xhtml_c06)


    In the previous chapter, we saw handling of the different types of the HTML elements,
    such as the input elements, the Web table, and the dropdown element. In this chapter,
    we will learn about how we can automate the handling of the JavaScript alerts,
    also known as popups, the Frame element, the IFrame element, the HTML window,
    and the action class, which is used to handle advance mouse and keyboard actions.
    To understand the concepts of this chapter, we will have to explore another Web
    application, which is hosted on this link—**[https://the-internet.herokuapp.com/](https://the-internet.herokuapp.com/)**.
    This website is maintained by Elemental Selenium and widely used by the Selenium
    community to try and understand the working of the different types of HTML elements
    using Selenium. Some of our examples will be based on it.


    # [Structure](#toc.xhtml_s51a)


    The chapter is divided into the following sections:


    *   Working with JavaScript alerts


    *   Working with Frame and IFrame HTML element


    *   Working with HTML window


    *   Working with action class


    # [Objectives](#toc.xhtml_s52a)


    After reading this chapter, you will be able to:


    *   Use the **`Alert`** class in Selenium to handle the popups.


    *   Work with the IFrame element, and handle objects which are inside an IFrame.


    *   Automate scenarios when a new window opens in the application.


    # [Working with JavaScript alerts](#toc.xhtml_s53a)


    The JavaScript alerts or popups are found in various Web application scenarios.
    These popups can provide information or request a user action. Until we handle
    the popup, we cannot proceed with any other action on our Web application. There
    are three kinds of JavaScript alerts are as follows:


    *   Alert box


    *   Confirm box


    *   Prompt box


    An alert box is used to provide information to the user, and the user generally
    handles it by closing or clicking on the **`OK`** button.


