- fmt: "\n# [Chapter 2](#c02.xhtml) – Learn about how we set up our system environment\
    \ to write test scripts, and automate browser using Selenium. Learn about the\
    \ different applications and scenarios we will be automating to understand Selenium.\n\
    \n# [Chapter 3](#c03.xhtml) – Learn about the three pillars of Selenium Java client\
    \ library, `WebDriver` which automates the web browser. `WebElement`, which handles\
    \ automation of html elements on page. And the `By` class which help help us create\
    \ locators to locate web element on page.\n\n# [Chapter 4](#c04.xhtml) – Understand\
    \ the importance of synchronization, and how to implement in the test scripts.\n\
    \n# [Chapter 5](#c05.xhtml) – Understand how to handle and automate different\
    \ html elements like form elements, table, drop down\n\n# [Chapter 6](#c06.xhtml)\
    \ - Understand how to handle and automate web elements like frame, alerts and\
    \ window.\n\n# [Chapter 7](#c07.xhtml) – Learn about some advance concepts like\
    \ handling of keyboard and mouse events using `action` class. Capturing screenshot.\
    \ And manage browser drivers using `webdrivermanager` class.\n\n# [Chapter 8](#c08.xhtml)\
    \ - Learn about what is `TestNG`, understand its various features which help in\
    \ test automation projects.\n\n# [Chapter 9](#c09.xhtml) – Learn about the importance\
    \ of object management outside the test scripts. And understand how to implement\
    \ it using the design pattern page object model.\n\n# [Chapter 10](#c10.xhtml)\
    \ – Learn about the importance of managing data outside the test scripts. Also\
    \ learn about implementing reading of data from external data files like `csv`,\
    \ and excel.\n\n# [Chapter 11](#c11.xhtml) – Get introduced to a project life\
    \ cycle management tool `Maven`. Understand its importance in managing project\
    \ which uses open source solutions.\n\n# [Chapter 12](#c12.xhtml) – Learn about\
