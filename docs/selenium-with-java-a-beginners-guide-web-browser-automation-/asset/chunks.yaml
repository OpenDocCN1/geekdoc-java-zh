    \ profile action. Next, we will look at how to work with the HTML Web Tables.\n\
    \n# Working with Web Tables (#toc.xhtml_s47a)\n\nThe Web Tables in the HTML page\
    \ are created using the `<table>` tag. It is a container tag, which means this\
    \ HTML tag contains other HTML elements. The `<table>` tag contains other HTML\
    \ elements which are the table row `<tr>` and each table row contains a table\
    \ data `<td>`. The `<td>` is what we see as a table cell in the HTML page of the\
    \ application. The table cell act like the body element of the HTML page, which\
    \ means it can contain any HTML element within it. Sometimes a table tag can also\
    \ contain a table body represented by `<tbody>` and the table heading tag, which\
    \ is represented as `<th>`. More information on this can be read from this link—`[https://www.w3schools.com/html/html_tables.asp](https://www.w3schools.com/html/html_tables.asp)`\n\
    \nA Web table in HTML page looks like as follows:\n\n```html\n<table id = table1>\n\
    \  <tr>\n    <td>1</td>\n    <td>2</td>\n    <td>3</td>\n  </tr>\n  <tr>\n   \
    \ <td>4</td>\n    <td>5</td>\n    <td>6</td>\n  </tr>\n</table>\n```\n\nThis table\
    \ on the Web page will appear as follows:\n\n![](images/Figure-5.7.jpg)\n\n**Figure\
    \ 5.7:** Output\n\nWe find the Web Tables generally used in HTML pages to represent\
    \ information in a tabular manner, which appears neat and organized. The Web Table\
    \ can contain static information, or at the time of page rendering, it can pick\
    \ up dynamic information. This depends on the Web application. In this chapter,\
    \ we will see how we can iterate a Web table, and fetch information from each\
    \ cell, and print that on the console. This is one of the examples to work with\
    \ Web tables; there could very well be others. The idea is to understand how to\
    \ handle them and then implement this depending on the requirement we have for\
    \ automation.\n\nFor this, we will look at the home page of the application. We\
    \ see the product listed as the following image shows:\n\n![](images/Figure-5.8.jpg)\n\
    \n**Figure 5.8:** The home page of the application\n\nIf we look at this using\
    \ the chrome inspect, we will see the table element which contains this information.\n\
    \n![](images/Figure-5.9.jpg)\n\n**Figure 5.9:** The Chrome inspects\n\nLet us\
    \ look at the information contained in one table cell of this product table:\n\
    \n![](images/Figure-5.10.jpg)\n\n**Figure 5.10:** HTML content of a table cell\n\
    \nAs we see in `[figure 5.10](#c05.xhtml_fig5_10)`, the table cell contains two\
    \ anchor tags and a text that shows the price of the product. One anchor tag displays\
    \ the image of the product, and the other takes us to the product page. In the\
    \ script, which we will write, we will iterate through this table and print the\
    \ contents of the table. The steps which we will do in our script are as follows:\n\
    \n1. Open the Web application using the URL: `[http://practice.bpbonline.com/index.php](http://practice.bpbonline.com/index.php)`.\n\
    \n2. Identify the table element using the HTML tag property as there is only one\
    \ table on the page, and that does not contain any attribute which we can use\
    \ to identify it.\n\n![](images/Figure-5.11.jpg)\n\n**Figure 5.11:** The table\
    \ element\n\n3. Once we have the table element, we will find out how many tables\
    \ row it contains by using the `findElements` method and look for the `<tr>` tag,\
    \ and then, we will take each row and find out how many table data tags it contains,\
    \ using the `findElements` method.\n\n4. Once we have the table element, we will\
    \ find out how many tables row it contains by using the `findElements` method\
    \ and look for the `<tr>` tag, and then, we will take each row and find out how\
    \ many table data tags it contains, using the `findElements` method.\n\n5. Once\
    \ we have the table element, we will find out how many tables row it contains\
    \ by using the `findElements` method and look for the `<tr>` tag, and then, we\
    \ will take each row and find out how many table data tags it contains, using\
    \ the `findElements` method.\n\n6. At the backend this is the information associated\
    \ with it.\n\nLet us look at the following script:\n\n```\n![](images/p80.jpg)(images/p81.jpg)\n\
    ```\n\nThe output of the preceding program, which is as follows:\n\n![](images/Figure-5.12.jpg)\n\
    \n**Figure 5.12:** Output\n\nSo, here we have seen how we handle the table cell.\
    \ In the last section of this chapter, we will talk about the dropdown element.\n\
    \n# Working with dropdown (#toc.xhtml_s4a)\n\nThe dropdown element is represented\
    \ using the `<select>` tag. It is also a container tag and it contains `<option>`\
    \ as the child tag. An example of the dropdown is shown as follows:\n\n![](images/Figure-5.13.jpg)\n\
    \n**Figure 5.13:** Dropdown example\n\nWhen the preceding HTML renders on the\
    \ Web page, it is displayed as follows:\n\n![](images/Figure-5.14.jpg)\n\n**Figure\
    \ 5.14:** Dropdown HTML\n\nTo know more about the dropdown element, refer to the\
    \ link—`[https://www.w3schools.com/tags/tag_select.asp](https://www.w3schools.com/tags/tag_select.asp)`\n\
    \nThe dropdown element in Selenium is not handled using the `WebElement` interface.\
    \ Rather the dropdown element has its own separate class known as the `Select`\
    \ class. Its details are available here: `[https://www.selenium.dev/selenium/docs/api/java/org/selenium/support/ui/Select.html](https://www.selenium.dev/selenium/docs/api/java/org/selenium/support/ui/Select.html)`\n\
    \nThe reason for a separate class is that there are some specific actions associated\
    \ with the dropdown element, which are not available with the other Web elements.\
    \ To understand these actions, we need to first understand the dropdown element\
    \ HTML. Let us look at the preceding HTML again:\n\n![](images/Figure-5.15.jpg)\n\
    \n**Figure 5.15:** HTML content of dropdown\n\nAs we see in this HTML code, the\
    \ `select` tag is a parent tag inside which the child tag of `option` is available.\
    \ The `option` tag contains a field called as `value`, and a text is associated\
    \ with it. This is the text which we see on the Web page. For example, `<option\
    \ value=\"japan\">JAP</option>` code displays JAP on the Web page. But at the\
    \ backend, this is the information associated with it. Keeping this in mind, we\
    \ will not look at the different methods available to us with `Select` class and\
    \ look at some of them at the code level.\n\n| Method | Description |\n| --- |\
    \ --- |\n| `selectByValue()` | This will select the element from the dropdown\
    \ based on the value attribute of the option tag. |\n| `selectByVisibleText()`\
    \ | This will allow us to select an element based on the visible text associated\
    \ with the option tag. |\n"
