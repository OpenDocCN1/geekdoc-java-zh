    当执行 TestNG suite 文件 `.xml` 时，它生成三种类型的结果文件。这些文件携带相同的信息，但表示方式不同。结果存储在 `test-output`
    文件夹中，是在执行后生成的。下面的图片显示了执行 suite 文件后显示的目录结构。


    ![](img/Figure-8.11.jpg)


    当 TestNG suite 执行时生成的文件，其描述如下：


    | 结果文件名称 | 描述 |

    | :--- | :--- |

