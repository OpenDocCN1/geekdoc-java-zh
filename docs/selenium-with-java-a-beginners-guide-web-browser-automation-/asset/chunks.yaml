  raw: 'To execute the test on the Chrome browser and the Firefox browser, in parallel,
    we will be making changes in the **`testng.xml`** file. The **`testng.xml`** file
    used will be as follows:


    ![](images/p201.jpg)


    As we run the suite file, we will see both Chrome and Firefox browsers being launched
    and the test execution on them:


    ![](images/Figure-12.10.jpg)


    **Figure 12.10:** Execution on Chrome and Firefox


    Selenium Grid also provides the complete set-up on Docker. So we can directly
    use the Docker environment to set up the grid, which consists of node and hub.
    And then use it to run our tests. To learn more about it, visit the URL—**[https://github.com/SeleniumHQ/docker-selenium](https://github.com/SeleniumHQ/docker-selenium)**.


    We can also use the various cloud solutions available such as Sauce Labs, BrowserStack,
    and LamdaTest, which all uses Selenium Grid files to set up a lab on the cloud,
    and thus, save us the hassle of maintaining a local test automation lab.


    # [Conclusion](#toc.xhtml_s107a)


    In this chapter, we learned about the Selenium Grid component of Selenium. We
    understood what is a hub and a node. We saw the creation of the hub and the nodes
    for Chrome and Firefox browsers. The hubs and nodes were running locally on the
    same machine, on which we executed individually and then, in parallel, the login
    logout scenario.


    # [Questions](#toc.xhtml_s108a)


    1.  What is Selenium Grid used for?


    2.  Can you set up Selenium Grid using Docker?


    3.  On which port by default does the hub listens to?


