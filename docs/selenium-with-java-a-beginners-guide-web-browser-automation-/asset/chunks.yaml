    # [CHAPTER 10](#toc.xhtml_c10)


    # [Data Driving Test](#toc.xhtml_c10)


    Any Web application testing requires test data preparation. Test data forms an
    integral part of the test case. As we automate our test scripts, we will find
    we are using data in the scripts. As the application changes or the test process
    may undergo changes, it is very likely that the data used in test scripts also
    undergo changes. So, it is imperative that we manage data used in scripts external
    to our test logic. Also, we may have environment configuration data such as application
    URL, some file paths for reports, logs, and so on, which should also be managed.
    In this chapter, we will see how we can manage data for our test and use it judiciously
    in our scripts.


    # [Structure](#toc.xhtml_s84a)


    The chapter is divided into the following sections:


    *   Importance of data management

    *   Managing data in CSV file, Excel file, and using them in test


    # [Objectives](#toc.xhtml_s85a)


    The objective of this chapter is to understand the importance of data as an artifact
    when we are designing our tests. In this chapter, we will also see how we can
    read data from a CSV file or an Excel file. We will understand the need to manage
    data separately from the test scripts, which contain the business logic. We will
    be covering reading from two types of data files—the CSV and the Excel. For Excel,
