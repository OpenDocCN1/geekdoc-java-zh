  trans: "\n* 页面没有及时加载，我们没有足够的时间来执行操作。在人工参与模式（attended mode）下，由人类执行操作，可以使用认知能力判断这些情况并采取适当行动。\n\
    * 页面加载了，但文本字段不存在。\n* 页面没有加载，并且出现了可能由客户端问题或服务器问题引起的错误。\n* 由于网络连接中断，页面未加载。\n\n当人类测试人员在现场执行上述步骤时，如果遇到不顺意的情况，能够采取适当行动，并判断遇到的情况是应该记录为缺陷（defect），还是应该继续等待页面加载，或者因为网络问题导致网站无法运行而向\
    \ Web 管理员报告问题。但当脚本取代人类测试人员时，我们必须在其中构建某些认知能力，使其能够在上述情况下采取恰当行动，正如我们预期具备认知能力的人所做的那样。此外，这里采用或强制执行的方法之一是，首要任务可能是处理好这两个独立进程之间的同步。\n\
    \n当我们使用工具驱动浏览器并在 Web 应用上执行操作时，会有两个独立的过程发生。这里使用的工具 `Selenium` 将执行命令驱动 Web 浏览器并在\
    \ Web 应用上执行操作，而 Web 应用将根据其处理速度执行这些操作。如果我们不对这两个进程进行同步，我们的脚本将会失败，导致无法有效且可靠地执行脚本来测试应用程序。原因在于，从脚本来说，`Selenium`\
    \ 会尝试识别 Web 页面上的元素，但由于上述不顺意情况中列出的各种原因，对象或页面本身可能尚未加载，导致与我们编写的测试脚本产生不一致的行为。\n\n\
    在接下来的章节中，我们将学习如何在脚本中实现同步，以确保两个独立进程能够感知彼此的存在。\n\n# 同步类型\n\n到目前为止，我们学习了同步的重要性。在本节中，我们将学习如何在测试脚本中实现同步以及其实现方法。方法如下所示：\n\
    \n* 隐式等待 (Implicit wait)\n* 显式等待 (Explicit wait)\n\n隐式等待被称为全局等待。它通常在 `WebDriver`\
    \ 对象初始化后立即实现。一旦实现，这种等待适用于脚本中的每条语句。\n\n显式等待被称为局部等待。它被用于脚本中可能需要更多等待时间的地方。通常，当我们使用显式等待时，会将隐式等待设置为\
    \ 0，否则它们可能会相互干扰。当我们使用显式等待时，我们需要设置一个等待完成的条件，否则等待将在指定的秒数后超时。为了为显式等待创建条件，`Selenium`\
    \ 中有一个名为 `ExpectedConditions` 的类。该类拥有大量已实现的方法，我们可以这些方法来构建条件。我们将在显式等待章节中了解更多信息。\n\
    \n在下一节中，我们将看到具体的实现。\n\n# 场景\n\n为了实际实现隐式等待和显式等待，我们将选取一个使用有效用户信息从应用程序登录的场景。让我们先理解其后续步骤。\n\
    \n### 登录\n\n1. 使用 URL 打开应用程序——`http://practice.bpbonline.com/` \n2. 点击 `My Account`\
    \ 链接。\n3. 提供用户名—`admin@admin.com` 和密码—`admin@123`。\n4. 点击 `Sign in` 按钮。\n5. 点击\
    \ `Log off` 链接\n6. 点击 `Continue` 按钮\n\n根据上述步骤，我们在浏览器上启动应用程序并点击 `My Account` 链接（如图所示）。\n\
    \n![](img/Figure-4.3.jpg)\n\n**图 4.3：** 应用程序首页\n\n然后我们提供有效的用户名和密码信息，并如图所示点击 `Sign\
    \ In` 按钮。\n\n![](img/Figure-4.4.jpg)\n\n如果信息正确，我们将看到如图所示的 `My Account Information`\
    \ 页面：\n\n![](img/Figure-4.5.jpg)\n\n**图 4.5：** 登录后的页面\n\n在这里，我们随后点击 `Log Off`\
    \ 和 `continue` 按钮返回首页：\n\n![](img/Figure-4.6.jpg)\n\n**图 4.6：** 应用程序的注销页面\n\n\
    在上述场景中，我们需要注意在对不同元素执行操作时应用程序页面的变化。例如，如果我们点击 `My Account` 链接，将进入一个需要填写用户名和密码信息的页面。当我们点击登录按钮时，将进入\
    \ `My Account Information` 页面，在那里我们可以看到注销链接。我们点击注销链接并看到 `continue` 按钮，点击它后，我们就返回了首页。\n\
    \n在每一步操作中，我们的脚本都必须变得“智能”，以等待元素的出现。如果元素在给定的时间内没有出现，则抛出 `Time Out` 异常并结束执行。我们将看到的第一种等待是隐式等待，它被引入脚本并作用于脚本中的每条语句。它也被称为全局等待。之后，我们将看到显式等待，它被称为局部等待，并引入脚本中比设置全局时间需要更多等待的地方。正如之前提到的，我们不一起使用这些等待，因为它们可能会相互干扰。因此，当我们使用显式等待时，我们将隐式等待时间设置为\
    \ 0。\n\n# 实现隐式等待\n\n为了实现隐式等待，我们使用以下命令：\n\n```bash\n//add implicit wait\n```\n\n\
    ```java\ndriver.manage().timeouts().implicitlyWait(10, TimeUnit.SECONDS);\n```\n\
    \n在这里，`driver` 是 `ChromeDriver` 的实例，并使用了它的方法 `manage`。`manage` 方法拥有 `timeouts`，我们在其中选择了\
    \ `ImplicitWait`选项。我们传递给此方法的参数是我们想要使用的时间单位以及该单位的数量。因此在这里，我们选择隐式等待 10 秒。使用的命令将适用于脚本中写的每条语句。它将等待元素出现最多\
    \ 10 秒；如果在 10 秒内元素出现，它将执行操作并移动到脚本中的下一条语句。如果由于某些原因元素不可用且过了 10 秒，这种情况将导致 `TimeOut`\
    \ 异常。\n\n让我们看看以下使用隐式等待的登录脚本：\n\n![](img/p65.jpg)![](img/p66.jpg)\n\n# 实现显式等待\n\
    \n为了实现显式等待，我们将使用 Selenium 的 `WebDriverWait` 接口和 `ExpectedConditions` 接口。在继续之前之前，让我们先谈谈这两个实体。\n"
- fmt: "\nThe `WebDriverWait` interface provides us with a method `until()`. This\
    \ method takes an argument of type `ExpectedConditions`. Expected conditions are\
    \ a class of Selenium WebDriver, which provides us with a large number of methods\
    \ to detect an event happening. For example, `elementToBePresent`, `elementToBeClickable`,\
    \ `alertWindowPresent`, and so on and so forth.\n\n**Tip: More such information\
    \ for ExpectedConditions methods are available in [https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/support/ui/ExpectedConditions.html](https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/support/ui/ExpectedConditions.html).**\n\
    \nThe `WebDriverWait` interface takes an instance of the driver, a timeout, and\
    \ an object of `ExpectedConditions`, as it gets implemented. Let us take a scenario\
    \ where we want to implement a local wait or the explicit wait. We will take the\
    \ login scenario and put a `WebDriverWait` for the appearance of `Log Off` link\
    \ as shown in the following script. Only if the `Log Off` link appears, we will\
    \ go ahead and proceed with logout.\n\n![](images/p67.jpg)\n\nIn the preceding\
    \ code, we should also notice that before using `WebDriverWait`, we set the implicit\
    \ wait to 0, and after explicit wait usage is over, we set it back to 10 seconds.\
    \ We need to note here is that we do not use both implicit and explicit wait at\
    \ the same time in the code. If we are implementing explicit wait, we make the\
    \ implicit wait to 0. The reason for this is that these waits can interfere with\
    \ each other and can cause run time execution issues in our code.\n\n# Encountering\
    \ exceptions\n\nAs we use the wait commands of two kinds with Selenium, we can\
    \ encounter the following exceptions:\n\n`No Such Element Found`, and the `TimeOutException`.\
    \ The `NoSuchElementFound` exception is seen when the script waits for an element\
    \ to appear on the page with the given locator technique but is unable to find\
    \ it within the given time duration. The `TimeOutException` is generated when\
    \ the script is unable to find the element, with the given locator, it causes\
    \ `NoSuchElementFound` exception, which further calls the `TimeOutException`,\
    \ as we are unable to find the element in the given duration. So, the expected\
    \ conditions method `presenceOfElementLocatedBy` (as shown in the following code)\
    \ throws the `NoSuchElementFound` exception, which further causes the timeout\
    \ exception to come.\n\nTo see this, we can deliberately try and find a link using\
    \ the link text JUNK. Since junk does not exist, after 10 seconds of waiting using\
    \ `WebDriverWait`, we will see the `TimeOutException`, which internally is generated\
    \ because this element does not exist.\n\n![](images/p68.jpg)\n\nException raised\
    \ as shown in the following script:\n\n```\nException in thread \"main\" org.openqa.selenium.TimeoutException:\
    \ Expected condition failed: waiting for presence of element located by: By.linkText:\
    \ Junk (tried for 10 second(s) with 500 milliseconds interval)\nat org.openqa.selenium.support.ui.WebDriverWait.timeoutException(WebDriverWait.java:95)\n\
    at org.openqa.selenium.support.ui.FluentWait.until(FluentWait.java:272)\nat codefiles.demoOfExplicitWait.main(demoOfExplicitWait.java:33)\n\
    Caused by: org.openqa.selenium.NoSuchElementException: no such element: Unable\
    \ to locate element: {\"method\": \"link text\", \"selector\": \"Junk\"}\n(Session\
    \ info: chrome=90.0.4430.212)\n```\n\n# Conclusion\n\nHence, we have learned in\
    \ this chapter about the need for waits in our automation scripts, the types of\
    \ waits in Selenium, and how we can implement it.\n\nIn the upcoming chapter,\
    \ we will discuss about working with different types of HTML elements like form\
    \ elements, Web tables, and dropdown elements.\n\n# Questions\n\n1. Why do we\
    \ need synchronization in our automation scripts?\n2. Explain the meaning of implicit\
    \ wait and how is it implemented?\n3. What is ExpectedConditions class in Selenium?\n\
    4. Which exception comes when WebDriverWait fails?\n\n# CHAPTER 5: Working with\
    \ WebElements—Form, Table, and Dropdown\n\nIn the earlier chapters, we discussed\
    \ about the Selenium libraries, the methods available with them to handle browser,\
    \ Web element, and create locators. We also discussed about how we can use the\
    \ concept of waits to ensure reliability with our scripts, at the same time, taking\
    \ care of the speed of the execution. In this chapter, we will discuss about working\
    \ with different HTML elements, the type of action action we perform on them during\
    \ automation, and how Selenium allows us to work on them. We will discuss the\
    \ form HTML elements, the Web table element, and the dropdown in Part 1.\n\n##\
    \ Structure\n\nThe chapter is divided into the following sections:\n\n* Working\
    \ with form elements such as textbox, radio button, checkbox, and so on\n* Working\
    \ with the Web Table element\n* Working with the Dropdown element\n\n## Objectives\n\
    \nAfter studying this chapter, you will be able to perform the following:\n\n\
    * Automate the handling of the form HTML elements\n* Understand and work with\
    \ the Web table elements\n* Understand and work with the dropdown elements\n\n\
    # Working with form elements\n\nForm is an HTML tag, which contains different\
    \ types of HTML elements. The form element is used in HTML websites to capture\
    \ user input. The information is generally sent to the server for further work.\
    \ The form element in HTML is represented as `<form>`, and it acts as a container\
    \ for different elements such as text boxes, radio buttons, submit buttons, checkboxes,\
    \ and so on. All these different elements are represented with the HTML tag `<input>`.\
    \ The different types of input elements are available as follows:\n\n| Type |\
    \ HTML information | Description |\n| :--- | :--- | :--- |\n| Text | `<input type=\"\
    text\">` | Displays a text input field. |\n| Radio | `<input type=\"radio\">`\
    \ | Displays a radio button. |\n| Checkbox | `<input type=\"checkbox\">` | Displays\
    \ a checkbox. |\n| Submit | `<input type=\"submit\">` | Displays a submit button.\
    \ |\n| Button | `<input type=\"button\">` | Displays a button. |\n\n**Table 5.1:**\
    \ Different types of input elements\n\nIn our practice application, the scenario\
    \ of change profile is where we will see most of the input elements from 5.1.\
    \ Let us explore that section. For the change profile scenario, we will have to\
    \ perform the following steps:\n\n1. Open the application using URL: [http://practice.bpbonline.com/index.php](http://practice.bpbonline.com/index.php).\n\
    2. Click on the `My Account` link as shown in figure 5.1:\n   ![](images/Figure-5.1.jpg)\n\
    \   **Figure 5.1:** My Account link\n3. On the `Sign In` page, provide the login\
    \ details: username is `bpb@bpb.com` and password is `bpb@123`. Click on the `Sign\
    \ In` button as shown in figure 5.2:\n   ![](images/Figure-5.2.jpg)\n   **Figure\
    \ 5.2:** Sign In page\n   In the preceding figure, we see the following input\
    \ elements: text and password.\n4. After signing in, you reach the `Account Information`\
    \ page. Here, we need to click on the link which says, `View or change my account\
    \ information`.\n   ![](images/Figure-5.3.jpg)\n   **Figure 5.3:** My Account\
    \ Information page\n5. This will take us to the `Change Profile` page. On this\
    \ page, we see the input element text and radio.\n   ![](images/Figure-5.4.jpg)\n\
    \   **Figure 5.4:** Change Profile page\n"
