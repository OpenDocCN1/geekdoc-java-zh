    \ working with the Excel file is depended on the programming language, which we\
    \ have used to implement Selenium. Selenium, by default, does not come with any\
    \ support to manage data in an Excel file. The Apache POI has two classes to manage\
    \ different forms of Excel files. For Excel files with extension **`.xls`**, we\
    \ have the HSSF class files. For working with the **`.xlsx`** Excel files, we\
    \ have the XSSF package we can use. To know more about these packages, we can\
    \ visit—**[https://poi.apache.org/components/spreadsheet/](https://poi.apache.org/components/spreadsheet/)**.\n\
    \n# [Reading data from Excel file](#toc.xhtml_s88a)\n\nTo read data from the Excel\
    \ file, we have created a function in the **`DataReader.java`** file. Let us understand\
    \ the working of the function. The function definition is as follows:\n\n`String[][]\
    \ getExcelDataUsingPoi(String filename, String sheetname)`\n\nThe function takes\
    \ as input a filename and the **`sheetname`**. The **`sheetname`** has to match\
    \ the name in the Excel workbook, which data we want to read. The **`filename`**\
    \ is the file path where the file is saved. The return value of the function is\
    \ a two-dimensional array of **`String`** data types. So effectively, we read\
    \ the rows and columns information from the Excel file and return it as the two-dimensional\
    \ arrays. In the function, we first define a workbook object which we initialize\
