    \n# 第 1 章\n\n# Selenium 简介\n\nSelenium 自动化浏览器；仅此而已。你如何使用它完全取决于你。一旦打开 Selenium\
    \ 的主页就能看到这些信息 `[`www.selenium.dev`](http://www.selenium.dev)`。目前，Selenium 项目由三个主要组件组成：Selenium\
    \ IDE、Selenium WebDriver 和 Selenium Grid。在书中，我们将使用 Java 语言学习 Selenium WebDriver\
    \ 和 Selenium Grid。\n\n# 结构\n\n在本章中，我们将讨论以下主题：\n\n*   什么是 Selenium\n*   Selenium\
    \ 主要组件\n    *   Selenium IDE\n    *   Selenium WebDriver\n    *   Selenium Grid\n\
    *   为什么 Selenium 流行\n*   Selenium 项目背后\n\n# 目标\n\n学习本单元后，你将能够：\n\n*   理解 Selenium\
    \ 的流行性。\n*   对作为浏览器自动化工具的 Selenium 有初步了解。\n*   了解 Selenium 的组件及其用途。\n\n# 什么是 Selenium?\n\
    \nSelenium 诞生于 2004 年（其构想）。它当时被称为 JavaScriptTestRunner，由 Jason Huggins 在 ThoughtWorks\
    \ 工作期间创建。该工具的创建是为了克服市面上现有解决方案所面临的挑战，从那时起，大量的人和机构对这个开源项目做出了贡献，使其成为今天。Simon Stewart\
    \ 在 GTAC 大会上展示了与浏览器通信的 WebDriver 版本，被认为比 Selenium 采用的 JavaScript 代理服务器版本更精炼，最终导致这两个概念结合。Selenium\
    \ 与 WebDriver 结合变成了 Selenium WebDriver，这也是我们目前正在使用的。本书编写时最新的稳定版本是 3.141.59。\n\n"
- fmt: 'This kind of rich feature set was rare and is still rare in many of the available
    commercial, free and open-source test automation solutions for Web applications.
    Another reason was the flexibility which the open-source tool provides. They inherently
    come up with the power of adjusting as per the requirements of your project instead
    of making you adjust within the tight boundaries of the tool. Also, the cost associated
    with procuring `Selenium` was nil. The tool was free to avail. One most important
    factor for `Selenium` to become widely popular was the strong user community behind
    it, which is still very active and can be found at—`https://groups.google.com/forum/#!forum/selenium-users`


    # Components of Selenium


    Selenium currently has three major components which are meant to solve three important
    criteria as follows:


    * Selenium IDE

    * Selenium WebDriver

    * Selenium Grid


    The following table explains the use of every component:


    | Component | Use |

    | :--- | :--- |

    | Selenium IDE | It is basically used for recording and playback. The current
    version of `selenium ide` can be used with both Firefox and Chrome browsers. The
    current version of `Selenium IDE` is backed by the organization `Applitools`,
    and the most important contributor for its development and well keep is `Dave
    Haeffner`. More about him and `Applitools` here—[https://applitools.com/blog/team-dave-haeffner/](https://applitools.com/blog/team-dave-haeffner/)
    |

    | Selenium WebDriver | This component talks to the browser as a real-time user/person
    will do whether the browser is in the local system or the remote system. To use
    this component, we will have to use the client libraries, available in different
    programming languages such as `Java`, `Ruby`, `Perl`, `Python`, `C#`, and so on.
    Our program script is written using these languages, which have commands we would
    want the browser to do. The associated `WebDriver` for the browser automates the
    browser, and we get our results. The current stable version is `3.141.59` as of
    writing this book. |

    | Selenium Grid | This component allows the tests to be executed in parallel.
    It uses the `selenium remote control` component of `Selenium`, and we then set
    it up in two different modes, the `hub mode` and the `node mode`. This allows
    us to run the different tests in parallel in different nodes at the same time.
    |


    **Table 1.1:** Use of Selenium components


    # People behind Selenium


    There are a lot of people behind Selenium; rather, it is a fine example of a tool
    that has been driven and maintained by a community rather than made popular by
    them. What started as a work project in 2004 in the organization `ThoughtWorks`
    by `Jason Huggins` was made open source to the world. A good history about its
    usage, adaptation, and different avatars it took is available here [https://www.selenium.dev/history/](https://www.selenium.dev/history/).


    `Selenium IDE` was first created by `Shinya Kasatani` in Japan, this was later
    picked up by `Mike Williams` from `ThoughtWorks`, and now this project is supported
    by the organization `Applitools`, `Dave Haeffner`, and the team takes care of
    it.


    Google started using `Selenium grid` internally and revealed this at the `GTAC`
    conference; this was done by `Jennifer Bevan`, who eventually became one of the
    contributors to the `Selenium` project. `Haw-Bin Chai` is the person behind the
    concept of `locators UI-Elements` used in `Selenium`. And we all now know about
    `Simon Stewart`, the one who came up with `WebDriver`, and is now the current
    founding father of `Selenium` as we know it.


    # Conclusion


    In this chapter, we have been introduced to `Selenium` as a tool to automate the
    Web browser. We saw the different components associated with it and the different
    people associated with its development. We also understood the reason behind its
    immense popularity. In the upcoming chapter, we will be discussing the `Selenium
    API` in `Java`.


    # Questions


    1. Is Selenium one tool or multiple tools combined under one name?

    2. What is the current stable version of Selenium available?

    3. What was Selenium known as when `Jason Huggins` created it while working in
    `ThoughtWorks`?

    4. `Selenium IDE` works both on Chrome and Firefox. True or False?

    5. Why is Selenium popular?


    # CHAPTER 2


    ## Preparing System and Application Under Test


    In this chapter, we will set up the IDE `eclipse` on our systems. We will be taking
    only the `Windows` system. After setting the `eclipse` as the script integrated
    development environment, we will set the `Selenium jar` files in the project so
    that when we write programs using `Java` as language, our environment is able
    to decipher them. Before we run the tests in the browsers, we also need to set
    the drivers for the respective browser, so in this chapter, we will learn that.
    In the upcoming chapters, we will also see how we can create a `Maven` project
    and use it to have the dependencies managed at run time. But for the time being,
    we will be taking the preceding mentioned approach.


    In this chapter, we will also see the application we would be using to explore
    `Selenium`. We will look at some of the scenarios provided. Besides this, we will
    also explore a few other Web applications, which scenarios we we will be using
    to understand the concepts of `Selenium`.


    # Structure


    In this chapter, we will discuss the following topics:


    * Setting right `eclipse` version on system

    * Creating `Java` project

    * Setting `Selenium jars`

    * Setting browser drivers

    * Walkthrough of the `BPB` application

    * Knowing other applications for practice


    # Objectives


    After studying this unit, you should be able to:


    * Set up `eclipse`

    * Create `Java` project

    * How to add `Selenium jars`

    * How to set browsers drivers

    * Walkthrough of `BPB` application

    * Understanding other applications


    # Setting eclipse


    Before we download and set up `eclipse` on the system, we need to ensure we have
    `Java` installed. The version of `Java` we require is `Java 8`. To install it,
    we will need to visit the link—`https://www.oracle.com/java/technologies/javase8-downloads.html`.
    According to the OS we have, we will download the respective file—`https://www.oracle.com/java/technologies/javase8-downloads.html`.


    Once downloaded, we will install and set up the `Java JDK` on our system.


    Eclipse is a famous IDE (integrated development environment), which is used to
    create projects using various languages. It supports Java, Python, Ruby. It is
    an open-source IDE for professional developers, backed by a strong community.
    More details about it can be found here—`https://www.eclipse.org/eclipseide/`.


    We will be downloading the `Eclipse Photon` version to set up `Selenium 3.141.59`
    jars. For this, please visit this URL—`https://www.eclipse.org/downloads/packages/release/photon/r`.


    Download the `Eclipse IDE` for `Java Developers`, depending upon the OS version
    you are using.


    ```

    (images/Figure-2.1.jpg)

    ```

    **Figure 2.1:** Eclipse version


    For example, if you are using `Windows 64 bit`, download that option. Once the
    **`.exe`** file is available, install `eclipse` on your system.


    After `eclipse` is installed on your system, you should be able to see an icon
    of it on the desktop, double click on it to launch `eclipse`. It opens up a pop-up
    to ask you a place for `Workspace`—a place where you will be storing the eclipse
    projects.


    ```

    (images/Figure-2.2.jpg)

    ```

