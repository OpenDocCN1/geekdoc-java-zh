    # The WebElement interface


    A Web element is an HTML element, which is used to create and help function a
    Web page. These are also known as HTML elements. An HTML element is created using
    HTML tags, which are predefined. They can be a link, a table, a form, a button,
    a text box, an image, and so on. Depending on the version of the HTML we are using,
    a list of new elements become available to us, which are now as well supported
    by the Web browsers. The latest version provided by the W3C—[https://www.w3.org/TR/html52/](https://www.w3.org/TR/html52/),
    HTML 5.2 version.


    **Note The list of Web elements in detail can be found here—[https://www.w3.org/TR/html52/semantics.html#semantics](https://www.w3.org/TR/html52/semantics.html#semantics)**


    # Generic structure of WebElement


    A HTML element is generally represented as follows:


    `<HTML TAG PROP=VAL PROP=VAL ..` > TEXT </HTML TAG>`


    So at first, the HTML tag starts, it is then followed by a group of property-value
    pairs, and then the HTML tag closes. The HTML tags are already predefined in the
    W3C page, as discussed earlier. With the help of these Web elements, the Web pages
    are designed, and they function to achieve a business objective. The properties
    used to declare a Web element helps display them on the page and are later used
    by the automation tools to identify them uniquely on the Web page.


    # Methods of Web Elements


    Each Web element has different functions associated with them. Some are used for
    presentation purposes; some are used to group together information. Elements like
    links, images are used for hyper referencing other pages or images. Others like
    span and div help create overlays. Selenium library for Web elements interface
    defines different methods, which we can use on the Web elements to help us achieve
    our business scenarios in action.


    **Note: Details on the methods of the Web elements are provided in the link: [https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/WebElement.html](https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/WebElement.html)**


    In the following table, we are going to see the names of the various methods declared,
    along with the purpose they solve when we use them in the scripts.


    For the approach to use them and their return values, please refer to the link
    shared in the preceding note.


    Let us see them in the following table:


    | Method | Purpose |

    | :--- | :--- |

    | `sendKeys()` | Types context on a given object, for example, types text on a
    textbox. |

    | `click()` | Performs click operation on a clickable entity, example, a link,
    button. |

    | `getText()` | Fetches the text associated with a html object. |

    | `isDisplayed()` | This is used to understand if the element is available on
    the page or not. |

    | `isEnabled()` | This function is used to check if the element is functional
    or not. |

    | `isSelected()` | This is used for radio and check buttons to find their selection
    status. |

    | `clear()` | This is used for text fields to clear their contents. |

    | `getAttribute()` | This function is used to provide us with the run time value
    associated with the. |

    | `getTagName()` | It provides the tag name for html object. |

    | `submit()` | It performs the form submission. |

    | `getRect()` | It returns the location of the element. |

    | `getSize()` | This provides us the size of the element. |

    | `getCssValue()` | This returns the CSS value associated with the element. |

    | `findElement()` | This returns the Web element. |

    | `findElements()` | This provides a list of all Web elements. |

