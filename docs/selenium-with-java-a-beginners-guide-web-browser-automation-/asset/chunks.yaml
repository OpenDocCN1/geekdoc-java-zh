  trans: "\n要处理窗口，我们需要理解每个窗口都关联有一个唯一的窗口句柄（window handle）。该窗口句柄用于识别窗口并将驱动对象与之关联。为了处理所有使用同一个驱动实例打开的窗口，我们可以将它们存储在一个名为\
    \ set（集合）的集合中。set 是 Java 中的一种集合，它允许存储唯一的数据值。然后我们使用一个 `Iterator` 来遍历集合中的所有值。让我们来看一个允许我们打开新窗口的应用程序。\n\
    \n我们将自动化的场景如下：\n\n1. 使用 URL：`[`the-internet.herokuapp.com/windows`](https://the-internet.herokuapp.com/windows)`\
    \ 打开应用程序。\n2. 之后，我们点击如下图所示的链接：\n   ![](img/Figure-6.16.jpg)\n   **图 6.16：** 需要点击的链接\n\
    3. 当我们点击 `Click Here` 时，它将打开一个带有新页面的新标签页，所示：\n   ![](img/Figure-6.17.jpg)\n  \
    \ **图 6.17：** 新的新窗口\n4. 我们将验证新页面是否包含文本 `New Window`。\n5. 我们现在将关闭该窗口并返回主父窗口并将其关闭。\n\
    \n上述步骤的代码如下：\n\n![](img/p104.jpg)\n\n我们可以在代码中看到，一旦我们在 set 中获取了所有窗口句柄，我们就会使用 for\
    \ each 循环在控制台上打印窗口句柄。之后，我们将 set 转换为对象数组（Object Array）。在这里，我们需要意识到数组中的第一个元素将是父窗口的句柄。数组中的下一个元素将是启动的下一个窗口，依此类推。由于对于我们的场景只有两个窗口，在索引\
    \ 0 处我们有父窗口的句柄，在索引 1 处我们有子窗口的句柄。\n\n我们随后使用 `driver.switchTo().window` 命令通过传递数组的第二个索引来切换到子窗口。然后我们找到它是否包含所需的文本并将其关闭。接着我们使用数组的第一个元素切换回父窗口并也将其关闭。\n\
    \n因此，在前面的代码中，我们已经了如何在 Selenium 中处理窗口。\n\n## 结论\n\n在本章中，我们学习了如何处理作为容器元素的 HTML 元素。容器级\
    \ HTML 元素是那些包含其他 HTML 元素的元素。我们看到了如何处理 Web 表格、下拉元素。我们还看到了与 webdriver 相关的 `switchTo`\
    \ 方法的使用，它允许我们将焦点切换到新的警报、IFrame 或新窗口。总的来说，通过第 8 章和第 9 章学到的知识，我们应该能够处理在 Web 应用程序中看到的各种\
    \ HTML 元素。在接下来的章节中，我们将学习 `Action` 类、截图捕获、WebDriver manager 等概念。\n\n## 第 7 章\n\n\
    ## 额外概念——动作、截图、WebDriverManager\n\n### 简介\n\n在本章中，我们将讨论 Selenium 中提供的几个额外概念。我们将谈论\
    \ `Action` 类，它允许我们处理高级的鼠标和键盘操作。我们将看到如何在执行期间捕获屏幕。我们还将讨论 Selenium 最近引入的一个第三方包，命名为\
    \ `WebDriverManager`，它在与 Selenium 工作时非常有用，可以在运行时为选定的执行浏览器自动获取正确的浏览器驱动程序。\n\n###\
    \ 结构\n\n在本章中，我们将讨论以下主题：\n* Actions（动作）\n* Screenshot（截图）\n* WebDriverManager\n\
    \n### 目标\n\n本章的目标是在使用 Selenium 尝试自动化 Web 应用程序时，介绍一些额外概念。在本章之后，你将能够：\n* 使用 `Action`\
    \ 类自动化高级的键盘和鼠标操作。\n* 能够在执行时捕获截图以获得更好的报告。\n* 最后，使用 WebDriver manager 的概念来处理自动化脚本的驱动浏览器交互。\n\
    \n### Actions（动作）\n\n在处理 Web 应用程序时，我们可能会遇到需要使用键盘和鼠标执行某些高级用户手势的场景。例如拖放、鼠标悬停、按键释放和按键按下等。为了执行这些操作，我们应该使用\
    \ Selenium 提供的 action 接口。该接口位于 interactions 包中——org.openqa.selenium.interactions。它还帮助我们创建一个复合动作（composite\
    \ action），该复合动作可以是两个或多个一起执行的动作的组合。`Action` 类提供了多种方法；可以在此链接中找到更多细节——`[`www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/interactions/Actions.html`](https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/interactions/Actions.html)`。\n\
    \n在处理 Web 应用程序时，我们可能会遇到需要使用键盘和鼠标执行某些高级用户手势的场景。例如拖放、鼠标悬停、按键释放和按键按下等。为了执行这些操作，我们应该使用\
    \ Selenium 提供的 action 接口。该接口位于 interactions 包中——org.openqa.selenium.interactions。它还帮助我们创建一个复合动作，该复合动作可以是两个或多个一起执行的动作的组合。`Action`\
    \ 类提供了多种方法；可以在此链接中找到更多细节——`[`www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/interactions/Actions.html`](https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/interactions/Actions.html)`。\n\
    \n## action 类的方法\n\naction 类的各种方法如下：\n\n| 方法名称 | 描述 |\n| :--- | :--- |\n| `click()`\
    \ | 在当前位置执行点击。通常用于我们创建复合动作。它有一个 `click(WebElement ele)` 变体，点击指定的元素。 |\n| `clickAndHold()`\
    \ | 在当前鼠标位置执行点击并保持。它有一个 `clickAndHold(WebElement ele)` 变体，点击指定的元素。 |\n| `doubleClick()`\
    \ | 在给定的鼠标位置执行双击。它有一个 `doubleClick(WebElement ele)` 变体，点击指定的元素。 |\n| `contextClick()`\
    \ | 该方法在给定的鼠标位置执行右键点击。它们被称为 `contextClick`。它有一个接受 `WebElement` 作为输入参数的方法。`contextClick(WebElement\
    \ ele)`，将在元素执行 `contextClick`。 |\n| `dragAndDrop()` | 该方法接受源元素和目标元素作为参数。它将源元素拖到目标元素。该方法表示为\
    \ `dragAndDrop(WebElement source, WebElement target)`。该方法还有一个变体，接受需要拖拽的位置作为输入参数。`dragAndDrop(WebElement\
    \ src, int offsetX, int offsetY)`。 |\n| `moveToElement()` | 该方法接受一个 `WebElement`\
    \ 并将其移动到元素的中间。其语法为 `moveToElement(WebElement target)`。该方法有一个变体 `moveToElement(WebElement\
    \ target, int offsetX, int offsetY)`，相对于元素的视图中心移动。 |\n| `build()` | 该方法将之前的所有动作组合并创建一个复合动作，然后执行。\
    \ |\n| `perform()` | 该方法用于最终执行创建的动作或复合动作。 |\n\n**表 7.1：** action 类的方法\n\n现在我们将查看前面几个\
    \ action 方法的一些代码示例。\n\n我们将看到的第一个示例是拖放。为了查看示例，我们将使用可用的网站 URL：`[`jqueryui.com/droppable/`](https://jqueryui.com/droppable/)`，正如我们在图中所示。\n\
    \n![](img/Figure-7.1.jpg)\n\n**图 7.1：** 拖放示例\n\n"
- fmt: "\nWe will have to drag the left box and put it on the right box. After we\
    \ have performed this action, we will see the following figure:\n\n![](images/Figure-7.2.jpg)\n\
    \n**Figure 7.2:** Output obtained by dragging the left box on the right box\n\n\
    To automate the previous action, we will need the locators for both objects. As\
    \ per the HTML information available on this page, we will see that these objects\
    \ can be recognized using the available `id` property.\n\n![](images/Figure-7.3.jpg)\n\
    \n**Figure 7.3:** ID property\n\nWe need to also realize that these objects are\
    \ available inside an `iframe`; the HTML is as follows:\n\n![](images/Figure-7.4.jpg)\n\
    \n**Figure 7.4:** Objects available inside an iframe\n\nLet us write the steps\
    \ to automate the previous scenario, and for this, we will use the following action\
    \ class.\n\n1. Launch the application using URL: **[https://jqueryui.com/droppable/](https://jqueryui.com/droppable/)**.\n\
    \n2. Scroll the page down using the `JavaScriptExecutor` class available with\
    \ Selenium. This class allows to use of a `javascript` command and execute it\
    \ directly during the execution run of the browser with Selenium.\n\n3. Switch\
    \ to the `iframe` which contains the objects.\n\n4. Create an action class object,\
    \ and call the method `draganddrop`, pass the target element, which is the box\
    \ on the left, and the source element, which is the box on the right.\n\n5. Call\
    \ the method to perform on the preceding `draganddrop` method to complete the\
    \ action.\n\n6. Close the application.\n\nThe code for the preceding steps are\
    \ as follows:\n\n![](images/p111.jpg)![](images/p112.jpg)\n\nIn the next example,\
    \ we will pick where we have to perform a composite action. Composite action is\
    \ one where more than one action is clubbed together and performed using the `build`\
    \ method first. For this example, we will see the Web URL available at—**[https://the-internet.herokuapp.com/key_presses](https://the-internet.herokuapp.com/key_presses)**.\n\
    \nOn this page, there is a textbox on which we can press keys like Tab, Space,\
    \ and as we do that, the key that we press gets displayed on the page. In the\
    \ script, we will first press the Tab key, wait for 5 seconds, and then press\
    \ the Space key. We will first have to create a composite action using the `build\
    \ method()` and then call `perform`. The script for the same are as follows:\n\
    \n![](images/p113.jpg)\n\nThus, we saw the different action methods and also saw\
    \ an example of composite action.\n\n# Screenshot](#toc.xhtml_s62a)\n\nThe screenshot\
    \ interface in Selenium allows us to capture the screen at the time of script\
    \ execution and store it in different ways. Screenshots are a great way to capture\
    \ issues while script execution. They help with logging better bug reports so\
    \ that developers can easily identify by looking at the image where the issue\
    \ might have been. To use the screenshot method `getScreenShotAs`, which stores\
    \ file using the file class. This class is available in the `commons.io` jar package,\
    \ which is available by Apache. We will need to add this package to our project\
    \ so as to use the method.\n\nTo show the code example for the screenshot, we\
    \ will be taking the scenario for user login and logout using an external data\
    \ file. The file which we will use is a CSV file, which stores data using a comma\
    \ separator. The file will contain two records, one with valid user credentials\
    \ and the other with invalid user credentials. We will capture the screenshot\
    \ for user login for both valid scenarios and invalid scenarios to log the working\
    \ of the application.\n\nOur steps will be as follows:\n\n1. Create a CSV file\
    \ with two records, one with valid user credentials and the other with invalid\
    \ user credentials; the file is saved in the `DataFiles` folder in the project\
    \ with the extension of `.csv`.\n\n    ![](images/Figure-7.5.jpg)\n\n    **Figure\
    \ 7.5:** Records with user credentials\n\n2. We then write the script to automate\
    \ the steps to login and logout of the application are as follows:\n\n    1. Open\
    \ the application.\n    2. Click `My Account` link.\n    3. Type username, using\
    \ the data read from CSV file.\n    4. Type password, using the data read from\
    \ the CSV file.\n    5. Click `Sign In`.\n    6. If the user logs in successfully,\
    \ capture the screenshot and then click on log off and continue the link.\n  \
    \  7. If the user does not log in successfully, then capture the screenshot and\
    \ close the application.\n\n3. To capture the screenshot, we will call the `getScreenShot`\
    \ method of the screenshot interface. This interface will be initialized using\
    \ the browser object created. We will store it as a `File` object and then convert\
    \ that file into a `.jpg`. The class we use for it is the `FileUtils` class in\
    \ the Commons IO jar package.\n\n4. The screenshots will be stored in the `Screenshots`\
    \ folder, which we need to create prior to our project. So our project tree looks\
    \ like the following figure:\n\n    ![](images/Figure-7.6.jpg)\n\n    **Figure\
    \ 7.6:** Project tree\n\nThe following code shows the script which is generated\
    \ from the preceding steps written:\n\n![](images/p115.jpg)![](images/p116.jpg)![](images/p117.jpg)\n\
    \nThe previous code will execute two times for the valid user and invalid user.\
    \ After the execution is complete, we can find in the Screenshots folder two images\
    \ captured for valid and invalid users. Let us see the screenshots captured here.\n\
    \n![](images/Figure-7.7.jpg)\n\n**Figure 7.7:** Valid user\n\n![](images/Figure-7.8.jpg)\n\
    \n**Figure 7.8:** Invalid user\n\nAs mentioned previously, screenshot capturing\
    \ during execution helps us log effective and detailed issues if found. This helps\
    \ the team members to fix the issues with the help of visual descriptions.\n\n\
    # WebDriverManager](#toc.xhtml_s63a)\n\nThe `WebDriverManager` allows us to manage\
    \ at runtime the driver executable, which will be required by the browser for\
    \ automation. Using this package, we do not have to download or keep track of\
    \ the driver versions with respect to the browser version. Using this library,\
    \ the tasks to manage the drivers for the respective browser get simplified.\n\
    \nThis library was developed by Boni Garcia, **[https://github.com/bonigarcia](https://github.com/bonigarcia)**,\
    \ and is maintained by a group of contributors. More details about it are available\
    \ here—**[https://github.com/bonigarcia/webdrivermanager](https://github.com/bonigarcia/webdrivermanager)**.\n\
    \nIn this section, we will write down a sample code, which uses the `WebDriverManager`\
    \ to launch and work with the browser. We will write the steps to launch the three\
    \ different browsers in three scripts and then wait for 5 seconds and close them.\
    \ The browsers we will choose are Chrome, Firefox, and Internet Explorer.\n\n\
    Launch Chrome using `WebDriverManager` as shown here:\n\n![](images/p119.jpg)\n\
    \nLaunch Firefox using `WebDriverManager` as shown here:\n\n![](images/p119a.jpg)\n\
    \nThe last we see is launching Internet Explorer using `WebDriverManager` as shown\
    \ here:\n\n![](images/p120.jpg)\n\nThus, we see in this section how we can use\
    \ the `WebDriverManager` to work with different browsers. We also saw that we\
    \ did not have to download or manage the drivers for these browsers.\n"
