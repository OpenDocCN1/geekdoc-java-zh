    \ a `StaleElementException` in our code. To handle it, we will have to identify\
    \ the dropdown element again.\n6. To work with the dropdown element, we need to\
    \ import the package: `org.openqa.selenium.support.ui.Select`.\n\nLet us now look\
    \ at the following code:\n\n![](images/p85.jpg)![](images/p86.jpg)[](images/p87.jpg)\n\
    \nSo as seen in the preceding code, where appropriate comments are also added\
    \ for better understanding, we are able to print out the output with the manufacturer\
    \ name and the products associated with them. The output is as follows:\n\n`The\
    \ manufacturer Canon has no products`\n`The manufacturer - Fox products are listed--`\n\
    `Product Name+ Price Buy Now`\n`Courage Under Fire $38.99 $29.99`\n`Buy Now`\n\
    `Die Hard With A Vengeance $39.99`\n`Buy Now`\n`Speed $39.99`\n`Buy Now`\n`Speed\
    \ 2: Cruise Control $42.00`\n`Buy Now`\n... (remaining output truncated)\n\nWe\
    \ can try more functions associated with the dropdown class depending upon the\
    \ scenario we have to automate.\n\n# Conclusion\n\nIn this chapter, we have learned\
    \ to handle the form elements, the Web table, and the dropdown element. In our\
    \ upcoming chapter, we will learn to handle the frame, alert and how to work with\
    \ advance keyboard and mouse actions.\n\n# Questions\n\n1. Which function of `WebElement`\
    \ will we use to find out if the radio button is selected or not?\n2. Is Web table\
    \ a container element?\n3. List the three different methods to select an element\
    \ in a dropdown list?\n4. When do we get `StaleElementException`?\n\n# CHAPTER\
    \ 6: Working with WebElement—Alert, Frame, IFrame, and Window\n\nIn the previous\
    \ chapter, we saw handling of the different types of the HTML elements, such as\
    \ the input elements, the Web table, and the dropdown element. In this chapter,\
    \ we will learn about how we can automate the handling of the JavaScript alerts,\
    \ also known as popups, the Frame element, the IFrame element, the HTML window,\
    \ and the action class, which is used to handle advance mouse and keyboard actions.\
    \ To understand the concepts of this chapter, we will have to explore another\
    \ Web application, which is hosted on this link—[https://the-internet.herokuapp.com/](https://the-internet.herokuapp.com/).\
    \ This website is maintained by Elemental Selenium and widely used by the Selenium\
    \ community to try and understand the working of the different types of HTML elements\
    \ using Selenium. Some of our examples will be based on it.\n\n# Structure\n\n\
    The chapter is divided into the following sections:\n\n* Working with JavaScript\
    \ alerts\n* Working with Frame and IFrame HTML element\n* Working with HTML window\n\
    * Working with action class\n\n# Objectives\n\nAfter reading this chapter, you\
    \ will be able to:\n\n* Use the `Alert` class in Selenium to handle the popups.\n\
    * Work with the IFrame element, and handle objects which are inside an IFrame.\n\
    * Automate scenarios when a new window opens in the application.\n\n# Working\
    \ with JavaScript alerts\n\nThe JavaScript alerts or popups are found in various\
    \ Web application scenarios. These popups can provide information or request a\
    \ user action. Until we handle the popup, we cannot proceed with any other action\
    \ on our Web application. There are three kinds of JavaScript alerts are as follows:\n\
    \n* Alert box\n* Confirm box\n* Prompt box\n\nAn alert box is used to provide\
    \ information to the user, and the user generally handles it by closing or clicking\
    \ on the `OK` button.\n\n![](images/Figure-6.1.jpg)\n\n**Figure 6.1:** Alert box\n"
