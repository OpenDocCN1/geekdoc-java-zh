    # WebDriver 方法


    与 WebDriver 关联的方法是为浏览器对象编写的。接口函数为浏览器对象提供。如 `ChromeDriver`、`FirefoxDriver` 以及其他浏览器驱动类实现了
    `WebDriver` 接口，因此，当我们创建相应浏览器驱动类的实例时，我们就能能够访问这些方法。


    让我们来看下表列出的方法：


    | 方法 | 目的 |

    | :--- | :--- |

    | `get()` | 此函数用于用函数给定的 URL 打开浏览器。 |

    | `navigate()` | 此函数用于导航到函数提供的页面。 |

    | `close()` | 此函数用于关闭用浏览器会话打开的当前浏览器窗口。 |

    | `quit()` | 此函数用于关闭用浏览器会话打开的所有浏览器窗口。 |

    | `switchTo()` | 此函数配合浏览器对象用于切换到新窗口、警框或框架。 |

    | `getTitle()` | 此函数返回当前标题的文本。 |

    | `getCurrentUrl()` | 此函数返回页面的当前 URL。 |

    | `getWindowHandle()` | 此函数返回页面的当前窗口 ID。 |

    | `getWindowHandles()` | 此函数返回为当前驱动会话关联的  生成的所有窗口 ID。 |

    | `manage()` | 此函数有多个用途。它允许浏览器窗口最大化、最小化。它还有助于隐式时间管理等。 |

    | `findElement()` | 此函数返回使用所提供的定位策略找到的第一个元素。 |

    | `findElements()` | 此函数返回与给定定位策略匹配的所有元素。 |


