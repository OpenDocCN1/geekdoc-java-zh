    # 第 4 章


    # 同步概念


    在上一章中，我们最终实现了对 Selenium 库中三个重要支柱的知识学习，并在 Chrome、Firefox 和 Internet Explorer 三种浏览器上通过练习应用程序的
    URL 实现了浏览器的自动化启动。当我们学习 Selenium 的支柱时，理解测试自动化的一个主要支柱——同步（Synchronization）是非常重要的。在本章中，我们将理解脚本执行与应用程序处理命令保持同步的概念及其重要性。让我们开始吧。


    # 结构


    本章分为以下章节：


    - 什么是同步，以及为什么重要

    - 同步的类型

    - 如何实现隐式等待（implicit wait）

    - 如何实现显式等待（explicit wait）

    - 如何检测可能存在同步问题的脚本


    # 目标


    学习本章后，你应该能够识别脚本中需要等待的地方，并相应地添加隐式等待或显式等待。你还需要能够识别脚本是否由于同步问题而失败，并修复它。我们还可以在决定在何中使用同步。


    # 理解同步及其重要性


    同步的字典含义是两个或多个事物同时进行的活动。当我们没有工具帮助而自己执行场景时，我们可以根据 Web 应用程序的速度来同步我们的操作，因为我们可以利用认知能力判断是否应该等待操作完成还是继续执行指令。


