  trans: "\n确认框用于用户确认某个操作或拒绝该操作。它通常包含一个 `OK` 或 `Cancel` 按钮。用户可以通过点击其中任意一个来处理。\n\n\
    ![](img/Figure-6.2.jpg)\n\n**图 6.2:** 确认框\n\n最后，提示框（prompt box）用于我们需要用户提供某些信息的情况。用户必须输入内容，然后可以点击\
    \ `OK` 或 `Cancel` 按钮。\n\n![](img/Figure-6.3.jpg)\n\n**图 6.3:** 提示框\n\n为了处理这些警报，Selenium\
    \ Java 绑定中有一个名为 `Alert` 的独立接口。详情请访问：**[`www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/Alert.html`](https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/Alert.html)**\n\
    \n`Alert` 接口有四个方法，如下表所示：\n\n| 方法名 | 操作 |\n| :--- | :--- |\n| `Accept` | 此方法将接受警报。它将触发点击\
    \ `OK` 按钮。 |\n| `Dismiss` | 此方法将取消警报。它将触发点击 `Cancel` 按钮。 |\n| `getText` | 此方法将获取在\
    \ `Alert` 上显示的文本。 |\n| `sendKeys` | 此方法将我们在键盘上按下的按键发送到 `Alert`。 |\n\n**表 6.1:**\
    \ 警报接口的方法\n\n为了理解警报的处理，我们将借助互联网 Heroku 应用程序并观察其运行情况。该网站为：**[`the-internet.herokuapp.com/javascript_alerts`](https://the-internet.herokuapp.com/javascript_alerts)**。在这里，我们可以找到所有三种类型的警报。\n\
    \n要处理第一类警报框，我们将执行以下操作：\n\n1. 使用 URL：**[`the-internet.herokuapp.com/javascript_alerts`](https://the-internet.herokuapp.com/javascript_alerts)**\
    \ 在 Chrome 上启动该应用程序。\n2. 点击图中所示的按钮：\n   ![](img/Figure-6.4.jpg)\n   **图 6.4:**\
    \ 确认框类型的弹出窗口\n3. 处理弹出的警报：\n   ![](img/Figure-6.5.jpg)\n   **图 6.5:** 第一类警报框\n\
    4. 如果警报已处理，我们将在网页上看到成功消息：\n   ![](img/Figure-6.6.jpg)\n   **图 6.6:** 页面上的结果消息\n\
    \n让我们查看上述步骤的代码，以操作警报框类型的弹出窗口。\n\n```\nimages/p94.jpg)![](img/p95.jpg)\n```\n\n\
    现在让我们处理 `Confirm` 确认框类型的弹出窗口。针对 `Confirm` 框将执行以下步骤：\n\n1. 使用 URL：**[`the-internet.herokuapp.com/javascript_alerts`](https://the-internet.herokuapp.com/javascript_alerts)**\
    \ 在 Chrome 上启动 Web 应用。\n2. 点击第二个按钮：\n   ![](img/Figure-6.7.jpg)\n   **图 6.7:**\
    \ 确认框类型的弹出窗口\n3. 在这里，让我们通过点击 `Cancel` 按钮来忽略警报。\n   ![](img/Figure-6.8.jpg)\n \
    \  **图 6.8:** 忽略警报框\n4. 如果警报被忽略，我们的网页将显示以下消息：\n   ![](img/Figure-6.9.jpg)\n  \
    \ **图 6.9:** 忽略警报框时获取的消息\n\n让我们查看实现上述语句代码的脚本：\n\n```\nimages/p96.jpg\n```\n\n\
    在最后一种类型的警报处理中，我们将处理提示框（Prompt Box）。为此，我们将执行以下步骤：\n\n1. 使用 URL：**[`the-internet.herokuapp.com/javascript_alerts`](https://the-internet.herokuapp.com/javascript_alerts)**\
    \ 启动 Web 应用。\n2. 点击第三个按钮：\n   ![](img/Figure-6.10.jpg)\n   **图 6.10:** 最后一类型的警报处理\n\
    3. 我们在此处获取与警报相关的文本，并向其发送文本 `Hello how are you`。\n   ![](img/Figure-6.11.jpg)\n\
    \   **图 6.11:** 获取与警报相关的文本\n4. 我们最后接受该警报，并在警报关闭后在网页上看到发送到提示框的消息。\n   ![](img/Figure-6.12.jpg)\n\
    \   **图 6.12:** 获取的结果\n\n让我们编写处理上述步骤的代码：\n\n```\nimages/p98.jpg\n```\n\n在所有先前的代码中，当我们处理警报时，我们看到有一个来自驱动程序的函数可以使用，即\
    \ `switchTo().alert`。`switchTo()` 是与 `Webdriver` 对象关联的函数，它允许我们将焦点切换到警报、框架（frame）或新窗口。在这里，我们用它来处理警报。\n\
    \n我们已经看到了不同类型的 JavaScript 警报（也称为弹出窗口），以及如何使用 Selenium 处理它们。在下一节中，我们将讨论 Frame（框架）。\n\
    \n# 操作 Frame 和 IFrame (#toc.s54a)\n\n`frame` 标签允许我们将 HTML 分为若干部分，每个部分都由框架支持。示例如下：\n\
    \n```\nimages/figure-no.jpg\n```\n\n网页看起来如下：\n\n![](img/Figure-13.jpg)\n\n如果我们有一个包含\
    \ IFrame 的 HTML 页面，我们必须首先将焦点切换到 IFrame，然后驱动程序才能访问其中的元素。为了展示这一点，我们将以 Heroku 应用程序为例。应用程序的\
    \ URL 为：**[`the-internet.herokuapp.com/iframe`](https://the-internet.herokuapp.com/iframe)**\n\
    \n我们在这里决定的自动化场景如下：\n\n1. 使用 URL 打开应用程序：**[`the-internet.herokuapp.com/iframe`](https://the-internet.herokuapp.com/iframe)**\n\
    2. 页面启动后，获取 WYWYG 编辑器中显示的内容\n   ![](img/Figure-14.jpg)\n   **图 6.14:** 带有 WYWYG\
    \ 编辑器的 IFrame\n3. 将其打印到控制台\n\n当我们尝试检查页面上的 WYWYG 编辑器时，发现它在 IFrame 内部，如下所示：\n\n\
    ![](img/Figure-15.jpg)\n\n**图 6.15:** 与 IFrame 页面相关的 HTML\n\n因此，为了从编辑器获取内容，我们必须首先将焦点切换到\
    \ IFrame，然后驱动程序才能访问网页上的元素。代码将如下：\n\n```\nimages/p102.jpg\n```\n\n在先前的代码中，我们将看到使用了\
    \ IFrame 的 id 属性来识别它。然后我们使用 `switchTo` 命令将焦点转移到网页上。一旦驱动程序指向它，我们就可以访问 `p` HTML\
    \ 元素的文本并将其显示在控制台上。工作完成后，我们使用 `switchTo().defaultContent()` 方法将焦点切回主 HTML 页面。\n\
    \n至此，我们完成了使用 Selenium 操作 IFrame 元素及其所在网页。\n\n# 操作 HTML 窗口 (#toc.s55a)\n\n很多时候，我们会遇到应用程序在启动时打开新页面，例如电子商务网站在新窗口或新标签页中打开广告页。为了用自动化处理这种情况，我们需要再次使用驱动程序的\
    \ `switchTo` 函数。该函数允许我们将 WebDriver 对象的焦点切换到新窗口或标签页。\n"
- fmt: "\nTo work with the windows, we need to understand that every window is associated\
    \ with a unique window handle. This window handle is used to identify it and associate\
    \ the driver object with it. To work with all windows opened with the same driver\
    \ instance, we can store them in a collection called a set. A set is a collection\
    \ in Java that allows to store unique data values. We then use an `Iterator` to\
    \ iterate through all values in the set. Let us see an application that allows\
    \ us to open a new window.\n\nThe scenario which we will automate is as follows:\n\
    \n1. Open the application using the URL: `[https://the-internet.herokuapp.com/windows](https://the-internet.herokuapp.com/windows)`.\n\
    2. After that, we click on the link as shown in the following image:\n   ![](images/Figure-6.16.jpg)\n\
    \   **Figure 6.16:** Link to be clicked\n3. When we click on `Click Here`, it\
    \ will open a new tab with a new page which looks as follows:\n   ![](images/Figure-6.17.jpg)\n\
    \   **Figure 6.17:** New Window launched\n4. We will verify if the new page contains\
    \ the text `New Window`.\n5. We will now close the window and go back to the main\
    \ parent window and close it also.\n\nThe code for the preceding steps is as follows:\n\
    \n![](images/p104.jpg)\n\nWe can see in the code that once we have fetched in\
    \ a set all the window handles, we are using the for each loop to print the window\
    \ handles on the console. After that, we convert the set to an Object Array. Here,\
    \ we need to realize that the first element in the array will be the handle of\
    \ the parent window. The next element in the array will be the next window which\
    \ is launched, and so on. Since for our scenario, there are only two windows,\
    \ at 0 index we have the handle of the parent window, and at index 1 we have the\
    \ handle of the child window.\n\nWe then use the `driver.switchTo().window` command\
    \ to switch to the child window by passing the second index of the array. We then\
    \ find if it contains a required text and closes it. We then switch to the parent\
    \ window using the first element of the array and close it too.\n\nThus, in the\
    \ preceding code, we have seen how we can work with windows in Selenium.\n\n##\
    \ Conclusion\n\nIn this chapter, we have seen how we can work with HTML elements\
    \ which are container elements. The container HTML elements are those which contain\
    \ other HTML elements. We saw how we can work with Web tables, dropdown elements.\
    \ We also saw the usage of the `switchTo` method associated with the webdriver,\
    \ which allows us to switch the focus to a new alert, an IFrame, or a new window.\
    \ Overall, with the lessons learnt in Chapters 8 and 9, we should be able to handle\
    \ the different types of HTML elements we can see in a Web application. In the\
    \ upcoming chapter, we will get the concepts on `Action` class, Screenshot capture,\
    \ WebDriver manager, and so on.\n\n## CHAPTER 7\n\n## Extra Concepts—Actions,\
    \ Screenshot, WebDriverManager\n\n### Introduction\n\nIn this chapter, we will\
    \ discuss about a few extra concepts available in Selenium. We will talk about\
    \ the `Action` class, which allows us to handle advance mouse and keyboard actions.\
    \ We will see how we can capture screenshots during execution. We will also talk\
    \ about a recently introduced third-party package in Selenium called as `WebDriverManager`,\
    \ which comes in handy while working with Selenium to fetch at turn time the correct\
    \ browser driver for the browser chosen for execution.\n\n### Structure\n\nIn\
    \ this chapter, we will discuss the following topics:\n* Actions\n* Screenshot\n\
    * WebDriverManager\n\n### Objectives\n\nThe objective of this chapter is to a\
    \ few extra concepts while trying to automate Web applications when using Selenium.\
    \ After this chapter, you will be able to:\n* Automate advance keyboard and mouse\
    \ operations using the `Action` class.\n* Able to capture screenshots at the time\
    \ of execution for better reporting.\n* Finally, use the concept of WebDriver\
    \ manager to take care of the driver browser interaction for our automation scripts.\n\
    \n### Actions\n\nWhile working with Web applications, we may come across scenarios\
    \ where we need to perform some advance user gestures using keyboard and mouse.\
    \ Like drag and drop, mouse over, key up and key down, and so on. To perform these\
    \ actions, we should use the action interface available with Selenium. The interface\
    \ is available in the interactions package—org.openqa.selenium.interactions. It\
    \ also helps us to create a composite action, which could be a combination of\
    \ two or more actions to be performed together. There are various methods available\
    \ with the `Action` class; more details can be found on this link—`[https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/interactions/Actions.html](https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/interactions/Actions.html)`.\n\
    \nWhile working with Web applications, we may come across scenarios where we need\
    \ to perform some advance user gestures using keyboard and mouse. Like drag and\
    \ drop, mouse over, key up and key down, and so on. To perform these actions,\
    \ we should use the action interface available with Selenium. The interface is\
    \ available in the interactions package—org.openqa.selenium.interactions. It also\
    \ helps us to create a composite action, which could be a combination of two or\
    \ more actions to be performed together. There are various methods available with\
    \ the `Action` class; more details can be found on this link—`[https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/interactions/Actions.html](https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/interactions/Actions.html)`.\n\
    \n## Methods of action class\n\nThe various methods of the action class the following\
    \ are:\n\n| Method name | Description |\n| :--- | :--- |\n| `click()` | Performs\
    \ click at the current location. It is generally used when we are creating a composite\
    \ action. It has a `click(WebElement ele)` method variant which clicks on the\
    \ Web element. |\n| `clickAndHold()` | Performs a click operation at the current\
    \ mouse position and holds it. It has a `clickAndHold(WebElement ele)` method\
    \ variant, which clicks on given Web element. |\n| `doubleClick()` | Performs\
    \ double click at the given mouse position. It has a `doubleClick(WebElement ele)`\
    \ method variant, which performs double element. |\n| `contextClick()` | This\
    \ method performs right-click at the given mouse position. They are also known\
    \ as `contextClick`. It has a method variant that takes `WebElement` as an input\
    \ argument. `contextClick(WebElement ele)`, this will perform `contextClick` at\
    \ the Web element. |\n| `dragAndDrop()` | This method takes as argument a source\
    \ element and a target element. It drags the source element to the target element.\
    \ This method is represented as `dragAndDrop(WebElement source, WebElement target)`.\
    \ This method also has a variant, which takes as input argument the position to\
    \ which the element needs to be dragged. `dragAndDrop(WebElement src, int offsetX,\
    \ int offsetY)`. |\n| `moveToElement()` | This method takes as argument a `WebElement`,\
    \ and moves the mouse to the middle of the element. Its syntax is `moveToElement(WebElement\
    \ target)`. This method has a variant `moveToElement(WebElement target, int offsetX,\
    \ int offsetY)`. This method moves to offset with respect to the element’s viewpoint\
    \ center. |\n| `build()` | This method takes all the previous actions and combines\
    \ them to create a composite action, which will then be performed. |\n| `perform()`\
    \ | This method is used to finally perform the action or the composite action\
    \ created. |\n\n**Table 7.1:** Methods of the action class\n\nWe will now see\
    \ some code example samples for a few of the preceding action methods.\n\nThe\
    \ first example we will see is drag and drop. To see the example, we will take\
    \ the available website URL: `[https://jqueryui.com/droppable/](https://jqueryui.com/droppable/)`\
    \ as we can see in the website based on the following figure.\n\n![](images/Figure-7.1.jpg)\n\
    \n**Figure 7.1:** Drag and drop example\n"
