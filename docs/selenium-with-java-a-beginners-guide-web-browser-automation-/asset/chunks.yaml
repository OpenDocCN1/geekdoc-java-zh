    # Dedicated to


    **Neeal** and **Maisha**


    &&


    **Dr Neelaksh** and **Dr Manju**


    My kids who continue to make me see the wonders of life.


    And my parents because of them I am.


    # About the Author


    **Pallavi Sharma** is a multiskilled professional who dons many hats. She started
    her career as a Research Scholar under `Dr Naren Ramakrishnan` at `Virginia Tech`
    where she worked on Data mining project for bioinformatics.


    At `Crestech Software Systems` she was part of the Centre of Excellence Team under
    the `CEO`, which was responsible for providing cutting edge solutions to the delivery
    team. She has worked on tools like `Selenium`, `Watir`, `RFT`, `JMeter`, `LoadRunner`,
    `Rational Robot` and similar tools.


    She managed the team of developers, testers, support function, presales, marketing
    and technical writing for the inhouse product `OpKey`. She also managed the company
    patent and trademark division.


    In 2014 she founded `5 Elements Learning`, where she coach people on `Selenium`,
    `Appium`, `Cucumber` ecosystem, which includes tech stack for test automation
    project. She coach using programming languages like `Java`, `Python`, `CSharp`
    and `Ruby`. She has taught more than 1000 people from across the globe. She is
    also an instructor at `Udemy`, with more than 20K followers, and have many paid
    and free courses hosted for testers.


    She continues to be an active participant for various global conferences like
    `Selenium Summit`, `APISummit Delhi Software Testing Conference`, `Selenium India
    Conference`, `Global Testing Retreats`. She has participated as `Jury`, `Organizing
    Committee Member`, and as `Speaker`.


    She grateful to be mentored and taught by `Michael Bolton` and `Maaret Pyhäjärvi`
    on the concepts of `Explor Testing`.


    She is a Steering Committee member with `Agile Testing Alliance`, since 2021,
    and a long time advisory board member. Her work involves designing programs on
    various global certifications on automation, organizing conferences, and handle
    the social media presence of `Agile Testing Alliance`, with a team.


    She is a published author with `BPB publications`. Her first book, `Selenium with
    Python A beginner''s book` is among the top 10 books on amazon for the category.
    Her second book `Selenium 4 – A Quick and Practical Guide` is available on `LeanPub`.


    She believes in certifying her learnings, and holds various certifications like
    `ISTQB`, `CP-SAT`, `CP-WST`, `CP-DOF`, `Cucumber School Completion`, `SpecFlow`
    among others.


    She is an avid reader, traveller, and a writer at heart. She enjoys fiction, non
    fiction books, and writing poetry, short stories on her life experiences. She
    shares her work on `Medium`, and could be found at - [https://medium.com/@pallavimuse](https://medium.com/@pallavimuse).


    She is a firm believer in larger good, and likes to live by example. Organization
    like `eVidyaloka`, `People for Animal`, `WildLife SOS`, and `Jabarkhet forest
    reserve` is where she dedicates her resources.


    # About the Reviewer


    **Jaya Saini** has 6.5 years of experience in Automation testing and API testing
    using tools like `Selenium`, `TestNg`, `Robot Framework`, `Postman`, with programming
    languages like `Java`, `JavaScript` `Python`, and more. `Jaya Saini` pursued `B.Tech`
    in Computer science and engineering from `Rajasthan Technical University`, `Alwar`.
    She has worked with companies like `Sopra Banking` and `Thinksys software`. She
    is currently working as Automation acting Test lead in `Thinksys software`, `Noida`.


    # Acknowledgement


    There are a few people I want to thank for the continued and ongoing support they
    have given me during the writing of this book. First and foremost, I would like
    to thank the creator of `Selenium` `Jason Huggins`, and creator of `Selenium Webdriver`
    `Simon Stewart` for their creation. The people behind the `Selenium` project and
    community, who continue to work for the project and make it available for the
    world.


    I would like to thank my husband `Ravinder` for his unconditional love, and silly
    jokes. My parents for setting example to live life by giving others. My children
    `Neeal` and `Maisha` who remind me to be a child at heart always. My sister `Dr
    Mahak` for her endless patience, and our conversations about life, environments,
    politics, humour and of course relatives.


    I would like to thank `Manish Jain`, for giving me the opportunity with `BPB Publications`,
    and help me achieve my dream of becoming a writer. The editor and technical team
    at `BPB Publications` for their continuous support.


    Finally my immense thanks to the various form Almighty takes, and allows me to
    experience its endless wisdom, as I live.


    # Preface


    `Selenium` automates the browser, what we do with that power is up to us. This
    is the message which we get the first time we visit the official website of Selenium.
    It is the most popular open source solution to automate the browser, and is freely
    available to anyone and everyone to use. People who are into web application testing,
    have been using `Selenium` for many years now. It helps automate mundane tasks,
    achieve efficiency, and accuracy which in end improves the test process. `Selenium`
    power lies in the fact that it can be implemented using any programming language,
    can automate any web browser which is W3C compliant, and can run on any operating
    system.


    `Selenium` project and `WebDriver` merged to make `Selenium WebDriver`, which
    is now a W3C standard. This means any web browser which is W3C compliant can be
    automated using `Selenium`. Various versions of `Selenium` are used across projects
    both small and big. The version of `Selenium` which we have used in this book
    is `3.141.59`. The implementation of `Selenium` in this book is done using `Java`
    as a programming language.


    In this book we have tried to cover the basic classes and interfaces of `Selenium`
    which help us automate the browser and browser elements. We have covered the importance
    of data and object management outside the test scripts, and also covered the implementation
    of the same. We talk about the popular unit test framework `TestNG`, and understand
    its various dimensions which we can use in the our test automation projects. We
    in end learn about how we can set our tests for execution in parallel using `Selenium
    Grid` for different test environments.


    Over the 12 chapters in this book, you will learn the following:


    **[Chapter 1](#c01.xhtml)** – Learn about what is `Selenium`. Get introduced to
    the three projects under `Selenium`. The `Selenium IDE`, `Selenium WebDriver`
    and `Selenium Grid`.

