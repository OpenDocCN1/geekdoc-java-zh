    \ hub 位置）\n- `-browser \"browserName=firefox\" -port 5556`（提供浏览器信息以及 node 监听的端口）\n\
    \n4. 要检查节点是否已注册到 hub，我们将刷新使用 URL `http://localhost:4444/grid/console` 打开的 hub\
    \ 页面\n   ![](img/Figure-12.7.jpg)\n   **图 12.7:** 带有节点的 Hub\n\n# 使用 Selenium Grid\
    \ 在 Firefox 浏览器上创建并运行测试脚本\n\n要使用 Selenium Grid 在 Firefox 浏览器上创建并运行测试脚本，我们需要创建一个\
    \ `RemoteWebDriver` 实例，而不是 `WebDriver`。当我们创建远程 WebDriver 实例时，还将使用 `DesiredCapabilities`\
    \ 类来传递 Firefox 浏览器信息。让我们查看下面的代码段：\n\n![](img/p194.jpg)\n\n在代码段中，如我们所示，我们为 Firefox\
    \ 浏览器创建了 `DesiredCapabilities` 对象。它被传递给创建的 `RemoteWebDriver` 实例。该实例还接收 hub 的位置。请注意，这里的\
    \ hub 位置是 `localhost:4444`。这意味着 hub 运行在本地端口 `4444` 上。如果我们的 hub 运行在不同的机器实例上，我们将传递该机器\
    \ URL 以及 hub 运行的端口地址。一旦驱动实例创建，脚本其余部分保持不变。因此，当我们执行脚本时，请求将发送到 hub。hub 随后将请求传递给节点，在节点上根据测试脚本进行实际执行。\n\
