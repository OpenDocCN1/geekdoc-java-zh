    # [Passing data in TestNG test](#toc.xhtml_s74a)


    Data management and structuring form an integral part of the test automation suite
    design. The TestNG framework provides us with different ways to manage and handle
    passing data to the test. We have available with us the parameters tag in the
    suite XML file and the **`@DataProvider`** annotation, which we can use in the
    class file, to parameterize the **`@Test method`**. Let us see in this section
    the situation where we can use these two entities to make our test design better.


    Let us take a test suite design, where we have more than one test available. We
    need to pass the information of the browser as a configuration setting, mentioning
    before suite execution begins which browser the test should use. It could be also
    possible that we design a test suite file in a manner that a group of tests take
    one particular browser for execution. To achieve this, we need to use the **`Parameter`**
    tag, which is available for us to use during the suite XML file design.


    To use it, we will create a test suite, which contains more than one test, and
    pass the browser information as a configuration setting. To implement this, we
    will see how our suite file will look like and where and how we will be using
    the **`Parameter`** information which will be passed to the test from the suite
    file.


    For example, let our test suite contain two test files, one for valid user login
    and the other for the invalid user login, and we pass browser execution information
    from the suite file. To show this, we created a **`baseFile`**, which has a method
    to set the driver object based on the browser name passed to it. We then call
    the method in our TestNG class file and using the parameter tag in the suite file,
    we pass the browser name, which for this example, we are going to use chrome.
    Let us see the code files as follows:


    **baseFile**


    ![](images/p137.jpg)


    **`loginLogoutWithParams`**—Java code is as follows:


    ![](images/p137a.jpg)![](images/p138.jpg)


    The TestNG suite XML file look as follows:


    `<?xml version=``"1.0"` `encoding=``"UTF-8"``?>`


    `<suite parallel=``"false"` `name=``"DemoSuite"``>`


    `<parameter name=``"browser"` `value=``"chrome"``/>`


    `<test name=``"LoginLogout"``>`


    `<classes>`


    `<``class``name``=``"testngfiles.loginLogoutWithParams"``/>`


    `</classes>`


    `</test> <!-- Test -->`


    `</suite> <!-- Suite -->`


    So in these code files, we saw how we can pass the browser information in the
    parameter file. Next, we will see how we can pass the information using the data
    provider in the test method.


    **DataProvider**


    The **`@DataProvider`** annotation takes data values in the form of a two-dimensional
    array object. We can pass any data type, whether it is an integer, a double or
    an object of a class. The name which we use for the **`DataProvider`** is passed
    to the **`@Test`** method. There could be more than one data provider available
    in a class file. In an example, which we will take to understand the usage of
    the **`DataProvider`**, we will pick data for user details from a CSV file. The
    code for this will be written in the **`@DataProvider`** annotation. We will then
    use this to parameterize the **`@Test`** method. Let us look at the following
    code.


    **`loginLogoutWithDataProvider`**—Java code file:


    ![](images/p139.jpg)![](images/p140.jpg)


    In the preceding file, we pass the browser information through **`Parameter`**,
    and use the **`@DataProvider`** annotation to read information from the CSV file
    and pass it to the **`@Test method`**. We will note that the test gets executed
    twice. Let us look at the result file after the execution is over as follows:


    ![](images/Figure-8.13.jpg)


    **Figure 8.13:** Result file of suite execution with data provider


    Thus, in the preceding code, we saw how we can use the **`@DataProvider`** to
    parameterize the **`@Test`** method and read data from a CSV file.


