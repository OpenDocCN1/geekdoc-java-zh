    * The page is not loaded in time, and we run out of time to perform the action.
    In attended mode, where a human is performing the action, can judge these using
    cognitive abilities and take appropriate action.

    * The page does get loaded, but the text field is not there.

    * The page does not get loaded, and there is an error that could be caused because
    of a client-side issue or server-side issue.

    * The page is not loaded as the internet stopped working.


    A human tester, when performing the preceding steps in person, when encounters
    an unhappy situation, will be able to take appropriate action and make a decision
    whether what is being encountered should be logged as a defect, or should the
    person wait for more for the page to load, or report issue to Web administrator
    as the website did not work because of internet issues. But when a script takes
    the place of the human tester, we have to build certain cognitive abilities into
    it so that it can act appropriately in the preceding situations, as we would expect
    someone with cognitive abilities to do. Also, one of the approaches or it should
    be enforced here is that maybe the first and foremost thing to do is take care
    of the synchronization between these two independent processes.


    There are two independent processes that take place as we use a tool to drive
    the browser and perform actions on the Web application. The tool `Selenium` used
    here will execute the command to drive the Web browser and perform an action on
    the Web application, and the Web application will execute those actions as per
    its processing speed. If we do not synchronize these two processes, our script
    will fail, and we will not be able to effectively and with reliability execute
    our scripts to test the application. The reason for this would be that from the
    script, `Selenium` would try to identify the element on the Web page, but for
    various reasons listed in the unhappy situation, the object or the page itself
    may not be loaded and may cause inconsistent behavior with our scripts written
    to test the application.


    In the following section, we will learn how we can implement synchronization in
    the script to ensure the two independent processes are aware of each other’s existence.


    # Types of synchronization


    We have learned so far the importance of synchronization. In this section, we
    will learn how we implement it in the test scripts and what the approaches are
    for it. There are two approaches as follows:


    * Implicit wait

    * Explicit wait


    Implicit wait is also known as global wait. It is generally implemented immediately
    after the `WebDriver` object is initialized. Once implemented, this wait holds
    true for every statement in the script.


    Explicit wait is known as a local wait. It is used in places in the script which
    may require more wait time. Generally, when we are using the explicit wait, we
    set the implicit wait to zero, else they may both interfere with each other. When
    we use explicit wait, we need to have a condition in which we will be waiting
    to be completed, or the wait will timeout in the specified number of seconds.
    To create a condition for the explicit wait, there is a class available in `Selenium`
    known as `ExpectedConditions`. The class has a large number of implemented methods,
    which we can use to form a condition. We will know more about it in the section
    for explicit wait.


    In the next section, we will see the implementation.


    # Scenario


    To implement the implicit and explicit wait in action, we will pick up a scenario
    of login from the application using valid user information. Let us first understand
    the following steps for it.


    ### Login


    1. Open the application using the URL—`http://practice.bpbonline.com/`

    2. Click on `My Account` link.

    3. Provide username—`admin@admin.com`, and password—`admin@123`.

    4. Click on `Sign in` button.

    5. Click on `Log off` link

    6. Click on `Continue` button


    As per the preceding steps, we launch the application on a browser and click on
    the `My Account` link (as shown in the following figure).


    ![](images/Figure-4.3.jpg)


    **Figure 4.3:** Home page of application


    We then provide a valid username and password information and then click on the
    `Sign In` button as shown in the following figure.


    ![](images/Figure-4.4.jpg)


    **Figure 4.4:** Login to the application


    If the information is correct, we will see the `My Account Information` page as
    shown in the following figure:


    ![](images/Figure-4.5.jpg)


    **Figure 4.5:** Page after Login


    Here, we then click on `Log Off` and continue button to come back to the home
    page:


    ![](images/Figure-4.6.jpg)


    **Figure 4.6:** Logout page of the application


    In the preceding scenario, we need to notice the changes of the page in the application
    as we perform an action on different elements. For example, if we click on the
    `My Account` link, we go to the page where we need to fill in the information
    for username and password. And when we click the sign in button, we go to the
    `My Account Information` page, where we see the log-off link. We click on the
    log-off link and see the continue button, and after clicking it, we are back to
    the home page.


    In each step, our script will have to be made smart to wait for an element to
    appear. If the element does not appear within a given time period; then, throw
    an exception of `Time Out` and end the execution. The first type of wait which
    we will see is implicit wait, which is introduced in the script and acts for every
    statement in the script. It is also known as a global wait. After that, we will
    see an explicit wait, which is known as local wait and is introduced at the script
    in a place, which requires more time to wait than the global time set. And as
    explained earlier, we do not use these waits together as they might interfere
    with each other. So, when we are using explicit wait, we set the implicit wait
    time to zero.


    # Implementing implicit wait


    To implement the implicit wait, we use the following command:


    ```bash

    //add implicit wait

    ```


    ```java

    driver.manage().timeouts().implicitlyWait(10, TimeUnit.SECONDS);

    ```


    Here, the `driver` is an instance of `ChromeDriver` and uses its method `manage`.
    The `manage` method has `timeouts`, where we chose the option of `ImplicitWait`.
    The arguments that we pass to this method are the time unit which we want to use
    and the quantity of that unit. So here, we choose to implicitly wait for the 10
    seconds. This command which is used will work for every statement written in the
    script. It will wait for an element to be available for the most 10 seconds; if
    within 10 seconds, the element has appeared, it will perform the action and move
    on to the next statement in the script. If for some reason, the element is not
    available and 10 seconds have passed, this situation then leads to an exception
    of `TimeOut`.


    Let us see the following login script using implicit wait:


    ![](images/p65.jpg)![](images/p66.jpg)


    # Implementing explicit wait


    To implement explicit wait, we will be using Selenium’s `WebDriverWait` interface
    and the `ExpectedConditions` interface. Before we move further, let us first talk
    about these two entities.

