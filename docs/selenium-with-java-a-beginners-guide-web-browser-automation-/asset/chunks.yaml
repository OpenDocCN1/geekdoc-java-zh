    \n    ![](images/Figure-2.8.jpg)\n\n    **Figure 2.8:** Project properties\n\n\
    2.  Next is select **`Java Build Path | Libraries | Add External Jars`**, then\
    \ traverse to the path in the system folder, where you have extracted the Selenium\
    \ jars.\n\n    ![](images/Figure-2.9.jpg)\n\n    **Figure 2.9:** Adding Selenium\
    \ jars\n\n3.  Select the two jars available outside, then go inside the **`lib`**\
    \ folder and add all the jars available in that folder to the project.\n\n   \
    \ ![](images/Figure-2.10.jpg)\n\n    **Figure 2.10:** Selenium jars\n\n4.  Once\
    \ all jars are added, our project is now ready to accept the Java programs written\
    \ with Selenium commands.\n\n5.  But before we write any Selenium commands to\
    \ drive the browsers, we should be ready with the respective drivers for our three\
    \ browsers: Internet Explorer, Firefox, and Chrome, to drive them with commands\
    \ of our choice.\n\n# [Set browser drivers](#toc.xhtml_s14a)\n\nSelenium 3.0 onwards\
    \ as W3C added it into the regulations to be adopted by the browsers to be compatible\
    \ with Selenium, the onus of providing the drivers so that Selenium can talk to\
    \ you fell on the browsers corporations. So now, chrome has to provide a Chrome\
    \ driver, Internet Explorer has to provide an Internet Explorer driver, and Firefox\
    \ provides geckdriver, which in the Selenium 2.0 series were maintained and provided\
    \ by the good people at Selenium.\n\nIn an ideal situation, one should have the\
    \ latest browser version available on the system and then download the compatible\
    \ driver version available with it. Or with respect to the browser version available\
    \ on your system, you can check which driver version will be suitable and download\
    \ that accordingly.\n\nSo, first of all, create a folder in your system on which\
    \ you have reading and writing rights. In that folder, we will be downloading\
    \ the three different driver executables from the respective websites hosting\
    \ them.\n\n| **Browser** | **Version** | **Driver**—**URL**—**Download** |\n\n\
    | Chrome | Chrome version 83 | **[https://chromedriver.chromium.org/downloads](https://chromedriver.chromium.org/downloads)**\
    \ |\n\n| Firefox | Geckdriver v0.26.0 | **[https://github.com/mozilla/geckodriver/releases](https://github.com/mozilla/geckodriver/releases)**\
    \ |\n\n| Internet Explorer | IEDriverServer 3.150.1 | **[https://www.selenium.dev/downloads/](https://www.selenium.dev/downloads/)**\
    \ |\n\n**Table 2.1:** Browser drivers\n\nOnce these executables are downloaded,\
    \ extract them from their files, and you will find the respective **`.exe`** files,\
    \ add them to some folder location like—**`drivers`**/**`resources`**, and so\
    \ on.\n\nAdd this folder to the project workspace:\n\n![](images/Figure-2.11.jpg)\n\
    \n**Figure 2.11:** Browser drivers\n\nWe are now ready to run our simple tests\
    \ on the system.\n\n# [Walkthrough of BPB application](#toc.xhtml_s15a)\n\nThroughout\
    \ the course, we will be using an application to practice our concepts. Let us\
    \ first begin with understanding the workflow of the application. The URL of the\
    \ application is **[http://practice.bpbonline.com/](http://practice.bpbonline.com/)**\n\
    \n![](images/Figure-2.12.jpg)\n\n**Figure 2.12:** BPB practice application\n\n\
    It is a sample eCommerce application with basic workflows, which are as follows:\n\
    \n*   Register user\n\n*   Login logout\n\n*   Search product\n\n*   Buy product\n\
    \n*   Change profile\n\n*   View orders\n\nOur first step as we explore the application\
    \ is to create a new user. To create a new user, we will have to use the register\
    \ user scenario. Let us see the steps using which we can do it.\n\n**Register\
    \ user**\n\nTo register the user, we will have to perform the following steps:\n\
    \n1.  Launch the application using the URL—**[http://practice.bpbonline.com/](http://practice.bpbonline.com/)**\n\
    \n2.  Click on the **`My Account`** link, as highlighted in the following image:\n\
    \n    ![](images/Figure-2.13.jpg)\n\n    **Figure 2.13:** My Account link\n\n\
    3.  The page which will open is the sign-in page. On this, the next step is to\
    \ click on **`Continue`** in the **`New User`** section, to go to the register\
    \ user page. The following image shows it.\n\n    ![](images/Figure-2.14.jpg)\n\
    \n    **Figure 2.14:** Click on continue button\n\n4.  Once we are on the register\
    \ user page, we need to fill in all the mandatory details. Please note that the\
    \ e-mail address and the password we provide here are the same we will use to\
    \ login as user credentials once we are successfully registered. We also need\
    \ to note here that it is not necessary that we provide an e-mail address that\
    \ is working. A dummy e-mail address is preferred.\n\n    ![](images/Figure-2.15.jpg)\n\
    \n    **Figure 2.15:** Register user page\n\n5.  If the user is registered successfully,\
    \ we should see the following screen:\n\n    ![](images/Figure-2.16.jpg)\n\n \
    \   **Figure 2.16:** Account creation confirmation message\n\n6.  Please note\
    \ that once the account is created, we should be able to use the e-mail address\
    \ and password combination to login into the application and explore other scenarios.\
    \ Please also note that we should disable automatic password saving as browser\
    \ behavior, as this hampers automation."
