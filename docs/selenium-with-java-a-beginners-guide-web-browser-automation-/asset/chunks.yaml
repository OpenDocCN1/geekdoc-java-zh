  trans: "\n\n本章的目的是理解 Selenium Grid。如前所述，Selenium Grid 是 Selenium 项目之一，用于在多个机器实例上并行执行测试。这基本上意味着我们可以同时在各种机器浏览器组合上并行运行测试。让我们看看本章的各个章节以进一步了解。\n\
    \n# 什么是 Selenium Grid\n\nSelenium Grid 是 Selenium 项目之一，它允许在多个机器浏览器组合实例上并行执行测试。Selenium\
    \ Grid 由两个组件组成：hub（中枢）和 node（节点），用于构建网格。hub 和 node 都是使用 Selenium server（Selenium\
    \ 项目的一个组件）设置的。通过构建网格，我们允许测试在各种机器浏览器实例上并行运行。让我们了解网格两个主要组件以及如何使用它们来实现并行执行测试。下图提供了直观的视角：\n\
    \n![](img/Figure-12.1.jpg)\n\n**图 12.1:** 网格表示\n\n# Selenium Grid 的组件\n\nSelenium\
    \ Grid 由一个 node 和 hub 组成。通过它们，我们能够并行执行测试。让我们定义它们：\n\n* **Node（节点）**：节点是实际执行测试的机器浏览器实例。节点可以是一个运行\
    \ Edge 浏览器的 Windows 机器，也可以是一个运行 Safari 浏览器的 Mac 机器。我们需要在这里理解，机器也可以是云端的虚拟机。\n*\
    \ **Hub（中枢）**：hub 是通过运行带有 `--hub` 标志的 Selenium server 创建的中心组件。hub 接收所有测试执行请求。根据收到的请求和注册到它的节点，hub\
    \ 将请求发送给节点以执行测试。测试的实际执行发生在节点上。\n\n在本章中，我们将看到测试脚本的创建，并在本地机器上同时在两个不同的浏览器上执行。\n\n\
    # 使用 Selenium Grid 在本地环境中执行测试\n\n为了理解 Selenium Grid 的工作原理，我们将在本章举一个例子。我们将创建一个测试脚本，并在本地机器上同时在\
    \ Firefox 和 Chrome 两个不同的浏览器上执行。为了实现，我们将执行以下步骤：\n\n1. 在本地机器上设置 hub。\n2. 创建并注册带有\
    \ Firefox 浏览器的 Windows 机器节点。\n3. 使用 Selenium Grid 在 Firefox 浏览器上创建并运行测试脚本。\n4.\
    \ 创建并注册带有 Chrome 浏览器的 Windows 机器节点。\n5. 使用 Selenium Grid 在 Chrome 浏览器上创建并运行测试脚本。\n\
    6. 使用 `testng` 测试套文件在两个浏览器上并行执行测试。\n\n在查看这些步骤的实现之前，我们应该有一个可用的 Selenium server，它将同时用于\
    \ hub 和 node。要下载 Selenium server，我们需要使用此 URL——[`github.com/SeleniumHQ/selenium/releases/download/selenium-3.141.59/selenium-server-standalone-3.141.59.jar`](https://github.com/SeleniumHQ/selenium/releases/download/selenium-3.141.59/selenium-server-standalone-3.141.59.jar)。\n\
    \n请注意，在编写此书时，发布了新的 Selenium 版本即 Selenium 4.0。该版本的网格部分已完全改变。我们在本书中使用的 Selenium\
    \ Grid 版本是 3.141.59。将下载的 JAR 文件保存到系统的某个位置。我们将使用这些 JAR 文件来创建 hub 和 node。\n\n##\
    \ 在本地机器上设置 hub\n\n设置 Selenium Grid 的第一步是启动 hub。让我们按照以下步骤操作：\n\n1. 打开命令提示符，进入下载\
    \ Selenium server JAR 文件的目录：\n   ![](img/Figure-12.2.jpg)\n   **图 12.2:** 更改目录\n\
    \n2. 使用以下命令启动 hub：\n   ```\n   d:\\> java -jar selenium-server-standalone-3.141.59.jar\
    \ -role hub\n   ```\n   ![](img/Figure-12.3.jpg)\n   **图 12.3:** 启动 hub\n\n3.\
    \ 下一步是在浏览器上打开以下 URL 以检查 hub 是否已启动。\n   URL—`http://localhost:4444/grid/console`\n\
    \n   如果已启动，你应该能看到以下屏幕：\n   ![](img/Figure-12.4.jpg)\n   **图 12.4:** Hub 页面\n\n\
    启动 hub 后，我们将创建一个带有 Firefox 浏览器的 Windows 机器节点。我们需要将其注册到同样在本地运行的 hub。我们需要注意，hub\
    \ 监听的默认端口是 `4444`，如果我们需要，可以使用 `port` 标志并传递端口号来更改端口。\n\n## 创建并注册带有 Firefox 浏览器的\
    \ Windows 机器节点\n\n要注册带有 Firefox 浏览器的 Windows 机器节点，我们将执行以下步骤：\n\n1. 根据系统的 Firefox\
    \ 版本，在系统上下载正确版本的 geckodriver。要下载 geckodriver，使用链接——[`github.com/mozilla/geckodriver/`](https://github.com/mozilla/geckodriver/)。\n\
    2. 打开命令提示符，进入下载 Selenium server JAR 文件的目录：\n   ![](img/Figure-12.5.jpg)\n   **图\
    \ 12.5:** 更改目录\n\n3. 使用以下命令启动 node：\n   ```\n   java -Dwebdriver.driver=\"geckodriver.exe\"\
    \ -jar selenium-server-standalone-3.141.59.jar -role node -hub http://localhost:4444/grid/register\
    \ -browser \"browserName=firefox\" -port 5556\n   ```\n   ![](img/Figure-12.6.jpg)\n\
