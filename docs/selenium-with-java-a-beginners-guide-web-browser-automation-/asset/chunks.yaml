    scenario. For log-off page to appear, we need to be first logged in to the application.
    And then, the process is we click on the **`Log Off`** link and then the continue
    link to log off from the application. The following image shows the flow:


    ![](images/Figure-9.2.jpg)


    **Figure 9.2:** Log Off page scenario


    So, for the log-off page object model, we will be using the log-off link and the
    **`Continue`** link. Let us see the following code:


    ![](images/p149.jpg)![](images/p150.jpg)


    We will now create a third class, where the business logic and validations for
    the login logout process will be written. And in this class, instead of writing
    down the steps where we first identify the Web element and then perform an action
    on it, we will call the objects from the **`login_pom`** and the **`logout_pom`**
    and access the methods defined there. Let us see the following code:


    ![](images/p150a.jpg)![](images/p151.jpg)


    In this code, we can see the following lines:


    `1 Login_Pom login = new Login_Pom(driver);`


    `2 Logout_Pom logout = new Logout_Pom(driver);`


    `3 login.clickMyAccount();`


    `4 login.loginAs("abc@demo.com", "demo@123");`


    `5 login.validateLogin("My Account Information");`


    `6 logout.logOff();`


    Lines 1 and 2 are where we define the object for the login page object model class
    and the logout page object model class. In Line 3, we call the **`clickMyAccount`**
    link method. This method, as we are aware, is declared in the **`login_pom`**
    class:


    ![](images/p151a.jpg)


    We need to also note here an important step. The WebDriver is declared in the
    calling class, and when we instantiate the object of **`login_pom`**, the driver
    object is passed. It is in the **`login_pom`** constructor method, where we see
    that the WebDriver object in **`login_pom`** is assigned the driver object passed.
    The method is shown as follows:


    ![](images/p151b.jpg)


    The same is also true for the **`logout_pom`** class. Lines 4 and 5 are where
    the actual login will take place, and the action is validated. Step 6 calls the
    log-off method from the **`logout_pom`**, where we call the clicking of log-off
    link method and the continue link method. The same is shown here:


    ![](images/p152.jpg)


    # clickLogOff


    ![](images/p152a.jpg)


    # clickContinue


    ![](images/p152b.jpg)


    Now, in any test script scenario, where we need to call the login and logout action,
    for example, in **`Change Profile`** or **`Buy Product`**, we can simply call
    the methods from the **`login_pom`** and **`logout_pom`**. Also, if any of the
    objects used in these classes undergo any change, the same needs to be done only
    in these classes and nowhere else in the code.


    The benefits of implementing page object models for our test automation code are
    many. We achieve modularity, code abstraction, reduce chances of error, less code
    lines, separate object information management, separation of business logic and
    application objects. Thus, it is important that any good test automation project
    using Selenium implements the page object model concept.


    # [Implementing page factory](#toc.xhtml_s81a)


    Selenium provides us with a class to implement page object model in our code.
    The class to do is called as page factory. We also use an annotation enum which
    is described using **`FindBy`**. To implement **`PageFactory`** class, we do not
    use the **`By`** class to define the objects. Instead, we use the annotation available
    in **`FindBy`**, which allows us to define the way we wish to find something,
    such as **`NAME`**, **`ID`**, **`LinkText`**, and so on, as well as what value
    we are searching for in that property. An example of **`FindBy`** for **`My Account`**
    link will look as follows:


    `@FindBy(linkText = "My Account")`


    `WebElement myAccLnk;`


    So in the **`login`** class for the **`PageFactory`**, the code will look as follows:


    ![](images/p153.jpg)![](images/p154.jpg)


    The **`logout`** class implemented using page factory will look as follows:


    ![](images/p154a.jpg)![](images/p155.jpg)


    In both login using page factory code and logout using page factory code, we will
    see the following code line in the constructor.


    # PageFactory.initElements(driver, this);


    The purpose of the preceding line is to initialize the page object elements using
    the driver object, which we have identified using the **`FindBy`** annotation
    in the class. Finally, the calling code will look as follows:


    ![](images/p155a.jpg)![](images/p156.jpg)


    So, the preceding code shows how we can implement page object model using the
    page factory concept, where we use the **`FindBy`** annotation to identify the
    object and then use the **`Page.init`** method to initialize the objects of the
    page with the driver object reference. Finally, like we created our own implementation
    of page object model, in the same manner, we can use the **`PageFactory`** class
    made available by Selenium to do the same.


    # [Conclusion](#toc.xhtml_s82a)


    Thus, in this chapter, we saw the importance of page object model. We understood
    the importance of modularity and the advantages we get when we separate object
    information from the business logic of the page. We saw two implementations of
    the POM, one by using design patterns by creating separate classes to manage object
    information and then a calling class that is a test script. The second implementation
    we saw was using the **`PageFactory`**, which is a class available to us with
    Selenium. In the upcoming chapter, we will learn about how we can data drive our
    test scenarios by reading data from a CSV file and an Excel file.


    # [Questions](#toc.xhtml_s83a)


    1.  Explain the importance of page object model?


    2.  What is modularity, and why is it important for code?


    3.  What does @FindBy annotation do?


    # [CHAPTER 10](#toc.xhtml_c10)


    # [Data Driving Test](#toc.xhtml_c10)


    Any Web application testing requires test data preparation. Test data forms an
    integral part of the test case process. As we automate our test scripts, we will
    find we are using data in the scripts. As the application changes or the test
    process may undergo changes, it is very much likely that the data used in test
    scripts also undergo changes. So, it is imperative that we manage data used in
    test scripts external to our test logic. Also, we may have some environment configuration
    data such as application URL, some file paths for reports, logs, and so on, which
    should also be managed externally. In this chapter, we will see how we can manage
    data for our test and use it judiciously in our scripts.


    # [Structure](#toc.xhtml_s84a)


    The chapter is divided into the following sections:


    *   Importance of data management


    *   Managing data in CSV file, Excel file, and using them in test


    # [Objectives](#toc.xhtml_s85a)


    The objective of this chapter is to understand the importance of data as an artifact
    when we are designing our tests. In this chapter, we will also see how we can
    read data from a CSV file or an Excel file. We will understand the need to manage
    data separately from the test scripts, which contain the business logic. We will
    be covering reading from two types of data files—the CSV and the Excel. For Excel,
    there are many packages available we will be using the Apache POI. We need to
    understand here that managing data has got nothing to do with Selenium. It depends
    on the programming language we are using to design our test. And it depends on
    us how to manage the data.


