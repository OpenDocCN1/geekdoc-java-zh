    # [Design TestNG test](#toc.xhtml_s73a)


    In this section, we will explore creating a TestNG class file. The scenario which
    we will pick for this is the login logout scenario. We will create two class files
    with two methods, one for login to the application successfully and another to
    test incorrect login. We will then call these files from our TestNG suite file.


    Let us first see the code for the **`loginLogout`** TestNG class file. We will
    from here now start using **`webdrivermanager`**; as in the upcoming chapters,
    we will start talking more about the various components that come together to
    help us design and write better test automation suites. You can choose to still
    work with driver executables if you wish to.


    ![](images/p134.jpg)![](images/p135.jpg)


    As we can see in the preceding TestNG test design, we have a **`@BeforeMethod`**
    annotation where we have set up the browser object. We are creating an instance
    of the **`webdrivermanager`** object and asking it to be set to chrome. In the
    **`@Test`** method, we have written the code to perform the login logout in our
    application. In this test, we have passed valid user login details. And finally,
    in the **`@AfterMethod`**, we wrote the code for the browser to close. We also
    used the TestNG Reporter method log to provide information in the result files
    based on whether test passed or failed. Let us see the **`Test.html`** file after
    the suite execution is completed. The following image gives us a snapshot of it.


    ![](images/Figure-8.12.jpg)


    **Figure 8.12:** Suite execution result file


    We need to understand here is that we used a **`testng.xml`** file, which is the
    suite file for executing the TestNG test. The suite XML file which we used is
    as follows:


    `<?xml version=``"1.0"` `encoding=``"UTF-8"``?>`


    `<suite parallel=``"false"` `name=``"Suite"``>`


    `<test name=``"Test"``>`


    `<classes>`


    `<class name``=``"testngfiles.loginLogoutWithTestNG"``/>`


    `</classes>`


    `</test> <!-- Test -->`


    `</suite> <!--Suite -->`


    In this **`testng.xml`** file, we can see that the name given to our test suite
    is **`Suite`**, and the name of the test is **`Test`**. Our test contains only
    one class file for execution, and we passed its name so that the code mentioned
    in the file, in order of the annotation, can get executed. So first, the code
    in **`@BeforeMethod`** will execute, then in the **`@Test`** method, and finally,
    **`@AfterMethod`** will execute.


    We need to understand here that based on our code structure, our test automation
    suite design, we can and should design our class files using proper annotations
    and use them in the test suite XML file. In our next section, we will see how
