    **Table 8.1:** TestNG annotations


    In the preceding table, we saw the various TestNG annotations, and a small description
    for each of them. Before we learn how to use them, we need to understand the TestNG
    suite XML file. A sample TestNG suite file look as follows:


    ```xml

    <suite name="RegressionSuite" verbose="1" >

    <test name="Chrome" >

    <classes>

    <class name="loginLogout" />

    </classes>

    </test>

    <test name="Regression">

    <classes>

    <class name="loginLogout"/>

    <class name="changeProfile"/>

    </classes>

    </test>

    </suite>

    ```


    As shown in the preceding XML file snippet, we have a `suite` tag as the root
    node. It can contain one or more than one `test` tag. A `test` tag contains the
    classes which are the Java `testng` class files created and will execute as we
    put the suite for execution. The suite `.xml` file follows the hierarchy shown
    in *[figure 8.10](#c08.xhtml_fig8_10)*.


    ![](images/Figure-8.10.jpg)


    **Figure 8.10:** TestNG hierarchy


    This image shows that the `suite` node is the root node, and it will contain at
    least one `test` node. A `test` node will contain at least one `class` node. The
    `class` contains information of the `testng` class file where the actual code
    for test is written for execution. In another structure of a suite file, we can
    also have group information mentioned. The group information states which class
    files need to be included or excluded for a test during execution. The sample
    suite file with group information will look as follows:


    ```xml

    <suite>

    <test name="Regression1">

    <groups>

    <run>

    <exclude name="regressionTest" />

    <include name="UITest" />

    </run>

    </groups>

    <classes>

    <class name="loginLogout"/>

    <class name="buyProduct"/>

    <class name="findOrders"/>

    </classes>

    </test>

    </suite>

    ```


    This sample suite file states the information about the groups which should be
    included during execution, and the ones which should be excluded. The group information
    is passed as a test method parameter information in the actual TestNG class file.
    A sample test method that contains group information will look as follows:


    ![](images/p129.jpg)


    The test method in the class file has available various parameters which can be
    passed to it. The following table lists and describes a few of them:


    | Parameter | Description |

    | :--- | :--- |

    | `dataProvider` | This parameter helps us the data provider name to the test,
    which helps in parameterizing the test. |

    | `dependsOnMethods` | Here, we can list all the methods on which execution the
    method will depend on. |

    | `groups` | A test method can be part of one or more groups. If the group is
    included in the TestNG file, the method will execute. If the group is excluded,
    the test method will not execute. |

    | `priority` | By default, the test methods execute in the alphabetical order
    of their names. If this is set, the lower priority test methods will execute first.
    |

    | `alwaysRun` | The test method will always run, even if the `dependsOnMethod`
    fails. |


    **Table 8.2:** Parameters of test method


    **Note: More information on the parameters are available on this link to explore:
    [https://testng.org/doc/documentation-main.html#annotations](https://testng.org/doc/documentation-main.html#annotations).**


    # Assertions in TestNG (#toc.xhtml_s71a)


    Assertions are a way to validate the steps which we have performed to understand
    if they work or do not work. If they work, we mark the test case as passed; else,
    we mark the test case as a failure. There is an inbuilt assertion module in TestNG,
    which has various methods that we can use in our script design to assert the actions
    we have done.


    **Note: The assertion methods which are available for TestNG are listed here:
    [https://www.javadoc.io/doc/org.testng/testng/latest/org/testng/asserts/Assertion.html](https://www.javadoc.io/doc/org.testng/testng/latest/org/testng/asserts/Assertion.html).**


    We will here see some of the methods from the preceding link, which we will be
    using in our scripts. As the scenario demands, we can choose other methods mentioned
    in the link.


    | Method | Description |

    | :--- | :--- |

    | `assertEquals(arg 1, arg 2)` | The `assertEquals` method takes various forms,
    where it compares different types of entities with the other. Here, the arguments
    passed could be integers, class objects, arrays, and so on. And this method returns
    true if the arguments are equal to each other. |

    | `assertNotEquals(arg1, arg2)` | The `assertNotEquals` method takes various forms,
    where it compares different types of entities with the other. Here, the arguments
    passed could be integers, class objects, arrays, and so on. And the method returns
    true if the arguments are not equal to each other. |

    | `assertNull(arg)` | This method returns true if the argument passed for the
    method is Null. |

    | `assertTrue(boolean condition, string message)` | If the condition evaluated
    returns true, the message will be printed. |

    | `fail(string message)` | This method will mark the test as fail and print the
    message. |


    **Table 8.3:** Assertion methods in TestNG


    We will use these methods in the scripts we design using TestNG to mark the test
    method as pass or fail.


    # Result and reporting in TestNG (#toc.xhtml_s72a)


    When a TestNG suite file `.xml` is executed, it generates three types of result
    files. These files carry the same information but are represented in different
    manners. The result is stored in the test-output folder, which generates after
    execution. The following image shows the folder structure which gets displayed
    in the project tree after you have refresh after the execution of the suite file.


    ![](images/Figure-8.11.jpg)


    The files that get generated when the TestNG suite executes, and their description
    is available as follows:


    | Result file name | Description |

    | :--- | :--- |

    | `index.html` | The `index.html` is a file available in the `test-output` folder.
    It contains minimal information about the suite file and the methods which have
    passed or failed in the file. The following image shows how this file looks like.![](images/Table-8.4A.jpg)
    |

    | `emailable-report` | The `emailable-report` file contains information in a tabular
    manner and displays the methods in rows. The methods which pass are marked as
    green, and those which have failed are marked as red. It also contains information
    for the execution time. The following image shows how the file looks like.![](images/Table-8.4B.jpg)
    |

    | `Test [html file]` | This result file is available in the `Suite` folder. The
    suite folder is created using the name for a suite, which we pass in the `testng.xml`
    file. By default, the name of the folder will be a suite, and the result HTML
    file name will be `Test.html`. The result file will be generated for every test
    inside the suite, and its name will be the name of the test. By default, the file
    which we will see will have the name `Test.html`. The file contains information
    about suite execution, start date and time, groups information, if any, and the
    method pass and fail status.![](images/Table-8.4C.jpg) |


    **Table 8.4:** Result files of TestNG

