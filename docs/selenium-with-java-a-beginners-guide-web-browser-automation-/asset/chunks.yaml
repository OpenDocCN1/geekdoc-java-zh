    在下一节中，我们将简要介绍处理 WebElement 对象时可能出现的异常类型。


    # Web Elements 中的异常


    在处理 Web 元素时，可能会遇到各种异常。最常见的异常是 `NoSuchElementElementException`。当我们尝试根据给定的定位器信息在网页上查找元素不存在时，就会产生此异常。另一个常见的
    Web 元素特定异常是 `StaleElementReferenceException`。当页面刷新且元素状态不再与可用的驱动会话关联时，就会遇到这个问题。另一个常见的是
    `ElementNotVisibleException`；这可以很容易追溯；如果我们查看元素的 HTML 属性，会发现它有一个被设为 true 的隐藏属性。此类元素的
    `isDisplayed()` 也会返回 false。


    **注意：关于 selenium 异常的更多细节可以在此处找到：[`www.selenium.dev/selenium/docs/api/py/common/selenium.common.exceptions.html`](https://www.selenium.dev/selenium/docs/api/py/common/selenium.common.exceptions.html)**


    # 关于 By 类


    在之前的节中，我们已经看到了可用的 WebDriver 对象方法和 WebElement 方法。使用这些方法，我们可以操作 Web 浏览器对象和页面的 Web
    元素。为了操作页面上看到的 Web 元素，我们首先需要在页面上唯一地识别它们。By 类有助于识别网页上的对象。它使用了不同的位置定位机制，根据这些机制可以识别不同的
    HTML 对象。每个 HTML 对象都是使用 HTML 标签和 HTML 属性定义的。每个 HTML 属性都要求带有一个与其关联的值。通过使用与 HTML
    属性相关的信息以及定位器机制的各种技术，我们可以在网页上唯一地识别该对象。一旦唯一地识别了对象，我们就可以对其执行操作。


    Selenium 允许识别对象的各种方式是使用 HTML 属性 `ID`、`NAME`。它还允许通过页面上的 XPATH 识别对象。我们还可以使用 CSS
    选择器方法，最后，我们可以使用 DOM 方法来识别页面上的对象。


    # By 类中的方法


    Selenium Java 文档网站列出了与 By 类相关的各种方法：


    | 方法 | 说明 |

    | :--- | :--- |

    | `static By className(java.lang.String className)` | 帮助通过 `class` 属性查找元素。 |

    | `static By cssSelector(java.lang.String cssSelector)` | 使用 `css` 策略查找元素。 |

    | `boolean equals(java.lang.Object o)` `WebElement findElement(SearchContext context)`
    | 返回找到匹配所用定位器的第一个元素。 |

    | `abstract java.util.List<WebElement> findElements(SearchContext context)` |
    查找所有匹配所用定位器的元素列表。 |

    | `static By id(java.lang.String id)` | 使用元素的 `id` 属性查找元素。 |

    | `static By linkText(java.lang.String linkText)` | 使用链接文本查找元素。 |

    | `static By name(java.lang.String name)` | 使用元素的 name 属性查找元素。 |

    | `static By partialLinkText(java.lang.String partialLinkText)` | 使用元素的部分链接文本值查找元素。
    |

    | `static By xpath(java.lang.String xpathExpression)` | 通过查找元素在 HTML 文档中的 xpath
    来查找元素。 |


    **表 3.4:** By 类方法


    # 理解定位器 (locators)


    让我们通过一个网页 HTML 代码段示例来理解定位器：


    ```html

    <form name="login" action="https://5elementslearning.dev">

    ```


    ### ID

    `id` 定位器是 HTML 元素的属性。例如，如果我们看前面的代码，可以看到一个登录按钮的 HTML，其中 HTML 元素有一个 id：


    ```html

    <button id="tdb5">Sign In</button>

    ```


    因此，要在页面上识别此按钮，我们可以轻松地使用 id 属性并像 `driver.findElement(By.id("tdb5"))` 那样创建一个定位器。


    ### NAME

    `name` 定位信息也从 HTML 元素获取。Name 与 HTML 元素关联的属性。例如，在前面的代码段中，我们看到一个邮箱框和一个密码框；对于这两者的识别，我们可以使用
    name 定位器。


    *   邮箱：`driver.findElement(By.name("email_address"))`

    *   密码：`driver.findElement(By.name("password"))`


    ### XPATH

    `xpath` 信息源于到达感兴趣 HTML 元素所经过的路径。它主要用于 XML 文档，但我们可以将 HTML 页面视为 XML 页面，然后创建到达所选元素的路径。xpath
    可以是两种类型：


    *   绝对 Xpath

    *   相对 Xpath


    创建绝对 xpath 的语法始终从根节点 HTML 开始，而相对路径则从节点本身或任何具有强识别标识的父节点开始。我们将这些节点称为地标节点（landmark
    nodes），它们具有 `ID` 属性或 `NAME` 属性。通过这些节点，我们可以创建到达我们想要操作的节点的路径。


    例如，邮箱框的相对 xpath 可以是：


    ```xpath

    //input[@name="email_address"]

    ```


    或者如果我们相对于包含邮箱地址的表单节点创建，它将是：


    ```xpath

    //form/table/tr[1]/td[2]/input

    ```


    '
- fmt: '

    The syntax of creating an xpath is - `//htmltag[@prop=value]`.


    And for absolute xpath is always from the html node - `/html/tag1/tag2/tag3…`.


    XPaths can also be created using a keyword `contains`. We can use any attribute
    or even text to create this xpath. For example, let us for the sign-in button,
    the xpath can be created as follows:


    ```

    Xpath=//*[contains(text,''Sign In'')]

    ```


    The xpath locator information created would be - `driver.findElement(By.xpath(“path”))`.


    ### CSS

    The `CSS` stands for the `Cascading Style Sheets`. These are used to help style
    the elements of the Web page. Instead of creating a style for every individual
    element, the `CSS` files are created, where for a tag type, a style is defined.
    We can use `CSS` to identify the object on the page. The syntax for creating a
    CSS is as follows:


    ```css=#id or css=htmltag[prop=value]

    ```


    ### DOM

    The document object model is what any HTML Web page is based on. It basically
    talks about the HTML `DOM` being in the form of a tree-like structure where every
    node is in a hierarchical relationship with the other node. Generally, an HTML
    `DOM` is represented as follows:


    ![](images/Figure-3.4.jpg)


    **Figure 3.4:** A HTML DOM


    To use the `DOM` information to identify the object of interest, we use the fact
    that all types of HTML tag types are allocated in the form of an array. And to
    identify a particular object of a certain HTML tag type, we can then use its position
    in the path to creating the locator information.


    So over and all, we need to understand that it is the same HTML code snippet that
    we have available for any HTML element. And by using the various Web technologies
    of HTML, XML, `xpath`, `css`, and `DOM`, we can create locators for the object
    for Selenium to consume and help us identify the object uniquely on the Web page
    on which action can take place.


    # Exception with the By class


    The exception which we can see when we use bad locators with the `By` class are
    as follows:


    - `InvalidSelectorException`: this exception is thrown when an xpath selector
    strategy is used to find an element, the xpath used is syntactically wrong.

    - `NoSuchAttributeException`: this exception is found when the attribute used
    could not be found for the element.

    - `ElementNotSelectableException`: this exception is found when the element we
    are trying to work with is disabled, even though it is present in the `DOM`.


