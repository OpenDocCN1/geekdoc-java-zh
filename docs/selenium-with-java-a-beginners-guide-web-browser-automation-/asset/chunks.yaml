    \ Grid](#toc.xhtml_c12)\n\nThe Selenium project consists of multiple projects.\
    \ One of the projects is Selenium Grid. Selenium Grid allows us to execute the\
    \ tests in parallel on different machines or instances of machines. The test automation\
    \ activity can be broken down into multiple stages: authoring, execution, scheduling,\
    \ reporting, and so on. The Selenium Grid is used in the execution stage. We can\
    \ set up either our own lab locally or on the cloud. Also, there are multiple\
    \ paid test automation on cloud solutions available, which are mainly built over\
    \ Selenium Grid. One of the well-known examples of test automation execution on\
    \ the cloud is Sauce Labs, which is built over Selenium Grid. The execution of\
    \ a test automation suite is mainly done on Selenium Grid. Many large and small\
    \ companies use it widely for running their tests in parallel. In this chapter,\
    \ we will learn about it.\n\n# [Structure](#toc.xhtml_s102a)\n\nSelenium Grid\
    \ is popularly used for the execution of a test automation suite where tests can\
    \ be executed in parallel on multiple instances of machines. It is one of the\
    \ projects of Selenium, like Selenium IDE and the Selenium WebDriver. Similarly,\
    \ Selenium Grid is a separate project in Selenium. It became extremely popular\
    \ when Google shared using Selenium grid internally for the execution of its test\
    \ automation suites of their internal projects. In this chapter, we will be covering\
