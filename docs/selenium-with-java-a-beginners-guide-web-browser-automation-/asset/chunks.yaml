    # CHAPTER 11


    # Introducing Maven


    In the previous chapter of the book, we have understood how we can use Selenium
    to automate the Web browser. We understood the various classes available in Selenium
    and the different methods in them, which allows us to handle the various types
    of HTML elements on the Web page. Using them, we can automate our actions to be
    done on a Web page. We have also understood that by default, Selenium does not
    come with any function set to manage data and provide validation to the actions.
    To create a proper test, we need to use a unit test framework like `junit` or
    `testng`. And to manage data, our approach depends on the type of data file and
    the programming language we are using. When we are creating a test automation
    solution, we have to understand we are creating a software artifact, and it needs
    a similar type of environment, practices and infrastructure that a software development
    project would require. To manage project-related documents and dependencies which
    are related to our test project, we will need to use a build management tool.
    There are various build management tools available, both free and paid. In this
    book, we will be looking at Maven as the build management solution.


    # Structure


    The chapter is divided into the following sections:


    *   Need for build management

    *   What is Maven

    *   Installing Maven in Eclipse

    *   Creating a simple Maven project

    *   What is Maven repository

    *   What is project object model


    # Objectives


    The process of creating a test automation solution using Selenium is similar to
    creating a complete software project. Being open-source and as a library to only
    automate the Web browser, we need other types of solutions available to manage
    our test-related activities. Each of these activities requires different types
    of executables to be made available both in the authoring test environment and
    execution test environment. A test automation solution, once created, can be used
    in various test environments to test the working of the application on different
    browsers, operating systems and other variable factors. For this reason, we require
    an effective build management solution. A solution that takes care of the project
    dependencies and is flexible enough to work with open-source software. The reason
    is that after every few years or maybe less, the open-source solution undergoes
    version change. And these version changes of the executables on which the working
    of our project is dependent can impact the implementation. Also, over a period
    of time, it becomes difficult to manage the various version of different types
    of solutions we have used to create our test automation project. For all this
    and more, we require Maven, an effective build management tool. Let us learn more
    about it in this chapter.


    # Need for build management


    As we work with open source technologies like Selenium, there is a need to use
    other software as well as to support our test automation build. These open-source
    artifacts undergo version changes. Because most of the used software in building
    a test automation solution is open source, there is no liability on the Selenium
    creators or other source solutions to provide any technical support to the end
    consumer. However, Selenium is a very popular and widely used solution and has
    wide community support and active group. But still, the management of your test
    automation build to always work is seamless is on us. Also, a test automation
    solution needs to work on various environments; managing dependencies becomes
    a challenge if they have fixed locations. So in these situations, a build management
    tool helps. A build management solution has all the features to manage the life
    cycle of a project being built. And with continuous forms of tests involved, it
    becomes easier to find out if there is any break in the build because of integration
    issues.


    Apache created Maven as an internal project, which they used it for the life cycle
    management of their solutions. Eventually, it was released as an open-source solution.
    We should note here that Maven is not the only build management solution; there
    are others, for example, ANT. But Maven is one of the most widely used solutions.
    To know more about Maven, we can visit the official page of it here: [https://maven.apache.org/](https://maven.apache.org/).


    # About Maven


    Maven is a project management tool that can manage the different life cycles of
    a project, all based on the project object model, which is effectively an XML
    file. It can be used to manage projects for different programming languages. It
    is similar to a build management tool called as ANT, but it is more advanced than
    it. Maven allows us to create a project, manage dependencies, help with testing
    and final project deployment. Its seamless integration with CI/CD tools also helps
    in the DevOps process. Maven allows the creation of a one-stop project object
    model to manage and maintain project dependencies which it fetches from the Maven
    repository. It also comes with support to various integration with reporting tools,
    based on its Surefire Plugin, which allows execution of the unit tests. Let us
    now understand how to install Maven and create a simple Maven project.


    # Installing Maven in Eclipse

