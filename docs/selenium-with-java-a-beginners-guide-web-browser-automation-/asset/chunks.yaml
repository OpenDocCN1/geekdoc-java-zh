    \ and the By class that helps in creating a locator to identify the element on\
    \ the page.\n\n# [Questions](#toc.xhtml_s18a)\n\n1.  What eclipse version have\
    \ we used here?\n\n2.  What Java version have we installed in this chapter?\n\n\
    3.  What is Photon with respect to Eclipse?\n\n4.  What is the name of the driver\
    \ for Firefox?\n\n5.  From where can one download the driver for Internet Explorer?\n\
    \n# [CHAPTER 3](#toc.xhtml_c03)\n\n# [WebDriver, WebElement, and By](#toc.xhtml_c03)\n\
    \nSelenium, the popular browser automating tool, has three main components: the\
    \ Selenium IDE, WebDriver, and the Grid. In this chapter, we will understand about\
    \ the three main important components of the WebDriver, which are the WebDriver\
    \ interface, WebElement interface, and the By class. Any script which we write\
    \ to automate the browser will use the methods available in these entities. The\
    \ WebDriver interface provides us with various methods to automate the browser\
    \ and fetch information associated with the Web page. The WebElement refers to\
    \ the HTML element on the page. This interface provides us with various methods\
    \ which help us to automate actions to handle different types of HTML elements.\
    \ And finally, the By class helps us create locator strategies to locate an element\
    \ on the Web page on which action can be performed.\n\n# [Structure](#toc.xhtml_s19a)\n\
    \nIn this chapter, we will discuss the following topics:\n\n*   WebDriver and\
    \ its purpose\n\n    *   Methods of WebDriver\n\n    *   WebDriver of three browsers\
    \ [IE, FF, Chrome]\n\n    *   Exceptions related to WebDriver\n\n*   WebElement\
    \ interface\n\n    *   Methods of WebElement\n\n    *   Exceptions with WebElement\n\
    \n*   About By class\n\n    *   Methods in By class\n\n    *   Understanding locators\n\
    \n    *   Exceptions related to By class\n\n# [Objectives](#toc.xhtml_s20a)\n\n\
    After studying this unit, you will be able to:\n\n*   Learn what is a WebDriver,\
    \ and use its methods to automate the browser.\n\n*   Understand what is WebElement,\
    \ and use its methods to work with Web elements on the Web page.\n\n*   Understand\
    \ the By class used for locator creation and the different types of locator strategies.\n\
    \n*   Set up browser drivers in the project.\n\n*   Understand the exceptions\
    \ we may encounter while using WebDriver, WebElement, and By.\n\n# [WebDriver\
    \ and its purpose](#toc.xhtml_s21a)\n\nWebDriver is the main interface that prepares\
    \ a contract to establish the rules for the browser to follow so that it gets\
    \ enabled for testing. The functionalities this interface focusses on are:\n\n\
    *   Controlling the browser\n\n    The WebDriver interface provides us with methods,\
    \ which help us in controlling browser-related actions, such as the opening of\
    \ a browser, the closing of the browser, managing browser window size, timeout\
    \ events, and more. As we will see in the next section, where we discuss methods\
    \ in more detail, we will see more about this.\n\n*   Selecting the Web elements\n\
    \n    The WebDriver interface provides two methods to look for the element or\
    \ a list of elements of interest. These methods are **`findElement`** and **`findElements`**,\
    \ which provide us with an element or a list of elements, respectively. Once the\
    \ Web element is identified, we can proceed with the action on it.\n\n*   Web\
    \ page information\n\n    The WebDriver interface provides us method which helps\
    \ in fetching the current title of the page, the current URL, and the content\
    \ available on the page. The information provided by these methods provides information\
    \ related to the Web page and can also be used for validation.\n\nIn the next\
    \ section, we will first understand how to set WebDrivers for different browsers.\
    \ After that, we will look at the list of methods available with the WebDriver\
    \ interface and their explanations. We will also see some implementation examples\
    \ to understand the working of the methods.\n\n# [Set browser drivers](#toc.xhtml_s22a)"
