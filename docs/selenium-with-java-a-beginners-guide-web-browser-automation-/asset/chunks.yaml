    Selenium 3.0 onwards as W3C added it into the regulations to be adopted by the
    browsers to be compatible with Selenium, the onus of providing the drivers so
    that Selenium can talk to you fell on the browsers corporations. So now, Chrome
    has to provide `Chrome driver`, Internet Explorer has to provide `Internet Explorer
    driver`, and Firefox provides `geckodriver`.


    In an ideal situation, one should have the latest browser version available on
    the system and then download the compatible driver version available with it.
    Or with respect to the browser version available on your system, you can check
    which driver version will be suitable and download that accordingly.


    So, first of all, create a folder in your system on which you have reading and
    writing rights. In that folder, we will be downloading the three different driver
    executables from the respective websites hosting them.


    | Browser | Version | Driver—URL—Download |

    | Chrome | Chrome Version 83 | [https://chromedriver.chromium.org/downloads](https://chromedriver.chromium.org/downloads)
    |

    | Firefox | Geckodriver V0.26.0 | [https://github.com/mozilla/geckodriver/releases](https://github.com/mozilla/geckodriver/releases)
    |

    | Internet Explorer | IEDriverServer 3.150.1 | [https://www.selenium.dev/downloads/](https://www.selenium.dev/downloads/)
    |


    **Table 3.1:** Three different driver executables


    Once these executables are downloaded, extract them from their files, and you
    will find the respective `.exe` files, add them to some folder location like for
    us; it is `driverexes` in the project folder.


    The following image shows the driver executables available in the project:


    ![](images/Figure-3.1.jpg)


    **Figure 3.1:** Driver executables for browsers


    Let us see the usage of these WebDriver executables to launch browsers Chrome,
    Firefox, and Internet Explorer, respectively.


    Script to launch Chrome Browser with Application URL:


    ![](images/p40.jpg)


    As we can see in the preceding script, the command:


    ```java

    System.setProperty("webdriver.driver.chrome", driverexes\\chrome driver.exe")

    ```

    provides the information where `chromedriver.exe` file is available in the system
    location.


    The next command—`WebDriver driver = new ChromeDriver();` create an instance of
    the `ChromeDriver`. We should note here for this statement to work; it is important
    that we have imported the correct libraries in the code file:


    ```java

    import org.openqa.selenium.*;

    import org.openqa.selenium.chrome.*;

    ```


    The next step is to use the `get()` method to launch the Chrome browser using
    the URL for the application under test—[http://practice.bpbonline.com/](http://practice.bpbonline.com/).
    After that, we wait for 5 seconds using `Thread.sleep(5000)` command. And then
    we use the `driver.close()` command to close the browser which is opened.


    In the same manner, if we want to launch the Firefox browser, we will be importing
    the library for geckodriver, and providing the path to the geckodriver executable
    file. The script is as follows:


    ![](images/p41.jpg)


    The script preceding launches Firefox browser with the application URL and then
    closes it. We need to note that it uses the `geckodriver` executable file, which
    is already available in the `driverexes` folder of the project.


    Now for launching Internet Explorer, we will be using the Internet Explorer driver
    executable and will import the respective library to work with Internet Explorer
    browser.


    ![](images/p41a.jpg)


    The script preceding launches the Internet Explorer browser with the application
    URL, and then closes it. We need to note that it uses the `geckodriver` executable
    file, which is already available in the `driverexes` folder of the project.


    In the next section, we will list out the various methods of the WebDriver, and
    see a few script snippets to understand the working of these to automate the browser
    functions.


    # Methods of WebDriver


    The methods associated with WebDriver are written for the browser object. The
    interface functions are provided for the browser object. Classes such as `ChromeDriver`,
    `FirefoxDriver`, and other browser driver classes implement the `WebDriver` interface,
    and thus, when we create an instance of the respective browser driver class, we
    are able to access the methods.


    Let us have a look at the methods listed in the following table:


    | Method | Purpose |

    | :--- | :--- |

    | `get()` | This function is used to open the browser with the given URL in the
    function. |

    | `navigate()` | This function is used to navigate to the page provided in the
    function. |

    | `close()` | This function is used to close the current browser window open with
    the browser session. |

    | `quit()` | This function is used to close all the browser windows opened with
    the browser session. |

    | `switchTo()` | This function is used with the browser object to switch to a
    new window, alert, or frame. |

    | `getTitle()` | This function returns the text of the current title. |

    | `getCurrentUrl()` | This function returns the current URL of the page. |

    | `getWindowHandle()` | This function returns the current window id of the page.
    |

    | `getWindowHandles()` | This function returns all the window ids which are generated
    for the Web pages associated with the current driver session. |

    | `manage()` | This function has multiple utilities. It allows browser windows
    to maximize, minimize. It also helps in implicit time management, and so on. |

    | `findElement()` | This function returns the first element found with the provided
    locator strategy used. |

    | `findElements()` | This function returns all the elements matched for the given
    locator strategy. |


    **Table 3.2:** Methods of WebDriver


    We will be looking at the preceding mentioned methods based on the broad classification
    of actions they will be performing on the browser.


    # Controlling the browser


    The methods which we will be looking in for the browser control are `get()`, `close()`,
    `quit()`, `switchTo()`, and `manage()`. We will be looking at code snippet for
    these and take them as examples. As we know, the `get()` method allows the opening
    of the browser with the given URL. The `close()` method closes the current browser
    instance opened. The `quit()` method closes all the windows which are opened using
    the current driver, and then `navigate()` method allows us to go to another Web
    URL. The `manage()` methods have other sub-methods; we will see the usage of it
    to maximize the browser, for example. Let us have a look at the code snippet where
    we try these. Please note that the difference between close and quit is handled
    in the chapter Extra Concepts, where we discuss about the `switchTo()` method
    of the browser in detail to handle a popup, a frame, or a new window. For now,
    let us look at some of the methods for browser manipulation:


    ![](images/p43.jpg)


    In this code, we see the get method to launch the browser with the URL; the code
    `manage().window().maximize()`, will maximize the browser window. The next command
    will navigate to the Selenium main website, and finally, `driver.close()` will
    close the browser. In the next section, we will modify the preceding script to
    add some methods which can help `iprint` Web page-related information like title,
    `currenturl`, and page content.


    # Web page information methods


    The Web page information method are `getCurrentUrl()`, `getPageSource()`, and
    `getTitle()`. These methods will give Web page-related information, which we can
    use to find out if we are on the correct page on which we want to continue actions.
    These methods also allow us to perform text-based validation, where we search
    for text on the Web page content. Let us look at the following code snippet:


