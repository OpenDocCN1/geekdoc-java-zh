    \ very popular among the testers. An Excel file is associated with a workbook.\
    \ An Excel workbook is associated with worksheets. An Excel worksheet contains\
    \ rows and columns. An intersection of row and columns make a cell. And it is\
    \ here in the cell that the data is read from or written to. So, if we look at\
    \ the following hierarchy for the Excel file, it will become easy for us to understand\
    \ the Excel object that is used by the programming languages to manage them. Let\
    \ us look at the following diagram:\n\n![](images/Figure-10.11.jpg)\n\n**Figure\
