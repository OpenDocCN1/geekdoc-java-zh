    ## Create and register windows machine node with Chrome browser


    To register the node for the Chrome browser, for the windows machine running locally
    we will be doing the following steps:


    1. Download the Chrome driver, as per the Chrome browser version available on
    the system. Use the URL—`[https://chromedriver.chromium.org/](https://chromedriver.chromium.org/)`.


    2. The next step is to create a node, for which we will first have to open the
    command prompt, change the directory to the location of the Selenium server, and
    type the following command:


    ```

    java -Dwebdriver.chrome.driver="chromedriver\chromedriver.exe" -jar selenium-server-standalone-3.141.59.jar
    -role node -hub http://localhost:4444/grid/register -browser "browserName=chrome"
    -port 5557

