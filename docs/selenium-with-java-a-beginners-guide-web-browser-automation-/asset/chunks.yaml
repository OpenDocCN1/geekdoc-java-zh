    \ alert box type of popup.\n\n```\nimages/p94.jpg)![](images/p95.jpg)\n```\n\n\
    Let us now work with the `Confirm` box type of popup. The following steps will\
    \ be done for the `Confirm` box:\n\n1. Launch the Web application on Chrome using\
