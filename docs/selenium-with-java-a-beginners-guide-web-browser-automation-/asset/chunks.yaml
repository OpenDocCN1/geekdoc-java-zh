    One of the most commonly used data management ways is to put data in a CSV file.
    CSV stands for comma-separated values. A CSV file will have data separated using
    commas, or it can also be any other separator like a tab. An example of a CSV
    file is as follows:


    ![](images/Figure-10.1.jpg)


    **Figure 10.1:** CSV file Example'
