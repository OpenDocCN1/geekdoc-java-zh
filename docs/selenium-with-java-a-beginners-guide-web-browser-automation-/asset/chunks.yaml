  trans: "\n\n我们可以将 Maven 作为插件安装在 eclipse IDE 中。要执行此操作，我们将采取以下步骤：\n\n1. 打开 Eclipse\
    \ IDE。\n\n2. 我们需要点击 `Help` 并选择 `Install New Software…`，如图所示：\n\n   ![](img/Figure-11.1.jpg)\n\
    \n   **图 11.1:** 安装 Maven\n\n3. 此时会弹出一个新窗口，我们在其中输入下载 Maven 的链接。该链接如下：[`download.eclipse.org/technology/m2e/releases/latest/`](https://download.eclipse.org/technology/m2e/releases/latest/)\n\
    \n   ![](img/Figure-11.2.jpg)\n\n   **图 11.2:** Eclipse 的 Maven 集成\n\n4. 我们现在必须点击\
    \ `Next` 按钮以允许安装。它将显示一个接受许可协议的页面。点击 `I accept`。\n\n   ![](img/Figure-11.3.jpg)\n\
    \n   **图 11.3:** 许可协议\n\n5. 点击 `Finish` 按钮完成安装。这可能需要一些时间。\n\n安装完成后，我们应该能够创建一个\
    \ Maven 项目。\n\n# 创建 Maven 项目\n\n要使用 Maven 创建项目，我们必须先在 Eclipse 中创建一个 Maven 项目。让我们来看下执行此操作的步骤：\n\
    \n1. 转到 `File`，选择 `New`，并从中选择 `Project…`：\n\n   ![](img/Figure-11.4.jpg)\n\n \
    \  **图 11.4:** 创建项目\n\n2. 这将打开一个 `New Project` 向导。从那里，选择 `Maven` 并点击 `Maven Project`。\n\
    \n   ![](img/Figure-11.5.jpg)\n\n   **图 11.5:** 创建 Maven 项目\n\n3. 点击 `Next` 按钮，并勾选复框以创建一个简单项目并跳过模板（archetype）选择。\n\
    \n   ![](img/Figure-11.6.jpg)\n\n   **图 11.6:** 简单项目模板\n\n4. 当我们点击 `Next` 按钮时，我们将看到创建一个新\
    \ Maven 项目的弹出窗口：\n\n   ![](img/Figure-11.7.jpg)\n\n   **图 11.7:** Maven 项目配置\n\
    \n   在 figure 11.7 中，我们需要提供一些重要信息，解释如下：\n\n   * **Group Id**: 创建项目的公司/域或组的名称。类似于\
    \ Java 包。我们提供的是 `org.bpb.com`。\n\n   * **Artifact Id**: 将给项目的名称。我们提供的名称是 `demoMavenProject`。\n\
    \n5. 其余字段可以留空。我们点击 `Finish` 按钮。\n\n   ![](img/Figure-11.8.jpg)\n\n   **图 11.8:**\
    \ Group ID 和 Artifact ID\n\n6. 当我们点击 `Finish` 时，我们可以看到创建的 Maven 项目，根据项目需求，我们可以为其添加文件。\n\
    \n   ![](img/Figure-11.9.jpg)\n\n   **图 11.9:** Maven 项目树\n\n# 什么是 Maven 仓库？\n\
    \nMaven 仓库是存放各种类型构建产物和依赖项的地方。Maven 仓库的位置可以是本地的或远程的，所有依赖项都存储在那里。在本章，我们将看到 Maven\
    \ 中央仓库，这是一个由 Maven 社区提供的仓库。它包含了大量常用的库。要访问它，我们将使用这个链接：[`mvnrepository.com/`](https://mvnrepository.com/)\n\
    \n   ![](img/Figure-11.10.jpg)\n\n   **图 11.10:** Maven 仓库\n\n例如，如果我们搜索 Selenium，我们将看到这些：\n\
    \n   ![](img/Figure-11.11.jpg)\n\n   **图 11.11:** Maven 中的 Selenium 依赖 JAR 包\n\
    \n我们可以选择 Selenium 中任何可用的构建，并将依赖信息复制到 `pom.xml` 中。对于本书使用的 Selenium 版本 3.141.59，其依赖信息如下：\n\
    \n   ![](img/Figure-11.12.jpg)\n\n   **图 11.12:** Selenium 依赖 XML\n\n# 什么是项目对象模型（POM）？\n\
    \n项目对象模型（Project Object Model）是每个 Maven 项目包含的一个 XML 文件。它是 Maven 中基本的的工作单元。它包含了关于项目、依赖项以及构建\
    \ Maven 项目所需的任何配置信息。在我们创建 Maven 项目时，就会创建 `pom.xml`。\n\n任何 pom 文件将包含的最基础信息如下：\n\
    \n   ![](img/Figure-11.13.jpg)\n\n   **图 11.13:** 默认 POM.xml\n\n让我们查看项目的 `pom.xml`，我们可以在项目树中看到它。\n\
    \n   ![](img/Figure-11.14.jpg)\n\n   **图 11.14:** 默认 POM.xml 文件\n\npom.xml 包含一个\
    \ `dependencies` 标签，其中包含多个 `dependency` 标签。每个 `dependency` 标签包含依赖项的 `groupId`、`artifactId`\
    \ 和 `version`。\n\n```xml\n<dependencies>\n    <dependency>\n        <groupId>org.seleniumhq</groupId>\n\
    \        <artifactId>selenium-java</artifactId>\n        <version>3.141.59</version>\n\
    \    </dependency>\n</dependencies>\n```\n\npom.xml 还包含一个 `build` 标签，用于配置项目的插件。\n\
    \n```xml\n<build>\n    <plugins>\n        <plugin>\n            <groupId>org.apache.maven.plugins</groupId>\n\
    \            <artifactId>maven-compiler-plugin</artifactId>\n            <version>3.8.1</version>\n\
    \        </plugin>\n    </plugins>\n</build>\n```\n\npom.xml 还包含一个 `properties`\
    \ 标签，用于定义在整个 pom 中使用的变量。\n\n```xml\n<properties>\n    <maven.compiler.source>1.8</maven.compiler.source>\n\
    \    <maven.compiler.target>1.8</maven.compiler.target>\n</properties>\n```\n\n\
    pom.xml 还包含一个 `parent` 标签，用于从父项目继承配置。\n\n```xml\n<parent>\n    <groupId>org.apache.maven</groupId>\n\
    \    <artifactId>maven-starter-parent</artifactId>\n    <version>2.4.0</version>\n\
    </parent>\n```\n\npom.xml 还包含一个 `dependencyManagement` 标签，用于定义项目依赖项的版本。\n\n```xml\n\
    <dependencyManagement>\n    <dependencies>\n        <dependency>\n           \
    \ <groupId>org.seleniumhq</groupId>\n            <artifactId>selenium-java</artifactId>\n\
    \            <version>3.141.59</version>\n        </dependency>\n    </dependencies>\n\
    </dependencyManagement>\n```\n\n"
- fmt: "\nThe objective of this chapter is to understand about Selenium Grid. As mentioned\
    \ earlier, Selenium Grid is one of the projects of Selenium and is used to execute\
    \ tests in parallel on multiple instances of machines. This basically means that\
    \ we can run a test on various machine browser combinations in parallel at the\
    \ same time. Let us look at the sections of this chapter to understand more.\n\
    \n# What is Selenium Grid\n\nSelenium Grid is one of the projects of Selenium,\
    \ which allows execution of the tests in parallel on multiple instances of machine\
    \ browser combinations. Selenium Grid consists of two components, a hub and a\
    \ node, which are used to set up the grid. Both hub and node are set up using\
    \ the Selenium server, a component of the Selenium project. By setting up the\
    \ grid, we allow the tests to run in parallel on various machine browser instances.\
    \ Let us understand the two main components of the grid and how they are used\
    \ to allow the execution of tests in parallel. The following diagram provides\
    \ us with an insight:\n\n![](images/Figure-12.1.jpg)\n\n**Figure 12.1:** Grid\
    \ representation\n\n# Components of Selenium Grid\n\nA Selenium grid consists\
    \ of a node and a hub. And using them, we are able to execute tests in parallel.\
    \ Let us define them:\n\n* **Node**: a node is a machine browser instance on which\
    \ the actual test execution will take place. A node could be a windows machine\
    \ on which edge the browser is running. Or a node could be a mac machine on which\
    \ the Safari browser is running. We need to understand here that a machine could\
    \ also be a virtual machine on the cloud.\n* **Hub**: a hub is a central component\
    \ that is created by running the Selenium server using the flag—hub. A hub receives\
    \ all the requests for the execution of the test. Based on the request received\
    \ and the node registered with it, the hub sends the request to the node for the\
    \ execution of the test. The actual execution of the test takes place on the node.\n\
    \nIn this chapter, we will see the creation of a test script, and executing it\
    \ on two different browsers at the same time, in a local machine.\n\n# Executing\
    \ tests in local environment using Selenium Grid\n\nTo understand the working\
    \ of a Selenium Grid, we will take an example in this chapter. We will create\
    \ a test script and execute it on the local machine on two different browsers\
    \ Firefox, and Chrome, at the same time. To achieve this, we will be performing\
    \ the steps as follows:\n\n1. Set up the hub on the local machine.\n2. Create\
    \ and register windows machine node with Firefox browser.\n3. Create and run the\
    \ test script using Selenium Grid on Firefox browser.\n4. Create and register\
    \ windows machine node with Chrome browser.\n5. Create and run the test script\
    \ using Selenium Grid on Chrome browser.\n6. Execute test using `testng` suite\
    \ file in parallel on both browsers.\n\nBefore we see the implementation of these\
    \ steps, we should have an available Selenium server, which would be used for\
    \ both hub and node. To download the Selenium server, we have to use this URL—[https://github.com/SeleniumHQ/selenium/releases/download/selenium-3.141.59/selenium-server-standalone-3.141.59.jar](https://github.com/SeleniumHQ/selenium/releases/download/selenium-3.141.59/selenium-server-standalone-3.141.59.jar).\n\
    \nPlease note that as of writing this book new Selenium release is available,\
    \ which is Selenium 4.0. And the grid part of the release is entirely changed.\
    \ The Selenium Grid version we are using in this book is 3.141.59. Save the downloaded\
    \ JAR file in a location on your system. We will be using these JAR files to create\
    \ the hub and the node.\n\n## Set up the hub on the local machine\n\nThe first\
    \ step in setting the Selenium Grid is to start the hub. Let us do it by following\
    \ these steps:\n\n1. Open the command prompt, and go to the directory where the\
    \ Selenium server JAR file is downloaded:\n   ![](images/Figure-12.2.jpg)\n  \
    \ **Figure 12.2:** Change directory\n\n2. Start the hub by using the following\
    \ command:\n   ```\nd:\\> java -jar selenium-server-standalone-3.141.59.jar -role\
    \ hub\n   ```\n   ![](images/Figure-12.3.jpg)\n   **Figure 12.3:** Starting hub\n\
    \n3. The next step is to open the following URL on the browser to check if the\
    \ hub is launched.\n   URL—`http://localhost:4444/grid/console`\n\n   If launched,\
    \ you should be able to the following screen:\n   ![](images/Figure-12.4.jpg)\n\
    \   **Figure 12.4:** Hub page\n\nAfter launching the hub, we will create a node\
    \ of the windows machine with Firefox browser. We will have to register it to\
    \ the hub, which is also running locally. We need to note here that the default\
    \ port the hub listens to is `-4444`, and if we want, we can change the port by\
    \ using the port flag and passing the port number.\n\n## Create and register windows\
    \ machine node with Firefox browser\n\nTo register a windows machine with a Firefox\
    \ browser node, we will do the following steps:\n\n1. Download the correct version\
    \ of the geckodriver on the system, based on the Firefox version you have on the\
    \ system. To download geckodriver, use the link—[https://github.com/mozilla/geckodriver/](https://github.com/mozilla/geckodriver/).\n\
    2. Open the command prompt and go to the directory where the Selenium server JAR\
    \ file is downloaded:\n   ![](images/Figure-12.5.jpg)\n   **Figure 12.5:** Change\
    \ directory\n\n3. Start the node, using the following command:\n   ```\n   java\
    \ -Dwebdriver.driver=\"geckodriver.exe\" -jar selenium-server-standalone-3.141.59.jar\
    \ -role node -hub http://localhost:4444/grid/register -browser \"browserName=firefox\"\
    \ -port 5556\n   ```\n   ![](images/Figure-12.6.jpg)\n   **Figure 12.6:** Start\
    \ node\n\nLet us understand this command before we proceed further:\n- `-Dwebdriver.driver=\"\
    geckodriver.exe\"` (this provides the path where geckodriver is available on the\
    \ system)\n- `-jar selenium-server-standalone-3.141.59.jar -role node` (this starts\
    \ the selenium server in the role node)\n- `-hub http://localhost:4444/grid/register`\
    \ (this provides the point to the hub location to which the node will get.)\n\
    - `-browser \"browserName=firefox\" -port 5556` (this provides the information\
    \ about the browser, and the port on which the node will be listening)\n\n4. To\
    \ check if the node is registered to the hub, we will just refresh the page of\
    \ the hub, which was opened using the URL—`http://localhost:4444/grid/console`\n\
    \   ![](images/Figure-12.7.jpg)\n   **Figure 12.7:** Hub with Firefox node\n\n\
    # Create and run the test script using Selenium Grid on Firefox browser\n\nTo\
    \ create and run the test script on Selenium grid using the Firefox browser, we\
    \ will have to create an instance of the `RemoteWebDriver`, instead of the `WebDriver`.\
    \ And as we create the instance of the remote WebDriver, we will also be using\
    \ the `DesiredCapabilities` class to pass the browser information as Firefox.\
    \ Let us see the following code snippet for it:\n\n![](images/p194.jpg)\n\nIn\
    \ this code snippet, as we can see, we create the `DesiredCapabilities` object\
    \ for the Firefox browser. This is passed to the `RemoteWebDriver` instance created.\
    \ The instance also takes the location of the hub. Please note that the location\
    \ of the hub here is `localhost:4444`. This means that the hub is running locally\
    \ on port `4444`. If our hub is running on a different machine instance, we will\
    \ pass the information of that machine URL and the port address on which the hub\
    \ is running. Once the driver instance is created, the rest of the script remains\
    \ the same. So, when we execute the script, the request will be sent to the hub.\
    \ The hub will then pass on the request to the node, on which the actual execution\
    \ as per the test script will take place.\n"
