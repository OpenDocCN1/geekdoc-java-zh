    这种丰富的功能集在以前很罕见，在目前许多可用的 Web 应用程序商业、免费和开源测试自动化解决方案中仍然很罕见。另一个原因是开源工具提供的灵活性。它们天生就具有根据你的项目需求进行调整的能力，而不是强让你在工具的严苛边界内进行调整。此外，获取
    `Selenium` 的成本为零。该工具是免费提供的。`Selenium` 变得广泛流行的的最重要因素之一是其背后强大的用户社区，该社区仍然非常活跃，可以在此处找到——`https://groups.google.com/forum/#!forum/selenium-users`


    # Selenium 的组件


    Selenium 目前有三个主要组件，旨在解决以下三个重要标准：


    * Selenium IDE

    * Selenium WebDriver

    * Selenium Grid


    下表解释了每个组件的作用：


    | 组件 | 用途 |

    | :--- | :--- |

    | Selenium IDE | 它主要用于录制和回放。当前版本的 `selenium ide` 可以同时用于 Firefox 和 Chrome 浏览器。当前版本的
    `Selenium IDE` 由 `Applitools` 组织支持，其开发和维护最重要的贡献者是 `Dave Haeffner`。关于他以及 `Applitools`
    的更多信息请在此处——[`applitools.com/blog/team-dave-haeffner/`](https://applitools.com/blog/team-dave-haeffner/)
    |

    | Selenium WebDriver | 该组件像真实用户/人员一样与浏览器交互，无论浏览器是在本地系统还是远程系统。使用此组件，我们必须使用适用于不同编程语言的客户端库，如
    `Java`、`Ruby`、`Perl`、`Python`、`C#` 等。我们的程序使用这些语言编写，这些语言包含了我们想要浏览器执行的命令。与浏览器相关的
    `WebDriver` 自动化浏览器，我们获得结果。编写本书时，当前的稳定版本为 `3.141.59`。 |

    | Selenium Grid | 该组件允许并行执行测试。它使用了 `Selenium` 的 `selenium remote control` 组件，然后我们将其设置为两种模式：`hub
    mode`（中心模式）和 `node mode`（节点模式）。这允许我们同时在不同的节点上并行运行不同的测试。 |


    **表 1.1:** Selenium 组件的用途


    # Selenium 背后的人


    Selenium 背后有很多人；确切地说，它是一个很好的范例，由社区驱动和维护，而不是由他们推广。它于 2004 年由 `Jason Huggins` 在
    `ThoughtWorks` 组织作为一个工作项目开始，并已向世界开源。关于其使用、适配以及它所经历的各种形态的良好历史，可以在此处查看 [`www.selenium.dev/history/`](https://www.selenium.dev/history/)。


    `Selenium IDE` 最初由日本的 `Shinya Kasatani` 创建，后来被 `ThoughtWorks` 的 `Mike Williams`
    接手，现在该项目由 `Applitools` 组织、`Dave Haeffner` 以及团队支持并维护。


    Google 开始在内部使用 `selenium grid` 并在 `GTAC` 会上公布了这一点；这是由 `Jennifer Bevan` 完成的，她最终成为了
    `Selenium` 项目的贡献者之一。`Haw-Bin Chai` 是 `Selenium` 中 `locators UI-Elements` 概念背后的人。我们现在也知道
    `Simon Stewart`，他是 `WebDriver` 的想法，现在是我们所知的 Selenium 的奠父。


    # 结论


    在本章中，我们介绍了 `Selenium` 这一用于 Web 浏览器自动化工具。我们看到了与其相关的不同组件以及与其开发相关的不同人员。我们还理解了它如此流行的原因。在接下来的章节中，我们将讨论
    `Java` 中的 `Selenium API`。


    # 问题


    1. Selenium 是一个工具还是多个工具组合在一个名称下？

    2. 目前可用的 Selenium 稳定版本是什么？

    3. 当 `Jason Huggins` 在 `ThoughtWorks` 工作创建它时，Selenium 被称为什么名字？

    4. `Selenium IDE` 在 Chrome 和 Firefox 上都能工作。对还是错？

    5. 为什么 Selenium 流行？


    # 第 2 章


    ## 准备被测系统和应用程序


    在本章中，我们将在系统上安装 IDE `eclipse`。我们将仅采用 `Windows` 系统。在将 `eclipse` 设置为脚本集成开发环境后，我们将在项目中设置
    `Selenium jar` 文件，以便当我们使用 `Java` 作为语言编写程序时，我们的环境能够解析它们。在浏览器中运行测试之前，我们还需要为相应的浏览器设置驱动程序，因此在本章中，我们将学习这一点。在接下来的章节中，我们还将看到如何创建一个
    `Maven` 项目并使用它在运行时管理依赖项。但目前，我们将采用前述的方法。


    在本章中，我们还将看到将用于探索 `Selenium` 的应用程序。我们将查看提供的一些场景。此外，我们还将探索其他 Web 应用程序，我们将使用这些应用程序的场景来理解
    `Selenium` 的概念。


    # 结构


    在本章中，我们将讨论以下主题：


    * 在系统上设置正确的 `eclipse` 版本

    * 创建 `Java` 项目

    * 设置 `Selenium jars`

    * 设置浏览器驱动程序

    * `BPB` 应用程序流程演示

    * 了解其他用于练习的应用程序


    # 目标


    学习本单元后，你应该能够：


    * 安装 `eclipse`

    * 创建 `Java` 项目

    * 如何添加 `Selenium jars`

    * 如何设置浏览器驱动

    * `BPB` 应用程序演示

    * 了解其他应用程序


