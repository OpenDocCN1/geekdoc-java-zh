- fmt: "\nOnce you set up the path to your workspace and click on the `Launch` button,\
    \ it will take you to the welcome screen, which we will be closing to move forward\
    \ to create our new Java project.\n\n![](images/Figure-2.3.jpg)\n\n**Figure 2.3:**\
    \ Eclipse welcome screen\n\n# Create new Java project\n\nTo create a new Java\
    \ project in eclipse, we will click on the `File` menu, select `New`, and then\
    \ `Java Project`:\n\n![](images/Figure-2.4.jpg)\n\n**Figure 2.4:** Create new\
    \ Java project\n\nWe provide the name of the project and select the JRE version.\
    \ Please note it is possible to have more than one Java version available on the\
    \ system, as well as have more than one eclipse version available on the system.\n\
    \n![](images/Figure-2.5.jpg)\n\n**Figure 2.5:** Project details\n\nClick on Next,\
    \ and then click on the Finish button. This will take you to a screen where you\
    \ will see `ProjectWork` in your Package Explorer window on the left side, which\
    \ one can expand.\n\nThe next part is to create a new package and create a `helloWorld.java`\
    \ program to check all settings. For this, right-click on the `src` folder, and\
    \ create a new package. Name it `packageHello`. Then right-click on the package\
    \ and select new class, fill in the details. Provide a name as `helloWorld`, and\
    \ select the main method.\n\n![](images/Figure-2.6.jpg)\n\n**Figure 2.6:** Hello\
    \ World java file creation\n\nClick on `Finish`.\n\nOn the right side of the package\
    \ explorer window, where the `helloWorld.java` file is opened. A code snippet\
    \ will be automatically generated. There we will write a code line inside the\
    \ main method to print hello world on the console window. The final code would\
    \ look as follows:\n\n```java\npackage packageHello;\n\npublic class helloWorld\
    \ {\n    public static void main(String[] args) {\n        // TODO Auto-generated\
    \ method stub\n        System.out.println(\"Hello World\");\n    }\n}\n```\n\n\
    The output of this program is—we see `Hello World` printed on the console window.\n\
    \n# Adding Selenium jars\n\nThe next step in our project is now to add the Selenium\
    \ jar files. We will go to the URL—[https://www.selenium.dev/downloads/](https://www.selenium.dev/downloads/),\
    \ scroll down to the Selenium client and WebDriver language bindings. The current\
    \ beta release available is version 3.141.59, which we will download.\n\n![](images/Figure-2.7.jpg)\n\
    \n**Figure 2.7:** Selenium Java client libraries\n\nOnce we download the ZIP file\
    \ in our system, we will extract the jars available in them. These jar files now\
    \ have to be added to our Java project in eclipse. For this, we will perform the\
    \ following steps:\n\n1. Right-click the Java project and select `Properties`.\n\
    \n   ![](images/Figure-2.8.jpg)\n\n   **Figure 2.8:** Project properties\n\n2.\
    \ Next is select `Java Build Path | Libraries | Add External Jars`, then traverse\
    \ to the path in the system folder, where you have extracted the Selenium jars.\n\
    \n   ![](images/Figure-2.9.jpg)\n\n   **Figure 2.9:** Adding Selenium jars\n\n\
    3. Select the two jars available outside, then go inside the `lib` folder and\
    \ add all the jars available in that folder to the project.\n\n   ![](images/Figure-2.10.jpg)\n\
    \n   **Figure 2.10:** Selenium jars\n\n4. Once all jars are added, our project\
    \ is now ready to accept the Java programs written with Selenium commands.\n\n\
    5. But before we write any Selenium commands to drive the browsers, we should\
    \ be ready with the respective drivers for our three browsers: Internet Explorer,\
    \ Firefox, and Chrome, to drive them with commands of our choice.\n\n# Set browser\
    \ drivers\n\nSelenium 3.0 onwards as W3C added it into the regulations to be adopted\
    \ by the browsers to be compatible with Selenium, the onus of providing the drivers\
    \ so that Selenium can talk to you fell on the browsers corporations. So now,\
    \ chrome has to provide a Chrome driver, Internet Explorer has to provide an Internet\
    \ Explorer driver, and Firefox provides geckdriver, which in the Selenium 2.0\
    \ series were maintained and provided by the good people at Selenium.\n\nIn an\
    \ ideal situation, one should have the latest browser version available on the\
    \ system and then download the compatible driver version available with it. Or\
    \ with respect to the browser version available on your system, you can check\
    \ which driver version will be suitable and download that accordingly.\n\nSo,\
    \ first of all, create a folder in your system on which you have reading and writing\
    \ rights. In that folder, we will be downloading the three different driver executables\
    \ from the respective websites hosting them.\n\n| Browser | Version | Driver—URL—Download\
    \ |\n| :--- | :--- | :--- |\n| Chrome | Chrome version 83 | [https://chromedriver.chromium.org/downloads](https://chromedriver.chromium.org/downloads)\
    \ |\n| Firefox | Geckdriver v0.26.0 | [https://github.com/mozilla/geckodriver/releases](https://github.com/mozilla/geckodriver/releases)\
    \ |\n| Internet Explorer | IEDRiverServer 3.150.1 | [https://www.selenium.dev/downloads/](https://www.selenium.dev/downloads/)\
    \ |\n\n**Table 2:** Browser drivers\n\nOnce these executables are downloaded,\
    \ extract them from their files, add them to some location like `.exe` files,\
    \ and so on. Add this folder to the project:\n\n![](images/Figure-2.11.jpg)\n\n\
    **Figure 2.11:** Browser drivers\n\nWe are now ready to run simple tests.\n\n\
    # Walkthrough of BPB application\n\nThroughout the course, we will be using an\
    \ application to practice. Let us first begin with understanding the workflow.\
    \ The application is [http://practice.bpbon.com/](http://practice.bpbon.com/).\n\
    \n![](images/Figure-2.12.jpg)\n\n**Figure 2.12:** BPB application\n\nIt is a sample\
    \ application with basic workflows, which are as follows:\n\n* Register user\n\
    * Login logout\n* Search product\n* Buy product\n* Change profile\n* View orders\n\
    \nOur first step as we explore the application is to create a new user. To create\
    \ a new user, we will have to use the register user scenario. Let us see the steps\
    \ using which we can do it.\n\n## Register user\n\nTo register the user, we will\
    \ have to perform the following steps:\n\n1. Launch the application using the\
    \ URL—[http://practice.bpbon.com/](http://practice.bpbon.com/)\n\n2. Click on\
    \ the `My Account` link, as highlighted in the following image:\n\n   ![](images/Figure-2.13.jpg)\n\
    \n   **Figure 2.13:** My Account link\n\n3. The page which will open is the sign-in\
    \ page. On this, the next step is to click on `Continue` in the `New User` section,\
    \ to go to the register user page. The following image shows it.\n\n   ![](images/Figure-2.14.jpg)\n\
    \n   **Figure 2.14:** Click on continue button\n\n4. Once we are on the register\
    \ user page, we need to fill in all the mandatory details. Please note that the\
    \ e-mail address and the password we provide here are the same we will use to\
    \ login as user credentials once we are successfully registered. We also need\
    \ to note here that it is not necessary that we provide an e-mail address that\
    \ is working. A dummy e-mail address is preferred.\n\n   ![](images/Figure-2.15.jpg)\n\
    \n   **Figure 2.15:** Register user page\n\n5. If the user is registered successfully,\
    \ we should see the following screen:\n\n   ![](images/Figure-2.16.jpg)\n\n  \
    \ **Figure 2.16:** Account creation confirmation message\n\n6. Please note that\
    \ once the account is created, we should be able to use the e-mail address and\
    \ password combination to login into the application and explore other scenarios.\
    \ Please also note that we should disable automatic password saving as browser\
    \ behavior, as this hampers automation.\n"
