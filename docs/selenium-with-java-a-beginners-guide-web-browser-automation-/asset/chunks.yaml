  trans: "\n\n| `selectByIndex()` | 这允许我们根据元素在下拉列表中的位置来选择元素。 |\n| `deselectByValue()`\
    \ | 这将根据 option 标签的 value 属性从下拉列表中取消选择该元素。 |\n| `deselectByVisibleText()` | 这允许我们根据与\
    \ option 标签关联的可见文本来取消选择元素。 |\n| `deselectByIndex()` | 这允许我们根据元素在下拉列表中的位置来取消选择元素。\
    \ |\n| `getOptions()` | 此方法将返回下拉列表中所有可 option。 |\n| `getFirstSelectedOption()`\
    \ | 此方法将返回列表中的第一个选中的 option。 |\n| `isMultiple()` | 此方法根据下拉列表是否允许多选元素来返回 true 或\
    \ false。 |\n\n**表 5.2:** 使用 `select` 类时可使用的不同方法\n\n在我们的应用程序中，可以找到许多下拉列表。我们将选取主页面上的下拉列表，它显示了制造商。让我们来看一下它。\n\
    \n![](img/Figure-5.16.jpg)\n\n**图 5.16:** 主页面上的下拉列表\n\n从上一个图中可以看出，该列表是 HTML 中的一个\
    \ `<select>` 元素，并且它带有各种 `<option>` 标签。让我们查看与其相关的完整 HTML。\n\n![](img/Figure-5.17.jpg)\n\
    \n**图 5.17:** Select 标签\n\n我们看到这不是一个多选下拉列表。它包含 11 个 option 标签，其中第一个 option 标签代表\
    \ `Please Select`。我们应该注意，value 属性包含数字，例如 `\"1\"`、`\"2\"` 直到 `\"10\"`。与每个 option\
    \ 元素关联的显示文本是我们在网页上看到的制造商名称。我们将采用以下场景创建一个自动化脚本：\n\n1. 使用 URL 启动 Web 应用：[`practice.bpbonline.com/index.php`](http://practice.bpbonline.com/index.php)。\n\
    2. 从下拉表中找到所有制造商。\n3. 对于找到的每个制造商，从下拉列表中选择它，并在控制台上打印与其关联的所有产品的名称。\n4. 在第 3 步中，我们需要理解产品页面是以\
    \ Web 表格（Web table）的形式显示信息的；因此，我们必须使用之前讨论过的 Web 表格部分的信息，展示如何遍历表格并打印与其关联的内容。\n\
    5. 当我们编写此代码时，通过 Selenium 发现，当从一个制造商移动到另一个制造商时，会发生页面刷新。由于由于，我们的代码中将得到 `StaleElementException`。为了处理它，我们必须重新识别下拉元素。\n\
    6. 要操作下拉元素，我们需要导入包：`org.openqa.selenium.support.ui.Select`。\n\n现在让我们来看下面的代码：\n\
    \n![](img/p85.jpg)![](img/p86.jpg)[](images/p87.jpg)\n\n如上一个代码所示，为了便于理解，还添加了适当的注释，我们能够打印出制造商名称及其相关产品的输出。输出如下：\n\
    \n`The manufacturer Canon has no products`\n`The manufacturer - Fox products are\
    \ listed--`\n`Product Name+ Price Buy Now`\n`Courage Under Fire $38.99 $29.99`\n\
    `Buy Now`\n`Die Hard With A Vengeance $39.99`\n`Buy Now`\n`Speed $39.99`\n`Buy\
    \ Now`\n`Speed 2: Cruise Control $42.00`\n`Buy Now`\n... (剩余输出已截断)\n\n我们可以根据需要自动化的场景，尝试更多与下拉类相关的函数。\n\
    \n# 结论\n\n在本章中，我们学习了如何处理表单元素、Web 表格和下拉元素。在接下来的章节中，我们将学习如何处理 frame、alert 以及如何处理高级键盘和鼠标操作。\n\
    \n# 问题\n\n1. 我们将使用 `WebElement` 的哪个函数来判断单选按钮（radio button）是否被选中？\n2. Web 表是一个容器元素吗？\n\
    3. 列出在下拉列表中选择元素的三个不同方法？\n4. 我们什么时候会遇到 `StaleElementException`？\n\n# 第 6 章：使用 WebElement—Alert、Frame、IFrame\
    \ 和 Window\n\n在上一一章中，我们看到了对不同类型 HTML 元素的处理，例如输入元素、Web 表格和下拉元素。在本章中，我们将学习如何自动化处理\
    \ JavaScript  alerts（也称为弹窗）、Frame 元素、IFrame 元素、HTML 窗口以及 action 类，action 类用于处理高级鼠标和键盘操作。为了理解本章的概念，我们必须探索另一个\
    \ Web 应用，该应用托管在此链接上——[`the-internet.herokuapp.com/`](https://the-internet.herokuapp.com/)。该网站由\
    \ Elemental Selenium 维护，被 Selenium 社区广泛用于尝试和理解使用 Selenium 操作不同类型 HTML 元素的工作。我们的一些示例将基于此。\n\
    \n# 结构\n\n本章分为以下几个章节：\n\n* 处理 JavaScript alerts\n* 处理 Frame 和 IFrame HTML 元素\n\
    * 处理 HTML 窗口\n* 处理 action 类\n\n# 目标\n\n读完本章后，你将能够：\n\n* 使用 Selenium 中的 `Alert`\
    \ 类来处理弹窗。\n* 操作 IFrame 元素，并处理 IFrame 内部的对象。\n* 自动化处理应用程序中打开新窗口的场景。\n\n# 处理 JavaScript\
    \ alerts\n\nJavaScript alerts 或弹窗出现在各种 Web 应用场景中。这些弹窗可以提供信息或请求用户操作。在处理弹窗之前，我们无法在\
    \ Web 应用程序上进行任何其他操作。三种类型的 JavaScript alerts 如下：\n\n* 框（Alert box）\n* 确认框（Confirm\
    \ box）\n* 输入框（Prompt box）\n\n 框用于向用户提供信息，用户通常通过关闭或点击 `OK` 按钮来处理它。\n\n![](img/Figure-6.1.jpg)\n\
    \n**图 6.1:** Alert 框\n\n"
- fmt: "\nThe confirm box is used for the user to verify an action or deny it. It\
    \ generally has an `OK` or a `Cancel` button. And the user can handle it by clicking\
    \ on either.\n\n![](images/Figure-6.2.jpg)\n\n**Figure 6.2:** Confirm box\n\n\
    Finally, a prompt box is used in the situation when we want some information to\
    \ be provided by the user. The user has to input something and then can either\
    \ click on `OK` or on the `Cancel` button.\n\n![](images/Figure-6.3.jpg)\n\n**Figure\
    \ 6.3:** Prompt box\n\nTo handle these alerts, there is a separate interface called\
    \ as `Alert` in the Selenium java bindings. The details are available at: **[https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/Alert.html](https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/Alert.html)**\n\
    \nThe `Alert` interface has four methods, as shown in the following table:\n\n\
    | Method name | Action |\n| :--- | :--- |\n| `Accept` | This method will accept\
    \ the alert. It will cause click on `OK` button |\n| `Dismiss` | This method will\
    \ cancel the alert. It will cause click on the `Cancel` button |\n| `getText`\
    \ | This method will fetch the text displayed on the `Alert`. |\n| `sendKeys`\
    \ | This method will send the keys which we press on the keyboard to the `Alert`.\
    \ |\n\n**Table 6.1:** Methods of alert interface\n\nTo understand the handling\
