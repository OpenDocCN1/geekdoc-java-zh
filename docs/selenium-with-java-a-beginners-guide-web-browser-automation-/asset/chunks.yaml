    \ we invoke the HSSF object, and for **`.xlsx`** we invoke the XSSF object. Let\
    \ us see the code line as follows:\n\n![](images/p168.jpg)\n\nOur next action\
    \ is to create the worksheet object using the workbook and then find the available\
    \ rows and columns. The code for the same is as follows:\n\n![](images/p168a.jpg)\n\
    \nFinally, we need to read the data from the Excel cell into two-dimensional arrays\
    \ of data type String. We should note here that it is possible that the Excel\
    \ cell contains data in different formats, such as number, date format, currency,\
    \ and so more. We in here are converting any format into string type and storing\
    \ it in the array. Later in the Java program, if we wish to handle the data in\
    \ some other format, we can do. The code to read from the cell is as follows:\n\
    \n![](images/p168b.jpg)"
