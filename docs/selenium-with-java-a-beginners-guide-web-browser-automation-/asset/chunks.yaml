  trans: "\n\n在本章中，我们将学习一些额外的概念，这些概念可以结合 Selenium 使用，帮助我们编写更好的脚本。我们学习了 `actions` 类的用法，它可以帮助我们处理鼠标和键盘操作。我们学习了如何在运行时截屏并将其保存为系统中的文件。最后，我们看到了一个名为\
    \ `WebDriverManager` 的第三方实用库，它通过在运行时为想要执行的浏览器提供正确的驱动程序，简化了管理相应浏览器驱动程序的任务。在接下来的章节中，我们将介绍一个名为\
    \ `TestNG` 的单元测试框架概念，它对于使用 Selenium 设计测试自动化脚本非常有帮助。\n\n# 问题\n\n1. 哪个包包含 `action`\
    \ 接口？\n2. `action` 接口中的 `build()` 方法的作用是什么？\n3. 使用哪个方法来捕获截屏？\n4. `WebDriverManager`\
    \ 的用途是什么？\n\n# 第 8 章\n\n## 什么是 TestNG\n\n`TestNG` 代表 `Testing Next Generation`（下一代测试）。它是最广泛使用的测试框架之一，特别是在使用\
    \ Java 作为编程语言的测试自动化项目中。另一个经常使用的测试框架是 `JUnit`，但 `TestNG` 对测试项目更具兼容性。TestNG 的主网站是\
    \ `[https://testng.org/doc/]`。在本章中，我们将探索 `TestNG` 的基础知识，并查看其在 Selenium 测试自动化项目中的功能。\n\
    \n## 结构\n\n在本章中将涵盖以下主题：\n* 设计 TestNG 测试\n* 在 TestNG 测试中添加断言（assertions）\n* TestNG\
    \ 中的报告\n\n## 目标\n\n本章的目标是理解 TestNG 作为测试框架的特性和功能，以便用于使用 Selenium 设计测试自动化项目。TestNG\
    \ 是除 `JUnit` 之外使用最广泛的单元测试框架之一。虽然 JUnit 主要由开发人员人员在设计代码时使用，但 TestNG 的功能更适合测试人员在设计自动化代码时使用。我们将看到\
    \ TestNG 套件（suite）的后续如何，讨论 TestNG 提供的各种注解（annotations），理解如何执行套件文件，并讨论可用的执行模式。最后，我们将探索\
    \ TestNG 默认提供的报告。\n\n## 简介\n\nTestNG 是一个用于广泛测试活动的测试框架，从单元测试到集成测试。它具有各种特性和广泛的注解，这些对于设计测试套件非常有用。在\
    \ TestNG 中设计的任何套件都有一个 XML 文件，其中包含有关测试、执行标准的信息，还可以包含测试在执行期间使用的测试配置参数信息。现在让我们看看如何在\
    \ eclipse 环境中安装 TestNG。\n\n## 安装\n\n在本节中，我们将介绍在 eclipse 环境中安装 TestNG。安装 TestNG\
    \ 有多种方法，在以下链接中提到：`[https://testng.org/doc/download.html]`。我们将查看如何使用 Eclipse IDE\
    \ 的帮助（Help）功能来安装它。让我们一步进行。\n\n1. 在 eclipse 中打开 Java 项目，也就是我们在之前的章节中一直运行的那个项目。在主菜单上，点击\
    \ `Help` 并选择 `Install New Software…`。\n\n    ![](img/Figure-8.1.jpg)\n    **图\
    \ 8.1：** 安装 TestNG\n\n2. 一旦打开了 Install 窗口，我们需要在 `Work with` 文本框中输入 URL。提供的 URL\
