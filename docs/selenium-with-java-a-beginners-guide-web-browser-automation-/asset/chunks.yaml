    同样，我们可以为注销（log-off）页面场景实现页面对象。为了显示注销页面，我们需要首先登录应用程序。然后，流程是点击 `Log Off` 链接，然后点击继续（continue）链接从应用程序中注销。下图显示了该流程：


    ![](img/Figure-9.2.jpg)


    **图 9.2：** 注销页面场景


    因此，对于注销页面对象模型，我们将使用注销链接和 `Continue` 链接。让我们来看代码：


    ![](img/p149.jpg)[](images/p150.jpg)


    我们现在将创建第三个类，在该类编写登录注销过程的业务逻辑和验证。在这个类中，我们不再编写先识别 Web 元素然后对其执行操作的步骤，而是调用 `login_pom`
    和 `logout_pom` 中的对象，并访问那里定义的方法。让我们来看代码：


    ![](img/p150a.jpg)[](images/p151.jpg)


    在这段代码中，我们可以看到以下几行：


    ```

    1 Login_Pom login = new Login_Pom(driver);

    2 Logout_Pom logout = new Logout_Pom(driver);

    3 login.clickMyAccount();

    4 login.loginAs("abc@demo.com", "demo@123");

    5 login.validateLogin("My Account Information");

    6 logout.logOff();

    ```


    第 1 行和第 2 行是定义登录页面对象模型类和注销页面对象模型类的地方。在第 3 行中，我们调用了 `clickMyAccount` 链接方法。正如我们所知的，该方法声明在
    `login_pom` 类中：


    ![](img/p151a.jpg)


    这里还需要注意：`WebDriver` 定义在调用类中，当我们实例化 `login_pom` 对象时，传递了 driver 对象。在 `login_pom`
    构造方法中，我们看到 `login_pom` 中的 `WebDriver` 对象被赋值为传进的 driver 对象。方法显示如下：


    ![](img/p151b.jpg)


    `logout_pom` 类也是如此。第 4 行和第 5 行是实际登录并验证操作的地方。第 6 行调用了 `logout_pom` 中的注销方法，我们在那里调用了点击注销链接的方法和继续链接的方法。此处显示相同：


    ![](img/p152.jpg)


    # clickLogOff


    ![](img/p152a.jpg)


    # clickContinue


    ![](img/p152b.jpg)


    现在，在任何需要调用登录和注销操作的测试脚本场景中（例如在 `Change Profile` 修改配置或 `Buy Product` 购买产品中），我们可以简单地调用
    `login_pom` 和 `logout_pom` 中的方法。此外，如果这些类使用的任何对象发生变化，只需在这些类中进行修改，而无需在代码的其他地方修改。


    为我们的测试自动化代码实现页面对象模型有很多好处。我们实现了模块化、代码抽象、减少错误概率、减少代码行、独立的对象信息管理、业务逻辑与应用对象的分离。因此，任何使用
    Selenium 的良好测试自动化项目实现页面模型概念都是重要的。


    # 实现页面工厂


    Selenium 为我们提供了一个在代码中实现页面对象模型的类。这个类被称为 page factory（页面工厂）。我们还使用一个通过 `FindBy` 描述的注解枚举。为了实现
    `PageFactory` 类，我们不使用 `By` 类来定义对象。相反，我们使用 `FindBy` 中提供的注解，它允许我们定义我们想要查找内容的方式，例如
    `NAME`、`ID`、`LinkText` 等，以及我们在该属性中搜索的值。`My Account` 链接的 `FindBy` 示例所示：


    ```

    @FindBy(linkText = "My Account")

    WebElement myAccLnk;

    ```


    因此在用于 `PageFactory` 的 `login` 类中，代码如下：


    ![](img/p153.jpg)[](images/p154.jpg)


    使用 page factory 实现的 `logout` 类如下：


    ![](img/p154a.jpg)[](images/p155.jpg)


    在使用 page factory 的登录代码和注销代码中，我们都会在构造函数中看到以下代码行：


    ```

    PageFactory.initElements(driver, this);

    ```


    上一行的目的是使用 driver 对象初始化页面对象元素，这些元素是我们通过类中的 ` `FindBy` 注解识别的。最后，调用代码如下：


    ![](img/p155.jpg)[](images/p156.jpg)


    因此，前面的代码展示了如何使用 page factory 概念实现页面对象模型，我们使用 `FindBy` 注解来识别对象，然后使用 `Page.init`
    方法使用 driver 对象初始化页面对象。


    # 结论


    因此，在本章中，我们看到了页面模型的重要性。我们理解了使用 Selenium 提供的 `PageFactory` 的重要。在接下来的章节中，我们将通过读取
    CSV 和 Excel 文件来学习数据驱动测试。


    # 问题


    1. 解释页面对象的重要性？

    2. 什么是模块化，为什么它对代码很重要？

    3. @FindBy 注解的作用是什么什么？


    # 第 10 章


    # 数据驱动测试


    任何 Web 应用测试都需要准备测试数据。测试数据是测试用例中不可或缺的一部分。当我们自动化测试脚本时，会发现我们在脚本中使用了数据。随着应用程序的变化或测试过程的可能变化，测试脚本中使用的数据也很可能发生变化。因此，在测试逻辑之外管理脚本中使用的数据是十分重要的。此外，我们可能还有环境配置数据，如应用程序
    URL、报告、日志的一些文件路径等，这些也应该被管理。在本章中，我们将看到如何为测试管理数据并在脚本中明智地使用它们。


    # 结构


    本章分为以下章节：


    *   数据管理的重要性

    *   在 CSV 文件、Excel 文件中管理数据并在测试中使用它们


    # 目标


    本章的目标是理解在设计测试时数据作为一种要素的重要性。在本章中，我们还将看到如何从 CSV 文件或 Excel 文件读取数据。


