- fmt: "\nAs the test suite is executed, we can pass on some reporting information\
    \ in these result files to make them more meaningful and readable for the stakeholders.\
    \ To log the messages in the result files, we can use the object of TestNG reporter\
    \ [`https://javadoc.jitpack.io/com/github/cbeust/testng/master/javadoc/org/testng/Reporter.html](https://javadoc.jitpack.io/com/github/cbeust/testng/master/javadoc/org/testng/Reporter.html)]\
    \ and call the `log` method, which takes an input argument as a string. In the\
    \ following section, when we design a TestNG test and suite eventually, we will\
    \ see its usage.\n\n## Introduction\n\nIn this section, we will explore creating\
    \ a TestNG class file. The scenario which we will pick for this is the login logout\
    \ scenario. We will create two class files with two methods, one for login to\
    \ the application successfully and another to test incorrect login. We will then\
    \ call these files from our TestNG suite file.\n\nLet us first see the code for\
    \ the `loginLogout` TestNG class file. We will from here now start using `webdrivermanager`;\
    \ as in the upcoming chapters, we will start talking more about the various components\
    \ that come together to help us design and write better test automation suites.\
    \ You can choose to still work with driver executables if you wish.\n\n![](images/p134.jpg)![](images/p135.jpg)\n\
    \nAs we can see in the preceding TestNG test design, we have a `@BeforeMethod`\
    \ annotation where we have set up the browser object. We are creating an instance\
    \ of the `webdrivermanager` object and asking it to be set to chrome. In the `@Test`\
    \ method, we have written the code to perform the login logout in our application.\
    \ In this test, we have passed valid user login details. And finally, in the `@AfterMethod`,\
    \ we wrote the code for the browser to close. We also used the TestNG Reporter\
    \ method `log` to provide information in the result files based on whether test\
    \ passed or failed. Let us see the `Test.html` file after the suite execution\
    \ is completed. The following image gives us a snapshot of it.\n\n![](images/Figure-8.12.jpg)\n\
    \n**Figure 8.12:** Suite execution result file\n\nWe need to understand here is\
    \ that we used a `testng.xml` file, which is the suite file for executing the\
    \ TestNG test. The suite XML file which we used is as follows:\n\n```xml\n<?xml\
    \ version=\"1.0\" encoding=\"UTF-8\"?>\n<suite parallel=\"false\" name=\"Suite\"\
    >\n  <test name=\"Test\">\n    <classes>\n      <class name=\"testngfiles.loginLogoutWithTestNG\"\
    />\n    </classes>\n  </test> <!-- Test -->\n</suite> <!--Suite -->\n```\n\nIn\
    \ this `testng.xml` file, we can see that the name given to our test suite is\
    \ `Suite`, and the name of the test is `Test`. Our test contains only one class\
    \ file for execution, and we passed its name so that the code mentioned in the\
    \ file, in order of the annotation, can get executed. So first, the code in `@BeforeMethod`\
    \ will execute, then in the `@Test` method, and finally, `@AfterMethod` will execute.\n\
    \nWe need to understand here that based on our code structure, our test automation\
    \ suite design, we can and should design our class files using proper annotations\
    \ and use them in the test suite XML file. In our next section, we will see how\
    \ we can pass data to our tests using the `parameters` tag in the suite XML file,\
    \ and also see how we can use the `@DataProvider` annotation to parameterize our\
    \ test method in the class file.\n\n## Passing data in TestNG test\n\nData management\
    \ and structuring form an integral part of the test automation suite design. The\
    \ TestNG framework provides us with different ways to manage and handle passing\
    \ data to the test. We have available with us the `parameters` tag in the suite\
    \ XML file and the `@DataProvider` annotation, which we can use in the class file,\
    \ to parameterize the `@Test method`. Let us see in this section the situation\
    \ where we can use these two entities to make our test design better.\n\nLet us\
    \ take a test suite design, where we have more than one test available. We need\
    \ to pass the information of the browser as a configuration setting, mentioning\
    \ before suite execution begins which browser the test should use. It could be\
    \ be possible that we design a test suite file in a manner that a group of tests\
    \ take one particular browser for execution. To achieve this, we need to use the\
    \ `Parameter` tag, which is available for us to use during the suite XML file\
    \ design.\n\nTo use it, we will create a test suite, which contains more than\
    \ one test, and pass the browser information as a configuration setting. To implement\
    \ this, we will see how our suite file will look like and where and how we will\
    \ be using the `Parameter` information which will be passed to the test from the\
    \ suite file.\n\nFor example, let our test suite contain two test files, one for\
    \ valid user login and the other for the invalid user login, and we pass browser\
    \ execution information from the suite file. To show this, we created a `baseFile`,\
    \ which has a method to set the driver object based on the browser name passed\
    \ to it. We then call the method in our TestNG class file and using the `Parameter`\
    \ tag we pass. Let us see the code as follows:\n\n**baseFile**\n\n![](images/p137.jpg)\n\
    \n`loginLogoutWithParams`—Java code:\n\n![](images/p137a.jpg)![](images/p138.jpg)\n\
    \nThe TestNG suite file as follows:\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<suite parallel=\"false\" name=\"DemoSuite\">\n  <parameter name=\"\
    browser\" value=\"chrome\"/>\n  <test name=\"LoginLogout\">\n    <classes>\n \
    \     <class name=\"testngfiles.loginLogoutWithParams\"/>\n    </classes>\n  </test>\n\
    </suite>\n```\n\nSo in the preceding code, we saw how we can pass the browser\
    \ information through `Parameter`. Next, we will see how we can pass information\
    \ using the data provider.\n\n### DataProvider\n\nThe `@DataProvider` annotation\
    \ takes data values in the form of a two-dimensional array object. We can pass\
