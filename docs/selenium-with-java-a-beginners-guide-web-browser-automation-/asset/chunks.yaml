    # Execute test using TestNG suite file in parallel on both browsers


    In the preceding section, we saw the creation of the Selenium Grid. We started
    the hub and registered two nodes on its Chrome and Firefox. We also individually
    executed tests on them of the login logout scenario on both Chrome and the Firefox
    browser. Looking at the logs, we verified that the hub received the request for
    session creation, and then it passed the test to the correct node, which provides
    the environment for execution. Now, we will run these two tests in parallel.'
