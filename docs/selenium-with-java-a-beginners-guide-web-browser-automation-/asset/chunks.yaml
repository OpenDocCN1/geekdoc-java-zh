    \ Tab 键，等待 5 秒，然后按下 Space 键。我们首先需要使用 `build method()` 创建一个复合操作，然后调用 `perform`。相应的脚本如下：\n\
    \n![](img/p113.jpg)\n\n因此，我们看到了不同的操作方法，也看到了复合操作的示例。\n\n# 截图](#toc.xhtml_s62a)\n\
    \nSelenium 中的截图接口允许我们在脚本执行时捕获屏幕并以不同的方式存储它。截图是脚本执行期间捕获问题的极佳方法。它们有助于记录更好的错误报告，以便开发人员可以通过查看图像轻松识别问题可能发生的地方。使用截图方法\
    \ `getScreenShotAs`，它使用文件类（file class）存储文件。该类可用 `commons.io` jar 包，该包由 Apache\
    \ 提供。我们需要将此包添加到我们的项目中以便使用该方法。\n\n为了显示截图代码示例，我们将采用使用外部数据文件进行用户登录和注销场景。我们将使用的文件是\
    \ CSV 文件，它使用逗号作为分隔符存储数据。该文件将包含两条记录，一个带有有效的用户凭据，另一个带有无效的用户凭据。我们将为有效和无效场景下的用户登录捕屏，以记录应用程序的运行情况。\n\
    \n我们的步骤如下：\n\n1. 创建一个包含两条记录的 CSV 文件，一个包含有效的用户凭据，另一个包含无效的用户凭据；该文件保存在项目的 `DataFiles`\
    \ 文件夹中，扩展名为 `.csv`。\n\n    ![](img/Figure-7.5.jpg)\n\n    **图 7.5：** 带有用户凭据的记录\n\
    \n2. 然后编写自动化应用程序登录和注销步骤的脚本如下：\n\n    1. 打开应用程序。\n    2. 点击 `My Account` 链接。\n\
    \    3. 使用从 CSV 文件读取的数据输入用户名。\n    4. 使用从 CSV 文件读取的数据输入密码。\n    5. 点击 `Sign In`。\n\
    \    6. 如果用户登录成功，捕屏然后点击 log off 并继续链接。\n    7. 如果用户登录失败，则捕屏并关闭应用程序。\n\n3. 为了截图，我们将调用截图接口的\
    \ `getScreenShot` 方法。该接口将使用创建的浏览器对象进行初始化。将其存储为 `File` 对象，然后将该文件转换为 `.jpg`。我们为此使用的类是\
    \ Commons IO jar 包中的 `FileUtils` 类。\n\n4. 截图将被存储在 `Screenshots` 文件夹中，我们需要在项目创建之前创建该文件夹。因此，我们的项目树结构如图所示：\n\
    \n    ![](img/Figure-7.6.jpg)\n\n    **图 7.6：** 项目树\n\n以下代码显示了根据上述编写步骤生成的脚本：\n\
    \n![](img/p115.jpg)![](img/p116.jpg)![](img/p117.jpg)\n\n之前的代码将为有效用户和无效用户执行两次。执行完成后，我们可以在\
    \ Screenshots 文件夹中找到为有效和无效用户捕获的两张图像。让我们看看这里捕获的截图。\n\n![](img/Figure-7.7.jpg)\n\
    \n**图 7.7：** 有效用户\n\n![](img/Figure-7.8.jpg)\n\n**图 7.8：** 无效用户\n\n如之前所述，执行期间截图有助于我们记录发现的问题。这有助于团队成员通过视觉描述修复问题。\n\
    \n# WebDriverManager](#toc.xhtml_s63a)\n\nWebDriverManager 允许我们在运行时驱动可执行文件，该文件是浏览器自动化所需的。使用此包，我们不需要根据浏览器版本下载或跟踪驱动程序版本。使用此库，管理相应驱动程序的任务被简化了。\n\
    \n该库由 Boni Garcia 开发，**[`github.com/bonigarcia`](https://github.com/bonigarcia)**，并由一组贡献者维护。更多细节可以在此处查看——**[`github.com/bonigarcia/webdrivermanager`](https://github.com/bonigarcia/webdrivermanager)**。\n\
    \n在本节中，我们将编写一段示例代码，使用 `WebDriverManager` 来启动并操作浏览器。我们将编写在三个脚本中启动三个不同浏览器的步骤，然后等待秒并关闭它们。我们选择的浏览器是\
    \ Chrome、Firefox 和 Internet Explorer。\n\n使用 `WebDriverManager` 启动 Chrome 所示：\n\
    \n![](img/p119.jpg)\n\n使用 `WebDriverManager` 启动 Firefox 所示：\n\n![](img/p119a.jpg)\n\
    \n最后我们看到使用 `WebDriverManager` 启动 Internet Explorer 所示：\n\n![](img/p120.jpg)\n\n\
    因此，我们在本节中看到了如何使用 WebDriverManager 与不同的浏览器交互。我们还看到不需要下载或管理这些浏览器的驱动程序。\n"
- fmt: "\nIn this chapter, we learn about a few extra concepts which we can use with\
    \ Selenium to help us write better scripts. We saw the usage action class, which\
    \ helps us work with mouse and keyboard actions. We saw how we can screenshot\
    \ at run time, save it as a file in the system. Finally, we saw a third-party\
    \ useful library called as `WebDriverManager`, which eases the task to manage\
    \ the respective driver for the browser we wish to use for execution by making\
    \ available the correct driver for it at run time. In the upcoming chapter, we\
    \ will look at the concept of a unit testing framework called as `TestNG`, which\
    \ is extremely helpful in designing test automation scripts using Selenium.\n\n\
    # Questions\n\n1. Which package contains the action interface?\n2. What does `build()`\
    \ method does in the action interface?\n3. Which method is used to capture the\
    \ screenshot?\n4. What is the use of the `WebDriverManager`?\n\n# CHAPTER 8\n\n\
    ## What is TestNG\n\n`TestNG` stands for `Testing Next Generation`. It is one\
    \ of the most widely used testing frameworks, specifically in test automation\
    \ projects made using Java as a programming language. The other test framework\
    \ many uses is `JUnit`, but `TestNG` is more compatible for test projects. The\
    \ main website for TestNG is `[https://testng.org/doc/]`. In this chapter, we\
    \ will explore the basics of `TestNG` and see some of its functionalities with\
    \ respect to being used in test automation projects with Selenium.\n\n## Structure\n\
    \nIn this chapter, the following topics will be covered:\n* Designing a TestNG\
    \ test\n* Adding assertions to TestNG test\n* Reports in TestNG\n\n## Objectives\n\
    \nThe objective of this chapter is to understand the feature and functionalities\
    \ of TestNG as a test framework to be used in designing test automation projects\
    \ using Selenium. TestNG is one of the most widely used units test frameworks\
    \ besides `JUnit`. Although JUnit is mainly used by developers as they design\
    \ their code, TestNG has features that are more apt for the testers to use as\
    \ they design their code for automation. We will see what a TestNG suite looks\
    \ like, discuss about various annotations available with TestNG, understand how\
    \ we can execute a suite file, and discuss the different modes available for execution.\
    \ Finally, we will explore reports which are made available by default with TestNG.\n\
    \n## Introduction\n\nTestNG is a testing framework that is used for a broad range\
    \ of test activities, from unit testing to integration testing. It has various\
    \ features and a wide range of annotations, which are useful to design a test\
    \ suite. Any test suite designed in TestNG has an XML file that contains information\
    \ about the tests, execution criteria and can also contain test configuration\
    \ parameters information to be used by the test during execution. Let us see now\
    \ how can we install TestNG in the eclipse environment.\n\n## Installation\n\n\
    In this section, we will cover the TestNG installation in the eclipse environment.\
    \ There are various ways to install TestNG, which are mentioned in this link:\
    \ `[https://testng.org/doc/download.html]`. We will see how we can install it\
    \ using the Help of the Eclipse IDE. Let us go step by step.\n\n1. Open the Java\
    \ project in eclipse, where we have been working in the previous chapters. On\
    \ the main menu, click on `Help` and select `Install New Software…`.\n\n    ![](images/Figure-8.1.jpg)\n\
    \    **Figure 8.1:** Installing TestNG\n\n2. Once the Install window opens, there\
    \ we need to type in a URL in the `Work with` a text box. The URL to provide is\
    \ `[https://testng.org/testng-eclipse-update-site]`, and press `Enter` or click\
    \ on the `Add…` button:\n\n    ![](images/Figure-8.2.jpg)\n    **Figure 8.2:**\
    \ Provide URL for TestNG\n\n3. Once we do that, we will see the latest version\
    \ of the TestNG, which is available. At the time of writing the book, the version,\
    \ which is available, is `7.4`.\n\n    ![](images/Figure-8.3.jpg)\n    **Figure\
    \ 8.3:** Select TestNG only from the list\n\n4. Select the first option, and click\
    \ on `Next` button to proceed with the installation. It takes a while as it calculates\
    \ the various dependencies.\n\n    ![](images/Figure-8.4.jpg)\n    **Figure 8.4:**\
    \ Installation begins\n\n5. Once done, it will require you to accept a license\
    \ agreement. Accept and proceed to complete the installation.\n\n    ![](images/Figure-8.5.jpg)\n\
    \    **Figure 8.5:** Accept the license agreement\n\n6. Once TestNG is installed\
    \ on the eclipse, it will require a restart of an eclipse. After doing it, we\
    \ need to add the TestNG library to the Java project. For this, right-click on\
    \ the project and select `Properties`. Select `Java Build Path` option.\n\n  \
    \  ![](images/Figure-8.6.jpg)\n    **Figure 8.6:** Java build path\n\n7. Click\
    \ on `Modulepath`, and select `Add Library`. Select the TestNG from the list of\
    \ libraries shown.\n\n8. Once TestNG is added, it will show the following when\
    \ we right-click the project.\n\n    ![](images/Figure-8.7.jpg)\n    **Figure\
    \ 8.7:** TestNG class\n\n9. Select the option to `Create TestNG class`; we need\
    \ to select the suite file. We also name the suite file as `testng.xml`.\n\n \
    \   ![](images/Figure-8.8.jpg)\n    **Figure 8.8:** Creating TestNG\n\n10. We\
    \ are now ready to add the code into the preceding file and execute it as a TestNG\
    \ suite using the `testng.xml`. But before we do that, let us first understand\
    \ the structure by understanding the various annotations available with TestNG.\n\
    \n    ![](images/Figure-8.9.jpg)\n    **Figure 8.9:** TestNG class\n\nIn the next\
    \ section, we will learn about the different annotations TestNG has and the structure\
    \ `testng` suite file.\n\n# Structure\n\nA TestNG suite consists of an XML file\
    \ and at least one TestNG class file, which is a Java file containing a `@test`\
    \ annotation that is used by a method in the program. Let us first discuss the\
    \ different types of annotation which are available with TestNG, which can help\
    \ us design our framework for the test. The annotations in TestNG can be broadly\
    \ classified into two categories `@BeforeAnnotation` and `@AfterAnnotation`. The\
    \ following table lists and describes them:\n\n| Annotation | Description |\n\
    | :--- | :--- |\n| `@BeforeSuite` | Any statement written within this annotation\
    \ will execute at the beginning of the suite execution. |\n| `@AfterSuite` | Any\
    \ statement written within this annotation will execute at the end as the suite\
    \ execution finishes. |\n| `@BeforeTest` | Any statement written in this annotation\
    \ will execute before the test within the suite execution begins. |\n| `@AfterTest`\
    \ | The statements written in this annotation will execute after the test is completed.\
    \ And it will execute after the test for every test in the suite file. |\n| `@BeforeGroups`\
    \ | The statement in this annotation will execute for the test mentioned in the\
    \ group. |\n| `@AfterGroups` | The statement in this annotation will execute after\
    \ the test completes mentioned in the group. |\n| `@BeforeClass` | The statement\
    \ in this annotation will begin before the test mentioned in the class code. |\n\
    | `@AfterClass` | The statement in this annotation will execute after the test\
    \ method of the class is over. |\n"
