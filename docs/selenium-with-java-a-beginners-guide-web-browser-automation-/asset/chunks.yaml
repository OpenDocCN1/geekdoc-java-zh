    \ We see the product listed as the following image shows:\n\n![](images/Figure-5.8.jpg)\n\
    \n**Figure 5.8:** The home page of the application\n\nIf we look at this using\
    \ the chrome inspect, we will see the table element which contains this information.\n\
    \n![](images/Figure-5.9.jpg)\n\n**Figure 5.9:** The Chrome inspects\n\nLet us\
    \ look at the information contained in one table cell of this product table:\n\
    \n![](images/Figure-5.10.jpg)\n\n**Figure 5.10:** HTML content of a table cell\n\
    \nAs we see in *[figure 5.10](#c05.xhtml_fig5_10)*, the table cell contains two\
    \ anchor tags and a text that shows the price of the product. One anchor tag displays\
    \ the image of the product, and the other takes us to the product page. In the\
    \ script, which we will write, we will iterate through this table and print the\
    \ contents of the table. The steps which we will do in our script are as follows:\n\
    \n1.  Open the Web application using the URL: **[http://practice.bpbonline.com/index.php](http://practice.bpbonline.com/index.php)**.\n\
    \n2.  Identify the table element using the HTML tag property as there is only\
    \ one table on the page, and that does not contain any attribute which we can\
    \ use to identify it.\n\n    ![](images/Figure-5.11.jpg)\n\n    **Figure 5.11:**\
    \ The table element\n\n3.  Once we have the table element, we will find out how\
    \ many tables row it contains by using the **`findElements`** method and look\
    \ for the **`<tr>`** tag, and then, we will take each row and find out how many\
    \ table data tags it contains, using the **`findElements`** method only.\n\n4.\
    \  Once we have found the table cell, we will print its text contents on the console.\n\
    \n5.  Here, it is a good idea to note that the Web Table of the HTML page works\
    \ as a two-dimensional array, and like it, we have rows and columns, and we need\
    \ two loops to iterate through it.\n\nLet us look at the following code now:\n\
    \n![](images/p80.jpg)![](images/p81.jpg)\n\nThe output of the preceding program\
    \ prints information on the console, which is as follows:\n\n![](images/Figure-5.12.jpg)\n\
    \n**Figure 5.12:** Output of the program\n\nSo, here we have seen how we can handle\
    \ a Web Table and fetch contents present in the table cell. In the last section\
    \ of this chapter, we will talk about the dropdown element.\n\n# [Working with\
    \ dropdown](#toc.xhtml_s48a)\n\nThe dropdown element is represented using the\
    \ **`<select>`** tag. It is also a container tag and it contains **`<option>`**\
    \ as the child tag. An example of the dropdown is shown as follows:\n\n![](images/Figure-5.13.jpg)\n\
    \n**Figure 5.13:** Dropdown example\n\nWhen the preceding HTML renders on the\
    \ Web page, it is displayed as follows:\n\n![](images/Figure-5.14.jpg)\n\n**Figure\
    \ 5.14:** Dropdown HTML view\n\nTo know more about the dropdown element, refer\
    \ to the link—**[https://www.w3schools.com/tags/tag_select.asp](https://www.w3schools.com/tags/tag_select.asp)**.\n\
    \nThe dropdown element in Selenium is not handled using the **`WebElement`** interface.\
    \ Rather the dropdown element has its own separate class known as the Select class.\
    \ Its details are available here: **[https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/support/ui/Select.html](https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/support/ui/Select.html)**\n\
    \nThe reason for a separate class is that there are some very specific actions\
    \ associated with the dropdown element, which are not available with the other\
    \ Web elements. To understand these actions, we need to first understand the dropdown\
    \ element HTML information. Let us look at the preceding dropdown HTML again:\n\
    \n![](images/Figure-5.15.jpg)\n\n**Figure 5.15:** HTML content of dropdown\n\n\
    As we see in this HTML code, the select tag is a parent tag inside which the child\
    \ tag of option is available. The option tag contains a field called as **`value`**,\
    \ and a text is associated with it. This is the text which we see on the Web page.\
    \ For example, **`<option value=”japan”>JAP</option>`** code displays JAP on the\
    \ Web page. But at the backend, this is the information associated with it. Keeping\
    \ this in mind, we will not look at the different methods available to us with\
    \ **`Select`** class and look at some of them at the code level.\n\n| **Method**\
    \ | **Description** |\n\n| **`selectByValue()`** | This will select the element\
    \ from the dropdown based on the value attribute of the option tag. |\n\n| **`selectByVisibleText()`**\
    \ | This will allow us to select an element based on the visible text associated\
    \ with the option tag. |"
