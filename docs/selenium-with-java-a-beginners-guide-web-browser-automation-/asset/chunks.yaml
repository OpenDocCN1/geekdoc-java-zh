    TestNG 是一个广泛使用的框架，在利用如 `Selenium` 等开源解决方案驱动浏览器设计自动化测试套件时，它是最常用的组件之一。在本章中，我们涵盖了
    TestNG 是什么以及我们如何在 `eclipse` 中安装它。我们了解不同注解的含义，并理解了测试套件 XML 文件。我们查看了执行后生成的不同结果文件，以及如何向这些文件记录信息。最后，我们查看了如何向
    TestNG 测试传递数据。在接下来的章节中，我们将讨论页面对象模型（Page Object Model）的概念以及我们如何使用它来设计我们的测试。


    # 问题


    1. TestNG 提供了哪些不同的注解？

    2. 使用什么方法可以向结果文件记录信息？

    3. 向 TestNG 测试传递数据的两种方法是什么？


    # 第 9 章


    ## 页面对象模型（Page Object Model）概念


    Web 应用程序的自动化是一个复杂的过程，当我们尝试使用 `Selenium` 等开源技术自动化 Web 应用程序的测试过程时，我们需要在代码层面创建基础设施，以处理代码中所需的许多产物。Web
    应用程序的对象（我们在其上执行操作以实现最终结果）是主要的产物之一。处理与对象相关的信息并将其管理在测试脚本之外，对于测试自动化工作的成功至关重要。在本章中，我们将学习如何使用设计模式来处理对象信息，以及
    `Selenium` 类也能如何提供帮助。


    ## 结构


    本章分为以下几个部分：


    * 设计模式——页面对象模型

    * 页面对象模型的代码示例

    * 使用 `Selenium` 的 `page factory` 类处理对象

    * page factory 的代码示例


    ##  目标


    本章的目标是理解在代码层面实现页面对象模型的必要性。具体来说，当我们使用如 `Selenium` 等开源技术时，这些技术默认并不提供任何机制来处理和管理测试脚本中使用的对象信息。许多如
    `UFT`、`test complete` 等商业工具都带有一个名为“对象库”（object repository）的功能集，有助于管理测试脚本中使用的 Web
    应用程序对象信息。但正如我们所学的，`Selenium` 只是一个驱动 Web 浏览器的工具，并没有提供这些功能。我们需要使用良好的编码实践和设计模式来处理代码中的这些产物。在本章中，我们将对此探索。


    ## 页面对象模型


    Martin Fowler 最初以“窗口驱动程序”（window driver）之名描述这一术语，但它被 `Selenium` 工具推广为“页面对象”（page
    object），并通常使用该名称。诚心建议通过以下两个链接详细阅读关于页面对象的内容——Martin Fowler-[`martinfowler.com/bliki/PageObject.html`](https://martinfowler.com/bliki/PageObject.html)。


    另一个来自 Selenium 官网文档——[`www.selenium.dev/documentation/guidelines/page_object_models/`](https://www.selenium.dev/documentation/guidelines/page_object_models/)。


    为了理解页面对象，让我们先理解 Web 页面的两个基本内容。我们说一个 Web 由两个重要实体组成：


    * 页面的业务逻辑。

    * 页面上可用的、帮助我们实现业务逻辑的对象。


    随着应用程序时间的推移，我们会发现业务逻辑的变化可能没有对象信息的变化那么大。在我们设计代码时，我们需要以这种方式编写，将对象信息与页面的业务逻辑分离开。我们还会注意到，在生成自动化测试代码时，我们会遇到在多个测试中出现的场景。例如，在我们的
    Web 应用程序中，登录注销场景会出现在登录注销操作、个人资料修改操作、密码修改操作、购买产品操作等许多场景中。我们可以通过两种方式实现上述目标；一种是在代码层面自己设计
    POM，我们将先解释这种。第二种方法是使用 page factory，它是 `Selenium` 定义的一个类，用于帮助我们实现 POM。将在稍后解释。


    ## 实现页面对象模型


    让我们通过一个示例来理解演示站应用程序登录注销场景的页面对象模型实现。为了理解这个概念，让我们看一个页面——我们在从主页或应用程序 URL 点击 `My Account`
    链接 [`practice.bpbonline.com/`](http://practice.bpbonline.com/) 后看到的登录页面。


    ![](img/Figure-9.1.jpg)


    **图 9.1:** 登录页面


    如果我们查看前面的页面，会看到页面上有几个对象，并且该页面有一个业务目标。以下描述了该页面的业务目标：


    * 允许具有有效凭据的用户通过提供用户名和密码登录应用程序。

    * 不允许详情无效的用户登录应用程序。

    * 允许忘记密码的用户通过点击 `Password forgotten, Click here` 链接找回凭据。

    * 允许新用户通过点击 `Continue` 按钮注册应用程序，这将跳转到注册用户页面。


    如果我们查看此页面上可用的对象，它们如下帮助我们实现业务目标：


    * `Email Address`: 文本框

    * `Password`: 文本框

    * `Sign In`: 按钮

    * `Password forgotten`: 链接

    * `Continue`: 按钮


    随着应用程序的发展，我们应该意识到对象信息可能会发生变化，HTML 属性可能会改变，添加新对象或移除旧对象。例如，`Password forgotten`
    可能会变成按钮，或者 `Continue` 按钮可能会变成链接，以此此类推。但该页面的业务目标不太可能改变。


    页面对象模型概念认为我们将对象信息与页面的业务逻辑分离，并将页面对象与测试脚本代码分开维护。这有助于我们在代码层面引入模块化，因为在开发和设计测试脚本时，作为业务流一部分的相同对象会被反复调用。如果某个构建版本中这些对象发生了变化，在没有实现页面对象的情况下，我们需要打开所有测试脚本进行修改。实现页面对象模型也有助于单独维护和管理对象信息。


    为了继续，让我们选取登录注销场景并创建文件来实现其页面对象模型。为此，我们创建一个类并给它一个合适的名称——`login_pom`。在该文件中，我们完成的第一工作为页面的每个
    HTML 对象创建 `By` 类对象。然后，我们为在这些对象上执行每个的操作创建函数。例如，让我们选取 `My Account` 链接：


    `My Account` 链接的 `By` 对象代码：


    ```

    By myaccount_link= By.linkText(“My Account”);

    ```


    为在 `My Account` 链接上执行的点击操作创建函数：


    ![](img/p146.jpg)


    我们应该注意到函数的返回类型是类本身；其原因是，我们需要在执行操作后获得页面引用，以便后续操作可以在其上进行。


    现在，让我们选取页面所有的对象并查看如下代码：


    ![](img/p147.jpg)![](img/p148.jpg)


