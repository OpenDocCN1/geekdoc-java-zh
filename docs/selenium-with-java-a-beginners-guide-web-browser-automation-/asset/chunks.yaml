    从 Selenium 3.0 开始，由于 W3C 将其纳入规范并供浏览器采用以兼容 Selenium，提供驱动程序以便 Selenium 与您通信的责任落在了浏览器公司身上。因此，现在
    Chrome 必须提供 `Chrome driver`，Internet Explorer 必须提供 `Internet Explorer driver`，而
    Firefox 则提供 `geckodriver`。


    在理想情况下，用户应该在系统中安装最新的浏览器版本，然后下载与之对应的驱动程序版本。或者根据你系统中可用的浏览器版本，检查哪个驱动程序版本适用并相应下载。


    所以，首先，在系统中创建一个你拥有读写权限的文件夹。在该文件夹中，我们将从托管它们的各自网站下载三个不同的驱动执行文件。


    | 浏览器 | 版本 | 驱动程序—URL—下载 |

    | :--- | :--- | :--- |

    | Chrome | Chrome 版本 83 | [`chromedriver.chromium.org/downloads`](https://chromedriver.chromium.org/downloads)
    |

    | Firefox | Geckodriver V0.26.0 | [`github.com/mozilla/geckodriver/releases`](https://github.com/mozilla/geckodriver/releases)
    |

    | Internet Explorer | IEDriverServer 3.150.1 | [`www.selenium.dev/downloads/`](https://www.selenium.dev/downloads/)
    |


    **表 3.1:** 三个不同的驱动执行文件


