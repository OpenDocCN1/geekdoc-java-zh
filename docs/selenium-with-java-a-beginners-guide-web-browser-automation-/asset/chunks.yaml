  trans: "\n\n注册用户后的下一个理想步骤是使用注册时使用的凭据登录应用程序。我们将使用用户名 `bpb@bpb.com` 和密码 `bpb@123`\
    \ 通过以下步骤登录应用程序：\n\n1. 使用 URL 打开应用程序——[`practice.bpbonline.com/`](http://practice.bpbonline.com/)\n\
    \n2. 点击下图中所示的 `My Account`（我的账户）链接：\n\n    ![](img/Figure-2.17.jpg)\n\n    **图\
    \ 2.17:** 我的账户链接\n\n3. 在登录页面上，提供用户名和密码凭据，并点击 `Sign In`（登录）按钮：\n\n    ![](img/Figure-2.18.jpg)\n\
    \n    **图 2.18:** 账户登录\n\n4. 如果登录成功，我们应该能看到 `My Account Information`（我的账户信息）页面，在该页面我们可以看到更改个人信息、查看订单、修改地址、更改密码等链接。下图显示了这些：\n\
    \n    ![](img/Figure-2.19.jpg)\n\n    **图 2.19:** 我的账户信息页面\n\n5. 我们接下来的步骤是从应用程序注销返回主页。要执行退出操作，我们将首先点击\
    \ `Log Off`（退出）链接。\n\n    ![](img/Figure-2.20.jpg)\n\n    **图 2.20:** 退出链接\n\n\
    6. 下一步是点击 `Continue`（继续）以继续退出流程。\n\n    ![](img/Figure-2.21.jpg)\n\n    **图 2.21:**\
    \ 完成退出\n\n因此，我们能够成功地登录和注销应用程序。在本书中，为了理解环绕 Selenium 的各种概念，这将是我们使用的默认场景。我们还需要注意，应用程序中还有其他可用场景，例如更改个人信息、购买产品、查看购物车等以及更多，这留给读者自行探索并记录它们的步骤。\n\
    \n在书中的合适时地方，如果我们需要其他场景，将会在相应的章节中进行定义。\n\n# 其他应用程序](#toc.xhtml_s16a)\n\n在书中，我们使用的默认应用程序是\
    \ BPB 练习应用程序。但有时，为了探索和理解某些概念，我们可能会使用以下应用程序：\n\n* Internet Herokuapp，该应用程序的 URL\
    \ 为 [`the-internet.herokuapp.com/`](https://the-internet.herokuapp.com/)。该应用程序由\
    \ Elemental Selenium 维护，为我们提供了各种小型示例来探索不同类型 HTML 元素的原理。这是一个非常好的练习应用程序，并用于理解 Selenium\
    \ 如何处理各种 Web 元素。\n\n    ![](img/Figure-2.22.jpg)\n\n    **图 2.22:** Internet Heroku\
    \ app\n\n* 我们可以用来练习概念的其它应用程序 URL 包括任何电子商务网站、显示电影、书籍和家居装饰信息的网站。在书中，每当我们使用其他应用程序来理解场景时，我们都会解释其\
    \ URL 和流程。\n\n因此，我们查看了可以作为测试对象的应用程序，以探索我们如何使用 Selenium 实现这些场景的自动化。\n\n# 结论](#toc.xhtml_s17a)\n\
    \n在本章中，我们学习了如何配置系统以安装 Java、Eclipse 并使用它们来建立项目。然后，我们验证了项目是否实际上可以运行。在这一方面得到确认后，我们下载并设置了\
    \ Selenium jar 包。为了确保我们的项目可以使用 Selenium jar 包并操作浏览器，我们下载并设置了浏览器驱动程序，它将作为通信桥梁，允许\
    \ Selenium 与浏览器进行通信。\n\n我们还演示了 BPB 练习应用程序的操作。我们详细查看了注册用户和登录注销的两个场景。我们还讨论了其他应用程序，我们可以在学习\
    \ Selenium 时使用它们来理解和实现场景。\n\n在接下来的章节中，我们将讨论 Selenium 实现的三个重要支柱。`WebDriver` 是一个与浏览器通信的接口；`WebElement`\
    \ 提供处理页面上 HTML 元素的方法；`By` 类帮助创建定位器以识别页面上的元素。\n\n# 问题](#toc.xhtml_s18a)\n\n1. 我们使用了哪个版本的\
    \ eclipse？\n2. 我们在本章中安装了什么版本的 Java？\n3. 对于 Eclipse，Photon 是什么？\n4. Firefox 驱动程序的名称是什么？\n\
    5. 人可以从哪里下载 Internet Explorer 的驱动程序？\n\n# 第 3 章](#toc.xhtml_c03)\n\n# WebDriver,\
    \ WebElement, 和 By](#toc.xhtml_c03)\n\nSelenium 作为一个流行的浏览器自动化工具，具有三个主要组件：Selenium\
    \ IDE、`WebDriver` 和 Grid。在本章中，我们将了解 `WebDriver` 的三个主要重要组件，即 `WebDriver` 接口、`WebElement`\
    \ 接口和 `By` 类。我们编写的任何自动化浏览器的脚本都将使用这些实体可用的方法。`WebDriver` 接口为我们提供了各种自动化浏览器和获取与 页面相关信息的方法。`WebElement`\
    \ 指页面上的 HTML 元素。该接口为我们提供了各种方法，帮助我们自动化操作以处理不同类型的 HTML 元素。最后，`By` 类帮助我们创建定位策略来定位\
    \ Web 页面上的元素。\n\n# 结构](#toc.xhtml_s19a)\n\n在本章中，我们将讨论以下：\n\n* WebDriver 及其目的\n\
    \    * WebDriver 的方法\n    * 三种浏览器的 WebDriver [IE, FF]\n    * 关于 WebDriver 的异常\n\
    * WebElement 接口\n    * WebElement 的方法\n    * 关于 WebElement 的异常\n* 关于 By 类\n  \
    \  * By 的方法\n    * 理解定位器\n    * 关于 By 的异常\n\n# 目标](#toc.xhtml_s20a)\n\n在学习本单元内容后，你将能够：\n\
    \n* 学习什么是 `WebDriver`，并使用其方法实现浏览器自动化。\n* 理解什么是 `WebElement`，并使用其方法处理 Web 元素。\n\
    * 理解用于创建定位器的 `By` 类以及不同的策略。\n* 在项目中设置浏览器驱动程序。\n* 理解在使用 `WebDriver`、`WebElement`\
    \ 和 `By` 时可能遇到的异常。\n\n# WebDriver 及其目的](#toc.xhtml_s21a)\n\n`WebDriver` 是一个主接口，用于建立浏览器遵循的规则以便进行测试。接口关注的功能有：\n\
    \n* 控制浏览器\n    `WebDriver` 接口为我们提供了方法，帮助我们控制浏览器相关的操作，如打开浏览器、关闭浏览器、管理窗口大小、超时事件等。正如我们在下一节详细讨论方法所示，我们将看到更多内容。\n\
    \n* 选择 Web 元素\n    `WebDriver` 接口提供了两种方法查找元素或元素列表。这些方法是 `findElement` 和 `findElements`，它们分别为我们提供元素或元素列表。一旦识别了\
    \ Web 元素，就可以对其进行操作。\n\n* Web 页面信息\n    `WebDriver` 接口为我们提供了方法，帮助获取当前页面标题、当前 URL\
    \ 和页面上的内容。这些方法提供的信息与 Web 页面相关，也可以用于验证。\n\n"
