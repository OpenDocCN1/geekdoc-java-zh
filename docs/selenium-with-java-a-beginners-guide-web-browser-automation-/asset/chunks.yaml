    2. Once the page is launched, fetch the contents displayed in the WYWYG editor\n\
    \   ![](images/Figure-6.14.jpg)\n   **Figure 6.14:** IFrame with WYWYG editor\n\
    3. Print it on console\n\nWhen we try and inspect the WYWYG editor on the page,\
    \ we find that this is inside an IFrame, which looks as follows:\n\n![](images/Figure-6.15.jpg)\n\
    \n**Figure 6.15:** HTML associated with IFrame page\n\nSo, to fetch the contents\
    \ from the editor, we will first have to switch the focus to the IFrame, and only\
    \ then the driver object will be able to access the elements present on the Web\
    \ page. The code will look as follows:\n\n```\nimages/p102.jpg\n```\n\nIn the\
    \ preceding code, we will see that we used the IFrame id property to identify\
    \ it. We then used the `switchTo` command to shift our focus on the Web page.\
    \ Once the driver points to it, we can then access the `p` HTML element text and\
    \ display it on the console. Once our work is done, we switch the focus back to\
    \ the main HTML page using the method `switchTo().defaultContent()`.\n\nThus,\
    \ we conclude the working with IFrame element and the Web page in it using Selenium.\n\
    \n# Working with HTML window (#toc.s55a)\n\nMany times, we come across applications,\
    \ which on launching open a new page, like an eCommerce website opens an advertisement\
