  trans: '


    为了在 Chrome 浏览器和 Firefox 浏览器上并行执行测试，我们将对 `testng.xml` 文件进行修改。使用的 `testng.xml` 文件如下：


    ![](img/p201.jpg)


    当我们运行测试套件文件时，将看到 Chrome 和 Firefox 浏览器同时启动并在它们上执行测试：


    ![](img/Figure-12.10.jpg)


    **图 12.10：** 在 Chrome 和 Firefox 上执行


    Selenium Grid 还提供了基于 Docker 的完整设置。因此，我们可以直接使用 Docker 环境来搭建由节点（node）和中心（hub）组成的网。然后使用它来运行测试。要了解更多信息，请访问
    URL——**[`github.com/SeleniumHQ/docker-selenium`](https://github.com/SeleniumHQ/docker-selenium)**。


    我们还可以使用各种云端解决方案，如 Sauce Labs、BrowserStack 和 LamdaTest，这些方案都使用 Selenium Grid 文件在云端建立实验室，从而为我们省去了维护本地测试自动化实验室的麻烦。


    # 结论


    在本章中，我们学习了 Selenium 的 Selenium Grid 组件。我们理解了什么是中心（hub）和节点（node）。我们看到了为 Chrome
    和 Firefox 浏览器创建中心和节点。这些中心和节点运行在同一台本地机器上，我们在上面单独以及随后并行执行了登录/注销场景。


    # 问题


    1. Selenium Grid 是什么用的？

    2. 你可以使用 Docker 搭建 Selenium Grid 吗？

    3. 中心默认监听哪一个端口？


