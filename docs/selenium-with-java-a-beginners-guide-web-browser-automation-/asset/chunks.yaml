    # 献给


    **Neeal** 和 **Maisha**


    &&


    **Dr Neelaksh** 和 **Dr Manju**


    我的孩子们，他们让我继续看到生活的奇迹。


    以及我的父母，因为有他们才有了我。


    # 关于作者


    **Pallavi Sharma** 是一位多才多的专业人士。她的职业生涯开始于 `Virginia Tech` 的 `Dr Naren Ramakrishnan`
    之后担任研究学者，在那里她参与了用于生物信息学的数据挖掘项目。


    在 `Crestech Software Systems`，她是 `CEO` 旗下卓越中心团队的一员，负责为交付团队提供尖端解决方案。她曾工作过 `Selenium`、`Watir`、`RFT`、`JMeter`、`LoadRunner`、`Rational
    Robot` 等工具。


    她管理着内部产品 `OpKey` 的开发团队、测试团队、支持部门、预售、营销和技术写作团队。她还管理公司的专利和商标部门。


    2014 年，她创立了 `5 Elements Learning`，在那里指导人们学习 `Selenium`、`Appium`、`Cucumber` 生态系统（包括测试自动化项目的技术栈）。她教授使用
    `Java`、`Python`、`CSharp` 和 `Ruby` 等编程语言。她教过来自全球的超过 1000 人。她还是 `Udemy` 的讲师，拥有超过
    2 万名粉丝，并为测试人员主持了许多付费和免费课程。


    她继续活跃于各类全球会议，如 `Selenium Summit`、`APISummit Delhi Software Testing Conference`、`Selenium
    India Conference`、`Global Testing Retreats`。她曾以`评审`、`组织委员会成员`和`演讲者`的身份参加。


    她非常感谢能得到 `Michael Bolton` 和 `Maaret Pyhäjärvi` 在`探索测试（Explor Testing）` 概念方面的指导和教学。


    自 2021 年以来，她是 `Agile Testing Alliance` 的指导委员会成员，也是长期的顾问委员会成员。她的工作涉及设计关于各种全球自动化认证的课程、组织会议，并带领团队处理
    `Agile Testing Alliance` 的社交媒体运营。


    她是 `BPB publications` 的出版作者。她的第一本书 `Selenium with Python A beginner''s book` 是亚马逊该类别中排名前
    10 的书籍之一。她的第二本书 `Selenium 4 – A Quick and Practical Guide` 已在 `LeanPub` 上架。


    她相信对自己的学习成果进行认证，持有多种认证，如 `ISTQB`、`CP-SAT`、`CP-WST`、`CP-DOF`、`Cucumber School Completion`、`SpecFlow`
    等。


    她是一个热心的读者、旅行者和内心的作家。她喜欢小说、非虚构类，以及根据自己的生活经历创作诗歌和短故事。她在 `Medium` 上分享作品，可以通过 [`medium.com/@pallavimuse`](https://medium.com/@pallavimuse)
    找到她。


    她是更大的利益信者，喜欢以身作则。她将资源投入到 `eVidyaloka`、`People for Animal`、`WildLife SOS` 和 `Jabarkhet`
    森林保护区等组织。


    # 关于评审员


    **Jaya Saini** 在自动化测试和 API 测试方面拥有 6.5 年的经验，使用 `Selenium`、`TestNg`、`Robot Framework`、`Postman`
    等工具以及 `Java`、`JavaScript`、`Python` 等编程语言。`Jaya Saini` 在 Alwar 的 `Rajasthan Technical
    University` 计算机科学与工程学士。她曾就于 `Sopra Banking` 和 `Thinksys software`。目前在 Noida 的
    `Thinksys software` 担任自动化测试负责人。


    # 致谢


    感谢几位在我本书期间提供持续支持的人。首先，我要感谢 `Selenium` 的创始人 `Jason Huggins` 以及 `Selenium Webdriver`
    的创始人 `Simon Stewart` 的创造。感谢 `Selenium` 项目和社区背后的人，他们持续为该项目工作并向世界提供服务。


