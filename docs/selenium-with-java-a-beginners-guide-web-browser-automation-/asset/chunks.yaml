    \n`at codefiles.demoOfExplicitWait.main(demoOfExplicitWait.java:``33``)`\n\n`Caused\
    \ by: org.openqa.selenium.NoSuchElementException: no such element: Unable to locate\
    \ element: {``\"method\"``:``\"link text\"``,``\"selector\"``:``\"Junk\"``}`\n\
    \n`(Session info: chrome=``90.0``.4430.212)`\n\n# [Conclusion](#toc.xhtml_s42a)\n\
    \nHence, we have learned in this chapter about the need for waits in our automation\
    \ scripts, the types of waits in Selenium, and how we can implement it.\n\nIn\
    \ the upcoming chapter, we will discuss about working with different types of\
    \ HTML elements like form elements, Web tables, and dropdown elements.\n\n# [Questions](#toc.xhtml_s43a)\n\
    \n1.  Why do we need synchronization in our automation scripts?\n\n2.  Explain\
    \ the meaning of implicit wait and how is it implemented?\n\n3.  What is ExpectedConditions\
    \ class in Selenium?\n\n4.  Which exception comes when WebDriverWait fails?\n\n\
    # [CHAPTER 5](#toc.xhtml_c05)\n\n# [Working with WebElements—Form, Table, and\
    \ Dropdown](#toc.xhtml_c05)\n\nIn the earlier chapters, we discussed about the\
    \ Selenium libraries, the methods available with them to handle browser, Web element,\
    \ and create locators. We also discussed about how we can use the concept of waits\
    \ to ensure reliability with our scripts, at the same time, taking care of the\
    \ speed of the execution. In this chapter, we will discuss about working with\
    \ different HTML elements, the type of action we perform on them during automation,\
    \ and how Selenium allows us to work on them. We will discuss the form HTML elements,\
    \ the Web table element, and the dropdown in Part 1.\n\n# [Structure](#toc.xhtml_s44a)\n\
    \nThe chapter is divided into the following sections:\n\n*   Working with form\
    \ elements such as textbox, radio button, checkbox, and so on\n\n*   Working with\
    \ the Web Table element\n\n*   Working with the Dropdown element\n\n# [Objectives](#toc.xhtml_s45a)\n\
    \nAfter studying this chapter, you will be able to perform the following:\n\n\
    *   Automate the handling of the form HTML elements\n\n*   Understand and work\
    \ with the Web table elements\n\n*   Understand and work with the dropdown elements\n\
    \n# [Working with form elements](#toc.xhtml_s46a)\n\nForm is an HTML tag, which\
    \ contains different types of HTML elements. The form element is used in HTML\
    \ websites to capture user input. The information is generally sent to the server\
    \ for further work. The form element in HTML is represented as **`<form>,`** and\
    \ it acts as a container for different elements such as text boxes, radio buttons,\
    \ submit buttons, checkboxes, and so on. All these different elements are represented\
    \ with the HTML tag **`<input>`**. The different types of input elements are available\
    \ as follows:\n\n| **Type** | **HTML information** | **Description** |\n\n| Text\
    \ | **`<input type=”text”>`** | Displays a text input field. |\n\n| Radio | **`<input\
    \ type=”radio”>`** | Displays a radio button. |\n\n| Checkbox | **`<input type=”checkbox”>`**\
    \ | Displays a checkbox. |\n\n| Submit | **`<input type=”submit”>`** | Displays\
    \ a submit button. |\n\n| Button | **`<input type=”button”>`** | Displays a button.\
    \ |\n\n**Table 5.1:** Different types of input elements\n\nIn our practice application,\
    \ the scenario of change profile information is where we will see most of the\
    \ input elements from *[table 5.1](#c05.xhtml_tab5_1)*. Let us explore that section.\
    \ For the change profile scenario, we will have to perform the following steps:\n\
    \n1.  Open the application using URL: **[http://practice.bpbonline.com/index.php](http://practice.bpbonline.com/index.php)**.\n\
    \n2.  Click on the **`My Account`** link as shown in *[figure 5.1](#c05.xhtml_fig5_1)*:\n\
    \n    ![](images/Figure-5.1.jpg)\n\n    **Figure 5.1:** My Account link\n\n3.\
    \  On the **`Sign In`** page, provide the login details: username is **`bpb@bpb.com`**\
    \ and password is **`bpb@123`**. Click on the **`Sign In`** button as shown in\
    \ *[Figure 5.2](#c05.xhtml_fig5_2)*:\n\n    ![](images/Figure-5.2.jpg)\n\n   \
    \ **Figure 5.2:** Sign In page\n\n    In the preceding figure, we see the following\
    \ input elements: text and password.\n\n4.  After signing in, you reach the **`My\
    \ Account Information`** page. Here, we need to click on the link which says,\
    \ **`View or change my account information`**.\n\n    ![](images/Figure-5.3.jpg)\n\
    \n    **Figure 5.3:** My Account Information page\n\n5.  This will take us to\
    \ the **`Change Profile`** page. On this page, we see the input element text and\
    \ radio.\n\n    ![](images/Figure-5.4.jpg)\n\n    **Figure 5.4:** Change Profile\
    \ page"
