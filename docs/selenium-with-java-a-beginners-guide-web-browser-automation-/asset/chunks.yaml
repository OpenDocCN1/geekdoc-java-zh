    ## 创建并注册带有 Chrome 浏览器的 Windows 节点


    要在本地 Windows 上注册 Chrome 浏览器节点，我们需要执行以下步骤：


    1. 根据系统中对应的 Chrome 浏览器版本下载 Chrome 驱动。使用 URL——`[`chromedriver.chromium.org/`](https://chromedriver.chromium.org/)`。


    2. 下一步是创建节点，我们需要打开命令行提示符，切换到 Selenium 服务器所在的目录，并输入以下命令：


    ```

    java -Dwebdriver.chrome.driver="chromedriver\chromedriver.exe" -jar selenium-server-standalone-3.141.59.jar
    -role node -hub http://localhost:4444/grid/register -browser "browserName=chrome"
    -port 5557

    ```


    ![](img/Figure-12.8.jpg)


    **图 12.8：**启动 Chrome 浏览器节点


    正如我们对 Firefox 节点节点一样，让我们也理解一下 Chrome 节点的命令


    ```

    java -Dwebdriver.chrome.driver="chromedriver\chromedriver.exe" [这部分提供了 chromedriver
    的路径，有助于 chrome 浏览器的执行]

    -jar selenium-server-standalone-3.141.59.jar -role node -hub http://localhost:4444/grid/register
    -browser "browserName=chrome" -port 5557

    ```


