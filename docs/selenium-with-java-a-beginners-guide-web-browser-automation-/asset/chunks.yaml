- fmt: "\nWe can install Maven as a plugin in the eclipse IDE. To perform this action,\
    \ we will be doing the following steps:\n\n1. Open Eclipse IDE.\n\n2. We need\
    \ to click on `Help` and select `Install New Software…`, as shown in the following\
    \ image:\n\n   ![](images/Figure-11.1.jpg)\n\n   **Figure 11.1:** Installing Maven\n\
    \n3. It will now open a new popup window, on which we will type the link to download\
    \ Maven from. The link is as follows: [https://download.eclipse.org/technology/m2e/releases/latest/](https://download.eclipse.org/technology/m2e/releases/latest/)\n\
    \n   ![](images/Figure-11.2.jpg)\n\n   **Figure 11.2:** Maven integration for\
    \ Eclipse\n\n4. We now have to click on the `Next` button to allow the installation\
    \ to happen. It will show a page to accept the license agreement. Click on `I\
    \ accept`.\n\n   ![](images/Figure-11.3.jpg)\n\n   **Figure 11.3:** License agreement\n\
    \n5. Click on the `Finish` button to complete the installation. It may take some\
    \ time.\n\nAfter the installation is done, we should be able to create a Maven\
    \ project.\n\n# Creating a Maven project\n\nTo use Maven for project creation,\
    \ we will have to first create a Maven project in Eclipse. Let us look at the\
    \ steps to perform the action:\n\n1. Go to `File`, and select `New`, and choose\
    \ `Project…` from it:\n\n   ![](images/Figure-11.4.jpg)\n\n   **Figure 11.4:**\
    \ Creation of project\n\n2. This will open a `New Project` wizard. From there,\
    \ select `Maven`, and click on `Maven Project`.\n\n   ![](images/Figure-11.5.jpg)\n\
    \n   **Figure 11.5:** Maven project creation\n\n3. Click on the `Next` button,\
    \ and select the checkbox to create a simple project and skip archetype selection.\n\
    \n   ![](images/Figure-11.6.jpg)\n\n   **Figure 11.6:** Simple project archetype\n\
    \n4. When we click on the `Next` button, we will see a pop up to create a new\
    \ Maven project:\n\n   ![](images/Figure-11.7.jpg)\n\n   **Figure 11.7:** Maven\
    \ project configuration\n\n   In [figure 11.7](#c11.xhtml_fig11_7), we need to\
    \ provide some important information which is explained as follows:\n\n   * **Group\
    \ Id**: A name of the company/domain or group which creates the project. Similar\
    \ to a Java package. We are providing `org.bpb.com`.\n\n   * **Artifact Id**:\
    \ This is the name that will be given to the project. The name we are providing\
    \ is `demoMavenProject`.\n\n5. The rest of the fields can remain blank. And we\
    \ click on the `Finish` button.\n\n   ![](images/Figure-11.8.jpg)\n\n   **Figure\
    \ 11.8:** Group ID and Artifact ID\n\n6. As we click on `Finish`, we can see the\
    \ Maven project created, to which, as required for our projects, we can add files.\n\
    \n   ![](images/Figure-11.9.jpg)\n\n   **Figure 11.9:** Maven project tree\n\n\
    # What is Maven repository?\n\nMaven repository is a place that holds built artifacts\
    \ and dependencies of various types. The location of the maven repository could\
    \ be local or remote, where all dependencies are stored. In this chapter, we will\
    \ see Maven central repository, which is a repository provided by the Maven community.\
    \ It contains a large number of commonly used libraries. To visit it, we will\
    \ use this link: [https://mvnrepository.com/](https://mvnrepository.com/).\n\n\
    \   ![](images/Figure-11.10.jpg)\n\n   **Figure 11.10:** Maven repository\n\n\
    For example, if we search for Selenium, this is what we will see:\n\n   ![](images/Figure-11.11.jpg)\n\
    \n   **Figure 11.11:** Selenium dependency JARs in Maven\n\nWe can select any\
    \ of the available builds in Selenium and copy the dependencies information to\
    \ the `pom.xml`. The dependency information looks as follows for the version of\
    \ Selenium used in this book which is 3.141.59:\n\n   ![](images/Figure-11.12.jpg)\n\
    \n   **Figure 11.12:** Selenium dependency XML\n\n# What is project object model?\n\
    \nA project object model is an XML file available with every Maven project. It\
    \ is the basic unit of work in Maven. It contains all the information about the\
    \ project, dependencies, and any configurations that would be required to build\
    \ the maven project. The `pom.xml` is created as we create a Maven project.\n\n\
    The most basic information any pom file will contain is as follows:\n\n   ![](images/Figure-11.13.jpg)\n\
    \n   **Figure 11.13:** Default POM.xml\n\nLet us look at the `pom.xml` of our\
    \ project, which we can see in the project tree.\n\n   ![](images/Figure-11.14.jpg)\n\
    \n   **Figure 11.14:** Default POM.xml file\n\nA pom.xml contains a `dependencies`\
    \ tag which contains multiple `dependency` tags. Each `dependency` tag contains\
    \ `groupId`, `artifactId`, and `version` of the dependency.\n\n```xml\n<dependencies>\n\
    \    <dependency>\n        <groupId>org.seleniumhq</groupId>\n        <artifactId>selenium-java</artifactId>\n\
    \        <version>3.141.59</version>\n    </dependency>\n</dependencies>\n```\n\
    \nThe pom.xml also contains a `build` tag which is used to configure plugins for\
    \ the project.\n\n```xml\n<build>\n    <plugins>\n        <plugin>\n         \
    \   <groupId>org.apache.maven.plugins</groupId>\n            <artifactId>maven-compiler-plugin</artifactId>\n\
    \            <version>3.8.1</version>\n        </plugin>\n    </plugins>\n</build>\n\
    ```\n\nThe pom.xml also contains a `properties` tag which is used to define variables\
    \ that can be used throughout the pom.\n\n```xml\n<properties>\n    <maven.compiler.source>1.8</maven.compiler.source>\n\
    \    <maven.compiler.target>1.8</maven.compiler.target>\n</properties>\n```\n\n\
    The pom.xml also contains a `parent` tag which is used to inherit configuration\
    \ from a parent project.\n\n```xml\n<parent>\n    <groupId>org.apache.maven</groupId>\n\
    \    <artifactId>maven-starter-parent</artifactId>\n    <version>2.4.0</version>\n\
    </parent>\n```\n\nThe pom.xml also contains a `dependencyManagement` tag which\
    \ is used to define the versions of dependencies for the project.\n\n```xml\n\
    <dependencyManagement>\n    <dependencies>\n        <dependency>\n           \
    \ <groupId>org.seleniumhq</groupId>\n            <artifactId>selenium-java</artifactId>\n\
    \            <version>3.141.59</version>\n        </dependency>\n    </dependencies>\n\
    </dependencyManagement>\n"
