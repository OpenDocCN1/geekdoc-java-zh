    \ name which we use for `DataProvider` is passed to the `@Test` method. There\
    \ could be more than one data provider available in a class file. In an example,\
    \ which we will take to understand the usage of `DataProvider`, we will pick data\
    \ for user details from a CSV file. The code for this will be written in the `@DataProvider`\
    \ annotation. We will then use this to parameterize the `@Test` method. Let us\
    \ look at the following code.\n\n`loginLogoutWithDataProvider`—Java code file:\n\
    \n![](images/p139.jpg)![](images/p140.jpg)\n\nIn the preceding file, we pass the\
    \ browser information through `Parameter`, and use the `@DataProvider` annotation\
    \ to read information from the CSV file and pass it to the `@Test method`. We\
    \ will note that the test gets executed twice. Let us look at the result file\
