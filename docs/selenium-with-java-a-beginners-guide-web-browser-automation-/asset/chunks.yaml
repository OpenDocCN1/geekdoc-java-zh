    \ of alert handling, we will work with the Prompt Box. For this, we will perform\
    \ the following steps:\n\n1. Launch the Web application using the URL: **[https://the-internet.herokuapp.com/javascript_alerts](https://the-internet.herokuapp.com/javascript_alerts)**\n\
    2. Click on the third button:\n   ![](images/Figure-6.10.jpg)\n   **Figure 6.10:**\
    \ Final type of alert handling\n3. We will here fetch the text associated with\
    \ the alert, and send the text `Hello how are you` to it.\n   ![](images/Figure-6.11.jpg)\n\
    \   **Figure 6.11:** Fetching the text associated with the alert\n4. We finally\
    \ accept the alert, and see the message sent to the prompt box on the Web page\
    \ once the alert is closed.\n   ![](images/Figure-6.12.jpg)\n   **Figure 6.12:**\
    \ Result obtained\n\nLet us write the code to handle the preceding steps:\n\n\
    ```\nimages/p98.jpg\n```\n\nIn all the preceding codes, where we handle the alert,\
    \ we see there is a function from the driver which we use called as `switchTo().alert`.\
    \ The `switchTo()` is a function associated with the `Webdriver` object, and it\
    \ allows us to switch our focus to an alert, a frame, or a new window. Here, we\
    \ have used it for the alert.\n\nWe have seen what are the different types of\
    \ Java script alerts, also known as popups, and how to handle them using Selenium.\
    \ In the next section, we will talk about Frame.\n\n# Working with Frame and IFrame\
    \ (#toc.s54a)\n\nThe frame tag allows us to divide the HTML into sections, each\
    \ section is supported by the. An example is as follows:\n\n```\nimages/figure-no.jpg\n\
    ```\n\nThe Web page will look as follows:\n\n![](images/Figure-6.13.jpg)\n\nIf\
    \ we have an HTML page, which contains an IFrame, we will first have to switch\
    \ the focus to the IFrame, and only then the driver object will be able to access\
