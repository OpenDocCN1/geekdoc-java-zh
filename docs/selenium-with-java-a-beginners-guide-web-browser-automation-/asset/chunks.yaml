  trans: "\n\n`WebDriverWait` 接口为我们提供了 `until()` 方法。该方法接受一个 `ExpectedConditions` 类型的参数。`ExpectedConditions`\
    \ 是 Selenium WebDriver 的一个类，它为我们许多方法来检测事件的发生。例如，`elementToBePresent`、`elementToBeClickable`、`alertWindowPresent`\
    \ 等。\n\n**提示：关于 ExpectedConditions 方法的更多此类信息可以可以在 [`www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/support/ui/ExpectedConditions.html`](https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/support/ui/ExpectedConditions.html)\
    \ 获取。**\n\n`WebDriverWait` 接口在实现时需要一个驱动实例、一个超时时间和和一个 `ExpectedConditions` 对象。让我们来看一个想要实现本地等待或显式等待的场景。我们将以登录场景为例，并在如下脚本所示，设置一个\
    \ `WebDriverWait` 来等待 `Log Off`（注销）链接的出现。只有当 `Log Off` 链接出现时，我们才会继续执行注销操作。\n\n\
    ![](img/p67.jpg)\n\n在前面的代码中，我们应该注意到，在使用 `WebDriverWait` 之前，我们将隐式等待设置为 0，在显式等待使用结束后，我们将其设回\
    \ 10 秒。这里我们需要注意的是，在代码中不应同时使用隐式等待和显式等待。如果我们正在实现显式等待，会将隐式等待设置为 0。这样做的原因是这些等待可能会相互干扰，并导致我们代码中出现运行时执行问题。\n\
    \n# 遇到异常\n\n由于我们在 Selenium 中使用了两种等待命令，我们可能会遇到以下异常：\n\n`No Such Element Found`\
    \ 和 `TimeOutException`。`NoSuchElementFound` 异常出现在脚本使用给定的定位技术等待元素在页面上出现，但在给定的持续时间内无法找到它时。`TimeOutException`\
    \ 在脚本无法通过给定的定位器找到元素时生成，这导致了 `NoSuchElementFound` 异常，进一步调用 `TimeOutException`，因为我们无法在规定时间内找到该元素。因此，预期条件方法\
    \ `presenceOfElementLocatedBy`（如下文所示）会抛出 `NoSuchElementFound` 异常，进而导致超时异常的发生。\n\
    \n为了验证这一点，我们可以特意尝试使用链接文本 JUNK 查找链接。由于 JUNK 不存在，在使用 `WebDriverWait` 等待 10 秒后，我们将看到\
    \ `TimeOutException`，其内部生成是因为该元素不存在。\n\n![](img/p68.jpg)\n\n如下述脚本所示抛出的异常：\n\n\
    ```\nException in thread \"main\" org.openqa.selenium.TimeoutException: Expected\
    \ condition failed: waiting for presence of element located by: By.linkText: Junk\
    \ (tried for 10 second(s) with 500 milliseconds interval)\nat org.openqa.selenium.support.ui.WebDriverWait.timeoutException(WebDriverWait.java:95)\n\
    at org.openqa.selenium.support.ui.FluentWait.until(FluentWait.java:272)\nat codefiles.demoOfExplicitWait.main(demoOfExplicitWait.java:33)\n\
    Caused by: org.openqa.selenium.NoSuchElementException: no such element: Unable\
    \ to locate element: {\"method\": \"link text\", \"selector\": \"Junk\"}\n(Session\
    \ info: chrome=90.0.4430.212)\n```\n\n# 结论\n\n因此，在本章中，我们学习了自动化脚本中等待的必要性、Selenium\
    \ 中的等待类型以及我们如何实现它们。\n\n在接下来的章节中，我们将讨论如何处理不同类型的 HTML 元素，如表单元素、Web 表格和下拉元素。\n\n\
    # 问题\n\n1. 为什么自动化脚本中需要同步？\n2. 解释隐式等待的含义以及它是如何实现的？\n3. Selenium 中的 ExpectedConditions\
    \ 类是什么？\n4. 当 WebDriverWait 失败时会抛出什么异常？\n\n# 第 5 章：处理 Web 元素——表单、表格和下拉列表\n\n在早的章节中，我们讨论了\
    \ Selenium 库、使用它们提供的处理浏览器、Web 元素以及创建定位器的可用方法。我们还讨论了如何使用等待的概念来确保脚本的可靠性，同时兼顾执行速度。在本章中，我们将讨论如何处理不同的\
    \ HTML 元素、我们在自动化过程中对它们执行的操作类型，以及 Selenium 如何允许我们处理这些元素。我们将在第一部分讨论表单 HTML 元素、Web\
    \ 表格元素和下拉列表。\n\n## 结构\n\n本章分为以下部分：\n\n* 处理文本框、单选按钮、复选框等表单元素\n* 处理 Web 表格元素\n*\
    \ 处理下拉列表元素\n\n## 目标\n\n学习本章后，你将能够执行以下操作：\n\n* 自动化处理表单 HTML 元素\n* 理解并处理 Web 表格元素\n\
    * 理解并处理下拉元素\n\n# 处理表单元素\n\n表单（Form）是一个 HTML 标签，包含不同类型的 HTML 元素。表单元素用于 HTML 网站中捕用户输入。信息通常被发送到服务器进行后续处理。HTML\
    \ 中的表单元素表示为 `<form>`，它作为文本框、单选按钮、提交按钮、复选框等不同元素的容器。所有这些元素都用 HTML 标签 `<input>` 表示。不同类型的输入元素如下：\n\
    \n| 类型 | HTML 信息 | 描述 |\n| :--- | :--- | :--- |\n| Text | `<input type=\"text\"\
    >` | 显示文本输入框。 |\n| Radio | `<input type=\"radio\">` | 显示单选按钮。 |\n| Checkbox |\
    \ `<input type=\"checkbox\">` | 显示复选框。 |\n| Submit | `<input type=\"submit\">`\
    \ | 显示提交按钮。 |\n| Button | `<input type=\"button\">` | 显示按钮。 |\n\n**表 5.1：不同的输入元素**\n\
    \n在我们的练习应用中，修改资料（change profile）场景我们将看到 5.1 中的大部分输入元素。让我们探索该部分。对于修改资料场景，我们需要执行以下步骤：\n\
    \n1. 使用 URL 打开应用程序：[`practice.bpbonline.com/index.php`](http://practice.bpbonline.com/index.php)。\n\
    2. 点击如图 5.1 所示的 `My Account` 链接：\n   ![](img/Figure-5.1.jpg)\n   **图 5.1：我的账户链接**\n\
    3. 在 `Sign In` 页面提供登录详情：用户名为 `bpb@bpb.com`，密码为 `bpb@123`。点击如图 5.2 所示的 `Sign In`\
    \ 按钮：\n   ![](img/Figure-5.2.jpg)\n   **图 5.2：登录页面**\n   在前面的图中，我们看到了以下输入元素：文本和密码。\n\
    4. 登录后进入`Account Information`页面。在这里，我们需要点击显示 `View or change my account information`（查看或更改我的账户信息）的链接：\n\
    \   ![](img/Figure-5.3.jpg)\n   **图 5.3：我的账户信息页面**\n5. 这带我们进入`Change Profile`页面。在该页面上，我们看到了输入元素文本和单选按钮。\n\
    \   ![](img/Figure-5.4.jpg)\n   **图 5.4：修改资料页面**\n\n"
