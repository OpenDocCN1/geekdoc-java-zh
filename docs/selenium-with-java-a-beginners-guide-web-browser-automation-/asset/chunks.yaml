    Let us take an example to understand the implementation of the page object model
    for our demo site application login logout scenario. To understand the concept,
    let us take a page—sign in, which we see after we click on the `My Account` link
    from the main page or our application URL—[http://practice.bpbonline.com/](http://practice.bpbonline.com/).


    ![](images/Figure-9.1.jpg)


    **Figure 9.1:** Sign in page


    If we look at the preceding page, we see a few objects on the page, and there
    is a business objective associated with the page. The following describes the
    business objective of the page:


    * Allow a user with a valid credential to login into the application by providing
    a username and password.

    * Do not allow a user with invalid details to login to the application.

    * Allow a user who has forgotten password to retrieve its credential by clicking
    on the `Password forgotten, Click here` link.

    * Allow a new user to register to the application by clicking on the `Continue`
    button, which takes to the register user page.


    If we look at the objects which are available on this page, which help us achieve
    the business objectives as follows:


    * `Email Address`: Textbox

    * `Password`: Textbox

    * `Sign In`: Button

    * `Password forgotten`: Link

    * `Continue`: Button


    As the application develops, we should be aware that there is a possibility that
    object information will get changed, where the HTML properties can change, new
    objects can be added, old ones removed. For example, it is possible that the `Password
    forgotten` is changed into a button, or the `Continue` button is changed into
    a link, and so on. But the business objective of this page is less likely to undergo
    change.


    The concept of page object model says that we separate the object information
    from the business logic of the page. And maintain objects of the page separately
    from our test script code. This helps us in introducing modularity at the code
    level because it is possible as we develop and design test scripts, the same objects
