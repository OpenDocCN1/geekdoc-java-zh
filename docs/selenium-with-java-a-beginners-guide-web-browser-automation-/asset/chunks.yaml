    # Exception with Web Elements


    While working with Web elements, different kinds of exceptions can be encountered.
    The most common exception is `NoSuchElementElementException`. This exception is
    generated when the element we are trying to find on the Web page with the given
    locator information does not exist. Another Web element-specific exception we
    see commonly is `StaleElementReferenceException`. We see this issue when the page
    has refreshed, and element status is no longer associated with the available driver
    session. Another one commonly encountered is `ElementNotVisibleException`; this
    can be easily traced; if we look at the HTML properties of the element, we will
    find that it has a hidden property set to true. Such elements will also return
    `isDisplayed()` as false.


    **Note: More details on selenium exceptions can be found here: [https://www.selenium.dev/selenium/docs/api/py/common/selenium.common.exceptions.html](https://www.selenium.dev/selenium/docs/api/py/common/selenium.common.exceptions.html)**


    # About By class


    In the previous sections, we have seen the WebDriver object methods and the WebElement
    methods, which are available. Using these methods, we can work with the Web browser
    object and the Web elements of the page. To work with the Web elements which we
    see on the page, we need to first identify them uniquely on the page. The By class
    helps in identifying objects on the Web page. It uses the different location mechanisms
    based on which HTML objects can be recognized. Every HTML object is defined using
    an HTML tag, and HTML properties. Each HTML property is required to have a value
    associated with it. Using information associated with the HTML property and various
    techniques of the locator mechanism, we can can identify the object uniquely on
    the Web page. Once the object is identified uniquely, we can perform an action
    on it.


    The various ways in which Selenium allows an object to be recognized is by using
    the HTML property `ID`, `NAME`. It also allows identifying the object through
    its XPATH on-page. We can also use the CSS selector methodology, and finally,
    we can use the DOM approach to identify the object on the page.


    # Methods in By class


    The Selenium Java documentation website lists down the various methods associated
    with the By class:


    | Method | Description |

    | :--- | :--- |

    | `static By className(java.lang.String className)` | To find an element with
    the help of the `class` property. |

    | `static By cssSelector(java.lang.String cssSelector)` | To find the element
    by using the `css` strategy to find the element. |

    | `boolean equals(java.lang.Object o)` `WebElement findElement(SearchContext context)`
    | To return the first element found, which matches the locator used. |

    | `abstract java.util.List<WebElement> findElements(SearchContext context)` |
    To find the list of all elements which matches the locator used. |

    | `static By id(java.lang.String id)` | To find the element using the `id` property
    of the element. |

    | `static By linkText(java.lang.String linkText)` | To find the element using
    the link text value. |

    | `static By name(java.lang.String name)` | To find the element using the name
    property of the element. |

    | `static By partialLinkText(java.lang.String partialLinkText)` | To find the
    element using the partial Link text value of the element. |

    | `static By xpath(java.lang.String xpathExpression)` | To find the element by
    finding the xpath of the element in the HTML document. |


    **Table 3.4:** By class methods


    # Understanding locators


    Let us take an example of a Web page HTML snippet to understand locators:


    ```html

    <form name="login" action="https://5elementslearning.dev">

    ```


    ### ID

    The `id` locator is an attribute for an HTML element. For example, if we look
    at the preceding code, we see a sign-in button HTML, in which the HTML element
    has an id:


    ```html

    <button id="tdb5">Sign In</button>

    ```


    So to identify this button on the page, we can easily use the id attribute and
    create a locator as in `driver.findElement(By.id("tdb5"))`.


    ### NAME

    The `name` locator information is also fetched from the HTML element. Name is
    an attribute associated with the HTML elements. For example, in the preceding
    HTML snippet, we see an email text box and a password textbox; for both identification,
    we can use the name locator.


    *   Email: `driver.findElement(By.name("email_address"))`

    *   Password: `driver.findElement(By.name("password"))`


    ### XPATH

    The `xpath` information is derived from the path it takes to traverse to reach
    the HTML element of interest. It is mainly used for XML documents, but we can
    take the HTML page as an XML page and then create the path to reach the element
    of choice. The xpath could be of two types


    *   Absolute Xpath

    *   Relative Xpath


    The syntax of creating absolute xpath is always from the root node HTML, and for
    the relative path, it is from the node itself or any of the parents nodes which
    has a strong identification. We call those nodes landmark nodes, which have either
    an `ID` attribute or the `NAME` attribute. As with respect to those nodes, we
    can create the path to reach the node we want to work upon.


    For example, the relative xpath for the email text box could be:


    ```xpath

    //input[@name="email_address"]

    ```


    Or if we create with respect to the form node, which is containing the email address
    it will be:


    ```xpath

    //form/table/tr[1]/td[2]/input

    ```

