  trans: "\n\n一旦你设置了工作区的路径并点击 `Launch` 按钮，它将带你进入欢迎界面，我们将关闭该界面以继续创建我们的新 Java 项目。\n\n\
    ![](img/Figure-2.3.jpg)\n\n**图 2.3:** Eclipse 欢迎界面\n\n# 创建新的 Java 项目\n\n要在 eclipse\
    \ 中创建新的 Java 项目，我们点击点击 `File` 菜单，选择 `New`，然后选择 `Java Project`：\n\n![](img/Figure-2.4.jpg)\n\
    \n**图 2.4:** 创建新的 Java 项目\n\n我们提供项目名称并选择 JRE 版本。请注意，系统中可能存在多个 Java 版本，也可能存在多个\
    \ eclipse 版本。\n\n![](img/Figure-2.5.jpg)\n\n**图 2.5:** 项目详情\n\n点击 Next（下一步），然后点击\
    \ Finish（完成）按钮。这将你进入一个界面，你将在左侧的 `Package Explorer`（包管理器）窗口中看到 `ProjectWork`，它是可以展开的。\n\
    \n下部分创建一个新包并创建一个 `helloWorld.java` 程序以检查所有设置。为此，请右键点击 `src` 文件夹并创建一个新包。将其命名为 `packageHello`。然后右键点击该包并选择新建类（new\
    \ class），填写详细信息。提供名称 `helloWorld` 并选择主方法（main method）。\n\n![](img/Figure-2.6.jpg)\n\
    \n**图 2.6:** 创建 Hello World java 文件\n\n点击 `Finish`。\n\n在包管理器窗口的右侧，即 `helloWorld.java`\
    \ 文件打开的地方，会自动生成一段代码片段。在那里，我们将在主方法内部编写一行代码，在控制台窗口打印 hello world。最终代码看起来如下：\n\n\
    ```java\npackage packageHello;\n\npublic class helloWorld {\n    public static\
    \ void main(String[] args) {\n        // TODO Auto-generated method stub\n   \
    \     System.out.println(\"Hello World\");\n    }\n}\n```\n\n该程序的输出是——我们看到控制台窗口打印了\
    \ `Hello World`。\n\n# 添加 Selenium jar 包\n\n我们项目的下一步是添加 Selenium 的 jar 文件。我们将访问\
    \ URL——[`www.selenium.dev/downloads/`](https://www.selenium.dev/downloads/)，滚动到\
    \ Selenium client 和 WebDriver 语言绑定。当前的 beta 版本为 3.141.59，我们将下载它。\n\n![](img/Figure-2.7.jpg)\n\
    \n**图 2.7:** Selenium 客户端\n\n一旦在系统中下载了 ZIP 文件，我们将解压它们。这些 jar 文件必须添加到我们的 eclipse\
    \ 项目中。为此，我们将执行以下步骤：\n\n1. 右键点击 Java 项目并选择 `Properties`（属性）。\n   ![](img/Figure-2.8.jpg)\n\
    \   **图 2.8:** 项目属性\n\n2. 下选择 `Java Build Path | Libraries | Add External Jars`，然后浏览系统中解压\
    \ Selenium jars 的文件夹。\n   ![](img/Figure-2.9.jpg)\n   **图 2.9:** 添加 Selenium jars\n\
    \n3. 选择外部 jar，进入 `lib` 文件夹并将文件夹中的所有 jar 添加项目。\n   ![](img/Figure-2.10.jpg)\n \
    \  **图 2.10:** 添加 Selenium jars\n\n4. 一旦添加了 jar，我们的项目现在准备好编写 Selenium Java 程序了。\n\
    \n5. 在编写任何 Selenium 命令来驱动浏览器之前，我们应该准备好三个浏览器的驱动程序：Internet Explorer、Firefox 和 Chrome。\n\
    \n# 设置浏览器驱动\n\n从 3.0 开始，Selenium 采用 W3C 标准来驱动浏览器，因此 chrome 需要提供 Chrome 驱动，Internet\
    \ Explorer 需要提供 Internet Explorer 驱动，而 Firefox 提供 geckdriver。在理想情况下，系统中应该拥有最新的浏览器版本并随后下载相应的驱动程序。\n\
    \n首先，在系统中创建一个具有读写权限的文件夹。在该文件夹中，我们将从相应的网站下载三个驱动执行文件：\n\n| 浏览器 | 版本 | 驱动—URL |\n\
    | :--- | :--- | :--- |\n| Chrome | Chrome version 83 | [`chromedriver.org/downloads`](https://chromedriver.org/downloads)\
    \ |\n| Firefox | Geckdriver v0.26.0 | [`github.com/mozilla/geckriver/releases`](https://github.com/mozilla/geckriver/releases)\
    \ |\n| Internet Explorer | IEDriverServer 3.15.1 | [`www.selenium.dev/downloads/`](https://www.selenium.dev/downloads/)\
    \ |\n\n**表 2:** 浏览器驱动\n\n一旦下载了这些执行文件，将其从文件中解压并添加到如 `.exe` 文件所在的位置。将此文件夹添加到项目：\n\
    \n![](img/Figure-2.11.jpg)\n\n**图 2.11:** 浏览器驱动\n\n我们现在准备好运行简单测试了。\n\n# 应用程序概述\n\
    \n在整个课程，我们将使用一个应用程序进行练习。让我们首先理解工作流。应用程序是 [`practice.bpbon.com/`](http://practice.bpbon.com/)。\n\
    \n![](img/Figure-2.12.jpg)\n\n**图 2.12:** 应用程序\n\n这是一个带有基本工作流的示例应用程序，如下：\n\n*\
    \ 用户注册\n* 登录退出\n* 搜索产品\n* 购买产品\n* 修改配置\n* 查看订单\n\n探索应用程序的第一步是创建一个用户。要创建一个用户，我们需要使用用户注册场景。让我们看看实现它的步骤。\n\
    \n## 用户注册\n\n要注册用户，我们需要执行以下步骤：\n\n1. 使用 URL——[`practice.bpbon.com/`](http://practice.bpbon.com/)\
    \ 启动应用程序。\n\n2. 点击如下图所示的 `My Account`（我的账户）链接：\n   ![](img/Figure-2.13.jpg)\n\
    \   **图 2.13:** 我的账户链接\n\n3. 打开的页面是登录页面。在此页面，下一步是点击 `New User`（新用户）部分的 `Continue`（继续），进入用户注册页面。如下所示。\n\
    \   ![](img/Figure-2.14.jpg)\n   **图 2.14:** 点击继续按钮\n\n4. 一旦进入用户注册页面，我们需要填写所有强制性信息。请注意，我们在这里提供的电子邮件和密码与成功注册后登录时使用的用户凭据相同。我们还需要注意，没有必要提供有效的电子邮件。优选使用虚拟邮箱。\n\
    \   ![](img/Figure-2.15.jpg)\n   **图 2.15:** 用户注册页面\n\n5. 如果用户注册成功，我们将看到以下屏幕：\n\
    \   ![](img/Figure-2.16.jpg)\n   **图 2.16:** 账户创建确认消息\n\n6. 请注意，一旦创建了账户，我们就可以使用邮箱密码组合登录应用程序并探索其他场景。请同时注意，我们应该禁用浏览器自动保存密码的行为，因为这会阻碍自动化。\n\
    \n"
- fmt: "\nThe next ideal step after registering the user is to login into the application,\
    \ using the credentials used to register. We will be using the username `bpb@bpb.com`,\
    \ and password `bpb@123` to login to the application using the following steps:\n\
    \n1. Open the application using URL—[http://practice.bpbonline.com/](http://practice.bpbonline.com/)\n\
    \n2. Click on the `My Account` link as shown in the following image:\n\n    ![](images/Figure-2.17.jpg)\n\
    \n    **Figure 2.17:** My Account link\n\n3. On the sign in page, provide the\
    \ username, and password credentials, and click the `Sign In` button:\n\n    ![](images/Figure-2.18.jpg)\n\
    \n    **Figure 2.18:** Account login\n\n4. If logged in successfully, we should\
    \ be able to see the `My Account Information` page, where we can see links that\
    \ allow us to change our profile information, view orders, modify the address,\
    \ change the password, and so on. The following image shows this:\n\n    ![](images/Figure-2.19.jpg)\n\
    \n    **Figure 2.19:** My Account Information page\n\n5. Our next step is now\
    \ to log off from the application to go back to the main page. To perform the\
    \ log-off operation, we will first click on the `Log Off` link.\n\n    ![](images/Figure-2.20.jpg)\n\
    \n    **Figure 2.20:** Log Off link\n\n6. The next step is to click on `Continue`\
    \ to proceed with the log-off process.\n\n    ![](images/Figure-2.21.jpg)\n\n\
    \    **Figure 2.21:** Finalizing Log Off\n\nThus, we are able to login and log\
    \ off from the application successfully. In this book, to understand the various\
    \ concepts around Selenium, this would be the default scenario which we will use.\
    \ We need to also note here that there are other scenarios also available in the\
    \ application, such as change profile information, buy the product, view the cart,\
    \ and so on, and so more, and it is left to the reader to explore them and note\
    \ down their steps.\n\nAs and where, in the book, if we require other scenarios,\
    \ those are then defined in those chapters.\n\n# Other applications](#toc.xhtml_s16a)\n\
    \nIn this book, the default application we use is the BPB practice application.\
    \ But sometimes, to explore and understand some concepts, we may use the following\
    \ applications:\n\n* Internet Herokuapp, the URL of the application is [https://the-internet.herokuapp.com/](https://the-internet.herokuapp.com/).\
    \ This application is maintained by Elemental Selenium and provides us with various\
    \ small examples to explore the working of different types of HTML elements. It\
    \ is a great application to practice, and use to understand how Selenium handles\
    \ various Web elements.\n\n    ![](images/Figure-2.22.jpg)\n\n    **Figure 2.22:**\
    \ Internet Heroku app\n\n* The other application URLs that we can use to practice\
    \ concepts are any eCommerce website, a website that displays information about\
    \ movies, books, and home decor. In this book, as and where we use some other\
    \ applications to understand the scenario, the URL and the flow are explained.\n\
    \nThus, we had a look at the applications that we can use to be under test to\
    \ explore how we can automate the scenarios of them using Selenium.\n\n# Conclusion](#toc.xhtml_s17a)\n\
    \nIn this chapter, we have seen how we can set our system to set up Java, Eclipse\
    \ and use it to set up a project. We then verified if the project actually worked.\
    \ Once confirmed on that front, we downloaded and set up Selenium jars. To ensure\
    \ our project could use the Selenium jars and manipulate the browsers, we downloaded\
    \ and set up the browser drivers, which will act as a communication bridge and\
    \ allow Selenium to communicate with the browser.\n\nWe also saw a walkthrough\
    \ of the practice BPB application. We saw two scenarios of registered users and\
    \ login logout in detail. We also discussed some other applications, which we\
    \ can use to understand and implement scenarios as we learn Selenium.\n\nIn the\
    \ upcoming chapter, we will talk about the three important pillars of Selenium\
    \ implementation. The `WebDriver`, which is an interface to talk to the browser.\
    \ The `WebElement` that provides a method to handle the HTML elements on the page,\
    \ and the `By` class that helps in creating a locator to identify the element\
    \ on the page.\n\n# Questions](#toc.xhtml_s18a)\n\n1. What eclipse version have\
    \ we used here?\n2. What Java version have we installed in this chapter?\n3. What\
    \ is Photon with respect to Eclipse?\n4. What is the name of the driver for Firefox?\n\
    5. From where can one download the driver for Internet Explorer?\n\n# CHAPTER\
    \ 3](#toc.xhtml_c03)\n\n# WebDriver, WebElement, and By](#toc.xhtml_c03)\n\nSelenium,\
    \ the popular browser automating tool, has three main components: the Selenium\
    \ IDE, `WebDriver`, and the Grid. In this chapter, we will understand about the\
    \ three main important components of the `WebDriver`, which are the `WebDriver`\
    \ interface, `WebElement` interface, and the `By` class. Any script which we write\
    \ to automate the browser will use the methods available in these entities. The\
    \ `WebDriver` interface provides us with various methods to automate the browser\
    \ and fetch information associated with the Web page. The `WebElement` refers\
    \ to the HTML element on the page. This interface provides us with various methods\
    \ which help us to automate actions to handle different types of HTML elements.\
    \ And finally, the `By` class helps us create locator strategies to locate an\
    \ element on the Web page.\n\n# Structure](#toc.xhtml_s19a)\n\nIn this chapter,\
    \ we will discuss the following:\n\n* WebDriver and its purpose\n    * Methods\
    \ of `WebDriver`\n    * `WebDriver` of three browsers [IE, FF]\n    * Exceptions\
    \ related to `WebDriver`\n* WebElement interface\n    * Methods of `WebElement`\n\
    \    * Exceptions with `WebElement`\n* About By class\n    * Methods in `By`\n\
    \    * Understanding locators\n    * Exceptions related to `By`\n\n# Objectives](#toc.xhtml_s20a)\n\
    \nAfter studying this unit, you will be able to:\n\n* Learn what is `WebDriver`,\
    \ and use its methods to automate the browser.\n* Understand what is `WebElement`,\
    \ and use its methods to work with Web elements.\n* Understand the `By` class\
    \ used for locator creation and the different types of strategies.\n* Set up browser\
    \ drivers in the project.\n* Understand the exceptions we may encounter while\
    \ using `WebDriver`, `WebElement`, and `By`.\n\n# WebDriver and its purpose](#toc.xhtml_s21a)\n\
    \n`WebDriver` is the main interface that prepares a contract to establish the\
    \ rules for the browser to follow so that it gets enabled for testing. The functionalities\
    \ this interface focuses on are:\n\n* Controlling the browser\n    The `WebDriver`\
    \ interface provides us with methods, which help us in controlling browser-related\
    \ actions, such as the opening of a browser, the closing of the browser, managing\
    \ browser window size, timeout events, and more. As we will see in the next section,\
    \ where we discuss methods in more detail, we will see more about this.\n\n* Selecting\
    \ the Web elements\n    The `WebDriver` interface provides two methods to look\
    \ for the element or a list of elements of interest. These methods are `findElement`\
    \ and `findElements`, which provide us with an element or a list of elements,\
    \ respectively. Once the Web element is identified, we can proceed with the action\
    \ on it.\n\n* Web page information\n    The `WebDriver` interface provides us\
    \ method which helps in fetching the current title of the page, the current URL,\
    \ and the content available on the page. The information provided by these methods\
    \ provides information related to the Web page and can also be used for validation.\n\
    \nIn the next section, we will first understand how to set WebDrivers for different\
    \ browsers. After that, we will look at the list of methods available with the\
    \ `WebDriver` interface and their explanations. We will also see some implementation\
    \ examples to understand the working of the methods.\n"
