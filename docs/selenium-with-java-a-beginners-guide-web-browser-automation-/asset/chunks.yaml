    \ independent processes.\n\nThere are two independent processes that take place\
    \ as we use a tool to drive the browser and perform actions on the Web application.\
    \ The tool Selenium used here will execute the command to drive the Web browser\
    \ and perform an action on the Web application, and the Web application will execute\
    \ those actions as per its processing speed. If we do not synchronize these two\
    \ processes, our script will fail, and we will not be able to effectively and\
    \ with reliability execute our scripts to test the application. The reason for\
    \ this would be that from the script, Selenium would try to identify the element\
    \ on the Web page, but for various reasons listed in the unhappy situation, the\
    \ object or the page itself may not be loaded and may cause inconsistent behavior\
    \ with our scripts written to test the application.\n\nIn the following section,\
    \ we will learn how we can implement synchronization in the script to ensure the\
    \ two independent processes are aware of each other’s existence.\n\n# [Types of\
    \ synchronization](#toc.xhtml_s37a)\n\nWe have learned so far the importance of\
    \ synchronization. In this section, we will learn how we implement it in the test\
    \ scripts and what the approaches are for it. There are two approaches as follows:\n\
    \n*   Implicit wait\n\n*   Explicit wait\n\nImplicit wait is also known as global\
    \ wait. It is generally implemented immediately after the WebDriver object is\
    \ initialized. Once implemented, this wait holds true for every statement in the\
    \ script.\n\nExplicit wait is known as a local wait. It is used in places in the\
    \ script which may require more wait time. Generally, when we are using the explicit\
    \ wait, we set the implicit wait to zero, else they may both interfere with each\
    \ other. When we use explicit wait, we need to have a condition in which we will\
    \ be waiting to be completed, or the wait will timeout in the specified number\
    \ of seconds. To create a condition for the explicit wait, there is a class available\
    \ in Selenium known as the **`ExpectedConditions`**. The class has a large number\
    \ of implemented methods, which we can use to form a condition. We will know more\
    \ about it in the section for explicit wait.\n\nIn the next section, we will see\
    \ the implementation.\n\n# [Scenario](#toc.xhtml_s38a)\n\nTo implement the implicit\
    \ and explicit wait in action, we will pick up a scenario of login from the application\
    \ using valid user information. Let us first understand the following steps for\
    \ it.\n\n**Login**\n\n1.  Open the application using the URL—**[http://practice.bpbonline.com/](http://practice.bpbonline.com/)**\n\
    \n2.  Click on **`My Account`** link.\n\n3.  Provide username—**`admin@admin.com`**,\
    \ and password—**`admin@123`**.\n\n4.  Click on **`Sign in`** button.\n\n5.  Click\
    \ on **`Log off`** link\n\n6.  Click on **`Continue`** button\n\nAs per the preceding\
    \ steps, we launch the application on a browser and click on the **`My Account`**\
    \ link (as shown in the following figure).\n\n![](images/Figure-4.3.jpg)\n\n**Figure\
    \ 4.3:** Home page of application\n\nWe then provide a valid username and password\
    \ information and then click on the **`Sign In`** button as shown in the following\
    \ figure.\n\n![](images/Figure-4.4.jpg)\n\n**Figure 4.4:** Login to the application\n\
    \nIf the information is correct, we will see the **`My Account Information`**\
    \ page as shown in the following figure:\n\n![](images/Figure-4.5.jpg)\n\n**Figure\
    \ 4.5:** Page after Login\n\nHere, we then click on **`Log Off`** and continue\
    \ button to come back to the home page:\n\n![](images/Figure-4.6.jpg)\n\n**Figure\
    \ 4.6:** Logout page of the application\n\nIn the preceding scenario, we need\
    \ to notice the changes of the page in the application as we perform an action\
    \ on different elements. For example, if we click on the **`My Account`** link,\
    \ we go to the page where we need to fill in the information for username and\
    \ password. And when we click the sign in button, we go to the **`My Account Information`**\
    \ page, where we see the log-off link. We click on the log-off link and see the\
    \ continue button, and after clicking it, we are back to the home page.\n\nIn\
    \ each step, our script will have to be made smart to wait for an element to appear.\
    \ If the element does not appear within a given time period; then, throw an exception\
    \ of Time Out and end the execution. The first type of wait which we will see\
    \ is implicit wait, which is introduced in the script and acts for every statement\
    \ in the script. It is also known as a global wait. After that, we will see an\
    \ explicit wait, which is known as local wait and is introduced at the script\
    \ in a place, which requires more time to wait than the global time set. And as\
    \ explained earlier, we do not use these waits together as they might interfere\
    \ with each other. So, when we are using explicit wait, we set the implicit wait\
    \ time to zero.\n\n# [Implementing implicit wait](#toc.xhtml_s39a)\n\nTo implement\
    \ the implicit wait, we use the following command:\n\n`//add implicit wait`\n\n\
    **driver.manage().timeouts().implicitlyWait(10, TimeUnit.SECONDS);**\n\nHere,\
    \ the driver is an instance of the **`ChromeDriver`** and uses its method manage.\
    \ The manage method has timeouts, where we chose the option of **`ImplicitlyWait`**.\
    \ The arguments that we pass to this method are the time unit which we want to\
    \ use and the quantity of that unit. So here, we choose to implicitly wait for\
    \ the 10 seconds. This command which is used will work for every statement written\
    \ in the script. It will wait for an element to be available for the most 10 seconds;\
    \ if within 10 seconds, the element has appeared, it will perform the action and\
    \ move on to the next statement in the script. If for some reason, the element\
    \ is not available and 10 seconds have passed, this situation then leads to an\
    \ exception of **`TimeOut`**.\n\nLet us see the following login script using implicit\
    \ wait:\n\n![](images/p65.jpg)![](images/p66.jpg)\n\n# [Implementing explicit\
    \ wait](#toc.xhtml_s40a)\n\nWe implement explicit wait or local wait in situations\
    \ where a certain section of our script requires more time than the global timeout\
    \ set. In these situations, it is not advisable to increase the entire global\
    \ timeout because if for some reason the script starts failing, for every step,\
    \ we will be waiting as per the duration set in the global timeout. We need to\
    \ understand that there exists a thin line between synchronization and the speed\
    \ of the script. And it takes a little time and a few executions to set up the\
    \ balance of them.\n\nTo implement explicit wait, we will be using Selenium’s\
    \ **`WebDriverWait`** interface and the **`ExpectedConditions`** interface. Before\
    \ we move further, let us first talk about these two entities."
