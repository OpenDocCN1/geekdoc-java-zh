  md: 'By the way, you will want to add import java.io.*; at the top of your program
    to use some of the classes we''ve included.


    We will talk about the **try/catch** pieces in a minute here. To begin with, we
    will discuss the **FileWriter** line. **FileWriter** is a class in Java built
    to write files. You create an object instance of it we talked about in our Objects
    section. The constructor includes the path and name of your file. For this example
    I chose a simple file name without a path, but you might need to include the path.
    If you use the ''\'' symbol in your path, you might want to use two of them ''\\''.
    ''\ is a special character in Java used for pattern matching. Putting two together
    tells Java to treat it like a normal symbol.


    Now on **try/catch**. The **try** block and the **catch** block help us when something
    doesn''t go right when our program is running. Let''s say you are trying to write
    a file to a place that didn''t exist or you didn''t have access to. **Try** tells
    Java to watch for possible problems. **Catch** tells Java how to filter problems
    that happen and what to do with them. Our **catch** block tells Java to look for
    the IOException problem. If one of these problems occur, our program will write
    to the error console (kind of like the output ''out'' console we are used to)
    so we know what the problem is.


    For an output stream we will want to **write** data to the file. We do it it like
    this.


    ```

    writer.write("My First Record");

    ```


    The above statement is similar to a **println** statement but writes to a file
    instead. You can write a literal string like in the example above or you can include
    a variable name.


    For all file-related operations, you need to make sure you **close** the file
    when you are done. Leaving a file open wastes system resources and can result
    in a memory leak. Here is how you close the file.


    ```

    writer.close();

    ```


    We have talked about an output stream. Now let''s discuss using an input stream.
    An input stream **reads** data from a file that already exists. If the file doesn''t
    exist, your program will probably throw an error. You will find that the syntax
    to open an input stream is very close to the output stream.'
