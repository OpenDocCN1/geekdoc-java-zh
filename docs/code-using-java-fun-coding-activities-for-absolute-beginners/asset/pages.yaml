    # Learn Arrays


    Learn what arrays are and how you would use them in your program.


    Arrays are used when you need many of the same type of variable. They are often
    used when you don''t know how many variables you need until your program is running.


    ![](img/4b0b7323b2e8849b30ec17cea1bb735f_38_0.png)


    An array is a set of variables of the same type. Like variables (since an array
    is a special kind of variable), each array has...a name, a type (size), a set
    of values (what is in it), and each element has an index to be used to reference
    it.


    Before you can use an array, you must first declare it like this.


    ```

    int myArray[] = {1,2,3,4,5};

    ```


    This example creates an array of 5 integers that are specified when you declare
    it.'
