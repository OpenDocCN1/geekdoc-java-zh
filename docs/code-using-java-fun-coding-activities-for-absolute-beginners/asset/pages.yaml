  md: '# BASIC COMPUTER CONCEPTS


    # Learn It!


    # Learn Computer Parts


    Learn the most basic parts that make up a computer system.


    A computer is made up of three different types of parts: inputs, processing, and
    outputs.


    No matter what the type of computer—desktop, laptop, smartphone, or other systems—each
    of these parts are there. Here are some examples of what you might see in these
    parts of a system.


    Input


    +   * Keyboard

    * Mouse

    * Finger


    Processing


    +   * Calculations

    * Controls


    Output


    +   * Monitor/Screen

    * Printer


    These three elements work together to provide the experiences we have come to
    expect from our computers.


    ![](img/4b0b7323b2e8849b30ec17cea1bb735f_6_0.png)'
  merge: -1
