  md: 'Before you write a program using Java you will need to have the proper software
    installed. This includes installing an Integrated Development Environment (IDE).
    A common environment that supports a variety of operating systems is called IntelliJ
    IDEA. We will be using the Community edition because it installs easily and is
    free to use.


    Here are the steps to get the IDE installed and a short program written.


    Begin by going to https://www.jetbrains.com/idea/download/ and selecting "Download"
    under the Community heading. Once the file is downloaded, click on the install
    file and follow the install process.


    Once the product is installed, find the installed program and double click to
    run it.


    The first time running the program, it might require you answer some questions
    about where to store files and such. After that, you will end up at the welcome
    page.


    Select "Create New Project" from the welcome page.


    ![](img/4b0b7323b2e8849b30ec17cea1bb735f_4_0.png)


    Select "Java" from the different types of projects and click


    ![](img/4b0b7323b2e8849b30ec17cea1bb735f_4_1.png)


    Name your project. I called mine "Stuff" but you can call yours what you like.


    ![](img/4b0b7323b2e8849b30ec17cea1bb735f_4_2.png)


    With the project created, Select the project folder in the upper left.


    From the project tree select the name of your project ("Stuff" for me) and then
    click "src" and choose "New" and "Java Class".'
