  md: '# Learn It!


    # Learn the Coding Process


    Learn how to do coding using a simple and standard process.


    We have learned so far that coding is about putting a bunch of lines of code together
    in a sequence to complete some kind of a task.


    To be able to know what statements need to go together, you first need to understand
    what problem you are solving. You get this from something called requirements.


    An example of requirements might be something like this.


    Show the sum of 4 numbers that you get as input from the user.


    Now you need to decide how you are going to meet the requirements. To do this,
    you will write out a set of high-level steps.


    An example of these steps would be something like this:


    +   1. Ask the user for first number and store in variable1

    2. Ask the user for second number and store in variable2

    3. Ask the user for third number and store in variable3

    4. Ask the user for fourth number and store in variable4

    5. Add up the numbers and store in total

    6. Display the total


    After you have the steps down and have walked through them a couple of times to
    make sure they are correctly arranged, it is time to change these steps into a
    program.


    The Java code for the above steps would look like this.


    ```

    Scanner input = new Scanner(System.in);

    int variable;

    ```'
