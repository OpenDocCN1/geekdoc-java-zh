    # Learn Encapsulation


    Learn about encapsulation, one of the tenets of object-oriented coding.


    Encapsulation is about bundling data and operations into a single package. Doing
    this allows us to better manage our program in a couple of ways.


    First, it allows you to manage the scope of change when it comes to variables
    within the class and the operations (methods) that affect that data.'
