  md: '# MORE CODING PRINCIPLES


    # Learn It!


    # Learn Branching


    Learn the most basic concepts around branching within a computer program.


    Computers are really good at making decisions, but we have to tell the computer
    the rules around how to make these decisions.


    ![](img/4b0b7323b2e8849b30ec17cea1bb735f_27_0.png)


    Branches, also called conditional statements, allow a program to take more than
    one route. The computer uses a logical expression to decide which route to take.


    > A logical expression resolves to True or False. Here are some of the elements
    of logical expressions:


    | Equality | "abc" == "abc" |

    | Inequality | "abc" != "def" |

    | AND | (100 AND 200) > 50 |

    | OR | (100 OR 200) > 50 |

    | NOT | NOT (100 > 50) |'
  merge: -1
  pgno: 27
- img_proc: true
  md: "If you wanted to write logical expression that decides if you can go to a PG-13\
    \ movie, it might look like this.\n\n```\n(myAge > 12)\n```\n\nTo be able to go\
    \ to a PG-13 movie, you need to be older than 12.\n\nThis logical expression would\
    \ return false for some of you but might return true for some of us who are older\
    \ than 12.\n\n# Conditions\n\nIn its most simple form, branching has one route\
    \ but two outcomes. When the logical expression is true the program goes down\
    \ path and when it is false, it skips over the true path. A simple condition with\
    \ these routes looks like this.\n\n![](img/4b0b7323b2e8849b30ec17cea1bb735f_28_0.png)\n\
    \n```\nif (logical expression){\n  Do something if true\n}\n```\n\nA more complex\
    \ form of a branching has more than one route. It looks like this.\n\n```\nif\
    \ (logical expression) {\n  Do something if true\n} else {\n  Do something if\
    \ false\n}\n```\n\n![](img/4b0b7323b2e8849b30ec17cea1bb735f_28_1.png)\n\nIn the\
    \ above case the true condition goes down the first route, and the false condition\
    \ goes down the second route (after the else).\n\nThere are times when you even\
    \ need a more complex version of branching. You might have three or more routes\
    \ to take. In Java branching with three routes looks like this.\n\n```\nif (logical\
    \ expression) {\n  Do something if true\n} if (another logical expression) {\n\
    \  Do something if the first expression is false and this\n  one is true.\n} else\
    \ {\n```"
  merge: -1
  pgno: 28
