  md: "We haven't used an accessor yet, but they determine the visibility of a class,\
    \ variable, or method. The **public** accessor allows the element to be visible\
    \ to all other classes inside and outside the class. **Protected** allows only\
    \ classes within the inheritance hierarchy to see the element. **Private** restricts\
    \ visibility to the element only within the class. When we set a variable as **private**,\
    \ we can ensure any changes to variable data must come through methods in the\
    \ class.\n\n```\npublic class Car {\n    private String color = \"\";\n\n    public\
    \ Car(String tempColor) {\n        color = tempColor;\n    }\n\n    public void\
    \ displayInformation({\n        System.out.println(\"Car: The color of this car\
    \ is \" + color);\n    }\n}\n```\n\nSecond, when it comes to testing the class,\
    \ you can do it as a single unit, which is the basis for unit testing. Keeping\
    \ the changes and the tests focused on a single class allow you to manage the\
    \ impacts that change has on the data and operations.\n\nIt is considered a best\
    \ practice to use encapsulation as shown in the **Car** example above to ensure\
    \ access and scope are closely managed.\n\n# Learn It!\n\n# Learn Inheritance\n\
    \nLearn about inheritance, one of the tenets of object-oriented coding.\n\nInheritance\
    \ is something we see all around us. In your own family you inherit certain traits\
    \ from your father and mother. If you have a sibling, that person likewise inherits\
    \ traits. Classes can have inheritance in a similar way to that of your family.\n\
    \nIn coding we call the parent \"super\" class. Other classes can inherit from\
    \ the super class. Those that inherit from the super are called \"sub\" classes."
