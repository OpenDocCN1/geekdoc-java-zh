  md: "```\nMyClass.printNumbers();\n```\n\n# Recursion\n\nIn addition to using a\
    \ method from your program, you can also call methods from within that method.\
    \ When you call the method you are in, this is called recursion.\n\nIn a simple\
    \ example, we will display a set of messages similar to using a loop but will\
    \ use recursion instead.\n\n```\npublic static void showMessage(int numberOfTimes)\
    \ {\n  if (numberOfTimes > 0) {\n    System.out.println(\"Printing a recurring\
    \ message \");\n    showMessage(numberOfTimes -1);\n  }\n}\n```\n\nThe if statement\
    \ is really important because without it the program would loop forever.\n\nSee\
    \ the line in the method that calls showMessage(?) That is what makes this a recursion.\
