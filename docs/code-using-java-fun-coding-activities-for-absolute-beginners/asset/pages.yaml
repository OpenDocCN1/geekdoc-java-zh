    # Learn It!


    # Learn Input


    Learn the different kinds of input that a computer can receive, and what the computer
    can do with the input.


    Inputs are an important part of a computer. They are the way a computer system
    receives information that is processed. Once inputs have been processed, outputs
    can be created.


    In the previous lesson we talked about the different kinds of inputs a computer
    might have. We talked about a small list of inputs, but there are many others.


    +   - Keyboard

    - Mouse

    - Touch Screen'
