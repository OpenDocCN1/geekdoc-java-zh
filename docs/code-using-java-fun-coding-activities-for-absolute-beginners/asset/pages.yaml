  md: '# Simple Exercise


    Think about what steps you would have to take to get from one side of a classroom
    to the other.


    +   1 - Walk three steps ahead

    2 - Turn left a half turn

    3 - Walk two steps ahead

    4 - Turn left a quarter turn

    5 - Walk five steps ahead

    6 - Stop


    ![](img/4b0b7323b2e8849b30ec17cea1bb735f_15_0.png)


    # Sequencing Example


    Here is an example of some steps that show the level of detail you must use to
    tell the computer what to do.


    ```

    Scanner input = new Scanner(System.in);

    String name;

    float price1;

    float price2;

    float price3;

    float total;


    System.out.print("Please enter your name: ");

    name = input.next();

    System.out.print("Please enter the price of book 1: ");

    price1 = input.nextFloat();

    System.out.print("Please enter the price of book 2: ");

    price2 = input.nextFloat();

    System.out.print("Please enter the price of book 3: ");

    price3 = input.nextFloat();

    total = price1 + price2 + price3;

    System.out.println("Name: " + name + " your total price is: " + total);");

    ```


    I know you aren’t going to know all of this means yet, but from the example you
    can see the level of detail and number of steps it takes to get stuff done within
    a program.'
