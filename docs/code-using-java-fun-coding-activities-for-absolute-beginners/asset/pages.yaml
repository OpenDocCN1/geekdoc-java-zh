  md: "```\npublic static void printNumbers() {\n    for (int count=1; count=10; count++)\
    \ {\n        System.out.println(count);\n    }\n}\n```\n\nThis method runs through\
    \ a loop from 1 to 10 and displays the numbers. Here is a simple example of a\
    \ method that returns a value.\n\n```\npublic static int returnNumber(int startValue)\
    \ {\n    int total = startValue\n    for (int count=1; count=10; count++) {\n\
    \        total = total + count;\n    }\n    return total;\n}\n```\n\nLike the\
    \ earlier example, the one above runs through a loop from 1 to 10. It takes in\
    \ a parameter (we will talk about those in a minute) and calculates a total which\
    \ is then returned to the calling line of your program using the `return` statement.\n\
    \n# Parameters\n\nUsing parameters is a way to send a value to a method while\
    \ you are using it. This value is then used just like a populated variable within\
    \ the method. In the last example above, a value is passed into the `returnNumber()`\
    \ method. Within the method the value can be used through the `startValue` variable.\
    \ Notice how in the first line we set `total=` to the value of `startValue`.\n\
    \n# Using a Method\n\nDefining methods is great, but then you need to use them\
    \ in your program. This is done by \"calling\" the method. To call a method that\
    \ returns a value, you will treat it exactly like a variable in an arithmetic\
    \ expression like this.\n\n```\nmyNumber = MyClass.returnNumber(123);\n```\n\n\
    Remember we named our method `returnNumber()` and we pass a value in the parameter\
    \ array of 123. This is then used within the method itself.\n\nThe method doesn't\
    \ return a value, you call it without including it in an arithmetic expression\
    \ like this."
