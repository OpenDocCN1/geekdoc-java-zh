    # Learn It!


    # Learn Arithmetic Expressions


    Learn how to use variables and operations together to create arithmetic expressions.


    It is very common when writing a program that you will need to do something more
    involved than just store values in variables. Here we will learn the principles
    around arithmetic expressions that are found in programs.


    When we set or change a variable, we can also add arithmetic expressions to the
    line. Here is the example of setting a value and an arithmetic expression.


    ```

    total = (number1 + number2) + (number3 * number4)

    ```


    In coding, multiplication is usually done using a * and division is usually done
    using a /.


    The sky''s limit is on the different types of arithmetic expressions you can perform.
    In addition to simple + - * and ÷, most languages also include functions to handle
    more complex operations including exponents, square root, trigonometry operations,
    and some business operations.


    Here are a couple of common operations written as arithmetic expressions in a
    program.


    ```

    a = cmath.sqrt(math.pow(r,2))

    K = b * (cmath.sqrt(4* math.pow(a,2)) - math.pow(b,2)) / 4

    mean = sumOfTheTerms / numberOfDiffTerms

    speed = totalDistance / totalTime

    pythagorean = math.pow(a,2) + math.pow(b,2) - math.pow(c,2)

    ```'
