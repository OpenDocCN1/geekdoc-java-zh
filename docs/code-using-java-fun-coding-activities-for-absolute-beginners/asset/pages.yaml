  md: '# INTRODUCTION


    # For Parents...


    This workbook was written after decades of teaching beginners coding skills. It
    is meant to teach key principles and cement them in the minds of kids using fun
    and exciting exercises.


    The workbook was created to promote self-paced learning, but it can also be used
    in a classroom setting. It has two main elements that work together to help kids
    learn coding. “Learn It!” sections teach a principle in detail and provide examples
    that are useful to learning the topic. “Try It!” sections then use exercises and
    games to reinforce the learning in the prior section.


    # For Kids...


    It has been my experience that kids learn best when coding concepts are visual
    and you take the time to use your hands and code what you have learned. I strongly
    encourage you to go through the examples and exercises using Scratch and you are
    reading this workbook. Doing this will help you to better retain what you have
    learned.


    # What do you need to know to start?


    I am assuming in this book that you have little or no knowledge of coding and
    no knowledge of Java. I provide every step you need to get started and learn the
    language. Because there are some download and install steps, some computer skills
    and understanding of folders and windows will be helpful. If you don''t have them,
    have a parent help you.


    # Learn It!


    # Getting Started with Java


    Java is a general-purpose language that is very popular in business. Because of
    its popularity, it is a great language to learn.'
