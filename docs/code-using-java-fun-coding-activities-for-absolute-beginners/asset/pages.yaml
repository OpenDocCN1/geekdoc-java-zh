  md: "Here is a quick example of using a while loop. We would like to add up 10 numbers\
    \ the user specifies. Here is what it would look like.\n\n```\nimport java.util.*;\n\
    public class LoopClass {\n    public static void main(String[] args) {\n     \
    \   Scanner input = new Scanner(System.in);\n        int count = 0;\n        int\
    \ total = 0;\n\n        while (count < 10) {\n            System.out.println(\"\
    Enter a number to add: \");\n            int number = input.nextInt();\n     \
    \       total = total + number;\n            count++;\n        }\n        System.out.println(\"\
    The total of the numbers is \" + total);\n    }\n}\n```\n\nIn this program we\
    \ go through the loop 10 times (0 through 9). Each time we loop, we ask the user\
    \ for a number, we grab the number and put it in a variable called number and\
    \ we add the number to our accumulated total. The count variable keeps track of\
    \ how many times we have been through the loop, so we also have to add one to\
    \ it time through. Once we are done, display the total.\n\n# # Try It!\n# Guessing\
    \ Game Round Two\n\nThis exercise helps you learn more about branching and looping\
