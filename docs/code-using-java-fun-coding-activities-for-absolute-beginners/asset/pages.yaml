  md: '# # ADVANCED CODING

    PRINCIPLES


    # # Learn Methods


    Learn the concept of methods, provide examples of the two types of methods, and
    introduce recursion.


    Modular coding is all about breaking a program into logical pieces that are grouped
    together to form a method. The method can take input parameters and will either
    do something or return something. Because it is bundled in its own package, it
    can be developed and tested on its own and reused as needed.


    Before you can use a method, it needs to be defined. The first line of the definition
    tells the computer more about the method. Like declaring a variable, the first
    line tells the access of the method, the type of the method, the name of the method,
    and if there are any parameters. Until we get to Objects, we will treat the methods
    as "static". That means that we are going to use them within the class rather
    than in an object. You will learn more about that later. All you need to know
    at this point is include the word "static" after the accessor.


    | Accessor | Static | Type | Name | Parameters |

    | --- | --- | --- | --- | --- |

    | (public, protected, private) | (static or blank) | (void means no value returned,
    or a real type) | | (A comma delimited list with type and name) |

    | public | static | void | methodName | (parameterName) |


    Next, you need to write the steps that the method will perform. You can use all
    of the different coding elements we have discussed so far in this workbook.


    Here is a simple example of a method.'
