- img_proc: true
  md: "![](img/4b0b7323b2e8849b30ec17cea1bb735f_31_0.png)\n\nHere are a couple of\
    \ the most often used looping statements:\n\n```\nfor (int count = 0; count<10;\
    \ count++\nwhile (count < 10)\n```\n\nThe while loop uses logical expressions\
    \ like you used with branching.\n\nWhen it comes to loops, there are usually two\
    \ basic types. Use this information to decide when and how to use them.\n\n| For\
    \ loop | While loop |\n| Used you know how many times you iterate through the\
    \ loop before the loop starts. | Use when you need to use a logical expression\
    \ to decide when the loop will end. In most cases you don't know how many iterations\
    \ it will go through. |\n The for loop has a variable and a set of elements associated\
    \ with it. | The while loop has an external control that can be a counter or can\
    \ be another type of control used in a logical expression. |\n In this below example\
    \ we see a variable called counter is declared and initialized to 0. It will increase\
    \ until it is no longer less than 10. | The logical expression, using the control,\
    \ must become false during the loop |\n| for (int count=0; count<10; count++)\
    \ | isDone = false;\nwhile (!isDone) |"
