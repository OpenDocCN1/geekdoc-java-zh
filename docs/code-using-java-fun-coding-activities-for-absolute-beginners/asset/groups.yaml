    \n# My Improved Media Collection\n\nThis exercise will help you to use files to\
    \ improve your media collection program.\n\nI've been using the great media collection\
    \ program you put together earlier but am kind of tired of retyping all of my\
    \ media into the program each time it runs.\n\nFor this exercise, enhance the\
    \ media collection program written earlier to write the collection to a file at\
    \ the end of the program and read the collection from the file at the beginning.\n\
    \nOne thing you are going to need to consider is how you store the type of the\
    \ media in the file and how you repopulate the array using the correct object\
    \ types."
