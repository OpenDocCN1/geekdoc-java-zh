- md: "\n# MORE CODING PRINCIPLES\n\n## Learn It!\n\n## Learn Branching\n\nLearn the\
    \ most basic concepts around branching within a computer program.\n\nComputers\
    \ are really good at making decisions, but we have to tell the computer the rules\
    \ around how to make these decisions.\n\n![](img/4b0b7323b2e8849b30ec17cea1bb735f_27_0.png)\n\
    \nBranches, also called conditional statements, allow a program to take more than\
    \ one route. The computer uses a logical expression to decide which route to take.\n\
    \n> A logical expression resolves to True or False. Here are some of the elements\
    \ of logical expressions:\n\n| Element | Example |\n| :--- | :--- |\n| Equality\
    \ | \"abc\" == \"abc\" |\n| Inequality | \"abc\" != \"def\" |\n| AND | (100 AND\
    \ 200) > 50 |\n| OR | (100 OR 200) > 50 |\n| NOT | NOT (100 > 50) |\n\nIf you\
    \ wanted to write a logical expression that decides if you can go to a PG-13 movie,\
    \ it might look like this.\n\n```\n(myAge > 12)\n```\n\nTo be able to go to a\
    \ PG-13 movie, you need to be older than 12.\n\nThis logical expression would\
    \ return false for some of you but might return true for some of us who are older\
    \ than 12.\n\n## Conditions\n\nIn its most simple form, branching has one route\
    \ but two outcomes. When the logical expression is true the program goes down\
    \ the path and when it is false, it skips over the true path. A simple condition\
    \ with these routes looks like this.\n\n![](img/4b0b7323b2e8849b30ec17cea1bb735f_28_0.png)\n\
    \n```\nif (logical expression){\n  Do something if true\n}\n```\n\nA more complex\
    \ form of a branching has more than one route. It looks like this.\n\n```\nif\
    \ (logical expression) {\n  Do something if true\n} else {\n  Do something if\
    \ false\n}\n```\n\n![](img/4b0b7323b2e8849b30ec17cea1bb735f_28_1.png)\n\nIn the\
    \ above case the true condition goes down the first route, and the false condition\
    \ goes down the second route (after the else).\n\nThere are times when you even\
    \ need a more complex version of branching. You might have three or more routes\
    \ to take. In Java branching with three routes looks like this.\n\n```\nif (logical\
    \ expression) {\n  Do something if true\n} if (another logical expression) {\n\
    \  Do something if the first expression is false and this\n  one is true.\n} else\
    \ {\n  Do something if false\n}\n```\n\nYou can also put the if and if-else inside\
    \ of other blocks of code as needed.\n\nHere is an example of a simple program\
    \ that uses branching. We will use the PG-13 example we talked about earlier in\
    \ this section.\n\n```java\nimport java.util.*;\npublic class BranchClass {\n\
    \    public static void main(String[] args) {\n        Scanner input = new Scanner(System.in);\n\
    \        System.out.println(\"How old are you?\");\n        int age = input.nextInt();\n\
    \        if (age > 13 || age == 13) {\n            System.out.println(\"You are\
    \ old enough to attend a PG-13 movie.\");\n        } else {\n            System.out.println(\"\
    Sorry that you aren't old enough to go to a PG-13 movie.\");\n        }\n    }\n\
    }\n```\n\nIn the example we ask the user for their age and store it in a variable\
    \ called age. We use an if-else statement where we test the user's age is greater\
    \ than 13 or equal to 13. If this test is true, we display a message that the\
    \ person is old enough to attend. Otherwise we display a message that the person\
    \ cannot attend.\n\n![](img/4b0b7323b2e8849b30ec17cea1bb735f_29_0.png)\n\n## Find\
    \ Positive Numbers\n\nThis exercise helps you learn about arithmetic expressions\
    \ and branching using a program that finds positive numbers.\n\nWrite a program\
    \ that decides whether a number provided by the user is positive or negative using\
    \ the below details:\n\n1. Ask user for a number\n2. Decide if the number is positive\
    \ or negative\n3. Display one message if it is positive and another if it is negative.\n\
    \nGo into the Java IDE and create this program.\n\n## Try It!\n\n## Guessing Game\
    \ One\n\nThis exercise helps you learn branching and logical expressions by creating\
    \ a simple guessing game. Write a guessing game using below details:\n\n- Start\
    \ with a mystery number\n- Ask someone to guess it\n- Tell them if their guess\
    \ was too high or low\n- Display the results\n\nGo into the Java IDE and create\
    \ this program.\n\n## Learn It!\n\n## Looping\n\nLearn the basic concepts around\
    \ looping in a program.\n\nIn addition to branching, computers are also great\
    \ at doing the same thing over and again. In coding this is often referred to\
    \ as looping. Looping statements allow a portion of your program to execute more\
    \ than once. In a way, it is like a dog chasing its tail.\n\n![](img/4b0b7323b2e8849b30ec17cea1bb735f_31_0.png)\n\
    \nHere are a couple of most often used looping statements:\n\n```java\nfor (int\
    \ count = 0; count < 10; count++) { ... }\nwhile (count < 10) { ... }\n```\n\n\
    The while loop uses logical expressions like branching. When it comes to loops,\
    \ there are usually two types. Use this information to decide when and how to\
    \ use them.\n\n| For loop | While loop |\n| :--- | :--- |\n| Used when you know\
    \ how many times to iterate through the loop before it starts. | Used when you\
    \ need to use a logical expression to decide when the loop will end. |\n| The\
    \ for loop has a variable and a set of elements associated with it. | The while\
    \ loop has an external control that is used in a logical expression. |\n| In this\
    \ below example we see a variable called counter declared and initialized to 0.\
    \ It will increase until it is no longer less than 10. | The logical expression\
    \ using the control, must become false during the loop. |\n\nHere is a quick example\
    \ of using a while loop. We would like to add up 10 numbers the user specifies.\
    \ The count variable keeps track of how many times we have been through the loop,\
    \ so we also have to add one to it each time. Once we are done, display the total.\n\
    \n```java\nimport java.util.*;\npublic class LoopClass {\n    public static void\
    \ main(String[] args) {\n        Scanner input = new Scanner(System.in);\n   \
    \     int count = 0;\n        int total = 0;\n\n        while (count < 10) {\n\
    \            System.out.println(\"Enter a number to add: \");\n            int\
    \ number = input.nextInt();\n            total = total + number;\n           \
    \ count++;\n        }\n        System.out.println(\"The total of the numbers is\
    \ \" + total);\n    }\n}\n```\n\n## Try It!\n\n## Guessing Game Two\n\nThis exercise\
    \ helps you learn more about branching and looping by expanding our guessing game.\
    \ Enhance the guessing game by adding the following requirements to your existing\
    \ program:\n\n- In the previous program the user got one guess. We want them to\
    \ guess until they reach the correct answer\n- What will you use to end the loop?\n\
    - What kind of loop will you use?\n\nBy the way, you can use this function to\
    \ calculate a random number for your mystery number: **random.nextInt(10)** calculates\
    \ a random number between 0 and 10.\n\nGo into the Java IDE and create this program.\n\
    \n## Try It!\n\n## Rock, Paper Scissors\n\nThis exercise helps you learn more\
    \ about branching and looping through the Rock Paper Scissors game.\n\n![](img/4b0b7323b2e8849b30ec17cea1bb735f_33_0.png)\n\
    \n- Write a program that uses the Rock, Paper, Scissors rules below.\n- Run a\
    \ set number of matches but keep trying after that number while the players are\
    \ tied.\n\n| RPS Rules |\n| :--- |\n| Rock crushes Scissors |\n| Scissors cut\
    \ Paper |\n| Paper covers Rock |\n| No one wins if the two are the same |\n\n\
    Go into the Java IDE and create this program.\n\n## Try It!\n\n## Russian Roulette\n\
    \nThis exercise helps you learn branching and looping as you create Russian Roulette.\
    \ Russian Roulette is where a person takes a revolver with a single bullet in\
    \ it. They spin the cylinder, aim the gun at a target, and pull the trigger.\n\
    \nCreate a program that creates Russian Roulette practice using the below details:\n\
    \n1. The location of the bullet in the six chambers is selected at random\n2.\
    \ The cylinder is spun and the selected chamber is decided at random\n3. The gun\
    \ is aimed at the target and the trigger is pulled\n4. The result is displayed\
    \ to the user\n5. The user is asked if they want to try again\n6. If so, the trigger\
    \ is pulled again\n\nGo into the Java IDE and create this program.\n\n## Learn\
    \ It!\n\n## Testing the Coding Process\n\nConsider how testing fits within our\
    \ simple and standard process.\n\nEarlier in this workbook we talked about the\
    \ coding process. Using this process helps you to think step by step as you try\
    \ to solve a problem. When we talked about the process earlier, we hadn't talked\
    \ about branching and looping. Both of these can make it hard to think through\
    \ the right steps.\n\nIn addition to the three steps listed below, I would also\
    \ suggest that you then test your program’s logic (does the program match the\
    \ requirements).\n"
  mdcn: "\n\n# 更多编程原则\n\n## 学习吧！\n\n## 学习分支\n\n学习计算机程序中分支的最基础概念。\n\n计算机非常擅长做决定，但我们必须告诉计算机如何做这些决定的规则。\n\
    \n![](img/4b0b7323b2e8849b30ec17cea1bb735f_27_0.png)\n\n分支（也称为条件语句）允许程序走多条路线之一。计算机使用逻辑表达式来决定走哪条路线。\n\
    \n> 逻辑表达式的解析结果为真（True）或假（False）。以下是逻辑表达式的一些元素：\n\n| 元素 | 示例 |\n| :--- | :--- |\n\
    | 等于 | \"abc\" == \"abc\" |\n| 不等于 | \"abc\" != \"def\" |\n| 与 (AND) | (100 AND\
    \ 200) > 50 |\n| 或 (OR) | (100 OR 200) > 50 |\n| 非 (NOT) | NOT (100 > 50) |\n\n\
    如果你想写一个逻辑表达式来判断你是否可以去看 PG-13 电影，它可能像这样：\n\n```\n(myAge > 12)\n```\n\n要观看 PG-13\
    \ 电影，你必须大于 12 岁。\n\n这个逻辑表达式对你们的一些人会返回 false，但对我们中一些大于 12 岁的人可能会返回 true。\n\n##\
    \ 条件\n\n在最简单的形式下，分支有一条路线但有两个结果。当逻辑表达式为真时，程序走该路径；当为假时，它会跳过真路径。带有这些路线的简单条件看起来如下：\n\
    \n![](img/4b0b7323b2e8849b30ec17cea1bb735f_28_0.png)\n\n```\nif (logical expression){\n\
    \  // 如果真则执行某些操作\n}\n```\n\n更复杂的分支具有多条路线。它看起来像这样：\n\n```\nif (logical expression)\
    \ {\n  // 如果真则执行某些操作\n} else {\n  // 如果假则执行某些操作\n}\n```\n\n![](img/4b0b7323b2e8849b30ec17cea1bb735f_28_1.png)\n\
    \n在上述情况下，真条件走第一条路线，假条件走第二条路线（else 之后）。\n\n有时你甚至需要更复杂的分支版本。你可能有三条或更多路线要走。Java 中具有三条路线的分支如下所示：\n\
    \n```\nif (logical expression) {\n  // 如果真则执行某些操作\n} if (another logical expression)\
    \ {\n  // 如果第一个表达式为假且这个为真，则执行某些操作\n} else {\n  // 如果假则执行某些操作\n}\n```\n\n你也可以根据需要将\
    \ `if` 和 `if-else` 放在其他代码块内部。\n\n这是一个使用分支的简单程序示例。我们将使用本节之前提到的 PG-13 示例。\n\n```java\n\
    import java.util.*;\npublic class BranchClass {\n    public static void main(String[]\
    \ args) {\n        Scanner input = new Scanner(System.in);\n        System.out.println(\"\
    你多大了？\");\n        int age = input.nextInt();\n        if (age > 13 || age ==\
    \ 13) {\n            System.out.println(\"你的年龄足够可以看 PG-13 电影。\");\n        } else\
    \ {\n            System.out.println(\"抱歉，你的年龄不够看 PG-13 电影。\");\n        }\n  \
    \  }\n}\n```\n\n在示例中，我们询问用户的年龄并将其存储在名为 `age` 的变量中。我们使用 `if-else` 语句测试用户的年龄是否大于\
    \ 13 岁或等于 13。如果此测试为真，我们显示该人年龄足够观看的消息；否则，我们显示该人无法观看的消息。\n\n![](img/4b0b7323b2e8849b30ec17cea1bb735f_29_0.png)\n\
    \n## 寻找正数\n\n这个练习帮助你通过一个寻找正数的程序来学习算术表达式和分支。\n\n根据以下细节编写程序，判断用户提供的数字是正数还是负数：\n\n\
    1. 向用户询问一个数字\n2. 判断数字是正数还是负\n3. 如果是正数显示一条消息，如果是负数显示另一条消息。\n\n进入 Java IDE 并创建此程序。\n\
    \n## 试一下！\n\n## 猜数字游戏一\n\n这个练习通过创建一个简单的猜数字游戏来帮助你学习分支和逻辑表达式。使用以下细节编写一个猜数字游戏：\n\n\
    - 从一个神秘数字开始\n- 请别人猜数字\n- 告诉他们猜的数字太高还是太低\n- 显示结果\n\n进入 Java IDE 并创建此程序。\n\n## 学习吧！\n\
    \n## 循环\n\n学习程序中循环的基本概念。\n\n除了分支之外，计算机也非常擅长重复执行相同的事情。在编码中，这通常被称为循环。循环语句允许程序的某部分执行多次。在某种意义上，它就像狗追自己的尾巴。\n\
    \n![](img/4b0b7323b2e8849b30ec17cea1bb735f_31_0.png)\n\n以下是几个最常用的循环语句：\n\n```java\n\
    for (int count = 0; count < 10; count++) { ... }\nwhile (count < 10) { ... }\n\
    ```\n\n`while` 循环使用像分支一样的逻辑表达式。涉及到循环时，通常有两种类型。利用这些信息来决定何时以及如何使用它们。\n\n| For 循环\
    \ | While 循环 |\n| :--- | :--- |\n| 在循环开始前知道要迭代多少次时使用。 | 当你需要使用逻辑表达式来决定循环何时结束时使用。\
    \ |\n| `for` 循环有一个变量和一组相关的元素。 | `while` 循环有一个用于逻辑表达式的外部控制变量。 |\n| 在下面的示例中，我们看到一个名为\
    \ `counter` 的变量被声明并初始化为 0。它将一直增加，直到它不再小于 10。 | 使用控制变量的逻辑表达式在循环期间必须变为假。 |\n\n这是一个使用\
    \ `while` 循环的快速示例。我们想要累加用户指定的 10 个数字。`count` 变量跟踪我们进入循环的次数，因此我们每次都必须对它加 1。一旦完成，我们就显示总和。\n\
    \n```java\nimport java.util.*;\npublic class LoopClass {\n    public static void\
    \ main(String[] args) {\n        Scanner input = new Scanner(System.in);\n   \
    \     int count = 0;\n        int total = 0;\n\n        while (count < 10) {\n\
    \            System.out.println(\"要加的数字：\");\n            int number = input.nextInt();\n\
    \            total = total + number;\n            count++;\n        }\n      \
    \  System.out.println(\"数字总和为 \" + total);\n    }\n}\n```\n\n## 试一下！\n\n## 猜数字游戏二\n\
    \n这个练习通过扩展我们的猜数字游戏帮助你学习更多分支和循环。通过添加以下要求增强猜数字游戏：\n\n- 在之前的程序中用户只有一次机会。我们让他们一直猜直到得到答案\n\
    - 你用什么来结束循环？\n- 你将使用什么类型的循环？\n\n顺便说，你可以使用此函数计算神秘数字：`random.nextInt(10)` 计算 0 到\
    \ 10 之间的随机数。\n\n进入 Java IDE 并创建此程序。\n\n## 试一下！\n\n## 剪刀石头布\n\n这个练习通过剪刀石头布游戏帮助你学习更多关于分支和循环。\n\
    \n![](img/4b0b7323b2e8849b30ec17cea1bb735f_33_0.png)\n\n- 使用下面的剪刀石头布规则编写程序。\n\
    - 运行固定次数的比赛，但如果平局则继续尝试。\n\n| RPS 规则 |\n| :--- |\n| 石头 胜过剪刀 |\n| 剪刀 剪过 布 |\n| 布\
    \ 盖住石头 |\n| 如果两者相同则无人获胜 |\n\n进入 Java IDE 并创建此程序。\n\n## 试一下！\n\n## 俄罗斯轮转\n\n这个练习通过创建俄罗斯轮转帮助你学习分支和循环。俄罗斯轮转是一个人拿着一把有一个子弹的左轮。他们旋转转轮，对准目标并扣扳机。\n\
    \n根据以下细节创建一个俄罗斯轮转练习程序：\n\n1. 随机选择六个槽中子弹的位置\n2. 旋转转轮并随机决定一个槽\n3. 对准目标并扣扳机\n4. 向用户显示结果\n\
    5. 询问用户是否再次尝试\n6. 如果是，再次扣扳机\n\n进入 Java IDE 并创建此程序。\n\n## 学习吧！\n\n## 测试编码过程\n\n\
    考虑测试如何融入我们的简单标准流程。\n\n在本文读的早期阶段，我们讨论了编码过程。使用这个过程可以帮助你在尝试解决问题时一步为营地思考。当我们之前讨论该过程时，我们还没有讨论分支和循环。这两种都会让思考正确的步骤变得困难。\n\
    \n除了列出的三个步骤之外，我还建议你随后测试程序的逻辑（程序是否符合要求）。\n\n"
