- md: "\n## Try It!\n\n## My Media Collection\n\nThis exercise helps you learn arrays\
    \ using a media collection.\n\nMany of you love music. Like you, I have a lot\
    \ of different music. Because I'm old, this music is stored on media like Cassettes,\
    \ Records, and CDs.\n\nYou are tasked with creating a collection of media. You\
    \ will want to use an array to store the media.\n\nPut together a program that\
    \ creates the media collection as described above. It will need to give a way\
    \ to add more media to my collection and view the items I already have.\n\nGo\
    \ into the Java IDE and create this program.\n\n## ADVANCED CODING PRINCIPLES\n\
    \n## Learn Methods\n\nLearn the concept of methods, provide examples of the two\
    \ types of methods, and introduce recursion.\n\nModular coding is all about breaking\
    \ a program into logical pieces that are grouped together to form a method. The\
    \ method can take input parameters and will either do something or return something.\
    \ Because it is bundled in its own package, it can be developed and tested on\
    \ its own and reused as needed.\n\nBefore you can use a method, it needs to be\
    \ defined. The first line of the definition tells the computer more about the\
    \ method. Like declaring a variable, the first line tells the access of the method,\
    \ the type of the method, the name of the method, and if there are any parameters.\
    \ Until we get to Objects, we will treat the methods as \"static\". That means\
    \ that we are going to use them within the class rather than in an object. You\
    \ will learn more about that later. All you need to know at this point is include\
    \ the word \"static\" after the accessor.\n\n| Accessor | Static | Type | Name\
    \ | Parameters |\n| :--- | :--- | :--- | :--- | :--- |\n| (public, protected,\
    \ private) | (static or blank) | (void means no value returned, or a real type)\
    \ | | (A comma delimited list with type and name) |\n| public | static | void\
    \ | methodName | (parameterName) |\n\nNext, you need to write the steps that the\
    \ method will perform. You can use all of the different coding elements we have\
    \ discussed so far in this workbook.\n\nHere is a simple example of a method.\n\
    \n```java\npublic static void printNumbers() {\n    for (int count=1; count<=10;\
    \ count++) {\n        System.out.println(count);\n    }\n}\n```\n\nThis method\
    \ runs through a loop from 1 to 10 and displays the numbers. Here is a simple\
    \ example of a method that returns a value.\n\n```java\npublic static int returnNumber(int\
    \ startValue) {\n    int total = startValue;\n    for (int count=1; count<=10;\
    \ count++) {\n        total = total + count;\n    }\n    return total;\n}\n```\n\
    \nLike the earlier example, the one above runs through a loop from 1 to 10. It\
    \ takes in a parameter (we will talk about those in a minute) and calculates a\
    \ total which is then returned to the calling line of your program using the `return`\
    \ statement.\n\n## Parameters\n\nUsing parameters is a way to send a value to\
    \ a method while you are using it. This value is then used just like a populated\
    \ variable within the method. In the last example above, a value is passed into\
    \ the `returnNumber()` method. Within the method the value can be used through\
    \ the `startValue` variable. Notice how in the first line we set `total=` to the\
    \ value of `startValue`.\n\n## Using a Method\n\nDefining methods is great, but\
    \ then you need to use them in your program. This is done by \"calling\" the method.\
    \ To call a method that returns a value, you will treat it exactly like a variable\
    \ in an arithmetic expression like this.\n\n```java\nmyNumber = MyClass.returnNumber(123);\n\
    ```\n\nRemember we named our method `returnNumber()` and we pass a value in the\
    \ parameter array of 123. This is then used within the method itself.\n\nThe method\
    \ doesn't return a value, you call it without including it in an arithmetic expression\
    \ like this.\n\n```java\nMyClass.printNumbers();\n```\n\n## Recursion\n\nIn addition\
    \ to using a method from your program, you can also call methods from within that\
    \ method. When you call the method you are in, this is called recursion.\n\nIn\
    \ a simple example, we will display a set of messages similar to using a loop\
    \ but will use recursion instead.\n\n```java\npublic static void showMessage(int\
    \ numberOfTimes) {\n  if (numberOfTimes > 0) {\n    System.out.println(\"Printing\
    \ a recurring message \");\n    showMessage(numberOfTimes - 1);\n  }\n}\n```\n\
    \nThe if statement is really important because without it the program would loop\
    \ forever.\n\nSee the line in the method that calls showMessage(?) That is what\
    \ makes this a recursion. If you were to call this method from your program as\
    \ follows,\n\n```java\nMyClass.showMessage(5);\n```\n\nthe method would call itself\
    \ 5 times and display the message \"Printing a recurring message\" five times\
    \ before ending.\n\nThere are many reasons to use a recursion. We will explore\
    \ more within the exercises.\n\n## Factorial\n\nThis exercise will help you learn\
    \ recursion and methods using the factorial formula.\n\nThe factorial formula\
    \ is a great way to learn recursion. 5 factorial, also written as 5! is calculated\
    \ as follows.\n\n```java\nfactorial = 1 * 2 * 3 * 4 * 5\n```\n\nWrite a factorial\
    \ method that takes an integer. The factorial method takes an integer parameter\
    \ and returns the result of the factorial of that number. Note that the factorial\
    \ of 0 is 1.\n\n```java\npublic static int factorial(int n) {\n    if (n == 0)\
    \ {\n        return 1;\n    } else {\n        return n * factorial(n - 1);\n \
    \   }\n}\n```\n\nThis factorial method uses recursion to calculate the factorial.\
    \ It calls itself with a smaller value until it reaches the base case of n ==\
    \ 0.\n\n## Guessing Game using Methods\n\nThis exercise will help you learn methods.\
    \ We will create a program that generates a number and the user has to guess it.\
    \ We will use methods to handle the different parts of the game.\n\n## Learn Objects\n\
    \nIn Java, a class is a blueprint for an object. An object is an instance of a\
    \ class. For example, if you have a class called Car, you can create many Car\
    \ objects.\n\n- Encapsulation\n- Inheritance\n- Polymorphism\n\n| CLASS | OBJECT\
    \ |\n| :--- | :--- |\n| Defines the \"blueprint\" | Implements the blueprint.\
    \ |\n\nWorking with objects involves creating a class and then deantiating an\
    \ instance of that class.\n\nHere is what the code looks like for a class:\n\n\
    ```java\npublic class Car {\n    String color = \"\";\n\n    public void displayInformation()\
    \ {\n        System.out.println(\"The color of this car is \" + color);\n    }\n\
    }\n```\n\nIn the code above we define a class. This is like a new type. In Java\
    \ the .java file and the class name need to match exactly, including the case.\
    \ I suggest that you right click on src and create a new Java Class for each of\
    \ these examples. If you wanted to use this class, you will need to create an\
    \ object instance of the class like this.\n\n```java\nCar myCar = new Car();\n\
    ```\n\nWith the object instance created, you can now use the object as follows.\n\
    \n```java\nmyCar.color = \"Red\";\nmyCar.displayInformation();\n```\n\nThe constructor\
    \ is a way to set up the values of an object at the time it is created. The only\
    \ thing really different here is what we name the method. A constructor has the\
    \ same name as the class. Let's take our Car class and add the constructor:\n\n\
    ```java\npublic class Car {\n    String color= \"\";\n\n    //This is the constructor\n\
    \    public Car(String tempColor) {\n        color = tempColor;\n    }\n\n   \
    \ public void displayInformation() {\n        System.out.println(\"The color of\
    \ this car is \" + color);\n    }\n}\n```\n\nOnce the constructor is defined,\
    \ we can then use it like this.\n\n```java\nCar myCar = new Car(\"Yellow\");\n\
    ```\n"
