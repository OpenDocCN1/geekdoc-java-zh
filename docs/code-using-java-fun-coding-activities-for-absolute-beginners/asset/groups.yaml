    # BASIC COMPUTER CONCEPTS


    # Learn It!


    # Learn Computer Parts


    Learn the most basic parts that make up a computer system.


    A computer is made up of three different types of parts: inputs, processing, and
    outputs.


    No matter what the type of computer—desktop, laptop, smartphone, or other systems—each
    of these parts are there. Here are some examples of what you might see in these
    parts of a system.


    Input


    +   * Keyboard

    * Mouse

    * Finger


    Processing


    +   * Calculations

    * Controls


    Output


    +   * Monitor/Screen

    * Printer


    These three elements work together to provide the experiences we have come to
    expect from our computers.


    ![](img/4b0b7323b2e8849b30ec17cea1bb735f_6_0.png)'
  - '[PAGE 7]


    Inputs come into the computer and flow into a processing program where logic and
    calculations are applied. Once the processing is complete, the results are output.
    This can happen thousands of times per second.


    # Try It!


    # Examples of Parts


    This exercise helps you remember the parts of a computer.


    Write down an example of each of these types of parts.


    | Input |

    | Processing |

    | Output |


    # Learn It!


    # Learn Input


    Learn the different kinds of input that a computer can receive, and what the computer
    can do with the input.


    Inputs are an important part of a computer. They are the way a computer system
    receives information that is processed. Once inputs have been processed, outputs
    can be created.


    In the previous lesson we talked about the different kinds of inputs a computer
    might have. We talked about a small list of inputs, but there are many others.


    +   - Keyboard

    - Mouse

    - Touch Screen'
  - '[PAGE 8]


    +   - File or Database

    - Sensors


    Input can also be events like a mouse getting clicked or a screen being touched.
    Inputs can be stored to be used later in your program.


    The simple input from the keyboard we will use in examples and exercises is this.


    ```

    variableName = input.next();

    ```


    The input statement stores the keyboard input in a variable called variableName.
    You will learn more about variables later in this workbook.


    ![](img/4b0b7323b2e8849b30ec17cea1bb735f_8_0.png)


