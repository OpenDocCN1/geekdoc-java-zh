    \ how a computer processes a program.\n\n+   1. One step at a time\n2. Top to\
    \ bottom\n3. The only things that break this top to bottom flow are:\n   a. Branches\n\
    \   b. Loops\n   c. Objects and Methods\n\nWe will discuss these in this workbook.\
    \ A computer doesn't make guesses like we do. It has to be told in detail every\
    \ little thing to do.\n\nThat level of detail is what a computer needs to know\
    \ to execute your program."
