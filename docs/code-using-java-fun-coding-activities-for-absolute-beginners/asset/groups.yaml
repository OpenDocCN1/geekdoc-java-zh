- md: "\nSee how we set the color to Yellow at the time we create the object instance?\n\
    \nThese are the very basics of objects. In the next several lessons we will delve\
    \ into the topic in more detail.\n\n## Try It!\n\n## Try Objects\n\nThis exercise\
    \ helps you learn object coding using a simple program.\n\nUsing the previous\
    \ lesson and the examples contained therein create a program with these requirements:\n\
    \n- Create a class using something of your choosing. Define at least one variable\
    \ and one method within the class.\n- Write the code that would be used to create\
    \ an object instance of the class you created above.\n- Write a snippet of code\
    \ that would use the object you created above.\n\nGo into the Java IDE and create\
    \ this program.\n\n## Learn It!\n\n## Learn Encapsulation\n\nLearn about encapsulation,\
    \ one of the tenets of object-oriented coding.\n\nEncapsulation is about bundling\
    \ data and operations into a single package. Doing this allows us to better manage\
    \ our program in a couple of ways.\n\nFirst, it allows you to manage the scope\
    \ of change when it comes to variables within the class and the operations (methods)\
    \ that affect that data.\n\nWe haven't used an accessor yet, but they determine\
    \ the visibility of a class, variable, or method. The **public** accessor allows\
    \ the element to be visible to all other classes inside and outside the class.\
    \ **Protected** allows only classes within the inheritance hierarchy to see the\
    \ element. **Private** restricts visibility to the element only within the class.\
    \ When we set a variable as **private**, we can ensure any changes to variable\
    \ data must come through methods in the class.\n\n```java\npublic class Car {\n\
    \    private String color = \"\";\n\n    public Car(String tempColor) {\n    \
    \    color = tempColor;\n    }\n\n    public void displayInformation() {\n   \
    \     System.out.println(\"Car: The color of this car is \" + color);\n    }\n\
    }\n```\n\nSecond, when it comes to testing the class, you can do it as a single\
    \ unit, which is the basis for unit testing. Keeping the changes and the tests\
    \ focused on a single class allow you to manage the impacts that change has on\
    \ the data and operations.\n\nIt is considered a best practice to use encapsulation\
    \ as shown in the **Car** example above to ensure access and scope are closely\
    \ managed.\n\n## Learn It!\n\n## Learn Inheritance\n\nLearn about inheritance,\
    \ one of the tenets of object-oriented coding.\n\nInheritance is something we\
    \ see all around us. In your own family you inherit certain traits from your father\
    \ and mother. If you have a sibling, that person likewise inherits traits. Classes\
    \ can have inheritance in a similar way to that of your family.\n\nIn coding we\
    \ call the parent \"super\" class. Other classes can inherit from the super class.\
