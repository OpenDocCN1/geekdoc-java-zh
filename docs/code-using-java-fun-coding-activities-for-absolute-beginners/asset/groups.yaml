    \ \"Blue\"),\n        new Car(\"Yellow\")\nn}\n```\n\nWith five elements in our\
    \ array, we can show the power of polymorphism. We are going to use a for loop\
    \ to step through the elements within the array. For each element in the array,\
    \ we will call it displayInformation() method.\n\nThe power of polymorphism is\
    \ that the computer will figure out the type of the object and determine which\
    \ displayInformation() method to call on its own. If we add the below lines within\
    \ the main() method we can get the results.\n\n```\nfor (Car car : myCarArray)\
