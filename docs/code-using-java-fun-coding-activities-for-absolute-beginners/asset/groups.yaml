    ## 学习吧！\n\n## 学习文件\n\n学习如何使用文件在程序中写入和读取数据。\n\n在程序中从文件中加载和保存数据可以增强用户体验的健壮性。在此节之前，我们所有的程序都要求用户每次运行程序时输入数据。对于猜数字游戏或计算器来说这没问题，但如果我每次运行程序都要重新输入我媒体收藏中所有的磁带、唱片和\
