    \ - 1);\n  }\n}\n```\n\n`if` 语句非常重要，因为没有它会导致无限循环。如果你在程序中如下调用此方法：\n\n```java\n\
    MyClass.showMessage(5);\n```\n\n该方法将调用自己 5 次，并在结束前显示“Printing a message”。使用递归有很多原因。我们将在练习中探索。\n\
    \n## 阶乘\n\n这个练习将帮助你使用阶乘公式学习递归和方法。阶乘公式是学习递归的好方法。5 的阶乘（写作 5!）的计算方式如下：\n\n```\nfactorial\
