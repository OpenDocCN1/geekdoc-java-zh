- md: "\n# Kids Coding Workbook\n\n# Code Using Java\n\nFun activities for absolute\
    \ beginners\n\nBy: Troy Tuckett\n\n![](img/4b0b7323b2e8849b30ec17cea1bb735f_0_0.png)\n\
    \n# Kid’s Coding Workbook Series\n\n# Code Using Java\n\nFirst Edition Revision\
    \ 2\n\nBy Troy Tuckett\n\nCopyright © 2018 by Troy Tuckett, All rights reserved.\n\
    Printed in the United States of America\n\nJava is a product licensed through\
    \ Oracle Corporation. IntelliJ IDEA is a product licensed through jetbrains.com\n\
    \nISBN: 9781791550820\n\n# Other Books by the Author\n\nToday you can find these\
    \ additional Kids Coding Workbooks on Amazon.com\n\n- Kids Coding Workbook Using\
    \ Scratch (paperback and kindle versions)\n- Kids Coding Workbook Using Python\
    \ (paperback and kindle versions)\n- Kids Coding Workbook Using Pseudo Code (paperback\
    \ and kindle versions)\n- Kids Coding Workbook - Create Games Using Scratch (paperback\
    \ and kindle versions)\n\n# INTRODUCTION\n\n# For Parents...\n\nThis workbook\
    \ was written after decades of teaching beginners coding skills. It is meant to\
    \ teach key principles and cement them in the minds of kids using fun and exciting\
    \ exercises.\n\nThe workbook was created to promote self-paced learning, but it\
    \ can also be used in a classroom setting. It has two main elements that work\
    \ together to help kids learn coding. “Learn It!” sections teach a principle in\
    \ detail and provide examples that are useful to learning the topic. “Try It!”\
    \ sections then use exercises and games to reinforce the learning in the prior\
    \ section.\n\n# For Kids...\n\nIt has been my experience that kids learn best\
    \ when coding concepts are visual and you take the time to use your hands and\
    \ code what you have learned. I strongly encourage you to go through the examples\
    \ and exercises using Scratch and you are reading this workbook. Doing this will\
    \ help you to better retain what you have learned.\n\n# What do you need to know\
    \ to start?\n\nI am assuming in this book that you have little or no knowledge\
    \ of coding and no knowledge of Java. I provide every step you need to get started\
    \ and learn the language. Because there are some download and install steps, some\
    \ computer skills and understanding of folders and windows will be helpful. If\
    \ you don't have them, have a parent help you.\n\n# Learn It!\n\n# Getting Started\
    \ with Java\n\nJava is a general-purpose language that is very popular in business.\
    \ Because of its popularity, it is a great language to learn.\n\nBefore you write\
    \ a program using Java you will need to have the proper software installed. This\
    \ includes installing an Integrated Development Environment (IDE). A common environment\
    \ that supports a variety of operating systems is called IntelliJ IDEA. We will\
    \ be using the Community edition because it installs easily and is free to use.\n\
    \nHere are the steps to get the IDE installed and a short program written.\n\n\
    Begin by going to https://www.jetbrains.com/idea/download/ and selecting \"Download\"\
    \ under the Community heading. Once the file is downloaded, click on the install\
    \ file and follow the install process.\n\nOnce the product is installed, find\
    \ the installed program and double click to run it.\n\nThe first time running\
    \ the program, it might require you answer some questions about where to store\
    \ files and such. After that, you will end up at the welcome page.\n\nSelect \"\
    Create New Project\" from the welcome page.\n\n![](img/4b0b7323b2e8849b30ec17cea1bb735f_4_0.png)\n\
    \nSelect \"Java\" from the different types of projects and click\n\n![](img/4b0b7323b2e8849b30ec17cea1bb735f_4_1.png)\n\
    \nName your project. I called mine \"Stuff\" but you can call yours what you like.\n\
    \n![](img/4b0b7323b2e8849b30ec17cea1bb735f_4_2.png)\n\nWith the project created,\
    \ Select the project folder in the upper left.\n\nFrom the project tree select\
    \ the name of your project (\"Stuff\" for me) and then click \"src\" and choose\
    \ \"New\" and \"Java Class\".\n\nA dialog will pop up where you provide a name\
    \ for your class. Let's call it \"MyClass\". Then click OK.\n\nWithin the editor\
    \ on the right side of the page, type the following program, making sure you include\
    \ all of the elements.\n\n```\npublic class MyClass {\n    public static void\
    \ main(String[] args) {\n        System.out.println(\"Hello World\");\n    }\n\
    }\n```\n\nWhen done, right click within the editor and select 'Run 'MyClass.main()'\n\
    \nIf everything is set up right, toward the bottom of your IDE you should see\
    \ the output of.\n\n![](img/4b0b7323b2e8849b30ec17cea1bb735f_5_0.png)\n\nIf your\
    \ response looks like this, you are ready to get cracking on coding.\n\n# BASIC\
    \ COMPUTER CONCEPTS\n\n# Learn It!\n\n# Learn Computer Parts\n\nLearn the most\
    \ basic parts that make up a computer system.\n\nA computer is made up of three\
    \ different types of parts: inputs, processing, and outputs.\n\nNo matter what\
    \ the type of computer—desktop, laptop, smartphone, or other systems—each of these\
    \ parts are there. Here are some examples of what you might see in these parts\
    \ of a system.\n\nInput\n- Keyboard\n- Mouse\n- Finger\n\nProcessing\n- Calculations\n\
    - Controls\n\nOutput\n- Monitor/Screen\n- Printer\n\nThese three elements work\
    \ together to provide the experiences we have come to expect from our.\n\n![](img/4b0b7323b2e8849b30ec17cea1bb735f_6_0.png)\n\
    \nInputs come into a processing where logic are applied. Once processing is complete,\
    \ outputs can be created.\n\n# Try It!\n\n# Examples of Parts\n\nThis exercise\
    \ helps you remember the parts of a computer. Write down an example of each of\
    \ these types.\n\n| Input | Processing | Output |\n\n# Learn It!\n\n# Learn Input\n\
    \nLearn the different kinds of inputs that a computer can receive, and what the\
    \ computer can do.\n\nInputs are an important part of a computer. They are the\
    \ way computer system receives information that has been processed. In the previous\
    \ lesson we talked about the different kinds of inputs computer might have. We\
    \ talked about a small list, but there are many others.\n\n- Keyboard\n- Mouse\n\
    - Touch Screen\n- File or Database\n- Sensors\n\nInput can also be events like\
    \ a mouse clicked or a screen being touched. Inputs can be stored to be used later.\n\
    \nThe simple input we will use in examples is this.\n\n```\nvariableName = input.next();\n\
    ```\n\n![](img/4b0b7323b2e8849b30ec17cea1bb735f_8_0.png)\n\n# My First Input\n\
    \nThis exercise helps you understand the concept of inputs. Follow these steps\
    \ to create your first program with inputs.\n\n1. Find the project you created\
    \ in IntelliJ and right click on scr. Select New and Java Class.\n\n![](img/4b0b7323b2e8849b30ec17cea1bb735f_8_1.png)\n\
    \n2. Name your class MyFirstProgram and hit Enter.\n3. The file name will appear\
    \ in the editor area on the right. In that area type\n\n```\nimport java.util.Scanner;\n\
    ```\n\n4. Now right click in the white area and find Run ‘MyFirstProgram.main()\n\
    5. The output at the bottom of the screen should look like this. You will need\
    \ to type a name for your program to finish.\n\nWhat's your name? bob\n\n```java\n\
    public class MyFirstProgram {\n    public static void main(String[] args) {\n\
    \        Scanner input = new Scanner(System.in);\n        System.out.print(\"\
    What's your name?\");\n        input.next();\n    }\n}\n```\n\n# Learn It!\n\n\
    # Learn Output\n\nLearn the different kinds of output that a computer can send\
    \ once processing has been completed.\n\nOutputs are the way a computer system\
    \ shows the results of processing that has happened.\n\nThere are a bunch of ways\
    \ that a computer can provide output. This is a small list, but there are many\
    \ others.\n\n- Monitor or Screen\n- Files or Databases\n- Printers\n- Other Devices\n\
    \nWithout output, we don't know what has happened within the computer program.\
    \ In the early days of personal computers, the Altair computer would output through\
    \ a bunch of flashing lights. Today our output seems almost real. We have come\
    \ a long way since the Altair.\n"
  mdcn: "\n\n# 儿童编程练习本\n\n# 使用 Java 编程\n\n面向零基础学者的趣味活动\n\n作者：Troy Tuckett\n\n![](img/4b0b7323b2e8849b30ec17cea1bb735f_0_0.png)\n\
    \n# 儿童编程练习本系列\n\n# 使用 Java 编程\n\n第一版修订版 2\n\n作者 Troy Tuckett\n\n版权所有 © 2018 Troy\
    \ Tuckett，保留所有权利。\n美国印刷\n\nJava 是通过甲骨文公司（Oracle Corporation）授权的产品。IntelliJ IDEA\
    \ 是通过 jetbrains.com 授权的产品。\n\nISBN: 9781791550820\n\n# 作者的其他书籍\n\n现在，您可以在 Amazon.com\
    \ 上找到这些额外的儿童编程练习本：\n\n- 使用 Scratch 的儿童编程练习本（平装版和 Kindle 版）\n- 使用 Python 的儿童编程练习本（平装版和\
    \ Kindle 版）\n- 使用伪代码的儿童编程练习本（平装版和 Kindle 版）\n- 儿童编程练习本 - 使用 Scratch 创建游戏（平装版和\
    \ Kindle 版）\n\n# 引言\n\n# 致家长……\n\n本练习本是在教授初学者编程技巧数十年后编写的。它旨在通过趣味有趣的练习，向孩子们教授核心原理并将其固化在脑海中。\n\
    \n练习本的创建是为了促进自主学习，也可以用于课堂环境。它包含两个共同作用的主要元素来帮助孩子学习编程。“学习吧！”Learn It!）部分将详细讲解原理，并提供对学习该主题有用的示例。“试试看！”Try\
    \ It!）部分将通过练习和游戏来强化上一节的学习内容。\n\n# 致孩子……\n\n根据我的经验，当编程概念是视觉化的，并且你花时间动手去编写你所学的内容时，孩子们学得最好。我强烈建议你在阅读本练习本时，使用\
    \ Scratch 运行一遍示例和练习。这将帮助你更好地记住所学的内容。\n\n# 开始之前需要了解什么？\n\n我在书中假设你对编程一无所知或几乎没有，并且不知道\
    \ Java。我提供了你开始并学习该语言所需的每一个步骤。由于涉及一些下载和安装步骤，具备一些计算机技能以及对文件夹和窗口的理解会有帮助。如果你不具备这些，请让父母帮助你。\n\
    \n# 学习吧！\n\n# 开始学习 Java\n\nJava 是一种通用的语言，在商业领域非常流行。因为它的流行，它是一门非常棒的学习语言。\n\n在使用\
    \ Java 编写程序之前，你需要安装相应的软件。这包括安装集成开发环境（IDE）。支持多种操作系统的常用环境被称为 IntelliJ IDEA。我们将使用社区版（Community\
    \ edition），因为它安装简单且免费使用。\n\n以下是安装 IDE 并编写简短程序的步骤。\n\n首先，访问 https://www.jetbrains.com/idea/download/\
    \ 并在 Community 标题下选择“Download”（下载）。文件下载完成后，点击安装文件并按照安装过程操作。\n\n安装完成后，找到已安装的程序并双击运行。\n\
    \n第一次运行程序时，它可能要求你回答一些关于文件存储位置等的问题。之后，你将进入欢迎页。\n\n从欢迎页选择“Create New Project”（新建项目）。\n\
    \n![](img/4b0b7323b2e8849b30ec17cea1bb735f_4_0.png)\n\n在不同类型的项目中选择“Java”，并点击\n\
    \n![](img/4b0b7323b2e8849b30ec17cea1bb735f_4_1.png)\n\n为你的项目命名。我给我的命名“Stuff”，但你可以起任何喜欢的名字。\n\
    \n![](img/4b0b7323b2e8849b30ec17cea1bb735f_4_2.png)\n\n项目创建完成后，在左上角选择项目文件夹。\n\n\
    从项目树中选择你的项目名称（我的的是 \"Stuff\"），然后点击“src”，选择“New”（新建）和“Java Class”（Java 类）。\n\n\
    会弹出一个对话框，你可以在其中为类命名。让我们叫它“MyClass”。然后点击 OK。\n\n在页面右侧的编辑器中，输入以下程序，确保包含所有元素。\n\n\
    ```\npublic class MyClass {\n    public static void main(String[] args) {\n  \
    \      System.out.println(\"Hello World\");\n    }\n}\n```\n\n完成后，在编辑器中右键点击并选择‘Run\
    \ ‘MyClass.main()’。\n\n如果一切设置正确，你应该会在 IDE 的底部看到输出内容。\n\n![](img/4b0b7323b2e8849b30ec17cea1bb735f_5_0.png)\n\
    \n如果你的响应看起来像这样，你就可以开始学习编程了。\n\n# 基础计算机概念\n\n# 学习吧！\n\n# 学习计算机硬件\n\n学习构成计算机系统的最基础部分。\n\
    \n计算机由三种不同的部分组成：输入、处理和输出。\n\n无论什么种类型的计算机——台式机、笔记本电脑、智能手机或其他系统——这些部分都存在。以下是你在系统的这些部分中可能看到的示例。\n\
    \n输入\n- 键盘\n- 鼠标\n- 手指\n\n处理\n- 计算\n- 控制\n\n输出\n- 显示器/屏幕\n- 打印机\n\n这三个元素共同工作，提供我们所预期的体验。\n\
    \n![](img/4b0b7323b2e8849b30ec17cea1bb735f_6_0)\n\n输入进入处理。处理完成后，就可以创建输出。\n\n#\
    \ 试试看！\n\n# 示例\n\n这个练习帮助你记住计算机的部分。为每种类型写一个例子。\n\n| 输入 | 处理 | 输出 |\n\n# 学习吧！\n\n\
    # 学习输入\n\n学习计算机可以接收的各种输入，以及计算机的功能。\n\n输入是计算机接收已处理信息的方式。在上一节中我们讨论了计算机可能的输入类型。列表很小，但还有很多。\n\
    \n- 键盘\n- 鼠标\n- 触摸屏\n- 文件或数据库\n\n输入也可以是鼠标点击或触摸屏幕等事件。输入可以被存储供以后使用。\n\n我们将使用的简单输入是：\n\
    \n```\nvariableName = input.next();\n```\n\n![](img/4b0b7323b2e8849b30ec17cea8_0)\n\
    \n# 我的第一个输入\n\n这个练习帮助你理解输入的概念。按照以下步骤创建你的第一个输入程序。\n\n1. 在 IntelliJ 中找到你创建的项目并右键点击\
    \ scr。选择 New（新建）和 Java Class（Java 类）。\n\n![](img/4b0b7323b2e8849b30ec17cea1bb735f_8_1.png)\n\
    \n2. 为你的类命名为 MyFirstInput 并回车。\n3. 文件名将出现在右侧的编辑器区域。在该区域输入：\n\n```\nimport java.util.Scanner;\n\
    ```\n\n4. 现在在白色区域右键点击并找到 Run ‘MyFirstInput.main()’\n5. 屏幕底部的输出应该像这样。你需要输入一个名字，程序才能结束。\n\
    \n你的名字是什么？bob\n\n```java\npublic class MyFirstInput {\n    public static void\
    \ main(String[] args) {\n        Scanner input = new Scanner(System.in);\n   \
    \     System.out.print(\"What's your name?\");\n        input.next();\n    }\n\
    }\n```\n\n# 学习吧！\n\n# 学习输出\n\n学习计算机处理完成后可以发送的各种输出。\n\n输出是计算机系统显示已处理结果的方式。\n\n\
    计算机有很多种提供输出的方式。这是一个很小的列表，但还有很多。\n\n- 显示器或屏幕\n- 文件或数据库\n- 打印机\n- 其他设备\n\n没有输出，我们就不知道计算机程序内部发生了什么。在个人电脑的早期，Altair\
    \ 计算机通过闪烁的灯光进行输出。今天我们的输出看起来几乎是真实的。自 Altair 时代以来，我们走了很远。\n\n"
