    \ 1。\n\n```java\npublic static int factorial(int n) {\n    if (n == 0) {\n   \
    \     return 1;\n    } else {\n        return n * factorial(n - 1);\n    }\n}\n\
    ```\n\n这个阶乘方法使用递归来计算阶乘。它带着更小的值调用自己，直到达到 `n == 0` 的边界情况。\n\n## 使用方法的猜数字游戏\n\n这个练习将帮助你学习方法。我们将创建一个生成数字并让用户猜的程序。我们将使用方法来处理游戏的不同部分。\n\
