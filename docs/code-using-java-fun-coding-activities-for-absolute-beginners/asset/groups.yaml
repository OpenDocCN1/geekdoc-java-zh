  mdcn: "\n\n回想一下我们之前过的编码过程：\n* 思考你程序的各种。\n* 写下满足需求所需的高级步骤。\n* 按照这些步骤创建你的程序。\n\n这里有一个你可以测试逻辑的简单方法。\n\
    \n- 1) 准备一张白纸。\n- 2) 在纸的顶部写下程序中的变量名。如果你使用了循环，并不并不总有变量名，但你也应该将每一个变量名都写在顶部。将它们命名为\
    \ Loop1、Loop2 等。如果你有数组（我们将在工作本的下一部分介绍），你也应该包含这些内容。\n- 3) 现在，逐步运行你的程序。不要实际运行程序，而是在看程序时演练这些步骤。\n\
    - 4) 在纸上写下每个变量的值。写下每个循环的值。当值改变时，在旧值下方写新值。\n- 5) 在纸的底部写下程序的程序的输出。\n\n这样做将帮助你确保步骤的逻辑是正确的。它将帮助你确保你正确地思考了整个过程。\n\
    \n这是一个关于如何操作的示例。我们将使用来自“序列”主题的这个程序。\n\n```java\nimport java.util.*;\npublic class\
