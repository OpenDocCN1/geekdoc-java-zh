    \n在使用方法之前，需要对其进行定义。定义的第一行会告诉计算机更多关于该方法的信息。就像声明变量一样，第一行告诉了方法的访问权限、类型、方法名称以及是否有任何参数。在我们学习对象之前，我们将方法视为“静态的（static）”。这意味着我们将在类中使用它们，而不是对象中使用。你以后会学更多关于这点的知识。目前只需要在访问修符后面包含\
