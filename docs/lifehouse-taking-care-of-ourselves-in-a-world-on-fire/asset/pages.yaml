  md: 'There are a few things we might want to note about all of this. The first is
    the improbability that significant numbers of “libertarian leftists” would vote,
    let alone contest office, in conventionally bourgeois elections. Beyond this,
    though, Bookchin never specifies how big his words are to be, or what’s supposed
    to happen if, once created, the people living in them show little inclination
    toward participation in popular assemblies. He fails to anticipate that many communities
    might prefer to define themselves by constitutive exclusion of the outsider, and
    never clarifies who and does not count as a citizen for purposes of participation.


    In fact, he displays an unusually strong, Enlightenment-derived faith in public
    reason (in both senses of deliberative reasoning-in-public and of a public with
    the broad capacity for reason) that can be difficult to sustain for anyone who
    has been exposed to the various feminist and postmodern critiques thereof. He
    never convincingly explains why his decentralized confederal structures would
    necessarily be democratic ones, or why federated communities that are run democratically
    should necessarily be progressive or ecological in their commitments.¹¹⁵ He has
    no real answer to capital flight and doesn''t seem to have entertained the possibility
    that any polity that did succeed in organizing itself along Communalist lines
    might simply be contained, undermined, suppressed or annihilated—as indeed was
    the Paris Commune itself.


    For all his blind spots, Bookchin’s notions of social ecology, Communalism and
    libertarian municipalism offer a way of organizing our communities that is particularly
