    If there’s limited space at the Lifehouse, is it needed more for storage or shelter?
    If there’s limited energy, is it best spent trying to find a more suitable space,
    or establishing a workshop or a vegetable plot at the existing one? If there are
    funds to spend, should they be used to buy seeds or machine tools? Should anyone,
    for matter, be paid for their services to the Lifehouse, or should remain a purely
    voluntary effort? Can someone who’s violated the social contract in one way or
    another be asked to leave the building, or ever barred from using its facilities?


    Deciding questions like these, with immediate, visible, material consequences,
    is real in a way that an advisory citizens’ assembly hammering out consensus on
    matters of national policy cannot ever be. It is to implant self-determination
    in a form not a million different from that practiced by the communes of Rojava
    in the heart of our civic life.


