- img_proc: true
  md: 'There''s a kind of positive externality that emerges from organizing things
    in this way, as well. As we''ve seen, one of the problems that always vexes those
    of us who believe in the assembly, and similar deeply participatory ways of managing
    our communities, is that these types of deliberation are often a hard sell. Most
    of us are exhausted, for starters. Our lives already have us in with obligations
    and prior commitments, situations that require our presence and undivided attention.


    We may not always have the energy or the therewith to travel very far to “participate,”
    even if we’re convinced in the abstract of the value of doing so. If the place
    of assembly is right in our immediate neighborhood, though? And we happen to be
    going there anyway, to charge a phone, pick up the kids, return a borrowed dehumidifier,
    or simply seek shelter from the heat? Then the odds any one of us will get meaningfully
    involved in the stewardship of collective services increases considerably.


    Just like the phone chargers on the table outside C-Squat, think of the infrastructural
    provisions as the “killer app”: the compelling proposition that pulls people into
    the Lifehouse. But the deep value is in the other voices we encounter there.


    Lifehouses would be most useful if we thought of them as places to help us ride
    out the depredations of neoliberal austerity now, as well as the storms to come.
    This means furnishing every cluster of a hundred or so households with access
    to a structure that’s fitted out as a shelter for those displaced from their homes,
    a storehouse for emergency food stocks and a heating-and-cooling center for the
    physically vulnerable. It should be able to purify enough drinking water, and
    generate enough electric power, to support the surrounding neighborhood when the
    ordinary sources of supply become unreliable. And it should be staffed, on a 24/7
    basis, by volunteers who know the neighborhood and its residents well and have
    a developed sense for the matters that concern them most.'
