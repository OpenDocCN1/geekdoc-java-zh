    a jeously cultivated exclusivity and is instead broadly distributed throughout
    the community.


    And the need for maintenance or repair arises on some piece of infrastructural
    equipment that is not convivial, as Illich defined it, let alone based on a technology
    of permanent recourse, we might put some thought into how we can better leverage
    the community’s existing base of knowledge. Karl Hess offered the notion of a
    community skills inventory: a way to compound individual resourcefulness by surfacing
    and making it more widely available.46


    You write code, your neighbor repairs furniture, the woman down the street does
    a little plumbing—but, as things stand, none of you has any idea of the capabilities
    that reside right in your immediate vicinity, or in what permutations your skills
    might be combined. A shared skills inventory repairs this gap in a community’s
    understanding of itself and what its members can do. And better still, it points
    toward the possibility of cross training, so the most critical skills are distributed
    across the entire community, and no one person has to bear the weight of being
    the only trained medic or mechanic or beekeeper around. In this way a Lifehouse
    doesn’t merely rely on the abilities of the people in its surroundings, but can
    help to develop them, too.


