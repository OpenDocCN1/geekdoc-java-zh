  md: 'Each of the projects in this book, in their own way, have tried to do just
    that: carve out a period of space and time in which desperate people could be
    sheltered from the press of need long enough to find their feet and, eventually,
    their voices. Very often this involved arranging the most basic provisions of
    physical safety, bodily sustenance and medical care for people to whom those things
    had been denied. The Panthers did it for the poor Black communities bypassed,
    or at very best patronized, by the Great Society. The volunteers of Common Ground
    and Occupy Sandy did it for themselves, in neighborhoods brought to grief by heavy
    weather—as did the Greek solidarity clinics, in a land undone by nothing more
    material than a few fatal paragraphs in a loan agreement.


    If care what sustains our capacity to exist at all, what sustains care is the
    exercise of power. In a world where the maintenance of a high standard of comfort
    for a very few seems to require that virtually everyone else be deprived of any
    control whatsoever over the circumstances of their being, any ability to grasp
    resources and direct them toward the care of those in need requires that we reassert
    our claim to control. The Spanish municipalists aimed to extend the ambit of self-determination
    to an entire city, and the Kurds of northern Syria across a territory every bit
    the size of a smaller nation-state. Murray Bookchain dreamed it at the scale of
    the entire globe: a conf mesh of autonomous communities spanning the planet, in
    which free people bring the metabolism of their collective being back into line
    with the cycles and rhythms of a thriving Earth.


    What I''ve tried to evoke, in my account of each of these cases, is the sense
    of collective power as a positive pressure, pushing outward against the chaos
    and night. Wherever communities exercised this power, they were able to establish
    an envelope, however fragile or temporary, inside of which the injured might catch
    their breath and restore themselves—and therefore regenerate their organic capacity
    to endure, to resist and to create.'
