    to the national health system, this network played a critical role in maintaining
    the physical and psychological health of millions living through one of the most
    sustained contractions in peacetime living standards were experienced by a population
    of the global North.


    What requires some explanation is how the solidarity network came to spread beyond
    Syntagma and the parallel occupations of public space in the other cities of Greece,
