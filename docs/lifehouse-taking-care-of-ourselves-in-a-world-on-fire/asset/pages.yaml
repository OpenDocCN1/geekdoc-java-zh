  md: '“democracy” in contemporary life so often gets reduced to the vote for one
    representative or indifferent choice over another, the participatory tradition
    of the assembly gives democratic values a far fuller and more robust expression.
    It is an immediate, concrete exercise of collective power, available wherever
    and whenever people come together in any number greater than a handful.


