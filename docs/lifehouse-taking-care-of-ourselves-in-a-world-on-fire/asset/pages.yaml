  md: 'Here Bookchin’s clear, early articulation of what has since become universally
    accepted scientific consensus feels stunningly prescient;


    Since the Industrial Revolution, the overall atmospheric mass of carbon dioxide
    has increased by 13 percent over earlier, more stable, levels. It could be argued
    on some theoretical grounds that this the growing blanket of carbon dioxide, by
    intercepting heat radiated from the earth into outer space, will lead to rising
    atmospheric temperatures, a more violent circulation of air, to more destructive
    storm patterns, and eventually to a melting of the polar ice caps (possibly in
    two or three centuries), rising sea levels, and the inundation of vast land areas.⁸


    Again, considering the unnerving clarity of vision to see these ideas in print
    months before Martin Luther King was awarded the Nobel Peace Prize, the Beatles
    played Shea Stadium, or American combat forces landed in Vietnam. The only aspect
    of Bookchin’s 1964 framing that is in any way incorrect is the optimism of locating
    the melting “two or three centuries” from now.


    It’s Bookchin’s second insight, though, that really gives his social ecology its
    continuing and acute relevance. This was that the planetary crisis was caused,
    in large part, by what he called the “social pathologies” of patriarchy, statism
    and capitalism, and could not be undone or reversed without first unwinding them.
    He understood, before virtually any of his contemporaries on the left, the causal
    link between our compulsion to dominate—especially as it was expressed in the
    capitalist project of unlimited growth—and the destruction of the ecosphere and
    therefore its capacity to support all Earth life.


    Marxist economics, with its theory of the “metabolic rift,” offers some of the
    analytical insights you’d need to draw upon to reach a conclusion like this; the
    intersectional feminism of the Combahee River Collective others; and mainstream
    ecological science yet others again.⁹ But social ecology is the first body of
    thought I am aware of that links the planetary crisis to the alienation as individuals
    and communities via their common causal factor of domination.'
