    initiatives with an overt politics. One of the earliest members of Common Ground—so
    trusted, indeed—that between January and April 2007, he served as its director
    of operations—was an FBI informant.63


    And sometimes, the means of disruption are raw and lethal. Let a community assert
    any degree of territorial control or show any sign that it intends to subside
    outside capital permanently, and it will swiftly find itself a community marked
    for elimination in one way or another.


    This is neither hyperbole, nor paranoia, nor an inflated sense of the significance
    of such efforts. More than one Lower East Side squat was set ablaze under mysterious
    circumstances and allowed to burn to the ground as officers of the city’s department
