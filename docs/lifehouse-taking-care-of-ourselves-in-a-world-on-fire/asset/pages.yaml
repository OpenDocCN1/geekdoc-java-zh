  md: '“Confluence” is a difficult-to-translate term in Spanish municipalism, used
    to describe what elsewhere simply be called a “platform.” As was emphasized to
    me any number of times during my travels in Spain, confluences are precisely not
    coalitions of parties. The primary point of distinction seems to be that a coalition
    is a temporary, tactical coming-together of existing entities that continue to
    maintain their own distinct identities (e.g., a labor union, an NGO, a social
    movement) as they work together toward a given end. By contrast, a confluence
    is an in-gathering of individuals—in principle, even the same individuals who
    might have been mobilized by a coalition among the parties to which they belong—organized
    under a new identity and committed to a process of self-definition by assembly.


    Partisans of any existing formation were free to join the confluences, but they
    had to do so as unencumbered individuals. “Nobody could participate in the gatherings
    in representation of other collectives, associations, or institutions which were
    political parties and unions ... Everybody was a bare participant and had to speak
    on her behalf.”⁴47 In Spain, the language used to explain this, by ordinary activists,
    can be uncannily high-theoretical; the word chosen to describe this logic by just
    about every street-level Ahora Madrid participant I met was “molecular,” as if
    they’d just put down a dog-eared copy of Deleuze.


