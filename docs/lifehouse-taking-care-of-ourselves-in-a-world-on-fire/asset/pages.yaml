  md: '# 4


    # Beyond Hope


    And so we find ourselves at a moment of decision. What can we do now, to make
    our way through the terrifying set of conditions we’ve inherited? What choices
    are available to us?


    We can buy less, and that more locally, in the hope that in aggregating and responding
    to our purchase signals, the market will commit itself, permanently and worldwide,
    to a low-carbon production pathway.


    We can vote, in the hope of electing legislatures and governments committed to
    real climate action and able to see their policies enacted as binding law.


    We can protest, in the hope that legislators will need and heed the will of their
    constituents, and that governments and transnational bodies can be pushed toward
    a more aggressive defense of the planet, whether they were elected or not.


    We can engage in civil disobedience, in the hope that we can convince enough of
    our fellow citizens of the lateness of the hour, and that they, too, will be motivated
    to do something.


    We can engage in the sabotage of extractive industries, in the hope that their
    calculus of return on investment can be shifted, and that shareholders will tire
    of plundering the Earth for so little in the way of gain.


    We can work toward the revolutionary seizure of power, in the hope that we will
    succeed in time to take meaningful action on climate, and that our'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'success will inspire other would-be insurgents to undertake and accomplish
    the same, everywhere.


    We can entrust our fate to technical means, in the hope that someone somewhere
    will invent a way of safely decarbonizing the atmosphere, or reflecting the sun’s
    heat back to space, or stabilizing the ice sheets that they are, or really all
    of that.


    Each of us is free to commit to any of these courses of action, or—at the risk
    of some incoherence—even all of them at once. They are all based on a self-consistent
    theory of change of one sort or another. But despite their superficial differences,
    all of these strategies share some deep qualities in common. They are all indirect:
    they leave you moored in your life, standing by, doing nothing to develop your
    own capacities. They act with delayed effect: however long they take to work,
    we can reasonably sure that it is not soon enough. They are wildly contingent
    on the coordinated efforts of others, depending on the energy, conviction and
    incorruptibility of human beings beyond our reach or ability to influence, and
    their capacity to cooperate with one another at scale.


    Finally, there’s no guarantee that any of them will work or even produce any measurable
    results at all. You could invest every iota of your life energy in any of these
    strategies for change for the rest of your days on Earth and move the needle on
    climate not at all.


    This leaves us with one final possibility. We can act—directly, immediately, locally,
    without waiting for the state or any other institution to undertake our defense.
    What might that look like?


    In her wonderful social history of squatting on New York’s Lower East Side, Ours
    to Lose, Amy Stareski tells the story of the electricity-generating stationary
    bicycle set up on the sidewalk outside C-Squat on Avenue C, which supplied power
    to a bank of phone chargers during the extended outages that followed Superstorm
    Sandy.¹ The entire community'
  merge: -1
  pgno: 179
- img_proc: true
  md: 'gathered around the chargers, at first simply to top up their phones, but later
    simply because that’s where the people were. Over these days and weeks, the sidewalk
    in front of C-Squat was the most obvious place for people experiencing a sharp,
    sudden disruption of their way of life to seek out useful information, the comfort
    of fellowship and vital material support.


    Here in microcosm is a model for the kind of community infrastructure we will
    need to see us through the Long Emergency: when the grid goes down or the water
    from the pipes isn''t safe to drink, there ought to be a place close at hand where
    we can attend to these material needs ... that is also a place where we might
    seek the strength, insight and reassurance of others in the same straits.


    As the unfolding reality of Earth system collapse increasingly intersects with
    the organized abandonment of our communities, and the complex systems we rely
    upon for the maintenance of everyday life prove to be far more fragile and contingent
    than we’d ever understood them to be, many of us will have more and more need
    of settings like this. What I believe our troubled times now ask of us is that
    we be more conscious and purposive about creating them in our communities—each
    one provisioned against the hour of maximum need and linked with others in a loose,
    confederated network. I call them “Lifehouses.


    The fundamental idea of the Lifehouse is that there should be a place in every
    three- or four-block radius where we can charge your phone when the power’s down
    everywhere else, draw drinking water when the supply from the mains is for whatever
    reason untrustworthy, gather with your neighbors to discuss matters of common
    concern, organize reliable childcare, borrow tools it doesn’t make sense for any
    one household to own individually and so on—that these can and should be one and
    the same place. As a foundation for collective resourcefulness, the Lifehouse
    is a practical implementation of the values we’ve spent this book exploring.'
