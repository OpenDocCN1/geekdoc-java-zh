    profusion is frankly bewildering. Roughly contemporary, and all appearances equally
    authoritative, sources refer in English to the Democratic Federation of Northern
    and Eastern Syria, or the Federal Democratic System of Northern Syria, or the
    Autonomous Administration of North and East Syria (AANES). Most of us know it,
    more simply, as “Rojava.”


    With a population of somewhere between 2.5 million and 5 million, and persisting
