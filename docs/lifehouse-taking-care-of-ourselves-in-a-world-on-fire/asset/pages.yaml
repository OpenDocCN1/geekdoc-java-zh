  md: 'In the end, my involvement with Occupy Sandy was comparably shallow. All told,
    it amounted to perhaps two weeks of shifts at the 520 Clinton Avenue distribution
    hub; participation in a few of the general assemblies which the community reported
    back to itself what it had learned and decided on courses of future action; and
    an unforgettable Christmas Eve huddled on a freezing church porch that still smelled
    of a recent firebombing attempt, singing carols and old Wobbly songs with the
    other volunteers that night. What I saw during these few hundred hours, though,
    did as much to transform my sense of what ordinary, untrained people could achieve
    together as anything I''ve ever experienced.


    For my entire adult life, I had been told that the principles of self-organization
    I believed were childish, impractical, utopian fantasies that might work tolerably
    well in small groups of people who already similar political commitments, but
    couldn''t possibly so “at scale,” among significant numbers of citizens. And yet
    here was the most concrete proof possible that these same, ostensibly impractical
    principles could successfully be used to coordinate a highly complex and occasionally
    life-critical effort, consistently and for a number of months, across the largest
    and most demographically diverse metropolitan area in North America. If anybody
    doubted that self-organized, nonhierarchical mutual aid projects could respond
    to catastrophe every bit as effectively as official disaster-relief agencies—if
    not, in many cases, markedly more so—their questions ought have been resolved
    by Occupy Sandy.


    That ordinary New Yorkers could organize themselves to achieve something this
    complicated and difficult, under immense pressure, put flesh on the bones of my
    fundamental belief in undirected human capacity. That they could do so with the
    most limited means, in the face of opposition that ranged from patronizing skepticism
    to outright arson, said something impressive about their ability to make sound
    collective decisions, despite the pressure. And for this kind of order to arise
    spontaneously, in the early'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'aftermath of the most significant natural disaster in the city’s living memory,
    strikes me as nothing short of astounding. I doubt there are 60,000 convinced
    anarchists in New York City. There may not even be a tenth of that number. But
    there are 60,000 who did anarchy, all through the storm and the months that followed,
    and did so brilliantly. And perhaps this offers us a more general template for
    ways in which we might organize our communities so that they shelter of us from
    more of the hard times ahead.


    But if organizing ourselves in this way also helps to repair other, more chronic
    insults to our well-being—the overwhelming sense of powerlessness we so often
    contend with, the dread of the future we barely manage to tamp down, even the
    damage inflicted upon us by the ordinary disasters of everyday life? What if the
    experience of coming to the aid of our community affirms us in ways we might not
    have dared to ask for, or even imagined possible?


    In 2009 book A Paradise Built in Hell, the writer Rebecca Solnit discusses this
    aspect of efforts that arise in the aftermath of disaster. She writes movingly
    of the joy one can take, in the midst of catastrophe, from inhabiting for the
    first time a civic self, a self rooted in the provision of communal care—one that
    seems infinitely larger and more capacious than those narrower selves that are
    invoked by work, family life, consumerism, therapy culture or identity politics.
    And she goes on quote the American sociologist Charles Fritz to the effect that
    the “widespread sharing of danger, loss and deprivation produces … solidarity
    among the survivors, which overcomes social isolation, provides a channel for
    intimate communication and expression, and a major source of physical and emotional
    support and reassurance.


    This isn’t some sociological theory of the wouldn’t-it-be-lovely-to-think-so variety
    but a consistent empirical observation. Consider what John P. Clark related about
    his experience of the Common Ground mutual aid effort'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'that arose in New Orleans following 2005''s Hurricane Katrina: “Volunteers
    and survivors often described the experience of a break with conventional reality,
    and the emergence of a new time and space of possibility.”⁹⁹


    The sense of an opening that Clark reports in every detail with what the artist
    and activist Cassie Thornton found in her visits to the “solidarity clinics” of
    austerity-stricken Greece in January 2017: “I met a group of middle-aged women
    who cited the ‘crisis’ as the birth of their new lives as radicalized people within
    activist communities, who had found a purpose, who were now more than just workers
    and consumers. They felt powerful, connected and interdependent for the first
    time.”¹⁰


    People who participated in these efforts consistently experienced the feeling
    of interdependence as *healing*, at both the individual and communal levels. “People’s
    differences went by the wayside,” said one Occupy volunteer, who spent three months
    working in the hardest-hit areas of the Rockaways. This same volunteer went on
    note the curious fact that the opportunity to contribute to the relief effort
    was itself part of the relief furnished: “Helping others became a major coping
    mechanism for many people. It’s much better to have them empowered rather than
    having people stand in a line to beg for aid.”¹¹


    Perhaps most poignant of all is the stark contrast between the sense of empowerment
    Solnt, Clark, Thornton and this unnamed Occupy volunteer all mention and the pursuits
    that are supposed to produce meaning and value in the rest of our lives. When
    Clark says that in the provision of mutual aid, “[o]ne could experience one’s
    activity as intrinsically valuable,” the strong implication is that the things
    we ordinarily do—that *we have to do*, in order to keep a roof over our families’
    heads, and food on the table—are *not* experienced that way.¹²


    The crux of this isn’t simply, as Charles Fritz was given to pointing out, that
    “the everyday, ongoing life of the society” is its own kind of quiet disaster.
    It’s that the way our society is currently organized affords us very'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'few opportunities to step outside the identities we’ve so carefully shored
    up, and simply show up for the people who need what we have to offer. It was just
    such an opportunity that Occupy Sandy extended. If you’ve ever given blood, maybe
    you’ll recognize these aspects of the way it felt to work at 520 Clinton: that
    it mattered, that there was no detectable downside to it and whatever good came
    of it had not a thing to do with who I thought I was, who the world perceived
    me to be or how I preferred to present myself.


    And in this, there is a clue as to what form our response should take when the
    excursion from normalcy lasts not just the weeks or months it might take to rebuild
    after a storm, but forever. You may have noticed that words crop up again and
    again in participants’ accounts of mutual aid efforts. They are the exact same
    things I experienced in the course of my own involvement with Occupy Sandy: Purpose.
    Power. Possibility.


    These are the qualities that stand out in personal narratives of mutual aid work,
    to the point that people thought they were worth mentioning, suggests just how
    much we suffer from the pointlessness of the work most of us are ordinarily required
    to do, as well as the broader passivity and isolation to which our usual roles
    in life have consigned us. But the accounts also suggest that something profound
    seems to happen in the moments after some catastrophe has disrupted the ordinary
    flow of life, in which we stop waiting for rescue and commit ourselves to collective,
    reparative action. The choices we make in these moments evidently have the power
    to bind up other, seemingly unrelated wounds. They may even open onto entirely
    new ways of being in the world.


    To me the implications of this extend far beyond either “mutual aid” or “disaster
    relief,” in the very strictest sense of those terms, and invite us to think expansively
    about what such efforts might mean when unfolded to their fullest extent, in a
    world where so many of the old certainties no longer apply.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'What I’m proposing is that the most productive way of addressing each of the
    intertwined crises that confront us—the fundamental, planetary one of climate-system
    collapse, yes, but also the dread and the powerlessness and even the inordinate
    difficulty we so often seem to have now, in communicating across the genuine differences
    that cleave us—consists in our application of one and the same strategy.


    And happily, this strategy also happens to be the most immediately accessible
    to us. It lies in organizing ourselves to take care of one another, without waiting
    for anybody to care to us as generic subjects, sell it to us as customers or offer
    it to us as passive recipients of a charity bestowed from above. In other words:
    *doing something about the straits we''re in*, directly and in our own neighborhoods,
    in ways that call upon all the resources and capacities the roles we play in everyday
    life have no need of place and no value upon. Who knows that we may finally find
    ourselves that we recognize, even here in the most difficult and challenging hours
    of our lives.


    This is what I want us to hold on, as we move further into the time of storms
    together. In the rest of this book, we’ll learn how to develop this set of ideas
    and put them to work.


