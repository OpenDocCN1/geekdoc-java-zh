  md: 'The commitment to mutual aid doesn’t emerge from any kind of prior theory,
    in other words, simply from the recognition that when the institutions to which
    we’ve entrusted our care fail us, the only thing standing between us and the darkness
    is our own capacity for collective, self-organized action. Mutual aid is simply
    how people without resources have always arranged the means of their own survival:
    cooperatively, outside the structures of market or state, using whatever tools
    they had ready to hand. This is the sense in which the anarchist philosopher Peter
    Kropotkin first used the term, in his enduring lively 1902 classic Mutual Aid:
    A Factor of Evolution.^2 Holding the capacity for cooperation is a trait older
    than humanity itself, which has been conserved across deep time for the enhanced
    likelihood of survival it confers on populations, Kropotkin insists that it is
    a possibility that remains available to us, even now, and that it might continue
    to sustain human communities through their darkest hours.


    But mutual aid isn’t quite as simple as cooperation toward the shared goal of
    survival in a time of emergency. Nor is it quite coextensive with the set of practices
    political scientists rather clunky describe as the “non-state provision of social
    welfare,” though it is that in schematic.^3 In its modern sense, the term primarily
    refers to those citizen-driven emergency relief efforts that stem from and reproduce
    a distinct set of values, most central among which is horizontality.


    In this context, horizontality is much more than an organizational structure.
    It is the refusal to impose, observe or respect any power relation between the
    person who is extending help and the person who requires it. This is the fundamental
    quality that distinguishes mutual aid from other models of voluntary, nonstate
    service provision, like charity. Where Kropotkin insists on a show of gratitude
    from the recipient—or at least tacitly expects them to nurture a sense of obligation
    that must someday be discharged—mutual aid rejects the savior/saved dynamic entirely.^4'
