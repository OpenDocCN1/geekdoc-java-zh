    # ## The Long Emergency


    Shortly before 5 p.m. on Tuesday, July 19, 2022, the temperature reading at the
    Royal Air Force base in the Lincolnshire town of Coningsby hit 104°F (40°C), setting
    an all-time record in a United Kingdom that was enduring the second successive
    day of unprecedented heat.


    Across Great Britain, train service came to a virtual standstill, as rails buckled,
    overhead power lines came down and trackside electrical fires compromised the
    safe operation of those mainline routes that were still running. Highways and
    airport runways that had been engineered for an era of lower operating temperatures
    rippled and cracked. Two of the capital’s largest hospitals were forced to cancel
    operations and reroute critically patients to other facilities, after the air-conditioning
    units cooling their data centers failed and their IT systems collapsed. A large
    arc of wildfires left smoke hanging over much of the country, from North Yorkshire
    to Essex; the London Fire Brigade declared a major incident after having attended
    some 1,146 call-outs on July 19, making it far and away their busiest day since
    the Luftwaffe bombings of the Second World War.


    Once the situation had stabilized over the course of the following week, the true
    cost became clear. Official sources estimated that a thousand Britons had lost
    their lives in the swelter, their deaths attributable to no other cause than the
    heat—a higher number of deaths from this cause, over'
