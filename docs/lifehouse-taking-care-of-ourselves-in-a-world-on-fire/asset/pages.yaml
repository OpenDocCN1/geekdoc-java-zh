  md: '# # Introduction


    We were out of town when Superstorm Sandy made landfall on New York City, my partner
    and I, and had trouble catching a flight home. What I recall most vividly about
    the event itself was the disorientation of seeing a broadcast on CNN of the familiar
    intersection in front of our building, flooded waist-high. The traffic signals
    were swinging wildly on their mast arms overhead, in what an excited voiceover
    described as sustained winds of forty miles an hour or more.


    A montage of increasingly surreal footage followed: the tide overtopping a seawall
    somewhere in the Rockaways, torrential floodwaters surging in the Brooklyn-Battery
    Tunnel, then a construction crane snapped in two by the wind, dangling twenty-five
    stories above Midtown. And finally that unforgettable image of Lower Manhattan,
    the whole bottom third of the island gone dark after a transformer explosion at
    the Con Ed electric substation on East Fourteenth Street.


    This was plainly no ordinary hurricane. Even before its surge hit New York City,
    Sandy was already strikingly unusual. The lead winds of a late-season storm, among
    the largest Atlantic hurricanes on record, had begun to fuse with an existing
    continental front, producing something vastly larger and weirder than either.
    The combined system would go on to loiter over the northeastern United States
    for days, stretching ordinary expectations of a weather event to the breaking
    point, and in doing so defining an entirely new category of “superstorm.”


    But it was the storm surge, when it came, that literally redrew the maps. Measured
    at its peak at the Battery at a previously unimaginable 13.88 feet'
  merge: -1
  pgno: 9
- img_proc: true
  md: '(4.2m)—or some seven feet (2.1m) above flood stage—it was this surge, far more
    than the rain or the wind, that caused the most severe and lasting damage.¹ As
    the brackish water streamed inland, it flooded into subway tunnels, utility vaults,
    basements and hundreds of thousands of other belowground spaces. The Hudson and
    East Rivers overfilled their banks, as smaller waterways like the heavily polluted
    Gwananus Canal. Low-lying areas of New York City, from Manhattan''s Financial
    District to the beach communities of outer Queens, suddenly found themselves submerged
    beneath a filthy, freezing tide.


    It was more than any of the planners, architects or civil engineers responsible
    for the city’s form had ever anticipated, and in the end it was more than any
    ordinary day, ran quietly in the background. Power, fuel, transportation and communication
    networks all went down, despite the backups and failovers that had been so carefully
    designed into them. In the worst-hit neighborhoods, they stayed down for weeks.


    In New York City alone, tens of thousands of households found themselves without
    light, heat or potable water. Elderly people and others with limited mobility
    were trapped on high floors in their thousands, marooned atop twenty and thirty-story
    buildings whose elevator service was not restored for a week or more. Entire projects
    were left to fend for themselves, the maintenance crews responsible for their
    upkeep and repair stranded offsite by the collapse of the regional transportation
    network. Attempts to restore service struggled against acute and immediate fuel
    shortages, amid lengthening lines and spreading mayhem at gas stations. And, in
    true insult-to-injury style, there was barely time for anyone to internalize any
    of this before a vicious early cold snap settled onto the area.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'By the time my partner and I made our way back to New York, it was already
    clear that Sandy would turn out to be one of those events that rewrites the way
    we understand the world we live in. Like the “500-year” floods or wildfires that
    now seem to strike every few months, the appearance of this storm suggested that
    the atmosphere had undergone a transition to a volatile new state, in which weather
    events of a magnitude once thought impossible were plainly now on the table, and
    those that had been considered exceptional would become routine. It was one of
    moments of ruthless clarity: a meteorological disturbance so massive that it defied
    classification, difficult to attribute with any credibility to anything but human
    action, had landed on the very capital of Empire. And in a matter of hours, it
    had laid waste to all the intertwined systems that kept it functioning.


    Maybe it’s simply that all of this happened to a place as comprehensively mediated
    (and endlessly, baroquely self-mythologizing) as New York City. But at least for
    those of us who found ourselves living through its aftermaths, Superstorm Sandy
    felt like some kind of rupture or punctuation in history—the advent of a new era,
    in which the contours of everyday life everywhere on Earth would fundamentally
    be determined by the consequences of anthropogenic global heating. It will never
    be possible to point to a given day on the calendar and say, “Yes, that’s when
    everything started to change,” and in any event I expect that moment would be
    different for each one of us. If you were forced to choose a single event, though,
    a single nodal point at which one set of assumptions about the future might unfold
    was replaced wholesale by another, you could do a whole lot worse than this.


    Most of the ways in which Sandy reset our expectations about the world we live
    in were scary, and hard to accept—but not all of them. If there was one bright
    light that kept burning amid the devastation, it was there in'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'New York an organization able to stand up a logistical network and begin relief
    and recovery operations almost immediately. This organization had two distribution
    hubs set up before the last of Sandy’s trailing winds had cleared the tristate
    area. It funneled an enormous volume of donated goods and supplies out to the
    hardest-hit areas of the city. It furnished every crew of volunteers willing to
    take on the difficult, dirty and occasionally dangerous job of site clearance.
    And it took on responsibility for providing thousands of displaced, traumatized
    New Yorkers with shelter, warmth, sustenance and fellowship.


    The organization I''m talking about wasn’t FEMA—the Federal Emergency Management
    Agency formally chartered by the United States government to respond to large-scale
    disasters, whether “natural” or manmade—and it wasn’t the National Guard. Nor
    was it the Red Cross, the superficially benign philanthropy familiar to generations
    of Americans for its role in distributing blankets and food parcels in the wake
    of crisis. In fact, it was neither a government agency nor a charitable effort
    of any kind. It was a spontaneous, self-organized initiative assembled in real
    time by veterans of the previous year’s Occupy Wall Street movement, and consciously
    guided by the anarchist ideals and values of that movement. It was called “Occupy
    Sandy.”


    Occupy Sandy was simply the easiest, fastest and most effective way for an ordinary,
    unaffiliated New Yorker to get involved with the relief effort in the hours and
    days following the superstorm’s landfall, whatever their political convictions.
    That I am aware of, was the only organization that had meaningful and productive
    things for people without specialized skills to do in the city’s moment of maximum
    need—only one with the capacity to absorb the massive incoming flows of volunteers,
    supplies and financial contributions, and the network to direct those materials
    and energies to the places where they could do the most.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'Some numbers will begin to suggest the magnitude of the things unpaid amateurs
    accomplished together, on an improvisational basis, without anything in the way
    of leadership, institutional infrastructure, existing financial resources or prior
    planning. Within a week of the peak storm surge, Occupy Sandy had 700 core members
    working out of two repurposed churches in the Brooklyn neighborhoods of Clinton
    Hill and Sunset Park, and was serving approximately 20,000 meals a day across
    a far-lung constellation of thirty or more “recovery centers” stretching from
    Red Hook to New Dorp.


    By the end of November 2012, the initiative could marshal some $700,000 worth
    of supplies and equipment, and ultimately collected more than $1.3 million in
    donations intended to support its efforts.³3 told, some 60,000 volunteers were
    eventually involved in this bottom-up relief effort in one way or another—roughly
    times the number fielded by the American Red Cross—bringing with them insights
    and perspectives from all walks and strata of New York City life⁴


    I was one of them. And for the first time in my life, I was in a position to do
    something about the consequences of global heating.


    It''s doing something that I want to spend the rest of this book exploring—both
    the commitment to local, self-organized action itself, and everything it opens
    up for us, in a time when so much about our lives feels like it is shutting down.


    Superstorm Sandy, of course, was just one event in the larger pattern of events
    that we generally think of as “the climate crisis,” defined by the heating long
    dependency on fossil fuels has visited the planet’s atmosphere, and all the hurricanes,
    wildfires, droughts and other catastrophic consequences that now follow from it.


    One of the most prominent features of this crisis is that we generally feel helpless
    to do anything about it. This is not because we don''t know what'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'causes the atmosphere to warm. The causality is straightforward: the upward
    march of temperature results results from three centuries in which our species
    powered its expansive activities by burning the “fossil” hydrocarbon fuels of
    oil, gas and coal, slowly saturating the atmosphere with the carbon dioxide that
    absorbs so much of the sun’s heat.


    Nor is there any ambiguity about what it would take to slow or reverse the heating—and
    therefore, eventually, subdue the roiling volatility that now threatens so much
    of everything we care for. The prospects for that depend vitally on eliminating
    the combustion of such fuels, which even now account for an overwhelming proportion
    of everything that powers the global economy—in 2022, an estimated 81 percent
    of all energy consumed on Earth.⁵


    The trouble is that choices concerning energy strategy are made by institutions
    that are inaccessible to the ordinary person, and who are, in any event, very
    heavily incentivized to keep on doing just as they have done. Unless you yourself,
    personally, are a large shareholder of an energy company, or the autocratic ruler
    of a fossil fuel–producing country, your ability to affect any meaningful change
    in how the global economy is powered virtually nonexistent. Until the parties
    who *do* have the power decide otherwise, then the mining, the drilling, the pumping
    and the burning will continue unabated—and with them the unrelenting accumulation
    of carbon in the atmosphere, the heating and the terrible consequences for all
    human and nonhuman life.


    This is the point at which our sense of helplessness really starts to feel overwhelming,
    because none of the mechanisms for change that are available to us feel like they’re
    up to the task of addressing increasingly distressing circumstances.


    In liberal democracies, electoral representation is the dominant, and only formal,
    theory of change on the table. But can we vote someone into office for whom robust
    action on the climate is an overriding priority? We would'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'have to find someone like that, first of all. They’d have to win election.
    We’d have to hold them to whatever commitments they made on the campaign trail,
    against the influence of extractive industries that are boundlessly wealthier
    and better resourced than we are. And then we would have to trust that large enough
    number of voters around the country had managed to do the same in their own constituencies,
    such that the caucus for change is the dominant force in the legislature.


    As improbable of all of this sounds, it''s the only game in town. And so many
    of us still troop off to the voting booth every few years and cast our ballots
    for those candidates we think will advance our concerns in the halls of power.
    For the most part, that''s where the matter remains: the ambit of public action
    many people are willing to be confined to what happens on Election Day, whatever
    misgivings they or anyone else may harbor about its effectiveness or consequence.


    For many of us, of course, registering our concern for what is being done to the
    climate as indirect signal every few years feels ridiculously inadequate to the
    scale and urgency of the crisis. But what''s left to us consists largely of our
    own choices. We give up the car and take the bus instead, or ride a bike to the
    market. We cut red meat from our diet, reuse our shopping bags and are diligent
    sorting the packaging for recycling. We may go so far as give flying, or we forgo
    having children ourselves. And all the while we do the things we will give voice
    to our rising sense of unease. We march and sign petitions, we make displays of
    our worthiness and unity and number and commitment in the hope of influencing
    those who make the laws.


    When these things begin to feel irrelevant or pointless, we block highways. If
    we''re feeling particularly brave, we chain ourselves to the doors of the closest
    oil-company headquarters. But none of that seems to move the needle, either—not
    on legislation, not on policy, not on any of the decisions made by those whose
    decisions actually matter. No matter what'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'we do, the figure for atmospheric ppm carbon dioxide ticks ever higher. It
    often feels like all we can do is look on in horror as the line on the graph continues
    its relentless upward해주세요, bursting through every successive threshold at which
    we''ve been told livable conditions might still be preserved on the planet.


    We scan the news, and it''s full of dust storms and receding glaciers, fracturing
    ice sheets and catastrophic floods. Or someone''s shared video of a runaway wildfire
    for our neighborhood chat group—we glance at our phone and see trees older than
    America consumed by flame and the skies a hundred miles away an uncanny orange
    with the smoke of their dying. And then we walk out the door into a world where
    people are still placidly their cars, commuting to work, taking vacations, having
    kids, buying stuff. What we feel in moments like this is more than disorientation.
    It''s something closer to reality shear.


    The findings accumulate, the careful lawyerly precision of interim reports and
    white papers give way to urgent and emotive language. The gentle drizzle we''re
    used to more and more often comes instead with the suddenness and violence of
    the monsoon. The bodies of refugees fleeing the devastation continue to wash up
    on the shore. One day we find the supermarket shelves empty of the things that
    have been in such abundance our whole lives. And we wonder why nobody is doing
    something about any of it.


    And so we hope. We hope, variously, that carbon offsets, cap-and-trade schemes
    and all the other market-friendly paraphernalia of soft mitigation work as we
    have been promised they will. That our elected representatives turn out to be
    wise enough in the ways of legislation to get a Green Deal with teeth enacted.
    That the unaccountable transnational elites who really call the shots will eventually
    insist on decisive, coordinated action to protect the climate, for reasons of
    raw self-interest if for no other. That a party of the poor and downtridden will
    rise in righteous glory, to end the'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'age of oligarchic plunder and impunity and set the world to rights. That there''s
    a garage somewhere, inside of which a genius tinkerer is even now perfecting the
    technology that will siphon carbon dioxide from the air and sequester it safely
    somewhere it can''t threaten us again. Maybe even that an artificial sentience
    is gestating, in the anonymous racks of some distant research center, that will
    somehow be able to seize control of the economy entire, and in that we rescue
    us from all our errors and mistakes.


    What I think we needed to get our heads around is that all of these varieties
    of hope are killing us, and everyone and everything we care about. Whatever energy
    we might invest in the conventional mechanisms of change, that are plainly failing
    to prevent the burning of fossil fuels at scale. But worse, every hour we dedicate
    to them is an hour we haven''t spent in material preparation for the conditions
    we will live with for the rest of our days on Earth. Our trust in these processes
    is getting in the way of our dedicating time and energy to the efforts that might
    actually work to cushion ourselves and our communities from coming our way.


    If we want to survive the hard times to come together, we need to stop investing
    our faith and energy in institutions that are demonstrably failing us. We need
    to admit we''ve reached a moment at which we can no longer afford to wait for
    some external process to save us, whether mechanism, movement or de ex machine.


    What we need, in other words, is to get beyond hope. We''ve got to stop waiting
    for someone else to do something and start doing for ourselves. And not simply
    in a way that reproduces all the values and structures that led us into our current
    predicament, but in a way that places concerns for care, dignity and the achievement
    of justice at the heart of everything we undertake together.


    Guided by everything I learned from watching the Occupy Sandy worked, as well
    as the experiences of parallel movements across the past six decades, this book
    is about how we might accomplish that.'
