    challenges of our moment that his lifework is worth exploring in some detail.


    Murray Bookchin was born to Russian-Jewish immigrants in the Bronx in January
    1921 and seems to have more or less immediately committed himself to an intensely
    politicized life, joining the Young Pioneers—the Communist Party USA’s organization
