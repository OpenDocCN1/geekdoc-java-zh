  md: 'But as Gilmore develops the idea, particularly organized abandonment is much
    more than simply a passive process of retreat and disinvestment. There is an active
    side to it, as well, and it is brought to bear on the bodies of those marked as
    other. Places that have been stripped of their public goods in this way are at
    the same time purposively made over into “planned concentrations or sinks ...
    of hazardous materials and destructive practices,” to which marginalized, racialized
    and criminalized populations are relegated.


    Gilmore is specifically speaking to Black experience in the United States, and
    there remain aspects of her framing that are unique to that experience. But analytically,
    it’s not hard to have resonances and parallels in the ways with which organized
    abandonment works elsewhere and for other bodies, including those in flight from
    newly uninhabitable conditions. Whatever life they knew before, those who have
    been transformed into “people on the move” by the fact of their displacement will
    find that they immediately become subject to the same array of measures that are
    applied to other despised populations. Their very existence will be defined as
    extralegal. They will be intimately policed, perpetually surveilled, consigned
    to sacrifice zones and exposed to all the hazards that live there, with consequences
    that are more than occasionally lethal.58


    So while it’s tempting to argue that most states of the global North are bound
    to contract whatever military, security, police and judicial functions are required
    to protect private property, this isn''t quite correct. To say that the state
    will go away firstly to presume that it was there anything but an actively malign
