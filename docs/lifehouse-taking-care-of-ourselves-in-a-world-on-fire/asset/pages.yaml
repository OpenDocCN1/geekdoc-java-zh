  md: 'The performance of these programs can''t really be evaluated independently
    of COINTELPRO, because there never was any “independently of COINTELPRO.” The
    survival programs, like every other initiative undertaken by the Black Panther
    Party throughout its existence, suffered tremendously from the FBI’s decades-long
    campaign of harassment, rumor-mongering, subversion, defamation and sabotage,
    which has to be regarded as the central factor conditioning their success or failure.
