    # Mutual Care


    It is one of the worst bodily sensations you will ever experience—that clammy,
    cold-sweat certainty of knowing you''re alone, at a moment in which you desperately
    need the help of others. When the support structures you expect to rely upon have
    fallen away, or were never there in the first place, you arrive with terrible
    clarity at the understanding that this is it. There''s no one you can call. Or
    there''s no one on the other end of the line to answer. Maybe the line itself
    is dead. In any of these cases, though, the result is the same: no help is forthcoming.


    The awful isolation of these moments is something you experience at the somatic
    level as much as the intellectual or emotional. Every fiber of your being rebels:
    surely, *surely* it''s not supposed to be this way—here, not in the twenty-first
    century.


    There is a way of refusing to let away that isolation stand as the unquestioned
    law of life, or to acquiesce to the privatization of the terror and grief that
    accompany it. We call refusal “mutual aid.” The activists Kelly Hayes and Mariame
    Kaba cite a definition of mutual aid offered by Seattle’s Big Door Brigade, and
    I can’t improve on it: “When people get together to meet each other’s basic survival
    needs with a shared understanding that the systems we live under are not going
    to meet our needs and we can do it together *right now*!”¹'
