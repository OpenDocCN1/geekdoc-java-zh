  md: 'The writer and climate activist Andreas Malm has taken would-be catastrophists
    to task for their failure to connect the dots in this regard. What is lacking
    in their just-so stories of societal collapse, he argues, is an account of “how
    environmental stress factors [are] translated into hardship” for a society’s “dominant
    classes.”—73 That is: How are disruptive climatic conditions—which may well be
    debilitating or even fatal for individual bodies—mediated to the dominating structures
    and institutions of society, such that their ability to continue arranging the
    world for their own benefit becomes and remains degraded? By extension, how will
    the heat somehow prove incommensurate with the continuity of all the political,
    territorial, technical and economic arrangements that together make up our familiar
    world? How, above all, is an institution as enduring and well defended as the
    state proposed to recede from our lives so thoroughly, when confronted by heavy
    weather, that we are forced to shift for ourselves?


    These are excellent questions, and I’ve tried to suggest some of the mechanisms
    that are likely to be involved in our case. A richer and perhaps more satisfying
    answer lies in a brief essay called “How Complex Systems Fail,” self-published
    in 1998 by an anesthesiologist named Richard Cook.\74


    By “complex systems,” Cook means the intricate, multilayered processes of technical
    orchestration that are everywhere in modern life, from operating theaters to air-traffic
    control centers to nuclear power plants, but the same principles can be extended
    to an economy or a society without doing them too much conceptual damage. Cook
    tells us a few things about the working of such systems: they are inherently hazardous
    and involve multiple points of risk. But they are also well defended against the
    risk of failure, furnished with abundant safety features and multiple layers of
    redundancy.


    Cook observes that, whatever safety mechanisms they may have been equipped with,
    what all such systems have in common is that they are kept'
