  md: 'It has never been easy to achieve this, anywhere or at any point in history,
    and we know that wherever someone has attempted to do so, that attempt has most
    often been resisted with force. But what was never easy becomes sharply more difficult
    still in a time of unending storms. It will often feel as if everything is conspiring
    against our ability to care, feed and protect ourselves, and maintain the lifesystems
    that sustain us against a world ruled by death.


    It increasingly seems that if there is going to be any rescue at all, it''s going
    to be that which we devise on our own, together, largely unaided by anyone or
    anything else.


    There is a certain compensation in this.


    Conversations about decarbonization policy or carbon-credit markets or stratospheric
    aerosol injection, after all, offer agency solely to a narrow technical and managerial
    elite. They center only particular kinds of knowledge, even though the policies
    being discussed stand to affect every living thing on the planet. They''re not
    detached from our experiences of the world under heat, precisely, but they take
    place at too many removes for those experiences to really weigh in considerations.
    (It''s hard to imagine anyone who might have struggled ashore from a founding
    raft, say, or charred half their body after falling to a searing sidewalk, seated
    around a table in those air-conditioned conference rooms.)


    So far as virtually every one of us is concerned, these strategies to rescue the
    world involve decisions made by other people, and we may or may not even be informed
    about them until they''re fait accompli. Bizarrely, they do not propose any role
    for you and me, other than that we carry on doing as we always have. All they
    ask of us is that we continue to consume, continue to live in isolation from one
    another, continue our complicity in the churn that gave rise to the storms to
    begin with.'
