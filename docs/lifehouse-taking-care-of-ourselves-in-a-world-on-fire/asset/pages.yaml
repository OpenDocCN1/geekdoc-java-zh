- img_proc: true
  md: 'That way, when the moment strikes, there’s no need to organize makeshift distribution
    sites like the tent in Malik Rahim’s driveway, or hope that the parish church
    has a rector sympathetic enough to offer up their space. Both the physical facilities
    and the social networks to support a robust mutual care effort are already in
    place. Indeed, care effort is at this point the merest extension or intensification
    of what people are already doing in their everyday lives.


    The value of a place extends past the material to the social, psychic and affective.
    If a Lifehouse can be somewhere to gather and purify rainwater, the nexus of a
    solar-powered neighborhood microgrid and a place to grow vegetables, it can also
    be a base for other services and methods of self-provision—a community workshop,
    a drop-in center for young people or the elderly and a place for peer-to-peer
    modes of care like the “hologram” Cassie Thornton derived from her experience
    of the Greek solidarity clinics to latch on. It can be all those things at once,
    provisioned and run by the people living in its catchment area.


    If mutual care needs a site, and so does collective power, then that site should
    draw out and strengthen the connections between these ways of being in the world.


    It is imperative in that we avoid any suggestion of planning or predefining something
    that must emerge organically from people’s own priorities and decisions. Everything
    important about this idea must be worked out in practice, in the light of local
    experiences, local struggles and local values. But in what follows, I would nevertheless
    to set out some of my own thoughts about the things a Lifehouse ought to do and
    be.


    At the outset, though, I should probably set some expectations about what Lifehouses
    cannot achieve.


    It’s clear in these early days of the Long Emergency that the scale of devastation
    involved in many climate-driven events will often be so'
