    What did that thought consist of? Bookchin wrote a lot, usually in a state of
    high dudgeon at his many perceived adversaries on the left. Both his positions
    and his labels for them evolved, while he was generally careful to note in later
    work just how they’d done so, this was not always clear to casual readers who
    encountered his writings out of sequence. This was especially so in the days before
    the internet came into widespread use, when a robust understanding of his beliefs
    could only be cobbled together by tracking down the evidence as it appeared across
    a scatter of indifferently distributed books. With the benefit of latter-day collected
    editions, though, and of internet resources used the Anarchist Library and Dana
    Ward’s invaluable Anarchy Archives, it’s possible to sketch the evolution of a
    series of interlocking concepts Bookchin called “Communalism” and “libertarian
    municipalism,” as well as the broader project in which they were embedded, “social
    ecology.”6


    Social ecology was a startling novel formulation, founded on two major insights.
    The first was Bookchin’s recognition, even before Rachel Carson’s 1961 Silent
    Spring had given the contemporary environmental movement its initial impetus,
    that the Earthly biosphere was in the throes of a profound crisis as a result
    of human action and headed for worse. He even predicted the specific form the
    crisis would take, warning as early as 1964—more than a decade, in other words,
    before the 1977 White House memo generally regarded as the first appearance in
    public thought of what was then called “the greenhouse effect”—that atmospheric
    heating driven by accumulations of carbon dioxide “may well rank among the most
    serious sources of future ecological imbalance and may pose major threats to the
    viability of the planet,” “undermining the very capacity of the Earth to sustain
    advanced forms of life.”7'
