- img_proc: true
  md: 'What Gilmore helps us understand is the curious mixture of passive and active
    in the state’s posture toward those pushed to the margins, and the ways in which
    it so often simultaneously undermines and overmines their struggle to lead a decent
    existence. Many, perhaps most of us, live in communities where capacity for care
    has in some way been eroded by the withdrawal of public investment. Some of us,
    though, live in communities where capacity has consciously and intentionally been
    shredded.


    Here we''re finally in a position to understand the true depths of the trouble
    we are in. The crisis of our moment consists not of a breakdown of the global
    climate system, and all the storms and floods and fires plagues it gives rise
    to, as terrifying those things might be. It doesn’t even consist of the irreversible
    proliferation of such events, or their cascading downstream consequences. It consists
    in the fact that all of lands not on healthy, robust societies, but on ones capacities
    for care have been thoroughly and intentionally eroded.


