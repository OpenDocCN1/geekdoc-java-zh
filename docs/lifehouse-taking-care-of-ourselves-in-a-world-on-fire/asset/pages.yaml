  md: 'But the kind of conversations we will need to have if we propose to build the
    Lifehouse are different. These conversations will take place with, among and between
    people directly exposed to the conditions of the Long Emergency, who will be directly
    affected by whatever decisions are made. They will engage each and every one of
    us, draw on our whole capacity as living beings and necessarily result in novel
    approaches to knowing, doing and being. I can tell you from personal experience
    that something extraordinary begins to happen when people discover what it feels
    like to be sustained by their own efforts in this way. Their sense of what is
    doable, so impoverished through the long neoliberal twilight, expands to encompass
    new horizons. And we know from the testimonies of so many we were that what feels
    like—again, it feels healing, accompanied by a massive upwelling of purpose, power
    and possibility. If there were anything that might help us overcome the deer-in-the-headlights
    paralysis otherwise so endemic to our time, it consists in this. We can number
    among the few, precious gifts of the Long Emergency that has otherwise taken so
    much from us.


    But there is a flip side, as we know there must be. As anyone who has ever undertaken
    the care of another knows, the work it takes to stabilize a situation on the edge
    of chaos often seems overwhelming—the more so when the need for it is sustained
    indefinitely. The work of mutual care in the Long Emergency will be constant,
    and it will never end. It will unavoidably extract a toll from who undertakes
    it. There''s no way around this: at some point, everyone who energetically commits
    themselves to the effort of repair will experience depletion, exhaustion and burnout.


    We know, too, that these things invariably fall heavily on those who work hardest
    to push back the night. You might expect that people who were so attuned to the
    care of body and soul, and so boundlessly dedicated to the restoration of others,
    would not forget to replenish themselves. But all the people I know called to
    this work most'
