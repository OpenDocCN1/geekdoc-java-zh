    The Long Emergency is my name for the period we''ve entered together, set off
    by climatic instability, but ultimately far larger than that alone. It consists
    of an extended excursion from everything we recognize as normal, of as yet unknown
    duration and resolution, during which many of the systems and structures that
    currently shape our lives will be flung to pieces by the force of events. For
