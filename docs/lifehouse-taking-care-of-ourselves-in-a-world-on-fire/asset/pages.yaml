  md: 'burden of caring for the others in their household will ever be likely to reach
    their full intellectual potential.


    Though never developed anywhere as extensively as they were in Oakland, for a
    time the party attempted to roll out the survival programs across Panther chapters
    nationwide. After chartering them in 1968, the party’s central committee ordered
    the regional chapters to commit themselves to the policy, "including, minimally,
    a Free Breakfast for Children"; in April 1970, each chapter was additionally required
    to launch a People’s Free Medical Clinic of its own.82 Some went further still:
    the Winston-Salem branch operated a highly successful ambulance service, while
    the Dallas chapter offered "pest control programs, citizen police patrols, a liberation
    school, and a tenant information center."83


    Whatever the hopes and energies invested in these local initiatives, however,
    were not destined to be sustained for very long. In 1971, Panther leadership made
    the decision to consolidate around their base. The Panther chapters in major cities
    like Boston, Detroit, Houston, Philadelphia and Seattle were shut down, alongside
    all of the smaller ones.84 The most dedicated volunteers at each branch were relocated
    to headquarters in Oakland. The party’s days as a national organizing force were
    over.


    With the shuttering of the Oakland Community Learning Center in 1982, one of the
    most extensive experiments with care-driven organizing ever came to its formal
    conclusion. The Black Panther survival programs were administered fruitfully,
    over a brief existence. They covered a mere handful of cities and directly involved,
    at most, hundreds of thousands of people in a nation of 200 million. And even
    so long, the Panthers had to draw on much of the Black revolutionary population
    of North America to do it. But for all that, they were audacious in their conception
    that we are still reading, thinking and talking about them half a century later.'
