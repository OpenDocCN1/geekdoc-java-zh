    of state ever developed consecrated to their management. But when some catastrophic
    event takes place, some or all of the infrastructures we count upon. That’s what
    catastrophe is: the power goes down, and with it the lights and the refrigeration
    (and the air-conditioning, if you’re lucky enough to have any). The water from
    the taps smells wrong and you don’t feel safe to drink. The groceries you were
    counting on to make your meals, with the formula for the baby, the medicine you
    need for your diabetes—one of that ever made it out of the warehouse, it sits
    rotting on the pallet-load on a rainswept loading dock, miles out of reach.


    This is the central set of issues that mutual efforts take upon themselves to
    address, at once the most acute threats to life have been dealt with. Whether
    Common Ground, Occupy Sandy, the Centros de Apoyo Mutuo set up in Puerto Rico
    after Hurricane María or the nameless groups without number that popped up all
    over during the pandemic, these groups all constituted a parallel, ad hoc delivery
    infrastructure, conceived of, managed and experienced in very different ways than
    those which undergrid our lives “on any ordinary day.”39


    But as ingenious as these efforts may have been, as products of the event, they
    were never designed to be sustained. We can talk about “aid” when need is acute,
    but when need becomes intractable the long haul, we have to think in terms of
    something else. If self-organized processes were effective in distributing aid
    under these circumstances, in the aftermath of crisis events, might we also productively
    use these same techniques to reorganize broader swaths of our lives? And especially,
    might they help us fend for ourselves, collectively, over the longer term, in'
  merge: -1
  pgno: 87
- img_proc: true
  md: 'situations where the state is indifferent, hostile or simply absent? The concept
    we need to mobilize, if we want to bridge these situations, is care.


    In English, “care” is one of those words that folds in a great many shades of
    overlapping meaning. It is, among other things, the mobilization of attention—the
    dedication of some portion of our cognitive resources to noticing another. But
    more than that, what we care about matters to us. We become personally invested
    in its fate and thereafter commit our own energy and effort to ensuring its continuance,
    as best we can. I think of care, then, as acts of nurturance, maintenance and
    repair, undertaken in the presence of an active commitment.⁴0


    These acts of care are required continuously. Whenever and wherever we have endured
    some recognizable “we,” it was because some among us—the overwhelming majority
    of whom were whose names are lost to history—did the draining, thanks, utterly
    necessary work of making we would still be there the next day. This work is feminized
    and therefore implicitly devalued. It’s all but never celebrated in any of the
    stories we tell ourselves, and only very rarely compensated in any proportion
    to its actual importance to our lives. But carework is the labor that knits the
    world together.


    To say that carework has been systematically undervalued, even in the progressive
    tradition, is not merely an understatement but even something of a category error.
    If you accept the Marxist distinction between “productive” and “unproductive”
    labor, care is by definition literally unproductive activity. Similarly, where
    Hannah Arendt opposes the “work” that produces durable objects of use to the “labor”
    that gives rise to intangibles or consumables, care falls decisively in the latter
    category.⁴¹ Anyone who has spent much of their day washing or cooking or cleaning—and
    does all of it in full awareness that it will have to be done all over again the
    next day, and the one after that, in unending series—might be inclined to agree.'
  merge: -1
