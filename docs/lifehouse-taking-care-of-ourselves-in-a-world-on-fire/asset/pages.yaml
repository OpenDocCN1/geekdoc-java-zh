- img_proc: true
  md: 'There were glimpses of something far more radical in the War on Poverty, as
    well. In their original conception, the Community Action Programs were the closest
    any official policy of state ever came to involving the American people in their
    own self-determination—by comparison with anything devised in the years since,
    especially, they can seem like something drawn up in Cuba, or Chavena Venezuela.48
    The authors of the Economic Opportunity Act of 1964 famously envisioned these
    local initiatives to be “developed, conducted, and administered with the maximum
    feasible participation of residents of the areas and members of the groups served.”49


    Perhaps inevitably, this was a commitment destined to be honored more in the breach
    than in any observance.50 Practically in the same breath that he affirmed “the
    necessity of including the poor in all our activities,” Office of Economic Opportunity
    director Sargent Shriver clarified what this really meant: “We have no intention,
    of course, letting any one group, even the poor themselves, ‘run the jobs’ or
    ‘run the programs.”—51


    And just as bad as the seeding paternalism was the sense that the scheme as a
    whole amounted to a titanic misdirection. As a contemporary observer, the activist
    urban planner Robert Goodman, described it, “maximum feasible participation” amounted
    to little than “allowing the poor to administer their own state of dependency”;
    they “could direct their own welfare programs, have their lawyers, their own owners
    and architects, so long as the economic structure remained intact—so long as the
    basic distribution of wealth, and hence real power, remained constant.”52 This
    left most Americans who were both poor and Black or less right where they started:
    unseen, underserved, under-resourced and perpetually at risk.


    The gulf between the War on Poverty’s promise and its reality was something keenly
    felt by two young Oakland residents named Bobby Seale'
  merge: -1
  pgno: 92
- img_proc: true
  md: 'and Huey P. Newton, who developed their critique at close range, during their
    work at a Community Action Program called the North Oakland Neighborhood Anti-Poverty
    Center in the summer of 1966. Over the course of their involvement with the Center,
    Seale and Newton had seen how government action consistently failed the very people
    it was supposed to uphold, how state agencies used the pretext of “community outreach”
    to intensify their surveillance of Black lives.


    Now they laid the contours of something very different. Setting out from a blank
    sheet of paper, Newton distilled the principles of Black self-determination and
    Seale had absorbed from their readings of Malcolm X and Frantz Fanon into a concise
    list of positions and demands. This was the Ten-Point Platform and Program, the
    founding charter of the Black Panther Party for Self-Defense.


    Newton designed the party’s platform to appeal to Black Americans by restating
    the raw facts of their situation “in some basic instructive thing that [ordinary
    people] can understand, instead of a bunch of esoteric bullshit.”53 The Ten-Point
    Program was, accordingly, divided into two sections called “What We Want” and
    “What We Believe,” with a point-for-point correlation between each specific policy
    demanded in the former and one of the articles of belief outlined in the latter.


    There was an insurmountable contradiction in the program from the jump, that it
    simultaneously demanded that the United States government furnish Black people
    with decent housing, healthcare and employment (points 2, 4 and 6) and called
    for the overthrow of that same government (point 10). But it nevertheless gave
    voice to a conclusion that was becoming increasingly hard to avoid: if no real
    relief from their troubles was forthcoming, despite all the Head Starts and VISTAs
    a wealthy society could dream up, Black people would just have to set about organizing
    relief for themselves.'
