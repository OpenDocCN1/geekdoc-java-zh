  md: 'That requires some careful thinking about what does not work. It seems to me,
    first of all, that the assembly has been stuck with Bookchin’s “moral functions”
    for quite some time, and that this is a major part of why so many us tend to find
    it unappealing. The various national citizens’ assemblies that have been convened
    to debate climate policy furnish an excellent, pungent, example of the moral-functions
    trap.47 These mobilize the most extraordinary draughts of goodwill and sincerity,
    which have yet to inspire any legislative or regulatory action to speak of, anywhere.
    This leaves participants, for all their exertion, with no more traction on events
    than if they had done nothing at all.


    There is, therefore, a profound mismatch between the intense intellectual and
    emotional effort required by this showing up in the world and the payoff it generally
    yields. I can’t imagine that many of us, exposed to the intense time and energy
    pressures of late-capitalist life as we are, cheerfully devote our evenings to
    hammering out consensus on positions that are destined to remain symbolic, “consultative”
    or “advisory.” And it further seems natural that anyone who did, nevertheless,
    invest their precious life energy in such a process would sour on it—permanently
    and rightfully—whatever consensus they’d so carefully crafted in this way came
    to be disregarded in its entirety by those with actual power.


    There is a way out of this trap, though. The obvious way to resolve this mismatch,
    and rescue the assembly from its own irrelevance, is for it to have power over
    how it disposes of its own organic resources, so that there is a direct connection
    between the decisions we make and what we can see happening in the world around
    us. This is the fundamental condition for our effective use of the assembly. It
    cannot be symbolic, or therapeutic, or merely a way of taking the community’s
    temperature on a given question. It actually has to have meaningful authority
    over allocations of resource.'
