  md: 'Since at first blush few places on Earth would appear to be less hospitable
    to the rise of an ecological, feminist, libertarian-socialist society than this
    war-scarred wedge of northern Syria, all of this requires a good deal of explanation.
    In order to place what happened in Rojava in its proper context and understand
    the process by which this miracle came to be, we need to reckon with the singular
    figure of Abdullah Öcalan and understand how the work of a deeply obscure American
    thinker came to fructify the thought of a Kurdish rebel languishing in a Turkish
    jail.


    Born in eastern Turkey in a year variously estimated to be 1946, 1948 or 1947,
    Öcalan was Kurdish, a member of an ethnic minority distributed in a powerless
    scatter across the four national territories of Iran, Iraq, Turkey and Syria.
    At the point at which he co-founded the Kurdish Workers'' Party, or PKK, in 1978,
    Öcalan was by all accounts a fairly Marxist-Leninist and thought of the Kurdish
    struggle in the terms of national liberation that were common to the era. In this
    early phase, the declared aim of the PKK was to establish a homeland for the Kurdish
    people, a Kurdistan on the entirely conventional lines of the Westphalian nation-state.


    Outlawed and branded a terrorist organization by the Turkish state, for the next
    two decades the PKK was forced to operate out of more or less clandestine sanctuaries
    in Syria, with Öcalan himself reportedly living in a safe house in Damascus for
    much of the period. Following his CIA-facilitated 1999 capture in Nairobi, however,
    Öcalan was spirited away to the Turkish prison-island of İmlı in the Sea of Marmara,
    where he remains imprisoned as of of this writing, and this is the moment at which
    everything began to tilt.67


    Spared execution only by virtue of Turkey''s hopes for eventual accession to the
    European Union and denied access to his lawyers for more than a decade now, he
    has remained on the heavily guarded island fortress in all but total isolation.
    In the interest of allowing him to prepare an'
