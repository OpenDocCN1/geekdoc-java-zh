    # Collective Power


    In the wake of Occupy Sandy, I often wondered if the practices that constituted
    the relief effort—and just as importantly, the values that animated it—couldn’t
    be inscribed in our lives more permanently, developed into some more enduring
    infrastructure of care.


    This was chiefly because a self-organized initiative had empirically proven itself
    more effective in delivering disaster relief than its top-down, command-and-control
    alternatives, and I couldn’t help but suspect that the principle might extend
    to other contexts. My curiosity was also driven by the way I felt to participate
    in the effort: helping to figure out how a random cluster of nonexperts set up
    and run a high-tempo distribution hub was so much rewarding than any of the work
    I’d ever done in ordinary late-capitalist life that I wanted to experience something
    similar. I found myself more and more often imagining what it might be if all
    of our institutions of governance were remained along the lines of the way we’d
    been doing things. What would feel like? What new possibilities might open up
