  md: 'ranging set of community-based efforts the Panthers devised from the middle
    of 1969 on, designed to forestall “vulnerability to premature death” in all its
    many forms. These were the famous “survival programs”: a dizzying array of twenty
    or more distinct initiatives offered to the Black and poor communities of the
    Bay Area free of charge, and at in part, eventually rolled across BPP branches
    nationwide.


    The turn toward the survival programs originated from a sharp internal dispute
    between the revolutionary strategies advocated by different factions among the
    Panther leadership. One side was Minister of Information Eldridge Cleaver, famously
    a fiery proponent of the armed struggle. This was undoubtedly in sync with the
    temper of the times, with hard-left factions worldwide—the Weather Underground,
    the nascent Baader-Meinhof, Italy’s Red Brigades, the Irish Republican Army and
    the Japanese Red Army—committing themselves to insurrectionary violence. But Newton
    took the opposite position: against the overwhelming reality of US power, he considered
    any embrace of the armed struggle a recipe for revolutionary suicide.


    There was a very great deal of justice to Newton’s perspective. The Panthers operated
    under the heaviest sort of government surveillance and repression throughout their
    entire existence, at first including local police departments in the Bay Area,
    but as their notoriety grew, swiftly expanding to include the entire federal law-enforcement
    apparatus. Their early successes made them a central concern of the nationwide,
    covert and thoroughly illegal effort the Federal Bureau of Investigation embarked
    upon in August 1967, at the personal instruction of Director J. Edgar Hoover:
    the “Black Nationalist Groups” strand of the Bureau’s longstanding domestic Counter-intelligence
    Program, better known as COINTELPRO.⁶²


    This was intended “to disrupt, discredit and destroy” not merely upwellings of
    emergent Black consciousness in America but Black activists themselves, reputationally
    and bodily.⁶³ It was brutally effective.'
