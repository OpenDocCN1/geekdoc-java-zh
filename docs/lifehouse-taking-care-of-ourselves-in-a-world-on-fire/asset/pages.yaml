    Society, or SDS, which enshrined its authors’ belief that “people should have
    a central role in determining those decisions that affect their daily lives.”16
    But beyond some thought that “decision-making of basic social consequence be carried
    on by public groupings, and that these groupings have “the function of bringing
    people out of isolation and into community, the statement’s authors offered no
    particular guidance as to how this might be achieved.


    It is fair to say that a certain wooliness on the details is a broader failing
