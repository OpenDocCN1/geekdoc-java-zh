  md: 'urgently also seem to be those who tend to beat themselves up because they
    can never do enough. And it''s true. There will always be someone who needs them
    and always someone they cannot reach.


    What I want to say to them is this: it''s not anyone''s job to reach every last
    one of the billions of human beings imperiled by our time of Emergency, nor are
    you betraying them by remembering to take care of yourself. There are relatively
    few things I have ever taken to heart from the Jewish tradition which is my birthright.
    Among them, though, are a few lines attributed to a rabbi named Tarfon who lived
    around the end of the first century of the current era, later bound into the compilation
    of oral wisdom known as the Pirkei Avot: “It is not incumbent upon you to complete
    the work [of repairing the world], but neither are you at liberty to desist from
    it.”I have always found Tarfon''s change electrifying, possibly because it is
    both bracing and comforting, and I continue to turn for it strength in difficult
    moments.


    In context, I interpret Tarfon to mean that we keep organizing, even if what we''re
    doing often feels little more than shifting drifts and piles of washed-up flotsam
    around the terminal beach. We keep the work, come what may. We make such shelter
    as we can, for as many as we can, for as long as we can, and when we are asked,
    we do what we can to help others make shelter themselves. This work is what we
    have, it is all we have and it is all anyone can ask of us. As difficult as all
    of this might be to accept, internalizing affords us one final gift, which is
