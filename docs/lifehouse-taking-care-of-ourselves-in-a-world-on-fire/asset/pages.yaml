  md: 'The earliest Panther activities were dedicated to patrolling police. Taking
    advantage of what were then generous provisions in the California state legal
    code for the open carrying of firearms, armed Panthers shadowed the Oakland PD
    on their sorties through the ghetto, observing their interactions with residents
    at close hand and ensuring that any arrests they made remained strictly within
    the letter of the law.^54


    This phase of activity culminated in a May 1967 protest on the steps of the California
    state capitol building in Sacramento, during which Seale read a statement decrying
    the proposed Mulford Act, “legislation aimed at keeping the Black people disarmed
    and powerless at the very time that racist police agencies throughout the country
    are intensifying the terror, brutality, murder and repression of Black people.^55
    (In a front page story, the Sacramento Bee duly reported this scrupulously legal
    demonstration as the “invasion” of the capital by an “armed Negro band.^56)


    Despite Seale’s efforts, the California Legislature swiftly passed the Mulford
    Act ironically, on an “urgency” provision driven by the protest itself—and it
    was signed into law by Governor Ronald Reagan two days later, putting a permanent
    end to the Panthers’ armed patrols in California.


    By now, however, the Panthers’ inability to prevent the passage of the Mulford
    Act almost seemed beside the point. The audacity of their tactics, and the media
    attention they garnered, electrified Black radicals across America. Wildcat groups
    calling themselves “Black Panthers” began to spring up all over the country, just
    about anywhere there was a significant Black population. Unwilling to countenance
    the reputational hazard this presented—or perhaps more to the point, the dilution
    of their authority—in spring 1968 the party leadership began officially charting
    these chapters. Local groups were required to swear allegiance to the central
    committee in Oakland, formally adhere to the Ten-Point Program and send anyone
    who'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'wished to become a branch officer to headquarters for a six-week course of
    political education.


    The list of official chapters eventually grew to thirteen, with affiliated organizations
    operating in least sixty-one cities in twenty-six states and the District of Columbia,
    vastly multiplying the party’s reach, influence and ability to inspire⁵⁷


    But the Panthers’ increasingly high profile also shed the most unwelcome kind
    of attention on Huey Newton personally. In the early hours of October 28, 1967,
    while looking for a parking space on Seventh Street in West Oakland, Newton was
    ordered to the curb by OPD officer John Frey. Realizing immediately that the driver
    had pulled over was none other than “the great, great Huey P. Newton,” Frey ordered
    Newton out of the car and proceeded to frisk him in a manner that Newton found
    “degrading,,” “disgusting” and humiliating.⁵⁸


    The details of the alteration that followed remained murky still, despite multiple
    trials, what had never been in doubt that shots were fired, wounding both Frey
    and Newton as a second OPD officer at the scene; Frey, four times, died of his
    injuries.⁵⁹ In September of the next year, Newton was convicted of voluntary manslaughter
    for the killing of Frey and was sentenced to two to fifteen years in the California
    Men’s Colony at San Luis Obispo. He remained imprisoned until the overturning
    of his conviction in May 1970, removing him from direct influence over the party’s
    activities, but furnishing it with a “living martyr”—and, in “Free Huey,” giving
    the new left of the period one of its most potent rallying cries.⁶⁰


    Contesting the police violence Black people were exposed to a daily basis may
    have put the Panthers on the map, but was far from the only aspect of their challenge
    to white supremacy, and arguably not the most effective or consequential.¹¹ That
    accolade belongs instead to a wide-'
