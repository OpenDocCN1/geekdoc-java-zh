  md: 'But this seems to neglect the fundamental lesson of defeat at the ballot box:
    power that is developed through electoral means can evaporate that way, too. Everything
    you built can be wiped away in a heartbeat, the moment a sufficiently motivated
    opponent is sworn into office.


    Happily, though, remains another approach to building popular power, one that
    is less vulnerable to the shifting opinions of the electorate. This is not to
    say that it is in any way undemocratic: if anything, its interpretation of democracy
    asks a great deal more of the people than simply showing up to vote every few
    years. It is less conventional, more interesting and harder to achieve electoral
    victory, but ultimately, I think, has much more to teach us about the future.
    It started from the widespread conviction to think in terms of the state was already
    a mistake, in a place called Rojova.


    There has been a profusion of names for what happened in the breakaway cantons
