  md: '# Conclusion


    At the end of the world, plant a tree.


    > —Musnad Ahmad, hadith 12491, as reported by Anas Ibn Mali


    In the last, peri-apocalyptic chapter of David Mitchell''s 2014 novel The Bone
    Clocks, the provisional government entity responsible for the apportionment of
    misery in an Ireland at the end of its tether is called, simply, Stability.¹ Its
    armed convoys bring the monthly ration of food, and its sulullen teenage conscripts
    help themselves to the local produce, and the local women, as compensation for
    the salary that no longer comes. Stability is resented. It is clumsy, unjust and
    heavy-handed. It achieves its barely ceded legitimacy through force of arms. But
    it manages to keep the peace and the calories flowing, however minimally in either
    case, and for that the towns people of Kilcrannog accede to its oafish rule with
    something approaching gratitude.


    There''s a can understanding in Mitchell''s act of imaginative framing: the name
    he gives this occupying force captures what desperate people are desperate when
    beset by insurmountable crises on all sides—and equally, implies all the many
    precious things they are willing to trade away cheaply, if only granted that one
    thing they can be certain of. It almost doesn’t matter what factor of politics
    nominally guides Stability in its attempts to assert control over a reality become
    ungovernable, and Mitchell doesn’t bother to specify. In the state in extremis
    it administers, everyone but those lucky few closest to the center (or able to
    grow for themselves)'
