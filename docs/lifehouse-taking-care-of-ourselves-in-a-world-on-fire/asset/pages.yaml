    So let us organize our own syndicates of initiative and together build the Lifehouse.
    Let’s start with what is closest at hand, build outward from there and link our
    efforts with those of the others who have set themselves the same task. Let’s
    go, finally, greatly of all vain hope for the future and use that energy instead
    to undertake the work—the necessary work—of care, of repair, or survival.


    There is just one final thing to say about the Lifehouse and whatever promise
    it may hold, which is that the powerful generally cannot tolerate and will not
    simply let people pursue the humblest projects of autonomy and self-determination.


    Across the centuries, popular attempts at self-reliance and self-definition have
    been assailed wherever and whenever they have appeared, by state and nonstate
    actors both. But everything history teaches us about the fate of such initiatives
    since the days of the Paris Commune suggests that the state constitutes by far
    the greater threat to their existence.56 What brought the Commune to its abrupt
    end, after a mere seventy-two days, was the same thing that has so far doomed
    the ventures in self-governance that followed: exogenous state. From Vienna’s
    Karl-Marx-Hof in 1934 to Barcelona in 1939 to Rojava in 2019, in fact, just any
