  md: 'Where classical anarchism had always been defined by its revulsion for coercion
    and hierarchy, Bookchin now tied relations founded in these qualities directly
    to the question of our persistence as a species. If we wanted to survive, he argued,
    and to preserve the kind of healthy planetary ecosystem in which we might all
    thrive equally, we would have to undertake the work of reorganizing society and
    all its institutions so as to eliminate the possibility of domination—either of
    nature by humanity, or of any human being by another. This is a strikingly bold,
    integrative conception of power, especially given that it was first articulated
    in an era when the the left was still largely given over to the machismo of national
    liberation, and it speaks directly to the ecological and intersectional concerns
    of our ours moment like no other thought of the period.


    To facilitate meaningful change, though this theory of social ecology needs a
    corresponding form of concrete expression. Bookchin named this Communal, with
    a capital C, in explicit allusion and homage to the Paris Commune of 1871. Communal
    was designed around a set of “preconditions for human survival,” among which were
    “the anarchist concepts of a balanced community, a face-to-face democracy, a humanistic
    technology and a decentralized society.” Taken together, these would constitute
    nothing than a “new politics’ structured around towns, neighborhoods, cities,
    and citizens’ assemblies, freely Confederated into local, regional, and ultimately
    continental networks.”10


    As expressed here, Bookchin''s faith in the wisdom of ordinary people is profound.
    He evidently could not countenance the idea that when given the power to decide
    freely, anyone rational would opt for anything but cleanly powered, human-scaled,
    locally managed production that could be sustained over the long term. His clear
    supposition is that people empowered to make consequential policy decisions for
    themselves would (“naturally”) choose to forgo the neocolonial megaprojects, the
    sweetheart deals and lobbyists, the expeditionary wars—in fact the whole grim'
