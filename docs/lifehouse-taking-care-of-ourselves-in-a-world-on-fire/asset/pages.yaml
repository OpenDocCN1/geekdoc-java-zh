  md: 'goes to bed hungry, and that hunger speaks louder than any prior belief or
    commitment.


    Stability offers some ground to stand on. It constitutes some assurance, however
    illusory, that tomorrow will be much like today in the ways that matter, or enough
    to make plans, anyway. If it sacrifices a few complainers and malcontents to keep
    the broader peace, well: you know what they say about eggs and omelets—and better
    still if the breaking of eggs happens somewhere safely out of sight. We should
    never underestimate the appeal of a promise like this when everything''s gone
    maximally sideways.


    Stability will be the fundamental value proposition of a certain kind of politics
    in our time of undoing, and we need to reckon with just how seductive it will
    prove to be for too many of our neighbors in the global North. For them, the overriding
    instinct will be to press on, to avoid confronting any of the increasingly blatant
    asymmetries of access to care that characterize our world, so long as someone
    promises to preserve the rudiments of a comfortably familiar way of life. And
    they may even succeed at securing some measure of continuity for themselves—but
    only by shedding increased turbulence and suffering unto others, as if to say:
    there''s only room enough for us on this lifeboat.


    Such massive failures of empathy and simple human decency are, course, repulsive.
    But there is nothing inherently wrong with stability itself. All living things
    require some degree of consistency in their environment if they are to endure
    their first moments of existence. If the word taken on a tinge of conservatism,
    that is only because what the powerful so often wish to stabilize is a situation
    of injustice. The far deeper challenge is how to protect and extend those situations
    in which people manage to cast a penumbra of care and comfort not merely over
