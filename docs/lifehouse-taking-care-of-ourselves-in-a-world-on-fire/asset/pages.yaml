    in the years of wartime rationing. In the worst weeks of lockdown, we found ourselves
    bartering for bread flour and toilet paper, or buying them by the pallet-load
    because industrial quantities were the only ones left available, and then sharing
    out the excess among friends and neighbors.


    The globe grew bigger again, as the contrails crossed cross-hatching the sky.
    Our lifeworlds contracted to the ambit of a square mile or so, and for a little
    while, our relationships with the other people in that square mile became the
    central fact of existence.


    All through this time, millions sheltering under lockdown relied on neighborhood
    mutual aid groups for their groceries—in fact, for deliveries of everything necessary
    to maintain and reproduce our capacity to function as human beings, whether that
    meant baby formula or methadone, dropped off by masked and gloved volunteers who
    rang the doorbell and then retreated to a wary distance. We learned to depend
    more on one another, for everything from check-in calls to vulnerable neighbors
    to household repairs, and less on systems of state or market.


    For the overwhelming majority, this turn to one another was not made out of prior
