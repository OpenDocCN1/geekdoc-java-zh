  md: 'within safe operating margins via the continuous adjustments of human operators.
    This seems commonsensical enough. But what he argues next is somewhat startling:
    these adjustments are invariably in the nature of a “gamble.” Whatever decision
    is at hand, it will always be a bet made about the future in the presence of imperfect
    information.


    Most of the time—in fact, virtually all of the time, by definition—the gamble
    pays off. The system reacts in the way its operators expect it: the nuclear reactor
    continues to run smoothly, the satellite reaches a stable orbit, the tumor is
    excised and the patient successfully revived. Paradoxically, though, trouble arises
    when operators have insufficient experience of failure. Lulled by their unbroken
    record of success in keeping it going, they can’t sense when the system they’ve
    been entrusted with is close to the edge of its performance envelope, and miss
    or don’t recognize the signs that it is closing in failure. They make a gamble
    that the system will continue to operate normally, as all their previous experience
    has counselled them to expect that it will, and they allocate their resources
    accordingly. And then come arcing in from some unforeseen quarter: the gamble
    is lost, and everything comes undone at once.


    In his essay, Cook says one other interesting thing about complex systems, which
    is that it is quite possible for them to “run in degraded mode” for extended periods.
    That is, they are so well defended by their layers of backups that they can accumulate
    damage for many years before hitting the point of absolute breakdown. They simply
    go on working, without either their operators or anyone else realizing the extent
    to which everything under the hood has corroded away to nothing.


    The most obvious example of this in societal terms is the Soviet Union, which
