  md: 'COINTELPRO’s direct effects extended to the outright murders of Panthers Fred
    Hampton and Mark Clark by Chicago police in December 1969, but almost as destructive
    as the bureau’s relentless whisper campaign of poison-pen letters and ginned-up
    kompromat, the internal fissures and suspicions gave rise to.^64 Knowing what
    we now do about COINTELPRO, and the lengths Hoover was willing to go to in order
    to destroy even the mildest advocacy for Black self-determination, there can be
    little doubt that any party committing itself to the strategy advocated by Cleaver
    would in one way or another have been extinguished to its last member.


    Newton was no less a revolutionary than Cleaver, but he did recognize something
    that Cleaver evidently could not: that, in the Marxist-Leninist terms the party
    leadership was always fond of using, the historical conditions of Black America
    at the end of the 1960s were not yet ripe for the seizure of power from the oppressor.
    “[A]s revolutionaries must recognize the difference between what the people can
    do and what they will do,” he explained. “They can do anything they desire to
    do, but they will only take those actions which are consistent with their level
    of consciousness and their understanding of the situation.^65


    And what prevented poor Black Americans from developing a revolutionary perspective,
    in Newton’s analysis, was the objection and violence of the conditions they contended
    with in daily life. Anyone interested in seeing them claim their due role as the
    subjects of history would therefore have to sustain them in body and mind, until
    they had achieved a level of consciousness at which revolution would appear organically
    and of its own accord. This was the genesis of Free Breakfast for Children, the
    People’s Free Food Program and all the many other ways in which the Panthers proposed
    to care for the people. “All these programs satisfy the deep needs of the community
    but they are not solutions to our'
  merge: -1
