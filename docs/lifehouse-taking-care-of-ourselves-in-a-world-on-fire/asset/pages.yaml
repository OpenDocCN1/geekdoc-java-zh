- img_proc: true
  md: 'But none of the work that either Arendt or Marx reckons as productive becomes
    possible without the daily replenishment and restoration of the labor body.42
    And Silvia Federici has it, “day-to-day activities by means of which we produce
    our existence are simultaneously sites at which “we can develop our capacity to
    cooperate and not only resist our dehumanization but learn to reconstruct the
    world.”—43


    Here Federici seems to be getting at the very quality that 520 Clinton site coordinator
    Samantha Corbin had seen in Occupy Sandy’s ability to “actively undermine those
    structures that separate us.” If care is, or can be, a way of remaking the world,
    though it is prevented from doing so when the people undertaking it are individualized,
    shattered, severed from one another and alone. Its politically transformational
    qualities only begin to appear when care is conscious thought of as a matter of
    collective self-provision, outside the obligations of the family, impersonal structures
    of state and market or the vertical relations implied by charity. This is the
    sense in which we now grow case.


    It is no longer merely the means of individual survival. It is the means by which
    we sustain ourselves, as communities of people working together toward our common
    liberation. As a tactic for those intent on resisting oppression in the near term,
    Hayes and Kaba this “care-driven organizing.”—44 As a way of tending to our needs
    over the longer term, especially when other modes of provision have fallen away,
    as I see it, a practice of mutual care. And points toward the habits of collective
    self-provision we will need to learn (or relearn) if we propose to survive the
    rigors of the Long Emergency together.


    The point of framing things in this way is to address two qualities of existing
    mutual aid efforts only begin to gesture at: the multiple dimensions of bodily
    and psychic need, and the extension of those needs over time. Taken together,
    these demands suggest that mutual care will work best when organized as an integrated
    solidarity network of interlocking efforts—'
  merge: -1
  pgno: 89
- img_proc: true
  md: 'each one targeted toward discrete facet of care-work, like nutrition, education
    or medicine, each supporting all the others. This is the sort of structure we''ll
    need to call upon when the emergency in our lives becomes permanent and the institutions
    and services we ordinarily rely upon to sustain us fall away.


    Who better to learn from, then than a group of people for whom life was always
    an emergency, who responded to their conditions by organizing just such a network
    of collective self-provision? The first steps on the toward mutual care were taken
    by the Black Panther Party for Self-Defense (BPP) in the Bay Area of the late
    1960s.


    Such ideas have never been more fully developed than were in the panoply of “survival
    programs” organized by the Black Panthers between their launch of the Breakfast
    for Children program in early 1969 and the shuttering of the last such initiative,
    the Oakland Community Learning Center, in 1982.⁴⁵


    What the Panthers organized to defend themselves against, was in a word, racism,
    though the word scarcely adequate until we consult Ruth Wilson Gilmore’s definition:
    “the state-sanctioned or extregal production and exploitation of group-differentiated
    vulnerability to premature death⁶ Some of the ways in which this vulnerability
    appears independent of class or income, notably a risk of harassment and assault
    at the hands of the police so acute that Black parents have always had to have
    “the talk” with their children as soon as they were of an age to leave the house
    on their own. But all of its manifestations invariably fallen most heavily on
    those who are both Black and poor, and this was so even in the Bay Area of the
    1960s, in the midst of a society then approaching the historical peak of its power
    and influence.


    For poor Black people in the Oakland of 1966, “vulnerability to premature death”
    took a fearsome number of forms; the foreclosure of'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'educational, training and employment opportunities. The institutional denial
    of credit. Woefully substandard housing. In the medical professions, a general
    indifference to conditions that disproportionately or predominantly afflicted
    those of African descent, like hypertension or sickle-lele anemia, a painful and
    potentially fatal blood disorder. Malnutrition or outright hunger. And, of course,
    the likelihood of beatdowns, jailing or worse, any time someone was unlucky to
    cross paths with the police.


    The spectacle of entire communities bearing up under this kind of malign neglect
    ultimately proved incompatible with American self-regard that it led to action,
    and that action took the form of an expansive program of state provision. The
    America into which the Panthers emerged in 1966 was not one undergoing state failure
    or a process of managed retreat. Quite the opposite, in fact: during the Lyndon
    B. Johnson administration, the United States formally committed itself to nothing
    less than an all-War on Poverty. In concrete terms, this consisted of a range
    of targeted activities administered by an independent federal agency called the
    Office of Economic Opportunity, including the Job Corps vocational training initiative;
    an early-childhood education, health and nutrition program called Head Start;
    the college-preparation scheme Upward Bound; Volunteers in Service to America,
    or VISTA; and the ambitious, controversial Community Action Programs.


    Technocratic though it surely was in conception, the War on Poverty represented
    a massive expansion of the care services available to the millions left left behind
    by postwar economic surge. Many of its initiatives were specifically intended
    to address the needs and problems of what was then called “the ghetto.” And by
    the standards of the day, it was relatively well funded, more than tripling government
    expenditure on issues of poverty and amounting to some 15 percent of the entire
    federal budget by the time it was rolled back under the Nixon administration.⁴7'
  merge: -1
