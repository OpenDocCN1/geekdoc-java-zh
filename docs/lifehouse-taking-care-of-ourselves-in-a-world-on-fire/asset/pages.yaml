  md: 'At the level of daily sustenance, the People’s Free Food Program furnished
    recipients with “an ongoing supply of food to meet their daily needs.”73 Each
    participant in the program was furnished with standardized bags of staple items
    such as “eggs, canned fruits and vegetables, chickens, milk, potatoes, rice, bread
    [and] cereal,” with a “minimum of a week’s supply of food” included in every bag.
    Whenever conditions permitted, it was extended to “[p]periodic mass distributions
    of food to reach a larger segment of the community than can be serviced from the
    ongoing supply.” What people got through the Free Food Program was both more generous
    and more closely tailored to their expressed desires than any package of support
    any government program of the time was able to offer.


    The People’s Free Medical Clinics were dedicated to longer-term maintenance of
    the body, addressing the demand for “completely free healthcare for all Black
    and oppressed people” in Point 6 of the Ten-Point Program.74 Eventually extending
    to thirteen cities, these were often rudimentary affairs, set up in trailers or
    abandoned storefronts; in Boston, the clinic ran on electricity tapped illegally
    from a nearby lamppost.75 But most were nevertheless able to offer a respectable
    range of primary-care services, from basic wound care and blood-pressure testing
    to nutrition advice, childhood vaccinations and prenatal screenings.76 Equally
    important, the care offered at the clinics upheld the dignity of the people they
    served, in ways that contrasted sharply with the neglectful, dismissive, patronizing
    or authoritarian treatment Black patients expected to receiving from public hospitals.


    The clinics placed a strong emphasis on preventative healthcare, doing everything
    they could to address the totality of the circumstances that produced sickness.
    This attention to the underlying social and structural causes of disease required
    an intimate (and labor-intensive) degree of involvement in patients’ lives, in
    a way that would be unthinkable for mainstream medicine, then or now. “We’d go
    in, and there would be an'
