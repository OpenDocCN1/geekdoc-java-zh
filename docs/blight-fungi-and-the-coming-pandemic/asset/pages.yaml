  md: '# ACKNOWLEDGMENTS


    My first real acquaintance with a fungus-like pathogen was when a disease called
    late blight spread up the East Coast in 2009, devouring late summer tomato plants
    that were heavy with promise. A few years later, in 2012, Mat Fisher, Sarah Gurr,
    and others published an article in Nature titled “Emerging Fungal Threats to Animal,
    Plant and Ecosystem Health.\ Other articles followed. They are still ringing that
    bell, maybe more furiously now. One goal when I began this book in the fall of
    2019 was to amplify their warning and wake up readers to the breadth of species
    lost to fungal pathogens that have gone pandemic. Another goal was to remind them
    that this is just the beginning unless we take responsibility for our actions,
    which have aided these outbreaks.


    Like so many of us past few years, I met with scientists and others mostly over
    Zoom. We talked about fungal pandemics during a pandemic across their dining room
    tables and in their kitchens and living rooms. I worried that readers might not
    want to learn about a global pandemic when we’re all still processing our current
    pandemic. But one scientist whose entire family had become infected with SARS-CoV-2
    reminded me that a fungal pandemic is far worse than any viral pandemic because
    of the nature of fungi. It’s true. And so I feel some urgency to share the work
    and words of scientists who have experienced fungal pandemics firsthand and who
    also have some thoughts about how to prevent future outbreaks.


    I am grateful to those who gave their time to describe their work to me and then
    read over my chapters, answer emails, and talk some more. Their words and their
    work form the foundation for this book. Many also read sections of chapters to
    ensure accuracy. Any errors are all mine. Thank you'
