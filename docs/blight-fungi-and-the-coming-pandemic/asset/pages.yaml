  md: 'you make sourdough bread, you know that yeasts—which are also fungi—are floating
    around the kitchen mostly innocuously. Within each of the tiny black dots of a
    Rhizopus fungus we see blooming on a piece of old bread, there are thousands of
    spores. Their number makes them visible. A fungus called smut makes a rounded,
    container-like gall that can send twenty-five billion spores across a field. Chemists
    estimate that fifty million tons of spores populate the atmosphere on an annual
    basis, each spore aloft on the wind from earth-dwelling fungi. Most fungi rely
    on spores, not all do. Yeasts and their relatives bud, pinching off daughter cells,
    all under duress even yeasts will make spores.


    Most fungi travel by spores. Some move only fractions of an inch, dropping from
    one leaf to another. Others cross oceans, surviving low atmospheric temperatures,
    desiccating air, and the harsh sunlight that comes with high-altitude travel.
    Humans carries spores too—on our clothes, in our hair—and we breathe in and out
    by the thousands. Spores that have landed in the mud might be caught in the recesses
    of our work boots and sneakers and the treads of car and truck tires. We drop
    them along a hiking trail as we move, or by board an airplane, providing the fungi
    with a lift from one state to another or across an ocean. Fungal spores are aboard
    the International Space Station; some may travel with us to the Moon or even Mars.
    Some are spores that must germinate quickly or die and may not survive long and
    arduous travel, while others survive during travel when they die on an unsuitable
    host. Some lie dormant until a host sets down in a speck of soil where a spore
    has rested for decades. This is, in part, what makes some fungi disease-causing
    fungi can survive in the environment for months or years even without a host.
    Unlike many pathogenic microbes, fungal spores are remarkably persistent, and
    each single spore carries the instructions for a next generation of mold, mildew,
    smut, or myriad fungi. By some estimates there are at least six different species
    of fungi, most as yet unknown (for perspective, there are roughly two million
    known animal species, with the majority of those insects, and nearly four hundred
    thousand land plant species not including mosses, liverworts, and the like). Fungi
    are some of the most prolific and diverse life-forms on the planet.'
