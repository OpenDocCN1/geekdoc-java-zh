  md: 'Thirteen years later, recognizing the universal threat from fungal pathogens,
    dozens of scientists published a workshop report: “One Health: Fungal Pathogens
    of Humans, Animals, and Plants.” In it are a set of recommendations they hope
    will reduce the threat of fungal pandemics. The recommendations include better
    reporting and tracking of disease, finding better ways to prevent and treat disease,
    and developing new antifungal drugs. All of this hinges in part on a global consensus
    of all known fungal species in the environment and in our own human microbiome
    and on developing databases of fungal genomes. All will assist in better understanding
    outbreaks as they occur.


    To this last point the scientists write that our impact on the planet has the
    emergence of fungal pathogens. This includes species that hadn’t been known to
    cause problems before, Cryptonephia parasitica in chestnuts and Candida auris
    in humans to Pd in bats and Bd in frogs. Fungi demand our attention. If we are
    to preserve life on the planet we know it, we need to take heed. Being aware of
    our singular actions as consumers of energy, products, and tourism is far from
    enough. But we can choose to contribute in small ways.


    Imagine a future we look forward to supermarket shelves filled not only with thin,
    yellow bananas but with dozens of kinds of bananas, some short and stubby, some
    blue-skinned or red. They may be starchier or sweeter and hail from plantations
    large and small that grow as crops mixed in with papaya and other plants. Most
    are labeled “sustainably grown” because the amount of pesticides and fungicides
    applied have been reduced over the decades to new strains and more ecologically
    minded farming practices. As major producers move from growing bread wheat and
    durum wheat to growing other grains, such as amaranth, spelt, and buckwheat, consumers
    will not only demand diversity in their grains, vegetables, and fruits.


    Imagine a future with rapid diagnostics for a whole range of microbes from viruses
    to fungi using DNA sequencing. Foresters who can quickly check for disease in
    existing trees and plants can prevent new outbreaks before they spread. Exporters
    can test their plants, seeds, and fruits for harmful microbes and insects, and
    importers can more easily swab and test biological goods themselves. What if the
    trade in wild-caught animals—'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'frogs, salamanders, fish, birds—ceased, and instead hobbyists seek out and
    demand that their pets be certified captive grown and disease free? What if the
    global public recognizes that releasing captive animals into the wild, no matter
    how well intended, often causes more harm than good? And as world travelers, what
    if we consider the consequences of our movements, leaving our fruits, vegetables,
    and plants behind; or cleanse our muddy shoes and boots; or submit to the occasional
    disease scan when necessary?


    We could consider each of these small steps as putting hope into action. We know
    and care enough to believe in, act on, and support the work of scientists and
    policy makers who are taking action on a larger scale: those who work to preserve
    genetic diversity across species from crops to wildlife; who push for legislation
    to better protect wildlife; who pursue development of more resilient plants and
    animals despite public pushback; or who seek to understand the genetic and ecologic
    underpinnings of a species’ survival so that someday we might better protect them
    from humanity. We are the direct and indirect cause of species’ extinctions and
    disruptions caused by fungi. We are all living in the same little boat: Earth.
    Pine trees, bats, frogs, and myriad others—we save them, we save ourselves. Acting
    on Hope to prevent further degradation is our moral obligation.'
