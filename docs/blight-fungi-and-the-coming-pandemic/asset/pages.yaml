    the purpose of zoos from menageries for the public to enjoy more conservation-
    and education-oriented centers. When word of disappearing amphibians first began
    in the late 1980s, Rabb helped pull together a meeting of scientists from around
    the world and developed a task to investigate the cause of the declines. The FWS,
    wrote Jenkins and Lips, needed to "ensure traded amphibians are Bd-free based
