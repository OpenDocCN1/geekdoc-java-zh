  md: 'make a good team. In time the duo would pursue a wildlife disease control policy
    in the manner of Charles Marlatt. And like Marlatt’s travels, their road to success
    would be a hard-won struggle played out over years.


    Jenkins and Lips joined up with others to petition the US Fish and Wildlife Service
    (FWS), the agency largely responsible for wildlife species that enter and leave
    the country, to help stop the spread of Bd. Behind-the scenes assistance came
    by way of a key personality: zoologist George Rabb, an amphibian specialist. For
    nearly forty years he worked with the Brooklyn Zoo in Chicago as a researcher,
