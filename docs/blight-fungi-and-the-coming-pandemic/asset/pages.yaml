  pgno: 17
- img_proc: true
  md: 'with dead and dying plants and animals—a feast for fungi. Earth didn’t have
    a second reptilian age because fungi infected the more susceptible reptiles, while
    warm-blooded mammals survived the fungi. That’s the hypothesis. And it is possibly
    why bacteria and viruses, which tend to tolerate the human household, are typically
    more important pathogens compared with fungi.


    Now, thinks Casadevell, climate change is challenging for one of our important
    defenses against fungi. A warmer environment may enable some fungi to evolve a
    higher temperature tolerance. If a fungus can jump the temperature barrier, then
    humans and others could become hosts to novel fungal infections. A yeast that
    normally grows in wetlands or on apple trees could possibly evolve to live in
    goats or bats or humans.


    In 2010 Casadevell and Monica Garcia-Solache coauthored a piece for a scientific
    journal. They hypothesized that warmer temperatures would alter and likely increase
    the geographic range of disease-causing fungi and likely select for new fungi
    with higher tolerances for a warm body. In 2019, less than a decade later, Casadevell
    and colleagues suggested that the emergence of *C. auris* may the first example
    of a climate-enabled, novel fungal pathogen. The concern, he says, as we move
    into a century with higher temperatures, some fungi will adapt, breaking through
    the fungal filter. “Right now, most fungi in the environment are simply not able
    to survive our temperature, but if some adapt to higher temperatures, then we
    may be open to new pathogens. That’s what we argued.”


    Casadevell imagines a fungus that can normally grow in temperatures up to 36°C
    (96.8°F) when exposed to hot days could eventually evolve so that it survives
    at 37°C (98.6°F)—our range. It is possible that just one degree would be enough
    for survival. Fungi are known to adapt rapidly to temperature, which means that
    every hot day, becomes a roll of dice. “We have argued this is the canary in the
    coal mine,” says Casadevell, or in other words, a fungus all ready and loaded
    to go, infecting other pathogens, may insects or reptiles, but that couldn’t hack
    the warmth of a human body. “And then some point—some adapted. Now we have a huge
    problem. There could be other explanations,” concedes Casadevell, “but right now
    we don’t have any.”'
