  md: 'THERE IS NO MEGAN ROMBERG EQUIVALENT, NO NATIONAL MYCOLOGIST or any similarly
    dedicated expert able to identify fungal diseases for the wild animal trade. A
    novel pathogen carried by a tree frog or other amphibian might easily pass into
    the country unnoticed. In 2013 the Netherlands’ fire salamander populations began
    to crash, scientists identified the cause as a chytrid fungus closely related
    to Bd, the frog-killer that hit Karen Lip’s field sites in the early and mid-1990s.
    The fungus was so virulent by the time it was discovered, some salamander populations
    had been reduced to around 4 percent of their original size. The new disease was
    dubbed Bsal, or Batrachochytrium salamandrivorans, and like Bd, the disease is
    highly lethal to the naïve populations of salamanders that hadn’t had the thousands
    or millions of years to make their peace with the fungus. The news shook herpetologists
    around the globe. But this time scientists could benefit from experience, and
    the outbreak was quickly linked to trade in Asian salamanders in which the fungus
    was thought to be endemic. A few years earlier, Asian newts imported to Europe
    tested positive, and the fungus had also been detected in wild populations in
    Vietnam. The disease was another example of the erosion of “ancient barriers to
    pathogen transmission.” Once again we sent living organisms that had been geographically
    separated for millions of years crashing together.


