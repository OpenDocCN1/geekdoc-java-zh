  md: 'When C. auris was first isolated from the ear of a Japanese patient in 2006,
    the sample had been archived by researchers who were simply isolating yeasts that
    could infect humans for an antifungal study. That year the fungus was also found
    in a cluster of patients in South Korea for chronic ear infections. In 2009 it
    was found to have invaded the bloodstream of one elderly patient and two infants
    in South Korea. Of the three, only one of the infants survived. The “ear” fungus
    was now lethal. By 2016 the CDC viewed C. auris as an urgent threat, which is
    when it advised hospitals and other long-term care facilities in the United States
    to be on the lookout. By then the circulating strains seemed to spread between
    patients and between hospitals. One hypothesis is that the fungus first infected
    the ear because it is naturally cooler than the rest of our body and so more tolerable—a
    first step into the houseouse.


    ![](img/a879418bf7bcca813d6de126747d7203_19_0.png)


    IN 2019, BRENDAN JACKSON, A MEDICAL EPEMIOLOGIST AT THE CDC, with other agency
    scientists, published a paper titled “On the Origins of a Species: What Might
    Explain the Rise of Candida auris?” The team identified four genetically distinct
    populations of C. auris that had emerged “nearly simultaneously” in East Asia,
    South Asia, Africa, and South America. The majority of cases in the United States
    likely hailed from the South Asian population. A subsequent paper by a different
    group added one potential emergent population isolated from a patient in Iran.
    Scientists believe there are four “clades,” or distinct populations originating
    from a common ancestor, and possibly more of C. auris. This astounding finding
    would be akin to having several different variants of the SARS-CoV-2 virus, which
    causes COVID-19, emerging in late 2019 at all once rather than originating from
    a single strain that evolved over time.


    When reports of C. auris were first categorized as something “new,” Jackson was
    skeptical. He thought maybe it was a pseudo-outbreak, a misdiagnosed yeast that
    had been around for years before detection technology improved. But from an earlier
    publication that reported the absence of C. auris in more than thousand Candida
    samples collected between 1996 and 2009, quickly disabused him of that notion.
