  md: 'Most fungal species are essential for the survival of plants, animals, and
    humans. Our gut and skin microbiomes are populated not only with bacteria but
    viruses, protozoa, and fungi too, all of which are members of the dynamic and
    diverse community of microbes that we carry within and upon us. Belowground, mycorrhizal
    fungi—fungi that colonize the roots of plants—connect and nourish trees and other
    plants and help control other microbes that may cause disease. The life-saving
    penicillin discovered through a combination of serendipity and astute observation
    by Alexander Fleming is by the same kind of fungus we might see on a moldering
    bit of bread or infiltrating the ring of an old cantaloupe.


    Many fungi reveal themselves us as mushrooms, fleshy reproductive bodies with
    fanciful names like Pink Disco, Destroying Angel, and Dead-Man''s Fingers. Morels,
    chanterelles, hens-of-the-woods, and others are prized in the kitchen. A few make
    chemicals that we can send us on a psychedelic trip or kill us. Mushrooms take
    shape from the probing, ever-expanding hyphae that bind together and rise up—pushing
    through bark, sometimes ever black. And other fungal fruiting structures (because
    not all fungi form mushrooms) release spores. When they grow, their hyphae lace
    through the ground and grow in and around the rhizomes. Fungi are some of the
    most important decomposers of the world, turning what once lived back into nutrients
    and soil. Though fungi remind us of plants, they are in fact more closely related
    to animals, like both plants and animals, they belong to their own taxonomic kingdom,
    the kingdom Fungi.


    Animals, even microscopic animals, consume and digest food. We digest our food
    in our stomach. Fungi digest food first, sending our digestive juices into the
    environment. Enzymes decompose plants and other microbes. A birch felled by high
    winds, bathroom wallboard, a block of cheese, a human body are all converted back
    into nutrients this way. Fungi that feed on the dead, the so-called saprobes,
    reduce skin and feather, bark and leaf into their molecular building blocks, amino
    acids, fatty acids, and simple sugars, which are in turn nutrients for fungi,
    plants, and other living things. The fungus then absorbs what it needs from this
    broken-down matter. If were not for fungi, the world would be piled high with
    the deceased and would be virtually uninhabitable. Most'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'fungi live if in collaboration, then in peace with other living things. But
    some do not. Some feed on the living rather than the dead and dying. Most fungi
    give life; fungal pathogens take it.


    You may have read about the great frog die-off. Or if you live in the northeastern
    United States, you noticed the disappearance of bats or are familiar with the
    deadly yeast circulating in hospitals and nursing homes. If you love coffee, cocoa,
    or bananas, you may have read an article or two with worrisome headlines about
    their potential demise. Yet fungal threats are not one-off, single-species problem
    oddities, as news headlines might suggest. They are big, continuing, diverse,
    and potentially catastrophic. Each species or population we lose is a loss with
    consequences. Frogs and bats eat moths and insects, and so their loss is an opportunity
    for crop-eating caterpillars and disease-carrying insects to flourish. Nut and
    pine trees support whole ecosystems—bears, birds, fish, other plants, and communities
    of microbes including mushrooms that we might like to eat. What happens when a
    bear or a bird loses its food?


    I tell these stories of loss through the perspective of the ecologists, foresters,
    physicians, biologists, policy makers, and citizens who are working against time
    to save plant, animal, and human life as we know it. Many agree that once a disease-causing
    fungus settles in, it will not “go away”; in other environment without its host
    is here for the long haul. All agree that a species’ best chance for surviving
    a fungal pandemic is genetic diversity. We are trying to prevent fungal pandemics
    by tightening trade and level policy or applying new technologies. Others have
    spent decades breeding disease-resistant trees, even though they will never live
    to see the outcome of their work. Crop scientists, geneticists, and seed savers
    seek resistance in crop diversity to ensure there will be bananas or wheat for
    the next generation. Their collective efforts offer some glimmer of hope if we
    as a society can pay attention.


    Prevention is difficult but not impossible. It means being careful about the plants
    and animals we move around the world; performing rapid disease diagnostics and
    being willing to respond when a test turns positive; and, even more, caring about
    prevention when we move around the globe. It also means protecting biodiversity
    and reducing habitat loss. Where prevention has failed, protecting genetic diversity
    and the potential'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'resistance genes in a population of trees or salamanders or a food crop is
    the next best way to survive a fungal pandemic. But there are no guarantees for
    a genetic rescue. When we remove natural barriers between species, one outcome
    is the emergence of novel disease. Most interactions will be benign, some will
    be mildly problematic, others will be catastrophic.


    The pandemics and epidemics I write about in these pages all began with a fungus
    that moved from its home environment to a completely new setting where it happened
    upon a suitable host. There are a lot of fungi in the world. Although most are
    harmless, a few can cause utter devastation when provided with a novel and susceptible
    host. Our job going forward will be to prevent the potentially harmful fungi from
    meeting the susceptible host—including us.'
