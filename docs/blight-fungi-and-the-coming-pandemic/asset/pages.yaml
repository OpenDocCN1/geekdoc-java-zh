  md: '# INTRODUCTION


    In a large cave on the side of a mountain in Vermont, a fungal spore rests on
    the mud floor. It has been there since since early spring when the bats, mostly
    little brown bats, began moving out to their summer roosts. The cave had their
    winter hibernaculum, a place to hang and conserve energy through the cold when
    food is scarce. The spore, a microscopic capsule gently curved like a caraway
    seed or banana, can survive for months resting on the cave floor. In the fall
    the bats will return. As they settle for the winter, a young female born earlier
    in the spring, sips water from a puddle on the floor. She has flown dozens of
    miles from the root where she was born to this cave. Her wing brushes the floor
    where the spore has been resting, and that is all it needs to begin its own journey.
    Before long the spore, now resting on the bat’s membranous wing rather than the
    muddy floor, germinates and begins to grow. As it does, it spreads outlike fungal
    hyphae in search of food.


    Bat skin has plenty of what this fungus needs; it thrives on keratin. The cave
    is cold, a few degrees above freezing; this particular fungus prefers the cold.
    It will infiltrate the little brown bat’s wings and feed on it until it is time
    for it to reproduce, and then it will drop hundreds of spores and pieces of hyphae,
    which will land on other bats, the cave wall, and the mud floor. The female will
    not survive the infection. The fungi in time will lead to the death of other bats
    with whom she shared the cave. Hundreds, millions of bats will become infected,
    and most—all—will die.


    The spore belongs to a fungus called Pseudogymnoascus destructans, which causes
    a disease known as white nose syndrome. The disease has killed millions of bats
    since its emergence sometime in the 2000s. The'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'epidemic may have begun I described, with a spore landing on a cave floor.


    Meanwhile, in the mountainous western region of the country, spores from a very
    different fungus called a “rust” fill the air on a cool, moist spring day. Some
    of these spores will land on the evergreen needles of a whitebark pine. The tree
    is old and grows twisted from decades of being blasted by wind and harsh weather.
    It is a survivor. The spore germinates in the damp, misty air. It begins to grow
    into the needle, the twig, the branch, the tree has never had to contend with
    this type of fungus, and whatever natural defenses it has are insufficient. As
    the fungus grows, needles will be brown and die. A few years later the entire
    tree will die. The scenario has happened millions of times to trees. This fungus,
    which causes an infection called white pine blister rust, arrived on the continent
    over a century and remains a problem today. The fungus that is killing bats emerged
    barely two decades ago and is also spreading across the continent. Most scientists
    say that once a fungus arrives and takes hold, it won’t “go away.” The rust fungus
    is here to stay, and is too bad for the bat fungus. Trees, bats, and other species
    impacted by fungi are in peril of dying off, forever.


    Collectively, infectious fungi and fungus-like pathogens are the most devastating
    disease agents known on the planet. The incidence of novel fungal diseases across
    species, including humans, has risen over the past century. Where do these fungi
    come from? And can we do anything to prevent their emergence?


    RUSTS, MOLDS, MILDEWS, AND MUSHROOMS—WE LIVE IN A CLUB of fungal spores, microscopic
    spherules of nascent fungi. Fungi are everywhere. In the back of the refrigerator
    a thick mat of green greets us when we open a tub of forgotten yogurt. Pink and
    yellow fuzz blooms across the wall of a flood-damaged home. Our air we breathe
    is teeming with fungal spores, while underground tangles of hyphae burrow through
    soil; water, nutrients, and other chemicals flow through these cellular tubules.
    There are fungi in the deep ocean, in the radioactive ruins of Chernobyl, and
    behind damp towels hung to dry on the International Space Station orbiting the
    planet. If'
