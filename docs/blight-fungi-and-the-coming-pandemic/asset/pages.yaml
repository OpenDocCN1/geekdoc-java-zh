  md: 'MEGAN ROMBERG WORKS FOR THE USDA ANIMAL AND PLANT HEALTH Inspection Service
    (APHIS), and it is her job to identify fungi intercepted on imported plants or
    plant material at ports of entry. She can trace her job back to Flora Patterson,
    the mycologist who identified white pine blister, and to Charles Marlatt, in his
    crusade to prevent plant pests and pathogens from entering the country.


    As one of two national mycologists (the other is John McKemy), Romberg spends
    her days looking through a microscope at hyphae and spores, poking into a world
    of us we never see. Most of the samples Romberg slips under her microscope from
    ports where the US Customs and Border Protection specialists are on the front
    lines inspecting cut flowers, perishable fruits and vegetables, and plants for
    planting (seeds, corns, tubers, cuttings—whatever might be used to reproduce a
    specific plant). While US Customs has inspectors at every port with entry to the
    United States, specific locations, known as plant inspection stations, are scattered
    across the country. Currently, there are seventeen stations where APHIS personnel
    inspect plants intended for propagation. For plants getting the most scrutiny.
    Fruits and vegetables that are eaten or may end up in the dumpster, a dead-end
    for any hitchhiking pest or pathogen, are less of a concern. Plants from one country
    may get more attention than plants from another, and port workers are trained
    to learn for symptoms of infection. When an inspector inspects a fungal infection,
    the plant is passed to the “mycology area identifier.” There is a huge diversity
    of imports and a huge diversity of fungi, but there are just twenty area identifiers
    focused on fungi in the country. Each one, according to Romberg, sees about a
    thousand samples a year. In contrast, over hundred entomology identifiers are
    at the ports, looking for bugs. Just about every week, Romberg finds something
    she has never seen before.


    When Romberg sees a leaf spot, she imagines a microscopic landscape covered with
    star-like spores or spiral-shaped spores or long, thin ones with appendages. Often
    one fungus’s hyphae or mycelia tend to look much like another, spores are useful
    for identification. When the area identifiers are stumped, they overnight samples
    to Romberg or McKemy. In the past five years they have identified over one thousand
    fungal taxa on plant hosts. Most samples must be processed and identified in a
    day or two (plants and plant parts are considered perishable, and time is money'
