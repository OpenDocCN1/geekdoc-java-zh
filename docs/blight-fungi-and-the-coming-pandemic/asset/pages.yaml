  md: 'for importers), and often to accurately identify a species, it must be sporulating—that
    is, producing fruiting structures and spores. Sometimes a decision must be made
    without full confirmation of the fungal species based on the plant, where it came
    from, or whatever else might identify what cannot be seen. Disease can also slip
    through, and when it does, within a year or two or three, some farmer will inevitably
    fail in it field and send a sample off to Romberg.


    The most recent surprise was tar spot caused by Phyllachora maydis on corn crops.
    In 2015 a sample arrived from Indiana. It had popped up in Indiana and in Illinois
    and soon was infecting crops and reducing yields throughout the Midwest. Odd-shaped,
    raised, deep-brown spots the size of pinheads spread across thousands of leaves;
    each spot is a fruiting body capable of releasing thousands of spores. The fungus
    had come through ports in the past but was identified, and the imports were reexported
    or destroyed. Four years after it was first detected in the field, the fungus
    spread, infecting corn crops in three hundred counties; heat maps show the fungus
    radiating away from where it was first noticed. The current plant inspection is
    an imperfect system, dealing with overwhelming numbers, but still inspection teams
    identify hundreds of plant pathogens from the Americas, Asia, Caribbean, Europe,
    and elsewhere each year; many of them are fungi. Each pathogen detected is potentially
    one new blight, smut, or rust stopped before it can ruin a crop or devastate a
    forest.


