  md: '# FURTHER READING


    # FUNGI IN GENERAL


    There are many good books about fungi. Here are a few:


    E. C. Large. The Advance of the Fungi. New York: Henry Holt, 1940.

    Nicholas P. Money. The Triumph of the Fungi: A Rotten History. Oxford: Oxford
    University Press, 2006.


    Merlin Sheldrake. Entangled Life: How Fungi Make Our Worlds, Change Our Minds
    and Shape Our Futures. New York: Random House, 2020.


    Suzanne Simard. Finding the Mother Tree: Discovering the Wisdom of the Forest.
    New York: Knopf,


    2021.


    # FOOD


    Daniel Charles. Lords of the Harvest: Biotech, Money, and the Future of Food.
    Cambridge, MA: Perseus, 2001.


    Cary Fowler. Banana: The Fate of the Fruit That Changed the World. New York: Plume,
    2008.


    Dan Koeppel. Mann. The Wizard and the Prophet: Two Remarkable Scientists and Their
    Dueling Visions to Shape Tomorrow’s World. New York: Vintage, 2018.


    Stuart Cook. Coffee Is Not Forever: A Global History of the Coffee Leaf Rust.
    Athens: Ohio University Press, 2019.


    Dan Salatino. Eating Extinction: The World’s Rarest Foods and Why We Need to Save
    Them. New York: Farrar, Straus and Gireoux, 2022.


    John Soluri. Bacteria Cultures: Consumption and Environmental Change in Honduras
    and the United States. Austin: University of Texas Press, 2005.


    Daniel Stone. The Food Explorer: True Adventures of the Globe-Trotting Botanist
    Who Transformed What America Eats. New York: Dutton, 2018.


    # OTHER SPECIES


    Anne Bikle and David Montgomery. The Hidden Half of Nature: The Microbial Roots
    of Life and Health. New York: W.W. Norton, 2015.


    Susan Freinkelin. American Crust: The Life, Death, and Rebirth of a Perfect Tree.
    Berkeley: University of California Press, 2007.


    Elizabeth Kolbert. The Sixth Extinction: An Unnatural History. New York: Henry
    Holt, 2014.


    Michael Melzer. When Biospheres Collide: A History of NASA’s Planetary Protection
    Program. Washington, DC: US Government Printing Office, 2011.'
