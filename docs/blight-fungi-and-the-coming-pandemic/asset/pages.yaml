  md: 'more typical fungi grow hyphae or reproduce sexually. This ability to spawn
    offspring with or without sex is common to many if not fungi. Some, like yeast,
    favor asexual reproduction, while others cycle between sexual and asexual. Fungi
    are fantastically diverse when it comes to sex and reproduction; at least one
    fungus has thousands of different “mating types.” When yeasts engage in sex, they
    stretch their typically rounded bodies into ghost-like “shmoos”, the name borrowed
    from a mid-twentieth-century Li’ Abner cartoon character. Sexually receptive chemo
    are drawn to one another by chemical scents called pheromones. When the yeasts
    are cultured and reproduce on a petri dish, the invisible cells cover time up
    into pinpricks, and pinpricks eventually expand into rounded mounds or flat disks
    looking like spilled paint. Colonies of C. auris typically appear cream or white
    in color, but on some media they take on shades of pink or purple.


    A fungal infection of the skin, genitals, or throat might cause us to hide our
    toes or send us to the doctor’s office, but it is seldom fatal. This isn''t true
    once a fungus invades our blood. Each year nearly a billion patients struggle
    with fungal infections; for 150 million it will be life threatening, and of those,
    more than 1.6 million people around the world will die. This statistic is similar
    to the number of deaths from tuberculosis and nearly three times higher than malaria.
    Some invasive fungi, depending on species, strain, and other conditions, have
    fatality rates of 30 to 100 percent. In the hospital, Candida fungi are a common
    cause of blood-borne infections, with most caused by C. albicans. Even before
    the emergence of C. auris, systemic yeast infections were notorious for their
    high mortality rate, which hovers around 40 percent, despite antifungal drug treatment.'
