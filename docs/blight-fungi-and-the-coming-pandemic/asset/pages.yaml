    67 A. psidii hotscotted: In Hawaii it infected ‘ohi’a, causing what was called
    at the time ‘ohi’a rust. The most numerous on the islands, are cultural touchstones
    and foundational to the island ecology. Their loss, for reason, would be utterly
    devastating. Rust damage was modest, but around 2013 the ‘ohi’a began in large
    numbers. An entirely different fungus, an aggressive member of the *Ceratocystis*
    genus, had arrived. Hundreds of thousands of ‘ohi’a on the island of Hawaii have
    been killed and Hawaiians are desperately trying to prevent it to spread to the
