    free. The FWS deals mainly with wildlife while the USDA Animal and Plant Health
    Service protects animals raised for food, including livestock and poultry (and
    many animals kept as pets).


    Though there are few laws governing disease in wild animal imports, there are
    plenty of laws to protect food animals from disease. In February 2001, during
    an outbreak in Essex, England, a routine veterinary inspection of pigs at a slaughterhouse,
