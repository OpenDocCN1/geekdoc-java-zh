  md: '# Chapter 1

    EMERGENCE


    On November 4, 2016, the US Centers for Disease Control and Prevention (CDC) Mortality
    and Morbidity Weekly Report headlined an unlikely kind of infection. Though previously
    unrecognized, the infection was turning up in various locations around the world
    almost simultaneously. It was new, difficult to diagnose, and had a high mortality
    rate, killing thirty to sixty percent of infected patients. Even when diagnosed
    properly, it resisted medication. The disease could also be transmitted from one
    patient to another, and was stubborn, contaminating hospital equipment and rooms.
    This bizarre infection was caused by Candida auris, a fungus that is categorized
    as a yeast. The emergence of a new fungal pathogen is unusual but not particularly
    among the evergrowing population of immunocompromised patients, including those
    on powerful steroid drugs, cancer survivors, and transplant recipients. But C.
    auris was also unusual because it emerged with a resistance to some or all antifungal
    drugs, depending on the strain. It seemed to spread between patients and between
    hospitals, a characteristic more reminiscent of bacteria and viruses fungi. And
    it was also unusual because it seemed to come from nowhere and everywhere at once.


    The CDC is responsible for other things, disease surveillance and identification.
    Its first mission, dating back to the 1940s, was malaria control, but it has since
    morphed into the premier agency for tracking and alerting the medical world to
    baffling new infections, from Ebola to meningitis, influenza, HIV, and COVID-19.
    The CDC now attracts some of the best physicians, veterinarians, microbiologists,
    and epidemiologists, among other scientists. In 2015, before C. auris became a
    known problem,'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'a medical mycology laboratory in Pakistan sent some samples to the agency’s
    Fungal Reference Laboratory. There had been an outbreak, and the Pakistani scientists
    sought confirmation that the fungus was what they had thought it was—a yeast called
    Saccharomyces cerevisiae. The yeast, also known as brewer’s yeast, is used in
    making beer, wine, and breads, but under some circumstances it can infect humans
    and make sick. The CDC’s laboratory found that the yeast had been misidentified.
    Rather than S. cerevisiae it was C. auris, which had been identified about a decade
    earlier, swabbed from the ear of a patient in Japan and named accordingly, Candida
    auris, a fungus of the ear.


    A year C. auris began popping up in other locales around the globe, including
    a handful of cases, diagnosed retrospectively, in the United States, which is
    when the CDC issued its first warning about the emergent disease. Hundreds of
    cases in the United States and thousands of cases globally have been reported.
    In April 2019 the New York Times published a story about a patient who had been
    hospitalized at Mount Sinai in Brooklyn, New York, with C. auris. He had waited
    three months. By then the yeast had colonized the entire room. Dr. Scott Lorin,
    the hospital’s president told the Times that “everything was positive—the walls,
    the bed, the doors, the curtains, the phones, the sink, the whiteboard, the poles,
    the pump. The mattress, the bed rails, the canister holes, the window shades,
    the ceiling, everything in the room was positive.” Because the yeast resisted
    disinfectants until the time, the hospital ripped out tiles from the floor and
    ceiling. Tom Chiller is the chief of the CDC’s Myotic Diseases Branch and has
    decades of experience working with challenging diseases. C. auris, he says, is
    a big concern because no one knows how it emerged or where it came from and because
    it is so resistant to treatment. He has referred to the fungus as “a creature
    from the black lagoon.”


    Even more troubling, scientists worry that the yeast is a harbinger for other
    human fungal pathogens. Over the past century infections has caused catastrophic
    losses in other species, but so far we have been lucky. Our luck may be running
    out.'
