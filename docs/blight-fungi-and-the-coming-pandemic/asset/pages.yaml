  md: 'The new incursion was frightening. It is particularly disturbing to those who
    work with salamanders in the United States, where the Appalachian Mountain range
    is a hotspot of diversity for the shy creatures. The United States homes to 25
    percent of all salamander species in the world, and yet each year we import two
    hundred thousand captive grown and wild-caught salamanders into the country, many
    of them from Asia. Without inspectors on the front lines or some other methods
    of prevention, the arrival of Bsal is almost inevitable. Even worse, some native
    salamanders are already infected with Bd. When ecologist Karen Lips witnessed
    the frog fiasco firsthand, it was a mystery. But Bsal is not. Lips hopes to protect
    the salamanders before the fungus arrives.


    In 2005, the devastation caused by Bd had become clear, representatives from organizations
    devoted to saving frogs, including Lips, attempted to protect whatever species
    they could. The group produced a report entitled “The Amphibian Conservation Action
    Plan.” Studying, tracking, and predicting when the fungus would strike was important,
    they wrote, but it was not enough. There had be some action toward prevention.
    It would be “morally irresponsible to document amphibian declines and extinctions,”
    they wrote, “without also designing and promoting a response to this global crisis.”
    In 2009 Lips joined the faculty at the University of Maryland. She could study
    amphibians in the Appalachian region, where she and others noted low rates of
    Bd infection in woodland salamanders. Maybe, they hoped, the salamanders had evolved
    some immunity against the fungus. Maryland provided access to salamander hotspots;
    it also placed her closer to Washington, DC, the epicenter for policy-making.


    When Lips arrived in Maryland, the frog decline was already on the radar of local
    organizations. She was often asked to speak about her work at meetings around
    town, where she met Peter Jenkins, then director of international programs for
    the conservation organization Defenders of Wildlife. He had just completed work
    on a report entitled “Broken Screens,” about the legal gaps in the animal trade.
    Jenkins focused on invasive species the red lionfish, Burmese frog, and great
    green tree frog from Australia. As an environmental lawyer, Jenkins knew how to
    move policy in Washington. Lips had firsthand experience with the damages caused
    by a relativelybridled animal trade industry. They would'
