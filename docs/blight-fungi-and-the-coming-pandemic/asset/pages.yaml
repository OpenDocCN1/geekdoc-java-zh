    One of our best strategies for warding off future peril is to practice prevention.
    Many of the scientists whose words or research fill these pages are involved with
    a global initiative called One Health, which recognizes that one segment of the
    world’s human, plant, and animal population cannot be protected from disease without
    considering the interconnections and the common qualities defining health in plants,
    animals, and the planet. The movement is reconnecting disciplines of science that
    over the past century have become increasingly distinct, separated by academic
    departments, analytical techniques, journals, language, funding, and more. The
    first effort, known at the time as One Medicine, focused on connections between
    human medicine, veterinary medicine, and the passing of zoonotic diseases from
    animals to humans through direct or indirect contact. Then in 2004 the Wildlife
    Conservation Society organized a symposium which included health experts from
    around the world, that moved the conversation from primarily anthropocentric concerns
    of human health toward all life on Earth. One outcome was a call for a new forward:


    No one nation can reverse the patterns of habitat loss and extinction that can
    do undermine the health of people and animals. Only by breaking the barriers among
    agencies, individuals, specialties and sectors can we unleash the innovation and
    expertise needed to meet the many serious challenges to the health of people,
    domestic animals, and wildlife and to the integrity of ecosystems. Solving today’s
    threats and tomorrow’s problems cannot be accomplished with yesterday’s approaches.
    We are in an era of “One World, One Health” and we must devise adaptive, forward-looking
    and multidisciplinary solutions to the challenges that undoubtedly lie ahead.'
