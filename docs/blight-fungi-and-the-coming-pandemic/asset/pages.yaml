    from the United States are disease free. “Bd-infected amphibians are imported
    and transported without legal consequences. The Department of Interior can stop
    this.” After all, they wrote, the Lacey Act’s salmonid certification had been
    relatively effective. But the two hundred or so salmonid species are relatively
