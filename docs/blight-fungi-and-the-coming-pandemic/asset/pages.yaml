  md: 'Darwin would turn his attention to the mechanisms of evolution, and others
    would take up the work of infectious disease. The fact that invisible life—fungi,
    bacteria, and other tiny things—might cause catastrophic disease hadn''t yet entered
    the realm of mainstream science or medicine; these were the years before Louis
    Pasteur and Paul Koch. The millions of microbes shimmering in a drop of pus or
    blood or the mycelium growing in a potato, it was believed, did not cause disease
    but were simply feeding on the dead and dying. So when blight struck potato crops,
    no one questioned the rotting plants were covered with some sort of fungus: that
    was obvious. They did argue about whether the fungus could have caused misery.
    A colleague of Darwin''s, the Reverend Miles Berkeley was the first to claim that
    blight was indeed caused by what later be known as Phytophthora infestans. Though
    categorized initially as a fungus, it is now recognized as a water mold, an organism
    more closely related to plants than fungi that look and behave like fungi, sending
    out mycelia and reproducing by spores. We would be one of the first microbes to
    be identified as pathogen.


    The potato famine was the outcome of a dramatic convergence of human hands. We
    are relentless traders and travelers, and as a result we have brought species,
    many of which for tens of millions of years or more, lived apart—separated by
    the planet''s oceans, islands, and mountains—crashing together. We are jumbling
    the world''s biota, often to devastating effect. Over a century ago, recognizing
    the dangers of conveying pathogens and pests, Charles Marlatt, the entomologist
    employed by the USDA, lobbied for protections. Since then, the plant trade has
    exploded, expanding 500 percent in just the past half century. More than a billion
    plants or plant parts destined for propagation arrive at our ports every year,
    many of them packed into shipping containers and sent by ships length of two or
    more American football fields, some carrying more than twenty thousand containers.
    So, we may ask, how well are our plant protections working? And is it even possible
    to stop the next plant pandemic?'
