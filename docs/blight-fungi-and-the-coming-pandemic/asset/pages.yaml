  md: '# AUTHOR’S NOTE


    For most species discussed in this book, whether fungi, plant, or animal, I use
    a mixture of Latin names and common names depending on the organism. Most often
    I will be using a species’ common name, but many microbes have only Latin names.
    Genes for specific proteins, when mentioned, are italicized.


    I struggled with whether measurements such as weight or temperature ought to be
    reported as metric units (since the metric system is used by much of the world
    and scientists) or imperial units, which we use here in the United States. In
    the end, since I think most readers are more familiar with miles rather than kilometers,
    the imperial system won out. The smallest unit of weight in the imperial system
    is an ounce. Rather than estimating fractions of an ounce, I chose to stick with
    grams as scientists report in their studies. There are twenty-eight grams in an
    ounce. When I write about temperature, I will use Celsius and include the conversion
    to Fahrenheit.


    Finally, there are many different government agencies and some nonprofit organizations
    in these pages, and their names are long. I will either use their whole name or
    refer to them by their initials when initials are familiar to readers (such as
    CDC, NASA, and USDA).'
