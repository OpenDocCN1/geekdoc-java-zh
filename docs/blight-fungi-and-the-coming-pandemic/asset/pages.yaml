    Yeast (and shmoos)


    The first reports of a rise in *Candida* infections from thrush (caused by yeast
    growing in the mouth and throat) to vaginal infections or, worse, rare fungal
    infections of major internal organs like the heart began in the 1950s. The cause
    was proactively antibiotics. Some have even referred to yeast infections as ""disease
    of antibiotics." For all the benefits of antibiotics (and there are many), the
    powerful drugs can kill off beneficial bacteria in addition to the targeted bacterial
    infection. Broad-spectrum antibiotics encourage fungal overgrowth by killing off
    gut bacteria like *Lactobacillus* and *Bifidobacterium*, which can help keep *Candida*
    species in check. When the numbers of these bacteria decrease, a fungus like *C.
    albicans* has an opportunity to explode. Antibiotics can make us more vulnerable
    to once harmless fungi.


    Fortunately, physicians can proactively treat patients who are on longterm antibiotics
    with antifungals, effectively alternating drugs when they can avoid the emergence
    of resistance. Even with less life-threatening infections, we can work around
    the effects of antibiotics. Although there are many reasons to use yogurt, those
    on antibiotics may benefit from the live cultures of *Lactobacillus acidophilus*.
    Or we might take capsules full of *Saccharomyces boulardii*, a kind of yeast that
    helps maintain the microbial balance. If we can keep our microbiome healthy, there
    is less chance of a hostile microbial takeover.'
