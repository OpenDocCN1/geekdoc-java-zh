  md: 'THE WORLD IS LITTERED WITH YEASTS THAT LIVE ON IN FIREBUGS, apples, rubber
    trees, flowers, soil, mangroves, blue-striped grunts, and myriad other life-forms.
    Of the thousands of species categorized as yeasts, including Candida, most won''t
    harm us. Some yeasts are normal members of our gut microbiome—the community of
    bacteria, viruses, yeasts, and other microbes living in our gut. As most communities,
    members have different roles, and microbiomes are no exception: some microbes
    are beneficial, sharing resources with their neighbors; others are competitive,
    lobbying harmful microbes to prevent consuming their food or moving into their
    patch of gut or skin. Some do their own thing and are neither helpful nor harmful.
    Scientists are only beginning to understand these complex relationships and how
    these microbes influence us. Most disease-causing microbes are not members of
    the human microbiome but outsiders: as an influenza virus; Borrelia burgdorferi,
    the bacterium that causes Lyme disease; or Salmonella, which causes poisoning.
    But sometimes a typically innocuous microbe like Candida, a member of our gut
    flora that tends to live peacefully with us for much of our lives—when given the
    right, or wrong, conditions—can make us sick or even kill us.


    Both C. albicans and C. auris are members of the taxonomic category Ascomycota,
    a sundry group of fungi that includes the eponymous dead-man’s fingers, brain-like
    molds, and delicate elfin fungi. Within the Ascomycota, Candida fall into a smaller
    grouping called Saccharomycina, or yeasts. Some are closely related and collection
    of that as a group has been described as a “wastebasket genus that includes hundreds
    of very unrelated species.” To emphasize the distance between these microbial
    relatives, a scientist told that C. auris and C. albicans are different from one
    another as humans are from fish. What yeasts do have in common is their tendency
    to exist as single cells like bacteria, though with little or no character, which
    makes it difficult to discern one species from another unless uncoased into colonies
    on a petri dish.


    When yeasts reproduce by the millions, colonies eventually appear. Most often,
    yeasts reproduce asexually by budding off clones, doubling their population every
    one hundred minutes or so, a life cycle more like bacteria than fungi. Rarely,
    under certain conditions, yeasts behave like'
