    microbes evolve as a community. They evolve in response to, and some even change,
    their environment: a tree might make more shade or provide shelter, while an abundance
    of algae, microbes, or small mammals might provide food to influence the population
    of other animals. Predators and their prey tend to strike a balance between life
    and death in populations of both actors persist in the typical cycles of boom
    and bust. A rise in prey species grazed down, the predators, benefit of a main
    food source, dwindle. Pathogens and their host sometimes behave likewise. As Darwin
    figuring out the connections between living things and his surroundings from his
    home in the London Borough of Bromley, Europe was experiencing the consequences
    of mixing flora and fauna and microbes by transporting them to places they didn’t
    belong.


    When blight circulating in Europe’s potato fields, Darwin had a crop of his in
    the ground—which, he noted, had turned to rot. He had collected wild potato samples
    from Chile, Ecuador, and elsewhere, and sent samples to botanist friends, including
    his cousin, William Darwin Fox, so they might grow and study them too. When crops
    across Europe began to die, scientists wondered how this could happen pervasively
    and so suddenly. Darwin wondered if those potatoes he collected from Chile might
    be more resilient to disease. At some time, scientists believed that wild potatoes
    or potato seed (compared with the Lumpers dying from blight) collected from the
    tuber’s native lands could help revive Europe’s crops. When blight hit, Fox had
    been growing the Chilean potatoes died. “I fear this decides the point as to the
    usefulness of procuring seed from even the fountain head—the wild stock itself,”
    wrote a defeated Fox. (Although Darwin’s Chilean potatoes died, other wild potatoes
    have more recently been found to resist blight.)'
