  md: 'Still, his work inspired other acclimatization societies, each with its own
    mandate, in Europe, the Americas, Australia, and elsewhere.


    In England a founding member of the society imagined the countryside alive with
    “troops of elands gracefully galloping over the greensward and herds of koodoos.
    The exotic African animals, he believed, would add to the “good food of the British
    Isles and beyond. In 1860 the Acclimatization Society of the British Isles introduced
    swans, starlings, and other birds from Europe to distant colonies. Most societies
    believed they were doing good work, filling the gaps that existed in nature. A
    society in Australia imported California quails, thrushes, and hares. Australian
    magpies and possums were sent from New Zealand. Black swans were sent to Calcutta.
    Brown trout from England pushed out native trout when released into US streams.
    Rainbow trout native to the United States were dropped into waterways in Europe,
    Australia, and the eastern United States. Both trout species are now listed as
    members of the top one hundred globally invasive by the Invasive Species Specialist
    Group of the International Union for Conservation of Nature.


    A few decades of importing and releasing animals where they didn’t belong made
    it increasingly obvious that tinkering with this way was at the very least problematic
    and in some cases disastrous. On farms in the United States starlings ate the
    seed from newly sown crops and pulled up young plants. They pecked at ripening
    berries and peaches and other fruits. The surpass outcompeted native bird species.
    This caught the attention of conservationists and of Iowa representative John
    Lacey. Intent on protecting wildlife, game birds, and agriculturally important
    birds and preventing any further releases of exotic birds and animals, on April
    30, 1900, Lacey introduced legislation to Congress. “There is a compensation in
    the distribution of plants, birds, and animals by the God of nature,” he said
    during the bill’s introduction, adding that the disastrous introductions served
    as a warning to be heeded. “Let us now give an example of wise conservation of
    what remains of the gifts of nature.”


    The so-called Lacey Act was signed into law a month later. It is the nation’s
    oldest legislation for wildlife protection. The original version of the law had
    two purposes: to prevent harm to agricultural interests from foreign species and
    to protect native species by controlling the trade and trafficking'
