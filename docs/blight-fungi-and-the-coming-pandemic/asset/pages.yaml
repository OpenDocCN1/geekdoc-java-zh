  md: 'For much of our existence—our microbiome has helped to keep potentially invasive
    microbes—particularly those already in residence—in check. Most of those microbes
    are bacteria that in both number and diversity have the fungi beat. There is a
    good reason for this: our body temperature. Many bacteria thrive at 37°C (98.6°F),
    the normal human internal temperature, but for many fungi bodies are like Death
    Valley. Most fungi prefer temperatures between 12°C (53.6°F) to 30°C (86°F). We
    mammals simply run too hot. Like a healthy microbiome, our warmth protects us
    from fungal invasion. But some scientists worry that our so-called temperature
    barrier is beginning to fail us.


    ![](img/a879418bf7bcca813d6de126747d7203_17_0.png)


    OVER A DECADE AGO ARTURO CASADEVAL, A MICROBIOLOGIST AND immunologist at Johns
    Hopkins Bloomberg School of Public Health, published a paper posting that fungi
    and their relative intolerance of warm bodies may have enabled the rise of mammals,
    a phenomenon he called the “Fungal Filter.

    Mals make no sense,” he says. “We have to eat so much. Most humans eat four or
    five times a day. This is just the amount of food consumed by other animals on
    the planet. Most of that is to maintain our temperature.” We are high-energy animals,
    and Casadevall argues that something had to select for what would seem like an
    unfavorable metabolism. About sixty-six million years ago mammals were not the
    dominant species; for nearly hundred million years before that, giant sauropods,
    stegosaurs, andopodods like Tyrannosaurus rex ruled Earth. The impact caused the
    extinction of nearly 80 percent of all animal species, from the dinosaurs to marine
    invertebrates.


    The post-asteroid period, according to Casadevall, “was associated with a massive”
    fungal bloom, we know from the fossil records. Any surviving animals would have
    been exposed to fungal spores and potential pathogens.” The limestone, shale,
    and sandstone from deposits laid down hold evidence of more than what once bone.
    The fossil record written into these layers is a memoir of the worms, plants,
    insects, and microscopic specks of life from plant pollen to fungal spores: billions
    and billions of spores. After the cataclysm Earth would have been littered'
