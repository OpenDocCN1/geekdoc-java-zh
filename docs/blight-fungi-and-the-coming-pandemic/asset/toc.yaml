- - '###'
  - 白刺松衰落的故事始于它的表亲
- - '###'
  - 这里的当锈病开始在全国白松林中蔓延时，管理者起初尝试修剪掉受感染的树枝，但真菌继续扩散。对高死亡率感到惊，并担心森林及其商业用途注定覆灭，林业者和科学家转向了不同的疾病控制策略：通过移除其交替宿主——黑醋栗和其他*醋属*（Ribes）植物来阻断锈菌。
- - '###'
  - 这里的全球控制进口植物疾病的努力在过去一个世纪里不断扩大。现在对某些植物有检疫规定，对病原体和昆虫有常规检查。但今天，控制隐藏在苗茎中的微型真菌或叶片下的虫卵是一项艰巨的任务。20世纪90年代，在佛罗里达州、加利福尼亚州和夏威夷鉴定出名为
    *Austropuccinia psidii* 的锈菌。这种真菌感染桃桃科（Myrtaceae）的树木，包括香桃树、肉豆、番石、香桂和桉树等，此外还有数以千计的其他品种。这些常绿芳香产油树木总共有近六千种。已知有数百种是易感性的。与许多锈菌不同，它不需要其他宿主。它能够在单个宿主上产生其所有类型，甚至是有性生殖类型。明亮的硫黄色孢子覆盖在感染植物的叶子和芽上，最终随着真菌剥夺它们的营养而杀死它们。幼树最容易死亡。在过去一个世纪里，*A.
    psidii* 成为全球热点，幸运的是它是通过木材或其他植物产品传播的。在过去的几年里，它的扩散速度加快了。除了这种真菌可能土生的南美洲，没人知道它的起源。
