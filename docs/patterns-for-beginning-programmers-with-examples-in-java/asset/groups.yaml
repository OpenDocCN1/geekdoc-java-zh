    7。使用从 0 开始的编号方案，你可以用 0 表示星期日，用 1 表示星期一，以此类推。那么，如果现在是星期三（即 3），你可以确定 6 天后是星期几：


    ```

    remainder = (3 + 6) % 7;

    ```


    结果是 9 % 7 或 2（星期二）。同样，确定 516 天后是星期几是：


    ```

    remainder = (3 + 516) % 7;

    ```


    结果是 519 % 7 或 1（星期一）。显然，同样的事情可以用于月份。该集合的基数是 12，从 0 开始的编号方案会将一月分配为 0，二月为 1 等。这种模式也可以用于未编号的类别。例如，假设你想知道一个数字是偶数还是奇数（基数为
    2）。让 0 表示偶数，1 表示奇数，你可以判断当前和变化的和是否为奇数：


    ```

    remainder = (current + change) % 2;

    ```


