    # 模式泛化


    出于目前可能并不明显的原因，十六进制（即 16 进制）在计算中经常出现。幸运的是，同样的模式可以适用于其他基数。只需要将 10 替换为所需的基数 $b$ 即可。


    # 位移


    出于希望你已经明白的原因，二进制（即 2 进制）在计算中也非常重要。许多编程语言（包括 Java）包含了 `>>` 和 `<<` 运算符，用于将整数的二进制表示向右或向左移动指定的位数。这些低级运算符在系统编程课程中比应用程序编程课程更相关，但在第
    18 章关于分段/压缩数组的最后将简要提及。


    # 圆上的算术


    当孩子们第一次被教数数时，他们被介绍了数轴的概念。这种方法潜意识里影响了人们思考算术的方式。然而，人们可以在圆上进行算术，事实证明这是解决许多问题的好方法。


    # 动机


    经常，值可以无限增加。例如，如果你有 3 美元，有人不断给你美元，你会有越来越多的美元（当然，取决于法律等）。然而，在某些情况下，值不会一直增加。


    # 复习


