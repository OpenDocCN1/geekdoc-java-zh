    by 4 bits, each of which can contain a 0 or 1. Each of the 4 positions corresponds
    to a power of 2 (i.e., the 1s place, the 2s place, the 4s place, and the 8s place).
    This is illustrated in Figure 10.1 for the 4-bit binary number 1101, which is
    13 in base 10. (If you''re confused, see Figure 3.1 for an example that uses base
    10.)


    ![](img/fc01fd61514199fc6ea175e763677f2b_75_0.png)


    Given this representational scheme, you can use a single non-negative 4-bit integer
    to hold up to four different flags. Then, you can use the &, |, and ^ operators
    to perform bitwise "and", "inclusive or", and "exclusive or" operations on these
    integer values.


