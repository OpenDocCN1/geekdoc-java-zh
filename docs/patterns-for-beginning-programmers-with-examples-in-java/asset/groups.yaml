    +   **Outbound Parameters.** A solution to the problem of needing to return multiple
    pieces of information from a single method.


    +   **Missing Values.** A solution to the problem of distinguishing missing values
    from actual values so that they can be handled differently when performing calculations
    of various kinds.


    +   **Checklists.** A solution to the problem of checking to see whether a specific
    set of criteria (identified at run-time) have been satisfied.


