    in one or more attributes and is able to move in four directions (forward, backward,
    right and left). You clearly need one or more mutator methods to handle the movements.
    Suppose that you decide to use a mutator method for each direction, named moveBackward(),
    moveForward(), moveLeft(), and moveRight().


    If you were not interested in supporting invocation'
