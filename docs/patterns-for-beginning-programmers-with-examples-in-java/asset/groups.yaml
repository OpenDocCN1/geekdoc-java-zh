    # Preface


    My introductory programming courses always start with some loose definitions.
    I define an algorithm as an unambiguous process for solving a problem using a
    finite amount of resources, and a heuristic as solving process that is not guaranteed
    to be perfect/exact or finite. I explain that algorithms/heuristics written for
    a computer are commonly written in languages, called (high-level) programming
    languages, that are easily understood by humans, unambiguous, and easily converted
    into machine-readable form. I point out that an algorithm/heuristic written in
    a programming language is a program (or code), and the process of doing so is
    called programming (or coding), which is what they will be studying for the remainder
    of the term.


    As a practical matter, most introductory programming courses, mine included, using
    a single, specific programming language and, not surprisingly, there is considerable
    debate about which language is best for teaching beginning programmers (or whether
    it matters). However, there is, generally, consensus about the role that the programming
    language and the goals of such courses. Indeed, most introductory programming
    courses make claims like the following:


    - 1. The concepts covered using the particular programming language selected for
    the course are applicable across a wide variety of other programming languages.

    - 2. The course teaches algorithmic thinking more than the syntax of the language(s)
    being used.


    In my experience, these claims are not completely justified. While the first is
    often true from a teaching perspective, it is not true from a learning perspective.
    In other words, students have enormous trouble taking what they have learned in
    one language and applying it in another. The second is an honest description of
    what the instructor wants to cover, but is a goal that is rarely achieved.


    In the worst cases, instructors in introductory programming spend all of their
    time teaching syntax and tools, and leave it to the students to figure out how
    to solve problems. Using concepts from Bloom’s taxonomy of the cognitive domain,
    such courses only teach “remembering” and “understanding,” and expect students
    to “analyze,” “evaluate,” “apply” and “create” on their own.


    In the better cases, instructors in introductory programming courses expose students
    to well-written code containing good solutions to problems and explain why the
    code is good. They, only hope that the students will internalize these solutions
    and be able to apply them in other contexts; these courses only teach “remembering,”
    “understanding,” “analyzing” and “evaluating,” but not “applying” and “creating.”


    In the best cases, instructors in introductory programming courses teach “applying”
    and “creating” as well. That is, they teach problem solving as well as programming.
    This book is designed to make it easier to do so.


    # Teaching Problem Solving with Patterns


    I have had colleagues over the years who have argued that problem solving cannot
    be taught, that students either have the ability or they do not. I and others
    disagree; I believe students can be taught in the following way:


    - 1. Demonstrate that it is possible to classify problems;

    - 2. Provide general solutions for many problems;

    - 3. Help them learn how to evaluate solutions;

    - 4. Help them learn how to adapt an existing solution to a new problem;

    - 5. Ways to determine that a particular pattern is an appropriate solution.


    In the end, this approach provides students with two things: a library of solutions
    they can use and an understanding of how to add to library.


    # Patterns for Beginning Programmers


    This approach has been used successfully (under various names) in upper-level
    courses in software engineering and other engineering disciplines for many years.
    Unfortunately, it has not yet found its way into introductory programming courses.
    This book is an attempt to remedy that shortcoming.


    Two things distinguish programming patterns from other kinds of patterns: the
    problem domain (i.e., programming) and the level of abstraction. Programming patterns
    are at a higher level of abstraction because the concepts are not specific to
    a language (or family). In other words, a programming pattern is not a “turn of
    phrase” (i.e., idiom) in a particular language. Instead, it is a generic solution
    to a problem that might arise in many languages; it is a way of thinking programmatically.
    Programming patterns are at a lower level of abstraction than design patterns
    and architectural styles. In other words, the use of a programming pattern leads
    to the creation of a small fragment of code that will be a part of a larger system,
    whereas the use of a design pattern or architectural style leads to the creation
    of a description of the interactions between the entities in a large system.


    # Questions of Style


    Teaching with patterns necessarily involves evaluating different solutions to
    the same problem, and these solutions can be evaluated using a variety of different
    criteria. This book focuses to focus the criteria that are related to the solution
    without regard to issues of style. For example, a method to identify the maximum
    of two numbers could be implemented in three different ways. In the first, an
    intermediate variable and default initialization is used.


