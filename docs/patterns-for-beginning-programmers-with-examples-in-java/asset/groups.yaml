    \ they run. Your job is to write a program that calculates the number of laps\
    \ that a runner has started and completed given the number of miles run (the measure\
    \ of work) and the number of miles per lap (the amount of work per task).\n\n\
    ## Thinking About the Problem\n\nThe naive approach to finding the number of completions\
    \ is to use division. For example, if a participant has run 7 miles over a 3 mile\
    \ track, then they have run $7/3 = 2$ laps. The obvious shortcomings of this approach\
    \ is that the result isn't an integer and donations are promised per \"whole\"\
    \ lap.\n\nFortunately, you know how to solve this problem. In fact, the example\
    \ itself would bring to mind the notion of doing arithmetic on a circle (or, an\
