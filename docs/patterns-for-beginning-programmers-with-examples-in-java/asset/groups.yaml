    rate += areYoung ? ageSurcharge : 0;\n```\n\nAgain, some people may prefer this\
    \ solution to the one that uses if statements because it is more concise, it is\
    \ less concise than the solution that uses indicator variables.\n\n[7]\n\n# Indicator\
    \ Methods\n\nSometimes the value needed to perform a calculation is known, and\
    \ other times it too must be calculated. This is true of both “traditional” values\
    \ and indicators (of the kind discussed in Chapter 6). This chapter considers\
    \ problems in which an indicator’s value must be calculated before it can be used\
    \ in another expression.\n\n# Motivation\n\nThere's a famous saying among performers,\
    \ “the show must go on”, which means there must be a show whenever there’s an\
    \ audience. In the context of Chapter 6 on indicators, this means that the number\
    \ of seats sold for a particular show must be used to calculate an indicator,\
    \ setting it to 0 when no tickets have been sold and setting it to 1 otherwise.\
    \ This is an example of a threshold indicator in which the threshold is 1.\n\n\
    So, given that some number of tickets has been sold for a particular show time,\
    \ you must determine the number of shows that must be offered at that time (i.e.,\
    \ either 0 or 1). Letting shows denote the number of shows and sold denote the\
    \ number of tickets sold, you want to calculate shows from sold in such a way\
    \ that it takes the value 0 when sold is 0 and it takes on the value 1 for all\
    \ positive values of sold.\n\n# Review\n\nYou could, of course, calculate the\
    \ value of the variable shows as follows:\n\n```java\nif (sold >= 1) {\n    shows\
    \ = 1;\n} else {\n    shows = 0;\n}\n```\n\nHowever, you should also know that\
    \ this is a bad practice, since it is likely that you will need to use this simple\
    \ algorithm in more than one place. Hence, to avoid code duplication, you should\
    \ instead write a method like the following:\n\n```java\npublic static int shows(int\
    \ sold) {\n    if (sold >= 1) {\n        return 1;\n    } else {\n        return\
    \ 0;\n    }\n}\n```\n\nand use it as needed.\n\n# The Pattern\n\nThe entertainment\
    \ example is, obviously, a very particular problem. However, it can be easily\
    \ generalized to. However, the entertainment example is a particular problem in\
    \ which you need to determine whether value exceeds a threshold. Further, the\
    \ entertainment example is a particular problem in which you need to return 0\
    \ or 1 based on the value.\n\n```java\npublic static int indicator(int value,\
    \ int threshold) {\n    if (value >= threshold) {\n        return 1;\n    } else\
    \ {\n        return 0;\n    }\n}\n```\n\n# Examples\n\nIt's useful to consider\
    \ examples of both threshold and other indicators.\n\n# Threshold Indicators\n\
    \nContinuing with the entertainment example, the threshold is 1 (i.e., if the\
    \ size of the audience), the number of shows is given by:\n\n```java\nshows =\
    \ indicator(sold, 1);\n```\n\nReturning to the parking ticket example used in\
    \ Chapter 6, the fine can be calculated as follows:\n\n```java\nbaseFine = 10.00;\n\
    repeatOffenderPenalty = 35.00;\ntotalFine = baseFine + (indicator(priors, 1) *\
    \ repeatOffenderPenalty);\n```\n\nIt is also instructive to return to the car\
    \ rental example from Chapter 6. For this example, you can initialize the necessary\
    \ variables as follows:\n\n```java\nbaseRate = 19.95;\nageSurcharge = 10.00;\n\
    ageThreshold = 25;\nmultiSurcharge = 5.00;\nmultifreshold = 1;\n```\n\nThen, you\
    \ can calculate the rate as follows:\n\n```java\nrate = baseRate\n+ (indicator(age,\
    \ ageThreshold) * ageSurcharge)\n+ (indicator(drivers, multifreshold) * multiSurcharge);\n\
    ```\n\nNotice that, the age surcharge uses an indicator while the multi-driver\
    \ surcharge uses an ordinary threshold indicator.\n\n44 David Bernstein\n\n# Other\
    \ Indicators\n\nAs an example of a more general indicator, consider the following\
    \ method for calculating a person's basic metabolic rate (BMR):\n\n$b = 5.00 +\
    \ 10.00m + 6.25h - 5.00a - 161.00\\delta_f$\n\nwhere $b$ denotes the BMR (in kilocalories\
    \ per day), $m$ denotes the person's mass (in kilograms), $h$ denotes the person's\
    \ height (in centimeters), $a$ denotes the person's age (in years), and $\\delta_f$\
    \ is 1 if the person is female and 0 otherwise.\n\nNow, suppose the double variables\
    \ $m, h,$ and $a$ contain the values of the person's mass, height, and age (respectively),\
    \ and the String variable $s$ contains the person's sex. Then, you would create\
    \ the following indicator method:\n\n```java\npublic static int indicator(char\
