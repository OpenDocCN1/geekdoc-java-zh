    \n## 动机\n\n假设你有一些文本需要显示在控制台上，并相对于它所在的行居中显示。由于控制台（通常）使用等宽字体，每个字符的宽度（以像素为单位）都是相同的。因此，文本的宽度和行的宽度可以用字符数来衡量。那么，你的目标就是确定包含文本第一个字符的行列号。\n\
