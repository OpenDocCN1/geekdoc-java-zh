    # Thinking About The Problem


    When domain experts think about the blurring problem, they think about calculating
    the weighted average of the elements that are near a center element. Exactly what
    this means with the domain and the dimensionality of the data.


    For an array (e.g., a sequence of amplitude measurements from a discretized sound
    wave), each element is identified by a single index. So, you need one value to
    represent the center of the neighborhood and one (odd) value to represent the
    size of the neighborhood.


    For a rectangular array of arrays (e.g., a raster/grid of color measurements),
    each element is identified by two indexes, commonly called the row index and column
    index. So, you need two integer values to represent the center of the neighborhood.
    Then, if you limit yourself to square neighborhoods (as is common), the size of
    the neighborhood can be represented by a single (odd) integer.


    # The Pattern


    As in the subarray pattern of Chapter 19, you need to add formal parameters to
    the signature of the method you are concerned with. Methods that are passed an
    array will have two additional parameters (the index and the size), and methods
    that are passed an array of arrays will have three additional parameters (the
    row index, col index, and size).


    Also in the subarrays pattern, you need to calculate the bounds on the loop control
    variables. While this was quite simple for subarrays, for neighborhoods it''s
    a little more complicated. Returning to Figure 20.1 and Figure 20.2, you can see
    that you want to have the same number of elements on both sides of the center
    element. Using integer division, this means'
