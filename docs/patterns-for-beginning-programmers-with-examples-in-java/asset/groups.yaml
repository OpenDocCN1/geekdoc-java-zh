    # 62 David Bernstein


    ```

    int inventory;

    inventory = 0;

    ```


    When the player acquires an individual item, you can use the bitwise “or” operator
    to adjust the inventory. For example, suppose the player acquires WATER. You can
    use the updating pattern from Chapter 1 as follows:


    ```

    inventory = inventory | WATER;

    ```


    At this point, the variable inventory contains the value 16. But, what’s important
    is that the bit corresponding to “having water” is set.


    Suppose the player later acquires SPELL. You can handle this as follows (using
    the compound assignment operator in this case, to illustrate its use):


    ```

    inventory |= SPELL;

    ```


    At this point, the variable inventory contains the value 18. Again, what’s important
    is that the bits corresponding to “having spell” and “having water” are set.


    You can then check to see if the bit corresponding to “having water” is set as
    follows:


    ```

    boolean hasWater = (inventory & WATER) > 0;

    ```


    Note that either the allOf() algorithm or the any() algorithm would work in this
    case, since the mask is composite.


    Similarly, you can then check to see if the bit corresponding to “having a potion”
    is set as follows:


    ```

    boolean hasPotion = (inventory & POTION) > 0;

    ```


    When the player drinks the water, you can clear that bit as follows:


    ```

    inventory = inventory & (WATER ^ Integer.MAX_VALUE);

    ```


    Here, since Integer.MAX_VALUE is an int in which every bit (except for the sign
    bit), the result of (WATER ^ Integer.MAX_VALUE) is a mask in which all of the
    bits of WATER (except the sign bit) have been toggled. This is easy to see using
    8-bit int values as follows:'
  - '[PAGE 79]


    # 00010000


    01111111


    01101111


    So, since the bit that corresponds to water in this new mask is 0, The bitwise
    & of inventory with this new mask will clear the bit that corresponds to water
    in the result.


    # Some Warnings


    Note that beginning programmers commonly use the wrong bitwise operator when creating
    composite masks. This is because they tend to describe the process as setting
    one bit and another bit. However, if you take the bitwise & of two simple masks,
    the result will always be zero. For example, consider the 8-bit representations
    of the mask for water. Suppose you want to create a composite mask to determine
    if the player has both food and water. If you create the mask using the bitwise
    & operator, you get the following:


    ```

    00000001

    & 00010000

    00000000

    ```


    If, instead, you use the bitwise | operator, you get the desired result, as follows:


    ```

    00000001

    | 00010000

    00010001

    ```


    Note that beginning programmers also make the same mistake when updating the variable
    that contains the current state. Again, using 8-bit representations, suppose the
    player has water. Then inventory will be 00010000. When the player later acquires
    the spell, you must use the bitwise | operator as follows:'
  - '[PAGE 80]


    # 00010000

    | 00000010

    00010010


    If you used the bitwise & operator (thinking the player has water and the spell),
    you would wind up with nothing in inventory. This can be shown as follows:


    ```

    00010000

    & 00000010

    00000000

    ```


    # Looking Ahead


    At this point, it is sufficient to think that integer values are represented in
    a specified number of bits with the left-most bit indicating the sign (0 for positive
    values and 1 for negative values). In fact, this is not the representational scheme
    that is used most commonly. One easily understood problem with such a scheme is
    there are two different representations of zero. Using eight bits, this has positive
    zero (00000000) and negative zero (i.e., 10000000). When you take a deeper look
    at data types, you will learn that the most common representation of integers
    is a system called two’s complement. This system essentially works like an odometer,
    with a single zero (00000000) that rolls up to the first integer (i.e., 00000001)
    and rolls back to the first integer (i.e., 11111111). This means there is one
    more negative number than there are positive numbers. Fortunately, the left-most
    bit of all negative numbers is still 1 and the left-most bit of all positive numbers
    is still 0.


    If, in the future, you take a course on data structures and algorithms you may
    also learn about the BitSet class which allows the number of flags to “grow”.
    In particular, you may consider the time and space efficiency of providing this
    functionality.'
- md: "\n[11]\n\n## Digit Counting\n\nThere are many situations in which a program\
    \ needs to know the number of digits in an int. Unfortunately, int variables don't\
    \ have properties other than their value. In other words, anthropomorphizing a\
    \ little, int variables don't know anything about themselves. This chapter considers\
    \ solutions to this problem given this observation.\n\n## Motivation\n\nAs you\
    \ know from Chapter 3 on digit manipulation, in order to drop or extract digits\
    \ from the left side of an integer, you needed to know the number of digits in\
    \ the number. The examples in that chapter, the number of digits was known. Unfortunately,\
    \ that isn't always the case. For example, credit card account numbers might have\
    \ between six and nine digits. The problem, then, is of determining the number\
    \ of digits in a number.\n\n## Review\n\nAs you also know from Chapter 3 on digit\
    \ manipulation, the position of a digit corresponds to a particular power of 10.\
    \ Specifically, the digit in position $n$ (counting from the right, starting with\
    \ 0) corresponds to the $10^n$ place. For example, position 2 corresponds to the\
    \ $10^2$ or $100s$ place. To count digits you need to be able to invert the process.\
    \ For example, to count a three-digit number, you need to find the position that\
    \ the $100s$ place corresponds to.\n\nAs hopefully recall, this is the domain\
    \ of the logarithm. In a decimal (i.e., base 10) representation, the $\\log_{10}(x)$\
    \ is often described as the value of $n$ that 10 must be raised to in order to\
    \ get $x$. More formally, $\\log_{10}(x)$ is the value of $n$ that satisfies $x\
    \ = 10^n$. So, returning to our example, the position of the $100s$ place corresponds\
    \ to $\\log_{10}(100)$, which is 2 (since $10^2$ is 100). More generally, $\\\
    log_b(x)$ is the value of $n$ that satisfies $x = b^n$, where $b$ is referred\
    \ to as the base (or radix) of the logarithm.\n\n## Thinking About The Problem\n\
    \nEvaluating $\\log_{10}(x)$ can be quite difficult, in general. However, it is\
    \ easy to find bounds. For example, since $\\log_{10}(100)$ is 2 and $\\log_{10}(1000)$\
    \ is 3 (and logarithms are monotonic) it follows that $\\log_{10}(x)$ is in the\
    \ interval $x \\in [100, 1000]$. This means that the $\\log_{10}$ of any three-digit\
    \ number is in $[2, 3]$ and that the $\\log_{10}$ of any four-digit number is\
    \ in $[3, 4]$. For example:\n\n- $\\log_{10}(7198)$ evaluates to approximately\
    \ $3.857218423168926$ which, as expected, is in the interval $[3, 4]$.\n- $\\\
    log_{10}(462)$ evaluates to approximately $2.6646419755561257$ which, as expected,\
    \ is in the interval $[2, 3]$.\n- $\\log_{10}(10000)$ evaluates to $5.0$ which,\
    \ as expected, is in the interval $[5, 6]$.\n\n## The Pattern\n\nMore generally,\
    \ the $\\log_{10}$ of any $n$-digit number will be in the interval $[n - 1, n)$,\
    \ which means it will be greater than equal to $n - 1$ and strictly less than\
    \ $n$. Hence, the integer part of $\\log_{10}$ of any $n$-digit number will be\
    \ $n - 1$. So, the number of digits in the number $x$ is given by:\n\n```\npublic\
    \ static int digits(int x) {\n    return (int) Math.log10(x) + 1;\n}\n```\n\n\
    ## Examples\n\nReturning to the credit card example, suppose that the account\
    \ number is as follows:\n\n```\ncardNumber = 412831758;\n```\n\nThen, you can\
    \ find the number of digits in the account number as follows:\n\n```\nn = digits(cardNumber);\n\
    ```\n\nNow, as you know from Chapter 3, if you want to extract the left-most three\
    \ digits (i.e., prefix), you need to drop the rightmost $n-3$ digits. This involves\
    \ dividing by ten to the power of $n-3$, which you can implement as follows:\n\
    \n```\nprefix = cardNumber / (int) Math.pow(10, n - 3);\n```\n\n```\nsuffix =\
    \ 56720;\n```\n\nyou can then figure out the number of digits in that variable\
    \ as follows:\n\n```\ndigits = digits(suffix);\n```\n\n## Looking Ahead\n\nWith\
    \ the digit manipulation pattern of Chapter 3, this pattern can be used with other\
    \ representation schemes (i.e., other bases). All that is needed is to replace\
    \ 10 with the desired base. Fortunately, it is easy to calculate the logarithm\
    \ in one base given the ability to calculate $\\log_{10}(x)$ (e.g., Math.log10()\
    \ in Java):\n\n$\\log_{a}(x) = \\frac{\\log_{10}(x)}{\\log_{10}(a)}$ whenever\
    \ $x > 0$.\n\n## Warning\n\nNotice that the truncation pattern from Chapter 5\
    \ is not used in this pattern. Instead, typecasting is used to get the integer\
    \ part of the value returned by Math.log10(). This is because Math.log10() returns\
    \ a double, and the truncation pattern is for truncating integers.\n\n## PART\
    \ III\nPatterns Requiring Knowledge of Loops, Arrays, and I/O\n\nPart III contains\
    \ programming patterns that require understanding of loops, one-dimensional arrays,\
    \ and console/output. Specifically, this part of the book contains the following:\n\
    \n- **Reprompting.** Solutions to the problem of prompting a user for input until\
    \ they provide a valid response.\n- **Accumulators.** Solutions to problems that\
    \ require one (or a few) calculations.\n- **Accumulator Arrays.** Solutions to\
    \ problems that require multiple, related calculations.\n- **Lookup Arrays.**\
    \ Solutions to problems that involve finding values associated with a key, when\
    \ the key has special properties.\n- **Interval Membership.** Solution to problems\
    \ that involve finding the interval that contains a particular value.\n- **Conformal\
    \ Arrays.** Solution to the problem of organizing multiple pieces of information\
    \ that have a common key.\n- **Segmented Arrays.** Solution to the problem of\
    \ organizing multiple pieces of information of the same type.\n\nLookup arrays\
    \ and interval membership both use less-obvious ways to solve problems of various\
    \ kinds. They are interesting in their own right, because they help you think\
    \ about novel ways to use arrays. Conformal arrays and segmented arrays are ways\
    \ to organize data commonly in languages that don't support object-oriented programming,\
    \ and, as a result, they often find their way into programs written in object-oriented\
    \ languages. They also provide an interesting contrast to objects/classes, which\
    \ can be used to solve problems of this kind.\n\n## Reprompting\n\nPrograms that\
    \ use the console (sometimes called command-line programs) frequently need to\
    \ prompt the user for input, validate the input, and reprompt if the input is\
    \ invalid. There are many different ways to accomplish these tasks, but with all\
    \ the problems discussed so far, there are better and worse ways to do so.\n\n\
    ## Motivation\n\nSuppose you must write a program that prompts the user to enter\
    \ their age and then retrieves response. Since the user might make a mistake and\
    \ enter a negative value, your program must check the user's response and reprompt\
    \ them if they've made a mistake.\n\nThe phrase \"if they've made a mistake\"\
    \ might lead you to use a statement to deal with this situation. In other words,\
    \ you might be led to think the solution is something like the following (in pseudocode):\n\
    \n```\nPrompt the user to enter their age;\nRead the user's response;\nAssign\
    \ the response to the variable named age;\n\nif (age is negative) {\n  Prompt\
    \ the user to enter their age;\n  Read the user's response;\n  Assign the response\
    \ to the variable named age;\n}\nUse the variable named age;\n```\n\nYou would\
    \ then test your program, see it works correctly, and deploy it. Unfortunately,\
    \ at some point, the user will probably enter an invalid response to both prompts,\
    \ and the program will fail (in one way or another).\n\nBecause beginning programmers\
    \ tend to get locked into a particular solution, you might then \"correct\" the\
    \ code as follows:\n\n```\nPrompt the user to enter their age;\nRead the user's\
    \ response;\nAssign the response to the variable named age;\n\nif (age is negative)\
    \ {\n  Prompt the user to enter their age;\n  Read the user's response;\n  Assign\
    \ the response to the variable named age;\n\n  if (age is negative) {\n    Prompt\
    \ the user to enter their age;\n    Read the response;\n    Assign the response\
    \ to the variable named age;\n  }\n}\nUse the variable named age;\n```\n\nOf course,\
    \ this doesn’t correct the defect at all. That is, this code will only work for\
    \ two or fewer invalid responses, and there is no limit on the number of times\
    \ that the user can enter an invalid response.\n\n## Review\n\nWhat you need is\
    \ a way to repeat a block of code an indefinite number of times (i.e., until the\
    \ user enters a valid response). The phrase “repeat a block of code” should immediately\
    \ bring to mind a loop of some kind. The phrase “an indefinite number of times”\
    \ should bring to mind a while or do loop. In other words, you are already halfway\
    \ to a solution.\n\nAs you know, a while loop is appropriate if the body isn’t\
    \ executed, and a do loop is appropriate if the body must be executed at least\
    \ once. So, you might be thinking that the solution to the reprompting problem\
    \ involves a while loop.\n"
  mdcn: "\n\n[11]\n\n## 数字位数计数\n\n在许多情况下，程序需要知道一个 `int` 的数字位数。遗憾的是，`int` 变量除了值之外没有其他属性。换句话说，稍微拟人化一点，`int`\
    \ 变量对自身一无所知。本章将根据这一观察结果考虑解决该问题的方案。\n\n## 动机\n\n正如你在第 3 章“数字操作”中所学习的样，为了丢弃或提取整数左侧的数字，你需要知道该数字的位数。在该章的示例中，位数是已知的。遗憾的是，情况并非如此。例如，信用卡账号可能在\
    \ 6 到 9 位之间。因此，问题在于如何确定一个数字的位数。\n\n## 复习\n\n正如你从第 3 章“数字操作”中所了解的样，数字的位置对应于 10\
    \ 的某个幂。具体来说，位置 $n$ 上的数字（从右侧计数，从 0 开始）对应 $10^n$ 位。例如，位置 2 对应 $10^2$ 位或 100 位。要计算位数，你需要能够反转这个过程。例如，为了计算一个三位数，你需要找到\
    \ 100 位对应的位置。\n\n希望你还记得，这是对数的领域。在十进制（即基数为 10）表示法中，$\\log_{10}(x)$ 通常被描述为：为了得到\
    \ $x$，10 必须升起的幂 $n$。更正式地说，$\\log_{10}(x)$ 是满足方程 $x = 10^n$ 的 $n$ 值。回到我们的例子，100\
    \ 位的位置对应 $\\log_{10}(100)$，结果为 2（因为 $10^2$ 是 100）。更一般地说，$\\log_b(x)$ 是满足方程 $x\
    \ = b^n$ 的 $n$ 值，其中 $b$ 被称为对数的底。\n\n## 思考该问题\n\n通常情况下，计算 $\\log_{10}(x)$ 可能非常困难。然而，找到边界是很容易。例如，由于\
    \ $\\log_{10}(100)$ 是 2 且 $\\log_{10}(1000)$ 是 3（且对数是单调的），因此得出 $\\log_{10}(x)$\
    \ 位于区间 $x \\in [100, 1000]$ 之间。这意味着任何三位数的 $\\log_{10}$ 都在 $[2, 3]$ 之间，任何四位数的 $\\\
    log_{10}$ 都在 $[3, 4]$ 之间。例如：\n\n- $\\log_{10}(7198)$ 的计算结果约为 $3.857218423168926$，正如预期的，它在区间\
    \ $[3, 4]$ 内。\n- $\\log_{10}(462)$ 的计算结果约为 $2.6646419755561257$，正如预期的，它在区间 $[2,\
    \ 3]$ 内。\n- $\\log_{10}(10000)$ 的计算结果为 $5.0$，正如预期的，它在区间 $[5, 6]$ 内。\n\n## 模式\n\
    \n更一般地说，任何 $n$ 位数的 $\\log_{10}$ 都在区间 $[n - 1, n)$，这意味着它大于等于 $n - 1$ 且严格小于 $n$。因此，任何\
    \ $n$ 位数的 $\\log_{10}$ 的整数部分将是 $n - 1$。所以，数字 $x$ 的位数由以下公式给出：\n\n```\npublic static\
    \ int digits(int x) {\n    return (int) Math.log10(x) + 1;\n}\n```\n\n## 示例\n\n\
    回到信用卡示例，假设账号如下：\n\n```\ncardNumber = 412831758;\n```\n\n那么你可以如下所示找到账号的位数：\n\n\
    ```\nn = digits(cardNumber);\n```\n\n现在，正如你在第 3 章中所学的，如果你想提取最左边的三位（即前缀），你需要丢弃右侧的\
    \ $n-3$ 位数字。这涉及到除以 10 的 $n-3$ 次，你可以这样实现：\n\n```\nprefix = cardNumber / (int) Math.pow(10,\
    \ n - 3);\n```\n\n```\nsuffix = 56720;\n```\n\n然后你可以按照如下方法计算该变量的位数：\n\n```\ndigits\
    \ = digits(suffix);\n```\n\n## 展望\n\n有了第 3 章的数字操作模式，该模式可以用于其他表示方案（即其他基数）。我们只需要将\
    \ 10 替换为所需的基数。幸运的是，在能够计算 $\\log_{10}(x)$ 的情况下，计算某个基数下的对数是非常容易的（例如 Java 中的 `Math.log10()`）：\n\
    \n$\\log_{a}(x) = \\frac{\\log_{10}(x)}{\\log_{10}(a)}$，只要 $x > 0$。\n\n## 警告\n\
    \n注意，第 5 章中的截断模式没有在此模式中使用。相反，使用了类型转换来获取 `Math.log10()` 返回值的整数部分。这是因为 `Math.log10()`\
    \ 返回的是浮点数。\n\n"
