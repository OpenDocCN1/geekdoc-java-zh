    ''C'', the memory location identified by swordBetty contains the character ''D'',
    and the memory location identified by temp doesn''t contain anything (or contains
    “garbage”, depending on your perspective). This is illustrated in Figure 2.4a.


    ![](img/fc01fd61514199fc6ea175e763677f2b_30_0.png)


    In step 1, the contents of swordAlice is assigned to temp. Hence, both temp and
    swordAlice now contain ''C''. The assignment statement and its result are illustrated
    in Figure 2.4b. In step 2, the contents of swordBetty is assigned to swordAlice.
    Hence, both swordAlice and swordBetty now contain a ''D''. The assignment statement
