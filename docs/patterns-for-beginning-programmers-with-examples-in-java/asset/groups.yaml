    Second, remember that a variable can hold only one "thing" (either a value or
    a reference, depending on the type of the variable). So, the statements in the
    following fragment:


    ```java

    swordOfAlice = swordOfBetty;

    swordOfBetty = swordOfAlice;

    ```


