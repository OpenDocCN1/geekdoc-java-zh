- md: "\n# Outbound Parameters\n\nThough it is not always discussed in introductory\
    \ programming courses, parameters can be used to pass information to a method\
    \ (i.e., inbound parameters), to pass information from a method (i.e., outbound\
    \ parameters), or to do both (i.e., in-out parameters). While some programming\
    \ languages make this explicit, Java does not.\n\n# Motivation\n\nIn Java, a method\
    \ can only return a single value or reference, and this is sometimes inconvenient.\
    \ Suppose, for example, you want to write a method that is passed a `double[]`\
    \ and returns both the maximum value and the minimum value. One way to achieve\
    \ the desired result is to construct and return a `double[]` that contains two\
    \ elements, the maximum and the minimum. Another way to achieve the desired result\
    \ is to create a class called `Range` that contains two attributes, the minimum\
    \ and maximum, and construct and return an instance of it. This chapter considers\
    \ a third approach — outbound parameters.\n\n# Review\n\nIn order to understand\
    \ the use of outbound parameters in Java, it is critical to understand *parameter\
    \ passing*. In particular, it is critical to understand that Java passes all parameters\
    \ by value. This means that the formal parameter (sometimes called the parameter)\
    \ is, in fact, a copy of the actual parameter (sometimes called the argument).\
    \ This is important because it means that, though a method can change the formal\
    \ parameter, it can't change the actual parameter.\n\n# Thinking About The Problem\n\
    \nAt first glance, this might make you think that it is impossible to have outbound\
    \ parameters in Java. However, when a parameter is a reference type, even though\
    \ the formal parameter is a copy of the actual parameter, the formal and actual\
    \ parameters refer to the same object. That is, they are aliases. Hence, if the\
    \ object is mutable, a method can change the attributes of that object.\n\nWith\
    \ this in mind, there are three different situations to consider, corresponding\
    \ to the need to pass each of the following:\n\n- 1. A mutable reference type;\n\
    - 2. A value type; or\n- 3. An immutable reference type.\n\nEach situation must\
    \ be handled slightly differently. In this case, the method simply changes the\
    \ attributes of the outbound formal parameter (which is an alias for the actual\
    \ parameter).\n\nThe second situation is slightly more complicated. In this case,\
    \ changing the formal parameter has no impact on the actual parameter. What you'd\
    \ like to do is, somehow \"convert\" the value type to a reference type. While\
    \ this isn't possible, you can, create a wrapper class, that serves the same purpose.\
    \ For example, if you want to have an outbound int parameter then you write an\
    \ IntWrapper class like the following:\n\n```java\npublic class IntWrapper {\n\
    \    private int wrapped;\n\n    public IntWrapper() {\n        set(0);\n    }\n\
    \n    public IntWrapper(int i) {\n        set(i);\n    }\n\n    public int get()\
    \ {\n        return wrapped;\n    }\n\n    public void set(int i) {\n        wrapped\
    \ = i;\n    }\n}\n```\n\nThe third situation is more like the second than the\
    \ first. Since the parameter is immutable, even though the formal parameter is\
    \ an alias, there is no way to change the attributes of the object being referred\
    \ to. Hence, you must again create a wrapper class. For example, if you want to\
    \ have an outbound Color parameter (which is immutable) then you write a ColorWrapper\
    \ class like the following:\n\n```java\nimport java.awt.Color;\n\npublic class\
    \ ColorWrapper {\n    private Color wrapped;\n\n    public ColorWrapper() {\n\
    \        set(null);\n    }\n\n    public ColorWrapper(Color c) {\n        set(c);\n\
    \    }\n\n    public Color get() {\n        return wrapped;\n    }\n\n    public\
    \ void set(Color c) {\n        wrapped = c;\n    }\n}\n```\n\n# The Pattern\n\n\
    What of all this means is to make use of this pattern you must complete several\
    \ steps.\n\n- 1. Write a wrapper class if necessary;\n- 2. Declare a method with\
    \ an appropriate signature;\n- 3. (See below);\n- 4. Perform the necessary operations\
    \ in the body of the method; and\n- 5. Modify the attributes of the outbound parameter.\n\
    \nTo use the pattern in this form, the invoker of the method must then construct\
    \ an \"empty\" instance of the outbound parameter and pass it to the method. When\
    \ the method returns, the values of the outbound parameter will have been set,\
    \ and the invoker can make use of it.\n\nThe solution can be improved by giving\
    \ the invoker the flexibility to use either an outbound parameter for the result\
    \ or to return the result. The invoker can signal its preference by passing either\
    \ an empty/uninitialized outbound object or null. In the latter case, the method\
    \ will construct an instance of the outbound parameter, modify it, and return\
    \ it. In the former case, the method will modify the given outbound parameter,\
    \ and return it (for consistency).\n\nThis leads to the following additional steps\
