    \ to store the running total, rather than their brain. This is exactly the same\
    \ technique that you need to use when writing a program for this purpose. That\
    \ is, you need a variable, called an accumulator, to store the running total.\n\
    \n# The Pattern\n\nThe accumulator pattern involves declaring a variable of appropriate\
    \ type in which the running value can be stored, initializing this variable to\
    \ an appropriate value, and then using the updating pattern from Chapter 1 to\
