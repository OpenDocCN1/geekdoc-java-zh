- md: "\n# [PART VI]:\nPatterns Requiring Knowledge of References\n\nPart VI contains\
    \ programming patterns that require understanding of objects and references, and\
    \ parameter passing. Specifically, this part of the book contains the following\
    \ programming patterns:\n\n- **Chained Mutators.** A solution to the problem of\
    \ invoking multiple different methods on the same object, one right after another.\n\
    \n- **Outbound Parameters.** A solution to the problem of needing to return multiple\
    \ pieces of information from a single method.\n\n- **Missing Values.** A solution\
    \ to the problem of distinguishing missing values from actual values so that they\
    \ can be handled differently when performing calculations of various kinds.\n\n\
    - **Checklists.** A solution to the problem of checking to see whether a specific\
    \ set of criteria (identified at run-time) have been satisfied.\n\nThe chained\
    \ mutators pattern involves the return of a reference, while the outbound parameters\
    \ involves passing references. The missing values pattern takes advantage of the\
    \ “special” reference null. Finally, the checklists pattern is a generalization\
    \ of the bit flags pattern that allows for the set of criteria to be created dynamically\
    \ (i.e., at run-time).\n\n# Chained Mutators\n\nE samples abound in which a method\
    \ is invoked on the value returned by another method without assigning the returned\
    \ value to an intermediate variable. Opinions differ, among programmers at all\
    \ levels, about the efficacy of this practice. Nonetheless, it is quite common.\
    \ Hence, it is important to consider how this behavior can be taken into account\
    \ when implementing methods that might be chained in this way.\n\n# Motivation\n\
    \nSuppose you need to construct an email address from a String variable named\
    \ user containing the user's name and a String variable named university containing\
    \ the university's name. Suppose, further, for efficiency reasons you want to\
    \ use a StringBuilder rather than String concatenation.\nWay to implement this\
    \ is as follows:\n\n```\nStringBuilder sb = new StringBuilder();\nsb.append(user);\n\
    sb.append(\"@\");\nsb.append(university);\nsb.append(\".edu\");\n```\n\nIn this\
    \ implementation, each call to append() simply modifies the state of the StringBuilder\
    \ as required.\nWhile this works, it is somewhat messier than using String concatenation,\
    \ because it requires multiple statements. What you might like to do, instead,\
    \ take advantage of the efficiency of the StringBuilder class without the added\
    \ messiness. In principal, you could accomplish this using invocation chaining\
    \ as follows:\n\n```\nStringBuilder sb = new StringBuilder();\nsb.append(user).append(\"\
    @\").append(university).append(\".\");\n```\n\nHowever, this will only work if\
    \ the append() method implemented with this kind of functionality in mind.\n\n\
    # Review\n\nNow, consider a different, but related, example. Suppose you are working\
    \ with a File object that encapsulates the current working directory, and you\
    \ want to know how many characters are in its name. This can be accomplished as\
    \ follows:\n\n```\ncwd = new File(\"\");\nString path = cwd.getCanonicalPath();\n\
    int length = path.length();\n```\n\nHowever, there's no need for the intermediate\
    \ variable path, many people prefer the following chained implementation:\n\n\
    ```\nlength = new File(\"\");\nlength = cwd.getCanonicalPath().length();\n```\n\
    \nThis chained implementation works because the getCanonicalPath() method in the\
    \ File class returns (and evaluates to) a String object, and the String class\
    \ has a length() method.\n\n# Thinking About The Problem\n\nThough they are similar\
    \ on the surface, the email example and the path example are quite different.\
    \ In the path example, the methods do not change the state of their owning objects.\
    \ That is, the getCanonicalPath() method is an accessor not a mutator (i.e., it\
    \ does not change the state of its File object, it returns a String object) and\
    \ the length() method is also an accessor not a mutator (i.e., it does not change\
    \ the state of its String example, it returns an int). On the other hand, in the\
    \ email example, the append() method changes the state of its StringBuilder (i.e.,\
    \ it is a mutator and does not need to return anything).\n\nSo, it is easy to\
    \ see why you can use invocation chaining in the path example, it does not seem\
    \ like you should be able to do in the email example. Indeed, in order for you\
    \ to be able to use invocation chaining in the path example, the append() method\
    \ must return the StringBuilder that it is modifying.\n\n# The Pattern\n\nThis\
    \ motivating example can be generalized to create a pattern that solves the chained\
    \ mutator problem. Specifically, if you want to be able to use invocation chaining\
    \ to change an object, then the mutator methods that are to be chained returning\
    \ that a subsequent method in the chain can be invoked on. But, it can't return\
    \ anything; it must return an object of the appropriate type (i.e., an object\
    \ of the same type as the owning object). But, even that isn't enough — it must\
    \ actually return the owning object itself. That is, the mutator must return the\
    \ reference to the owning object, this.\n\nThe StringBuilder class uses this,\
    \ for exactly this reason. The methods append(), delete(), insert(), replace(),\
    \ and reverse() all return so that their invocations can be chained. So, in the\
    \ example, sb.append(user) returns this (i.e., a reference to sb), append(\"@\"\
    ) is then invoked on sb, and so on.\n\n# An Example\n\nSuppose you want to create\
    \ an encapsulation of a Robot that keeps its location in one or more attributes\
    \ and is able to move in four directions (forward, backward, right and left).\
    \ You clearly need one or more mutator methods to handle the movements. Suppose\
    \ that you decide to use a mutator method for each direction, named moveBackward(),\
    \ moveForward(), moveLeft(), and moveRight(). If you were not interested in supporting\
    \ invocation chaining then these methods would be void (i.e., they would not return\
    \ anything), and they could be used as in the following example:\n\n```\nRobot\
    \ bender = new Robot();moveForward();moveRight();moveForward();\n```\n\nHowever,\
    \ if you are interested in invocation chaining, these methods must, instead, return\
    \ a reference to the owning object, as in the following implementation:\n\n```\n\
    public class Robot {\n    private int x, y;\n\n    public Robot() {\n        x\
    \ = 0; y = 0;\n    }\n\n    public Robot moveBackward() {\n        y--;\n    \
    \    return this;\n    }\n\n    public Robot moveForward() {\n        y++;\n \
    \       return this;\n    }\n\n    public Robot moveLeft() {\n        x--;\n \
    \       return this;\n    }\n\n    public Robot moveRight() {\n        x++;\n\
    \        return this;\n    }\n\n    public String toString() {\n        return\
    \ String.format(\"I am at (%d, %d).\", x, y);\n    }\n}\n```\n\nYou can use this\
    \ object as follows:\n\n```\nRobot bender = new Robot();moveForward().moveForward().moveRight().moveForward();\n\
    ```\n\nMany people think the chained invocation is much more convenient than having\
    \ to use a separate statement for each movement. If, however, you want to have\
    \ a separate statement for movement you can; just ignore the return value (as\
    \ in the original example). In other words, providing the ability to chain invocations\
    \ has no disadvantages, only advantages.\n\n# A Warning\n\nIt is very important\
    \ to document chainable mutator methods, and methods that look like chainable\
    \ mutator methods, carefully. This need is made apparent by the String and StringBuilder\
    \ classes.\n\nFor example, the toString() and to() methods in the String class\
    \ easily be mistaken for mutators. In fact, if you didn't know that String objects\
    \ were immutable, you would almost certainly think this was the case. The clue\
    \ that they are not mutators is the fact that they return String object is a clue\
    \ that they construct a new String object from the owning String object and return\
    \ the new.\n\nAs another example, the Color class has brighter() and darker()\
    \ methods that you might think, from their names, are mutators. Again, however,\
    \ Color objects are immutable, and one clue is that these methods return Color\
    \ objects.\n\nHowever, it is important not to over-generalize. As you've seen,\
    \ many mutator methods in the StringBuilder class return StringBuilder objects.\
    \ In this case, it is to support invocation chaining. The only way to know is\
    \ to read the documentation.\n\nSo, it is very important to carefully document\
    \ methods in imutable classes that might appear to be mutators and mutators in\
    \ mutable classes that support invocation chaining. it is easy to make inappropriate\
    \ assumptions about the way an object will behave, based only on method signatures.\
    \ The only way to prevent the problems that arise from such assumptions is to\
    \ document the code.\n"
  mdcn: "\n\n# [第六部分]:\n需要引用知识的模式\n\n第六部分包含了需要理解对象、引用以及参数传递的编程模式。具体来说，本书的部分包含了以下编程模式：\n\
    \n-   **链式变异器（Chained Mutators）。** 解决在同一个对象上连续调用多个不同方法的问题的解决方案。\n\n-   **输出参数（Outbound\
    \ Parameters）。** 解决从单个方法中返回多个信息片段问题的解决方案。\n\n-   **缺失值（Missing Values）。** 解决区分缺失值与实际值的问题，以便在进行各种计算时能够对它们进行不同的处理。\n\
    \n-   **检查列表（Checklists）。** 解决检查是否满足一组特定标准（在运行时识别）的问题的解决方案。\n\n链式变异器模式涉及引用的返回，而输出参数涉及引用的传递。缺失值模式利用了“特殊”引用\
    \ `null`。最后，检查列表模式是位标志（bit flags）模式的推广，它允许动态地创建标准准集（即在运行时创建）。\n\n# 链式变异器\n\n在许多示例中，我们直接在另一个方法的返回值上调用一个方法，而没有将返回值赋值给中间变量。对于各个水平的程序员对这种做法的有效性存在不同意见。尽管，它是非常常见的。因此，在实现可能以这种方式链式的方法时，考虑如何应对这种行为是非常重要的。\n\
    \n# 动机\n\n假设你需要从一个名为 `user` 的 String 变量（包含用户名）和一个名为 `university` 的 String 变量（包含大学名称）构造一个电子邮件地址。此外，出于效率考虑，你想使用\
    \ `StringBuilder` 而不是字符串拼接。\n实现这种方法如下：\n\n```\nStringBuilder sb = new StringBuilder();\n\
    sb.append(user);\nsb.append(\"@\");\nsb.append(university);\nsb.append(\".edu\"\
    );\n```\n\n在此实现中，每次调用 `append()` 只是根据需要修改 `StringBuilder` 的状态。\n虽然这种方法可行，但它比使用字符串拼接稍微杂乱，因为需要多条语句。你可能更希望在不增加额外复杂性的情况下，利用\
    \ `StringBuilder` 类的效率。原则上，你可以通过如下的调用链来实现这一点：\n\n```\nStringBuilder sb = new StringBuilder();\n\
    sb.append(user).append(\"@\").append(university).append(\".\");\n```\n\n然而，只有当\
    \ `append()` 方法在实现时考虑到这种功能，这种方法才会生效。\n\n# 回顾\n\n现在，考虑一个不同但相关的示例。假设你正在处理一个 `File`\
    \ 对象，该对象封装了当前的工作目录，你想知道它的名称中有多少个字符。可以通过以下方式实现：\n\n```\ncwd = new File(\"\");\n\
    String path = cwd.getCanonicalPath();\nint length = path.length();\n```\n\n然而，不需要中间变量\
    \ `path`，许多人倾向于使用以下链式实现：\n\n```\nlength = new File(\"\");\nlength = cwd.getCanonicalPath().length();\n\
    ```\n\n这种链式实现之所以有效，是因为 `File` 类中的 `getCanonicalPath()` 方法返回（并评估为）一个 String 对象，而\
    \ `String` 类有一个 `length()` 方法。\n\n# 思考问题\n\n尽管表面上相似，但电子邮件示例和路径示例非常不同。在路径示例中，方法没有改变其所属对象的状态。也就是说，`getCanonicalPath()`\
    \ 方法是一个访问器而不是变异器（即它不改变其 `File` 对象的状态，而是返回一个 String 对象），且 `length()` 方法也是一个访问器而不是变异器（即它不改变其\
    \ `String` 示例的状态，返回一个 int）。相反，在电子邮件示例中，`append()` 方法改变了其 `StringBuilder` 的状态（即它是变异器，且不需要返回任何内容）。\n\
    \n所以很容易看出为什么你可以在路径示例中使用调用链，但在电子邮件示例中似乎是不可以的。事实上，为了让你能够在路径示例中使用调用链，`append()` 方法必须返回它正在修改的那个\
    \ `StringBuilder` 对象。\n\n# 模式\n\n这个具有启发性的示例可以推广，创建一个解决链式变异器问题的模式。具体来说，如果你希望能够使用调用链来更改对象，那么要进行链式的变异器方法必须返回该对象，以便链中的后续方法可以被调用。但它不能返回任何内容；它必须返回一个适当类型的对象（即与所属对象相同类型的对象）。但是，仅仅这样是不够的——它必须返回所属对象本身。也就是说，变异器必须返回所属对象的引用，即\
    \ `this`。\n\n`StringBuilder` 类正因此原因而使用了这一点。`append()`、`delete()`、`insert()`、`replace()`\
    \ 和 `reverse()` 方法都返回结果，以便它们的调用可以链式。因此，在示例中，`sb.append(user)` 返回 `this`（即 `sb`\
    \ 的引用），然后在 `sb` 上调用 `append(\"@\")`，依此类推。\n\n# 示例\n\n假设你想创建一个机器人（Robot）的封装，它在一个或多个属性中记录位置，并能够在四个方向（向前、向后、向右和向左）移动。你显然需要一个或多个变异方法来处理移动。假设你决定为每个方向使用一个变异器方法，命名为\
    \ `moveBackward()`、`moveForward()`、`moveLeft()` 和 `moveRight()`。如果你对支持调用链感兴趣，那么这些方法将是\
    \ `void`（即它们不返回任何内容），并且可以像下面的示例那样使用：\n\n```\nRobot bender = new Robot();moveForward();moveRight();moveForward();\n\
    ```\n\n然而，如果你对调用链感兴趣，这些方法必须返回所属对象的引用，如下实现所示：\n\n```\npublic class Robot {\n  \
    \  private int x, y;\n\n    public Robot() {\n        x = 0; y = 0;\n    }\n\n\
    \    public Robot moveBackward() {\n        y--;\n        return this;\n    }\n\
    \n    public Robot moveForward() {\n        y++;\n        return this;\n    }\n\
    \n    public Robot moveLeft() {\n        x--;\n        return this;\n    }\n\n\
    \    public Robot moveRight() {\n        x++;\n        return this;\n    }\n\n\
    \    public String toString() {\n        return String.format(\"I am at (%d, %d).\"\
    , x, y);\n    }\n}\n```\n\n你可以这样使用该对象：\n\n```\nRobot bender = new Robot();moveForward().moveForward().moveRight();\n\
    ```\n\n许多人认为链式调用比每次移动使用单独语句要方便得多。然而，如果你想为移动使用单独语句，也可以；只需忽略返回值（如示例所示）。换句话说，提供调用链没有缺点，只有优势。\n\
    \n# 警告\n\n非常重要仔细记录链式变异器方法，以及看起来像链式变异器的方法。这种需求在 `String` 和 `StringBuilder` 类中变得显而易见。\n\
    \n例如，`String` 类中的 `toString()` 和 `to()` 方法很容易被误认为是变异器。事实上，如果你不知道 String 对象是不可变的，你几乎会认为事实是这样的。它们不是变异器的线索是它们返回\
    \ String 对象，这暗示它们从所属的 String 对象构造了一个新的 String 对象并返回。\n\n另一个示例，`Color` 类有 `brighter()`\
    \ 和 `darker()` 方法，你可能从名称上认为它们是变异器。然而，Color 对象是不可变的，另一个线索是这些方法返回 Color 对象。\n\n\
    然而，重要的是不要过度泛化。正如你所看到的，`StringBuilder` 类中的许多变异器方法返回 `StringBuilder` 对象。在这种情况下，这样做是为了支持调用链。唯一了解的方法是阅读文档。\n\
    \n所以，非常重要仔细记录不可变类中可能看起来是变异器的方法，以及支持调用链的可变类中的变异器方法。仅根据方法签名很容易对对象的行为方式做出不当的假设。防止此类假设产生问题的唯一方法就是编写文档。\n\
    \n"
