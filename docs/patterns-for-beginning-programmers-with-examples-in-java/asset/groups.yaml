    # ## Warning


    You might be tempted to use conformal arrays for solving the interval membership
    problem discussed in Chapter 16. That is, you might be tempted to create two arrays,
    left and right, that contain the left and right bounds for each interval. The
    shortcoming of this approach is that it is error-prone. In particular, observe
    that there is a very important constraint that involves right[i] and left[i+1]
    for element i (e.g., the two must be equal or by one, depending on exactly how
    they are used), and it is easy to inadvertently violate this constraint. Hence,
    unless there are gaps in the intervals, it is better to use a single array as
    described in Chapter 16.


