    \ = i;\n    }\n}\n```\n\n第三种情况更像第二种而不是第一种。由于参数是不可变的，尽管形式参数是别名，但没有办法改变所引用对象的属性。因此，你必须再次创建一个包装类。例如，如果你想有一个输出的\
    \ `Color` 参数（它是不可变的），你可以写一个如下的 `ColorWrapper` 类：\n\n```java\nimport java.awt.Color;\n\
    \npublic class ColorWrapper {\n    private Color wrapped;\n\n    public ColorWrapper()\
