    current contents¹ of swordOfBetty (i.e., a ''D'') in the memory location identified
    by swordOfAlice. The second assignment statement stores the current contents of
    swordOfAlice (i.e., now a ''D'') in the memory location identified by swordOfBetty.
    In other words, these statements didn''t swap the contents of the two variables
    at all. Instead, the memory locations identified by both variables now contain
    a binary representation of the character ''D''.


    ![](img/fc01fd61514199fc6ea175e763677f2b_27_0.png)


    ## Thinking About The Problem


    One way to think about solving the swapping problem is to imagine a situation
    in which you have Caladbolg in your left hand and Durendal in your right hand
    and you now want to swap the two. Since both of your hands are already full, there''s
    no way for you to make any progress. To make progress, you need a place where
    you can temporarily store one of the swords. For example, you can place Caladbolg
    on a table, move Durendal from your right hand to your left hand, and then pick
    up Caladbolg with your right hand.


    Note that this situation is not completely analogous to the way assignment works
    because the assignment operator replaces the current contents of the memory identified
    by a variable with a copy of the right side operand. However, it does provide
    the foundation of a pattern that can be used to solve the swapping problem.


    ¹1. The use of the plural noun "contents" rather than "content" may be a little
    confusing to some readers. Though a variable holds a single thing, it is kind
    of a container, and we normally talk about the "contents" of a container.


    ## The Pattern


    Suppose you want to swap the contents of two memory locations identified by a
    and b (or, more succinctly, suppose you want to swap the contents of two variables,
    a and b). Before starting, you need a memory location that can be used to temporarily
    store the contents of either a or b. Calling that variable temp, the swapping
    pattern can then be implemented as follows:


    ```java

    temp = a;

    a = b;

    b = temp;

    ```


    The process can be visualized as in Figure 2.3. In step 1, the contents of a is
    temporarily stored in the memory location identified by temp. In step 2, the contents
    of b is stored in the memory location identified by a. Finally, in step 3, the
    contents of temp is stored in the memory location identified by b.


    ![](img/fc01fd61514199fc6ea175e763677f2b_29_0.png)


    ## Examples


    It''s instructive to use the pattern to swap swords, carefully illustrating what
    happens step by step. The statements needed to conduct the swap are contained
    in the following fragment:


    ```java

    temp = swordOfAlice;

    swordOfAlice = swordOfBetty;

    swordOfBetty = temp;

    ```


