    \ `Double`，这是计算的结果。处理缺失值的情况各不相同。\n\n使用默认值 (Using a Default Value)\n\n第一种情况是使用默认值代替缺失元素。这在某些情况下是合适的，例如计算课程的平均分，所有考试都是必须的，因此\
    \ `defaultValue` 为 0.0，如下所示：\n\n- 2. 注意，内置包装类的构造函数已弃用，这意味着不应该使用它们，因为它们未来可能会被移除。\n\
    \n```\ntotal = 0.0;\nfor (int i = 0; i < data.length; i++) {\n  if (data[i] ==\
