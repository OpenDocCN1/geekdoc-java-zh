    \ 0 个字符必须位于行的位置 2。\n\n## 模式\n\n居中模式无非此示例的推广。首先，不再是文本，而应该更泛泛地考虑内容。其次，不是行，而应该更泛泛地考虑容器。内容和容器都有一个泛化了示例中“宽度”概念的范围，以及一个泛化了“起始字符”概念的引用。\n\
    \n居中问题是：给定容器的引用、范围以及内容的范围，找到内容的引用。用 $C$ 表示容器，$c$ 表示内容，上标 $R$ 和 $M$ 分别表示（每个维度的）引用、范围和中点，居中模式涉及三个步骤。\n\
    \n然而，这些能力在介绍性编程课程中并不常见。此外，即使有这样的控制台，居居中模式来找到行或列。这种控制台只是消除了填充字符串的需求。\n\n首先，你需要计算容器的中点（在示例中其引用为\
    \ 0，范围为 9）。你可以如下所示操作：\n\n```\n$C^M = C^R + (C^E / 2)\n```\n\n接下来，你需要计算内容的中点（在示例中其宽度为\
    \ 5）。你可以如下所示操作：\n\n```\n$c^M = (c^E / 2)\n```\n\n最后，你通过从容器的中点减去内容的中点来计算内容的引用。即：\n\
    \n```\n$c^R = C^M - c^M\n```\n\n在单维情况下（即像文本那样，引用和范围可以用单个数字表示时），该算法的实现方式如下：\n\n\
    ```java\npublic static double center(double containerReference,\ndouble containerExtent,\n\
    double contentExtent) {\n    double containerMidpoint = containerReference + containerExtent\
    \ / 2.0;\n    double contentMidpoint = contentExtent / 2.0;\n    double contentReference\
    \ = containerMidpoint - contentMidpoint;\n\n    return contentReference;\n}\n\
    ```\n\n当然，许多问题不是单维的。例如，图像和窗口既有宽度又有高度，它们的位置通过水平和垂直坐标指定。幸运的是，所有维度的逻辑是完全相同的。因此，如果范围和引用表示为等价数组（见第\
    \ 17 章），你可以在循环体中独立地执行每个维度的计算：\n\n```java\npublic static double center(double[]\
