    This facilitates both the declaration and the initialization.


    The second thing to realize is that the truncation pattern from Chapter 5 can
    be used to calculate the index associated with a particular centile. Specifically,
    one can truncate the 10s place to get the centile. For example, a value of 63
    is in centile 6 (the 60s), a value of 8 is in centile 8/10 (i.e., centile 0; the
    1s), and a value of 100 is in centile 100/10 (i.e., centile 10; the 100s). This
    eliminates the need for a complicated if statement.


    # The Pattern


    The pattern, then, can be stated as follows:


    +   1. Declare and initialize an array to hold the number of accumulators needed.

    2. Create an algorithm for identifying the index of the particular accumulator
    that needs to be updated during a particular iteration.

    3. Write a loop that calculates the index and updates the appropriate accumulator.


    In most situations, this logic should be encapsulated in a method.


