- md: "\n[23]\n\n# Dynamic Formatting\n\nIt is almost impossible to get this far in\
    \ an introductory programming course without making extensive use of format specifiers\
    \ (e.g., with the printf() method in the PrintWriter class or the format() method\
    \ in the String class). However, most, if not all, of the format specifiers you\
    \ have seen and used have probably been hard-coded. It turns out that there are\
    \ many situations in which format specifiers must be created while a program is\
    \ running.\n\n# Motivation\n\nIf you want to print all of the elements of a non-negative\
    \ int[] \"%10d\", it's easy to do so using the format specifier \"%10d\" as follows:\n\
    \n```\nfor (int i = 0; i < data.length; i++) {\n    System.out.printf(\"%10d\\\
    n\", data[i]);\n}\n```\n\nHowever, now suppose, instead, that you want the field\
    \ to be as narrow as possible. Since you can't know the value of the elements\
    \ of the array when you are writing the program, you can't hard-code the format\
    \ specifier.\n\n# Review\n\nFortunately, you already have some patterns that can\
    \ help you solve this problem. First, from the discussion of accumulators in Chapter\
    \ 13, you know that you can find the largest int in an int[] named data as follows:\n\
    \n```\nmax = -1;\nfor (int i = 0; i < data.length; i++) {\n  if (data[i] > max)\
    \ max = data[i];\n}\n```\n\nSecond, from the discussion of digit counting in Chapter\
    \ 11, you know that you can find the number of digits in an int value named max\
    \ as follows:\n\n```\nwidth = (int) (Math.log10(max)) + 1;\n```\n\nSo, all you\
    \ need to complete the solution to the dynamic formatting problem is a format\
    \ specifier.\n\n# Thinking About The Problem\n\nFortunately, the format specifier\
    \ is a String object, and you can construct and manipulate String objects while\
    \ a program is running. For example, returning to the situation in which you want\
    \ to use a field of width 10, you could use a String variable named fs for the\
    \ format String as follows:\n\n```\nfs = \"%10d\\n\";\nfor (int i = 0; i < data.length;\
    \ i++) {\n  System.out.printf(fs, data[i]);\n}\n```\n\nNow, all you need to do\
    \ is replace the hard-coded 10 in fs with the value contained in a variable.\n\
    \n# The Pattern\n\nIn particular, what you need to do is use StringBuilder concatenation\
    \ (or a StringBuilder object) to construct the format String. Recall that a format\
    \ specifier has the following syntax:\n%[flags][width][.precision]conversion\n\
    \nwhere:\n\n- flags is one or more of: - to indicate left-justification, + to\
    \ indicate required inclusion of the sign, , to include grouping separators, etc.\n\
    - width indicates the width of the field\n- precision indicates the number of\
    \ digits to the right of the decimal point for real numbers\n- conversion is one\
    \ of b for a boolean, c for a char, d for integer, f for a real number, s for\
    \ a String, etc.\n\nand items in square brackets are optional. \n\nSo, assuming\
    \ all of the variables have been declared, you construct a format specifier at\
    \ run-time as follows:\n\n```\nfs = \"\";\nif (flags != null) fs += flags;\nif\
    \ (width > 0) fs += width;\nif (precision > 0) fs += \".\" + precision;\nfs +=\
    \ conversion;\n```\n\n# Examples\n\nSuppose you want to illustrate the non-repeating\
    \ nature of the digits of π by printing a table in which the first line contains\
    \ one digit to the right of the decimal point, the second contains two digits\
    \ to the right of the decimal point, etc. To accomplish this you need to construct\
    \ the format specifier inside of a loop, and print Math.PI using that format specifier\
    \ at each iteration. This can be accomplished as follows:\n\n```\nfor (int digits\
    \ = 1; digits <= 10; digits++) {\n    fs = \"%d\" + (digits + 2) + \".\" + digits\
    \ + \"%f\\n\";\n    System.out.printf(fs, Math.PI);\n}\n```\n\nNote that this\
    \ example uses digits + 2 to account for the leading 3. in the output.\n\nAs another\
    \ example, suppose you want to create a String called result from a String source,\
    \ and you want result to satisfy the following specifications:\n\n1. It must have\
    \ width characters in total; and\n2. The characters in source must be centered\
    \ within result.\n\nYou know from the discussion of centering in Chapter 21 that\
    \ there must be width - source.length() spaces in result with \"half\" of them\
    \ to the left of source and \"half\" of them to the right of source. This can\
    \ be accomplished as follows:\n\n```java\npublic static String center(String source,\
    \ int width) {\n    int field, n, append;\n    String fs, result;\n\n    // Calculate\
    \ the number of spaces in the resulting String\n    n = width - source.length();\n\
    \    if (n <= 0) return source;\n\n    // Calculate the width of the field for\
    \ source (it will be\n    // right-justified in this field)\n    field = (width\
    \ + source.length()) / 2;\n    width = width - field;\n\n    // Calculate the\
    \ number of spaces to append to the right\n    append = n;\n\n    // Build the\
    \ format specifier\n    fs = \"%-\" + field + \"$s\" + append + \"%s\";\n\n  \
    \  result = String.format(fs, source, \" \");\n    return result;\n}\n```\n\n\
    The source will be right justified in a field that is (width/2 - source.length())/2\
    \ characters wide and it will be followed by a single space that will be right\
    \ justified in a field that is as wide as is necessary to fill the field.\n\n\
    # Pluralization\n\nPrograms often need to create output strings that contain different\
    \ words/phrases depending on the value of an associated integer. There are many\
    \ different ways to solve this problem, but most of them are awkward, at best.\n\
    \n# Motivation\n\nFor example, suppose you are writing a program for a local animal\
    \ shelter that must produce the output “There is 1 poodle available for adoption.”\
    \ when they have one poodle and “There are 3 poodles available for adoption.”\
    \ when they have three poodles. There are two differences between these two sentences:\
    \ the “is”/ “are” distinction and the “poodle”/ “poodles” distinction, both of\
    \ which can be thought of as pluralization problems.\n\n# Review\n\nYou could,\
    \ of course, treat this as isolated problems. For example, assuming the variable\
    \ contains the number of poodles, you could solve this as:\n\n```\nif (n == 1)\
    \ {\n    result = \"There is 1 poodle\";\n} else {\n    result = \"There are \"\
    \ + n + \" poodles\";\n}\n```\n\nUnfortunately, the duplication in the String\
    \ literals makes this solution prone to error; hence, it would be nice to have\
    \ a more generic solution. \n\n# Thinking About The Problem\n\nYou'd probably\
    \ like to be able to construct a String in one form (e.g., singular) and then\
    \ invoke a method (e.g., pluralize()) that converts it to the other form (e.g.,\
    \ plural). However, this kind of natural language processing (NLP) problem is\
    \ very difficult to solve. Fortunately, however, you speak English and are very\
    \ good at converting from one form to another. So, the solution to the problem\
    \ is to harness your ability to pluralize\n\n# The Pattern\n\nThe solution starts\
    \ with a simple method that returns either the singular or plural form of a word\
    \ (both of which you provide to the method), based on the value of another parameter:\n\
    \n```java\npublic static String form(int n, String singular, String plural) {\n\
    \    if (n > 1) return plural;\n    else return singular;\n}\n```\n\nAn artificial/contrived\
    \ solution of this kind is sometimes called a Deus ex machina, which is Latin\
    \ for \"god from the machine\". Then, you simply create a bunch of specific methods\
    \ that use this method.\n\n# Examples\n\nContinuing with the animal shelter example,\
    \ you first need the following method for the word \"is\"/ \"are\":\n\n```java\n\
    public static String is(int n) {\n    return form(n, \"is\", \"are\");\n}\n```\n\
    \nYou need the following method for adding an \"s\" to regular nouns:\n\n```java\n\
    public static String regular(int n, String noun) {\n    return noun + form(n,\
    \ \"\", \"s\");\n}\n```\n\nAssuming all of these methods are in a class named\
    \ Pluralize, they can be used with a regular noun like \"poodle\" as follows:\n\
    \n```\nresult = \"There \" + Pluralize.is(n) + \" \"\n+ n + \" \" + Pluralize.regular(n,\
    \ \"poodle\")\n+ \" available for adoption.\";\n```\n\nand with an irregular noun\
    \ like \"mouse\" as follows:\n\n```\nresult = \"There \" + Pluralize.is(n) + \"\
    \ \"\n+ n + \" \" + Pluralize.form(n, \"mouse\", \"mice\")\n+ \" available for\
    \ adoption.\";\n```\n\nFinally, an irregular noun like \"sheep\" could either\
    \ be handled as in the \"mouse\" example, or as follows:\n\n```\nresult = \"There\
    \ \" + Pluralize.is(n) + \" \"\n+ n + \" \" sheep available for adoption.\";\n\
    ```\n"
  mdcn: "\n\n[23]\n\n# 动态格式化\n\n在入门编程课程中，几乎不可能不在大量使用格式化符（例如使用 `PrintWriter` 类中的 `printf()`\
    \ 方法或 `String` 类中的 `format()` 方法）的情况下学到这里。然而，你见过并用过的大多数格式化符（如果不是全部）可能都是硬编码的。事实证明，在许多情况下，必须在程序运行时创建格式化符。\n\
    \n# 动机\n\n如果你想打印一个非负整数 `int[]` 的所有元素，使用如下的格式化符 `\"%10d\"` 可以很容易实现：\n\n```\nfor\
    \ (int i = 0; i < data.length; i++) {\n    System.out.printf(\"%10d\\n\", data[i]);\n\
    }\n```\n\n但是，现在假设你希望字段尽可能窄。由于你 own编写程序时无法知道数组元素的值，因此你无法硬编码该格式化符。\n\n# 复习\n\n幸运的是，你已经掌握了一些可以帮助解决这个问题的模式。首先，从第\
    \ 13 章关于累加器的讨论中，你知道可以通过以下方式找到名为 `data` 的 `int[]` 中的最大整数：\n\n```\nmax = -1;\nfor\
    \ (int i = 0; i < data.length; i++) {\n  if (data[i] > max) max = data[i];\n}\n\
    ```\n\n其次，从第 11 章关于数字计数的讨论中，你知道可以通过以下方式找到名为 `max` 的整数值的数字位数：\n\n```\nwidth = (int)\
    \ (Math.log10(max)) + 1;\n```\n\n所以，要完成动态格式化问题的解决方案只需要一个格式化符。\n\n# 思考问题\n\n幸运的是，格式化符是一个\
    \ `String` 对象，你可以在程序运行时构造并操纵 `String` 对象。例如，回到想要使用宽度为 10 的字段的情况，你可以使用名为 `fs` 的\
    \ `String` 变量作为格式化字符串，如下：\n\n```\nfs = \"%10d\\n\";\nfor (int i = 0; i < data.length;\
    \ i++) {\n  System.out.printf(fs, data[i]);\n}\n```\n\n现在，你只需要将 `fs` 中硬编码的 `10`\
    \ 替换为变量包含的值。\n\n# 模式\n\n具体来说，你需要的是使用 `StringBuilder` 拼接（或 `StringBuilder` 对象）来构造格式化字符串。回想格式化符具有以下语法：\n\
    %[flags][width][.precision]conversion\n\n其中：\n\n- `flags` 是以下一个或多个的：`-` 表示左对齐，`+`\
    \ 表示必须包含符号，`,` 表示包含分组分隔符等。\n- `width` 表示字段的宽度\n- `precision` 表示实数小数点右侧的位数\n- `conversion`\
    \ 是以下之一：`b` 用于布尔值，`c` 用于 `char`，`d` 用于整数，`f` 用于实数，`s` 用于 `String` 等。\n\n方括号中的项目是可选的。\n\
    \n所以，假设所有变量都已声明，你可以在运行时如下所示构造格式化符：\n\n```\nfs = \"\";\nif (flags != null) fs +=\
    \ flags;\nif (width > 0) fs += width;\nif (precision > 0) fs += \".\" + precision;\n\
    fs += conversion;\n```\n\n# 示例\n\n假设你想通过打印一个表格来展示 π 的数字具有非重复性的特性，其中第一行包含小数点后一位数字，第二行包含两位数字，以此类推。为了实现这一点，你需要在循环内部构造格式化符，并在每次迭代中使用该格式化符打印\
    \ `Math.PI`。可以通过如下方式实现\n\n```\nfor (int digits = 1; digits <= 10; digits++) {\n\
    \    fs = \"%d\" + (digits + 2) + \".\" + digits + \"%f\\n\";\n    System.out.printf(fs,\
    \ Math.PI);\n}\n```\n\n注意，这个示例使用了 `digits + 2` 来考虑到输出开头的 `3.`。\n\n另一个例子，假设你想从一个字符串\
    \ `source` 创建名为 `result` 的 `String`，并希望 `result` 满足以下规范：\n\n1. 它总共必须有 `width`\
    \ 个字符；且\n2. `source` 中的字符必须在 `result` 中居中。\n\n从第 21 章关于居中的讨论中，你知道 `result` 中必须有\
    \ `width - source.length()` 个空格，其中“一半”在 `source` 的左侧，另一“一半”在 `source` 的右侧。可以通过如下方式实现：\n\
    \n```java\npublic static String center(String source, int width) {\n    int field,\
    \ n, append;\n    String fs, result;\n\n    // 计算结果字符串中的空格数\n    n = width - source.length();\n\
    \    if (n <= 0) return source;\n\n    // 计算 source 字段的宽度（它将在该字段中\n    // 右对齐）\n\
    \    field = (width + source.length()) / 2;\n    width = width - field;\n\n  \
    \  // 计算要向右侧追加的空格数\n    append = n;\n\n    // 构造格式化符\n    fs = \"%-\" + field\
    \ + \"$s\" + append + \"%s\";\n\n    result = String.format(fs, source, \" \"\
    );\n    return result;\n}\n```\n\n`source` 将在一个宽度为 `(width/2 - source.length())/2`\
    \ 字符的字段中右对齐，其后面将跟随一个空格，该空格将在一个足够宽以填充字段的字段中右对齐。\n\n# 复数形式\n\n程序经常需要根据关联整数的值创建包含不同单词/短语的输出字符串。解决这个问题有许多方法，但大多数方法充其量是拙劣的。\n\
    \n# 动机\n\n例如，假设你正在为当地动物收容所编写一个程序，当他们只有一只贵宾犬时，必须输出“There is 1 poodle available\
    \ for adoption.”，当他们有三只贵宾犬时，必须输出“There are 3 poodles available for adoption.”。这两个句子之间有两个区别：“is”/“are”的区别以及“poodle”/“poodles”的区别，这两者都可以被视为复数形式问题。\n\
    \n# 复习\n\n当然，你可以将此视为孤立的问题。例如，假设变量包含宾犬的数量，你可以这样解决：\n\n```\nif (n == 1) {\n    result\
    \ = \"There is 1 poodle\";\n} else {\n    result = \"There are \" + n + \" poodles\"\
    ;\n}\n```\n\n遗憾的是，字符串字面量的重复这种解决方案容易出错；因此，有一个更通用的解决方案将会很好\n\n# 思考问题\n\n你可能希望构造一种形式的字符串（例如单数），然后调用一个方法（例如\
    \ `pluralize()`）将其转换为另一种形式（例如复数）。然而，这种自然语言处理（NLP）问题很难解决。幸运的是，你精通英语并非常擅长从一种形式转换为另一种形式。所以，解决这个问题的方法是利用你的复数能力\n\
    \n# 模式\n\n解决方案从一个简单的方法开始，该方法根据另一个参数的值返回单词的单数或复数形式（都由你提供）：\n\n```java\npublic static\
    \ String form(int n, String singular, String plural) {\n    if (n > 1) return\
    \ plural;\n    else return singular;\n}\n```\n\n这种人为的解决方案有时被称为 `Deus ex machina`，拉丁语意为“机械的神”。然后，你只需要创建一组特定的方法来使用这个方法。\n\
    \n# 示例\n\n继续动物收容所的例子，首先你需要用于单词“is”/“are”的方法：\n\n```java\npublic static String\
    \ is(int n) {\n    return form(n, \"is\", \"are\");\n}\n```\n\n你需要另一个用于给普通名词添加“s”的方法：\n\
    \n```java\npublic static String regular(int n, String noun) {\n    return noun\
    \ + form(n, \"\", \"s\");\n}\n```\n\n假设所有方法都在名为 `Pluralize` 的类中，它们可以如下所示用于普通名词“poodle”：\n\
    \n```\nresult = \"There \" + Pluralize.is(n) + \" \"\n+ n + \" \" + Pluralize.regular(n,\
    \ \"poodle\")\n+ \" available for adoption.\";\n```\n\n如下所示用于不规则名词“mouse”：\n\n\
    ```\nresult = \"There \" + Pluralize.is(n) + \" \"\n+ n + \" \" + Pluralize.form(n,\
    \ \"mouse\", \"mice\")\n+ \" available for adoption.\";\n```\n\n最后，像“sheep”这样的不规则名词可以像“mouse”例子一样处理，或者如下所示：\n\
    \n```\nresult = \"There \" + Pluralize.is(n) + \" \"\n+ n + \" \" sheep available\
    \ for adoption.\";\n```\n\n"
