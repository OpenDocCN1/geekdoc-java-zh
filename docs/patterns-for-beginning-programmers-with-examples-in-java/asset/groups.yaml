    \ method in the String class). However, most, if not all, of the format specifiers\
    \ you have seen and/used have probably been hard-coded. It turns out that there\
    \ are many situations in which format specifiers must be created while a program\
    \ is running.\n\n# Motivation\n\nIf you want to print all of the elements of a\
    \ non-negative int[] \"%10d\", it's easy to do so using the format specifier \"\
    %10d\" as follows:\n\n```\nfor (int i = 0; i < data.length; i++) {\n    System.out.printf(\"\
    %10d\\n\", data[i]);\n}\n```\n\nHowever, now suppose, instead, that you want the\
    \ field to be as narrow as possible. Since you can't know the value of the elements\
    \ of the array when you are writing the program, you can't hard-code the format\
    \ specifier.\n\n# Review\n\nFortunately, you already have some patterns that can\
    \ help"
