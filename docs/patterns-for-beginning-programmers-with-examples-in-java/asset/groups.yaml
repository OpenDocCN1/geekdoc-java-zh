    # Rounding


    As mentioned in Chapter 5, integers commonly include more digits of accuracy than
    needed, and sometimes leads to the need to truncate numbers. This chapter considers
    a common alternative to truncation — rounding.


    # Motivation


    In the example from Chapter 5, the worker was paid piece, but only for multiples
    of ten pieces. So, the number of pieces manufactured was truncated to the 10s
    place. Surprisingly, this policy might make workers unhappy. So, in an effort
    to improve job satisfaction, the company might decide to round to the 10s place
    rather than truncate to it.


    # Review


    Under the system in Chapter 5, if an employee manufactured 526 items then they
    would be paid for 520 items. As you now know, letting number denote the value
    of interest and place denote the place to truncate (e.g., 10, 100, 1000, etc.),
    you can calculate the truncated value using the following pattern:


    ```

    truncated = (number / place) * place;

    ```'
