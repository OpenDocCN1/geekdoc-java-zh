    \ seen something like the following:\n\n```\nint age;\n\n// Initialize the age\
    \ to 0 at birth\nage = 0;\n\n// Increase the age by 1 on the first birthday\n\
    age++;\n```\n\nWhat you may not know is, in some ways, this is just one (particularly\
    \ simple) way of solving a specific updating problem (i.e., in which the variable\
    \ is increased or decreased by exactly 1).\n\n# Thinking About The Problem\n\n\
    The same result can be achieved in a slightly more complicated but, ultimately,\
    \ more flexible way. To understand how, first remember that the assignment operator\
    \ takes the result of evaluating the expression on its right and puts it in the\
    \ memory location identified by the variable on its left. This is done three different\
    \ times in the following example:\n\n```\nint currentAge, increment, initialAge;\n\
    \ninitialAge = 0;\nincrement = 1;\ncurrentAge = initialAge + increment;\n```\n\
    \nThese three assignment statements are particularly easy to understand because\
    \ the expression on the right side of the assignment operator does not involve\
    \ the variable on the left side. However, nothing about the syntax of assignment\
    \ statements prevents this from being the case. For example, consider the following\
    \ statement:\n\n```\n// Add age and 1 and assign the result to the age\nage =\
    \ age + 1;\n```\n\nThis statement first adds the value in the memory location\
    \ identified by age and the value 1 and then assigns the result to the memory\
    \ location identified by age. In other words, it does the same thing as ++age.\n\
    \nThe non-programmer this statement looks like a mistake because the non-programmer\
    \ thinks that it says \"age equals age plus one\", which clearly can't be true.\
    \ However, that's not what it says at all. It actually says \"add value in the\
    \ memory location identified by age and the value one, and put the result in the\
    \ memory location identified by age\".\n\n# The Pattern\n\nThis idea can be generalized\
    \ in a variety of ways; recognizing the important pattern is the presence of the\
    \ left-side operand on the right side of the assignment operator. In a fairly\
    \ abstract way, the pattern can be written (in pseudo-code) as:\n\n```\nvalue\
    \ = value operator adjustment\n```\n\nwhere value denotes the variable being updated,\
    \ = denotes the assignment operator, operator denotes a binary operator, and adjustment\
    \ represents the \"amount\" of the adjustment. Since operator has higher precedence\
    \ than =, it is evaluated first. Then, the result of evaluation (which involves\
    \ value) is assigned to value.\n\nThis pattern is so common, that experienced\
    \ programmers neither think about them nor de to mention it to beginning programmers,\
    \ but it's not as obvious as everyone makes it out to be.\n\n# Examples\n\nYou\
    \ will encounter many situations in which you must keep track of something that\
