    # Examples


    Returning to the credit card example, suppose the account number is 412831758.
    To extract the card type from the account number you need to extract the right-most
    digit. This means that you must find the remainder after dividing by $10^1$ (or
    10). You can accomplish this as follows:


    ```

    cardNumber = 412831758;

    accountType = cardNumber % 10; // Extract right-most 1 digit

    ```


    To extract the issuing bank number you must extract the left-most digits of a
    nine digit number. This means that you must divide by $10^{9-3}$, or $1000000$.
    This can be accomplished as follows:


    ```

    cardNumber = 412831758;

    issuer = cardNumber / 1000000; // Extract left-most 3 (of 9) digits

    ```


    The part of the account number that identifies the account holder consists of
    the remaining digits. To get this part of the account number you must first drop
    the left-most digits (i.e., you must find the remainder after dividing by $10^{9-3}$).
    Then, you must drop the right-most digit of the result (i.e., you must divide
    the result by $10^1$). This can be accomplished as follows:


    ```

    cardNumber = 412831758;

    holder = (cardNumber % 100000) / 10;

    ```


    # A Warning


    You need to be especially careful about the order in which you perform operations
    when using this pattern in a repeated fashion because they change the number of
    digits, $N$. For example, when finding the account holder in the example above
    you had to first take the remainder after dividing by 1000000 and then divide
    by 10. Had you divided by 10 first, the intermediate value would have been 41283175
    and the remainder after dividing by 1000000 would then have been 283175 instead
    of 831175.


    Reversing the order of operations in an incorrect solution because the intermediate
    value 41283175 only has 8 digits, not 9. So, to extract the right-most 3 digits
    you would have to take the remainder after dividing by $10^{8-3}$ or (100000).


    # Looking Ahead


    If you take a course on systems programming, you will probably encounter the following
    topics related to digit manipulation: working in other bases and bit shifting.
    Both are discussed briefly below.


    # Generalizing the Pattern


    For reasons that may not be apparent now, hexadecimal (i.e., base 16) frequently
    arises in computing. Fortunately, this same pattern can be used with other bases.
    All that is needed is to replace 10 with the desired base, $b$.


    # Bit Shifting


    For reasons that hopefully are already apparent to you, binary (i.e., base 2)
    is also very important in computing. Many programming languages (including Java)
    include the >> and << operators to shift the binary representation of an integer
    to the right or left a given number of places. These lower-level operators are
    more relevant in a systems programming course than an applications programming
    course, but will be touched upon briefly at the end of Chapter 18 on segmented/packed
    arrays.


    # Arithmetic on the Circle


    When children are first taught to count, they are introduced to the concept of
    a number line. That approach then subconsciously influences the way people think
    about arithmetic throughout their lives. However, one can also perform arithmetic
    on a number circle, which turns out to be a good way to solve an enormous number
    of programming problems.


    # Motivation


    Quite frequently, values can be increased without bound. For example, if you start
    with $3.00 and someone keeps giving you dollar bills, you will have more and more
    dollar bills (subject, of course, to tax laws and the alike). However, in some
    cases, values don''t keep increasing.


    # Review


    A number line is usually represented as a line with arrow heads at both ends indicating
    that it continues forever. A number circle is a circle with tick marks indicating
    the integers. A number circle increases in the clockwise direction and decreases
    in the counterclockwise direction. An example, which includes the first twelve
    non-negative integers, is illustrated in Figure 4.


    Addition on the circle involves moving in the clockwise direction from a particular
    tick mark. So, for example, suppose you are interested in the quantity $x+2$.
    Then, you locate $x$ on the number circle and move $2$ tick marks in the clockwise
    direction. This is illustrated in Figure 4.1.


    Similarly, subtraction on the circle involves moving in the counterclockwise direction
    from a particular tick mark. So, for example, suppose you are interested in the
    quantity $x-1$. Then, you locate $x$ on the number circle and move $1$ tick mark
    in the counterclockwise direction. This is illustrated in Figure 4.2.


    So, if you start with $3.00 and someone gives you fifteen dollars, you will wind
    up at eighteen o''clock. On the other hand, if you start with $3.00 and spend
    $5.00, you will be $2.00 in debt.


    # Thinking About The Problem


    Now, however, consider what happens if you start at three''clock (i.e., 3:00)
    and add fifteen hours. You wind up at eighteen o''clock (i.e., 18:00) because
    there is no such hour on a traditional twelve-hour clock. Instead, what happens
    conceptually is that you circle around. Indeed, on a traditional analog clock,
    this is what happens physically.


