    # 编程模式 19


    取决于要提取或丢弃的位数。令 $N$ 表示数字的位数，该模式可以完成如下：


    - 要从数字中提取左侧的 $n$ 位数字，你必须除以 $10^{N-n}$。

    - 要从数字中丢弃左侧的 $n$ 位数字，你必须找到除以 $10^{N-n}$后的余数（等等，检查下方的逻辑）。


    # 示例


    回到信用卡卡的例子，假设账户号为 412831758。要从账户号中提取卡类型，你需要提取最右侧的数字。这意味着你需要找到除以 $10^1$（或 10）后的余数。你可以通过以下方式实现：


    ```

    cardNumber = 412831758;

    accountType = cardNumber % 10; // 提取右侧 1 位

    ```


    要提取发卡银行号码，你必须提取九位数数字的左侧数字。这意味着你必须除以 $10^{9-3}$，或 $1000000$。这可以通过以下方式实现：


    ```

    cardNumber = 412831758;

    issuer = cardNumber / 1000000; // 提取左侧 3 位（共 9 位）

    ```


    账户号中标识账户持有人的部分由剩余数字组成。要获取账户的这部分，你必须首先丢弃左侧数字（即必须找到除以 $10^{9-3}$ 后的余数）。然后，你必须丢弃结果中最右侧的数字（即必须将结果除以
    $10^1$）。这可以通过以下方式实现：


    ```

    cardNumber = 412831758;

    holder = (cardNumber % 100000) / 10;

    ```


    # 警告


    当你重复使用此模式时，需要特别注意执行操作的顺序，因为这些操作会改变位数 $N$。例如，在上面的示例中寻找账户持有者时，你必须先取除以 1000000 的余数，然后除以
    10。如果你先除以 10，中间值将是 41283175，而除以 1000000 的余数将是 283175 而不是 831175。


