    \ total / (double) n;\n```\n\n在这种情况下，确保在计算平均值时使用非缺失数量是关重要的。为此使用了第二个累加器 n。\n\n\
    传播缺失值 (Propagating the Missing Value)\n\n最后一种情况是传播缺失值。也就是说，任何涉及缺失值的计算都会导致缺失值。这在某些情况下可能是合适的，例如计算美国的平均州人口。如果某个州的人口缺失，它不能被忽略，也不能用默认值替换。因此，平均值本身也必须是缺失，如下所示：\n\
    \n```\nmissing = false;\n```\n"
