    # Patterns Requiring Knowledge of Logical and Relational Operators, Conditions,
    and Methods


    Part II contains programming patterns that require understanding of logical operators,
    relational operators, conditions, and methods. Specifically, this part of the
    book contains the following programming patterns:


    +   - Indicators. Solutions to problems in which a binary variable is used to
    determine whether or not another variable should be increased/decreased by an
