    圆周模式上的算术运算出现在各种情况下，有些显而易见，有些则并不明显。


    ### 显而易见的例子


    在圆上进行算术运算最明显的例子是圆形模拟钟（它看起来就像一个数字圆）。事实上，这正是图 4.4 中的数字圆，只不过中午和午夜表示为 0 而不是 12。为了避免这种潜在的混淆来源以及
    AM/PM 问题，请考虑使用军用时间的钟。在这样的钟上，午夜是“000时”，早上十一点是“1100时”，晚上五点是“1700时”等。这样的钟如图 4.6 所示。


    ![](img/fc01fd61514199fc6ea175e763677f2b_43_0.png)


    涉及此类钟的问题很容易回答。例如，假设现在是 500 时，8 小时后是几点？这不需要任何计算；你可以使用传统的加法来确定答案是 1300 时。然而，有些问题更困难。例如，假设现在是
    1700 时，12 小时后是几点？遗憾的是，传统的加法已不足以解决这个问题了。显然，答案不是 2900 时，因为没有那个时间。相反，你必须考虑到你已经过了一天。更糟糕的是，假设现在是
    1700 时，你想知道 93 小时后的时间。那么，你必须考虑到你已经过了几天。


    使用圆周模式的算术，1700 时加 12 小时可以被认为（使用整数算术）是 `((17 + 12) / 24)` 的 1 次（即圆周转了一圈），余数为 `((17
    + 12) % 24)` 或 `29 % 24` 或 `5`（即额外的五个刻度）。同样，对于 1700 时加 93 小时：


    ```

    remainder = (17 + 93) % 24;

    ```


    结果是 110 % 24 或 14。


    作为另一个例子，考虑重量。在美国，重量以磅和盎司测量，盎司被限制在半开区间 [0, 16)。所以，如果你有 9 盎司黄金，有人给了你 14 盎司黄金，你通常不会说你有23
