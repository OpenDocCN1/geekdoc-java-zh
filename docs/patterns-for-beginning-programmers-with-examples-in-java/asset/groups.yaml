  - "[PAGE 165]\n\n[24]\n\n# Pluralization\n\nPrograms often need to create output\
    \ strings that contain different words/phrases depending on the value of an associated\
    \ integer. There are many different ways to solve this problem, but most of them\
    \ are awkward, at best.\n\n# Motivation\n\nFor example, suppose you are writing\
    \ a program for a local animal shelter that must produce the output “There is\
    \ 1 poodle available for adoption.” when they have one poodle and “There are 3\
    \ poodles available for adoption.” when they have three poodles. There are two\
    \ differences between these two sentences: the “is”/ “are” distinction and the\
    \ “poodle”/ “poodles” distinction, both of which can be thought of as pluralization\
    \ problems.\n\n# Review\n\nYou could, of course, treat this as an isolated problem.\
    \ For example, assuming the variable n contains the number of poodles, you could\
    \ solve this problem as follows:\n\n```\nif (n == 1) {\n    result = \"There is\
    \ 1 poodle available for adoption.\"\n} else {\n    result = \"There are \" +\
