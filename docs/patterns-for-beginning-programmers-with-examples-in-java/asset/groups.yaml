    $$\log_{a}(x) = \frac{\log_{10}(x)}{\log_{10}(a)}$


    whenever $x > 0$.


    # Warning


    Notice that the truncation pattern from Chapter 5 is not used in this pattern.
    Instead, typecasting is used to get the integer part of the value returned by
    Math.log10(). This is because Math.log10() returns a double, and the truncation
    pattern is for truncating integers.'
  - '[PAGE 85]


    # [PART III]

    Patterns Requiring Knowledge of Loops, Arrays, and I/O


    Part III contains programming patterns that require understanding of loops/iteration,
    one-dimensional arrays, and console input/output. Specifically, this part of the
    book contains the following programming patterns:


    +   **Reprompting.** Solutions to the problem of prompting a user for input until
    they provide a valid response.


    +   **Accumulators.** Solutions to problems that require one (or a few) “running”
    calculations.


    +   **Accumulator Arrays.** Solutions to problems that require multiple, related
    “running” calculations.


    +   **Lookup Arrays.** Solutions to problems that involve finding the values associated
    with a key, when the key has special properties.


    +   **Interval Membership.** A solution to problems that involve finding the interval
    that contains a particular value.


    +   **Conformal Arrays.** A solution to the problem of organizing multiple pieces
    of information that all have a common key.'
  - '[PAGE 86]


    # Segmented Arrays. A solution to the problem of organizing multiple pieces of
    information of the same type.


    Lookup arrays and the interval membership pattern both use arrays in less-than-obvious
    ways to solve problems of various kinds. They are interesting in their own right,
    because they help you think about novel ways to use arrays. Conformal arrays and
    segmented arrays are ways to organize data using arrays commonly in languages
    that don''t support object-oriented programming, and, as a result, they often
    find their way into programs written in object-oriented languages. They also provide
    an interesting contrast to objects/classes, which can also be used to solve problems
    of this kind.'
  - "[PAGE 87]\n\n[12]\n\n# Reprompting\n\nProgram that use the console (sometimes\
    \ called command-line programs) frequently need to prompt the user to provide\
    \ input, validate the input, and reprompt if the input is invalid. There are many\
    \ different ways to accomplish these tasks, but with all of the problems discussed\
    \ this far, there are better and worse ways to do so.\n\n# Motivation\n\nSuppose\
    \ you must write a program that prompts the user to enter their age and then retrieves\
    \ their response. Since the user might make a mistake and enter a negative value,\
    \ your program must check the user's response and reprompt them if they've made\
    \ a.\n\nThe phrase \"if they've made a mistake\" might lead you to use an statement\
    \ to deal with this situation. In other words, you might be led to think the solution\
    \ is something like the following (in pseudocode):\n\n```\nPrompt the user to\
    \ enter their age;\nRead the user's response;\nAssign the response to the variable\
    \ named age;\n\nif (age is negative) {\n  Prompt the user to enter their age;\n\
    \  Read the user's response;\n```"
  - "[PAGE 88]\n\n# 72 David Bernstein\n\nAssign the response to the variable named\
    \ age;\n)\nUse the variable named age;\n\nYou would then test your program, see\
    \ it works correctly, and deploy it. Unfortunately, at some point, the user will\
    \ probably enter an invalid response to both prompts, and the program will fail\
    \ (in one way or another).\n\nBecause beginning programmers tend to get locked\
    \ into a particular solution, you might then “correct” the code as follows:\n\n\
    ```\nPrompt the user to enter their age;\nRead the user's response;\nAssign the\
    \ response to the variable named age;\n\nif (age is negative) {\n  Prompt the\
    \ user to enter their age;\n  Read the user's response;\n  Assign the response\
    \ to the variable named age;\n\nif (age is negative) {\n  Prompt the user to enter\
    \ their age;\n  Read the response;\n  Assign the response to the variable named\
    \ age;\n}\n```\n\nUse the variable named age;\n\nOf course, this doesn’t correct\
    \ the defect at all. That is, this code will only work for two or fewer invalid\
    \ responses, and there is no limit on the number of times that the user can enter\
    \ an invalid response.\n\n# Review\n\nWhat you need is a way to repeat a block\
    \ of code an indefinite number of times (i.e., until the user enters a valid response).\
    \ The phrase “repeat a block of code” should immediately bring to mind a loop\
    \ of some kind. The phrase “an indefinite number of times” should bring to mind\
    \ a while or do loop. In other words, you are already halfway to a solution.\n\
    \nAs you know, a while loop is appropriate if the body isn’t be executed, and\
    \ a do loop is appropriate if the body must be executed at least once. So, you\
    \ might be thinking that the solution to the reprompting problem involves a while\
    \ loop"
- md: "\nsince you don't always need to reprompt. The truth is slightly\nmore complicated\
    \ than that.\n\n# Thinking About The Problem\n\nIt turns out that there are, in\
    \ fact, two different versions of\nthis problem. In the first, the initial prompt\
    \ and the subsequent\nprompts (i.e., after the user provides an invalid response)\
    \ are the same. In the second, the initial prompt is different from\nthe subsequent\
    \ prompts. What this means is that a do loop is\nappropriate in solutions of the\
    \ first version, and a while loop is\nappropriate in solutions of the second version.\n\
    \n# The Pattern\n\nThe pattern that solves the first version of this problem can\n\
    be described as follows:\n\n- 1. Enter a do loop. In the body of the loop:\n \
    \ 1.1. Prompt the user.\n  1.2. Retrieve the user's response.\n- 2. Repeat when\
    \ the response is invalid.\n\nThe pattern that solves the second version of this\
    \ problem\nis described as follows:\n\n- 1. Prompt the user with the normal message.\n\
    - 2. Retrieve the user's response.\n- 3. Enter a while loop when the response\
    \ is invalid.\n  3.1. Prompt the user with the alternate\n  message.\n  3.2. Retrieve\
    \ the response.\n- 4. Repeat.\n\n# Examples\n\nIn the following examples, the\
    \ user is prompted to enter an\n\nage which must be non-negative to be valid.\
    \ In the first version, the user is always provided with the same prompt:\n\n\
    ```\nSystem.out.printf(\"Enter a non-negative age: \");\nage = scanner.nextInt();\n\
    while (age < 0) {\n```\n\nIn the second version, the user is only told that the\
    \ age must be non-negative after an invalid response is provided:\n\n```\nSystem.out.printf(\"\
    Enter your age: \");\nage = scanner.nextInt();\nwhile (age < 0) {\n  System.out.printf(\"\
    \ Enter a non-negative value: \");\n  age = scanner.nextInt();\n}\n```\n\nNote\
    \ that, in general, there are many ways in which the user could respond inappropriately,\
    \ not just by entering a negative number. For example, the user could enter a\
    \ number that is too large, or enter a non-integer when an integer was required.\
    \ In all of these cases, the pattern remains the same, all that changes is the\
    \ boolean expression in the loop (and, perhaps, the way the response is read).\n\
    \n# Accumulators\n\nIn some situations, the iterations of a loop are independent\
    \ of each other. However, in many situations a program needs to “keep track of”\
    \ something over the course of multiple iterations. In situations like these,\
    \ accumulators often come into play.\n\n# Motivation\n\nIf you ask someone “on\
    \ the street” how to add a column of numbers by hand, they will probably say something\
    \ like “just add them up”. If you ask them to demonstrate with a column of fifty\
    \ single-digit numbers, they probably won’t have any trouble. However, if you\
    \ talk to them while they’re doing it (especially if you drop some numbers into\
    \ the conversation), they’ll have much more difficulty, and may not be able to\
    \ do it all.\n\nIf you then suggest that they “write things down” as they go,\
    \ there’s a good chance that they won’t know what you mean and/or how that would\
    \ help. The reason is that, when adding single-digit numbers, people use their\
    \ brain both to add pairs of numbers and to store the result, and they can’t imagine\
    \ how to use paper for storage. However, as you know, writing a program you must\
    \ carefully differentiate between the two.\n\n# Review\n\nSuppose you need to\
    \ write a program that operates on all of the elements of an array of numbers\
    \ (e.g., double values). You will immediately recognize that you need to use a\
    \ loop. Hopefully, it's a determinate (or definite) loop (i.e., the number of\
    \ iterations is known), you will also recognize that you should use a for loop.\n\
    \nFor example, given an array named data that contains n elements, you might start\
    \ with code like the following:\n\n```\nfor (int i = 0; i < n; i++) {\n    //\
    \ Do something with data[i]\n}\n```\n\nGo here to a program that calculates the\
    \ sum, you need to think about what needs to be done with each element of the\
    \ array (i.e., each data[i] in the example) in order to calculate the sum.\n\n\
    # Thinking About The Problem\n\nReturning to the person on the street, suppose\
    \ you again ask them to find the sum of fifty single-digit numbers and describe\
    \ what they are doing while they are doing it. Suppose further that the numbers\
    \ start with 7, 3, and 2. Most likely, they will say something like “7 plus 3\
    \ is 10, plus 2 is 12 ...”. Which is to say, they will use what is commonly called\
    \ a running total.\n\nIf you now point this out to them, they will probably be\
    \ able to use a piece of paper to store the running total, rather than their brain.\
    \ This is exactly the same technique that you need to use when writing a program\
    \ for this purpose. That is, you need a variable, called an accumulator, to store\
    \ the running total.\n\n# The Pattern\n\nThe accumulator pattern involves declaring\
    \ a variable of appropriate type in which the running value can be stored, initializing\
    \ this variable to an appropriate value, and then using the updating pattern from\
    \ Chapter 1 to (potentially) change the value each iteration.\n\n# In the context\
    \ of finding the sum of an array of double values, this pattern is realized as\
    \ follows:\n\n```\ndouble total;\nint n;\n\nn = data.length;\ntotal = 0;\n\nfor\
    \ (int i = 0; i < n; i++) {\n    total += data[i];\n}\n```\n\nIn this realization,\
    \ total is declared to be double, it is initialized to 0, and it iterates. An\
    \ accumulator can be of any type and can be used for many purposes. In addition\
    \ to finding the sum, numeric accumulators can be used for many other purposes.\n\
    \nBoolean accumulators are commonly used for containment checks (e.g., to determine\
    \ if an array contains a value). The following example determines if target equals\
    \ any element:\n\n```\nboolean found;\nint n;\n\nn = data.length;\nfound = false;\n\
    \nfor (int i = 0; i < n; i++) {\n    if (target == data[i]) found = true;\n}\n\
    ```\n\nThe accumulator in this case is boolean found. It is important to note\
    \ that this method does not assign found when target not equal data[i].\n\n# Examples\
    \ with Multiple Accumulators\n\nSometimes it is convenient or even necessary to\
    \ use two accumulators in the same loop. In the following example, one accumulator\
    \ total contains the running total, and another accumulator lowest contains the\
    \ minimum:\n\n```\ndouble lowest, result, total;\nint n;\n\nn = data.length;\n\
    total = 0.0;\nlowest = Double.POSITIVE_INFINITY;\n\nfor (int i = 0; i < n; i++)\
    \ {\n    total += data[i];\n    if (data[i] < lowest) lowest = data[i];\n}\nresult\
    \ = (total - lowest) / (n - 1);\n```\n\nAs another example, suppose you want to\
    \ find not the maximum of an array, but instead, the index of the largest element\
    \ (often called the argmax). One way to do this is to use one accumulator to keep\
    \ track of the maximum and another to keep track of its index as follows:\n\n\
    ```\ndouble maximum;\nint index, n;\n\nn = data.length;\nmaximum = Double.NEGATIVE_INFINITY;\n\
    index = -1;\n\nfor (int i = 0; i < n; i++) {\n    if (data[i] > maximum) {\n \
    \       index = i;\n        maximum = data[i];\n    }\n}\n```\n\n# ## Warning\n\
    \nSome people like to initialize the accumulator to a \"smarter\" value. For example,\
    \ when calculating the running total, some people like to initialize the accumulator\
    \ to the 0th element of the array rather than 0 as follows:\n\n```java\ndouble\
    \ total;\nint n;\n\nn = data.length;\ntotal = data[0];\n```\n"
  mdcn: "\n因为你并不总是需要重新提示。事实情况比这稍微复杂一点。\n\n# 思考问题\n\n事实证明，这个问题有两个不同的版本。在第一种版本中，初始提示和后续提示（即在用户提供无效响应后）是相同的。在第二种版本中，初始提示与后续提示是不同的。这意味着在第一个版本的解决方案中使用\
    \ `do` 循环是合适的，而在第二个版本的解决方案中使用 `while` 循环是合适的。\n\n# 模式\n\n解决这个问题第一个版本的模式可以描述如下：\n\
    \n- 1. 进入 `do` 循环。在循环体中：\n  1.1. 提示用户。\n  1.2. 获取用户的响应。\n- 2. 当响应无效时，重复。\n\n解决这个问题第二个版本的模式描述如下：\n\
    \n- 1. 使用普通消息提示用户。\n- 2. 获取用户的响应。\n- 3. 当响应无效时，进入 `while` 循环。\n  3.1. 使用交替消息提示用户。\n\
    \  3.2. 获取响应。\n- 4. 重复。\n\n# 示例\n\n在以下示例中，用户被要求输入一个年龄，该年龄必须是非负数才有效。在第一个版本中，用户始终收到相同的提示：\n\
    \n```\nSystem.out.printf(\"Enter a non-negative age: \");\nage = scanner.nextInt();\n\
    while (age < 0) {\n```\n\n在第二个版本中，只有在提供无效响应后，用户才被告知年龄必须是非负数：\n\n```\nSystem.out.printf(\"\
    Enter your age: \");\nage = scanner.nextInt();\nwhile (age < 0) {\n  System.out.printf(\"\
    \ Enter a non-negative value: \");\n  age = scanner.nextInt();\n}\n```\n\n注意，通常情况下，用户有许多方式做出不当响应，而不只是输入负数。例如，用户可以输入一个过大的数字，或者在需要整数时输入非整数。在所有这些情况下，模式都保持不变，改变的是循环中的布尔表达式（可能还包括读取响应的方式）。\n\
    \n# 累加器\n\n在某些情况下，循环的迭代之间是相互独立的。然而，在许多情况下，程序需要在多次迭代过程中“跟踪”某些东西。在这些情况下，累加器通常派上用场。\n\
    \n# 动机\n\n如果你在“街上”问某人如何手动计算一列数字，他们可能会说“把它们加起来就行”。如果你让他们演示一组五十个单位数的列，他们可能不会有任何困难。然而，如果你在他们操作时与他们聊天（特别是如果你在对话中随口提到一些数字），他们会觉得困难得多，并且可能无法完成所有计算。\n\
    \n如果你接着建议他们在操作过程中“把事情写下来”，那么很有可能他们不知道你的意思，并且/或不知道这会有什么帮助。原因是，在相加单位数字时，人们既用大脑来计算数字对的加和，又用大脑来存储结果，他们无法想象如何使用纸进行存储。然而，正如你所知的，编写程序时你必须仔细区分这两者。\n\
    \n# 复习\n\n假设你需要编写一个处理数字数组（例如，`double` 类型值）中所有元素的程序。你会立即意识到你需要使用循环。希望这是一个确定的（或明确的）循环（即迭代次数是知的），你也会意识到应该使用\
    \ `for` 循环。\n\n例如，给定一个名为 `data` 包含 `n` 个元素的数组，你可以从如下代码开始：\n\n```\nfor (int i =\
    \ 0; i < n; i++) {\n    // 对 data[i] 执行某些操作\n}\n```\n\n回到计算总和的程序，你需要考虑对数组的每个元素（即示例中的每个\
    \ `data[i]`）需要做什么，以便计算出总和。\n\n# 思考问题\n\n回到街上的那个人，假设你再次要求他们找到五十个单位数的和，并描述他们在操作时正在做什么。进一步假设数字从\
    \ 7、3 和 2 开始。最可能的是，他们会说类似“7 加 3 等于 10，加 2 等于 12……”。也就是说，他们将使用通常被称为“运行总和”（running\
    \ total）。\n\n如果你现在向他们指出这一点，他们可以使用一张纸来存储运行总和，而不是使用大脑。这正是你在编写用于此目的的程序时需要使用的相同技术。也就是说，你需要一个称为“累加器”的变量来存储运行总和。\n\
    \n# 模式\n\n累加器模式涉及声明一个适当类型的变量，其中可以存储运行值，将该变量初始化为适当的值，然后使用第一章中的更新模式在每次迭代中（可能）改变该值。\n\
    \n# 在寻找 `double` 数组之和的背景下，该模式实现如下：\n\n```\ndouble total;\nint n;\n\nn = data.length;\n\
    total = 0;\n\nfor (int i = 0; i < n; i++) {\n    total += data[i];\n}\n```\n\n\
    在此实现中，`total` 被声明为 `double`，初始化为 `0`，并进行迭代。累加器可以是任何类型，并用于许多用途。除了求和，数值累加器可以用于许多用途。\n\
    \n布尔累加器通常用于包含检查（例如，确定数组是否包含某个值）。以下示例确定是否包含 `target`：\n\n```\nboolean found;\n\
    int n;\n\nn = data.length;\nfound = false;\n\nfor (int i = 0; i < n; i++) {\n\
    \    if (target == data[i]) found = true;\n}\n```\n\n这里的累加器是布尔类型的 `found`。需要注意的是，当\
    \ `target` 不等于 `data[i]` 时该方法不会给 `found` 赋值。\n\n# 多个累加器示例\n\n有时在同一个循环中使用两个累加器是方便甚至是必要的。在以下示例中，一个累加器\
    \ `total` 包含运行总和，另一个累加器 `lowest` 包含最小值：\n\n```\ndouble lowest, result, total;\n\
    int n;\n\nn = data.length;\ntotal = 0.0;\nlowest = Double.POSITIVE_INFINITY;\n\
    \nfor (int i = 0; i < n; i++) {\n    total += data[i];\n    if (data[i] < lowest)\
    \ lowest = data[i];\n}\nresult = (total - lowest) / (n - 1);\n```\n\n另一个示例，假设你想寻找不是数组的最大值，而是最大元素的索引（通常称为\
    \ `argmax`）。实现此点的方法是使用一个累加器跟踪最大值，另一个累加器跟踪其索引，如下：\n\n```\ndouble maximum;\nint\
    \ index, n;\n\nn = data.length;\nmaximum = Double.NEGATIVE_INFINITY;\nindex =\
    \ -1;\n\nfor (int i = 0; i < n; i++) {\n    if (data[i] > maximum) {\n       \
    \ index = i;\n        maximum = data[i];\n    }\n}\n```\n\n# ## 警告\n\n有些人喜欢将累加器初始化为“更智能”的值。例如，在计算运行总和时，有些人喜欢将累加器初始化为数组的第\
    \ 0 个元素，而不是 0，如下：\n\n```java\ndouble total;\nint n;\n\nn = data.length;\ntotal\
    \ = data[0];\n```\n"
