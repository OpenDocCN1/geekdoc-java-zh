    \n## 思考问题\n\n假设行的宽度为 9 个字符，且从 0 开始计数（即第一个字符位于位置 0）。那么，你知道行的中间字符的索引为 4（即 `9 / 2`，使用整数除法），因为索引\
    \ 4 的左侧有 4 个字符，右侧也有 4 个字符。\n\n进一步假设文本宽度为 5 个字符，且从 0 开始计数。那么，你知道文本的中间字符的索引为 2（即\
