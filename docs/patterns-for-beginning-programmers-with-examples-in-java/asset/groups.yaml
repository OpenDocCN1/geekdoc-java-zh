    \n# 编程模式 xiii\n\n在很多情况下，模式是相互构建的。因此，除少数例外，书的各个部分需要按顺序考虑。遗憾的是，由于不同的编程课程/教材涵盖这些主题的顺序不同，可能我们需要对某些章节进行粗略了解，然后再回来查看。例如，某些课程/教材在数组之前介绍方法（如本书所示），而另一些则顺序相反。因此，可能有必要在学习方法之后再略读第三部分中的某些模式。\n\
