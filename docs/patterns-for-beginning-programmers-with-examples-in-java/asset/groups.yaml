    \ miles corresponds to $0/3$ (i.e. 0 laps), 1 mile corresponds to $1/3$ (i.e.\
    \ 0 laps), 7 miles corresponds to $7/3$ (i.e. 2 laps), 9 miles corresponds to\
    \ $9/3$ (i.e. 3 laps, etc.\n\nGiven this observation, you might think that all\
    \ you need to do is add one to the number of completions, and a few tests might\
    \ convince you that this is, indeed, the case. For example, 7 miles over a 3 mile\
