  mdcn: "\n\n本章的示例假设容器（在所有维度上）足够大以容纳内容。如果情况并非如此，内容可能需要裁剪以适应容器。幸运的是，这种操作的逻辑非常直观。\n\n\
    [22]\n\n# 字符串的分隔\n\n许多程序（无论是文本用户界面还是图形用户界面）都需要将一个 `String` 对象数组组合成单个 `String`\
    \ 对象，并在每对元素之间包含一个分隔符。\n\n# 动机\n\n假设你想从一个包含 \"Rain\"、Sleet,\" 和 \"Snow\" 元素的 `String[]`\
    \ 生成字符串对象 \"Rain, Sleet, Snow\"。考虑预期结果的第一种方式是：每对元素之间都有一个逗号（分隔符）。第二种方式是：除了最后一个项目外，每个项目后面都有一个逗号。第三种方式是：除了第一个项目外，每个项目前面都有一个逗号。事实证明，每种方式都会导致不同的实现方法。\n\
    \n# 复习\n\n由于你将遍历 `String[]` 数组并单独考虑每个元素，第一种概念化处理起来有点笨拙。具体来说，在每次迭代中，你都需要同时考虑元素\
    \ `i` 和 `i-1` 或 `i+1`。\n\n如果你处理索引 `i-1`，你将需要确保有两个元素，并将循环控制变量初始化为 1。如果你处理索引 `i+1`，则需要确保有两个元素，并在数组长度减\
    \ 2 处终止循环。这两者并非不可能，但如果可以避免，它们似乎都显得过于复杂。幸运的是，另外两种概念化都要求你使用累加器（在第 13 章中讨论）一次处理一个元素，因此第一种概念化将被忽略。\n\
    \n# 思考问题\n\n另外两种概念化的区别在于：一种是在将元素连接到累加器之后添加分隔符，另一种是在将元素连接到累加器之前添加分隔符。\n\n# 追加分隔符\n\
    \n第二种概念化要求你在除最后一个项目之外的每个项目之后添加分隔符。假设 `item` 包含 `String[]`，`delim` 包含分隔符，可以如下实现：\n\
    \n```java\n// 需要时追加分隔符\nresult = \"\";\nfor (int i = 0; i < item.length; ++i)\
    \ {\n    result += item[i];\n    if (i < item.length - 1) {\n        result +=\
    \ delim;\n    }\n}\n```\n\n也可以将长度为 1 的数组视为特殊情况，相应地初始化累加器，然后像下面的实现所示，从元素 1 开始：\n\
    \n```java\n// 需要时追加分隔符，根据长度\n// 初始化累加器\nif (item.length > 1) {\n    result = item[0]\
    \ + delim;\n} else if (item.length > 0) {\n    result = item[0];\n} else {\n \
    \   result = \"\"\n}\n```\n\n```java\nfor (int i = 1; i < item.length - 1; ++i)\
    \ {\n    result += item[i];\n    result += delim;\n}\nif (item.length > 1) {\n\
    \    result += item[item.length - 1];\n}\n```\n\n这消除了在循环中使用 `if` 语句的需求。\n\n# 前置分隔符\n\
    \n第三种概念化要求你在除第一个项目之外的每个项目之前前置分隔符。可以如下实现：\n\n```java\n// 需要时前置分隔符\nresult = \"\"\
    ;\nfor (int i = 0; i < item.length; ++i) {\n    if (i > 0) {\n        result +=\
