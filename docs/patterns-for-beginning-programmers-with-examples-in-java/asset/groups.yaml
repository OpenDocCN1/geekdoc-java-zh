  - '[PAGE 57]


    [7]


    # Indicator Methods


    Sometimes the value needed to perform a calculation is known, and other times
    it too must be calculated. This is true of both “traditional” values and indicators
    (of the kind discussed in Chapter 6). This chapter considers problems in which
    an indicator’s value must be calculated before it can be used in another expression.


    # Motivation


    There''s a famous saying among performers, “the show must go on”, which means
    there must be a show whenever there’s an audience. In the context of Chapter 6
    on indicators, this means that the number of seats sold for a particular show
    must be used to calculate an indicator, setting it to 0 when no tickets have been
    sold and setting it to 1 otherwise. This is an example of a threshold indicator
    in which the threshold is 1.


    So, given that some number of tickets has been sold for a particular show time,
    you must determine the number of shows that must be offered at that time (i.e.,
    either 0 or 1). Letting shows denote the number of shows and sold denote the number
    of tickets sold, you want to calculate shows from sold in such a way that it takes
    the value 0 when sold is 0 and it takes on the value 1 for all positive values
    of sold.'
  - "[PAGE 58]\n\n# Review\n\nYou could, of course, calculate the value of the variable\
    \ shows as follows:\n\n```\nif (sold >= 1) {\n    shows = 1;\n} else {\n    shows\
    \ = 0;\n}\n```\n\nHowever, you should also know that this is a bad practice, since\
    \ it is likely that you will need to use this simple algorithm in more than one\
    \ place. Hence, to avoid code duplication, you should instead write a method like\
    \ the following:\n\n```\npublic static int shows(int sold) {\n    if (sold >=\
    \ 1) {\n        return 1;\n    } else {\n        return 0;\n    }\n```\n\nand\
    \ use it as needed.\n\n# The Pattern\n\nThe entertainment example is, obviously,\
    \ a very particular problem. However, it can be easily generalized to uncover\
    \ a pattern. In particular, the entertainment problem is a particular example\
    \ of a general problem in which you need to determine whether a particular value\
    \ exceeds a particular threshold. Further, there is an even more general problem\
    \ in which you need a method that returns a value of 0 or 1 based on the value\
    \ of the parameters it passed.\n\nFor threshold indicators, the solution to the\
    \ problem is the following method:\n\n```\npublic static int indicator(int value,\
    \ int threshold) {\n    if (value >= threshold) {\n        return 1;\n    } else\
    \ {\n        return 0;\n    }\n}\n```"
  - '[PAGE 59]


    For other indicators, the solution is a method with parameters that vary with
    the specifics of the problem.


    # Examples


    It''s useful to consider examples of both threshold indicators and other indicators.


    # Threshold Indicators


    Continuing with the entertainment example, the threshold is 1 (i.e., if the size
    of the audience is 1 or more than to be a show), given the size of the audience
    (represented by the variable size), the number of shows is given by the following:


    ```

    shows = indicator(sold, 1);

    ```


    Returning to the parking ticket example used in Chapter 6, letting the number
    of prior tickets be given by priors, the fine can be calculated as follows:


    ```

    baseFine = 10.00;

    repeatOffenderPenalty = 35.00;

    totalFine = baseFine + (indicator(priors, 1) * repeatOffenderPenalty);

    ```


    It is also instructive to return to the car rental example from Chapter 6. For
    this example, you can initialize the necessary variables as follows:


    ```

    baseRate = 19.95;

    ageSurcharge = 10.00;

    ageThreshold = 25;

    multiSurcharge = 5.00;

    multifreshold = 1;

    ```


    Then, you can calculate the daily rate as follows:


    ```

    rate = baseRate

    + (1 - indicator(minimumAge, ageThreshold)) * ageSurcharge

    + indicator(extraDrivers, multiThreshold) * multiSurcharge;

    ```


    Notice that, the age surcharge uses a converse indicator while the multi-driver
    surcharge uses an ordinary threshold indicator.'
