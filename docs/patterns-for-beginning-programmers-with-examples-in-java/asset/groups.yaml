  mdcn: "\n\n# 输出参数 (Outbound Parameters)\n\n尽管在入门编程课程中并不总是被讨论，但参数可以用于向方法传递信息（即输入参数）、从方法传递信息（即输出参数），或两者兼顾（即输入/输出参数）。虽然某些编程语言对此显式地规定了区分，但\
    \ Java 并没有。\n\n# 动机\n\n在 Java 中，方法只能返回一个值或引用，这有时是不方便的。例如，假设你想写一个方法，接收一个 `double[]`\
