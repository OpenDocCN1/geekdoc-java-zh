  - "[PAGE 93]\n\n# In the context of finding the sum of an array of double values,\
    \ this pattern is realized as follows:\n\n```\ndouble total;\nint n;\n\nn = data.length;\n\
    total = 0.0;\n\nfor (int i = 0; i < n; i++) {\n    total += data[i];\n}\n```\n\
    \nIn this realization, total is declared to be a double because the sum of an\
    \ array of double values is a double, it is initialized to 0 because the sum of\
    \ an array containing no elements is zero, and at each iteration total is increased\
    \ by the value of data[i].\n\n# Examples\n\nAn accumulator can be of almost any\
    \ type and can be used for a variety of different purposes. Several examples should\
    \ make the flexibility of this pattern apparent.\n\n# Numeric Examples\n\nIn addition\
    \ to finding the sum, numeric accumulators can be used for many other purposes.\
    \ For example, you can use a numeric accumulator to find either the minimum or\
    \ the maximum of an array of double values. This is illustrated for the maximum\
    \ below:\n\n```\ndouble maximum;\nint n;\n\nn = data.length;\nmaximum = Double.NEGATIVE_INFINITY;\n\
    \nfor (int i = 0; i < n; i++) {\n    if (data[i] > maximum) maximum = data[i];\n\
    }\n```\n\nThe accumulator (now named maximum) is initialized to the lower bound\
    \ of double values (which is defined in a static Double class named Double.NEGATIVE_INFINITY),\
    \ and it is only updated at iteration"
  - "[PAGE 94]\n\n# 78 David Bernstein\n\nif data[i] is greater than the running maximum\
    \ that has been found so far.\n\n# Boolean Examples\n\nBoolean accumulators are\
    \ commonly used for containment checks (i.e., to determine if an array contains\
    \ a particular value). The following example determines if the double value named\
    \ target equals any element of the double array named data:\n\n```\nboolean find;\n\
    int n;\n\ndata = data.length;\nfound = false;\n\nfor (int i = 0; (i < n) && !found);\
    \ i++) {\n    if (target == data[i]) found = true;\n}\n```\n\nThe accumulator\
    \ in this case is the boolean variable named found. It is important to note that\
    \ this method does not assign false to found when target does not equal data[i],\
    \ as this is the default value of found. Note also, though it isn't necessary\
    \ to do so, this method breaks out of the loop so soon as found is true. Other\
    \ words, it only iterates as long as both i < n evaluates to true and found evaluates\
    \ to true.\n\n# Examples with Multiple Accumulators\n\nSometimes it is convenient\
    \ or even necessary to use two accumulators in the same loop. In the following\
    \ example, one accumulator total contains the running total, and another accumulator\
    \ lowest contains the running minimum:\n\n```\ndouble lowest, result, total;\n\
    int n;\n\ndata = data.length;\ntotal = 0.0;\nlowest = Double.POSITIVE_INFINITY;\n\
    ```\n\n+   1. If you know about the break statement, you could also use it in\
    \ the body of the if statement to break out of the loop."
