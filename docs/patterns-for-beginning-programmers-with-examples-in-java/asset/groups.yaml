    # Centering


    any applications need to center content (of some kind) inside a container (of
    some kind). Though the content and the containers can vary dramatically, the pattern
    used to do the centering is very consistent.


    # Motivation


    Suppose you have some text that you need to display on the console, centered on
    the line containing it. Since the console (typically) uses a fixed-width font,
    the width of every character (measured in pixels) is the same. As a result, the
    width of the text and the width of the line can be measured in characters. Your
    objective, then, is to determine the column of the line that should contain the
    first character of the text.


    # Review


    The text in this example is going to be represented as a String object. So, you
    you can use its length() method to determine the number of characters in it. Unfortunately,
    you have no way of specifying the column of the display to print when writing
