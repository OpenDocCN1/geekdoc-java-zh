    # Some Warnings


    The pattern above can be used in a wide variety of situations, but there are some
    things that you should be aware of.


    # Coordinate Systems


    All of the figures and examples in this chapter use Euclidean coordinates in which
    the horizontal coordinates increase from left to right, and the vertical coordinates
    increase from bottom to top. However, computer graphics tend to use screen coordinates
    in which the horizontal coordinates increase from left to right but the **vertical
    coordinates increase from top to bottom**. This means that the sign of the adjustments
    in the vertical dimension must be negated.


