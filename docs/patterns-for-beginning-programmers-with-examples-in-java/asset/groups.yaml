    ```\n\nHowever, if you are interested in invocation chaining, these methods must,\
    \ instead, return a reference to the owning object, as in the following implementation:\n\
    \n```\npublic class Robot {\n    private int x, y;\n\n    public Robot() {\n \
    \       x = 0; y = 0;\n    }\n\n    public Robot moveBackward() {\n        y--;\n\
    \        return this;\n    }\n\n    public Robot moveForward() {\n        y++;\n\
    \        return this;\n    }\n\n    public Robot moveLeft() {\n        x--;\n\
    \        return this;\n    }\n\n    public Robot moveRight() {\n        x++;\n\
