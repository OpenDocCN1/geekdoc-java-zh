    | | 1 Shirts |

    | 1 Socks | 0 Dresses |

    | | 1 Shirts |

    | 2 Pants | 0 Dresses |

    | | 1 Shirts |

    | 3 Skirts | 0 Dresses |

    | | 1 Shirts |


    In iteration 1 of outer iteration 0 the method determines that "Shirts" have been
    packed, and increases count to 1. However, none of the inner iterations for outer
    iteration 1 correspond to "Socks", none of the inner iterations for outer iteration
    2 correspond to "Pants", and none of the inner iterations for outer iteration
    3 correspond to "Skirts". So, count is never increased to z, and the method returns
    false.


    ## Looking Ahead


    Though thought was given to the efficiency of the algorithms above, many issues
    were ignored, and none were considered formally. If you take a course on data
    structures and algorithms, you will consider these kinds of issues in detail.
    For example, it is interesting to ask whether it is better to sort checklist and/or
    accomplished, either partially or completely. It is also interesting to ask whether
    it is possible to create a more efficient algorithm when the checklist consists
    of sequential integers.

