- md: "\n# Segmented Arrays\n\nRecall that Chapter 17, on conformal arrays, discusses\
    \ how multiple arrays can be used to organize records containing different fields\
    \ (or tables containing rows and columns). This chapter considers a special case\
    \ of this problem in which all of the elements of the records and fields (or rows\
    \ or columns) are of the same type.\n\n# Motivation\n\nSuppose you are working\
    \ for a medical researcher who has collected data on the heights and weights of\
    \ a variety of different people. You know from Chapter 17 that you could use two\
    \ conformal arrays for this purpose, one containing the heights and one containing\
    \ the weights (with the index used to identify the individual). However, since\
    \ all of the measurements are double values, it's also possible to organize them\
    \ in one array. Such an array is said to be segmented (or packed).\n\n# Review\n\
    \nSuppose you have two arrays of the same size, of which one array with twice\
    \ as many elements could, obviously, hold all of the values in the two arrays.\
    \ For example, suppose you have the following two arrays (each of length 4):\n\
    \n```\ndouble[] heights = { 60.0, 62.0, 65.0, 70.0 };\ndouble[] weights = { 100.0,\
    \ 110.0, 120.0, 140.0 };\n```\n\nThen, you could store all of the elements of\
    \ both arrays in an array of length 8.\n\nIf you could create an algorithm for\
    \ finding/calculating the appropriate index, you could use this single array instead\
    \ of the two individual arrays. Of course, the algorithm for finding/calculating\
    \ the appropriate index is intimately related to the way in which the single array\
    \ is organized. So, the two issues must be considered together.\n\n# Thinking\
    \ About The Problem\n\nWhile there are many ways of putting the elements from\
    \ two arrays into one array (twice the size), there are two that are particularly\
    \ sensible. Each deserves some consideration.\n\nIn the first, you would concatenate\
    \ the two arrays. That is, you would put the elements of one after the elements\
    \ of the other. This could be accomplished as follows:\n\n```\nint n = 4;\nfor\
    \ (int i = 0; i < n; i++) {\n  concatenated[i] = height[i];\n}\nfor (int i = 0;\
    \ i < n; i++) {\n  concatenated[n + i] = weight[i];\n}\n```\n\nThe first loop\
    \ assigns element i of height to element i of concatenated, and the second loop\
    \ assigns element i of weight to element n+i of concatenated. In other words,\
    \ the first loop assigns the four elements of height to the first four elements\
    \ of concatenated, and the second loop assigns the four elements of weight to\
    \ the last four elements of concatenated.\n\n| Index: 0 | 1 | 2 | 3 | 4 | 5 |\
    \ 6 | 7 |\n|---|---|---|---|---|---|---|---||\n| 60.0 | 62.0 | 65.0 | 70.0 | 100.0\
    \ | 110.0 | 120.0 | 140.0 |\n\n- 1. Which comes first doesn't matter, as long\
    \ as you are consistent.\n\n# Figure 18.1. The Result of Concatenating two Arrays\n\
    \nThough it's not central to the point of this chapter, it should be clear to\
    \ you that this same algorithm could be implemented with a single loop as follows:\n\
    \n```\nint n = 4;\nfor (int i = 0; i < n; i++) {\n    concatenated[i] = height[i];\n\
    \    concatenated[n + i] = weight[i];\n}\n```\n\nRegardless of the implementation,\
    \ the end result is an array that is organized as in Figure 18.1.\n\nIn the second,\
    \ you would interleave the two arrays. That is, you would alternate elements from\
    \ the two arrays. This could be accomplished as follows:\n\n```\nint n = 4;\n\
    for (int i = 0; i < n; i++) {\n    interleaved[2 * i] = height[i];\n    interleaved[2\
    \ * i + 1] = weight[i];\n}\n```\n\nThe first statement in the loop assigns elements\
    \ 0, 1, 2, and 3 (i.e., the values of i) of height to elements 0, 2, 4, and 6\
    \ (i.e., the values of 2*i) of interleaved. The second statement in the loop assigns\
    \ 0, 1, 2, and 3 (i.e., the values of i) of weight to elements 1, 3, 5, and 7\
    \ (i.e., the values of 2*i+1) of interleaved. The end result is an array that\
    \ is organized in Figure 18.2.\n\n| Index | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 |\n\
    |---|---|---|---|---|---|---|---|\n| 60.0 | 100.0 | 62.0 | 110.0 | 65.0 | 120.0\
    \ | 70.0 | 140.0 |\n\n# Figure 18.2. The Result of Interleaving two Arrays\n\n\
    While both of these approaches work, the interleaved approach is more appropriate\
    \ for the problem at hand. To see why, which comes first doesn't matter, as long\
    \ as you are consistent, consider Figure 18.3, which contains a more abstract\
    \ conceptualization of the array in Figure 18.2. When interleaved, the fields\
    \ of each record are kept together, making it easier to visualize the segmented\
    \ array.\n\n| Index: | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 |\n|---|---|---|---|---|---|---|---|\n\
    | | height | weight | height | weight | height | weight | height | weight |\n\
    | | Person 0 | | Person 1 | | Person 2 | | Person 3 | |\n\nFigure 18.3. Conceptualizing\
    \ the Interleaved Array of Weights and Heights\n\nIn general, if `recordSize`\
    \ denote the number of fields in each record, `record` denote the record of interest\
    \ (0-based), `field` denote the field of interest (also 0-based), and `index`\
    \ denote the index of the element in the segmented array, then you can easily\
    \ convert back and forth between the two approaches.\n\nFirst, given the `record`\
    \ and `field`, you can calculate the `index` as follows:\n\n```\nindex = record\
    \ * recordSize + field;\n```\n\nSecond, given the `index`, you can calculate the\
    \ `record` and `field` as follows:\n\n```\nrecord = index / recordSize;\nfield\
    \ = index % recordSize;\n```\n\nNote that this algorithm uses the techniques for\
    \ arithmetic from Chapter 4.\n\n# Examples\n\nSegmented arrays are most frequently\
    \ used with `String` objects because they can be used to represent many data types.\
    \ One very common involves command-line arguments. Recall that the `main()` method\
    \ of a Java application has a single `String[]` parameter named `args`. When an\
    \ application is executed from the command line, all of the String objects after\
    \ the name of the class are passed to the `main()` method using this array. For\
    \ example, given the following method:\n\n```java\npublic static int toIndex(int\
    \ record, int field, int recordSize) {\n    return record * recordSize + field;\n\
    }\n```\n\nyou could parse the weights and heights of multiple people into `main()`\
    \ as an interleaved array to \"extract\" information as needed. For example, if\
    \ you wanted to assign the weight and height of person 1 to the variables `w`\
    \ and `h`, respectively, you could do as follows:\n\n```\nh = Double.parseDouble(args[toIndex(1,\
    \ 0, 2)]);\nw = Double.parseDouble(args[toIndex(1, 1, 2)]);\n```\n\ntoIndex(1,\
    \ 0, 2) evaluates to 2 of args (i.e., \"62.0\" using the data from Figure 18.2)\
    \ would be passed to `parseDouble()`, and 62.0 would be assigned to `h`. Similarly,\
    \ toIndex(1, 1, 2) evaluates to 3, so element 3 of args (i.e., \"110.0\" using\
    \ the data from Figure 18.2) would be passed to `w`. You could include the same\
    \ logic in a loop and extract all of the weights and heights in the command-line\
    \ arrays as follows:\n\n```\nint recordSize = 2;\nint records = args.length /\
    \ recordSize;\n\nfor (int r = 0; r < records; r++) {\n    height[r] = Double.parseDouble(args[toIndex(r,\
    \ 0, recordSize)]);\n    weight[r] = Double.parseDouble(args[toIndex(r, 1, recordSize)]);\n\
    }\n```\n\nYou could then work with the conformal arrays height and weight as you\
    \ did in Chapter 17.\n\n# Looking Ahead\n\nIf you take a course on systems programming\
    \ you will probably work with packed integers, a pattern that is related to segmented/packed\
    \ arrays. The difference is that, rather than working with the elements of an\
