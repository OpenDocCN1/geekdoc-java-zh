    # Examples


    The arithmetic on the circle pattern arises in a wide variety of situations, some
    obvious and some less obvious.


    # Some Obvious Examples


    The most obvious example in which arithmetic is performed on a circle is the circular,
    analog clock (which even looks like a number circle). Indeed, this is exactly
    the number circle in Figure 4.4, except that noon and midnight are represented
    as 0 instead of 12. To avoid both this potential source of confusion and the AM/PM
    issue, consider, instead, a clock that uses military time. In such a clock, midnight
    is “0 hundred hours”, eleven in the morning is “11 hundred hours”, five in the
    evening is “17 hundred hours”, etc. Such a clock is illustrated in Figure 4.6.'
  - '[PAGE 43]


    ![](img/fc01fd61514199fc6ea175e763677f2b_43_0.png)


    Some questions involving such a clock are easy to answer. For example, suppose
    it is currently 5 hundred hours, what time will it be in 8 hours? This doesn''t
    require any answer; you can use traditional addition to determine that the answer
    is 13 hundred hours. However, some are more difficult. For example, suppose it
    is currently 17 hundred hours, what time will it be in 12 hours? Unfortunately,
    traditional addition is no longer enough to solve this problem. Obviously, the
    answer isn''t 29 hundred hours, because there is no such time. Instead, you have
    to account for the fact that you''ve advanced a day. Even worse, suppose it is
    17 hundred hours and you want to know the time 93 hours from now. Then, you have
    to account for the fact that you have advanced several days.


    Using the arithmetic on the circle pattern, 17 hundred hours plus 12 hours can
    be thought of (using integer arithmetic) as a'
  - '[PAGE 44]


    # 28 David Bernstein


    passes of ((17 + 12) / 24) / 29 / 24 or 1 (i.e., one time around the circle),
    with a remainder of ((17 + 24) % 24) or 29 % 24 or 5 (i.e., five additional ticks).
    Similarly, for 17 hundred hours plus 93 hours:


    ```

    remainder = (17 + 93) % 24;

    ```


    which is 110 % 24 or 14.

    As another example, consider weights. In the United States, weights are measured
    in pounds and ounces, and the ounces are constrained to be in the half-open interval
    [0, 16). So, if you have 9 ounces of gold, and someone gives you 14 ounces of
    gold, you don''t normally say you have 23 ounces of gold, instead you say that
    you have 1 pound and 7 ounces of gold. In other words, the value of current is
    9, the value of change is 14, the value of cardinality is 16:


    ```

    passes = (9 + 14) / 16;

    remainder = (9 + 14) % 16;

    ```


    which means passes is 23 / 16 or 1 pound, and remainder is 23 % 16 or 7 ounces.


    # Less Obvious Examples


    As shown above, arithmetic on the circle can be used with values that are naturally
    numeric, but they can also be used with categories. One common application is
    to determine the day of the week some number of days in the future. The set of
    days of the week (i.e., Sunday, Monday, Tuesday, Wednesday, Thursday, Friday,
    and Saturday) has a cardinality of 7. Using a 0-based numbering scheme, you can
    denote Sunday by 0, Monday by 1, etc. Then, if it is currently Wednesday (i.e.,
    day of the week 3), you can determine the day of the week 6 days in the future:


    ```

    remainder = (3 + 6) % 7;

    ```


    which is 9 % 7 or 2 (i.e., Tuesday). Similarly, the day of the week 516 days in
    the future is:


    ```

    remainder = (3 + 516) % 7;

    ```


    which is 519 % 7 or 1 (i.e., Monday). Obviously, the same thing can be done for
    months of the year. This set has a cardinality of'
  - '[PAGE 45]


    12 and a 0-based numbering scheme would assign 0 to January, 1 to February, etc.


    Less obviously, perhaps, this pattern can be used for categories that are not
    normally numbered. For example, suppose you want to know whether a number is even
    or odd (a set with cardinality of two). Letting 0 denote the even numbers and
    1 denote the odd numbers, you can determine whether the sum of two numbers, current
    and change, is even or odd using:


    ```

    remainder = (current + change) % 2;

    ```


    Further, since change can be zero, you can determine whether the number current
    is even or odd using:


    ```

    remainder = current % 2;

    ```


    which makes sense since a number is even if it is divisible by two with no remainder
    (sometimes called “evenly divisible by two”).

    nThis pattern can also be used for such things as determining which player’s turn
    it is in a game, how to cycle through a fixed set of colors in a drawing program,
    etc. Indeed, this pattern arises so frequently that it is virtually indispensable.'
  - '[PAGE 46]


    [5]


    # Truncation


    Integers commonly include more digits of accuracy needed. In some situations,
    the right way to deal with this is using truncation. Truncation problems can be
    solved by dropping the right-most digits using the techniques from Chapter 3 on
    digit manipulation and then multiplying.


    # Motivation


    Suppose you have to write a payroll program for a manufacturing company. The employees
    at the company get paid a fixed amount per piece, but only for multiples of ten
    pieces. For inventory purposes, the company keeps track of the exact number of
    pieces completed, for payroll purposes, that number has more digits of accuracy
    than is needed. For example, if the employee completes 520 pieces, 521 pieces,
    or 529 pieces, they are going to be paid for 520 pieces. Hence, the payroll system
    you are writing must truncate the actual number of pieces produced to the second
    digit (i.e., the 10s place).


    # Review


    If the person were being paid per completed batch of ten pieces (rather than per
    piece), then you would only need to determine the number of completed batches.
    Since there are 10 pieces per batch, you could accomplish this by dropping the'
  - '[PAGE 47]


    right-most digit. Further, you know from the discussion of digit manipulation
    in Chapter 3 that this can be accomplished by dividing by $10^1$ (using integer
    division).


    For example, letting number denote the actual number produced (at full accuracy):


    ```

    batches = number / 10;

    ```


    where / denotes integer division. So, an employee that completed 526 pieces completed
    52 batches (ignoring the remaining 6 pieces).


    # Thinking About the Problem


    Unfortunately, what you need is not the number of batches but, instead, the number
    of truncated to the 10s place. Fortunately, given the number of batches, you can
    calculate this pretty easily. In particular:


    ```

    truncated = batches * 10;

    ```


    So, continuing with the example, the 52 batches corresponds to 520 units truncated
    to the 10s place.


    # The Pattern


    It turns out there''s nothing special about the 10s place, so the general pattern
    is Letting denote the integer place to truncate (i.e., 10 for the 10s place, 100
    for the 100s place, etc.), then the value truncated to that place is by:


    ```

    truncated = (number / place) * place;

    ```


    where / again aspect of this pattern is that it illustrates


    One important aspect of this pattern is that it illustrates the importance of
    not over-generalizing. In particular, at first glance, you might think that the
    expression (number / place) * place could be simplified to number. However, this
    is not the case when using integer division. Specifically, when using integer
    division, (a / b) * b only equals a when a is evenly divisible by b. For example,
    as discussed above, (526 / 10) * 10 is equal to 52 * 10 or 520, which does not
    equal 526.'
  - '[PAGE 48]


    # Examples


    Suppose you want to talk about something that will happen 87 years after the year
    1996. You might want to use the exact year (i.e., 1996 + 87 or 2083), but you
    might want to know the decade or century rather than year. Truncating to the decade
    (i.e, a place of 10) using the truncation pattern yields (2083 / 10) * 10 or 208
    * 2080. Similarly, truncating to the century (i.e., a place of 100) using the
    truncation pattern yields (2083 / 100) * 100 or 20 * 2000.


    # Some Warnings


    It''s important to note that people use the word "truncation" in a variety of
    different, but related, ways. Most importantly, people often talk about truncating
    floating point values to integer values (e.g., truncating 3.14 to 3), which is
    commonly accomplished using a type cast (e.g., (int)3.14 evaluates to 3). Our
    concern here is with a different notion of truncation.


    It''s also important to distinguish between the accuracy used when performing
    calculations and the accuracy (or format) used when displaying output. In some
    situations it is necessary to perform calculations using truncated values. In
    other situations it is necessary to perform calculations using all of the digits
    of accuracy available and truncate at the end. In other situations it is necessary
    to perform calculations using all of the digits of accuracy available and then
    format the output when it is displayed. It is your responsibility to know what
    is required of a particular section of code.'
- md: "\n# Patterns Requiring Knowledge of Logical and Relational Operators, Conditions,\
    \ and Methods\n\nPart II contains programming patterns that require understanding\
    \ of logical operators, relational operators, conditions, and methods. Specifically,\
    \ this part of the book contains the following programming patterns:\n\n- Indicators.\
    \ Solutions to problems in which a binary variable is used to determine whether\
    \ or not another variable should be increased/decreased by an amount/percentage.\n\
    - Indicator Methods. Solutions to problems in which an indicator must be calculated\
    \ before it can be used.\n- Round. Solutions to the problem of rounding (rather\
    \ than truncating) an integer to a particular digit (i.e., power of 10).\n- Starts\
    \ and Completions. Solutions to problems that require the number of tasks started\
    \ and/or completed given a measure of work and an amount of work per task.\n-\
    \ Bit Flags. Solutions to problems in which the flow of a program needs to be\
    \ controlled based on the state of one or more binary values.\n- **Digit Counting.**\
    \ A solution to the problem of determining the number of digits in an integer.\n\
    \nSome of the patterns in this part of the book don't make direct use of the prerequisite\
    \ concepts but alternative solutions do. This is true, for example, of indicators.\
    \ Some of the patterns in this part of the book make direct use of only some of\
    \ the prerequisite concepts (e.g., bit flags make use of relational operators\
    \ and digit counting makes use of methods). Other patterns in this part of the\
    \ books make direct use of all of the prerequisite concepts (e.g., indicator methods,\
    \ rounding, and starts and completions). Hence, you may be able to understand\
    \ some of these patterns before you have learned about all of the prerequisite\
    \ concepts.\n\nIt's also important to note that many of the patterns in this part\
    \ of the book make use of patterns from earlier in the book. Hence, it is important\
    \ to understand the patterns from Part I before starting on Part II.\n\nFinally,\
    \ some of the patterns in this part of the book can be thought of as specific\
    \ examples of a more abstract pattern. However, that view requires a level of\
    \ sophistication that beginning programmers may not have, so they are not presented\
    \ in that way.\n\n# Indicators\n\nAny programs must perform calculations that\
    \ vary based on conditions of one kind or another. There are many different ways\
    \ to accomplish this but one very powerful (and common) solution is to use a multiplicative\
    \ variable that takes on the value zero when the condition is not satisfied and\
    \ the value one when it is.\n\n# Motivation\n\nVariables of this kind are common\
    \ in many branches of mathematics and are called indicator variables.¹ They are\
    \ often denoted using a lowercase delta (i.e., $\\delta$), often with a subscript\
    \ to denote the condition (e.g., $\\delta_s$ to indicate whether a person smokes\
    \ or not). Indicator variables are then multiplied by other variables in more\
    \ complex expressions.\n\nFor example, suppose you are writing a program to predict\
    \ the birth weight of babies (in grams) from the gestation period (in weeks).\
    \ You might fear that the weight will be lower if the mother smokes during pregnancy.\
    \ Ignoring whether the mother did or didn't smoke, after collecting data from\
    \ a (random or representative) sample of the population, you might determine a\
    \ relationship like the following:\n$w = -2200 + 148.2g$\n\nwhere $w$ (the dependent\
    \ variable) denotes the birth weight (in grams), and $g$ (an independent variable)\
    \ denotes the gestation period (in weeks)$³$ Accounting for the mother's smoking\
    \ behavior, you might determine that the birth weight was, on average, 238.6 grams\
    \ lower when the mother smoked. You now need to decide how to account for this\
    \ in your program.\n\n# Thinking About The Problem\n\nWhat you want to do is lower\
    \ $w$ when the mother smoked and leave $w$ unchanged when the mother didn't smoke.\
    \ Since there are only two possible states (i.e., the mother smoked or didn't),\
    \ you might be tempted to use a boolean variable to keep track of this information.\
    \ However, turns out that it is better to use a discrete variable that is assigned\
    \ either 0 or 1, rather than one that takes values true or false. The reason is\
    \ that you can use a numeric variable with the multiplication operator, and you\
    \ can't do so with a boolean variable. In other words, a boolean variable cannot\
    \ be either the right-side or the left-side operand of the multiplication operator.\n\
    \nIn particular, suppose you add another independent variable, $\\delta_s$, and\
    \ assign the value 1 to $\\delta_s$ if the mother smoked during pregnancy and\
    \ assign the value 0 to $\\delta_s$ otherwise. Then, the equation for $w$ can\
    \ be expressed succinctly as follows:\n$w = -2200 + 148.2g - 238.6\\delta_s$\n\
    \nIn this way, $w$ will be reduced by 238.6 when $\\delta_s$ is 1 and will be\
    \ left unchanged when $\\delta_s$ is 0.\n\nNote that you could define the indicator\
    \ variable differently. Specifically, you could assign 1 to $\\delta_s$ if the\
    \ mother didn't smoke during pregnancy and assign 0 to it otherwise. In this case,\
    \ the equation for $w$ would be\n$w = -2438 + 148.2g + 238.6\\delta_s$\n\n# The\
    \ Pattern\n\nIn the simplest cases, all you need to do to use this pattern is\
    \ to define an indicator variable, assign 0 or 1 to it as appropriate, and then\
    \ use it multiplicatively. Which is the “original” and which is the “converse”\
    \ is arbitrary. The converse indicator must take the value 1 when the original\
    \ indicator takes 0, and vice versa. This idea can be expressed as the following:\n\
    \n```\ntotal = base + (indicator * adjustment);\n```\n\n# Examples\n\nReturning\
    \ to the birth weight example, you could use the statement to compare the birth\
    \ weights for the two values of $\\delta_s$. A $\\delta_s$ of 0 would result in\
    \ a birth weight of 3728.0 while a $\\delta_s$ of 1 would result in a birth weight\
    \ of 3489.4.\n\n```\nw = -2200 + 148.2g - 238.6delta_s;\n```\n\nAs another example,\
    \ suppose the fine associated with a first ticket is smaller than the fine associated\
    \ with subsequent tickets (specifically, $10.00 for the first and $45.00 for subsequent\
    \ tickets). In this case, if you assign 0 to tickedIndicator when the person has\
    \ prior tickets and assign 1 to it otherwise, then you can write the statement\
    \ to calculate the fine as:\n\n```\nbaseFine = 10.00;\nrepeatOffenderPenalty =\
    \ 35.00;\ntotalFine = baseFine + (tickedIndicator * repeatOffenderPenalty);\n\
    ```\n\nAs a final example, consider a rental car company that charges a rate of\
    \ $19.95 per day. There is a surcharge of $5.00 per day if multiple people drive\
    \ the car, and a surcharge of $10.00 per day if any driver is under 25 years of\
    \ age. If you assign 1 to multiIndicator when there are multiple drivers and you\
    \ assign 1 to youngIndicator when there are any drivers under 25, then you can\
    \ write the statement to calculate the rate as:\n\n```\nbaseRate = 19.95;\nageSurcharge\
    \ = 10.00;\nmultiSurcharge = 5.00;\n\nrate = baseRate + (multiIndicator * multiSurcharge)\n\
    \      + (youngIndicator * ageSurcharge);\n```\n\n# Some Warnings\n\nThe descriptions\
    \ of the examples in this chapter may have led you to use a different solution\
    \ than the one discussed above. While you may, in the end, prefer such a solution,\
    \ you should think carefully about the advantages and disadvantages before you\
    \ make any decisions.\n\nUsing if Statements\n\nYou might be attempted to use\
    \ a boolean variable, if statement, and the updating pattern from Chapter 1 rather\
    \ than\n\n---\n1. In statistics, they are sometimes called dummy variables.\n\
    2. Don't confuse this with an uppercase delta (i.e., $\\Delta$) that is often\
    \ used to denote a change.\n3. Don't be confused by the negative constant term.\
    \ This model is only appropriate for longer gestation periods, in which cases\
    \ the birth weight will be positive.\n4. You can also use a `double` variable\
    \ for the indicator if it is to be multiplied by a `double`. However, in this\
    \ situation most people agree that it is appropriate to use `int`.\n5. In programming\
    \ languages that allow them in identifiers, it is common to use the underscore\
    \ character to indicate a subscript.\n"
  mdcn: "\n\n# 需要逻辑逻辑与关系运算符、条件和方法的模式\n\n第二部分包含了需要理解逻辑运算符、关系运算符、条件和方法的编程模式。具体而言，本书的这一部分包含以下编程模式：\n\
    \n-   指标（Indicators）。解决此类问题的解决方案：即使用二值变量来决定另一个变量是否应该按金额或百分比增加/减少。\n-   指标方法（Indicator\
    \ Methods）。解决在使用指标之前必须先对其进行计算的问题的解决方案。\n-   四舍入（Round）。解决将整数四舍入（而非直接截断）到特定位（即\
    \ 10 的幂次）问题的解决方案。\n-   开始与完成（Starts and Completions）。解决在给定工作总量和每个任务工作量的情况下，计算已开始和/或完成的任务数量问题的解决方案。\n\
    -   位标志（Bit Flags）。解决此类问题的解决方案：即需要根据一个或多个二值状态的状态来控制程序的流。\n-   **数字计数（Digit Counting）。**\
    \ 确定整数数字个数问题的解决方案。\n\n本书这一部分中的某些模式没有直接使用先决概念，但替代方案却使用了。例如，指标就是如此。本书这一部分的某些模式仅直接使用了部分先决概念（例如，位标志使用了关系运算符，而数字计数使用了方法）。该部分的其他模式则直接使用了所有的先决概念（例如，指标方法、四舍入以及开始与完成）。因此，在学习所有先决概念之前，你可能已经理解了其中的某些模式。\n\
    \n同样重要的是，本书这一部分中的许多模式使用了本书前面章节的模式。因此，在开始第二部分之前，理解第一部分的模式至关重要。\n\n最后，本书这一部分的某些模式可以被看作更抽象模式的特定示例。然而，这种观点需要初级程序员可能并不具备的复杂程度，因此我们没有以那种方式呈现。\n\
    \n# 指标\n\n任何程序都必须根据各种条件执行不同的计算。实现这一目标有许多方法，但一种非常强大（且常用）解决方案是使用乘法变量，该变量在条件不满足时取值为\
    \ 0，在满足时取值为 1。\n\n# 动机\n\n这类变量在数学的许多分支中很常见，被称为指标变量（indicator variables）¹它们通常用小字母\
    \ delta（即 $\\delta$）表示，并通常带有下标以表示条件（例如，用 $\\delta_s$ 表示某人是否吸烟）。然后在更复杂的表达式中将指标变量与其他变量相乘。\n\
    \n例如，假设你正在编写一个程序，根据孕期（周）来预测婴儿的出生体重（克）。你可能担心母亲在怀孕期间吸烟会导致体重较低。在忽略母亲是否吸烟的情况下，从人口的（随机或代表性的）样本中收集数据后，你可能会确定如下关系：\n\
    $w = -2200 + 148.2g$\n\n其中 $w$（因变量）表示出生体重（克），$g$（自变量）表示孕期（周）³。考虑到母亲的吸烟行为，你可能确定当母亲吸烟时，出生体重平均低了\
    \ 238.6 克。你现在需要决定如何在程序中体现这一点。\n\n# 思考问题\n\n你想做的是在母亲吸烟时降低 $w$，而在母亲不吸烟时保持 $w$ 不变。由于只有两种可能的状态（即母亲吸烟或不吸烟），你可能倾向于使用布尔变量来跟踪这些信息。然而，事实证明使用赋值为\
    \ 0 或 1 的离散变量比使用取值为 true 或 false 的变量更好。原因是你可以对数值变量使用乘法运算符，而不能对布尔变量这样做。换句话说，布尔变量不能作为乘法运算符的左侧或右侧操作数。\n\
    \n特别是，假设你添加了另一个自变量 $\\delta_s$，如果母亲在怀孕期间吸烟，则给 $\\delta_s$ 赋值 1，否则给 $\\delta_s$\
    \ 赋值 0。那么，$w$ 的方程可以简洁地表示如下：\n$w = -2200 + 148.2g - 238.6\\delta_s$\n\n通过这种方式，当\
    \ $\\delta_s$ 为 1 时，$w$ 将减少 238.6，当 $\\delta_s$ 为 0 时则保持不变。\n\n注意，你可以用不同的定义指标变量。具体来说，如果母亲在怀孕期间不吸烟，则给\
    \ $\\delta_s$ 赋值 1，否则赋值为 0。在这种情况下，$w$ 的方程将变为：\n$w = -2438 + 148.2g + 238.6\\delta_s$\n\
    \n# 模式\n\n在最简单的情况下，使用此模式唯一需要的是定义一个指标变量，根据情况给其赋值 0 或 1，然后通过乘法使用它。哪一个是“原始”的，哪一个是“逆向”的是随意的。逆向指标在原始指标取\
    \ 0 时必须取值为 1，反之亦然。这个思想可以用公式表示：\n\n```\ntotal = base + (indicator * adjustment);\n\
    ```\n\n# 示例\n\n回到出生体重的示例，你可以使用该语句比较 $\\delta_s$ 的两个值的出生体重。$\\delta_s$ 为 0 将导致出生体重为\
    \ 3728，而 $\\delta_s$ 为 1 将导致出生体重为 3489.4。\n\n```\nw = -2200 + 148.2g - 238.6delta_s;\n\
    ```\n\n作为另一个示例，假设第一次罚金比后续罚金小（具体来说，第一次为 10.00，后续为 45.00）。在这种情况下，如果你在没有前科的情况下给指标变量赋值\
    \ 0，否则赋值为 1，那么你可以编写如下语句来计算罚金：\n\n```\nbaseFine = 10.00;\nrepeatOffenderPenalty\
    \ = 45.00;\ntotalFine = baseFine + (tickedIndicator * repeatOffenderPenalty);\n\
    ```\n\n作为最后一个示例，考虑一家每天收取 19.95 美的租公司。如果多人驾驶，每天额外收取 5.00 美；如果驾驶员小于 25 岁，每天额外收取\
    \ 10.00 美。如果你在有多位司机时给 multiIndicator 赋值 1，在有 25 岁以下驾驶员时给 youngIndicator 赋值 1，那么你可以编写如下语句来计算费率：\n\
    \n```\nbaseRate = 19.95;\nageSurcharge = 10.00;\nmultiSurcharge = 5.00;\n\nrate\
    \ = baseRate + (multiIndicator * multiSurcharge)\n      + (youngIndicator * ageSurcharge);\n\
    ```\n\n# 注意事项\n\n本章示例描述可能会引导你使用与上述不同的解决方案。虽然你最终可能更喜欢这种解决方案，但在决定之前你应该仔细考虑优缺点。\n\
    \n使用 if 语句\n\n你可能尝试使用布尔变量、if 语句和第一章中的更新模式，而不是\n\n---\n1. 在统计学中，它们有时被称为哑变量。\n2.\
    \ 不要将其与大写 delta（即 $\\Delta$）混淆，后者通常表示变化。\n3. 不要被负常数项困扰。该模型仅适用于长孕期，在这种情况下出生体重将为正。\n\
    4. 如果指标要与 `double` 相乘，你也可以使用 `double` 变量。但在这种情况下，大多数人认为使用 `int` 是合适的。\n5. 在允许在标识符下划线的编程语言中，通常使用下划线字符表示下标。\n\
    \n"
