    \ discussed at the end of Chapter 3 on digit manipulation and in Chapter 10 on\
    \ bit flags).\n\nFor example, because of the way the eye processes light, many\
    \ visual output devices represent colors using a red component, a green component,\
    \ and a blue component, each of which can take on 256 different values. Since\
