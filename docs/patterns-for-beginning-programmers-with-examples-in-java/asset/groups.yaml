    \        + containerExtent[i] / 2.0;\n        double contentMidpoint = contentExtent[i]\
    \ / 2.0;\n\n        reference[i] = containerMidpoint - contentMidpoint;\n    }\n\
    \    return reference;\n}\n```\n\n## 示例\n\n与书中的其他模式不同，对于这种模式，考虑一些不涉及代码的示例是很有用的。\n\
    \n### 一维示例\n\n图 21.1 展示了一维居中的示例。图中的正立数字是输入，图中的*斜体*数字是计算出的值。这个示例可能仍然涉及文本，但现在的目标是将文本在行的一部分（例如具有给定宽度的字段）内居中。在这个示例中，内容（即文本）的宽度为\
    \ 4，字段宽度为 17，且从第 8 列开始![](img/fc01fd61514199fc6ea175e76367f2b_150_0.png)\n\n你应该从容器的引用和容器的范围开始，并使用它们如下计算容器的中点：\n\
    \n```\n$ = C^R + (C^E/2) = 8 + (17/2) = 8 + 8.5 = 16.5\n```\n\n换句话说，有必要向容器引用 8\
    \ 的右侧移动 8.5 单位，以得到容器的中点 16.5。\n\n然后，你可以如下计算内容的引用：\n\n```\n$c^R = C^M - (c^E/2)\
    \ = 16.5 - (5/2) = 16.5 - 2.5 = 14\n```\n\n换句话说，有必要向左移动 2.5 单位。\n\n### 二维示例\n\n\
    图 21.2 展示了二维居中的示例。图中的正立数字是输入，而图中的*斜体*数字是计算出的值。这个示例可能仍然涉及文本，但现在的目标是将文本在行的一部分（例如，具有给定宽度的字段）内居中。在这个示例中，内容（即文本）的宽度为\
    \ 4，字段宽度为 17，且从第 8 列开始![](img/fc01fd61514199fc6ea175e76367f2b_150_0.png)\n\n你应该从容器的引用和容器的范围开始，并使用它们如下计算容器的中点：\n\
    \n```\n$ = C^R + (C^E/2) = 8 + (17/2) = 8 + 8.5 = 16.5\n```\n\n换句话说，有必要向容器引用 8\
    \ 的右侧移动 8.5 单位，以得到容器的中点 16.5。\n\n然后，你可以如下计算内容的引用：\n\n```\n$c^R = C^M - (c^E/2)\
    \ = 16.5 - (5/2) = 16.5 - 2.5 = 14\n```\n\n换句话说，有必要向左移动 2.5 单位。\n\n## 警告\n\n这种居中模式可以用于各种情况，但有些事情需要注意。\n\
    \n### 坐标系\n\n所有的图形都使用坐标系。水平坐标从左到右增加，而*垂直*坐标则通常从上到上增加。\n\n### 使用整数\n\n上面的代码假设引用和范围都是\
    \ `double` 值。然而，如果使用 `int` 值，情况会有所不同。\n\n第一个需要意识到的是，如果范围是偶数，内容将无法完美居中。\n\n第二个需要意识到的是整数除法的影响，以及它如何根据范围的奇偶而不同。\n\
    \n综合所有这些，得出了以下结论：\n\n- 1. 当容器范围为 9 时，内容的引用将是 4 - 2，无论容器\n\n"
