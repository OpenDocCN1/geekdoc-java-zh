    # Accumulator Arrays


    Programs often need to keep track of (in one way or another) multiple things over
    multiple iterations. In some cases, this can be accomplished with multiple accumulators
    of the kind discussed in Chapter 13. However, in other cases, it is better to
    use an array of accumulators.


    # Motivation


    Many K-12 schools assign numeric grades (on a scale of 0 to 100) to individual
    students during the year and then, at the end of the year, create a summary report
    that shows the number of students that were in each centile (i.e., the 90s, the
    80s, etc.). If you were asked to write a program for this purpose, you''d know
    (from Chapter 13) that you should use an accumulator to keep a running count of
    the number of students in each centile. Since there are eleven different centiles
    (treating 100 as an entire만에), this means that you need eleven different accumulators.


