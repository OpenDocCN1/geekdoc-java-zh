    # Chained Mutators


    E samples abound in which a method is invoked on the value returned by another
    method without assigning the returned value to an intermediate variable. Opinions
    differ, among programmers at all levels, about the efficacy of this practice.
    Nonetheless, it is quite common. Hence, it is important to consider how this behavior
    can be taken into account when implementing methods that might be chained in this
    way.


    # Motivation


    Suppose you need to construct an email address from a String variable named user
    containing the user''s name and a String variable named university containing
    the university''s name. Suppose, further, for efficiency reasons you want to use
    a StringBuilder rather than String concatenation.

    Way to implement this is as follows:


    ```

    StringBuilder sb = new StringBuilder();

    sb.append(user);

    sb.append("@");

    sb.append(university);

    sb.append(".edu");

    ```


    In this implementation, each call to append() simply modifies the state of the
    StringBuilder as required.

    While this works, it is somewhat messier than using String'
  - '[PAGE 172]


    concatenation, because it requires multiple statements. What you might like to
    do, instead, take advantage of the efficiency of the StringBuilder class without
    the added messiness. In principal, you could accomplish this using invocation
    chaining as follows:


    ```

    StringBuilder sb = new StringBuilder();

    sb.append(user).append("@").append(university).append(".");"

    ```


    However, this will only work if the append() method implemented with this kind
    of functionality in mind.


    # Review


    Now, consider a different, but related, example. Suppose you are working with
    a File object that encapsulates the current working directory, and you want to
    know how many characters are in its name. This can be accomplished as follows:


    ```

    cwd = new File("");

    String path = cwd.getCanonicalPath();

    int length = path.length();

    ```


    However, there''s no need for the intermediate variable path, many people prefer
    the following chained implementation:


    ```

    length = new File("");

    length = cwd.getCanonicalPath().length();

    ```


    This chained implementation works because the getCanonicalPath() method in the
    File class returns (and evaluates to) a String object, and the String class has
    a length() method.


    # Thinking About The Problem


    Though they are similar on the surface, the email example and the path example
    are quite different. In the path example, the methods do not change the state
    of their owning objects. That is, the getCanonicalPath() method is an accessor
    not a mutator (i.e., it does not change the state of its File object, it returns
    a String object) and the length() method is also an accessor not a mutator (i.e.,
    it does not change the state of its'
  - '[PAGE 173]


    String example, it returns an int. On the other hand, in the email example, the
    append() method changes the state of its StringBuilder (i.e., it is a mutator
    and does not need to return anything).


    So, it is easy to see why you can use invocation chaining in the path example,
    it does not seem like you should be able to do in the email example. Indeed, in
    order for you to be able to use invocation chaining in the path example, the append()
    method must return the StringBuilder that it is modifying.


    # The Pattern


    This motivating example can be generalized to create a pattern that solves the
    chained mutator problem. Specifically, if you want to be able to use invocation
    chaining to change an object, then the mutator methods that are to be chained
    returning that a subsequent method in the chain can be invoked on. But, it can''t
    return anything; it must return an object of the appropriate type (i.e., an object
    of the same type as the owning object). But, even that isn''t enough — it must
    actually return the owning object itself. That is, the mutator must return the
    reference to the owning object, this.


    The StringBuilder class uses this, for exactly this reason. The methods append(),
    delete(), insert(), replace(), and reverse() all return so that their invocations
    can be chained. So, in the example, sb.append(user) returns this (i.e., a reference
    to sb), append("@") is then invoked on sb, and so on.


