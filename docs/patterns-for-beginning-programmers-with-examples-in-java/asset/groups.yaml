    \ 的类，该类包含两个属性（最小值和最大值），并构造并返回该类的一个实例。本章将考虑第三种方法——输出参数。\n\n# 回顾\n\n为了理解 Java 中输出参数的使用，理解*参数传递*至关重要。特别地，理解\
    \ Java 是按值传递所有参数的至关重要。这意味着形式参数（有时称为参数）实际上是实际参数（有时称为参数）的拷贝。这很重要，因为这意味着虽然方法可以改变形式参数，但它不能改变实际参数。\n\
    \n# 思考问题\n\n乍一看，这可能让你认为在 Java 中不可能拥有输出参数。然而，当参数是引用类型时，尽管形式参数是实际参数的拷贝，形式参数和实际参数指向同一个对象。也就是说，它们是别名。因此，如果对象是可变的，方法就可以改变该对象的属性。\n\
    \n考虑到这一点，需要考虑三种不同的情况，对应于传递以下每个参数的需求：\n\n- 1. 可变引用类型；\n- 2. 值类型；或\n- 3. 不可变引用类型。\n\
    \n每种情况必须略有不同的处理。在这种情况下，方法简单地改变输出形式参数的属性（它是实际参数的别名）。\n\n第二种情况稍微复杂。在这种情况下，改变形式参数对实际参数没有影响。你想做的是以某种方式“转换”值类型为引用类型。虽然这是可能的，但你可以创建一个包装类来实现相同的目的。例如，如果你想有一个输出的\
    \ int 参数，你可以写一个如下的 `IntWrapper` 类：\n\n```java\npublic class IntWrapper {\n   \
