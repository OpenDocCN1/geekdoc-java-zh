    # Outbound Parameters


    Though it is not always discussed in introductory programming courses, parameters
    can be used to pass information to a method (i.e., inbound parameters), to pass
    information from a method (i.e., outbound parameters), or to do both (i.e., in-out
    parameters). While some programming languages make this explicit, Java does not.


    # Motivation


    In Java, a method can only return a single value or reference, and this is sometimes
    inconvenient. Suppose, for example, you want to write a method that is passed
    a `double[]` and returns both the maximum value and the minimum value. One way
    to achieve the desired result is to construct and return a `double[]` that contains
    two elements, the maximum and the minimum. Another way to achieve the desired
    result is to create a class called `Range` that contains two attributes, the minimum
    and maximum, and construct and return an instance of it. This chapter considers
    a third approach — outbound parameters.


    # Review


    In order to understand the use of outbound parameters in Java, it is critical
    to understand *parameter passing*. In particular,'
