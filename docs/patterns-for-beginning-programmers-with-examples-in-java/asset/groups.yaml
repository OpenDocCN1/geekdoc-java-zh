    ```\n\nIt returns the mean of the elements of the array after dropping the minimum.\
    \ While one could accomplish the same thing using two loops (one to calculate\
    \ the running total and one to calculate the minimum), it is much more elegant\
    \ to use one loop and two accumulators.\n\nAs another example, suppose you want\
    \ to find not the maximum of an array, but instead, the index of the largest element\
    \ (often called the argmax, the argument that maximizes the \"function\", as opposed\
    \ to the max). One way to do this is to use one accumulator to keep track of the\
