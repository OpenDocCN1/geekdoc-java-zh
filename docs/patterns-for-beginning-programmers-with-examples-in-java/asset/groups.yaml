    \n虽然这两种方法都有效，但交错方法对于当前的问题更为合适。为了了解为什么（哪个在前后并不重要，只要你保持一致），请考虑图 18.3，它包含了对图 18.2\
    \ 中数组更抽象的概念化。当交错时，每个记录的字段被保留在一起，使得更容易处理。\n\n| 索引 | 0 | 1 | 2 | 3 | 4 | 5 | 6 |\
    \ 7 |\n|---|---|---|---|---|---|---|---|\n| 60.0 | 100.0 | 62.0 | 110.0 | 65.0\
    \ | 120.0 | 70.0 | 140.0 |\n\n图 18.3. 交错数组的概念化\n\n通常情况下，如果 `recordSize` 表示字段的数量，`record`\
    \ 表示字段，`field` 表示字段（基于 0），那么通过以下方式可以计算 `index`：\n\n```\nindex = record * recordSize;\n\
    ```\n\n其次，给定 `index`，可以通过以下方式计算 `field`：\n\n```\nfield = index % recordSize;\n\
    ```\n\n# 示例\n\n分段数组（segmented）或紧凑数组（packed）最经常用于位操作。注意，由于你正在医学医学人员人员，人员收集了许多不同人的身高和体重数据。从第\
    \ 17 章你知道，为了实现这个目的，你可以使用两个对应数组，一个包含身高，另一个包含体重（使用索引来识别个体）。然而，由于所有测量值都是双精度值，也可以将它们组织在一个数组中。这种数组被称为分段数组（segmented）或紧凑数组（packed）。\n\
    \n由于眼睛处理光的方式，许多视觉设备使用红色分量、绿色分量和蓝色分量表示颜色，每个组件可以取 256 个不同的值。由于每个组件可以用 8 位表示，可以使用一个\
