    # The Pattern


    In general, if you `recordSize` denote the number of fields in each record, `record`
    denote the record of interest (0-based), `field` denote the field of interest
    (also 0-based), and `index` denote the index of the element in the segmented array,
    then you can easily convert back and forth between the two approaches.


    First, given the `record` and `field`, you can calculate the `index` as follows:


    ```

    index = (record * recordSize) + field;

    ```


    This is the same algorithm used in the loop to interleave the elements.


    Second, given the `index`, you can calculate the `record` and `field` as follows:


    ```

    record = index / recordSize;

    field = index % recordSize;

    ```


    Note that this algorithm uses the techniques for arithmetic on the circle from
    Chapter 4.


