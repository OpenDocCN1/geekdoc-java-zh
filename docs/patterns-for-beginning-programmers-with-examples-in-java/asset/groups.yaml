    # [PART V]


    # Patterns Requiring Knowledge of String Objects


    Part V contains programming patterns that require an understanding of String objects.
    Specifically, this part of the book contains the following programming patterns:


    +   **Centering.** Solutions to problems that involve the centering of content
    (of various kinds) in containers (of various kinds).


    +   **Delimiting Strings.** Solutions to problems that are similar to the problem
    of inserting commas between the words in a list.


    +   **Dynamic Formatting.** A solution to problems that require the format of
    a String to be determined dynamically (i.e., at run-time rather than at compile-time).


    +   **Pluralization.** A solution to the problem of creating both regular and
    irregular pluralizations.


    The first three patterns in this part of the book all use an accumulator and some
    other logic to solve their associated problems. The pluralization pattern is really
    nothing more than a clever use of methods.'
- md: "\n## Centering\n\nany applications need to center content (of some kind) inside\
    \ a container (of some kind). Though the content and the containers can vary dramatically,\
    \ the pattern used to do the centering is very consistent.\n\n## Motivation\n\n\
    Suppose you have some text that you need to display on the console, centered on\
    \ the line containing it. Since the console (typically) uses a fixed-width font,\
    \ the width of every character (measured in pixels) is the same. As a result,\
    \ the width of the text and the width of the line can be measured in characters.\
    \ Your objective, then, is to determine the column of the line that should contain\
    \ the first character of the text.\n\n## Review\n\nThe text in this example is\
    \ going to be represented as a String object. So, you can use its length() method\
    \ to determine the number of characters in it. Unfortunately, you have no way\
    \ of specifying the column of the display to print when writing to the console.\
    \ Hence, you have to create or output a String that is padded on the left with\
    \ the appropriate number of spaces, which you can do using an accumulator (see\
    \ Chapter 13). The only problem that remains, then, is the determination of the\
    \ appropriate number of spaces.\n\n- 1. This is not true of all consoles. Allow\
    \ you to use control sequences to specify the column (and row) to write.\n\n##\
    \ Thinking About The Problem\n\nSuppose that the line is nine characters wide\
    \ and 0-based (i.e., the first character is at position 0). Then, you know that\
    \ the middle character in the line has index 4 (i.e., 9 / 2, using integer division),\
    \ since there are four characters to the left of index 4 and four characters to\
    \ the right of index 4.\n\nSuppose further that the text is five characters wide\
    \ and is 0-based. Then, you know that the middle character of the text has index\
    \ 2 (i.e., 5 / 2), since there are two characters to the left of index 2 and two\
    \ characters to the right of index 2.\n\nSo, in order to center the text in the\
    \ line, you want character 2 of the text to be at position 4 of the line. This\
    \ means that character 0 of the text must be at position 2 of the line.\n\n##\
    \ The Pattern\n\nThe centering pattern is nothing more than a generalization of\
    \ this example. First, instead of text, you should think more generally about\
    \ content. Second, instead of a line, you should think more generally about a\
    \ container. Both the content and the container have an extent that generalizes\
    \ the notion of the width in the example, and a reference that generalizes the\
    \ notion of a starting character.\n\nThe centering problem is to find the reference\
    \ for the content, given the reference and extent of the container and the extent\
    \ of the content. Letting C denote the container, c denote the content, and the\
    \ superscripts R and M denote the reference, extent, and midpoint respectively\
    \ (for each dimension), the centering pattern involves three steps.\n\nHowever,\
    \ these capabilities are not normally discussed in introductory programming courses.\
    \ In addition, even with such a console, the centering pattern is needed to find\
    \ the row or column. Such a console just eliminates the need to pad the String.\n\
    \nFirst, you need to calculate the midpoint of the container (which had a reference\
    \ of 0 and an extent of 9 in the example). You can do this as follows:\n\n```\n\
    $C^M = C^R + (C^E / 2)\n```\n\nNext, you need to calculate the midpoint of the\
    \ content (which had a width of 5 in the example). You can do this as follows:\n\
    \n```\n$c^M = (c^E / 2)\n```\n\nFinally, you need to calculate the reference for\
    \ the content by subtracting the midpoint of the content from the midpoint of\
    \ the container. That is:\n\n```\n$c^R = C^M - c^M\n```\n\nIn one dimension (i.e.,\
    \ when the references and extents can be represented by a single number) as in\
    \ the text, this algorithm be implemented as follows:\n\n```java\npublic static\
    \ double center(double containerReference,\ndouble containerExtent,\ndouble contentExtent)\
    \ {\n    double containerMidpoint = containerReference + containerExtent / 2.0;\n\
    \    double contentMidpoint = contentExtent / 2.0;\n    double contentReference\
    \ = containerMidpoint - contentMidpoint;\n\n    return contentReference;\n}\n\
    ```\n\nOf course, many problems are not one dimensional. For example, images and\
    \ windows have both a width and a height, their positions are specified with both\
    \ a horizontal and a vertical coordinate. Fortunately, the logic is exactly the\
    \ same all of the dimensions. Hence, if the extents and the references are represented\
    \ as conformal arrays (see Chapter 17), then you can perform the calculations\
    \ for each dimension independently in the body of a loop as follows:\n\n```java\n\
    public static double center(double[] containerReference,\ndouble[] containerExtent,\n\
    double[] contentExtent) {\n    int n = containerReference.length;\n    double[]\
    \ reference = new double[n];\n\n    for (int i = 0; i < n; i++) {\n        double\
    \ containerMidpoint = containerReference[i]\n        + containerExtent[i] / 2.0;\n\
    \        double contentMidpoint = contentExtent[i] / 2.0;\n\n        reference[i]\
    \ = containerMidpoint - contentMidpoint;\n    }\n    return reference;\n}\n```\n\
    \n## Examples\n\nUnlike the other patterns in this book, for this pattern it is\
    \ useful to consider some examples that don't involve the use of code.\n\n###\
    \ A One-Dimensional Example\n\nAn example of centering in one dimension is illustrated\
    \ in Figure 21.1. The upright numbers in this figure are the inputs, and the italicized\
    \ numbers in this figure are the calculated values. This example might, again,\
    \ involve text, but the objective now is to center the text within a portion of\
    \ a line (e.g., a field with given width). In this example, the content (i.e.,\
    \ the text) has a width of 4, and the field has a width of 17 and starts in column\
    \ 8. ![](img/fc01fd61514199fc6ea175e76367f2b_150_0.png)\n\nYou should begin with\
    \ the container's reference and the container's extent, and use them to calculate\
    \ the container's midpoint as follows:\n\n```\n$ = C^R + (C^E/2) = 8 + (17/2)\
    \ = 8 + 8.5 = 16.5\n```\n\nIn other words, it's necessary to move 8.5 units to\
    \ the right of the container's reference of 8 to get the container's midpoint\
    \ of 16.5.\n\nThen, you can calculate the content's reference as follows:\n\n\
    ```\n$c^R = C^M - (c^E/2) = 16.5 - (5/2) = 16.5 - 2.5 = 14\n```\n\nIn other words,\
    \ it's necessary to move 2.5 units (half of the content's width) to the left of\
    \ the container's midpoint to get the content's reference.\n\n### A Two-Dimensional\
    \ Example\n\nAn example of centering in two dimensions is illustrated in Figure\
    \ 21.2. Again, the upright numbers are the inputs, while the numbers in italics\
    \ are calculated. This example might involve centering an image inside a user\
    \ interface (GUI). In this context, the content (i.e., the image) has a width\
    \ of 6 and a height of 8 ($6 \\times 8$), and the container (i.e., the window)\
    \ has a width of 30 and a height of 12 ($30 \\times 12$). ![](img/fc01fd61514199fc6ea175e76367f2b_152_0.png)\n\
    \n## Some Warnings\n\nThe pattern above can be used in a wide variety of situations,\
    \ but there are some things that you should aware of.\n\n### Coordinate Systems\n\
    \nAll of the figures and examples in this chapter use Euclidean coordinates in\
    \ which the horizontal coordinates increase from left to right, and the vertical\
    \ coordinates increase from bottom to top. However, computer graphics tend to\
    \ use screen coordinates in which the horizontal coordinates increase from left\
    \ to right but the **vertical coordinates increase from top to bottom**. This\
    \ means that the sign of the adjustments in the vertical dimension must be negated.\n\
    \n### Using Integers\n\nThe code above assumes that the references and extents\
    \ are all `double` values. However, the text example uses `int` values (since\
    \ the content be integer and the column positions are integers). Fortunately,\
    \ with a little care, the pattern can be used for both int values and double values.\n\
    \nThe first thing to realize is, if either of the extents is even, then the content\
    \ can't perfectly centered. The calculated integer midpoint will either \"lean\"\
    \ to the left or to the right of the conceptual real-valued center.\n\nThe second\
    \ thing to realize is the impact of integer division and how it differs depending\
    \ on whether the extent is odd or even. To get started thinking about this, just\
    \ use the pattern exactly as it is implemented above, replacing the double values\
    \ with int values, and consider the container and the content individually.\n\n\
    When the extent of the container is odd, the calculated midpoint will be at the\
    \ conceptual center. For example, when the extent is 9 in the text example above,\
    \ the midpoint is 9 / 2 or 4, which leaves 4 characters to the left (i.e., indexes\
    \ 0, 1, 2, and 3) and 4 characters to the right (i.e., indexes 5, 6, 7, and 8).\
    \ On the other hand, when the extent of the container is even, the calculated\
    \ midpoint will \"lean\" right. For example, when the extent is 8, the midpoint\
    \ is 8 / 2 or 4, which leaves 4 characters to the left (i.e., indexes 0, 1, and\
    \ 2) but only 3 characters to the right (i.e., indexes 5, 6, 7).\n\nWhen the extent\
    \ of the content is odd, the calculated midpoint will again be at the conceptual\
    \ center. For example, when the extent is 5 in the text example above, the midpoint\
    \ is 5 / 2 or 2, which leaves 2 characters to the left (i.e., indexes 0 and 1)\
    \ and 2 characters to the right (i.e., indexes 3 and 4). So, the leftward adjustment\
