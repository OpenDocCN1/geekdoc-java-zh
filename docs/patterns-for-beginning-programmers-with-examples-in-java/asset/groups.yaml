- md: "\n```java\nif (age >= DRINKING_AGE) {\n  isLegal = true;\n} else {\n  isLegal\
    \ = false;\n}\n```\n\nHowever, most people think this is completely inappropriate\
    \ (and demonstrates a lack of understanding of relational operators and boolean\
    \ variables). Instead, it should be implemented as follows:\n\n```java\nisLegal\
    \ = (age >= DRINKING_AGE);\n```\n\nThat is, the expression (age >= DRINKING_AGE)\
    \ evaluates to a boolean that should be directly assigned to the variable isLegal\
    \ — if the statement is superfluous. In other words, a pattern that is appropriate\
    \ for assigning values to numeric variables or returning numeric values (like\
    \ those in the previous section) may not be appropriate for boolean variables.\n\
    \n## Looking Ahead\n\nOn some hardware architectures, if statements (including\
    \ the boolean expressions that must be evaluated) take more CPU time to execute\
    \ than arithmetic operations. Hence, on such architectures it is important to\
    \ replace if statements with arithmetic expressions. Threshold indicators are\
    \ an example of this might arise in a course on computer architecture.\n\nIf you\
    \ read Chapter 4 on arithmetic on the circle, you're may thinking about how you\
    \ use the integer division operator and/or the remainder operator to eliminate\
    \ if statements. While it is, indeed, possible to do, the solution is not obvious.\
    \ Consider the following candidates:\n\n- (value + 1) is 0 when value is 0, it\
    \ is also 0 for every other possible int.\n- (value / max) is slightly better\
    \ since it is 0 when value is 0, and 1 when value is max, but it is still 0 for\
    \ every possible int.\n- value % (max + 1) is 0 when value is 0, and is 1 when\
    \ value is 1, it is value (not 1) otherwise. (Using max rather than (max + 1)\
    \ in the denominator does not improve things.)\n\nThe easiest way to think about\
    \ a solution that does work is to consider the problem in three stages. First,\
    \ consider the case when the threshold is less than twice the value. Then, consider\
    \ the special case of a non-zero threshold indicator (i.e., when the threshold\
    \ is 1). Finally, consider the general case (i.e., the threshold can be anything).\n\
    \n## A Threshold Less Twice the Value\n\nWhen value is strictly less than (2 *\
    \ threshold), it follows that (value / threshold) is going to be either 0 or 1\
    \ (because, using real division, the result will always be less than 2). Hence,\
    \ in this case, you can find the indicator as follows:\n\n```java\nindicator =\
    \ (value / threshold);\n```\n\nUnfortunately, this won't work in general because\
    \ we don't know value.\n\n## A Threshold of 1\n\nOne way to get the correct solution\
    \ to the special case when the threshold is 1 to find max consecutive integers\
    \ that have the property that in the right direction, divided by some value is\
    \ 1.\n\nTo move in the right direction, observe that for value in the set {1,\
    \ 2, ..., max} it follows that (value + max) is an element of {(1+max), (2+max),\
    \ ..., (value+max)}. Since value is less than or equal to max, it also follows\
    \ that each element of this set is less than or equal to (2*max). Hence, the result\
    \ of dividing each by (max+1) (using integer division) is 1 (because using real\
    \ division the result would be strictly between 1 and 2.\n\nTo finalize the pattern\
    \ when the threshold is 1, observe that (0 + max) / (max + 1) is 0 (using integer\
    \ division), since the numerator is strictly less than the denominator. What this\
    \ means is that the pattern when the threshold is 1 can be expressed as the following\
    \ non-zero indicator:\n\n```java\nindicatorNZ = (value + max) / (max + 1);\n```\n\
    \n## The General Case\n\nIn the general case, you need to create an indicator\
    \ that is 0 when a non-negative value is less some threshold and 1 otherwise.\
    \ The easiest way to create such an indicator is to first calculate an intermediate\
    \ value that is 0 when the value is less than the threshold and positive otherwise,\
    \ and then use a non-zero indicator.\n\nTo do so, observe that, both value and\
    \ threshold are in the interval [0, max], it follows that, as required, (value\
    \ / threshold) is 0 when value is less than threshold and that it is in [1, max]\
    \ otherwise. Hence, you can calculate intermediate as follows:\n\n```java\nintermediate\
    \ = value / threshold;\n```\n\nThen, you can use intermediate and the expression\
    \ for a non-zero indicator to calculate a threshold indicator as follows:\n\n\
    ```java\nindicatorT = (intermediate + max) / (max + 1);\n```\n\nPutting it all\
    \ together yields the following general expression for a threshold indicator:\n\
    \n```java\nindicatorT = ((value / threshold) + max) / (max + 1);\n```\n\nTo see\
    \ that this is, indeed, a generalization of the special case, you need only substitute\
    \ 1 for threshold in this expression. This leads to a general-purpose method like\
    \ the following for calculating the threshold indicator without an if statement:\n\
    \n```java\npublic static int indicator(int value, int threshold, int max) {\n\
    \    return ((value / threshold) + max) / (max + 1);\n}\n```\n\n## Rounding\n\n\
    As mentioned in Chapter 5, integers commonly include more digits of accuracy than\
    \ needed, and sometimes leads to the need to truncate numbers. This chapter considers\
    \ a common alternative to truncation — rounding.\n\n## Motivation\n\nIn the example\
    \ from Chapter 5, the worker was paid piece, but only for multiples of.\n\n##\
    \ Review\n\nIn the example from Chapter 5, the worker was paid piece, but only\
    \ for multiples of. This sometimes leads to the need to truncate numbers. This\
