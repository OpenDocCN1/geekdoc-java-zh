    | 0 Shirts | 0 Socks |

    | | 1 Shirts |

    | 1 Socks | 0 Socks |

    | 2 Pants | 0 Socks |

    | | 1 Shirts |

    | | 2 Pants |

    | | 3 Pants |

    | 3 Skirts | 0 Socks |

    | | 1 Shirts |

    | | 2 Skirts |


    In this case, checked is assigned the value true in every outer iteration, and
    the method returns true.


    ## The Flexible Variant


    Now consider the first example above but with the second variant of the method,
    when 2 is passed into the formal parameter named needed (because, apparently,
    this person is fully-dressed when wearing any two items in the checklist). In
    outer iteration 0, the method checks to see if "Shirts" has been accomplished.
    In inner iteration 0, the method determines that it has been, increases count
    to 1, and breaks out of the inner loop. In outer iteration 1, the method checks
    to see if "Socks" has been accomplished. In inner iteration 0, the method determines
    that it hasn''t, but in inner iteration 1 it determines that it has been, increases
    count to 2, determines that count is greater than or equal to needed, and returns
    true.


    Now, consider an example in which accomplished contains the elements "Dresses"
    and "Shirts". These iterations will proceed as follows:


