    repeatOffenderPenalty = 35.00;\ntotalFine = hasBeenTicketed ? baseFine + repeatOffenderPenalty\
    \ : baseFine;\n```\n\nSome people prefer this solution to the one that uses if\
    \ for stylistic reasons. That is, they think the ternary conditional operator\
    \ is more concise. However, it is not more concise than the solution that uses\
