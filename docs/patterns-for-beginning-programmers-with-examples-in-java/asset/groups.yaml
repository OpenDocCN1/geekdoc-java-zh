  mdcn: "\n\n```java\nif (age >= DRINKING_AGE) {\n  isLegal = true;\n} else {\n  isLegal\
    \ = false;\n}\n```\n\n然而，大多数人认为这种做法完全是不恰当的（表现出对关系运算符和布尔变量缺乏理解）。相反，它应该按照如下方式实现：\n\
    \n```java\nisLegal = (age >= DRINKING_AGE);\n```\n\n也就是说，表达式 `(age >= DRINKING_AGE)`\
    \ 评估为一个布尔值，应该直接赋值给变量 `isLegal` —— 如果该语句是多余的。换句话之，适用于给数值变量赋值或返回数值（如上一节中的那些值）的模式，可能并不适用于布尔变量。\n\
    \n## 展望\n\n在某些硬件架构上，`if` 语句（包括必须评估的布尔表达式）执行时比算术运算消耗更多的 CPU 时间。因此，在这些架构上，将 `if`\
    \ 语句替换为算术表达式是非常重要的。阈值指示器（Threshold indicators）就是计算机架构课程中可能会出现的例子。\n\n如果你阅读第 4\
    \ 章关于圆周算术的内容，你可能会思考如何使用整数除法运算符和/或模运算符来消除 `if` 语句。虽然确实可行，但解决方案并非显而易见。考虑以下候选方案：\n\
    \n- 当 `value` 为 0 时，`(value + 1)` 为 0；对于其他所有可能的 `int`，它也是 0。\n- `(value / max)`\
    \ 稍微好一点，因为它在 `value` 为 0 时为 0，在 `value` 为 `max` 时为 1，但对于所有可能的 `int` 它仍然是 0。\n\
    - `value % (max + 1)` 在 `value` 为 0 时为 0，在 `value` 为 1 时为 1，否则为 `value`（而不是 1）。在分母中使用\
    \ `max` 而不是 `(max + 1)` 并不会改善情况。\n\n思考可行解决方案的最简单方法是将问题分为三个阶段。首先，考虑阈值小于值两倍的情况。然后，考虑非零阈值指示器的特殊情况（即阈值为\
    \ 1 时）。最后，考虑一般情况（即阈值可以是任何值）。\n\n## 小于值两倍阈值\n\n当 `value` 严格小于 `(2 * threshold)`\
    \ 时，可以得出 `(value / threshold)` 将是 0 或 1（因为使用实数除法，结果始终小于 2）。因此，在这种情况下，你可以如下所示找到指示器：\n\
    \n```java\nindicator = (value / threshold);\n```\n\n遗憾的是，这在一般情况下不可行，因为我们不知道 `value`\
    \ 的值。\n\n## 阈值为 1\n\n获取阈值为 1 的特殊情况正确解决方案的一种方法，是找到最大的连续整数，这些这些整数在正确的方向上除以某个值等于\
    \ 1。\n\n为了向正确的方向移动，观察到对于集合 `{1, 2, ..., max}` 中的 `value`，可以得出 `(value + max)`\
    \ 是集合 `{(1+max), (2+max), ..., (value+max)}` 中的元素。由于 `value` 小于等于 `max`，因此该集合中的每个元素也小于等于\
    \ `(2*max)`。因此，将每个元素除以 `(max+1)`（使用整数除法）的结果为 1（因为使用实数除法得到的结果将严格在 1 和 2 之间）。\n\n\
    为了完成阈值为 1 的模式，观察到 `(0 + max) / (max + 1)` 为 0（使用整数除法），因为分子严格小于分母。这意味着当阈值为 1 时，模式可以表示为如下非零指示器：\n\
    \n```java\nindicatorNZ = (value + max) / (max + 1);\n```\n\n## 一般情况\n\n在一般情况下，你需要创建一个指示器，当非负值小于某些阈值时其为\
    \ 0，否则为 1。创建此类指示器的最简单方法是首先计算一个中间值，该值在 `value` 小于阈值时为 0，否则为正，然后使用非零指示器。\n\n做到这一点，观察到由于\
    \ `value` 和 `threshold` 都在区间 `[0, max]` 内，可以按照要求，当 `value` 小于 `threshold` 时，`(value\
    \ / threshold)` 为 0，否则它在 `[1, max]` 之间。因此，你可以如下计算 `intermediate`：\n\n```java\n\
    intermediate = value / threshold;\n```\n\n然后，你可以使用 `intermediate` 和非零指示器的表达式如下所示计算阈值指示器：\n\
    \n```java\nindicatorT = (intermediate + max) / (max + 1);\n```\n\n将所有内容结合起来，得到阈值指示器的通用表达式：\n\
    \n```java\nindicatorT = ((value / threshold) + max) / (max + 1);\n```\n\n为了证明这确实是特殊情况的推广，你只需要在该表达式中将\
    \ `threshold` 替换为 1。这产生了一个如下的通用方法，可以在不使用 `if` 语句的情况下计算阈值指示器：\n\n```java\npublic\
    \ static int indicator(int value, int threshold, int max) {\n    return ((value\
    \ / threshold) + max) / (max + 1);\n}\n```\n\n## 舍入\n\n如第 5 章提到的，整数包含的精度比需要的，有时会导致需要截断数字。本章考虑截断的一种常见替代方案——舍入。\n\
    \n## 动机\n\n在第 5 章的示例中，工人只对倍数部分获得报酬。\n\n## 回顾\n\n在第 5 章的示例中，工人只对倍数部分获得报酬。有时会导致需要截断数字。本章考虑截断的一种常见替代方案——舍入。\n\
    \n## 思考问题\n\n在第 5 章的示例中，工人只对倍数部分获得报酬。有时会导致需要截断数字。本章考虑截断的一种常见替代方案——舍入。\n\n## 问题\n\
