  mdcn: "\n\n# 分段数组 (Segmented Arrays)\n\n回想第 17 章关于对应数组的内容，讨论了如何使用多个数组来组织包含不同字段的记录（或包含行和列的表格）。本章考虑了该问题的一个特殊情况，其中记录和字段（或行或列）的所有元素都是相同类型。\n\
    \n# 动机\n\n假设你正在为一名医学研究人员工作，该人员收集了许多不同人的身高和体重数据。从第 17 章你已经知道，为了实现这个目的，你可以使用两个对应数组，一个包含身高，另一个包含体重（使用索引来识别个体）。然而，由于所有测量值都是双精度值，也可以将它们组织在一个数组中。这种数组被称为分段数组（segmented）或紧凑数组（packed）。\n\
    \n# 复习\n\n假设你有两个相同大小的数组，显然，一个元素数量翻倍的数组可以容这两个数组中的所有值。例如，假设你有以下两个数组（长度均为 4）：\n\n\
    ```\ndouble[] heights = { 60.0, 62.0, 65.0, 70.0 };\ndouble[] weights = { 100.0,\
    \ 110.0, 120.0, 140.0 };\n```\n\n那么，你可以将两个数组的所有元素存储在一个长度为 8 的数组中。\n\n如果你能创建一个用于查找/计算相应索引的算法，你就可以使用这个单一数组代替两个独立的数组。当然，查找/计算相应索引的算法与单个数组的组织方式紧密相关。因此，这两个问题必须结合起来。\n\
    \n# 思考问题\n\n虽然有很多种方法可以将两个数组的元素放入一个数组（大小翻倍）中，但有两种方法特别为合理。每种方法都值得考虑。\n\n在第一种中，你拼接两个数组。也就是说，你将一个数组的元素放在另一个数组的元素之后。可以通过以下方式实现：\n\
    \n```\nint n = 4;\nfor (int i = 0; i < n; i++) {\n  concatenated[i] = height[i];\n\
    }\nfor (int i = 0; i < n; i++) {\n  concatenated[n + i] = weight[i];\n}\n```\n\
    \n第一个循环将 `height` 的第 `i` 个元素赋值给 `concatenated` 的第 `i` 个元素，第二个循环将 `weight` 的第 `i`\
    \ 个元素赋值给 `concatenated` 的第 `n+i` 个元素。换句话说，第一个循环将 `height` 的四个元素分配给 `concatenated`\
    \ 的前四个元素，第二个循环将 `weight` 的四个元素分配给 `concatenated` 的后四个元素。\n\n| : 0 | 1 | 2 | 3\
    \ | 4 | 5 | 6 | 7 |\n|---|---|---|---|---|---|---|---|---|\n| 60.0 | 62.0 | 65.0\
    \ | 70.0 | 100.0 | 110.0 | 120.0 | 140.0 |\n\n- 1. 哪个在前后并不重要，只要你保持一致即可。\n\n# 图\
    \ 18.1. 拼接两个数组的结果\n\n虽然这并不是本章的要点，但你应该清楚，相同的算法可以通过如下单层循环来实现：\n\n```\nint n = 4;\n\
    for (int i = 0; i < n; i++) {\n    concatenated[i] = height[i];\n    concatenated[n\
    \ + i] = weight[i];\n}\n```\n\n无论实现如何，最终结果都是一个如图 18.1 所示的组织的数组。\n\n在第二种中，你将交错两个数组。也就是说，你交替来自两个数组的元素。可以通过以下方式实现：\n\
    \n```\nint n = 4;\nfor (int i = 0; i < n; i++) {\n    interleaved[2 * i] = height[i];\n\
    \    interleaved[2 * i + 1] = weight[i];\n}\n```\n\n循环中的第一个语句将 `height` 的元素 0,\
    \ 1, 2 和 3（即 `i` 的值）分配给 `interleaved` 的元素 0, 2, 4 和 6（即 `2*i` 的值）。循环中的第二个语句将 `weight`\
    \ 的元素 0, 1, 2 和 3（即 `i` 的值）分配给 `interleaved` 的元素 1, 3, 5 和 7（即 `2*i+1` 的值）。最终结果是一个如图\
