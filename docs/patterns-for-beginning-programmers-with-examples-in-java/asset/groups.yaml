    will be $2.00 in debt. Does this sound like elementary school? Good, it should.


    # Thinking About The Problem


    Now, however, consider what happens if you start at three o''clock (i.e., 3:00)
    and add fifteen hours. You don''t wind up at eighteen o''clock (i.e., 18:00) because
    there is no such hour (on a traditional twelve-hour clock). Instead, what happens
    conceptually is that the hour "circles around". Indeed, on a traditional analog
    clock, this is what happens physically, as well. It also provides a way of thinking
    about the problem — use a number circle instead of a number line.


    A number circle is a circle with labeled tick marks (indicating the integers)
    rather than a line with tick marks. A traditional number circle increases in the
    clockwise direction and decreases in the counterclockwise direction. An example,
