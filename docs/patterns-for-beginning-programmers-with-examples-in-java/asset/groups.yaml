- md: "\n## Looking Ahead\n\nThe process of turning a key of any kind into an integer\
    \ (in a particular range) is known as hashing. It is one of the most important\
    \ topics covered in courses on data structures and algorithms. This chapter has\
    \ used some very simple and intuitive hash functions, but hash functions can be\
    \ quite sophisticated, and understanding their properties can require serious\
    \ thought.\n\n## Interval Membership\n\nThere are many situations in which categories\
    \ are defined by intervals and, as a result, it is necessary to find the interval\
    \ that contains a particular value. This chapter considers one specific way to\
    \ organize the data and perform such a search.\n\n## Motivation\n\nThe U.S. tax\
    \ code defines a group of intervals called tax brackets, each of which has an\
    \ associated marginal tax rate. In 2017, these tax brackets (for single taxpayers)\
    \ were defined as in Table 16.1. For example, a person earning $23,000 would be\
    \ in the 15% marginal bracket (i.e., pay 10.0% on the first $9,325, and 15.0%\
    \ on everything over $9,325).\n\nOur objective in this chapter is to organize\
    \ the information in Table 16.1 in such a way that it is easy to find the marginal\
    \ tax rate for any income.\n\nTable 16.1. U.S. Tax Brackets for Single Taxpayers\
    \ in 2017\n\n| From | To | Rate |\n| :--- | :--- | :--- |\n| 0 | 9,325 | 10.0\
    \ |\n| 9,326 | 37,950 | 15.0 |\n| 37,951 | 91,900 | 25.0 |\n| 91,901 | 191,650\
    \ | 28.0 |\n| 191,651 | 416,700 | 33.0 |\n| 416,701 | 418,400 | 35.0 |\n| 418,401\
    \ | Above | 39.6 |\n\n## Review\n\nThough Chapter 15 on lookup arrays used different\
    \ terminology, some of the examples were closely related to the problem considered\
    \ here. For example, consider the problem of finding the letter grade that corresponds\
    \ to a particular numerical grade. Essentially, one needs to find the interval\
    \ that contains the numerical grade. However, since all of the intervals are the\
    \ same size, there is no reason to explicitly list the intervals. Hence, the code\
    \ in Chapter 15 converts an interval like [90, 99] to the index 9. In this chapter,\
    \ the situations involve intervals which are irregular, and a different solution\
    \ is required.\n\n## Thinking About The Problem\n\nThe tax table has two convenient\
    \ properties (that are common to a variety of similar situations). First, the\
    \ union of all of the intervals is the relevant subset of the real numbers (in\
    \ this case, the non-negative reals). In other words, the tax table contains the\
    \ marginal tax rate for every possible income. Second, the intervals are disjoint.\
    \ That is, the intersection of any two intervals is the empty set.\n\nHence, each\
    \ income has unique marginal tax rate that can be determined using only a sequence\
    \ of boundary values, $b_0, b_1, \\dots, b_{n-1}$. Specifically, assuming you\
    \ want to “cover” the entire set of real numbers, interval $I$ can be defined\
    \ as\n\n$[-\\infty, b_0)$, interval **1** can be defined as $[b_0, b_1]$, interval\
    \ **2** can be defined as $[b_1, b_2]$, interval $n-1$ can be defined as $[b_{n-2},\
    \ b_{n-1}]$, and interval $n$ can be defined as $[b_{n-1}, \\infty)$. For the\
    \ example, the boundaries for single taxpayers are **0.9326. 37951. 91901. 191651.\
    \ 416701. 418401.** making the intervals $[-\\infty, 0)$, $[0, 9326)$, $[9326,\
    \ 37951)$, $[37951, 191651)$, $[191651, 416701)$, $[416701, 418401)$.\n\nSince\
    \ the boundaries are homogeneous (i.e., they are values of the same type) the\
    \ boundaries for single taxpayers can be stored in a single array. For example,\
    \ the boundaries for single taxpayers can be stored in an `int[] named single`\
    \ as:\n\n```java\nint[] single = {0, 9326, 37951, 91901, 191651, 416701, 418401};\n\
    ```\n\nGiven this representation of the intervals, you could search through them\
    \ as\n\n```java\npublic static int indexOf(int value, int[] boundary) {\n    int\
    \ i, n;\n    n = boundary.length;\n\n    for (i = 0; i < n-1; ++i) {\n       \
    \ if ((value >= boundary[i]) && (value < boundary[i + 1])) {\n            return\
    \ i + 1;\n        }\n    }\n\n    return n;\n}\n```\n\n## The Pattern\n\nWhile\
    \ the implementation above is fine, it has a couple of shortcomings. First, it\
    \ uses a `for` loop, which might lead someone reading the code to think that the\
    \ loop is determinate (definite) when, in fact, it isn't. That is, reading the\
    \ code might assume that there are always $n-1$ iterations when there can be fewer.\
    \ Second, the containment checks to see if the target value is greater than the\
    \ left boundary and less than the right boundary every iteration. However, both\
    \ checks aren't really necessary since the right boundary of interval $n-1$ is\
    \ the same as the left boundary of interval $n$.\n\nThe first shortcoming can\
    \ be corrected by using a `while` loop. The second shortcoming can be corrected\
    \ by continuing to loop as long as the target value is greater than or equal to\
    \ the right boundary (meaning the correct interval has not yet found). Combining\
    \ the two ideas leads to the following pattern:\n\n```java\npublic static int\
    \ indexOf(int value, int[] boundary) {\n    int n;\n    n = boundary.length;\n\
    \    int i = 0;\n    while (i < n && value >= boundary[i]) {\n        i++;\n \
    \   }\n    return i;\n}\n```\n\n## Examples\n\nContinuing with the tax example,\
    \ you can now find the tax bracket for a particular income level as follows:\n\
    \n```java\nint[] single = {0, 9326, 37951, 91901, 191651, 416701, 418401};\nint\
    \ bracket;\nbracket = indexOf(25350, single);\n```\n\nYou then use a lookup array\
    \ (see Chapter 15) to find the marginal tax rate that corresponds to that bracket\
    \ as follows:\n\n```java\ndouble[] rate = {-1.0, 10.0, 15.0, 25.0, 28.0, 33.0,\
    \ 35.0, 39.6};\ndouble marginal;\nmarginal = rate[bracket];\n```\n\n## Some Warnings\n\
    \nThe obvious thing to be careful about using this is which side of the interval\
    \ is open and which side is closed. Mistakes here cause off-by-one defects that\
    \ are difficult to find.\n\nThe other thing to be careful about is less obvious.\
    \ One might be tempted to combine the interval membership functionality and the\
    \ lookup array functionality in a single method. For example, in the tax rate\
    \ example, one might be tempted to do the following:\n\n```java\npublic static\
    \ double taxRate(int income) {\n    int[] single = {0, 9326, 37951, 91901, 191651,\
    \ 416701, 418401};\n    double[] rate = {-1.0, 10.0, 15.0, 25.0, 28.0, 33.0, 35.0,\
    \ 39.6};\n\n    return rate[indexOf(income, single)];\n}\n```\n\nThe drawback\
    \ of this seemingly great idea is that one often wants to perform more than one\
    \ lookup with the same index. The easiest way to see this is with the grade example\
    \ from Chapter 15. Commonly, one wants to convert a numeric grade on a 0–100 scale\
    \ to both a letter grade on an F–A scale and a numeric grade on a 0–4 scale. Hence,\
    \ one wants to do interval membership search and two lookups.\n\n```java\nint[]\
    \ intervals = {0, 60, 63, 67, 70, 73, 77, 80, 87, 90, 93};\ndouble[] gp = {-1.0,\
    \ 0.0, 0.7, 1.0, 1.3, 1.7, 2.0, 2.3, 2.7, 3.3, 3.7, 4.0};\nString[] letter = {\"\
    NA\", \"F\", \"D-\", \"D\", \"D+\", \"C-\", \"C\", \"C+\", \"B-\", \"B\", \"B+\"\
    , \"A-\", \"A\"};\nint i;\ni = indexOf(88, intervals);\nout = String.format(\"\
    Grade: %s %.1f\", letter[i], gp[i]);\n```\n\nThere's no reason to do the interval\
    \ membership search separately for each of the two lookups. Hence, it is better\
    \ to have a separate `indexOf()` method.\n\n## Looking Ahead\n\nIn some situations,\
    \ the intervals don't cover all the real numbers (i.e., there are gaps). In such\
    \ situations, the value might not be in any interval. One to handle this (and\
    \ other situations) is to use conformal arrays as discussed in Chapter 17—use\
    \ one array to hold the left boundaries and another to hold the right boundaries.\n\
    \n## Conformal Arrays\n\nIn many situations there are multiple pieces of data\
    \ that need to be organized in a way that makes them easy to work with. While\
    \ this problem can sometimes be solved with a single array, many other times a\
    \ more powerful organizational scheme is needed. This is where conformal arrays\
    \ come in.\n\n## Motivation\n\nThe Federal Reserve Bank tracks monthly data about\
    \ many aspects of the economy. Suppose you are working with a group that has developed\
    \ a categorical measure of consumer confidence. The group wants to explore the\
    \ relationships between its measure of consumer confidence, the consumer price\
    \ index (CPI), the civilian unemployment rate (in percent), and the M2 money stock\
    \ (in billions of dollars) for the year 2018 (on a monthly basis). You need to\
    \ organize this information in such way that it can be used to conduct a variety\
    \ of different analyses.\n\n## Review\n\nAs you know, arrays make it very easy\
    \ to perform the same operation(s) on homogeneous values. So, if you were only\
    \ interested in the CPI, for example, you could store it in a\n"
  mdcn: "\n## 展望\n\n将任何类型的键（key）转换为整数（在特定范围内）的过程被称为哈希（hashing）。它是数据结构和算法课程中最重要的主题之一。本章使用了一些非常简单且直观的哈希函数，但哈希函数可能相当复杂，理解它们的属性可能需要深入的思考。\n\
    \n## 区间成员关系检查\n\n在许多情况下，类别是由区间定义的，因此有必要找到包含特定值的区间。本章考虑了组织此类数据并执行此类搜索的一种特定方法。\n\
    \n## 动机\n\n美国税法定义了一组称为税率级（tax brackets）的区间，每个税级都有一个对应的边际税率。2017年，这些税级（针对单身纳税人）的定义如表16.1所示。例如，收入为\
    \ 23,000 美元的人将处于 15% 的边际税率区间（即前 9,325 美元支付 10.0%，超过 9,325 美元的部分支付 15.0%）。\n\n\
    我们在本章的目标是对表 16.1 中的信息进行组织，以便于找到任何收入对应的边际税率。\n\n表 16.1. 2017年单身纳税人美国税级\n\n| 起 |\
    \ 终 | 费率 |\n| :--- | :--- | :--- |\n| 0 | 9,325 | 10.0 |\n| 9,326 | 37,950 | 15.0\
    \ |\n| 37,951 | 91,900 | 25.0 |\n| 91,901 | 191,650 | 28.0 |\n| 191,651 | 416,700\
    \ | 33.0 |\n| 416,701 | 418,400 | 35.0 |\n| 418,401 | 以上 | 39.6 |\n\n## 习习\n\n\
    虽然第15章关于查找数组（lookup arrays）使用了不同的术语，但某些示例与此处考虑的问题密切相关。例如，考虑寻找与特定数值成绩对应的字母等级的问题。本质上，需要找到包含该数值成绩的区间。然而，由于所有区间的大小相同，没有理由显式地列出这些区间。因此，第15章中的代码将类似\
    \ [90, 99] 的区间转换为索引 9。在本章中，情况涉及的是不规则的区间，需要不同的解决方案。\n\n## 思考问题\n\n税表有两个方便的属性（这些属性在许多类似的情况下通用）。首先，所有区间的并集是实数的相关子集（在本例中为非负实数）。换句话说，税表包含了每个可能收入的边际税率。其次，区间是不相交的。也就是说，任何两个区间的交集都是空集。\n\
    \n因此，每种收入都有唯一的边际税率，仅可以使用边界值序列 $b_0, b_1, \\dots, b_{n-1}$ 来确定。具体来说，假设你想“覆盖”整个实数集，区间\
    \ $I$ 可以定义为：\n\n$[-\\infty, b_0)$，区间 **1** 可以定义为 $[b_0, b_1]$，区间 **2** 可以定义为 $[b_1,\
    \ b_2]$，区间 $n-1$ 可以定义为 $[b_{n-2}, b_{n-1}]$，区间 $n$ 可以定义为 $[b_{n-1}, \\infty)$。对于示例，单身纳税人的边界为\
    \ **0.9326. 37951. 91901. 191651. 416701. 418401.**，使得区间为 $[-\\infty, 0)$, $[0,\
    \ 9326)$, $[9326, 37951)$, $[37951, 191651)$, $[191651, 416701)$, $[416701, 418401)$。\n\
    \n由于边界是同的（即它们是相同类型的值），单身纳税人的边界可以存储在一个数组中。例如，单身纳税人的边界可以存储在名为 `single` 的 `int[]`\
    \ 数组中：\n\n```java\nint[] single = {0, 9326, 37951, 91901, 191651, 416701, 418401};\n\
    ```\n\n给定这种区间表示，你可以通过以下方式进行搜索：\n\n```java\npublic static int indexOf(int value,\
    \ int[] boundary) {\n    int i, n;\n    n = boundary.length;\n\n    for (i = 0;\
    \ i < n-1; ++i) {\n        if ((value >= boundary[i]) && (value < boundary[i +\
    \ 1])) {\n            return i + 1;\n        }\n    }\n\n    return n;\n}\n```\n\
    \n## 模式\n\n虽然上面的实现是可行的，但它有两个缺点。首先，它使用了 `for` 循环，这可能会让阅读代码的人认为循环是确定的（有限的），但实际上并非如此。其次，这种实现在处理多个查找时不够直观。第一个缺点可以通过使用\
    \ `while` 循环来修正。第二个缺点可以通过只要目标值小于右边界就继续循环来修正。结合这两个想法导致了以下模式：\n\n```java\npublic\
    \ static int indexOf(int value, int[] boundary) {\n    int i, n;\n    n = boundary.length;\n\
    \    int j = 0;\n    while (j < n && value >= boundary[j]) {\n        j++;\n \
    \   }\n    return j;\n}\n```\n\n## 示例\n\n继续使用上述数组，现在可以通过以下方式找到某个收入对应的税率：\n\n```java\n\
    int[] single = {0, 9326, 37951, 91901, 191651, 416701, 418401};\ndouble bracket;\n\
    bracket = indexOf(income, single);\n```\n\n## 警告\n\n在使用这种方法时，需要注意的是哪侧是开区间，哪侧是闭区间。对于单身纳税人，我们可能会联以下操作：\n\
    \n```java\npublic static double taxRate(int income) {\n    int[] single = {0,\
    \ 9326, 37951, 91901, 191651, 416701, 418401};\n    double[] rate = {-1.0, 10.0,\
    \ 15.0, 25.0, 28.0, 33.0, 35.0, 39.6};\n\n    return rate[indexOf(income, single)];\n\
    }\n```\n\n另一个需要注意的是，我们通常需要对同一个索引进行多次查找。正如15章的成绩示例：\n\n```java\nint[] intervals\
    \ = {60, 63, 67, 70, 73, 77, 80, 87, 90, 93};\ndouble[] gp = {-1.0, 0.0, 0.7,\
    \ 1.0, 1.3, 1.7, 2.0, 2.3, 2.7, 3.3, 3.7, 4.0};\nString[] letter = {\"NA\", \"\
    F\", \"D-\", \"D\", \"D+\", \"C-\", \"C\", \"C+\", \"B-\", \"B\", \"B+\", \"A-\"\
    , \"A\"};\nint i;\ni = indexOf(88, intervals);\nout = String.format(\"Grade: %s\
    \ %.1f\", letter[i], gp[i]);\n```\n\n这种方法的缺点是，我们通常需要对同一个索引进行多次查找。正如15章的成绩示例：\n\
    \n```java\nint[] intervals = {60, 63, 67, 70, 73, 77, 80, 87, 90, 93};\ndouble[]\
    \ gp = {-1.0, 0.0, 0.7, 1.0, 1.3, 1.7, 2.0, 2.3, 2.7, 3.3, 3.7, 4.0};\nString[]\
    \ letter = {\"NA\", \"F\", \"D-\", \"D\", \"D+\", \"C-\", \"C\", \"C+\", \"B-\"\
    , \"B\", \"B+\", \"A-\", \"A\"};\nint i;\ni = indexOf(88, intervals);\nout = String.format(\"\
    Grade: %s %.1f\", letter[i], gp[i]);\n```\n\n## 形数组\n\n在许多情况下，需要将多个数据组织成一种易于处理的方式。虽然这类问题有时可以通过单个数组解决，但许多情况下需要更强大的组织方案。这就是形数组（conformal\
    \ arrays）的用场。\n\n## 动机\n\n联邦储备银行跟踪经济许多方面的月度数据。假设你正在为一个开发了分类消费者信心指标的小组工作。该小组想要探索他们的信心指标、消费者价格指数（CPI）、民用失业率（以百分比计）以及2018年M2\
    \ 货币供应量（以十亿美元为单位）之间的关系。你需要组织这些信息，以便进行各种不同的分析。\n\n## 习习\n\n正如你所知，数组使得对同质值执行相同操作变得容易。因此，如果你只对\
    \ CPI 感兴趣，例如，你可以将其存储在一个\n\n"
