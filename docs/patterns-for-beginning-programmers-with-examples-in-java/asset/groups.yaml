    \ `null`。\n\n这意味着对于所有使用引用类型表示的内容，你都有一种自然的方法来表示某些内容的缺失。例如，如果你不知道购买杂货的商店名称，你可以通过给相关变量赋值\
    \ `null` 来指示这一点。\n\n# 模式 (The Pattern)\n\n这一观察引出了解决通用问题的方案。具体来说，正如第 26 章关于输出参数所言，你可以使用包装对象来持有数值。当某个数据点缺失时，包装对象将为\
