    ## 截断


    整数通常需要更多的精度。在某些情况下，处理此类问题的方法是使用截断。截断问题可以通过第 3 章中的技术丢弃末位来解决。


    ## 动机


    假设你需要为一家公司编写工资程序。公司的员工每批获得固定金额，但仅针对十的倍数。对于库存目的，公司跟踪精确数字；对于工资，该数字需要的精度更多。例如，如果一个员工完成了
