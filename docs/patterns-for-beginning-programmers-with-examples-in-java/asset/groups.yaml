    # 开始与完成\n\nP 程序经常需要根据每个任务的工作量衡量，确定与特定工作量相关的任务数量。有时需要知道开始的任务数，有时则需要知道完成的任务数。本章将考虑这类问题的解决方案。\n\
    \n## 动机\n\n该模式名称中使用的术语源于棒球/垒垒球，在这些运动中，追踪投手开始比赛的次数和他们完成同一场比赛的次数是很常见的。然而，作为一个启发性示例，考虑跑步更好。例如，假设你为一家慈善机构工作，该机构有一个募捐活动，其中捐赠金额与圈数（取决于捐赠者是开始还是完成）挂钩，而不是英里数。每个参与者都有一个手环，可以跟踪他们跑步的英里。你的工作是编写一个程序，根据跑步的英里（工作量）和每圈英里（每个任务的工作量），计算跑步者开始和完成的圈数。\n\
    \n## 思考问题\n\n寻找完成数量的简单方法是使用除法。例如，如果一个参与者在 3 英里的跑道上跑了 7 英里，那么他们跑了 $7/3 = 2$ 圈。这种方法的明显缺陷是结果不是整数，而捐款是按每个“完整”圈承诺的。\n\
    \n幸运的是，你知道如何解决这个问题。事实上，示例本身就会让你想起在圆上（或者在本情况下是椭圆上）进行算术的概念以及使用整数除法。由此得出，0 英里对应于\
    \ $0/3$（即 0 圈），1 英里对应于 $1/3$（即 0 圈），7 英里对应于 $7/3$（即 2 圈），9 英里对应于 $9/3$（即 3 圈，等等）。\n\
    \n基于这一观察，你可能会认为你所需要的在完成数量上加 1，几次测试可能会让你确信这确实如此。例如，3 英里的跑道上跑 7 英里对应于 $7/3$（即 2）次完成和\
    \ $7/3+1$（即 3）次开始。遗憾的是，这个“解决方案”只在某些情况下正确。例如，3 英里的跑道上跑 9 英里对应 3 次完成和 3 次开始（而不是\
    \ 4 次开始）。换句话说，通常情况下当分母不能被分子整除时，你应该只在完成数量上加 1。\n\n## 模式\n\n模式的简单部分涉及第 4 章关于圆上算术的想法，并可以写为：\n\
    \n```\npublic static int completions(int work, int workTask) {\n    return work\
    \ / workTask;\n}\n```\n\n其中 `work` 对应于跑步的英里数，`workTask` 对应于跑道的长度。\n\n较复杂的部分涉及第\
    \ 7 章的指示方法，另一方面，它涉及另一个：\n\n```\npublic static int starts(int work, int workTask)\
    \ {\n    return completions(work, workTask) + remainderIndicator(work, workTask);\n\
    }\n```\n\n```java\npublic static int remainderIndicator(int num, int den) {\n\
    \    if (num % den == 0) {\n        return 0;\n    } else {\n        return 1;\n\
    \    }\n}\n```\n\n## 示例\n\n作为一个示例，假设一个参与者在 3 英里的跑道上跑了 26 英里。那么他们完成了 $26/3 = 8$\
    \ 圈，开始了 $26/3+1 = 9$ 圈。\n\n另一个示例，假设一个参与者在 3 英里的跑道上跑了 7 英里。那么他们完成了 $7/3 = 2$ 圈，开始了\
    \ $7/3+1 = 3$ 圈。\n\n"
