    # Digit Counting


    T here are many situations in which a program needs to know the number of digits
    in an int. Unfortunately, int variables don''t have properties other than their
    value. In other words, anthropomorphizing a little, int variables don''t know
    anything about themselves. This chapter considers solutions to this problem given
    this observation.


    # Motivation


    As you know from Chapter 3 on digit manipulation, in order to drop or extract
    digits from the left side of an integer, you needed to know the number of digits
    in the number. The examples in that chapter, the number of digits was known. Unfortunately,
    that isn''t always the case. For example, credit card account numbers might have
    between six and nine digits. The problem, then, is that of determining the number
    of digits in a number.


    # Review


    As you also know from Chapter 3 on digit manipulation, the position of a digit
    corresponds to a particular power of 10. Specifically, the digit in position $n$
    (counting from the right, starting with 0) corresponds to the $10^n$ place. For
    example,'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# David Bernstein


    position 2 corresponds to the $10^2$ or $100s$ place. To count digits you need
    to be able to invert the process. For example, to count a three-digit number,
    you need to find the position that the $100s$ place corresponds to.


    As hopefully recall, this is the domain of the logarithm. In a decimal (i.e.,
    base 10) representation, the $\log_{10}(x)$ is often described as the value of
    $n$ that 10 must be raised to in order to get $x$. More formally, $\log_{10}(x)$
    is the value of $n$ that satisfies $x = 10^n$. So, returning to our example, the
    position of the $100s$ place corresponds to $\log_{10}(100)$, which is 2 (since
    $10^2$ is 100). More generally, $\log_b(x)$ is the value of $n$ that satisfies
    $x = b^n$, where $b$ is referred to as the base (or radix) of the logarithm.


    # Thinking About The Problem


    Evaluating $\log_{10}(x)$ can be quite difficult, in general. However, it is easy
    to find bounds. For example, since $\log_{10}(100)$ is 2 and $\log_{10}(1000)$
    is 3 (and logarithms are monotonic) it follows that $\log_{10}(x)$ is in the interval
    $x \in [100, 1000]$. This means that the $\log_{10}$ of any three-digit number
    is in $[2, 3]$ and that the $\log_{10}$ of any four-digit number is in $[3, 4]$.
    For example:


    +   * $\log_{10}(7198)$ evaluates to approximately $3.857218423168926$ which,
    as expected, is in the interval $[3, 4]$.

    * $\log_{10}(462)$ evaluates to approximately $2.6646419755561257$ which, as expected,
    is in the interval $[2, 3]$.

    * $\log_{10}(10000)$ evaluates to $5.0$ which, as expected, is in the interval
    $[5, 6]$.'
