    a result, it is necessary to find the interval that contains a particular value.
    This chapter considers one specific way to organize the data and perform such
    a search.


    # Motivation


    The U.S. tax code defines a group of intervals called tax brackets, each of which
    has an associated marginal tax rate. In 2017, these tax brackets (for single taxpayers)
    were defined as in Table 16.1. For example, a person earning $23,000 would be
    in the 15% marginal bracket (i.e., pay 10.0% on the first $9,325, and 15.0% on
    everything over $9,325).


    Our objective in this chapter is to organize the information in Table 16.1 in
    such a way that it is easy to find the marginal tax rate for any income.'
