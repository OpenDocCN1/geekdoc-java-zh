  md: 'repeat themselves (e.g., days of the week, months of the year).


    **Truncation.** Solutions to the problem of truncating an integer to a particular
    digit (i.e., power of 10).


    The patterns in this part of the book arise so frequently that they are second
    nature to experienced programmers, which can be quite annoying for beginning programmers,
    who have to think about them every time they make use of them. In and of itself,
    this observation is evidence for the importance of studying both these patterns
    and those in the other parts of this book.'
