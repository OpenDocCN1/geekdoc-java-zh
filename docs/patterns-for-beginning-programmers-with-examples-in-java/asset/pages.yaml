  md: '# Programming Patterns xiii


    In many cases, the patterns build on each other. So, with a few exceptions, the
    parts of the book need to be considered in order. Unfortunately, since different
    programming courses/textbooks cover these topics in different orders, it may be
    necessary to gain a cursory understanding of some chapters, and then come back
    to them later. For example, some courses/textbooks cover methods before arrays
    (as in this book) while others cover them in the opposite order. Hence, it may
    be necessary to gloss over some of the patterns in Part III until after methods
    have been covered.


    Every chapter includes a motivation (i.e., a situation in which the problem being
    considered arises), the pattern (i.e., the solution to the problem), and examples.
    Many chapters also include one or more warnings, usually about not over-generalizing.
    Some chapters also include a “look ahead” at where the pattern might appear in
    later courses. The material in those sections is often more advanced and can be
    omitted (i.e., it is not required for subsequent chapters).


