  md: '# Looking Ahead


    If you take a course on systems programming you will probably work with packed
    integers, a pattern that is related to segmented/packed arrays. The difference
    is that, rather than working with the elements of an array, you will work with
    portions of the integer (as, for example, was briefly discussed at the end of
    Chapter 3 on digit manipulation and in Chapter 10 on bit flags).


    For example, because of the way the eye processes light, many visual output devices
    represent colors using a red component, a green component, and a blue component,
    each of which can take on 256 different values. Since each component can be represented
    in 8 bits, it is possible to represent a color using a 32-bit int (with 8 bits
    to spare).


    Suppose you want to ignore the highest-order (i.e., left-most) 8 bits, use the
    next 8 bits for the red component, the next 8 bits for the green component, and
    the lowest-order (i.e., right-most) 8 bits for the blue component. Suppose, further,
    that you want to create an int that contains the following shade of purple:


    ```

    int bb, gg, rr;

    rr = 69;

    gg = 0;

    bb = 132;

    ```


    In order to create the packed 32-bit integer, you need to shift the bits in the
    red component to the left by 16, the bits in the green component to the left by
    8, and leave the bits in the blue component where they are (i.e., in the least-significant
    bits). Then, you need to combine them into a single int using bitwise "inclusive
    or" operators. This can be accomplished as follows:


    ```

    int color;

    color = (rr << 16) | (gg << 8) | (bb << 0);

    ```


    This int will, of course, have a value (4522116 in this case), but it is of no
    interest. What is important, is that this int has several distinct components.


    To extract the red, green, and blue components from the packed int you must invert
    the process. That is, you need to'
  merge: -1
