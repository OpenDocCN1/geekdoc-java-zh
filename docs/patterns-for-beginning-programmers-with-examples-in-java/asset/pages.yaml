    double[] gp = {-1.0, 0.0, 0.7, 1.0, 1.3, 1.7, 2.0, 2.3, 2.7, 3.3, 3.7, 4.0};

    String[] letter = {"NA", "F", "D-", "D", "D+", "C-", "C", "C+", "B-", "B", "B+",
    "A-", "A"};

    \int i;

    i = indexOf(88, intervals);

    ut = String.format("Grade: %s %.1f", letter[i], gp[i]);

    ```


    There''s no reason to do the interval membership search separately for each of
    the two look-ups. Hence, it is better to have a separate indexOf() method.


