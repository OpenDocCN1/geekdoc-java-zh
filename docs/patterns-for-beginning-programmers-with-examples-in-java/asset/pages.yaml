    # A Gradebook Program


    Suppose you have to write a program that manages the grades in a course. After
    the initial grade is assigned, you must deduct the late penalty (which may, of
    course, be zero). You can implement this as follows:


    ```

    // Assign the initial grade

    grade = 85;


    // Reduce a grade by a late penalty

    grade = grade - latePenalty;

    ```


    # A Retail Sales Program


    Suppose you have to write a program that offers frequent buyers a 25% discount
    when they check out. You could solve this problem as follows:


    ```

    // Offer a 25% discount

    price = price - 0.25*price;

    ```


    Because the operator has the highest precedence, it is evaluated first. Then,
    the result of the multiplication operation is subtracted from the price (without
    changing the contents of any variables). Finally, the result of the subtraction
    operation is assigned to the variable price.


