  md: '# 18 David Bernstein


    for example, you wanted to get the right-most digit of 7198. You''d need to subtract
    7190, which requires knowledge of the three left-most digits (multiplied by 10).
    Similarly, to get the left-most digit, you''d need to subtract 198, the three
    right-most digits, and then divide by 1000. The two operations to consider are
    integer division and the remainder after integer division.


    If you divide 7198 by 10 (using integer division) you are left with 719. In other
    words, you have dropped the right-most digit and/or extracted the left-three digits.
    Similarly, if you divide 7198 by 100 you are left with 71. In other words, you
    have dropped the right-most two digits and/or extracted the left-most two digits.
    This is clearly progress.


    You can also make progress with the remainder after integer division. If you divide
    7198 by 10, the remainder is 8. In other words, you have dropped the left-most
    three digits and/or extracted the right-most digit. Similarly, if you divide 7198
    by 100, the remainder is 98. That is, you have dropped the left-most two digits
    and/or extracted the right-most digits.


    # The Pattern


    One aspect of the pattern should now be relatively easy to see, the operation.
    To drop from the right or extract from the left you must use integer division.
    On the other hand, to extract from the right or drop from the left you must use
    the remainder after integer division.


    The simpler cases involve counting from the right, and be handled as follows:


    +   - To drop the $n$ right-most digits from a number you must divide by $10^n$.

    - To extract the $n$ right-most digits from a number you must find the remainder
    after dividing by $10^n$.


    Extracting digits on the left and dropping digits on the left are both slightly
    more complicated because these operations require knowledge of the number of digits
    in the number as'
