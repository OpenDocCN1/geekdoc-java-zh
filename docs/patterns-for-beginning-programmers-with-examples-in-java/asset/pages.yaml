    # Missing Values


    When working with numeric data one often needs to deal with missing values. Failing
    to take this requirement into account early in the development process can cause
    enormous problems later on.


    # Motivation


    Suppose you''re writing a program that helps households manage their monthly budgets
    (in dollars and cents). Users of such a program have to enter their various expenditures
    every week. Unfortunately, people sometimes forget to do so. For example, someone
    might forget to enter their grocery expenditures for a particular week. When calculating
    their average expenditure on groceries, this missing value shouldn''t be treated
    as a 0.00, because that would skew the result. However it must be accounted for
    somehow.


    To deal with problems of this kind you must think about two things. First, you
    have to think about how to represent missing values. Second, you have to think
    about how to incorporate them into calculations of various kinds.


    # Review


    If you were given the task of writing such a budget program,'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'you almost certainly use a double to represent expenditures. Then, since expenditures
    must be non-negative, you would use a sentinel value like -1.00 to indicate that
    the expenditure is actually missing.


    There are two shortcomings of this approach for general situations. The first,
    and most important, is that in many there is no double value that can be used
    reliably as a sentinel because every possible double value is valid. The second
    is that it is error prone. Specifically, if at some point a programmer forgets
    to check if a value is a sentinel it will be used as if it is valid, resulting
    in incorrect results (a defect that is very difficult to localize and correct).


    # Thinking About The Problem


    Ideally, every data type would have an associated sentinel. Unfortunately, this
    isn''t the case. Fortunately, however, all reference types do have an associated
    sentinel, the reference null.


    This means you have a natural way to indicate that something is missing for everything
    that is represented using a reference type. For example, if you don''t have the
    name of the grocery store where a purchase was made, you can indicate that by
    assigning null to the relevant variable.


    # The Pattern


    This observation leads to a solution to the general problem. Specifically, as
    in Chapter 26 on outbound parameters, you can use wrapper objects to hold the
    numeric values. When a particular data point is missing the wrapper object will
    be null, otherwise the wrapper object will hold the value. Since there is no reason
    for the wrapper objects to be mutable, unlike Chapter 26, you can use the built-in
    Double and/or Integer classes.


    +   This is one of the reasons Double.parseDouble() method that creates String
    representations of numbers to double values throws a NumberFormatException when
    the parameter does not represent a number. There is no sentinel value that it
    could return to indicate that there was a problem.'
