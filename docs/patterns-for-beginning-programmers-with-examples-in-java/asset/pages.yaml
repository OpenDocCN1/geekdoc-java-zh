  md: "```\nindicatorNZ = (value + max) / (max + 1);\n```\n\n# The General Case\n\n\
    In the general case, you need to create an indicator that is 0 when a non-negative\
    \ value is less some threshold and 1 otherwise. The easiest way to create such\
    \ an indicator is to first calculate an intermediate value that is 0 when the\
    \ value is less than the threshold and positive otherwise, and then use a non-zero\
    \ indicator.\n\nTo do so, observe that, both value and threshold are in the interval\
    \ [0, max], it follows that, as required, (value / threshold) is 0 when value\
    \ is less than threshold and that it is in [1, max] otherwise. Hence, you can\
    \ calculate intermediate as follows:\n\n```\nintermediate = value / threshold;\n\
    ```\n\nThen, you can use intermediate and the expression for a non-zero indicator\
    \ to calculate a threshold indicator as follows:\n\n```\nindicatorT = (intermediate\
    \ + max) / (max + 1);\n```\n\nPutting it all together yields the following general\
    \ expression for a threshold indicator:\n\n```\nindicatorT = ((value / threshold)\
    \ + max) / (max + 1);\n```\n\nTo see that this is, indeed, a generalization of\
    \ the special case, you need only substitute 1 for threshold in this expression.\n\
    This leads to a general-purpose method like the following for calculating the\
    \ threshold indicator without an if statement:\n\n```\npublic static int indicator(int\
    \ value, int threshold, int max) {\n    return ((value / threshold) + max) / (max\
    \ + 1);\n}\n```"
