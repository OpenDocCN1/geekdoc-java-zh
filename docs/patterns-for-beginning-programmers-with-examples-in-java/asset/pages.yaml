    # Looking Ahead


    At this point, it is sufficient to think that integer values are represented in
    a specified number of bits with the left-most bit indicating the sign (0 for positive
    values and 1 for negative values). In fact, this is not the representational scheme
    that is used most commonly. One easily understood problem with such a scheme is
    there are two different representations of zero. Using eight bits, this has positive
    zero (00000000) and negative zero (i.e., 10000000). When you take a deeper look
    at data types, you will learn that the most common representation of integers
    is a system called two’s complement. This system essentially works like an odometer,
    with a single zero (00000000) that rolls up to the first integer (i.e., 00000001)
    and rolls back to the first integer (i.e., 11111111). This means there is one
    more negative number than there are positive numbers. Fortunately, the left-most
    bit of all negative numbers is still 1 and the left-most bit of all positive numbers
    is still 0.


    If, in the future, you take a course on data structures and algorithms you may
    also learn about the BitSet class which allows the number of flags to “grow”.
    In particular, you may consider the time and space efficiency of providing this
    functionality.'
