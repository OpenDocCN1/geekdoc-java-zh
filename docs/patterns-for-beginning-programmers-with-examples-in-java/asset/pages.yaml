    # Indicator Methods


    Sometimes the value needed to perform a calculation is known, and other times
    it too must be calculated. This is true of both “traditional” values and indicators
    (of the kind discussed in Chapter 6). This chapter considers problems in which
    an indicator’s value must be calculated before it can be used in another expression.


    # Motivation


    There''s a famous saying among performers, “the show must go on”, which means
    there must be a show whenever there’s an audience. In the context of Chapter 6
    on indicators, this means that the number of seats sold for a particular show
    must be used to calculate an indicator, setting it to 0 when no tickets have been
    sold and setting it to 1 otherwise. This is an example of a threshold indicator
    in which the threshold is 1.


    So, given that some number of tickets has been sold for a particular show time,
    you must determine the number of shows that must be offered at that time (i.e.,
    either 0 or 1). Letting shows denote the number of shows and sold denote the number
    of tickets sold, you want to calculate shows from sold in such a way that it takes
    the value 0 when sold is 0 and it takes on the value 1 for all positive values
    of sold.'
