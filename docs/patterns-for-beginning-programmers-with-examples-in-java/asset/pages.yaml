    # Review


    One approach to updating that you may have already seen involves the increment
    and decrement operators, ++ and --, which increase/decrease their operands by
    one. So, for example, you have probably seen something like the following:


    ```

    int age;


    // Initialize the age to 0 at birth

    age = 0;


    // Increase the age by 1 on the first birthday

    ageage++;

    ```


    What you may not know is, in some ways, this is just one (particularly simple)
    way of solving a specific updating problem (i.e., in which the variable is increased
    or decreased by exactly 1).


    # Thinking About The Problem


    The same result can be achieved in a slightly more complicated but, ultimately,
    more flexible way. To understand how, first remember that the assignment operator
    takes the result of evaluating the expression on its right and puts it in the
    memory location identified by the variable on its left. This is done three different
    times in the following example:


    ```

    intAge, increment, initialAge;


    initialAge = 0;

    increment = 1;

    currentAge = initialAge + increment;

    ```


    These three assignment statements are particularly easy to understand because
    the expression on the right side of the assignment operator does not involve the
    variable on the left side. However nothing about the syntax of assignment statements
    prevents this from being the case. For example, consider the following statement:


    ```

    // Add age and 1 and assign the result to the age

    age = age + 1;

    ```


    This statement first adds the value in the memory location'
