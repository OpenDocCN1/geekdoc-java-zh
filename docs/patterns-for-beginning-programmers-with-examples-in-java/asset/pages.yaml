- img_proc: true
  md: 'viii David Bernstein


    programming languages.


    +   2. The course teaches algorithmic thinking more than the syntax of the language(s)
    being used.


    In my experience, these claims are not completely justified. While the first is
    often true from a teaching perspective, it is not true from a learning perspective.
    In other words, students have enormous trouble taking what they have learned in
    one language and applying it in another. The second is an honest description of
    what the instructor wants to cover, but is a goal that is rarely achieved.


    In the worst cases, instructors in introductory programming spend all of their
    time teaching syntax and tools, and leave it to the students to figure out how
    to solve problems. Using concepts from Bloom’s taxonomy of the cognitive domain,
    such courses only teach “remembering” and “understanding,” and expect students
    to “analyze,” “evaluate,” “apply” and “create” on their own.


    In the better cases, instructors in introductory programming courses expose students
    to well-written code containing good solutions to problems and explain why the
    code is good. They, only hope that the students will internalize these solutions
    and be able to apply them in other contexts; these courses only teach “remembering,”
    “understanding,” “analyzing” and “evaluating,” but not “applying” and “creating.”


    In the best cases, instructors in introductory programming courses teach “applying”
    and “creating” as well. That is, they teach problem solving as well as programming.
    This book is designed to make it easier to do so.


    # Teaching Problem Solving with Patterns


    I have had colleagues over the years who have argued that problem solving cannot
    be taught, that students either have the ability or they do not. (I and others)
    disagree; I believe students can be taught problem solving in the following way:


    +   1. Demonstrate that it is possible to classify problems;'
