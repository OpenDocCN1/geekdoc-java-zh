  md: '# Programming Patterns 5


    identified by age and the value 1 and then assigns the result to the memory location
    identified by age. In other words, it does the same thing as ++age.


    The non-programmer this statement looks like a mistake because the non-programmer
    thinks that it says "age equals age plus one", which clearly can''t be true. However,
    that''s not what it says at all. It actually says "add value in the memory location
    identified by age and the value one, and put the result in the memory location
    identified by age".


    # The Pattern


    This idea can be generalized in a variety of ways recognizing the important pattern
    is the presence of the left-side operand on the right side of the assignment operator.
    In a fairly abstract way, the pattern can be written (in pseudo-code) as:


    ```

    value = value operator adjustment

    ```


    where value denotes the variable being updated, = denotes the assignment operator,
    operator denotes a binary operator, and adjustment represents the "amount" of
    the adjustment. Since operator has higher precedence than = , it is evaluated
    first. Then, the result of evaluation (which involves value) is assigned to value.


    This pattern is so common, that experienced programmers neither think about them
    nor to mention it to beginning programmers, but it''s not as obvious as everyone
    makes it out to be.


