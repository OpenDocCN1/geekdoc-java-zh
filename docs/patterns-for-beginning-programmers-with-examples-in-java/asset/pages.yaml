  md: 'a bitwise “and” with an appropriate mask, and then shift the bits to the right
    (to move them to the least-significant positions).


    The masks can be defined as follows:


    ```

    public static final int RED = (255 << 16);

    public static final int GREEN = (255 << 8);

    public static final int BLUE = 255;

    ```


    Then, the components can be extracted as follows:


    ```

    rr = (color & RED) >> 16;

    gg = (color & GREEN) >> 8;

    bb = (color & BLUE);

    ```'
