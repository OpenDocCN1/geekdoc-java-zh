    Beginning programmers need to be a little careful when using compound assignment
    operators. To see why, consider the following two statements:


    ```

    i = +1;

    j -= -1;

    ```


    While they look like they use compound assignment operators, they do not — compound
    assignment operators end with the character that is used for the assignment operator,
    they don''t start with it. That is, += is a compound assignment operator, but
    += is not.


    However, both of these statements are syntactically valid and, hence, will compile.
    This is because they use the assignment operator (i.e., =) followed by the unary
    “positive” (i.e., +) or “negative” (i.e., -) operators, without any white space
    between them. That is, they are the same as the following two statements:


    ```

    i = +1;

    j = -1;

    ```


    just with different spacing.'
