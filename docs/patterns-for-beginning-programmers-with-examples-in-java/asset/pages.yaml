    # Examples


    It''s useful to consider examples of both threshold indicators and other indicators.


    # Threshold Indicators


    Continuing with the entertainment example, the threshold is 1 (i.e., if the size
    of the audience is 1 or more than to be a show), given the size of the audience
    (represented by the variable size), the number of shows is given by the following:


    ```

    shows = indicator(sold, 1);

    ```


    Returning to the parking ticket example used in Chapter 6, letting the number
    of prior tickets be given by priors, the fine can be calculated as follows:


    ```

    baseFine = 10.00;

    repeatOffenderPenalty = 35.00;

    totalFine = baseFine + (indicator(priors, 1) * repeatOffenderPenalty);

    ```


    It is also instructive to return to the car rental example from Chapter 6. For
    this example, you can initialize the necessary variables as follows:


    ```

    baseRate = 19.95;

    ageSurcharge = 10.00;

    ageThreshold = 25;

    multiSurcharge = 5.00;

    multifreshold = 1;

    ```


    Then, you can calculate the daily rate as follows:


    ```

    rate = baseRate

    + (1 - indicator(minimumAge, ageThreshold)) * ageSurcharge

    + indicator(extraDrivers, multiThreshold) * multiSurcharge;

    ```


    Notice that, the age surcharge uses a converse indicator while the multi-driver
    surcharge uses an ordinary threshold indicator.'
