    not yet found its way into introductory programming courses.

    This book is an attempt to remedy that shortcoming.


    Two things distinguish programming patterns from other kinds of patterns: the
    problem domain (i.e., programming) and the level of abstraction. Programming patterns
    are at a higher level of abstraction idioms because the concepts are not specific
    to a language (or language family). In other words, a programming pattern is not
    a “turn of phrase” (i.e., idiom) in a particular programming language. Instead,
    it is a generic solution to a problem that might arise in many languages; it is
    a way of thinking programmatically. Programming patterns are at a lower level
    of abstraction than design patterns and architectural styles. In other words,
    the use of a programming pattern leads to the creation of a small fragment of
    code that will be a part of a larger system, whereas the use of a design pattern
    or architectural style leads to the creation of a description of the interactions
    between the entities in a large system.


    Unlike books on design patterns and architectural styles used in upper-level courses,
    this book does not stand alone. Instead, it is a supplement to the traditional
    textbooks used in introductory programming courses. A traditional textbook helps
    in the teaching of “remembering”, “understanding”, “analyzing” and “evaluating.”
    This book helps in the teaching of “applying” and “creating.” It assumes that
    the reader already knows the syntax of the statements in the fragments (which
    can be learned using a standard textbook) and focuses on the reasoning process
    that leads to the fragments.


