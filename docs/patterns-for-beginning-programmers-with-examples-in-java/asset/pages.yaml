    # The Pattern


    Suppose you want to swap the contents of two memory locations identified by a
    and b (or, more succinctly, suppose you want to swap the contents of two variables,
    a and b). Before starting, you need a memory location that can be used to temporarily
    store the contents of either a or b. Calling that variable temp, the swapping
    pattern can then be implemented as follows:


    ```

    temp = a;

    a = b;

    b = temp;

    ```


    The process can be visualized as in Figure 2.3. In step 1, the contents of a is
    temporarily stored in the memory location identified by temp. In step 2, the contents
    of b is stored in the memory location identified by a. Finally, in step 3, the
    contents of temp is stored in the memory location identified by b.'
