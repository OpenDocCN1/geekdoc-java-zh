  md: '# Preface


    My introductory programming courses always start with some loose definitions.
    I define an algorithm as an unambiguous process for solving a problem using a
    finite amount of resources, and a heuristic as solving process that is not guaranteed
    to be perfect/exact or finite. I explain that algorithms/heuristics written for
    a computer are commonly written in languages, called (high-level) programming
    languages, that are easily understood by humans, unambiguous, and easily converted
    into machine-readable form. I point out that an algorithm/heuristic written in
    a programming language is a program (or code), and the process of doing so is
    called programming (or coding), which is what they will be studying for the remainder
    of the term.


    As a practical matter, most introductory programming courses, mine included, using
    a single, specific programming language and, not surprisingly, there is considerable
    debate about which language is best for teaching beginning programmers (or whether
    it matters). However, there is, generally, consensus about the role that the programming
    language and the goals of such courses. Indeed, most introductory programming
    courses make claims like the following:


    +   1. The concepts covered using the particular programming language selected
    for the course are applicable across a wide variety of other'
  merge: -1
