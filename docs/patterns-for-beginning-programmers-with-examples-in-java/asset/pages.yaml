    is at position 0). Then, you know that the middle character in the line has index
    4 (i.e., 9 / 2, using integer division), since there are four characters to the
    left of index 4 and four characters to the right of index 4.


    Suppose further that the text is five characters wide and is 0-based. Then, you
    know that the middle character of the text has index 2 (i.e., 5 / 2), since there
    are two characters to the left of index 2 and two characters to the right of index
    2.


    So, in order to center the text in the line, you want character 2 of the text
    to be at position 4 of the line. This means that character 0 of the text must
    be at position 2 of the line.


    # The Pattern


    The centering pattern is nothing more than a generalization of this example. First,
    instead of text, you should think more generally about content. Second, instead
    of a line, you should think more generally about a container. Both the content
    and the container have an extent that generalizes the notion of the width in the
    example, and a reference that generalizes the notion of a starting character.


    The centering problem is to find the reference for the content, given the reference
    and extent of the container and the extent of the content. Letting C denote the
    container, C denote the content, and the superscripts R and M denote the reference,
    extent, and midpoint respectively (for each dimension), the centering pattern
    involves three steps.


    However, these capabilities are not normally discussed in introductory programming
    courses. In addition, even with such a console, the centering pattern is needed
    to find the row or column. Such a console just eliminates the need to pad the
    String.'
