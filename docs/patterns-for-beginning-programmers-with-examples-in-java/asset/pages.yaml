  md: '# 98 David Bernstein


    pattern is which side of the interval is open and which side is closed. Making
    mistakes here cause off-by-one defects that are difficult to find.


    The other thing to be careful about is much less obvious. One might be tempted
    to combine the interval membership functionality and the look-up array functionality
    in a single method. For example, in the tax rate example, one might be tempted
    to do the following:


    ```

