    Conformal Arrays


    In many situations there are multiple pieces of data that need to be organized
    in a way that makes them easy to work with. While this problem can sometimes be
    solved with a single array, many other times a more powerful organizational scheme
    is needed. This is where conformal arrays come in.


    # Motivation


    The Federal Reserve Bank tracks monthly data about many aspects of the economy.
    Suppose you are working with a group that has developed a categorical measure
    of consumer confidence. The group wants to explore the relationships between its
    measure of consumer confidence, the consumer price index (CPI), the civilian unemployment
    rate (in percent), and the M2 money stock (in billions of dollars) for the year
    2018 (on a monthly basis). You need to organize this information in such way that
    it can be used to conduct a variety of different analyses.


    # Review


    As you know, arrays make it very easy to perform the same operation(s) on homogeneous
    values. So, if you were only interested in the CPI, for example, you could store
    it in a'
