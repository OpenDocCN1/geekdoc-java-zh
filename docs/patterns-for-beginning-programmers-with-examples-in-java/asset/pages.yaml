  md: 'A table can be conceptualized in two ways. On the one hand, you can think about
    a table as consisting of rows, each of which consists of columns. The latter is
    called *row-major* form (i.e., rows first). On the other hand, you can think about
    a table as consisting of columns, each of which consists of rows. This is called
    *column-major* form. In the first case, one array can be used to store each row;
    in the second case, one array can be used to store each column


    Regardless of which approach you use, the arrays will be conformal. That is, they
    will share a common index. If you use one array for each column then the common
    index will be the conceptual row headers. In the example above, if you use this
    approach, the indexes will correspond to the months. On the other hand, if you
    use one array for each row then the common index will be "Month", "CPI", "Unemployment",
    "M2", and "Confidence".


    # The Pattern


    To obtain a solution to the problem you need only whether to use an array for
    each column or an array for each row. Fortunately, in most situations, this is
    an easy decision to make. Specifically, you should choose the alternative that
    satisfies the following criteria:


    +   - The elements of the array must be of the same type;

    - The indexes must be easily representable as *int values*


    In many situations, only one alternative will satisfy both criteria.


    Each conformal array can then be thought of as an individual *record* that has
    an index number. So, if you have two arrays named `fieldA` and `fieldB`, then
    record number `i` consists of `fieldA[i]` and `fieldB[i]`. This is illustrated
    in Figure 17.1 for some data about four different people. The names of the people
    are stored in the `String[]` named `fieldA`, and the number of science fiction
    books they own are stored in the `int[]` named `fieldB`.'
