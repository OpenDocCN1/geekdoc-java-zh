  md: '[1]


    # Updating


    Every algorithm of any consequence makes extensive use of arithmetic operators,
    whether it is executed by hand or realized as a computer program and executed
    by a computer. However, the two are different in one very important way. Calculations
    that are performed by hand tend to progress the page, using more and more memory
    (i.e., paper) as they proceed. Programs, on the other hand, tend to declare a
    small number of variables, assign values to them, and then assign updated values
    to them. This chapter considers different ways of updating variables.


    # Motivation


    Suppose you are writing a program that keeps track of the age of your favorite
    relative. You might declare an int variable named age and assign your favorite
    relative''s current age to that variable.


    Now, suppose you need to perform a calculation involving that''s age next year.
    Obviously, you know that their age will be one greater than it is now. But, should
    you create another variable for that value, or should you just update the value
    of age? In some situations you need to do the former, but suppose what you need
    to do is update the existing variable. It turns out that there are a variety of
    different ways that you can proceed.'
  merge: -1
