    as the number of digits to extract or drop. Letting $N$ denote the number of digits
    in the number, the pattern can be completed as follows:


    +   - To extract the $n$ left-most digits from a number you must divide by $10^{N-n}$.

    - To drop the $n$ left-most digits from a number you must find the remainder after
    dividing by $10^{N-n}$.


    # Examples


    Returning to the credit card example, suppose the account number is 412831758.
    To extract the card type from the account number you need to extract the right-most
    digit. This means that you must find the remainder after dividing by $10^1$ (or
    10). You can accomplish this as follows:


    ```

    cardNumber = 412831758;

    accountType = cardNumber % 10; // Extract right-most 1 digit

    ```


    To extract the issuing bank number you must extract the left-most digits of a
    nine digit number. This means that you must divide by $10^9-3$, or $1000000$.
    This can be accomplished as follows:


    ```

    cardNumber = 412831758;

    issuer = cardNumber / 1000000; // Extract left-most 3 (of 9) digits

    ```


    The part of the account number that identifies the account holder consists of
    the remaining digits. To get this part of the account number you must first drop
    the left-most digits (i.e., you must find the remainder after dividing by $10^{9-3}$).
    Then, you must drop the right-most digit of the result (i.e., you must divide
    the result by $10^1$). This can be accomplished as follows:


    ```

    cardNumber = 412831758;

    holder = (cardNumber % 100000) / 10;

    ```


