  md: '# Outbound Parameters


    Though it is not always discussed in introductory programming courses, parameters
    can be used to pass information to a method (i.e., inbound parameters), to pass
    information from a method (i.e., outbound parameters), or to do both (i.e., in-out
    parameters). While some programming languages make this explicit, Java does not.


