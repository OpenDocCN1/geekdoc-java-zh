    # Delimiting Strings


    M any programs, whether they have a textual user interface or a graphical user
    interface, need to combine an array of String objects into a single String object
    that has a delimiter between every pair of elements. There are several ways of
    accomplishing this goal.


    # Motivation


    Suppose you want to generate the String object "Rain, Sleet, Snow" from a String[]
    containing the elements "Rain", "Sleet,", and "Snow". One way to think about the
    desired result is that there is a comma (the delimiter) between every pair of
    elements. A second way to think about the desired result is that there is a comma
    after every item except the last one. A third way to think about the desired result
    is that there is a comma before every item except the first one. As it turns out,
    each leads to a different implementation.


    # Review


    Since you are going to iterate over the String[] array and consider each element
    individually, the first conceptualization is a little awkward to deal with. Specifically,
    you will need to consider both element i and i-1 or i+1 at each iteration.'
