  md: "# The Pattern\n\nMore generally, the $\\log_{10}$ of any $n$-digit number will\
    \ be in the interval $[n - 1, n)$, which means it will be greater than equal to\
    \ $n - 1$ and strictly less than $n$. Hence, the integer part of $\\log_{10}$\
    \ of any $n$-digit number will be $n - 1$. So, the number of digits in the number\
