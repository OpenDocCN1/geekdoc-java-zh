    double[] rate = {-1.0, 10.0, 15.0, 25.0, 28.0, 33.0, 35.0, 39.6};


    return rate[indexOf(income, single)];

    }

    ```


    The drawback of this seemingly great idea is that one often wants to perform more
    than one lookup with the same index.


    The easiest way to see this is with the grade example from Chapter 15 on lookup
    arrays. Commonly wants to convert a numeric grade on a 0–100 scale to both a letter
    grade on an F–A scale and a numeric grade on a 0–4 scale. Hence, one wants to
    do interval membership search and two look-ups.


    ```

