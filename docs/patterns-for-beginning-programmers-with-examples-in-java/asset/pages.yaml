    \nReturning to the manufacturing example, the truncated value is 520. What about\
    \ the rounded value? Since the actual number of items is 526, and 526 is at least\
    \ halfway between 520 and 530, the rounded value should be 520. Hence, the truncated\
    \ value needs to be adjusted by 10 to get the rounded value.\n\nGoing from this\
    \ specific example to a more general solution requires two observations. First,\
    \ if the rounded value is larger than the truncated value, it is larger by exactly\
    \ the amount (i.e., 10 in the example). Second, to determine if the rounded value\
    \ is larger than the truncated value, you need to compare the difference between\
    \ the number and the truncated value (i.e., 6 in the example), which is also the\
