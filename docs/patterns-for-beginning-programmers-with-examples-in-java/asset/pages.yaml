  md: '[13]


    # Accumulators


    In some situations, the iterations of a loop are independent of each other. However,
    in many situations a program needs to “keep track of” something over the course
    of multiple iterations. In situations like these, accumulators often come into
    play.


    # Motivation


    If you ask someone “on the street” how to add a column of numbers by hand, they
    will probably say something like “just add them up”. If you ask them to demonstrate
    with a column of fifty single-digit numbers, they probably won’t have any trouble.
    However, if you talk to them while they’re doing it (especially if you drop some
    numbers into the conversation), they’ll have much more difficulty, and may not
    be able to do it all.


    If you then suggest that they “write things down” as they go, there’s a good chance
    that they won’t know what you mean and/or how that would help. The reason is that,
    when adding single-digit numbers, people use their brain both to add pairs of
    numbers and to store the result, and they can’t imagine how to use paper for storage.
    However, as you know, writing a program you must carefully differentiate between
    the two.'
  merge: -1
  pgno: 91
