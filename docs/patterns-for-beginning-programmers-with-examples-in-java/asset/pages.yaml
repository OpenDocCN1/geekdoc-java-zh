  md: '# Digit Manipulation


    n most programming languages, integer types (e.g., int in Java) are atomic. That
    is, they do not have constituent parts. However, there are many situations in
    which one needs to manipulate the individual digits of an integer value. This
    chapter considers different ways of doing so.


    # Motivation


    Suppose you are writing a program for a credit card company that has accounts
    of various kinds. All account numbers are nine digits long, they never start with
    a 0, the leftmost three digits represent the issuing bank, and the right-most
    digit indicates the type of account (e.g., debit, credit, crypto currency).


    Because account numbers are nine digits long, and the maximum int value is $2^{31}-1$
    (or 2, 147, 483, 647), you decide to represent each account number as an int.
    However, you realize that this means you will need to extract digits from the
    account number, both from the left and from the right. In other words, you need
    to solve some digit manipulation problems.


    +   1. Of course, we know now that atom does have constituent parts. The term
    “atomic” is used for historical reasons.'
