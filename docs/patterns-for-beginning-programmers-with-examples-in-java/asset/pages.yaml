    # Indicators


    M any programs must perform calculations that vary based on conditions of one
    kind or another. There are many different ways to accomplish this but one very
    powerful (and common) solution is to use a multiplicative variable that takes
    on the value zero when the condition is not satisfied and the value one when it
    is.


    # Motivation


    Variables of this kind are common in many branches of mathematics and are called
    indicator variables.¹ They are often denoted using a lowercase delta (i.e., $\delta$),
    often with a subscript to denote the condition (e.g., $\delta_s$ to indicate whether
    a person smokes or not). Indicator variables are then multiplied by other variables
    in more complex expressions.


    For example, suppose you are writing a program to predict the birth weight of
    babies (in grams) from the gestation period (in weeks). You might theor that the
    weight will be lower if the mother smokes during pregnancy. Ignoring whether the
