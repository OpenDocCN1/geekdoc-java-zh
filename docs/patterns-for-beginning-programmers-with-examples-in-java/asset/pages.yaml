  md: '# [PART I]

    Patterns Requiring Knowledge of Types, Variables, and Arithmetic Operators


    Part I contains programming patterns that require an understanding of data types,
    variables and identifiers, the declaration of variables and a basic understanding
    of memory, the assignment operator and its impact on memory, and arithmetic operators.
    Many of the patterns in this part of the book make extensive use of integer arithmetic.


    Specifically, this part of the book contains the following programming patterns:


    **Updating.** Solutions to the problem of how to update a variable.


    **Swapping.** A solution to the problem of swapping the contents of two variables
    (of the same type).


    **Digit Manipulation.** Solutions to the problems of extracting and deleting the
    digits of an integer (from both the right and left sides).


    **Arithmetic on the Circle.** A solution to the problem of performing basic arithmetic
    operations on quantities that'
