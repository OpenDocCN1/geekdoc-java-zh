    # Swapping


    Programs commonly need to swap the contents of two variables. While this probably
    seems simple at first glance, it''s actually a little more complicated than it
    seems.


    # Motivation


    Suppose, for example, that you are writing a fantasy role playing game. In such
    games, players commonly acquire items of various kinds (e.g., weapons, spells,
    gold, food). When they acquire an item, a representation of it (e.g., a ''T''
    character for a teleportation spell) is assigned to a variable of appropriate
    type (e.g., a char variable named spell). As the game progresses, two players
    might realize that it would benefit both of them to swap their spells. This chapter
    introduces a sequence of statements that can be used to solve this problem.


    # Review


    There are a couple of things to recall in this regard. First, remember that the
    assignment operator (i.e., the = operator), stores the right side operand in the
    memory location identified by the left side operand. So, the statements in the
    following fragment:


    ```

    char swordOfAlice, swordOfBetty;

    ```'
