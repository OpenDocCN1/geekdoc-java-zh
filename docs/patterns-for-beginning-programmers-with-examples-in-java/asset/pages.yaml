    It is possible for the invoker to pass an invalid offset and or invalid length.
    Hence, you should validate these parameters and respond to invalid values appropriately.


    There are two common responses to invalid values. One is to throw an IllegalArgumentException.
    The other is to use 0 for values of offset that are too small, the array''s length
    for values of offset that are too large, and the array''s length for values of
    offset + length that are too large.'
