  \ `记事本`。在输入 Java 程序后，在另存为对话框中选择“所有文件”，将其保存到文件夹 `C:\\JAVAPRG`。编译和运行需要遵循上述步骤。\n\n\
  ## Java 程序语法\n\n```java\nclass <class name>\n{\n    public static void main(String\
  \ args[]) or (String [] args)\n    {\n        // - - - - - - - - - -\n    }\n}\n\
  ```\n\n# 示例\n\n### 第一个 Java 程序 - 两个数字相加 (Sum.Java)\n\n```java\nclass Sum\n{\n  \
  \  public static void main(String args[])\n    {\n        int a,b,sum;\n       \
  \ a = 5;\n        b = 6;\n        sum = a + b;\n        System.out.print(\"Sum is\
  \ \" + sum); //输出\n    }\n}\n```\n**输出：** `Sum is 11.`\n\n### 示例 1.2 交换两个数字程序 (Swap.Java)\n\
  \n```java\nclass Swap\n{\n    public static void main(String args[])\n    {\n  \
  \      int a=5,b=7;\n        t = a;\n        a = b;\n        b = t;\n        System.out.print(\"\
  After Swap Values are \" + a + \",\" + b);\n    }\n}\n```\n**输出：** `After Swap Values\
  \ are 7,5`\n\n## 语言规则\n\n- **注释** - 注释有三种类型：\n    - 单行注释：`//`\n    - 多行注释：`/* */`\n\
  \    - 文档注释：`/** */`\n- 每个 Java 程序都必须包含一个类。在 Java 中，`main()` 方法只能定义在类内部。\n- 源文件可以包含任意数量的类和/或接口定义，但最多有一个公共类或接口。\n\
  - 源文件可能包含也不包含带有 `main()` 方法的类，但一个独立的 Java 程序始终从 `main()` 方法开始执行。因此，我们想要开始执行的类必须在其中定义了\
  \ `main()` 方法。\n- `main()` 方法必须始终具有以下签名：`public static void main(String args[])`\n\
  - **注意** - 在 Java 中，方法原型被称为签名（signature）。\n- 关键字 `public` 表示该方法可以从任何地方访问。\n- 关键字\
  \ `static` 表示 `main()` 可以在不创建对象的情况下被调用。\n- 关键字 `void` 表示 `main()` 不返回任何值。\n- `System`\
  \ 是一个提供系统访问的预定义类，而 `out` 是连接到控制台的输出流。\n\n## Java 程序结构\n\n- **文档部分** - 文档部分包含一组注释，给出程序名称、作者以及程序员在以后阶段可能参考的其他信息。\n\
  - **包语句** - 源文件最多有一个包语句。如果存在包语句，它必须是 Java 程序的第一个语句。\n- **导入语句** - 源文件可以包含零或多个导入语句。导入语句类似于\
  \ C/C++ 中的 `#include` 语句。\n- **接口语句** - 接口类似于类，但包含一组方法声明。这也是一个可选部分，仅在我们希望程序中实现多重继承特性时使用。\n\
  - **不包含 main 方法的类定义** - 类是 Java 程序的核心元素。这些类用于映射现实世界的对象。\n- **包含 main 方法的类定义** -\
  \ 由于每个独立的 Java 程序都需要 `main` 方法作为起点，该类是 Java 程序的关键。\n\n## 垃圾回收\n\nJava 对象的内存分配是完全动态的，但\
  \ Java 不像 C/C++ 那样支持指针算术。每当我们运行 Java 程序时，JVM 也会后台运行另一个名为 `垃圾回收器` (Garbage Collector)\
  \ 的程序。垃圾回收器会持续检查 Java 对象。\n\n\n\n\n当一个 Java 对象不再被使用时，它会被垃圾回收器（Garbage Collector）收集，也就是说为对象分配的内存被添加到空闲内存的\
  \ `pool/heap` 中并重用。这在很大程度上简化了程序员的任务。这也消除了许多由于不当使用指针算术和显式释放内存等内存管理功能引起的错误。\n\n# 单选题：\n\
