  \ 组件作为组件存在。有三个构造函数：\n\n`Scrollbar ()`\n创建一个垂直滚动条。\n\n`Scrollbar (int orientation)`\n\
  创建一个具有指定方向的滚动条。\n\n`Scrollbar (int orientation, int initialValue, int sliderSize,\
  \ int minValue, int maxValue)`\n创建一个具有指定方向、初始值、滑动尺寸、最小值和最大值的滚动条。`sliderSize` 参数控制滑动块的大小，单位为像素。对于接受\
