  \ `TextComponent`。\n\n`Object` -> `Component` -> `TextComponent` -> (`TextField`,\
  \ `TextArea`)\n\n这两个类（`TextField` 和 `TextArea`）都有多种构造函数，这些函数提供了指定或不指定初始字符串或首选尺寸的选择。未指定首选尺寸的构造函数最适用于布局管理器将忽略组件首选尺寸的情况。\n\
  \n#### TextField 类的构造函数\n\n`TextField()`\n构造一个新的文本字段。\n\n`TextField(int columns)`\n\
  构造一个具有指定列数的新的空文本字段。\n\n`TextField(String text)`\n构造一个带有指定文本的文本字段。\n\n`TextField(String\
  \ text, int columns)`\n构造一个带有指定文本和指定列数的文本字段。\n\n#### TextArea 类的构造函数\n\n`TextArea()`\n\
  构造一个新的文本区域。\n\n`TextArea(int rows, int columns)`\n构造一个具有指定行数和列数的新的文本区域。\n\n`TextArea(String\
  \ text)`\n构造一个带有指定文本的文本区域。\n\n`TextArea(String text, int rows, int columns)`\n构造一个带有指定文本、行数和列数的文本区域。\n\
  \n`TextArea(String text, int rows, int columns, int scrollbarPolicy)`\n构造一个带有指定文本、行数、列数和指定滚动条策略的文本区域。\n\
  \n`TextArea` 类定义了几个可以作为 `scrollbarPolicy` 参数的常量：`SCROLLBARS_BOTH`、`SCROLLBARS_VERTICAL_ONLY`、`SCROLLBARS_HORIZONTAL_ONLY`\
  \ 以及 `SCROLLBARS_NONE`。\n\n#### TextField 方法\n\n`getSelectedText()`\n获取此组件选中的文本。\n\
  \n`getText()`\n获取此组件显示的文本。\n\n`setEditable(boolean b)`\n设置标志，以决定此组件是否可编辑。\n\n`setText(String\
  \ t)`\n将此组件显示的文本设置为指定的文本。\n\n### TextFieldTest 示例\n\n```java\nimport java.awt.*;\n\
