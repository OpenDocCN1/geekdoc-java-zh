  Button Size :0 0\nButton Size: 52 35\nFrame Size: 123 34\nFrame Size : 123 100\n\
  frame0,20,20,123x100,layout=java.awt.FlowLayout,title=,resizable,normal\n\n### 示例\
  \ 17.3\n\n如果我们把上述程序中的行：\n`f.setLayout(new FlowLayout(FlowLayout.CENTER));`\n更改为\n\
  `f.setLayout(new FlowLayout(FlowLayout.LEFT));`\n那么组件将左对齐。\n\n输出：\n![image](img/image007.png)\n\
  \n### 示例 17.4\n\n如果我们把上述程序中的行：\n`f.setLayout(new FlowLayout(FlowLayout.LEFT));`\n\
  更改为\n`f.setLayout(new FlowLayout(FlowLayout.RIGHT));`\n那么组件将右对齐。\n\n输出：\n![image](img/image075.png)\n\
  \n### 示例 17.5\n\n我们可以通过在设置布局时使用重载构造函数来更改行之间的间距（水平间距）和行之间的间距（垂直间距）：\n![image](img/image020.png)\n\
  `f.setLayout(new FlowLayout(FlowLayout.CENTER, 20 ,20))`\n![image](img/image078.png)\n\
  vgap（行间距） hgap（组件间距）\n输出：\n![image](img/image046.png)\n\n### GridLayout（网格布局）\n\n\
  GridLayout 的功能封装在 `java.awt.GridLayout` 类中。`GridLayout` 管理器以表格形式的行和列排列组件。我们可以将容器空间视一个由行和列组成的网格。在指定布局时，我们必须指定行和列的数量。\n\
  \n`GridLayout` 管理器会将与行的大小（布局中指定的列数）相适应的组件放入第一行，并将其他组件移动到第二行，依此类推。这类似于电子表格，被分为固定数量的行和列。\n\
  \n流式布局管理器始终尊重组件的优选尺寸。`GridLayout` 管理器采取了相反极端：当它在给定空间执行布局时，它会忽略组件的优选尺寸。网格布局中的每一行和每一列的大小都相同，布局可用的总区域在行数和列数之间平均平分。网格布局使用“行优先”表示法，即组件按照它们被添加的顺序从左到右、逐行出现。\n\
  \n当我们添加较少组件（即显著少于行数乘以列数）或大量组件（即多于行数乘以列数）时，`GridLayout` 的表现会很奇怪。如果将相同的组件放在更高、更窄的框架中，那么每个组件都将按比例变得更高、更窄。\n\
  \n### 示例 17.6\n\n```java\nimport java.awt.*;\n\npublic class MyFrame6 extends Frame\n\
  {\n    public static void main(String args[])\n    {\n      Frame f = new MyFrame6();\n\
  \      f.setLayout(new GridLayout(5,3));\n      for(int row=0; row<5; row++)\n \
  \     {\n        f.add(new Label(\"Label\" + row));\n        f.add(new Button(\"\
  Button\" + row));\n        f.add(new TextField(\"TextField\" + row));\n      }\n\
  \      f.setSize(500,200);\n      f.setVisible(true);\n    }\n}\n```\n\n输出：\n![image](img/image50.png)\n\
  \n### BorderLayout（边界布局）\n\nBorderLayout 的功能封装在 `java.awt.BorderLayout` 类中。`BorderLayout`\
  \ 是框架的默认管理器，程序员早晚都会与之打交道。`BorderLayout` 管理将可用空间分为五个部分：北、南、东、西和中心。我们可以在每个区域添加组件。这五个区域中的每一个可以是空的，也可以包含一个组件（即每个区域只能包含一个组件）。\n\
  \n`BorderLayout` 执行了一种非常实用的布局策略，但可能不如流式布局或网格布局直观。`BorderLayout` 管理器尊重北和南组件的优选高度，并强制它们与容器一样宽。北和南区域适用于工具栏、状态栏以及任何应该尽可能宽但高度不高于所需的控件。\n\
  \n东和西区域是北和南的相反。在东和西区域，组件获得其优选宽度，但其高度被限制。\n\n在这里，组件向上延伸到北组件的底部（如果存在），或者延伸到容器的顶部（如果没有北组件）。同样，组件向下延伸到南组件的顶部（如果存在），或者延伸到容器的底部（如果没有南组件）。\n\
  \n我们只能在每个区域放置一个组件，尽管如此，如果该组件是一个容器，那么我们可以显示多个组件。`BorderLayout` 不受我们添加组件顺序的影响。相反，`add()`\
  \ 的重载版本接受两个参数：\n* 第一个是要添加的组件，\n* 第二个是一个对象。\n\n正确使用 `BorderLayout` 要求第二个参数是 `BorderLayout`\
  \ 类本身定义的常量。我们应该了解的五个常量是：\n* `BorderLayout.NORTH`\n* `BorderLayout.SOUTH`\n* `BorderLayout.EAST`\n\
  * `BorderLayout.WEST`\n* `BorderLayout.CENTER`\n\n`BorderLayout` 管理器控制的第五个区域被称为中心。中心仅仅是北、南、东、西分配后剩余的容器部分。在添加组件到中心时，省略\
  \ `add()` 用的第二个参数是合法但不明智的。在 Java 平台上，`BorderLayout` 管理器会假设指的是中心；但在旧版本中，行为是不可预测的，通常会导致组件完全不可见。\n\
  \n\n\n\n\n```java\nimport java.awt.*;\n\npublic class MyFrame7\n{\n  public static\
  \ void main(String args[])\n    {\n      Frame f=new Frame( );\n      Scrollbar\
  \ sbRight=new Scrollbar(Scrollbar.VERTICAL);\n      f.add(sbRight, BorderLayout.EAST);\n\
  \      Scrollbar sbLeft=new Scrollbar(Scrollbar.VERTICAL);\n      f.add(sbLeft,\
  \ BorderLayout.WEST);\n      Label labelTop=new Label(\"This is North\");\n    \
  \  labelTop.setFont(new Font(\"Serif\", Font.ITALIC, 36));\n      labelTop.setForeground(Color.white);\n\
  \      labelTop.setBackground(Color.black);\n      f.add(labelTop, BorderLayout.NORTH);\n\
  \      Label labelBottom=new Label(\"This is south\");\n      labelBottom.setFont(new\
  \ Font(\"Monospaced\", Font.BOLD, 18));\n      labelBottom.setForeground(Color.white);\n\
  \      labelBottom.setBackground(Color.black);\n      f.add(labelBottom, BorderLayout.SOUTH);\n\
  \      f.setSize(500,200);\n      f.setVisible(true);\n    }\n}\n```\n\n输出:\n![image](img/image008.png)\n\
  \n### 示例 17.8\n\n```java\nimport java.awt.*;\n\npublic class MyFrame8 extends Frame\n\
  {\n  public static void main(String args[])\n    {\n      Frame f=new MyFrame8(\
  \ );\n      //f.setLayout(new BorderLayout());\n      f.add (new Button(\"N\"),\
  \ BorderLayout.NORTH);\n      f.add (new Button(\"S\"), BorderLayout.SOUTH);\n \
  \     f.add (new Button(\"E\"), BorderLayout.EAST);\n      f.add (new Button(\"\
  W\"), BorderLayout.WEST);\n      Panel p=new Panel();\n      p.setBackground(Color.green);\
  \    \n      f.add (p, BorderLayout.CENTER);\n      //f.add (p);  默认是中心\n      f.setSize(300\
  \ ,300);\n      f.setVisible(true);\n    }\n}\n```\n\n输出:\n![image](img/image092.png)\n\
  \n### 示例 17.9\n\n```java\nimport  java.awt.*;\n\nclass BorderLayout3 extends Frame\n\
  {\n  public static void main (String args[])\n    {\n      Frame f=new BorderLayout3();\n\
  \      // f.setLayout(new BorderLayout());\n      Panel toolbar=new Panel();\n \
  \     toolbar.setLayout(new FlowLayout(FlowLayout.LEFT));\n      toolbar.setBackground(Color.lightGray);\n\
  \      toolbar.add(new Button (\"This\"));\n      toolbar.add(new Button (\"Is\"\
  ));\n      toolbar.add(new Button (\"The\"));\n      toolbar.add(new Button (\"\
  Toolbar\"));\n      f.add(toolbar,BorderLayout.NORTH);\n      TextField status=new\
  \ TextField(\"Status.\");\n      status.setFont(new Font(\"Monospaced\",Font.BOLD,48));\n\
  \      f.add (status,BorderLayout.SOUTH)    \n      f.setSize(300,300);\n      f.setVisible(true);\n\
  \    }\n}\n```\n\n输出:\n![image](img/image096.png)\n\n### CardLayout\n\n在 `CardLayout`\
  \ 中，我们可以存储许多卡片，但一次只显示一张。只有一张卡片是可见的，但你可以从一张卡片切换到另一一张。这里的卡片意味着 `Panel`。如果我们想一次显示两张卡片，则必须为每张卡片创建一个\
  \ `Panel`，并创建一个包含这两个卡片的主 `Panel`。这对于具有可选组件的用户界面非常有用，可以根据用户输入启用或禁用组件。\n\n### 构造函数\n\
  \n- `CardLayout()` 创建一个间隙为 0 的新卡片布局。\n- `CardLayout(int, int)` 创建具有指定水平和垂直间隙的新布局。水平间隙放置在左右边缘。垂直间隙放置在顶部和底部边缘。与其他布局相比，`CardLayout`\
  \ 需要更多的工作。卡片通常存储在类型为 `panel` 的对象中。当卡片被添加到面板时，通常会给它们指定一个名称。因此，我们在将卡片添加到面板时将使用 `add()`\
  \ 方法：`add(Component objpanel, Object objname)`，`objname` 是一个字符串，用于指定由 `objpanel`\
  \ 指定面板的卡片名称。\n\n### 方法\n\n- `void first(Container parent)` 跳转到容器的第一张卡片。\n- `void\
  \ next(Container parent)` 跳转到给定容器的下一张卡片。如果当前可见卡片是最后一张，此方法将翻到布局中的第一张卡片。\n- `void\
  \ previous(Container parent)` 跳转到给定容器的上上一张卡片。如果当前可见卡片是第一张，此方法将翻到布局中的最后一张卡片。\n- `void\
  \ last(Container parent)` 跳转到容器的最后一张卡片。\n- `void show(Container parent, String name)`\
  \ 跳转到以给定名称添加到布局的组件。如果不存在此类组件，则发生异常。\n\n创建 CardLayout 使用以下步骤：\n1. 创建一个新的 `Panel`\
  \ 对象和一个 `CardLayout` 对象。\n2. 使用在第一步中创建的实例将 `Panel` 对象的布局设置为 `CardLayout`。\n3. 现在为每张卡片创建一个单独的\
  \ `Panel` 对象，并添加想要添加到该 `Panel` 中的任何内容，如按钮、复选框等。\n4. 将步骤 3 中的每个 `Panel` 对象添加到步骤 1\
  \ 创建的主面板 `Panel` 对象中，并为每张卡片提供一个唯一的卡片名称。\n5. 最后将主面板添加到窗口。\n\n### 示例 17.10\n\n```java\n\
  import java.awt.*;\nimport java.awt.event.*;\nimport java.applet.*;\n/*<applet code=\"\
  CardLayoutTest\" width=500 height=100></applet*/\npublic class CardLayoutTest extends\
  \ Applet implements ActionListener, MouseListener\n{\n  Panel mp;\n  CardLayout\
  \ c1;\n  public void init()\n    {\n      Button b1=new Button(\"First\");\n   \
  \   Button b2=new Button(\"Second\");\n      b1.addActionListener(this);\n     \
  \ b2.addActionListener(this);\n      add(b1);\n      add(b2);\n      Panel p1=new\
  \ Panel();\n      Label l1=new Label(\"INDIA\");\n      p1.add(l1);\n      Panel\
  \ p2=new Panel();\n      Label l2=new Label(\"USA\");\n      p2.add(l2);\n     \
  \ mp=new Panel();\n      c1=new CardLayout();\n      mp.setLayout(c1);\n      mp.add(p1,\"\
  Country1\");\n      mp.add(p2,\"Country2\");\n      add(mp);\n      addMouseListener(this);\n\
  \    }\n  public void actionPerformed(ActionEvent ae)\n    {\n      Button b=(Button)ae.getSource();\n\
  \      if(b.getLabel().equals(\"First\"))\n        c1.show(mp,\"Country1\");\n \
  \     else\n        c1.show(mp,\"Country2\");\n    }\n  public void mousePressed(MouseEvent\
  \ me)\n    {\n      c1.next(mp);\n    }\n  public void mouseReleased(MouseEvent\
  \ me){}\n  public void mouseClicked(MouseEvent me){}\n  public void mouseEntered(MouseEvent\
  \ me){}\n  public void mouseExited(MouseEvent me){}\n}\n```\n\n输出:\n![image](img/image022.png)\n\
  \n### GridBagLayout\n\n`GridBagLayout` 是标准布局管理器中最复杂且灵活的。尽管它听起来应该是 `GridLayout` 的子类，但它完全不同。\n\
  \n### 示例 17.11\n\nAWT 组件可以分类为：\n\n1.  1.  视觉组件。\n    2.  容器组件。\n    3.  菜单组件。\n\n\
  视觉组件和容器组件都属于从 `java.awt.Component` 开始的组件层次。（菜单组件继承自 `java.awt.MenuComponent`，因此它们不继承相同的父类功能）。这些方法如下：\n\
  \n#### java.awt.Component 类的方法\n\n所有视觉和容器组件都通过继承 `java.awt.component` 实现了几个方法：\n\
  \n- `Dimension getSize()` 以 `Dimension` 对象的形式返回组件的大小，该对象具有类型为 `int` 的公共数据成员 `height`\
  \ 和 `width`。\n- `void setBackground(Color c)` 设置组件的背景颜色。通常背景颜色用于渲染组件的非文本区域。\n- `void\
  \ setForeground(Color c)` 设置组件的前颜色。通常组件的前颜色用于渲染文本。如果内部没有显式设置组件的前颜色或背景颜色，组件将使用其直接容器的前颜色和背景颜色。\n\
  - `void setFont(Font f)`\n\n\n\n\n\n`setFont()` 方法决定了组件在渲染其需要显示的任何文本时使用的字体。如果我们没有显式地设置组件的字体，则组件将使用其容器的字体。\n\
  \n```java\nvoid setEnabled(Boolean b)\n```\n如果参数为 `true`，则组件具有其正常外观。如果参数为 `false`，则组件将显示为灰色且不对用户输入做出响应。\n\
  \n```java\nvoid setSize(Dimension d)\n```\n设置组件的大小。\n\n```java\nvoid setSize(int\
  \ width, int height)\n```\n设置组件的大小。\n\n```java\nvoid setBounds(int x, int y, int\
  \ width, int height)\n尝试移动并调整组件的大小。左上角的新位置由 `x` 和 `y` 规定，新大小由 `width` 和 `height`\
  \ 规定。\n\n```java\nvoid setVisible(Boolean b)\n```\n此方法接受一个布尔参数，决定组件是否在屏幕上可见。此方法通常用于帧（frames）。\n\
  \n### 注意\n如果我们尝试过调用 `setSize()` 或 `setBounds()` 方法，我们就会知道这通常是徒劳的。我们尝试给组件的大小和位置会被布局管理器（layout\
  \ manager）覆盖。\n\n事实上，这两个方法的存在很大程度上是为了供布局管理器使用的。该规则的一个主要例外是 `Frame` 类，它不受布局管理器的控制，并且完全愿意让我们设置它的大小或边界。\n\
  \n### 可视化组件\n可视化组件是用户实际上可以看到并与之交互的组件。AWT 支持以下视化组件：\n\n* `Button`\n* `Canvas`\n*\
  \ `Checkbox`\n* `Choice`\n* `FileDialog`\n* `Label`\n* `List`\n* `ScrollPane`\n\
  * `Scrollbar`\n* `TextArea`\n* `TextField`\n\n要在 GUI 中使用这些组件之一，我们首先通过调用相应的构造函数来创建一个实例。然后将组件添加到容器中。\n\
  \n### Button（按钮）\n`Button` 类实现了一个推按钮。\n\n### 构造函数\n* `Button()`\n* `Button(String)`\n\
  构造函数接受一个字符串参数，指定按钮标签的文本。当按钮被按下时，它会发送一个 `Action` 事件。\n\n### 方法\n* `String getLabel()`\n\
  获取此按钮的标签。\n* `void setLabel(String label)`\n将按钮的标签设置为指定的字符串。\n* `void addActionListener(ActionListener\
  \ l)`\n添加指定的动作监听器以接收来自此按钮的动作事件。\n\n**示例 17.12**\n```java\n1. import java.awt.*;\n\
  2. class ButtonTest\n{\n4. public static void main(String args[])\n{\n      Frame\
  \ f=new Frame(\"Testing Button Component\");\n      f.setLayout(new FlowLayout());\n\
  \      Font f1=new Font(\"Arial\",Font.BOLD,40);\n      Color c1=new Color(255,0,0);\n\
  \      Color c2=new Color(0,255,0);\n      Button b1 = new Button();\n      Button\
  \ b2 = new Button(\"Cancel\");\n      b1.setForeground(c1);\n      b2.setForeground(c1);\n\
  \      b1.setBackground(c2);\n      b2.setBackground(c2);\n      b1.setFont(f1);\n\
  \      b2.setFont(f1);\n      b1.setLabel(\"Ok\");\n      System.out.println(b2.getLabel());\n\
  \      f.add(b1);\n      f.add(b2);\n      f.setSize(500,200);\n      f.setVisible(true);\n\
  \    }\n}\n```\n输出：\n![image](img/image064.png)\n\n### Canvas（画布）\n`Canvas` 是一个组件，它没有默认外观或行为。我们可以派生\
  \ `canvas` 来创建自定义绘图区域、工作区域、组件等。画布接收来自鼠标和键盘的输入事件，由程序员将这些输入转换为有意义的外观和感受。\n\n画布的默认大小（或更准确地说，首选大小）小得毫无用处。解决这个问题的一种方法是使用会调整画布大小的布局管理器。另一种方法是手动对画布调用\
  \ `setSize()`，画布是少数这种方法可能起作用的用例，因为我们发送到 `setSize()` 方法的值将成为画布的首选大小。\n\n**示例 17.13**\n\
  ```java\n1. import java.awt.*;\n2. class CanvasTest\n{\n4. public static void main(String\
  \ args [])\n{\n      Frame f = new Frame();\n      f.setLayout(new FlowLayout());\n\
  \      Canvas c=new MyCanvas();\n      c.setSize(100,100);\n      f.add(c);\n  \
  \    f.setSize(300,300);\n      f.setVisible(true);\n    }\n}\n15. class MyCanvas\
  \ extends Canvas\n{\n17. public void paint(Graphics g)\n{\n      setBackground(Color.green);\n\
  \      g.setColor(Color.red);\n      g.drawLine(0, 0, 99, 99);\n}\n```\n输出：\n![image](img/image073)\n\
  \n### Checkbox（复选框）\n复选框是一个双状态按钮。两个状态为 `true`（已选中）和 `false`（未勾选）。构造函数的三个基本形式为：\n\
  * `Checkbox()`：创建一个标签为空字符串的复选框。\n* `Checkbox(String label)`：创建一个指定标签的复选框。\n* `Checkbox(String\
  \ label, boolean state)`：创建一个指定标签和状态的复选框。如果我们不指定状态，默认为 `false`。\n\n**方法：**\n* `String\
  \ getLabel()`\n获取此按钮的标签。\n* `void setLabel(String label)`\n将按钮的标签设置为指定的字符串。\n* `boolean\
  \ getState()`\n确定复选框处于“开启”还是“关闭”状态。\n* `void setState(boolean state)`\n将复选框的状态设置为指定的状态。\n\
  * `void addItemListener(ItemListener l)`\n添加监听器以接收来自此复选框的项目事件。\n\n**示例 17.14**\n\
  ```java\n1. import java.awt.*;\n2. class CheckboxTest\n{\n4. public void main(String\
  \ args[])\n{\n      Frame f = new Frame(\"Testing Checkbox\");\n      f.setLayout(new\
  \ GridLayout(3,1));\n      Checkbox c1=new Checkbox();\n      Checkbox c2=new Checkbox(\"\
  Lunch\",true);\n      Checkbox c3=new Checkbox(\"Dinner\");\n      c1.setLabel(\"\
  BreakFast\");\n      c3.setState(true);\n      f.add(c1);f.add(c2);f.add(c3);\n\
  \      if(c1.getState())\n        System.out.println(c1.getLabel());\n      if(c2.getState())\n\
  \        System.out.println(c2.getLabel());\n      if(c3.getState())\n        System.out.println(c3.getLabel());\n\
  \      f.setSize(100,100);\n      f.setVisible(true);\n    }\n}\n```\n输出：\n![image](img/image023.png)\n\
  \n**另一个示例**\n```java\n1. import java.awt.*;\n2. import java.awt.event.*;\n3. class\
  \ CheckboxTest extends Frame implements ItemListener\n{\n    Checkbox c1;\n    TextField\
  \ tf1;\n    CheckboxTest()\n    {\n      setLayout(new GridLayout(2,1));\n     \
  \ c1=new Checkbox(\"Red\");\n      c1.addItemListener(this);\n      add(c1);\n \
  \     tf1=new TextField();\n      add(tf1);\n      setSize(100,100);\n      setVisible(true);\n\
  \    }\n    public static void main(String args[])\n    {\n      new CheckboxTest();\n\
  \    }\n    public void itemStateChanged(ItemEvent ie)\n    {\n      if(c1.getState())\n\
  \        tf1.setBackground(Color.red);\n      else\n        tf1.setBackground(Color.white);\n\
  \    }\n}\n```\n\n#### Radio button（单选按钮）\n复选框可以组合成复选框组，具有单选行为。在单选行为下，任何时刻复选框组只有一个成员可以为\
  \ `true`；选择新成员将把之前选中的成员状态改为 `false`。许多窗口系统（例如 Motif）将单选组作为独立的组件实现。\n\n我们可以通过创建多个复选框并使用\
  \ `java.awt.CheckboxGroup` 类对它们进行分组来实现单选行为。在 Java 中，`java.awt.CheckboxGroup` 类不是组件；它只是组织复选框的不可见类。这意味着\
  \ Java 对复选框组成员之间的空间关系没有限制。\n\n\n\n\n如果我们愿意，可以将一组中的一个成员放置在框架的左上角，另一个成员放置在右下角，并将第三个成员放置在完全不同的框架中。当然，结果可能违背常理，也违背大多数\
  \ GUI 样式指南。\n\n`CheckboxGroup` 类的两种方法支持获取和设置当前选中的成员或该组。\n\n`Checkbox getSelectedCheckbox()`\n\
  \n从此复选框组获取当前的选择。\n\n`void setSelectedCheckbox(Checkbox box)`\n\n将此组中当前选中的复选框设置为指定的复选框。\n\
  \n### 示例 17.15\n\n```java\nimport java.awt.*;\nclass CheckboxGroupTest\n{\n  public\
  \ static void main(String args[])\n  {\n      Frame f = new Frame(\"Testing RadioButton\
  \ Component\");\n      f.setLayout(new GridLayout(3,1));\n      CheckboxGroup cbg=new\
  \ CheckboxGroup();\n      Checkbox c1=new Checkbox(\"BreakFast\",false,cbg);\n \
  \     Checkbox c2=new Checkbox(\"Lunch\",true,cbg);\n      Checkbox c3=new Checkbox(\"\
  Dinner\",false,cbg);\n      c3.setState(true);\n      f.add(c1);f.add(c2);f.add(c3);\n\
  \      \n      if(c1.getState())\n        System.out.println(c1.getLabel());\n \
  \     else if(c2.getState())\n        System.out.println(c2.getLabel());\n     \
  \ else if(c3.getState())\n        System.out.println(c3.getLabel());\n         \
  \ \n      f.setSize(100,100);\n      f.setVisible(true);\n  }\n}\n```\n\n输出：\n![image](img/image041.png)\n\
  \n### Choice\n\n`Choice` 是一个下拉列表。\n\n#### 方法：\n\n`void add(String item)`\n\n向此 `Choice`\
  \ 菜单添加一个项目。\n\n`void addItemListener(ItemListener i)`\n\n添加指定的项监听器，以接收来自此选择框 的的项事件。\n\
  \n`String getItem(int index)`\n\n获取此 `Choice` 菜单中指定索引处的 `String`。\n\n`int getItemCount()`\n\
  \n返回此 `Choice` 菜单中的项目数量。\n\n`int getSelectedIndex()`\n\n返回当前选中项的索引。\n\n`String getSelectedItem()`\n\
  \n获取当前选择的 `string` 字符串表示。\n\n`void insert(String item, int index)`\n\n在此选择框的指定位置插入该项目。\n\
  \n`void remove(int position)`\n\n从选择菜单中删除第一个出现的项目。\n\n`void remove(String item)`\n\
  \n从 `Choice` 菜单中删除第一个出现的指定项目。\n\n`void removeAll()`\n\n移除选择菜单中的所有项目。\n\n`void select(int\
  \ pos)`\n\n将此选择菜单中选中的项目设置为指定位置处项目。\n\n`void select(String Str)`\n\n将此 `Choice` 菜单中选中的项目设置为与指定字符串相等的项目。\n\
