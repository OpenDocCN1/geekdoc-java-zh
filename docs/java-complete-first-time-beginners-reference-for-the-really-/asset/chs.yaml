  \            System.exit(1);\n        }\n        int m1[][]=new int[r1][c1];\n \
  \       //input m1\n        for(int i=0;i<r1;i++)\n```\n\n\n\n\n```java\nfor(int\
  \ j=0;j<c1;j++)\n{\n    System.out.print(\"Enter\" + \"element \" + (i+1) + \",\"\
  \ + (j+1));\n    m1[i][j]=sc.nextInt();\n}\nint m2[][]=new int[r2][c2];\n//输入 m2\n\
