  26.       tm1.m1();\n27.       tm1.m2();\n28.       //tm1.m3();  错误\n29.     Three_Methods\
  \ tm2 = new Three_Methods();\n30.       tm3.m3();\n31.     }\n32.   }\n```\n注意：我们不能使用接口引用调用\
  \ `m3()`，因为在接口中没有声明它。 示例 9.6\n\n```java\n1. interface Two_Methods\n2.   {\n3.  \
  \   void m1( );\n4.     void m2( );\n5.   }\n6. class Three_Methods implements Two_Methods\n\
  7.   {\n8.     public void m1( )\n9.     {\n10.       m1 的方法体;\n11.     }\n12. \
