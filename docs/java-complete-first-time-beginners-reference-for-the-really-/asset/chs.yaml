  \     }\n    }\n}\n```\n\n\n\n\n```java\n20. System.out.print((char)i);\n21. }\n\
  22. }\n23. }\n```\nOutput:\n```\nabcdefghijklmnopqrstuvwxyz\nabcde\n```\n\n### CharArrayWriter\n\
  \n`CharArrayWriter` 是一个写入流的实现，它使用字符数组缓冲区作为目标。\n\n### 构造函数\n- `CharArrayWriter()`\n\
  - `CharArrayWriter(int initialSize)`\n\n在第一种形式中，将创建一个默认大小的缓冲区。在第二种形式中，创建一个大小与参数\
  \ `initialSize` 相同的缓冲区。\n\n缓冲区存储在 `CharArrayWriter` 的 `buf` 字段中。如果需要，缓冲区的大小将自动增大。缓冲区持有的字符数量包含在\
  \ `CharArrayWriter` 的 `count` 字段中。`buf` 和 `count` 都是保护字段。\n\n### 示例 15.10\n```java\n\
  import java.io.*;\nclass CharArrayWriterTest\n{ \n  public static void main (String\
  \ args[]) throws IOException\n  { \n      CharArrayWriter f = new CharArrayWriter();\n\
  \      String s = \"This should end up in the array\";\n      char buf[] = new char[s.length()];\n\
  \      s.getChars(0,s.length(),buf,0);\n      f.write(buf);\n      System.out.println(f.toString());\n\
  \      char c[] = f.toCharArray();\n      for(int i=0; i<c.length;i++)\n      {\
  \ \n        System.out.print(c[i]);\n      }\n      FileWriter f2 = new FileWriter(\"\
  test.txt\");\n      f.writeTo(f2);\n      f2.close();\n      f.reset();\n      System.out.println();\n\
  \      System.out.println(\"After reset:\"+f.toString());\n      for(int i=0;i<3;i++)\n\
  \        f.write('A');\n      System.out.println(f.toString());\n  }\n}\n```\nOutput:\n\
  ```\nThis should end up in the array\nThis should end up in the array\nAfter reset:\n\
  AAA\n```\n\n---\n\n### Pushback Input Stream\n\n`PushbackInputStream` 为另一个输入流增加了功能，即“回回”（pushback）或“未读”（unread）一个字节的能力。缓冲的用途之一就是实现回退。\n\
  \n`Pushback` 用于输入流，允许读取一个字节后将其返回到流中。除了 `InputStream` 类中常见的方法外，`PushbackInputStream`\
  \ 还提供了 `unread()` 方法，所示：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `public java.io.PushbackInputStream(java.io.InputStream,\
  \ int);` | 创建一个具有指定大小回退缓冲区的 `PushbackInputStream`，并保存其参数（输入流）以供以后使用。这允许将多个字节返回到输入流。\
  \ |\n| `public java.io.PushbackInputStream(java.io.InputStream);` | 创建一个 `PushbackInputStream`\
  \ 并保存其参数（输入流）以供以后使用。这允许将一个字节返回到输入流。 |\n| `public int read() throws java.io.IOException;`\
  \ | |\n| `public int read(byte[], int, int) throws java.io.IOException;` | |\n|\
  \ `public void unread(int) throws java.io.IOException;` | 通过将字节复制到回退缓冲区的头部来将其回退。\
  \ |\n| `public void unread(byte[], int, int) throws java.io.IOException;` | 通过将字节数组的一部分复制到回退缓冲区的头部来回退部分字节数组。\
  \ |\n| `public void unread(byte[]) throws java.io.IOException;` | 通过将字节数组复制到回退缓冲区的头部来回退字节数组。\
  \ |\n| `public int available() throws java.io.IOException;` | |\n| `public long\
  \ skip(long) throws java.io.IOException;` | |\n| `public boolean markSupported();`\
  \ | `PushbackInputStream` 的副作用是使用于创建它的 `InputStream` 的 `mark()` 或 `reset()` 方法失效。使用\
  \ `markSupported()` 方法检查任何你将在上面使用 `mark()`/reset()` 的流。 |\n| `public synchronized\
  \ void mark(int);` | |\n| `public synchronized void reset() throws java.io.IOException;`\
  \ | |\n| `public synchronized void close() throws java.io.IOException;` | |\n\n\
  ### 示例 15.11\n```java\nimport java.io.*;\nclass PushbackInputStreamTest\n{\n  public\
  \ static void main(String args[]) throws IOException\n  {\n      FileInputStream\
  \ fin = new FileInputStream(\"A.txt\");\n      PushbackInputStream p1=new PushbackInputStream(fin);\n\
  \      int ch=p1.read();\n      System.out.println((char)ch);\n      ch=p1.read();\n\
  \      System.out.println((char)ch);\n      ch=p1.read();\n      System.out.println((char)ch);\n\
  \      p1.unread(ch); // or p1.unread('z');\n      ch=p1.read();\n      System.out.println((char)ch);\n\
  \  }\n}\n```\nOutput:\n```\nA.txt contains “Matrix Computers”\nm\na\nt\nt\n```\n\
  \nPushbackReader 是一种字符流读取器，允许将字符回退到流中。`PushbackReader` 类允许一个或多个字符返回到输入流。这允许你在输入流中向前查看。\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `public java.io.PushbackReader(java.io.Reader,\
  \ int);` | 创建一个具有指定大小回退缓冲区的 `PushbackReader`。 |\n| `public java.io.PushbackReader(java.io.Reader);`\
  \ | 创建一个 `PushbackReader`。 |\n| `public int read() throws java.io.IOException;`\
  \ | |\n| `public int read(char[], int, int) throws java.io.IOException;` | |\n|\
  \ `public void unread(int) throws java.io.IOException;` | 通过将字符复制到回退缓冲区的头部来将其回退。\
  \ |\n| `public void unread(char[], int, int) throws java.io.IOException;` | 通过将字符数组的一部分复制到回退缓冲区的头部来回退部分字符数组。\
  \ |\n| `public void unread(char[]) throws java.io.IOException;` | 通过将字符数组复制到回退缓冲区的头部来回退字符数组。\
  \ |\n| `public boolean ready() throws java.io.IOException;` | 注意：当尝试返回字符时回退缓冲区已满，将抛出\
  \ `IOException`。 |\n\n注意：当尝试在 `PushbackInputStream` 满时返回字符时，将抛出 `IOException`。\n\
  \n### SequenceInputStream\n\n`SequenceInputStream` 类是一种允许你连接多个 `InputStream` 的字节流。序列\
  \ `InputStream` 的构造与其他任何 `InputStream` 都不同。`SequenceInputStream` 构造函数使用一对 `InputStream`\
  \ 类或 `InputStream` 类的 `Enumeration` 作为其参数：\n\n- `SequenceInputStream(InputStream\
  \ is1, InputStream is2)`：创建一个新的 `SequenceInputStream` 并记住这两个参数，它们将按顺序先读取 `is1` 然后读取\
  \ `is2`，以从此 `SequenceInputStream` 提供字节。\n- `SequenceInputStream(Enumeration e)`：创建一个新的\
  \ `SequenceInputStream` 并记住参数，该参数必须是产生运行时类型为 `InputStream` 的对象的 `Enumeration`。\n\
  \n操作上，该类从第一个 `InputStream`get 读取请求直到其耗尽，然后切换到第二个。在 `Enumeration` 的情况下，它将继续通过所有的\
  \ `InputStream` 直到达到最后一个结束。\n\n### 示例 15.13\n在下面的示例中，作为命令行参数提供文件名：\n```java\nimport\
  \ java.io.*;\nclass SequenceInputStreamTest\n{ \n  public static void main(String\
  \ args[]) throws IOException\n  { \n      FileInputStream f1 = new FileInputStream(args[0]);\n\
  \      FileInputStream f2 = new FileInputStream(args[1]);\n      FileOutputStream\
  \ f3 = new FileOutputStream(args[2]);\n      SequenceInputStream sis = new SequenceInputStream(f1,f2);\n\
  \      int c;\n  }\n}\n```\n\n\n\n\n\n```java\nwhile((c = sis.read()) != -1)\n{\
  \ \n    f3.write(c);\n}\nf3.close();f1.close();f2.close();\n}\n```\n\nOutput:\n\
  `java SequenceInputStreamTest A.txt B.txt C.txt`\n\n### PrintStream\n\n它是一个字节流类，继承自\
  \ `FilterOutputStream`。`PrintStream` 为另一个输出流添加了功能，即方便地打印各种数据值的表示形式的能力。\n\n可选情况下，可以创建一个\
  \ `PrintStream` 以便自动刷新（flush）；这意味着在写入字节数组、调用了其中一个 `println` 方法、或者写入换行符或字节（`'\\n'`）之后，将会自动调用\
  \ `flush` 方法。\n\n由 `PrintStream` 打印的所有字符都将使用平台的默认字符编码转换为字节，然后写入构造函数中指定的 `OutputStream`\
  \ 或 `File`。\n\n`PrintStream` 支持针对所有类型（包括 `object`）的 `print()` 和 `println()` 方法。如果参数不是简单类型，`PrintStream`\
  \ 方法将调用对象的 `toString()` 方法并打印结果。\n\n#### 构造函数：\n\n- `PrintStream(File file)`\n \
  \ 创建一个新的打印流，不带自动行刷新，关联指定的文件。\n- `PrintStream(String fileName)`\n  创建一个新的打印流，不带自动行刷新，关联指定的文件名。\n\
  - `PrintStream(OutputStream out)`\n  创建一个新的打印流，连接到指定的 `OutputStream`。\n- `PrintStream(OutputStream\
  \ out, bolean autoFlush)`\n  创建一个新的打印流，连接到指定的 `OutputStream`。\n\n![C:\\Users\\Made\
  \ Man Harry\\Desktop\\Stars\\Star_logo_yellow.jpg](img/image032.jpg)\n\n### 示例 15.14\n\
  \n```java\nimport java.io.*;\nclass PrintStreamTest\n{ \n  public static void main\
  \ (String args[]) throws IOException\n  { \n      PrintStream ps = new PrintStream(System.out,\
  \ true);\n      ps.println(\"This is a string\");\n      int i = -7;\n      ps.println(i);\n\
  \      double d = 4.5e-7;\n      ps.println(d);\n  }\n}\n```\n\nOutput:\n```\nThis\
  \ is a string\n-7\n4.5E-7\n```\n\n### 示例 15.15\n\n```java\nimport java.io.*;\nclass\
  \ PrintStreamTest2\n{ \n  public static void main (String argv[]) throws IOException\n\
  \  { \n      FileOutputStream fout = new FileOutputStream(\"test.dat\");\n     \
  \ PrintStream ps = new PrintStream(fout, true);\n      ps.println(\"This is a string\"\
  );\n      int i = -7;\n      ps.println(i);\n      double d = 4.5e-7;\n      ps.println(d);\n\
  \  }\n}\n```\n\n### PrintWriter\n\n虽然在 Java 中仍然允许使用 `System.out` 向控制台写入内容，但其使用主要用于调试目的或示例程序。\n\
  \n对于真实世界的程序，使用 `java` 时向控制台写入内容的推荐方法是通过 `PrintWriter` 流。`PrintWriter` 是基于字符的类之一。使用基于字符的类进行控制台输出使程序的国际化变得更容易。\n\
  \n#### 构造函数：\n\n- `PrintWriter(File file)`\n  创建一个新的 `PrintWriter`，不带自动行刷新，用于写入指定的文件。\n\
  - `PrintWriter(String fileName)`\n  创建一个新的 `PrintWriter`，不带自动行刷新，用于写入指定的文件。\n- `PrintWriter(OutputStream\
  \ out)`\n  创建一个新的 `PrintWriter`，不带自动行刷新，用于写入指定的 `OutputStream`。\n- `PrintWriter(OutputStream\
  \ out, boolean autoFlush)`\n  创建一个新的 `PrintWriter` 用于写入指定的 `OutputStream`。\n- `PrintWriter(Writer\
  \ out)`\n  创建一个新的 `PrintWriter`，不带自动行刷新，用于写入指定的 `Writer`。\n- `PrintWriter(Writer\
  \ out, Boolean autoFlush)`\n  创建一个新的 `PrintWriter` 用于写入指定的 `Writer`。\n\n最常用的构造函数是：\n\
  `PrintWriter(OutputStream os, boolean flushOnNewLine)`\n\n在这里，`os` 是 `OutputStream`\
  \ 类型的对象，`flushOnNewLine` 控制 Java 每次调用 `println()` 方法时是否都刷新输出流。如果 `flushOnNewLine`\
  \ 为 `true`，则会自动进行刷新。如果为 `false`，则刷新不是自动的。\n\n`PrintWriter` 支持针对所有类型（包括对象）在内的 `print()`\
  \ 和 `println()` 方法。如果参数不是简单类型，`PrintWriter` 方法将调用对象的 `toString()` 方法并打印结果。\n\n要使用\
  \ `PrintWriter` 向控制台写入，请指定 `System.out` 为输出流，并在每个新行之后刷新流。例如，此行代码创建了一个连接到控制台输出的 `PrintWriter`。\n\
  `PrintWriter pw = new PrintWriter(System.out, true)`\n\n### 示例 15.16\n\n```java\n\
  import java.io.*;\nclass PrintWriterTest\n{ \n  public static void main (String\
  \ argv[]) throws IOException\n  { \n      PrintWriter pw =  new PrintWriter(System.out,\
  \ true);\n      pw.println(\"This is a string\");\n      int i = -7;\n      pw.println(i);\n\
  \      double d = 4.5e-7;\n      pw.println(d);\n  }\n}\n```\n\nOutput:\n```\nThis\
  \ is a string\n-7\n4.5E-7\n```\n\n### 示例 15.17\n\n```java\nimport java.io.*;\nclass\
  \ PrintWriterTest\n{ \n  public static void main (String argv[]) throws IOException\n\
  \  { \n      FileWriter fout = new FileWriter(\"test.dat\");\n      PrintWriter\
  \ pw = new PrintWriter(fout, true);\n      pw.println(\"This is a string\");\n \
  \     int i = -7;\n      pw.println(i);\n      double d = 4.5e-7;\n      pw.println(d);\n\
  \  }\n}\n```\n\n---\n\n### 示例 15.18\n\n```java\nimport java.io.*;\nclass PrintWriterTest2\n\
  { \n  public static void main (String argv[]) throws IOException\n  { \n      FileWriter\
  \ fout = new FileWriter(\"test.dat\");\n      PrintWriter pw = new PrintWriter(fout,\
  \ true);\n      pw.println(\"This is a string\");\n      int i = -7;\n      pw.println(i);\n\
  \      double d = 4.5e-7;\n      pw.println(d);\n  }\n}\n```\n\n### PipedOutputStream\n\
  \n`piped output` 可以连接到 `piped input` 以创建一个管道。`piped output` 是管道的发送端；`piped input`\
  \ 提供写入 `piped output` 的任何字节。数据由一个线程从 `PipedInputStream` 读取，并写入另一个线程。`piped input`\
  \ 包含一个缓冲区，在限制内解耦读操作和写操作。\n\n#### 构造函数：\n\n- `PipedInputStream()`\n  创建一个未连接的 `PipedInputStream`。\n\
  - `PipedInputStream(PipedOutputStream src)`\n  创建一个连接到输出流的 `PipedInputStream`。\n\
  - `PipedOutputStream()`\n  创建一个未连接的 `PipedOutputStream`。\n- `PipedOutputStream(PipedInputStream\
  \ snc)`\n  创建一个连接到指定 `input` 流的 `PipedOutputStream`。\n\n### 示例 15.19\n\n```java\n\
  import java.io.*;\nclass TextGenerator extends Thread\n{ \n  OutputStream out;\n\
  \  TextGenerator(OutputStream out)\n  { \n      this.out = out;\n  }\n  public void\
  \ run()\n  { \n      try\n      { \n        try\n        { \n          for(byte\
  \ b = 65; b<=90; b++)\n            out.write(b);\n        }\n        finally\n \
  \       { \n          out.close();\n        }\n      }\n      catch(IOException\
  \ e)\n      {\n        System.out.println(e);\n      }\n  }\n}\nclass Pipe\n{ \n\
  \  public static void main(String args[]) throws IOException\n  { \n      PipedOutputStream\
  \ out = new PipedOutputStream();\n      PipedInputStream in = new PipedInputStream(out);\n\
  \      TextGenerator data = new TextGenerator(out);\n      data.start();\n     \
  \ int ch;\n      while((ch = in.read()) != -1)\n        System.out.print((char)\
  \ ch);\n  }\n}\n```\n\n\n\n\n\n它们的功能与 `PipedInputStream` 和 `PipedOutputStream` 相同，唯一的区别在于它们是字符流。\n\
  \n### 构造函数\n\n- `PipedReader()`: 创建一个 `PipedReader`，使其尚未连接。\n- `PipedReader(PipedWriter\
  \ src)`: 创建一个 `PipedReader` 并使其连接到管道写入器 `src`。\n- `PipedWriter()`: 创建一个尚未连接到 `PipedReader`\
  \ 的管道写入器。\n- `PipedWriter(PipedReader snk)`: 创建一个连接到指定 `PipedReader` 的管道写入器。\n\n\
  ---\n\n#### 示例 15.20\n\n```java\nimport java.io.*;\nclass TextGenerator extends\
  \ Thread { \n    Writer out;\n    TextGenerator(Writer out) {\n        this.out\
  \ = out;\n    }\n    public void run() {\n        try {\n            try {\n   \
  \             for(char c = 'a'; c<='z'; c++)\n                    out.write(c);\n\
  \            }\n            finally {\n                try {\n                 \
  \   Thread.sleep(2000);  \n                } \n                catch(Exception e)\
  \ {}\n                System.out.println(\"aaaaaaaaaaaaa\");\n                if(true)\n\
  \                return;  // IOException: pipe Broken\n            out.close();\
  \  //IOException: Write end dead\n        }  //OK if thread finishes after closing\
  \ the pipe\n        }\n        catch(IOException e) { System.out.println(e);}\n\
  \    }\n}\nclass Pipe2 { \n    public static void main (String argv[]) throws IOException\
  \ {\n        PrintStream ps = new PrintStream(System.out);\n        PipedWriter\
  \ out = new PipedWriter();\n        PipedReader in = new PipedReader(out);\n   \
  \     TextGenerator data = new TextGenerator(out);\n        data.start(); int ch;\n\
  \        while((ch = in.read()) != -1)\n            System.out.print((char) ch);\n\
  \    }\n} \n```\n\n**输出：**\n```\nabcdefghijklmnopqrstuvwxyzaaaaaaaaaaaaa\nException\
  \ in thread \"main\" java.io.IOException: Pipe broken\nat java.io.PipedReader.read(Unknown\
  \ Source)\nat Pipe2.main(Pipe2.java:43)\n```\n\n---\n\n### 过滤字节流\n\n过滤流仅仅是底层输入流或输出流的包装器，透明地提供了某些扩展功能。常见的扩展包括缓冲、zip\
  \ 压缩/解压等。过滤字节流是 `FilterInputStream` 和 `FilterOutputStream`。它们的构造函数为：\n\n- `FilterInputStream(InputStream\
  \ in)`: 通过将参数 `in` 赋值给字段 `this.in` 来创建一个 `FilterInputStream`，以便稍后使用。\n- `FilterOutputStream(OutputStream\
  \ out)`: 创建一个构建在指定的底层输出流之上的输出过滤器。\n\n这些类提供的方法与 `InputStream` 和 `OutputStream` 中的方法相同。\n\
  \n---\n\n### 缓冲字节流\n\n对于面向字节的流，缓冲流通过通过在 I/O 流上挂载内存缓冲区来扩展过滤流类。该缓冲区允许 Java 一次对多个一个字节的数据进行\
  \ I/O 操作，从而提高性能。\n\n由于缓冲区的可用，对流进行跳过（skip）、标记（mark）和重置（reset）变得可能。缓冲字节流类是 `BufferedInputStream`\
  \ 和 `BufferedOutputStream`。`PushbackInputStream` 也实现了缓冲流。\n\n### BufferedInputStream\n\
  \n缓冲 I/O 是一种非常常见的性能优化手段。Java 的 `BufferedInputStream` 类允许你将任何 `InputStream` “包装”成缓冲流，并实现这种性能提升。\n\
  \n`BufferedInputStream` 有两个构造函数：\n\n- `BufferedInputStream(InputStream in)`: 创建一个\
  \ `BufferedInputStream` 并保存其参数输入流 `in` 以备稍后使用。创建一个内部缓冲区并存储在 `buf` 中。\n- `BufferedInputStream(InputStream\
  \ in, int size)`: 创建一个具有指定缓冲区大小的 `BufferedInputStream` 并保存其参数输入流 `in` 以备稍后使用。\n\n\
  缓冲输入流还为回退提供了基础。除了任何 `InputStream` 中实现的 `read()` 和 `skip()` 方法外，`BufferedInputStream`\
  \ 还支持 `mark()` 和 `reset()` 方法。这种支持通过 `markSupported()` 返回 `true` 来反映。\n\n---\n\n\
  ### 示例 15.21\n\n```java\nimport java.io.*;\nclass BufferedInputStreamTest {\n  \
  \  public static void main(String args[]) throws IOException {\n        FileInputStream\
  \ fin=new FileInputStream(\"A.txt\");\n        BufferedInputStream b1 = new BufferedInputStream(fin);\n\
  \        for(int i=1; i<=10; i++)\n            System.out.print((char)b1.read());\n\
  \        System.out.println();\n        if(b1.markSupported()) {\n            b1.mark(500);\n\
  \            for(int i=1; i<=10; i++)\n                System.out.print((char)b1.read());\n\
  \            System.out.println();\n            b1.reset();\n            for(int\
  \ i=1; i<=10; i++)\n                System.out.print((char)b1.read());\n       \
  \ }\n        else\n            System.out.println(\"Marking option is not availabel\"\
  );\n        b1.close();\n        fin.close();\n    }\n}\n```\n**输出：**\n```\nmatrix\n\
  ```\n**注意：** `mark(32)` 保留后续读取 32 个字节的标记（对于所有实体都足够）。`mark` 的使用限于缓冲区内部。这意味着你只能为 `mark()`\
  \ 指定一个小于缓冲区大小的参数。\n\n---\n\n### BufferedOutputStream\n\n与缓冲输入不同，缓冲输出不提供额外功能。它仅用于提高性能。这里有两个构造函数：\n\
  \n- `BufferedOutputStream(OutputStream out)`: 创建一个向指定输出流写入数据的输出流。它使用大小为 5 字节的缓冲区。\n\
  - `BufferedOutputStream(OutputStream out, int size)`: 创建一个具有指定缓冲区大小的向指定输出流写入数据的输出流。\n\
  \n### 示例 15.22\n\n```java\nimport java.io.*;\nclass BufferedOutputStreamTest {\n\
  \    public static void main(String args[]) throws IOException {\n        BufferedOutputStream\
  \ f = new BufferedOutputStream (System.out,100);\n        byte[] buf = \"This will\
  \ be displayed without flush()\\n\".getBytes();\n        f.write(buf);\n       \
  \ f.write(buf);\n        System.out.println(\"testing...\");\n        //f.flush();\n\
  \        //f.close();\n    }\n}\n```\n**输出：**\n```\ntesting...\n```\n（注：由于未取消注释的\
  \ flush()，缓冲区内容可能不会显示在控制台上）\n\n---\n\n### BufferedReader\n\n`BufferedReader` 通过缓冲输入来提高性能。它有两个构造函数：\n\
  \n- `BufferedReader(Reader in)`: 创建一个使用默认大小输入缓冲区的字符输入流。\n- `BufferedReader(Reader\
  \ in, int sz)`: 创建一个使用指定大小输入缓冲区字符输入流。\n\n### 示例 15.23\n\n```java\nimport java.io.*;\n\
  class BufferedReaderTest {\n    public static void main(String args[]) throws IOException\
  \ {\n        FileReader fr=new FileReader(\"A.txt\");\n        BufferedReader b1\
  \ = new BufferedReader(fr);\n        for(int i=1; i<=10; i++)\n            System.out.print((char)b1.read());\n\
  \        System.out.println();\n        if(b1.markSupported()) {\n            b1.mark(5);\n\
  \            for(int i=1; i<=10; i++)\n                System.out.print((char)b1.read());\n\
  \            System.out.println();\n            b1.reset();\n            for(int\
  \ i=1; i<=10; i++)\n                System.out.print((char)b1.read());\n       \
  \ }\n        else\n            System.out.println(\"Marking option is not availabel\"\
  );\n        b1.close();\n        fr.close();\n    }\n}\n```\n\n\n\n\n使用 `BufferedWriter`\
  \ 可以通过减少数据实际物理写入输出流的次数来提高性能。\n\n### 构造函数\n\n- `BufferedWriter(Writer out)`\n  创建一个使用默认大小输出缓冲区的缓冲字符输出流。\n\
  - `BufferedWriter(Writer out, int sz)`\n  创建一个使用给定大小输出缓冲区的缓冲字符输出流。\n\n### 示例 15.24\n\
  \n```java\nimport java.io.*;\n\nclass BufferedWriterTest\n{\n    public static void\
  \ main(String args[]) throws IOException\n    {\n      BufferedWriter f = new BufferedWriter(new\
  \ PrintWriter(System.out));\n      String s  = \"This will not be displayed without\
  \ flush()\\n\";\n      char buf[ ] = new char[s.length()];\n      s.getChars(0,s.length(),buf,0);\n\
  \      f.write(buf);\n      f.write(buf);\n      System.out.println(\"testing...\"\
  );\n      f.write(buf);\n      //f.flush();\n      //f.close();\n    }\n}\n```\n\
  \n**输出：**\ntesting...\n\n### 使用字节流处理基本数据数据类型\n\n基础输入流和输出流提供了读/写方法，这些方法只能用于读/写字节或字符。\n\
  \n如果我们想读/写整数和双精度等基本数据类型，可以使用过滤器类作为现有输入和输出流的包装器，以对原始流中的数据进行过滤。\n\n用于创建处理基本数据类型的“数据流”的两个过滤器类是\
  \ `DataInputStream` 和 `DataOutputStream`。这些类使用了如下所示的多重继承概念，并实现了父类和接口中包含的所有方法。\n\n\
  ––––––––\n\n![image](img/image011.png)\n\n可以通过如下方式创建从文件读取输入数据流：\n\n```java\nFileInputStream\
  \ fis = new FileInputStream(infile);\nDataInputStream dis = new DataInputStream(fis);\n\
  ```\n\n这些语句基本上是将 `dis` 封装在 `fis` 上并将其用作“过滤器”。同样地，下面的语句创建了输出数据流 `dos` 并将其封装在输出文件流\
  \ `fos` 上。\n\n```java\nFileOutputStream fos = new FileOutputStream(outfile);\nDataOutputStream\
  \ dos = new DataOutputStream(fos);\n```\n\n### 示例 15.25\n\n以下程序演示了基本数据类型的读取和写入。\n\
  \n```java\nimport java.io.*;\n\nclass ReadWritePrimitive\n{\n    public static void\
  \ main (String args[]) throws IOException\n    {\n      File primitive = new File(\"\
  prim.dat\");\n      FileOutputStream fos = new FileOutputStream(primitive);\n  \
  \    DataOutputStream dos = new DataOutputStream(fos);\n      dos.writeInt(1999);\n\
  \      dos.writeDouble(222.44);\n      dos.writeBoolean(false);\n      dos.writeChar('X');\n\
  \      dos.close();\n      fos.close();\n      FileInputStream fis = new FileInputStream(primitive);\n\
  \      DataInputStream dis = new DataInputStream(fis);\n      System.out.println(dis.readInt());\n\
  \      System.out.println(dis.readDouble());\n      System.out.println(dis.readBoolean());\n\
  \      System.out.println(dis.readChar());\n      dis.close();\n      fis.close();\n\
  \    }\n}\n```\n\n**输出：**\n1999\n222.44\nfalse\nX\n\n### 预流\n\n`System` 类包含了三个预定义的流变量——`in`、`out`\
  \ 和 `err`。这些字段在 `System` 类中声明为 `public` 和 `static`。这意味着它们可以被程序的任何部分使用，无需引用特定对象。\n\
  \n- `System.out` 指向标准输出流。默认情况下，这是控制台。`System.out` 是 `PrintStream` 类型的对象。\n- `System.in`\
  \ 指向标准输入，默认是键盘。`System.in` 是 `InputStream` 类型的对象。\n- `System.err` 指向标准错误流，默认情况下也是控制台。`System.err`\
  \ 是 `PrintStream` 类型的对象。\n\n这些都是字节流，尽管它们通常用于从和向控制台读/写字符。如果需要，你可以将它们封装在基于字符的流中。\n\
  \n### InputStreamReader\n\n`InputStreamReader` 是从字节流到字符流的桥梁；它读取字节并使用指定的字符集将其解码为字符。它使用的字符集可以显式指定，也可以接受平台的默认字符集。\n\
  \n### 构造函数\n- `InputStreamReader(InputStream in)`：创建一个使用默认字符集的 `InputStreamReader`。\n\
  - `InputStreamReader(InputStream in, String charsetName)`：创建一个使用指定字符集的 `InputStreamReader`。\n\
  \n### 示例 15.26\n\n```java\nimport java.io.*;\n\nclass InputStreamReaderTest\n{\n\
  \    public static void main (String argv[]) throws IOException\n    {\n      char\
  \ c;\n      InputStreamReader is = new InputStreamReader(System.in);\n      System.out.println(\"\
  Enter characters, 'q' to quit\");\n      c = (char)is.read();\n      while(c!='q')\n\
  \      {\n        System.out.print(c);\n        c = (char)is.read();\n      }\n\
  \    }\n}\n```\n\n**输出：**\nEnter characters, 'q' to quit\nabcd\nabcd\n\n### 示例 15.27\n\
  \n对上一个示例进行了修改，以使用缓冲来提高性能。\n\n```java\nimport java.io.*;\n\nclass BufferedReaderTest\n\
  {\n    public static void main (String args[]) throws IOException\n    {\n     \
  \ char c;\n      BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n\
  \      System.out.println(\"Enter characters, 'q' to quit\");\n      c = (char)br.read();\n\
  \      while(c!='q')\n      {\n        System.out.print(c);\n        c = (char)br.read();\n\
  \      }\n    }\n}\n```\n\n**输出：**\nEnter characters, 'q' to quit\nabcd\nabcd\n\n\
  ### 示例 15.28\n\n`InputStreamReader` 没有提供 `readLine()` 方法，因此 `InputStreamReader`\
  \ 连接到提供了 `readLine()` 方法的 `BufferedReader`。\n\n```java\nimport java.io.*;\n\nclass\
  \ BufferedReaderTest\n{\n    public static void main (String argv[]) throws IOException\n\
  \    {\n      BufferedReader br = new BufferedReader(new InputStreamReader (System.in));\n\
  \      System.out.println(\"Enter 'stop' to quit\");\n      String str = br.readLine();\n\
  \      while(!str.equals(\"stop\"))\n      {\n        System.out.println(\"Your\
  \ Name:\"+str);\n        str = br.readLine();\n      }\n    }\n}\n```\n\n**输出：**\n\
  Enter 'stop' to quit\nHarry Feat\nYour Name:Harry Feat\nstop\n\n### OutputStreamWriter\n\
  \n`OutputStreamWriter` 是从字符流到字节流的桥梁：写入它的字符使用指定的字符集编码为字节。它使用的字符集可以显式指定，也可以接受平台的默认字符集。\n\
  \n### 构造函数\n- `OutputStreamWriter(OutputStream out)`：创建一个使用默认字符编码的 `OutputStream`。\n\
  - `OutputStreamWriter (OutputStream out, String charsetName)`：创建一个使用指定字符集的 `OutputStream`。\n\
  \n### 读取控制输入\n\n在 Java 1.0 中，执行控制输入的唯一方法是使用字节流，旧代码一直存在。\n\n今天，使用字节流读取控制输入在技术上仍然可行，但可能需要使用已弃的方法，而且这种方法不被推荐。\n\
  \n在 Java 中，控制输入通过读取 `System.in` 实现。为了获得连接控制台的字符流，你需要将 `System.in` 封装在 `InputStreamReader`\
  \ 对象中，进一步封装在 `BufferedReader` 对象中，以提高性能。\n\n### 示例 15.29\n\n此示例演示了我们可以直接从 `System.in`\
  \ 读取。\n\n```java\nimport java.io.*;\n\nclass ReadFromConsole\n{\n    public static\
  \ void main (String arg[]) throws IOException\n    {\n      char c;\n      System.out.println(\"\
  Enter characters, 'q' to quit\");\n      c = (char) System.in.read();\n      while(c!='q')\n\
  \      { \n        System.out.print(c);\n        c = (char) System.in.read();\n\
  \      }\n    }\n}\n```\n\n\n\n\n从控制台读取正确的方法是将 `System.in` 封装在 `InputStreamReader`\
  \ 中，并进一步封装在 `BufferedReader` 中以提高性能并实现一次输入一行。适当的示例在之前与 `InputStreamReader` 类相关的节中已经介绍过。\n\
  \n## 写控制台输出\n\n控制台输出通过 `print()` 和 `println()` 最容易实现。这些方法由 `PrintStream` 类定义（该类是\
  \ `System.out` 所引用对象的类型）。尽管 `System.out` 是一个字节流，但将它用于简单的程序输出仍然是可以接受的。\n\n然而，基于字符的替代方案是正确的选择。因为\
  \ `PrintStream` 是派生自 `OutputStream` 的输出流，它还实现了低级方法 `write()`。因此，可以使用 `write()` 向控制台写入内容。`PrintStream`\
  \ 定义的 `write()` 最简单的形式是：\n\n```java\nvoid write(int byteval)\n```\n\n该方法向流中写入 `byteval`\
  \ 指定的字节。尽管 `byteval` 被声明为整数，但只有低 8 位会被写入。\n\n### 示例 15.30\n\n```java\nimport java.io.*;\n\
  \nclass WriteTest {\n    public static void main (String argv[ ]) throws IOException\
  \ {\n      int b;\n      b = 'A';\n      System.out.write(b);\n      // System.out.flush();to\
  \ flush\n      System.out.write('\\n');//to flush\n    }\n}\n```\n\n**输出：**\n```\n\
  A\n```\n\n**注意：**\n你不会经常使用 `write()` 执行控制台输出，因为 `print()` 和 `println()` 使用起来要方便得多。\n\
  \n## 序列化\n\n序列化是将对象的状态写入字节流的过程。当你想要将对象的状态写入字节流时，这种方法非常有用。当你想要将程序的状态保存到持久化存储区域（如文件）时，这同样有用。在稍后，你可以通过反序列化过程恢复这些对象。\n\
  \n实现 RMI（远程方法调用）也需要序列化。RMI 允许一台机器上的 Java 对象调用另一台机器上 Java 对象的方法。对象可以作为远程方法的参数传递。发送端对对象进行序列化并转换，接收端对其进行反序列化。\n\
  \n如果你尝试序列化对象图顶部的对象，所有其他被引用的对象都会被递归地找到并序列化。\n\n同样，在反序列化过程中，所有这些对象及其引用都会被正确存储。声明为\
  \ `transient` 或 `static` 的变量不会被序列化机制保存。\n\n## Externalizable 接口\n\nJava 的序列化和反序列化机制设计使得保存和恢复对象状态的大部分工作可以自动完成。\n\
  \n然而，在某些情况下，程序员可能需要对这些过程进行控制。例如，使用压缩或加密技术可能是必要的。`Externalizable` 接口是为了这些这种情况设计的。实现\
  \ `Externalizable` 接口的对象也可以被序列化和反序列化。\n\n但控制权在用户手中，即用户可以决定序列化和反序列化的部分。序列化代码写在 `writeExternal()`\
  \ 方法中，反序列化代码写在 `readExternal()` 方法中。\n\n### Externalizable 接口中的方法\n- `void readExternal(ObjectInput\
  \ in)`：对象实现 `readExternal` 方法，通过调用 `DataInput` 用于原始类型、字符串和数组的方法来恢复其内容。\n- `void\
  \ writeExternal(ObjectOutput out)`：对象实现 `writeExternal` 方法，通过调用 `DataOutput` 用于字符串和数组的方法来保存其内容。\n\
  \n### ObjectOutput 接口\n`ObjectOutput` 接口扩展 `DataOutput` 并支持序列化。除了 `DataOutput` 中定义的方法外，`ObjectOutput`\
  \ 接口只定义了一个：\n- `void writeObject(Object object)`：调用此方法来序列化对象。`ObjectOutput` 的所有方法在出错时都会抛出\
  \ `IOException`。\n\n### ObjectOutputStream\n`ObjectOutputStream` 类扩展 `OutputStream`\
  \ 并实现 `ObjectOutput` 接口。它负责将对象写入流中。\n- **构造函数**：`ObjectOutputStream(OutputStream\
  \ out)` 创建一个写入指定 `OutputStream` 的 `ObjectOutputStream`。参数 `out` 是将写入序列化对象的输出流。\n\
  - **写入对象的方法**：`void writeObject(Object obj)` 将对象写入底层存储或流中。\n\n### ObjectInput 接口\n\
  `ObjectInput` 接口扩展 `DataInput`。它支持序列化。除了 `DataInput` 中定义的方法外，`ObjectInput` 只定义了一个：\n\
  - `Object readObject()`：调用此方法来反序列化对象。\n\n### ObjectInputStream\n`ObjectInputStream`\
  \ 类扩展 `InputStream` 并实现 `ObjectInput` 接口。它负责从流中读取对象。\n- **构造函数**：`ObjectInputStream(InputStream\
  \ in)` 创建一个从指定 `InputStream` 读取的 `ObjectInputStream`。参数 `in` 是从中读取序列化对象的输入流。\n-\
  \ **反序列化方法**：`Object readObject()` 从 `ObjectInputStream` 读取一个对象。\n\n### 示例 15.31\n\
  \n```java\nimport java.io.*;\n\nclass SerializationTest {\n    public static void\
  \ main (String args[]) throws IOException {\n      try {\n        MyClass object1\
  \ = new MyClass(\"Hello\", 123, 1.e3);\n        MyClass object2 = new MyClass(\"\
  Hello1\", 1, 2);\n        System.out.println(object1);\n        System.out.println(object2);\n\
  \        FileOutputStream fos = new FileOutputStream(\"serial.dat\");\n        ObjectOutputStream\
  \ oos = new ObjectOutputStream(fos);\n        oos.writeObject(object1);\n      \
  \  oos.writeObject(object2);\n        oos.flush();\n        oos.close();\n     \
  \ } catch(Exception e) {\n        System.out.println(e);\n      }\n      try {\n\
  \        MyClass object3, object4;\n        FileInputStream fis = new FileInputStream(\"\
  serial.dat\");\n        ObjectInputStream ois = new ObjectInputStream(fis);\n  \
  \      object3 = (MyClass) ois.readObject();\n        object4 = (MyClass) ois.readObject();\n\
  \        ois.close();\n        System.out.println(\"After deserialization\");\n\
  \        System.out.println(object3);\n        System.out.println(object4);\n  \
  \    } catch(Exception e) {\n        System.out.println(e);\n      }\n    }\n}\n\
  \nclass MyClass implements Serializable {\n    String s;\n    int i=100;\n    double\
  \ d;\n    MyClass(String s, int i, double d) {\n      this.s = s;\n      this.i\
  \ = i;\n      this.d = d;\n    }\n    public String toString() {\n      return \"\
  s = \"+ s +\"; i = \"+ i + \" ; d = \" +d;\n    }\n}\n```\n\n**输出：**\n```\ns = Hello;\
  \ i = 123 ; d = 1300.0\ns = Hello1; i = 1 ; d = 2.0\nAfter deserialization\ns =\
  \ Hello; i = 123 ; d = 1300.0\ns = Hello1; i = 1 ; d = 2.0\n```\n\n**注意：**我们可以在一个文件中保存多个同类型的对象，也可以在同一个文件中保存不同类型的对象。\n\
  \n### 示例 15.32\n此示例演示了 `transient` 和 `static` 变量在序列化过程中不会持久化。\n\n```java\nimport\
  \ java.io.*;\n\nclass SerializationTest2 {\n    public static void main (String\
  \ args[]) throws IOException {\n      try {\n        MyClass object1 = new MyClass(\"\
  Hello\", 123, 1.e3);\n        MyClass object3 = new MyClass(\"Hello1\", 1, 2);\n\
  \        object3.x = 200;\n        A object5 = new A();\n        System.out.println(object1);\n\
  \        System.out.println(object3);\n        System.out.println(object5);\n  \
  \    }\n    }\n}\n```\n\n\n\n\n\n```java\nFileOutputStream fos = new FileOutputStream(\"\
  serial.dat\");\nObjectOutputStream oos = new ObjectOutputStream(fos);\noos.writeObject(object1);\n\
  oos.writeObject(object3);\noos.writeObject(object5);\nobject3.x = 400;\noos.flush();\n\
  oos.close();\n} catch(Exception e) {\n    System.out.println(e);\n}\ntry {\n   \
  \ MyClass object2, object4;\n    A object6;\n    FileInputStream fis = new FileInputStream(\"\
  serial.dat\");\n    ObjectInputStream ois = new ObjectInputStream(fis);\n    object2\
  \ = (MyClass) ois.readObject();\n    object4 = (MyClass) ois.readObject();\n   \
  \ object6 = (A) ois.readObject();\n    ois.close();\n    fis.close();\n    System.out.println(\"\
  After deserialization\");\n    System.out.println(object2);\n    System.out.println(object4);\n\
  \    System.out.println(object6);\n} catch(Exception e) {\n    System.out.println(e);\n\
  }\n}\n}\nclass MyClass implements Serializable {\n    String s;\n    transient private\
  \ int i=100;\n    public static int x = 10;\n    double d;\n    MyClass(String s,\
  \ int i, double d) {\n        this.s = s;\n        this.i = i;\n        this.d =\
  \ d;\n        x = 100;\n    }\n    public String toString() {\n        return \"\
  s = \" + s + \"; i = \"+ i + \" ;d = \" + d +\"; x = \"+ x;\n    }\n}\nclass A implements\
  \ Serializable {\n    public String toString() {\n        return \"Class A\";\n\
  \    }\n}\n```\n\n### 示例 15.33: 使用 Externalizable\n\n```java\nimport java.io.*;\n\
  class SerializationTest1 {\n    public static void main (String args[]) throws IOException\
  \ {\n        try {\n            MyClass object1 = new MyClass(\"Hello\", 99, 123.45);\n\
  \            System.out.println(object1);\n            FileOutputStream fos = new\
  \ FileOutputStream(\"serial.dat\");\n            ObjectOutputStream oos = new ObjectOutputStream(fos);\n\
  \            System.out.println(\"before writing object\");\n            oos.writeObject(object1);\n\
  \            System.out.println(\"after writing object\");\n            oos.flush();\n\
  \            oos.close();\n        } catch(Exception e) {\n            System.out.println(e);\n\
  \        }\n        try {\n            MyClass object2;\n            FileInputStream\
  \ fis = new FileInputStream(\"serial.dat\");\n            ObjectInputStream ois\
  \ = new ObjectInputStream(fis);\n            System.out.println(\"before reading\
  \ object\");\n            object2 = (MyClass) ois.readObject();\n            System.out.println(\"\
  after reading object\");\n            ois.close();\n            System.out.println(object2);\n\
  \        } catch(Exception e) {\n            System.out.println(e);\n        }\n\
  \    }\n}\nclass MyClass implements Serializable {\n    String s;\n    int i=100;\n\
  \    double d;\n    public MyClass() {}; // 必须的\n    public MyClass(String s, int\
  \ i, double d) {\n        this.s = s;\n        this.i = i;\n        this.d = d;\n\
  \    }\n    public String toString() {\n        return \"s = \"+ s +\"; i = \"+\
  \ i + \" ;d = \" +d;\n    }\n    public void writeExternal(ObjectOutput oos) throws\
  \ IOException {\n        System.out.println(\"Inside writeExternal\");\n       \
  \ oos.writeObject(s);\n        oos.writeInt(i);\n        oos.writeDouble(d);\n \
  \   }\n    public void readExternal(ObjectInput ois) throws ClassNotFoundException,\
  \ IOException {\n        System.out.println(\"Inside readExternal\");\n        s\
  \ = (String) ois.readObject();\n        i = ois.readInt();\n    }\n}\n```\n\n**输出：**\n\
  ```\ns = Hello; i = 99 ;d = 123.45\nbefore writing object\nafter writing object\n\
  before reading object\nafter reading object\ns = Hello; i = 99 ;d = 123.45\n```\n\
  \n**注意：**\n在反序列化过程中，对象将使用默认构造函数进行构建（与 serializable 接口不同），然后进行初始化。状态的恢复应该在 `readExternal()`\
  \ 中完成。同样，在序列化期间，只保存类标识。任何状态都必须在 `writeExternal()` 中显式保存。\n\n---\n\n# 第 16 章：Applet\n\
  \n### 简介\nApplet 是一种设计用于在互联网上传输并由 Internet Explorer 或 Netscape Navigator 等兼容 Java\
  \ 的网络浏览器在客户端机器上执行的应用程序。Applet 也是 Java 程序，但它们居住（存储）在服务器上。\n\nApplet 不能像独立应用程序那样执行。Applet\
  \ 只能通过嵌入 HTML 页面（类似于图像或音频文件）来执行。运行 applet 需要我们需要访问一个嵌入了 applet 的 HTML 页面。当网络浏览器下载此类\
  \ HTML 页面时，它会随后加载包含 applet 代码的可执行文件，然后在本地机器上执行它。\n\n当 applet 到达客户端后，它对资源的访问非常有限，这样它就可以在不（破坏）数据完整性的情况下产生任意的用户界面。\n\
  \n### Applet 架构\nApplet 与普通程序不同：\n\n*   Applet 是基于 GUI 的（窗口的）程序\n*   Applet 是事件驱动的\n\
  \n当普通 Java 程序（非 GUI 的）需要输入时，它会提示用户并调用某些方法如 `readLine()`，即交互是由程序发起的。这并不是 GUI 程序的行为方式。交互是由用户发起的程序。例如，在文字处理软件中，用户通过点击不同的按钮触发动作，从而执行相应的代码。\n\
  \nApplet 使用 `awt` 包（抽象窗口工具包）来提供 GUI 并处理事件。`awt` 之所以命名是因为完全取决于底层操作系统的功能。Applet 类似于一组中断服务程序。Applet\
  \ 等待事件发生。awt 通过调用 applet 提供的事件处理器来通知 applet 事件。一旦发生这种情况，applet 必须采取适当行动并迅速将控制权还给\
  \ AWT。\n\n这是一个关键点。在大多数情况下，applet 不应进入长时间维持控制模式。相反，它必须响应事件执行特定操作，然后将控制权还给 AWT。\n\n\
  在那些 applet 需要自行执行重复任务的情况下（例如，在窗口上显示滚动消息），我们必须启动额外的执行线程。\n\n### 编写 Applet\n所有 applet\
  \ 都是 `Applet` 类的子类。`Applet` 类位于 `java.applet` 包中。`Applet` 类的层次结构如下：\n\n`java.lang.Object`\n\
  |\n`java.awt.Component`\n|\n`java.awt.Container`\n|\n`java.awt.Panel`\n|\n`java.applet.Applet`\n\
  \n`Applet` 类为 applet 执行提供了所有的支持，例如启动和停止。它还提供了加载和显示图像的方法。它还为所有的窗口活动提供了必要的支持。\n\n\
  我们扩展 applet 类的子类必须始终声明为 `public`，因为它是由网络浏览器实例化（创建对象）并执行的。浏览器在实例化 applet 时使用无参构造函数，因此必须提供具有公共可见性的无参构造函数。\n\
  \n\n\n\n\n建议不要在 `Applet` 类中提供构造函数，因为在这种情况下，编译器将提供默认的无参数构造函数。\n\n我们可以利用 `init()`\
  \ 方法进行初始化。在编写 applet 代码时，我们通常会重写 `Applet` 类的一些方法，这些方法在 applet 执行期间会被自动调用。\n\n重写\
  \ `paint()` 方法是非常常见的。`paint()` 方法中的代码主要在 `Applet` 窗口中显示输出。\n\n### 示例 16.1 (App1.java)\n\
  以下程序演示了一个简单的 applet，它只是在窗口内显示“Hello World”。我们在 applet 的 `paint` 方法中绘制/显示的任何内容，它都会出现在\
  \ applet 的窗口中。\n\n在接下来的示例中，applet 窗口的背景颜色设置为红色，前景颜色设置为绿色，因此背景将显示为红色，文本“Hello Word”将以绿色显示。\n\
  \n```java\n1.  import java.awt.*;\n2.  import java.applet.Applet;\n3.  /*<applet\
  \ code= \"App1\" width =500 height=100></applet>*/\n4.  public class App1 extends\
  \ Applet\n5.  { \n6.    public void init()\n7.    {\n8.        setBackground(Color.red);\n\
  9.        setForeground(Color.green);\n10.    }\n11.    public void paint(Graphics\
  \ g)\n12.    { \n13      g.drawString(\"Hello World\",20,20);\n14.    }\n15.  }\n\
  ```\n\n输出：\n\n![image](img/image04.png)\n\n### 执行 Applet\nApplets 不是由控制台运行时解释器执行的。有两种方法可以运行\
  \ applet：\n\n1. 在 Java 兼容的浏览器中执行 applet。\n2. 使用 `appletviewer`，例如标准 SDK 工具 `appletviewer`\
  \ 在窗口中执行我们的 applet。这是测试我们的 applet 最快最简单的方法。\n\n#### 在 浏览器中执行 Applet：\n我们需要编写一个短的\
  \ HTML 文件，包含 `APPLET` 标签。applet 标签必须包含以下三个属性：\n*   `Code`\n*   `Width`\n*   `Height`\n\
  \n`code` 属性的值指定包含 applet 代码的类。`width` 和 `height` 属性分别指定 applet 的宽度和高度。HTML 文件 `RunApp.html`\
  \ 中嵌入了 applet \"App1\"。\n\n```html\n<html>\n<head>\n<title>Simple Applet</title>\n\
  </head>\n<body>\n<h1>Hello World Application</h1>\n<applet code=\"App1\" width=500\
  \ height=100></applet>\n</body>\n</html>\n```\n\n你可以通过在浏览器中打开 `RunApp.html` 文件来执行\
  \ applet。该文件可以是本地文件，也可以从 Web 服务器加载。\n\n#### 使用 appletviewer 执行 Applet：\n然而，存在一种更方便的方法来加速测试。只需在你的\
  \ Java 源代码文件中包含 `APPLET` 标签的注释。通过这样做，我们可以通过启动 `appletviewer` 运行我们的源代码来测试你的输出。如果使用这种方法，在编译后可以这样执行\
  \ applet：\n\n```bash\nappletviewer SimpleApplet.java\n```\n\n### Applet 生命周期方法\n\
  `Applet` 重写了一组方法，由浏览器或 `appletviewer` 与 applet 接口并控制其执行。这些方法也被称为生命方法，因为浏览器或 applet\
  \ viewer 在 applet 生命周期的不同阶段会调用它们。共有五个生命方法：\n*   `public void init()`\n*   `public\
  \ void start()`\n*   `public void stop()`\n*   `public void destroy()`\n*   `public\
  \ void paint(Graphics g)`\n\n这些方法中的四个 `init()`、`start()`、`stop()` 和 `destroy()`\
  \ 在 `applet` 类中定义。`paint()` 由 `awt Component` 类定义，提供了这些方法的默认实现。Applets 不需要重写它们没有使用的方法。然而，非常简单的\
  \ applet 不需要定义它们。\n\n### Applet 初始化与终止：\n当 applet 开始时，按顺序调用以下方法：\n1. `init()`\n\
  2. `start()`\n3. `paint()`\n\n当 applet 终止时，会发生以下方法调用：\n1. `stop()`\n2. `destroy()`\n\
  \n### init() 方法：\n这是第一个被调的方法。在这里我们应该初始化变量并编写其他初始化活动的代码。该方法在我们的 applet 生命周期内仅在实例化后被调用一次。\n\
  \n### start() 方法：\n`start()` 方法在 `init()` 之后调用。它在 applet 停止后也被用于重启。`init()` 在 applet\
  \ 第一次加载时调用，`start()` 在 applet 的 HTML 文档显示在屏幕上每次调用。因此，如果用户离开网页并返回，applet 将从 `start()`\
  \ 恢复执行。\n\n### paint() 方法：\n当 applet 开始时，在 `init()` 和 `start()` 方法之后调用 `paint`。当\
  \ applet 的输出需要重绘时也会调用 `paint()`。这种情况可能由于几个原因。例如，运行 applet 的窗口被覆盖然后最小化。\n\n### stop()\
  \ 方法：\n当用户离开包含 applet 的页面到另一个页面时，调用 `stop()` 方法。我们应该使用 `stop()` 来暂停在 applet 不可见或最小化不需要运行的线程。\n\
  \n### destroy() 方法：\n当环境确定 applet 需要从内存中移除时，调用 `destroy()` 方法。此时，我们应该释放 applet 可能使用的资源。`stop()`\
  \ 方法始终在 `destroy()` 之前调用。\n\n### 示例 16.2\n简单的 applet 将背景颜色设置为青色，前景颜色设置为红色，并显示一条消息，说明了\
  \ applet 启动时 `init()`、`start()` 和 `paint()` 方法调用的顺序。\n\n```java\n1.  import java.awt.*;\n\
  2.  import java.applet.Applet;\n3.  /*<applet code= \"App1\" width =500 height=100></applet>*/\n\
  4.  public class App1 extends Applet\n5.  { \n6.    public void init()\n7.    {\n\
  8.        setBackground(Color.red);\n9.        setForeground(Color.green);\n10.\
  \    }\n11.    public void paint(Graphics g)\n12.    { \n13      g.drawString(\"\
  Hello World\",20,20);\n14.    }\n15.  }\n```\n\n### 动态 Applet\nApplet 窗口中显示的输出可以是动态的。例如，我们可以显示一个移动横幅。applet\
  \ 还可以用于此类应用程序，如通过服务器获取并显示板球比赛得分和其他统计数据；显示股票价格等。\n\n### 示例 16.3\n以下示例显示了一个移动横幅。它演示了使用\
  \ `repaint()` 方法来刷新显示。该 applet 在 applet 窗口中从右向左滚动消息。\n\n由于消息的滚动是一项重复性任务，它由一个在 applet\
  \ 启动时创建的独立线程执行。该程序还演示了可以在 `stop()` 方法中释放资源，并在 `start()` 方法中重新获取。\n\n```java\n1.\
  \  import java.awt.*;\n2.  import java.applet.*;\n```\n\n\n\n\n\n```java\n/*<applet\
  \ code=\"App3\" width=500 height=100></applet>*/\npublic class App3 extends Applet\
  \ implements Runnable {\n    String msg=\"A Simple Moving Banner.\" ;\n    Thread\
  \ t = null;\n    boolean stopFlag;\n\n    public void init () {\n        setBackground(Color.cyan);\n\
  \        setForeground(Color.red);\n    }\n\n    public void start() {\n       \
  \ t=new Thread(this);\n        stopFlag = false ;\n        t.start ();\n    }\n\n\
  \    public void stop() {\n        stopFlag=true;\n        t=null;\n    }\n\n  \
  \  public void paint(Graphics g) {\n        g.drawString(msg,50,30);\n    }\n\n\
  \    public void run() {\n        for (;;) {\n            repaint();\n         \
  \   try {\n                Thread.sleep(250);\n            } catch(InterruptedException\
  \ e) {\n                System.out.println(e);\n            }\n            msg =\
  \ msg.substring (1) + msg.charAt(0);\n            if (stopFlag)\n              \
  \  break;\n        }\n    }\n}\n```\n\n输出：\n![image](img/image037.png)\n\n### 使用状态窗口\n\
  \n除了在窗口中显示信息外，applet 还可以向运行它的浏览器或 `appletviewer` 的状态窗口输出消息。\n\n要做到这一点，请调用 `showStatus()`\
  \ 并传入我们想要显示的字符串。状态窗口是向用户提供关于 applet 正在发生的情况、建议选项或报告某些类型错误反馈的好处。\n\n状态窗口也是一个极佳的调试辅助（帮助），因为它为我们提供了一种输出关于\
  \ applet 信息的简单方法。\n\n#### 示例 16.4：以下示例演示了如何使用状态窗口。\n\n```java\nimport java.awt.*;\n\
  import java.applet.*;\n/*<applet code=\"App4\" width=500 height=100></applet>*/\n\
  public class App4 extends Applet {\n    public void init( ) {\n        setBackground(Color.cyan);\n\
  \    }\n\n    public void paint(Graphics g) {\n        g.drawString(\"This is in\
  \ the applet window\",10,20);\n        showStatus(\"This is shown in the status\
  \ window\");\n    }\n}\n```\n\n输出：\n![image](img/image055.png)\n\n### HTML 的 APPLET\
  \ 标签\n\n`APPLET` 标签用于从 HTML 文档和 `appletviewer` 启动 applet。\n\n`appletviewer` 会在单独的窗口中执行找到的每个\
  \ `APPLET` 标签；而 Netscape Navigator 和 Internet Explorer 等浏览器允许在单个页面上许多 applet。\n\n\
  标准 `APPLET` 标签的语法为：\n\n```html\n< APPLET\nCODE=applet class name\nCODEBASE=codebase\
  \ URL\nALT=alternate Text,\nNAME=appletInstancename\nWIDTH=pixels\nHEIGHT=pixels\n\
  ALIGN=alignment\nVSPACE=vertical space in pixels\nHSPACE=horizontal space in pixels\n\
  >\n\n<PARAM NAME=attributeName-1 VALUE=Attribute Value-1>\n<PARAM NAME=attributeName-2\
  \ VALUE=Attribute Value-2>\n<PARAM NAME=attributeName-N VALUE=Attribute Value-N>\n\
  </APPLET>\n```\n\n- **CODE**：必需的属性，提供包含我们 applet 编译文件的文件名。该文件相对于 applet 的 `CODEBASE`\
  \ URL，或者如果设置了 `CODEBASE`，则相对于指定的目录。\n- **CODEBASE**：可选属性，指定 applet 的基础 URL，即将搜索\
  \ applet 可执行类文件（由 `CODE` 标签指定）的目录。如果未指定此属性，则使用 HTML 文档的 URL 作为 `CODEBASE`。\n- **ALT**：可选属性，用于指定当浏览器理解\
  \ `APPLET` 标签但当前无法运行 Java 时，应该显示的短文本消息。这与我们为不支持 applet 的浏览器提供的备用文本是不同的。\n- **NAME**：可选属性，用于为\
  \ applet 实例指定名称。applet 必须命名，以便同一页面上的其他 applet 能够通过名称找到它们并与其进行通信。要通过名称获取 applet，请使用\
  \ `Applet` 接口定义的 `getApplet()`。\n- **WIDTH** 和 **HEIGHT**：applet 显示区域以像素为单位的尺寸。\n\
  - **ALIGN**：可选属性，指定 applet 的对齐方式。该属性的处理方式与 HTML `IMG` 标签相同，可能的值有：`LEFT`、`RIGHT`、`TOP`、`BOTTOM`、`MIDDLE`、`BASELINE`、`TEXTTOP`、`ABSMIDDLE`、`ABSBOTTOM`。\n\
  - **VSPACE** 和 **HSPACE**：这些属性是可选的。`VSPACE` 指定 applet 上下方的像素间距。`HSPACE` 指定 applet\
  \ 左右两侧的像素间距。它们的处理方式与 `IMG` 标签的 `VSPACE` 和 `HSPACE` 属性相同。\n\n### PARAM 标签\n\n`PARAM`\
  \ 标签允许我们在 HTML 页面中指定 applet 特有的参数。applet 通过 `getParameter()` 方法访问其属性。`PARAM` 标签有两个属性：`NAME`\
  \ 和 `VALUE`。\n\n#### 示例 16.5 此示例演示了如何从 HTML 页面向 Applet 传递参数。\n\n```java\nimport\
  \ java.awt.*;\nimport java.applet.*;\n/*<applet code=\"App5\" width=500 height=100>\n\
  <param name=\"fontName\" value=\"Arial\">\n<param name=\"fontSize\" value=\"30\"\
  >\n</applet>*/\npublic class App5 extends Applet {\n    String fName;\n    int fSize;\n\
  \n    public void init () {\n        fName = getParameter(\"fontName\");\n     \
  \   if (fName == null)\n            fName = \"Courier\";\n        fSize = Integer.parseInt(getParameter(\"\
  fontSize\"));\n        Font f1= new Font(fName, Font.PLAIN, fSize);\n        setFont(f1);\n\
  \    }\n\n    public void paint (Graphics g) {\n        g.drawString (\"Font Name\
  \ : \" + fName, 0, 25 );\n        g.drawString (\"Font Size : \" + fSize, 0, 50\
  \ );\n        g.drawString (\"Hello world\", 0,75);\n    }\n}\n```\n\n输出：\n![image](img/image091.png)\n\
  \n### 获取 DocumentBase 和 CodeBase\n\n通常我们需要创建需要数据的 applet。Java 将允许 applet 从启动 applet\
  \ 的 HTML 文件目录（文档基）以及加载 applet 类文件的目录（代码基）。\n\n这些目录以 `URL` 对象的形式返回。它们可以要加载的文件字符串拼接。要实际加载另一个文件，我们将使用\
  \ `Applet` 接口定义的 `showdocument()` 方法。\n\n#### 示例 16.6：以下示例演示了如何在 applet 代码中获取文档基和代码基。\n\
  \n**App6.java**\n```java\nimport java.awt.*;\nimport java.applet.*;\nimport java.net.URL;\n\
  public class App6 extends Applet {\n    public void paint (Graphics g) {\n     \
  \   URL u1 = getCodeBase();\n        g.drawString (\"Code base:-\" + u1, 10,20);\n\
  \        URL u2 = getDocumentBase();\n        g.drawString (\"Document base:-\"\
  +u2, 10,40);\n    }\n}\n```\n\n**App6.html**\n```html\n<html>\n  <body>\n    <applet\
  \ code=\"App6\" width=500 height=200></applet>\n  </body>\n</html>\n```\n\n### AppletContext\
  \ 和 Show Document()\n\n`AppletContext` 是一个接口，允许我们从 applet 的执行环境中获取信息。当前执行的 applet\
  \ 的上下文通过调用 applet 类定义的 `getAppletContext()` 方法获取。为了允许我们的 applet 将控制权转移到另一个 URL，我们必须使用\
  \ `Applet Context` 接口定义的 `showDcoument()` 方法。\n\n\n\n\n\n在 applet 中，一旦我们获取了 applet\
  \ 的上下文（context），就可以通过调用 `showDocument()` 方法将另一个文档显示在视图中。该方法没有返回值，如果执行失败也不会抛出异常，因此请谨慎使用。存在两个\
  \ `showDocument()` 方法。\n\n```java\nvoid ShowDocument(URL url)\n```\n用给定的 `URL` 替换当前正在查看的\
  \ Web 页面\n\n```java\nvoid ShowDocument (URL url, String where)\n```\n在浏览器窗口的指定位置（where）显示指定的文档。“where”参数的有效值有：\n\
  \n* `\"_self\"`（在当前帧中显示）\n* `\"_parent\"`（在父级帧中显示）\n* `\"_top\"`（在最顶层帧中显示），以及\n\
  * `\"_blank\"`（在新的浏览器窗口中显示）\n\n### 示例 16.7\n下面的 applet 演示了 `Applet Context` 和 `showDocument()`\
  \ 的用法。执行时，它获取当前的 applet 上下文并使用该上下文将控制权转移到名为 `A.html` 的文件。该文件必须与 applet 位于同一目录下。`Test.html`\
  \ 可以包含任何你喜欢的有效超文本。\n\n```java\n1. import java.awt.*;\n2. import java.applet.*;\n\
  3. import java.net.*;\n4. public class App7 extends Applet\n5. { \n6.   AppletContext\
  \ ac;\n7.   URL u1;\n8.   public void init()\n9.   {\n10.     setBackground(Color.cyan);\n\
  11.     }\n12.  public void start( )\n13.  {\n14.     ac = getAppletContext();\n\
  15.     u1 = getCodeBase();\n16.     try\n17.     {\n18.      Thread.sleep(3000);\n\
  19.      ac.showDocument(new URL(u1 + \"A.html\"),\"_blank\");\n20.     }\n21. \
  \    catch(MalformedURLException e)\n22.     { \n23.      showStatus(\"Invalid URL\"\
  );\n24.      e.printStackTrace() ;\n25.     }\n26.     catch(InterruptedException\
  \ e)\n27.     { \n28.      showStatus(\"Invalid URL\");\n29.      e.printStackTrace\
  \ () ;\n30.     }\n31.  }\n32.  public void paint (Graphics g)\n33.  {\n34.    g.drawString(u1+\"\
  A.html\",20,20);\n35.    try\n36.     {\n37.      Thread.sleep(3000);\n38.     }\n\
  39.     catch(InterruptedException e)\n40.     {\n41.      System.out.println(e);\n\
  42.     }\n43.  }\n44.}\n```\n\n**App7.html**\n```html\n1. <html>\n2.   <head>\n\
  3.   <Title>Applet Context Demo</Title>\n4.   </head>\n5.   <body>\n6.   <applet\
  \ code=\"App7\" width=200 height=200></applet>\n7.   </body>\n8. </html>\n```\n\n\
  **A.html**\n```html\n1. <html>\n2.   <head>\n3.   <title>New Page</title>\n4.  \
  \ </head>\n5.   <body bgcolor=blue text=red>\n6.   <h1>matrix</h1>\n7.   </body>\n\
  8. </html>\n```\n\n### 示例 16.8\n```java\n1. import java.applet.*;\n2. import java.awt.*;\n\
