  \n创建一个滚动列表。此构造函数不指定可见行数，但产生默认四行的高度。当然，在许多情况下，列表的实际高度由布局管理器决定。\n\n`List(int rows)`\n\
  \n创建一个具有指定可见行数的滚动列表。\n\n`List(int rows, boolean multipleMode)`\n\n创建一个初始化为显示指定行数并允许多选的滚动列表。\n\
