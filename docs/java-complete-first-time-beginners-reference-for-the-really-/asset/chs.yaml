  class A5\n{ \n  public static void main(String args[])\n    { \n      Frame f= new\
  \ Frame();\n      f.setLayout(new FlowLayout());\n      f.setSize(300,300);\n  \
  \    f.addWindowListener(new B( ));\n      f.setVisible(true);\n    }\n}\nclass\
  \ B implements WindowListener\n{ \n  public void windowOpened(WindowEvent we)\n\
  \    { \n      System.out.println(\"Window Opened\");\n    }\n  public void windowActivated(WindowEvent\
  \ we)\n    { \n      System.out.println(\"Window Activated\");\n    }\n  public\
  \ void windowDeactivated(WindowEvent we)\n    { \n      System.out.println(\"Window\
  \ Deactivated\");\n    }\n  public void windowClosing(WindowEvent we)\n    { \n\
  \      System.out.println(\"Window Closing\");\n      Frame f = (Frame) we.getWindow\
  \ ( );\n      f.dispose();\n    }\n  public void windowClosed(WindowEvent we)\n\
  \    { \n      System.out.println(\"Window Closed\");\n    }\n  public void windowIconified(WindowEvent\
  \ we)\n    { \n      System.out.println(\"Window Iconified\");\n    }\n  public\
  \ void windowDeiconified(WindowEvent we)\n    { \n      System.out.println(\"Window\
  \ Deiconified\");\n    }\n}\n```\n输出：\n![image](img/image05.png)\n\n注意：事件监听器接口有多个方法。最大的接口\
  \ `WindowListener` 有七个方法。假设我们要捕获 `windowClosing()` 事件，以便执行关闭窗口的代码。虽然我们在实现 `WindowListener`\
  \ 的类中只需要 `windowClosing()` 方法，但我们必须为所有方法提供空位实现。\n\n监听器可以通过调用组件的 `removeListener()`\
  \ 方法从组件中移除。例如，下面的代码从按钮 `btn` 移除监听器 `al`：\n\n```java\nbtn.removeActionListener(al);\n\
  ```\n\n### 适配器\n有些事件监听器接口有多个方法。最大的接口 `WindowListener` 有七个方法。如果我们想捕获 `windowClosing()`\
  \ 事件，以便执行关闭窗口的代码。虽然我们在实现 `WindowListener` 的类中只需要 `windowClosing()` 方法，但我们必须为所有方法提供空位实现。\n\
  \n`java.awt.event` 包提供了多个适配器类，每个类对应一个定义了一个方法的监听器接口。\n\n适配器仅仅是实现接口并提供空方法的类。例如，`WindowAdapter`\
  \ 类实现了 `WindowListener` 接口并带有七个空方法。\n\n#### 适配器类及其接口\n| 适配器类 | 监听器接口 |\n| :--- |\
  \ :--- |\n| `ContainerAdapter` | `ContainerListener` |\n| `FocusAdapter` | `FocusListener`\
  \ |\n| `KeyAdapter` | `KeyListener` |\n| `MouseAdapter` | `MouseListener` |\n| `MouseMotionAdapter`\
  \ | `MouseMotionListener` |\n| `WindowAdapter` | `WindowListener` |\n\n### 示例 18.6\
  \ WindowAdapter 类的使用\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass\
  \ A6\n{ \n  public static void main (String args[])\n    { \n      Frame f= new\
  \ Frame();\n      f.setLayout(new FlowLayout());\n      f.setSize(300,300);\n  \
  \    f.addWindowListener(new B( ));\n      f.setVisible(true);\n    }\n}\nclass\
  \ B extends WindowAdapter\n{ \n  public void windowClosing(WindowEvent we)\n   \
  \ { \n      System.out.printIn(“Window Closing”);\n      Frame f = (Frame) we.getWindow\
  \ ( );\n      f.dispose();\n    }\n}\n```\n\n`InputEvent` 类：\n\n\n\n\n\n这是所有组件级输入事件的根类。输入事件在由其源组件进行正常处理之前，会被传递给监听器。这允许监听器和组件子类“消费”事件，从而使源组件不会以默认方式处理它们。例如，在\
  \ `Button` 组件上消费鼠标按下事件将防止 `Button` 被激活。\n\n### 方法\n\n- `void consume()`: 消费此事件，使其不会由产生它的源组件以默认方式进行处理。\n\
  - `int getModifiers()`: 返回此事件的修饰键掩码（Modifier mask）。\n- `int getModifiersEx()`: 返回此事件的扩展修饰键掩码。\n\
  - `static String getModifiersExText(int modifiers)`: 返回描述扩展修饰键的字符串，例如“shift”、“Ctrl\
  \ + Shift”等。\n- `long getWhen()`: 返回此事件发生的时间戳。\n- `boolean isAltDown()`: 返回此事件中\
  \ Alt 修饰键是否被按下。\n- `boolean isConsumed()`: 返回此事件是否已被消费。\n- `boolean isControlDown()`:\
  \ 返回此事件中 Control 修饰键是否被按下。\n- `boolean isShiftDown()`: 返回此事件中 shift 修饰键是否被按下。\n\n\
  ### 鼠标事件类\n\n这是 `Input Event` 类的子类。此事件表示组件中发生了鼠标操作。当且仅当鼠标光标位于组件子类的未被遮挡部分、或者位于菜单或顶层窗口上时，则认为鼠标操作发生在特定的组件中。\n\
  \n此事件既用于鼠标事件（点击、进入、按下、退出、释放），也用于鼠标移动事件（位移动和拖动）。\n\n### 方法\n\n- `int getButton()`:\
  \ 返回哪个鼠标按钮状态发生了变化（如果有）。\n- `int getClickCount()`: 返回与此事件相关的鼠标点击次数。\n- `static String\
  \ getMouseModifiersText(int modifiers)`: 返回描述事件发生期间按下的修饰键的字符串，例如“Shift”或“Ctrl +\
  \ shift”。\n- `point getPoint()`: 返回事件相对于源组件的 x, y 位置。\n- `int getX()`: 返回事件相对于源组件的水平\
  \ x 位置。\n- `int getY()`: 返回事件相对于源组件的垂直 y 位置。\n- `boolean isPopupTrigger()`: 返回此鼠标事件是否为该平台的弹出菜单触发事件。\n\
  \n**注意：** 弹出菜单在不同系统上的触发方式不同。因此，为了实现正确的跨平台功能，应该在鼠标按下（Pressed）和鼠标释放（Released）时都检查\
  \ `isPopupTrigger()`。\n\n### 处理鼠标事件：\n\n### 示例 18.7\n\n```java\nimport java.awt.*;\n\
  import java.awt.event.*;\nclass A7\n{ \n    public static void main(String args[])\n\
  \    { \n      Frame f= new Frame();\n      f.setLayout(new FlowLayout());\n   \
  \   f.setSize(300,300);\n      Button b1 = new Button(\"Push Me\");\n      b1.addMouseListener(new\
  \ B());\n      b1.addMouseMotionListener(new C());\n      b1.addActionListener(new\
  \ D());\n      f.add(b1);\n      f.setVisible(true);\n    }\n}\nclass B implements\
  \ MouseListener\n{ \n    public void mouseEntered(MouseEvent me)\n    {  \n    \
  \  System.out.println(\"Mouse Entered...\");\n      System.out.println(me.getX());\n\
  \      System.out.println(me.getY());\n    }\n    public void mouseExited(MouseEvent\
  \ me)\n    {  \n      System.out.println(\"Mouse Exited...\");\n      Point p1=me.getPoint();\n\
  \      System.out.println(p1.x);\n      System.out.println(p1.y);\n    }\n    public\
  \ void mousePressed(MouseEvent me)\n    { \n      System.out.println(\"Mouse pressed...\"\
  );\n      int ms = me.getModifiersEx();\n      String s = me.getModifiersExText(ms);\n\
  \      System.out.println(s);\n    }\n    public void mouseReleased(MouseEvent me)\n\
  \    { \n      System.out.println(\"Mouse Released...\");\n      System.out.println(\"\
  ClickCount->\" + me.getClickCount());\n    }\n    public void mouseClicked(MouseEvent\
  \ me)\n    { \n      System.out.println(\"Mouse Clicked...\");\n      System.out.println(\"\
  Button->\"+me.getButton());\n    }\n}\nclass C implements MouseMotionListener\n\
  {\n    public void mouseMoved(MouseEvent me)\n    { \n      System.out.println(\"\
  Mouse Moved...\");\n    }\n    public void mouseDragged(MouseEvent me)\n    { \n\
  \      System.out.println(\"Mouse Dragged...\");\n    }\n}\nclass D implements ActionListener\n\
  {\n    public void actionPerformed(ActionEvent ae)\n    {\n      System.out.println\
  \ (\"Button Pressed...\");\n    }\n}\n```\n\n### ActionEvent 类\n\n它是一种语义化事件，表示组件发生了一个动作（action）。这种高级级事件由组件（如\
  \ `Button`）在发生组件特定动作（如被按下）时产生。该事件通过组件的 `addActionListener` 方法传递给每个注册了以接收此类事件的 `ActionListener`。\n\
  \n实现 `ActionListener` 接口的对象在事件发生时会获取此 `ActionEvent`。因此，监听器可以免于处理单个鼠标移动和鼠标点击的细节，而是可以处理“有意义的”（语义化的）事件，例如“按钮按下”。\n\
  \n**注意：** 使用空格键在 `Button` 上触发 `ActionEvent`。\n\n### 方法\n\n- `String getAction()`:\
  \ 返回与此动作相关的命令字符串。\n- `int getModifiers()`: 返回此事件期间按下的修饰键。\n- `long getWhen()`: 返回事件发生的时间戳。\n\
  \n### 示例 18.8：\n\n此示例说明了我们如何在 Action Event 发生时识别修饰键。\n\n```java\nimport java.awt.*;\n\
  import java.awt.event.*;\npublic class KeyModifierDemo extends Frame implements\
  \ ActionListener\n{ \n    Button b;\n    KeyModifierDemo ()\n    { \n      b = new\
  \ Button (“Button”);\n      b.addActionListener(this);\n      setLayout (new FlowLayout\
  \ ( );\n      add (b);\n      setBounds (100,100,200,200);\n      setVisible (true);\n\
  \    }\n    public static void main (String args[])\n    { \n      new KeyModifierDemo\
  \ ( );\n    }\n    public void actionPerformed (ActionEvent ae )\n    { \n     \
  \ System.out.println (“Button Pressed”);\n      int ms = ae.getModifiers ( );\n\
  \      if (ms & InputEvent.CTRL_DOWN_MASK)!=0)\n      {   \n        System.out.println\
  \ (“CTRL key was pressed”);\n      }\n      if (ms & InputEvent.SHIFT_DOWN_MASK)!=0)\n\
  \      { \n        System.out.println (“Shift Key was pressed”);\n      }\n    \
  \  if (ms & InputEvent.ALT_DOWN_MASK)!=0)\n      { \n        System.out.println\
  \ (“ALT key was pressed”);\n      }\n    }\n}\n```\n\n### 处理多个 Action 命令\n\nAction\
  \ 事件是最简单的。当我们发现滚动条发送了调整事件时，明显的问题是：“现在滚动条的值是多少？”。当我们发现鼠标被点击时，自然会想问：“鼠标的 x 和 y 坐标是多少？”但当我们发现一个按钮发送了\
  \ Action 事件时，似乎没有其他额外信息需要寻找；按钮被点击了，这似乎就是全部了。\n\n\n\n\n然而，`Action` 事件还关联有一段额外信息。这段信息是一个字符串，被称为\
  \ Action 命令（Action command）。我们可以通过 `getActionCommand()` 方法提取 `Action` 事件的 Action\
  \ 命令。如果 `Action` 事件是由文本字段发送的，`getActionCommand()` 将返回文本字段当前的内容（当用户按下回车键时，文本字段会发送\
  \ `Action` 事件）。如果 `Action` 事件是由按钮发送的，默认行为是 `getActionCommand()` 返回按钮标签（label）的字符串。但是，我们可以通过调用按钮的\
  \ `setActionCommand(String)` 方法显式地设置按钮的 ActionCommand。\n\n```java\nButton btn =\
  \ new Button (\"Hello\");\nbtn.setActionCommand (\"Hello\");\n```\n\n当按钮的 Action\
  \ 监听器（listener）需要决定如何响应 `Action` 事件时，Action 命令对按钮的优势显而易见。单个监听器作为多个组件的监听器是常见的情况；在我们的上下文中，一个对象可以是几个或多个按钮的\
  \ Action 监听器。在这种情况下，必须通过确定点击了哪个按钮来调用该对象的 `actionPerformed()` 方法。下面的示例演示了这一点：\n\n\
  ### 示例 18.9\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass ButtonRefTest\n\
