  \n\n\n\n在任何给定时刻，任何特定对象上最多有一个线程可以执行 `synchronized` 方法。此讨论也适用于类的静态（static）同步方法。\n\n\
  注意 - `synchronized` 修饰符不适用于类或成员变量。\n\n### E. native 修饰符\n\n`native` 修饰符只能引用方法。类似于\
  \ `abstract` 关键字，`native` 表示方法的体将在其他地方找到。`native` 方法的体完全位于 JVM 之外的某个库中。原生代码是用非 Java\
  \ 语言编写的，通常是 `C` 或 `C++`，并针对单一目标机器类型进行编译。因此，这违反了 Java 的平台无关性。将 Java 移植到新平台的人员需要实现大量的原生代码，以支持\
  \ GUI 组件、网络通信以及许多其他平台特定的功能。然而，应用程序和 applet 程序员很少需要编写原生代码。\n\n### F. transient 修饰符\n\
  \n对象可以使用序列化进行存储。序列化将对象转换为便于存储的输出格式。稍后可以以序列化时的相同状态检索对象，这意味着序列化中包含的所有字段将具有与序列化时相同的值。这样的对象被称为持久对象。\n\
  \n在类声明中可以将字段指定为 `transient`，表示当该类对象写入持久化存储时，其值不应被保存。\n\n```java\nclass Experiment\
  \ implements Serializable {\n    transient int currentTemperature;  //临时\n    double\
  \ mass;        //持久化值\n}\n```\n\n对静态变量指定 `transient` 修饰符是冗余的，因此不建议这样做。静态变量不属于序列化对象的持久状态的一部分。\n\
  \n### G. volatile 修饰符\n\n在执行期间，编译后的代码可能会出于效率考虑缓存字段的值。由于多个线程可以访问同一个字段，因此在读取和写入字段值时，不允许缓存导致不一致性是至关重要的。`volatile`\
  \ 修饰符可以告知编译器它不应该尝试对该字段进行优化，因为这在多个线程访问该字段时可能会导致不可预测的结果。\n\n![STAR-LOGO-2013](img/image024.png)\n\
  \n# 章节\n# ∞ 14 ∞\n## (包装类)\n\n## 引言\n\n`java` 中的原始数据类型不是对象。如果我们想将这些数据类型作为对象使用，就必须为\
  \ `java` 包中提供的每个原始数据类型使用包装类。\n\n有许多内置类，它们无法处理原始数据类型，因为它们只处理对象。其中一个类是 `Vector`，它用于存储对象集合。我们不能使用\
  \ `Vector` 类直接存储原始数据类型的元素集合。但我们可以通过存储与原始数据类型对应的包装类对象来实现。\n\nJava 为每个原始数据类型都有对应的包装类，如下表所示：\n\
  \n| 原始数据类型 | 包装类 |\n| :--- | :--- |\n| boolean | `Boolean` |\n| char | `Character`\
  \ |\n| byte | `Byte` |\n| short | `Short` |\n| int | `Integer` |\n| long | `Long`\
  \ |\n| float | `Float` |\n| double | `Double` |\n\n### Number 类\n\n抽象类 `Number`\
  \ 被包装类型 `byte`、`short`、`int`、`long`、`float` 和 `double` 的类实现。`Number` 类具有抽象方法，返回不同数字格式的值。这些方法是：\n\
  \n| 方法 | 说明 |\n| :--- | :--- |\n| `byteValue()` | 返回指定数字的 `byte` 值。 |\n| `shortValue()`\
  \ | 返回指定数字的 `short` 值。 |\n| `intValue()` | 返回指定数字的 `int` 值。 |\n| `longValue()` |\
  \ 返回指定数字的 `long` 值。 |\n| `floatValue()` | 返回指定数字的 `float` 值。 |\n| `doubleValue()`\
  \ | 返回指定数字的 `double` 值。 |\n\n注意 - `byteValue()`、`shortValue()`、`intValue()`、`longValue()`、`floatValue()`\
  \ 和 `doubleValue()` 方法可能涉及四舍五入。\n\n### 示例 14.1\n示例演示了调用 `Number` 类方法时发生的四舍五入。\n\n\
  ```java\nclass Wrapper {\n    public static void main(String args[]) {\n       \
  \ Integer iObj = new Integer(128);\n        System.out.println(iObj.byteValue());\
  \ //截断\n        Long lObj = new Long(123456789123456789L);\n        System.out.println(lObj);\n\
  \        System.out.println(lObj.doubleValue());\n        Float fObj = new Float(3.99f);\n\
  \        System.out.println(fObj.intValue()); //截断\n    }\n}\n```\n**输出：**\n```\n\
  -128\n123456789123456789\n1.2345678912345678E17\n3\n```\n\n#### 使用包装类的构造函数将原始数字转换为对象并将对象转换为原始数字：示例\
  \ 14.2\n示例演示了如何将原始类型封装成对象，以及如何转换回原始类型。\n\n```java\nclass Convert {\n    public static\
  \ void main(String args[]) {\n        System.out.println(\"Converting primitive\
  \ numbers to objects\");\n        byte b = 105;\n        Byte bObj = new Byte(b);\n\
  \        System.out.println(bObj); //toString()\n        short s = 2015;\n     \
  \   Short sObj = new Short(s);\n        System.out.println(sObj);\n        int i\
  \ = 32717;\n        Integer iObj = new Integer(i);\n        System.out.println(iObj);\n\
  \        long l = 2345433556575L;\n        Long lObj = new Long(l);\n        System.out.println(lObj);\n\
  \        float f = 3.1415f;\n        Float fObj = new Float(f);\n        System.out.println(fObj);\n\
  \        double d = 3.1415;\n        Double dObj = new Double(d);\n        System.out.println(dObj);\n\
  \n        System.out.println(\"Converting numeric objects to primitive numbers\"\
  );\n        byte b1 = bObj.byteValue();\n        short s1 = sObj.shortValue();\n\
  \        int i1 = iObj.intValue();\n        long l1 = lObj.longValue();\n      \
  \  float f1 = fObj.floatValue();\n        double d1 = dObj.doubleValue();\n    \
  \    System.out.println(b1);\n        System.out.println(s1);\n        System.out.println(i1);\n\
  \        System.out.println(l1);\n        System.out.println(f1);\n        System.out.println(d1);\n\
  \    }\n}\n```\n**输出：**\n```\nConverting primitive numbers to objects\n105\n2015\n\
