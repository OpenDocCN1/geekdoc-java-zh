  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章节\n# ∞ 6 ∞\n## (继承)\n\n## 引言\n\n当一个类的属性转移到另一个类时，就称为继承。在这种情况下，被继承的类被称为超类、基类或父类，而继承的类被称为子类、子类或派生类。\n\
  \n继承允许我们通过添加额外功能来扩展现有的类（基类）。它鼓励代码的可重用性，这有助于减小代码体积，尽管在某些情况下可能会导致复杂性。\n\n例如，如果我们已经完成了一个简单计算器的代码。之后我们需要开发一个科学计算器，那么我们有二种替代方案：\n\
  \n(i) 创建一个新类。（重写该类）\n(ii) 扩展该类。\n\n在大多数情况下，第二种方案是更好的选择。在这种情况下，我们只需要编写一小段代码。同时，我们不需要花费大量时间进行调试和测试，因为基类已经经过过测试并且运行了长时间。当我们需要将一个类继承到另一个类时，必须使用\
  \ “extends” 关键字。\n\n**语法：** `class sub_class extends base_class`\n\n![image](img/image087.png)\n\
  \n类 A（超类或基类或父类）。\n类 B（子类或派生类或子类）。\n\n子类将拥有基类的所有特征，外加上扩展类中定义的新特征。Java 不支持多重继承，但它支持多接口继承，因此子类只能扩展一个基类。\n\
  \n**示例 6.1：**\n\n```java\n1. class A\n2. {\n3.    int x;\n4.    void setX(int x1)\n\
  5.    {\n6.    x = x1;\n7.    }\n8.    void displayX()\n9.    {\n10.    System.out.println(x);\n\
  11.   }\n12. }\n13. class B extends A\n14. {\n15.    int y;\n16.    void setY(int\
  \ y1)\n17.    {\n18.        y = y1;\n19.    }\n20.    void displayY()\n21.    {\n\
  22.        System.out.println(y);\n23.    }\n24. }\n25. class InheritTest\n26. {\n\
  27.    public static void main(String args[])\n28.    {\n29.        A a1 = new A();\n\
  30.        a1.setX(5);\n31.        a1.displayX();\n32.        B b1 = new B();\n\
  33.        b1.setX(10);\n34.        b1.setY(20);\n35.        b1.displayX();\n36.\
  \        b1.displayY();\n37.    }\n38. }\n```\n\n**输出：**\n5\n10\n20\n\n### 成员隐藏\n\
  \n如果子类成员与父类成员具有相同的名称（方法时具有相同的签名），那么它会隐藏父类成员。虽然两个成员在子类中都可用，但使用成员名称只能访问子类成员。\n\n###\
  \ 使用 super 关键字\n\n每当子类需要引用其直接父类时，可以通过 `super` 关键字来实现。`super` 有两种通用用途：\n\n1. 调用父类的构造函数：子类可以通过以下形式\
  \ `super(parameter-list)` 调用其父类定义的构造器方法；这里 `parameter-list` 指定了父类构造器所需的任何参数。事实上，`super()`\
  \ 必须是子类构造器内部执行的第一条语句。\n\n2. 访问被子类成员隐藏的父类成员：可以使用以下形式 `super.member` 来访问父类的被隐藏成员；这里\
  \ `member` 既可以是方法，也可以是数据成员。\n\n### 方法重载与方法重写\n\n### 方法重载\n当两个或多个方法具有相同名称但参数不同时，被称为方法重载。方法重载用于对象需要执行相似任务但使用不同输入参数。当我们调用方法时，Java\
  \ 首先匹配方法名，然后匹配参数的数量和类型。决定调用哪一个方法定义的过程被称为多态。\n\n#### 方法重写\n我们已经看到父类中的方法会被子类继承，并被子类创建的对象使用。方法继承允许我们在子类中重复定义和使用方法，而无需在子类中再次定义它。在类层次结构中，当子类中的实例方法与其父类中的非私有实例方法具有相同的名称签名时，子类中的方法被称为重写了父类中的方法。当在子类内部调用重写的方法时，它将始终引用子类定义的该版本。\n\
  \n父类定义的方法版本将被隐藏。\n\n\n\n\n\n![C:\\Users\\Made Man Harry\\Desktop\\Stars\\black_star_logo.jpg](img/image080.jpg)\n\
  \n### 示例 6.2\n\n```java\nclass A\n{\n    int x;\n    void set(int x1)\n    {\n \
  \       x = x1;\n    }\n    void display()\n    {\n        System.out.println(x);\n\
  \    }\n}\nclass B extends A\n{\n    int y;\n    void set(int x1,int y1) // 因为参数不同，类\
  \ B 的 set 方法没有重写类 A\n     的 set 方法\n    {\n        set(x1);  //这将调用类 A 的 set()\n\
  \        y = y1;\n    }\n    void display() // 类 B 的 display 方法重写了类 A\n    // 的\
  \ display 方法\n    {\n        //  display();  这将调用类 B 的 display\n        super.display();\
  \ // 这将调用类 A 的 display\n        System.out.println(y);\n    }\n}\nclass InheritTest2\n\
  {\n    public static void main(String args[])\n    {\n        B b1 = new B();\n\
  \        b1.set(10,20);\n        b1.display();\n    }\n}\n```\n\n输出:\n```\n10\n\
  20\n```\n\nJava 支持以下继承形式：\n\n[1] 单继承。\n[2] 多级继承。\n[3] 层级继承。\n\n### [1] 单继承。\n\n\
  ![image](img/image042.png)\n\n### 示例 6.3\n\n```java\nclass A\n{\n    private int\
  \ x;\n    A()\n    {\n        x = 0;\n    }\n    A(int x1)\n    {\n        x = x1;\n\
  \    }\n    void display()\n    {\n        System.out.print(x);\n    }\n}\nclass\
  \ B extends A\n{\n    private int y;\n    B()\n    {\n        super();\n       \
  \ //x=0;  因为 x 是私有的，此处报错\n        y=0;\n    }\n    B(int x1, int y1)\n    {\n  \
  \      super(x1);\n        //x = x1; //因为 x 是私有的，此处报错\n        y = y1;\n    }\n\
  \    void display()\n    {\n        super.display();\n        System.out.print(y);\n\
  \    }\n}\nclass InheritTest3\n{\n    public static void main(String args[])\n \
  \   {\n        B b1 = new B();\n        b1.display();\n        B b2 = new B(10,20);\n\
  \        b2.display();\n    }\n}\n```\n\n输出:\n```\n0 0 10 20\n```\n\n---\n\n###\
  \ [2] 多级继承。\n\n![image](img/image018.png)\n\n---\n\n![C:\\Users\\Made Man Harry\\\
