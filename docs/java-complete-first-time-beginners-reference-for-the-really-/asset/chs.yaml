  \ c = s.getClass();\n      Method m[] = c.getMethods();\n      System.out.println(\"\
  ......Public Methods (\" + m.length + \")......\");\n      for(int i=0; i < m.length;\
  \ i++)\n        System.out.println(m[i]);\n      Field f[] = c.getFields();\n  \
