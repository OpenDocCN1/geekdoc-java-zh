  `Hashtable` 还定义了遗留方法：\n\n| 方法 |  |\n| :--- | :--- |\n| `void clear()` | 清空此哈希表，使其不包含任何键。\
  \ |\n| `Object clone()` | 创建此哈希表的浅拷贝。 |\n| `boolean contains(Object value)` | 测试此哈希表中某个键映射到指定的值。\
  \ |\n| `boolean containsKey(Object key)` | 测试指定的对象是否为此哈希表中的键。 |\n| `boolean containsValue(Object\
  \ value)` | 如果此 `Hashtable` 将一个或多个键映射到此值，则返回 true。 |\n| `Enumeration elements()`\
  \ | 返回此哈希表中所有值的枚举。 |\n| `Set entrySet()` | 返回此 `Hashtable` 中包含的项的 `Set` 视图。 |\n\
  | `boolean equals(Object o)` | 将指定的 `Object` 与此映射进行等值比较。 |\n| `Object get(Object\
  \ key)` | 返回此哈希表中指定的键映射的值。 |\n| `int hashCode()` | 根据 `Map` 接口中的定义返回此 `Map` 的哈希值。\
  \ |\n| `boolean isEmpty()` | 测试此哈希表是否没有键映射到值。 |\n| `Enumeration keys()` | 返回此哈希表中所有键的枚举。\
  \ |\n| `Set keySet()` | 返回此哈希表中包含的键的 `Set` 视图。 |\n| `Object put(Object key, Object\
  \ value)` | 将指定的键映射到此哈希表的指定的值。 |\n| `void putAll(Map m)` | 将指定的 `Map` 中的所有映射复制到此\
  \ `Hashtable`；这些映射将替换此 `Hashtable` 对指定 `Map` 中当前任何键的现有映射。 |\n| `Protected void rehash()`\
  \ | 增加哈希表的大小并重新哈希所有键。 |\n| `Object remove(Object key)` | 从此哈希表中移除键（及其对应的值）。 |\n\
  | `int size()` | 返回此哈希表中的项（不同键）的数量。 |\n| `String toString()` | 返回此哈希表对象的字符串表示，形式为一组项，包含在大括号中并用\
  \ ASCII 字符“,”（逗号和空格）分隔。 |\n| `Collection values()` | 返回此 `Hashtable` 中包含的值的集合。 |\n\
  \n### 示例 21.10:\n\n以下示例使用 `Hashtable` 存储存款人的姓名及其当前余额。\n\n```java\nimport java.util.*;\n\
  class HashtableTest\n{\n    public static void main(String args[])\n    {\n    \
  \    Hashtable<String,Integer> ht=new Hashtable<String,Integer>();\n        ht.put(\"\
  C\",1000);\n        ht.put(\"Java\",1500);\n        ht.put(\"Vb\",1500);\n     \
  \   // 使用 Enumeration 显示列表\n        Enumeration<String> courses;\n        courses=ht.keys();\n\
  \        while(courses.hasMoreElements())\n        {\n            String s1=courses.nextElement();\n\
  \            System.out.println(\"Course= \" + s1 + \" Fees= \" + ht.get(s1));\n\
  \        }\n        // 使用 for each 显示列表\n        Set s=ht.keySet();\n        for(Object\
  \ ob:s)\n            System.out.println(\"Course= \" + (String)ob  + \" Fees= \"\
  \ + ht.get((String)ob));\n        Integer fees=ht.get(\"Java\");\n        ht.put(\"\
  Java\",fees+1000);\n        System.out.println(\"After Update \");\n        // 使用\
  \ Iterator 显示列表\n        Iterator itr=s.iterator();\n        while(itr.hasNext())\n\
  \        {\n            String s1=(String)itr.next();\n            System.out.println(\"\
  Course= \" + s1 + \"Fees= \" +ht.get(s1));\n        }\n    }\n}\n```\n\n**输出:**\n\
  ```\nCourse= Java Fees= 1500\nCourse= Vb Fees= 1500\nCourse= C Fees= 1000\n```\n\
  \n### Properties 类\n\n`Properties` 是 `Hashtable` 的子类。它用于维护键和值均为 `String` 类型的键值对。\n\
  \n### 构造函数:\n- `Properties()`：创建一个空的属性列表。\n- `Properties(Properties defaults)`：创建一个带有默认值的空属性列表。\n\
  \n### 方法:\n- `getProperty(String key)`：返回与键相关联的值，如果不存在关联则返回 null。\n- `getProperty(String\
  \ key, String defaultValue)`：返回与键相关联的值，如果不存在关联则返回 `defaultValue`。\n- `setProperty(String\
  \ key, String value)`：设置具有指定值的的属性。\n- `remove(String key)`：移除具有指定键的属性。\n- `list(PrintWriter\
  \ out)`：以适用于加载的格式打印此属性列表。\n- `store(OutputStream out, String comments)`：将此属性列表（键值对）写入输出流。\n\
  - `load(InputStream in)`：从输入流中读取属性列表。\n\n### 示例 21.11:\n\n以下程序创建了一个属性列表，其中键为课程名，值为时长。\n\
  \n```java\nimport java.util.*;\nclass PropertiesTest\n{\n    public static void\
  \ main(String args[])\n    {\n        Properties def=new Properties();\n       \
  \ def.put(\"C\",\"2 months\");\n        def.put(\"C++\",\"3 months\");\n       \
  \ Properties courses=new Properties(def);\n        courses.put(\"Java\",\"4 months\"\
  );\n        courses.put(\"Dot Net\",\"6 months\");\n        System.out.println(\"\
  Duration of Java is \" + courses.getProperty(\"Java\",\"Not Found\"));\n       \
  \ System.out.println(\"Duration of C is \" + courses.getProperty(\"C\",\"Not Found\"\
  ));\n        System.out.println(\"Duration of VB is \" + courses.getProperty(\"\
  VB\",\"Not Found\"));\n        System.out.println(\"List of all Courses:-\");\n\
  \        Set s=courses.keySet();\n        for(Object ob:s)\n          {\n      \
  \      System.out.println(\"Duration of Course \" + (String)ob + \" is \" + courses.getProperty((String)ob,\"\
  not found\"));\n          }\n        Iterator itr = s.iterator();\n        while(itr.hasNext())\n\
  \        {\n            String s1=(String)itr.next();\n            System.out.println(\"\
  Duration of Course \" + s1 + \" is \" + courses.getProperty(s1,\"Not Found\"));\n\
  \        }\n    }\n}\n```\n\n**输出:**\n```\nDuration of Java is 4 months\nDuration\
  \ of C is 2 months\nDuration of VB is Not Found\nList of all Courses:-\nDuration\
  \ of Course Java is 4 months\nDuration of Course C++ is 3 months\nDuration of Course\
  \ Dot Net is 6 months\n```\n\n\n\n`Properties` 最实用的特性之一是 `Properties` 对象中包含的信息可以通过\
  \ `store()` 和 `load()` 轻松地存储到磁盘或从磁盘加载。\n\n任何时候，你都可以将 `Properties` 对象写入流或将其读回。这使得属性列表在实现简单数据库时变得特别方便。\n\
  \n例如，以下程序使用属性列表创建一个存储姓名和电话号码的简单电话簿。要查找某人的号码，只需输入其姓名。\n\n该程序使用 `store()` 和 `load()`\
  \ 方法来存储和检索列表。当程序执行时，它首先尝试从名为 `phonebook.dat` 的文件中加载列表。如果该文件存在，则加载列表。你可以向列表中添加内容。\n\
