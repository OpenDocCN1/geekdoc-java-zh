  \n---\n\n### [3] 层级继承。\n\n![image](img/image012.png)\n\n### 构造函数的调用顺序：\n\n当创建一个类层次结构时，构成该层次结构的各个类的构造函数按什么顺序被调用？答案是：在类层次结构中，构造函数是按照派生顺序、从父类到子类调用的。\n\
  \n此外，由于 `super()` 必须是子类构造函数中执行的第一条语句；无论是否使用 `super()`，这种顺序都是相同的。如果不使用 `super()`，则执行每个父类的默认构造函数或无参数构造函数。\n\
  \n构造函数按照派生顺序执行。因为父类对任何子类无所知，它需要执行的任何初始化都是独立的，并且可能是子类所执行的任何初始化的前决条件。因此，它必须首先执行。\n\
  \n`super` 关键字的使用需要满足以下条件：\n\n- `super()` 构造函数只能在子类的构造函数方法内部被调用。\n- 对父类构造函数的调用必须作为子类构造函数的第一条语句。\n\
  - `super` 调用中的参数必须与父类构造函数参数的顺序和类型匹配。\n\n---\n\n#### 动态方法绑定 - (动态方法分派或运行时绑定)：\n\n\
  方法重写构成了 Java 强大概念之一的基础：动态方法分派是在运行时而非编译时解析对被重写实例方法调用解析的机制。动态方法分派非常重要，因为这是 Java 实现运行时多态的方式。\n\
  \n父类引用变量可以指向子类对象。Java 利用这一事实在运行时解析对被重写方法的调用。当通过父类引用调用重写方法时，Java 会根据调用时指向的对象类型来确定执行该方法的哪个版本。\n\
  \n因此，这种确定是在运行时进行的，此时不同类型的对象指向不同的方法版本。\n\n![C:\\Users\\Made Man Harry\\Desktop\\\
  Stars\\black_star_logo.jpg](img/image039.jpg)\n\n### 示例 6.5\n\n```java\nclass Shape\n\
  {\n    void getdata()\n    {\n        System.out.println(\"getdata() Shape\");\n\
  \    }\n    void area()\n    {\n        System.out.println(\"area() Shape\");\n\
  \    }\n    void display()\n    {\n        System.out.println(\"display() Shape\"\
  );\n    }\n}\nclass Circle extends Shape\n{\n    void getdata()\n    {\n       \
  \ System.out.println(\"getdata() Circle\");\n    }\n    void area()\n    {\n   \
  \     System.out.println(\"area() Circle\");\n    }\n    void display()\n    {\n\
  \        System.out.println(\"display() Circle\");\n    }\n}\nclass Rectangle extends\
  \ Shape\n{\n    void getdata()\n    {\n        System.out.println(\"getdata() Rectangle\"\
  );\n    }\n    void area()\n    {\n        System.out.println(\"area() Rectangle\"\
  );\n    }\n    void display()\n    {\n        System.out.println(\"display() Rectangle\"\
  );\n    }\n}\nclass InheritTest5\n{\n    public static void main(String args[])\n\
  \    {\n        //父类引用变量可以接受子类对象\n        //动态绑定\n        Shape s[]={new Circle(),\
  \ new Rectangle()};\n        for(int i=0;i<s.length;i++)\n        {\n          \
  \  s[i].getdata();\n            s[i].area();\n            s[i].display();\n    \
  \    }\n    }\n}\n```\n\n\n\n\n60. }\n\n输出:\n\n`getdata()` of `Circle`\n`area()`\
  \ of `Circle`\n`display()` of `Circle`\n`getdata()` of `Rectangle`\n`area()` of\
  \ `Rectangle`\n`display()` of `Rectangle`\n\n### 抽象类与抽象方法\n\n我们已经看到，通过将方法标记为 `final`，我们可以确保该方法在子类中不会被重定义。Java\
  \ 允许我们做与此完全相反的操作。即我们可以指定某个方法必须在子类中被重定义，从而使重写成为强制性。这是通过在方法定义中使用修关键字 `abstract` 实现的。\n\
  \n在某些情况下，我们想要定义一个父类，它声明了特定抽象的结构，但不提供每个方法的完整实现。\n\n也就是说，有时我们想要创建一个父类，它只定义一个所有子类都共享的通用形式，而将细节留给每个子类来填充。\n\
  \n此类类决定了子类必须实现的方法性质。这种情况发生的一种方式是父类无法为某个方法创建有意义的实现。\n\n要声明抽象方法，请使用以下通用形式：\n\n`abstract\
  \ return_type name (parameter-list);`\n\n没有任何方法体。任何包含一个或多个抽象方法的类也必须声明为抽象类。要声明一个类为\
  \ `abstract`，我们只需要在声明开头的 `class` 关键字前面使用 `abstract` 关键字即可。\n\n抽象类不能创建对象。也就是说，不能使用\
  \ `new` 操作符直接实例化抽象类。这样的对象是无用的，因为抽象类没有完全定义。\n\n此外，我们不能声明抽象构造函数或抽象静态方法。抽象类的任何子类必须实现父类中所有的抽象方法，或者自身也被声明为抽象类。\n\
  \n### 示例 6.6:\n\n```java\nabstract class Shape {\n    abstract void getdata();\n\
  \    abstract void area();\n    abstract void display();\n}\n\nclass Circle extends\
  \ Shape {\n    void getdata() {\n        System.out.println(\"getdata() of Circle\"\
  );\n    }\n    void area() {\n        System.out.println(\"area() of Circle\");\n\
  \    }\n    void display() {\n        System.out.println(\"display() of Circle\"\
  );\n    }\n}\n\nclass Rectangle extends Shape {\n    void getdata() {\n        System.out.println(\"\
  getdata() of Rectangle\");\n    }\n    void area() {\n        System.out.println(\"\
  area() of Rectangle\");\n    }\n    void display() {\n        System.out.println(\"\
  display() of Rectangle\");\n    }\n}\n\nclass InheritTest6 {\n    public static\
  \ void main(String args[]) {\n        //父引用变量可以接受子类对象\n        //动态绑定\n        Shape\
  \ s[]={new Circle(), new Rectangle()};\n        for(int i=0;i<s.length;i++) {\n\
  \            s[i].getdata();\n            s[i].area();\n            s[i].display();\n\
  \        }\n    }\n}\n```\n\n输出:\n\ngetdata() of Circle\narea() of Circle\ndisplay()\
  \ of Circle\ngetdata() of Rectangle\narea() of Rectangle\ndisplay() of Rectangle\n\
  \n### Final 方法\n\n如果我们不希望某个方法被派生类方法重写，那么我们可以将基类方法定义为 `final`。任何重写该方法的尝试都会导致编译时错误。\n\
  \n```java\nclass A {\n    final void method1() {\n        //\n    }\n}\n\nclass\
  \ B extends A {\n    void method1() // error {\n        //\n    }\n}\n```\n\n###\
  \ Final 类\n\n有时出于安全考虑，我们可能希望防止类被进一步子类。不能被子类的类被称为 `final` 类。在 Java 中通过如下使用关键字 `final`\
  \ 实现这一点：\n\n```java\nfinal class A1 {\n    //\n}\n\nclass B extends A // error {\n\
  \    //\n}\n```\n\n任何继承类 `A` 的尝试都会导致错误，编译器将不允许这样做。声明一个类为 `final` 可以防止任何扩展。它还允许一些优化。\n\
  \n### 理论题\n\n1. 什么是继承？\n2. Java 中共有多少种类型？\n3. 默认构造函数和参数构造函数之间有什么区别？\n4. final 类是什么区别？\n\
  5. 什么是父类？\n6. 什么是抽象类？\n7. 编译时绑定和运行时绑定有什么区别？\n8. 方法重载和方法重写有什么区别？\n\n# 第 7 章：面向对象编程\n\
  \n## 引言\n\n面向对象编程 vs 过程过程：\n\n所有程序都由两个元素组成：过程（逻辑）和数据。取决于主要关注的是过程还是数据，可以有两种方法。过程化语言（c,\
  \ FORTRAN, PASCAL, COBOL）侧重于“正在发生什么”（过程），而对“谁受到影响”（数据）性较少。随着程序的变大，过程化方法变得越来越不适用。开发面向对象的编程语言是为了克服过程化语言的局限性。相比之下，面向对象的程序复杂性小得多。\n\
  \n这两种方法的基本区别总结如下：\n\n(i) 面向对象的程序是以数据为中心的，而用过程化语言编写的程序是以过程为中心的。\n(ii) 面向对象的程序围绕数据（即对象）组织，因此能更好地模拟真实世界的对象。\n\
  (iii) 与过程化方法相比，面向对象方法的代码可重用性和扩展性非常高。因此代码量较小。\n(iv) 面向对象的程序更容易维护，因为它们的复杂性较低且较小。\n\
  (v) 面向对象的程序基于自底向上的设计方法，而过程化程序基于自顶向下的设计方法。\n\nJava 基于面向对象范式。Java 几乎是纯的面向对象语言。我们之所以使用“几乎”，是因为\
  \ Java 为了性能也支持原始数据类型。\n\nC++ 不是纯面向对象语言。C++ 是 C 语言的扩展，因此它结合了面向过程和面向对象的方法。\n\n## OOP（面向对象编程）的基本概念\n\
  \n下面是面向对象编程的一些基本元素：\n\n* 抽象\n* 对象和类\n* OOP 三大原则：\n    * 封装\n    * 继承\n    * 多态\n\
  * 持久化\n* 通用性\n* 组合 / 聚合\n\n### 抽象\n\n抽象包括过程化语言在内的任何编程语言的基本元素之一。内置数据类型的概念也是一种抽象。在\
  \ C 语言中使用 `struct` 定义自定义数据类型进一步扩展了这种抽象。\n\n抽象的主要目的是通过隐藏细节来降低复杂性。例如，一栋建筑并不被视为建筑材料的集合，而是一个具有独特特征和属性定义的良好对象。\n\
  \n面向对象编程语言使用类和对象建模抽象。\n\n### 2. 对象和类：\n\n\n\n\n\n# Object\n`object`（对象）是一个物理或抽象的实体或事物，与其他相似类型的对象区分开来。对象具有三个特征：\n\
  \n(i) 标识（Identification）。\n(ii) 属性（Properties / Attributes）。\n(iii) 行为（Behaviors\
  \ / Methods / Operations / Functions）。\n\n对象也可以被 `class`（类）的实例，其中 `class` 类似于内置数据类型，而\
  \ `object` 是 `variable`（变量）。\n\n# Class\n`class`（类）通过抽象对象的属性和行为来表示对象的类别。`class`\
  \ 可以被视为创建对象的蓝图。对象具有由其 `class` 定义的属性和行为。`class` 可以被视为自定义数据类型，而 `object` 是该 `class`\
  \ 所代表的数据类型的 `variable/instance`（变量/实例）。\n\n`object` 的属性/特征是由 `Java` 中的 `data members\
  \ / fields`（数据成员/字段）定义的。`class` 中的 `data member/field` 是一个可以存储数据的 `variable`。对象的行为/操作是使用\
  \ `Java` 中的 `methods`（方法）定义的。`data members` 和 `methods` 统称为 `class` 的 `members`（成员）。\n\
  \n`class` 也可以被视为自定义数据类型，而 `object` 是该数据类型的 `variable`。一旦定义了 `class`，我们就可以创建任意属于该\
  \ `class` 的对象。\n\n# 3. 三 OOP 原 原\n\n### Encapsulation\n`Encapsulation`（封装）是将代码及其对其操作的数据绑定在一起的机制。`Java`\
  \ 类支持这一点，因为它们允许我们将代码和数据定义在一起。`Encapsulation` 还通过将某些 `class members` 声明为 `private`（私有的）来实现数据隐藏，这样它们无法从不属于\
  \ `class` 的代码访问。\n\n## Inheritance\n在面向对象编程中，`Inheritance`（继承）指的是 `class` 的属性对其他被称为\
  \ `sub-classes`（子类）或 `derived classes`（派生类）的类可用。`sub-class` 或 `derived class` 是派自现有\
  \ `class` 的类。它继承了现有类的所有特征，该现有类也被称为 `base-class`（基类）或 `super-class`（超类）。因此，`inheritance`\
  \ 可以定义为从 `super-class` 或 `base-class` 派生类的过程。继承一个 `class` 不会给 `base-class/super-class`\
  \ 引入任何更改。与 `base-class` 相比，`derived-class/sub-class` 具有更多的属性和行为。\n\n`inheritance`\
  \ 主要优势是代码复用。如果 `base class` 使用长时间并且需要添加额外的属性和方法，我们可以通过派生另一个类来实现。`derived class`\
  \ 将能够直接使用 `base class` 的代码而无需调试，因为它已经使用了很长时间。\n\n### Class Hierarchy\n所有派生自同一个 `base\
  \ class` 的类都属于一个家族并形成 `class hierarchy`（类层次结构）。`class hierarchy` 可以与树结构进行比较，其中一个\
  \ `base class` 位于根节点且没有 `super-class`。\n\n所有其他类要么派生自层次结构根部的类，要么派生自其他类（而后者直接或间接派生自根类）。随着我们在树向下移动，添加的特性越来越多。由叶节点表示的类没有任何\
  \ `sub-classes`。\n\n![image](img/image088.png)\n\n## Polymorphism\n`Polymorphism`（多态）是一种允许同一个接口用于一类动作的特性。大多数面向对象的语言在以下情况使用\
  \ `polymorphism`：\n\n*   运算符重载（Operator Overloading）。\n*   方法重载（Method Overloading）。\n\
  *   方法重写（Method Overriding）。\n\n### Operator Overloading\n大多数语言使用这种形式的 `polymorphism`\
  \ 用于内置操作。例如，`C/C++` 或 `Java` 中的所有算术运算符都可以用于许多类型的操作数（`int`, `long`, `float`, `double`\
  \ 等）。因此，相同的加法运算符可以用于两个两个整数以及两个浮点数。\n\n`C++` 允许用户重载内置运算符。例如，我们可以重载算术运算符来处理复数。虽然 `Java`\
  \ 对内置运算符使用了运算符重载，但它不允许用户重载运算符。\n\n### Method Overloading\n此特性允许我们编写多个具有相同名称的方法。`C++`\
  \ 和 `Java` 都具有这一特性。同名的方法（`C++` 中称为 `function`）根据参数（参数）进行区分。重载的方法必须具有不同的参数数量，或者如果参数数量相同，则参数类型必须不同。\n\
  \n如果对重载方法的调用可以在编译时解析，即如果编译器可以决定将调用哪一个重载方法，这被称为 `static binding`（静态绑定），它是编译时多态的示例。\n\
  \n如果对重载方法的调用无法在编译时解析，即如果编译器无法决定将调用哪一个重载方法，则这被称为 `dynamic binding`（动态绑定），它是运行时多态的示例。\n\
  \n通常，`Java` 在运行时解析对重载方法的调用，但在许多情况下，对重载方法的调用是在编译时解析的。\n\n### Method Overriding\n\
  `sub-class` 可以定义一个与 `super class`（父类）相同名称，且具有相同数量和类型的参数。这被称为方法重写（method overriding）。\n\
  \n编译器无法解析对重写方法的调用。`Java` 通常使用 `dynamic binding` 来解析对重写方法的调用，即决策发生在运行时。\n\n## 4.\
  \ Persistence\n某些面向对象的语言允许我们从持久化介质（如辅助存储介质）存储/检索程序的状态。这被称为 `persistence`（持久化）。`Java`\
  \ 允许我们将任何对象存储到持久化介质中并在稍后检索它。如果我们尝试存储对象图顶部的对象，所有引用的对象都会被递归定位并保存。同样，当稍后检索对象时，整个对象图会在内存中正确创建。\n\
  \n例如，通过仅保存树的根就可以保存整个树结构。C++ 不支持这一特性。\n\n## 5. Genericity\n独立于任何特定数据类型定义算法，然后将该算法应用于各种数据类型的概念被称为\
  \ `Genericity`（泛型）。`C++` 使用 `templates`（模板）支持这一特性。`Java` 也通过 `Object` 类支持这一特性，它是\
  \ `Java` 中任何类层次结构的顶端。\n\n例如，使用此特性，我们可以实现一种泛型数据类型栈，因此栈可以存储任何类型的元素。这一特性在很大程度上增加了复用性。\n\
  \n## 6. Composition / Aggregation\n对象可能由其他对象组成。这样的对象被称为组合对象（Composite）或聚合对象（Aggregate）。例如，如果将\
  \ `vehicle` 类的对象定义为由 `Engine`、`Body`、`Axle`、`Seats` 等对象组成的组合对象，这是合适的。\n\n## Inheritance\
  \ v/s Composition\n从现有类派生新类有两种基本机制：继承和组合。`Bus` 类可以通过继承 `vehicle` 类的属性来派生。这里 `Bus`\
  \ 是车辆的一种，除了所有车辆共有的属性和行为外，它还有额外的属性/行为。\n\n换句话说，`Bus` 类与 `vehicle` 类之间是 `is-a`关系，因为我们可以说\
  \ `Bus` 是一辆车辆。\n\n`vehicle` 类本身可能通过组合从许多其他类派生。例如，`vehicle` 类的对象可能由 `Engine`、`Gear\
  \ Box`、`Seats`、`Driver’s Seat Body` 和 `Steering Wheel` 等类的对象组成。\n\n\n\n\n在这种情况下，派生类与表示组合对象各个部分的类之间存在着整体与部分的关系。我们不能说\
  \ `vehicle`（车辆）是一个 `Engine`（引擎）或 `Vehicle` 是一个 `Gear Box`（变速箱），因为 `Vehicle`是由许多部分组成的。\n\
  \n## 超类与子类\n\n通常情况下，一个类的对象也可能是另一个类的对象。矩形显然是一个四边形（正方形、平行边形和梯形也是如此）。因此，可以说类 `Rectangle`\
  \ 继承自类 `Quadrilateral`。在这种语境下，`Quadrilateral` 类是超类，而 `Rectangle` 类是子类。\n\n矩形是四边形的一种特定，但声称四边形是矩形是不正确的（四边形可能是平行边形）。图示了超类和潜在子类的几个简单继承示例。继承通常产生比其超类更多特征的子类，因此超类和子类这两个术语可能会引起混淆。\n\
  \n然而，另一种看待这些术语的方式是完全合的。因为每个子类对象都是其超类的对象，而且一个超类可以有多个子类，所以超类所表示的对象集合通常比该超类的任何子类所表示的对象集合大。\n\
  \n例如，超类 `Vehicle` 以通的方式表示所有车辆，如汽车、卡车、船只、自行车等。然而，子类 `Car` 只代表了世界上所有 `Vehicles` 中的一小部分。继承关系形成了树状的层级结构。\n\
  \n超类与其子类之间存在层级关系。类完全可以独立存在，但只有当一个类被用于继承机制时，它才变成向其他类提供属性和行为的超类，或者是继承这些属性和行为的子类。经常，一个类既是子类也是超类。\n\
  \n| 超类 | 子类 |\n| :--- | :--- |\n| Student (学生) | Graduate student (研究生) Under student\
  \ (本科生) |\n| Shape (形状) | Circle (圆形) Triangle (三角形) Rectangle (矩形) |\n| Loan (贷款)\
  \ | Car Loan (车贷) Home Loan (房贷) Education Loan (教育贷款) |\n| Employee (员工) | Faculty\
  \ Member (教职员工) Staff Member (普通员工) |\n| Account (账户) | Checking Account (支票账户)\
  \ Saving Account (储蓄账户) |\n\n![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)\n\
  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章节\n\n# ∞ 8 ∞\n\n# (包 Packages)\n\n##\
  \ 引言\n\n当我们开发一个项目时，必须将程序拆分为若干个类。为了组织这些类，我们使用 `Packages`（包）。包既是一种命名机制，也是一种可见性控制机制。包是相互关联的类和接口的集合。在包的帮助下，只要类定义在不同的包中，就可以给多个类赋予相同的名称。\n\
  \n单个包不能包含两个同名的类。\n\n`PROGRAMS`（程序）被组织为包的集合。每个包都有自己的一组子包，这有助于防止命名冲突。顶层包只有在被声明为 `public`\
  \ 时，才能在包外部访问。包的命名结构是层级的。包的成员是类、接口类型以及子包。`java` 中的包是一种封装机制，可用于将相关的类、接口和子包分组。\n\n\
  对于小型程序，包可以是未命名的或具有简单的名称，但如果代码要广泛分发，则应该选择唯一的包名。\n\n这可以防止冲突——如果两个开发小组恰好选择了相同的包名，且这些包后来在同一个程序中使用中使用，就会发生冲突。如果我们没有为\
  \ `java` 类指定包，那么该类将成为 Java 默认包的一部分，称为未命名包。但这要求每个类必须具有唯一的名称以避免冲突。\n\n未命名包的示例。\n\n\
  ```java\nclass A\n{\n- - - - - - -\n- - - - - - -\n}\n\nclass A_demo\n{\n    public\
  \ static void main(String args[])\n    {\n- - - - - -\n- - - - - - -\n    }\n}\n\
  ```\n\n## 如何定义包\n\n要创建一个包，请将 `package` 命令作为 Java 源文件的第一条语句。在该文件中声明的任何类都将属于指定的包。`package`\
  \ 语句定义了存储类的命名空间。如果我们省略了 `package` 语句，类名将被放入默认包，该包没有名称，被称为未命名包。\n\n`package` 语句的语法如下：\n\
  \n```java\npackage package_name;\n```\n\nJava 使用文件系统目录来存储包。记住大小是敏感的，且目录名必须与包名完全匹配。多个文件可以包含相同的\
  \ `package` 语句。\n\n语法：\n\n```java\npackage p1;    //包声明\nclass A      //类声明\n{\n\
  - - - - - - -  //类 A 的主体\n- - - - - - -\n}\n```\n\n`package` 是一个关键字。`p1` 是类 `A`\
  \ 存储的包名。\n\n示例 8.1：\n\n```java\n1. package p1;\n2. class A\n3.    {\n4.     public\
  \ static void main(String args[])\n5.      {\n6.        System.out.println(\"First\
  \ Package program.\");\n7.      }\n8.    }\n```\n\n我们假设当前文件夹是 `(c:\\javaprg\\p1>)`。\n\
  \n```bash\nC:\\javaprg\\p1>javac A.java\nC:\\javaprg\\p1>java p1.A\n```\n\n输出：\n\
  First Package program.\n\n注意：如果我们使用 `-d` 参数编译上述程序，会创建一个 `p1` 文件夹，并将 `.class` 文件存放在其中。\n\
  \n```bash\nC:\\javaprg>javac -d . A.java\nC:\\javaprg>java p1.A\n```\n\n在当前目录下创建\
  \ `p1` 文件夹。如果我们使用 `-d c:\\javaprg` 编译，则会在该目录下创建 `p1` 文件夹。\n\n## 导入包\n\n内置类都存储在命名的包中。如果不导入包，必须使用完整的包限定名来引用其中的某些类，这会非常麻烦。通过\
  \ `import` 语句，可以只使用类名来引用。`import` 语句的格式如下：\n\n```java\nimport pkg1;\nimport pkg1.*;\n\
  ```\n\n示例 8.2：\n\n```java\n1.Program to print any numbers using Random of package\n\
  2.//java.util without import statement\n3.class Random1\n4. {\n5.   public static\
  \ void main(String args[])\n6.    {\n7.      java.util.Random r1 = new java.util.Random();\n\
  8.      for(int i=1;i<=10;i++)\n9.      {\n10.       System.out.println(Math.abs(r1.nextInt()));\n\
  11.     }\n12.   }\n13.}\n```\n\n输出：\n686722525\n481996564\n210875677\n386971039\n\
  360473511\n192264117\n393055462\n889442536\n183611219\n320882863\n\n示例 8.3：\n\n\
  ```java\n1.Program to print any 10 random 10random numbers using Random of package\n\
  2.//java.util using import statement\n3.import java.util.Random;\n4.class Random2\n\
  5. {\n6.   public static void main(String args[])\n7.    {\n8.      Random r1 =\
  \ new Random();\n9.      for(int i=1;i<=10;i++)\n10.     {\n11.       System.out.println(Math.abs(r1.nextInt()));\n\
  12.     }\n13.   }\n14.}\n```\n\n输出：\n1588629525\n481996564\n210875677\n386971039\n\
  360473511\n192264117\n393055462\n889442536\n183611219\n320882863\n\n\n\n如果我们从当前文件夹以外的任何文件夹运行上述程序，它将无法运行。Java\
  \ 运行时系统默认使用当前工作目录作为起点。\n\n因此，如果我们的包在当前目录或当前目录的子目录中，它将能被找到。但要从任何其他文件夹运行上述程序，我们必须在命令提示符中使用命令\
  \ `SET CLASSPATH=.;C:\\JAVAPRG` 来设置类路径。`CLASSPATH` 是一个环境变量。我们每次第一次启动计算机时都需要输入此命令。但如果我们将此命令放在\
  \ `我的电脑`➔ `属性` ➔ `高级` ➔ `环境变量` 中，就不需要反复输入此命令了。\n\n我们还可以在不设置 `CLASSPATH` 环境变量的情况下运行程序。这样做请输入：\n\
  \n```bash\njava –classpath c:\\javaprg p1.A\n```\n\n### 注意事项 4: 包的分级结构\n我们可以创建包的层级结构。要做到这一点，只需用点每个包名与其上一个包名隔开。多级包语句的通用形式为：\n\
  \n```java\npackage package_name1[.package_name2][.package_name3];\n```\n\n包的分级结构必须在\
  \ Java 开发系统的文件系统中得到反映。例如，包 `java.awt.Image` 需要存储在 `java\\awt\\image` (WINDOWS) 或\
  \ `java/awt/image` (UNIX) 或 `java:swt:image` (MACINTOSH) 文件系统中。\n\n包的分级结构代表了 `java`\
  \ 类和接口的组织方式。它并不代表类和接口的源代码组织方式。\n\n每个 `java` 源文件（也称为编译单元）可以包含零或多个类和接口定义，但编译器会为每一个定义生成一个包含\
  \ `java` 字节码的独立类文件。类或接口可以使用包声明来指示其 `java` 字节码放在特定的包中。\n\n- 包 `java` 有子包 `awt`、`applet`、`io`、`lang`、`net`\
  \ 和 `util`，但没有包含类或接口。\n- 包 `java.awt` 有名为 `image` 的子包，以及许多类和接口。\n- 因为 `java.awt`\
  \ 包有一个子包 `image`，所以它不能包含名为 `image` 的类或接口类型的声明。\n- 如果包的全限定名为 `P`，且 `Q` 是 `P` 的子包，那么\
  \ `P.Q` 就是该子包的全限定名。\n- 如果有一个名为 `mouse` 的包且该包中有一个成员类 `Button`（这可能被引用为 `mouse.Button`），则不能存在全限定名为\
  \ `mouse.Button` 或 `mouse.Button.Click` 的包。\n- 一个源文件中最多只能出现一个包语句，且它必须是 Java 源文件的第一个语句。\n\
  \n### 类成员的可见性\n类和包都是封装和包含变量及方法命名空间与作用域的手段。包作为类及其他子包的容器。类作为数据和方法代码的容器。\n\n类是 `java`\
  \ 最小的抽象单元。由于类和包之间的相互作用，Java 处理了类成员的五类可见性：\n\n1. 类内部可见性。\n2. 同一包内子类中的可见性。\n3. 同一包内非子类中的可见性。\n\
  4. 不同包的子类中的可见性。\n5. 既不在同一包中也不是子类的子类中的可见性。\n\n**注意 1**：顶层类和接口只有两种可能的访问权限：默认 `default`\
  \ 和 `public`。\n**注意 2**：如果类被声明为 `public`，则可以通过其他代码访问。\n**注意 3**：如果类具有 `default`\
  \ 访问权限，则只能被同一包内的其他代码访问。\n**注意 4**：成员可见性只有在类可见时才有意义。如果类的可见性修饰符为 `default`，那么即使是 `public`\
  \ 成员也仅包内可见。\n\n### 访问修饰符\n![image](img/image085.png)\n\n### JAR 文件（Java 存档文件）\n\
  为了压缩文件，我们使用诸如 `winzip` 等程序，同样的 `java` 的 `JAR` 功能也可以用于压缩整个 `java` 包的层级结构。它提供了更好的安装便利。\n\
  \n不需要在客户位置创建文件结构。我们只需要使用 `JAR` 文件，该文件就会恢复整个文件结构。所有的包、子包和类文件都将从 `JAR` 文件自动创建。\n\n\
  `JAR` 技术使得软件的交付和安装变得简单得多。此外，`JAR` 文件中的元素是压缩的，这使得下载一个 `JAR` 文件比单独下载几个未压缩的文件要快得多。这允许消费者确定这些元素是由特定的组织或个人产生的。\n\
  \n`JAR` 文件有以下可用选项：\n\n| 选项 | 说明 |\n| :--- | :--- |\n| `c` | 创建一个新的存档。 |\n| `C` |\
  \ 在命令执行期间切换目录。 |\n| `f` | 文件列表的第一个元素是待创建的存档名称。 |\n| `i` | 应提供索引信息。 |\n| `m` | 文件列表的第二个元素是外部清单文件（manifest）名称。\
  \ |\n| `M` | 不创建清单文件。 |\n| `t` | 列出存档内容。 |\n| `u` | 更新存档。 |\n| `v` | 工具应提供详细输出。\
  \ |\n| `x` | 从存档中提取文件。 |\n| `o` | 不使用压缩。\n\n#### 创建 JAR 文件\n```bash\nc:\\javaprg>\
  \ jar -cf Myjar.jar pack1\n```\n这将创建一个名为 `Myjar.jar` 的文件，它包含 `pack1` 包的所有文件。\n\n\
  #### 提取 JAR 文件\n```bash\nc:\\javaprg> jar -xf Myjar.jar\n```\n此命令用于提取 `jar` 文件（如\
  \ `unzip`）。\n\n#### 列出 JAR 文件内容\n```bash\nc:\\javaprg> jar -tf Myjar.jar\n```\n\
  以下命令列出 `Myjar.jar` 的内容。\n\n#### 更新 JAR 文件\n```bash\nc:\\javaprg> jar -uf Myjar.jar\
  \ pack1\n```\n该命令对于更新 `jar` 文件有用。\n\n#### 创建可执行 JAR 文件\n```bash\nc:\\javaprg> jar\
  \ -cmf mainClass Myjar.jar pack1\n```\n其中 `mainClass` 是一个包含 `Main-Class: pack1.pack2.pack3.A`\
  \ 的文本文件，保存在 `javaprg` 文件夹中。\n\n#### 执行 JAR 文件\n```bash\nc:\\javaprg> java -jar Myjar.jar\n\
  ```\n\n### 题\n1. 对于包有什么理解？\n2. 解释所有的修饰符及其在不同包和子包与其他类的作用范围。\n3. `JAR` 文件有什么用？\n4.\
  \ `import` 语句有什么用？\n\n\n\n\n嵌套接口是指任何声明位于另一个类或接口体内的接口。顶层接口不是嵌套接口的接口。定义接口的语法与定义类非常相似。接口定义的一般形式如下：\n\
  \n```java\ninterface interface_name\n{\n    variable declarations;\n    methods\
  \ declarations;\n}\n```\n\n在这里，`interface` 是关键字，`interface_name` 是任何有效的 Java 标识符（类似于类名）。\n\
  \n**注意：** 当我们定义一个接口时，默认情况下它是公共（public）且抽象（abstract）的。\n\n### 接口修饰符\n顶层接口唯一可以修饰符是\
  \ `abstract` 和 `public`。即使我们不使用 `abstract` 修饰符，接口也会隐式声明为 `abstract`，因此不需要使用 `abstract`\
  \ 修饰符。顶层接口的可见性可以是包级（package）或公共的（public），就像顶层类一样。如果不使用可见性修饰符，则接口的可见性假设为包级。\n\n###\
  \ 数据变量成员声明\n接口中只能定义常量。接口中的所有变量都是隐式的 `public`、`final` 和 `static`，这意味着它们不能被实现类更改。它们还必须用常量值初始化。\n\
  \n```java\npublic static final type variable_name=value;\n```\n\n在接口中声明的变量是 `public`、`static`\
  \ 和 `final` 的。这意味着它是具有公共访问权限的静态变量。变量还被声明为 `final`，这意味着它在声明时必须赋值，并且之后不能再修改。`final`\
  \ 关键字类似于 C/C++ 中的 `const`。\n\n### 方法声明\n方法声明将仅包含方法列表，而不包含任何方法体语句。它们在参数列表后以分号结束。它们本质上是\
  \ `abstract` 方法，接口中指定的任何方法都不能有默认实现。\n\n接口中的所有方法默认始终是 `public` 和 `abstract` 修饰符的。我们不能在接口中声明\
  \ `static` 方法。\n\n```java\npublic abstract return_type method_name(parameter_list);\n\
  ```\n\n这里是一个包含两个变量和一个方法的接口定义示例：\n\n```java\ninterface item\n{\n    static final\
  \ int code =1001;\n    static final String name = \"Matrix\";\n    abstract void\
  \ display( );\n}\n```\n\n**注意：** 接口中不包含方法的代码，方法声明仅以分号结束。\n\n另一个接口的示例：\n\n```java\n\
  interface area\n{\n    float pi = 3.142f;\n    float compute (float x, float y);\n\
  \    void show( );\n}\n```\n\n### 扩展接口\n像类一样，接口也可以被扩展，即一个接口可以从其他接口派生出来。新接口将继承子接口的所有成员，方式类似于子类。这通过使用\
  \ `extends` 关键字来实现，如下：\n\n```java\ninterface interface_1\n{\n    int code = 1001;\n\
  \    String name = \"Matrix\";\n}\n\ninterface interface_2 extends interface_1\n\
  {\n    void display();\n}\n```\n\n`interface_2` 将继承常量 `code` 和 `name`。\n\n**注意：**\
  \ 变量 `name` 和 `codes` 的声明方式类似于普通变量。这在这里是允许的，但接口中的所有变量都被视为常量、公共且静态的，尽管这里没有使用 `public`、`static`\
  \ 和 `final` 关键字。\n\n我们可以将多个接口合并并在接口中。以下声明是有效的：\n\n```java\ninterface interface_1\n\
  {\n    int code = 1001;\n    String name = \"Matrix\";\n}\n\ninterface interface_2\n\
  {\n    void display();\n}\n\ninterface interface_3 extends interface_1, interface_2\n\
  {\n}\n```\n\n**注意：** 始终记住接口不能扩展类。这违反了接口只能有抽象方法和常量的规则。\n\n### 实现接口\n接口被用作“超类”，其属性被类继承。因此，必须创建一个继承给定接口的类。一旦定义了接口，一个或多个类就可以该接口。\n\
  \n要实现接口，需要在类定义中包含 `implements` 子句，然后创建接口声明的方法。实现类必须提供所有接口中所有方法的方法体，否则必须声明为 `abstract`。实现类还可以扩展一个类并实现多个接口。\n\
  \n```\nmodifier class<class-name> implements<interface-name>\n{\n    body of the\
  \ class\n}\n```\n\n**类中实现接口的语法**\n\n```java\ninterface interface_name\n{\n}\n\n\
  class class _name implements interface_name\n{\n    Body of class\n}\n```\n\nJava\
  \ 不支持多重继承，但它支持多重接口继承，即一个类可以实现多个接口，如下所示：\n\n```\nmodifiers class <class-name> implements\
  \ <interface-1>,<interface-2>,<interface-3>, ....<interface-n>\n{\n    body of class\n\
  }\n```\n\n**注意：** 当我们实现接口方法时，它必须被声明为 `public`。实现接口方法类似于重写（over-riding），所以我们不能降低可见性。\n\
  \n**示例 9.1**\n```java\ninterface interface_1\n{\n    void show(int x);\n}\n\nclass\
  \ class_1 implements interface_1\n{\n    public void show(int x)\n    {\n    }\n\
  }\n```\n\n**抽象类的示例 9.2**\n```java\ninterface common\n{\n    void push(int x);\n\
  \    int pop( );\n}\n\nabstract class stack implements common\n{\n}\n```\n\n\n\n\
  \n\n```java\n30. f3=f2;  //多态（赋值引用）\n31. f3.display(5);\n32. }\n33 }\n```\n输出：\n\
  ![image](img/image072.png)\n\n# 接口的特性 (Characteristics of Interface)\n\n- `Interface`\
  \ 是一个关键字。\n- `Interface` 可以声明为 `abstract`，但它默认就是抽象的，因此不需要添加 `abstract` 关键字。\n- 所有变量始终是\
  \ `public` `static` 且 `final`。\n- `interface` 的所有方法必须在类中实现。\n- 接口类中实现的所有方法必须是 `public`\
  \ 的。\n- `Interface` 仅包含方法的声明。\n- `Interface` 方法不能声明为 `static`。它们始终被声明为实例方法。\n- 类既不能缩小\
  \ `interface` 方法的访问权限，也不能在方法的 `throws` 子句中指定新的异常；因为尝试这样做等同于更改接口契约，这是非法的。重写方法的标准也适用于实现接口方法。\n\
  - 所有方法在实现类中都需要定义为 `public`。\n- 此处允许 `abstract` 关键字允许部分实现。\n- 无论类直接或间接实现了多少接口，它对于可能在接口中具有多个声明的方法只提供单一的实现。\n\
  - 方法原型声明也可以像类一样进行重载。\n- 接口常量可以通过任何客户端（类或接口）使用其完全限定名来访问，无论该客户端是否扩展或实现了该接口。然而，如果客户端是实现此接口的类或扩展了此接口的接口，则该客户端也可以直接访问此类常量，而无需使用完全限定名。此类客户端继承了接口常量。\n\
  - 在接口常量多继承的情况下，任何名称冲突可以使用相关常量的完全限定名来解决。\n\n### 接口变量 (Interface Variables)\n\n`interface`\
  \ 中的所有变量始终是 `public` `static` 和 `final`，因为它们是实现类访问数据类型和方法的公共部分。\n\n## 接口变量的内存管理\
  \ (Memory Management of the Interface Variable)\n\n静态变量在程序加载时总是获取内存，它们占用独立的内存，不与任何对象的内存共享。它们也被称为常量变量。可以使用\
  \ `interface` 名称和 `.` 操作符直接访问。\n\n### 示例 9.4\n\n```java\n1. interface Static_Var\n\
  2. {\n3.   int sun=1;\n4.   int mon=2;\n5.   int tues=3;\n6.   int wed=4;\n7.  \
  \ int thurs=5;\n8.   int fri=6;\n9.   int sat=7;\n10. }\n11. class Week_Day implements\
  \ Static_Var\n12. {\n13.   public static void main(String args[])\n14.   {\n15.\
  \     System.out.println(sun);\n16.     System.out.println(mon);\n17.     System.out.println(tues);\n\
  18.     System.out.println(wed);\n19.     System.out.println(thurs);\n20.     System.out.println(fri);\n\
  21.     System.out.println(sat);\n22.   }\n23. }\n```\n或者\n```java\n11. class Week_Day\n\
  12. {\n13.   public static void main(String args[])\n14.   {\n15.     System.out.println(Static_Var.sun);\n\
  16.     System.out.println(Static_Var.mon);\n17.     System.out.println(Static_Var.tues);\n\
  18.     System.out.println(Static_Var.wed);\n19.     System.out.println(Static_Var.thurs);\n\
  20.     System.out.println(Static_Var.fri);\n21.     System.out.println(Static_Var.sat);\n\
  22.   }\n23. }\n```\n输出：1\n2\n3\n4\n5\n6\n7\n\n### 示例 9.5\n\n```java\n1. interface\
  \ Two_Methods\n2.   {\n3.     void m1( );\n4.     void m2( );\n5.   }\n6. class\
  \ Three_Methods implements Two_methods\n7.   {\n8.     public void m1( )\n9.   \
  \  {\n10.       m1 的方法体;\n11.     }\n12.     public void m2( )\n13.       {\n14.\
  \       m2 的方法体;\n15.     }\n16.     public void m3( )\n17.     {\n18.       m3\
