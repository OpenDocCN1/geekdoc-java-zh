  \n`String getItem(int index)`\n获取与指定的 `index` 关联的项目。\n\n`int getItemCount()`\n获取列表中的项目数量。\n\
  \n`String[] getItems()`\n获取列表中的所有项目。\n\n`int getRows()`\n获取此列表中可见的行数。\n\n`int getSelectedIndex()`\n\
  获取列表中被选中项的索引。\n\n`int[] getSelectedIndexes()`\n获取列表中被选中的索引。\n\n`String getSelectedItem()`\n\
  获取此滚动列表中被选中的项。\n\n`String[] getSelectedItems()`\n获取此滚动列表中被选中的项。\n\n`void remove(int\
  \ position)`\n从此滚动列表中移除指定位置的项目。\n\n`void remove(String item)`\n从列表中移除第一次出现的指定项目。\n\
  \n`void removeAll()`\n移除此列表中的所有项目。\n\n`void replaceItem(String newValue, int index)`\n\
  用新字符串替换滚动列表中指定 `index` 处的项目。\n\n`void select(int index)`\n选中滚动列表中指定索引处的项目。\n\n`void\
