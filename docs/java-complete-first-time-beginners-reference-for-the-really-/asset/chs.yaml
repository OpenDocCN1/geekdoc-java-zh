  tc1.c[0]=0\ntc1.c[1]=1\n```\n\n## 多线程环境中的有用方法\n\n除了上述讨论的方法外，`object` 类通过以下方法为同步代码中的线程通信提供了支持：导致当前线程等待，直到另一个线程对该对象调用了\
  \ `notify()` 方法或 `notifyAll()` 方法。\n\n- 8. `final void wait(long timeout) throws\
  \ InterruptedException`\n- 9. `final void wait(long timeout, long nanos) throws\
  \ InterruptedException`\n\n导致当前线程等待，直到另一个线程对该对象调用了 `notify()` 方法或 `notifyAll()`\
  \ 方法，或者其他线程中断了当前线程，或者指定的时间已到。\n\n- 10. `final void notify()`\n\n唤醒等待该对象监视器（monitor）的单个线程。\n\
  \n- 11. `final void notifyAll( `\n\n唤醒所有等待该对象监视器的线程。线程通过调用其中一个 `wait` 方法在对象的监视器上等待。\n\
  \n线程在它持有的锁对应的对象上调用这些方法。线程等待另一个线程的通知。\n\n# 章节：集合框架 (Collection Framework)\n\n###\
  \ 简介\n`集合框架`（Collection Framework）标准化了程序处理对象组的方式。在 Java2 之前，Java 提供了如 `Vector`、`Stack`、`Dictionary`、`Hashtable`\
  \ 和 `Properties` 等临时类来存储和操作对象。尽管这些类非常有用，但它们缺乏一个中心主题。我们使用 `Vector` 的方式与使用 `Properties`\
  \ 类的方式不同。此外，之前的临时方法并非设计为易于扩展或适应。集合是这些问题的答案。\n\n集合框架的设计考虑了以下目标：\n- 框架必须是高性能的。基础集合（动态数组、链表、树和哈希表）的实现非常高效。\n\
  - 框架必须允许不同类型的集合以类似的方式工作并具有高度的互操作性。易于扩展和适应。\n\n为了实现上述目标，集合框架设计了以下特性：\n- 整个 `Collection`\
  \ 框架围绕一组标准接口设计。提供了若干标准实现。我们也可以实现自己的集合。\n- 集合框架创建的另一个项目是 `Iterator` 接口。`Iterator`\
  \ 为你提供了一种通用的、标准化的方式来一次访问集合中的元素。因此，`Iterator` 提供了一种遍历集合内容的方法。由于每个集合都实现了 `Iterator`，因此任何集合类都可以通过\
  \ `Iterator` 定义的方法进行访问。通过微小的更改，代码就可以遍历一个集合。\n- 除了集合之外，框架还定义了几个 `map` 接口和类。`Maps`\
  \ 存储键/值对。虽然在术语的严格意义上，map 并不是“集合”，但它们与集合完全集成。在集合框架的语言中，我们可以获取 map 的视图。这种视图包含了存储在集合中的元素。因此，对\
  \ `java.util` 包中定义定义的某些原始类进行了重构，以便它们也能集成到新系统中。需要理解的是，虽然集合的加入改变了许多原始工具类的架构，但并没有导致它们过时。集合仅仅提供了一种更好的处理问题的方法。\n\
  \n### 集合接口 (Collection Interfaces)\n集合框架定义了几个接口。具体类提供了标准接口的不同实现。支撑集合的接口是：\n- `Collection`:\
  \ 允许处理一组对象；它是集合层次结构的顶端。\n- `List`: 扩展 `Collection` 以处理序列（对象列表）。\n- `Set`: 扩展 `Collection`\
  \ 以处理集合，集合必须包含唯一元素。\n- `SortedSet`: 扩展 `Collection` 以处理排序集合。\n\n除了集合接口外，集合还使用了 `Comparator`、`Iterator`\
  \ 和 `RandomAccess` 接口。`Comparator` 定义了如何比较对象；`Iterator` 和 `ListIterator` 遍历集合中的对象。实现\
  \ `RandomAccess` 表明列表支持随机访问。为了提供最大的灵活性，接口方法允许修改集合的内容。支持这些方法的集合是可变的。不允许修改内容的集合是不可变的。如果在不可变集合上尝试使用这些方法，将抛出\
  \ `UnsupportedOperationException`。所有内置集合都是可变的。\n\n### 迭代器接口 (Iterator Interface)\n\
  迭代器接口定义了以下方法：\n\n| 类型 | 方法 |\n| :--- | :--- |\n| 布尔 | `hasNext()` 返回迭代是否还有更多元素。\
  \ |\n| 对象 | `next()` 返回迭代的下一个元素。 |\n| void | `remove()` 从集合中移除迭代器返回的最后一个元素（可选操作），如果迭代器不支持此操作则抛出\
  \ `UnsupportedOperationException` |\n\n### 迭代器与枚举的区别在于：\n- 迭代器允许调用者在迭代期间移除集合中的元素，并具有良好的语义。\n\
  - 方法名称得到了改进。\n\n### 列表迭代器接口 (ListIterator Interface)\n它是 `Iterator` 的子接口。\n\n```java\n\
  public interface ListIterator extends Iterator\n```\n\n它是用于列表的迭代器，允许程序员双向遍历列表、在迭代期间修改列表并获取迭代器在列表中的位置。\n\
  \n**方法摘要：**\n\n| 方法 | 描述 |\n| :--- | :--- |\n| void `add(Object obj)` | 将指定的元素插入到列表中（可选操作）。\
  \ |\n| boolean `hasNext()` | 返回当列表迭代器在正向遍历列表时是否有更多元素。 |\n| boolean `hasPrevious()`\
  \ | 返回当列表迭代器在反向遍历列表时是否有更多元素。 |\n| Object `next()` | 返回列表中的下一个元素。 |\n| int `nextIndex()`\
  \ | 返回后续调用 `next()` 将返回的元素的索引。 |\n| Object `previous()` | 返回列表中的上一个元素。 |\n| int\
  \ `previousIndex()` | 返回后续调用 `previous()` 将返回的元素的索引。 |\n| void `remove()` | 从列表中移除由\
  \ `next()` 或 `previous()` 返回的最后一个元素（可选操作）。 |\n\n\n\n\n\n| 方法 | 说明 |\n| :--- | :---\
  \ |\n| `void set(Object obj)` | 用指定的元素替换由 `next` 或 `previous` 返回的最后一个元素（可选操作）。 |\n\
  \n### RandomAccess 接口\n\n这是一个由 `List` 实现类使用的标记接口，用于指示它们支持随机访问。`ArrayList` 和 `Vector`\
  \ 实现了此接口。\n\n### Comparator 接口\n\n比较器（Comparators）用于控制某些数据结构（如 `TreeSet` 或 `TreeMap`）的顺序。\n\
  \n### 方法\n\n| 返回值 | 说明 |\n| :--- | :--- |\n| `Int` | `compare(Object o1,Object o2)`:\
  \ 比较两个参数的顺序。 |\n| `Boolean` | `equal(Object obj)`: 表示某些其他对象是否“等于”此 `Comparator`。\
  \ |\n\n### Collection 接口\n\nCollection 接口是集合框架构建的基础。它声明了所有集合都将具有的核心方法。由于所有集合都实现了\
  \ `collection` 接口，因此熟悉它的方法对于清晰理解该框架是必要的。其中几个方法可能会抛出 `UnsupportedOperationException`。当一个对象与另一个对象不兼容时（例如尝试向集合中添加不兼容的对象时），会生成\
  \ `ClassCastException`。\n\n### Collection 接口中的方法\n\n| 方法 | 说明 |\n| :--- | :--- |\n\
  | `boolean  add(Object obj)` | 确保此集合包含指定的元素（可选操作）。将对象添加到调用的集合中。如果元素 `obj` 已添加到集合中，则返回\
  \ true。如果元素 `obj` 已经是集合的成员且该集合不允许重复，则返回 false。 |\n| `boolean  addAll(Collection\
  \ c)` | 将指定集合中的所有元素添加到此集合中（可选操作）。 |\n| `void clear( )` | 从此集合中移除所有元素（可选操作）。 |\n\
  | `boolean  contain(Object o)` | 如果此集合包含指定的集合，则返回 true。 |\n| `boolean  containAll(Collection\
  \ c)` | 如果此集合包含指定集合中的所有元素，则返回 true。 |\n| `boolean  equal(Object o)` | 将指定的对象与此集合进行等性比较。\
  \ |\n| `int hashCode( )` | 返回此集合的哈希值。 |\n| `boolean  isEmpty( )` | 如果此集合不包含元素，则返回\
  \ true。 |\n| `Iterator iterator( )` | 返回一个用于集合中元素的迭代器。 |\n| `boolean  remove(Object\
  \ o)` | 如果元素存在，则从此集合中移除指定元素的单个实例（可选操作）。 |\n| `boolean  removeAll(Collection c)`\
  \ | 移除所有包含在指定集合中的元素（可选操作）。 |\n| `boolean  retainAll(Collection c)` | 保留此集合中包含在指定集合中的元素（可选操作）。\
  \ |\n| `int size( )` | 返回集合中元素的数量。 |\n| `Object[ ] toArray( )` | 返回一个包含此集合中所有元素的数组。\
  \ |\n\n可以通过调用 `equals()` 方法比较两个集合的等性。“等性”的精确含义可能根据集合的不同而异。\n\n例如，你可以实现 `equals()`\
  \ 以以便它比较存储在集合中的元素值。或者，`equals()` 也可以比较这些元素的引用。\n\n### List 接口\n\nList 是一种有序的集合，称为序列（sequence）。`List`\
  \ 接口扩展了 `Collection` 并声明了存储元素序列的集合的行为。\n\n可以使用从 0 开始的索引通过其在列表中的位置来插入或访问元素。列表可以包含重复元素。除了\
  \ `collection` 定义的方法外，`List` 还定义了一些它自己的方法。\n\n### List 接口中的方法\n\n| 方法 | 说明 |\n|\
  \ :--- | :--- |\n| `boolean add(Object o)` | 将指定的元素添加到此列表的末尾（可选操作）。该方法在 `Collection`\
  \ 接口中定义，但作为 `List` 接口的一部分，它应该实现为始终将元素添加到列表末尾。 |\n| `void add(int index, Object element)`\
  \ | 在列表的指定位置插入指定的元素（可选操作）。插入点处或之后的任何现有元素都会向后移动。因此，没有元素被覆盖。 |\n| `boolean addAll(Collection\
  \ c)` | 按照指定集合 `iterator` 返回的顺序，将指定集合中的所有元素添加到此列表的末尾（可选操作）。该方法在 `Collection` 接口中定义，但作为\
  \ `List` 接口的一部分，它应该实现为始终将元素添加到列表末尾。 |\n| `boolean addAll(int index, Collection c)`\
  \ | 在列表的指定位置将指定集合中的所有元素插入此列表（可选操作）。如果调用的列表发生变化则返回 true，否则返回 false。 |\n| `boolean\
  \ addAll(int index, Collection c)` | 在列表的指定位置将指定集合中的所有元素插入此列表（可选操作）。如果调用的列表发生变化则返回\
  \ true，否则返回 false。 |\n| `Object get(int index)` | 返回列表中指定位置的元素。 |\n| `int indexOf(Object\
  \ o)` | 返回指定元素在列表中首次出现的索引，如果列表不包含该元素，则返回 -1。 |\n| `int lastIndexOf(Object o)` |\
  \ 返回指定元素在列表中最后一次出现的索引，如果列表不包含该元素，则返回 -1。 |\n| `ListIterator iterator( )` | 返回一个此列表元素的列表迭代器（按正确顺序）。\
  \ |\n| `ListIterator iterator(int index)` | 返回一个此列表元素的列表迭代器（按正确顺序），从列表的指定位置开始。 |\n\
  | `Object remove(int index)` | 移除指定位置的元素（可选操作）并返回被删除的元素。结果列表将紧凑。也就是说，后续元素的索引将减一。\
  \ |\n| `Object set(int index, Object element)` | 用指定的元素替换列表中指定位置的元素（可选操作）。 |\n|\
  \ `List subList(int fromIndex, int toIndex)` | 返回一个包含调用列表中从开始到结束-1 处元素的列表。返回的列表中的元素也由调用的对象引用。\
  \ |\n\n注意：如果集合不能修改，这些方法中的几个将将抛出 `UnsupportedOperationException`；且当对象与集合不兼容时，会生成\
  \ `ClassCastException`。\n\n`collection` 定义的 `add(Object o)` 和 `addAll(Collection\
  \ c)` 方法的语义被 `list` 改变，使得它们将元素添加到列表末尾。\n\n### Set 接口\n\n`Set` 接口定义了一个集合。它扩展了 `Collection`\
  \ 并声明了不允许重复元素的集合的行为。\n\n因此，如果尝试向集合中添加重复元素，`add()` 方法将返回 false。它没有定义任何自己的额外方法。\n\n\
  ### SortedSet 接口\n\n`SortedSet` 接口扩展了 `Set` 并声明了升序排列集合的行为。\n\n| 方法 | 说明 |\n| :---\
  \ | :--- |\n| `Comparator comprator( )` | 返回与此排序集合关联的比较器，如果使用其元素的自然排序，则返回 null。\
  \ |\n| `Object first( )` | 返回排序集合中的第一个元素。 |\n| `SortedSet headSet(Object toElement)`\
  \ | 返回此排序集合中严格小于 `toElement` 的元素视图。 |\n| `Object last( )` | 返回排序集合中的最后一个元素。 |\n\
  | `SortedSet subSet(Object fromElement, Object toElement)` | 返回此排序集合中范围从 `fromElement`（包含）到\
  \ `toElement`不包含）的元素视图。 |\n| `SortedSet tailSet(Object fromElement)` | 返回此排序集合中元素大于或等于\
  \ `fromElement` 的元素视图。 |\n\n\n\n\n\n当调用的集合中不包含任何项数组时，某些方法会抛出 `NoSuchElementException`。当对象与集合中的元素不兼容时，会抛出\
  \ `ClassCastException`。如果尝试使用 null 对象且集合不允许 null，则会抛出 `NullPointerException`。\n\n\
  ### 集合类\n\n某些集合类提供了完整的实现，可以直接使用。另一些类是抽象的，提供了骨架实现，用作为创建具体集合的起点。\n\n没有任何集合类是同步版本。\n\
  \n标准的集合类有如下：\n\n| 类 | 描述 |\n| :--- | :--- |\n| `AbstractCollection` | 实现了 `Collection`\
  \ 接口的大部分。 |\n| `AbstractList` | 继承 `AbstractCollection` 并实现了 `List` 接口的大部分。 |\n\
  | `AbstractSequenceList` | 继承 `AbstractList`，用于对元素进行顺序访问而非随机的集合。 |\n| `AbstractSet`\
  \ | 继承 `AbstractCollection` 并实现了 `Set` 接口。 |\n| `LinkedList` | 通过继承 `AbstractSequentialList`\
  \ 实现链表。 |\n| `ArrayList` | 通过继承 `AbstractList` 实现动态数组。它使用元素的随机访问。 |\n| `HashSet`\
  \ | 继承 `AbstractSet` 用于哈希表。 |\n| `LinkedHashSet` | 继承 `HashSet` 以允许按插入顺序迭代。 |\n\
  | `TreeSet` | 继承 `AbstractSet` 并实现 `SortedSet` 接口。它使用二叉搜索树按排序存储元素。 |\n\n**注意**：除了集合类外，一些遗留类（如\
  \ `Vector`、`Stack`、`Hashtable`）已重构以集合。\n\n### 通过 Iterator 和 ListIterator 访问集合\n\n\
  通常，你需要遍历集合中的元素。到目前，最简单的方法是使用迭代器，即实现了 `Iterator` 或 `ListIterator` 接口的对象。\n\n`Iterator`\
  \ 允许你通过遍历集合来获取或移除元素。ListIterator` 扩展了 `Iterator`，允许对列表进行双向遍历并修改元素。\n\n在通过迭代器访问集合之前，你必须先获取它。每个集合类都提供一个\
  \ `iterator()` 方法，返回一个指向集合起始点的迭代器。通过使用该迭代器对象，你可以一次访问集合中的每个元素。\n\n对于实现 `List` 的集合，你还可以通过调用\
  \ `ListIterator` 获取迭代器。列表迭代器允许你以正向或反向方向访问集合，并且你可以修改元素。否则，`ListIterator` 的用法就像 `Iterator`\
  \ 一样。\n\n### ArrayList 类\n\n`ArrayList` 类继承自 `AbstractList` 并实现了 `List` 接口。`ArrayList`\
  \ 支持根据需要增长的动态数组。在 Java 中，标准数组是固定长度的。\n\n数组创建后，它们不能增长或缩小，这意味着我们必须预先知道数组将持有多少元素。但有时，我们在运行时之前不知道数组的大小。为了处理这种情况，集合框架定义了\
  \ `ArrayList`。\n\n`ArrayList` 是一个可变长度的对象引用数组，也就是说，`ArrayList` 的大小可以动态增加或减少。数组列表带有初始大小创建。\n\
  \n当超过容量时，集合会自动扩大；当对象被移除时，数组可能会缩小。使用 J2SE 5 引入的泛型功能可以限制添加到 `ArrayList` 中的元素类型。\n\n\
  **注意**：遗留类 `Vector` 也支持动态数组。\n\n## ArrayList 类的构造函数与方法\n\n| 方法 | 描述 |\n| :--- |\
  \ :--- |\n| `public ArrayList(int capacity)` | 构建一个具有指定初始容量的空列表。当元素被添加到数组列表中时，容量会自动增长。\
  \ |\n| `public ArrayList()` | 构建一个初始容量为十的空列表。 |\n| `public ArrayList(Collection\
  \ c)` | 构建一个包含指定集合中元素的列表。元素按照该集合的 `Iterator` 返回的顺序排列。 |\n| `public void trimToSize()`\
  \ | 反之，如果我们想缩小 `ArrayList` 对象的底层数组的大小，使其恰好等于它当前持有的项数，则调用 `trimToSize()` 方法。 |\n\
  | `public void ensureCapacity(int capacity)` | 虽然 `ArrayList` 对象的容量会随着存储对象的增加而自动增加，但我们可以通过调用\
  \ `ensureCapacity()` 方法手动增加 `ArrayList` 对象的容量。在开始时一次增加其容量，可以防止后续多次重新分配。因为重新分配在时间上是昂贵的，防止不必要的重新分配可以提高性能。\
  \ |\n| `public int size()` | |\n| `public Boolean isEmpty()` | |\n| `public Object\
  \ clone()` | |\n| `public Object[] toArray()` | 在与 `ArrayList` 操作时，从 `ArrayList`\
  \ 获取数组，我们有时想要获取一个包含列表内容的实际数组。我们可以通过调用 `toArray()` 方法来实现。我们可能想要将集合转换为数组的原因有几个，例如：为某些操作获取更快的处理时间；将数组传递给未重载接收集合的方法；或者将我们较新的、基于集合的代码与不理解集合的遗留代码集成。\
  \ |\n| `public Object[] toArray(Object[] aArray)` | |\n| `public Object get(int\
  \ index)` | |\n| `public Object set(int index, Object o)` | |\n| `public boolean\
  \ add(Object o)` | |\n| `public void add(int index, Object o)` | |\n| `public Object\
  \ remove(int index)` | |\n| `public boolean remove(Object o)` | |\n| `public void\
  \ clear()` | |\n| `public boolean addAll(Collection c)` | |\n| `public boolean addAll(int\
  \ index, Collection c)` | |\n| `public boolean contains(Object o)` | |\n| `public\
  \ int indexOf(Object o)` | |\n| `public int lastIndexOf(Object o)` | |\n\n### 示例\
