  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章节\n\n# ∞ 19 ∞\n\n# (在 AWT 中绘图)\n\n###\
  \ 简介\n\n许多类型的 AWT 组件（例如按钮和滚动条）的外观是由底层窗口系统决定的。其他组件类型，特别是 applet、帧（frame）、面板（panel）和画布（canvas），没有内在的外观。如果我们将这些类中的任何类仅仅用作容器，并希望我们的组件看起来有用，那么我们必须提供实现组件外观的代码。\n\
  \n每个组件都关联着一个图形上下文（graphics context）。图形上下文与组件相关的帧缓冲区对应。\n\n我们可以使用 `Graphics` 上下文支持的方法在组件上进行绘图。在\
  \ `Graphics` 上下文中绘制的任何内容都会显示在组件上。\n\n在任何组件上绘图的正确方法是重写它的 `paint()` 方法并提供适当的代码。\n\n\
  `paint()` 方法有一个类型为 `Graphics` 的参数，代表组件的图形上下文。也可以不使用 `paint()` 方法在组件上进行绘图，尽管不推荐这种方法。\n\
  \n### `paint()` 方法与图形上下文\n\n以下示例中关于帧的一个有趣点是，没有显式地调用 `paint()` 方法；该方法只是被提供了出来。环境似乎在正确的时机很好地调用了\
  \ `paint()`。\n\n在组件上绘图是通过调用图形上下文来实现的，它是 `Graphics` 类的的一个实例。图形上下文知道如何渲染到单个目标上。`Graphics`\
  \ 上下文可以渲染到的三个介质是：\n\n1. 组件。\n2. 图像。\n3. 打印机。\n\n任何类型的组件都可以与一个图形上下文关联。这种关联是永久的；上下文不能重新分配给新的组件。虽然我们可以使用图形上下文在任何类型的组件上绘图，但对于已经具有外观的组件这样做是不寻的。\n\
  \n按钮、选择框（Choices）、复选框（Checkboxes）、标签、滚动条、文本字段和文本区域通常不需要程序员层级的渲染。大多数情况下，这些组件仅使用继承自组件父类的\
  \ `paint()` 版本。这个版本什么都不做；然而，有四类“空白”组件具有默认外观，除非它们被子类化并赋予 `paint()` 方法，否则它们将显示为空矩形。这四类组件类是：\n\
  \n* `Applet`\n* `Canvas`\n* `Frame`\n* `Panel`\n\n### 示例 19：扩展了 `Frame` 类并重写了 `paint()`\
  \ 方法以改变帧的外观。\n\n```java\n1. import java.awt.*;\n2. public class SimplePaint extends\
  \ Frame\n3. {\n4.     public static void main (String args[])\n5.     {\n6.    \
  \     Frame f=new SimplePaint();\n7.         f.setSize(200,200);\n8.         f.setVisible(true);\n\
  9.     }\n10.    public void paint (Graphics g)\n11.    {\n12.        g.setColor(Color.white);\n\
  13.        g.fillRect(0,0,300,300);\n14.        g.setColor(Color.grey);\n15.   \
  \     g.fillOval(30,30,50,50);\n16.    }\n17. }\n```\n输出：\n![image](img/image051.png)\n\
  \n当我们为子类赋予自己的 `paint()` 方法时，环境会在适当的时间调用该方法并传递适当的 `Graphics` 实例。\n\n### graphics\
  \ 类的操作\n\n`graphics` 类（图形上下文）提供的四大类操作是：\n\n* 选择颜色。\n* 选择字体。\n* 绘制与填充。\n* 裁剪。\n\n\
  #### 选择颜色\n\n通过调用 `setColor()` 方法选择颜色。所需的参数是 `Color` 类的实例。`Color` 类中作为静态 final 变量提供了\
  \ 13 种预定义的颜色（这些变量本身是 `Color` 类的实例，这让某些人感到不安，但 Java 处理此类事情没有问题）。预定义的颜色有于：\n\n1. `Color.black`\n\
  2. `Color.blue`\n3. `Color.cyan`\n4. `Color.darkGray`\n5. `Color.gray`\n6. `Color.green`\n\
  7. `Color.lightGray`\n8. `Color.magenta`\n9. `Color.orange`\n10. `Color.pink`\n\
  11. `Color.red`\n12. `Color.white`\n13. `Color.yellow`\n\n如果我们需要一种不在此列表中的颜色，可以自己构造。`Color`\
  \ 构造函数有几个版本，最简单的是：\n\n`Color(int redLevel, int greenLevel, int blueLevel)`\n\n这三个参数是主色在\
  \ 0 到 255 范围内的强度级。颜色是相加的，这意味着它们的混合方式像光而不是像颜料。\n\n* `new Color(0,0,0)` 黑色（光的缺失）\n\
  * `new Color(255,0,0)` 红色（仅包含红色色调）\n* `new Color(255,255,255)` 白色（所有颜色同时闪烁）\n\n\
  下方的代码片段列出了 `paint()` 方法的第一部分，它将其图形上下文的颜色设置为浅绿色：\n\n```java\npublic void paint(Graphics\
  \ g)\n{\n    Color c= new Color(170,255,170);\n    g.setColor(c);\n}\n```\n在上述代码调用\
  \ `setColor()` 之后，所有的图形将绘制成浅绿色，直到下一次 `setColor()` 调用为止。调用 `setColor(0)` 不改变已经绘制的任何颜色。\n\
  \n#### 选择字体\n\n设置图形上下文的字体就像设置颜色，后续的字符串绘制将使用新字体。在设置字体之前，我们必须创建一个字体。`Font` 类的构造函数如下：\n\
  \n`Font(string fontName, int style, int size)`\n\n第一个参数是字体名称。字体的可用性取决于平台。我们可以通过调用工具包上的\
  \ `getFontList()` 方法获取字符串数组获取可用字体列表：\n\n`String fontNames[]= Toolkit.getDefaultToolkit().getFontList();`\n\
  \n鼓励使用的平台独立的字体名称：\n\n1. \"Serif\"\n2. \"Sansserif\"\n3. \"Monospaced\"\n\n在 JDK\
  \ 的 1.0.X 版本中，它们分别被称为“TimesRoman”、“Helvetica”和“Courier”。\n\n样式参数可以是以下 `int` 常量之一：\n\
  \n1. `Font.PLAIN`\n2. `Font.BOLD`\n3. `Font.ITALIC`\n\n下面的代码片段将图形上下文 `gc` 的字体设置为\
  \ 24 点加粗无衬线：\n\n```java\nFont f =new Font(\"SansSerif\",Font.BOLD,24);\ngc.setFont(f);\n\
  ```\n我们可以通过传递样式的和来指定组合，例如加粗斜体字体：\n\n`Font.BOLD + Font.ITALIC`\n\n#### 绘制与填充\n\n\
  `graphics` 类所有的渲染方法都指定了形状的像素坐标，每个组件都有自己的坐标空间，原点位于组件的左上角，x 向右增加，y 向下增加。下图显示了组件坐标系：\n\
  \n![image](img/image031.png)\n\n`graphics` 类没有提供大量的绘制方法（复杂的渲染由扩展的 API 如 2d、3d 和动画处理）。\n\
  \n我们需要了解的图形上下文类的方法有：\n\n`void drawLine(int x1,int y1, int x2, int y2)` 使用当前颜色在图形上下文坐标系中的点\
  \ (x1,y1) 和 (x2, y2) 之间绘制一条线。\n\n`void drawRect(int x, int y, int width, int height)`\
  \ 绘制指定矩形的轮廓。\n\n`void fillRect (int x, int y, int width, int height)` 填充指定的矩形。\n\
  \n\n\n\n\n| `void drawOval(int x, int y, int width, int height)` | 绘制由指定矩形边界的椭圆轮廓。\
  \ |\n| `void fillOval(int x, int y, int width, int height)` | 用当前颜色填充指定矩形边界的椭圆。椭圆由一个矩形边界框指定。椭圆位于边界框内，并如如下所示，与框的每个侧的中点相切切：要绘制圆形，请使用正方形边界框。请注意，绘画只绘制前景像素，不绘制背景，因此边界框内但椭圆以外的空间保持不变。在这里，`x`\
  \ 和 `y` 是边界框左上角的坐标，`width` 和 `height` 是框的宽度和高度。 |\n| `void drawArc(int x, int y,\
  \ int width, int height, int startAngle, int arcAngle)` | 绘制覆盖指定矩形的圆形或椭圆弧的轮廓。 |\n\
  | `void fillArc(int x, int y, int width, int height, int startangle, int arcangle)`\
  \ | 填充覆盖指定矩形的圆形或椭圆弧。弧是椭圆的一部分。要指定弧，我们首先指定椭圆的边界框，就像使用 `drawOval()` 和 `fillOval()`\
  \ 一样。我们还需要指定弧的起点和终点，这是通过指定起始角度和弧扫过的角度来实现的。填充的弧是由弧本身以及从椭圆中心到弧端点的两个半径围成的区域。 |\n| `void\
  \ drawPolygon(int[]xPoints, int[]yPoints, int nPoints)` | 绘制由 x 和 y 坐标数组定义的封闭多边形。\
  \ |\n| `void fillPolygon (int[] xPoints , int[] yPoints, int nPoints)` | 填充由 x 和\
  \ y 坐标数组定义的封闭多边形。多边形是一个具有任意数量顶点的封闭图形。顶点以两个 int 数组的形式传递给 `drawPolygon()` 和 `fillPolygon()`\
  \ 方法。第一个数组包含顶点的 x 坐标，第二个包含 y 坐标。第三个参数指定顶点的数量。注意：终点与第一个点连接。 |\n| `void drawPolyLine(int[]\
  \ xPoints, int[] yPoints , int nPoints)` | 绘制由 x 和 y 坐标数组定义的系列连接线。折线类似于多边形，但它是开放的而不是封闭的。没有连接最后一个顶点和第一个点的线段。\
  \ |\n| `void drawString(String str, int x, int y)` | 使用此图形上下文当前的字体和颜色绘制指定字符串的文本。`x`、`y`\
  \ 参数指定字符串基线的左边缘。带有降部字母的字符（在大多数字体中为 g, j, p, q 和 y）延伸到基线以下。文本坐标相对于基线这一事实是非常重要的。例如，在简单的文本中，我们可能会尝试在\
  \ (0,0) 处绘制字符串，期望它会出现在空间的左上角。然而，由于基线的存在，我们只能看到字符串的降部字母，这可能意味着什么也看不见。默认情况下，图形上下文使用关联组件的字体，但我们可以通过图形上下文的\
  \ `setFont()` 方法来设置不同的字体。 |\n| `boolean drawImage (Image img, int x, int y, ImageObserver\
  \ observer)` | 绘制当前可用的指定图像。在这里，`im` 是要渲染的图像，`x` 和 `y` 是目标组件内图像左上角的坐标。图像观察者必须是一个实现\
  \ `imageobserver` 接口的对象。图像是矩形像素值集合的离屏表示。Java 的图像支持非常复杂。目前，假设我们通过某种方式获取了图像（即 `java.awt.image`\
  \ 类的实例），我们想要使用特定的图形上下文将其渲染到屏幕上。此的方法是调用图形上下文的 `drawImage()` 方法。 |\n\n### 示例 19.2\n\
  \n此示例说明了如何创建一个图像，然后使用其图形上下文在其上绘制。可以使用 `drawImage()` 方法在 applet 窗口中显示图像。\n\n```java\n\
  import java.awt.*;\nimport java.applet.*;\nimport java.net.URL;\n/*<applet code=\"\
  PaintImage\" width=200 height=100></applet>*/\npublic class PaintImage extends Applet\
  \ { \n    private Image im;\n    public void init() { \n      im = createImage(100,50);\n\
  \      Graphics imgc=im.getGraphics();\n      imgc.setColor(Color.gray);\n     \
  \ imgc.fillRect(0,0,100,50);\n      imgc.setColor(Color.black);\n      imgc.fillOval(0,0,50,40);\n\
  \    }\n    public void paint(Graphics g) {\n      g.drawImage(im,10,10,this);\n\
  \    }\n}\n```\n\n输出：\n![image](img/image03.png)\n\n### 示例 19.3\n\n此示例说明了如何从现有图像创建一个图像对象。然后可以使用\
  \ `drawImage()` 方法在 applet 窗口中显示图像。\n\n```java\nimport java.awt.*;\nimport java.applet.*;\n\
  import java.net.*;\n/*\n<applet code=\"PaintImage\" width=500 height=500>\n</applet>\n\
  */\npublic class PaintImage1 extends Applet {\n    private Image im;\n    public\
  \ void init() {\n      try {\n        im=getImage(new URL(\"file:logo.gif\"));\n\
  \      } catch (URLException e) {\n        System.out.println(e);\n      }\n   \
  \ }\n    public void paint(Graphics g) {\n      g.drawImage(im,10,10,this);\n  \
  \  }\n}\n```\n\n### 裁剪\n\n大多数程序员对图形上下文的调用涉及颜色选择、绘制和填充。不常用的操作是裁剪。裁剪简单地限制图形上下文可以修改的区域。\n\
  \n图形上下文的默认裁剪区域是关联组件的可见区域。当我们调用图形类的 `drawXXX()` 或 `fillXXX()` 方法时，只有位于裁剪区域内的像素会被修改。\n\
  \n#### 示例 19.4\n\n```java\nimport java.awt.*;\nclass Clip extends Frame {\n    public\
  \ static void main(String args[]) { \n      Frame f=new Clip();\n      f.setSize(300,330);\n\
  \      f.setVisible(true);\n    }\n    public void paint(Graphics g) { \n      for(int\
  \ i=0; i<300; i=i+100) {\n        for(int j=30; j<330; j=j+100) { \n          g.fillOval(i,j,100,100);\n\
  \        }\n      }\n    }\n}\n```\n\n输出：\n![image](img/image04.png)\n\n上述程序的 `paint()`\
  \ 方法绘制了一个点状图案。考虑当这是一个大小为 200*200 像素的 applet frame 的 `paint()` 方法时会发生什么。由于计数器一直到\
  \ 500，方法尝试在边界之外绘制。\n\n这不是问题，因为图形上下文的默认裁剪区域与 applet 一致。\n\n要为图形上下文设置矩形裁剪区域，我们可以调用\
  \ `setClip(x,y, width, height)` 方法，传入四个描述所需裁剪框位置和大小的整数。例如，上面的代码可以修改为：\n\n#### 示例\
  \ 19.5\n\n```java\nimport java.awt.*;\nclass Clip2 extends Frame {\n    public static\
  \ void main(String args[]) { \n      Frame f=new Clip2();\n      f.setSize(300,330);\n\
  \      f.setVisible(true);\n    }\n    public void paint(Graphics g) { \n      g.setClip(50,80,200,200);\n\
  \      for(int i=0; i<300; i=i+100) {\n        for(int j=30; j<330; j=j+100) { \n\
  \          g.fillOval(i,j,100,100);\n        }\n      } \n      g.drawString (\"\
  Hello! Kamal\", 50,50);\n    }\n}\n```\n\n\n\n\n\n```java\n21.    g.drawString (\"\
  Bye! Kamal\", 120,150);\n22.    } }\n```\n\n输出：\n\n![image](img/image040.png)\n\n\
  如上所示，现在的绘画被限制在 300 * 300 applet 窗口中心的一个 200 * 200 矩形内。\n\n裁剪（Clipping）本身是一个非常重要的概念。当环境需要修复组件被暴露出的部分时，裁剪也会发挥作用。\n\
  \n### 关于 `paint()` 方法和图形上下文（graphics context）的总结\n\n`Graphics` 上下文专门用于单个组件。要在组件上绘图，我们调用图形上下文的\
  \ `drawXXXX()` 和 `fillXXXX()` 方法。要更改图形操作的颜色或字体，我们分别调用图形上下文的 `setColor()` 或 `setFont()`\
  \ 方法。\n\n### GUI 线程与绘画\n\nJava 运行环境会创建并控制其在后台运行的线程，其中一个线程负责 GUI 管理。\n\nGUI 线程是环境用于接收用户输入事件以及调用需要绘画的组件的\
  \ `paint()` 方法的工具。\n\n对 `paint()` 的调用并不都是由环境生成。Java 程序当然可以自己调用，直接调用或通过 `repaint()`\
  \ 方法间接调用。\n\n也可以使用组件的图形上下文在组件上绘图。在这种方法下，不需要调用 `paint()` 或 `repaint()` 方法。\n\n在组件上绘图的不同方法如下：\n\
  \n(i) 在获取组件的图形上下文后直接绘图。\n(ii) 自发性绘画（由 GUI 线程隐式/自动调用 `paint()` 方法）。\n(iii) 显式调用 `paint()`\
  \ 方法。\n(iv) 显式调用 `repaint()` 方法，然后由其间接调用 `paint()` 方法。\n\n### 在获取组件的图形上下文后直接绘图\n\
  \n由于可以使用 `getGraphics()` 方法获取组件图形上下文的引用，因此人们很容易认为可以从任何方便的方法直接在组件上绘图。通常情况下，这种方法存在严重缺陷。\n\
  \n假设我们有一个 applet，想要在最近一次鼠标点击的位置画一个红点。applet 的其余部分应该是黄色的。假设该 applet 正在处理自己的鼠标事件。我们可能会考虑创建这样的事件处理程序：\n\
  \n示例 19.6：\n\n```java\n1. import java.awt.*;\n2. import java.awt.event.*;\n3. class\
  \ PaintApproach extends Frame implements MouseListener\n4. { \n5.    public static\
  \ void main (String args [])\n6.    { \n7.      PaintApproach f = new PaintApproach\
  \ ( );\n8.       f.setSize (300,300);\n9.      f.addMouseListener(f);\n10.     \
  \ f.setVisible(true);\n11.    }\n12.    public void mouseEntered (MouseEvent e)\
  \   { }\n13.    public void mouseExited (MouseEvent e)   { }\n14.    public void\
  \ mousePressed (MouseEvent e)   { }\n15.    public void mouseReleased (MouseEvent\
  \ e)   { }\n16.    public void mouseClicked (MouseEvent e)  \n17.    { \n18.   \
  \   System.out.println (“Mouse Clicked...”);\n19.      Graphics g = getGraphics\
  \ ( );\n20.      g.setColor(Color.yellow);\n21.      g.fillRect(0,0, getSize().width,\
  \ getSize().height);\n22.      g.setColor (Color.Red);\n23.      g.fillOval (e.getX()\
  \ –10, e.getY()–10,20,20);\n24.    }\n25. } \n```\n\n如果这个 applet 被覆盖后重新暴露，GUI 线程将隐式地调用\
  \ `paint()`。遗憾的是，`paint()` 并不知道在 `mouseClicked()` 方法中绘制的红圆，因此红圆将不会被修复。\n\n所有绘画操作的正确位置是在\
  \ `paint()` 中，或者在从 `paint()` 调用的方法中；这种技术确保了 GUI 线程能够修复暴露损坏。GUI 线程期望 `paint()` 能够在任意时刻正确地重构屏幕。\n\
  \n实现这一点的的一种可能方法是从事件处理程序和其他任意方法中移除所有绘图代码，并将这些代码放入 `paint()` 方法中。\n\n接下来，当某个方法需要绘图时，安排它将所需的绘图描述写入变量，以便这些变量可以被\
  \ `paint()` 方法访问，并被 `paint()` 方法用于执行绘画。\n\n现在，当 `paint()` 方法被调用时（无论是通过我们的通用方法还是通过\
  \ GUI 线程），它都可以绘制原始预期的任何内容。\n\n### 自发性绘画（由 GUI 线程隐式/自动调用 `paint()` 方法）\n\n自发性绘画并不是一个正式术语，但当\
  \ GUI 线程调用 `paint()` 时就会发生。例如，当组件被暴露、恢复最小化或调整大小时。applet 会刷新，是因为 GUI 线程调用了 `paint()`\
  \ 方法以确保组件被正确绘制。这种情况是因为红点是在 `paint()` 方法中绘制的。\n\n### 显式调用 `paint()` 方法\n\n如果在 `paint()`\
  \ 方法以外的方法中执行绘画操作，组件可能不会刷新。通过显式调用 `paint()` 方法，以及当 GUI 线程隐式调用 `paint()` 方法时，红点都会得到修复。这种情况是因为红点是在\
  \ `paint()` 方法中绘制的。\n\n示例 19.7：\n\n上一节中的示例经过修改，使得组件在上述情况下可以得到刷新。这种情况是因为红点是在 `paint()`\
  \ 方法中绘制的。\n\n```java\n1. import java.awt.*;\n2. import java.awt.event.*;\n3. public\
  \ class PaintApproach extends Frame implements MouseListener\n4. { \n5.    int mouseX,\
  \ mouseY;\n6.    public static void main (String arg[])\n7.    { \n8.      PaintApproach\
  \ f = new PaintApproach ( );\n9.      f.setSize (300,300);\n10.      f.addMouseListener(f);\n\
  11.      f.setVisible(true);\n12.    }\n13.    public void mouseEntered (MouseEvent\
  \ e)   { }\n14.    public void mouseExited (MouseEvent e)   { }\n15.    public void\
  \ mousePressed (MouseEvent e)   { }\n16.    public void mouseReleased (MouseEvent\
  \ e)   { }\n17.    public void mouseClicked (MouseEvent e)  \n18.    { \n19.   \
  \   System.out.println (“Mouse Clicked...”);\n20.      mouseX = e.getX();\n21. \
  \     mouseY = e.getY();\n22.      Graphics g = getGraphics ( );\n23.      paint(g);\n\
  24.    }\n25.    public void paint(Graphics g) {\n26.      g.setColor(Color.yellow);\n\
  27.      g.fillRect(0,0, getSize().width, getSize().height);\n28.      g.setColor(Color.Red);\n\
  29.      g.fillOval(mouseX -10, mouseY -10,20,20);\n30.    }\n31. }\n```\n\n\n\n\
  \n\n```java\npublic void paint (Graphics g)\n{ \n  g.setColor (Color.yellow);\n\
  \  g.fillRect(0,0, getSize().width, getSize().height);\n  g.setColor(Color.red);\n\
  \  g.fillOval(mouseX–10,mouseY–10,20,20);\n}\n```\n\n显式地调用 `repaint()` 方法会随后间接地调用\
  \ `paint()` 方法：显式调用 `paint()` 方法可能会导致两个严重问题。\n\n第一个问题是 GUI 线程会根据需要随时调用 `paint()`\
  \ 方法。这发生在需要处理窗口暴露（exposure）时。这可能会导致线程交互问题。\n\n诚率地说，我们将发现即使使用首选方法，我们可能仍然需要处理这些中的某些问题，因为\
  \ `paint()` 方法将使用我们在其他线程中正在修改的数据。然而，如果我们允许只在 GUI 线程中调用 `paint()`，就能将该问题降至最低。\n\n\
  第二个问题是 CPU 使用率问题。考虑以下场景：我们的程序定期接收到通知，要求它持续地用动画的下一帧或类似的移动图形更新显示。\n\n假设绘图工作是复杂且耗时的。如果我们简单地调用整个\
  \ `paint()` 方法，那么当帧触发发生时，我们可能只完成了部分绘图。这将导致我们的程序花费（或尝试花费）所有时间在绘图上。此外，绘图将越来越落后于它应该的位置。\n\
  \n这些问题可以通过处理程序启动绘图的首选方法来简单解决。其核心思想是主程序维护一个数据集，描述应该呈现给用户的绘图内容，但不直接调用绘图程序。\n\n相反，程序请求\
  \ GUI 线程运行绘图程序，其方式大致与该线程处理暴露时所做的方式相同。\n\nGUI 线程使用主程序提供的数据集来决定绘制什么以及如何绘制。\n\n为了支持这种方法，GUI\
  \ 系统提供了一个名为 `repaint()` 方法。该方法定义在 `Component` 类中，因此 GUI 中的任何可见对象都可用。当我们调用此方法时，我们是在向\
  \ GUI 线程发出请求，让它执行绘图系统程序。\n\nGUI 线程会在合理的时间范围内执行操作，尽管这可能会受到其他高优先级线程活动的的限制。这种方法确保了\
  \ GUI 线程与用户线程之间的线程交互降至最低。\n\n当然，我们必须确保在数据处于不一致状态时，GUI 线程绝不会使用我们的数据集。然而，可以使用同步或双缓冲技术非常容易地实现这一点。\n\
  \n这种行为的另一个结果是，无论程序尝试进行多少绘图，系统通常保持与当前帧的同步。这是因为例如，如果在 GUI 线程能够处理第一次调用之前，我们调用了十次 `repaint()`\
  \ 方法，那么结果将只执行一次绘图系统。\n\n因此，在过载的情况下，绘图系统会自动跳过主机 CPU 无法处理的帧。这意味着程序员可以编写代码，在给定平台上可靠地获得最佳可用视频性能，同时在任何其他平台上都能运行得尚可。以下代码实现了这种方案。\n\
  \n### 示例 19.8:\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\npublic\
  \ class PaintApproach2 extends Frame implements MouseListener\n{ \n  int mouseX,\
  \ MouseY;\n  public static void main (String args [])\n  { \n    PaintApproach2\
  \ f = new PaintApproach2();\n    f.setSize (300,300);\n    f.addMouseListener (f);\n\
  \    f.setVisible(true);\n  }\n  public void mouseEntered (MouseEvent e) { }\n \
  \ public void mouseExited (MouseEvent e) { }\n  public void mousePressed (MouseEvent\
  \ e) { }\n  public void mouseReleased (MouseEvent e) { }\n  public void mouseClicked(MouseEvent\
  \ e) \n  { \n    System.out.println (\"Mouse Clicked ...\");\n    mouseX = e.getX();\n\
  \    mouseY = e.getY();\n    repaint();\n  }\n  public void paint (Graphics g)\n\
  \  {\n    g.setColor (Color.white);\n    g.fillRect (0,0,getSize().width, getSize().height);\n\
  \    g.setColor (Color.yellow);\n    g.fillRect (0,0,getSize().width, getSize().height);\n\
  \    g.setColor(Color.red);\n    g.fillOval(mouseX–10,mouseY–10,20,20);\n  }\n}\n\
  ```\n\n注意 `repaint()` 已经替换了 `paint()` 方法。（等待，原文代码中使用了 `repaint()`，但逻辑指的是的是将 `paint`\
  \ 替换为 `repaint`）。根据提供的文本流进行修正：\n\n注意 `repaint()` 已经替换了 `paint()` 方法。（注：提供的文本片段在代码块中存在不一致之处，我保留了文本的逻辑）。\n\
