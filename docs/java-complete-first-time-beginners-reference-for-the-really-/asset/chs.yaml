  \  50\n\n### LinkedList 类\n`LinkedList` 类继承自 `AbstractSequentialList` 并实现了 `List`\
  \ 接口。它提供了一种链表数据结构。\n\n### 构造函数与方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `public LinkedList(\
