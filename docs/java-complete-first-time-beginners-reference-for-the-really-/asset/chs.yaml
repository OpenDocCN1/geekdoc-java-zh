  \n## 引言\n\n### Scanner 类\n这是 Java 在 `JDK1.5-6-7` 版本中新增的一个新类，用于从用户处获取基本数据类型的输入。使用该类获取输入非常简单，我们只需要创建该类的对象并调用特定的方法即可。该类位于\
  \ `java.util` 包中。\n\n| `public java.util.Scanner(java.io.InputStream);` |\n| `public\
  \ java.util.Scanner(java.io.File) throws java.io.FileNotFoundException;` |\n| `public\
  \ java.util.Scanner(java.lang.String);` |\n| `public void close();` |\n| `public\
  \ boolean hasNext();` |\n| `public java.lang.String next();` 输入不包含任何空格的字符串。 |\n\
  | `public java.lang.String nextLine();` 输入可能包含空格的字符串。 |\n| `public boolean hasNextBoolean();`\
  \ |\n| `public boolean nextBoolean();` |\n| `public boolean hasNextByte();` |\n\
  | `public byte nextByte();` |\n| `public boolean hasNextShort();` |\n| `public short\
  \ nextShort();` |\n| `public boolean hasNextInt();` 检查输入缓冲区中的下一个值是否为 int。 |\n| `public\
  \ int nextInt();` 输入一个整数值。 |\n| `public boolean hasNextLong();` |\n| `public long\
  \ nextLong();` |\n| `public boolean hasNextFloat();` |\n| `public float nextFloat();`\
  \ |\n| `public boolean hasNextDouble();` |\n| `public double nextDouble();` |\n\n\
  ### 示例 4.1\n```java\nimport java.util.*;\nclass SumInput\n{\n    public static void\
  \ main(String args[])\n    {\n        Scanner sc=new Scanner(System.in);\n     \
  \   int a,b,sum;\n        System.out.print(\"Enter Ist number\");\n        a = sc.nextInt();\n\
  \        System.out.print(\"Enter 2nd number\");\n        b = sc.nextInt();\n  \
  \      sum = a+b;\n        System.out.println(\"Sum is \" + sum);\n    }\n}\n```\n\
  输出：\n```\nEnter Ist number 45\nEnter 2nd number 55\nSum is 100\n```\n\n## 数组\nJava\
  \ 中的数组是相同类型变量或数据项的有序集合。Java 允许任意维度的数组。Java 数组与 C/C++ 有些不同。我们不能在声明时指定数组的大小。内存分配始终是动态的。Java\
  \ 中的每个数组都被视为一个对象，并有一个特殊的属性 `length`，该属性指定了数组中元素的数量。\n\n### 1. 一维数组\n### 声明\n`type\
  \ array_name[];` // 声明时不进行内存分配。\n或\n`type [] array_name;` \n\n需要注意的是，声明本身并没有真正创建数组。它只是声明了一个可以指向数组对象的引用。\n\
  \n`int a1 [ ], a2 ;`\n`int [ ] a3, a4 ;`\n\n这两处声明将 `a1`、`a3` 和 `a4` 为可以指向 `int`\
  \ 数组的引用变量，但变量 `a2` 不能指向 `int` 数组。它仅仅是一个 `int` 变量。当 `[ ]` 符号紧跟类型时，声明中的所有变量都是数组。否则，`[\
  \ ]` 符号必须紧跟声明中的每一个数组名。\n\n### 使用 `new` 运算符进行内存分配：\n`array_name = new type[SIZE];`\
  \ // `SIZE` 可以是常量或变量。\n\n![image](img/image036.png)\n\n**注意 1**- 数组的所有元素都将自动初始化为零，但为了用不同的值初始化数组，我们可以在声明时直接初始化。数组的声明、内存分配和初始化步骤可以合并为：`int\
  \ a[]={5,7,1};`\n\n**注意 2**- 数组索引从零开始。\n\n**注意 3**- 在 Java 中，所有数组都将分配的大小存储名为 `length`\
  \ 的变量中。我们可以使用属性 `length` 访问数组的长度：“`array_name.length`”。\n\n**注意 4**- `int a[],b[];`\n\
  `a = b = new int[5];`\n在上述步骤中，只有 `new` 创建了一个数组，该数组的引用将被存储。\n\n### 2. 二维数组\n### 声明\n\
  `type array_name[][`\n或\n`type[][] array_name;`\n\n### 内存分配\n`array_name = new type[ROWS][COLUMNS];`\
  \ // `ROWS` 和 `COLUMNS` 可以是常量\n\n到目前为止我们讨论了可以存储值的数组。考虑以下表格，它显示了矩阵的值。每一行代表一个值。\n\n\
  ### 示例 4.4 打印矩阵转置\n```java\nimport java.util.*;\nclass Transpose\n{\n    public\
