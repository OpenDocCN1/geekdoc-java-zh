  \n## FileDialog\n\n此类表示文件打开或文件保存对话框。文件对话框是一个模态对话框，这意味着只要对话框在屏幕上可见，来自对话框父帧的输入将专门重定向到对话框。当用户指定文件或点击取消按钮时，对话框将自动移除。最常用的\
  \ File 对话框构造函数形式如下：\n\n`FileDialog(Frame parent, String title, int mode)`\n\n对话框的父帧是对话框将出现的帧。标题字符串显示在对话框的标题栏中。\n\
  \nmode 应该是以下值之一：\n\n- `FileDialog.LOAD` 或\n- `FileDialog.SAVE`\n\n在用户指定文件后，可以使用以下方法获取文件名或其目录：\n\
  \n`String getDirectory ()`\n获取此文件对话框所选目录。\n\n`String getFile ()`\n获取此文件对话框所选的文件。\n\
  \n### 示例 17.20\n\n```java\n1. import java.awt.*;\n2. public class FileDialogTest\n\
  3. { \n4.   public static void main(String args[])\n5.   { \n6.     Frame f=new\
  \ Frame( ) ;\n7.     f.setLayout(new FlowLayout( ));\n8.     f.setSize(200, 200);\n\
  9.     f.setVisible(true);\n10.    FileDialog fd=new FileDialog (f, “Load file”,\
  \ FileDialog.LOAD);\n11.     fd.setVisible(true);\n12.     System.out.println(fd.getFile());\n\
  13.     System.out.println(fd.getDirectory());\n14.   }\n15. }\n```\n\n## ScrollPane\n\
  \nScrollPane 可以包含单个组件，该组件可能比滚动面板本身更高或更宽。\n\n如果容器组件大于滚动面板，则滚动面板的默认行为是根据需要获取水平和或垂直滚动条。\n\
  \n该类有两个构造函数：\n\n`ScrollPane ()`\n创建一个新的滚动面板容器，其滚动条显示策略为“按需”。\n\n`ScrollPane(int\
  \ scrollbarDisplayPolicy)`\n创建一个具有指定滚动条行为的新滚动面板容器。滚动面板显示策略应该是以下值之一：\n\n- `ScrollPane.SCROLLBARS_AS_NEEDED`\
  \ (默认)\n- `ScrollPane.SCROLLBARS_ALWAYS`\n- `ScrollPane.SCROLLBARS_NEVER`\n\n下方列出的代码创建一个具有默认\
