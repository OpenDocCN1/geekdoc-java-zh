  \n### ByteArrayInputStream\n`ByteArrayInputStream` 包含一个内部的字节缓冲区，可以从流中读取字节。`ByteArrayInputStream`\
  \ 是一个使用字节数组作为源的输入流实现。该类有两个构造函数，每个构造函数都需要一个字节数组来提供数据源。`ByteArrayInputStream` 实现了\
  \ `mark()` 和 `reset()` 方法。但是，如果没有调用过 `mark()`，`reset()` 将流指针置于流的开头。\n\n- `public\
  \ ByteArrayInputStream(byte[])`\n- `public ByteArrayInputStream(byte[], int)`\n\
  - `public synchronized int read()`\n- `public synchronized int read(byte[], int)`\n\
  - `public synchronized long skip(long)`\n- `public synchronized int available()`\n\
  - `public boolean markSupported()`\n- `public void mark(int)`\n- `public synchronized\
  \ reset()`\n- `public void close() throws IOException`\n\n### 示例 15.7\n\n```java\n\
  import java.io.*;\nclass ByteArrayInputStreamTest\n{\n    public static void main(String\
  \ args[]) throws IOException\n    {\n        String s1 = \"abcdefghij\";\n     \
  \   byte b[] = s1.getBytes();\n        ByteArrayInputStream b1 = new ByteArrayInputStream(b);\n\
  \        int a;\n        while((a=b1.read()) != -1)\n        {\n            System.out.print((char)a);\n\
  \        }\n        b1.close();\n    }\n}\n```\n**输出：**\n`ABCDEFGHIJ`\n\n### ByteArrayOutputStream\n\
  `ByteArrayOutputStream` 实现了一个输出流，数据被写入字节数组中。`ByteArrayOutputStream` 是一个使用字节数组作为目的地的输出流实现。缓冲区存储在\
  \ `ByteArrayOutputStream` 的 `buf` 字段中。如果需要，缓冲区的大小将会增大。缓冲区的大小由 `ByteArrayOutputStream`\
  \ 中的 `count` 字段决定。\n\n- `public ByteArrayOutputStream()` 创建一个新的输出流，缓冲区初始大小为 32 字节。\n\
  - `public ByteArrayOutputStream(int size)` 创建一个新的输出流，缓冲区初始大小为指定的 `size`。\n- `public\
  \ synchronized void write(int)` 写入一个字节。\n- `public synchronized void write(byte[]\
  \ b, int off, int len)` 从字节数组 `b` 的偏移量 `off` 开始写入 `len` 个字节。\n- `public synchronized\
  \ void write(byte[] b)` 写入数组 `b` 中的所有字节。\n- `public synchronized int size()` 返回已写入的字节数。\n\
  - `public synchronized byte[] toByteArray()` 返回缓冲区中的字节数组。\n- `public synchronized\
  \ void reset()` 重置缓冲区。\n\n### 示例 15.8\n\n```java\nimport java.io.*;\nclass ByteArrayOutputStreamTest\n\
  {\n    public static void main(String args[]) throws IOException\n    {\n      \
  \  ByteArrayOutputStream b1 = new ByteArrayOutputStream();\n        b1.write('a');\n\
  \        String s1 = \"abcdefijk\";\n        byte arr1[] = s1.getBytes();\n    \
  \    b1.write(arr1);\n        System.out.println(b1); //toString()\n        // 使用\
  \ for 循环显示\n        byte arr2[] = b1.toByteArray();\n        for(int i=0; i<arr2.length;\
  \ i++)\n        {\n            System.out.print((char)arr2[i]);\n        }\n   \
  \     System.out.println();\n        // 使用 for each 循环显示\n        for(int i:arr2)\n\
  \        {\n            System.out.print((char)i);\n        }\n        b1.close();\n\
  \    }\n}\n```\n**输出：****\n\n### CharArrayReader\n`CharArrayReader` 是一个使用字符数组作为源的读取流实现。该类有两个构造函数，每个构造函数都需要一个字符数组来提供数据源。\n\
