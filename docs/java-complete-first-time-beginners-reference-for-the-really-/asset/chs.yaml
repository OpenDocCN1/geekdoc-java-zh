  ### toString()\n如果子类没有重写此方法，它将返回一个对象的文本表示，其格式如下：\n`<类名>@<哈希码>`\n该方法通常被重写用于调试目的。`System.out.println(obj)`\
  \ 会隐式地将其参数转换为文本表示。\n\n## 示例 2.3\n示例演示了如果我们尝试显示 `Box` 类的对象时会发生什么。对象通过类的 `toString`\
  \ 方法转换为文本表示。\n\n```java\nclass Box {\n    double w,h,d;\n    Box(double w, double\
  \ h, double d) {\n        this.w=w; this.h=h; this.d=d;\n    }\n}\nclass ToStringDemo1\
  \ {\n    public static void main(String args[]) {\n        Box b= new Box(10,12,14);\n\
  \        String s=\"Box b:\"+b;\n        System.out.println(b);\n        System.out.println(s);\n\
  \    }\n}\n```\n**输出：**\n```text\nBox@82b41\nBox b:Box@82b41\n```\n\n## 示例 2.4\n\
  示例演示了如果我们在 `Box` 类中重写 `toString()` 方法，那么重写的方法将用于将对象转换为文本表示。\n\n```java\nclass Box\
  \ {\n    double w,h,d;\n    Box(double w, double h, double d) {\n        this.w=w;\
  \ this.h=h; this.d=d;\n    }\n    public String toString() {\n        return \"\
  Dimensions are \"+ w + \" by \"+ h + \" by \" + d + \".\";\n    }\n}\nclass ToStringDemo2\
  \ {\n    public static void main(String args[]) {\n        Box b= new Box(8,11,13);\n\
  \    }\n}\n```\n\n\n\n\n\n```java\n18. String s=\"Box b:\" + b; // 拼接箱对象并调用 toString()\
  \ 方法\n19.System.out.println(b); // 调用 toString() 方法\n20.System.out.println(s);\n\
  21. }\n22. }\n```\nOutput:\n```\nDimension are 8.0 by 11.0 by 13.0\nBox b: Dimension\
  \ are 8.0 by 11.0 by 13.0\n```\n\n### 5. protected void finalize() throws Throwable\n\
  \n它在对象被垃圾收集之前被调用，以便可以进行任何清理工作。然而，`Object` 类中的默认 `finalize()` 方法没有执行任何有用的操作。这可能对于释放非\
  \ Java 资源很有用，但不建议这样做。如果可用内存足够，`finalize()` 方法可能永远不会被调用，在这种情况下，资源可能永远不会释放。\n\n###\
  \ 6. protected Object clone() throws CloneNotSupportedException\n\n通过 `clone()`\
  \ 方法可以创建与当前对象相同（即具有相同状态）的新对象，即复制原始类型值和引用值，这被称为浅克隆。\n\n类可以重写 `clone()` 方法以提供其自己的克隆概念。例如，通过递归克隆组成对象来克隆复合对象被称为深克隆。当重写时，子类中的方法通常声明为\
  \ `public`，以允许任何客户端克隆该类的对象。\n\n如果重写 `clone()` 方法依赖于 `Object` 类中的 `clone()` 方法，则子类必须实现\
  \ `Cloneable` 标记接口以指示其对象可以安全地克隆。否则，`Object` 类中的 `clone()` 方法将抛出检查异常 `CloneNotSupportedException`。\n\
  \n#### 使用 clone() 和 Cloneable 接口\n\n`clone()` 方法会在其调用的对象上生成一个副本。以下是与 `clone()` 方法相关的几个事实：\n\
  \n- 只有实现了 `Cloneable` 接口的类才能被克隆。`Cloneable` 接口没有定义成员。它用于指示一个类允许对对象进行位级拷贝（即克隆体）。\n\
  - 如果你尝试对未实现 `cloneable` 接口类的对象调用 `clone()`，将抛出 `CloneNotSupportedException`。\n-\
  \ `Cloneable` 接口是一个空接口。这种接口被称为标记/标签接口。当创建克隆时，不会调用被克隆对象的构造函数。\n- 克隆体只是原始对象的精确复制。克隆是一个潜在的危险操作，因为它可能导致意外之外的副作用。\n\
  - 例如，如果被克隆的对象包含一个名为 `objRef` 的引用变量，那么在创建克隆时，克隆体中的 `objRef` 将与原始对象中的 `objRef` 指向同一个对象。如果克隆体对\
  \ `objRef` 所向的对象的内容进行更改，那么原始对象的内容也会发生改变。\n\n#### 示例 20.5:\n\n以下示例演示了 `clone()` 方法的使用。`CloneDemo1`\
  \ 类通过 `clone2()` 方法间接调用 `clone()` 方法对 `TestClone1` 类的对象进行克隆。\n\n```java\nclass TestClone1\
  \ implements Cloneable\n{\n    int a;\n    float b;\n    public TestClone1 clone2()\
  \ throws CloneNotSupportedException\n    {\n        return (TestClone1) clone();\n\
  \    }\n}\nclass CloneDemo1\n{\n    public static void main(String a[]) throws CloneNotSupportedException\n\
  \    {\n        TestClone1 tc1 = new TestClone1();\n        TestClone1 tc2;\n  \
  \      tc1.a = 8; tc1.b = 4.5f;\n        tc2 = tc1.clone2();\n        System.out.println(tc2.a);\n\
  \        System.out.println(tc2.b);\n    }\n}\n```\nOutput:\n```\n8\n4.5\n```\n\
  在这里，`clone2()` 方法调用 `Object` 类的 `clone()` 并返回结果。注意，`clone()` 返回的对象必须强制转换为其适当类型，即\
  \ `TestClone1`。\n\n#### 示例 20.6:\n\n在以下示例中，重写了 `clone()` 方法以便从类外部的代码调用它。为了实现这一点，其访问修符必须是\
  \ `public`。\n\n```java\nclass TestClone2 implements Cloneable\n{\n    int a;\n \
  \   float b;\n    public Object clone() throws CloneNotSupportedException\n    {\n\
  \        return super.clone();\n    }\n}\nclass CloneDemo2\n{\n    public static\
  \ void main(String args[]) throws CloneNotSupportedException\n    {\n        TestClone2\
  \ tc1 = new TestClone2();\n        TestClone2 tc2;\n        tc1.a = 8; tc1.b = 4.5f;\n\
  \        tc2 = (TestClone2) tc1.clone();\n        System.out.println(tc2.a + \"\
  \ \" + tc2.b);\n    }\n}\n```\nOutput:\n```\n8 , 4.5\n```\n\n#### 示例 20.7:\n\n在以下示例中，重写了\
  \ `clone()` 方法，使其不使用 `Object` 类的 `clone()` 方法。我们正在编写自己的 `clone()` 方法。\n\n```java\n\
  class TestClone3\n{\n    int a;\n    float b;\n    public Object clone()\n    {\n\
  \        TestClone3 tc = new TestClone3();\n        return tc;\n    }\n}\nclass\
