  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章节\n\n# ∞ 2 ∞\n\n## (Java 语言)\n\n––––––––\n\
  \n## 标记 (Tokens)\n\n最小的独立单元被称为标记，如关键字、标识符、常量、字符串和运算符。\n\nA. 关键字是语言的保留名称，不能用作变量、函数等的名称。\n\
  B. 标识符是指变量、数组、函数、类、接口等等的名称。\nC. 常量/字面量是指程序中不能更改的固定值。\nD. 运算符是在变量和常量上操作的特殊符号，并构成表达式。\n\
  E. 分隔符是用于分隔语句的特殊字符，如 `( )` `{ }` `[ ]` `;` `,` `.`\n\n––––––––\n\n## A. 关键字\n\n\
  `abstract` `continue` `goto` `package` `synchronized`\n`assert` `default` `if` `private`\
  \ `this`\n`boolean` `do` `implements` `protected` `throw`\n`break` `double` `import`\
  \ `public` `throws`\n`byte`\n`byte` `else` `instanceof` `return`\n`char` `extends`\
  \ `int` `try`\n`float` `finally` `long` `volatile`\n`class` `native` `super` `while`\n\
  `case` `new` `switch`\n\n## B. 标识符\n\n标识符是指变量、数组、函数、类、接口等的名称。\n\n## C. 常量/字面量\n\n\
  常量/字面量是指程序中不能更改的固定值。\n\n## D. 运算符\n运算符是在变量和常量上操作的特殊符号，并构成表达式。\n\n## E. 分隔符\n分隔符是用于分隔语句的特殊字符，如\
  \ `( )` `{ }` `[ ]` `;` `,` `.`\n\n\n\n\n- 对于 `int` 类型，除以零或对零取模会导致 `ArithmeticException`（运行时错误），但在浮点数情况下则不会。\n\
  - 当我们对 `int` 应用算术运算符且结果超出 `int` 的范围范围时，额外的高位位将被截断，这个新值将赋值给接收结果的变量；但在浮点类型中，如果溢出，结果将是\
  \ `Infinity` 或 `–Infinity`；如果在下溢的情况下，结果将为 `0`。\n\n### 递增与递减运算符 (`++`, `--`)\n\n\
  这些运算符与 `C`/`C++` 中的相同。\n\n```java\nint a=5,b;\nb = ++a*++a;\nSystem.out.print(b);\
  \    //42\n\na = 5; \nSystem.out.print(++a*++a);  //42\n```\n\n### 关系运算符 (`<`, `>`,\
  \ `<=`, `>=`, `instanceof`)\n\n这些运算符与 `C`/`C++` 中的相同，但 `<`, `<=`, `>`, `>=` 不能应用于布尔类型和引用类型。\n\
  \n### `instanceof` 运算符 `-:`\n\n`instanceof` 运算符用于测试对象的类型。`instanceof` 运算符的通用形式为：\n\
  \n```java\nif(object instanceof type)\n```\n\n在这里，`object` 是一个类的实例，`type` 是一个类类型。如果\
  \ `object` 是指定类型的实例，或者是指定类型任何子类的实例，则 `instanceof` 运算符返回 `true`，否则其结果为 `false`。\n\
  \n### 赋值运算符 (`=`, `+=`, `-=`, `*=`, `/=`, `%=`)\n\n这些运算符与 `C`/`C++` 中的相同。\n\n###\
  \ 等于运算符 (`==`, `!=`)\n\n这些运算符与 `C`/`C++` 中的相同。\n\n### 逻辑运算符 (`&&`, `||`, `!`)\n\n\
  这些运算符与 `C`/`C++` 中的相同。\n\n### 条件运算符 (`? :`)\n\n此运算符与 `C`/`C++` 中的相同。\n\n### 位运算运算符\
  \ (`&`, `|`, `^`, `~`, `<<`, `>>`, `>>>`)\n\n这些运算符与 `C`/`C++` 中的相同，移位运算符除外。移位运算符仅适用于整数类型。\n\
  \n### 左移 (`<<`) 运算符\n\n要获得 `<<` 运算符的结果，左侧操作数的位将根据右侧操作数指定的位数向左移动，右侧的空位将用零填充。左移 `1`\
  \ 等于乘以 `2`。结果的符号可能与左侧操作数的符号不同。这可能是因为符号取决于最左边的位，而该位可能会从 `0` 变为 `1` 或从 `1` 变为 `0`，导致符号改变。\n\
  \n示例 `b = a << 2;`。要获得 `b` 的值，将 `a` 中的位左移 `2` 位，并在右侧两位填充零。\n\n### 右移 (`>>`) 运算符（有符号）\n\
  \n要获得 `>>` 运算符的结果，左侧操作数的位将根据右侧操作数向右移动，左侧的空位将用符号位填充。右移 `1` 等于除以 `2`。此运算符永远不会改变结果的符号，即与左侧操作数的符号相同。\n\
  \n示例 `b = a >> 2;`。要获得 `b` 的值，将 `a` 中的位右移 `2` 位，并在右侧两位填充符号位（如果 `a` 为正则填充 `0`，如果\
  \ `a` 为负则填充 `1`）。\n\n### 零填充右移 (`>>>`) 运算符（无符号）\n\n要获得 `>>>` 运算符的结果，左侧操作数的位将根据右侧操作数向右移动，左侧的空位将用\
  \ `0` 填充。右移 `1` 等于除以 `2`。如果发生了移位，结果将始终为正数，因为最右侧位将变为零。\n\n![black_star_logo](img/image070.jpg)\n\
  ![black_star_logo](img/image070.jpg)\n![black_star_logo](img/image070.jpg)\n\n###\
  \ 运算符优先级:-\n\n| 级 | 运算符 | 描述 | 结合性 |\n| :--- | :--- | :--- | :--- |\n| 1 | `()`\
  \ `[` `]` `.` | 函数调用 下标 直接成员访问 | 从左到右 |\n| 2 | `++` `--` `~` `!` | 递增 递减 位取反 逻辑取反\
  \ | 从右到左 |\n| 3 | `*` `/` `%` | 乘法 除法 取模 | 从左到右 |\n| 4 | `+` `-` | 加法 减法 | 从左到右\
  \ |\n| 5 | `>>>` `>>` `<<` | 无符号右移 有符号右移 左移 零填充填充 | 从左到右 |\n| 6 | `>>=` `<<=` `instanceof`\
  \ | 大于 大于等于 小于 小等于 | 从左到右 |\n| 7 | `==` `!=` | 等于 不等于 | 从左到右 |\n| 8 | `&` | 位与 |\
  \ 从左到右 |\n| 9 | `^` | 位异或 | 从左到右 |\n| 10 | `\\|\\|` | 位或 | 从左到右 |\n| 11 | `&&` |\
  \ 逻辑与 | 从左到右 |\n| 12 | `\\|\\|` | 逻辑或 | 从左到右 |\n| 13 | `? :` | 条件运算符（三元运算符） | 从右到左\
  \ |\n| 14 | `=` `+=` `-=` `*=` `/=` `%=` `&==` `^=` `\\||=` `<<=` `>>=` `>>>=` `&&=`\
  \ `\\|\\|=` | 赋值（复合赋值） | 从左到右 |\n\n| 符号 | 名称 | 目的 |\n| :--- | :--- | :--- |\n| `()`\
  \ | 圆括号 | 用于参数列表 |\n| `[]` | 中括号 | 用于声明数组 |\n| `{}` | 大括号 | 用于代码块 |\n| `.` | 点 |\
  \ 用于访问成员 |\n| `;` | 分号 | 终止语句 |\n| `,` | 逗号 | 分隔标识符 |\n| `:` | 冒 | 用于包名 |\n\n![black_star_logo](img/image070.jpg)\n\
  \n### 数据类型:-\n\nJava 中的数据类型大致分为两类：\n\n### 1. 基本数据类型 / 简单类型\n\nJava 是面向对象的，但基本数据类型不是对象。它们是其他类型的基础。\n\
  \n**数值类型**\n\n*整数类型：*\n- `byte` (1 字节)：范围 `-128` 到 `127`\n- `short` (2 字节)：范围 `-32768`\
  \ 到 `32767`\n- `int` (4 字节)：范围 `-2147483648` 到 `2147483647`\n- `long` (8 字节)：范围\
  \ `-9223372036854775808` 到 `9223372036854775807`\n\n包含 `byte`、`short`、`int` 的表达式会自动转换为\
  \ `int`。\n\n*浮点数类型：*\n- `float` (4 字节)：范围 `1.40129846432481E-45` 到 `3.40282346638528E38`\n\
  - `double` (8 字节)：范围 `4.9E-324` 到 `1.7976931348623157E308`\n\n**布尔类型：** `boolean`\n\
  \n**字符类型：**\n- `char` (2 字节)：范围 `0` 到 `65535`\n\n注意：Unicode 集合的前 128 个字符与 7 位 ASCII\
  \ 字符集相同，前 256 个字符对应扩展 ASCII（8 位 ISO Latin-1）字符集。\n\nJava 字符也可以用于整数表达式。当字符作为整数表达式的一部分时，使用的是\
  \ Unicode 值。\n\n### 2. 非基本数据类型 / 派生类型或引用类型\n\n引用类型也被称为派生类型，因为它们源自基本数据类型。\n\n**类\
  \ (Classes)**\n- 内置/库类\n- 用户定义类\n\n**接口 (Interfaces)**\n- 内置/库接口\n- 用户定义接口\n\n**数组\
  \ (Arrays)**\n数组也被视为对象。\n\n**变量**\n\n变量是存储值的内存的位置名称。在变量中存储值之前，必须先声明变量。\n\n三种变量：\n\
  \n\n\n\n\n# 局部变量\n局部变量用于块或方法内部。局部变量（也称为自动变量）默认不会进行初始化。局部变量在首次使用之前必须显式初始化，否则会出现编译时错误“Variable\
  \ might not have been initialized”（变量可能初始化）。\n\n# 示例\n```java\nint a,b=5;\nif(b>2)\n\
  {\n    a = b;\n}\nSystem.out.print(a);\n```\n在上述程序中，如果 `if` 条件为假，则 `a` 的值未定义，因此编译器将给出错误“Variable\
  \ a might not have been initialized”。\n\n在 Java 中，我们不能在内部块中定义与外部块同名的变量。\n```java\n\
  int a=5;\n{\n    int a=7;  // 错误\n}\n```\n\n# 实例变量\n实例变量用于定义对象的属性或状态。\n\n# 类变量\n\
  类变量用于定义属性/状态，这对于一个类的所有对象都是通用的。\n\n# Math 类的库方法\n注意 - 使用上述方法时，我们必须加上 `Math` 类名。\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `public static double sin(double x)` | 返回弧度角 `x`\
  \ 的正弦 |\n| `public static double cos(double x)` | 返回弧度角 `x` 的余弦 |\n| `public static\
  \ double tan(double x)` | 返回弧度角 `x` 的正切 |\n| `public static double asin(double x)`\
  \ | 返回正弦为 `x` 的角度 |\n| `public static double acos(double x)` | 返回余弦为 `x` 的角度 |\n\
  | `public static double atan(double x)` | 返回正切为 `x` 的角度 |\n| `public static double\
  \ toRadians(double x)` | 将角度 `x` 转换为弧度 |\n| `public static double toDegrees(double\
