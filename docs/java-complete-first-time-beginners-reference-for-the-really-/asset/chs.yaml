  46.        s1.push(600);\n47.      }\n48.      System.out.println(\"显示所有项\");\n\
  49.      s1.disp(); //非接口方法\n50.      System.out.println(\"移除所有项\");\n51.    }\n\
  52.   }\n```\n\n# 章节\n\n# ∞ 10 ∞\n\n# (String 和 StringBuffer)\n\n## 引言\n\n在 java\
  \ 中，字符串是类对象，并使用两个类（即 String 和 StringBuffer）来实现。与 C 字符串相比，Java 字符串更加可靠且可预测。这基本上是因为\
  \ C 语言缺乏边界检查。Java 字符串不是字符数组，也不是 NULL 终止的。通常情况下，Java 不允许将运算符应用于字符串对象。\n\n\n\n\n\n\
  该规则的唯一例外是 `+` 和 `+=` 运算符，它们会拼接两个字符串并产生一个 `String` 对象。在 Java 中，字符数组不被视为字符串。在 Java\
  \ 中，`String` 类被用于执行所有的字符串操作。`String` 类和 `StringBuffer` 类是 `java.lang` 包的一部分。\n\n\
  ### String 类：\n\n```java\nString s1 = new String(\"matrix\");\nString s2 = \"matrix\"\
  ;\nSystem.out.println(s1);\nSystem.out.println(s1.length);\nSystem.out.println(\"\
  matrix\".length);\n```\n\n`String` 在 Java 中具有以下特性：\n\n#### (i) String 是 Java 中的一个对象\n\
  `String` 代表一个字符序列，但与许多将 `String` 实现为字符数组的语言不同，Java 将字符串实现为类型为 `string` 的对象。\n\n\
  `String` 操纵是许多 Java 程序中最常见的部分。将字符串实现为内置对象，使得 Java 能够提供一套完整的功能，使字符串处理变得方便。此外，字符串对象可以通过多种方式构建，以便在需要时轻松获取字符串。\n\
  \n### (ii) String 是不可变的\n`String` 是不可变的，也就是说我们无法在创建后更改该字符串。但是，声明为 `String` 引用的变量可以随时更改以指向其他字符串对象。\n\
  \n我们仍然可以执行所有类型的字符串操作。每当我们一个现有字符串的修改版本时，都会创建一个包含修改内容的新字符串对象。\n\n原始字符串保持不变。使用这种方法是因为固定的、不可变的字符串可以比可变的字符串实现得更高效。\n\
  \n对于那些需要修改字符串的场景，有一个名为 `StringBuffer` 的伴随类，它的对象包含的字符串在创建后是可以被修改的。\n\n#### (iii)\
  \ String 类是 final 的\n`String` 和 `StringBuffer` 类都是 `final` 的。这意味着我们不能在任何类中扩展 `String`\
  \ 类。这允许进行某些优化，以提高常用字符串操作的性能。\n\n### String 类的构造函数与方法：\n\n| No | 方法 | 说明 |\n| :---\
  \ | :--- | :--- |\n| 1 | `public String()` | 初始化一个新创建的 `String` 对象，使其表示空字符序列。`String\
  \ s1 = new String();` |\n| 2 | `public String(String str)` | 初始化一个新创建的 `String`\
  \ 对象，使其表示与参数相同的字符序列；换句话说，新创建的字符串是参数字符串的拷贝。`String s1 = new String(\"Matrix\"); String\
  \ s2 = new String(s1);` 字符串 `s2` 是字符串 `s1` 的拷贝。虽然内容相同但 `s1` 和 `s2` 指向不同的字符串对象。 |\n\
  | 3 | `public String(char ch[])` | 分配一个新的 `String`，使其表示字符数组参数当前包含的字符序列。`char ch[]\
  \ = {'a', 'b', 'c'}; String s1 = new String(ch); //s1 将包含 \"abc\"` |\n| 4 | `public\
  \ String(char value[], int offset, int count)` | 分配一个新的 `String`，包含来自字符数组参数中子数组的字符。`char\
  \ ch[] = {'a', 'b', 'c', 'd', 'e', 'f'}; String s1 = new String(ch,2,3); //s1 将包含\
  \ \"cde\"` |\n| 5 | `public String(int value[], int offset, int count)` | 分配一个新的\
  \ `String`，包含来自整数数组参数子数组的字符，该数组包含字符的 Unicode 。`int a[] = {97, 98, 99, 100, 101,\
  \ 102}; String s1 = new String(a,2,3); //s1 将包含 \"cde\"` |\n| 6 | `public String(byte\
  \ b[], int offset, int count)` | 使用平台的默认字符集解码指定的字节子数组以构造一个新的 `String`。`byte b[]\
  \ = {97, 98, 99, 100, 101, 102}; String s1 = new String(b,2,3); //s1 将包含 \"cde\"\
  ` |\n| 7 | `public String(byte b[])` | 使用平台的默认字符集解码指定的字节数组以构造一个新的 `String`。`byte\
  \ b[] = {97, 98, 99}; String s1 = new String(b); //s1 将包含 \"abc\"` 尽管 Java 的 char\
  \ 类型使用 16 位来表示 Unicode 字符集，但 Internet 上典型的字符串格式使用由 ASCII 字符集构建的 8 位字节数组。由于 8 位 ASCII\
  \ 字符串很常见，`String` 类提供了在给定字节数组时初始化字符串的构造函数。在上述每个构造中，字节到字符的转换都是通过平台的默认字符编码完成的。 |\n\
  | 8 | `public String(StringBuffer)` | |\n| 9 | `public int length()` | 显示字符串的字符个数。\
  \ |\n| 10 | `public boolean isEmpty()` | 如果字符串为空则显示 true，否则显示 false。`String s1 =\
  \ new String(); System.out.println(s1.isEmpty());` |\n| 11 | `public char charAt(int\
  \ index)` | 返回指定索引处的 `char` 值。索引范围从 0 到 `length()–1`。序列的第一个字符位于索引 0，下一个位于索引，以此类推。如果索引无效将抛出\
  \ `StringIndexException`。`String s1 = \"matrix\"; System.out.println(s1.charAt(0));\
  \ // 将打印 \"m\"` |\n| 12 | `public void getChars(int srcBegin, int srcEnd, char[]\
  \ dst, int dstBegin)` | 将字符串中的字符复制到目标数组。要复制的第一个字符位于 `srcBegin`，最后一个字符位于 `srcEnd–1`。该方法可能会抛出\
  \ `ArrayIndexOutOfBoundsException` 和 `StringIndexOutOfBoundsException`。 |\n| 13\
  \ | `public void getBytes(int srcBegin, int srcEnd, byte[] dst, int dstBegin)` |\
  \ |\n| 14 | `public byte[] getBytes()` | 使用默认字符集编码此字符串。该方法在导出不支持 16 位字符的环境时非常有用。\
  \ |\n| 15 | `public boolean equals(Object)` | 将调用字符串与指定的对象比较。仅当参数不为空且是一个 `String`\
  \ 对象并表示相同的字符序列时，结果为 true。 |\n| 16 | `public boolean equalsIgnoreCase(String)` |\
  \ 忽略大小写差异，比较调用字符串。 |\n| 17 | `public int compareTo(String)` | 按字典顺序比较调用字符串与传入的字符串。返回值：`<0`\
  \ 表示调用字符串小于 `str`，`>0` 表示调用字符串大于 `str`，`0` 表示两个字符串相等。 |\n| 18 | `public int compareIgnoreCase(String)`\
  \ | 忽略大小写按字典顺序比较两个字符串。 |\n| 19 | `public boolean regionMatches(int startIndex, String\
  \ str2, int str2StartIndex, int len)` | 测试两个字符串区域是否相等。 |\n| 20 | `public boolean\
  \ regionMatches(Boolean ignoreCase, int startIndex, String str2, int str2StartIndex,\
  \ int len)` | 测试两个字符串区域是否相等。如果 `ignoreCase` 标志为 true，则忽略大小写。 |\n| 21 | `public boolean\
  \ startsWith(String prefix, int startIndex)` | 测试字符串是否从指定的索引开始以指定的前缀开头。如果 `startIndex`\
  \ 越界，该方法不会返回异常而是返回 false。 |\n| 22 | `public boolean startsWith(String)` | 测试字符串是否以指定的前缀开头。\
  \ |\n| 23 | `public boolean endsWith(String suffix)` | 测试字符串是否以指定的后缀结尾。 |\n| 24\
  \ | `public int indexOf(char ch)` | 返回指定字符在字符串中首次出现的索引。 |\n| 25 | `public int indexOf(char\
  \ ch, int fromIndex)` | 返回指定字符在字符串中首次出现的索引，从指定的索引开始搜索。 |\n| 26 | `public int indexOf(String\
  \ str)` | 返回指定的子字符串在字符串中首次出现的索引。 |\n\n\n\n\n\n| 方法 |  |\n| :--- | :--- |\n| `public\
  \ int indexOf(String str, int fromIndex)` | 返回从指定索引开始，在该字符串中指定子字符串首次出现的索引。 |\n|\
  \ `public int lastIndexOf(int ch)` | 返回在该字符串中，指定字符最后一次出现的索引。 |\n| `public int lastIndexOf(int\
  \ ch, int fromIndex)` | 返回从指定索引开始向后查找，在该字符串中，指定字符最后一次出现的索引。 |\n| `public int lastIndexOf(String\
  \ str)` | 返回在该字符串中，指定子字符串最后一次出现的索引。 |\n| `public int lastIndexOf(String str, int\
  \ fromIndex)` | 返回从指定索引开始向后查找，在该字符串中指定子字符串最后一次出现的索引。 |\n| `public String substring(int\
  \ n)` | 返回从第 $n^{th}$ 个字符开始的子字符串 |\n| `public String substring(int n, int m)` |\
  \ 返回从第 $n^{th}$ 个字符到第 $m^{th}$ 个字符（不包括 $m^{th}$）的子字符串 |\n| `public String concat(String\
  \ str)` | 将字符串 `str` 拼接到调用字符串对象的末尾 |\n| `public String replace(char x, char y)`\
  \ | 将 `x` 的所有出现处替换为 `y` |\n| `public String replaceFirst(String, String)` | |\n\
  | `public String replaceAll(String, String)` | |\n| `public String toLowerCase()`\
  \ | 将字符串转换为小写 |\n| `public String toUpperCase()` | 将字符串转换为大写 |\n| `public String\
  \ trim()` | 去除首尾空格 |\n| `public char[] toCharArray()` | 将调用的字符串转换为新的字符数组。提供此函数是为了方便起见，因为可以使用\
  \ `getChars()` 实现相同的结果 |\n| `public static String valueOf(Object p)` | 为参数 p 创建一个字符串对象\
  \ |\n\n### 字符串数组 (String Array)\n\n我们还可以创建并使用包含字符串的数组。\n\n### 示例 10.1\n\n```java\n\
  import java.util.Scanner;\n\nclass StringArrSort\n{\n    public static void main(String\
  \ args[])\n    {\n        Scanner sc=new Scanner(System.in);\n        System.out.print(\"\
  Enter how many names \");\n        int n=sc.nextInt();\n        String s[]=new String[n];\n\
  \        //输入\n        for(int i=0;i<n;i++)\n        {\n            System.out.println(\"\
  Enter name \" + (i+1));\n            s[i]=sc.next();\n        }\n        //排序\n\
  \        for(int i=0;i<n-1;i++)\n            for(int j=i+1;j<n;j++)\n          \
  \      if(s[i].compareTo(s[j]) > 0)\n                {\n                    String\
  \ t=s[i];\n                    s[i]=s[j];\n                    s[j]=t;\n       \
  \         } \n      //输出\n      for(int i=0;i<n;i++)\n            System.out.println(s[i]);\n\
  \    }\n}\n```\n\n### 字符串转换与 toString()\n\n当 Java 在拼接过程中将数据转换为其 `String` 表示形式时，它是通过调用\
  \ `String` 类定义的字符串转换方法 `valueOf()` 的重载版本来实现的。`valueOf()` 是一个静态方法，针对所有简单类型和 `Object`\
  \ 类型进行了重载。\n\n对于简单类型，`valueOf()` 返回一个字符串，其中包含调用时的值的类可读等效值。对于对象，`valueOf()` 会调用对象上的\
  \ `toString()` 方法。\n\n每个类都继承了 `toString()`，因为它是由 `Object` 类定义的。然而，`toString()` 的默认实现很少是充分的。它显示类名，后面紧跟符号“@”，然后是对象\
  \ ID（例如 `Box@ab1342`），这通常没有用处。对于我们创建的大多数重要类，我们希望重写 `toString()` 并提供我们自己的字符串表示。\n\
  \n### 示例 10.2:\n\n```java\nclass A\n{\n    private int x,y;\n    A()\n    {\n  \
  \      x = y = 0;\n    }\n    A(int x1, int y1)\n    {\n        x = x1;\n      \
  \  y = y1;\n    }\n}\nclass ToStringTest\n{\n    public static void main(String\
  \ args[])\n    {\n        A a1 = new A(5,6);\n        System.out.println(a1); //\
  \ 调用了 Object 的 toString()\n        String s1=\"Object a1 is \" + a1; // 对象与字符串拼接\n\
  \        // 再次调用了 Object 的 toString()\n        System.out.println(s1);\n    }\n\
  }\n```\n输出：\n`A@3e25a`\n`Object a1 is A@3e25a`\n\n### 示例 10.3:\n\n```java\nclass\
  \ A\n{\n    private int x,y;\n    A()\n    {\n        x = y = 0;\n    }\n    A(int\
  \ x1, int y1)\n    {\n        x = x1;\n        y = y1;\n    }\n    public String\
  \ toString()\n    {\n        return (x + \",\" + y);\n    }\n}\nclass ToStringTest2\n\
  {\n    public static void main(String args[])\n    {\n        A a1 = new A(5,6);\n\
  \        System.out.println(a1); // 调用了 A 的 toString()\n        String s1=\"Object\
  \ a1 is \" + a1; // 对象与字符串拼接\n        // 再次调用了 A 的 toString()\n        System.out.println(s1);\n\
  \    }\n}\n```\n输出：\n`5,6`\n`Object a1 is 5,6`\n\n### 示例 10.4:\n\n```java\nimport\
  \ java.util.*;\nclass FindTest\n{\n    public static void main(String args[])\n\
  \    {\n        Scanner sc=new Scanner(System.in);\n        String s1,s2;\n    \
  \    System.out.print(\"Enter a string\");\n        s1=sc.next();\n        System.out.print(\"\
  Enter string to search\");\n        s2=sc.next();\n        int ans = s1.indexOf(s2);\n\
  \        if(ans == -1)\n            System.out.println(\"Not Found\");\n       \
  \ else\n            System.out.println(\"found at pos \" + ans);\n    }\n}\n```\n\
  \n### StringBuffer\n\n`StringBuffer` 是 `String` 的伙伴类，提供了许多 `String` 的功能。正如所知，`String`\
  \ 表示固定长度的不可变字符序列。相比之下，`StringBuffer` 表示可增长且可写的字符序列。`StringBuffer` 可以在中间插入字符或在末尾追加。Java\
  \ 经常使用该类，但许多程序员只处理 `String`，实际上通过重载的 `+` 运算符在底层使用 `StringBuffer`。`StringBuffer`\
  \ 会自动增长以适应添加，通常预留了比需要更多的字符。\n\n#### 关于 StringBuffer 的一些要点\n\n- `StringBuffer` 像\
  \ `Object` 一样。\n- `StringBuffer` 类像 `String` 一样也是 `final` 的。\n- `StringBuffer` 对象是可变的，这与\
  \ `String` 对象不同。\n\n#### StringBuffer 的构造函数和方法| 方法 | 说明 |\n| :--- | :--- |\n| `public\
  \ StringBuffer()` | 默认构造函数预留 16 个字符。 |\n| `public StringBuffer(int n)` | 此构造函数接受一个整数参数，显式设置缓冲区的大小。\
  \ |\n| `public StringBuffer(String str)` | 此构造函数接受一个字符串参数，设置 `StringBuffer` 对象的初始内容，并额外预留\
  \ 16 个字符。 |\n| `public synchronized int length()` | 返回 `StringBuffer` 的当前长度。 |\n\
  | `public synchronized int capacity()` | 返回当前容量。容量是新插入字符的可用空间，超过此范围将发生分配。 |\n| `public\
  \ synchronized void ensureCapacity(int min)` | 确保容量至少等于指定的最小值。如果我们想在构造 `StringBuffer`\
  \ 之后预留一定数量字符的空间，可以使用 `ensureCapacity()` 方法设置缓冲区的大小。如果我们预先知道将追加许多小字符串，这非常有用。 |\n\
  | `public synchronized void trimToSize()` | 将移除多余的空空间。现在容量将等于长度。 |\n| `public synchronized\
  \ void setLength(int newLength)` | 设置字符序列的长度。`newLength` 必须是非负数。当我们增大缓冲区时，会在现有末尾添加空字符。如果调用\
  \ `setLength()` 传入的值小于 `length()` 的返回值，则存储在该长度之外的字符将丢失。 |\n\n\n\n\n\n# 方法参考\n\n\
  | `public synchronized char charAt(int index)` | 返回此序列中指定索引处的 `char` 值。 |\n| `public\
  \ synchronized void getChars(int srcBegin, int srcEnd, char[] dst, int dstBegin)`\
  \ | 将字符从此序列复制到目标字符数组 `dst`。第一个复制的字符位于索引 `srcBegin`；最后一个复制的字符位于索引 `srcEnd-1`。要复制的字符总数为\
  \ `srcEnd-srcBegin`。字符被复制到 `dst` 中从索引 `dstBegin` 开始的子数组中。注意：确保目标数组足够大，能够容纳指定子字符串中的字符数量。\
  \ |\n| `public synchronized void setCharAt(int index, char ch)` | 将指定索引处的字符设置为 `ch`。如果\
  \ `index` 为负数或大于或等于 `length()`，则抛出 `IndexOutOfBoundsException`。 |\n| `public synchronized\
  \ StringBuffer append(Object)` | `append` 方法将任何其他类型数据的字符串表示连接到调用 `StringBuffer`\
  \ 对象的末尾。 |\n| `public synchronized StringBuffer delete(int start, int end)` | 从从索引\
  \ `start` 到索引 `end-1` 的字符 |\n| `public synchronized StringBuffer deleteCharAt(int\
  \ index)` | 移除指定位置的字符 |\n| `public synchronized StringBuffer replace(int start,\
  \ int end, String str)` | 将索引 `start` 到索引 `end-1` 的字符替换为指定 `String` 中的字符。 |\n| `public\
  \ synchronized String substring(int)` | 返回一个新的 `String`，包含当前此字符序列中的字符子序列。该子字符串从指定的索引开始，延伸到此序列的结尾。\
  \ |\n| `public synchronized String substring(int start, int end)` | 返回一个新的 `String`，包含当前此字符序列中的字符子序列。该子字符串从指定的\
  \ `start` 索引开始，延伸到索引 `end-1` 处的字符。 |\n| `public synchronized StringBuffer insert(int,\
  \ Object)` | 将一个 `String` 插入另一个 `String` 中。它被重载以接受所有简单类型的值以及 `Strings` 和 `Objects`。\
  \ |\n| `public int indexOf(String)` | |\n| `public synchronized int indexOf(String,\
  \ int)` | |\n| `public int lastIndexOf(String)` | |\n| `public synchronized int\
  \ lastIndexOf(String, int)` | |\n| `public synchronized StringBuffer reverse()`\
  \ | 反转 `StringBuffer` 的内容。 |\n\n## 示例 10.5\n\n```java\nimport java.util.Scanner;\n\
  \nclass SortStr\n{\n    public static void main(String args[])\n    {\n        Scanner\
  \ sc = new Scanner(System.in);\n        System.out.print(\"Enter a string\");\n\
  \        StringBuffer sb1 = new StringBuffer(sc.next());\n        //Sorting\n  \
  \      for(int i=0;i<sb1.length()-1;i++)\n        for(int j=i+1;j<sb1.length();j++)\n\
  \            if(sb1.charAt(i) > sb1.charAt(j))\n            {\n                char\
  \ t=sb1.charAt(i);\n                sb1.setCharAt(i,sb1.charAt(j));\n          \
  \      sb1.setCharAt(j,t);\n            }\n            System.out.println(sb1);\n\
  \    }\n}\n```\n输出: Enter a string SHIVAM\nAHIMSV\n\n## 示例 10.6: 统计给定句子单词数的程序。\n\
  \n```java\nclass WordCnt\n{\n    public static void main(String args[])\n    {\n\
  \        String s1 = \"Mohan Das  Karam  Chand  Gandhi\";\n        boolean flag=false;\n\
  \        int cnt=0;\n        for(int i=0;i<s1.length();i++)\n        {\n       \
  \     if(s1.charAt(i) == ' ')\n                flag = false;\n            else\n\
  \            {\n                if(flag == false)\n                {\n         \
  \           flag = true;\n                    cnt++;\n                }\n      \
  \      }\n        }\n        System.out.print(\"No. of Words=\" + cnt);\n    }\n\
  }\n```\n输出: No. of Words=5\n\n# 第 1 章：异常处理\n\n## 引言\n异常是在运行时发生并破坏程序正常流的情况。当 Java\
  \ 解释器遇到错误时，它创建一个对象并将其抛出。在较旧的语言中，错误处理是使用返回码完成。在 Java 中，异常通过对象进行处理。这种方法避免了繁琐的 `goto`\
  \ 和返回码的使用。\n\n### 异常基础\n异常是一个描述代码中错误状态的对象。当出现异常情况时，会创建并抛出该对象。异常可以由 Java 运行时系统生成，也可以由你的代码手动生成。用户生成的异常通常向调用者报告错误。\n\
  \nJava 异常处理通过五个关键字管理：`try`、`catch`、`throw`、`throws` 和 `finally`。\n- `try`: 你想要监控是否发生异常的语句。\n\
  - `catch`: 用于在发生异常时处理该异常。\n- `throw`: 用于手动抛出异常。\n- `throws`: 用于指定某个方法可能会抛出异常。\n\
  - `finally`: 在 `try` 块完成后绝对必须执行的代码。\n\n异常处理块的通用形式为：\n\n```java\ntry {\n    // 监控错误情况的代码块\n\
  }\ncatch (Exception1 exOb) {\n    // 针对 Exception1 的异常处理程序\n}\n//.........\nfinally\
  \ {\n    // 在 try 结束后要执行的代码块\n}\n```\n\n### 异常类型\n所有异常类型都是内置 `Throwable` 类的子类。`Throwable`\
  \ 位于异常类层次结构的顶端。紧接 `Throwable` 之下的是两个子类，将异常分为两个不同的分支：\n\n1. `Exception`: 用于用户程序应该捕获的异常情况。你将通过派生该类来创建自定义的异常类型。\n\
  2. `RuntimeException`: `Exception` 的一个重要子类。这些异常为你编写的程序自动定义，例如除以零或无效的数组索引。\n\n\n\n\
  \n\n另一个分支由 `Error` 顶层，它定义了在正常情况下预计不会被程序捕获的异常。`Error` 类型的异常由 Java 运行时系统用于表示与运行时环境本身相关的错误。栈溢出（Stack\
  \ overflow）就是此类错误的一个例子。本章将不会处理 `Error` 类型的异常，因为这些通常是为了响应程序无法处理的灾难性故障而创建。\n\n顶层异常层次结构所示：\n\
  \n![image](img/image074.png)\n\n### 示例 11.1\n\n```java\nclass ErrorTest1\n{\n  \
  \  public static void main(String args[])\n    {\n      int a=5,b=2,c=2,d;\n   \
  \   d=a/(b-c); // 发生了 ArithmeticException(Divide by zero)\n      System.out.println(d);\n\
  \      System.out.println(\"This will not be printed\");\n    }\n}\n```\n程序将在除法操作期间终止，不会执行剩余的语句。\n\
  \n### 示例 11.2\n\n```java\nclass A\n{\n    void display()\n    {\n      -----\n \
  \   }\n}\nclass ErrorTest2\n{\n    public static void main(String args[])\n    {\n\
  \      A a1=null;\n      a1.display(); // 发生了 NullPointerException\n    }\n}\n```\n\
  在上述程序中，会发生 `NullPointerException`。引用变量没有用 `new` 进行初始化。在这种情况下，程序也会终止。\n\n### 示例 11.3\n\
  \n```java\nclass ErrorTest3\n{\n    public static void main(String args[])\n   \
  \ {\n      int a[ ] = {10,20,30};\n      System.out.println(a[3]);  // 发生了 ArrayIndexOutOfBoundsException\n\
  \    }\n}\n```\n在上述情况下，数组的长度为 3，索引从 0 到 2，因此如果我们打印 `a[3]`，那么它就是第 4 个元素，这不是一个有效的索引。这将产生一个异常错误。在\
  \ C/C++ 中这是允许的，但在 Java 中是不允许。\n\n### 注意\nJDK 7 添加了一种 `try` 语句的新形式，支持自动资源管理。这种新的\
  \ `try` 形式被称为 `try-with-resources`，在 `Chapter` 文件中关于文件管理的上下文中进行了描述，因为文件是最常用的资源之一。\n\
  \n#### 异常的其他情况\n1. 我们尝试打开的文件可能不存在。\n2. 我们想创建一个新对象，但没有可用内存。\n3. 我们想要加载的类文件可能丢失或格式错误。\n\
  4. 我们想要转换为数字的 `String` 包含无效字符，导致无法转换为数字。\n\n如果异常对象没有被妥善捕获和处理，解释器将显示错误消息并终止程序。如果我们希望继续执行剩余代码，那么应该尝试捕获由错误条件抛出的异常对象。\n\
  \n这项任务被称为异常处理（exception handling）。异常处理机制目的是目的是提供检测和报告“异常情况”的手段，以便采取适当的行动。该机制建议引入单独的错误处理代码，用于执行以下任务：\n\
  \n1. 发现问题。（发生异常）\n2. 告知发生了错误。（抛出异常）\n3. 接收错误信息。（捕获异常）\n4. 采取纠正措施。（处理异常）\n\nJava\
  \ 异常处理通过五个关键字管理：`try`、`catch`、`throw`、`throws` 和 `finally`。\n\n我们想要监控异常的程序语句包含在\
  \ `try` 块中，每当发生错误，它就会被抛到 `catch` 块。我们的代码可以捕获此异常（使用 `catch`）并以合理的方式处理它。系统生成的异常由 Java\
  \ 运行时系统自动抛出。\n\n要手动抛出异常，请使用关键字 `throw`。任何抛出方法的异常必须通过 `throws` 子句进行指定。任何在方法返回之前必须执行的代码都放在\
  \ `finally` 块中。\n\n`try` 块必须括在大括号之间。它可以包含一个或多个语句。`catch` 块和 `finally` 块都是可选的。如果没有\
  \ `catch` 块，执行将继续进行 `try` 块之后的语句。如果存在 `finally` 块，执行将继续进行 `finally` 块之后的语句。\n\n\
  如果在执行 `try` 块时发生了某些错误，JVM 会抛出一个 `Exception` 对象或其子类之一。然后按照顶层顺序与 `catch` 块进行比较。如果找到匹配的\
  \ `catch` 块，则处理该异常。如果没有找到，异常将向上层次结构移动，直到它被处理或被传递给 JVM 且未处理。JVM 随后终止程序并在控制台上显示详细信息。\n\
  \n#### 使用 try 和 catch\n尽管 Java 运行时系统提供的默认异常处理器对于调试很有用，但你通常可能自己自己处理异常。这样做有两个好处：首先，它允许你处理错误。其次，它防止程序自动终止。如果你的程序每当发生错误就停止运行并打印堆栈跟踪，大多数用户会感到困惑（至少可以这么说）！幸运的是，防止这一点非常容易。\n\
  \n为了防止和处理运行时错误，只需将你想要监控的代码包含在 `try` 块中。紧跟在 `try` 块之后包含一个 `catch` 子句，指定你想要捕获的异常类型。\n\
  \n为了说明这可以多么容易完成，以下程序包含一个 `try` 块和一个 `catch` 子句，用于处理由除零错误产生的 `ArithmeticException`：\n\
  \n```java\nclass Exc2 {\n  public static void main(String args[])\n  {\n    int\
  \ d, a;\n\n    try {  // 监控代码块。\n    d = 0;\n    a = 42 / d;\n    System.out.println(\"\
  This will not be printed.\");\n    }\n\n    catch (ArithmeticException e)\n    {\n\
  \    // 捕获除零错误\n    System.out.println(\"Division by zero.\");\n    }\n    System.out.println(\"\
  After catch statement.\");\n  }\n}\n```\n\n该程序产生输出：\n\nDivision by zero.\n\nAfter\
  \ catch statement.\n\n注意 `try` 块内部的 `println()` 调用从未执行。一旦抛出异常，程序控制将从 `try` 块转移到\
  \ `catch` 块。\n\n\n\n\n换句话说，`catch` 并不是被“调用”的，因此执行流永远不会从 `catch` 回到 `try` 块中。因此，“这不会打印。”这一行不会显示。一旦\
  \ `catch` 语句执行完毕，程序将继续执行整个 `try/catch` 机制之后的下一行代码。\n\n`try` 及其 `catch` 语句形成一个单元。`catch`\
  \ 子句的作用范围限于紧接其后的 `try` 语句所指定的语句。`catch` 语句无法捕获由另一个 `try` 语句抛出的异常（稍后描述的嵌套 `try` 语句除外）。受\
  \ `try`保护的语句必须用大括号括起来（也就是说它们必须在一个块内）。你不能对单个语句使用 `try`。\n\n大多数结构良好的 `catch` 子句其目标应该是解决异常情况，然后像错误从未发生过一样继续运行。例如，在下一个程序中，`for`\
  \ 循环的每次迭代都会获取两个随机整数。这两个整数相互相除，结果被用于除以值 `12345`。最终结果存入 `a` 中。如果任何一个除法操作导致 `divide-by-zero`\
  \ 错误，它将被捕获，`a` 的值设置为零，然后程序继续。\n\n```java\n// Handle an exception and move on.\n\n\
  import java.util.Random;\n\nclass HandleError {\n    public static void main(String\
  \ args[]) {\n        int a=0, b=0, c=0;\n        Random r = new Random();\n    \
  \    for(int i=0; i<32000; i++) {\n            try {\n                b = r.nextInt();\n\
  \                c = r.nextInt();\n                a = 12345 / (b/c);\n        \
  \    } catch (ArithmeticException e) {\n                System.out.println(\"Division\
  \ by zero.\");\n                a = 0; // set a to zero and continue\n         \
  \   }\n            System.out.println(\"a: \" + a);\n        }\n    }\n}\n```\n\n\
  ## 显示异常的描述\n\n`Throwable` 重写了 `toString()` 方法（由 `Object` 定义），使其返回一个包含异常描述的字符串。你可以只需通过将异常作为参数传递给\
  \ `println()` 语句来显示此描述。例如，上一个程序的 `catch` 块可以重写如下：\n\n```java\ncatch (ArithmeticException\
  \ e)\n{\n    System.out.println(\"Exception: \" + e);\n    a = 0; // set a to zero\
  \ and continue\n}\n```\n\n当在程序中替换此版本并运行时，每个 `divide-by-zero` 错误都会显示以下消息：\n\n`Exception:\
  \ java.lang.ArithmeticException: / by zero`\n\n虽然在在此上下文中它没有特殊价值，但在其他情况下，显示异常描述是有价值的——特别是当你正在尝试异常或进行调试时。\n\
  \n| 异常类型 | 异常原因 |\n| :--- | :--- |\n| `ArithmeticException` | 算术错误，例如除以 0 |\n| `ArrayIndexOutOfBoundsException`\
  \ | 数组索引越界 |\n| `ArrayStoreException` | 在数组中存储错误类型的数据 |\n| `FileNotFoundException`\
  \ | 访问不存在的文件 |\n| `IOException` | 无法从文件读取 |\n| `NullPointerException` | 由引用空对象引起\
  \ |\n| `NumberFormatException` | 字符串与数字之间的转换失败 |\n| `OutOfMemoryException` | 没有足够的内存分配新对象\
  \ |\n| `SecurityException` | Applet 尝试执行浏览器安全设置未允许的操作 |\n| `StackOverflowException`\
  \ | 系统栈空间耗尽 |\n| `StringIndexOutOfBoundsException` | 程序尝试访问字符串中不存在的字符位置 |\n\n##\
  \ Java 的内置异常\n\n在标准包 `java.lang` 内部，Java 定义了几个异常类。前面的示例已经使用了其中几个。在这些异常中最通用的是标准类型\
  \ `RuntimeException` 的子类。\n\n如之前解释的那样，这些异常不需要包含在方法的 `throws` 列表中。在 Java 语言中，这些被称为\
  \ `unchecked exceptions`（未检查异常），因为编译器不会检查方法是否处理了它们。而那些被称为 `checked exceptions`（已检查异常）；在\
  \ `java.lang` 中定义的异常必须包含在方法的 `throws` 列表中。\n\n## 多个 catch 子句\n\n在某些情况下，单段代码可能会抛出多个异常。为了处理这种情况，你可以指定两个或多个\
  \ `catch` 子句。当抛出异常时，会按顺序检查每个 `catch` 语句，并执行第一个与异常类型匹配的语句。在一个 `catch` 语句执行后，其他语句将被跳过。\n\
  \n```java\n// Demonstrate multiple catch.\nclass MultipleCatches {\n    public static\
  \ void main(String args[]) {\n        try {\n            int a = args.length;\n\
  \            System.out.println(\"a = \" + a);\n            int b = 42 / a;\n  \
  \          int c[] = { 1 };\n            c[42] = 99;\n        } catch (ArithmeticException\
  \ e) {\n            System.out.println(\"Divide by 0: \" + e);\n        } catch\
  \ (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"Array index\
  \ oob: \" + e);\n        }\n        System.out.println(\"After try/catch blocks.\"\
  );\n    }\n}\n```\n\n该程序在不带命令行参数启动时会导致 `divide-by-zero` 异常，因为 `a` 等于零。如果你提供命令行参数使\
  \ `a` 大于零，它将跳过除法错误。但它会导致 `ArrayIndexOutOfBoundsException`，因为数组 `c` 的长度为 1，而程序尝试给\
  \ `c[42]` 赋值。\n\n以下是两种运行方式生成的输出：\n\n`C:\\>MultipleCatches\na = 0\nDivide by 0: java.lang.ArithmeticException:\
  \ / by zero\nAfter try/catch blocks.`\n\n`C:\\>MultipleCatches TestArg\na = 1\n\
  Array index oob: java.lang.ArrayIndexOutOfBoundsException: 42\nAfter try/catch blocks.`\n\
  \n在使用多个 `catch` 语句时，必须记住异常子类在其父类之前。这是因为使用父类的 `catch` 语句会捕获该类型及其任何子类的异常。因此，如果子类出现在父类之后，它永远无法被访问。此外，在\
  \ Java 中，不可达代码是一个错误。例如，考虑以下程序：\n\n```java\n/* 此程序包含错误。\n在系列 catch 语句中，子类必须在其父类之前。\n\
  否则，将创建不可达代码并导致编译时错误。 */\n*/\nclass SuperSubCatch {\n    public static void main(String\
  \ args[]) {\n        try {\n            int a = 0;\n            int b = 42 / a;\n\
  \        } catch(Exception e) {\n            System.out.println(\"Generic Exception\
  \ catch.\");\n        }\n        /* 此捕获语句永远不会到达，因为\n        ArithmeticException\
  \ 是 Exception 的子类。 */\n        catch(ArithmeticException e) { // 错误 – unreachable\n\
  \            System.out.println(\"This is never reached.\");\n        }\n    }\n\
  }\n```\n\n\n\n\n如果你尝试编译此程序，将收到一条错误信息，指出第二个 `catch` 语句是不可达的，因为异常已经被捕获。由于 `ArithmeticException`\
  \ 是 `Exception` 的子类，第一个 `catch` 语句将处理所有基于 `Exception` 的错误，包括 `ArithmeticException`。\n\
  \n这意味着第二个 `catch` 语句将永远不会执行。要解决这个问题，请反转 `catch` 语句的顺序。\n\n## 嵌套 try 语句\n\n`try`\
  \ 语句可以嵌套。也就是说，一个 `try` 语句可以位于另一个 `try` 内部。每当进入一个 `try` 语句时，该异常的上下文就会推入栈中。\n\n如果内部\
  \ `try` 语句没有针对特定异常的 `catch` 处理器，栈将回溯，并检查下一个 `try` 语句的 `catch` 处理器是否匹配。\n\n这种过程会持续持续直到其中一个\
  \ `catch` 语句执行成功，或者耗尽所有的嵌套 `try` 语句。如果没有匹配的 `catch` 语句，则 Java 运行时系统将处理该异常。\n\n以下是一个使用嵌套\
  \ `try` 语句的示例：\n\n## 多个 catch 语句\n\n当存在多个 `catch` 语句时，它被称为多个 catch 语句。\n\n### 多个\
  \ catch 语句示例\n\n```java\ntry\n{\n    statement;  //产生异常\n}\ncatch(Exception-type-1\
  \ e)\n{\n    statement 1;  //处理异常类型 1\n}\ncatch(Exception-type-2 e)\n{\n    statement\
  \ 2;  //处理异常类型 2\n}\n- - -\ncatch(Exception-type-n e)\n{\n    statement n;  //处理异常类型\
  \ n\n}\n```\n\n### 示例 11.4\n\n```java\nclass ErrorTest4\n{\n    public static void\
  \ main(String args[])\n    {\n        int a=10,b=2,c=2,d;\n        System.out.println(\"\
  Before Exception \");\n        d=a/(b-c);\n        System.out.println(\"After Exception\
  \ \");\n    }\n}\n```\n输出：\n![image](img/image043.png)\n\n在这里我们没有捕获异常，因此程序会在显示消息“Before\
  \ Exception”后终止。现在我们使用异常处理解决了这个问题。\n\n### 示例 11.5\n\n```java\nclass ErrorTest5\n\
  {\n    public static void main(String[] args)\n    {\n      int a=10,b=2,c=2,d;\n\
  \      try\n      {\n        System.out.println(\"Before Exception\");\n       \
  \ d=a/(b-c);\n        System.out.println(\"This Will Not Print\");\n      }\n  \
  \    catch(ArithmeticException e)\n      {\n      System.out.println(\"After Exception\"\
  );\n      System.out.println(\"error : Division by zero\");\n      }\n    }\n}\n\
  ```\n输出：\n![image](img/image049.png)\n\n## 异常处理的优势\n\n- 我们可以很容易地确定异常/错误将在哪里被处理。异常/错误在运行时沿调用栈向上传播——首先到达封装的\
  \ `try` 块，然后返回到调用方法——直到异常处理器捕获它们。\n- 异常/错误的位置是确切知的，因为整个堆栈轨迹对用户可用。这对于调试非常有帮助。\n-\
  \ 程序员获得了机会从错误/异常状态中恢复。\n- 错误处理代码与正常程序流分离，以增加可读性和可维护性。\n- 在 Java 中，无需测试是否发生了异常/错误情况。添加更多的错误/异常处理器只需添加更多的\
  \ `catch` 子句，但不需要触动原始程序流。\n\n## 异常类的层次结构\n\n所有 Exception/Error 类的根类是 `throwable`\
  \ 类，它是 `object` 类的直接子类。异常/错误也是 Java 中的对象。`Exception` 的子类带有后缀 `Exception`。\n\n`throwable`\
  \ 类有两个直接子类。\n\n- `Error`: `Error` 类的子类基本上用于信号非正常状态，例如：\n    1. `OutOfMemoryError`\
  \ 表示 Java 虚拟机内存耗尽，垃圾回收器无法回收任何内存。\n    2. `StackOverflowError` 解释器中发生栈溢出。\n    这些错误通常是不可恢复的，不应该被处理。\n\
  - `Exception`: `Exception` 类的子类通常是可恢复的。例如，`EOFException` 表示我们打开的文件没有更多数据了。`FileNotFoundException`\
  \ 表示我们想要打开的文件在系统中不存在。\n\n错误的示例：\n![image](img/image01.png)\n\n## 异常分为两种类型\n\n###\
  \ 检查异常 (Checked Exception)\n如果必须捕获异常，则它被称为检查异常。如果 `try` 块中可能发生检查异常且未被处理，程序将无法编译。编译器确保如果一个方法直接或间接地抛出检查异常，则该方法必须显式处理它。该方法要么捕获异常并采取适当行动，要么将异常传递给调用者。\n\
  注意：`Exception` 及其所有子类（运行时异常及其子类外）都是检查异常，必须被捕获。\n\n### 未检查异常 (Unchecked Exception)\n\
  如果不必捕获异常，则称为未检查异常。即使未处理未检查异常，程序也可以编译。如果程序中发生了未处理的未检查异常，程序执行将在该点终止。但如果异常已处理，程序就不会因为异常而终止。\n\
  注意-：`Error` 及其所有子类都是未检查异常。运行时异常及其子类是未检查的。用户定义的异常是检查的。\n\n### Exception 类可用方法\n\n\
  | 方法 | 描述 |\n| :--- | :--- |\n| `getMessage()` | 获取与异常或错误相关的消息。 |\n| `printStackTrace()`\
  \ | 打印显示异常发生位置的栈轨迹。 |\n| `toString()` | 显示异常/错误名称以及由 `getMessage()` 返回的消息。 |\n\n\
  ### 示例 11.6\n```java\nclass ErrorTest6\n{\n    public static void main(String[]\
  \ args)\n    {\n      try\n      {\n        int a=10,b=2,c=2,d;\n        System.out.println(\"\
  Before Exception\");\n        d=a/(b-c);\n        System.out.println(\"This Will\
  \ Not Print\");\n      }\n      catch(ArithmeticException e)\n      {\n        System.out.println(\"\
  After Exception\");\n        System.out.println(\"error : Division by zero\");\n\
  \        System.out.println(e.getMessage());\n        System.out.println(e); //调用了\
  \ toString()\n        e.printStackTrace();\n      }\n    }\n}\n```\n输出：\nBefore\
  \ Exception\nAfter Exception\nerror : Division by zero\nby Zero\njava.lang.ArithmeticException:\
  \ / by zero\njava.lang.ArithmeticException: / by zero\nat ErrorTest6.main(ErrorTest6.java:10)\n\
  \n### 示例 11.7 多个 catch\n```java\nclass ErrorTest7\n{\n    public static void main(String\
  \ args[])\n    {\n      try\n      {\n        int a=args.length;\n        System.out.println(\"\
  Before Exception\");\n        int b=58/a;\n        int c[] = {1};\n        c[47]=100;\n\
  \        System.out.println(\"After Exception\");\n      }\n      catch(ArithmeticException\
  \ e)\n      {\n        System.out.println(\"Divide by zero :\"+e);\n      }\n  \
  \    catch(ArrayIndexOutOfBoundsException e)\n      {\n        System.out.println(\"\
  Array Index oob :\"+e);\n      }\n      System.out.println(\"After try/catch block\"\
  );\n    }\n}\n```\n输出 1：当我们作为“java ErrorTest7”运行上述程序时：\nBefore Exception\nDivide\
  \ by zero : java.lang.ArithmeticException: / by zero\nAfter try/catch block\n\n\
  输出 2：当我们作为“java ErrorTest7 45”运行上述程序时：\nBefore Exception\nArray Index oob: java.lang.ArrayIndexOutOfBoundsException:\
  \ 47\nAfter try/catch block\n\n\n\n\n如果我们在另一个 `try` 块中使用 `try` 和 `catch` 语句，则被称为嵌套的\
  \ try catch。\n\n### 语法\n\n```java\ntry      //外部 try\n{\n    try      //内部 try\n\
  \    {\n        statement ;\n    }\n    catch1()    //内部 catch\n    {\n        statement\
  \ ;\n    }\n    catch2()    //内部 catch\n    {\n        statement ;\n    }\n}\ncatch()\
  \    //外部 catch\n{\n    statement ;\n}\n```\n\n### 示例 11.8 嵌套的 try 和 catch\n\n```java\n\
  class Nested\n{\n    public static void main(String args[])\n    {\n        try\n\
  \        {\n            int a=args.length;\n            int b=58/a;\n          \
  \  System.out.println(\"a= \"+a);\n            try\n            {\n            \
  \    if(a==1)\n                    a=a/(a-a);\n                if(a==2)\n      \
  \          {\n                    int c[]={1};\n                    c[42]=100;\n\
  \                }\n            }\n            catch(ArrayIndexOutOfBoundsException\
  \ e)\n            {\n                System.out.println(\"ArrayIndex oob \"+e);\n\
  \            }\n        }\n        catch(ArithmeticException e)\n        {\n   \
  \         System.out.println(e.getMessage());\n        }\n    }\n}\n```\n\n**输出\
  \ I:** 当我们以“java ErrorTest8”运行上述程序时 / 除以 0：\n\n**输出 II:** 当我们以“java ErrorTest8 10”运行上述程序时：\n\
  a=1 / by zero\n\n**输出 III:** 当我们以“java ErrorTest8 10 20”运行上述程序时，a=2\nArrayIndex\
  \ oob java.lang.ArrayIndexOutOfBoundsException: 42\n\n### finally 语句\n\nJava 支持另一种名为\
  \ `finally` 语句的语句，它可以用于处理没有被之前的任何一个 `catch` 语句捕获的异常。`finally` 块可以用于处理在 `try` 块中生成的任何异常。无论是否发生错误，它都会执行。它可以紧跟在\
  \ `try` 块之后，也可以在最后一个 `catch` 块之后，如下所示：\n\n**语法：**\n\n```java\ntry\n{\n}\ncatch(...)\n\
  {\n}\ncatch(...)\n{\n}\nfinally\n{\n}\n```\n\n### 示例 11.9 finally 语句\n\n```java\n\
  class ErrorTest9\n{\n    public static void main(String args[])\n    {\n       \
  \ int a[ ] = {5,10};\n        int b=5;\n        try\n        {\n            int\
  \ x=a[2]/b-a[1];\n        }\n        catch(ArithmeticException e)\n        {\n \
  \           System.out.println(\"Division By Zero\");\n        }\n        catch(ArrayIndexOutOfBoundsException\
  \ e)\n        {\n            System.out.println(\"Array Index error\");\n      \
  \  }\n        catch(ArrayStoreException e)\n        {\n            System.out.println(\"\
  Wrong Data Type\");\n        }\n        finally    //始终执行\n        {\n         \
  \   System.out.println(\"Always Execute\");\n        }\n        int y=a[1]/a[0];\n\
  \        System.out.println(\"y = \"+y);\n    }\n}\n```\n**输出：**\nArray Index error\n\
  Always Execute\ny = 2\n\n### throw\n\n到目前，我们只捕获由 Java 运行时系统抛出的异常。然而，我们的程序可以使用 `throw`\
  \ 语句显式地抛出异常；其通用形式所示：\n\n```java\nthrow instance;\n```\n在这里，`instance` 必须是 `Throwable`\
  \ 类型的对象或 `Throwable` 的子类。简单类型（如 `int` 或 `char`）以及非 `Throwable` 类（如 `String` 和 `Object`）不能用作异常。我们可以通过两种方式获取\
  \ `Throwable` 对象：在 `catch` 子句中使用参数，或者使用 `new` 运算符创建一个对象。执行流在 `throw` 语句之后立即停止；任何随后的语句都不会执行。系统将检查最近的\
  \ `try` 块，查看它是否有与异常类型匹配的 `catch` 语句。如果有，控制权将转移到该语句。如果没有，则检查下一个外层的 `try` 语句，依此类推。如果未找到匹配的\
  \ `catch`，则默认处理程序将停止程序并打印堆栈跟踪。在这里，我们取了一个创建并抛出异常的程序。捕获异常的处理器将其重新抛给外部处理器。\n\n####\
  \ 示例 11.10\n\n```java\nclass ErrorTest10\n{\n    int age;\n    void setAge(int a)\n\
  \    {\n        if(a>0)\n            age = a;\n        else\n        {\n       \
  \     NullPointerException e = new NullPointerException(\"Invalid Age\");\n    \
  \        throw e;\n        }\n    }\n    public static void main(String args[])\n\
  \    {\n        ErrorTest10 a1 = new ErrorTest10();\n        try\n        {\n  \
  \          a1.setAge(20);\n            a1.setAge(-10);\n        }\n        catch(NullPointerException\
  \ e)\n        {\n            System.out.println(e.getMessage());\n        }\n  \
  \  }\n}\n```\n**输出：** Invalid Age\n\n### throws\n\n如果一个方法可能会引起它无法处理的异常，那么它必须指定这种行为，以便方法的调用者对该异常进行防护。我们通过在方法的声明中包含一个\
  \ `throws` 子句来实现。`throws` 子句列出了方法可能抛出的异常类型。这对于所有检查异常（checked exceptions）都是都是的。方法可能抛出的所有异常必须在\
  \ `throws` 子句中声明。如果没有声明，将导致编译时错误。这是一个包含 `throws` 子句的方法声明通用形式：\n\n**语法：**\n\n```java\n\
  type method-name(parameter list) throws exception-list\n{\n    //方法体\n}\n```\n在这里，`exception-list`\
  \ 是方法可以抛出的异常的逗号分隔列表。\n\n#### 示例 11.11\n\n```java\nimport java.io.*;\nclass ErrorTest11\n\
  {\n    int age;\n    void setAge(int a) throws IOException\n    {\n        if(a>0)\n\
  \            age = a;\n        else\n        {\n            IOException e = new\
  \ IOException(\"Invalid Age\");\n            throw e;\n        }\n    }\n    public\
  \ static void main(String args[])\n    {\n        ErrorTest11 a1 = new ErrorTest11();\n\
  \        try\n        {\n            a1.setAge(20);\n            a1.setAge(-10);\n\
  \        }\n        catch(IOException e)\n        {\n            System.out.println(e.getMessage());\n\
  \        }\n    }\n}\n```\n**输出：** Invalid Age\n\n### 创建自定义异常/类\n\n#### 创建自己的异常子类\n\
  \n这非常简单：定义一个 `Exception`/`Error` 的子类。我们的子类不需要实现任何内容。`Exception`/`Error` 类本身没有定义任何方法。当然，它当然继承了\
  \ `Throwable` 的方法。因此，所有异常（包括你创建的异常）都可以使用 `Throwable` 定义的方法。\n\n#### 示例 11.12\n\n\
  ```java\nclass AgeException extends Exception\n{\n```\n\n\n\n\n\n```java\nclass\
  \ AgeException(String msg) {\n    super(msg);\n}\n\nclass ErrorTest12 {\n    int\
  \ age;\n    void setAge(int a) throws InvalidAgeException {\n        if(a>0)\n \
  \           age = a;\n        else {\n            AgeException e = new AgeException(\"\
  Invalid Age\");\n            throw e;\n        }\n    }\n    public static void\
  \ main(String args[]) {\n        ErrorTest12 a1 = new ErrorTest12();\n        try\
  \ {\n            a1.setAge(20);\n            a1.setAge(-10);\n        } catch(AgeException\
  \ e) {\n            System.out.println(e.getMessage());\n        }\n    }\n}\n```\n\
  \n输出:\n```\nInvalid Age\n```\n\n以下示例声明了 `Exception` 的新子类，并使用该子类在方法中信号错误条件。它重写了 `toString()`\
  \ 方法，允许显示精心定制的异常描述。\n\n![sss](img/image090.jpg)\n\n此示例定义了一个名为 `MyException` 的 `Exception`\
  \ 子类。该子类非常简单：它只包含一个构造函数和一个重写的 `toString()` 方法，该方法显示异常的值。\n\n`ExceptionDemo` 类定义了一个名为\
  \ `compute()` 的方法，该方法抛出一个 `MyException` 对象。当 `compute()` 的整数参数大于 10 时，会抛出异常。`main()`\
  \ 方法为 `MyException` 设置了异常处理程序，然后用合法值（小于 10）和非法值调用 `compute()`，以展示代码的两种路径。\n\n以下是结果：\n\
  ```\nCalled compute(1)\nNormal exit\nCalled compute(20)\nCaught MyException[20]\n\
  ```\n\n### 链式异常\n\n链式异常功能允许我们将另一个异常与异常相关联。第二个异常描述了第一个异常的原因。例如，想象一种情况：方法由于尝试除以零而抛出了\
  \ `ArithmeticException`。然而，问题的实际原因是发生了 I/O 错误，导致除数被设置不当。\n\n尽管该方法必须抛出 `ArithmeticException`（因为这是发生的错误），但我们可能也想让调用代码知道底层原因是\
  \ I/O 错误。\n\n为了支持链式异常，Java 2 的 1.4 版本为 `Throwable` 类增加了两个构造函数和两个方法。构造函数所示：\n\n```java\n\
  Throwable(Throwable causeExc)\nThrowable(String msg, Throwable causeExc)\n```\n\n\
  在第一种形式中，`causeExc` 是发生的异常。第二种形式允许我们在指定原因异常的同时指定一个描述。这两个构造函数也被添加到了 `Error`、`Exception`\
  \ 和 `RuntimeException` 类中。\n\n添加到 `Throwable` 类的链式异常方法是 `getCause()` 和 `initCause()`：\n\
  \n```java\nThrowable getCause()\nThrowable initCause(Throwable causeExc)\n```\n\n\
  `getCause()` 方法返回当前异常的底层异常。如果没有底层异常，则返回 `null`。`initCause()` 方法将 `causeExc` 与调用的异常关联，并返回该异常的引用。因此，我们可以在异常创建后将其原因与异常关联。然而，原因异常只能设置一次。\n\
  \n因此，我们每个异常对象只能调用一次 `initCause()`。此外，如果原因异常是通过构造函数设置的，则我们不能再次使用 `initCause()` 方法设置它。通常情况下，`initCause()`\
  \ 用于为不支持上述两个额外构造函数的旧异常类设置原因。大多数 Java 内置异常都没有定义这些额外的构造函数。因此，如果我们需要为这些异常添加异常，将使用 `initCause()`。链式异常并不是每个程序都需要的。但在了解底层原因有用的情况下，它们提供了一种优雅的解决方案。\n\
  \n#### 示例 1.13\n\n```java\nclass ErrorTest13 {\n    int age;\n    void setAge(int\
  \ a) {\n        if(a>0)\n            age = a;\n        else {\n            NullPointerException\
  \ e = new NullPointerException(\"Admission Failed\");\n            e.initCause(new\
  \ ArithmeticException(\"Age is invalid\"));\n            throw e;\n        }\n \
  \   }\n    public static void main(String args[]) {\n        ErrorTest13 a1 = new\
  \ ErrorTest13();\n        try {\n            a1.setAge(20);\n            a1.setAge(-10);\n\
  \        } catch(NullPointerException e) {\n            System.out.println(e.getMessage());\n\
  \            System.out.println(e.getCause());\n        }\n    }\n}\n```\n\n输出:\n\
  ```\nAdmission Failed\nAge is Invalid\n```\n![sss](img/image34.jpg)\n\n在这个示例中，顶层异常是\
  \ `NullPointerException`。向它添加了一个原因异常 `ArithmeticException`。当异常从 `demroc()` 抛出时，它被\
  \ `main()` 捕获。在那里，显示顶层异常，随后是通过调用 `getCause()` 的底层异常。链式异常可以持续到所需的深度。因此，原因异常本身也可以拥有原因。请注意，过长的异常链可能意味着设计不当。链式异常并不是每个程序都需要的。但在了解底层原因有用的情况下，它们提供了一种优雅的解决方案。\n\
  \n### 三个新的 JDK 7 异常特性（已更新）\n\nJDK 7 为异常系统增加了三个有趣且实用的特性。第一个是自动在不再需要时释放资源（例如文件）。它是基于\
  \ `try` 语句的扩展形式，称为 `try-with-resources`，将在后续介绍文件的章节介绍。\n\n第二个新特性是 `multi-catch`，第三个有时被称为\
  \ `final rethrow` 或更精确的重抛。这两个特性在这里描述。\n\n`multi-catch` 特性允许两个或多个异常由同一个 `catch` 语句捕获。多个异常处理程序使用相同的代码序列来响应不同的异常并不常见。不需要逐个捕获每个异常类型，现在可以使用单个\
  \ `catch` 子句处理所有异常，避免代码重复。\n\n要使用 `multi-catch`，用 OR 符在 `catch` 子句分隔每个异常类型。每个 `multi-catch`\
  \ 参数都是隐式的 `final`。（如果需要，可以显式指定 `final`，但没有必要。）由于每个 `multi-catch` 参数都是隐式的 `final`，因此无法赋值新值。\n\
  \n这是一个使用 `multi-catch` 特性的 `catch` 语句，用于捕获 `ArithmeticException` 和 `ArrayIndexOutOfBoundsException`：\n\
  \n```java\ncatch(ArithmeticException | ArrayIndexOutOfBoundsException e)\n```\n\n\
  以下程序演示了 `multi-catch` 特性的用法：\n\n```java\n// Demo JDK 7 的 multi-catch 特性\nclass MultiCatch\
  \ {\n    public static void main(String args[]) {\n        int a=10, b=0;\n    \
  \    int vals[] = { 1, 2, 3 };\n        try {\n            int result = a / b; //\
  \ 产生 ArithmeticException\n            // vals[10] = 19; // 产生 ArrayIndexOutOfBoundsException\n\
  \            // 此 catch 子句捕获这两个异常。\n        } catch(ArithmeticException | ArrayIndexOutOfBoundsException\
  \ e) {\n            System.out.println(\"Exception caught: \" + e);\n        }\n\
  \        System.out.println(\"After multi-catch.\");\n    }\n}\n```\n\n当尝试除以零时，该程序将产生\
  \ `ArithmeticException`。如果你注释掉除法语句并移除下一行的注释符号，就会产生 `ArrayIndexOutOfBoundsException`。这两个异常都被同一个\
  \ `catch` 语句捕获。\n\n\n\n\n\n更精确的重抛（precise rethrow）功能将可以重抛的异常类型限制为：仅限于相关的 `try` 块抛出的检查异常（checked\
  \ exceptions）、未被之前的 `catch` 句处理、且是参数的子类或超类的异常。\n\n尽管这种能力可能并不经常需要，但它现在已经可以使用。为了使更精确的重抛功能生效，`catch`\
  \ 参数必须是有效最终的（effectively final），这意味着它在 `catch` 块内部不能被赋值新值，或者显式声明为 `final`。\n\n#\
  \ 使用异常\n\n异常处理为具有许多动态运行的复杂程序提供了一种强大的机制。将 `try`、`throw` 和 `catch` 视为处理程序逻辑中错误和异常边界条件的整洁方式。与某些使用错误返回代码来指示失败的语言不同，Java\
  \ 使用异常。因此，当一个方法可能会失败时，请让它抛出异常。\n\n这是一种处理失败模式更简洁的方法。最后一点：Java 的异常处理语句不应被视为非局部分支的通用机制。如果你这样做，只会让你的代码变得混乱并难以维护。\n\
  \n### 理论题\n\n1. 什么是异常？\n2. 我们如何定义 `try` 块？\n3. 我们如何定义 `catch` 块？\n4. 列出 Java 中可能发生的一些常见异常类型。给出示例。\n\
  5. 捕获所有类型的异常是必要的的？\n6. 一个 `try` 块可以使用多少个 `catch` 块。\n7. 创建一个可能产生三种异常的 `try` 块，然后结合必要的\
  \ `catch` 块以适当地捕获并处理它们。\n8. 什么是 `finally` 块？什么时候以及如何使用？给出一个合适的示例。\n9. 解释异常处理机制如何用于程序的调试。\n\
  \n![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)\n\
  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章节\n# ∞ 12 ∞\n# (多线程编程)\n\n## 引言\n\n\
  线程是程序内部的单一控制流。线程与进程非常相似。事实上，线程也被称为轻量级进程。\n\n## 线程对比 进程\n\n通常，不同的进程占用不同的内存空间。当 CPU\
  \ 从一个进程切换到另一个进程时，当前运行进程的状态会被保存，另一个进程的状态会被恢复。在状态切换期间没有进行任何有用工作。状态切换时间应该尽可能短，以最大化\
  \ CPU 的利用率。\n\n线程也也像独立的进程，但它们共享相同的内存和状态。独立的线程也有独立的状态，但与进程状态相比，该状态非常小。状态可能只包含程序计数器和栈指针。因此，从一个线程切换到另一个线程所需的时间非常短。因此，与进程相比，线程的上下文切换时间非常短。在多线程的情况下，CPU\
  \ 的利用率高于多进程的情况下。\n\n## 多线程程序\n\n多线程程序包含两个或多个可以并发运行的部分。此类程序的每个部分被称为线程，每个线程都定义了一条单独的执行路径。因此，多线程是多任务处理的一种特殊形式。\n\
  \n例如，一个程序可能有三个线程：\n* 一个负责打印。\n* 一个负责编辑。\n* 一个负责从互联网下载文件。\n\n所有这些线程可能都在并发运行，从而最大化了\
  \ CPU 的利用率。\n\n## 基于进程的多任务处理\n\n大多数操作系统允许我们同时运行两个或多个程序。这被称为基于进程的多任务处理。例如，我们可以运行一个\
  \ Java 程序并同时编辑一个 Word 文档。基于进程的多任务处理确保了大多数时间内会有程序要执行，从而提高了 CPU 的利用率。\n\n在基于进程的多任务处理中，程序是调度程序可以派发的最小代码单元。\n\
  \n## 基于线程的多任务处理\n\n线程是基于线程的多任务环境中最小的执行单元。一个进程可以被分为若干个并发执行的线程。这允许我们在单个程序中并发处理多个任务。\n\
  \n例如，我们可以在编辑 Word 文档的同时进行打印。基于线程的多任务处理提高了 CPU 的利用率。\n\n## Java 线程模型\n\nJava 运行时系统许多事情依赖线程，所有的类库都是为了多线程设计的。这有助于减少周期的浪费。\n\
  \n## 线程生命周期（线程状态）\n\n线程存在于几种状态。线程可以处于运行状态。一旦获得 CPU 时间，就可以进入就绪状态。运行中的线程可以被挂起，这会暂时停止它的活动。挂起的线程可以被恢复，使其从停止的地方继续执行。线程在等待资源时会进入阻塞状态。在任何时候，线程都可以被终止，停止其执行。一旦终止，线程将无法恢复。\n\
  \n### 1. 新生状态 (Newborn State)\n\n当我们创建一个线程对象时，线程诞生了，被称为处于新生状态。线程尚未被调度运行。在此状态下，我们只能对它执行以下操作之一：\n\
  1. 使用 `start()` 方法将其调度运行。\n2. 使用 `stop()` 方法将其杀死。\n\n如果被调度，它将移动到就绪状态。如果我们在此状态下尝试使用其他方法，将抛出异常。\n\
  \n### 2. 就绪状态 (Runnable State)\n\n就绪状态意味着线程已准备好执行并正在等待处理器的可用。也就是说，线程已加入等待执行的线程队列。如果所有线程的优先级相同，则以轮询的方式给它们分配时间片。\n\
  \n放弃控制权的线程会加入队列末尾并再次等待运行。然而，如果我们想让一个线程在轮到它之前放弃控制权并给另一个优先级相同的线程，它可以通过调用 `yield()`\
  \ 方法来实现。\n\n### 3. 运行状态 (Running State)\n\n运行意味着处理器已经将时间给了该线程进行执行。运行中的线程可能在以下情况之一放弃其控制权：\n\
  * 时间片结束。\n* 它被高优先级线程抢占。\n* 它让出 CPU（即自愿放弃控制权）。\n* 它完成了执行。\n* 它被其他线程停止。\n\n\n\n\n\n\
  * 它已使用 `suspend()` 方法挂起。被挂起的线程可以通过 `resume()` 方法恢复。这种方法在我们由于某些原因想要挂起线程一段时间，但不想杀死它时非常有用。\n\
  * 它被告告知等待直到某个事件发生。这是通过 `wait()` 方法实现的。可以使用 `notify()` 方法调度该线程再次运行。\n* 它正在执行某些 I/O\
  \ 操作。\n\n### 4. 阻塞状态 (Blocked State)\n\n当一个线程被阻止进入可运行状态以及随后的运行状态时，该线程被认为处于阻塞状态。这发生在线程为了满足某些要求而挂起、睡眠或等待时。阻塞线程被视为“不可运行”，但并未死亡，因此完全具备再次运行的资格。\n\
  \n### 5. 死亡状态 (Dead State)\n\n每个线程都有生命周期。运行线程在完成执行其 `run()` 方法后结束生命。它有自然死亡。然而，我们可以在任何状态下向它发送\
  \ `stop` 消息来杀死它，从而导致过早死亡。线程可以在一出生时被杀死，也可以在运行期间被杀死，甚至在处于“不可运行”（阻塞状态）时被杀死。\n\n###\
  \ 线程优先级 (Thread Priorities)\n\nJava 为每个线程分配了一个优先级，该优先级决定了与其他线程相比如何对待该线程。线程优先级是整数，指定了一个线程相对于另一个线程的相对优先级。\n\
  \n作为一个绝对值，优先级是没有意义的；如果只有一个线程在运行，高优先级线程的运行速度并不会比低优先级线程快。相反，线程的优先级被用于决定何时从一个运行线程切换到下一个。这被称为上下文切换（context\
  \ switch）。决定何时发生上下文切换的规则如下：\n\n* 线程可以自愿地（自己）放弃控制权。这是通过显式让出（yield）、睡眠或阻塞或等待 I/O 实现的在这种情况下，将检查所有其他线程，通常会将\
  \ CPU 分配给就绪的最高优先级线程。\n* 线程可能会被高优先级线程抢占。在这种情况下，一个不让出处理器的低优先级线程无论正在做什么，都会被一个高优先级线程简单地抢占。基本上，只要高优先级线程想要运行，它就会运行。这被称为抢占式多任务处理。\n\
  * 某些操作系统支持非抢占式基于优先级的调度。在这种情况下，高优先级线程只有在低优先级线程完成后才有机会运行。\n* 在两个相同优先级的线程竞争 CPU 周期的情况下，情况会有点复杂。对于像\
  \ windows98 这样的操作系统，等优先级的线程必须自愿地（自己）让出（放弃）控制权给同级线程。如果不这样做，其他线程将不会运行。\n\n注意：操作系统切换等优先级线程上下文的方式不同可能会产生问题。\n\
  \n### 同步 (Synchronization)\n\n由于多线程为我们的程序引入了异步行为，因此我们必须在需要时有一种方法来强制执行同步。例如，如果我们想让两个线程通信并共享复杂的数据结构（如链表），我们需要某种方法来确保它们之间不会发生冲突。\n\
  \n也就是说，我们必须防止一个线程在另一个线程正在读取数据时写入数据。Java 使用监视器（monitor）进行线程间同步。我们可以将监器想象是一个只能容纳一个线程的微小盒子。一旦线程进入监器，监器就可以用来保护共享资源不被多个线程同时操作。\n\
  \n大多数多线程系统以对象的形式的形式暴露，我们的程序必须显式地获取并锁定它们。Java 提供了一个更整洁的解决方案。\n\n没有“monitor”类，相反，每个对象都有自己的隐式监视器，当调用对象的某个同步（synchronized）方法时，会自动进入。一旦线程进入同步方法内部，其他线程就无法调用同一对象上的任何其他同步方法。这使我们能够编写非常清晰且简洁的多线程代码，因为同步支持内置在语言中。\n\
  \n### 消息传递 (Messaging)\n\n使用大多数其他语言进行编程时，我们必须依赖操作系统在线程之间建立通信。\n\n这无疑增加了开销。相比之下，Java\
  \ 提供了一种整洁、低成本的方法，让两个或多个线程通过调用所有对象都拥有的定义方法进行通信。Java 的消息系统允许线程进入对象的同步方法，然后在那里等待直到某个其他线程显式通知其离开。\n\
  \n### Thread 类和 Runnable 接口 (The Thread class and the Runnable interface)\n\nJava\
  \ 的多线程系统构建在 `Thread` 类、其方法及其辅助接口 `Runnable` 之上。该类属于 `java.lang` 包，因此显式导入。\n\n`Thread`\
  \ 封装了一个执行线程，由于我们无法直接引用运行线程的内部状态，我们将通过其代理（即产生它的的 `Thread` 实例）来处理它。要创建一个新线程，我们的程序将扩展\
  \ `Thread` 类或实现 `Runnable` 接口。`Thread` 类定义了几个帮助管理线程的方法：\n\n| 方法 |  |\n| :--- | :---\
  \ |\n| `String getName()` | 返回此线程的名称 |\n| `int getPriority()` | 返回此线程的优先级 |\n| `boolean\
  \ isAlive()` | 测试此线程仍在运行 |\n| `void join()` | 等待此线程死亡（终止） |\n| `void run()` | 如果此线程是用单独的\
  \ `Runnable` 对象构造的，则调用该 `Runnable` 对象的 `run` 方法；否则，此方法什么都不做并返回；如果扩展了类并在子类中重写了 `run()`\
  \ 方法，则调用重写的 `run()` 方法。 |\n| `void setName(String name)` | 将线程名称更改为参数 |\n| `static\
  \ void sleep(long millis)` | 让当前执行线程睡眠指定的毫秒 |\n| `static void sleep(long millis,\
  \ int nanos)` | 让当前执行线程睡眠指定的毫秒加上纳秒 |\n| `void start()` | 启动此线程执行，Java 虚拟机调用此线程的\
  \ `run` 方法 |\n| `static void yield()` | 让当前执行线程对象临时暂停并允许其他线程执行 |\n| `static Thread\
  \ currentThread()` | 返回当前执行线程的引用 |\n\n### 主线程 (The main thread)\n\n当 Java 程序启动时，一个线程立即运行。这通常被称为程序的主线程，因为它是程序开始时执行的线程。主线程是创建其他“子”线程的线程。\n\
  \n尽管主线程在程序启动时自动创建，但可以通过 `Thread` 对象对其进行控制。为了做到这一点，我们需要通过调用 `currentThread()` 方法获取它的引用，它是\
  \ `Thread` 类的公共静态成员。\n\n一旦获取了主方法的引用，我们就可以像控制其他线程一样控制它。\n\n示例 12.1\n\n以下示例演示了如何获取主线程的引用并使用类的方法访问其属性。\n\
  \n```java\nclass CurrentThreadTest {\n    public static void main (String args[])\
  \ {\n        Thread t = Thread.currentThread();\n        System.out.println(\"Current\
  \ thread:\" + t);\n        System.out.println(\"Name:\"+ t.getName());\n       \
  \ System.out.println(\"Priority:\"+ t.getPriority());\n        t.setName(\"MyThread\"\
  );\n        t.setPriority(Thread.MAX_PRIORITY);\n        System.out.println(\"After\
  \ name and priority change :\" + t);\n        System.out.println(\"Name:\" + t.getName());\n\
  \    }\n}\n```\n\n\n\n\n\n```java\nSystem.out.println(“Priority:” + t.getPriority());\n\
  \nfor (int n=1; n<=5; n++)\n{\n    System.out.println(n);\n    try {\n        Thread.sleep(1000);\n\
  \    } catch (InterruptedException e) {\n        System.out.println(“Main thread\
  \ interrupted”);\n    }\n}\n```\n\n**输出：**\n```text\nCurrent thread:Thread[main,5,main]\n\
  Name:main\nPriority:5\nAfter name and priority change :Thread[MyThread,10,main]\n\
  Name:MyThread\nPriority:10\n1\n2\n3\n4\n5\n```\n\n**注意 1：** `Thread` 类中的 `sleep(\
  \ )` 方法可能会抛 `InterruptedException`，这是一个受检异常。如果其他线程想要中断这个正在睡眠的线程，就会发生这种情况。\n\n**注意\
  \ 2：** 注意当 `t`（线程引用）作为 `println()` 的参数时产生的输出。它将按顺序显示：线程名称、它的优先级以及它的线程组名称。它的优先级是\
  \ 5，这是默认值，而 `main` 也是该线程所属线程组的名称。线程组是一个控制整个线程集合状态的数据结构。\n\n## 创建线程\n在最通用的意义上，我们通过实例化\
  \ `Thread` 类型的对象来创建线程。Java 识别了两种实现目标的方法：\n\n1. 我们可以实现 `Runnable` 接口\n2. 我们可以继承 `Thread`\
  \ 类本身。\n\n### 实现 Runnable\n创建线程最简单的方法是创建一个实现 `Runnable` 接口的类。要实现 `Runnable`，类只需要实现一个名为\
  \ `run()` 的单一方法。\n\n```java\npublic void run()\n```\n\n在 `run( )` 方法内部，我们将定义构成新线程的代码。`run(\
  \ )` 可以调用其他方法、使用其他类并声明变量，就像主线程一样。\n\n唯一的区别是 `run( )` 为我们程序中的另一个并发执行的线程建立了入口点。该线程将在\
  \ `run( )` 返回时结束。\n\n在我们创建了一个实现 `Runnable` 的类后，我们将在该类内部使用以下构造函数之一来实例化 `Thread` 类型的对象：\n\
  \n- `Thread(Runnable threadObj)`\n- `Thread(Runnable threadObj, String threadName)`\n\
  \n这里 `threadObj` 是调用其 `run` 方法的对象，`threadName` 是新线程的名称。在新线程创建后，在我们调用 `start( )`\
  \ 方法之前，它不会开始运行。\n\n`start( )` 方法将线程放入就绪队列（可运行状态）。每当线程被调度时，它的执行将从 `run( )` 方法开始。\n\
  \n### 示例 12.2\n```java\nclass A implements Runnable {\n    public void run() {\n\
  \        for(int i=1;i<=5;i++) {\n            System.out.println(“Child Thread:”\
  \ + i);\n        }\n        System.out.println(“Exiting child thread”);\n    }\n\
  }\nclass RunnableTest {\n    public static void main(String args[]) {\n        A\
  \ a1=new A();\n        Thread t1 = new Thread(a1,”Demo Thread”);\n        t1.start();\n\
  \        System.out.println(“Main thread exiting”);\n    }\n}\n```\n**输出：**\n```text\n\
  Main thread exiting\nChild Thread:1\nChild Thread:2\nChild Thread:3\nChild Thread:4\n\
  Child Thread:5\nExiting child thread\n```\n\n### 示例 12.3\n```java\nclass A implements\
  \ Runnable {\n    Thread t;\n    A() {\n        t= new Thread(this, “Demo Thread”);\n\
  \        System.out.println(“Child thread: “+ t);\n        t.start();\n    }\n \
  \   public void run() {\n        for (int i=1; i<=5; i++) {\n            System.out.println(“Child\
  \ Thread: ”+ i );\n            try {\n                Thread.sleep(500);\n     \
  \       } catch (InterruptedException e) {\n                System.out.println(e);\n\
  \            }\n        }\n        System.out.println (“Exiting Child thread”);\n\
  \    }\n}\nclass RunnableTest {\n    public static void main (String args[] ) {\n\
  \        A a1=new A();\n        for (int i=1; i<=5; i++) {\n            System.out.println(“Main\
  \ Thread:”+ i);\n            try {\n                Thread.sleep(1000);\n      \
  \      } catch (InterruptedException e) {\n                System.out.println(“thread\
  \ interrupted”);\n            }\n        }\n        System.out.println(“End of thread”);\n\
  \    }\n}\n```\n**输出：**\n```text\nChild thread: Thread[Demo Thread,5,main]\nMain\
  \ Thread:1\nChild Thread: 1\nChild Thread: 2\nMain Thread:2\nChild Thread: 3\nChild\
  \ Thread: 4\nMain Thread:3\nChild Thread: 5\nExiting Child thread\n... \n```\n\n\
  ### 继承 Thread 类\n创建线程的第二方法是创建一个继承 `Thread` 的新类，然后创建该类的实例。扩展类必须重写 `run()` 方法，这是新线程的入口点。它必须调用\
  \ `start()` 来执行新线程。\n\n### 示例 12.4\n```java\nclass A extends Thread {\n    A( )\
  \ {\n        super (“Test Thread”);\n        System.out.println(“Child thread:”\
  \ + this);\n        start();\n    }\n    public void run () {\n        for (int\
  \ i=1; i<=5; i++) {\n            System.out.println(“Child Thread:”+i);\n      \
  \      try {\n                sleep(500);\n            } catch(InterruptedException\
  \ e) {\n                System.out.println(“Child interrupted”);\n            }\n\
  \        }\n        System.out.println (“Exiting Child thread”);\n    }\n}\nclass\
  \ ThreadTest {\n    public static void main(String args[]) {\n        new A();\n\
  \        for (int i=1; i<=5; i++) {\n            System.out.println(“Main Thread:\
  \ “+i);\n            try {\n                Thread.sleep(1000);\n            } catch(InterruptedException\
  \ e) {\n                System.out.println(“thread interrupted”);\n            }\n\
  \        }\n        System.out.println (“Main thread exiting”);\n    }\n}\n```\n\
  **输出：**\n```text\nChild thread:Testing Thread,5,main]\nMain Thread: 1\nChild Thread:1\n\
  Child Thread:2\nMain Thread: 2\nChild Thread:3\nChild Thread:4\nMain Thread: 3\n\
  Child Thread:5\nExiting Child thread\nMain Thread: 4\nMain Thread: 5\nMain thread\
  \ exiting\n```\n**注意：** 如果 `Thread` 没有分配任何名称，它的名称将类似于 `Thread-1`、`Thread-2`、`Thread-3`\
  \ 等。\n\n## 选择方法\n线程类定义了几个可以被派生类重写的方法。在这些方法中，必须重写的是 `run()`。这也是我们在实现 `Runnable` 接口时要求的方法。\n\
  \n许多 Java 程序员认为只有当类被某种方式被增强或修改时才应该被扩展。因此，如果我们不会重写 `Thread` 的其他方法，简单的实现 `Runnable`\
  \ 接口可能是最好的。\n\n### 创建多个线程\n### 示例 12.5\n```java\nclass A implements Runnable {\n\
  \    String name;\n    Thread t;\n    A(String threadName) {\n        name=threadName;\n\
  \        t=new Thread(this, name);\n        System.out.println(“Child thread:”+t);\n\
  \        t.start();\n    }\n    public void run() {\n        for(int i=1;i<=5;i++)\
  \ {\n            System.out.println(t.getName())+ \":\" + i);\n            try {\n\
  \                Thread.sleep(1000);\n            } catch (InterruptedException\
  \ e) {\n                System.out.println(e); \n            }\n        }\n    \
  \    System.out.println(name+ “Exiting”);\n    }\n}\nclass MultiThreadTest {\n \
  \   public static void main(String args[] ) {\n        A a1=new A(“One”);\n    \
  \    A a2=new A (“Two”);\n        A a3=new A (“Three”);\n        try {\n       \
  \     Thread.sleep(10000);\n        } catch (InterruptedException e) {\n       \
  \     System.out.println(“main thread interrupted”);\n        }\n        System.out.println\
  \ (“Main thread exiting”);\n    }\n}\n```\n\n\n\n\n\n```text\nChild thread:Thread[One,5,main]\n\
  Child thread:Thread[Two,5,main]\nChild thread:Thread[Three,5,main]\nOne:1\nTwo:1\n\
  Three:1\nOne:2\nTwo:2\nThree:2\nOne:3\nTwo:3\nThree:3\nOne:4\nTwo:4\nThree:4\nOne:5\n\
  Two:5\nThree:5\nOneExiting\nTwoExiting\nThreeExiting\nMain thread exiting\n```\n\
  \n### 使用 `isAlive()` 和 `join()` 方法强制执行顺序\n\n通常我们我们希望主线程最后结束。实现这一点的一种方法是在 `main`\
  \ 中调用 `sleep()`。这是一种相当粗暴的方法。有两种方法可以判断线程是否已完成。首先，我们可以在线程对象上调用 `isAlive()`。该方法由 `Thread`\
  \ 类定义，其通用形式如下：\n\n```java\nfinal boolean isAlive()\n```\n\n如果调用它的线程仍在运行，则 `isAlive()`\
  \ 方法返回 `true`。否则返回 `false`。虽然 `isAlive()` 有时很有用，但我们更常用的用于等待线程完成的方法是 `join()`，如下所示：\n\
  \n```java\nfinal void join() throws InterruptedException\n```\n\n该方法会一直等待直到调用它的线程终止。`join()`\
  \ 的其他形式允许我们指定等待指定线程终止的最大时间。\n\n接下来的示例使用了 `join()` 来确保主线程是最后一个停止的。它还演示了 `isAlive()`\
  \ 方法。\n\n### 示例 12.6\n\n```java\nclass A implements Runnable\n{ \n  String name;\n\
  \  Thread t;\n  A(String threadName)\n  { \n      name=threadName;\n      t=new\
  \ Thread(this,name);\n      System.out.println(\"Child thread:\"+t);\n      t.start();\n\
  \  }\n  public void run()\n  { \n      for(int i=1;i<=5;i++)\n      { \n       \
  \ System.out.println(name + \":\"+ i );\n        try\n        { \n          Thread.sleep(1000);\n\
  \        }\n        catch(InterruptedException e)\n        { \n          System.out.println(e);\n\
  \        }\n      }\n      System.out.println(name + \"Exiting\");\n  }\n}\nclass\
  \ DemoJoin\n{ \n  public static void main(String args[])\n  { \n      A ob1=new\
  \ A(\"One\");\n      A ob2=new A(\"Two\");\n      A ob3=new A(\"Three\");\n    \
  \  System.out.println(\"Thread One is alive?:\"+ob1.t.isAlive());\n      System.out.println(\"\
  Thread Two is alive?:\"+ob2.t.isAlive());\n      System.out.println(\"Thread Three\
  \ is alive?:\"+ob3.t.isAlive());\n      try\n      { \n        ob3.t.join();\n \
  \       ob2.t.join();\n        ob1.t.join();\n      }\n      catch(InterruptedException\
  \ e)\n      { \n        System.out.println(\"main thread interrupted\");\n     \
  \ }\n      System.out.println(\"Thread One is alive?:\"+ ob1.t.isAlive());\n   \
  \   System.out.println(\"Thread Two is alive?:\"+ ob2.t.isAlive());\n      System.out.println(\"\
  Thread Three is alive?:\"+ ob3.t.isAlive());\n      System.out.println(\"Main thread\
  \ exiting\");\n  }\n}\n```\n\n```text\nChild thread:Thread[One,5,main]\nChild thread:Thread[Two,5,main]\n\
  Child thread:Thread[Three,5,main]\nThread One is alive?:true\nThread Two is alive?:true\n\
  Thread Three is alive?:true\nOne:1\nTwo:1\nThree:1\nOne:2\nTwo:2\nThree:2\nOne:3\n\
  Two:3\nThree:3\nOne:4\nTwo:4\nThree:4\nOne:5\nTwo:5\nThree:5\nOneExiting\nTwoExiting\n\
  ThreeExiting\nThread One is alive?:false\nThread Two is alive?:false\nThread Three\
  \ is alive?:false\nMain thread exiting\n```\n\n### 优先级\n\n线程优先级被线程调度器用于决定何时允许每个线程运行。与低优先级线程相比，高优先级线程会被优先调度。高优先级线程也可以抢占低优先级线程。例如，当一个低优先级线程正在运行，而一个高优先级线程从睡眠或等待\
  \ I/O 中恢复时，它将抢占低优先级线程。理论上，等优先级的线程应该获得同等的 CPU 访问权限。但 Java 设计用于工作在各种环境中。某些环境实现多任务的方式与其他环境完全不同。为了安全，共享相同优先级的线程应该偶尔让出控制权，确保所有线程在非抢占式操作系统下有机会运行。对于\
  \ CPU 密集型线程，我们应该确保它偶尔让出。要设置线程优先级，请使用 `Thread` 类的成员方法 `setPriority()`。其通用形式为：\n\n\
  ```java\nfinal void setPriority(int level)\n```\n\n`level` 的值必须在 `Thread.MIN_PRIORITY`\
  \ 和 `Thread.MAX_PRIORITY` 之间。目前，这些值分别是 1 和 10。要将线程恢复到默认优先级，指定 `Thread.NORM_PRIORITY`，它目前是\
  \ 5。这些优先级定义为 `Thread` 类中的常量。我们可以通过调用 `Thread` 类的 `getPriority()` 方法获取当前优先级设置，如下：\n\
  \n```java\nfinal void getPriority()\n```\n\nJava 的实现在调度方面存在巨大的差异。Windows XP/98/NT/2000\
  \ 版本的工作方式符合预期。然而，其他版本可能完全不同。大多数不一致性源于线程依赖抢占行为，而不是协作放弃 CPU。在 Java 中获得可预测的跨平台行为的最安全方法是使用主动放弃\
  \ CPU 控制权的线程。下面的示例演示了不同优先级的线程，它们在抢占式平台上的运行方式与非抢占式平台并不相同。\n\n### 示例 12.7\n\n```java\n\
  class Clicker implements Runnable\n{ \n  long click = 0;\n  Thread t;\n  volatile\
  \ boolean running=true;\n  Clicker (int p)\n  { \n      t=new Thread (this);\n \
  \     t.setPriority (p);\n  }\n  public void run ()\n  { \n      while (running)\n\
  \      { \n        click++;\n      }\n  }\n  void stop ()\n  { \n      running =\
  \ false;\n  }\n  void start ()\n  { \n      t.start ();\n  }\n}\nclass HiLoPri\n\
  { \n  public static void main (String args[])\n  { \n      Thread.currentThread().setPriority(Thread.MAX_PRIORITY);\n\
  \      Clicker hi = new Clicker(Thread.NORM_PRIORITY+1);\n      Clicker lo = new\
  \ Clicker(Thread.NORM_PRIORITY-1);\n      lo.start(); hi.start();\n      try\n \
  \     { \n        Thread.sleep (10000);\n      }\n      catch (InterruptedException\
  \ e)\n      { \n        System.out.println(e);\n      }\n      lo.stop(); hi.stop();\n\
  \      try\n      { \n        hi.t.join();\n        lo.t.join();\n      }\n    \
  \  catch (InterruptedException e)\n      { \n        System.out.println(e);\n  \
  \    }\n      System.out.println(\"Low : \" + lo.click);\n      System.out.println(\"\
  High : \" + hi.click);\n  }\n}\n```\n\n```text\nLow  : 63660819\nHigh : 2086505403\n\
  ```\n\n\n\n\n\n当两个或多个线程需要访问共享资源时，它们需要某种方式来确保资源同一时刻只有一个线程使用。实现这一过程的方法被称为同步。\n\n同步的关键是监视器（monitor）概念（也称为信号量）。监视器是一个被用作互斥锁的对象。在给定时间内，只有一个线程可以拥有监视器。\n\
  \n当一个线程获取锁时，认为它进入了监视器。所有其他尝试进入锁定监视器的线程将被挂起，直到第一个线程退出监视器。这些线程被称为等待监视器。拥有监视器的线程如果需要，可以重新进入同一个监视器。我们可以通过两种方式之一对代码进行同步：\n\
  \n(i) 使用 `synchronized` 方法\n\n(ii) 使用 `synchronized` 语句\n\n### 使用同步方法\n\n在 Java\
  \ 中，同步非常简单，因为所有对象都有与其关联的隐式监视器。要进入对象的监视器，只需调用用 `synchronized` 关键字修改的方法。当一个线程在 `synchronized`\
  \ 方法内部时，所有尝试调用该方法（或调用同一实例上的任何其他 `synchronized` 方法）的其他线程都必须 `wait()`。要退出监视器并将对象的控制权交给下一个等待线程，监视器的所有者只需从\
  \ `synchronized` 方法返回即可。\n\n### 示例 12.8\n\n以下程序说明了当三个线程并发运行的同时，它们生成的输出会发生混合。\n\n\
  ```java\nclass A\n{\n  void display(String msg)\n  {\n    System.out.print(\"[\"\
  \ + msg);\n    try\n      {\n        Thread.sleep(1000);\n      }\n      catch(InterruptedException\
  \ e)\n      {\n        System.out.println(e);\n      }\n    System.out.println(\"\
  ]\");\n  }\n}\nclass B implements Runnable\n{\n  A obj;\n  String msg;\n  Thread\
  \ t;\n  B(A obj1, String m)\n  {\n    msg = m;\n    obj = obj1;\n    t = new Thread(this);\n\
  \    t.start();\n  }\n  public void run()\n  {\n    obj.display(msg);\n  }\n}\n\
  class Synch1\n{\n  public static void main(String args[])\n  {\n    A a1 = new A();\n\
  \    B b1 = new B(a1,\"Hello\");\n    B b2 = new B(a1,\"World\");\n    B b3 = new\
  \ B(a1,\"Matrix\");\n  }\n}\n```\n\n输出：\n```\n[Hello[World[Matrix]\n]\n]\n```\n\n\
  正如我们看到的，通过调用 `sleep()`，该方法允许执行切换到另一个线程。这导致了三个消息字符串输出的混合。在这个程序中，没有任何机制阻止这三个线程同时在同一个对象上调用同一个方法。\n\
  \n这被称为竞态条件（race condition），因为这三个线程正在相互竞争以完成方法。这个示例使用 `sleep()` 来使效果可重复且明显。在大多数情况下，竞态条件更加微妙且不可预测，因为我们无法确定上下文切换何时会发生。这可能导致程序这次运行时是正确的，下次运行时却是错误的。\n\
  \n要做到这一点，我们只需要在 `display()` 方法的定义之前加上 `synchronized` 关键字。这可以防止一个线程在另一个线程使用 `display()`\
  \ 时进入该方法。\n\n### 示例 12.9\n\n混合问题通过简单将 `display()` 方法声明为 `synchronized` 方法得到了解决。\n\
  \n```java\nclass A\n{\n  synchronized void display(String msg)\n  {\n    System.out.print(\"\
  [\" + msg);\n    try\n      {\n        Thread.sleep(1000);\n      }\n      catch(InterruptedException\
  \ e)\n      {\n        System.out.println(e);\n      }\n    System.out.println(\"\
  ]\");\n  }\n}\nclass B implements Runnable\n{\n  A obj;\n  String msg;\n  Thread\
  \ t;\n  B(A obj1, String m)\n  {\n    msg = m;\n    obj = obj1;\n    t = new Thread(this);\n\
  \    t.start();\n  }\n  public void run()\n  {\n    obj.display(msg);\n  }\n}\n\
  class Synch2\n{\n  public static void main(String args[])\n  {\n    A a1 = new A();\n\
  \    B b1 = new B(a1,\"Hello\");\n    B b2 = new B(a1,\"World\");\n    B b3 = new\
  \ B(a1,\"Matrix\");\n  }\n}\n```\n\n输出：\n```\n[Hello]\n[World]\n[Matrix]\n```\n\
  注意：一旦线程进入了实例上的任何同步方法，其他线程无法进入该实例上的任何其他同步方法。然而，该实例上的非同步方法仍然可以被调用。\n\n### 使用同步语句\n\
  \n虽然在我们创建的类创建同步方法是实现同步的一种简单有效的方法，但它在所有情况下都不起。为了理解为什么，请考虑以下情况：假设我们要同步访问一个并非为多线程访问设计的类对象。也就是说，该类没有使用同步方法。此外，该类不是由我们创建的，而是由第三方创建；我们无法访问源代码。因此，我们无法在该类内部适当的方法上添加\
  \ `synchronized` 修饰符。如何通过 `synchronized` 访问此类类的对象呢？\n\n解决方案是将该类定义的方法调用放在同步块中。同步语句的一般形式是：\n\
  \n```java\nsynchronized(object)\n{\n  //需要同步的语句\n}\n```\n在这里，`object` 是被同步的对象的引用。同步块确保只有当当前线程成功进入\
  \ `object` 的监视器时，才会对 `object` 的成员方法进行调用。\n\n### 示例 12.10\n\n上述示例的替代版本，在 `run()`\
  \ 中使用同步块：\n\n```java\nclass A\n{\n  void display(String msg)\n  {\n    System.out.print(\"\
  [\" + msg);\n    try\n      {\n        Thread.sleep(1000);\n      }\n      catch(InterruptedException\
  \ e)\n      {\n        System.out.println(e);\n      }\n    System.out.println(\"\
  ]\");\n  }\n}\nclass B implements Runnable\n{\n  A obj;\n  String msg;\n  Thread\
  \ t;\n  B(A obj1, String m)\n  {\n    msg = m;\n    obj = obj1;\n    t = new Thread(this);\n\
  \    t.start();\n  }\n  public void run()\n  {\n    synchronized(obj)\n    {\n \
  \     obj.display(msg);\n    }\n  }\n}\nclass Synch3\n{\n  public static void main(String\
  \ args[])\n  {\n    A a1 = new A();\n    B b1 = new B(a1,\"Hello\");\n    B b2 =\
  \ new B(a1,\"World\");\n    B b3 = new B(a1,\"Matrix\");\n  }\n}\n```\n输出：\n```\n\
  [Hello]\n[World]\n[Matrix]\n```\n\n### 多线程在不同对象上调用相同方法\n\n### 示例 12.11\n\n线程可以在类的不同对象上调用同一个同步方法，因为每个对象都有不同的锁。这再次会导致混合。\n\
  \n```java\nclass A\n{\n  synchronized void display(String msg)\n  {\n    System.out.print(\"\
  [\" + msg);\n    try\n      {\n        Thread.sleep(1000);\n      }\n      catch(InterruptedException\
  \ e)\n      {\n        System.out.println(e);\n      }\n    System.out.println(\"\
  ]\");\n  }\n}\nclass B implements Runnable\n{\n  A obj;\n  String msg;\n  Thread\
  \ t;\n  B(A obj1, String m)\n  {\n    msg = m;\n    obj = obj1;\n    t = new Thread(this);\n\
  \    t.start();\n  }\n  public void run()\n  {\n    obj.display(msg);\n  }\n}\n\
  class Synch4\n{\n  public static void main(String args[])\n  {\n    A a1 = new A();\n\
  \    A a2 = new A();\n    A a3 = new A();\n    B b1 = new B(a1,\"Hello\");\n   \
  \ B b2 = new B(a2,\"World\");\n    B b3 = new B(a3,\"Matrix\");\n  }\n}\n```\n\n\
  输出：\n```\n[Hello[World[Matrix]\n]\n]\n```\n\n\n\n\n\n# 使用静态同步方法\n\n## 示例 12.12\n\
  \n在下面的示例中，尽管我们在不同的对象上调用了 `display()` 方法，输出并没有混杂。这是因为 `display()` 方法是 `static` 的，因此锁是针对整个类\
  \ `A` 获取的，而不是单个对象。\n\n```java\nclass A\n{\n    static synchronized void display(String\
  \ msg)\n    {\n      System.out.print(\"[\" + msg);\n      try\n      {\n      \
  \  Thread.sleep(1000);\n      }\n      catch(InterruptedException e)\n      {\n\
  \        System.out.println(e);\n      }\n      System.out.println(\"]\");\n   \
  \ }\n}\nclass B implements Runnable\n{\n    A obj;\n    String msg;\n    Thread\
  \ t;\n    B(A obj1, String m)\n    {\n      msg = m;\n      obj = obj1;\n      t\
  \ = new Thread(this);\n      t.start();\n    }\n    public void run()\n    {\n \
  \     obj.display(msg);\n    }\n}\nclass Synch5\n{\n    public static void main(String\
  \ args[])\n    {\n      A a1 = new A();\n      A a2 = new A();\n      A a3 = new\
  \ A();\n      B b1 = new B(a1,\"Hello\");\n      B b2 = new B(a2,\"World\");\n \
  \     B b3 = new B(a3,\"Matrix\");\n    }\n}\n```\n\n**输出：**\n```\n[Hello]\n[World]\n\
  [Matrix]\n```\n\n# 线程间通信\n\n之前讨论过，多线程通过将任务划分为离散的逻辑单元取代事件循环编程。线程还证明了另一个优点：它们消除了轮询。轮询通常通过循环实现，反复检查某些条件。一旦条件成立，就会采取适当的操作。\n\
  \n这浪费了 CPU 周期。例如，考虑经典的队列问题，一个线程在生产数据，另一个线程在消费数据。为了让问题更具交互性，假设生产者必须等待消费者完成后才能生成更多数据。在轮询系统中，消费者在等待生产者生产数据时会浪费许多\
  \ CPU 周期。一旦生产者完成，它就会开始轮询，在等待消费者完成时浪费更多 CPU 周期，以此此类推。\n\n为了避免轮询，Java 通过 `wait()`、`notify()`\
  \ 和 `notifyAll()` 方法包含了一种优雅（智能）的进程间通信机制。这些方法被实现为 `Object` 类中的 `final` 方法，因此所有类都拥有它们。这三个方法都在\
  \ `synchronized` 上文中文中调用。使用这些方法有某些规则。\n\n- `wait()` 告诉调用线程放弃监视器并睡眠，直到其他线程进入同一个监视器并调用\
  \ `notify()`。\n- `notify()` 唤醒在同一对象上调用 `wait` 的一个线程（通常是第一个线程）。\n- `notifyAll()`\
  \ 唤醒所有在同一对象上调用过 `wait()` 的线程。通常优先级最高的线程将运行。\n\n这些方法在 `Object` 类中声明，如下所示：\n\n```java\n\
  final void wait() throws InterruptedException\nfinal void notify()\nfinal void notifyAll()\n\
  ```\n\n## 示例 12.13\n\n下面的示例程序错误地实现了简单形式的生产者/消费者问题。它由四个类组成：`Q`，我们试图同步的队列；`Producer`，产生队列条目的线程对象；`Consumer`，消费队列条目的线程对象；以及\
  \ `PC`，创建单个 `Q`、`Producer` 和 `Consumer` 的微类。\n\n```java\nclass Q\n{ \n    int n;\n\
  \    synchronized int get()\n    { \n      System.out.println(\"Got:\"+n);\n   \
  \   return n;\n    }\n    synchronized void put(int n)\n    {\n      this.n=n;\n\
  \      System.out.println(\"Put:\"+n);\n    }\n}\nclass Producer implements Runnable\n\
  {\n    Q q1;\n    Producer(Q q2)\n    {\n      q1=q2;\n      new Thread(\"Producer\"\
  ).start();\n    }\n    public void run()\n    { \n      int i=0;\n      while(true)\n\
  \      { \n        q1.put(++i);\n      }\n    }\n}\nclass Consumer implements Runnable\n\
  {\n    Q q1;\n    Consumer(Q q2)\n    {\n      q1=q2;\n      new Thread(\"Consumer\"\
  ).start();\n    }\n    public void run()\n    { \n      while (true)\n      {\n\
  \        q1.get();\n      }\n    }\n}\nclass PC\n{\n    public static void main(String\
  \ args[])\n    {\n      Q q1=new Q();\n      new Producer(q1);\n      new Consumer(q1);\n\
  \      System.out.println(\"Press Control-C to stop\");\n    }\n}\n```\n\n尽管 `Q`\
  \ 上的 `put()` 和 `get()` 方法是同步的，但没有什么能阻止生产者超过消费者，也没有能阻止消费者两次消费同一个值。因此，我们可能会得到如下所示的错误输出：\n\
  \n**输出：**\n```\nPress Control-C to stop\nPut:1\nPut:2\nPut:3\nPut:4\nPut:5\nPut:6\n\
  Put:7\nGot:7\nGot:7\nGot:7\nGot:7\nGot:7\nGot:7\nPut:8\nPut:9\nPut:10\nPut:11\n\
  Put:12\nPut:13\nPut:14\nPut:15\nGot:15\nGot:15\nGot:15\nGot:15\nGot:15\nGot:15\n\
  ```\n\n## 示例 12.14\n\n在 Java 中编写此程序的正确方法是使用 `wait()` 和 `notify()` 进行双向信号，如下所示：\n\
  \n```java\nclass Q\n{ \n    int n;\n    boolean valueSet=false;\n    synchronized\
  \ int get ()\n    { \n      if(!valueSet)\n      { \n        try\n        { \n \
  \         wait();\n        }\n        catch (InterruptedException e)\n        {\
  \ \n          System.out.println (e);\n        }\n      }\n      System.out.println(\"\
  Got :\" + n);\n      valueSet = false;\n      notify();\n      return n;\n    }\n\
  \    synchronized void put (int n)\n    { \n      if(valueSet)\n      { \n     \
  \   try\n        { \n          wait();\n        }\n        catch (InterruptedException\
  \ e)\n        { \n          System.out.println (e);\n        }\n      }\n      this.n=n;\n\
  \      valueSet =true;\n      System.out.println(\"Put :\" + n);\n      notify();\n\
  \    }\n}\nclass Producer implements Runnable\n{\n    Q q1;\n    Producer(Q q2)\n\
  \    {\n      q1=q2;\n      new Thread(\"Producer\").start();\n    }\n    public\
  \ void run()\n    { \n      int i=0;\n      while(true)\n      { \n        q1.put(++i);\n\
  \      }\n    }\n}\nclass Consumer implements Runnable\n{\n    Q q1;\n    Consumer(Q\
  \ q2)\n    {\n      q1=q2;\n      new Thread(\"Consumer\").start();\n    }\n   \
  \ public void run()\n    { \n      while (true)\n      {\n        q1.get();\n  \
  \    }\n    }\n}\nclass PC2\n{\n    public static void main(String args[])\n   \
  \ {\n      System.out.println(\"Press Control-C to stop\");\n      Q q1=new Q();\n\
  \      new Producer(q1);\n      new Consumer(q1);\n    }\n}\n```\n\n# 死锁\n\n我们需要避免的与多任务相关的特殊错误类型是死锁，它发生在两个线程对一对同步对象产生循环依赖。例如，假设一个线程进入对象\
  \ `X` 的监视器，另一个线程进入对象 `Y` 的监视器。如果 `X` 中的线程尝试调用 `Y` 上的任何同步方法，它将如预期地阻塞。然而，如果 `Y` 中的线程反过来尝试调用\
  \ `X` 上的任何同步方法，它将永远等待，因为为了访问 `X`，它必须释放对 `Y` 的锁以便第一个线程能够完成。死锁是一个很难调试的错误，原因有两个：\n\n\
  (i) 通常情况下，它只在两个线程的时间分片恰好合适时才会发生。\n(ii) 它可能涉及两个以上的线程和两个同步对象。\n\n## 示例 12.15\n\n```java\n\
  class A\n{\n    synchronized void foo(B b1)\n    {\n```\n\n\n\n\n\n```java\nSystem.out.println(\"\
  Method foo called and then blocked\");\n\ntry {\n    Thread.sleep(1000);\n} catch(InterruptedException\
  \ e) {\n    System.out.println(e.getMessage());\n}\nSystem.out.println(\"Trying\
  \ to call b1.last()\");\nb1.last();\n\n}\n\nsynchronized void last() {\n    System.out.println(\"\
  This will not be printed\");\n}\n\nclass B {\n    synchronized void bar(A a1) {\n\
  \        System.out.println(\"Method bar called and then blocked\");\n        try\
  \ {\n            Thread.sleep(1000);\n        } catch(InterruptedException e) {\n\
  \            System.out.println(e.getMessage());\n        }\n        System.out.println(\"\
  Trying to call a1.last()\");\n        a1.last();\n    }\n\n    synchronized void\
  \ last() {\n        System.out.println(\"This will not be printed\");\n    }\n}\n\
  \nclass DeadLock implements Runnable {\n    A a1 = new A();\n    B b1 = new B();\n\
  \n    DeadLock() {\n        Thread t = new Thread(this);\n        t.start();\n \
  \       a1.foo(b1);\n    }\n\n    public void run() {\n        b1.bar(a1);\n   \
  \ }\n\n    public static void main(String args[]) {\n        new DeadLock();\n \
  \   }\n}\n```\n\n输出:\n```\nMethod foo called and then blocked\nMethod bar called\
  \ and then blocked\nTrying to call b1.last()\nTrying to call a1.last()\n```\n\n\
  ### Java 1.1 及更早版本的挂起、恢复和停止线程：\n\n在 Java 2 之前，`Thread` 类定义了 `suspend()` 和 `resume()`\
  \ 用于暂停和重启线程的执行。它们的形式如下：\n\n```java\nfinal void suspend()\nfinal void resume()\n\
  ```\n\n#### 示例 12.16:\n\n```java\nclass A implements Runnable {\n    String name;\n\
  \    Thread t;\n\n    A(String threadname) {\n        name = threadname;\n     \
  \   t = new Thread(this, name);\n        System.out.println(\"Child Thread: \" +\
  \ t);\n        t.start();\n    }\n\n    public void run() {\n        for(int i =\
  \ 1; i <= 30; i++) {\n            System.out.println(name + \": \" + i);\n     \
  \       try {\n                Thread.sleep(100);\n            } catch(InterruptedException\
  \ e) {\n                System.out.println(e);\n            }\n        }\n     \
  \   System.out.println(name + \" exiting\");\n    }\n}\n\nclass SuspendResume {\n\
  \    public static void main(String args[]) {\n        A ob1 = new A(\"One\");\n\
  \        A ob2 = new A(\"Two\");\n        try {\n            Thread.sleep(1000);\n\
  \            ob1.suspend();\n            System.out.println(\"Suspending one\");\n\
  \            Thread.sleep(1000);\n            ob1.resume();\n            System.out.println(\"\
  Resuming one\");\n            ob2.suspend();\n            System.out.println(\"\
  Suspending two\");\n            Thread.sleep(1000);\n            ob2.resume();\n\
  \            System.out.println(\"Resuming two\");\n        } catch(InterruptedException\
  \ e) {\n            System.out.println(e);\n        }\n        try {\n         \
  \   System.out.println(\"Waiting for threads to finish\");\n            ob1.join();\n\
  \            ob2.join();\n        } catch(InterruptedException e) {\n          \
  \  System.out.println(e);\n        }\n    }\n}\n```\n\n输出:\n```\nChild Thread: Thread[One,5,main]\n\
  Child Thread: Thread[Two,5,main]\nOne: 1\nTwo: 1\nTwo: 2\nOne: 2\nTwo: 3\nOne: 3\n\
  Two: 4\nOne: 4\nOne: 5\nTwo: 5\nSuspending one\nTwo: 6\nTwo: 7\nTwo: 8\nOne: 8\n\
  One: 9\nTwo: 9\nTwo: 10\nOne: 10\nResuming one\nSuspending two\nOne: 11\nOne: 12\n\
  One: 13\nOne: 14\nOne: 15\nOne: 16\nOne: 17\nOne: 18\nOne: 19\nOne: 20\nResuming\
  \ two\nOne: 21\nTwo: 21\nOne: 22\nTwo: 22\nOne: 23\nTwo: 23\nOne: 24\nTwo: 24\n\
  One: 25\nTwo: 25\nOne: 26\nTwo: 26\nOne: 27\nTwo: 27\nOne: 28\nTwo: 28\nOne: 29\n\
  Two: 29\nOne: 30\nTwo: 30\nOne exiting\nTwo exiting\nWaiting for threads to finish\n\
  ```\n\n注意：`Thread` 类还定义了一个名为 `stop()` 的方法来停止线程。其签名如下：\n\n```java\nfinal void stop()\n\
  ```\n一旦线程被停止，就无法通过 `resume()` 方法重新启动。\n\n### 使用 Java 2 挂起、恢复和停止线程\n\n#### 示例 12.17:\n\
  \n```java\nclass A implements Runnable {\n    String name;\n    Thread t;\n    boolean\
  \ suspendFlag;\n\n    A(String threadname) {\n        name = threadname;\n     \
  \   t = new Thread(this, name);\n        System.out.println(\"Child Thread: \" +\
  \ t);\n        suspendFlag = false;\n        t.start();\n    }\n\n    void myspend()\
  \ {\n        suspendFlag = true;\n    }\n\n    synchronized void myresume() {\n\
  \        suspendFlag = false;\n        notify();\n    }\n\n    public void run()\
  \ {\n        for(int i = 1; i <= 5; i++) {\n            System.out.println(name\
  \ + \": \" + i);\n            try {\n                Thread.sleep(200);\n      \
  \      } catch(InterruptedException e) {\n                System.out.println(e);\n\
  \            }\n            synchronized(this) {\n                if(suspendFlag)\
  \ {\n                    wait();\n                }\n            }\n        }\n\
  \        System.out.println(name + \" exiting\");\n    }\n}\n\nclass SuspendResume1\
  \ {\n    public static void main(String args[]) {\n        A ob1 = new A(\"One\"\
  );\n        A ob2 = new A(\"Two\");\n        try {\n            Thread.sleep(1000);\n\
  \            ob1.myspend();\n            System.out.println(\"Suspending one\");\n\
  \            Thread.sleep(1000);\n            ob1.myresume();\n            System.out.println(\"\
  Resuming one\");\n            ob2.myspend();\n            System.out.println(\"\
  Suspending two\");\n            Thread.sleep(1000);\n            ob2.myresume();\n\
  \            System.out.println(\"Resuming two\");\n        } catch(InterruptedException\
  \ e) {\n            System.out.println(e);\n        }\n        try {\n         \
  \   System.out.println(\"Waiting for threads to finish\");\n            ob1.join();\n\
  \            ob2.join();\n        } catch(InterruptedException e) {\n          \
  \  System.out.println(e);\n        }\n        System.out.println(\"main exiting\"\
  );\n    }\n}\n```\n\n输出:\n```\nChild Thread: Thread[One,5,main]\nChild Thread: Thread[Two,5,main]\n\
  One: 1\nTwo: 1\nOne: 2\nTwo: 2\nOne: 3\nTwo: 3\nOne: 4\nTwo: 4\nOne: 5\nTwo: 5\n\
  Suspending one\nOne: 6\nOne: 7\nOne: 8\nResuming one\nOne: 9\nOne: 10\nSuspending\
  \ two\nTwo: 6\nTwo: 7\nTwo: 8\nTwo: 9\nTwo: 10\nResuming two\nTwo: 11\nTwo: 12\n\
  Two: 13\nTwo: 14\nTwo: 15\nOne exiting\nTwo exiting\nWaiting for threads to finish\n\
  main exiting\n```\n\n\n\n\n通过指定成员访问性修饰符，类可以控制哪些信息是客户端（即其他类）可见的。这些修饰符帮助类定义一个约，使用户确切知道该类提供了哪些服务。\n\
  \n成员的访问性/可见性可以是以下之一：\n\n- `public`\n- `protected`\n- `default`（也称为包访问权限）\n- `private`\n\
  \n注意：成员访问性修饰符只有当类（或其某个子类）对客户端可见时才具有意义。另请注意，一个成员只能指定一个访问性修饰符。\n\n该讨论同时适用于类的实例成员和静态成员。\n\
  \n### 3. 接口的成员访问性/可见性修饰符\n\n可以与接口数据成员和方法使用的访问性/可见性修饰符只有 `public`。\n\n`public` 也是接口成员的隐式访问性/可见性修饰符，即使我们不使用\
  \ `public` 修饰符，成员总是被隐式认为是 `public`。\n\n### 4. 顶层类的修饰符\n\n除了可见性修饰符，我们还可以在顶层类之前使用以下修饰符：\n\
  \n### (a) abstract\n可以使用关键字 `abstract` 指定类，表示它不能被实例化。包含抽象方法的类必须声明为 `abstract`，否则将无法编译。不包含抽象方法的类也可以声明为\
  \ `abstract`。此类类可以作为许多子类的基类。\n\n### (b) final\n可以将类声明为 `final`，表示它不能被扩展。`final`\
  \ 类标记了其实现继承层次体系的下边界。只有定义完整的类才能被声明为 `final`。一个类不能既是 `final` 又是 `abstract`。\n\n以下是\
  \ `final` 类的一些重要特性。\n\n- `final` 类的所有方法也都是 `final`，即它们具有具体的实现且不能被重写。\n- 使用 `final`\
  \ 类时，某些类型检查会变得更快。事实上，许多类型检查变成了编译时检查，错误可以更早地捕获。如果编译器遇到对 `final` 类的引用，它知道所引用的对象恰是该类型。\n\
  - 编译器能够对 `final` 方法执行某些代码优化，因为对此类成员可以做出某些假设。\n- 当调用非 `final` 方法时，运行时系统确定对象的实际类，将方法调用绑定到该类型方法的正确实现，然后调用该实现。\n\
  - 在 `final` 方法的情况下，我们确定类型子类不能重写该方法，因此绑定是在编译时完成的，类似于 `private` 和 `static` 方法，这无疑会提高性能。\n\
  - 在 `final` 方法的情况下，编译器可以将调用替换为方法的实际体，类似于宏。这种机制被称为“内联”（inlining）。在 C++ 中，我们有选项将函数声明为\
  \ `inline` 的选项（尽管最终决定由编译器做出），但在 Java 中，由编译器做出决定。\n\n### 5. 顶层接口的其他修饰符\n\n### (a)\
  \ abstract\n这是除可见性修饰符外，唯一可以与接口配合使用的修饰符。\n\n接口仅指定方法原型而不包含任何实现：它们从本质上讲是隐式抽象的（即：它们不能被实例化）。我们可以将接口声明为\
  \ `abstract`，但这是多余的，因为接口总是抽象的。\n\n### 6. 接口成员的其他修饰符\n\n数据成员的其他修饰符：\n除了可见性修饰符 `public`\
  \ 外，我们还可以使用修饰符 `static` 和 `final`。虽然可以使用这些修饰符，但它是多余的，因为所有数据成员都是隐式的 `public`、`static`\
  \ 和 `final`。\n\n方法的其他修饰符：\n除了可见性修饰符 `public` 外，我们还可以使用修饰符 `abstract`。虽然可以使用 `abstract`\
  \ 修饰符，但它是多余的，因为所有方法都是隐式的 `public` 且抽象的。\n\n### 7. 类成员的其他修饰符\n\n可以通过以下关键字在声明中指定字段和/方法的某些特性：\n\
  \n1. `static`\n2. `final`\n3. `abstract`\n4. `synchronized`\n5. `native`\n6. `transient`\n\
  7. `volatile`\n\n### A. static 修饰符\n`static`成员属于它们被定义的类，而不属于该类的任何实例。根据类中静态成员的访问性修饰符，客户端可以使用类名或通过类的对象引用来访问这些成员。\n\
  \n**静态变量（也称为类变量）：**\n这些变量只存在于它们定义的类中。当类加载时，如果没有指定显式初始化表达式，静态变量将初始化为它们的默认值。静态成员变量通常用于跟踪有关实例的全局信息。\n\
  \n**静态方法：**\n这些也被称为类方法。类中的 `static` 方法可以直接访问类中的其他静态成员。它不能访问类的实例（即：非静态）成员，因为没有与静态方法相关的对象概念。\n\
  \n然而，请注意，类中的 `static` 方法始终可以使用类类型的引用来访问其成员，无论这些成员是否是静态的。一个典型的静态方法可能会代表整个类和/或类的对象执行某些任务。\n\
  \n子类中的实例不能重写父类中的 `static` 方法。编译器将对此标记为错误（意味着父类中的静态方法不能被子类中的非静态方法重写）。`static` 方法是类特定的，不属于任何对象，而重写的方法是代表子类对象调用的。然而，子类中的\
  \ `static` 方法可以隐藏父类中的 `static` 方法。\n\n声明为 `static` 的有几个限制：\n- 它们只能调用其他 `static`\
  \ 方法。\n- 它们只能访问静态数据成员。\n- 它们不能以任何方式引用 `this` 或 `super`\n\n**静态初始化块：**\n一个 Java 类可以有一个或多个静态初始化块。静态初始化块的语法如下：\n\
  \n```static\nstatic {\n    code\n}\n```\n\n静态初始化块可以被认为是一种静态方法，它在类加载后立即隐式/自动调用。静态块在以下情况下非常有用：\n\
  - 静态变量的动态初始化。\n- 在加载类时执行一次性活动。例如，加载 jdbc 驱动类。\n- 在 `Hashtable`、`HashMap`、`Properties`\
  \ 等中加载小型数据库/配置文件。\n\n### B. final 修饰符\n`final` 修饰符可以：\n- 局部变量\n- 实例变量/数据成员\n- 静态变量/数据成员\n\
  - 实例方法\n\n**final 变量：**\n`final` 变量通常在声明时初始化，赋值后无法修改。以下是与 `final` 变量的一些重要点：\n\n\
  - `final` 变量是一个常量，尽管被称为变量。一旦初始化，其值无法更改。这适用于实例、静态和局部变量，包括声明为 final 的参数。\n- `final`\
  \ 是唯一适用于局部变量或形式参数的修饰符。\n- 原始数据类型的 `final` 变量一旦初始化就无法更改其值。\n- 引用类型的 `final` 变量一旦初始化就无法更改其引用值，但它所指示的对象的状态仍然可以更改。\n\
  - 通常 `final` 变量在声明时初始化，但并非必须。此类 `final` 变量也称为空白 final 变量（blank final variable），在在使用之前必须初始化一次。\n\
  \n\n\n\n\n*   最后的静态静态变量通常用于定义具名常量，例如 `Integer.MAX_VALUE`，它是 int 的最大值。\n\n## 局部 final\
  \ 变量:-\n\n### 示例 13.1\n以下示例说明了局部 final 变量可以如上所述地留空，但在第一次使用之前必须进行初始化。变量 `x` 在显示器上显示其值之前进行了初始化。\n\
  \n```java\nclass FinalTest1 // 使用了空 final \n{\n    public static void main(String\
  \ args[])\n    {\n        final int x;  // 必须在声明时初始化\n        x = 50;\n        System.out.println(x);\n\
  \    }\n}\n```\n输出：`50`\n\n### 示例 13.2\n以下代码将无法编译，因为 final 变量被初始化了两次。\n\n```java\n\
  class FinalTest2 // 使用了空 final \n{\n    public static void main(String args[ ])\n\
  \    {\n        final int x; \n        x=50;\n        System.out.println(x);\n \
