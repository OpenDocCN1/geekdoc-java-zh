  2.   {\n3.     void push(int x);\n4.     int pop();\n5.   }\n6. class Stack implements\
  \ Two_Methods\n7.   {\n8.     int[] arr = new int[5];\n9.     int top = -1;\n10.\
  \    public void push(int item)\n11.    {\n12.      if(top == 4)\n13.        System.out.println(\"\
  溢出\");\n14.        return;\n15.      }\n16.      top++;\n17.      arr[top] = item;\n\
  18.    }\n19.    public int pop()\n20.    {\n21.      if(top == -1)\n22.       \
