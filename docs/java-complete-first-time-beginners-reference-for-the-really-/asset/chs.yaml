  \ + y);\n    }\n    public static void main(String args[])\n    {\n        A a1\
  \ = new A();\n        A a2 = new A();\n        a1.setdata(10,20);\n        a2.setdata(5,7);\n\
  \        a1.display();\n        a2.display();\n    }\n}\n```\n输出:\n```\n10  20\n\
  5  7\n```\n\n### 类成员的修饰符 / 可见性标签\n\n可见性修饰符仅适用于类的成员，而不适用于局部变量。\n\n- `private`：如果我们在成员变量或方法上指定修饰符\
  \ `private`，那么该成员在声明它的类之外将不可见。这将对其他类隐藏该类的成员。\n- `public`：如果我们在成员变量或方法上指定修饰符 `public`，那么该成员对所有类可见。该成员即使在包外部也可以被访问。`main()`\
  \ 方法始终定义为公共，因为 `main()` 方法是由 JVM 访问的，而 JVM 位于定义 `main()` 方法类的外部。\n- `protected`：声明为\
  \ `protected` 的成员可以被同一包中的所有类访问。受保护的成员也可以被其他包的任何子类访问。\n- `default / 无修饰符`：如果在成员之前没有指定可见性修饰符，则该成员可以被同一包中的所有类访问。该成员不能在包外被访问。\n\
  \n### 类或接口的可见性修饰符\n\n- `public`：如果一个类要对所有包的类可见，则它必须通过指定修饰符 `public` 声明为 `public`，该修饰符应该出现在\
  \ `class` 关键字之前。\n- `default / 无修饰符`：如果类之前没有任何访问/可见性修饰符，则其可见性仅限于它被定义的包（类组）内。\n\n\
  ### this 关键字\n\n`this` 是一个引用变量，存储了当前用于调用方法的对象的引用。在运行时，`this` 的引用会被调用对象的引用所替换。有时，方法需要引用调用它的对象。这可以通过在任何方法内部使用\
  \ `this` 来引用当前对象来完成。注：局部变量会隐藏实例变量，因此必须显式地使用 `this` 关键字。\n\n### 实例变量隐藏\n\n众所周知，在\
  \ Java 中在同一个作用域内声明两个同名的局部变量是非合法的。但我们可以拥有与类的实例变量同名的局部变量（成员方法的参数）。当局部变量与实例变量同名时，局部变量会隐藏该实例变量。但\
  \ `this` 关键字允许即使在局部变量隐藏了它的情况下，我们仍能引用到实例变量。\n\n### 示例 5.4 this 关键字的使用\n\n```java\n\
  class A\n{\n    private int x;\n    private int y;\n    void setdata(int x, int\
  \ y)\n    {\n        this.x = x; //this.x 是类成员 x 是局部变量\n        this.y = y;\n  \
  \  }\n    void display()\n    {\n        System.out.println(x + \"\\t\" + y);\n\
  \    }\n}\nclass ClassTest4\n{\n    public static void main(String args[])\n   \
  \ {\n        A a1 = new A();\n        A a2 = new A();\n        a1.setdata(10,20);\n\
  \        a2.setdata(5,7);\n        a1.display();\n        a2.display();\n    }\n\
  }\n```\n输出:\n```\n10  20\n5  7\n```\n\n### 方法重载\n\n我们可以拥有多个同名的方法，只要它们的参数数量、类型或参数顺序不同。这被称为方法重载。在调用重载方法时，传递的实际参数类型可能与任何重载方法的形式参数不匹配。在这种情况下，参数将提升到更高类型直到找到匹配。如果在提升参数后仍未找到匹配，则发生编译错误。\n\
  \n### 示例 5.5 在此示例中，有两个同名的 `setdata()` 方法，但参数不同，因此这就是方法重载。\n\n```java\nclass A\n\
  {\n    private int x,y;\n    void setdata(int x1)\n    {\n        x = y = x1;\n\
  \    }\n    void setdata(int x1, int y1)\n    {\n        x = x1;\n        y = y1;\n\
  \    }\n    void display()\n    {\n        System.out.println(x + \"\\t\" + y);\n\
  \    }\n}\nclass ClassTest5\n{\n    public static void main(String args[])\n   \
  \ {\n        A a1 = new A();\n        a1.setdata(5);\n        a1.display();\n  \
  \      A a2 = new A();\n        a2.setdata(10,20);\n        a2.display();\n    }\n\
  }\n```\n输出:\n```\n5  5\n10  20\n```\n\n\n\n\n\n### 默认构造函数\n每个类都有一个默认构造函数（如果没有定义显式构造函数），该构造函数不接受任何参数，且体不包含任何语句。编译器会自动生成默认构造函数。\n\
  \n一旦我们添加了自己的构造函数，编译器就会停止生成默认构造函数。当我们不在类中创建任何构造函数时，`JVM` 将创建默认构造函数，并将实例变量初始化为默认值\
  \ `null` 或 0。\n\n### 示例 5.6 默认构造函数的用法\n```java\nclass A\n{\n    private int x;\n\
  \    private int y;\n    void display()\n    {\n        System.out.println(x + \"\
  \\t\" + y);\n    }\n}\nclass ClassTest6\n{\n    public static void main(String args[])\n\
  \    {\n        A a1 = new A();\n        a1.display();\n    }\n}\n```\n**输出：**\n\
  ```\n0  0\n```\n**注意：** 这里我们没有创建任何构造函数，因此 `JVM` 在创建对象后自动创建默认构造函数，并将实例变量初始化为 0 或\
  \ `null`。\n\n### 默认零参数构造函数\n我们可以用自己的零参数构造函数替换默认构造函数。这将允许我们将实例变量初始化为任何值。\n\n### 参数构造函数\n\
  接受参数的构造函数称为参数构造函数。\n\n**注意：** 就像方法一样，构造函数也可以重载。这被称为构造函数重载。\n\n### 示例 5.7 构造函数的用法\n\
  ```java\nclass A\n{\n    private int x;\n    private int y;\n    A() // 零参数构造函数\n\
  \    {\n        x = y = 0;\n    }\n    A(int x1) // 单参数参数构造函数\n    {\n        x\
  \ = y = x1;\n    }\n    A(int x1, int y1) // 双参数参数构造函数\n    {\n        x = x1;\n\
  \        y = y1; \n    }\n    void display()\n    {\n        System.out.println(x\
  \ + \"\\t\" + y);\n    }\n}\nclass ClassTest7\n{\n    public static void main(String\
  \ args[])\n    {\n        A a1 = new A();\n        a1.display();\n        A a2 =\
  \ new A(5);\n        a2.display();\n        A a3 = new A(4,7);\n        a3.display();\n\
  \    }\n}\n```\n**输出：**\n```\n0  0\n5  5\n4  7\n```\n\n### 示例 5.8:\n```java\nimport\
  \ java.util.Scanner;\nclass Complex\n{\n    private int real,imag;\n    Complex()//\
  \ 零参数构造函数\n    {\n        real=imag=0;\n    }\n    Complex(int real, int imag)\n\
  \    {\n        this.real=real;\n        this.imag=imag;\n    }\n    void getdata()\n\
  \    {\n        Scanner sc=new Scanner(System.in);\n        System.out.print(\"\
  输入实部\");\n        real=sc.nextInt();\n        System.out.print(\"输入虚部\");\n    \
  \    imag=sc.nextInt();\n    }\n    void display()\n    {\n        if(imag>=0)\n\
  \            System.out.println(real+\"+\"+imag+\"i\");\n        else\n        \
  \    System.out.println(real+\"\"+imag+\"i\");\n    }\n    Complex sum(Complex c)\n\
  \    {\n        Complex t=new Complex();\n        t.real=real+c.real;\n        t.imag=imag+c.imag;\n\
  \        return t;\n        // 或者返回 Complex(real+c.real,imag+c.imag);\n    }\n \
  \   Complex mult(Complex c)\n    {\n        Complex t=new Complex();\n        t.real=real*c.real;\n\
  \        t.imag=imag*c.imag;\n        return t;\n    }\n    public static void main(String\
  \ args[])\n    {\n        Complex c1=new Complex();\n        Complex c2=new Complex();\n\
  \        Complex c3=null,c4=null;\n        c1.getdata();\n        c2.getdata();\n\
  \        c3=c1.sum(c2);\n        System.out.print(\"和是 \");\n        c3.display();\n\
  \        c4=c1.mult(c2);\n        System.out.print(\"积是 \");\n        c4.display();\n\
  \    }\n}\n```\n\n### finalize() 方法\n有时，对象在销毁时需要执行某些操作。例如，如果一个对象持有某些非 Java 资源（如文件句柄），我们可能希望确保在对象销毁之前释放这些资源。为了处理此类情况，Java\
  \ 了一种了一种名为最终化（finalization）的机制。通过使用最终化，我们可以定义在对象即将被垃圾回收回收时发生的特定操作。`finalize()` 仅在垃圾回收之前被调用。它不会在对象离开作用域时调用。在\
  \ C++ 中，使用析构函数的概念用于最终化，但它与 Java 中的 `finalize()` 并不相同。\n\n```java\nprotected void\
  \ finalize()\n{\n// 此处编写最终化代码。\n}\n```\n**注意：** 除了 `protected` 修饰符外，我们也可以使用 `public`。\n\
  \n### 变量类型\nJava 有三种变量：\n\n### 1. 实例变量\n在类中声明且在所有方法之外的变量称为实例变量。对象的数量有多少，该变量的副本就有多少份。在\
  \ Java 中不需要初始化实例变量，因为这些变量会被初始化为默认值。\n\n### 2. 局部变量\n在方法内部声明的变量是局部变量。它们不需要初始化。\n\n\
  ### 3. 静态变量\n静态变量与实例变量一样声明在方法/块之外。但它们对于类是全局的。\n\n### 方法类型\n\n### 实例方法\n这些与 C++ 函数相同。实例方法只能通过对象调用。如果我们在同一个类的静态方法内部调用实例方法，也必须使用对象名称。\n\
  \n### 静态方法\n\n\n\n\n静态方法可以通过对象也可以类名来调用。静态方法只能访问静态成员。静态方法可以直接从同类的静态方法中被调用（无需对象或类名）。\n\
  \n### 示例 5.10\n\n```java\nclass A\n{\n    int x;\n    static int y;\n    static\
  \ int sum(int a, int b)\n    {\n        //y = 5; no error static method can access\
  \ static variable\n        //x = 10; error static method can't access instance variable\n\
  \        //A a1 = new A();\n        //a1.x = 10; No error as static method can access\
  \ instance variable \n        //through objects.\n        //this.x = 10; error as\
  \ static method can't access this or super keyword\n        int c;\n        c =\
  \ a+b;\n        return(c);\n    }\n    static float avg(int a, int b)\n    {\n \
  \       return (float)(a+b)/2;\n    }\n}\nclass ClassTest9\n{\n    public static\
  \ void main(String args[ ])\n    {\n        System.out.println(A.sum(5,6)); // static\
  \ methods can be called through\n        // class name\n        System.out.println(A.avg(5,6));\n\
  \        A a1 = new A();\n        System.out.println(a1.sum(5,6)); // static methods\
  \ can also be called\n        // through objects\n    }\n}\n```\n**输出:**\n```\n\
  11\n5.5\n11\n```\n\n### 初始化块与静态块 (Initialize & static Block)\n初始化块用于初始化类的成员变量，静态块用于初始化类的静态成员变量。但构造函数这些块之后被调用。\n\
  \n### 示例 5.11\n\n```java\nclass A\n{\n    int x;\n    static int y;\n\n    { //Inititalize\
  \ block to initialize instance variables\n        x = 10;\n    }\n\n    static //static\
  \ block to initialize static variables\n    {\n        y = 5;\n    }\n}\nclass ClassTest10\n\
  {\n    public static void main(String args[])\n    {\n        A a1 = new A();\n\
  \        System.out.println(a1.x + \"\\t\" + a1.y);\n    }\n}\n```\n**输出:**\n```\n\
  10 5\n```\n\n### Final 变量 (Final Variables)\n如果变量被声明为 `final`，则我们不能改变它的值 `final\
  \ (double PI=3.141;)`。`final` 变量不会按实例占用内存。`final` 变量是一个常量变量，其值不能改变。`final` 变量引用类型不能改变其引用。\n\
  \n### 示例 5.12\n\n```java\nclass A\n{\n    void m1() \n    {\n        System.out.println(\"\
  Inside m1()\");\n    }\n}\nclass ClassTest11\n{\n    public static void main(String\
  \ args[])\n    {\n        final int x=10; //不可改变\n        final int y; //  y 未初始化，所以稍后可以初始化\
  \ y\n        y=20; // 现在 y 已初始化，之后我们不能再改变它的值\n        // y=30; Error\n        System.out.println(x);\n\
  \        System.out.println(y);\n        final A a1=new A(); // a1 是常量引用，所以我们不能\n\
  \        // 在 f1 中分配其他对象的引用。\n        a1.m1();\n        A a2 = new A();\n      \
  \  // a1 = a2; error\n    }\n}\n```\n**输出:**\n```\n10\n20\nInside m1()\n```\n\n\
  ### 参数传递机制 (Argument Mechanism)\n1. 按值传递 (Call by Value)。\n2. 按引用传递 (Call by reference)。\n\
  \n当基本类型（`int`、`float`、`long` 等）传递给方法时，采用的是按值传递。对于对象，实际传递的是对象引用。对象引用也是通过按值传递的方式的。然而，由于传递的值指向一个对象，该值的拷贝仍然指向与参数参数相同的对象。例如，如果我们把存储对象引用的引用变量\
  \ `a1` 传入函数，而在函数中 `a2` 是形式参数，那么 `a1` 和 `a2` 都指向同一个对象。通过 `a2` 对对象值进行的任何更改也会反映在 `a1`\
  \ 中。但如果我们在 `a2` 中分配一个新引用，该引用将被复制到 `a1` 中。\n\n### 示例 5.13\n\n```java\nclass Box\n\
  {\n    private int feet;\n    private int inches;\n    Box()\n    {\n        feet\
  \ = inches = 0;\n    }\n    Box(int feet, int inches)\n    {\n        this.feet\
  \ = feet;\n        this.inches = inches;\n    }\n    void display()\n    {\n   \
  \     System.out.println(\"Feet is \" + feet +\"\\n\" + \"Inches is \" + inches);\n\
  \    }\n    void swap(Box obj)\n    {\n        int t;\n        t = feet;\n     \
  \   feet = obj.feet;\n        obj.feet = t;\n        t = inches;\n        inches\
  \ = obj.inches;\n        obj.inches = t;\n    }\n}\nclass ClassTest12\n{\n    public\
  \ static void main(String args[])\n    {\n        Box b1 = new Box(5,6);\n     \
  \   Box b2 = new Box(7,4);\n        b1.swap(b2); // 对象按引用传递的。\n        b1.display();\n\
  \        b2.display();\n    }\n}\n```\n**输出:**\n```\nFeet is 7\nInches is 4\nFeet\
  \ is 5\nInches is 6\n```\n\n### 嵌套类与内部类 (Nested and Inner Classes)\n可以在另一个类内部定义一个类；此类类被称为嵌套类。嵌套类的作用范围限于其外部类的作用范围。嵌套类可以访问其嵌套所在类的成员，包括该类的私有成员。然而，外部类无法访问嵌套类的成员。\n\
  \n嵌套类有两种类型：`static`（静态）和非静态。静态嵌套类是指应用了 `static` 修饰符的类。由于它是静态的，它必须通过对象来访问其外部类的成员。也就是说，它不能直接引用其外部类的成员。由于这种限制，静态嵌套类很少使用。\n\
  \n非静态嵌套类可以访问其外部类的所有变量和方法，并可以直接引用它们。\n\n### 示例 5.14\n\n```java\nclass Outer\n{\n\
  \    class Inner\n    {\n        int member_inner=7;\n        Inner()\n        {\n\
  \            member_outer = 5;\n            System.out.println(member_outer);\n\
  \        }\n    }\n    private int member_outer;\n    Outer()\n    {\n        //\
  \ member_inner = 9; error\n        Inner obj = new Inner();\n        System.out.println(obj.member_inner);\n\
  \    }\n}\nclass ClassTest13\n{\n    public static void main(String args[])\n  \
  \  {\n        Outer out_obj = new Outer();\n    }\n}\n```\n**输出:**\n```\n\n```\n\
  \n### 示例 5.15\n\n```java\nclass Outer\n{\n    static class Inner\n    {\n      \
  \  int member_inner=7;\n        Inner()\n        {\n            member_outer = 5;\n\
  \            System.out.println(member_outer);\n        }\n    }\n    private int\
  \ member_outer;\n    void prn()\n    {\n        Inner obj = new Inner();\n     \
  \   System.out.println(obj.member_inner);\n    }\n}\n```\n\n### 示例 5.16\n\n```java\n\
  import java.util.Random;\nclass RandomTest\n{\n    public static void main(String\
  \ args[])\n    {\n        Random r1 = new Random();\n        for(int i=1;i<=10;i++)\n\
  \            System.out.println(Math.abs(r1.nextInt()));\n    }\n}\n```\n\n### 理论题\n\
  1. 如果我们希望一个成员变量在类外完全不可访问，在声明变量时应该加上什么关键字？\n2. 在 Java 中，对象/值是如何传递的？\n3. 考虑以下代码：\n\
  \n```java\npublic static void main( String args[] )\n{\n    int a = 5;\n    System.out.println(\
  \ cube( a ) );\n}\n\nint cube( int theNum )\n{\nreturn theNum * theNum * theNum;\n\
  }\n```\n解释 static 关键字的重要性\n\n当我们尝试编译并运行这段代码时会发生什么？\n\na) 编译失败，因为 `cube` 在 `java.lang.Math`\
  \ 类中已经定义。\nb) 编译失败，因为 `cube` 不是静态的。\nc) 编译通过，但抛出算术异常。\nd) 完美运行，并在标准输出打印 \"125\"\
  。\n\n\n\n\n## 4. 什么是静态内部类？它与任何其他静态成员有什么区别？\n\n## 5. 我们如何在 Java 中声明常量值\n\n## 6. \"\
  final\" 关键字的含义是什么？\n\n## 7. 什么是类变量？\n\n**答案：**\n\n当我们创建一个相同类的多个对象时，每个对象将共享变量的共同副本。这意味着无论从该类创建了多少对象，每个类都只有一个副本。类变量或静态变量在类中使用\
  \ `static` 关键字进行声明。\n\n这些变量存储在静态内存中。类变量主要用于常量，即初始值永远不会改变的变量。静态变量始终通过类名进行调用。\n\n\
  该变量在程序启动时创建，即它在通过 `new` 算符创建类的实例之前就已经创建了，并在程序停止时被销毁。类变量的作用域与实例变量相同。\n\n类变量可以在类级别的任何位置使用\
  \ `static` 关键字定义。它的初始值与实例变量相同。当类变量被定义为 `int` 时，其默认初始值为 0；当声明为 `boolean` 时，默认值为 false；对象引用为\
  \ null。类变量与类相关，而不是与任何对象相关。\n\n### 8. 解释垃圾回收。\n\n**答案：** 垃圾回收是 Java 最重要的特性之一。垃圾回收也被称为自动内存管理，因为\
  \ JVM 会自动从内存中移除未使用的变量/对象（值为 null）。用户程序无法直接从内存中释放对象，相反，由垃圾回收器负责自动释放不再被程序引用的对象。\n\n\
  每个类都从 `java.lang.Object` 继承 `finalize()` 方法，当垃圾回收器确定不再有更多对该对象的引用时，就会调用 `finalize()`\
  \ 方法。\n\n在 Java 中，当变量不再使用时，显式地为变量赋值 `null` 是一个好习惯。在 Java 中，调用 `System.gc()` 和 `Runtime.gc()`\
  \ 时，JVM 会尝试回收未使用的对象，但无法保证所有对象何时会被垃圾回收。\n\n## 9. 如果一个类有多个构造函数，我们可以从一个构造函数调用另一个吗？\n\
  \n可以。使用 `this()` 从另一个构造函数调用构造函数。\n\n## 10. 构造函数和普通方法之间有什么区别？\n\n构造函数的名称必须与类相同，且没有返回值。它们只被调用一次，而普通方法可以被调用多次，并且可以返回值或为\
  \ `void`。\n\n## 11. 我们如何强制执行垃圾回收？\n\n垃圾回收是自动过程，无法被强制执行。我们可以通过调用 `System.gc()` 来请求它。JVM\
  \ 并不保证 GC 会立即启动。\n\n## 12. 下述描述中哪一个是不正确的。\n\n(a) Java 中的局部变量总是由默认值初始化。\n(b) Java\
  \ 中的局部变量必须在使用之前进行初始化。\n(c) 内部块中的局部变量不能与外部块中的局部变量同名。\n(d) 同一层级两个块中的局部变量可以同名。\n\n\
