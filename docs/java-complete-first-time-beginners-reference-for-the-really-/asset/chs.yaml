  \n## 献言\n\n“本书献给所有做出牺牲的人。”\n\n## 关于作者\n\nHarry 是一位匿名黑客客、GOC 知名计算机程序员、畅销的 Java 作者以及科学黑客专业人士，在计算机编程、黑客和网络安全领域拥有独特经验。他曾帮助全球许多国家政府和许多跨国软件公司保护其网络和安全。他编写了多本关于各种计算机编程语言以及计算机安全与黑客的书。他是一名技术毕业的软件工程师和硕士。他是\
  \ C 编程、C++ 编程以及核心 Java、数据结构和算法领域的权威。他拥有超过 5 年的软件方法论经验。他的教学和研究兴趣在人工智能、编程语言领域。\n\n\
  他过着两种生活。一种生活是一家正直软件公司的计算机程序编写员；另一种生活在计算机里，他的黑客称号是 `Chief Hacker – Captain Harry`。目前，他在世界著名的社区——匿名国际组织担任线下\
  \ IT 经理。-Anonymous 团队。\n\n## 作者自白\n\n你可能注意到这里缺少了一些东西：没有令人印象深刻的资。我没有在某著名大学当过二十多年的教授；也不是硅谷巨头公司的高管。在某些方面，我是一个技术的学生，就像你一样。\n\
  \n\n\n多年的经验告诉我，许多最了解技术工作原理的人，在解释他们所知道的知识方面并不成功。我的兴趣不在于成为一个专家，而在于作为一个教育者，以一种合逻辑、易于理解且有趣的方式呈现复杂的信息。\n\
  \n“什么是真实？你如何定义真实？如果你谈论的是你可以感觉到的、闻到的、尝到的和看到的，那么真实仅仅是由大脑解释的电信号。”\n\n“……我才开始发现在纸上表达想法有多困难。只要它完全由描述组成，就很容易；但涉及到推理时，建立一个正确的联系、清晰度和适度的流利度，对我来说……”\n\
  \n– Harry.\n\n![STAR-LOGO-2013](img/image030.png)\n\n# 前言\n\n# ∞ Essential Java\
  \ 技能——变得简单！∞\n\n从畅销 Java 编程作者 Harry H. Chaudhary（销量已超过 167,000 本！）那里，短时间内学习 Java\
  \ 编程的所有基础和高级特性。这本 Java 指南从基础开始，通过数千行 Java 代码详细引导你进入 Java 的高级功能，我承诺这本书将让你成为 Java\
  \ 专家级冠军。任何人都可以通过这本书在专家水平上学习 Java。\n\n工程学生和新手开发者也可以使用这本书。这本书涵盖了所有计算机科学专业学位的通用核心大纲。如果你是认真的，请继续通过这本终极\
  \ Java 书开启你的一天。\n\n这本 Java 书的主要目标不仅仅是给你 Java 编程知识，我遵循了一种模式，通过对数千行代码的问题进行改进，并对每个\
  \ Java 主题问题带有不同 复杂度的清晰理论说明，你将为复杂的 Java 问题找到多种解决方案。\n\n## 特别之处 –\n\n在书中，我为开发者详细涵盖并解释了最新\
  \ Java 8 特性的几个主题：Java 8 特性 – Lambda。Java 8 函数式接口、`Stream` 与时间 API。Java 8。“如果你谈论的是你可以感觉到的、闻到的、尝到的和看到的，那么真实仅仅是由大脑解释的电信号。”\
  \ “……我才开始发现在纸上表达想法有多困难。只要它完全由描述组成，就很容易；但涉及到推理时，建立一个正确的联系、清晰度和适度的流利度，对我来说……” “什么是真实？你如何定义真实？如果你谈论的是你可以感觉到的、闻到的、尝到的和看到的，那么真实仅仅是由大脑解释的电信号。”\
  \ 技术工作原理。多年的经验告诉我，许多最了解技术工作原理的人，在解释他们所知道的知识方面并不成功。我的兴趣不在于成为一个专家，而在于作为一个教育者，以一种合逻辑、易于理解且有趣的方式呈现复杂的信息。\
  \ “什么是真实？你如何定义真实？如果你谈论的是你可以感觉到的、闻到的、尝到的和看到的，那么真实仅仅是由大脑解释的电信号。” “……我才开始发现在纸上表达想法有多困难。只要它完全由描述组成，就很容易；但涉及到推理时，建立一个正确的联系、清晰度和适度的流利度，对我来说……”\n\
  \n# ∞ 章节一览 ∞\n\n前言。Java 概述。Java 语言。控制语句。`Scanner` 类、数组与命令行参数。Java 中的类与对象。Java 中的继承。面向对象编程。Java\
  \ 中的包。Java 接口。String 和 `StringBuffer`。异常处理。多线程编程。修饰符/可见模式。包装类。Java 中的输入/输出。Applet\
  \ 基础。抽象窗口工具包 (AWT)。AWT 事件简介。AWT 中的绘制。`java.lang.Object` 类。集合框架。Java 8 特性 – Lambda。Java\
  \ 8 函数式接口、`Stream` 与时间 API。使 Java 比其他语言更安全的特性。\n\n\n\n\n\n在整书中，我们讨论了许多类库。类库主要由编译器供应商提供，但许多类库由独立软件供应商（ISV）提供。此外，许多类库可以通过互联网和万维网以免费软件或共享软件的形式获取。你可以下载免费软件产品并免费使用，但须遵守版权所有者指定的任何限制条件。\n\
  \n## 典型 Java 环境的基础\n\nJava 系统通常由几个部分组成：环境、语言、Java 应用程序接口（API）以及各种类库。下面的讨论解释了一个典型的\
  \ Java 程序开发环境，Java 程序通常通过五个阶段进行执行。这些阶段是：编辑、编译、加载、验证和执行。后续描述使用了标准的 `Java SE 7 Development\
  \ Kit`（`JDK 7`），该内核可通过 `Oracle` 获取。\n\n如果你使用的是不同的 Java 开发环境，则可能需要遵循不同的程序来编译和执行 Java\
  \ 程序。在这种情况下，请咨询你的编译器文档以获取详情。\n\n**注意：** 如果你没有使用 `UNIX/Linux`、`Windows 95/98/ME`\
  \ 或 `Windows NT/2000`，请参考您系统 Java 环境的手手册，或询问您的导师如何在您的环境中完成这些任务（该环境可能与此处相似）。\n\n\
  ### 阶段 1：编辑文件\n\n这是通过编辑器程序（通常称为编辑器）完成的。程序员使用编辑器输入 Java 程序，并在必要时进行修正。当程序员指定保存编辑器中的文件时，程序会被存储在次级存储设备上，如磁盘。Java\
  \ 程序文件名以 `.java` 扩展名结尾。\n\n在 `UNIX/Linux` 系统上广泛使用的两个编辑器是 `vi` 和 `emacs`。在 `Windows\
  \ 95/98/ME` 和 `Windows NT/2000` 上，简单的编辑程序如 `DOS Edit` 命令和 `Windows Notepad` 就足够了。\n\
  \nJava 集成开发环境（IDE），如 `Forte for Java Community Edition`、`NetBeans`、`Borland’s JBuilder`、`Symantec’s\
  \ Visual Cafe` 和 `IBM’s Visual Age` 都内置了集成到编程环境中的编辑器。\n\n### Java 与 C\n\n我们假设读者知道如何编辑文件。`Java`\
  \ 等语言是面向对象的——在此类语言上编程被称为面向对象编程（OOP），它允许设计人员将面向对象的设计实现为运行的系统。相比之下，`C` 等语言是过程化编程语言，因此编程倾向于以操作为中心。\n\
  \n在 `C` 中，编程单元是 `function`（函数）。在 `Java` 中，编程单元是 `class`（类），对象最终从中实例化（“创建”的高级术语）。`Java`\
  \ 类包含 `methods`（方法，实现类行为）和 `attributes`（属性，实现类数据）。\n\n`C` 程序员专注于编写 `functions`。执行某些共同任务的操作组组合成\
  \ `functions`，函数被组合成程序。数据在 `C` 中固然重要，但观点是数据主要存在是为了支持函数所执行的动作。系统规范中的动词帮助 `C` 程序员确定实现该系统所需的函数集。\n\
  \n`Java` 程序员专注于创建他们自定义的类型，称为 `classes`（类）和 `components`（组件）。每个 `class` 包含数据以及操纵这些数据的函数集。`Java`\
  \ 类的数据组件被称为 `attributes`（属性）。\n\n`Java`类的函数组件被称为 `methods`（方法）。正如 `int` 等内置类型的实例被称为\
  \ `variable`（变量）一样，用户定义类型（即 `class`）的实例被称为 `object`（对象）。程序员使用内置类型作为构建用户定义类型的“构建块”。\n\
  \n`Java` 的重点是 `classes`（我们从中创建对象）而不是 `functions`。系统规范中的名词帮助 `Java` 程序员确定 `classes`\
  \ 的集合，通过这些类创建对象，这些对象将协同工作以实现系统。\n\n`Classes` 之于 `objects` 正如蓝图之于房屋。我们可以从一张蓝图建造许多房屋，也可以从一个\
  \ `class` 实例化许多 `objects`。`Classes` 与其他 `classes` 建立关系。\n\n例如，在银行的面向对象设计中，“银行出纳员”\
  \ `class` 需要与“客户” `class` 建立联系。这些关系被称为关联（associations）。我们将看到，当软件被封装成类时，这些类可以在未来的软件系统中被重用。相关的类类组通常被封装为可重用的组件。\n\
  \n你创建的每个新类都有潜力成为一个有价值的软件资产，你和其他程序员可以使用它来加速并提高未来软件开发工作的质量——这是一个令人兴奋的可能性。\n\n## Java\
  \ 与 C、C++ 和 C# 的关系\n\n`Java` 从 `C` 继承了语法，从 `C++` 继承了面向对象的特性。它不是 `C++` 的增强版本。`Java`\
  \ 向上也不向下兼容 `C++`。我想告诉你的一个重要点是，`Java` 语言的设计并不是为了取代 `C++` 和 `C#`。微软开发的另一种用于支持 `.NET\
  \ Framework` 的语言 `C#` 与 `Java` 密切相关，因为它们共享 `C++` 和 `C` 风格的语法，支持分布式编程，并使用相同的对象模型。\n\
  \n## Java 的主要目标是实现 -\n\n### 1. 安全\n当我们使用兼容 Java 的浏览器时，没有病毒感染的威胁。此外也没有恶意程序从本地机器收集隐私信息（如信用卡号、银行账户余额和密码）的威胁。\n\
  \n### 2. 可移植性\n`Java` 程序可以在运行不同操作系统和硬件计算机之间迁移。\n\n## Java 字节码\n\nJava 编译器的输出是字节码而非机器码（`.class`\
  \ 文件）。字节码是一组高度优化的指令，旨在由 Java 运行时系统执行，系统被称为 `JVM`（Java 虚拟机）。\n\n`JVM` 是解释字节码的解释器。编译后的程序运行更快，但\
  \ Java 仍然使用解释器来实现可移植性，因此运行速度较慢。通过 Java 编译器编译的程序可以在任何环境中运行，但每个平台都需要实现 `JVM`。Java\
  \ 程序是被解释执行的。\n\n## JIT（即时编译）\n\n`JIT` 是 `JVM` 使用的翻译器，用于将字节码翻译成实际机器码。它不翻译整个 `bytecodes`，而是根据需要逐段翻译。\n\
  \n## Java 的各个版本\n\n- Java 1：`JDK 1.0`、`JDK 1.1`\n- Java 2：`JDK 1.2`、`JDK 1.3`、`JDK\
  \ 1.4`、`JDK 1.5` 或 `JDK 5`、`JDK 1.6` 或 `JDK 6`\n- Java 1.7：`SE 7`\n- Java SE 8 `Java\
  \ 8`（2014 年 4 月）\n\n**注意 1：** `JDK`（Java 开发包）\n**注意 2：** 旧 Java 版本的许多功能已被新 Java\
  \ 版本弃用，但我们仍然可以使用它们。\n\n## Java 可以开发的应用程序类型\n\n1. **独立应用程序 (Standalone Applications)**：独立应用程序是在本地计算机操作系统下运行的程序，类似于\
  \ `C` 或 `C++` 程序。\n2. **Applet（Applets）**：Applet 是一种跨互联网传输并在客户端机器上兼容 Java 的浏览器（如\
  \ `Internet Explorer` 或 `Netscape Navigator`）中执行的小程序。\n\nApplet 实际上是一个通过网络动态下载型\
  \ Java 程序。Applet 程序存储在 Web 服务器上，并在客户端请求时传输到客户端。\n\nApplet 无法像独立应用程序一样执行。Applet 只能通过嵌入\
  \ HTML 页面（类似于声音文件、图像文件或视频片段）来执行。\n\n\n\n\n\n现在这个嵌入了小程序（applet）的 HTML 页面可以在本地机器上通过浏览器下载该\
  \ HTML 页面后运行。小程序是一种可以响应用户输入并进行动态变化的程序。它不会重复播放相同的动画或声音。\n\n### 1. Web 应用程序\n这些是运行在\
  \ Web 服务器上的程序。当我们通过在网络浏览器中指定 `URL`（通用资源定位符）访问网站时，网络浏览器会向 Web 服务器发送针对特定网站的请求。接收到请求后，服务器会运行一个程序，该程序被称为\
  \ Web 应用程序。我们使用 `Java Servlets` 和 `JSP`（`Java Server Pages`）来编写此类程序。\n\n这些程序在服务器上运行，并将结果/响应发送给客户端。`JSP`\
  \ 页面可以被视为 `HTML` 和 `Java 代码` 的结合。Web 服务器在执行之前会将 `JSP` 页面转换为 `Java Servlets`。\n\n\
  当客户端请求特定的 `URL` 且该 `URL` 对应于 `HTML` 页面时，Web 服务器直接将 `HTML` 页面返回给客户端，由客户端进行显示。如果 `URL`\
  \ 对应于 `servlet` 或 `JSP`，则它会在服务器上执行，并将结果/响应返回给客户端，再由客户端显示。\n\n### 2. 分布式应用程序\nJava\
  \ 应用被分为可以在独立机器上运行的小程序。这些程序中使用的对象可以相互通信。这些应用程序被称为分布式应用程序。这允许两台不同计算机上的对象远程执行过程。为此使用了\
  \ `RMI`（远程方法调用）。\n\n––––––––\n\n## Java 的特性：\n\n### 1. 简单\n`Java` 的语法几乎与 `C` 和 `C++`\
  \ 相似，因此熟悉 `C/C++` 的程序员无需从头开始学习语法。但 `C/C++` 中许多复杂或导致歧义的特性在 `Java` 中已被移除。\n\n1. `Java`\
  \ 不支持多继承，因为这一概念较为复杂并可能导致歧义。\n2. `Java` 不支持全局变量，这也导致了 `C/C++` 程序中出现许多 bug。\n3. `Java`\
  \ 不使用 `pointers`（指针）且不允许 `pointer arithmetic`（指针运算），这是 bug 的产生源。\n4. `Java` 不支持运算符重载。\n\
  5. `Java` 具有自动垃圾回收机制，简化了内存管理。\n\n### 2. 安全\nJava 程序运行在 `JVM`（Java 虚拟机）内部，提供了一个沙箱环境。这确保了安全性。Java\
  \ 有三个主要组件：\n1. `Class loader`（类加载器）\n2. `Bytecode verifier`（字节码验证器）\n3. `Security\
  \ manager`（安全管理器）\n\n### 3. 可移植\nJava 具有高度的可移植性，因为源代码被编译成 `bytecode`，可以在任何带有 `JVM`\
  \ 的平台上执行。这遵循了“编写一次，随处运行”的哲学。\n\n### 4. 解释型与高性能\nJava 程序是解释执行的，但由于各种优化，与其他解释器相比，它们的运行速度仍然很快。\n\
  \n### 5. 分布式\nJava 是为互联网的分布式环境设计的。它内置支持各种基于 `TCP/IP` 的协议。事实上，使用 `URL` 访问资源类似于访问本地机器上的文件。Java\
  \ 还具有远程方法调用（`RMI`）的功能。\n\n### 6. 动态\n每个 `Java` 类都是一个独立的执行单元。类只有在需要时才会在运行时加载。`Java`\
  \ 中绑定方法的默认机制也是动态的（运行时绑定）。\n\n### 7. 多线程\nJava 设计用于满足创建交互式、网络化程序的现实需求。Java 提供了编写多线程程序的支持以实现这一目标。这允许程序员编写可以并发执行许多任务的程序。例如，基于\
  \ `GUI`（图形用户界面）的应用程序可能正在用户事件并采取适当的操作，另一个线程可能正在打印，而另一个线程可能正在从网络下载文件。\n\n## 运行独立 Java\
  \ 应用程序\n当 `C` 或 `C++` 程序被编译时，它会被直接翻译成特定处理器或特定平台的机器码。但运行 Java 程序是一个两步骤的过程。在 Java\
  \ 中，从源代码到可执行代码的转换是通过两个翻译器实现的：\n\n\n\n\n\n# Java 编程概览\n\n1. **Java 编译器** - 首先，Java\
  \ 程序被编译成字节码。字节码就像机器码，但不是针对特定处理器器或平台的。字节码不能直接执行。\n\n2. **Java 解释器 (JVM)** - Java\
  \ 解释器通过 `JIT` 将字节码翻译成特定平台的实际机器码。\n\n**注意 1** - `C` 或 `C++` 程序只编译一次，但 Java 字节码在我们每次执行\
  \ Java 程序时都会被翻译。因此，与 `C/C++` 程序相比，Java 程序的运行速度稍慢。\n\n**注意 2** - 运行 Java 程序，我们需要一个文本编辑器（记事本或\
  \ Edit）、`JDK`（Java 开发工具包）以及 `JVM`（许多操作系统已预安装）。我们也可以使用 `Eclipse` 或 `JCreater` 来代替记事本。\n\
  \n## 安装\n\n### 在 win xp 上安装 Java 1.7 -\n\n双击 `我的电脑` $\\rightarrow$ 双击 `光驱器` $\\\
  rightarrow$ 双击 `JDK1.7 Java 安装文件` $\\rightarrow$ 点击 `Next`、`Next`、`.....`\n\n###\
  \ 设置路径 -\n\n如果我们设置了 Java 文件夹的路径，那么就可以从任何地方运行 Java 程序，否则我们必须在 Java 的 `bin` 文件夹中运行\
  \ Java 程序。\n\n右键点击 `我的电脑` $\\rightarrow$ `属性` $\\rightarrow$ `高级` $\\rightarrow$\
  \ `环境变量` $\\rightarrow$ 点击 `Path` 然后点击 `编辑` $\\rightarrow$ 点击变量值 $\\rightarrow$\
  \ 按 `END` 键将光标移动到行尾 $\\rightarrow$ 现在输入 `c:\\program files\\Java\\jdk1.7.0_01\\\
  bin;` 然后点击 `OK`、`OK`、`OK`。\n\n### 为 Java 程序创建文件夹：\n\n双击 `我的电脑` $\\rightarrow$ 双击\
