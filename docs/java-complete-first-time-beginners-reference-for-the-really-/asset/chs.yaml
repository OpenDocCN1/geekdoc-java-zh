  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章节\n# ∞ 3 ∞\n## (控制语句)\n\n## 引言\n控制语句用于改变执行流。Java\
  \ 的控制语句分为三类。\n\n## 1. 选择语句（选择控制结构）\n选择语句允许程序根据表达式的结果或变量的状态，从不同的执行路径集合集中选择任意一条路径。\n\
  \n### 1.1. `if`\n2. `if else`\n3. `nested if else`（嵌套 if-else）\n4. `if-else-if`\n\
  5. `switch`\n\n(a) `if` 的语法 (b) `if else` 的语法\n\n```\nif(condition)\n{\n    statements;\n\
  }\nelse\n{\n}\n```\n\n(c) 嵌套 `if else` 的语法 (d) `if-else-if` 阶结构的语法\n\n```\nif(condition)\n\
  {\n    if (condition)\n    {\n    }\n    else\n    {\n    }\n}\nelse if(condition1)\n\
  {\n}\nelse if(condition2)\n{\n}\nelse if(condition3)\n{\n    {\n    }\n}\nelse\n\
  {\n    if (condition)\n    {\n    }\n    else\n    {\n    }\n}\n```\n\n(e) `switch\
  \ case` 的语法\n```java\nswitch(expression)\n{\n    case 1:\n        statement 1 sequence;\n\
  \        break;\n    case 2:\n        statement 2 sequence;\n        break;\n  \
  \  case 3:\n        statement 3 sequence;\n        break;\n    case n:\n       \
  \ break;\n    default :\n        default statement sequence;\n}\n```\n\n### 示例 3.1\
  \ 寻找两个数最大值的程序 (Max.Java)\n```java\nclass Max\n{\n    public static void main(String\
  \ args[])\n    {\n        int a,b,max;\n        a = 10;\n        b = 20;\n     \
  \   if(a>b)\n            max = a;\n        else\n            max = b;\n        System.out.println(\"\
  Max of two numbers is \" + max); //输出\n    }\n}\n```\n输出:\nMax of two numbers is\
  \ 20\n\n## 2. 迭代语句（循环控制结构）\n循环是一个我们可以重复单个语句或一组语句 n 次的过程。\n\n### 2.1. `for`\n2. `while`\n\
  3. `do while`\n\n(a) `for` 循环的语法。\n```java\nfor( initialize; condition; increment/decrement)\n\
  {\n    statements;\n}\n```\n\n(b) `while` 循环的语法。\n```java\ninitialize;\nwhile(condition)\n\
  {\n    statements;\n    increment/decrement;\n}\n```\n\n(d) `do while` 循环的语法。\n\
  ```java\ninitialize;\ndo\n{\n    statements;\n    increment/ decrement;\n} while(condition);\n\
  ```\n\n**注意：**\n条件可以是任何布尔表达式。只要条件表达式为真，循环体就会被执行。当条件变为假时，控制立即传递到紧循环后的下一行代码。\n\n###\
  \ 示例 3.2\n```java\nclass Loop1\n{\n    public static void main(String args[])\n\
  \    {\n        int n=5;\n        for(int i=1;i<=n;i++)\n        {\n           \
  \ for(int j=1;j<=i;j++)\n                System.out.print(j);\n            System.out.println();\n\
  \        }\n    }\n}\n```\n输出:\n1\n12\n123\n1234\n12345\n\n## 3. 跳跃语句\n它允许我们的程序以非线性的方式工作。\n\
  \n1. `break`。\n2. `labeled break`（带标签的 break）。\n3. `continue`。\n4. `labeled continue`（带标签的\
  \ continue）。\n5. `return`。\n\n- 大多数语句的语法与 C/C++ 中对应的语句相同。但存在一些显著差异。\n- 用于 `if`、`for`、`while`\
  \ 和 `do` 语句的条件表达式必须是有效的布尔表达式，即它们的值必须为 true 或 false。我们不能像 C/C++ 中那样用 0 代替 false，或用非零值代替\
  \ true。\n- Java 没有 `goto` 语句，尽管 `goto` 是该语言中的保留字。Java 提供了 `labeled break` 和 `labeled\
  \ continue` 语句，它们通常被称为 `goto` 的文明形式，因为它们被认为是 `goto` 更好的替代品。\n- 在 Java 中，`switch`\
  \ 表达式可以是除 `long` 外的任何整数，即 `switch` 表达式的类型可以是 `byte`、`short`、`char` 或 `int`。但 Java\
  \ 的 `int` 是 4 字节，这与 C++ 中的大小相同。\n- `case` 标签像 C/C++ 一样是常量表达式，但 `case` 标签的值必须是唯一的。\n\
  - `break` 语句用于跳转到语句结束的地方。`continue` 语句用于跳转到循环的下一次迭代。\n\n### 跳跃语句：\n(a) `break`\n\
  ```java\nfor(int i=0;i<10;i++)\n{\n    if(i==5)\n        break;\n    System.out.print(i);\n\
  }\n```\n输出:\n01234\n\n(b) `labeled break`\n```java\nouter:\nfor(int i=0;i<10;i++)\n\
  {\n    for(int j=0;j<10;j++)\n    {\n        if(j==5)\n            break outer;\n\
  \        System.out.print(i);\n    }\n}\n```\n输出:\n01234\n\n(c) `continue`\n```java\n\
  for(int i=0;i<10;i++)\n{\n    if(i==5)\n        continue;\n    System.out.print(i);\n\
  }\n```\n输出:\n012346789\n\n(d) `labeled continue`\n```java\nouter: for(int i=0;i<10;i++)\n\
  {\n    for(int j=0;j<10;j++)\n    {\n        if(j==5)\n            continue outer;\n\
  \        System.out.print(i);\n    }\n}\n```\n输出:\n01234\n11234\n21234\n31234\n\
  41234\n\n(e) `switch`\n```java\nint x = 2;\nswitch(x)\n{\n    case 1:\n        System.out.println(\"\
  one\");\n        break;\n    case 2:\n        System.out.println(\"two\");\n   \
  \     break;\n    case 3:\n        System.out.println(\"three\");\n        break;\n\
  \    default:\n        System.out.println(\"default\");\n}\n```\n输出:\ntwo\n\n##\
  \ 多选题\n\n1. 定以下代码的输出是：\n```java\nint m = 0;\nwhile(m++ < 2)\n    System.out.println(m);\n\
  ```\n(a) 0\n(b) 1\n(c) 2\n(d) 3\n\n2. 定以下代码的输出是：\n```java\nint sum = 0;\nfor(int\
  \ i = 1; i <= 4; i++)\n{\n    sum += i;\n}\nSystem.out.println(sum);\n```\n(a) 6\n\
  (b) 10\n(c) 15\n(d) 20\n\n3. 假设 `val` 定义如下，对于代码：\n```java\nif(val > 4 )\n    System.out.println(\"\
  Test A\");\nelse if(val > 9 )\n    System.out.println(\"Test B\");\nelse\n    System.out.println(\"\
  Test C\");\n```\n哪些 `val` 值会导致打印 \"Test C\"？\n(a) val < 0\n(b) 0 到 4 之间\n(c) 4 到\
  \ 9 之间\n(d) val > 9\n(e) val = 0\n\n4. 对于以下代码的输出：\n```java\nm = 0;\nwhile(m++ <\
  \ 2)\n    System.out.println(m);\n```\n哪些选项是正确的？\n(a) 0\n(b) 1\n(c) 2\n(d) 3\n(e)\
  \ 抛出异常\n\n5. 以下代码片段：\n```java\nouter: for( int i = 1; i <3; i++ )\ninner: for( j\
  \ = 1; j < 3; j++ )\n{\n    if( j==2 )\n        continue outer;\n    System.out.println(\
  \ \"i = \" + i+\", j = \" + j );\n}\n```\n标准输出是以下哪些？\n(a) i = 1, j = 1\n(b) i =\
  \ 1, j = 2\n(c) i = 1, j = 3\n(d) i = 2, j = 1\n(e) i = 2, j = 2\n(f) i = 2, j =\
  \ 3\n(g) i = 3, j = 1\n(h) i = 3, j = 2\n\n答案：1(c,d,e,f,g) 2(a,b) 3(b) 4(b,c) 5(a,d)\n\
