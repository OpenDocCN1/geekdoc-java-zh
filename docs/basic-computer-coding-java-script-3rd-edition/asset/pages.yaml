  md: 'extensible. Spaghetti code is easily avoidable once we know how to avoid it.
    The problem is things get really messy when you connect them. And an application
    is ultimately all about connecting pieces of code to each other. But if we connect
    all the pieces to all the other pieces, suddenly you can''t move anything anymore.


    # Separation of Concerns:


    We can separate our code into fundamentally different pieces. No matter how the
    size of the application, programmers like to organize everything into buckets:
    Model, View and Controller


    Model: All the data is stored here which includes data from the server and from
    the user.


    View: This is all the staff view and interacts with includes DOM elements, input
    elements, buttons and images. This is the user''s interface to the application
    both for giving and ready data.


    Controller: Connect Model and View. Controller provides the separation of concerns
    that are needed when we''re building applications. This holds things together
    but also keeps them enough to allow changes in individual pieces without disturbing
    the rest i.e., view can be changed without disturbing the model or we can change
    the way we store data in the model without disturbing the view. At this point
    we started with this pizza repository code to learn separation on concerns. Using
    this I attempted to redo my butterfly clicker code and will be noting each point.


    ```

    <meta charset="utf-8">

    ```


    The editors generally plug this in and kind of know what it is but can really
    tell the proper definition. This meta tag specifies what character is set your
    website written with.


    Definition of UTF-8: UTF-8 (U from Universal Character Set + Transformation for
    encoding all characters (called code points) in Unicode. The encoding is variable-length
    and uses 8-bit code units.


    ```

    <meta name="viewport" content="width=device-width,initial-scale=1">

    ```


    This is used to make your site responsive i.e., the browser (probably) render
    the width of the page at the width of its own screen. So if that 320px wide, the
    browser window is 320px wide, rather than view zoomed out and showing 960px (or
    whatever device does by default, in lieu of a responsive meta tag).


    # JavaScript Templating


    JavaScript Templating is useful when you have dynamic content but don''t server-side
    templating available. It also arguably minimize the amount of data returned to
    the client (ex. data as an object or JSON instead of the entire markup making
    sites faster and servers more responsive by lowering bandwidth and load.'
