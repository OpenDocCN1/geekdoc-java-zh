  md: 'Basic Computer Coding: Java Script


    # ROLE MODEL


    # DOUGLAS Crockford


    Douglas Crockford is an American computer programmer and entrepreneur who is involved
    in the development of the JavaScript language. He popularized the data format
    JSON (JavaScript Object Notation), and has developed various JavaScript related
    tools such as JSLint and JSMin. He was a senior JavaScript architect at PayPal
    until 2019, and is also a writer and speaker on JavaScript, JSON, and related
    web technologies.


    # Education


    Crockford earned a degree in Radio and Television from San Francisco University
    in 1975. He took classes in FORTRAN and worked with a university lab''s computer.


    # Career


    Crockford purchased an Atari 8-bit computer in 1980 and wrote the game Galahad
    and the Holy Grail for the Atari Program Exchange (APX), which resulted in Chris
    Crawford hiring him at Atari, Inc. While at Atari, Crockford wrote another game,
    Burgers!, for APX and a number of experimental audio/visual demos that were freely
    distributed.


    After Warner Communications sold the company, he joined National Semiconductor.
    In 1984 Crockford joined Lucasfilm, and later Paramount Pictures. He became known
    for video game oriented listervs in the early 1990s as he posted his memoir "The
    Expurgation of Maniac Mansion" to a videogaming bulletin board. The memoir documented
    his efforts to center the computer game Maniac Mansion to Nintendo''s satisfaction
    so that they could release it as a cartridge, and Crockford''s mounting frustrations
    as Nintendo''s demands became more obscure and confusing.


    Together with Randy Farmer and Chip Morningstar, Crockford founded Electric Communities
    and was his CEO from 1994 to 1995. He was involved in the development of the programming
    language E.


    Crockford was the founder of State Software (also known as Veil Networks) and
    its CTO from 2001 to 2002.


    During his time at State Software, Crockford popularized the JSON data format,
    based upon using JavaScript language constructs, as a lightweight alternative
    to XML. He obtained the domain name json.org in 2002, and put up his description
    of the format there. In July 2006, he specified the format officially, as RFC
    4627.


    312'
