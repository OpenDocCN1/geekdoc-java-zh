  md: '# Basic Computer Coding: Java Script


    There''s another variable that has special meaning: secure. This variable should
    not be assigned any value. Including it means that the cookie will only be sent
    if your visitor is visiting your website over a secure connection.


    +   - expires

    The expires variable is obsolete although still supported by today’s browsers.
    Use the max-age variable instead, since it is easier to use. Be careful not to
    use “expires” as a variable name to store your data as.

    - No spaces, commas, semi-colons

    Your cookie values cannot have any embedded whitespaces, commas or semi-colons.
    If you have any, they must be converted to “encoded” equivalent. The easiest way
    to do this is to use the encodeURIComponent() function to encode it, and the decodeURIComponent()
    function to decode it when you read the cookie.


    Expanding on your earlier example, if you want to set a “theme” variable to “blue
    theme”, you can do this way: `theme=" + encodeURIComponent("blue theme") + "max-age=
    60*60*24*30; path=/; domain=theewizard.`


    Of course in the above case, since there is only one space character to encode,
    you can do it manually as “blue%20 theme” as.


    +   - Cookie Limits

    Although different browsers may implement different limits for cookies, the bare
    minimum that they are supposed to support is as follows:

    - Cookie length: 4 KB. The total length of your string, including all variables
    with special meaning, should not be more than 4,096 characters.

    - Maximum number of cookies per web server: 20.

    - Total number of cookies supported by the browser: 300. This includes cookies
    stored by other websites.


