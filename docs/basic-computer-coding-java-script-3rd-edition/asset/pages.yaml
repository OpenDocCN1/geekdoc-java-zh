    # 2.1.1 JavaScript Browser


    JavaScript was initially created to "makeMonkey alive". The programs in this language
    are called scripts. They can be written right in the HTML and execute automatically
    as the page loads. Scripts are provided and executed as a plain text. They don''t
    need a special preparation or a compilation to run. In this aspect, JavaScript
    is very different from another language Java.


    At present, JavaScript can execute not only in the browser, but also on the server,
    or actually on any device where exists a special program called the JavaScript
    engine.


    The browser has an embedded engine, sometimes it''s also called a "JavaScript
    virtual machine".


    Different engines have different "codenames", for example:


    +   - V8 – in Chrome and Opera.

    - SpiderMonkey – in Firefox.

    - There are other codenames like "Trident", "Chakra" for different versions of
    IE, "ChakraCore" for Microsoft Edge, "Nitro" and "SquirrelFish" for Safari


    The terms above are good to remember, because they are used in developer articles
    on the internet. We''ll use them too.


    > If "a feature X is supported by V8", then it probably works in Chrome and Opera.


    ![](img/bad15d306b2109ba849fab2c31f711a9_52_0.png)


    # What can be in-browser JavaScript do?


    The modern JavaScript is a "safe" programming language. It does not provide low-level
    access to memory or CPU, because it was initially created for browsers which do
    not require it.


    The capabilities greatly depend on the environment that runs JavaScript. For instance,
    Node.JS supports functions that allow JavaScript to read/write arbitrary files,
    perform network requests etc.


