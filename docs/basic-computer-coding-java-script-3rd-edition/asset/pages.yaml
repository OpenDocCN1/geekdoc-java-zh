    growth of the nascent World Wide Web. In 1994, a company called Mosaic Communications
    was founded in Mountain View, California, and employed many of the original NCSA
    authors to create Netscape. However, it intentionally stood for create code with
    NCSA Mosaic. The internal codename for the company''s browser was Mozilla, which
    stood for "Mosaic killer," as the goal was to displace NCSA Mosaic as the world''s
    number one web browser. The first version of the Web browser, Mosaic 0.9, was
    released in late June. Within four months it had already taken three-quarters
    of the browser market and became the main browser for the Internet in the 1990s.


    To avoid ownership problems with the NCSA, the browser was subsequently renamed
    Netscape Navigator in the same year, and the company took the name Netscape Communications.
    Netscape Communications realized that the Web needed to become more dynamic. Marc
    Andreessen, the founder of the company believed that HTML needed a "glue language"
