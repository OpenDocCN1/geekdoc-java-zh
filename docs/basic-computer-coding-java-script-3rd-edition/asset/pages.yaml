  md: '# SUMMARY


    +   - A cookie is an amount of information that persists between a server-side
    and a client-side. A web browser stores this information at the time of browsing.


    +   - A cookie contains the information as a string generally in the form of a
    name-value pair separated by semi-colons. It maintains the state of a user and
    remembers the user''s information among all the web pages.


    +   - Cookies are data, stored in small text files, on your computer. When a web
    server has sent a web page to a browser, the connection is shut down, and the
    server forgets everything about the user.


    +   - Cookies are relatively small text files that a web browser embeds on a user''s
    computer. Cookies allow otherwise stateless HTTP communications to emulate state
    (i.e., memory). Cookies are being replaced by somewhat newer technologies such
    as local storage and session storage; however, cookies are still used by many
    modern websites today.


    +   - Cookies are necessary because the HTTP protocol that is used to transfer
    webpages around the web is state-less. This means that web servers cannot remember
    information about users throughout their travels, and everyone becomes anonymous.


    +   - The document has object in JavaScript called document.cookie, which is used
    to read and retrieve cookie data (though not an array).


    +   - A cookie is a small bit of text that accompanies requests and pages as they
    go between the Web server and browser.


    +   - A cookie is a named piece of data, created and used by a certain website
    for a certain viewing user, and sent from the user''s web browser to the web server
    each time a page is viewed.


    +   - A persistent cookie is a data file capable of providing websites with user
    preferences, settings and information for future visits. Persistent cookies provide
    convenient and rapid access to familiar objects, which enhances the user experience
    (UX). A persistent cookie is also known as a stored or permanent cookie.


    +   - A secure cookie, also known as httpOnly cookie, is a type of cookie that
    only works with HTTP/HTTPS and does not work for scripting languages like JavaScript.


    +   - HttpOnly is a flag added to cookies that tell the browser not to display
    the cookie through client-side scripts (document.cookie and others).'
