    # 10.1.4 JavaScript Numbers: Integer, Float, Binary, Exponential, Hexadecimal,
    Octal


    The Number is a primitive data type used for positive or negative integer, float,
    binary, octal, hexadecimal, and exponential values in JavaScript.


    The type in JavaScript is double-precision 64 bit binary format like double in
    C# and Java. It follows the international IEEE 754 standard.


    The first character in a number must be an integer value, and it must not be enclosed
    in quotation marks. The following example shows the variables having different
    types of numbers in JavaScript.


    Example: Numbers in JavaScript


    ```

    var num1 = 100; // integer

    var num2 = -100; //negative integer

    var num3 = 10.52; // float

