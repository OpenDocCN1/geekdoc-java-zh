  md: "# 3.1.2 Function Parameters\n\nJavaScript is a functional language meaning\
    \ that functions are the primary modular units of execution. Functions are obviously\
    \ very important in JavaScript. When talking about functions, the terms parameters\
    \ and arguments are often interchangeably used as if it were one and the same\
    \ thing but there is a very subtle difference.\n\n+   - Parameters are variables\
    \ listed as a part of the function definition.\n- Arguments are values passed\
    \ to the function when it is invoked.\n\nIn our greet.js file we created a basic\
    \ function that prints Hello, to the console. Using parameters, we can add additional\
    \ functionality that will make the code more flexible. Parameters are input that\
    \ get passed into functions as names and behave as local variables.\n\nWhen a\
    \ user logs in to an application, we may want the program to get them by name,\
    \ instead of just saying, \"Hello, World!\" We will add a parameter to our function,\
    \ to represent the name of the person being greeted.\n\n```\n// Initialize custom\
    \ greeting function\nfunction greet(name) {\n  console.log('Hello, ${name}!');\n\
    }\n```\n\nThe name of the function is greet, and now we have a single parameter\
    \ inside the parentheses. The name of the parameter follows the same rules as\
    \ naming a variable. Inside of function, instead of a static string consisting\
    \ of Hello, we have a template literal string containing our parameter, which\
    \ is now behaving as a local variable.\n\nYou will notice we have not defined\
    \ our name parameter anywhere. We assign it value when we invoke our function.\
    \ Assuming our user is Sammy, we will call the function and place the username\
    \ as the argument. The argument is the actual value that gets passed into the\
    \ function, in this case it is the string \"Sammy\".\n\n```\n// Invoke greet function\
    \ with \"Sammy\" as the argument\ngreet(\"Sammy\");\n```\n\nThe value of \"Sammy\"\
    \ is being passed into the function through the name parameter. Every time name\
    \ is used throughout the function, it will represent the \"Sammy\" value. Here\
    \ is the whole code.\n\n![](img/bad15d306b2109ba849fab2c31f711a9_87_0.png)"
