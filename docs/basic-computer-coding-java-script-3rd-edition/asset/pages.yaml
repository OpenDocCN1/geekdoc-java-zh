    # Parameters:


    +   - No Parameters: A date object will be set to the current date & time if no
    parameter is specified in the constructor.

    - value: An integer value representing the number of milliseconds since January
    1, 1970, 00:00:00 UTC.

    - dateString: A string that will be parsed using Date.parse() method.

    - year: An integer value to represent a day of a date. Numbers from 0 to 99 to
    the years 1900 to 1999. All others are actual years.

    - monthIndex: An integer value to represent a month of a date. It starts with
    0 for January till 11 for December

    - day: An integer value to represent the day of the month.

    - hours: An integer value to represent the hour of a day between 0 to 23.

    - minutes: An integer value to represent the minute of a time segment.

    - seconds: An integer value to represent the second of a time segment.

    - milliseconds: An integer value to represent the millisecond of a time segment.
    Specify numeric milliseconds in the constructor to get the date and time elapsed
    from 1/1/1970.


    In the following example, a date object is created by passing milliseconds in
    the Date() constructor function. So date will be calculated based on milliseconds
    elapsed from 1/1/1970.


    # Example: Create Date by Specifying Milliseconds


    ```

    var date1 = new Date(0); // Jan 01 1970 05:30:00

    ```'
