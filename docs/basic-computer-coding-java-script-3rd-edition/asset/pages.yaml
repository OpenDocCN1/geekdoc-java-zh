  md: '# Basic Computer Coding: Java Script


    # CASE STUDY OBJECT MODEL


    The history of the Document Object Model, known as the DOM, is tightly coupled
    with the beginning of the JavaScript and JScript scripting languages.


    # JavaScript


    The LiveScript language was designed at Netscape Communications to make the Java
    support in Netscape Navigator more accessible to non-Java programmers. LiveScript,
    like any scripting language, is a loosely-typed language. It is intended for a
    large audience of Web designers and developers.


    In 1995, LiveScript was renamed JavaScript and released as part of Netscape Navigator
    2.0. Except for marketing purposes, JavaScript has nothing to do with the Java
    language developed and maintained by Sun Microsystems The Web community started
    then to manipulate the content of Web documents, in order to bring interactivity
    and typography to the formerly static Web.


    # Jscript


    In July 1996, Microsoft released Internet Explorer 3.0 with a port of JavaScript
    called JavaScript.


    # ECMAScript97


    In June 1997, ECMA adopted a hybrid version of the scripting languages called
    ECMAScript. The International Organization for Standardization (ISO) followed
    suit in 1998. Unfortunately, ECMAScript arrived too late for the 4.0 releases
    of Netscape Navigator and Internet Explorer. Each introduced their own document
    object model, HTML and dHTML, which came to be Dynamic HTML. ECMA-262, released
    in December 1999, is still not followed by Microsoft and their Internet Explorer.
    ECMAScript claims to support ECMA-262 in Netscape Navigator 6 and 7.


    # The World Wide Web Consortium


    In 1994, Tim Berners-Lee, inventor of the World Wide Web, created the World Wide
    Web Consortium (W3C) to lead the Web to its full potential. At the beginning of
    1997, the companies involved in this consortium — including Netscape Communications
    and Microsoft — decided to find a consensus around their object models to access
    and manipulate documents. While still trying to be as backward compatible as possible
    with the original browser object models, the W3C’s Document Object Model (DOM)
    provided a better object representation of HTML documents.


    # HTML and XML


