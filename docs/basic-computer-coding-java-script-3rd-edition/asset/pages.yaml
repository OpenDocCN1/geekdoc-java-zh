    \ rest of your content, you can add the following rules to your stylesheet:\n\n\
    ```\nbutton, input, select, textarea {\n  font-family : inherit;\n  font-size\
    \ : 100%;\n}\n```\n\nThe screenshot below shows the difference; on the left is\
    \ the default rendering of the element in Firefox on Mac OS, with the platform’s\
    \ default font style in use. On the right are the same elements, with our font\
    \ harmonization style rules applied.\n\n![](img/bad15d306b2109ba849fab2c31f711a9_131_1.png)\n\
    \nWeb application is software that is accessed using a web browser.\n\nFirefox\
