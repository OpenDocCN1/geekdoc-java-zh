    \ right font:\n\n```\nlabel {\n  font: .8em \"typewriter\", sans-serif;\n}\n```\n\
    \nThe text fields require some common rules. Simply put, we remove their borders\
    \ and backgrounds, and redefine their padding and margin:\n\n```\ninput, textarea\
    \ {\n  font: .9em/1.5em \"handwriting\", sans-serif;\n  border: none;\n  padding:\
    \ 10px;\n  margin: 0;\n  width: 240px;\n  background: none;\n}\n```\n\n![](img/bad15d306b2109ba849fab2c31f711a9_137_0.png)\n\
    \nDepending on browser support, the url field can be automatically validated when\
    \ submitted.\n\nWhen one of these fields gains focus, we highlight them with a\
    \ light grey, transparent, background. Note that it's important to add the outline\
    \ property, in order to remove the default focus highlight added by some browsers:\n\
    \n```\ninput:focus, textarea:focus {\n  background: rgba(0,0,0,1);\n  border-radius:\
    \ 5px;\n  outline: none;\n}\n```\n\nNow that our text fields are complete, we\
    \ need to adjust the display of the single and multiple line text fields to match,\
    \ since they won't typically look the same using the defaults.\n\nThe single-line\
    \ text field needs some tweaks to render nicely in Internet Explorer. Internet\
    \ Explorer does not define the height of fields based on the natural height of\
    \ the font (which is the behavior of all other browsers). To fix this, we need\
    \ to add an explicit height to the field, as follows:\n\n```\ninput {\n  height:\
    \ 2.5em; /* for IE */\n  vertical-align: middle; /* This is optional but it makes\
    \ legacy IEs look better */\n}\n```\n\n120"
