    # 6.2.2 Persistent Cookie - A Cookie that survives the browser


    A persistent cookie is a data file capable of providing websites with user preferences,
    settings and information for future visits. Persistent cookies provide convenient
    and rapid access to familiar objects, which enhances the user experience (UX).
    A persistent cookie is also known as a stored or permanent cookie. When users
    visit a website and set choices or preferences, persistent cookies may be used
    to identify a specific client and are capable of traversing a user''s path towards
    a website. They are stored as text files on the hard drive of a computer and have
    usually expiration dates of one to two years. Persistent cookies facilitate the
    following preferences:


    +   - Favorites or internal bookmarks

    - User authentication

    - Login details

    - Menu preferences

    - Theme selection, if applicable

    - Language preferences'
