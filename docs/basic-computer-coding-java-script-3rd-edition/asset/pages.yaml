    Syntax - the form is contrasted with semantics. In processing computer languages,
    semantic processing generally comes after syntactic processing, but in some cases
    semantic processing is necessary for complete syntactic analysis, and these are
    done together or concurrently. In a compiler, the syntactic analysis comprises
