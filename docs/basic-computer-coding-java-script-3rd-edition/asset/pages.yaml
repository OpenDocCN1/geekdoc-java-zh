  md: 'it is only used in storing information and used for hypertext transfer protocol
    requests and data over the internet, exploits and hacks made through scripting
    are unable to access them. So a secure cookie''s main benefit is that it can stop
    them through cross-site scripting (XSS).


    Making a secure cookie is pretty easy as well, we simply add the option "Secure".


    ```

    username=Hans; Secure;

    ```


    This one can be a tricky to test with a local file or your own web server, since
    this one will only work over a HTTPS connection which typically is not the case.
    JSFiddle on the other hand uses HTTPS so it will work there:


    ```

    document.cookie = "username=Hans; Secure";

