  md: '# Basic Computer Coding: Java Script


    In-browser JavaScript can do everything related to webpage manipulation, interaction
    with the user and the webserver.


    For instance, in-browser JavaScript is able to:


    +   - Add new HTML to the page, change the existing content, modify styles.

    - React to user actions, run on mouse clicks, movements, key presses.

    - Send requests over the network to remote servers, download and upload files
    (so-called AJAX and COMET technologies).

    - Get and set cookies, ask questions to the visitor, show messages.

    - Remember the data on the client-side (“local storage”).


    Domestic robot is a type of service robot, an autonomous robot that is primarily
    used for household chores, but may also be used for education, entertainment or
    therapy.


    # What CAN''T in-browser JavaScript?


    JavaScript''s abilities in the browser are limited for the sake of the user''s
    safety. The aim is to prevent an evil webpage from accessing private information
    or harming the user''s data.


    The examples of such restrictions are:


    +   - JavaScript on a webpage may not read/write arbitrary files on the hard disk,
    copy them or execute programs. It has no direct access to OS system functions.


    Modern browsers allow it to work with files, but the access is limited and only
    offered if the user does certain actions, like “dropping” a file into a browser
    window or selecting it via an <input> tag.


    There are ways to interact with camera/microphone and other devices, but they
    require a user''s explicit permission. So a JavaScript-enabled page may not sneakily
    enable a webcam, observe the surroundings and send the information to the NSA.


    +   - Different tabs/windows generally do not know each other. They do, for example
    when one window uses JavaScript to open the other one. Even in this case, JavaScript
    from one page may not access the other if they come from different sites (from
    a different domain, protocol or port).


    This is called “Same Origin Policy”. To work around that, both pages must contain
    a special JavaScript code that handles data exchange.'
