  md: "as arrow function expressions as of ECMAScript 6. Arrow functions, as they\
    \ are commonly known, are represented by an equals sign followed by a greater\
    \ than sign: =>. Arrow functions are always anonymous functions and a type of\
    \ function expression. We can create a basic example to find the product of two\
    \ numbers.\n\n```\narrowFunction.js\n// Define multiply function\nconst multiply\
    \ = (x, y) => {\n  return x * y;\n}\n```\n\n// Invoke function to find product\n\
    multiply(30, 4);\nOutput\n120\n\nInstead of writing out the keyword function,\
    \ we use => to indicate a function. Otherwise, it works similarly to a regular\
    \ function expression. In the case of only one parameter, the parentheses can\
    \ be excluded. In this case we are squaring x, which only requires one number\
    \ to be passed as an argument. The parentheses have been omitted.\n\n```\n// Define\
    \ square function\nconst square = x => {\n  return x * x;\n}\n```\n\n// Invoke\
    \ function to find product\nsquare(8);\nOutput\n64\n\nWith these particular examples\
    \ that only consist of a return statement, arrow functions allow the syntax to\
    \ be reduced even further. If the function is only a single line return, both\
    \ the curly brackets and the return statement can be omitted as seen in the example\
    \ below.\n\n```\n// Define square function\nconst square = x => x * x;\n// Invoke\
    \ function to find product\nsquare(10);\n```\n\n![](img/bad15d306b2109ba849fab2c31f711a9_90_0.png)"
