  md: '# SUMMARY


    +   - JavaScript''s interaction with HTML is handled through events that occur
    when the user or the browser manipulates a page.


    +   - When the page loads, it is called an event. When the user clicks a button,
    that too is an event. Other examples include events like pressing a key, clicking
    a window, resizing a window, etc.


    +   - Events are a part of the Document Object Model (DOM) Level 3 and HTML element
    contains a set of events which can trigger JavaScript Code.


    +   - The change in the state of an object is known as an Event. In html, there
    are various events which represents that activity is performed by the user or
    by the browser. When javascript code is included in HTML, js react over these
    events and allow the execution. This process of reacting over the events is Event
    Handling. Thus, handles the HTML events via Event Handlers.


    +   - The addEventListener method is used to attach an event handler to a particular
    element. It does not override the existing event handlers. Events are said to
    be an essential part of the JavaScript. A web page responds according to the event
    that occurred. Events can be user-generated or by API. An event listener is a
    JavaScript''s procedure that waits for the occurrence of an event.


    +   - The addEventListener method is an inbuilt function of JavaScript. We can
    add multiple event handlers to a particular element without overwriting the existing
    handlers.


    +   - The onclick event generally occurs when the user clicks on an element. It
    allows the programmer to execute a JavaScript''s function when an element clicks.
    This event can be used for validating a form, warning messages and many times.


    +   - The dbclick event generates an event on double click the element. The event
    fires when an element is clicked twice in a very short span of time. We can also
    use the JavaScript''s addEventListener method to fix the double click event.


    +   - The onload attribute fires when an object has been loaded. The purpose of
    this attribute is to execute a script when the associated elements loads.


    +   - The onload attribute is generally used with the <body> element to execute
    a script once the content (including CSS files, images, scripts, etc.) of the
    webpage is completely loaded. It is not necessary to use only with <body>, as
    it can be used with other HTML elements.


    +   - The onresize event in JavaScript generally occurs when the window has been
    resized. To get the size of the window, we can use the JavaScript''s window.innerWidth
    and window.outerHeight events. We can also use the JavaScript''s properties such
    as innerHeight, clientWidth, ClientHeight, offsetWidth, offsetHeight to get the
    size of an element.'
