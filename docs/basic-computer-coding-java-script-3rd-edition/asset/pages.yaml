    The new operator is used to create an instance of an object. To create an object,
    the new operator is followed by the constructor method.


    In following example, the constructor methods are Object(), Array(), and Date().
    These constructors are built JavaScript functions.


    ```

    var employee = new Object();

    var books = new Array("C++", "Java");

    var day = new Date("August 15, 1947");

    ```


    # The Object() Constructor


    A constructor is a function that creates and initializes an object. JavaScript
    provides a special constructor called Object () to build the object. The return
    value of the Object () constructor is assigned to a variable.


