  md: '# Disadvantages of using cookies


    Here are some of the disadvantages:


    +   - Cookies are not secure as they are stored in clear text they may pose a
    possible security risk as anyone can open and tamper with cookies. but it manually
    requires extra coding and decrypt cookies, but can affect application performance
    because of the time that is required for encryption and decryption


    +   - Several limitations on the size of the cookie text (4kb in general), number
    of cookies(20 per site in general), etc.


    +   - User has the option of disabling cookies on his computer from browser''s
    setting.


    +   - Cookies will not work if the security level is set to high in the browser.


    +   - Users can delete cookies.


    +   - Users browser can refuse cookies, so your code has to anticipate that possibility.


    +   - Complex type of data not allowed (e.g. dataset etc.). It only allows plain
    text (i.e. cookie allows only string content)


