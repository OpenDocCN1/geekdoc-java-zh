    # Strings Comparison


    Two strings can be compared using <, >= operator, and string,localeCompare(string)
    method.

    The mathematical operators < and > compare two strings and return a boolean (true
    or false) based on the order of the characters in the string.

    The == operator compares the content of strings and == compares the reference
    equality of strings. The localeCompare() method compares two strings in the current
    locale. It returns 0 if strings are equal, returns 1.


    Example: String Comparison


    ```

    console.log("a" < "b"); //true

    console.log("b" < "a"); //false

    console.log("Apple" = "Apple"); //true

    console.log("Apple" = "apple"); //false

    console.log("Apple" == "Apple"); //true

    console.log("Apple" == "apple"); //false

    console.log("Apple".localeCompare("Apple")); //0

    console.log("Apple".localeCompare("apple")); //1

    ```


