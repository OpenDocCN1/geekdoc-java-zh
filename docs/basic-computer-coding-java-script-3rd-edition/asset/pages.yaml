    To illustrate how things get confusing, the following code. The first "username"
    cookie be relative to this page, the second "username" relative to the entire
    site. Since one was defined without path (relative to this page) and one with
    path (relative to the website), suddenly the browser has 2 cookies with the same
    name – which obviously might result in unexpected behavior when trying to read
    the code.


    ![](img/bad15d306b2109ba849fab2c31f711a9_205_0.png)


    Website is a collection of related web pages, including multimedia content, typically
    identified with a common domain name, and published on at least one server.


    | | |

    |---||

    | 1 | document.cookie="username=Hans"; |

    | 2 | alert(document.cookie); |

    | 3 | document.cookie="username=John; Path=/"; |

    | 4 | alert(document.cookie); |

    | 5 | |

    | 6 | document.cookie="username=Banana"; |

    | 7 | alert(document.cookie); |


    In the example above first create the cookie username=Hans relative to this page
    and the alert confirms this. The next cookie however is defined as a new (!) (cookies
    username=John with Path=\ (entire domain). The alert shows 2 cookies with the
    same name: username=Hans; username=John. So which one do we use in our code? The
    3rd part we change the value of one of the relative cookies, for example because
    we forgot to add the path, and guess what things become messy quick. Here you
    can see how important it can to be properly define the path.


    # 6.2.8 Combining options – A Cookie jar of options


    All these options can be combined in a single line as, separated by semicolons,
    even when it might make little or no sense:


    ```

    document.cookie = "username=Hans;Path=/Domain=example.com; Expires=Sun, 22 Oct
    2017 08:00:00 UTC; Secure; HttpOnly; SameSite = strict;

    alert(document.cookie);

    ```


    So this cookie holds the username=Hans value pair, can be used until Sunday October
    22, 8 AM UTC (GMT), and only be accessed in the email.example.com domain with
    the path /secretdata, cross domain is prohibited (SameSite), HTTPS is required
    (secure) and it is a HTTPOnly cookie (which can only be read by the server).


