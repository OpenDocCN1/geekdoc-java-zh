    # CHAPTER 7


    # JAVA SCRIPT:

    CLASSES AND

    OBJECTS


    # INTRODUCTION


    Classes and Objects are basic concepts of Object Oriented Programming that revolve
    around real-life entities.


    JavaScript classes, introduced in ECMAScript 2015, are primarily syntactical sugar
    over JavaScript''s existing prototype-based inheritance. Classes are actually
    just a special function.


    Classes are a template for creating objects. They encapsulate data with code to
    work on that data. Classes in JS are built on prototypes but also have some syntax
    and semantics that are unique to classes.


    After studying this chapter, you will be able to:


    +   1. Understand JavaScript: Classes

    2. Discuss about Class Body and Method Definitions

    3. Identify JavaScript: Objects'
