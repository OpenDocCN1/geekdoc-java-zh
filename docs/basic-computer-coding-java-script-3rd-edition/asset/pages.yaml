  md: "# 4.3.3 Box Model\n\nAll fields have complete support for every property related\
    \ to the CSS box model (width, height, padding, margin, and border). As before,\
    \ however, browsers rely on the system default styles when displaying these widgets.\
    \ If you want to define how you wish to blend them into your content. If you want\
    \ to keep the native look and feel of the widgets, you'll face a little difficulty\
    \ if you want to give them a consistent size. This is because each widget has\
    \ its own rules for border, padding and margin. If you want to give the same size\
    \ to several different widgets, you have to use the box-sizing property:\n\n```\n\
    input, textarea, select, button {\n  width : 150px;\n  margin: 0;\n  -webkit-box-sizing:\
    \ border-box; /* For legacy WebKit based browsers */\n  -moz-box-sizing: border-box;\
    \ /* For legacy (Firefox <29) Gecko based browsers */\n  box-sizing: border-box;\n\
    }\n```\n\n![](img/bad15d306b2109ba849fab2c31f711a9_132_0.png)\n\nIn the screenshot\
    \ above, the left column is built without box-sizing, while the right column uses\
    \ this property with the value border-box. Notice how this lets us ensure that\
    \ all of the elements occupy the same amount of space, despite the platform's\
    \ default rules for each kind of widget.\n\n# 4.3.4 Positioning\n\nPositioning\
    \ of HTML form widgets is generally not a problem; however, there are two elements\
    \ you should take special of:\n\nlegend\n\nThe <legend> element is okay to style,\
    \ except for positioning. In every browser, the <legend> element is positioned\
    \ on top of the top border of its <fieldset>parent. There is absolutely no way\
    \ to change it to be positioned within the HTML flow, away from the top border.\
    \ You can, however, position it absolutely or relatively, using the position"
