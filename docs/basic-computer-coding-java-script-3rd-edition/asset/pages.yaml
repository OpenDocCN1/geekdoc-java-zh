    # 6.1.7 Advantages and Disadvantages of using Cookies


    A cookie is a small bit of text that accompanies requests and pages as they go
    between the Web server and browser.


    # Advantages of using cookies


    Here are some of the advantages of using cookies to store session state.


    +   Cookies are simple to use and implement.


    +   Occupies less memory, do not require any server resources and are stored on
    the user’s computer so no extra burden on server.


    +   We can configure cookies to expire when the browser session ends (cookies)
    or they can exist for a specified length of time on the client’s computer (persistent
    cookies).


    +   Cookies persist a much longer period of time than Session state.'
