    # 6.1.6 Privacy and Legislation


    Cookies can only be read by the site that created them, or by site ''underneath''
    the site that created them. This prevents others from stealing cookies. When cookies
    were fairly new, there was a lot of controversy about their ability to track users
    browsing ''all around the web''. This is not really the case, due to sites being
    able to read their cookies; however, for affiliated companies, such as advertising
    companies, it is true that cookies could be placed in banners that any site showing
    a banner could aid the banner company in tracking every viewer visited on their
    network.


    Privacy is the ability of an individual or group to select themselves, or information,
    and thereby express themselves selectively.


    ![](img/bad15d306b2109ba849fab2c31f711a9_195_0.png)


    Therefore as some paranoid users may feel the need to disable their cookies, Compos
    does not require them: session details may be relayed by URL in Composer. The
    obvious disadvantage is that automatic login is not possible in this situation,
    and there is an additional disadvantage that JavaScript will be thought to be
    disabled, as Compos needs to use cookies to detect it. The first problem may be
    ameliorated by the web browser ''auto-fill'' feature, which can be used to automatically
    remember forms, such as login forms, filled in. The Developers recommend that
    users have cookies enabled, but that they possibly disable ''third party cookies''
    if they are concerned about privacy so that advertisers cannot track the advertising
    sites that they view.


    # EU legislation


    The EU tracking cookies be declared for organizations operating inside the EU.
    The Composer “Cookie notice” configuration option implements this. It is not on
    default because Compos’s cookies are heavily minimized to what we consider reasonable
    compliance without adverse special notice. However, use of something like Adsense
    strictly requires you enable the cookie notice.


