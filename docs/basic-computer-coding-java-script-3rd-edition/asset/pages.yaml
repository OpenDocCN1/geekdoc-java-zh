    # 3.1 UNDERSTAND FUNCTIONS IN JAVASCRIPT


    A function (also known as a method) is a self-contained piece of code that performs
    a particular "function", then returns a value. You can recognize a function by
    its format — it is a piece of descriptive text, followed by open and close brackets.


    +   Parentheses allow a writer to provide additional information. The alphabetical
    material might be a single word, a fragment, or multiple complete sentences.


    Like this:


    ```

    function displayWelcomeMessage() {

    ...code goes here...

    }

    ```


    The code that goes into a function can be as simple or as complex as you need
    it to be. Regardless of the code''s complexity inside the function, when you call
    the function, you do not need to know anything about the code inside.


    All you need to know is the name of the function, and any arguments that you might
    need to supply. For example, take JavaScript''s built-in alert() You can call
    that function from within your code without knowing how the function is written.


    All you need to know is what the function does and how to call it. In this section,
    we will learn several ways to define a function, call a function, and use function
    parameters in JavaScript.


    # 3.1.1 Defining a Function


    Functions are defined, or declared, with the function keyword. Below is the syntax
    for a function myFunction() in JavaScript.


    ```

    function nameFunctionName() {

    // code to be executed

    }

    ```'
