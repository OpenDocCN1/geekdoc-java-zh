  md: '# SUMMARY


    +   - Browser Object Model(BOM) refers to the objects provided by the web browser
    for manipulating properties and objects associated with it. The objects and properties
    provided by the Browser Object Model allow javascript to interact with the browser.


    +   - The window object represents a window in browser. An object of window is
    created automatically by the browser.


    +   - The windows object return the height and width of the browser content. We
    cannot change in height and width as these properties are read-only.


    +   - The name property will return the name of the windows. This property is
    often used to change the name of the window after the window is created.


    +   - The JavaScript history object represents an array of URLs visited by the
    user. By using this object, you can load previous, forward or any particular page.


    +   - Navigator object is used for browser detection. It can be used to get browser
    information as version and browser type.


    +   - The javaEnabled() method is used to return a Boolean value that indicates
    whether or not Java is enabled in a browser. If Java is enabled in the browser
    it returns true else returns false.


    +   - The Navigator taintEnable() method was best in Javascript version 1.5, and
    was removed to prevent future run-time errors. It returns a Boolean value false
    value, specifying whether the data-tainting feature is enabled in the browser.


    +   - The Navigator geoLocation property provides a geolocation object that can
    be used to track the user''s status.


    +   - The location object in JavaScript enables it to save the information about
    the current page location or address (URL), and redirect the browser to a new
    page.


    +   - A location object is part of the window object, it accesses through the
    windows. There is no general standard for the location object, but all major browsers
    support the location object.


    +   - The location assignment() method is used for loading a new document in a
