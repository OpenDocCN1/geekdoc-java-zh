  md: '# SUMMARY


    +   A program can do many things, including calculations, sorting names, preparing
    phone lists, displaying images, validating forms, ad infinitum. But to do anything,
    the program works with the data that is given to it. Data types specify what kind
    of data, such as numbers and characters, can be stored and manipulated within
    a program. JavaScript supports a number of fundamental data types.


    +   Variables are used whenever there''s a need to store data of data. A variable
    contains data that can be used in the program elsewhere. Using variables also
    ensure re-usability since it can be used to replace the same value in multiple
    places.


    +   Primitive types are the simplest building blocks of a program. They are types
    that can be assigned a single literal value as the number 5.7, or a string of
    characters such as "hello".


    +   In JavaScript, a string is a primitive data type that is used for textual
    data. JavaScript string must be enclosed in single quotes, double quotes, or backticks.
    The following are string literals in JavaScript.


    +   The Number is a primitive data type used for positive or negative integer,
    float, binary, octal, hexadecimal, and exponential values in JavaScript.


    +   The BigInt is a numeric primitive type that can store integers with arbitrary
    precision. Use the BigInt for the large integers having more than 15 digits. Append
    n to the end of an integer to make BigInt.


    +   The floating-point numbers in JavaScript can only keep 17 decimal places of
    precision; beyond, the value will be changed.


    +   The binary numbers must start with 0b or 0 followed by 0 or 1.


    +   The octal numbers must start with zero and the lower or upper letter ''O'',
    or 0O.


    +   The Hexadecimal numbers must start with zero and the lower or upper letter
    ''X'', 0x or 0X.


    +   The boolean is a primitive data type in JavaScript. It can have two values:
    true or false. It is useful in controlling program flow using conditional statements
    like if, switch, while, or loop.


    +   A JavaScript variable is simply a name of storage location. There are two
    types of variables in JavaScript: local variable and global variable.


    +   Variables declared out of any function are called global variables. They can
    be accessed anywhere in the JavaScript code, even inside any function.


    +   Variables declared inside the function are called local variables of that
    function. They can only be accessed in the function where they are declared but
    not outside.


    368'
