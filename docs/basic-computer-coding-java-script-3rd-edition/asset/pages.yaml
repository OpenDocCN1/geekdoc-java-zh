  md: '# 6.2.6 Cookie Domain – For Cookies that are only for a specific domain


    The cookie domain is an important security feature, probably even more important
    than the secure flag. It tells the browser that this cookie must only be sent
    to matching domains. We can define a domain and path in which a cookie can be
    accessed. To limit a cookie to a certain domain, you can try the following examples.
    The first one will use a random domain, example.com. The second example will use
    the domain jshell.net – which is used by JSFiddle.


    Note: when entering “example.com” as the domain, the cookie can only be accessed
    from that exact domain, but not from sub domains. When adding a period in front
    of the domain, for “example.com” then the cookie can be accessed from sub domains
    as well (i.e. forum.example.com, email.example.com, www.example.com, etc).


    ```

    document.cookie = "username=Hans; domain = .example.com;

    alert(document.cookie);

    ```


    You will notice that there is no cookie and the alert is not showing anything
    either – again which is correct since we are not allowed access to these cookies,
    because we are working in the wrong domain (not example.com).


    ```

    document.cookie = "username=Hans; domain = .jshell.net;

    alert(document.cookie);

    ```


    This second example will generate a cookie that is visible and the alert will
    show the cookie as well (when testing this in JSFiddle, since JSFiddle runs in
    jshell.net domain).


    # 6.2.7 Cookie Domain and Path – For Cookies that are only for a specific path
    and domain


    We can now draw this down by adding a path, which would only allow access to this
    cookie if we are in the right domain and path (if Domain is not defined, the current
    domain will be used). The following example tells the browser to access this cookie
    when we are on the path /secretdata (on the current domain). So if we would be
    working on the server with example domain, this would work for pages in example
    http://example.com/secretdata/it sub paths for this is a little tricky to test
    – and you might not need this either.


    It is recommended to add the "Path" to your cookies so the browser will not get
    confused too much. By default the cookie will be relative to the page path you
    are working with. But if you want to access the cookie from another page on your
    website, then the cookie might actually not be accessible. The cookie should be
    readable throughout your entire dome then always add: "Path=/;


    ```

    document.cookie = "username=Hans; path = /secretdata";

    alert(document.cookie);

    ```'
