    utilized in the creation of variable names. For example, “print” is a reserved
    word because it is a function in many languages to show text on the screen.


    Reserved words are used in operating systems as a method of identifying a device
    file or other service. Below is a listing of Microsoft reserved words in MS-DOS
    and Windows operating systems. When attempting to use any of the below reserved
