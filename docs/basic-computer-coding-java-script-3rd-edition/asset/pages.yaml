  md: '# ROLE MODEL


    # BRENDAN EICH: INVENTOR OF JAVCRIPT PROGRAMMING LANGUAGE


    Brendan Eich is an American technologist and creator of the JavaScript programming
    language. He co-founded the Mozilla project, the Mozilla Foundation and the Mozilla
    Corporation, and served as the Mozilla Corporation''s chief technical officer
    and briefly his chief executive officer.


    # Early life


    Brendan Eich received his bachelor''s degree in mathematics and computer science
    at Santa Clara University. He received his master''s degree in 1985 from the University
    of Illinois at Urbana-Champaign. He started his career at Silicon Graphics, working
    for seven years on operating system and network code. He then worked for three
    years at MicroUnity Systems Engineering writing microkernel and DSP code, and
    doing the very first MIPS R400 port of GCC.


    # Netscape and JavaScript


    He started work at Netscape Communications Corporation in April 1995. Having originally
    joined intending to put Scheme "in the browser",Eich was instead commissioned
    to create a new language that resembled Java, JavaScript for the Netscape Web
    browser.


    The first version was completed in ten days in order to accommodate the JavaScript
    2.0 Beta release, and was called Mocha, which was later renamed LiveScript in
    September 1995 and later JavaScript in the same month. He continued to oversee
    the development of Spider Monkey, the specific implementation of JavaScript in
    Navigator, until 2011.


    # Mozilla


    In 1998, Eich co-founded the Mozilla project, with a website at mozilla.org, that
    was meant to manage open-source contributions to the Netscape source code. He
    served as Mozilla''s chief architect. AOL shut down the Netscape browser unit
    in July 2003, Eich helped spin out the Mozilla Foundation.


    In August 2005, after serving as Lead Technologist and as a member of the Board
    of Directors of the Mozilla Foundation, Eich became CTO of the newly founded Mozilla
    Corporation, meant to be the Mozilla Foundation''s for-profit arm.'
