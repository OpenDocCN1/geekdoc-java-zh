    # Integers


    Numbers can be positive or negative integers. However, integers are floating-point
    values in JavaScript. Integers value will be accurate up to 15 digits in JavaScript.
    Integers with 16 digits onwards will be changed and rounded up or down; therefore,
    use BigInt for integers larger than 15 digits.


    Example: Integers in JavaScript


    ```

    //16 digit integer

    var int1 = 1234567890123456; //accurate

    //17 digit integer

    var int2 = 12345678901234567; //will be 1234567890123456

    //16 digit integer

    var int3 = 99999999999999999; //will be 9999999999999998

    //16 digit integer, last digit 9

    var int4 = 99999999999999999; //will be 10000000000000000

    ```


