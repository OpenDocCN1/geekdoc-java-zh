    The "Inspect" option in Google Chrome, might require you to click the refresh
    button in web developer tools (indicated before). You will now see a checksum
    in the "secure" column as well.


    A secure always has the secure attribute activated, so it is used most via HTTPS
    and securely transmitted with encrypted connections. The HttpOnly flag in the
    cookie header ensures that JavaScript or any non-HTTP methods cannot access the
    cookie. The cookie works through the assistance of two headers: set-cookie and
    cookie. The job of the set-cookie header is to create a secure cookie on the user''s
    system in response to an http request. While the cookie header is part of the
    application with an http request to the server to validate if there is a secure
    cookie that matches the domain and path. The secure attribute and httpOnly flag
    together ensure that the browser is able to restrict access to the secure cookie
    from malicious scripts that have infected the browser or the network. This mitigates
    many of the damages that many XSS attacks can cause, specifically those that target
    cookies.


    # 6.2.4 HttpOnly Cookie – The Cookie that can only be accessed by the web-server


    HttpOnly is a flag added to cookies that the browser not to display the cookie
    through client-side scripts (document.cookie and others). The agenda behind HttpOnly
    is not to spill out cookies when an XSS flaw exists, as a hacker might be able
    to run their script but the fundamental benefit of


    ![](img/bad15d306b2109ba849fab2c31f711a9_202_0.png)


    Whether the cookie must use a secure connection (https://). If this value is TRUE,
    the cookie can be transferred only across a secure connection. The default is
    FALSE.


    ![](img/bad15d306b2109ba849fab2c31f711a9_202_1.png)


    Internet is the global system of interconnected networks that use the Internet
    protocol suite (TCP/IP) to link devices worldwide.


    185'
