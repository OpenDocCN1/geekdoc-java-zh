  md: '# SUMMARY


    +   HTML stands for HyperText Markup Language. It is used to design web pages
    using a markup language. It is a combination of Hypertext and Markup language.
    HTML uses predefined tags and elements that tell the browser how to properly display
    the content on the screen, and form is one of them.


    +   An HTML form is a section of a document which contains controls as text fields,
    password fields, checkboxes, radio buttons, submit button, menus etc.


    +   Web forms are used by virtually all websites for a wide range of purposes.
    Users of forms and social networks use forms to add content and interact with
    other users.


    +   HTML Form is a document which stores information of user on a web server using
    interactive controls. An HTML form contains different kind of information such
    as username, contact number, mail id etc. textarea is, basically, a large, multi-line
    textbox. The anticipated number of rows and columns can be defined with rows and
    cols attributes, although you can manipulate the size to your heart''s content
    using CSS.


    +   HTML forms are an awesome and professional tool for collecting user data.
    However, these forms, just like everything in HTML, wouldn''t work without proper
    HTML form elements.


    +   HTML form elements are used to capture user input. There are many different
    types of form elements such as the text box, check box, drop down, submit button,
    and much more.


    +   The text box input is used to capture text such as a name, email, address,
    or any other type of text. To create an HTML text box we will use the input tag
    and specify the type attribute to be text.


