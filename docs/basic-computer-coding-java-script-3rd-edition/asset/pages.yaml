    for example, is not possible. The functionality must be provided by the superclass.


    A function with a superclass as input and a subclass extending thatclass as output
    can be used to implement mix-ins in ECMAScript:


    ```

    let calculatorMix = Base => class extends Base {

    calc() { }

    };

    ```


    ```

    let randomizerMix = Base => class extends Base

    randomize() { }

    };

    ```


    A class that uses these mix-ins can then be written like this:


    ```

    class Foo { }

    class Bar extends calculatorMix(randomizerMix(Foo)) { }

    ```


