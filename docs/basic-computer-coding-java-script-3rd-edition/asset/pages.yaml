  md: '# 1.2 HELLOWORLD:ITING YOUR FIRST JASCRIPT PROGRAM


    “Hello World” is a staple of programming courses. The objective of this program
    is simple: output the “Hello World” on a computer screen. Because of the simplicity
    of the message and syntax, it is usually the first program taught to beginners.
    Writing a “Hello World” program in JavaScript, as we will learn, is exceptionally
