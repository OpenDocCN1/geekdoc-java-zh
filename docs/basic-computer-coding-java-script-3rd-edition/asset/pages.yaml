  md: '# Basic Computer Coding: JavaScript Script


    having an XSS vulnerability (the ability to steal cookies and hijack a currently
    established session) is lost.


    When you set a cookie with the HttpOnly flag, it informs the browser that this
    special cookie should only be accessed by the server. Any try to access the cookie
    from client side is strictly forbidden. Of course, this presumes you have: a modern
    browser. HttpOnly cookies were first presented in Microsoft''s Internet Explorer
    6 SPI, and of now, this has become a popular practice while setting session cookies.


    ![](img/bad15d306b2109ba849fab2c31f711a9_203_0.png)


    Whether the cookie must use the HTTP protocol. If this value is TRUE, scripting
    languages as JavaScript cannot access the cookie. The default is FALSE.


    The same goes for making an HttpOnly cookie, we just add "HttpCookie" – before
    doing so, you might want to delete all the cookies in the developer tools of your
    browser.


    ```

    document.cookie = "username=Hans;HttpOnly;

    alert(document.cookie);

    ```


    Now refreshing the cookies in the developer tools should not show a cookie, and
    neither does the "alert()" ... which is correct. The cookie exists, but we are
    just allowed to access it with JavaScript.


    # 6.2.5 SameSite Cookie – A Cookie only for this website


    SameSite prevents the browser from sending this cookie along with cross-site requests.
    The main goal is mitigate the risk of cross-origin information leakage. It also
    provides some protection against cross-site request forgery attacks. SameSite
    cookies, if supported by the browser, knows two variants: strict and lax. Here
    is the preferred setting, since it closes down cross domain access.


    ```

    document.cookie = "username=Hans;SameSite=strict";

    alert(document.cookie);

    ```


    ```

    When you want to allow "some" cross domain: document.cookie = "username=Hans;SameSite=lax";

    alert(document.cookie);

    ```


    This is a tricky one, since it might only show something with your local web-server.
    A file or JSFiddle might not show anything in the "alert()", but the web developer
    tools will show that the cookie actually does exist.


