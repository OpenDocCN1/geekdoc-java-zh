  md: '# 9.2.2 Focus and Blur Events


    These events fire when the HTML elements you can interact with gain/ lose focus.
    They are most commonly used in forms and especially helpful when you want to do
    the following tasks:


    +   - To show tips or feedback to users as they interact with an element within
    a form. The tips are usually shown in the elements other than the one the user
    is interacting with.

    - To trigger form validation as a user moves from one control to the next without
    waiting to submit the form.


    The different focus and blur events are as follows:


    +   - focus: This event fires, for a specific DOM node, when an element gains
    focus.

    - blur: This fires, for a specific DOM node, when an element loses focus.

    - focusin: This event is the same as the focus event. But Firefox doesn''t support
    the focus event.

    - focout: This is the same as the blur event. This is a new event type in JavaScript,
    thus not supported in Firefox right now.


    The focus and blur events use the capture approach, while the focus and focout
    events use both capture and bubble approach of the event flow.


    # 9.2.3 Mouse Events


    These events fire when the mouse moves or the user clicks a button. All the elements
    of the page support these events and the bubbling approach. These actions work
    differently on touchscreen devices cause unexpected results. The various mouse
    events of JavaScript are as follows:


    +   - click: This event fires when the user clicks on the primary mouse button
    (usually the left button). This event also fires if the user presses the Enter
    key on the keyboard when an element has focus.


    Touch-screen: A tap on the screen acts like a single left-click.


    +   - dclick: This event fires when the user clicks the primary mouse button,
    in quick succession, twice.


    ![](img/bad15d306b2109ba849fab2c31f711a9_296_0.png)


    Touchscreen is the assembly of both an input (touch panel) and output (display)
    device.'
