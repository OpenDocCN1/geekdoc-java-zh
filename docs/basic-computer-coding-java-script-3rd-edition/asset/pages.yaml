    # 3.2.6 Date Methods


    The Date object provides a system-independent abstraction of dates and times.
    Dates may be constructed from a year, month, day of the month, hour, minute, and
    second, and those six components, as well as the day of the week, may be extracted
    from a date.


    Dates may also be compared and converted to a readable string form. A Date is
    represented to a precision of one millisecond.


    The way JavaScript handles dates is very similar to the way Java handles dates:
    both languages have many of the same date methods, and both store dates internally
    as the number of milliseconds since January 1, 1970 00:00:00. Dates prior to 1970
    are not allowed.


    Here is a list of each method and its description.'
