    You can create any variable name you want, and set it to

    whatever value you wish, to the following constraints:


    +   - max-age


    Cookies have, by default, a lifespan of the current browser

    session. As soon as your visitor chooses his browser, the

    cookie cookies disappears. To make it longer, you will need to

    set the max-age variable to contain the number of seconds

    (yes, seconds) when you want the cookie to last.


    For example, if you want your cookie to last 30 days,

    set it to 2,592,000. Instead of pre-calculating this

    and putting it into your script, you can have the JavaScript

    interpreter calculate it for you at run, and encode it


    ```

    “theme=blue; max-age=" + 60*60*24*30 + "; path=/;

    domain=theitsewizard.com”

    ```


    This is superior to writing a huge number that you will

    forget the meaning of in the future.


    +   - path


    By default cookies are valid only for web pages in the

    directory of the web page that stored them, as well as

    the descendants. That is, if a cookie is set by http://example.

    com/abc/webpage.html, it will be valid for http://example.

    com/abc/yet-another-page.html as well as http://example.

    com/abc/Sub-Folder/index.html, but not for http://example.

    com/index.html.


    If you want the cookie to be valid in some other directory,

    say, http://example.com/special/, you will need to set the

    path to contain the value "special". If you want

    t cookie to be valid everywhere on your site, set it to the

    root of your web directory, that is, "/".


    +   - domain


    Another special variable name that you may want to

    note is the domain variable. Cookies set in sub-domains

    like example.com will only be valid for that subdomain.

    If you want it to be valid for all subdomains of example,

    com, you will need to set the domain to point to "example.

    com". The cookie will then be valid for "www.example.com",

    "blog.example.com", and whatever other subdomains that

