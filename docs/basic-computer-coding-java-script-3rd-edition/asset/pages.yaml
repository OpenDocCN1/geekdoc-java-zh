    # # SUMMARY


    +   - Syntax refers to the rules that specify the correct combined sequence of
    symbols that can be used to form a correctly structured program using a given
    programming language. Programmers communicate with computers through the correctly
    structured syntax, semantics and grammar of a programming language.


    +   - JavaScript is a case-sensitive language. This means that the language keywords,
    variables, function names, and any other identifiers must always be typed with
    a consistent capitalization of letters.


    +   - The modern JavaScript is a "safe" programming language. It does not provide
    low-level access to memory or CPU, because it was initially created for browsers
    which do not require it.


    +   - JavaScript''s abilities in the browser are limited for the sake of the user''s
    safety. The aim is to prevent an evil webpage from accessing private information
    or harming the user''s data.


    +   - The name of a variable, function, or property is known as an identifier
    in JavaScript. Identifiers consist of letters and numbers, but they cannot include
    any symbol outside of $ and _ and cannot begin with a number.


    +   - JavaScript is a rich and expressive language in its own right. While it
    will be of particular value to people with no programming experience, even people
    who have used other programming languages may benefit from learning about some
    of the peculiarities of JavaScript.


    +   - JavaScript operators are used to assign values, compare values, perform
    arithmetic operations, and more.


    +   - Arrays are zero-indexed lists of values. They are a handy way to store a
    set of related items of the same type (such as strings), though in reality, an
    array can include multiple types of items, including other arrays.


