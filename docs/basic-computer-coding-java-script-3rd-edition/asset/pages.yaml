  md: '# Cookies


    +   - A name-value pair that stores whatever data you want to save.

    - An expiry date, after which time the entry will be deleted.

    - The web domain and path that the entry should be associated with.


    You can use JavaScript to read or write a new entry to the cookie file. The process
    of creating an entry is often referred to as ‘writing a cookie’, but this is misleading.
    The cookie is the text file which contains all of your entries, while the individual
    entries themselves hold the data. Each domain name on the web can have a cookie
    file associated with it, and each cookie can hold multiple entries.


    ![](img/bad15d306b2109ba849fab2c31f711a9_188_0.png)


    When you request a file from a server that you have used previously, the data
    in the relevant cache is sent to the server along with your request. This server-side
    scripts, as those written in Perl or PHP, can read your cookie and figure out
    whether you have permission to view a certain page, for instance. Cookies can
    also be used for somewhat more malicious purposes, by advertising companies to
    track your behavior online. Modern browsers include good methods that allow you
    to block cookies from certain sites, so which you disclose information is now
    at your discretion.


    The name-value pair part of the entry is very similar to declaring a variable
    when you want to retrieve information you ask for the value that is associated
    with a name that you provide. The expiry date is stored in an unfriendly UTC format;
    fortunately there are methods for generating a suitable date. If a date is not
    set, the entry is deleted when you choose your browser.


    The domain and path that you associate your cookie with to be part of the same
    domain that your site belongs to. For instance, you can set your cookie to be
    active for www.yourdomain.com, the default; or to yourdomain.com, which will cover
    all and all subdomains you set up for. You cannot, however, set it to yahoo.com,
    for security reasons. Using the path that you want to restrict a cookie to be
    valid only for a certain directory. If you will want it to be available to any
    page in the domain, so this is set to /, the root directory.


