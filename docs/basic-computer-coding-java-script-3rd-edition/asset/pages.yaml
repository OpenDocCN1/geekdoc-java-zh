    # 3.3.1 The Date Object


    The Date object is a built-in object in JavaScript that stores the date and time.
    It provides a number of built-in methods for formatting and managing that date.
    By default, a new Date instance without arguments creates an object corresponding
    to the current date and time. This will be created according to the current computer''s
    system settings.


    To demonstrate JavaScript''s Date, create a variable and assign the current date
    to this. This section is written on Wednesday, October 18th in London (GMT), so
    is that the current date, time, and time zone are represented below.


    ```

    now.js

    // Set variable to current date and time

    const now = new Date();

    // View the output

    ```


    Output

    Wed 18 Oct 2017 12:41:34 GMT+0000 (UTC)

    Looking at the output, we have a string containing the following:


    | Week | Month | Day | Year | Hour | Minute | Second | Time zone |

    |---|---|---|---|---|---|---||

    | Wed | Oct | 18 | 2017 | 12 | 41 | 34 | GMT+0000 (UTC) |


    The date and time is broken up and printed in a way that we can understand as
    humans. JavaScript, understands the date based on a timestamp derived from Unix
    time, which is a value consisting of the number of milliseconds that have passed
    since midnight on January 1st, 1970. We can get the timestamp with the getTime()
    method.


