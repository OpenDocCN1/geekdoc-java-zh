  md: '# Basic Computer Coding: Java Script


    the HTML source. In both cases, it is the same document but the Document Object
    Model (DOM) representation allows it to be manipulated. As an object-oriented
    representation of the web page, it can be modified with a scripting language such
    as JavaScript.


    For example, the DOM specifies that the querySelectorAll method in this code snippet
    must return a list of all the <p> elements in the document:


    ```

    const paragraphs = document.querySelectorAll("p");

    // paragraphs[0] is the first <p> element

    // paragraphs[1] is the second <p> element

    alert(paragraphs[0].nodeName);

    ```


    ![](img/bad15d306b2109ba849fab2c31f711a9_149_0.png)


    All of the properties, methods, and events available for manipulating and creating
    web pages are organized into objects. For example, the document object that represents
    the itself, any table objects that implement the HTMLTableDOM interface for accessing
    HTML tables, and so far, are all objects. The DOM is built using multiple APIs
    that work together. The DOM defines the entities describing any document and the
    objects within it. It is expanded as needed by other APIs that add new features
    and capabilities to the DOM. For example, the HTML DOM API adds support for representing
    HTML documents to the core DOM, and the SVG API adds support for representing
    SVG documents.


    The innerHTML property can be used to change any HTML element, including <html>
    and <body>.


    # 5.1 HTML DOM METHODS


    HTML DOM methods are actions you can perform (on HTML Elements).


    HTML DOM properties are values (of HTML Elements) that you can set or change.


    # 5.1.1 The DOM Programming Interface


    The HTML DOM can be accessed with JavaScript (and with other programming languages).


    In the DOM, all HTML elements are defined as objects. The programming interface
    is the properties and methods of each object. A property is a value that you can
    get or set (like changing the content of an HTML element).


    A method is an action you can do (like add or deleting an HTML element).'
