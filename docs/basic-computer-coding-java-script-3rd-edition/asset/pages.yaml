    # 5.8 HTML DOM EVENTENER


    The addEventListener() method attaches an event handler to the specified element.


    # 5.8.1 The addEventListener() method


    # Example


    +   Add an event listener that fires when a user clicks a button:

    document.getElementById("myBtn").addEventListener("click", displayDate);

    TheEventListener() method attaches an event handler to the specified element.

    The addEventListener() method attaches an event handler to an element without
    overwriting event handlers.

    You can add many event handlers to one element.

    You can add many event handlers of the same type to one element, i.e "click" events.

    You can add event listeners to any DOM object not only HTML elements. i.e the
    window object.

    The addEventListener() method makes it easier to control how the event reacts
    to bubbling.

    When using the addEventListener method, the JavaScript is separated from the HTML
    markup, for better readability and allows you to add event listeners even when
    you do not control the HTML markup.

    You can easily remove an event listener by removing the removeEventListener method.


    # 5.8.2 Syntax


    ```

    element.addEventListener(event, function, useCapture);

    ```


    +   The first parameter is the type of the event (like "click" or "mousedown\).

    The second parameter is the function we want to call when the event occurs.

    The third parameter is a boolean value specifying whether to use event bubbling
    or event capturing. This parameter is optional.'
