    A cookie is an amount of information that persists between a server-side and a
    client-side. A web browser stores this information at the time of a user and semi-colons.
    A cookie contains the information as a string generally in the form of a name-value
    pair separated by semi-colons. It maintains the state of a user and remembers
    the user''s information among all the web pages.


    Cookies are data, stored in small text files, on your computer. When a web server
    has sent a web page to a browser, the connection is shut down, and the server
    forgets everything about the user.


