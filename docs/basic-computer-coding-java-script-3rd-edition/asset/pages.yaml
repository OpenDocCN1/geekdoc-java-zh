  md: "# Example\n\nThe following example changes the content (the innerHTML) of the\
    \ <p> element with id=\"demo\":\n\n```\n<html>\n<body>\n  <p id=\"demo\"></p>\n\
    \  <script>\n    document.getElementById(\"demo\").innerHTML = \"Hello World\"\
    ;\n  </script>\n</body>\n</html>\n```\n\nIn the example above, getElementById\
    \ is a method, while innerHTML is a property.\n\n# 5.1.2 The getElementById Method\n\
    \nThe most common way to access an HTML element is to use the id of the element.\n\
    \nIn the example above the getElementById used id=\"demo\" to find the element.\n\
