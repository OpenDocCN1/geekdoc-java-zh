  md: '# Basic Computer Coding: Java Script


    The Book() function two arguments: the new object as this (as a hidden parameter)

    and the "901-3865" as isbn. The function, in turn, sets the object''s isbn property

    to«901-3865» and also adds the getIsbn() method to the object. JavaScript returns

    the newly created object to the caller then assigns the new object to the

    book variable.


    Each time you invoke new Book(), a new getIsbn method is created which is

    a rather inefficient because the method is the same for all book instances. A
    better

    approach is to let all instances share a single method which can be accomplished

    by adding getIsbn to the prototype of Book rather than the Book function itself.

    Here is how this is done:


    +   1. function Book(isbn) {

    2. this.isbn = isbn;

    3. }

    4. Book.prototype.getIsbn = function () {

    5. return "Isbn is " + this.isbn;

    6. }

    7. var book = new Book("901-3865");

    8. let(book.getIsbn()); // => Isbn is 901-3865'
