    # 3.2.5 Array Methods


    JavaScript are are special kind of object, and are created dynamically. An array
    object contains a number of variables. The number of variables may be zero, in
    which case the array is said to be empty.


    The variables contained in an array have no names; instead they are referenced
    by array access expressions that use nonnegative integer index values. These variables
    are called the components of the array. If an array has n components, we say n
    is the length of the array; the components of the array are referenced using integer
    indices from 0 to n-1, inclusive.


    Unlike Java, the components of an array do not necessarily have the same type.
    An array component of an array can itself be an array, to create essentially multi-dimensional
    arrays.'
