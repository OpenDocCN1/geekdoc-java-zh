  md: 'Cookies expired in the past will be deleted once the web browser is closed.
    Cookies can also be deleted explicitly.


    +   2. It is this expiry behavior that leads to ‘session cookies’. Session cookies
    have no actual definition beyond that they are defined to expire in the past from
    the very time that they are created. The emergent behavior is that they act as
    temporary cookies, existent only for a browser session.


    +   3. Session cookie XSS prevention security is lost if web browser tabs are
    used: the cookies do not expire because the browser is never closed.


    +   4. Cookie expiry time is measured in GMT UNIX timestamp seconds, hence client/server
    time is theoretically the same – but is still needed as computer clocks may be
    fast/slow


    +   5. A third-party cookie is a cookie that is set on a domain name that the
    main page document cannot read. This is possible only because a document may reference
    images on other servers, and these images may set cookies (URL can generate cookies).
    Some browser privacy settings disable them.


    +   6. While cookies are sometimes disabled by people for privacy concerns, session
    cookies are usually allowed as an exception – so it is not the end of the world
    if session cookies are required – but it is better to be able to store IDs in
    the URL. Some popular websites require cookies to be enabled though (Tesco, New
    York Times, ...).


    +   7. Full cookie data is sent with all web requests that the cookies are scoped
    under, even image requests – so it is inefficient to store a lot of cookies.


    +   8. Cookies must be set against a domain name. This is either by putting .domain
    as the cookie domain, or by leaving the domain blank when setting the cookie;
    the domain should never be defined as as it will not work properly.


    +   9. Cookies work with an elaborate but confusing precedence system. Only cookies
    underneath a matched domain/path combination will be sent to a server URL (for
    privacy reasons), and they will be given precedence based on ‘most specific gets
    priority’. To change the cookie the server must set against the domain/path combination
    it was created with. The variables a cookie defined under are not available server-side,
    which means that anyone modifying the cookie must know this in advance, or guess
    wildly.


    +   10. There is a legitimate privacy concern with cookies when ads are concerned.
    Banner rotations run from centralized sites, and hence have the ability to effectively
    track users from this centralised site but without regard any site they visit
    that uses the rotation. Nevertheless, such tracking could happen regardless of
    cookies, via server logging and cross-server messaging – so blaming cookies is
    simplistic.


    +   11. Microsoft made a great extension to Netscape’s original cookie spec, allowing
    ‘HTTP only’ cookies (that JavaScript cannot read). Use'
