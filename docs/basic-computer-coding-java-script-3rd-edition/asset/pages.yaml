    # Objects and Properties


    A JavaScript object has properties associated with it. A property of an object
    can be explained as a variable that is attached to the object. Object properties
    are basically the same as ordinary JavaScript variables, except for the attachment
    to objects. The properties of an object define the characteristics of the object.
    You access the properties of an object with a simple-notation


    ```

    objectName.propertyName

    ```


    Like all JavaScript variables, both the object name (which could be a normal variable)
    and property name are case sensitive. You can define a property by assigning it
    a value. For example, let''s create an object named myCar and give it properties
    named make, model, and year as follows:


    ```

    var myCar = new Object();

    myCar.make = ''Ford'';

    myCar.model = ''Mustang'';

    myCar.year = 1969;

    ```


    Unassigned properties of an object are undefined (and not null):


    ```

    myCar.color; // undefined

    ```


    Properties of JavaScript objects can also be accessed or set using a bracket notation
    (for more details see property accesses). Objects are sometimes called associative
    arrays, since each property is associated with a string value that can be used
    to access it. So, for example, you could access the properties of the myCar object
    as follows:


    ```

    myCar[''make''] = ''Ford'';

    myCar[''model''] = ''Mustang'';

    myCar[''year''] = 1969;

    ```


    An object property name can be any valid JavaScript string, or anything that can
    be converted to a string, including the empty string. However, any property name
    that is not a valid JavaScript identifier (for example, a property name


