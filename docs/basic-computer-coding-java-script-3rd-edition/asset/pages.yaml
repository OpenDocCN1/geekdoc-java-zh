  md: '# Basic Computer Coding: JavaScript


    as the descendant of another node already in the document.


    The problem with the mutation events is that lots of changes to your page can
    make your page slow or unresponsive. These can also trigger event listeners, modifying
    DOM and leading to more mutation events firing. This is the reason for introducing
    mutation observers to the script.


    Mutation observers wait until the current task finishes reacting, then reports
    the changes in a batch (one at a time). This reduces the number of events that
    fire when you change the DOM tree through your script. You can also specify changes
    in the DOM you want to react to.


