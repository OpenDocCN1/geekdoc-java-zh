  md: '# Basic Computer Coding: Java Script


    Persistent cookies are also capable of providing the browsing behavior of users.

    As mentioned before, we can make a cookie persistent by defining it with expiration
    date and time, which would look like something like the example below:

    username=Hans; Expires=Sun, 22 Oct 2017 08:00:00 UTC;


    This will be used to delete a cookie, by setting the expiration date to in the
    past - your browser will remove the cookie based on that.


    +   - The date format for cookies must be in a UTC/GMT format (i.g. Sun, 22 Oct
    2017 08:00:00 UTC), correct for your timezone needed.

    - UTC versus GMT: both indicate the same time, however; UTC is a time zone, whereas
    GMT is a timezone. UTC is preferred.


    OK, ready for an example - here it can be very helpful to look at the earlier
    mentioned "Inspect" (web developer) tools, since it lists these properties as
    well. Our JavaScript will look something like this (remember to change the date
    here if you are testing after 22nd Oct 2017 8 AM UTC):


    # Example


    document.cookie = "username=Hans; Expires=Sun, 22 Oct 2017 08:00:00 UTC;\nalert(document.cookie);


    And when inspecting the cookies with Chrome (for example), we will see something
    like:


    | Name | Domain | Path | Expires/Max-Age | Size | HTTP | Secure | SameSite |

    |---|---|---|---|---|---|---|-|

    | username | Hans | fiddle.js.com | /display | 2017-10-22T08:00:00Z | 12 | | Secure
    |  |


    Here we can see the name, value, domain, path, expiration date/time, (number of
    characters of name + value), HttpOnly, Secure and SameSite. The alert on the other
    hand shows "username=Hans".


    A few things to note here, and the alert() message kind-a points in that direction
    as this:


    +   - document.cookie only holds the name-value pairs that we are allowed to see,

    - properties of a value pair (like expiration) is not returned to use when we
    read document.cookie.


    The fact that we can see this info in the web developer tool, is because these
    tools are part of your browser and allow looking into the inner workings – which
    is great for developers and for we are learning more about cookies.


    # 6.2.3 Secure Cookie – Which only works when HTTPS is used


    A secure cookie, also known as httpOnly cookie, is a type of cookie that only
    works with HTTP/HTTPS does not work for scripting languages like JavaScript. Since


