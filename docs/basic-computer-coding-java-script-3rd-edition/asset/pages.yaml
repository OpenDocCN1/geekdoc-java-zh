  md: '# # SUMMARY


    +   - Classes and Objects are basic concepts of Object Oriented Programming that
    revolve around real-life entities.

    - JavaScript classes, introduced in ECMAScript 2015, are primarily syntactic sugar
    over JavaScript''s existing prototype-based inheritance. Classes are actually
    just a special function.

    - Classes are a template for creating objects. They encapsulate data with code
    to work on data. Classes in JS are built on prototypes but also have some syntax
    and semantics that are unique to classes.

    - Apart from the 7 primitive datatypes there is the most important datatype in
    JavaScript which is Object. Although the nature of this datatype is completely
    different from the primitive datatypes That means in the primitive dat only one
    value is stored but an object can store more than one value even of different
    types.

    - A class expression is another way to define a class. Class expressions can be
    named or unnamed. The name given to a class expression is local to the class''s
    body.

    - The body of a class is executed in strict mode, i.e., code written here is subject
    to stricter syntax for increased performance, some otherwise silent errors will
    be thrown, and certain keywords are reserved for future versions of ECMAScript.

    - In "classical" languages such as Java, singleton means that you can have only
    one single instance of this class at any time, you cannot create more objects
    of the same class.

    - JavaScript has several built-in or native objects. These objects are accessible
    anywhere in your program and will work the same way in any browser running in
    any operating system.

    - Methods are the functions that let the object do something or something be done
    to it. It is a small difference between a function and a method – a function is
    a standalone unit of statements and a method is attached to an object and can
    be referenced by this keyword.

    - JavaScript is designed on a simple object-based paradigm. An object is a collection
    of properties, and a property is an association between a name (or key) and a
    value. A property''s value can be a function, in which case the property is known
    as a method.'
