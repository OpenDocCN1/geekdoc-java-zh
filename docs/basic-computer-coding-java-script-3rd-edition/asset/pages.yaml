  md: '# Basic Computer Coding: Java Script


    3RD EDITION


    JavaScript is a versatile programming language primarily utilized by web browsers
    to enhance user experiences through dynamic and interactive elements. It plays
    a crucial role in enabling various functions and applications that have become
    essential in modern internet usage. While not the exclusive client-side scripting
    language, JavaScript stands out as one of the pioneers and maintains its status
    as the most widely used. To streamline development, inventive programmers have
    developed JavaScript libraries, which are simplified languages constructed from
    JavaScript components, designed for specific applications. The language has become
    indispensable for web development, enabling increased interactivity and complexity
    in applications across diverse domains such as search engines, e-commerce platforms,
    content management systems, responsive design, social media, and mobile apps.
    In essence, the internet landscape as we know today would not be possible without
    the foundational contributions of JavaScript.


    Organization of the Book


    This edition contains nine chapters. Information is completely revised and new
    chapters are added. This book provides clear guidance on how to use approaches
    to writing JavaScript. A guide for beginners offers an overview of JavaScript
    basics and explains how to create Web pages, identify browsers, and integrate
    sound, graphics, and animation into apps.


    Lanre Badegesin''s areas of expertise include fault-tolerant computing, computer
    and network security, peer-to-peer and grid computing, as well as performance
    evaluation of distributed systems. He has delivered presentations on various topics
    such as smart sensors, sensing technology, WSN (Wireless Sensor Networks), IoT
    (Internet of Things), ICT (Information and Communication Technology), smart grid,
    and energy harvesting. In addition to his presentations, Lanre also co-authored
    five books and has published over 70 peer-reviewed articles in journals, books,
    and conference proceedings in the field.


