  md: '![](img/bad15d306b2109ba849fab2c31f711a9_148_0.png)


    # CHAPTER 5


    # HTML DOM


    # INTRODUCTION


    The Document Object Model (DOM) is the data representation of the objects that
    comprise the structure and content of a document on the web.


    The Document Object Model (DOM) is a programming interface for web documents.
    It represents the page so that programs can change the document structure, style,
    and content. The DOM represents the document as nodes and objects; that way, programming
    languages can interact with the page.


    A web page is a document that can be either displayed in the browser window or
    as


    After studying this chapter, you will be able to:


    +   1. Discuss the HTML DOM methods and HTML DOM document


    +   2. Learn HTML DOM elements and changing HTML


    +   3. How to changing CSS and HTML DOM animation


    +   4. Explain the HTML DOM events and HTML DOM eventlistener


    +   5. Describe the HTML DOM navigation and HTML DOM elements (nodes)'
