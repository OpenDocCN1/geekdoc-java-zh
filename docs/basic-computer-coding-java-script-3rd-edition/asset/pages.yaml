    # 10.2 JAVASCRIPT VARIABLES


    Variable means anything that can vary. In JavaScript, a variable stores data that
    can be changed later on.


    A JavaScript variable is simply a name of storage location. There are two types
    of variables in JavaScript: local variable and global variable.


    There are some rules while declaring a JavaScript variable (also known as identifiers):


    +   - Name must start with a letter (a to z or A to Z), underscore(_), or dollar
    ($) sign.


    +   - After first letter we can use digits (0 to 9), for example value1.


    +   - JavaScript variables are case sensitive, for example x and X are different
    variables.


    > The null and undefined variables are one of the main reasons for runtime errors
    in JavaScript: The best practice is to check variables for null or undefined before
    using them.


    # Correct JavaScript variables


    +   - var x = 10;


    +   - var_value="sonoo"


    # Incorrect JavaScript variables


    +   - var 123=30;


    +   - var*aa=320;


    # Example of JavaScript Variable


    Let''s see a simple example of JavaScript variable.


    ```

    <script>

    var x = 10;

    var y = 20;

    var z=x+y;

    document.write(z);

    </script>

    ```


