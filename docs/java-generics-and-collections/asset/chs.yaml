  \n献给我亲爱的家人，你们是我的世界。我妻子无限的爱以及儿子卓越的成就和灿烂的笑容激励着我超越自我。如果没有他们的支持，这本书是不可能的。\n\n## 前言\n\
  \n\n\n\n\n\n本节将探索如何限制泛型`generics` 中使用的类型。我们将涵盖上界、下界和通配符，向你展示如何构建更灵活、安全的代码以便在编译时防止意外错误。\n\
  \n本章桥接了泛型与集合框架（Collections Framework）之间的差距，详细介绍了如何将泛型应用于 `List<String>`、`Set<Integer>`\
  \ 和 `Map<String, User>` 等日常数据结构中。我们将探索这如何让你的集合管理变得更加安全且易于阅读。\n\n本章提供了集合框架架构的基础概述。我们将查看主要的接口（`Collection`、`List`、`Set`、`Map`）并讨论它们如何在逻辑分级结构中共同配合。\n\
  \n本章探索了 `List` 接口及其主要实现，包括 `ArrayList`、`LinkedList`、`Vector` 和 `Stack`。你将学习它们之间的区别。\n\
  \n本章探索了 `Map` 接口及其主要实现，包括 `HashMap`、`LinkedHashMap`、`TreeMap` 和 `Hashtable`。\n\n\
  本节讨论了特殊的 `Queue` 和 `Deque` 接口及其实现，如 `PriorityQueue` 和 `ArrayDeque`。\n\n本章涵盖了重要的工具类，如\
  \ `Collections` 和 `Arrays`，它们提供了排序、搜索和处理数据的方法。你将发现强大的静态方法，可以轻松地对你的数据进行排序、搜索和处理。\n\
  \n本节通过概述编写高效、可维护和同步代码的最佳实践，综合了相关知识。我们将帮助你避免常见错误并编写专业级别的 Java 代码。\n\n本章通过案例研究和具体的示例，演示了泛型和集合如何在实际的真实世界场景中使用，向你展示如何解决常见问题。\n\
  \n本书以对关键概念的总结以及对 Java 未来发展的探索作为结束。我们将查看最近的进展和未来趋势，帮助你保持领先。\n\n\n请点击链接下载书籍的代码包（`Code\
  \ Bundle`）和彩色图片（`Coloured Images`）：\n\n[`rebrand.ly/091a3a`](https://rebrand.ly/091a3a)\n\
  \n书籍的代码也托管在 GitHub 上：[`github.com/bpbpublications/Java-Generics-and-Collections`](https://github.com/bpbpublications/Java-Generics-and-Collections)。如果代码有更新，将在现有的\
  \ GitHub 仓库中进行更新。\n\n\n我们对 BPB Publications 的工作非常自豪，并遵循最佳实践以确保准确性。非常感谢您的反馈。\n\n\n\
  \n本章介绍了 Java 中的泛型概念，这一特性通过在编译时强制检查来增强类型安全，减少运行时错误并提高可读性。我们首先从开发中对泛型的需求开始。我们还将探索编程接口（API）。\n\
  \n\n本章涵盖了以下主题：\n* 构造函数\n\n\n在本章结束时，你将清晰理解在 Java 中使用泛型的目的和好处。你将学习泛型的基础语法和核心概念，使你能够自信地将其应用于实际场景。此外，本章最后有一组练习题来测试你的理解情况。\n\
  \n\nJava 泛型于 2004 年作为 Java 开发工具包 5（`JDK5`）的一部分引入，旨在使代码更安全且更容易复用。它们提供了一种机制，可以创建与不同类型工作的类、方法和接口，而无需每次都重写代码。\n\
  \n\n### 背景\n\n泛型旨在解决旧代码中需要大量手动类型检查（强制转换）的局限性，特别是集合部分。\n在泛型之前，Java 开发者必须使用原始类型（raw\
  \ types），这允许集合存储任何对象类型。这种方法在开发者无意中向集合添加不兼容类型时会导致运行时错误。例如，向整数集合中添加字符串只会在运行时访问值时才会导致错误，引发\
  \ `ClassCastException` 并潜在的程序故障。\n\n以下是不使用泛型的示例：\n\n```\nList listWithoutGenerics\
  \ = new ArrayList();\nInteger number = (Integer) listWithoutGenerics.get(0); //\
  \ 运行时错误\n```\n\n以下是使用泛型的示例：\n```\nList<String> stringList = new ArrayList<>();\n\
  stringList.add(\"A String\");\n// Integer number = (Integer) stringList.get(0);\
  \ // 编译时错误\nString text = stringList.get(0); // 编译时安全性无需强制转换\n\n\n\n\n\n\n在泛型出现之前，开发者通常需要为不同的数据类型创建同一类或接口的不同版本，这导致了所谓的接口或类爆炸。例如，为了以类型安全的方式处理类型，可能会创建：\n\
  \n```java\nclass ListOfIntegers implements List { ... }\nclass MapOfStringToInteger\
  \ implements Map { ... }\n```\n\n这种重复使得代码更难以维护和扩展。\n泛型通过允许单一实现适用于不同的数据类型，消除了这个问题。开发者可以编写一次泛型类或方法，并在各种类型中复用它，减少了重复并使代码更整洁、更易维护。\n\
  \n以下是一个示例：\n\npublic class CommonBox<T> {\n    private T commonItem;\n\n    public\
  \ void setCommonItem(T item) {\n    }\n\n    public T getCommonItem() {\n      \
  \  return commonItem;\n    }\n}\n\n`CommonBox` 类可以用于创建不同数据类型的类。\n\n例如，创建一个 `Integer`\
  \ 类型的 `CommonBox`：\n\nCommonBox<Integer> intBox = new CommonBox<>();\nintBox.setItem(123);\n\
  ```\n\n\n```java\nCommonBox<String> strBox = new CommonBox<>();\nstrBox.setItem(\"\
  Hello\");\n```\n\n\n泛型消除了手动类型转换的需求，这种转换可能会在程序执行期间导致错误。通过提前指定类型，泛型在编译时强制类型安全，防止了这些运行时错误。\n\
  \n以下是不使用泛型的示例：\n\nList commonList = new ArrayList();\ncommonList.add(\"Hello\");\n\
  String text = (String) commonList.get(0); // 需要显式转换\n```\n\n\n```java\nList<String>\
  \ stringList = new ArrayList<>();\nstringList.add(\"Hello\");\n```\n\n## 提高可读性\n\
  \n通过指定集合可以包含的数据类型，泛型使代码更易于阅读和理解，提高了可维护性并降低了错误概率。\n以下是不使用泛型的示例：\n\n```java\nList\
  \ commonList = new ArrayList();\ncommonList.add(123); // 添加了一个整数，这可能并非本意\n\nfor\
  \ (Object obj : commonList) {\n    String str = (String) obj; // 需要转换，容易产生运行时错误\n\
  }\n```\n\n以下是使用泛型的示例：\n\nList<String> stringList = new ArrayList<>();\nstringList.add(\"\
  Hello\");\n// stringList.add(123); // 编译错误，防止添加不兼容的数据\nfor (String str : stringList)\
  \ {\n}\n```\n\n显而易见，列表只能包含字符串对象，提高了可读性并减少了困惑。\n\n\n泛型可以通过避免运行时不必要的转换和类型检查来带来性能提升。这导致了更快的执行，特别是在频繁类型操作的场景下。\n\
  \n> 注意：这在官方 Java 文档中并未得到正式确认或明确声明，关于这些性能收益的程度可能仍存在争议。\n以下是不使用泛型的示例：\n\n```java\n\
  List commonList = new ArrayList();\nString str = (String) commonList.get(0); //\
  \ 在运行时发生转换\n```\n\n以下是使用泛型的示例：\n\nList<String> stringList = new ArrayList<>();\n\
  stringList.add(\"Hello\");\nString str = stringList.get(0); // 不需要转换，类型在编译时已知\n\
  ```\n\n\n## 向后兼容\n\n泛型的设计考虑了向后兼容性，确保现有的非泛型代码和库保持功能，同时允许开发者逐步采用泛型。\n\n\n```java\n\
  List commonList = new ArrayList();\ncommonList.add(\"Hello\");\ncommonList.add(123);\
  \ \n    String str = (String) obj; \n    System.out.println(str);\n}\n```\n\n\n\
  ```java\nList<String> stringList = new ArrayList<>();\nstringList.add(\"Hello\"\
  );\n// stringList.add(123); \nfor (String str : stringList) {\n}\n```\n\n\n\n\n\
  *   `stringInstance.setTemplateValue(\"Hello, Generics!\")`: 这将 `stringInstance`\
  \ 的值设置为 `String`。这是因为 `stringInstance` 的类型是 `TemplateClass<String>`，编译器确保只有 `String`\
  \ 类型的值可以传递给 `setTemplateValue`。\n*   `System.out.println(stringInstance.getTemplateValue())`:\
  \ 这获取了 `stringInstance` 的值，该值被保证是 `String`。不需要显式的类型转换。\n\n同样地，我们也可以这样做：\n`TemplateClass<Integer>\
  \ intInstance = new TemplateClass<>();`\n\n在这里，`T` 被替换为 `Integer`，因此 `intInstance`\
  \ 只能持有 `Integer` 类型的值。\n\n\n泛型方法允许你在方法的作用域内使用类型参数，使方法能够处理不同的数据类型，而无需为每种类型编写单独的实现。这对于操作集合或执行通用操作的工具方法来说特别有用。\n\
  \n泛型方法在方法的返回类型之前通过尖括号 `<>` 内的类型参数进行声明。\n\n\n```java\npublic static <T> void printArrayObjects(T[]\
  \ array) {\n    for (T arrayObj : array) {\n        System.out.println(arrayObj);\n\
  }\n```\n\n以下是上述代码工作原理的解释：\n\n*   `void printArrayObjects(T[] array)`: 定义了方法签名。该方法接收类型为\
  \ `T` 的数组作为参数。\n*   `for (T arrayObj : array)`: 增强 for 循环遍历数组。由于数组的类型是 `T[]`，因此每个元素的类型也是\
  \ `T`。\n\n让我们讨论一下用法。调用泛型方法时，编译器通常根据传递给方法的参数推断类型参数。你也可以显式指定类型参数，但通常没有必要。\n\n以下是几个不同的示例：\n\
  `Integer[] numbers = {1, 2, 3};`\n`printArrayObjects(numbers); // 类型推断：T 被推断为 Integer`\n\
  \n`String[] words = {\"Hello\", \"World\"};`\n`printArrayObjects(words); // 类型推断：T\
  \ 被推断为 String`\n`Character[] chars = {'a', 'b', 'c'};`\n`printArrayObjects(chars);\
  \ // 类型推断：T 被推断为 Character`\n\n// 显式指定类型参数（较少）：\n`printArrayObjects<Double>(new\
  \ Double[]{1.0, 2.0, 3.0});`\n### 边界类型参数\n\n顾其名，边界类型参数限制了可以作为类型参数指定的类型。这是通过使用 `extends`\
  \ 关键字（以及用于多个边界的 `&` 符号）来实现的。这提供了更大的类型安全性，并允许你使用特定于边界类型的方法。\n\n边界类型参数的通用语法为：\n`<T\
  \ extends BoundType>`\n\n对于多个边界：\n\n`<T extends BoundType1 & BoundType2 & ...>`\n\
  注意：`<T>` 是类型参数，一如既常地样。\n\n上面使用的关键字解释如下：\n\n*   `extends`: 该关键字表示 `T` 必须是 `BoundType`\
  \ 的子类型。这意味着 `T` 可以是 `BoundType` 本身，也可以是继承自 `BoundType` 的任何类，或者是 `T` 实现的任何接口。\n*\
  \   `BoundType`: 这是上界。它可以是一个类或一个接口。\n\n以下是一个示例：\n\n```java\npublic <T extends Number>\
  \ void processNumber(T number) {\n}\n```\n\n上面使用的关键字解释如下：\n\n*   `void processNumber(T\
  \ number)`: 这是方法签名。方法接收类型为 `T` 的参数。\n*   `System.out.println(number.doubleValue())`:\
  \ 这是方法体。这是因为 `T` 被限制为 `number` 类；我们知道 `number` 有 `doubleValue()` 方法。这是边界类型参数的优势。\n\
  \n以下是用法：\n\n`processNumber(3.14); // Double 是 Number`\n`processNumber(\"hello\"\
  ); // 编译错误：String 不是 number`\n\n### 通配符类型\n\n\n以下是一个示例：\n\n```java\npublic void\
  \ printList(List<?> list) {\n        System.out.println(arrayObj);\n    }\n}\n```\n\
  \n\n*   `public void printList(List<?> list)`: 声明了一个名为 `printList` 的方法，接收一个 `List`\
  \ 作为参数。`<?>` 是无边界通配符。这意味着该方法可以接受任何类型的列表。\n*   `for (Object arrayObj : list)`: 在方法内部，遍历列表。由于类型未知，我们将元素视为\
  \ `Object`。\n*   `System.out.println(arrayObj)`: 这一行打印当前元素。\n\n\n示例：\n\n`List<String>\
  \ stringList = Arrays.asList(\"String\", \"List\");`\n`printList(stringList); //\
  \ 输出：\nString\n\n`List<Integer> integerList = Arrays.asList(101, 201, 301);`\n`printList(integerList);\
  \ // 输出：\n101\n201\n\n`List<Double> doubleList = Arrays.asList(3.14, 2.71);`\n`printList(doubleList);\
  \ // 输出：\n3.14\n2.71`\n\n\n\n\n*   `private T product;`: 这声明了一个类型为 `T` 的实例变量 `product`。`product`\
  \ 的类型将在创建 `Container` 对象时确定。\n\n让我们来讨论一下用法。当你创建一个泛型类的对象时，在角括号内提供实际类型：\n\n```java\n\
  Container<Integer> integerContainer = new Container<>(123); \nint intValue = integerContainer.getProduct();\
  \ // 不需要转换\n\nContainer<String> stringContainer = new Container<>(\"Hello\"); \n\
  // T 被替换为 String\nString textValue = stringContainer.getProduct(); // 不需要转换\n\n\
  double piValue = doubleContainer.getProduct();\n```\n\n## 使用泛型方法\n\n\n让我们讨论一下语法。通过在方法的返回类型之前在角括号\
  \ `<>` 中放置类型参数来声明泛型方法。\n\n以下是一个示例：\n\n```java\n    public static <E> void displayArray(E[]\
  \ dataArray) { // E 是类型参数\n        for (E displayItem : dataArray) {\n         \
  \   System.out.print(displayItem + \" \");\n        }\n        System.out.println();\n\
  \n    public static <K, V> void displayMap(Map<K, V> dataMap){\n        for (Map.Entry<K,\
  \ V> displayEntry : dataMap.entrySet()){\n            System.out.println(\"Key:\
  \ \" + displayEntry.getKey() + \", Value: \" + displayEntry.getValue());\n     \
  \   }\n}\n```\n\n以下是解释：\n\n*   `<E>`: 这为 `displayArray` 方法声明了类型参数 `E`。该 `E` 仅在该方法的作用域内。\n\
  *   `<K, V>`: 这为 `displayMap` 方法声明了两个类型参数 `K` 和 `V`。\n*   `Map<K, V> dataMap`: 该方法接收键类型为\
  \ `K` 值类型为 `V` 的 `Map`。\n\n让我们讨论一下用法。编译器通常根据方法的参数推断类型参数。你也可以显式地指定它，但并不常见：\n\nInteger[]\
  \ numbers = {1, 2, 3};\nUtility.displayArray(numbers); // E 被推断为 Integer\n\nString[]\
  \ words = {\"a\", \"b\", \"c\"};\nUtility.displayArray(words); // E 被推断为 String\n\
  Map<String, Integer> ages = new HashMap<>();\nages.put(\"Alice\", 30);\nages.put(\"\
  Bob\", 25);\nUtility.displayMap(ages);\n```\n\n\n虽然类本身可以是泛型的，但构造函数不像方法那样直接是泛型的。然而，如果你在一个泛型类中，构造函数会隐式地与类的类型参数工作。\n\
  \n以下是一个示例：\n\npublic class Container<T> { // T 是类型参数\n    private T product;\n\n\
  \    public Container(T product) { // 构造函数使用了类的类型参数 T\n        this.product = product;\n\
  \n    public T getProduct() {\n        return product;\n    }\n\n    public void\
  \ setProduct(T product) {\n    }\n}\n```\n\n\n\n\n### 解释\n解释：边界类型参数使用 `extends`\
  \ 关键字将类型限制为某个类或其子类。例如，`T extends Number` 确保 `T` 必须是 `Number` 的子类。在此语文中不使用 `super`\
  \ 关键字。\n\n### 6. b\n\n### 7. b\n解释：通配符 `? extends T` 代表一种可以是 `T` 或 `T` 的子类的类型。它被用于方法或类可以处理自\
  \ `T` 派生的类型的情况。\n\n### 8. d\n\n### 9. b\n解释：`E` 代表 \"Element\"（元素），通常用于 `List<E>`\
  \ 或 `Set<E>` 等集合。`T` 是一个通用的类型占位符，而 `K` 和 `V` 通常用于映射中的键值对。\n\n### 10. b\n\n## 加入我们的\
