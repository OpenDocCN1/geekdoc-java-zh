  \n# 第 9 章 工具类\n\n## 引言\n\n在现实世界的 Java 应用中，开发者经常需要对集合进行排序、搜索、修改或同步。手动执行这些操作容易出错且耗费时间。Java\
  \ 的工具类通过提供即插用的方法来简化这些常见任务，从而解了后顾。\n\n本章重点介绍如 `Collections` 和 `Arrays` 等工具类，这些类提供了静态方法来操作或返回集合和数组。本章还涵盖了包装类、同步工具类，以及如何使集合变为不可修改的或类型安全的（检查集合）。理解并有效使用这些类将帮助你编写更高效、更可读且更安全的\
  \ Java 代码。\n\n## 结构\n\n本章涵盖了以下主题：\n\n* 集合工具类\n* 使用 `Collections` 进行排序和搜索\n* 使用 `Collections`\
  \ 修改集合\n* 数组工具类\n* 使用 `Arrays` 和 `Collections`\n* 包装类\n* 同步工具\n* 不可修改集合\n* 检查集合\n\
  \n## 目标\n\n本章旨在为你提供 Java 核心工具类的实用知识，这些类简化了涉及集合和数组的常见任务。你将学习如何使用 `Collections` 类高效地对集合进行排序、搜索和修改，以及\
  \ `Arrays` 类如何为数组提供类似的功能。我们还将探索包装类的使用，它允许将基本类型用于基于对象的集合中，以及同步集合以确保线程安全的技术。最后，你将理解如何使用内置工具方法创建不可修改和类型安全的（检查）集合，使你能够在\
  \ Java 应用中编写更安全、更易于维护的代码。\n\n## 集合工具类\n\nJava 中的 `Collections` 类是 `java.util` 包的一部分，它提供了一系列操作或返回集合的静态方法。这些方法旨在简化常见的集合相关的任务，如排序、搜索、反转、洗牌、填充、复制等。\n\
  \n该类无法实例化，仅作为工具持有者。它通常与 JCF（Java 集合框架）配合使用，以提高效率并减少样板代码。\n\n`Collections` 类中的关键方法。以下是\
  \ `Collections` 工具类提供的常用方法列表：\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `sort(List<T> list)`\
  \ | 使用自然顺序将指定的列表按升序排序。 |\n| `sort(List<T> list, Comparator<? super T> c)` | 根据自定义比较器对列表排序。\
  \ |\n| `reverse(List<?> list)` | 反转列表中元素的顺序。 |\n| `shuffle(List<?> list)` | 随机打乱列表中的元素。\
  \ |\n| `swap(List<?> list, int i, int j)` | 交换指定位置上的元素。 |\n| `fill(List<? super\
  \ T> list, T obj)` | 用指定的元素替换列表的所有元素。 |\n| `copy(List<? super T> dest, List<? extends\
  \ T> src)` | 将源列表的所有元素复制到目标列表。目标列表的大小至少与源列表相同。 |\n| `binarySearch(List<? extends\
  \ Comparable<? super T>> list, T key)` | 使用二分查找查找键。列表必须经过排序。 |\n| `max(Collection<?\
  \ extends T> coll)` | 根据自然顺序返回最大元素。 |\n| `min(Collection<? extends T> coll)` | 返回最小元素。\
  \ |\n| `frequency(Collection<?> c, Object o)` | 返回等于指定对象的元素数量。 |\n| `disjoint(Collection<?>\
  \ c1, Collection<?> c2)` | 如果两个集合没有共同元素，则返回 true。 |\n\n表 9.1：`Collections` 类中的关键方法\n\
  \n### 对列表排序和反转\n\n让我们来看一个使用 `Collections` 类对列表进行排序和反转的简单示例：\n\n```java\nimport java.util.*;\n\
  \npublic class CollectionsExample {\n    public static void main(String[] args)\
  \ {\n        List<String> fruits = new ArrayList<>(Arrays.asList(\"Banana\", \"\
  Apple\", \"Mango\", \"Cherry\"));\n        // 按升序排序\n        Collections.sort(fruits);\n\
  \        System.out.println(\"Sorted List: \" + fruits); // [Apple, Banana, Cherry,\
  \ Mango]\n        // 反转列表\n        Collections.reverse(fruits);\n        System.out.println(\"\
  Reversed List: \" + fruits); // [Mango, Cherry, Banana, Apple]\n    }\n}\n```\n\n\
  以下是输出：\nSorted List: [Apple, Banana, Cherry, Mango]\nReversed List: [Mango, Cherry,\
  \ Banana, Apple]\n\n在此示例中：\n* `Collections.sort(fruits)` 按字母顺序对列表进行排序。\n* `Collections.reverse(fruits)`\
  \ 随后反转了排序后的列表。\n\n这些工具方法抽象了排序和反转的内部复杂性，使代码更简洁且更容易维护。\n\n## 使用集合进行排序和搜索\n\n在许多现实世界的应用中，你需要按照特定的顺序呈现数据或快速定位特定元素。无论你是在构建待办事项、排行榜还是处理搜索结果，排序和搜索都是帮助提升用户体验的核心操作。\n\
  \n`Collections` 类提供了用于排序和搜索列表的即用静态方法。这些方法在 Java 应用中被广泛使用。\n\n### 列表排序\n\n常见的操作是排序。Java\
  \ 提供了两种排序方式：\n* 自然顺序：当元素实现了 `Comparable` 接口时。\n* 自定义顺序：通过使用 `Comparator`。\n\n####\
  \ 自然排序\n\n考虑以下示例：\n\n```java\nList<Integer> numbers = Arrays.asList(4, 1, 3, 2);\n\
  Collections.sort(numbers);\nSystem.out.println(numbers);\n```\n\n以下是输出：\n[1, 2,\
  \ 3, 4]\n\n上面的示例说明了：\n* 我们创建一个随机顺序的整数列表。\n* `Collections.sort(numbers)` 使用自然顺序对列表进行排序。\n\
  * 原始列表被修改，元素按增加顺序重新排列。\n\n这是因为 `Integer` 实现了 `Comparable` 接口，该接口定义了如何比较两个整数。\n\n\
  #### 使用比较器排序\n\n如果你想按降序或其他任何自定义顺序排序，你需要使用 `Comparator`。让我们使用比较器的示例：\n\n```java\n\
  List<String> fruits = Arrays.asList(\"Banana\", \"Apple\", \"Mango\");\nCollections.sort(fruits,\
  \ (a, b) -> b.compareTo(a)); // 反向字母序\nSystem.out.println(fruits);\n```\n\n以下是输出：\n\
  [Mango, Banana, Apple]\n\n上面的示例说明了：\n* Lambda 表达式 `(a, b) -> b.compareTo(a)` 反转了比较，使列表按降序（Z\
  \ 到 A）排序。\n* 这允许对排序逻辑进行完全控制；你可以根据长度、不区分大小或任何自定义规则进行排序。\n\n注意：你也可以使用 `Comparator.reverseOrder()`\
  \ 或方法引用来简化语法。\n\n### 列表搜索\n\n排序之后，你可能想要快速查找元素。线性搜索对于大型列表很慢，因此 Java 提供了 `binarySearch()`，它快得多，但要求列表经过排序。\n\
  \n可以通过如下实现：\n\n```java\nList<Integer> list = Arrays.asList(10, 20, 30, 40, 50);\n\
  int index = Collections.binarySearch(list, 30);\nSystem.out.println(\"Index of 30:\
  \ \" + index);\n```\n\n以下是输出：\nIndex of 30: 2\n\n上面的示例说明了：\n* 列表已经按升序排序。\n* `Collections.binarySearch(list,\
  \ 30)` 执行二分查找，每次将列表减半以找到元素。\n\n\n\n\n\n*   如果找到元素，则返回该元素的索引；在这里，30 位于索引 2。\n\n注意：在调用\
  \ `binarySearch()` 之前，必须按升序排序列表。如果未找到元素，该方法将返回一个负值，表示插入点。\n\n### 使用自定义比较器进行二分查找\n\
  \n如果你的列表使用自定义比较器进行排序，则你必须在 `binarySearch()` 调用中使用相同的相同的比较器：\n\n```java\nList<String>\
  \ items = Arrays.asList(\"X\", \"M\", \"A\");\nCollections.sort(items, Comparator.reverseOrder());\
  \ // [X, M, A]\nint index = Collections.binarySearch(items, \"M\", Comparator.reverseOrder());\n\
  System.out.println(\"Index of M: \" + index); // 1\n```\n\n以下是输出结果：\n\nIndex of\
  \ M: 1\n\n上面的示例解释了：\n\n*   列表是倒序排序的。\n*   由于顺序不是自然顺序，我们必须将相同的比较器传递给 `binarySearch()`。\n\
  *   如果忘记传递匹配的比较器，搜索结果可能是不正确的，甚至是一个负数。\n\n这些工具方法对于 Java 中清晰、简洁高效的集合处理至关重要。无论是排序用户评分、搜索产品\
  \ ID 还是排名搜索结果，`Collections.sort()` 和 `Collections.binarySearch()` 都是首选工具。\n\n##\
  \ 使用 Collections 修改集合\n\n除了排序和搜索，`Collections` 工具类还提供了许多实用的方法，可以以一致且高效的方式修改集合的内容。这些方法允许你反转、洗牌、填充和替换元素，以及在集合之间复制数据。当你不想在编写自己的循环或转换逻辑的情况下操作集合时，这些方法特别有用。\n\
  \n让我们通过示例和解释来看常用的修改方法。\n\n### 反转列表\n\n假设我们有一个按注册顺序排列的学生姓名列表。我们想反转列表以先显示最新注册的学生。\n\
  \n考虑以下示例：\n\n```java\nList<String> students = Arrays.asList(\"Andrew\", \"Becky\"\
  , \"Carlos\");\nCollections.reverse(students);\nSystem.out.println(students);\n\
  ```\n\n以下是输出结果：\n\n[Carlos, Becky, Andrew]\n\n上面的示例解释了：\n\n*   `reverse()` 反转了列表元素的顺序。\n\
  *   这对于撤销排序操作或以倒序显示数据非常有用。\n\n### 洗牌元素\n\n假设你正在创建一个测验应用，并想在向用户显示问题之前随机化问题的顺序。你可以使用下面的\
  \ `shuffle` 方法来实现这一点：\n\n```java\nList<Integer> questionIds = Arrays.asList(101,\
  \ 102, 103, 104, 105);\nCollections.shuffle(questionIds);\nSystem.out.println(questionIds);\n\
  ```\n\n以下是输出结果：\n\n[103, 102, 105, 104, 101]\n\n上面的示例解释了：\n\n*   `shuffle()` 以随机方式重新排列列表。\n\
  *   它通常用于游戏、测试和模拟。\n\n### 给列表填充一个值\n\n假设你正在准备一个计分板，并想用默认值初始化它。你可以使用下面的 `fill()`\
  \ 方法来实现：\n\n```java\nList<String> scoreboard = new ArrayList<>(Arrays.asList(\"\
  A\", \"B\", \"C\"));\nCollections.fill(scoreboard, \"Not Started\");\nSystem.out.println(scoreboard);\n\
  ```\n\n以下是输出结果：\n\n[Not Started, Not Started, Not Started]\n\n上面的示例解释了：\n\n*   `fill()`\
  \ 将每个元素替换为指定的值。\n*   它通常用于初始化或重置列表。\n\n### 替换所有出现出现的值\n\n假设你有一个城市列表，其中发生了名称更改。你想将所有旧名称更新为新名称。你可以使用下面的\
  \ `replaceAll()` 方法来实现：\n\n```java\nList<String> cities = Arrays.asList(\"Bombay\"\
  , \"Delhi\", \"Bombay\", \"Chennai\");\nCollections.replaceAll(cities, \"Bombay\"\
  , \"Mumbai\");\nSystem.out.println(cities);\n```\n\n以下是输出结果：\n\n[Mumbai, Delhi,\
  \ Mumbai, Chennai]\n\n上面的示例解释了：\n\n*   `replaceAll()` 找到特定值的所有实例并替换它们。\n*   它对于批量更新或重命名数据集很有帮助。\n\
  \n### 将一个列表复制到另一个\n\n假设你有一个团队成员的主列表，并想创建一个临时更新的副本。你可以使用下面的 `copy()` 方法来实现：\n\n```java\n\
  List<String> masterTeam = Arrays.asList(\"Emily\", \"John\", \"Sarah\");\nList<String>\
  \ workingCopy = new ArrayList<>(Arrays.asList(\"X\", \"Y\", \"Z\"));\nCollections.copy(workingCopy,\
  \ masterTeam);\nSystem.out.println(workingCopy); // [Emily, John, Sarah]\n```\n\n\
  以下是输出结果：\n\n[Emily, John, Sarah]\n\n上面的示例解释了：\n\n*   `copy(dest, source)` 将数据从一个列表复制到另一个列表。\n\
  *   目标列表的大小至少与源列表相同，以避免 `IndexOutOfBoundsException`。\n\n这些工具方法使集合转换变得简单清晰，减少了对自定义逻辑的需求并提高了代码的可读性。\n\
  \n## Arrays 工具类\n\n虽然 `Collections` 适用于 `List` 等动态数据结构，但 Java 还提供了 `Arrays` 工具类来简化对数组（固定大小数据结构）的操作。`Arrays`\
  \ 位于 `java.util` 包中，提供了排序、搜索、填充和转换等静态方法。这些工具当你想像处理集合一样操作数组时非常有用。\n\n让我们探索 `Arrays`\
  \ 类的一些常用功能。\n\n### 排序数组\n\n假设你有一组分数的数组，想对它们进行排序。你可以使用下面的 `sort()` 方法来实现：\n\n```java\n\
  int[] marks = {85, 67, 92, 78, 88};\nArrays.sort(marks);\nSystem.out.println(Arrays.toString(marks));\n\
  ```\n\n以下是输出结果：\n\n[67, 78, 85, 88, 92]\n\n上面的示例解释了：\n\n*   `sort()` 按升序排列数组元素。\n\
  *   `Arrays.toString()` 用于打印数组内容。\n\n### 在数组中搜索\n\n现在，假设你想检查某个特定分数（例如 88）是否存在于一个已排序的数组中。考虑以下情况：\n\
  \n```java\nint[] marks = {70, 75, 80, 83, 88, 90, 95};\nint index = Arrays.binarySearch(marks,\
  \ 88);\nSystem.out.println(index);\n```\n\n以下是输出结果：\n\n4\n\n上面的示例解释了：\n\n*   `binarySearch()`\
  \ 在排序数组中查找元素的索引。\n*   如果未找到，它返回一个负值。\n\n### 填充数组\n\n假设你想用默认值 10 初始化一个大小为 5 的数组。你可以使用下面的\
  \ `fill()` 方法来实现：\n\n```java\nint[] data = new int[5];\nArrays.fill(data, 10);\n\
  System.out.println(Arrays.toString(data));\n```\n\n以下是输出结果：\n\n[10, 10, 10, 10,\
  \ 10]\n\n在上面的示例中，`fill()` 为数组的所有元素分配相同的值。\n\n### 比较数组\n\n如果你正在比较两个学生提交的答案以查看他们是否选择了相同的选项，如下所示：\n\
  \n```java\nint[] answers1 = {1, 2, 3};\nint[] answers2 = {1, 2, 3};\nSystem.out.println(Arrays.equals(answers1,\
  \ answers2));\n```\n\n以下是输出结果：\n\ntrue\n\n你可以使用 `equals()` 方法。`equals()` 检查两个数组的元素是否相同且顺序相同。\n\
  \n### 复制数组\n\n你想创建一个现有数组的副本，为未来的数据留出空间。你可以使用 `copyOf()` 方法来实现：\n\n```java\nint[]\
  \ original = {10, 20, 30};\nint[] extended = Arrays.copyOf(original, 5);\nSystem.out.println(Arrays.toString(extended));\n\
  ```\n\n以下是输出结果：\n\n[10, 20, 30, 0, 0]\n\n上面的示例解释了：\n\n*   `copyOf()` 创建一个指定长度的新数组。\n\
  *   如果新长度更大，额外的元素将填充为默认值（int 为 0）。\n\n\n\n\n\n`Arrays` 工具类确保了在 Java 中处理固定大小的数组依然保持强大、简洁，并与集合范式保持一致。\n\
  \n## 数组与集合的操作\n\n在 Java 中，`Arrays` 和 `Collections` 都用于存储元素组。然而，它们的用途不同：`Arrays`\
  \ 的大小是固定的且速度略快，而 `Collections` 则更具活性并提供了许多实用方法。有时，为了方便或性能考虑，你可能需要在两者之间进行转换。\n\n\
  `Arrays` 和 `Collections` 类提供了许多方法，帮助弥接这两种数据结构之间的鸿沟。让我们探索 `Arrays` 和 `Collections`\
  \ 交互的最常见场景。\n\n### 将数组转换为列表\n\n假设你从 `List` 中收集了用户的输入，现在想将其存储在 `Array` 中以便通过网络发送。你可以像下面的代码所示操作：\n\
  \n```\nList<String> users = Arrays.asList(\"Emma\", \"Michael\", \"Sophia\");\n\
  String[] userArray = users.toArray(new String[0]);\nSystem.out.println(Arrays.toString(userArray));\n\
  ```\n\n以下是输出：\n\n`[Emma, Michael, Sophia]`\n\n上面的示例解释了：\n\n*   `toArray(T[] a)`\
  \ 将列表转换为泛型数组。\n*   传递一个零长度数组（`new String[0]`）允许 Java 按照正确的大小分配数组。\n\n### 在数组上使用集合方法\n\
  \n尽管 `Arrays` 和 `Collections` 是不同的，但你仍然可以通过临时转换，在数组上执行许多类集合的操作。\n\n例如，如果你想反转一个名称数组，可以像下面所示：\n\
  \n```\nString[] names = {\"Alex\", \"Brian\", \"Chloe\"};\nList<String> nameList\
  \ = Arrays.asList(names);\nCollections.reverse(nameList);\nSystem.out.println(Arrays.toString(names));\n\
  ```\n\n以下是输出：\n\n`[Chloe, Brian, Alex]`\n\n上面的示例解释了：\n\n*   `Arrays.asList()` 创建了数组的列表视图。\n\
  *   修改列表也会改变原始数组。\n\n桥接 `Arrays` 和 `Collections` 让你能够兼得两者的优势：`Arrays` 的性能和 `Collections`\
  \ 的灵活性。这在处理期望特定类型的 API 时特别有用。\n\n## 包装类\n\n在 Java 中，基本类型被包装在对象中。这使得它们可以用于 `List`\
  \ 或 `Map` 等集合，而这些集合直接不支持基本类型。下表显示了基本类型与其包装类之间的映射关系：\n\n| 基本类型 | 包装类 |\n| :--- |\
  \ :--- |\n| `byte` | `Byte` |\n| `short` | `Short` |\n| `int` | `Integer` |\n| `long`\
  \ | `Long` |\n| `float` | `Float` |\n| `double` | `Double` |\n| `char` | `Character`\
  \ |\n| `boolean` | `Boolean` |\n\n包装类提供了如 `parseInt()`、`parseDouble()` 和 `valueOf()`\
  \ 等实用方法。它们还提供了如 `MAX_VALUE` 和 `MIN_VALUE` 等常量。\n\n## 同步工具\n\n在多线程环境中，确保线程安全至关重要，尤其是多个线程访问或修改集合时。Java\
  \ 提供了同步工具来帮助管理这些，而无需引入复杂的锁机制。\n\n`Collections` 类包含了几个方法，通过返回常用集合（如 `List`、`Set`\
  \ 和 `Map`）的同步版本来使集合变得线程安全。\n\n### 使列表同步\n\n假设 Ryan 和 Sophia 正在不同的线程上工作，更新一个共享的任务列表。为了防止数据损坏，列表必须同步同步。可以像下面所示创建一个同步列表：\n\
  \n```\nList<String> taskList = new ArrayList<>();\nList<String> syncTaskList = Collections.synchronizedList(taskList);\n\
  ```\n\n上面的示例解释了：\n\n*   `Collections.synchronizedList()` 为 `taskList` 包装了一层线程安全的层。\n\
  *   现在对 `syncTaskList` 的所有方法调用在内部都是同步的。\n*   然而，迭代仍然需要手动进行同步以避免 `ConcurrentModificationException`。迭代可以像下面所示进行同步：\n\
  \n```\nsynchronized (syncTaskList) {\n    for (String task : syncTaskList) {\n \
  \       System.out.println(task);\n    }\n}\n```\n\n### 同步 Set 和 Map\n\n与 List 类似，你可以像下面所示使\
  \ `Set` 或 `Map` 同步：\n\n```java\nSet<String> names = new HashSet<>();\nSet<String>\
  \ syncNames = Collections.synchronizedSet(names);\n\nMap<Integer, String> employeeMap\
  \ = new HashMap<>();\nMap<Integer, String> syncEmployeeMap = Collections.synchronizedMap(employeeMap);\n\
  ```\n\n上面的示例解释了：\n\n*   包装器确保了基础操作（如 `add`、`remove`、`get`、`put`）是线程安全的。\n*   与 List\
  \ 一样，迭代必须在 `synchronized` 块中完成。\n\n\n\n\n\n当使用 `Collections.synchronizedList()`\
  \ 等方法封装一个集合（如 `List`、`Set` 或 `Map`）时，Java 内部会为该集合的每个方法调用添加同步机制。因此，当两个或多个线程尝试调用如下所示的方法时：\n\
  \n- `add()`: 插入元素\n- `remove()`: 删除元素\n- `get()`: 通过索引访问元素（针对列表）\n- `put()`: 添加键值对（针对映射）\n\
  \n这些方法调用将使用内部锁进行自动同步。这意味着**一次只有一个线程可以执行这些方法，从而避免了冲突或数据损坏。\n\n然而，迭代（例如使用 `for-each`\
  \ 循环）并不会自动同步，因此你仍然需要手动使用 `synchronized` 块来处理这部分。\n\n## 不可修改集合 (Unmodifiable collections)\n\
  \n在许多应用程序中，特别是在多团队项目中，防止对某些数据结构的意外更改至关重要。例如，默认用户角色列表或配置键在创建后不应被修改。\n\n为了保护此类集合不被篡改，Java\
  \ 提供了使用 `Collections` 工具类提供的不可修改包装器。\n\n当集合被封装为不可修改时，任何修改它的尝试（如添加、删除或更新元素）都将导致 `UnsupportedOperationException`。\n\
  \nJava 提供了如下方法：\n\n- `Collections.unmodifiableList(List<? extends T> list)`\n- `Collections.unmodifiableSet(Set<?\
  \ extends T> set)`\n- `Collections.unmodifiableMap(Map<? extends K, ? extends V>\
  \ map)`\n\n这些方法返回原始集合的只读视图。对底层集合的更改（如果在包装器外部直接修改）仍会反映在不可修改视图中，因此建议在封装后避免修改原始集合。创建不可修改集合。\n\
  \n假设你有一份在运行期间不应更改的部门列表。你可以像下面所示创建一个不可修改的列表：\n\n```java\nList<String> departments\
  \ = new ArrayList<>();\ndepartments.add(\"HR\");\ndepartments.add(\"Finance\");\n\
  departments.add(\"IT\");\nList<String> unmodifiableDepartments = Collections.unmodifiableList(departments);\n\
  ```\n\n上面的示例解释了了：\n\n- 原始部门列表被封装在一个不可修改的层中。\n- 现在 `unmodifiableDepartments` 可以被读取，但任何修改它的尝试（如\
  \ `add()`、`remove()` 或 `clear()`）都将抛出异常。例如，下面的代码将抛出 `UnsupportedOperationException`\
  \ 异常：\n\n```java\nunmodifiableDepartments.add(\"Marketing\");\n```\n\n你可以创建所有主要集合（如\
  \ `Set` 或 `Map`）的不可修改版本，如下所示：\n\n```java\nSet<String> states = Collections.unmodifiableSet(new\
  \ HashSet<>());\nMap<Integer, String> codes = Collections.unmodifiableMap(new HashMap<>());\n\
  ```\n\n| 注意：不可修改包装器并不会深拷贝。如果底层集合被修改，更改将同样反映在不可修改的版本中。 |\n\n如下面的代码所示：\n\n```java\n\
  departments.add(\"Legal\");\nSystem.out.println(unmodifiableDepartments); // 将包含\
  \ \"Legal\"\n```\n\n因此，建议在将原始 `Collection` 封装在不可修改集合之后，避免修改它。\n\nJava 在 9 中还引入了\
  \ `List.of()`、`Set.of()` 和 `Map.of()` 方法，这些方法可以直接创建不可变集合。然而，如果你使用的是较早的版本，或者想要封装一个现有的可修改集合，`Collections.unmodifiableX()`\
  \ 是标准方法。\n\n## 预定义的空集合 (Predefined empty collections)\n\n除了不可修改包装器外，`Collections`\
  \ 类还提供了预定义的不可变空集合，这在你需要返回空结果但又想避免返回 `null` 时特别有用：\n\n- `Collections.emptyList()`\n\
  - `Collections.emptySet()`\n- `Collections.emptyMap()`\n\n让我们看看它们在实际代码中的用法示例：\n\n\
  - `Collections.emptyList()`：考虑以下示例：\n\n```java\npublic class OrderService {\n  \
  \  public List<String> getPendingOrders(String userId) {\n        if (userId ==\
  \ null || userId.isEmpty()) {\n            return Collections.emptyList();\n   \
  \     }\n        // 从数据库获取订单的逻辑\n        return Arrays.asList(\"ORD123\", \"ORD456\"\
  );\n    }\n}\n```\n\nCase 1:\n```java\npublic static void main(String[] args) {\n\
  \    OrderService service = new OrderService();\n    System.out.println(service.getPendingOrders(\"\
  user1\"));\n}\n```\n输出：`[ORD123, ORD456]`\n\nCase 2：\n```java\npublic static void\
  \ main(String[] args) {\n    OrderService service = new OrderService();\n    System.out.println(service.getPendingOrders(\"\
  \"));\n}\n```\n输出：`[]`\n\n上述解释如下：\n\n- 如果 `userId` 无效，我们返回一个空列表。\n- `Collections.emptyList()`\
  \ 确保不返回 `null`，消除了对空值检查的需要。\n- 由于列表是不可变的，也防止了意外的修改。\n- `Collections.emptySet()`：考虑以下示例：\n\
  \n```java\npublic class Student {\n    private final Set<String> enrolledSubjects;\n\
  \    public Student(boolean isEnrolled) {\n        if (isEnrolled) {\n         \
  \   this.enrolledSubjects = new HashSet<>(Arrays.asList(\"Math\", \"Science\"));\n\
  \        } else {\n            this.enrolledSubjects = Collections.emptySet();\n\
  \        }\n    }\n    public Set<String> getEnrolledSubjects() {\n        return\
  \ enrolledSubjects;\n    }\n}\n```\n\nCase 1:\n```java\nStudent s1 = new Student(true);\n\
  System.out.println(s1.getEnrolledSubjects());\n```\n输出：`[Math, Science]`\n\nCase\
  \ 2:\n```java\nStudent s2 = new Student(false);\nSystem.out.println(s2.getEnrolledSubjects());\n\
  ```\n输出：`[]`\n\n上述的解释如下：\n\n- 如果 `userId` 无效，我们返回一个空列表。\n- `Collections.emptyList()`\
  \ 确保不返回 `null`，消除了对空值检查的需要。\n- 由于列表是不可变的，也防止了意外的修改。\n- 当学生未注册时，返回空集合。\n- `Collections.emptyMap()`：考虑以下示例：\n\
  \n```java\npublic class ConfigurationService {\n    public Map<String, String> loadConfig(String\
  \ env) {\n        if (env == null || env.isEmpty()) {\n            return Collections.emptyMap();\n\
  \        }\n        // 假设从文件或数据库加载配置\n        Map<String, String> config = new HashMap<>();\n\
  \        config.put(\"timeout\", \"30\");\n        config.put(\"retry\", \"5\");\n\
  \        return config;\n    }\n}\n```\n\n上述的解释如下：\n\n- 如果没有提供环境，我们返回一个空映射。\n- `Collections.emptyMap()`\
  \ 有助于维护返回类型的一致并避免返回 `null`。\n\n这些空集合是：\n\n- 不可修改的：任何修改尝试都会导致 `UnsupportedOperationException`。\n\
  - 单例的：重用实例减少了内存开销。\n- 比 `null` 更安全：消除了调用代码中空值检查的需要。\n\n每个方法都返回对应类型的共享、不可变的空实例。\n\
  \n## 检查集合 (Checked collections)\n\nJava 是一种静态类型语言，但由于类型擦除，泛型信息在运行时会被移除。这在使用原始类型或混合泛型与非泛型代码时会导致意外的\
  \ `ClassCastException`。\n\n为了在产生实际损害之前早期发现此类问题，Java 通过 `Collections` 工具类提供了检查集合。\n\
  \n检查集合封装了集合并在每次添加元素时执行运行时类型检查。如果尝试插入错误类型的对象，它会立即抛出 `ClassCastException`。\n\n让我们考虑这种情况：Paul\
  \ 创建了一个学生姓名列表，假设它只包含 `String` 值。后来，Royston（在另一个模块中工作）不小心向其中添加了一个 `Integer`。\n\n\
  如果不使用检查集合，代码将如下所示：\n\n```java\nList studentNames = new ArrayList(); // 原始类型\nstudentNames.add(\"\
  Alex\");\nstudentNames.add(101); // 没有编译错误\nString name = (String) studentNames.get(1);\
  \ // 运行时出现 ClassCastException\n```\n\n现在，使用检查集合，它将如下：\n\n```java\nList<String> names\
  \ = new ArrayList<>();\nList<String> checkedNames = Collections.checkedList(names,\
  \ String.class);\ncheckedNames.add(\"Alex\");\n//checkedNames.add(101); // 编译失败\n\
  ```\n\n\n\n\n上述示例解释了：\n\n*   包装器 `Collections.checkedList()` 会监控列表的每次添加操作。\n*  \
  \ 当添加类型错误的值时，错误会在插入点抛出，这使得错误更容易被检测和调试。\n\n其他类型也存在类似的包装器，如下：\n\n```\nSet<Integer>\
  \ checkedSet = Collections.checkedSet(new HashSet<>(), Integer.class);\nMap<String,\
  \ Double> checkedMap = Collections.checkedMap(new HashMap<>(), String.class, Double.class);\n\
  ```\n\n在以下场景中使用检查集合（checked collections）：\n\n*   处理未使用泛型的遗留代码时。\n*   在测试或调试期间尽早捕获错误用法。\n\
  *   在共享库或 API 中为消费者强制执行类型安全。\n\n检查集合充了运行时安全网的角色，并不是泛型的替代品，当由于原始类型（raw type）的使用导致泛型无法保证安全性时，它们是非常有助手。\n\
  \n## 结论\n\n`Collections`、`Arrays` 以及包装类是每个 Java 开发者工具箱中必不可少的工具。它们简化了常见任务，如排序、搜索、将数组转换为集合、同步集合，以及在运行时强制不可变性或类型安全。\n\
  \n我们看到了 `Collections` 和 `Arrays` 工具方法如何减少样板代码和潜在的 Bug，以及包装类如何让原始类型与集合无缝协作。这些工具不仅提高了生产力，还鼓励了编写更安全、更可读的代码。\n\
  \n然而，使用集合编写高效、高性能且无 Bug 代码不仅关乎使用正确的数据结构，还关乎遵循其用法中的最佳实践。\n\n在下一章中，我们将重点转向泛型和集合的最佳实践，在那章你将学习到在设计和处理密集使用集合型代码库时应避免的指南、模式和常见陷阱。\n\
  \n## 练习题\n\n1.  你会使用哪种方法让列表变得不可修改？\n    1.  `Collections.immutableList()`\n    2.\
  \  `Collections.readOnlyList()`\n    3.  `Collections.unmodifiableList()`\n    4.\
  \  `List.makeReadOnly()`\n\n2.  你会使用哪种工具方法在排序列表中查找元素？\n    1.  `Collections.find()`\n\
  \    2.  `Collections.binarySearch()`\n    3.  `Arrays.lookup()`\n    4.  `List.search()`\n\
  \n3.  使用 `Arrays.asList()` 转换原始数组的结果是什么？\n    1.  一个包含原始值的列表\n    2.  编译错误\n   \
  \ 3.  一个包含整个数组的单元素列表\n    4.  一个包含装箱值的列表\n\n4.  你会使用 `Arrays` 类中的哪种方法用特定值填充数组？\n\
  \    1.  `Arrays.assign()`\n    2.  `Arrays.fill()`\n    3.  `Arrays.copy()`\n \
  \   4.  `Arrays.setAll()`\n\n5.  `Collections.checkedList(list, String.class)` 提供了什么？\n\
  \    1.  只读列表\n    2.  同步列表\n    3.  类型安全列表\n    4.  排序列表\n\n6.  哪种方法将列表转换为对象数组？\n\
  \    1.  `list.convertToArray()`\n    2.  `Collections.toArray()`\n    3.  `list.toArray()`\n\
  \    4.  `Arrays.fromList()`\n\n7.  这些包装器中哪一个确保了 map 的线程安全访问？\n    1.  `Collections.lockedMap()`\n\
  \    2.  `Collections.synchronizedMap()`\n    3.  `Collections.concurrentMap()`\n\
  \    4.  `Map.makeThreadSafe()`\n\n8.  `Collections.reverse(list)` 做了什么？\n    1.\
  \  从列表中删除元素\n    2.  创建一个新的反转列表\n    3.  按降序对列表进行排序\n    4.  原地反转列表中元素的顺序\n\n9.\
  \  哪种类允许对数组的子范围进行排序？\n    1.  `Collections`\n    2.  `SubArray`\n    3.  `Arrays`\n\
  \    4.  `PartialSorter`\n\n10. 当你频繁需要按排序顺序访问元素时，哪一个 `Set` 实现最合适？\n    1.  `HashSet`\n\
  \    2.  `LinkedHashSet`\n    3.  `TreeSet`\n    4.  无无\n\n### 答案\n\n1.  **c**\n\
  \    解释：`Collections.unmodifiableList()` 返回指定列表的视图，不允许进行修改操作，如果尝试任何修改，将抛出 `UnsupportedOperationException`。\n\
  \n2.  **b**\n    解释：`Collections.binarySearch()` 用于在排序列表上使用二分查找法高效定位元素。\n\n3.  **c**\n\
  \    解释：`Arrays.asList()` 将原始数组视为单个对象。因此，传递原始数组会导致产生一个只有一个元素的列表：整个数组本身。\n\n4.  **b**\n\
  \    解释：`Arrays.fill()` 将给定值分配给指定数组的每个元素。\n\n5.  **c**\n    解释：检查集合提供了集合的动态类型安全视图，以便在运行时捕获类型错误。\n\
  \n6.  **c**\n    解释：`list.toArray()` 将列表转换为 `Object` 数组。可以使用 `list.toArray(new Type[0])`\
  \ 获取类型数组。\n\n7.  **b**\n    解释：`Collections.synchronizedMap()` 包装了 map，通过内部同步使其所有基本操作都是线程安全的。\n\
  \n8.  **d**\n    解释：`Collections.reverse()` 原地反转给定列表中元素的顺序。\n\n9.  **c**\n    解释：`Arrays.sort(array,\
  \ fromIndex, toIndex)` 对数组的子范围进行排序。\n\n10. **c**\n    解释：`TreeSet` 根据自然排序或提供的 `comparator`\
  \ 保持元素有序，非常适合排序访问。\n\n# 第 10 章 泛型与集合的最佳实践\n\n## 引言\n\n随着应用程序复杂性的增加，编写整洁、安全且高效的代码至关重要。泛型和集合提供了强大的工具，但必须审慎地使用。从确保类型安全和防止运行时错误，到设计直观健壮的接口（API），本章专注于最佳实践。无论你是在构建库、框架还是业务逻辑，正确使用泛型并利用合适的集合类型都能显著改进代码。\n\
  \n## 结构\n\n本章涵盖以下主题：\n\n*   使用泛型编写类型安全的代码\n*   避免泛型的常见陷阱\n* 集合的高效使用\n* 设计基于集合的 API\n\
  * 性能考量\n*   同步最佳实践\n*   泛型算法\n\n## 目标\n\n在本章结束时，你将能够更安全、更有效地应用泛型，设计可用且简洁的 API，根据性能需求选择合适的数据结构，并使用同步编写线程安全的代码。你还将学习避免可能导致运行时问题或违反类型安全的微妙陷阱，并在实际程序中利用泛型算法。\n\
  \n## 使用泛型编写类型安全的代码\n\n泛型允许开发者执行编译时类型检查，减少运行时 `ClassCastException` 并编写更清洁、更重用的代码。但在实际开发中，正确使用泛型不仅仅是参数化集合。它关乎知道何时使用它们、如何使用边界限制，以及如何设计在不同类型间行为一致的泛型类或方法。\n\
  \n本节将探索帮助使用泛型编写健壮类型安全代码的最佳实践。\n\n以下是最佳实践：\n\n*   始终显式声明类型参数：避免使用原始类型 `List` 或 `Map`。相反，指定类型以利用编译检查。例如，避免如下声明列表：\n\
  \    ```\n    List list = new ArrayList();\n    ```\n    这创建了一个可以包含任何对象的列表，向字符串列表添加整数等错误将不会被捕获。相反，按所示声明：\n\
  \    ```\n    List<String> names = new ArrayList<>();\n    ```\n    现在列表只能存储 `String`\
  \ 值，如果你尝试添加其他内容，将得到错误。\n\n\n\n\n```java\npublic <T> void printElements(List<T> elements)\
  \ {\n    for (T element : elements) {\n        System.out.println(element);\n  \
  \  }\n}\n```\n此方法可以打印字符串、整数或任何其他类型的列表。`T` 代表 `Type`（类型）。\n\n- **利用有界类型参数**：你可以使用边界来限制泛型代码所接受的类型：\n\
  \    - **上界 (extends)**：当你想要接受任何子类时，如下所示：\n      ```java\n      public double sum(List<?\
  \ extends Number> numbers) {\n          double total = 0;\n          for (Number\
  \ num : numbers) {\n              total += num.doubleValue();\n          }\n   \
  \       return total;\n      }\n      ```\n      该方法接受整数、双浮点数等类型的列表，即任何继承 `Number`\
  \ 的类型。\n    - **下界 (super)**：当你想要安全地向列表添加元素时，如下所示：\n      ```java\n      public\
  \ void addIntegers(List<? super Integer> list) {\n          list.add(1);\n     \
  \     list.add(2);\n      }\n      ```\n      该方法可以向持有 `integer` 或 `number` 类型的列表添加整数。\n\
  \n- **在自己的方法中，优先使用类型参数而非通配符**：如果你正在编写一个既读又写的方法，请定义一个类型参数。\n  以下示例并不是理想的：\n  ```java\n\
  \  public void process(List<?> items) {\n      // 无法安全地添加元素\n  }\n  ```\n  相反，优于使用如下所示的类型参数：\n\
  \  ```java\n  public <T> void process(List<T> items) {\n      // 可以读取并添加类型 T 的元素\n\
  \  }\n  ```\n  通配符 (`?`) 是具有限制性的，这意味着你不能向其添加元素。如果你需要更大的灵活性，请使用 `<T>`。\n\n- **避免混合原始类型和泛型**：不要将旧的非泛型代码与泛型集合混合：\n\
  \  ```java\n  List rawList = new ArrayList<String>();\n  rawList.add(10); // 没有错误，但用法错误\n\
  \  ```\n  上面的示例违背了泛型的初衷。请使用 `List<String>`。\n\n- **谨慎使用 @SuppressWarnings(\"unchecked\"\
  )**：仅在你确定它是安全的时（例如在遗留代码中）使用它：\n  ```java\n  @SuppressWarnings(\"unchecked\")\n \
  \ List<String> names = (List<String>) getLegacyData();\n  ```\n  添加注释解释为什么它是安全的，并仅在隔离的地方使用。\n\
  \n- **避免创建泛型数组**：由于类型擦除，Java 不允许 `new T[]`。请使用 `List<T>` 代替。\n  这是无效的，会抛出编译错误：\n\
  \  ```java\n  T[] array = new T[10]; // 编译错误\n  ```\n  相反，在处理泛型时，请使用 `List<T>` 等集合而非数组，如下所示：\n\
  \  ```java\n  List<T> list = new ArrayList<>();\n  ```\n\n## 避免泛型的常见陷阱\n\n虽然泛型提供了类型安全和更整的代码，但开发者仍然可能陷入微妙的陷阱，从而降低其有效性或导致令人困惑的行为。在本节中，我们将探索在使用泛型时出现的一些实际问题以及如何避免它们。这些示例建立在之前讨论的概念之上，并突出了开发者在实际代码库中可能面临的较不明显的误用和局限性：\n\
  \n- **避免重载泛型方法**：用具有相似签名的方法重载泛型方法会导致歧义或无意的方法选择。当类型擦除导致多个重载具有不可区分的字节码签名时，这种情况特别危险。\n\
  \  让我们通过以下代码来理解这一点：\n  ```java\n  public class Printer {\n      public void print(String\
  \ data) {\n          System.out.println(\"String: \" + data);\n      }\n      public\
  \ <T> void print(T data) {\n          System.out.println(\"Generic: \" + data);\n\
  \      }\n      public static void main(String[] args) {\n          Printer printer\
  \ = new Printer();\n          printer.print(\"Hello\");\n      }\n  }\n  ```\n \
  \ **解释**：在上面的示例中，虽然看起来泛型方法 `print(T data)` 可能被选中，但非泛型的 `print(String data)` 是更好的匹配且会被调用。这可能导致行为不一致，特别是如果以后以后为其他类型重载了该方法。开发者应避免创建可能与特定方法冲突的泛型方法重载，除非绝对必要。\n\
  \n- **避免在静态上下文中使用泛型**：泛型类型参数与类的静态上下文没有绑定。这意味着你不能在静态方法或静态字段中使用类的类型参数。\n  考虑以下示例：\n\
  \  ```java\n  public class Box<T> {\n      private T value;\n      // 这会导致编译错误\n\
  \      // private static T staticValue;\n      public static void show(T data) {\n\
  \          // 编译错误\n      }\n  }\n  ```\n  **解释**：在上面的示例中，由于类型参数绑定到实例级别，静态字段和方法无法访问它们。解决方案是让静态方法本身变为泛型，如下所示：\n\
  \  ```java\n  public static <T> void show(T data) {\n      System.out.println(data);\n\
  \  }\n  ```\n\n- **避免不当使用有界类型参数**：有界类型参数放置不当或不必要的复杂性会让泛型代码更难以理解和维护。考虑以下示例：\n  ```java\n\
  \  public <T extends Number & Comparable<T>> void process(T value) {}\n  ```\n \
  \ **解释**：虽然这种写法是有效的，但如果不需要，过度使用边界会增加代码认知负担。\n\n- **避免在方法参数中冗余使用通配符**：在不需要的情况下使用通配符\
  \ `? extends T` 或 `? super T` 会增加代码理解难度。考虑以下示例：\n  ```java\n  public <T> void process(List<?\
  \ extends T> list) {\n      // 只读\n  }\n  ```\n  解释**：如果不需要对 `list` 进行完全访问，简单的签名如\
  \ `process(List<?> list)` 可能更好。通配符 (`?`) 只有在需要遵循 PECS 规则时才使用。\n\n- **未检查的强制转换和编译器警告**：未检查的警告表示类型安全可能受到破坏。如果不加小心地忽略这些警告会导致运行时出现\
  \ `ClassCastException`。\n  例如：\n  ```java\n  List<String> list = (List<String>)\
  \ getObject();\n  ```\n  **解释**：在上面的代码中，如果 `getObject()` 返回的是原始类型或其他泛型类型，编译器会发出警告。使用\
  \ `@SuppressWarnings(\"unchecked\")` 抑制警告应在确认类型安全后进行。\n\n- **泛型与可变参数**：在可变参数中使用泛型会导致堆污染并产生警告。\n\
  \  堆污染发生在参数化类型的变量（如 `List<String>`）指向实际上并非该类型的对象时。\n  这通常发生在：\n    - 将原始类型与泛型混合\n\
  \    - 使用未检查的强制转换\n    - 误用可变参数\n  考虑以下示例：\n  ```java\n  List<String> strings =\
  \ new ArrayList<>();\n  List rawList = strings; // 原始类型\n  rawList.add(42); // 向\
  \ List<String> 添加整数\n  String s = strings.get(0); // 此处发生 ClassCastException\n \
  \ ```\n  在这里，编译器认为 strings 只持有 String 对象，但由于堆污染，一个 `Integer` 溜了进来，导致运行时错误。\n  泛型和可变参数更容易发生堆污染，因为数组是在运行时创建的，而泛型使用类型擦除；数组可能会存储错误类型的元素而缺乏编译时安全性。\n\
  \  为了避免这种情况，可以如下所示使用 `@SafeVarargs` 注解：\n  ```java\n  @SafeVarargs\n  public static\
  \ <T> void addAll(List<T> list, T... elements) {\n      for (T element : elements)\
  \ {\n          list.add(element);\n      }\n  }\n  ```\n  `@SafeVarargs` 注解会抑制警告，只有当方法不会修改或暴露可能破坏类型安全的可变参数数组时才使用。此外，`@SafeVarargs`\
  \ 只能应用于 `final` 或 `static` 方法和构造函数，以确保该方法不会被重写并引入不安全行为。\n\n\n\n\n\n```java\n// catch\
  \ (CustomException<String> e) { }\n```\n\nJava 不支持泛型异常捕获，因为运行时不会保留泛型类型信息。自定义异常在设计上仍然可以是泛型的，但其类型信息在\
  \ `catch` 块中无法使用。\n\n## 高效使用集合\n\nJava 集合框架（Collection Framework）为管理对象组提供了强大且灵活的工具，但要高效使用它们需要理解它们的性能特性，并针对当前问题选择合适的数据结构。本节提供了可操作的指南和示例，帮助在处理集合时做出更好的选择。\n\
  \n不同类型的集合针对不同的操作进行了优化。使用错误的类型会导致性能下降，或者让你的代码更难于阅读和维护。\n\n让我们考虑一个实际的示例：\n\n```java\n\
  List<String> cities = new ArrayList<>();\ncities.add(\"Mumbai\");\ncities.add(\"\
  Delhi\");\ncities.add(\"Bengaluru\");\nSystem.out.println(cities.get(1)); // 快速访问索引\
  \ 1\n```\n\n就像上面的示例一样，如果你的用例需要频繁通过索引访问，并且在中间的插入或删除较少，`ArrayList` 是最佳选择。\n\n考虑以下示例：\n\
  \n- **避免不必要的调整大小**：在使用 `ArrayList` 或 `HashMap` 等可调整大小的集合时，频繁的调整大小是非常昂贵的。如果你知道预期的尺寸，请使用合适的容量初始化\
  \ `Collection`。\n\n在下面的示例中，`ArrayList` 和 `HashMap` 初始化时指定尺寸：\n\n```java\nList<String>\
  \ names = new ArrayList<>(100); // 避免内部调整大小\nMap<String, Integer> marks = new HashMap<>(50);\n\
  ```\n\n指定初始容量可以减少内部数组调整大小的次数，这可以显著提高大型循环或数据密集型操作的性能。\n\n- **使用 Stream 和增强 for 循环提高可读性**：当不需要索引时，避免使用传统的\
  \ `for` 循环。这会让代码更简洁、更安全。像下面所示使用增强 for 循环或 `Streams`：\n\n```java\nList<String> fruits\
  \ = Arrays.asList(\"Mango\", \"Apple\", \"Banana\");\n\n// 传统的 for 循环\nfor (int\
  \ i=0; i<fruits.size(); i++) {\n    System.out.println(fruits.get(i));\n}\n\n//\
  \ 增强 for 循环\nfor (String fruit : fruits) {\n    System.out.println(fruit);\n}\n\n\
  // 使用 Stream API\nfruits.forEach(System.out::println);\n```\n\n在上面的示例中，增强 for 循环和流\
  \ `API` 方法减少了样板代码，并降低了发生 `IndexOutOfBoundsException` 等错误的概率。\n\n## 设计基于集合的 API\n\
  \n在设计暴露或消费集合的应用时，开发者必须考虑灵活性、易用性、可维护性和安全性。设计良好的集合 API 可以让代码更直观并减少错误：\n\n- **在方法签名中始终使用集合接口**（`List`、`Set`、`Map`）而不是实现类（`ArrayList`、`HashSet`\
  \ 等）。这使得方法具有灵活，允许调用者传递任何列表实现（例如 `ArrayList` 或 `LinkedList`），而不会破坏兼容性。\n\n- **不要从返回集合的方法中返回\
  \ `null`**。相反，像下面所示使用工具方法返回一个空集合：\n\n```java\npublic List<String> getStudents()\
  \ {\n    return Collections.emptyList(); // 安全\n}\n```\n\n这防止了调用代码必须进行空检查，并降低了 `NullPointerException`\
  \ 的概率。\n\n- **为了避免对内部数据的意外或未经授权修改**，返回不可修改的视图或不可变集合。可以像下面所示：\n\n```java\nprivate\
  \ List<String> courses = new ArrayList<>();\npublic List<String> getCourses() {\n\
  \    return Collections.unmodifiableList(courses);\n}\n```\n\n这封装了你的数据，并确保外部代码不会意外更改内部状态。\n\
  \n- **如果你的方法期望少数量的固定元素**，使用 `varargs`（可变参数）以获得更好的可读性和便利性，像面所示：\n\n```java\npublic\
  \ void addSubjects(String... subjects) {\n    for (String s : subjects) {\n    \
  \    System.out.println(\"Subject: \" + s);\n    }\n}\n```\n\n这允许调用者以简洁简单的方式传递多个值，而无需显式创建列表。\n\
  \n- **在返回集合时**，如果顺序或唯一性很重要，请使用更具体的接口，如 `Set` 或 `Queue`。可以像下面所示：\n\n```java\npublic\
  \ Set<String> getUniqueCities() {\n    return new HashSet<>(Arrays.asList(\"Delhi\"\
  , \"Mumbai\", \"Pune\"));\n}\n```\n\n这有助于向调用者清晰地传达行为和预期，并提高 API 的清晰度。\n\n- **当你不需要特定操作时，使用更宽的类型**如\
  \ `collection`、`iterable` 甚至 `stream`。像下面所示使用更宽的类型：\n\n```java\npublic void printAll(Collection<String>\
  \ items) {\n    items.forEach(System.out::println);\n}\n```\n\n这使得调用方法可以使用任何集合而不必强制进行转换。\n\
  \n- **如果你需要增强或自定义集合**，请使用组合来包装它，而不是继承集合类，像下面所示：\n\n```java\npublic class LoggedList<E>\
  \ {\n    private final List<E> list;\n    public LoggedList(List<E> list) {\n  \
  \      this.list = list;\n    }\n    public void add(E element) {\n        System.out.println(\"\
  Adding: \" + element);\n        list.add(element);\n    }\n}\n```\n\n这避免了继承的脆弱性，并对行为提供了更多控制。\n\
  \n## 性能考量\n\n选择正确的集合实现对于编写高效代码至关重要。每个集合在插入、删除和访问等基本操作上具有不同的时间和空间复杂度。糟糕的选择会导致性能瓶颈，特别是在大型应用程序中。\n\
  \n根据任务选择正确的集合，如下表所示的列表：\n\n| 用例 | 推荐集合 | 原因 |\n| :--- | :--- | :--- |\n| 通过索引快速访问\
  \ | `ArrayList` | 由数组支持，O(1) 访问 |\n| 频繁插入或删除 | `LinkedList` | 端部操作高效 |\n| 无顺序的唯一元素\
  \ | `HashSet` | 内部使用 `HashMap` |\n| 有插入顺序的唯一元素 | `LinkedHashSet` | 保持插入顺序 |\n| 排序元素\
  \ | `TreeSet` | 按自然顺序存储 |\n| 快速键查找 | `HashMap` | `get()` 和 `put()` 平均时间为 O(1) |\n\
  | 有顺序的键值对 | `LinkedHashMap` | 保持插入顺序 |\n| 排序的键值对 | `TreeMap` | 按自然排序或自定义比较器 |\n\n\
  表 10.1：基于用例的集合推荐\n\n以下是一些实用的提示：\n\n- **如果需要频繁访问，避免使用 `LinkedList`**。它的 `get(index)`\
  \ 操作是 O(n)，而 `ArrayList` 是 O(1)。\n\n- **如果知道预期元素数量，预先调整 `ArrayList` 或 `HashMap`**。这可以减少昂贵的调整大小或重哈操作。\n\
  \n- **最小化原始值的装箱和拆箱**。`List<Integer>` 等集合存储包装对象，会使用更多内存并影响性能。对于大数据集，考虑针对原始类型的库（如\
  \ Trove 或 fastutil）。\n\n- **对于只读遍历使用增强 for 循环**。它更简洁且易于阅读。\n\n- **在性能敏感的代码中谨慎使用\
  \ Stream**。虽然它们提高了可读性，但与循环相比可能会引入额外的开销：\n\n```java\n// 在密集循环中谨慎使用\nstudents.stream().filter(name\
  \ -> name.startsWith(\"A\")).toList();\n```\n\n- **使用 map 缓存昂贵或重复的计算**，如下所示：\n\n\
  ```java\nMap<String, Integer> factorialCache = new HashMap<>();\nint getFactorial(int\
  \ n) {\n    return factorialCache.computeIfAbsent(String.valueOf(n), k -> computeFactorial(n));\n\
  }\n```\n\n- **对于栈或队列操作，优先使用 `ArrayDeque`** 而不是 `Stack` 和 `LinkedList`。它在这些用例下更高效、更快。\n\
  \n- **在使用后移除未使用的大型临时集合**，通过调用 `.clear()` 或允许其超出作用范围进行垃圾回收。\n\n\n\n\n\n*   除非必要，否则避免使用同步集合包装器（`Collections.synchronizedList`）。它们会增加开销；在处理多线程时，请考虑\
  \ `ConcurrentHashMap` 或 `CopyOnWriteArrayList`。\n\n## 同步最佳实践\n\n在多线程应用中，如果不加同步地使用\
  \ `Collections`，可能会导致数据损坏或不可预测的行为。Java 框架（JCF）提供了多种安全处理并发的方法。然而，如果处理不当，盲目同步 `Collections`\
  \ 可能会降低性能或导致死锁。以下是处理同步或并发集合时应遵循的关键最佳实践：\n\n*   优先使用并发集合而非同步包装器。使用 `ConcurrentHashMap`、`CopyOnWriteArrayList`\
  \ 和 `ConcurrentLinkedQueue` 等类，而不是使用 `Collections.synchronizedXXX()` 对标准集合进行同步。\n\
  \n*   避免对并发集合进行外部同步。不要在对 `ConcurrentHashMap` 等并发集合的操作周围使用 `synchronized` 块。这些类已经设计为线程安全的访问，添加额外的同步会降低性能。\n\
  \n*   仅在旧代码或需要极少并发的单线程场景中使用同步包装器。例如，`Collections.synchronizedList()` 使用线程安全的代理来封装列表。但是，你仍然必须在迭代期间进行同步，如下所示：\n\
  \n```\nList<String> syncList = Collections.synchronizedList(new ArrayList<>());\n\
  \nsynchronized (syncList) {\n    for (String name : syncList) {\n        System.out.println(name);\n\
  \    }\n}\n```\n\n*   谨慎使用原子复合操作。即使使用同步或并发集合，诸如“检查并执行”（check-then-act）之类的复合操作也需要额外的同步。例如，以下代码可能会导致竞态条件：\n\
  \n```java\n// 即使使用 ConcurrentHashMap 也是安全的\nif (!map.containsKey(key)) {\n    map.put(key,\
  \ value); // 可能发生竞态条件\n}\n```\n\n相反，请使用所示的原子方法：\n\n```java\nmap.putIfAbsent(key,\
  \ value);\n```\n\n*   理解 CopyOnWrite 集合的权衡。`CopyOnWriteArrayList` 和 `CopyOnWriteArraySet`\
  \ 在迭代时不需要锁就是安全的，但它们在每次修改时都会复制整个数组，这可能是昂贵的。仅当读操作远多于写操作时才使用它们。\n\n*   避免对未共享数据进行不必要的同步。如果\
  \ `Collection` 被单个线程使用（或每个线程都有自己的副本），则不需要进行同步。\n\n*   利用 `ConcurrentSkipListMap`\
  \ 和 `ConcurrentSkipListSet` 进行排序并发访问。这些类提供了线程安全的、排序的 map 和 set，且没有同步块的开销。\n\n* \
  \  不要直接暴露内部 `Collections`。始终返回一个不可修改的或防御性拷贝，以防止外部线程修改内部结构。\n\n*   在生产者-消费者场景中使用线程安全的阻塞集合。当线程需要等待数据时，`LinkedBlockingQueue`、`ArrayBlockingQueue`\
  \ 和 `PriorityBlockingQueue` 等类是理想的。\n\n*   避免长时间持有锁。如果在块上进行同步，请保持临界区域尽可能小，以减少竞争和死锁风险。\n\
  \n## 使用泛型算法\n\nJava 通过泛型算法鼓励代码的可重用性和类型安全，泛型算法是使用泛型编写的方法，它们可以处理各种数据类型。\n\n在第 9 章\
  \ 实用类中，我们已经探索了 `Collections` 类提供的内置泛型算法，例如 `sort()`、`binarySearch()` 和 `shuffle()`。这些方法演示了泛型如何允许我们在不妥协类型安全的情况下编写灵活、可重用的代码。\n\
  \n自定义泛型算法允许你创建适用于不同类型的可重用逻辑。\n\n让我们来看一个既实用又具泛型意义的示例。假设你想统计某个特定元素在集合中出现的次数，无论它是名称列表、数字列表还是自定义对象列表。\n\
  \n我们将定义一个名为 `countOccurrences` 的方法，它可以适用于任何类型的数据，如下所示：\n\n```java\npublic class\
  \ GenericAlgorithms {\n    public static <T> int countOccurrences(Collection<T>\
  \ collection, T target) {\n        int count = 0;\n        for (T item : collection)\
  \ {\n            if (item.equals(target)) {\n                count++;\n        \
  \    }\n        }\n        return count;\n    }\n}\n```\n\n在上面的示例中，`countOccurrences()`\
  \ 方法接收任何类型 `T` 的 `Collection`（例如 `String`、`Integer`、`Employee` 等）。它将每个元素与 `target`\
  \ 进行比较，并返回 `target` 出现的次数。\n\n该方法可以使用如下所示：\n\n```java\nList<String> names = Arrays.asList(\"\
  Liam\", \"Olivia\", \"Liam\", \"Ethan\");\nint result = GenericAlgorithms.countOccurrences(names,\
  \ \"Liam\"); // 返回 2\n```\n\n这个单一方法适用于：\n\n*   统计分数，`countOccurrences(Arrays.asList(85,\
  \ 90, 85), 85)`\n*   统计自定义对象（如果正确重写了 `equals()`）\n*   任何其他集合类型，如 `Set`、`Queue` 等。\n\
  \n这说明了：\n\n*   你可以编写一次逻辑并在不同类型之间复用。\n*   我们不需要为每种类型进行类型转换或重载。\n*   清晰的 API 有助于为团队和项目构建泛型工具库。\n\
  \n## 结论\n\n编写清洁、可重用且高效的代码是 Java 泛型和集合框架的核心目标之一。在本章中，我们探索了如何使用泛型编写类型安全的代码，避免常见的陷阱，并通过理解集合类的行为、性能特性和同步问题来最优化地利用集合类。\n\
  \n我们还讨论了如何使用泛型设计 API 方法以提高可重用性和可读性，以及如何使用包装器和并发集合处理线程安全。此外，我们看到了实用方法如何让我们编写更简洁、具适应性的代码。\n\
  \n通过明智地结合泛型与集合，你可以构建健壮且易于维护的 Java 应用。随着你的继续前进，请尝试。\n\n## 练习\n\n1. 哪些声明是类型安全且有效的？\n\
  1. `List<Object> list = new ArrayList<>();`\n2. `List<String> list = new ArrayList<>();`\n\
  3. `List list = new ArrayList();`\n4. `List<int> list = new ArrayList<>();`\n\n\
  2. 如果向 `List<String>` 添加 `Integer`，会发生什么？\n1. 编译时错误\n2. 运行时错误\n3. 自动转换\n4. 无\n\n\
  3. 哪种泛型通配符允许只读访问？\n1. `<? super T>`\n2. `<?>`\n3. `<? extends T>`\n4. `<T>`\n\n\
  4. 为什么要在泛型代码中避免原始类型？\n1. 它们更快\n2. 它们提高了性能\n3. 它们绕过了编译检查\n4. 它们支持更多类型\n\n5. 使用 `Collections.unmodifiableList()`\
  \ 的优势是？\n1. 提高性能\n2. 防止修改\n3. 增加容量\n4. 支持并行\n\n6. 哪个方法返回给定 `Set` 的同步版本？\n1. `Collections.unmodifiableSet()`\n\
  2. `Collections.checkedSet()`\n3. `Collections.synchronizedSet()`\n4. 以上都不是\n\n\
  7. 如何在运行时强制执行 `Collection` 的类型安全？\n1. 使用原始类型\n2. 使用检查的集合\n3. 运行时类型转换\n4. 使用反射\n\n\
  8. 在 `ArrayList` 中访问元素的时间复杂度是多少？\n1. `O(log n)`\n2. `O(1)`\n3. `O(n)`\n4. `O(n log\
  \ n)`\n\n9. 哪些集合允许重复元素？\n1. `HashSet`\n2. `LinkedHashSet`\n3. `TreeSet`\n4. `ArrayList`\n\
  \n10. `<? super T>` 在泛型方法中允许什么？\n    1. 仅接受 `T`\n    2. 接受任何类型\n    3. 接受 `T` 及其父类\n\
  \    4. 限制为子类仅\n\n\n\n\n\n### 答案\n\n1. `b`\n解释：Java 泛型要求类型参数为对象类型，而 `b` 是类型安全的。\n\
  \n2. `a`\n解释：你不能向 `List<String>` 中添加 `Integer`；这会导致编译时错误。\n\n3. `c`\n解释：`<? extends\
  \ T>` 允许只读访问，并用于协变性。\n\n4. `c`\n解释：原始类型（Raw types）会跳过编译检查，导致代码不安全且容易出错。\n\n5. `b`\n\
  解释：不可修改列表（Unmodifiable lists）防止在创建后对 `Collection` 进行更改。\n\n6. `c`\n解释：`Collections.synchronizedSet()`\
  \ 提供了 `Set` 的线程安全版本。\n\n7. `b`\n解释：如果使用了错误的类型，受检查的集合（Checked collections）会在运行时抛出\
  \ `ClassCastException`。\n\n8. `b`\n解释：`ArrayList` 通过索引对元素提供常数时间的访问。\n\n9. `d`\n\
  解释：`ArrayList` 允许重复元素，与 `Set` 的实现不同。\n\n10. `c`\n解释：`<? super T>` 接受 `T` 及其超类，用于逆变参数。\n\
