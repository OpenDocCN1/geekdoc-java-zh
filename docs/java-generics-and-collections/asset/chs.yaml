  \n![QR-Logo](img/fm1.png)\n\n# 第 6 章 Map 接口及其实现\n\n## 引言\n\n在 Java 中，`Map` 是一种存储键值对的数据结构，其中每个键都是唯一的，并映射到一个特定的值。与关注单个元素的集合（如\
  \ `List` 或 `Set`）不同，`Map` 强调基于键的高效关联和检索。它被广泛用于缓存、配置管理、频率计数和类数据库的查找等应用。\n\nJava 提供了\
  \ `Map` 接口的若干种实现，每种实现都有不同的内部结构和性能特性。这些包括 `HashMap`、`LinkedHashMap`、`TreeMap` 和 `Hashtable`，根据排序、同步和排序的需求，它们适用于不同的用例。\n\
  \n在本章中，我们将探索 `Map` 接口的基础概念、其主要实现及其内部机制。我们还将考虑性能考量、常见用例、同步策略以及 Map 中泛型算法的使用。\n\n\
  ## 结构\n\n本章涵盖了以下主题：\n\n* `Map` 接口\n* `HashMap` 实现\n* `LinkedHashMap` 实现\n* `TreeMap`\
  \ 实现\n* `Hashtable` 实现\n* 性能考量\n* Map 的常见用例\n* Map 中的同步\n* Map 的泛型算法\n\n## 目标\n\n\
  在本章结束时，你将理解 Java 中 `Map` 接口及其工作原理，包括其存储具有唯一键的键值对的核心目的。你将探索 `HashMap`、`LinkedHashMap`、`TreeMap`\
  \ 和 `Hashtable` 等主要的 `Map` 实现，并理解它们在排序、同步和性能方面的差异。你还将更深入地理解这些实现的内部数据结构，例如哈希表、链表和红黑树。此外，你将学习如何根据特定的用例选择每种实现、如何处理\
  \ Map 的线程安全，以及如何使用泛型算法有效地处理 Map 数据。这些知识将使你能够编写出更整洁、更高效且易于维护的涉及键值关联的 Java 代码。\n\n\
  ## Map 接口\n\nJava 中的 `Map` 接口定义了键值映射的规范。它是 `java.util` 包的一部分，与 `List` 或 `Set` 等其他集合类型不同，因为它不是\
  \ `Collection` 接口的直接子类型。`Map` 的主要目的是将唯一的键与特定的值关联起来。每个键恰好映射到一个值，但值本身可以是重复的。\n\n以下是\
  \ Map 的关键特性：\n\n* 键的唯一性：`Map` 不允许重复的键，确保每个键只关联一个值。\n* 空键/值处理：某些 `Map` 实现允许 `null`\
  \ 键和值，而另一些则不允许。\n* 基础操作：接口包含了 `put()`、`get()`、`remove()` 和 `containsKey()` 等基本方法，有助于管理存储在\
  \ `Map` 中的数据。\n* 迭代器：Map 为键、值和条目（entries）提供了迭代器，使得遍历数据变得简单。\n\n为了更好地理解 `Map` 接口的功能，这里是常用方法列表及其描述。这些方法为管理\
  \ `Map` 中的键值映射提供了基本操作。请参考下表：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `put(K key, V value)`\
  \ | 将键值对插入到 map 中。如果键已存在，则更新与其关联的值 |\n| `get(Object key)` | 检索与指定键关联的值，如果该键在 map\
  \ 中不存在，则返回 `null` |\n| `remove(Object key)` | 移除与指定键关联的键值对。如果找到则返回该值，如果键不存在则返回 `null`\
  \ |\n| `containsKey(Object key)` | 如果 map 包含指定键的映射，则返回 `true`；否则返回 `false` |\n|\
  \ `containsValue(Object value)` | 如果 map 包含一个或多个映射到指定值的键，则返回 `true`；否则返回 `false`\
  \ |\n| `keySet()` | 返回 map 中包含的键的 `Set` 视图 |\n| `values()` | 返回 map 中包含的值的 `Collection`\
  \ 视图 |\n| `entrySet()` | 返回 map 中包含的键值对（条目）的 `Set` 视图。每个条目都是一个 `Map.Entry` 对象 |\n\
  | `size()` | 返回 map 中键值对的数量 |\n| `isEmpty()` | 如果 map 中不包含任何键值映射，则返回 `true`；否则返回\
  \ `false` |\n| `clear()` | 移除 map 中所有的键值映射 |\n| `putAll(Map<? extends K,? extends\
  \ V> m)` | 将指定 map 中的所有映射拷贝到当前 map |\n| `equals(Object o)` | 根据键值映射将指定对象与 map 进行等等性比较\
  \ |\n| `hashCode()` | 根据其键值对返回 map 的哈希值 |\n| `forEach(BiConsumer<? super K,? super\
  \ V> action)` | 对 map 中的每个键值对执行指定的动作 |\n\n表 6.1：Map 接口中的有用方法\n\nJava 提供了 `Map` 接口的若干种实现，每种实现都针对特定的用例。以下图是实现\
  \ `Map` 接口的主要类的概述：\n\n![一个类图显示 Map 接口被 SortedMap、HashMap 和 Hashtable 实现；SortedMap\
  \ 被 NavigableMap 扩展；TreeMap 扩展 HashMap。接口为黄色，类为灰色。](img/Figure_6.1)\n\n图 6.1：Map\
  \ 接口及其实现\n\n## HashMap 实现\n\n`HashMap` 是 `Map` 接口最常用的实现之一。它存储键值对，并在 `get()` 和 `put()`\
  \ 等基本操作上具有常数时间性能，是某些场景的理想选择。\n\n以下是关键特性：\n\n* 顺序：`HashMap` 不保证元素的特定顺序。随着时间的推移，键顺序可能会改变。\n\
  * 空处理：`HashMap` 允许 `null` 键和多个 `null` 值，这在所有 `Map` 实现中都是允许的。\n* 并发：`HashMap` 不是同步的，意味着它不是线程安全的。如果你在并发环境中使用它，可以使用\
  \ `ConcurrentHashMap` 或通过 `Collections.synchronizedMap()` 对其封装。\n\n### HashMap 的内部结构\n\
  \n`HashMap` 内部使用哈希表，键经过哈希处理，生成的哈希码决定了在表中的位置。如果两个键具有相同的哈希码（冲突），`HashMap` 使用链表（在大量冲突的情况下使用平衡树）来存储与这些键关联的值。\n\
  \n在核心部分，`HashMap` 在桶数组中存储键值对。每个桶本质上是一个存储具有相同哈希码条目的链表（在某些情况下为平衡树）。\n\n让我们了解 `HashMap`\
  \ 的关键特性：\n\n* `Node<K,V>` 类：内部，每个键值对由一个名为 `Node<K,V>` 的静态内部类表示，该类实现了 `Map.Entry<K,V>`\
  \ 接口。这是其结构的简化版本：\n\n```java\nstatic class Node<K,V> implements Map.Entry<K,V> {\n\
  \    final int hash;\n    final K key;\n    V value;\n    Node<K,V> next;\n\n  \
  \  // 构造函数和方法...\n}\n```\n\n在此结构中：\n\n* `hash`：键的哈希码。\n* `key`：条目的键。\n* `value`：与键关联的值。\n\
  \n\n\n\n*   `next`: 指向桶中下一个节点的引用（用于发生冲突的情况）。\n\n*   桶数组（table）：`HashMap` 维护一个名为\
  \ `table` 的数组，其中每个元素都是一个 `Node` 的引用。该数组的默认初始容量为 16，并会随着条目数量的增加而动态调整大小。\n\n这通过以下代码表示：\n\
  \n```\ntransient Node<K,V>[] table;\n```\n\n*   哈希函数：为了确定键值对应该所在的桶索引，`HashMap` 使用哈希函数。它计算键的哈希码（hash\
  \ code），然后应用辅助哈希函数来减少冲突。以下是使用的哈希函数：\n\n```java\nstatic final int hash(Object key)\
  \ {\n    int h;\n    return (key == null) ? 0 : (h = key.hashCode()) ^ (h >>> 16);\n\
  }\n```\n\n该函数获取键的原始哈希码，并使用异或（`^`）操作将其高位与低位位混合。这有助于哈希码在各个桶之间实现更均匀的分布，特别是当哈希码的高位存在模式时。\n\
  \n*   索引计算：一旦计算出哈希码，使用以下公式确定桶数组的索引：\n\n`index = (n - 1) & hash;`\n\n在这里，`n` 是桶数组的长度（即\
  \ `HashMap` 的容量）。与 `n - 1` 进行按位与（`&`）操作可确保索引在数组的范围内。这种方法是高效的，因为它避免了使用取模运算符（modulo\
  \ operator），并且当 `n` 是 2 的幂时非常有效，而 `HashMap` 的容量始终是 2 的幂。\n\n为了更好地理解这一点，让我们通过一个示例来演示\
  \ `HashMap` 中一些关键方法的内部操作。\n\n考虑以下代码：\n\n```java\nMap<String, String> map = new HashMap<>();\n\
  map.put(\"Apple\", \"Fruit\");\n```\n\n对于 `put` 方法，Java 内部调用：\n\n```java\nint h\
  \ = \"Apple\".hashCode();\n```\n\n假设返回值为 `63062875`。\n\n然后应用辅助哈希，`h = h ^ (h >>>\
  \ 16)`：\n\n*   `h`: `63062875 ^ (63062875 >>> 16)`\n*   `h`: `63062875 ^ 961` 得到最终哈希码\
  \ = `63061914`\n\n`HashMap` 的数组长度始终是 2 的幂。初始容量为 16。因此，索引计算如下：\n\n`index: (16 - 1)\
  \ & 63061914 = 15 & 63061914`\n\n我们得到 `index = 2`。因此，该条目应该放在索引为 2 的桶中。\n\n现在，`HashMap`\
  \ 检查索引 2 是否已经存在节点：\n\n*   如果是，它使用 `equals()` 比较键以判断是否是同一个键。如果键相同，则用新值更新旧值。\n*  \
  \ 如果不是，它创建一个新节点并将其插入该位置。\n\n在我们的示例中，它是空的，所以如下所示添加了一个新节点：\n\n```java\nNode<String,\
  \ String> newNode = new Node<>(hash=63061914, key=\"Apple\", value=\"Fruit\", next=null);\n\
  ```\n\n如果我们要从 `HashMap` 中检索一个值，如下所示：\n\n```java\nmap.get(\"Apple\");\n```\n\n以下是从\
  \ `Map` 检索值遵循的序列：\n\n*   计算 `Apple` 的哈希码，得到 `63061914`。\n*   计算索引，得到 2，然后进入第 2 桶查找节点。\n\
  *   使用 `equals()` 方法比较键，一旦找到匹配的键，就会返回该值。在这种情况下，返回的值是 `Fruit`。\n\n在发生冲突的情况下，假设在以下代码中\
  \ `Orange` 也哈希到索引 2（仅为假设）：\n\n```java\nmap.put(\"Orange\", \"NotFruit\");\n```\n\
  \n它发现第 2 桶已经有了 `Apple`，并比较了 `Orange.equals(Apple)`，结果为 `false`。这是一个两个不同的键指向同一个桶的冲突。在这种情况下，会创建一个新节点并添加到桶中。\n\
  \n现在，索引为 2 的桶有两个节点，如下如图所示：\n\n![一个包含 16 个槽位的哈希表图，显示第 2 槽位包含链式条目：一个键为 Apple（值为 Fruit），另一个键为\
  \ Orange（值为 NotFruit）。](img/Figure_6.2.jpg)\n\n图 6.2：`HashMap` 中的哈希冲突\n\n如果一个桶中的条目超过\
  \ 8 个且总容量为 64 或更多，为了性能考虑，列表将转换为红黑树。\n\n当条目数量超过容量与负载因子（默认 0.75）的乘积时，`HashMap` 会调整大小（容量翻倍），并重新哈希所有现有条目。\n\
  \n考虑以下示例：\n\n```java\nimport java.util.HashMap;\n\npublic class HashMapResizeDemo\
  \ {\n    public static void main(String[] args) {\n        HashMap<Integer, String>\
  \ map = new HashMap<>(4, 0.75f); \n        // 较初始容量触发扩容\n        for (int i = 0;\
  \ i < 10; i++) {\n            map.put(i, \"Value\" + i);\n        }\n        System.out.println(\"\
  Map size: \" + map.size());\n    }\n}\n```\n\n\n\n\n\n双向链表按照插入顺序（或访问顺序，取决于配置）连接所有条目。为了理解访问顺序，请考虑以下示例：\n\
  \n```java\nmap.put(\"A\", 1);\nmap.put(\"B\", 2);\nmap.put(\"C\", 3);\n```\n\n`Map`\
  \ 的结构如下：\n\n![包含三个节点的双向链表图：- 节点 1: Key A, Value 1 (HEAD) - 节点 2: Key B, Value 2\
  \ - 节点 3: Key C, Value 3 每个节点指向下一个和上一个节点；末尾指向 null](img/Figure_6.3.jpg)\n\n图 6.3:\
  \ LinkedHashMap 初始结构\n\n如果 `accessOrder` 为 `true` 且我们执行 `map.get(B)`，`B` 将移动到末尾，现在\
  \ `Map` 的结构将如图所示：\n\n![一个键值对的图。](img/Figure_6.4.jpg)\n\n图 6.4: 带有 accessOrder 的\
  \ LinkedHashMap\n\n| Note：双向链表独立于哈希表桶。它仅用于迭代，而不用于搜索或哈希。与 `HashMap` 相比，这增加了微小的开销，但为你提供了顺序保持。\
  \ |\n\n### LinkedHashMap 中的构造函数\n\n`LinkedHashMap` 类提供了几个构造函数来创建不同配置的 map：\n\n*\
  \   `LinkedHashMap()`：创建一个初始容量为 16 负载因子为 0.75 的空 `LinkedHashMap`，保持条目的插入顺序。\n* \
  \  `LinkedHashMap(int initialCapacity)`：创建一个具有指定 `initialCapacity` 且负载因子为 0.75 的空\
  \ `LinkedHashMap`，保留插入顺序。\n*   `LinkedHashMap(int initialCapacity, float loadFactor)`：创建一个具有指定\
  \ `initialCapacity` 和 `loadFactor` 的空 `LinkedHashMap`，保持插入顺序。\n*   `LinkedHashMap(int\
  \ initialCapacity, float loadFactor, boolean accessOrder)`：创建一个具有指定 `initialCapacity`、`loadFactor`\
  \ 和迭代顺序的空 `LinkedHashMap`。\n\n如果 `accessOrder` 为 `true`， map 将按照访问顺序进行迭代（最近访问的条目将移动到末尾），这对于实现最久未使用（LRU）缓存非常有用。\n\
  \n如果 `accessOrder` 为 `false`，map 将保持插入顺序。\n\n## TreeMap 实现\n\n`TreeMap` 是一个 `Map`\
  \ 实现，它以排序顺序存储其条目。它基于红黑树，红黑树是一种自平衡二叉搜索树。它确保键始终根据它们的自然排序或在创建时提供的比较器进行排序。\n\n以下是 `TreeMap`\
  \ 的关键特性：\n\n*   排序顺序：`TreeMap` 按键对条目进行排序。默认情况下，它使用键的自然排序（如果它们实现了 `comparable`），或者你可以指定一个自定义的比较器进行排序。\n\
  *   null 键：`TreeMap` 不允许 `null` 键。然而，它允许 `null` 值。\n*   性能：由于底层的红黑树结构，`get()`、`put()`\
  \ 和 `remove()` 操作的时间复杂度为 `O(log n)`。\n*   线程安全：`TreeMap` 不是同步的。如果需要线程安全，应该使用外部同步，或考虑使用\
  \ `Collections.synchronizedMap()`。\n\n### TreeMap 的内部结构\n\n如之前提到的，`TreeMap` 使用红黑树作为底层数据结构。这确保了\
  \ map 保持平衡，并且 `get()`、`put()` 和 `remove()` 等操作具有 `O(log n)` 的时间复杂度。以下是工作原理的逐步分解：\n\
  \n1.  红黑树属性：\n    1.  它是一种自平衡二叉搜索树。\n    2.  树中的每个节点都有一个颜色（红色或黑色）以维持平衡。\n    3.\
  \  树遵循特定的属性以确保保持平衡，红黑树的关键属性包括：\n        i. 根节点始终是黑色的。\n        ii. 红色节点不能有红色孩子。\n\
  \        iii. 从一个节点到其后代 `null` 节点的每条路径必须具有相同数量的黑色节点。\n2.  插入：\n    1.  当键值对插入到 `TreeMap`\
  \ 时，它根据键的自然顺序（或提供的 `comparator`）放置在树中。\n    2.  插入后，红黑树可能会变得平衡。如果是这样，将执行旋转和颜色翻转以恢复平衡。\n\
  3.  搜索：\n    1.  当你在 `TreeMap` 中搜索键时，从根节点开始遍历树。根据键与当前节点键的比较检查左节点或右子节点。这会递归进行，遵循二叉搜索树的逻辑。\n\
  \    2.  这是因为树是平衡的；搜索的时间复杂度为 `O(log n)`。\n\n这是一个在 Java 中演示 `TreeMap` 基本操作的简单示例，包括插入、检索、更新、删除和迭代：\n\
  \n```java\nimport java.util.TreeMap;\nimport java.util.Map;\n\npublic class TreeMapExample\
  \ {\n    public static void main(String[] args) {\n        // 创建一个 TreeMap\n   \
  \     TreeMap<Integer, String> studentMap = new TreeMap<>();\n        // 向 TreeMap\
  \ 添加条目\n        studentMap.put(102, \"Aaron\");\n        studentMap.put(101, \"\
  Bella\");\n        studentMap.put(103, \"Chris\");\n        // TreeMap 保持键的升序排列\n\
  \        System.out.println(\"Initial TreeMap: \" + studentMap);\n        // 根据键获取值\n\
  \        System.out.println(\"Student with ID 101: \" + studentMap.get(101));\n\
  \        // 更新值\n        studentMap.put(101, \"Updated Bella\");\n        // 删除\n\
  \        studentMap.remove(102);\n        // 迭代\n        for (Map.Entry<Integer,\
  \ String> entry : studentMap.entrySet()) {\n            System.out.println(entry.getKey()\
  \ + \": \" + entry.getValue());\n        }\n    }\n}\n```\n\n\n\n\n\n* `TreeMap(Map<?\
  \ extends K, ? extends V> m)`: 创建一个新的 `TreeMap`，包含与指定的 map `m` 相同的映射。条目根据键的自然排序或指定的比较器进行排序。\n\
  * `TreeMap(Comparator<? super K> comparator)`: 创建一个空的 `TreeMap`，使用指定的 `comparator`\
  \ 对键进行排序。如果 `comparator` 为 `null`，则 map 将使用自然排序。\n* `TreeMap(SortedMap<K, ? extends\
  \ V> m)`: 创建一个新的 `TreeMap`，包含与指定的 `SortedMap` 相同的映射。条目根据 `SortedMap` 的顺序进行排序。\n\n\
  ### TreeMap 中的常用方法\n\n下表显示了 `TreeMap` 中可用的一些常用常用方法：\n\n| 方法 |  |\n| :--- | :---\
  \ |\n| `firstKey()` | 返回 map 中当前的第一个（最低）键 |\n| `lastKey()` | 返回 map 中当前的最后一个（最高）键\
  \ |\n| `firstEntry()` | 返回与最低键关联的键值映射 |\n| `lastEntry()` | 返回与最高键关联的键值映射 |\n| `ceilingKey(K\
  \ key)` | 返回大于或等于给定键的最小键，如果没有则返回 `null` |\n| `ceilingEntry(K key)` | 返回大于或等于给定键的最小条目\
  \ |\n| `floorKey(K key)` | 返回小于或等于给定键的最大键，如果没有则返回 `null` |\n| `floorEntry(K key)`\
  \ | 返回小于或等于给定键的最大条目 |\n| `higherKey(K key)` | 返回严格大于给定键的最小键 |\n| `higherEntry(K\
  \ key)` | 返回严格大于给定键的最小条目 |\n| `lowerKey(K key)` | 返回严格小于给定键的最大键 |\n| `lowerEntry(K\
  \ key)` | 返回严格小于给定键的最大条目 |\n| `pollFirstEntry()` | 从 map 中移除并返回第一个条目（最低键） |\n| `pollLastEntry()`\
  \ | 从 map 中移除并返回最后一个条目（最高键） |\n\n表 6.2: TreeMap TreeMap 中的额外方法\n\n### Hashtable\
  \ 实现\n\n`Hashtable` 是一个实现 `Map` 接口的遗留类，是 Java 原始版本的一部分。它存储键值对并确保键是唯一的。像 `HashMap`\
  \ 一样，它使用哈希来高效地存储和检索元素。\n\n然而，与 `HashMap` 不同，`Hashtable` 是同步的，使其在多线程环境中是安全的，尽管这是以性能为代价。\n\
  \n以下是 `Hashtable` 的主要特征：\n\n* 线程安全：所有方法都是同步的。\n* 无空键值：`Hashtable` 不允许 `null` 作为键或值。\n\
  * 无序：它不维护插入顺序或排序顺序。\n* 遗留类：对于大多数现代应用程序来说被认为是过时的；建议使用 `ConcurrentHashMap` 或 `Collections.synchronizedMap()`。\n\
  \n### Hashtable 的内部工作原理\n\n内部，`Hashtable` 使用一个桶数组，每个桶是一个链表（或 `Entry[]`），用于存储键值对。键的哈希码决定了桶的索引。当发生冲突时（即两个键的哈希值指向同一个索引），它使用链链法来解决。\n\
  \n其表示如下所示：\n\n```java\npublic class Hashtable<K,V> extends Dictionary<K,V> implements\
  \ Map<K,V>, Cloneable, java.io.Serializable {\n    private transient Entry<?,?>[]\
  \ table;\n    private int count;\n    private int threshold;\n    private float\
  \ loadFactor;\n    ...\n}\n```\n\n每个 `Entry` 存储一个键、一个值、一个哈希码以及指向下一个 `Entry` 的指针（用于处理冲突）。\n\
  \n### Hashtable 中的构造函数\n\n`Hashtable` 类提供了几个构造函数来创建具有不同初始设置的 map：\n\n* `Hashtable()`：创建一个空的\
  \ `Hashtable`，默认初始容量为 11，负载因子为 0.75。\n* `Hashtable(int initialCapacity)`：构建一个具有指定初始容量和默认负载因子（0.75）的\
  \ `Hashtable`。\n* `Hashtable(int initialCapacity, float loadFactor)`：创建一个具有给定初始容量和负载因子的\
  \ `Hashtable`。\n* `Hashtable(Map<? extends K, ? extends V> t)`：使用指定 `Map` 中的映射初始化\
  \ `Hashtable`。表的容量将足够容纳这些映射。\n\n考虑一个简单的示例示例，演示如何在 Java 中使用 `Hashtable`：\n\n```java\n\
  import java.util.Hashtable;\n\npublic class HashtableExample {\n    public static\
  \ void main(String[] args) {\n        // 使用默认容量和负载因子创建 Hashtable\n        Hashtable<String,\
  \ Integer> studentMarks = new Hashtable<>();\n        // 添加键值对\n        studentMarks.put(\"\
  Ray\", 85);\n        studentMarks.put(\"Sara\", 92);\n        studentMarks.put(\"\
  Adam\", 76);\n        studentMarks.put(\"Grace\", 88);\n        // 获取一个值\n     \
  \   System.out.println(\"Sara’s marks: \" + studentMarks.get(\"Sara\"));\n     \
  \   // 遍历 Hashtable\n        for (String name : studentMarks.keySet()) {\n     \
  \       System.out.println(name + \" scored \" + studentMarks.get(name));\n    \
  \    }\n        // 移除一个键\n        studentMarks.remove(\"Adam\");\n        System.out.println(\"\
  Updated Hashtable: \" + studentMarks);\n    }\n}\n```\n\n以下是输出：\n\n```text\nSara's\
  \ marks: 92\nGrace scored 88\nAdam scored 76\nRay scored 85\nSara scored 92\nUpdated\
  \ Hashtable: {Grace=88, Ray=85, Sara=92}\n```\n\n#### 比较 Map 实现\n\n在我们探索 `Map` 接口的不同实现方式时，了解它们在排序、性能、线程安全方面的比较是非常重要的。下表总结了\
  \ `HashMap`、`LinkedHashMap`、`TreeMap` 和 `Hashtable` 之间的差异：\n\n| 特性 | HashMap | LinkedHashMap\
  \ | TreeMap | Hashtable |\n| :--- | :--- | :--- | :--- | :--- |\n| 排序 | 不保证顺序 |\
  \ 维护插入顺序 | 根据自然/比较器排序 | 不保证顺序 |\n| 空键或值 | 允许一个空键和多个值 | 允许一个空键和多个值 | 不允许空键 | 不允许空键值\
  \ |\n| 线程安全 | 非线程安全 | 非线程安全 | 非线程安全 | 线程（同步） |\n| 性能 | 最快（非同步） | 由于顺序比 HashMap 慢\
  \ | 由于排序较慢 | 由于同步较慢 |\n| 内部结构 | 桶数组及链表/树 | 同 HashMap 及双向链表 | 红黑树（平衡二叉树） | 桶数组（类似旧\
  \ HashMap） |\n| 使用场景 | 通用，非线程 | 需要插入顺序时 | 需要键排序 | 遗留同步代码 |\n| 引入版本 | Java 1.2 |\
  \ Java 1.4 | Java 1.2 | Java 1.0 |\n| 空安全 | 多线程环境下安全 | 多线程环境下安全 | 多线程环境下安全 | 并发安全\
  \ |\n| 快速失败迭代器 | 是 | 是 | 是 | 否（使用 Enumerator 而非 Iterator） |\n\n表 6.3: `HashMap`,\
  \ `LinkedHashMap`, `TreeMap` 和 `Hashtable`\n\n### 性能考虑\n\nJava 中 `Map` 接口的每种实现根据其底层数据结构提供不同的性能特性：\n\
  \n* `HashMap` 通常为 `get()`、`put()` 和 `remove()` 等基本操作提供常数时间性能，前提是哈希函数能够良好地分散元素。然而在最坏的情况下（例如许多键哈希到同一个桶），这些操作可能会退化为线性时间。\n\
  \n* `LinkedHashMap` 维护一个双向链表以保留插入或访问顺序，这与 `HashMap` 相比会带来额外的开销。然而，在典型情况下，它的查找和插入时间保持为有效常数。\n\
  \n* 另一方面，`TreeMap` 维护一个平衡二叉搜索树（具体来说是红黑树），保证了 `get()`、`put()` 和 `remove()` 操作的时间数复杂度。这使得它在通用用途上比\
  \ `HashMap` 或 `LinkedHashMap` 慢，但在需要键排序时是首选的。\n\n\n\n\n\n- `Hashtable` 是一个遗留类，提供同步访问，这在单线程上下文中会引入性能影响。它的基本操作与\
  \ `HashMap` 类似，但新增的同步开销使其在大多数现代应用程序中效率较低。\n\n下表展示了不同 `Map` 实现核心操作和特性的简洁对比：\n\n|\
  \ 特性 | HashMap | LinkedHashMap | TreeMap | Hashtable |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| `get()`/`put()` 的时间 | O(1) 平均，O(n) 最坏 | O(1) 平均（带有插入顺序开销） | O(log\
  \ n) | O(1) 平均，O(n) 最坏 |\n| `remove()` 的时间 | O(1) 平均 | O(1) 平均 | O(log n) | O(1)\
  \ 平均 |\n| 排序 | 无序 | 维护插入/访问顺序 | 按键排序 | 无序 |\n| 线程安全 | 非线程安全 | 非线程安全 | 非线程安全 | 线程安全（通过同步）\
  \ |\n| 内存占用 | 低 | 较高（由于链表） | 中等（树节点） | 较高（遗留同步） |\n| 理想用例 | 通用 Map | 当条目顺序重要时 |\
  \ 需要排序键时 | 需要线程安全的遗留代码 |\n\n表 6.4：`Map` 接口实现之间的性能对比\n\n通常，对于无序的单线程用例，`HashMap` 通常是最佳选择。当需要可预测的迭代顺序时，`LinkedHashMap`\
  \ 更合适。如果键的排序很重要，`TreeMap` 是正确的工具。对于线程安全的操作，优先选择 `ConcurrentHashMap` 而不是 `Hashtable`。\n\
  \n## Map 的常见用例\n\n`Map` 接口是 Java 中多功能的数据结构之一，广泛应用于实际场景。它提供了一种将键与值关联的高效方式，能够实现快速查找、更新和删除：\n\
  \n- 一个常见的用例是实现缓存，其中键是资源标识符（如用户 ID 或 URL），值是关联的数据。例如，启用了访问顺序的 `LinkedHashMap` 是构建\
  \ LRU 缓存的理想选择。\n- Maps 也经常被用于维护配置和设置，其中每个键是配置名称，值是其设置值。在数据处理或分析任务中，`Map` 可以充当计数器，将项目映射到它们的出现次数。\n\
  - 在涉及路由或查找服务的应用程序中（如字典或地址录），`Map` 能够轻松地根据已知键存储和检索数据。同样，当键需要保持排序顺序时（例如在调度应用程序或排行榜中），`TreeMap`\
  \ 非常有用。\n\nMaps 在框架中也是基础性的，例如存储 HTTP 请求头、会话属性（session attributes），甚至在 Web 应用程序中绑定表单数据。无论是维护对象引用、执行分组操作还是表示关系，`Map`\
  \ 都是 Java 开发者工具箱中必备的工具。\n\n## Map 中的同步\n\n默认情况下，Java 中最常用的 `Map` 实现（如 `HashMap`、`LinkedHashMap`\
  \ 和 `TreeMap`）都不是线程安全的。这意味着如果多个线程并发访问 map 且至少有一个线程对其进行修改，则必须对 map 进行外部同步以防止不可预测的行为。\n\
  \n对于单线程环境或只读访问，不需要同步。但在多线程场景下，Java 提供了几种策略：\n\n- `Collections.synchronizedMap()`：此实用方法将任何\
  \ map 包装为同步访问。然而，它会为每个操作锁定整个 map，这在高并发环境中可能会降低性能。可以如下所示创建它：\n\n```\nMap<String,\
  \ String> syncMap = Collections.synchronizedMap(new HashMap<>());\n```\n\n- `ConcurrentHashMap`：为了获得更好的并发性，`java.util.concurrent`\
  \ 包提供了 `ConcurrentHashMap`，它将 map 分为若干段，允许多个线程进行读写而无需锁定整个 map。可以如下所示创建它：\n\n```\n\
  Map<String, Integer> concurrentMap = new ConcurrentHashMap<>();\n```\n\n- 不变 Map（Immutable\
  \ Maps）：如果 map 在构造后仅进行读取，可以使用不可修改封装器或 `Map.of()` 的工厂方法来防止更改。这在 Java 9 及以上版本可用，并可以如下所示使用：\n\
  \n```\nMap<String, String> readOnlyMap = Map.of(\"key\", \"value\");\n```\n\n- 同步\
  \ Map – `Hashtable`：在历史上，`Hashtable` 提供了内置同步。然而，它同步每一个方法，使其效率较低，在现代应用程序中通常会被避免，转而使用\
  \ `ConcurrentHashMap`。\n\n选择正确的同步策略取决于你的具体用例，即你优先考虑的是安全性、性能还是简单性。\n\n## Map 的泛型算法\n\
  \n虽然 JCF 通过 `Collections` 和 `Arrays` 等实用类提供了对许多算法的直接支持，但 `Maps` 并不是 Collection 类型，因此它们无法与用于\
  \ `List`、`Set` 等所有泛型算法直接兼容。然而，我们仍然可以使用它们的 `keySet`、`values` 和 `entrySet` 视图对 `Map`\
  \ 实例应用广泛的算法操作。\n\n以下是一些常用的技术和模式：\n\n- 遍历条目：使用 `entrySet()` 方法高效地遍历键值对。\n\n以下是使用\
  \ `entrySet()` 进行迭代的示例：\n\n```\nfor (Map.Entry<String, Integer> entry : map.entrySet())\
  \ {\n    System.out.println(entry.getKey() + \" -> \" + entry.getValue());\n}\n\
  ```\n\n- 过滤值或键：可以使用 Streams 根据条件进行过滤，如下所示：\n\n```\nmap.entrySet().stream()\n  .filter(e\
  \ -> e.getValue() > 10)\n  .forEach(e -> System.out.println(e.getKey()));\n```\n\
  \n- 排序 Map：虽然 `HashMap` 不保持排序，但可以使用 Streams 对键或值进行排序，如下所示：\n\n```\nmap.entrySet().stream()\n\
  \  .sorted(Map.Entry.comparingValue())\n  .forEach(System.out::println);\n```\n\n\
  - 转换键或值：可以通过转换构建新的 map，如下所示：\n\n```\nMap<String, Integer> updated = map.entrySet().stream()\n\
  \  .collect(Collectors.toMap(\n    e -> e.getKey().toUpperCase(),\n    e -> e.getValue()\
  \ * 2\n  ));\n```\n\n- 分组和计数：Maps 在使用 `Collectors.groupBy` 构建分组时非常重要，如下所示：\n\n```\n\
  Map<String, Long> frequency = list.stream()\n  .collect(Collectors.groupBy(Function.identity(),\
  \ Collectors.counting()));\n```\n\n这些算法模式让你轻松处理复杂数据。虽然 map 不支持 `Collections.sort()`，但其视图的灵活性使得\
  \ map 操作变得高效。\n\n## 总结\n\n在本章中，我们探索了 `Map` 接口及其主要实现——HashMap、`LinkedHashMap`、`TreeMap`\
  \ 和 `Hashtable`。我们讨论了它们的内部机制、构造函数、性能特性以及同步策略。此外，我们对比了它们的优缺点，概述了常见用例，并演示了如何对 map\
  \ 应用泛型算法。\n\n理解每个 map 实现的细节有助于你根据性能需求、排序需求和线程安全考虑做出正确选择，最终帮助你编写清洁、可扩展且高效的 Java 代码。\n\
  \n在下一章中，我们将转向 `Set` 接口，研究 Java 如何通过 `HashSet`、`LinkedHashSet` 和 `TreeSet` 确保集合的唯一性。\n\
