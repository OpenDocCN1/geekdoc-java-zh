  4. `finalize()`\n\n### 答案\n\n1. c\n解释：`Hashtable` 是同步的，不允许 null 键或值。所有其他实现都允许一个\
  \ null 键或多个 null 值。\n\n2. b\n解释：`LinkedHashMap` 维护一个双链表以保留条目的插入顺序。\n\n3. b\n解释：`TreeMap`\
  \ 使用红黑树结构存储，并使用自然排序或指定的 `Comparator` 进行排序。\n\n4. c\n解释：在平均情况下，假设哈希函数良好，`HashMap`\
  \ 为 `put()` 和 `get()` 提供常数时间复杂度。\n\n5. c\n解释：当键值对的数量超过*容量 * 负载因子*时，map 会调整大小以保持性能。\n\
  \n6. c\n解释：`HashMap` 允许一个 null 键和任意数量的 null 值。`TreeMap` 允许 null 值但不允许 null 键（自然排序）。`Hashtable`\
  \ 完全不允许 null。\n\n7. d\n解释：`ConcurrentHashMap` 设计用于线程安全操作，不需要锁定整个 map，与 `Hashtable`\
  \ 不同。\n\n8. c\n解释：`HashMap` 通过在相同的桶索引处使用链表或树存储条目来处理冲突。\n\n9. d\n解释：该构造函数允许你定义一个自定义的\
  \ `Comparator` 来排序键。\n\n10. c\n解释：`hashCode()` 用于找到正确的桶，而 `equals()` 用于检查桶内键的相等性。\n\
