  \n![QR-Logo](img/fm1.png)\n\n# 第 11 章 实际应用\n\n## 引言\n\n到目前，我们从概念和技术角度探索了 Java 集合和泛型，例如它们的工作原理、结构以及最佳用法。然而，在现实世界中，你很少孤立地使用这些特性。它们通常是解决软件系统中实际日常问题的更大设计的一部分。\n\
  \n本章重点关注泛型和集合如何应用于真实的 Java 程序中，从处理用户会话到构建可扩展 API，从解决并发问题到实现缓存和自定义数据工作流。你将学习经验开发者如何使用这些特性来创建既整洁又符合生产标准的解决方案。\n\
  \n## 结构\n\n本章涵盖了以下领域：\n\n* 案例研究\n* 实际示例\n* 常见用法模式\n* 解决典型问题\n* 现实场景中的最佳实践\n\n##\
  \ 目标\n\n在本章结束时，你将能够理解 Java 集合和泛型如何融入实际的软件解决方案。你将学习识别典型的用法模式，将集合应用于常见的设计问题，并遵循能够提高代码可维护性、性能和清晰度的最佳实践。无论是设计表征状态转换（REST）API、处理大型数据集，还是管理线程安全操作，本章都将为你提供缩小理论与实践差距的示例和见解。\n\
  \n## 案例研究\n\n### 案例研究 1：Web 应用程序中用户会话的管理\n\n* **问题描述**：想象一个基于 Java 的 Web 应用程序，允许用户根据角色（管理员、编辑器、查看者）登录并执行任务。每个用户会话都必须被唯一跟踪以确保：\n\
  \    * 通过会话 ID 快速查找\n    * 防止重复登录\n    * 根据登录时间清理过期的会话\n    * 以只读暴露的方式安全处理会话数据\n\
  \    随着活跃用户数量的增加，系统必须具备良好的扩展。\n\n* **设计决策**：在设计会话管理器之前，考虑为什么选择某些数据结构和类型系统是重要的。在大规模应用中，管理用户会话等状态需要精确性、性能和清晰度。集合提供了快速访问和高效存储，而泛型确保了类型安全和可重用性。\n\
  这种组合使得集合和泛型成为管理会话数据的理想选择，因为在这种情况下，快速查找、受控暴露和可维护的代码至关重要。\n\n以下是核心设计因素：\n\n* 基于键的快速查找对于使用会话\
  \ ID 快速检索会话信息至关重要。`Map` 的实现是自然选择。\n* 需要保留插入顺序以便优先跟踪最旧的会话进行清理。因此，选择了 `LinkedHashMap`\
  \ 而不是 `HashMap`。\n* 类型安全非常重要，以确保只存储和检索有效的会话数据对象，`generics` 通过编译检查强制执行了这一点。\n* 在向外部暴露会话数据时，需要对会话列表进行不可变访问。这是通过使用\
  \ `Collections.unmodifiableList()` 实现的。\n* 通过封装会话逻辑并使用泛型 `collection` 接口，显著提升了可维护性和可读性。\n\
  \n这些选择确保了系统既高效又易于逻辑推理，同时也防止了常见的运行时错误。\n\n* **实现**：让我们理解一下实现。我们首先定义一个类来持有会话相关信息，如下所示：\n\
  \n```java\npublic class SessionInfo {\n    private final String userId;\n    private\
  \ final String ipAddress;\n    private final long loginTime; // 毫秒 epoch 时间\n  \
  \  private final String role;\n\n    public SessionInfo(String userId, String ipAddress,\
  \ long loginTime, String role) {\n        this.userId = userId;\n        this.ipAddress\
  \ = ipAddress;\n        this.loginTime = loginTime;\n        this.role = role;\n\
  \    }\n\n    // Getters\n    public String getUserId() { return userId; }\n   \
  \ public String getIpAddress() { return ipAddress; }\n    public long getLoginTime()\
  \ { return loginTime; }\n    public String getRole() { return role; }\n}\n```\n\n\
  在上面的 `SessionInfo` 类中：\n\n* `userId`：标识用户（例如，user123）\n* `ipAddress`：跟踪用户的设备或位置（例如，192.168.1.2）\n\
  * `loginTime`：存储会话开始的时间，单位为毫秒 epoch\n* `role`：定义用户拥有的权限（例如，admin）\n\n在向外部暴露会话数据时，需要对会话列表进行不可变访问。这是通过使用\
  \ `Collections.unmodifiableList()` 实现的。一旦会话被创建。\n\n现在让我们定义 `SessionManager` 类。该类使用集合来管理所有会话，如下所示：\n\
  \n```java\nimport java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.Iterator;\n\
  import java.util.LinkedHashMap;\nimport java.util.List;\nimport java.util.Map;\n\
  \npublic class SessionManager {\n    private final Map<String, SessionInfo> sessionMap\
  \ = new LinkedHashMap<>();\n    private static final long SESSION_TIMEOUT = 30 *\
  \ 60 * 1000; // 30 分钟\n\n    // 为用户创建或替换会话\n    public void createSession(String\
  \ sessionId, SessionInfo info) {\n        sessionMap.put(sessionId, info);\n   \
  \ }\n\n    // 通过会话 ID 获取会话\n    public SessionInfo getSession(String sessionId)\
  \ {\n        return sessionMap.get(sessionId);\n    }\n\n    // 手动移除会话\n    public\
  \ void removeSession(String sessionId) {\n        sessionMap.remove(sessionId);\n\
  \    }\n\n    // 获取所有会话的只读视图\n    public List<SessionInfo> getAllActiveSessions()\
  \ {\n        return Collections.unmodifiableList(new ArrayList<>(sessionMap.values()));\n\
  \    }\n\n    // 清理过期会话\n    public void cleanupExpiredSessions() {\n        long\
  \ now = System.currentTimeMillis();\n        Iterator<Map.Entry<String, SessionInfo>>\
  \ iterator = sessionMap.entrySet().iterator();\n        while (iterator.hasNext())\
  \ {\n            Map.Entry<String, SessionInfo> entry = iterator.next();\n     \
  \       if (now - entry.getValue().getLoginTime() > SESSION_TIMEOUT) {\n       \
  \         iterator.remove(); // 迭代时的安全删除方式\n            }\n        }\n    }\n}\n\
  ```\n\n在上面的示例中：\n\n* `Map` 允许我们将会话 ID（作为 `String`）映射到 `SessionInfo` 对象。\n* 我们使用\
  \ `LinkedHashMap` 而不是 `HashMap`，因为它保留了添加的顺序。这有助于我们稍后清理旧会话。\n* `createSession` 使用唯一的\
  \ `sessionId` 在 map 中添加新会话。如果已存在相同 ID 的会话，则会被替换（这同时也允许处理重新登录逻辑）。\n* `getSession`\
  \ 方法使用 `sessionId` 键查找 `SessionInfo` 对象。如果不存在此类会话，则返回 `null`。\n* `removeSession`\
  \ 允许手动移除会话，例如在注销或安全失效时。\n\n\n\n\n\n*  `getAllActiveSessions` 方法暴露了所有活跃会话的列表，但是：\n\
  \    *   我们将 `Map` 值（即 `SessionInfo` 对象）转换为列表。\n    *   我们随后将其封装在 `Collections.unmodifiableList()`\
  \ 中，以防止外部代码修改内部会话数据。\n* `cleanUpExpiredSession` 是最重要的功能之一：\n    *   `SESSION_TIMEOUT`\
  \ 定义了允许的会话时长（30 分钟）。\n    *   我们使用 `Iterator` 遍历所有会话，这样就可以安全地移除项而不会抛出 `ConcurrentModificationException`。\n\
  \    *   我们计算每个会话自开始以来，如果超过 30 分钟，则将其从 map 中移除。\n\n以下是使用 `SessionManager` 的示例：\n\
  \n```java\npublic class TestSessionManager {\n    public static void main(String[]\
  \ args) throws InterruptedException {\n        SessionManager manager = new SessionManager();\n\
  \        manager.createSession(\"sess1\", new SessionInfo(\"user123\", \"192.168.1.1\"\
  , System.currentTimeMillis(), \"admin\"));\n        manager.createSession(\"sess2\"\
  , new SessionInfo(\"user456\", \"192.168.1.2\", System.currentTimeMillis(), \"editor\"\
  ));\n        // Simulate session list\n        for (SessionInfo session : manager.getAllActiveSessions())\
  \ {\n            System.out.println(session.getUserId() + \" - \" + session.getRole());\n\
  \        }\n        // After 30 minutes, run cleanup (simulate with sleep for testing)\n\
  \        Thread.sleep(1000); // Just for demonstration\n        manager.cleanupExpiredSessions();\n\
  \    }\n}\n```\n\n以下是系统的整体工作机制：\n* 当用户登录时创建新会话\n* 允许对会话进行查找、删除和列出\n* 根据时间高效清理旧会话\n\
  * 使用泛型 (`Map<String, SessionInfo>`) 确保类型安全\n* 使用 `LinkedHashMap`、`ArrayList` 和 `Collections.unmodifiableList()`\
  \ 等 `Collections` 来清晰且安全地管理状态\n\n该案例研究了如何有效使用 Java 集合和泛型来管理 Web 应用程序中的用户会话。用于有序访问的\
  \ `LinkedHashMap`、用于类型安全的泛型以及用于安全暴露的不可变包装器相结合，产生了一个整洁、可维护且考虑性能的解决方案。\n\n通过将逻辑封装在专用的\
  \ `SessionManager` 类中并使用适当的数据结构，我们确保了设计对于真实用例（如会话过期、并发访问或基于角色的过滤）具有扩展性。这种模式可以适用于任何需要会话跟踪或类似状态行为的\
  \ Java 后端系统。\n\n### 案例研究 2：基于 Sets 和 Maps 的角色访问控制\n\n* **问题描述**：在企业级应用程序中，必须在多个级别执行访问控制。每个用户被分配一个或多个角色，每个角色允许一组操作（或权限）。系统必须高效地分配并检索用户的角色\n\
  \    *   定义每个角色允许哪些操作\n    * 验证用户是否被允许执行特定操作\n    * 避免重复并确保快速查找\n* **设计决策**：访问控制自然地映射到集合：\n\
  \    *   使用 `Set` 维护每个用户的唯一角色以及每个角色的唯一权限\n    *   使用 `Map` 允许快速检索特定角色的权限或某个用户的角色\n\
  \    *   泛型确保如 `Map<String, Set<String>>` 等映射是严格类型安全的，减少运行时错误并提高可读性\n\n这些结构实现了可扩展、高性能且安全的访问管理逻辑。\n\
  \n* **实现**：让我们让我们构建一个简单的基于角色的访问控制 (RBAC) 系统，其中：\n    *   用户可以拥有多个角色\n    *   每个角色映射到允许的操作集\n\
  \    *   我们可以检查用户是否被允许执行给定的操作\n\n我们从 `RolePermissionRegistry` 类开始，如下：\n\n```java\n\
  import java.util.Collections;\nimport java.util.HashMap;\nimport java.util.HashSet;\n\
  import java.util.Map;\nimport java.util.Set;\n\npublic class RolePermissionRegistry\
  \ {\n    private final Map<String, Set<String>> rolePermissions = new HashMap<>();\n\
  \    public void addPermissions(String role, Set<String> permissions) {\n      \
  \  rolePermissions.put(role, new HashSet<>(permissions));\n    }\n    public Set<String>\
  \ getPermissions(String role) {\n        return Collections.unmodifiableSet(rolePermissions.getOrDefault(role,\
  \ Collections.emptySet()));\n    }\n}\n```\n上述类持有角色到其操作的映射。\n* `rolePermissions`\
  \ 将每个角色（例如 `admin`）映射到操作集（例如 `{\"CREATE\", \"DELETE\"}`）。\n* 如果角色不存在，我们返回一个不可变的空集合。为了维护用户-角色的映射，我们有如下所示的\
  \ `UserAccessManager` 类：\n\n```java\nimport java.util.HashMap;\nimport java.util.Map;\n\
  import java.util.Set;\n\npublic class UserAccessManager {\n    private final Map<String,\
  \ Set<String>> userRoles = new HashMap<>();\n    private final RolePermissionRegistry\
  \ registry;\n    public UserAccessManager(RolePermissionRegistry registry) {\n \
  \       this.registry = registry;\n    }\n    public void assignRole(String userId,\
  \ String role) {\n        userRoles.computeIfAbsent(userId, k -> new HashSet<>()).add(role);\n\
  \    }\n    public Set<String> getUserRoles(String userId) {\n        return Collections.unmodifiableSet(userRoles.getOrDefault(userId,\
  \ Collections.emptySet()));\n    }\n    public boolean isActionAllowed(String userId,\
  \ String action) {\n        Set<String> roles = getUserRoles(userId);\n        for\
  \ (String role : roles) {\n            if (registry.getPermissions(role).contains(action))\
  \ {\n                return true;\n            }\n        }\n        return false;\n\
  \    }\n}\n```\n在上述示例中：\n* `userRoles` 将每个用户 ID 映射到角色集（例如 `\"user123\"` `[\"editor\"\
  , \"viewer\"]`）。\n* `assignRole()` 在不存在时初始化角色集。\n* `isActionAllowed()` 遍历用户的角色，并检查是否有任何一个允许给定的操作。\n\
  * `computeIfAbsent` 检查 `userId` 是否存在；如果不存在，创建一个新的 `HashSet` 并将其关联。\n\n现在，让我们通过下面的\
  \ `AccessControlTest` 类进行测试：\n\n```java\nimport java.util.Set;\n\npublic class AccessControlTest\
  \ {\n    public static void main(String[] args) {\n        RolePermissionRegistry\
  \ registry = new RolePermissionRegistry();\n        registry.addPermissions(\"admin\"\
  , Set.of(\"CREATE\", \"READ\", \"UPDATE\", \"DELETE\"));\n        registry.addPermissions(\"\
  editor\", Set.of(\"READ\", \"UPDATE\"));\n        registry.addPermissions(\"viewer\"\
  , Set.of(\"READ\"));\n        UserAccessManager accessManager = new UserAccessManager\
  \ (registry);\n        accessManager.assignRole(\"Chloe\", \"viewer\");\n      \
  \  accessManager.assignRole(\"Ray\", \"editor\");\n        accessManager.assignRole(\"\
  Ann\", \"admin\");\n        System.out.println(\"Can Chloe DELETE? \" + accessManager.isActionAllowed(\"\
  Chloe\", \"DELETE\")); // false\n        System.out.println(\"Can Ray UPDATE? \"\
  \ + accessManager.isActionAllowed(\"Ray\", \"UPDATE\")); // true\n        System.out.println(\"\
  Can ANN CREATE? \" + accessManager.isActionAllowed(\"Ann\", \"CREATE\")); // true\n\
  \    }\n}\n```\n\n\n\n\n\n本案例展示了如何有效 Java 集合和泛型来实现 RBAC（基于角色的访问控制），这是许多应用程序中的基础安全需求。通过使用\
  \ `Map` 和 `Set` 对用户-角色和角色-权限关系进行建模，我们能够简洁高效地执行访问规则。\n\n泛型（`Map<String, Set<String>>`）的使用确保了类型安全和可读性，同时避免了冗余数据并实现了快速查找。这种设计对于访问权限频繁变化的现实系统而言，具有良好的扩展性和适应性。\n\
  \n### 案例研究 3：电子商务系统中的产品订单处理\n\n*   **问题描述**：在电子商务平台中，全天都会收到来自多个客户的订单。每个订单包含：\n \
  \   *   一个唯一的订单 ID\n    *   客户信息\n    *   项目列表，每个项目都包含产品详情和数量\n\n系统必须通过以下方式高效处理传入的订单：\n\
  \    *   按 `customer ID` 对订单进行存储和分组\n    *   跟踪每个客户订单的所有项目\n    *   计算每个客户的总价值\n\
  \    *   在需要时提供订单的只读摘要\n\n数据量可能会迅速增长，因此解决方案必须是内存高效的并且能够防止意外修改。\n\n*   **设计决策**：为了满足上述问题描述，我们选择了：\n\
  \    *   使用 `Map` 按 `customer ID` 对订单进行分组\n    *   使用 `List` 维护每个客户的已排序项目\n    *\
  \   使用自定义 `class` 来表示订单中的每个项目\n    *   使用 `Generics` 确保订单的类型安全处理并避免强制类型转换\n    *\
  \   使用 `Unmodifiable views`（不可修改视图）来报告订单摘要，而不暴露内部结构\n\n这些设计选择允许结构化存储、易于聚合以及为报告工具提供安全的读取访问。\n\
  \n*   **实现**：我们将使用以下组件建模一个简化的订单处理模块：\n    *   `OrderItem` 是订单中的单个项目\n    *   `CustomerOrderManager`\
  \ 存储并按客户分组订单\n    *   用于计算总额和生成只读摘要的实用方法方法\n\n以下是 `OrderItem` 类，它代表客户订单中的产品：\n\n\
  ```java\npublic class OrderItem {\n    private final String productId;\n    private\
  \ final String productName;\n    private final int quantity;\n    private final\
  \ double pricePerUnit;\n\n    public OrderItem(String productId, String productName,\
  \ int quantity, double pricePerUnit) {\n        this.productId = productId;\n  \
  \      this.productName = productName;\n        this.quantity = quantity;\n    \
  \    this.pricePerUnit = pricePerUnit;\n    }\n\n    public double getTotalPrice()\
  \ {\n        return quantity * pricePerUnit;\n    }\n\n    // Getters\n    public\
  \ String getProductId() { return productId; }\n    public String getProductName()\
  \ { return productName; }\n    public int getQuantity() { return quantity; }\n \
  \   public double getPriceUnit() { return pricePerUnit; }\n}\n```\n\n在上面的示例中：\n\
  *   `getTotalPrice()` 计算该项目的成本\n*   该类是不可变的，确保了线程安全和数据完整性\n\n接下来，我们有了处理存储和聚合的 `CustomerOrderManager`\
  \ 类：\n\n```java\nimport java.util.ArrayList;\nimport java.util.Collections;\nimport\
  \ java.util.HashMap;\nimport java.util.List;\nimport java.util.Map;\nimport java.util.Set;\n\
  \npublic class CustomerOrderManager {\n    private final Map<String, List<OrderItem>>\
  \ customerOrders = new HashMap<>();\n\n    // Add an item to a customer's order\n\
  \    public void addOrderItem(String customerId, OrderItem item) {\n        customerOrders.computeIfAbsent(customerId,\
  \ k -> new ArrayList<>()).add(item);\n    }\n\n    // Get all order items for a\
  \ customer\n    public List<OrderItem> getOrderItems(String customerId) {\n    \
  \    return Collections.unmodifiableList(customerOrders.getOrDefault(customerId,\
  \ Collections.emptyList()));\n    }\n\n    // Calculate total order value for a\
  \ customer\n    public double getTotalValue(String customerId) {\n        return\
  \ customerOrders.getOrDefault(customerId, Collections.emptyList())\n           \
  \     .stream()\n                .mapToDouble(OrderItem::getTotalPrice)\n      \
  \          .sum();\n    }\n\n    // Get all customers\n    public Set<String> getAllCustomerIds()\
  \ {\n        return Collections.unmodifiableSet(customerOrders.keySet());\n    }\n\
  }\n```\n\n在上面的示例中：\n*   `computeIfAbsent` 确保在第一次遇到 `customer ID` 时初始化新列表。\n*   `unmodifiableList`\
  \ 和 `unmodifiableSet`提供了对内部结构的安全的访问。\n*   使用 `streams` 使得聚合操作变得简洁高效。\n\n订单处理可以进行测试，如下所示：\n\
  \n```java\npublic class OrderProcessingTest {\n    public static void main(String[]\
  \ args) {\n        CustomerOrderManager manager = new CustomerOrderManager();\n\
  \        manager.addOrderItem(\"CUST001\", new OrderItem(\"P1001\", \"Notebook\"\
  , 2, 120.0));\n        manager.addOrderItem(\"CUST001\", new OrderItem(\"P1002\"\
  , \"Pen\", 5, 10.0));\n        manager.addOrderItem(\"CUST002\", new OrderItem(\"\
  P1003\", \"Backpack\", 1, 750.0));\n\n        for (String customerId : manager.getAllCustomerIds())\
  \ {\n            System.out.println(\"Customer ID: \" + customerId);\n         \
  \   System.out.println(\"Total Value: \" + manager.getTotalValue(customerId));\n\
  \            for (OrderItem item : manager.getOrderItems(customerId)) {\n      \
  \          System.out.println(\"- \" + item.getProductName() + \": \" + item.getQuantity());\n\
  \            }\n        }\n    }\n}\n```\n\n\n\n\n\n```java\n\"Eraser (Out of Stock)\"\
  \n\n);\n\nList<String> availableProducts = products.stream()\n    .filter(p -> !p.contains(\"\
  (Out of Stock)\"))\n    .collect(Collectors.toList());\n\nSystem.out.println(availableProducts);\
  \ // [Notebook, Pen, Marker]\n```\n\n在上面的示例中：\n\n* 我们使用 `Stream` 来处理列表并应用一个过滤条件。\n\
  * 只有不包含 `(Out of Stock)` 的产品会被收集到一个新的列表中。\n* 由于由于不可变性（`List.of(...)`），原始列表保持不变。\n\
  \n### 示例 11.2：使用 `Collectors.groupingBy()` 对元素进行分组：\n\n* 问题：你想根据部门对员工进行分组。\n\n可以通过以下方式解决：\n\
  \n```java\nrecord Employee(String name, String department) {}\n\nList<Employee>\
  \ employees = List.of(\n    new Employee(\"Alex\", \"HR\"),\n    new Employee(\"\
  Rocky\", \"Engineering\"),\n    new Employee(\"Mike\", \"HR\"),\n    new Employee(\"\
  Aron\", \"Engineering\")\n);\n\nMap<String, List<Employee>> groupedByDept = employees.stream()\n\
  \    .collect(Collectors.groupingBy(Employee::department));\n\nSystem.out.println(groupedByDept);\n\
  ```\n\n在上面的示例中：\n\n* 使用 `Collectors.groupingBy()` 创建一个 `Map`，其中键是部门名称，值是该部门员工的列表。\n\
  * 使用 `record`（`Employee`）使得代码更加简洁且易读。\n* 这通常用于报告生成、仪表板和分析功能。\n\n### 示例 11.3：对自定义对象列表进行排序\n\
  \n* 问题：你有一有一个包含姓名和成绩的学生列表。你想按成绩降序排列对他们进行排序。\n\n可以通过以下方式解决：\n\n```java\nclass Student\
  \ {\n    String name;\n    int marks;\n    public Student(String name, int marks)\
  \ {\n        this.name = name;\n        this.marks = marks;\n    }\n    public String\
  \ toString() {\n        return name + \" (\" + marks + \")\";\n    }\n}\n```\n\n\
  我们定义了所示的简单学生类，然后创建一个学生列表并根据他们的成绩进行排序：\n\n```java\nList<Student> students = new ArrayList<>();\n\
  students.add(new Student(\"Michael\", 88));\nstudents.add(new Student(\"Ariel\"\
  , 95));\nstudents.add(new Student(\"Rox\", 76));\nstudents.sort((s1, s2) -> Integer.compare(s2.marks,\
  \ s1.marks));\nSystem.out.println(students);\n```\n\n在示例中：\n\n* 使用自定义比较器对列表进行排序，该比较器降序比较成绩。\n\
  * 使用 `Collections.sort()` 或 `List.sort()` 对自定义对象进行排序是现实世界中常见的任务。\n\n### 示例 11.4：创建频率映射：\n\
  \n* 问题：给定一个产品 ID 列表，统计每个产品销售的次数。\n\n以下是解决该问题的代码：\n\n```java\nList<String> productIds\
  \ = List.of(\"P1\", \"P2\", \"P1\", \"P3\", \"P2\", \"P1\");\nMap<String, Long>\
  \ frequencyMap = productIds.stream()\n    .collect(Collectors.groupingBy(\n    \
  \    id -> id,\n        Collectors.counting()\n    ));\nSystem.out.println(frequencyMap);\
  \ // {P1=3, P2=2, P3=1}\n```\n\n在上面的示例中：\n\n* 配合 `counting` 使用 `groupingBy` 可以统计每个元素的次数。\n\
  * 结果是一个 `Map`，其中键是产品 ID，值是它们的频率。\n* 对于生成摘要、日志或仪表板有用。\n\n### 示例 11.5：使用 `flatMap()`\
  \ 展开嵌套集合：\n\n* 问题：给定一个学生列表，每个学生都参加了多门课程，获取一个所有学生所选课程的唯一扁化列表。\n\n以下是解决该问题的代码：\n\n\
  ```java\nList<String> uniqueCourses = students.stream()\n    .flatMap(student ->\
  \ student.getCourses().stream())\n    .distinct()\n    .collect(Collectors.toList());\n\
  ```\n\n\n\n\n\n*   处理大型数据集：使用如 `ArrayDeque`（队列）或 `TreeSet`（有序访问）等数据结构，可以使用化的内存和访问速度处理海量数据。\n\
  \n## 真实场景中的最佳实践\n\n在大规模或生产环境级应用程序中使用集合和泛型时，普通代码与优秀代码之间的区别往往在于对最佳实践的运用。这些实践可以帮助你编写更安全、更整洁、更易维护且性能优的\
  \ Java 代码。\n\n以下是广泛推荐且在真实软件系统中证明有效的关键最佳实践：\n\n*   **优先使用接口而非实现类**：始终使用接口（`List`,\
  \ `Set`, `Map`）声明变量和返回类型，而不是具体的实现类（`ArrayList`, `HashSet`, `HashMap`）。这提高了了灵活性，并允许在最小影响内切换实现类。\n\
  \n例如：\n\n```javaList<String> names = new ArrayList<>();\n```\n\n*   **以合适的容量初始化集合**：如果你提前知道大小，请提供初始容量（例如在\
  \ `ArrayList` 或 `HashMap` 中），以避免昂贵的重扩操作。\n\n例如：\n\n```java\nMap<String, String>\
  \ cache = new HashMap<>(1000); // 减少重哈\n```\n\n*   **避免原始类型（raw types）**：始终使用泛型而非原始类型，以维护类型安全并防止\
  \ `ClassCastException`。\n\n例如：\n\n```java\nList<String> list = new ArrayList<>();\n\
  List rawList = new ArrayList();\n```\n\n*   **返回空集合而非 null**：返回 `null` 会强制调用者进行空检查。返回\
  \ `Collections.emptyList()` 或 `emptyMap()` 可以避免错误并简化代码。\n\n*   **在暴露集合时使用不可修改包装器**：防止调用者无意（或有意）修改内部状态。\n\
  \n例如：\n\n```java\nreturn Collections.unmodifiableList(orderHistory);\n```\n\n* \
  \  **使用 `Comparator.comparing()` 进行可读性强的排序**：现代 Java 允许编写具有表现力的排序逻辑。\n\n例如：\n\n\
  ```java\nproducts.sort(Comparator.comparing(Product::getPrice).reversed());\n```\n\
  \n*   **最小化可变性**：在处理共享或敏感数据时，使用不可变数据结构或防御性拷贝。\n\n*   **避免泛型中不必要的装箱**：在可能的情况下使用原始类型特有的替代方案（`IntStream`,\
  \ `Map<Integer, String>` 等）以避免性能开销。\n\n*   **使用 `computeIfAbsent()` 或 `merge()`\
  \ 进行聚合**：这些方法在填充或更新 map 时消除了冗冗的 `if-else` 检查。\n\n## 总结\n\n在本章中，我们探索了 Java 集合和泛型如何超越理论构型，成为构建实际真实世界软件的重要工具。通过案例研究、常用用法模式和真实世界的问题解决策略，我们看到了如何以可扩展的方式组织、处理和保护数据。\n\
  \n集合提供了一种管理成组组的结构化方式，而泛型确保了类型安全、可重用并减少了运行时错误。无论你是在设计订单处理系统、实现 RBAC 还是分析产品数据，掌握这些\
  \ API 都能带来更健壮、更易维护的代码。\n\n在下一章也是最后一章中，我们将探索新兴趋势、近期 Java 版本的增强功能以及集合和泛型的未来方向。\n\n\
