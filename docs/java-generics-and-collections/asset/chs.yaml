  \n## Java 集合框架概览\nJava 集合框架 (JCF) 是一个用于处理和操作 Java 中集合的统一架构。它包含了各种数据结构的接口和类，例如 Lists、Sets、Maps\
  \ 等。该框架提供了高效且灵活的方法来存储、检索和处理对象。\n\n在探索泛型在 Java 集合框架中的应用之前，理解核心集合是有帮助的。\n\n下表提供了主要集合类型及其主要特征的概览：\n\
  \n| :--- | :--- |\n| `List<T>` | 一种有序的集合，允许重复（例如 `ArrayList`、`LinkedList`）。 |\n\
  | `Set<T>` | 一种不允许重复且无序的集合（例如 `HashSet`、`TreeSet`）。 |\n| `Queue<T>` | 通常为先进先出 (FIFO)\
  \ 操作设计的集合（例如 `PriorityQueue`）。 |\n| `Map<K, V>` | 一种存储键值对的集合（例如 `HashMap`、`TreeMap`）。\
  \ |\n表 3.1：Java 集合框架中的核心接口\n\n理解这些集合类型及其特征为有效地与它们配合泛型奠定了基础。泛型增强了集合的类型安全性和灵活性，允许你在处理强类型数据结构的同时，避免不必要的类型转换和运行时错误。\n\
  \n在接下来的章节中，我们将探索如何将泛型应用于 List、Set 和 Map，以及确保代码类型安全和维护性的最佳实践。我们将在 第 4 章 集合框架简介中深入探讨集合框架。\n\
  虽然泛型主要以增强类型安全性和可读性而闻名，但它们对性能提升也有贡献。在非泛型代码中，集合以原始 `Object` 类型存储元素，需要频繁的强制转换，并引入了运行时\
  \ `ClassCastException` 的风险。泛型消除了此类转换的需求，使得字节码更高效、更安全。\n\n此外，泛型减少了在处理包装类型（特别是 `List<Integer>`）时与装箱（boxing）和拆箱（unboxing）相关的开销。尽管\
  \ Java 尚未在核心库中包含基本数据类型特化的集合（例如 `IntList`），但带有包装类型的泛型提供了一个更简洁、更好的替代方案。\n\n这种编译时的类型强制确保了更整洁的代码执行，并允许\
  \ Java 虚拟机 (`JVM`) 和即时编译器 (`JIT compiler`) 等工具更有效地优化字节码。\n考虑以下示例：\n\n```java\n//\
  \ 未使用泛型（Java 5 之前）\nList numbers = new ArrayList();\nint n = (Integer) numbers.get(0);\
  \ // 需要显式转换\n\n// 使用泛型\nList<Integer> numbersGen = new ArrayList<>();\nnumbersGen.add(10);\
  \ // 仍会自动装箱\nint m = numbersGen.get(0); // 不需要转换\n\n第二个示例避免了对显式强制转换的需求，并允许编译器执行类型检查。这不仅提高了安全性，还实现了运行时优化。\n\
  \n## 将泛型应用于 List<T>\n\n\n在泛型引入之前，Java 集合以 `object` 类型存储元素，这意味着不同类型的对象可以添加到同一个列表中。然而，这导致了不安全的类型转换，在检索元素时需要显式的强制转换。\n\
  \n考虑以下非泛型列表实现的示例：\n\nimport java.util.ArrayList;\nimport java.util.List;\n\npublic\
  \ class NonGenericListExample {\n  public static void main(String[] args) {\n  \
  \  nonGenericList.add(\"Java\"); // 添加 String\n    nonGenericList.add(100); // 添加\
  \ Integer（无编译错误）\n    fetchItems(nonGenericList);\n  }\n\n  public static void fetchItems(List\
  \ nonGenericListItems) {\n    String item2 = (String) nonGenericListItems.get(1);\
  \ // 运行时错误！ClassCastException\n  }\n}\n```\n\n\n\n\n```java\nSystem.out.println(item1);\n\
  System.out.println(item2); // 这将导致错误\n}\n}\n```\n\n\n这就是引入泛型的原因，因为泛型在编译时强制执行了类型安全。\n\
  \n通过指定类型参数 `<T>`，我们限制列表只能存储一种类型的元素。\n\n\n```java\nimport java.util.ArrayList;\n\
  import java.util.List;\n\n  public static void main(String[] args) {\n    List<String>\
  \ genericList = new ArrayList<>(); // 类型安全的列表\n    genericList.add(\"Java\");\n\
  \    // genericlist.add(100); // 编译错误 - 只允许字符串\n    String item1 = genericList.get(0);\
  \ // 不需要显式强制转换\n  }\n}\n```\n\n在这里，`List<String>` 确保了只能存储字符串元素。尝试添加 100（一个整数）会导致编译错误。在获取元素时，不需要显式强制转换。使用泛型后，代码更加安全且整洁。\n\
  ### 泛型列表中的通配符\n\n虽然泛型强制了严格的类型安全，但在某些场景下，我们希望在处理未知或相关类型时具有灵活性。例如，我们可能希望一个方法能够处理包含不同但相关类型元素的列表。\n\
  \n考虑以下代码：\n```java\npublic void printNames(List<? extends Person> people) {\n  for\
  \ (Person p : people) {\n    System.out.println(p.getName());\n  }\n}\n\n在上述代码中，`printNames`\
  \ 方法接受任何作为 `Person` 子类的类型的列表（例如，`Employee`、`Student` 等），这在保持类型安全的同时赋予了灵活性。如果没有通配符，你将为每个特定的子类编写一个独立的方法。\n\
  \n这就是通配符 (`?`) 派上用场。通配符允许我们创建更通用的方法，以处理一系列泛型类型，同时仍维持类型安全。让我们探索通配符的不同类型以及如何有效地使用它们：\n\
  \n\n通过使用无界通配符 (`?`)，我们指示该方法可以接受任何类型的列表，但由于我们不知道它们的确切类型，我们将元素视为 `objects`。让我们来看一个示例：\n\
  \n```java\nimport java.util.List;\n\npublic class UnboundedWildcardListExample {\n\
  \  public static void printList(List<?> unboundedList) {\n    for (Object eachItem\
  \ : unboundedList) {\n      System.out.println(eachItem);\n  }\n  public static\
  \ void main(String[] args) {\n    List<String> stringList = Arrays.asList(\"A\"\
  , \"B\", \"C\");\n    List<Integer> intList = Arrays.asList(1, 2, 3);\n    printList(stringList);\
  \ // 适用于任何类型\n    printList(intList);\n}\n```\n\n在此示例中，任何列表类型（`List<String>`、`List<Integer>`\
  \ 等）都可以传递给 `printList` 方法。我们不能向 `List<?>` 添加新元素，因为确切类型是未知的。以下行会导致编译错误：\n\n\n- **列表中的上界通配符\
  \ (`? extends Type`)**：在处理泛型中的列表时，上界通配符 (`? extends T`) 允许我们处理包含特定类型元素或其任何子类的集合。当我们想要从列表中读取数据而不必担心其确切类型时，这非常有用。由于列表可以持有各种子类的元素，我们可以安全地获取元素，但不能向列表添加新元素（`null`\
  \ 除外）。让我们通过示例来探索：\n\n```java\nimport java.util.List;\n  public static double sumNumbers(List<?\
  \ extends Number> upperBoundList) {\n    double sum = 0;\n    for (Number num :\
  \ upperBoundList) {\n      sum += num.doubleValue(); // 安全是因为 Number 有 doubleValue()\n\
  \    }\n  }\n  public static void main(String[] args) {\n    List<Integer> intList\
  \ = List.of(1, 2, 3);\n    List<Double> doubleList = List.of(1.5, 2.5, 3.5);\n \
  \   System.out.println(sumNumbers(intList)); // 输出: 6.0\n    System.out.println(sumNumbers(doubleList));\
  \ // 输出: 7.5\n}\n```\n\n方法 `sumNumbers(List<? extends Number>)` 接收 `Number` 的任何子类的列表（`Integer`、`Double`\
  \ 等）。它遍历列表并使用 `doubleValue()` 求总和。\n\n\n```java\nimport java.util.List;\nimport\
  \ java.util.ArrayList;\n\n  public static void addIntegers(List<? super Integer>\
  \ lowerBoundedList) {\n    lowerBoundedList.add(10);\n    lowerBoundedList.add(20);\n\
  \    lowerBoundedList.add(30);\n    // lowerBoundedList.add(3.14); // 无法添加 Double\n\
  \  }\n  public static void main(String[] args) {\n    List<Number> numberList =\
  \ new ArrayList<>();\n    List<Object> objectList = new ArrayList<>();\n    addIntegers(numberList);\n\
  \    addIntegers(objectList);\n}\n```\n\n### 泛型应用于 Set<T>\n\n\n`Set<T>` 是一个不允许重复元素的集合。通过指定泛型类型\
  \ `T`，你可以创建防止意外类型匹配的强类型集合。\n\n让我们从一个简单的泛型集合示例开始：\n\nimport java.util.Set;\nimport\
  \ java.util.HashSet;\n\npublic class GenericSetExample {\n  public static void main(String[]\
  \ args) {\n    stringSet.add(\"item1\");\n    stringSet.add(\"item2\");\n  }\n}\n\
  ```\n\n\n\n\n```java\nstringSet.add(\"item3\");\nfor (String item : stringSet) {\n\
  \    System.out.println(item);\n}\n\n}\n}\n```\n\n`Set<String>` 确保了集合中只能存储 `String`\
  \ 类型的元素。尝试添加 `Integer` 将导致编译时错误。`for` 循环可以安全地迭代，不需要显式的类型转换。\n\n### 泛型集合中的通配符\n通配符在处理包含未知类型或相关类型的集合时提供了更大的灵活性。让我们通过示例来理解这一点：\n\
  \n-   **无界通配符 (`Set<?>`):** 当集合中元素的精确类型未知但我们仍需要从中读取数据时，无界通配符 (`?`) 非常有用。这通常用于对各种类型的集合进行操作且对其修改的泛型方法。\n\
  \n考虑以下示例。\n```java\nimport java.util.Set;\n\npublic class UnboundedWildcardSetExample\
  \ {\n    public static void printSet(Set<?> unboundedSet) {\n            System.out.println(element);\n\
  \        }\n    }\n}\n```\n该方法接受任何集合，无论其元素类型为何。由于类型未知，你无法在方法内部向集合中添加新元素。迭代使用 `object`\
  \ 进行，确保了在读取值时的类型安全。\n\n-   **上界通配符 (`Set<? extends T>`):** 上界通配符允许集合持有特定类型或其子类的元素。这在处理存储了对象层次结构的集合时非常有用。让我们看看它在实践中如何工作：\n\
  \n```java\nimport java.util.Set;\npublic class UpperBoundedWildcardSetExample {\n\
  \    public static void printAnimalSounds(Set<? extends Animal> upperBoundSet) {\n\
  \        for (Animal animal : upperBoundSet) {\n            animal.animalSound();\n\
  \        }\n}\n\nclass Animal {\n    void animalSound() {\n        System.out.println(\"\
  Some general animal sound\");\n}\n\nclass Dog extends Animal {\n    @Override\n\
  \    void animalSound() {\n    }\n}\n```\n\n通配符 `? extends Animal` 确保集合包含元素元素或任何子类（`Dog`、`Cat`\
  \ 等）。该方法遍历集合并调用 `animalSound()`，确保了每个子类都有正确的行为。你无法在方法内部添加新元素，因为在运行时具体的子类型是未知的。\n\
  -   **下界通配符 (`Set<? super T>`):** 下界通配符允许集合包含指定类型或其任何父类的元素。当你需要在确保最小类型约束的同时添加元素时，这特别有用。让我们通过示例来探索这一点：\n\
  \n```java\nimport java.util.Set;\n\npublic class LowerBoundedWildCardsetExample\
  \ {\n        employeeSet.add(new Manager(\"Manager1\"));\n        employeeSet.add(new\
  \ Manager(\"Manager2\"));\n    }\n}\n```\n通配符 `? super Manager` 确保集合可以持有 `Manager`\
  \ 或任何父类（`Employee`、`Person`）。你可以添加 `Manager` 元素，因为它是有效的子类型。获取元素受到限制，因为除了对象本身之外，精确类型是未知的。\n\
  \n## 将泛型应用于 Map<K,V>\n\n泛型在处理 Java 的 `Map` 接口时显著提高了类型安全性和灵活性。通过对 map 应用泛型，我们确保键和值都符合特定类型，减少了运行时错误和不必要的类型转换。本节探讨了泛型如何与\
  \ map 工作，包括通配符的使用、上界和下界。\n`Map<K, V>` 将类型为 `K` 的键与类型为 `V` 的值关联。通过指定泛型类型，我们创建了强类型的\
  \ map，防止意外的类型不匹配。\n\n让我们从一个泛型 `Map` 的简单示例开始：\n\n```java\nimport java.util.HashMap;\n\
  \npublic class GenericMapExample {\n    public static void main(String[] args) {\n\
  \        Map<Integer, String> genericEmployeeMap = new HashMap<>();\n        genericEmployeeMap.put(101,\
  \ \"Employee1\");\n        genericEmployeeMap.put(103, \"Employee3\");\n       \
  \ for (Map.Entry<Integer, String> entry : genericEmployeeMap.entrySet()) {\n   \
  \         System.out.println(\"ID: \" + entry.getKey() + \", Name: \" + entry.getValue());\n\
  \        }\n    }\n```\n\n`Map<Integer, String>` 确保了只能存储 `Integer` 键和 `String` 值。使用泛型防止了插入或检索元素时发生意外的类型不匹配。`for`\
  \ 循环安全地遍历条目，不需要显式的类型转换。\n\n### 泛型 map 中的通配符\n通配符在处理各种类型时使 map 更加灵活。让我们通过示例来理解这一点：\n\
  \n-   **无界通配符 (`Map<?, ?>`):** 无界通配符 (`?`) 允许 map 在不指定类型的情况下存储任何键值对。这对于不修改 map 的只读操作有用：\n\
  \n```java\nimport java.util.Map;\npublic class UnboundedWildcardExample {\n    public\
  \ static void printMap(Map<?, ?> unboundedMap) {\n        for (Map.Entry<?, ?> entry\
  \ : unboundedMap.entrySet()) {\n            System.out.println(\"Key: \" + entry.getKey()\
  \ + \", Value: \" + entry.getValue());\n        }\n}\n```\n\n`printMap` 方法接受任何 map，无论键或值的类型为何。由于类型未知，你无法添加新元素。迭代使用对象，确保了读取值时的类型安全。\n\
  \n\n```java\nimport java.util.Map;\nimport java.util.HashMap;\n\n    public static\
  \ void printEmployees(Map<? extends Number, ? extends Employee> map) {\n       \
  \ for (Map.Entry<? extends Number, ? extends Employee> entry : map.entrySet()) {\n\
  \            System.out.println(\"ID: \" + entry.getKey() + \", Name: \" + entry.getValue());\n\
  \        }\n    }\n\n        Map<Integer, Employee> employees = new HashMap<>();\n\
  \        employees.put(1, new Employee(\"Employee1\"));\n        employees.put(2,\
  \ new ProgramManager(\"Employee2\"));\n        printEmployees(employees);\n    }\n\
  \nclass Employee {\n    String empName;\n    int empId;\n    Employee(String name,\
  \ int id) {\n        this.empId = id;\n    }\n}\n\nclass ProgramManager extends\
  \ Employee {\n    ProgramManager(String name, int id) {\n    }\n}\n```\n\n通配符 `?\
  \ extends Number` 确保键类型为 `Number` 或其子类。通配符 `? extends Employee` 确保值是 `Employee`\
  \ 或任何子类。由于子类型未知，你无法在方法内部插入新元素。\n-   **下界通配符 (`Map<? super K, ? super V>`):** 下界通配符允许\
  \ map 存储指定类型或其任何父类的元素。当需要在确保最小类型约束的同时添加元素时，这非常有用：\n\n```java\nimport java.util.Map;\n\
  import java.util.HashMap;\npublic class LowerBoundedWildcardMapExample {\n    public\
  \ static void addEmployees(Map<? super Integer, ? super Employee> employeeMap) {\n\
  \        employeeMap.put(201, new Employee(\"Employee1\", 201));\n        employeeMap.put(202,\
  \ new ProgramManager(\"Employee2\", 202));\n    }\n    public static void main(String[]\
  \ args) {\n        Map<Number, Object> employees = new HashMap<>();\n        addEmployees(employees);\n\
  \        for (Map.Entry<Number, Object> entry : employees.entrySet()) {\n      \
  \      System.out.println(\"ID: \" + entry.getKey() + \", Value: \" + entry.getValue());\n\
  \        }\n}\n```\n\n\n\n\n通配符 `? super Integer` 确保 map 可以接受 `Integer` 或其任何父类（如\
  \ `Number`、`Object`）。通配符 `? super Employee` 确保值是 `Employee` 或其任何父类。你可以添加元素，但获取值时需要进行强制类型转换，因为在\
  \ `Object` 之外具体的类型是未知的。\n\n`main` 方法演示了如何使用 `Map<Number, Object>` 调用 `addEmployees`。\n\
  \n\n在 Java 集合（`List`、`Set` 和 `Map`）上使用泛型时，遵循最佳实践以确保类型安全并防止运行时错误至关重要。误用泛型可能会导致编译错误、类转换异常（`ClassCastException`）和意外行为等问题。\n\
  \n在下文中，我们将讨论一些常见的陷阱以及如何通过最佳实践避免它们：\n\n### 使用原始类型代替参数化类型\n*   **陷阱**：使用原始类型（即不带泛型参数的集合）会移除编译时的类型检查，增加了运行时出现\
  \ `ClassCastException` 的风险：\n    ```java\n    List namesList = new ArrayList();\
  \ // 原始类型，无类型安全\n    namesList.add(10); // 允许，但如果只期望 String 则是错误的\n    String name\
  \ = (String) namesList.get(0); // 抛出 ClassCastException\n*   **最佳实践**：为了强制类型安全，在声明集合时始终指定泛型类型。这确保了只有兼容的对象被添加，防止了运行时错误：\n\
  \    ```java\n    List<String> namesList = new ArrayList<>(); // 类型安全的集合\n    namesList.add(\"\
  Name1\"); // 允许\n    namesList.add(\"Name2\"); // 允许\n    ```\n\n### 向带有通配符的集合添加元素\n\
  \n*   **陷阱**：在使用上界通配符（`? extends T`）时，编译器禁止修改，因为它无法确定具体的子类型，会导致编译错误：\n    List<?\
  \ extends Number> numbers = new ArrayList<Integer>();\n    numbers.add(10); // 编译错误：无法添加元素\n\
  \    ```\n*   **最佳实践**：当你需要添加元素时，使用下界通配符（`? super T`），确保集合可以安全地接受预期的类型：\n    ```java\n\
  \    List<? super Integer> numbers = new ArrayList<>();\n    numbers.add(20); //\
  \ 允许\n    ```\n\n由此，我们得出一个关于对带有通配符的集合进行读写操作的清晰指南：\n\n*   写入元素时使用 `? super T`（确保你可以安全地插入值）。\n\
  \n### 误用上界和下界通配符\n\n*   **陷阱**：错误使用 `? extends T` 可能会导致无法添加元素：\n    List<? extends\
  \ Animal> animals = new ArrayList<Dog>();\n    animals.add(new Dog()); // 编译错误\n\
  \    ```\n*   **最佳实践**：如果你需要修改集合，使用下界通配符（`? super T`）来允许安全插入元素：\n    ```java\n \
  \   List<? super Dog> animals = new ArrayList<Animal>();\n    animals.add(new Bulldog());\
  \ // 如果 Bulldog 继承 Dog 则允许\n    ```\n\n这在处理泛型和通配符时提供了一条实用的经验法则：\n\n*   使用 `? super\
  \ T` 添加元素，同时限制可以检索的类型。\n\n### 在修改操作中使用无界通配符 (`?`)\n\n*   **陷阱**：无界通配符（`?`）使集合完全不感知类型，这意味着我们无法向其添加任何元素：\n\
  \    Set<?> set = new HashSet<Integer>();\n    set.add(5); // 编译错误：无法向通配符集合添加元素\n\
  \    ```\n*   **最佳实践**：无界通配符（`?`）使集合完全不感知类型，这意味着我们无法向其添加任何元素。在只需要读取而不需要修改时使用 `?`。如果需要修改，请使用特定的类型或\
  \ `? super T`：\n    ```java\n        for (Object element : set) {\n            System.out.println(element);\n\
  \        }\n    }\n    ```\n    *纠正对齐逻辑：*\n    在只需要读取而不需要修改时使用无界通配符。例如：\n    ```java\n\
  \    public static void printCollection(Set<?> set) {\n        for (Object element\
  \ : set) {\n            System.out.println(element);\n    ```\n\n### 在 map 中错误使用泛型\n\
  \n*   **陷阱**：错误地指定 map 的泛型类型会导致类型匹配错误：\n    Map<Object, String> map = new HashMap<Integer>();\n\
  \    ```\n*   **最佳实践**：为了维护类型安全并避免匹配，正确声明 `Map<K, V>`：\n    ```java\n    Map<Integer,\
  \ String> employeeMap = new HashMap<>();\n    employeeMap.put(102, \"Employee2\"\
  );\n    ```\n\n这引产生一个关于安全地读写 map 的通用原则：\n\n*   当从 map 中读取时，使用 `Map<?, ?>`。\n\n###\
  \ 误解不变性\n\n*   **陷阱**：泛型的一个常见误解是认为子类型关系会延续。然而，Java 泛型是不变的，这意味着 `List<Integer>` 不是\
  \ `List<Number>` 的子类型：\n    ```java\n    ```\n*   **最佳实践**：正确声明类型。\n\n## 泛型擦除\n\n\
  \n让我们了解擦除是如何工作的、它的影响以及如何处理这些局限性。\n\n考虑以下泛型类的示例：\n```java\npublic class TypeEraserExample<T>\
  \ {\n    public void set(T value) {\n        this.value = value;\n    }\n    public\
  \ T get() {\n        return value;\n}\n```\n\n编译后，类型擦除移除了泛型并将其转换为：\n```java\n  \
  \  private Object value;\n    public void set(Object value) {\n        this.value\
  \ = value;\n    }\n    public Object get() {\n        return value;\n}\n```\n\n\
  ### 类型擦除的影响\n\n\n*   **类型信息丢失**：在运行时，所有泛型的实例看起来都是相同的。例如：\n    ```java\n    List<String>\
  \ stringList = new ArrayList<>();\n    List<Integer> intList = new ArrayList<>();\n\
  \    ```\n两个列表看起来都是 `ArrayList` 的实例，没有任何类型区别。\n\n\n\n\n# 第 4 章 集合框架简介\n\n## 引言\n\
  \nJava 集合框架（Collections Framework）是 Java 开发工具包（JDK）中强大且至关重要的部分。它为表示和操作对象组提供了统一的架构。在集合框架出现之前，开发者必须依赖数组等临时数据结构，这往往导致代码难以维护和扩展。\n\
  想象一下，在没有结构化系统的情况下组织图书馆。书籍将散落在各地，使得寻找特定的标题变得极其困难。集合框架就像一个组织良好的图书馆系统，提供了多种具有定义接口的预实现数据结构，有助于实现高效的数据管理和操作。\n\
  \n## 结构\n\n本章涵盖了以下主题：\n\n*   集合层次结构\n*   `Collection` 接口\n*   集合中的关键方法\n*   `Iterable`\
  \ 接口与迭代器\n\n\n\n* 集合中的嵌套类\n* 包装类\n\n\n在本章结束时，你将对 `JCF` 有全面的理解，包括它的架构、核心接口以及它们之间的关系。这些基础知识将使你能够有效地处理不同的集合类型，并理解它们的优缺点和权衡。在随后的章节中，我们将讨论\
  \ `List`、`Set` 和 `Map` 的详细实现，为你的真实 Java 开发提供实用的见解。\n\n## Java 集合框架概述\n\n`JCF` 是一组接口和类，它们为存储和处理对象集合提供了统一的架构。它消除了开发者创建自定义数据结构需要，允许他们利用预构建的、优化的实现。\n\
  在 Java 2 之前，开发者使用数组和其他手动数据结构来存储和管理数据。然而，数组有几个局限性：\n\n* 大小固定（无法动态增长）\n* 没有内置的排序或搜索算法\n\
  * 在添加或删除元素时缺乏灵活性\n为了解决这些问题，`JCF` 提供了可调整且高效的数据结构，使得搜索、排序和迭代等操作变得更加简单。\n\n## 集合层次结构\n\
  \n`JCF` 是围绕一组接口和抽象类构建的。下图表示了它的层次结构：\n![一张显示 Java 集合框架层次结构的 UML 图，包含接口（Iterable,\
  \ Collection, List, Queue, Set, Map）以及它们的实现类（例如 ArrayList, HashSet, TreeMap）、关系和继承关系。](img/Figure_4.1.jpg)\n\
  \n图 4.1: 集合层次结构\n\n集合层次结构的关键接口有：\n\n* `List`: 一种有序的集合，允许重复元素（`ArrayList`, `LinkedList`）。\n\
  * `Set`: 不允许重复元素的集合（`HashSet`, `TreeSet`）。\n* `Queue`: 遵循先进先出（FIFO）原则的集合（`PriorityQueue`）。\n\
  * `Map`: 键值对的集合（`Hashtable`, `HashMap`, `TreeMap`）。\n\n\n## Collection 接口\n\n`collection`\
  \ 接口是 `JCF` 的根接口。它代表了一组对象（称为元素），是更专门的集合类型如 `List`、`Set` 和 `Queue` 的父接口。\n\n\n下表显示了\
  \ `collection` 和 `collections` 之间的区别：\n\n| 特性 | Collection | Collections |\n| :---\
  \ | :--- | :--- |\n| 包名 | `java.util.Collection` | `java.util.Collection` |\n| 目的\
  \ | 代表一组对象 | 提供操作集合的静态方法 |\n| 关键方法 | `add()`, `remove()`, `size()`, `iterator()`\
  \ | `sort()`, `reverse()`, `shuffle()`, `min()` |\n| 继承 | 由 `List`, `Set`, `Queue`\
  \ 扩展 | 无继承。它纯粹是一个辅助类。 |\n| 示例 | `Collection<String> names = new ArrayList<>(); names.add(\"\
  Ryan\"); names.add(\"Roger\");` | `Collections.sort((List<String>) names);` |\n\
  表 4.1: Collections 和 collection 的区别\n\n### collection 接口中的关键方法\n\n`collection` 接口为管理和操作元素提供了几个基本方法。让我们探索最常用的几个，并附带示例：\n\
  \n\n`add(E element)` 方法尝试将指定的元素插入集合中，如果集合被修改，则返回 true。接下来的示例演示了这种行为：\n\n```java\n\
  import java.util.ArrayList;\n\npublic class AddElementExample {\n  public static\
  \ void main(String[] args) {\n    Collection<String> names = new ArrayList<>();\n\
  \    names.add(\"Ryan\");\n    names.add(\"Roger\");\n    System.out.println(checkAddReturn);//\
  \ Output: true\n    System.out.println(names); // Output: [Ryan, Roger, Roger]\n\
  \  }\n}\n```\n在上面的示例中，`checkAddReturn` 的值为 true，因为集合在执行 `add` 操作后发生了变化。\n\n* `addAll(Collection<?\
  \ extends E> c)`: 将指定集合中的所有元素添加到当前集合中。\n\n接下来的示例展示了如何使用 `add(E element)` 方法更新集合并返回一个布尔值指示集合是否被修改：\n\
  ```java\nimport java.util.ArrayList;\nimport java.util.Collection;\n\npublic class\
  \ AddAllExample {\npublic static void main(String[] args) {\nfirstCollection.add(\"\
  Ryan\");\nCollection<String> secondCollection = new ArrayList<>();\nsecondCollection.add(\"\
  Roger\");\nsecondCollection.add(\"Royce\");\nfirstCollection.addAll(secondCollection);\n\
  System.out.println(secondCollection); // Output: [Ryan, Royce] // 注意：原文此处是 Ryan\n\
  }\n}\n```\n\n在上面的示例中，我们创建了两个集合并使用 `addAll` 方法将 `secondCollection` 添加到 `firstCollection`。\n\
  * `remove(Object element)`: 如果存在，则移除元素的单个实例。如果元素不存在，则方法返回 false。\n\n接下来的示例说明了当指定的元素存在于集合中以及不存在时，`remove(Object\
  \ element)` 方法的行为：\n\n```java\nimport java.util.Collection;\n\npublic class RemoveExample\
  \ {\n  public static void main(String[] args) {\n    Collection<String> names =\
  \ new ArrayList<>();\n    names.add(\"Roger\");\n    names.add(\"Royce\");\n   \
  \ System.out.println(names); // Output: [Ryan, Roger, Royce]\n    names.remove(\"\
  Ryan\");\n    System.out.println(names); // Output: [Roger, Royce]\n    boolean\
  \ result = names.remove(\"Roy\");\n    System.out.println(names); // Output: [Roger,\
  \ Royce]\n  }\n}\n```\n\n\n此外，对于基于哈希的集合（如 `HashMap`），正确运行于 `equals()` 和 `hashCode()`。我们将在后续关于\
  \ Map 的章节中详细讨论这一点。\n\n* `contains(Object element)`: 检查集合是否包含特定元素。\n\n\n```java\n\
  import java.util.ArrayList;\nimport java.util.Collection;\n\n  public static void\
  \ main(String[] args) {\n    Collection<String> names = new ArrayList<>();\n   \
  \ names.add(\"Ryan\");\n    names.add(\"Royce\");\n    System.out.println(names.contains(\"\
  Ryan\")); // Output: true\n    System.out.println(names.contains(\"Roger\")); //\
  \ Output: false\n}\n```\n\n\n\n\n在上面的示例中，`names.contains(Roger)` 返回 `false`，因为集合中不存在该名称。与\
  \ `remove` 方法类似，`contains` 方法使用 `equals()` 方法检查元素的相等性。如果集合中没有元素根据 `equals()` 与指定的元素匹配，则该方法返回\
  \ `false`。`collection` 接口的其他一些基础方法包括：\n\n* `int size();`: 返回元素数量\n* `void clear();`:\
  \ 移除所有元素\n\n这些方法构成了处理数据结构的核心，让你能够轻松地添加、删除和遍历元素。在随后的章节中，我们将探索这些方法在特定集合类型（如 `List`、`Set`\
  \ 和 `Map`）中的行为，每种类型都提供了独特的功能和优化。\n\n## 集合中的关键方法\n\n\n`Collections` 类包含各种静态方法，用于排序、搜索、查找最小/最大元素等任务。这些方法简化了复杂的操作，使开发人员无需编写自定义算法。让我们结合示例拆解一些最常用的方法：\n\
  \n### 排序列表\n排序是集合上最频繁的操作之一。`Collections.sort()` 方法按照自然顺序对元素进行排序（例如，字符串按字母顺序，数字按升序顺序）。\n\
  \n\n考虑以下示例：\n\n```java\nimport java.util.ArrayList;\nimport java.util.List;\n\n\
  public class SortExample {\n    public static void main(String[] args) {\n     \
  \   List<String> names = new ArrayList<>();\n        names.add(\"Zane\");\n    \
  \    names.add(\"Aiden\");\n        Collections.sort(names);\n        System.out.println(names);\
  \ // Output: [Aiden, Ryan, Zane]\n    }\n}\n\n在这里，我们创建了一个名称列表并使用 `Collections.sort()`\
  \ 按字母顺序对其排序。排序后的列表打印为 `[Aiden, Ryan, Zane]`。如果需要不区分大小写的排序，可以使用如下所示的 `String.CASE_INSENSITIVE_ORDER`：\n\
  \n```java\nCollections.sort(names, String.CASE_INSENSITIVE_ORDER);\n\n`String.CASE_INSENSITIVE_ORDER`\
  \ 是一个内置的 `Comparator<String>`，用于在忽略大小写的情况下比较字符串。\n\n不区分大小写的反排序可以如下所示实现：\n\n```java\n\
  ```\n\n排序有助于组织数据，使其更容易以结构化的格式进行搜索或显示。\n\n### 查找最大和最小元素\n\n考虑以下示例：\n\n```java\nimport\
  \ java.util.Arrays;\nimport java.util.List;\n\npublic class MaxMinExample {\n  \
  \  public static void main(String[] args) {\n        List<Integer> scores = Arrays.asList(85,\
  \ 90, 78, 88);\n        int maxScore = Collections.max(scores);\n        System.out.println(\"\
  Highest Score: \" + maxScore); // Output: 90\n        System.out.println(\"Lowest\
  \ Score: \" + minScore);  // Output: 78\n    }\n}\n```\n我们创建了一个分数列表并使用 `Collections.max()`\
  \ 和 `Collections.min()` 找到最高和最低分。当你需要快速确定集合中的边界值时，这些方法非常有用。\n\n### 随机洗牌元素\n`Collections.shuffle()`\
  \ 方法随机重排列表中的元素。这对于游戏或模拟等需要随机顺序的场景非常有帮助：\n\nimport java.util.ArrayList;\nimport java.util.Collections;\n\
  import java.util.List;\n\npublic class ShuffleExample {\n    public static void\
  \ main(String[] args) {\n        names.add(\"Ryan\");\n        names.add(\"Roger\"\
  );\n        names.add(\"Royce\");\n        Collections.shuffle(names);\n       \
  \ System.out.println(names); // Output: Random order of [Roger, Ryan, Royce]\n}\n\
  ```\n\n在这个示例中，我们向列表中添加了三个名称并使用 `Collections.shuffle()` 重新排序元素。每次运行程序时，顺序都是不同的。这对于卡牌游戏或从列表中随机选择元素等场景非常完美。\n\
  \n`Collections.reverse()` 方法反转列表中元素的顺序。当你想要反向遍历元素时，这个方法非常有用。\n\n考虑以下示例：\n\n```java\n\
  import java.util.ArrayList;\nimport java.util.List;\n\npublic class ReverseExample\
  \ {\n    public static void main(String[] args) {\n        List<String> names =\
  \ new ArrayList<>();\n        names.add(\"Roger\");\n        names.add(\"Royce\"\
  );\n        System.out.println(names); // Output: [Ryan, Roger, Royce]\n       \
  \ Collections.reverse(names);\n        System.out.println(names); // Output: [Royce,\
  \ Roger, Ryan]\n}\n```\n\n在这里，`Collections.reverse()` 反转了元素的顺序。列表 `[Ryan, Roger,\
  \ Royce]` 在反转后变为 `[Royce, Roger, Ryan]`。这在你需要反向处理元素时非常有用。\n\n### 用特定元素填充列表\n\n例如：\n\
  \n```java\npackage com.meennu.javbook.chap4;\nimport java.util.ArrayList;\nimport\
  \ java.util.Collections;\nimport java.util.List;\n\npublic class FillExample {\n\
  \        List<String> names = new ArrayList<>();\n        names.add(\"Ryan\");\n\
  \        names.add(\"Roger\");\n        names.add(\"Royce\");\n        System.out.println(names);\
  \ // Output: [Ryan, Roger, Royce]\n        Collections.fill(names, \"Unknown\");\n\
  \    }\n}\n```\n\n在这个示例中，`Collections.fill()` 将列表中的每个元素替换为 \"Unknown\"。这在需要重置集合或初始化默认值元素时非常有用。\n\
  理解 `Collections` 类是关重要的，因为它提供了现成的算法，可以节省时间并降低代码复杂性。这些方法抽象了实现细节，让你能够专注于更高层次的问题。\n\
  \n\n\n\n| `contains(Object o)` | `Collection` | 检查集合是否包含指定的元素。 | 否 | 验证元素是否存在 |\n\
  | `size()` | `Collection` | 返回集合中元素的数量。 | 否 | 获取元素计数 |\n| `isEmpty()` | `Collection`\
  \ | 检查集合是否为空。 | 否 | 当集合为空时执行条件逻辑 |\n| `clear()` | `Collection` | 移除集合中的所有元素。 | 是\
  \ | 重置集合 |\n| `sort(List<T> list)` | `Collections` | 按自然顺序对元素排序。 | 是 | 为搜索或显示组织数据\
  \ |\n| `sort(List<T> list, Comparator<? super T> c)` | `Collections` | 使用自定义比较器排序元素。\
  \ | 是 | 自定义排序，例如不区分大小的排序 |\n| `min(Collection<? extends T> coll)` | `Collections`\
  \ | 根据自然顺序返回最小的元素。 | 否 | 寻找最低分或最小值 |\n| `shuffle(List<?> list)` | `Collections`\
  \ | 随机重排列表中的元素。 | 是 | 为游戏或模拟提供随机化顺序 |\n| `reverse(List<?> list)` | `Collections`\
  \ | 反转列表中元素的顺序。 | 是 | 逆序处理元素 |\n| `fill(List<? super T> list, T obj)` | `Collections`\
  \ | 用指定的值替换列表中的所有元素。 | 是 | 初始化或重置所有列表值 |\n\n\n在下一节中，我们将探索 `Iterable` 接口以及迭代器如何提供遍历集合的强大方式，弥补集合操作与迭代之间的差距。\n\
  \n## Iterable 接口和迭代器\n\n我们使用集合来组织数据，使用迭代器来处理数据。`Iterable` 接口是 Java 中所有集合类的根接口。它代表可以逐个遍历的元素集合。Java\
  \ 中几乎所有的类都实现了此接口，允许你使用 for-each 循环和迭代器来遍历元素。\n`Iterable` 接口提供了 `iterator()` 方法，该方法返回一个\
  \ `Iterator` 对象，用于逐个遍历集合中的元素。\n\n理解迭代器可以确保你可以：\n\n- 顺序访问元素：一次移动一个元素。\n- 统一地处理各种集合类型：使用单一方法遍历\
  \ `Lists`、`Sets` 或 `Queues`。\n\n`Iterable` 接口仅包含一个方法，如下所示：\n\n```java\n    Iterator<T>\
  \ iterator();\n}\n```\n\n该方法返回一个 `Iterator` 对象，该对象提供了几个用于遍历集合的有用方法。`Iterator` 在不暴露其内部结构的情况下遍历集合的方法。\n\
  \n\n`Iterator` 接口提供了三个用于导航集合的主要方法：\n\n- `hasNext()`：如果集合还有更多元素，则返回 true。\n- `next()`：返回集合中的下一个元素。\n\
  \n让我们通过以下示例理解迭代：\n\n```java\nimport java.util.ArrayList;\nimport java.util.List;\n\
  \npublic class IteratorExample {\n    public static void main(String[] args) {\n\
  \        List<String> names = new ArrayList<>();\n        names.add(\"Ryan\");\n\
  \        names.add(\"Royce\");\n        Iterator<String> iterator = names.iterator();\n\
  \        System.out.println(\"Iterating through the list:\");\n        while (iterator.hasNext())\
  \ {\n            String name = iterator.next();\n            // 在迭代期间移除一个元素\n  \
  \          if (name.equals(\"Ryan\")) {\n                iterator.remove();\n  \
  \          }\n        }\n        System.out.println(\"\\nList after removal: \"\
  \ + names);\n}\n```\n\n输出是：\n```\nRyan\nRoger\nRoyce\n\nList after removal: [Roger,\
  \ Royce]\n```\n\n\n\n\n我们创建了一个包含元素的单例集合。如果你尝试向此集合添加另一个元素，将导致产生 `UnsupportedOperationException`。\n\
  当你想要将单个项目表示为集合时，可以使用单例集合。它对于默认值或常量元素非常有用。\n\n## 同步集合 (Synchronized collections)\n\
  \n如果你在多线程环境中工作，集合默认情况下不是线程安全的。`Collections` 类提供了这些方法，可以将集合包装在同步视图中：\n* `Collections.synchronizedList(List<T>\
  \ list)`\n* `Collections.synchronizedSet(Set<T> set)`\n* `Collections.synchronizedMap(Map<K,\
  \ V> map)`\n\n以下是创建一个同步列表的示例：\n\nimport java.util.ArrayList;\nimport java.util.Collections;\n\
  import java.util.List;\n\npublic class SynchronizedExample {\n        List<String>\
  \ names = Collections.synchronizedList(new ArrayList<>());\n        names.add(\"\
  Ryan\");\n        names.add(\"Roger\");\n        names.add(\"Royce\");\n       \
  \ // 在迭代期间进行同步\n            for (String name : names) {\n                System.out.println(name);\n\
  \            }\n        }\n        /*Output: \n        Ryan\n        Royce*/\n \
  \   }\n}\n```\n\n\n| 注意：你仍然需要手动对迭代进行同步（例如使用上面的 `synchronized` 块）。 |\n\n## 检查集合 (Checked\
  \ collections)\n\n\n让我们尝试创建一个检查列表：\n\n```java\nimport java.util.ArrayList;\nimport\
  \ java.util.List;\n\npublic class CheckedCollectionExample {\n    public static\
  \ void main(String[] args) {\n        List<String> names = Collections.checkedList(new\
  \ ArrayList<>(), String.class);\n        names.add(\"Ryan\");\n        // names.add(100);\
  \ // 这将抛出 ClassCastException\n        System.out.println(\"Checked List: \" + names);\n\
  \        //Output: Checked List: [Ryan]\n    }\n}\n\n检查集合增加了运行时安全检查，有助于在开发早期发现发现类型不匹配的\
  \ bug。\n\n## 不可变集合 (Immutable collections)\n\n从 Java 9 开始，你可以直接创建不可变集合：\n* `List.of()`\n\
  * `Set.of()`\n* `Map.of()`\n\n以下是一个创建一个不可变列表的示例：\n```java\nimport java.util.List;\n\
  \npublic class ImmutableCollectionExample {\n    public static void main(String[]\
  \ args) {\n        System.out.println(\"Immutable List: \" + names);\n        //Output:\
  \ Immutable List: [Ryan, Roger, Royce]\n        // 尝试添加错误的类型会导致运行时错误\n    }\n}\n\
  ```\n\n\n\n\n* `parseInt()`: 将字符串转换为整数。\n* `compareTo()`: 比较两个包装对象（返回负数、零或正数）。\n\
  \n虽然包装类非常强大，但它们也会带来一些开销：\n\n* 内存占用：包装类比基本数据类型消耗更多内存。\n* 空值：包装类可以为 `null`，这增加了灵活性，但也引入了\
  \ `NullPointerException` 的风险。\n在大多数情况下，其益处大于这些成本，特别是在处理集合（collections）时。\n\n包装类桥接了基本数据类型与\
  \ Java 面向对象特性之间的鸿沟。它们使得基本数据类型可以在集合中使用，并提供了实用的工具方法。理解包装类对于掌握 Java 集合至关重要，因为它们在实际应用中频繁出现。\n\
  \n## 结论\n在本章中，我们探索了 JCF（Java 集合框架），理解了它的架构、核心接口和基本方法。我们学习了集合如何简化数据管理，为存储、操作和遍历对象提供了灵活的方式。\n\
  \n我们讨论了 `collection` 和 `collections` 之间的区别、`Iterable` 接口的作用，以及迭代器（iterators）对于访问元素的重要性。嵌套类和包装类进一步扩展了框架的能力，增强了功能和兼容性。\n\
