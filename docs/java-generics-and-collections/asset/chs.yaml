  \n![QR-Logo](img/fm1.png)\n\n# 第 8 章 Queue 和 Deque 接口\n\n## 引言\n\n在现实应用中，任务通常按照它们到达的顺序进行处理，就像人们排队买电影票或打印机等待处理打印作业一样。这种自然的“先来服务”原则在\
  \ Java 中通过 `Queue` 接口进行建模。此外，为了更灵活的数据管理，Java 提供了双端队列（`Deque`）接口，允许从两端进行插入和删除。\n\n\
  本章将探索 Java 集合框架（JCF）中的这两个基本接口、它们的行为、典型用场景以及主要实现。我们还将探索内部结构、性能权衡以及并发安全的选项。\n\n##\
  \ 结构\n\n本章涵盖了以下主题：\n\n* `Queue` 接口\n* `PriorityQueue` 实现\n* `Deque` 接口\n* `ArrayDeque`\
  \ 实现\n* 作为队列的 `LinkedList`\n* Queue 和 Deque 中的同步\n\n## 目标\n\n在本章结束时，你将理解 `Queue`\
  \ 和 `Deque` 接口之间的基本区别和相似之处。能够根据插入或删除顺序、性能需求和并发需求选择合适的实现。此外，你将学习堆和环形缓冲区等内部结构如何支持这些数据结构，以及在实时应用中何时优先选择某种实现而非另一种。\n\
  \n## Queue 接口\n\nJava 中的 `Queue` 接口表示一个设计用于在处理前持有元素的集合。它遵循 FIFO（先进先出）原则，这意味着元素在末尾添加并从头部移除。\n\
  \n它是 `java.util` 包的一部分，并扩展了 `Collection` 接口，如下所示：\n\n```java\npublic interface Queue<E>\
  \ extends Collection<E>\n```\n\nJava 提供了 `Queue` 接口的多种实现，每种都适用于不同的用例：\n\n* `LinkedList`：实现了\
  \ `Deque`，可以用作队列或栈。它允许 null 元素且不是线程安全的。\n* `PriorityQueue`：按排序后的顺序（根据自然排序或自定义比较器）维护元素。它不遵循严格的\
  \ FIFO 规则。\n* `ArrayDeque`：队列操作中比 `LinkedList` 更快的替代方案。它不允许 null 元素。\n* `ConcurrentLinkedQueue`：一种线程安全的无锁实现，适用于并发环境。\n\
  \n### Queue 接口的特征\n\n以下是 `Queue` 的一些特征，有助于我们更好地理解它：\n\n* 元素按照它们添加的顺序被处理。\n* 它不像\
  \ `List` 那样允许随机访问。\n* 队列头部是调用 `remove()` 或 `poll()` 将移除的元素。\n* 队列尾部是添加新元素的地方。\n\n\
  `Queue` 接口引入了几个额外方法，如下所示：\n\n| 方法 |  |\n| :--- | :--- |\n| `add(E e)` | 将指定的元素插入队列。如果队列满了则抛出异常。\
  \ |\n| `offer(E e)` | 将元素插入队列。如果失败（例如队列满了）则返回 false。 |\n| `remove()` | 获取并移除头部。如果队列为空则抛出异常。\
  \ |\n| `poll()` | 获取并移除头部。如果队列为空则返回 null。 |\n| `element()` | 获取（但不移除）头部。如果队列为空则抛出异常。\
  \ |\n| `peek()` | 获取（但不移除）头部。如果队列为空则返回 null。 |\n\n表 8.1：Queue 接口中的额外方法\n\n为了理解队列在\
  \ Java 中的行为，让我们来看一个使用 `Queue` 接口及其常见实现 `LinkedList` 的简单示例。这有助于演示队列的 FIFO 特性。考虑以下代码：\n\
  \n```java\nQueue<String> queue = new LinkedList<>();\nqueue.add(\"Apple\");\nqueue.add(\"\
  Banana\");\nqueue.add(\"Cherry\");\nSystem.out.println(queue.poll());\nSystem.out.println(queue.peek());\n\
  System.out.println(queue.poll());\n```\n\n以下是输出结果：\n\n```\nApple\nBanana\nBanana\n\
  ```\n\n在例用例中：\n\n* 我们使用了带有 `LinkedList` 实现的 `Queue` 接口。`LinkedList` 是一个实现 `Queue`\
  \ 的常用类。\n* `add(\"Apple\")`、`add(\"Banana\")` 和 `add(\"Cherry\")` 按照元素到达的顺序插入队列；这就是\
  \ FIFO 行为。\n* `poll()` 获取并移除队列头部。由于 \"Apple\" 是先添加的，所以它被移除并打印。\n* `peek()` 获取但不移除队列头部。现在\
  \ \"Banana\" 位于前端，所以显示了它。\n* `poll()` 获取并移除队列头部。由于现在 \"Banana\" 位于前端，它被移除并打印。\n\n\
  此例示例突出了标准的队列操作：\n\n* 使用 `add()` 插入\n* 使用 `poll()` 移除并返回头部\n* 使用 `peek()` 查看头部而不移除\n\
  \n## PriorityQueue 实现\n\n`PriorityQueue` 是 JCF 的一部分，提供了一种基于优先级而非插入顺序来处理元素的有效方法。\n\
  \n以下是 `PriorityQueue` 的关键特征：\n\n* 不是 FIFO 队列：元素按优先级排序，而不是按添加的顺序排序。\n* 允许重复：你可以插入重复元素。\n\
  * 不允许 null 元素。\n* 不是线程安全的：如果被多个线程使用，则必须在外部进行同步。\n* 无界队列：根据需要增长。\n\n### PriorityQueue\
  \ 的内部结构\n\nJava 中的 `PriorityQueue` 使用二叉堆实现，二叉堆是一种完全树。元素存储在数组（`Object[]`）中，数组根据需要动态增长。最小堆是默认行为，这意味着最小元素始终位于堆的根（头部）。\n\
  \n在内部，使用了以下机制：\n\n* 元素被插入到一个基于数组的堆中。\n* 堆不是排序的，但其组织方式允许在 O(1) 时间内获取最小元素。\n* 插入和移除通过堆化操作（heapify\
  \ operations）维护堆属性：`siftUp()` 和 `siftDown()`。\n\n这里是 `PriorityQueue` 中 `add` 方法的基本示例：\n\
  \n```java\nObject[] queue;\nint size;\npublic boolean add(E e) {\n    if (e == null)\n\
  \        throw new NullPointerException();\n    int i = size;\n    if (i >= queue.length)\n\
  \        grow(); // 扩展数组\n    size = i + 1;\n    if (i == 0)\n        queue[0] =\
  \ e; // 直接添加第一个元素\n    else\n        siftUp(i, e); // 维护堆顺序\n    return true;\n\
  }\n```\n\n当在末尾添加元素时，如果它违反了堆属性，我们需要将其向上移动。`siftUp` 方法用于将元素移动到堆的正确位置：\n\n```java\n\
  private void siftUp(int k, E x) {\n    while (k > 0) {\n        int parent = (k\
  \ - 1) >>> 1; // 父节点索引\n        Object e = queue[parent];\n        if (compare(x,\
  \ e) >= 0)\n            break;\n        queue[k] = e; // 父节点向下移动\n        k = parent;\n\
  \    }\n    queue[k] = x; // 放置新元素\n}\n```\n\n`siftUp` 方法维护最小堆属性。新插入的元素会向上移动直到到达正确位置。\n\
  \n假设我们添加了以下元素：\n\n```java\nPriorityQueue<Integer> pq = new PriorityQueue<>();\n\
  pq.add(30);\npq.add(10);\npq.add(20);\n```\n\n内部发生了以下情况：\n\n* 最初，添加 30 后，堆所示：\n\n\
  ![一个带有黑框的浅蓝色矩形在中心用加粗黑色字体显示数字 30。 ](img/Figure_8.1.jpg)\n\n图 8.1：初始堆\n\n* 添加 10 后，由于\
  \ 10 小于 30，它们交换了位置。现在的堆所示。\n\n\n\n\n\n![一张包含两个浅蓝色矩形的图表：上方矩形包含数字 10，下方矩形包含数字 30，由一条对角线连接。](img/Image57575.jpg)\n\
  \n图 8.2：添加 10 后的堆\n\n* 在添加 20 之后，堆如如下所示。由于 `20` 大于 `10`，因此没有发生交换：\n\n![一个简单的树形图，顶部节点标记为\
  \ 10，向下分支到两个节点，左侧标记为 30，右侧标记为 20。](img/Image57583.jpg)\n\n图 8.3：添加 20 后的堆\n\n调用\
  \ `poll()` 时，`poll()` 会检索并移除头部元素（即 `最小堆` 中的最小元素），然后对堆进行重新排序。\n\n以下是 `poll` 方法的代码片段：\n\
  \n```java\npublic E poll() {\n    if (size == 0)\n        return null;\n    int\
  \ s = --size;\n    E result = (E) queue[0]; // 获取根节点（最小）\n    E x = (E) queue[s];\
  \ // 获取最后一个元素\n    queue[s] = null; // 清空最后一个槽位\n    if (s != 0)\n        siftDown(0,\
  \ x); // 恢复堆\n    return result;\n}\n```\n\n在上述 `poll()` 方法中，返回了 `result = 10`。索引\
  \ `0` 被最后一个元素 `queue[0] = 20` 替换。\n\n在 `poll()` 之后，从索引 `0` 调用了 `siftDown()` 以恢复堆。\n\
  \n以下是 `siftDown()` 方法的代码片段：\n\n```java\nprivate void siftDown(int k, E x) {\n  \
  \  int half = size >>> 1; // 此之下的节点是叶子节点\n    while (k < half) {\n        int left\
  \ = (k << 1) + 1; // 左孩子\n        int right = left + 1;\n        int smallest =\
  \ left;\n        Object c = queue[left];\n        if (right < size && compare((E)\
  \ queue[right], (E) c) < 0) {\n            smallest = right;\n            c = queue[right];\n\
  \        }\n        if (compare(x, (E) c) <= 0)\n            break;\n        queue[k]\
  \ = c; // 将较小的孩子向上移动\n        k = smallest;\n    }\n    queue[k] = x;\n}\n```\n\n\
  现在更新后的堆如下所示：\n\n![一张包含两个矩形的图表：右上角的矩形包含数字 20，左下角的矩形包含数字 30。一条对角线连接了这两个矩形。](img/Figure_8.4.png)\n\
  \n图 8.4：使用 `poll()` 移除 10 后的状态\n\n因此，基于数组的二叉堆是 `PriorityQueue` 的核心，插入和删除操作确保了优先级最高（最小）的元素始终位于顶部。\n\
  \n## Deque 接口\n\n在 Java 6 中引入的 `Deque` 接口表示一种支持插入和移除的线性集合（双端队列）。它允许在两端进行插入和移除操作。\n\
  \n`Deque` 既可以用作队列（Queue），也可以用作栈（Stack）。它比 `Stack` 类更高效，因为它不是同步的。\n\n`Deque` 接口在两端支持插入和移除，这在需要频繁双端操作的场景中非常有用。\n\
  \n### Deque 常用方法\n\n`Deque` 接口提供了多种方法，以下是常用的：\n\n| 方法 | 说明 |\n| :--- | :--- |\n\
  | `addFirst(e)` | 在头部插入元素 |\n| `addLast(e)` | 在尾部插入元素 |\n| `offerFirst(e)` | 在头部插入元素，如果失败则返回\
  \ false |\n| `offerLast(e)` | 在尾部插入元素，如果失败则返回 false |\n| `removeFirst()` | 移除并返回头部元素，如果为空抛出异常\
  \ |\n| `removeLast()` | 移除并返回尾部元素，如果为空抛出异常 |\n| `pollFirst()` | 移除并返回头部元素，如果为空则返回\
  \ null |\n| `pollLast()` | 移除并返回尾部元素，如果为空则返回 null |\n| `peekFirst()` | 获取头部元素但不移除\
  \ |\n| `peekLast()` | 获取尾部元素但不移除 |\n| `push(e)` | 在头部插入元素（栈操作） |\n| `pop()` | 移除并返回头部元素（栈操作）\
  \ |\n\n### 将 Deque 作为队列\n\n`Deque` 可以作为先入先出（FIFO）队列使用。考虑以下示例：\n\n```java\nDeque<String>\
  \ deque = new ArrayDeque<>();\n// 作为队列使用\ndeque.addLast(\"One\");\ndeque.addLast(\"\
  Two\");\nSystem.out.println(deque.pollFirst()); // One\nSystem.out.println(deque.pollFirst());\
  \ // Two\n```\n\n### 将 Deque 作为栈\n\n`Deque` 也可以作为后进先出（LIFO）栈使用。例如：\n\n```java\n\
  Deque<String> deque = new ArrayDeque<>();\n// 作为栈使用\ndeque.push(\"A\");\ndeque.push(\"\
  B\");\ndeque.push(\"C\");\nSystem.out.println(deque.pop()); // C\nSystem.out.println(deque.pop());\
  \ // B\n```\n\n\n\n\n让我们通过一个例子来理解这一点。考虑以下代码：\n\n```\nDeque<String> deque = new ArrayDeque<>();\n\
  deque.addFirst(\"C\");\ndeque.addLast(\"D\");\ndeque.addFirst(\"B\");\ndeque.addFirst(\"\
  A\"); // deque = [A, B, C, D]\nSystem.out.println(deque); // [A, B, C, D]\nSystem.out.println(deque.removeLast());\
  \ // D\nSystem.out.println(deque.removeFirst()); // A\nSystem.out.println(deque);\
  \ // [B, C]\n```\n\n以下是输出：\n\n[A, B, C, D]\nD\nA\n[B, C]\n\n以下是解释：\n\n*   执行 `addFirst(\"\
  C\")` 时，元素将如图所示。头部和尾指向同一个元素。\n\n![A diagram showing a box labeled C under the heading\
  \ elements, with two arrows pointing down labeled head and tail. ](img/Figure_8.5.png)\n\
  \n图 8.5：添加 C 后的 ArrayDeque\n\n*   执行 `addLast(\"D\")`，D 被添加到队列末尾，尾部现在指向 D，如图所示：\n\
  \n![A diagram showing a box split into two sections labeled C and D, with arrows\
  \ pointing to head under C and tail under D; elements is labeled on the left side.\
  \ ](img/Figure_8.6.png)\n\n图 8.6：添加 D 后的 ArrayDeque\n\n*   执行 `addFirst(\"B\")`，现在当\
  \ B 被添加到头部时，头部指向 B，arraydeque 如图所示：\n\n![A diagram of an array labeled elements\
  \ containing three boxes with B, C, and D. Head points to the leftmost box (B) and\
  \ tail to the rightmost box (D). ](img/Figure_8.7.png)\n\n图 8.7：添加 B 后的 ArrayDeque\n\
  \n*   执行 `addFirst(\"A\")`，在添加 A 后，头部现在指向 A，arraydeque 如下：\n\n![A horizontal array\
  \ with four boxes labeled A, B, C, and D. The left end (A) is labeled head and the\
  \ right end (D) is labeled tail. The entire array is labeled elements. ](img/Figure_8.8.jpg)\n\
  \n图 8.8：添加 B 后的 ArrayDeque（注：原文此处为添加 B，应为添加 A）\n\n*   执行 `removeLast()` 移除最后一个元素（D），arraydeque\
  \ 如图所示：\n\n![A horizontal array with three boxes labeled A, B, and C. The terms\
  \ head and tail point to A and C, respectively. The array is labeled elements on\
  \ the left. ](img/Figure_8.9.png)\n\n图 8.9：移除最后一个元素后的 ArrayDeque\n\n*   执行 `removeFirst()`\
  \ 移除第一个元素（A），arraydeque 中只剩下 B 和 C。arraydeque 如下：\n\n![A two-cell box labeled elements\
  \ contains B on the left and C on the right. Head points to B and tail points to\
  \ C. ](img/Figure_8.10.png)\n\n图 8.10：移除最后一个元素后的 ArrayDeque（注：原文此处为 removing last，应为\
  \ removing first）\n\n内部的缩容逻辑确保了即使我们在两端进行添加/删除，性能依然保持高效。\n\n### 构造函数\n\n以下是可用于创建\
  \ `ArrayDeque` 的构造函数：\n\n*   `ArrayDeque()`：初始容量为 16 的默认构造函数。如下所示创建：\n\n```\nArrayDeque<Integer>\
  \ deque1 = new ArrayDeque<>();\n```\n\n*   `ArrayDeque(int initialCapacity)`：创建一个具有给定容量的\
  \ deque，如下所示：\n\n```\nArrayDeque<String> deque2 = new ArrayDeque<>(50);\n```\n\n\
  *   `ArrayDeque(Collection<? extends E> c)`：构建包含指定集合元素的 deque，如下所示：\n\n```\nArrayDeque<Character>\
  \ deque3 = new ArrayDeque<>(List.of('A', 'B', 'C'));\n```\n\n`ArrayDeque` 是一个高效的双端队列实现，在两端进行添加/删除操作时优于\
  \ `LinkedList` 和 `Stack`。它没有 `capacity` 方法，但由于实现了 `Deque` 接口，因此可以作为栈使用（通过 `push`\
  \ 和 `pop` 方法）。\n\n### 注意\n\n`ArrayDeque` 的特点包括：\n\n*   它不是线程安全的。\n*   它不支持 `null`\
  \ 元素。\n*   在单线程环境下，它通常比 `Stack` 和 `LinkedList` 更快。\n*   它在两端进行操作时性能极佳。\n*   它没有\
  \ `capacity` 方法，但可以通过 `size()` 获取元素数量。\n\n\n\n\n选择合适的同步机制取决于具体的并发需求，例如是否需要阻塞行为，或者是否应该在不锁定整个结构的情况下支持并发读写。\n\
  \n一种常用方法是使用并发集合，如 `ConcurrentLinkedQueue` 或 `ConcurrentLinkedDeque`，它们是非阻塞的，允许多个线程进行高吞吐量访问。对于简单的场景或遗留代码库，可以使用\
  \ `Collections.synchronizedQueue()` 或 `Collections.synchronizedDeque()` 方法来封装现有的非线程安全实现并使其同步同步，尽管在高度竞争的情况下，这些方法的可扩展性通常较差。\n\
  \n对于需要生产者和消费者之间进行协调的用例，Java 提供了 `BlockingQueue` 和 `BlockingDeque` 接口。`ArrayBlockingQueue`、`LinkedBlockingQueue`\
  \ 和 `LinkedBlockingDeque` 等实现支持线程安全的操作，这些操作在队列满（插入时）或队列空（检索时）会发生阻塞。这些非常适合用于构建任务队列、消息传递系统或边界缓冲区。\n\
  \n现在，让我们详细探索这些替代方案和最佳实践，并结合演示它们在并发应用中有效使用的示例。\n\n### 使用并发集合\n\nJava 提供了以下内置的并发实现：\n\
  \n*   `ConcurrentLinkedQueue`：一种非阻塞、线程安全的 FIFO（先进先出）队列实现。\n*   `LinkedBlockingQueue`,\
  \ `ArrayBlockingQueue`：用于生产者-消费者场景的阻塞队列。\n*   `ConcurrentLinkedDeque`：非阻塞的双端队列实现。\n\
  \n这些类在内部处理同步，在并发设计中是首选。\n\n### 使用同步集合封装\n\n如果你在多线程环境中使用如 `LinkedList` 等非线程安全的类作为队列，你必须对访问进行同步以避免并发问题。Java\
  \ 了一了一个工具方法 `Collections.synchronizedList()`，它可以封装一个 `List`（可以用作队列）并使其线程安全。可以像所示所示：\n\
  \n```java\nQueue<String> queue = Collections.synchronizedList(new LinkedList<>());\n\
  \n// 在迭代期间显式同步\nsynchronized (queue) {\n    for (String item : queue) {\n      \
  \  System.out.println(item);\n    }\n}\n```\n\n以下是对上述示例的解释：\n\n*   `Collections.synchronizedList(...)`\
  \ 返回原始列表的线程安全包装器。\n*   但是，在迭代期间仍然需要手动同步，以避免 `ConcurrentModificationException`。\n\
  *   `synchronized (queue)` 块确保了迭代是原子的且不受线程干扰的。\n\n### BlockingQueue 和 BlockingDeque\n\
  \n当你需要线程等待插入或移除等操作时（例如在生产者-消费者场景中），Java 提供了 `BlockingQueue` 和 `BlockingDeque`。它们可以使用如下所示：\n\
  \n```java\nBlockingQueue<String> bQueue = new LinkedBlockingQueue<>();\n\nbQueue.put(\"\
  Data\"); // 放入元素；如果队列满则等待\nString val = bQueue.take(); // 检索并移除头部；如果为空则等待\nSystem.out.println(val);\
  \ // 输出: Data\n```\n\n以下是对上述示例的解释：\n\n*   `LinkedBlockingQueue` 是一个线程安全的、可选有边界的队列。\n\
  *   `put()` 在队列满时会阻塞线程；这对于生产者很有用。\n*   `take()` 在队列为空时会阻塞；这对于消费者很有用。\n*   这有助于管理背压并避免忙等。\n\
  \n在并发环境中使用队列和双端队列时，确保线程安全性是至关重要的。虽然像 `ArrayDeque` 和 `LinkedList` 等集合默认不是线程安全的，但\
  \ Java 提供了如同步包装器和如 `BlockingQueue`、`BlockingDeque` 等并发实现等机制。选择正确的方法取决于你需要的是基本的线程安全还是线程之间完全的协调（例如阻塞行为）。\n\
  \n### ArrayDeque vs. LinkedList vs. PriorityQueue\n\n下表了 `ArrayDeque`、`LinkedList`\
  \ 和 `PriorityQueue` 的比较：\n\n| 特性 | ArrayDeque | LinkedList (作为队列/Deque) | PriorityQueue\
  \ |\n| :--- | :--- | :--- | :--- |\n| 底层结构 | 可调整大小的数组 | 双向链表 | 最小堆（二叉堆） |\n| 允许空元素\
  \ | 不 | 允许 | 不 |\n| 排序 | 插入顺序 | 插入顺序 | 自然/比较器顺序 |\n| 性能 (添加或删除) | 快 (摊销 O(1)) |\
  \ 中等 (两端 O(1)) | O(log n) |\n| 线程安全 | 非线程安全 | 非线程安全 | 非线程安全 |\n| 阻塞支持 | 否 | 否 |\
  \ 否 |\n| 随机访问 | 否 | 否 | 否 |\n| 使用场景 | 栈/队列/双端队列（非线程） | 通用队列/双端队列 | 基于优先级的处理 |\n\n\
  表 8.4：ArrayDeque vs. LinkedList vs. PriorityQueue\n\n## 结论\n\n本章探索了基础的 `Queue` 和\
  \ `Deque` 接口及其在 JCF 中的主要实现。我们检查了 `Queue` 如何支持 FIFO 操作，而 `Deque` 如何支持从两端插入和移除。\n\n\
  如 `ArrayDeque`、`LinkedList` 和 `PriorityQueue` 等关键实现根据访问模式、性能和排序需求有不同的用途。此外，我们还看到如何使用封装器或如\
  \ `BlockingQueue` 等并发类引入同步以实现线程安全的操作。\n\n在下一章中，我们将探索 Java 的工具类，这些类为排序、搜索、修改以及同步集合和数组提供了内置支持。\n\
  \n## 练习\n\n1.  哪种方法向 `Queue` 的尾部添加元素并抛出异常？\n2.  哪种接口允许从两端插入和移除？\n3.  `PriorityQueue`\
  \ 使用的是什么排序？\n4.  哪种方法在队列为空时检索头部并返回 null？\n5.  在 `ArrayDeque` 中插入空元素会发生什么？\n6.  以下哪个方法不是\
  \ `Queue` 接口定义的？\n7.  实现不支持随机访问？\n8.  哪种实现最适合实现优先级调度器？\n9.  哪种接口允许 `addFirst()`\
  \ 和 `removeLast()` 方法？\n\n### 答案\n\n1.  c\n解释：`add()` 向尾部添加元素并在插入失败时抛出异常。\n2.  b\n\
  解释：`Deque` 支持从两端插入和移除。\n3.  c\n解释：`PriorityQueue` 使用自然排序，除非提供了比较器。\n4.  a\n解释：`poll()`\
  \ 在队列为空时返回 null。\n5.  b\n解释：`ArrayDeque` 不允许空元素并抛出 `NullPointerException`。\n6. \
  \ c\n解释：`push()` 是属于 `Deque` 的，不是 `Queue` 接口定义的。\n7.  d\n解释：`ArrayDeque` 支持随机访问。\n\
  8.  c\n解释：`PriorityQueue` 最适合实现优先级调度器。\n9.  d\n解释：`Deque` 提供了 `addFirst()` 和 `removeLast()`\
  \ 方法。\n\n\n\n\n\n说明：`PriorityQueue` 针对基于优先级的任务调度进行了优化。\n\n10. d\n\n说明：`Deque` 提供了\
  \ `addFirst()`、`removeLast()` 以及其他双端操作。\n\n## 加入我们的 Discord\n\n加入我们的 Discord 工作空间以获取最新更新、优惠、全球科技动态、新发布以及与作者的交流：\n\
