  2. `TreeMap`\n3. `HashMap`\n4. 以上均不是\n\n7. 哪种 Map 实现类最适合多线程在无外部同步的情况下进行并发访问？\n1.\
  \ `HashMap`\n2. `Hashtable`\n3. `TreeMap`\n4. `ConcurrentHashMap`\n\n8. 当 `HashMap`\
