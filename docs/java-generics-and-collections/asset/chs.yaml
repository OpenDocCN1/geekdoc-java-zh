  \n![QR-Logo](img/fm1.png)\n\n# 第 7 章 Set 接口及其实现\n\n## 引言\n\n在 Java 中，`Set` 是一个不包含重复元素的集合。与维护插入顺序并允许重复的\
  \ `List` 不同，`Set` 侧重于唯一性和高效查找。当我们想要存储一组不同的项目（例如用户 ID、唯一令牌或配置键/键）时，通常会使用 `Set`。Java\
  \ 提供了 `Set` 接口的多种实现，每种实现都具有不同的内部行为和性能特征。\n\n在本章中，我们将探索 `Set` 接口的核心概念、其主要实现类：`HashSet`、`LinkedHashSet`\
  \ 和 `TreeSet`，以及实际案例、内部实现细节、自定义实现示例和比较。我们还将涵盖性能考虑、同步策略以及专门针对 Set 的泛型算法。\n\n## 结构\n\
  \n本章涵盖了以下主题：\n\n* `Set` 接口\n* `HashSet` 实现\n* `LinkedHashSet` 实现\n* `TreeSet` 实现\n\
  * 性能考虑\n* Set 中的同步\n* Set 的泛型算法\n\n## 目标\n\n在本章结束时，你将理解 Java 中 `Set` 接口是如何工作的，包括它的主要实现类以及它们之间的区别。你将深入了解各种\
  \ Set 类型使用的内部数据结构，并根据需求了解何时使用每种。此外，你将学习如何创建自己的 `Set` 实现，理解线程安全的细微差别，并探索 Java 如何提供工具来有效操作和处理\
  \ Set。这些基础知识将帮助你编写更健壮、高效的 Java 程序。\n\n## Set 接口\n\nJava 中的 `Set` 接口是 `java.util`\
  \ 包的一部分，并扩展了集合 接口。它定义了一个不允许重复元素的集合。如果你尝试添加重复元素，集合只会简单地忽略它并保留一个实例。\n\n由于 `Set` 是一个接口，因此不能直接实例化。相反，我们使用它的具体实现类之一，如\
  \ `HashSet`、`LinkedHashSet` 或 `TreeSet`。\n\n以下是 Set 的主要特征：\n\n* 无重复性：每个元素必须是唯一的。\n\
  * 无保证顺序：在大多数实现（如 `HashSet`）中，元素的顺序不会被保留。\n* null 元素：大多数 Set 实现都允许单个 null 元素。\n\n\
  `Set` 接口扩展了集合接口并引入了几个额外方法，如下表所示：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `add(E e)` |\
  \ 如果元素不存在则添加 |\n| `addAll(Collection<? extends E> c)` | 添加另一个集合的所有元素 |\n| `remove(Object\
  \ o)` | 如果存在则删除指定的元素 |\n| `contains(Object o)` | 如果元素存在则返回 true |\n| `size()` |\
  \ 返回集合中元素的数量 |\n| `isEmpty()` | 如果集合为空则返回 true |\n| `clear()` | 集合集合所有元素 |\n| `iterator()`\
  \ | 返回集合中元素的迭代器 |\n\n表 7.1：Set 接口的额外方法\n\n下图是实现 Set 接口的主要类的视觉概览：\n\n![显示 Java 类的\
  \ UML 图。Set 接口被 SortedSet 和 HashSet 扩展。SortedSet 被 NavigableSet 扩展，后者被 TreeSet 扩展。HashSet\
  \ 被 LinkedHashSet 扩展。](img/Figure_7.1.jpg)\n\n图 Set：接口与实现\n\n## HashSet 实现\n\n`HashSet`\
  \ 是 Set 接口最常用的实现之一。它由 `HashMap` 支持，这意味着 `add`、`remove` 和 `contains` 等操作在内部都委托给了\
  \ map 结构。\n\n以下是关键特征：\n\n* 不允许重复元素。\n* 允许一个 null 元素。\n* 不保证元素的顺序。\n* 不是同步的。\n* 假设哈希函数良好，基本操作（`add`、`remove`、`contains`）允许常数时间性能。\n\
  \n### HashSet 的内部结构\n\n在内部，`HashSet` 只是 `HashMap` 的一个器。当你向 `HashSet` 添加元素时，它被作为内部\
  \ map 的键存储，所有的值都使用常量虚拟值（如 `PRESENT`）。\n\n让我们通过示例来理解这一点：\n\n```java\nSet<String>\
  \ set = new HashSet<>();\nset.add(\"Apple\");\nset.add(\"Banana\");\nset.add(\"\
  Apple\"); // 重复，会被忽略\nSystem.out.println(set); // 输出可能是 [Apple, Banana]，顺序可能会变化\n\
  ```\n\n在内部，它的存储如下：\n\n```java\nMap<String, Object> map = new HashMap<>();\nstatic\
  \ final Object PRESENT = new Object();\nmap.put(\"Apple\", PRESENT);\nmap.put(\"\
  Banana\", PRESENT);\nmap.put(\"Apple\", PRESENT); // 覆盖相同的键，不会添加新条目\n```\n\n\n\n\
  \n\n当添加像\"Apple\"这样的元素时，`HashMap` 会使用 `\"Apple\".hashCode()` 计算哈希值，该值决定了合适的桶索引并据此放置键值对。这种机制基于第\
  \ 6 章 `Map` 接口及其实现中讨论的哈希原理。在出现重复元素的情况下，当你向 `HashSet` 中添加元素时，会使用元素的 `hashCode()`\
  \ 方法计算哈希值。该哈希值用于查找桶（内部数组中的索引）。如果该桶已存在相同哈值的条目，它将使用 `equals()` 方法检查相等性。如果哈希值和 `equals()`\
  \ 都匹配，则认为新元素是重复的，不再添加。\n\n### HashSet 中的构造函数\n\nJava 在 `HashSet` 类中提供了几个构造函数，以在初始化时提供灵活性，具体取决于用例和性能需求：\n\
  \n* `HashSet()`：创建一个具有默认初始容量 (16) 和负载因子 (0.75) 的空 `HashSet`。\n* `HashSet(int initialCapacity)`：创建一个具有指定初始容量的\
  \ `HashSet`。当预知元素数量以减少重哈时非常有用。\n* `HashSet(int initialCapacity, float loadFactor)`：允许同时设置初始容量和负载因子以精调性能。\n\
  * `HashSet(Collection<? extends E> c)`：构造一个包含给定集合中所有元素的 `HashSet`。重复元素会被删除。\n\n\
  ### LinkedHashSet 实现\n\n`LinkedHashSet` 是 `HashSet` 的子类，它维护了元素的插入顺序。在内部，它使用双向链表配合哈希表。这种组合确保了元素按照它们被添加的顺序存储，同时仍然提供了快速访问。\n\
  \n让我们来看一个简单的示例：\n\n```java\nSet<String> names = new LinkedHashSet<>();\nnames.add(\"\
  Alex\");\nnames.add(\"Brian\");\nnames.add(\"Clara\");\nSystem.out.println(names);\
  \ // 输出: [Alex, Brian, Clara]\n```\n\n尽管它是一个集合且不允许重复，但它仍然保留了元素插入的顺序。\n\n### LinkedHashSet\
  \ 的内部结构\n\n`LinkedHashSet` 按照元素插入的顺序维护一个条目的链表。在内部，它构建在 `LinkedHashMap` 之上，后者结合了：\n\
  \n* 哈希表（用于 `add`、`remove` 和 `contains` 等基本操作的常数时间性能）。\n* 双向链表（用于维护插入顺序）。\n\n添加到\
  \ `LinkedHashSet` 的每个元素都存储在内部 `LinkedHashMap` 的键中。与每个键关联的值是一个常量虚拟对象（通常为 `PRESENT`）。\n\
  \n当添加元素时，会计算该元素的哈希值。如果它已经不存在，则会将哈希值添加到哈希表中。会创建一个节点，该节点还连接到插入顺序中的上一个节点和下一个节点。\n\n\
  假设我们按照以下顺序添加元素：\n\n```java\nSet<String> items = new LinkedHashSet<>();\nitems.add(\"\
  A\");\nitems.add(\"B\");\nitems.add(\"C\");\n```\n\n在内部，条目使用双向链表按照它们的插入顺序进行链接。该结构维护了指向第一个（头）条目的引用，如图所示：\n\
  \n![带有三个节点的双向链表图](img/Figure_7.2.jpg)\n\n图 7.2：LinkedHashSet 内部结构\n\n每个条目指向插入顺序中的后一个和前一个节点。`LinkedHashSet`\
  \ 具有快速查找（类似于 `HashSet`）和有序迭代可预测性（类似于 `List`）的优点。\n\n### LinkedHashSet 中的构造函数\n\n\
  `LinkedHashSet` 类提供了几个构造函数，允许开发者创建具有不同初始设置的实例：\n\n* `LinkedHashSet()`：创建一个具有默认初始容量\
  \ (16) 和负载因子 (0.75) 的空 `LinkedHashSet`。\n* `LinkedHashSet(int initialCapacity)`：创建一个具有指定初始容量的空\
  \ `LinkedHashSet`。\n* `LinkedHashSet(int initialCapacity, float loadFactor)`：创建一个具有指定初始容量和负载因子的\
  \ `LinkedHashSet`。\n* `LinkedHashSet(Collection<? extends E> c)`：创建一个包含给定集合中所有元素的\
  \ `LinkedHashSet`。如果你想优化内存使用或性能。\n\n以下是一个演示不同 `LinkedHashSet` 构造函数的简单示例：\n\n```java\n\
  import java.util.*;\n\npublic class LinkedHashSetExamples {\n    public static void\
  \ main(String[] args) {\n        // 使用默认构造函数\n        LinkedHashSet<String> set1\
  \ = new LinkedHashSet<>();\n        set1.add(\"Apple\");\n        set1.add(\"Banana\"\
  );\n\n        // 使用初始容量构造函数\n        LinkedHashSet<String> set2 = new LinkedHashSet<>(20);\n\
  \        set2.add(\"Cherry\");\n\n        // 使用初始容量和负载因子\n        LinkedHashSet<String>\
  \ set3 = new LinkedHashSet<>(10, 0.5f);\n        set3.add(\"Date\");\n\n       \
  \ // 使用集合\n        List<String> list = Arrays.asList(\"Sugarcane\", \"Fig\", \"\
  Grape\");\n        LinkedHashSet<String> set4 = new LinkedHashSet<>(list);\n\n \
  \       System.out.println(\"Set1: \" + set1);\n        System.out.println(\"Set2:\
  \ \" + set2);\n        System.out.println(\"Set3: \" + set3);\n        System.out.println(\"\
  Set4: \" + set4);\n    }\n}\n```\n\n输出为：\nSet1: [Apple, Banana]\nSet2: [Cherry]\n\
  Set3: [Date]\nSet4: [Sugarcane, Fig, Grape]\n\n这个示例展示了如何使用所有构造函数，并且可以看到插入顺序被保留了。\n\
  \n## TreeSet 实现\n\n与使用哈希的 `HashSet` 和 `LinkedHashSet` 不同，`TreeSet` 是基于自平衡二叉树的 `NavigableSet`\
  \ 实现。\n\n以下是关键特性：\n\n* 排序：元素根据自然顺序或创建时提供的 `comparator` 自动排序。\n* 无重复：像所有集合一样，`TreeSet`\
  \ 不允许重复元素。如果添加重复元素，它们将被忽略。\n* 性能：由于树平衡，`add()`、`remove()` 和 `contains()` 操作的时间复杂度为\
  \ O(log n)。\n* 空值处理：如果使用自然排序（`Comparable`），`TreeSet` 不允许空元素；这样做会导致 `NullPointerException`。\n\
  * 非安全：对于并发访问，应外部使用 `Collections.synchronizedSet()` 进行同步。\n\n### TreeSet 的内部结构\n\n\
  `TreeSet` 是 `Set` 接口的一种实现，它按顺序存储元素。在内部，它由 `TreeMap` 支撑，这意味着 `TreeSet` 中的所有元素都存储在\
  \ `TreeMap` 的键中。该映射的值只是虚拟对象。\n\n为了更好地理解 `TreeSet` 的工作原理，考虑以下简单示例：\n\n```java\nTreeSet<Integer>\
  \ numbers = new TreeSet<>();\nnumbers.add(20);\nnumbers.add(10);\nnumbers.add(30);\n\
  ```\n\n因此，`TreeSet` 不直接存储元素。相反，它使用 `TreeMap` 的键来存储元素，同时为所有键分配一个虚拟值（`PRESENT`）。\n\
  \n\n\n\n\n当我们调用 `numbers.add(20);` 时，它内部调用了 `map.put(20, PRESENT)`。由于 map 是空的，`20`\
  \ 被添加为底层红黑树的根节点。当我们调用 `numbers.add(10);` 时，它会将 `ten` 与根节点（`20`）进行比较。由于 `10 < 20`，它被放置为\
  \ `20` 的左孩子。树可能会进行重平衡，但在这个小示例中，可能不需要重平衡。最后，当调用 `numbers.add(30);` 时，它将 `30` 与 `20`\
  \ 进行比较。由于 `30 > 20`，它被放置为 `20` 的右孩子。\n\n底层的红黑树现在包含三个节点，如图所示：\n\n![一个二叉树图，根节点 Key:\
  \ 20, Value: PRESENT，左孩子 Key: 10, Value: PRESENT，右节点 Key: 30, Value: PRESENT。所有其他子节点均标记为\
  \ null。](img/Figure_7.3.jpg)\n\n图 7.3 `TreeSet` 内部表示\n\n这些元素通过树形结构自动进行排序和平衡。\n\n\
  ### TreeSet 元素的符合性要求\n\n在将元素添加到 `TreeSet` 之前，它必须满足某些标准，以确保集合能够保持其排序顺序并避免不一致，如下所示：\n\
  \n- 必须是可比较的或提供 `Comparator`：`TreeSet` 使用自然排序（`Comparable`）或自定义的 `Comparator` 对元素进行排序。\n\
  \n元素必须实现 `Comparable<T>`，或者在通过构造函数时传入 `Comparator<T>` 进行插入。\n\n如果两者均未提供，添加元素将导致：\n\
  \n```\njava.lang.ClassCastException: class X cannot be cast to class java.lang.Comparable\n\
  ```\n\n- 必须是相互可比较的：同一个 `TreeSet` 中的所有元素之间必须是可以比较的。\n\n```java\nTreeSet<Object> set\
  \ = new TreeSet<>();\nset.add(\"abc\"); // OK\nset.add(100); // 运行时抛出 ClassCastException\n\
  ```\n\n- 不得为 null：使用自然排序的 `TreeSet` 不能包含 `null`，因为 `null` 无法与非空元素进行比较。尝试添加 `null`\
  \ 将抛出 `NullPointerException`。\n\n### TreeSet 中的构造函数\n\n`TreeSet` 类提供了几个构造函数，以不同的方式创建排序集合：\n\
  \n- `TreeSet()`：创建一个空的 `TreeSet`，根据元素的自然排序（即使用 `Comparable`）对元素进行排序。\n\n- `TreeSet(Collection<?\
  \ extends E> c)`：构建一个包含给定集合元素的 `TreeSet`，并按自然排序进行排序。\n\n- `TreeSet(Comparator<?\
  \ super E> comparator)`：创建一个空的 `TreeSet`，使用指定的 `Comparator` 进行排序。\n\n- `TreeSet(SortedSet<E>\
  \ s)`：构建一个与指定的 `SortedSet` 具有相同元素和顺序 `TreeSet`。\n\n### TreeSet 中的常用方法\n\n下表显示了 `TreeSet`\
  \ 可的一些常用方法：\n\n| 方法 |  |\n| :--- | :--- |\n| `first()` | 返回最小元素（根据集合的排序顺序）。 |\n\
  | `last()` | 返回最大元素。 |\n| `ceiling(E e)` | 返回大于等于 e 的最小元素，如果不存在此类元素则返回 `null`。 |\n\
  | `floor(E e)` | 返回小于等于 e 的最大元素，如果不存在此类元素则返回 `null`。 |\n| `higher(E e)` | 返回大于 e\
  \ 的最小元素，如果不存在此类元素则返回 `null`。 |\n| `lower(E e)` | 返回小于 e 的最大元素，如果不存在此类元素则返回 `null`。\
  \ |\n| `pollFirst()` | 获取并移除第一个（最小）元素。 |\n| `pollLast()` | 获取并移除最后一个（最大）元素。 |\n\
  | `descendingSet()` | 返回元素的反序视图。 |\n| `descendingIterator()` | 返回一个反序的迭代器。 |\n|\
  \ `subSet(E from, E to)` | 返回从 `from`（包含）到 `to`（不包含）的元素视图。 |\n| `headSet(E to)`\
  \ | 返回小于 `to` 的元素视图。 |\n| `tailSet(E from)` | 返回大于或等于 `from` 的元素视图。 |\n\n表 7.2：`TreeSet`\
  \ 中的额外方法\n\n### HashSet、LinkedHashSet 和 TreeSet 的比较\n\n现在我们已经分别探索了主要的 Set 实现：`HashSet`、`LinkedHashSet`\
  \ 和 `TreeSet`，让我们对它们进行对比比较。这种比较将突出顺序、性能和内部结构等关键差异，为在何时使用每种实现提供更清晰的视角。参考下表：\n\n|\
  \ 特性 | HashSet | LinkedHashSet | TreeSet |\n| :--- | :--- | :--- | :--- |\n| 顺序\
  \ | 无保证顺序 | 保持插入顺序 | 保持自然或指定的顺序 |\n| 底层数据结构 | 哈希表 | 哈希表 + 链表 | 红黑树（自平衡二叉树） |\n|\
  \ Null 元素 | 允许一个 null | 允许一个 null | 不允许 null（基于比较器的集合抛出 `NullPointerException`）\
  \ |\n| 性能（基本操作） | O(1) 平均时间 | O(1) 平均时间 | add、remove 和 contains 操作的时间为 O(log n)\
  \ |\n| 排序元素 | 否 | 否 | 是 |\n| 保留插入顺序 | 否 | 是 | 否（由排序顺序代替） |\n| 线程安全 | 非线程安全 | 非线程安全\
  \ | 非线程安全 |\n| 使用场景 | 顺序不重要 | 插入顺序很重要 | 需要排序数据 |\n\n表 7.3：`HashSet`、`LinkedHashSet`\
  \ 和 `TreeSet` 的比较\n\n### Java 8 对 Set 的增强\n\nJava 8 对 `Set` 接口及其实现进行了一些重要的更新，在 API\
  \ 可用性和性能方面。以下是所做的增强：\n\n- `Set` 接口中的默认方法：从 Java 8 开始，接口可以拥有默认和静态方法。\n\n`Set`（及其继承的\
  \ `Collection`）现在包含以下默认方法：\n\n`forEach(Consumer<? super E> action)`：该方法可以使用 Lambda\
  \ 表达式或方法引用遍历元素。\n\n```java\nSet<String> names = new HashSet<>();\nnames.add(\"Alice\"\
  );\nnames.add(\"Bob\");\nnames.forEach(System.out::println);\n```\n\n`removeIf(Predicate<?\
  \ super E> filter)`：移除所有满足给定条件的元素。例如：\n```java\nnames.removeIf(name -> name.startsWith(\"\
  A\"));\n```\n\n- 通过 `Collection.stream()` 和 `Collection.parallelStream()`  Stream\
  \ 方法：这些使得函数式操作成为可能。\n\n```java\nnames.stream()\n  .filter(name -> name.length()\
  \ > 3)\n  .forEach(System.out::println);\n```\n\n- `HashSet` 中改进冲突的处理：Java 中的 `HashSet`\
  \ 由 `HashMap` 支撑，`HashMap` 根据哈希码将元素存储在桶中。有时，两个或多个元素产生相同的桶索引；这被称为哈希冲突。\n\n    - Java\
  \ 8 之前：相同桶中的所有元素以单链表的形式连接。在最坏情况下（当所有元素落在同一个桶时），查找、插入和删除的操作从 O(1) 平均时间下降到 O(n)。\n\
  \n    - Java 8 改进：如果单个桶变得过于拥挤（超过 8 个元素），该桶的链表将被替换为平衡的红黑树。这一过程被称为树化。通过树化，最坏情况下的查找时间从\
  \ O(n) 提高到 O(log n)，使得在冲突多时性能更具可预测性。\n\n- 改进的重哈：Java 8 优化了调整 `HashSet` 等哈希集合大时的重哈过程。\n\
  \n它不是从头重新计算哈希码，而是使用位运算来更有效地重新分配元素，改进了调整大小操作的性能。\n\n\n\n\n\n- `TreeSet`: 由 `TreeMap`\
  \ 支持，由于它使用了红黑树，因此对于大多数操作（如 `add()`、`remove()`、`contains()`）都提供了 `O(log n)` 的时间复杂度。这使得它比\
  \ `HashSet` 慢，但在需要有序排列时非常合适。\n- `Iteration`: 遍历 `HashSet` 或 `LinkedHashSet` 的速度通常比遍历\
  \ `TreeSet` 快，因为后者需要维护顺序。\n- `Memory usage`: `TreeSet` 消耗的内存比 `HashSet` 和 `LinkedHashSet`\
  \ 多，因为存在树形结构和额外的指针。\n\n## Set 中的同步\n\n默认情况下，`Set` 接口的实现（如 `HashSet`、`LinkedHashSet`\
  \ 和 `TreeSet`）不是线程安全的。这意味着如果多个线程并发访问一个集合且至少有一个线程对其进行修改，你必须手动进行同步，以避免不可预测的行为。\n\n\
  为了使集合同步化，Java 在 `Collections` 类中提供了实用方法 `synchronizedSet`，如下所示：\n\n```java\nSet<String>\
  \ set = Collections.synchronizedSet(new HashSet<>());\n```\n\n这会将原始集合封装为线程安全的版本。虽然\
  \ `add()` 或 `remove()` 等操作是同步的，但对集合进行迭代仍然需要手动的同步块，如下所示：\n\n```java\nSet<String>\
  \ set = Collections.synchronizedSet(new HashSet<>());\n\nsynchronized (set) {\n\
  \    for (String item : set) {\n        // 安全迭代\n    }\n}\n```\n\n这是因为 `iterator`\
  \ 本身并不是同步的。如果没有封装在同步块中，并发修改可能会导致 `ConcurrentModificationException`。\n\n在现代并发环境中（具有多核处理器），通常有选择提供线程安全和可扩展性的集合实现。Java\
  \ 提供了专门的并发集合实现，例如：\n\n- `ConcurrentSkipListSet`（一种并发且排序的集合）：它是 `TreeSet` 的可扩展、线程安全的替代方案，内部基于跳表。\n\
  - `CopyOnWriteArraySet`：最适合频繁读取和低频率写入的集合。它在每次修改时都会创建底层数组的新。\n\n## 用于 Set 的泛型算法\n\
  \nJava 通过 `Collections` 工具类提供了丰富的泛型算法，这些算法可以作用于任何类型的 `Set`，使得代码更具重用性且简洁。这些算法不需要对\
  \ `Set` 接口进行任何更改，但提供了可以直接应用于集合的强大操作：\n\n- `Collections.unmodifiableSet(Set<? extends\
  \ T> s)`：创建给定集合的只读视图。任何修改返回集合的尝试都会导致异常，如下所示所示：\n\n```java\nSet<String> original\
  \ = new HashSet<>();\noriginal.add(\"apple\");\nSet<String> unmodifiable = Collections.unmodifiableSet(original);\n\
  unmodifiable.add(\"banana\"); // 抛出 UnsupportedOperationException\n```\n\n当你想要与其它代码共享集合但不允许其修改时，这种方法非常有用，例如暴露类的内部数据。\n\
  \n- `Collections.synchronizedSet(Set<T> s)`：使用同步机制封装给集合，使其可以在多个线程间安全使用，如下所示：\n\n\
  ```java\nSet<Integer> set = Collections.synchronizedSet(new HashSet<>());\nset.add(1);\n\
  set.add(2);\n```\n\n当你从多个线程访问集合时，使用此方法以避免并发问题。\n\n| 注意：在迭代期间你仍需手动进行同步。 |\n\n- 使用流进行\
  \ Set 操作：`Collectors` 类提供了 `toSet()` 方法，将流操作的最终结果收集为 `Set`。\n\n例如，两个集合中的公共元素可以收集到一个集合中，如下所示：\n\
  \n```java\nSet<Integer> set1 = new HashSet<>(List.of(1, 2, 3));\nSet<Integer> set2\
  \ = new HashSet<>(List.of(2, 3, 4));\nSet<Integer> intersection = set1.stream()\n\
  \    .filter(set2::contains)\n    .collect(Collectors.toSet());\n```\n\n这对于无需手动循环或条件判断的函数式集合操作非常有用。\n\
  \n## 结论\n\n在本章中，我们探索了 `Set` 接口的核心实现：`HashSet`、`LinkedHashSet` 和 `TreeSet`。每个实现都有独特的优势。`HashSet`\
  \ 为 `add`、`remove` 和 `contains` 等基本操作提供了快速性能，但它不维护元素的任何顺序。另一方面，`LinkedHashSet` 在保持插入顺序的同时，仍以最小的开销提供相对高效的操作。`TreeSet`\
  \ 按自然顺序或指定的排序顺序维护元素，并支持高效的范围操作，适用于需要有序遍历或范围查询的场景。\n\n我们检查了它们的内部结构、构造函数和性能考虑因素，并涉及了与集合操作相关的同步和泛型算法等方面。\n\
  \n对这些实现深入理解将帮助你根据实际应用中的特定需求选择合适的数据结构。\n\n在下一章中，我们将探索 `queue` 和 `deque` 接口，并在其中探索有序处理、优先级处理和双端操作，这些在并发和顺序任务管理场景中至关重要。\n\
