  \n\n# 第 2 章：边界类型\n\n## 引言\n本章将在泛型编程的背景下介绍边界类型的概念。我们将探索如何使用边界来限制与泛型类和方法一起使用的类型。我们将学习不同类型的边界，包括上界、下界和通配符边界。通过实际示例，我们将演示如何有效地应用这些边界来创建更健壮、更易维护的泛型代码。\n\
  \n本章涵盖以下主题：\n* 上界\n* 下界\n* 通配符\n* 边界类型参数\n\n## 目标\n在本章结束时，你将对泛型中的边界类型有深入的理解，并了解它们如何在保持代码灵活性的同时强制类型安全。你将学习如何应用上界和下界来限制泛型中使用的类型，探索使用通配符字符来处理未知类型，并有效地实现边界类型参数。此外，你将看到通过实际示例演示边界类型如何提高代码的可重用性和维护性。在章节末尾，练习将帮助巩固你的理解，并测试你在现实场景中应用边界类型的能力。\n\
  \n## 上界\n\n让我们通过一个示例来说明这一点，即处理比较对象。假设你需要编写一个泛型方法来找到集合中的最大元素。你可以使用带有 `Comparable`\
  \ 接口的上界。\n\n考虑以下方法 `fetchMaxElement`：\n\npublic static <T extends Comparable<T>>\
  \ T fetchMaxElement(List<T> list) {\n    T max = list.get(0);\n    for (T element\
  \ : list) {\n        if (element.compareTo(max) > 0) {\n            max = element;\n\
  \    }\n    return max;\n}\n```\n\n在上面的示例中，`<T extends Comparable<T>>` 确保类型 `T`\
  \ 必须实现 `Comparable` 接口，具体来说，它必须与自己可比较。这允许我们安全地使用 `compareTo` 方法。\n我们可以可以使用提供的方法：\n\
  \n```java\nList<String> listOfNames = Arrays.asList(\"Apple\", \"Carrot\", \"Grapes\"\
  );\nString maxName = fetchMaxElement(listOfNames);\nInteger maxAge = fetchMaxElement(listOfAges);\n\
  ```\n\n`String` 和 `Integer` 都实现了 `Comparable` 接口，因此 `maxName` 和 `maxAge` 都是有效的。\n\
  \n以下是上界的主要优点：\n* 代码重用性：允许编写可以处理一系列相关类型的泛型代码。\n* 方法访问：保证了边界类或接口中定义的方法是可用。\n\n## 下界\n\
  类型参数的下界定义了基于父类的约束，并使用 `super` 关键字定义。它们指定了类型参数必须是特定类或继承层次结构中的任何一个祖先。这些边界在处理集合时特别有用，允许你处理类层次结构中某个层级或之上的类型。\n\
  可以这样想：`T super SomeClass` 意味着类型 `T` 可以是 `SomeClass` 本身，也可以是它的任何父类（继承树中更靠上的父类）。它为类型设置了下限。\n\
  \n### 示例 2.1：消费元素\n想象有一个向集合中添加元素的方法。你可能想添加类型为 `T` 或其任何子类的对象。下界允许你做到这一点。\n\n考虑以下方法\
  \ `addElements`：\n```java\npublic static <T> void addElements(List<? super T> list,\
  \ T element) {\n    list.add(element);\n}\n```\n在这里，`? super T` 通配符确保列表可以接受 `T`\
  \ 或其任何父类。\n\n我们可以这样调用该方法：\n\n```java\nList<Object> objectList = new ArrayList<>();\n\
  addElements(objectList, new Integer(10));\n```\n\n`objectList` 是 `List<Object>`，`String`\
  \ 和 `Integer` 是 `Object` 的子类。\n\n\n```java\nList<String> stringList = new ArrayList<>();\n\
  // addElements(stringList, new Object());\n```\n\n\n同样，我们不能像下面所示向 `List<Integer>`\
  \ 添加 `Number`：\n\n```java\nList<Integer> intList = new ArrayList<>();\n// addElements(intList,\
  \ new Number());\n\n这也会导致编译错误。\n\n### 示例 2.2：处理层次结构\n下界在处理需要处理某个层级或以上元素的类层次结构时非常有帮助。例如，你可能有一个形状层次结构（例如，形状、圆形、矩形）以及一个操作任何形状或祖先的方法。\n\
  例如，假设你有一个抽象类 `AnyShape`，作为不同形状的基类。\n\n```java\nabstract class AnyShape {\n    abstract\
  \ void drawShape();\n}\n\n两个具体的子类继承 `AnyShape`。\n\n```java\nclass CircleShape extends\
  \ AnyShape {\n    void drawShape() {\n        System.out.println(\"Drawing a Circle\"\
  );\n    }\n}\n\n    @Override\n    void drawShape() {\n        System.out.println(\"\
  Drawing a Rectangle\");\n    }\n}\n```\n现在考虑方法 `drawShapes`：\n\n```java\npublic\
  \ static void drawShapes(List<? super CircleShape> shapes) {\n    shapes.add(new\
  \ CircleShape());\n        // ...\n    }\n}\n```\n\n\n```java\nList<AnyShape> shapeList\
  \ = new ArrayList<>();\ndrawShapes(shapeList);\n```\n\n\n\n\n```java\nSystem.out.println(\"\
  Processing shape: \" + shape.getClass().getSimpleName());\n```\n\n该方法接受一个列表，其元素类型为\
  \ `CircleShape` 或其任何超类（`AnyShape`、`Object`）。这意味着你不能传递 `List<RectangleShape>`，因为\
  \ `RectangleShape` 与 `CircleShape` 没有关系。\n\n例如，你不能这样做：\n```java\nshapes.add(new\
  \ Shape());\n```\n\n或者\n```java\nshapes.add(new Rectangle());\n```\n\n### 示例 2.3:\
  \ 方法返回类型（较少见）\n\n\n让我们考虑如下 `getNumberList()` 方法：\n\n```java\npublic static List<?\
  \ super Integer> getNumberList() {\n    numbers.add(10);\n    numbers.add(20.5);\n\
  \    return numbers;\n}\n```\n该方法返回一个 `List<? super Integer>`，这意味着返回的列表包含至少是 `Integer`\
  \ 的元素，但也可能是其超类（`Number`、`Object`）。\n\n对于返回的列表，我们可以像下面添加整数值：\n\n```java\nList<? super\
  \ Integer> list = getNumberList();\n```\n\n由于确切类型未知，我们只能作为对象获取元素，而不能直接获取整数。\n\n\
  以下行将导致编译错误：\n```java\nInteger num = list.get(0);  // 编译错误\n```\n\n然而，我们可以以对象的形式获取元素：\n\
  \nObject obj = list.get(0);\n```\n\n### 上界与下界的主要区别\n\n\n| 特性 | 上界 (Upper bounds)\
  \ | 下界 (Lower bounds) |\n| :--- | :--- | :--- |\n| 使用的关键字 | `extends` | `super`\
  \ |\n| 限制 | 类型或子类型 | 类型或超类型 |\n| 使用场景 | 限制为特定类型或子类型 | 允许在消费/生产时具有灵活性，处理层次结构工作 |\n\
  \n表 2.1：上界与下界的区别\n\n## 通配符 (Wildcards)\n\n\n在探索不同类型的通配符之前，理解 Java 泛型的一个基本属性至关重要：不变性（invariance）。\n\
  \n意味着即使 `TypeA` 是 `TypeB` 的子类型，`List<TypeA>` 也不被视为 `List<TypeB>` 的子类型。例如，`List<Integer>`\
  \ 不是 `List<Number>` 的子类型，尽管 `Integer` 是 `Number` 的子类型。\n\n因此，以下操作是不允许的：\n```java\n\
  List<Number> numbers = new ArrayList<Integer>(); // 编译错误\n```\n\n这种不变性是为了维护类型安全而设计的。例如，如果允许上述赋值，人们可以向\
  \ `numbers` 添加一个 `double`，而其内部是 `ArrayList<Integer>`，这将导致运行时 `ClassCastException`。\n\
  为了安全地通过泛型启用多态行为，Java 提供了通配符。\n\n这种限制凸显了通配符的必要性，通配符提供了一种实现泛型编程中灵活性的控制机制。通配符允许开发者在维护类型安全的同时表达各种泛型类型之间的关系。通过这种方式，它们允许代码在更广泛的范围内运行，有效地克服了不变性带来的限制。\n\
  \n以下是三种通配符形式的分解：\n\n\n以下是示例代码：\n\n```java\npublic static void printElements(Collection<?>\
  \ anyCollection) {\n        System.out.println(theObject);\n    }\n}\n```\n\n`printElements`\
  \ 方法只需接受任何集合并打印其元素。它不限于任何一种类型的集合。\n-   **上界通配符：`? extends Type`**：正如我们在本章看到的，上界通配符\
  \ `? extends Type` 将未知类型限制为 `Type` 本身或 `Type` 的任何子类型。当你想要与一组相关类型工作时，通常当你想从集合中读取元素时（例如当你是元素的生产者时），这非常有用。遵循\
  \ PECS 规则（producer extends`），如果你从参数化类型产生值，请使用 `extends`。\n\n例如，如果你有一个形状层次结构，并且想要处理任何形状或其子类型的集合：\n\
  \n```java\n    for (Shape eachShape : shapesList) {\n        eachShape.drawShape();\n\
  \    }\n}\n```\n在这里，`shapes` 可以是 `List<Shape>` 或其子类。\n\n-   **下界通配符：`? super Type`**：下界通配符\
  \ `? super Type` 将未知类型限制为 `Type` 本身或其任何超类型。这通常用于你想向集合中添加元素时（例如当你是元素的消费者时）。遵循 PECS\
  \ 规则（consumer super`），如果你从参数化类型消费值，请使用 `super`。\n\n例如，如果你想向一个可以包含 Circle 及其超类型的列表添加\
  \ Circle 对象：\n\npublic static void addCircles(List<? super Circle> circles) {\n\
  \    circles.add(new Circle());\n}\n```\n\n\n\n\n\n\n- 当使用类型 b 数据（你向其写入数据）时，请使用\
  \ `super`。\n在处理集合和其他参数化类型时，这一原则有助于编写更通用、更健壮的代码。\n\n因此，通配符在保持类型安全的同时提供了灵活性。`PECS`\
  \ 规则是有效使用通配符的关键指南。理解何时使用每种类型的通配符（特别是结合上界和下界使用时），对于 Java 中有效的泛型编程至关重要。\n\n## 边界类型参数\
  \ (Bounded type parameters)\n边界类型参数限制了类型参数匹配特定的类型范围。这有助于创建既灵活又受限的方法或类。边界类型参数对于表达类型之间的关系以及在处理泛型时确保类型安全至关重要。\n\
  \n在详细探讨了上界和下界之后，我们现在总结了它们作为边界类型参数的作用。以下重申了关键要点：\n\n- 上界 (extends)：将类型参数限制为特定类型或其子类型。当你需要产生某种特定类型的值，或者想要确保类型参数支持特定操作（例如在接口或父类中定义的方法）时，通常使用它们。可以将其理解为：这种类型必须至少是这种特定类型。\n\
  - 边界类型参数的重要性：边界类型参数允许你编写既类型安全又灵活的泛型代码。它们防止你不意外使用不兼容的类型，并允许你处理一系列相关类型。`PECS` 记忆法是记住如何有效使用上界和下界的有用工具。\n\
  \n通过策略性地使用边界类型参数，你可以设计出健壮且复用的泛型类和方法，这些方法可以在定义层次结构内的各种类型之间无缝工作。\n\n## 边界类型的实践示例\n\
  我们已经看到边界类型参数对于确保泛型编程中的类型安全和灵活性至关重要。以下示例说明了它们在不同领域的实际应用：\n\n- 处理金融交易：想象你正在构建一个金融系统，该系统需要处理各种类型的交易，例如存款和取款。每种交易类型可能有自己的特定逻辑，但它们共享一些共同属性，如金额。我们可以使用边界类型参数来创建一个泛型方法，在处理任何类型的交易的同时确保类型安全。\n\
  \n以下是实现方式：\n```java\nimport java.util.Arrays;\nimport java.util.List;\n\nabstract\
  \ class Transaction {\n    private double amount;\n    public Transaction(double\
  \ amount) {\n        this.amount = amount;\n    }\n\n    public double getAmount()\
  \ {\n    }\n\n    public abstract String getType(); //不同的交易类型\n\n    @Override\n\
  \        return \"Transaction{\" +\n        \"amount=\" + amount +\n        \",\
  \ type='\" + getType() + '\\'' +\n        '}';\n    }\n}\nclass Deposit extends\
  \ Transaction {\n    public Deposit(double amount) {\n        super(amount);\n \
  \   }\n\n    public String getType() {\n        return \"Deposit\";\n    }\n}\n\n\
  \    public Withdrawal(double amount) {\n        super(amount);\n    }\n\n    @Override\n\
  \        return \"Withdrawal\";\n    }\n}\n\npublic class TransactionProcessor {\n\
  \    public static <T extends Transaction> void processTransactions(List<T> transactions)\
  \ {\n            System.out.println(\"Processing \" + transaction);\n          \
  \  // 根据交易类型执行特定操作（例如，更新余额）\n            if (transaction instanceof Deposit) {\n\
  \                // ... 处理存款特定的逻辑\n            } else if (transaction instanceof\
  \ Withdrawal) {\n            }\n        }\n    }\n\n    public static void main(String[]\
  \ args) {\n        List<Deposit> deposits = Arrays.asList(new Deposit(100), new\
  \ Deposit(50));\n\n        List<Withdrawal> withdrawals = Arrays.asList(new Withdrawal(20),\
  \ new Withdrawal(75));\n        processTransactions(withdrawals); // 正常：Withdrawal\
  \ extends Transaction\n\n        List<Transaction> allTransactions = Arrays.asList(new\
  \ Deposit(100), new Withdrawal(20));\n        // List<String> strings = Arrays.asList(\"\
  a\", \"b\");\n        // processTransactions(strings); // 编译错误：String 不是一个 Transaction\n\
  \    }\n}\n```\n我们定义了一个抽象的 `Transaction` 类，表示所有交易的共同属性。`Deposit` 和 `Withdrawal`\
  \ 是具体的子类，表示特定的交易类型。它们继承了 `Transaction` 的 `amount` 属性和 `getAmount()` 方法，但提供了对 `getType()`\
  \ 方法的自己的实现。\n\n`processTransactions` 方法是泛型的，使用了类型参数 `<T extends Transaction>`。这种绑定至关重要。这意味着\
  \ `T` 可以是任何作为交易或交易的子类的类型。这允许该方法处理存款、取款、交易或我们可能添加的任何其他未来交易类型的列表。\n\n在方法内部，我们遍历交易列表。这是因为有了\
  \ `<T extends Transaction>` 边界；我们保证列表中的每个交易对象至少是一个交易。这意味着我们可以安全地调用 `transaction.getAmount()`\
  \ 和 `transaction.getType()` 等方法。\n\n\n- 通用仓库接口：数据访问是软件开发中的一项常见任务。仓库模式通常用于抽象数据存储的细节。我们可以使用泛型来创建类型安全且复用的仓库接口。此外，我们可能需要为具有特定功能（如搜索）的实体创建特殊的仓库。边界类型参数可以帮助我们表达这些关系。\n\
  \n考虑以下示例，它演示了一个通用的 `Repository` 接口、针对可搜索实体的 `Searchable` 接口，以及一个继承这两者的 `SearchableRepository`\
  \ 接口：\n\nimport java.util.List;\n\npublic class RepositoryProcessor {\n    public\
  \ static void main(String args[]) {\n        SearchableRepository<Product> productRepository\
  \ = new SearchableProductRepository();\n        List<Product> products = productRepository.search(\"\
  Laptop\");\n    }\n}\n\ninterface Repository<T> {\n    T findById(Long id);\n  \
  \  void save(T entity);\n    void delete(Long id);\n}\n\nclass ProductRepository\
  \ implements Repository<Product> {\n}\n\n// 针对更特殊仓库操作的边界类型参数\ninterface SearchableRepository<T\
  \ extends Searchable> extends Repository<T> {\n    List<T> search(String keyword);\n\
  }\ninterface Searchable {\n    boolean matches(String keyword);\n}\n\nclass SearchableProductRepository\
  \ extends ProductRepository implements SearchableRepository<Product> {\n}\n```\n\
  \n`Repository<T>` 接口定义了类型 `T` 实体的基本数据访问操作，如按 ID 查找、全部、保存和删除。具体的仓库实现（如 `ProductRepository`）将为这些方法提供具体实现。\n\
  \n\n\n\n`Searchable` 接口定义了一个 `matches` 方法，允许对实体进行搜索关键词的检查。`product` 类现在实现了此接口，为产品提供了\
  \ `matches` 方法的具体实现。\n\n`SearchableRepository<T extends Searchable>` 接口同时扩展了 `Repository<T>`\
  \ 并添加了 `search` 方法。这里的关键在于边界 `T` 扩展了 `Searchable`。这确保了任何实现 `SearchableRepository`\
  \ 的仓库必须与同样实现了 `Searchable` 接口的实体一起。这就是我们强制执行关系的方式；只有可搜索的实体才能拥有可搜索的仓库。\n`SearchableProductRepository`\
  \ 类扩展了 `ProductRepository`（并隐式实现了 `Repository<Product>`），并实现了 `SearchableRepository<Product>`。这很重要，因为\
  \ `SearchableRepository` 本身扩展了仓库。\n\n通过扩展 `ProductRepository`，我们就不需要重写基础的仓库方法。`SearchableProductRepository`\
  \ 提供了特定的搜索实现，利用了 `product` 类的 `matches` 方法。\n\n在 `main` 方法中，我们创建了一个 `SearchableRepository<Product>`\
  \ 并使用它来搜索产品。\n正是因为 `product` 实现了 `searchable`，且 `SearchableProductRepository` 与\
  \ `product` 实体配合，类型约束得以满足，代码能够正确编译并运行。这个示例清楚地演示了边界类型参数结合接口继承，在处理不同类型的实体和专门的仓库操作时，如何确保类型安全和代码重用性。\n\
  \n- 实现可比较接口：有时，你需要创建彼此可以相互比较的泛型类。例如，你可能想创建一个泛型 `SampleBox` 类，它可以持有任何可比较的类型，然后根据它们包含的值来比较\
  \ `SampleBox` 实例。边界类型参数结合 `comparable` 接口使得这成为可能。\n\n以下是实现方式：\n```java\nclass SampleBox<T\
  \ extends Comparable<T>> implements Comparable<SampleBox<T>> {\n\n    private T\
  \ value;\n\n    public SampleBox(T value) {\n    }\n\n    public T getValue() {\n\
  \        return value;\n    }\n    @Override\n    public int compareTo(SampleBox<T>\
  \ other) {\n        return this.value.compareTo(other.value);\n    }\n\n       \
  \ SampleBox<Integer> box1 = new SampleBox<>(10);\n        SampleBox<Integer> box2\
  \ = new SampleBox<>(20);\n        int comparison = box1.compareTo(box2); // Comparing\
  \ Integer values\n        SampleBox<String> box3 = new SampleBox<>(\"apple\");\n\
  \        SampleBox<String> box4 = new SampleBox<>(\"banana\");\n        System.out.println(\"\
  Integer comparison: \" + comparison);\n        System.out.println(\"String comparison:\
  \ \" + stringComparison);\n    }\n}\n```\n\n\n- `T` 扩展 `Comparable<T>`：这意味着类型参数\
  \ `T` 必须实现 `Comparable<T>` 接口。这是至关重要的，因为我们希望能够比较 `SampleBox` 实例。`Comparable<T>`\
  \ 接口定义了用于比较的 `compareTo` 方法。这个边界确保了可以在 `value` 字段上调用 `compareTo` 方法。\n\n- 实现 `comparable<SampleBox<T>>`：这意味着\
  \ `SampleBox` 类本身实现了 `comparable` 接口。具体来说，一个 `SampleBox<T>` 可以与另一个 `SampleBox<T>`\
  \ 进行比较。这允许我们根据包含的值比较 `SampleBox` 对象。\n\n\n`main` 方法演示了我们如何创建不同可比较类型的 `SampleBox`\
  \ 对象，例如 `Integer` 和 `String`。这是因为整数和字符串都实现了 `comparable`，我们可以创建 `SampleBox<Integer>`\
  \ 和 `SampleBox<String>` 对象并使用 `compareTo` 方法对它们进行比较。编译器确保了我们无法创建不可比较类型的 `SampleBox`。这就是边界类型参数的威力；它们强制执行了我们的逻辑正确运行所需的类型约束。\n\
  \n这些示例演示了 Java 泛型中边界类型参数的力量和多功能性。通过将类型参数限制在特定范围内，你可以创建出与相关类型无缝协作的类型安全且可重用的代码。边界类型对于构建健壮灵活的泛型类和方法至关重要。\n\
  \n\n本章提供了泛型关键性的全面概述，包括类型参数、通配符和边界类型。通过有效使用泛型，你可以在编译时捕获类型错误，编写更适应不同数据类型的代码，并避免运行时转换的开销。\n\
  \n下一章将探索泛型如何在 Java 集合框架中使用，它们在使你的代码更简洁、可靠方面起着至关重要的作用。我们将看到泛型如何帮助你更有效地处理集合。\n\n\n\
