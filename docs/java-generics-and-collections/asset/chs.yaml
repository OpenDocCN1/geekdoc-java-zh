  \n9. 使用哪个构造函数来创建一个具有自定义键排序逻辑的 `TreeMap`？\n1. `TreeMap(Collection c)`\n2. `TreeMap(SortedMap\
  \ s)`\n3. `TreeMap()`\n4. `TreeMap(Comparator comparator)`\n\n10. 在用于 `HashMap`\
