  \n## ArrayList 实现\n`ArrayList` 是 Java 中使用广泛的 `List` 接口实现之一。它是 `java.util` 包的一部分，提供了一个根据需要增长的动态数组，这与具有固定大小的普通数组不同。在内部，`ArrayList`\
  \ 维护一个数组（`Object[] elementData`），当其达到容量时会进行扩展。\n\n以下是 `ArrayList` 的内部结构：\n\n*  \
  \ `ArrayList` 从初始容量开始。\n*   从 Java 9 开始，`ArrayList` 从一个空数组开始，只有在添加第一个元素时才会分配内部数组（懒性初始化）。\n\
  *   元素存储在一个名为 `Object[] elementData` 的内部数组中。\n*   随着元素的添加，它们被按顺序放入此数组中。\n*   当数组满时，`ArrayList`\
  \ 会创建一个新数组。\n\n\n\n\n\n\n## 优化提示：如果你提前知道列表的预期大小，请使用：\n```java\nList<Integer> numbers\
  \ = new ArrayList<>(100);\n```\n\n这可以避免多次扩容，从而提高性能。\n## 在末尾插入（最佳情况）\n\n*   在列表末尾添加元素（当容量未超过容量时）需要\
  \ `O(1)`（分摊）时间。\n*   如果需要扩容，由于需要复制元素，成本为 `O(n)`。\n* 优化提示是，如果预计会在中间频繁添加，请考虑使用 `LinkedList`。我们将在稍后的章节中讨论\
  \ `LinkedList`。\n## 在开头或中间插入（最坏情况）\n\n*   在开头或中间添加元素会导致所有后续元素向右移动。\n* 为了理解在开头或中间插入的成本，请考虑以下示例，我们在索引\
  \ `0` 处插入了一个元素。\n\n```java\n```\n\n当你在索引 `0` 处插入元素时，`ArrayList` 中的所有现有元素都会右移动一位以腾出空间。这种移动操作需要线性时间\
  \ `O(n)`，因为每个受影响的元素都必须单独移动。这被认为是最坏情况。\n* 如果需要频繁在中间插入，`LinkedList` 是更好的选择。\n\n\n\
  *   删除最后一个元素（`remove(size - 1)`） | `O(1)`（不需要移动）。\n*   从中间或开头删除（`remove(index)`）\
  \ | `O(n)`（所有元素向左移动）。\n* 优化提示是，如果顺序不重要，可以将目标元素与最后一个元素交换，然后将其删除：\n\n```java\nnumbers.remove(numbers.size()\
  \ - 1); // 移除最后一个元素\n```\n\n* 这这将移动成本从 `O(n)` 降低到 `O(1)`。\n\n\n* ``ArrayList` 预留了额外的空间以减少扩容次数。\n\
  *   如果 `ArrayList` 的元素远少于其容量，则会浪费内存。\n* 优化提示是，如果 `ArrayList` 不会再增长，请修剪未使用的容量：\n\n\
  numbers.trimToSize();\n```\n\n* 这将释放多余内存。\n\n## 同步与线程安全\n* `ArrayList` 不是线程安全的。\n\
  * 如果多个线程并发修改列表，请使用：\n\n```java\nList<Integer> syncList = Collections.synchronizedList(new\
  \ ArrayList<>());\n\n然而，`CopyOnWriteArrayList` 是并发读取和偶尔写入的更好选择。这使得读取非常快（`O(1)`），但为写入增加了开销（`O(n)`）。它适用于读取频繁但写入稀少的场景，例如缓存或事件监听器列表。我们即将在稍后的章节中看到\
  \ `CopyOnWriteArrayList` 的示例。\n\n## ArrayList 的自定义实现\n\n为了更好地理解 `ArrayList`，让我们来实现它的简化版本。以下是需要考虑的点：\n\
  *   **内部存储**：我们可以使用整数数组（`data`）来存储元素。\n*   **动态扩展**：如果在添加新元素时数组已满，我们可以通过将容量翻倍并复制现有元素来提供扩容逻辑。\n\
  *   **检索**：为了检索元素，我们可以拥有一个 `get(index)` 方法。我们可以在返回元素之前添加验证，以确保索引在边界内。\n*   **大小跟踪**：我们可以通过\
  \ `size` 变量来跟踪数组的大小。该变量记录了已添加元素的数量。\n\n\n```java\nclass CustomArrayList {\n    private\
  \ int[] data;\n    private int size;\n    private int capacity;\n    public CustomArrayList(int\
  \ initialCapacity) {\n        this.capacity = initialCapacity;\n        this.data\
  \ = new int[capacity];\n        this.size = 0;\n    }\n    public void add(int element)\
  \ {\n        if (size == capacity) {\n            expandCapacity();\n        }\n\
  \        data[size++] = element;\n    }\n    private void expandCapacity() {\n \
  \       capacity *= 2; // 容量翻一倍\n        int[] newData = new int[capacity];\n  \
  \      System.arraycopy(data, 0, newData, 0, size);\n        data = newData;\n\n\
  \    public int get(int index) {\n        if (index < 0 || index >= size) {\n  \
  \          throw new IndexOutOfBoundsException(\"Index out of bounds\");\n     \
  \   }\n    }\n\n    public int size() {\n        return size;\n    }\n```\n\n\n\n\
  \n\n\n图 5.6：添加 40 后的 `LinkedList`\n\n一旦添加了 40，它的连接方式如下：\n\n* `40 prev`: 指向 `30`\n\
  \n总结这种结构，每个节点存储两个引用（`next` 和 `prev`）。`head` 始终指向第一个节点。`tail`（最后一个节点）指向 `null`。\n\
  \n在移�除（删除）元素的情况下，只需更新引用即可。\n假设我们使用以下代码删除 20：\n\n```java\nlist.remove(Integer.valueOf(20));\n\
  ```\n\n\n![一个包含三个节点的双向链表图：10, 30 和 40。箭头表示正向和反向链接。head 指向第一个节点 (10)，其之前的指针被设置为 null。\
  \ ](img/Figure_5.7.jpg)\n\n图 5.7：删除 20 后的 `LinkedList`\n\n\n* `10 next` 现在指向 `30`（跳过\
  \ 20）\n* `30 prev` 现在指向 `10`\n\n### `LinkedList` 的性能考量\n在决定使用 `LinkedList` 还是 `ArrayList`\
  \ 时，理解 `LinkedList` 的性能特性至关重要。虽然 `LinkedList` 提供了高效的插入和删除，但在内存使用和元素访问速度方面存在权衡。让我们探索以下关键性能方面：\n\
  \n* **插入和删除**：\n    * 在开头或末尾的高效插入或删除：与 `ArrayList` 不同，`LinkedList` 在插入或删除时不需要移动元素。只需更新节点中的\
  \ `previous` 和 `next` 引用，使得在头部或尾部添加或删除元素的复杂度为 `O(1)`。\n    * 中间插入或删除需要遍历：如果在中间插入或删除元素，我们需要遍历列表以找到正确的位置，这在最坏情况下复杂度为\
  \ `O(n)`。\n* **元素访问**：\n    * 通过索引访问元素需要从头部或尾部遍历，这在最坏情况下复杂度为 `O(n)`。\n    * 如果按顺序访问元素，由于缺乏连续内存存储，其迭代速度比\
  \ `ArrayList` 慢。\n* **内存开销**：\n    * 更高的内存占用：`LinkedList` 中的每个节点都存储数据和两个引用（`previous`\
  \ 和 `next`），与只存储元素的 `ArrayList` 相比，增加了内存消耗。\n    * 垃圾回收开销：频繁的插入和删除会导致更多的对象创建和移除，这可能会影响垃圾回收性能。\n\
  \    * 正向和反向遍历：`LinkedList` 支持使用 `ListIterator` 在两个方向上高效迭代，但它仍然是 `O(n)`。\n    *\
  \ 缓存局部性差：由于元素分散在内存中，访问它们需要额外的指针解引用，使得迭代比 `ArrayList` 慢。\n* **`LinkedList` 表现更好的用例**：\n\
  \    * 频繁的插入或删除：如果你经常在列表开头或中间插入或移除元素，`LinkedList` 的性能优于 `ArrayList`。\n    * 队列和栈实现：当\
  \ `LinkedList` 用作队列（FIFO）或栈（LIFO）时，它是理想的选择，因为插入和删除非常高效。\n### 自定义 `LinkedList` 实现\n\
  \n为了深入理解 `LinkedList`，让我们自己实现一个自定义的 `LinkedList`。\n\n让我们创建一个 `Node` 类，它包含：\n\n*\
  \ 对 `next` 节点的引用。\n* 对 `previous` 节点的引用（因为它是双向链表）。\n\n以下是 `Node` 类的一个示例：\n\nclass\
  \ Node<T> {\n    T data;\n    Node<T> next;\n    Node<T> prev;\n\n    public Node(T\
  \ data) {\n        this.next = null;\n        this.prev = null;\n    }\n}\n```\n\
  链表维护对 `head`（第一个节点）和 `tail`（最后一个节点）的引用。它还跟踪列表的大小：\n\n```java\nclass CustomLinkedList<T>\
  \ {\n    private Node<T> head;\n    private int size;\n\n    public CustomLinkedList()\
  \ {\n        this.head = null;\n        this.tail = null;\n        this.size = 0;\n\
  }\n```\n\n为了添加新元素，我们可以创建一个 `add` 方法。它通过更新 `next` 和 `prev` 引用将新元素附加到末尾：\n\npublic\
  \ void add(T data) {\n    Node<T> newNode = new Node<>(data);\n    if (head == null)\
  \ { // 如果列表为空\n        head = newNode;\n        tail = newNode;\n    } else {\n\
  \        newNode.prev = tail;\n        tail = newNode;\n    }\n    size++;\n}\n\n\
  在上面的代码中：\n* 如果列表为空，新节点将同时成为 `head` 和 `tail`。\n* 否则，我们更新 `tail.next` 指向新节点，并更新 `newNode.prev`\
  \ 指向 `tail`。\n\n要删除元素，只需要更新引用：\n\n```java\npublic boolean remove(T data) {\n   \
  \ if (head == null)\n        return false; // 列表\n    while (current != null) {\n\
  \        if (current.data.equals(data)) {\n            if (current == head) { //\
  \ 删除头部\n                head = head.next;\n                if (head != null) {\n\
  \                } else {\n                    tail = null;\n                }\n\
  \            } else if (current == tail) { // 删除尾部\n                tail = tail.prev;\n\
  \                if (tail != null) {\n                }\n            } else { //\
  \ 删除中间\n                current.prev.next = current.next;\n                current.next.prev\
  \ = current.prev;\n            }\n            return true;\n        }\n        current\
  \ = current.next;\n    }\n    return false; // 未找到\n}\n\n与 `ArrayList` 不同，`LinkedList`\
  \ 没有直接索引访问。我们需要遍历列表来找到元素。我们可以通过以下 `get` 方法来实现：\n\n```java\npublic T get(int index)\
  \ {\n        throw new IndexOutOfBoundsException(\"Index: \" + index);\n    }\n\
  \    Node<T> current;\n    if (index < size / 2) { // 从头部遍历\n        current = head;\n\
  \            current = current.next;\n        }\n    } else { // 从尾部遍历\n       \
  \ current = tail;\n        for (int i = size - 1; i > index; i--) {\n          \
  \  current = current.prev;\n    }\n    return current.data;\n}\n```\n\n\n```java\n\
  public void display() {\n    Node<T> current = head;\n    while (current != null)\
  \ {\n        System.out.print(current.data + \" => \");\n    }\n    System.out.println(\"\
  null\");\n}\n```\n\n\n```java\npublic class LinkedListDemo {\n    public static\
  \ void main(String[] args) {\n        CustomLinkedList<Integer> list = new CustomLinkedList<>();\n\
  \        list.add(10);\n        list.add(30);\n        list.add(40);\n        list.display();\
  \ // 输出: 10 => 20 => 30 => 40 => null\n        list.remove(20);\n        list.display();\
  \ // 输出: 10 => 30 => 40 => null\n    }\n}\n```\n\n\n\n\n`Java` 中的 `Vector` 是 `java.util`\
  \ 包的一部分，它提供了一种类似于 `ArrayList` 的动态数组结构。然而，与 `ArrayList` 不同，`Vector` 是同步的，这使得它是安全的，但由于同步开销，速度可能会较慢。在本节中，我们将探索\
  \ `Vector` 的内部实现、存储机制以及性能考虑。\n\n以下是 `Vector` 的内部结构：\n\n- 当添加的元素超过初始容量时，数组会自动扩展。\n\
  - 与 `ArrayList` 满时增长 `50%` 不同，`Vector` 在调整大小时会将容量翻倍。\n- 它实现了 `List` 接口，允许存在重复元素，同时保持插入顺序。\n\
  \n让我们来看一个创建和使用 `Vector` 的示例：\n```java\nimport java.util.Vector;\n\npublic class\
  \ VectorExample {\n  public static void main(String[] args) { \n    // 创建一个整数 Vector\n\
  \    // 添加元素\n    numbers.add(10);\n    numbers.add(20);\n    numbers.add(30);\n\
  \    numbers.add(40);\n    System.out.println(\"First Element: \" + numbers.firstElement());\n\
  \    System.out.println(\"Last Element: \" + numbers.lastElement());\n    // 移除元素\n\
  \    numbers.remove(2); // 移除 30\n    // 显示 Vector\n    System.out.println(\"Updated\
  \ Vector: \" + numbers);\n}\n```\n\n以下是输出：\n\nLast element: 40\nUpdated Vector:\
  \ [10, 20, 40]\n\n类似于 `ArrayList`：\n\n- 例如，如果初始容量为 `4`，那么当添加第 `5` 个元素时，它的大小增加到 `8`。\n\
  - 这种翻倍的行为确保了更少的调整次数，但可能会导致更高的内存消耗。\n\n以下是性能考虑：\n\n- `Vector` 是同步的，这意味着多个线程可以安全地修改它。然而，这是以性能为代价的。\n\
  - 如果不需要同步，则优先 `ArrayList`。\n- 当多个线程并发访问并修改集合时，`Vector` 是合适的。\n\n在 `ArrayList`、`LinkedList`\
  \ 和 `Vector` 之间做出选择时，理解它们在性能、同步用法方面的关键区别至关重要。下表总结了每种集合的主要功能和特性，帮助你根据特定需求做出明智选择：\n\
  \n| :--- | :--- | :--- | :--- |\n| 底层数据结构 | 动态数组 | 双向链表 | 动态数组 |\n| 访问时间（随机访问） |\
  \ 常数时间 (O(1)) | 线性时间 (O(n)) | 常数时间 (O(1)) |\n| 插入或删除时间 | 中间插入为线性时间 (O(n)) | 端部插入为常数时间\
  \ (O(1)) | 插入为线性时间 (O(n)) |\n| 内存占用 | 内存开销较小 | 指针导致内存开销较大 | 类似于 ArrayList，但调整大小时需要更多内存\
  \ |\n| 同步 | 非同步 | 非同步 | 默认同步 |\n| 调整大小 | 满时自动调整大小 | 不调整；元素通过链表连接 | 满时自动调整大小 |\n\
  | 空元素 | 支持空元素 | 支持空元素 | 支持空元素 |\n| 使用场景 | 最适合频繁访问、较少修改 | 最适合频繁插入和删除 | 适用于需要线程安全的遗留系统\
  \ |\n\n表 5.2：ArrayList、LinkedList 和 Vector 的比较\n## 列表中的同步\n\n在多线程环境中，多个线程可能尝试同时从列表读取或写入数据。如果没有适当的同步，可能会导致竞态条件、数据不一致，甚至出现如\
  \ `ConcurrentModificationException` 等运行时异常。为了维护数据完整性并确保线程安全，使用同步列表实现或使用同步机制封装现有列表是至关重要的。\n\
  \n某些类（如 `Vector`）默认是同步的，这意味着它们的所有方法都是线程安全的。然而，在单线程或读密集型环境中，它们会带来性能权衡。另一方面，常用的集合如\
  \ `ArrayList` 和 `LinkedList` 不是线程安全的，当被多个线程并发访问时，需要显式同步。\n### Collections.synchronizedList()\n\
  \n`Collections.synchronizedList()` 方法为列表提供了一个同步包装器。让我们通过示例来看下它的用法：\n\n```java\n\
  import java.util.List;\nimport java.util.ArrayList;\n\npublic class SynchronizedListExample\
  \ {\n  public static void main(String[] args) {\n    // 使用 Collections.synchronizedList()\
  \ 创建线程安全的（同步）列表\n    list.add(10);\n    list.add(20);\n    list.add(30);\n\n   \
  \ /*\n    * 尽管列表对单个操作是同步的，\n    */\n    synchronized (list) {\n      for (Integer\
  \ num : list) {\n        System.out.println(num);\n      }\n  }\n}\n```\n\n输出：\n\
  20\n30\n\n注意：仅在迭代时需要同步块。\n\n### CopyOnWriteArrayList\nJava 提供了 `CopyOnWriteArrayList`，这是一种线程安全的列表，写操作会创建列表的副本。让我们通过示例来看它的用法：\n\
  \n```java\nimport java.util.concurrent.CopyOnWriteArrayList;\n\npublic class CopyOnArrayListExample\
  \ {\n    CopyOnWriteArrayList<String> list = new CopyOnWriteArrayList<>();\n   \
  \ list.add(\"Java\");\n    list.add(\"Python\");\n    list.add(\"C++\");\n\n   \
  \   System.out.println(language);\n    }\n  }\n}\n```\n\nJava\nPython\nC++\n\n由于\
  \ `CopyOnWriteArrayList` 不允许修改影响正在进行的迭代，它可以防止 `ConcurrentModificationException`，但消耗更多内存。\n\
  \n\n在 Java 中，有时我们需要只读集合以确保初始化后数据保持不变。`Collections` 类提供了创建 `List`、`Set` 和 `Map` 不变版本的方法。\n\
  \n这在从 API 暴露集合时特别有用，因为我们希望防止调用者进行意外修改。\n\n\n让我们通过一个示例来理解这一点：\n\n```java\nList<String>\
  \ names = new ArrayList<>();\nnames.add(\"Roger\");\n\nList<String> unmodifiableNames\
  \ = Collections.unmodifiableList(names);\n\nunmodifiableNames.add(\"Royce\"); //\
  \ 抛出 UnsupportedOperationException\n```\n\n\n\n\n\n在上面的示例中：\n\n* `unmodifiableList()`\
  \ 方法封装了原始列表并防止对其修改。\n* 如果尝试修改列表，将会抛出 `UnsupportedOperationException`。\n\n注意：如果原始列表（names）被修改，这些更改将反映在不可修改的列表中。要创建一个真正不可变的列表（immutable），Java\
  \ 9+ 提供了 `List.of()` 方法，它同时防止了对底层集合的修改和更新。\n\n以下是 `List.of()` 的用法示例：\n\n```java\n\
  List<String> immutableNames = List.of(\"Ryan\", \"Roger\", \"Royce\");\n\n// immutableNames.add(\"\
  Zane\"); // 抛出 UnsupportedOperationException\n```\n\n它创建了一个创建后无法被修改的不可变列表（immutable）。任何添加、删除或更改元素的尝试都将导致\
  \ `UnsupportedOperationException`。\n\n## 检查集合 (Checked collections)\n\n在 Java 中，检查集合类（checked\
  \ collections class）是 `java.util.Collections` 工具类的一部分，用于确保集合中的元素在运行时符合指定的类型。这在处理泛型集合时特别有用，特别是当类型安全非常重要，但由于某些限制（例如动态创建集合或在没有显式类型参数的情况下进行传递）而无法在编译时强制执行时。\n\
  \n`Collections.checkedCollection()`、`checkedList()`、`checkedSet()` 和 `checkedMap()`\
  \ 方法允许你将集合封装在一个检查版本中，强制所有元素都符合指定的类型。如果向集合中添加了不兼容类型的元素，将抛出 `ClassCastException`。这有助于在运行时更早地发现类型错误，而不是在后期，从而增强了可靠性和可维护性。\n\
  \n让我们通过一个示例来理解这一点：\n\n```java\nList rawList = new ArrayList(); // 原始类型 (raw type)\n\
  List<String> checkedList = Collections.checkedList(rawList, String.class);\n\ncheckedList.add(\"\
  Hello\");  // 有效\nrawList.add(10);             // 编译通过，但会导致运行时错误\nSystem.out.println(checkedList.get(1));\
  \ // 抛出 ClassCastException\n```\n\n`Collections.checkedList()` 将原始原始列表封装为检查列表，该列表在运行时强制类型安全。添加\
  \ `Hello` 是允许的，但当直接向原始列表添加整数 (`10`) 时，它绕过了编译时检查。然而，通过 `checkedList` 访问它会导致 `ClassCastException`，因为封装器确保了只有\
  \ `String` 对象在运行时被视为有效元素。\n\n### 使用检查集合的优势\n\n在 Java 中处理集合操作时，确保运行时的类型安全变得至关重要，特别是在动态环境中。检查集合提供了多项优势：\n\
  \n* **类型安全**：检查集合强制要求只有指定类型的元素可以被包含。\n* **错误检测**：它们在运行时捕获类型错误。\n* **可靠性**：这增强了代码的健壮性。\n\
  * **可维护性**：使代码更易于维护。\n\n## 结论\n\n在本章中，我们学习了不可变列表和检查集合。我们了解了 `unmodifiableList()`\
  \ 和 `List.of()` 的区别：`unmodifiableList()` 只是原始列表的视图，如果原始列表被修改，视图也会随之改变；而 `List.of()`\
  \ 创建的是真正的不可变列表。我们学习了 `List.of()` 如何创建一个完全被修改的列表。我们还学习了检查集合，以及它们如何在运行时强制类型安全，这在处理泛型集合时非常有用。\n\
