    Append Java compiler to System Path.


    | OS | Description |

    | --- | --- |

    | Windows | Append the String; C:\Program Files\Java\jdk1.7.0_60\bin to the end
    of the system variable PATH. |

    | Linux | export PATH=$PATH:$JAVA_HOME/bin/ |


    Verify the command java -version from the command prompt as explained above.


    # Step 3: Installing JFreeChart


    Download the latest version of JFreeChart.zip from the link http://www.jfree.org/jfreechart/download/.
    Unzip the downloaded file at any location from where required libraries can be
    linked into your Java program. The following image shows the structure of the
    directories and files:


