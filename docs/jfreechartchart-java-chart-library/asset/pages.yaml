  md: "# 9. JFreeChart – 3D Pie/Bar Chart\n\nThe 3D charts are the ones, which appear\
    \ in a three-dimensional format. You can use these charts to provide better display\
    \ and clear information. A 3D Pie chart is same as the pie chart additionally\
    \ with a new 3D effect can be achieved by adding a little extra code, which will\
    \ take care of creating 3D effect in a pie chart.\n\n# 3D Pie chart\n\nConsider\
    \ the following example to illustrate mobile sale with the head of a 3D pie chart.\
    \ Following is a list of different mobile brands and their sale (units per day).\n\
    \n| S.N. | Mobile Brands | Sales (UNITS per day) |\n| 1 | Iphone 5S | 20 |\n|\
    \ 2 | Samsung Grand | 20 |\n| 3 | MOTO G | 40 |\n| 4 | Nokia Lumia | 10 |\n\n\
    Following is the code to create 3D Pie Chart from the above given information.\
    \ This code helps you to embed a pie chart in any AWT based application.\n\n```\n\
    import java.io.*;\nimport org.jfree.chart.ChartFactory;\nimport org.jfree.chart.JFreeChart;\n\
    import org.jfree.chart.plot.PiePlot3D;\nimport org.jfree.chart.data.DefaultPieDataset;\n\
    import org.jfree.chart.ChartUtilities;\n\npublic class PieChart3D\n{\n    public\
    \ static void main(String [ ] args throws Exception\n{\n        DefaultPieDataset\
    \ dataset = new DefaultPieDataset();\n        dataset.setValue(\"Iphone 5S\",\
    \ new Double( 20 ) );\n        dataset.setValue(\"Samsung Grand\", new Double(\
    \ 20 ) );\n        dataset.setValue(\"MotoG\", new Double( 40 ) );\n        dataset.setValue(\"\
    Nokia Lumia\", new Double( 10 ) );\n```\n\n![](img/8ddb3ec6e7d677f78107576a1c853ea9_46_0.png)"
