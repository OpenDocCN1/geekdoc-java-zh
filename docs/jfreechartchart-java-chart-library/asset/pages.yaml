  md: '# JFreeChart


    # XYPlot Class


    This is a general class available in org.jfree.chart.plot package and it is used
    for the plotting data in the form of (x,y) pairs. This plot can use data from
    any other class that implements the XYDataSet Interface. XYPlot makes use of a
    XYItemRenderer to draw each point on the plot.


    # Class Constructor


    | S.N. | Constructor and Description |

    |---|---|

    | 1 | **XYPlot()**nThis constructor creates a new XYPlot instance with no dataset,
    no axes and no renderer. |

    | 2 | **XYPlot(XYDataSet dataset, ValueAxis domainAxis, ValueAxis rangeAxis, XYItemRenderer
    renderer)**This constructor creates a new plot with the specified dataset, axes,
    and renderer. |


    # Class Method


    | S.N. | Method and Description |

    |---|---|

    | 1 | **setRenderer(XYItemRenderer renderer)**nThis method sets the renderer for
    the primary dataset and sends a change event to all registered listeners. |


    # NumberAxis Class


    This class is available in org.jfree.chart.axis package and it can access the
    numerical data of any axis. When we set the range of any axis to default, it fits
    according to the range of the data. But by using NumberAxis, class we can set
    the lower margin and upper margin of domain and range axes.


