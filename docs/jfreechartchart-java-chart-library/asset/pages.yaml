  md: "# 11. JFreeChart – TimeSeries Chart\n\nA time series chart displays sequence\
    \ of data points, which varies at equal intervals of time. This chapter demonstrates\
    \ — how we can use JFreeChart to create Time Series Chart from a given set of\
