    define different types of datasets to construct charts.


    # PieDataset


    This is an interface used as a general purpose dataset, where values are associated
    with keys. The name suggests, you can use this dataset to supply data for pie
    charts. This interface extends KeyedValues and DataSet interfaces. All the methods
    used for this interface are taken from KeyedValues, Values, and Dataset interfaces.


    # DefaultPieDataset Class


    This is a Default implementation class of a PieDataset interface.


    # Class Constructor


    | S.N. | Constructor and Description |

    |---|---||

    | 1 | **DefaultPieDataset()** <br>This constructor creates a new dataset, initially
    empty.<br>**DefaultPieDataset(KeyedValues data)** |

    | 2 | It creates a new dataset by copying data from a **KeyedValues** instance.
    |


    # Class Method


    | S.N. | Method and Description |

    |---|---||

    | 1 | **setValue(java.lang.Comparable key, double value)** <br>It sets the data
    value for a key and sends a **DatasetChangeEvent** to all registered listeners.
    |

    | 2 | **setValue(java.lang.Comparable key, java.lang.Number value)** <br>It sets
    the data value for a key and sends a **DatasetChangeEvent** to all registered
    listeners. |


    # SeriesException Class


    This is an exception class. It raises an exception occurred in the time series
    of data in the dataset. Exceptions are raised on the occurrence of duplicate or
    invalid data. The time series must not be applied with duplicates and the format
    must be valid.


