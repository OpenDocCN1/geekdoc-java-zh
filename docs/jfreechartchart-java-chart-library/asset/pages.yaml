  md: '# 1. JFreeChart – Overview


    A chart is a graphical representation of information. There are various tools
    available, which can be used to create different types of charts. The JFreeChart
    project was founded in February 2000, by David Gilbert. Today, it is the most
    used charting library among Java developers.


    This tutorial will help you understand exactly what JFreeChart is, why it is required,
    and the various ways to create different types of charts within a Java-based application
    or independently.


    # What is JFreeChart?


    JFreeChart is an open source library developed in Java. It can be used with Java
    based applications to create a wide range of charts. By using JFreeChart, we can
    create all the major type of 2D and 3D charts such as pie chart, bar chart, line
    chart, XY chart and 3D charts.


    # Why JFreeChart?


    JFreeChart is open source and 100% free, which permits usage in the commercial
    applications without any cost. We have enlisted here some more points in favor
    of why you should use JFreeChart:


    +   * It comes with well documented APIs, which makes it quite easy to understand.

    * It supports a wide range of charts types such as Pie Chart, Line Chart, Bar
    Chart, Area Chart and 3D charts.

    * JFreeChart is easy to extend and can be used in both, the client-side, as well
    as the server-side applications.

    * It supports multiple output formats like PNG, JPEG, PDF, SVG etc.

    * It allows extensive customizations of charts.


    Consider a situation where you are developing an application and you need to show
    the data in the form of charts, and the data itself is populated dynamically.
    In such case, displaying the data in the form of charts using JFreeChart programming
    is very simple.


    ![](img/8ddb3ec6e7d677f78107576a1c853ea9_6_0.png)'
  merge: -1
