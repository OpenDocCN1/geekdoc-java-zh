  md: '# 10. JFreeChart – Bubble Chart


    This chapter demonstrates how you can use JFreeChart to create Bubble Chart from
    a set of business data. A bubble chart displays information in three-dimensional
    way. A bubble is plotted at the place where (x, y) coordinate intersect. The size
    of the bubble is considered as range or quantity of X and Y axis.


    # Business Data


    Let us consider different persons along with their age, weight, and work capacities.
    The wok capacity can be treated as number of hours that is plotted as bubbles
    in the chart.


