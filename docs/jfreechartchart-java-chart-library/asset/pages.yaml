    # PlotOrientation Class


    This is a serialized class available in **org.jfree.chart.plot** package and it
    is used to show the orientation of a 2D plot. The orientation can be either **vertical**
    or **horizontal**. It sets the orientation of Y axis. A conventional plot has
    a vertical Y- axis.


    # Field summary


    | S.N. | Type | Field & Description |

    |---|---|---|

    | 1 | PlotOrientation | **HORIZONTAL** For a plot where the range axis(Y-axis)
    is horizontal. |

    | 2 | PlotOrientation | **VERTICAL** For a plot where the range axis(Y-axis) is
    vertical. This is the default orientation. |


