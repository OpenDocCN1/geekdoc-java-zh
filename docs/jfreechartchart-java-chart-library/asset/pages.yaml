    # Frames in JFreeCharts


    The package is org.jfree.ui. This is the package belongs to JCommons API of JFreeChart.
    It contains utility classes used for creating frames for pre-configured charts.


    # ApplicationFrame


    This is a base class for creating the main frame for simple applications. The
    frame listens for window closing events, and responds by shutting down the JVM.
    This is fine for small demos. For enterprise applications, you need to use something
    more robust. The main core methods in this class are taken from Component, Container,
    Window, Frame, and JFrame classes.


    # Class Constructor


    | S.N. | Constructor and Description |

    |---|---||

    | 1 | ApplicationFrame(java.lang.String title) It creates an application frame
    with the string title. |


    This class helps to create AWT Frames. This is the reason for why we use this
    class as super class in this tutorial examples.


    The methods, which are taken form the parent classes are used for opening a frame,
    closing a frame, changing the size, changing the background or foreground color,
    and listeners.


