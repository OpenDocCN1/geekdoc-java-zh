  md: '# JFreeChart


    # XYZDataset


    This is an interface through which data in the form of (x,y,z) items can be accessed.
    As the name suggests, you can use this dataset to serve XYZ chart. Some of the
    methods in this interface are taken from SeriesDataset.


    # XYSeries


    This is a class, which represents a sequence of zero or more data items in the
    form (x, y). By default, the items in the series are sorted in ascending order
    by x-value, and duplicate x-values are permitted. Both the sorting and duplicate
    defaults can be changed in the constructor. Y-values can be denoted as null to
    represent missing values.


    # Class Constructor


    | S.N. | Constructor and Description |

    | --- | |

    | 1 | **XYSeries(java.lang.Comparable key)**<br>This constructor creates a new
    empty series. |

    | 2 | **XYSeries(java.lang.Comparable key, boolean autoSort)**<br>It constructs
    a new empty series, with the auto-sort flag set as requested, and duplicate values
    are allowed. |

    | 3 | **XYSeries(java.lang.Comparable key, boolean autoSort, boolean allowDuplicates)**<br>It
    constructs a new xy-series that contains no data. |


    # Class Method


    | S.N. | Method and Description |

    | --- | |

    | 1 | **add(double x, double y)**<br>This method adds data item into the series.
    |


    The above method is used in the tutorial example. If you want to learn the remaining
    methods and fields, please refer JFreeChart API.


