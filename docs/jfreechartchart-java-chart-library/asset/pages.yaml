  md: '# Time Series in JFreeCharts


    The package is org.jfree.data.time. This package contains classes and interfaces,
    which are used for the time related data.


    # TimeSeries


    This class represents a sequence of data items in the form of period values, where
    period is some instance of RegularTimePeriod abstract class such as Time, Day,
    Hour, Minute, and Second classes.


    # Class Constructor


    | S.N. | Constructor and Description |

    |---|---|

    | 1 | **TimeSeries(java.lang.Comparable name)** <br>It creates empty series. |

    | 2 | **TimeSeries(java.lang.Comarable name, java.lang.String domain, java.lang.Strin
    range)** <br>It creates new time series that contains no data. |


    # Class Method


    | S.N. | Method and Description |

    |---|---|

    | 1 | **add(RegularTimePeriod period,double value)** <br>This method adds a new
    data item to the series. |


    Refer JFreeChart API for the remaining methods and fields.


    # TimeSeriesCollection


    This class is used as a collection of time series objects. This class implements
    the XYDataset interface, as it extends IntervalXYDataset interface. This makes
    it convenient to collect series data objects.


    # Class Constructor


    | S.N. | Constructor and Description |

    |---|---|

    | 1 | **TimeSeriesCollection()** It constructs an empty dataset, tied to the default
    time zone. |

    | 2 | **TimeSeriesCollection(TimeSeries)** It constructs a dataset containing
    a single series (more can be added), tied to the default time zone. |


