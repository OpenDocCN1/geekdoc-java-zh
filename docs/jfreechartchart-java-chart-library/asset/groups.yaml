- md: "\n# 11. JFreeChart – TimeSeries Chart\n\nA time series chart displays sequence\
    \ of data points, which varies at equal intervals of time. This chapter demonstrates\
    \ how we can use JFreeChart to create Time Series Chart from a given set of business\
    \ data.\n\n## Business Data\n\nLet us consider various random numbers generated\
    \ by using standard Java API Math.random(). We use these numbers to generate a\
    \ Time Series Chart. You can generate similar chart for total number of errors\
    \ occurring in your website at a given interval of time.\n\n## AWT Based Application\n\
    \nFollowing the code to create TimeSeries Chart from the numbers generated by\
    \ Math.random()\n\n```java\nimport org.jfree.chart.ChartFactory;\nimport org.jfree.chart.ChartPanel;\n\
    import org.jfree.chart.JFreeChart;\nimport org.jfree.data.general.SeriesException;\n\
    import org.jfree.data.time.Second;\nimport org.jfree.data.time.TimeSeries;\nimport\
    \ org.jfree.data.time.TimeSeriesCollection;\nimport org.jfree.data.xy.XYDataset;\n\
    import org.jfree.ui.ApplicationFrame;\nimport org.jfree.ui.RefineryUtilities;\n\
    \npublic class TimeSeries_AWT extends ApplicationFrame {\n    public TimeSeries_AWT(final\
    \ String title ) {\n        super( title );\n        final XYDataset dataset =\
    \ createDataset( );\n        final JFreeChart chart = createChart( dataset );\n\
    \        final ChartPanel chartPanel = new ChartPanel( chart );\n        chartPanel.setPreferredSize(new\
    \ java.awt.Dimension( 560 , 370 ) );\n        chartPanel.setMouseZoomable( true\
    \ , false );\n        setContentPane(chartPanel );\n    }\n```\n\n![](img/8ddb3ec6e7d677f78107576a1c853ea9_56_0.png)\n\
    \n```java\n}private XYDataset createdDataset( )\n{\n    final TimeSeries series\
    \ = new TimeSeries(\"Random Data\" );\n    Second current = new Second();\n  \
    \  double value = 100.0;\n    for (int i = 0; i < 4000; i++)\n    {\n        try\n\
    \        {\n            value = value + Math.random() - 0.5;\n            series.add(current,\
    \ new Double( value ) );\n            current = ( Second ) current.next();\n \
    \       }\n        catch ( SeriesException e )\n        {\n            System.err.println(\"\
    Error adding to series\");\n        }\n    }\n\n    return new TimeSeriesCollection(series);\n\
    }\n\nprivate JFreeChart createChart( final XYDataset dataset )\n{\n    return\
    \ ChartFactory.createTimeSeriesChart(\n        \"Computing Test\",\n        \"\
    Seconds\",\n        \"Value\",\n        dataset,\n        false,\n        false,\n\
    \        false);\n}\n\npublic static void main( final String[ ] args)\n{\n  final\
    \ String title = \"Time Series Management\";\n  final TimeSeries_AWT demo = new\
    \ TimeSeries_AWT( title );\n  demo.pack();\n  RefineryUtilities.positionFrameRandomly(\
    \ demo );\n  demo.setVisible( true );\n}\n```\n\nLet us keep the above Java code\
    \ in TimeSeries_AWT.java file, and compile and run it from the command prompted\
    \ as:\n\n```bash\n$javac TimeSeries_AWT.java\n$java TimeSeries_AWT\n```\n\nIf\
    \ everything is fine, it will compile and run to generate the following Time Series\
    \ Graph:\n\n![](img/8ddb3ec6e7d677f78107576a1c853ea9_58_0.png)\n\n## JPEG Image\
    \ Creation\n\nLet us re-write the above example to generate a JPEG image from\
    \ a command line.\n\n```java\nimport java.io.*;\nimport org.jfree.chart.ChartFactory;\n\
    import org.jfree.chart.JFreeChart;\nimport org.jfree.data.general.SeriesException;\n\
    import org.jfree.data.time.Second;\nimport org.jfree.data.time.TimeSeries;\nimport\
    \ org.jfree.data.time.TimeSeriesCollection;\nimport org.jfree.data.xy.XYDataset;\n\
    import org.jfree.chart.ChartUtilities;\n\npublic class TimeSeriesChart\n{\n  \
    \  public static void main(final String[ ] args) throws Exception {\n        final\
    \ TimeSeries series = new TimeSeries(\"Random Data\");\n        Second current\
    \ = new Second();\n        double value = 100.0;\n        for (int i = 0; i <\
    \ 4000; i++) {\n            try {\n                value = value + Math.random()\
    \ - 0.5;\n                series.add(current, new Double( value ) );\n       \
    \         current = ( Second ) current.next();\n            } catch ( SeriesException\
    \ e ) {\n                System.err.println(\"Error adding to series\");\n   \
    \         }\n        }\n        final XYDataset dataset = (XYDataset) new TimeSeriesCollection(series);\n\
    \        JFreeChart timechart = ChartFactory.createTimeSeriesChart(\n        \
    \    \"Computing Test\",\n            \"Seconds\",\n            \"Value\",\n \
    \           dataset,\n            false,\n            false,\n            false);\n\
    \n        int width = 560; /* Width of the image */\n        int height = 370;\
    \ /* Height of the image */\n        File timeChart = new File(\"TimeChart.jpeg\"\
    );\n        ChartUtilities.saveChartAsJPEG(timeChart, timechart, width, height);\n\
    \    }\n}\n```\n\nLet us keep the above Java code in TimeSeriesChart.java, then\
    \ compile and run it from the command prompt as:\n\n```bash\n$javac TimeSeriesChart.java\n\
    $java TimeSeriesChart\n```\n\nIf everything is fine with your environment, it\
    \ will compile and run to create a JPEG image **TimeChart.jpeg** in your directory.\n\
    \n## 12. JFreeChart – File Interface\n\nSo far we studied how to create various\
    \ types of charts using JFreeChart APIs as static data. But in production environment,\
    \ data is provided in the form of text file with a predefined format or it comes\
    \ directly from the database. This chapter will explain how we can read simple\
    \ data from a given text file from a given location and then use JFreeChart to\
    \ create a chart of your choice.\n\n## Business Data\n\nConsider we have a file\
    \ named mobile.txt, having different mobile brands and their sale (units per day)\
    \ separated by a simple comma (,);\n\n| Iphone 5S | 20 |\n| Samsung Grand | 20\
    \ |\n| Moto G | 40 |\n| Lumia | 10 |\n\n## Chart Generation Based on File\n\n\
    Following is the code to create a Pie Chart based on the information provided\
    \ in mobile.txt:\n\n```java\nimport java.io.*;\nimport java.util.StringTokenizer;\n\
    import org.jfree.chart.ChartUtilities;\nimport org.jfree.chart.ChartFactory;\n\
    import org.jfree.chart.JFreeChart;\nimport org.jfree.chart.data.general.DefaultPieDataset;\n\
    \npublic class PieChart_File\n{\n    public static void main(String[] args) throws\
    \ Exception\n    {\n        String mobilebrands[] = {\n            \"iPhone 5s\"\
    ,\n            \"Samsung Grand\",\n            \"MotoG\",\n            \"Nokia\
    \ Lumia\"\n        };\n    }\n};\n```\n\n![](img/8ddb3ec6e7d677f78107576a1c853ea9_61_0.png)\n\
    \n## JFreeChart\n\nWe keep the above Java code in **PieChart_File.java** file,\
    \ and then compile and run it from the command prompt:\n\n```bash\n$javac PieChart_File.java\n\
    $java PieChart_File\n```\n\n![](img/8ddb3ec6e7d677f78107576a1c853ea9_62_0.png)\n\
    \nIf everything is fine, it will compile and run to create a JPEG image file named\
    \ PieChart.jpeg that contains the following chart.\n\n## Mobile Sales\n\n![](img/8ddb3ec6e7d677f78107576a1c853ea9_63_0.png)\n\
    \n# 13. JFreeChart – Database Interface\n\nThis chapter explains how you can read\
    \ simple data from a database table and then use JFreeChart to create a chart\
    \ of your choice.\n\n## Business Data\n\nConsider we have the following MySQL\
    \ table mobile_tbl(mobile_brand VARCHAR(100) NOT NULL, unit_sale INT NOT NULL);\
    \ Consider this table is having the following records:\n\n| Mobile Brands | Unit\
    \ Sales |\n|---|---|\n| iPhone5S | 20 |\n| Samsung Grand | 20 |\n| MotoG | 40\
    \ |\n| Nokia Lumia | 10 |\n\n## Chart Generation Using Database\n\nFollowing is\
    \ the code to create a Pie Chart based on the information provided in mobile_tbl\
    \ table available in test_db in a MySQL database. Based on your requirements,\
    \ you can use any other database.\n\n```java\nimport java.io.*;\nimport java.sql.*;\n\
    import org.jfree.chart.ChartUtilities;\nimport org.jfree.chart.ChartFactory;\n\
    import org.jfree.chart.JFreeChart;\nimport org.jfree.chart.data.DefaultPieDataset;\n\
    \npublic class PieChart_DB\n{\n    public static void main(String[] args) throws\
    \ Exception\n    {\n        String mobilebrands[] = {\n            \"iPhone 5s\"\
    ,\n            \"Samsung Grand\",\n            \"MotoG\",\n        }\n\n     \
    \   /* Create MySQL Database Connection */\n        Class.forName(\"com.mysql.jdbc.Driver\"\
    );\n        Connection connection = DriverManager.getConnection(\n           \
    \ \"jdbc:mysql://localhost:3306/jf_testdb\",\n            \"root\",\n        \
    \    \"root123\");\n\n        Statement statement = connection.createStatement();\n\
    \        ResultSet result = statement.executeQuery(\"select * from dataset_tb\"\
    );\n        DefaultPieDataset dataset = new DefaultPieDataset();\n        while\
    \ (result.next()) {\n            dataset.setValue(\n                result.getString(\"\
    brandname\"),\n                Double.parseDouble(result.getString(\"datavalue\"\
    )));\n        }\n        JFreeChart chart = ChartFactory.createPieChart(\n   \
    \         \"Mobile Sales\", // chart title\n            dataset, // data\n   \
    \         true, // include legend\n            true, // include legend\n     \
    \       false);\n\n        int width = 560; /* Width of the image */\n       \
    \ int height = 370; /* Height of the image */\n        File pieChart = new File(\"\
    Pie-Chart.jpeg\");\n        ChartUtilities.saveChartAsJPEG(pieChart, chart, width,\
    \ height);\n    }\n}\n```\n\n![](img/8ddb3ec6e7d677f78107576a1c853ea9_64_0.png)\n"
  mdcn: "\n\n# 11. JFreeChart – 时间序列图 (TimeSeries Chart)\n\n时间序列图显示了在相等时间间隔内变化数据点序列。本章将演示如何使用\
    \ JFreeChart 根据给定的业务数据创建时间序列图。\n\n## 业务数据\n\n让我们考虑使用标准 Java API `Math.random()`\
    \ 生成的各种随机数。我们使用这些数字来生成时间序列图。你可以根据你的网站在特定时间间隔内发生的错误总数生成类似的图表。\n\n## 基于 AWT 的应用程序\n\
    \n遵循以下代码，通过 `Math.random()` 生成的数字创建时间序列图：\n\n```java\nimport org.jfree.chart.ChartFactory;\n\
    import org.jfree.chart.ChartPanel;\nimport org.jfree.chart.JFreeChart;\nimport\
    \ org.jfree.data.general.SeriesException;\nimport org.jfree.data.time.Second;\n\
    import org.jfree.data.time.TimeSeries;\nimport org.jfree.data.time.TimeSeriesCollection;\n\
    import org.jfree.data.xy.XYDataset;\nimport org.jfree.ui.ApplicationFrame;\nimport\
    \ org.jfree.ui.RefineryUtilities;\n\npublic class TimeSeries_AWT extends ApplicationFrame\
    \ {\n    public TimeSeries_AWT(final String title ) {\n        super( title );\n\
    \        final XYDataset dataset = createDataset( );\n        final JFreeChart\
    \ chart = createChart( dataset );\n        final ChartPanel chartPanel = new ChartPanel(\
    \ chart );\n        chartPanel.setPreferredSize(new java.awt.Dimension( 560 ,\
    \ 370 ) );\n        chartPanel.setMouseZoomable( true , false );\n        setContentPane(chartPanel\
    \ );\n    }\n```\n\n![](img/8ddb3ec6e7d677f78107576a1c853ea9_56_0.png)\n\n```java\n\
    }private XYDataset createdDataset( )\n{\n    final TimeSeries series = new TimeSeries(\"\
    Random Data\" );\n    Second current = new Second();\n    double value = 100.0;\n\
    \    for (int i = 0; i < 4000; i++)\n    {\n        try\n        {\n         \
    \   value = value + Math.random() - 0.5;\n            series.add(current, new\
    \ Double( value ) );\n            current = ( Second ) current.next();\n     \
    \   }\n        catch ( SeriesException e )\n        {\n            System.err.println(\"\
    Error adding to series\");\n        }\n    }\n\n    return new TimeSeriesCollection(series);\n\
    }\n\nprivate JFreeChart createChart( final XYDataset dataset )\n{\n    return\
    \ ChartFactory.createTimeSeriesChart(\n        \"Computing Test\",\n        \"\
    Seconds\",\n        \"Value\",\n        dataset,\n        false,\n        false,\n\
    \        false);\n}\n\npublic static void main( final String[ ] args)\n{\n  final\
    \ String title = \"Time Series Management\";\n  final TimeSeries_AWT demo = new\
    \ TimeSeries_AWT( title );\n  demo.pack();\n  RefineryUtilities.positionFrameRandomly(\
    \ demo );\n  demo.setVisible( true );\n}\n```\n\n将上述 Java 代码保存在 `TimeSeries_AWT.java`\
    \ 文件中，并在命令行提示符中编译并运行：\n\n```bash\n$javac TimeSeries_AWT.java\n$java TimeSeries_AWT\n\
    ```\n\n如果一切正常，它将编译并运行，生成以下时间序列图：\n\n![](img/8ddb3ec6e7d677f78107576a1c853ea9_58_0.png)\n\
    \n## 创建 JPEG \n\n让我们重写上述示例，从命令行生成 JPEG 图像。\n\n```java\nimport java.io.*;\nimport\
    \ org.jfree.chart.ChartFactory;\nimport org.jfree.chart.JFreeChart;\nimport org.jfree.data.general.SeriesException;\n\
    import org.jfree.data.time.Second;\nimport org.jfree.data.time.TimeSeries;\nimport\
    \ org.jfree.data.time.TimeSeriesCollection;\nimport org.jfree.data.xy.XYDataset;\n\
    import org.jfree.chart.ChartUtilities;\n\npublic class TimeSeriesChart\n{\n  \
    \  public static void main(final String[ ] args) throws Exception {\n        final\
    \ TimeSeries series = new TimeSeries(\"Random Data\");\n        Second current\
    \ = new Second();\n        double value = 100.0;\n        for (int i = 0; i <\
    \ 4000; i++) {\n            try {\n                value = value + Math.random()\
    \ - 0.5;\n                series.add(current, new Double( value ) );\n       \
    \         current = ( Second ) current.next();\n            } catch ( SeriesException\
    \ e ) {\n                System.err.println(\"Error adding to series\");\n   \
    \         }\n        }\n        final XYDataset dataset = (XYDataset) new TimeSeriesCollection(series);\n\
    \        JFreeChart timechart = ChartFactory.createTimeSeriesChart(\n        \
    \    \"Computing Test\",\n            \"Seconds\",\n            \"Value\",\n \
    \           dataset,\n            false,\n            false,\n            false);\n\
    \n        int width = 560; /* 图像宽度 */\n        int height = 370; /* 图像高度 */\n\
    \        File timeChart = new File(\"TimeChart.jpeg\");\n        ChartUtilities.saveChartAsJPEG(timeChart,\
    \ timechart, width, height);\n    }\n}\n```\n\n将上述 Java 代码保存在 `TimeSeriesChart.java`\
    \ 中，然后在命令行提示符中编译并运行：\n\n```bash\n$javac TimeSeriesChart.java\n$java TimeSeriesChart\n\
    ```\n\n如果一切正常，它将编译并在你的目录下创建 **TimeChart.jpeg** JPEG 图像。\n\n## 12. JFreeChart –\
    \ 文件接口\n\n到目前，我们学习了如何使用 JFreeChart API 使用静态数据创建各种类型的图表。但在生产环境中，数据是以预定义格式的文本文件提供的或直接来自数据库。本章将解释如何从指定的文本文件中读取简单数据，然后使用\
    \ JFreeChart 创建你所需的图表。\n\n## 业务数据\n\n假设我们有一个名为 `mobile.txt` 的文件，包含不同的手机品牌及其销量（每天），用逗号分隔：\n\
    \n| Iphone 5S | 20 |\n| Samsung Grand | 20 |\n| Moto G | 40 |\n| Lumia | 10 |\n\
    \n## 基于文件的图表生成\n\n以下根据 `mobile.txt` 中的信息创建饼图的代码：\n\n```java\nimport java.io.*;\n\
    import java.util.StringTokenizer;\nimport org.jfree.chart.ChartUtilities;\nimport\
    \ org.jfree.chart.ChartFactory;\nimport org.jfree.chart.JFreeChart;\nimport org.jfree.chart.data.general.DefaultPieDataset;\n\
    \npublic class PieChart_File\n{\n    public static void main(String[] args) throws\
    \ Exception\n    {\n        String mobilebrands[] = {\n            \"iPhone 5s\"\
    ,\n            \"Samsung Grand\",\n            \"MotoG\",\n            \"Nokia\
    \ Lumia\"\n        };\n    }\n};\n```\n\n![](img/8ddb3ec6e7d677f78107576a1c853ea9_61_0.png)\n\
    \n## JFreeChart\n\n我们将上述 Java 代码保存在 **PieChart_File.java** 文件中，然后在命令行提示符中编译并运行：\n\
    \n```bash\n$javac PieChart_File.java\n$java PieChart_File\n```\n\n![](img/8ddb3ec6e7d677f78107576a1c853ea9_62_0.png)\n\
    \n如果一切正常，它将编译并运行创建一个名为 `PieChart.jpeg` 的 JPEG 图像文件，其中包含以下图表。\n\n## 手机销量\n\n![](img/8ddb3ec6e7d677f78107576a1c853ea9_63_0.png)\n\
    \n# 13. JFreeChart – 数据库接口\n\n本章解释你如何从数据库表中读取简单数据，然后使用 JFreeChart 创建你所需的图表。\n\n\
    ## 业务数据\n\n假设我们有以下 MySQL 表 `mobile_tbl(mobile_brand VARCHAR(100) NOT NULL, unit_sale\
    \ INT NOT NULL)`。假设此表包含以下记录：\n\n| Mobile Brands | Unit Sales |\n|---|---|\n| iPhone5S\
    \ | 20 |\n| Samsung Grand | 20 |\n| MotoG | 40 |\n| Nokia Lumia | 10 |\n\n## 使用数据库生成图表\n\
    \n以下是根据 MySQL 数据库 `test_db` 中 `mobile_tbl` 表提供的信息创建饼图的代码。根据你的需求，可以使用任何其他数据库。\n\
    \n```java\nimport java.io.*;\nimport java.sql.*;\nimport org.jfree.chart.ChartUtilities;\n\
    import org.jfree.chart.ChartFactory;\nimport org.jfree.chart.JFreeChart;\nimport\
    \ org.jfree.chart.data.DefaultPieDataset;\n\npublic class PieChart_DB\n{\n   \
    \ public static void main(String[] args) throws Exception\n    {\n        String\
    \ mobilebrands[] = {\n            \"iPhone 5s\",\n            \"Samsung Grand\"\
    ,\n            \"MotoG\",\n        }\n\n        /* 创建 MySQL 数据库连接 */\n       \
    \ Class.forName(\"com.mysql.jdbc.Driver\");\n        Connection connection = DriverManager.getConnection(\n\
    \            \"jdbc:mysql://localhost:3306/jf_testdb\",\n            \"root\"\
    ,\n            \"root123\");\n\n        Statement statement = connection.createStatement();\n\
    \        ResultSet result = statement.executeQuery(\"select * from dataset_tb\"\
    );\n        DefaultPieDataset dataset = new DefaultPieDataset();\n        while\
    \ (result.next()) {\n            dataset.setValue(\n                result.getString(\"\
    brandname\"),\n                Double.parseDouble(result.getString(\"datavalue\"\
    )));\n        }\n        JFreeChart chart = ChartFactory.createPieChart(\n   \
    \         \"Mobile Sales\", // 图表标题\n            dataset, // 数据\n            true,\
    \ // 显示图例\n            true, // 显示图例\n            false);\n\n        int width\
    \ = 560; /* 图像宽度 */\n        int height = 370; /* 图像高度 */\n        File pieChart\
    \ = new File(\"Pie-Chart.jpeg\");\n        ChartUtilities.saveChartAsJPEG(pieChart,\
    \ chart, width, height);\n    }\n}\n```\n\n![](img/8ddb3ec6e7d677f78107576a1c853ea9_64_0.png)\n\
    \n"
