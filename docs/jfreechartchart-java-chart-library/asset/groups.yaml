- md: "\n## Class Method\n\n| S.N. | Method and Description |\n|---|---|\n| 1 | **setLowerMargin(double\
    \ margin)** It sets the lower margin for the axis (as a percentage of the range)\
    \ and sends an AxisChangeEvent to all registered listeners. This method is taken\
    \ from parent class of ValueAxis. |\n| 2 | **setUpperMargin(double margin)** It\
    \ sets the upper margin for the axis (as a percentage of the range) and sends\
    \ an AxisChangeEvent to all registered listeners. |\n\n## XYLineShapeRenderer\
    \ Class\n\nThis is the class available under org.jfree.chart.xy package which\
    \ takes care of connecting data points with lines and draws shapes at each data\
    \ point. This renderer is designed for use with **XYPlot** class.\n\n### Class\
    \ Constructor\n\n| S.N. | Constructor and Description |\n|---|---|\n| 1 | **XYLineShapeRenderer()**\
    \ It creates a new renderer with lines and shapes visible. |\n| 2 | **XYLineShapeRenderer(boolean\
    \ lines, boolean shapes)** It creates a new renderer with specific property.\n\
    \n### Class Method\n\n| S.N. | Method and Description |\n|---|---|\n| 1 | **setSeriesPaint(int\
    \ series, java.awt.Paint paint)** This method sets the paint used for series and\
    \ sends an AxisChangeEvent to all registered listeners. This method is taken from\
    \ AbstractRenderer in JFreeChart API. |\n| 2 | **setSeriesStroke(int series, java.awt.Stroke\
    \ stroke)** This method sets the stroke used for series and sends an AxisChangeEvent\
    \ to all registered listeners. This method is taken from AbstractRenderer, which\
    \ is super class of this package. |\n\n![](img/8ddb3ec6e7d677f78107576a1c85ea9_19.png)\n\
    \n## XYItemRenderer\n\nThis is an interface for rendering a single (x, y) item\
    \ on an XYPlot. The package is org.jfree.data.general which has classes and interfaces\
    \ to define different types of datasets to construct charts.\n\n## PieDataset\n\
    \nThis is an interface used as a general purpose dataset where values are associated\
    \ with keys. The name suggests you can use this dataset to supply data for pie\
    \ charts. This interface extends KeyValues and Dataset interfaces. All the methods\
    \ used for this interface are taken from KeyValues and Dataset interfaces.\n\n\
    ## DefaultPieDataset Class\n\nThis is a Default implementation of PieDataset interface.\n\
    \n### Class Constructor\n\n| S.N. | Constructor and Description |\n|---|---|\n\
    | 1 | **DefaultPieDataset()** This constructor creates a new initially empty dataset.\
    \ |\n| 2 | **DefaultPieDataset(KeyValues data)** It creates a new dataset by copying\
    \ data from a KeyValues instance. |\n\n### Class Method\n\n| S.N. | Method and\
    \ Description |\n|---|---|\n| 1 | **setValue(java.lang.Comparable key, double\
    \ value)** It sets the data value for a key and sends a DatasetChangeEvent to\
    \ all registered listeners. |\n| 2 | **setValue(java.lang.Comparable key, java.lang.Number\
    \ value)** It sets the data value for a key and sends a DatasetChangeEvent to\
    \ all registered listeners. |\n\n## SeriesException Class\n\nThis is an exception\
    \ class. It raises an exception occurred in the time series of data in the dataset.\
    \ Exceptions are raised on the occurrence of duplicate or invalid data. The time\
    \ series must not applied with duplicates and the format must be valid.\n\n![](img/8ddb3ec6e7d677f78107576a1c85ea9_20.png)\n\
    \n## DefaultCategoryDataset\n\nThis is a default implementation class of CategoryDataset\
    \ interface.\n\n### Class Constructor\n\n| S.N. | Constructor and Description\
    \ |\n|---|---|\n| 1 | **DefaultCategoryDataset()** This constructor creates a\
    \ new empty dataset. |\n\n### Class Method\n\n| S.N. | Method and Description\
    \ |\n|---|---|\n| 1 | **addValue(double value, java.lang.Comparable rowKey, java.lang.Comparable\
    \ columnKey)** This method adds a value to the table using comparable keys. |\n\
    | 2 | **addValue(java.lang.Number value, java.lang.Comparable rowKey, java.lang.Comparable\
    \ columnKey)** This method adds a value to the table. |\n| 3 | **setValue(double\
    \ value, java.lang.Comparable rowKey, java.lang.Comparable columnKey)** This method\
    \ adds or updates a value in the table and sends a DatasetChangeEvent to all registered\
    \ listeners. |\n| 4 | **setValue(java.lang.Number value, java.lang.Comparable\
    \ rowKey, java.lang.Comparable columnKey)** This method adds or updates a value\
    \ in the table and sends a DatasetChangeEvent to all registered listeners. |\n\
    \nRefer FreeChart API for more information on various other methods and fields.\n\
    \n## Series Datasets\n\nThe series dataset is used by XY charts. The package is\
    \ org.jfree.data.xy, which contains classes and interfaces belonging to xy charts.\
