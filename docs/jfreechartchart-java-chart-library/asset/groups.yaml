    # 5. JFreeChart – 饼图\n\n在饼图中，每个扇区的弧长度与其代表的数量成正比。本章将演示 — 我们如何如何使用 JFreeChart 从给定的业务数据集中创建饼图。\n\
    \n# 业务数据\n\n接下来的示例通过饼图展示了手机销售情况。以下是不同手机品牌及其销量（每天单位：台）。\n\n| S.N. | 手机品牌 | 销量（每天单位：台）\
