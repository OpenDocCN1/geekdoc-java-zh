    \n# 5. JFreeChart – Pie Chart\n\nIn a pie chart, the arc length of each sector\
    \ is proportional to the quantity that it represents. This chapter demonstrates\
    \ — how we can use JFreeChart to create Pie Chart from a given set of business\
    \ data.\n\n# Business data\n\nThe following example depicts mobile sale with the\
    \ help of a pie chart. Following is a list of different mobile brands and their\
    \ sales (units per day).\n\n| S.N. | Mobile Brands | Sales (UNITS per day) |\n\
    |---|---|---|\n| 1 | Iphone 5S | 20 |\n| 2 | Samsung Grand | 20 |\n| 3 | MOTO\
    \ G | 40 |\n| 4 | Nokia Lumia | 10 |\n\n# AWT Based Application\n\nFollowing is\
    \ the code to create a Pie Chart by the above given information. This code helps\
    \ you to embed a pie chart in any AWT based application.\n\n```\nimport javax.swing.JPanel;\n\
    import org.jfree.chart.ChartFactory;\nimport org.jfree.chart.ChartPanel;\nimport\
    \ org.jfree.chart.JFreeChart;\nimport org.jfree.chart.data.general.DefaultDataset;\n\
    import org.jfree.chart.data.general.PieDataset;\nimport org.jfree.ui.ApplicationFrame;\n\
    import org.jfree.ui.RefineryUtilities;\n\npublic class PieChart_AWT extends ApplicationFrame\n\
    {\n    public PieChart_AWT( String title )\n    {\n        super( title);\n  \
    \      setContent(createPanel());\n    }\n    private static PieDataset createDataset()\n\
    \    {\n      DefaultPieDataset dataset = new DefaultPieDataset();\n      dataset.setValue(\"\
    iPhone 5s\", new Double(20));\n      dataset.setValue(\"Samsung Grand\", new Double(20));\n\
    \      dataset.setValue(\"MotoG\", new Double(40));\n      dataset.setValue(\"\
    Nokia Lumia\", new Double(10));\n      return dataset;\n    }\n    private static\
    \ JFreeChart createChart(PieDataset dataset)\n    {\n      JFreeChart chart =\
    \ ChartFactory.createPieChart(\n        \"Mobile Sales\", // chart title\n   \
    \     dataset, // data\n        true, // include legend\n        true,\n     \
    \   false);\n\n      return chart;\n    }\n    public static JPanel createPanel()\n\
    \    {\n      JFreeChart chart = createChart(createDataset());\n      return new\
    \ ChartPanel(chart);\n    }\n    public static void main(String[] args)\n    {\n\
    \      PieChart_AWT demo = new PieChart_AWT(\"Mobile Sales\");\n      demo.setSize(560,\
    \ 360);\n      RefineryUtilities.centerFrameOnScreen(demo);\n      demo.setVisible(true);\n\
    \    }\n```\n\nLet us keep the above Java code in PieChart_AWT.java, and then\
    \ compile and run it from the command prompted as:\n\n```\n$javac PieChart_AWT.java\n\
    $java PieChart_AWT\n```\n\nIf everything is fine, it will compile and run to generate\
    \ the following Pie Graph:\n\n# Mobile Sales\n\n![](img/8ddb3ec6e7d677f78107576a1c853ea9_30_0.png)\n\
    \nIf you do not need to embed your chart in any application, then you can create\
    \ images at command prompt. JFreeChart allows you to save chart images in either\
    \ JPG or PNG formats.\n\n# JPEG Image Creation\n\nLet us rewrite the above to\
    \ generate a JPEG image from a command line. Following are the APIs provided by\
    \ JFreeChart library, which you can use to generate either PNG or JPEG image as\
    \ per your requirement.\n\n- saveChartAsPNG() - API to save image in PNG format.\n\
    - saveChartAsJPEG() - API to save image in JPEG format.\n\n```\nimport java.io.*;\n\
    import org.jfree.chart.ChartUtilities;\nimport org.jfree.chart.ChartFactory;\n\
    import org.jfree.chart.JFreeChart;\nimport org.jfree.chart.data.DefaultPieDataset;\n\
    \npublic class PieChart {\n    public static void main(String[] args) throws Exception\n\
    \    {\n      DefaultPieDataset dataset = new DefaultPieDataset();\n      dataset.setValue(\"\
    Iphone 5s\", new Double(20));\n      dataset.setValue(\"Samung Grand\", new Double(20));\n\
    \      dataset.setValue(\"Motog\", new Double(40));\n      dataset.setValue(\"\
    Nokia Lumia\", new Double(10));\n\n      JFreeChart chart = ChartFactory.createPieChart(\n\
    \        \"Mobile Sales\", // chart title\n        dataset, // data\n        true,\
    \ // include legend\n        true,\n        false);\n\n      int width = 640;\
    \ /* Width of the image */\n      int height = 480; /* Height of the image */\n\
    \      File pieChart = new File(\"PieChart.jpeg\");\n      ChartUtilities.saveChartAsJPEG(pieChart,\
    \ chart, width, height);\n    }\n```\n\nLet us keep the Java code in PieChart.java\
    \ file, and then compile and run it from the command prompted as:\n\n```\n$javac\
    \ PieChart.java\n$java PieChart\n```\n\nIf everything is fine, it will compile\
    \ and run to create a JPEG image file named PieChart.jpeg in your current directory.\n\
    \n# 6. JFreeChart – Bar Chart\n\nThis chapter demonstrates how you can use JFreeChart\
    \ to create Bar Chart from a given set of business data.\n\nA bar chart uses different\
    \ orientation (horizontal or vertical) bars to show comparisons in various categories.\
    \ One axis (domain axis) of the chart shows the specific domain compared, and\
    \ the other axis (range axis) represents discrete values.\n\n# Business Data\n\
    \nThe following example depicts various car statistics with the help of a bar\
    \ chart. Following is a list of car brands with their different characteristics,\
    \ which we will show using a bar chart:\n\n| Car | Speed | User Rating | Millage\
    \ | Safety |\n|---|---|---|---|---|\n| Fiat | 1.0 | 3.0 | 5.0 | 5.0 |\n| Audi\
    \ | 5.0 | 6.0 | 10.0 | 4.0 |\n| Ford | 4.0 | 2.0 | 3.0 | 6.0 |\n\n# AWT Based\
    \ Application\n\nFollowing is the code to create a Bar Chart from the above given\
    \ information. This code helps you to embed a bar chart in any AWT based application.\n\
    \n```\nimport org.jfree.chart.ChartFactory;\nimport org.jfree.chart.ChartPanel;\n\
    import org.jfree.chart.JFreeChart;\nimport org.jfree.chart.plot.Orientation;\n\
    import org.jfree.data.category.CategoryDataset;\nimport org.jfree.data.category.DefaultCategoryDataset;\n\
    import org.jfree.ui.ApplicationFrame;\nimport org.jfree.ui.RefineryUtilities;\n\
    \npublic class BarChart_AWT extends ApplicationFrame\n{\n    public BarChart_AWT(String\
    \ applicationTitle, String chartTitle)\n    {\n        super(applicationTitle);\n\
    \    }\n    private static CategoryDataset createDataset()\n    {\n      DefaultCategoryDataset\
    \ dataset = new DefaultCategoryDataset();\n      dataset.addValue(1.0, \"Speed\"\
    , \"Fiat\");\n      dataset.addValue(3.0, \"User Rating\", \"Fiat\");\n      dataset.addValue(5.0,\
    \ \"Millage\", \"Fiat\");\n      dataset.addValue(5.0, \"Safety\", \"Fiat\");\n\
    \      dataset.addValue(5.0, \"Speed\", \"Audi\");\n      dataset.addValue(6.0,\
    \ \"User Rating\", \"Audi\");\n      dataset.addValue(10.0, \"Millage\", \"Audi\"\
    );\n      dataset.addValue(4.0, \"Safety\", \"Audi\");\n      dataset.addValue(4.0,\
    \ \"Speed\", \"Ford\");\n      dataset.addValue(2.0, \"User Rating\", \"Ford\"\
    );\n      dataset.addValue(3.0, \"Millage\", \"Ford\");\n      dataset.addValue(6.0,\
    \ \"Safety\", \"Ford\");\n      return dataset;\n    }\n    private static JFreeChart\
    \ createChart(CategoryDataset dataset)\n    {\n      JFreeChart chart = ChartFactory.createBarChart(\n\
    \        \"Car Statistics\", // chart title\n        \"Car\", // x-axis label\n\
    \        \"Value\", // y-axis label\n        dataset,\n        Orientation.VERTICAL,\n\
    \        false);\n\n      return chart;\n    }\n    public static JPanel createPanel()\n\
    \    {\n      JFreeChart chart = createChart(createDataset());\n      return new\
    \ ChartPanel(chart);\n    }\n    public static void main(String[] args)\n    {\n\
    \      BarChart_AWT demo = new BarChart_AWT(\"Car Statistics\", \"Car Sales\"\
    );\n      demo.setSize(560, 360);\n      RefineryUtilities.centerFrameOnScreen(demo);\n\
    \      demo.setVisible(true);\n    }\n}\n```\n\n![](img/8ddb3ec6e7d677f78107576a1c853ea9_32_0.png)\n"
