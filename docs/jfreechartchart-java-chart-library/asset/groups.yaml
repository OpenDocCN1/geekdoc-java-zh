    ## 1. JFreeChart – Overview


    A chart is a graphical representation of information. There are various tools
    available, which can be used to create different types of charts. The JFreeChart
    project was founded in February 2000, by David Gilbert. Today, it is the most
    used charting library among Java developers.


    This tutorial will help you understand exactly what JFreeChart is, why it is required,
    and the various ways to create different types of charts within a Java-based application
    or independently.


    ## What is JFreeChart?


    JFreeChart is an open source library developed in Java. It can be used with Java
    based applications to create a wide range of charts. By using JFreeChart, we can
    create all the major type of 2D and 3D charts such as pie chart, bar chart, line
    chart, XY chart and 3D charts.


    ## Why JFreeChart?


    JFreeChart is open source and 100% free, which permits usage in the commercial
    applications without any cost. We have enlisted here some more points in favor
    of why you should use JFreeChart:


    - It comes with well documented APIs, which makes it quite easy to understand.

    - It supports a wide range of charts types such as Pie Chart, Line Chart, Bar
    Chart, Area Chart and 3D charts.

    - JFreeChart is easy to extend and can be used in both, the client-side, as well
    as the server-side applications.

    - It supports multiple output formats like PNG, JPEG, PDF, SVG etc.

    - It allows extensive customizations of charts.


    Consider a situation where you are developing an application and you need to show
    the data in the form of charts, and the data itself is populated dynamically.
    In such case, displaying the data in the form of charts using JFreeChart programming
    is very simple.


    ![](img/8ddb3ec6e7d677f78107576a1c853ea9_6_0.png)


    ## 2. JFreeChart – Installation


    JFreeChart is popular for its efficient chart creation and user-friendly installation
    setup. This chapter describes the process of setting up JFreeChart on Windows
    and Linux. User administration is needed while installing JFreeChart.


    ### System Requirements


    | Item | Value |

    | :--- | :--- |

    | JDK | 1.5 or above |

    | Memory | 2GB RAM |

    | Disk Space | No minimum requirement |

    | Operating System Version | Linux or Windows |


    ### Installing JFreeChart


    To install JFreeChart, there are three following steps viz...


    ![](img/8ddb3ec6e7d677f78107576a1c853ea9_7_0.png)


    #### Step 1: Verifying Java Installation

    To verify Java installation, open the console and execute the following **java**
    command:


    | OS | Task | Command |

    | :--- | :--- | :--- |

    | Windows | Open command console | C:>java -version |

    | Linux | Open command terminal | $java -version |


    Once Java installation is done properly, then you should get the following output
    for both the operating systems:


    | OS | Description |

    | :--- | :--- |

    | Windows | Java version "1.7.0_60" Java (TM) SE Runtime Environment (build 1.7.0_60-b19)
    Java HotSpot(TM) 64-bit Server VM (build 24.60-b09,mixed mode) |

    | Linux | Java version "1.7.0_25" OpenJDK Runtime Environment (rhel-2.3.10.4.el6_x86_64)
    OpenJDK 64-Bit Server VM (build 23.7-b01,mixed mode) |


    If you do not have installed, install the Java Software Development Kit (SDK)
    from the link:


    http://www.oracle.com/technwork/java/javase/downloads/index.html


    We assume that you have installed Java 1.7.0_60 version before proceeding for
    this tutorial.


    #### Step 2: Setting JAVA Environment


    Set the JAVA_HOME environment variable to point to the base directory location
    where Java is installed on your machine. For example:


    | OS | Description |

    | :--- | :--- |

    | Windows | Set JAVA_HOME to C:\ProgramFiles\java\jdk1.7.0_60 |

    | Linux | export JAVA_HOME=/usr/local/java |


    Append Java compiler to System Path.


    | OS | Description |

    | :--- | :--- |

    | Windows | Append the String C:\Program Files\Java\jdk1.7.0_60\bin to the end
    of PATH. |

    | Linux | export PATH=$PATH:$JAVA_HOME/bin/ |


    Verify the command java -version from the prompt.


    #### Step 3: Installing JFreeChart


    Download the latest version of JFreeChart.zip from the link http://www.jfree.org/jfreechart/.
    Unzip the downloaded file at any location where required libraries can be linked
    into your Java program. The following image shows the structure of directories
    and files:


    ![](img/8ddb3ec6e7d677f78107576a1c853ea9_8_0.png)


    - 30 Days

    - ChangeLog

    - experimental

    - jfreechart-1.0.18-demo.jar

    - license.txt

    - NEWS

    - pom.xml

    - README.txt

    - tests


    Add complete path of jfreechart-1.0.18.jar and jcommon-1.0.22.jar files to the
    CLSPATH:


    | OS | Description |

    | :--- | :--- |

    | Windows | Append the Strings "C:\jfreechart-1.0.18\lib\jfreechart-1.0.18.jar"
    and "C:\jfreechart-1.0.18\lib\jcommon-1.0.22.jar" to the end of the variable CLSPATH
    |

    | Linux | export CLSPATH=$CLASSPATH:/usr/share/jfreechart-1.0.18/lib/jfreechart-1.0.18.jar:/jcommon-1.0.22.jar
    |


    ## 3. JFreeChart – Architecture


    This chapter explains basic class level and application architectures of JFreeChart
    to give you an idea how JFreeChart interacts with different classes and how it
    fits in your Java based application.


    ### Class Level Architecture


    The class level architecture explains how various classes from the library interact
    with each other to create various types of charts.


    ![](img/8ddb3ec6e7d677f78107576a1c853ea9_10_0.png)


    Following is the detail of units used in the block diagram:


    | Units | Description |

    | :--- | :--- |

    | File | The source having user input to be used for creating a dataset in the
    file. |

    | Database | The source having user input to be used for creating a dataset in
    the database. |

    | Create Dataset | Accepts the dataset and stores the dataset into object. |

    | General Dataset | This type of dataset is mainly used for pie charts. |

    | Category Dataset | This type of dataset is used for bar chart, line chart, etc.
    |


    | Series Dataset | Description |

    | :--- | :--- |

    | Series Dataset | This type of dataset is used for storing series of data and
    construct line charts. |

    | Series Collection Dataset | The different categories of series datasets are
    added to series collection dataset. This type of dataset is used for XYLine Charts.
    |

    | Create Chart | This is the method, which is executed to create final chart.
    |

    | Frame/Image | The chart is displayed on a Swing Frame or image created. |


    ### Application Level Architecture


    The application level architecture explains where JFreeChart library sits inside
    a Java Application.


    ![](img/8ddb3ec6e7d677f78107576a1c853ea9_11_0.png)


    The client program receives user data and then it uses standard Java and JFreeChart
    APIs based on requirements to generate the output in the form of either a frame,
    which can be displayed directly inside the application or independently in image
    formats such as JPEG or PNG.


    ## 4. JFreeChart – Referenced APIs


    In this chapter, we will discuss some of the important packages, classes, and
    methods from JFreeChart library. These packages, classes, and methods are the
    most frequently used when creating a variety of charts using JFreeChart library.


    ### ChartFactory Class


    ChartFactory is an abstract class under the org.jfree.chart package. It provides
    a collection of utility methods for generating standard charts.


    Following is a list of few of the important methods:


    #### Class Constructor


    | S.N. | Description |

    | :--- | :--- |

    | 1 | ChartFactory() Default constructor of ChartFactory class. |


    #### Class Methods


    | S.N. | Methods & Description |

    | :--- | :--- |

    | 1 | createPieChart(java.lang.String title, PieDataset dataset, boolean legend,
    boolean tooltips, boolean urls) This method creates a pie chart with default settings.
    It returns JFreeChart object. |

    | 2 | createPieChart3D(java.lang.String title, PieDataset dataset, boolean legend,
    boolean tooltips, boolean urls) This method creates a 3D pie chart using the specified
    dataset. |

    | 3 | createBarChart(java.lang.String title, java.lang.String categoryAxisLabel,
    java.lang.String valueAxisLabel, CategoryAxisLabel, Plot orientation, boolean
