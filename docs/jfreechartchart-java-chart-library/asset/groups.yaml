    \ 1 | Iphone 5S | 20 |\n| 2 | Samsung Grand | 20 |\n| 3 | MOTO G | 40 |\n| 4 |\
    \ Nokia Lumia | 10 |\n\nFollowing is the code to create 3D Pie Chart from the\
    \ above given information. This code helps you to embed a pie chart in any AWT\
    \ based application.\n\n```java\nimport java.io.*;\nimport org.jfree.chart.ChartFactory;\n\
    import org.jfree.chart.JFreeChart;\nimport org.jfree.chart.plot.PiePlot3D;\nimport\
