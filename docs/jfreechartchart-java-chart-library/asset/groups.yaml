    # # 8. JFreeChart – XY Chart


    The XY chart (scatter) is based on one data series consisting of a list of X and
    Y values. Each value pair (X,Y) is a point in a coordinate system. Here, one value
    determines the horizontal (X) position, and the other determines the vertical
    (Y) position. This chapter demonstrates — how we can use JFreeChart to create
    XY Chart from a given set of business data.


