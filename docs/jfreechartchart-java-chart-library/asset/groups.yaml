    a new empty series, with the auto-sort flag set as requested, and duplicate values
    are allowed. |

    | 3 | **XYSeries(java.lang.Comparable key, boolean autoSort, boolean allowDuplicates)**<br>It
    constructs a new xy-series that contains no data. |


