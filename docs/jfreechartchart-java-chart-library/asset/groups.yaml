    # 7. JFreeChart – Line Chart


    A line chart or line graph displays information as a series of data points (markers)
    connected by straight line segments. Line Chart shows how data changes at equal
    time frequency.


    This chapter demonstrates how we can use JFreeChart to create Line Chart from
    a given set of business data.


    # Business Data


    The following example draws a line chart to show a trend of number of schools
    opened in different years starting from 1970.


    Given data is as follows:


    | Year | Number of Schools |

    |---|---|

    | 1970 | 15 |

    | 1980 | 30 |

    | 1990 | 60 |

    | 2000 | 12 |

    | 2013 | 240 |

    | 2014 | 300 |


    # AWT Based Application


    Following is the code to create Line Chart from the information above given. This
    code helps you to embed a line chart in any AWT based application.


    ```

    import org.jfree.chart.ChartPanel;

    import org.jfree.chart.ChartFactory;

    import org.jfree.chart.JFreeChart;

    import org.jfree.ui.ApplicationFrame;

    import org.jfree.ui.RefineryUtilities;

    import org.jfree.chart.plot.PlotOrientation;

    import org.jfree.chart.category.DefaultCategoryDataset;


    public class LineChart_AWT extends ApplicationFrame

    ```


