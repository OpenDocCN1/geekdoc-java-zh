- "# MySQL 入门指南（编程语言 - JavaScript, Java, MySQL, PHP 及 Python 自动化）\n\n\n\n![](img/image_rsrc43A.jpg)\n\
  \n# 前言\n\n# MySQL 概述\n\n\n# 前言\n\n`SQL` 是最强大的编程语言之一，用于处理 `RDBMS`（关系型数据库管理系统）的任务。它使用紧凑的英语语句来创建、定义、插入、更新和控制关系型数据库。\n\
  \n`SQL` 用于在关系型数据库中存储和处理信息，而 `MySQL` 则用于开源关系型数据库。本电子书将同时讨论 `SQL` 和 `MySQL`。\n\n`MySQL`\
  \ 最适合客户端-服务器环境。它提供了灵活的事务管理。它是许多应用程序、网站以及商业产品的主要关系型数据库。\n\n作为一本电子书，这将是关于如何使用 `MySQL`\
  \ 提取、组织、管理和处理存储在关系型数据库中的数据的良好参考。我们已经通过多个示例详细讨论了 `DDL`、`DQL`、`DML`、`DCL` 和 `TCL`。\n\
  \n本电子书涵盖了广泛的数据库任务，方式更加易于理解、无痛且高效。你不会感到无聊。如果你觉得大多数编程书籍太枯燥，那么这可能是你入门 `MySQL` 的绝佳书籍。\n\
  \n# MySQL 概述\n\n`SQL`（结构查询语言）最初由 IBM 创建，并于 1979 年由 Oracle 公司首次商业化实施，但当时没有官方标准，因此在后\
  \ 1986 年由 `ANSI` 和 `ISO` 改进并联合发布。1992 年发布了 `SQL’92`。它的组织方式改进得多：数据包含在表中，表分组在模式（schemas）中，模式分组在目录（catalogues）中，目录分组在集群（clusters）。`MySQL`\
  \ 的第一个版本由 Monty Widenius、David Axmark 和 Allan 开发，于 1995 年出现。到 2000 年，发布了多个版本的 `MySQL`。这些版本兼容几乎所有主要平台。\n\
  \n`MySQL` 是一种基于结构查询语言（`SQL`）的 `RDBMS`（关系数据库管理系统）。关系型数据库以表格的形式存储信息，行和列表示不同的数据属性以及数据值之间的各种关系。\n\
  \n我们使用命令来创建、定义、插入、提取、更新和控制数据库。以下是 SQL 命令的类型：\n\n* `DDL`（数据定义语言）\n* `DQL`（数据查询语言）\n\
  * `DML`（数据操语言）\n* `DCL`（数据控制语言）\n* `TCL`（事务控制语言）\n\n我们将在接下来的章节中讨论所有内容。\n\n# 以下是使用\
  \ MySQL 的前 10 个应用程序\n\n1. 在线游戏\n2. 数字营销\n3. 零售销售点系统\n4. 物联网监控系统\n5. SaaS 应用\n6.\
  \ Facebook\n7. Flickr\n8. Web 开发\n9. Twitter\n10. YouTube\n\n# 第 1 章：MySQL 简介\n\
  ## 1.1 简介\n\n`MySQL` 是一种采用 `SQL`（结构查询语言）的软件。对于小型和大型应用程序都是非常快速、可靠、可扩展且易用。MySQL 是创始人\
  \ Widenius 的女儿建议的名字。\n\n在日常生活中，如果我们访问商场，会看到店主使用扫描枪处理产品数据库。另一个例子，让我们考虑银行，他们正在处理客户数据库。第三个例子是学校，他们正在处理学生数据库。因此，数据库既可以手动在笔记本上处理，也可以通过如\
  \ `MySQL` 等计算机软件进行处理。\n\n### 什么是数据库？\n\n数据是现实世界中到处使用的原始事实和数字。一组数据构成特定的信息或数据库。`SQL`\
  \ 用于在关系型数据库中存储和处理信息。\n\n### 什么是关系型数据库？\n\n它是存储在一个或多个表中的组织数据集合。我们可以很容易看到并理解不同数据结构之间的相互关系。\n\
  \n### MySQL 和 SQL 的区别\n\n我们使用 `MySQL` 创建、读取、更新和删除数据库。但 `SQL`（结构查询语言）是用于访问、处理和协调数据库的紧凑英语语句。在本电子书中，我们将讨论如何在输入的数据库上进行交互式操作。\n\
  \n\n\n\n\n### • DML（数据操纵语言）这些命令用于操纵数据，如和、平均值等。\n\n### • DCL（数据控制语言）– 它为数据库提供安全保护，如\
  \ `Grant`（授权）和 `Revoke`（撤销权限）。\n\n### • DQL（数据查询语言）– 它允许用户向关系型数据库发送查询语句。\n\n###\
  \ • TCL（事务控制语言）– 它允许用户保存和恢复数据库。\n\n**注意：** 我们将在接下来的章节中讨论这些命令。\n\n## 1.2 安装 MySQL\n\
  \n在本节中，你将学习安装 MySQL Workbench。让我们从 `dev.mysql.com` 下载 MySQL 开始。选择相应的操作系统并下载 MySQL\
  \ 安装程序 `8.0.19`。将它保存到合适的位置，例如桌面。\n\n![](img/image_rsrc43B.jpg)\n\n点击保存的文件，现在选择一种安装类型，我根据我的需求选择“Full”（完整安装），然后点击\
  \ next（下一步）按钮。\n\n![](img/image_rsrc43C.jpg)\n\n选择 MySQL 和数据存储的位置。点击 next（下一步）按钮，出现需求检查界面，你可以选择需求或直接点击\
  \ next（下一步）。\n\n![](img/image_rsrc43D.jpg)\n\n如果我们不选择需求，将出现下面的界面，只需点击“Yes”（是），然后点击\
  \ next（下一步）。\n\n![](img/image_rsrc43E.jpg)\n\n将出现 MySQL 的功能界面，点击 `Execute`（执行）并等待几分钟。\n\
  \n![](img/image_rsrc43F.jpg)\n\n所有产品已成功安装在我们的电脑上，现在双击 next（下一步）按钮，选择 standalone\
  \ MySQL server（独立 MySQL 服务器），然后点击 next（下一步）。\n\n![](img/image_rsrc43G.jpg)\n\n点击\
  \ next（下一步）跳过类型选择和网络/身份验证设置。\n\n现在为你的账户设置密码，点击 next（下一步）。\n\n![](img/image_rsrc43H.jpg)\n\
  \n点击 next（下一步）到达 Apply configuration（应用配置）界面，点击 `execute`（执行）然后点击 `Finish`（完成）。我们成功配置了\
  \ MySQL。接下来跳过产品配置。\n\n![](img/image_rsrc43J.jpg)\n\n将出现 Connect to the server（连接服务器）界面，输入你的账户密码并检查是否已连接到服务器\
  \ – Connection succeeded（连接成功），点击 next（下一步）按钮。\n\n![](img/image_rsrc43K.jpg)\n\n\
  回到 Apply configuration（应用配置），点击 `execute`（执行）然后点击 `Finish`（完成）。我们已经在电脑上成功配置并安装了\
  \ MySQL。\n\nMySQL Workbench 安装成功，使用你的密码连接服务器并开始使用 MySQL。\n\n# 第 2 章：MySQL 语法\n\n\
  和其他编程语言一样，MySQL 遵循一套独特的规则和指南，即 MySQL 语法。它也非常容易运行和执行。\n\n## 2.1 MySQL 数据类型\n\nMySQL\
  \ 数据类型指定了存储在数据库表中数值类型。数据类型主要分为三类。\n\n* • 数型\n* • 字符串型\n* • 日期和时间\n\n### 2.1.1 数型\n\
  \n它指的是以数字形式的数据，如整数（Integer）、浮点数（Float）和布尔值（Boolean）。下表列出了 MySQL 数型。\n\n| 数型类型 |\
  \ 范围 |\n| :--- | :--- |\n| BIT | 0-1 |\n| TINYINT | 0-255 |\n| SMALLINT | -32,768\
  \ - 32,767 |\n| BIGINT | -9,223,372,036,854,775,808 - 9,223,372,036,854,775,807\
  \ |\n| FLOAT | -1.79E+308 - 1.79E+308 |\n| REAL | -3.40E+38 - 3.40E+38 |\n\n###\
  \ 2.1.2 字符串类型\n\n它允许我们存储固定或可变的字符值，如 `char`、`varchar` 和 `text`。下表列出了 MySQL 字符串类型。\n\
  \n| 字符串类型 | 说明 |\n| :--- | :--- |\n| CHAR | 固定长度 8000 个字符 |\n| VARCHAR | 可变长度 8000\
  \ 个字符 |\n| TEXT | 可变长度 2GB 数据 |\n\n### 2.1.3 日期和时间类型\n\n它用于存储包含日期和时间的数值。下表列出了 MySQL\
  \ 日期和时间类型。\n\n| 日期和时间类型 | 说明 |\n| :--- | :--- |\n| DATE | 以格式 (YYYY-MM-DD) 存储日期\
  \ |\n| TIME | 以格式 (HH:MI:SS) 存储时间 |\n| DATETIME | 存储日期和时间信息 (YYYY-MM-DD HH:MI:SS)\
  \ |\n\n## 2.2 MySQL 运算符\n\nMySQL 运算符用于在语句中指定特定条件。运算符分为五类：\n\n* • 算术运算符\n* • 逻辑运算符\n\
  * • 比较运算符\n* • 位运算符\n* • 集合运算符\n\n### 2.2.1 算术运算符\n\n它对对数值数据执行算术运算。下表列出了这些运算符。\n\
  \n| 算术运算符 | 说明 |\n| :--- | :--- |\n| + | 加法 |\n| - | 减法 |\n| * | 乘法 |\n| / | 除法\
  \ |\n| % | 取模 |\n\n### 2.2.2 逻辑运算符\n\n它执行布尔运算，给出真（true）或假（false）的结果。下表列出了这些。\n\n\
  | 逻辑运算符 | 说明 |\n| :--- | :--- |\n| AND | 如果两个表达式都为真 |\n| IN | 如果操作数等于列表中的任意一个 |\n\
  | OR | 如果任一表达式为真 |\n| NOT | 取反 |\n| LIKE | 如果操作数匹配模式 |\n| BETWEEN | 如果操作数在范围内 |\n\
  \n### 2.2.3 比较运算符\n\n也被称为关系运算符，比较表中的值。下表列出了。\n\n| 比较运算符 | 说明 |\n| :--- | :--- |\n\
  | = | 等于 |\n| > | 大于 |\n| < | 小于 |\n| >= | 大于等于 |\n| <= | 小于等于 |\n| <> | 不等于 |\n\
  \n### 2.2.4 位运算符\n\n它将整数转换为二进制，对每个位执行 AND、OR、NOT 操作。下表列出了。\n\n| 位运算符 | 说明 |\n| :---\
  \ | :--- |\n| AND | 如果两个值... |\n| OR | 如果任一值... |\n| NOT | 取反... |\n\n### 2.2.5\
  \ 集合运算符\n\n集合运算符用于合并两个或多个集的行。下表列出了。\n\n| 集合运算符 | 说明 |\n| :--- | :--- |\n| UNION\
  \ | 不去重复地合并两个或多个集 |\n| UNION ALL | 包含重复合并两个或多个集 |\n| INTERSECT | 仅包含存在于... |\n|\
  \ EXCEPT | 仅包含来自第一个集但不包含在... |\n\n# 第 3 章：数据定义语言 (DDL)\n\n在上一章节中学习了 MySQL 的语法，包括数据类型和运算符，现在我们将学习\
  \ MySQL 中的完整性约束，然后学习 DDL 创建表。\n\n## 3.1 MySQL 中的完整性约束\n\n完整性约束是表数据或列必须遵循的规则。我们可以在列级或表级使用完整性约束。表级约束适用于整个表，而列级约束仅适用于某一列。表显示了\
  \ MySQL 中使用的。\n\n| 完整性约束 | 说明 |\n| :--- | :--- |\n| NOT NULL | 防止列具有空值 |\n| DEFAULT\
  \ | 当列没有定义值时，`DEFAULT` 约束提供一个默认值 |\n| UNIQUE | 确保列中的任何值都是唯一的 |\n| PRIMARY KEY |\
  \ 唯一标识每行/记录 |\n| FOREIGN KEY | 识别任何数据库表中的行/记录 |\n\n## 3.2 MySQL DDL 简介\n\nMySQL\
  \ DDL 语句用于定义和操作数据库结构。它允许我们使用命令创建、修改和维护数据库。\n\n以下是 DDL 命令。\n\n* • `CREATE` - 用于创建表和模式\
  \ |\n* • `ALTER` - 用于从表中添加、修改或删除列或约束 |\n* • `TRUNCATE` - 用于删除表中的数据，但不会删除表本身 |\n\
  * • `DROP` – 用于删除整个表 |\n* • `RENAME` – 用于重命名表 |\n\n### 3.2.1 CREATE 命令\n\n\n\n\n\
  \n# MySQL 允许我们使用 `CREATE` 命令创建数据库表。让我们创建一个员工表。如果我们在 MySQL Workbench 中执行如下所示的语句序列，就可以创建一个员工表。\n\
  \n```sql\nCREATE TABLE employees (\n  employee_id INT,\n  first_name VARCHAR (50),\n\
  \  last_name VARCHAR (50),\n  hourly_pay DECIMAL (5,2),\n  hire_date DATE\n);\n\
  ```\n\n我将向你展示如何在 MySQL 中创建一些表。关系型数据库中的表表由行和列组成，类似于 Excel 表格。在本主题中，我们将创建表和列。\n\n\
  只需输入 `CREATE TABLE` 然后是表名，我将创建一个名为 `employees` 的表，然后在末尾添加一组括号和分号；在括号内，我们将列出员工的列，让我们有\
  \ `employee_id`、`first_name`、`hourly_pay` 和 `hire_date`。现在，我们需要为每一列设置在每个列中存储的数据的类型。\n\
  \n### 让我们为每一列设置数据类型：\n- `employee_id INT` – 数据将为整数\n- `first_name VARCHAR (50)`\
  \ – 最多 50 个字符序列\n- `last_name VARCHAR (50)` – 最多 50 个字符序列\n- `hourly_pay Decimal\
  \ (5,2)` – 小数点前最多 5 位，后 2 位 (99999.99)\n- `hire_date DATE` – 日期格式 (dd-mm-yyyy)\n\
  \n如果你需要选择表，请输入：\n**语法：** `SELECT * FROM table name;`\n**实现：** `SELECT * FROM employees;`\n\
  \n| employee_id | first_name | last_name | hourly_pay | hire_date |\n| :--- | :---\
  \ | :--- | :--- | :--- |\n\n我们已成功创建了一个包含五列的员工表。\n\n### 3.2.2 RENAME 命令\n\n如果我们需要重命名上面的表，请输入：\n\
  **语法：** `RENAME TABLE original name TO new name;`\n**实现：** `RENAME TABLE employees\
  \ TO workers;`\n\n在 MYSQL workbench 执行并获取结果。\n\n### 3.2.3 DROP 命令\n\n如果我们需要删除上面的表，请输入：\n\
  **语法：** `DROP TABLE name of table;`\n**实现：** `DROP TABLE employees;`\n\n在 MYSQL\
  \ workbench 执行并获取结果。\n\n### 3.2.4 ALTER 命令\n\n如果我们需要修改表，让我们添加新列 `phone_number`，输入：\n\
  ```sql\nALTER TABLE employees\nADD phone_number VARCHAR (15);\n```\n在 MYSQL workbench\
  \ 执行并获取结果。\n\n让我们将 `phone_number` 重命名为 `email`，输入：\n```sql\nALTER TABLE employees\n\
  RENAME COLUMN phone_number to email;\n```\n在 MYSQL workbench 执行并获取结果。\n\n让我们为 `email`\
  \ 列添加数据类型，这里我们必须使用 `MODIFY` 命令，输入：\n```sql\nALTER TABLE employees\nMODIFY COLUMN\
  \ email VARCHAR (100)\n```\n在 MYSQL workbench 执行并获取结果。\n\n让我们在 `last_name` 之后添加\
  \ `email`，输入：\n```sql\nALTER TABLE employees\nMODIFY email VARCHAR (100)\nAFTER\
  \ last_name;\n```\n在 MYSQL workbench 执行并获取结果。\n\n让我们删除 `email` 列，输入：\n```sql\nALTER\
  \ TABLE employees\nDROP COLUMN email;\n```\n在 MYSQL workbench 执行并获取结果。\n\n# 第 4\
  \ 章：数据操语言 (DML)\n\n## 4.1 MySQL DML 绪览\n\nMySQL DML 处理数据库表内数据的修改。DML 语句用于向数据库中添加（插入）、删除和修改（更新）数据。\n\
  \n以下是 DML 命令：\n- `INSERT` – 用于手动向表中添加行。\n- `SELECT` – 我们可以使用 `Select` 命令访问和操作数据。\n\
  - `DELETE` – 我们可以使用 `Delete` 命令删除现有表的行。\n- `UPDATE` - 用于更改表中的实际数据。\n\n## 4.2 DML\
  \ 命令执行\n\n在上一章中，我们创建了一个 `employees` 表，现在让我们使用 DML 命令操作该表。\n\n### 4.2.1 INSERT 命令\n\
  \n在本主题中，我将讨论如何向表中插入行。我们有一个名为 `employees` 的表。我将从我的表 `employees` 中选择所有内容。\n\n```sql\n\
  SELECT * FROM employees;\n```\n\n| employee_id | first_name | last_name | hourly_pay\
  \ | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n\n让我们使用 `INSERT` 命令插入一行数据。\n\
  \n要向表中插入一行，我们将输入 `INSERT INTO` 紧跟表名，然后是 `VALUES` 括号和分号；在这组括号之间，我们将添加该行的所有数据。我们将按照此顺序，从\
  \ `employee_id`、`first_name`、`last_name` 等以此类推，但我们必须注意数据类型。每条数据之间将用逗号分隔。\n\n在 `Employees`\
  \ 表中插入一行数据：\n```sql\nINSERT INTO employees\nVALUES (1, \"Eugene\", \"Krabs\", 25.50,\
  \ \"2023-01-02\");\n```\n\n现在我们可以执行这些语句并获得所示结果。\n\n| employee_id | first_name |\
  \ last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n|\
  \ 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n\n一次性插入多行：\n```sql\nINSERT INTO employees\n\
  VALUES (1, \"Eugene\", \"Krabs\", 25.50, \"2023-01-02\"),\n(2, \"Squidward\", \"\
  Tentacles\", 15.00, \"2023-01-03\"),\n(3, \"Spongebob\", \"Squarepants\", 12.50,\
  \ \"2023-01-04\"),\n(4, \"Patrick\", \"Star\", 12.00, \"2023-01-05\"),\n(5, \"Sandy\"\
  , \"Cheeks\", 17.25, \"2023-01-06\");\n```\n执行后：\n```sql\nSELECT * FROM employees;\n\
  ```\n\n| employee_id | first_name | last_name | hourly_pay | hire_date |\n| :---\
  \ | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n|\
  \ 2 | Squidward | Tentacles | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants\
  \ | 12.50 | 2023-01-04 |\n| 4 | Patrick | Star | 12.00 | 2023-01-05 |\n| 5 | Sandy\
  \ | Cheeks | 17.25 | 2023-01-06 |\n\n### 4.2.3 UPDATE 命令\n\n在本节中，我们将讨论如何更新表中的数据。在我们的表中，员工\
  \ `Id` 6 缺少部分数据。\n\n```sql\nUPDATE employees SET first_name = \"Sheldon\", last_name\
  \ = \"Plankton\", hourly_pay = 20.00, hire_date = \"2023-01-07\" WHERE employee_id\
  \ = 6;\n```\n\n| employee_id | first_name | last_name | hourly_pay | hire_date |\n\
  | :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02\
  \ |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants\
  \ | 12.50 | 2023-01-04 |\n| 4 | Patrick | Star | 12.00 | 2023-01-05 |\n| 5 | Sandy\
  \ | Cheeks | 17.25 | 2023-01-06 |\n| 6 | Sheldon | Plankton | 20.00 | 2023-01-07\
  \ |\n\n\n\n\n\n# 让我们更新单列 `hourly_pay = 10.25`, `type`\n\n```sql\nUPDATE employees\n\
  SET hourly_pay = 10.25\nWHERE employee_id = 6;\n```\n\n### 输出\n\n| employee_id |\
  \ first_name | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles\
  \ | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n\
  | 4 | Patrick | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06\
  \ |\n| 6 | Sheldon | Plankton | 10.25 | |\n\n# 让我们更新多列 `hourly_pay` 和 `hire_date`,\
  \ `type`\n\n```sql\nUPDATE employees\nSET hourly_pay = 10.25,\n    hire_date = \"\
  2023-01-07\"\nWHERE employee_id = 6;\n```\n\n### 输出\n\n| employee_id | first_name\
  \ | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n\
  | 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles | 15.00\
  \ | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n| 4 | Patrick\
  \ | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06 |\n|\
  \ 6 | Sheldon | Plankton | 10.25 | 2023-01-07 |\n\n# 我们可以更新某一列中的所有行。\n\n# 让我们为所有员工更新\
  \ `hourly_pay = 10.25`, `type`\n\n```sql\nUPDATE employees\nSET hourly_pay = 10.25;\n\
  ```\n\n### 输出\n\n| employee_id | first_name | last_name | hourly_pay | hire_date\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 10.25 | 2023-01-02\
  \ |\n| 2 | Squidward | Tentacles | 10.25 | 2023-01-03 |\n| 3 | Spongebob | Squarepants\
  \ | 10.25 | 2023-01-04 |\n| 4 | Patrick | Star | 10.25 | 2023-01-05 |\n| 5 | Sandy\
  \ | Cheeks | 10.25 | 2023-01-06 |\n| 6 | Sheldon | Plankton | 10.25 | |\n\n# 我们还可以在\
  \ `UPDATE` 命令中用完整性约束\n\n# 让我们将某个字段设置为 `NULL`（无值），如上例所示，Sheldon Plankton 的 `hire_date`\
  \ 是空的，`type`\n\n```sql\nUPDATE employees\nSET hire_date = NULL\nWHERE employee_id\
  \ = 6;\n```\n\n### 输出\n\n| employee_id | first_name | last_name | hourly_pay | hire_date\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 10.25 | 2023-01-02\
  \ |\n| 2 | Squidward | Tentacles | 10.25 | 2023-01-03 |\n| 3 | Spongebob | Squarepants\
  \ | 10.25 | 2023-01-04 |\n| 4 | Patrick | Star | 10.25 | 2023-01-05 |\n| 5 | Sandy\
  \ | Cheeks | 10.25 | 2023-01-06 |\n| 6 | Sheldon | Plankton | 10.25 | |\n\n注意：Plankton\
  \ 的 `hire_date` 现在是 `NULL`。\n\n### 4.2.4 `DELETE` 命令\n\n# 要删除 `employees` 表中的所有行，输入\n\
  \n```sql\nDELETE FROM employees;\n```\n\n注意：警小心！表中的所有行将被删除。\n\n# 要删除 `employees`\
  \ 表中的第 6 行，输入\n\n```sql\nDELETE FROM employees\nWHERE employee_id = 6;\n```\n\n\
  ### 输出\n\n| employee_id | first_name | last_name | hourly_pay | hire_date |\n| :---\
  \ | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 10.25 | 2023-01-02 |\n|\
  \ 2 | Squidward | Tentacles | 10.25 | 2023-01-03 |\n| 3 | Spongebob | Squarepants\
  \ | 10.25 | 2023-01-04 |\n| 4 | Patrick | Star | 10.25 | 2023-01-05 |\n| 5 | Sandy\
  \ | Cheeks | 10.25 | 2023-01-06 |\n\n# 第 5 章：数据控制语言 (DCL)\n\n## 5.1 DCL 简介\n\nMySQL\
  \ DCL 是用于管理权限的。主要包括：\n- **GRANT**: 授予用户特定的权限。\n- **REVOKE**: 撤销已授予的权限。\n\n# 第 6\
  \ 章：事务控制语言 (TCL)\n\n## 6.1 事务简介\n\nTCL 是用于管理数据库事务的命令集。核心操作包括：\n- **COMMIT**: 提交事务，将更改永久保存到数据库。\n\
  - **ROLLBACK**: 回滚事务，撤销未提交的更改。\n- **SAVEPOINT**: 在事务中设置保存点，允许部分回滚。\n\n## 6.2 自动提交\
  \ (Autocommit)\n\n在 MySQL 中，默认提交默认是开启的。这意味着每一条 SQL 语句都会被视为一个独立的事务。我们可以关闭它：\n\n```sql\n\
  SET AUTOCOMMIT = OFF;\n```\n\n关闭后，我们需要手动控制事务：\n- 使用 `COMMIT` 提交更改。\n- 使用 `ROLLBACK`\
  \ 撤销更改。\n\n\n\n\n\n# 注意：如果我们想保存更改，请使用 `COMMIT` 命令。\n\n# 第 7 章：数据查询语言 (DQL)\n\n##\
  \ 7.1 MySQL DQL 简介\n\n`MySQL` 中的 `DQL` 是 SQL 子语言基础分组的一部分。它用于向数据库架构发送查询指令。它提供了使用\
  \ `SELECT` 命令的最大灵活性，可以根据用户的需求从数据库中检索信息。我们将详细讨论 `SELECT` 命令。\n\n当对表执行 `SELECT` 语句时，结果将根据要求编译成一个进一步的临时表。\n\
  \n只有在创建表并插入了值的情况下，我们才能使用 `SELECT` 命令。让我们以已经创建的 `employees` 表为例。\n\n### 7.1.1 语法\
  \ 1\n\n```sql\nSELECT * FROM table_name;\n```\n\n实现：从 `employees` 表中检索所有信息。\n\n\
  ```sql\nSELECT * FROM employees;\n```\n\n执行并获取结果\n\n| employee_id | first_name |\
  \ last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n|\
  \ 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles | 15.00\
  \ | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n| 4 | Patrick\
  \ | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06 |\n|\
  \ 6 | Sheldon | Plankton | 10.25 | 2023-01-07 |\n\n### 7.1.2 语法 2\n\n```sql\nSELECT\
  \ Col1, Col2,…. FROM table_name;\n```\n\n实现：检索表中的特定列。\n\n```sql\nSELECT employee_id,\
  \ first_name, last_name FROM employees;\n```\n\n执行并获取结果\n\n| employee_id | first_name\
  \ | last_name |\n| :--- | :--- | :--- |\n| 1 | Eugene | Krabs |\n| 2 | Squidward\
  \ | Tentacles |\n| 3 | Spongebob | Squarepants |\n| 4 | Patrick | Star |\n| 5 |\
  \ Sandy | Cheeks |\n| 6 | Sheldon | Plankton |\n\n注意：列的顺序将由用户决定。\n\n### 7.1.3 语法\
  \ 3\n\n```sql\nSELECT * FROM table_name WHERE condition;\n```\n\n实现：它将检索所有与 `WHERE`\
  \ 子句相关的行行\n\n```sql\nSELECT * FROM employees WHERE employee_id< 4;\n```\n\n执行并获取结果\n\
  \n| employee_id | first_name | last_name | hourly_pay | hire_date |\n| :--- | :---\
  \ | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward\
  \ | Tentacles | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04\
  \ |\n\n注意：`WHERE` 子句用于根据条件过滤行。\n\n### 7.1.4 语法 4\n\n```sql\nSELECT col1, col2, ……\
  \ FROM table_name WHERE condition;\n```\n\n实现：这里将根据 `WHERE` 子句检索员工的 `first_name`、`last_name`\
  \ 和 `hourly_pay`。\n\n```sql\nSELECT first_name, last_name, hourly_pay FROM employees\
  \ WHERE hourly_pay<15;\n```\n\n执行并获取结果\n\n| first_name | Last_name | hourly_pay\
  \ |\n| :--- | :--- | :--- |\n| Spongebob | Squarepants | 12.50 |\n| Patrick | Star\
  \ | 12.50 |\n| Sheldon | Plankton | 10.25 |\n\n## 7.2 使用 MySQL 获取当前日期和时间\n\n让我们创建一个临时演示表，输入：\n\
  \n```sql\nCREATE TABLE demo(\nmy_date DATE,\nmy_time TIME,\nmy_datetime DATETIME\n\
  );\n```\n\n执行它，我们成功创建了一个包含三列的表——`my_date`、`my_time`、`my_datetime`\n\n如果我们想获取当前日期，我们需要创建一个时间戳\n\
  \n向 `DEMO` 表中插入数据，输入：\n\n```sql\nINSERT INTO demo\nVALUE(CURRENT_DATE(), CURRENT_TIME(),\
  \ NOW());\n\nSELECT * FROM demo;\n```\n\n执行它并获取当前日期和时间。\n\n| my_date | my_time |\
  \ my_datetime |\n| :--- | :--- | :--- |\n| 2024-07-23 | 07:27:58 | 2024-07-23 07:27:58\
  \ |\n\n让我们为当前日期增加一天，输入：\n\n```sql\nINSERT INTO demo\nVALUES(CURRENT_DATE() + 1,\
  \ NULL, NULL)\n\nSELECT * FROM demo;\n```\n\n执行并获取结果\n\n| my_date | my_time | my_datetime\
  \ |\n| :--- | :--- | :--- |\n| 2024-07-23 | 07:27:58 | 2024-07-23 07:27:58 |\n|\
  \ 2024-07-24 | | |\n\n注意：这里 datetime 设置为 `NULL`。\n\n# 第 8 章：约束的作用\n\n在本节中，我们将讨论约束。\n\
  \n## 8.1 UNIQUE 约束\n\n`MySQL` 中的 `UNIQUE` 约束确保列中的所有值都是唯一的。我们可以在创建表时添加它：\n\n```sql\n\
  CREATE TABLE products (\nproduct_id INT,\nproduct_name VARCHAR(25),\nprice DECIMAL(4,2)\n\
  );\n```\n\n创建后，我们可以将其添加到现有表中：\n\n```sql\nALTER TABLE products\nADD CONSTRAINT UNIQUE\
  \ (product_name);\n```\n\n## 8.2 NOT NULL 约束\n\n`NOT NULL` 约束确保列不能有 `NULL` 值。\n\n\
  ## 8.3 CHECK 约束\n\n`CHECK` 约束用于限制列列的值。\n\n```sql\nCREATE TABLE employees (\nemployee_id\
  \ INT,\nfirst_name VARCHAR(50),\nlast_name VARCHAR(50),\nhourly_pay DECIMAL(5,2),\n\
  hire_date DATE,\nCONSTRAINT chk_hourly_pay CHECK (hourly_pay >= 10)\n);\n```\n\n\
  删除该约束：\n\n```sql\nALTER TABLE employees\nDROP CHECK chk_hourly_pay;\n```\n\n## 8.4\
  \ DEFAULT 约束\n\n`DEFAULT` 约束在插入时未指定值时为列提供默认值。\n\n```sql\nCREATE TABLE products (\n\
  product_id INT,\nproduct_name VARCHAR(25),\nprice DECIMAL(4,2) DEFAULT 0\n);\n```\n\
  \n```sql\nINSERT INTO products (product_id, product_name)\nVALUES (10, \"spoon\"\
  ), (11, \"fork\");\n```\n\n## 8.5 PRIMARY KEY 约束\n\n`PRIMARY KEY` 应用于列（或列），其中每个值必须是唯一的且不为\
  \ `NULL`。\n\n```sql\nCREATE TABLE transactions(\ntransaction_id INT PRIMARY KEY,\n\
  amount DECIMAL(5,2)\n);\n```\n\n## 8.6 MYSQL 中的自增属性\n\n\n\n\n\n# `auto increment`\
  \ 属性可以应用于设置为主键的列，每当我们插入新行时，我们的主键会自动填充，然后随后的每一行都会自动递增。\n\n# 让我们删除 transactions 表并使用自动递增功能重新创建，类型：\n\
  \n```sql\nCREATE TABLE transactions (\n  transaction_id INT PRIMARY KEY AUTO_INCREMENT,\n\
  \  amount DECIMAL (5,2)\n);\n```\n\n注意：默认情况下，`auto increment` 将设置为 `1`。\n\n# 让我们在\
  \ transactions 表中插入一些值，不需要插入 `transaction_id`，它将被自动分配。\n\n```sql\nINSERT INTO transactions\
  \ (amount)\nVALUES (2.56);\nSELECT * FROM transactions;\n```\n\n| transaction_id\
  \ | amount |\n| 1 | 2.56 |\n\n注意：这里 `transaction_id` 是自动插入的。\n\n# 我们可以设置主键从不同的值开始，类型：\n\
  \n```sql\nALTER TABLE transactions\nAUTO_INCREMENT = 1000;\n```\n\n执行并获取结果，`transaction\
  \ ID` 从 `1000` 开始设置。我们必须删除整行并插入新值。\n\n## 8.7 FOREIGN KEY 外键约束\n\n外键是其中一个表中的 `PRIMARY\
  \ KEY`，可以通过 `foreign key` 在另一个表中找到它，我们可以在两个表之间建立连接。在我们的交易表里，这样做有两个主要好处：如果我想查看发起此交易的\
  \ `customer ID`，我可以引用 `customers` 表，然后找到该客户的姓和名。\n\n# 让我们创建 transaction 和 customer\
  \ 表，使用外键在它们之间建立连接\n\n# 我将创建一个新的 `customers` 表，类型：\n\n```sql\nCREATE TABLE customers\
  \ (\n  customer_id INT PRIMARY KEY AUTO_INCREMENT,\n  first_name VARCHAR (50),\n\
  \  last_name VARCHAR (50)\n);\n```\n\n执行并获取结果\n\n# 现在向表中插入一些值，类型：\n\n```sql\nINSERT\
  \ INTO customers (first_name, last_name)\nVALUES (“Fred”, “Fish”),\n(“Larry”, “Lobster”),\n\
  (“Bubble”, “Bass”);\n\nSELECT * FROM customers;\n```\n\n输出\n\n| customer_id | first_name\
  \ | last_name |\n| 1 | Fred | Fish |\n| 2 | Larry | Lobster |\n| 3 | Bubble | Bass\
  \ |\n\n# 现在，我们将通过 `customer ID` 在我们的 `customers` 表和 `transactions` 表之间建立连接。让我们创建一个带有\
  \ `FOREIGN KEY` 约束的 transactions 表，类型：\n\n```sql\nCREATE TABLE transactions (\n\
  \  transaction_id INT PRIMARY KEY AUTO_INCREMENT,\n  amount DECIMAL (5,2),\n  customer_id\
  \ INT,\n  FOREIGN KEY (customer_id) REFERENCES customers(customer_id)\n);\n```\n\
  \n执行并获取结果\n\n| transaction_id | amount | customer_id |\n\n注意：这里 `customer_id` 列是\
  \ `FOREIGN KEY`。\n\n# 使用外键在两个表之间的连接所示所示：\n\n| customer_id | first_name | last_name\
  \ |\n| 1 | Fred | Fish |\n| 2 | Larry | Lobster |\n| 3 | Bubble | Bass |\n\n| transaction_id\
  \ | amount | customer_id |\n| 1000 | 4.89 | 2 |\n| 1001 | 2.68 | 3 |\n| 1002 | 3.32\
  \ | 1 |\n| 1003 | 4.99 | 3 |\n\n## 8.8 MySQL 中的 JOIN 子句\n\n`JOIN` 是一个用于根据两个或多个表之间的相关列（例如\
  \ `foreign key`）合并来自这些表的行的子句。让我们连接之前创建的两个表。我们有两个表：一个 `transaction` 表和一个 `customers`\
  \ 表。\n\n### 1. Transaction 表\n\n| transaction_id | amount | customer_id |\n| 1000\
  \ | 4.89 | 2 |\n| 1001 | 2.68 | 3 |\n| 1002 | 3.32 | 1 |\n| 1003 | 4.99 | 3 |\n\n\
  ### 2. Customers 表\n\n| customer_id | first_name | last_name |\n| 1 | Fred | Fish\
  \ |\n| 2 | Larry | Lobster |\n| 3 | Bubble | Bass |\n\n# 让我们内连接两个表，类型：\n\n```sql\n\
  SELECT *\nFROM transactions INNER JOIN customers\nON transaction.customer_id = customer.customer_id;\n\
  ```\n\n```\n\n输出\n\n| transaction_id | amount | customer_id | customer_id | first_name\
  \ | last_name |\n| 1000 | 4.89 | 2 | 2 | Larry | Lobster |\n| 1001 | 2.68 | 3 |\
  \ 3 | Bubble | Bass |\n| 1002 | 3.32 | 1 | 1 | Fred | Fish |\n| 1003 | 4.99 | 3\
  \ | 3 | Bubble | Bass |\n\n# 第 9 章：MySQL 中的函数和逻辑运算符\n\n## 9.1 MySQL 中的函数\n\n一种接受用户提供的参数并返回返回值的存储程序称为\
  \ `Function`。MySQL 提供了许多函数。下面显示了一些。\n\n# 让我们统计 transaction 表中 `amount` 列的行数，类型：\n\
  \n```sql\nSELECT COUNT (amount)\nFROM transaction;\n```\n\n执行并获取结果\n\n# 查找 transaction\
  \ 表 `amount` 列中的最大值，类型：\n\n```sql\nSELECT MAX(amount)\nFROM transaction;\n```\n\n\
  执行并获取结果\n\n# 查找 transaction 表 `amount` 列中的平均值，类型：\n\n```sql\nSELECT AVG(amount)\n\
  FROM transaction;\n```\n\n执行并获取结果\n\n# 查找 transaction 表 `amount` 列中的总和，类型：\n\n```sql\n\
  SELECT SUM(amount)\nFROM transaction;\n```\n\n执行并获取结果\n\n# 统计 transaction 表 `amount`\
  \ 列的行数，类型：\n\n```sql\nSELECT COUNT (amount)\nFROM transaction;\n```\n\n执行并获取结果\n\
  \n# 拼接 customers 表中的姓和名，类型：\n\n```sql\nSELECT CONCAT(first_name, ' ', last_name)\n\
  FROM customers;\n```\n\n执行并获取结果\n\n## 9.2 逻辑运算符\n\n# 逻辑运算符用于组合多个条件。\n\n# 让我们在 `employees`\
  \ 表中使用逻辑运算符。\n\n```sql\nSELECT *\nFROM employees\nWHERE salary > 50000 AND department\
  \ = 'Sales';\n```\n\n执行并获取结果\n\n| employee_id | first_name | last_name | salary\
  \ | department |\n| 1 | John | Doe | 60000 | Sales |\n\n### 9.2.1 AND 运算符\n\n它返回两个条件都为真的行。\n\
  \n```sql\nSELECT *\nFROM employees\nWHERE salary > 50000 AND department = 'Sales';\n\
  ```\n\n### 9.2.2 OR 运算符\n\n它返回至少一个条件为真的行。\n\n```sql\nSELECT *\nFROM employees\n\
  WHERE salary > 50000 OR department = 'Marketing';\n```\n\n### 9.2.3 NOT 运算符\n\n\
  它返回条件不为真的行。\n\n```sql\nSELECT *\nFROM employees\nWHERE NOT department = 'Sales';\n\
  ```\n\n### 9.2.4 BETWEEN 运算符\n\n它返回指定范围内的行。\n\n```sql\nSELECT *\nFROM employees\n\
  WHERE salary BETWEEN 40000 AND 60000;\n```\n\n### 9.2.5 IN 运算符\n\n它返回匹配列表中任何值的行。\n\
  \n```sql\nSELECT *\nFROM employees\nWHERE department IN ('Sales', 'IT');\n```\n\n\
  # 第 10 章：一些重要的 MySQL 命令\n\n# 在本节中，我们将讨论用于处理数据库或架构对象的 MySQL 中重要子句。\n\n## 10.1 通配符字符\n\
  \n# 通配符是用于处理数据库的特殊字符。有两种通配符——百分比和下划线。\n\n# 让我们在 `employees` 表中使用 `%` 来检索以 S 开头的第一个名，类型：\n\
  \n```sql\nSELECT * FROM employees\nWHERE first_name LIKE “s%”;\n```\n\n执行并获取结果\n\
  \n\n\n\n\n| employee_id | first_name | last_name | hourly_pay | hire_date |\n| :---\
  \ | :--- | :--- | :--- | :--- |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03\
  \ |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n| 5 | Sandy | Cheeks\
  \ | 17.25 | 2023-01-06 |\n| 6 | Sheldon | Plankton | 10.25 | 2023-01-07 |\n\n##\
  \ 让我们从 employees 表中找到 1 月入职的员工，输入\n\n```sql\nSELECT * FROM employees\nWHERE hire_date\
  \ LIKE “____-01-__”;\n```\n\n注意：年份使用四个下划线，月份使用两个下划线。\n\n### 输出\n\n| employee_id\
  \ | first_name | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles\
  \ | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n\
  | 4 | Patrick | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06\
  \ |\n| 6 | Sheldon | Plankton | 10.25 | 2023-01-07 |\n\n## 10.2 Order by 子句\n\n\
  `ORDER BY` 子句根据我们列出的列对查询结果进行升序或降序排序。\n\n### 让我们改变 employees 表中姓名的顺序，输入\n\n```sql\n\
  SELECT * FROM employees\nORDER BY first_name DESC;\n```\n\n执行并获取结果：\n\n```sql\n\
  SELECT * FROM employees\nORDER BY first_name ASC;\n```\n\n执行并获取结果。\n\n## 10.3 Limit\
  \ 子句\n\n`LIMIT` 子句用于限制记录的数量。如果你正在处理大型数据库，它非常有用。\n\n### 让我们限制 employees 表中显示的员工数量，输入\n\
  \n```sql\nSELECT * FROM employees\nLIMIT 2;\n```\n\n注意：只会显示前两个位员工的详情。\n\n### 输出\n\
  \n| employee_id | first_name | last_name | hourly_pay | hire_date |\n| :--- | :---\
  \ | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward\
  \ | Tentacles | 15.00 | 2023-01-03 |\n\n## 10.4 Union 运算符\n\n`UNION` 运算符合并两个或多个\
  \ select 语句的结果。\n\n### 让我们合并两个表（Employees 表和 Customers 表）的 `first_name` 和 `last_name`。\n\
  \n#### Employees 表\n\n| employee_id | first_name | last_name | hourly_pay | hire_date\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02\
  \ |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants\
  \ | 12.50 | 2023-01-04 |\n| 4 | Patrick | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy\
  \ | Cheeks | 17.25 | 2023-01-06 |\n| 6 | Sheldon | Plankton | 10.25 | 2023-01-07\
  \ |\n\n#### Customers 表\n\n| customer_id | first_name | last_name |\n| :--- | :---\
  \ | :--- |\n| 1 | Fred | Fish |\n| 2 | Larry | Lobster |\n| 3 | Bubble | Bass |\n\
  \n### 使用 `UNION` 进行合并，输入\n\n```sql\nSELECT first_name, last_name FROM employees\n\
  UNION\nSELECT first_name, last_name FROM customers\n```\n\n### 输出\n\n| first_name\
  \ | last_name |\n| :--- | :--- |\n| Eugene | Krabs |\n| Squidward | Tentacles |\n\
  | Spongebob | Squarepants |\n| Patrick | Star |\n| Sandy | Cheeks |\n| Sheldon |\
  \ Plankton |\n| Fred | Fish |\n| Larry | Lobster |\n| Bubble | Bass |\n\n注意：如果我们要合并包含重复值，请使用\
  \ `UNION ALL` 而不是 `UNION`。\n\n## 10.5 MySQL 中的视图 (Views)\n\n我们可以在 MySQL 中使用 `VIEWS`\
  \ 创建虚拟表。视图中的字段是数据库中一个或多个真实表中的字段。\n\n### 让我们将 employees 表视为 `employees_attendance`\
  \ 表，输入\n\n```sql\nCREATE employees_attendance AS\nSELECT first_name, last_name\n\
  FROM employees;\n```\n\n这样一切都成功了，我们有一个新的视图，输入：\n\n```sql\nSELECT * FROM employees_attendance;\n\
  ```\n\n### 输出\n\n| first_name | last_name |\n| :--- | :--- |\n| Eugene | Krabs |\n\
  | Squidward | Tentacles |\n| Spongebob | Squarepants |\n| Patrick | Star |\n| Sandy\
  \ | Cheeks |\n| Sheldon | Plankton |\n\n## 10.6 MySQL 中的索引 (Indexes)\n\n索引用于更快速地找到列中的值。MySQL\
  \ 通常会搜索整个列。\n\n#### Customers 表\n\n| customer_id | first_name | last_name |\n| :---\
  \ | :--- | :--- |\n| 1 | Fred | Fish |\n| 2 | Larry | Lobster |\n| 3 | Bubble |\
  \ Bass |\n\n### 让我们为客户表的姓创建索引，输入\n\n```sql\nCREATE INDEX last_name_idx ON customers(last_name);\n\
  ```\n\n执行并获取结果。如果我想通过 `last_name` 搜索客户，输入：\n\n```sql\nSELECT * FROM customers\n\
  WHERE last_name = “Bass”;\n```\n\n### 输出\n\n| customer_id | first_name | last_name\
  \ |\n| :--- | :--- | :--- |\n| 3 | Bubble | Bass |\n\n## 10.7 子查询 (Subqueries)\n\
  \n查询内部的查询被称为子查询。\n\n### 让我们显示薪资等于平均薪资的员工姓名，输入\n\n```sql\nSELECT first_name, last_name,\
  \ hourly_pay, (SELECT AVG (hourly_pay) FROM employees) AS avg_pay FROM employees;\n\
  ```\n\n执行并获取结果。\n\n## 10.8 Group by 子句\n\n`GROUP BY` 子句将按特定列聚合行，通常与聚合函数如 `SUM()`、`MAX()`、`MIN()`、`COUNT()`\
  \ 使用。\n\n#### 交易表 (Transaction table)\n\n| transaction_id | amount | Order_date\
  \ |\n| :--- | :--- | :--- |\n| 1000 | 4.89 | 2023-01-01 |\n| 1001 | 2.68 | 2023-01-01\
  \ |\n| 1002 | 3.32 | 2023-01-02 |\n| 1003 | 4.99 | 2023-01-02 |\n\n### 让我们在交易表上应用\
  \ group by 子句来计算每日交易额，输入\n\n```sql\nSELECT SUM (amount), order_date\nFROM transactions\n\
  GROUP BY order_date;\n```\n\n### 输出\n\n| SUM(amount) | order_date |\n| :--- | :---\
  \ |\n| 7.57 | 2023-01-01 |\n| 8.31 | 2023-01-02 |\n\n## 10.9 Roll up 子句\n\n它是 `GROUP\
  \ BY` 子句的扩展，产生另一行并显示超级聚合值。\n\n### 让我们使用 `ROLLUP` 计算交易表中的总额，输入\n\n```sql\nSELECT\
  \ SUM (amount), order_date\nFROM transactions\nGROUP BY order_date WITH ROLLUP;\n\
  ```\n\n### 输出\n\n| SUM(amount) | order_date |\n| :--- | :--- |\n| 7.57 | 2023-01-01\
  \ |\n| 8.31 | 2023-01-02 |\n| 15.88 | |\n\n## 10.10 On delete 子句\n\n`ON DELETE`\
  \ 子句有两个版本：\n\n1. `ON DELETE SET NULL`\n2. `ON DELETE CASCADE`\n\n当外键被删除时，我们可以将外键替换为值\
  \ 0。\n\n### 让我们以客户表为例，其中 customer_id 是外键，因此要删除整个选定行，输入\n\n```sql\nSET foreign_key_checks\
  \ = 0;\nDELETE FROM customers\nWHERE customer_id = 4;\nSELECT * FROM customers;\n\
  ```\n\n执行并获取结果。\n\n# 结束\n\n"
