    \ can select the requirement or just click next.\n\n![](image_rsrc43D.jpg)\n\n\
    If we do not select the requirements than screen shown below will appear, just\
    \ click on “Yes” than next\n\n![](image_rsrc43E.jpg)\n\nNext features of MySQL\
    \ screen will appear, click on `Execute` and wait for few minutes\n\n![](image_rsrc43F.jpg)\n\
    \nAll products installed successfully on our PC, now click on next button twice,\
    \ select standalone MySQL server than click on next button.\n\n![](image_rsrc43G.jpg)\n\
