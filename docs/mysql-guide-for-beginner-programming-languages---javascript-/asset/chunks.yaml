    \ of functions. Some of them shown below.\n\n# Let’s count number of rows in `amount`\
    \ column of `transaction` table, type\n\n```sql\nSELECT COUNT (amount)\nFROM transaction;\n\
    ```\n\nExecute and get the result\n\n# Let’s find the maximum value in `amount`\
    \ column, type\n\n```sql\nSELECT MAX(amount) AS maximum\nFROM transaction;\n```\n\
    \nExecute and get the result\n\nNote: Here column name will be changed in output\
    \ “maximum”.\n\n# Let’s find the minimum value in `amount` column, type\n\n```sql\n\
    SELECT MIN(amount) AS minimum\nFROM transaction;\n```\n\nExecute and get the result\n\
    \n# Let’s find average value of `amount` column, type\n\n```sql\nSELECT AVG(amount)\
    \ AS average\nFROM transaction;\n```\n\nExecute and get the result\n\n# Let’s\
    \ find sum of `amount` column, type\n\n```sql\nSELECT SUM(amount) AS sum\nFROM\
    \ transaction;\n```\n\nExecute and get the result\n\n# Let’s concatenate the first\
    \ and last name of employees, type\n\n```sql\nSELECT CONCAT (first_name, last_name)\
    \ AS full_name\nFROM employees;\n```\n\nExecute and get the result\n\n## 9.2 Logical\
    \ operators in MySQL\n\n# Logical operators are used to combine multiple conditions.\n\
    \n# Let’s use logical operators in our `employees` table.\n\n```sql\nSELECT *\n\
    FROM employees\nWHERE salary > 50000 AND department = 'Sales';\n```\n\nExecute\
    \ and get the result\n\n| employee_id | first_name | last_name | salary | department\
    \ |\n| 1 | John | Doe | 60000 | Sales |\n| 2 | Jane | Smith | 45000 | Marketing\
    \ |\n| 3 | Bob | Brown | 55000 | Sales |\n\n### 9.2.1 AND operator\n\n```sql\n\
    SELECT *\nFROM employees\nWHERE salary > 50000 AND department = 'Sales';\n```\n\
    \n# It returns rows where both conditions are true.\n\n| employee_id | first_name\
    \ | last_name | salary | department |\n| 1 | | | | | |\n\n### 9.2.2 OR operator\n\
    \n```sql\nSELECT *\nFROM employees\nWHERE salary > 50000 OR department = 'Marketing';\n\
    ```\n\n# It returns rows where either condition is true.\n\n| employee_id | first_name\
