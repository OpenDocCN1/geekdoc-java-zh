    \ create a table of employees. If we execute the sequence of statement in MySQL\
    \ workbench as shown below than a table of employees can be created.\n\n```sql\n\
    CREATE TABLE employees (\n  employee_id INT,\n  first_name VARCHAR (50),\n  last_name\
    \ VARCHAR (50),\n  hourly_pay DECIMAL (5,2),\n  hire_date DATE\n);\n```\n\nI am\
    \ going to show you how we can make some tables in MySQL. A table in a relational\
    \ database they consist of rows and columns kind of like an Excel spreadsheet.\
    \ In this topic we are going to create the table and the column.\n\nJust type\
    \ `CREATE TABLE` than the name of table, I am going to create a table named `employees`\
    \ then add a set of parentheses semicolon at the end within the set of parentheses\
    \ we will list the columns for employees, let’s have an `employee_id`, `first_name`,\
    \ `hourly_pay`, `hire_date`. Now each column we need to set the data type of what\
    \ we are storing within each column.\n\n### Let’s set the data type for each and\
    \ every column:\n- `employee_id INT` – Data going to be whole integer\n- `first_name\
    \ VARCHAR (50)` – series of max 50 characters\n- `last_name VARCHAR (50)` – series\
    \ of max 50 characters\n- `hourly_pay Decimal (5,2)` – max 5 before decimal and\
    \ 2 after decimal point (99999.99)\n- `hire_date DATE` – date format (dd-mm-yyyy)\n\
    \nIf you need to select the table than type:\n**Syntax:** `SELECT * FROM table\
    \ name;`\n**Implementation:** `SELECT * FROM employees;`\n\n| employee_id | first_name\
    \ | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n\
    \nWe have successfully created a table of Employees with five columns.\n\n## 3.2.2\
    \ RENAME command\n\nIf we need to rename the above table than type:\n**Syntax:**\
    \ `RENAME TABLE original name TO new name;`\n**Implementation:** `RENAME TABLE\
    \ employees TO workers;`\n\nExecute and get the result in MYSQL workbench.\n\n\
    ## 3.2.3 DROP command\n\nIf we need to drop the above table than type:\n**Syntax:**\
    \ `DROP TABLE name of table;`\n**Implementation:** `DROP TABLE employees;`\n\n\
    Execute and get the result in MYSQL workbench.\n\n## 3.2.4 ALTER command\n\nIf\
    \ we need to alter the table, let’s add the new column `phone_number`, type:\n\
    ```sql\nALTER TABLE employees\nADD phone_number VARCHAR (15);\n```\nExecute and\
    \ get the result in MYSQL workbench.\n\nLet’s rename the `phone_number` to `email`,\
    \ type:\n```sql\nALTER TABLE employees\nRENAME COLUMN phone_number to email;\n\
    ```\nExecute and get the result in MYSQL workbench.\n\nLet’s add data type to\
    \ `email` column, here we have to use `MODIFY` command, type:\n```sql\nALTER TABLE\
    \ employees\nMODIFY COLUMN email VARCHAR (100)\n```\nExecute and get the result\
    \ in MYSQL workbench.\n\nLet’s add `email` after `last_name`, type:\n```sql\n\
    ALTER TABLE employees\nMODIFY email VARCHAR (100)\nAFTER last_name;\n```\nExecute\
    \ and get the result in MYSQL workbench.\n\nLet’s drop the column `email`, type:\n\
    ```sql\nALTER TABLE employees\nDROP COLUMN email;\n```\nExecute and get the result\
    \ in MYSQL workbench.\n\n# Chapter 4: Data Manipulation Language (DML)\n\n## 4.1\
    \ Introduction to MySQL DML\n\nMySQL DML deals with the modification of data within\
    \ the tables of a database. DML statements used for adding(inserting), deleting,\
    \ and modifying (updating) data in a database.\n\nFollowing are the commands of\
    \ DML:\n- `INSERT` – It is used to add rows to a table manually.\n- `SELECT` –\
    \ We can access and manipulate data using `Select` command.\n- `DELETE` – We can\
    \ remove rows of existing table using `Delete` command.\n- `UPDATE` - To change\
    \ the actual data in a table.\n\n## 4.2 DML command execution\n\nIn previous chapter\
    \ we have created an `employees` table, now let’s manipulate the table using DML\
    \ commands.\n\n### 4.2.1 INSERT command\n\nIn this topic, I am going to discuss\
    \ about how we can insert rows into a table. We have a table named `employees`.\
    \ I will select everything from my table `employees`.\n\n```sql\nSELECT * FROM\
    \ employees;\n```\n\n| employee_id | first_name | last_name | hourly_pay | hire_date\
    \ |\n| :--- | :--- | :--- | :--- | :--- |\n\nLet’s insert a row of data using\
    \ `INSERT` command.\n\nTo insert a row into a table we would type `INSERT INTO`\
    \ the name of the table followed by `VALUES` parentheses semicolon, between this\
    \ set of parentheses we will add all of the data for a row. We will follow this\
    \ order beginning with `employee_id`, `first_name`, `last_name` so on but we do\
    \ have to pay attention to the data types. Each piece of data will be separated\
    \ with a comma.\n\nLet’s insert a row of data in `Employees` table:\n```sql\n\
    INSERT INTO employees\nVALUES (1, \"Eugene\", \"Krabs\", 25.50, \"2023-01-02\"\
    );\n```\n\nNow we can execute these statements and get the result as shown below.\n\
    \n| employee_id | first_name | last_name | hourly_pay | hire_date |\n| :--- |\
    \ :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n\n\
    Let’s insert multiple rows at once, to do this MySQL allows us to add another\
    \ set of parentheses each separated with a comma:\n```sql\nINSERT INTO employees\n\
    VALUES (2, \"idward\", \"Tentacles\", 15.00, \"2023-01-03\"),\n(3, \"Spongebob\"\
    , \"Squarepants\", 12.50, \"2023-01-04\"),\n(4, \"Patrick\", \"Star\", 12.50,\
    \ \"2023-01-05\"),\n(5, \"Sandy\", \"Cheeks\", 17.25, \"2023-01-06\");\n```\n\
    ```sql\nSELECT * FROM employees;\n```\n\n| employee_id | first_name | last_name\
    \ | hourly_pay | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene\
    \ | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03\
    \ |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n| 4 | Patrick | Star\
    \ | 12.50 | 2023-01-05 |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06 |\n\n### 4.2.2\
    \ SELECT command\n\nIn this section, we are going to discuss how to select data\
    \ in a table. To select entire rows and columns in `employees` table, type:\n\
    ```sql\nSELECT * FROM employees;\n```\nSometimes you may not want all of the data.\
    \ We can select specific columns:\n```sql\nSELECT first_name, last_name FROM employees;\n\
    ```\n\n| first_name | last_name |\n| :--- | :--- |\n| Eugene | Krabs |\n| Squidward\
    \ | Tentacles |\n| Spongebob | Squarepants |\n| Patrick | Star |\n| Sandy | Cheeks\
    \ |\n\nWe can also change the order of column:\n```sql\nSELECT last_name, first_name\
    \ FROM employees;\n```\nThere is a `WHERE` clause if we are looking for something\
    \ specific. Let’s select all from `employees` where `employee_id` equals one:\n\
    ```sql\nSELECT * FROM employees\nWHERE employee_id = 1;\n```\nThis will give us\
    \ a specific employee, the employee that has an ID of one.\n\nSimilarly, we can\
    \ take reference of any column and their corresponding data such as `first_name`,\
    \ `last_name` and so on. We can also add conditions using comparison operator\
    \ to `WHERE` clause. Let’s find all employees that have an hourly pay greater\
    \ than or equal to 15:\n```sql\nSELECT * FROM employees\nWHERE hourly_pay >= 15;\n\
    ```\n\nWe can also add integrity constraints to `WHERE` clause. `NULL` means no\
    \ data, let’s display the data of every employee that does have a hire date:\n\
    ```sql\nSELECT * FROM employees\nWHERE hire_date IS NOT NULL;\n```\n\n| employee_id\
    \ | first_name | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- |\
    \ :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward\
    \ | Tentacles | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 |\
    \ 2023-01-04 |\n| 4 | Patrick | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy | Cheeks\
    \ | 17.25 | 2023-01-06 |\n\n### 4.2.3 UPDATE command\n\nIn this section, we are\
    \ going discuss how to update data from a table. In our table employee `Id` 6\
    \ is missing some data.\n\n| employee_id | first_name | last_name | hourly_pay\
    \ | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs |\
    \ 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03 |\n|\
    \ 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n| 4 | Patrick | Star | 12.50\
    \ | 2023-01-05 |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06 |\n| 6 | Sheldon |\
    \ Plankton |  |  |\n"
