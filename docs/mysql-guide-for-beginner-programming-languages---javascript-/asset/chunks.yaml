    \ *\nFROM employees\nWHERE NOT department = 'Sales';\n```\n\n# It returns rows\
    \ where the condition is not true.\n\n| employee_id | first_name | last_name |\
    \ salary | department |\n| 2 | Jane | Smith | 45000 | Marketing |\n| 4 | Alice\
    \ | White | 70000 | IT |\n\n### 9.2.4 BETWEEN operator\n\n```sql\nSELECT *\nFROM\
    \ employees\nWHERE salary BETWEEN 40000 AND 60000;\n```\n\n# It returns rows within\
    \ a specified range.\n\n| employee_id | first_name | last_name | salary | department\
    \ |\n| 1 | John | Doe | 60000 | Sales |\n| 2 | Jane | Smith | 45000 | Marketing\
    \ |\n| 3 | Bob | Brown | 55000 | Sales |\n\n### 9.2.5 IN operator\n\n```sql\n\
    SELECT *\nFROM employees\nWHERE department IN ('Sales', 'IT');\n```\n\n# It returns\
    \ rows that match any value in a list.\n\n| employee_id | first_name | last_name\
    \ | salary | department |\n| 1 | John | Doe | 60000 | Sales |\n| 3 | Bob | Brown\
