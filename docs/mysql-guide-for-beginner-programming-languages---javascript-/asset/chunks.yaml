    \n## 1.2 Installation of MySQL\n\nIn this section you will learn the installation\
    \ of MySQL work bench. Let’s get started by downloading MySQL from `dev.mysql.com`.\
    \ Select the operating system and download MySQL installer `8.0.19`. Save it in\
    \ appropriate location for e.g. Desktop.\n\n![](image_rsrc43B.jpg)\n\nClick on\
