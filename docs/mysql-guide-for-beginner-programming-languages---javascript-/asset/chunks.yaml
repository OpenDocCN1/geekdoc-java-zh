    # 前言


    `SQL` 是最强大的编程语言之一，用于处理 `RDBMS`（关系型数据库管理系统）的任务。它使用紧凑的英语语句来创建、定义、插入、更新和控制关系型数据库。


    `SQL` 用于在关系型数据库中存储和处理信息，而 `MySQL` 则用于开源关系型数据库。本电子书将同时讨论 `SQL` 和 `MySQL`。


    `MySQL` 最适合客户端-服务器环境。它提供了灵活的事务管理。它是许多应用程序、网站以及商业产品的主要关系型数据库。


    作为一本电子书，这将是关于如何使用 `MySQL` 提取、组织、管理和处理存储在关系型数据库中的数据的良好参考。我们已经通过多个示例详细讨论了 `DDL`、`DQL`、`DML`、`DCL`
    和 `TCL`。


    本电子书涵盖了广泛的数据库任务，方式更加易于理解、无痛且高效。你不会感到无聊。如果你觉得大多数编程书籍太枯燥，那么这可能是你入门 `MySQL` 的绝佳书籍。


    # MySQL 概述


    `SQL`（结构查询语言）最初由 IBM 创建，并于 1979 年由 Oracle 公司首次商业化实施，但当时没有官方标准，因此在后 1986 年由 `ANSI`
    和 `ISO` 改进并联合发布。1992 年发布了 `SQL’92`。它的组织方式改进得多：数据包含在表中，表分组在模式（schemas）中，模式分组在目录（catalogues）中，目录分组在集群（clusters）。`MySQL`
    的第一个版本由 Monty Widenius、David Axmark 和 Allan 开发，于 1995 年出现。到 2000 年，发布了多个版本的 `MySQL`。这些版本兼容几乎所有主要平台。


    `MySQL` 是一种基于结构查询语言（`SQL`）的 `RDBMS`（关系数据库管理系统）。关系型数据库以表格的形式存储信息，行和列表示不同的数据属性以及数据值之间的各种关系。


    我们使用命令来创建、定义、插入、提取、更新和控制数据库。以下是 SQL 命令的类型：


    * `DDL`（数据定义语言）

    * `DQL`（数据查询语言）

    * `DML`（数据操语言）

    * `DCL`（数据控制语言）

    * `TCL`（事务控制语言）


    我们将在接下来的章节中讨论所有内容。


    # 以下是使用 MySQL 的前 10 个应用程序


    1. 在线游戏

    2. 数字营销

    3. 零售销售点系统

    4. 物联网监控系统

    5. SaaS 应用

    6. Facebook

    7. Flickr

    8. Web 开发

    9. Twitter

    10. YouTube


    # 第 1 章：MySQL 简介

    ## 1.1 简介


    `MySQL` 是一种采用 `SQL`（结构查询语言）的软件。对于小型和大型应用程序都是非常快速、可靠、可扩展且易用。MySQL 是创始人 Widenius
    的女儿建议的名字。


    在日常生活中，如果我们访问商场，会看到店主使用扫描枪处理产品数据库。另一个例子，让我们考虑银行，他们正在处理客户数据库。第三个例子是学校，他们正在处理学生数据库。因此，数据库既可以手动在笔记本上处理，也可以通过如
    `MySQL` 等计算机软件进行处理。


    # 什么是数据库？


    数据是现实世界中到处使用的原始事实和数字。一组数据构成特定的信息或数据库。`SQL` 用于在关系型数据库中存储和处理信息。


    # 什么是关系型数据库？


    它是存储在一个或多个表中的组织数据集合。我们可以很容易看到并理解不同数据结构之间的相互关系。


    # MySQL 和 SQL 的区别


    我们使用 `MySQL` 创建、读取、更新和删除数据库。但 `SQL`（结构查询语言）是用于访问、处理和协调数据库的紧凑英语语句。在本电子书中，我们将讨论如何在输入的数据库上进行交互式操作。


