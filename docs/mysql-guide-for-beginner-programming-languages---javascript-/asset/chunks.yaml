    \ Now I am going to select my table, type:\n\n```sql\nSELECT * FROM employees;\n\
    ```\n\nNow if I delete the rows and to undo the changes, type:\n\n```sql\nROLLBACK\n\
    ```\n\nThis will restore my current transaction back to previous save point where\
    \ we used `commit`, type:\n\n```sql\nSELECT * FROM employees;\n```\n\nOur table\
