    # Note: If we want to save the change, use `COMMIT` command.


    # Chapter 7: Data Query Language (DQL)


    ## 7.1 Introduction to MySQL DQL


    `DQL` in `MySQL` is a part of the base grouping of SQL sub-languages. It is used
    to pass query to the data base schema. It offers maximum flexibility of using
    `SELECT` command to retrieve the information from database according to requirement
    of user. We are going to discuss in details about `SELECT` command.


    When a `SELECT` statement is fired against a table the result is compiled into
    a further temporary table according to requirements.


    We can use `SELECT` commands only if table is created and values are inserted.
    Let’s take an example of employees table which is already created.


    ### 7.1.1 Syntax1


    ```sql

    SELECT * FROM table_name;

    ```


    Implementation: To retrieve all information from employees table.


    ```sql

    SELECT * FROM employees;

    ```


