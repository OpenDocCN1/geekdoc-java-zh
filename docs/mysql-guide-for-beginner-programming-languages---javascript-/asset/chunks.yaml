  trans: "\n\n# `auto increment` 属性可以应用于设置为主键的列，每当我们插入新行时，我们的主键会自动填充，然后随后的每一行都会自动递增。\n\
    \n# 让我们删除 transactions 表并使用自动递增功能重新创建，类型：\n\n```sql\nCREATE TABLE transactions\
    \ (\n  transaction_id INT PRIMARY KEY AUTO_INCREMENT,\n  amount DECIMAL (5,2)\n\
    );\n```\n\n注意：默认情况下，`auto increment` 将设置为 `1`。\n\n# 让我们在 transactions 表中插入一些值，不需要插入\
    \ `transaction_id`，它将被自动分配。\n\n```sql\nINSERT INTO transactions (amount)\nVALUES\
    \ (2.56);\nSELECT * FROM transactions;\n```\n\n| transaction_id | amount |\n|\
    \ 1 | 2.56 |\n\n注意：这里 `transaction_id` 是自动插入的。\n\n# 我们可以设置主键从不同的值开始，类型：\n\n```sql\n\
    ALTER TABLE transactions\nAUTO_INCREMENT = 1000;\n```\n\n执行并获取结果，`transaction\
    \ ID` 从 `1000` 开始设置。我们必须删除整行并插入新值。\n\n## 8.7 FOREIGN KEY 外键约束\n\n外键是其中一个表中的 `PRIMARY\
    \ KEY`，可以通过 `foreign key` 在另一个表中找到它，我们可以在两个表之间建立连接。在我们的交易表里，这样做有两个主要好处：如果我想查看发起此交易的\
    \ `customer ID`，我可以引用 `customers` 表，然后找到该客户的姓和名。\n\n# 让我们创建 transaction 和 customer\
    \ 表，使用外键在它们之间建立连接\n\n# 我将创建一个新的 `customers` 表，类型：\n\n```sql\nCREATE TABLE customers\
    \ (\n  customer_id INT PRIMARY KEY AUTO_INCREMENT,\n  first_name VARCHAR (50),\n\
    \  last_name VARCHAR (50)\n);\n```\n\n执行并获取结果\n\n# 现在向表中插入一些值，类型：\n\n```sql\n\
    INSERT INTO customers (first_name, last_name)\nVALUES (“Fred”, “Fish”),\n(“Larry”,\
    \ “Lobster”),\n(“Bubble”, “Bass”);\n\nSELECT * FROM customers;\n```\n\n输出\n\n\
    | customer_id | first_name | last_name |\n| 1 | Fred | Fish |\n| 2 | Larry | Lobster\
    \ |\n| 3 | Bubble | Bass |\n\n# 现在，我们将通过 `customer ID` 在我们的 `customers` 表和 `transactions`\
    \ 表之间建立连接。让我们创建一个带有 `FOREIGN KEY` 约束的 transactions 表，类型：\n\n```sql\nCREATE TABLE\
    \ transactions (\n  transaction_id INT PRIMARY KEY AUTO_INCREMENT,\n  amount DECIMAL\
    \ (5,2),\n  customer_id INT,\n  FOREIGN KEY (customer_id) REFERENCES customers(customer_id)\n\
    );\n```\n\n执行并获取结果\n\n| transaction_id | amount | customer_id |\n\n注意：这里 `customer_id`\
    \ 列是 `FOREIGN KEY`。\n\n# 使用外键在两个表之间的连接所示所示：\n\n| customer_id | first_name | last_name\
    \ |\n| 1 | Fred | Fish |\n| 2 | Larry | Lobster |\n| 3 | Bubble | Bass |\n\n|\
    \ transaction_id | amount | customer_id |\n| 1000 | 4.89 | 2 |\n| 1001 | 2.68\
    \ | 3 |\n| 1002 | 3.32 | 1 |\n| 1003 | 4.99 | 3 |\n\n## 8.8 MySQL 中的 JOIN 子句\n\
    \n`JOIN` 是一个用于根据两个或多个表之间的相关列（例如 `foreign key`）合并来自这些表的行的子句。让我们连接之前创建的两个表。我们有两个表：一个\
    \ `transaction` 表和一个 `customers` 表。\n\n### 1. Transaction 表\n\n| transaction_id\
    \ | amount | customer_id |\n| 1000 | 4.89 | 2 |\n| 1001 | 2.68 | 3 |\n| 1002 |\
    \ 3.32 | 1 |\n| 1003 | 4.99 | 3 |\n\n### 2. Customers 表\n\n| customer_id | first_name\
    \ | last_name |\n| 1 | Fred | Fish |\n| 2 | Larry | Lobster |\n| 3 | Bubble |\
    \ Bass |\n\n# 让我们内连接两个表，类型：\n\n```sql\nSELECT *\nFROM transactions INNER JOIN\
    \ customers\nON transaction.customer_id = customer.customer_id;\n```\n\n```\n\n\
    输出\n\n| transaction_id | amount | customer_id | customer_id | first_name | last_name\
    \ |\n| 1000 | 4.89 | 2 | 2 | Larry | Lobster |\n| 1001 | 2.68 | 3 | 3 | Bubble\
    \ | Bass |\n| 1002 | 3.32 | 1 | 1 | Fred | Fish |\n| 1003 | 4.99 | 3 | 3 | Bubble\
    \ | Bass |\n\n# 第 9 章：MySQL 中的函数和逻辑运算符\n\n## 9.1 MySQL 中的函数\n\n一种接受用户提供的参数并返回返回值的存储程序称为\
    \ `Function`。MySQL 提供了许多函数。下面显示了一些。\n\n# 让我们统计 transaction 表中 `amount` 列的行数，类型：\n\
    \n```sql\nSELECT COUNT (amount)\nFROM transaction;\n```\n\n执行并获取结果\n\n# 查找 transaction\
    \ 表 `amount` 列中的最大值，类型：\n\n```sql\nSELECT MAX(amount)\nFROM transaction;\n```\n\
    \n执行并获取结果\n\n# 查找 transaction 表 `amount` 列中的平均值，类型：\n\n```sql\nSELECT AVG(amount)\n\
    FROM transaction;\n```\n\n执行并获取结果\n\n# 查找 transaction 表 `amount` 列中的总和，类型：\n\n\
    ```sql\nSELECT SUM(amount)\nFROM transaction;\n```\n\n执行并获取结果\n\n# 统计 transaction\
    \ 表 `amount` 列的行数，类型：\n\n```sql\nSELECT COUNT (amount)\nFROM transaction;\n```\n\
    \n执行并获取结果\n\n# 拼接 customers 表中的姓和名，类型：\n\n```sql\nSELECT CONCAT(first_name, '\
    \ ', last_name)\nFROM customers;\n```\n\n执行并获取结果\n\n## 9.2 逻辑运算符\n\n# 逻辑运算符用于组合多个条件。\n\
    \n# 让我们在 `employees` 表中使用逻辑运算符。\n\n```sql\nSELECT *\nFROM employees\nWHERE salary\
    \ > 50000 AND department = 'Sales';\n```\n\n执行并获取结果\n\n| employee_id | first_name\
    \ | last_name | salary | department |\n| 1 | John | Doe | 60000 | Sales |\n\n\
    ### 9.2.1 AND 运算符\n\n它返回两个条件都为真的行。\n\n```sql\nSELECT *\nFROM employees\nWHERE\
    \ salary > 50000 AND department = 'Sales';\n```\n\n### 9.2.2 OR 运算符\n\n它返回至少一个条件为真的行。\n\
    \n```sql\nSELECT *\nFROM employees\nWHERE salary > 50000 OR department = 'Marketing';\n\
    ```\n\n### 9.2.3 NOT 运算符\n\n它返回条件不为真的行。\n\n```sql\nSELECT *\nFROM employees\n\
    WHERE NOT department = 'Sales';\n```\n\n### 9.2.4 BETWEEN 运算符\n\n它返回指定范围内的行。\n\
    \n```sql\nSELECT *\nFROM employees\nWHERE salary BETWEEN 40000 AND 60000;\n```\n\
    \n### 9.2.5 IN 运算符\n\n它返回匹配列表中任何值的行。\n\n```sql\nSELECT *\nFROM employees\nWHERE\
    \ department IN ('Sales', 'IT');\n```\n\n# 第 10 章：一些重要的 MySQL 命令\n\n# 在本节中，我们将讨论用于处理数据库或架构对象的\
    \ MySQL 中重要子句。\n\n## 10.1 通配符字符\n\n# 通配符是用于处理数据库的特殊字符。有两种通配符——百分比和下划线。\n\n# 让我们在\
    \ `employees` 表中使用 `%` 来检索以 S 开头的第一个名，类型：\n\n```sql\nSELECT * FROM employees\n\
    WHERE first_name LIKE “s%”;\n```\n\n执行并获取结果\n\n"
