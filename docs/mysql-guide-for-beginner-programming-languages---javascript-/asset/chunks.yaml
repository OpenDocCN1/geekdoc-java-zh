    | 2024-07-24 | | |


    Note: Here time and datetime set to `NULL`.


    # Chapter 8: Role of Constraints


    In this section we will discuss about the constraints.


    ### 8.1 UNIQUE constraint


    The `UNIQUE` constraint in `MySQL` ensures that all values in a column are different.
    We can add it during table creation:


    ```sql

    CREATE TABLE products (

    product_id INT,

    product_name VARCHAR(25),

    price DECIMAL(4,2)

    );

    ```


    After creation, we can add it to an existing table:


    ```sql

    ALTER TABLE products

    ADD CONSTRAINT UNIQUE (product_name);

    ```


    ### 8.2 NOT NULL constraint


    `NOT NULL` constraint ensures that a column cannot have `NULL` values.


    ### 8.3 CHECK constraint


    The `CHECK` constraint is used to limit the values that can be placed in a column.


    ```sql

    CREATE TABLE employees (

    employee_id INT,

    first_name VARCHAR(50),

    last_name VARCHAR(50),

    hourly_pay DECIMAL(5,2),

    hire_date DATE,

    CONSTRAINT chk_hourly_pay CHECK (hourly_pay >= 10)

    );

    ```


    To remove the constraint:


    ```sql

    ALTER TABLE employees

    DROP CHECK chk_hourly_pay;

    ```


    ### 8.4 DEFAULT constraint


    `DEFAULT` constraint provides a default value for a column when none is specified
    during insertion.


    ```sql

    CREATE TABLE products (

    product_id INT,

    product_name VARCHAR(25),

    price DECIMAL(4,2) DEFAULT 0

    );

    ```


    ```sql

    INSERT INTO products (product_id, product_name)

    VALUES (10, "spoon"), (11, "fork");

    ```


    ### 8.5 PRIMARY KEY constraint


    The `PRIMARY KEY` is applied to a column (or columns) where each value must be
    both unique and not `NULL`.


    ```sql

    CREATE TABLE transactions(

    transaction_id INT PRIMARY KEY,

    amount DECIMAL(5,2)

    );

    ```


    ### 8.6 Auto increment attribute in MYSQL

