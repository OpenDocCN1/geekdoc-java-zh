    | 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |

    | 4 | Patrick | Star | 12.50 | 2023-01-05 |

    | 5 | Sandy | Cheeks | 17.25 | 2023-01-06 |

    | 6 | Sheldon | Plankton | 10.25 | 2023-01-07 |


    #### Customers table


    | customer_id | first_name | last_name |

    | :--- | :--- | :--- |

    | 1 | Fred | Fish |

    | 2 | Larry | Lobster |

    | 3 | Bubble | Bass |


    ### To combine using `UNION`, type


    ```sql

    SELECT first_name, last_name FROM employees

    UNION

    SELECT first_name, last_name FROM customers

    ```


    ### Output


    | first_name | last_name |

    | :--- | :--- |

    | Eugene | Krabs |

    | Squidward | Tentacles |

    | Spongebob | Squarepants |

    | Patrick | Star |

    | Sandy | Cheeks |

    | Sheldon | Plankton |

    | Fred | Fish |

    | Larry | Lobster |

    | Bubble | Bass |


    Note: If we want to combine duplicate values than use `UNION ALL` instead of `UNION`.


    ## 10.5 Views in MySQL


    We can create a virtual table using `VIEWS` in MySQL. The fields in a view are
    fields from one or more real tables in the database.


    ### Let’s view our employees table as `employees_attendance` table, type


    ```sql

    CREATE employees_attendance AS

    SELECT first_name, last_name

    FROM employees;

    ```


    So everything was successful, we have a new view, type:


    ```sql

    SELECT * FROM employees_attendance;

    ```


    ### Output


    | first_name | last_name |

    | :--- | :--- |

    | Eugene | Krabs |

    | Squidward | Tentacles |

    | Spongebob | Squarepants |

    | Patrick | Star |

    | Sandy | Cheeks |

    | Sheldon | Plankton |


    ## 10.6 Indexes in MySQL


    Indexes are used to find the values within a column more quickly. MySQL normally
    searches through a column.


    #### Customer’s table


    | customer_id | first_name | last_name |

    | :--- | :--- | :--- |

    | 1 | Fred | Fish |

    | 2 | Larry | Lobster |

    | 3 | Bubble | Bass |


    ### Let’s create index our customer table’s last name, type


    ```sql

    CREATE INDEX last_name_idx ON customers(last_name);

    ```


    Execute and get the result. If I want to search for a customer by `last_name`,
    type:


    ```sql

    SELECT * FROM customers

    WHERE last_name = “Bass”;

    ```


    ### Output


    | customer_id | first_name | last_name |

    | :--- | :--- | :--- |

    | 3 | Bubble | Bass |


    ## 10.7 Subqueries


    A query within the query is called subquery.


    ### Let’s display the name of employees whose hourly pay is equal to average pay
    from employees table, type


    ```sql

    SELECT first_name, last_name, hourly_pay, (SELECT AVG (hourly_pay) FROM employees)
    AS avg_pay FROM employees;

    ```


    Execute and get the result.


    ## 10.8 Group by clause


    A `GROUP BY` clause will aggregate all rows by a specific column often used with
    aggregate functions such as `SUM()`, `MAX()`, `MIN()`, `COUNT()` etc.


    #### Transaction table


    | transaction_id | amount | Order_date |

    | :--- | :--- | :--- |

    | 1000 | 4.89 | 2023-01-01 |

    | 1001 | 2.68 | 2023-01-01 |

    | 1002 | 3.32 | 2023-01-02 |

    | 1003 | 4.99 | 2023-01-02 |


    ### Let’s apply a group by clause in transaction table to calculate transaction
    per day, type


    ```sql

    SELECT SUM (amount), order_date

    FROM transactions

    GROUP BY order_date;

    ```


    ### Output


    | SUM(amount) | order_date |

    | :--- | :--- |

    | 7.57 | 2023-01-01 |

    | 8.31 | 2023-01-02 |


    ## 10.9 Roll up clause


    It is an extension of `GROUP BY` clause which produces another row and shows the
    super aggregate values.


    ### Let’s calculate the grand total of transaction made in transaction table using
    `ROLLUP`, type


    ```sql

    SELECT SUM (amount), order_date

    FROM transactions

    GROUP BY order_date WITH ROLLUP;

    ```


    ### Output


    | SUM(amount) | order_date |

    | :--- | :--- |

    | 7.57 | 2023-01-01 |

    | 8.31 | 2023-01-02 |

    | 15.88 | |


    ## 10.10 On delete clause


    There are two versions of `ON DELETE` clause:


    1. `ON DELETE SET NULL`

    2. `ON DELETE CASCADE`


    When a foreign key is deleted than we can replace the foreign key with the value
    0.


    ### Let’s take an example of customer table where customer id is a foreign key,
    so to delete the entire selected row, type


    ```sql

    SET foreign_key_checks = 0;

    DELETE FROM customers

    WHERE customer_id = 4;

    SELECT * FROM customers;

    ```


    Execute and get the result.


