- fmt: "\n# The `auto increment` attribute can be applied to a column that is set\
    \ as a key whenever we insert a new row our primary key can be populated automatically\
    \ then each subsequent row is auto incremented.\n\n# Let’s drop the transaction\
    \ table and recreate with auto increment feature, type\n\n```sql\nCREATE TABLE\
    \ transactions (\n  transaction_id INT PRIMARY KEY AUTO_INCREMENT,\n  amount DECIMAL\
    \ (5,2)\n);\n```\n\nNote: By default, `auto increment` will set to `1`.\n\n# Let’s\
    \ insert some values in transaction table, no need to insert `transaction_id`,\
    \ it will be automatically assigned.\n\n```sql\nINSERT INTO transactions (amount)\n\
    VALUES (2.56);\nSELECT * FROM transactions;\n```\n\n| transaction_id | amount\
    \ |\n| 1 | 2.56 |\n\nNote: Here `transaction_id` automatically inserted.\n\n#\
    \ We could set our primary key to begin at a different value, type\n\n```sql\n\
    ALTER TABLE transactions\nAUTO_INCREMENT = 1000;\n```\n\nExecute and get the result,\
    \ `transaction ID` set to `1000` onwards. We must delete entire rows and insert\
    \ new values.\n\n## 8.7 FOREIGN KEY constraint\n\nForeign key is a `PRIMARY KEY`\
    \ from one table that can be found within a different table using a `foreign key`\
    \ we can establish a link between two tables. There are two primary benefits to\
    \ this in our transaction table if I were to take a look at the `customer ID`\
    \ of who initiated this transaction, I could refer to the `customers` table then\
    \ find the first and last name of that customer.\n\n# Let’s create transaction\
    \ and customer table, establish a link between them using foreign key\n\n# I am\
    \ going to create a new table of `customers`, type\n\n```sql\nCREATE TABLE customers\
    \ (\n  customer_id INT PRIMARY KEY AUTO_INCREMENT,\n  first_name VARCHAR (50),\n\
    \  last_name VARCHAR (50)\n);\n```\n\nExecute and get the result\n\n# Now insert\
    \ some values in to the table, type\n\n```sql\nINSERT INTO customers (first_name,\
    \ last_name)\nVALUES (“Fred”, “Fish”),\n(“Larry”, “Lobster”),\n(“Bubble”, “Bass”);\n\
    \nSELECT * FROM customers;\n```\n\nOutput\n\n| customer_id | first_name | last_name\
    \ |\n| 1 | Fred | Fish |\n| 2 | Larry | Lobster |\n| 3 | Bubble | Bass |\n\n#\
    \ Now, we are going to create a link between our `customers` table and our `transactions`\
    \ table via `customer ID`. Let’s create a transaction table with `FOREIGN KEY`\
    \ constraint, type\n\n```sql\nCREATE TABLE transactions (\n  transaction_id INT\
    \ PRIMARY KEY AUTO_INCREMENT,\n  amount DECIMAL (5,2),\n  customer_id INT,\n \
    \ FOREIGN KEY (customer_id) REFERENCES customers(customer_id)\n);\n```\n\nExecute\
    \ and get the result\n\n| transaction_id | amount | customer_id |\n\nNote: Here\
    \ `customer_id` column is `FOREIGN KEY`.\n\n# Link between two table using foreign\
    \ key is shown below\n\n| customer_id | first_name | last_name |\n| 1 | Fred |\
    \ Fish |\n| 2 | Larry | Lobster |\n| 3 | Bubble | Bass |\n\n| transaction_id |\
    \ amount | customer_id |\n| 1000 | 4.89 | 2 |\n| 1001 | 2.68 | 3 |\n| 1002 | 3.32\
    \ | 1 |\n| 1003 | 4.99 | 3 |\n\n## 8.8 JOIN clause in MySQL\n\nA `JOIN` is a clause\
    \ that is used to combine rows from two or more tables based on a related column\
    \ between them such as a `foreign key`. Let’s join two previously created table.\
    \ We have two tables a table of `transaction` and a table of `customers`.\n\n\
    ### 1. Table of Transaction\n\n| transaction_id | amount | customer_id |\n| 1000\
    \ | 4.89 | 2 |\n| 1001 | 2.68 | 3 |\n| 1002 | 3.32 | 1 |\n| 1003 | 4.99 | 3 |\n\
    \n### 2. Table of Customers\n\n| customer_id | first_name | last_name |\n| 1 |\
    \ Fred | Fish |\n| 2 | Larry | Lobster |\n| 3 | Bubble | Bass |\n\n# Let’s inner\
    \ join both table, type\n\n```sql\nSELECT *\nFROM transactions INNER JOIN customers\n\
    ON transaction.customer_id = customer.customer_id;\n```\n\nExecute and get the\
    \ result\n\nOutput\n\n| transaction_id | amount | customer_id | customer_id |\
    \ first_name | last_name |\n| 1000 | 4.89 | 2 | 2 | Larry | Lobster |\n| 1001\
