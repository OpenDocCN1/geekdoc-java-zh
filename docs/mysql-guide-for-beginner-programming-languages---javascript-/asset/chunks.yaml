  trans: "\n\n# MySQL 允许我们使用 `CREATE` 命令创建数据库表。让我们创建一个员工表。如果我们在 MySQL Workbench 中执行如下所示的语句序列，就可以创建一个员工表。\n\
    \n```sql\nCREATE TABLE employees (\n  employee_id INT,\n  first_name VARCHAR (50),\n\
    \  last_name VARCHAR (50),\n  hourly_pay DECIMAL (5,2),\n  hire_date DATE\n);\n\
    ```\n\n我将向你展示如何在 MySQL 中创建一些表。关系型数据库中的表表由行和列组成，类似于 Excel 表格。在本主题中，我们将创建表和列。\n\n\
    只需输入 `CREATE TABLE` 然后是表名，我将创建一个名为 `employees` 的表，然后在末尾添加一组括号和分号；在括号内，我们将列出员工的列，让我们有\
    \ `employee_id`、`first_name`、`hourly_pay` 和 `hire_date`。现在，我们需要为每一列设置在每个列中存储的数据的类型。\n\
    \n### 让我们为每一列设置数据类型：\n- `employee_id INT` – 数据将为整数\n- `first_name VARCHAR (50)`\
    \ – 最多 50 个字符序列\n- `last_name VARCHAR (50)` – 最多 50 个字符序列\n- `hourly_pay Decimal\
    \ (5,2)` – 小数点前最多 5 位，后 2 位 (99999.99)\n- `hire_date DATE` – 日期格式 (dd-mm-yyyy)\n\
    \n如果你需要选择表，请输入：\n**语法：** `SELECT * FROM table name;`\n**实现：** `SELECT * FROM employees;`\n\
    \n| employee_id | first_name | last_name | hourly_pay | hire_date |\n| :--- |\
    \ :--- | :--- | :--- | :--- |\n\n我们已成功创建了一个包含五列的员工表。\n\n## 3.2.2 RENAME 命令\n\n\
    如果我们需要重命名上面的表，请输入：\n**语法：** `RENAME TABLE original name TO new name;`\n**实现：**\
    \ `RENAME TABLE employees TO workers;`\n\n在 MYSQL workbench 执行并获取结果。\n\n## 3.2.3\
    \ DROP 命令\n\n如果我们需要删除上面的表，请输入：\n**语法：** `DROP TABLE name of table;`\n**实现：** `DROP\
    \ TABLE employees;`\n\n在 MYSQL workbench 执行并获取结果。\n\n## 3.2.4 ALTER 命令\n\n如果我们需要修改表，让我们添加新列\
    \ `phone_number`，输入：\n```sql\nALTER TABLE employees\nADD phone_number VARCHAR\
    \ (15);\n```\n在 MYSQL workbench 执行并获取结果。\n\n让我们将 `phone_number` 重命名为 `email`，输入：\n\
    ```sql\nALTER TABLE employees\nRENAME COLUMN phone_number to email;\n```\n在 MYSQL\
    \ workbench 执行并获取结果。\n\n让我们为 `email` 列添加数据类型，这里我们必须使用 `MODIFY` 命令，输入：\n```sql\n\
    ALTER TABLE employees\nMODIFY COLUMN email VARCHAR (100)\n```\n在 MYSQL workbench\
    \ 执行并获取结果。\n\n让我们在 `last_name` 之后添加 `email`，输入：\n```sql\nALTER TABLE employees\n\
    MODIFY email VARCHAR (100)\nAFTER last_name;\n```\n在 MYSQL workbench 执行并获取结果。\n\
    \n让我们删除 `email` 列，输入：\n```sql\nALTER TABLE employees\nDROP COLUMN email;\n```\n\
    在 MYSQL workbench 执行并获取结果。\n\n# 第 4 章：数据操语言 (DML)\n\n## 4.1 MySQL DML 绪览\n\nMySQL\
    \ DML 处理数据库表内数据的修改。DML 语句用于向数据库中添加（插入）、删除和修改（更新）数据。\n\n以下是 DML 命令：\n- `INSERT`\
    \ – 用于手动向表中添加行。\n- `SELECT` – 我们可以使用 `Select` 命令访问和操作数据。\n- `DELETE` – 我们可以使用\
    \ `Delete` 命令删除现有表的行。\n- `UPDATE` - 用于更改表中的实际数据。\n\n## 4.2 DML 命令执行\n\n在上一章中，我们创建了一个\
    \ `employees` 表，现在让我们使用 DML 命令操作该表。\n\n### 4.2.1 INSERT 命令\n\n在本主题中，我将讨论如何向表中插入行。我们有一个名为\
    \ `employees` 的表。我将从我的表 `employees` 中选择所有内容。\n\n```sql\nSELECT * FROM employees;\n\
    ```\n\n| employee_id | first_name | last_name | hourly_pay | hire_date |\n| :---\
    \ | :--- | :--- | :--- | :--- |\n\n让我们使用 `INSERT` 命令插入一行数据。\n\n要向表中插入一行，我们将输入\
    \ `INSERT INTO` 紧跟表名，然后是 `VALUES` 括号和分号；在这组括号之间，我们将添加该行的所有数据。我们将按照此顺序，从 `employee_id`、`first_name`、`last_name`\
    \ 等以此类推，但我们必须注意数据类型。每条数据之间将用逗号分隔。\n\n在 `Employees` 表中插入一行数据：\n```sql\nINSERT INTO\
    \ employees\nVALUES (1, \"Eugene\", \"Krabs\", 25.50, \"2023-01-02\");\n```\n\n\
    现在我们可以执行这些语句并获得所示结果。\n\n| employee_id | first_name | last_name | hourly_pay |\
    \ hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50\
    \ | 2023-01-02 |\n\n一次性插入多行：\n```sql\nINSERT INTO employees\nVALUES (1, \"Eugene\"\
    , \"Krabs\", 25.50, \"2023-01-02\"),\n(2, \"Squidward\", \"Tentacles\", 15.00,\
    \ \"2023-01-03\"),\n(3, \"Spongebob\", \"Squarepants\", 12.50, \"2023-01-04\"\
    ),\n(4, \"Patrick\", \"Star\", 12.00, \"2023-01-05\"),\n(5, \"Sandy\", \"Cheeks\"\
    , 17.25, \"2023-01-06\");\n```\n执行后：\n```sql\nSELECT * FROM employees;\n```\n\n\
    | employee_id | first_name | last_name | hourly_pay | hire_date |\n| :--- | :---\
    \ | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward\
    \ | Tentacles | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 |\
    \ 2023-01-04 |\n| 4 | Patrick | Star | 12.00 | 2023-01-05 |\n| 5 | Sandy | Cheeks\
    \ | 17.25 | 2023-01-06 |\n\n### 4.2.3 UPDATE 命令\n\n在本节中，我们将讨论如何更新表中的数据。在我们的表中，员工\
    \ `Id` 6 缺少部分数据。\n\n```sql\nUPDATE employees SET first_name = \"Sheldon\", last_name\
    \ = \"Plankton\", hourly_pay = 20.00, hire_date = \"2023-01-07\" WHERE employee_id\
    \ = 6;\n```\n\n| employee_id | first_name | last_name | hourly_pay | hire_date\
    \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02\
    \ |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants\
    \ | 12.50 | 2023-01-04 |\n| 4 | Patrick | Star | 12.00 | 2023-01-05 |\n| 5 | Sandy\
    \ | Cheeks | 17.25 | 2023-01-06 |\n| 6 | Sheldon | Plankton | 20.00 | 2023-01-07\
    \ |\n\n"
- fmt: "\n# Let’s update single column `hourly_pay = 10.25`, `type`\n\n```sql\nUPDATE\
    \ employees\nSET hourly_pay = 10.25\nWHERE employee_id = 6;\n```\n\n### Output\n\
