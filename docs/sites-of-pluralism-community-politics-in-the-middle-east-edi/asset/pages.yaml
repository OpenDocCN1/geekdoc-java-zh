  md: '# SITES OF PLURALISM


    involves "the rejection of a singular concept of the philosophical or political
    domain, the acceptance of the diversity of the social realm, and the view of the
    social subject as a site of multiple group memberships."4 While overlapping with
    related notions of identity politics, multiculturalism, and minority rights, the
    concept of pluralism refers specifically to the inherent co-existence of multiple
    community formations (religious, ethnic, legal, civic, and so on) in a given social
    site. A site is a location of construction, occurrence, activity, and interaction.
    As the binding metaphor of this volume, "sites" designate a range of heterogeneous
    domains and platforms of collective action and engagement. Sites of pluralism,
    therefore, encompass all martial areas where individuals and groups claim, regulate,
    and contest power relations within politics and communities. Equally important,
    rather than assuming diversity, tolerance, and dialogue as a mere given, pluralism
    calls for an engaged commitment to recognize and understand others across perceived
    or claimed lines of difference.5


    Whether one adheres to the equilibrium or the conflict model, pluralism manifests
    itself in processes of inclusion and exclusion that are performed in specific
    political and historical contexts. It is therefore a mode of "historical'
