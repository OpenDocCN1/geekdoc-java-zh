  md: '# SITES OF PLURALISM


    Eurocentric monism, Cavanaugh argues that contemporary international law carries
    on the negative legacy of the colonial project. Instead of ensuring nonviolative
    relations, the law itself acts as a form of imposing what one community believes
    is good for all. This colonial logic reaches a climactic point especially in the
    legal policing of Muslim communities in the West and the sovereign states in the
    Middle East.


    In tandem with the marginalization of Islam and Muslim communities in the Western
    legal framework, in the Middle East have engaged with the international legal
    machinery on issues related to their minority groups and religious communities,
    while also drawing on Islamic legal practices to either propel or discard the
    right paradigm. There is an enormously wide spectrum of voices and interpretations
    that inform these practices by state legislators and religious jurists. According
    to Cavanaugh, this plurality has to do with the historical formation of the shari’a.
    Since the sources of Islamic making (the Qur’an and the summa) did not provide
    complete content, hermeneutic endeavor became inevitable. More importantly, this
    led Islamic law to maintain strong interaction with the Muslim community and allowed
    a great margin for adaptation to different social and cultural contexts. However,
    Cavanaugh cautions against romanticizing the state. States making case for Islamic
    legal pluralism, and individual actors draw on Islamic law for rights-based good
    governance and legitimizing restrictions on women, ethnic minorities, and other
    religious communities. At any rate, it is important to note that Islamic legal
    hermeneutics will continue to evolve. The issue once again is the problematic
    reluctance of the international human rights regime to acknowledge them. As Cavanaugh
    reminds us, in the post-Arab spring juncture, an important opportunity of fostering
    dialogue between Islamic law and the human rights project was wasted.³ Of engaging
    with the political communities that emerged from the fraught political terrain
    of the Arab Spring, the power elite fell back on the good old argument that religion
    was an obstacle to the democratization of Middle Eastern societies.


