  md: '# ACKNOWLEDGMENTS


    This volume is the product of the “Pluralism and Community in the Middle East
    research initiative convened by the Center for International and Regional Studies
    (CIRS) at Georgetown University-Qatar in 2016. I would like to thank Mehran Kamrava,
    the Director of the Center, and Zahra Babar, the Associate Director for Research,
    for launching and supporting this important and timely research initiative. The
    goal of the project was to examine the significance and dynamics of ethnic, linguistic,
    cultural, and religious communities in the Middle East through a variety of multidisciplinary
    perspectives that add original insight to the subject. I thank the authors of
    the individual chapters in this volume as well as other scholars who attended
    the working group meetings—Paolo D''Urbano, Amanda Garrett, and Shak Hanish—for
    generously bringing their expertise to the table to accomplish this goal.


    I could not have survived without the wonderful staff members of CIRS. Suzi Mirgani,
    the Managing Director of CIRS Publications, offered her assistance in each and
    every step of the production of this book. I am indebted to Jackie Starbird, Elizabeth
    Wanucha, Misba Bhatti, and Umber Latafat for all the logistical support they provided
    from the inception of the project. I also benefited substantially from the constructive
    feedback of the anonymous reviewers and the editorial support of Michael Dyer,
    Jon de Peyer, Daisy Leitch, and Kathleen May. I would like to acknowledge the
    Qatar Foundation for Education, Science and Community Development for their enduring
    commitment to support scholarly research on the pressing issues of our times in
    every field of inquiry.


    Last, but not least, I am immensely grateful to my wife, Nurgül, and our children
    Ikbal, Ebrar, and Tarık, for their plural ways of support while I was working
    on this book. I am blessed with their unfaltering love, care, and patience.'
