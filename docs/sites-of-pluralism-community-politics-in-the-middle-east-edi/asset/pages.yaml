    # Conclusion


    Despite the fact that the days of IS controlling significant territory across
    Iraq and Syria appear to be drawing to a close,\^102 the organization has left
    behind a horrific legacy. Key to interpreting and analyzing this legacy will be
    an appreciation of the devastating brutality and heritage destruction carried
    out by IS, which has included deliberate attacks against two of the most vulnerable
    minorities in Iraq and Syria: Yazidis and Christians. This has been a two-pronged
    campaign: it included violent genocidal pogroms that ended in enslavement, gang
    rape, torture, and massacre, on the one hand, and a very deliberate parallel effort
    to destroy the heritage sites and symbols that enrich the collective identity
    of these communities, on the other. Such attacks on the human/heritage dimension
    of a given community unfortunately ruptured their identity, dismembering their
    connections to each other and to their collective past.


    Beyond this, however, lies an even darker dimension to the human/heritage destruction
    wrought by the IS. Many of the organization’s attacks on the Yazidis and Christians
    are deliberately orchestrated to connect with earlier waves of genocide endured
    by these groups. For example, many of the IS attacks against the Yazidis included
    the destruction of their villages and their forced migration to urban centers,
    reminiscent of the Arabization programs undertaken by the Ba''th in the 1970s
    and 1980s. More to the point, attacks by IS on Christian sites such as the Armenian
    church in Deir ez-Zour and villages along the Khabur River have been deliberately
    designed to conjure sharp memories of the Armenian genocide and the Simele massacre.
    Reenacting earlier waves of genocide allows IS to connect to its contemporary
    brutality—ideologically, temporally, and physically—to those moments in Yazidi
    and Christian history that are most sensitive and painful. This deliberate layering
    of genocide means moments of direct persecution extend beyond the human/heritage
    suffering of the present to invoke'
