    Inclusion/exclusion: reflections on the Arab Middle East


    In the Middle East in general, minority groups seem to have a more acute sense
    of themselves as minorities. Here, one might cite the case of Jews in Morocco
    or Coptic Christians in Egypt. Here, the minority group comes to accept some degree
    of assimilation as a form of submission to the hegemony of the majority. Thus,
    the overall processes by which identity is constituted by accepting difference
    are often limited to the national scale, and may not permeate down to the urban
    realm. In Southeast Asia and Europe, national ideologies typically filter down
    to the local level, but, in the Middle East, there may be a complete erasure of
    a dialogue of difference at the urban scale. For example, some Coptic women have
    started to veil in the streets of Cairo. Their choice is not one made from religious
    conviction or as a result of state or municipal regulation; it is simply a measure
    of convenience that affords them protection and allows them to avoid standing
    out. It therefore embodies a survival tactic within a hegemony of sanction, mandated
    by a necessity for public engagement in urban practices.


    One of the most interesting forms of assimilation may to come from the Middle
    East and involves a process through which minority groups are expected to submit
    to the hegemony of a larger majority to simply maintain their independence. It
