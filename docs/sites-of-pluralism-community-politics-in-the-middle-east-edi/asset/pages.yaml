    This volume


    One of the distinguishing features of this collection is that each chapter looks
    beyond the present and provides a historically grounded explanation for the topic
    it addresses. The chapters share a consensus that the Middle East has historically
    been a diverse region that witnessed peaceful co-existence among different communities.
    A glaring gap in research about the concrete sites of pluralism seems to be pervasive,
    too. The chapters address the impact of state policies on the diversity and heterogeneity
    of national identities manifested at multiple levels, including education, cultural
    heritage, architecture, economic activities, citizenship, and identity formation.
    This volume does not limit its focus to religious and ethnic minorities in the
    region.30 Nor does it repeat the case for the diversity of Muslim societies and
    epistemological plurality of Islam.31 Rather, the contributors approach the question
    of pluralism and the community in the Middle East as the experienced of populations
    constantly navigating the boundaries of inclusion and exclusion mechanisms.


