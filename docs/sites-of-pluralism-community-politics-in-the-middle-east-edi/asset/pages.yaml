    The Jewish quarter as a case of inclusive/exclusive space/place


    Judaism developed and spread in a unique urban context. This has allowed some
    to argue that a historic Jewish tradition of self-segregation was always driven
    by urban necessity. The community clustered around the synagogue because it was
    also the most convenient way to observe the Sabbath, at which a certain concentration
    of Jews was necessary to meet the requirement of minyan (ten men for regular prayers,
    three times a day, every day). Because of dietary laws, Jews also needed access
    to a kosher butcher.


    In Europe, the Jewish quarter was typically an enforced ghetto. For example, Jews
    in Venice during the early fifteenth century were confined to protect gentiles.
    The ghetto then could be interpreted as a punitive space. Its existence also resulted
    in the evolution of a rich, uniquely cultural life out of a need to forge a world
    apart. One reflection of these conditions is that Yiddish came to spoken prominently
    in European cities where Jews were excluded.


    The experience of Islamic cities with minority Jewish populations was more diverse
    and multicultural. There was, for example, no strategy of theological Puritanism
    towards Jews. In Islam, Jews are accepted as a “people of the book,” rather than
    being seen as fundamentally other. Thus, one of the major differences between
    European and Islamic urban experience for Jews was that the gates of the European
    ghetto were locked from the outside at the discretion of the gentiles. By contrast,
    the mellah was locked from the inside at night—as were the gates of other quarters
