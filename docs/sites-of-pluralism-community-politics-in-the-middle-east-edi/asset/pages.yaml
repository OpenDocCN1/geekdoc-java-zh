  md: '# SITES OF PLURALISM


    Tambar raises a significant question for this study: “What, then, are the limits
    of pluralism when it is organized within the institutional and ideological frameworks
    of the nation-state?”¹¹⁸ The rhetoric of inclusion that is employed by ruling
    powers does not automatically guarantee an expanded space for heterogeneous populations
    in the public life of the nation. Even under the regime of inclusivism, social
    groups can experience political vulnerability. “Increasingly and in many locales,
    the discourse of inclusion represents a modality of governance that disciplines
    the boundaries within which social difference is permitted to authenticate itself.”¹¹⁹
    The state apparatus (education, law, and so on) regulate the plural field of social,
    religious, economic, and ethnic differences between the existing communities of
    the nation. Examining the complex relationship of the Alevi community to the modern
    Turkish Republic, Tambar raises the double bind of pluralism to the nation-state
    as follows:


    To conceptualize pluralism as a tactic of inclusion within a regime of governance
    requires attention to the regulated forms of social difference—its key terms,
    its discursive and affective modalities, and its sites of institutional modalities,
    and its sites of institutional manifestation and mooring. For many Alevi today,
    this assemblage once binds and empowers them. It created tools of political maneuver
    and possibilities of political engagement for a community that has been excluded
    from participation in state planning and policy formulation. These empowering
    forces also set the terms of reference necessary for Alevi discourse to be validated
    legitimately. They incite but also monitor and regulate displays of collective
    difference.²⁰


    The crucial question at stake, therefore, is how communities participate in shaping
    the public and political culture of the nation to which they belong, without just
    being fixed in some granted rights and space. While liberal norms will certainly
    continue to inspire contemporary societies can achieve ethnic, linguistic, and
    religious diversity, the mere macro-level democracy afforded by liberalism on
    the basis of citizenship equality cannot secure pluralism. In Monique Deveaux’
    words, “a merely descriptive term denoting the presence of different cultures—a
    commitment to cultural pluralism describes a normative position that agrees basic
    respect and recognition to culturally diverse groups.”²¹


    The era of globalization has led to fundamental changes in the nation-state-based
    conceptions of pluralism and community. Transnational spatial formations have
    given rise to new forms of hybridization as well as marginalization of communities.²²
    The Muslim communities in the West are an emblematic example of this double bind.
