    Middle East, particularly in Syria where a proxy war with a sectarian tone is
    currently being fought between Iran and Saudi Arabia.


    There are a number of academic works in English, Persian, and French dealing with
    ethnic groups such as the Kurds and Baluchs in Iran, but their main focus is often
    on ethnicity rather than sect. To our knowledge, this is the first study of the
    socioeconomic challenges faced by Sunni Iranians across the country. Given the
    lack of directly related academic literature on this topic, this study has benefited
    from a wide range of primary sources in Iran.


    The chapter starts by mapping the Sunni population in Iran. Before addressing
    the socioeconomic challenges of this section of Iranian society, it is important
    to highlight the geographic, cultural, and linguistic detachments among them.
    This will be followed by a brief historical overview of the evolution of Iran’s
    Shi-Sunni divide. Iran was a Sunni majority country up until the fifteenth century
    when the country went through one of the most significant socio-religious transitions
    in Islamic history. Although this radical top-down social engineering policy transformed
    the religious landscape of the country, it could not homogenize all social groups.
    Generally, communities managed to maintain their Sunni identity for centuries
    thereafter.


    A clearer historical insight into the relationship between the Shi’i and the Sunni
    communities can help us understand the current situation. Following a brief discussion
    of the sociopolitical realities of the Sunni population in the Safavid and Qajar
    periods, the chapter provides an overview of developments in the Pahlavi era.
    The Pahlavis embarked on a radical process of nation-state building, which was
    centralist and Persian-centric. Reza Shah, the founder of the dynasty, used heavy-handed
    measures to modernize the country, and some of his policies had serious implications
    for ethnic groups living at the periphery of Iranian society. Although Pahlavi
    policies had no sectarian foundation, the Sunni communities, which belonged to
    various marginalized ethnic groups, were nonetheless affected by these modernization
    policies.


    This chapter gives more attention to the Sunni communities after the formation
