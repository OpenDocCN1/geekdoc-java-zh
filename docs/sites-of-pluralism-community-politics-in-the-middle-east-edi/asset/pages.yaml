  md: '# INTRODUCTION


    reckoning that would inevitably be “both contentious as a political project and
    unsettling in its effects.”10 Thus, any attempt to produce a prescriptive framework
    of pluralism is fallacious precisely because this would only “lead us to mark
    the deficiencies of its actual use, rather than to an understanding of what invocation
    contextually signifies.”11 In a similar manner, rather than a natural, nonvoluntary
    community with a set of shared features, a community is always relational and
    is formed by differences from, as well as affiliations with, other entities.12
    As sociologist Gerald Delanty points out, “lying at the heart of the community
    is an ambivalence. On the one side, it expresses locality and particularness—the
    domain of intimate social relations, the familiar, proximity—and the other, it
    refers to the universal community, in which all humans participate.”13 Somewhere
    between kinship and society, community is a realm in which individuals experience
    physical as well symbolic boundaries that regulate their interactions with others.
    The dynamics of inter-community relations, moreover, frequently shuffled between
    what political James Scott calls “public” and “hidden” transcripts.14 In other
    words, marginalized or subordinate communities often find themselves in a position
    of employing a dual discourse of conformity (public) and defiance (hidden) in
    their relations with different counterparts.15


    Pluralism is commonly regarded as the hallmark of liberalism.16 As the embodiment
    of the political modernity of post-theoretical studies, the liberal national-state
    is taken for granted as the ideal of forming legitimacy to multiple groups with
    different normative values, dispositions toward selfrealization, and conceptions
    of public existence. Yet, in a somewhat paradoxical way, nation-state formation
    in the Middle East has posed significant challenges to pluralism. Efforts to standardize
    and create a particular national identity have led to the suppression of differences
    for the sake of the “ideal citizen.” National belonging has imposed internal homogeneity
    as a nonnegotiable imperative at the expense of difference. If few attempts have
    been to reconcile seemingly primordial divides that have defined relations between
    communities, this is in large part a product of political theoretic that seeks
    to produce a narrative of a homogeneous Middle East at the expense of the erasure
    of rich fabric of communities in each country.


    With the demise of the legal pluralism of traditional empires—which recognized
    the availability of different bodies of law for different groups, usually by the
    pragmatic necessity of the territorial and economic expansion—religious and political
