  md: '# INTRODUCTION


    # COMMITIES IN THE PLAYING FIELD OF PLURALISM


    Firat Oruc


    The very strength of the cultural disposition to pluralism in numerous zones of
    life today mobilizes a series of movements against it.¹


    How can we approach the concepts of pluralism and community in the Middle East
    without treating them as either self-evident facts or normative values that each
    society reflect? The Middle East is viewed either as a region that is entrapped
    in the abyss of fundamentalism and authoritarianism and dreadfully lacking in
    the recognition of pluralism in religion, culture, law, and politics, or as a
    bygone mosaic of communities that coexisted peacefully for centuries. However,
    many analysts wonder, has “a region for half a millennium was a global exporter
    of pluralism and religious harmony ... become the least tolerant and stable place
    on the planet?”² The pundit advocate for a revival of pluralism as a sure recipe
    to fix the so-called democratic deficit of the Middle East.³


    But the policy circles have failed to appreciate that rather than a mere pragmatic
    approach to accommodate difference among and across different groups, pluralism
    is a multidimensional site of negotiation and contestation. To Use East historian
    Orit Bashkin’s helpful definition, pluralism


