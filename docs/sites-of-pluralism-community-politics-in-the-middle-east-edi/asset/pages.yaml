    # Conclusion


    Although Iran is one of the most diverse nations in the region, the state has
    been reluctant to adopt a pluralistic approach to sociopolitical and economic
    development. Since the beginning of the modern nation-building project in Iran,
    the Persian-centric policies of the state have undermined the evolution of a pluralistic
    national consciousness that could empower and integrate the marginalized communities
    living on the periphery of Iranian society. The revolution and the emergence of
    the Shi’i supremacist discourse deepened the existing divisions between the center
    and the Sunni communities in the borderlands. Creating a bridge between the periphery
    and the core will be difficult unless the state recognizes cultural pluralism
    in order to implement effective and inclusive development policies across the
    country. The public policies of both the Pahlavi regime and the Islamic Republic
    have not been informed by pluralism, and the marginalized communities in the Sunni
    provinces have not benefited from economic development.


    Although Pahlavi dynasty implemented a major program of sociopolitical reform
    in the country, the Sunni provinces did not benefit from the economic leap of
    the 1960s and 1970s. While the previous regime did not enforce any overtly secular
    policy, its Persian-centric and centralized approach did do little to transform
    the harsh socioeconomic realities of the Sunni majority provinces.


    The 1979 revolution and the formation of the Islamic Republic in Iran only exacerbated
    the situation for the Sunni Iranians. The Islamic Republic based on its ideology
    on the redistribution of wealth and the empowerment of the impoverished segments
    of society. However, the ethnic Sunni Iranians who lived in some of the most impoverished
    regions of the country received very little attention from the new order in Tehran.


    Some deprived regions have experienced considerable economic development since
    the revolution, the fundamental economic challenges in the Sunni majority provinces
    have largely unchanged. Informal economic activities, including smuggling and
    drug trafficking, have become the most lucrative and common occupation for many
    Sunni Iranians given the lack of viable alternatives. The heavy-handed policies
    adopted by the state to counter the informal economy have helped deepen Sunni
    grievances and the sense of victimization. The economic challenges, coupled with
    the state''s Shi’i supremacist discourse, have sharpened the existing Shi’i–Sunni
    divide in Iran. The lack of economic regeneration and the state’s'
