    The language of the Hopa Hemshin, known as Homshetma or Hhamsheti, is a Western
    Armenian dialect, although it is not considered mutually intelligible with other
    Western Armenian dialects.³38 It is spoken around 20,000 to 30,000 people living
    in villages in the Hopa and Borçka districts of Artvin Province, and is likely
    (at least understood) by migrant worker communities in the cities of western Turkey.
    Their dialect is linguistically unique in that it is unaffected by standard Armenian,
    especially the nineteenth-century reforms and reintroduction of classical Armenian
    words. It therefore retains a significant Turkish vocabulary that has otherwise
    been “purged” from Armenian dialects, meaning that Homshetma is one of the only
    “pure” dialects of Armenian.³39 In addition to speaking an Armenian dialect, the
    Hopa Hemshin also share a number of cultural festivals with Armenian Christians,
    particularly Vardavat.³40 Among Armenian Christians, Vardavar represents the Feast
    of the Transfiguration of Christ and is usually celebrated in July. However, the
    festival celebrates Christianity and has been celebrated in Persian-speaking territories
    where it is known as tirgān or ab-rizān.³41 The Christian connotation is removed
    from the Hopa Hemshin festival; however, they participate in the tradition of
    throwing water over one another, which demonstrates the continuities with pre-Islamic
