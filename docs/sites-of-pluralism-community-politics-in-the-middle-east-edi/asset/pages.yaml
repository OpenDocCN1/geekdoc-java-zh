    segregation in relation to the theoretical construct of the traditional Islamic
    city. Indeed, this framing allows us to arrive at an entirely different understanding
    of inclusion, based on different attitudes toward recognition and reciprocity
    on the one hand and toward assimilation and submission on the other.


    Segregation was an operative principle in the traditional Islamic city, and gave
