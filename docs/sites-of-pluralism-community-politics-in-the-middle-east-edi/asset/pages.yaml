  md: '# INTRODUCTION


    In the first chapter of this section, Kathleen Cavanaugh highlights governance
    and law as two fundamental areas in which policies of inclusion are designed and
    implemented. Writing with a strong command of the political and theoretical dimensions
    of law, Cavanaugh attempts to open up a space for faith in the contemporary human
    rights project. Is it possible to think of religious community beyond its current
    problematic association with violence and extremism? What place is “religion”
    offered in the framework of law and rights? The secularist mandates of contemporary
    liberal democracy, observes Cavanaugh, have excluded and faith-based communities
    from the human rights project.³² The idea, in particular, that Islam could provide
    certain organizing and socializing guidelines to a community have been received
    with great suspicion by both regional and international political actors. Especially
    in the aftermath of the 9/11 attacks, Muslim communities in Europe and the United
    States have been subjected to policing and surveillance in the public as well
    legal spheres. Cavanaugh refers to several court cases, claiming that the lawmakers
    actively partake in limiting the public presence of Islam on the grounds that
    Islamic expressions, such as the veil, may violate citizenship equality. In the
    case of Fereshta Luft, an Afghan-born German Muslim schoolteacher, the court decided
    that she could not enter the classroom with her headscarf, claiming that the hijab
    conveyed a “signaling effect” that could not be accommodated within the framework
    of state neutrality. Rather than a sartorial choice, the veil was treated as a
    divisive marker in the public sphere.


    As a way of overcoming the faith-versus-reason binary, Cavanaugh puts together
    the two readings of human rights discourse: the first as a universalizing discourse
    that erases differences under the weight of equality, and the second as that requires
    culture and norms to conform and help understand international norms and principles.
    From these readings, it follows that differences must be promoted within the project
    or exist parallel to it. Cavanaugh’s main contention is that the law is neither
    fixed nor stable and that Islam’s presence in the public sphere remains a test
    for rethinking the exclusionary zones that are embedded in the human rights project.
    The abstract categories of the heemonic paradigm of secularism have mostly served
    to institute a monist perspective that aims to relegate religion to the private
    sphere. As an alternative to the regime of secularism, Cavanaugh proposes a pluralistic
    framework that would facilitate the co-existence of different belief and legal
    systems. Exposing the dichotomous positioning of faith and reason as a tension
    between cultural pluralism and'
  merge: -1
