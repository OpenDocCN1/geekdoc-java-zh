    Narrowing national identity


    “National identity” refers to the way a single community views itself and is based
    on five main features: a historic territory, or homeland; common myths and historical
    memories; a common, mass public culture; common legal rights and duties for all
    members; and a common economy with territorial mobility for members.³⁶


    Qatar, like Kuwait, recognizes the right of individuals to become Qatari citizens
    if their fathers resided in the country before 1930.³⁷ However, being a citizen
    of the state does not necessarily mean that an individual satisfies the features
    of official Qatari national identity, as a citizen is enjoys the political, social,
    and economic rights outlined in the constitution and laws of the state, while
    a “national” is not only a citizen but an individual that possesses the dominant
    characteristics of the “nation.” Thus a Qatari of Persian or Abd origin, or a
    naturalized citizen, may enjoy equal political, social, and economic rights but
    may not necessarily be perceived as a representative of Qatari national identity.


    This fits with Anthony D. Smith’s claim that national identity differs from any
    concept of the state.³⁸ between a “citizen” and a “national.” Based on a citizen’s
    satisfaction of the five features of Qatari national identity, or her national
    identity is evaluated, and thus he or she is perceived as belonging to a specific
    social class, and either granted or restricted access to influential political
    positions and lucrative economic contracts. However, this is not to say that Persians,
    Hualah, Abid have never been represented in important political positions. In
