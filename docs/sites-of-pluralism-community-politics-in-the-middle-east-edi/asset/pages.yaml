    # ### Islamized Armenians


    The Hemshin people, particularly the Hopa Hemsin, are relatively easy to describe
    since they are a specific ethno-regional group. The situation for other Turkish
    Muslims of Armenian descent, however, is far more complicated. This begins with
    the general terms in use and what they describe. In Turkey, the term “hidden”
    Armenians (gizli Ermeniler) is common, while in Armenian-language publications
    the name varies from “hidden” or “secret” Armenians (t’ak hayer) to crypto-Armenians
    (tsptyal hayer) to Islamized Armenians (islamats vats hayer). English-language
    publications reflect these various uses, although “hidden” and “Islamized” Armenians
    are among the most common. In Kurdish-speaking regions of Turkey, Muslims of Armenian
    descent are known as *Mislimeni* and *Müslāman* in order to distinguish them from
    other Muslims while implying that they are in a state of incomplete Islamization.⁴⁴
    The nomenclature is further complicated what the terms actually describe. For
    example, Khanlari groups (specifically Pontian Muslims of Armenian origin) under
    the category of “Islamized Armenians” because they consider themselves Muslim,
    while defining the descendants of Armenians who had been forcibly converted to
    Islam between 1896 and 1923, and retained memory of their origins, as the “Hidden
    Armenians.”⁵⁵ However, the boundaries placed on these terms are inevitably contested.
    Perhaps the most insightful studies so far have been conducted by Ceren Özgül,
    who noted that the people in question reject the various terms applied to them—hidden
    Armenians, Muslim Armenians, crypto-Armenians, and Dönme-Armenians—as inaccurate
    if not offensive, which is why she opted for “descendants of forcibly Islamized
    Armenians.”⁵⁶


