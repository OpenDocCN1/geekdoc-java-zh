    Saouli claims that institutions “evolve out of interactions among social powers”
    and are “devised by one or more social powers to consolidate power, regulate power
    relations, or install constraints against the monopoly of power.”20 Furthermore,
    “a social power could be a leader, tribe, political party, clan, ruling family,
    monarchy, sectarian elite, or an economic social force. These forms of social
    power are represented by a minority elite, which seeks to articulate the interests
    of a larger group.”21 He adds that social powers are the result of the existing
    material and cultural structures, and economic foundations of the state, as well
    as human behavior that follows specific trends and patterns.22 As part of the
    interactions between different structures, institutions tend to “shape ... political
    behavior by setting certain standards and norms on social actors.”23 Accordingly,
    “shape the political struggle” that results from politicization and attempts to
    revise and reproduce the cultural and material structures.24


