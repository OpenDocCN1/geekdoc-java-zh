    }\n```\n\n在 OOP 实现中，我们使用 Student 类来表示“学生”这一通用概念。该类有两个由变量表示的属性：name 和 grade。它有一个构造函数，构造函数是一种特殊的方法，在创建类的实例时使用。我们将学习更多关于构造函数以及\
