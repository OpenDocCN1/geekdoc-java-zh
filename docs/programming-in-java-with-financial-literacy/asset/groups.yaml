    # 6.2 Checked versus Unchecked Exceptions


    ![](img/d4f7b51b492858346b4c26816c21e311_172_0.png)


    Fig. 6.1: Exception hierarchy.


    Errors and exceptions are descendants of Throwable, which has two direct subclasses:
    Error and Exception. An error is usually catastrophic and not recoverable through
    exception handling. Two example types of error are shown in the figure.


    All exceptions can be handled using try...catch...finally are are of the type
    of Exception or any of its subsets.

    Java distinguishes between checked exceptions and unchecked exceptions:


    +   - Checked Exception — Exception whose exact type is Throwable, Exception,
    or any type that inherits from Exception but not from RuntimeException.

    - Unchecked Exception — Exception whose exact type is Error, RuntimeException,
    or any type that inherits from Error or RuntimeException.


    If an exception is of the checked type, the compiler requires that the exception
    must be caught-or-declare requirement shortly. If an exception is of the unchecked
    type, the compiler does not care if the exception is handled.


