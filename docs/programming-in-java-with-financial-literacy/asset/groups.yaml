    \ + Arrays.toString(arg));\n}\n```\n"
  mdcn: "\n\n## 4.4 变量：作用域、值传递与引用传递\n\n你可能已经注意到变量可以在多个地方引入：作为类的成员、作为方法的参数、或者在方法体内部。根据引入位置的不同，它们生效的范围也不同——这被称为变量的**作用域（scope）**。作为标识符，变量可以用来引用原始类型值和对象。当变量作为方法的参数时，这两种类型之间存在区别。在本节中，我们将介绍作用域以及变量如何作为方法的参数使用。\n\
    \n### 4.4.1 变量作用域\n\n作为标识符，名称在其作用域内必须是唯一的。声明为类成员（即属性或字段）的变量具有**全局作用域**。这些变量可以从类的任何地方被访问。作为参数引入以及在方法内部代码块引入的变量具有**局部作用域**。在局部作用域内，允许变量拥有与作用域相同的名称，在这种情况下，我们称全局变量被局部变量**隐藏（shadowed）**了。\n\
    \n让我们看列表 4.4 中的示例。构造函数引入三个局部变量：`name`、`major` 和 `grade`。这些名称与属性的名称相同。它们隐藏了属性变量。但\
    \ Java 如何确定你指的是哪一个变量呢？\n\n让我们看 `Student` 类构造函数中的以下语句：\n\n```\nthis.name = name;\n\
    ```\n\n我们知道赋值是从右到左求值的。因此，Java 需要通过搜索不同的作用域来确定 `name` 变量。Java 总是从当前作用域（变量出现的作用域）开始搜索。如果在当前作用域内找到了变量声明，它将使用该变量；否则，它将继续在下一个作用域搜索。搜索一直持续找到声明为止。在这种情况下，Java\
    \ 发现变量是在构造函数参数中定义的。因此，该变量指的是作为构造函数参数传入的变量。\n\n我们的目的是将局部作用域中的变量赋值给全局作用域中的属性变量，但属性被局部变量隐藏了。在这种情况下，Java\
    \ 中的 `this` 关键字允许我们从任何局部作用域引用被隐藏的全局变量。该关键字代表类的当前实例。要访问类变量，使用类名作为前缀（例如列表 4.4 中的第\
    \ 15 行：`Student.school=school`）；\n\n如果我们将代码改为：\n\n```\nname = name;\n```\n\n那么\
    \ `name` 属性将不受影响。这是因为赋值运算符的两个操作数指向同一个变量：即作为构造函数参数引入的局部变量。\n\n在构造函数中，我们将参数名称更改为不同的名称，例如\
    \ `newName`，那么在构造函数体内，我们可以不使用 `this` 关键字将其赋值给属性变量：\n\n```\nname = newName;\n```\n\
    \n这是可以的，因为在局部作用域中未找到变量名后，Java 将继续在外层作用域（即全局作用域）中搜索，并在那里找到了该变量。\n\n只有全局变量可以被隐藏。在嵌套作用域中，变量在其作用域内必须是唯一的。图\
    \ 4.3 中的示例说明了这一语法规则。\n\n```java\nprivate void test(int k) {\n    for (int i=0;\
    \ i<3; i++) {\n        int i;\n        int i;\n    }\n}\n```\n\n```java\nprivate\
    \ void test(int k) {\n    for (int i=0; i<3; i++) {\n        int i;\n        int\
    \ i;\n    }\n}\n```\n\n| k | k |\n|---|---|\n| i (for-loop) | i (for-loop) |\n\
    | i | i |\n| | |\n\n图 4.3：不同级别局部作用域中的变量必须是唯一的。\n\n在图左侧，方法引入了 `k` 作为局部变量。它在整个方法范围内有效。在方法内部任何地方都没有再次声明\
    \ `k`。在方法内部引入具有与全局作用域相同的变量是允许的。在 `for` 循环引入的变量具有它们的作用域。\n\n在图右侧，我们去除了大括号内的 `i`\
    \ 声明。现在变量的作用域是从声明处到方法结束。当我们使用大括号引入变量时，会发生错误，因为在局部作用域内我们尝试再次声明 `i`。\n\n### 4.4.2\
    \ 方法参数：值传递与引用传递\n\n在某些语言中，你可以将参数作为输入或输出。Java 允许从方法有一个显式的输出（返回值）。这似乎是有局限性的，但并非如此。这取决于编程的风格。例如，假设你需要一个方法返回一组值的最小值和最大值，但你受限于只能返回一个值；该如何返回两者呢？\n\
    \n| 练习 |\n| 假设在图 4.3 右侧示例中将最后两个 `i` 的声明更改为：<br> `int i; int i;` <br> 这在语法上正确吗？\
    \ |\n\n在这种情况下，传递给方法的是值的副本。因此，当方法将值翻倍时，值在方法内部翻倍了，但在方法外部的数组中并没有变。\n\n```java\nimport\
    \ java.util.Arrays;\npublic class PassValueReference {\n    public static void\
    \ main(String[] args) {\n        double[] tuples = {10, 20, 35};\n        System.out.println(\"\
    Values in tuples: \" + Arrays.toString(tuples));\n        doubling(tuples);\n\
    \        System.out.println(\"Values in tuples: \" + Arrays.toString(tuples));\n\
    \    }\n\n    public static void doubling(double arg) {\n        // 这是值传递\n  \
    \      arg *= 2;\n        System.out.println(\"arg within doubling: \" + arg);\n\
    \    }\n}\n```\n\n```java\npublic static void doubling(double[] arg) {\n    for\
    \ (int i=0; i<arg.length; i++) {\n        arg[i] *= 2;\n    }\n    System.out.println(\"\
    arg within doubling: \" + Arrays.toString(arg));\n}\n```\n\n"
