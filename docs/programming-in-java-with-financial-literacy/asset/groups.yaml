    ```

    byte i = 127; // 127 的类型是 byte

    short j = -3268; // -3268 的类型是 short

    ```


    如果你需要创建一个类型为 `long` 的整数字面量，你需要在字面量的末尾添加字母 L（或小写的 l），例如：


    ```java

    long small = 127L; // L 是可选的，int 可以根据需要转换为 long

    long large = 2147483648L; // 因为值超过了 int 的范围，所以需要 L

    ```


    浮点字面量的类型是 `double`。例如，1.0 和 78.5 是 double 字面量。当你只有一个点和小数点时，该字面量（例如 `1.`）的类型是 `double`。如果你想让数值字面量变为
    `double`，你需要在字面量的末尾添加字母 D（或 d）。例如，30d、1d 和 12.5d 都是 double 字面量。由于任何带有小数点的数值字面量都是
    `double` 类型，如果你需要将其变为 `float`，则必须在小数值的末尾添加字母 F（或 f）。例如，2.0F 和 2.5f 的类型是 `float`。


    ## 2.2 引用数据类型


    引用数据类型也被称为聚合数据类型。引用数据类型的变量引用一个对象。引用类型可以使用 Java `class`、Java `interface` 或数组来定义。每当你在
    Java 中创建一个类时，该类就是一种数据类型。例如，你已经在第 1 章中看到了两个类：HelloWorld 和 Random。它们是两个引用数据类型；因此，你可以声明这些类型的变量，例如：


    ```java

    HelloWorld var; // 声明类型为 HelloWorld 的变量 var

    Random var2; // 声明类型为 Random 的变量 var2

    ```


    接口是在第 5 章将讨论的特殊类。我们将在第 3 章查看数组。


    引用数据类型的数量本质上是无限的，可以创建任意数量的类、接口和数组。


    Java API 为每个原始数据类型提供了引用数据类型。这些类也被称为包装类（wrapper classes），位于 `java.lang` 包中，并使用有用的方法，例如在原始值和
    String 表示形式之间进行转换。


    请表表 2.2 每个原始数据类型对应的包装类。例如，Integer 类可以用于创建一个封装了 int 值的对象；该类的 `intValue` 方法返回该 `int`
    值。


    表 2.2：原始数据类型的包装类

    | 原始类型 | 包装类 | 原始类型 | 包装类 |

    | --- | --- | --- | --- |

    | byte | Byte | float | Float |

    | short | Short | double | Double |

    | int | Integer | boolean | Boolean |

    | long | Long | char | Character |


    ## 2.3 运算符


    运算符允许你对变量、字面量和表达式执行操作。运算符作用的对象被称为操作数。Java 具有作用于一个操作数的一元运算符、作用于两个操作数的二元运算符以及作用于三个操作数的三元运算符。我们将根据其功能查看这些运算符：算术运算、逻辑运算和位运算。


    ### 2.3.1 算术运算符


