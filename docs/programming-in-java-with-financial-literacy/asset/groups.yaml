    \ diagram.svg.png)\n*图 4.1：Student 的类图*\n\nUML 中的类有三个部分：名称、属性和方法。属性也称为成员（members）。表示类的语法为：\n\
    \n```\n<visibility><member>\n```\n\n符号用于指示成员的可见性：\n- + public：随处可见\n- private：仅在类内部可见\n\
    - protected：在类及其子类内部可见\n\n在 Student 类中，如果我们将属性更改为 public，它们就可以从任何地方访问。如果将它们更改为\
    \ private，则它们只能从类内部访问。\n\n## 4 类与对象\n\n方法有两种类型：构造函数和非构造函数。这两种方法都有一个签名（signature），签名由方法名、参数数量和参数顺序决定。注意，方法的返回类型不是签名的一部分。\n\
    \n构造函数是一种特殊的方法，它的名称与类名相同，且没有返回类型（void）。非构造方法必须有返回类型。构造函数是在类的实例上被调用的。在大多数情况下，构造函数用于初始化类的属性。当类不包含构造函数时，Java\
    \ 编译器会自动提供默认的无参构造函数；如果类包含了构造函数，则不再提供该构造函数。\n\n表示构造函数的语法为：\n\n```\n<constructor><member>\n\
