    \n## 概念与动机\n\n### 5.1.1 继承\n\n在现实世界或概念世界中，某些事物根据共同点和区别联系在一起。例如，我们有一个“学生”的概念来指代所有类型的学生，如访问学生和就读学位的大学生。所有学生的共同特征是他们都有名字。大学生是“学生”的一种更具体的类型。大学生的不同特征是他们还有一个专业。由于大学生也是学生，因此他们也有名字。我们把这种关系建模为“是一种”关系；更具体的概念（如大学生）继承了更通用的概念（如学生）。这种关系也称为继承。\n\
