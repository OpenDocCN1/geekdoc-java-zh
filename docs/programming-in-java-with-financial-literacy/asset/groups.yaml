    \ `break` 或 `continue`。你可以为外部循环标记标记并在语句中使用该标签。例如：\n\n```\nmy1:\n  for (int i=1;\
    \ i<=6; i++) {\n    for (int j=1; j<=i; j++) {\n      if (j==3) break my1;\n \
    \     System.out.printf(\"%d \", j);\n    }\n    System.out.println(\"\");\n \
    \ }\n```\n\n当 `j` 达到 3 时，程序终止标记为 `my1` 的循环。这发生在外部循环的第三次迭代，内部循环的第二次之后。因此输出是：如果我们将\
    \ `break` 替换为 `continue` 会发生什么？\n当 `i` 为 1 或 2 时，`j` 无法达到 3。因此前两行的输出与之前相同。\n当\
    \ `i` 为 3 时，在内部循环的前两次迭代后，`j` 达到 3。第 3 行的 `continue my1` 语句将跳过内部循环和标记为 my1 的外部循环——因此，创建新行的第\
    \ 6 行被跳过了。外部循环继续下一次迭代。从现在开始的输出都将在同一行：输出的第三行。\n\n因此，使用标签 `continue` 语句的程序输出为：\n\
    \n1\n2 4\n3 6 4 8 5 10 6 12\n\n"
