  - "[PAGE 112]\n\n# 4.1 A Introduction to Classes and Objects\n\n```\nSystem.out.printf(\"\
    %25s%5.2f\\n\", n10, g10);\nSystem.out.printf(\"%25s%5.2f\\n\", \"Average Grade\"\
    , avgGrade);\n```\n\nWell, that is a lot of coding. It also hard codes the numbers\
    \ of grades when computing the average. When the number of students changes, there\
    \ is more than one place that needs to be updated. More importantly, the correspondence\
    \ between student and grade is not logically enforced by the program, thus errors\
    \ can occur (e.g., when g10 is missed as g1);\n\nYou may say, we can drastically\
    \ reduce the amount of coding if we use arrays.\nHere is a version that uses arrays:\n\
    \n```\n// class and main method declarations are omitted\n// suppose we have 10\
    \ students\nString[] names={\"Alice Barton\", ..., \"Yvonne Zack\"};\nndouble[]\
    \ grades={4.0, ..., 3.0};\ndouble totalGrade=0;\nfor (int i=0; i<names.length;\
    \ i++) {\n    System.out.printf(\"%25s%5.2f\\n\", names[i], grades[i]);\n    totalGrade+=grades[i];\n\
    }\nSystem.out.printf(\"%25s%5.2f\\n\", \"Average Grade\", totalGrade/grades.length);\n\
