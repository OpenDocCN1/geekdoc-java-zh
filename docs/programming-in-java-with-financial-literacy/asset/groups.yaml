  mdcn: "\n\n## 5.4 接口\n\n接口是另一种增强定义继承层次结构和实现多态能力的机制。接口只包含声明；接口中不允许方法的方法的实现。声明仅用于变量和方法。变量通常用于定义常量；它们是隐式的公有的、静态的且最终的（这意味着它们在实现接口的类中不能被更改）。接口中声明的所有方法都是抽象的；使用\
    \ `abstract` 关键字进行声明是可选的。\n\n接口使用 `interface` 关键字声明：\n\n```java\n[public] interface\
    \ InterfaceName\n```\n\n注意，我们使用方括号来表示可选部分。一个类可以实现一个或多个接口；它使用 `implements` 关键字，并且要实现的接口之间用逗号分隔：\n\
    \n```java\n[public] [abstract] class ClassName [extends Class] implements Interface1,\
    \ Interface2, ...\n```\n\n如所示，一个类可以在实现一个或多个接口的同时，作为另一个类的子类。当一个类实现一个接口时，它在类和接口之间建立了一种关系。这种关系在\
    \ UML 中用指向接口的空心箭头的虚线表示。\n\n接口可以扩展其他接口。记住，一个类只能扩展另一个类。事实上，一个接口可以扩展多个接口：\n\n```java\n\
    [public] interface extends AnotherInterface, AnotherInterface, ...\n```\n\n现在让我们用一个示例来说说明如何使用接口来增加可扩展性和代码复用。\n\
    \n接上一个示例，假设应用程序需要获取不仅给学生，还要给供应商、教职员工和员工的总支付金额。我们希望用尽可能通用的解决方案处理这一需求。我们的解决方案是引入\
    \ `Payable` 接口，将抽象方法 `payableAmount` 移动到接口中，让 `Student` 其他类实现该接口。为了演示，包含了一个 `Vendor`\
    \ 类。为了演示类可以同时扩展父类并实现一个或多个接口，我们让 `Graduate` 类实现一个包含抽象方法 `getOfficeHours` 的 `Instructor`\
    \ 接口。\n\n修订后的设计的 UML 图如图 5.4 所示。\n\n注意，`Student` 类实现了 `Payable` 接口，但没有对继承的抽象方法\
    \ `payableAmount` 包含任何实现，它必须是一个抽象类，如类名使用的*斜体字体样式*所示。\n\n通过这种设计，`Student` 类不需要任何更改：即指示它实现了\
    \ `Payable` 接口并注释掉 `payableAmount` 方法声明（它已经在接口中声明了）。为了节省空间，我们在这里不显示修订后的源代码。\n\n\
    两个接口的源代码如列表 5.8 和 5.9 所示。\n\n```java\npublic interface Payable {\n    public abstract\
    \ double payableAmount();\n    // 上面的关键字是可选的\n}\n\n```\n\n```java\npublic interface\
    \ Instructor {\n    public String getofficeHours();\n}\n```\n\n在 `Payable` 接口中，我们显式指示该方法是抽象的。这是可选的。因此在\
    \ `Instructor` 接口中，我们选择省略这个关键字。\n\n`Student` 和 `Vendor` 类都实现了 `Payable` 接口。如之前所述，`Student`\
    \ 类是抽象的，与之前的实现相比进行了细小的更改。`Vendor` 类是具类的；它的源代码如列表 5.10 所示。\n\n```java\npublic class\
    \ Vendor implements Payable {\n    private String name;\n    private double invoiceAmount;\n\
    \    public Vendor(String name, double invoiceAmount) {\n        this.name = name;\n\
    \        this.invoiceAmount = invoiceAmount;\n    }\n    public String getName()\
    \ {\n        return name;\n    }\n    public void setName(String name) {\n   \
    \     this.name = name;\n    }\n    public void setInvoiceAmount(double invoiceAmount)\
    \ {\n        this.invoiceAmount = invoiceAmount;\n    }\n    public double payableAmount()\
    \ {\n        return invoiceAmount;\n    }\n    public String toString() {\n  \
    \      return String.format(\"Vendor: %s\\t%8.2f\", name, invoiceAmount);\n  \
    \  }\n}\n```\n\n> 注意，继承的 `payableAmount` 方法在这里没有实现。它只是返回实例的 `invoiceAmount` 属性。`toString`\
    \ 方法同样返回字符串形式的名称和 invoiceAmount。\n\n如所述，我们让 `Graduate` 类实现 `Instructor` 接口。为了演示，`getOfficeHours`\
    \ 方法在这里被实现，它始终返回 \"24X7\"。修订后的 `Graduate` 类代码如列表 5.11 所示。\n\n```java\npublic class\
    \ Graduate extends Student implements Instructor {\n    private String degreeProgram;\n\
    \    private double monthlySalary;\n    public Graduate(String name, String degreeProgram,\
    \ double monthlySalary) {\n        super(name);\n        this.degreeProgram =\
    \ degreeProgram;\n        this.monthlySalary = monthlySalary;\n    }\n    // 省略了\
    \ getters 和 setters\n    public String toString() {\n        return String.format(\"\
    Degree: %s\\t%8.2f\", super.toString(), degreeProgram, payableAmount());\n   \
    \ }\n}\n```\n\n```java\npublic double payableAmount() {\n    return monthlySalary;\n\
    }\n\npublic String getOfficeHours() {\n    return \"24X7\";\n}\n```\n\n注意，这个修订版本与之前的实现（列表\
    \ 5.6）之间的唯一区别在于两个地方：1) 第 1 行添加 `implements Instructor`；2) 在末尾添加了 `getOfficeHours`\
    \ 方法。我们还在之前测试程序的修改版本上创建了一个测试程序。其源代码如列表 5.2 所示。\n\n```java\npublic class TestInterface\
    \ {\n    public static void main(String[] args) {\n        Payable[] payable =\
    \ {\n            new Student(\"John Smith\", \"CS\", 563.75),\n            new\
    \ Student(\"Kate Tabor\", \"MS\", 1500.00),\n            new Vendor(\"Food Services,\
    \ Inc.\", 12000.00)\n        };\n        double total = 0;\n        for (Payable\
    \ s : payable) {\n            total += s.payableAmount();\n            if (s instanceof\
    \ Instructor) {\n                System.out.println(\"Office Hours: \" + ((Instructor)s).getOfficeHours());\n\
    \            }\n        }\n        System.out.printf(\"Total: %t%.2f%n\", total);\n\
    \    }\n}\n```\n\n图 5.8 带有类和接口的 UML 类图。\n\n"
