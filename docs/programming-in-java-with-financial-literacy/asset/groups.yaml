    # 3 Control Structures and Arrays


    +   - The duration that you keep the money in the account.

    - The interest rate at which the bank pays you.

    - Whether the interest is simple or compound, and if compound, how often the interest
    is compounded.


    **Simple Interest** Interest earned in previous periods does not earn interest
    in future periods. Thus for the current period is based on the initial principal
    only.


    **Compound Interest** Interest earned in previous periods is considered as principal
    and earns interest in future periods. Thus for the current period is based on
    the initial principal plus all interest earned so far. A compounding-operation
    turns into principal. This operation is usually performed periodically, monthly,
    or quarterly. The length of time between compounding operations is called compounding
    period, $t_c$. For example, when interest is compounded, the compounding period
    is a month. Interest can also be compounded continuously.


    Most banks offer compound interest in the U.S. More generally, when you invest
    through other vehicles, the investment (hopefully) grows year after year at certain
    rates of return, generating a compounding effect.


    The speed at which money "grows" is called interest rate. In the general investment
    context, it is also called the rate of return. There are two metrics that measure
    how money grows:


    +   - Nominal rate ($r$). It is the rate at which money grows without considering
    period. It is expressed as a percentage per period. For example, annual percentage
    rate (APR) is a nominal interest rate per year.

    - Effective interest rate ($i$). It is the rate at which money grows considering
    compounding. It is expressed as a percentage per period. For example, Annual percentage
    yield (APY) is an effective interest rate per year. It is also called "effective
    annual rate".


    Appingly, with simple interest, nominal interest rate and effective interest rate
    are the same for the same time period.


    With a nominal rate of a given time period, $r_1$, it is straightforward to find
    the equivalent nominal rate for any time period, $r_2$. Let $m$ be the number
    of $t_2$ in $t_1$, the formula is:


    ```

    $r_2 = \frac{r_1}{m} \quad (3.1)$

    ```


    For example, we can obtain nominal monthly rate from APR. In this case, $r_1 =
    APR, t_1 = 1$ year. For monthly rate, $t_2 = 1$ month. There are 12 months per
    year, thus $m = 12$. Substituting variables in Equation 3.1 with these values,
    we have:'
