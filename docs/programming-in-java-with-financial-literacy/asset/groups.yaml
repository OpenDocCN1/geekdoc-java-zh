    \ be 1.50%. Does your program output the correct interest rate?\n- 3. Now, come\
    \ out the break statement in the block of case 3—Line 21 in Listing 3.4. Save\
    \ the file, and re-run the test with 36000. What interest rate do you output?\n\
    \nThe label within of a switch statement is used to identify an entry point of\
    \ the flow; once the flow enters, it continues until it encounters a break statement\
    \ or the switch statement. If you want to include a break statement at the end\
    \ of each case-labeled code block, execution will fall through all statements\
    \ from that label, regardless of the remaining labels. Thus, when the break statement\
    \ (Line 21) is encountered, the flow of execution will continue until Line 24.\
    \ In this case, interestRate is updated to 0.02 (Line 23), so the program will\
    \ output 2.000% as the interest rate for any balance between 30000 (inclusive)\
    \ and 50000 (exclusive).\n\nThe labels are searched sequentially until a matching\
    \ one is found. If none is found, the flow goes to the block labeled default;\
    \ if default is not present, the switch statement finishes execution. In our example\
    \ program, the default block will make interest rate to 2.5% for any balance $60,000.\n\
    \nAny program using the switch statement can be implemented by chaining if...else,\
    \ but not the other around. When you can implement each statement, you need to\
    \ decide one to use. Here are a few guidelines that may be useful to you:\n\n\
    - In general, a switch statement with many branches is more readable than chaining\
    \ if...else statements\n- When the cases are concerned with ranges and cannot\
    \ be converted to a limited number of data elements, it may be better use switch\n\
    \n## 3.3 Repetition Structure\n\nRemember, switch works with a limited set of\
    \ data types. if...else does not have the limitation—it works with any boolean\
    \ expressions\n\nExercise\n1. Try the program in Listing 3.4 using negative input.\
    \ What interest rates does it output?\n2. Implement the program in Listing 3.4\
    \ using if...else.\n3. Try your program with both positive and negative inputs.\
    \ How do the outputs compare with those produced by the program in 3.4?\n\nMultiple\
    \ case labels can be used to label the same block of code. The flow will go into\
    \ the block when one of the labels matches. For example, if the bank offers another\
    \ tier for balances between $60,000 and $80,000, the interest rate is 2.625%;\
    \ then you can modify the code starting Line 28 to the following:\n\n```\ncase\
    \ 7:\n    interestRate=0.02625;\n    break;\ndefault:\n    interestRate=0.0275;\n\
    \    break;\n```\n\nMore examples using switch using types such as String and\
    \ Enum can be found at http://docs.oracle.com/javase/tutorial/nutsandbolts/switch.\n\
    \n## 3.3 Repetition Structure\n\nAgain, we will use examples to learn how to implement\
    \ programs that require looping or are easier to write with looping. The examples\
    \ compute account balances for bank accounts that pay interest. If you are not\
    \ familiar with the concepts of simple interest and compound interest, please\
    \ read the background information in the information box below.\n\n# Simple Interest\
    \ and Compound Interest\n\nWhen you deposit money in your savings account, you\
    \ are essentially lending money to the bank. In return, the bank pays you interest—additional\
    \ money that is automatically deposited to your account. In other words, your\
    \ initial deposit earns you money. Let us consider a simple case where you open\
    \ an account with an initial deposit and you do not put additional money into\
    \ it, nor do you take money out. The amount of interest you get depends on a number\
    \ of factors:\n\n- Your initial deposit, also called the principal.\n"
  mdcn: "\n\n## 3.2 选择结构\n\n### 嵌套 if 和 if...else\n\n如前面提到的，实现一个程序通常有多种方法。可以使用某些标准来选择最佳实现方式。例如，效率和可读性是两个常用的标准。效率可以从执行时间和内存空间来评估——这个主题超出了本书的涉及范围；《算法》（Algorithms）一书中深入探讨了这一主题。可读性同样重要，因为易于理解的代码易于维护。\n\
    \n除了链式结构，Java 语言还支持嵌套。链式比嵌套更容易理解。将列表 3.3 中的代码与两种使用嵌套的替代方案进行比较。你更喜欢哪种实现方式？\n\n\
    ```\n// alternative 1               // alternative 2\nif (balance<20000) {   interestRate=0.01;\n\
    else                          if (balance>=20000) {\n  interestRate=0.0135;\n\
    \  else                          if (balance<50000) {\nif (balance>=50000) {\n\
    \    interestRate=0.025;\n    interestRate=0.025;\n  }\n  }\n}\n```\n\n现在，假设利率有更细粒度的层级，截断值分别为\
    \ $10,000、$20,000...到 $50,000。当链用许多 ...else 时，会非常繁琐且难以追踪。Java 提供了一种更易使用和理解的替代方案——接下来我们将查看这种替代方案。\n\
    \n### 3.2.2 switch 语句\n\n让我们看看列表 3.4 中的程序，它使用 switch 语句来实现上述需要多个分支的场景。\n\n```\n\
    Listing 3.4 计算利率\n4 double interestRate;\n5 Scanner input = new Scanner(System.in);\n\
    6 System.out.println(\"Please input your balance: \");\n7 double balance = input.nextDouble();\n\
    8 int balanceLevel = (int)balance / 10000;\n9 switch (balanceLevel) {\n10 case\
    \ 0:\n11   interestRate=0.01;\n12   break;\n```\n\n## 3 控制结构与数组\n\n```\ncase 1:\n\
    \    interestRate=0.0102;\n    break;\ncase 2:\n    interestRate=0.01325;\n  \
    \  break;\ncase 3:\n    interestRate=0.015;\n    break;\ncase 4:\n    interestRate=0.022;\n\
