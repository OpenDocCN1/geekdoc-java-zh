    \n练习\n实现列表 6.3 中的程序，并尝试不同类型的输入。\n\n# 6.2 检出异常与未检出异常\n\n你已经在示例中看到有不同类型的异常，每种类型都实现为一种类。例如，`ArithmeticException`、`InputMismatchException`\
    \ 和 `ArrayIndexOutOfBounds` 是定义并实现这些类型异常的类。这些类在继承层次结构中相关。该层次结构的通用结构如图 6.1 所示。\n\
    \n![](img/d4f7b51b492858346b4c26816c21e311_172_0.png)\n\n图 6.1：异常层次结构。\n\n错误（Errors）和异常（exceptions）是\
    \ `Throwable` 的后代，它有两个直接子类：`Error` 和 `Exception`。错误通常是灾难性的，无法通过异常处理来恢复。图中展示了两种示例类型的错误。\n\
    \n所有可以使用 `try...catch...finally` 处理的异常都是 `Exception` 类型或其任何子类型。\nJava 区分了检出异常（checked\
    \ exceptions）和未检出异常（unchecked exceptions）：\n\n- 检出异常（Checked Exception）——其确切类型为\
    \ `Throwable`、`Exception` 或任何继承自 `Exception` 但未继承自 `RuntimeException` 的类型的异常。\n\
    - 未检出异常（Unchecked Exception）——其确切类型为 `Error`、`RuntimeException` 或任何继承自 `Error`\
    \ 或 `RuntimeException` 的异常。\n\n如果异常是检出类型，编译器要求该异常必须很快满足“捕获或声明”（caught-or-declare）的要求。如果异常是未检出类型，编译器则不在乎异常是否被处理。\n\
    \n### 练习\n\n在图 6.1 所示的类中，哪些是检出异常，哪些是未检出异常？\n\n根据定义，我们知道 `SQLException`、`IOException`\
    \ 和 `FileNotFoundException` 是检出异常；图 6.1 底部附近的 `Runtime` 的四个子类以及 `Error` 的所有子类都是未检出异常。\n\
    \n回列表 6.1 中的程序没有异常处理代码，但尽管它可能抛出异常，仍然可以通过编译。现在我们知道这些是未检出异常。图 6.1 显示 `ArithmeticException`\
    \ 是未检出异常。从 Java API 文档可知 `InputMismatchException` 是 `RuntimeException` 的间接子类。因此它也是一个未检出异常。\n\
    \n# 捕获或声明检出异常\n\n### 6.2.1 捕获或声明检出异常\n\n对于任何抛出检出异常的代码，这些异常必须被捕获（使用 `try ...catch`），或者封装该代码的方法必须声明抛出这些检出异常（使用\
    \ `throws`）。否则，程序将无法编译。让我们用示例来说明这一要求。\n\n我们使用了 `Scanner` 构造函数使用输入控制台作为输入流创建对象。此构造函数不会抛出异常。该构造函数还有一个重载版本，可以将文件作为输入流。此版本可能会抛出\
    \ `FileNotFoundException`，这是一个检出异常。我们将使用带有此构造函数的示例来说明列表 6.4 中的捕获或声明要求。\n\n\n\n\
    ```java\npackage edu.mrzhu.exception;\nimport java.io.File;\nimport java.io.FileNotFoundException;\n\
    import java.util.Scanner;\npublic class ReadText {\n    public static void main(String[]\
    \ args) {\n        int count = 0;\n        try {\n            String file = System.getProperty(\"\
    user.home\")\n                + System.getProperty(\"file.separator\")\n     \
    \           + \"testfile.txt\";\n            Scanner sc = new Scanner(new File(file));\n\
    \            while (sc.hasNext()) {\n                count++;\n              \
    \  sc.next();\n            }\n            System.out.println(count);\n       \
    \ } catch (FileNotFoundException e) {\n            System.out.println(\"Error:\
    \ \"+e.LocalizedMessage());\n        }\n    }\n}\n```\n\n当程序按列表 6.4 所示实现时（异常代码被注释掉），编译器将报告第\
    \ 12 行存在关于未处理异常的错误。有两种替代方案可以使代码通过编译。方案 1 是取消行的注释以便捕获异常。方案 2 是声明 `main` 方法抛出 `FileNotFoundException`。列表\
    \ 6.5 显示了第二种替代方案。\n\n```java\npackage edu.mrzhu.exception;\nimport java.io.File;\n\
    import java.io.FileNotFoundException;\nimport java.util.Scanner;\n\npublic class\
    \ Read2 {\n    public static void main(String[] args) throws FileNotFoundException\
    \ {\n        int count = 0;\n        String file = System.getProperty(\"user.home\"\
    )\n            + System.getProperty(\"file.separator\")\n            + \"textfile.txt\"\
    ;\n\n        Scanner sc = new Scanner(new File(file));\n        while (sc.hasNext())\
    \ {\n            count++;\n            sc.next();\n        }\n        System.out.println(count);\n\
    \    }\n}\n```\n\n注意第 6 行的声明。为了使类型通过编译，声明的异常类型可以是该类型的任何子类型（例如 `IOException`）。然而，具体化说明异常的类型会更好。如果方法抛出多种类型的异常，可以声明多个类型（用逗号隔开）。\n\
    \n# 6.3 抛出异常\n\n除了处理异常，你还可以在程序中抛出异常。有时需要通知方法的调用者发生了问题，并提供有关该问题的信息。你可以抛出检出异常或未检出异常。如果问题必须由调用组件处理，请考虑抛出检出异常。你可以通过派生\
    \ API 中异常相关的类来定义自己的异常。\n\n让我们用一个示例来说明这个想法。回想第 4 章，列表 4.2（第 107 页）中 `Student` 类的\
    \ `grade` 属性应该是非负的。强制这一要求的一种方法是，当调用应用程序尝试给分赋一个负值时，抛出一个异常。我们可以针对这个问题定义一个特定的异常。有两种选择：我们可以通过派生\
    \ `Exception` 类使其成为检出异常，或者通过派生 `RuntimeException` 类使其成为未检出异常。让我们采用第一种方法，列表 6.6\n\
    \n```java\npackage edu.mzhu.demo.exception;\npublic class NegativeGradeException\
    \ extends Exception {\n    public String getMessage() {\n        return \"grade\
    \ < 0, but it must be non-negative\";\n    }\n}\n```\n\n"
