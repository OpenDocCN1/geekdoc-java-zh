    \ of the first element (i.e., first row) of the array.\n\nSystem.out.println(monthlyBalance[0].length);\n\
    \nIt will output 2. Here, monthlyBalance[0] refers to the first element of the\
    \ array.\nThe first loop (Lines 6-9) iterates through the array along the first\
    \ dimension. With each iteration, the columns are enumerated to assign computed\
    \ values to the atomic elements. For example, in the first iteration, monthlyBalance[i][0]\
    \ is monthlyBalance[0][0], which refers to the atomic element in first row, first\
    \ column. Note that the counter i starts from 1. We need to offset it by 1 when\
    \ it is used as index because array index starts from 0."
  md: "\n## 3 Control Structures and Arrays\n\n- Declare an array\n- Create an array\n\
    - Access elements in an array\n- Manipulate an array\n- Work with a multi-dimensional\
    \ array\n\n### 3.5.1 Declaring an Array\n\nArray declaration is similar to variable\
    \ declaration, except that you need to use a pair of square brackets either the\
    \ type or the variable name. For example, to declare an array, `daysMonth`, that\
    \ holds the number of days in each month as int values, you use one of the following\
    \ declarations:\n\n```java\nint[] daysMonth; // type[], or\nint daysMonth[] =\n\
    ```\n\nThe meanings of different parts are shown in Fig. 3.7.\n\n![](img/d4f7b51b492858346b4c26816c21e311_87_0.png)\n\
    \nThe data type of `daysMonth` is `int[]` — one-dimensional array storing int\
    \ values. It is one-dimensional because there is only one pair of square brackets.\
    \ All elements in the array must be of `int` type. As mentioned in the beginning\
    \ of the section, the type of `daysMonth` is a reference type, not a primitive\
    \ type.\n\nOf course you can also declare arrays to store elements of reference\
    \ types, such as `String`, `Integer`, or any reference types defined in your own\
    \ application or APIs you are using. In this case, any instance of a sub-type\
    \ of the reference type can be stored in the array—this will be discussed in Chapter\
    \ 5 on the topic of polymorphism.\n\n### 3.5.2 Creating an Array\n\nWhen creating\
    \ an array, the `new` keyword must be used and the size of the array must be indicated.\
    \ For example, the following statement creates the array `daysMonth` declared\
    \ previously:\n\n```java\ndaysMonth = new int[12];\n```\n\n### 3.5 Array\n\nIn\
    \ the statement, we indicate that the array will have a capacity to store 12 elements\
    \ of `int` type. You can combine the declaration with the declaration into an\
    \ assignment statement like the following:\n\n```java\nint[] daysMonth = new int[12];\n\
    ```\n\nThis statement indicates the system to allocate exact amount of memory\
    \ for storing 12 `int` values. The size of an array is a property of the array\
    \ after the array has been created. The syntax for the property is `arrayName.length`.\
    \ For example, the following code would output:\n\n```java\nSystem.out.println(daysMonth.length);\n\
    ```\n\nUpon creation of an array, each element is initialized to the default value\
    \ of the element type:\n\n- For numeric data types, the default is zero\n- For\
    \ `char`, the default is '\\u0000'\n- For `boolean`, the default is false\n- For\
    \ reference types, the default is null\n\nThus, after the creation of the array\
    \ `daysMonth`, each of its 12 elements is automatically initialized to 0. You\
    \ can also initialize array elements at the time of declaration: the elements\
    \ must be separated by commas and enclosed within a pair of curly braces. For\
    \ example, the following code declares, creates, and initializes two arrays:\n\
    \n![](img/d4f7b51b492858346b4c26816c21e311_88_0.png)\n\n```java\nString[] month\
    \ = {\"January\", \"February\", \"March\", \"April\", \"May\", \"June\", \"July\"\
    , \"August\", \"September\", \"October\", \"November\", \"December\"};\nint[]\
    \ daysMonth = {31, 28, 31, 30, 31, 30, 31, 30, 31, 30, 31};\n```\n\nThe first\
    \ array is initialized with 12 String elements, and the array is initialized with\
    \ 12 int elements.\n\nOnce an array has been created, its size cannot be changed.\n\
    \n### 3.5.3 Accessing and Manipulating an Array\n\nAs illustrated in Fig. 3.8,\
    \ you can think of an array as a block of memory, which is referred to by the\
    \ array variable. Each element takes one slot, or cell, whose location is referred\
    \ to by an index that starts from 0. For example, `daysMonth[0]` refers to the\
    \ first element, and `daysMonth[11]` refers to the 12th element.\n\nOnce you have\
    \ created an array, you can access each cell to assign a value or retrieve the\
    \ element stored in it. For example, if you wish to update the second element\
    \ in `daysMonth` to 29, you can use the following statement:\n\n**3.8** Accessing\
    \ array element via index; the index of the first element is 0, and the index\
    \ of the last element is array length minus one.\n\n| Index | 0 | 1 | 2 | 3 |\
    \ ... | 10 | 11 |\n|---|---|---|---|---|---|---|---|\n| daysPerMonth | 28 | 31\
    \ | 31 | 30 | ... | 30 | 31 |\n| daysPerMonth[0] | | | | | | | | |\n| daysPerMonth[11]\
    \ | | | | | | | | |\n\n```java\ndaysPerMonth[1] = 29;\n```\n\nGiven the array\
    \ `daysPerMonth` in Listing 3.10, how do you calculate the total number of days?\n\
    \nYes, you can add the elements: `daysPerMonth[0]+daysPerMonth[11]`. Although\
    \ it is not too bad with 12 elements, you will write a lot of code for larger\
    \ arrays (e.g., with hundreds). A better alternative is to use a for-loop:\n\n\
    ```java\nint daysYear = 0;\nfor (int i = 0; i < daysPerMonth.length; i++) {\n\
    \    daysYear += daysPerMonth[i];\n}\n```\n\n### 3.5.4 Multi-Dimensional Array\n\
    \nAn array can be more than one dimension. For example, a table with rows and\
    \ columns can be represented as a two-dimensional array, declared using two pairs\
    \ of square brackets. The program in Listing 3.11 demonstrates the use:\n\n```java\n\
    public class TwoArray {\n    public static void main(String[] args) {\n      \
    \  double b0=5000;\n        double r=0.05;\n        double[][] monthlyBalance\
    \ = new double[12][2];\n        for (int i = 0; i<monthlyBalance.length; i++)\
    \ {\n            monthlyBalance[i][0] = b0*(1+r);\n            monthlyBalance[i][1]\
    \ = b0*Math.pow(1,i);\n        }\n        System.out.printf(\"%2s %8s %8s\\n\"\
    , \"Simple\", \"Compound\");\n        for (int i = 0; i<monthlyBalance.length;\
    \ i++) {\n            System.out.printf(\"%2d %%.2f %%.2f\\n\", i+1, monthlyBalance[i][0],\
    \ monthlyBalance[i][1]);\n        }\n    }\n}\n```\n"
  mdcn: "\n\n## 3 控制结构与数组\n\n- 声明数组\n- 创建数组\n- 访问数组中的元素\n- 操作数组\n- 使用多维数组工作\n\n###\
    \ 3.5.1 声明数组\n\n数组的声明与变量声明相似，不同之处在于需要在类型或变量名后使用一对方括号。例如，为了声明一个名为 `daysMonth` 的数组，用于存储每个月的天数（`int`\
    \ 类型），你可以使用以下声明之一：\n\n```java\nint[] daysMonth; // 类型[], 或\nint daysMonth[] =\n\
    ```\n\n不同部分的含义如图 3.7 所示。\n\n![](img/d4f7b51b492858346b4c26816c21e311_87_0.png)\n\
    \n`daysMonth` 的数据类型是 `int[]` —— 一个存储 `int` 值的一维数组。它是一维的，因为只有一对方括号。数组中的所有元素都必须是\
    \ `int` 类型。正如本节开头提到的，`daysMonth` 的类型是一个引用类型，而不是基本类型。\n\n当然，你也可以声明数组来存储引用类型的元素，例如\
    \ `String`、`Integer` 或你在自己的应用程序或正在使用的 API 中定义的任何引用类型。在这种情况下，引用类型的子类型的任何实例都可以存储在数组中——这将在第\
    \ 5 章关于多态的话进行讨论。\n\n### 3.5.2 创建数组\n\n在创建数组时，必须使用 `new` 关键字并指定数组的大小。例如，以下语句创建了之前声明的\
    \ `daysMonth` 数组：\n\n```java\ndaysMonth = new int[12];\n```\n\n### 3.5 数组\n\n\
    在语句中，我们指明该数组具有存储 12 个 `int` 类型元素的容量。你可以将声明与初始化组合为一个赋值语句，如下：\n\n```java\nint[]\
    \ daysMonth = new int[12];\n```\n\n该语句指示系统分配精确的内存来存储 12 个 `int` 值。数组的大小是数组创建后的一个属性。该属性的语法为\
    \ `arrayName.length`。例如，以下代码将输出：\n\n```java\nSystem.out.println(daysMonth.length);\n\
    ```\n\n创建数组后，每个元素都会被初始化为元素类型的默认值：\n\n- 对于数值数据类型，默认值为 0\n- 对于 `char`，默认值为 '\\u0000'\n\
    - 对于 `boolean`，默认值为 false\n- 对于引用类型，默认值为 null\n\n因此，在创建数组 `daysMonth` 之后，其 12\
    \ 个元素中的每一个都被自动初始化为 0。你也可以在声明时初始化数组元素：元素之间必须用逗号分隔，并包含在一在大括号内。例如，以下代码声明、创建并初始化了两个数组：\n\
    \n![](img/d4f7b51b492858346b4c26816c21e311_88_0.png)\n\n```java\nString[] month\
    \ = {\"January\", \"February\", \"March\", \"April\", \"May\", \"June\", \"July\"\
    , \"August\", \"September\", \"October\", \"November\", \"December\"};\nint[]\
    \ daysMonth = {31, 28, 31, 30, 31, 30, 31, 30, 31, 30, 31};\n```\n\n第一个数组初始化了\
    \ 12 个 `String` 元素，第二个数组初始化了 12 个 `int` 元素。\n\n一旦创建数组，其大小就不能更改。\n\n### 3.5.3 访问和操作数组\n\
    \n如图 3.8 所示，你可以将数组想象成一块内存，通过数组变量引用。每个元素占用一个槽（或单元格），其位置由从 0 开始的索引引用。例如，`daysMonth[0]`\
    \ 指向第一个元素，`daysMonth[11]` 指向第 12 个元素。\n\n一旦创建了数组，就可以访问每个单元格来赋值或检索其中存储的元素。例如，如果你想将\
    \ `daysMonth` 中的第二个元素更新为 29，可以使用以下语句：\n\n**3.8** 通过索引访问数组元素；第一个元素的索引为 0，最后一个元素的索引为数组长度减一。\n\
    \n| 索引 | 0 | 1 | 2 | 3 | ... | 10 | 11 |\n|---|---|---|---|---|---|---|---|\n\
    | daysPerMonth | 28 | 31 | 31 | 30 | ... | 30 | 31 |\n| daysPerMonth[0] | | |\
    \ | | | | | |\n| daysPerMonth[11] | | | | | | | | |\n\n```java\ndaysPerMonth[1]\
    \ = 29;\n```\n\n给定列表 3.10 中的数组 `daysPerMonth`，你如何计算总天数？\n\n是的，你可以相加元素：`daysPerMonth[0]+daysPerMonth[11]`。虽然对于\
    \ 12 个元素来说不算什么，但对于较大的数组（例如数百个），你需要编写大量的代码。更好的替代方案是使用 `for` 循环：\n\n```java\nint\
    \ daysYear = 0;\nfor (int i = 0; i < daysPerMonth.length; i++) {\n    daysYear\
    \ += daysPerMonth[i];\n}\n```\n\n### 3.5.4 多维数组\n\n数组可以超过一个维度。例如，行列的表格可以用二维数组表示，使用对方括号进行声明。列表\
    \ 3.11 中的程序演示了这种用法：\n\n```java\npublic class TwoArray {\n    public static void\
    \ main(String[] args) {\n        double b0=5000;\n        double r=0.05;\n   \
    \     double[][] monthlyBalance = new double[12][2];\n        for (int i = 0;\
    \ i<monthlyBalance.length; i++) {\n            monthlyBalance[i][0] = b0*(1+r);\n\
    \            monthlyBalance[i][1] = b0*Math.pow(1,i);\n        }\n        System.out.printf(\"\
    %2s %8s %8s\\n\", \"Simple\", \"Compound\");\n        for (int i = 0; i<monthlyBalance.length;\
    \ i++) {\n            System.out.printf(\"%2d %%.2f %%.2f\\n\", i+1, monthlyBalance[i][0],\
    \ monthlyBalance[i][1]);\n        }\n    }\n}\n```\n\n"
