    # 5.2 Student Loans


    Student loans, unlike other types of loans, cannot be excused even with a bankruptcy
    claim. Once you take out a student loan, you are responsible to pay it back, no
    matter what. There are many types of student loans from government and private
    lenders. With proven financial need, you may be eligible for subsidized government
    student loans. With subsidized loans, interest is not charged and remains part
    of principal (i.e., amount borrowed) even when the borrower is still in college.


    Student loans, unlike other types loans, are usually long-term debts that are
    arranged to pay off using an installment. With an installment, you pay the same
    amount each month: a fraction of it is used to reduce the principal, the remaining
    portion is paid to interest to the lender. It is called amortization. Before getting
    into the details of amortization is calculated, let us discuss what options you
    have if you experience financial hardship and cannot make the scheduled payments.
    You need to discuss with your lender to see if they offer the following options:


    +   - Deferment is a period during your payment to a loan is temporarily deferred.
    For subsidized loans, the federal government may pay the interest on your loan
    during a deferment.


    +   - Forb is an arrangement with which you stop making payments or reduce your
    monthly payments for a certain period, up to 12 months.


    See https://studentaid.gov/repay-loans/deferment-forbearance for more information.
    You also want to discuss with the lender to explore other options.


    # 5.5.3 Amortization


    With amortization, you pay the same amount each payment, usually monthly. The
    amounts of interest and principal paid with each payment change over time. As
    shown in Fig. 5.5, the amount of principal increases and the amount of interest
    decreases over time.


    The amount of monthly payment can be calculated using Equation 3.20:


    ```

    A = \frac{IV0}{1-(1+i)^{-n}} (3.20)

    ```


    where $IV0$ is loan amount, $i$ is monthly interest rate, $n$ is the number of
    months to pay off the loan.


    The amount of interest paid by the first payment is $Ai$, the amount of principal
    paid is $A(1-i)$; after the first payment, the remaining principal becomes $V0-A(1-i)$.
    The amount of interest of the second payment is calculated based on this remaining
    principal.'
