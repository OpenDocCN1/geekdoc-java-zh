  mdcn: "\n\n- 3. 编写一个程序，以表格格式打印出你的个人资产负债表。计算并输出每月生活支出覆盖率、负债率和长期债务偿付率；根据需要使用损益表中的信息。\n\
    \n# 第 3 章\n控制结构与数组\n\n> 省一分钱就是赚一分钱。\n— 苯杰明·富兰克林\n\n# 主题\n\n- 选择结构\n  - if, if...else,\
    \ switch\n- 循环结构\n  - for, while, do...while\n- 分支语句\n  - continue, break, return\n\
    - 数组\n- 流程图\n\n当你开始开发复杂的程序时，你会发现有需要控制代码中的执行流。例如，为了防止银行账户透支，你的代码需要检查取款是否会导致余额低于最低余额：如果是，则拒绝取款并提示解释性消息；否则，从现有余额中扣除取款金额并显示当前余额。在这种情况下，你的程序会根据某些条件执行不同的操作。在其他时候，你的程序需要重复执行某些操作，直到某个条件不再成立——这也被称为循环。Java\
    \ 中的控制结构允许你完成选择和重复任务。你可能还需要更高效地处理一组相似的内容（例如数字和对象）的能力——实现这一点的简单方法就是使用数组。\n\n在本章中，我们将学习控制结构和许多分支语句。我们还将学习数组并学会如何使用它们来存储一组相同类型的数据元素。你以前可能使用过流程图来记录过程。我们将查看如何使用流程图来描述程序的过程。\n\
    \n## 3.1 控制结构\n\nJava 提供了三种控制结构：顺序、选择和重复。在顺序结构中，控制流是顺序的——代码按照源代码中语句出现的顺序逐条执行。到目前为止，我们一直在程序中使用这种控制结构。选择和重复控制结构修改了顺序关系，使你可以在程序中需要时创建分支和循环。\n\
    \n在早期的一些编程语言中，有一种“GO TO”语句，允许执行流跳转到任何标记点。这确实是一个方便的功能，但包含许多“GO TO”语句的代码将难以追踪和维护。后来，研究表明，编程语言可以通过顺序、选择和重复控制结构来消除“GO\
    \ TO”。Java 就是这样一种没有“GO TO”的语言。\n\n## 3.2 选择结构\n\n选择可以使用 if、if...else 和 switch\
    \ 语句来实现。\n\n### 3.2.1 if 和 if...else 语句\n\n让我们先看一个例子。假设银行存款的利率通常为 1%，但对于任何余额在\
    \ 20,000 美元或以上的账户，利率为 1.325%。现在你想写一个程序，要求用户输入余额，然后输出一条消息告知用户利率。该程序的源代码列在列表 3.1\
    \ 中。\n\n```java\nimport java.util.Scanner;\npublic class ControlStructure {\n\n\
    public static void main(String[] args) {\n    double interestRate = 0.01;\n  \
    \  Scanner input = new Scanner(System.in);\n    System.out.println(\"Please input\
    \ your balance: \");\n    double balance = input.nextDouble();\n    if (balance\
    \ >= 20000) {\n        interestRate=0.01325;\n    }\n    System.out.printf(\"\
    Your balance is %.2f\\n\", balance);\n    System.out.printf(\"Your annual interest\
    \ rate is $%.3f%%\\n\", interestRate*100);\n}\n```\n\n在解释代码之前，让我们使用两个不同余额值的程序示例：100\
    \ 和 20,000。它们的输出所示：\n\n```\nPlease input your balance:\n100\nYour balance is 100.00\n\
    Your annual interest rate is 1.000%\n\nPlease input your balance:\n20000\nYour\
    \ balance is 20000.00\nYour annual interest rate is 1.325%\n```\n\n让我们通过伪代码查看程序是如何工作的：\n\
    \n```\ninitializeInterestRate to 0.01;\nRead balance;\nif balance >= 20000\n \
    \   interestRate = 0.01325;\nOutput balance and interestRate\n```\n\n- 第 4 行声明利率。第\
    \ 5 行创建了 Scanner 对象，从输入流获取。\n- 第 6 行提示用户输入余额。\n- 第 7 行声明并初始化余额。\n- 第 8 行检查余额是否大于或等于\
    \ 20000。\n- 第 9 行将 interestRate 修改为 0.01325。\n- 第 11 行和第 12 行输出余额和利率。\n\nif 的语法为：\n\
    \n```\nif (<boolean_expression>) {\n    // code\n}\n```\n\n## 3 控制结构与数组\n\n控制流可以使用流程图描述，参见流程图符号。我们程序的流程图如图\
    \ 3.1 所示。控制通常从上到下，带有分支：如果小于 20,000，利率为 1%，否则为 1.325%。\n\n### 流程图符号\n\n- 圆矩形：开始、结束\n\
    - 箭头：流\n- 矩形：处理\n- 平行形：输入、输出\n- 菱形：决策点\n- 双边矩形：子程序或方法\n\n## 3.2 选择结构\n\n修改后的程序使用了\
    \ if...else，见列表 3.2。\n\n```java\ndouble interestRate = 0.01;\nScanner input =\
    \ new Scanner(System.in);\nSystem.out.println(\"Please input your balance: \"\
    );\ndouble balance = input.nextDouble();\nif (balance<20000) {\n    interestRate=0.01;\n\
    } else {\n    interestRate=0.01325;\n}\nSystem.out.printf(\"Your balance is %.2f\\\
    n\", balance);\nSystem.out.printf(\"Your annual interest rate is $%.3f%%\\n\"\
    , interestRate*100);\n```\n\n在修改后的程序中，第 4 行仅声明了 interestRate 变量，在列表 3.1 中并没有初始化它。8-12\
    \ 行引入了两个分支。相应的流程图如图 3.2 所示。\n\n如果银行提供更高的利率，例如对于余额在 50,000 美元或以上的账户利率为 2.5% 如何？在\
    \ Java 中，你可以在 else 后面使用另一个 if，并可以链接任意 if...else 来创建程序所需的分支。我们的程序可以修改以包含另一个条件。列表\
    \ 3.3 显示了如何更新列表 3.2 中的第 8-12 行。\n\n```java\nif (balance<20000) {\n    interestRate=0.01;\n\
    } else if (balance<50000) {\n    interestRate=0.01325;\n} else {\n    interestRate=0.025;\n\
    }\n```\n\n相应的流程图如图 3.3 所示。\n\n"
