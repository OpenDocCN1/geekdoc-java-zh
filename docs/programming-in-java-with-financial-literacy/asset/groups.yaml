    \    interestRate=0.025;\nSystem.out.printf(\"Your balance is $%.2f\\n\", balance);\n\
    System.out.printf(\"Your annual interest rate is %5.3f%%\\n\", interestRate*100);\n\
    ```\n\nswitch-case 语句的流程图符号与编程结构中使用的其他符号并不统一。(1) 将 case 分支视为链式连接的决策点，或者 (2) 使用菱形或处理符号表示\
    \ switch 部分，并使用从其引出的标签分支作为 case 分支。图 3.4 和图 3.5 显示了列表 3.4 中的 switch 语句如何使用这些方法。底部的圆形符号是用于连接多个过程的可选符号。我们在此之前的流程图中未使用该符号。\n\
    \n第 8 行构造了一个 int 变量 balanceLevel，通过将 balance 转换为 int 并除以 10000 得到。因此，如果 balance\
    \ 小于 10000，除法结果为 0；如果 balance 在于 10000（包含）和 20000（不包含）之间，除法结果为 1。（理解整数除法的简单方法是，你正在执行数学除法但只取整数部分。因此，对于\
    \ [0, 60000] 内的任何 balance，除法将是 [0, 1, 2, 3, 4, 5] 中的之一。）第 9-31 行是 switch 语句。switch\
    \ 语句包含一个或多个代码块，每个块都有一个 case 标签；它可以包含一个 default 标签。switch 括号中的表达式（balanceLevel）的数据类型必须是以下类型之一：\n\
    \n- byte、char、short 和 int 原始数据类型\n- 上述原始类型的包装类，即 Byte、Character 和 Integer\n- String\
    \ 类型\n- Enum 类型（参见 http://docs.oracle.com/javase/tutorial/java/enum.html）\n\n\
    ## 3.2 选择结构\n\n![d4f751b92858346c816c21_74_0.png] 图 3.4 列表 3.4 中 switch 语句的流程图，链式方法。\n\
    \n![d4f751b92858346c816c21e31_74_1.png] 图 3.5 列表 3.4 中 switch 语句的流程图，标签方法。\n\n\
    ## 3 控制结构与数组\n\n每个 case 标签都作为流程的潜在入口，取决于 switch 之后表达式的值。例如，在示例中，如果用户输入 balance\
    \ 为 36000，流程进入标记为 case 3 的块（因为整数除法等于3），其中 interestRate 为 0.015。之后是一个 break 语句，它将流程直接发送到\
    \ switch 语句的结束，跳过语句内的其余代码。如果未使用第 21 行的 break 点会怎样？\n\n### 练习\n\n- 1. 画出列表 3.4\
    \ 的流程图。\n- 2. 在类的 main 方法中实现列表 3.4 的程序。导入 java.util.Scanner。使用 36000 运行程序。该输入的利率应为\
    \ 1.50%。你的程序输出的利率正确吗？\n- 3. 现在，去掉列表 3.4 中 case 3 块中的 break 语句。保存文件并重新使用 36000\
    \ 进行测试。你输出什么利率？\n\nswitch 语句中的标签用于识别流程的入口；一旦流程进入，它将持续直到遇到 break 语句或 switch 语句。如果你在每个\
    \ case 标记的代码块末尾包含 break 语句，执行将跳过所有剩余标签。因此，当遇到 break 语句（第 21 行）时，执行流程将继续到第 24 行。在这种情况下，interestRate\
    \ 更新为 0.02（第 23 行），因此对于 30000（包含）到 50000（不包含）之间的任何 balance，程序将输出 2.000% 的利率。\n\
    \n按顺序搜索标签直到找到匹配的标签。如果没有找到，流程将进入标记为 default 的块；如果 default 不存在，switch 语句执行结束。在示例程序中，default\
    \ 块会将任何 $60,000 余额的利率设置为 2.5%。\n\n任何使用 switch 语句的程序都可以通过链式 if...else 实现，反之不然。当你都可以实现每个语句时，需要决定使用哪一种。以下是一些对你有用的指南：\n\
    \n- 通常，具有许多分支的 switch 语句比链式 if...else 语句更易读。\n- 当 case 涉及范围且无法转换为有限的数据元素时，使用 switch\
    \ 可能更好。\n\n## 3.3 重复结构\n\n记住，switch 适用于有限的数据类型。if...else 没有这种局限性——它适用于任何布尔表达式。\n\
