  md: "\n## 4.4 Variables: Scope, Pass-by-Value. Pass-by-Reference\n\nYou may have\
    \ noticed that variables can be introduced in several places: as members of a\
    \ class, as arguments of a method, within the body of a method. Depending on where\
    \ they are introduced, they have different ranges within which they are effect\
    \ — this is known as scope of variables. As identifiers, variables can be used\
    \ to refer to primitive values and objects. There is a difference between these\
    \ two types when variables are used as arguments of a method. In this section,\
    \ we will look at scoping and how variables are used as arguments of methods.\n\
    \n### 4.4.1 Variable Scope\n\nAs an identifier, name must be unique within its\
    \ scope. Variables declared as class members (i.e., attributes or fields) have\
    \ a global scope. These variables can be accessed from anywhere within the class.\
    \ Variables introduced as arguments and within blocks of code inside a method\
    \ have a local scope. Within a local scope, variables allowed to have the same\
    \ names as those in the global scope, in which case we say the global variables\
    \ are shadowed by the local variables.\n\nLet us look at the example in Listing\
    \ 4.4. The constructor introduces three local variables: name, major, grade. These\
    \ names are the same as those of the attributes. They shadow the attribute variables.\
    \ But how can Java determine which variable you are referring to?\n\nLet us look\
    \ at the following statement in the constructor of the Student class:\n\n```\n\
    this.name = name;\n```\n\nWe know that assignment is evaluated from right to left.\
    \ Thus Java needs to determine the name variable by searching in different scopes.\
    \ Java always begins by searching the current scope — the scope where the variable\
    \ appears. If it finds the variable declaration within the current scope, it uses\
    \ that variable; otherwise, it continues searching in the next scope. The search\
    \ continues until it finds the declaration. In this case, Java finds that the\
    \ variable is declared in the constructor arguments. Thus the variable refers\
    \ to the variable passed in as the constructor's argument.\n\nOur intention is\
    \ to assign this variable in local scope to the attribute variable in global scope,\
    \ but the attribute is shadowed by the local variable. In this case, the keyword\
    \ `this` in Java allows us to refer to a shadowed global variable from any local\
    \ scope. The keyword represents the current instance of the class. To access class\
    \ variables, use the class name as prefix (such as Line 15 in Listing 4.4: `Student.school=school`);\n\
    \nIf we change the code to\n\n```\nname = name;\n```\n\nthe name attribute will\
    \ not be affected. This is because the two operands of the assignment operator\
    \ refer to the same variable: the local variable introduced as the constructor's\
    \ argument.\n\nIn the constructor, if we change the argument name to something\
    \ different, e.g., `newName`, then in the body of the constructor we can assign\
    \ it to the attribute variable without using the `this` keyword:\n\n```\nname\
    \ = newName;\n```\n\nThis is OK because after failing to find the variable name\
    \ in the local scope, Java will continue to search in the outer scope, in which\
    \ case it is the global scope. It finds the variable there.\n\nOnly global variables\
    \ can be shadowed. In nested scopes, variables must be unique within its scope.\
    \ This syntax rule is illustrated with the examples in Fig. 4.3.\n\n```java\n\
    private void test(int k) {\n    for (int i=0; i<3; i++) {\n        int i;\n  \
    \      int i;\n    }\n}\n```\n\n```java\nprivate void test(int k) {\n    for (int\
    \ i=0; i<3; i++) {\n        int i;\n        int i;\n    }\n}\n```\n\n| k | k |\n\
    |---|---|\n| i (for-loop) | i (for-loop) |\n| i | i |\n| | |\n\nFig. 4.3: Variables\
    \ in various levels of local scope must be unique.\n\nOn the left of the figure,\
    \ the method introduces k as a local variable. It is in effect within the entire\
    \ method. Nowhere within the method is another variable named k to be declared.\
    \ The next variables named i are introduced in their own scopes — this is OK.\
    \ Variables introduced in a for-loop have a scope within the loop. Variables introduced\
    \ in a code block (within a pair of curly braces) have a scope from the point\
    \ of introduction to the end of the code block.\n\nOn the right of the figure,\
    \ we remove a pair of braces for the second declaration of variable i. Now its\
    \ scope is from the point of declaration to the end of the method. When we introduce\
    \ another i next line in an inner scope (with the use of curly braces), we get\
    \ an error because the first i ranges over the inner scope, thus within the inner\
    \ scope we are trying to declare i again.\n\n### 4.4.2 Method Arguments: Pass-by-Value\
    \ vs. Pass-by-Reference\n\nIn some programming languages, you can designate arguments\
    \ as either for input or for output. In Java allows only one explicit output from\
    \ a method, the return value. This may seem limiting but in reality it is not.\
    \ It is a matter of \"style\" of programming syntax. For example, suppose you\
