    ## 2.1 Primitive Data Types


    Java requires that every variable must be declared with a data type before using
    the variable, and its type cannot be changed later — this is known as static typing.
    Take a look at the following example:


    ```

    int i // declare i — can be assigned as -> int i = 3; // assign 3 to i

    ```


    On the left, the first line declares the data type (int) and the name (i) of the
    variable. In the second line, the variable is used in an assignment operation,
    where 3 is assigned to i — the variable holds the value 3, or we can say the value
    3 is stored in the variable i. The two lines of the code can be simplified to
    one line shown on the right in the above example. In this case, we also say that
    i is initialized to 3.


    # Static Typing


    Java''s variable typing mechanism is called static typing: (1) variables must
    be declared before they are used; (2) the variable type cannot be changed later,
    that is, the same variable can be declared only once in the same scope


    The eight pre-defined, primitive data types are summarized in Table 2.1


    | Table 2.1: Primitive Data Types |

    | Type | Size (bit) | Range |

    |---|---|---|

    | byte | 8 | -128 to 127 (i.e., -2⁷ to 2⁷-1) |

    | short | 16 | -32,768 to 32,767 (i.e., -2¹⁵ to 2¹⁵-1) |

    | int | 32 | -2,147,483,648 to 2,147,483,647 (i.e., -2³¹ to 2³¹-1) |

    | long | 64 | -9,223,372,036,854,775,807 to 9,223,372,036,854,775,807 (i.e., -2⁶³
    to 2⁶³-1) |

    | float | 32 | ~/-3.4E38 (6-7 significant digits) |

    | double | 64 | ~/-1.8E308 (15 significant digits) |

    | boolean | - | true/false |

    | char | 16 | Unicode character set \u0000 to \uFFFF |


    # 2.1 Primitive Data Types


    The imprecise results of floating point calculations are tolerable in most cases.
    But you must exercise caution when using comparison (e.g., in an if clause to
    test a variable greater than a certain threshold). A possible-around is to scale
    the variable, round it, and use integer comparison. The steps are: (1) Scale up
    (e.g., multiplying by 1000); (2) round; (3) Scale back down using division (e.g.,
    dividing the result to 1000).


    ```

    System.out.println(Math.round(1000*(1-0.9)));

    ```


    The output is 0.1.


    Because of efficiency and reasonable precision of the primitive double it is commonly
    used in programs that involve numeric calculations. Programs that deal with money
    sometimes uses BigDecimal class in (java.math package). The following code also
    produces an exact result:


    ```

    BigDecimal bd = new BigDecimal("1");

    System.out.println(bd.subtract(new BigDecimal("0.9")));

    ```


    The first line contains a BigDecimal object of value 1. In the second line, the
    subtract method is called to subtract 0.9 (a BigDecimal object). You can specify
    the precision of BigDecimal. Java also has a BigInteger class for dealing with
    large integers (beyond the range of long) of arbitrary precision.


    The boolean type has two possible values: true, false. Both are reserved words
    in Java. For example, you can declare and initialize a boolean variable to false
    using:


    ```

    boolean bankFee = false;

    ```


    Each type variable can hold a Unicode value that corresponds to a character. The
    16-bit Unicode can represent a maximum of 65,535 symbols and characters of many
    languages. The Unicode "u0041" represents the uppercase letter A''. Note that
    single quotes are used for a character literal (whereas double quotes are used
    for strings). The following code out two characters in Chinese, 你好, that stands
    for "Hello":


    ```

    System.out.println("\u4f60"+"\u597d");

    ```


    The empty string "" is to make the plus signs in the expression to be interpreted
    string concatenation instead of addition. Without the empty string, the plus sign
    ill be interpreted as addition (the Unicode characters are first converted to
    integers then added.

