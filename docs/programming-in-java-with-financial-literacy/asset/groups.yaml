    \ UML 类图开始，然后学习如何在 Java 中实现该类。图如图 42 所示。该类有三个属性成员，它们都是私有的。回想，私有成员只能从类内部访问。如果该类在另一个类中使用，并且我们从该类想要查询并更改学生对象的状态怎么办？例如，在创建学生对象后，我们可能想要输出学生的姓名和专业等信息。当学生更换专业时，我们需要更新专业属性。\n\
    \n为了满足这些需求，该类包含了两组方法，称为 getter 和 setter，允许对每个私有属性进行查询和更新。Getter 方法名以“get”单词开头，后跟属性名称\n"
