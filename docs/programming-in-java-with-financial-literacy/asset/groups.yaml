  - "[PAGE 82]\n\n# 3.3 Repetition Structure\n\n+   - Did you notice that in month\
    \ 2, the balance of the monthly compounding account is lower than that of the\
    \ daily compounding account. Why?\n- By year end, which account has more money?\
    \ With the same APR, which compounding frequency is better?\n- If you have a savings\
    \ account, find out what type of interest you get. Is interest compounded daily\
    \ or monthly?\n\n# 3.3.2 The while and do...while Statements\n\nJava also provides\
    \ two statements for implementing a repetition structure\n\n+   - The while statement\
    \ first checks `loopContinuationCondition`; if it is true, it executes the body\
    \ and the flow returns to check the condition again. The syntax for while:\n```java\n\
    while (<loopContinuationCondition>) {\n  <statements>;\n}\n```nThe body of a while\
    \ statement may execute zero or more times.\n- The do...while statement checks\
    \ the `loopContinuationCondition` after executing the body; thus the body executes\
    \ one or more times. Its syntax is:\n```java\ndo {\n  <statements>;\n} while (<loopContinuationCondition);\n\
    ``````nNote, there is a semicolon in the end.\n\nExercise\n- Draw the flowcharts\
    \ for while and do...while.\n- What is the main difference between two flowcharts?\n\
    \nYou cannot always convert a while-loop or do...while-loop to a for-loop, but\
    \ you can convert a for-loop to a while-loop or a do...while-loop:\n\n+   - for\
    \ -> while:\n```java\n<initialization>;\nwhile (<loopContinuationCondition>) {\n\
    \  <statements>;\n  <actionAfterCurrentIteration>;\n}\n```n- for -> do...while:"
  - "[PAGE 83]\n\n# 74 3 Control Structures and Arrays\n\n```\n<loop>;\nif (<loopContinuationCondition>)\
    \ { //check condition first\ndo {\n  <statements>;\n  <actionAfterCurrentIteration>;\n\
    } while (<loopContinuationCondition>);\n}\n```\n\nNow, there is a subtle difference\
    \ between a for-loop and the other two loops: the variables declared in the <initialization>\
    \ of the for statement are not accessible from outside of the statement. In contrast,\
    \ the variables declared in <initialization> for either while or do...while are\
    \ accessible even after the loop. We will learn more about variable scoping in\
    \ Chapter 4.\n\nNow, let us use the template and convert the for-loop in Listing\
    \ 3.5 (Lines 6-10) to a while-loop:\n\n```\nint i=1; // this is initialization\n\
    while (i<=12) {\n  vSimple=v0+(i*r);\n  vCompound=v0+Math.pow(1+r, i);\n  System.out.printf(\"\
    %2d$%.2f$%.2f\\n\", i, vSimple,\n  vCompound);\n  i++; // after current iteration\n\
    }\n```\n\n+   Exercise\n* To verify the discussion about the scoping of variables\
    \ introduced in initialization, try to output variable i after (and outside of\
    \ the body) of the for-loop. Do you get a syntax error?\n* Do the same for the\
    \ while-loop. What is the value of i shown in the output console? (It should be\
    \ 13).\n\n# 3.4 Branching Statements\n\nJava provides three additional branching\
    \ statements that are used within control structures. The applicable constructs\
    \ of these statements are shown in Table 3.1.\n\nTable 3.1: Applicability of Branching\
    \ Statements in Control Structures.\n\n| Statement | Sequence | Repetition |\n\
    |---|---|---|\n| break | ✓ | |\n| continue | | ✓ |\n| return | ✓ | ✓ |"
  - "[PAGE 84]\n\n# 3.4 Branching Statements\n\nBriefly, all branching statements\
    \ can be used with a repetition structure, and a return statement can be used\
    \ in any type of control structure. The continue statement can be used in a repetition\
    \ structure only, while the break can be used in selection structure (within a\
    \ switch statement) and repetition structure. When using these, the \"unreachable\
    \ code\" error must be avoided by avoiding the branching statement within a conditional\
    \ test or using it as the last statement in the control's code block.\n\nThe return\
    \ statement is the simplest to use: it simply exits the current method and returns\
    \ to the control over which the method was invoked. There are two forms, select\
    \ depending on the return type of the method within which return is used:\n\n\
    +   * //if return type is void\n* return <expression>; //expression> compatible\
    \ with return type\n\nWe have seen how break is used in the switch statement to\
    \ prevent execution falling through unintended statements for other branches.\
    \ It can also be used to terminate a loop. For example:\n\n```\nfor (int i=1;\
    \ i<=6; i++) {\n    if (i==3) break;\n    System.out.print(\"1+\"+i);\n}\n```\n\
    \nalthough the loop was set to iterate six times, when i reaches 3, the break\
    \ statement terminates the loop. Thus only 1 and 2 are printed in the output console.\n\
    The continue statement will control the flow to skip the rest of the statements\
    \ in the current iteration. For example, in the example above, where break is\
    \ replaced with continue, the program will skip Line 3 when i is 3. Therefore,\
    \ the program will print 1, 2, 4, 5, and 6.\n\nThe break and continue we have\
    \ used so far are the unlabelled version. They only affect the loop that contains\
    \ the statement. For example, nested loops, if the inner loop contains a break\
