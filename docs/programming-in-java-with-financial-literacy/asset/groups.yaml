    \        } finally {\n            System.out.println(\"finally block is always.\"\
    );\n        }\n    }\n}\n```\n\n在之前使用列表 6.2 的示例中，你是否注意到当抛出异常时，控制会转移到 `catch` 块，而不会返回到抛出异常的地方来修正问题？这被称为异常处理的**终止模型**（与恢复模型相对）。使用这种异常处理方法，在抛出异常后做什么什么取决于程序员的决定。例如，在通过输入文本框收集用户输入的图形用户界面（GUI）应用程序中，只需向用户提示问题即可；用户界面通常保持不变，以便用户纠正问题并重试。在基于文本的控制台应用程序中，可以使用循环不断要求输入，直到提供有效的输入为止。列表\
    \ 6.3 中的示例演示了这一点。\n\n"
