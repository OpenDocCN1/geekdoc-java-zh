    \n> If you think nobody cares if you're alive, try missing a couple of car payments.\n\
    > — Earl Wilson\n\n## Topics\n\n- Inheritance\n- Polymorphism\n- Abstract Class\n\
    - Interface\n\nIn the previous chapter we began to experience the benefits of\
    \ code reuse through classes that package logically-related attributes and methods\
    \ into \"modules\". An OOP language such as Java has two other mechanisms that\
    \ facilitate code reuse and extensibility through modular implementation of large\
    \ systems. In this chapter, we will introduce these two mechanisms: inheritance\
    \ and polymorphism.\n\n## 5.1 Inheritance\n\nIn this section, we will introduce\
    \ the inheritance concept and learn how to implement it as well as how to represent\
    \ it using a class diagram.\n\n## Concept and Motivation\n\n### 5.1.1 Inheritance\n\
    \nIn real world or conceptual world, certain things and concepts are related in\
    \ terms of commonalities and distinctions among them. For example, we have a notion\
    \ of \"student\" to refer to all types of students, such as visiting students\
    \ and undergraduate students enrolled in a degree program. A common characteristic\
    \ of all students is that each has a name. An undergraduate is a more specific\
    \ type of \"student\". A distinct characteristic of undergraduate student is that\
    \ each also has a major. Since undergraduate is also a student, undergraduate\
    \ also has a name. We model this relationship as an is-relationship; the more\
    \ specific concept (e.g., undergraduate) is a special kind of the more general\
    \ concept (e.g., student). The is-relationship is also known as inheritance because\
    \ the more specific concept inherits characteristics of the general concept.\n\
    \nIn OOD and OOP, we model concepts as classes with attributes and methods. The\
    \ class corresponding to the general concept is called the parent class or superclass.\
    \ The specific concept is called the child class or subclass. This relationship\
    \ can be more than one level, forming an inheritance hierarchy. For example, a\
    \ double-major undergraduate is a special kind of undergraduate who has two majors.\
    \ These classes are sometimes called ancestor and derived. A superclass is also\
    \ called a base class, and a subclass is also called a derived class.\n\nFrom\
    \ modeling point of view, a descendant inherits all the attributes and behaviors\
    \ of its ancestor classes. It can also optionally have additional attributes and\
    \ behaviors. It can optionally change the inherited behaviors.\n\nOK, all these\
    \ concepts are a bit abstract without an example. What is the use of inheritance\
    \ in programming? Let us use an example to explain inheritance in the programming\
    \ context.\n\nSuppose for one application, a Student class is created. It has\
    \ one attribute name, a constructor that initializes the attribute, a getter and\
    \ a setter for the attribute, and a toString method that simply returns \"Name:\
    \ \" followed by the instance's name attribute. Let us assume that this simple\
