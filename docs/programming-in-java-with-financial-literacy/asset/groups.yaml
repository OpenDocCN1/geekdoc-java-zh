    literal depends on the value and the format of the literal. Integer literals are
    generally considered to have the type `int`. If the integer value falls within
    the range of byte or short, it can be interpreted as a byte or a short, as needed:


    ```

    byte i = 127; // the type of 127 is byte

    short j = -3268; // the type of -3268 is short

    ```


    If you need to make an integer literal of type long, you need to add the letter
    L (or the lowercase l) to the end of the literal, e.g.


    ```java

    long small = 127L; // L is optional, an int can be converted to a long as needed

    long large = 2147483648L; // L is needed as the value exceeds the range of int

    ```


