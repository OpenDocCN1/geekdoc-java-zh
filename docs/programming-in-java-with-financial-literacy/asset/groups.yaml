    # Imprecision of Floating Point Calculation


    The imprecise results of floating point calculations are tolerable in most cases.

    But you must exercise caution when using comparison in your code (e.g., in

    an if clause to test a variable of double type is greater than a certain

    threshold). A possible get-around is to scale the variable, round it, and use

    integer comparison. Math.round method rounds a float or double value to the

    nearest integer (long type). Before rounding, you can scale value to the desired

    decimals. The steps are: (1) Scale up (e.g., by multiplying 1000); (2)

    (3) Scale back down using double division (e.g., by dividing the result

    to 1000.0).


    ```

    System.out.println(Math.round(1000*(1-0.9)));

    ```


    The output is 0.1.


    Because of efficiency and reasonable precision of the primitive double

    t it is commonly used in programs that involve numeric calculations. Pro-

    grams that deal with money sometimes uses Java BigDecimal class

    in (java.math package). The following code also produces an exact result:


    ```

    BigDecimal bd = new BigDecimal("1");

    System.out.println(bd.subtract(new BigDecimal("0.9")));

    ```


    The first line contains a BigDecimal object of value 1. In the second line, the

    ubtract method is called to subtract 0.9 (a BigDecimal object).

    You can specify the precision of BigDecimal. Java also has a BigInteger

    class for dealing with large integers (beyond the range of long) of arbitrary

    recision.


    The boolean type has two possible values: true, false. Both are reserved words

    in Java. For example, you can declare and initialize a boolean variable to false

    using


    ```

    boolean bankFee = false;

    ```


    Each type variable can hold a Unicode value that corresponds to a character.

    The 16-bit Unicode can represent a maximum of 65,535 symbols and characters of

    many languages. The Unicode "u0041" represents the uppercase letter

    A''. Note that single quotes are used for a character literal (whereas double

    quotes are used for strings"a string is a sequence of characters). The following
    code

    out two characters in Chinese, 你好, that stands for "Hello":


    ```

    System.out.println("\u4f60"+"\u597d");

    ```


    The empty string "" is to make the plus signs in the expression to be interpreted

    string concatenation instead of addition. Without the empty string, the plus sign

    ill be interpreted as addition (the Unicode characters are first converted to
    integers

    then added.'
