    | Unary | ++ | Increment | ++x. Operand must be a variable; cannot be a literal,
    e.g., (x+1). Return type is the same as the operand. |

    | Unary | -- | Decrement | --x. Other operands are the same as above. |

    | Unary | + | Positive sign | Used simply to return the operand. |

    | Unary | - | Negation | It returns the negative of the operand. |

    | Binary | ++ | Addition | x = y++; // y is 1, or x = ++x. Operands can be variables,
    literals, or expressions. |

    | Binary | -- | Subtraction | x = y-y. |

    | Binary | * | Multiplication | x*y, x*abs(y). |

    | Binary | / | Division | x/y, x/abs(y). |

    | Binary | % | Remainder | x%y, x%abs(y). Also called modulo. |


    The difference between the two operators is that increment increases the operand
    by 1, whereas decrement decreases the operand alone by 1. We use increment to
    explain the difference:


    - With post-increment, the current value of the operand is used in the rest of
    the evaluation; after that, the operand gets incremented.

    - With pre-increment, the operand is incremented first; then the resulting value
    of the operand is used in the rest of the evaluation. For example:


    ```java

    int x = 10;

    int y = 10 + x++; // equivalent to: y = 10 + x;

    ```


    In the above example with post-increment, the second statement is equivalent to
    the two statements shown in the comments. After this statement is run, y becomes
    20 and x becomes 11. In contrast, if we use pre-increment:


    ```java

    int x = 10;

    int y = 10 + ++x; // equivalent to: ++x; // x becomes 11

    int y = 10 + x;

    ```


    x gets incremented to 11, and 11 will be used in the addition operation. In this
    case, the value of y becomes 21.


    ### 2.3.1.2 Arithmetic Operators


    The rest of arithmetic operators work the same way as in mathematics. None of
    them alter their operands. The positive sign (called plus in Java documentation)
    does not change the sign of the operand. The negation operator (called minus in
    Java documentation) returns a value with the opposite sign of the operand. For
    example:


    ```java

    int i = -1;

    int j = ++i; // j is 0, i is still 0

    ```


    Java differentiates between integer division and floating point division. When
    both operands are of integer type, the division operator performs integer division
    and returns only the integer part of the result. For example:


    ```java

    System.out.println(3/4); // prints 0

    long value = 5/3; // value 1

    ```


    The case when the operands have different types is discussed in the next section.
    The remainder operator, %, takes two operands and returns the remainder of the
    first divided by the second. For example, 5%2 returns 1.


    Even though integer division does not provide an accurate division, it is useful
    in certain applications. For example, if you are given the number of seconds passed
    since a certain point in time, divide the value by 60 (using integer division)
    gives you the number of minutes passed since that point in. The remainder operation
    is also useful in certain applications. In the preceding example, if you use the
    remainder operation, you will be able to tell the elapsed time in terms of minutes
    and seconds.


    ```java

    int elapsed = 135; // time in seconds

    int minutes = elapsed/60; // 2 minutes

    int seconds = elapsed%60; // 15 seconds

    ```

