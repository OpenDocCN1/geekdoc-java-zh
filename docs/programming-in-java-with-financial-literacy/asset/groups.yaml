  mdcn: "\n\n# Java 编程\n# 结合金融素养\n\n![](img/d4f7b51b492858346b4c26816c21e311_0_0.png)\n\
    \n# 朱洪伟 (Hongwei Zhu)\n\n# 朱洪伟\n# Java 编程\n# 结合金融素养\n\n![](img/d4f7b51b492858346b4c26816c21e311_3_0.png)\n\
    \nhttps://archive.org/details/isbn_9781495241802-\n\n# 前言\n\n> 金钱是你对独立的渴望，你永远无法拥有它。一个人在这个世界上唯一真正的安全感是知识的储备\n\
    > - 亨利·福特 (Henry Ford)\n\n如果你正在为大学的财务挑战而挣扎，你并不孤单。在美国，每年三分之二的大四学生（约 180 万人）时带着巨债毕业。美国的学生贷款已超过了汽车贷款和信用卡债务，达到了\
    \ 1 万亿美元。为了方便直观，2011 年美国的 GDP 为 15 万亿美元。\n\n2007 年至 2009 年的大衰条影响了许多人的生活，包括大学学生。“有时我觉得上学是我做过最错误的决定，”一位负着\
    \ 6 万美元债务的应届毕业生评论道。随着历史高位的失业率和不断攀升的学生债务违约率，这种对大学教育财务挑战的感触并不罕见。衰条也改变了我，我是一个向本科生教授编程和计算思维的教授。它让我相信，金融素养并不是只有银行家才需要的特殊知识。每一位公民都应该具备金融素养和必要的技能，以更好地应对财务挑战并管理个人财务。\n\
    \n这本书是我努力将个人金融素养整合到编程课程（计算机科学中通常被称为 CS）中的成果。本书涵盖了使用 Java 编程语言面向对象编程（OOP）的基础知识。不包含\
    \ OOP 的高级主题或软件工程。因此，它不适合作为参考书。个人财务被用应用领域。编程练习和大多数示例都取自这一领域。\n\n在学习编程基础的同时，你也有机会学习个人财务的有用概念。我希望你们能同时学习这两者，并产生浓厚的兴趣。\n\
    \n由于学习编程最好的方法是通过实践，书中包含了大量的练习，强烈建议读者完成这些练习。此外，每章末尾都包含了三类型的练习：关于编程概念的复习题、关于金融素养概念的问题、以及适合家庭作业的编程练习。每章还包含一个“金融素养”部分，用来说解释编程练习所需的概念、原理和计算公式。\n\
    \n尽管旨在将金融素养整合到编程中，本书对金融素养主题的涵盖不足以替代对该主题进行系统处理的个人财务课程。至少，我希望这本书能帮助你学习编程基础，并对利用你的技术技能更好地管理个人财务产生兴趣。你可能不会因为读这本书而变得富有，但你会意识到自己的财务状况，并积极寻求更好地管理和增加你的财富。学习愉快。这是一份终身的喜悦。\n\
    \n朱洪伟\n美国，马萨诸塞州\n2013 年 1 月\n\n# 目录\n\n- 1 准备 Java 编程 ............................................................................\
