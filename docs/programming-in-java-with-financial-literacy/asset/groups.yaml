    ## 3.7 Financial Literacy


    Interest rate period $t_1$ has $m$ interest rate period $t_2$

    $r_{t_2} = \frac{r_{t_1}}{m}$ (3.1)


    Interest rate period is equal to compounding period $t_c$

    $i_{t_c} = r_{t_c}$ (3.2)


    Interest rate period has $m$ compounding periods

    $i_t = (1 + \frac{r_t}{m})^m - 1$ (3.3)


    Interest is compounded continuously

    $i_t = e^{r_t} - 1$ (3.7)


    **Example 3.1.** A financial institution offers an investment product with a nominal
    annual rate of 5%, interest compounded quarterly. What is the effective quarterly
    interest rate? What is the effective annual interest rate? If interest were compounded
    continuously, what would be the effective quarterly interest rate, and what would
    be the effective annual interest rate?


    There are four quarters in a year. To obtain quarterly rate, we set $m = 4$. From
    Equation 3.1, we know that the quarterly nominal interest rate is $r_{quarter}
    = \frac{0.05}{4} = 0.0125$. From Equation 3.2, we know that the effective quarterly
    interest rate is also 1.25%. We can use Equation 3.3 to calculate the effective
    annual interest rate:

    $i_{year} = (1 + 0.0125)^4 - 1 = 0.0509 = 5.09\%$


    If interest were compounded continuously, we can use Equation 3.7 to compute the
    quarterly and annual interest rates:

    Quarterly: $i_{quarter} = e^{0.0125} - 1 = 0.0126 = 1.26\%$

    Annual: $i_{year} = e^{0.05} - 1 = 0.0513 = 5.13\%$


    ### 3.7.2 Future Value of a Present Sum


    The formulas are useful for calculating the amount of money you will have in the
    future you invest a lump sum of money today such as opening a CD account or buying
    a mutual fund. The lump sum is the initial value, $v_0$. After $n$ interest rate
    periods, the value is $v_n$:


    - Periodic Compounding: $v_n = v_0(1 + i)^n$ (3.6)

    - Continuous Compounding: $v_n = v_0 e^{nr}$ (3.7)


    **Example 3.2.** Continuing from Example 3.1, if you purchased $5,000 of the investment
    product on the day you began college, what will be the value of the investment
    when you graduate four years later? If interest were compounded continuously,
    what would be the value of the investment when you graduate?


    We know that quarterly effective (and nominal) interest rate is 0.0125. Using
    Equation 3.6 with $v_0 = 5000$ and $n = 16$ (as there are 16 quarters in four
    years), we can calculate the value of investment:


    $V_{16y} = 5000(1+0.0125)^{16} = 6099.45$


    Alternatively, we can use effective annual rate for the calculation:


    $V_{4y} = 5000(1+0.0509)^4 = 6098.40$


    The $1 off is due to rounding error in the effective annual rate, which is approximately
    0.05094. In fact, we can prove that using the annual rate must produce the result:


    $V_{4y} = 5000(1+i_{year})^4$

    $= 5000(1+(1+0.0125)^4-1)^4$

    $= 50000(1+0.0125)^4$

    $= 5000(1+0.0125)^{16}$


    Note that the result is same as the formula derived earlier using quarterly rate.


    If interest were compounded continuously, we can use Equation 3.8, with $n=4$
    and $r=0.05$:

    $V_{4y} = 5000e^{4 \times 0.05} = 6107.01$


    Or, we can use quarterly rate $r=0.0125$ with $n = 16$:

    $V_{16y} = 5000e^{16 \times 0.0125} = 6107.01$


    ### 3.7.3 Future Value of an Annuity


    An annuity refers to a stream of fixed amount money paid at the end of each period
    ($t_a$) for a given amount of time. For example, if you deposit $100 at the end
    of each month to an account, it is an annuity with $A=\$100$ and $t_a=1$ month.
    The formulas are useful for calculating the amount of money you will have if you
    save a fixed amount ($A$) per period (e.g., month or year) for a given period
    (e.g., four or twenty years).


