  - '[PAGE 4]


    # Preface


    > > Money is your hope for independence you will never have it. The only real
    security that a man will have in this world is a reserve of knowledge


    -Henry Ford


    If you are struggling with financial challenges of going to college, you are not
    alone. Every year, two thirds of college seniors (about 1.8 million) in the U.S.
    graduate with significant debts. Student loan in the U.S. has surpassed auto loan
    and credit card debt, reaching $1 trillion. To put this in perspective, the U.S.
    GDP in 2011 was $15 trillion.


    The great recession from 2007 to 2009 affected the lives of many, including college
    students. "Sometimes I think going to school is the worst mistake I''ve made",
    commented a recent graduate with $60 thousand in debt. With a historically high
    unemployment rate and a climbing student debt delinquency, the sentiment from
    the comment about financial challenges of college education is not uncommon. The
    recession also changed me, a college professor who teaches programming and computational
    thinking to undergraduate students. It made me believe that financial literacy
    is not special knowledge that only bankers need to have. Every citizen should
    be equipped with financial literacy and necessary skills to better deal with financial
    challenges and manage personal finance.


    This book is the result of my effort to integrate personal financial literacy
    into a programming course, often known as CS in computer science. The book covers
    the basics of object-oriented programming (OOP) using the Java programming language.
    Advanced topics of OOP or software engineering are not included. Thus it is not
    suitable as a reference. Personal finance is used as the application domain. Programming
    exercises and most examples are drawn from this domain.


    While you are learning the basics of programming, you also have the opportunity
    to learn useful concepts of personal finance. It is my hope that you learn both
    at the same time and with great interest.


    Since the best way of learning programming is through practice, numerous exercises
    are included within the text and readers are highly recommended to complete these
    exercises. In addition, three types of exercises are included in the end of each
    chapter: review questions about programming concepts, questions about financial'
  - '[PAGE 5]


    literacy concepts, and programming exercises suitable for homework assignments.
    Each chapter also includes a Financial Literacy section to explain the concepts,
    principles, and calculation formulas needed for programming exercises.


    Even with an intention of integrating financial literacy into programming, the
    coverage of financial literacy topics in this book is not sufficient to substitute
    a personal finance course that provides a systematic treatment to the subject.
    At least, I hope this book will help you learn the basics of programming and become
    interested in using your technical skills to better manage your personal finance.
    You may not become rich because of reading this book, but you will become conscious
    of your own finance and proactively seeks to better manage and grow your wealth
    Happy learning. It is a lifelong joy.


    Hongwei Zhu

    Massachusetts, USA

    January 2013'
