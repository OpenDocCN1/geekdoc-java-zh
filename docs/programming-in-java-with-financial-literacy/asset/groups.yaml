    # Exercise


    Indicate true or false of each of the following expressions:


    ```

    ```

    true && (5>3)

    true || (5>3)

    true ^ (5>3)

    (3<5) ^ (5>3)

    ```

    ```


    Logical operations for (both conditional and Boolean) AND and OR are evaluated
    from left to right. The difference between conditional and Boolean operations
    is that Java uses "short circuit" for conditional operators && and ||, but it
    does not use "short circuit" for Boolean operators & and |. With short circuit,
    the evaluation skips the rest of the operands as soon as it finds out the result
    of the expression. Java stops evaluating as soon as it finds the first false operand
    (because the operation must be false regardless of the rest of the operands).
    For ||, Java stops evaluating as soon as it finds the first true operand (because
    the operation must be true regardless of the rest of the operands). However, as
    mentioned earlier, Java does not use short circuit for & |.


    Let us look at the following example:


    ```

    ```

    if (6<3 && 6/0 < 1) {

    ```

    ```


    Since the first operand, 6<3, is false and the operation must return false as
    long as there is one operand that is false, Java skips the evaluation of the second
    operand. The program will run without the division by zero error. If you replace
    the operator with the Boolean operator &, you will see a runtime error:


    > Exception in thread "main" java.lang.ArithmeticException: / by zero at HelloWorld.main(HelloWorld.java:66)


    The error is produced when evaluating 6/0.

    Remember: error messages can be very helpful in many cases. For example, the above
    error message let us know the type of the error (which is called Exception in
    Java) and the location where the error occurs (line 66 in my test program). So,
    form a habit of studying errors.


