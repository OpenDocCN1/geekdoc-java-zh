  mdcn: "\n\n## 3.3 重复结构\n\n- 你是否注意到在第 2 个月，月复利账户的余额低于日复利账户？为什么？\n- 到了年底，哪个账户的钱更多？在年化利率（APR）相同的情况下，哪种复利频率更好？\n\
    - 如果你有一个储蓄账户，请查看你获得的是什么类型的利。是日复利还是月复利？\n\n### 3.3.2 while 和 do...while 语句\n\n\
    Java 还提供了两个语句来实现重复结构。\n\n- `while` 语句首先检查 `loopContinuationCondition`；如果为真，则执行循环体，流返回再次检查条件。`while`\
    \ 的语法如下：\n```java\nwhile (<loopContinuationCondition>) {\n  <statements>;\n}\n\
    ```\n`while` 语句的体可能会执行零次或多次。\n\n- `do...while` 语句在执行循环体后检查 `loopContinuationCondition`；因此循环体会执行一次或多次。它的语法是：\n\
    ```java\ndo {\n  <statements>;\n} while (<loopContinuationCondition);\n```\n注意，末尾有一个分号。\n\
    \n#### 练习\n- 画出 `while` 和 `do...while` 的流程图。\n- 两个流程图之间的主要区别是什么？\n\n你不能总是将 `while`\
    \ 循环或 `do...while` 循环转换为 `for` 循环，但你可以将 `for` 循环转换为 `while` 循环或 `do...while` 循环：\n\
    \n- for -> while:\n```java\n<initialization>;\nwhile (<loopContinuationCondition>)\
    \ {\n  <statements>;\n  <actionAfterCurrentIteration>;\n}\n```\n\n- for -> do...while:\n\
    ```java\n<loop>;\nif (<loopContinuationCondition>) { //先检查条件\ndo {\n  <statements>;\n\
    \  <actionAfterCurrentIteration>;\n} while (<loopContinuationCondition>);\n}\n\
    ```\n\n现在，`for` 循环与另外两种循环之间存在细微的区别：在 `for` 语句的 `<initialization>` 中声明的变量在语句外部是不可的。相比之下，在\
    \ `while` 或 `do...while` 语句的 `<initialization>` 中声明的变量在循环结束后仍然是可以访问的。我们将在第 4 章学习更多关于变量作用域的知识。\n\
    \n现在，让我们使用模板将列表 3.5 中的 `for` 循环（第 6-10 行）转换为 `while` 循环：\n\n```java\nint i=1;\
    \ // 这是初始化\nwhile (i<=12) {\n  vSimple=v0+(i*r);\n  vCompound=v0+Math.pow(1+r,\
    \ i);\n  System.out.printf(\"%2d$%.2f$%.2f\\n\", i, vSimple,\n  vCompound);\n\
    \  i++; // 当前迭代后\n}\n```\n\n#### 练习\n- 为了验证关于初始化中变量作用域的讨论，尝试在 `for` 循环之后（且在循环体之外）输出变量\
    \ `i`。你是否得到了语法错误？\n- 对 `while` 循环执行相同的操作。输出控制台中显示的 `i` 的值是多少？（应该是 13）。\n\n## 3.4\
    \ 分支语句\n\nJava 提供了三个用于控制结构中的额外分支语句。这些语句的适用构造结构如表 3.1 所示。\n\n表 3.1：控制结构中分支语句的适用性。\n\
    \n| 语句 | 序列 | 重复 |\n|---|---|---|\n| break | ✓ | |\n| continue | | ✓ |\n| return\
    \ | ✓ | ✓ |\n\n简而言之，所有分支语句都可以与重复结构一起使用，而 `return` 语句可以用任何类型的控制结构。`continue` 语句只能用于重复结构，而\
    \ `break` 可以用于选择结构（`switch` 语句内部）和重复结构。在使用这些语句时，必须通过避免在条件测试内部使用分支语句，或将其作为控制代码块的最后一个语句，来避免“无法到达的代码”错误。\n\
    \n`return` 语句使用起来简单：它简单地退出当前方法并返回到调用该方法的控制处。它有两种形式，取决于使用 `return` 的方法的返回类型：\n\n\
    - //如果返回类型为 void\n- return <expression>; // <expression> 与返回类型兼容\n\n我们已经见过 `break`\
    \ 如何在 `switch` 语句中使用以防止意外的穿透（falling through）。它可以用于终止循环。例如：\n\n```java\nfor (int\
