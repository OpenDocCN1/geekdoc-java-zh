    | Type | Size (bit) | Range |

    |---|---|---|

    | byte | 8 | -128 to 127 (i.e., -2⁷ to 2⁷-1) |

    | short | 16 | -32,768 to 32,767 (i.e., -2¹⁵ to 2¹⁵-1) |

    | int | 32 | -2,147,483,648 to 2,147,483,647 (i.e., -2³¹ to 2³¹-1) |

    | long | 64 | -9,223,372,036,854,775,807 to 9,223,372,036,854,775,807 (i.e., -2⁶³
    to 2⁶³-1) |

    | float | 32 | ~/-3.4E38 (6-7 significant digits) |

    | double | 64 | ~/-1.8E308 (15 significant digits) |

    | boolean | - | true/false |

    | char | 16 | Unicode character set \u0000 to \uFFFF |


