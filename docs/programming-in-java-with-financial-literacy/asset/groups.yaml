    ## 2.3. 运算符


    ### 2.3.1.3. 隐式与显式类型转换


    不同的数值数据类型具有不同的值范围。从表 2.1 可以知，范围按照图 2.1 所示的顺序从小到大增加。


    ![](img/d4f7b51b492858346b4c26816c21e311_42_0.png)


    隐式类型转换：在二元算术运算中，如果两个操作数的类型不同，则范围较窄的操作数将在执行操作前转换为另一个操作数的类型。这被称为自动隐式类型转换。在赋值运算符中，如果右侧操作数的类型比左侧操作数的类型窄，则右侧将转换为左侧操作数的类型。以下是执行隐式转换的三个示例：


    ```

    long x = 5 + 2; // x 被转换为 long

    double y = 5 / 2; // y 被转换为 double

    double z = 5 / 3; // z 被转换为 double

    ```


    显式类型转换：由于 Java 会自动执行隐式转换，当隐式转换完全符合你的需求时，你不需要显式地转换类型。否则，你可以使用类型转换运算符显式地转换操作数的类型，该运算符是位于括号中的类型关键字。例如：


    ```

    double y = (double)5/2; // 转换为 double, y=2.5

    ```


    由于 3 被显式转换为 double，因此 2/3 被隐式转换为 double。如果不进行强制转换，结果将是 1.0，因为 3/2 是整数除法。当求值为 1（一个整数）时，它会被隐式转换为
    double。


    在赋值运算符中，如果右侧的类型在范围上比左侧类型宽，则显式类型转换（也称为类型转换或强制转换）是强制的。这在图 2.2 中所示。


    ```

    <wide> var = <narrow>var // 隐式转换

    type var = (narrow)wide // 显式类型转换

    ```


    图 2.2


    例如：


    ## 34 数据类型与运算符


    ```

    double x = 3; // 隐式转换。

    double y = (double)3; // OK，但强制转换是不必要的

    int i = 3.0; // 语法错误。强制要求显式转换。

    int i = (int)3.0; // 显式转换

    ```

