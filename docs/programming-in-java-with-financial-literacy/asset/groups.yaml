    \ multiplies 10 (the * is the multiplication operator). Thus the highlighted is\
    \ an expression that is evaluated to a value between 0 and 10 (not including).\n\
    \nThe (int) is a type casting (also called type coercion) that forces the double\
    \ into an integer value of type int. It simply takes the integer part of the value\
    \ (e.g., 19.9 is evaluated to 19). Then this int value is returned to which calls\
    \ the method.\n\nThe squareNumber method, reproduced, has one argument of type\
    \ int:\n\n```java\npublic static int squareNumber(int number) {\n    return (int)Math.pow(number,\
    \ 2);\n}\n```\n\nWhen the method is called, an int value is passed and in the\
    \ argument variable number is bound to the value. For example, when the method\
    \ is invoked using squareNumber(4), the variable number has a value of 4. In the\
    \ body of the method, the variable is passed to Math class's method as the first\
    \ argument. The numeric literal 2 (which is of type int) is the second argument.\
    \ The pow method returns the value of the first argument raised to the power of\
    \ the second argument. For example, Math.pow(4, 0.5) returns the square root of\
    \ 4. In our code, we use it to return the square of number. Since the pow methods\
    \ return type is double, the squareNumber return type is declared as int, type\
    \ casting is used to convert the double value into an int. Alternatively, the\
    \ method could be implemented without using the following method:\n\n```java\n\
    public static int squareNumber(int number) {\n    return number*number;\n}\n```\n\
    \nThe method, reproduced, does not return anything (hence void is declared as\
    \ its type):\n\n```java\npublic static void show(int number, int result) {\n \
    \   System.out.println(\"Random Number\\t\" + number + \"\\n\");\n    System.out.println(\"\
    Number Squared\\t\" + result + \"\\n\");\n}\n```\n\nIt takes two arguments of\
    \ type int. When the method is called, each of the parameter variables is passed\
    \ to a println method, which takes a single string type of parameter to output\
    \ the string to the output console on its own line. The string is constructed\
    \ using the string concatenation operator, +. Double quotes are used to create\
    \ a string. Special characters called the escape sequence (\\t) or a new line\
    \ (\\n). Numerical values in a string concatenation expression are converted to\
    \ their string representations.\n\nNow, let us use the main method, which is also\
    \ reproduced below:\n\n```java\npublic static void main(String[] args) {\n   \
    \ int number = getNumber();\n    int result = squareNumber(number);\n    show(number,\
    \ result);\n}\n```\n\nIt takes one argument array type, which is used to store\
    \ all potential arguments passed when the program is launched. We do not use any\
    \ argument here, so the program simply ignores them when the program is launched\
    \ with arguments. The first line in the body declares the variable number of type\
    \ int. Then it assigns to the variable a value returned by the getNumber method.\
    \ Note that \"=\" is an assignment operator, the expression on the right is assigned\
    \ to the variable on the left of the operator. Similarly the next line declares\
    \ the variable result and assigns it the value returned by the squareNumber method.\
    \ And lastly, the third line calls the show method and passes the values represented\
    \ by the variables number and result as arguments to the method. Below is the\
    \ output of a run of the program:\n\nRandom Number 4\nNumber Squared 16\n\nNote\
    \ that there is an empty line after each line of output. This is because the print\
    \ method prints the string on its own line, and the string contains a new line\
    \ escape sequence \"\\n\", which instructs the method to create a new line.\n\n\
    ## 1.3.3 Import and Package\n\nCode reuse is enabled through modularization, which\
    \ is accomplished primarily using classes and methods in Java. Packages help organize\
    \ classes and avoid name clashes in decentralized development environment. Code\
    \ reuse facilitate code reuse. Methods can be called as many times as needed.\
    \ For example, you can call the getNumber method multiple times without duplicating\
    \ the code. The benefits will be much more substantial when the method is more\
    \ involved. Methods can also be called from another class. For example, in another\
    \ class you can call getNumber()... Note in this case the method needs to be prefixed\
    \ with the class name and a dot (.).\n\nJava uses packages as a mechanism to maintain\
    \ uniqueness of classes developed by different developers. Two classes with the\
    \ same name but in different packages are distinct because of name spaces. For\
    \ example, if I were to create a Math class and place it in edu.demo package,\
    \ it is indistinguishable from the Math class in java.lang package as their fully\
    \ qualified names are different:\n\nA package usually contains dot-separated identifiers,\
    \ e.g., java.lang. This structure also corresponds to a directory structure where\
    \ the identifier after dot being a sub-directory of the preceding dot. To ensure\
    \ uniqueness, it is suggested that you use domain name in reverse order followed\
    \ by project-specific names. For example, org.apache.parsers is a package for\
    \ XML parser developed by Apache Software Foundation whose domain name is apache.org.\
    \ In the source code, you can declare the package, and this declaration must be\
    \ the first statement in the code, e.g.,\n\n```java\npackage com.mycompany.finance;\n\
    ```\n\nTo access a class in another package, the class needs to be fully qualified\
    \ by prefixing the class with the package name and dot. For example, in the getNumber\
    \ method, we use java.lang to fully qualify the Math class when we invoke the\
    \ random method. To avoid typing long names, you can import the class and use\
    \ it without the package prefix. By default, all classes in java.lang package\
    \ are imported to every Java program that you can directly access. The use of\
    \ package prefix for the Math class is unnecessary. This is demonstrated in the\
    \ squareNumber method:\n\n```java\nreturn (int)Math.pow(number, 2);\n```\n\nLikewise,\
    \ we did not use any prefix when accessing the System class, which is in the java.lang\
    \ package. You can explicitly import a specific class from another package into\
    \ your code. For example, the following code imports the Scanner class in the\
    \ java.util package:\n\n```java\nimport java.util.Scanner;\n```\n\nOr, you can\
    \ import all classes within a package by using a wildcard (*):\n\n```java\nimport\
    \ java.util.*;\n```\n\nThe java.util package contains several dozens of classes.\
    \ Does the use of a wildcard make your compiled program unnecessarily large? The\
    \ java.util package also contains several sub-packages such as java.util.regex\
    \ and java.util.zip. Does the use of a wildcard import classes in sub-packages?\
    \ The answer is No to both questions.\n\nImport classes make them accessible to\
    \ your program. Only the classes in your code will be included in the compiled\
    \ program. The wildcard only makes available classes in the package indicated\
    \ by the prefix. It does not recursively import classes in sub-packages. If you\
    \ need to use classes in sub-packages, you must use an import statement for each\
    \ sub-package.\n\n## 1.4 Financial Literacy\n\nSoon you will begin to write programs\
    \ that address certain aspects of personal finance. This may not seem interesting\
    \ to everybody. But regardless of interest, personal finance goes beyond personal\
    \ wealth. Taking care of one's finance is a matter of personal responsibility.\
    \ Collectively, it is also a matter of social responsibility.\n\nIn this chapter,\
    \ we will look at expenses. For students, college education is perhaps the largest\
    \ expense (and the most important investment). There has been a lot of discussion\
    \ in the media. Let us look at the distribution of the cost of four-year colleges\
    \ in the U.S.\n\n### 1.4.1 Cost of College Education\n\nIn the process of applying\
    \ for colleges, you probably learned that tuition and fees—“sticker prices”—vary\
    \ substantially among colleges. Public colleges that receive funding usually charge\
    \ in-state students at a lower tuition rate than out-of-state students. Many students\
    \ receive grants and financial aid for their college education. As a result, the\
    \ actual cost of a college can be lower than its published “sticker price”.\n\n\
    I assume you know the cost of attending your current college. How does the cost\
    \ compare with other universities in the U.S.? The College Affordability and Transparency\
    \ Center of the Department of Education publishes data of all institutions that\
    \ participate in federal financial assistance programs under Title IV of the Higher\
    \ Education Act of 1965. Their dataset lists tuition and required fees (the sticker\
    \ price) of each college. For public colleges, only in-state tuition and fees\
    \ are listed. The dataset also lists the average “net price” of each college.\
    \ Net price is tuition minus grants and financial aid received by students.\n"
  mdcn: "\n\n## 1.3 Java 基础\n\n随机程序（Random Program）是如何工作的。现在，让我们尝试理解这个随机程序是如何工作的。如果你没有完全理解下面的解释，不要担心。随着我们的不断进行，你会理解得更深。\n\
    \n`get` 方法的体内只有一行代码：\n\n```java\n// 返回 [0, 1] 之间的 double 值\nreturn (int)(java.lang.Math.random())\
    \ * 10 // 返回 [0, 10] 之间的 double 值\n```\n\n下划线部分调用了 Java API 提供的 Math 类中的 `random`\
    \ 方法（该方法没有参数）。该方法从 [0, 1) 范围内（即0 到 1 之间，包含0但不不包含1）随机选择一个值。该值的数据类型是 `double`（具有双倍精度的浮点数）。然后将其乘以\
    \ 10（`*` 是乘法运算符）。因此，高亮部分是一个表达式，其求值结果为0 到 10 之间的某个值（不包括 10）。\n\n`(int)` 是类型转换（也称为类型强制转换），它将\
    \ `double` 强制转换为 `int` 类型的整数值。它简单地取该值的整数部分（例如，19.9 被求值为 19）。然后，这个 `int` 值被返回给调用它的方法。\n\
    \n重现的 `squareNumber` 方法有一个 `int` 类型的参数：\n\n```java\npublic static int squareNumber(int\
    \ number) {\n    return (int)Math.pow(number, 2);\n}\n```\n\n当调用该方法时，会传入一个 `int`\
    \ 类型的值，并将参数变量 `number` 绑定到该值。例如，当使用 `squareNumber(4)` 运行方法时，变量 `number` 的值为 4。在方法体内，该变量被作为第一个参数传递给\
    \ Math 类的方法。数字字面量 2（其类型为 `int`）是第二个参数。`pow` 方法返回第一个参数的第二个参数的幂的值。例如，`Math.pow(4,\
    \ 0.5)` 返回 4 的平方根。在我们的代码中，我们使用它来返回 `number` 的平方。由于 `pow` 方法的返回类型是 `double`，而 `squareNumber`\
    \ 的返回类型声明为 `int`，因此使用了类型转换将 `double` 值转换为 `int`。或者，也可以不使用下面的方法来实现该方法：\n\n```java\n\
    public static int squareNumber(int number) {\n    return number*number;\n}\n```\n\
    \n重现的方法不返回任何内容（因此将其类型声明为 `void`）：\n\n```java\npublic static void show(int number,\
    \ int result) {\n    System.out.println(\"Random Number\\t\" + number + \"\\n\"\
    );\n    System.out.println(\"Number Squared\\t\" + result + \"\\n\");\n}\n```\n\
    \n它接收两个 `int` 类型的参数。当调用该方法时，每个参数变量都会被传递给 `println` 方法，该方法接收单个 `string` 类型的参数，并将字符串单独输出到输出控制台。该字符串是使用字符串拼接运算符\
    \ `+` 构建的。使用双引号来创建字符串。特殊字符被称为转义序列（`\\t`）或换行（`\\n`）。字符串拼接表达式中的数值会被转换为它们的字符串表示。\n\
    \n现在，让我们使用 `main` 方法，它也重现在下方：\n\n```java\npublic static void main(String[] args)\
    \ {\n    int number = getNumber();\n    int result = squareNumber(number);\n \
    \   show(number, result);\n}\n```\n\n它接收一个数组类型的参数，用于存储程序启动时传递的所有潜在参数。我们在这里没有使用任何参数，所以当程序带参数启动时，程序会简单地忽略它们。方法体内的第一行声明了\
    \ `int` 类型的变量 `number`。然后它为该变量赋值了 `getNumber` 方法返回的值。注意 `=` 是赋值运算符，运算符右侧的表达式被赋值给运算符左侧的变量。同样，下一行声明了变量\
    \ `result` 并将其赋值为 `squareNumber` 方法返回的值。最后，第三行调用了 `show` 方法。输出如下：\n\nRandom Number\t\
    4\nNumber Squared\t16\n\n## 1.3 包（Packages）\n\n包（Package）是组织类、接口和注解的机制。使用包可以帮助避免命名冲突，并将相关的类组合在一起。在\
    \ Java 中，包可以使用 `package` 关键字来定义。包语句必须是文件的第一行。\n\n```java\npackage com.example.project;\n\
    ```\n\n使用另一个包中的类可以使用 `import` 关键字。`import` 语句允许使用其他包中的类。\n\n```java\nimport java.util.List;\n\
    import java.util.ArrayList;\n```\n\n如果你想导入包中的所有类，可以使用通配符 `*`：\n\n```java\nimport\
    \ java.util.*;\n```\n\n注意，`import` 语句并不会移动类，它只是告诉编译器去哪里找到类。如果你需要使用两个包中的同名类，可以使用完全限定名（fully\
    \ qualified name）来区分：\n\n```java\njava.util.Date date = new java.util.Date();\n\
    java.sql.Date timestamp = new java.sql.Date();\n```\n\n包还可以是嵌套的。例如，`com.example.project`\
    \ 是 `com.example` 包的子包，`com.example` 是 `com` 包的子包。包的结构通常与文件系统中的目录对应。\n\n```\n\
    com/example/project/MyClass.java\n```\n\n包还可以控制访问可见性。Java 提供了访问修饰符来控制类和成员的可见性：`public`、`protected`\
    \ 和 `private`。\n\n`import java.util.List;\nimport java.util.ArrayList;\nimport\
    \ java.util.*;\n\npackage com.example.project;\n\npublic class MyClass {\n   \
    \ public static void main(String[] args) {\n        List<String> list = new ArrayList<>();\n\
    \        list.add(\"Hello\");\n        System.out.println(list);\n    }\n}\n```\n\
    \n"
