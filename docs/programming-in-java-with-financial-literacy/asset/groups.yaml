    # 1.3 Basics of Java


    APIs: the random and pow methods in the Math class and the println in the PrintStream
    class (accessed from the System class).


    Package and Import Java uses packages to organize code and avoid name clashes
    of programs from different developers (see Java Package box). The Java APIs come
    with numerous packages. The Math and System classes are in the java.lang package.


    # Java Package


    Java uses packages as a space mechanism to maintain uniqueness of classes developed
    by different developers. Two classes with the same name but in different packages
    are distinct because of name spaces. For example, if I were to create a Math class
    and place it in edu.mrzhu.demo package, it is indistinguishable from the Math
    class in the java.lang package as their fully qualified names are different:


    ```

    edu.mrzhu.demo.Math

    java.lang.Math

    ```


    A package usually contains dot-separated identifiers, e.g., java.lang package
    contains java and lang separated by a dot. This structure also corresponds to
    a directory structure where the identifier after dot being a sub-directory of
    the preceding dot. To ensure uniqueness, it is suggested that you use domain name
    in reverse order followed by project-specific names for package name. For example,
    org.apache.parsers is a package for XML parser developed by Apache Software Foundation
    whose domain name is apache.org. In the source code, you can declare the package,
    and this declaration must the first statement in the code, e.g.,


    ```

    package com.mycompany.finance;

    ```


    To access a class in another package, the class needs to be fully qualified by
    prefixing the class with the package name and dot. For example, in the getNumber
    method, we use java.lang to fully qualify the Math class when we invoke the random
    method. To avoid typing long names, you can import the class and use the class
    without the package prefix. By default, all classes in java.lang package are imported
    to every Java program that you can directly access them. The use of package prefix
    for the Math class is unnecessary. This is demonstrated in the squareNumber method:


    ```

    return (int) Math.pow(number, 2);

    ```


    Likewise, we did not use any prefix when accessing the System class, which is
    in the java.lang package.


    You can explicitly import a specific class from another package into your code.
    For example, the following code imports the Scanner class in the java.util package:


    ```

    import java.util.Scanner;

    ```'
  - '[PAGE 27]


    Or, you can import all classes within a package by using a wildcard (*):


    ```

    import java.util.*;

    ```


    The java.util package contains several dozens of classes. Does the use of a wildcard
    make your compiled program unnecessarily large? The java.util package also contains
    several sub-packages such as java.util.regex and java.util.zip. Does the use of
    a wildcard import classes in sub-packages?


    The answer is No to both questions.


    Import classes make them accessible to your program. Only the classes in your
    code will be included in the compiled program. The wildcard only makes available
    classes in the package indicated by the prefix. It does not recursively import
    classes in sub-packages. If you need to use classes in sub-packages, you must
    use an import statement for each sub-package.


    # 1.4 Financial Literacy


    Soon you will begin to write programs that address certain aspects of personal
    finance. This may not seem interesting to everybody. But regardless of interest,
    personal finance goes beyond personal wealth. Taking care of one''s finance is
    a matter of personal responsibility. Collectively, it is also a matter of social
    responsibility.


    In this chapter, we will look at expenses. For students, college education is
    perhaps the largest expense (and the most important investment). There has been
    a lot of discussion in the media. Let us look at the distribution of the cost
    of four-year colleges in the U.S.


    # 1.4.1 Cost of College Education


    In the process of applying for colleges, you probably learned that tuition and
    fees—“sticker prices”—vary substantially among colleges. Public colleges that
    receive funding usually charge in-state students at a lower tuition rate than
    out-of-state students. Many students receive grants and financial aid for their
    college education. As a result, the actual cost of a college can be lower than
    its published “sticker price”.


    I assume you know the cost of attending your current college. How does the cost
    compare with other universities in the U.S.? The College Affordability and Transparency
    Center of the Department of Education publishes data of all institutions that
    participate in federal financial assistance programs under the Title IV of the
    Higher Education Act of 1965. Their dataset lists tuition and required fees (the
    sticker price) of each college. For public colleges, only in-state tuition and
    fees are listed. The dataset also lists the average “net price” of each college.
    Net price is tuition and minus grants and financial aid received by students.
