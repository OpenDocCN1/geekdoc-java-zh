    # 5.5 Financial Literacy


    expenses and put them in a savings account that pays an annual rate of 2.4%. After
    four years, the account will have $2,516.34 as opposed to $2,400 (because your
    money earns interest). The difference between the two budgeting plans are $4,916.34
    richer if you could cut $50 every month and invest the money you have saved. Why
    is the difference more than twice of what you saved? Recall the concepts of liability
    and asset that are introduced in the topic of personal balance sheet. Expenses
    are a form of liability and savings are a form of asset. A person''s net worth
    is total assets minus liabilities. So when you spend and save (or otherwise invest)
    that money, you move it from the liability category to the asset category. This
    makes the difference more than twice of the amount moved. See the table below
    for an illustration of the idea.


    | Asset | Liability |

    |---|---||

    | Baseline budget | L |

    | New Budget | A+2516.34 | L-2400 |


    In the example, A and L are respectively the asset and the liability of the baseline
    case (i.e., no expense reduction). The new budget has additional asset (due to
    savings) and less liability (due to expense reduction). The difference in net
    worth is:


    ```

    ((A + 2516.34) - (L - 2400)) = (A - L) = 4916.34

    ```


    In the hypothetical example, the difference will vary when you have different
    budgets and different interest rates. Your task of this assignment is to write
    a program to compare these different scenarios.


    Implementation Try to reuse created Savings and ExpenseItem classes. The program
    will contain the following classes:


    +   * Savings: reuse existing implementation

    * SavingsWithMonthlyDeposit: subclass of Savings

    * ExpenseItem: reuse existing implementation

    * BudgetComparison: program that compares two budgeting scenarios.


    +   2. Implement a Loan class that can be used to represent different loan accounts.
    Use attributes to represent basic information about a loan: loan amount, interest
    rate, and loan term (i.e., number of years or months to pay the loan). Use methods
    to return useful information such as payment amount, amortization table, total
    payment when the loan is paid off, remaining principal as of given time period,
    etc. Continue from the first exercise, assume that the savings during college
    are used to reduce student loan. Use the class and those in the first exercise
    to develop a program that calculates how much this will help with monthly loan
    payment and total loan payment.'
