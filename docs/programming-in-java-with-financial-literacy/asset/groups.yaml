    # 5.5 Financial Literacy


    Instructor type is desirable because it can handle other cases (e.g, other types
    that also implement the *Instructor* interface)


    The output of the program is shown below:


    | Name: John Smith Major: CS 563.75 |

    | Name: Kate Tabor Degree: MS 1500.00 |

    | Office Hours: 24X7 |

    | Vendor: Food Services, Inc. 12000.00 |

    | Total: 14063.75 |


    # 5.5 Financial Literacy


    As learned in Chapter 2, the liabilities appearing on your personal balance sheet
    are your debts. We distinguish two major categories of debts: short-term (to be
    paid off within 12 months) and long-term. Most students today deal with both categories
    of debts. In this section, let us look at credit card debt (short-term) and student
    loans (long-term).


    # 5.5.1 Credit Cards


    When you pay for a purchase with a credit card, the card issuer lends money to
    you. Each month, the card issuer sends you a bill with the total amount of purchases
    incurred. They usually give you a grace period of 20-25 days (determined by card
    issuer) within which you enjoy the convenience of using a credit card without
    paying any interest or fees on the money "borrowed" from the card issuer. If you
    indeed pay the full amount within the grace period, you enjoy. You also get other
    benefits such as establishing your credit record and get certain rewards that
    issuers use to entice customers. It all sounds good until you start to fall behind
    on payments. What happens if you send in a payment late or do not pay the full
    amount?


    If you miss the deadline, you will be responsible for a financial charge and a
    charge of interest on the money they have lent. If you pay the minimal payment
    indicated on the bill on time, you avoid the financial charge but are still responsible
    for the interest. The interest rates from credit card companies are usually very
    high — 20% or above! Once they charge interest, grace period does not apply to
    you and interest begins to accrue immediately after each purchase transaction.


    If at all possible, always pay credit bills in time, in full! When you have credit
    card debts and other types of long-term debts, chances are that credit card debts
    have much higher interest rates. Pay them off first.'
