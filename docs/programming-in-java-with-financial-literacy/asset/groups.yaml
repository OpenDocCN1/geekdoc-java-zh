    # 5.3 Abstract Class


    The classes we have seen so far are from which you can create instances. We call
    these classes concrete classes. In contract, there are abstract classes from which
    you cannot instantiate objects. Java supports abstract classes to enhance the
    ability of programming with polymorphism.


    Abstract classes appear at top levels of an inheritance hierarchy and are used
    to declare reference variables that refer to objects of concrete subtypes. Through
    abstract classes, we have enhanced capabilities of "polymorphically" processing
    objects belonging to an inheritance hierarchy


    We will continue to use this example to explain how abstract classes work bay
    that a university employs students for various types of on-campus work. Undergraduates
    are paid hourly at an hourly rate, but graduates are paid at a fixed salary. At
    the end of the month, students get paid and we need to figure out the total amount
    for employed students. We will start with a totally new design of the classes,
    in the UML class diagram in Fig. 5.3


    Here, the Student class is an abstract class, as shown by the italic style of
    the class name in the diagram. Any class that has an abstract method (either declared
    within the class or inherited from ancestor classes) is an abstract class. In
    our case, it contains an abstract method payableAmount, indicated by its italic
    font style in the UML diagram. An abstract method is one that only has its declaration
    but does not have any implementation


    The abstract class has two subclasses, Undergraduate and Graduate. Each class
    has its attributes and corresponding getters and setters. Both also provide implementation
    to the inherited payableAmount method.'
