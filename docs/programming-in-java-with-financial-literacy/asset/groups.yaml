    even though it potentially throws exceptions. Now we know these are unchecked
    exceptions. Fig. 6.1 shows that ArithmeticException is an unchecked exception.
    From Java API documentation we know that InputMismatchException is an indirect
    subclass of RuntimeException. Thus it is also an unchecked exception.'
