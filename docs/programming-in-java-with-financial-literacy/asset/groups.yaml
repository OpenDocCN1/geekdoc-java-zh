    \ balance;\nif balance >= 20000\n    interestRate = 0.01325;\nOutput balance and\
    \ interestRate\n```\n\n- Line 4 declares and initializes interestRate.\n- Line\
    \ 5 creates a Scanner object, named input. This built-in class has methods for\
    \ obtaining inputs from the input console or a file.\n- Line 6 prompts the user\
    \ to input account balance.\n- Line 7 declares balance variable and initializes\
    \ it with user input.\n- Lines 8-10: Line 8 checks to see if balance is greater\
    \ than or equal to 20,000. It so, the code in the block enclosed within a pair\
    \ of curly braces gets executed in this program, the block has only one line,\
    \ Line 9, which changes the interestRate to 0.01325.\n- Lines 11 and 12 output\
    \ the balance and interestRate information.\n\nThe syntax for if is...:\n\n```\n\
    if (<boolean_expression>) {\n    // code\n}\n```\n\n## 3 Control Structures and\
    \ Arrays\n\nThe flow of control can be described using a flowchart, see Flowchart\
    \ Symbols. The flowchart for our program is shown in Fig. 3.1. The control is\
    \ generally sequential, from top to bottom with branches: if is less than 20,000,\
