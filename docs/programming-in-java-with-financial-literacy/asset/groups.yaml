    Periodic Compounding: $v_n = A \cdot \frac{(1+i)^n-1}{i} \quad (3.9)$


    Continuous Compounding: $v_n = A \cdot \frac{e^{nr}-1}{r} \quad (3.10)$


    Note that in the above equations, the annuity period $t_a$ is equal to the interest
    rate period. When they are not equal, we need to derive the interest rate for
    $t_a$ period from the given interest rate of a different time period.


    *Example 3.3.* Suppose decide to save $100 a month and invest it in several mutual
    funds that return 15% a year. Estimate the value of this investment in 15 years.


    Annual returns on risky assets such as mutual funds fluctuate over time. To simplify,
    we assume a constant return and the return is realized at year end annually. The
    total amount invested initially is $1,200. Applying Equation 3.9 with $A = 1200$,
    $i = 0.15$, and $n = 15$, we have:


    ```

    $v_{15} = 1200 \cdot \frac{(1+0.15)^{15}}{0.15} = 57096$

    ```


    This investment will have an estimated value of $57,096 in 15 years.


    If you start out an annuity with a lump sum ($v_0$), then the amount after $n$
    interest rate periods can be found by combining Equations 3.6 and 3.9 for periodic
