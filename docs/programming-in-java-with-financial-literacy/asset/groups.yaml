    # Data Types and Operators


    Net worth It measures your wealth as of a given time. From your balance sheet,
    you add up the assets to get your total assets, and you add all the liabilities
    to get your total liabilities. Your net worth is total assets minus total liabilities.
    Net worth distribution tends to be skewed by a small number of the super rich.
    For example, the country''s top 5% wealthy people''s wealth accounts for more
    than 60% of the total wealth of the U.S. Although the U.S. has more than 400 billionaires,
    the average net worth is less than one million dollars and the median is only
    a quarter million. There is a well-known Pareto Principle (also called the 80-20
    rule) that describes this skewed distribution: roughly 80% of the effects come
    from 20% of the causes. For example, 80% of revenue usually comes from 20% of
    the customers, or 80% of the GDP is from top 20% of the richest nations.


    # 2.6.3 Personal Income Statement


    Unlike the Balance Sheet, which gives you a snapshot of your financial position,
    a personal Income Statement describes where your money comes from and where it
    has gone over a time period, such as a month, a quarter, or a year.


    One may have a number of income sources, such as salary, interests and dividends,
    royalty, gifts, and income from investments. It is often useful to estimate income
    taxes and calculate after-tax income.


    One has numerous types of expenses, some of which are recurring on a daily, weekly,
    monthly and annual basis. Annual expenditures include education, housing, food,
    transportation, telecommunication, utility, insurance, medical, entertainment,
    and personal care.


    An example personal income statement is shown in Fig. 2.7.


    Hopefully your total after-tax income exceeds your total expenditures. When it
    is positive, the difference is the amount that you can save or invest. If it is
    negative, you would tap into your savings or accumulate debts.


    # 2.6.4 Financial Ratios


    In addition to balance sheet and income statement, you also need to look at useful
    financial ratios to assess your financial health. Table 2.8 summarizes five frequently
    used ratios. Constructed using the data in balance sheet and income statement,
    these ratios let you know whether you have enough liquidity, whether you have
    too much debt, and whether you are saving enough.


    Now, let us use the formulas to calculate the ratios for Mr. and Mrs. Smith based
    on the data in their Balance Sheet and Income Statement earlier.


