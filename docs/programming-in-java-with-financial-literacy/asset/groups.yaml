    # Balance Sheet for Mr. and Mrs. Smith, 12/31/2012


    | Assets | | Liabilities | |

    | :--- | :--- | :--- | :--- |

    | Monetary Assets | | Current Liabilities | |

    | Cash | $300 | Current Bills | $450 |

    | Savings | $2,000 | Credit Card Debt | $1,300 |

    | Investments | $9,000 | Long-term liabilities | $295,000 |

    | Stocks and Bonds | | Mortgage Loan | $15,000 |

    | Mutual Funds | $3,000 | Home Equity Loan | $800 |

    | Retirement Plans | | Auto Loans | $25,000 |

    | 401(k) and 403(b) | $12,000 | College Loans | $0 |

    | IRAs | $8,500 | Other Debts | |

    | Housing | | | |

    | Primary Residence | $405,000 | | |

    | Automobiles | | | |

    | Car 1 | $2,500 | | |

    | Car 2 | $7,500 | | |

    | Personal Property | | | |

    | Misc. Assets | $1,500 | | |

    | Total Assets | $451,300 | Total Liabilities | $337,550 |

    | Total Net Worth | $113,750 | | |


    Fig. 2.6: Example balance sheet.


    +   3. Retirement plans. These assets include the investments for the purpose
    of retirement. They are often in the form of IRA''s, 401(k), 403(b), and pension
    plans. Most of these plans have certain benefits (e.g., savings, into the plans
    are not taxed until you cash out and the gains are not taxed until you cash out).


    +   4. Housing. If you own your primary residence, the market value of your house
    is an asset even if you still have a mortgage on it. The amount you owe the bank
    will be considered in the Liability section of the Balance Sheet.


    +   5. Personal properties. This category includes all tangible assets you own,
    such as cars, trucks, motorcycles, boats, computers, furniture, jewelry, etc.
    If some of the items have substantial values, they may have their own categories.
    For example, some people would use Automobiles category for cars, trucks, and
    motorcycles.


    +   6. Other assets. This category includes any assets that have not been accounted
    for. For example, the part of business that you own and the value of collectibles.


    Liabilities is a debt that you must repay in the future. It is useful to differentiate
    two types of liabilities based on time horizon:


    +   - Current liability. A debt that must be paid off within 12 months. This category
    usually includes all sorts of bills that you pay within a month upon receipt.
    It also includes all balances you have with credit cards.


    +   - Long-term liability. A debt that is due beyond 12 months. This category
    usually includes a variety of loans, such as car loans, student loans, and home
    mortgages.'
