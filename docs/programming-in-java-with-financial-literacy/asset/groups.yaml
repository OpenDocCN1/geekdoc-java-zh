    \ 23 行。我们无法替换第 11 行来输出头部，因为头部使用了不同的格式化字符串。\n\n### 2.5.2 示例 2：估算课程价格\n\n你的大学购买“大学体验”，其中学术课程是很大一部分。对于这个例子，我们假设你的学费购买了听课的权利，以便我们可以估算每节课的“价格”。列表\
    \ 2.3 中的程序假设学生每年上 10 节课，每门课持续 13 周，每周上授两次课。\n\n![](img/d4f7b51b492858346b4c26816c21e311_55_0.png)\n\
    \n```java\npublic class Lecture {\n    public static void main(String[] args)\
    \ {\n        double tUM=10506, tmc=31380, tTufts=41598; // 三个学院的学费\n        String\
    \ um=\"UMass Lowell\", mc = \"Merrimack College\", tufts=\"Tufts\";\n        int\
    \ coursesPerYear=10;\n```\n\n```java\nint lecturesPerWeek = 2;\nint weeksPerSemester=13;\n\
    double total=0; // 用于计算平均值\nSystem.out.printf(\"%-20s%-10s%-10s%-8s%n\\n\",\n\
    \    \"Annual Cost\", \"Courses\", \"L/W\", \"Lecture\");\n    System.out.printf(\"\
    %-20s%-10f%-10d-%8d%.2f\\n\",\n    uml, tuml, coursePerYear, lecturesPerWeek,\
    \ tuml/coursePerYear/lecturesPerWeek/weeksPerSemester;\n    total += tuml/coursePerYear/lecturesPerWeek/weeksPerSemester;\n\
    \    mc, tmc, coursePerYear, lecturesPerWeek,\n    total += tmc/coursePerYear/lecturesPerWeek/weeksPerSemester;\n\
    \    System.out.printf(\"%-20s%-10f%-10d-%8d%.2f\\n\\n\",\n    tufts, tTufts,\
    \ coursePerYear, lecturesPerWeek, tTufts/coursePerYear/lecturesPerWeek/weeksPerSemester;\n\
    \    System.out.printf(\"%-20s%-10s%-10s-%8s%.2f\\n\",\n    \"Average\", \"\"\
    , \"\", total/3);\n```\n\n示例 1，程序中使用的学费数据是 2010-2011 学年的，检索自教育部。程序产生以下输出：\n\n\
    | College | Annual Cost | # Courses | L/W | Lecture |\n||---|---|---|---|---|\n\
    | UMass Lowell | 10,506 | 10 | 2 | 40.41 |\n| Merrimack College | 31,380 | 10\
    \ | 2 | 120.69 |\n| Tufts | 41,598 | 10 | 2 | 159.99 |\n| Average | | | | 107.03\
    \ |\n\n现在你知道，旷掉一节课不仅会让你课程落后，还会导致金钱损失——这就像是你买了一张演唱会或你喜欢的运动比赛的票，但直接把票扔了更划算。\n\n\
    > 练习\n> 与列表 2.1 中的程序类似，列表 2.3 中的程序存在某些重复。\n\n## 2.6 财务素养\n\n在本节中，我们将讨论财务规划的基础概念，如资产负债表、财务报表，这对管理财务非常重要。\n\
    \n### 2.6.1 财务规划\n\n无论你面临任何财务挑战，财务规划都涉及以下五个步骤：\n\n1.  **评估财务状况**：确定你的财务状况。\n2.\
    \  **设定财务目标**：写下你的财务目标，并设定优先级。\n3.  **制定预算**：制定你的预算，考虑到突发状况。\n4.  **实施计划**：现在就开始行动！\n\
    5.  **审查进度**：监控进度，根据情况变化进行必要的调整。\n\n### 2.6.2 资产负债表\n\n资产负债表描述了个人或家庭的财务状况。它通过汇总你拥有的资产和债务（即负债）来衡量净值。\n\
    \n**资产** 典型的资产包括：\n\n1.  **货币资产**：也称为流动资产，可以很容易转化为现金。包括现金、银行账户。\n2.  **投资**：为了积累财富的投资。包括股票、基金。\n\
    3.  **退休计划**：这些是为了退休的投资。\n4.  **住房**：如果你拥有自有的住房，它的市场价值是一项资产，即使你对其还有抵押贷款。\n5. \
    \ **个人财产**：这一类别包括你拥有的有形物品，例如汽车、摩托车等。\n6.  **其他资产**：尚未计入的资产。\n\n**负债** 是你必须偿还的债务。根据时间期限分为两种：\n\
    \n1.  **流动负债**：在 12 个月内必须支付的债务。包括账单、信用卡债务。\n2.  **长期负债**：在 12 个月后到期的债务。包括抵押贷款、房屋权益贷款、汽车贷款、大学债务。\n\
    \n以下是 Smith 夫妇 2012 年 12 月 31 日的资产负债表示例：\n\n| 资产 | | 负债 | |\n|---|---|---|---|\n\
    | 货币资产 | | 流动负债 | |\n| 现金 | 300 | 账单 | 450 |\n| 储蓄 | 2,000 | 信用卡债务 | 1,300 |\n\
    | 投资 | 9,000 | 长期负债 | 295,000 |\n| 股票和债券 | 3,000 | 抵押贷款 | 15,000 |\n| 共同基金 | 1,000\
    \ | 房屋权益贷款 | 800 |\n| 退休计划 | 8,000 | 汽车贷款 | 25,000 |\n| 住房 | | 大学贷款 | 0 |\n| 主要住房\
    \ | 405,000 | 其他债务 | |\n| 汽车 | | | |\n| 汽车 1 | 2,500 | | |\n| 汽车 2 | 7,500 | |\
    \ |\n| 个人财产 | | | |\n| 其他资产 | 1,500 | | |\n| 总资产 | 451,300 | 总负债 | 337,550 |\n\
    | 总净值 | 113,750 | | |\n\n图 2.6：示例资产负债表。\n\n"
