  mdcn: "\n\n## 5.2 学生贷款\n\n学生贷款与其他类型的贷款不同，它即使提出破产申请也无法免除。一旦你申请了学生贷款，无论发生什么，你都有责任偿还。政府和私人借贷机构提供了许多类型的学生贷款。如果证明了有经济需求，你可能符合政府助贴学生贷款的条件。对于助贴贷款，不收取利息，即使在借款人仍在校期间，利息仍作为本金（即借款金额）的一部分。\n\
    \n学生贷款与其他类型的贷款不同，通常是安排分期付款来偿还的长期债务。通过分期还款，你每月支付相同的金额：其中一部分用于减少本金，其余部分支付给贷款人作为利息。这被称为摊销。在进入摊销计算的细节之前，让我们先讨论一下当你遇到财务困难无法按计划还款时你有哪些选择。你需要与贷款人讨论，看看他们是否提供以下选项：\n\
    \n- 延期（Deferment）是在贷款还款期间临时推迟还款的时间。对于助贴贷款，联邦可能会在延期期间支付你的贷款利息。\n\n- 宽限（Forbearance）是一种安排，允许你在特定时期（最长\
    \ 12 个月）停止付款或减少每月还款额。\n\n请访问 https://studentaid.gov/repay-loans/deferment-forbearance\
    \ 获取更多信息。你还想与贷款人讨论以探索其他选项。\n\n## 5.5.3 摊销\n\n通过摊销，你每次支付的金额是相同的，通常是每月一次。每次支付的利息和本金金额会随时间变化。如图\
    \ 5.5 所示，本金金额随时间增加，而利息金额随时间减少。\n\n每月的还款金额可以使用公式 3.20 计算：\n\n```\nA = \\frac{IV0}{1-(1+i)^{-n}}\
    \ (3.20)\n```\n\n其中 $IV0$ 是贷款金额，$i$ 是月利率，$n$ 是还清贷款的月数。\n\n第一笔付款支付的利息金额为 $Ai$，支付的本金金额为\
    \ $A(1-i)$；第一笔付款后，剩余本金变为 $V0-A(1-i)$。第二笔付款的利息金额根据此剩余本金计算。\n\n## 5.5 财务素养\n\n![](img/d4f7b51b492858346b4c26816c21e311_162_0.png)\n\
    \n图 5.5 每次支付的利息和本金金额随时间的变化。\n\n我们不会推导出计算每笔本金和利息金额的通用公式。相反，以下伪代码描述了如何迭代地完成此操作。\n\
    \n```\nInitialize remainingPrincipal to principal\nbegin loop to count each month\n\
    \  interest = remainingPrincipal * monthlyRate\n  principal = monthlyPayment -\
    \ interest;\n  remainingPrincipal -= principal\nstore or output the calculated\
    \ values\nend\n```\n\n## 财务素养练习\n\n1. 有哪些类型的学生贷款？限制有哪些？提供哪些利率？\n2. 找一个在线贷款计算器来计算学生贷款还款额。你可以使用自己估算的学生贷款金额或国家的平均学生贷款金额。使用任务\
    \ 1 中找到典型利率。\n3. 对于任务 1 中计算的每月还款额，相应的总收入金额是多少？假设典型大学毕业生的税率。\n4. 使用网络查找当前的房贷利率。它们与学生贷款利率相比如何？为什么会有不同？\n\
    5. 使用网络查找学生贷款和房贷的历史利率。准备一张图表来比较这些利率。你从图表中发现了什么？\n\n## 复习题\n\n- 1. 对以下关于 Java 编程语言的每个语句判断对错：\n\
    \na. 当一个类继承父类时，它继承父类中定义的所有属性，包括私有属性（private）。\n\nb. 当一个类继承父类时，它继承父类中声明的所有方法，包括私有方法（private）。\n\
    \nc. 当一个类实现接口时，它继承它的公共成员成员。\n\nd. 一个类可以继承多个类。\n\ne. 一个类可以实现多个接口。\n\nf. 一个接口可以实现另一个接口。\n\
    \ng. 一个接口可以继承多个接口。\n\nh. 人可以实例化一个抽象类。\n\ni. 抽象类可以包含构造函数。\n\n2. 以下带有两个类的代码可以正确编译吗？为什么？\n\
    \n```\npublic class ParentClass {\n    public final void printChecks() {}\n}\n\
    \npublic class ChildClass extends ParentClass {\n    public void printChecks()\
    \ {}\n}\n```\n\n3. 一个名为 A 的类包含了两个抽象方法 m1 和 m2 的声明，且没有返回值。根据描述显示该类的源代码。\n\n4. 类\
    \ AbstractButton 是抽象的。它是 JComponent 类的子类。它实现了了两个名为 ItemSelectable 和 SwingConstants\
    \ 的接口。根据此描述：\n\n- 显示类的声明（即类体开始标记之前的源代码）。\n- 绘制所示的 UML 类图，显示类相关的类和接口。忽略每个类和接口的细节。\n\
    \n## 编程练习题\n\n1. 在此编程练习中，你将在现有类的基础上开发一个用以比较不同预算和储蓄方案的应用程序。\n\n背景：假设你刚刚进入大学，并估算了未来四年的年度开支。你想知道通过削减某些开支可以节省多少钱。实际上，省下的每一分钱都比一美元更有价值，除非你把这些钱存在床垫下。你可以对这些钱进行投资以获得回报。最简单的投资是将钱放在有利息的储蓄账户中。\n\
    \n也许以下假设性示例将帮助你理解这一概念。假设你每月可以减少 50 美元的支出，并将其存入利率为 2.4% 的储蓄账户。四年后，该账户将拥有 2516.34\
    \ 美元，而不是把钱放在床垫下（因为你的钱产生了利息）。如果你每月节省 50 美元并投资这些钱，两种预算计划之间的差异是 4916.34 美元。为什么比你节省的金额多出一倍？回顾负债和资产的概念。支出是负债的形式，储蓄是资产的形式。个人的净资产是总资产减去负债。当你节省并投资时，将其从负债类别转移到资产类别。这使得比转移的金额多出一倍。请看下表说明。\n\
    \n| 资产 | 负债 |\n|---|---|\n| 基础预算 | L |\n| 新预算 | A+2516.34 | L-2400 |\n\n示例中，A\
    \ 和 L 分别代表基础情况（无开支）的资产和负债。新预算增加了资产（由于储蓄）并减少了负债（由于开支减少）。净资产的差异为：\n\n```\n((A +\
    \ 2516.34) - (L - 2400)) = (A - L) = 4916.34\n```\n\n在假设示例中，当你有不同的预算和利率时，差异将会变化。你的作业任务是编写程序来比较这些不同的场景。\n\
    \n实现尝试复用创建的 Savings 和 ExpenseItem 类。程序将包含以下类：\n\n- Savings: 复用现有实现\n- SavingsWithMonthlyDeposit:\
    \ Savings 的子类\n- ExpenseItem: 复用现有实现\n- BudgetComparison: 比较两种预算方案的程序\n\n2. 实现一个\
    \ Loan 类，用于表示不同的贷款账户。使用属性表示贷款的基本信息：贷款金额、利率和贷款期限（即还清贷款的年数或月份）。使用方法返回有用信息，如还款金额、摊销表、还清时的总金额、特定时间的剩余本金等。继续第一个练习，假设大学期间的储蓄用于减少学生贷款。使用该类以及第一个练习中的类开发一个程序，计算这对每月贷款还款和总贷款还款有多少帮助。\n\
    \n"
