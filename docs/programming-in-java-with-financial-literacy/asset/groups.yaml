    "August", "September", "October", "November", "December"};

    int[] daysMonth = {31, 28, 31, 30, 31, 30, 31, 30, 31, 30, 31};

    ```


    The first array is initialized with 12 String elements, and the array is initialized
    with 12 int elements.


    Once an array has been created, its size cannot be changed.


