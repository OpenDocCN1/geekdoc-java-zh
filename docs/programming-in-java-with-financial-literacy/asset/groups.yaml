    - Effective interest rate ($i$). It is the rate at which money grows considering\
    \ compounding. It is expressed as a percentage per period. For example, Annual\
    \ percentage yield (APY) is an effective interest rate per year. It is also called\
    \ \"effective annual rate\".\n\nApparently, with simple interest, nominal interest\
    \ rate and effective interest rate are the same for the same time period.\n\n\
    With a nominal rate of a given time period, $r_1$, it is straightforward to find\
    \ the equivalent nominal rate for any time period, $r_2$. Let $m$ be the number\
    \ of $t_2$ in $t_1$, the formula is:\n\n```\n$r_2 = \\frac{r_1}{m} \\quad (3.1)\n\
    ```\n\nFor example, we can obtain nominal monthly rate from APR. In this case,\
    \ $r_1 = APR, t_1 = 1$ year. For monthly rate, $t_2 = 1$ month. There are 12 months\
    \ per year, thus $m = 12$. Substituting variables in Equation 3.1 with these values,\
    \ we have:\n\n# Nominal monthly interest rate = $\\frac{APR}{12}$\n\nSimilarly,\
    \ assuming there are 365 days in a year, the nominal daily interest rate is APR/365.\n\
    \nGiven nominal interest rate of a time period and the compounding period, we\
    \ can calculate the effective interest rate of any time period. Let us consider\
    \ two simple cases:\n\n- When effective interest rate period is equal to compounding\
    \ period ($t_c$), which is also equal to nominal interest rate period, effective\
    \ interest rate is equal to nominal interest rate:\n\n```\n$i_c = r_c$ (3.2)\n\
    ```\n\n- When interest rate period $t$ has $m$ compounding periods (i.e., $t =\
    \ mt_c$), effective interest rate can be calculated using the following formula:\n\
    \n```\n$i_t = (1 + \\frac{r_t}{m})^m - 1$ (3.3)\n```\n\nNote that $\\frac{r}{m}\
    \ = r_c = i_c$. From Equation 3.3, we can derive the formula to compute APY from\
    \ APR if interest is compounded monthly (i.e., $t_c = 1$ month):\n\n```\n$APY\
    \ = (1 + \\frac{APR}{12})^{12} - 1$ (3.4)\n```\n\nSuppose the initial investment\
    \ is $v_0$, after $n$ interest rate periods, the value of the investment $v_n$\
    \ can be calculated using the following formulas:\n\n```\nSimple Interest: $v_n\
    \ = v_0(1 + n \\cdot r)$ (3.5)\n```\n\n```\nCompound Interest: $v_n = v_0(1 +\
    \ i)^n$ (3.6)\n```\n\n## 3.3.1 The for Statement\n\nAssume you have two accounts\
    \ with the same initial balance and the same APR, one pays simple interest, the\
    \ other pays interest that compounds monthly. Now we write a program to compare\
    \ the monthly balance in each account for the first 12 months. The program in\
    \ Listing 3.5 would accomplish this task.\n\n```java\npublic class ForLoop {\n\
    \    public static void main(String[] args) {\n        double apr=5.0/100, v0=5000,\
    \ vSimple, vCompound;\n        double r=apr/12; // r is monthly rate\n       \
    \ System.out.printf(\"%2s\\t %8s\\t %8s\\n\", \"n\", \"Simple\", \"Compound\"\
    );\n        for (int i=1; i<=12; i++) {\n            vSimple=v0+(i*r);\n     \
    \       System.out.printf(\"%2d\\t%8s\\t%8.2f\\n\", i, vSimple, Compound);\n \
    \       }\n    }\n}\n```\n\nThe program will print the following to the output\
    \ console:\n\n| n | Simple | Compound |\n|---|---|---|\n| 1 | $5020.83 | $5020.83\
    \ |\n| 2 | $5041.67 | $5041.75 |\n| 3 | $5062.50 | $5062.76 |\n| 4 | $5083.33\
    \ | $5083.86 |\n| 5 | $5104.17 | $5105.04 |\n| 6 | $5125.00 | $5126.31 |\n| 7\
    \ | $5145.83 | $5147.37 |\n| 8 | $5166.67 | $5169.12 |\n| 9 | $5187.50 | $5190.66\
    \ |\n| 10 | $5208.33 | $5221.28 |\n| 11 | $5229.17 | $5234.00 |\n| 12 | $5250.00\
    \ | $5255.81 |\n\nLines 3 and 4 declare and initialize necessary variables for\
    \ the calculation. Line 5 prints the header. Lines 6-10 are for-loop.\n\nThe for\
    \ statement provides a convenient way of implementing loops—a block of code executes\
    \ repeatedly as long as a certain condition is met. The syntax for for statement\
    \ is:\n\n```\nfor(<initialization>; <loopContinuation>; <actionsCurrentIteration>)\
    \ {\n    <statements>\n}\n```\n\nIn the parentheses after keyword for, there are\
    \ three expressions, separated by semicolons:\n\n- initialization — the expression\
    \ introduces variables only within the for statement. This expression is evaluated\
    \ exactly once. In our example, i is initialized to 1.\n- LoopContinuation — This\
    \ must be a boolean expression. When the expression is true, the statements in\
    \ the body of for statement are executed and another iteration begins; if not\
    \ the loop terminates (the statements in the body are skipped). This expression\
    \ is evaluated one or more times. In our example, the loop continues if i is less\
    \ than or equal to 12; the condition is evaluated 13 times—it is false on 13th\
    \ evaluation and the loop ends.\n- actionsCurrentIteration — The expression is\
    \ evaluated after the statements have been executed before the start of the next\
    \ iteration. In our example, the expression is to increment $i$ by 1. It is evaluated\
    \ 12 times; after the $12^{th}$ evaluation, $i$ becomes 13.\n\nFrom syntax of\
    \ view, the body of the for statement may contain zero or more statements. Depending\
    \ on the initial and loop continuation, the statements can be executed zero or\
    \ more times. The flowchart for the for statement is shown in Fig. 3.6.\n\n![](img/d4f7b51b492858346b426816c21e311_80.png)\n\
    \nWithin the body of the for statement of our example program, Lines 7 and 8 compute\
    \ the balance after the $7^{th}$ month for simple interest and compound interest,\
    \ respectively. Line 9 outputs the results. These statements are executed 12 times.\n\
    \nAmong the three expressions in the parentheses of the for statement, `initialization`\
    \ and `actionsCurrentIteration` can contain multiple expressions separated by\
    \ commas. For the following code,\n\n```java\nfor (int i=1, j=6; i<j; i++, j--)\
    \ {\n    System.out.println(i+j);\n}\n```\n\nthis initializes two variables; the\
    \ actions after the current iteration increments one variable and decrements the\
    \ other. It will output the sum of the variables three times (the sum is always\
    \ 7). When the body of the for statement is very simple, you can even move statements\
    \ in the body into the third expression. The following code is equivalent to the\
    \ example:\n\n```java\nfor (int i=1, j=6; i<j; System.out.println(i+j), i++, j--);\n\
    ```\n\nNote there is no semicolon after the parentheses.\n\n## Exercise\n\nThe\
    \ following program computes the difference between monthly and daily compounding.\
    \ Intuitively, with the same nominal interest rate, a more frequent compounding\
    \ schedule should be more rewarding. Thus, starting with same balance, an account\
    \ with daily compounding is expected to have a higher balance at year end than\
    \ an account with monthly compounding. The program uses arrays to store the number\
    \ of days in each month (assuming February 28 days). Arrays will be discussed\
    \ later in this Chapter.\n\n```java\npublic class MonthlyVsDaily {\n    public\
    \ static void main(String[] args) {\n        double apr=0.05, balance=5000.00;\n\
    \        double rm=apr/12, rd=apr/365;\n        int[] mdays={31,28,31,30,31,30,31,31,30,31,30,31};\n\
    \        int days=0;\n        double monthly=balance;\n        System.out.printf(\"\
    %s\\t%8s\\t%8s\\n\", \"Monthly\", \"Daily\");\n    }\n}\n```\n\nWhen the program\
    \ runs, it produces the following output:\n\n| Monthly | Daily |\n|---|---|---|\n\
    | 1 | $ 5002.83 | $ 5021.28 |\n| 2 | $ 5041.75 | $ 5040.57 |\n| 3 | $ 5062.76\
    \ | $ 5062.02 |\n| 4 | $ 5083.86 | $ 5082.87 |\n| 5 | $ 5105.04 | $ 5104.49 |\n\
    | 6 | $ 5126.71 | $ 5125.51 |\n| 7 | $ 5147.37 | $ 5147.32 |\n| 8 | $ 5169.12\
    \ | $ 5169.23 |\n| 9 | $ 5190.66 | $ 5190.51 |\n| 10 | $ 5221.28 | $ 5212.60 |\n\
    | 11 | $ 5234.00 | $ 5234.06 |\n| 12 | $ 5255.81 | $ 5256.34 |\n\n- * Implement\
    \ the program.\n- This question is about the += operator. In days += mdays[i-1];\
    \ mdays returns the (i-1)th element in the array. The position count in an array\
    \ starts with 0 (i.e., the first element is the 0th position). When i is 1, mdays[i-1]\
    \ returns the first element of the array. After this line of code is run during\
    \ the first iteration, what is the value of days? What about during the second\
    \ iteration (i.e., when i is 2)?\n"
  mdcn: "\n\n# 3 控制结构与数组\n\n- 你将资金留在账户中的持续时间。\n- 银行支付给你的利率。\n- 利息是单利还是复利，如果是复利，则复利的频率是多少。\n\
    \n**单利** 之前期间产生的利息在未来的期间内不再产生利息。因此，当前期的利息仅基于初始本金。\n\n**复利** 之前期间产生的利息被视为本金并在未来的期间产生利息。因此，当前期的利息基于初始本金加上到目前为止的所有利息。复利操作会将利息转化为本金。这种操作通常按每月或每季度执行。两次复利操作之间的时间被称为复利周期，$t_c$。例如，当计算复利时，复利周期为一个月。利息也可以连续复利。\n\
    \n美国大多数银行提供复利。更广泛地说，当你通过其他工具进行投资时，投资（希望）会以特定的收益率逐增长，产生复利效应。\n\n资金“增长”的速度被称为利率。在通用的投资背景下，它也称为收益率。有两个衡量资金增长情况的指标：\n\
    \n- 名义利率 ($r$)。它是不考虑周期的资金增长率。它以每个周期百分比的形式表示。例如，年化收益率（APR）是每年的名义利率。\n- 有效利率 ($i$)。它是考虑复利后的资金增长率。它以每个周期百分比的形式表示。例如，年化收益率（APY）是每年的有效利率。它也称为“有效年利率”。\n\
    \n显然，对于单利来说，同一时期的名义利率和有效利率是相同的。\n\n对于给定时间段的名义利率 $r_1$，找到任何时间段的等效名义利率 $r_2$ 是简单的。令\
    \ $m$ 为 $t_1$ 中包含 $t_2$ 的数量，公式为：\n\n```\n$r_2 = \\frac{r_1}{m} \\quad (3.1)\n\
    ```\n\n例如，我们可以从 APR 获得名义月利率。在这种情况下，$r_1 = APR, t_1 = 1$ 年。对于月利率，$t_2 = 1$ 月。每年有\
    \ 12 个月，因此 $m = 12$。将这些值代入方程 3.1，我们得到：\n\n# 名义月利率 = $\\frac{APR}{12}$\n\n同样，假设一年有\
    \ 365 天，名义日利率为 APR/365。\n\n给定某个时间段的名义利率和复利周期，我们可以计算任何时间段的有效利率。让我们考虑两个简单的情况：\n\n\
    - 当有效利率周期等于复利周期（$t_c$）时，该周期也等于名义利率周期，则有效利率等于名义利率：\n\n```\n$i_c = r_c$ (3.2)\n\
    ```\n\n- 当利率周期 $t$ 包含 $m$ 个复利周期（即 $t = mt_c$）时，可以使用以下公式计算有效利率：\n\n```\n$i_t =\
    \ (1 + \\frac{r_t}{m})^m - 1$ (3.3)\n```\n\n注意 $\\frac{r}{m} = r_c = i_c$。从方程\
    \ 3.3 中，我们可以推导出当利息按每月复利时，从 APR 计算 APY 的公式（即 $t_c = 1$ 月）：\n\n```\n$APY = (1 +\
    \ \\frac{APR}{12})^{12} - 1$ (3.4)\n```\n\n假设初始投资为 $v_0$，在 $n$ 个利率周期后，投资的价值 $v_n$\
    \ 可以通过以下公式计算：\n\n```\n单利：$v_n = v_0(1 + n \\cdot r)$ (3.5)\n```\n\n```\n复利：$v_n\
    \ = v_0(1 + i)^n$ (3.6)\n```\n\n## 3.3 for 语句\n\n假设有两个余额和 APR 相同的账户，一个按单利计，另一个每月复利。现在我们写一个程序来比较前\
    \ 12 个月每个账户的余额。列表 3.5 中的程序可以完成此任务。\n\n```java\npublic class ForLoop {\n    public\
    \ static void main(String[] args) {\n        double apr=5.0/100, v0=5000, vSimple,\
    \ vCompound;\n        double r=apr/12;\n        System.out.printf(\"%2s\\t %8s\\\
    n\", \"n\", \"Simple\", \"Compound\");\n        for (int i=1; i<=12; i++) {\n\
    \            vSimple=v0+(i*r);\n            System.out.printf(\"%2d\\t%8f\\n\"\
    , i, vSimple, Compound);\n        }\n    }\n}\n```\n\n程序将在控制台打印以下内容：\n\n| n |\
    \ Simple | Compound |\n|---|---|---|\n| 1 | 5020.83 | 5020.83 |\n| 2 | 5041.67\
    \ | 5041.75 |\n| 3 | 5062.50 | 5062.76 |\n| 4 | 5083.33 | 5083.86 |\n| 5 | 5104.17\
    \ | 5105.04 |\n| 6 | 5125.00 | 5126.31 |\n| 7 | 5145.83 | 5147.37 |\n| 8 | 5166.67\
    \ | 5169.12 |\n| 9 | 5187.50 | 5190.66 |\n| 10 | 5208.33 | 5221.28 |\n| 11 | 5229.17\
    \ | 5234.00 |\n| 12 | 5250.00 | 5255.81 |\n\n第 3 行和第 4 行声明并初始化了计算所需的变量。第 5 行打印头部。6-10\
    \ 行是 for 循环。\n\nfor 语句提供了一种方便的循环方法——只要满足某些条件，就会执行代码块。for 语句的语法为：\n\n```\nfor(<initialization>;\
    \ <loopContinuation>; <actionsCurrentIteration>) {\n    <statements>\n}\n```\n\
    \n关键字 for 后的括号中有三个用分号隔开的表达式：\n\n- initialization — 该表达式在 for 语句内部引入变量。该表达式只计算一次。在我们的示例中，i\
    \ 被初始化为 1。\n- LoopContinuation — 这必须是一个布尔表达式。当表达式为真时，执行 for 语句体并开始下一次迭代；否则循环终止（跳过语句体内容）。该表达式计算一次或多次。在我们的示例中，如果\
    \ i 小于或等于 12，循环继续；条件被计算了 13 次——在第 13 次计算时为假，循环结束。\n- actionsCurrentIteration —\
    \ 该表达式在执行语句执行之前计算。在我们的示例中，表达式是将 i 加 1。它计算了 12 次；在第 12 次计算后，i 变为 13。\n\n从语法的角度来看，for\
    \ 语句体可以包含零或多个语句。取决于初始化和循环继续，语句可以执行零次或多次。for 语句的流程图如图 3.6 所示。\n\n![](img/d4f7b51b492858346b426816c21e311_80.png)\n\
    \n在我们示例程序的 for 语句体中，第 7 行和第 8 行分别计算第 7 个月后的单利和复利余额。第 9 行输出结果。这些语句执行了 12 次。\n\n\
    在 for 语句括号的三个表达式中，`initialization` 和 `actionsCurrentIteration` 可以包含多个用逗号隔开的表达式。对于以下代码：\n\
    \n```java\nfor (int i=1, j=6; i<j; i++, j--) {\n    System.out.println(i+j);\n\
    }\n```\n\n这初始化了两个变量；当前迭代后的操作增加一个变量并减少另一个。它将输出三次变量之和（和始终为 7）。当 for 语句体非常简单时，你甚至可以将体中的语句移动到第三个表达式中。以下代码等同于示例：\n\
    \n```java\nfor (int i=1, j=6; i<j; i++, j--) // 示例此处不完整\n```\n\n注意括号后面没有分号。\n\n\
    ## 练习\n\n以下程序计算单利和复利之间的差异。直观地说，对于相同的利率，复利账户在年底时的余额预计会比单利账户更高。数组将在本节后讨论。\n\n```java\n\
    public class MonthlyVsDaily {\n    public static void main(String[] args) {\n\
    \        double apr=0.05, balance=5000.00;\n        double rm=apr/12, rd=apr/365;\n\
    \        int[] mdays={31,28,31,30,31,30,31,30,31,30,31};\n        int days=0;\n\
    \        double monthly;\n        System.out.printf(\"%s\\t%8s\\n\", \"Monthly\"\
    , \"Daily\");\n    }\n}\n```\n\n当程序运行时，它产生以下输出：\n\n| Monthly | Daily |\n|---|---|\n\
    | 1 | 5020.83 | 5021.28 |\n| 2 | 5041.67 | 5040.57 |\n| 3 | 5062.50 | 5062.02\
    \ |\n| 4 | 5083.33 | 5082.87 |\n| 5 | 5104.17 | 5104.49 |\n| 6 | 5125.00 | 5125.51\
    \ |\n| 7 | 5145.83 | 5147.32 |\n| 8 | 5166.67 | 5169.23 |\n| 9 | 5187.50 | 5190.51\
    \ |\n| 10 | 5208.33 | 5212.60 |\n| 11 | 5229.17 | 5234.06 |\n| 12 | 5250.00 |\
    \ 5256.34 |\n\n- 实现该程序。\n- 这个问题关于 `+=` 运算符。在 `days += mdays[i-1];` 中，`mdays` 返回数组中的第\
    \ `i-1` 个元素。在第一次迭代执行此行代码后，`days` 的值是多少？在第二次迭代中（即 `i` 为 2 时）又是多少？\n\n"
