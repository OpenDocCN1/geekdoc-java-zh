    \n在分析和设计阶段，人们经常使用统一建模语言（UML）来记录设计。UML 有多种类型的图。在这里，我们将简要介绍 UML 类图，它可以用于描述类的静态特征及其与其他类之间的关系。在本章中，我们专注于单个类的设计。多个类之间的关系将在下一章中讨论。通过练习，你应该能够为给定的实现制作\
