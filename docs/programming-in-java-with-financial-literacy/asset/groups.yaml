  md: "\n# 3 Control Structures and Arrays\n\nHow would you implement the program\
    \ using the alternative for-loop syntax? See a solution in the information box.\n\
    \n![](img/d4f7b51b492858346b4c26816c21e311_91_0.png)\n\nWe need to use the concept\
    \ \"array of arrays\" - each first element of monthlyBalance is also an array.\
    \ The following provides a solution (replacing the two for-loops in Listing 3.11\
    \ with the following code):\n\n```java\nint i=1;\nfor (double[] row : monthlyBalance)\
    \ {\n    row[0] = b0+(1+i);\n    row[1] = b0+Math.pow(1+r, i++);\n}\nSystem.out.printf(\"\
    %2a\\n%8s\\n%n\", n, \"Simple\",\ni=0;\nfor (double[] row : monthlyBalance) {\n\
    \    System.out.printf(\"%2a\\n%8.2f$%8.2f\\n\", i+1,row[0],row[1]);\n}\n```\n\
    \nNote that in each iteration of the for-loops, the parameter row is a 1-dimensional\
    \ array. We have to use a counter i in the first-loop to compute the value for\
    \ the i-th month (a requirement of the formulas used).\nBut the counter is not\
    \ used in the second for-loop. Note that it is post-incremented when it is used\
    \ in the body of the first for-loop.\n\nYou can make arrays with more than two\
    \ dimensions. The key concept is \"array of arrays\", each element along the first\
    \ dimension is a 2-dimensional array.\n\nFor a multi-dimensional array, the non-atomic\
    \ elements need not have the same length. Let us use an example to illustrate\
    \ this. Suppose that you have two Certificate of Deposit (CD) accounts —one is\
    \ 9-month and the other is 12-month. You can use a 2-dimensional array to store\
    \ the monthly balance for both accounts. The code in Listing 3.12 shows how this\
