    i 中。这两行代码可以简化为上面示例中右侧的一行。在这种情况下，我们还说 i 初始化为 3。


    # 静态类型


    Java 的变量类型机制称为静态类型：(1) 变量必须在使用之前声明；(2) 变量类型之后不能更改，也就是说，同一个变量在同一个作用域内只能声明一次。


