    ## 2.4 格式化输出


    在第 1 章中，我们学习了如何使用 `print` 和 `println` 方法产生控制台输出。在这里，我们将学习如何使用 `PrintStream` 类的
    `printf` 方法（等同于 `format` 方法）来格式化输出。让我们先来看下面的示例：


    ```

    System.out.printf("PI=%8.6f\tE=%8.6f\n", Math.PI, Math.E);

    ```


    你可以将 `format` 替换为 `printf`。代码产生如下输出：


    ```

    PI=3.141593  E=2.71828

    ```


    所示，该方法接受数量参数：第一个是格式化字符串，额外的参数数量与格式化字符串中指定符的数量匹配：


    ```

    System.format("PI=%8.6f\tE=%8.6f", Math.PI, Math.E);

    ```


    `%8.6f` 是一个格式指定符。格式指定符以百分号（`%`）开头，以指示要格式化输出类型的转换字符结束：


    - f: 浮点数

    - d: 整数（也称为“十进制整数”）表示 10 进制

    - s: 字符串


    转换字符之间是可选的标志和其他规范。例如，这里的指定符输出将至少有 8 个字符宽，右对齐（如需左对齐，使用标志 `%-8.3f`），小数点后保留 6 位。正如在第
    1 章中学习到的，`\t` 用于制表符，`\n` 等同于 `\n` 并产生新行。现在我们来看另一个示例：


    ```

    System.out.printf("%s is $%d and tax rate is %.2f%%.\n", "Romney", 22000000, 13);

    ```


    其输出：


    Romney''s income is $22,000,000 and tax rate is 13.00%.


    有三个格式指定符，因此在格式化字符串之后有三个额外的参数：


    1. 第一个指定符是 `%s` —— 需要一个字符串参数。`Romney` 是该字符串参数。

    2. 第二个指定符是 `%d` —— 需要一个整数参数。`22000000` 是整数组。指定符中的逗号是用于特定区域分组字符的标志。如果系统是美国区域，逗号作为千分位分隔符，点号作为小数点。

    3. 第三个指定符是 `%.2f` —— 需要一个浮点数，小数点后保留 2 位。注意 `%%` 有特殊含义，我们需要在格式化字符串中使用两个百分号。`java.util.Formatter`
    类提供了格式输出的完整规范。更多示例可以访问：


    ```

    http://docs.oracle.com/tutorial/data/numberformat.html.

    ```


