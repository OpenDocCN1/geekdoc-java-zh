    else                          if (balance>=20000) {\n  interestRate=0.0135;\n\
    \  else                          if (balance<50000) {\nif (balance>=50000) {\n\
    \    interestRate=0.025;\n    interestRate=0.025;\n  }\n  }\n}\n```\n\nNow, let\
    \ us suppose that the interest rates have more fine-grained tiers with cutoff\
    \ values of $10,000, $20,000, ..., $50,000. It can be tedious and difficult to\
    \ follow when chaining many ...else. Java offers an alternative that is easier\
    \ to use and understand—we will look at this alternative next.\n\n# 3.2.2 The\
    \ switch statement\n\nLet us look at the program in Listing 3.4, which uses a\
    \ switch statement to implement the above mentioned scenario that requires a number\
    \ of branches.\n\n```\nListing 3.4 Calculate interest rate\n4 double interestRate;\n\
    5 Scanner input = new Scanner(System.in);\n6 System.out.println(\"Please input\
