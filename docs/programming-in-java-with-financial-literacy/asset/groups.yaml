  - "[PAGE 140]\n\n# 4.8 Financial Literacy\n\n# 4.8.3 Tax Brackets\n\nNow let us\
    \ look at the step of calculating base income tax using taxable income and tax\
    \ brackets. Different segments of your taxable income are taxed at different rates\
    \ set in the tax brackets. The segments vary by filing status. Table 4.2 lists\
    \ the 2012 tax brackets for different types of filing status.\n\nTable 4.2: U.S.\
    \ Federal Income Tax Brackets\n| Rate | Single | Jointly | Married Filing Separately\
    \ | Head of Household |\n|---|---|---|---|---||\n| 10% | $0+ | $0+ | $0+ | |\n\
    | 15% | $8,700+ | $17,400+ | $8,700+ | $12,400+ |\n| 25% | $35,350+ | $70,700+\
    \ | $35,350+ | $47,350+ |\n| 28% | $85,650+ | $142,700+ | $71,350+ | $122,300+\
    \ |\n| 33% | $178,650+ | $217,450+ | $108,725+ | $198,050+ |\n| 35% | $388,350+\
    \ | $388,350+ | $194,175+ | $388,350+ |\n\nLet us use examples to show how this\
    \ table works. Suppose John is a single individual with a taxable income of $35,000.\
    \ The first $8,700 is taxed at 10%; the remaining amount ($35,000-$8,700=$26,300),\
    \ is taxed at 15%. So, John's base income is $4,815 (=10% × 8,700 + 15% × 26,300).\
    \ His average tax rate is 13.757% (=4,815/$35,000). His marginal tax rate (also\
    \ called marginal tax bracket), i.,e, the rate for his last taxable dollar, is\
    \ 15%. Marginal tax bracket is useful as it tells you how much you will pay if\
    \ you add additional incomes.\n\nThe tax brackets in Table 4.2 also reveals the\
    \ so-called \"marriage penalty\" starting from the 28% bracket. Suppose Alex is\
    \ single and his taxable income is $80,000. Becky and Charlie are married and\
    \ file jointly; the taxable income for each is also $80,000. Below are their base\
    \ income taxes calculated using the tax brackets:\n\nAlex\n\n```\n10% × 8700 +\
    \ \n15% × (35350 – 8700) +\n25% × (80000 – 35350)\n= 16030\n```\n\nBecky and Charlie\n\
    \n```\n10% × 8700 + \n15% × (35350 – 8700) +\n25% × (71350 – 35350) +\n28% × (80000\
    \ – 71350)\n= 16289.5\n```\n\nHere we see that the married couple pays $259.5\
    \ more tax. Their average tax rate (20.362%) and marginal tax rate (28%) are higher\
    \ than those for Alex.\n\n# Exercise\n\nWhat is Alex's average tax rate and marginal\
    \ tax rate?"
