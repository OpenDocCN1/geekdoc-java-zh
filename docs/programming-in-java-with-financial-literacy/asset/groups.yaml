    \ 编程并提高金融素养\n\nJava 是一种广泛使用的编程语言。你可以用它开发几乎任何需要计算的解决方案。随着学生贷款突破 1 万亿美元，高等教育成本不断上升，学生毕业时尚未做好管理个人财务的充分准备，本书重点关注帮助人们学习编程，并利用它开发解决方案来回答个人财务问题，例如：通过关键财务指标衡量我的财务状况如何？我花了多少钱？20\
