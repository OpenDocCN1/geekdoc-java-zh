  - "[PAGE 147]\n\n# Concept and Motivation\n\n# 5.1.1 Inheritance\n\nIn real world\
    \ or in conceptual world, certain things and concepts are related in terms of\
    \ commonalities and distinctions among them. For example, we have a notion of\
    \ \"student\" to refer to all types of students, such as visiting students and\
    \ undergraduate students enrolled in a degree program. A common characteristic\
    \ of all students is that each has a name. An undergraduate is a more specific\
    \ type of \"student\". A distinct characteristic of an undergraduate student is\
    \ that each also has a major. Since undergraduate is also a student, an undergraduate\
    \ also has a name. We model this relationship as an is-relationship, the more\
    \ specific concept (e.g., undergraduate) is a special kind of the more general\
    \ concept (e.g., student). The is-relationship is also known as inheritance because\
    \ the more specific concept inherits characteristics of the more general concept.\n\
    \nIn OOD and OOP, we model concepts as classes with attributes and methods. The\
    \ class corresponding to the general concept is called the parent class or superclass.\
    \ The specific concept is called the child class or subclass. This relationship\
    \ can be more than one level, forming an inheritance hierarchy. For example, a\
    \ double-major undergraduate is a special kind of undergraduate who has two majors.\
    \ These classes are sometimes called ancestor and derived. A superclass is also\
    \ called a base class, and a subclass is also called a derived class.\n\nFrom\
    \ modeling point of view, a descendant inherits all the attributes and behaviors\
    \ of its ancestor classes. It can also optionally have additional attributes and\
    \ behaviors. It can optionally change the inherited behaviors.\n\nOK, all these\
    \ concepts are a bit abstract without an example. What is the use of inheritance\
    \ in a programming? Let us use an example to explain inheritance in the programming\
    \ context.\n\nSuppose for one application, a Student class is created. It has\
    \ only one attribute name, a constructor that initializes the attribute, a getter\
    \ and a setter for the attribute, and a toString method that simply returns \"\
    Name: followed by the instance's name attribute. Let us assume that this simple\
    \ class meets that particular application's needs.\n\n+   Exercise\nCreate the\
    \ UML class diagram for the Student class described above and implement it.\n\n\
    Another need comes up for an Undergraduate class that requires a name attribute\
    \ and a major attribute. Without inheritance, we would have to start from scratch\
    \ and implement something like what is shown in Listing 5.1.\n\n```\npublic class\
    \ Undergraduate {\n    private String name;\n    private String major;\n}\n```"
