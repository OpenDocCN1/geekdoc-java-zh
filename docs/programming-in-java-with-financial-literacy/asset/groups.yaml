    \ 3.4 中程序产生的输出相比如何？\n\n多个 case 标签可以用于标记同一个代码块。当其中一个标签匹配时，流程将进入该块。例如，如果银行为 $60,000\
    \ 到 $80,000 之间的余额提供另一个档，利率为 2.625%，那么你可以将从 28 行开始的代码修改为：\n\n```\ncase 7:\n   \
    \ interestRate=0.02625;\n    break;\ndefault:\n    interestRate=0.0275;\n    break;\n\
    ```\n\n使用 String 和 Enum 等类型的 switch 更多示例可以从 http://docs.oracle.com/javase/tutorial/nutsandbolts/switch\
    \ 找到。\n\n## 3.3 重复结构\n\n再次，我们将使用示例来学习如何实现需要循环或更容易用循环编写的程序。示例计算计息银行账户的余额。如果你不单利和复利的概念，请阅读下方信息框中的背景信息。\n\
    \n# 单利与复利\n\n当你向储蓄账户存款时，你本质上是将钱借给银行。作为回报，银行向你支付利——自动存入你账户的额外资金。换句话说，你的初始存款为你赚钱。让我们考虑一个简单的情况，你用初始存款开设账户，既不存入额外的资金，也不取出资金。你获得的利息金额取决于若干因素：\n\
    \n- 初始存款，也称为本金。\n\n"
