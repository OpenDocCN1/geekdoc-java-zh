    \ Exceptions）\n\n当你进行编程练习时，你可能遇到过这样的情况：代码编译正常，但当你运行程序时，输出控制台中生成了一条错误信息。例如，当你处理数组时，你可能会看到类似下面的错误信息：\n\
    \n```\nException in thread 'main' java.lang.ArrayIndexOutOfBoundsException: 3\n\
    at edu.mrzbu.demo.exception.main(Example.java:5)\n```\n\n这表明你的程序因为运行时遇到了问题而意外停止运行。像上面这样的错误信息对软件开发者很有用，但对最终用户来说可能意义不大。此外，程序在处理预期问题时需要具有足够的健壮性。当程序必须退出时，它应该更优雅地退出。这些可以通过错误处理来实现，在\
    \ Java 中通常称为异常处理。\n\n在本章中，我们将学习如何处理异常以提高程序的健壮性。\n\n## 6.1 异常处理\n\n在本节中，我们将介绍异常处理的基础知识，并展示如何使用它来开发健壮的程序。\n\
    \n### 6.1.1 运行时异常示例\n\n查看列表 6.1 中的示例程序。\n\n![](img/d4f7b51b492858346b4c26816c21e311_167_0.png)\n\
    \n```java\npackage com.demo.exception;\nimport java.util.Scanner;\npublic class\
    \ Example {\n    public static void main(String[] args) {\n        Scanner in\
    \ = new Scanner(System.in);\n        System.out.print(\"Please input an integer:\
    \ \");\n        int divider = in.nextInt();\n        int result = 8/divider;\n\
    \        System.out.println(\"8/\" + divider + \" = \" + result);\n    }\n}\n\
    ```\n\n该程序从用户处读取一个整数并将该整数作为除数。除非用户提供的输入可以解析为 int 且值不为 0，否则程序将正常运行。例如，当输入为 4 时，程序会在输出控制台中产生以下内容然后正常退出：\n\
    \n```\nPlease input an integer: 4\n8/=2\n```\n\n然而，当给定“错误输入”时，程序将突然停止并打印出错误信息。例如，当提供一个双点数值时，它将停止并在输出控制台中显示以下消息：\n\
    \n```\nPlease input an integer: 4.0\nException in thread \"main\" java.util.InputMismatchException\n\
