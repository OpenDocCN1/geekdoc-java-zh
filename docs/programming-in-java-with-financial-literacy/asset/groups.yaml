    # 数据类型与运算符


    Net worth It 衡量的是你在特定时间点的财富。从你的资产负债表来看，你相加所有资产得到总资产，相加所有负债得到总负债。你的净资产等于总资产减去总负债。净资产分布往往由于少数超级富豪而偏斜。例如，该国前
    5% 的富人财富占美国总财富的 60% 以上。尽管美国有超过 400 万亿万富翁，但平均净资产低于百万美元，中位数仅为二十五万美元。有一个著名的帕累托法则（也称为
    80/20 法则）描述了这种偏斜分布：大约 80% 的结果来自 20% 的原因。例如，80% 的收入通常来自 20% 的客户，或者 80% 的 GDP 来自最富有的
    20% 的国家。


    # 2.6.3 个人收入表


    与资产负债表（提供财务状况快照）不同，个人收入表描述了在某段时间内（如一个月、一个季度或一年）你的资金来源来源和去向。


    一个人可能有多个收入来源，如薪水、利息和股息、版税、礼物和投资收益。估算所得税并计算税后收入通常很有用。


    人有许多类型的支出，其中一些是按日、周、月、年循环的。年度支出包括教育、住房、食物、交通、电信、公用事业、保险、医疗、娱乐和个人护理。


