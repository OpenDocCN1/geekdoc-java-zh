    # 2.3 Operators


    The expression is a statement that is evaluated from left to right for all binary
    operators: =, +, -, and. The operands are evaluated for any binary operators except
    the assignment operator (any of the composite assignment operators). Operands
    of assignment operator (composite assignment operators) are evaluated from right
    to left.


    The precedence of an operator determines the order in which it is evaluated relative
    to other operators. Multiplication (*) has a higher precedence than addition (+)
    and subtraction (-). The assignment operators (simple or composite) have the lowest
    precedence. From these precedence rules and the rules of operand evaluation sequence,
    we know that the multiplication operator will be evaluated first; between its
    operands, expression 3 (which is a numeric literal) will be evaluated.


    Addition and subtraction have the same precedence. Which one will be evaluated
    first? In this case, associativity rules determine which evaluated first: assignment
    and unary operators are evaluated left to right, all the other operators are evaluated
    left to right. Therefore, the addition will be evaluated before the subtraction.
    The evaluation order of the four operators is summarized below:


    ```

    int x = 5 + 6 - 2;

    ```


    Thus the result of that is 5 (the result of 11-6) is assigned to variable x.


    Parentheses can be used to override the default associativity. For example,


    ```

    int x = 5 + (6 - 3) * 2;

    ```


    The expression (6-3) will be evaluated first because multiplication (*) has the
    highest precedence in the above statement and (6-3) is the operator''s operand.
    In this case, x is 11.


    Table 2.7 lists the operator precedence in descending order by row. When a row
    has multiple operators, they have the same precedence (this is where associativity
    rules are used to determine the evaluation order).


    Now, let us use another example to help us better understand the rules. It is
    based on the previous example with three numeric literals replaced by an expression:


    ```

    int x = ++y;

    int y = x++ - x;

    ```


    What is the value of x and what is the value of y after the code is evaluated?
    The order of evaluation is illustrated in Fig.2.5. Post increment has the highest
    precedence; there are two of them, and evaluation goes from left to right. The
    third being evaluated is pre-increment. Then multiplication comes next. After
    that, addition is evaluated, followed by subtraction. The results are: x is 4,
    and y is -5. Try the example in your own program.'
