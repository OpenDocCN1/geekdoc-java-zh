- pgno: 183
  md: '# Learn Java programming and improve financial literacy


    Java is a widely used programming language. You can use it to develop solutions
    to just about any problem that requires computation. With student loan crossing
    the $1 trillion mark, higher education cost continuing to rise, and students graduating
    not adequately prepared to manage their personal finances, this book focused on
    helping people learn programming and use it to develop solutions to answer personal
    finance questions, e.g., what is my financial health measured using key financial
    ratios, how much do I spend, how much will college education be 20 years from
    now, how much do I need to invest regularly to help my kids to go to college debt-free.


    The author holds a Ph.D. from MIT and has been a programmer developing systems
    and software products.


    ![](img/d4f7b51b492858346b4c26816c21e311_183_0.png)'
