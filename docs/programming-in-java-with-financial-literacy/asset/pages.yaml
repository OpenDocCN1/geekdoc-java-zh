    Currency type detection and amount extraction use three methods in the built-in
    class: toUpperCase, indexof, and substring. You are encouraged to take a look
    at the JDK documentation for these methods. Briefly, toUpperCase returns a string
    corresponding to the current string with all letters in uppercase; indexof returns
    -1 if the string does not contain the parameter string, or the position (based
    of) the first occurrence of the substring; substring returns the substring starting
    from the first parameter index (excluding) the second parameter index. After obtaining
    the amount position as String, we use the static method parseDouble of the Double
    class to obtain the double value represented by the amount. We use the parseDouble
    method is static because the notation used is class.member, i.e., we do not create
