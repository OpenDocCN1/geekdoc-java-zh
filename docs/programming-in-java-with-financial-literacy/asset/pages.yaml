    \ name) { //Duplicate\n    this.name = name; //Duplicate\n} //Duplicate\npublic\
    \ String getMajor() {\n    return major;\n}\n\npublic void setMajor(String major)\
    \ {\n    this.major = major;\n}\npublic String toString() {\n    return \"Name:\
    \ \" + name + \" //Duplicate\n           + \"Major: \" + major + \";\n}\n```\n\
    \nThe lines of code that have also appeared in the existing Student class are\
    \ marked with \"Duplicate\" in comments. Sure, you can imagine that, over time\
    \ and in a large system containing many related classes, you would see a lot of\
    \ duplicate code all over the place. You can copy the existing code and paste\
    \ it into the Undergraduate class. But even worse is the consistency and maintenance\
    \ nightmare resulted from this copying and pasting. For example, if the Student\
    \ class contains validation code to ensure that the attribute is not null and\
    \ conforms to a certain format, you will have to copy and paste that code into\
    \ the Undergraduate class. If later the code is updated in the parent class to\
    \ accommodate new methods or to correct problems due to implementation bugs, you\
    \ will have to modify the implementation in the Undergraduate class. We know conceptually\
    \ the two classes are related with a is-a relationship, but the two classes are\
    \ implemented as if they were totally unrelated.\n\nInheritance mechanism is designed\
    \ to address these issues.\n\n# 5.1.2 Implementing Inheritance in Java\n\nThrough\
    \ the inheritance mechanism, we can derive a subclass from a parent class. Generally\
    \ speaking, a descendant class inherits all attributes of its ancestor classes;\
    \ that is, you do not need to reintroduce the attributes already declared in ancestor\
    \ classes. A descendant class will inherit all methods with public and protected\
    \ visibility declared in ancestor classes. If it is in the same package as a given\
    \ ancestor class, the descendant class also inherits methods with no visibility\
    \ modifier (as default visibility). The descendant can include new attributes"
