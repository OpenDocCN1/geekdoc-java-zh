    # 4 Classes and Objects


    similar properties and behaviors. An object is an instance of a class. For example,

    we have the notion of "student", which has properties such as "name" and

    major". Properties, also called attributes or fields, describe an object''s state.

    a student also has certain behaviors such as "change name" and "declare or change

    major". Behaviors often modeled as methods or operations, can potentially alter

    an object''s state. Each individual student is an instance of the general notion
    of

    student. For example, students Alice Barton and Charles Doe are instances of

    general notion of student.


    A model (the from object-oriented design) can be implemented in a num-ber of object-oriented
    programming languages. When we implement a model using nJava, a class is implemented
    as a Java class, an object becomes a Java object.

    Table 4.1 summarizes the correspondence of these concepts.


    | Table 4.1: Object-Oriented Design (OOD) and Object-Oriented Programming (OOP)
    |

    |---|---|---|n| Real/Conceptual World | OOD Design | OOP Implementation |

    | The real or conceptual world | A corresponding model | An application or a system
    |

    | Kind (of types) | Class | Class |

    | A "thing" | An "object" | An "object" |

    | Properties | Properties, attributes, fields | Properties, attributes, fields
    |

    | Behaviors | Methods, operations | Methods |


    What do we get from an object-oriented approach? There are a few.

    Primarily, it enables modularization and code reuse. Through modularization,

    can implement a large system using numerous modules as building blocks. These

    modules also make maintenance a lower cost. The implementations in various

    modules can also be reused anywhere within the program or by other programs; in

    latter case, we also say the existing program provides Application Programming

    Interfaces (APIs) to other programs. This brief discussion probably sounds too
    ab-

    st at this point. Do not worry. It will become clear as you learn more about object

    orientation techniques and develop large programs.


    Before we move on to classes and objects, let us compare the

    traditional approach with the OOP approach using an example. Suppose

    we need to table the grades for a group of students and output the average

