  md: '# 1.3 Basics of Java


    APIs: the random and pow methods in the Math class and the println in the PrintStream
    class (accessed from the System class).


    Package and Import Java uses packages to organize code and avoid name clashes
    of programs from different developers (see Java Package box). The Java APIs come
    with numerous packages. The Math and System classes are in the java.lang package.


    # Java Package


    Java uses packages as a space mechanism to maintain uniqueness of classes developed
    by different developers. Two classes with the same name but in different packages
    are distinct because of name spaces. For example, if I were to create a Math class
    and place it in edu.mrzhu.demo package, it is indistinguishable from the Math
    class in the java.lang package as their fully qualified names are different:


    ```

    edu.mrzhu.demo.Math

    java.lang.Math

    ```


    A package usually contains dot-separated identifiers, e.g., java.lang package
    contains java and lang separated by a dot. This structure also corresponds to
    a directory structure where the identifier after dot being a sub-directory of
    the preceding dot. To ensure uniqueness, it is suggested that you use domain name
    in reverse order followed by project-specific names for package name. For example,
    org.apache.parsers is a package for XML parser developed by Apache Software Foundation
    whose domain name is apache.org. In the source code, you can declare the package,
    and this declaration must the first statement in the code, e.g.,


    ```

    package com.mycompany.finance;

    ```


    To access a class in another package, the class needs to be fully qualified by
    prefixing the class with the package name and dot. For example, in the getNumber
    method, we use java.lang to fully qualify the Math class when we invoke the random
    method. To avoid typing long names, you can import the class and use the class
    without the package prefix. By default, all classes in java.lang package are imported
    to every Java program that you can directly access them. The use of package prefix
    for the Math class is unnecessary. This is demonstrated in the squareNumber method:


    ```

    return (int) Math.pow(number, 2);

    ```


    Likewise, we did not use any prefix when accessing the System class, which is
    in the java.lang package.


    You can explicitly import a specific class from another package into your code.
    For example, the following code imports the Scanner class in the java.util package:


    ```

    import java.util.Scanner;

    ```'
