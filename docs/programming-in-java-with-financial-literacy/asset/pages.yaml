  md: '5.4 Interface


    # 5.4 Interface


    Interface is another mechanism that enhances the ability to define inheritance
    hierarchy and implement polymorphism. An interface contains only declarations;
    no implementation for methods is allowed in an interface. The declarations are
    for variables and methods only. Variables are usually used to define constants;
    they are implicitly public, static, and final (meaning that they cannot be changed
    in a class that implements it). All methods declared in an interface are abstract;
    the use of the keyword abstract declaration is optional.


    Interface is declared using the keyword interface:


    ```

    [public] interface InterfaceName

    ```


    Note that we use square brackets to indicate the parts that are optional. A class
    can implement one or more interfaces; it uses the keyword implements and the interfaces
    to be implemented are separated with commas:


    ```

    [public] [abstract] class ClassName [extends Class] implements Interface1, Interface2,
    ...

    ```


    As indicated, a class can subclass from another at the same time of implementing
    one or more interfaces. When a class implements an interface, it establishes a
    relationship between the class and the interface. This relationship is represented
    in UML using with a dashed line and a hollow arrowhead pointing to the interface.


    An interface can extend other interfaces. Recall that a class can extend only
    one other class. In fact, an interface can extend multiple interfaces:


    ```

    [public] interface extends AnotherInterface, AnotherInterface, ...

    ```


    Now let us use an example to illustrate how to use interface for added extensibility
    and code reuse.


    Continue from the last example, let us assume that the application needs to get
    total payable amount to not only students, but also vendors, faculty, and staff.
    We want to handle this requirement with a solution that is as general as possible.
    Our solution is to introduce a Payable interface, move the abstract method payableAmount
    to the interface, let Student and other classes implement the interface. For demonstration
    purpose, a Vendor class is included. To demonstrate that a class can extend a
    superclass and implement one or more interfaces at the same time, we let Graduate
    class implement an Instructor interface that includes an abstract method getOfficeHours


    The UML diagram of the revised design is shown in Fig. 5.4.


    Note that the Student class implements the Payable interface but does not include
    any implementation to the inherited abstract method payableAmount, it must be
    an abstract class, as indicated by the italic font style of the class name.


    With this design, no change is needed for the Student class: indicating that it
    implements the Payable interface and commenting out the payableAmount method declaration
    (it'
