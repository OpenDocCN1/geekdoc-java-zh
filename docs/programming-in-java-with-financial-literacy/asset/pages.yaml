    \n# 3.5.4 Multi-Dimensional Array\n\nAn array can be more than one dimension.\
    \ For example, a table with rows and columns can be represented as a two-dimensional\
    \ array, declared using two pairs of square brackets. The program in Listing 3.11\
    \ demonstrates the use of a 2-dimensional array to do the same thing as the program\
    \ in Listing 3.5; its output is the same as page 70.\n\n```\npublic class TwoArray\
    \ {\n    public static void main(String[] args) {\n        double[] ar=5.0/100,\
    \ b0=5000;\n        double[] r=4/2;\n        double[][] monthlyBalance = new double[12][2];\n\
    \        for (int i=0; i<monthlyBalance.length; i++) {\n            monthlyBalance[i][0]\
    \ = b0*(1+r);\n            monthlyBalance[i][1] = b0*Math.pow(1,i);\n        }\n\
    \        System.out.printf(\"%2s %t %8s %8s\\n\", \"Simple\", \"Compound\");\n\
    \        for (int i=0; i<monthlyBalance.length; i++) {\n            System.out.printf(\"\
    %2s %t%.2f %t%.2f\\n\", i+1, monthlyBalance[i][0], monthlyBalance[i][1]);\n  \
    \      }\n    }\n}\n```\n\nLine 5 defines a 2-dimensional array and creates it\
    \ with a capacity of 12 rows and 2 columns. For a multi-dimensional array, the\
    \ length property reports the size of the first dimension; this is because a multi-dimensional\
    \ array is an \"array of arrays\"; the monthlyBalance is an array with 12 elements,\
    \ each element is an array with two elements. For example, you can query the length\
    \ of the first element (i.e., first row) of the array.\n\nSystem.out.println(monthlyBalance[0].length);\n\
    \nIt will output 2. Here, monthlyBalance[0] refers to the first element of the\
    \ array.\nThe first loop (Lines 6-9) iterates through the array along the first\
