- pgno: 10
  md: '# Chapter 1

    Getting Ready for Java Programming


    > Outstanding student loan debt in the United States is more than $1 trillion.


    # Topics


    +   * Installation of Java Development Kit

    * Installation of Integrated Development Environment

    * Basics of Java programming


    The best way to learn programming in any language is through practice. To practice
    effectively, you need to setup a development environment with which you can write
    and test your programs. In this chapter, we will learn how to install necessary
    software. For Integrated Development Environment (IDE), we will use the open source
    tool Eclipse. We will also look at two simple example programs to understand the
    basics of Java programming.


    There are two steps to get your computer ready for Java programming:


    +   * Install Java Development Kit (JDK) standard edition

    * Install Eclipse


    # 1.1 Installing Java Development Kit


    We will need the Java Development Kit (JDK) to develop and test Java programs.
    The JDK has two major components: (1) a complete Java Runtime Environment (JRE)
    that provides a Java virtual machine and the Java Application Programming'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# 2

    1 Getting Ready for Java Programming


    Interfaces (APIs), and (2) a set of software development tools that can be used
    in command line or through a user friendly Integrated Development Environment
    (IDE) such as Eclipse. With a JRE installed, you can run Java programs on the
    computer. Many computers come with a JRE pre-installed. To develop a Java program,
    you will also need the second component. A computer can have more than one version
    of the JRE or the entire JDK installed.


    Before downloading and installing the JDK, you may want to see if the JDK has
    been installed on your computer. In the command-line console of your operating
    system (OS), issue the command javac -version. If it executes and outputs meaningful
    version information, your system already has a JDK. If it is one of the earlier
    versions, you can still install the latest version, or you may skip the rest of
    the section and go to the next section, Installing Eclipse.


    Example output in Mac OS:


    ```

    $ javac -version

    javac 1.6.0_35

    ```


    The output shows that version 1.6.0 update 35 is on the system


    > The command may fail (by reporting not being able to find the executable file)
    even if the JDK is actually available but not set in the path or environment.
    In this case, you can update the version. Alternatively, since an appropriate
    JDK installation usually sets the variable, you can go ahead and install the latest
    version of the JDK when the command fails.

    To download the JDK, you can search "JDK" on the Web and go to the Java SE Downloads
    site. Or, you can use your Web browser to visit the following URL: http://www.oracle.com/technetwork/java/downloads/index.html

    At that page, click the Download button. Then choose the file for your operating
    system. For Windows and Mac OS, you can use the downloaded installer program to
    install the JDK. As of this writing, the latest JDK version is 7 and the installation-instructions
    for Windows, Mac OS, and Linux can be found at the following websites:


    +   * docs.oracle.com/java/7/docs/websites/install/jdk-installation-windows.html

    * docs.oracle.com/java/7/docs/websites/install/mac-jdk.html

    * docs.oracle.com/java/7/docs/websites/install/linux-jdk.html


    With JDK installed, you can actually start to develop and test Java programs using
    a plain text editor and the tools that come with the JDK. However, I recommend
    the use of an IDE tool that makes tasks a lot easier. In the next section, you
    will learn how to install Eclipse, a popular open source IDE for Java programming.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# 1.2 Installing Eclipse


    There are two alternatives of installing Eclipse. The first alternative is to
    install the Android software development kit (SDK) bundle that includes Eclipse
    and all the other tools for developing Android applications. With this bundle,
    you can develop regular Java programs and programs that run on Android devices.
    Installation instructions for this can be found at

    http://developer.android.com/sdk/index.html

    The alternative is to install Eclipse for now, and add Android software development
    separately later when you are ready to develop Android applications. The installation
    files for Eclipse can be found at www.eclipse.org for each OS, there are several
    versions. We will need the "Eclipse IDE for Java EE Developers". In the rest of
    the discussion, I will assume the use of the second alternative. If you want to
    install the Android SDK separately at a later time, refer to the previously mentioned
    Android SDK website for instructions.

    The Eclipse software comes as a compressed file. Installation instructions for
    different platforms can be found at the download website. In general, you need
    to decompress the file and put the extracted files into a directory. The executable
    file of the program is "Eclipse". You may want to create a shortcut for the application''s
    executable file so that you can conveniently launch the application.


    # 1.2.1 Tour of Eclipse


    When you launch Eclipse, you will be prompted to select a Workspace. See Fig.
    1.1.


    ![](img/d4f7b51b492858346b4c26816c21e311_12_0.png)


    Fig. 1.1: Select or create a workspace.


    A workspace is simply a directory in which all project files are stored. You can
    use any directory that you prefer. If the directory you specified does not exist,
    it will be created for you after you click the OK button. If this is the first
    time you use the workspace, you will see a Welcome screen like the one in Fig.
    1.2.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Getting Ready for Java Programming


    ![](img/d4f7b51b492858346b4c26816c21e311_13_0.png)


    Fig. 1.2 Eclipse is launched with a blank workspace.


    I suggest that you explore Overview and Tutorials offered in this welcome screen.
    If you want to explore them later, you can close this screen (by clicking the
    X on the Welcome tab) or hide it (by clicking the Workbench arrow). You can bring
    up this screen anytime through the Help menu.


    After closing the Welcome screen, you would see the Workbench, which hosts the
    main interface and displays the contents of your workspace. The default configuration
    has a number of Views under a certain Perspective. Fig. 1.3 shows a screenshot
    of an empty workbench under the Java EE perspective. The icon to the left of the
    current perspective allows you to change a different perspective. Now, click it
    and choose ''Java perspective''. You will notice that the views and their layout
    are slightly different under this perspective. For example, the Project Explorer
    is replaced with the Package Explorer view. As you gain more experience with Eclipse,
    you can customize the layout by dragging and dropping a view to a desired location
    as well as adding or removing certain views.


    # 1.2.2 Testing Installation


    Now, let us create a simple HelloWorld program to verify that the installation
    is successful.


    First, we need to create a Java Project. Click the File menu or right-click in
    the Package Explorer view, then choose New, then choose; Java Project. Use the
    wizard to create a Java Project named demo.


    Then, we create a Java class named HelloWorld. In the Package Explorer view, expand
    the demo project folder. Right click the src folder and choose New, Fill in the
    Name textbox and check the checkbox for ''public static void main(String[] args)''
    so that the wizard will produce a stub for this main method. See Fig. 1.4. Click
    the Finish.


    The wizard will generate the source code, save it to a file named HelloWorld.java,
    and open it in the editor, as shown Fig. 1.5.'
