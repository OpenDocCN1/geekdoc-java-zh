    # 3.5.1 Declaring an Array


    Array declaration is similar to variable declaration, except that you need to
    use a pair of square brackets either the type or the variable name. For example,
    to declare an array, daysMonth, that holds the number of days in each month as
    int values, you use one of the following declarations:


    ```

    int[] daysMonth; // type[], or

    int daysMonth[] = var[];

    ```


    The meanings of different parts are shown in Fig. 3.7.


    ![](img/d4f7b51b492858346b4c26816c21e311_87_0.png)


    The data type of daysMonth is int[] — one-dimensional array storing int values.
    It is one-dimensional because there is only one pair of square brackets. All elements
    in the array must be of int type. As mentioned in the beginning of the section,
    the type of daysMonth is a reference type, not a primitive type.


    Of course you can also declare arrays to store elements of reference types, such
    as String, Integer, or any reference types defined in your own application or
    APIs you are using. In this case, any instance of a sub-type of the reference
    type can be stored in the array—this will be discussed in Chapter 5 on the topic
    of polymorphism.


    # 3.5.2 Creating an Array


    When creating an array, the new keyword must be used and the size of the array
    must be indicated. For example, the following statement creates the array daysMonth
    declared previously:


    ```

    daysMonth = new int[12];

    ```'
