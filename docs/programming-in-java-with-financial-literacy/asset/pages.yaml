    \ and you add all the liabilities to get your total liabilities. Your net worth\
    \ is total assets minus total liabilities. Net worth distribution tends to be\
    \ skewed by a small number of the super rich. For example, the country's top 5%\
    \ wealthy people's wealth accounts for more than 60% of the total wealth of the\
    \ U.S. Although the U.S. has more than 400 billionaires, the average net worth\
    \ is less than one million dollars and the median is only a quarter million. There\
    \ is a well-known Pareto Principle (also called the 80-20 rule) that describes\
    \ this skewed distribution: roughly 80% of the effects come from 20% of the causes.\
    \ For example, 80% of revenue usually comes from 20% of the customers, or 80%\
    \ of the GDP is from top 20% of the richest nations.\n\n# 2.6.3 Personal Income\
    \ Statement\n\nUnlike the Balance Sheet, which gives you a snapshot of your financial\
