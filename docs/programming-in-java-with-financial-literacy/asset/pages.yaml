    A final class cannot be extended. This can be useful when you do not want other
    people to subclass from the class. It is declared using the keyword final:


    Some the classes in the Java API are final. For example, the String class and
    all of the wrappers for primitive types are final classes.

    Similarly, a final method in a class cannot be overridden in descendant classes.
    It is declared using the keyword final as well. You can turn an inherited method
    into a final method when you override it anywhere in the inheritance hierarchy.
    From on point, the method cannot be overridden in subsequent classes. For example,
    the Student class inherits from the Guest class. If you declare the final method
    in the Student class, then it can no longer be overridden in the subclass.


    A final variable also declared using the keyword final can be initialized only
    once. The variable can be an attribute of a local variable. For a reference variable,
    the reference to an object cannot be changed after initial assignment, but the
    object''s state can still be changed through operations of the object.


    # 5.1.3 Representing Inheritance in UML Class Diagram


    In UML, the inheritance relationship is represented using an arrow with a hollow
    head pointing from the subclass to the superclass. By convention, the superclass
    is usually above the subclass. Fig. 5.1 shows the UML diagram with the two classes
    and their relationship.


    | Student |

    | name: String |

    | +constructor(name:String) |

    | +getName(): String |

