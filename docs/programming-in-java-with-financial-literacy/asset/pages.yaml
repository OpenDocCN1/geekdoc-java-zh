    There are two types of methods: constructors and non-constructors. Both types

    of methods have a *signature*, which is determined by the combination of method

    name, number of arguments, and the order of arguments in terms of its data types.

    Note that the return data type of a method is not part of its signature. For example,

    the two method signatures (in UML syntax) are different; even though

    they have the same name, the first one has no arguments, the second one has

    arguments:


    +   * setNumbers(): double

    * setNumber(double, maxid): double


    A constructor is a special kind of method that has the same name as the class

