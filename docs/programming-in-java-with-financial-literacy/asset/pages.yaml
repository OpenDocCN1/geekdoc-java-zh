  md: '# 3.7.5 Present Value of an Annuity


    The formulas are useful for calculating the current worth of an annuity. For example,
    they can be used to calculate the current worth of a series of dividends to receive
    periodically in the future.


    Periodic Compounding: $v_0 = A \cdot \frac{1-(1+i)^{-n}}{i}$ \quad (3.14)


    Continuous Compounding: $v_0 = A \cdot \frac{1-e^{-nr}}{e^r-1}$ \quad (3.15)


    Note that the annuity period must be equal to the interest rate period in these
    equations; this is also assumed in the next two equations for perpetuity.


    # 3.7.6 Present Value of a Perpetuity


    A perpetuity is an infinite and constant stream of identical cash flows. The formulas
    are useful for calculating the present worth of infinite number payments in the
    future. For example, using the formulas you can calculate the total worth when
    someone promises to pay you $1 each month forever.


    Periodic Compounding: $v_0 = \frac{A}{i}$ \quad (3.16)


    Continuous Compounding: $v_0 = \frac{A}{e^r-1}$ \quad (3.17)


    > **Example 3.4.** Suppose someone tries to sell you a perpetual annuity that
    pays you $1 a year infinitely into the future. How much are you willing to pay
