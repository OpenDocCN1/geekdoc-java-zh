    # 2.3.2.2 Conditional and Boolean Operators


    These operators are summarized in Table 2.5. The operands must be expressions
    that evaluate to boolean type. The logical negation (!) is a unary operator; all
    the other operators in the table are binary operators.


    | Table 2.5: Conditional and Boolean Operators |

    | Operator | Meaning | Example and Note |

    | ! | Not, negation | !x—true if false; false if x is true |

    | && | CONDITIONAL AND | x && y—true if both x and y are true, short circuit |

    | || | Conditional OR | x || y—true if either x, y, or both are true, short circuit
    |

    | & | Boolean AND | x & y—same as &, except there is no short circuit |

    | ^ | Boolean OR | x ^ y—same as |, except there is no short circuit |

    | ^ | Exclusive OR | x ^y—true only if either x or y is true, short circuit |


    These operators are straightforward, except exclusive OR and "short circuit" need
    some explanation.


    With the conditional OR (e.g., x || y), the expression is true when either operand
    or both operands are true, and it is false when both operands are false. In contrast,
    the exclusive OR operation (e.g., x^y) returns true only when one and only one
    of the operands is true, and it returns false when both operands are true (this
    is where it different from the conditional OR or both of them are false.'
