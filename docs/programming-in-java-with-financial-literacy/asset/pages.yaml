    # 2.3.4 Assignment Operators


    We discussed the assignment operator = in Chapter 1. It is a binary operator that
    requires the left-hand side operand to be a variable, and the right-hand side
    operand can be any expression with a return type compatible with the variable
    type.


    In addition to the simple assignment operator, you can combine an arithmetic operator
    or a bitwise operator with to form composite operator. For example:

    x += y;    x = x + y;


    The shorthand can be used when the variable needs to be updated based on its current
    value, in which case it appears on the right-hand side, along with an operator
    and another expression.


    Composite operators include: +=, -=, *=, /, %, &=, |, ^=, <=, >=, and >>>. Java
    will rewrite the shorthand form to its equivalent simple assignment form for you.
    But the shorthand form is widely used by programmers; once you get used to it,
    it actually has better readability.


    | Exercise |

    What is the equivalent code using simple assignment for the following statement?

    x *= 100;


    # 2.3.5 Precedence and Associativity


    Multiple operators are usually combined to form an expression or a statement.
    Precedence and associativity rules of the Java language are used to determine
    the order of evaluation for expressions with multiple operators. Let us first
    look at an example:


    ```

    int x = 5 + 6 - 3 * 2;

    ```'
