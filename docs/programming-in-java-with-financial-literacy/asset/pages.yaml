  md: '# 2.6 Financial Literacy


    In this section, we will discuss the basics of personal financial planning and
    useful concepts such as personal balance sheet, personal income statement, and
    financial ratios important to managing personal finance.


    # 2.6.1 Financial Planning


    No matter whether you face any financial challenges, it is useful to make financial
    planning as an ongoing process in your life. It involves the following five iterative
    steps:


    +   1. Evaluate Financial Health: Determine your net worth, know where your money
    comes from and where it goes, and use ratios for assessment.

    2. Define Financial Goals: Write down your financial goals of different time frames,
    prioritize them, and estimate the cost of each goal.

    3. Develop a Plan of Action: Develop a budget and investment strategy, build protection
    against unexpected events, and consider impacts of taxes.

    4. Implement Your Plan: Take action, now!

    5. Review Progress: Monitor progress, make necessary adjustments, and repeat the
    process when your status of life has changed.


    Next, we will look at some of the tools that people often use to evaluate their
    financial health.


    # 2.6.2 Personal Balance Sheet


    A personal balance sheet describes a person''s or household''s financial position
    as a given date. It allows you to measure your level of wealth, i.e., your net
    worth, by tabulating all the assets you own and all the debts (i.e., liabilities)
    you owe. An example personal balance sheet is shown in Fig. 2.6.


    **Assets** When assessing assets, include all your possessions regardless of whether
    you owe money on them. Use fair market value for any asset. Typical types of assets
    include:


    +   1. *Monetary assets*. Also called Current Assets. A monetary asset is liquid
    asset, which is either cash or can be turned into cash easily. Monetary assets
    include cash, bank accounts, and money market funds.

    2. *Investments*. Investments are assets with a primary purpose of preserving
    or accumulating wealth. They include common stock, mutual funds, bonds, insurance
    policies with a surrender value, and even real estate purchased not as primary
    residence.'
