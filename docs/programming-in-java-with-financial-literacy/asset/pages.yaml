  md: '# 4.2 UML Class Diagram, Constructors, Getters, and Setters


    ### Online Resource

    You may want to reference Wikipedia entry of "Class Diagram" at

    http://en.wikipedia.org/wiki/Class_diagram


    ### UML Software Tools

    There are numerous software tools for creating UML diagrams. The diagrams in this
    chapter are created using the open source tool Dia. Microsoft Visio has templates
    for UML diagrams. There are also tools that can be integrated into Eclipse as
    plug-ins, with which diagrams and classes are synchronized (which can slow your
    computer a bit). Be in mind, these different tools may not use the same UML syntax
    as in the UML specification.


    ![](img/d4f7b51b492858346b4c26816c21e311_114_0.png)


    Fig. 4.1: UML class diagram for the Student class in Listing 4.1


    A class in a diagram has three parts: name, attributes, and methods. Attributes
    are also called members of a class. The syntax for representing members (except
    constructors) is:


    ```

    <visibility><member> : <data Type>

    ```


    You can think of ":


    Symbols are used to indicate visibility of each member:


    +   + public, the member is visible anywhere

    - private, the member is visible only within the class

    # protected, member is visible within the class and all its subclasses


    In the Student class, the visibility of all members is public, thus they are visible,
    i.e., accessible from anywhere. If we move the main method in Listing 4.1 into
    another class, we will still be able to access all members of the Student class.
    But if we change the attribute members to private and move the main method to
    another class, we will not be able to access the attributes and there we will
    have to modify the program. This will be demonstrated in the next example.'
