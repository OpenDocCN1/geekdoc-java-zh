  md: "# 2.3. Operators\n\n# 2.3.1.3 Implicit and Explicit Type Conversion\n\nDifferent\
    \ numeric data types have different ranges of values. From Table 2.1 know that\
    \ the range increases from small to large according to the order shown in Fig.\
    \ 2.1.\n\n![](img/d4f7b51b492858346b4c26816c21e311_42_0.png)\n\nImplicit Type\
    \ Conversion In a binary arithmetic operation, if two operands are of different\
    \ types, the one with a narrower range will be converted to the type of the other\
    \ operand before performing the operation. This is called automatic implicit type\
    \ conversion. In an assignment operator, if the type of the operand on the right-hand\
    \ side is narrower than the operand on the left-hand side, the right-hand side\
    \ is converted to the type of left-hand side. Below are three examples where implicit\
    \ conversion is performed:\n\n```\nlong x = 5 + 2; // x is converted to long\n\
    double y = 5 / 2; // y is converted to double\ndouble z = 5 / 3; // z is converted\
    \ to double\n```\n\nExplicit Type Conversion Since Java performs implicit conversion\
    \ automatically, you do not need to explicitly convert the type when implicit\
    \ conversion does exactly what you needed. Otherwise, you can explicitly convert\
    \ the type of an operand using the type casting operator, which is the type keyword\
    \ in a pair of parentheses. For example:\n\n```\ndouble y = (double)5/2; // converted\
    \ to double, y=2.5\n```\n\nSince 3 is explicitly converted to double, 2/3 is implicitly\
    \ converted to double. Without the casting, the result would be 1.0 because 3/2\
    \ is integer division. When evaluates to 1, which is an integer, is implicitly\
    \ converted to double.\n\nExplicit type conversion, also called type casting or\
    \ coercion, is mandatory in an assignment operator if the type on the right-hand\
    \ side is wider in terms of than the type on the left-hand side. This is illustrated\
    \ in Fig. 2.2\n\n```\n<wide> var = <narrow>var // implicit casting\ntype var =\
