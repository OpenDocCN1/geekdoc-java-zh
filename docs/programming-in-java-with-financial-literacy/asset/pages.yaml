  md: '# 1.3.2 Class, Method, and Data Type


    A method can be invoked anywhere, even from other programs. A static method is
    a member of the class (more on this later). When return data type is void, the
    method does not return anything. Argument list is a list of arguments (also called
    parameters); each argument is declared using data type followed by a variable.
    The main method has one argument (named args), whose data type is an array of
    Strings.

    Method Body The body of the method is enclosed within a pair of curly braces.
    Methods are implemented to carry out certain tasks. In the HelloWorld example,
    the main method prints out a string to the console.

    The preceding discussion introduces quite a few concepts. You may feel overwhelmed,
    but do not worry. They will be further explained and you will have ample opportunities
    to practice with these concepts throughout the rest of the book.


    In this section, we will use another program to explain the basics of Java programming.
    The example program is shown in Fig. 1.10. The program has one class, named Random.
    It includes four methods and several data types. When the program runs, it generates
    a random integer between 0 and 9 (by calling the getNumber method), squares it
    (by calling the squareNumber method), and prints the two values (by calling the
    show method).

    Let us look at these concepts here.


    As stated earlier, a Java program consists of one or more classes. A class is
    declared using the class keyword. Class name can be any valid identifier ("Syntax
    for Java Identifier" box for syntax). For example, $test can be used as a class
    name, but it is not a good one and should be discouraged. When naming identifiers
    (for classes, methods, and variables), try to follow the naming convention and
    choose meaningful names. Naming convention is not something required or enforced
    by a programming language, rather, it is a common practice preferred by most programmers.
    The naming convention suggests that a class name should use mixed cases with the
    first letter of each word in upper (e.g. Random, HelloWorld). Acronyms should
    be in upper cases (e.g., IOException, where IO stands for Input/Output).


