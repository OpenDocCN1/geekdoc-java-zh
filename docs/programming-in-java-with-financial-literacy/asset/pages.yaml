    \ elements?\n\n# 4.5 Method Overload\n\nA class can have multiple methods with\
    \ the same name but different signatures; this is known as method overload. Recall\
    \ that a method's signature is determined by the combination of method name, number\
    \ of arguments, and the order of arguments in terms of their data types; the return\
    \ data type is not part of the signature, nor are the names of the class. Any\
    \ method can be overloaded; this includes the constructor of a class.\n\nMatching\
    \ Method When invoking overloaded methods, only one of them is the matching method\
    \ and will be invoked. To find the matching method, Java first tries to find the\
    \ exact match in terms of signature. If one is found, it is the matching. Otherwise,\
    \ it will incrementally widen the parameter types of the caller to find a match:\
    \ for primitive type, it tries the next wider type according to the order shown\
    \ in Fig. 2.1 on page 33; for reference type, it tries the next supertype in the\
    \ inheritance hierarchy (inheritance will be discussed in the next chapter).\n\
    \nSome of the concepts may not be clear to you based on the above description.\
    \ So let us use an example to illustrate these concepts. The following example\
    \ (List 4.7 and 4.8) contains overloaded constructors and overloaded methods in\
