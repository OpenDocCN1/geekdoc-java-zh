  md: "# 2.2 Reference Data Types\n\n# 2.1.1 Literals and Data Types of Numeric Literals\n\
    \nA literal is the source code representation of a fixed value of primitive data\
    \ type. For example, true and false are booleans. `\\u0597d` is a char literal.\n\
    \nRecall that there are four types of integers and two types of floats. A numeric\
    \ literal depends on the value and the format of the literal. Integer literals\
    \ are generally considered to have the type `int`. If the integer value falls\
    \ within the range of byte or short, it can be interpreted as a byte or a short,\
    \ needed:\n\n```\nbyte i = 127; // the type of 127 is byte\nshort j = -3268; //\
    \ the type of -3268 is short\n```\n\nIf you need to make an integer literal of\
    \ type long, you need to add the letter L (or the lowercase l) to the end of the\
    \ literal, e.g.\n\n```\nlong small = 127L; // L is optional, an int can be\n \
    \            converted to a long as needed\nlong large = 2147483648L; // L is\
    \ needed as the value\n             exceeds the range of int\n```\n\nFloating\
    \ literals are of type double. For example, 1.0 and 78.5 are double literals.\
    \ When you only have the dot and the decimal point, the literal (e.g., `I.`) is\
    \ of type double. If you want to make a numeric literal double, you need to add\
    \ the letter D (or d) to the end of the literal. For example, 30d, 1d, and 12.5d\
    \ are all double literals. Since any numeric literal with the decimal point is\
    \ of type double, if you need to make its float, you must add the letter F (or\
    \ f) to the end of the decimal value. For example, 2.F and 2.5f are of type float.\n\
    \n# 2.2 Reference Data Types\n\nReference data types are also called aggregate\
    \ data types. A variable of reference data type refers to an object. A reference\
    \ type can be defined using a Java `class`, a Java `interface`, or an array. Whenever\
    \ you create a class in Java, that class is a data type. For example, you have\
    \ seen two classes in Chapter 1: HelloWorld and Random. They are two reference\
    \ data types; therefore, you can declare these of types, e.g.\n\n```\nHelloWorld\
    \ var; // declare variable var of type HelloWorld\nRandom var2; // declare variable\
    \ var2 of type Random\n```\n\nInterface is a special kind of class to be discussed\
    \ in Chapter 5. We will look at arrays in Chapter 3.\n\nThe number of reference\
    \ data types is essentially unlimited without an arbitrary number of classes,\
    \ interfaces, and arrays can be created.\n\nThe Java APIs include a reference\
    \ data type for each primitive data type. These classes, also called wrapper classes,\
    \ are in the `java.lang` package and use useful methods such as converting between\
    \ primitive values and String representations."
