    \ }\n}\n```\n\nNote the declaration in Line 6. To make the type to compile, the\
    \ declared exception type can be any subtype of the type (e.g., IOException).\
    \ However, it is better to be specific about the type of the exception. Multiple\
    \ types (comma separated) can be declared if the method throws multiple types\
    \ of exceptions.\n\n# 6.3 Throwing Exceptions\n\nIn addition to handling exceptions,\
    \ you can also throw exceptions in your program. It is sometimes needed to inform\
    \ the consumers of your methods that a problem has occurred and provide information\
    \ about the problem. You can throw either a checked exception or an unchecked\
    \ exception. If the problem must be handled by the consuming component, consider\
    \ to throw a checked exception. You can define your own exceptions by subclassing\
    \ the exception-related classes in the APIs.\n\nLet us use an example to illustrate\
    \ this idea. Recall in Chapter 4, the grade attribute of the `Student` class in\
    \ Listing 4.2 (page 107) should be non-negative. One way to enforce this requirement\
    \ is to throw an exception when the consuming application attempts to give grade\
    \ a negative value. We can define an exception specific to this problem. There\
    \ are two choices: we can make it a checked exception by subclassing the Exception\
    \ class, or we can make it an unchecked exception by subclassing the RuntimeException.\
    \ Let us take the first approach and Listing 6.6\n\n![](img/d4f7b51b492858346b4c26816c21e311_174_0.png)\n\
    \n```\npackage edu.mzhu.demo.exception;\npublic class NegativeGradeException extends\
    \ Exception {\n    public String getMessage() {\n        return \"grade < 0, but\
    \ it must be non-negative\";\n    }\n}\n```"
