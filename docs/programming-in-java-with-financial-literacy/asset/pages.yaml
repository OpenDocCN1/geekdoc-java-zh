  md: '# 3 Control Structures and Arrays


    Each case label serves as a potential entry point of the flow, depending on the
    value following the label—it is the entry point if the value matches that of the
    expression after switch. For example, in the example program, if the user enters
    3600 for balance, the flow goes to the block labeled by case 3 (because the integer
    division is 3), where Interstate is 0.015. After that, there is a break statement,
    which sends the flow directly to the end of the switch statement, skipping the
    rest of the code within the statement. What if the flow jumps from the break point
    to the end of the switch statement. What if the break point in Line 21 was not
    used?


    # Exercise


    +   1. Draw the flowchart in Listing 3.4.

    2. Implement the program in Listing 3.4-simply type in the code into the main
    method of a class. To import java.util.Scanner. Run the program with 36000 as
    input. The interest rate for this input should be 1.50%. Does your program output
    the correct interest rate?

    3. Now, come out the break statement in the block of case 3—Line 21 in Listing
    3.4. Save the file, and re-run the test with 36000. What interest rate do you
    output?


    The label within of a switch statement is used to identify an entry point of the
    flow; once the flow enters, it continues until it encounters a break statement
    or the switch statement. If you want to include a break statement at the end of
    each case-labeled code block, execution will fall through all statements from
    that label, regardless of the remaining labels. Thus, when the break statement
    (Line 21) is encountered, the flow of execution will continue until Line 24. In
    this case, interestrate is updated to 0.02 (Line 23), so the program will output
    2.000% as the interest rate for any balance between 30000 (inclusive) and 50000
    (exclusive).


    The labels are searched sequentially until a matching one is found. If none is
    found, the flow goes to the block labeled default; if default is not present,
    the switch statement finishes execution. In our example program, the default block
    will make interest rate to 2.5% for any balance $60,000. The break statement in
    the default block is optional if the next line is the end of the switch statement
    anyway.


    Any program using the switch statement can be implemented by chaining if...else,
    but not the other around. When you can implement your program using each statement,
    you need decide which one to use. Here are a few guidelines that may be useful
    to you:


    +   * In general, a switch statement with many branches is more readable than
    chaining many if...else statements

    * When different cases can be treated as treating a limited number of data elements,
    it may be better to use switch for readability. If the cases are concerned with
    ranges and cannot be converted to testing a limited number of data elements, then
    you have to use if...else'
