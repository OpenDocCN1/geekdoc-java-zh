  md: "# 3.4 Branching Statements\n\nBriefly, all branching statements can be used\
    \ with a repetition structure, and a return statement can be used in any type\
    \ of control structure. The continue statement can be used in a repetition structure\
    \ only, while the break can be used in selection structure (within a switch statement)\
    \ and repetition structure. When using these, the \"unreachable code\" error must\
    \ be avoided by avoiding the branching statement within a conditional test or\
    \ using it as the last statement in the control's code block.\n\nThe return statement\
    \ is the simplest to use: it simply exits the current method and returns to the\
    \ control over which the method was invoked. There are two forms, select depending\
    \ on the return type of the method within which return is used:\n\n+   * //if\
    \ return type is void\n* return <expression>; //expression> compatible with return\
    \ type\n\nWe have seen how break is used in the switch statement to prevent execution\
    \ falling through unintended statements for other branches. It can also be used\
    \ to terminate a loop. For example:\n\n```\nfor (int i=1; i<=6; i++) {\n    if\
    \ (i==3) break;\n    System.out.print(\"1+\"+i);\n}\n```\n\nalthough the loop\
    \ was set to iterate six times, when i reaches 3, the break statement terminates\
    \ the loop. Thus only 1 and 2 are printed in the output console.\nThe continue\
    \ statement will control the flow to skip the rest of the statements in the current\
    \ iteration. For example, in the example above, where break is replaced with continue,\
    \ the program will skip Line 3 when i is 3. Therefore, the program will print\
    \ 1, 2, 4, 5, and 6.\n\nThe break and continue we have used so far are the unlabelled\
    \ version. They only affect the loop that contains the statement. For example,\
    \ nested loops, if the inner loop contains a break statement, it terminates the\
    \ inner loop each time the break statement executes. Let us use the following\
    \ example to illustrate how this works:\n\n# Example 2\n\n```\nfor (int i=1; i<=6;\
    \ i++) {\n    for (int j=1; j<=i; j++) {\n        System.out.printf(\"%2d\",i*j);\n\
    \    }\n\n    System.out.println(\"\\n\\ // new line for each outer-loop\n   \
    \ iteration\n}\n```\n\nThe code has a nested loop: the outer loop uses i as a\
    \ counter and has six iterations; the inner loop uses j as a counter and has i\
    \ iterations. The multiplication of i and j is printed. When it executes, it outputs\
    \ the following multiplication table:"
