    \ 29;\n```\n\nGiven the array daysPerMonth in Listing 3.10, how do you calculate\
    \ the total number of days?\nYes, you can add the elements: daysPerMonth[0]+daysPerMonth[11].\
    \ Although it is not too bad with 12 elements, you will write a lot of code for\
    \ larger arrays (e.g., with hundreds or thousands of elements).\nA better alternative\
    \ is to use a for-loop:\n\n```\nint daysPerYear = 0;\nfor (int i = 0; i < daysPerMonth.length;\
    \ i++) {\n    daysPerYear += daysPerMonth[i];\n}\n```\n\nLine 1 creates a counter\
    \ variable and initializes it to 0. Then in the loop, the variable i is used as\
    \ an index to access one element in each iteration. The counter accumulates the\
    \ sum of all elements accessed through 12 iterations. The loop continuation condition\
    \ is less than (<) the array's length, not less than equal to (<=). This is because\
    \ the index starts from 0. If you used the latter, you would get an ArrayIndexOutOfBounds\
    \ runtime error.\n\n> Exercise\nWrite a program that creates the arrays as in\
    \ Listing 3.10 and outputs the name and the number of days of each month using\
    \ a format like the:\nJanuary 31\nFebruary 28\n...\nDecember 31\n...\nYour program\
    \ should use just one for statement. You will find the printf method useful.\n\
    \nSince the JDK JSE 5.0, there has been a for statement to iterate through elements\
    \ of array (or a collection) without using index. Its syntax is illustrated in\
    \ the following code that computes the number of days in a year:\n\n```\nint daysPerYear\
    \ = 0;\nfor (int days : daysPerMonth) {\n    daysPerYear += days;\n}\n```\n\n\
    It uses a parameter, days, of type int, to bind to an array element in each iteration.\
