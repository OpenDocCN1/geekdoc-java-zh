  md: '# Savings


    model a typical account. Savings focus on Certificate of Deposit (CD) accounts
    which require an initial deposit for some number of months and your deposit grows
    at a fixed interest rate. Interest is compounded monthly. It is desirable to query
    account balance or growth by monthly balance. How would you close such an account?
    What methods do you want to use at the end of the account?


    For any given scenario, there is usually more than one design. Here we show the
    UMI diagram of one design; see Fig. 4.4 that meets the requirements.


    | name | type |

    | --- | --- |

    | String | String |

    | balance | double |

    | length | int |

    | interest | double |

    | accounts | double |

    | months | int |


    Fig. 4.4: UMI diagram for savings (CD) accounts.


    In this design, the class has four attributes to represent an account''s name,
    initial balance and the annual percentage rate (the nominal annual interest rate).
    We do not need an attribute for balance of any other attribute because this can
    be calculated from the known state of every account. We do not need an attribute
    to store the monthly balance because we do not store information that can be derived
    from an object''s state; you will have redundant attributes if you do so (e.g.,
    when balance is updated, the redundant attribute stores poorly calculated results
    and will have lost information.


    The constructor has four arguments, one for each of the attributes; getters and
    setters for the attributes; the class has two other methods. The method getBalance
    returns the account balance at the end of the given number of months since the
    initial deposit. The method getMonthlyBalances returns an array storing monthly
    balances of each month since the initial deposit.'
