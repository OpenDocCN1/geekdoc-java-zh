    examples here.


    An increment or a decrement operation alone can be a statement. For example,


    ```

    int x = 10;

    x++; // post-increment as a statement

    ++x; // pre-increment as a statement

    ```


    Note that in the example and many other examples in the book, comments in source
    code are used sparingly as explanations to the code.\ Increment and decrement
    can also be part of a statement, such as:


    ```

    int y = x++; // post-increment in an assignment statement

    z = ++x; // pre-increment in an assignment statement

    ```


    As seen in the above examples, increment and decrement operators can appear either
    before the operand or after the operand. When they appear before the operand,
    e.g., ++x and ----, they are called pre-increment and pre-decrement, respectively.
    When they appear after the operand, e.g., x++ and x--, they are called post-increment
    and post-decrement, respectively. There is no difference between post- and pre-increment
    (or decrement) when the operation is the—the operand incremented (or decremented)
    in either case. However, there is a big difference when they are used as a part
    of a statement. Let us use increment to explain the difference:


    +   * With post-increment, the current value of the operand is used in the rest
    of the evaluation; after that, the operand gets incremented.'
