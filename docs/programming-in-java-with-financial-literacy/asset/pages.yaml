  md: "# 6.1 Exception Handling\n\ntrace shows the series of method invocations that\
    \ lead up to the thrown exception.\nThe last line shows the place (Line 7 of the\
    \ program) where the problem got started.\nWhen a 0 is supplied, the program will\
    \ encounter a different kind of problem and\nexit with the following in the output\
    \ console:\n\n```\nPlease input integer: 0\nException in \"main\" java.lang.ArithmeticException:\
    \ / by\nzero\nat edu.mrzu.demo.exception.Example1.main(Example1.java:8)\n```\n\
    \nThis time, the type of the exception is ArithmeticException.\nWhen we write\
    \ programs, we need to anticipate potential problems that may\noccur and write\
    \ code to handle these \"anticipation\" problems. We will learn how to\ndo this\
    \ next.\n\n# 6.1.2 Exception Handling using try... catch... finally\n\nThe approach\
    \ to exception handling in Java is to put a block of code that can potntially\
    \ generate exceptions within a try block, then use one or catch blocks to\nprocess\
    \ types of exceptions generated. An optional finally block\ncan be used; code\
    \ in this block is executed regardless whether an exception is actually generated.\
    \ The syntax for exception handling has the following pattern:\n\n```\ntry {\n\
    \  statements;\n  catch (<TypeOfException1> <exVar>) {\n    statements to process\
    \ TypeOfException1 exception;\n  } catch (<TypeOfException2> <exVar>) {\n    statements\
    \ to process TypeOfException2 exception;\n  }\n  finally {\n    statements to\
    \ be executed always;\n  }\n}\n```\n\nWhen only one exception is generated (or,\
    \ thrown, as it is called) at a time.\nWhen an exception occurs, the block which\
    \ is the exception type parameter is the same\nthe type of the exception thrown\
    \ or a subtype of the exception thrown.\nThe exception is represented as an object,\
    \ which is referred to by the variable <exVar>.\nWhen there is a finally block,\
    \ after processing the exception, the program control is transferred to the finally\
    \ block. If there is no exception thrown in the try\nblock, the program control\
    \ is also transferred to the finally block. When there is\nis no finally block,\
    \ the control is transferred to the code following the exception\nhandling code.\n\
    \nLet us use an example to see how this mechanism can be used to revise the earlier\\\
    example to handle exceptions. The revised program is shown in Listing 6.2."
