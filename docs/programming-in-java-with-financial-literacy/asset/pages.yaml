- pgno: 20
  md: '# 1.3 Basics of Java


    Before leaving this chapter, let us learn more about the basics of Java programming
    using two example programs: the HelloWorld program seen earlier and another one
    to be introduced shortly.


    # 1.3.1 Structure of Java Program


    A Java program consists of one or more classes. The HelloWorld program has just
    one class named HelloWorld. Different parts of the HelloWorld class are shown
    in Fig. 1.8.


    ![](img/d4f7b51b492858346b4c26816c21e311_20_0.png)


    **Fig. 1.8:** Structure of HelloWorld program.


    **Class Declaration** A class is declared using the class keyword followed by
    the name of the class. The keyword public indicates the accessibility (also called
    visibility) of the class. A public class is accessible to all other classes. The
    HelloWorld class''s declaration is.


    ```

    public class HelloWorld

    ```


    **Class Body** Following the class declaration is the body of the class, which
    is enclosed within a pair of curly braces. The body of a class may contain methods
    and other declarations. The body of the HelloWorld class contains just one method,
    named main, which is invoked automatically to start the program.


    **Method Declaration** A method is declared to indicate a number of characteristics
    of the method, among which the return data type, the name of the method, and a
    list of arguments (also called parameters) must be present; the list of arguments,
    which can be empty, is enclosed in a pair of parenthesis. The main method''s declaration
    is:


    ```

    public static void main(String[] args)

    ```


    Different parts of a method declaration are illustrated in Fig. 1.9.'
