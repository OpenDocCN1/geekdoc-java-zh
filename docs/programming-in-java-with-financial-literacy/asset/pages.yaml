    In this chapter, we will study control structures and a number of branching statements.
    We will also study arrays and learn how to use them to store a set of data elements
    of the same type. You may have used flowchart to document processes before. We
    will look at how you can use flowchart to describe the process of your program.


    # # 3.1 Control Structures


    Java offers three control structures: sequence, selection, and repetition. With
    sequence structure, the flow of control is sequential—the code is executed statement
    by statement according to the order of the statements as they appear in the source
    code. We have been using this control structure in the programs so far. The selection
    and repetition control structures modify the sequential order so that you can
    create branches and loops when necessary in your program.


    In some of earlier programming languages there was a "GO TO" that allowed the
    flow to jump to any labeled point. It is certainly a convenient feature, but the
    code with numerous "GO TO" statements are difficult to follow and maintain. Later,
    research had shown that a programming language can do away with "GO TO" with sequence,
    selection, and repetition control structures. Java is such a language that does
    not have "GO TO".


    # # 3.2 Selection Structure


    Selections can be implemented using if, if...else, and switch statements.


