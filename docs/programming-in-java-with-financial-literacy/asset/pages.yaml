  md: '# 4.8 Financial Literacy


    # 4.8.1 Types of Taxes and Their Rates


    How much taxes must you pay? This depends on many factors such as the amount of
    money (e.g., income, property value, and expenses) and tax rates. Below are typical
    tax rates in the U.S. (bear in mind they can change as tax code is updated):


    +   1. Federal Income Tax: Rates have a progressive (or graduate) structure, also
    known as tax brackets. The rates vary from 10% to 35%.


    +   2. Capital Gain Tax: Gains from long-term investment are currently (as of
    2012) at a flat rate of 15%.


    +   3. FICA Tax: FICA stands for Federal Insurance Contributions Act. Roughly
    7.65% of your salary is deducted automatically to pay for Social Security and
    Medicare; Your employer contributes the same amount. The 7.65% is made up with
    two parts: 6.2% for Social Security, and 1.425% for Medicare. If your salary is
    more than $106,800, the above amount is not subject to Social Security.


    +   4. State and Local Income Tax: States and cities levy taxes on your income.
    The rates vary. For example, Massachusetts taxes at a flat 5.25% rate on your
    income, and Maine uses a progressive structure with the rate varying between 0
    and 8%. See http://www.tax-brackets.org or each state''s official website for
    more information. The tax rates applied to different types of incomes (e.g., interest,
    capital gain, income from employers may also differ.


    +   5. Non-Income-Based Taxes


    +   Property Taxes: Taxes on real estate and personal property (e.g., cars) vary
    from place to place. It is typical to see real estate tax be 1 to 2 percent.


    +   Exercise Tax: These taxes are imposed on certain items with an aim to reduce
    their consumption. Examples of such items include alcoholic beverages, cigarettes,
    gasoline, and fuel. Below are some sample tax rates.


    | | Gasoline /gallon | Diesel Fuel /gallon | Cigarettes per pack of 20 |

    |---|---|---|---|

    | CA | 48.6 | 51.5 | $0.87 |

    | MA | 23.5 | 23.5 | $2.51 |

    | VA | 19.8 | 20.1 | $0.30 |


    +   Sales Taxes: The rates vary among states and cities. For example, in New Hampshire,
    the sales tax is 0; in New York City, it is 8.875%.


    +   Gift and Estate Taxes: These are the taxes imposed on the money transferred
    to another person. When the amount exceeds a certain limit (e.g., $13,000 for
    gift and $1M for estate), the excess amount is taxed at a rate of 35%.


