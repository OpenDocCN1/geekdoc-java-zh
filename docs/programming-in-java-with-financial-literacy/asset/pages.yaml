    > > The person who doesn''t know where his next dollar is coming from usually
    doesn''t know where his last dollar went.


    # ## Topics


    +   - Primitive Data Types

    - Reference Data Types

    - Operators

    - Formatted Output


    Java is a strongly typed language. In Chapter 1, we used `int, double, String`,
    and array data types in the example programs. These types belong to one of the
    two categories of data types that Java has: (1) `primitive` data types (e.g.,
    `int` and `double`), and (2) `reference` data types (e.g., `String` and array).
    Intuitively, you can think of primitive data types as built-in types, most of
    which are numeric types. There are exactly eight primitive data types. Variables
    of reference types serve as references to objects. Each Java class (or interface)
    defines a reference data type. Thus the number of reference data types is unlimited.


    We can perform operations on data, e.g., adding two numeric values and concatenating
    two strings. Operators are used to perform various operations.

    In this Chapter, we will study data types and operators available in Java. We
    will also learn how to use the `print` method to perform formatted printing. In
    addition to the book, you may want to take advantage of many online resources,
    among which, I highly recommend "The Java Tutorials" that are put together by
    the creator of Java, Oracle (...well, it was Sun, which was acquired by Oracle
    in 2009 for $7.4 billion). See "Online Resources" box for more information.'
