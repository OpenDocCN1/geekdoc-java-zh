    at java.util.Scanner.nextInt(Scanner.java:1463)\nat java.util.Scanner.nextInt(Scanner.java:2091)\n\
    at com.demo.exception.Example.main(Example.java:7)\n```\n\nThis is because 4.0\
    \ is a double literal. The nextInt() method throws an exception because double\
    \ cannot be automatically converted to an int. If you read the message carefully,\
    \ you will notice the type of exception in this case is InputMismatchException.\n\
    \nThe error messages shown here are a typical stack trace. Method invocation in\
    \ many programming languages uses a stack (a last-in-first-out data structure).\
    \ A stack"
