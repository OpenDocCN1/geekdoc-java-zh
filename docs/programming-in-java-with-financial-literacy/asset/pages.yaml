  md: "# Catch-or-Declare Checked Exceptions\n\n6.2.1 Catch-or-Declare Checked Exceptions\n\
    nFor any code that throws checked exceptions, these exceptions must be caughtFor\
    \ any code that throws checked exceptions, these exceptions must be caught (using\
    \ try ...catch), or the method enclosing the code must be declared to throw these\
    \ checked exceptions (using throws). Otherwise, the program will not compile.\
    \ Let us use example to illustrate this requirement.\n\nWe have used the Scanner\
    \ constructor to create an object using the input console as the input stream.\
    \ No exception will be thrown from this constructor. The constructor also has\
    \ an overloaded version that opens a file as the input stream. This version may\
    \ throw a FileNotFoundException, which is a checked exception. We will use an\
    \ example with this constructor to illustrate the catch-or-declare requirement\
    \ which is in Listing 6.4.\n\n```\npackage edu.mrzhu.exception;\nimport java.io.File;\n\
    import java.io.FileNotFoundException;\nimport java.util.Scanner;\npublic class\
    \ ReadText {\n    public static void main(String[] args) {\n        int count\
    \ = 0;\n        try {\n            String file = System.getProperty(\"user.home\"\
    )\n                + System.getProperty(\"file.separator\")\n                +\
    \ \"testfile.txt\";\n            Scanner sc = new Scanner(new File(file));\n \
    \           while (sc.hasNext()) {\n                count++;\n               \
    \ sc.next();\n            }\n            System.out.println(count);\n        }\
    \ catch (FileNotFoundException e) {\n            System.out.println(\"Error: \"\
    +e.LocalizedMessage());\n        }\n    }\n}\n```\n\nWhen the program is implement\
    \ as shown in Listing 6.4 (with exception code commented out), the compiler will\
    \ report an error about unhandled exception in Line 12. There are two alternatives\
    \ to make the code to compile. Alternative 1 is to uncomment the commented lines\
    \ so that the exception is caught and handled. Alternative 2 is to declare that\
    \ the main method throws FileNotFoundException. Listing 6.5 shows the second alternative.\n\
    \n```\npackage edu.mrzhu.exception;\nimport java.io.File;\nimport java.io.FileNotFoundException;\n\
    import java.util.Scanner;\n```"
