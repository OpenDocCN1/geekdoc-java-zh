- pgno: 14
  md: '# 1.2 Installing Eclipse


    ![](img/d4f7b51b492858346b4c26816c21e311_14_0.png)


    Fig. 1.3: An empty workbench under Java EE perspective.


    At this point, in fact you have actually created a perfectly legitimate Java program
    that can execute but does not do anything. Later we will write code to output
    text on the output console. Before moving on to write code, let me make a few
    comments about the IDE and Java.


    # IDE Characteristics:


    +   1. Line numbers. As seen in Fig. 1.5, line numbers are displayed in the left
    margin of the editor view. They are useful when you debug or discuss code with
    other people. You can turn this by right-clicking the gray margin on the left
    of the editor view and choosing "Show Line Numbers"

    2. Color coding. Different colors are used to distinguish different kinds of source
    code. For example, Java reserved words (i.e., keywords) are in purple color (and
    bold style).

    3. Code blocks. Code is divided into blocks and each block can be collapsed and
    expanded. For example, the source code in Figure 1.5 shows two blocks: (1) comments
    before main method; (2) main method. Clicking the minus (-) sign on the left of
    the first line of the block will collapse the block and change the sign to plus
    (+). This feature is useful when you try to understand a relatively large program—you
    can hide sections of code and focus on the ones that need attention.'
  merge: -1
  img_proc: true
