    | | * | Multiplication | x*y, x*Math.abs(y). |

    | | / | Division | x/y, x/Math.abs(y). |

    | | % | Remainder | x%y, x%Math.abs(y). Also called modulo. uulo, the operation
    returns the remainder of a division. Usually the operands are integer types, but
