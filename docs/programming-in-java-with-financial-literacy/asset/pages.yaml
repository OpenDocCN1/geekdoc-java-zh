- pgno: 52
  md: '# 2.4 Formatted Output


    # Formatting string


    # Variable #of arguments


    ```

    System.out.format("PI=%8.6f\tE=%8.6f%n", Math.PI, Math.E);

    ```


    %8.6f is a format specifier


    A format specifier begins with a percent sign (%) and ends with a conversion character
    indicating the type of output to be formatted:


    +   - f: float

    - d: integer (also called "decimal integer") to indicate base is 10

    - s: string


    Between and the conversion character are optional flags and other specifications.
    For example, here are 8 specifiers that the output will be at least 8 characters
    wide, right justified (for left justification, use flag "%-e.g.-8.3f") with 6
    places after the decimal point. As learned in Chapter 1, \t is for a tab space,
    \n is equivalent to \n and generates a new line.


    Now, let us look at another example:


    ```

    System.out.printf("%$s is $%d and tax rate is %.2f%%.\n", "Romney", 22000000,
    13);

    ```


    Its output:


    Romney''s income is $22,000,000 and tax rate is 13.00%.


    There are three format specifiers, therefore, there are three additional arguments
    after the formatting string:


    +   1. The first specifier is %s — a string argument is required. Romney is the
    String argument.

    2. The second specifier is %,d — an integer argument is required. 22000000 is
    the required integer group. The comma in the specifier is a flag for locale-specific
    group characters. If the system locale is U.S., commas are used as thousand separators
    and period is used as decimal point.

    3. The third specifier is %.2f — a float is required and it will be formatted
    with 2 places after decimal point. Note that we may have to supply a float type
    of argument (e.g., an integer type does not work and will cause runtime exception).
    Since 13 is an int literal, we use 13. (or 13d, 13f) to supply a float.


    Since %% has special meaning, we need to use two percent signs in the formatting
    string.


    The documentation for java.util.Formatter class provides the full specification
    of the syntax for producing formatted output and creating a formatted string.


    Additional examples can be found at:


    ```

    http://docs.oracle.com/javasase/tutorial/java/data/numberformat.html.

    ```'
