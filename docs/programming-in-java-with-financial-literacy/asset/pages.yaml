  md: '# 4.4 Variables: Scope, Pass-by-Value. Pass-by-Reference


    You may have noticed that variables can be introduced in several places: as members
    of a class, as arguments of a method, within the body of a method. Depending on
    where they are introduced, they have different ranges within which they are effect
    — this is known as scope of variables. As identifiers, variables can be used to
    refer to primitive values and objects. There is a difference between these two
    types when variables are used as arguments of a method. In this section, we will
    look at scoping and how variables are used as arguments of methods.


    # 4.4.1 Variable Scope


    As an identifier, name must be unique within its scope. Variables declared as
    class members (i.e., attributes or fields) have a global scope. These variables
    can be accessed from anywhere within the class. Variables introduced as arguments
    and within blocks of code inside a method have a local scope. Within a local scope,
    variables allowed to have the same names as those in the global scope, in which
    case we say the global variables are shadowed by the local variables.


    Let us look at the example in Listing 4.4. The constructor introduces three local
    variables: name, major, grade. These names are the same as those of the attributes.
    They shadow the attribute variables. But how can Java determine which variable
    you are referring to?


    Let us look at the following statement in the constructor of the Student class:


    ```

    this.name = name;

    ```


    We know that assignment is evaluated from right to left. Thus Java needs to determine
    the name variable by searching in different scopes. Java always begins by searching
    the current scope — the scope where the variable appears. If it finds the variable
    declaration within the current scope, it uses that variable; otherwise, it continues
    searching in the next scope. The search continues until it finds the declaration.
    In this case, Java finds that the variable is declared in the constructor arguments.
    Thus the variable refers to the variable passed in as the constructor''s argument.


    Our intention is to assign this variable in local scope to the attribute variable
    in global scope, but the attribute is shadowed by the local variable. In this
    case, the keyword this in Java allows us to refer to a shadowed global variable
    from any local scope. The keyword represents the current instance of the class.
    To access class variables, use the class name as prefix (such as Line 15 in Listing
    4.4: Student.school=school);


    If we change the code to


    ```

    name = name;

    ```'
