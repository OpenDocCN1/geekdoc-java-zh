- pgno: 27
  md: 'Or, you can import all classes within a package by using a wildcard (*):


    ```

    import java.util.*;

    ```


    The java.util package contains several dozens of classes. Does the use of a wildcard
    make your compiled program unnecessarily large? The java.util package also contains
    several sub-packages such as java.util.regex and java.util.zip. Does the use of
    a wildcard import classes in sub-packages?


    The answer is No to both questions.


    Import classes make them accessible to your program. Only the classes in your
    code will be included in the compiled program. The wildcard only makes available
    classes in the package indicated by the prefix. It does not recursively import
    classes in sub-packages. If you need to use classes in sub-packages, you must
    use an import statement for each sub-package.


    # 1.4 Financial Literacy


    Soon you will begin to write programs that address certain aspects of personal
    finance. This may not seem interesting to everybody. But regardless of interest,
    personal finance goes beyond personal wealth. Taking care of one''s finance is
    a matter of personal responsibility. Collectively, it is also a matter of social
    responsibility.


    In this chapter, we will look at expenses. For students, college education is
    perhaps the largest expense (and the most important investment). There has been
    a lot of discussion in the media. Let us look at the distribution of the cost
    of four-year colleges in the U.S.


    # 1.4.1 Cost of College Education


    In the process of applying for colleges, you probably learned that tuition and
    fees—“sticker prices”—vary substantially among colleges. Public colleges that
    receive funding usually charge in-state students at a lower tuition rate than
    out-of-state students. Many students receive grants and financial aid for their
    college education. As a result, the actual cost of a college can be lower than
    its published “sticker price”.


    I assume you know the cost of attending your current college. How does the cost
    compare with other universities in the U.S.? The College Affordability and Transparency
    Center of the Department of Education publishes data of all institutions that
    participate in federal financial assistance programs under the Title IV of the
    Higher Education Act of 1965. Their dataset lists tuition and required fees (the
    sticker price) of each college. For public colleges, only in-state tuition and
    fees are listed. The dataset also lists the average “net price” of each college.
    Net price is tuition and minus grants and financial aid received by students.
