  md: "# 4.7 Example Programs\n\nRecall that the first formula calculates the number\
    \ of years (or periods) it will take to reach $v_n$ if you currently have $v_0$\
    \ invested in an account with an annual (or periodic) rate of return of $i$. The\
    \ second formula calculates the amount you have to set aside annually (or periodically)\
    \ in an account with a rate of return $i$ if you want to have $v_n$ in years (or\
    \ periods). These formulas can be straightforward implemented as static methods\
    \ of the financial calculator class. Listing 4.12 shows the implementation.\n\n\
    ```\npublic class FinancialCalculator {\n    public static double periodsToGoal(double\
    \ current, double goal,\n        double i) {\n        return Math.log(goal/current)/Math.log(1+i);\n\
    \    }\n    public static double periodicAmount(double goal, double i,\n     \
    \   double n) {\n        return i*goal/(Math.pow(1+i, n)-1);\n    }\n}\n```\n\n\
    The program in Listing 4.13 illustrates how the calculator is used useful results.\n\
    \n```\npublic class FinancialCalculatorTest {\n    public static void main(String[]\
    \ args) {\n        double i=0.15,current=100000,goal=1000000,n=20;\n        System.out.printf(\"\
    %s, %s\",\n            FinancialCalculator.periodsToGoal(current, goal, i),\n\
    \            FinancialCalculator.periodicAmount(goal, i, n));\n    }\n}\n```\n\
    \nThe program will produce the following output:\n\nIf you currently have an investment\
    \ that returns 15% annually, it will take 48 years to reach $1 million. Starting\
    \ from nothing, to reach $1 million in 20 years, you must invest $9,761,477 annually\
    \ if the investment returns 15% annually.\nAs you know, the rates of return in\
    \ different types of investment instrument vary substantially. With the financial\
    \ calculator implemented as a handy tool, you can compare different scenarios\
    \ easily. The program in Listing 4.14 compares five rates of return: 5, 10, 15,\
    \ 20, and 25."
