    \ loop, the inner loop executes only two iterations and all outputs will be added\
    \ to the third output line.\n\nIn summary, when a labeled break statement in an\
    \ inner loop executes, it terminates the labeled loop. When a labeled continue\
    \ statement in an inner loop executes, the loop jumps to the next iteration of\
