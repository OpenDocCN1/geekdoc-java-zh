  md: '# Chapter 6

    Exception Handling


    > October: This is one of the peculiarly dangerous months to speculate in stocks.
    The others are July, January, September,

    April, November, May, March, June, December, August and

    February.


    — Mark Twain


    # Topics


    +   - Exception Handling using try...catch...finally

    - Termination model

    - Checked Exceptions vs. Unchecked Exceptions


    When you work on programming exercises, you probably have experienced the

    situation where your code compiles fine, but when you run your program, an error

    messages is generated in the output console. For example, when you work with

    arrays, you might have seen an error message similar to the following one:


    Exception in thread ''main'' java.lang.ArrayIndexOutOfBoundsException: 3

    at edu.mrzbu.demo.exception.main(Example.java:5)


    This indicates that your program has stopped running unexpectedly because of

    problem encountered at runtime. The error message such as the one shown above
    is

    useful to software developers, but it is probably not so meaningful to the end
    user.

    In addition, a program needs to be robust enough in dealing with anticipated prob-\lems.
    When it must exit, it should exit more gracefully. These can be accomplished

    through error handling, often called exception handling in Java.


    In this Chapter, we will learn how to handle exceptions to improve robustness
    of

    programs.'
