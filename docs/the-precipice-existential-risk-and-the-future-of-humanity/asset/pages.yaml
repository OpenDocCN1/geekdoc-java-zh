    # # EXISTENTIAL RISK


    The crucial role we fill, as moral beings, is as members of a cross-generational
    community, a community of beings who look before and after, who interpret the
    past in light of the present, who see the future as growing out of the past, who
    see themselves as members of enduring families, nations, cultures, traditions.


    > —Annette Baier


    We have seen how the long arc of human history has brought us to a uniquely important
    time in our story—a period where our entire future hangs in the balance. And we
    have seen a little of what might lie beyond, if we can only overcome the risks.


    It is now time to think more deeply about what is at stake; safeguarding humanity
    through this time is important. To do so we first need to clarify the idea of
    existential risk. What exactly is existential risk? How does it relate to more
    familiar ideas of extinction or the collapse of civilization?


    We can then ask what it is about these risks that compels our urgent concern.
    The chief reason, in my view, is that we would lose our entire future: everything
    humanity could be and everything we could achieve. But that is not all. The case
    that it is crucial to safeguard our future draws support from a wide range of
    moral traditions and foundations. Existential risks also threaten to destroy our
    present, and to betray our past. They test civilization’s virtues, and threaten
    to remove what may be the most complex and significant part of the universe.


    If we take any of these reasons seriously, we have a lot of work to do to'
