    # EARLY ACTION


    Some of the biggest risks we face are still on the horizon. Can we really do useful
    work to eliminate a threat so far in advance? How can we act now, when we are
    not fully aware of the form the risks may take, the nature of the technologies,
    or the shape of the strategic landscape at the moment they strike?


    These are real concerns for any attempts to address future risks. We are near-sighted
    with respect to time, and so there is a serious chance our efforts will be wasted.
    But this is not the whole story. There are also ways in which action far in advance
    of the threat can be all the more helpful.


    Early action is best for changing course. If we are headed the wrong way, it is
    better to correct this at an early stage. So if we need to steer a technology
