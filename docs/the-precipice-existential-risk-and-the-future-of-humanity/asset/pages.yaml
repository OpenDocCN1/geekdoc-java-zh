  md: '# DURATION


    Human history so far has seen 200,000 years of Homo sapiens and 10,000 years of
    civilization² These spans of time surpass anything in our daily lives. We have
    had civilization for a hundred lifetimes on end and humanity for thousands. But
    the universe we inhabit thousands of times older than humanity itself. There were
    billions of years before us; there will be billions to come. In our universe,
