  md: 'There is much debate about whether the distributions of various disasters are
    really power laws. For example, log-normal distributions have right-hand tails
    that approximate a power law, so could be mistaken for them, but have a lower
    probability of small events than in a true power law. For our purpose, we don''t
    really need to distinguish between heavy-tailed distributions. We are just interested
    in whether the right-hand tail (the distribution of large events) behaves as a
    power law (~xᵃ), what its exponent is, and what domain the power law relationship
    actually holds.


    Any actual distribution will only be well fitted by a power law up to some level.
    Beyond point other limits (such as the total population who could be affected)
    will kick in and the real probability will be less than that given by the power
    law. This makes the use of power laws to model the chances of events outside the
    observed domain speculative (though this is less problematic if using it as an
    upper bound to the true probability). This also implies that the actual distributions
    do mean, though these could be higher than the mean of the historical record,
    or even higher than the highest observed event so far.


