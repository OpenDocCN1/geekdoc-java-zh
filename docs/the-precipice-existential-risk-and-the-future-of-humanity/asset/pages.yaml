  md: '# # 1 STANDING AT THE PRECIPICE


    It might be a familiar progression, transpiring on many worlds—planet, newly formed,
    placidly revolves around its star; life slowly forms; a kaleidoscopic procession
    of creatures evolves; intelligence emerges which, at up to a point, confers enormous
    survival value; and then technology is invented. It dawns on them that there are
    such things as laws of Nature, that these laws can be revealed by experiment,
    and that knowledge of these laws can be made both to save and take lives, both
    on unprecedented scales. Science, they recognize, grant immense powers. In a flash,
    they create world-altering contrivances. Some planetary civilizations see their
    way through, place limits on what may and must not be done, and safely pass through
    the time of perils. Others, not so lucky or prudent, perish.


    > —Carl Sagan¹


    We live at a time uniquely important to humanity’s future. To see why, we need
    to take a step back and view the human story as a whole: how we got to this point
    and where we might be going next.


    Our main focus will be humanity’s ever-increasing power—power to improve our condition
    and power to inflict harm. We shall see how the major transitions in human history
    have enhanced our power, and enabled us to make extraordinary progress. If we
    can avoid catastrophe we can cautiously expect this progress to continue: the
    future of a responsible humanity is extraordinarily bright. But this increasing
    power has also brought on a new transition, at least as significant as any in
    our past, the'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'transition to our time of perils.


    # HOW WE GOT HERE


    Very little of humanity''s story has been told; because very little can be told.
    Our species, *Homo sapiens*, arose from the savannas of Africa 200,000 years ago².2
    For an almost unimaginable time we have had great loves and friendships, suffered
    hardships and griefs, explored, created, and wondered about our place in the universe.
    Yet when we think of humanity''s great achievements across time, we think almost
    exclusively of clay, papyrus or paper—records that extend back only about 5,000
    years. We rarely think of the first person to set foot in the strange new world
    of Australia some 70,000 years ago; of the first name and study the plants and
    animals of each place we reached; the stories, songs and poems of humanity in
    its youth.³3 But these accomplishments were real, and extraordinary.


    We know that even before agriculture or civilization, humanity was a fresh force
    in the world. Using the simple, yet revolutionary, technologies of seafaring,
    clothing and fire, we traveled farther than any mammal before us. We adapted to
    a wider range of environments, and spread across the globe.4


    What made humanity exceptional, even at this nascent stage? We were not the biggest,
    the strongest or the hardest. What set us apart was not physical, but mental—our
    intelligence, creativity and language.5


    Yet even with these unique mental abilities, a single human alone in the wilderness
    would be nothing exceptional. He or she might be able to survive—intelligence
    making up physical prowess—but would hardly dominate. In ecological terms, it
    is not a human that is remarkable, but humanity.


    Each human''s ability to cooperate with the dozens of other people in their band
    was unique among large animals. It allowed us to form something greater than ourselves.
    As our language grew in expressiveness and abstraction, we were able to make the
    most of such groupings: pooling together our knowledge, our ideas and our plans.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '![](img/ceca30e81393f78f20a82bab7e58f051_23_0.png)


    FIGURE 1.1 How we settled the world. The arrows show our current understanding
    of the land and sea routes taken by our ancestors, and how many years ago they
    reached each area.5


    Crucially, we were able to cooperate across time as well as space. If each generation
    had to learn everything again, even then a crude iron shovel would have been forever
    beyond our technological reach. But we learned from our ancestors, added more
    innovations of our own, and passed this all down to our children. Instead of dozens
    of humans in cooperation, we had tens of thousands, cooperating across the generations,
    preserving and improving ideas through deep time. By little by little, our knowledge
    and culture grew.7


    At several points in the long history of humanity there has been a great transition:
    a change in human affairs that accelerated the accumulation of power and shaped
    everything that would follow. We will focus on three.8


    The first was the Agricultural Revolution.9 Around 10,000 years ago the people
    of the Fertile Crescent, in the Middle East, began planting wheat, barley, lentils
    and peas to supplement their foraging. By preferentially replanting the seeds
    from the best plants, they harnessed the power of evolution, creating new domesticated
    varieties with larger seeds and better yields. This worked with animals too, giving
    humans easier access to meat and hides, along with milk, wool and manure. And
    the physical power of draft animals to help plow the fields or transport the harvest
    was the biggest addition to humanity''s power since fire.10'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'While the Fertile Crescent is often called “the cradle of civilization,” in
    truth civilization had many cradles. Entirely independent agricultural revolutions
    occurred across the world in places where the climate and local species were suitable:
    in east Asia; sub-Saharan Africa; New Guinea; South, Central and North America;
    and elsewhere too. The new practices dawned out each of these cradles, changing
    the way of life for many from foraging to farming.


    This had dramatic effects on the scale of human cooperation. Agriculture reduced
    the amount of land needed to support each person by a factor of a hundred, allowing
    large permanent settlements to develop, which began to unite into states. Where
    the largest foraging communities involved hundreds of people, some of the first
    cities had tens of thousands of inhabitants. At its height, the Sumerian civilization
    continued around a million people.¹¹³ And 2,000 years ago, the Han dynasty of
    China reached sixty million people—about a thousand times as many as were ever
    united in our forager past, and about ten times the entire forager population
    at its peak.¹⁴


    As and more people were able to share their insights and discoveries, there were
    rapid developments in technology, institutions and culture. The increasing numbers
    of people trading with one another made it possible for them to specialize in
    these areas—to devote a lifetime to governance, trade or the arts—allowing us
    to develop these ideas much more deeply.


    Over the first 6,000 years of agriculture, we achieved world-changing breakthroughs
    including writing, mathematics, law and the wheel.¹¹⁵ Of these, writing was especially
    important for strengthening our ability to cooperate across time and space: increasing
    the bandwidth between generations, the reliability of the information, and the
    distance over which ideas could be shared.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '![](img/ceca30e81393f78f20a82bab7e58f051_25_0.png)


    Figure 1.2 The cradles of civilization. The places around the world where agriculture
    was independently developed, marked with how many years ago this occurred.


    The next great transition was the Scientific Revolution.16 Early forms of science
    had been practiced since ancient times, and the seeds of empiricism can be found
    in the work of medieval scholars in the Islamic world and Europe.17 But it was
    only about 400 years ago that humanity developed the scientific method and scientific
    progress took off.18 This helped replace a reliance on received authorities with
    careful observation of the natural world, seeking simple and testable explanations
    for what we saw. The ability to test and discard bad explanations helped us break
    free from dogma, and allowed for the first time the systematic creation of knowledge
    about the workings of nature.


    Some of our new-found knowledge could be harnessed to improve the world around
    us. So the accelerated accumulation of knowledge brought with it an acceleration
    of technological innovation, giving humanity increasing power over the natural
    world. The rapid pace allowed people to see transformative effects these improvements
    within their own lifetimes. This gave rise to the modern idea of progress. Where
    the world had previously been dominated by narratives of decline and fall or of
    a recurring cycle, there was increasing interest in a new narrative: a grand project
    of working together to build a better future.


    Soon, humanity underwent a third great transition: the Industrial Revolution.
    This was made possible by the discovery of immense reserves of energy in the form
    of coal and other fossil fuels. These are formed from'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'the compressed remains of organisms that lived in eons past, allowing access
    to a portion of the sunlight that shone upon the Earth over millions of years.19
    We had already begun to drive simple machines with the renewable energy from the
    wind, rivers and forests; fossil fuels allowed access to vastly more energy, and
    in a much more concentrated and convenient form.


    But energy is nothing without a way of converting it to useful work, to achieve
    our desired changes in the world. The steam engine allowed the stored chemical
    chemical energy of coal to be turned into mechanical energy.20 This mechanical
    energy was then used to drive machines that performed massive amounts of labor
    for us, allowing raw materials to be transformed into finished products much more
    quickly and cheaply than before. And via the railroad, this wealth would be distributed
    and traded across long distances.


    Productivity and prosperity began to accelerate, and a rapid sequence of innovations
    ramped up the efficiency, scale and variety of automation, giving rise to the
    modern era of sustained economic growth.21


