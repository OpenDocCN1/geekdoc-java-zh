    In this book, I shall use the term civilization collapse quite literally, to refer
    to an outcome where humanity across the globe loses civilization (at least temporarily),
    the term is often used loosely to refer merely to a massive breakdown of order,
    the loss of modern technology, or an end to our culture. But I am talking about
    a world without writing, cities, law, or any of the other trappings of civilization.


    This would be a very severe disaster and extremely hard to trigger. For all the
    historical pressures on civilizations, never once has this happened—not even on
    the scale of a continent.¹10 The fact that Europe survived losing 25 to 50 percent
    of its population in the Black Death, while keeping civilization firmly intact,
    suggests that triggering the collapse of civilization would require more than
    50 percent fatality in every region of the world.¹11


    Even if civilization collapse, it is likely that it could be re. As we have seen,
    civilization has already independently established at least seven times by isolated
    people.¹12 While one might think resource depletion could make this harder, it
    is more likely that it would become substantially easier. Most disasters of human
    extinction would leave our domesticated animals and plants, as well as copious
    material in the ruins of our cities—it is much easier to re-forge iron from old
    railings to melt it from ore. Even expendable resources as coal would be much
    easier to access, via abandoned resources and mines, than they ever were in the
    eighteenth century.¹13 Moreover, evidence that civilization is possible, and the
    tools and knowledge to help rebuild, would be scattered across the world.


    There are, however, two close connections between the collapse of civilization
    and existential risk. First, a collapse would count as an existential catastrophe
    if it were unrecoverable. For example, it is conceivable that some form of extreme
    climate change or engineered plague might make the planet so uninhabitable that
    humanity would be irrevocably reduced to scattered foragers.¹14 And second, a
    global collapse of civilization could increase the chance of extinction, by leaving
    us more vulnerable to such catastrophe.


    One way a collapse could lead to extinction is if the population of the largest
    remaining group fell below the minimum viable population—the'
