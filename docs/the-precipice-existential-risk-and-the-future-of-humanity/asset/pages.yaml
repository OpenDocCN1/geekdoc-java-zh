  md: '# FURTHER READING


    Here is a quick guide to some of the most important writing on existential risk.
    A full bibliography for The Precipice can be found here. Further reading lists,
    course outlines, quotations and extracts can be found online at theprecipice.com.


    Bertrand Russell & Albert Einstein (1955). “The Russell-Einstein Manifesto.”


    In the decade after Hiroshima, Russell and Einstein each wrote important pieces
    on nuclear war that touched upon the risk of human extinction. Their joint manifesto
    was the culmination of this early period of thought.


    Hilbrand J. Groenewold (1968). “Modern Science and Social Responsibility.”


    A very early piece anticipated several key ideas of existential risk. It failed
    to reach a wide audience, leaving these ideas in obscurity until they were independently
    discovered later.


    Annette Baier (1981). “The Rights of Past and Future Persons.

    The foundational work on the importance of future generations.


    Jonathan Schell (1982). *The Fate of the Earth.*


    The first deep exploration of the badness of extinction, and the central importance
    of ensuring humanity’s survival. Filled with sharp philosophical insight.


    Carl Sagan (1983). “Nuclear War and Climatic Catastrophe: Some Policy Implications.”


    A seminal paper, introducing the new-found mechanism of nuclear winter and exploring
    the ethical implications of human extinction.'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'Derek Parfit (1984). Reasons and Persons.


    Among the most famous works in philosophy in the twentieth century, it made major
    contributions to the ethics of future generations and its concluding chapter highlighted
    how and why the risk of human extinction may be one of the most important moral
    problems of our time.


    John Leslie (1996). The End of the World: The Science and Ethics of Human Extinction.


    A landmark book that broadened the discussion from nuclear risk to all risks of
    human extinction, cataloging the threats and exploring new philosophical angles.


    Nick Bostrom (2002). “Existential Risks: Analyzing Human Extinction Scenarios.”


    Established the concept of existential risk and introduced many of the most important
    ideas. Yet mainly of historic interest, for it is superseded by his 2013 paper
    below.


    Nick Bostrom (2003). “Astronomical Waste: The Opportunity of Delayed Technological
    Development.”


    Explored the limits of what humans might be able to achieve in the future, suggesting
    that it is of immense importance to accelerate the arrival of the ultimate state
    of our civilization by even a tiny amount, yet that even this is overshadowed
    by the importance of increasing the chance we get at all.


    Nick Bostrom (2013). “Existential Risk Prevention as Global Priority.”


    An updated version of his essay from 2002, this is the go-to paper on existential
    risk.


    Nick Beckstead (2013). On the Overwhelming Importance of Shaping the Far Future.


    A book-length philosophical exploration of the idea that what matters most about
    our actions is not their immediate consequences, but how they shape the longterm
    trajectory of humanity.


    David Christian (2004). Maps of Time: An Introduction to Big History.


    The seminal book on Big History: examining the major themes and'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'developments in our universe from the Big Bang, the origin of life, humanity,
    civilization, the industrial revolution, through to today.


    Fred Adams & Gregory Laughlin (1999). The Five Ages of the Universe.

    A powerful and accessible presentation of how scientists believe the very longterm
    future will unfold.


    Max Roser (2013). Our World in Data [online]. Available at: www.ourworldindata.org

    An essential resource for seeing the ways in which many of the most important
    aspects of our world have changed over the last two centuries. From the raw data
    to compelling charts and insightful analysis.


    Nick Bostom (2014). Superintelligence: Paths, Dangers, Strategies.

    The foundational work on artificial intelligence and existential risk.

    Stuart Russell (2019). Human Compatible: AI and the Problem of Control.

    A call to action by a leading researcher in AI, showing how his field needs to
    develop if it is to address the risks that will be posed by advanced AI.


    Alan Robock et al. (2007). “Nuclear winter revisited with a modern climate model
    and current nuclear arsenals: Still catastrophic consequences.”

    The most up-to-date modeling of the climate effects of a full-scale war between
    the US and Russia.


    Richard Rhodes (1986). The Making of the Atomic Bomb.

    A Gripping history of the people and events leading to the creation of nuclear
    weapons. With so much information about everything played out, it reveals how
    individuals can and make a difference in this pivotal transition.


    Daniel Ellsberg (2017). The Doomsday Machine: Confessions of a Nuclear War Planner.

    An exploration of how close we have come to full-scale nuclear war, drawing on
    a wealth of new information from his career at RAND and the Pentagon.'
