  md: 'widening moral circle), we would want a solid argument for why we should count
    some people less than we count ourselves, and this is lacking.


    Even our raw intuitions seem to push against it. Is an 80-year life beginning
    in 1970 intrinsically more valuable than one that started in 1980? Is your older
    brother’s life intrinsically more important than your younger brother’s? It gets
    worse when considering longer durations. At a rate of pure time preference of
    1 percent, a single death in 6,000 years’ time would be vastly more important
    than a billion deaths in 9,000 years. And King Tutankham would have been obliged
    to value a single day of suffering in the life of one of his contemporaries as
    more important than a lifetime of suffering for all 7.7 billion people alive.


    Many economists agree, stating that pure time preference is irrational, unfounded
    or immoral. For example, Ramsey said it was “ethically indefensible and arises
    merely from the weakness of the imagination,” while R. F. Harold called it “a
    polite exemption for rapacity and the consequence of reason by passion.” Even
    those who accept it maintain a deep unease when considering its application to
    the *longterm* future.


    The standard rationale among these economists who endorse pure time preference
    is that the job of economists is not to judge people'' preferences, but to show
    how to satisfy them. From our perspective, there are three key problems here.


    Firstly, even if this was the job of the economist, it is not my job. I am writing
    this book to explore how humanity *should* respond to the risks we face. This
    point of view allows for the possibility that people''s unconsidered reflection
    on how to treat the future may be: we sometimes act against our own interests
    and can suffer from a bias towards ourselves at the expense of future generations.
    Using our raw intuitions to set social policy would risk enshrrenching impartiality
    and bias into our golden standard.


    Secondly, the pure time preference embodied in δ is an unhappy compromise between
    respecting people’ actual preferences and the preferences they *should* have.
    The form of pure time preference people actually exhibit is not in the shape of
    an exponential. They discount at high rates over the short term and low rates
    over the long term. Non-exponential discounting is typically seen by economists
    as irrational as it can lead people to switch back and forth between two options
    in a way that'
  merge: -1
  pgno: 240
- img_proc: true
