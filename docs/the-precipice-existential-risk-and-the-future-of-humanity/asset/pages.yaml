  md: '# APPENDIX B


    # POPULATION ETHICS AND EXISTENTIAL RISK


    Theories of ethics point to many different features of our acts that could contribute
    to them being right or wrong. For instance, whether they spring from bad motives,
    violate rights or treat people unfairly. One important feature that nearly everyone
    agrees is relevant is the effect of our acts on the wellbeing of others: increasing
    someone’s wellbeing is good, while reducing it is bad. But some of our acts do
    not merely change people’s wellbeing, they change who will exist. Consider, for
    example, a young couple choosing whether to have a child. And there is substantial
    disagreement about how to compare outcomes that contain different people and,
    especially, different numbers of people. The subfield of ethics that addresses
    these questions is known as population ethics.


    Population ethics comes to the fore when considering how bad it would be humanity
    extinct. One set of reasons for avoiding extinction concerns the future vast ahead
    of us, with potential for thousands, millions or billions of future generations.
    Extinction would prevent these lives, and all the wellbeing they would involve,
    from coming into existence. How bad this loss of future wellbeing be?


    One simple answer is the Total View: the moral value of future wellbeing is just
    the total amount of wellbeing in the future. This makes no distinction between
    whether the wellbeing would come to people who already exist or to entirely new
    people. Other things being equal, it suggests that the value of having a thousand
    more generations is a thousand times the value of our generation. On this view,
    the value of losing our future is immense.


    To test moral theories'
