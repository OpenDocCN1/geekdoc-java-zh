    the intrinsic value of each century increases at a rate higher than $r$, this
    can substantially increase the value of protecting humanity (even if this rate
    of increase is not sustained).48


    Second, the basic model assumes that our actions can only provide protection from
    this century’s risks. But we can do more than that. We can take actions with lasting
    effects on risk. For example, this book is my attempt to better humanity’s understanding
    of the nature of existential risk and how we should respond to it. Many of the
    lessons I’ve drawn out'
  merge: -1
