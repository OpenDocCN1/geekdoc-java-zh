  md: '# ENVIRONMENTAL DAMAGE


    Climate change is not the only form of environmental damage we are inflicting
    upon the Earth. Might we face other environmental existential risks through overpopulation,
    running out of critical resources or biodiversity loss?


    When environmentalism rose to prominence in the 1960s and 1970s, one major concern
    was overpopulation. It was widely feared that humanity''s rapidly growing population
    would outstrip the Earth''s capacity to feed people, precipitating an environmental
    and humanitarian catastrophe. The most prominent advocate of this view, Paul Ehrlich,
    painted an apocalyptic vision of the near future: “Most of the people who are
    going to die in the greatest cataclysm in the history of man have already been
    born.”93 This cataclysm would come soon and pose a direct existential risk. Ehrlich
    predicted: “Sometimes in the next 15 years, the end will come—and by the ''end''
    I mean an breakdown of the capacity of the planet to support humanity.”94


    These confident predictions of doom were mistaken. Instead of rising to unprecedented
    heights, the prevalence of famine dramatically declined. With less than a quarter
    as people died of famine in the 1970s as in the 1960s, and the rate has since
    halved again.95 Instead of dwindling to a point of crisis, the amount of food
    per person has steadily risen over the last fifty years. We now have 24 percent
    more food per person than when Ehrlich''s book, The Population Bomb, was published
    in 1968.


    Much of the credit for this is owed to the Green Revolution, in which developing
    countries rose to the challenge of feeding their people. They did so by modernizing
    their farming, with improved fertilizers, irrigation, automation and grain varieties.96
    Perhaps the greatest contribution was Norman Borlaug, who received the Nobel Prize
    for his work breeding the new, high-yield varieties of wheat, and who may be responsible
    for saving more lives than ever else in history.97


    But the improvements in agriculture are just part of the story. The entire picture
    of overpopulation has changed. Population growth is almost always presented as
    an exponential process—increasing by a fixed percentage each year—but in fact
    that is rarely the case. From about 1800 to 1960 the world population was growing
    much faster than an exponential. The annual'
