    In this respect, the possible quality of our future resembles its possible duration
    and scope. We saw how human civilization has probed a tiny fraction of what is
    possible in time or space. Along each of these dimensions, we can zoom out from
    our present position with a dizzying expansion of scale, leading to unimaginable
    vistas waiting to be explored. Such scales are a familiar feature of contemporary
    science. Our children learn early that everyday experience has only acquainted
    us with a tiny fraction of the physical universe.


    Less familiar, but just as important, is the idea that the space of possible experiences
    and modes of life, and the degree of flourishing they make available, may be similarly
    vast, and that everyday life may acquaint us with a similarly parochial proportion.
    In this sense, our investigations of flourishing thus far in history may be like
    astronomy before telescopes—with limited vision, it is easy to think the universe
    small, and human-centered. Yet how strange it would be if this single species
    of ape, equipped by evolution this limited set of sensory and cognitive capacities,
    after only a few thousand years of civilization, ended up anywhere near the maximum
    possible quality of life. Much more likely, I think, that we have barely begun
    the ascent.


    Rising to our full potential for flourishing would likely involve us being transformed
    into something beyond the humanity of today. Remember that evolution has not stopped
    with humanity. There have been many species of the genus Homo, and within 1 or
    2 million years we would expect to gradually become a different species from today’s
    Homo sapiens. Indeed, unless we act to prevent it, this will eventually happen.
    This century’s genetic technologies will give us the tools to transform ourselves
    much faster, should we wish. And we can already see additional avenues for transformation
    on the horizon, as implants granting digital extensions to our minds, or developments
    in artificial intelligence allowing us to craft entirely new kinds of beings to
    join us or replace us.


    Such transformation would bring serious risks: risks of inequality and'
