    ”).


    On Saturday, one of the blockading US warships detected Savitsky’s

    submarine and attempted to force it to the surface by dropping low-

    explosive depth charges. The submarine had been hiding

    deep under waters. It was out of radio contact, so the crew did

    know whether they had already broken out. Conditions on board were\extremely bad.
    It was built for the Arctic and its ventilator had broken in the

    tropical water. The heat inside was unbearable, ranging from 113°F near the

    t torpedo tubes to 140°F in the engine room. Carbon dioxide had built up to

    dangerous concentrations, and crew members had begun to fall

    unconscious. Depth charges were exploding right next to the hull. One of

    the crew later recalled: “It felt like you were sitting in a metal barrel, which

    sbody is constantly blasting with a sledgehammer.”


    Increasingly desperate, Captain Savitsky ordered his crew to prepare

    their secret weapon:'
