    The moral case for preventing such horror needs little elaboration. Humanity has
    seen catastrophes before, on smaller scales: thousands, or millions, of human
    lives destroyed. We know tremendously it is to prevent such disasters. At such
    a scale, we lose our ability to fully comprehend the magnitude of what is lost,
