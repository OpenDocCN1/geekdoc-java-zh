    The main critique of the Total View is that it leads to something called the repugnant
    conclusion: for any outcome where everyone has high wellbeing, there is an ever
    better outcome where everyone has only a tiny amount of wellbeing, but for quality.
    People find some quantity/quality trade-offs intuitive (for example, that today’s
    7.7 billion people is better than one with a single person who has slightly higher
    average wellbeing), but most feel that the Total View takes this too far.


    As we shall see, the rivals to the Total View have their own counterintuitive
    consequences, and indeed there are celebrated impossibility results in the field
    which show that every theory will have at least one moral implication. We cannot
    hope to find an answer that fits all our intuitions and need to weigh up how bad
    each of these unintuitive consequences is.


    Another approach to population ethics is to say the value of wellbeing in the
    universe is not given by the total but by the average. This approach comes in
    two main versions. The first takes the average wellbeing in each generation, sums
    this up across all the generations. The second takes the average wellbeing across
    all lives that are ever lived, wherever they are in space and time.


    Both versions of averaging are subject to very serious objections. The first version
    can sometimes prefer an alternative where exactly the same people exist, but where
    everyone’s wellbeing is lower. The second version runs into problems living—if
    our only choices were the end of humanity, or creating future people cursed with
    lives of extremely negative wellbeing, this theory can prefer the latter (if the
    past was so bad that this hellish future brings up the average). And it can even
    adding lives with negative wellbeing to adding a larger number of lives with positive
    wellbeing (if the past was so good that the larger number of positive lives would
