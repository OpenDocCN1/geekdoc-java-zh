  md: '# NOTE ON THE AUTHOR


    Toby Ord is a Senior Research Fellow in Philosophy at Oxford University. His work
    focuses on the big-picture questions facing humanity. What are the most important
    issues of our time? How can we best address them?


    His earlier work explored the ethics of global poverty, leading him to make a
    lifelong pledge to donate 10% of his income to the most effective charities helping
    improve the world. He created a society, Giving What We Can, for people to join
    this mission, and together its members have pledged over £1 billion. He then broadened
    these ideas by co-founding the effective altruism movement in which thousands
    of people are using reason and evidence to help the lives of others as much as
    possible.


    His current research is on risks that threaten human extinction or the permanent
    collapse of civilization, and on how to safeguard humanity through these dangers,
    which he considers to be among the most pressing and neglected issues we face.
    Toby has advised the World Health Organization, the World Bank, the World Economic
    Forum, the US National Intelligence Council and the UK Prime Minister’s Office.'
