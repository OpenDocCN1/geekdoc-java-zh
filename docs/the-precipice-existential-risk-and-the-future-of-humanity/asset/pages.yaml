    face are not so peaceful. Rather, they are obviously horrific by the most familiar
    moral standards.


    If, over the coming century, humanity is destroyed in a nuclear winter, or an
    engineered pandemic, or a catastrophic war involving some new technology, then
    seven billion lives would be cut short—including, perhaps, your own life, or the
    lives of those you love. Many would die in agony—starving, or burning, or ravaged
