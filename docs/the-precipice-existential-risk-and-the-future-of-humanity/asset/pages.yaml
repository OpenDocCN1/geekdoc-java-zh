    to be an inflection point in the history of human population: the point where
    the curve finally starts to level off. We may never again see the rapid population
    growth of the mid-twentieth century. In the last eighty years, population grew
    threefold. In the next eighty years (up to 2100) it is expected to go up just
    50 percent, to about 11 billion. For every person alive now, we''ll have to make
