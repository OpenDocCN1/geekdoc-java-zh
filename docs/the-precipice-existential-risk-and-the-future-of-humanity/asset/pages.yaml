    # CLIMATE CHANGE


    The Earth’s atmosphere is essential for life. It provides the pressure needed
    for liquid water to exist on the Earth’s surface, the stability to avoid massive
    temperature swings between day and night, the gases that plants and animals need
    to survive, and—through the greenhouse effect—the insulation that keeps our planet
    from being entirely frozen. Without the greenhouse gases in our atmosphere, Earth
    would be about 33°C colder. These gases (chiefly water vapor, carbon dioxide and
    methane) are more transparent to the incoming light from the Sun than the heat
    that radiates back from the Earth. They act like a blanket: trapping some of the
    heat, keeping the Earth warm.48


    When the Industrial Revolution unlocked the energy that had lain dormant in fossil
    fuels for millions of years, it unlocked their carbon. These carbon dioxide emissions
    from fossil fuels were small at first, contributing less to the warming of our
    climate than agriculture. But as industrialization spread and intensified, carbon
    dioxide emissions increased dramatically, with more released since 1980 in the
    entire industrial period before that.49 All told, the concentration of carbon
    dioxide in our atmosphere has risen from 280 parts per million (ppm) prior to
    the Industrial Revolution to 412 ppm in 2019.50


    Humanity’s actions have already changed our world. The Earth’s climate has warmed
    by about 1°C.51 Sea levels have risen by about 23 centimeters.52 The ocean has
    become more acidic by 0.1 pH.53


