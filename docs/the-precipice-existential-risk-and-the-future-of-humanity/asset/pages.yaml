  md: 'of disease outbreaks, war deaths and terrorist attacks all appear to follow
    power law distributions. Unlike the familiar “normal” distribution where sizes
    are clustered around a central value, power law distributions have a “heavy tail”
    of increasingly large events, where there can often be events at entirely different
