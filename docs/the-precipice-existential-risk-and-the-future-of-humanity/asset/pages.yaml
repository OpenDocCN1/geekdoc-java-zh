    these levels, it will be more useful to classify it as a direct extinction event,
    rather than an unrecoverable collapse. And I expect that this will be one of the
    more common pathways to extinction.


    We rarely think seriously about risks to humanity’s entire potential. We encounter
    them mostly in action films, where our emotional reactions are dulled by their
    overuse as an easy way to heighten the drama.16 Or we see them in online lists
    of “ten ways the world could end,” aimed primarily to thrill and entrain. Since
    the end of the Cold War, we rarely encounter sober discussions by our leading
    thinkers on what extinction would mean for us, our cultures or humanity.17 And
    so in casual contexts people are sometimes flippant about the prospect of human
    extinction.


    But when a risk is vivid and credible—when it is clear that billions of lives
    and all future generations are actually on the line—the importance of protecting
    humanity’s longterm potential is not, for most people, controversial. If we learned
    that large asteroid was heading toward Earth, posing a greater than 10 percent
    chance of human extinction later this century, there would be little debate about
    making serious efforts to build a deflection system, or to ignore the issue and
    run the risk. To the contrary, the threat would immediately become one of the
    world’s top priorities. Our lack of concern about these threats is much more to
    do with not yet believing that there are such threats, that it is about seriously
    doubting the immensity of the stakes.


    Yet it is important to spend a little while trying to understand more clearly
    the different sources of this importance. Such an understanding can buttress feeling
    and inspire action; it can bring to light new considerations and it can aid in
    decisions about how to set our priorities.


