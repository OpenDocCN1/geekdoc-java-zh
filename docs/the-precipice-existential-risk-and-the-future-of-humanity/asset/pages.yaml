    # RESEARCH ON EXISTENTIAL RISK


    The study of existential risk is in its infancy. We are only starting to understand
    the risks we face and the best ways to address them. And we are at an even earlier
    stage when it comes to the conceptual and moral foundations, or grand strategy
    for humanity. So we are not yet in a good position to take decisive actions to
    secure our longterm potential. This makes further research on existential risk
    especially valuable. It would help us determine which of the available actions
    we should take, and to discover entirely new actions we hadn''t yet considered.63


    Some of this research should be on concrete topics. We need to better understand
    the existential risks—how likely they are, their mechanisms, and the best ways
    to reduce them. While there has been substantial research into nuclear war, climate
    change and biosafety, very little of this has looked at the most extreme events
    in each area, those that pose a threat to humanity itself.64 Similarly, we need
    more technical research into how to align artificial general intelligence with
    the values of humanity.


    We also need more research on how to address major risk factors, such as war between
    the great powers, and on major security factors too. For example, the best kinds
    of institutions for international coordination or for representing future generations.
    Or the best approaches to resilience, increasing our chance of recovery from non-fatal
    catastrophes. And we need to find new risk and security factors, giving us more
    ways to get a handle on existential risk.


    And alongside these strands of research on concrete topics, we also need research
    on more abstract matters. We need to better understand longtermism, humanity''s
    potential and existential risk: to refine the ideas, developing the strongest
    versions of each; to understand what ethical foundations they depend upon, and
    what ethical commitments they imply; and to better understand the major strategic
    questions facing humanity.'
