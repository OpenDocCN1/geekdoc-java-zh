  md: '# APPENDIX A


    # DISCOUNTING THE LONGTERM FUTURE


    An existential catastrophe would drastically reduce the value of our entire future.
    This may be the most important reason for safeguarding humanity from existential
    risks. But how important is our longterm future? In particular, the fact that
    much of it occurs far from us in time reduce its value?


    Economists often need to compare benefits that occur at different times. And they
    have discovered a reason of why a particular kind of benefit may matter less if
    received at a later time.


    For example, I recently discovered a one-dollar coin that I''d hidden away as
    a child to be found by my future self. After the immediate joy of discovery, I
    was struck by the fact that transporting this dollar into the future, I''d robbed
    it of its value. There was the depreciation of the currency, of course, but much
    more than was the fact that I now have enough money that one dollar makes very
    little difference to my quality of life.


    If people intend to become richer in the future (due to economic growth) then
    this effect means that monetary benefits received in the future will tend to be
    less than if they received now (even adjusting for inflation). Economists take
    this into account by “discounting” future benefits by a discount factor that depends
    on both the economic growth rate and the psychological fact that extra spending
    for an individual has its diminishing marginal utility.


    A second reason why future benefits can be worth less than current benefits is
    that they are less certain. There is a chance that the process producing this
    benefit—or indeed the person who would receive it—won’t still be around at the
    future time, leaving us with no benefit at all. This is'
  merge: -1
  pgno: 238
- img_proc: true
  md: "sometimes called the “catastrophe rate.” Clearly one should adjust for this,\
    \ reducing the value of future benefits in line with their chance of being realized.\n\
    \nThe standard economic approach to discounting (the Ramsey model) incorporates\
    \ both these reasons.fd It treats the appropriate discount rate for society (ρ)\
    \ as the sum of two terms:\n\n$\rho = \\eta g + \\delta$\n\nThe first term ($\\\
    eta g$) represents the fact that as future people get richer, get less benefit\
    \ from money. It is the product of a factor reflecting the way people get diminishing\
    \ marginal utility from additional consumption ($\\eta$) with the growth rate\
    \ of consumption ($g$). The second term ($\\delta$) accounts for the chance that\
    \ the benefit won’t be realized (the catastrophe rate). The first\n\nso do we\
    \ use this formula for discounting existential risk? The reason to note is that\
    \ the $\\eta g$ term is inapplicable.5 This is because the future benefit we are\
    \ considering (having a flourishing civilization instead of a ruined civilization,\
    \ or nothing at all) is not a monetary benefit. The entire justification of the\
    \ $\\eta g$ term is to adjust for marginal benefits that are worth less to you\
    \ when you are richer (as money or things money can easily buy), but that is inapplicable\
    \ here—if anything, the richer people might be, the more they would benefit from\
    \ avoiding ruin or oblivion. Put another, way the $\\eta g$ term is applicable\
    \ only when discounting wellbeing (or utility) itself. The so $\ng$ term should\
    \ be treated as zero, leaving us with a social discount rate equal to δ.\n\nI\
    \ introduced $\\delta$ by saying that it accounts for the catastrophe rate, but\
    \ it is sometimes thought to include another component: pure time preference.\
    \ This is a preference for one benefit over another simply because it comes earlier,\
    \ and it is a third reason for discounting future benefits.\n\nBut unlike the\
    \ earlier reasons, there is substantial controversy over whether pure preference\
    \ should be included in the social discount rate. Philosophers are nearly unanimous\
    \ in rejecting it.6 Their primary reason is that it is almost completely unmotivated.\
    \ In a world where people have had a very long history of discounting the experiences\
    \ of out-groups (cf. the"
