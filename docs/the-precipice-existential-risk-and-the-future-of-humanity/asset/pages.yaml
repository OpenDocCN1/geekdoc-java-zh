    Third, any notion of risk must involve some kind of probability. What kind is
    involved in existential risk? Understanding the probability in terms of objective
    long-run frequencies won''t work, as the existential catastrophes we are concerned
    with can only ever happen once, and will always be unprecedented until the moment
    it is too late. We can''t say the probability of an existential catastrophe is
    precisely zero just because it hasn''t happened yet.


    Situations like these require an evidential sense of probability, which describes
    the appropriate degree of belief we should have on the basis of the available
    information. This is the familiar type of probability used in courtrooms, banks
    and betting shops. When I speak of the probability of an existential catastrophe,
    I will mean the credence humanity should have that it will occur, in light of
    our best evidence.


    There are many utterly terrible outcomes that do not count as existential catastrophes.


    One way this could happen is if there were no single precipitous event, but a
    multitude of smaller failures. This is because I take on the usual sense of catastrophe
    as a single, decisive event, rather than any combination of events that is bad
    in sum. If we were to squander our future simply by continually treating each
    other badly, or by never getting around to doing anything great, this could be
    just as bad an outcome but wouldn''t have come about via a catastrophe.


    Alternatively, there might be a single catastrophe, but one that leaves open some
    way for humanity to eventually recover. From our own vantage, looking out to the
    next few generations, this may appear equally bleak. A thousand years hence it
    may be considered just one of several dark episodes in the human story. A true
    existential catastrophe must by its very nature be the decisive moment of human
    history—the point where we failed.


    Even large enough to bring the global collapse of civilization may fall short
    of being existential catastrophes. While colloquially referred to as “the end
    of the world,” a global collapse of civilization need not be the end of the human
    story. It has the required'
