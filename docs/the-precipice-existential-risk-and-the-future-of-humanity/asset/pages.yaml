    and must not be wasted on flawed narratives or ideas⁸


    Each chapter of The Precipice illuminates the central questions from a different
    angle. Part One (The Stakes) starts with a bird’s-eye view of our unique moment
    in history, then explains why it warrants urgent concern. Part Two (The Risks)
    delves into the science of the risks facing humanity, both from nature and from
    ourselves, showing that while some have been overstated, there is real risk and
    it is growing. So Part Three (The Path Forward) develops tools for understanding
    how these risks combine and, new strategies for addressing them. I close with
    a vision of our future: of what we could achieve we were to succeed.


    This book is not just familiar story of the perils of climate change or nuclear
    war. These risks that first awoke us to the possibilities of destroying ourselves
    are just the beginning. There are emerging risks, as those arising from biotechnology
    and advanced artificial intelligence, that may pose greater risk to humanity in
    the coming century.


    Finally, this is not a pessimistic book. It does not present an inevitable arc
    of history cublining in our destruction. It is not a morality tale about our technological
    hubris and resulting fall. Far from it. The central claim is that there are risks
    to our future, but that our choices can still make all the difference. I believe
    we are up to the task: that through our choices we can pull back from the precipice
