    times as much good for poverty as it could do for me, a lifelong pledge to donate
    a tenth of all I earn to help them.⁵ I founded a society, Giving What We Can,
    for those who wanted to join me, and was encouraged to see thousands of people
    come together to pledge more than £1 billion over our lifetimes to the most effective
    charities we know of, working on the most important causes. Together, we''ve already
    been able to transform the lives of thousands of people.⁶ And there are many other
    ways to spend our donations in which we can help fashion a better world, I helped
    start a wider movement, known as effective altruism, in which people aspire to
    evidence and reason to do as much as possible.


    Since there is so much work to do to fix the needless suffering in our present,
    I was slow to turn to the future. It was so much less visceral; so much more abstract.
    Could it be as urgent a problem as suffering now? As I reflected on the evidence
    and ideas that would culminate in this book, I came to realize that the risks
    to humanity’s future are as real and just as urgent—yet even neglected. And that
    the people of the future may be even powerless to protect themselves from the
