  md: 'an existential catastrophe. In assessing this, I have set aside the question
    of whether we could mitigate this risk. The most obvious and important form of
    mitigation is reducing our emissions. There is a broad consensus that this must
    play a key role in any mitigation strategy. But there are also ways of mitigating
    the effects of climate change after the emissions have been released.


    These techniques are often called geoengineering. While the name conjures a radical
    and dangerous scheme for transforming our planet, the proposals in fact range
    from the radical to the mundane. They also differ in their cost, speed, scale,
    readiness and risk.


    The two main approaches to geoengineering are carbon dioxide removal and solar
    radiation management. Carbon dioxide removal strikes at the root of the problem,
    removing the carbon dioxide from our atmosphere and thus taking away the source
    of heating. It is an attempt to cure the Earth of its affliction. At the radical
    end is ocean fertilization: seeding the ocean with iron to encourage large algal
    blooms that capture carbon before sinking into the deep ocean. At the mundane
    end are tree planting and carbon scrubbing.


    Solar radiation management involves limiting the amount of sunlight absorbed by
    the Earth. This could involve blocking light before it hits the Earth, reflecting
    more light in the atmosphere before it hits the surface, or reflecting more of
    the light that hits the surface. It is an attempt to offset the warming effects
    of carbon dioxide removal and quicker to act, but has the downsides of ignoring
    other bad effects of carbon (such as ocean acidification) and requiring constant
    upkeep.


    A central problem with geoengineering is that the cure may be worse than the disease.
    For the very scale of what it is attempting to achieve create a risk of massive
    unintended consequences over the entire Earth’s surface, possibly posing a greater
    existential risk than climate change itself. Geoengineering needs to be very carefully
    governed—especially when it comes to radical techniques that are cheap enough
    for a country or research group to implement unilaterally—and we shouldn''t rely
