    # ## NUCLEAR WEAPONS ACCIDENTS


    One may imagine that the enormous importance and obvious danger of nuclear weapons
    would lead to extremely careful management—processes that would always keep us
    far from accidental destruction. It is thus surprising to learn that there were
    many accidents involving nuclear weapons: a US Department of Defense report counts
    32 known cases.29 None of these involved an unexpected nuclear detonation, which
    speaks well for the technical safeguards that try to stop even an armed weapon
    whose conventional explosives detonate from creating a nuclear explosion. But
    they show how complex the systems of nuclear war were, with so many opportunities
    for failure. And they involve events one would never have thought possible if
    the situation was being handled with due care, such as multiple cases of nuclear
    bombs accidentally falling out of planes and the large number of lost nuclear
    weapons that have never been recovered.


    # List of Accidents


    +   **1957** A nuclear bomb accidentally fell through the bomb doors of a B-36
    bomber over New Mexico. The high explosives detonated, but there was no nuclear
    explosion.30


