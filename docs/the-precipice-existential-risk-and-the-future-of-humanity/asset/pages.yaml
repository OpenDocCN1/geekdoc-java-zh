  md: '# 5 Future Risks


    The Dark Ages may return, the Stone Age may return on the gleaming wings of Science,
    and what might now shower immeasurable material blessings upon mankind, may even
    bring about its total destruction.


    > —Winston Churchill¹


    It is now time to cast our gaze to the horizon, to see what possibilities the
    coming century may bring. These possibilities are hard to discern the haze of
    distance; it is extremely difficult to tell which new technologies will be possible,
    what form they will take when mature, or the context of the world into which they
    will arrive. And this veil may not lift until the new technologies are right upon
    us. Even for the best experts or the inventors of the technology can be blindsided
    by major developments.


    One night in 1933, the world’s pre-eminent expert on atomic science, Ernest Rutherford,
    declared the idea of harnessing atomic energy to be “moonshine. And the next morning
    Leo Szilard declared the idea of the chain reaction. In 1939, Enrico Fermi told
    Szil the chain reaction was a “remote possibility,” and four years later Fermi
    was personally overseeing the world’s first reactor. The staggering list of eminent
    scientists who thought heavier-than-air flight to be impossible or else decades
    away is so well rehearsed as to be cliché. But fewer know that even Wilbur Wright
    himself predicted it was at least fifty years away—just two years before he invented
    it²


    So we need to remember how quickly new technologies can be upon us, and to be
    wary of assertions that they are either impossible or so distant in'
  merge: -1
  pgno: 120
- img_proc: true
