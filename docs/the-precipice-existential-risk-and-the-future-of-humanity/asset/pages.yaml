  md: "# # APPENDIX G\n\n# ## EXTENDING THE KARDASHEV SCALE\n\nIn 1964, the Russian\
    \ astronomer Nikolai Kardashe devised a way of classifying potential advanced\
    \ civilizations by their physical scale and the power (energy per unit time) they\
    \ let harness. He considered three levels: planet, solar system and galaxy. In\
    \ each step along this scale, the power at their disposal leaps up by more than\
    \ a factor of a billion.\n\nWe can naturally extend this scale in both directions.54\
    \ We can include an earlier level for a minimal civilization (for example, the\
    \ size of civilization in Mesopotamia at the dawn of the written language).55\
    \ And we can include an ultimate level at the size of our affordable universe:\
    \ everything that we could ever hope to reach. Surprisingly, these jumps are very\
    \ similar in size to those Kardashov identified, continuing the roughly logarithmic\
    \ scale for measuring the power of civilizations.\n\n+   - Level K0\n Civilization\
    \ Size: Minimal\n Scale-up:\n Power: $\\approx 10^8$ W\n\n+   - Level K1\n Civilization\
    \ Size: Planetary\n Scale-up: $\times 1$ billion\n Power: $2\\times 10^{17}$ W\n\
    \n+   - Level K2\n Civilization Size: Stellar\n Scale-up: $\times 1$ billion"
