  md: 'I do not know what will come out of it. What ideas will stand the test of time;
    of careful analysis by thinkers of all kinds, each anxious to avoid any bias that
    may doom us to squander our potential. I do not know in what proportions it will
    be a vision of flourishing, of virtue, of justice, of achievement; nor what final
    form of these aspects may take. I do not know whether it will be a vision that
    transcends these very divisions in how we think of the good.


    We might compare our situation with that of people 10,000 years ago, on Imagine
    them sowing their first seeds and reflecting upon what opportunities a life of
    farming might enable, and on what the ideal world might look like. Just as they
    would be unable to fathom almost any aspect of our current global civilization,
    so too we may not yet be able to see the shape of an ideal realization of our
    potential.


    This chapter has focused on humanity’s potential—on the scope of what we might
    be able to achieve. Living up to this potential will be another great challenge
    in itself. And vast efforts will be undertaken in an attempt to rise to this challenge.
    But they can wait for another day. These battles can be fought by our successors.
    Only we can make sure we we get through this period of danger, that we navigate
    the Precipice and find our way to safety; that we give our children the very pages
    on which they will author our future.'
