  md: '# # APPENDIX E


    # THE VALUE OF PROTECTING HUMANITY


    Just how valuable is it to protect humanity? While we can''t answer with precision,
    there is a way of approaching this question that I''ve found helpful for my thinking.


    Let''s start with a deliberately basic model of existential risk. This model makes
    assumptions about three things: the pattern of risk over time, the way we could
    reduce this risk, and the value of the future. First, suppose that each century
    is exposed to an equal, but unknown, amount of existential risk, $r$ (known as
    a *constant hazard rate*). That is, given we reach a century, there is always
    a probability $r$ that we don''t make it to the next one. Next, suppose actions
    can reduce the probability of existential catastrophe for our century from $r$
    down to some smaller number. And finally, suppose that each century prior to the
    catastrophe has the same value, $v$, so the value of a future is proportional
    to its length before catastrophe. (This means there is no discounting of future
    value over and above the chance we don''t make it that far and we are making assumptions
    regarding population ethics)$^{46}$ Given these assumptions, the expected value
    of the population would be:


    ```

    EV(future) = \sum_{i=0}^{\infty} (1-r)^i v = \frac{v}{r}

    ```


    This is just the value of a single century divided by the century risk. For example,
    if the risk each century was one in ten, the expected value would be ten times
    the value of a single century.


    This leads to a surprising implication: that the value of eliminating all existential
    risk this century is independent of how much risk that is. To see this, imagine
    that existential risk were just one part in a million each'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'century. Even though there would be only the tiniest chance that we would fall
    victim to our century’s risk, the future we’d lose if we would be correspondingly
    vast (a million centuries, on average). On the basic model, these effects always
    balance. The expected disvalue of this century’s existential risk is just


    ```

    $$$r.EV(future) = r - \frac{\nu}{r} = \nu$$

    ```


    So the expected value of eliminating all risk over a century would simply be equal
    to the value of a century of life for humanity.47


    Since it would be impossible to completely eliminate all risk this century, it
    is more useful to note that on the basic model halving the century’s risk is worth
    half the value of a century of humanity (and it works the same way for any other
    fraction or timespan). This would be enough to make safeguarding our future a
    key global priority.


    However, the value of the basic model lies not in its accuracy, but in its flexibility.
    It is a starting point for exploring what happens when we change any of its assumptions.
    In my view, all three of its assumptions are too pessimistic.


    First, by many measures the value of humanity has increased substantially over
    the centuries. This progress has been very uneven over short periods, but remarkably
    robust over the long run. We live long lives filled with cultural and material
    riches that would have seemed like fantasy to our ancestors thousands of years
    ago. And the scale of our civilization may make: the fact that there are thousands
