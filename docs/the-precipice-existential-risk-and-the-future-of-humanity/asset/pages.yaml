  md: '# 8


    # # Our Potential


    It is possible to believe that all the past is but the beginning of a beginning,
    and that all that is and has been is but the twilight of the dawn. It is possible
    to believe that all the human mind has ever accomplished is but the dream before
    the awakening.


    > —H. G. Wells¹


    What could we hope to achieve? To experience? To become? If humanity rises to
    the challenges before us, navigates the risks of the coming centuries, and passes
    through a time of safety—what then?


    In the preceding chapters we have faced the Precipice, surveyed its challenges
    and planned how we might best proceed to safety. But what lies beyond? Let us
    raise our sights to the sweeping vista that beckons us. We cannot make out the
    details from here, but we can see the broad shape of the hills and valleys, the
    potential that the landscape offers—the potential of human civilization in its
    full maturity. It is because this potential is so vast and glorious, that the
    stakes of existential risk are so high. In optimism lies urgency.


    This chapter is about potential, not prophecy. Not what we will achieve, but what
    is open for us to achieve if we play our cards right; if we are patient, prudent,
    compassionate, ambitious and wise. It is about the canvas on which we shall work:
    the lengths of time open to humanity, the scale of our cosmos and the quality
    of life we might eventually attain. It is about the shape of the land we are striving
    to reach, where the greater part of human history will be written.'
