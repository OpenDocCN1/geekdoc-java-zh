    near Savannah, Georgia. The B-47 jettisoned its atomic bomb into the ocean. There
    are conflicting reports about whether it contained its atomic warhead, with the
    Assistant Secretary of Defense testifying to Congress that it did.31


    +   **1958** A B-47 bomber accidentally dropped a nuclear bomb over South Carolina,
    landing in someone''s garden and destroying their house. Frequently, its atomic
    warhead was still in the plane.32'
