    is preserved: that her best futures aren’t cut off due to accident, trauma or
    lack of education. It is important that her potential is protected: that we build
    in safeguards to make such a loss of potential extremely unlikely. And it is important
    that she ultimately fulfils her potential: that she ends up taking one of the
    best paths open to her. So too for humanity.


    Existential risks threaten the destruction of humanity’s potential. This includes
    cases where this destruction is complete (such as extinction) and where it is
    nearly complete, such as permanent collapse of civilization in which the possibility
    for some very minor types of flourishing remain, or where there remains some remote
    sense of recovery.⁵ I leave the thresholds vague, but it should be understood
    that in any existential catastrophe the greater part of our potential is gone
    and very little remains.⁷


    Second, my focus on humanity in the definitions is not supposed to exclude considerations
    of the value of the environment, other animals, successors to Homo sapiens, or
    creatures elsewhere in the cosmos. It is not that I think only humans count. Instead,
    it is humans the only beings we know of are responsive to moral and moral argument—the
    beings who can examine the world and decide to what is best. If we fail, that
    upward force, capacity to push toward what is best or what is just, will vanish
    from the world.


    Our potential is a matter of what humanity can achieve through the combined actions
    of each and every human. The value of our actions will stem in part from what
    we do and for, but it will depend on the effects of our actions on non-humans
    too. If we somehow give rise to new kinds of moral agents in the future, the term
    “humanity” in my definition should be taken to include them.


