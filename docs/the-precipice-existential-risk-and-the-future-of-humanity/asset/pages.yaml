    SAFEGUARDING HUMANITY


    There are no catastrophes that loom before us which cannot be avoided; there is
    nothing that threatens us with imminent destruction in such a fashion that we
    are helpless to do about it. If we behave rationally and humanely; if concentrate
    coolly on the problems that face all of humanity, rather than emotionally on such
    century matters as national security and local pride; if we recognize that it
    is not one’s neighbors who are the enemy, but misery, ignorance, and the cold
    indifference of natural law—then we can solve all the problems that we face. We
    can deliberately choose to have no catastrophes at all.


    > —Isaac Asimov¹


    What we do with our future is up to us. Our choices determine whether we live
    or die; fulfill our potential or squander our chance at greatness. We are not
    hostages to fortune. Each of our lives be tossed about by external forces—a sudden
    illness, or outbreak of war—humanity’s future is almost entirely within humanity’s
    control. Most existential risk comes from human action: from activities which
    we can choose to stop, or to govern effectively. Even the risks from nature come
    on sufficiently timescales that we can protect ourselves long before the storms
    break.


    We need to take responsibility for our future. Those of us alive right now are
