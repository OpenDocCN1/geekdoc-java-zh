  md: 'are timeless: to the extent that they succeed at all, they should help with
    future risk too.49 Work that helps with risk across many centuries would be much
    more important than the basic model suggests.


    When work reduces all future, the value of this work will now depend on the hazard
    rate, r. For example, the value of halving all future risk is:


    ```

    $$\frac{v}{r/2} - \frac{v}{r} = \frac{v}{r}$$

    ```


    Surprisingly, this value of reducing a risk in all time periods is higher when
    there is less risk.50 This is contrary to our intuitions, as people who estimate
    risk to be low typically use this as an argument prioritizing work on existential
    risk. But an intuitive way to see how low risk levels make reduction more important
    is that halving existential risk in all periods doubles the expected length of
    time before catastrophe. So situations where the risk is already low give us a
    longer time to double, making this work more important. Note also that this effect
    gives increasing marginal returns to further halvings of all risk.


    Third, and perhaps most importantly, the risk per century will change over time.
    It has risen over the last century and may continue to rise over the course of
    this century. But I think that in the longer run it will diminish, for several
    reasons. In the next centuries we will likely be able to establish permanent settlements
    beyond the Earth. Space is not a panacea (see here, but spreading our eggs across
    several baskets will help protect us against part of the risk. In addition, much
    of the risk is posed by the introduction of transformative new technologies. But
    if we survive long enough, we may reach technological maturity—a time when we
    possess all the major technologies that are feasible, and face no further technological
    transitions.51 Finally, we need to take into account the work that future generations
    will do to protect humanity in their own centuries. If the case for safeguarding
    humanity is as clear and powerful as it seems to me, then we should expect this
    to become more widely recognized, leading to increasing efforts to protect humanity
    in the future.


    If the risk does fall below its current level, that can make the future'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'substantially more valuable than the basic model suggests.52 The boost to the
    value depends roughly on the ratio between the risk over the next century and
    the longer term risk per century. For example, if there is one in ten chance of
    existential catastrophe this century, but this declined rapidly to a background
    natural risk rate of less than one in 200,000 per century, then the value of eliminating
    this century would be boosted by a factor of 20,000 compared to the basic model.


    It is also possible that reducing risk has less value than the basic model suggests,
    though this seems unlikely. One way this could happen if most of the risk were
    completely unprevent. This is not very plausible, since most of it is caused by
    human activities, and these are within humanity’s control. A second way is if
    the value of future centuries were rapidly declining. However, I can’t see why
    we should expect this: the long-run historical record shows the opposite, and
    we’ve seen that we shouldn’t discount the intrinsic value of our future. A third
    way is if adding the values of future times is ethically misguided—example, if
    we should be averaging the values of centuries, or ignoring all future generations.
    Though discussed in Appendix B, such alternative approaches have serious problems
    of their own. And a final way the true value might be less than the basic model
    suggests if the risk is low now, but will increase in the future, and if we can’t
    do much now to help with that later risk. This seems to me the most plausible
    way that this could be an overestimate.


    Overall, I find it substantially more likely that the basic view underestimates
    the value of safeguarding our future, than that it overestimates. But even if
    you thought one was roughly as likely as the other, not that their effects are
    not symmetrical. This is because you thought it equally likely the value of reducing
    risk was ten times as important as the basic model suggests, or a tenth as important.
    The average of these is not one times as important: it is 5.05 times as important.
    Unless we are highly confident that the basic model gives an overestimate, we
    should generally act as though it is an underestimate.53'
