  md: 'Humanity remains vulnerable to asteroids, comets, supervolcanic eruptions,
    supernovae and gamma ray bursts. The longer we are in a state where the threat
    is present and we are vulnerable, the higher the cumulative time we succumb. Our
    chance of surviving for a length of time is characterized by a decaying exponential,
    with a half-life set by the annual risk.59 When it comes to state, the faster
    we end our vulnerability, the better. If we need technology to end this vulnerability,
    then we would like to reach that technology as quickly as possible.


    But not all risks are like this.60 Some are transition risks: risks that arise
    during a transition to a new technological or social regime. For example the risks
    as we develop and deploy transformative AGI like this, as are the risks of climate
    change as we are transitioning to a high-energy civilization. Rushing the transition
    may do nothing to lower these risks—indeed it could easily heighten them. But
    if the transition is necessary or highly desirable, we may have to go through
    it at some point, so mere delay is not a solution, and may also make things worse.
    The general prescription for these risks is neither haste nor slowness, but care
    for foresight.


    We face an array of risks, including both state and transition risks.61 If my
    analysis is correct, there is substantially more transition risk than state risk
    (in large part because there is more anthropogenic risk). This suggests that rushing
    our overall technological progress is not warranted. The balance is set by our
    desire to reach a position of existential security while incurring as little risk
    as possible. My guess is that this is achieved by targeted acceleration of the
    science and technology needed to overcome the biggest state risks, combined with
    substantial foresight, carefulness and coordination on the biggest transition
    risks.


    While our current situation is unsustainable, that doesn’t mean the remedy is
    to try to achieve a more sustainable annual risk level as quickly as possible.
    Our ultimate goal is longterm sustainability: to protect humanity’s potential
