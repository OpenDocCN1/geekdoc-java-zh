    Correct calculations of relative importance of independent risks require the naïve
    ratio of probabilities to to be multiplied by an additional factor: the ratio
    between the chance the first catastrophe doesn''t happen and the chance the second
    catastrophe doesn''t happen.42 When the risks are small, the chance each catastrophe
