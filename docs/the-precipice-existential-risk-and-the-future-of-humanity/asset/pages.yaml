  md: 'Don''t regulate prematurely. At the right time, regulation may be a very useful
    tool for reducing existential risk. But right now, we know very little about how
    best to do so. Pushing for ill-considered regulation would be a major mistake.


    Don''t take irreversible actions unilaterally. Some countermeasures may make our
    predicament even worse (think radical geoengineering or publishing the smallpox
    genome). So we should be wary of the unilateralist''s curse (here), where the
    ability to take actions unilaterally creates a bias toward action by those with
    the most rosy estimates.


    Don''t spread dangerous information. Studying existential risk means exploring
    the vulnerabilities of our world. Sometimes this turns up new dangers. Unless
    we manage such information carefully, we risk making ourselves even more vulnerable
    (see the box “Information Hazards,” here).


    Don''t exaggerate the risks. There is a natural tendency to dismiss claims of
    existential risk as hyperbolic. Exaggerating the risks plays into that, making
    it much harder for people to see that there is sober, careful analysis amidst
    the noise.


    Don''t be fanatical. Safeguarding our future is extremely important, but it is
    not the only priority for humanity. We must be good citizens within the world
    of doing good. Boring others with endless talk about this cause is counterproductive.
    Cajoling them about why it is more important than what they hold dear is even
    worse.


    Don''t be tribal. Safeguarding our future is not left or right, not eastern or
    western, not owned by the rich or the poor. It is not partisan. Framing it as
    a political issue on one side of a contentious divide would be a disaster. Everyone
    has a stake in our future and we must work together to protect it. 69


    Don''t act without integrity. When something immensely important is at stake and
    others are dragging their feet, people feel licensed to do whatever-ver it takes
