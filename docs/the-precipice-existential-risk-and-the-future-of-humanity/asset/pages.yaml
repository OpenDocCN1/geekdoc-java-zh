  md: '# DYSTOPIAN SCENARIOS


    So far we have focused on two kinds of existential catastrophe: extinction and
    the unrecoverable collapse of civilization. But these are not the only possibilities.
    Recall that an existential catastrophe is the permanent destruction of humanity’s
    longterm potential, and that this is interpreted broadly, including outcomes where
    a small fragment of potential may remain.


    Losing our potential means getting locked in into a bad set of futures. We can
    categorize existential catastrophes by looking at which aspects of our future
    get locked in. This could be a world without humans (extinction) or a world without
    civilization (unrecoverable collapse). But it could also take the form of an unrecoverable
    dystopia—a world with civilization intact, but locked into a terrible form, with
    little or no value.116


    This has not happened yet, but the past provides comfort. For these kinds of catastrophes
    only became possible with the advent of civilization, so our track record is much
    shorter. And there is reason to think that the risks may increase over time as
    the world becomes more interconnected and with new technologies and ideologies.


    I won''t attempt to address these dystopian scenarios with the same level of scientific
    detail as the cases we''ve explored so far, for the scenarios are diverse and
    our understanding of them very limited.. Instead, my aim is to take some early
    steps toward noticing and understanding these very different kinds of failure.


    We can divide the unrecoverable dystopias we might face into three types, on the
    basis of whether they are desired by the people who live in them. There are possibilities
    where the people don''t want that world, yet the structure of society makes it
    almost impossible for them to coordinate to change it. There are possibilities
    where the people do want that world, yet they are misguided and the world falls
    short of what they could have achieved. And in between there are possibilities
    where only a small group wants that world but enforces it against the rest. Each
    of these types has different hurdles it would need to overcome in order to become
    truly locked in.'
