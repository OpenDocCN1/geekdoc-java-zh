    Following Bostrom, I shall call these “existential catastrophes,” defining them
    as follows:3


    An existential catastrophe is the destruction of humanity’s longtermterm potential.


    An existential risk is a risk that threatens the destruction of humanity’s longtermterm
    potential.


    These definitions capture the idea that the outcome of an existential catastrophe
    is both dismal and irrevocable. We will not just fail to fulfill the potential,
    but this very potential itself will be permanently lost. While I want to keep
    the official definitions succinct, there are several areas that warrant clarification.


    First, I am understanding humanity’s longterm potential in terms of all possible
    futures that remain open to us.4 This is an expansive idea of possibility, including
    everything humanity could eventually achieve, even if we have yet to invent the
    means of achieving it5 But it follows that our choices can lock things in, closing
    off possibilities, they can’t open up new ones. So any reduction in humanity’s
    potential should be understood as permanent. The challenge of our time is to preserve
    our vast potential, and to protect it against the risk of future destruction.
    The ultimate purpose is to allow our descendants to fulfill our potential, realizing
    one of the best possible futures open to us.


    While it may seem abstract at this scale, this is really a familiar idea that'
