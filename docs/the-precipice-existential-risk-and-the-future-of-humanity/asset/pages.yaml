    product of (1) the probability it starts, (2) the probability it reaches a global
    scale given it starts, and (3) the probability it causes extinction given it reaches
    a global scale:


    ```

    $P_{extinction} = P_{origin} \times P_{scaling} \times P_{endgame}$

    ```


