  md: 'action. Whether humanity survives this era is thus a choice humanity will make.
    But it is not an easy one. It depends on how quickly we can come to understand
    and accept the fresh responsibilities that come with our unprecedented power.


    This is a book about existential risks—risks that threaten the destruction of
    humanity’s longterm potential. Extinction is the most obvious way humanity’s entire
    potential could be destroyed, but there are others. If civilization across the
    globe be to suffer a truly unrecoverable collapse, that too would destroy our
    longterm potential. And we shall see that there are dystopian possibilities as
    well: we might get locked into a failed world with no back way.


    While this set of risks is diverse, it is also exclusive. So I will have to set
    aside many important risks that fall short of this: our topic is not new dark
    ages for humanity or the natural world (terrible though they would be), but the
    permanent destruction of humanity’s potential.


    Existential risks present new kinds of challenges. They require us to coordinate
    globally and intergenerationally, in ways that go beyond what we have achieved
    so far. And they require foresight rather than trial and error. Since they allow
    no second chances, we need to build institutions to ensure that our entire future
    we never fall victim to such a catastrophe.


    To do justice to this topic, we will have to cover a great deal of ground. Understanding
    the risks requires delving into physics, biology, earth science and computer science;
    situating this in the larger story of humanity requires history and anthropology;
    discerning just how much is at stake requires moral philosophy and economics;
    and finding solutions requires international relations and political science.
    Doing properly requires deep engagement with each of these disciplines, not just
    cherry-picking expert quotes or studies that support one’s preconceptions. This
    would be an impossible task for any individual, so I am extremely grateful for
    the extensive advice and scrutiny of dozens of the world’s leading researchers
    from these fields.⁴


    This book is ambitious in its aims. Through careful analysis of the potential
    of humanity and the risks we face, it makes the case that we live'
