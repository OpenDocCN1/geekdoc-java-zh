  md: 'We have made tremendous progress on violence and disease, but there is still
    so much room for improvement—still lives being broken or cut short. The development
    of anesthetics and pain relief has dramatically cut the prevalence of intense
    physical pain, yet we still live at a time with avoidable agony. We have made
    great progress in freeing people from absolute poverty, but a tenth of us still
    live under its shadow. And when it comes to relative poverty, to severe depression,
    to racism and sexism, we are far from a solution.


    Many of the harshest injustices visited our fellow humans are behind us. While
    from year to year it can be hard to tell if things are getting better or worse,
    on the scale of centuries we have seen a clear decline in persecution and intolerance,
    with a marked rise in personal freedoms and political equality. Yet even in the
    most progressive countries we have a long way to go, and there are still parts
    of the world that have barely begun the journey.


    And there are further injustices inflicted upon the billions of animals in the
    modern industry and in the natural world. Our civil awakening to the plight of
    animals and our environment came very recently, in the wake of the severe harms
    inflicted upon them by industry in the twentieth century. But we increasingly
    see such harms for what they are, and have begun the fight to end these new forms
    of injustice.


    These blights upon our world must end. And we can end them—if we survive. In the
    face of persecution and uncertainty, the noblest among our ancestors have poured
    their efforts into building a better and more just world. If we do the same—and
    give our descendants a chance to do the same—then with our knowledge, invention,
    coordination and abundance grow, we can more and fulfill the fierce hope that
    has flowed through so many strands of the human project: to end the evils of our
    world and build a society that is truly just and humane.


    And even such a profound achievement might only set the stage for what is to come.
    Our full potential for flourishing remains undreamed.


