  md: '# APPENDIX F


    # POLICY AND RESEARCH RECOMMENDATIONS


    For ease of reference, I’ve gathered together my recommendations for policy and
    research on existential risk.


    Asteroids & Comets


    +   * Research the deflection of 1 km+ asteroids and comets, perhaps restricted
    to methods that couldn’t be weaponized such as those that don’t lead to accurate
    changes in trajectory.

    * Bring short-period comets into the same risk framework as near-Earth asteroids.

    * Improve our understanding of the risks from long-period comets.

    * Improve our modeling of impact winter scenarios, especially for 1–10 km asteroids.
    Work with experts in climate modeling and nuclear winter modeling to see what
    modern models say.


    Supervolcanic Eruptions


    +   * Find all the places where supervolcanic eruptions have occurred in the past.

    * Improve the very rough estimates on how frequent these eruptions are, especially
    for the largest eruptions.

    * Improve our modeling of volcanic winter scenarios to see what sizes of eruption
    could pose a plausible threat to humanity.

    * Liaise with leading figures in the asteroid community to learn lessons from
    them in their modeling and management.'
