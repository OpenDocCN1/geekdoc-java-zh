  md: '# APPENDIX D


    # SURPRISING EFFECTS WHEN COMBINING RISKS


    We have seen a number of counterintuitive effects that occur when we combine individual
    existential risks to get a figure for the total existential risk. These effects
    get stronger, and stranger, the more total risk there is. Since the total risk
    includes the accumulated existential risk over our entire future, it may well
    be high enough for these effects to be significant.


    First, the total risk departs more and more from the sum of the risks. Suppose
    we face four 50 percent risks. logic dictates that they must overlap substantially
    and combine to something less than their sum. For example, if they were independent,
    the total risk would not be 200 percent, but 93.75 percent (= 15/16).


    Second, there can be substantial increasing returns if we eliminate more and more
    risks. For example, eliminating the first of four independent 50 percent risks
    would only reduce the total risk to 87.5 percent. By eliminating the subsequent
    risks would make more and more headway: to 75 percent, then 50 percent, then 0
    percent—a larger absolute effect each time. Another way to look at this is that
    eliminating each risk doubles our chance of survival and has a larger absolute
    effect the higher our chance of survival is. Similarly, if we worked on all four
    risks in parallel, and halved the risk from each (from 50 percent to 25 percent),
    the total risk would only drop from 93.75 percent to about 68 percent. But if
    we halved them all a second time, the risk would drop by a larger absolute amount,
    to about 41 percent. What is happening in these examples is that there is so much
    overlap between the risks that the catastrophe is undetermined, and the total
    remains high when we act. But our action also helps to reduce this overlap, allowing
    further actions to be more helpful.'
