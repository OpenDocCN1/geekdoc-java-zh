  md: 'injustice; of splintering the unity of humanity; of unanticipated consequences
    stretching over vast spans of time. Some of these risks are existential. Replacing
    ourselves with something much worse, or something devoid of value altogether,
    would put our entire future in jeopardy, as would any form of enhancement that
    could lead to widespread conflict or social collapse. But forever preserving humanity
    as it is now may also squander our legacy, relinquishing the greater part of our
    potential.


    So I approach the possibility of transforming ourselves with cautious optimism.
    If we can navigate its challenges maturely, such transformation offers a precious
    opportunity to transcend our limitations and explore more deeply just how good
    life can be. I love humanity, not because we are Homo sapiens, but because of
    our capacity to flourish, and to bring greater flourishing to the world around
    us. And in this most important respect, our descendants, however different, could
    reach heights that would be forever beyond our present grasp.


    # CHOICES


    I have sketched three dimensions of humanity’s potential: the vistas of time,
    space and experience that the future holds. My concern has not been to paint a
    detailed picture, but to persuade you, more generally, that we stand before something
    extraordinarily vast and valuable—something in light of which all of history far
    will seem mere prelude; a taste; a seed. Beyond these outlines, the substance
    of our future is mostly unknown. Our descendants will create it.


    If we steer humanity to a place of safety, we will have time to think. Time to
    ensure that our choices are wisely made; that we will do the very best we can
    with our piece of the cosmos. We rarely reflect on what that might be. On what
    we might achieve should humanity’s entire will be focused on gaining it, freed
    from material scarcity and internal conflict. Moral philosophy has been focused
    on the more pressing issues of treating each other decently in a world of scarce
    resources. But there may come a time, not too far away, when we mostly have our
    house in order and can look in earnest at where we might go from here. Where we
    might address this vast question about our ultimate values. This is the Long Reflection.'
