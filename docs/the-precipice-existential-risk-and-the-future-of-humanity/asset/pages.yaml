    then even on Ramsey’s view, we could bring our cosmos to its full scale; make
    it worthy of our awe. And it appears to be only us who can bring the universe
    to such full scale, we may have an immense instrumental value, which would leave
    us at the center of this picture of the cosmos. In this way, our potential, and
    the potential in the sheer scale of our universe, are interwoven.


    # QUALITY


    We have seen that the future is a canvas vast in time and space. Its ultimate
    beauty will depend on what we paint. Trillions of years and billions of galaxies
    are worth little unless we make of them something valuable. But here too we have
    grounds for profound optimism. For the potential quality of our future is also
    beyond imagining.


    As we’ve seen, human life is on the whole much better today than ever before.
    Compared with our ancestors, we have less to fear from disease, from hunger and
    from each other. We have conquered polio and smallpox. We have created vaccines,
    antibiotics and anesthetics. Humans today are less likely than any point in the
    history of civilization to live in slavery or poverty; to be tortured, maimed
    or murdered; to starve. We have greater freedom to choose our loves, our beliefs,
    our leaders and the courses of our lives. Many of our children have access to
    opportunities that would astound ancestors—opportunities to learn, play and experiment;
    to travel; to engage with the greatest novels, poems and philosophies; to experience
    a lifetime’s variety of harmonies, sights and flavors; and to contemplate truths
    about the cosmos unknown to our most learned ancestors.


    Yet human life, for all its joys, could be dramatically better than it is today.'
