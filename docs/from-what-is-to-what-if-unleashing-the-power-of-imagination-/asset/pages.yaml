    One of the most successful manifestations of deliberative democracy is citizens’
    assemblies. The idea dates back to ancient Greece, but its more modern manifestation
    begins in British Columbia, where the province’s government created a citizens’
    assembly in 2004 to review the province’s electoral system and to recommend changes
    to it, committing to a province-wide referendum based on its recommendations.
    One hundred and sixty people were chosen at random, with the constraint that the
    body must include a man and a woman from each of the province’s seventy-nine electoral
    districts and two citizens representing aboriginal communities.


    Beginning in 2004, the Citizens’ Assembly On Electoral Reform met periodically
    on weekends for eleven months, during which participants learned about the electoral
    system, discussed it, and took part in fifty hearings across the province, where
    they listened to concerns and perspectives on the electoral process from citizens
    and a range of constituency groups. From this process, the Citizens’ Assembly
    drafted a series of recommendation, captured in a report called Making Every Vote
    Count. The recommendations were put to a referendum, which failed to pass by 2.31
    percent. (The bar for passing had been put very high, requiring a 60 percent majority
    to pass.) Reflecting on the process, its chair, Jack Blaney, wrote: ‘The members
    of the Citizens’ Assembly ... demonstrated how extraordinary ordinary citizens
    are when given an important task, and the resources and independence to do it
    right.’


    The most established example of citizens’ assemblies is probably in Ireland. In
    2008 the economy collapsed, revealing the extent to which politics and big finance
