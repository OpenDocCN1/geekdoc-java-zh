  md: 'Research by Schooler and colleagues asked subjects to the Torrance Tests of
    Creative Thinking, and then broke them into three groups for a twenty-minute break.
    One group did nothing at all during the break. The second was given a demanding
    task which offered no opportunity for mind wandering, and the third had a non-demanding
    task that offered the opportunity for mind wandering. When they returned to the
    creativity tests, those who had the non-demanding task with the best conditions
    for mind wandering came up with the most creative answers to the test.^20 As Schooler
    told me, this may be one of the reasons why people often report creative ideas
    in the shower. It’s an activity that ‘requires doing things but it’s not a very
    demanding activity.’^21 Sherry Turkle puts it in this way: ‘Our brains are most
    productive when there is no demand that they be reactive.’^22


    As we fill more and more of our mind-wandering time with screens, social media
    and random business, we need to ask: what is the impact on our ability to think
    imaginatively? The and physicist Leonard Mlodinov explains in his book Elastic
    ‘as our DMNs are sidelined more and more, we have less focused time for our extended
    internal dialogue to proceed. As a result, we have diminished opportunities to
    string together these random associations that lead to new ideas and realisations.’^23


    I asked Larry Rosen, a professor emeritus of psychology at California State University,
    whose work focuses on the psychological impacts of new technologies, how he sees
    the overlap between imagination and attention. He told me that abstract thinking,
    vital to our ability to be imaginative, is ‘taking ideas from other places in
    your brain – things you’ve heard, things you’ve done, things you’ve thought –
    and putting them together in unique but valuable ways. We don’t have the attention
    to do that anymore, and it’s not just young people. It’s everybody.’ I asked why
    he thought that might be, that we are seeing this precipitous collapse of attention,
    and he told me, ‘I would say that our imagination – is probably on the decline
    exactly in the opposite trend of our time spent on smartphones.’^24 As he and
    Adam Gazzaley noted in The Distracted Mind, ‘We appear to have lost the ability
    to simply be alone with our thoughts.’^25 In a troubling corollary, addiction
    specialist Bruce K. Alexander told me'
