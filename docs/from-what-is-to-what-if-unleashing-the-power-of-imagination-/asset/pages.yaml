    in five hundred streets across the country, most notably in Leeds, Hackney, Worthing
    and North Tynes. But Bristol is the epicentre, with sixty streets closing down
    on a regular basis. Having an organisation in place has made the legalities of
    closing a street a lot simpler. For starters, thanks to the new Temporary Streets
    Play Order, added by Bristol Council to the Town Police Act of 1847, groups can
    now apply for a year''s worth of dates in one go, rather than having to make a
    series of separate applications.


    This ‘really good thing’ of letting children play in the street has so many unexpected
    benefits: It offers kids a blank canvas (unlike, say, computer games, which you
    usually move through levels of someone’s devising). It encourages play that is
    spontaneous and inventive. Street play helps build confidence. Being out of the
    house is the first step feeling confident about interacting with others. After
    an afternoon of playing in the street, a kid might then feel more confident about
    venturing afield, walking to the school next day. Street play is also, to blind
    the obvious, on the family’s doorstep, not requiring a walk, or drive, to the
    park or playground. It brings communities together, enabling residents to meet
    one another and build relationships. This familiarity increases the neighbourhood’s
    social resilience, making it a safer and more gratifying place to live. And the
    play can be ‘semi-supervised’, so adults can get things done, knowing that the
    kids are being watched.


