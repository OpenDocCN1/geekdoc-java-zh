    When I say this has been a what-if adventure, I am especially pleased that the
    almost one hundred people interviewed for this book, only about a quarter of them
    were known to me before I began this project. The rest I have uncovered as I''ve
    gone alone, told by someone else or somewhere. While some interviews were done
    in person, the majority were done by Skype.


    It feels important to note here that although I interviewed people in the United
