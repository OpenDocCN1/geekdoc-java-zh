  md: '# CHAPTER 8


    # What If Our Leaders Prioritised the Cultivation of Imagination?


    The inability to imagine a world in which things are different is evidence only
    of a poor imagination, not of the impossibility of change.


    > —RUTGER BREGMAN, Utopia for Realists


    Most of the institutions shaping the world today are incapable of imagining anything
    other than their everlasting existence. And so things carry on, no matter how
    toxic, how ridiculous, or how contrary to values that most people share. The US
    military, for example, is unable to imagine anything other than its own global
    dominance, forever. As the author Robert Koehler puts it, ‘They’re capable of
    imagining nothing else… There’s nothing in this controlling consciousness devoted
    to creating – or imagining – a world without nuclear weapons or a world free of
    war and poverty. That’s not part of the future “America” has any interest in envisioning.
    The next war is utterly unquestioned. “Us vs. them” is utterly unquestioned. There
    will always be enemies. What would we do without them?


    This chapter is dedicated to perhaps the most audacious whatif questions of all:
    What if our leaders cared about harnessing the collective imagination to solve
    our greatest challenges, signalled a real commitment to it and demonstrated it
    in their own policymaking and political maneuvering? What if they understood that
    our survival depends on being able to focus our full attention and imagination
    on the challenges'
