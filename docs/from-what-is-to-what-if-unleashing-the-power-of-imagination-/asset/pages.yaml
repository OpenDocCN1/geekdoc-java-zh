    To a large degree, at least for now, we''re on our own. In the absence of meaningful
    leadership from tech companies or government, we need to do the best we can to
    take matters into our own hands. That often looks like small acts of resistance
    throughout the day. We need to free ourselves from the belief that multitasking
    is an achievable way of working. It isn''t. Multitasking just means doing things
    more badly. People who multitask by frequently checking their email suffer a reduction
    in intelligence equivalent to exhaustion or smoking marijuana.43 When we multitask,
    we overload the brain, and the processing shifts from the hippocampus, which enables
    us to remember and imagine, to the striatum, which is responsible for rote tasks.44
    This makes it harder for us to learn a task or, after a period of multitasking,
    to remember what we were doing.


    One study at the University of Lough found that after reading an email, which
    took two minutes on average, it took people an average of sixty-eight seconds
    to return to their work and remember what they were doing.45 It is estimated that
    unnecessary and the time needed to get our back on track after being distracted
    from our original task consume an average of 28 percent of our working day.46
    This disengagement of the hippocampus, and inability to just focus on one thing,
    reduces our capacity to be imaginative in a focused way. Research also shows that
    zipping from task to task rather than just focusing on one thing is more tiring.
    Focusing on one thing, such as an hour''s deep reading, is far less draining and
    requires less mental energy than attempting to multitask.


    We also need to cultivate our tolerance for boredom. Boredom is not always a great
    thing. Having a boring job can take its toll on our health and relationships and
