  md: '# Afterword


    A couple of weeks before I finished writing this book, I was in Exeter to support
    my son and the many other young people gathering there – and across the country
    – for the United Kingdom''s first School Strike 4 Climate. Inspired by Swedish
    teenage climate activist Greta Thunberg, and by similar strikes already under
    way in other countries, about felt eight hundred young people had gathered outside
    the offices of Devon County Council.


    They were demanding that the government declare a climate emergency, that the
    National Curriculum be reformed to reflect the urgency of that climate energy,
    that the government inform the public about the need to act on climate change
    and that the voting age be lowered to sixteen. All had taken the day off school,
    with some with their school''s support (my son''s school laid on a bus), and others
    in spite of threats of punishments.


    There were banners, placards, chanting, shouts of ‘What do we want? Climate justice!’
    and ‘Whose future? Our future!’ It felt hopeful, hugely empowering and very noisy.
    After an hour or so, I noticed people around me looking across the park we were
    in and pointing. Coming over the horizon was another group of about three hundred
    young people, singing their own songs, striding with purpose and focus, clasping
    their banners and flags. The reinforcements had arrived.


    The young person addressing our group pointed them out, and the group turned to
    cheer them out. The group grew and grew, and kept on coming. As they came together,
    both groups cheered to welcome the other. I asked one of the new arrivals who
    who were. said, ‘We’re from the university, but as we walked we picked up more
    and more people.’'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'I noticed that at the back of the group, which was still arriving, was a large
    banner with just two words, WHAT IF? It was the work of a group of students who,
    a few days earlier, had attended one of my workshops about this book. They had
    been fired by ‘what if’, and spent the evening trying to think of ways to bring
    that spirit to the day''s activities.


    The reaction to the school strike from the powers that was predictable. Prime
    Minister Theresa May said, ‘Disruption increases teachers’ workloads and lesson
    that teachers have carefully prepared for.’ Minister Leadsom tweeted, ‘It’s called
    truancy, not a strike.’ However, there was also a lot of support from people across
    the political spectrum, which was reflected later that morning when the group
    marched en masse to the centre of the city, past traffic with people waving and
    beeping their support.


    The students with the WHAT IF? banner then set inviting people to complete cards
    that started with the words WHAT IF? And they helped print T-shirts with the words
    WHAT IF? I was struck that simply asking the question raised many of the subjects
    we’ve explored in this book. Responses included, ‘What if we stopping at screens?’,
    ‘What if we were taken seriously?’, ‘What if people paid attention?’, ‘What if
    we all starting the same song?’, ‘What if people listened to kids?’, ‘What if
    climate change was an entire subject?’


    Reflecting on why she liked HAVING IF? on her new T-shirt, one girl replied: ‘It
    leaves an open question. If someone were to ask what it’s, for I would bring up
    the topic of climate change and that it’s February, and it’s warm, and I’m quite
    happy just wearing a T-shirt, and I’d ask, ‘What would your answer be? What if?’¹


    Here was the next generation: informed, passionate, committed, articulate. And
    here was a movement that maybe, just maybe, would grow and grow, and from this
    day, its inception (in the United Kingdom at least), focus on ‘what if’ as well
    as it is. A movement that ingeniously created and held what-if spaces. That would
    tell stories about the future we dream of, founded on the idea of creating ‘memories
    of the future’. That would sustain itself with a powerful sense of standing up
    against those negligent in their duty taste of care for the future, but also by
    the stories they share. It was a delicious taste of the possible.'
