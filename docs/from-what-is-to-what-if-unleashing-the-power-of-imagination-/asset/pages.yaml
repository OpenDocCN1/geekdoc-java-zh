  md: 'Dr Kim''s comments and her findings prompted me to look more closely at my
    life and my community, and what I see people grappling with in the world. It seems
    as though most of us have less and less space to think creatively or imaginatively,
    if at all. Even among people who work within the ‘creative industries’, their
    imagination seems increasingly harnessed to create demand for things nobody really
    needs, whose production is increasingly pushing our human and ecological systems
    to the brink of collapse – almost as if imagination has been coopted in the service
    of our out extinction.


    But if imagination is exactly what we need to prevent it?


    There is a body of research to suggest that it is. Imagine that you are holding
    a lemon in your hand. Feel its cool skin against your palm. See its bright yellow
    colour. Run your fingertips over its shiny textured surface. Throw it in the air
    and catch it again, feeling the weight in your hand as it lands. Then, with your
    other hand, reach for a knife and cut the lemon in half. Pick up one half and
    squeeze it into a glass, hearing the drops fall. Smell the aroma of the fresh
    lemon juice. As you squeeze the lemon, some of it squirts into your eye.


    When psychologists conduct this exercise, they often observe that, at this point,
    people wince, just if they actually squeezed lemon juice in their eye. The human
    imagination is a powerful thing. It is not only about images and the ability to
    hold a picture in our mind. It is multisensory, encompassing smell, touch, sound,
    emotion and taste. It is more able to effect change than you might think. As we
    know from the field of positive psychology, imagining a certain outcome can increase
    the likelihood of its coming to pass.


    In a 1995, Dr Alvaro Pascual-Leonard of Harvard Medical School followed two groups
    of novices learning to play a sequence of notes on the piano. Each group practised
    for two hours a day for five days, but one group actually played the piano while
    the other sat at the piano and imagined playing it. After three days, members
    of each group had the same ability and showed similar changes in their brains,
    whether they had played it or not. After five days, members of the group that
    actually played were marginally more advanced, but members of the other group
    caught up quickly²25'
