  md: '# ABOUT THE AUTHOR


    ![](img/01317ca67a378ed50cbc980441bc2cff_212_0.png)


    ROB HOPKINS is a co-founder of Transition Town Totnes and Transition Network,
    and the author of *The Power of Just Doing Stuff, The Transition Handbook,* and
    *The Transition Companion*. In 2012 he was voted one of the Independent''s top
    100 environmentalists and was on Nesta and the *Observer*''s list of Britain''s
    50 New Radicals. Hopkins has also appeared on BBC Radio 4''s *Four Thought* and
    *A Good Read*, in the French film phenomenon *Demain* and its sequel *Apres Demain*,
    and has spoken at TEDGlobal and three TEDx events. As an Ashoka Fellow, Hopkins
    holds a doctorate degree from the University of Plymouth and has received two
    honorary doctorates from the University of the West of England and the University
    of Namur. He is a keen gardener, a founder of New Lion Brewery in Totnes, and
    a director of Totnes Community Development Society, the group behind Atmos Totnes,
    an ambitious community-led'
