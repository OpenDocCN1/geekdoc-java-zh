  md: '# CHAPTER 4


    # # What If We Fought Back to Reclaim Our Attention?


    If consumer capitalism can only go on by continuing to accelerate the ‘intensification
    of nervous stimulation’, there would seem to be a fundamental antagonism between
    this form of economic life and the individual who inhabits it.


    > —MATTHEW B. CRAWFORD, The World Beyond Your Head


    We are experiencing in our times a loss of depth – a loss, that is, of the very
    paradigm of depth.


    > —SVEN BIRKERTS, The Gutenberg Elegies


    Imagine, if you will, Vincent van Gogh in Arles, in August 1888. It is a late
    summer’s day with the mistral winds blowing through the street outside. He has
    just got back to his small studio in what he calls the Yellow House which he dreams
    one day be to home to a community of artists. He is carrying with him a bunch
    of sunflowers, a gift from his friend, the gardener Patience Escalier, whose portrait
    he completed a few days earlier. He arranges them loosely in a glazed earthenware
    pot on the plain wooden table.


    And instead of what history tells us happens next, imagine he were to sit down,
    get out his smartphone and check his Instagram feed for updates. Soon he is also
    checking his Facebook timeline and his Twitter account and,'
  merge: -1
  pgno: 74
- img_proc: true
  md: 'before he knows it, an hour has passed and he finds himself on YouTube watching
    videos of skateboarders falling down stairs. Thus distracted, his attention is
    taken firmly away from the possibility of *really* seeing those sunflowers, immersing
    himself in their shapes, forms and colours, the way the light plays on them, and
    how he emotionally relates to them. Forever to future generations would be the
    resultant paintings, which have moved, fascinated and enchanted generations ever
    since.


    What, if that matter, Albert Einstein had stayed inside posting Instagram photos
    of his breakfast rather than taking his long, dreamy bike rides? Or if William
    Wordsworth and his sister Dorothy had been checking their social media accounts
    while they walked straight past that famous ‘host of golden daffodils’ at Glencoyne
    Bay at Ullswater in the Lake District in 1802? If Mikhail Bulgakov had been a
    YouTube star instead of writing *The Master and Margarita*? What would we have
    lost? More to the point, what works of inspired genius might we be losing right
    now, as we can summon? As Sherry Turnbull, Abby Mauzé Professor of the Social
    Studies of Science and Technology at the Massachusetts Institute of Technology,
    puts it, ‘we are forever elsewhere.’


    Of course the technology we benefit or suffer from, depending on how you look
    at it, wasn''t a factor for Van Gogh, Einstein, the Wordsworth siblings or Bulgakov.
    They didn''t have to make a choice countless times throughout the day whether
    or not to look at their phone. They didn''t have to summon willpower or figure
    out hacks to make it less distracting. They didn''t have to decide whether to
    bring it with them, shut it off, or put it on vibrate just in case someone they
    love or for urgently needed to reach them. They could sit, uninterrupted, for
    hours, giving their entire unintended attention to a problem, or to pondering
    a bunch of sunflowers on that kitchen table in Arles. The ability to have such
    focus meant Van Gogh was able to reflect ‘when nature is so beautiful, I am not
    conscious of myself any more, and the picture comes to me as if in a dream.’


    Who knows what their relationship to technology would have been? They were lucky
    not to have to figure that out. They never experienced the technological tyranny
    of most us now live, and that''s part of gave'
