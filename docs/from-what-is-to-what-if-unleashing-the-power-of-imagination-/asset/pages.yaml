  md: 'for most of us. The risk is that a digital world leads to our getting stuck
    in the present and we start to lose sight of looking towards the future with hope,
    optimism and imagination. The future starts to fade away.


    What if we begin to value our attention as the blessing and birthright (and responsibility)
    it is – what should we do? I think we decide, in ways large and small, to fight
    like hell to get it back. As design ethicist James writes in Stand Out of Our
    Light, ‘The liberation of human attention may be the defining moral and political
    struggle of our time. Its success is prerequisite for the success of virtually
    all other struggles.’31 We need what the author Tim Wu calls a ‘human reclamation
    project’. Over the coming century,’ he writes ‘the most vital human resource in
    need of conservation and protection is likely to be our own consciousness and
    mental space.’32 What are the stakes here? American critic Jonathan Beller, in
    his essay ‘Paying Attention’, writes about a future where our attention spans
    have collapsed entirely, a world where ‘humanity has become its own ghost.’33


    What does fightback look like in real life? Well, for starters there are the small
    things: We can remove the social media apps from our phones and change the colour
    display to black and white, which lessens the allure of many of the more addictive
    features; notification alerts that keep us reaching for the phone are often red.
    We can have digital-free days, or weekends, or holidays, as the Tincar Project’s
    Slow Sunday, ‘a weekly day of rest, away from screens and all things digital.’34
    There are apps, as Mute, Space and Hold that track our use, which most people
    considerably underestimate, and nudge us towards cutting down. We can impose a
    curfew on ourselves and on our kids, making sure our screens are turned off at
    a certain point in the evening. We can buy an alarm clock and get the smartphones
    out of the bedroom. The smartphone packs many different functions into one device,
    which is part of its appeal, but if we start to break that back down by wearing
    a watch, carrying a separate camera, a notebook, and finding other ways of listening
    to music, we can start to break its hold over us. We can embrace a more comprehensive
    approach, termed ‘digital minimalism’, where we review each of the tools we use,
    and rather than being at their mercy, we embark on a thirty-day ‘digital declutter’
    and then introduce only those tools that serve a specific purpose to our lives.’35'
