    Neuroscience tells us that amazing things happen when we listen to and tell stories.
    When we listen to a lecture about climate change, for example, with PowerPoint
    slides, graphs and bullet points, the parts of our brain that show we are listening
    and the part where words are processed both light up. But when we listen to a
    story, something very different happens. First of all, the same parts of the storyteller’s
    brain light up together. And if we are listening to a story in which someone kicks
    a ball, for example, the part of our brain that coordinates foot motion activates.
    That is, we experience the story, rather than just absorbing information. We understand
    it more deeply. We retain it for longer. As author Annie Paul puts it, ‘The brain
    ... does not make much of a distinction between reading about an experience and
    encountering it in real life; in each case, the same neurological regions are
    stimulated.³


