  md: 'Frankly, at this point, I consider imagining the future in a positive way an
    act of immense courage, resistance, of rebellion.


    And yet, imagining the future in positive ways is also, in some respects, our
    natural condition. As Donella Meadows puts it:


    Children, before they are squashed by cynicism, are natural visionaries. They
    can tell you clearly and firmly what the world should be like. There should be
    no war, no pollution, no cruelty, starving children. There should be music, fun,
    beauty, and lots and lots of nature. People should be trustworthy and growups
    should not work so hard. It’s fine to have nice things, but it’s even more important
    to have love. As they grow, children learn that these visions are ‘childish’ and
    stop saying them out loud. But inside all of us, if we haven’t been too bruised
    by the world, they are glorious visions.⁸


    Research by Denise Baden, an associate professor in business ethics at the University
    of Southampton, backs up the power of glorious visions. Baden gave ninety-one
    volunteers two stories to read about the negative impacts of climate change. One
    was set at the end of the world, and in the other, a woman is caught in a flood.
    The volunteers read two positive stories. In one, someone created a ‘flower bomb’,
    which covered a bare public area with flowers, and in the other, a young boy is
    inspired by a TV programme to collect plastic to keep it out of the sea. The volunteers
    asked how the different stories had made them feel, and what, any actions inspired.
    Most people said the negative stories left them feeling passive despair, hopelessness
    and discouragement. ‘It made me angry and I switched off,’ said one person. The
    response to the positive stories was very different. People reported feeling happy
    and motivated to do something.’The story made me think about what I can do, ‘I
    realised from my research’, Baden reflected, ‘that we desperately need cultural
    offerings with positive visions of what a sustainable society might look like,
    to inspire hope and positive change.¹⁹


    And, in fact, people are creating those ‘cultural offerings’, although not always
    through traditional storytelling, and you may need to look around to find it.
    One powerful, if counterintuitive, is through the visual arts.'
