    Why do I start this final chapter with The Sultan’s Elephant? Because awe is an
    undervalued emotion. The root of the word is in Old English and Norse and refers
    to the sense of fear and dread we feel in the face of a divine being. In the mid-1700s,
    it was reserved for religious experiences. Then Irish philosopher Edmund Burke
    used the word to describe vast, powerful things we don’t understand – it could
    just as easily be nature, looking at the stars or being moved by a piece of fiction
    or music. In 2015, Paul Piff and his colleagues at the University of California
    wrote that central to experiences of awe are ‘perceptions of vastness that dramatically
    expand the observer’s usual frame of reference in some dimension or domain’.


    When people experience awe – being immersed in the raw power of nature, gazing
    at a feat of architecture such Chartres Cathedral, witnessing a selfless act of
    heroism or bravery, seeing a musical, artistic or athletic virtuoso, being present
    for an era-defining shift, standing in the crowd while a charismatic leader delivers
    a momentous address, or simply watching the light through autumn leaves – two
    key features define it: The first is a sense of vastness – whether vastness of
    space, time, beauty, understanding or connection – that makes us smaller and experience
    a dissolution of the self. The other is the need to adjust our understanding of
    the world, in order to accommodate the experience, or at least try to.


    ‘Experiences of awe redefine the self in terms of the collective and orient our
    actions toward the interests of others,’ writes Daniel Keltner, a professor of
    psychology at University of California. Research shows that experiencing awe can
    shift people from self-interest to collective interests, can bring about boosts
    in generosity, ethical behaviour, altruism and compassion, can improve our health
    and can stimulate wonder and curiosity.


