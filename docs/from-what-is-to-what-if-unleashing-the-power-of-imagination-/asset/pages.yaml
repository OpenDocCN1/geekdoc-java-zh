    It helps you to break apart stored energy so you can outrun danger, play dead
    or stand fight. High levels of cortisol, however, can damage or destroy hippocampal
    cells, reducing the hippocampus''s overall size and volume. When a woman experiences
    stress during pregnancy, for example, its impact can be passed down a generation,
    affecting her child''s brain development, including impairment and decreased volume
    of the hippocampus. Researchers can actually observe the hippocampus contracting
    during stages of high anxiety and fear.19


