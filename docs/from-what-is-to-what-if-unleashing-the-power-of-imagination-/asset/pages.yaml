  md: '# PRAISE FOR

    FROM WHAT IS TO WHAT IF


    “A serious book on an important subject. Without imagination, where are we?”


    —SIR QUENTIN BLAKE


    “Rob Hopkins has long been a leader in imagining how we could remake our societies
    for the benefit of nature and humankind. His new book is a powerful call to imagine
    a better world. It should be widely read and appreciated.”


    —CHRISTIANA FIGUERAS, former executive secretary, United Nations Framework Convention
    on Climate Change; lead negotiator,


    “Few things distinguish human beings from the rest of life on Earth. The most
    important are our unique powers of imagination. Ironically, our we use—and abuse—of
    those powers have now wrought a complex crisis in our relationships with the planet
    and with each other. As Rob Hopkins eloquently shows in this powerful and passionate
    book, to survive and thrive we have become more imaginative, not less, in how
    we live, work and connect. He demonstrates the transformative power of imagination
    in all areas of our lives and the dangers of its neglect, especially in the education
    of our children. *From What Is To What* takes us on an inspiring and urgent tour
    of the people and communities around the world that we are reimagining the present
    to create more hopeful and sustainable futures for us all.”


    —SIR QUENT ROBINSON, educator; *New York Times* best-selling author


    Day after day, week after week, the climate is changing and biodiversity is fading
    away. For a long time we needed to look the other way, but now, being on the edge
    of the climate crisis forces us to demand that we must act now. And because of
    this emergency it is our duty to join forces. Not only among states, but among
    mayors, NGOs, associations, and citizens. Among all those who are determined to
    act here and now.


    “Towns and cities have already begun transition. Together, mayors have chosen
    to press ahead toward a healthier and safer world. Whether in Paris or in Tokyo,
    initiatives are being launched and encouraging us to shift from ‘why not’ to ‘how’
    and from ‘how’ to ‘when’. The movement must gain momentum and expand.


    “We must act wherever we are with the resources we have at our disposal to fight
    global warming. It’s no longer about thinking global and acting local; it’s about
