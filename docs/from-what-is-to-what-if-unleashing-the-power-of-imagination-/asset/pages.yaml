    of the test group had no contact with a therapist at all, and yet they kept losing
    weight. This is almost unheard of; with most approaches, in that second months,
    people put around 50 percent of what they lost. What Andrade and May discovered
    is that once people have internalised the skills to imagine a future in which
    they have reached their desired weight or pattern of behavior, they no longer
