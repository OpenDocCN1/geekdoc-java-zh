  md: '# CHAPTER 5


    # What If School Nurtured

    Young Imaginations?


    If you design a system to do something specific, don''t be surprised if it does.
    If you run an education system based on standardisation and conformity that suppresses
    individuality, imagination and creativity, don''t be surprised if that''s what
    it does.


    > SIR KEN ROBINSON, Creative Schools


    Imagine for a moment — give yourself some time, because this might require a fair
    amount of imagining — that you left school age eighteen, or twenty-two, or whenever,
    feeling alive, empowered and excited for the future, as you set off with a spring
    in your step, eager to build your life and rebuild the world. Imagine you felt
    no fear in your mind about how you would make your way in the world, find your
    place, support yourself, and have a good life according to your own definition
    and values. Imagine that your sense of imagination felt more vibrant and dynamic
    than it did when you were a child, not relegated to a past at all, but honored
    and honed almost to a superpower, so that you were ready to call on it for every
    decision you needed to make.


    Imagine that you loved your education and felt blessed and grateful to have it,
    something of real, unique to you, that nobody could ever take away. Imagine that
    it involved grappling with questions that mattered to you and solving problems
    that felt relevant, to which no single solution existed? Imagine that you learned
    the people’s history and that it helped you find common ground with others, so
    that you felt you could go anywhere'
