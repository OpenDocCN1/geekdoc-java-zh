    I believe, as Gabriela Gómez-Mont put it, ‘imagination is not a luxury.’ If Kyung
    Hee Kim put it right, and our imagination has been declining since the mid-1990s,
    it at least explains what we are seeing in the world today. For Dr Peter Gray
    wrote in 2012: ‘Well, surprise, surprise. For several decades as a society have
    been suppressing children''s creativity to ever greater extents, and now we find
    that our creativity is declining.’37 It wasn''t as though some people didn see
    this coming.


    We recognise that if a population is sufficiently nourished, we will see a decline
    in health and a rise in preventable illnesses. We recognise if we fail to give
    a population a good education, it will fail to reach its potential. Yet the neglect
    of the imagination is generally overlooked, seen as a frivolous distraction from
    the overarching building of economic growth and technological progress. We saw
    in Reggio Emilia what the creation of a system of education designed specifically
    to prevent the resurgence of fascism would look like, yet we have designed an
    education system which it almost its opposite. We can see in Barcelona and Spanish
    ‘municipal’ cities what a model of democracy invites the imagination could look
    like, in most other places, we persist in moving further and away from such a
    thing. We saw at Art Angel what an approach to mental health that puts safety,
    hope and imagination at its heart would look like, yet most people''s experience
    is just the opposite. Our imagination isn''t accidentally dwindling; it is being
    co-opted, suffocated, corrupted and starved of the oxygen it needs.


    We have relegated the imagination to the margins for too long, and now, as Robert
    Louis Stevenson put it, ‘sit down to a banquet of consequences’. Our failure to
    create the conditions, the spaces, the opportunities and the invitations for the
    imagination, and the implementation of political programmes as austerity, directly
    smash to pieces much of most of us need in order to live imaginative lives. We'
