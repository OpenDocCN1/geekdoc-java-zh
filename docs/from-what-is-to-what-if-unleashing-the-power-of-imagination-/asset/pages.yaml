    ‘Focusing the creative energy on a narrower field of exploration allows for a
    more in-depth processing of fewer alternatives. Once a frame is in place, the
    focus can shift to creating something memorable within it.’12 So perhaps, with
    imagination, the things that currently look like intractable problems are actually
