    The bus turning off Tooting High Street in South London is an unloved place, home
    to buses idling their engines next to homes that overlook the constant coming
    and going, noise and exhaust fumes. From one side, opposite the houses, is a huge
    Primark store. The circle is a place that is as unremarkable as it is loved, a
    grey space people walk without noticing, not a place people would ever meet or
    stop to have a conversation. Tooting itself is a district that lacks a centre,
    heart, a village green, being largely strung along its busy High Street, one of
    London’s main arterial roads. But if there were a circle to Tooting, it would
    be a place that inspires much joy, carnival or creativity – and certainly not
    dancing in the street.


    Until, that is, members of Transition Tooting (TTT) looked at the bus turning
    circle with fresh eyes and asked, ‘What if this turning circle were, in fact,
    our village green?’¹


