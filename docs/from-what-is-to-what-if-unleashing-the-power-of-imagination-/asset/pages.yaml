    se, however. The question simply begins to open the door, creating a crack through
    which we might push and rush to the other side. It is an invitation as much as
    a question. It is the beginning of that, what the authors Eric Liu and Scott Noppe-Brandon
    call the move ‘from what is to what if’.^3At a time when spaces seem in short
    supply, ‘What if ...’ becomes the perfect antidote to ‘There is no alternative.’


    As TTT organiser Lucy Neal told me during the Tootoring Twirl, the event created
    the expectation of change, seeding the idea in peoples'' imaginations, so that
    nobody can say it’s not possible. ‘What we have today is evidence,’ she said.
    ‘When a proposal is made, no one can say it’s not possible. It is absolutely possible
    to move the buses. We’ve done that. The joy and the delight of this is to step
    forward a bit, to be a little daring and a bit courageous saying, ‘Well, what
    if we did that?’ We have just played with that idea of what could be possible.
    But nobody say after today that it’s not possible’.^4


    What was so brilliant about asking ‘What if this turning circle were, in fact,
    our village green?’ is that left within is enough space for other people to ask
    different questions, new questions, to consider their place, their role in it,
    and at the same time remain safe, celebratory – an element of freedom and an element
    of constraint. All too often that is not the experience of consulting others,
    where the outcome has already been determined by the organisers or experts, and
    there’s no role for others to step into.


    What makes a good what-if question? Ruth Ben-Tovim of Encounters Arts (who describe
