  md: 'ECN is active when we bring our attention to focus outwardly completing a task,
    the default mode network (DMN) is active when we are focused inward reflectively
    and the salience network monitors and modulates the two. (The hippocampus, by
    the way, sits at the heart of these three networks.) Imagine, for example, that
    you''re intensely writing a screenplay to a deadline. Your ECN is outwardly focused
    on completing it, while your DMN or ‘Imagination Network’, as Scott Barry Kaufman
    of the Imagination Institute calls it – inwardly focused on conjuring the creative
    work.^17


    Some people also refer refer to the DMN as the ‘daydreaming network’, since that’s
    how we experience it. The DMN creates a space in our mental life to think divergently,
    expansively, and to integrate different ideas, possibilities and scenarios, often
    without our even realising it. The result? New associations form and unexpected
    solutions to complex problems emerge – often effortlessly, it seems. In other
    words, the DMN is where attention and imagination meet.


    Have you ever struggled to figure something out, only to find that once you stopped
    thinking about it, the solution became clear? People who understand this, even
    subconsciously, will go for a walk or sleep on a problem rather than continue
    to chew on it unproductively. The mathematician Andrew talks about his ‘3B Mantra’:
    his best ideas come when he gives his conscious time and space to wander, ideally
    on the bus, in bed or in the bath.^18 Whenever I found myself stuck writing this
    book, I headed out for a short bicycle ride, under some trees, up a hill, and
    by the time I returned home, the right idea would have arrived.


    The DMN likes tasks that require a little of our attention but also leave enough
    freedom for the mind to wander. Things such as knitting, podding peas, weeding
    – things we do less than we used to. Jonathan Schooler, a professor at the Department
    of Psychology and Brain Science at the University of California, Santa Barbara,
    and one of the world’s authorities on daydreaming and the DMN, told me there are
    things that seem to engage: being at rest with nothing very demanding to do; thinking
    about the self, or self-related ideas, or social situations; and creative problem
    solving. It’s the network that ‘the mind naturally gravitates to when given any
    other demands.^19'
