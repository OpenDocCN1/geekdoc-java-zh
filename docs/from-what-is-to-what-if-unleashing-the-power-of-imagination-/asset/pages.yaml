    Let''s, for example, that I want to lose weight. I am determined to succeed, but
    am then faced with the temptation of a chocolate éclair, which overrides my desire
    to be fit and trim. But what happens if we imagine our life as a fit and trim
    person, to such a degree that we can actually see what we look like as our muscles
    start to develop tone they didn''t have before; feel our exuberance as we run
    around the yard with our grandchildren; relish the warmth of the sun on our skin
    while we were out for a joy; experience the post-run endorphins while we shower
    and then step back into life. If, Andrade and May argue, we imagine that, really
    imagine that, the next éclair would have far less power over compared to the tangibility
    of our longer-term goal.


    Their research suggests it works. In a three-year trial, Andrade and May found
    that, over the course of six months, test subjects had up to four hours of FIT
    through a therapist, they lost an average of 4 kg, compared to members of a control
