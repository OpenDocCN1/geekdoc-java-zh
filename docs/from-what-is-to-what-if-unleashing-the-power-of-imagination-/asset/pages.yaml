  md: 'are living through a perfect storm of factors ruinous to the imagination. As
    we face vast crises that demand imaginative and urgent responses and a reimagining
    of everything, we are simply not up to it. This is really serious. Which makes
    it all the more important to reprioritise it as rapidly, and in many ways and
    places, as we can.


    It is my hope that this book might prompt reconsider of the strategies used by
    organisations and campaigns working in responses to the challenges we are facing,
    that they might work to make sure the expression of a positive vision of how the
    future could turn out, their dream of it, comes through loudly, imaginatively
    and passionately in all that they do. The physicist and writer Peter Russell described
    this cultivation of a collective vision to me as acting like a strange attractor
    in chaos theory, something you throw in front of yourself which draws you towards
    it, like a whirlpool.³⁸ While many of the technologies, economic models and know-how
    for creating a future in which we can all thrive already exist, what is missing
    is the *longing*. Imagination is important because it helps us create, and if
    we can get that right, other things then follow.


    I have taken you with me on a two-year exploration of the state of health of our
    collective imagination, the factors that might be behind this situation, and what
    we might do about it. I hope that, above all, I have managed to communicate what
    it feels like when the imagination is invited, cherished and cared for. Whether
    sitting listening to the dawn chorus, watching dots being added to a painting
    at Art Angel, or standing in Les Petits Producteurs in Liège, I recognised the
    same sense of possibility, the same spark.


    I dream these twenty years when the climate crisis, the collapse of the world''s
    biodiversity, the unravelling of democracy and the multitude of other challenges
    converging on us with great urgency has been slowed down and even turned around,
    the years when the great rebuilding is well under way, will be the time of our
    lives. I dream that because imagination is at its heart, it will be a time of
    great music, great writing, great conversation, great dancing. Our streets will
    fill and with the unexpected, with mime artists directing the traffic. Our lives
    will fill with everyday awe.


    Our governments will learn from schools like Plymouth School of Creative Arts
    that great leaps forward come when people are invited to'
