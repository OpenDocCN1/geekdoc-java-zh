    the people who take on the role of future generations. As Saijo notes, they develop
    what he calls ‘futureability’: an increase in happiness as a result of deciding
    and acting for future benefits as long as it enriches future generations.³35 Research
    shows that people who take the role find a lot of joy in acting as the future
    representative, and that it starts to occur naturally in their lives, in other
    groups and organisations that they are part of. Saijo’s approach is being used
    by several Japanese municipalities, and he is developing plans for a National
    Ministry of the Future, a new ministry within government who would scrutinise
    all government policies, and while there is nothing in the idea — the Iroquois,
    for example, included the voices of future generations in their decision-making
    for many hundreds of years — Saijo’s approach offers fascinating insights into
    how taking that role of speaking for future generations impacts and affects the
    people who take it on, both in the sessions and beyond.


    I wrote this book because I wanted to put the imagination back at the heart of
    how we think about the future, and about what kind of future we might create.
    Not a perfect, utopian future, but a future that recognises the limits imposed
    by circumstance as opportunities, and responds with imagination and favourite,
    creating a future where things turn out OK. One of my interviews was with performing
    artist, author, activist and educator Dominique Christina, who told me, in her
    opinion, all too often, when we are exploring how to address a problem, we became
    fixated on that problem: ‘The problem is now in the centre of the room’, she told
    me. ‘Whatever is not working, or whatever is dysfunctional, what’s taking up all
    the space.... The brokenness [becomes] everything.’


    She went on,


    there are enough amazing, miraculous, impossible, supernatural people on this
    planet who love this planet and who operate from goodness and integrity and accountability.
    But we get so bogged down in staring straight into the abyss that we’ve lost'
