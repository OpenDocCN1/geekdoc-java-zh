  md: '# STAR WARS REBEL JAIL


    What comes next for the Rebels after the events of Vader Down? Find out the adventures
    of Luke Skywalker and friends continue! The Rebel crew are en route to a prison
    base with a very important captive. But, unlike them, they aren''t the only ones
    with their eyes on this prize! And, in another tale from the journals of Obi-Wan
    Kenobi, journey back to the Jedi''s days of exile on Tatooine. Moisture farmer
    Owen Lars may have taken in young Luke, but refused to let Ben be part the boy''s
    life. Now, prepare to discover the reason why!


    ![](img/e3085fc4b1510fb275af5c6325040f94_31_0.png)


