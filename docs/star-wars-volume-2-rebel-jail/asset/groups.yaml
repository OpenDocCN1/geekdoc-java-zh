    # 反叛军监狱：第二卷


    AARON YU ALANGUILAN GHO


    # 反叛军监狱：第二卷


    这是一个让反叛军重燃希望的时代。


    在险些逃脱了与达斯·维德的又一次恐怖遭遇后，反叛军英雄卢克·天斯沃克、莱娅公主和汉·索罗，将邪恶的西西斯领主的秘密盟友、机器人与武器专家阿芙拉博士囚禁在“千年隼夺号”上。


    现在，他们将银河系从皇帝手中解放出来的任务仍在继续：公主与走私者萨娜·斯塔罗斯斯会合，而卢克和汉则为了反叛军的一项秘密任务而并肩作战……


