  \ 和 except 块是如何工作的？\n\n`try` 块中的语句首先执行。如果没有发生异常，则将跳过 `except` 子句，并完成 `try` 语句的执行。如果在执行\
  \ `try` 块期间发生任何异常，`try` 语句的剩余部分将被跳过。\n\n`try` 块后面可以跟多个 `except` 子句，如果 `try` 块中抛出的异常与某个\
  \ `except` 子句中的异常匹配，则执行该特定的 `except` 子句。\n\n如果发生的异常与 `except` 子句中指定的异常不匹配，它将传递给外层的\
  \ `try` 语句；如果没有找到处理器，则它将是一个未处理的异常，并通过抛出异常消息停止执行。\n\n`try` 块可以跟随多个 `except` 子句。\n\
  \n`test.py`\n\n```python\nwhile True:\n    try:\n        x = int(input(\"Enter divisor\
  \ \"))\n        y = int(input(\"Enter dividend \"))\n        print(x/y)\n      \
  \  break\n    except ValueError:\n        print(\"Please enter valid number\")\n\
  \    except ZeroDivisionError:\n        print(\"y should be non zero\")\n```\n\n\
  `$ python3 test.py`\n\nEnter divisor 2\nEnter dividend 0\ny should be non zero\n\
  \nEnter divisor 4\nEnter dividend 0\ny should be non zero\n\nEnter divisor 4\nEnter\
  \ dividend 2\n2.0\n\n### 在单个 except 子句中处理多个异常\n\n`except` 子句可以捕获多个一个异常。例如 `except\
  \ (ValueError, ZeroDivisionError)` 可以同时处理 `ValueError` 和 `ZeroDivisionError`。\n\n\
  `test.py`\n\n```python\nwhile True:\n    try:\n        x = int(input(\"Enter divisor\
  \ \"))\n        y = int(input(\"Enter dividend \"))\n        print(x/y)\n      \
  \  break\n    except (ValueError, ZeroDivisionError):\n        print(\"Please enter\
  \ valid number (or) y should be greater than 0\")\n```\n\n`$ python3 test.py`\n\n\
  Enter divisor 2\nEnter dividend 0\nPlease enter valid number (or) y should be greater\
  \ than 0\n\nEnter divisor aa\nPlease enter valid number (or) y should be greater\
  \ than 0\n\nEnter divisor 2\nEnter dividend 4\n0.5\n\n### 最后一个 except 子句可以省略异常名称。它被用作全局异常处理器。\n\
  \n`test.py`\n\n```python\nwhile True:\n    try:\n        tempList = []\n       \
  \ print(tempList[10])\n        break\n    except ValueError:\n        print(\"Please\
  \ enter valid number\")\n    except ZeroDivisionError:\n        print(\"y should\
  \ be non zero\")\n    except Exception as inst:\n        print(\"Global handler\"\
  , inst)\n        break\n```\n\n`$ python3 test.py`\n\nGlobal handler list index\
  \ out of range\n\n### try…except…else 子句\n\n`try…except` 语句可以有一个可选的 `else` 子句，它位于\
  \ `except` 子句之后。如果 `try` 块没有抛出任何异常，将执行 `else` 子句。\n\n`test.py`\n\n```python\nwhile\
  \ True:\n    try:\n        x = int(input(\"Enter divisor \"))\n        y = int(input(\"\
  Enter dividend \"))\n        print(x/y)\n    except ValueError:\n        print(\"\
  Please enter valid number\")\n    except ZeroDivisionError:\n        print(\"y should\
  \ be non zero\")\n    else:\n        print(\"Program executed successfully\")\n\
  \        break\n```\n\n`$ python3 test.py`\n\nEnter divisor 4\nEnter dividend 2\n\
  2.0\nProgram executed successfully\n\n## 异常参数\n\n每当发生异常时，它与一个名为异常参数的变量关联。\n\n`test.py`\n\
  \n```python\nwhile True:\n    try:\n        x = int(input(\"Enter divisor \"))\n\
