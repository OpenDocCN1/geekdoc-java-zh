    # Python: Operators


    An operator is a symbol, which perform an operation. Following are the operators
    that supports:

    - Arithmetic Operators

    - Relational Operators

    - Assignment Operators

    - Logical Operators

    - Bitwise Operators

    - Membership Operators

    - Identity Operators


    ## Arithmetic Operators in python


    Following are the arithmetic supported by python.


    | Operator | Description | Example |

    | :--- | :--- | :--- |

    | + | Addition | 2+3 |

    | - | Subtraction | 2-3 |

    | * | Multiplication | 2*3 |

    | / | Division always returns a float value. To get integer result use `//`. |
    2/3 returns 0.6666666666666666 |

    | // | Floor division discards the fractional part | 2//3 returns 0 |

    | % | Returns the remainder of the division. | 2%3 |

    | ** | Power | 2**3 returns 8 |


    ```

    >>> 4+2

    6

    >>> 4-2

    2

    >>> 4/2

    2.0

    >>> 4//2

    2

    >>> 4**2

    16

    ```


    ## Relational Operators in python


    Relational operators determine if one operand is greater than, less than, equal
    to, or not equal to another.


    | Operator | Description | Example |

    | :--- | :--- | :--- |

    | == | Equal to | `a==b` returns true if `a` is equal to `b`, else false. |

    | != | Not equal to | `a!=b` returns true if `a` is not `b`, else false. |

    | > | Greater than | `a>b` returns true if `a` > `b`, else false. |

    | >= | Greater than equal to | `a>=b` returns true if `a` >= `b`, else false.
    |

    | < | Less than | `a<b` returns true if `a` < `b`, else false. |

    | <= | Less than equal to | `a<=b` returns true if `a` <= `b`, else false. |


    ```

    >>> a=10

    >>> b=12

    >>> a==b

    False

    >>> a!=b

    True

    >>> a>b

    False

    >>> a>=b

    False

    >>> a<b

    True

    >>> a<=b

    True

    ```


    ## Assignment operators in python


    Assignment operators are used to assign value to a variable. Following are the
    assignment operators provided by python.


    | Operator | Description |

    | :--- | :--- |

    | = | `a=10` assigns 10 to variable `a` |

    | += | `a+=10` is same as `a=a+10` |

    | -= | `a-=10` is same as `a=a-10` |

    | *= | `a*=10` is same as `a*10` |

    | /= | `a/=10` is same as `a/10` |

    | //= | `a//=10` is same as `a//10` |

    | %= | `a%=10` is same as `a%10` |

    | **= | `a**=10` is same as `a=a**10` |


    ```

    >>> a=10

    >>> a

    10

    >>> a+=10

    >>> a

    20

    >>> a-=10

    >>> a

    10

    >>> a*=10

    >>> a

    100

    >>> a/=10

    >>> a

    1.0

    >>> a//=10

    >>> a

    1.0

    >>> a**=10

    >>> a

    1.0

    ```


    ### Multiple Assignments


    You can assign values to multiple variables simultaneously.


    ```

    >>> a, b, c = 10, ''hello'', 12.345

    >>> a

    10

    >>> b

    ''hello''

    >>> c

    12.345

    ```


    ## Logical Operators in python


    Following are the logical operators supported by python.


    | Operator | Description |

    | :--- | :--- |

    | and | `a and b` returns true if both `a`, `b` are true. Else false. |

    | or | `a or b` return false, if both `a` and `b` are false, else true. |

    | not | `not a` Returns True if `a` is false, true otherwise |


    ```

    >>> a=bool(0)

    >>> b=bool(1)

    >>> a

    False

    >>> b

    True

    >>> a and b

    False

    >>> a or b

    True

    >>> not a

    True

    >>> not (a and b)

    True

    >>> not ( a or b)

    False

    ```


    ## Bitwise Operators in python


    Python supports following bitwise operators, to perform bit wise operations on
    integers.


    | Operator | Description |

    | :--- | :--- |

    | >> | bitwise right shift |

    | << | bitwise left shift |

    | & | bitwise and |

    | ^ | Bitwise Ex-OR |

    | | | Bitwise or |

    | ~ | Bitwise not |


    Following post, explains bitwise operators clearly.


    ```

    >>> a=2

    >>> a>>1

    1

    >>> a<<1

    4

    >>> a&3

    2

    >>> a|3

    3

    >>> ~a

    -3

    ```

