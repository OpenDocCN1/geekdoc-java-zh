    \ to end. |\n\n>>>  objects\n\n[1, 3, 'Hello', 10.23]\n\n>>>  objects[-1]\n\n\
    10.23\n\n>>>  objects[-3]\n\n3\n\n>>>  objects\n\n[1, 3, 'Hello', 10.23]\n\n>>>\n\
    \n>>>  objects[:]\n\n[1, 3, 'Hello', 10.23]\n\n>>>\n\n>>>  objects[2:]\n\n['Hello',\
    \ 10.23]\n\n>>>\n\n>>>  objects[:3]\n\n[1, 3, 'Hello']\n\n>>>\n\n>>>  objects[-2:]\n\
    \n['Hello', 10.23]\n\nConcatenate two lists\n\n'+' Operator is used to concatenate\
    \ two lists.\n\n>>>  even=[2,  4,  6,  8,  10]\n\n>>>  odd=[1,  3,  5,  7,  9]\n\
    \n>>>  numbers  = even+odd\n\n>>>  numbers\n\n[2, 4, 6, 8, 10, 1, 3, 5, 7, 9]\n\
    \nLists are mutable; you can change the values of list.    \n\n>>>  numbers\n\n\
    [2, 4, 6, 8, 10, 1, 3, 5, 7, 9]\n\n>>>  numbers[0]=12\n\n>>>  numbers[1]=14\n\n\
    >>>  numbers\n\n[12, 14, 6, 8, 10, 1, 3, 5, 7, 9]\n\nAdd elements to end of list\n\
    \nList provides ‘append’ method to add new elements to the end of a list.    \n\
    \n>>>  numbers\n\n[12, 14, 6, 8, 10, 1, 3, 5, 7, 9]\n\n>>>\n\n>>>  numbers.append(11)\n\
    \n>>>  numbers.append(13)\n\n>>>\n\n>>>  numbers\n\n[12, 14, 6, 8, 10, 1, 3, 5,\
    \ 7, 9, 11, 13]\n\nAssignment to slices\n\nIf you want to replace sequence of\
    \ elements in a list, you can use slice notation.\n\nnumbers[2:5] = [21, 22, 23]\n\
    \nAbove statement replace elements at index 2, 3, 4 with 21, 22, 23 respectively.\n\
    \nnumbers[:] = []\n\nAbove statement clear the list by replacing all the elements\
    \ with an empty list. \n\n>>>  numbers\n\n[12, 14, 6, 8, 10, 1, 3, 5, 7, 9, 11,\
    \ 13]\n\n>>>\n\n>>>  numbers[2:5]=[21,  22,  23]\n\n>>>  numbers\n\n[12, 14, 21,\
    \ 22, 23, 1, 3, 5, 7, 9, 11, 13]\n\n>>>\n\n>>>  numbers[:]  = []\n\n>>>  numbers\n\
    \n[]\n\nGet length of the list\n\nBy using ‘len’ function, you can get the length\
    \ of the list.\n\n>>>  vowels=['a',  'e',  'i',  'o',  'u']\n\n>>>  len(vowels)\n\
    \n5\n\nNested lists\n\nA list can be nested in other list. For example, in below\
    \ example, numbers contains 3 lists, first list represent odd numbers, second\
    \ list represent even numbers and third list represent prime numbers.\n\n>>> \
    \ numbers=[[1,  3,  5,  7],[2,  4,  6,  8],[2,  3,  5,  7,  11]]\n\n>>>  numbers\n\
    \n[[1, 3, 5, 7], [2, 4, 6, 8], [2, 3, 5, 7, 11]]\n\n>>>\n\n>>>  numbers[0]\n\n\
    [1, 3, 5, 7]\n\n>>>\n\n>>>  numbers[1]\n\n[2, 4, 6, 8]\n\n>>>\n\n>>>  numbers[2]\n\
    \n[2, 3, 5, 7, 11]\n\n>>>\n\n>>>\n\n>>>  len(numbers)\n\n3\n\n>>>  len(numbers[0])\n\
    \n4\n\n>>>  len(numbers[1])\n\n4\n\n>>>  len(numbers[2])\n\n5\n\n>>>\n\n>>>  numbers[0][1]=9\n\
    \n>>>  numbers[1][1:4]  =[10,  12,  14]\n\n>>>  numbers\n\n[[1, 9, 5, 7], [2,\
    \ 10, 12, 14], [2, 3, 5, 7, 11]]\n\n# Python: tuples\n\nA tuple is just like a\
    \ list, consist of number of values separated by commas.\n\nDifferences between\
    \ tuple and list\n\na.   List is mutable, where as tuple is immutable\n\nb.   Tuple\
    \ can contain heterogeneous data, where as list usually contains homogeneous data.\n\
    \ntest.py\n\nemployee=(1,  \"Hari Krihsna\",  \"Gurram\",  12345.678)\n\nprint(employee)\n\
    \nprint(employee[0])\n\nprint(employee[1])\n\nprint(employee[2])\n\nprint(employee[3])\n\
    \n$ python3 test.py\n\n(1, 'Hari Krihsna', 'Gurram', 12345.678)\n\n1\n\nHari Krihsna\n\
    \nGurram\n\n12345.678\n\nAs you observe above example, elements in tuple are enclosed\
    \ in parenthesis. Eventhough tuples are immutable, you can create tuples which\
    \ contain mutable objects, such as lists.\n\ntest.py\n\nemployee=(1, [])\n\nprint(employee)\n\
    \nemployee[1].append(2)\n\nemployee[1].append(4)\n\nemployee[1].append(6)\n\n\
    print(employee)\n\n$ python3 test.py\n\n(1, [])\n\n(1, [2, 4, 6])\n\nPacking and\
    \ unpacking\n\nYou can define tuples, without using parenthesis.\n\nFor example,\n\
    \nemployee=1, \"Hari Krihsna\", \"Gurram\", 12345.678\n\nAbove one is the example\
    \ of tuple packing.\n\nid, firstName, lastName, salary = employee\n\nAbove one\
    \ is an example of tuple unpacking. Sequence unpacking requires that there are\
    \ as many variables on the left side of the equals sign as there are elements\
    \ in the sequence.\n\ntest.py\n\nemployee=1,  \"Hari Krihsna\",  \"Gurram\", \
    \ 12345.678\n\nid, firstName, lastName, salary  = employee\n\nprint(id)\n\nprint(firstName)\n\
    \nprint(lastName)\n\nprint(salary)\n\n$ python3 test.py\n\n1\n\nHari Krihsna\n\
    \nGurram\n\n12345.678\n\nConcatenate tuples\n\n‘+’ operator is used to concatenate\
    \ tuples.\n\n>>> tuple1=(1,  \"HI\",  2,  45.65)\n\n>>> tuple2=(\"abcdef\",  54,\
    \  67)\n\n>>> tuple3=tuple1+tuple2\n\n>>> tuple3\n\n(1, 'HI', 2, 45.65, 'abcdef',\
    \ 54, 67)\n\nSlicing\n\nJust like lists, you can access tuples using slice notation.\n\
    \n| Example | Description |\n\n| tuple[start:end] | Returns tuple from index start\
    \ (included) to end index (excluded). |\n\n| tuple[:end] | Returns tuple from\
    \ index 0(included) to end index (excluded). |\n\n| tuple[start:] | Return tuple\
    \ from index start to till end. |\n\n| tuple[-2:] | Return elements from 2nd last\
    \ to end. |\n\n>>>  tuple1\n\n(1, 'HI', 2, 45.65)\n\n>>>  tuple1[0:]\n\n(1, 'HI',\
    \ 2, 45.65)\n\n>>>  tuple1[:]\n\n(1, 'HI', 2, 45.65)\n\n>>>  tuple1[:3]\n\n(1,\
    \ 'HI', 2)\n\n>>>  tuple1[2:5]\n\n(2, 45.65)\n\n‘*’: Repeat tuple elements\n\n\
    ‘*’  is the repetition operator, used to repeat the elements of tuple.\n\n>>>\
    \  tuple1\n\n(1, 'HI', 2, 45.65)\n\n>>>\n\n>>>  tuple1*3\n\n(1, 'HI', 2, 45.65,\
    \ 1, 'HI', 2, 45.65, 1, 'HI', 2, 45.65)\n\n>>>\n\nRemove tuple elements\n\nAs\
    \ I said, tuples are immutable, so it is not possible to remove elements from\
    \ tuple. But you can remove the entire tuple using del statement.\n\n>>>  tuple1=(1,\
    \  \"HI\",  2,  45.65)\n\n>>>\n\n>>> del tuple1\n\n>>>  tuple1\n\nTraceback (most\
    \ recent call last):\n\nFile \"<stdin>\", line 1, in <module>\n\nNameError: name\
    \ 'tuple1' is not defined\n\nObserve the output, an exception raised; this is\
    \ because after deletion, tuple does not exist any more.\n\n# Python: Sets\n\n\
    Set is an unordered collection of elements with no duplicates. We can perform\
    \ union, intersection, difference, and symmetric difference operations on sets.\n\
    \nHow to create set\n\nYou can create set using {} (or) set() function. ‘set()’\
    \ creates empty set.\n\n>>> evenNumbers={2, 4, 6, 8, 8, 4, 10} >>> evenNumbers\
    \ {8, 10, 2, 4, 6}\n\nObserve above snippet, evenNumbers is a set that contains\
    \ even numbers. Observe the output, set doesn’t contain duplicate elements.\n\n\
    Following operations are supported by set.\n\nlen(s) : cardinality of set\n\n\
    Returns cardinality(Number of distinct elements) of the set.\n\n>>>  evenNumbers={2,\
    \  4,  6,  8,  8,  4,  10}\n\n>>>  len(evenNumbers)\n\n5\n\nx in s : Check whether\
    \ element is in set or not\n\n‘in’ operator is used to check whether element is\
    \ in set or not, return true if the element is set, else false."
