    \ `io.DEFAULT_BUFFER_SIZE`。b. “交互式”文本文件使用行缓冲。 |\n| `encoding` | 用于编码/解码文件使用的编码类型。此值应在文本模式下使用。如果未指定\
    \ `encoding`，则使用的编码取决于平台。 |\n| `errors` | 指定如何处理编码和解码错误。这不能在二进制模式下使用。 |\n| `newline`\
    \ | 控制通用换行模式的工作方式。一种解释文本流的方法，其中所有以下内容均被视为行的结束：Unix 换行符 `'\\n'`、Windows 约定 `'\\\
    r\\n'` 以及旧版 Macintosh 约定 `'\\r'`。 |\n| `closefd` | 如果 `closefd` 为 False 且提供的是文件描述符而非文件名，则关闭文件时底层文件描述符将保持打开。如果提供了文件名，则\
    \ `closefd` 必须为 `True`（默认值），否则将引发错误。 |\n\n以下是你在打开文件时可以使用的不同模式。\n\n| 模式 |  |\n\
