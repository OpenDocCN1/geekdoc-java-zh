    \ how encoding and decoding errors are to be handled. This cannot be used in binary\
    \ mode. |\n| `newline` | controls how universal newlines mode works. A manner\
    \ of interpreting text streams in which all of the following are recognized as\
    \ ending a line: the Unix end-of-line convention `'\\n'`, the Windows convention\
    \ `'\\r\\n'`, and the old Macintosh convention `'\\r'`. |\n| `closefd` | If `closefd`\
    \ is False and a file descriptor rather than a filename was given, the underlying\
    \ file descriptor will be kept open when the file is closed. If a filename is\
    \ given `closefd` must be `True` (the default) otherwise an error will be raised.\
    \ |\n\nFollowing are different modes that you can use while opening a file.\n\n\
    | Mode | Description |\n| :--- | :--- |\n| `'r'` | open for reading |\n| `'w'`\
    \ | open for writing, truncating the file first |\n| `'x'` | open for exclusive\
    \ creation, failing if the file already exists |\n| `'a'` | open for writing,\
    \ appending to the end of the file if it exists |\n| `'b'` | binary mode |\n|\
    \ `'t'` | text mode (default) |\n| `'+'` | open a disk file for updating (reading\
    \ and writing) |\n\nFor example, `data.txt` contains following data.\n\n```\n\
    data.txt\nFirst line\nSecond line\nThird line\nFourth line\n```\n\n```python\n\
    >>> f=open(\"/Users/harikrishna_gurram/data.txt\")\n>>>\n>>> f.read()\n'First\
    \ line\\nSecond line\\nThird line\\nFourth line\\n'\n```\n\n# Python: classes\
    \ and objects\n\n`Class` is a blue print to create objects.\n\n### Syntax\n```python\n\
    class ClassName:\n    <statement-1>\n    .\n    .\n    <statement-N>\n```\n`class`\
    \ keyword is used to define a class. You can instantiate any number of objects\
    \ from a class.\n\n### Syntax\n```python\nobjName = new ClassName(arguments)\n\
    ```\n\n### test.py\n```python\nclass Employee:\n    \"\"\" Employee class \"\"\
    \"\n    noOfEmployees=0  # Class level variable\n\n    def __init__(self, id,\
    \ firstName, lastName):\n        self.id = id\n        self.firstName = firstName\n\
    \        self.lastName = lastName\n        Employee.noOfEmployees = Employee.noOfEmployees\
    \ + 1\n\n    def displayEmployee(self):\n        print(self.id, self.firstName,\
    \ self.lastName)\n\nemp1 = Employee(1, \"Hari Krishna\", \"Gurram\")\nprint(\"\
    Total Employees\", Employee.noOfEmployees)\n\nemp2 = Employee(2, \"PTR\", \"Nayan\"\
    )\nprint(\"Total Employees\", Employee.noOfEmployees)\n\nemp3 = Employee(3, \"\
    Sankalp\", \"Dubey\")\nprint(\"Total Employees\", Employee.noOfEmployees)\n\n\
    emp1.displayEmployee()\nemp2.displayEmployee()\nemp3.displayEmployee()\n```\n\n\
    ```bash\n$ python3 test.py\nTotal Employees 1\nTotal Employees 2\nTotal Employees\
    \ 3\n1 Hari Krishna Gurram\n2 PTR Nayan\n3 Sankalp Dubey\n```\n\n### `__init__(arguments)`\n\
    `__init__` is a special function called constructor used to initialize objects.\
    \ In `Employee` class, `__init__` method is used to initialize `id`, `firstName`,\
    \ `lastName` to an object at the time of creation.\n\n### `noOfEmployees=0`\n\
    `noOfEmployees`’ is a class variable, shared by all the objects. Class variable\
    \ are accessed using Class name like `ClassName.variableName`, `Employee.noOfEmployees`\
    \ is used to access the class variable `noOfEmployees`.\n\n### Instance variables\n\
    Instance variables have values unique to an object. Usually these are defined\
    \ in `__init__` method. `Employee` class has 3 instance variables `id`, `firstName`,\
    \ `lastName`.\n\nThe first parameter of any method in a class must be `self`.\
    \ This parameter is required even if the function does not use it. `self` is used\
    \ to refer current object.\n\n# Python: Class Vs Instance variables\n\nClass variables\
    \ are associated with class and available to all the instances (objects) of the\
    \ class, where as instance variables are unique to objects, used to uniquely identify\
    \ the object.\n\n### Employee.py\n```python\nclass Employee:\n    \"\"\" Blue\
    \ print for all employees \"\"\"\n    # Class level variables\n    noOfEmployees=0\n\
    \    organization=\"abcde corporation\"\n\n    def __init__(self, id=-1, firstName=\"\
    Nil\", lastName=\"Nil\"):\n        self.id = -1\n        self.firstName = firstName\n\
    \        self.lastName = lastName\n        Employee.noOfEmployees+=1\n\n    def\
    \ displayEmployee(self):\n        print(self.id, self.firstName, self.lastName)\n\
    \nemp1 = Employee(id=1, firstName=\"Hari Krishna\", lastName=\"Gurram\")\nemp1.displayEmployee()\n\
    print(\"Total Employees : \", Employee.noOfEmployees)\nprint(\"Organization :\
    \ \", Employee.organization)\n\nemp2 = Employee(id=3, firstName=\"PTR\")\nemp2.displayEmployee()\n\
    print(\"Total Employees : \", Employee.noOfEmployees)\nprint(\"Organization :\
    \ \", Employee.organization)\n```\n\n```bash\n$ python3 Employee.py\n1 Hari Krishna\
    \ Gurram\nTotal Employees : 1\nOrganization : abcde corporation\n2 PTR\nTotal\
    \ Employees : 2\nOrganization : abcde corporation\n```\nAs you observe `Employee.py`,\
    \ `noOfEmployees` are class variables, shared by all the instances (objects) of\
    \ the class. `Employee.noOfEmployees` is used to access the class variable. `Employee.organization`\
    \ is used to access the class variable.\n\n# Python: Inheritance\n\nInheritance\
    \ is the concept of re usability. Object of one class can get the properties of\
    \ another class by inheritance.\n\n### Syntax\n```python\nclass DerivedClassName(BaseClassName1,\
    \ BaseClassName2):\n    <statement-1>\n```\n\n### inheritance.py\n```python\n\
    class Parent:\n    def printLastName(self):\n        print(\"Gurram\")\n\n   \
    \ def printAddress(self):\n        print(\"State : Andhra Pradesh\")\n       \
    \ print(\"Country : India\")\n\nclass Child(Parent):\n    def printName(self):\n\
    \        print(\"Hari Krishna\")\n\n    def printAddress(self):\n        print(\"\
    City : Bangalore\")\n        print(\"State : Karnataka\")\n        print(\"Country\
    \ : India\")\n\nemp1 = Child()\nemp1.printName()\nemp1.printLastName()\nemp1.printAddress()\n\
    ```\n\n```bash\n$ python3 inheritance.py\nHari Krishna\nGurram\nCity : Bangalore\n\
    State : Karnataka\nCountry : India\n```\nObserve above program, two classes `parent`\
    \ and `child` are defined. `Parent` class defines two methods `printLastName`,\
    \ `printAddress`. `Child` class defines one method `printName`. `Child` class\
    \ inheriting methods `printLastName`, `printAddress` from `Parent`.\n\n### Overriding\
    \ the methods of parent class\nYou can override the properties, methods of parent\
    \ class in child class. For example, following application overrides `printAddress`\
    \ method of `Parent` class.\n\n# Python: Exceptions\n\nException is an event that\
    \ disrupts the normal flow of execution. Even though statements in your program\
    \ are syntactically correct, they may cause an error.\n\n```python\n>>> 10/0\n\
    Traceback (most recent call last):\nFile \"<stdin>\", line 1, in <module>\nZeroDivisionError:\
    \ division by zero\n\n>>>\n\n>>>  tempList=[]\n>>>  tempList[20]\nTraceback (most\
    \ recent call last):\nFile \"<stdin>\", line 1, in <module>\nIndexError: list\
    \ index out of range\n```\n\n# Python: Handling Exceptions\n\nPython provide keywords\
    \ `try`, `except` to handle exceptions.\n\n### test.py\n```python\nwhile True:\n\
    \    try:\n        x = int(input(\"Enter input \"))\n        print(x)\n      \
    \  break;\n    except ValueError:\n        print(\"Please enter valid number\"\
    )\n```\n\n```bash\n$ python3 test.py\nEnter input an\n```\n"
