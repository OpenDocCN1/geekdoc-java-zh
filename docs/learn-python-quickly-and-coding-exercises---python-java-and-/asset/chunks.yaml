    \ 短路运算符\n\n布尔运算符 `and` 和 `or` 被称为短路运算符，这是因为一旦表达式的结果被确定，其求值就会停止。\n\n### 为什么布尔 `and`\
    \ 被称为短路运算符？\n因为如果表达式中的第一个语句的值为 `false`，那么 Python 就不会评估整个表达式。因此，布尔 `and` 被称为短路\
    \ `and`。\n\n### 为什么布尔 `OR` 被称为短路运算符？\n因为如果第一个语句的值为 `true`，那么 Python 就不会评估整个表达式。\n\
    \n# Python 中的字符串\n\n字符串是用单引号（`'…`）、双引号（`\"…`）（或或三引号（`\"\"\"…\"\"\"` 或 `'''…'''`）指定的字符序列。Python\
    \ 中的字符串是不可变的，即具有固定值的对象。\n\n```python\n>>> str1='Hello World'\n>>> str2=\"Hello\
    \ World\"\n>>> str3=\"\"\"\"Hello\n... World\n... \"\"\"\n\n>>> str1\n'Hello World'\n\
    >>> str2\n'Hello World'\n>>> str3\n'Hello\\nWorld\\n'\n```\n\n特殊字符通过反斜杠 `\\` 进行转义。\n\
    \n```python\n>>> message='He don\\'t know about this'\n>>> message\n\"He don't\
    \ know about this\"\n```\n\n`print()` 方法将由 `\\`（反斜杠）之前的字符视为特殊字符。\n\n```python\n\
    >>> print('firstline\\nsecondline')\nfirstline\nsecondline\n```\n\n正如你观察到的输出，`\\\
    n` 打印换行。如果你不希望 `\\` 前的字符被解释为特殊字符，你可以在第一个引号之前添加一个 `r` 来使用原始字符串。\n\n```python\n\
    >>> print(r'firstline\\nsecondline')\nfirstline\\nsecondline\n```\n\n### 字符串拼接\n\
    `+` 运算符用于拼接字符串。\n\n```python\n>>> hello=\"Hello,\"\n>>> message=\"How are you\"\
    \n>>> info=hello+message\n>>> info\n'Hello,How are you'\n```\n\n两个或多个相邻的字符串字面量会自动拼接。\n\
    \n```python\n>>> 'Hello' \"How\" 'are' 'you'\n'HelloHowareyou'\n```\n\n### 重复字符串\n\
    通过使用 `*`，我们可以重复字符串。\n\n```python\n>>> 'hi'*2\n'hihi'\n>>> 'hi'*2+'hello'*3\n'hihihellohellohello'\n\
    ```\n\n 访问字符串访问特定字符\n可以使用索引位置访问字符串的特定字符。\n\n```python\n>>> name=\"Hello World\"\
    \n>>> name[0]\n'H'\n>>> name[6]\n'W'\n```\n\n索引 `0` 代表第 1 个字符，`1` 代表第 2 个字符，依此类推。\n\
    你也可以使用负数进行索引。\n`-1` 代表最后一个字符；`-2` 代表倒数第二个字符，依此类推。\n\n```python\n>>> name\n'Hello\
    \ World'\n>>> name[-1]\n'd'\n>>> name[-2]\n'l'\n>>> name[-7]\n'o'\n```\n\n###\
    \ 切片\n切片用于获取给定字符串的子字符串。\n\n| 示例 | 描述 |\n| :--- | :--- |\n| `string[start:end]`\
    \ | 返回从索引 `start`（包含）到结束索引（不包含）的子字符串。 |\n| `string[:end]` | 返回从索引 `0`（包含）到结束索引（不包含）的子字符串。\
    \ |\n| `string[start:]` | 返回从索引 `start` 到结尾的子字符串。 |\n| `string[-2:]` | 返回从倒第二个到结尾的字符。\n\
    \n```python\n>>> message=\"Hello World\"\n>>> message[0:5]\n'Hello'\n>>> message[5:]\n\
    ' World'\n>>> message[:]\n'Hello World'\n>>> message[-2:]\n'ld'\n>>> message[-5:-2]\n\
    'Wor'\n```\n\n### 获取字符串长度\n函数 `len(str)` 用于获取字符串的长度。\n\n```python\n>>> message\n\
    'Hello World'\n>>> len(message)\n11\n>>> len(\"How are you\")\n11\n```\n\n# Python:\
    \ if 条件\n\n### “if” 语句\n`\"if\"` 告诉程序当条件求值为真时，执行该部分代码。\n\n**语法**\n```python\n\
    if_stmt ::= \"if\" expression \":\" suite\n```\n\ntest.py\n```python\na=10\nif\
    \ (a < 10) :\n    print(\"a is less than 10\")\nif (a == 10) :\n    print(\"a\
    \ is equal to 10\")\nif( a > 10) :\n    print(\"a is greater than 10\")\n```\n\
    ```bash\n$ python3 test.py\na is equal to 10\n```\n\n### if-else 语句\n如果条件为真，则执行\
    \ if 块代码；否则执行 else 块代码。\n\n**语法**\n```python\nif_stmt ::= \"if\" expression \"\
    :\" suite\n              [\"else\" \":\" suite]\n```\n\ntest.py\n```python\na=10\n\
    if (a != 10) :\n    print(\"a is not equal to 10\")\nelse :\n    print(\"a is\
    \ equal to 10\")\n```\n\n### if-elif-else 语句\n通过使用 if-elif-else 结构，你可以选择备选方案的数量。if\
    \ 语句可以跟一个可选的 elif...else 语句。\n\n**语法**\n```python\nif_stmt ::= \"if\" expression\
    \ \":\" suite\n              ( \"elif\" expression \":\" suite )*\n          \
    \    [\"else\" \":\" suite]\n```\n\ntest.py\n```python\na=10\nif (a > 10) :\n\
    \    print(\"a is greater than 10\")\nelif (a < 10) :\n    print(\"a is less than\
    \ 10\")\nelse :\n    print(\"a is equal to 10\")\n```\n```bash\n$ python3 test.py\n\
    a is equal to 10\n```\n\n**注意：**\na. 在 Python 中，任何非零整数值都被视为真；零为假。\n\ntest.py\n\
    ```python\nif (100) :\n    print(\"Hello\")\nelse :\n    print(\"Bye\")\n```\n\
    ```bash\n$ python3 test.py\nHello\n```\n\nb. 任何序列均为真，空序列为假。\n\ntest.py\n```python\n\
    if (a > 10) :\n    print(\"a is greater than 10\")\nelif (a < 10) :\n    print(\"\
    a is less than 10\")\nelse :\n    print(\"a is equal to 10\")\n```\n\n# Python:\
    \ while 语句\n`while` 语句在条件求值为真时执行代码块。\n\n**语法**\n```python\nwhile_stmt ::= \"while\"\
    \ expression \":\" suite\n              [\"else\" \":\" suite]\n```\n\n`else`\
    \ 子句是可选的。当表达式求值为假时，执行 else 块。\n\ntest.py\n```python\na=2\nwhile (a < 10):\n  \
    \  print(\"Even numbers\")\nelse:\n    print(\"Done\")\n```\n```bash\n$ python3\
    \ test.py\n2 4 6 8 10\n```\n\n# Python: for 语句\n`for` 语句用于遍历序列中的项。\n\n**语法**\n\
    ```python\nfor_stmt ::= \"for\" expression \":\" suite\n```\n\n`else` 子句是可选的，当循环结束时执行。\n\
    \ntest.py\n```python\nnames=[\"Phalgun\", \"Sambith\", \"Mahesh\", \"swapna\"\
    ]\nfor name in names:\n    print(name)\nelse:\n    print(\"Done\")\n```\n```bash\n\
    $ python3 test.py\nPhalgun\nSambith\nMahesh\nswapna\nDone\n```\n\n# Python: break\
    \ 语句\n`break` 语句用于跳出循环。\n\ntest.py\n```python\ni=0\nwhile (i < 10):\n    print(i)\n\
    \    i+=2\n    if(i==10):\n        break\nelse:\n    print(\"Done\")\n```\n```bash\n\
    $ python3 test.py\n0 2 4 6 8\n```\n\n# Python: continue 语句\n`continue` 语句跳过当前的循环迭代。\n\
    \ntest.py\n```python\ni=2\nwhile (i < 20):\n    i+=2\n    if(i%2 != 0):\n    \
    \    continue\n    print(i)\nelse:\n    print(\"Exiting loop\")\n```\n```bash\n\
    $ python3 test.py\n4 6 8 10 12 14 16 18 20\nExiting loop\n```\n\n# Python: 函数\n\
    函数是由名称标识的语句块。`def` 关键字用于定义函数。函数主要用于两个原因：\n\na. 使代码更容易构建和理解\nb. 代码复用\n\n**语法**\n\
    ```python\ndef functionName(argument1, argument2 …. argumentN):\n```\n\ntest.py\n\
    ```python\ndef factorial(n):\n    if(n<=1):\n        return 1\n    result=1\n\
    \    for i in range(2, n+1):\n        result *= i\n    return result\n\nprint(factorial(1))\n\
    print(factorial(2))\nprint(factorial(3))\nprint(factorial(4))\nprint(factorial(5))\n\
    ```\n```bash\n$ python3 test.py\n1\n2\n6\n24\n120\n```\n\n在函数定义之前创建的变量在函数不改变其值的情况下可以在函数内部读取。\n\
    \ntest.py\n```python\n# 创建 x 变量并设置为 44\nx = 44\n# 定义一个打印 x 的简单函数\ndef f():\n \
    \   x += 1\n    print(x)\n\n# 调用函数\nf()\n```\n```bash\n$ python3 test.py\nTraceback\
    \ (most recent call last):\n  File \"test.py\", line 11, in <module>\n    f()\n\
    \  File \"test.py\", line 7, in f\n    x += 1\nUnboundLocalError: local variable\
    \ 'x' referenced before assignment\n```\n\n"
