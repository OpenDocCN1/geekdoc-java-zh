    \ to console.\n\n# Python: functions: return statement\n\n`return` statement is\
    \ used to return a value from function to the caller.\n\n`test.py`\n\n```python\n\
    def factorial(n):\n  if(n<=1):\n    return 1\n  result=1\n  for i in range(2,\
    \ n+1):\n    result *= i\n  return result\n\nprint(factorial(1))\nprint(factorial(2))\n\
    print(factorial(3))\nprint(factorial(4))\nprint(factorial(5))\n```\n\n```bash\n\
    $ python3 test.py\n1\n2\n6\n24\n120\n```\n\n`return` without an expression argument\
    \ returns `None`.\n\n```python\ndef hello():\n    print(\"Hello\")\nprint(hello())\n\
    ```\n\n```bash\n$ python3 test.py\nHello\nNone\n```\n\n# Python lists\n\n`List`\
    \ is group of values in between square brackets separated by commas.\n\n```python\n\
    >>> primes=[2, 3, 5, 7, 11, 13, 17, 19, 23]\n>>> primes\n[2, 3, 5, 7, 11, 13,\
    \ 17, 19, 23]\n```\n`primes` is a list that contain prime numbers.\n\n```python\n\
    >>> students=[\"Hari\", \"Krishna\", \"Kiran\", \"Ravi\"]\n>>> students\n['Hari',\
    \ 'Krishna', 'Kiran', 'Ravi']\n```\n\n`students` is a list that contain all student\
    \ names.\n\n`List` can contain any type of data.\n\n```python\n>>> objects=[1,\
    \ 3, \"Hello\", 10.23]\n>>> objects\n[1, 3, 'Hello', 10.23]\n```\n\nYou can access\
    \ elements of list by using index.\n\n```python\n>>> objects\n[1, 3, 'Hello',\
    \ 10.23]\n>>> objects[0]\n1\n>>> objects[2]\n'Hello'\n```\n\n`objects[0]` return\
    \ the first element of list `objects`.\n`objects[1]` return the second element\
    \ of list `objects`.\n\n-ve indexes also used to access elements of a list.\n\n\
    ```python\n>>> objects\n[1, 3, 'Hello', 10.23]\n>>> objects[-1]\n10.23\n>>> objects[-3]\n\
    3\n```\n\n## Slicing\n\nSlicing is used to get sub list.\n\n| Example | Description\
    \ |\n| :--- | :--- |\n| `list[start:end]` | Returns sub list from index start\
    \ (included) to end index (excluded). |\n| `list[:end]` | Returns sub list from\
    \ index 0(included) to end index (excluded). |\n| `list[start:]` | Return sub\
    \ list from index start to till end. |\n| `list[-2:]` | Return list from 2nd last\
    \ to end. |\n\n```python\n>>> objects\n[1, 3, 'Hello', 10.23]\n>>> objects[-1]\n\
    10.23\n>>> objects[-3]\n3\n>>> objects\n[1, 3, 'Hello', 10.23]\n>>> objects[:]\n\
    [1, 3, 'Hello', 10.23]\n>>> objects[2:]\n['Hello', 10.23]\n>>> objects[:3]\n[1,\
    \ 3, 'Hello']\n>>> objects[-2:]\n['Hello', 10.23]\n```\n\n## Concatenate two lists\n\
    \n`+` Operator is used to concatenate two lists.\n\n```python\n>>> even=[2, 4,\
    \ 6, 8, 10]\n>>> odd=[1, 3, 5, 7, 9]\n>>> numbers = even+odd\n>>> numbers\n[2,\
    \ 4, 6, 8, 10, 1, 3, 5, 7, 9]\n```\n\nLists are mutable; you can change the values\
    \ of list.\n\n```python\n>>> numbers\n[2, 4, 6, 8, 10, 1, 3, 5, 7, 9]\n>>> numbers[0]=12\n\
    >>> numbers[1]=14\n>>> numbers\n[12, 14, 6, 8, 10, 1, 3, 5, 7, 9]\n```\n\n## Add\
    \ elements to end of list\n\n`List` provides `append` method to add new elements\
    \ to the end of a list.\n\n```python\n>>> numbers\n[12, 14, 6, 8, 10, 1, 3, 5,\
    \ 7, 9]\n>>> numbers.append(11)\n>>> numbers.append(13)\n>>> numbers\n[12, 14,\
    \ 6, 8, 10, 1, 3, 5, 7, 9, 11, 13]\n```\n\n## Assignment to slices\n\nIf you want\
    \ to replace sequence of elements in a list, you can use slice notation.\n\n```python\n\
    numbers[2:5] = [21, 22, 23]\n```\nAbove statement replace elements at index 2,\
    \ 3, 4 with `21, 22, 23` respectively.\n\n```python\nnumbers[:] = []\n```\nAbove\
    \ statement clear the list by replacing all the elements with an empty list.\n\
    \n```python\n>>> numbers\n[12, 14, 6, 8, 10, 1, 3, 5, 7, 9]\n>>> numbers[2:5]=[21,\
    \ 22, 23]\n>>> numbers\n[12, 14, 21, 22, 23, 10, 1, 3, 5, 7, 9]\n>>> numbers[:]\
    \ = []\n>>> numbers\n[]\n```\n\n## Get length of the list\n\nBy using `len` function,\
    \ you can get length of the list.\n\n```python\n>>> vowels=['a', 'e', 'i', 'o',\
    \ 'u']\n>>> len(vowels)\n5\n```\n\n## Nested lists\n\nA list can be nested in\
    \ other list. For example, below `numbers` contains 3 lists, first list represent\
    \ odd numbers, second list represent even numbers and third list represent prime\
    \ numbers.\n\n```python\n>>> numbers=[[1, 3, 5, 7],[2, 4, 6, 8],[3, 5, 7]]\n>>>\
    \ numbers\n[[1, 3, 5, 7], [2, 4, 6, 8], [3, 5, 7]]\n>>> numbers[0]\n[1, 3, 5,\
    \ 7]\n>>> numbers[1]\n[2, 4, 6, 8]\n>>> numbers[2]\n[3, 5, 7]\n>>> len(numbers)\n\
    3\n>>> len(numbers[0])\n4\n>>> len(numbers[1])\n4\n>>> len(numbers[2])\n3\n>>>\
    \ numbers[0][1]=9\n>>> numbers\n[[1, 9, 5, 7], [2, 4, 6, 8], [3, 5, 7]]\n```\n\
    \n# Python: tuples\n\nA tuple is just like a list, consist of number of values\
    \ separated by commas.\n\n## Differences between tuple and list\n\na. `List` is\
    \ mutable, where `tuple` is immutable.\nb. `Tuple` can contain heterogeneous data,\
    \ where `list` usually contains homogeneous data.\n\n`test.py`\n```python\nemployee=(1,\
    \ \"Hari Krihsna\", \"Gurram\", 123456)\nprint(employee)\nprint(employee[0])\n\
    print(employee[1])\nprint(employee[2])\n```\n\n```bash\n$ python3 test.py\n(1,\
    \ 'Hari Krihsna', 'Gurram', 123456)\n1\nHari Krihsna\nGurram\n```\n\n## Mutable\
    \ objects in tuples\n\nAs you observe above example, elements in tuple are enclosed\
    \ in parenthesis. Even though tuples are immutable, you can create tuples which\
    \ contain mutable objects, such as lists.\n\n`test.py`\n```python\nemployee=(1,\
    \ [])\nprint(employee)\nemployee[1].append(2)\nemployee[1].append(4)\nemployee[1].append(6)\n\
    print(employee)\n```\n\n```bash\n$ python3 test.py\n(1, [])\n(1, [2, 4, 6])\n\
    ```\n\n## Packing and unpacking\n\nYou can define tuples, without using parenthesis.\
    \ For example:\n\n```python\nemployee=1, \"Hari Krihsna\", \"Gurram\", 123456\n\
    ```\nAbove one is the example of tuple packing.\n\n```python\nid, firstName, lastName,\
    \ salary = employee\n```\nAbove one is an example of tuple unpacking. Sequence\
    \ unpacking requires that there are as many variables on the left side of the\
    \ equals sign as there are elements in the sequence.\n\n`test.py`\n```python\n\
    employee=1, \"Hari Krihsna\", \"Gurram\", 123456\nid, firstName, lastName, salary\
    \ = employee\nprint(id)\nprint(firstName)\nprint(lastName)\nprint(salary)\n```\n\
    \n```bash\n$ python3 test.py\n1\nHari Krihsna\nGurram\n123456\n```\n\n## Concatenate\
    \ tuples\n\n`+` operator is used to concatenate tuples.\n\n```python\n>>> tuple1=(1,\
    \ \"HI\", 2, 45.65)\n>>> tuple2=(\"abcdef\", 54, 67)\n>>> tuple3=tuple1+tuple2\n\
    >>> tuple3\n(1, 'HI', 2, 45.65, 'abcdef', 54, 67)\n```\n\n## Slicing\n\nJust like\
    \ lists, you can access tuples using slice notation.\n\n| Example | Description\
    \ |\n| :--- | :--- |\n| `tuple[start:end]` | Returns tuple from index start (included)\
    \ to end index (excluded). |\n| `tuple[:end]` | Returns tuple from index 0(included)\
    \ to end index (excluded). |\n| `tuple[start:]` | Return tuple from index start\
    \ to till end. |\n| `tuple[-2:]` | Return elements from 2nd last to end. |\n\n\
    ```python\n>>> tuple1=(1, 'HI', 2, 45.65)\n>>> tuple1[0:]\n(1, 'HI', 2, 45.65)\n\
    >>> tuple1[:]\n(1, 'HI', 2, 45.65)\n>>> tuple1[:3]\n(1, 'HI', 2)\n>>> tuple1[2:5]\n\
    (2, 45.65)\n>>> tuple1[-2:]\n(2, 45.65)\n```\n\n## Repeat tuple\n\n`*` operator\
    \ is used to repeat tuple.\n\n```python\n>>> tuple1=(1, 'HI', 2, 45.65)\n>>> tuple1*3\n\
    (1, 'HI', 2, 45.65, 1, 'HI', 2, 45.65, 1, 'HI', 2, 45.65)\n```\n\n## Remove tuple\
    \ elements\n\nAs I said, tuples are immutable, so it is not possible to remove\
    \ elements from tuple. But you can remove the entire tuple using `del` statement.\n\
    \n```python\n>>> tuple1=(1, 'HI', 2, 45.65)\n>>> del tuple1\n>>> tuple1\nTraceback\
    \ (most recent call last):\nFile \"<stdin>\", line 1, in <module>\nNameError:\
    \ name 'tuple1' is not defined\n```\n"
