    \ try and except block work?\n\nThe statements in `try` block executed first.\
    \ If no exception occurs, the `except` clauses are skipped and execution of the\
    \ `try` statement is finished. If any exception occurs during the execution of\
    \ `try` block, the rest of the `try` clause is skipped.\n\n`try` block followed\
    \ by number of `except` clauses, if exception thrown in `try` cause matches to\
    \ any exception followed by `except` clause, then particular `except` clause is\
    \ executed.\n\nIf an exception occurs which does not match the exception named\
    \ in the `except` clause, it is passed on to outer `try` statements; if no handler\
    \ is found, it is an unhandled exception and execution stops by throwing exception\
    \ message.\n\nTry block can be followed by multiple `except` clauses.\n\n`test.py`\n\
    \n```python\nwhile True:\n    try:\n        x = int(input(\"Enter divisor \"))\n\
    \        y = int(input(\"Enter dividend \"))\n        print(x/y)\n        break\n\
    \    except ValueError:\n        print(\"Please enter valid number\")\n    except\
    \ ZeroDivisionError:\n        print(\"y should be non zero\")\n```\n\n`$ python3\
    \ test.py`\n\nEnter divisor 2\nEnter dividend 0\ny should be non zero\n\nEnter\
    \ divisor 4\nEnter dividend 0\ny should be non zero\n\nEnter divisor 4\nEnter\
    \ dividend 2\n2.0\n\n# Handling multiple exceptions in single except clause\n\n\
    An `except` clause can catch more than one exception. For example `except (ValueError,\
    \ ZeroDivisionError)` can handle both `ValueError` and `ZeroDivisionError`.\n\n\
    `test.py`\n\n```python\nwhile True:\n    try:\n        x = int(input(\"Enter divisor\
    \ \"))\n        y = int(input(\"Enter dividend \"))\n        print(x/y)\n    \
    \    break\n    except (ValueError, ZeroDivisionError):\n        print(\"Please\
    \ enter valid number (or) y should be greater than 0\")\n```\n\n`$ python3 test.py`\n\
    \nEnter divisor 2\nEnter dividend 0\nPlease enter valid number (or) y should be\
    \ greater than 0\n\nEnter divisor aa\nPlease enter valid number (or) y should\
    \ be greater than 0\n\nEnter divisor 2\nEnter dividend 4\n0.5\n\n# Last except\
    \ clause can omit exception name. It is used as global exception handler.\n\n\
    `test.py`\n\n```python\nwhile True:\n    try:\n        tempList = []\n       \
    \ print(tempList[10])\n        break\n    except ValueError:\n        print(\"\
    Please enter valid number\")\n    except ZeroDivisionError:\n        print(\"\
    y should be non zero\")\n    except Exception as inst:\n        print(\"Global\
    \ handler\", inst)\n        break\n```\n\n`$ python3 test.py`\n\nGlobal handler\
    \ list index out of range\n\n# try…except…else clause\n\n`try…except` statement\
    \ can have optional `else` clause, it is followed by `except` clause. If `try`\
    \ block doesn’t throw any exception, `else` clause will be executed.\n\n`test.py`\n\
    \n```python\nwhile True:\n    try:\n        x = int(input(\"Enter divisor \"))\n\
    \        y = int(input(\"Enter dividend \"))\n        print(x/y)\n    except ValueError:\n\
    \        print(\"Please enter valid number\")\n    except ZeroDivisionError:\n\
    \        print(\"y should be non zero\")\n    else:\n        print(\"Program executed\
    \ successfully\")\n        break\n```\n\n`$ python3 test.py`\n\nEnter divisor\
    \ 4\nEnter dividend 2\n2.0\nProgram executed successfully\n\n# Exception argument\n\
    \nWhenever an exception occurs, it is associated with a variable called exception\
    \ argument.\n\n`test.py`\n\n```python\nwhile True:\n    try:\n        x = int(input(\"\
    Enter divisor \"))\n        y = int(input(\"Enter dividend \"))\n        print(x/y)\n\
    \    except ValueError as inst:\n        print(inst)\n    except ZeroDivisionError\
    \ as inst:\n        print(inst)\n    else:\n        print(\"Program executed successfully\"\
    )\n        break\n```\n\n`$ python3 test.py`\n\nEnter divisor qwerty\ninvalid\
    \ literal for int() with base 10: 'qwerty'\nEnter divisor 4\nEnter dividend 0\n\
    division by zero\n\nEnter divisor 2\nEnter dividend 4\n0.5\nProgram executed successfully\n\
    \nThe `except` clause can specify a variable after the exception name. The variable\
    \ is bound to an exception instance with the arguments stored in `instance.args`.\n\
    \n`test.py`\n\n```python\nwhile True:\n    try:\n        x = int(input(\"Enter\
    \ divisor \"))\n        y = int(input(\"Enter dividend \"))\n        if y==0:\n\
    \            raise Exception(x, y)\n        print(\"x/y = \",x/y)\n        break\n\
    \    except Exception as inst:\n        arg1, arg2 = inst.args\n        print(\"\
    arg1=\", arg1)\n        print(\"arg2=\", arg2)\n```\n\n`$ python3 test.py`\n\n\
    Enter divisor 2\nEnter dividend 0\narg1= 2\narg2= 0\n\nEnter divisor 2\nEnter\
    \ dividend 4\nx/y = 0.5\n\nIf an exception has arguments associated with it, those\
    \ are printed as last part of the exception message.\n\n`test.py`\n\n```python\n\
    while True:\n    try:\n        x = int(input(\"Enter divisor \"))\n        y =\
    \ int(input(\"Enter dividend \"))\n        if y==0:\n            raise Exception(x,\
    \ y)\n        print(\"x/y = \",x/y)\n        break\n    except Exception as inst:\n\
    \        print(inst)\n```\n\n`$ python3 test.py`\n\nEnter divisor 2\nEnter dividend\
    \ 0\n(2, 0)\nEnter divisor 2\nEnter dividend 4\nx/y = 0.5\n\n# Python global keyword\n\
    \n`global` keyword is used to create/change a global variables (You can declare\
    \ functions, classes etc. also) from local context.\n\n`test.py`\n\n```python\n\
    def function1():\n    global data\n    data=\"Hello World\"\n\ndef function2():\n\
    \    print(data)\n\nfunction1()\nfunction2()\n```\n\n`$ python3 test.py`\n\nHello\
    \ World\n\nObserve `test.py`, even though `data` is declared in `function1`, it\
    \ is accessed by `function2`. It is because, data is declared in global scope.\n\
    \n# Python: Get type of variable\n\nYou can get the type of a variable using `type()`\
    \ or `__class__` property.\n\n`test.py`\n\n```python\ndata = [1, 2, 3, 4]\nprint(type(data))\n\
    print(data.__class__)\n```\n\nChecking the type using `if` statement\n\nApproach\
    \ 1:\n```python\nif type(data) == list:\n    print(\"data is a list\")\n```\n\n\
    Approach 2:\n```python\nif type(data).__name__ == 'list':\n    print(\"data is\
    \ a list\")\n```\n\nApproach 3:\n```python\nif isinstance(data, list):\n    print(\"\
    data is a list\")\n"
