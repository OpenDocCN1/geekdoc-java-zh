  trans: "\n一旦应用程序加载完成，继续展开控制台（Console）窗口。你会发现这里有几个异常。现在停止应用程序服务器；否则它将继续抛出这些异常。让我们向上滚动到其中一个异常，看看问题出在哪里。：“无法在任何已知服务器上执行请求（Cannot\
    \ execute request on any known server）”。如果你观察的话，它来自 `DiscoveryClient.getAndStoreFullRegistry()`\
    \ 方法。发生的情况是服务发现服务器（Service Discovery Server）正在启动，它正尝试向一个对等的服务发现服务器进行注册。这主要是为了高可用性。然而，当我们在独立或开发模式下运行时，每次都必须设置多个实例会非常麻烦。因此，我们将配置\
    \ `Eureka Server` 不要尝试与其对等节点注册。你绝对只想在开发模式下这样做，因为你在生产环境中需要高可用性。让我们关闭控制台。然后，在包资源管理器（Package\
    \ Explorer）中，导航到 `src/main/resources` 并打开 `application.properties`。\n\n### application.properties\n\
    \n```properties\nspring.application.name=discovery-server\neureka.client.register-with-eureka=false\n\
    eureka.client.fetch-registry=false\nserver.port=8761\n```\n\n我们要添加的第一个属性实际上是我们之前遗忘的一个属性，即\
    \ `spring.application.name` 属性，我们将它设置为 `discovery-server`。我们要添加的第二个属性是 Eureka\
    \ Client 属性，请输入 `eureka.client.register-with-eureka`。由于我们本身就是发现服务器，而且运行在独立模式下，我们不需要与任何其他对等节点注册，因为根本没有其他对等节点。所以请确保将该值设置为\
    \ `false`。下一个属性也是一个 Eureka Client 属性，所以请输入 `eureka.client.fetch-registry`。此属性控制\
    \ Eureka Client 是否会从 Eureka Server 获取注册表，由于我们是唯一的 Eureka Server，没有其他东西可以从别人那里获取，因此我们将此设置为\
    \ `false`。我们要添加的最后一个属性是 `server.port`，我们将它设置为值 `8761`，这是 Eureka 发现服务器的默认端口。一旦你设置好这些属性，进入主应用程序类，右键点击它，并选择“作为\
    \ Spring Boot 运行（Run As Spring Boot App）”。当你的应用启动完成后，展开控制台，你会看到它启动了 Eureka Server\
    \ 并将其状态更改为 `UP`。现在你有了一个正在运行的服务发现服务器。\n\n## 应用程序服务 (Application Service)\n\n* 提供某些应用程序功能\n\
    * 请求的接收者\n* 其他服务的依赖项\n* 一个或多个实例\n* 发现客户端的用户\n* 注册\n* 取消注册\n\n记住，我们正在深入研究服务发现的每个组件，我们列表中的下一个是应用程序服务。这是任何提供功能的实体。它是接收客户端请求并返回响应的实体。它是其他服务的依赖项。因此，其他服务依赖它的功能来执行自身的功能。你通常会运行一个或多个应用程序实例。应用程序服务是发现客户端的用户。它将使用该客户端调用发现服务器并进行自身的注册和注销。就像我们之前为服务发现服务器做的那样，我们将详细说明向应用程序服务添加\
    \ Eureka Client 所需的步骤，然后我们实际上会自己创建一个。\n\n### 在服务中使用 Spring Cloud Eureka Client\n\
    \n### pom.xml\n\n```xml\n<dependencyManagement>\n    <dependencies>\n        <dependency>\n\
    \            <groupId>org.springframework.cloud</groupId>\n            <artifactId>spring-cloud-dependencies</artifactId>\n\
    \            <version>Camden.SR2</version>\n            <type>pom</type>\n   \
    \         <scope>import</scope>\n        </dependency>\n    </dependencies>\n\
    </dependencyManagement>\n```\n\n在你的 Maven 项目的 `pom.xml` 中，添加一个新的 `dependencyManagement`\
    \ 节点，并在其中添加新的 `spring-cloud-dependencies` 依赖。同样，确保它的类型为 `pom` 且范围为 `import`。\n\
    \n### pom.xml\n\n```xml\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
    \    <artifactId>spring-cloud-starter-eureka</artifactId>\n</dependency>\n```\n\
    \n同样在 `pom.xml` 中，在 `dependencies` 元素内添加一个新的依赖，这个依赖被称为 `spring-cloud-starter-eureka`。然后在你的\
    \ `application.properties` 或 `application.yml` 中，添加两个新属性。\n\n### application.properties\n\
    \n```properties\nspring.application.name=service\neureka.client.service-url.defaultZone=http://localhost:8761/eureka\n\
    ```\n\n或者\n\n### application.yml\n\n```yaml\nspring:\n  application:\n    name:\
    \ service\neureka:\n  client:\n    service-url:\n      defaultZone: http://localhost:8761/eureka\n\
    ```\n\n第一个属性是 `spring.application.name` 属性，同样你可以将其设置为任何想要的值。在我们的案例中，我们将使用 `service`。第二个属性告诉应用程序服务服务发现服务器的位置，它是\
    \ `eureka.client.defaultZone` 属性。你可以看到我们将其设置为 `localhost`，但在生产环境中，你会将其设置为服务服务器所在的地方。如果你好奇\
    \ `defaultZone` 是什么，先不要担心，稍后我们会解释。\n\n```java\n@SpringBootApplication\n@EnableDiscoveryClient\n\
    public class Application {\n    public static void main(String[] args) {\n   \
    \     SpringApplication.run(Application.class, args);\n    }\n}\n```\n\n然后在你应用程序的主类中，添加一个注解。再次，这只有一个注解。Spring\
    \ Cloud 的开发者让它变得非常简单。那就是 `@EnableDiscoveryClient`。它的作用是让应用程序注册到发现服务器，这样其他服务就能找到它。\n\
