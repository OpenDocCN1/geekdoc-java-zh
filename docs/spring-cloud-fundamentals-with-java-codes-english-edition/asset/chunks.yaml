  trans: "\n\n然后，在你的主 `Application` 类中，添加 `@EnableZuulProxy` 注解，这个注解会将你的应用程序转换为网关服务。从配置的角度来看，你有两种不同的选择。你可以配置网关服务使用服务发现，也可以在不使用服务发现的情况下配置它。\n\
    \n### 使用服务服务的 Spring Cloud & Netflix Zuul\n\n`application.properties`:\n\n```properties\n\
    spring.application.name=gateway-service\neureka.client.defaultZone=http://localhost:8761/eureka\n\
    ```\n\nOR\n\n`application.yml`:\n\n```yaml\nspring:\n  application:\n    name:\
    \ gateway-service\neureka:\n  client:\n    defaultZone: http://localhost:8761/eureka\n\
    ```\n\n如果你正在使用服务发现，请定义应用名称和服务发现服务器位置的常规参数。\n\n### 不使用服务服务的 Spring Cloud & Netflix\
    \ Zuul\n\n`application.properties`:\n\n```properties\nspring.application.name=gateway-service\n\
    ribbon.eureka.enabled=false\n```\n\nOR\n\n`application.yml`:\n\n```yaml\nspring:\n\
    \  application:\n    name: gateway-service\nribbon:\n  eureka:\n    enabled: false\n\
    ```\n\n如果你不使用服务发现，仍然需要定义应用名称，并添加一个额外的参数 `ribbon.eureka.enabled=false`。还记得我提到过网关服务可以作为你服务的负载均衡器吗？Netflix\
    \ 的客户端负载均衡器项目名称为 `Ribbon`。我们将在客户端负载均衡的模块中详细介绍关于 `Ribbon` 是什么的更多细节。\n\n## 在 Netflix\
    \ Zuul 中配置路由\n\n一旦你完成了所有配置，下一步是定义 Zuul 如何如何路由请求。当使用服务发现设置 Zuul 时，默认的路由行为是根据服务名称进行路由。\n\
    \n#### 使用服务发现的默认路由解析（服务解析）\n\n请求：`/foo` 映射到服务：`spring.application.name=foo`\n\n\
    请求：`/categories/1` 映射到服务：`spring.application.name=categories`\n\n例如，如果你请求 `/foo`，Zuul\
    \ 将使用服务发现来查找名为 `foo` 的服务，并将该请求发送到该服务。这是另一个例子：如果你请求 `/categories/1`，Zuul 将定位名为\
    \ `categories` 的服务，并将 `/1` 请求发送到该服务。默认情况下，请求的前缀会被剥离，因此服务实际上只接收请求的 `/1` 部分。如果你想让发送完整的请求\
    \ `/categories/1`，你可以将属性 `zuul.stripPrefix` 设置为 `false`，这样服务就会获得请求 `/categories/1`。另外注意，所有服务默认都会被添加，因此你可能需要使用\
    \ `zuul.ignoredServices`，你可以将其设置为一个模式以忽略特定服务。\n\n#### 使用服务发现的 Netflix Zuul：精确路由\n\
    \n`application.properties`\n\n```properties\nspring.application.name=gateway-service\n\
    zuul.routes.<route_name>.path=/somepath/**\nzuul.routes.<route_name>.serviceId=some_service_id\n\
    zuul.ignored-services=some_service_id\n```\n\nOR\n\n`application.yml`:\n\n```yaml\n\
    spring:\n  application:\n    name: gateway-service\nzuul:\n  routes:\n    <route_name>:\n\
    \      path: /somepath/**\n      serviceId: some_service_id\n  ignored-services:\
    \ some_service_id\n```\n\n除了默认配置外，你还可以为特定服务定义更精确的配置。首先，你通过 `zuul.routes.route_name.path`\
    \ 属性定义路径，其中路由名称可以是任何你想要的名称。路径被定义为使用 Ant 风格匹配器的路径。然后，你定义相同的属性前缀，但结尾是 `service_id`\
    \ 而不是 `path`。`service_id` 是 Zuul 在通过服务发现发现服务时将查找的服务标识符。你还需要设置 `zuul.ignored-services`\
    \ 属性，以便 Zuul 不会尝试自动为该服务 ID 添加添加路由。\n\n#### 不使用服务服务的 Netflix Zuul：精确路由\n\n`application.properties`\n\
    \n```properties\nspring.application.name=gateway-service\nzuul.routes.<route_name>.path=/somepath/**\n\
    zuul.routes.<route_name>.url=http://some_url_address/\n```\n\nOR\n\n`application.yml`:\n\
    \n```yaml\nspring:\n  application:\n    name: gateway-service\nzuul:\n  routes:\n\
    \    <route_name>:\n      path: /somepath/**\n      url: http://some_url_address/\n\
    ```\n\n不使用服务发现时的配置实际上与使用它时非常相似。你定义路径，就像你在之前的配置中做的那样，然后不是定义服务 ID，而是直接定义服务的 URL。\n\
    \n## 演示：使用 Netflix Zuul 作为智能路由\n\n前往 `start.spring.io`，我们将在这里创建三个不同的项目。对于 Group\
    \ ID `io.ajay.kumar`，对于我们要创建的第一个项目 Artifact，我们将命名为 `gateway-service`。对于依赖项，我们需要添加\
    \ `Zuul`，然后还想添加 `Eureka Discovery`。\n\n![](img/00029.gif)\n\n一旦在 particular 完成后，点击\
    \ Generate Project（生成项目）。\n\n"
- fmt: "\nThe first property we're going to add is the `spring.application.name` property,\
    \ and we're going to set that to `gateway-service`. And then the other property\
    \ we'll need is the location of the Service Discovery Server. So we'll say `eureka.client.service-url.defaultZone`,\
    \ and then we'll set that to `localhost:8761/eureka`. Next, you can go ahead and\
    \ close both of those files and minimize the `gateway-service` project. Next,\
    \ we're going to open up the `hello-service` project, so go ahead and expand that,\
    \ and open up the main application class.\n\n```java\npackage io.ajay.kumar.helloservice;\n\
    \nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;\nimport\
    \ org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\
    \n@SpringBootApplication\n@EnableDiscoveryClient\n@RestController\npublic class\
    \ HelloServiceApplication {\n    public static void main(String[] args) {\n  \
    \      SpringApplication.run(HelloServiceApplication.class, args);\n    }\n\n\
    \    @RequestMapping\n    public String hello() {\n        return \"Hello!\";\n\
    \    }\n}\n```\n\nIn the main application class, we're going to add the `@EnableDiscoveryClient`\
    \ annotation, and we're also going to make this a `RestController`. Now this is\
    \ normally a bad idea if you were to do this in a real application, but we're\
    \ just doing this as a simple example so it's okay for now. So we'll go ahead\
    \ and add `@RestController`. Go ahead and save that. And then we'll need a handler\
    \ method, so `public String hello`. And this is just going to return `Hello!`,\
    \ and we'll annotate this with `@RequestMapping`. Now we need to configure our\
    \ `hello-service` application, so go ahead and open up `src/main/resources` and\
    \ open up `application.properties`.\n\n**application.properties**\n```properties\n\
    spring.application.name=hello\nserver.port=1111\neureka.client.service-url.defaultZone=http://localhost:8761/eureka\n\
    ```\n\nIn the `application.properties`, the first property we'll set is the `spring.application.name`,\
    \ and we'll set this to `hello`. And we're also going to set the server port.\
    \ Since we have multiple applications running at the same time, we don't want\
    \ their ports to conflict. So we'll say `server.port`, and we'll set this to `1111`.\
    \ Go ahead and save that. And then the last property is setting the location of\
    \ the Service Discovery Server. And we can go ahead and just copy that from the\
    \ gateway service. So open up the `application.properties` from the gateway service,\
    \ copy the configuration value that's setting the location of the Service Discovery\
    \ Server, close that, and then paste that into your `application.properties`.\
    \ You're going to repeat basically the same process for the `goodbye-service`\
    \ except for all of the locations that it says `hello` will be `goodbye`. And\
    \ instead of using all 1s for the port, we'll use all 2s. I completed `good-service`,\
    \ so let's take a look at the main application class.\n\n```java\npackage io.ajay.kumar.goodbyeservice;\n\
    \nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;\nimport\
    \ org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\
    \n@SpringBootApplication\n@EnableDiscoveryClient\n@RestController\npublic class\
    \ GoodbyeServiceApplication {\n    public static void main(String[] args) {\n\
    \        SpringApplication.run(GoodbyeServiceApplication.class, args);\n    }\n\
    \n    @RequestMapping\n    public String goodbye() {\n        return \"Goodbye!\"\
    ;\n    }\n}\n```\n\nWe have the `@EnableDiscoveryClient` annotation and the `@RestController`\
    \ annotation, and then we have one handler method, which is `goodbye`, and it's\
    \ annotated with `@RequestMapping`.\n\n**application.properties**\n```properties\n\
    spring.application.name=goodbye\nserver.port=2222\neureka.client.service-url.defaultZone=http://localhost:8761/eureka\n\
    ```\n\nIn the `application.properties`, we have the `spring.application.name`\
    \ set to `goodbye` and the `server.port` set to all 2s. And then the configuration\
    \ for the Service Discovery Server is exactly the same. We're now ready to start.\n\
