    ## Summary


    We''re at the end of this module so, like always, let''s do a recap of what we
    learned.


    *   Fault tolerance is a requirement


    *   Netflix Hystrix


    *   Circuit breaker pattern


    *   @HystrixCommand &


    *   @EnableCircuitBreaker


    *   Netflix Hystrix Dashboard & Turbine


    *   Monitor one or several streams


    First, we saw that failures in a distributed system are pretty much inevitable.
    And we have to learn to embrace failures and make handling failures a requirement.
    Then we introduced Netflix Hystrix, which is an implementation of the Circuit
    Breaker pattern, among other fault-tolerance patterns. And we saw how to use the
    @EnableCircuitBreaker annotation and the @HystrixCommand annotation to protect
    a call that might fail. We concluded the module by looking at how we can visualize
    and monitor our Hystrix-protected calls with the Hystrix Dashboard and how we
    can monitor several streams at once with Turbine.


    # Module 8: Bringing It All Together and Where to Go Next


    ## Introduction


    In this last module we''ll take a holistic approach to see how each of the individual
    ideas and technologies all fit together and where you can go next after you''ve
    completed the book.


    *   How does it all fit together?


    *   Service Discovery


    *   Distributed Configuration


    *   Client-side load balancing


    *   Gateway and routing


    *   Fault tolerance and circuit breaker


    *   What’s next?


    *   Other Spring Cloud Projects


    We''ll begin with a section on how it all fits together. We''ve learned a lot
    throughout the book covering new ideas and technologies in every single module.
    And while many of those ideas are useful by themselves, the real advantage comes
    from using them together as a whole. And we''ll see how each of the main topics,
    service discovery, distributed configuration, client-side load balancing, gateway
    and routing, and fault tolerance and circuit breaker, all fit together to form
    a cloud-native system. And then, like I mentioned, we''ll finish by briefly discussing
    where you can go next to learn about what additional Spring Cloud projects are
    out there. And don''t discount the importance of this. It''s helpful to know exactly
    what''s out there. It''s almost like browsing the tool section at your local hardware
    store, and if you don''t know what tools are out there, when you have a problem,
    you might end up using the wrong tool for the wrong job.


    ## How Does It All Fit Together?


    The question is how does it all fit together to form a cloud-native system? And,
    to start, let''s recap everything that''s involved. It all starts with one or
    more application services.


