       \"profiles\":[  \n\n      \"default\"\n\n   ],\n\n   \"label\":null,\n\n   \"\
    version\":\"5bbcc634f016351eecb0aaf67650c378e9425200\",\n\n   \"state\":null,\n\
    \n   \"propertySources\":[  \n\n {  \n\n         \"name\":\"https://github.com/ajaycucek/config-repository.git/config-client-app.properties\"\
    ,\n\n         \"source\":{  \n\n \"some.property\":\"app specific overridden value\"\
    \n\n         }\n\n },\n\n {  \n\n         \"name\":\"https://github.com/ajaycucek/config-repository.git/application.properties\"\
    ,\n\n         \"source\":{  \n\n \"some.property\":\"global\",\n\n \"some.other.property\"\
    :\"global\"\n\n         }\n\n }\n\n   ]\n\n}\n\nOnce you've got your browser open,\
    \ visit http://localhost:8888/config-client-app/default. And then remember that\
    \ it's the application name/profile/label, so application name will be config-client-app.\
    \ And remember that the profile parameter is a required parameter, so if we want\
    \ to see the default configuration for the Config Client app without any Spring\
    \ Profile, we use the value default as the default profile. The default return\
    \ format is in JSON, and the important points of this are the property sources.\
    \ Notice that the bottom property source is the application.properties. That's\
    \ the global properties that applies to every application. And then the property\
    \ source above that, which overrides any of the global property sources, is the\
    \ config-clien-app.properties.\n\n![](images/00021.jpeg)\n\nFormatting above response\
    \ :\n\n{  \n\n   \"name\":\"config-client-app\",\n\n   \"profiles\":[  \n\n   \
    \   \"prod\"\n\n   ],\n\n   \"label\":null,\n\n   \"version\":\"5bbcc634f016351eecb0aaf67650c378e9425200\"\
    ,\n\n   \"state\":null,\n\n   \"propertySources\":[  \n\n {  \n\n         \"name\"\
    :\"https://github.com/ajaycucek/config-repository.git/config-client-app-prod.properties\"\
    ,\n\n         \"source\":{  \n\n \"some.property\":\"profile specific value\"\
    ,\n\n \"some.other.property\":\"profile specific value\"\n\n         }\n\n },\n\
    \n {  \n\n         \"name\":\"https://github.com/ajaycucek/config-repository.git/config-client-app.properties\"\
    ,\n\n         \"source\":{  \n\n \"some.property\":\"app specific overridden value\"\
    \n\n         }\n\n },\n\n {  \n\n         \"name\":\"https://github.com/ajaycucek/config-repository.git/application.properties\"\
    ,\n\n         \"source\":{  \n\n \"some.property\":\"global\",\n\n \"some.other.property\"\
    :\"global\"\n\n         }\n\n }\n\n   ]\n\n}\n\nIf we modify the URL and replace\
