    package io.ajay.kumar;


    import org.springframework.boot.SpringApplication;


    import org.springframework.boot.autoconfigure.SpringBootApplication;


    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;


    import org.springframework.cloud.netflix.zuul.EnableZuulProxy;


    import org.springframework.context.annotation.Bean;


    import org.springframework.context.annotation.Configuration;


    import io.schultz.dustin.filters.AddRequestHeaderFilter;


    @SpringBootApplication


    @EnableZuulProxy


    @EnableDiscoveryClient


    @Configuration


    public class GatewayServiceApplication {


    public static void main(String[] args) {


     SpringApplication.run(GatewayServiceApplication.class, args);


    }


    @Bean


    public AddRequestHeaderFilter addRequestHeaderFilter() {


     return new AddRequestHeaderFilter();


    }


    }


    And then we''re going to want to define the AddRequestHeaderFilter as an @Bean
    here, so we''ll say public AddRequestHeaderFilter, and we''re going to return
    a new AddRequestHeaderFilter. And again, make sure we annotate this with @Bean.
    And that''s all the changes that we need to make to the gateway-service, so let''s
    go ahead and close this and collapse the gateway-service. And then let''s go ahead
    and open up the hello-service and open up the main application class.


    package io.ajay.kumar;


    import org.springframework.boot.SpringApplication;


    import org.springframework.boot.autoconfigure.SpringBootApplication;


    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;


    import org.springframework.web.bind.annotation.RequestHeader;


    import org.springframework.web.bind.annotation.RequestMapping;


    import org.springframework.web.bind.annotation.RestController;


    @SpringBootApplication


    @EnableDiscoveryClient


    @RestController


    public class HelloServiceApplication {


    public static void main(String[] args) {


     SpringApplication.run(HelloServiceApplication.class, args);


    }


    @RequestMapping


    public String hello(@RequestHeader("x-location") String location) {


     return "Hello from " + location + "!";


    }


    }


    In our handler method, we''re going to add a new parameter. We''re going to say
    String location. And we''re going to annotate this with @RequestHeader, and then
    we''re going to give it the name of that request header that the gateway-service
    is adding to the request, which is x-location. And then we''ll modify the string
    to say Hello from location, and go ahead and save that. And that''s all the changes
    that we need to make to our application for this demo. So we can go ahead and
    close this and minimize the hello-service, and we''re ready to start things up.
    So we''ll want to start the discovery-server first. So expand the discovery-server,
    locate the main application class, right-click, Run As, Spring Boot App. After
    that, we''ll start the gateway-service, so collapse that and open the gateway-service,
    highlight the main application class, Run As, Spring Boot App. And then last,
    let''s start up the hello-service. So collapse the gateway-service, head over
    to the hello-service, right-click, Run As, Spring Boot App. Next, start up your
    browser and visit localhost:8080/hello.


    ![](images/00035.gif)


    And there we have it. We have the Hello and then we have the USA, which came from
    the gateway-service, which added it as a request header, which the hello-service
    then consumed and appended to it''s Hello string to come out with the string Hello
    from USA!


    ## Summary


    We''ve now completed the module, so let''s take a quick moment to recap what we''ve
    learned.'
