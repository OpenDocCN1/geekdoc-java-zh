  trans: "\n\n`some.property=app specific overridden value`\n\n在 `Package Explorer`\
    \ 中，展开 `config repository` 项目，你会发现有三个配置文件。让我们来看第一个配置文件 `application.properties`。这里是存放所有全局配置的地方。`application.properties`\
    \ 适用于任何向 `Config Server` 请求配置的应用程序。接下来，打开 `config-client-app.properties` 文件，注意这是一个特定应用程序的配置文件。因此，它只适用于命名为\
    \ `config-client-app` 的应用程序。当我们演示 `Spring Cloud Config Client` 时，我们将该项目的 `Spring`\
    \ 应用程序名称配置为 `config-client-app`，这样该配置就仅适用于该应用程序。继续打开最后一个配置文件 `config-client-app-prod.properties`\
    \ 文件。这个配置文件与我们刚刚看到的那个相似。它适用于同一个应用程序，但只有当该应用程序在名为 `prod` 的 `Spring Profile` 下下运行时，它才会生效。让我们关闭所有这些配置文件并启动我们的\
    \ `Configuration Server`。转到 `config-server`，展开它，找到主应用程序类，右键点击它，并选择 `Run As Spring\
    \ Boot App`。你还需要启动 `discovery-server`。一旦 `Configuration Server` 启动，让我们打开浏览器并访问一些\
    \ `REST endpoints`。\n\n![](img/00020.jpeg)\n\n上述响应的格式：\n\n```json\n{  \n   \"\
    name\":\"config-client-app\",\n   \"profiles\":[  \n      \"default\"\n   ],\n\
    \   \"label\":null,\n   \"version\":\"5bbcc634f016351eecb0aaf67650c378e9425200\"\
    ,\n   \"state\":null,\n   \"propertySources\":[  \n {  \n          \"name\":\"\
    https://github.com/ajaycucek/config-repository.git/config-client-app.properties\"\
    ,\n          \"source\":{  \n \"some.property\":\"app specific overridden value\"\
    \n         }\n },\n {  \n          \"name\":\"https://github.com/ajaycucek/config-repository.git/application.properties\"\
    ,\n          \"source\":{  \n \"some.property\":\"global\",\n \"some.other.property\"\
    :\"global\"\n         }\n }\n   ]\n}\n```\n\n一旦你打开了浏览器，访问 `http://localhost:8888/config-client-app/default`。记住，格式是\
    \ `application name/profile/label`，所以应用程序名称将是 `config-client-app`。记住 `profile`\
    \ 参数是一个必选参数，所以如果我们想查看不带任何 `Spring Profile` 的 `Config Client` 应用的默认配置，我们使用值 `default`\
    \ 作为默认配置。默认的返回格式是 `JSON`，其要点是 `property sources`。注意底部的属性源是 `application.properties`。那是适用于每个应用程序的全局属性。而它上面的属性源（会覆盖任何全局属性源的属性）是\
    \ `config-clien-app.properties`。\n\n![](img/00021.jpeg)\n\n上述响应的格式：\n\n```json\n\
    {  \n   \"name\":\"config-client-app\",\n   \"profiles\":[  \n      \"prod\"\n\
    \   ],\n   \"label\":null,\n   \"version\":\"5bbcc634f016351eecb0aaf67650c378e9425200\"\
    ,\n   \"state\":null,\n   \"propertySources\":[  \n {  \n          \"name\":\"\
    https://github.com/ajaycucek/config-repository.git/config-client-app-prod.properties\"\
    ,\n          \"source\":{  \n \"some.property\":\"profile specific value\",\n\
    \ \"some.other.property\":\"profile specific value\"\n         }\n },\n {  \n\
    \          \"name\":\"https://github.com/ajaycucek/config-repository.git/config-client-app.properties\"\
    ,\n          \"source\":{  \n \"some.property\":\"app specific overridden value\"\
    \n         }\n },\n {  \n          \"name\":\"https://github.com/ajaycucek/config-repository.git/application.properties\"\
    ,\n          \"source\":{  \n \"some.property\":\"global\",\n \"some.other.property\"\
    :\"global\"\n         }\n }\n   ]\n}\n```\n\n`some.property=app specific overridden\
    \ value`\n\n如果我们修改 `config-client-app` 使其包含 `prod`，我们将看到 `some.property` 被覆盖了。\n\
    \n![](img/00022.jpeg)\n\n## 使用 Spring Cloud Client\n\n现在我们已经看到了 `Spring Cloud\
    \ Config Server` 是如何工作的以及如何启动它，让我们看看等方程式的另一端——`Client`。从核心角度来说，`Client` 负责引导（bootstrapping）。当我说\
    \ `Client` 负责引导配置时是什么意思呢？嗯，当 `Spring` 应用程序启动时，它需要解析它的属性源。由于配置位于 `Configuration\
    \ Server` 上，它需要在应用程序上下文正式启动之前获取这些配置。你有两种不同的方法可以让 `Config Client` 引导你的应用程序，并且它们都使用一个名为\
    \ `bootstrap.properties` 或 `bootstrap.yml` 的特殊文件。\n\n### Config First（配置优先）\n\
    第一种方法是 `Config First`，你通过配置包含 `application name` 以及 `Configuration Server` `URL`\
    \ 的 `bootstrap.yml` 或 `bootstrap.properties` 来实现。\n\n### Discovery First（发现优先）\n\
    方法方法是 `Discovery First`，使用服务发现（service discovery）。因此你需要配置 `bootstrap.properties`\
    \ 或 `bootstrap.yml`，包含 `application name` 以及服务发现服务器的地址。它将通过此来查找 `Config Server`。设置应用程序使用\
    \ `Spring Cloud Client` 比设置 `Spring Cloud Config Server` 更加简单。\n\n`pom.xml`:\n\
    \n```xml\n<dependencyManagement>\n    <dependencies>\n        <dependency>\n<groupId>org.springframework.cloud</groupId>\n\
    <artifactId>spring-cloud-dependencies</artifactId>\n<version>Camden.SR2</version>\n\
    <type>pom</type>\n<scope>import</scope>\n        </dependency>\n    </dependencies>\n\
    </dependencyManagement>\n```\n\n在你的 `pom.xml` 中，在 `dependencyManagement` 节点导入\
    \ `spring-cloud-dependencies`。\n\n```xml\n<dependency>\n<groupId>org.springframework.cloud</groupId>\n\
    <artifactId>spring-cloud-config-client</artifactId>\n</dependency>\n```\n\n然后在\
    \ `dependency` 节点（仍在你的 `pom.xml` 中）中定义对 `spring-cloud-config-client` 的新依赖。然后我们需要配置\
    \ `Config Client` 如何引导配置。如果你使用 `Config First`，你定义一个 `bootstrap.properties` 或 `bootstrap.yml`。\n\
    \n`bootstrap.properties`:\n```properties\nspring.application.name=<your_app_name>\n\
    spring.cloud.config.uri=http://localhost:8888/\n```\n\nOR\n\n`bootstrap.yml`:\n\
    ```yaml\nspring:\n  application:\n    name: <your_app_name>\n  cloud:\n    config:\n\
    \      uri: http://localhost:8888/\n```\n\n"
- fmt: "\nAnd you define the `spring.application.name` property, and this is the name\
    \ of your application. It will use this when it calls the Spring Cloud Config\
    \ Server's REST services to find the appropriate configuration. And then the next\
    \ property is the `spring.cloud.config.uri` property, and you would set that to\
    \ the location of your Config Server. And in this example I've just used `localhost`\
    \ here. If you're using a Discovery First configuration to bootstrap the Config\
    \ Client, the configuration is similar to the one we just looked at, but it's\
    \ slightly different.\n\n### bootstrap.properties\n\n```properties\nspring.application.name=<your_app_name>\n\
    spring.cloud.config.discovery.enabled=true\n```\n\nOR\n\n### bootstrap.yml\n\n\
    ```yaml\nspring:\n  application:\n    name: <your_app_name>\n  cloud:\n    discovery:\n\
    \      enabled: true\n```\n\nYou of course have your `bootstrap.properties` or\
    \ your `bootstrap.yml`, and note that I've only included the differences between\
    \ the Config First configuration. And that's to define the `spring.cloud.config.discovery.enabled`\
    \ property and setting that to `true`. And you would define that instead of the\
    \ location of the Config Server. You would also need to make sure that you added\
    \ your Eureka Client dependencies and your `pom.xml`. And configure the service\
    \ URL to the Service Discover Server, and then add the `@EnableDiscoveryClient`\
    \ annotation.\n\n## Demo: Retrieving Configuration with the Config Client\n\n\
    In this demo, we'll see how to use the Spring Cloud Config Client to retrieve\
    \ configuration at startup from the Configuration Server. To get started, head\
    \ on over to `start.spring.io`. For the Group ID, use `io.ajay.kumar`. For the\
    \ Artifact name, use `config-client-app`. For the dependencies, we're going to\
    \ want the Config Client, of course, we're going to want Eureka Discovery so that\
    \ we can use service discovery to find the Configuration Server, and we'll want\
    \ the Spring Actuator. Once you've got everything selected, click the `Generate\
    \ Project` button. That will generate a zip file. Click on that, unzip it, and\
    \ head over to your IDE.\n\n![](images/00024.jpeg)\n\nWithin IntelliJ or Eclipse,\
    \ right-click on the empty area of the Package Explorer, go to `Import`, search\
    \ for `Existing Maven Projects`, choose that, click `Next`, browse to the location\
    \ of your downloaded zip file, mine's in `Downloads/config-client-app`, hit `Open`,\
    \ and click `Finish`.\n\nWe're going to be using service discovery to locate the\
    \ Config Server from the Config Client app. So if you haven't already completed\
    \ the Service Discovery module, you'll need the Discovery Server and import it\
    \ into your IDE. It's pretty simple. Next we need to make a couple of modifications\
    \ to the Config Server so that it will register itself with the Discovery Server.\n\
    \n```java\npackage io.ajay.kumar.configserver;\n\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.client.discovery.EnableDiscoveryClient;\n\
    import org.springframework.cloud.config.server.EnableConfigServer;\n\n@SpringBootApplication\n\
    @EnableConfigServer\n@EnableDiscoveryClient\npublic class ConfigServerApplication\
    \ {\n    public static void main(String[] args) {\n        SpringApplication.run(ConfigServerApplication.class,\
    \ args);\n    }\n}\n```\n\nExpand the `config-server` and go to the main application\
    \ class. Underneath the `@EnableConfigServer` add an `@EnableDiscoveryClient`\
    \ annotation. Save that, and then open up the `application.properties` in `src/main/resources`.\n\
    \n### application.properties\n\n```properties\nserver.port=8888\nspring.cloud.config.server.git.uri=https://github.com/ajaycucek/config-repository.git\n\
    spring.application.name=configserver\neureka.client.server-url.defaultZone=https://localhost:8761/eureka\n\
    ```\n\nWe'll add two different properties. The first one is the `spring.application.name`,\
    \ and we're going to set that equal to `configserver`. No spaces. And then we\
    \ also want to set the location of the Discovery Server so it knows where to register\
    \ itself. So we do `eureka.client.server-url.defaultZone`, and then we set that\
    \ to `localhost:8761/eureka`. Next, expand the `config-client-app` project, and\
    \ open up the main application class. Remember that there's no special annotation\
    \ that we need to add for the Config Client to get its configuration. As long\
    \ as the libraries are on the class path and the setup is correct, it should be\
    \ able to find the configuration from the Configuration Server.\n\n```java\npackage\
    \ io.ajay.kumar.configclientapp;\n\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.client.discovery.EnableDiscoveryClient;\n\
    \n@SpringBootApplication\n@EnableDiscoveryClient\npublic class ConfigClientAppApplication\
    \ {\n    public static void main(String[] args) {\n        SpringApplication.run(ConfigClientAppApplication.class,\
    \ args);\n    }\n}\n```\n\nHowever, we do want to participate in service discovery,\
    \ so let's add the `@EnableDiscoveryClient` annotation. Go ahead and save that.\
    \ Next let's create a new class. So New, Class, and we're going to call this class\
    \ the `ConfigClientAppConfiguration` class. Go ahead and click `Finish`.\n\n```java\n\
    package io.ajay.kumar.configclientapp;\n\nimport org.springframework.boot.context.properties.ConfigurationProperties;\n\
    import org.springframework.stereotype.Component;\n\n@Component\n@ConfigurationProperties(prefix=\"\
    some\")\npublic class ConfigClientAppConfiguration {\n    private String property;\n\
    \n    public String getProperty() {\n        return property;\n    }\n\n    public\
    \ void setProperty(String property) {\n        this.property = property;\n   \
    \ }\n}\n```\n\nLet's go ahead and annotate this with `@Component` and also `@ConfigurationProperties`.\
    \ We're going to give this a prefix equal to `some`. This `ConfigurationProperties`\
    \ is going to represent our property that's named `property`. We'll have an instance\
    \ variable that is a string, so `private String property;`. And make that you\
    \ don't forget the getters and setters. You can do that by going to Source, Generate\
    \ Getters and Setters, choose property, save that file. Head back to the main\
    \ application class, and let's autowire our configuration class.\n\n```java\n\
    package io.ajay.kumar.configclientapp;\n\nimport org.springframework.beans.factory.annotation.Autowired;\n\
    import org.springframework.beans.factory.annotation.Value;\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.client.discovery.EnableDiscoveryClient;\n\
    import org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\
    \n@SpringBootApplication\n@EnableDiscoveryClient\n@RestController\npublic class\
    \ ConfigClientAppApplication {\n    @Autowired\n    private ConfigClientAppConfiguration\
    \ properties;\n\n    @Value(\"${some.other.property}\")\n    private String someOtherProperty;\n\
    \n    public static void main(String[] args) {\n        SpringApplication.run(ConfigClientAppApplication.class,\
    \ args);\n    }\n\n    @RequestMapping\n    public String printConfig() {\n  \
    \      StringBuilder sb = new StringBuilder();\n        sb.append(properties.getProperty());\n\
    \        sb.append(\" || \");\n        sb.append(someOtherProperty);\n       \
    \ return sb.toString();\n    }\n}\n```\n"
