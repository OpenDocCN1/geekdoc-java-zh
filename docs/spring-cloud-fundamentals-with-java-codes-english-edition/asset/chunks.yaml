    *   Data: <value_to_decrypt>


    The decrypt endpoint is literally almost identical to the encrypt endpoint with
    the exception of the name and the inputs. And you''d mainly use this for debugging
    purposes. So to decrypt a value, you would POST to /decrypt, and you would send
    the encrypted value as the body of the request, and it would return to you the
    unencrypted value.


    ## Summary


    *   The explosion of configuration in the cloud and the need for a config server


    *   Using the Spring Cloud Config Server & Client


    *   Updating configuration at runtime without restarting


    *   Encrypting and decrypting configuration


    We''ve reached the end of this module, so let''s take a moment to review what
    we''ve learned. We''ve covered a lot of topics. We first talked about the need
    for a Configuration Server in a cloud environment to manage the explosion of configuration
    that comes with managing a distributed system. Then, we saw how to configure the
    Spring Cloud Config Server to serve our configuration files and how to use the
    Spring Cloud Config Client along with the bootstrap.properties or the bootstrap.yml
    to retrieve the configuration during application initialization. After that, we
    saw how we could brag to our colleagues about updating our configuration at runtime
    without ever needing to restart our application server. We also saw what gets
    automatically refreshed and what requires an @RefreshScope annotation. And last,
    we finished out the module with a section on how to utilize the encryption and
    decryption support within Spring Cloud Config.


    # Module 5: Mapping Services Using Intelligent Routing


    ## What Is Intelligent Routing?


    In this module we''ll learn how to map our services in the cloud using Intelligent
    Routing.


    *   Routing in cloud native apps


    *   Netflix Zuul


    *   Proxy server


    *   Setting up routes


    *   Setting up filters


    We''ll begin by talking about what Intelligent Routing is and what problem it
    solves for us. Then we''ll introduce Netflix Zuul as part of the Spring Cloud
    Netflix project. And we''ll see how to set up a proxy server, how to configure
    different routes, and how to set up filtering. Remember that in order to be as
    dynamic and as scalable as possible, a cloud-native system is made up of individually
    deployable services, which together, as a whole, form an overall system. With
    that comes some challenges though.


    Challenges with Individual Services


    *   Different ports


    *   Different addresses


    *   Different APIs & paths


    Each of the individual services may be running on a different port, a different
    address, or a combination of both. And they''ll also likely have different paths
    and different APIs to interact with. And as a user or a client of those services,
    such as a mobile app or a web app, interacting with each of the individual services,
    which could easily be in the double or triple digits, would be a nightmare. Instead,
    we can use Intelligent Routing to make our application appear as if it were a
    single system. Similar to how a completed puzzle appears as if it were a whole,
    but it''s made up of several different individual pieces.


    ## Intelligent Routing via a Gateway Service


    Routing is typically implemented via something called a gateway service, or an
    API Gateway. And an API Gateway, or a gateway service, is defined as the single
    point of entry for all clients. So in many ways the gateway service is a lot like
    the front door to our system. And each of the individual services is then located
    behind this door, and all the requests must enter through it.


    A Gateway Service Provides


    *   Dynamic Routing & Delivery


    *   Security & Filtering


    *   Auditing & Logging


    *   Request Enhancement


    *   Load Balancing


    *   Different APIs for different clients


    A gateway service not only provides dynamic routing and delivery, which means
    at runtime it can decide where it should route a request and if it should even
    route a request at all, but it also provides an array of other functionalities.
    One of those pieces of functionality is security. It provides the ability to authenticate
    all of the incoming requests, as well as filter out any sort of illegitimate or
    bad request. And it''s actually a really good candidate for providing auditing
    and logging of requests since all of the requests must enter through the gateway.
    It also provides something called request enhancement, which is just a fancy way
    of saying that it can add additional information to the request, or enrich the
    request, if you will. A concrete example of this is the way Netflix uses their
    gateway. They use their gateway service to do a geolocation lookup for all incoming
    requests, and they add that additional information as an additional request header
    so that it''s available for all downstream services. The gateway service can also
    act as a load balancer for the individual services that are behind it. Another
    interesting feature of the gateway service is the ability to provide different
    APIs for different clients. APIs are not a one-size-fits-all kind of thing, and
    different clients, such as web clients or mobile clients, have different needs
    in the way they call your APIs. So, for instance, it may be okay for a web client
    to interact with several endpoints to accomplish some piece of functionality,
    but the same may not be true for a mobile client, which may be better served with
    just a single endpoint.


    ## Using Netflix Zuul with Spring Cloud


    Intelligent Routing is implemented using a combination of Spring Cloud and a project
    from Netflix. The project is called Netflix Zuul, and it''s pronounced zool, which
    rhymes with the word tool. The project page for the Netflix Zuul project defines
    it as a gateway service that provides dynamic routing, monitoring, resiliency,
    security, and more. And the name Zuul is actually a pretty good name as Zuul refers
    to a fictional, monster-like character in the movie Ghostbusters that''s the gatekeeper
    just like a gateway service is the gatekeeper. We''ll talk about how you go about
    adding Spring Cloud and Netflix Zuul to a project, and then we''ll follow up with
    a live demo. Just like all of the other Spring Cloud projects, adding Spring Cloud
    and Netflix Zuul to your project is really, really easy.


    Using Spring Cloud & Netflix Zuul


    pom.xml :


    <dependencyManagement>


        <dependencies>


            <dependency>


                <groupId>org.springframework.cloud</groupId>


                <artifactId>spring-cloud-dependencies</artifactId>


                <version>Camden.SR2</version>


                <type>pom</type>


                <scope>import</scope>


            </dependency>


         </dependencies>


    </dependencyManagement>


    In the dependencyManagement section of the pom.xml, define a new dependency with
    a scope of import on spring-cloud-dependencies.


    <dependency>


        <groupId>org.springframework.cloud</groupId>


        <artifactId>spring-cloud-starter-zuul</artifactId>


    </dependency>


    And still within the pom.xml, define a new dependency in the dependency section
    on spring-cloud-starter-zuul.


    @SpringBootApplication


    @EnableZuulProxy


    public class Application{


        public static void main(String[] args){


            SpringApplication.run(Application.class, args);


        }


