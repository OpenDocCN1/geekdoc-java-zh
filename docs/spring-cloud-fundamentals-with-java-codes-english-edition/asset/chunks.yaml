    # Module 1: Course Overview


    The cloud, or cloud computing, is truly changing the way we, as developers, think
    about design and develop software. And that''s where Spring Cloud comes in. Spring
    Cloud helps you take full advantage of these new paradigms by bringing together
    the best of Spring Boot with proven cloud strategies to help you design and develop
    cloud-native applications. Some of the major topics we''ll cover include service
    discovery using Spring Cloud and Netflix Eureka, distributed configuration using
    Spring Cloud Config Server, client-side load balancing using Spring Cloud and
    Netflix Ribbon, intelligent routing via a gateway service using Spring Cloud and
    Netflix Zuul, and fault tolerance using Spring Cloud and Netflix Hystrix. By the
    end of this book, you''ll know how to build applications that take full advantage
    of the cloud. Before beginning the book, you should be familiar with Java, Spring
    Boot, and have at least an introductory level understanding of microservices.


    # Module 2: Getting Familiar with Spring Cloud


    ## The Infamous Cloud


    I''m sure you''ve heard of this infamous thing called the cloud as it''s often
    hyped as this game changer or the sort of magical solution to everything. It''ll
    solve all your problems. And with so many things to learn these days, it''s hard
    not to ignore a lot of that and just kind of brush it off as clever marketing.
    But now companies and enterprises are finally starting to truly embrace the cloud,
    and some of that hype is actually becoming a reality. And it''s more often the
    norm to see enterprises and companies using the cloud than it is the exception.
    As software engineers, I think we have some really exciting times ahead of us.
    Cloud computing, or the cloud, is really changing the way that we build software.
    We''re moving from using these centralized monoliths to applications which are
    distributed and use microservices. And not only is the software changing, but
    the hardware is changing as well. We''re moving from this managed and finite resource
    to this infinite and on demand and self-service resource.


    ## New Challenges with the Cloud


    With the cloud, there comes these new challenges. We have to think differently.
    Things are not quite as static as we''re used to, and we can''t just design and
    architect and use the same principles or techniques that we''re used to. The cloud
    is this elastic and ephemeral thing. Things can grow and shrink and appear and
    disappear at any given time. So we have to consider that the cloud is this ever-changing
    and constantly evolving thing, whereas we may be used to something that is a bit
    more static. We also can''t just move our existing applications to the cloud and
    expect them to be automatically cloud enabled. This is often referred to as the
    lift and shift migration. And sure we''re going to get some benefits by moving
    to the cloud, but we''re not fully utilizing the cloud. In order to fully utilize
    the cloud, it requires change. And that''s where Spring Cloud helps. Spring Cloud
    helps you build cloud-native applications. Now, you''re probably asking what is
    a cloud-native application? Well, a cloud-native application means that your application
    was specifically built and engineered for the cloud. It means your application
    fully utilizes all of the cloud computing paradigms. Spring Cloud itself is not
    actually a framework. Loosely speaking, Spring Cloud is used to describe a number
    of projects that all fall under the same umbrella. In this book, we''ll focus
    on the fundamentals, which is Spring Cloud Config and Spring Cloud Netflix.


    ## Your Focus for the book


    *   Service Discovery


    *   Distributed


    *   Configuration


    *   Intelligent Routing


    *   Client-side Load Balancing


    *   Circuit Breaker


    We''re going to specifically target a number of key areas. First, we''re going
    to look at service discovery. How do you dynamically find your application services
    in the cloud at runtime? Then, we''ll move on to distributed configuration, or
    how to manage common or service-specific configuration in a distributed system.
    Then, we''ll look at intelligent routing, or how to make a distributed system
    look as if it were a single cohesive system using Intelligent Routing. Then, we''ll
    look at client-side load balancing, or how you distribute load among several instances
    of the same service. And last, we''ll look at how you can use the circuit breaker
    pattern to build fault-tolerant applications in the cloud.


    ## Prerequisites


    *   Java 8+


    *   Spring Boot 1.4+


    *   Knowledge of Microservices or SOA'
