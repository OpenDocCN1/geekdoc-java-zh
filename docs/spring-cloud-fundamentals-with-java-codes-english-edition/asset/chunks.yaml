    We''ll begin the module with a short section on failures in a cloud-native or
    distributed system. We''ll look at why failures are more prevalent and understand
    a common side effect called cascading failures. Then we''ll introduce and understand
    the Circuit Breaker pattern and learn how it can help us build more fault-tolerant
    services. Next, we''ll dive into Netflix Hystrix, which is a fault-tolerance library
    that, among other things, implements the Circuit Breaker pattern. We''ll see how
    Spring Cloud makes it easy to get started with the `@EnableCircuitBreaker` annotation,
    and then we''ll understand how to use the `@HystrixCommand` annotation to implement
    the Circuit Breaker pattern in our own services. We''ll finish the module out
    by looking at one of the really nice features of Hystrix called the Hystrix Dashboard.
    We''ll see how to enable it, how metrics are collected, how to interpret those
    results, and how to aggregate those results using another project from Netflix
    called `Turbine`.


    # Cascading Failures and Resource Overloading


    In a distributed system, if there''s anything that we can be 100% sure about,
    that''s that failure is inevitable. But why though? Well, failure can happen at
    many different levels in a system.


    ### A Few Areas That Might Fail


    * Hardware fails

    * Networks fail

    * Software fails


    Hardware can fail, networks can fail, and software can definitely fail. And a
    distributed system is no different in that sense, but the likelihood for failure
    is just simply much greater. You have more hardware, you have more network, and
    you have more software. And with these increased numbers comes that increased
    probability for failure. Adding to that chance of failure is the way in which
    processes communicate in a distributed system. Process communication that was
    once within a process is now done across a network. And even as resilient as our
    networks are today, there''s still a much more likely chance of a communication
    failure across a network versus within a process. A particularly bad side effect
    of failures in a distributed system is something called a cascading failure. A
    cascading failure is a failure in a system in which a failure in one system can
    cascade, almost like dominos, to other parts of the system causing them to fail
    as well. To make this a bit more concrete, imagine that you have three services,
    `Service A`, `Service B`, and `Service C`. `Service A` calls `Service B`, and
    `Service B` calls `Service C`. And imagine that `Service C` runs out of memory
    and is very slow to serve requests to `Service B`. And even though `Service B`
    may have a timeout set up for calling `Service C`, if enough requests stack up
    against `Service B`, which require the use of `Service C` at a fast enough rate,
    resources at `Service B` will be entirely consumed before that timeout is ever
    reached, which in turn will cause `Service B` to fail. This same problem can happen
    all the way up the chain.


    ### Multiple issues at play


    * Fault tolerance problem

    * Resource overloading problem


    There are multiple issues at play here. First, we have a fault tolerance problem.
    Calling services are unaware that the service that they''re calling is likely
    to fail and yet they still attempt to call the service. And second, we have a
    resource overloading problem. Calling services are allowed to invoke dependent
    services with pretty much unconstrained resources.


    # Embracing Failure with the Circuit Breaker Pattern


    * Learn to embrace failure

    * Tolerate failures

    * Gracefully degrade

    * Limit resources consumed

    * Constrain usage


    So how do we solve this problem of cascading failures and failures in general
    in a distributed system? Well, we have to learn to embrace and tolerate failures
    and degrade gracefully when we do. So in the event that a downstream dependent
    service is failing, it''s actually better for the caller not to attempt to make
    a call to the dependent service, which is likely to fail. And instead, the caller
    should fail fast or degrade gracefully, perhaps by returning old data or empty
    results, and allow the failing service to recover. And then periodically check
    if the service has recovered. And, in turn, what this does is it relieves pressure
    from any upstream services that are waiting for a response. And the other thing
    that we need to do is we need to limit the resources that are consumed. So clients
    should put limits on the number of resources allowed to call a dependent service.
    And what this does is it prevents those requests from stacking up unconstrained,
    which could cause the client to fail itself. The first strategy for fault tolerance
    is actually a well-known pattern, so much so that it has its own name. And it''s
    called the Circuit Breaker pattern. And the Circuit Breaker pattern is a design
    pattern in modern software used to detect failures and encapsulate the logic of
    preventing those failures from reoccurring constantly. The name Circuit Breaker
    comes from the idea that the pattern shares a lot of similarities with how a real
    circuit breaker works. And you may or may not be familiar with what a circuit
    breaker is, so let me quickly explain. A circuit breaker is a switch that prevents
    too much current from flowing through a circuit. And if too much current flows
    through a circuit, it could cause damage or even start things on fire. And what
    the circuit breaker does is it prevents that by opening the circuit when it detects
    that there''s too much current flowing through it. And you most likely have something
    like this in your residence to prevent your circuits from becoming overloaded.
    And, if you notice, all of the switches are flipped down, and thus all of the
    circuits are closed. Suppose you accidently overload the rightmost circuit by
    plugging in a device that consumes a lot of power. And the circuit breaker would
    detect this and break the circuit, or open it, and prevent any additional current
    from flowing through it. And you can see switch is flipped up indicating that
    the circuit has been broken and there is no more current flowing through it. By
    now, I''m sure you can see the common theme between a real circuit breaker and
    the Circuit Breaker pattern. Both are meant to detect and prevent failures that
    might damage other components.


    # Fault Tolerance with Netflix Hystrix and Spring Cloud


    Spring Cloud implements fault tolerance with the help of a library from Netflix
    called Netflix Hystrix. Hystrix is a latency and fault-tolerance library, and
    it was designed to stop cascading failures and enable resiliency in distributed
    systems.


    * Implements the circuit breaker pattern

    * Wraps calls and watches for failures

    * 10 sec rolling window

    * 20 request volume

    * >= 50% error rate

    * Waits & tries a single request after 5 sec

    * Fallbacks

    * Protects services from being overloaded

    * Thread pools, semaphores, & cascading failures

    '
