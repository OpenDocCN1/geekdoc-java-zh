    \ `RequestContext` 内部有一个 `addZuulRequestHeader` 方法。假设我们的用例是添加传入请求的位置，因此我们将此标头命名为\
    \ `x-location`。我们将对它进行模拟；假定每个请求都来自 `USA`。最后，记住返回值在当前实现中实际上并没有被使用，因此返回 `null` get\
    \ 我们的目的来说是没问题的。关闭此文件并打开我们的主应用程序类。在我们的主应用程序类中，我们将为它加上 `@Configuration` 注解。\n\n\
    ```java\npackage io.ajay.kumar;\n\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.client.discovery.EnableDiscoveryClient;\n\
    import org.springframework.cloud.netflix.zuul.EnableZuulProxy;\nimport org.springframework.context.annotation.Bean;\n\
    import org.springframework.context.annotation.Configuration;\nimport io.schultz.dustin.filters.AddRequestHeaderFilter;\n\
    \n@SpringBootApplication\n@EnableZuulProxy\n@EnableDiscoveryClient\n@Configuration\n\
    public class GatewayServiceApplication {\n\n    public static void main(String[]\
    \ args) {\n        SpringApplication.run(GatewayServiceApplication.class, args);\n\
    \    }\n\n    @Bean\n    public AddRequestHeaderFilter addRequestHeaderFilter()\
    \ {\n        return new AddRequestHeaderFilter();\n    }\n}\n```\n\n"
- fmt: "\n# The need for intelligent routing\n\n* Gateway service\n* Netflix Zuul\n\
    * `@EnableZuulProxy`\n* Configuring routes\n* Writing filters\n\nFirst, we looked\
    \ at the reasons why Intelligent Routing is needed in the first place and why\
    \ it's important. Then we looked at how routing is implemented via an API Gateway,\
    \ or a gateway service. And last, we saw how we can use `Netflix Zuul` as a gateway\
    \ service to route and filter our requests and responses to and from back-end\
    \ services.\n\n# Module 6: Calling Services Using Client-side Load Balancing\n\
    \n## Module Introduction\n\nIn this module we'll learn how to utilize client-side\
    \ load balancing to distribute the workload of a service in a cloud-native application.\n\
    \n* Load balancing\n* Server-side\n* Client-side\n* Netflix Ribbon\n* With & without\
    \ service discovery \n* `@LoadBalanced`\n* `@RibbonClient`\n* Custom Ribbon configuration\n\
    \nWe'll start off with what is load balancing, and what role does it play in a\
    \ cloud-native application? Then we'll talk about traditional server-side load\
    \ balancing, which you're probably already familiar with. Then we'll introduce\
    \ client-side load balancing, what it is and how it differs from server-side load\
    \ balancing. Next, we'll introduce `Netflix Ribbon` and how we can utilize it\
    \ with `Spring Cloud` to implement client-side load balancing. We'll learn how\
    \ to implement it with and without service discovery using two new annotations:\
    \ the `@LoadBalanced` annotation and the `@RibbonClient` annotation. We'll finish\
    \ off the module with a section on how to customize `Ribbon`s configuration for\
    \ things like different load balancing algorithms or different ways to check the\
    \ health of a service before sending a request to it.\n\n## Client-side vs. Server-side\
    \ Load Balancing\n\nSo what is load balancing? Simply put, load balancing is a\
    \ way to improve the distribution of workload across multiple computing resources.\
    \ And you probably already knew that, so the more important question is what role\
    \ does load balancing play in a cloud-native architecture? And the answer to that\
    \ is actually a very important one, probably even more important than in a non-cloud-native\
    \ architecture. And the reason for that becomes clearer when you look at the differences\
    \ in the architecture. In a non-cloud-native application, you go from having multiple\
    \ instances of a single application with a single load balancer to multiple services\
    \ with multiple instances and multiple load balancers. And you can start to see\
    \ the importance of a load balancer just by the sheer number of load balancers\
    \ that we need in a cloud-native application. There are typically two different\
    \ types of load balancers. There's the server-side load balancer where the server\
    \ is responsible for the distribution of the load, and there's the client-side\
    \ load balancer where the caller is responsible for the distribution of the load.\
    \ Let's take a look at each of these in a bit more detail. With server-side load\
    \ balancing, a request to another service doesn't go directly to the service itself\
    \ and instead goes to a server in front of the service, which then decides which\
    \ of the multiple instances it should forward the request to. With client-side\
    \ load balancing, there is no intermediary. The client, or the caller of the service,\
    \ is aware of all of the instances of a service via a known list or service discovery.\
    \ And the client is then responsible for deciding which of the multiple instances\
    \ it should send the request to. To solidify our understanding of server-side\
    \ versus client-side load balancing, let's look at each of them side by side.\n\
    \n### Server-side\n* Server distributes requests\n* Hardware or software based\n\
    * Extra hop\n* Various balancing algorithms support\n* Occurs outside of the request\
    \ process\n* Centralized or distributed\n\n### Client-side\n* Client distributes\
    \ request\n* Software based\n* No extra hops\n* Various balancing algorithms support\n\
    * Occurs within the request process\n* Typically distributed\n\nWith server-side\
    \ load balancing, the server obviously distributes the request, and with client-side\
    \ load balancing, the client obviously distributes the request. Server-side load\
    \ balancing is typically hardware based, but it can also be software based. Client-side\
    \ load balancing, on the other hand, is software based. You incur an extra hop\
    \ with server-side load balancing since the request doesn't go directly to the\
    \ service and has to go through an intermediary first. Whereas with client-side\
    \ load balancing, you don't incur any extra hops once you know the location of\
    \ the services. Both server-side and client-side load balancing have support for\
    \ various load balancing algorithms. With server-side load balancing, the actual\
    \ load balancing happens outside of the request process, whereas with client-side\
    \ load balancing, the actual load balancing happens within the request process.\
    \ And lastly, server-side load balancing can be either centralized or distributed,\
    \ whereas client-side load balancing is typically distributed. Given all of these\
    \ differences, it's clear that client-side load balancing is a natural fit for\
    \ cloud-native architectures.\n\n## Getting Started with Spring Cloud and Netflix\
    \ Ribbon\n\nWe've set the stage for client-side load balancing. Now let's talk\
    \ about how to actually implement it with `Spring Cloud`. As I mentioned in the\
    \ introduction to this module, we'll use a library called `Netflix Ribbon` to\
    \ implement client-side load balancing. And `Netflix Ribbon` is an Inter Process\
    \ Communication library that has built-in software load balancers. `Spring Cloud`\
    \ adds full integration with `Netflix Ribbon` to `Spring`'s `RestTemplate` class.\
    \ And we'll go into detail about what this exactly means, but in essence our `RestTemplate`\
    \ will now understand how to balance requests across multiple instances of a service.\
    \ `Spring Cloud` also adds features that make it really easy to declare different\
    \ types of load balancing algorithms and availability checks. Next, let's talk\
    \ about how to use `Spring Cloud` and `Netflix Ribbon`. And before we get started,\
    \ just a quick note. In each of these sections I'll explain all of the steps necessary\
    \ to get going, and then at the end we'll walk through a demo where you can follow\
    \ along. Using `Netflix Ribbon` with `Spring Cloud` is extremely easy, just like\
    \ all the other `Spring Cloud` projects.\n\n### Using SpringCloud &Netflix Ribbon\n\
    \npom.xml\n```xml\n<dependencyManagement>\n  <dependencies>\n    <dependency>\n\
    \      <groupId>org.springframework.cloud</groupId>\n      <artifactId>spring-cloud-dependencies</artifactId>\n\
    \      <version>Camden.SR2</version> \n      <type>pom</type>\n      <scope>import</scope>\n\
    \    </dependency>\n  </dependencies>\n</dependencyManagement>\n```\n"
