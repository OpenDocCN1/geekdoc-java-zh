    Let''s go ahead and annotate this with @Component and also @ConfigurationProperties.
    And we''re going to give this a prefix equal to some. This ConfigurationProperties
    is going to represent our property that''s named some.property. We''ll have an
    instance variable that is a string, so private String. And the name of it is called
    property, again, to represent some.property. And make sure that you don''t forget
    the getters and setters. You can do that by going to Source, Generate Getters
