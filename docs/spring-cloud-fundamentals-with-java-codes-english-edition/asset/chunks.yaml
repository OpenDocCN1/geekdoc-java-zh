    第一个是加密端点，你可以用它来生成在配置中使用的加密值。正如我所说，它的使用非常简单。你所需要向 `/encrypt` 端点发送一个 `POST` 请求，并将你想要加密的值作为请求体传递过去。`Config
    Server` 将使用其配置的密钥（无论是对称密钥还是非对称密钥）来加密该值。再次，我必须强调这一点：请务必使用 `Spring Security` 或其他手段确保该端点是安全的，使其仅允许授权用户访问。


    ## 工具类 REST 端点：解密值


    - 端点

    - `POST /decrypt`

    - 示例

    - 请求：`/decrypt`

    - 数据：`<value_to_decrypt>`


    解密端点与加密端点几乎完全相同，除了名称和输入之外。你主要将其用于调试目的。因此，要解密一个值，你会向 `/decrypt` 发送 `POST` 请求，并将加密值作为请求体发送，它将为你返回未加密的值。


    ## 总结


    - 云端配置的爆炸以及对配置服务器的需求

    - 使用 `Spring Cloud Config Server & Client`

    - 在不重启的情况下运行时更新配置

    - 配置的加密与解密


    我们已经到达本模块的末尾，让我们花时间回顾一下所学的内容。我们涵盖了许多主题。我们首先讨论了在云环境中需要一个 `Configuration Server`，以管理管理分布式系统带来的配置爆炸。然后，我们学习了如何配置
    `Spring Cloud Config Server` 来提供我们的配置文件，以及如何使用 `Spring Cloud Config Client` 配合
    `bootstrap.properties` 或 `bootstrap.yml` 在应用程序初始化期间检索配置。之后，我们看到了如何向同事炫耀我们可以在无需重启应用程序服务器的情况下运行时更新配置。我们还看到了哪些内容会自动刷新，以及哪些内容需要
    `@RefreshScope` 注解。最后，我们通过关于如何利用 `Spring Cloud Config` 内部加密和解密支持的章节完成了本模块。


    # 第 5 模块：使用智能路由映射服务


    ## 什么是智能路由？


    在本模块中，我们将学习如何使用智能路由在云端中映射我们的服务。


    - 云原生应用中的路由

    - `Netflix Zuul`

    - 代理服务器

    - 设置路由

    - 设置过滤器


    我们将首先讨论什么是智能路由以及它为我们解决了什么问题。然后，我们将介绍作为 `Spring Cloud Netflix` 项目一部分的 `Netflix
    Zuul`。我们将看到如何设置代理服务器、如何配置不同的路由以及如何设置过滤。请记住，为了尽可能具有动态性和可扩展性，云原生系统是由一个个可以独立部署的服务组成的，这些服务共同构成了一个整体系统。然而，随之而来了一些挑战。


    ### 单个服务的挑战


    - 不同的端口

    - 不同的地址

    - 不同的 API 和 路径


    每个独立的服务可能运行在不同的端口、不同的地址上，或者两者的结合上。它们还可能具有不同的路径和不同的 API 用于交互。作为这些服务的用户或客户端（例如移动端
    App 或 Web App），要与每个独立服务（其数量可能轻松达到双位数或三位数）进行交互将是一场噩梦。相反，我们可以使用智能路由让我们的应用程序看起来像是一个单一系统。就像一个完成的拼图看起来是一个整体，但它实际上是由几个不同的单独部分组成的。


    ## 通过网关服务的智能路由


    路由通常通过称为网关服务或 `API Gateway` 的东西来实现。`API Gateway` 或网关服务被定义为所有客户端的单一入口点因此，在很多方面，网关服务非常像我们系统的正门。而每个独立的服务都位于这扇门之后，所有请求必须通过它进入。


    ### 网关服务提供


    - 动态路由与交付

    - 安全与过滤

    - 审计与日志记录

    - 请求增强

    - 负载均衡

    - 针对不同客户端提供不同的 API


    网关服务不仅提供了动态路由和交付（这意味着在运行时它可以决定应该将请求路由到哪里，以及是否应该路由请求），还提供了一系列其他功能。其中一项功能就是安全。它提供了验证所有入站请求的能力，并过滤掉任何非法或错误的请求。由于所有请求都必须通过网关，它实际上是提供请求审计和日志记录的极佳候选者。它还提供了所谓的“请求增强”功能，这只是一个高级的说法，意味着它可以向请求中添加额外信息，或者说可以丰富请求。这方面一个具体的例子是
    `Netflix` 使用他们网关的方式。他们使用网关服务对所有进入请求进行地理位置查找，并将该额外信息作为额外的请求头添加，以便所有下游服务都能使用。网关服务还可以作为其后独立服务的负载均衡器。网关服务的另一个有趣特性是能够为不同的客户端提供不同的
    API。API 并不是一成不变的，不同的客户端（如 Web 客户端或移动客户端）在调用你的 API 方面有不同的需求。例如，Web 客户端与多个端点交互以完成某些功能可能是可以，但对于移动客户端可能就不适用，它可能只需要单个端点的服务更好。


    ### 在 Spring Cloud 中使用 Zuul


    智能路由是通过 `Spring Cloud` 和来自 `Netflix` 的项目组合实现的。该项目名为 `Netflix Zuul`，发音为 zool，与单词
    tool 押韵。`Netflix Zuul` 项目页面将其定义为提供动态路由、监控、弹性和安全的网关服务。`Zuul` 这个名字其实是个好名字，因为 `Zuul`
    是电影《捉鬼者》中的一个虚构怪物，就像网关服务的守门员一样。我们将讨论如何将 `Spring Cloud` 和 `Netflix Zuul` 添加到项目中，然后进行实战演示。和所有的
    `Spring Cloud` 项目一样，将 `Spring Cloud` 和 `Netflix Zuul` 添加到你的项目中非常简单。


