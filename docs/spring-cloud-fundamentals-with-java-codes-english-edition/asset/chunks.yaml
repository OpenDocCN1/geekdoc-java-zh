    ## Customizing Your RibbonClient Configuration: The IPing Bean


    The IPing bean is responsible for choosing the strategy to check the liveliness
    or the availability of a given instance that''s being load balanced. Just like
    the IRule bean, you can also implement your own custom IPing implementations,
    or you can choose from one of the several different defaults. Let''s take a look
    at what''s available.


    *   IPingImplementations


    *   DummyPing


    *   PingUrl


    *   NIWSDiscoveryPing


    There''s the DummyPing implementation, which is just as dumb as it sounds. It''s
    simply always returning true when it''s asked about the liveliness of a service.
    You''d use this if you simply don''t care to check the liveliness or the availability
    and you always want to send traffic to all of the instances regardless. There''s
    the PingUrl implementation, which is an implementation that allows you to set
    an expected response and then makes an actual HTTP call to the service and checks
    the result. So you''d typically point this at something like the service''s health
    check URL. And then there''s the DiscoveryPing implementation, which would be
    something that would be automatically configured for you if you were using something
    like Eureka service discovery. And what this would do is it would just consult
    with the discovery client to determine the liveliness of any particular instance.
    Again, let''s look at an example to make this a bit more concrete.


    IPing: Liveliness Check


    @Configuration


    public class OtherServiceConfig{


        @Bean


        public IPing ribbonPing(){


        PingUrl pingUrl=new PingUrl();


        pingUrl.setExpectedContent("true");


        return pingUrl;


    }


    }


    So just like we did with the IRule implementation, you would define a new method
    annotated with the @Bean annotation, and then you return the implementation of
    your choice. So in this case, we''re going to return a PingUrl. So we create a
    new instance of the PingUrl, we set the expected content to true, and then return
    that instance.


    ## Demo: Customizing the RibbonClient Load Balancing Strategy


    In this demo, we''ll learn how to customize our Ribbon client that we''re using
    to call the ribbon-time-service. And again, we''re going to be building on the
    previous demo. So make sure that you''ve completed the demo where you set up a
    Ribbon client without using service discovery. The first thing we''ll do is we''ll
    come up here to the green Play button and start each of the instances of the ribbon-time-service.
    Both of the ribbon-time-service instances are started. Now remember, in order
    to create custom configuration for a Ribbon client, we need to create our own
    @Configuration class. Let''s open the ribbon-time-app project and create a new
    package. So right-click, New, and come here to Package. And we''re actually going
    to rename this from io.ajay.kumar to io.ajay.config.kumar. Remember that we want
    to have a different package name so that the @Configuration class isn''t subject
    to component scanning; otherwise, it would apply to all of our Ribbon clients.
    In the new package, right-click and go to New and choose Class. And we''ll call
