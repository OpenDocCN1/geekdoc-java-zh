    ## Demo: Creating and Using a ZuulFilter


    In this demo, we''ll learn how to implement a Zuul filter to add an additional
    header to the incoming request so that it''s available for downstream services
    to consume. We''ll start from where we left off in the previous demo. And remember
    that we had four different services. We had the discovery-server that was doing
    service discovery, we had the gateway-service, which was our edge service, and
    then we had two application services, the goodbye-service and the hello-service.
    Since we''re building a filter, we''ll start off in the gateway-service. So go
    ahead and expand the gateway-service and create a new package. So go ahead and
    New, Package, and we''ll call this io.ajay.kumar.filters. And within that new
    package create a new class, so New, Class, and we''ll call this AddRequestHeaderFilter.
    And remember that we have to extend the ZuulFilter class, so the superclass for
    our class will be ZuulFilter.


    package io.ajay.kumar.filters;


    import com.netflix.zuul.ZuulFilter;


    import com.netflix.zuul.context.RequestContext;


    public class AddRequestHeaderFilter extends ZuulFilter {


    @Override


    public boolean shouldFilter() {


     return true;


    }


    @Override


    public Object run() {


     RequestContext ctx = RequestContext.getCurrentContext();


     ctx.addZuulRequestHeader("x-location", "USA");


     return null;


    }


    @Override


    public String filterType() {


     return "pre";


    }


    @Override


    public int filterOrder() {


     return 0;


    }


    }


    For the first method, the shouldFilter method, let''s go ahead and change that
    from return false to return true. We''re always going to apply this filter. And
    let''s skip over the run method for right now and go down to the filterType. And
    this particular filter we''re going to create a pre filter, so we can say return
    pre. And then for the filterOrder, return 0 is okay, so we''ll just leave that
    the same. In order to get access to the request to add headers to it, we need
    to get access to the RequestContext. So let''s clear this TODO and say RequestContext
    ctx = RequestContext.getCurrentContext. And within the RequestContext there''s
    the addZuulRequestHeader method. And image that our use case is to add the location
    of the incoming request, so we''ll name this header x-location. And we''re going
    to mock this; we''ll say that every request comes from USA. And then last, remember
    that the return value is not actually used in the current implementation, so returning
    null is going to be okay for our purposes. Let''s close this file and open up
    our main application class. And within our main application class, we''ll annotate
