    \ In the Group use `io.ajay.kumar`, and for the artifact name you can just call\
    \ it `turbine`. And for the dependencies, we'll obviously want to add `Turbine`.\n\
    \n![](images/00063.gif)\n\nAnd once you have everything filled out, click that\
    \ `Generate Project` button, and that'll create and download that zip file for\
    \ you. And, like always, unzip that zip file and import that into your IDE. We're\
    \ back within the IDE where we've imported the `Turbine` project.\n\n![](images/00064.gif)\n\
    \nGo ahead and expand the project and navigate to the main application class.\n\
    \n```java\npackage io.ajay.kumar.turbine;\n\nimport org.springframework.boot.SpringApplication;\n\
    \nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\nimport\
    \ org.springframework.cloud.netflix.turbine.EnableTurbine;\n\n@SpringBootApplication\n\
    @EnableTurbine\npublic class TurbineApplication {\n    public static void main(String[]\
    \ args) {\n        SpringApplication.run(TurbineApplication.class, args);\n  \
    \  }\n}\n```\n\nIn the main application class, we'll add one new annotation, and\
    \ that's the `@EnableTurbine` annotation. Next, we'll need to configure some properties,\
    \ so go ahead and close that file and navigate to `src/main/resources/application.properties`.\n\
    \n`application.properties`\n```properties\nserver.port=3000\nspring.application.name=turbine-aggregator\n\
    eureka.client.service-url.defaultZone=http://localhost:8761/eureka\nturbine.app-config=weather-app,datetime-app\n\
    turbine.cluster-name-expression='default'\n```\n\nIn the `application.properties`,\
    \ we have a number of different properties to set, so I'm going to go ahead and\
    \ paste those in here, and then we're going to go through each one of them one\
    \ by one. The first property, the `server.port`, we're going to set that to `3000`.\
    \ The next property, the `application.name`, we're going to call it `turbine-aggregator`.\
    \ And then the third property, the `eureka.client.service-url`, set that to `localhost:8761/eureka`.\
    \ And then below that, we have the two `turbine` properties. And remember the\
    \ first one, the `turbine.app-config` property, sets the applications or services\
    \ that you want `Turbine` to aggregate together as a stream. In our case, we want\
    \ the `weather-app` and the `datetime-app`. And then the last property, the `turbine.cluster-name-expression`,\
    \ we just set that to `default` surrounded by single quotes. And that's all for\
    \ our properties, so go ahead and close that file, and then we're going to go\
    \ ahead to start the `Turbine` application. So come over to the main application\
    \ class, right-click on it, go to `Run As`, and choose `Spring Boot App`. Next,\
    \ open up a web browser, and we're going to visit the datetime app and the weather\
    \ app to generate some metrics for their `Hystrix` streams so that `Turbine` can\
    \ them collect them. So let's visit the datetime app first. So go to `localhost:4000/current/datetime`.\n\
    \n![](images/00065.jpeg)\n\nAnd just refresh that a few times to generate some\
    \ metrics. And then we're going to do the same thing for the weather service,\
    \ so go to `localhost:8000/current/weather`, and then also refresh that a few\
    \ times to generate some metrics.\n\n![](images/00066.jpeg)\n\nNext, open up a\
    \ New Tab and visit `localhost:8080/hystrix`.\n\n![](images/00067.jpeg)\n\nAnd\
    \ this time, instead of putting in the `hystrix.stream` URL, we'll use the `turbine.stream`\
    \ URL. So go ahead and type `http://localhost:3000/turbine.stream`. And then in\
    \ the Title textbox just type `Turbine`. After that, click the `Monitor Stream`\
    \ button, and you should see metrics from the datetime app.\n\n![](images/00068.jpeg)\n\
    \n## Summary\n\nWe're at the end of this module so, like always, let's do a recap\
    \ of what we learned.\n\n- Fault tolerance is a requirement\n- Netflix Hystrix\n\
    - Circuit breaker pattern\n- `@HystrixCommand`\n- `@EnableTurbine`\n- Hystrix\
    \ Dashboard & Turbine\n- Monitor one or several streams\n\nFirst, we saw that\
    \ failures in a distributed system are pretty much inevitable. And we have to\
    \ learn to embrace failures and make handling failures a requirement. Then we\
    \ introduced Netflix Hystrix, which is an implementation of the Circuit Breaker\
    \ pattern, among others. And we saw how to use the `@EnableTurbine` annotation\
    \ and `@HystrixCommand` annotation to protect a call that might fail. We concluded\
    \ the module by looking at how we can visualize and monitor our calls with the\
    \ Hystrix Dashboard and how we can monitor several streams at once with Turbine.\n\
    \n## Bringing It Together\n\nThe question is how does it all fit together to form\
    \ a cloud-native system? And, to start, let's recap everything that's involved.\
    \ It all starts with one or more application services.\n\n![](images/00069.gif)\n"
