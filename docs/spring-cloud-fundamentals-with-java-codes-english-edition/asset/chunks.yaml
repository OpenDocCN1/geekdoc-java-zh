  trans: '


    让我们来谈前提条件。我假设你对 `Java` 尤其是 `Java 8` 有很好的理解，并且对 `Spring Boot` 也有良好的了解，因为 `Spring
    Cloud` 大程度上是构建在 `Spring Boot` 之上的。最后，我预计你至少对微服务或面向服务的架构有了解或理解。


    - `Java 8+`

    - `Maven 3+`

    - `Spring Tool Suite (Eclipse STS)` `3.8+`


    接下来，我们来谈谈完成这本书需要哪些软件。当然，你将需要 `Java`、`Java 8`，并且你需要 `Maven`（至少是 `Maven 3`）来构建 `Spring
    Boot` 应用。我们将使用 `Spring Tool Suite`（或者称之为 `Eclipse STS`）进行所有的开发。请确保你的版本至少为 `3.8`。


    # 第 3 模块：使用服务发现查找服务


    ## 什么是服务发现？


    在本模块中：

    - 服务发现

    - 使用 `Spring Cloud` 发现

    - 使用 `Eureka` 客户端和服务器

    - 配置

    - 健康状况与高可用性

    - 仪表板 (Dashboard)

    - AWS 支持


    在本模块中，我们将介绍服务发现如何帮助你在云端定位你的应用程序服务。让我们快速开始讨论本模块包含的内容，首先是服务发现。显然，这个模块是关于服务发现的，所以我们将讨论它是什么以及它为什么重要。然后，我们将介绍
    `Spring Cloud` 如何实现服务发现。它使用了一个来自 `Netflix` 的开源项目，称为 `Eureka`，我们将讨论 `Eureka Client`（Eureka
    客户端）和 `Eureka Server`（Eureka 服务器）。接着，我们将进入配置，配置 `Eureka Client`、`Eureka Server`
    以及 `Eureka Instance`（Eureka 实例），以及它们各自有何不同，你需要根据需要对它们进行哪些调整或配置。


    然后，我们将进入健康状况和高可用性部分。`Eureka Server` 如何知道你的应用程序何时宕机或何时不健康？你如何确保 `Eureka Server`
    是高可用的？然后我们将查看 `Eureka Dashboard`，这是一个非常好的 Web UI，可以向你显示所有已注册的服务、有多少个实例，以及它们是运行还是停止状态。最后，我们将以
    `Eureka` 如何对 `AWS` 提供特定支持作为结束。


    让我们从最重要的问题开始：什么是服务发现，我们为什么需要它？记住，云正在改变我们构建软件的方式。我们正在从构建这些单一大型应用转变为将它们拆分成越来越小的、被称为“服务”的部分。每一个单独的服务都可以独立进行部署和扩展，而它们作为一个整体共同构成了整个应用程序。问题就在于此：一个服务如何知道另一个服务的位置（其主机和端口），以便调用并使用它？


    作为开始，我们可以简单地配置所有的服务，让它们知道所调用的其他服务的位置和端口。根据我们的需求，这实际上可能让我们走得很远。但过段时间，我们会发现这种方法存在一些问题。例如，如果你有某个特定服务的两个实例怎么办？在我们的示例中，我们有
    `Application Service A` 用 `Application Service B`。如果我们使用配置，每当我们添加或移除 `Application
    Service B` 的新实例时，我们都必须更新该配置。嗯，在我们的示例中，我们只有两个实例。想象一下如果你有数百个实例，光是配置管理将是无法持续的。


    当我们迁移到云环境时，我们的简单配置会进一步瓦解。在云环境中，服务的实例可以根据需要随时来去去。例如，`Application Service B` 初始启动了两个实例，考虑一下你可能有巨大的流量涌入，也许是你的电子商务网站正在进行闪杀活动，一个自动化流程启动并开启了另外两个实例来处理所有这些需求。如果你使用简单的配置，那么
    `Application Service B` 的所有调用者（如 `Application Service A`）甚至不知道为了响应这些需求而添加的两个新实例。对它们来说，它们的配置中显示只有它们已知的两个实例。


    另一个需要考虑的因素是，应用程序服务最终会失败。无论情况如何，无论是内存问题还是硬件问题，如果你使用简单的配置，你的服务将继续尝试向那些故障实例发送流量。例如，这里我们有
    `Application Service A` 调用 `Application Service B`，且后者有两个实例。如果其中一个实例失败了，`Application
    Service A` 并不会知情，它将继续向那个故障实例发送流量。我们需要一种更动态的东西。这种简单的方法太静态了，对于我们在云端的需求来说，它太死板了。这就是服务发现大显身场的地方。


    服务发现提供了：

    - 服务注册自身的方式

    - 服务注销自身的方式

    - 客户端查找其他服务的方式

    - 检查服务健康状况并移除不健康实例的方式


    服务发现通常提供以下类型的功能。服务注册自身的方式。这意味着当一个服务上线时，它可以调用 `Service Discovery Server` 并让其知道该服务的位置和端口，以便其他应用程序可以调用它。出于恰恰相反的原因，服务发现提供了服务注销自身的方式。如果一个服务要关闭或临时离开，它希望让
    `Service Discovery Server` 知晓它不再供客户端使用。最重要的，服务发现提供了客户端查找其他服务的方式。我所说的客户端指的是其他应用程序服务。如果你是一个需要使用另一个服务的应用程序，你需要找到该服务的位置和端口，你可以向
    `Service Discovery Server` 请求这些信息。最后，服务发现提供了检查服务健康状况并移除不健康实例的方式。因此每个应用程序都会实现健康检查（通常通过
    `REST` 端点），然后 `Service Discovery Server` 会调用该端点。如果健康检查失败，它会将该实例从注册表中移除。


    ## 介绍 Spring Cloud Netflix


    现在我们已经很好地了什么是服务发现以及它为什么重要，让我们学习 `Spring Cloud` 如何帮助我们实现它。


    使用以下方式发现服务：

    - `Spring Cloud Consul`

    - `Spring Cloud Zookeeper`

    - `Spring Cloud Netflix`


    实际上，有几种不同的方式可以使用 `Spring Cloud` 来发现服务。有 `Spring Cloud Consul` 项目、`Spring Cloud
    Zookeeper` 项目，还有 `Spring Cloud Netflix` 项目。我们将专门关注最后一个，即 `Spring Cloud Netflix`
    项目。`Netflix` 的人们在云端构建可扩展应用程序方面拥有丰富的经验。事实上，你甚至可以说他们面临着你能想象的最大规模的可性问题。他们在内部构建了一些项目来处理这些问题，并最终将其作为开源项目发布。


    ```

    Netflix OSS + Spring + Spring Boot = Spring Cloud Netflix

    ```


