    so that requests don''t stack up at the caller and consume those valuable resources.
    And the last number in the second column, the red one, is the number of failed
    requests. And these are requests that failed to execute because they threw an
    exception. Now that we''ve got a firm understanding of how to read the Hystrix
    Dashboard, let''s set up and enable our own so that we can visualize some of the
    metrics that are being admitted from the call that we protected with Hystrix in
    our previous demo.


    ## Demo: Monitoring Fault Tolerance Metrics with Hystrix Dashboard'
  toc: []
  trans: "\n天气应用的属性与天气服务中的属性非常相似，所以我直接把它们复制并粘贴到这里。然后，我们只需要更改其中的一些值。对于 `server.port`，我们将将其更改为\
    \ `8000`；对于 `spring.application.name`，我们将将其更改为 `weather-app`。我们已经准备好启动天气应用了，请关闭该文件并打开控制台（Console）。仔细检查你的发现服务器和天气服务是否仍在运行，然后回到主\
    \ `WeatherAppApplication` 类，右键点击它，选择 `Run As`（运行），并选择 `Spring Boot App`。接下来，打开浏览器并访问\
    \ `localhost:8000/current/weather`。\n\n![](img/00051.jpeg)\n\n你应该会在这里得到一个响应。你可以刷新几次来查看不同的值。接下来，我们要做的是关闭天气服务。我们会看到\
    \ `Hystrix` 接管并识别出天气服务已关闭，然后返回我们的回退级方法（fallback method）。因此，在关闭天气服务后，我们应该看到当前天气为未知（unknown）。现在我们回到\
    \ IDE，控制台中显示着天气服务。我们将停止天气服务并回到浏览器。回到浏览器后，我们刷新页面，可以立即看到当前天气为未知。\n\n![](img/00052.jpeg)\n\
    \n`Hystrix` 意识到对天气服务的调用正在失败，它应该使用它的回退方法。\n\n## 使用 Hystrix Dashboard 进行指标监控和洞察\n\
    \nNetflix `Hystrix` 跟踪受保护调用的执行状态，以便它知道何时触发断路器。此的优点之一是我们可以利用这些指标来洞察调用的运行情况。以原始形式读取这些指标既不利也不高效。这就是\
    \ `Hystrix Dashboard` 派上用场的地方。它是一个 Web 应用程序，帮助你以快速、易用的方式可视化所有这些指标。仪表板充满了信息。\n\n\
    * 跟踪指标，例如：\n* 断路器状态（Circuit state）\n* 错误率（Error rate）\n* 流量负载（Traffic volume）\n\
    * 成功请求（Successful requests）\n* 被拒绝的请求（Rejected requests）\n* 超时（Timeouts）\n* 延迟百分位数（Latency\
    \ percentiles）\n* 监控受保护的调用（Monitor protected calls）\n* 单个服务器或集群（Single server\
    \ or cluster）\n\n它跟踪并显示断路器状态的信息（无论是开启还是关闭）、调用的错误率、它接收的流量负载、有多少个请求成功、被拒绝或超时，以及调用的延迟百分位数。你还可以用它来跟踪单个服务器或服务器集群。要使用它，实际上只需在你的\
    \ `pom.xml` 中声明几个依赖并添加单个注解即可。\n\n## 使用 Spring Cloud 和 Netflix Hystrix Dashboard\n\
    \n为了使用 `Hystrix Dashboard`，你首先需要像往常一样，在 `pom.xml` 的 `dependencyManagement` 部分声明一个\
    \ `spring-cloud-dependencies` 的新依赖。\n\n`pom.xml`\n```xml\n<dependencyManagement>\n\
    \    <dependencies>\n        <dependency>\n            <groupId>org.springframework.cloud</groupId>\n\
    \            <artifactId>spring-cloud-dependencies</artifactId>\n            <version>Camden.SR2</version>\n\
    \            <type>pom</type>\n            <scope>import</scope>\n        </dependency>\n\
    \    </dependencies>\n</dependencyManagement>\n```\n\n并且，一如既往，确保它的类型为 `pom` 且范围（scope）为\
    \ `import`。\n\n`pom.xml`\n```xml\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
    \    <artifactId>spring-cloud-starter-hystrix-dashboard</artifactId>\n</dependency>\n\
    ```\n\n然后，仍然在 `pom.xml` 的 `dependency` 部分，定义对 `spring-cloud-starter-hystrix-dashboard`\
    \ 的新依赖。最后，你可能已经猜到了，添加 `@EnableHystrixDashboard` 注解。\n\n```java\n@SpringBootApplication\n\
    @EnableHystrixDashboard\npublic class Application{\n    public static void main(String[]args){\n\
    \        SpringApplication.run(Application.class,args);\n    }\n}\n```\n\n这就是你开始使用\
    \ `Hystrix Dashboard` 需要的所有内容。\n\n## 读取和理解 Hystrix Dashboard\n\n在我们开始设置 `Hystrix\
    \ Dashboard` 的演示之前，理解如何读取仪表板非常重要，因为它在非常小的空间内包含了大量信息。\n\n![](img/00053.gif)\n\n\
    我们将关注 `Circuit`（断路器）标题下的上半部分，因为下半部分 `Thread Pools`（线程池）非常自言易懂。仪表板字面意义上充满了信息。第一次看到它时可能会有些无从从，所以让我们分部分拆解。在右上角，你有一个受保护的\
    \ `Hystrix` 调名称，在这张图中它是 `getCurrentWeather` 调用。\n\n![](img/00054.gif)\n\n在左侧，有一个圆代表请求量，也代表了调用的健康状况。圆越大，请求量越高；圆越红，调用的健康状况越差。在圆的上方，线条是过去\
    \ 2 分钟内请求速率的描述。回到右侧，在受保护调用名称下的灰色是调用的错误率。在它下方是主机级别以及集群级别的每秒请求数。继续向下，仍在右侧，你拥有该调用的断路器状态，以及它是开启（open）拒绝流量还是关闭（closed）接受流量。在它正下方是延迟百分位数。回到顶部，受保护调用名称下方有一组不同颜色的数字。让我们放大这个特定区域，以便解释其中的每一个数字。对于数字，我们将按列和按行逐一移动。以防你忘记，`Hystrix\
    \ Dashboard` 顶部有一个图例，看起来像这样。\n\nimages/00055.gif)\n\n从第一列第一行开始，深绿色数字代表成功请求的数量。在紧随其后的蓝色数字代表短路（short-circuited）请求的数量。这些请求由于断路器开启而根本没有尝试执行。仍在第一列的底部，浅绿色数字代表错误请求（bad\
    \ requests）的数量。这些请求是错误，但通常不是由于执行失败引起的，而是由于非法参数等原因。移动到第二列第一行，橙色数字代表超时请求的数量。这些请求是尝试了执行，但在规定时间内没有收到响应。在超时请求下方，紫色数字代表被拒绝请求的数量。被拒绝的请求发生在没有更多资源来处理请求时（无论是通过线程池还是信号量）。请记住，请求被拒绝是为了防止请求在调用者处堆积并消耗那些宝贵的资源。第二列最后一个数字（红色的）是失败请求的数量。这些请求是因为抛出异常而未能执行的。\n"
- fmt: "\nIn this demo, we'll utilize the `Hystrix Dashboard` to view some of the\
    \ metrics of the `Hystrix`-protected call from the weather app to the weather\
    \ service. First things first, if your services and your discovery server aren't\
    \ already running, you'll need to start each of them up. And we'll start with\
    \ the discovery server first.\n\n### Starting the Services\nAnd we'll start with\
    \ the discovery server first. So expand the `discovery-server` project and navigate\
    \ to the main application class. Right-click on it, go to `Run As`, and choose\
    \ `Spring Boot App`. Repeat that same process for the `weather service` and then\
    \ the `weather app`. The `weather service`, the `weather app` and the `discovery\
    \ server` are all running. And just to double-check, you can click little caret\
    \ and see that each of those services is started.\n\n### Creating the Hystrix\
    \ Dashboard Project\nNext, go ahead and open up a web browser so we can create\
    \ and download the `Hystrix Dashboard` project. In your web browser, visit `start.spring.io`.\
    \ In the `Group` section, use `io.ajay.kumar`, and then for the `artifact name`\
    \ we'll say `hystrix-dashboard`. And then for the dependencies, we'll type `Hystrix\
    \ Dashboard`.\n\n![](images/00056.gif)\n\nOnce you have everything filled out,\
    \ go ahead and click the `Generate Project` button, and that'll create and download\
    \ that zip file for you. Like always, extract that zip file and head back to your\
    \ IDE. Back within your IDE, right-click on the empty space in the `Package Explorer`,\
    \ go to `Import`, choose `Existing Maven Projects`, click `Next`, click `Browse`,\
    \ locate the downloaded zip file, and click `Open`, and click `Finish`.\n\n![](images/00057.gif)\n\
    \n### Configuring Hystrix Dashboard\nExpand the `Hystrix Dashboard` project and\
    \ navigate to the main application class.\n\n```java\npackage io.ajay.kumar.hystrixdashboard;\n\
    \nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.netflix.hystrix.dashboard.EnableHystrixDashboard;\n\
    \n@SpringBootApplication\n@EnableHystrixDashboard\npublic class HystrixDashboardApplication\
    \ {\n    public static void main(String[] args) {\n        SpringApplication.run(HystrixDashboardApplication.class,\
    \ args);\n    }\n}\n```\n\nWithin the main application class, we will literally\
    \ add one annotation, that's `@EnableHystrixDashboard`. Next, we're ready to start\
    \ things up and view the dashboard. So on the main application class, right-click\
    \ on it, go to `Run As`, choose `Spring Boot App`. Next, open up a browser and\
    \ visit `localhost:8080/hystrix`.\n\n![](images/00058.jpeg)\n\nThis should load\
    \ up the `Hystrix Dashboard`. And before we view any metrics, we'll need to actually\
    \ generate some metrics. So open up a new tab and visit your weather app at `localhost:8000/weather`.\n\
    \n![](images/00059.jpeg)\n\nAnd just go ahead and refresh that a few times to\
    \ get some metrics. Back at the `Hystrix Dashboard`, we'll put in the URL to the\
    \ `hystrix stream` of our weather app. So that's `http://localhost:8000/hystrix.stream`.\
    \ And for the title of our dashboard, we'll say `Weather App`. Next, click the\
    \ `Monitor Stream` button, and you should be presented with some metrics.\n\n\
    ![](images/00060.gif)\n\nIf you don't see metrics away, you can flip back and\
    \ forth between your weather app and refreshing it to generate some metrics and\
    \ back to the dashboard to see the effect of those requests.\n\n## Aggregating\
    \ Hystrix Metrics with Netflix Turbine\nHystrix metrics are tracked on a service-by-service\
    \ basis. Now a single `hystrix stream` might have metrics on more than one `hystrix`\
    \ protected call, but those metrics are only for that service. The implications\
    \ of this are that every service has its own `hystrix stream` URL that you need\
    \ to use if you want to consume its metrics.\n\nIf you wanted to track the metrics\
    \ for multiple services, you'd have to open up multiple `Hystrix Dashboards` and\
    \ track them independently. I'm sure you can imagine how big of a pain that would\
    \ be if you had tens or hundreds of services that made up your application. To\
    \ solve this, Netflix developed a tool called `Turbine` that aggregates many `hystrix\
    \ streams` into one. To give you a better understanding of how this might look,\
    \ let's look at a screenshot from the `Hystrix Dashboard`.\n\n![](images/00061.gif)\n\
    \nIn the screenshot, you can see there are two protected calls, the `getCurrentWeather`\
    \ call and the `getCurrentDatetime` call. And the protected call on the left is\
    \ from a service located on `localhost:8080`, and the one on the right is from\
    \ another service located on `localhost:8181`. And `Turbine` has brought both\
    \ of these metrics together from different services, all viewable in the same\
    \ dashboard.\n\n## Using Spring Cloud and Netflix Turbine\nSo how we start using\
    \ `Turbine`? Well, if you've been following along throughout the book, you can\
    \ probably already guess.\n\n```xml\n<dependencyManagement>\n    <dependencies>\n\
    \        <dependency>\n            <groupId>org.springframework.cloud</groupId>\n\
    \            <artifactId>spring-cloud-dependencies</artifactId>\n            <version>Camden.SR2</version>\n\
    \            <type>pom</type>\n            <scope>import</scope>\n        </dependency>\n\
    \    </dependencies>\n</dependencyManagement>\n```\n\nYou start by defining a\
    \ new dependency on `spring-cloud-dependencies` in the `dependencyManagement`\
    \ section of your `pom.xml`. As always, make sure that it's of type `pom` and\
    \ has a scope of `import`. \n\n```xml\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
    \    <artifactId>spring-cloud-starter-turbine</artifactId>\n</dependency>\n```\n\
    \nThen, still within your `pom.xml`, in the `dependency` section, define a new\
    \ dependency on `spring-cloud-starter-turbine`. Follow that up by adding a new\
    \ annotation to your main `Application` class, the `@EnableTurbine` annotation.\n\
    \n```java\n@SpringBootApplication\n@EnableTurbine\npublic class Application {\n\
    \    public static void main(String[] args) {\n        SpringApplication.run(Application.class,\
    \ args);\n    }\n}\n```\n\nAnd last, we have a little bit of configuration to\
    \ add. In your `application.properties` or your `application.yml`, we're going\
    \ to add two new properties.\n\n**application.properties**\n```properties\nturbine.app-config=<list_of_service_ids>\n\
    turbine.cluster-name-expression='default'\n```\n**OR application.yml**\n```yaml\n\
    turbine:\n  appConfig: <list_of_service_ids>\n  clusterNameExpression: \"'default'\"\
    \n```\n\nIn addition to the standard spring application name and discovery server\
    \ location properties: \n\nThe first property is the `turbine.app-config` property,\
    \ and you set this to a comma-separated list of service IDs. And these are the\
    \ same `service IDs` that you use for service discovery. The second property,\
    \ the `turbine.cluster-name-expression` property, can be a Spring Expression Language\
    \ value to name your cluster. And in `Turbine`, a cluster is just a grouping of\
    \ services that need to be monitored together. And for our purposes, to make things\
    \ easy, we're going to set that value to `default` surrounded by single quotes.\n\
    \n![](images/00062.jpeg)\n"
