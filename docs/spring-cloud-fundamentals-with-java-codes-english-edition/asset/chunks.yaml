  trans: "\n\n# 智能路由的需求\n\n* 网关服务 (Gateway service)\n* Netflix Zuul\n* `@EnableZuulProxy`\n\
    * 配置路由\n* 编写过滤器\n\n首先，我们查看了最初需要智能路由的原因以及它为什么重要。然后，我们查看了如何通过 API 网关或网关服务来实现路由。最后，我们查看了如何使用\
    \ `Netflix Zuul` 作为网关服务，对往后端服务的请求和响应进行路由和过滤。\n\n# 第 6 模块：使用客户端负载均衡调用服务\n\n## 模块介绍\n\
    \n在本模块中，我们将学习如何利用客户端负载均衡来分担云原生应用中服务的负载。\n\n* 负载均衡\n* 服务端\n* 客户端\n* Netflix Ribbon\n\
    * 结合与不结合服务发现\n* `@LoadBalanced`\n* `@RibbonClient`\n* 自定义 Ribbon 配置\n\n我们将从什么是负载均衡，以及它在云原生应用中扮演着什么角色开始。然后，我们将讨论传统的服务端负载均衡，你可能已经熟悉它了。接着，我们将介绍客户端负载均衡、它是什么以及它与服务端负载均衡的区别。接下，我们将介绍\
    \ `Netflix Ribbon` 以及我们如何利用它结合 `Spring Cloud` 来实现客户端负载均衡。我们将学习如何使用两个新注解：`@LoadBalanced`\
    \ 注解和 `@RibbonClient` 注解，分别在有和没有服务发现的情况下实现它。最后，我们将通过一个章节来介绍如何自定义 `Ribbon` 的配置，例如不同的负载均衡算法或在发送请求之前检查服务健康状况的不同方法。\n\
    \n## 客户端负载均衡 vs 服务端负载均衡\n\n那么什么是负载均衡呢？简单来说，负载均衡是一种改进多个计算资源负载分布的方法。你可能已经知道这一点，所以更重要的问题是负载均衡在云原生架构中扮演着什么角色？这个答案实际上非常重要，可能比在非云原生架构中还要重要。当你观察架构的差异时，这个原因就变得更加清晰。在非云原生应用中，你从“具有单个负载均衡器的单个应用程序的多个实例”转变为“具有多个实例和多个负载均衡器的多个服务”。你仅仅从云原生应用中需要的负载均衡器数量，你就能开始看到负载均衡器的重要性了。通常有两种类型的负载均衡器：一种是服务端负载均衡，由服务器负责负载均衡；另一种是客户端负载均衡，由调用者负责负载均衡。让我们更详细地查看每一个。在服务端负载均衡中，对另一个服务的请求不会直接发送到服务本身，而是发送到服务前面的服务器，然后由该服务器决定将请求转发到多个实例中的哪一个。在客户端负载均衡中，没有中间环节。客户端（或服务的调用者）通过已知列表或服务发现感知服务的所有实例。然后由客户端负责决定将请求发送到多个实例中的哪一个。为了巩固我们对服务端与客户端负载均衡的理解，让我们对比一下它们。\n\
    \n### 服务端 (Server-side)\n* 服务器分配请求\n* 基于硬件或软件\n* 额外的跳转 (hop)\n* 支持多种算法\n* 发生在请求过程之外\n\
    * 集中式或分布式\n\n### 客户端 (Client-side)\n* 客户端分配请求\n* 基于软件\n* 无额外跳转\n* 支持多种算法\n* 发生在请求过程之内\n\
    * 通常是分布式的\n\n在服务端负载均衡中，服务器显然负责分配请求，而在客户端负载均衡中，客户端显然负责分配请求。服务端负载均衡通常基于基于硬件，但也可以基于软件。另一方面，客户端负载均衡是基于软件的。在服务端负载均衡中，你会产生一个额外的跳转，因为请求不会直接到达服务，而是必须先通过中间节点。而在客户端负载均衡中，一旦你知道了服务的位置，就不再需要任何额外的跳转。服务端和客户端负载均衡都支持多种负载均衡算法。服务端负载均衡中，实际的负载均衡发生在请求过程之外，而在客户端负载均衡中，实际的负载均衡发生在请求过程之内。最后，服务端负载均衡可以是集中式的也可以分布式的，而客户端负载均衡通常是分布式的。考虑到这些差异，显而易见客户端负载均衡是云原生架构的天然选择。\n\
    \n## 上手 Spring Cloud 和 Netflix Ribbon\n\n我们已经为客户端负载均衡做好了准备。现在让我们聊聊如何使用 `Spring\
    \ Cloud` 实际实现它。正如我在模块介绍中提到的，我们将使用一个名为 `Netflix Ribbon` 的库来实现客户端负载均衡。`Netflix Ribbon`\
    \ 是一个进程间通信库，内置了软件负载均衡器。`Spring Cloud` 为 `Spring` 的 `RestTemplate` 类添加了与 `Netflix\
    \ Ribbon` 的全功能集成。我们将详细介绍这具体意味着什么，但本质上，我们的 `RestTemplate` 现在将理解如何在多个服务实例之间平衡请求。`Spring\
    \ Cloud` 还添加了许多功能，使得非常轻松地声明不同类型的负载均衡算法和可用性检查。接下来，让我们讨论如何使用 `Spring Cloud` 和 `Netflix\
    \ Ribbon`。在我们开始之前，简单说明一下：在这些每个章节中，我将解释启动所需的所有步骤，最后我们将通过一个你可以跟随的演示。在 `Spring Cloud`\
    \ 中使用 `Netflix Ribbon` 非常简单，就像所有其他 `Spring Cloud` 项目一样。\n\n### 使用 SpringCloud\
    \ &Netflix Ribbon\n\npom.xml\n```xml\n<dependencyManagement>\n  <dependencies>\n\
    \    <dependency>\n      <groupId>org.springframework.cloud</groupId>\n      <artifactId>spring-cloud-dependencies</artifactId>\n\
    \      <version>Camden.SR2</version> \n      <type>pom</type>\n      <scope>import</scope>\n\
    \    </dependency>\n  </dependencies>\n</dependencyManagement>\n```\n\n"
- fmt: "\n## Using the `@LoadBalanced` Annotation\n\nIt's really easy to get started\
    \ and create a load balanced `RestTemplate`.\n\n### Creating a Load Balanced RestTemplate\n\
    \n```java\n@Configuration\n\npublic class MyConfiguration{\n\n    @Bean\n    @LoadBalanced\n\
    \    public RestTemplate restTemplate(){\n\n        return new RestTemplate();\n\
    \    }\n}\n```\n\nIn your `@Configuration` class, you define a new method annotated\
    \ with `@Bean` that returns a new `RestTemplate`. Then you annotate that same\
    \ method with the `@LoadBalanced` annotation. And what this does is it tells Spring\
    \ that the `RestTemplate` should support load balancing. And what that means behind\
    \ the scenes is that the `RestTemplate` that's returned will actually have an\
    \ interceptor, a `RestTemplate` interceptor, that utilizes the `Ribbon` load balancer\
    \ client to actually call our services and balance between the different instances.\
    \ And, by default, it'll use a round-robin algorithm for distributing that load.\
    \ Next, let's look at how you would actually use this load balanced `RestTemplate`\
    \ if you were trying to call a service and you were using service discovery.\n\
    \n### Using a Load Balanced RestTemplate With Service Discovery\n\nSuppose `my-service`\
    \ is the name of a service running on port `9000` at `mycompany.com` and is discoverable\
    \ via Service Discovery. There are 2 instances running.\n\nInstead of `restTemplate.getForEntity(\"\
    http://mycompany.com:9000/u/1\",...)` or `restTemplate.getForEntity(\"http://128.168.10.10:9000/u/1\"\
    ,...)`\n\nUse `RestTemplate` like this instead `restTemplate.getForEntity(\"http://my-service/u/1\"\
    ,...)`\n\nSuppose you had two instances of a service called `my-service` running\
    \ on port `9000` on multiple servers at `mycompany.com`. And also suppose that\
    \ `my-service` was discoverable via service discovery. Instead of passing the\
    \ `mycompany.com` URL or IP address to the `RestTemplate`, you can actually pass\
    \ a URL that uses a logical identifier to represent the service. In this case,\
    \ we've used the logical identifier `my-service`. And this is the same name that\
    \ the service is registered under at the Service Discovery Server. And at runtime\
    \ the `RestTemplate` will function as the client-side load balancer. And it'll\
    \ use service discovery to resolve the real location of the `my-service` instances\
    \ and then use the configured load balancing algorithm to distribute the load\
    \ between them.\n\n## Demo: Load Balancing Using Ribbon with Service Discovery\n\
    \nIn this demo, we'll set up a `Ribbon` client that utilizes service discovery\
    \ and balances requests between multiple instances of a service. Since we'll be\
    \ using service discovery to locate the instances of the service, we'll need to\
    \ have a Service Discovery Server set up. If you've been following along in the\
    \ previous modules of the course, you should already have the discovery server\
    \ set up within your IDE. Once you have the discovery server set up, we're ready\
    \ to get started. Open up a browser and head over to start.spring.io. In the Group\
    \ section, change this to `io.ajay.kumar`. And then for the name of the artifact,\
    \ we're going to call this `ribbon-time-service`. In the Dependencies section,\
    \ add the Web dependency and the Eureka Discovery dependency.\n\n![](images/00036.gif)\n\
    \nOnce you have everything filled out, click the Generate Project button, and\
    \ it'll create and download a zip for you. Still on the SPRING INITIALIZR page,\
    \ change the artifact name from `ribbon-time-service` to `ribbon-tie-app`. Then,\
