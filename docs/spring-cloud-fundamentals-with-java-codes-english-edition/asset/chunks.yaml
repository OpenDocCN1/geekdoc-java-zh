    *   Only gets configuration during initialization


    Suppose you have an @Configuration class, and it declares a new bean called FooService.
    And to construct FooService, you need to give it a configuration value from FooProperties,
    which is an argument to the bean method. And FooProperties is an @Configuration
    class. Then you make some configuration changes to the properties that are bound
    to FooProperties, and you issue a POST request to the refresh endpoint. If you
    were to look at FooService at this point, even though you called refresh, it would
    actually still have the old configuration value. And that''s because it only gets
    its configuration during initialization. Here''s another example.


    @Configuration


    public class SomeConfiguration{


    @Value("${some.config.value}")


    String configValue;


    @Bean


    public FooService fooService(){


    return new FooService(configValue);


    }


    }


    Example: @Value Will Not See New Config Value After a Refresh


    *   Configuration updates are made


    *   POST to /refresh


    *   Result: FooServicewill still contain the OLDconfiguration value


    *   Only gets configuration during initialization


    Again, we have an @Configuration class, and this time we have an @Value annotation
    that has some configuration that needs to be injected. And we''ll use that configuration
    as a constructor argument to construct the FooService bean. So we go through the
    same process; we update some configuration, we POST to the refresh endpoint, and
    again we realize that our configuration value is still the old value. It did not
    get updated. By now you have to be wondering how do I refresh an @Bean or an @Value
    that only gets its configuration during initialization? And the answer to that
    is with the @RefreshScope annotation. Let''s go back to our first example and
    see how and where we utilize the @RefreshScope annotation.


    @Configuration


    public class SomeConfiguration{


    @Bean @RefreshScope


    public FooService fooService(FooProperties properties){


    return new FooService(properties.getConfigValue());


    }


    }


    Example: Utilizing @RefreshScope


    *   Add the @RefreshScope annotation to the @Bean


    *   POST to /refresh


    *   Result: FooService will now contain the NEW configuration value!


    *   @RefreshScopetells Spring to please reinitialize this @Bean


     In your @Configuration class, all you need to do is add the @RefreshScope annotation
    to your @Bean. And once you POST to the refresh endpoint, FooService will now
    see the latest configuration value. RefreshScope works just like it sounds. It''s
    a hint to Spring that this @Bean or this @Value should be included in the scope
    of the refresh.


    ## Demo: Refresh Configuration Without Restarting Your App


    In this demo, we''ll learn how to refresh our configuration at runtime, as well
    as how to use the @RefreshScope annotation. Before we get started with the demo,
    make sure that you have a tool called Postman installed. You can get it by going
    to www.getpostman.com. And we''ll use this tool to call the REST endpoints. It''s
    a nice little REST client. The first thing we''ll do is start all of our applications,
    so go ahead and start the Discovery Server, the Config Server, and the Config
    Client app.. Now remember that you need to start them in the correct order. So
    the Discovery Server first, then the Config Server, then the Config Client app.
    So if you have any problems with starting them, make sure that you start them
    in that order. Open up a browser and visit localhost:8080\.


    ![](images/00025.jpeg)


    And you''ll see the configuration values that got resolved from the Configuration
    Server. Now, we want to update each of these values, so we''re going to update
    the first one, the app specific overridden value, and the global one. So, head
    back to the IDE. Back in the IDE, expand the config-repository project, and open
    up the config-client-app.properties file.


    config-client-app.properties :


    # Put application-specific config here (application name: client-config-app)


    some.property=coffee


    some.other.property=is good


     And we''re going to change this from the app specific overridden value to coffee.
    And then we''re also going to set the other one. We''re going to override the
    some.other.property, and we''re going to say is good. Go ahead and save those.
    Close that file. And then we''re going to commit those changes, so right-click
    on the scf-config-repository, go to Team, go to Commit, type in a commit message,
    Updating configuration, and click the Commit and Push. And it''ll pop up a new
    dialog showing you that it pushed those changes. Just go ahead and click OK. And
    you can exit out of that Git Staging view. So now we''ve updated the configuration,
    and we''ve pushed it to the configuration repository. And if you go back to your
    browser and you refresh the page, the value should still be the old values.


    ![](images/00025.jpeg)


     We haven''t explicitly asked the application to refresh its configuration. In
    order to do that, start up the Postman application, and on the New Tab where it
    says GET, click that drop-down and choose POST. Then in the request URL type http://localhost:8080/refresh.
    Once you''ve got that typed in, hit Send, and the server will respond back with
    all of the properties that changed. So there''s an internal property that it has
    called the config.client.verion, as well as the two other properties that we changed,
    the some.other.property and the some.property. Head back to your browser and refresh
    the page.


    ![](images/00026.jpeg)


    And ooh, that''s interesting. The first value refreshed for us, we got the coffee
    value that we set in, but the second value is still pointing to the global configuration
    value. And the reason for that is that the second value is retrieved using the
    @Value annotation, and @Value annotations are not automatically refreshed when
    you call the refresh endpoint. So we can fix that with the @RefreshScope annotation.
    Back within the IDE, stop the Config Client app. Then in the main application
    class, let''s find the someOtherProperty. So we have here the @Value annotation
    that gets the some.other.property value. So to fix our problem of the @Value annotation
    not updating, let''s add the @RefreshScope to the main application class.


    package io.ajay.kumar.configclientapp;


    import org.springframework.beans.factory.annotation.Autowired;


    import org.springframework.beans.factory.annotation.Value;


    import org.springframework.boot.SpringApplication;


    import org.springframework.boot.autoconfigure.SpringBootApplication;


    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;


    import org.springframework.cloud.context.config.annotation.RefreshScope;


    import org.springframework.web.bind.annotation.RequestMapping;


    import org.springframework.web.bind.annotation.RestController;


    @SpringBootApplication


    @EnableDiscoveryClient


    @RestController


    @RefreshScope


    public class ConfigClientAppApplication {


            @Autowired


            private ConfigClientAppConfiguration properties;


            @Value("${some.other.property}")


            private String someOtherProperty;


            public static void main(String[] args) {


                    SpringApplication.run(ConfigClientAppApplication.class, args);


            }


            @RequestMapping


            public String printConfig() {


                    StringBuilder sb = new StringBuilder();


                    sb.append(properties.getProperty());


                    sb.append(" || ");


                    sb.append(someOtherProperty);


                    return sb.toString();


            }


