    \ `some.other.property` 修改为 `is really good`。\n\nconfig-client-app.properties:\n\
    \n```properties\n# Put application-specific config here (application name: client-config-app)\n\
    \nsome.property=coffee\n\nsome.other.property=is really good\n```\n\n保存并关闭文件，并再次将其提交到\
    \ Git 仓库。团队，提交，再次更新配置，点击 Commit and Push（提交并推送）。你可以退出 Git Stage 视图。返回浏览器并刷新页面。\n\
    \n![](img/00027.jpeg)\n\n如你所见，它显示 coffee is good。`is good` 是它在启动时获取的值。但一旦我们在添加了刷新范围后再次刷新它，它将为该\
    \ `@Value` 注解获取最新的值。现在打开 Postman，在新的标签页中显示 `GET` 的地方，点击下拉菜单并选择 `POST`。然后在请求 URL\
    \ 中输入 `http://localhost:8080/refresh`。输入完成后，点击 Send（发送），你可以看到它更改了 `some.other.property`。回到浏览器并刷新页面。\n\
    \n![](img/00028.jpeg)\n\n你可以看到这次它将我们的属性从 `is good` 改为了 `is really good`。\n\n##\
    \ 加密和解密敏感配置\n\nSpring Cloud Config Server 还为加密和解密配置提供了额外的有用功能。它支持多种不同的特性。\n\n\
    ### 支持的功能：\n\n* 静态存储和/或传输中的加密配置\n* 用于加密配置的 `/encrypt` 端点\n* 用于解密配置的 `/decrypt`\
    \ 端点\n* 使用对称或非对称密钥进行加密和解密\n\n它支持静态存储或传输中的加密配置。静态存储简单意味着你的配置在存储在磁盘上是经过加密的。传输中则意味着它在\
    \ Config Server 和 Config Client 之间传输时是加密的。它提供了用于加密和解密你配置的实用端点。需要指出的一个非常重要的一点是，默认情况下，除非你为\
    \ Configuration Server 配置安全性，否则这两个端点都不是安全的。我们已经讨论过如何保护你的 Config Server。请记住，Spring\
    \ Security 支持的任何方法也适用于保护你的 Config Server。最后，它还支持使用对称或非对称密钥进行加密和解密。因此，你可以选择最适合你情况的方法。在我们进入加密和解密配置的细节之前，我认为查看加密配置的样式会很有用。\n\
    \napplication.properties:\n\n```properties\nmy.datasource.username=foobar\nmy.datasource.password={cipher}ASFIOWRODSKSDFIR32KJL\n\
    ```\n\napplication.yml:\n\n```yaml\nmy:\n  datasource:\n    username: foobar\n\
    \    password: '{cipher}ASFIOWRODSKSDFIR32KJL'\n```\n\n我包含了 `application.properties`\
    \ 和 `application.yml`。它们都具有相同的加密数据库密码。注意，在随机字母和数字之前有一个特殊的值 `cipher`，并且它被大括号包围。这表示真实值是一个加密值。请注意，`application.yml`\
    \ 与 properties 文件相比有一个细微的。YAML 文件要求我们用单引号括起值，而 properties 文件则不需要。现在你已经看到了加密配置的样貌，你可能在想配置是在什么时候被解密的？有两种不同的选项。第一种选项是在请求时解密，即在\
    \ Configuration Server 端。因此你为特定的应用程序请求配置，Config Server 在返回配置之前解密配置中的值。只有当你的 Config\
    \ Server 和 Config Client 之间的连接是安全的时，你才想要使用这种方法。如果不安全，你可以利用第二种在客户端解密值的方法。这与第一种方法完全相反。Config\
    \ Server 不是在返回之前解密值，而是以加密格式发送它们，由客户端负责解密。注意，默认方式是第一种选项，即请求时解密。如果你让客户端解密配置，你必须在\
    \ Config Server 上设置一个属性 `spring.cloud.config.server.encrypt.enabled=false`，这将告诉\
    \ Config Server 在向客户端返回值之前不要解密值。\n\n## 使用加密和解密支持\n\n在我们进入配置 Configuration Server\
    \ 以支持加密和解密的细节之前，请注意，这假设我们已经安装了 Java 加密扩展包，通常称为 `JCE`。\n\n### 第一步：选择你的密钥类型\n\n\
    * 对称密钥\n* 非对称密钥\n* 公钥\n* 私钥\n\n加密配置的第一步是选择密钥类型，这可以是对称的，也可以是非对称的。通常情况下，对称密钥更容易使用，但安全性低于非对称密钥。你可以选择最适合你情况的方法。\n\
    \n### 第二步（对称）：配置 Config Server\n\napplication.properties:\n\n```properties\nencrypt.key=<your_super_secret_key>\n\
    ```\n\napplication.yml:\n\n```yaml\nencrypt:\n  key: <your_super_secret_key>\n\
    ```\n\n第二步，如果你使用对称密钥，就是配置加密密钥。你可以在 `application.properties` 或 `application.yml`\
    \ 中执行。设置的属性是 `encrypt.key`。你将其设置为用于加密配置的私密值。\n\n### 第二步（非对称）：配置 Config Server\
    \ 选项 1\n\napplication.properties:\n\n```properties\nencrypt.key=<pem_encoded_key_as_text>\n\
    ```\n\napplication.yml:\n\n```yaml\nencrypt:\n  key: <pem_encoded_key_as_text>\n\
    ```\n\n第二步，如果你使用非对称密钥，可以通过两种不同的方式完成。第一种方法是在 `application.properties` 或 `application.yml`\
    \ 中将 `encrypt.key` 属性的值设置为 `pem_encoded_key_as_text`。PEM 编码的密钥将包含公钥和私钥。\n\n###\
    \ 第二步（非对称）：配置 Config Server 选项 2\n\napplication.properties:\n\n```properties\n\
    encrypt.keyStore.location=<path_to_keystore>\nencrypt.keyStore.password=<keystore_password>\n\
    encrypt.keyStore.alias=<key_name_in_keystore>\n```\n\napplication.yml:\n\n```yaml\n\
    encrypt:\n  keyStore:\n    location: <path_to_keystore>\n    password: <keystore_password>\n\
    \    alias: <key_name_in_keystore>\n```\n\n第二种方法，如果你使用非对称密钥，是使用 Java KeyStore。一旦你将公钥和私钥创建或导入现有或新的\
    \ keystore 中，你只需要配置 keystore 的位置、密码以及创建或导入密钥到 keystore 时选择的别名。你当然可以在 `application.properties`\
    \ 中进行操作，也可以在 `application.yml` 中进行。\n\n## 加密和解密 REST 端点\n\n一旦你的 Config Server\
    \ 设置好了加密功能，你就可以利用一些实用 REST 端点来加密和解密放入或从配置中提取的值。这两个端点非常简单。\n\n### 实用 REST 端点：加密值\n\
    \n* 端点\n* `POST /encrypt`\n* 示例\n* 请求: `/encrypt`\n* 数据: `<value_to_encrypt>`\n\
    \n"
- fmt: "\nThe first one is the encrypt endpoint, and you'd use this to generate the\
    \ encrypted values that you'll use in your configuration. And it's really simple\
    \ to use, like I said. All you do is send a `POST` request to the `/encrypt` endpoint,\
    \ and you pass the value that you want to encrypt as the body of the request.\
    \ The `Config Server` will use its configured key, either the symmetric or the\
    \ asymmetric key, to encrypt that value. And again, I can't stress this enough,\
    \ make sure that this endpoint is secure using `Spring Security` or any other\
    \ means to ensure that this endpoint is only accessed by authorized users.\n\n\
    ## Utility REST Endpoints: Decrypt Values\n\n- Endpoint\n- `POST /decrypt`\n-\
    \ Example\n- Request: `/decrypt`\n- Data: `<value_to_decrypt>`\n\nThe decrypt\
    \ endpoint is literally almost identical to the encrypt endpoint with the exception\
    \ of the name and the inputs. And you'd mainly use this for debugging purposes.\
    \ So to decrypt a value, you would `POST` to `/decrypt`, and you would send the\
    \ encrypted value as the body of the request, and it would return to you the unencrypted\
    \ value.\n\n## Summary\n\n- The explosion of configuration in the cloud and the\
    \ need for a config server\n- Using the `Spring Cloud Config Server & Client`\n\
    - Updating configuration at runtime without restarting\n- Encrypting and decrypting\
    \ configuration\n\nWe've reached the end of this module, so let's take a moment\
    \ to review what we've learned. We've covered a lot of topics. We first talked\
    \ about the need for a `Configuration Server` in a cloud environment to manage\
    \ the explosion of configuration that comes with managing a distributed system.\
    \ Then, we saw how to configure the `Spring Cloud Config Server` to serve our\
    \ configuration files and how to use the `Spring Cloud Config Client` along with\
    \ the `bootstrap.properties` or `bootstrap.yml` to retrieve the configuration\
    \ during application initialization. After that, we saw how we could brag to our\
    \ colleagues about updating our configuration at runtime without ever needing\
    \ to restart our application server. We also saw what gets automatically refreshed\
    \ and what requires an `@RefreshScope` annotation. And last, we finished out the\
    \ module with a section on how to utilize the encryption and decryption support\
    \ within `Spring Cloud Config`.\n\n# Module 5: Mapping Services Using Intelligent\
    \ Routing\n\n## What Is Intelligent Routing?\n\nIn this module we'll learn how\
    \ to map our services in the cloud using Intelligent Routing.\n\n- Routing in\
    \ cloud native apps\n- `Netflix Zuul`\n- Proxy server\n- Setting up routes\n-\
    \ Setting up filters\n\nWe'll begin by talking about what Intelligent Routing\
    \ is and what problem it solves for us. Then we'll introduce `Netflix Zuul` as\
    \ part of the `Spring Cloud Netflix` project. And we'll see how to set up a proxy\
    \ server, how to configure different routes, and how to set up filtering. Remember\
    \ that in order to be as dynamic and as scalable as possible, a cloud-native system\
    \ is made up of individually deployable services, which together, as a whole,\
    \ form an overall system. With that comes some challenges though.\n\n### Challenges\
    \ with Individual Services\n\n- Different ports\n- Different addresses\n- Different\
    \ APIs & paths\n\nEach of the individual services may be running on a different\
    \ port, a different address, or a combination of both. And they'll also likely\
    \ have different paths and different APIs to interact with. And as a user or a\
    \ client of those services, such as a mobile app or a web app, interacting with\
    \ each of the individual services, which could easily be in the double or triple\
    \ digits, would be a nightmare. Instead, we can use Intelligent Routing to make\
    \ our application appear as if it were a single system. Similar to how a completed\
    \ puzzle appears as if it were a whole, but it's made up of several different\
    \ individual pieces.\n\n## Intelligent Routing via a Gateway Service\n\nRouting\
    \ is typically implemented via something called a gateway service, or an `API\
    \ Gateway`. And an `API Gateway`, or a gateway service, is defined as the single\
    \ point of entry for all clients. So in many ways the gateway service is a lot\
    \ like the front door to our system. And each of the individual services is then\
    \ located behind this door, and all the requests must enter through it.\n\n###\
    \ A Gateway Service Provides\n\n- Dynamic Routing & Delivery\n- Security & Filtering\n\
    - Auditing & Logging\n- Request Enhancement\n- Load Balancing\n- Different APIs\
    \ for different clients\n\nA gateway service not only provides dynamic routing\
    \ and delivery, which means at runtime it can decide where it should route a request\
    \ and if it should even route a request at all, but it also provides an array\
    \ of other functionalities. One of those pieces of functionality is security.\
    \ It provides the ability to authenticate all of the incoming requests, as well\
    \ as filter out any sort of illegitimate or bad request. And it's actually a really\
    \ good candidate for providing auditing and logging of requests since all of the\
    \ requests must enter through the gateway. It also provides something called request\
    \ enhancement, which is just a fancy way of saying that it can add additional\
    \ information to the request, or enrich the request, if you will. A concrete example\
    \ of this is the way `Netflix` uses their gateway. They use their gateway service\
    \ to do a geolocation lookup for all incoming requests, and they add that additional\
    \ information as an additional request header so that it's available for all downstream\
    \ services. The gateway service can also act as a load balancer for the individual\
    \ services that are behind it. Another interesting feature of the gateway service\
    \ is the ability to provide different APIs for different clients. APIs are not\
    \ a one-size-fits-all kind of thing, and different clients, such as web clients\
    \ or mobile clients, have different needs in the way they call your APIs. So,\
    \ for instance, it may be okay for a web client to interact with several endpoints\
    \ to accomplish some piece of functionality, but the same may not be true for\
    \ a mobile client, which may be better served with just a single endpoint.\n\n\
    ## Using Netflix Zuul with Spring Cloud\n\nIntelligent Routing is implemented\
    \ using a combination of `Spring Cloud` and a project from `Netflix`. The project\
    \ is called `Netflix Zuul`, and it's pronounced zool, which rhymes with the word\
    \ tool. The project page for the `Netflix Zuul` project defines it as a gateway\
    \ service that provides dynamic routing, monitoring, resiliency, security, and\
    \ more. And the name `Zuul` is actually a pretty good name as `Zuul` refers to\
    \ a fictional, monster-like character in the movie `Ghostbusters` that's the gatekeeper\
    \ just like a gateway service is the gatekeeper. We'll talk about how you go about\
    \ adding `Spring Cloud` and `Netflix Zuul` to a project, and then we'll follow\
    \ up with a live demo. Just like all of the other `Spring Cloud` projects, adding\
    \ `Spring Cloud` and `Netflix Zuul` to your project is really, really easy.\n\n\
    ### Using Spring Cloud & Netflix Zuul\n\n`pom.xml`:\n\n```xml\n<dependencyManagement>\n\
    \    <dependencies>\n        <dependency>\n            <groupId>org.springframework.cloud</groupId>\n\
    \            <artifactId>spring-cloud-dependencies</artifactId>\n            <version>Camden.SR2</version>\n\
    \            <type>pom</type>\n            <scope>import</scope>\n        </dependency>\n\
