    \ 分隔，即全局配置，它来自全局属性，即 `application.properties`。\n\n## 在运行时更新配置\n\n在运行时更新配置无疑是 Spring\
    \ Cloud 最强大的功能之一。通过它，你可以执行诸如在运行时刷新 `@ConfigurationProperties` 等操作。你还可以用它来更新任何代码的日志级别。而且这些变化几乎瞬间完成的。最棒的部分是，你无需重启应用程序即可完成这一切。那么如何操作呢？嗯，第一步是更新你的配置。你通过克隆\
