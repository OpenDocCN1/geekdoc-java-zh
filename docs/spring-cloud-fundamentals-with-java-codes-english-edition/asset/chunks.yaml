  raw: 'The first one is the encrypt endpoint, and you''d use this to generate the
    encrypted values that you''ll use in your configuration. And it''s really simple
    to use, like I said. All you do is send a POST request to the /encrypt endpoint,
    and you pass the value that you want to encrypt as the body of the request. The
    Config Server will use its configured key, either the symmetric or the asymmetric
    key, to encrypt that value. And again, I can''t stress this enough, make sure
    that this endpoint is secure using Spring Security or any other means to ensure
    that this endpoint is only accessed by authorized users.


    Utility REST Endpoints: Decrypt Values


    *   Endpoint


    *   POST /decrypt


    *   Example


