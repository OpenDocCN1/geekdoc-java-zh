    decided that it only needed to notify two of the three applications to update
    their configuration. Regardless of which method you chose to notify your applications
    about configuration updates, there''s one last step. And that is to celebrate.
    You can brag to your colleagues about making configuration changes on the fly
    without ever restarting your application. And you can do it all at once or even
    all automatically. And last, since you used Git, you have a full audit log of
    all of the changes that you''ve made to your configuration.


    ## Utilizing the @RefreshScope Annotation


    We''ve already talked about how @ConfigurationProperties and logging levels will
    be updated when configuration is refreshed, but unfortunately that doesn''t cover
    all of the use cases. Anything that gets its value only at initialization time,
