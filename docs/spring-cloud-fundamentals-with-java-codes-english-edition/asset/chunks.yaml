  trans: "\n\n在本演示中，我们将利用 `Hystrix Dashboard` 查看从天气应用到天气服务的受 `Hystrix` 保护调用的某些指标。首先，如果你的服务和发现服务器尚未运行，你需要启动它们中的每一个。我们将先从发现服务器开始。\n\
    \n### 启动服务\n我们先从发现服务器开始。展开 `discovery-server` 项目并导航到主应用程序类。右键点击它，选择 `Run As`，然后选择\
    \ `Spring Boot App`。对 `weather service` 及其后的 `weather app` 重复相同的步骤。现在，`weather\
    \ service`、`weather app` 和 `discovery server` 均已运行。为了双重检查，你可以点击小箭头，看到这些服务中的每一个都已启动。\n\
    \n### 创建 Hystrix Dashboard 项目\n接下来，打开网络浏览器，以便我们创建并下载 `Hystrix Dashboard` 项目。在浏览器中，访问\
    \ `start.spring.io`。在 `Group` 部分，使用 `io.ajay.kumar`，然后在 `artifact name` 中输入 `hystrix-dashboard`。在依赖项中，我们输入\
    \ `Hystrix Dashboard`。\n\n![](img/00056.gif)\n\n填写好所有内容后，点击 `Generate Project`\
    \ 按钮，这将为你创建并下载该 zip 文件。如既常一样，解压 zip 文件并返回你的 IDE。回到 IDE 后，在 `Package Explorer`\
    \ 的空白处点击右键，选择 `Import`，选择 `Existing Maven Projects`，点击 `Next`，点击 `Browse`，找到下载的\
    \ zip 文件，点击 `Open`，然后点击 `Finish`。\n\n![](img/00057.gif)\n\n### 配置 Hystrix Dashboard\n\
    展开 `Hystrix Dashboard` 项目并导航到主应用程序类。\n\n```java\npackage io.ajay.kumar.hystrixdashboard;\n\
    \nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.netflix.hystrix.dashboard.EnableHystrixDashboard;\n\
    \n@SpringBootApplication\n@EnableHystrixDashboard\npublic class HystrixDashboardApplication\
    \ {\n    public static void main(String[] args) {\n        SpringApplication.run(HystrixDashboardApplication.class,\
    \ args);\n    }\n}\n```\n\n在主应用程序类中，我们只需直接添加一个注解，即 `@EnableHystrixDashboard`。接下来，我们准备好启动并查看仪表板了。在主应用程序类上，右键点击它，选择\
    \ `Run As`，选择 `Spring Boot App`。接下来，打开浏览器并访问 `localhost:8080/hystrix`。\n\n![](img/00058.jpeg)\n\
    \n这应该会加载 `Hystrix Dashboard`。在我们查看任何指标之前，我们需要实际生成一些指标。因此，打开新标签页并访问你的天气应用 `localhost:8000/weather`。\n\
    \n![](img/00059.jpeg)\n\n然后只需反复刷新几次以获取一些指标。回到 `Hystrix Dashboard`，我们将输入天气应用的 `hystrix\
    \ stream` URL。即 `http://localhost:8000/hystrix.stream`。对于仪表板的标题，我们将命名为 `Weather\
    \ App`。接下来，点击 `Monitor Stream` 按钮，你应该就能看到一些指标。\n\n![](img/00060.gif)\n\n如果你没有看到指标，可以在天气应用和仪表板之间来回，刷新应用以生成指标，然后返回仪表板查看这些请求的效果。\n\
    \n## 使用 Netflix Turbine 聚合 Hystrix 指标\nHystrix 指标是按服务为单位进行跟踪的。现在，单个 `hystrix stream`\
    \ 可能包含多个受 `hystrix` 保护调用的指标，但这些指标仅属于该服务。这意味着的影响是，每个服务都有自己的 `hystrix stream` URL，如果你想消费它的指标，就需要使用该\
    \ URL。\n\n如果你想跟踪多个服务的指标，就必须打开多个 `Hystrix Dashboards` 并独立地跟踪它们。我可以想象，如果你的应用程序由几十或上百个服务组成，那将多么痛苦。为了解决这个问题，Netflix\
    \ 开发了一个名为 `Turbine` 的工具，它可以将许多 `hystrix streams` 聚合为了一个。为了让你更好地理解这可能是什么样子，让我们来看\
    \ `Hystrix Dashboard` 的截图。\n\n![](img/00061.gif)\n\n在截图中，你可以看到有两个受保护调用：`getCurrentWeather`\
    \ 调用和 `getCurrentDatetime` 调用。左侧的保护调用来自位于 `localhost:8080` 的服务，右侧的来自位于 `localhost:8181`\
    \ 的另一个服务。`Turbine` 将来自不同服务的这两个指标整合在了一起，可以在同一个仪表板中查看。\n\n## 使用 Spring Cloud 和 Netflix\
    \ Turbine\n那么我们如何开始使用 `Turbine` 呢？如果你一直跟着这本书学习，你可能已经猜到了。\n\n```xml\n<dependencyManagement>\n\
    \    <dependencies>\n        <dependency>\n            <groupId>org.springframework.cloud</groupId>\n\
    \            <artifactId>spring-cloud-dependencies</artifactId>\n            <version>Camden.SR2</version>\n\
    \            <type>pom</type>\n            <scope>import</scope>\n        </dependency>\n\
    \    </dependencies>\n</dependencyManagement>\n```\n\n你首先在 `pom.xml` 的 `dependencyManagement`\
    \ 部分定义 `spring-cloud-dependencies` 依赖。如既常一样，确保它的类型为 `pom` 范围为 `import`。\n\n```xml\n\
    <dependency>\n    <groupId>org.springframework.cloud</groupId>\n    <artifactId>spring-cloud-starter-turbine</artifactId>\n\
    </dependency>\n```\n\n然后，在相同的 `pom.xml` 的 `dependency` 部分，定义一个新的 `spring-cloud-starter-turbine`\
    \ 依赖。之后，为你的主 `Application` 类添加一个新的注解 `@EnableTurbine`。\n\n```java\n@SpringBootApplication\n\
    @EnableTurbine\npublic class Application {\n    public static void main(String[]\
    \ args) {\n        SpringApplication.run(Application.class, args);\n    }\n}\n\
    ```\n\n最后，我们还有一些需要添加的配置。在你的 `application.properties` 或 `application.yml` 中，我们将添加两个新属性。\n\
    \n**application.properties**\n```properties\nturbine.app-config=<list_of_service_ids>\n\
    turbine.cluster-name-expression='default'\n```\n**或者 application.yml**\n```yaml\n\
    turbine:\n  appConfig: <list_of_service_ids>\n  clusterNameExpression: \"'default'\"\
    \n```\n\n除了标准的 Spring 应用名称和发现服务器位置属性外：\n\n第一个属性是 `turbine.app-config`，你将其设置为服务\
    \ ID 的逗号分隔列表。这些是你用于服务发现的相同 `service IDs`。第二个属性 `turbine.cluster-name-expression`\
    \ 属性可以使用 Spring 表达式语言值来为你的集群命名。在 `Turbine` 中，集群只是一个一起监控的服务组。对于我们的目的，为了方便起见，我们将该值设置为被单引号包裹的\
    \ `default`。\n\n![](img/00062.jpeg)\n\n"
- fmt: "\nIn this demo, we'll utilize `Turbine` to combine the `Hystrix` streams from\
    \ two different services so that they're both viewable from the same `Hystrix\
    \ Dashboard`. We'll continue to utilize the weather app, the weather service,\
    \ and the discovery server from our previous demo, and then we'll add two new\
    \ projects that you can clone from GitHub. The first new project is the `datetime-service`,\
    \ and you can get that from `github.com/ajaycucek/hystrix-datetime-service`. And\
    \ the second new project is the `datetime-app`. And you can get that, again, at\
    \ `github.com/ajaycucek/hystrix-datetime-app`. Once you've cloned both of those\
    \ projects, make sure that you import them into your IDE. I've imported mine,\
    \ and your IDE should look pretty similar to this. The two new projects, the `datetime-app`\
    \ and the `datetime-service`, are literally identical to the weather app and the\
    \ weather service, with the exception that they return the current datetime instead\
