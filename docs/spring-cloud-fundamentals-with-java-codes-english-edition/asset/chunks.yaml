  trans: "\n我们要添加的第一个属性是 `spring.application.name`，我们将将其设置为 `gateway-service`。然后我们需要的另一个属性是服务发现服务器（Service\
    \ Discovery Server）的位置。所以我们写 `eureka.client.service-url.defaultZone`，将其设置为 `localhost:8761/eureka`。接下来，你可以关闭这两个文件并最小化\
    \ `gateway-service` 项目。接下来，我们将打开 `hello-service` 项目，请展开它并打开主应用程序类。\n\n```java\n\
    package io.ajay.kumar.helloservice;\n\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.client.discovery.EnableDiscoveryClient;\n\
    import org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\
    \n@SpringBootApplication\n@EnableDiscoveryClient\n@RestController\npublic class\
    \ HelloServiceApplication {\n    public static void main(String[] args) {\n  \
    \      SpringApplication.run(HelloServiceApplication.class, args);\n    }\n\n\
    \    @RequestMapping\n    public String hello() {\n        return \"Hello!\";\n\
    \    }\n}\n```\n\n在主应用程序类中，我们将添加 `@EnableDiscoveryClient` 注解，并将其设为 `RestController`。现在，如果你在实际应用中这样做通常不是好主意，但我们现在只是作为一个简单的示例来这样做，所以目前没关系。我们来添加\
    \ `@RestController`。保存它。然后我们需要一个处理方法，即 `public String hello`。它将仅仅返回 `Hello!`，我们会在它上加上\
    \ `@RequestMapping` 注解。现在我们需要配置我们的 `hello-service` ，请打开 `src/main/resources` 并打开\
    \ `application.properties`。\n\n**application.properties**\n```properties\nspring.application.name=hello\n\
    server.port=1111\neureka.client.service-url.defaultZone=http://localhost:8761/eureka\n\
    ```\n\n在 `application.properties` 中，我们要设置的第一个属性是 `spring.application.name`，将其设置为\
    \ `hello`。我们还要设置服务器端口。由于有多个应用程序同时运行，我们不希望端口发生冲突。所以我们写 `server.port`，将其设置为 `1111`。保存它。最后一个属性是设置服务发现服务器的位置。我们可以直接从网关服务中复制。所以打开网关服务的\
    \ `application.properties`，复制设置服务发现服务器位置的配置值，关闭，然后将其粘贴到你的 `application.properties`\
    \ 中。你基本上将为 `goodbye-service` 重复相同的过程，但所有显示 `hello` 的地方都要改为 `goodbye`。而且端口处不再使用全\
    \ 1，而是使用全 2。我已完成了 `goodbye-service` 的配置，让我们来看一眼主应用程序类。\n\n```java\npackage io.ajay.kumar.goodbyeservice;\n\
    \nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;\nimport\
    \ org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\
    \n@SpringBootApplication\n@EnableDiscoveryClient\n@RestController\npublic class\
    \ GoodbyeServiceApplication {\n    public static void main(String[] args) {\n\
    \        SpringApplication.run(GoodbyeServiceApplication.class, args);\n    }\n\
    \n    @RequestMapping\n    public String goodbye() {\n        return \"Goodbye!\"\
    ;\n    }\n}\n```\n\n我们有 `@EnableDiscoveryClient` 注解和 `@RestController` 注解，然后我们有一个处理方法，即\
    \ `goodbye`，它被带有 `@RequestMapping` 注解。\n\n**application.properties**\n```properties\n\
    spring.application.name=goodbye\nserver.port=2222\neureka.client.service-url.defaultZone=http://localhost:8761/eureka\n\
    ```\n\n在 `application.properties` 中，我们将 `spring.application.name` 设置为 `goodbye`，`server.port`\
    \ 设置为全 2。服务发现服务器的配置完全相同。我们现在准备好启动了。\n\n## 使用 Netflix Zuul & Spring Cloud 创建过滤器\n\
    \nZuul 的关键功能是可以定义过滤器。过滤器允许你拦截并控制通过网关的请求和响应。Zuul 支持多种类型的过滤器。\n\n### 过滤器类型\n* `pre`:\
    \ 在请求之前\n* `post`: 在请求之后\n* `route`: 路由请求\n* `error`: 处理请求错误\n\n第一个是 `pre` 过滤器，它在请求路由之前执行。接下来是\
    \ `route` 类型，它允许你将请求引导到任何……事实上，当我们在主类上定义 `EnableZuProxy` 时，我们在 Spring 中配置了一些路由来……请求——……\
    \ `post`，这些是…………类型……`error` 用于处理之前任何任何一个过滤器类型导致的错误。要定义 Zuul 过滤器，你只需扩展并实现 `ZuulFilter`\
    \ 类即可。\n\n```java\npublic class MyFilter extends ZuulFilter{\n    // 实现方法\n}\n\
    ```\n\n这里有四个不同的方法需要实现：\n\n```java\n@Override public Object run(){\n    // 过滤器逻辑放在此处。当前实现忽略返回值\n\
    }\n\n@Override public boolean shouldFilter(){\n    // 控制是否执行 run 方法\n}\n\n@Override\
    \ public String filterType(){\n    // 过滤器的类型：pre, route, post, error\n}\n\n@Override\
    \ public int filterOrder(){\n    // 与同类型其他过滤器的执行顺序\n}\n```\n"
- fmt: "\nThe first is the `run` method, and this is where the main logic of the filter\
    \ goes. Note that it returns an object, but the current implementation ignores\
    \ it so you can just simply return `null` from this method. The next method is\
    \ the `shouldFilter` method, and, as the name suggests, this method allows you\
    \ to return `true` or `false` indicating whether or not the filter should be ran.\
    \ The third method is the `filterType` method, and here you can define one of\
    \ the four predefined values, either `pre`, `route`, `post`, or `error`. The last\
    \ method is the `filterOrder` method, and this allows you to control the execution\
    \ of your `Zuul` filters.\n\n```\nRequestContext ctx = RequestContext.getCurrentContext();\n\
    HttpServletRequest req = ctx.getRequest();\nHttpServletResponse res = ctx.getResponse();\n\
    ctx.set(\"foobar\",\"PRE_FILTER_EXECUTED\");\nString foobar = (String)ctx.get(\"\
    foobar\");\n```\n\n### Sharing Between Filters\n\n`RequestContext` holds request,\
    \ response, state, and data information. Only available for the duration of the\
    \ request\n\nThe `RequestContext` is an object that's responsible for holding\
    \ the request, the response, and any state or data information that needs to be\
    \ shared between all of the filters. So you'd use it to get access to the `HttpServletRequest`\
    \ or `Response`, as well as use it to set or get data for or from other filters.\
    \ The `RequestContext` is unique to every request and only lasts the duration\
    \ of the request. Once you've defined and implemented your `Zuul` filter, you\
    \ need to tell Spring about it.\n\n### Creating a Filter: Define an @Bean Which\
    \ Returns the Filter\n\n```java\n@Configuration\npublic class MyConfig{\n    @Bean\n\
    \    public ZuulFilter myFilter(){\n        return newMyFilter();\n    }\n}\n\
    ```\n\nIn your `@Configuration` class, create a method that returns the `Zuul`\
    \ filter and annotate it with `@Bean`. Spring Cloud Netflix will pick up and add\
    \ any beans of type `ZuulFilter` to `Zuul`.\n\n## Demo: Creating and Using a ZuulFilter\n\
    \nIn this demo, we'll learn how to implement a `Zuul` filter to add an additional\
    \ header to the incoming request so that it's available for downstream services\
    \ to consume. We'll start from where we left off in the previous demo. And remember\
    \ that we had four different services. We had the `discovery-server` that was\
    \ doing service discovery, we had the `gateway-service`, which was our edge service,\
    \ and then we had two application services, the `goodbye-service` and the `hello-service`.\
    \ Since we're building a filter, we'll start off in the `gateway-service`. So\
    \ go ahead and expand the `gateway-service` and create a new package. So go ahead\
    \ and New, Package, and we'll call this `io.ajay.kumar.filters`. And within that\
    \ new package create a new class, so New, Class, and we'll call this `AddRequestHeaderFilter`.\
    \ And remember that we have to extend the `ZuulFilter` class, so the superclass\
    \ for our class will be `ZuulFilter`.\n\n```java\npackage io.ajay.kumar.filters;\n\
    \nimport com.netflix.zuul.ZuulFilter;\nimport com.netflix.zuul.context.RequestContext;\n\
    \npublic class AddRequestHeaderFilter extends ZuulFilter {\n\n    @Override\n\
    \    public boolean shouldFilter() {\n        return true;\n    }\n\n    @Override\n\
    \    public Object run() {\n        RequestContext ctx = RequestContext.getCurrentContext();\n\
    \        ctx.addZuulRequestHeader(\"x-location\", \"USA\");\n        return null;\n\
    \    }\n\n    @Override\n    public String filterType() {\n        return \"pre\"\
    ;\n    }\n\n    @Override\n    public int filterOrder() {\n        return 0;\n\
    \    }\n}\n```\n\nFor the first method, the `shouldFilter` method, let's go ahead\
    \ and change that from `return false` to `return true`. We're always going to\
    \ apply this filter. And let's skip over the `run` method for right now and go\
    \ down to the `filterType`. And this particular filter we're going to create a\
    \ `pre` filter, so we can say `return pre`. And then for the `filterOrder`, `return\
    \ 0` is okay, so we'll just leave that the same. In order to get access to the\
    \ request to add headers to it, we need to get access to the `RequestContext`.\
    \ So let's clear this TODO and say `RequestContext ctx = RequestContext.getCurrentContext`.\
    \ And within the `RequestContext` there's the `addZuulRequestHeader` method. And\
    \ imagine our use case is to add the location of the incoming request, so we'll\
    \ name this header `x-location`. And we're going to mock this; we'll say that\
    \ every request comes from `USA`. And then last, remember that the return value\
    \ is not actually used in the current implementation, so returning `null` is going\
    \ to be okay for our purposes. Let's close this file and open up our main application\
    \ class. And within our main application class, we'll annotate this with `@Configuration`.\n\
    \n```java\npackage io.ajay.kumar;\n\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.client.discovery.EnableDiscoveryClient;\n\
    import org.springframework.cloud.netflix.zuul.EnableZuulProxy;\nimport org.springframework.context.annotation.Bean;\n\
    import org.springframework.context.annotation.Configuration;\nimport io.schultz.dustin.filters.AddRequestHeaderFilter;\n\
    \n@SpringBootApplication\n@EnableZuulProxy\n@EnableDiscoveryClient\n@Configuration\n\
    public class GatewayServiceApplication {\n\n    public static void main(String[]\
    \ args) {\n        SpringApplication.run(GatewayServiceApplication.class, args);\n\
    \    }\n\n    @Bean\n    public AddRequestHeaderFilter addRequestHeaderFilter()\
    \ {\n        return new AddRequestHeaderFilter();\n    }\n}\n```\n"
