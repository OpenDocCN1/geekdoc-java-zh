  trans: "\n众所周知 Netflix 是 AWS 的深度用户。鉴于 Eureka 出自 Netflix，因此它包含对 AWS 的支持也是理所当然的。让我们来看看各种支持功能以及一个典型的部署架构。当使用\
    \ Eureka Client 的应用程序启动时，它会检查自己是否运行在 AWS 实例上。如果是，它会调用本地元数据服务并检索有关该实例的一些元数据。它会获取\
    \ AWS 特有的信息，例如正在运行的 Amazon Machine Image（AMI），或者它运行的区域（region）或可用区（zone）。然后在注册时将这些信息发送到发现服务器（Discovery\
    \ Server）。鉴于 AWS 中的事物变化非常频繁，让发现服务器位于一个众知的位置至关重要。因此，Eureka 增加了对弹性 IP（Elastic IP）绑定的支持。当\
    \ Eureka Server 启动并注意到它运行在 AWS 上时，它将尝试绑定到下一个可用的弹性 IP，以便拥有静态或已知的 IP。Eureka Client\
    \ 同样具有区域感知能力，并倾向于它当前运行的区域。因此，它会尝试联系当前区域的发现服务器，如果无法访问，它会尝试下一个区域并寻找下一个可用的发现服务器。最后，你可以配置\
    \ Eureka Client 获取不同远程区域的注册表。为了利用 AWS 支持，需要一些额外的配置。\n\n```java\n@Configuration\n\
    \npublic class AppConfig{\n\n    @Bean\n\n    public EurekaInstanceConfigBean\
    \ eurekaInstanceConfig(\n    InetUtilsProperties properties){\n\n    EurekaInstanceConfigBean\
    \ bean=new\n    EurekaInstanceConfigBean(newInetUtils(\n    properties));\n\n\
    \    AmazonInfo info= AmazonInfo.Builder.newBuilder().autoBuild(\n    \"eureka\"\
    );\n\n    bean.setDataCenterInfo(info);\n\n    return bean;\n    }\n}\n```\n\n\
    在你的 `@Configuration` 类中，你定义了一个返回 `EurekaInstanceConfigBean` 的新方法，并用 `@Bean` 进行注解。在方法内部，你创建一个新的\
    \ `EurekaInstanceConfigBean`。然后，使用 `AmazonInfo.Builder` 创建一个 `AmazonInfo` 对象，并将\
    \ `EurekaInstanceConfigBean` 的 `DataCenterInfo` 设置为该 `AmazonInfo`，然后返回该 bean。如果你查看\
    \ `AmazonInfo` 类的源码，你会发现它利用本地元数据服务来填充所有的实例信息。除了 `@Configuration` 类中的配置外，`application.properties`\
    \ 中还有一些额外的配置，即关于可用区的配置。\n\n### application.properties 中的可用区配置\n\n- `eureka.client.availability-zones.[region]=[az1],[az2],[az3]`\n\
    \n该属性是 `eureka.client.availability-zones` 属性，模式为 `eureka.client.availability-zones.region`，然后等于一个逗号分隔的可用区列表。\n\
    \n### EC2 控制板\n\n![](img/00012.jpeg)\n\n例如，如果你在 `us-east-1b` 区域有一个发现服务器，在 `us-east-1e`\
    \ 区域有另一个发现服务器，你可以按照如下设置属性：`eureka.client.availability-zones`，然后区域为 `us-east-1`，最后设置\
    \ `us-east-1b` 和 `us-east-1e` 的逗号分隔列表。在 `application.properties` 中，为你的服务 URL 也需要类似的配置。\n\
    \n### application.properties 中的服务 URL 配置\n\n- `eureka.client.service-url.[zone]=http://[eip-dns]/eureka`\n\
    \n该属性是 `eureka.client.service-url.zone` 属性，你将其设置为绑定到弹性 IP 的 Eureka 实例的 HTTP 地址。并且要确保（至少从\
    \ 1.4 版本开始）使用弹性 IP 的 DNS 名称，因为代码专门感知了弹性 IP 用于 DNS 命名的模式，并且它正在寻找该特定模式以识别是否正在使用弹性\
    \ IP。\n\n### 弹性 IP 控制板\n\n![](img/00013.jpeg)\n\n例如，如果我们被分配了以下弹性 IP，我们可以按照如下方式配置\
    \ `application.properties`：第一个位于 `us-east-1b` 区域，第二个位于 `us-east-1e` 区域。你会发现，每一个项都设置为了\
    \ HTTP 地址的弹性 IP DNS 名称。紧接着之前 AWS 控制台的截图以及我们如何配置一切的，如果你在设置好所有内容后加载 Eureka 控制板，它看起来像这样。\n\
    \n![](img/00014.jpeg)\n\n你会在 `DS Replicas` 下有两个实例，然后你有两个发现服务器实例，每个分别位于各自的可用区。\n\
    \n![](img/00015.jpeg)\n\n同样，你可以调出每个发现服务器实例的控制板，并发现其中填充了 AWS 特有的元数据，例如 `instance-type`、`ami-id`\
    \ 或 `instance-id`。\n\n![](img/00016.gif)\n\n现在我们已经了解了 Eureka 中存在的 AWS 支持，让我们来看看部署架构。通常情况下，每个可用区你都会有一个或多个发现服务器，然后你有多个可用区。在这些每个区域内，为每个发现服务器准备一个弹性\
    \ IP。然后，你通常会设置一个自动扩展组，将这些发现服务器均匀地分布在各个可用区。\n\n## 总结\n\n我们已经到了本模块的结束，让我们回顾一下学到的内容。我们首先查看了服务发现以及它为什么很重要。然后我们学习了如何使用\
    \ Spring Cloud Eureka Client 发现服务，以及使用 Spring Cloud Eureka Server 存储服务注册表以便其他服务进行发现。接着，我们快速看了\
    \ Spring Cloud Eureka 控制板，并深入了解了 Spring Cloud Eureka Server。之后，我们讨论了健康检查、高可用性和\
    \ Spring Cloud Eureka 的配置。最后，我们查看了 AWS 特有的支持。\n"
- fmt: '

    In this module we''ll talk about managing your application configuration in a
    distributed system like the cloud. We''ll jump right in with configuration in
    a distributed system and why its different and more challenging than a non-distributed
    system, and more importantly, why we need this thing called a `Configuration Server`.
    From there, we''ll dive into the details behind the way `Spring Cloud` implements
    a `Configuration Server` with the `Spring Cloud Config Server`. And we''ll see
    how you can set up a `Config Client` and a `Config Server` and get them talking
    to each other. We''ll also quickly go over the various back-end storing options
    for `Spring Cloud Config Server`, such as a `Git` repository or an `SVN` repository.
    Next, and one of the things that I think is the coolest, we''ll learn how to update
    our configuration on the fly without ever restarting our application server. And
    we''ll do that with a variety of methods including the `Spring Cloud Actuator`,
    `Spring Cloud Bus`, and the `Spring Cloud Monitor` projects. Then we''ll also
    learn about the `@RefreshScope` annotation and why it''s needed and where to use
    it. We''ll finish out the module on a section about retrieving and storing your
    sensitive configuration values using symmetric and asymmetric encryption.


    ### What exactly is so different about managing the configuration in a cloud-native
    application versus a non-cloud-native application?


    The answer to that stems from the fact that a cloud-native application is a distributed
    system and non-cloud-native applications are not distributed. And in a non-distributed
    application, you typically only have a handful of configuration files. It''s often
    a one-to-one relationship between a system and its configuration. And as you move
    to a distributed system, that configuration explodes. You go from having one or
    more to many, many configuration files because you have many, many systems that
    make up one system as a whole. For instance, if you''re using microservices, each
    one of your individual microservices that composed your overall application would
    have its own configuration file.


    You might be thinking no problem. We''ve got this. That''s why they make configuration
    tools like `Puppet` and `Chef` for managing configuration in many, many systems,
    right? Well, it''ll work, but it''s not ideal for the cloud. Let''s talk about
    some of the issues that you would face with using a typical configuration management
    system.


    The first is that it''s typically deployment oriented. And that means that any
    time you want to make a configuration change, you have to kick off a new deployment
    so that the configuration is modified. And typically the application is then usually
    restarted. What if, for instance, you needed to make a temporary logging configuration
    change to debug an issue? Kicking off a whole new deployment and restarting applications
    is a pretty heavy process just for a temporary change.


    Another issue that you would encounter is the way in which configuration changes
    make it to the application servers. And that''s via a push. Pushing application
    configuration to servers in a cloud environment is usually not dynamic enough.
    And by that, I mean it needs to know where to push the configuration to. And in
    the cloud that''s usually not a straightforward answer as application instances
    can come and go at any given point in time. When you push configuration, you run
    the risk of missing a newly started instance that, for instance, came online as
    a result of auto scaling during a high-traffic period.


    Okay, so no problem. If push doesn''t work, we can just use pull, right? Well,
    that has problems too. When you pull configuration, you typically use a pulling
    mechanism where you check for changes every x number of minutes, and if there
    are changes, then you pull those changes down. And that introduces latency from
    the time that we change our configuration to the time that it actually takes effect.


    Well, if configuration management tooling doesn''t solve our problem, then what
    exactly does? The answer to that is something called a `Configuration Server`.
    Or, to be more specific, an `Application Configuration Server`. An `Application
    Configuration Server` is a dedicated, dynamic, and centralized key/value store
    for storing your configuration. And it could be distributed or non-distributed.
    And similar to configuration management, it''s the authoritative source for all
    configuration. It provides things like auditing and versioning, and it also has
    cryptography support so that you can encrypt or decrypt those sensitive configuration
    values.


    ## Introducing Spring Cloud Config Server


    Managing your application configuration with help from `Spring Cloud` is really
    quite easy. By default, `Spring Cloud` provides you with several different ways
    to implement a `Configuration Server` with almost no work on your part. The first
    two options, `Spring Cloud Consul` and `Spring Cloud Zookeeper`, are integrations
    with third party applications, `Consul` and `Zookeeper`, respectively. You may
    or may not be familiar with `Consul` and `Zookeeper`, and in case you''re not,
    it''s important to note that neither of them is just a `Configuration Server`.
    Both are commonly utilized for other purposes like service discovery.


    The third option, `Spring Cloud Config Server`, is an implementation that was
    built by the `Spring Cloud` team. And it has one sole purpose, and that''s to
    be a `Configuration Server`. We''ll focus specifically on this option, but it
    should be pretty easy to utilize the others once you have a firm understanding
    of the concepts. In addition to including the implementation of the `Spring Cloud
    Config Server`, the `Spring Cloud` project also includes client-side support for
    connecting and interacting with the server. The `Config Client`, which is usually
    imbedded in your application, fits perfectly into `Spring`''s `Environment` abstraction.
    And that means that all the ways that you''re already familiar with getting access
    to configuration can be used to get access to configuration that was retrieved
    from the `Configuration Server`. The `Config Server` is usually a standalone application,
    and it also fits perfectly into one of the `Spring` framework abstractions, and
    that''s the `PropertySource` abstraction. So, if you''re not familiar with the
    `PropertySource` abstraction, you''ve probably actually already used it. For instance,
    if you''ve ever referred to a properties file in your application using the `classpath`
    prefix, then you''ve already used the `PropertySource` abstraction. And all of
    the configuration that comes from the `Configuration Server` is just another property
    source. It''s a property source that''s remote.


    ## Using the Spring Cloud Config Server

