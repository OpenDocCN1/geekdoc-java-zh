    import org.springframework.boot.autoconfigure.SpringBootApplication;


    import org.springframework.cloud.config.server.EnableConfigServer;


    @SpringBootApplication


    @EnableConfigServer


    public class ConfigServerApplication {


            public static void main(String[] args) {


            SpringApplication.run(ConfigServerApplication.class, args);


            }


    }


     Within the main application class, add the @EnableConfigServer annotation. Save
    that and close that file. Next, expand the src/main/resources folder and open
    up the application.properties.


    application.properties :


    server.port=8888


    spring.cloud.config.server.git.uri=


    Within the application.properties, add a server.port property and set that equal
    to 8888\. Next, we need to configure the Config Server to know where the configuration
    repository is located. So we''ll say spring.cloud.config.server.git.uri, we''re
    going to use a Git repository, and then we''re going to set that to a config repository.
    Normally you would set this to the location of your own configuration repository,
    but for this demo we''re going to use a prebuilt one that''s on GitHub. So go
    ahead and open up a browser. In the address bar, type https://github.com/ajaycucek/config-repository.
    We''re going to be forking this repository, which means we''re going to be creating
    a local copy in our own GitHub account. And that requires that you have your own
    GitHub account. So if you don''t already, make sure that you sign up for one.
    And if you do, make sure you sign in. Once you''re all signed in, click the Fork
    button in the top right corner, and that''ll create a fork for you. Once you''ve
    got your fork created, it''ll look very similar to the unforked version, but underneath
    the repository name at the top it''ll say forked from ajayscf-config-repository.
    Next we want to grab the clone URL, so head over to this green button, click it,
    and copy the clone URL to your clipboard, and head back over to your IDE. Back
    in Eclipse, or STS, we want access to the Git repository''s view. And you can
    do that by going to Window, Show View, Other, and choose Git Repositories. Within
    the Git Repositories view, click on the link that says Clone a Git repository.
    It''ll pop up a new window. Choose Clone URI. Hit Next. Since we copied it to
    our clipboard, it should automatically show up in the URI section with the host
    and the repository path filled in as well. If it''s not, just pasted in that clone
    URL that we copied into the URI. Go ahead and click Next, choose the master branch,
    and click Finish.


    application.properties :


    server.port=8888


    spring.cloud.config.server.git.uri=https://github.com/ajaycucek/config-repository.git


    Since we still have the clone URL on our clipboard, let''s set up the Config Server''s
    Git URL by clicking in the application.properties and pasting in that value. Make
    sure you save that, and then you can close that file. Head back over to the Git
    Repositories view and expand the repository. Right-click on the Working Tree and
    choose Import Projects. A new dialog box will pop up, and just click Finish.


