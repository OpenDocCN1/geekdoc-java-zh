    project. In your web browser, visit start.spring.io. In the Group section, use
    io.ajay.kumar, and then for the artifact name we''ll say hystrix-dashboard. And
    then for the dependencies, we''ll type Hystrix Dashboard.


    ![](images/00056.gif)


    Once you have everything filled out, go ahead and click the Generate Project button,
    and that''ll create and download that zip file for you. Like always, extract that
    zip file and head back to your IDE. Back within your IDE, right-click on the empty
    space in the Package Explorer, go to Import, choose Existing Maven Projects, click
    Next, click Browse, locate the downloaded zip file, and click Open, and click
    Finish.


    ![](images/00057.gif)


    Expand the Hystrix Dashboard project and navigate to the main application class.


    package io.ajay.kumar.hystrixdashboard;


    import org.springframework.boot.SpringApplication;


    import org.springframework.boot.autoconfigure.SpringBootApplication;


    import org.springframework.cloud.netflix.hystrix.dashboard.EnableHystrixDashboard;


    @SpringBootApplication


    @EnableHystrixDashboard


    public class HystrixDashboardApplication {


            public static void main(String[] args) {


    SpringApplication.run(HystrixDashboardApplication.class, args);


            }


    }


    Within the main application class, we will quite literally add one annotation,
    and that''s the @EnableHystrixDashboard annotation. Next, we''re ready to start
    things up and view the dashboard. So on the main application class, right-click
    on it, go to Run As, choose Spring Boot App. Next, open up a browser and visit
    localhost:8080/hystrix.


    ![](images/00058.jpeg)


    This should load up the Hystrix Dashboard. And before we view any metrics, we''ll
    need to actually generate some metrics. So open up a new tab and visit your weather
    app at localhost:8000/current/weather.


    ![](images/00059.jpeg)


    And just go ahead and refresh that a few times to get some metrics generated.
    Back at the Hystrix Dashboard, we''ll put in the URL to the Hystrix stream of
    our weather app. So that''s http://localhost:8000/hystrix.stream. And for the
    title of our dashboard, we''ll say Weather App. Next, click the Monitor Stream
    button, and you should be presented with some metrics.


    ![](images/00060.gif)


    If you don''t see metrics right away, you can flip back and forth between your
    weather app and refreshing it to generate some metrics and back to the dashboard
    to see the effect of those requests.


    ## Aggregating Hystrix Metrics with Netflix Turbine


    Hystrix metrics are tracked on a service-by-service basis. Now a single Hystrix
    stream might have metrics on more than one Hystrix protected call, but those metrics
    are only for that service. And the implications of this are that every service
    has its own Hystrix stream URL that you need to use if you want to consume its
    metrics. If you wanted to track the metrics for multiple services, you''d have
    to open up multiple Hystrix Dashboards and track them independently. And I''m
    sure you can imagine how big of a pain that would be if you had tens or even hundreds
    of services that made up your application. To solve this, Netflix developed a
    tool called Turbine that aggregates many Hystrix streams into one. To give you
    a better understanding of how this might look, let''s look at a screenshot from
    the Hystrix Dashboard.


    ![](images/00061.gif)


     In the screenshot, you can see there are two protected calls, the getCurrentWeather
    call and the getCurrentDatetime call. And the protected call on the left is from
    a service located on localhost:8080, and the one on the right is from another
    service located on localhost:8181\. And Turbine has brought both of these metrics
    together from different services, all viewable in the same dashboard.


    ## Using Spring Cloud and Netflix Turbine


    So how do we start using Turbine? Well, if you''ve been following along throughout
    the book, you can probably already guess.


    pom.xml


    <dependencyManagement>


        <dependencies>


            <dependency>


    <groupId>org.springframework.cloud</groupId>


    <artifactId>spring-cloud-dependencies</artifactId>


    <version>Camden.SR2</version>


    <type>pom</type><scope>import</scope>


            </dependency>


        </dependencies>


    </dependencyManagement>


    You start by defining a new dependency on spring-cloud-dependencies in the dependencyManagement
    section of your pom.xml. As always, make sure that it''s of type pom and has a
    scope of import.


    pom.xml


    <dependency>


    <groupId>org.springframework.cloud</groupId>


    <artifactId>spring-cloud-starter-turbine</artifactId>


    </dependency


    Then, still within your pom.xml, in the dependency section, define a new dependency
    on spring-cloud-starter-turbine. Follow that up by adding a new annotation to
    your main Application class, the @EnableTurbine annotation.


    @SpringBootApplication


    @EnableTurbine


    public class Application{


    public static void main(String[]args){


    SpringApplication.run(Application.class,args);


    }


    }


    And last, we have a little bit of configuration to add. In your application.properties
    or your application.yml, we''re going to add two new properties.


    application.properties


    turbine.app-config=<list_of_service_ids>


    turbine.cluster-name-expression=’default’


    OR


    application.ymlturbine:appConfig:<list_of_service_ids>


    clusterNameExpression:”’default’”


    * In addition to the standard spring application name and discovery server location
    properties


    The first property is the turbine.app-config property, and you set this to a comma-separated
    list of service IDs. And these are the same service IDs that you use for service
    discovery. The second property, the turbine.cluster-name-expression property,
    can be a Spring Expression Language value to name your cluster. And in Turbine,
    a cluster is just a grouping of services that need to be monitored together. And
    for our purposes, to make things easy, we''re going to set that value to default
    surrounded by single quotes. And a note here is if you''re using YAML instead
    of properties, you''ll need to escape the single quotes with double quotes.


    ![](images/00062.jpeg)


    Once you have everything configured and your Hystrix Dashboard is started up,
    instead of entering the hystrix.stream URL, you''d enter the URL of your Turbine
    server and end it with turbine.stream. Let''s apply the stuff we learned by created
    our own Turbine server, and we can use it to aggregate the stream of our service
    we created in the previous demo along with a new service.


    ## Demo: Aggregating Multiple Hystrix Streams with Turbine'
