    \ Package Explorer 的空白区域点击右键，选择 `Import`，搜索 `Existing Maven Projects`，选择它，点击 `Next`，浏览到你下载的\
    \ zip 文件位置（我的文件在 `Downloads/config-client-app`），点击 `Open` 并点击 `Finish`。\n\n我们将使用服务发现从\
    \ Config Client 应用中定位 Config Server。所以，如果你还没有完成服务发现模块，你需要 Discovery Server 并将其导入到\
    \ IDE 中。这非常简单。接下来，我们需要对 Config Server 进行一些修改，使其向 Discovery Server 注册自己。\n\n```java\n\
    package io.ajay.kumar.configserver;\n\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.client.discovery.EnableDiscoveryClient;\n\
    import org.springframework.cloud.config.server.EnableConfigServer;\n\n@SpringBootApplication\n\
    @EnableConfigServer\n@EnableDiscoveryClient\npublic class ConfigServerApplication\
    \ {\n    public static void main(String[] args) {\n        SpringApplication.run(ConfigServerApplication.class,\
    \ args);\n    }\n}\n```\n\n展开 `config-server` 并进入主应用程序类。在 `@EnableConfigServer`\
    \ 下方添加 `@EnableDiscoveryClient` 注解。保存它，然后打开 `src/main/resources` 中的 `application.properties`。\n\
    \n### application.properties\n\n```properties\nserver.port=8888\nspring.cloud.config.server.git.uri=https://github.com/ajaycucek/config-repository.git\n\
    spring.application.name=configserver\neureka.client.server-url.defaultZone=https://localhost:8761/eureka\n\
    ```\n\n我们将添加两个不同的属性。第一个是 `spring.application.name`，我们将将其设置为 `configserver`。没有空格。然后我们还想设置\
    \ Discovery Server 的位置，以便它知道在哪里注册自己。因此我们执行 `eureka.client.server-url.defaultZone`，然后将其设置为\
    \ `localhost:8761/eureka`。接下来，展开 `config-client-app` 项目并打开主应用程序类。记住，Config Client\
    \ 获取其配置不需要我们添加任何特殊的注解。只要库在类路径上且设置正确，它就应该能够从 Configuration Server 获取配置。\n\n```java\n\
    package io.ajay.kumar.configclientapp;\n\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.client.discovery.EnableDiscoveryClient;\n\
    \n@SpringBootApplication\n@EnableDiscoveryClient\npublic class ConfigClientAppApplication\
    \ {\n    public static void main(String[] args) {\n        SpringApplication.run(ConfigClientAppApplication.class,\
    \ args);\n    }\n}\n```\n\n然而，我们确实想参与服务发现，所以让我们添加 `@EnableDiscoveryClient` 注解。继续保存它。接下来我们创建一个新类。点击\
    \ New、Class，我们将此类命名为 `ConfigClientAppConfiguration`。点击 `Finish`。\n\n```java\n\
    package io.ajay.kumar.configclientapp;\n\nimport org.springframework.boot.context.properties.ConfigurationProperties;\n\
    import org.springframework.stereotype.Component;\n\n@Component\n@ConfigurationProperties(prefix=\"\
    some\")\npublic class ConfigClientAppConfiguration {\n    private String property;\n\
    \n    public String getProperty() {\n        return property;\n    }\n\n    public\
    \ void setProperty(String property) {\n        this.property = property;\n   \
    \ }\n}\n```\n\n让我们为这个类添加 `@Component` 和 `@ConfigurationProperties`。我们将给它一个前缀为\
    \ `some`。这个 `ConfigurationProperties` 将代表我们名为 `property` 的属性。我们将有一个字符串实例变量，`private\
    \ String property;`。确保不要忘记 getter 和 setter。你可以通过进入 Source、Generate Getters and\
    \ Setters、选择 property 来实现。保存文件。返回主应用程序类，并注入我们的配置类。\n\n```java\npackage io.ajay.kumar.configclientapp;\n\
    \nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.beans.factory.annotation.Value;\n\
    import org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;\nimport\
    \ org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\
    \n@SpringBootApplication\n@EnableDiscoveryClient\n@RestController\npublic class\
    \ ConfigClientAppApplication {\n    @Autowired\n    private ConfigClientAppConfiguration\
    \ properties;\n\n    @Value(\"${some.other.property}\")\n    private String someOtherProperty;\n\
    \n    public static void main(String[] args) {\n        SpringApplication.run(ConfigClientAppApplication.class,\
    \ args);\n    }\n\n    @RequestMapping\n    public String printConfig() {\n  \
    \      StringBuilder sb = new StringBuilder();\n        sb.append(properties.getProperty());\n\
    \        sb.append(\" || \");\n        sb.append(someOtherProperty);\n       \
    \ return sb.toString();\n    }\n}\n```\n\n"
