    *   通过 `spring-cloud-config-monitor` & `spring-cloud-bus` 使用 `VCS + /monitor`\n\
    \n第一种方法是手动的，通过调用 Spring Actuator 项目包含的刷新端点。说明一下，你需要对每个需要更新配置的单独服务执行此操作。第二种方法是手动和自动的结合。你可以想象，如果你有很多服务器，手动为每个服务器调用刷新端将是一个非常痛苦的过程。相反，如果每个应用程序都订阅了一个事件，而你调用了\
    \ `/bus/refresh` 端点，Spring Cloud Bus 将向所有订阅者发送消息，通知它们需要刷新。请注意，配置是否更改并不包含任何智能判断；每个订阅者都会去获取它的新配置。第三种方法与第二种类似，但它增加了一层智能性。实现方法是你将其挂接到版本控制系统（如\
    \ Git）上，每当你进行提交时，提交的变更集就会发布到监控端点，然后该监控端点就可以确定哪些服务需要更新配置。所以让我们来可视化一下：假设你对某些配置进行了提交，并将其推送到配置仓库。该仓库知道发生了什么，并将该变更集发送到监控端点，然后该端点判断出只需要通知三个应用程序中的两个更新配置。无论你选择哪种方法来通知应用程序更新配置，最后一步都是：庆祝。你可以向同事炫耀在无需重启应用程序的情况下即时更改配置。最后，由于你使用了\
    \ Git，你拥有一份所有所做更改的完整审计日志。\n\n## 使用 @RefreshScope 注解\n\n我们已经讨论了当配置刷新时 `@ConfigurationProperties`\
    \ 和日志级别将如何更新，但遗憾的是，这并没有涵盖所有的用例。任何在初始化时才获取值的内容（例如 `@Bean` 或 `@Value`）都不会像其他内容那样自动刷新。为了为了更好地理解这一点，看一个例子会有帮助。\n\
    \n```java\n@Configuration\npublic class SomeConfiguration{\n    @Bean\n    public\
    \ FooService fooService(FooProperties properties){\n        return new FooService(properties.getConfigValue());\n\
    \    }\n}\n```\n\n**示例：刷新后 @Bean 将看不到新配置值**\n\n*   进行了配置更新\n*   注意 `FooProperties`\
    \ 是一个 `@ConfigurationProperties` 类\n*   `POST` 到 `/refresh`\n\n"
- fmt: "\n- Result: `FooService` will still contain the OLD configuration value\n\
    - Only gets configuration during initialization\n\nSuppose you have an `@Configuration`\
    \ class, and it declares a new bean called `FooService`. To construct `FooService`,\
    \ you need to give it a configuration value from `FooProperties`, which is an\
    \ argument to the bean method. `FooProperties` is an `@Configuration` class. Then\
    \ you make some configuration changes to the properties that are bound to `FooProperties`,\
    \ and you issue a `POST` request to the refresh endpoint. If you were to look\
    \ at `FooService` at this point, even though you called `refresh`, it would actually\
    \ still have the old configuration value. And that's because it only gets its\
    \ configuration during initialization. Here's another example.\n\n```java\n@Configuration\n\
    public class SomeConfiguration{\n\n@Value(\"${some.config.value}\")\nString configValue;\n\
    \n@Bean\npublic FooService fooService(){\nreturn new FooService(configValue);\n\
    }\n\n}\n```\n\n### Example: `@Value` Will Not See New Config Value After a Refresh\n\
    \n- Configuration updates are made\n- `POST` to `/refresh`\n- Result: `FooService`\
    \ will still contain the OLD configuration value\n- Only gets configuration during\
    \ initialization\n\nAgain, we have an `@Configuration` class, and this time we\
    \ have an `@Value` annotation that has some configuration that needs to be injected.\
    \ And we'll use that configuration as a constructor argument to construct the\
    \ `FooService` bean. So we go through the same process; we update some configuration,\
    \ we `POST` to the refresh endpoint, and again we realize that our configuration\
    \ value is still the old value. It did not get updated. By now you have to be\
    \ wondering how do I refresh an `@Bean` or an `@Value` that only gets its configuration\
    \ during initialization? And the answer to that is with the `@RefreshScope` annotation.\
    \ Let's go back to our first example and see how and where we utilize the `@RefreshScope`\
    \ annotation.\n\n```java\n@Configuration\npublic class SomeConfiguration{\n\n\
    @Bean @RefreshScope\npublic FooService fooService(FooProperties properties){\n\
    return new FooService(properties.getConfigValue());\n}\n\n}\n```\n\n### Example:\
    \ Utilizing `@RefreshScope`\n\n- Add the `@RefreshScope` annotation to the `@Bean`\n\
    - `POST` to `/refresh`\n- Result: `FooService` will now contain the NEW configuration\
    \ value!\n- `@RefreshScope` tells Spring to please reinitialize this `@Bean`\n\
    \nIn your `@Configuration` class, all you need to do is add the `@RefreshScope`\
    \ annotation to your `@Bean`. And once you `POST` to the refresh endpoint, `FooService`\
    \ will now see the latest configuration value. `RefreshScope` works just like\
    \ it sounds. It's a hint to Spring that this `@Bean` or this `@Value` should be\
    \ included in the scope of the refresh.\n\n## Demo: Refresh Configuration Without\
    \ Restarting Your App\n\nIn this demo, we'll learn how to refresh our configuration\
    \ at runtime, as well as how to use the `@RefreshScope` annotation. Before we\
    \ get started with the demo, make sure you have a tool called `Postman` installed.\
    \ You can get it by going to `www.getpostman.com`. And we'll use this tool to\
    \ call the REST endpoints. It's a nice little REST client. The first thing we'll\
    \ do is start all of our applications, so go ahead and start the `Discovery Server`,\
    \ the `Config Server`, and the `Config Client` app. Now remember that you need\
    \ to start them in the correct order. So the `Discovery Server` first, then the\
    \ `Config Server`, then the `Config Client` app. So if you have any problems with\
    \ starting them, make sure that you start them in that order. Open up a browser\
    \ and visit `localhost:8080`.\n\n![](images/00025.jpeg)\n\nAnd you'll see the\
    \ configuration values that got resolved from the `Configuration Server`. Now,\
    \ we want to update each of these values, so we're going to update the first one,\
    \ the app specific overridden value, and the global one. So, head back to the\
    \ IDE. Back in the IDE, expand the `config-repository` project, and open up the\
    \ `config-client-app.properties` file.\n\nconfig-client-app.properties:\n\n```properties\n\
    # Put application-specific config here (application name: client-config-app)\n\
    some.property=coffee\nsome.other.property=is good\n```\n\nAnd we're going to change\
    \ this from the app specific overridden value to `coffee`. And then we're also\
    \ going to set the other one. We're going to override the `some.other.property`,\
    \ and we're going to say `is good`. Go ahead and save those. Close that file.\
    \ And then we're going to commit those changes, so right-click on the `scf-config-repository`,\
    \ go to `Team`, go to `Commit`, type in a commit message, `Updating configuration`,\
    \ and click the `Commit` and `Push`. And it'll pop up a new dialog showing you\
    \ that it pushed those changes. Just go ahead and click `OK`. And you can exit\
    \ out of that `Git Staging` view. So we've updated the configuration, and we've\
    \ pushed it to the configuration repository. And if you go back to your browser\
    \ and you refresh the page, the value should still be the old values.\n\n![](images/00025.jpeg)\n\
    \nWe haven't explicitly asked the application to refresh its configuration. In\
    \ order to do that, start up the `Postman` application, and on the New Tab where\
    \ it says `GET`, click that drop-down and choose `POST`. Then in the request URL\
    \ type `http://localhost:8080/refresh`. Once you've got that typed in, hit `Send`,\
    \ and the server will respond back with all of the properties that changed. So\
    \ there's an internal property that it has called `config.client.verion`, as well\
    \ as the two other properties that we changed, the `some.other.property` and `some.property`.\
    \ Head back to your browser and refresh the page.\n\n![](images/0026.jpeg)\n\n\
    And ooh, that's interesting. The first value refreshed for us, we got `coffee`\
    \ that we set, but the second value is still pointing to the global value. The\
    \ reason for that is that the second value is retrieved using `@Value`, and `@Value`\
    \ annotations are not automatically refreshed when you call the endpoint. So we\
    \ can fix that with `@RefreshScope`. Back the IDE, stop the Config app. Then in\
    \ the main class, let's find `someOtherProperty`. So we have here the `@Value`\
    \ annotation. To fix our problem of `@Value` not updating, let's add `@RefreshScope`\
    \ to the main class.\n\n```java\npackage io.ajay.kumar.configclientapp;\n\nimport\
    \ org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.beans.factory.annotation.Value;\n\
    import org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;\nimport\
    \ org.springframework.cloud.config.annotation.RefreshScope;\nimport org.springframework.web.bind.annotation.RequestMapping;\n\
    import org.springframework.web.bind.annotation.RestController;\n\n@SpringBootApplication\n\
    @EnableDiscoveryClient\n@RestController\n@RefreshScope\npublic class ConfigClientApplication\
    \ {\n\n    @Autowired\n    private ConfigClientConfiguration properties;\n\n \
    \   @Value(\"${some.other.property}\")\n    private String someOtherProperty;\n\
    \n    public static void main(String[] args) {\n        SpringApplication.run(ConfigClientApplication.class,\
    \ args);\n    }\n\n    @RequestMapping\n    public String printConfig() {\n  \
    \      StringBuilder sb = new StringBuilder();\n        sb.append(properties.getProperty());\n\
    \        sb.append(\" || \");\n        sb.append(someOtherProperty);\n       \
    \ return sb.toString();\n    }\n}\n```\n"
