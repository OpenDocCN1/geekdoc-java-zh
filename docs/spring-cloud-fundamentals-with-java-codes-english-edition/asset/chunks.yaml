    在本模块中，我们将讨论如何在像云这样的分布式系统中管理您的应用程序配置。我们将直接进入分布式系统中的配置，以及为什么它与非分布式系统不同且更具挑战性，更重要的是，为什么我们需要这种名为
    `Configuration Server`（配置服务器）的东西。从那里开始，我们将深入研究 `Spring Cloud` 如何通过 `Spring Cloud
    Config Server` 实现 `Configuration Server` 的细节。并将学习如何设置 `Config Client`（配置客户端）和
    `Config Server`（配置服务器），并让它们相互通信。我们还会快速概览 `Spring Cloud Config Server` 的各种后端存储选项，例如
    `Git` 仓库或 `SVN` 仓库。接下来，我认为最酷的一点是，我们将学习如何在不重启应用程序服务器的情况下动态更新配置。我们将通过多种方法来实现这一点，包括
    `Spring Cloud Actuator`、`Spring Cloud Bus` 和 `Spring Cloud Monitor` 项目。然后，我们还会学习
    `@RefreshScope` 注解，以及为什么需要它以及在何使用它。最后，我们将通过一个关于使用对称和非对称加密检索并存储敏感配置值的章节来结束本模块。


    ### 与云原生应用与非云原生应用相比，管理配置究竟有什么不同之处？


    这个答案源于云原生应用是一个分布式系统，而非云原生应用不是分布式的。在非分布式应用中，你通常只有少数几个配置文件。系统与其配置之间通常是一对一的关系。而当你迁移到分布式系统时，配置就会发生爆炸式增长。你从拥有一个或多个配置文件变为拥有许多许多个配置文件，因为你有许多许多系统共同构成了一个整体系统。例如，如果你使用微服务，那么构成你整个应用程序的每个独立微服务都将自己的配置文件。


    你可能会想：没问题，我们能搞定。这就是为什么他们制作了像 `Puppet` 和 `Chef` 这样的配置工具来管理许多许多系统的配置，对吧？嗯，它行得通，但对于云环境来说并不理想。让我们来讨论一下使用典型的配置管理系统可能会面临的一些问题。


    第一个问题是，它通常是面向面向部署的。这意味着每当你想要更改配置时，都必须启动新的部署以修改配置。而且通常应用程序随后会重启。如果例如，你为了调试某个问题而需要进行临时的日志配置更改呢？仅仅为了一个临时的更改就启动整个新部署并重启应用程序是一个非常沉重的过程。


    你可能会遇到的另一个问题是配置更改到达应用程序服务器的方式。它是通过“推送”（push）实现的。在云环境中向服务器推送应用程序配置通常不够动态。我的意思是，它需要知道将配置推送到哪里。而在云中，这通常不是一个简单的答案，因为应用程序实例可能在任何时候出现或离开。当你推送配置时，你面临错过新启动实例的风险，例如该实例是因为高流量期间的自动扩缩而上线的。


    好吧，没问题。如果推送不起作用，我们可以只用“拉取”（pull），对吧？嗯，那也有问题。当你拉取配置时，通常使用一种拉取机制，每隔 x 分钟检查一次更改，如果有更改，就把这些更改取下来。这引入了从我们更改配置到配置实际生效之间的延迟。


    那么，如果配置管理工具不能解决我们的问题，到底什么可以呢？答案是被称为 `Configuration Server` 的东西。或者更具体地说，`Application
    Configuration Server`（应用程序配置服务器）。`Application Configuration Server` 是一个专用的、动态的中心化的键值存储器，用于存储您的配置。它可以是分布式的也可以是非分布式的。与配置管理类似，它是所有配置的权威来源。它提供了审计和版本控制等功能，还具有加密支持，以便你可以加密或解密那些敏感的配置值。


    ## 介绍 Spring Cloud Config Server


    借助 `Spring Cloud` 管理您的应用程序配置其实非常简单。默认情况下，`Spring Cloud` 为你提供了几种实现 `Configuration
    Server` 的方法，几乎不需要你做任何工作。前两个选项 `Spring Cloud Consul` 和 `Spring Cloud Zookeeper`
    分别是与第三方应用程序 `Consul` 和 `Zookeeper` 的集成。你可能熟悉也不熟悉 `Consul` 和 `Zookeeper`，如果你不熟悉，重要的是，它们都不仅仅是
    `Configuration Server`。它们通常都被用于服务发现等其他用途。


    第三个选项 `Spring Cloud Config Server` 是由 `Spring Cloud` 团队构建的实现。它只有一个目的，那就是成为一个 `Configuration
    Server`。我们将专门关注这个选项，但一旦你牢固理解这些概念，使用其他选项应该非常容易。除了包含 `Spring Cloud Config Server`
    的实现外，`Spring Cloud` 项目还包含了连接和与服务器交互的客户端支持。通常嵌入你的应用程序中的 `Config Client` 完美契合了 `Spring`
    的 `Environment` 抽象。这意味着你已经熟悉的获取配置的所有方法，都可以用于获取从 `Configuration Server` 获取的配置。`Config
    Server` 通常是一个独立的应用程序，它也完美契合了 `Spring` 框架的抽象之一，即 `PropertySource` 抽象。所以，如果你熟悉 `PropertySource`
    抽象，你可能实际上已经在使用它了。例如，如果你曾经在应用程序中使用 `classpath` 前缀引用过属性文件，那么你就已经使用过 `PropertySource`
    抽象。而所有来自 `Configuration Server` 的配置只是另一个属性源。它是一个远程的属性源。


    ## 使用 Spring Cloud Config Server


    '
- fmt: "\nAs we've already discussed, the Spring Cloud Config Server is an implementation\
    \ of a Configuration Server. Let's take a deeper look at the functionality that\
    \ it provides and how to get one set up. At its core, the Config Server is just\
    \ another web application, and it provides a REST-based interface for accessing\
    \ your configuration files. So you set up your configuration files, you name them\
    \ appropriately, and then you tell the Configuration Server where they're located,\
    \ and it'll serve them up for you. It's important to point out that the Config\
    \ Server does not facilitate writing any configuration files, and it's only mainly\
    \ concerned with serving those configuration files. It has support for various\
    \ output formats, and the default is JSON, but it also supports properties and\
    \ YAML. The Config Server doesn't need a database to store the configuration,\
    \ and instead it has support for retrieving and reading your configuration files\
    \ from several different back-end storage configurations like Git, which is the\
    \ default, or SVN, or just the plain old filesystem. Another nice feature that\
    \ the Configuration Server supports is it has some notion of configuration scopes.\
    \ And what I mean by that is that you can define global configuration that applies\
    \ to all applications, as well as application-specific configuration or Spring\
    \ Profile specific configuration. Using the Spring Cloud Config Server, like Spring\
    \ Cloud's other servers, is very, very easy.\n\n### pom.xml\n\n```xml\n<dependencyManagement>\n\
    \    <dependencies>\n        <dependency>\n            <groupId>org.springframework.cloud</groupId>\n\
    \            <artifactId>spring-cloud-dependencies</artifactId>\n            <version>Camden.SR2</version>\n\
    \            <type>pom</type>\n            <scope>import</scope>\n        </dependency>\n\
    \    </dependencies>\n</dependencyManagement>\n```\n\nFirst, in your `pom.xml`,\
    \ make sure that you have the `spring-cloud-dependencies` defined within your\
    \ `dependencyManagement` section.\n\n```xml\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
    \    <artifactId>spring-cloud-config-server</artifactId>\n</dependency>\n```\n\
    \nThen, still in your `pom.xml`, in the dependency section, define a new dependency\
    \ on `spring-cloud-config-server`. Next, create a folder to store all of your\
    \ configuration that you want the Configuration Server to serve up. And in that\
    \ folder you can optionally create an `application.properties` file or an `application.yml`\
    \ file. And this file is for a global configuration that should apply to all applications\
    \ and not any one specific application. An example of that would be something\
    \ like your database configuration that is shared across all of your applications.\
    \ You would put it in this `application.properties` or `application.yml` file.\
    \ Next you add application and profile-specific configuration files in this folder,\
    \ and you can put them in either properties or YAML format. And you use a special\
    \ naming pattern for the file name, and that's the `application-profile.extension`\
    \ where `application` is the name of your application and `profile` is the Spring\
    \ Profile that should apply for that configuration. If you're not using a Spring\
    \ Profile, you can omit the `-profile` section of the file name and just use the\
    \ `application.file extension`. Next you would run `git init` within your folder\
    \ that contains all of your configuration files. And this example assumes that\
    \ you're using the default back-end storage, which is Git. And from there you\
    \ would `git add` your configuration files, `git commit` them, and then the last\
    \ step, which is optional, but highly recommended, is to set up a remote Git repository\
    \ and `git push` the configuration up to the remote repository. Now we need to\
    \ configure the actual Configuration Server itself. Now don't confuse this with\
    \ the configuration files that the Configuration Server will be serving. This\
    \ is the application configuration for the actual Configuration Server.\n\n###\
    \ application.properties\n\n```properties\nserver.port=8888\nspring.cloud.config.server.git.uri=<uri_to_git_repo>\n\
    ```\n\nOR\n\n### application.yml\n\n```yaml\nserver:\n  port: 8888\nspring:\n\
    \  cloud:\n    config:\n      server:\n        git:\n          uri: <uri_to_git_repo>\n\
    ```\n\nIn the Config Server's `application.properties` file, you specify the `server.port`\
    \ property and give that the value `8888`. This isn't required, but that port\
    \ is the conventional port that's used for the Config Server. Then you need to\
    \ configure the location of the Git repository that contains all of the configuration\
    \ files that the server will serve. And you do that by specifying the property\
    \ `spring.cloud.config.server.git.uri`, and then you set that to the location\
    \ of the Git repository. If you'd uploaded that to a remote repository, this would\
    \ be the clone URL of your repository. If you prefer to use YAML files for your\
    \ configuration, I've included the equivalent `application.yml`.\n\n```java\n\
    @SpringBootApplication\n@EnableConfigServer\npublic class Application{\n    public\
    \ static void main(String[] args){\n        SpringApplication.run(Application.class,args);\n\
    \    }\n}\n```\n\nThe next step is to add the `@EnableConfigServer` annotation\
    \ to your main `Application` class. And while you're in here, if you wanted your\
    \ Configuration Server to be discoverable via service discovery, you could add\
    \ the Eureka Client dependencies, configure the service discovery URL, and add\
    \ the `@EnableDiscoveryClient` annotation, and then clients would be able to discover\
    \ the Configuration Server. The last step is to ensure that your Configuration\
    \ Server is set up in a secure fashion. And it's very easy to do that using the\
    \ Spring Security library. And any of the methods that are supported in Spring\
    \ Security are also supported in securing your Configuration Server.\n\n## Config\
    \ Server REST Support: Parameters\n\nTypically when you're interacting with the\
    \ Config Server's REST endpoints, you're doing so using the Config Client; however,\
    \ it's useful to understand the available endpoints, at least for debugging purposes\
    \ and also if you want to use it in another language. Each of the available endpoints\
    \ on the Config Server share a common set of parameters. And the values of those\
    \ parameters influence the configuration that's returned.\n\n*   `{application}`\
    \ maps to `spring.application.name` on client\n*   `{profile}` maps to `spring.profiles.active`\
    \ on client\n*   `{label}` server side feature to refer to set of config files\
    \ by name\n\nThe first parameter is the `application` parameter. And if you're\
    \ utilizing the Spring Cloud Client, it uses the value from the `spring.application.name`\
    \ property to fill in the value for that application parameter. The next parameter\
    \ is the `profile` parameter. And again, if you're using the Spring Cloud Client,\
    \ it's going to pull the value from the `spring.profiles.active` property to fill\
    \ in the value for that profile parameter. So this translates into the active\
    \ Spring Profile. The last parameter, the `label` parameter, is a feature for\
    \ grouping your configuration files into kind of arbitrary named sets. And that\
    \ could mean different things depending on the back-end you're using. So for instance,\
    \ if you're using Git as a back-end, the label translates to the Git branch. Now\
    \ take a second to look at each of these endpoint parameters, and consider them\
    \ as a whole, and think about how you might combine one or two or all of them\
    \ together to identify a particular configuration.\n\n## Config Server REST Support:\
    \ Endpoints\n\nBy now we should have a good understanding of the purpose of each\
    \ of the path-based parameters that are involved in the REST endpoints. Let's\
    \ take a look at the actual REST services themselves.\n\n*   Endpoint: `GET/{application}/{profile}[/{label}]`\n\
    *   Example: `/myapp/dev/master`, `/myapp/prod/v2`, `/myapp/default`\n"
