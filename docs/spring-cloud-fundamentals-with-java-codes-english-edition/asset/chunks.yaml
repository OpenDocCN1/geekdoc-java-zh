    works best for your situation. Before we get into the details on encrypting and
    decrypting configuration, I thought it would be useful to see how encrypted configuration
    looks.


    application.properties :


    my.datasource.username=foobar


    my.datasource.password={cipher}ASFIOWRODSKSDFIR32KJL


    application.yml :


    my:datasource:username: foobar


    password: ‘{cipher}ASFIOWRODSKSDFIR32KJL’


    I''ve included both an application.properties and an application.yml. And they
    both have the same encrypted database password. Notice that before the random
    letters and numbers there''s a special value of cipher, and it''s surrounded by
    curly braces. This is what denotes that the real value is an encrypted value.
    And notice that there''s one minor difference in the application.yml versus the
    properties. The YAML file requires us to surround the value in single quotes,
    whereas the properties file does not. Now that you''ve seen what encrypted configuration
    looks like, you''re probably wondering at what point is the configuration decrypted?
    And there are two different options. The first option is upon request, and that''s
    at the Configuration Server. So you make a request for configuration for a specific
    application, and the Config Server decrypts the values in the configuration before
    sending it back. You''d only want to use this if the connection between your Config
    Server and your Config Client is secure. If it''s not, you can utilize the second
    option that decrypts the value''s client side. And this is exactly opposite of
    the first option. Instead of decrypting the values before sending them back, the
    Config Server sends them in encrypted format, and the client is responsible for
    decrypting them. Note that the default way is the first option, upon request.
    And if you want the client to decrypt the configuration, you have to set a property
    on the Config Server, spring.cloud.config.server.encrypt.enabled, that''s a big
    one, =false. And that will tell the Config Server not to decrypt the values before
    sending them back to the client.


    ## Using the Encryption and Decryption Support


    Before we get into the details about configuring our Configuration Server for
    encryption and decryption support, note that it assumes we have the Java Cryptography
    Extension installed, or commonly referred to as JCE.


    Step One: Choose Your Key Type


    *   Symmetric Key


    *   Asymmetric Key


    *   Public Key


    *   Private Key


    The first step to encrypting your configuration is to choose the key type, and
    that could be either symmetric or asymmetric. And typically symmetric keys are
    easier to use, but less secure than asymmetric keys. And you can choose whatever
    works best for your situation.


    Step Two (Symmetric): Configure the Config Server


    application.properties :


    encrypt.key=<your_super_secret_key>


    application.yml :


    encrypt:key: <your_super_secret_key>


    Step two, if you''re using a symmetric key, is to configure the encryption key.
    And you can do that in the application.properties or the application.yml. And
    the property that is set is encrypt.key. And you would set that to the secret
    value you''ll use to encrypt your configuration.


    Step Two (Asymmetric): Configure the Config Server Option 1


    application.properties :


    encrypt.key=<pem_encoded_key_as_text>


    application.yml :


    encrypt:key: <pem_encoded_key_as_text>


    Step two, if you''re using asymmetric keys, can be done in two different ways.
    The first way is to set the value of the encrypt.key property in the application.properties
    or the application.yml as a pem_encoded_key_as_text. And the PEM encoded key would
    contain both the public and the private key.


    Step Two (Asymmetric): Configure the Config Server Option 2


    application.properties :


    encrypt.keyStore.location=<path_to_keystore>


    encrypt.keyStore.password=<keystore_password>


    encrypt.keyStore.alias=<key_name_in_keystore>


