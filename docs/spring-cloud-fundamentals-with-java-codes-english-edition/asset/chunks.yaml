    ## Customizing Your RibbonClient Configuration: Introduction


    In this last section, we''ll learn how to customize an individual Ribbon client
    using declarative configuration. And what this will allow us to do is define custom
    configuration that applies to a specific Ribbon client instead of to all Ribbon
    clients. And what that buys us is it allows us to define different client-side
    load balancing behavior for different services.


    @Configuration


    @RibbonClient(


    name="otherservice",


    configuration=OtherServiceConfig.class)


    public class MyConfiguration{


    ...


    }


     In your @Configuration class, define the @RibbonClient annotation and set the
    name element just like we did when we configured the previous Ribbon client. This
    time though, you''ll define an additional configuration element, and you''ll set
    that to another @Configuration class.


    package io.ajay.config.kumar;


    //Different package so it is not picked up by @ComponentScan


    @Configuration


    public class OtherServiceConfig {


    }


    This additional @Configuration class will contain all of the custom configuration
    for a specific Ribbon client. And that configuration is defined by methods that
    are annotated with the @Bean annotation. So this configuration is just like any
    other @Configuration class. There''s nothing special about it. You would just
    configure your @Beans just like you do normally. But since this configuration
    only pertains to a specific Ribbon client, it shouldn''t be subject to any sort
    of component scanning. If it were, the configuration that was defined in that
    @Configuration class would end up applying to all Ribbon clients instead of just
    a specific Ribbon client.


    @Configuration


    public class OtherServiceConfig {


    @Bean


    public <bean_type> <method_name>(){...}


    }


    Default Ribbon Client @Beans


    Replace <bean_type> and <method_name> with values to override: [http://cloud.spring.io/spring-cloud-static/Camden.SR6/#_customizing_the_ribbon_client](https://www.google.com/url?q=http://cloud.spring.io/spring-cloud-static/Camden.SR6/%23_customizing_the_ribbon_client&sa=D&ust=1546021897455000)


    Most likely to be customized: IRule & IPing


    There are a number of different classes that are needed to set up a Ribbon client,
    and by default Spring Cloud defines those as @Beans and then allows you to override
    any of them for custom configuration. Let''s take a look at the Spring Cloud documentation
    to see what @Beans you can override.


    I''ve loaded up the Spring Cloud documentation, and we''re looking at a number
    of different beans that are required to set up a Ribbon client. And for the most
    part, you typically won''t need to override any of these with the exception of
    two of the beans. That''s the IRule bean and the IPing bean. The IRule bean controls
    the load balancing algorithm, and the IPing bean controls the availability checks
    on the instances that are being load balanced. Let''s take a look at each of these
    beans in a bit more detail.


    ## Customizing Your RibbonClient Configuration: The IRule Bean


    As I mentioned, the IRule bean is used to control the load balancing strategy
    that''s used to balance the distribution of workload between the instances that
    are being load balanced. You can choose to create your own custom IRule implementation,
    or you can choose from one of the several different defaults. Let''s talk about
    a few of our available options.


    *   IRuleImplementations


    *   RoundRobinRule


    *   ResponseTimeWeightedRule


    *   RandomRule


    *   ZoneAvoidanceRule'
