- fmt: "\nThen, in your main `Application` class, add the `@EnableZuulProxy` annotation,\
    \ and this is the annotation that turns your application into the gateway service.\
    \ From a configuration standpoint, you have two different options. You can configure\
    \ your gateway service to use service discovery or you can configure it without\
    \ service discovery.\n\n### Using Spring Cloud & Netflix Zuul with Service Discovery\n\
    \n`application.properties`:\n\n```properties\nspring.application.name=gateway-service\n\
    eureka.client.defaultZone=http://localhost:8761/eureka\n```\n\nOR\n\n`application.yml`:\n\
    \n```yaml\nspring:\n  application:\n    name: gateway-service\neureka:\n  client:\n\
    \    defaultZone: http://localhost:8761/eureka\n```\n\nIf you're using service\
    \ discovery, define the usual parameters for the name of the application and the\
    \ location of the Service Discovery Server.\n\n### Using Spring Cloud & Netflix\
    \ Zuul Without Service Discovery\n\n`application.properties`:\n\n```properties\n\
    spring.application.name=gateway-service\nribbon.eureka.enabled=false\n```\n\n\
    OR\n\n`application.yml`:\n\n```yaml\nspring:\n  application:\n    name: gateway-service\n\
    ribbon:\n  eureka:\n    enabled: false\n```\n\nIf you're not using service discovery,\
    \ you still define the application name, and you add an additional parameter,\
    \ `ribbon.eureka.enabled=false`. Remember how I mentioned that the gateway service\
    \ can serve as a load balancer for your services? Well, the name of the client-side\
    \ load balancer project from Netflix is called `Ribbon`. And we'll get into more\
    \ details about what `Ribbon` is in the module on client-side load balancing.\n\
    \n## Configuring Routes in Netflix Zuul\n\nOnce you have everything configured,\
    \ the next step is to define how Zuul should route requests. The default routing\
    \ behavior when Zuul is set up using service discovery is to route requests by\
    \ service name.\n\n#### Default Route to Service Resolution with Service Discovery\n\
    \nRequest: `/foo` maps to Service: `spring.application.name=foo`\n\nRequest: `/categories/1`\
    \ maps to Service: `spring.application.name=categories`\n\nSo for example, if\
    \ you requested `/foo`, Zuul would use service discovery to find the service with\
    \ a name of `foo` and send that request to that service. Here's another example.\
    \ If you were to request `/categories/1`, Zuul would locate the service with the\
    \ name `categories`, and it would send the `/1` request to that service. By default,\
    \ the prefix is stripped from the request, so the service actually only gets the\
    \ `/1` part of the request. If you wanted it to send the full request, `/categories/1`,\
    \ you could set the property `zuul.stripPrefix` to `false`, and the service would\
    \ get the request `/categories/1`. Also note that all services are added by default,\
    \ so you'll want to use the `zuul.ignoredServices`, and you could set that to\
    \ a pattern to ignore specific services.\n\n#### Netflix Zuul with Service Discovery:\
    \ Precise Routing\n\n`application.properties`\n\n```properties\nspring.application.name=gateway-service\n\
    zuul.routes.<route_name>.path=/somepath/**\nzuul.routes.<route_name>.serviceId=some_service_id\n\
    zuul.ignored-services=some_service_id\n```\n\nOR\n\n`application.yml`:\n\n```yaml\n\
    spring:\n  application:\n    name: gateway-service\nzuul:\n  routes:\n    <route_name>:\n\
    \      path: /somepath/**\n      serviceId: some_service_id\n  ignored-services:\
    \ some_service_id\n```\n\nIn addition to the default configuration, you can also\
    \ define more precise configuration for specific services. First you define the\
    \ path with the `zuul.routes.route_name.path` property where the route name can\
    \ be anything you want. And the path is defined as a path that's using the Ant-style\
    \ matchers. Then you define the same property prefix, but end it with `service_id`\
    \ instead of `path`. And the service ID is the service identifier that Zuul will\
    \ look for when discovering the service via service discovery. You'll also need\
    \ to set the `zuul.ignored-services` property so that Zuul doesn't try to automatically\
    \ add a route for that service ID.\n\n#### Netflix Zuul Without Service Discovery:\
    \ Precise Routing\n\n`application.properties`\n\n```properties\nspring.application.name=gateway-service\n\
    zuul.routes.<route_name>.path=/somepath/**\nzuul.routes.<route_name>.url=http://some_url_address/\n\
    ```\n\nOR\n\n`application.yml`:\n\n```yaml\nspring:\n  application:\n    name:\
    \ gateway-service\nzuul:\n  routes:\n    <route_name>:\n      path: /somepath/**\n\
    \      url: http://some_url_address/\n```\n\nThe configuration for when you're\
    \ not using service discovery is actually pretty similar to when you are. You\
    \ define the path, just like you did in the previous configuration, and then instead\
    \ of defining a service ID, you simply define the URL to the service.\n\n## Demo:\
    \ Using Netflix Zuul as an Intelligent Router\n\nHead on over to `start.spring.io`,\
    \ and we're going to create three different projects here. So for the Group ID\
    \ `io.ajay.kumar`, and for the Artifact, the first one we're going to create,\
    \ we're going to say `gateway-service`. For the dependencies, we'll want to add\
    \ `Zuul`, and then we'll also want to add `Eureka Discovery`.\n\n![](images/00029.gif)\n\
    \nAnd once you're finished there, go ahead and click Generate Project, and that\
    \ will create a zip file for you. And still on the same page, clear the dependencies\
    \ and change the Artifact to `hello-service`. And for the dependencies, we'll\
    \ want to add `Web` and `Eureka Discovery`.\n\n![](images/00030.gif)\n\nGo ahead\
    \ and click Generate Project, and that will create a `hello-service.zip`. And\
    \ leave everything the same, but change this from `hello` to `goodbye`.\n\n![](images/00031.gif)\n\
    \nAnd click Generate Project. Go ahead and unzip all of zip files and head over\
    \ to your IDE. Within your IDE, right-click on the empty space, and go to Import,\
    \ and choose Existing Maven Projects. Navigate to the location of downloaded zip\
    \ files, we'll use `gateway-service` first, and click Open, and click Finish.\
    \ And that imports the project into our IDE, and you'll need to do the same for\
    \ the other two services. We also also need the Service Discovery Server, so if\
    \ you don't already have that imported into your IDE from completing the previous\
    \ modules, I'll quickly show you how you can import it. Go ahead and right-click\
    \ on the empty area of the Package Explorer, and go to New, and choose Other.\
    \ In the textbox, go ahead and start typing `maven`, and choose the option that\
    \ says Check out Maven Projects from SCM. Click Next. We'll need to grab the git\
    \ clone URL from GitHub, so go ahead and fire up a browser and visit `github.com/ajaycucek/discovery-server`.\
    \ On the GitHub page, locate the Clone or download button, click it, and highlight\
    \ the clone URL. Copy that to your clipboard and head back to the IDE. In the\
    \ textbox under the SCM URL, go ahead and paste that and click Next, and Finish.\
    \ We now have everything we need to get started.\n\n![](images/00032.gif)\n\n\
    Go ahead and expand the `gateway-service` project, and locate the main application\
    \ class. In the main application class, we're going to add two annotations. The\
    \ first one is the `@EnableZuulProxy` annotation, and the second one is the `@EnableDiscoveryClient`\
    \ annotation.\n\n```java\npackage io.ajay.kumar.gatewayservice;\n\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.client.discovery.EnableDiscoveryClient;\n\
    import org.springframework.cloud.netflix.zuul.EnableZuulProxy;\n\n@SpringBootApplication\n\
    @EnableZuulProxy\n@EnableDiscoveryClient\npublic class GatewayServiceApplication\
    \ {\n    public static void main(String[] args) {\n        SpringApplication.run(GatewayServiceApplication.class,\
    \ args);\n    }\n}\n```\n\nNext, we'll open up the `application.properties` and\
    \ configure the properties for the gateway service. So go ahead and expand `src/main/resources`\
    \ and open the `application.properties`.\n\n```properties\nspring.application.name=gateway-service\n\
    eureka.client.service-url.defaultZone=http://localhost:8761/eureka\n```\n"
  raw: 'Then, in your main Application class, add the @EnableZuulProxy annotation,
    and this is the annotation that turns your application into the gateway service.
    From a configuration standpoint, you have two different options. You can configure
    your gateway service to use service discovery or you can configure it without
    service discovery.


    Using Spring Cloud & Netflix Zuul with Service Discovery


    application.properties :


    spring.application.name=gateway-service


    eureka.client.defaultZone=http://localhost:8761/eureka


    OR


    application.yml :


    spring:application:name: gateway-service


    eureka:client:defaultZone: http://localhost:8761/eureka


    If you''re using service discovery, define the usual parameters for the name of
    the application and the location of the Service Discovery Server.


    Using Spring Cloud & Netflix Zuul Without Service Discovery


    application.properties :


    spring.application.name=gateway-service


    ribbon.eureka.enabled=false


    OR


    application.yml :


    spring:application:name: gateway-service


    ribbon:eureka:enabled: false


    If you''re not using service discovery, you still define the application name,
    and you add an additional parameter, ribbon.eureka.enabled=false. Remember how
    I mentioned that the gateway service can serve as a load balancer for your services?
    Well, the name of the client-side load balancer project from Netflix is called
    Ribbon. And we''ll get into more details about what Ribbon is in the module on
    client-side load balancing.


    ## Configuring Routes in Netflix Zuul


    Once you have everything configured, the next step is to define how Zuul should
    route requests. The default routing behavior when Zuul is set up using service
    discovery is to route requests by service name.


    Default Route to Service Resolution with Service Discovery


    Request:    /foo   maps to Service:   spring.application.name=foo


    Request:   /categories/1   maps to Service:   spring.application.name=categories


    So for example, if you requested /foo, Zuul would use service discovery to find
    the service with a name of foo and send that request to that service. Here''s
    another example. If you were to request /categories/1, Zuul would locate the service
    with the name categories, and it would send the /1 request to that service. By
    default, the prefix is stripped from the request, so the service actually only
    gets the /1 part of the request. If you wanted it to send the full request, the
    /categories/1, you could set the property zuul.stripPrefix to false, and the service
    would get the request /categories/1\. Also note that all services are added by
    default, so you''ll want to use the zuul.ignoredServices, and you could set that
    to a pattern to ignore specific services.


    Netflix Zuul with Service Discovery:Precise Routing


    application.properties


    spring.application.name=gateway-service


    zuul.routes.<route_name>.path=/somepath/**


    zuul.routes.<route_name>.serviceId=some_service_id


    zuul.ignored-services=some_service_id


    OR


    application.yml


    spring:application:name: gateway-service


    zuul:routes:<route_name>:path: /somepath/**


    serviceId: some_service_id


    ignored-services: some_service_id


    In addition to the default configuration, you can also define more precise configuration
    for specific services. First you define the path with the zuul.routes.route_name.path
    property where the route name can be anything you want. And the path is defined
    as a path that''s using the Ant-style matchers. Then you define the same property
    prefix, but end it with service_id instead of path. And the service ID is the
    service identifier that Zuul will look for when discovering the service via service
    discovery. You''ll also need to set the zuul.ignored-services property so that
    Zuul doesn''t try to automatically add a route for that service ID.


    Netflix Zuul Without Service Discovery:Precise Routing


    application.properties


    spring.application.name=gateway-service


    zuul.routes.<route_name>.path=/somepath/**


    zuul.routes.<route_name>.url=http://some_url_address/


    OR


    application.yml


    spring:


    application:


    name: gateway-service


    zuul:


    routes:


    <route_name>:


    path: /somepath/**


    url: http://some_url_address/


    The configuration for when you''re not using service discovery is actually pretty
    similar to when you are. You define the path, just like you did in the previous
    configuration, and then instead of defining a service ID, you simply define the
    URL to the service.


    ## Demo: Using Netflix Zuul as an Intelligent Router


    Head on over to start.spring.io, and we''re going to create three different projects
    here. So for the Group ID do io.ajay.kumar, and for the Artifact, the first one
    we''re going to create, we''re going to say gateway-service. For the dependencies,
    we''ll want to add Zuul, and then we''ll also want to add Eureka Discovery.


    ![](images/00029.gif)


    And once you''re finished there, go ahead and click Generate Project, and that
    will create a zip file for you. And still on the same page, clear the dependencies
    and change the Artifact to hello-service. And for the dependencies, we''ll want
    to add Web and Eureka Discovery.


    ![](images/00030.gif)


    Go ahead and click Generate Project, and that will create a hello-service.zip.
    And leave everything the same, but change this from hello to goodbye. So we''re
    going to have a hello and a goodbye-service.


    ![](images/00031.gif)


    And click Generate Project. Go ahead and unzip all of those zip files and head
    over to your IDE. Within your IDE, right-click on the empty space in the Package
    Explorer, and go to Import, and choose Existing Maven Projects. Navigate to the
    location of the downloaded zip files, we''ll use the gateway-service first, and
    click Open, and click Finish. And that imports the project into our IDE, and you''ll
    need to do the same for the other two services. I have all of the services imported.
    We''re also going to need the Service Discovery Server, so if you don''t already
    have that imported into your IDE from completing the previous modules, I''ll quickly
    show you how you can import it. Go ahead and right-click on the empty area of
    the Package Explorer, and go to New, and choose Other. In the textbox, go ahead
    and start typing maven, and choose the option that says Check out Maven Projects
    from SCM. Click Next. We''ll need to grab the git clone URL from GitHub, so go
    ahead and fire up a browser and visit github.com/ajaycucek/discovery-server. On
    the GitHub page, locate the Clone or download button, click it, and highlight
    the clone URL. Copy that to your clipboard and head back to the IDE. In the textbox
    under the SCM URL, go ahead and paste that and click Next, and click Finish. We
    now have everything we need to get started.


    ![](images/00032.gif)


    Go ahead and expand the gateway-service project, and locate the main application
    class. In the main application class, we''re going to add two annotations. The
    first one is the @EnableZuulProxy annotation, and the second one is the @EnableDiscoveryClient
    annotation.


    package io.ajay.kumar.gatewayservice;


    import org.springframework.boot.SpringApplication;


    import org.springframework.boot.autoconfigure.SpringBootApplication;


    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;


    import org.springframework.cloud.netflix.zuul.EnableZuulProxy;


    @SpringBootApplication


    @EnableZuulProxy


    @EnableDiscoveryClient


    public class GatewayServiceApplication {


            public static void main(String[] args) {


                    SpringApplication.run(GatewayServiceApplication.class, args);


            }


    }


    Next, we''ll open up the application.properties and configure the properties for
    the gateway service. So go ahead and expand src/main/resources and open the application.properties.


    application.properties


    spring.application.name=gateway-service


    eureka.client.service-url.defaultZone=http://localhost:8761/eureka'
