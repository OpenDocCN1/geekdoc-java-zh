- fmt: "\nWe have the same two properties that we used within the application service,\
    \ the `spring.application.name`, except this time we set it to `client`, and the\
    \ `eureka.client.defaultZone` so that it can know the location of the Service\
    \ Discovery Server. And since we're a client, we're not interested in registering\
    \ with the Discovery Server because we don't need anybody to discover us. We're\
    \ just interested in discovering others. So you set that value to `false`.\n\n\
    ```java\n@SpringBootApplication\n\n@EnableDiscoveryClient\n\npublic class Application{\n\
    \    public static void main(String[]args){\n        SpringApplication.run(Application.class,args);\n\
    \    }\n}\n```\n\nJust like we did with the application service, we'll add the\
    \ `@EnableDiscoveryClient` annotation to our main `Application` class in our application\
    \ client. And then to actually discover services, we have two different options:\n\
    \n*   `@Inject EurekaClient client`\n*   `@Inject DiscoveryClient client`\n\n\
    We can inject the `EurekaClient` or we can inject the `DiscoveryClient`. And just\
    \ to be clear, this is the Spring `DiscoveryClient` and not the Netflix `DiscoveryClient`.\n\
    \n```java\nInstanceInfo instance=eurekaClient.getNextServerFromEureka(\"service-id\"\
    ,false);\nString baseUrl = instance.getHomePageUrl();\n```\n\nThe first option\
    \ is using the `EurekaClient`, and the `EurekaClient` has a method, `getNextServerFromEureka`.\
    \ And that'll pick the next instance in a round-robin fashion from the Discovery\
    \ Server. And its first argument is a virtual host name or a service ID to call.\
    \ And this is the same as the `spring.application.name` property that we've used\
    \ in our service application. And the second argument is whether or not this is\
    \ a secure request. Once we get a reference to the `instance info`, we can call\
    \ `instance.getHomePageUrl`, and that'll give us the base URL that we can use\
    \ with our `RestTemplate` to call the service.\n\n```java\nList<ServiceInstance>\
    \ instances=client.getInstances(\"service-id\");\nString baseUrl=instances.get(0).getUri().toString();\n\
    ```\n\nThe second option is to use the Spring `DiscoveryClient`, and it has a\
    \ method called `getInstances`, which returns you all service instances for a\
    \ given service ID. So that first argument is the same first argument that we\
    \ saw in the `EurekaClient`, which is a virtual hostname or a service ID of the\
    \ service you want to call. And once you have a list of instances, you can get\
    \ one of those instances, and you can get the `URI`, turn it into a string, and\
    \ that's your base URL that you would use in your `RestTemplate`.\n\n## Demo:\
    \ Finding and Calling Services as an Application Client\n\nIn order to create\
    \ our client, we're going to again start off at `start.spring.io`. And we're going\
    \ to give it a group ID, the same one, `io.ajay.kumar`, and we'll make the Artifact\
    \ `client`. It will have the exact same dependencies that we used in the application\
    \ service. So we want Eureka Discovery, want DevTools, and we want the Actuator.\n\
    \n![](images/00007.gif)\n\nClick Generate Project. That'll automatically create\
    \ and download a zip file. Go ahead and unzip that file, and we'll import that\
    \ into our IDE. Within Spring Tool Suite in the Package Explorer area, right-click\
    \ in the empty area, go to Import, choose `Existing Maven Projects`, browse to\
    \ the location of your unzipped file, ensure that the `pom.xml` shows up under\
    \ the Projects heading, and click Finish to import.\n\n![](images/00008.gif)\n\
    \nExpand the client project, and go to `src/main/java`, and open up the main application\
    \ class and do the following changes.\n\n```java\npackage io.ajay.kumar.client;\n\
    \nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.boot.web.client.RestTemplateBuilder;\n\
