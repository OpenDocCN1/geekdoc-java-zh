    of the Hystrix-protected call from the weather app to the weather service. First
    things first, if your services and your discovery server aren''t already running,
    you''ll need to start each of them up. And we''ll start with the discovery server
    first. So expand the discovery-server project and navigate to the main application
    class. Right-click on it, go to Run As, and choose Spring Boot App. Repeat that
    same process for the weather service and then the weather app. The weather service
    and the weather app and the discovery server are all running. And just to double-check,
    you can click little caret and see that each of those services is started. Next,
