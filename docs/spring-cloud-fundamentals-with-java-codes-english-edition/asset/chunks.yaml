  raw: '## Using the @LoadBalanced Annotation


    It''s really easy to get started and create a load balanced RestTemplate.


    Creating a Load Balanced RestTemplate


    @Configuration


    public class MyConfiguration{


        @Bean


        @LoadBalanced


        public RestTemplate restTemplate(){


            return new RestTemplate();


        }


    }


    In your @Configuration class, you define a new method annotated with @Bean that
    returns a new RestTemplate. Then you annotate that same method with the @LoadBalanced
    annotation. And what this does is it tells Spring that the RestTemplate should
    support load balancing. And what that means behind the scenes is that the RestTemplate
    that''s returned will actually have an interceptor, a RestTemplate interceptor,
    that utilizes the Ribbon load balancer client to actually call our services and
    balance between the different instances. And, by default, it''ll use a round-robin
    algorithm for distributing that load. Next, let''s look at how you would actually
    use this load balanced RestTemplate if you were trying to call a service and you
    were using service discovery.


    Using a Load Balanced RestTemplate With Service Discovery


    Suppose my-service is the name of a service running on port 9000 at mycompany.com
    and is discoverable via Service Discovery. There are 2 instances running.


    Instead of restTemplate.getForEntity("http://mycompany.com:9000/u/1",...) or restTemplate.getForEntity("http://128.168.10.10:9000/u/1",...)


    Use RestTemplate like this instead restTemplate.getForEntity("http://my-service/u/1",...)


    Suppose you had two instances of a service called my-service running on port 9000
    on multiple servers at mycompany.com. And also suppose that my-service was discoverable
    via service discovery. Instead of passing the mycompany.com URL or IP address
    to the RestTemplate, you can actually pass a URL that uses a logical identifier
    to represent the service. In this case, we''ve used the logical identifier my-service.
    And this is the same name that the service is registered under at the Service
    Discovery Server. And at runtime the RestTemplate will function as the client-side
    load balancer. And it''ll use service discovery to resolve the real location of
    the my-service instances and then use the configured load balancing algorithm
    to distribute the load between them.


    ## Demo: Load Balancing Using Ribbon with Service Discovery


    In this demo, we''ll set up a Ribbon client that utilizes service discovery and
    balances requests between multiple instances of a service. Since we''ll be using
    service discovery to locate the instances of the service, we''ll need to have
    a Service Discovery Server set up. If you''ve been following along in the previous
    modules of the course, you should already have the discovery server set up within
    your IDE. Once you have the discovery server set up, we''re ready to get started.
    Open up a browser and head over to start.spring.io. In the Group section, change
    this to io.ajay.kumar. And then for the name of the artifact, we''re going to
    call this ribbon-time-service. In the Dependencies section, add the Web dependency
    and the Eureka Discovery dependency.


    ![](images/00036.gif)


    Once you have everything filled out, click the Generate Project button, and it''ll
    create and download a zip for you. Still on the SPRING INITIALIZR page, change
    the artifact name from ribbon-time-service to ribbon-tie-app. Then, in the Dependencies
    section, add a new dependency on Ribbon.


    ![](images/00037.gif)


    Again, once you have everything filled out, click the Generate Project button,
    and that''ll create and download a zip for you. Unzip both of those zip files
    and head back to your IDE. I''ve imported the ribbon-time-service and  ribbon-time-app.
    Right-click on the empty area within the Package Explorer, go to Import, choose
    Existing Maven Projects, click Next, click Browse, browse to the location of the
    downloaded zip file, click Open, and click Finish. We''ll work on the ribbon-time-service
    first, so expand the project and open up the main application class.


    ![](images/00038.gif)


    Within the main application class, add two annotations, the @RestController annotation
    and the @EnableDiscoveryClient annotation.


    package io.ajay.kumar.ribbontimeservice;


    import java.util.Date;


    import org.springframework.beans.factory.annotation.Value;


    import org.springframework.boot.SpringApplication;


    import org.springframework.boot.autoconfigure.SpringBootApplication;


    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;


    import org.springframework.web.bind.annotation.GetMapping;


    import org.springframework.web.bind.annotation.RestController;


    @RestController


    @EnableDiscoveryClient


    @SpringBootApplication


    public class RibbonTimeServiceApplication {


            @Value("${server.port}")


            private int port;


            public static void main(String[] args) {


                    SpringApplication.run(RibbonTimeServiceApplication.class, args);


            }


            @GetMapping


            public String getTime() {


                    return "The current time is "+ new Date().toString()


                                    +"(answered by service running on "+port+")";


            }


    }


    Then we need to add one request handler method, so hit Return a few times and
    do public String getTime. And we''ll annotate that with a shortcut version @GetMapping,
    which is just a request mapping that''s a GET. Then in the body of the method
    we''ll return The current time is, and we''ll construct a new Date object and
    turn that into a string. For demonstration purposes, we''re going to want to know
    which instance is responding to the request. And currently we have no way of telling.
    We wouldn''t be able to tell one from the other. So we''re going to make one addition
    to the response. So we''re going to say + answered by service running on, and
    then we''ll have a port variable, and then we''ll close that parenthesis. And
    since each of our services has to be running on a different port, we can tell
    each one of them apart. So let''s make sure that we actually define that port
    variable. Come up here and add a private int port, and then we''ll annotate this
    with @Value annotation. And we''ll inject this with the server.port variable.
    And before we fire this up, we need to configure a few properties within our application.properties.
    So go ahead and close that and open up src/main/resources and open up the application.properties
    file.


    application.properties


    spring.application.name=time-service


    eureka.client.service-url.defaultZone=http://localhost:8761/eureka'
