    Next, we need to configure our application client. So head over to the `src/main/resources`
    and open up the `application.properties`, and we''ll add the standard `spring.application.name`.
    We''ll call this `client`. And then we''re going to paste in the service URL so
    we don''t have to type it, and then we''re going to do `eureka.client.register-with-eureka`.
    We''re going to set that to `false`. Remember, we''re a client, and we don''t
    need to register with Eureka because we don''t need anybody to discover us.


    Now, before we start our application client, we need to start the Discovery Server
    and each of the application service instances, and in that particular order. So,
    if you''ve been following along, those should be in your run history. So you can
    come up to drop-down and choose each of those to start those up. And just to confirm,
    we''ll check the drop-down, and we can see that we have the `discovery-server`
    running, and `instance 1` of the service application, and `instance 2`. So now
    we''re ready to start our client application. We can right-click on the main application
    class, go to `Run As`, and choose `Spring Boot App`.


    ![](images/00009.jpeg)


    Fire up a web browser and visit `localhost:8080`. Hit Enter, and you should see
    a response from the client. And it''ll say `Hello from instance 1`. And if you
    refresh it, it''ll say `Hello from instance 2`. And we can continue to do that
    over and over, and each time we can see that it''s getting a different instance
    from the Eureka registry.


    ## Spring Cloud Eureka Dashboard


    One of the really useful things that the Spring Cloud Eureka Server provides is
    a dashboard. It''s enabled by default, and it''s a web-based dashboard. And it
    displays a bunch of useful information, like whether or not a service is up or
    down and how many instances of it are registered. If you still have the demo running
    from our last demo, fire up a browser and visit `localhost:8761`. You''ll be presented
    with this Spring Eureka Dashboard, and let''s go through each of these sections
    here.


    ![](images/00010.jpeg)


    ![](images/00011.jpeg)


    So first we have the `System Status`, and it tells you things like the current
    time, the uptime, and how many renewals have happened in the last minute. The
    `DS Replicas`, or the `Discovery Server Replica` section, shows you all of the
    peer instances of Eureka Servers. So if we had more than one instance running,
    we would see each of those instances listed here. But since we''ve only got one
    instance, we just see `localhost`.


    The next section is probably the most useful section as it shows you what instances
    are currently registered with Eureka. And we have here the `service ID` under
    the `Application` heading, which is `SERVICE`. `AMI` is for Amazon Machine Image.
    We''re not running in Amazon, so that''s `n/a`. And `Availability Zones`, there
    are two, and both of those instances are `UP`. You can see the `2` next to the
    `UP`, which indicates that there are two instances of this particular service,
    and both of them are `UP`. And right next to that you can see both of those instances,
    one of them running on `8082` and one of them running on `8081`. The next section,
    the `General Info` section, just gives you information about the particular machine
    that you''re running on. So it tells you things like the number of CPUs and the
    available memory. And the last part, the `Instance Info`, gives you information
    about this particular running instance, so things like its IP address or whether
    or not it''s up or down.


    ## Configuration


    There are several different areas where you can configure Spring Cloud Eureka.
    We''ll take a look at the three main areas. The first is the `eureka.server` prefix,
    the second is the `eureka.client` prefix, and the third is the `eureka.instance`
    prefix. Let''s go into more detail into each of these areas of configuration.


    ### Eureka Server Configuration

    The first one is the Eureka Server Configuration, and that''s all configuration
    under the `eureka.server` prefix. And this is going to control everything that''s
    related to configuring the Discovery Server.


    ### Eureka Client Configuration

    The second one is the Eureka Client Configuration, and that''s all configuration
    under the `eureka.client` prefix. And this is responsible for controlling how
    the discovery client interacts with the Discovery Server. So for instance, you
    have things like `eureka.client.eureka-server-connect-timeout-seconds`. This would
    control how long the client waits to connect to the Eureka Server before it times
    out.


    ### Eureka Instance

    The third area of configuration is the Eureka Instance, and that''s all configuration
    under the `eureka.instance` prefix. And a Eureka Instance is anything that registers
    itself with the Eureka Server so that it can be discovered by others. The properties
    under the `eureka.instance` prefix control how the instance registers itself with
    the Eureka Server. So for instance, you have things like `eureka.hostname` or
    the `eureka.health-check-url`, and the instance could be configured with custom
    values there, and that''s how it would register with the Eureka Server.


    ## Health and High Availability


    The Spring Cloud Eureka Server also has some additional features around health
    and high availability. It''s constantly ensuring that the application services
    that it''s returning or handing back to clients are healthy and available. And
    it also ensures that in the event that the Discovery Server goes down, all clients
    can still continue to operate.


    Like I mentioned, the Eureka Server is constantly concerned with the health of
    the application services that it''s handing out to clients. And it assesses that
    health, at least by default, by sending the clients a heartbeat every 30 seconds.
    And if it doesn''t hear back from that heartbeat after 90 seconds, it removes
    it from the registry. Sending a heartbeat is the default configuration, but you
    can also configure the Eureka Server to hit an endpoint, such as the `/health`
    endpoint that comes with Spring Boot Actuator.


    Eureka was built with high availability in mind, and one of the ways that it achieves
    that is when a client requests a service location from the Discovery Server, the
    Discovery Server actually sends back a copy of the registry. And what ends up
    happening is the registry gets distributed across all of the clients. And if the
    Service Discovery Server goes down, those clients can continue to operate. You''re
    probably thinking well wait though. What if the Discovery Server has new information
    or one of the services goes down? Well, the client has to renew its lease or fetch
    a new registry every so often, and it does so by fetching deltas to update its
    registry. So it''s pretty smart about not fetching the full registry again and
    only getting the changes.


    ## AWS Support

