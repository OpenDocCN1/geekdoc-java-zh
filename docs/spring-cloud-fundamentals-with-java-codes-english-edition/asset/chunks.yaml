    \ configure the Spring application name of that project to be the config-client-app\
    \ so that this configuration only applies to that application. Go ahead and open\
    \ up the last configuration file, the config-client-app-prod.properties file.\
    \ And this configuration file is similar to the one we just looked at. And it\
    \ would apply to the same application, but instead it would only apply to the\
    \ application if the application was running with the Spring Profile named prod.\
    \ Let's close all of these configuration files and start up our Configuration\
    \ Server. So go over here to the config-server, expand it, find the main application\
    \ class, right-click on it, and go to Run As Spring Boot App. You need to start\
