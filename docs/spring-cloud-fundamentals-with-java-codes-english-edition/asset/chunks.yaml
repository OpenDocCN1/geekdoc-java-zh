  trans: "\n在这个演示中，我们将利用 `Turbine` 来合并来自两个不同服务的 `Hystrix` 流，以便它们都能在同一个 `Hystrix Dashboard`\
    \ 中进行查看。我们将继续使用上一个演示中的天气应用应用、气象服务和发现服务器（discovery server），然后我们将添加两个可以从 GitHub\
    \ 上克隆的新项目。第一个新项目是 `datetime-service`，你可以从 `github.com/ajaycucek/hystrix-datetime-service`\
    \ 获取它。第二个新项目是 `datetime-app`，你同样可以在 `github.com/ajaycucek/hystrix-datetime-app`\
    \ 获取它。一旦克隆了这两个项目，确保将它们导入到你的 IDE 中。我已经导入了我的，你的 IDE 看起来应该和这个很相似。这两个新项目 `datetime-app`\
    \ 和 `datetime-service` 与天气应用和气象服务完全一样，唯一的区别是它们返回的是当前日期和时间，而不是天气信息。所以你可以随意浏览并查看这些项目的代码。我们需要启动这些应用程序，首先从发现服务器开始。再次，我已经启动了所有的应用程序。一旦它们都启动了，你可以通过点击小箭头并确保所有应用程序都显示出来来验证。在所有应用程序启动后，我们将开始构建我们的\
    \ Netflix `Turbine` 应用。打开浏览器访问 `start.spring.io`。在 Group 中使用 `io.ajay.kumar`，artifact\
    \ name 可以直接命名为 `turbine`。对于 dependencies，我们显然想要添加 `Turbine`。\n\n![](img/00063.gif)\n\
    \n一旦填写完所有内容，点击 `Generate Project` 按钮，它就会为你创建并下载该 zip 文件。像往常一样，解压该 zip 文件并将其导入你的\
    \ IDE。我们现在回到了导入了 `Turbine` 项目的 IDE 中。\n\n![](img/00064.gif)\n\n展开项目并导航到主应用程序类。\n\
    \n```java\npackage io.ajay.kumar.turbine;\n\nimport org.springframework.boot.SpringApplication;\n\
    \nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\nimport\
    \ org.springframework.cloud.netflix.turbine.EnableTurbine;\n\n@SpringBootApplication\n\
    @EnableTurbine\npublic class TurbineApplication {\n    public static void main(String[]\
    \ args) {\n        SpringApplication.run(TurbineApplication.class, args);\n  \
    \  }\n}\n```\n\n在主应用程序类中，我们将添加一个新的注解，即 `@EnableTurbine` 注解。接下来，我们需要配置一些属性，所以关闭该文件并导航到\
    \ `src/main/resources/application.properties`。\n\n`application.properties`\n```properties\n\
    server.port=3000\nspring.application.name=turbine-aggregator\neureka.client.service-url.defaultZone=http://localhost:8761/eureka\n\
    turbine.app-config=weather-app,datetime-app\nturbine.cluster-name-expression='default'\n\
    ```\n\n在 `application.properties` 中，有很多不同的属性需要设置，所以我将把它们粘贴在这里，然后我们将一个一个地检查每一个。第一个属性\
    \ `server.port`，我们将设置为 `3000`。下一个属性 `application.name`，我们将其命名为 `turbine-aggregator`。第三个属性\
    \ `eureka.client.service-url`，设置为 `localhost:8761/eureka`。在下面我们有两个 `turbine` 属性。记住第一个，`turbine.app-config`\
    \ 属性，它设置了你想让 `Turbine` 聚合在一起作为流的应用或服务。在我们的案例中，我们需要 `weather-app` 和 `datetime-app`。最后一个属性\
    \ `turbine.cluster-name-expression`，我们只需将其设置为用单引号括起来 `default`。我们的属性就设置到这里，所以关闭该文件，然后启动\
    \ `Turbine` 。回到主应用程序类，右键点击它，选择 `Run As`，并选择 `Spring Boot App`。接下来，打开网络浏览器，访问日期时间应用和天气应用，为它们的\
    \ `Hystrix` 流生成一些指标，以便 `Turbine` 能够收集它们。让我们先访问日期时间应用。访问 `localhost:4000/current/datetime`。\n\
    \n![](img/00065.jpeg)\n\n只需刷新几次以生成一些指标。然后我们对气象服务执行相同的操作，访问 `localhost:8000/current/weather`，同样刷新几次以生成指标。\n\
    \n![](img/00066.jpeg)\n\n接下来，打开一个新标签页访问 `localhost:8080/hystrix`。\n\n![](img/00067.jpeg)\n\
    \n这次，我们不再输入 `hystrix.stream` URL，而是使用 `turbine.stream` URL。请输入 `http://localhost:3000/turbine.stream`。在\
    \ Title 文本框中只需输入 `Turbine`。之后，点击 `Monitor Stream` 按钮，你应该能看到日期时间应用的指标。\n\n![](img/00068.jpeg)\n\
    \n## 总结\n\n我们到了本模块的结束，一样，让我们回顾一下学习的内容。\n\n- 容错性是一项要求\n- Netflix Hystrix\n- 熔断器模式\n\
    - `@HystrixCommand`\n- `@EnableTurbine`\n- Hystrix Dashboard & Turbine\n- 监控一个或多个流\n\
    \n首先，我们看到在分布式系统中故障几乎是不可避免的。我们必须学会接受故障并将处理故障视为一项要求。然后我们引入了 Netflix Hystrix，它是熔断器模式等的一种实现。我们还看到了如何使用\
    \ `@EnableTurbine` 注解和 `@HystrixCommand` 注解来保护可能失败的调用。我们通过查看如何使用 Hystrix Dashboard\
    \ 可视化并监控调用，以及如何使用 Turbine 一次监控多个流来结束本模块。\n\n## 整合在一起\n\n问题是它们是如何共同组合成一个云原生系统的？首先，让我们回顾一下涉及的所有内容。这切都从一个或多个应用程序服务开始。\n\
    \n![](img/00069.gif)\n"
- fmt: '

    And in our example here we have two application services, `application Service
    A` and `application Service B`, and both of them are running multiple instances.
    Then, at the heart of everything is the `Service Discovery Server`. It''s the
    phonebook or the directory of the system allowing everyone to register their location,
    as well as discover the location of others. And remember that we utilized `Netflix
    Eureka` throughout the book for our service discovery needs. Next, we have the
    `Config Server` to handle our dynamic and distributed configuration needs. And
    remember that we use the `Spring Cloud Config Server` for this. After that, we
    have the gateway, or the front door, of the system, and it''s responsible for
    receiving and routing requests to back-end services. And we use `Netflix Zuul`
    for this. Then we have a client-side load balancer to distribute requests among
    the multiple instances that we run for high availability purposes. And remember
    in our case we used `Netflix Ribbon`. And last, we have fault tolerance to be
    able to tolerate and measure failures and prevent them from causing cascading
    failures to other systems. And we use `Netflix Hystrix` for this.


    ## Putting It All Together: On Startup


    Now that we''ve recapped all of the pieces involved, let''s take a moment to look
    at how they all interact with each other, specifically on startup.


    ![](images/00070.gif)


    It all starts with the `Service Discovery Server`. Each and every instance of
    every piece of the system registers itself with the `Service Discovery Server`
    upon startup. And then it also receives a reply with the location of other registered
    services. For application services, this reply is very important because it tells
    them where the location of the `Configuration Server` is at.


    ![](images/00071.gif)


    And once they know the location of the `Configuration Server`, they can make a
    request to retrieve any configuration that will ultimately be used to bootstrap
    their startup process.


    ## Putting It All Together: On Request


    Now that we have all of our application and their supporting services started,
    let''s look at how they all interact with each other during a request.


    ![](images/00072.gif)


    The request for a given path begins at the gateway server, `Netflix Zuul` in our
    case. And `Zuul` will match the path to a given `service ID`, and then it will
    use service discovery, either by requesting it from the `Service Discovery Server`
    or via a previously cached result, to locate the service that will handle that
    path. Once the service is located, it''ll make a `Hystrix`-protected call to the
    service using `Ribbon` to handle the client-side load balancing of which instances
    it should send the traffic to. In our example, the request was sent to `Service
    A`. Now, suppose that `Service A` also depends on `Service B` to fulfill the request.
    Upon receiving the request, `Service A` will utilize service discovery to locate
    `Service B`. And it''ll do that either via a previously cached result or by requesting
    it from the `Service Discovery Server`. Next, it''ll make a `Hystrix`-protected
    call using `Ribbon` for client-side load balancing to one of the instances of
    `Service B`. `Service B` will respond to `Service A`, and then `Service A` will
    respond to the gateway, and finally, the gateway will respond to the original
    request.


    ## Where to Go Next


    Throughout the book, we''ve covered the core fundamentals of `Spring Cloud` and
    given you a good foundation to build upon.


    Fundamentals we covered, they only represent two of the many pieces of `Spring
    Cloud`.


    *   `Spring Cloud Config`

    *   `Spring Cloud Netflix`


    And remember that `Spring Cloud` is a conglomerate of projects, and while the
    fundamentals that we covered was a lot of information to learn, they only represent
    two of the many pieces of `Spring Cloud`. And that''s the `Spring Cloud Config`
    project and the `Spring Cloud Netflix` project.


    *   `Spring Cloud`

    *   `Spring Cloud Bus`

    *   `Spring Cloud Task`

    *   `Spring Cloud Cluster`

    *   `Spring Cloud Consul`

    *   `Spring Cloud Sleuth`

    *   `Spring Cloud Security`

    *   `Spring Cloud Stream`

    *   More...


    There are a whole bunch of other projects like `Spring Cloud Bus`, `Spring Cloud
    Cluster`, and `Spring Cloud Stream` that all help you solve problems in the cloud.
    To get the best idea of what''s available with `Spring Cloud`, visit the documentation
    page at `http://projects.spring.io/spring-cloud`, and then scroll down to the
    section with the heading `Main Projects`. Here you''ll find all of the `Spring
    Cloud` projects that sit under the `Spring Cloud` umbrella. And I encourage you
    to check them out, if only so that you''re familiar with them and you know that
    they exist because, like I mentioned before, it can be really helpful to know
    what tools exist so that you use the right tool for the right job.

    '
