    ## Summary


    We''ve reached the end of this module, so let''s quickly go over what we learned.
    We started off by taking a look at what service discovery is and why it''s important.
    Then we learned how to use the Spring Cloud Eureka Client to discover services
    and the Spring Cloud Eureka Server to store a registry of services so that others
    could discover them. Then we took a quick look at the Spring Cloud Eureka Dashboard
    and saw an insight into the Spring Cloud Eureka Server. From there, we talked
    about health checks, high availability, and configuring Spring Cloud Eureka. And
    we finished off by looking at the AWS specific support.


