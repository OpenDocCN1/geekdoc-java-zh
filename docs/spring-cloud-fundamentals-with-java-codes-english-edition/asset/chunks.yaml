  trans: '

    在我们的示例中，有两个应用程序服务，`application Service A` 和 `application Service B`，它们都运行着多个实例。然而，这一切的核心的核心是
    `Service Discovery Server`（服务发现服务器）。它是系统的电话簿或目录，允许所有人注册自己的位置，并发现其他人的位置。记住，在整本书中我们一直使用
    `Netflix Eureka` 来满足服务发现的需求。接下来，我们有 `Config Server`（配置服务器）来处理动态和分布式配置需求。请记住，我们在此使用了
    `Spring Cloud Config Server`。之后，我们有网关，即系统的大门，它负责接收并将请求路由到后端服务。我们使用 `Netflix Zuul`
    来实现这一点。然后，我们有一个客户端负载均衡器，用于在高可用目的目的运行的多个实例之间分配请求。请记住，在我们的案例中我们使用了 `Netflix Ribbon`。最后，我们有容错机制，能够容忍并衡量故障，防止这些故障导致其他系统的级联故障。我们使用
    `Netflix Hystrix` 来实现这一点。


    ## 整合一切：启动时


    现在我们已经回顾了所有涉及的组件，让我们花点看看它们是如何相互交互的，特别是在启动阶段。


    ![](img/00070.gif)


    一切都从 `Service Discovery Server` 开始。系统每个组件的每一个实例在启动时都会向 `Service Discovery Server`
    注册自己。然后，它还会收到一个包含其他注册服务位置的回复。对于应用程序服务来说，这个回复非常重要，因为告诉了它们 `Configuration Server`
    的位置。


    ![](img/00071.gif)


    一旦知道了 `Configuration Server` 的位置，它们就可以发送请求来检索任何配置，这些配置最终将用于引导它们的启动过程。


    ## 整合一切：请求时


    现在我们所有的应用程序及其支持服务都已启动，让我们看看它们在处理请求处理期间是如何相互交互的。


    ![](img/00072.gif)


    特定路径的请求开始于网关服务器，在我们的案例中是 `Netflix Zuul`。`Zuul` 将路径匹配到给定的 `service ID`，然后它将使用服务发现（通过向
    `Service Discovery Server` 发起请求或通过之前缓存的结果）来定位处理该路径的服务。一旦定位了服务，它将进行受 `Hystrix`
    保护的调用，并使用 `Ribbon` 处理客户端负载均衡，以决定将流量发送到哪些实例。在我们的示例中，请求被发送到了 `Service A`。现在，假设 `Service
    A` 也依赖 `Service B` 来完成请求。在接收请求后，`Service A` 将利用服务发现定位 `Service B`。它将通过之前缓存的结果或通过向
    `Service Discovery Server` 发起请求来实现。接下来，它将使用 `Ribbon` 发起受 `Hystrix` 保护的客户端负载均衡调用，指向
    `Service B` 的其中一个实例。`Service B` 将响应 `Service A`，然后 `Service A` 将响应网关，最后，网关对原始请求做出响应。


    ## 下一步去哪里


    在整本书中，我们涵盖了 `Spring Cloud` 的核心基础知识，并为你构建了良好的基础。


    我们涵盖的基础知识仅代表了 `Spring Cloud` 众多部分中的两个。


    *   `Spring Cloud Config`

    *   `Spring Cloud Netflix`


    请记住，`Spring Cloud` 是许多项目的集合，虽然我们涵盖的基础知识包含大量需要学习的信息，但它们仅代表了 `Spring Cloud` 众多部分中的两个。那就是
    `Spring Cloud Config` 项目和 `Spring Cloud Netflix` 项目。


    *   `Spring Cloud`

    *   `Spring Cloud Bus`

    *   `Spring Cloud Task`

    *   `Spring Cloud Cluster`

    *   `Spring Cloud Consul`

    *   `Spring Cloud Sleuth`

    *   `Spring Cloud Security`

    *   `Spring Cloud Stream`

    *   更多...


    还有许多其他项目，如 `Spring Cloud Bus`、`Spring Cloud Cluster` 和 `Spring Cloud Stream`，它们都能帮助你解决云端问题。要充分了解
    `Spring Cloud` 提供的可用功能，请访问 `http://projects.spring.io/spring-cloud` 文档页面，然后滚动到标题为
    `Main Projects` 的部分。在这里你将找到所有属于 `Spring Cloud` 伞下的 `Spring Cloud` 项目。我鼓励你去查看它们，即使只是让你熟悉它们并知道它们的存在，因为正如我之前提到的，知道存在哪些工具是非常有的，这样你就能用正确的工具做正确的事。

    '
