    \ `eureka.client` 属性设置为 `http://localhost:8761/eureka`。\n\n我们现在已经完成了天气服务，所以让我们快速启动它并确保一切运行正常。请关闭这两个文件并打开\
    \ `discovery-server`。导航到该主应用程序类，右键点击它，选择 `Run As`，选择 `Spring Boot App`。一旦服务发现服务器启动，导航到\
    \ `weather-service` 的主应用程序类，右键点击它，`Run As`，`Spring Boot App`。接下来，打开浏览器并访问 `http://localhost:9000/weather`。\n\
    \n![](img/00049.jpeg)\n\n只需确保你在这里收到了响应即可。你可以刷新几次，看看你是否获得了不同的响应。现在我们的天气服务已经运行了，让我们回到\
    \ IDE 并在我们的天气应用中使用它。\n\n![](img/00050.gif)\n\n回到你的 IDE 中，展开 `weather-app` 并导航到主应用程序类。在主应用程序类中，我们将定义三个新注解。\n\
    \n```java\npackage io.ajay.kumar.weatherapp;\n\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.client.circuitbreaker.EnableCircuitBreaker;\n\
    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;\nimport\
    \ org.springframework.cloud.client.loadbalancer.LoadBalanced;\nimport org.springframework.context.annotation.Bean;\n\
    import org.springframework.web.bind.annotation.RestController;\nimport org.springframework.web.client.RestTemplate;\n\
    \n@SpringBootApplication\n@EnableCircuitBreaker\n@EnableDiscoveryClient\n@RestController\n\
    public class WeatherAppApplication {\n    public static void main(String[] args)\
    \ {\n        SpringApplication.run(WeatherAppApplication.class, args);\n    }\n\
    \n    @Bean\n    @LoadBalanced\n    public RestTemplate restTemplate() {\n   \
    \     return new RestTemplate();\n    }\n}\n```\n\n第一个是 `@EnableCircuitBreaker`\
    \ 注解，下一个是 `@EnableDiscoveryClient` 注解，最后一个是 `@RestController` 注解。接下来，我们将定义一个 `RestTemplate`\
    \ 以便我们可以调用天气服务，所以来到这里写 `public RestTemplate restTemplate()` 并将其命名为 `restTemplate`。用\
    \ `@Bean` 注解和 `@LoadBalanced` 注解对其标注。然后，在方法体中，`return new RestTemplate()`。\n\n\
    现在记住 `Hystrix` 命令只能在 `@Component` 或 `@Service` 类中定义，所以回到这里创建一个新类。右键点击，选择 `New`，选择\
    \ `Class`，我们将其命名为 `WeatherService`。\n\n```java\npackage io.ajay.kumar.weatherapp;\n\
    \nimport javax.inject.Inject;\nimport org.springframework.stereotype.Service;\n\
    import org.springframework.web.client.RestTemplate;\nimport com.netflix.hystrix.contrib.javanica.annotation.HystrixCommand;\n\
    \n@Service\npublic class WeatherService {\n    @Inject\n    private RestTemplate\
    \ restTemplate;\n\n    @HystrixCommand(fallbackMethod = \"unknown\")\n    public\
    \ String getWeather() {\n        return restTemplate.getForEntity(\"http://weather-service/weather\"\
    , String.class).getBody();\n    }\n\n    public String unknown() {\n        return\
    \ \"unknown\";\n    }\n}\n```\n\n在类顶部，用 `@Service` 对其进行标注。接下来我们需要我们的 `RestTemplate`，以便我们可以调用天气服务，所以来到这里写\
    \ `private RestTemplate restTemplate`。用 `@Inject` 注解对其标注。然后我们需要一个方法来调用天气服务，所以下面写\
    \ `public String getWeather()`。在方法体中，我们将返回 `restTemplate.getForEntity`。URL 使用\
    \ `http://weather-service/weather`，返回类型将是 `String.class`。然后我们将确保调用 `.getBody()`\
    \ 来获取响应。在方法顶部，我们需要用 `HystrixCommand` 对其标注，并指定 `fallbackMethod = \"unknown\"`。然后我们将定义一个新方法，`public\
    \ String unknown()`。这将是一个非常简单的方法。它将返回字符串 \"unknown\"。为了清晰起见，我们在主应用程序类中使用这个 `WeatherService`\
    \ 来获取实际天气。如果获取天气出现问题或 `WeatherService` 宕机，它将调用该 `fallbackMethod` 并返回 unknown。\n\
    \n```java\n@SpringBootApplication\n@EnableCircuitBreaker\n@EnableDiscoveryClient\n\
    @RestController\npublic class WeatherAppApplication {\n    @Inject\n    private\
    \ WeatherService weatherService;\n\n    public static void main(String[] args)\
    \ {\n        SpringApplication.run(WeatherAppApplication.class, args);\n    }\n\
    \n    @GetMapping(\"/current/weather\")\n    public String getWeather() {\n  \
    \      return \"The current weather is \" + weatherService.getWeather();\n   \
    \ }\n\n    @Bean\n    @LoadBalanced\n    public RestTemplate restTemplate() {\n\
    \        return new RestTemplate();\n    }\n}\n```\n"
