    接下来，我们需要配置应用程序客户端。因此，进入 `src/main/resources` 目录打开 `application.properties`，我们将添加标准的
    `spring.application.name`。将其命名为 `client`。然后我们将服务的 URL 粘贴进去，就不需要手动输入了，接着处理 `eureka.client.register-with-eureka`。将其设置为
    `false`。记住，我们是一个客户端，不需要向 Eureka 注册，因为我们不需要任何人来发现我们。


    现在，在启动应用程序客户端之前，我们需要启动服务发现服务器（Discovery Server）以及每个应用程序服务实例，并且要按照特定的顺序进行。所以，如果你一直在跟着操作，这些项目应该出现在你的运行历史记录中。你可以点击下拉菜单并选择其中的每一个项来启动它们。为了确认一下，我们检查下拉菜单，可以看到
    `discovery-server` 正在运行，服务应用程序的 `instance 1` 以及 `instance 2` 也在运行。现在我们准备好启动客户端应用程序了。我们可以右键点击主应用程序类，选择
    `Run As`（运行），并选择 `Spring Boot App`。


    ![](img/00009.jpeg)


    打开 浏览器并访问 `localhost:8080`。按下回车键，你应该能看到来自客户端的响应。它会显示 `Hello from instance 1`。如果你刷新它，它会显示
    `Hello from instance 2`。我们可以重复这种操作，每次都能看到它从 Eureka 注册表中获取不同的实例。


    ## Spring Cloud Eureka Dashboard


    Spring Cloud Eureka Server 提供的非常实的功能之一是仪表板（Dashboard）。它是默认开启的，是一个基于 Web 的仪表板。它显示了许多有用信息，例如服务是上线还是离线，以及注册了多少个实例。如果你仍在运行上一次演示中的
    Demo，请打开浏览器访问 `localhost:8761`。你将看到这个 Spring Eureka Dashboard，让我们逐一查看这里的每一个部分。


    ![](img/00010.jpeg)


    ![](img/00011.jpeg)


    首先是 `System Status`（系统状态），它会告知你当前时间、运行时间以及过去一分钟内发生了多少次续约。`DS Replicas` 或 `Discovery
    Server Replica`（服务发现服务器副本）部分显示了所有 Eureka 服务器的对等实例。如果我们运行了多个实例，就会在这里列出每一个实例。但由于我们只运行了一个，所以只看到
    `localhost`。


    下一部分可能是最有用的部分，因为它显示了当前注册到 Eureka 的哪些实例。在 `Application`（应用程序）标题下，我们有 `service ID`，它是
    `SERVICE`。`AMI` 代表 Amazon 机器镜像。我们没有在 Amazon 上运行，所以是 `n/a`。`Availability Zones`（可用区）有两个，这两个实例都处于
    `UP`（在线）状态。你可以看到 `UP` 旁边的数字 `2`，这表示该特定服务有两个实例，并且它们都处于 `UP` 状态。紧接着右侧，你可以看到这两个实例，其中一个运行在
    `8082` 上，另一个运行在 `8081` 上。下一部分 `General Info`（通用信息）仅提供有关你运行的特定机器的信息。它会告知你 CPU 数量和可用内存等信息。最后部分
    `Instance Info`（实例信息）提供有关该特定运行实例的信息，例如它的 IP 地址或其处于上线还是离线状态。


    ## Configuration


    有几个不同的区域可以配置 Spring Cloud Eureka。我们将查看三个主要区域。第一个是 `eureka.server` 前缀，第二个是 `eureka.client`
    前缀，第三个是 `eureka.instance` 前缀。让我们详细了解这些配置区域的每一个。


    ### Eureka Server Configuration

    第一个是 Eureka Server 配置，即所有 `eureka.server` 前缀下的配置。这将控制所有与配置服务发现服务器相关的内容。


    ### Eureka Client Configuration

    第二个是 Eureka Client 配置，即所有 `eureka.client` 前缀下的配置。它负责控制发现客户端如何与服务发现服务器交互。例如，你有像
    `eureka.client.eureka-server-connect-timeout-seconds` 等项。这会控制客户端在超时之前等待连接到 Eureka
    服务器的时长。


    ### Eureka Instance

    第三个配置区域是 Eureka Instance，即所有 `eureka.instance` 前缀下的配置。Eureka Instance（Eureka 实例）是指任何将其注册到
    Eureka 服务器以便被他人发现的实体。`eureka.instance` 前缀下的属性控制实例如何向 Eureka 服务器注册其本身。例如，你有像 `eureka.hostname`
    或 `eureka.health-check-url` 等项，可以在那里为实例配置自定义值，并以此这种方式向 Eureka 服务器注册。


    ## Health and High Availability


    Spring Cloud Eureka Server 还有一些关于健康检查和高可用性的额外功能。它不断确保它返回或交付给客户端的应用程序服务是健康且可用的。它还确保在服务发现服务器宕机的情况下，所有客户端仍继续运行。


    正如我提到的，Eureka Server 始终关注它交付给客户端的应用程序服务的健康状况。在默认情况下，它通过每 30 秒向客户端发送一次心跳来评估这种健康状况。如果在
    90 秒内没有收到心跳的回应，它将将其从注册表中移除。发送心跳是默认配置，但你也可以配置 Eureka 服务器访问端点，例如 Spring Boot Actuator
    提供的 `/health` 端点。


    Eureka 在设计时就考虑了高可用性，它实现这一点的方法之一是当客户端从服务发现服务器请求服务位置时，服务发现服务器实际上会返回注册表的副本。结果是注册表分到了所有客户端中。如果服务发现服务器宕机，这些客户端可以继续运行。你可能在想，等等，如果服务发现服务器有了新信息，或者某个服务宕机了怎么办？嗯，客户端必须定期续约或获取新的注册表，而且它通过获取增量（deltas）来更新注册表。因此它非常智能，不会再次获取整个注册表，而是只获取变化。


    ## AWS Support


