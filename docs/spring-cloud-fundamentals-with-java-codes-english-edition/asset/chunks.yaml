    public IRule ribbonRule() {


     return new RandomRule();


    }


    }


    Then we''re going to annotate this class, of course, with @Configuration. And
    then for this demo, we''re going to customize the load balancing strategy. So
    we''ll come down here and we''ll define a new IRule. So we''ll say public IRule,
    and we''ll call this ribbonRule. And then in the body of the method, we''ll say
    return new RandomRule. And what this will do is it''ll pick a random instance
    to send traffic to as opposed to what we were using before where we were evenly
    balancing between each of the instances. And last, make sure that we don''t forget
    to add the @Bean annotation to our method. We''re done with our custom configuration,
    so we can go ahead and close that. And then we can open up the main RibbonTimeApplication.


