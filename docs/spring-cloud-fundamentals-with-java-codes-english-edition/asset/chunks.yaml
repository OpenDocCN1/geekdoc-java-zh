    ## Metrics and Insight with the Hystrix Dashboard


    Netflix Hystrix tracks the execution status of protected calls so that it knows
    when to trip the circuit breaker. And one of the advantages of this is that we
    can use those metrics to get insight into how our calls are functioning. Reading
    those metrics in their raw form wouldn''t be very easy or efficient. And that''s
    where the Hystrix Dashboard comes in. And the dashboard is a web application that
