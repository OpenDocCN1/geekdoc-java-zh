    \ to the browser. Back within the browser, we'll go ahead and refresh the page,\
    \ and we can see instantly that the current weather is unknown.\n\n![](images/00052.jpeg)\n\
    \n`Hystrix` has realized the call to the weather service is failing and it should\
    \ use its fallback method.\n\n## Metrics and Insight with the Hystrix Dashboard\n\
    \nNetflix `Hystrix` tracks the execution status of protected calls so that it\
    \ knows when to trip the circuit breaker. And one of the advantages of this is\
    \ that we can use those metrics to get insight into how our calls are functioning.\
    \ Reading those metrics in their raw form wouldn't be very easy or efficient.\
    \ And that's where the `Hystrix Dashboard` comes in. And the dashboard is a web\
    \ application that helps you visualize all of those metrics in a quick and easy-to-use\
    \ fashion. The dashboard is jam-packed with information.\n\n* Tracks metrics such\
    \ as:\n* Circuit state\n* Error rate\n* Traffic volume\n* Successful requests\n\
    * Rejected requests\n* Timeouts\n* Latency percentiles\n* Monitor protected calls\n\
    * Single server or cluster\n\nIt tracks and displays information about the state\
    \ of the circuit, whether it's open or closed, the error rate for the call, the\
    \ traffic volume that it's receiving, how many requests were successful, rejected,\
    \ or timed out, and the latency percentiles for the call. And you can also use\
    \ it to track a single server or a cluster of servers. To use it, it's literally\
    \ as easy as declaring a couple dependencies in your `pom.xml` and adding a single\
    \ annotation.\n\n## Using Spring Cloud and the Netflix Hystrix Dashboard\n\nIn\
    \ order to use the `Hystrix Dashboard`, you first, like always, declare a new\
    \ dependency within the `dependencyManagement` section of your `pom.xml` on `spring-cloud-dependencies`.\n\
    \n`pom.xml`\n```xml\n<dependencyManagement>\n    <dependencies>\n        <dependency>\n\
    \            <groupId>org.springframework.cloud</groupId>\n            <artifactId>spring-cloud-dependencies</artifactId>\n\
    \            <version>Camden.SR2</version>\n            <type>pom</type>\n   \
    \         <scope>import</scope>\n        </dependency>\n    </dependencies>\n\
    </dependencyManagement>\n```\n\nAnd, as always again, make sure that it's of type\
    \ `pom` and has a scope of `import`.\n\n`pom.xml`\n```xml\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
    \    <artifactId>spring-cloud-starter-hystrix-dashboard</artifactId>\n</dependency>\n\
    ```\n\nThen, still within your `pom.xml`, in the `dependency` section, define\
    \ a new dependency on `spring-cloud-starter-hystrix-dashboard`. And finally, you\
    \ can probably guess it, add the `@EnableHystrixDashboard` annotation.\n\n```java\n\
    @SpringBootApplication\n@EnableHystrixDashboard\npublic class Application{\n \
    \   public static void main(String[]args){\n        SpringApplication.run(Application.class,args);\n\
    \    }\n}\n```\n\nAnd that's all you need to get started with the `Hystrix Dashboard`.\n\
    \n## Reading and Understanding the Hystrix Dashboard\n\nBefore we get started\
    \ with the demo of setting up the `Hystrix Dashboard`, it'll be important to understand\
    \ how to read the dashboard as it contains a lot of information in a very small\
    \ amount of space.\n\n![](images/00053.gif)\n\nWe'll focus on the top half under\
    \ the `Circuit` heading as the bottom half, the `Thread Pools`, is pretty self-explanatory.\
    \ The dashboard is quite literally jam-packed with information. And it can be\
    \ a little daunting when you see it at first, so let's break it down by parts.\
    \ At the top right you have the name of the `Hystrix` call that is being protected,\
    \ and in this picture it's the `getCurrentWeather` call.\n\n![](images/00054.gif)\n\
    \nOn the left side, you have a circle that represents both the request volume,\
    \ as well as the health of the call. And the larger the circle gets, the more\
    \ the request volume is, and the more red the circle becomes, the more unhealthy\
    \ the call is. Then on top of the circle, the line is a depiction of the request\
    \ rate over the last 2 minutes. Back on the right side, beneath the name of the\
    \ protected call in gray, is the error rate for the call. And below that you have\
    \ the request per second at the host level, as well as at the cluster level. Continuing\
    \ downward, still on the right side, you have the state of the circuit for this\
    \ call and whether it's open and rejecting traffic or whether it's closed and\
    \ accepting traffic. And then right below that you have the latency percentiles.\
    \ Moving back to the top, underneath the name of the protected call are a bunch\
    \ of numbers with different colors. Let's zoom in on this particular area so we\
    \ can explain each of these. For the numbers, we'll move column by column and\
    \ row by row. And, just in case you forget, there's a legend at the top of the\
    \ `Hystrix Dashboard` that looks just like this.\n\n![](images/00055.gif)\n\n\
    Starting at the first column in the first row, the dark green number represents\
    \ the number of successful requests. And right below that, the blue number represents\
    \ the number of short-circuited requests. And these are the requests that didn't\
    \ even attempt to execute because the circuit was open. Still in the first column,\
    \ on the bottom row, the light green number represents the number of bad requests.\
    \ And these requests are errors, but they're not necessarily due to an execution\
    \ failure. They're due to something like an illegal argument. Moving on to the\
    \ second column, the first row, the orange number represents the number of timed\
    \ out requests. And these are requests where the execution was attempted, but\
    \ a response was not received in the allotted time. Right below the timed out\
    \ request, the purple number represents the number of rejected requests. And rejected\
    \ requests happen when there are no more resources to serve a request, either\
    \ via the thread pool or a semaphore. And remember that the request is rejected\
    \ so that requests don't stack up at the caller and consume those valuable resources.\
    \ And the last number in the second column, the red one, is the number of failed\
    \ requests. And these are requests that failed to execute because they threw an\
    \ exception.\n"
