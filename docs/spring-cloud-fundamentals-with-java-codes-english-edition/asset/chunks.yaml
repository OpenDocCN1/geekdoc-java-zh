    \ 中。我们可以关闭所有配置文件并最小化所有项目。现在我们准备好运行应用程序了。我们首先启动 Discovery Server。导航到 Discovery\
    \ Server 的主类，右键点击它，选择 `Run As Spring Boot App`。一旦 Discovery Server 启动，我们将启动 Configuration\
    \ Server。转到 Config Server 的主类，右键点击它，选择 `Run As Spring Boot App`。最后，我们启动 Config\
    \ Client。进入 Config Client 的主类，右键点击它，选择 `Run As Spring Boot App`。现在你会看到 `config-client-app`\
    \ 在与 Eureka server 注册后意外关闭。\n\n在控制台中你将看到：\n\n```\nShutting down DiscoveryClient\
    \ ...\nconfig-client-app - registration status: 204\nUnregistering ...\nconfig-client-app\
    \ - deregister status: 200\nCompleted shut down of DiscoveryClient\n```\n\n现在要修复这个问题，请在\
