- fmt: "\nThe Spring Cloud project took the Netflix open source projects and added\
    \ some Spring and some Spring Boot features. They sort of Spring-a-fide it, if\
    \ you will. And what was born out of that was the Spring Cloud Netflix project.\
    \ Similar to the Spring Cloud project, the Spring Cloud Netflix project is not\
    \ actually a project in and of itself. Rather, it's a collection of projects.\
    \ And for service discovery, we're interested in two of those projects: the Spring\
    \ Cloud Netflix Eureka Server and the Spring Cloud Netflix Eureka Client.\n\n\
    ## Key Components Involved in Service Discovery\n\nBefore we dive in to the Spring\
    \ Cloud Eureka Server and Client, it's helpful to understand the key components\
    \ that are involved in service discovery and how they interact with each other.\
    \ At a minimum, there are three components involved in service discovery. There's\
    \ the Discovery Server, the application service, and the application client. It's\
    \ helpful to get a full understanding of how all the components work together\
    \ and from there we'll go deeper into each component and see how Spring Cloud\
    \ helps us implement that particular component.\n\n1. (1) Service registers location\n\
    2. (2) Client looks up service location\n3. (3) Discovery server sends back location\n\
    4. (4) Client requests service at location\n5. (5) Service sends response\n\n\
    The first thing that happens is the application service starts up. And when it\
    \ starts up, it calls out to the Discovery Server, and it registers itself. And\
    \ it tells the Discovery Server its location, its port, and a service identifier\
    \ that others can use to find it. Then at some point later, a client needs to\
    \ call that application service, but it doesn't know the location and the port\
    \ of the service, so it needs to ask the Discovery Server. It sends out a request\
    \ to the Discovery Server and sends along the service identifier. And the Discovery\
    \ Server knows that based on that service identifier which service you're asking\
    \ for, and it responds back with the location and the port of that service. From\
    \ there, things proceed as normal, and the client can request the service and\
    \ its location, and the service can respond back with data.\n\n## The Discovery\
    \ Server\n\nWe're going deeper with each of the key components in service discovery,\
    \ and we're going to start with the Discovery Server. At its core, the Discovery\
    \ Server is an actively managed registry of service locations. It is responsible\
    \ for allowing others to find services and for services to register and deregister\
    \ themselves. It's the source of truth, if you will. And you would typically run\
    \ more than one instance of the Discovery Server as it's the key component to\
    \ locate all the other services. And if you can't locate the other services, then\
    \ you can't call the other services. So this is an important piece of the overall\
    \ architecture. And you can find the Discovery Server implementation within the\
    \ Spring Cloud Eureka Server project. Throughout the book, we're going to be doing\
    \ fairly simple demos, things that are easy to set up and solidify the concepts.\
    \ So in this example, we're going to learn how to create a Discovery Server using\
    \ Spring Cloud. And I'll detail out each of the steps, and then we'll follow up\
    \ with a real example. Creating a Discovery Server with the Spring Cloud Eureka\
    \ Server project is very easy. In fact, it's almost embarrassingly easy.\n\n###\
    \ `pom.xml`\n\n```xml\n<dependencyManagement>\n    <dependencies>\n        <dependency>\n\
    \            <groupId>org.springframework.cloud</groupId>\n            <artifactId>spring-cloud-dependencies</artifactId>\n\
    \            <version>Camden.SR2</version>\n            <type>pom</type>\n   \
    \         <scope>import</scope>\n        </dependency>\n    </dependencies>\n\
    </dependencyManagement>\n```\n\nIn your `pom.xml` of your Maven project, in the\
    \ `dependencyManagement` section, define a new dependency called `spring-cloud-dependencies`,\
    \ and make sure it's of type `pom` and it has a scope of `import`.\n\n```xml\n\
    <dependency>\n    <groupId>org.springframework.cloud</groupId>\n    <artifactId>spring-cloud-starter-eureka-server</artifactId>\n\
    </dependency>\n```\n\nStill within your `pom.xml`, define a new dependency, `spring-cloud-starter-eureka-server`.\
    \ And be sure to place this within the `dependency` section and not within the\
    \ `dependencyManagement`.\n\n### `Application.properties`\n\n```properties\nspring.application.name=discovery-server\n\
    ```\n\nOR\n\n### `Application.yml`\n\n```yaml\nspring:\n  application:\n    name:\
    \ discovery-server\n```\n\nWithin your `application.properties` or your `application.yml`,\
    \ define a new property, `spring.application.name`. And you can give this whatever\
    \ value you want. In our case here, we're going to use discovery-server.\n\n```java\n\
    @SpringBootApplication\n@EnableEurekaServer\npublic class Application{\n    public\
    \ static void main(String[]args){\n        SpringApplication.run(Application.class,args);\n\
    \    }\n}\n```\n\nThen, in your main `Application` class, you literally define\
    \ one annotation. It's `@EnableEurekaServer`. And that's all there is to it. Once\
    \ you start this application up, you will having a running instance of a Discovery\
    \ Server.\n\n## Demo: Setting up a Service Discovery Server\n\nIn this demo, we're\
    \ going to be creating and starting up our own Service Discovery Server using\
    \ the Spring Cloud Eureka Server project. To start things off, let's head over\
    \ to start.spring.io, and we're going to use this Spring Initializr to create\
    \ the stub for our project. It's a nice little skeleton creator that saves us\
    \ a lot of time.\n\nIn the `Group` section here, I'm going to put `io.ajay.kumar`,\
    \ and for the `Artifact` I'm going to call it the `discovery-server`. In the dependencies,\
    \ I'm going to add the `Eureka Server`, this is the Discovery Server, and I'm\
    \ also going to add `DevTools` and the `Spring Boot Actuator` project.\n\n![](images/00001.gif)\n\
    \nOnce you've added all dependencies, click the Generate button. After you click\
    \ that Generate button, it's going to automatically download a zip file for you,\
    \ and this contains the stub of our project. Go ahead and unzip the downloaded\
    \ stub project. Then we're going to go ahead and open our IDE and import it. I've\
    \ switched over to my IDE, which is Spring Tool. And on the Package Explorer tab\
    \ in the blank area, right-click and go to `Import`. And you're going to filter\
    \ out the available options by typing in `Existing Maven Projects`. Go ahead and\
    \ click that, click `Next`, browse to the location of the unzipped stub project,\
    \ and click `Open`. Underneath the Projects you should see `pom.xml`. Go ahead\
    \ and click `Finish`.\n\n![](images/00002.jpeg)\n\nOnce the project is finished\
    \ importing, go ahead and expand it and open up the main application class. It\
    \ should be called `DiscoveryServerApplication`, and this is where we're going\
    \ to add the annotation to enable our Discovery Server. So right above this `@SpringBootApplication`\
    \ annotation, we can add a new one, `@EnableEurekaServer`. Go ahead and save that.\n\
    \n```java\npackage io.ajay.kumar.discoveryserver;\n\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.netflix.eureka.server.EnableEurekaServer;\n\
    \n@EnableEurekaServer\n@SpringBootApplication\npublic class DiscoveryServerApplication\
    \ {\n    public static void main(String[] args) {\n        SpringApplication.run(DiscoveryServerApplication.class,\
    \ args);\n    }\n}\n```\n\nWe're now ready to start our Service Discovery Server,\
    \ so go ahead and right-click on the main application class, and go to `Run As`,\
    \ and choose `Spring Boot App`.\n\n![](images/00003.jpeg)\n"
