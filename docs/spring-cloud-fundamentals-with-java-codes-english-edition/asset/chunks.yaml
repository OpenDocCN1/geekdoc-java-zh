    ## Demo: Retrieving Configuration with the Config Client


    In this demo, we''ll see how to use the Spring Cloud Config Client to retrieve
    configuration at startup from the Configuration Server. To get started, head on
    over to start.spring.io. For the Group ID, use io.ajay.kumar. For the Artifact
    name, use config-client-app. For the dependencies, we''re going to want the Config
    Client, of course, we''re going to want Eureka Discovery so that we can use service
    discovery to find the Configuration Server, and we''ll want the Spring Actuator.
    Once you''ve got everything selected, click the Generate Project button. That
    will generate a zip file. Click on that, unzip it, and head over to your IDE.


    ![](images/00024.jpeg)


    Within IntelliJ or Eclipse, right-click on the empty area of the Package Explorer,
    go to Import, search for Existing Maven Projects, choose that, click Next, browse
    to the location of your downloaded zip file, mine''s in Downloads config-client-app,
    hit Open, and click Finish.


    We''re going to be using service discovery to locate the Config Server from the
    Config Client app. So if you haven''t already completed the Service Discovery
    module, you''ll need the Discovery Server and import it into your IDE. It''s pretty
    simple. Next we need to make a couple of modifications to the Config Server so
    that it will register itself with the Discovery Server.


    package io.ajay.kumar.configserver;


    import org.springframework.boot.SpringApplication;


    import org.springframework.boot.autoconfigure.SpringBootApplication;


    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;


    import org.springframework.cloud.config.server.EnableConfigServer;


    @SpringBootApplication


    @EnableConfigServer


    @EnableDiscoveryClient


    public class ConfigServerApplication {


            public static void main(String[] args) {


                    SpringApplication.run(ConfigServerApplication.class, args);


            }


    }


    Expand the config-server and go to the main application class. Underneath the
    @EnableConfigServer add an @EnableDiscoveryClient annotation. Save that, and then
    open up the application.properties in the src/main/resources.


    application.properties :


    server.port=8888


    spring.cloud.config.server.git.uri=https://github.com/ajaycucek/config-repository.git


    spring.application.name=configserver


    eureka.client.server-url.defaultZone=https://localhost:8761/eureka


    We''ll add two different properties. The first one is the spring.application.name,
    and we''re going to set that equal to configserver. No spaces. And then we also
    want to set the location of the Discovery Server so it knows where to register
    itself. So we do eureka.client.server-url.defaultZone, and then we set that to
    localhost:8761/eureka. Next, expand the config-client-app project, and open up
    the main application class. Remember that there''s no special annotation that
    we need to add for the Config Client to get its configuration. As long as the
    libraries are on the class path and the setup is correct, it should be able to
    find the configuration from the Configuration Server.


    package io.ajay.kumar.configclientapp;


    import org.springframework.boot.SpringApplication;


    import org.springframework.boot.autoconfigure.SpringBootApplication;


    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;


    @SpringBootApplication


    @EnableDiscoveryClient


    public class ConfigClientAppApplication {


