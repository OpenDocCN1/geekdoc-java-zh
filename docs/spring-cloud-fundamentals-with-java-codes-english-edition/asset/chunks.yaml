    and it''ll serve them up for you. It''s important to point out that the Config
    Server does not facilitate writing any configuration files, and it''s only mainly
    concerned with serving those configuration files. It has support for various output
    formats, and the default is JSON, but it also supports properties and YAML. The
    Config Server doesn''t need a database to store the configuration, and instead
    it has support for retrieving and reading your configuration files from several
    different back-end storage configurations like Git, which is the default, or SVN,
    or just the plain old filesystem. Another nice feature that the Configuration
    Server supports is it has some notion of configuration scopes. And what I mean
    by that is that you can define global configuration that applies to all applications,
    as well as application-specific configuration or Spring Profile specific configuration.
    Using the Spring Cloud Config Server, like Spring Cloud''s other servers, is very,
    very easy.


    *   pom.xml:


    <dependencyManagement>


        <dependencies>


            <dependency>


    <groupId>org.springframework.cloud</groupId>


    <artifactId>spring-cloud-dependencies</artifactId>


    <version>Camden.SR2</version>


    <type>pom</type>


    <scope>import</scope>


            </dependency>


        </dependencies>


    </dependencyManagement>


    First, in your pom.xml, make sure that you have the spring-cloud-dependencies
    defined within your dependencyManagement section.


    <dependency>


    <groupId>org.springframework.cloud</groupId>


    <artifactId>spring-cloud-config-server</artifactId>


    </dependency>


     Then, still in your pom.xml, in the dependency section, define a new dependency
    on spring-cloud-config-server. Next, create a folder to store all of your configuration
    that you want the Configuration Server to serve up. And in that folder you can
    optionally create an application.properties file or an application.yml file. And
    this file is for a global configuration that should apply to all applications
    and not any one specific application. An example of that would be something like
    your database configuration that is shared across all of your applications. You
    would put it in this application.properties or application.yml file. Next you
    add application and profile-specific configuration files in this folder, and you
    can put them in either properties or YAML format. And you use a special naming
    pattern for the file name, and that''s the application-profile.extension where
    application is the name of your application and profile is the Spring Profile
    that should apply for that configuration. If you''re not using a Spring Profile,
    you can omit the -profile section of the file name and just use the application
    name.file extension. Next you would run git init within your folder that contains
    all of your configuration files. And this example assumes that you''re using the
    default back-end storage, which is Git. And from there you would git add your
    configuration files, git commit them, and then the last step, which is optional,
    but highly recommended, is to set up a remote Git repository and git push the
    configuration up to the remote repository. Now we need to configure the actual
    Configuration Server itself. Now don''t confuse this with the configuration files
    that the Configuration Server will be serving. This is the application configuration
    for the actual Configuration Server.


    application.properties :


    server.port=8888


    spring.cloud.config.server.git.uri=<uri_to_git_repo>


    OR


    application.yml


    server:port: 8888


    spring:cloud:config:server:git:uri: <uri_to_git_repo>


    In the Config Server''s application.properties file, you specify the server.port
    property and give that the value 8888\. This isn''t required, but that port is
    the conventional port that''s used for the Configuration Server. Then you need
    to configure the location of the Git repository that contains all of the configuration
    files that the server will serve. And you do that by specifying the property spring.cloud.config.server.git.uri,
    and then you set that to the location of the Git repository. Now if you''d uploaded
    that to a remote repository, this would be the clone URL of your repository. If
    you prefer to use YAML files for your configuration, I''ve included the equivalent
    application.yml.


    @SpringBootApplication


    @EnableConfigServer


    public class Application{


    public static void main(String[] args){


    SpringApplication.run(Application.class,args);


    }


    }


    The next step is to add the @EnableConfigServer annotation to your main Application
    class. And while you''re in here, if you wanted your Configuration Server to be
    discoverable via service discovery, you could add the Eureka Client dependencies,
    configure the service discovery URL, and add the @EnableDiscoveryClient annotation,
    and then clients would be able to discover the Configuration Server. The last
    step is to ensure that your Configuration Server is set up in a secure fashion.
    And it''s very easy to do that using the Spring Security library. And any of the
    methods that are supported in Spring Security are also supported in securing your
    Configuration Server.


    ## Config Server REST Support: Parameters


    Typically when you''re interacting with the Config Server''s REST endpoints, you''re
    doing so using the Config Client; however, it''s useful to understand the available
    endpoints, at least for debugging purposes and also if you want to use it in another
    language. Each of the available REST endpoints on the Config Server share a common
    set of parameters. And the values of those parameters influence the configuration
    that''s returned.


    *   {application} maps to spring.application.name on client


    *   {profile} maps to spring.profiles.active on client


    *   {label} server side feature to refer to set of config files by name


    The first parameter is the application parameter. And if you''re utilizing the
    Spring Cloud Config Client, it uses the value from the spring.application.name
    property to fill in the value for that application parameter. The next parameter
    is the profile parameter. And again, if you''re using the Spring Cloud Config
    Client, it''s going to pull the value from the spring.profiles.active property
    to fill in the value for that profile parameter. So this translates into the active
    Spring Profile. The last parameter, the label parameter, is a feature for grouping
    your configuration files into kind of arbitrary named sets. And that could mean
    different things depending on the back-end you''re using. So for instance, if
    you''re using Git as a back-end, the label translates to the Git branch. Now take
    a second to look at each of these endpoint parameters, and consider them as a
    whole, and think about how you might combine one or two or all of them together
    to identify a particular configuration.


    ## Config Server REST Support: Endpoints


    By now we should have a good understanding of the purpose of each of the path-based
    parameters that are involved in the REST endpoints. Let''s take a look at the
    actual REST services themselves.


    *   Endpoint :


    *   GET/{application}/{profile}[/{label}]


    *   Example :


    *   /myapp/dev/master


    *   /myapp/prod/v2


    *   /myapp/default'
