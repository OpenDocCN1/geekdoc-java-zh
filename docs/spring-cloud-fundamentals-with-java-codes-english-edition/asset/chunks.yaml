- fmt: "\n's well known that Netflix is a heavy user of AWS. And given that Eureka\
    \ was born at Netflix, it's only fitting that it includes AWS support. Let's take\
    \ a look at the various support, as well as a typical deployment architecture.\
    \ When an application that's using the Eureka Client starts up, it checks to see\
    \ if it's running on an AWS instance. If it is, it calls out to the local metadata\
    \ service and retrieves some metadata about that instance. And it gets things\
    \ that are specific to AWS, such as the Amazon Machine Image that's running or\
    \ what region it's running in or what zone. And then it sends that information\
    \ up to the Discovery Server when it registers. Given the fact that things can\
    \ change so often in AWS, it's important that the Discovery Server be located\
    \ at a well-known location. So Eureka adds support for Elastic IP binding. When\
    \ a Eureka Server starts up and it notices that it's running in AWS, it'll try\
    \ to bind to the next available Elastic IP so that it has a static or well-known\
    \ IP. The Eureka Client is also zone aware with a preference for the zone that\
    \ it's currently running in. So it'll try to contact the Discovery Server in its\
    \ current zone, and if it can't reach one, it'll try the next zone and try to\
    \ find the next available Discovery Server. And last, you can configure the Eureka\
    \ Client to fetch the registry of different remote regions. In order to utilize\
    \ the AWS support, it requires a little bit of extra configuration.\n\n```java\n\
    @Configuration\n\npublic class AppConfig{\n\n    @Bean\n\n    public EurekaInstanceConfigBean\
    \ eurekaInstanceConfig(\n    InetUtilsProperties properties){\n\n    EurekaInstanceConfigBean\
    \ bean=new\n    EurekaInstanceConfigBean(newInetUtils(\n    properties));\n\n\
    \    AmazonInfo info= AmazonInfo.Builder.newBuilder().autoBuild(\n    \"eureka\"\
    );\n\n    bean.setDataCenterInfo(info);\n\n    return bean;\n    }\n}\n```\n\n\
    In your `@Configuration` class, you define a new method that returns a `EurekaInstanceConfigBean`,\
    \ and you annotate that with `@Bean`. And within the method, you create a new\
    \ `EurekaInstanceConfigBean`. Then you create an `AmazonInfo` object using the\
    \ `AmazonInfo.Builder`, and you set the `DataCenterInfo` on the `EurekaInstanceConfigBean`\
    \ to that `AmazonInfo` and then return that bean. If you were to go and look at\
    \ the source of the `AmazonInfo` class, you would see that it's utilizing the\
    \ local metadata service to fill in all of the instance information. In addition\
    \ to the configuration in your `@Configuration` class, there's also some additional\
    \ configuration in your `application.properties`, and that's around configuring\
    \ the availability zones.\n\n### Availability Zones Configuration in application.properties\n\
    \n- `eureka.client.availability-zones.[region]=[az1],[az2],[az3]`\n\nThe property\
    \ is the `eureka.client.availability-zones` property, and the pattern is `eureka.client.availability-zones.region`,\
    \ and then that's equal to a comma-separated list of availability zones.\n\n###\
    \ EC2 Dashboard\n\n![](images/00012.jpeg)\n\nSo for example, if you have the following\
    \ where you have one Discovery Server in the `us-east-1b` zone and another Discovery\
    \ Server in the `us-east-1e` zone, you would set up your property as follows:\
    \ `eureka.client.availability-zones`, and then the region is `us-east-1`, and\
    \ then you would set the comma-separated list of `us-east-1b` and `us-east-1e`.\
    \ Similar configuration is required in the `application.properties` for your service\
    \ URLs.\n\n### Service URL Configuration in application.properties\n\n- `eureka.client.service-url.[zone]=http://[eip-dns]/eureka`\n\
    \nThe property is the `eureka.client.service-url.zone` property, and you set that\
    \ to the HTTP address of the Eureka Instance that's bound to an Elastic IP. And\
    \ you want to make sure, at least as of version 1.4, to use the Elastic IP DNS\
    \ name as the code is specifically aware of the pattern that Elastic IPs use for\
    \ DNS names, and it's looking for that specific pattern to recognize if it's using\
    \ an Elastic IP.\n\n### Elastic IP Dashboard\n\n![](images/00013.jpeg)\n\nIf,\
    \ for instance, we had the following Elastic IPs allocated to us, we could configure\
    \ our `application.properties` as follows: with the first one being the `us-east-1b`\
    \ zone and then second one being the `us-east-1e` zone. And if you'll notice,\
    \ each of those is set to the Elastic IP DNS name for the HTTP address. Following\
    \ along with the previous screenshots of the AWS console and how we configured\
    \ everything, if you were to load up your Eureka Dashboard after setting all of\
    \ that up, it would look like this.\n\n![](images/00014.jpeg)\n\nYou would have\
    \ two instances under your `DS Replicas`, and then you would have two instances\
    \ of Discovery Servers, each in their respective availability zones.\n\n![](images/00015.jpeg)\n\
    \nLikewise, you'd be able to pull up the dashboard on each of those Discovery\
    \ Server instances, and you'd find AWS-specific metadata filled in, like the `instance-type`\
    \ or the `ami-id` or the `instance-id`.\n\n![](images/00016.gif)\n\nNow that we\
    \ have an understanding of the AWS support that exists in Eureka, let's take a\
    \ look at a deployment architecture. Typically you would have one or more Discovery\
    \ Servers per each availability zone, and then you'd have multiple availability\
    \ zones. And within each of those zones, you would have one Elastic IP for each\
    \ of the Discovery Servers. Then you would typically have an auto scaling group\
    \ set up that evenly distributes those Discovery Servers across the availability\
    \ zones.\n\n## Summary\n\nWe've reached the end of this module, so let's quickly\
    \ go over what we learned. We started off by taking a look at what service discovery\
    \ is and why it's important. Then we learned how to use the Spring Cloud Eureka\
    \ Client to discover services and the Spring Cloud Eureka Server to store a registry\
    \ of services so that others could discover them. Then we took a quick look at\
    \ the Spring Cloud Eureka Dashboard and saw an insight into the Spring Cloud Eureka\
    \ Server. From there, we talked about health checks, high availability, and configuring\
    \ Spring Cloud Eureka. And we finished off by looking at the AWS specific support.\n"
