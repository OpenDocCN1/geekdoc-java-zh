  trans: "\n\n## 使用 `@LoadBalanced` 注解\n\n开始并创建一个负载均衡的 `RestTemplate` 非常简单。\n\n###\
    \ 创建负载均衡的 RestTemplate\n\n```java\n@Configuration\n\npublic class MyConfiguration{\n\
    \n    @Bean\n    @LoadBalanced\n    public RestTemplate restTemplate(){\n\n  \
    \      return new RestTemplate();\n    }\n}\n```\n\n在你的 `@Configuration` 类中，你定义了一个带有\
    \ `@Bean` 注解的新方法，该方法返回一个新的 `RestTemplate`。然后，在该方法上加上 `@LoadBalanced` 注解。这样做是告诉\
    \ Spring 该 `RestTemplate` 应该支持负载均衡。背后的意思是返回的 `RestTemplate` 实际上包含一个拦截器（一个 `RestTemplate`\
    \ 拦截器），该拦截器利用 `Ribbon` 负载均衡客户端来实际调用我们的服务并在不同的实例之间平衡负载。默认情况下，它将使用轮询算法来分配负载。接下来，让我们看看如果你在尝试调用服务并使用服务发现，该如何使用这个负载均衡的\
    \ `RestTemplate`。\n\n### 在服务发现中使用负载均衡的 RestTemplate\n\n假设 `my-service` 是运行在 `mycompany.com`\
    \ 端口 `9000` 上的服务名称，并且可以通过服务发现发现。有 2 个实例正在运行。\n\n与其使用 `restTemplate.getForEntity(\"\
    http://mycompany.com:9000/u/1\",...)` 或 `restTemplate.getForEntity(\"http://128.168.10.10:9000/u/1\"\
    ,...)`\n\n不如像这样使用 `RestTemplate`：`restTemplate.getForEntity(\"http://my-service/u/1\"\
    ,...)`\n\n假设你有两个名为 `my-service` 的服务实例运行在 `mycompany.com` 多个服务器的 `9000` 端口上。同时假设\
    \ `my-service` 可以通过服务发现被发现。与其向 `RestTemplate` 传递 `mycompany.com` 的 URL 或 IP 地址，你实际上可以传递一个使用逻辑标识符来表示服务的\
    \ URL。在这种情况下，我们使用了逻辑标识符 `my-service`。这与该服务在服务发现服务器上注册的名称相同。在运行时，`RestTemplate`\
    \ 将作为客户端负载均衡器工作。由于它将使用服务发现来解析 `my-service` 实例的真实位置，然后使用配置的负载均衡算法在它们之间分配负载。\n\n\
    ## Demo：使用 Ribbon 和服务发现进行负载均衡\n\n在本次演示中，我们将设置一个利用服务发现的 `Ribbon` 客户端，并在服务的多个多个实例之间平衡请求。由于我们将使用服务发现来定位服务的实例，我们需要设置一个服务发现服务器。如果你一直在跟着课程之前的模块操作，那么你应该已经在\
    \ IDE 中设置好了发现服务器。一旦设置好发现服务器，我们就可以开始了。打开浏览器并访问 start.spring.io。在 Group（分组）部分，将其更改为\
    \ `io.ajay.kumar`。对于 artifact 的名称，我们将命名为 `ribbon-time-service`。在 Dependencies（依赖）部分，添加\
    \ Web 依赖和 Eureka Discovery 依赖。\n\n![](img/00036.gif)\n\n一旦填写完所有内容，点击 Generate\
    \ Project 按钮，它将为你创建并下载一个 zip 包。仍在 SPRING INITIALIZR 页面上，将 artifact 名称从 `ribbon-time-service`\
    \ 更改为 `ribbon-tie-app`。然后，在 Dependencies 部分，添加对 `Ribbon` 的新依赖。\n\n![](img/00037.gif)\n\
    \n再次，一旦填写完所有内容，点击 Generate Project 按钮，那将为你创建并下载一个 zip 包。解压这两个 zip 文件并回到你的 IDE。我已经导入了\
    \ `ribbon-time-service` 和 `ribbon-time-app`。在 Package Explorer 的空白区域点击右键，转到 Import，选择\
    \ Existing Maven Projects，点击 Next，点击 Browse，浏览到下载的 zip 包所在位置，点击 Open，然后点击 Finish。我们将先处理\
    \ `ribbon-time-service`，因此展开项目并打开主应用程序类。\n\n![](img/00038.gif)\n\n在主应用程序类中，添加两个注解：`@RestController`\
    \ 注解和 `@EnableDiscoveryClient` 注解。\n\n```java\npackage io.ajay.kumar.ribbontimeservice;\n\
    \nimport java.util.Date;\nimport org.springframework.beans.factory.annotation.Value;\n\
    import org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;\nimport\
    \ org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\
    \n@RestController\n@EnableDiscoveryClient\n@SpringBootApplication\npublic class\
    \ RibbonTimeServiceApplication {\n\n    @Value(\"${server.port}\")\n    private\
    \ int port;\n\n    public static void main(String[] args) {\n        SpringApplication.run(RibbonTimeServiceApplication.class,\
    \ args);\n    }\n\n    @GetMapping\n    public String getTime() {\n        return\
    \ \"The current time is \"+ new Date().toString() + \"(answered by service running\
    \ on \"+port+\")\";\n    }\n}\n```\n\n然后我们需要添加一个请求处理方法，所以按几次回车键并输入 `public String\
    \ getTime()`。我们将为它加上快捷注解 `@GetMapping`，这只是一个 GET 请求的映射。然后，在方法体中，我们将返回 `The current\
    \ time is`，并创建一个新的 `Date` 对象将其转换为字符串。为了演示的目的，我们想知道是哪个实例在响应请求。目前我们没有办法判断。我们无法区分它们。因此，我们将对响应进行一项添加。我们将说\
    \ `+ answered by service running on`，然后我们有一个 `port` 变量，然后关闭括号。由于我们的每个服务必须运行在不同的端口上，我们可以区分每一个。所以让我们确保我们定义了该端口变量。回到这里并添加\
    \ `private int port`，然后我们为它加上 `@Value` 注解。我们将使用 `server.port` 变量注入它。在启动之前，我们需要在\
    \ `application.properties` 中配置一些属性。所以关闭该文件并打开 `src/main/resources` 并打开 `application.properties`\
    \ 文件。\n\n```properties\nspring.application.name=time-service\neureka.client.service-url.defaultZone=http://localhost:8761/eureka\n\
    ```\n\n"
- fmt: "\nIn `application.properties`, we're going to set two properties. The first\
    \ one is the `spring.application.name` property, and we're going to set that to\
    \ `time-service`. And the second property we'll set is to configure the location\
    \ of the Service Discovery Server, so `eureka.client.service-url.defaultZone`.\
    \ And then we'll set that to `localhost:8761/eureka`. We now have everything we\
    \ need to start the `ribbon-time-service`, so we can go ahead and close this and\
    \ minimize this.\n\nThe first thing we'll want to do is start the discovery server.\
    \ So expand the `discovery-server` project and navigate to the main application\
    \ class. Right-click on the main application class, and go `Run As`, `Spring Boot\
    \ App`. Go ahead and minimize the `discovery-server` and expand the `ribbon-time-service`,\
    \ and navigate to the main application class, right-click on it, and go to `Run\
    \ As`, and then choose `Run Configurations`.\n\nSince we're starting up two instances\
    \ of the `ribbon-time-service`, we need to configure two different run configurations.\
    \ So if you come up here to the `New launch configuration` button, click that,\
    \ and it'll create a new run configuration for you. We'll rename this to `ribbon-time-service-1`.\
    \ And then for the `Project`, we'll make sure that we choose the `ribbon-time-service`,\
    \ and for the `Main type`, hit `Search` and locate the `RibbonTimeServiceApplication`.\n\
    \nIn the `Override properties` section, we'll set the `server.port`, and we'll\
    \ set that to `4444`. And click `Apply`, and then we're going to duplicate this\
    \ configuration and change the server port from all 4s to all 5s. So come up here\
    \ to the `Duplicate configuration` button, click that, change the name from `ribbon-time-service-1`\
    \ to `-2`, and change the port from all 4s to all 5s.\n\nOnce you've got everything\
    \ configured, you can highlight the `ribbon-time-service-1` and click `Run`. And\
    \ then for the second instance, right-click on the main application class, go\
    \ to `Run As`, locate `Run Configurations`, highlight the `ribbon-time-service-2`,\
    \ and click `Run`. Just to make sure everything's running correctly, open up a\
    \ browser and visit `localhost:4444`.\n\n![](images/00039.jpeg)\n\nAnd do the\
    \ same, but change those 4s to all 5s.\n\n![](images/00040.jpeg)\n\nYou should\
    \ get a response from each of the services with the current time and then the\
    \ current time and answered by service and whatever the respective port is. We\
    \ can also quickly check that each of the services registered itself with the\
    \ Service Discovery Server. So open up a new tab and visit `localhost:8761`.\n\
    \n![](images/00041.gif)\n\nIf you scroll down under the heading Instances currently\
    \ registered with Eureka, you'll see the application `TIME-SERVICE`, and you'll\
    \ see that there are two instances. They're both `UP`. One of them is running\
    \ on all 5s and another is running on all 4s.\n\nAnd we're back within the IDE,\
    \ and so far all we've done is we've set up multiple instances of the `ribbon-time-service`\
    \ and had each of them register with the Service Discovery Server. We're now ready\
    \ to start developing the piece where we'll use `Ribbon` to load balance between\
    \ each of the instances of the `ribbon-time-service`.\n\nIn the `Package Explorer`\
    \ under the `ribbon-time-app`, expand it and navigate to the main application\
    \ class. Go ahead and expand the main application class just to give us a little\
    \ bit more room. Just like we did with the `ribbon-time-service`, we'll add two\
    \ annotations: first, the `@RestController` annotation, and second, the `@EnableDiscoveryClient`\
    \ annotation. Next we'll inject a `RestTemplate`, so `private RestTemplate`, and\
    \ make sure you annotate it with `@Inject`. And there's nothing right now that's\
    \ providing this `RestTemplate`, so we're going to create a method that will return\
    \ that new `RestTemplate` as a load balance `RestTemplate`. So if you come down\
    \ here below the `main`, do `public RestTemplate()`. Then within the body of the\
    \ method, you're going to return `new RestTemplate`. And then annotate this with\
    \ `@Bean` and `@LoadBalanced`.\n\nNow we need one more method, and that's the\
    \ `RequestMapping` method, to actually handle the request for our `ribbon-time-app`.\
    \ So come up here and do `public String getTime()`, and we'll annotate this with\
    \ the shortcut mapping again, so `@GetMapping`. And then within the body of the\
    \ method, we're going to use the `RestTemplate` to call our `time-service` and\
    \ return the result. So we'll say `return restTemplate.getForEntity`. And we'll\
    \ say `http://`, and remember we use a logical identifier here, so we'll say `time-service`.\
    \ And we'll say that the return type is a string and then make sure that we call\
    \ `getBody()` on the response.\n\nWe're now ready to start up our `ribbon-time-app`\
    \ and give it a run. So let's unmaximize this and right-click on the main application\
    \ class, go to `Run As`, and choose `Spring Boot App`. Next, fire up a browser\
    \ and visit `localhost:8080`.\n\n![](images/00042.jpeg)\n\nAnd you can see the\
    \ response from the service running with the port on all 4s. And if we refresh\
    \ that, we'll see the one running on the port with all 5s.\n\n![](images/00043.jpeg)\n\
    \nAnd we can continue to refresh that, and we'll see that it alternates between\
    \ each of the instances in a round-robin fashion.\n\n## Using the @RibbonClient\
    \ Annotation\n\nNow let's take a look at the other annotation, the `@RibbonClient`\
    \ annotation. First we'll see how to use this annotation along with the `@LoadBalanced`\
    \ annotation to achieve client-side balancing without service discovery.\n\n```java\n\
    @Configuration\n@RibbonClient(name=\"service\")\npublic class MyConfiguration{\n\
    \    ...\n}\n```\n\nIn your `@Configuration` class, define `@RibbonClient` and\
    \ set the name element to a meaningful value. You'll actually refer to this value,\
    \ as well as the URL of the `RestTemplate`.\n\n`application.properties`\n```properties\n\
    ribbon_client_name.ribbon.eureka.enabled=false\nribbon_client_name.ribbon.listOfServers=localhost:9000,localhost:9001\n\
    ```\n\nOR\n\n`application.yml`\n```yaml\nribbon_client_name:\n  ribbon:\n    eureka:\
    \ false\n    listOfServers: localhost:9000,localhost:9001\n```\n\nReplace `<ribbon_client_name>`\
    \ with the name you set on `@RibbonClient`. Then, in your `application.properties`\
    \ or your `application.yml`, define two new properties. You'll prefix each of\
    \ your properties with that value. So the first property, `ribbon_client_name.ribbon.eureka.enabled=false`,\
    \ tells Ribbon to disable service discovery. The next property, `ribbon_client_name.ribbon.listOfServers`,\
    \ is a comma-separated list of URLs that Ribbon should use to distribute the requests\
    \ among. And in this case, we've set the different addresses, one running on port\
    \ 9000 and the other running on port 9001.\n\nOnce you have everything configured,\
    \ you can use `RestTemplate` just like you did with service discovery. Except\
    \ this time instead of calling the service name, you use the value of the name\
    \ element that you set up in the `@RibbonClient` annotation.\n\n```java\nreturn\
    \ restTemplate.getForEntity(\"http://service/\", String.class).getBody();\n```\n\
    \n## Demo: Load Balancing Using Ribbon Without Service Discovery\n\nIn this demo,\
    \ we'll learn how to utilize the Ribbon client without service discovery. Now,\
    \ we're going to build on the previous demo that we did utilizing service discovery\
    \ as each of the demos share a lot in common. The thing we'll do is expand the\
    \ `ribbon-time-service` and open up the main application class. In the main application\
    \ class, remove the `@EnableDiscoveryClient` annotation.\n\n```java\npackage io.ajay.kumar.ribbontimeservice;\n\
    \nimport java.util.Date;\n\nimport org.springframework.beans.factory.annotation.Value;\n\
    import org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;\nimport\
    \ org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\
    \n@RestController\n@SpringBootApplication\npublic class RibbonTimeServiceApplication\
    \ {\n\n    @Value(\"${server.port}\")\n}\n"
