    \ 实现，它也是一种轮询算法，但它会根据每个实例的平均响应时间动态分配权重。还有一个 `RandomRule` 实现，它只是随机选择一个实例来发送流量。还有\
    \ `ZoneAvoidanceRule`，它也是一个轮询算法实现；然而，它会根据 AWS 区域和可用性过滤掉发送流量的服务器。让我们来看一个例子让它变得更具体。\n\
    \n```java\n@Configuration\npublic class OtherServiceConfig{\n    @Bean\n    public\
    \ IRule ribbonRule(){\n        return new RoundRobinRule();\n    }\n}\n```\n\n\
    例如，如果我们想覆盖默认的 `IRule` 以使用 `RoundRobinRule` 实现，我们需要定义一个带有 `@Bean` 注解的新方法，并返回一个新的\
    \ `RoundRobinRule`。\n\n## 自定义你的 RibbonClient 配置：IPing Bean\n\n`IPing` Bean 负责选择策略来检查被负载均衡的给定实例的存活或可用性。就像\
    \ `IRule` Bean 一样，你也可以实现自己的自定义 `IPing` 实现，或者从几个不同的默认实现中进行选择。让我们来看看有哪些可用选项。\n\n\
    * `IPingImplementations`\n* `DummyPing`\n* `PingUrl`\n* `NIWSDiscoveryPing`\n\n\
    有一个 `DummyPing` 实现，它就像名字听起来一样“傻”。当被询问服务的存活情况时，它始终返回 `true`。如果你根本不在乎检查存活或可用性，并且无论如何都想向所有实例发送流量，就可以使用它。有一个\
    \ `PingUrl` 实现，它允许你设置一个期的响应，然后对服务进行实际 HTTP 调用并检查结果。因此，你通常会将它指向类似服务的健康检查 URL。然后是\
    \ `DiscoveryPing` 实现，如果你使用像 Eureka 服务发现这样的工具，它将自动为你配置。它的作用是只需咨询发现客户端来确定任何特定实例的存活状态。再次，让我们来看一个例子让它变得更具体。\n\
    \n### IPing：存活检查\n\n```java\n@Configuration\npublic class OtherServiceConfig{\n\
    \    @Bean\n    public IPing ribbonPing(){\n        PingUrl pingUrl=new PingUrl();\n\
    \        pingUrl.setExpectedContent(\"true\");\n        return pingUrl;\n    }\n\
    }\n```\n\n所以，就像我们处理 `IRule` 实现时一样，你会定义一个带有 `@Bean` 注解的新方法，然后返回你选择的实现。在这种情况下，我们将返回一个\
    \ `PingUrl`。所以我们创建一个 `PingUrl` 的新实例，将预期内容设为 `true`，然后返回该实例。\n\n## 演示：自定义 RibbonClient\
    \ 负载均衡策略\n\n在本次演示中，我们将学习如何自定义我们用于调用 `ribbon-time-service` 的 Ribbon 客户端。再次，我们将在之前的演示的基础上进行构建。因此，请确保你已经完成了不使用服务发现设置\
    \ Ribbon 的演示。我们要做的第一件事是来到这里的绿色播放按钮，并启动 `ribbon-time-service` 的每个实例。两个 `ribbon-time-service`\
    \ 实例都启动了。现在记住，为了为 Ribbon 创建自定义配置，我们需要创建自己的 `@Configuration` 类。打开 `ribbon-time-app`\
    \ 项目并创建一个新包。右键点击，New，然后选择 Package。我们实际上会将此包名从 `io.ajay.kumar` 重命名为 `io.ajay.config.kumar`。记住，我们想要一个不同的包名，这样\
    \ `@Configuration` 类就不会受到组件扫描的影响；否则，它将应用于我们所有的 Ribbon 客户端。在新包中，右键点击进入 New 并选择\
    \ Class。我们将此命名为 `RibbonTimeConfig` 类。点击 Finish。\n\n```java\npackage io.ajay.config.kumar;\n\
    \nimport org.springframework.context.annotation.Bean;\nimport org.springframework.context.annotation.Configuration;\n\
    import com.netflix.loadbalancer.IRule;\nimport com.netflix.loadbalancer.RandomRule;\n\
    \n@Configuration\npublic class RibbonTimeConfig {\n    @Bean\n    public IRule\
    \ ribbonRule() {\n        return new RandomRule();\n    }\n}\n```\n\n然后我们当然要为这个类加上\
    \ `@Configuration` 注解。在本次演示中，我们将自定义负载均衡策略。所以我们来到这里并定义一个新的 `IRule`。我们写下 `public\
    \ IRule`，并将其命名为 `ribbonRule`。在方法体中，我们写下 `return new RandomRule`。这将随机选择一个实例发送流量，而不是像我们之前使用的那样在每个实例之间进行均衡。最后，确保不要忘记向我们的方法添加\
    \ 防止 Bean` 注解。我们完成了，现在可以关闭这个。打开 `RibbonTimeApplication`。\n\n```java\n@RestController\n\
    @RibbonClient(name = \"time-service\", configuration=RibbonTimeConfig)\n@SpringBootApplication\n\
    public class RibbonTimeApplication {\n    @Inject\n    private RestTemplate restTemplate;\n\
    \n    public static void main(String[] args) {\n        SpringApplication.run(RibbonTimeApplication.class,\
    \ args);\n    }\n\n    @GetMapping\n    public String getTime() {\n        return\
    \ restTemplate.getForEntity(\"http://time-service\", String.class).getBody();\n\
    \    }\n\n    @Bean\n    @LoadBalanced\n    public RestTemplate restTemplate()\
    \ {\n        return new RestTemplate();\n    }\n}\n```\n\n在 `RibbonClient` 注解上添加一个新的配置元素，并将其设置为我们设置的自定义配置类\
    \ `RibbonTimeConfig`。我们现在准备好启动应用程序并测试我们的自定义配置了。关闭这里，右键点击主应用程序类，选择 Run As -> Spring\
    \ Boot App。打开浏览器并访问 `localhost:8080`。\n\n正如你看到的，我们收到了来自端口全为 5 的实例的响应。如果我们刷新页面，将会看到来自全为\
    \ 4 的实例的响应。\n\n但如果我们继续刷新，会发现它不再像以前那样在每个实例之间均匀均衡。\n\n## 总结\n\n我们已经到了本模块的结束，让我们快速回顾一下我们学到的内容。\n\
    \n* 客户端与服务器端负载均衡的区别\n* Netflix Ribbon\n* @LoadBalanced & @RibbonClient\n* 有无服务发现\n\
    * 自定义 Ribbon 客户端\n\n我们首先讨论了什么是负载均衡，以及客户端与服务器端负载均衡的区别。然后我们引入了 Netflix Ribbon 项目，并学习了如何使用\
    \ `@LoadBalanced` 和 `@RibbonClient` 注解在有无服务发现的情况下设置客户端负载均衡。在最后部分，我们查看了如何使用 `@RibbonClient`\
    \ 注解配合独立的 `@Configuration` 类来为特定的 Ribbon 客户端设置自定义配置。\n"
