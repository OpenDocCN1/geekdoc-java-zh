    \ 执行的一样，我们想要删除这个 `@EnableDiscoveryClient`。现在我们将添加一个新注解，即 `@RibbonClient` 注解，并将\
    \ `name` 元素设置为字符串 `time-service`。这与我们使用服务发现时使用的 `time-service` 是同一个，我们将以几乎相同的方式使用它。我们将在\
    \ `RestTemplate` 的 URL 中将其作为逻辑服务标识符进行引用，然后在配置中配置代表该服务的特定实例。现在关闭此文件并打开我们的 `/src/main/resources`\
    \ 和我们的 `application.properties`。\n\n### application.properties\n```properties\n\
    time-service.ribbon.eureka.enabled=false\ntime-service.ribbon.listOfServers=http://host:4444,\
    \ http://host:5555\n```\n\n在我们的 `application.properties` 中，我们将为所有用于配置 Ribbon 客户端的属性加上\
    \ Ribbon 客户端的名称前缀。在本例中，我们使用 `time-service`。因此我们将写下 `time-service-ribbon-eureka-enabled=false`。这就是告诉\
    \ Ribbon 不要使用服务发现的属性。我们还有一个 `time-service.ribbon.listOfServers=http://host:4444,\
    \ http://host:5555`。为了确保我们的 `ribbon-time-service` 实例启动正常，让我们进行快速的检查。访问 `localhost:4444`，它在那里运行。然后打开一个新标签页访问\
    \ `localhost:5555`，它也在那里运行。所以我们的 `ribbon-time-service` 一切都正常了。\n\n"
- fmt: "\nThere's the `RoundRobinRule` implementation, which is just like it sounds,\
    \ an implementation of the round-robin balancing algorithm, which distributes\
    \ the workload evenly among all instances. There's the `ResponseTimeWeightedRule`\
    \ implementation, which is also a round-robin algorithm, but it dynamically assigns\
    \ weights based on the average response time from each of the instances. There's\
    \ the `RandomRule` implementation, which simply picks an instance to send traffic\
    \ to at random. And there's the `ZoneAvoidanceRule`, which is also a round-robin\
    \ algorithm implementation; however, it filters out servers to send traffic to\
    \ based on the AWS zone and availability. Let's look at an example to make this\
    \ a bit more concrete.\n\n```java\n@Configuration\npublic class OtherServiceConfig{\n\
    \    @Bean\n    public IRule ribbonRule(){\n        return new RoundRobinRule();\n\
    \    }\n}\n```\n\nIf, for instance, we wanted to override the default `IRule`\
    \ to use the `RoundRobinRule` implementation, we'd define a new method annotated\
    \ with the `@Bean` annotation, and we'd return a new `RoundRobinRule`.\n\n## Customizing\
    \ Your RibbonClient Configuration: The IPing Bean\n\nThe `IPing` bean is responsible\
    \ for choosing the strategy to check the liveliness or the availability of a given\
    \ instance that's being load balanced. Just like the `IRule` bean, you can also\
    \ implement your own custom `IPing` implementations, or you can choose from one\
    \ of the several different defaults. Let's take a look at what's available.\n\n\
    * `IPingImplementations`\n* `DummyPing`\n* `PingUrl`\n* `NIWSDiscoveryPing`\n\n\
    There's the `DummyPing` implementation, which is just as dumb as it sounds. It's\
    \ simply always returning `true` when it's asked about the liveliness of a service.\
    \ You'd use this if you simply don't care to check the liveliness or the availability\
    \ and you always want to send traffic to all of the instances regardless. There's\
    \ the `PingUrl` implementation, which is an implementation that allows you to\
    \ set an expected response and then makes an actual HTTP call to the service and\
    \ checks the result. So you'd typically point this at something like the service's\
    \ health check URL. And then there's the `DiscoveryPing` implementation, which\
    \ would be something that would be automatically configured for you if you were\
    \ using something like Eureka service discovery. And what this would do is it\
    \ would just consult with the discovery client to determine the liveliness of\
    \ any particular instance. Again, let's look at an example to make this a bit\
    \ more concrete.\n\n### IPing: Liveliness Check\n\n```java\n@Configuration\npublic\
    \ class OtherServiceConfig{\n    @Bean\n    public IPing ribbonPing(){\n     \
    \   PingUrl pingUrl=new PingUrl();\n        pingUrl.setExpectedContent(\"true\"\
    );\n        return pingUrl;\n    }\n}\n```\n\nSo just like we did with the `IRule`\
    \ implementation, you would define a new method annotated with the `@Bean` annotation,\
    \ and then you return the implementation of your choice. So in this case, we're\
    \ going to return a `PingUrl`. So we create a new instance of the `PingUrl`, we\
    \ set the expected content to `true`, and then return that instance.\n\n## Demo:\
    \ Customizing the RibbonClient Load Balancing Strategy\n\nIn this demo, we'll\
    \ learn how to customize our Ribbon client that we're using to call the `ribbon-time-service`.\
    \ And again, we're going to be building on the previous demo. So make sure that\
    \ you've completed the demo where you set up a Ribbon client without using service\
    \ discovery. The first thing we'll do is we'll come up here to the green Play\
    \ button and start each of the instances of the `ribbon-time-service`. Both of\
    \ the `ribbon-time-service` instances are started. Now remember, in order to create\
    \ custom configuration for a Ribbon client, we need to create our own `@Configuration`\
    \ class. Let's open the `ribbon-time-app` project and create a new package. So\
    \ right-click, New, and come here to Package. And we're actually going to rename\
    \ this from `io.ajay.kumar` to `io.ajay.config.kumar`. Remember that we want to\
    \ have a different package name so that the `@Configuration` class isn't subject\
    \ to component scanning; otherwise, it would apply to all of our Ribbon clients.\
    \ In the new package, right-click and go to New and choose Class. And we'll call\
    \ this our `RibbonTimeConfig` class. Go ahead and click Finish.\n\n```java\npackage\
    \ io.ajay.config.kumar;\n\nimport org.springframework.context.annotation.Bean;\n\
    import org.springframework.context.annotation.Configuration;\nimport com.netflix.loadbalancer.IRule;\n\
    import com.netflix.loadbalancer.RandomRule;\n\n@Configuration\npublic class RibbonTimeConfig\
    \ {\n    @Bean\n    public IRule ribbonRule() {\n        return new RandomRule();\n\
    \    }\n}\n```\n\nThen we're going to annotate this class, of course, with `@Configuration`.\
    \ And then for this demo, we're going to customize the load balancing strategy.\
    \ So we'll come down here and we'll define a new `IRule`. So we'll say `public\
    \ IRule`, and we'll call this `ribbonRule`. And then in the body of the method,\
    \ we'll say `return new RandomRule`. And what this will do is it'll pick a random\
    \ instance to send traffic to as opposed to what we were using before where we\
    \ were evenly balancing between each of the instances. And last, make sure that\
    \ we don't forget to add the `@Bean` annotation to our method. We're done with\
    \ our custom configuration, so we can go ahead and close that. And then we can\
    \ open up the main `RibbonTimeApplication`.\n\n```java\n@RestController\n@RibbonClient(name\
    \ = \"time-service\", configuration=RibbonTimeConfig.class)\n@SpringBootApplication\n\
    public class RibbonTimeAppApplication {\n    @Inject\n    private RestTemplate\
    \ restTemplate;\n\n    public static void main(String[] args) {\n        SpringApplication.run(RibbonTimeAppApplication.class,\
    \ args);\n    }\n\n    @GetMapping\n    public String getTime() {\n        return\
    \ restTemplate.getForEntity(\"http://time-service\", String.class).getBody();\n\
    \    }\n\n    @Bean\n    @LoadBalanced\n    public RestTemplate restTemplate()\
    \ {\n        return new RestTemplate();\n    }\n}\n```\n\nAnd on the `RibbonClient`\
    \ annotation, add a new configuration element, and set it to the custom configuration\
    \ class that we set up, the `RibbonTimeConfig` class. We're now ready to start\
    \ up our application and try out our custom configuration. So go ahead close this\
    \ and right-click on the main application class, go to Run As, and choose Spring\
    \ Boot App. Go ahead and fire up a browser and visit `localhost:8080`.\n\n![](images/00044.jpeg)\n\
    \nAnd, as you can see, we got a response from the instance running with the port\
    \ that's all 5s. And if we refresh that, we'll see that we get an instance with\
    \ all 4s.\n\n![](images/00045.jpeg)\n\nBut if we continue to refresh it, we'll\
    \ see that it doesn't evenly balance between each of the instances like it did\
    \ before and instead picks them at a random interval.\n\n## Summary\n\nWe're at\
    \ the end of this module, so let's quickly go over what we learned.\n\n* Differences\
    \ between client-side & server-side load balancing\n* Netflix Ribbon\n* @LoadBalanced\
    \ & @RibbonClient\n* With & without service discovery\n* Custom Ribbon client\
    \ configuration\n\nWe first talked about what is load balancing and what are the\
    \ differences between client-side load balancing and server-side load balancing.\
    \ Then we introduced the Netflix Ribbon project and learned how to use the `@LoadBalanced`\
    \ and the `@RibbonClient` annotations to set up client-side load balancing with\
    \ and without service discovery. In the last section, we saw how we could use\
    \ the `@RibbonClient` annotation with a separate `@Configuration` class to set\
    \ up custom configuration for a specific Ribbon client.\n"
