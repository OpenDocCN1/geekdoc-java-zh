  trans: "\n\nSpring Cloud 项目获取了 Netflix 的开源项目，并添加了一些 Spring 和 Spring Boot 的特性。如果可以，它们对这些项目进行了“Spring\
    \ 化”处理。由此此诞生的就是 Spring Cloud Netflix 项目。与 Spring Cloud 项目类似，Spring Cloud Netflix\
    \ 项目本身实际上并不是一个独立的项目，而是一系列项目的集合。对于服务发现，我们关注其中两个项目：Spring Cloud Netflix Eureka Server\
    \ 和 Spring Cloud Netflix Eureka Client。\n\n## 涉及服务发现的关键组件\n\n在我们深入研究 Spring Cloud\
    \ Eureka Server 和 Client 之前，了解参与服务发现的关键组件以及它们如何相互作用将很有帮助。至少参与服务发现的有三个组件：发现服务器（Discovery\
    \ Server）、应用程序服务（application service）和应用程序客户端（application client）。全面理解所有组件如何协同工作非常有帮助，从那里我们将深入研究每个组件，并查看\
    \ Spring Cloud 如何帮助我们实现这些特定的组件。\n\n1. (1) 服务注册位置\n2. (2) 客户端查找服务位置\n3. (3) 发现服务器返回位置\n\
    4. (4) 客户端在位置请求服务\n5. (5) 服务发送响应\n\n首先发生的是应用程序服务的启动。当它启动时，它会调用发现服务器并注册自己。它告诉发现服务器它的位置、端口以及其他服务可以使用来找到它的服务标识符。在稍后的某个点，客户端需要调用该应用程序服务，但它不知道服务的位置和端口，因此它需要询问发现服务器。它向发现服务器发送请求，并带上服务标识符。发现服务器根据该服务标识符知道你请求的是哪个服务，并返回该服务的位置和端口。从那里开始，一切正常进行，客户端可以请求服务及其位置，而服务可以返回数据。\n\
    \n## 发现服务器\n\n我们将深入研究服务发现的每个关键组件，并将从发现服务器开始。发现服务器的核心是一个主动管理的服务位置注册表。它负责允许其他能够发现服务，并允许服务自行注册和注销。可以认为，它是真理之源（source\
    \ of truth）。你通常会运行多个发现服务器实例，因为它是定位所有其他服务的关键组件。如果你无法定位其他服务，你就无法调用其他服务。因此，这是整个架构中重要的一部分。你可以在\
    \ Spring Cloud Eureka Server 项目中找到发现服务器的实现。在整本书中，我们将进行非常简单的演示，一些易于设置并巩固概念。在这个示例中，我们将学习如何使用\
    \ Spring Cloud 创建发现服务器。我将详细说明每个步骤，然后跟进一个真实示例。使用 Spring Cloud Eureka Server 项目创建发现服务器非常简单。事实上，它简单得几乎令人尴尬。\n\
    \n### `pom.xml`\n\n```xml\n<dependencyManagement>\n    <dependencies>\n      \
    \  <dependency>\n            <groupId>org.springframework.cloud</groupId>\n  \
    \          <artifactId>spring-cloud-dependencies</artifactId>\n            <version>Camden.SR2</version>\n\
    \            <type>pom</type>\n            <scope>import</scope>\n        </dependency>\n\
    \    </dependencies>\n</dependencyManagement>\n```\n\n在你的 Maven 项目的 `pom.xml`\
    \ 中，在 `dependencyManagement` 部分定义一个名为 `spring-cloud-dependencies` 的新依赖，并确保它的类型为\
    \ `pom` 且范围为 `import`。\n\n```xml\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
    \    <artifactId>spring-cloud-starter-eureka-server</artifactId>\n</dependency>\n\
    ```\n\n同样在 `pom.xml` 中，定义一个新依赖 `spring-cloud-starter-eureka-server`。并确保将其置于 `dependency`\
    \ 部分中，而不是 `dependencyManagement` 部分。\n\n### `Application.properties`\n\n```properties\n\
    spring.application.name=discovery-server\n```\n\n或者\n\n### `Application.yml`\n\
    \n```yaml\nspring:\n  application:\n    name: discovery-server\n```\n\n在你的 `application.properties`\
    \ 或 `application.yml` 中，定义一个新属性 `spring.application.name`。你可以给它任何你想要的值。在我们的案例中，我们将使用\
    \ `discovery-server`。\n\n```java\n@SpringBootApplication\n@EnableEurekaServer\n\
    public class Application{\n    public static void main(String[]args){\n      \
    \  SpringApplication.run(Application.class,args);\n    }\n}\n```\n\n然后，在你的主 `Application`\
    \ 类中，你只需要定义一个注解。它就是 `@EnableEurekaServer`。就这么简单。一旦你启动此应用程序，你将有一个运行中的发现服务器实例。\n\
    \n## 演示：设置服务发现服务器\n\n在这个演示中，我们将使用 Spring Cloud Eureka Server 项目创建并启动我们自己的服务发现服务器。为了开始工作，让我们前往\
    \ start.spring.io，我们将使用这个 Spring Initializr 来为我们的项目创建存根。它是一个很好的骨架创建器，可以为我们节省大量时间。\n\
    \n在这里的 `Group` 部分，我将放入 `io.ajay.kumar`，对于 `Artifact`，我将其命名为 `discovery-server`。在依赖中，我将添加\
    \ `Eureka Server`，这是发现服务器，我还将添加 `DevTools` 和 `Spring Boot Actuator` 项目。\n\n![](img/0001.gif)\n\
    \n添加所有依赖后，点击 Generate 按钮。点击按钮后，它会自动为你下载一个 zip 文件，其中包含了项目的存根。去解压下载的项目。然后我们将打开 IDE\
    \ 并导入它。我已经切换到了 IDE，即 Spring Tool。在 Package Explorer 标签页的空白区域右键点击并选择 `Import`。你通过输入\
    \ `Existing Maven Projects` 来过滤选项。点击它，点击 `Next`，浏览到解压存根项目的位置，然后点击 `Open`。在项目下方你应该看到\
    \ `pom.xml`。点击 `Finish`。\n\n![](img/0002.jpeg)\n\n项目导入完成后，展开并打开主应用程序类。它应该被称为 `DiscoveryServerApplication`，这就是我们将添加注解以启用发现服务器的地方。因此在\
    \ `@SpringBootApplication` 注解上方，我们可以添加一个新的：`@EnableEurekaServer`。保存。\n\n```java\n\
    package io.ajay.kumar.discoveryserver;\n\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.netflix.eureka.server.EnableEurekaServer;\n\
    \n@EnableEurekaServer\n@SpringBootApplication\npublic class DiscoveryServerApplication\
    \ {\n    public static void main(String[] args) {\n        SpringApplication.run(DiscoveryServerApplication.class,\
    \ args);\n    }\n}\n```\n\n我们现在准备好启动我们的发现服务器了，所以右键点击主应用程序类，转到 `Run As` 并选择 `Spring\
    \ Boot App`。\n\n![](img/0003.jpeg)\n\n"
- fmt: "\nOnce the application has finished loading, go ahead and expand the Console\
    \ window. And you'll notice that there are several exceptions in here. Go ahead\
    \ and stop the application server; otherwise, it will continue to throw those\
    \ exceptions. Let's scroll up to one of these exceptions and see what the problem\
    \ is. Cannot execute request on any known server. And if you look, it's coming\
    \ from this `DiscoveryClient.getAndStoreFullRegistry()` method. And what's happening\
    \ is the Service Discovery Server is starting up, and it's trying to register\
    \ itself with a peer Service Discovery Server. And this is mainly for high availability\
    \ purposes. However, when we're running in standalone or development mode, it\
    \ can kind of be a pain to have to set up multiple instances every time. So instead,\
    \ we're going to configure the `Eureka Server` not to try to register itself with\
    \ its peers. And you definitely only want to do this is development mode since\
    \ you want that high availability in production. Let's go ahead and close the\
    \ Console. Then, in the Package Explorer, navigate to `src/main/resources` and\
    \ open up the `application.properties`.\n\n### application.properties\n\n```properties\n\
    spring.application.name=discovery-server\neureka.client.register-with-eureka=false\n\
    eureka.client.fetch-registry=false\nserver.port=8761\n```\n\nThe first property\
    \ we're going to add is actually one that we forgot previously, it's the `spring.application.name`\
    \ property, and we're going to set that to `discovery-server`. The second property\
    \ we're going to add is a Eureka Client property, so go ahead and type `eureka.client.register-with-eureka`.\
    \ And since we're the Discovery Server our self, and we're running in standalone\
    \ mode, we don't need to register with any other peers because there aren't any\
    \ other peers. So make sure you set that value to `false`. The next property is\
    \ also a Eureka Client property, so go ahead and type `eureka.client.fetch-registry`.\
    \ And this property controls whether or not the Eureka Client would fetch the\
    \ registry from the Eureka Server, and since we are the only Eureka Server, there's\
    \ nothing else to fetch from anybody else, so we'll set this to `false`. And the\
    \ last property we're going to add is the `server.port`, and we're going to set\
    \ that to a value of `8761`, which is the default port for Eureka Discovery Server.\
    \ Once you get those properties in place, head over to the main application class,\
    \ right-click on it, and go to `Run As Spring Boot App`. When your app finishes\
    \ starting up, expand the console, and you'll see that it started the Eureka Server\
    \ and it changed its status to `UP`. So you now have a running Service Discovery\
    \ Server.\n\n## The Application Service\n\n* Provides some application functionality\n\
    * The receiver of requests\n* A dependency of other service(s)\n* One or more\
    \ instances\n* User of the discovery client\n* Register\n* Deregister\n\nRemember\
    \ that we're diving into each of the components of service discovery, and the\
    \ next on our list is the application service. This is whatever is providing the\
    \ functionality. It's the thing that's receiving the requests from clients and\
    \ returning responses. And it's a dependency of other services. So other services\
    \ depend on its functionality to perform their functionality. You would typically\
    \ run one or more instances of the application service. The application service\
    \ is a user of the discovery client. It's going to use that client to call out\
    \ to the Discovery Server and register and deregister itself. Just like we did\
    \ for the Service Discovery Server, we're going to detail out the steps needed\
    \ to add a Eureka Client to an application service, and then we'll actually create\
    \ one ourselves.\n\n### Using Spring Cloud Eureka Client in a Service\n\n### pom.xml\n\
    \n```xml\n<dependencyManagement>\n    <dependencies>\n        <dependency>\n \
    \           <groupId>org.springframework.cloud</groupId>\n            <artifactId>spring-cloud-dependencies</artifactId>\n\
    \            <version>Camden.SR2</version>\n            <type>pom</type>\n   \
    \         <scope>import</scope>\n        </dependency>\n    </dependencies>\n\
    </dependencyManagement>\n```\n\nIn the `pom.xml` of your Maven project, add a\
    \ new `dependencyManagement` section, and within there add a new dependency of\
    \ `spring-cloud-dependencies`. Again, make sure it's of type `pom` and of scope\
    \ `import`.\n\n### pom.xml\n\n```xml\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
    \    <artifactId>spring-cloud-starter-eureka</artifactId>\n</dependency>\n```\n\
    \nStill within the `pom.xml`, add a new dependency within the `dependencies` elements,\
    \ and this one is called `spring-cloud-starter-eureka`. Then in your `application.properties`\
    \ or your `application.yml`, add two new properties.\n\n### application.properties\n\
    \n```properties\nspring.application.name=service\neureka.client.service-url.defaultZone=http://localhost:8761/eureka\n\
    ```\n\nOR\n\n### application.yml\n\n```yaml\nspring:\n  application:\n    name:\
    \ service\neureka:\n  client:\n    service-url:\n      defaultZone: http://localhost:8761/eureka\n\
    ```\n\nThe first property is the `spring.application.name` property, and again\
    \ you can set this to whatever value you want. In our case, we'll use `service`.\
    \ The second property tells the application service where the Service Discovery\
    \ Server is located, and it's the `eureka.client.defaultZone` property. And you\
    \ can see we set that to `localhost`, but in production you'd set that to wherever\
    \ your Service Server was. If you're wondering what `defaultZone` is, don't worry\
    \ about it for now. We'll explain more about that later.\n\n```java\n@SpringBootApplication\n\
    @EnableDiscoveryClient\npublic class Application {\n    public static void main(String[]\
    \ args) {\n        SpringApplication.run(Application.class, args);\n    }\n}\n\
    ```\n\nAnd then in your main class of your application service, you add one annotation.\
    \ Again, it's just one annotation. The Spring Cloud guys have made it so easy\
    \ for us. And that is `@EnableDiscoveryClient`. And what this does is it makes\
    \ our application register with the Discovery Server, and then other services\
    \ can find it.\n\n## Demo: Making an Application Service Discoverable\n\nWe use\
    \ use Spring Initializr to create our application service, so go ahead and head\
    \ over to `start.spring.io`. In the Group here you're going to put `io.ajay`,\
    \ and we'll give the Artifact `service`. And you'll have pretty much the same\
    \ dependencies, but this time you'll do Eureka Discovery instead of the Eureka\
    \ Server dependency. And you can go ahead and add DevTools and the Actuator.\n\
    \nGo ahead and click Generate. It'll automatically create and download a zip file\
    \ for you. Go ahead and unzip that zip file, and we'll import that into our IDE.\
    \ And we're back in Spring Tool Suite. In the Package Explorer tab, right-click\
    \ and go to Import. And again, we want to do Existing Maven Projects. Click Next,\
    \ browse to the location of our unzipped file, and click Open. You should see\
    \ `pom.xml` underneath the Projects heading, and click Finish to finish the import.\
    \ That'll take a second, and once that's finished, expand the service and go to\
    \ `src/main/java` and open up the main application class.\n\n```java\npackage\
    \ io.ajay.kumar.service;\n\nimport org.springframework.beans.factory.annotation.Value;\n\
    import org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;\nimport\
    \ org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\
    \n@EnableDiscoveryClient\n@SpringBootApplication\n@RestController\npublic class\
    \ ServiceApplication {\n\n    @Value(\"${service.instance.name}\")\n    private\
    \ String instance;\n\n    public static void main(String[] args) {\n        SpringApplication.run(ServiceApplication.class,\
    \ args);\n    }\n\n    @RequestMapping(\"/\")\n    public String message() {\n\
    ```\n"
