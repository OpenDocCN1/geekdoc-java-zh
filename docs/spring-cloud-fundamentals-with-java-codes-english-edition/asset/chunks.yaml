  trans: "\n正如我们已经讨论过的，Spring Cloud Config Server 是配置服务器（Configuration Server）的一种实现。让我们深入看看它提供的功能以及如何设置它。从核心上来说，Config\
    \ Server 就是另一个 Web 应用，它提供了一个基于 REST 的接口来访问你的配置文件。因此，你只需要设置好配置文件，并为它们恰恰命名，然后告诉\
    \ Configuration Server 它们所在的位置，它就会为你提供服务。需要指出的是，Config Server 并不提供写入任何配置文件的便利，它主要关注的是提供这些配置文件。它支持多种输出格式，默认是\
    \ JSON，但也支持 properties 和 YAML。Config Server 不需要数据库来存储配置，相反，它支持从几个不同的后端存储配置中检索和读取你的配置文件，例如\
    \ Git（默认值）、SVN，或者仅仅是本地文件系统。Configuration Server 支持的另一个很棒特性是它具有配置作用域（configuration\
    \ scopes）的概念。我的意思是，你可以定义适用于所有应用程序的全局配置，也可以定义特定应用程序的配置或特定 Spring Profile 的配置。使用\
    \ Spring Cloud Config Server 就像使用 Spring Cloud 的其他服务器一样，非常、非常简单。\n\n### pom.xml\n\
    \n```xml\n<dependencyManagement>\n    <dependencies>\n        <dependency>\n \
    \           <groupId>org.springframework.cloud</groupId>\n            <artifactId>spring-cloud-dependencies</artifactId>\n\
    \            <version>Camden.SR2</version>\n            <type>pom</type>\n   \
    \         <scope>import</scope>\n        </dependency>\n    </dependencies>\n\
    </dependencyManagement>\n```\n\n首先，在你的 `pom.xml` 中，确保在 `dependencyManagement`\
    \ 中定义了 `spring-cloud-dependencies`。\n\n```xml\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
    \    <artifactId>spring-cloud-config-server</artifactId>\n</dependency>\n```\n\
    \n然后，同样在你的 `pom.xml` 依赖部分，定义对 `spring-cloud-config-server` 的新依赖。接下来，创建一个文件夹来存储所有你想让\
    \ Configuration Server 提供的配置。在该文件夹中，你可以可选地创建一个 `application.properties` 文件或 `application.yml`\
    \ 文件。该文件用于适用于所有应用程序而不适用于任何某个特定应用程序的全局配置。一个例子就是跨所有应用程序共享的数据库配置。你将它放在这个 `application.properties`\
    \ 或 `application.yml` 文件中。接下来，在该文件夹中添加特定应用程序和特定 profile 的配置文件，你可以使用 properties\
    \ 或 YAML 格式。你对文件名使用一种特殊的命名模式，即 `application-profile.extension`，其中 `application`\
    \ 是你的应用程序名称，而 `profile` 是适用于该配置的 Spring Profile。如果你没有使用 Spring Profile，可以省略文件名中的\
    \ `-profile` 部分，直接使用 `application.file extension`。接下来，你在包含所有配置文件的文件夹中运行 `git init`。这个示例假设你正在使用默认的后端存储，即\
    \ Git。从那里开始，你 `git add` 你的配置文件，`git commit` 它们，然后最后一步（可选的，但强烈建议）是设置一个远程 Git 仓库，并\
    \ `git push` 将配置推送到远程仓库。现在我们需要配置真正的 Configuration Server 本身。不要将此与 Configuration\
    \ Server 将要提供的配置文件混淆。这是用于实际 Configuration Server 本身的应用程序配置。\n\n### application.properties\n\
    \n```properties\nserver.port=8888\nspring.cloud.config.server.git.uri=<uri_to_git_repo>\n\
    ```\n\n或者\n\n### application.yml\n\n```yaml\nserver:\n  port: 8888\nspring:\n\
    \  cloud:\n    config:\n      server:\n        git:\n          uri: <uri_to_git_repo>\n\
    ```\n\n在 Config Server 的 `application.properties` 文件中，你指定 `server.port` 属性并赋值为\
    \ `8888`。这不是强制的，但该端口是 Config Server 使用的惯用端口。然后你需要配置服务器将提供的所有配置文件的 Git 仓库位置。你通过指定属性\
    \ `spring.cloud.config.server.git.uri` 来实现，然后将其设置为 Git 仓库的位置。如果你将其上传到了远程仓库，这将是你仓库的克隆\
    \ URL。如果你倾向于使用 YAML 文件进行配置，我包含了等量的 `application.yml`。\n\n```java\n@SpringBootApplication\n\
    @EnableConfigServer\npublic class Application{\n    public static void main(String[]\
    \ args){\n        SpringApplication.run(Application.class,args);\n    }\n}\n```\n\
    \n下一步是向你的主 `Application` 类添加 `@EnableConfigServer` 注解。在你进行这里时，如果你想让你的 Configuration\
    \ Server 能通过服务发现被发现，你可以添加 Eureka Client 依赖，配置服务发现 URL，并添加 `@EnableDiscoveryClient`\
    \ 注解，这样客户端就能发现 Configuration Server 了。最后一步是确保你的 Configuration Server 以安全的方式进行设置。使用\
    \ Spring Security 库来完成这一点非常简单。Spring Security 支持的任何方法也适用于保护你的 Configuration Server。\n\
    \n## Config Server REST Support: Parameters\n\n通常当你与 Config Server 的 REST 端点交互时，你是在客户端进行的；然而，了解这些可用端点对于调试目的或者你想在其他语言中使用它们是很有用的。Config\
    \ Server 上的每个可用端点共享一组公共参数。这些参数的值会影响返回的配置。\n\n*   `{application}` 映射到客户端的 `spring.application.name`\n\
    *   `{profile}` 映射到客户端的 `spring.profiles.active`\n*   `{label}` 服务端通过名称引用集\n\n\
    第一个参数是 `application` 参数。如果你利用 Spring Cloud Client，它使用 `spring.application.name`\
    \ 属性的值来填充该 application 参数的值。下一个参数是 `profile` 参数。同样，如果你使用 Spring Cloud Client，它将从\
    \ `spring.profiles.active` 属性中获取值来填充该 profile 参数的值。因此，这翻译为激活的 Spring Profile。最后一个参数\
    \ `label` 参数是一个用于将你的配置文件分组为任意命名集的功能。根据你所使用的后端，这可能意味着不同的含义。例如，如果你使用 Git 作为后端，label\
    \ 则翻译为 Git 分支。现在花点时间查看每个端点参数，并将它们作为一个整体考虑，并思考你如何组合其中一个、两个或全部参数来识别特定的配置。\n\n##\
    \ Config Server REST Support: Endpoints\n\n到目前，我们应该对 REST 端点中涉及的每个路径参数的用途有了良好的理解。让我们来看看具体的\
    \ REST 服务本身。\n\n*   端点：`GET/{application}/{profile}[/{label}]`\n*   示例：`/myapp/dev/master`,\
    \ `/myapp/prod/v2`, `/myapp/default`\n\n"
- fmt: "\nThe first endpoint takes up to three of the parameters that we discussed\
    \ with the third, the `label` parameter, being optional. Let's take a look at\
    \ a couple of examples that can make this a bit more concrete. The first example\
    \ is `/myapp/dev/master`. And `myapp` is the application name, `dev` is the Spring\
    \ Profile, and `master` is the Git branch, which translates into the `label`.\
    \ We have another example where it's slightly different than the first example.\
    \ You have `myapp` as the application, that's the same, but you have a different\
    \ profile, and that's the `prod` profile. And you also have a different label,\
    \ which is the `v2` Git branch. Now the last example is kind of important. We've\
    \ got two parameters that are required, the `application` parameter and the `profile`\
    \ parameter. And then that `label` parameter is optional. And when you use Spring\
    \ and you don't set an active profile, you might not know, but it sets one for\
    \ you, and it's called `default`. So if you were wanting to get access to the\
    \ configuration that didn't apply to any particular Spring Profile, you would\
    \ give it your application name and then the value `default`.\n\n### Endpoint:\n\
    * `GET/{application}-{profile}.(yml|properties)`\n\n### Example:\n* `/myapp-dev.yml`\n\
    * `/myapp-prod.properties`\n* `/myapp-default.properties`\n\nThe next endpoint\
    \ utilizes only two of the three parameters that we discussed, the `application`\
    \ parameter and the `profile` parameter. It allows you to request either YAML\
    \ or properties files, and it doesn't necessarily matter what the source file\
    \ is. So, for instance, if you had a source file in the YAML format, you could\
    \ still request it in the properties format, and it would automatically convert\
    \ it for you. The examples are very straightforward. You have something like `/myapp-dev.yml`\
    \ or something like `/myapp-prod.properties`. And just like the last endpoint,\
    \ you have to have a profile, so you could have something like `/myapp-default.properties`.\n\
    \n### Endpoint:\n* `GET/{label}/{application}-{profile}.(yml| properties)`\n\n\
    ### Example:\n* `/master/myapp-dev.yml`\n* `/v2/myapp-prod.properties`\n* `/master/myapp-default.properties`\n\
    \nThe last REST endpoint is very similar to the one we just looked at with the\
    \ exception that you have to specify a label. In fact, they can be equivalent\
    \ if the label you specified is `master` as the previous endpoint always assumes\
    \ that the label is `master`. Just like the other examples, it's pretty straightforward.\
    \ Here's an example where we have `/master/myapp-dev.yml` where `master` is the\
    \ label, `myapp` is the application, `dev` is the profile, and you've chosen to\
    \ use a YAML extension so you'll get it back in YAML format. And a very similar\
    \ one, except this time it is a `v2` for the label or the branch, the Git branch,\
    \ and `myapp-prod`, the same application name, with `prod` being a different profile.\
    \ And this time you've requested a properties format so it'd be returned in properties.\
    \ And the last example is a lot like the first example where you have `/master/myapp-`\
    \ and then the profile. And since the profile is a required value, remember we\
    \ need to use the value `default` to represent that default profile, and then\
    \ you're requesting it in the properties format.\n\n## Demo: Setting up a Configuration\
    \ Server\n\nIn this demo, we're going to be building and starting up our own Config\
    \ Server. So the easiest way to get started is to head over to `start.spring.io`.\
    \ For the `Group ID` we'll use `io.ajay.kumar`. For the `Artifact` we'll use `config-server`.\
    \ For the dependencies, we'll add the `Config Server` dependency, and then we'll\
    \ also add the `Eureka Discovery` dependency. Now this is an optional dependency,\
    \ but it will allow our Config Server to register itself with the Discovery Server\
    \ so that Config Clients can find it. And last, we'll use the `Actuator` dependency.\n\
    \n![](images/00017.gif)\n\nOnce you've got everything selected, go ahead and click\
    \ Generate Project. That will create a zip file, and go ahead and unzip that,\
    \ and head over to your IDE. Within Eclipse, or `STS`, right-click on the empty\
    \ Package area, go to `Import`, search for `Existing Maven Projects`, select it,\
    \ click `Next`, browse to the location of the downloaded zip file, so mine's in\
    \ `Downloads`, `config-server`, open that, and click `Finish` to finish importing\
    \ it.\n\n![](images/00018.gif)\n\nExpand the `config-server` project and navigate\
    \ to the main application class.\n\n```java\npackage io.ajay.kumar.configserver;\n\
    \nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.config.server.EnableConfigServer;\n\n@SpringBootApplication\n\
    @EnableConfigServer\npublic class ConfigServerApplication {\n    public static\
    \ void main(String[] args) {\n        SpringApplication.run(ConfigServerApplication.class,\
    \ args);\n    }\n}\n```\n\nWithin the main application class, add the `@EnableConfigServer`\
    \ annotation. Save that and close that file. Next, expand the `src/main/resources`\
    \ folder and open up the `application.properties`.\n\n**application.properties:**\n\
    ```properties\nserver.port=8888\nspring.cloud.config.server.git.uri=\n```\n\n\
    Within the `application.properties`, add a `server.port` property and set that\
    \ equal to `8888`. Next, we need to configure the Config Server to know where\
    \ the configuration repository is. So we'll say `spring.cloud.config.server.git.uri`,\
    \ we're going to use a Git repository, but for this demo we'll use a prebuilt\
    \ one that's on GitHub. So go ahead and open up a browser. In the address bar,\
    \ type `github.com/ajaycukumar/config-repository`. We're going to be forking this\
    \ repository, which means we're creating a local copy in our own GitHub account.\
    \ If you don't already, make sure you sign up for one. Once you're all signed\
    \ in, click the Fork button in the top right corner, and that'll create a fork\
    \ for you. Once you've got your fork, it'll look very similar to the unforked\
    \ version, but underneath the repository name at the top it'll say forked from\
    \ ajaycukumar. Next we want to grab the clone URL, so head over to this green\
    \ button, click it, and copy the clone URL to your clipboard, and head back over\
    \ to your IDE. Back in Eclipse, or `STS`, we want access to the Git repository's\
    \ view. And you can do that by going to `Window`, `Show View`, `Other`, and choose\
    \ `Git Repositories`. Within the Git Repositories view, click on the link that\
    \ says `Clone a Git repository`. It'll pop up a new window. Choose `URI`. Hit\
    \ `Next`. Since we copied it to our clipboard, it should automatically show up\
    \ in the URI section with the host and the repository path filled in as well.\
    \ If it's not, just paste that clone URL that we copied into the URI. Go ahead\
    \ and click `Next`, choose the `master` branch, and click `Finish`.\n\n**application.properties:**\n\
    ```properties\nserver.port=8888\nspring.cloud.config.server.git.uri=https://github.com/yourusername/config-repository.git\n\
    ```\n\nSince we still have the clone URL on our clipboard, let's set up the Config\
    \ Server's Git URL by clicking in the `application.properties` and pasting in\
    \ that value. Make sure you save that, and then you can close that file. Head\
    \ back over to the Git Repositories view and expand the repository. Right-click\
    \ on the `Working Tree` and choose `Import Projects`. A new dialog box will pop\
    \ up, and just click `Finish`.\n\n![](images/00019.gif)\n\n**application.properties:**\n\
    ```properties\n# Put all global configuration here\nsome.property=global\nsome.other.property=global\n\
    ```\n\n**config-client-app-prod.properties:**\n```properties\n# Put application+profile-specific\
    \ config here (app name: client-config-app) (profile name: prod)\nsome.property=profile\
    \ specific value\nsome.other.property=profile specific value\n```\n\n**config-client-app.properties:**\n\
    ```properties\n# Put application-specific config here (application name: client-config-app)\n\
    ```\n"
