    - 结果：`FooService` 仍然包含旧的（OLD）配置值

    - 仅在初始化时获取配置


    假设你有一个 `@Configuration` 类，它声明了一个名为 `FooService` 的新 Bean。为了构造 `FooService`，你需要从
    `FooProperties` 为它提供一个配置值，该值是 Bean 方法的参数。`FooProperties` 是一个 `@Configuration`
    类。然后你对绑定到 `FooProperties` 的属性进行一些配置更改，并向 `refresh` 终点发送一个 `POST` 请求。如果你此时查看 `FooService`，即使你调用了
    `refresh`，它实际上仍然持有旧的配置值。这是因为因为它只在初始化时获取配置。这里是另一个例子。


    ```java

    @Configuration

    public class SomeConfiguration{


    @Value("${some.config.value}")

    String configValue;


    @Bean

    public FooService fooService(){

    return new FooService(configValue);

    }


    }

    ```


    ### 示例：刷新后 `@Value` 无法看到新配置值


    - 进行了配置更新

    - 向 `/refresh` 发送 `POST` 请求

    - 结果：`FooService` 仍然包含旧的（OLD）配置值

    - 仅在初始化时获取配置


    再次，我们有一个 `@Configuration` 类，这次我们有一个带有某些需要注入的配置的 `@Value` 注解。我们将使用该配置作为构造函数参数来构造
    `FooService` Bean。所以我们经历了同样的过程：更新某些配置，向 `refresh` 终点发送 `POST` 请求，再次我们发现我们的配置值仍然是旧值。它没有被更新。此时你可能在想，我如何刷新一个只在初始化时获取配置的
    `@Bean` 或 `@Value` 呢？答案是使用 `@RefreshScope` 注解。回到第一个例子，看看我们如何以及何时利用 `@RefreshScope`
    注解。


    ```java

    @Configuration

    public class SomeConfiguration{


    @Bean @RefreshScope

    public FooService fooService(FooProperties properties){

    return new FooService(properties.getConfigValue());

    }


    }

    ```


    ### 示例：利用 `@RefreshScope`


    - 在 `@Bean` 上添加 `@RefreshScope` 注解

    - 向 `/refresh` 发送 `POST` 请求

    - 结果：`FooService` 现在将包含新的（NEW）配置值！

    - `@RefreshScope` 通知 Spring 重新初始化此 `@Bean`


    在你的 `@Configuration` 类中，你只需要给你的 `@Bean` 添加 `@RefreshScope` 注解即可。一旦你向 `refresh`
    终点发送了 `POST` 请求，`FooService` 现在就会看到最新的配置值。`RefreshScope` 的作用就像它的名字一样。它是对 Spring
    的提示，该 `@Bean` 或 `@Value` 应该包含在刷新范围内。


    ## 演示：无需重启应用刷新配置


    在这个演示中，我们将学习如何在运行时刷新配置，以及如何使用 `@RefreshScope` 注解。在开始演示之前，请确保你已经安装了名为 `Postman`
    的工具。你可以通过 `www.getpostman.com` 获取。我们将使用这个工具来调用 REST 终点。这是一个很好的 REST 客户端。我们要做的第一件事是启动所有的应用程序，所以请启动
    `Discovery Server`、`Config Server` 和 `Config Client` 应用。现在记住，你需要按照正确的顺序启动它们。先启动
    `Discovery Server`，然后是 `Config Server`，最后是 `Config Client` 应用。如果在启动时遇到任何问题，请确保按照该顺序启动。打开浏览器并访问
    `localhost:8080`。


    ![](img/00025.jpeg)


    你会看到从 `Configuration Server` 解析出的配置值。现在，我们想要更新这些值中的每一个，所以我们将更新第一个（应用特定的覆盖值）以及全局值。因此，回到
    IDE。在 IDE 中，展开 `config-repository` 项目，并打开 `config-client-app.properties` 文件。


    config-client-app.properties:


    ```properties

    # 在此处放置应用特定的配置（应用名称: client-config-app）

    some.property=coffee

    some.other.property=is good

    ```


    我们将把这个值从应用特定的覆盖值更改为 `coffee`。然后我们还要设置另一个。我们将覆盖 `some.other.property`，并将其设置为 `is
    good`。保存这些更改。关闭该文件。然后我们将提交这些更改，右键点击 `scf-config-repository`，进入 `Team`，进入 `Commit`，输入提交信息
    `Updating configuration`，然后点击 `Commit` 和 `Push`。会弹出一个新对话框向你显示已推送了这些更改。只需点击 `OK`
    即可。你可以退出该 `Git Staging` 视图。现在我们更新了配置，并将其推送到配置仓库。如果你回到浏览器并刷新页面，该值应该是旧值。


    ![](img/00025.jpeg)


    我们还没有显式地请求应用程序刷新其配置。为了做到这一点，启动 `Postman` 应用，在新标签页中显示 `GET` 的地方，点击下拉菜单并选择 `POST`。
    然后在请求 URL 中输入 `http://localhost:8080/refresh`。一旦输入完成，点击 `Send`，服务器将返回所有更改的属性。这里有一个内部属性
    `config.client.version`，以及我们更改的另外两个属性 `some.other.property` 和 `some.property`。回到浏览器并刷新页面。


    ![](img/026.jpeg)


    噢，这很有意思。第一个值已经刷新了，我们得到了设置的 `coffee`，但第二个值仍然指向全局值。这是因为第二个值是通过 `@Value` 获取的，而当调用终点时
    `@Value` 注解不会自动刷新。我们可以通过 `@RefreshScope` 来解决这个问题。回到 IDE，停止 Config 应用。然后在主类中，找到
    `someOtherProperty`。我们这里有 `@Value` 注解。为了解决 `@Value` 不更新的问题，我们在主类中添加 `@RefreshScope`。


    '
- fmt: "\nSo you type `@RefreshScope`. Go ahead and save that and restart the application.\
    \ Now since we restarted the application, the application's going to fetch the\
    \ latest configuration values when it starts up. So we won't actually be demonstrating\
    \ the use of `@RefreshScope` because it's going to get the latest value regardless.\
    \ And so what we need to do is we need to update the value again. So go ahead\
    \ and open up the `config-client-app`, and change `some.other.property` to `is\
    \ really good`.\n\nconfig-client-app.properties:\n\n```properties\n# Put application-specific\
    \ config here (application name: client-config-app)\n\nsome.property=coffee\n\n\
    some.other.property=is really good\n```\n\nSave that, close that file out, and\
    \ again commit that up to the Git repository. So Team, Commit, updating configuration\
    \ again, and click the Commit and Push button. You can exit the Git Staging view.\
    \ And head back to your browser and refresh the page.\n\n![](images/00027.jpeg)\n\
    \nAs you can see, it says coffee is good. And `is good` is the value that it retrieved\
    \ on start up. But once we refresh this with the refresh scope now added, it will\
    \ fetch the latest value for that `@Value` annotation. So go ahead and open up\
    \ Postman, and on the New Tab where it says `GET`, click that drop-down and choose\
    \ `POST`. Then in the request URL type `http://localhost:8080/refresh`. Once you've\
    \ got that typed in, hit Send, and you can see it changed the `some.other.property`.\
    \ Head back to the browser, and refresh that page.\n\n![](images/00028.jpeg)\n\
    \nAnd you can see that it changed our property this time from `is good` to `is\
    \ really good`.\n\n## Encrypting and Decrypting Sensitive Configuration\n\nSpring\
    \ Cloud Config Server also provides additional useful functionality for encrypting\
    \ and decrypting your configuration. It has support for several different features.\n\
    \n### Supported features:\n\n* Encrypted configuration at rest and/or in-flight\n\
    * An `/encrypt` endpoint to encrypt configuration\n* A `/decrypt` endpoint to\
    \ decrypt configuration\n* Encrypting and decrypting with symmetric or asymmetric\
    \ keys\n\nIt supports encrypted configuration at rest or in-flight. And at rest,\
    \ that simply just means that your configuration is encrypted when it's stored\
    \ on disc. And in-flight means that it's encrypted as it travels between the Config\
    \ Server and the Config Client. It has utility endpoints for encrypting and decrypting\
    \ your configuration. And one really important thing to point out is that by default\
    \ neither of these endpoints are secured unless you configure security for your\
    \ Configuration Server. And we've already talked about how to secure your Config\
    \ Server. And remember that any of the methods that are supported by Spring Security\
    \ will also work for securing your Config Server. And last, it has support for\
    \ encrypting and decrypting using either symmetric or asymmetric keys. So you\
    \ can choose whatever works best for your situation. Before we get into the details\
    \ on encrypting and decrypting configuration, I thought it would be useful to\
    \ see how encrypted configuration looks.\n\napplication.properties:\n\n```properties\n\
    my.datasource.username=foobar\nmy.datasource.password={cipher}ASFIOWRODSKSDFIR32KJL\n\
    ```\n\napplication.yml:\n\n```yaml\nmy:\n  datasource:\n    username: foobar\n\
    \    password: '{cipher}ASFIOWRODSKSDFIR32KJL'\n```\n\nI've included both an `application.properties`\
    \ and an `application.yml`. And they both have the same encrypted database password.\
    \ Notice that before the random letters and numbers there's a special value of\
    \ `cipher`, and it's surrounded by curly braces. This is what denotes that the\
    \ real value is an encrypted value. And notice that there's one minor difference\
    \ in the `application.yml` versus the properties. The YAML file requires us to\
    \ surround the value in single quotes, whereas the properties file does not. Now\
    \ that you've seen what encrypted configuration looks like, you're probably wondering\
    \ at what point is the configuration decrypted? And there are two different options.\
    \ The first option is upon request, and that's at the Configuration Server. So\
    \ you make a request for configuration for a specific application, and the Config\
    \ Server decrypts the values in the configuration before sending it back. You'd\
    \ only want to use this if the connection between your Config Server and your\
    \ Config Client is secure. If it's not, you can utilize the second option that\
    \ decrypts the value's client side. And this is exactly opposite of the first\
    \ option. Instead of decrypting the values before sending them back, the Config\
    \ Server sends them in encrypted format, and the client is responsible for decrypting\
    \ them. Note that the default way is the first option, upon request. And if you\
    \ want the client to decrypt the configuration, you have to set a property on\
    \ the Config Server, `spring.cloud.config.server.encrypt.enabled=false`, and that\
    \ will tell the Config Server not to decrypt the values before sending them back\
    \ to the client.\n\n## Using the Encryption and Decryption Support\n\nBefore we\
    \ get into the details about configuring our Configuration Server for encryption\
    \ and decryption support, note that it assumes we have the Java Cryptography Extension\
    \ installed, or commonly referred to as `JCE`.\n\n### Step One: Choose Your Key\
    \ Type\n\n* Symmetric Key\n* Asymmetric Key\n* Public Key\n* Private Key\n\nThe\
    \ first step to encrypting your configuration is to choose the key type, and that\
    \ could be either symmetric or asymmetric. And typically symmetric keys are easier\
    \ to use, but less secure than asymmetric keys. And you can choose whatever works\
    \ best for your situation.\n\n### Step Two (Symmetric): Configure the Config Server\n\
    \napplication.properties:\n\n```properties\nencrypt.key=<your_super_secret_key>\n\
    ```\n\napplication.yml:\n\n```yaml\nencrypt:\n  key: <your_super_secret_key>\n\
    ```\n\nStep two, if you're using a symmetric key, is to configure the encryption\
    \ key. And you can do that in the `application.properties` or the `application.yml`.\
    \ And the property that is set is `encrypt.key`. And you would set that to the\
    \ secret value you'll use to encrypt your configuration.\n\n### Step Two (Asymmetric):\
    \ Configure the Config Server Option 1\n\napplication.properties:\n\n```properties\n\
    encrypt.key=<pem_encoded_key_as_text>\n```\n\napplication.yml:\n\n```yaml\nencrypt:\n\
    \  key: <pem_encoded_key_as_text>\n```\n\nStep two, if you're using asymmetric\
    \ keys, can be done in two different ways. The first way is to set the value of\
    \ the `encrypt.key` property in the `application.properties` or the `application.yml`\
    \ as `pem_encoded_key_as_text`. And the PEM encoded key would contain both the\
    \ public and the private key.\n\n### Step Two (Asymmetric): Configure the Config\
    \ Server Option 2\n\napplication.properties:\n\n```properties\nencrypt.keyStore.location=<path_to_keystore>\n\
    encrypt.keyStore.password=<keystore_password>\nencrypt.keyStore.alias=<key_name_in_keystore>\n\
    ```\n\napplication.yml:\n\n```yaml\nencrypt:\n  keyStore:\n    location: <path_to_keystore>\n\
    \    password: <keystore_password>\n    alias: <key_name_in_keystore>\n```\n\n\
    The second way, if you're using asymmetric keys, is to use the Java KeyStore.\
    \ Once you've created or imported your public and private key into an existing\
    \ or new keystore, you simply configure the location of the keystore, the password\
    \ to the keystore, and the name of the alias that you chose when creating or importing\
    \ the key into the keystore. And you can do that in the `application.properties`,\
    \ of course, or in the `application.yml`.\n\n## Encrypt and Decrypt REST Endpoints\n\
    \nOnce you have your Config Server all set up for cryptography, you can utilize\
    \ some of the utility REST endpoints to encrypt and decrypt values that you will\
    \ put or take out of your configuration. Both of the endpoints are really, really\
    \ easy to use.\n\n### Utility REST Endpoints: Encrypt Values\n\n* Endpoint\n*\
    \ `POST /encrypt`\n* Example\n* Request: `/encrypt`\n* Data: `<value_to_encrypt>`\n"
