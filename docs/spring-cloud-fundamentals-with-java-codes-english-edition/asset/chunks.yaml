  trans: "\n\n第一个端点接受我们讨论过的三个参数中的三个，其中第三个参数 `label` 是可选的。让我们来看几个例子，让这更直观。第一个例子是 `/myapp/dev/master`。其中\
    \ `myapp` 是应用名称，`dev` 是 Spring Profile，`master` 是 Git 分支，它被翻译为 `label`。我们还有另一个例子，与第一个例子略有不同。你有一个\
    \ `myapp` 作为应用，这是一样的，但你有一个不同的 profile，即 `prod` profile。你还有一个不同的 label，即 `v2` Git\
    \ 分支。现在，最后一个例子比较重要。我们有两个必填的参数：`application` 参数和 `profile` 参数。然后那个 `label` 参数是可选的。当你使用\
    \ Spring 且没有设置激活的配置（active profile）时，你可能不知道，但它会为你设置一个，并称为 `default`。所以，如果你想访问不适用于任何特定\
    \ Spring Profile 的配置，你可以提供你的应用程序名称，然后值 `default`。\n\n### 端点：\n* `GET/{application}-{profile}.(yml|properties)`\n\
    \n### 示例：\n* `/myapp-dev.yml`\n* `/myapp-prod.properties`\n* `/myapp-default.properties`\n\
    \n下一个端点仅利用我们讨论的三个参数中的两个：`application` 参数和 `profile` 参数。它允许你请求 YAML 或 properties\
    \ 文件，源文件是什么格式并不一定重要。例如，如果你有一个 YAML 格式的源文件，你仍然可以用 properties 格式请求它，它会自动为你进行转换。示例非常直观。你会有像\
    \ `/myapp-dev.yml` 或 `/myapp-prod.properties` 这样的内容。和上一个端点一样，你必须有一个 profile，所以你可以像\
    \ `/myapp-default.properties` 这样的。\n\n### 端点：\n* `GET/{label}/{application}-{profile}.(yml|\
    \ properties)`\n\n### 示例：\n* `/master/myapp-dev.yml`\n* `/v2/myapp-prod.properties`\n\
    * `/master/myapp-default.properties`\n\n最后一个 REST 端点与我们刚刚看到的非常相似，区别在于你必须指定一个 label。事实上，如果你指定的\
    \ label 是 `master`，它们与上一个端点是等等的，因为上一个端点总是假设 label 是 `master`。与其他例子一样，这非常直观。这里有一个例子，我们有\
    \ `/master/myapp-dev.yml`，其中 `master` 是 label，`myapp` 是应用，`dev` 是 profile，你选择了使用\
    \ YAML 扩展，所以你将得到 YAML 格式的结果。另一个非常类似的例子，只是这次 label 或分支（Git 分支）是 `v2`，而 `myapp-prod`\
    \ 是相同的应用名称，其中 `prod` 是一个不同的 profile。这次你请求了 properties 格式，因此它将以 properties 格式返回。最后一个例子与第一个例子非常像，你有\
    \ `/master/myapp-` 然后是 profile。由于 profile 是一个必填值，记住我们需要使用值 `default` 来代表该默认 profile，然后你以\
    \ properties 格式请求它。\n\n## 演示：设置配置服务器 (Config Server)\n\n在本次演示中，我们将构建并启动自己的配置服务器。因此开始最简单的方法是前往\
    \ `start.spring.io`。对于 `Group ID`，我们将使用 `io.ajay.kumar`。对于 `Artifact`，我们将使用 `config-server`。对于依赖，我们将添加\
    \ `Config Server` 依赖，然后还会添加 `Eureka Discovery` 依赖。这是一个可选依赖，但它将允许我们的 Config Server\
    \ 注册到发现服务器（Discovery Server），以便 Config Clients 能够找到它。最后，我们将使用 `Actuator` 依赖。\n\
    \n![](img/00017.gif)\n\n一旦选好了所有内容，点击 Generate Project。这将创建一个 zip 文件，去解压它，然后进入你的\
    \ IDE。在 Eclipse 或 `STS` 中，右键点击空白 Package 区域，进入 `Import`，搜索 `Existing Maven Projects`，选择它，点击\
    \ `Next`，浏览到下载的 zip 文件位置（我的在 `Downloads`，`config-server`），打开它，并点击 `Finish` 完成导入。\n\
    \n![](img/00018.gif)\n\n展开 `config-server` 项目并导航到主应用程序类。\n\n```java\npackage io.ajay.kumar.configserver;\n\
    \nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.config.server.EnableConfigServer;\n\n@SpringBootApplication\n\
    @EnableConfigServer\npublic class ConfigServerApplication {\n    public static\
    \ void main(String[] args) {\n        SpringApplication.run(ConfigServerApplication.class,\
    \ args);\n    }\n}\n```\n\n在主应用程序类中，添加 `@EnableConfigServer` 注解。保存并关闭该文件。接下来，展开\
    \ `src/main/resources` 文件夹并打开 `application.properties`。\n\n**application.properties:**\n\
    ```properties\nserver.port=8888\nspring.cloud.config.server.git.uri=\n```\n\n\
    在 `application.properties` 中添加 `server.port` 并设置为 `8888`。接下来，我们需要配置 Config 服务器知道配置仓库在哪里。所以我们会说\
    \ `spring.cloud.config.server.git.uri`，我们将使用 GitHub 上的仓库。先打开浏览器。在地址栏中输入 `github.com/ajaykumar/config-repository`。我们要\
    \ fork 这个仓库，如果你还没有账号，请先注册。登录后，点击右上角的 Fork 按钮，这会在你的账户中创建一个副本。看起来和原始版本非常相似，仓库名称下方会显示\
    \ forked from ajaykumar。接下来我们要获取 URL，所以点击这个按钮，复制 URL 到剪贴板，然后回到 IDE。在 Eclipse 或\
    \ `STS` 中，我们需要访问 Git 仓库视图。你可以通过 `Window`、`Show View`、`Other` 并选择 `Git Repositories`\
    \ 来。在 Git Repositories 视图中，点击 `Clone a Git repository` 链接。会弹出一个新窗口。选择 `URI`。点击\
    \ `Next`。由于我们复制到了剪贴板，URI 应该会自动填充主机和仓库路径。如果没有，只需粘贴我们复制的 URL。点击 `Next`，选择 `master`\
    \ 分支，并点击 `Finish`。\n\n**application.properties:**\n```properties\nserver.port=8888\n\
    spring.cloud.config.server.git.uri=https://github.com/yourusername/config-repository.git\n\
    ```\n\n由于剪贴板上还有 URL，通过点击 `application.properties` 并粘贴该值来设置配置服务器的 Git URL。确保保存，然后关闭文件。回到\
    \ Git 仓库视图并展开仓库。右键点击 `Working Tree` 并选择 `Import Projects`。弹出一个对话框，直接点击 `Finish`。\n\
    \n![](img/00019.gif)\n\n**application.properties:**\n```properties\n# 放置所有全局配置\n\
    ```\n\n"
- fmt: "\n`some.property=app specific overridden value`\n\nIn the `Package Explorer`,\
    \ expand the `config repository` project, and you'll notice that there are three\
    \ configuration files. Let's take a look at the first configuration file, `application.properties`.\
    \ This is where all of the global configuration goes. The `application.properties`\
    \ applies to any application that asks for configuration from the `Config Server`.\
    \ Next, open up the `config-client-app.properties` file, and note that this is\
    \ an application-specific configuration file. So this would only apply to an application\
    \ named `config-client-app`. When we demo the `Spring Cloud Config Client`, we'll\
    \ configure the `Spring` application name of that project to be the `config-client-app`\
    \ so that this configuration only applies to that application. Go ahead and open\
    \ up the last configuration file, the `config-client-app-prod.properties` file.\
    \ And this configuration file is similar to the one we just looked at. And it\
    \ would apply to the same application, but instead it would only apply to the\
    \ application if the application was running with the `Spring Profile` named `prod`.\
    \ Let's close all of these configuration files and start up our `Configuration\
    \ Server`. So go over here to the `config-server`, expand it, find the main application\
    \ class, right-click on it, and go to `Run As Spring Boot App`. You need to start\
    \ the `discovery-server` too. Once the `Configuration Server` is started, let's\
    \ open up a browser and hit some of the `REST endpoints`.\n\n![](images/00020.jpeg)\n\
    \nFormatting above response :\n\n```json\n{  \n   \"name\":\"config-client-app\"\
    ,\n   \"profiles\":[  \n      \"default\"\n   ],\n   \"label\":null,\n   \"version\"\
    :\"5bbcc634f016351eecb0aaf67650c378e9425200\",\n   \"state\":null,\n   \"propertySources\"\
    :[  \n {  \n          \"name\":\"https://github.com/ajaycucek/config-repository.git/config-client-app.properties\"\
    ,\n          \"source\":{  \n \"some.property\":\"app specific overridden value\"\
    \n         }\n },\n {  \n          \"name\":\"https://github.com/ajaycucek/config-repository.git/application.properties\"\
    ,\n          \"source\":{  \n \"some.property\":\"global\",\n \"some.other.property\"\
    :\"global\"\n         }\n }\n   ]\n}\n```\n\nOnce you've got your browser open,\
    \ visit `http://localhost:8888/config-client-app/default`. And then remember that\
    \ it's the `application name/profile/label`, so application name will be `config-client-app`.\
    \ And remember that the `profile` parameter is a required parameter, so if we\
    \ want to see the default configuration for the `Config Client` app without any\
    \ `Spring Profile`, we use the value `default` as the default profile. The default\
    \ return format is in `JSON`, and the important points of this are the `property\
    \ sources`. Notice that the bottom property source is the `application.properties`.\
    \ That's the global properties that applies to every application. And then the\
    \ property source above that, which overrides any of the global property sources,\
    \ is the `config-clien-app.properties`.\n\n![](images/00021.jpeg)\n\nFormatting\
    \ above response :\n\n```json\n{  \n   \"name\":\"config-client-app\",\n   \"\
    profiles\":[  \n      \"prod\"\n   ],\n   \"label\":null,\n   \"version\":\"5bbcc634f016351eecb0aaf67650c378e9425200\"\
    ,\n   \"state\":null,\n   \"propertySources\":[  \n {  \n          \"name\":\"\
    https://github.com/ajaycucek/config-repository.git/config-client-app-prod.properties\"\
    ,\n          \"source\":{  \n \"some.property\":\"profile specific value\",\n\
    \ \"some.other.property\":\"profile specific value\"\n         }\n },\n {  \n\
    \          \"name\":\"https://github.com/ajaycucek/config-repository.git/config-client-app.properties\"\
    ,\n          \"source\":{  \n \"some.property\":\"app specific overridden value\"\
    \n         }\n },\n {  \n          \"name\":\"https://github.com/ajaycucek/config-repository.git/application.properties\"\
    ,\n          \"source\":{  \n \"some.property\":\"global\",\n \"some.other.property\"\
    :\"global\"\n         }\n }\n   ]\n}\n```\n\n`some.property=app specific overridden\
    \ value`\n\nIf we modify the `config-client-app` to include `prod`, we'll see\
    \ that `some.property` is overridden.\n\n![](images/00022.jpeg)\n\n## Using Spring\
    \ Cloud Client\n\nNow that we've seen how `Spring Cloud Config Server` works and\
    \ how to get one up, let's look at the other end of the equation, the `Client`.\
    \ At its core, the `Client` is responsible for bootstrapping. So what do I mean\
    \ when I say that the `Client` is responsible for bootstrapping configuration?\
    \ Well, when a `Spring` application starts up, it needs to resolve its property\
    \ sources. Since the configuration lives on the `Configuration Server`, it needs\
    \ to fetch that before the application context technically started. There are\
    \ two different ways that you can get the `Config Client` to bootstrap your application,\
    \ and they both use a special file called `bootstrap.properties` or `bootstrap.yml`.\n\
    \n### Config First\nThe first way is `Config First`, and you do that by configuring\
    \ a `bootstrap.yml` or `bootstrap.properties` that has the `application name`,\
    \ as well as the `URL` to the `Configuration Server`.\n\n### Discovery First\n\
    The second way is `Discovery First`, and that's using `service discovery`. So\
    \ you would configure your `bootstrap.properties` or `bootstrap.yml` to have the\
    \ `application name` and then the location of the `Service Discovery Server`.\
    \ And it would use that to then find the `Config Server`. Setting up an application\
    \ to use the `Spring Cloud Client` is even easier than setting up the `Spring\
    \ Cloud Config Server`.\n\n`pom.xml`:\n\n```xml\n<dependencyManagement>\n    <dependencies>\n\
    \        <dependency>\n<groupId>org.springframework.cloud</groupId>\n<artifactId>spring-cloud-dependencies</artifactId>\n\
    <version>Camden.SR2</version>\n<type>pom</type>\n<scope>import</scope>\n     \
    \   </dependency>\n    </dependencies>\n</dependencyManagement>\n```\n\nIn your\
    \ `pom.xml`, you import the `spring-cloud-dependencies` within the `dependencyManagement`\
    \ section.\n\n```xml\n<dependency>\n<groupId>org.springframework.cloud</groupId>\n\
    <artifactId>spring-cloud-config-client</artifactId>\n</dependency>\n```\n\nThen\
    \ within the `dependency` section, still within your `pom.xml`, define a new dependency\
    \ on `spring-cloud-config-client`. Then we need to configure how the `Config Client`\
    \ will bootstrap the configuration. If you're using `Config First`, you define\
    \ a `bootstrap.properties` or a `bootstrap.yml`.\n\n`bootstrap.properties`:\n\
    ```properties\nspring.application.name=<your_app_name>\nspring.cloud.config.uri=http://localhost:8888/\n\
    ```\n\nOR\n\n`bootstrap.yml`:\n```yaml\nspring:\n  application:\n    name: <your_app_name>\n\
    \  cloud:\n    config:\n      uri: http://localhost:8888/\n```\n"
