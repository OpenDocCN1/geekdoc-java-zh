    First, we looked at the reasons why Intelligent Routing is needed in the first
    place and why it''s important. Then we looked at how routing is implemented via
    an API Gateway, or a gateway service. And last, we saw how we can use Netflix
    Zuul as a gateway service to route and filter our requests and responses to and
    from back-end services.


    # Module 6: Calling Services Using Client-side Load Balancing


    ## Module Introduction


    In this module we''ll learn how to utilize client-side load balancing to distribute
    the workload of a service in a cloud-native application.


    *   Load balancing


    *   Server-side


    *   Client-side


    *   Netflix Ribbon


    *   With & without service discovery


    *   @Loadbalanced


    *   @RibbonClient


    *   Custom Ribbon configuration


    We''ll start off with what is load balancing, and what role does it play in a
    cloud-native application? Then we''ll talk about traditional server-side load
    balancing, which you''re probably already familiar with. Then we''ll introduce
    client-side load balancing, what it is and how it differs from server-side load
    balancing. Next, we''ll introduce Netflix Ribbon and how we can utilize it with
    Spring Cloud to implement client-side load balancing. We''ll learn how to implement
    it with and without service discovery using two new annotations: the @LoadBalanced
    annotation and the @RibbonClient annotation. We''ll finish off the module with
    a section on how to customize Ribbon''s configuration for things like different
    load balancing algorithms or different ways to check the health of a service before
    sending a request to it.


    ## Client-side vs. Server-side Load Balancing


    So what is load balancing? Simply put, load balancing is a way to improve the
    distribution of workload across multiple computing resources. And you probably
    already knew that, so the more important question is what role does load balancing
    play in a cloud-native architecture? And the answer to that is actually a very
    important one, probably even more important than in a non-cloud-native architecture.
    And the reason for that becomes clearer when you look at the differences in the
    architecture. In a non-cloud-native application, you go from having multiple instances
    of a single application with a single load balancer to multiple services with
    multiple instances and multiple load balancers. And you can start to see the importance
    of a load balancer just by the sheer number of load balancers that we need in
    a cloud-native application. There are typically two different types of load balancers.
    There''s the server-side load balancer where the server is responsible for the
    distribution of the load, and there''s the client-side load balancer where the
    caller is responsible for the distribution of the load. Let''s take a look at
    each of these in a bit more detail. With server-side load balancing, a request
    to another service doesn''t go directly to the service itself and instead goes
    to a server in front of the service, which then decides which of the multiple
    instances it should forward the request to. With client-side load balancing, there
    is no intermediary. The client, or the caller of the service, is aware of all
    of the instances of a service via a known list or service discovery. And the client
    is then responsible for deciding which of the multiple instances it should send
    the request to. To solidify our understanding of server-side versus client-side
    load balancing, let''s look at each of them side by side.


    *   Server-side


    *   Server distributes requests


    *   Hardware or software based


    *   Extra hop


    *   Various balancing algorithms support


    *   Occurs outside of the request process


    *   Centralized or distributed


    *   Client-side


    *   Client distributes request


    *   Software based


    *   No extra hops


    *   Various balancing algorithms support


    *   Occurs within the request process


    *   Typically distributed


     With server-side load balancing, the server obviously distributes the request,
    and with client-side load balancing, the client obviously distributes the request.
    Server-side load balancing is typically hardware based, but it can also be software
    based. Client-side load balancing, on the other hand, is software based. You incur
    an extra hop with server-side load balancing since the request doesn''t go directly
    to the service and has to go through an intermediary first. Whereas with client-side
    load balancing, you don''t incur any extra hops once you know the location of
    the services. Both server-side and client-side load balancing have support for
    various load balancing algorithms. With server-side load balancing, the actual
    load balancing happens outside of the request process, whereas with client-side
    load balancing, the actual load balancing happens within the request process.
    And lastly, server-side load balancing can be either centralized or distributed,
    whereas client-side load balancing is typically distributed. Given all of these
    differences, it''s clear that client-side load balancing is a natural fit for
    cloud-native architectures.


    ## Getting Started with Spring Cloud and Netflix Ribbon


    We''ve set the stage for client-side load balancing. Now let''s talk about how
    to actually implement it with Spring Cloud. As I mentioned in the introduction
    to this module, we''ll use a library called Netflix Ribbon to implement client-side
    load balancing. And Netflix Ribbon is an Inter Process Communication library that
    has built-in software load balancers. Spring Cloud adds full integration with
    Netflix Ribbon to Spring''s RestTemplate class. And we''ll go into detail about
    what this exactly means, but in essence our RestTemplate will now understand how
    to balance requests across multiple instances of a service. Spring Cloud also
    adds features that make it really easy to declare different types of load balancing
    algorithms and availability checks. Next, let''s talk about how to use Spring
    Cloud and Netflix Ribbon. And before we get started, just a quick note. In each
    of these sections I''ll explain all of the steps necessary to kind of get going,
    and then at the end we''ll walk through a demo where you can follow along. Using
    Netflix Ribbon with Spring Cloud is extremely easy, just like all of the other
    Spring Cloud projects.


    Using SpringCloud &Netflix Ribbon


    pom.xml


    <dependencyManagement>


        <dependencies>


            <dependency>


                <groupId>org.springframework.cloud</groupId>


                <artifactId>spring-cloud-dependencies</artifactId>


                <version>Camden.SR2</version><type>pom</type>


                <scope>import</scope></dependency>


         </dependencies>


    </dependencyManagement>


    In your dependencyManagement section of your pom.xml, define a new dependency
    on spring-cloud-dependencies.


    <dependency>


        <groupId>org.springframework.cloud</groupId>


        <artifactId>spring-cloud-starter-ribbon</artifactId>


    </dependency>


    And make sure that it''s of type pom and has a scope of import. Still within your
    pom.xml, in the dependency section, define a new dependency on spring-cloud-starter-ribbon.
    Spring Cloud''s Netflix Ribbon support adds two new annotations.


    *   Two New Annotations


    *   @LoadBalanced : Marks a RestTemplate to support load balancing


    *   @RibbonClient : Used for custom configuration and when Service Discovery is
    absent


    The first one is the @LoadBalanced annotation, and this annotation is used when
    you''re creating a RestTemplate. And it''s used to mark that that RestTemplate
    should be a load balanced RestTemplate as opposed to just a standard RestTemplate.
    The second annotation is the @RibbonClient annotation, and this annotation is
    mainly for configuration purposes. You would use it to configure a custom Ribbon
    client, as well as when you''re not using service discovery to set up an actual
    Ribbon client. Let''s look at how to use the @LoadBalanced annotation first.'
