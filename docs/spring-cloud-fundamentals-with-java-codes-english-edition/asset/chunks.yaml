    # 模块 1：课程概述


    云，或称云计算，真正改变了我们作为开发者思考设计和开发软件的方式。这正是 `Spring Cloud` 发挥用场的地方。`Spring Cloud` 将 `Spring
    Boot` 的优势与经过的云策略相结合，帮助你充分利用这些新范式，以设计和开发云原生应用程序。我们将涵盖的一些主要主题包括使用 `Spring Cloud`
    和 `Netflix Eureka` 进行服务发现、使用 `Spring Cloud Config Server` 进行分布式配置、使用 `Spring Cloud`
    和 `Netflix Ribbon` 进行客户端负载均衡、通过 `Spring Cloud` 和 `Netflix Zuul` 网关进行智能路由，以及使用
    `Spring Cloud` 和 `Netflix Hystrix` 实现容错。读完本书，你将学会如何构建充分利用云资源的应用程序。在开始学习之前，你应该熟悉
    `Java`、`Spring Boot`，并对微服务至少有入门级别的理解。


    # 模块 2：熟悉 Spring Cloud


    ## 名声显赫的“云”


    我确定你一定听过名为“云”的名声显赫的东西，因为它经常被吹嘘成游戏规则改变者或解决一切问题的魔法方案。它能解决你所有的问题。如今有这么多要学习的东西，很难不忽略其中大部分，并仅仅将其视为高明的营销手段。但现在，公司和企业终于开始真正地拥抱云，其中一些吹嘘实际上正在变成现实。而且，企业和公司使用云已成为常态而非例外。作为软件工程师，我认为我们未来面临着非常令人兴奋的时刻。云计算，或云，真的改变了我们构建软件的方式。我们正在从使用集式的单体架构转向分布式的、微服务的应用程序。不仅是软件在变，硬件也在变。我们正在从这种管理的有限资源转向无限、按需且自助的资源。


    ## 云带来的新挑战


    随着云的出现，带来了新的挑战。我们必须改变思考方式。事情不再像习惯的那样静态，我们不能仅仅使用习惯的原则或技术进行设计和架构。云是弹性的且瞬态的。事物可以在任何时候增长、收缩、出现和消失。因此，我们必须考虑云是一个不断变化和演化的事物，而我们可能习惯了相对静态的东西。我们不能简单地将现有应用程序迁移到云端，并期望它们自动实现云化。这通常被称为“平移迁移”（lift
    and shift migration）。当然，迁移到云会带来一些收益，但我们并没有充分利用云。为了充分利用云，需要改变。这正是 `Spring Cloud`
    帮助的地方。`Spring Cloud` 帮助你构建云原生应用程序。现在，你可能会问什么是云原生应用程序？嗯，云原生应用程序意味着你的应用程序是专门为云构建和工程化的。这意味着你的应用程序充分利用了所有的云范式。`Spring
    Cloud` 本身并不是一个框架。广义地说，`Spring Cloud` 用于描述许多属于同一伞下的项目。在本书中，我们将关注基础知识，即 `Spring
    Cloud Config` 和 `Spring Cloud Netflix`。


    # 本书的重点


    *   服务发现

    *   分布式

    *   配置

    *   智能路由

    *   客户端负载均衡

    *   断路器


    我们将专门针对几个关键领域。首先，我们将查看服务发现。如何在运行时在云中动态查找你的应用程序服务？然后，我们将转向分布式配置，或者说如何在分布式系统中管理通用或特定服务的配置。接着，我们将查看智能路由，或者说如何通过智能路由让分布式系统看起来像一个单一的凝聚系统。然后，我们将查看客户端负载均衡，或者你如何在同一服务的多个实例之间分配负载。最后，我们将查看如何使用断路器模式在云中构建容错应用程序。


    ## 先决条件


    *   Java 8+

    *   Spring Boot 1.4+

    *   微服务或 SOA 知识

