    \ file, which overrides all of the property sources below it. Don't forget that\
    \ we also have a couple other endpoints, like an endpoint to request the .properties\
    \ file or the .yml file.\n\n![](images/00022.jpeg)\n\nSo if we go up here, we\
    \ take out /prod and we replace it with .properties, we'll see that it returns\
    \ back a properties file. And you'll see that it's actually applied all of the\
    \ property sources in the order which take precedence. So you see that some.other.property\
    \ is still global, but some.property was overridden by the app specific overridden\
    \ value.\n\n![](images/00023.jpeg)\n\nAnd you can do the same thing with YAML.\
    \ It will actually convert the source.properties files into YAML format for you.\
    \ So instead of .properties, we'll replace this with .yml, and we hit Return,\
    \ and you can see that it output the same configuration in YAML format.\n\n##\
    \ Using the Spring Cloud Config Client\n\nNow that we've seen how the Spring Cloud\
    \ Config Server works and how to get one set up, let's look at the other end of\
    \ the equation, the Client. At its core, the Config Client is responsible for\
    \ bootstrapping and fetching application configuration. So what do I mean when\
    \ I say that the Config Client is responsible for bootstrapping application configuration?\
    \ Well, when a Spring application starts up, it needs to resolve its property\
    \ sources. And it needs to do that very early on in the startup process. Some\
    \ of the reasons for that are things like your property placeholders. When you\
    \ resolve those, it needs to actually have the values to resolve the placeholders.\
    \ And since the configuration lives on the Configuration Server, that means that\
    \ the Config Client needs to fetch the application configuration before the Spring\
    \ application context has even technically started. If it waited until the application\
    \ was fully started, it would be too late in the process. There are two different\
    \ ways that you can get the Config Client to bootstrap your application properties,\
    \ and they both use a special file called the bootstrap.properties or the bootstrap.yml.\
    \ The first way is Config First, and you do that by configuring a bootstrap.yml\
    \ or a bootstrap.properties that has the application name, as well as the URL\
    \ to the Configuration Server. The second way is Discovery First, and that's using\
    \ service discovery. So you would configure your bootstrap.properties or bootstrap.yml\
    \ to have the application name and then the location of the Service Discovery\
    \ Server. And it would use that to then find the Config Server so that it could\
    \ fetch your configuration. Setting up an application to use the Spring Cloud\
    \ Config Client is even easier than setting up the Spring Cloud Config Server.\n\
