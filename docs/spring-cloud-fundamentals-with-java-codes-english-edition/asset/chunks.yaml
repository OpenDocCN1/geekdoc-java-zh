    if you''re using simple configuration, your services are going to continue to
    try to send traffic to those failed instances. For example here, we have Application
    Service B being called by Application Service A, and it has two instances. And
    if one of those instances fails, Application Service A is not going to know the
    better, and it''s going to continue to send traffic to that failed instance. We
    need something that is more dynamic. The simple approach is just far too static.
    It''s too frozen in time for our needs in the cloud. That''s where service discovery
    comes into play.


    *   Service discovery provides


    *   A way for a service to register itself


    *   A way for a service to deregister itself


    *   A way for a client to find other services


    *   A way to check the health of a service and remove unhealthy instances


    Service discovery typically provides the following types of functionality. A way
    for a service to register itself. And what that means is that when a service comes
    online it can call out to the Service Discovery Server and let it know the location
    and port of its service so that other application services can call it. For the
    exact opposite reasons, service discovery provides a way for a service to deregister
    itself. So if a service were to shut down or go away temporarily for upgrades,
    it would want to let the Service Discovery Server know that it''s no longer available
    for clients to use. And, most importantly, service discovery provides a way for
    clients to find other services. And what do I mean by clients? Well I mean other
    application services. So if you''re an application service that needs to use another
    service, you need to be able to find the location and port of that service, and
    you can ask the Service Discovery Server for that information. Lastly, service
    discovery provides a way to check the health of a service and remove any unhealthy
    instances. So each application service would implement a health check, typically
    via a REST endpoint, and then the Service Discovery Server would call that endpoint.
    And if the health check were to fail, it would remove that instance from its registry.


    ## Introducing Spring Cloud Netflix


    Now that we have a good understanding of what service discovery is and why it''s
    important, let''s learn how Spring Cloud helps us implement it.


    *   Discover services with:


    *   Spring Cloud Consul


    *   Spring Cloud Zookeeper


    *   Spring Cloud Netflix


    There are actually several different ways that you can discover services using
    Spring Cloud. There''s the Spring Cloud Consul project, there''s the Spring Cloud
    Zookeeper project, and there''s the Spring Cloud Netflix project. We''re going
    to specifically focus on the last one, the Spring Cloud Netflix project. The folks
    over at Netflix have some serious experience building scalable applications in
    the cloud. And, in fact, you could probably even argue they have some of the largest
    scalability problems you can imagine. And they built some projects internally
    to handle these problems and eventually released them as open source projects.


    *   Netflix OSS + Spring + Spring Boot


                             = Spring Cloud Netflix'
