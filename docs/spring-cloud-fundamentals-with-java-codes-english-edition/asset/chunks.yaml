  trans: "\n在主应用程序类中，定义两个新注解：`@RestController` 注解和 `@EnableDiscoveryClient` 注解。然后，在类顶部定义一个新的字符串数组，即\
    \ `private String[] array`。将其命名为 `weather`，然后我们将它设置为四个不同的值。我们将其设置为 `sunny`、`cloudy`、`rainy`\
    \ 和 `windy`。接下来，我们将定义一个 `getWeather` 方法。来到这里底部输入 `public String getWeather()`。这将是我们的处理方法，所以让我们用\
    \ `@GetMapping` 对此进行注。。我们将 URL 设置为 `/weather`。在方法体中，我们将选择一个 0 到 4 之间（不包含 4）的随机数，然后用它来选择一个随机天气值。我们写\
    \ `int rand = ThreadLocalRandom.current().nextInt(0, 4)` 并给它一个从 0 到 4 的边界。然后，我们将返回\
    \ `weather[rand]` 来选取一个随机天气值。我们的天气服务的代码部分就这些了。\n\n接下来，我们还需要进行一些配置。请导航到 `src/main/resources`\
