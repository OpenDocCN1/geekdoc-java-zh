  trans: '

    我们将从关于云原生或分布式系统中故障的简短章节开始本模块。我们将探讨为什么故障会更加普遍，并理解一种被称为级联故障的常见副作用。然后，我们将介绍并理解断路器模式（Circuit
    Breaker pattern），并学习它如何帮助我们构建更具容错性的服务。接下来，我们将深入研究 Netflix Hystrix，它是一个容错库，其中就实现了断路器模式。我们将看到
    Spring Cloud 如何通过 `@EnableCircuitBreaker` 注解让我们轻松上手，然后理解如何使用 `@HystrixCommand`
    注解在我们自己的服务中实现断路器模式。最后，我们将通过 Hystrix 的一个非常棒的功能——Hystrix Dashboard 来结束本模块。我们将学习如何启用它、指标是如何收集的、如何解释这些结果，以及如何使用
    Netflix 的另一个项目 `Turbine` 来聚合这些结果。


    # 级联故障与资源过载


    在分布式系统中，如果我们说有什么事情是可以 100% 肯定的，那就是故障是不可避免的。但为什么呢？嗯，故障可能发生在系统的许多不同层面。


    ### 可能发生故障的领域


    * 硬件故障

    * 网络故障

    * 软件故障


    硬件可能会故障，网络可能会故障，软件肯定会故障。分布式系统在这一点上也无不同，但故障发生的概率简单来说大得多。你有更多的硬件、更多的网络和更多的软件。随着这些数量的增加，故障的概率也随之增加。增加故障概率的因素还有分布式系统中进程之间的通信方式。曾经在进程内部进行的进程通信现在是在跨网络完成的。尽管我们现在的网络已经很有弹性了，但跨网络通信故障的概率仍然比进程内通信高得多。分布式系统中故障的一个特别糟糕的副作用是级联故障（cascading
    failure）。级联故障是指系统中的一种故障，其中一个系统的故障会像多米诺骨牌一样级联到系统的其他部分，导致它们也失败。为了更具体一点，假设你有三个服务：`Service
    A`、`Service B` 和 `Service C`。`Service A` 调用 `Service B`，而 `Service B` 调用 `Service
    C`。假设 `Service C` 内存耗尽，为 `Service B` 提供服务的速度非常慢。尽管 `Service B` 可能为调用 `Service
    C` 设置了超时，但有足够的请求在 `Service B` 上堆积，且这些请求需要足够快的速度使用 `Service C`，那么在超时之前，`Service
    B` 的资源就会被完全耗尽，反而导致 `Service B` 失败。同样的问题可能会沿着整个链条向上发生。


    ### 多个问题的共同作用


    * 容错问题

    * 资源过载问题


    这里涉及到多个问题。首先，我们面临容错问题。调用方并并不知道它们正在调用的服务可能会失败，但它们仍然尝试调用该服务。其次，我们面临资源过载问题。调用方被允许在资源几乎无限制的情况下调用依赖服务。


    # 使用断路器模式拥抱故障


    * 学会接受故障

    * 容忍故障

    * 优雅降级

    * 限制消耗消耗

    * 约束使用


    那么，我们如何解决分布式系统中的级联故障和一般的故障问题呢？嗯，我们必须学会接受并容忍故障，并在故障发生时进行优雅降级。因此，当下游依赖服务发生故障时，调用者不尝试调用那个可能失败的依赖服务实际上更好。相反，调用者应该快速失败或优雅降级，例如通过返回旧数据或空结果，并允许故障的服务恢复。然后定期检查服务是否已恢复。反过来，这样做可以减轻任何等待响应的上游服务的压力。我们还需要做的另一件事是限制所消耗的资源。因此，客户端应该对调用依赖服务的允许资源数量设置限制。这样做可以防止这些请求无限制地堆积，否则可能会导致客户端本身也失败。容错的第一种策略实际上是一个广为人知的模式，以至于它有自己的名字。它被称为断路器模式（Circuit
    Breaker pattern）。断路器模式是现代软件中的一种设计模式，用于检测故障并封装防止这些故障不断重新发生的逻辑。“断路器”这个名称源于该模式与真实断路器的工作方式有许多相似之处。你可能熟悉也可能不熟悉什么是断路器，所以让我快速解释一下。断路器是一个防止过多电流流过电路的开关。如果流过电流过多，可能会导致损坏甚至引发火灾。断路器的作用是在检测到流过电流过多时通过断开电路来防止这种情况发生。你很可能家里也有这样的东西来防止电路过载。如果你注意的话，你会发现所有的开关都是向下拨动的，因此所有电路都是闭合的。假设你不小心插入一个高耗电设备导致最右侧的电路过载。断路器会检测到这一点并中断电路或将其打开，防止任何额外的电流流过。你可以看到开关被向上拨起，表示电路已断开，不再有电流流过。到这里，我信你已经看到了真实断路器与断路器模式之间的共同点。它们都是为了检测和防止可能损坏其他组件的故障。


    # 使用 Netflix Hystrix 和 Spring Cloud 实现容错


    Spring Cloud 借助 Netflix 的一个名为 Netflix Hystrix 的库来实现容错。Hystrix 是一个延迟和容错库，它的设计目的是为了停止级联故障并实现分布式系统的弹性。


    * 实现断路器模式

    * 封装调用并监控故障

    * 10 秒滚动窗口

    * 20 个请求量

    * >= 50% 错误率

    * 等待 5 秒后尝试单次请求

    * 回退机制 (Fallbacks)

    * 服务免于过载

    * 线程池、信号量与级联故障


    '
- fmt: "\nIt's a concrete implementation of the Circuit Breaker pattern, and it allows\
    \ you to easily wrap calls and automatically watches them for failures that meet\
    \ a certain volume and air-percentage threshold within a given rolling window.\
    \ The default for the rolling window is 10 seconds, and the request volume must\
    \ be at least 20 requests. And if 50% or more of the requests are errors, then\
    \ the circuit will be tripped and no requests will be allowed through. So if for\
    \ instance you had a thousand requests in a 10 second window, if 500 of them were\
    \ errors, then the circuit would be tripped. Hystrix will periodically recheck\
    \ if the circuit should be closed, and it does that by allowing a single request\
    \ through every 5 seconds. That's the default. And if that request succeeds, then\
    \ it will close the circuit, and if it fails, then it will remain open. Any requests\
    \ that are short-circuited or timed-out or rejected or failed will be given a\
    \ chance to execute what's called a fallback method. And, as I mentioned before,\
    \ a fallback might be something like returning cache data, a default value, or\
    \ just something like an empty response. In addition to the Circuit Breaker pattern,\
    \ Hystrix also has additional functionality that protects services from being\
    \ overloaded. All Hystrix wrap calls are bounded either by a thread pool or a\
    \ semaphore. And what this does is it constrains the resource usage, like we talked\
    \ about earlier, so that requests don't stack up and consume all of the valuable\
    \ resources. And in the event that all of the available resources are consumed,\
    \ any new requests will fail immediately and execute the fallback method, if one\
    \ is available.\n\n## Using Spring Cloud and Netflix Hystrix\n\nUsing Spring Cloud\
    \ and Netflix Hystrix is extremely easy. And before we dive in, just a quick note.\
    \ I'll explain all the steps necessary to get going and then walk you through\
    \ a demo at the end where you can kind of follow along. I'll follow that pattern\
    \ throughout the remainder of this module, so just keep that in mind.\n\n### pom.xml\n\
    \n```xml\n<dependencyManagement>\n    <dependencies>\n        <dependency>\n \
    \           <groupId>org.springframework.cloud</groupId>\n            <artifactId>spring-cloud-dependencies</artifactId>\n\
    \            <version>Camden.SR2</version>\n            <type>pom</type>\n   \
    \         <scope>import</scope>\n        </dependency>\n    </dependencies>\n\
    </dependencyManagement>\n```\n\nJust like you use all of the other Spring Cloud\
    \ projects, you start by including a dependency in the dependencyManagement section\
    \ of your `pom.xml` on `spring-cloud-dependencies`. And, as always, make sure\
    \ that it's of type pom and has a scope of import.\n\n```xml\n<dependency>\n \
    \   <groupId>org.springframework.cloud</groupId>\n    <artifactId>spring-cloud-starter-hystrix</artifactId>\n\
    </dependency>\n\n<dependency>\n    <groupId>org.springframework.boot</groupId>\n\
    \    <artifactId>spring-boot-actuator</artifactId>\n</dependency>\n```\n\nThen,\
    \ still within your `pom.xml`, within the dependency section, define a new dependency\
    \ on `spring-cloud-starter-hystrix`. And if you'd like to be able to consume metrics\
    \ for your Hystrix calls, you'll also need to include a dependency on the `spring-boot-actuator`.\n\
    \n```java\n@SpringBootApplication\n@EnableCircuitBreaker\npublic class Application{\n\
    \    public static void main(String[]args){\n        SpringApplication.run(Application.class,args);\n\
    \    }\n}\n```\n\nIn your main `Application` class, you define a new annotation,\
    \ and that's the `@EnableCircuitBreaker` annotation.\n\n```java\n@Service\npublic\
    \ class Service{\n    @HystrixCommand(fallbackMethod=\"somethingElse\")\n    public\
    \ void doSomething(){\n        …\n    }\n\n    public void somethingElse(){\n\
    \        …\n    }\n}\n```\n\nAnd then in either your `@Component` or your `@Service`\
    \ class, locate the method that you want to wrap with Hystrix, in our case this\
    \ will be a method called `doSomething`, and annotate that method with the `@HystrixCommand`.\
    \ Then, on the `@HystrixCommand` annotation, define a new attribute called `fallbackMethod`,\
    \ and set that to the name of the method that you want to fall back to in the\
    \ event of a failure. In terms of code, that's all there is to it.\n\n- Be careful\
    \ with Hystrix timeouts\n- Ensure timeouts encompass caller timeouts plus any\
    \ retries\n- Default: 1000ms\n- `hystrix.command.default.execution.isolation.thread.timeoutInMilliseconds=<timeout_ms>`\n\
    \nBut there's a gotcha that you have to look out for, and that's around the Hystrix\
    \ timeout. And you need to make sure that your Hystrix timeouts encompass the\
    \ caller timeouts plus any of the retries and then a little bit of a buffer. The\
    \ default timeout is set to 1000ms or a second, and if you need to change it,\
    \ you can use this big, long property to set the timeout in milliseconds.\n\n\
    ## Demo: Implementing Fault Tolerance with Netflix Hystrix\n\nIn this demo, we'll\
    \ build a simple weather service that returns a random weather condition, and\
    \ then we'll use that in another app called the weather app that consumes that\
    \ service. And in the weather app we'll protect our call to the weather service\
    \ with Hystrix and implement a fallback for when the weather service is down or\
    \ not responding. We'll be using service discovery to locate the weather service\
    \ from our weather app.\n\nGo ahead and head over to `start.io`. In the Group\
    \ section, change the group to `ajay.kumar`, and then for the name of the artifact,\
    \ name it `weather-service`. In the Dependencies section, add `Web` and `Discovery`.\
    \ Once you have everything filled out, go ahead and click the Generate button,\
    \ and it'll create a zip file for you.\n\nWe're also going to use this page to\
    \ generate the weather app, so still on this page change the name of the artifact\
    \ from `weather-service` to `weather-app`. Then in the Dependencies section, add\
    \ `Hystrix` and `Actuator`. Again, once you have everything filled out, go ahead\
    \ and click the Generate button, and it'll create and download that zip file for\
    \ you.\n\nGo ahead and unzip both of those zip files and head back to your IDE.\
    \ Back within your IDE, right-click on the empty space and choose Import, Existing\
    \ Maven Projects, click Next, browse to the location of your downloaded zip file,\
    \ and click Finish. Once you have the weather service imported, repeat the same\
    \ process for the weather app. I have both projects imported into the IDE.\n\n\
    We'll start by developing the weather service first, so go ahead and expand the\
    \ `weather-service` and navigate to the main class.\n\n```java\npackage io.ajay.kumar.weatherservice;\n\
    \nimport java.util.concurrent.ThreadLocalRandom;\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.client.discovery.EnableDiscoveryClient;\n\
    import org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\
    \n@SpringBootApplication\n@RestController\n@EnableDiscoveryClient\npublic class\
    \ WeatherServiceApplication {\n    private String[] weather = new String[] { \"\
    sunny\", \"cloudy\", \"rainy\", \"windy\" };\n\n    public static void main(String[]\
    \ args) {\n        SpringApplication.run(WeatherServiceApplication.class, args);\n\
    \    }\n\n    @GetMapping(\"/weather\")\n    public String getWeather() {\n  \
    \      int rand = ThreadLocalRandom.current().nextInt(0, 4);\n        return weather[rand];\n\
    \    }\n}\n```\n"
  raw: 'It''s a concrete implementation of the Circuit Breaker pattern, and it allows
    you to easily wrap calls and automatically watches them for failures that meet
    a certain volume and air-percentage threshold within a given rolling window. The
    default for the rolling window is 10 seconds, and the request volume must be at
    least 20 requests. And if 50% or more of the requests are errors, then the circuit
    will be tripped and no requests will be allowed through. So if for instance you
    had a thousand requests in a 10 second window, if 500 of them were errors, then
    the circuit would be tripped. Hystrix will periodically recheck if the circuit
    should be closed, and it does that by allowing a single request through every
    5 seconds. That''s the default. And if that request succeeds, then it will close
    the circuit, and if it fails, then it will remain open. Any requests that are
    short-circuited or timed-out or rejected or failed will be given a chance to execute
    what''s called a fallback method. And, as I mentioned before, a fallback might
    be something like returning cache data, a default value, or just something like
    an empty response. In addition to the Circuit Breaker pattern, Hystrix also has
    additional functionality that protects services from being overloaded. All Hystrix
    wrap calls are bounded either by a thread pool or a semaphore. And what this does
    is it constrains the resource usage, like we talked about earlier, so that requests
    don''t stack up and consume all of the valuable resources. And in the event that
    all of the available resources are consumed, any new requests will fail immediately
    and execute the fallback method, if one is available.


    ## Using Spring Cloud and Netflix Hystrix


    Using Spring Cloud and Netflix Hystrix is extremely easy. And before we dive in,
    just a quick note. I''ll explain all the steps necessary to get going and then
    walk you through a demo at the end where you can kind of follow along. I''ll follow
    that pattern throughout the remainder of this module, so just keep that in mind.


    pom.xml


    <dependencyManagement>


        <dependencies>


            <dependency>


    <groupId>org.springframework.cloud</groupId>


    <artifactId>spring-cloud-dependencies</artifactId>


    <version>Camden.SR2</version>


    <type>pom</type>


    <scope>import</scope>


            </dependency>


        </dependencies>


    </dependencyManagement>


    Just like you use all of the other Spring Cloud projects, you start by including
    a dependency in the dependencyManagement section of your pom.xml on spring-cloud-dependencies.
    And, as always, make sure that it''s of type pom and has a scope of import.


    <dependency>


        <groupId>org.springframework.cloud</groupId>


        <artifactId>spring-cloud-starter-hystrix</artifactId>


    </dependency>


    <dependency>


        <groupId>org.springframework.boot</groupId>


        <artifactId>spring-boot-actuator</artifactId>


    </dependency>


    Then, still within your pom.xml, within the dependency section, define a new dependency
    on spring-cloud-starter-hystrix. And if you''d like to be able to consume metrics
    for your Hystrix calls, you''ll also need to include a dependency on the spring-boot-actuator.


    @SpringBootApplication


    @EnableCircuitBreaker


    public class Application{


        public static void main(String[]args){


            SpringApplication.run(Application.class,args);


        }


    }


    In your main Application class, you define a new annotation, and that''s the @EnableCircuitBreaker
    annotation.


    @Service


    public class Service{


    @HystrixCommand(fallbackMethod="somethingElse")


    public void doSomething(){


    …


    }


    public void somethingElse(){


    …


    }


    }


    And then in either your @Component or your @Service class, locate the method that
    you want to wrap with Hystrix, in our case this will be a method called doSomething,
    and annotate that method with the @HystrixCommand. Then, on the @HystrixCommand
    annotation, define a new attribute called fallbackMethod, and set that to the
    name of the method that you want to fall back to in the event of a failure. In
    terms of code, that''s all there is to it.


    *   Be careful with Hystrix timeouts


    *   Ensure timeouts encompass caller timeouts plus any retries


    *   Default: 1000ms


    *   hystrix.command.default.execution.isolation.thread.timeoutInMilliseconds=<timeout_ms>


    But there''s a gotcha that you have to look out for, and that''s around the Hystrix
    timeout. And you need to make sure that your Hystrix timeouts encompass the caller
    timeouts plus any of the retries and then a little bit of a buffer. And the default
    timeout is set to 1000ms or a second, and if you need to change it, you can use
    this big, long property to set the timeout in milliseconds.


    ## Demo: Implementing Fault Tolerance with Netflix Hystrix


    In this demo, we''ll build a simple weather service that returns a random weather
    condition, and then we''ll use that in another app called the weather app that
    consumes that service. And in the weather app we''ll protect our call to the weather
    service with Hystrix and implement a fallback for when the weather service is
    down or not responding. We''ll be using service discovery to locate the weather
    service from our weather app, so make sure that you have the Service Discovery
    Server set up within your IDE. And if you''ve been following along throughout
    the course, you should already have this set up. Go ahead and open up a browser
    and head over to start.spring.io. In the Group section, change the group to io.ajay.kumar,
    and then for the name of the artifact, name it weather-service. In the Dependencies
    section, add the Web dependency and the Eureka Discovery dependency.


    ![](images/00046.gif)


     Once you have everything filled out, go ahead and click the Generate Project
    button, and it''ll create and download a zip file for you. We''re also going to
    use this page to generate the weather app project, so still on this page change
    the name of the artifact from weather-service to weather-app. Then in the Dependencies
    section, add the Hystrix dependency and the Actuator dependency.


    ![](images/00047.gif)


    Again, once you have everything filled out, go ahead and click the Generate Project
    button, and it''ll create and download that zip file for you. Go ahead and unzip
    both of those zip files and head back to your IDE. Back within your IDE, right-click
    on the empty space and choose Import, choose Existing Maven Projects, click Next,
    browse to the location of your downloaded zip file, and click Finish. Once you
    have the weather service imported, repeat the same process for the weather app.
    I have both projects imported into the IDE.


    ![](images/00048.gif)


    We''ll start by developing the weather service first, so go ahead and expand the
    weather-service and navigate to the main application class.


    package io.ajay.kumar.weatherservice;


    import java.util.concurrent.ThreadLocalRandom;


    import org.springframework.boot.SpringApplication;


    import org.springframework.boot.autoconfigure.SpringBootApplication;


    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;


    import org.springframework.web.bind.annotation.GetMapping;


    import org.springframework.web.bind.annotation.RestController;


    @SpringBootApplication


    @RestController


    @EnableDiscoveryClient


    public class WeatherServiceApplication {


            private String[] weather = new String[] { "sunny", "cloudy", "rainy",
    "windy" };


            public static void main(String[] args) {


                    SpringApplication.run(WeatherServiceApplication.class, args);


            }


            @GetMapping("/weather")


            public String getWeather() {


                    int rand = ThreadLocalRandom.current().nextInt(0, 4);


                    return weather[rand];


            }


    }'
