    ## Creating Filters with Netflix Zuul & Spring Cloud


    One of the key features in Netflix Zuul is the ability to define filters. Filters
    allow you to intercept and control the requests and the responses that pass through
    the gateway. Zuul has support for several different types of filters.


    Filter Types


    *   pre : Before the request


    *   post : After the request


    *   route : Direct the request


    *   error : Handle request errors


    The first one is the pre type filter, which is executed before the request is
    routed. Next comes the route type filter, which allows you to direct the request
    in any way you want. In fact, earlier when we defined the @EnableZuulProxy annotation
    on the main application class, we were telling Spring to set up some predefined
    route filters to proxy our request to back-end services. After route comes the
    post filters, and, as the name suggests, these filters are executed after the
    request is routed. And the last one is the error filter type. The error filter
    type is responsible for handling when any of the previous filter types, the pre,
    route, or posts, results in an error. To define a Zuul filter, you simply extend
    and implement the ZuulFilter class.


