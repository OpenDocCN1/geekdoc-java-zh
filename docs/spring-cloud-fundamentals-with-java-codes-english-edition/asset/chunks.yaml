    ## The Application Client


    *   Calls another application service to implement its functionality


    *   The issuer of requests


    *   Depends on other service(s)


    *   User of the discovery client


    *   Find service locations


    Let''s continue with our deep dive of the components involved in service discovery.
    Up next is the application client. The application client is the piece that would
    call out to another application service to implement some piece of functionality
    in its service. It''s the issuer of requests, and it depends on other services.
    And similar to the application service, the application client is also a user
    of the discovery client, but it uses the discovery client in a different way.
    It doesn''t use it to register or deregister anything. It uses it to find service
    locations. Just to be clear, it''s perfectly reasonable for an application to
    be both a service and a client. An application can be a service, which provides
    services to others, and at the same time can be a client, which depends on other
    services. What we''re referring to here is if the application was just a client
    and it wasn''t a service. The steps involved to set up a client are quite similar
    to the steps involved to set up a service.


    *   Using Spring Cloud Eureka Client in an Application Client


