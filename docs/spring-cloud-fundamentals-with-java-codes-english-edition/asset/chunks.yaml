    ## Updating Configuration at Runtime


    Updating configuration at runtime is easily one of the best features of Spring
    Cloud. With it, you can do things like refresh your @ConfigurationProperties at
    runtime. You can also use it to update the logging levels on any piece of code.
    And the changes happen almost instantaneously. And the best part is that you can
    do all of this without ever restarting your application. So how do you do it?
