    ## Summary


    We''re at the end of this module, so let''s quickly go over what we learned.


    *   Differences between client-side & server-side load balancing


    *   Netflix Ribbon


    *   @LoadBalanced & @RibbonClient


    *   With & without service discovery


    *   Custom Ribbon client configuration


    We first talked about what is load balancing and what are the differences between
    client-side load balancing and server-side load balancing. Then we introduced
    the Netflix Ribbon project and learned how to use the @LoadBalanced and the @RibbonClient
    annotations to set up client-side load balancing with and without service discovery.
    In the last section, we saw how we could use the @RibbonClient annotation with
    a separate @Configuration class to set up custom configuration for a specific
    Ribbon client.


    # Module 7: Creating Self-healing Services with Circuit Breaker


    ## Introduction


    In this module we''ll learn how to develop services in a cloud-native architecture
    that are both fault tolerant and self-healing.


    *   Failures in a distributed system


    *   Cascading failures


    *   Circuit breaker pattern


    *   Netflix Hystrix project


    *   @EnableCircuitBreaker


    *   @HystrixCommand


    *   Hystrix Dashboard


    *   @EnableHystrixDashboard


    *   Turbine to aggregate Hystrix streams


    *   @EnableTurbine'
