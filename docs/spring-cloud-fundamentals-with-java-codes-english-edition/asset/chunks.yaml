  raw: 'We have the same two properties that we used within the application service,
    the spring.application.name, except this time we set it to client, and the eureka.client.defaultZone
    so that it can know the location of the Service Discovery Server. And since we''re
    a client, we''re not interested in registering with the Discovery Server because
    we don''t need anybody to discover us. We''re just interested in discovering others.
    So you set that value to false.


    @SpringBootApplication


    @EnableDiscoveryClient


    public class Application{


    public static void main(String[]args){


    SpringApplication.run(Application.class,args);


    }


    }


    Just like we did with the application service, we''ll add the @EnableDiscoveryClient
    annotation to our main Application class in our application client. And then to
    actually discover services, we have two different options.


    *   @Inject EurekaClientclient


    *   @Inject DiscoveryClientclient


    We can inject the EurekaClient or we can inject the DiscoveryClient. And just
    to be clear, this is the Spring DiscoveryClient and not the Netflix DiscoveryClient.


    InstanceInfo instance=eurekaClient.getNextServerFromEureka(


    "service-id",false);


    String baseUrl = instance.getHomePageUrl();


    The first option is using the EurekaClient, and the EurekaClient has a method,
    getNextServerFromEureka. And that''ll pick the next instance in a round-robin
    fashion from the Discovery Server. And its first argument is a virtual host name
    or a service ID to call. And this is the same as the spring.application.name property
    that we''ve used in our service application. And the second argument is whether
    or not this is a secure request. Once we get a reference to the instance info,
    we can call instance.getHomePageUrl, and that''ll give us the base URL that we
    can use with our RestTemplate to call the service.


    List<ServiceInstance> instances=client.getInstances("service-id");


    String baseUrl=instances.get(0).getUri().toString();


    The second option is to use the Spring DiscoveryClient, and it has a method called
    getInstances, which returns you all service instances for a given service ID.
    So that first argument is the same first argument that we saw in the EurekaClient,
    which is a virtual hostname or a service ID of the service you want to call. And
    once you have a list of instances, you can get one of those instances, and you
    can get the URI, turn it into a string, and that''s your base URL that you would
    use in your RestTemplate.


    ## Demo: Finding and Calling Services as an Application Client


    In order to create our client, we''re going to again start off at start.spring.io.
    And we''re going to give it a group ID, the same one, so io.ajay.kumar, and we''ll
    make the Artifact client. And it will have the exact same dependencies that we
    used in the application service. So we want Eureka Discovery, want DevTools, and
    we want the Actuator.


    ![](images/00007.gif)


    Click Generate Project. That''ll automatically create and download a zip file.
    Go ahead and unzip that file, and we''ll import that into our IDE. Within Spring
    Tool Suite in the Package Explorer area, right-click in the empty area, go to
    Import, choose Existing Maven Projects, browse to the location of your unzipped
    file, ensure that the pom.xml shows up under the Projects heading, and click Finish
    to import.


    ![](images/00008.gif)


    Expand the client project, and go to src/main/java, and open up the main application
    class and do the following changes.


    package io.ajay.kumar.client;


    import org.springframework.beans.factory.annotation.Autowired;


    import org.springframework.boot.SpringApplication;


    import org.springframework.boot.autoconfigure.SpringBootApplication;


    import org.springframework.boot.web.client.RestTemplateBuilder;


    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;


    import org.springframework.http.HttpMethod;


    import org.springframework.http.ResponseEntity;


    import org.springframework.web.bind.annotation.RequestMapping;


    import org.springframework.web.bind.annotation.RestController;


    import org.springframework.web.client.RestTemplate;


    import com.netflix.appinfo.InstanceInfo;


    import com.netflix.discovery.EurekaClient;


    @EnableDiscoveryClient


    @SpringBootApplication


    @RestController


    public class ClientApplication {


            @Autowired


            private EurekaClient client;


            @Autowired


            private RestTemplateBuilder restTemplateBuilder;


            public static void main(String[] args) {


                    SpringApplication.run(ClientApplication.class, args);


            }


            @RequestMapping("/")


            public String callService() {


                    RestTemplate restTemplate = restTemplateBuilder.build();


                    InstanceInfo instanceInfo = client.getNextServerFromEureka("service",
    false);


                    String baseUrl = instanceInfo.getHomePageUrl();


                    ResponseEntity<String> response =


                                    restTemplate.exchange(baseUrl, HttpMethod.GET,
    null, String.class);


                    return response.getBody();


            }


    }


    In the main application class, add a new annotation, @EnableDiscoveryClient. We''ll
    also add a @RestController annotation, and we''ll add a handler method, public
    String callService. And we''ll give this an @RequestMapping, and we''ll map this
    to root. Then we''ll want to autowire in our DiscoveryClient or our EurekaClient.
    We''ll use the EurekaClient, so private EurekaClient. We''ll call it client. And
    we''ll use @Autowired. You can also use @Inject. And we''ll also need a RestTemplate
    so we can actually call the service, so we''ll say private RestTemplateBuilder,
    and we''ll call this a restTemplateBuilder. We will autowire that as well. And
    within our callService method, we''ll create a new RestTemplate using the RestTemplateBuilder,
    so RestTemplate restTemplate = restTemplateBuilder.build. And then we''re going
    to use the client to fetch our service URLs, so client.getNextServerFromEureka.
    And the virtualHostname, remember we called our spring.application.name of our
    service. We just called it service. And it''s going to be a non-secure request,
    so put false. And this returns an InstanceInfo, which we''ll call instanceInfo.
    And then we can get the base URL and call the RestTemplate, so String baseUrl
    = instanceInfo.getHomePageUrl. And then we''ll use the RestTemplate to call the
    service. So the RestTemplate returns ResponseEntity of String. We''ll call that
    response, and we''ll say restTemplate.exchange. And we''ll pass at the baseUrl
    and HttpMethod of GET. We don''t have any request bodies, so we''ll do the requestEntity
    as null, the responseType as String, and we don''t have any uriVariables either,
    so we''ll just get rid of that parameter. And let''s just go over this again before
    we finish up here. So the EurekaClient is calling out to the Discovery Server,
    and it''s getting information about a service ID called service, and it''s returning
    it back to us as an instanceInfo. And then from that instanceInfo, we''re getting
    the HomePageUrl, which is the base URL of our service, and then we''re using our
    restTemplate to call that service, specifically a GET on that service, and it
    returns a string back to us. And then we''re just going to return that response,
    so response.getBody.


    application.properties :


    spring.application.name=client


    eureka.client.service-url.defaultZone=http://localhost:8761/eureka


    eureka.client.register-with-eureka=false'
