    ## Using the @RibbonClient Annotation


    Now let''s take a look at the other annotation, the @RibbonClient annotation.
    First we''ll see how to use this annotation along with the @LoadBalanced annotation
    to achieve client-side load balancing without service discovery.


    @Configuration


    @RibbonClient(name="someservice")


    public class MyConfiguration{


    ...


    }


    In your @Configuration class, define the @RibbonClient annotation and set the
    name element to a meaningful value. You''ll actually refer to this value in the
    configuration, as well as the URL of the RestTemplate.


    application.properties


    <ribbon_client_name>.ribbon.eureka.enabled=false


    <ribbon_client_name>.ribbon.listOfServers=http://host:9000, http://host:9001


    OR


    application.yml


    <ribbon_client_name>:ribbon:eureka:enabled: false


    listOfServers=http://host:9000, http://host:9001


    * Replace <ribbon_client_name> with the name field value of @RibbonClient


    Then, in your application.properties or your application.yml, define two new properties.
    And remember the name element that we set on the @RibbonClient annotation. You''ll
    prefix each of your properties with that value. So the first property, the ribbon_client_name.ribbon.eureka.enabled=false,
    tells Ribbon to disable service discovery support. The next property, the ribbon_client_name.ribbon.listOfServers,
    is a comma-separated list of URLs that Ribbon should use to distribute the requests
    among. And in this case, we''ve set the different URLs to two different addresses,
    one running on port 9000 and the other running on port 9001\.


    restTemplate.getForEntity("http://someservice/",...)


    Once you have everything configured, you can use the RestTemplate just like you
    did with service discovery. Except this time instead of calling the service name,
    you use the value of the name element that you set up in the @RibbonClient annotation.


