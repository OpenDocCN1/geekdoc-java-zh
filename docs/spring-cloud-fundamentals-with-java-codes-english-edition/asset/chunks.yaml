  trans: "\n它是断路器（Circuit Breaker）模式的一种具体实现，允许你轻松地封装调用，并在给定的滚动窗口内自动监控是否达到特定数量和空气百分比阈值的失败情况。滚动窗口的默认值为\
    \ 10 秒，且请求量必须至少达到 20 次。如果请求的错误率达到 50% 或以上，断路就会触发，不再允许任何请求通过。例如，如果你在 10 秒的窗口内有\
    \ 1000 次请求，其中 500 次是错误，那么断路就会触发。Hystrix 会定期检查断路是否应该关闭，其方法是每 5 秒允许一个请求通过。这是默认设置。如果该请求成功，它将关闭断路；如果失败，它将继续保持开启状态。任何被短路、超时、被拒绝或失败的请求都获得机会执行所谓的“降级方法（fallback\
    \ method）”。正如我之前提到的，降级可能类似于返回缓存数据、默认值，或者仅仅是一个空响应。除了断路器模式外，Hystrix 还具有保护服务免于过载的额外功能。所有\
    \ Hystrix 封装的调用都受到线程池或信号量的限制。此举的作用是限制资源使用（正如我们之前讨论的那样），防止请求堆积并消耗所有宝贵资源。在所有可用资源都已耗尽的情况下，任何新请求将立即失败并执行降级方法（如果可用的话）。\n\
    \n## 使用 Spring Cloud 和 Netflix Hystrix\n\n使用 Spring Cloud 和 Netflix Hystrix 非常简单。在我们深入之前，先简单说明一下：我将解释启动所需的所有步骤，并在最后带你通过一个演示，你大可以在那里跟着操作。在本模块的剩余部分中，我将遵循这一模式，所以请记住这一点。\n\
    \n### pom.xml\n\n```xml\n<dependencyManagement>\n    <dependencies>\n        <dependency>\n\
    \            <groupId>org.springframework.cloud</groupId>\n            <artifactId>spring-cloud-dependencies</artifactId>\n\
    \            <version>Camden.SR2</version>\n            <type>pom</type>\n   \
    \         <scope>import</scope>\n        </dependency>\n    </dependencies>\n\
    </dependencyManagement>\n```\n\n就像使用所有其他 Spring Cloud 项目一样，你首先要在 `pom.xml` 的 `dependencyManagement`\
    \ 部分包含 `spring-cloud-dependencies` 依赖。一如既常，确保它的类型为 `pom` 且范围（scope）为 `import`。\n\
    \n```xml\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n   \
    \ <artifactId>spring-cloud-starter-hystrix</artifactId>\n</dependency>\n\n<dependency>\n\
    \    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-actuator</artifactId>\n\
    </dependency>\n```\n\n然后，在你的 `pom.xml` 的 `dependency` 部分，定义对 `spring-cloud-starter-hystrix`\
    \ 的新依赖。如果你能够获取 Hystrix 调用的指标，还需要包含对 `spring-boot-actuator` 的依赖。\n\n```java\n@SpringBootApplication\n\
    @EnableCircuitBreaker\npublic class Application{\n    public static void main(String[]args){\n\
    \        SpringApplication.run(Application.class,args);\n    }\n}\n```\n\n在你的主\
    \ `Application` 类中，你定义了一个新注解，即 `@EnableCircuitBreaker` 注解。\n\n```java\n@Service\n\
    public class Service{\n    @HystrixCommand(fallbackMethod=\"somethingElse\")\n\
    \    public void doSomething(){\n        …\n    }\n\n    public void somethingElse(){\n\
    \        …\n    }\n}\n```\n\n然后，在你的 `@Component` 或 `@Service` 类中，找到你想用 Hystrix\
    \ 封装的方法（在我们的案例中，这是一个名为 `doSomething` 的方法），并在该方法上加上 `@HystrixCommand` 注解。然后，在 `@HystrixCommand`\
    \ 注解上定义一个名为 `fallbackMethod` 的新属性，并将其设置为在发生故障时想要回退的方法名称。在代码方面，就是只有这些了。\n\n- 小心\
    \ Hystrix 超时\n- 确保超时包含了调用者超时加上任何重试时间\n- 默认值：1000ms\n- `hystrix.command.default.execution.isolation.thread.timeoutInMilliseconds=<timeout_ms>`\n\
    \n但有一个必须注意的陷阱，就是关于 Hystrix 超时的。你需要确保你的 Hystrix 超时包含了调用者超时加上任何重试时间，然后再留出一点缓冲区。默认超时设置为\
    \ 1000ms（即 1 秒），如果你需要更改它，可以使用这个长属性来设置毫秒单位的超时。\n\n## 演示：使用 Netflix Hystrix 实现容错\n\
    \n在这个演示中，我们将构建一个简单的天气服务，返回随机的天气状况，然后我们在另一个名为 `weather app` 的应用中使用该服务。在 `weather\
    \ app` 中，我们将使用 Hystrix 保护对天气服务的调用，并在天气服务宕机或无响应时实现降级处理。我们将使用服务发现功能来从 `weather app`\
    \ 定位天气服务。\n\n前往 `start.io`。在 `Group` 部分，将组更改为 `ajay.kumar`，然后将 `artifactId` 名称为\
    \ `weather-service`。在 `Dependencies` 部分，添加 `Web` 和 `Discovery`。填写完成后，点击 `Generate`\
    \ 按钮，它会创建一个压缩包。\n\n我们还将使用该页面生成 `weather app`，因此在同一页面将 `artifactId` 从 `weather-service`\
    \ 改为 `weather-app`。在 `Dependencies` 部分，添加 `Hystrix` 和 `Actuator`。同样，填写完成后，点击 `Generate`\
    \ 按钮，它会创建并下载该压缩包。\n\n解压这两个压缩包并回到你的 IDE。在 IDE 中，右键点击空白处选择 `Import` -> `Existing\
    \ Maven Projects`，点击 `Next`，浏览到下载的压缩包位置，然后点击 `Finish`。在导入天气服务后，对 `weather app`\
    \ 重复相同过程。我已经将两个项目都导入了 IDE。\n\n我们将首先开发天气服务，所以展开 `weather-service` 并导航到主类。\n\n```java\n\
    package io.ajay.kumar.weatherservice;\n\nimport java.util.concurrent.ThreadLocalRandom;\n\
    import org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;\nimport\
    \ org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\
    \n@SpringBootApplication\n@RestController\n@EnableDiscoveryClient\npublic class\
    \ WeatherServiceApplication {\n    private String[] weather = new String[] { \"\
    sunny\", \"cloudy\", \"rainy\", \"windy\" };\n\n    public static void main(String[]\
    \ args) {\n        SpringApplication.run(WeatherServiceApplication.class, args);\n\
    \    }\n\n    @GetMapping(\"/weather\")\n    public String getWeather() {\n  \
    \      int rand = ThreadLocalRandom.current().nextInt(0, 4);\n        return weather[rand];\n\
    \    }\n}\n```\n\n"
- fmt: "\nIn the main application class, define two new annotations, the `@RestController`\
    \ annotation and the `@EnableDiscoveryClient` annotation. Then, at the top of\
    \ the class, define a new string array, so `private String[] array`. Go ahead\
    \ and call it `weather`, and then we're going to set that to four different values.\
    \ We're going to say `sunny`, `cloudy`, `rainy`, and `windy`. Next, we'll go ahead\
    \ and define a `getWeather` method. So come to the bottom here and type `public\
    \ String getWeather()`. And this will be our handler method, so let's go ahead\
    \ and annotate this with `@GetMapping`. And we'll set the URL to `/weather`. In\
    \ the body of the method, we'll choose a random number before 0 and 4 exclusive,\
    \ and then we'll use that to pick a random weather value. So we'll say `int rand\
    \ = ThreadLocalRandom.current().nextInt(0, 4)` and give that a bound from 0 to\
    \ 4. And then next, we'll return `weather[rand]` to pick a random weather value.\
    \ And that's all we have for the coding part of our weather service.\n\nNext,\
    \ we have a little bit of configuration to do. So go ahead and navigate to `src/main/resources`\
    \ and open up the `application.properties`.\n\n### application.properties\n```\n\
    server.port=9000\nspring.application.name=weather-service\neureka.client.service-url.defaultZone=http://localhost:8761/eureka\n\
    ```\n\nIn the `application.properties`, first we're going to set the `server.port`,\
    \ and we're going to set that to `9000`. And then we're going to set the `spring.application.name`\
    \ property, and we're going to set that to `weather-service`. And the last property\
    \ we're going to set is the location of the Service Discovery Server. So set that\
    \ long `eureka.client` property equal to `http://localhost:8761/eureka`.\n\nWe're\
    \ now finished with the weather service, so let's quickly start it up and make\
    \ sure that everything works. So go ahead and close both of those files and open\
    \ up the `discovery-server`. Navigate to that main application class, right-click\
    \ on it, go to `Run As`, choose `Spring Boot App`. Once the Service Discovery\
    \ Server is started, navigate to the main application class of the `weather-service`,\
    \ right-click on it, `Run As`, `Spring Boot App`. Next, open up a web browser\
    \ and visit `http://localhost:9000/weather`.\n\n![](images/00049.jpeg)\n\nAnd\
    \ just make sure that you get a response here. You can refresh it a few times\
    \ to see that you get various responses. And now that we have our weather service\
    \ working, let's head back to the IDE and utilize it within our weather app.\n\
    \n![](images/00050.gif)\n\nBack within your IDE, expand the `weather-app` and\
    \ navigate to the main application class. Within the main application class, we're\
    \ going to define three new annotations.\n\n```java\npackage io.ajay.kumar.weatherapp;\n\
    \nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.client.circuitbreaker.EnableCircuitBreaker;\n\
    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;\nimport\
    \ org.springframework.cloud.client.loadbalancer.LoadBalanced;\nimport org.springframework.context.annotation.Bean;\n\
    import org.springframework.web.bind.annotation.RestController;\nimport org.springframework.web.client.RestTemplate;\n\
    \n@SpringBootApplication\n@EnableCircuitBreaker\n@EnableDiscoveryClient\n@RestController\n\
    public class WeatherAppApplication {\n    public static void main(String[] args)\
    \ {\n        SpringApplication.run(WeatherAppApplication.class, args);\n    }\n\
    \n    @Bean\n    @LoadBalanced\n    public RestTemplate restTemplate() {\n   \
    \     return new RestTemplate();\n    }\n}\n```\n\nThe first one is the `@EnableCircuitBreaker`\
    \ annotation, the next one is the `@EnableDiscoveryClient` annotation, and the\
    \ last one is the `@RestController` annotation. Next, we'll define a `RestTemplate`\
    \ so that we can call our weather service, so come down here and say `public RestTemplate\
    \ restTemplate()` and call it `restTemplate`. Annotate it with the `@Bean` annotation\
    \ and the `@LoadBalanced` annotation. And then, in the body of the method, `return\
    \ new RestTemplate()`.\n\nNow remember a `Hystrix` command can only be defined\
    \ in an `@Component` or an `@Service` class, so let's go up here and create a\
    \ new class. So right-click, go to `New`, choose `Class`, and we'll call this\
    \ the `WeatherService`.\n\n```java\npackage io.ajay.kumar.weatherapp;\n\nimport\
    \ javax.inject.Inject;\nimport org.springframework.stereotype.Service;\nimport\
    \ org.springframework.web.client.RestTemplate;\nimport com.netflix.hystrix.contrib.javanica.annotation.HystrixCommand;\n\
    \n@Service\npublic class WeatherService {\n    @Inject\n    private RestTemplate\
    \ restTemplate;\n\n    @HystrixCommand(fallbackMethod = \"unknown\")\n    public\
    \ String getWeather() {\n        return restTemplate.getForEntity(\"http://weather-service/weather\"\
    , String.class).getBody();\n    }\n\n    public String unknown() {\n        return\
    \ \"unknown\";\n    }\n}\n```\n\nAt the top of the class, go ahead and annotate\
    \ it with `@Service`. And next we'll need our `RestTemplate`, so `private RestTemplate\
    \ restTemplate`. And make sure that we `@Inject` that. And next we're going to\
    \ need a method to call our weather service, so come below this and type `public\
    \ String getWeather()`. Then, in the body of the method, we'll return `restTemplate.getForEntity`.\
    \ And the URL we'll use is `http://weather-service/weather`. And then the response\
    \ type will be a string, so we'll say `String.class`. And then we'll make sure\
    \ we call `.getBody()` to get the response body. This is the method we'll want\
    \ to annotate with `HystrixCommand`. So come up to the top of the method and type\
    \ `@HystrixCommand`, and we'll use `fallbackMethod` called `unknown`. And then\
    \ we'll want to make sure that we define that method, so come below `getWeather`\
    \ method and define a new method, `public String unknown()`. And this will be\
    \ a real simple method. It will just return the string unknown. And to be crystal\
    \ clear, we're going to use this `WeatherService` in our main application class\
    \ to get the actual weather. And if there's a problem getting the weather, or\
    \ the `WeatherService` is down, it'll call that `fallbackMethod` and just return\
    \ unknown for the weather. Let's head back to the main application class and use\
    \ the `WeatherService`.\n\n```java\n@SpringBootApplication\n@EnableCircuitBreaker\n\
    @EnableDiscoveryClient\n@RestController\npublic class WeatherAppApplication {\n\
    \    @Inject\n    private WeatherService weatherService;\n\n    public static\
    \ void main(String[] args) {\n        SpringApplication.run(WeatherAppApplication.class,\
    \ args);\n    }\n\n    @GetMapping(\"/current/weather\")\n    public String getWeather()\
    \ {\n        return \"The current weather is \" + weatherService.getWeather();\n\
    \    }\n\n    @Bean\n    @LoadBalanced\n    public RestTemplate restTemplate()\
    \ {\n        return new RestTemplate();\n    }\n}\n```\n\nSo back within the main\
    \ application class, define a new instance variable, `private WeatherService weatherService`,\
    \ and we'll call that `weatherService`. And then don't forget to add the `@Inject`\
    \ annotation. Then we'll add a new method called `getWeather`. So come below the\
    \ main method here and do `public String getWeather()`. And then we're going to\
    \ return a string here that says the current weather is, and then we'll call the\
    \ `weatherService` and get the weather. And this is our handler method, so we'll\
    \ need the `@GetMapping`. So define an `@GetMapping` on the top of this method,\
    \ and then we'll say the URL is `/current/weather`. And that's all we need for\
    \ the code portion of our weather app, so go ahead and close both of these files\
    \ and navigate to `src/main/resources` and open up that `application.properties`.\n\
    \n### application.properties\n```\nserver.port=8000\nspring.application.name=weather-app\n\
    eureka.client.service-url.defaultZone=http://localhost:8761/eureka\n```\n"
