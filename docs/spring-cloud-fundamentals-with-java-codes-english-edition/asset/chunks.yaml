    \ shut down of DiscoveryClient\n```\n\nNow to fix it add below dependency in `pom.xml`:\n\
    \n```xml\n<dependency>\n    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-starter-web</artifactId>\n\
    </dependency>\n```\n\nNow start again.\n\nIf you expand the console and scroll\
    \ up, you'll see that it fetched the configuration from the Configuration Server.\
    \ So let's open up a browser and visit the Config Client app and see that it resolved\
    \ those configuration values.\n\n![](images/00025.jpeg)\n\nIn your browser, visit\
    \ `localhost:8080`, and you'll see that it's resolved the configuration values.\
    \ The first one, the app specific overridden value is the value from the `some.property`\
    \ property. And remember we set that to this app specific overridden value in\
    \ the Config Client configuration. And then the next property, separated by the\
    \ `||`, the global, is coming from the global properties, the `application.properties`.\n\
    \n## Updating Configuration at Runtime\n\nUpdating configuration at runtime is\
    \ easily one of the best features of Spring Cloud. With it, you can do things\
    \ like refresh your `@ConfigurationProperties` at runtime. You can also use it\
    \ to update the logging levels on any piece of code. And the changes happen almost\
    \ instantaneously. And the best part is that you can do all of this without ever\
    \ restarting your application. So how do you do it? Well, the first step is updating\
    \ your configuration. And you do that by cloning the configuration repository\
    \ that your Config Server is looking at, make your changes, and then `git add`,\
    \ `git commit`, and `git push` your changes up to the configuration repository.\
    \ From there, there are several different ways the application gets the new configuration,\
    \ both manually and automatically:\n\n*   `/refresh` with `spring-boot-actuator`\n\
    *   `/bus/refresh` with `spring-cloud-bus`\n*   `VCS + /monitor` with `spring-cloud-config-monitor`\
    \ & `spring-cloud-bus`\n\nThe first way is manually, and that's by calling the\
    \ refresh endpoint that's included in the Spring Actuator project. And just to\
    \ be clear, you would need to do that for every individual service that needs\
    \ its configuration updated. The second way is a combination of both manual and\
    \ automatic. And you can imagine that if you had a lot of servers, calling the\
    \ refresh endpoint on each of them manually could be a pretty painful process.\
    \ Instead, if each of the applications were to subscribe to an event, and you\
    \ were to call `/bus/refresh` endpoint, Spring Cloud Bus would send out a message\
    \ to all of the subscribers indicating to them that they need to refresh. Now\
    \ note that there isn't any intelligence in whether or not the configuration changed;\
    \ every subscriber goes and gets its new configuration. The third way is just\
    \ like the second except it adds a level of intelligence. And the way it does\
    \ that is you hook it up your version control system, like Git, and any time you\
    \ make a commit, the changeset of the commit is posted to a monitor endpoint,\
    \ and then that monitor endpoint can determine which services need to have their\
    \ configuration updated. So let's visualize this: imagine that you made a commit\
    \ to some configuration, and you pushed that up to the configuration repository.\
    \ And the repository knows what changed, and it sent that changeset to the monitor\
    \ endpoint, and then it decided that it only needed to notify two of the three\
    \ applications to update their configuration. Regardless of which method you chose\
    \ to notify your applications about configuration updates, there's one last step:\
    \ to celebrate. You can brag to your colleagues about making configuration changes\
    \ on the fly without ever restarting your application. And last, since you used\
    \ Git, you have a full audit log of all of the changes you've made.\n\n## Utilizing\
    \ the @RefreshScope Annotation\n\nWe've already talked about how `@ConfigurationProperties`\
    \ and logging levels will be updated when configuration is refreshed, but unfortunately\
    \ that doesn't cover all of the use cases. Anything that gets its value only at\
    \ initialization time, like an `@Bean` or an `@Value`, will not be automatically\
    \ refreshed like the others. To understand this a little bit better, it helps\
    \ to see an example.\n\n```java\n@Configuration\npublic class SomeConfiguration{\n\
    \    @Bean\n    public FooService fooService(FooProperties properties){\n    \
    \    return new FooService(properties.getConfigValue());\n    }\n}\n```\n\n**Example:\
    \ @Bean Will Not See New Config Value After a Refresh**\n\n*   Configuration updates\
    \ are made\n*   Note that `FooProperties` is a `@ConfigurationProperties` class\n\
    *   `POST` to `/refresh`\n"
