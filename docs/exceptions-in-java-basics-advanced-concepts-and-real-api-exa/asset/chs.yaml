  \ (注：由于原文中存在大量重复的内容，如“Exception”的多次出现以及部分章节的重复，译文已根据注意事项“不要重复输出原文”的原则，在翻译时进行了去重合并处理以确保逻辑清晰。)\n\
  \n由于您提供的原文中存在 **Exception** 章节的多次重复，且部分段落完全相同，我已按照高级文档工程师的标准进行了去重并翻译。以下是翻译后的正文内容：\n\
  \n[content]\n2022 年 1 月首次\n\n## 序言\nThe concept of a software exception was introduced\
  \ into programming in the early 60s. Since then, it has been adopted by many languages\
  \ and has evolved significantly. Generally accepted that exceptions help separate\
  \ concerns in programming and therefore improve manageability. While very few people\
  \ will deny the usefulness of exceptions, there is ongoing debate on how they should\
  \ be used. This book covers the basics of Java exceptions, advanced concept, and\
  \ best practices, and gives a historical overview of how exception handling in Java\
  \ was and is approached. This book assumes that the reader is familiar with the\
  \ Java programming language, and is able to write, compile and execute a simple\
  \ program. We hope you both enjoy and learn from this book.\n\n## History\nAll know\
  \ well what an “exceptional situation” is in real life. It is when something unexpected\
  \ happens that we deal with. For most of us it happens many times a day and often\
  \ more frequently than expected. You leave your garage and two blocks later your\
  \ alternator making a loud noise. What should you do? Drive home? Drive directly\
  \ to your mechanic? Can your car make it? You must quickly answer these questions\
  \ At a workplace — be it McDonalds or an airplane cockpit — people face these types\
  \ of questions and often given instructions on how to proceed. In the IT world,\
  \ these types of situations are extremely common. The mechanism known as “exception\
  \ handling” is supposed to solve these problems, or at least make them easier to\
  \ solve.\n\n## Interrupts\nThe notion of interrupts, introduced mid 1950s, is not\
  \ exactly the same as modern exception handling but is close to it. Interrupts refer\
  \ to both hardware and software. In both cases there is a request to the processor\
  \ to interrupt (or delay, or postpone – use any word you like) its current activity\
  \ and handle this specific situation. After the specific situation is handled, the\
  \ processor may resume its interrupted activity.\n\n## Lisp, Ada, COBOL, and others\n\
  Lisp was the first language that introduced software exception handling in a way\
  \ similar to what we know today. It introduced keywords like SIGNAL, CATCH, and\
  \ THROW. Their meanings and usages were similar to what they are. Computer languages\
  \ like Ada, COBOL, Object Pascal, and others quickly adopted the concept. Its implementation\
  \ may vary from language to language, but the core idea is the same.\n\n## C/C++\n\
  C did not have exceptions. In 1985, C++ was released as an object-oriented extension\
  \ of C. In addition to other things, exception handling was an integral part of\
  \ the program. C++ added the power of object-oriented programming to it. C++ is\
  \ the language from which the architects of Java borrowed exception handling semantics.\
  \ With C++, one may declare an exception in a method signature, but its usage will\
  \ not be enforced by the compiler. The architects of Java, as we will see later,\
  \ tried to take things one step further. They added the idea of checked exceptions.\
  \ This means that some exceptions may become a part of a method signature, thus\
  \ requiring special handling.\n\n## Normal & Abnormal\nThe whole concept behind\
  \ exception handling (and its conceptual predecessors) is that there are two ways\
  \ that a program may be executed:\n1) The program executes normally; all language\
  \ elements work as they should; or own2) The program executes abnormally; there\
  \ is not enough memory allocated, a null value is passed instead of a reference\
  \ to a valid object, or there is no file by the location passed by the caller. The\
  \ separation of normal and abnormal execution sounds simple and intuitive, and normally\
  \ does not cause controversy. However, some experts go further and support the idea\
  \ of separation abnormal behavior into two categories - “recoverable” and “unrecoverable”.\
  \ “Recoverable” conditions can be intercepted by the program and tried for recovery.\
  \ “Unrecoverable” however would normally require termination of the execution and\
  \ human intervention.\n\n## Essentials\nJava is an object-oriented language, which\
  \ means classes play an important role in it and its concepts are represented in\
  \ the form of classes. In summary, exceptions combine the power of non-local transition\
  \ of control with object-oriented 语义. In this chapter we explain the basic mechanism\
  \ that Java offers for exception handling. This chapter intentionally not cover\
  \ what is considered right or wrong with regards to using exceptions; this will\
  \ be covered in later chapters.\n\n## Hierarchy\nThere are several important classes\
  \ in the exception hierarchy. The java.lang.Throwable class is at the root. Any\
  \ exception used in the Java language should be its subclass:\nError extends Throwable\n\
  Exception extends Throwable\nRuntimeException extends Exception\nThe subclasses\
  \ of Error and RuntimeException are unchecked. All other classes directly or indirectly\
  \ inherited from Throwable are checked exceptions. As we will see later.\n\n## Original\
  \ Intent\nThe exception classes structure, as stated by Sun/Oracle, was intended\
  \ to divide two possible failures, namely faults and contingencies.\n\n### Faults\n\
  A “Fault” is something that should never happen. Examples include misconfiguration\
  \ of program environment, JVM failures and similar. Subclasses of Error and RuntimeException\
  \ were reserved for this purpose.\n\n### Contingency\nA “Contingency” is something\
  \ that may be unpleasant but is expected and is even part of method return. Examples\
  \ include not enough funds, user not found, etc. These events should be expected,\
  \ and the programming logic should be prepared to handle. Other subclasses of Throwable\
  \ (except subclasses of Error and RuntimeException, mentioned in the previous paragraph)\
  \ were reserved for this purpose.\n\n## Raising an Exception\nThere are two stages\
  \ in raising an exception in Java:\nFirst, the exception should be created in the\
  \ same way any other Java object is created. But simply creating an object of a\
  \ Throwable class (or one of its subclasses) is not enough. Second, the exception\
  \ should be put in a specific state. Specifically, it should be thrown. Some other\
  \ languages use the word raised. In Java the special statement throw serves this.\n\
  \n### Creating\nIf an exception is initiated by the user, as with other Java object,\
  \ it should first explicitly created. It may be one of the existing exception classes.\
  \ The user may also decide to create their own class and use an exception of the\
  \ corresponding class. Therefore, the operator new should be called with one of\
  \ the constructors available for the specific class:\n```java\nException exception\
  \ = new Exception(); // new MyException() own```\n\n### Throwing\nCreating an exception\
  \ is the first step of initiating an exceptional situation. For the second step,\
  \ the exception should be thrown; i.e. a special statement should be used with it.\n\
  ```java\nthrow exception;\n```\nThrowing an exception can be combined with the previous\
  \ creation step:\n```java\nthrow new Exception();\n```\nAfter an exception is thrown\
  \ it begins its “flight” up the stack trace to the nearest handling block. If the\
  \ JVM does not find an appropriate handler in the code, it will terminate the corresponding\
  \ thread that has thrown the exception. Users do not have to create an exception\
  \ every time from scratch. They may use an already available exception. This process\
  \ is called re-throwing. Two points should be made regarding re-throwing:\nFirst,\
  \ if the reference used for it is null, then instead of your exception, an instance\
  \ of java.lang.NullPointerException will be thrown. This happens because the JVM\
  \ detects an attempt to throw a null exception object, which is not allowed. There\
  \ are multiple situations when the JVM may decide to create and throw an exception\
  \ of its own.\nSecond, a re-thrown exception may already have some information in\
  \ it, which is irrelevant to the new context. That information should possibly be\
  \ reset. This will be covered in detail in later chapters.\n\n### Detection by the\
  \ JVM\nAs has already mentioned, an exception may be created by the JVM. It may\
  \ detect an exceptional situation and take care of it. In this case the JVM will\
  \ create an exception object (by calling an existing constructor) and throw it.\
  \ The JVM creates and throws only unchecked exceptions. According to the JVM specification,\
  \ the following exceptions may be detected and thrown by the JVM:\nfrom java.lang\
  \ package:\nStackOverflowError,AssertionError,ClassError,ClassFormatError,IncompatibleChangeError,InstantiationError,LinkageError,NoSuchClassFoundError,OutOfMemoryError,UnsatisfiedError,VirtualMachineError\n\
  from java.lang package:\nArithmeticException,ArrayIndexOutOfBoundsException,ArrayStoreException,ClassCastException,IllegalArgumentException,IllegalMonitorStateException,InterruptedException,NegativeArraySize,NullPointerException\n\
  from java.lang.invoke package:\nWrongMethodException\n\nInterception and processing\
  \ of exceptions are probably the critical aspects of Java’s mechanism. Understanding\
  \ how this works is absolutely critical.\n\n#### catch\nThe catch block looks as\
  \ follows:\n```java\ncatch (MyException caught) {\n// exception caught\n}\n```\n\
  The purpose of the catch block is to process a thrown and then intercepted exception.\
  \ The catch block is also called an “exception handler”. An exception parameter\
  \ must be a valid Java exception. The execution of the block starts immediately\
  \ after the opening curly brace that follows the catch declaration.\n```java\ncatch\
  \ (MyException caught) {\n// <- the execution goes here\n}\n```\nThe catch blocks\
  \ may follow each other.\n```java\ncatch (MyException caught) {\n}\ncatch (AnotherException\
  \ caught) {\n}\n```\nThe catch block may also use the “multi catch” construction.\
  \ Two catch blocks may often do a similar job, so it makes sense to reduce the redundancy\
  \ in the code that handles the logic. In some situations, more generic type can\
  \ be used in the catch block and intercept both exceptions. But this approach is\
  \ always possible. Since Java 7, two or more exceptions can be combined in one catch\
  \ block.\nExample 1 (pre-Java 7):\n```java\ncatch (IOException e) {\n}\ncatch (SQLException\
  \ e) {\n}\n```\nExample 2 (post-Java 7):\n```java\ncatch (IOException | SQLException\
  \ e) {\n}\n```\nThe effective type of exception variable in the second example is\
  \ the nearest superclass of the exception classes in the multi-catch declaration.\
  \ The Java compiler enforces several rules for the catch block:\nFirst, a catch\
  \ block for a child exception cannot go after a catch block for the parent class.\n\
  ```java\ncatch (MyParentException caught) {\n}\ncatch (MyChildException caught)\
  \ {\n}\n```\nUnreachable catch block for MyChildException. It is already handled\
  \ by the catch block for MyParentException.\nSecond, in “multi-catch” construction\
  \ two exceptions cannot be in a parent-child relationship.\n```java\ncatch (MyParentException\
  \ | MyChildException caught) {\n}\n```\nIf you try to compile a code that has the\
  \ above logic, you will get a compilation error that will look like: The exception\
  \ MyChildException is already caught by the alternative MyParentException.\n\n####\
  \ finally\nThe last block is called finally. It appears as follows:\n```java\nfinally\
  \ {\n}\n```\nThe purpose of the finally block is to finalize the work done in the\
  \ try block. Mainly, to release and/or clean up resources used in it.\n\n### try-catch-finally\n\
  The try-catch-finally construction starts with a regular try block.\n```java\ntry\
  \ {\n}\n```\nThe regular try block must be followed by at least one of the catch\
  \ or finally block. There may be many different combinations, including one catch,\
  \ one finally, one catch and one finally, multiple catch blocks and one finally.\
  \ All of these combinations are valid.\nThe execution starts with the beginning\
  \ of the try block, with the first line of code after the opening curly brace that\
  \ follows the try statement. If an exception is thrown inside of it, the rest of\
  \ the code inside the block is skipped and the program execution goes to the end\
  \ of the block.\n```java\ntry { // <- the execution starts right after this line\n\
  throw exception;\n} // <- the execution goes here\n```\n\n### Resource Specification\n\
  There is another form of the try block. It is a try block with the resource statement.\n\
  ```java\ntry (FileReader fileReader = new FileReader(\"my\");\nBufferedReader reader\
  \ = new BufferedReader(fileReader)) {\n```\nThe purpose of this block is the same\
  \ as regular try block, but in addition it also provides the user with some facilities\
  \ on how to initialize and automatically clean up resources used in the block. The\
  \ resource specification lets the user declare local (visible in the body of try)\
  \ variables with initializers. There are several limitations the compiler and JVM\
  \ impose on these variables:\nFirst, resource variable type should be a subclass\
  \ of java.lang.Closeable.\nSecond, all resource variables should be initialized\
  \ in the resource specification.\nThird, resource variables should be effectively\
  \ final. Once initialized in the resource specification they cannot be reassigned\
  \ in the try body (this stands for resource variables initialized to null).\n\n\
  #### AutoCloseable close()\nAs mentioned earlier, resources declared in the Resource\
  \ Specification should implement AutoCloseable. The interface has a method\n```java\n\
  void close() throws Exception;\n```\nThe purpose of the method is to perform the\
  \ work done in the try block. Mainly, to release and/or clean up resources used\
  \ in it.\n\n\n\n\n1. 资源规范抛出了一个异常。\n2. `try` 块抛出了一个异常。\n3. `try` 块成功完成。\n4. `try`\
  \ 块尝试将控制权转移到自身之外。\n\n#### 第一种情况：资源规范抛出了异常。\nJVM 将跳过 `try` 块的主体，并按照反序开始关闭已成功打开的资源。如果在调用\
  \ `close()` 方法期间抛出异常，该异常被视为被抑制的异常（suppressed），并添加到与原始异常关联的抑制异常列表中。当关闭过程结束，可能会存在一个与原始异常相关的抑制异常列表。列表的开头将包含第一个抛出的抑制异常；末尾将包含最后一个。\n\
  \n接下来，JVM 开始寻找可以处理原始异常的 `catch` 块。如果找到了此类块，执行将跳转到那里。如果没有找到此类块，执行将跳转到 `finally` 块。`catch`\
  \ 和 `finally` 块中的情况见下文。\n\n#### 第二种情况：从 `try` 块抛出了异常。\n在这种情况下，行为与上述第一种情况相同。抛出的异常被视为原始异常。在方法\
  \ `close()` 调用期间抛出的所有异常（如果有）都将作为抑制异常添加。\n\n#### 第三种情况：`try` 块成功完成。\n与第一种情况一样，JVM\
  \ 将按照反序开始关闭已成功打开的资源。这里我们还有两个子情况：\n\n1. 在调用 `close()` 方法的过程中至少抛出了一个异常。\n2. 在调用 `close()`\
  \ 方法的过程中没有抛出任何异常。\n\n**第一个子情况：**在关闭过程中抛出了异常，该异常被设为原始异常。所有其他后续异常（如果已抛出）都将作为抑制异常添加到第一个异常中。之后，JVM\
  \ 开始寻找可以处理原始异常的 `catch` 块。如果找到了此类块，执行将跳转到那里。如果没有找到此类块，执行将跳转到 `finally` 块。\n\n**第二个子情况：**在关闭过程中没有抛出异常。执行跳转到\
  \ `finally` 块。\n\n#### 第四种情况：`try` 块尝试将控制权转移到自身之外。\n在这种情况下，控制权的转移被推迟。JVM 将按照反序开始关闭已成功打开的资源。同样，有两个子情况：\n\
  \n1. 在调用 `close()` 方法的过程中至少抛出了一个异常。\n2. 在调用 `close()` 方法的过程中没有抛出任何异常。\n\n\n\n\n\n\
  #### 第一种子情况\n在关闭过程中抛出了异常；该异常被暂置。所有其他后续异常（如果抛出）将作为抑制异常添加到第一个异常中。推迟的控制转移被丢弃。之后，JVM\
  \ 开始寻找可以处理原始异常的 `catch` 块。如果找到此类块，执行将跳转那里。如果没有找到，执行将跳转到 `finally` 块。\n\n#### 第二种子情况\n\
  关闭过程中没有抛出异常。执行跳转到 `finally` 块。推迟的控制转移等待 `finally` 块做出决定。\n\n#### catch\n进入 `catch`\
  \ 块的唯一方法是抛出异常。可以从资源规格中、`try` 块中或在自动资源关闭期间从 `AutoCloseable` 的任一个 `close()` 方法中抛出异常。无论我们如何进入\
  \ `catch` 块，其随后的行为都是相同的。\n\n`catch` 块可能会决定通过语句抛出异常或转移控制。在这两种情况下，操作都会被推迟，并将控制转移到\
  \ `finally` 块进行最终决决。如果 `catch` 块自然结束，则没有推迟的操作，控制将转移到 `finally` 块。\n\n#### finally\n\
  `finally` 块做出最终决定。如果之前的块有任何推迟的操作，可以通过抛出异常或使用 `break`、`continue` 和 `return` 语句显式转移控制来覆盖。如果\
  \ `finally` 块自然结束且存在推迟的操作，则执行该推迟的操作。如果 `finally` 块自然结束且没有推迟的操作，则执行 `finally` 块之后的下一行代码。\n\
  \n```java\ntry {…}throw new MyFirstExcepton();…} \ncatch (MyFirstExcepton exception)\
  \ {…throw new MySecondExcepton();…} \nfinally {…throw new MyThirdExcepton();…}\n\
  ```\n\n在上面的示例中，从 `try` 块中抛出了一个异常。但控制的转移被推迟了。执行跳转到 `catch` 块。`catch` 块覆盖了推迟的操作。它抛出了自己的异常。异常的抛出也被推迟了。控制转移到\
  \ `finally` 块。`finally` 块反过来通过抛出自己的异常覆盖了该操作。因此，最后一个异常是从 `try-catch-finally` 块中抛出的。\n\
  \n#### 特殊情况\n有几个公共方法可能会中断 JVM 的执行。\n\n在 `java.lang.Runtime` 类中：\n```java\npublic\
  \ void exit(int status)\npublic void halt(int status)\n```\n\n在 `java.lang.System`\
  \ 类中：\n```java\npublic static void exit(int status)\n```\n\n此方法简单地调用 `java.lang.Runtime`\
  \ 对应的 `exit()` 方法。它是实现相同操作的另一个可用替代方案。下面我们将讨论前两个。由于上述 `java.lang.Runtime` 类的方法不是静态的，需要一个\
  \ `Runtime` 实例来调用它们。通常是通过调用 `getRuntime()` 方法实现的。\n\n```java\npublic static Runtime\
  \ getRuntime()\n```\n\n示例 1：\n`Runtime.getRuntime().exit(0);`\n\n示例 2：\n`Runtime.getRuntime().halt(0);`\n\
  \n这两个方法的区别在于 `exit()` 通过首先调用注册的关闭钩子（shutdown hooks）和终化器（finalizers）提供了一个更优雅的 JVM\
  \ 退出。`exit()` 和 `halt()` 都可能抛出 `java.lang.SecurityException`，如果调用线程未允许终止 JVM，则抛出该异常。此外，它们可能抛出其他运行时异常和错误，例如\
  \ `java.lang.OutOfMemoryError`。内部，这两个方法都使用包私类 `java.lang.Shutdown`，该类也有对应的 `exit()`\
  \ 和 `halt()` 方法。调用序列最终归于：\n\n```java\nstatic native void halt0(int status);\n```\n\
  \n此原生方法终止 JVM。之后不会执行任何内容，包括在 `try-catch-finally` 或 `try-with-resources` 结构定义的定义的终化，不会调用\
  \ `finally` 块，也不会对 `AutoCloseable` 资源调用 `close()` 方法。\n\n示例 3：\n```java\ntry {\n\
  \    System.out.println(\"It happens #1\");\n    Runtime.getRuntime().addShutdownHook(new\
  \ Thread(() -> {\n        System.out.println(\"It happens #2\");\n    }));\n   \
  \ Runtime.getRuntime().exit(0);\n    throw new Exception();\n} catch (Exception\
  \ e) {\n    System.out.println(\"It never happens #1\");\n} finally {\n    System.out.println(\"\
  It never happens #2\");\n}\nSystem.out.println(\"It never happens #3\");\n```\n\n\
  结果是：\nIt happens #1\nIt happens #2\n\n正如所见，在 `exit()` 方法之后没有执行任何内容，包括 `finally`\
  \ 块。对于任何其他代码也是如此，注册的关闭钩子和终化器除外。\n\n如果在上述代码中，我们将：\n`Runtime.getRuntime().exit(0);`\n\
  替换为：\n`Runtime.getRuntime().halt(0);`\n\n结果将是：\nIt happens #1\n\n正如所见，在 `halt()`\
  \ 方法之后没有执行任何内容，包括 `finally` 块。对于任何其他代码也是如此，包括注册的关闭钩子和终化器。\n\n需要说明的一个重要点是，如果在调用其中一个方法之后在向\
  \ JVM 退出的过程中抛出了异常（例如在上述场景中线程未允许终止 JVM），则程序的行为将与处理其他抛出的异常一样。\n\n#### 总结\n总结来说，使用上述内容，我们可以得出\
  \ `try-catch-finally` 块中控制转移的以下规则：\n\n1) 在普通的 `try-catch-finally` 块中，如果在 `try` 中抛出异常，跳转到\
  \ (4)。如果有其他形式的控制转移或 `try` 成功结束，跳转到 (6)。\n2) 在 `try-with-resource` 中，如果在 `try` 或资源规格中有任何形式的控制转移，或成功结束，跳转到\
  \ (3)。\n3) JVM 以反序关闭已初始化（非空值）的资源，调用相应的 `AutoCloseable` `close()` 方法。如果在关闭过程中抛出了异常，该异常被暂置。所有后续异常（如果抛出）都作为抑制异常添加到第一个异常中。推迟的控制转移被丢弃。之后，JVM\
  \ 开始寻找可以处理原始异常的 `catch` 块。如果找到此类块，执行将跳转那里。如果没有找到，执行跳转到 `finally` 块。\n4) JVM 开始寻找对应于抛出异常的\
  \ `catch` 块。如果找到，跳转到 (5)，否则跳转到 (6)。\n5) 执行 `catch` 块，在结束后跳转到 (6)。如果有任何形式的控制转移，则它被推迟。\n\
  6) JVM 检查是否存在 `finally` 块。如果有，跳转到 (7)。否则，跳转到 (8)。\n7) 执行 `finally` 块。如果有任何形式的控制转移，则它被推迟。如果执行到达最后一行，跳转到\
