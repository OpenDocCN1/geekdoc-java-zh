    **Catching errors**


    Sections of a program in which it is possible to anticipate errors, such as those
    handling user input, can typically be enclosed in a try except block to handle
    “exception errors”. The statements to be executed are grouped in a try : block
    and exceptions are passed to the ensuing except : block for handling. Optionally,
    this may be followed by a finally : block containing statements to be executed
    after exceptions have been handled.


    Python recognizes many built-in exceptions such as the NameError which occurs
    when a variable name is not found, the IndexError which occurs when trying to
    address a non-existent list index, and the ValueError which occurs when a built-in
    operation or function receives an inappropriate value.


    Each exception returns a descriptive message that can usefully be assigned to
    a variable with the as keyword. This can then be used to display the nature of
    the exception when it occurs.


    ![image](Images/image00188.jpeg)


    try.py


    ![image](Images/image00270.jpeg)Start a new program by initializing a variable
    with a string value


    **title = ‘Coding for Beginners In Easy Steps’**


    ![image](Images/image00271.jpeg)Next, add a try statement block that attempts
    to display the variable value – but specifies the name incorrectly


    **try :**


    **print( titel )**


    ![image](Images/image00272.jpeg)Now, add an except statement block to display
    an error message when a NameError occurs


    **except NameError as msg :**


    **print( msg )**


    ![image](Images/image00273.jpeg)Save then run the program – to see how the error
    gets handled


    ![image](Images/image00284.jpeg)


    ![image](Images/image00194.jpeg)


    In some programming languages this structure is known as try-catch exception handling.


    Multiple exceptions can be handled by specifiying their type as a comma-separated
    list in parentheses within the except block:


    **except ( NameError , IndexError ) as msg :**


    **print( msg )**


    You can also compel the interpreter to report an exception by using the raise
    keyword to specify the type of exception to be recognized and a custom descriptive
    message in parentheses.


    ![image](Images/image00188.jpeg)


    raise.py


    ![image](Images/image00270.jpeg)Start a new Python script by initializing a variable
    with an integer value


    **day = 32**


    ![image](Images/image00271.jpeg)Next, add a try statement block that tests the
    variable value then specifies an exception and custom message


    **try :**


    **if day > 31 :**


    **raise ValueError( ‘Invalid Day Number’ )**


    **# More statements to execute get added here**.


    ![image](Images/image00272.jpeg)Now, add an except statement block to display
    an error message when a ValueError occurs


    **except ValueError as msg :**


    **print( ‘The Program found An’ , msg )**


    ![image](Images/image00273.jpeg)Then, add a finally statement block to display
    a message after the exception has been handled succesfully


    **finally :**


    **print( ‘But Today Is Beautiful Anyway.’ )**


    ![image](Images/image00276.jpeg)Save then run the program – to see the raised
    error get handled


    ![image](Images/image00285.jpeg)


    ![image](Images/image00193.jpeg)


    Statements in the try block are all executed unless or until an exception occurs.


    **Summary**


    •The if keyword performs a conditional test on an expression for a Boolean value
    of True or False


    •Conditional branching provides alternatives to an if test with the else and elif
    keywords


    •Python tested expressions must be followed by a : colon character and statement
    blocks be indented from the test line


    •A for in loop iterates over each item in a specified list or string


    •Python for in loop statements must be followed by a : colon character and statement
    blocks be indented from the statement


    •The range() function generates a numerical sequence that can be used to specify
    the length of a for in loop


    •The enumerate() function can specify the name of a list to display each element
    index number and its stored value


    •The zip() function can display the stored values of the same index number in
    multiple lists


    •A while loop repeats while an initial test expression remains True and ends when
    that test expression becomes False


    •Python while loop statements must be followed by a : colon character and statement
    blocks be indented from the statement


    •The value of a counter variable can be tested in a test expression to control
    the number of loop iterations


    •The break keyword can be used to test an expression for a True value and immediately
    exit a loop when the test returns False


    •The continue keyword can be used to test an expression for a True value and exit
    a single iteration when the test returns False


    •Anticipated runtime exception errors can be handled by enclosing statements in
    a try except block


    •Optionally, a finally statement can be used to specify statements to be executed
    after exceptions have been handled


    •Python try, except, and finally statements must be followed by a : colon and
    statement blocks be indented from the statement


