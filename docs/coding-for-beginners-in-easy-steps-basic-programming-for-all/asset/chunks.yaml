    ```\n\n![image](img/image00288.jpeg)接下来，定义一个 `main()` 函数体，它将包含整个游戏代码并在完成后返回零值。\n\
    \n```cpp\nint main() {\n    /* 在此处添加语句 */\n    return 0;\n}\n```\n\n![image](img/image00289.jpeg)现在，添加语句将变量初始化为\
