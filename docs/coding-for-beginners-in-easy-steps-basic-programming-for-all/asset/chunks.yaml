    ![image](Images/image00194.jpeg)


    Toggle the value of a `Button` widget’s `state` property from `NORMAL` to `DISABLED`
    to steer the user – in this case the application must be reset before a further
    series of unique random numbers can be generated.


    ![image](Images/image00188.jpeg)


    lotto(widgets).py


    ![image](Images/image00270.jpeg)Start a new program by importing all features
    from the `tkinter` module.


    # Widgets


    ```python

    from tkinter import *

    ```


    ![image](Images/image00271.jpeg)Next, add statements to create a window object
    and an image object


    ```python

    window = Tk()

    img = PhotoImage( file = ‘lotto.gif’ )

    ```


    ![image](Images/image00373.jpeg)


    lotto.gif


    ![image](Images/image00272.jpeg)Now, add statements to create all the necessary
    widgets


    ```python

    imgLbl = Label( window, image = img )

    label1 = Label( window, relief = ‘groove’, width = 2 )

    label2 = Label( window, relief = ‘groove’, width = 2 )

    label3 = Label( window, relief = ‘groove’, width = 2 )

    label4 = Label( window, relief = ‘groove’, width = 2 )

    label5 = Label( window, relief = ‘groove’, width = 2 )

    label6 = Label( window, relief = ‘groove’, width = 2 )

    getBtn = Button( window )

    resBtn = Button( window )

    ```


    ![image](Images/image00273.jpeg)Then, add the widgets to the window using the
    grid layout manager – ready to receive arguments to specify how the widgets should
    be positioned at the design stage next.


    # Geometry


    ```python

    imgLbl.grid()

    label1.grid()

    label2.grid()

    label3.grid()

    label4.grid()

    label5.grid()

    label6.grid()

    getBtn.grid()

    resBtn.grid()

    ```


    ![image](Images/image00276.jpeg)Finally, add a loop statement to sustain the window.


    # Sustain window


    ```python

    window.mainloop()

    ```


    ![image](Images/image00277.jpeg)Save the file then run the program – to see the
    window appear containing all the necessary widgets.


    ![image](Images/image00193.jpeg)


    The `relief` property specifies a border style and the `width` property specifies
    the label width in character numbers.


    ![image](Images/image00377.jpeg)


    # Designing layout


    Having created all the necessary widgets, on the previous page, you can now design
    the interface layout by adding arguments to specify how the widgets should be
    positioned. A horizontal design will position the logo `Label` on the left, and
    on its right all six other `Labels` in a row with both `Buttons` below this. The
    grid layout manager, which positions widgets in rows and columns, can easily produce
    this design by allowing the logo `Label` to span a row containing all six other
    `Labels` and also a row containing both `Buttons`. One `Button` can span four
    columns and the other `Button` can span two columns, arranged like this:


    ![image](Images/image00378.jpeg)


    ![image](Images/image00194.jpeg)


    The grid layout manager’s `rowspan` and `columnspan` properties work like the
    HTML `rowspan` and `colspan` table cell attributes.


    ![image](Images/image00188.jpeg)


    lotto(layout).py


    ![image](Images/image00270.jpeg)Edit the program started on the previous page
    – firstly by positioning the `Label` containing the logo in the first column of
    the first row, and have it span across the second row.


    # Geometry


    ```python

    imgLbl.grid( row = 1, column = 1, rowspan = 2 )

    ```


    ![image](Images/image00271.jpeg)Next, position a `Label` in the second column
    of the first row and add 10 pixels of padding to its left and right.


    ```python

    label1.grid( row = 1, column = 2, padx = 10 )

    ```


    ![image](Images/image00272.jpeg)Now, position a `Label` in the third column of
    the first row and add 10 pixels of padding to its left and right.


    ```python

    label2.grid( row = 1, column = 3, padx = 10 )

    ```


    ![image](Images/image00273.jpeg)Position a `Label` in the fourth column of the
    first row and add 10 pixels of padding to its left and right.


    ```python

    label3.grid( row = 1, column = 4, padx = 10 )

    ```


    ![image](Images/image00276.jpeg)Position a `Label` in the fifth column of the
    first row and add 10 pixels of padding to its left and right.


    ```python

    label4.grid( row = 1, column = 5, padx = 10 )

    ```


    ![image](Images/image00277.jpeg)Position a `Label` in the sixth column of the
    first row and add 10 pixels of padding to its left and right.


    ```python

    label5.grid( row = 1, column = 6, padx = 10 )

    ```


    ![image](Images/image00379.jpeg)Position a `Label` in the seventh column of the
    first row then add 10 pixels of padding to the left side of the `Label` and 20
    pixels of padding to the right side of the `Label`.


    ```python

    label6.grid( row = 1, column = 7, padx = ( 10, 20 ) )

    ```


    ![image](Images/image00380.jpeg)Next, position a `Button` in the second column
    of the second row and have it span across four columns.


    ```python

    getBtn.grid( row = 2, column = 2, columnspan = 4 )

    ```


    ![image](Images/image00381.jpeg)Now, position a `Button` in the sixth column of
    the second row, and have it span across two columns.


    ```python

    resBtn.grid( row = 2, column = 6, columnspan = 2 )

    ```


    ![image](Images/image00382.jpeg)Save the file then run the program – to see the
    window appear containing all the necessary widgets now arranged in your grid layout
    design.


    ![image](Images/image00383.jpeg)


    The window size is automatically adjusted to suit the grid contents and the `Button`
    widgets are automatically centered in the spanned column.


    ![image](Images/image00194.jpeg)


    Additional padding to the right of the `Label` in the final column of the first
    row extends the window width to simply create a small right-hand margin area.


    ![image](Images/image00194.jpeg)


    # Assigning statics


    Having arranged all the necessary widgets in a grid, on the previous page, you
    can now assign static values to the widgets. These values will not change during
    execution of the program.


    ![image](Images/image00188.jpeg)


    lotto(static).py


    ![image](Images/image00270.jpeg)Modify the program on the previous page by inserting
    a new section before the final loop statement, which begins with a statement specifying
    window title.


    # Static Properties


    ```python

    window.title( ‘Lotto Number Picker’ )```


    ![image](Images/image00271.jpeg)Next, add a statement to prevent the user resizing
    the window along both the X and the Y axis – this will disable the “resize” button.


    ```python

