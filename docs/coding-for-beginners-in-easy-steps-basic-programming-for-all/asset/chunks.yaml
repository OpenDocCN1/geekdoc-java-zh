    ![image](Images/image00374.jpeg)


    ![image](Images/image00215.jpeg)


    Notice that the Text method is **image_ create()** but the Canvas method is **create_
    image()** – similar yet different.


    ![image](Images/image00194.jpeg)


    Text and Canvas widgets are both powerful and flexible – discover more online
    at **[docs.python.org/3.3/library/tkinter.html](http://docs.python.org/3.3/library/tkinter.html)**


    **Summary**


    •The tkinter module can be imported into a Python program to provide attributes
    and methods for windowed applications


    •Every tkinter program must begin by calling Tk() to create a window and call
    its mainloop() method to capture events


    •The window object’s title is specified by its title() method


    •A label widget is created by specifying the name of its parent container and
    its text as arguments to the Label() constructor


    •Widgets can be added to an application using the pack(), grid() or place() geometry
    managers


    •A button widget is created by specifying the name of its parent container, its
    text, and the name of a function to call when the user pushes it, as arguments
    to the Button() constructor


    •The tkinter.messagebox module can be imported into a Python program to provide
    attributes and methods for message boxes


    •Message boxes that ask the user to make a choice return a value to the program
    for conditional branching


    •The Frame() constructor creates a container in which multiple widgets can be
    grouped for better positioning


    •The Entry() constructor creates a single line text field whose current contents
    can be retrieved by its get() method


    •Items are added to a Listbox object by its insert() method and retrieved by specifying
    their index number to its get() method


    •Radiobutton and Checkbutton objects store values in the StringVar or IntVar object
    nominated by their variable attribute


    •The PhotoImage() constructor creates an image object that has a subsample() method
    which can scale down the image


    •Images can be added to Button and Label objects, embedded in Text objects, and
    painted on Canvas objects


    12


    **Developing apps**


    *This chapter brings together elements from previous chapters to develop a windowed
    application*.


    [**Generating randoms**](#part0015.xhtml_sec1)


    [**Planning needs**](#part0015.xhtml_sec2)


    [**Designing layout**](#part0015.xhtml_sec3)


    [**Assigning statics**](#part0015.xhtml_sec4)


    [**Loading dynamics**](#part0015.xhtml_sec5)


    [**Adding functionality**](#part0015.xhtml_sec6)


    [**Testing programs**](#part0015.xhtml_sec7)


    [**Deploying applications**](#part0015.xhtml_sec8)


    [**Summary**](#part0015.xhtml_sec9)


    **Generating randoms**


    The graphical application developed on subsequent pages of this book will generate
    six random numbers within a specific range. Initially, its functionality can be
    developed as a console application then transferred later to illustrate how it
    can be applied to graphical widget components.


    The standard Python library has a random module that provides methods to generate
    pseudo-random numbers. The current system time is used by default to “seed” the
    random generator whenever it gets initialized – so it does not repeat its selections.


    A pseudo-random floating-point number from 0.0 to 1.0 can be generated by calling
    the random() method from the random module. The range of generated numbers can
    be modified using the * multiplication operator to specify a maximum value and
    can be rounded down to integer values using the built-in int() function. For example,
    to generate an integer within the range of zero to nine:


    **int( random.random() * 10 )**


    Or to generate a whole number within the range of 1 to 10:


    **int( random.random() * 10 ) + 1**


    ![image](Images/image00215.jpeg)


    Floating-point numbers cast from the **float** data type to the **int** data type
    by the built-in **int()** function get truncated at the decimal point.


    This statement could be used in a loop to generate multiple random integers within
    a given range but any number may be repeated in that output – there is no guaranteed
    uniqueness. Instead, multiple unique random integers within a given range can
    be generated by the sample() method from the random module. This requires two
    arguments to specify the range and the number of unique integers to be returned.
    It is convenient to use the built-in range() function to specify a maximum value.
    For example, to generate six unique numbers within the range of 1 to 9:


    **random.sample( range( 10 ) , 6 )**


    Or to generate six unique numbers within the range of 1 to 10:


    **random.sample( range( 1 , 11 ) , 6 )**


    This technique could represent a random lottery entry by choosing, say, six unique
    numbers between 1 and 49.


    ![image](Images/image00193.jpeg)


    The **range()** function can specify start and end values. If no starting value
    is supplied, zero is assumed by default.


    ![image](Images/image00188.jpeg)


    sample.py


    ![image](Images/image00270.jpeg)Start a new program by importing two functions
    from the “random” module


    **from random import random , sample**


    ![image](Images/image00271.jpeg)Next, assign a random floating-point number to
    a variable then display its value


    **num = random()**


    **print( ‘Random Float 0.0-1.0 : ‘ , num )**


    ![image](Images/image00272.jpeg)Now, multiply the floating-point number and cast
    it to become an integer then display its value


    **num = int( num * 10 )**


    **print( ‘Random Integer 0 - 9 : ‘ , num )**


    ![image](Images/image00273.jpeg)Add a loop to assign multiple random integers
    to a list, then display the list items


    **nums = [] ; i = 0**


    **while i < 6 :**


    **nums.append( int( random() * 10 ) + 1 )**


    **i += 1**


    **print( ‘Random Multiple Integers 1-10 :’ , nums )**


    ![image](Images/image00276.jpeg)Finally, assign multiple unique random integers
    to the list then display the list items


    **nums = sample( range( 1, 49 ) , 6 )**


    **print( ‘Random Integer Sample 1 - 49 : ‘ , nums )**


    ![image](Images/image00277.jpeg)Save the file then run the program several times
    – to see the generated random numbers


    ![image](Images/image00375.jpeg)


    ![image](Images/image00194.jpeg)


    The **random.sample()** function returns a list but does not actually replace
    any elements in the specified range.


    **Planning needs**


    When creating a new graphical application it is useful to first spend some time
    planning its design. Clearly define the program’s precise purpose, decide what
    application functionality will be required, then decide what interface widgets
    will be needed.


    ![image](Images/image00376.jpeg)


    A plan for a simple application to pick numbers for a lottery entry might look
    like this:


    **Program purpose**


    •The program will generate a series of six unique random numbers in the range
    1-49 and have the ability to be reset


    **Functionality required**


    •A function to generate and display six unique random numbers


    •A function to clear the last six random numbers from display


    **Interface widgets needed**


    •One non-resizable window to contain all other widgets and to display the application
    title.


    •One Label widget to display a static application logo image – just to enhance
    the appearance of the interface.


    •Six Label widgets to dynamically display the generated series of unique random
    numbers – one number per Label.


    •One Button widget to generate and display the numbers in the Label widgets when
    this Button gets clicked. This Button will not be enabled when the numbers are
    on display.


    •One Button widget to clear the numbers on display in the Label widgets when this
    Button gets clicked. This Button will not be enabled when the numbers are not
    on display.


    Having established a program plan means you can now produce the application basics
    by creating all the necessary widgets.'
