    \n```\ntotal = num1 + num2\n```\n\n```\nprint( ‘Total:‘ , total , type( total\
    \ ) )\n```\n\n![image](img/image00228.jpeg)再次使用 `+` 运算符尝试加法，但对存储的值进行类型转换，以查看结果为\
    \ `int` 数据类型。\n\n```\ntotal = int( num1 ) + int( num2 )\n```\n\n```\nprint( ‘Total:‘\
    \ , total , type( total ) )\n```\n\n![image](img/image00231.jpeg)最后，将存储的值转换为 `float`\
    \ 数据类型，并将浮点结果值拼接到输出的 `str` 字符串中。\n\n```\ntotal = float( num1 ) + float( num2 )\n\
    ```\n\n```\nprint( ‘Total: ‘ + str( total ) , type( total ) )\n```\n\n![image](img/image00232.jpeg)保存并运行程序，查看通过内置函数进行转换后存储的数据类型。\n\
    \n![image](img/image00234.jpeg)\n\n![image](img/image00215.jpeg)\n\n如果你忘记转换为正确的数据类型，解释器将报告错误——尝试将一个\
    \ `int` 加到一个 `str` 数据类型上以查看错误信息。\n\n## 猜数字游戏\n\n之前的简单示例说明了如何在程序中使用变量来存储文本字符串值、数值整数和浮点小数值以及布尔真值值。现在，它们可以被用来创建一个“猜数字游戏”程序：通过存储一个随机生成的整数（用户需要猜中它的值）、一个在用户猜对时结束游戏的布尔真值值，以及一个包含用户猜词结果的字符串。\n\
    \n此示例中的代码包含了一些在本书后面才会演示的功能，但由于 Python 是一门易于人类的编程语言，你应该能够原理上理解这个程序是如何工作的。\n\n![image](img/image00188.jpeg)\n\
    \n`guess.py`\n\n![image](img/image00225.jpeg)打开 IDLE 编辑窗口，通过导入一个提供随机数生成器函数的“random”库类来开始程序。\n\
    \n```\nimport random\n```\n\n![image](img/image00226.jpeg)现在初始化三个变量——一个 1 到 20\
    \ 之间的随机数、一个只要游戏进行就保持为 True 的布尔值，以及一个稍后存储用户输入的数字的值。\n\n```\nnum = random.randint(\
    \ 1 , 20 )\nflag = True\nguess = 0\n```\n\n![image](img/image00227.jpeg)接下来，显示一条消息让用户进行猜想。\n\
    \n```\nprint( ‘Guess my number 1-20 : ‘ end = ‘ ‘ )\n```\n\n![image](img/image00228.jpeg)然后，精确复制这段代码，它将存储的用户猜词与存储的随机数进行比较。\n\
    \n```python\nwhile flag == True :\n    guess = input( )\n    if not guess.isdigit()\
    \ :\n        print( ‘Invalid! Enter only digits 1-20‘ )\n        break\n    elif\
    \ int( guess ) < num :\n        print( ‘Too low, try again : ‘ end = ‘ ‘ )\n \
    \   elif int( guess ) > num :\n        print( ‘Too high, try again : ‘ end = ‘\
    \ ‘ )\n    else:\n        print( ‘Correct...’ + guess )\n        flag = False\n\
    ```\n\n![image](img/image00232.jpeg)保存并运行程序，查看通过内置函数进行转换后存储的数据类型。\n\n![image](img/image00215.jpeg)许多语言使用如\
    \ `}` 这样的字符来分组语句，但 Python 使用缩进，因此必须保留缩进。\n\n![image](img/image00227.jpeg)保存并运行程序，查看通过内置函数进行转换后存储的数据类型。\n\
    \n![image](img/image00234.jpeg)\n\n![image](img/image00215.jpeg)\n\n`random` 库类用于随机数生成。\n\
    - `randint()` 函数提供随机数生成器函数\n- `while` 关键字提供循环结构\n- `if`, `elif`, `else` 提供条件逻辑\n\
