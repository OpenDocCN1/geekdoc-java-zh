    **def mirror( user = ‘Carole’ , lang = ‘Python’ ) :**


    **print( ‘\nUser:’ , user , ‘Language:’ , lang )**


    ![image](Images/image00291.jpeg)Finally, add statements to call the second function
    both using and overriding default values


    **mirror()**


    **mirror( lang = ‘Java’ )**


    **mirror( user = ‘Tony’ )**


    **mirror( ‘Susan’ , ‘C++’ )**


    ![image](Images/image00292.jpeg)Save then run the program – to see the function
    display the argument values or default parameter values


    ![image](Images/image00295.jpeg)


    ![image](Images/image00194.jpeg)


    Arguments are the actual data values passed to function parameters by the function
    call.


    **Returning results**


    Like Python’s built-in str() function, which returns a string representation of
    the value specified as its argument by the caller, your custom functions can also
    return a value to their caller by using the return keyword to specify a value
