    by recognizing its similarities to Python code. The Java programming language
    has the admirable mantra “write once – run anywhere”. Programs in Java require
    the Java Runtime Environment ( JRE) to be installed on the host computer to produce
    machine code at runtime – a process known as “Just-In-Time” ( JIT) compilation.


