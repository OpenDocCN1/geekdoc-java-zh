    ```python

    print( ‘Addition: \t’ , a , ‘+’ , b , ‘=’ , a + b )

    ```


    ![image](img/image00243.jpeg)现在，显示数字相减的结果


    ```python

    print( ‘Subtraction:\t’ , a , ‘-’ , b , ‘=’ , a - b )

    ```


    ![image](img/image00244.jpeg)然后，显示数字相乘的结果


    ```python

    print( ‘Multiplication:\t’ , a , ‘x’ , b , ‘=’ , a * b )

    ```


    ![image](img/image00245.jpeg)显示数字除法的结果，包括带和不带浮点部分


    ```python

    print( ‘Division: \t’ , a , ‘÷’ , b , ‘=’ , a / b )

    print( ‘Floor Division:\t’ , a , ‘÷’ , b , ‘=’ , a // b )

    ```


    ![image](img/image00246.jpeg)接下来，显示数字除后的余数


    ```python

    print( ‘Remainder:\t’ , a , ‘%’ , b , ‘=’ , a % b )

    ```


    ![image](img/image00247.jpeg)最后，显示第一个数字的第二个数字次方的的结果


    ```python

    print( ‘Exponent:\t ‘ , a , ‘² = ’ , a ** b , sep = ‘’ )

    ```


