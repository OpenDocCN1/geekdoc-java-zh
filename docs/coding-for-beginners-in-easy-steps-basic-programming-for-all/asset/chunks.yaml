    | `r/R` | `Raw String – suppress meaning of escape characters` | `print( r’\n’
    )` |

    | `‘‘‘ ‘‘‘` | `Docstring – describe a module, function, class, or method` | `def
    sum( a,b ) : ‘‘‘ Add Args ‘‘‘` |


    ![image](Images/image00215.jpeg)


    The membership operators perform a case-sensitive match, so `‘A’ in ‘abc’` will
    fail.


    The `[ ]` slice operator and `[ : ]` range slice operator recognize that a string
    is simply a list containing an individual character within each list element,
    which can be referenced by their index number.


    Similarly, the `in` and `not in` membership operators iterate through each element
    seeking to match the specified character.


    The raw string operator `r` (or uppercase `R`) must be placed immediately before
    the opening quote mark to suppress escape characters in the string and is useful
    when the string contains the backslash character.


    ![image](Images/image00215.jpeg)


    The Range Slice returns the string up to, but not including, the final specified
    index position.


    A “docstring” is a descriptive string literal that occurs as the first statement
    in a module, a function, a class, or a method definition. This should be enclosed
    within triple single quote marks. Uniquely, the docstring becomes the `__doc__`
    special attribute of that object, so can be referenced using its name and dot-suffixing.
    All modules should normally have docstrings, and all functions and classes exported
    by a module should also have docstrings.


    ![image](Images/image00188.jpeg)


    manipulate.py


    ![image](Images/image00225.jpeg)Start a new program by defining a simple function
    that includes a docstring description


    ```python

    def display( s ) :

    ‘‘’Display an argument value.’’’

    print( s )

    ```


    ![image](Images/image00226.jpeg)Next, add a statement to display the function
    description


    ```python

    display( display.doc )

    ```


    ![image](Images/image00227.jpeg)Now, add a statement to display a raw string value
    that contains the backslash character


    ```python

    display( r’C:\Program Files’ )

    ```


    ![image](Images/image00228.jpeg)Then, add a statement to display a concatenation
    of two string values that include an escape character and a space


    ```python

    display( ‘\nHello’ + ‘ Python’ )

    ```


    ![image](Images/image00231.jpeg)Next, add a statement to display a slice of a
    specified string within a range of element index numbers


    ```python

    display( ‘Python In Easy Steps\n’ [ 7 : ] )

    ```


    ![image](Images/image00232.jpeg)Finally, display the results of seeking characters
    within a specified string


    ```python

    display( ‘P’ in ‘Python’ )

    display( ‘p’ in ‘Python’ )

    ```


    ![image](Images/image00240.jpeg)Save then run the program – to see manipulated
    strings get displayed


    ![image](Images/image00325.jpeg)


    ![image](Images/image00193.jpeg)


    Remember that strings must be enclosed within either single quote marks or double
    quote marks.


    ![image](Images/image00194.jpeg)


    With range slice, if the start index number is omitted zero is assumed and if
    the end index number is omitted the string length is assumed.


    ### Formatting strings


    The Python built-in `dir()` function can be useful to examine the names of functions
    and variables defined in a module by specifying the module name within its parentheses.
    Interactive mode can easily be used for this purpose by importing the module name
    then calling the `dir()` function. The example below examines the “dog” module
    created [here](#part0009.xhtml_page_82) in [Chapter Six](#part0009.xhtml):


    ![image](Images/image00326.jpeg)


    ![image](Images/image00194.jpeg)


    Notice that the `__doc__` attribute introduced in the previous example appears
    listed here by the `dir()` function.


    Those defined names that begin and end with a double underscore are Python objects,
    whereas the others are programmer-defined. The `__builtins__` module can also
    be examined using the `dir()` function, to reveal the names of functions and variables
    defined by default, such as the `print()` function and a `str` object.


    The `str` object defines several useful functions for string formatting, including
    an actual `format()` function that performs replacements. A string to be formatted
    by the `format()` function can contain both text and “replacement fields” marking
    places where text is to be inserted from an ordered comma-separated list of values.
    Each replacement field is denoted by `{ }` braces, which may optionally contain
    the index number position of the replacement in the list.


