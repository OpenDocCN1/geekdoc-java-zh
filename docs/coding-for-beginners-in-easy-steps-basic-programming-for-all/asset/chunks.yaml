  trans: "\n\n类的所有属性都通过点符号前缀 `self` 进行内部引用——因此一个名为“sound”的属性是 `self.sound`。此外，类中的所有方法定义必须将\
    \ `self` 作为第一个参数——因此一个名为“talk”的方法是 `talk( self )`。\n\n当创建类实例时，会自动调用一个特殊的 `__init__(\
    \ self )` 方法。如果需要传递值来初始化其属性，可以在其括号中添加后续参数。\n\n一个完整的 Python 类声明可能如下所示：\n\n```python\n\
    class Critter :\n    ''' 用于所有生物属性的基类。 '''\n    count = 0\n    def __init__( self\
    \ , chat ) :\n        self.sound = chat\n        Critter.count += 1\n    def talk(\
    \ self ) :\n        return self.sound\n```\n\n![image](img/image00193.jpeg)\n\n\
    可以通过特殊的 `__doc__` 字符串属性 `Classname.__doc__` 访问类的文档字符串。\n\n检查此示例的类组件是很有用的：\n\n\
    * 变量 `count` 是一个类变量，其整数值由该类的所有实例共享——该值可以在类内部或外部通过 `Critter.count` 引用\n* 第一个方法\
    \ `__init__()` 是初始化方法，在创建类实例时会自动调用\n* 在此例中，`__init__()` 方法初始化了一个实例变量 `sound`，其值从\
    \ `chat` 参数传递而来，并且每当创建该类的实例时，就会增加 `count` 类变量的值\n* 第二个方法 `talk()` 的声明方式与普通函数相同，但第一个参数是\
    \ `self`，它是自动包含的——调用者不需要传递任何值\n* 在此例中，`talk()` 方法简单返回封装在 `sound` 实例变量中的值\n\n![image](img/image00194.jpeg)\n\
    \n虽然程序类不能完美模拟真实世界的对象，但目标是封装所有相关的属性和操作。\n\n### 复制实例\n\n类对象的“实例”仅仅是通过调用该类的构造函数并在其括号内指定所需的参数数量而创建的原型的副本。调用的参数必须与\
    \ `__init__()` 方法定义的参数匹配——除了内部 `self` 参数的值外。\n\n构造函数返回的类实例对象使用语法 `instance-name\
    \ = ClassName( *args* )` 赋值给变量。\n\n可以使用点符号通过在名称后加上后缀 `instance-name.method-name()`\
    \ 或 `instance-name.attribute-name` 来引用实例对象的方法和类变量属性。\n\n![image](img/image00194.jpeg)\n\
    \n构造函数使用类名后包含任何必要参数的括号来创建类实例。\n\n通常，基类可以定义为 Python 模块文件，以便它可以被导入到其他脚本中，在脚本中可以从“主”类原型轻松创建实例对象。\n\
    \n![image](img/image00188.jpeg)\n\n#### Bird.py\n\n![image](img/image00241.jpeg)通过声明一个带有描述性文档字符串的新类开始一个新的类文件\n\
    \n```python\nclass Bird :\n    ''' 定义鸟类属性的基类.'''\n```\n\n![image](img/image00242.jpeg)接下来，添加一个缩进语句来声明并初始化一个整数值为零的类变量属性\n\
    \n```python\ncount = 0\n```\n\n![image](img/image00243.jpeg)现在，定义初始化类方法来初始化实例变量并增加类变量\n\
    \n```python\ndef __init__( self , chat ) :\n    self.sound = chat\n    Bird.count\
    \ += 1\n```\n\n![image](img/image00244.jpeg)最后，添加一个类方法在调用时返回实例变量的值——然后保存此类文件\n\
    \n```python\ndef talk( self ) :\n    return self.sound\n```\n\n![image](img/image00193.jpeg)你不能为\
    \ `self` 参数传递参数值，因为这是 Python 自动包含的。\n\n![image](img/image00188.jpeg)\n\n#### instance.py\n\
    \n![image](img/image00245.jpeg)通过使类文件的功能可用启动程序，然后显示其文档字符串\n\n```python\nfrom Bird\
    \ import ***\nprint( ‘\\nClass Instances Of:\\n’ , Bird.__doc__ )\n```\n\n![image](img/image00246.jpeg)接下来，添加一条语句创建类的实例，并将字符串参数值传递给其实例变量\n\
    \n```python\npolly = Bird( ‘Squawk, squawk!’ )\n```\n\n![image](img/image00247.jpeg)现在，显示此实例变量值并调用类方法显示公共类变量值\n\
    \n```python\nprint( ‘\\nNumber Of Birds:’ , polly.count )\nprint( ‘Polly Says:’\
    \ , polly.talk() )\n```\n\n![image](img/image00337.jpeg)\n\nBird 实例 – polly\n\n\
    ![image](img/image00248.jpeg)创建类的第二个实例，向其实例变量传递不同的字符串参数值\n\n```python\nharry =\
    \ Bird( ‘Tweet, tweet!’ )\n```\n\n![image](img/image00338.jpeg)最后，显示此实例变量值并调用类方法显示公共类变量值\n\
    \n```python\nprint( ‘\\nNumber Of Birds:’ , harry.count )\nprint( ‘Harry Says:’\
    \ , harry.talk() )\n```\n\n![image](img/image00339.jpeg)\n\nBird 实例 – harry\n\n\
    ![image](img/image00340.jpeg)保存两个文件后运行程序——看到创建的两个 Bird 实例\n\n![image](img/image00341.jpeg)类变量\
    \ `count` 可以通过 `Bird.count` 引用，但实例变量 `sound` 只能通过调用实例的 `talk()` 方法访问。\n\n### 处理属性\n\
    \n类的属性可以使用点符号随时添加、修改或删除。向现有属性赋值的语句将更新该值或创建一个新属性：\n\n`instance-name = value`\n\n\
    或者，你可以使用以下 Python 内置函数添加、修改或删除实例变量：\n\n* `getattr(instance-name , ‘attribute-name’)`\
    \ – 返回实例的属性值\n* `hasattr(instance-name , ‘attribute-name’)` – 如果实例存在属性值则返回 True，否则返回\
    \ False\n* `setattr(instance-name , ‘attribute-name’ , value)` – 更新现有属性或在实例创建新属性\n\
    * `delattr(instance-name , ‘attribute-name’)` – 从实例中删除属性\n\n传递这些内置函数的属性名必须放在引号内。Python\
    \ 自动提供的属性以下划线字符开头——因此这些不应被修改或删除。你可以这样命名自己的属性以表示私有性，但实际上它们可以像其他属性一样被修改。\n\n![image](img/image00188.jpeg)\n\
    \n#### address.py\n\n![image](img/image00241.jpeg)通过使创建的 Bird 类的功能启动新程序\n\n```python\n\
    from Bird import ***\n```\n\n![image](img/image00242.jpeg)接下来，创建一个实例，然后使用点符号添加一个带有赋值的新属性\n\
    \n```python\nchick = Bird( ‘Cheep, cheep!’ )\nchick.age = ‘1 week’\n```\n\n![image](img/image00243.jpeg)现在，显示两个实例变量属性中的值\n\
    \n```python\nprint( ‘\\nChick Says:’ , chick.talk() )\nprint( ‘Chick Age:’ , chick.age\
    \ )\n```\n\n![image](img/image00244.jpeg)然后，使用点符号修改新属性并显示其新值\n\n```python\nchick.age\
    \ = ‘2 weeks’\nprint( ‘Chick Now:’ , chick.age )\n```\n\n![image](img/image00245.jpeg)接下来，再次修改新属性，这次使用内置函数\n\
    \n```python\nsetattr( chick , ‘age’ , ‘3 weeks’ )\n```\n\n"
- fmt: "\n![image](Images/image00246.jpeg)Now, display a list of all non-private instance\
    \ attributes and their respective values using a built-in function\n\n```python\n\
    print( ‘\\nChick Attributes...’ )\n\nfor attrib in dir( chick ) :\n    if attrib[0]\
    \ != ‘_’ :\n        print( attrib , ‘:’ , getattr( chick , attrib ) )\n```\n\n\
    ![image](Images/image00247.jpeg)Finally, remove the new attribute and confirm\
    \ its removal using a built-in function\n\n```python\ndelattr( chick , ‘age’ )\n\
    print( ‘\\nChick age Attribute?’ , hasattr( chick , ‘age’ ) )\n```\n\n![image](Images/image00248.jpeg)Save\
    \ then run the program – to see the instance attributes get addressed\n\n![image](Images/image00342.jpeg)\n\
    \n![image](Images/image00343.jpeg)\n\nBird instance – chick\n\n![image](Images/image00193.jpeg)\n\
    \nThis loop skips any attribute whose name begins with an underscore, so “private”\
    \ attributes will not get displayed in the list.\n\n### Deriving classes\n\nA\
    \ Python class can be created as a brand new class, like those in previous examples,\
    \ or can be “derived” from an existing class. Importantly, a derived class inherits\
    \ members of the parent (base) class from which it is derived – in addition to\
    \ its own members.\n\nThe ability to inherit members from a base class allows\
    \ derived classes to be created that share certain common properties, which have\
    \ been defined in the base class. For example, a “Polygon” base class may define\
    \ width and height properties that are common to all polygons. Classes of “Rectangle”\
    \ and “Triangle” could be derived from the `Polygon` class – inheriting width\
    \ and height properties, in addition to their own members defining their unique\
    \ features.\n\n![image](Images/image00344.jpeg)\n\n![image](Images/image00345.jpeg)\n\
    \nThe virtue of inheritance is extremely powerful and is the second principle\
    \ of Object Oriented Programming (OOP).\n\nA derived class declaration adds `()`\
    \ parentheses after its class name specifying the name of its parent base class.\n\
    \n![image](Images/image00188.jpeg)\n\n`Polygon.py`\n\n![image](Images/image00241.jpeg)Create\
    \ a new class file that declares a base class with two class variables and a method\
    \ to set their values\n\n```python\nclass Polygon :\nwidth = 0\nheight = 0\ndef\
    \ set_values( self , width , height ) :\n    Polygon.width = width\n    Polygon.height\
    \ = height\n```\n\n![image](Images/image00188.jpeg)\n\n`Rectangle.py`\n\n![image](Images/image00242.jpeg)Next,\
    \ create a class file that declares a derived class with a method to return manipulated\
    \ class variable values\n\n```python\nfrom Polygon import *\nclass Rectangle(\
    \ Polygon ) :\n    def area( self ) :\n        return self.width * self.height\n\
    ```\n\n![image](Images/image00188.jpeg)\n\n`Triangle.py`\n\n![image](Images/image00243.jpeg)Now,\
    \ create another class file that declares a derived class with a method to return\
    \ manipulated class variable values\n\n```python\nfrom Polygon import *\nclass\
    \ Triangle( Polygon ) :\n    def area( self ) :\n        return ( self.width *\
    \ self.height ) / 2\n```\n\n![image](Images/image00244.jpeg)Save the three class\
    \ files then start a new program by making features of both derived classes available\n\
    \n```python\nfrom Rectangle import *\nfrom Triangle import *\n```\n\n![image](Images/image00245.jpeg)Next,\
    \ create an instance of each derived class\n\n```python\nrect = Rectangle()\n\
    trey = Triangle()\n```\n\n![image](Images/image00246.jpeg)Now, call the class\
    \ method inherited from the base class, passing arguments to assign to the class\
    \ variables\n\n```python\nrect.set_values( 4 , 5 )\ntrey.set_values( 4 , 5 )\n\
    ```\n\n![image](Images/image00247.jpeg)Finally, display the result of manipulating\
    \ the class variables inherited from the base class\n\n```python\nprint( ‘Rectangle\
    \ Area:’ , rect.area() )\nprint( ‘Triangle Area:’ , trey.area() )\n```\n\n![image](Images/image00248.jpeg)Save\
    \ then run the program – to see output get displayed using inherited features\n\
    \n![image](Images/image00346.jpeg)\n\n![image](Images/image00188.jpeg)\n\n`inherit.py`\n\
    \n![image](Images/image00194.jpeg)\n\nA class declaration can derive from more\
    \ than one class by listing multiple base classes in the parentheses after its\
    \ name in the declaration.\n\n![image](Images/image00215.jpeg)\n\nDon’t confuse\
    \ class instances and derived classes – an instance is a copy of a class, whereas\
    \ a derived class is a new class that inherits properties of the base class from\
    \ which it is derived.\n\n### Overriding methods\n\nA method can be declared in\
    \ a derived class to override a matching method in the base class – if both method\
    \ declarations have the same name and the same number of listed parameters. This\
    \ effectively hides the base class method as it becomes inaccessible unless it\
    \ is called explicitly, using the base class name for identification.\n\nWhere\
    \ a method in a base class supplies a default parameter value this can be used\
    \ in an explicit call to the base method or alternative values can be supplied\
    \ by overriding methods.\n\n![image](Images/image00188.jpeg)\n\n`Person.py`\n\n\
    ![image](Images/image00241.jpeg)Create a new class file that declares a base class\
    \ with a initializer method to set an instance variable and a method to display\
    \ it\n\n```python\nclass Person :\ndef __init__( self , name ) :\n    self.name\
    \ = name\ndef speak( self , msg = ‘Calling Base Class)’ :\n    print( self.name\
    \ , msg )\n```\n\n![image](Images/image00188.jpeg)\n\n`Man.py`\n\n![image](Images/image00242.jpeg)Next,\
    \ create a class file that declares a derived class with a method that overrides\
    \ the base method\n\n```python\nfrom Person import *\nclass Man( Person ) :\n\
    \    def speak( self , msg ) :\n        print( self.name , ‘:\\n\\tHello!’ , msg\
    \ )\n```\n\n![image](Images/image00188.jpeg)\n\n`Hombre.py`\n\n![image](Images/image00243.jpeg)Now,\
    \ create another class file that declares a derived class with a method that once\
