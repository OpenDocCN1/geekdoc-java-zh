  trans: "\n\n文件中的位置（即读取位置或写入的位置）可以通过文件对象的 `seek()` 函数进行精细控制。该函数接受一个整数参数，指定从文件起始位置作为偏移量需要移动的字符数。\n\
    \n可以通过调用文件对象的 `tell()` 函数随时发现文件中的当前位置，该函数会返回一个整数位置。\n\n在处理文件对象时，良好的做法是使用 Python\
    \ 的 `with` 关键字将文件操作语句分组在一个块中。这种技术可以确保文件在操作结束后被正确关闭，即使过程中抛出异常，而且比编写等价的 `try except`\
    \ 块要短得多。\n\n![image](img/image00188.jpeg)\n\n### update.py\n\n![image](img/image00225.jpeg)通过给包含要写入文件文本的变量赋值字符串值来启动一个新程序\n\
    \n```python\ntext = ‘The political slogan “Workers Of The World Unite!” \\nis\
    \ from The Communist Manifesto.’\n```\n\n![image](img/image00226.jpeg)接下来，添加语句将文本字符串写入文件，并在“with”块中显示文件的当前状态\n\
    \n```python\nwith open( ‘update.txt’ , ‘w’ ) as file :\nfile.write( text )\nprint(\
    \ ‘\\nFile Now Closed?:’ , file.closed )\n```\n\n![image](img/image00227.jpeg)现在，在“with”代码块之后添加一个非缩进语句来显示文件的新状态\n\
    \n```python\nprint( ‘File Now Closed?:’ , file.closed )\n```\n\n![image](img/image00228.jpeg)然后，重新打开文件并显示其内容，以确认它现在包含了整个字符串\n\
    \n```python\nwith open( ‘update.txt’ , ‘r+’ ) as file :\ntext = file.read()\n\
    print( ‘\\nString:’ , text )\n```\n\n![image](img/image00231.jpeg)接下来，添加缩进语句显示当前文件位置，然后重新定位并显示该新位置\n\
    \n```python\nprint( ‘\\nPosition In File Now:’ , file.tell() )\nposition = file.seek(\
    \ 33 )\nprint( ‘Position In File Now:’ , file.tell() )\n```\n\n![image](img/image00232.jpeg)现在，添加一个缩进语句从当前文件位置开始覆盖文本\n\
    \n```python\nfile.write( ‘All Lands’ )\n```\n\n![image](img/image00240.jpeg)然后，添加缩进语句再次在文件中定位，并从新位置覆盖文本\n\
    \n```python\nfile.seek( 61 )\nfile.write( ‘the tombstone of Karl Marx.’ )\n```\n\
    \n![image](img/image00332.jpeg)最后，添加缩进语句返回文件开头并显示其全部更新后的内容\n\n```python\nfile.seek(\
    \ 0 )\ntext = file.read()\nprint( ‘\\nString:’ , text )\n```\n\n![image](img/image00333.jpeg)保存并运行程序——查看文件字符串的更新\n\
    \n![image](img/image00335.jpeg)\n\n![image](img/image00194.jpeg)\n\n`seek()` 函数可选性地接受第二个参数值\
    \ `0`、`1` 或 `2`，分别从起始位置、当前位置或结束位置移动指定数量字符——0 是默认的起始位置。\n\n![image](img/image00193.jpeg)\n\
    \n与字符串一样，文件中的第一个字符位于索引位置零而不是索引位置一。\n\n### 总结\n\n- 字符串可以通过运算符进行操作，例如使用 `+` 拼接字符串，以及使用\
    \ `*` 对字符串进行重复\n- 字符串可以通过切片 `[ ]` 和范围切片 `[ : ]` 运算符操作，这些操作引用字符串字符的索引号\n- 字符串可以通过成员运算符\
    \ `in` 和 `not in` 进行操作，用于在字符串中匹配指定的字符\n- `r`（或 `R`）原始字符串运算符可以放置在字符串之前，以抑制其中包含的任何转义字符\n\
    - “文档字符串”（docstring）是模块、类或函数开头用三引号括的描述性字符串，用于定义其用途\n- `__doc__` 属性可用于引用文档字符串中的字符串描述\n\
    - 使用 `dir()` 函数可以检查 `__builtins__` 模块，以显示默认函数和变量的名称\n- `str` 对象拥有用于字符串格式化的 `format()`\
    \ 函数，以及许多用于修改字符串的函数，例如 `capitalize()`\n- `format` 函数用于格式化字符串的替换字段在逗号分隔的列表中由 `{\
    \ }` 大括号表示\n- 字符串也可以使用 C 风格的 `%s` 替换运算符格式化，标记字符串中要插入文本的地方\n- 文件对象拥有 `open()`、`read()`、`write()`\
    \ 和 `close()` 函数用于处理文件，并具有描述文件属性的功能\n- `open()` 函数必须指定一个文件名字符串参数和一个文件模式字符串参数，例如\
    \ `’r’` 读取文件\n- 已打开的文件对象具有信息属性，可以揭示其当前状态，例如 `mode` 和 `readable()` 值\n- 文件中的读取或写入位置可以通过\
    \ `seek()` 方法指定，并通过 `tell()` 函数报告\n- Python `with` 关键字将文件操作语句分组在一个块中，并自动关闭已打开的文件\n\
    \n10\n\n### 编程对象\n\n*本章将演示如何通过代码将虚拟对象编码到你的程序中*。\n\n- 定义类\n- 复制实例\n- 访问属性\n- 派生类\n\
    - 重写方法\n- 应用逻辑\n- 总结\n\n#### 定义类\n\n我们周围的真实世界对象每个都有我们可以描述的属性和行为。例如，一辆汽车可以被描述为具有“红色”属性和“加速”行为。编程对象就像真实世界对象的虚拟表示，在“类”中描述属性和行为。\n\
    \n“类”是描述对象的特定原型。每个类都包含一个可以同时包含函数和变量的数据结构。类的属性被称为其数据“成员”。类函数成员被称为“方法”，类变量成员（定义在类中但在任何方法定义之外）被称为它的“属性”。可以通过点符号法在整个程序中引用类成员，即在类名后后跟成员名，语法为\
    \ `class-name.method-name()` 或 `class-name.attribute-name`。\n\n![image](img/image00336.jpeg)\n\
    \n类定义从 `class` 关键字开始，后跟一个程序员指定的名称（遵循常用的 Python 命名规范但以大写开头），然后是一个 `:` 冒号。接下来是缩进语句，可选地指定类文档字符串、类变量属性声明和类方法定义——因此类块语法如下：\n\
    \n```python\nclass ClassName :\n    ‘‘‘ class-documentation-string ‘‘‘\n    class-variable-declarations\n\
    \    class-method-definitions\n```\n\n类定义指定了其属性和方法，它是创建工作副本（“实例”）的蓝图。在方法定义内部声明的所有变量被称为“实例”变量，并且仅在定义它们的方法内部局部可用——无法在类结构之外直接引用。\n\
    \n![image](img/image00194.jpeg)\n\n习惯上类名以大写字母开头，对象名以小写字母开头。\n\n"
- fmt: "\nAll properties of a class are referenced internally by the dot notation\
    \ prefix `self` – so an attribute named “sound” is `self.sound`. Additionally,\
    \ all method definitions in a class must have `self` as their first parameter\
    \ – so a method named “talk” is `talk( self )`.\n\nWhen a class instance is created,\
    \ a special `__init__( self )` method is automatically called. Subsequent parameters\
    \ can be added in its parentheses if values are to be passed to initialize its\
    \ attributes.\n\nA complete Python class declaration could look like this example:\n\
    \n```python\nclass Critter :\n    ''' A base class for all critter properties.\
    \ '''\n    count = 0\n    def __init__( self , chat ) :\n        self.sound =\
    \ chat\n        Critter.count += 1\n    def talk( self ) :\n        return self.sound\n\
    ```\n\n![image](Images/image00193.jpeg)\n\nThe class documentation string can\
    \ be accessed via the special `__doc__` string attribute with `Classname.__doc__`.\n\
    \nIt is useful to examine the class components of this example:\n\n* The variable\
    \ `count` is a class variable whose integer value gets shared among all instances\
    \ of this class – this value can be referenced as `Critter.count` from inside\
    \ or outside the class\n* The first method `__init__()` is the initialization\
    \ method that is automatically called when an instance of the class is created\n\
    * The `__init__()` method in this case initializes an instance variable `sound`,\
    \ with a value passed from the `chat` parameter, and increments the value of the\
    \ `count` class variable whenever an instance of this class is created\n* The\
    \ second method `talk()` is declared like a regular function except the first\
    \ parameter is `self` which is automatically incorporated – no value needs to\
    \ be passed from the caller\n* The `talk()` method in this case simply returns\
    \ the value encapsulated in the `sound` instance variable\n\n![image](Images/image00194.jpeg)\n\
    \nWhile a program class cannot perfectly emulate a real-world object, the aim\
    \ is to encapsulate all relevant attributes and actions.\n\n### Copying instances\n\
    \nAn “instance” of a class object is simply a copy of the prototype created by\
    \ calling that class name’s constructor and specifying the required number of\
    \ parameters within its parentheses. The call’s arguments must match those specified\
    \ by the `__init__()` method definition – other than a value for the internal\
    \ `self` parameter.\n\nThe class instance object returned by the constructor is\
    \ assigned to a variable using the syntax `instance-name = ClassName( *args* )`.\n\
    \nDot notation can be used to reference the methods and class variable attributes\
    \ of an instance object by suffixing their name as `instance-name.method-name()`\
    \ or `instance-name.attribute-name`.\n\n![image](Images/image00194.jpeg)\n\nA\
    \ constructor creates a class instance using the class name followed by parentheses\
    \ containing any required parameters. \n\nTypically, a base class can be defined\
    \ as a Python module file so it can be imported into other scripts where instance\
    \ objects can be easily created from the “master” class prototype.\n\n![image](Images/image00188.jpeg)\n\
    \n#### Bird.py\n\n![image](Images/image00241.jpeg)Start a new class file by declaring\
    \ a new class with a descriptive document string\n\n```python\nclass Bird :\n\
    \    '''A base class to define bird properties.'''\n```\n\n![image](Images/image00242.jpeg)Next,\
    \ add an indented statement to declare and initialize a class variable attribute\
    \ with an integer zero value\n\n```python\ncount = 0\n```\n\n![image](Images/image00243.jpeg)Now,\
    \ define the intializer class method to initialize an instance variable and to\
    \ increment the class variable\n\n```python\ndef __init__( self , chat ) :\n \
    \   self.sound = chat\n    Bird.count += 1\n```\n\n![image](Images/image00244.jpeg)Finally,\
    \ add a class method to return the value of the instance variable when called\
    \ – then save this class file\n\n```python\ndef talk( self ) :\n    return self.sound\n\
    ```\n\n![image](Images/image00193.jpeg)You must not pass an argument value for\
    \ the `self` parameter as this is automatically incorporated by Python.\n\n![image](Images/image00188.jpeg)\n\
    \n#### instance.py\n\n![image](Images/image00245.jpeg)Start a program by making\
    \ features of the class file available then display its document string\n\n```python\n\
    from Bird import ***\nprint( ‘\\nClass Instances Of:\\n’ , Bird.__doc__ )\n```\n\
    \n![image](Images/image00246.jpeg)Next, add a statement to create an instance\
    \ of the class and pass a string argument value to its instance variable\n\n```python\n\
    polly = Bird( ‘Squawk, squawk!’ )\n```\n\n![image](Images/image00247.jpeg)Now,\
    \ display this instance variable value and call the class method to display the\
    \ common class variable value\n\n```python\nprint( ‘\\nNumber Of Birds:’ , polly.count\
    \ )\nprint( ‘Polly Says:’ , polly.talk() )\n```\n\n![image](Images/image00337.jpeg)\n\
    \nBird instance – polly\n\n![image](Images/image00248.jpeg)Create a second instance\
    \ of the class passing a different string argument value to its instance variable\n\
    \n```python\nharry = Bird( ‘Tweet, tweet!’ )\n```\n\n![image](Images/image00338.jpeg)Finally,\
    \ display this instance variable value and call the class method to display the\
