    ## Deploying applications


    Your apps developed in the Python language can be deployed on Windows systems
    where the Python interpreter is not installed. To do so, all the program files
    must be “frozen” into a bundle that includes an executable (.exe) file to create
    a simple MSI installer. The `cx_Freeze` tool is a free set of scripts and modules
    for freezing Python programs available at [cx-freeze.sourceforge.net](http://cx-freeze.sourceforge.net).


    The `cx_Freeze` tool uses Python’s “distutils” package and requires a setup script
    to describe your module distribution in order to bundle appropriate support for
    your application. The setup script is traditionally named `setup.py` and consists
    mainly of a call to a `cx_Freeze setup()` function – supplying information as
    parameter pairs. This specifies any required build options, such as image files
    or modules to be included, and identifies the executable script and system platform
    type. For example, the setup script for the application developed throughout this
    chapter must include the logo image file `lotto.gif` and specify the final code
    script named `lotto.py` as the executable script. Once `cx_Freeze` is installed,
    a setup script can be executed from a Windows Command Prompt with the argument
    `bdist-msi` – to create a sub-directory named `dist` containing a distributable
    MSI installer for your app.


    ![image](Images/image00194.jpeg)


    The `cx_Freeze` tool can also create executable files for Mac and Linux systems.
    Discover more on `cx_Freeze` online at [cx_freeze.readthedocs.org](http://cx_freeze.readthedocs.org)
    setup.py.


    ![image](Images/image00188.jpeg)


    setup.py


    ![image](Images/image00270.jpeg)In IDLE start a Python script by making available
    the `sys` module and items from the `cx_Freeze` module.


    ```python

    import sys

    from cx_Freeze import setup, Executable

    ```


    ![image](Images/image00271.jpeg)Next, add statements to identify the base platform
    use.


    ```python

    base = None

    if sys.platform == ‘win32’ : base = ‘Win32GUI’

    ```


    ![image](Images/image00272.jpeg)Now, add a statement listing options to be included.


    ```python

    opts = { ‘include_files’ : [ ‘lotto.gif’ ] , ‘includes’ : [ ‘re’ ] }

    ```


    ![image](Images/image00273.jpeg)Finally, add a call to the `setup()` function
    passing all information as parameter pairs.


    ```python

    setup( name = ‘Lotto’,

    version = ‘1.0’,

    description = ‘Lottery Number Picker’,

