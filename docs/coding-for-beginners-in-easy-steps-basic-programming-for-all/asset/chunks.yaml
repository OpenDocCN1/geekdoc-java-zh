  trans: "\n\nPython 的 `break` 关键字可以在满足特定条件时提前终止循环。`break` 语句位于循环语句块内部，其前面是一个测试表达式。当测试返回\
    \ `True` 时，循环立即结束，程序继续执行下一个任务。例如，在嵌套的内部循环中，它将进入外层循环的下一次迭代。\n\n![image](img/image00188.jpeg)\n\
    \n`nest.py`\n\n![image](img/image00270.jpeg)开始一个新程序，使用语句创建一个迭代三次的循环。\n\n```python\n\
    for i in range( 1, 4 ) :\n```\n\n![image](img/image00271.jpeg)接下来，添加一个缩进的语句，创建一个“嵌套”的内部循环，该循环也迭代三次。\n\
    \n```python\nfor j in range( 1, 4 ) :\n```\n\n![image](img/image00272.jpeg)现在，在内部循环中添加一个进一步缩进的语句，在内部循环的每次迭代中显示计数器数字（外层循环和内部循环的）。\n\
    \n```python\nprint( ‘Running i=’ + i + ‘ j=’ + j )\n```\n\n![image](img/image00273.jpeg)保存并运行此程序——查看每次循环迭代的计数器值。\n\
    \n![image](img/image00281.jpeg)\n\n![image](img/image00194.jpeg)\n\n将这些嵌套的 `for`\
    \ 循环与此处的 `while` 循环示例进行比较。\n\n![image](img/image00188.jpeg)\n\n`break.py`\n\n\
    ![image](img/image00276.jpeg)在内部循环开始处插入 `break` 语句以跳该循环——然后再次运行程序。\n\n```python\n\
    if i == 2 and j == 1 :\n    print( ‘Breaks inner loop at i=2 j=1’ )\n    break\n\
    ```\n\n![image](img/image00282.jpeg)\n\nPython 的 `continue` 关键字可以在满足特定条件时跳过循环的单次迭代。`continue`\
    \ 语句位于循环语句块内部，其前面是一个测试表达式。当测试返回 `True` 时，该次迭代结束，程序继续执行下一次迭代。\n\n![image](img/image00277.jpeg)现在，在内部循环块开始处插入\
    \ `continue` 语句以跳过该循环的第一次迭代——再次运行程序。\n\n```python\nif i == 1 and j == 1 :\n  \
    \  print( ‘Continues inner loop at i=1 j=1’ )\n    continue\n```\n\n![image](img/image00283.jpeg)\n\
    \n![image](img/image00193.jpeg)\n\n当外层循环第二次运行它时，`break` 语句会停止内部循环的所有三次迭代。\n\n\
    ![image](img/image00188.jpeg)\n\n`continue.py`\n\n![image](img/image00193.jpeg)\n\
    \n当外层循环第一次运行它时，`continue` 语句跳过了内部循环的第一次迭代。\n\n### 错误\n\n程序中可以预测错误的部分（例如处理用户输入的部分）通常可以包含在\
    \ `try except` 块中处理“异常错误”。要执行的语句分组在 `try :` 块中，异常被传递给随后的 `except :` 块进行处理。可选的是，后面可以跟一个\
    \ `finally :` 块，其中包含处理异常后执行的语句。\n\nPython 识别许多内置异常，例如在变量名未找到时发生的 `NameError`，在尝试访问的列表索引时发生的\
    \ `IndexError`，以及当内置操作或函数接收不适当的值时发生的 `ValueError`。\n\n每个异常返回一个描述性消息，可以使用 `as`\
    \ 关键字将其方便地赋值给变量。然后可以使用它来显示异常发生时的性质。\n\n![image](img/image00188.jpeg)\n\n`try.py`\n\
    \n![image](img/image00270.jpeg)通过用字符串值初始化变量开始一个新程序。\n\n```python\ntitle = ‘Coding\
    \ for Beginners In Easy Steps’\n```\n\n![image](img/image00271.jpeg)接下来，添加一个 `try`\
    \ 语句块，尝试显示变量值——但指定了错误的名称。\n\n```python\ntry :\n    print( titel )\n```\n\n![image](img/image00272.jpeg)现在，添加一个\
    \ `except` 语句块，在发生 `NameError` 时显示错误消息。\n\n```python\nexcept NameError as msg\
    \ :\n    print( msg )\n```\n\n![image](img/image00273.jpeg)保存并运行程序——查看错误是如何处理的。\n\
    \n![image](img/image00284.jpeg)\n\n![image](img/image00194.jpeg)\n\n在某些编程语言中，这种结构被称为\
    \ try-catch 异常处理。\n\n可以通过在 `except` 块中用括号内的逗号分隔列表指定异常的类型来处理多个异常：\n\n```python\n\
    except ( NameError , IndexError ) as msg :\n    print( msg )\n```\n\n你还可以使用 `raise`\
    \ 关键字强制解释器报告异常，通过它指定要识别的异常类型和括号中的自定义描述性消息。\n\n![image](img/image00188.jpeg)\n\n\
    `raise.py`\n\n![image](img/image00270.jpeg)通过用整数值初始化变量开始一个新程序。\n\n```python\n\
    day = 32\n```\n\n![image](img/image00271.jpeg)接下来，添加一个 `try` 语句块，测试变量并指定异常。\n\n\
    ```python\ntry :\n    if day > 31 :\n        raise ValueError(Invalid’ )\n```\n\
    \n![image](img/image00272.jpeg)现在，添加一个 `except` 语句块，在发生 `ValueError` 时显示。\n\n\
    ```python\nexcept ValueError as msg :\n    print( ‘The found’ , msg )\n```\n\n\
    ![image](img/image00273.jpeg)然后添加一个 `finally` 语句。\n\n```python\nfinally :\n  \
    \  print( ‘But Today Is Beautiful.’ )\n```\n\n![image](img/image00276.jpeg)保存并运行程序——查看引发的错误如何处理。\n\
    \n![image](img/image00281.jpeg)\n\n![image](img/image00194.jpeg)\n\n除非发生异常，否则\
    \ `try` 块中的语句都将执行。\n\n#### 总结\n\n- `if` 关键字对表达式进行布尔值的条件测试。\n- 条件分支通过 `else` 和\
    \ `elif` 为 `if` 测试提供了替代方案。\n- Python 测试表达式后必须跟 `:` 字符，且语句块相对于测试行缩进。\n- `for` 循环遍历指定列表或字符串中的每个项。\n\
    - Python `for` 循环语句后必须跟 `:` 字符，且语句块相对于语句缩进。\n- `range()` 函数生成数值序列，可用于指定 `for`\
    \ 循环的长度。\n- `enumerate()` 函数可以指定列表以显示每个元素的索引及其存储的值。\n- `zip()` 函数可以显示多个列表中相同索引存储的值。\n\
    - `while` 循环在初始测试表达式保持 `True` 时重复，在测试表达式变为 `False` 时结束。\n- Python `while` 循环语句后必须跟\
    \ `:` 字符，且语句块相对于语句缩进。\n- 计数器变量的值可以在测试表达式中测试以控制循环迭代次数。\n- `break` 关键字可用于测试表达式为\
    \ `True` 并在测试返回 `False` 时立即退出循环。\n- `continue` 关键字可用于测试表达式为 `True` 并在测试返回 `False`\
    \ 时退出单次迭代。\n- 预期的运行时异常错误可以通过将语句包含在 `try except` 块中来处理。\n- 可选地，可以使用 `finally` 语句指定在处理异常后执行的语句。\n\
    \n"
- fmt: "\nPrevious examples in this book have used built-in functions of the Python\
    \ programming language, such as the `print()` function. However, most programs\
    \ have a number of coder-defined custom functions that can be called as required\
    \ when the program runs.\n\nA custom Python function is created using the `def`\
    \ (definition) keyword followed by a name of your choice and `()` parentheses.\
    \ The coder can choose any name for a function except the keywords of the programming\
    \ language and the name of an existing built-in function. This line must end with\
    \ a `:` colon character, then the statements to be executed whenever the function\
    \ gets called must appear on lines below and indented. Syntax of a function definition,\
    \ therefore, looks like this:\n\n```python\ndef function-name() :\n    statements-to-be-executed\n\
    \    statements-to-be-executed\n```\n\n![image](Images/image00286.jpeg)\n\nFunction\
    \ statements must be indented from the definition line by the same amount so the\
    \ Python interpreter can recognize the block.\n\nOnce the function statements\
    \ have been executed, program flow resumes at the point directly following the\
    \ function call. This modularity is very useful in programming to isolate set\
    \ routines so they can be called upon repeatedly.\n\nTo create custom functions\
    \ it is necessary to understand the accessibility (“scope”) of variables in a\
    \ program:\n\n* Variables created outside functions can be referenced by statements\
    \ inside functions – they have “global” scope\n* Variables created inside functions\
    \ cannot be referenced from outside the function in which they have been created\
    \ – these have “local” scope\n\nThe limited accessibility of local variables means\
    \ that variables of the same name can appear in different functions without conflict.\n\
    \n![image](Images/image00215.jpeg)\n\nAvoid using global variables in order to\
    \ prevent accidental conflict – use only local variables where possible.\n\nIf\
    \ you want to coerce a local variable to make it accessible elsewhere it must\
    \ first be declared with the Python `global` keyword followed by its name only.\
    \ It may subsequently be assigned a value that can be referenced from anywhere\
    \ in the program. Where a global variable and a local variable have the same name,\
    \ the function will use the local version.\n\n![image](Images/image00188.jpeg)\n\
    \ndef.py\n\n![image](Images/image00287.jpeg)Start a new program by initalizing\
    \ a global variable\n\n```python\nglobal_var = 1\n```\n\n![image](Images/image00288.jpeg)Next,\
    \ create a function named “my_vars” to display the value contained within the\
    \ global variable\n\n```python\ndef my_vars() :\n    print( ‘Global variable:’\
    \ , global_var )\n```\n\n![image](Images/image00289.jpeg)Now, add indented statements\
    \ to the function block to initialize a local variable and display the value it\
    \ contains\n\n```python\nlocal_var = 2\nprint( ‘Local variable:’ , local_var )\n\
    ```\n\n![image](Images/image00290.jpeg)Then, add indented statements to the function\
    \ block to create a coerced global variable and assign an initial value\n\n```python\n\
    global inner_var\ninner_var = 3\n```\n\n![image](Images/image00291.jpeg)Add a\
    \ statement after the function to call upon that function to execute the statements\
    \ it contains\n\n```python\nmy_vars()\n```\n\n![image](Images/image00292.jpeg)Finally,\
    \ add a statement to display the value contained in the coerced global variable\n\
    \n```python\nprint( ‘Coerced Global:’ , inner_var )\n```\n\n![image](Images/image00293.jpeg)Save\
    \ then run the program – to see the custom function display the variable values\n\
    \n![image](Images/image00294.jpeg)\n\n![image](Images/image00194.jpeg)\n\nVariables\
    \ that are not global but appear in some outer scope can be addressed using the\
    \ `nonlocal` keyword.\n\n### Adding parameters\n\nWhen defining a custom function\
    \ in a program you may optionally specify a “parameter” name between the function’s\
    \ parentheses. An “argument” value can then be passed to that parameter by specifying\
    \ the value in the parentheses of the call to the function. The function can now\
    \ use that passed in value during its execution by referencing it via the parameter\
    \ name. For example, defining a function to accept a parameter to print out:\n\
    \n```python\ndef echo( user ) :\n    print( ‘User:’ , user )\n```\n\n![image](Images/image00193.jpeg)\n\
    \nParameters are special variables for internal use only within a function – they\
    \ must adhere to the same naming rules as regular variables.\n\nA call to this\
    \ function must specify an argument value to be passed to the parameter in its\
    \ parentheses so it can be printed out:\n\n```python\necho( ‘Mike’ )\n```\n\n\
    Multiple parameters can be specified in the function definition by including a\
    \ comma-separated list of parameter names within the function parentheses:\n\n\
    ```python\ndef echo( user , lang , sys ) :\n    print( User:’ , user , ‘Language:’\
    \ , lang , ‘Platform:’ , sys )\n```\n\nWhen calling a function whose definition\
    \ specifies parameters, the call must include the same number of arguments as\
    \ parameters. For example, to call this example with multiple parameters:\n\n\
    ```python\necho( ‘Mike’ , ‘Python’ , ‘Windows’ )\n```\n\nThe passed values must\
    \ appear in the same order as the parameter list unless the caller also specifies\
    \ the parameter names like this:\n\n```python\necho( lang = ‘Python’ , user =\
    \ ‘Mike’ , sys = ‘Windows’ )\n```\n\nOptionally, a default value may be specified\
    \ in the parameter list when defining a function. This will be overridden when\
    \ the caller specifies a value for that parameter but will be used by the function\
    \ when no argument value gets passed by the caller:\n\n```python\ndef echo( user\
    \ , lang , sys = ‘Linux’ ) :\n    print( User:’ , user , ‘Language:’ , lang ,\
    \ ‘Platform:’ , sys )\n```\n\nThis means you may call the function passing fewer\
    \ values than the number of parameters specified in the function definition, to\
    \ use the default value, or pass the same number of values to override the default\
    \ value.\n\n![image](Images/image00194.jpeg)\n\n![image](Images/image00188.jpeg)\n\
    \nparam.py\n\n![image](Images/image00287.jpeg)Start a new program by defining\
    \ a function with three parameters that will print out passed-in argument values\n\
    \n```python\ndef echo( user , lang , sys ) :\n    print( ‘User:’, user, ‘Language:’,\
    \ lang, ‘Platform:’, sys )\n```\n\n![image](Images/image00288.jpeg)Next, call\
    \ the function passing string values to the function parameters in the order they\
    \ appear\n\n```python\necho( ‘Mike’ , ‘Python’ , ‘Windows’ )\n```\n\n![image](Images/image00289.jpeg)Now,\
    \ call the function passing string arguments to the function parameters by specifying\
    \ the parameter names\n\n```python\necho( lang = ‘Python’ , user = ‘Mike’ , sys\
    \ = ‘Windows’ )\n```\n\n![image](Images/image00290.jpeg)Then, define another function\
    \ with two parameters having default values that will print out parameter values\n\
    \n```python\ndef mirror( user = ‘Carole’ , lang = ‘Python’ ) :\n    print( ‘\\\
    nUser:’ , user , ‘Language:’ , lang )\n```\n\n![image](Images/image00291.jpeg)Finally,\
    \ add statements to call the second function both using and overriding default\
    \ values\n\n```python\nmirror()\nmirror( lang = ‘Java’ )\nmirror( user = ‘Tony’\
    \ )\nmirror( ‘Susan’ , ‘C++’ )\n```\n\n![image](Images/image00292.jpeg)Save then\
    \ run the program – to see the function display the argument values or default\
    \ parameter values\n\n![image](Images/image00295.jpeg)\n\n![image](Images/image00194.jpeg)\n\
    \nArguments are the actual data values passed to function parameters by the function\
    \ call.\n\n### Returning results\n\nLike Python’s built-in `str()` function, which\
    \ returns a string representation of the value specified as its argument by the\
    \ caller, your custom functions can also return a value to their caller by using\
    \ the `return` keyword to specify a value to be returned. For example, to return\
    \ to the caller the total of adding two specified parameter values like this:\n\
    \n```python\ndef sum( a , b ) :\n    return a + b\n```\n\nThe returned result\
    \ may be assigned to a variable by the caller for subsequent use by the program\
    \ like this:\n\n```python\ntotal = sum( 8 , 4 )\nprint( ‘Eight Plus Four Is:’\
    \ , total )\n```\n\nOr the returned result may be used directly “in-line” like\
    \ this:\n"
