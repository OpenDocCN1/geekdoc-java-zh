    # Summary


    ## Writing lists


    Some programming languages allow variables to be declared with no initial value,
    but in Python programming a variable must be assigned an initial value (initialized)
    in the statement that declares it – otherwise the interpreter will report a “not
    defined” error.


    Multiple variables can be initialized with a common value in a single statement
    using a sequence of `=` assignments. For example, to simultaneously assign a common
    value to three variables:


    `a = b = c = 10`


    ![image](Images/image00255.jpeg)


    Alternatively, multiple variables can be initialized with differing values in
    a single statement using comma separators. For example, to simultaneously assign
    different values to three variables:


    `a , b , c = 1 , 2 , 3`


    Unlike a regular variable, which can only store a single item of data, an array
    variable can store multiple items of data. In Python these are known as “list”
    variables. The data is stored sequentially in list “elements” that are index numbered
    starting at zero. So the first value is stored in element zero, the second value
    is stored in element one, and so on. An array list is created much like any other
    variable but is initialized by assigning values as a comma-separated list between
    square brackets. For example, creating a list named “nums” like this:


    `nums = [ 0 , 1 , 2 , 3 , 4 , 5 ]`


    A single list element can be referenced using the list name followed by square
    brackets containing that element’s index number. This means that `nums[1]` references
    the second element in the example above – not the first element. As element numbering
    starts at zero its first element is referenced with `nums[0]`.


    ![image](Images/image00256.jpeg)


    Lists can have more than one index – to represent multiple dimensions, rather
    than the single dimension of a regular list. Multi-dimensional lists of three
    indices and more are uncommon but two-dimensional lists are useful to store grid-based
    information such as X,Y coordinates.


    A list of string values can even be considered to be a multi-dimensional list
    as each string is itself a list of characters. So each character can be referenced
    by its index number within its particular string.


    ![image](Images/image00188.jpeg)


    list.py


    ![image](Images/image00257.jpeg)Start a new program by initializing a list of
    three elements containing string values


    `quarter = [ ‘January’ , ‘February’ , ‘March’ ]`


    ![image](Images/image00258.jpeg)Next, add statements to individually display the
    value contained in each list element


    `print( ‘First Month :’ , quarter[0] )`

    `print( ‘Second Month :’ , quarter[1] )`

    `print( ‘Third Month :’ , quarter[2] )`


    ![image](Images/image00259.jpeg)Add a statement to create a multi-dimensional
    list of two elements, which themselves are lists that each have three elements
    containing integer values


    `coords = [ [ 1 , 2 , 3 ] , [ 4 , 5 , 6 ] ]`


    ![image](Images/image00260.jpeg)Now, add statements to display the values contained
    in two specific inner list elements


    `print( ‘\nTop Left 0,0 :’ , coords[0][0] )`

    `print( ‘Bottom Right 1,2 :’ , coords[1][2] )`


    ![image](Images/image00261.jpeg)Finally, add a statement to display just one character
    of a string value


    `print( ‘\nSecond Month First Letter :’ , quarter[1][0] )`


    ![image](Images/image00262.jpeg)Save then run the program – to see the list element
    values get displayed


    ![image](Images/image00263.jpeg)


    ![image](Images/image00194.jpeg)


    String indices may also be negative numbers – to start counting from the right
    where -1 references the last letter.


    ![image](Images/image00193.jpeg)


    Loop structures, which are introduced later in this chapter, are often used to
    iterate through list elements.


    ## Changing lists


    List variables, which can contain multiple items of data, are widely used in Python
    programming and have various function “methods” that can be “dot-suffixed” to
    the list name for manipulation:


    | List Method: | Description: |

    | :--- | :--- |

    | `list.append(x)` | Adds item `x` to the end of the list |

    | `list.extend(L)` | Adds all items in list `L` to the end of the list |

    | `list.insert(i,x)` | Inserts item `x` at index position `i` |

    | `list.remove(x)` | Removes first item `x` from the list |

    | `list.pop(i)` | Removes item at index position `i` and returns it |

    | `list.index(x)` | Returns the index position in the list of first item `x` |

    | `list.count(x)` | Returns the number of times `x` appears in the list |

    | `list.sort()` | Sort all list items, in place |

    | `list.reverse()` | Reverse all list items, in place |


