    ## Summary\n\n- An algorithm is a well-defined sequence of instructions to perform\
    \ a specific task\n- Each algorithm takes one or more values as input and produces\
    \ one or more resulting values as output\n- An algorithm may be created in code\
    \ as a function whose statements define a sequence of instructions to perform\
