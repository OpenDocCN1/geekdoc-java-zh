    **cat.purr( ‘Kitty’ )**


    **cat.lick( ‘Kitty’ )**


    **cat.nap( ‘Kitty’ )**


    ![image](Images/image00293.jpeg)Start another program by making the “cat” module
    functions available once more


    **import cat**


    ![image](Images/image00297.jpeg)Then request the user enters a name to overwrite
    the default parameter value


    **pet = input( ‘Enter A Pet Name: ‘ )**


    ![image](Images/image00298.jpeg)Finally, call each function passing the user-defined
    value as the argument


    **cat.purr( pet )**


    **cat.lick( pet )**


    **cat.nap( pet )**


