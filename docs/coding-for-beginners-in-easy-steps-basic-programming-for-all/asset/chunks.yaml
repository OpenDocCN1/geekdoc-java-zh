    A computer is merely a machine that can process a set of simple instructions very
    quickly. The set of instructions it processes is known as a “program”, and the
    instructions are known as “code”.


    People who write computer programs are known as “programmers” or “coders”. Their
    programs have enabled computers to become useful in almost every area of modern
    life:


    - **In the hand** – computers are found in cellphone devices for tasks such as
    communication via voice, text, and social media

    - **In the home** – computers are found in household devices such as TV sets,
    gaming consoles, and washing machines

    - **In the office** – computers are found in desktop devices for tasks such as
    word processing, payroll, and graphic design

    - **In the store** – computers are found in retail devices such as automatic teller
    machines (ATMs) and bar code scanners

    - **In the car** – computers are found in control devices for tasks such as engine
    management, anti-lock braking and security

    - **In the sky** – computers are found in airplanes for piloting and in air traffic
    control centers for safe navigation


    ![image](Images/image00192.jpeg)


    These are, in fact, just a few examples of how computers affect our lives today.
    Yet, computers are really dumb! They can only count from zero to one, and cannot
    think for themselves.


    A computer is a collection of electronic components – collectively known as “hardware”.
    To make the computer function it must be given a set of program instructions –
    known as “software”.


    It is important that each computer program provides clear step-by-step instructions
    that the computer can execute without errors. The coder must therefore break down
    the task required of the computer into simple unambiguous steps. For example,
    a program to move a mobile robot from indoors to outdoors must include instructions
    to have the robot locate a doorway and navigate around any obstacles. So the coder
    must always consider what possible unexpected difficulties a program may encounter.


    Program instructions must be presented to the computer in a language it can understand.
    At the most basic level the computer can understand “machine code”, which moves
    items around in its memory to perform tasks. This type of obscure low-level code
    is incredibly tedious as it requires many lines of instruction to perform even
    a simple task.


    Fortunately, over the years, many “high-level” programming languages have been
    developed that allow the coder to compose instructions in more human-readable
    form. These modern high-level programs are automatically translated into the machine
    code that the computer can understand by a “compiler” or by an “interpreter”.
    In order to become a coder you must typically learn at least one of these high-level
    programming languages:


    - **C** – a powerful compiled language that is closely mapped to machine code
    and used to develop operating systems

    - **C++** – an enhanced compiled language developing on C to provide classes for
    Object Oriented Programming (OOP)

    - **C#** – a modern compiled language designed by Microsoft for the .NET framework
    and Common Language Infrastructure

    - **Java** – a portable compiled language that is designed to run on any platform
    regardless of the hardware architecture

    - **Python** – a dynamic interpreted language that allows both functional and
    Object Oriented Programming (OOP)


    ![image](Images/image00193.jpeg)


    Programs written in an interpreted language can be run immediately but those written
    in compiled languages must first be compiled before they can be run.


    Just as human languages have similarities, such as verbs and nouns, these programming
    languages have certain similarities as they each possess “data structures”, in
    which to store information, and “control structures” that determine how the program
    proceeds.


    The examples in this book use the `Python` language to demonstrate how to code
    computer programs as it has a simple language syntax, requires no compilation,
    includes a large library of standard functions, and can be used to create both
    Console programs and windowed GUI (Graphical User Interface) apps.


    ![image](Images/image00194.jpeg)


    Python is a total package of “batteries included”.


    ## Setting up


    Before you can begin coding programs in the Python language you need to set up
    a programming environment on your computer by installing the Python interpreter
    and the standard library of tested code modules that comes along with it. This
    is available online as a free download from the Python Software Foundation.


    ![image](Images/image00195.jpeg)


    Launch a web browser and navigate to [python.org/downloads](http://python.org/downloads)
    then click the Downloads button to grab the latest version for your system – in
    this case it’s “Python 3.4.2”


    ![image](Images/image00196.jpeg)When the download completes run the installer
    and choose whether to install for all users or just yourself, then click the Next
    button to proceed


    ![image](Images/image00197.jpeg)


    Now, accept the suggested default installation location, which will be a directory
    on your root `C:\` drive named “Python” and version number – in this example it’s
    a directory at `C:\Python34` for Python version 3.4.2


    ![image](Images/image00198.jpeg)


    ![image](Images/image00199.jpeg)


    Installers for Mac OS X and Other Platforms are also freely available at [python.org/downloads](http://python.org/downloads)


    ![image](Images/image00194.jpeg)


    Do accept the suggested destination directory – such as `C:\Python34` that is
    suggested here.


    ![image](Images/image00200.jpeg)Click the Next button to proceed then be sure
    to select the feature to “Add python.exe to Path”


    ![image](Images/image00201.jpeg)


    ![image](Images/image00202.jpeg)Click on Next to begin copying files onto your
    computer then click the Finish button to complete


    Upon completion the Python group is added to your Start/Apps menu. Most important
    of this group is the IDLE item that launches the Python development environment.


    ![image](Images/image00203.jpeg)


    ![image](Images/image00194.jpeg)


    Adding Python to the system Path makes it available from within any directory.
    After installation, you can exactly enter the command `python -V` at a Command
    Prompt to see the interpreter respond with its version number.


    ![image](Images/image00194.jpeg)


    You will use the IDLE launcher often so right-click on its icon and choose “Pin
    to taskbar” to make it readily available from the Windows Desktop.


    ## Exploring IDLE


    The installed Python software package includes the Development Environment (IDLE)
    in which you can easily code and run programs, or snippets, written in the Python
    language. IDLE provides two different windows for program development:


    - Shell Window

    - Edit Window


    When you start up IDLE it opens a new window containing a menu bar, a banner describing
    the version, and a `>>>` prompt. This is the Shell Window in which you can interact
    directly with the Python interpreter by entering statements at the prompt.


    ![image](Images/image00204.jpeg)


    If the interpreter understands your entry it will respond with an appropriate
    reply, otherwise it will report an error.


    You can make the interpreter print out a string of text by entering a Python `print()`
    function statement that encloses your string within quote marks inside the parentheses
    at the interactive prompt.


    ![image](Images/image00194.jpeg)


    Most programming languages require text strings to be enclosed in quote marks
    to differentiate them from program code. By convention, Python coders use single
    quotes.


    You can also make the interpreter print out the result of a simple arithmetic
    sum by entering a valid sum statement at the prompt.


    If your statement is not valid, such as a sum that attempts to divide a number
    by zero, the interpreter will print out an error message helpfully describing
    the nature of the error.

    '
