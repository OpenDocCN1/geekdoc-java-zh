    ![image](Images/image00197.jpeg)Now, add a statement to create a struct_time object
    from the elapsed time value


    **struct = localtime( start_timer )**


    ![image](Images/image00200.jpeg)Then, announce that a countdown timer is about
    to begin from the current time starting point


    **print( ‘Starting Countdown At:’ , strftime( ‘%X’ , struct ) )**


    ![image](Images/image00202.jpeg)Add a loop to initialize and print a counter variable
    value then decrement the counter by one and pause for one second on each iteration


    **i = 10**


    **while i > -1 :**


    **print( i )**


    **i -= 1**


    **sleep( 1 )**


    ![image](Images/image00207.jpeg)Next, initialize a variable with a floating point
    number that is the current elapsed time now since the Epoch


    **end_timer = time()**


    ![image](Images/image00212.jpeg)Now, initialize a variable with the rounded seconds
    value of the time difference between the two timed points


    **difference = round( end_timer - start_timer )**


    ![image](Images/image00213.jpeg)Finally, add a statement to display the time taken
    to execute the countdown loop


    **print( ‘\nRuntime:’ , difference , ‘Seconds’ )**


    ![image](Images/image00323.jpeg)Save then run the program – to see the loop pause
    on each iteration and elapsed time


    ![image](Images/image00324.jpeg)


    ![image](Images/image00194.jpeg)


    The argument to the sleep() function may be a floating point number to indicate
    a more precise sleep pause time.


    ![image](Images/image00215.jpeg)


    Do not confuse the **time.strftime()** function used in this example with the
    **datetime.strftime()** function used in the previous example.


    **Summary**


    •The sys module has attributes that contain the Python version number, interpreter
    location, and path to search for modules


    •The keyword module has a kwlist attribute that contains a list of all current
    Python keywords


    •The math module provides functions to perform mathematical procedures such as
    math.ceil() and math.floor()


    •The math.pow() and math.sqrt() functions both return their results as a decimal
    value of the float data type


    •Trigonometry can be performed using math module functions such as math.sin(),
    math.cosin() and math.tan()


    •The random module provides a random() function that produces pseudo random numbers
    and a sample() function that produces a list of elements selected at random from
    a sequence


    •Floating-point float numbers cannot accurately represent all decimal numbers


    •The decimal module provides a Decimal() object with which floating-point numbers
    can be accurately represented to calculate monetary values


    •The datetime module provides a datetime object with year, month, day, hour, minute,
    second, microsecond attributes that can be referenced by dot-suffixing or with
    the getattr() function


    •A datetime object has a strftime() function that can specify a directive to return
    a formatted part of the object


    •The time module provides a time() function that returns the current elapsed time
    in seconds since the Epoch


    •The gmtime() and localtime() functions return a struct_time object with attributes
    containing date and time components


    9


    **Managing text**


    *This chapter demonstrates how to manipulate text strings in your programs and
    how to store text in files*.


    [**Manipulating strings**](#part0012.xhtml_sec1)


    [**Formatting strings**](#part0012.xhtml_sec2)


    [**Modifying strings**](#part0012.xhtml_sec3)


