- fmt: "\nA key:value pair can be deleted from a dictionary by specifying the dictionary\
    \ name and the pair’s key to the `del` keyword. Conversely, a key:value pair can\
    \ be added to a dictionary by assigning a value to the dictionary’s name and a\
    \ new key.\n\nPython dictionaries have a `keys()` method that can be dot-suffixed\
    \ to the dictionary name to return a list, in random order, of all the keys in\
    \ that dictionary. If you prefer the keys to be sorted into alphanumeric order,\
    \ simply enclose the statement within the parentheses of the Python `sorted()`\
    \ function.\n\nA dictionary can be searched to see if it contains a particular\
    \ key with the Python `in` operator, using the syntax `key in dictionary`. The\
    \ search will return a Boolean `True` value when the key is found in the specified\
    \ dictionary, otherwise it will return `False`.\n\nDictionaries are the final\
    \ type of data container available in Python programming. In summary, the various\
    \ types are:\n\n- **Variable** – stores a single value\n- **List** – stores multiple\
    \ values in an ordered index array\n- **Tuple** – stores multiple fixed values\
    \ in a sequence\n- **Set** – stores multiple unique values in an unordered collection\n\
    - **Dictionary** – stores multiple unordered key:value pairs\n\n![image](Images/image00194.jpeg)\n\
    \nData is frequently associated as key:value pairs – for example, when you submit\
    \ a web form a text value typed into an input field is typically associated with\
    \ that text field’s name as its key.\n\n![image](Images/image00188.jpeg)\n\ndict.py\n\
    \n![image](Images/image00257.jpeg)Start a new program by initializing a dictionary\
    \ then display its data class type and its key:value contents\n\n```\ninfo = {\
    \ ‘name’ : ‘Bob’ , ‘ref’ : ‘Python’ , ‘sys’ : ‘Win’ }\nprint( ‘info:’ , type(\
    \ info ) )\nprint( ‘Dictionary:’ , info )\n```\n\n![image](Images/image00258.jpeg)Next,\
    \ display a single value referenced by its key\n\n```\nprint( ‘\\nReference:’\
    \ , info[ ‘ref’ ] )\n```\n\n![image](Images/image00259.jpeg)Now, display all keys\
    \ within the dictionary\n\n```\nprint( ‘\\nKeys’ , info.keys() )\n```\n\n![image](Images/image00260.jpeg)Delete\
    \ one pair from the dictionary and add a replacement pair then display the new\
    \ key:value contents\n\n```\ndel info[ ‘name’ ]\ninfo[ ‘user’ ] = ‘Tom’\nprint(\
    \ ‘\\nDictionary:’ , info )\n```\n\n![image](Images/image00261.jpeg)Finally, search\
    \ the dictionary for a specific key and display the result of the search\n\n```\n\
    print( ‘\\nIs There A name Key?:’ ,’name’ in info )\n```\n\n![image](Images/image00262.jpeg)Save\
    \ the file then run this program – to see the dictionary keys and values\n\n![image](Images/image00268.jpeg)\n\
    \n![image](Images/image00215.jpeg)\n\nNotice that quotes within a string must\
    \ be preceded by a backslash escape character – to prevent the string being prematurely\
    \ terminated.\n\n### Summary\n\n- Multiple variables can be initialized in a single\
    \ statement using a sequence of `=` assignments\n- A Python list is an array variable\
    \ that can store multiple items of data in sequentially numbered elements that\
    \ start at zero\n- Data stored in a list element can be referenced using the list\
    \ name followed by an index number in `[]` square brackets\n- A list element can\
    \ have more than one index to represent multiple dimensions, such as X and Y coordinates\n\
    - List variables have a number of methods that can be dot-suffixed to the list\
    \ name for manipulation\n- The `len()` function returns the length of a specified\
    \ list\n- An individual list element can be deleted by specifying the list name\
    \ and element index number to the Python `del` keyword\n- A Python tuple is an\
    \ immutable list whose values can be assigned to individual variables by “sequence\
    \ unpacking”\n- Data stored in a tuple element can be referenced using the tuple\
    \ name followed by an index number in `[]` square brackets\n- A Python set is\
    \ an ordered collection of unique elements whose values can be compared and manipulated\
    \ by its methods\n- Data stored in a set cannot be referenced by its index number\n\
    - Set variables have methods that can be dot-suffixed to the list name for manipulation\
    \ and comparison\n- The Python built-in membership `in` operator can be used to\
    \ seek a value within a set\n- A set can be converted to a regular list using\
    \ the `list()` function to allow reference of element data by index number\n-\
    \ A Python dictionary is a list of key:value pairs of data in which each key must\
    \ be unique\n- Data stored in a dictionary element can be referenced using the\
    \ dictionary name followed by its key in `[]` square brackets\n\n5\n\n## Controlling\
    \ blocks\n\n*This chapter demonstrates how to create code to control the flow\
    \ of your programs*.\n\n- [Branching choices](#part0008.xhtml_sec1)\n- [Counting\
    \ loops](#part0008.xhtml_sec2)\n- [Looping conditions](#part0008.xhtml_sec3)\n\
    - [Skipping loops](#part0008.xhtml_sec4)\n- [Catching errors](#part0008.xhtml_sec5)\n\
    - [Summary](#part0008.xhtml_sec6)\n\n### Branching choices\n\nAs in many programming\
    \ languages the Python `if` keyword performs a basic conditional test that evaluates\
    \ a given expression for a Boolean value of `True` or `False`. This allows a program\
    \ to proceed in different directions according to the result of the test and is\
    \ known as “conditional branching”.\n\nThe `if` keyword must be followed by a\
    \ `:` colon, then statements to execute when the test succeeds. The syntax looks\
    \ like:\n\n```\nif test-expression:\n    statements-to-execute-when-test-expression-is-True\n\
    ```\n\n![image](Images/image0269.jpeg)\n\nThe `if: elif: else:` sequence is the\
    \ Python equivalent of the **switch** or **case** statements found in other languages.\n\
    \nOptionally, an `if` test can offer alternative statements to execute when the\
    \ test fails by appending an `else` keyword. The `else` keyword must be followed\
    \ by a `:` colon and indented statements.\n\n```python\nif test-expression:\n\
    \    statements-if-true\nelse:\n    statements-if-false\n```\n\n `if` test block\
    \ can be followed by an alternative test using the `elif` keyword (“else if”)\
    \ that offers statements to be executed when the alternative test succeeds. This,\
    \ too, must be aligned with the `if` keyword, followed by a `:` colon, and its\
    \ statements indented. A final `else` keyword can then be added to offer alternative\
    \ statements when the test fails. The syntax for the complete `if-elif-else` structure\
    \ looks like:\n\n```python\nif test-expression-1:\n    statements-to-execute-when-test-expression-1-is-True\n\
    elif test-expression-2:\n    statements-to-execute-when-test-expression-2-is-True\n\
    else:\n    statements-to-execute-when-test-expressions-are-False\n```\n\n![image](Images/image00215.jpeg)\n\
    \nIndentation of code is very important in Python as it identifies code blocks\
    \ to the interpreter – other programming languages use bracketing such as `{ }`\
    \ braces.\n\n![image](Images/image00188.jpeg)\n\nif.py\n\n![image](Images/image00270.jpeg)Start\
    \ a new program by initializing a variable with user input of an integer value\n\
    \n```python\nnum = int( input( ‘Please Enter A Number: ‘ ) )\n```\n\n![image](Images/image00271.jpeg)Next,\
    \ test the variable and display an appropriate response\n\n```python\nif num >\
    \ 5:\n    print('Number Exceeds 5')\nelif num < 5:\n    print('Number is Less\
    \ Than 5')\nelse:\n    print('Number Is 5')\n```\n\n![image](Images/image00272.jpeg)Now,\
    \ test the variable again using two expressions and display a response only upon\
    \ success\n"
