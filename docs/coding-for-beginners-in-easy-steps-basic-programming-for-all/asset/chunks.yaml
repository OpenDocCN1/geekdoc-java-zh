    \ 编码获得的技能可以转移到其他语言，例如 C 编程语言。C 语言起源于 20 世纪 70 年代，设计为容易编译成低层机器代码。它的效率使其适用于从嵌入式系统到操作系统的广泛应用。\n\
    \n在 Python 代码中此处 和此处描述的简单猜数字游戏程序可以在类似的 C 等效程序中重建。\n\n![image](img/image00188.jpeg)\n\
