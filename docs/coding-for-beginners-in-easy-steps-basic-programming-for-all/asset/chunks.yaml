  trans: "\n\n![image](img/image00246.jpeg)现在，使用内置函数显示所有非私有实例属性及其对应的值。\n\n```python\n\
    print( ‘\\nChick Attributes...’ )\n\nfor attrib in dir( chick ) :\n    if attrib[0]\
    \ != ‘_’ :\n        print( attrib , ‘:’ , getattr( chick , attrib ) )\n```\n\n\
    ![image](img/image00247.jpeg)最后，删除新属性并使用内置函数确认其已删除。\n\n```python\ndelattr( chick\
    \ , ‘age’ )\nprint( ‘\\nChick age Attribute?’ , hasattr( chick , ‘age’ ) )\n```\n\
    \n![image](img/image00248.jpeg)保存并运行程序 – 查看实例属性被处理的过程。\n\n![image](img/image00342.jpeg)\n\
    \n![image](img/image00343.jpeg)\n\n鸟类实例 – 小鸡\n\n![image](img/image00193.jpeg)\n\
    \n此循环会跳过任何以下划线开头的属性，因此“私有”属性不会显示在列表中。\n\n### 派生类\n\nPython 类可以作为一个全新的类来创建（如之前的示例所示），也可以从现有类“派生”。重要的是，派生类会继承其所派生的父类（基类）的成员，同时还拥有它自己的成员。\n\
    \n从基类继承成员的能力允许创建派生类，这些类共享某些共同属性，这些属性已经在基类中定义了。例如，“多边形”（Polygon）基类可以定义所有多边形通用的宽度和高度属性。“矩形”（Rectangle）和“三角形”（Triangle）类可以从\
    \ `Polygon` 类派生 – 继承宽度和高度属性，同时拥有定义其自身独特特征的成员。\n\n![image](img/image00344.jpeg)\n\
    \n![image](img/image00345.jpeg)\n\n继承的优点非常强大，它是面向对象编程（OOP）的第二个原则。\n\n派生类的声明在类类名后添加\
    \ `()` 括号，用以指定其父基类的名称。\n\n![image](img/image00188.jpeg)\n\n`Polygon.py`\n\n![image](img/image00241.jpeg)创建一个新类文件，声明一个具有两个类变量和一个设置其值方法的基类。\n\
    \n```python\nclass Polygon :\nwidth = 0\nheight = 0\ndef set_values( self , width\
    \ , height ) :\n    Polygon.width = width\n    Polygon.height = height\n```\n\n\
    ![image](img/image00188.jpeg)\n\n`Rectangle.py`\n\n接下来，创建一个类文件，声明一个具有返回被处理过的类变量值之方法的派生类。\n\
    \n```python\nfrom Polygon import *\nclass Rectangle( Polygon ) :\n    def area(\
    \ self ) :\n        return self.width * self.height\n```\n\n![image](img/image00188.jpeg)\n\
    \n`Triangle.py`\n\n![image](img/image00243.jpeg)现在，创建另一个类文件，声明一个具有返回被处理过的类变量值之方法的派生类。\n\
    \n```python\nfrom Polygon import *\nclass Triangle( Polygon ) :\n    def area(\
    \ self ) :\n        return ( self.width * self.height ) / 2\n```\n\n![image](img/image00244.jpeg)保存这三个类文件，然后通过提供两个派生类的的功能启动一个新程序。\n\
    \n```python\nfrom Rectangle import *\nfrom Triangle import *\n```\n\n![image](img/image00245.jpeg)接下来，为每个派生类创建一个实例。\n\
    \n```python\nrect = Rectangle()\ntrey = Triangle()\n```\n\n![image](img/image00246.jpeg)现在，调用从基类继承的类方法，传递参数以赋值给类变量。\n\
    \n```python\nrect.set_values( 4 , 5 )\ntrey.set_values( 4 , 5 )\n```\n\n![image](img/image00247.jpeg)最后，显示处理从基类继承的类变量的结果。\n\
    \n```python\nprint( ‘Rectangle Area:’ , rect.area() )\nprint( ‘Triangle Area:’\
    \ , trey.area() )\n```\n\n![image](img/image00248.jpeg)保存并运行程序 – 查看使用继承特性显示的输出。\n\
    \n![image](img/image00346.jpeg)\n\n![image](img/image00188.jpeg)\n\n`inherit.py`\n\
    \n![image](img/image00194.jpeg)\n\n一个类声明可以通过在声明名称后的括号中列出多个基类来派生自多个一个类。\n\n![image](img/image00215.jpeg)\n\
    \n不要混淆类实例和派生类 – 实例是类的拷贝，而派生类是一个继承其所派生的基类属性的新类。\n\n### 方法重写\n\n可以在派生类中声明一个方法来重写基类中匹配的方法\
    \ – 如果两个方法声明都具有相同的名称且列出的参数数量相同。这有效地隐藏了基类方法，除非显式使用基类名进行标识，否则它是不可访问的。\n\n当基类中的方法提供默认参数值时，可以在显式调用基类方法中使用它，或者通过重写方法提供替代值。\n\
    \n![image](img/image00188.jpeg)\n\n`Person.py`\n\n![image](img/image00241.jpeg)创建一个新类文件，声明一个具有两个类变量和一个设置其值方法的基类。\n\
    \n```python\nclass Person :\ndef __init__( self , name ) :\n    self.name = name\n\
    def speak( self , msg = ‘Calling Base’ ) :\n    print( self.name , msg )\n```\n\
    \n![image](img/image00188.jpeg)\n\n`Man.py`\n\n![image](img/image00242.jpeg)接下来，创建一个类文件，声明一个具有重写基类方法的派生类。\n\
    \n```python\nfrom Person import *\nclass Man( Person ) :\n    def speak( self\
    \ , msg ) :\n        print( self.name , ‘:\\tHello!’ , msg )\n```\n\n![image](img/image00188.jpeg)\n\
    \n`Hombre.py`\n\n![image](img/image00243.jpeg)现在，创建另一个类文件，声明一个具有再次重写基类相同方法的派生类。\n\
    \n```python\nfrom Person import *\nclass Hombre( Person ) :\n    def speak( self\
    \ , msg ) :\n        print( self.name , ‘:\\tHola!’ , msg )\n```\n\n![image](img/image00188.jpeg)\n\
    \n`override.py`\n\n![image](img/image00244.jpeg)保存这三个类文件，然后通过提供两个类的功能启动一个新程序。\n\
    \n```python\nfrom Man import *\nfrom Hombre import *\n```\n\n![image](img/image00245.jpeg)接下来，为每个派生类创建一个实例，初始化“name”实例变量。\n\
    \n```python\nguy_1 = Man( ‘Richard’ )\nguy_2 = Hombre( ‘Ricardo’ )\n```\n\n![image](img/image00246.jpeg)现在，调用每个派生类的重写方法，为“msg”参数传递不同的值。\n\
    \n```python\nguy_1.speak( ‘It’s a beautiful evening.\\n’ )\nguy_2.speak( ‘Es una\
    \ tarde hermosa.\\n’ )\n```\n\n![image](img/image00247.jpeg)最后，显式调用基类方法，传递每个派生类的引用\
    \ – 但没有提供“msg”变量，以便使用其默认值。\n\n```python\nPerson.speak( guy_1 )\nPerson.speak(\
    \ guy_2 )\n```\n\n![image](img/image00248.jpeg)保存并运行程序 – 查看重写和基类方法的输出。\n\n![image](img/image00347.jpeg)\n\
    \n![image](img/image00348.jpeg)\n\nMan – Richard\n\nHombre – Ricardo\n\n### 应用意义\n\
    \n面向对象编程（OOP）的三个基石是封装、继承和多态。本章之前的示例演示了数据如何封装在 Python 类中，以及派生类如何继承其基类的属性。本示例介绍了多态这一最后一个基石原则。\n\
    \n“多态”（源希腊语，意思是“多种形式”）描述了根据上下文为实体分配不同含义或目的的能力。\n\n![image](img/image00349.jpeg)\n\
    \n"
- fmt: "\nIn Python, the `+` character entity can be described as polymorphic because\
    \ it represents either the arithmetical addition operator, in the context of numerical\
    \ operands, or the string concatenation operator in the context of character operands.\n\
    \nPerhaps more importantly, Python class methods can also be polymorphic because\
    \ the Python language uses “duck typing” – meaning... if it walks like a duck,\
    \ swims like a duck, and quacks like a duck, then that bird is reckoned to be\
    \ a duck.\n\nIn a duck-typed language you can create a function to take an object\
    \ of any type and call that object’s methods. If the object does indeed have the\
    \ called methods (is reckoned to be a duck) they are executed, otherwise the function\
    \ signals a run-time error.\n\nLike-named methods of multiple classes can be created\
    \ and instances of those classes will execute the associated version.\n\n![image](Images/image00188.jpeg)\n\
    \nDuck.py\n\n![image](Images/image00241.jpeg)Create a new class file that declares\
    \ a class with methods to display strings unique to the class\n\n```python ownclass\
    \ Duck :\n    def talk( self ) :\n        print( ‘\\nDuck Says: Quack!’ )\n  \
    \  def coat( self ) :\n        print( ‘Duck Wears: Feathers’ )\n```\n\n![image](Images/image00188.jpeg)\n\
    \nMouse.py\n\n![image](Images/image00242.jpeg)Next, create a class file that declares\
    \ a class with like-named methods but to display strings unique to this class\n\
    \n```python\nclass Mouse :\n    def talk( self ) :\n        print( ‘\\nMouse Says:\
    \ Squeak!’ )\n    def coat( self ) :\n        print( ‘Mouse Wears: Fur’ )\n```\n\
    \n![image](Images/image00188.jpeg)\n\npolymorph.py\n\n![image](Images/image00243.jpeg)Save\
    \ the two class files then start a new program by making features of both classes\
    \ available\n\n```python\nfrom Duck import *\nfrom Mouse import *\n```\n\n![image](Images/image00244.jpeg)Next,\
    \ define a function that accepts any single object as its parameter and attempts\
    \ to call methods of that object\n\n```python\ndef describe( object ) :\n    object.talk()\n\
    \    object.coat()\n```\n\n![image](Images/image00245.jpeg)Now, create an instance\
    \ object of each class\n\n```python\ndonald = Duck()\nmickey = Mouse()\n```\n\n\
    ![image](Images/image00246.jpeg)Finally, add statements to call the function and\
    \ pass each instance object to it as an argument\n\n```python\ndescribe( donald\
    \ )\ndescribe( mickey )\n```\n\n![image](Images/image00247.jpeg)Save then run\
    \ the program – to see the methods of the associated versions get called\n\n![image](Images/image00350.jpeg)\n\
    \n![image](Images/image00351.jpeg)\n\nDuck – donald\n\n![image](Images/image00352.jpeg)\n\
    \nMouse – mickey\n\n![image](Images/image00193.jpeg)\n\nA class can have only\
    \ one method with a given name – method overloading is not supported in Python.\n\
    \nObject Oriented Programming with Python allows data encapsulation, inheritance,\
    \ and polymorphism. Base class methods can be overridden by like-named methods\
    \ in derived classes. Python does not, however, support the technique of “overloading”\
    \ found in other languages – in which methods of the same name can be created\
    \ with different parameter lists in a single class.\n\n### Summary\n\n- Programming\
    \ objects are like virtual representations of real-world objects describing attributes\
    \ and behaviors in a “class”\n- A class is a data structure prototype describing\
    \ object properties with its methods and attribute members\n- Each class declaration\
    \ begins with the `class` keyword and is followed by an indented code block that\
    \ may contain a class document string, class variables, and class methods\n- Class\
    \ variables have global scope but instance variables (declared within method definitions)\
    \ have only local scope\n- Instance variables encapsulate data securely in a class\
    \ structure and are initialized when a class instance is created\n- Properties\
    \ of a class are referenced by dot notation and are addressed internally using\
    \ the `self` prefix\n- A class instance is a copy of the prototype that automatically\
    \ calls its `__init__()` method when the instance is first created\n- An attribute\
    \ of a class can be added, modified, or removed using dot notation or manipulated\
    \ using the built-in functions `getattr()`, `hasattr()`, `setattr()`, and `delattr()`\n\
    - The name of attributes automatically supplied by Python begin with an underscore\
    \ character to notionally indicate privacy\n- A derived class inherits the method\
    \ and attribute members of the parent base class from which it is derived\n- The\
    \ declaration of a derived class must state the name of its parent base class\
    \ in parentheses after its own class name\n- A method of a derived class can override\
    \ a matching method of the same name in its parent base class\n- A method of a\
    \ base class can be called explicitly using the base class name for identification\n\
    - Python is a duck-typed language that supports polymorphism for like-named methods\
    \ of multiple classes\n- The three cornerstones of Object Oriented Programming\
    \ (OOP) are Encapsulation, Inheritance, and Polymorphism\n\n11\n\n### Building\
    \ interfaces\n\n*This chapter demonstrates how to code graphical windowed programs*.\n\
    \n- [Launching interfaces](#part0014.xhtml_sec1)\n- [Responding buttons](#part0014.xhtml_sec2)\n\
    - [Displaying messages](#part0014.xhtml_sec3)\n- [Gathering entries](#part0014.xhtml_sec4)\n\
    - [Listing options](#part0014.xhtml_sec5)\n- [Polling options](#part0014.xhtml_sec6)\n\
    - [Checking boxes](#part0014.xhtml_sec7)\n- [Adding images](#part0014.xhtml_sec8)\n\
    - [Summary](#part0014.xhtml_sec9)\n\n#### Launching interfaces\n\nThe standard\
    \ Python module that you can use to create graphical applications is called “tkinter”\
    \ – a tool to interface with the system GUI (Graphical User Interface). The tkinter\
    \ module can be imported into a program like any other. Every tkinter program\
    \ must begin by calling the `Tk()` constructor to create a window. The window’s\
    \ size can optionally be specified as `widthheight` string argument to the window\
    \ object’s `geometry()` method. Similarly, the window’s title can be specified\
    \ as a title string argument to the window object’s `title()` method. If not specified\
    \ default size and title values will be used.\n\n![image](Images/image00215.jpeg)\n\
    \nThere can be only one call to the `Tk()` constructor and it must be at the start\
    \ of the program. Every tkinter program must also call the window object’s `mainloop()`\
    \ method to capture events, such as when the user closes the window to quit. This\
    \ loop should appear at the end of the program as it also handles window updates\
    \ that may be implemented during execution.\n\nWith tkinter, all the graphical\
    \ controls that can be included in the application window, such as buttons or\
    \ checkboxes, are referred to as “widgets”. Perhaps the simplest widget is a non-interactive\
    \ label object that merely displays text or an image. A label object can be created\
    \ by specifying the window object’s name and text=`string` as arguments to `Label()`\
    \ constructor.\n\nOnce created, each widget, such as a label, must then be added\
    \ to the window using one of these “geometry manager” methods:\n\n- `pack()` –\
    \ places the widget against a specified side of the window using `TOP`, `BOTTOM`,\
    \ `LEFT`, or `RIGHT` constant values specified to its `side=` argument\n- `place()`\
    \ – places the widget at XY coordinates in the window using numerical values specified\
    \ to its `x=` and `y=` arguments\n- `grid()` – places the widget in a cell within\
    \ the window using numerical values specified to its `row=` and `column=` arguments\n\
    \n![image](Images/image00194.jpeg)\n\nThe `grid()` geometry manager method is\
    \ demonstrated in the example [here](#part0015.xhtml_page_161).\n\nOptionally,\
    \ the `pack()` method may include a `fill` argument to expand the widget in available\
    \ space. For example, with `fill=`x’`. Alternatively, the `pack()` method may\
    \ include `padx` and `pady` arguments to expand the widget along an axis a specified\
    \ amount.\n\n![image](Images/image00188.jpeg)\n\nwindow.py\n\n![image](Images/image00257.jpeg)Start\
    \ a new program with a statement to make the “tkinter” module GUI methods and\
    \ attributes available\n"
  raw: 'In Python, the + character entity can be described as polymorphic because
    it represents either the arithmetical addition operator, in the context of numerical
    operands, or the string concatenation operator in the context of character operands.


    Perhaps more importantly, Python class methods can also be polymorphic because
    the Python language uses “duck typing” – meaning... if it walks like a duck, swims
    like a duck, and quacks like a duck, then that bird is reckoned to be a duck.


    In a duck-typed language you can create a function to take an object of any type
    and call that object’s methods. If the object does indeed have the called methods
    (is reckoned to be a duck) they are executed, otherwise the function signals a
    run-time error.


    Like-named methods of multiple classes can be created and instances of those classes
    will execute the associated version.


    ![image](Images/image00188.jpeg)


    Duck.py


    ![image](Images/image00241.jpeg)Create a new class file that declares a class
    with methods to display strings unique to the class


    **class Duck :**


    **def talk( self ) :**


    **print( ‘\nDuck Says: Quack!’ )**


    **def coat( self ) :**


    **print( ‘Duck Wears: Feathers’ )**


    ![image](Images/image00188.jpeg)


    Mouse.py


    ![image](Images/image00242.jpeg)Next, create a class file that declares a class
    with like-named methods but to display strings unique to this class


    **class Mouse :**


    **def talk( self ) :**


    **print( ‘\nMouse Says: Squeak!’ )**


    **def coat( self ) :**


    **print( ‘Mouse Wears: Fur’ )**


    ![image](Images/image00188.jpeg)


    polymorph.py


    ![image](Images/image00243.jpeg)Save the two class files then start a new program
    by making features of both classes available


    **from Duck import ***


    **from Mouse import ***


    ![image](Images/image00244.jpeg)Next, define a function that accepts any single
    object as its parameter and attempts to call methods of that object


    **def describe( object ) :**


    **object.talk()**


    **object.coat()**


    ![image](Images/image00245.jpeg)Now, create an instance object of each class


    **donald = Duck()**


    **mickey = Mouse()**


    ![image](Images/image00246.jpeg)Finally, add statements to call the function and
    pass each instance object to it as an argument


    **describe( donald )**


    **describe( mickey )**


    ![image](Images/image00247.jpeg)Save then run the program – to see the methods
    of the associated versions get called


    ![image](Images/image00350.jpeg)


    ![image](Images/image00351.jpeg)


    Duck – donald


    ![image](Images/image00352.jpeg)


    Mouse – mickey


    ![image](Images/image00193.jpeg)


    A class can have only one method with a given name – method overloading is not
    supported in Python.


    Object Oriented Programming with Python allows data encapsulation, inheritance,
    and polymorphism. Base class methods can be overridden by like-named methods in
    derived classes. Python does not, however, support the technique of “overloading”
    found in other languages – in which methods of the same name can be created with
    different parameter lists in a single class.


    **Summary**


    •Programming objects are like virtual representations of real-world objects describing
    attributes and behaviors in a “class”


    •A class is a data structure prototype describing object properties with its methods
    and attribute members


    •Each class declaration begins with the class keyword and is followed by an indented
    code block that may contain a class document string, class variables, and class
    methods


    •Class variables have global scope but instance variables (declared within method
    definitions) have only local scope


    •Instance variables encapsulate data securely in a class structure and are initialized
    when a class instance is created


    •Properties of a class are referenced by dot notation and are addressed internally
    using the self prefix


    •A class instance is a copy of the prototype that automatically calls its __init__()
    method when the instance is first created


    •An attribute of a class can be added, modified, or removed using dot notation
    or manipulated using the built-in functions getattr(), hasattr(), setattr(), and
    delattr()


    •The name of attributes automatically supplied by Python begin with an underscore
    character to notionally indicate privacy


    •A derived class inherits the method and attribute members of the parent base
    class from which it is derived


    •The declaration of a derived class must state the name of its parent base class
    in parentheses after its own class name


    •A method of a derived class can override a matching method of the same name in
    its parent base class


    •A method of a base class can be called explicitly using the base class name for
    identification


    •Python is a duck-typed language that supports polymorphism for like-named methods
    of multiple classes


    •The three cornerstones of Object Oriented Programming (OOP) are Encapsulation,
    Inheritance, and Polymorphism


    11


    **Building interfaces**


    *This chapter demonstrates how to code graphical windowed programs*.


    [**Launching interfaces**](#part0014.xhtml_sec1)


    [**Responding buttons**](#part0014.xhtml_sec2)


    [**Displaying messages**](#part0014.xhtml_sec3)


    [**Gathering entries**](#part0014.xhtml_sec4)


    [**Listing options**](#part0014.xhtml_sec5)


    [**Polling radios**](#part0014.xhtml_sec6)


    [**Checking boxes**](#part0014.xhtml_sec7)


    [**Adding images**](#part0014.xhtml_sec8)


    [**Summary**](#part0014.xhtml_sec9)


    **Launching interfaces**


    The standard Python module that you can use to create graphical applications is
    called “tkinter” – a **t**ool**k**it to **inter**face with the system GUI (Graphical
    User Interface).


    The tkinter module can be imported into a program like any other module to provide
    attributes and methods for windowed apps. Every tkinter program must begin by
    calling the Tk() constructor to create a window object. The window’s size can
    optionally be specified as a *‘widthxheight’* string argument to the window object’s
    geometry() method. Similarly, the window’s title can be specified as a *‘title’*
    string argument to the window object’s title() method. If not specified default
    size and title values will be used.


    ![image](Images/image00215.jpeg)


    There can be only one call to the **Tk()** constructor and it must be at the start
    of the program code.


    Every tkinter program must also call the window object’s mainloop() method to
    capture events, such as when the user closes the window to quit the program. This
    loop should appear at the end of the program as it also handles window updates
    that may be implemented during execution.


    With tkinter, all the graphical controls that can be included in the application
    window, such as buttons or checkboxes, are referred to as “widgets”. Perhaps the
    simplest widget is a non-interactive label object that merely displays text or
    an image in the app interface. A label object can be created by specifying the
    window object’s name and text=*’string’* as arguments to a Label() constructor.


    Once created, each widget, such as a label, must then be added to the window using
    one of these “geometry manager” methods:


    •pack() – places the widget against a specified side of the window using TOP,
    BOTTOM, LEFT, or RIGHT constant values specified to its side= argument


    •place() – places the widget at XY coordinates in the window using numerical values
    specified to its x= and y= arguments


    •grid() – places the widget in a cell within the window using numerical values
    specified to row= and column= arguments


    ![image](Images/image00194.jpeg)


    The grid() geometry manager method is demonstrated in the example [here](#part0015.xhtml_page_161).


    Optionally, the pack() method may include a fill argument to expand the widget
    in available space. For example, with fill = ‘x’. Alternatively, the pack() method
    may include padx and pady arguments to expand the widget along an axis a specified
    amount.


    ![image](Images/image00188.jpeg)


    window.py


    ![image](Images/image00257.jpeg)Start a new program with a statement to make the
    “tkinter” module GUI methods and attributes available'
