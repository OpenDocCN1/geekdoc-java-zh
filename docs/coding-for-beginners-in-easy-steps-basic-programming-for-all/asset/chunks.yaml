    \n8\n\n## 导入库\n\n*本章演示了如何将预定义的库功能编码到你的程序中*。\n\n- 检查 Python\n- 进行数学计算\n- 计算小数\n\
    - 告知时间\n- 运行计时器\n- 总结\n\n### 检查 Python\n\nPython 包含了 `sys` 和 `keyword` 模块，它们对于查询\
    \ 系统非常有用。`keyword` 模块包含了所有 Python 关键字的列表，如果你想测试任何单词，提供了 `iskeyword()` 函数。你可以使用交互模式探索\
    \ `sys` 的许多功能，只需在 `>>>` 提示符处输入 `help()` 进入帮助，然后在出现的帮助提示符处输入 `sys`。也许有用的是，`sys`\
    \ 模块属性包含了 Python 版本号、解释器位置以及解释器寻找模块文件的目录列表——如果你将模块文件保存在这些目录中的一个，你可以确定解释器会找到它们。\n\
    \n```python\nimport sys , keyword\nprint( ‘Python Version:’ , sys.version )\n\
    print( ‘Interpreter Location:’ , sys.executable )\nprint( ‘Module Search Path:\
    \ ‘ )\nfor folder in sys.path :\n    print( folder )\nprint( ‘Python Keywords:\
    \ ‘ )\nfor word in keyword.kwlist :\n    print( word )\n```\n\n"
- fmt: "\nThe `math.pow()` function requires two arguments to raise a specified value\
    \ by a specified power. The `math.sqrt()` function, on the other hand, simply\
    \ requires a single argument and returns the square root of that specified value.\
    \ Both function results are returned as a numeric value of the `float` data type.\n\
    \n![image](Images/image00193.jpeg)\n\nIntegers can be cast from the `int` data\
    \ type to the `float` data type using the `float()` function and to the `string`\
    \ data type using the `str()` function.\n\nTypical trigonometry can be performed\
    \ using functions from the `math` module too, such as `math.sin()`, `math.cosin()`\
    \ and `math.tan()`.\n\nAdditionally, Python includes a “random” module that can\
    \ be used to produce pseudo random numbers once imported into a program.\n\nThe\
    \ `random.random()` function produces a single floating-point number between zero\
    \ and 1.0. Perhaps, more interestingly, the `random.sample()` function produces\
