    ### Setting order


    Operator precedence determines the order in which expressions get evaluated. For
    example, in the expression `3 * 8 + 4` the default order of precedence determines
    that multiplication with the `*` multiply operator is completed first, so the
    result is 28 (24 + 4).


    The table below lists Python’s operator precedence in descending order – those
    on the top row have highest precedence, those on lower rows have successively
    lower precedence. The precedence of operators on the same row is chained Left-To-Right.


    | Operator: | Description: |

    | :--- | :--- |

    | `**` | Exponent |

    | `+` | Positive |

    | `-` | Negative |

    | `~` | Bitwise NOT |

    | `*` | Multiplication |

    | `/` | Division |

    | `//` | Floor division |

    | `%` | Remainder |

    | `+` | Addition |

    | `-` | Subtraction |

    | `\|` | Bitwise OR |

    | `^` | Bitwise XOR |

    | `&` | Bitwise AND |

    | `>>` | Bitwise right shift |

    | `<<` | Bitwise left shift |

    | `>, >=, <, <=, ==, !=` | Comparison |

    | `= , %= , /= , //= , -= , += , *= , **=`` | Assignment |

    | `is , is not` | Identity |

    | `in , not in` | Membership |

    | `not` | Boolean NOT |

    | `and` | Boolean AND |

    | `or` | Boolean OR |


    ![image](Images/image00193.jpeg)


    The `*` multiply operator is on a higher row than the `+` addition operator –
    so in the expression `3 * 8 + 4` multiplication is completed first, before the
    addition.


    ![image](Images/image00194.jpeg)


    Bitwise operators are used for low-level manipulation so are omitted from this
    book. Identity and membership operators are introduced later but are included
    here for completeness.


    ![image](Images/image00188.jpeg)


    `order.py`


    ![image](Images/image00241.jpeg)Start a new program by initializing three variables
    with integer values for precedence comparison


    `a = 2`


    `b = 4`


    `c = 8`


    ![image](Images/image00242.jpeg)Next, add statements to display the results of
    default precedence and forcing addition before multiplication


    `print( ‘\nDefault Order:\t’, a, ‘*’, c,’+’, b, ‘=’, a * c + b )`

    `print( ‘Forced Order:\t’, a, ‘* (‘, c,’+’, b, ‘) =’, a * ( c + b ) )`


    ![image](Images/image00243.jpeg)Now, add statements to display the results of
    default precedence and forcing subtraction before division


    `print( ‘\nDefault Order:\t’, c, ‘//’, b, ‘-’, a, ‘=’, c // b - a )`

    `print( ‘Forced Order:\t’, c, ‘// (‘, b,’-’, a, ‘) =’, c // ( b - a ) )`


    ![image](Images/image00244.jpeg)Finally, add statements to display the results
    of default precedence and forcing addition before remainder operation and before
    exponent operation


    `print( ‘\nDefault Order:\t’, c, ‘%’, a, ‘+’, b, ‘=’, c % a + b )`

    `print( ‘Forced Order:\t’, c, ‘% (‘, a,’+’, b, ‘) =’, c % ( a + b ) )`

    `print( ‘\nDefault Order:\t’, c, ‘**’, a, ‘+’, b, ‘=’, c ** a + b )`

    `print( ‘Forced Order:\t’, c, ‘** (‘, a,’+’, b, ‘) =’, c ** ( a + b ) )`


    ![image](Images/image00245.jpeg)Save then run this program – to see the result
    of conditional expression operations

