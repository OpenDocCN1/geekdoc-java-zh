    `math.pow()` 函数需要两个参数来将指定的值按指定的幂幂。相反，`math.sqrt()` 函数仅需一个参数，并返回该指定值的平方根。这两个函数的结果都以
    `float` 数据类型的数值形式返回。


    ![image](img/image00193.jpeg)


    可以使用 `float()` 函数将整数从 `int` 数据类型转换为 `float` 数据类型，使用 `str()` 函数将其转换为 `string` 数据类型。


    典型的三角函数也可以使用 `math` 模块中的函数来完成，例如 `math.sin()`、`math.cosin()` 和 `math.tan()`。


    此外，Python 还包含一个“random”模块，在导入到程序后，可以用于生成伪随机数。


    `random.random()` 函数产生一个 0 到 1.0 之间的浮点数。也许更有趣的是，`random.sample()` 函数产生一个从序列中随机选择的元素列表。该方法需要两个参数：指定要从中选择的序列以及要生成的列表长度。由于
    `range()` 函数返回一个数字序列，可以将其作为第一个参数传递给 `random.sample()` 函数——这样它将从该序列中随机选择数字，生成一个没有重复数字的列表。


    ![image](img/image00188.jpeg)


    `maths.py`


    ![image](img/image00195.jpeg)通过导入“math”和“random”模块启动新程序，以便使其功能可用


    ```python

    import math , random

    ```


    ![image](img/image00196.jpeg)接下来，添加语句显示两个舍入后的值


    ```python

    print( ‘Rounded Up 9.5:‘ , math.ceil( 9.5 ) )

    print( ‘Rounded Down 9.5:‘ , math.floor( 9.5 ) )

    ```


    ![image](img/image00197.jpeg)现在，添加语句用整数值初始化变量


    ```python

    num = 4

    ```


    ![image](img/image00200.jpeg)添加语句显示变量值的平方和平方根


    ```python

    print( num , ‘Squared:‘ , math.pow( num , 2 ) )

    print( num , ‘Square Root:‘ , math.sqrt( num ) )

    ```


    ![image](img/image00202.jpeg)然后，添加语句生成一个 1 到 49 之间六个唯一数字的随机列表


    ```python

    nums = random.sample( range( 1, 49 ) , 6 )

    ```


    ![image](img/image00207.jpeg)最后，添加语句显示随机列表


    ```python

    print( ‘Your Lucky Lotto Numbers Are:‘ , nums )

    ```


    ![image](img/image00212.jpeg)保存并运行程序——查看数学结果和随机样本


    ![image](img/image00319.jpeg)


    ![image](img/image00193.jpeg)


    这里的数学函数都返回 `float` 数据类型的浮点数。


    ![image](img/image00194.jpeg)


    `random.sample()` 生成的列表并没有替换序列中的元素，正如其名只是复制了一个样本。


    ### 计算小数


    尝试进行浮点运算的 Python 程序可能会产生意想不到且不准确的结果，因为浮点数无法准确地表示所有小数。


    ![image](img/image00188.jpeg)


    `inaccurate.py`


    ![image](img/image00195.jpeg)通过初始化两个浮点值变量启动新程序


    ```python

    item = 0.70

    rate = 1.05

    ```


    ![image](img/image00196.jpeg)接下来，通过对前两个变量尝试浮点运算再初始化两个变量


    ```python

    tax = item * rate

    total = item + tax

    ```


    ![image](img/image00197.jpeg)现在，添加语句格式化变量值保留两位小数，以便显示尾零


    ```python

    print( ‘Item:\t’ , ‘%.2f’ % item )

    print( ‘Tax:\t’ , ‘%.2f’ % tax )

    print( ‘Total:\t’ , ‘%.2f’ % total )

    ```


    ![image](img/image00200.jpeg)保存并运行程序——查看输出显示一个不准确的加法总额


    ![image](img/image00320.jpeg)


    ![image](img/image00188.jpeg)


    `expanded.py`


    ![image](img/image00202.jpeg)为了帮助理解这个问题，编辑所有三个打印语句将变量值扩展到 20 位小数，然后运行修改后的程序


    ```python

    print( ‘Item:\t’ , ‘%.20f’ % item )

    print( ‘Tax:\t’ , ‘%.20f’ % tax )

    print( ‘Total:\t’ , ‘%.20f’ % total )

    ```


    ![image](img/image00321.jpeg)


    ![image](img/image00194.jpeg)


    在这里，变量值使用字符串替换技术格式化为显示两位小数——更多细节请见此处。

