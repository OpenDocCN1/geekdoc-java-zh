    **Running timers**


    Getting the current time both before and after an event means that the duration
    of the event can be calculated by their difference. The Python “time” module can
    be imported into a program to provide various time-related functions.


    Current system time is usually counted as the number of seconds elapsed since
    the Epoch at 00:00:00 GMT on January 1, 1970\. The time module’s time() function
    returns the current time in seconds since the Epoch as a floating point number
    when called.


    ![image](Images/image00193.jpeg)


    The **gmtime()** function converts elapsed time from the Epoch to a **struct_time**
    object at UTC with the Daylight Saving Time always set to zero, whereas **localtime()**
    converts to a **struct_time** object at your local system time.


    The figure returned by the time() function can be converted into a “struct_time”
    object using gmtime() or localtime() functions. This object has attributes of
    tm_year, tm_mon, tm_mday, tm_hour, tm_ min, tm_sec, tm_wday, tm_yday, tm_yday
    and tm_isdst that can be referenced using dot notation. For example, struct.tm_wday.


    All values in a struct_time object are stored as numeric values but can be transformed
    into text equivalents using the strftime() function. This requires an argument
    that is a format “directive” followed by the name of the struct_time object. The
    possible directives include those listed in the table [here](#part0011.xhtml_page_106)
    for the datetime object. For example, strftime( ‘%A’ , struct ) for weekday.


    Usefully, the time module also provides a sleep() function that can be used to
    pause execution of a program. Its argument specifies the amount of time in seconds
    by which to delay execution.


    ![image](Images/image00188.jpeg)


