    **Summary**


    •Arithmetical operators can form expressions with two operands for addition +,
    subtraction -, multiplication *, division /, floor division //, remainder %, or
    exponent **


    •The % remainder operator is useful to determine whether a number is an odd or
    even value


    •Floor division with the // operator removes any floating-point part from the
    result


    •The assignment = operator can be combined with an arithmetical operator to perform
    an arithmetical calculation then assign its result


    •The += operator is useful to add a value onto an existing value stored in a variable
    to make a combined total value


    •Comparison operators can form expressions comparing two operands for equality
    ==, inequality !=, greater >, lesser <, greater or equal >=, and lesser or equal
    <= values


    •Logical and and or operators form expressions evaluating two operands to return
    a Boolean value of True or False


    •The logical not operator returns the inverse Boolean value of a single operand
    - turning True to False , and vice versa


    •The not operator is useful to toggle a value between True and False on successive
    iterations of a loop


    •A conditional if-else expression evaluates a given expression for a Boolean True
    or False value then returns one of two operands depending on its result


    •Expressions containing multiple operators will execute their operations in accordance
    with the default precedence rules unless explicitly determined by the addition
    of parentheses ( )


    •Typically, addition + and subtraction - will be performed before multiplication
    * and division / unless explicitly specified


