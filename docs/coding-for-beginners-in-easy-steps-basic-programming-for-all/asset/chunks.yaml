    \    break\n    elif int( guess ) < num :\n        print( ‘Too low, try again\
    \ : ‘ end = ‘ ‘ )\n    elif int( guess ) > num :\n        print( ‘Too high, try\
    \ again : ‘ end = ‘ ‘ )\n    else:\n        print( ‘Correct...’ + guess )\n  \
    \      flag = False\n```\n\n![image](Images/image00232.jpeg)Save then run the\
