    To readily identify aspects of your code, IDLE automatically colorizes your code,
    both in the Shell Window and the Edit Window, with the default colors listed in
    the table below:


    ![image](Images/image00224.jpeg)


    ![image](Images/image00193.jpeg)


    Code listed in the steps throughout this book also use the default IDLE colors
    for consistency.


    **Naming rules**


    | **Keywords:** |


    | **False** | **None** | **True** |


    | **and** | **as** | **assert** |


    | **break** | **class** | **continue** |


    | **def** | **del** | **elif** |


    | **else** | **except** | **finally** |


    | **for** | **from** | **global** |


    | **if** | **import** | **in** |


    | **is** | **lambda** | **nonlocal** |


    | **not** | **or** | **pass** |


    | **raise** | **return** | **try** |


    | **while** | **with** | **yield** |


    ![image](Images/image00194.jpeg)


    It is good programming practice to choose meaningful names that reflect the nature
    of the variable’s content.


    Variable containers that you create in your code to store data within a program
    can be given any name of your choosing – providing you do not use any of the programming
    language keywords, such as the Python keywords in the table above, and the name
    adheres to the naming rules listed in the table below:


    | Naming rule: | Example: |


    | CANNOT contain any keywords | **True** |


    | CANNOT contain arithmetic operators | **a+b*c** |


    | CANNOT contain symbols | **%$#@!** |


    | CANNOT contain any spaces | **no spaces** |


    | CANNOT start with a number | **2bad** |


    | CAN contain numbers elsewhere | **good1** |


    | CAN contain letters of mixed case | **UPdown** |


    | CAN contain underscores | **is_ok** |


    ![image](Images/image00215.jpeg)


    Variable names are case-sensitive in Python – so variables named “VAR”, “Var”,
    and “var” would be treated as three separate variables.


    **Summary**


    •A computer program is a set of instructions, written by a coder, that enable
    computers to become useful


    •The electronic components of a computer are its hardware, whereas program instructions
    are its software


    •Computers understand low-level machine code


    •High-level programming languages in human-readable form get automatically translated
    into low-level machine code


    •Programming languages possess data structures to store information and control
    structures to determine progress


    •The Python programming language has simple syntax, requires no compilation, and
    includes a library of functions


    •Python’s development environment is called IDLE


    •IDLE provides a Shell Window containing an interactive prompt for testing and
    an Edit Window for coding programs


    •The IDLE Help utility is accessed by entering a help() statement at a Shell Window
    prompt


    •After typing program code into an IDLE Edit Window it must first be saved as
    a file before the program can be run


    •Output from a program run from the Edit Window appears in the Shell Window, or
    a helpful error message appears there


    •A variable data structure is a named container that allows a single item of data
    to be stored for use by a program


    •Data stored in a variable can be retrieved using that variable’s name and may
    be replaced by assigning a new value


    •Variables in Python programming can store any type of data


    •Comment lines can usefully be added to program code after beginning the line
    with a # hash character


    •Variable names must not use any of the programming language keywords and must
    adhere to its naming rules


