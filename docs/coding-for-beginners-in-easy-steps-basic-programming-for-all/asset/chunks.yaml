    programming language, such as the print() function. However, most programs have
    a number of coder-defined custom functions that can be called as required when
    the program runs.


    A custom Python function is created using the def (definition) keyword followed
    by a name of your choice and ( ) parentheses. The coder can choose any name for
    a function except the keywords of the programming language and the name of an
    existing built-in function. This line must end with a : colon character, then
    the statements to be executed whenever the function gets called must appear on
    lines below and indented. Syntax of a function definition, therefore, looks like
    this:


    **def *function-name* ( ) :**


    ***statements-to-be-executed


    statements-to-be-executed***


    ![image](Images/image00286.jpeg)


    Function statements must be indented from the definition line by the same amount
    so the Python interpreter can recognize the block.


    Once the function statements have been executed, program flow resumes at the point
    directly following the function call. This modularity is very useful in programming
    to isolate set routines so they can be called upon repeatedly.


    To create custom functions it is necessary to understand the accessibility (“scope”)
    of variables in a program:


    •Variables created outside functions can be referenced by statements inside functions
    – they have “global” scope


    •Variables created inside functions cannot be referenced from outside the function
    in which they have been created – these have “local” scope


    The limited accessibility of local variables means that variables of the same
    name can appear in different functions without conflict.


    ![image](Images/image00215.jpeg)


    Avoid using global variables in order to prevent accidental conflict – use only
    local variables where possible.


    If you want to coerce a local variable to make it accessible elsewhere it must
    first be declared with the Python global keyword followed by its name only. It
    may subsequently be assigned a value that can be referenced from anywhere in the
    program. Where a global variable and a local variable have the same name, the
    function will use the local version.


    ![image](Images/image00188.jpeg)


    def.py


    ![image](Images/image00287.jpeg)Start a new program by initalizing a global variable


    **global_var = 1**


    ![image](Images/image00288.jpeg)Next, create a function named “my_vars” to display
    the value contained within the global variable


    **def my_vars() :**


    **print( ‘Global variable:’ , global_var )**


    ![image](Images/image00289.jpeg)Now, add indented statements to the function block
    to initialize a local variable and display the value it contains


    **local_var = 2**


    **print( ‘Local variable:’ , local_var )**


    ![image](Images/image00290.jpeg)Then, add indented statements to the function
    block to create a coerced global variable and assign an initial value


    **global inner_var**


    **inner_var = 3**


    ![image](Images/image00291.jpeg)Add a statement after the function to call upon
    that function to execute the statements it contains


    **my_vars()**


    ![image](Images/image00292.jpeg)Finally, add a statement to display the value
    contained in the coerced global variable


    **print( ‘Coerced Global:’ , inner_var )**


    ![image](Images/image00293.jpeg)Save then run the program – to see the custom
    function display the variable values


    ![image](Images/image00294.jpeg)


    ![image](Images/image00194.jpeg)


    Variables that are not global but appear in some outer scope can be addressed
    using the **nonlocal** keyword.


    **Adding parameters**


    When defining a custom function in a program you may optionally specify a “parameter”
    name between the function’s parentheses. An “argument” value can then be passed
    to that parameter by specifying the value in the parentheses of the call to the
    function. The function can now use that passed in value during its execution by
    referencing it via the parameter name. For example, defining a function to accept
    a parameter to print out:


    **def echo( user ) :**


    **print( ‘User:’ , user )**


    ![image](Images/image00193.jpeg)


    Parameters are special variables for internal use only within a function – they
    must adhere to the same naming rules as regular variables.


    A call to this function must specify an argument value to be passed to the parameter
    in its parentheses so it can be printed out:


    **echo( ‘Mike’ )**


    Multiple parameters can be specified in the function definition by including a
    comma-separated list of parameter names within the function parentheses:


    **def echo( user , lang , sys ) :**


    **print( User:’ , user , ‘Language:’ , lang , ‘Platform:’ , sys )**


    When calling a function whose definition specifies parameters, the call must include
    the same number of arguments as parameters. For example, to call this example
    with multiple parameters:


    **echo( ‘Mike’ , ‘Python’ , ‘Windows’ )**


    The passed values must appear in the same order as the parameter list unless the
    caller also specifies the parameter names like this:


    **echo( lang = ‘Python’ , user = ‘Mike’ , sys = ‘Windows’ )**


    Optionally, a default value may be specified in the parameter list when defining
    a function. This will be overridden when the caller specifies a value for that
    parameter but will be used by the function when no argument value gets passed
    by the caller:


    **def echo( user , lang , sys = ‘Linux’ ) :**


    **print( User:’ , user , ‘Language:’ , lang , ‘Platform:’ , sys )**


    This means you may call the function passing fewer values than the number of parameters
    specified in the function definition, to use the default parameter value, or pass
