    **window = Tk()**


    ![image](Images/image00259.jpeg)Now, add a statement to specify a title for this
    window


    **window.title( ‘Label Example’ )**


    ![image](Images/image00260.jpeg)Then, add a statement to call upon a constructor
    to create a label object


    **label = Label( window , text = ‘Hello World!’ )**


    ![image](Images/image00261.jpeg)Use the packer to add the label to the window
    with both horizontal and vertical padding for positioning


    **label.pack( padx = 200 , pady = 50 )**


    ![image](Images/image00262.jpeg)Finally, add the mandatory statement to maintain
    the window by capturing events


    **window.mainloop()**


    ![image](Images/image00266.jpeg)Save then run the program – to see a window appear
    containing a label widget


    ![image](Images/image00353.jpeg)


    ![image](Images/image00193.jpeg)


    Widgets will not appear in the window when running the program unless they have
    been added with a geometry manager.


    **Responding buttons**


    A Button widget provides a graphical button in an application window that may
    contain either text or an image to convey the button’s purpose. A button object
    is created by specifying the window name and options as arguments to a Button()
    constructor. Each option is specified as an option=value pair. The command option
    must always specify the name of a function or method to call when the user clicks
    that button. The most popular options are listed below together with a brief description:


    | **Option:** | **Description:** |


    | **activebackground** | Background color when the cursor is over |


    | **activeforeground** | Foreground color when the cursor is over |


    | **bd** | Border width in pixels (default is 2) |


    | **bg** | Background color |


    | **command** | Function to call when clicked |


    | **fg** | Foreground color |


    | **font** | Font for button label |


    | **height** | Button height in text lines, or pixels for images |


    | **highlightcolor** | Border color when in focus |


    | **image** | Image to be displayed instead of text |


    | **justify** | Multiple text lines as LEFT, CENTER, or RIGHT |


    | **padx** | Horizontal padding |


    | **pady** | Vertical padding |


    | **relief** | Border style of SUNKEN, RIDGE, RAISED or GROOVE |


    | **state** | Enabled status of NORMAL or DISABLED |


    | **underline** | Index number in text of character to underline |


    | **width** | Button width in letters, or pixels for images |


    | **wraplength** | Length at which to wrap text |


    ![image](Images/image00194.jpeg)


    You can also call a button’s **invoke()** method to, in turn, call the function
    nominated to its **command** option.


    The values assigned to other options determine the widget’s appearance. These
    can be altered by specifying a new option=value pair as an argument to the widget’s
    configure() method. Additionally, a current option value can be retrieved by specifying
    its name as a string argument to the widget’s cget() method.


    ![image](Images/image00188.jpeg)


    button.py


    ![image](Images/image00257.jpeg)Start a new program by making GUI features available
    then create a window and specify a title


    **from tkinter import ***


    **window = Tk()**


    **window.title( ‘Button Example’ )**


    ![image](Images/image00258.jpeg)Next, create a button to exit the program when
    clicked


    **btn_end = Button( window , text = ‘Close’ , command=exit )**


    ![image](Images/image00259.jpeg)Now, add a function to toggle the window’s background
    color when another button gets clicked


    **def tog() :**


    **if window.cget( ‘bg’ ) == ‘yellow’ :**


    **window.configure( bg = ‘gray’ )**


    **else :**


    **window.configure( bg = ‘yellow’ )**


    ![image](Images/image00260.jpeg)Then, create a button to call the function when
    clicked


    **btn_tog = Button( window , text = ‘Switch’ , command=tog )**


    ![image](Images/image00261.jpeg)Add the buttons to the window with positional
    padding


    **btn_end.pack( padx = 150 , pady = 20 )**


    **btn_tog.pack( padx = 150 , pady = 20 )**


    ![image](Images/image00262.jpeg)Finally, add the loop to capture this window’s
    events


    **window.mainloop()**


    ![image](Images/image00266.jpeg)Save then run the program and click the button
    – to see the window’s background color change


    ![image](Images/image00354.jpeg)


    ![image](Images/image00355.jpeg)


    ![image](Images/image00215.jpeg)


    Only the function name is specified to the **command** option. Do not add trailing
    parentheses in the assignment.


    ![image](Images/image00194.jpeg)


    The ‘gray’ color is the original default color of the window.


    **Displaying messages**


    A program can display messages to the user by calling methods provided in the
    “tkinter.messagebox” module. This must be imported separately and its lengthy
    name can usefully be assigned a short alias by an import as statement.


    A message box is created by supplying a box title and the message to be displayed
    as the two arguments to one of these methods:


    | **Method:** | **Icon:** | **Buttons:** |


    | **showinfo()** | ![image](Images/image00356.jpeg) | OK |


    | **showwarning()** | ![image](Images/image00357.jpeg) | OK |


    | **showerror()** | ![image](Images/image00358.jpeg) | OK |


    | **askquestion()** | ![image](Images/image00359.jpeg) | Yes (returns the string
    ‘yes’) and No (returns the string ‘no’) |


    | **askokcancel()** | ![image](Images/image00360.jpeg) | OK (returns 1) and Cancel
    |


    | **askyesno()** | ![image](Images/image00359.jpeg) | Yes (returns 1) and No |


    | **askretrycancel()** | ![image](Images/image00360.jpeg) | Retry (returns 1)
    and Cancel |


    ![image](Images/image00194.jpeg)


    Only the **askquestion()** method returns two values – the **askyesno()** No button
    and both Cancel buttons return nothing.


    Those methods that produce a message box containing a single OK button return
    no value when the button gets clicked by the user. Those that do return a value
    can be used to perform conditional branching by testing that value.


    ![image](Images/image00188.jpeg)


    message.py


    ![image](Images/image00257.jpeg)Start a new program by making GUI features available
    and message box features available as a short alias


    **from tkinter import ***


    **import tkinter.messagebox as box**


    ![image](Images/image00258.jpeg)Next, create a window object and specify a title


    **window = Tk()**


    **window.title( ‘Message Box Example’ )**


    ![image](Images/image00259.jpeg)Add a function to display various message boxes


    **def dialog() :**


    **var = box.askyesno( ‘Message Box’ , ‘Proceed?’ )**


    **if var == 1 :**


    **box.showinfo( ‘Yes Box’, ‘Proceeding...’ )**


    **else :**


    **box.showwarning( ‘No Box’, ‘Canceling...’ )**


    ![image](Images/image00260.jpeg)Then, create a button to call the function when
    clicked


    **btn = Button( window , text = ‘Click’ , command=dialog )**


    ![image](Images/image00261.jpeg)Add the button to the window with positional padding


    **btn.pack( padx = 150 , pady = 50 )**


    ![image](Images/image00262.jpeg)Finally, add the loop to capture this window’s
    events


    **window.mainloop()**


    ![image](Images/image00266.jpeg)Save the file then run the program and click the
    button – to see the message boxes appear


    ![image](Images/image00361.jpeg)


    ![image](Images/image00194.jpeg)


    Options can be added as a third argument to these method calls. For example, add
    **type=’abortretryignore’** to get three buttons.


    **Gathering entries**


    An Entry widget provides a single-line input field in an application where the
    program can gather entries from the user. An entry object is created by specifying
    the name of its parent container, such as a window or frame name, and options
    as arguments to an Entry() constructor. Each option is specified as an option=value
    pair. Popular options are listed below together with a brief description:


    | **Option:** | **Description:** |


    | **bd** | Border width in pixels (default is 2) |


    | **bg** | Background color |


    | **fg** | Foreground color used to render the text |


    | **font** | Font for the text |'
