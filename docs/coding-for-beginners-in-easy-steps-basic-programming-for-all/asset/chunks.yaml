  raw: '| **highlightcolor** | Border color when in focus |


    | **selectbackground** | Background color of selected text |


    | **selectforeground** | Foreground color of selected text |


    | **show** | Hide password characters with show=’*’ |


    | **state** | Enabled status of NORMAL or DISABLED |


    | **width** | Entry width in letters |


    Multiple widgets can be grouped in frames for better positioning. A frame object
    is created by specifying the name of the window to a Frame() constructor. The
    frame’s name can then be specified as the first argument to the widget constructors
    to identify it as that widget’s container.


    When actually adding widgets to the frame, you can specify which side to pack
    them to in the frame with TOP, BOTTOM, LEFT, or RIGHT constants. For example,
    entry.pack( side=LEFT ).


    ![image](Images/image00194.jpeg)


    Use the Text widget instead of an Entry widget if you want to allow the user to
    enter multiple lines of text.


    Typically, an entry widget will appear alongside a label describing the type of
    input expected there from the user, or alongside a button widget that the user
    can click to perform some action on the data they have entered, so positioning
    in a frame is ideal.


    Data currently entered into an entry widget can be retrieved by the program using
    that widget’s get() method.


    ![image](Images/image00188.jpeg)


    entry.py


    ![image](Images/image00257.jpeg)Start a new program by making GUI features available
    and message box features available as a short alias


    **from tkinter import ***


    **import tkinter.messagebox as box**


    ![image](Images/image00258.jpeg)Next, create a window object and specify a title


    **window = Tk()**


    **window.title( ‘Entry Example’ )**


    ![image](Images/image00259.jpeg)Now, create a frame to containing an entry field
    for input


    **frame = Frame( window )**


    **entry = Entry( frame )**


    ![image](Images/image00260.jpeg)Then, add a function to display data currently
    entered


    **def dialog() :**


    **box.showinfo( ‘Greetings’ , ‘Welcome ’ + entry.get() )**


    ![image](Images/image00261.jpeg)Now, create a button to call the function when
    clicked


    **btn = Button( frame, text = ‘Enter Name’ , command=dialog )**


    ![image](Images/image00262.jpeg)Add the button and entry to the frame at set sides


    **btn.pack( side = RIGHT , padx = 5 )**


    **entry.pack( side = LEFT )**


    **frame.pack( padx = 20 , pady = 20 )**


    ![image](Images/image00266.jpeg)Finally, add the loop to capture this window’s
    events


    **window.mainloop()**


    ![image](Images/image00362.jpeg)Save the file and run the program, then enter
    your name and click the button – to see a greeting message appear


    ![image](Images/image00363.jpeg)


    ![image](Images/image00364.jpeg)


    ![image](Images/image00194.jpeg)


    Use a Label widget instead of an Entry widget if you want to display text that
    the user cannot edit.


    **Listing options**


    A Listbox widget provides a list of items in an application from which the user
    can make a selection. A listbox object is created by specifying the name of its
    parent container, such as a window or frame name, and options as arguments to
    a Listbox() constructor. Popular options are listed below together with a brief
    description:


    | **Option:** | **Description:** |


    | **bd** | Border width in pixels (default is 2) |


    | **bg** | Background color |


    | **fg** | Foreground color used to render the text |


    | **font** | Font for the text |


    | **height** | Number of lines in list (default is 10) |


    | **selectbackground** | Background color of selected text |


    | **selectmode** | SINGLE (the default) or MULTIPLE selections |


    | **width** | Listbox width in letters (default is 20) |


    | **yscrollcommand** | Attach to a vertical scrollbar |


    ![image](Images/image00193.jpeg)


    With tkinter, a scrollbar is a separate widget that can be attached to Listbox,
    Text, Canvas and Entry widgets.


    Items are added to the listbox by specifying a list index number and the item
    string as arguments to its insert() method.


    You can retrieve any item from a listbox by specifying its index number within
    the parentheses of its get() method. Usefully, a listbox also has a curselection()
    method that returns the index number of the currently selected item, so this can
    be supplied as the argument to its get() method to retrieve the current selection.


    ![image](Images/image00188.jpeg)


    listbox.py


    ![image](Images/image00257.jpeg)Start a new program by making GUI features available
    and message box features available as a short alias


    **from tkinter import ***


    **import tkinter.messagebox as box**


    ![image](Images/image00258.jpeg)Next, create a window object and specify a title


    **window = Tk()**


    **window.title( ‘Listbox Example’ )**


    ![image](Images/image00259.jpeg)Now, create a frame to contain widgets


    **frame = Frame( window )**


    ![image](Images/image00260.jpeg)Create a listbox widget offering three list items


    **listbox = Listbox( frame )**


    **listbox.insert( 1 , ‘HTML5 in easy steps’ )**


    **listbox.insert( 2 , ‘CSS3 in easy steps’ )**


    **listbox.insert( 3 , ‘JavaScript in easy steps’ )**


    ![image](Images/image00261.jpeg)Next, add a function to display a listbox selection


    **def dialog() :**


    **box.showinfo( ‘Selection’ , ‘Your Choice: ’ + \**


    **listbox.get( listbox.curselection() ) )**


    ![image](Images/image00262.jpeg)Now, create a button to call the function when
    clicked


    **btn = Button( frame , text = ‘Choose’ , command = dialog )**


    ![image](Images/image00266.jpeg)Then, add the button and listbox to the frame
    at set sides


    **btn.pack( side = RIGHT , padx = 5 )**


    **listbox.pack( side = LEFT )**


    **frame.pack( padx = 30 , pady = 30 )**


    ![image](Images/image00362.jpeg)Finally, add the loop to capture this window’s
    events


    **window.mainloop()**


    ![image](Images/image00365.jpeg)Save the file and run the program, then select
    an option and click the button – to see your selection confirmed


    ![image](Images/image00366.jpeg)


    ![image](Images/image00367.jpeg)


    ![image](Images/image00215.jpeg)


    If the **selectmode** is set to MULTIPLE, the **curselection()** method returns
    a tuple of the selected index numbers.


    **Polling radios**


    A Radiobutton widget provides a single item in an application that the user may
    select. Where a number of radio buttons are grouped together the user may only
    select any one item in the group. With tkinter, radio button objects are grouped
    together when they nominate the same control variable object to assign a value
    to upon selection. An empty string variable object can be created for this purpose
    using the StringVar() constructor or an empty integer variable object using the
    IntVar() constructor.


    ![image](Images/image00215.jpeg)


    You cannot use a regular variable to store values assigned from a radio button
    selection – it must be an object.


    A radio button object is created by specifying four arguments to a Radiobutton()
    constructor:


    •Name of the parent container, such as the frame name


    •Text for a display label, specified as a text=text pair


    •Control variable object, specified as a variable=variable pair


    •Value to be assigned, specified as a value=value pair


    Each radio button object has a select() method that can be used to specify a default
    selection in a group of radio buttons when the program starts. A string value
    assigned by selecting a radio button can be retrieved from a string variable object
    by its get() method.


    ![image](Images/image00188.jpeg)


    radio.py


    ![image](Images/image00257.jpeg)Start a new program by making GUI features available
    and message box features available as a short alias


    **from tkinter import ***


    **import tkinter.messagebox as box**


    ![image](Images/image00258.jpeg)Next, create a window object and specify a title


    **window = Tk()**


    **window.title( ‘Radio Button Example’ )**


    ![image](Images/image00259.jpeg)Now, create a frame to contain widgets


    **frame = Frame( window )**


    ![image](Images/image00260.jpeg)Then, construct a string variable object to store
    a selection


    **book = StringVar()**'
