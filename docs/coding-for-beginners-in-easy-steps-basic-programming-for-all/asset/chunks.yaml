    ## 赋值


    计算机程序中常用的赋值运算符简单地使用 `=` 来赋值。用于编写 Python 程序的赋值运算符如下所示：


    | 运算符: | 示例: |

    | :--- | :--- |

    | `=` | `a = b` |

    | `+=` | `a += b` |

    | `-=` | `a -= b` |

    | `*=` | `a *= b` |

    | `/=` | `a /= b` |

    | `%=` | `a %= b` |

    | `//=` | `a //= b` |

    | `**=` | `a **= b` |


    在示例中，`+=` 运算符向现有变量添加值。


    `+=` 运算符用于向现有变量添加值。


    所有这些其他运算符的工作方式相同：先进行操作，然后赋值结果。


    在示例中，`+=` 运算符首先添加变量中的值。


    在示例中，`+=` 运算符首先添加变量中的值。


