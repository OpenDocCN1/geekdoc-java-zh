  trans: "\n\n在 Python 中，`+` 字符实体可以被描述为多态的，因为它在数值操作数的上下文中代表算术加法运算符，而在字符操作数的上下文中代表字符串拼接运算符。\n\
    \n或许更重要的是，Python 类方法也可以是多态的，因为 Python 语言使用了“鸭子类型”（duck typing）——这意味着……如果它走起来像鸭子，游起来像鸭子，叫起来像鸭子，那么这只鸟就被认为是鸭子。\n\
    \n在鸭子类型语言中，你可以创建一个函数来接受任何类型的对象并调用该对象的方法。如果该对象确实具有被调的方法（被认为是鸭子），则会执行它们；否则函数将抛出运行时错误。\n\
    \n可以创建多个类具有同名的方法，并且这些类的实例将执行关联的版本。\n\n![image](img/image00188.jpeg)\n\nDuck.py\n\
    \n![image](img/image00241.jpeg)创建一个新的类文件，声明一个带有方法以显示该类特有字符串的类\n\n```python ownclass\
    \ Duck :\n    def talk( self ) :\n        print( ‘\\nDuck Says: Quack!’ )\n  \
    \  def coat( self ) :\n        print( ‘Duck Wears: Feathers’ )\n```\n\n![image](img/image00188.jpeg)\n\
    \nMouse.py\n\n![image](img/image00242.jpeg)接下来，创建一个类文件，声明一个具有同名方法但显示此类特有字符串的类\n\
    \n```python\nclass Mouse :\n    def talk( self ) :\n        print( ‘\\nMouse Says:\
    \ Squeak!’ )\n    def coat( self ) :\n        print( ‘Mouse Wears: Fur’ )\n```\n\
    \n![image](img/image00188.jpeg)\n\npolymorph.py\n\n![image](img/image00243.jpeg)保存这两个类文件，然后通过提供这两个类的特性启动一个新程序\n\
    \n```python\nfrom Duck import *\nfrom Mouse import *\n```\n\n![image](img/image00244.jpeg)接下来，定义一个接受任何单个对象作为参数并尝试调用该对象方法的函数\n\
    \n```python\ndef describe( object ) :\n    object.talk()\n    object.coat()\n\
    ```\n\n![image](img/image00245.jpeg)现在，每个类创建一个实例对象\n\n```python\ndonald = Duck()\n\
    mickey = Mouse()\n```\n\n![image](img/image00246.jpeg)最后，添加语句调用该函数并将每个实例对象作为参数传递给它\n\
    \n```python\ndescribe( donald )\ndescribe( mickey )\n```\n\n![image](img/image00247.jpeg)保存并运行程序——以看到关联版本的方法被调用\n\
    \n![image](img/image00350.jpeg)\n\n![image](img/image00351.jpeg)\n\nDuck – donald\n\
    \n![image](img/image00352.jpeg)\n\nMouse – mickey\n\n![image](img/image00193.jpeg)\n\
    \n一个类只能有一个给定名称的方法——Python 不支持方法重载。\n\nPython 的面向对象编程允许数据封装、继承和多态。基类方法可以被派生类中的同名方法覆盖。然而，Python\
    \ 不支持其他语言中常见的“重载”技术——即在单个类中可以创建具有不同参数列表的同名方法。\n\n### 总结\n\n-   编程对象类似于真实对象的虚拟表示，在“类”中描述属性和行为\n\
    -   类是一个数据结构原型，通过其方法和属性成员描述对象的属性\n-   每个类声明都以 `class` 关键字开头，后跟一个缩进的代码块，该代码块可能包含类文档字符串、类变量和类方法\n\
    -   类变量具有全局作用域，但实例变量（在方法定义内部声明）仅具有局部作用域\n-   实例变量在类结构中安全地封装数据，并在类实例创建时初始化\n- \
    \  类的属性通过点符号表示法引用，并在内部使用 `self` 前缀进行寻址\n-   类实例是原型的副本，在实例首次创建时会自动调用其 `__init__()`\
    \ 方法\n-   可以使用点符号表示法添加、修改或删除类的属性，或者使用内建函数 `getattr()`、`hasattr()`、`setattr()`\
    \ 和 `delattr()` 进行操作\n-   Python 自动提供的属性名称以下划线字符开头，用在逻辑上指示私有性\n-   派生类继承其派自的父基类的方法和属性成员\n\
    -   派生类的声明必须在自己的类名后的括号中写明其父基类的名称\n-   派生类的方法可以覆盖其父基类中同名的匹配方法\n-   可以使用基类名进行标识来显式调用基类的方法\n\
    -   Python 是一种鸭子类型语言，支持多个类同名方法的多态性\n-   面向对象编程（OOP）的三大基石是封装、继承和多态\n\n11\n\n####\
    \ 构建接口\n\n*本章演示了如何编写图形化窗口程序的代码*。\n\n- 启动接口\n- 响应按钮\n- 显示消息\n- 收集条目\n- 列出选项\n-\
    \ 轮询选项/单选框\n- 勾选框检查\n- 添加图像\n- 总结\n\n#### 启动接口\n\n你可以用于创建图形化应用程序的标准 Python 模块称为“tkinter”这是一个与系统\
    \ GUI（图形用户界面）交互的工具。tkinter 模块可以像其他模块一样导入到程序中。每个 tkinter 程序都必须从调用 `Tk()` 构造函数开始创建一个窗口。窗口的大小可以可选地作为\
    \ `widthheight` 字符串参数传递给窗口对象的 `geometry()` 方法。同样，窗口的标题可以作为标题字符串参数传递给窗口对象的 `title()`\
    \ 方法。如果未指定，则将使用默认的尺寸和标题值。\n\n![image](img/image00215.jpeg)\n\n`Tk()` 构造函数只能调用一次，且它必须位于程序的开头。每个\
    \ tkinter 程序还必须调用窗口对象的 `mainloop()` 方法来捕获事件，例如用户关闭窗口退出时。此循环应该出现在程序的末尾，因为它还处理了执行期间可能实现的窗口更新。\n\
    \n在 tkinter 中，所有包含在应用程序窗口中的图形控件（如按钮或复选框）统称为“部件”（widgets）。也许简单的部件是一个非交互的标签对象，仅显示文本或图像。可以通过指定窗口对象的名称和\
    \ `text=`string` 作为 `Label()` 构造函数的参数创建一个标签对象。\n\n创建后，每个部件（如标签）都必须使用这些“布局管理器”方法添加到窗口中：\n\
    \n- `pack()` –通过向 `side=` 参数指定 `TOP`、`BOTTOM`、`LEFT` 或 `RIGHT` 常量值将部件放置在窗口的一侧\n\
    - `place()` –通过向 `x=` 和 `y=` 参数指定数值值将部件放置在窗口的 XY 坐标处\n- `grid()` –通过向 `row=` 和\
    \ `column=` 参数指定数值值将部件放置在窗口的单元格内\n\n![image](img/image00194.jpeg)\n\n`grid()`\
    \ 布局管理器方法在此处示例中进行了演示。\n\n可选地，`pack()` 方法可以包含 `fill` 参数以使部件在可用空间内扩展。例如，使用 `fill=`x’。或者，`pack()`\
    \ 方法可以包含 `padx` 和 `pady` 参数，以沿轴按指定量扩展部件。\n\n![image](img/image00188.jpeg)\n\n\
    window.py\n\n![image](img/image00257.jpeg)通过一个语句使“tkinter”模块的 GUI 方法和属性可用，启动一个新程序\n\
    \n"
- fmt: "\n`from tkinter import ***`\n\n![image](Images/image00258.jpeg)Next, add a\
    \ statement to call upon a constructor to create a window object\n\n```python\n\
    window = Tk()\n```\n\n![image](Images/image00259.jpeg)Now, add a statement to\
    \ specify a title for this window\n\n```python\nwindow.title( ‘Label Example’\
    \ )\n```\n\n![image](Images/image00260.jpeg)Then, add a statement to call upon\
    \ a constructor to create a label object\n\n```python\nlabel = Label( window ,\
    \ text = ‘Hello World!’ )\n```\n\n![image](Images/image00261.jpeg)Use the packer\
    \ to add the label to the window with both horizontal and vertical padding for\
    \ positioning\n\n```python\nlabel.pack( padx = 200 , pady = 50 )\n```\n\n![image](Images/image00262.jpeg)Finally,\
    \ add the mandatory statement to maintain the window by capturing events\n\n```python\n\
    window.mainloop()\n```\n\n![image](Images/image00266.jpeg)Save then run the program\
    \ – to see a window appear containing a label widget\n\n![image](Images/image00353.jpeg)\n\
    \n![image](Images/image00193.jpeg)\n\nWidgets will not appear in the window when\
    \ running the program unless they have been added with a geometry manager.\n\n\
    ### Responding buttons\n\nA `Button` widget provides a graphical button in an\
    \ application window that may contain either text or an image to convey the button’s\
    \ purpose. A button object is created by specifying the window name and options\
    \ as arguments to a `Button()` constructor. Each option is specified as an option=value\
    \ pair. The `command` option must always specify the name of a function or method\
    \ to call when the user clicks that button. The most popular options are listed\
    \ below together with a brief description:\n\n| **Option:** | **Description:**\
    \ |\n| **activebackground** | Background color when the cursor is over |\n| **activeforeground**\
    \ | Foreground color when the cursor is over |\n| **bd** | Border width in pixels\
    \ (default is 2) |\n| **bg** | Background color |\n| **command** | Function to\
    \ call when clicked |\n| **fg** | Foreground color |\n| **font** | Font for button\
    \ label |\n| **height** | Button height in text lines, or pixels for images |\n\
    | **highlightcolor** | Border color when in focus |\n| **image** | Image to be\
    \ displayed instead of text |\n| **justify** | Multiple text lines as LEFT, CENTER,\
    \ or RIGHT |\n| **padx** | Horizontal padding |\n| **pady** | Vertical padding\
    \ |\n| **relief** | Border style of SUNKEN, RIDGE, RAISED or GROOVE |\n| **state**\
    \ | Enabled status of NORMAL or DISABLED |\n| **underline** | Index number in\
    \ text of character to underline |\n| **width** | Button width in letters, or\
    \ pixels for images |\n| **wraplength** | Length at which to wrap text |\n\n![image](Images/image00194.jpeg)\n\
    \nYou can also call a button’s `invoke()` method to, in turn, call the function\
    \ nominated to its `command` option.\n\nThe values assigned to other options determine\
    \ the widget’s appearance. These can be altered by specifying a new option=value\
    \ pair as an argument to the widget’s `configure()` method. Additionally, a current\
    \ option value can be retrieved by specifying its name as a string argument to\
    \ the widget’s `cget()` method.\n\n![image](Images/image00188.jpeg)\n\nbutton.py\n\
    \n![image](Images/image00257.jpeg)Start a new program by making GUI features available\
    \ then create a window and specify a title\n\n```python\nfrom tkinter import ***\n\
    window = Tk()\nwindow.title( ‘Button Example’ )\n```\n\n![image](Images/image00258.jpeg)Next,\
    \ create a button to exit the program when clicked\n\n```python\nbtn_end = Button(\
    \ window , text = ‘Close’ , command=exit )\n```\n\n![image](Images/image00259.jpeg)Now,\
    \ add a function to toggle the window’s background color when another button gets\
    \ clicked\n\n```python\ndef tog() :\n    if window.cget( ‘bg’ ) == ‘yellow’ :\n\
    \        window.configure( bg = ‘gray’ )\n    else :\n        window.configure(\
    \ bg = ‘yellow’ )\n```\n\n![image](Images/image00260.jpeg)Then, create a button\
    \ to call the function when clicked\n\n```python\nbtn_tog = Button( window , text\
    \ = ‘Switch’ , command=tog )\n```\n\n![image](Images/image00261.jpeg)Add the buttons\
    \ to the window with positional padding\n\n```python\nbtn_end.pack( padx = 150\
    \ , pady = 20 )\nbtn_tog.pack( padx = 150 , pady = 20 )\n```\n\n![image](Images/image00262.jpeg)Finally,\
    \ add the loop to capture this window’s events\n\n```python\nwindow.mainloop()\n\
    ```\n\n![image](Images/image00266.jpeg)Save then run the program and click the\
    \ button – to see the window’s background color change\n\n![image](Images/image00354.jpeg)\n\
    \n![image](Images/image00355.jpeg)\n\n![image](Images/image00215.jpeg)\n\nOnly\
    \ the function name is specified to the `command` option. Do not add trailing\
    \ parentheses in the assignment.\n\n![image](Images/image00194.jpeg)\n\nThe ‘gray’\
    \ color is the original default color.\n\n### Displaying messages\n\nA program\
    \ can display messages to the user by calling methods in the `tkinter.messagebox`\
    \ module. This must be imported separately and used:\n\n| **Method:** | **Icon:**\
    \ | **Buttons:** |\n| :--- | :--- | :--- |\n| `showinfo()` | ![image](Images/image00356.jpeg)\
    \ | OK |\n| `showwarning()` | ![image](Images/image00357.jpeg) | OK |\n| `showerror()`\
    \ | ![image](Images/image00358.jpeg) | OK |\n| `askquestion()` | ![image](Images/image00359.jpeg)\
    \ | Yes, No |\n| `askokcancel()` | ![image](Images/image00360.jpeg) | OK, Cancel\
    \ |\n| `askyesno()` | ![image](Images/image00359.jpeg) | Yes, No |\n| `askretrycancel()`\
    \ | ![image](Images/image00360.jpeg) | Retry, Cancel |\n\nThe `askyesno()` method\
    \ returns a value (1 for Yes, 0 for No). The `askokcancel()` method returns a\
    \ value (1 for OK, 0 for Cancel). The `askretrycancel()` method returns a value\
    \ (1 for Retry, 0 for Cancel). The `askquestion()` method returns a value (1 for\
    \ Yes, 0 for No). Those that return a value can be used for conditional branching\
    \ by testing that.\n\n```python\nfrom tkinter import ***\nimport tkinter.messagebox\
    \ as box\n\nwindow = Tk()\nwindow.title( ‘Message Box’ )\n\ndef dialog() :\n \
    \   var = box.askyesno( ‘Message Box’ , ‘Proceed?’ )\n    if var == 1 :\n    \
    \    box.showinfo( ‘Yes Box’, ‘Proceeding...’ )\n    else :\n        box.showwarning(\
    \ ‘No Box’, ‘Canceling...’ )\n\nbtn = Button( window , text = ‘Click’ , command=dialog\
    \ )\nbtn.pack( padx = 150 , pady = 50 )\nwindow.mainloop()\n```\n\nmessage.py\n\
    \n![image](Images/image00361.jpeg)Save the file then run the program and click\
    \ the button – to see the message boxes appear. Options can be added as a third\
    \ argument to these method calls. For example, add `type='abortretryignore'` to\
    \ get three buttons.\n\n### Gathering entries\n\nAn `Entry` widget provides a\
    \ single-line input field in an application where the program can gather entries\
    \ from the user. An entry object is created by specifying the name of its parent\
