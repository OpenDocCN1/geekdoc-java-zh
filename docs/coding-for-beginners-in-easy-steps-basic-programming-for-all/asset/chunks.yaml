    to request user input with which to initialize a variable


    **name = input( ‘Please enter your name: ‘ )**


    ![image](Images/image00226.jpeg)Next, add a statement to output both a string
    and the value stored within the variable


    **print( ‘Hello’ , name )**


    ![image](Images/image00227.jpeg)Now, add statements to output a string then both
    a string and the value stored within the variable once more


    **print( ‘Welcome to Coding for Beginners’ )**


    **print( ‘Remember to have fun’ , name , ‘!’ )**


    ![image](Images/image00228.jpeg)Save then run the program, enter your name when
    requested, and hit Return to see your name in the output


    ![image](Images/image00229.jpeg)


    ![image](Images/image00193.jpeg)


    There is no need to include spaces in the comma-separated lists – they are ignored
    by the interpreter but are shown here for clarity.


    **Controlling output**


    As the example on the facing page demonstrates, a value stored in a variable remains
    available for repeated use until it is replaced by a new value or until the program
    ends.'
