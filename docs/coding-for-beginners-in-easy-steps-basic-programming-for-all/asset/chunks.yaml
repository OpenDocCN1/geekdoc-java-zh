    \n| **Option:** | **Description:** |\n| **activebackground** | 光标悬停时的背景颜色 |\n\
    | **activeforeground** | 光标悬停时的前景颜色 |\n| **bd** | 像素框宽（默认为 2） |\n| **bg** | 背景颜色\
    \ |\n| **command** | 点击时调用的函数 |\n| **fg** | 前景颜色 |\n| **font** | 按钮标签的字体 |\n|\
    \ **height** | 按钮高度（文本以行为单位，图像以像素为单位） |\n| **highlightcolor** | 获得焦点时的框颜色 |\n\
    | **image** | 代替文本显示的图像 |\n| **justify** | 多行文本对齐：LEFT、CENTER 或 RIGHT |\n| **padx**\
    \ | 水平内边距 |\n| **pady** | 垂直内边距 |\n| **relief** | 框样式：SUNKEN、RIDGE、RASED 或 GROOVE\
    \ |\n| **state** | 启用状态：NORMAL 或 DISABLED |\n| **underline** | 文本中下划线的字符索引 |\n\
    | **width** | 按钮宽度（文本以字符为单位，图像以像素为单位） |\n| **wraplength** | 换行长度 |\n\n![image](img/image00194.jpeg)\n\
    \n你也可以调用按钮的 `invoke()` 方法，转而调用为其 `command` 选项指定的函数。\n\n赋值给其他选项的值决定了组件的外观。可以通过向组件的\
    \ `configure()` 方法传递新的 `option=value` 对来更改它们。此外，通过将选项名称作为字符串参数传递给组件的 `cget()`\
    \ 方法，可以获取当前的选项值。\n\n![image](img/image00188.jpeg)\n\nbutton.py\n\n![image](img/image00257.jpeg)通过提供\
    \ GUI 功能启动新程序，然后创建一个窗口并指定标题\n\n```python\nfrom tkinter import ***\nwindow = Tk()\n\
    window.title( ‘Button Example’ )\n```\n\n![image](img/image00258.jpeg)接下来，创建一个按钮，在被点击时退出程序\n\
    \n```python\nbtn_end = Button( window , text = ‘Close’ , command=exit )\n```\n\
    \n![image](img/image00259.jpeg)现在，添加一个函数，当另一个按钮被点击时切换窗口的背景颜色\n\n```python\ndef\
    \ tog() :\n    if window.cget( ‘bg’ ) == ‘yellow’ :\n        window.configure(\
    \ bg = ‘gray’ )\n    else :\n        window.configure( bg = ‘yellow’ )\n```\n\n\
    ![image](img/image00260.jpeg)然后，创建一个按钮，在点击时调用该函数\n\n```python\nbtn_tog = Button(\
    \ window , text = ‘Switch’ , command=tog )\n```\n\n![image](img/image00261.jpeg)带有位置内边距将按钮添加到窗口\n\
    \n```python\nbtn_end.pack( padx = 150 , pady = 20 )\nbtn_tog.pack( padx = 150\
    \ , pady = 20 )\n```\n\n![image](img/image00262.jpeg)最后，添加循环来捕获此窗口的事件\n\n```python\n\
    window.mainloop()\n```\n\n![image](img/image00266.jpeg)保存并运行程序并点击按钮 – 看到窗口背景颜色的变化\n\
    \n![image](img/image00354.jpeg)\n\n![image](img/image00355.jpeg)\n\n![image](img/image00215.jpeg)\n\
    \n`command` 选项仅指定了函数名。在赋值时不要添加尾随括号。\n\n![image](img/image00194.jpeg)\n\n‘gray’\
    \ 颜色是默认颜色。\n\n### 显示消息\n\n通过调用 `tkinter.messagebox` 模块中的方法向用户显示消息。这必须单独导入并使用：\n\
    \n| **Method:** | **Icon:** | **Buttons:** |\n| :--- | :--- | :--- |\n| `showinfo()`\
    \ | ![image](img/image0356.jpeg) | OK |\n| `showwarning()` | ![image](img/image0357.jpeg)\
    \ | OK |\n| `showerror()` | ![image](img/image0358.jpeg) | OK |\n| `askquestion()`\
    \ | ![image](img/image0359.jpeg) | Yes, No |\n| `askokcancel()` | ![image](img/image0360.jpeg)\
    \ | OK, Cancel |\n| `askyesno()` | ![image](img/image0359.jpeg) | Yes, No |\n\
    | `askretrycancel()` | ![image](img/image0360.jpeg) | Retry, Cancel |\n\n`askyesno()`\
    \ 方法返回一个值（1 为 Yes，0 为 No）。`askokcancel()` 方法返回一个值（1 为 OK，0 为 Cancel）。`askretrycancel()`\
    \ 方法返回一个值（1 为 Retry，0 为 Cancel）。`askquestion()` 方法返回一个值（1 为 Yes，0 为 No）。那些返回值的函数可以通过测试它们来用于条件分支。\n\
    \n```python\nfrom tkinter import ***\nimport tkinter.messagebox as box\n\nwindow\
    \ = Tk()\nwindow.title( ‘Message Box’ )\n\ndef dialog() :\n    var = box.askyesno(\
    \ ‘Message Box’ , ‘Proceed?’ )\n    if var == 1 :\n        box.showinfo( ‘Yes\
    \ Box’, ‘Proceeding...’ )\n    else :\n        box.showwarning( ‘No Box’, ‘Canceling...’\
    \ )\n\nbtn = Button( window , text = ‘Click’ , command=dialog )\nbtn.pack( padx\
    \ = 150 , pady = 50 )\nwindow.mainloop()\n```\n\n[/content]\n\n### 获取条目\n\n`Entry`\
    \ 组件在应用程序中提供了一个单行输入框，程序可以从用户那里获取条目。通过指定父容器名称（如窗口或框架）和选项作为 `Entry()` 构造函数的参数，可以创建一个条目对象。每个选项都以\
    \ `option=value` 对的形式指定。\n\n"
- fmt: "\n| `highlightcolor` | Border color when in focus |\n| `selectbackground`\
    \ | Background color of selected text |\n| `selectforeground` | Foreground color\
    \ of selected text |\n| `show` | Hide password characters with `show='*'` |\n\
    | `state` | Enabled status of `NORMAL` or `DISABLED` |\n| `width` | Entry width\
    \ in letters |\n\nMultiple widgets can be grouped in frames for better positioning.\
    \ A frame object is created by specifying the name of the window to a `Frame()`\
    \ constructor. The frame’s name can then be specified as the first argument to\
    \ the widget constructors to identify it as that widget’s container.\n\nWhen actually\
    \ adding widgets to the frame, you can specify which side to pack them to in the\
    \ frame with `TOP`, `BOTTOM`, `LEFT`, or `RIGHT` constants. For example, `entry.pack(\
    \ side=LEFT )`.\n\n![image](Images/image00194.jpeg)\n\nUse the `Text` widget instead\
    \ of an `Entry` widget if you want to allow the user to enter multiple lines of\
    \ text.\n\nTypically, an entry widget will appear alongside a label describing\
    \ the type of input expected there from the user, or alongside a button widget\
    \ that the user can click to perform some action on the data they have entered,\
    \ so positioning in a frame is ideal.\n\nData currently entered into an entry\
    \ widget can be retrieved by the program using that widget’s `get()` method.\n\
    \n![image](Images/image00188.jpeg)\n\nentry.py\n\n![image](Images/image00257.jpeg)Start\
    \ a new program by making GUI features available and message box features available\
    \ as a short alias\n\n```python\nfrom tkinter import ***\nimport tkinter.messagebox\
    \ as box\n```\n\n![image](Images/image00258.jpeg)Next, create a window object\
    \ and specify a title\n\n```python\nwindow = Tk()\nwindow.title( ‘Entry Example’\
    \ )\n```\n\n![image](Images/image00259.jpeg)Now, create a frame to containing\
    \ an entry field for input\n\n```python\nframe = Frame( window )\nentry = Entry(\
    \ frame )\n```\n\n![image](Images/image00260.jpeg)Then, add a function to display\
    \ data currently entered\n\n```python\ndef dialog() :\n    box.showinfo( ‘Greetings’\
    \ , ‘Welcome ’ + entry.get() )\n```\n\n![image](Images/image00261.jpeg)Now, create\
    \ a button to call the function when clicked\n\n```python\nbtn = Button( frame,\
    \ text = ‘Enter Name’ , command=dialog )\n```\n\n![image](Images/image00262.jpeg)Add\
    \ the button and entry to the frame at set sides\n\n```python\nbtn.pack( side\
    \ = RIGHT , padx = 5 )\nentry.pack( side = LEFT )\nframe.pack( padx = 20 , pady\
    \ = 20 )\n```\n\n![image](Images/image00266.jpeg)Finally, add the loop to capture\
    \ this window’s events\n\n```python\nwindow.mainloop()\n```\n\n![image](Images/image00362.jpeg)Save\
    \ the file and run the program, then enter your name and click the button – to\
    \ see a greeting message appear\n\n![image](Images/image00363.jpeg)\n\n![image](Images/image00364.jpeg)\n\
    \n![image](Images/image00194.jpeg)\n\nUse a `Label` widget instead of an `Entry`\
    \ widget if you want to display text that the user cannot edit.\n\n### Listing\
    \ options\n\nA `Listbox` widget provides a list of items in an application from\
    \ which the user can make a selection. A listbox object is created by specifying\
    \ the name of its parent container, such as a window or frame name, and options\
    \ as arguments to a `Listbox()` constructor. Popular options are listed below\
    \ together with a brief description:\n\n| Option: | Description: |\n| :--- | :---\
    \ |\n| `bd` | Border width in pixels (default is 2) |\n| `bg` | Background color\
    \ |\n| `fg` | Foreground color used to render the text |\n| `font` | Font for\
    \ the text |\n| `height` | Number of lines in list (default is 10) |\n| `selectbackground`\
    \ | Background color of selected text |\n| `selectmode` | `SINGLE` (the default)\
    \ or `MULTIPLE` selections |\n| `width` | Listbox width in letters (default is\
    \ 20) |\n| `yscrollcommand` | Attach to a vertical scrollbar |\n\n![image](Images/image00193.jpeg)\n\
    \nWith tkinter, a scrollbar is a separate widget that can be attached to `Listbox`,\
    \ `Text`, `Canvas` and `Entry` widgets.\n\nItems are added to the listbox by specifying\
    \ a list index number and the item string as arguments to its `insert()` method.\n\
    \nYou can retrieve any item from a listbox by specifying its index number within\
    \ the parentheses of its `get()` method. Usefully, a listbox also has a `curselection()`\
    \ method that returns the index number of the currently selected item, so this\
    \ can be supplied as the argument to its `get()` method to retrieve the current\
    \ selection.\n\n![image](Images/image00188.jpeg)\n\nlistbox.py\n\n![image](Images/image00257.jpeg)Start\
    \ a new program by making GUI features available and message box features available\
    \ as a short alias\n\n```python\nfrom tkinter import ***\nimport tkinter.messagebox\
    \ as box\n```\n\n![image](Images/image00258.jpeg)Next, create a window object\
    \ and specify a title\n\n```python\nwindow = Tk()\nwindow.title( ‘Listbox Example’\
    \ )\n```\n\n![image](Images/image00259.jpeg)Now, create a frame to contain widgets\n\
    \n```python\nframe = Frame( window )\n```\n\n![image](Images/image00260.jpeg)Create\
    \ a listbox widget offering three list items\n\n```python\nlistbox = Listbox(\
    \ frame )\nlistbox.insert( 1 , ‘HTML5 in easy steps’ )\nlistbox.insert( 2 , ‘CSS3\
    \ in easy steps’ )\nlistbox.insert( 3 , ‘JavaScript in easy steps’ )\n```\n\n\
    ![image](Images/image00261.jpeg)Next, add a function to display a listbox selection\n\
    \n```python\ndef dialog() :\n    box.showinfo( ‘Selection’ , ‘Your Choice: ’ +\
    \ \\\n    listbox.get( listbox.curselection() ) )\n```\n\n![image](Images/image00262.jpeg)Now,\
    \ create a button to call the function when clicked\n\n```python\nbtn = Button(\
    \ frame , text = ‘Choose’ , command = dialog )\n```\n\n![image](Images/image00266.jpeg)Then,\
    \ add the button and listbox to the frame at set sides\n\n```python\nbtn.pack(\
    \ side = RIGHT , padx = 5 )\nlistbox.pack( side = LEFT )\nframe.pack( padx = 30\
    \ , pady = 30 )\n```\n\n![image](Images/image00362.jpeg)Finally, add the loop\
    \ to capture this window’s events\n\n```python\nwindow.mainloop()\n```\n\n![image](Images/image00365.jpeg)Save\
    \ the file and run the program, then select an option and click the button – to\
    \ see your selection confirmed\n\n![image](Images/image00366.jpeg)\n\n![image](Images/image00367.jpeg)\n\
    \nIf `selectmode` is set to `MULTIPLE`, `curselection()` returns a tuple of selected\
    \ numbers.\n\n### Polling radios\n\nA `Radiobutton` widget provides a single item\
    \ in an application that the user may select. Where a number of radio buttons\
    \ are grouped together the user may only select any item in the group. With tkinter,\
    \ radio button objects are grouped together when they nominate the same control\
    \ variable to assign a value to upon selection. An empty string variable object\
    \ can be created for this purpose using the `StringVar()` constructor or an empty\
    \ integer variable object using the `IntVar()` constructor.\n\n![image](Images/image00215.jpeg)\n\
    \nYou cannot use a regular variable to store values assigned from a radio button\
    \ – it must be an object.\n\nA radio button object is created by specifying four\
    \ arguments to `Radiobutton()` constructor:\n\n- Name of the parent container,\
    \ such as the frame name\n- Text for a display label, specified as a `text=text`\
    \ pair\n- Control variable object, specified as a `variable=variable` pair\n-\
    \ Value to be assigned, specified as a `value=value` pair\n\nEach radio button\
    \ object has a `select()` method that can be used to specify a default selection\
    \ in a group of radio buttons when the program starts. A string value assigned\
    \ by selecting a radio button can be retrieved from a string object by its `get()`\
    \ method.\n\n![image](Images/image00188.jpeg)\n\nradio.py\n\n![image](Images/image00257.jpeg)Start\
    \ a new program by making GUI features available and message box features available\
    \ as a short alias\n\n```python\nfrom tkinter import ***\nimport tkinter.messagebox\
    \ as box\n```\n\n![image](Images/image00258.jpeg)Next, create a window object\
