    \ Boolean value that will remain True as long as the game is in progress, and\
    \ a zero value that will later store a number input by the user\n\n```\nnum =\
    \ random.randint( 1 , 20 )\nflag = True\nguess = 0\n```\n\n![image](Images/image00227.jpeg)Next,\
