    **Guessing game**


    The previous simple examples have illustrated how variables can be used to store
    text string values, numeric integer and floating-point decimal values, and Boolean
    truth values in your programs. Now, they can be used to create a Guessing Game
    program by storing a random generated integer whose value the user will have to
    guess, a Boolean truth value that will end the game when the user guesses correctly,
    and a string containing the user’s guess.


    The code in this example includes some features that are only demonstrated later
    in this book, but as Python is an easily human-readable programming language you
    should be able to understand in principle how this program works.


    ![image](Images/image00188.jpeg)


    guess.py


    ![image](Images/image00225.jpeg)Open an IDLE Edit Window and begin a program by
    importing a “random” library class that provides random number generator functions


    **import random**


    ![image](Images/image00226.jpeg)Now, initialize three variables – a generated
    random number between one and 20, a Boolean value that will remain True as long
    as the game is in progress, and a zero value that will later store a number input
    by the user


    **num = random.randint( 1 , 20 )**


    **flag = True**


    **guess = 0**


    ![image](Images/image00227.jpeg)Next, display a message asking the user to make
    a guess


    **print( ‘Guess my number 1-20 : ‘ , end = ‘ ‘ )**


    ![image](Images/image00228.jpeg)Then, precisely copy this code that will compare
    the stored user’s guess to the stored random number


    **while flag == True :**


    **guess = input( )**


    **if not guess.isdigit() :**


    **print( ‘Invalid! Enter only digits 1-20‘ )**


    **break**


    **elif int( guess ) < num :**


    **print( ‘Too low, try again : ‘ , end = ‘ ‘ )**


    **elif int( guess ) > num :**


    **print( ‘Too high, try again : ‘ , end = ‘ ‘ )**


    **else :**


    **print( ‘Correct... My number is ‘ + guess )**


    **flag = False**


    ![image](Images/image00215.jpeg)


    Many program languages use characters such as **{ }** to group statements together
    but Python uses indentation – so the indentation shown here must be correctly
    preserved.


    ![image](Images/image00231.jpeg)Save then run the program and enter guesses to
    see your input compared to a stored random number


    ![image](Images/image00235.jpeg)


    ![image](Images/image00194.jpeg)


    Notice that the program rejects user input of **str** string or **float** values.


    **Guessing Game in Python – program analysis**


    •The random library class’s randint() function specifies an upper and lower random
    range within its parentheses


    •The flag variable specifies an initial program condition that will allow the
    program to start examining the user’s input


    •The while keyword specifies a “loop” control structure that will repeat the statements
    it contains until a tested condition fails


    •The if not guess.isdigit() test specifies an action to break the loop if the
    user input is not an integer whole number


    •The elif int( guess ) < num test specifies an alternative action if the cast
    user input is lower than the stored random number


    •The elif int( guess ) > num test specifies an alternative action if the cast
    user input is higher than the stored random number


    •The else keyword specifies a final alternative action to change the program condition,
    thereby ending the program


    ![image](Images/image00193.jpeg)


    You need not yet understand this program in detail – each aspect is explained
    by examples later in this book.


    **Correcting errors**


    When coding programs there are three common types of error that can occur. It
    is useful to recognize these different error types in Python programming so they
    can be corrected more easily:


    •**Syntax Error** – occurs when the interpreter encounters code that does not
    conform to the Python language rules. For example, a missing quote mark around
    a string. The interpreter halts and reports the error without executing the program.


    •**Runtime Error** – occurs during execution of the program, at the time when
    the program runs. For example, when a variable name is later mis-typed so the
    variable cannot be recognized. The interpreter runs the program but halts at the
    error and reports the nature of the error as an “Exception”.


    •**Semantic Error** – occurs when the program performs unexpectedly. For example,
    when order precedence has not been specified in an expression. The interpreter
    runs the program and does not report an error.


    ![image](Images/image00236.jpeg)


    Programming errors are often called “bugs” and the process of tracking them down
    is often called “debugging”.


    Correcting syntax and runtime errors is fairly straightforward, as the interpreter
    reports where the error occurred or the nature of the error type, but semantic
    errors require code examination.


    ![image](Images/image00188.jpeg)


    syntax.py


    ![image](Images/image00225.jpeg)Open an IDLE Edit Window then add a statement
    to output a string that omits a closing quote mark


    **print( ‘Coding for Beginners in easy steps )**


    ![image](Images/image00226.jpeg)Save then run the program to see the interpreter
    highlight the syntax error and indicate its nature


    ![image](Images/image00237.jpeg)


    ![image](Images/image00215.jpeg)


    The red syntax error indicator points to the line where the End Of Line (EOL)
    error occurs.


    ![image](Images/image00227.jpeg)Insert a quote mark before the closing parenthesis
    to terminate the string and save then run the program again – to see the error
    has been corrected


    ![image](Images/image00188.jpeg)


    runtime.py


    ![image](Images/image00228.jpeg)Next, begin a new program by initializing a variable
    then try to output its value with an incorrect variable name – to see the interpreter
    report a runtime error


    **title = ‘Coding for Beginners in easy steps’**


    **print( titel )**


    ![image](Images/image00238.jpeg)


    ![image](Images/image00231.jpeg)Amend the variable name to match that in the variable
    declaration and save then run the program again – to see the error has been corrected


    ![image](Images/image00188.jpeg)


    semantic.py


    ![image](Images/image00232.jpeg)Now, begin a new program by initializing a variable
    then try to output an expression using its value without explicit precedence –
    to see a possibly unexpected result of 28


    **num = 3**


    **print( ‘Result: ‘ , num * 8 + 4 )**


    ![image](Images/image00239.jpeg)


    ![image](Images/image00240.jpeg)Add parentheses to group the expression as 3 *
    ( 8 + 4 ) then save the file and run the program again – to see the expected result
    of 36, correcting the semantic error


    ![image](Images/image00194.jpeg)


    Details of how to handle runtime Exception errors in your script code are provided
    [here](#part0008.xhtml_page_70).


    **Summary**


    •Variables can be used to store data values specified in program code and to store
    data values input by a user


    •A value stored in a variable remains available for repeated use until it is replaced
    by a new value or until the program ends'
