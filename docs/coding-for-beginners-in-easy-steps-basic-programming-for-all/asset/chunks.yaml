    \ outside the class structure.\n\n![image](Images/image00194.jpeg)\n\nIt is conventional\
    \ to begin class names with an uppercase character and object names with lowercase.\n"
  raw: 'The position within the file, from which to read or at which to write, can
    be finely controlled by the file object’s seek() function. This accepts an integer
    argument specifying how many characters to move position as an offset from the
    start of the file.


    The current position within a file can be discovered at any time by calling the
    file object’s tell() function to return an integer location.


    When working with file objects it is good practice to use the Python with keyword
    to group the file operational statements within a block. This technique ensures
    that the file is properly closed after operations end, even if an exception is
    raised on the way, and much shorter than writing equivalent try except blocks.


    ![image](Images/image00188.jpeg)


    update.py


    ![image](Images/image00225.jpeg)Start a new program by assigning a string value
    to a variable containing text to be written in a file


    **text = ‘The political slogan “Workers Of The World Unite!” \nis from The Communist
    Manifesto.’**


    ![image](Images/image00226.jpeg)Next, add statements to write the text string
    into a file and display the file’s current status in the “with” block


    **with open( ‘update.txt’ , ‘w’ ) as file :**


    **file.write( text )**


    **print( ‘\nFile Now Closed?:’ , file.closed )**


    ![image](Images/image00227.jpeg)Now, add a non-indented statement after the “with”
    code block to display the file’s new status


    **print( ‘File Now Closed?:’ , file.closed )**


    ![image](Images/image00228.jpeg)Then, re-open the file and display its contents
    to confirm it now contains the entire text string


    **with open( ‘update.txt’ , ‘r+’ ) as file :**


    **text = file.read()**


    **print( ‘\nString:’ , text )**


    ![image](Images/image00231.jpeg)Next, add indented statements to display the current
    file position, then reposition and display that new position


    **print( ‘\nPosition In File Now:’ , file.tell() )**


    **position = file.seek( 33 )**


    **print( ‘Position In File Now:’ , file.tell() )**


    ![image](Images/image00232.jpeg)Now, add an indented statement to overwrite the
    text from the current file position


    **file.write( ‘All Lands’ )**


    ![image](Images/image00240.jpeg)Then, add indented statements to reposition in
    the file once more and overwrite the text from the new position


    **file.seek( 61 )**


    **file.write( ‘the tombstone of Karl Marx.’ )**


    ![image](Images/image00332.jpeg)Finally, add indented statements to return to
    the start of the file and display its entire updated contents


    **file.seek( 0 )**


    **text = file.read()**


    **print( ‘\nString:’ , text )**


    ![image](Images/image00333.jpeg)Save then run the program – to see the file strings
    get updated


    ![image](Images/image00335.jpeg)


    ![image](Images/image00194.jpeg)


    The **seek()** function may optionally accept a second argument value of **0**,
    **1**, or **2** to move the specified number of characters from the start, current,
    or end position respectively – zero is the default start position.


    ![image](Images/image00193.jpeg)


    As with strings, the first character in a file is at index position zero – not
    at index position one.


    **Summary**


    •Strings can be manipulated by operators for concatenation + , to join strings
    together, and for repetition * of strings


    •Strings can be manipulated by operators for slice [ ], and range slice [ : ]
    , that reference the index number of string characters


    •Strings can be manipulated by membership operators in and not in that seek to
    match a specified character within a string


    •The r (or R) raw string operator can be placed immediately before a string to
    suppress any escape characters it contains


    •A “docstring” is a descriptive string within triple quote marks at the start
    of a module, class, or function, to define its purpose


    •The __doc__ attribute can be used to reference the string description within
    a docstring


    •The __builtins__ module can be examined using the dir() function to reveal the
    names of default functions and variables


    •A str object has a format() function for string formatting and many functions
    for string modification, such as capitalize()


    •Replacement fields in a string to be formatted using the format function are
    denoted in a comma-separated list by { } braces


    •Strings can also be formatted using the C-style %s substitution operator to mark
    places in a string where text is to be inserted


    •A file object has open(), read(), write(), and close() functions for working
    with files, and features that describe the file properties


    •The open() function must specify a file name string argument and a file mode
    string parameter, such as ’r’ to read the file


    •A opened file object has information properties that reveal its current status,
    such as mode and readable() values


    •Position in a file, at which to read or write, can be specified with the seek()
    method and reported by the tell() function


    •The Python with keyword groups file operational statements within a block and
    automatically closes an open file


    10


    **Programming objects**


    *This chapter demonstrates how to code virtual objects into your programs*.


    [**Defining classes**](#part0013.xhtml_sec1)


    [**Copying instances**](#part0013.xhtml_sec2)


    [**Addressing properties**](#part0013.xhtml_sec3)


    [**Deriving classes**](#part0013.xhtml_sec4)


    [**Overriding methods**](#part0013.xhtml_sec5)


    [**Applying sense**](#part0013.xhtml_sec6)


    [**Summary**](#part0013.xhtml_sec7)


    **Defining classes**


    The real-world objects that surround us each have attributes and behaviors we
    can describe. For example, a car might be described with a color attribute “red”
    and an “acceleration” behavior. Programming objects are like virtual representations
    of real-world objects that describe attributes and behaviors in a “class” structure.


    A “class” is a specified prototype describing a set of properties that characterize
    an object. Each class has a data structure that can contain both functions and
    variables to characterize the object. The properties of a class are referred to
    as its data “members”. Class function members are known as its “methods”, and
    class variable members (declared within a class structure but outside any method
    definitions) are known as its “attributes”. Class members can be referenced throughout
    a program using dot notation, suffixing the member name after the class name,
    with syntax of *class-name.method-name*() or *class-name.attribute-name*.


    ![image](Images/image00336.jpeg)


    A class declaration begins with the class keyword, followed by a programmer-specified
    name (adhering to the usual Python naming conventions but beginning in uppercase)
    then a : colon. Next come indented statements, optionally specifying a class document
    string, class variable attribute declarations, and class method definitions –
    so the class block syntax looks like this:


    ***class ClassName* :**


    ***‘‘‘ class-documentation-string ‘‘‘***


    ***class-variable-declarations***


    ***class-method-definitions***


    The class declaration, which specifies its attributes and methods, is a blueprint
    from which working copies (“instances”) can be made. All variables declared within
    method definitions are known as “instance” variables and are only available locally
    within the method in which they are declared – they cannot be directly referenced
    outside the class structure.


    ![image](Images/image00194.jpeg)


    It is conventional to begin class names with an uppercase character and object
    names with lowercase.


    Typically, instance variables contain data passed by the caller when an instance
    copy of the class is created. As this data is only available locally for internal
    use it is effectively hidden from the rest of the program. This technique of data
    “encapsulation” ensures that data is securely stored within the class structure
    and is the first principle of Object Oriented Programming (OOP).'
