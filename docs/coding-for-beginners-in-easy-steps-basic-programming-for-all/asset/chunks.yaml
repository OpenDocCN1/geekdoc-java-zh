    ## 识别类型


    在编写计算机程序时，你可以表示并存储在变量中的四种基本数据类型。虽然 Python 语言中的变量可以存储任意类型的数据，但理解不同的类型是非常，因为你有时需要在代码中将它们从一种类型转换为另一种类型：


    | 数据类型: | 描述: | 示例: |

    | :--- | :--- | :--- |

    | `str` | 字符字符串，可以包括字母、数字、空格和符号 | ‘Daytona 500’ |

    | `int` | 整数，它**不包含**小数部分 | `1000` |

    | `float` | 浮点数，它**有**小数部分 | `98.6` |

    | `bool` | 布尔逻辑真值，为 True 或 False 二 | `True` |


    ![image](img/image00215.jpeg)


    整数 `int` 数字不应包含任何标点符号——因此将一千代码化为 `1000` 而不是 `1,000`。


    字符串仅仅是你可以从计算机键盘输入的任何字符集合，并组合在引号内。如果赋值给变量的值被包含在引号内，变量将识别该值属于 `str` “类”。


    ![image](img/image00193.jpeg)


    字符串 `str` 值必须始终包含在引号中。


    数字是你可以从键盘输入的任何数值，但它们通过是否包含或省略小数点来定义。如果赋值给变量的数值没有小数点，变量将将其识别为属于 `int` “类”；如果确实有小数点，则识别为属于
    `float` 类。


    布尔值是一个逻辑真值。变量通过关键字 `True` 和 `False` 识别给它的布尔值为属于 `bool` “类”，或者该值的值为 `True` 或 `False`。


    在 Python 编程中，你可以通过在内置 `type()` 函数的括号内指定变量名称，轻松发现存储在变量中的数据类型。


    ![image](img/image00188.jpeg)


    ```python

    types.py

    ```


