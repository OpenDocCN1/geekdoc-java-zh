    \ whose value the user will have to guess, a Boolean truth value that will end\
    \ the game when the user guesses correctly, and a string containing the user’s\
    \ guess.\n\nThe code in this example includes some features that are only demonstrated\
    \ later in this book, but as Python is an easily human-readable programming language\
    \ you should be able to understand in principle how this program works.\n\n![image](Images/image00188.jpeg)\n\
