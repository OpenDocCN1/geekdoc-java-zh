    \ `int` 数据类型的浮点数会在小数点处被截断。\n\n该语句可以在循环中使用以生成给定范围内的多个随机整数，但输出中的任何数字都可能重复 – 没有保证唯一性。相反，可以通过\
    \ `random` 模块中的 `sample()` 方法在给定范围内生成多个唯一的随机整数。这需要两个参数，分别指定范围和要返回的唯一整数数量。使用内置的\
    \ `range()` 函数指定最大值是方便的。例如，在 1 到 9 的范围内生成六个唯一的数字：\n\n```python\nrandom.sample(\
    \ range( 10 ) , 6 )\n```\n\n或者在 1 到 10 的范围内生成六个唯一的数字：\n\n```python\nrandom.sample(\
    \ range( 1 , 11 ) , 6 )\n```\n\n这种技术可以代表随机彩票，例如在 1 到 49 之间选择六个唯一的数字。\n\n![image](img/image00193.jpeg)\n\
    \n`range()` 函数可以指定起始和结束值。如果没有提供起始值，默认假设为零。\n\n![image](img/image00188.jpeg)\n\n\
