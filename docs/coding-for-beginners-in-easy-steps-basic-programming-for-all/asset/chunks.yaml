    A “docstring” is a descriptive string literal that occurs as the first statement
    in a module, a function, a class, or a method definition. This should be enclosed
    within triple single quote marks. Uniquely, the docstring becomes the __doc__
    special attribute of that object, so can be referenced using its name and dot-suffixing.
    All modules should normally have docstrings, and all functions and classes exported
    by a module should also have docstrings.


