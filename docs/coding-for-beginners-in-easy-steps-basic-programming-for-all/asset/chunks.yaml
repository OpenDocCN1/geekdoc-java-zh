    - 存储在集合中的数据不能通过其索引号引用\n- 集合变量有方法，可以在列表后加点操作符以进行操作和比较\n- Python 内置成员运算符 `in` 可用于在集合中查找值\n\
    - 使用 `list()` 函数将集合转换为普通列表，以便允许通过索引号引用元素数据\n- Python 字典是一个键值对列表，其中每个键必须是唯一的\n\
    - 存储在字典元素中的数据可以使用字典名后跟其键的 `[]` 方括号来引用\n\n5\n\n## 控制块\n\n*本章演示如何创建代码来控制程序的执行流*。\n\
    \n- 分支选择\n- 计数循环\n- 循环条件\n- 跳过循环\n- 捕获错误\n- 总结\n\n### 分支选择\n\n与许多编程语言一样，Python\
    \ `if` 关键字执行基本的条件测试，评估给定表达式的布尔值为 `True` 或 `False`。这允许程序根据测试结果以不同的方向进行，这被称为“条件分支”。\n\
    \n`if` 关键字必须后跟 `:` 冒号，以及测试成功时执行的语句。语法如下：\n\n```\nif test-expression:\n    statements-to-execute-when-test-expression-is-True\n\
    ```\n\n![image](img/image069.jpeg)\n\n`if: elif: else:` 序列是其他语言中 **switch** 或\
    \ **case** 语句的 Python 等效实现。\n\n可选，`if` 测试可以通过附加 `else` 关键字提供测试失败时的替代语句。`else`\
    \ 关键字必须后跟 `:` 冒号和缩进语句。\n\n```python\nif test-expression:\n    statements-if-true\n\
    else:\n    statements-if-false\n```\n\n`if` 测试块可以使用 `elif` 关键字（“else if”）后续，提供替代测试成功时执行的语句。这也必须与\
    \ `if` 关键字对齐，后跟 `:` 冒号，并缩进语句。最后可以添加 `else` 关键字来提供测试失败时的替代语句。`if-elif-else` 结构的语法如下：\n\
    \n```python\nif test-expression-1:\n    statements-to-execute-when-test-expression-1-is-True\n\
    elif test-expression-2:\n    statements-to-execute-when-test-expression-2-is-True\n\
    else:\n    statements-to-execute-when-test-expressions-are-False\n```\n\n"
- fmt: "\n```python\nif num > 7 and num < 9 :\n    print( ‘Number is 8’ )\n\nif num\
    \ == 1 or num == 3 :\n    print( ‘Number Is 1 or 3’ )\n```\n\n![image](Images/image00273.jpeg)Save\
    \ then run the program – to see conditional branching in action\n\n![image](Images/image00274.jpeg)\n\
    \n![image](Images/image00193.jpeg)\n\nThe user input is read as a string value\
