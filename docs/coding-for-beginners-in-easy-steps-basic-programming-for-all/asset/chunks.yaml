    ## Doing arithmetic


    The arithmetical “operators” commonly used in coding computer programs use a `+`
    symbol for addition and a `-` symbol for subtraction, as you would expect. Typically,
    they also use an `*` asterisk for multiplication, rather than a `x` symbol, and
    a `/` forward slash for division, rather than a `÷` symbol.


    The arithmetical operators used to code Python programs are listed in the table
    below, together with the operation they perform:


    | Operator: | Operation: |

    | :--- | :--- |

    | `+` | Addition |

    | `-` | Subtraction |

    | `*` | Multiplication |

    | `/` | Division |

    | `%` | Remainder |

    | `//` | Floor division |

    | `**` | Exponent |


    The `+` operator adds two numbers together and the `-` operator subtracts the
    second number from the first number.


    The `*` operator multiplies the first number by the second number and the `/`
    operator divides the first number by the second number.


    The `%` remainder operator divides the first number by the second number and returns
    the remainder of the operation. This is useful to determine if a number has an
    odd or even value.


    The `//` floor division operator performs just like the `/` division operator
    but truncates the result at the decimal point – removing any floating point part
    from the resulting number.


    The `**` exponent operator returns the result of the first number raised to the
    power of the second number.


    ![image](Images/image00194.jpeg)


    Values used with operators to form expressions are called “operands” – in the
    expression `2 + 3` the numerical values `2` and `3` are the operands.


