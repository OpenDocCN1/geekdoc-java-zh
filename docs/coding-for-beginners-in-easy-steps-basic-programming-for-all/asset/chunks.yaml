    by an index number in [ ] square brackets


    •A list element can have more than one index to represent multiple dimensions,
    such as X and Y coordinates


    •List variables have a number of methods that can be dot-suffixed to the list
    name for manipulation


    •The len() function returns the length of a specified list


    •An individual list element can be deleted by specifying the list name and element
    index number to the Python del keyword


    •A Python tuple is an immutable list whose values can be assigned to individual
    variables by “sequence unpacking”


    •Data stored in a tuple element can be referenced using the tuple name followed
    by an index number in [ ] square brackets


    •A Python set is an ordered collection of unique elements whose values can be
    compared and manipulated by its methods


    •Data stored in a set cannot be referenced by its index number


    •Set variables have methods that can be dot-suffixed to the list name for manipulation
    and comparison


    •The Python built-in membership in operator can be used to seek a value within
    a set


    •A set can be converted to a regular list using the list() function to allow reference
    of element data by index number


    •A Python dictionary is a list of key:value pairs of data in which each key must
    be unique


    •Data stored in a dictionary element can be referenced using the dictionary name
    followed by its key in [ ] square brackets


    5


    **Controlling blocks**


    *This chapter demonstrates how to create code to control the flow of your programs*.


    [**Branching choices**](#part0008.xhtml_sec1)


    [**Counting loops**](#part0008.xhtml_sec2)


    [**Looping conditions**](#part0008.xhtml_sec3)


    [**Skipping loops**](#part0008.xhtml_sec4)


    [**Catching errors**](#part0008.xhtml_sec5)


    [**Summary**](#part0008.xhtml_sec6)


    **Branching choices**


    As in many programming languages the Python if keyword performs a basic conditional
    test that evaluates a given expression for a Boolean value of True or False. This
    allows a program to proceed in different directions according to the result of
    the test and is known as “conditional branching”.


    In Python, the tested expression must be followed by a : colon, then statements
    to execute when the test succeeds should follow below on separate lines and each
    line must be indented from the if test line. The size of the indentation is not
    important but it must be the same for each line. So the syntax looks like this:


    **if *test-expression* :**


    ***statements-to-execute-when-test-expression-is-True


    statements-to-execute-when-test-expression-is-True***


    ![image](Images/image00269.jpeg)


    The **if: elif: else:** sequence is the Python equivalent of the **switch** or
    **case** statements found in other languages.


    Optionally, an if test can offer alternative statements to execute when the test
    fails by appending an else keyword after the statements to be executed when the
    test succeeds. The else keyword must be followed by a : colon and aligned with
    the if keyword but its statements must be indented in a likewise manner, so its
    syntax looks like this:


    **if *test-expression* :**


    ***statements-to-execute-when-test-expression-is-True


    statements-to-execute-when-test-expression-is-True***


    **else :**


    ***statements-to-execute-when-test-expression-is-False


    statements-to-execute-when-test-expression-is-False***


    An if test block can be followed by an alternative test using the elif keyword
    (“else if ”) that offers statements to be executed when the alternative test succeeds.
    This, too, must be aligned with the if keyword, followed by a : colon, and its
    statements indented. A final else keyword can then be added to offer alternative
    statements to execute when the test fails. The syntax for the complete if-elif-else
    structure looks like this:


    **if *test-expression-1* :**


    ***statements-to-execute-when-test-expression-1-is-True


    statements-to-execute-when-test-expression-1-is-True***


    **elif *test-expression-2* :**


    ***statements-to-execute-when-test-expression-2-is-True


    statements-to-execute-when-test-expression-2-is-True***


    **else :**


    ***statements-to-execute-when-test-expressions-are-False


    statements-to-execute-when-test-expressions-are-False***


    ![image](Images/image00215.jpeg)


    Indentation of code is very important in Python as it identifies code blocks to
    the interpreter – other programming languages use bracketing such as { } braces.


    ![image](Images/image00188.jpeg)


    if.py


    ![image](Images/image00270.jpeg)Start a new program by initializing a variable
    with user input of an integer value


    **num = int( input( ‘Please Enter A Number: ‘ ) )**


    ![image](Images/image00271.jpeg)Next, test the variable and display an appropriate
    response


    **if num > 5 :**


    **print( ‘Number Exceeds 5’ )**


    **elif num < 5 :**


    **print( ‘Number is Less Than 5’ )**


    **else :**


    **print( ‘Number Is 5’ )**


    ![image](Images/image00272.jpeg)Now, test the variable again using two expressions
    and display a response only upon success'
