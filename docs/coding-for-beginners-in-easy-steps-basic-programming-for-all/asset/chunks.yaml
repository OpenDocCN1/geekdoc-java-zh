    \ C 程序。\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <time.h>\n\
    ```\n\n![image](img/image00288.jpeg)接下来，定义一个 `main()` 函数体，它将包含整个游戏代码并在完成后返回零值。\n\
    \n```c\nint main() {\n    /* 在此处添加语句 */\n    return 0;\n}\n```\n\n![image](img/image00289.jpeg)现在，添加语句将变量初始化为\
    \ 1-20 范围内的随机数、一个布尔真和一个整数。\n\n```c\nsrand(time(NULL));\nint num = (rand() % 20)\
    \ + 1;\nint flag = 1;\nint guess = 0;\n```\n\n![image](img/image00290.jpeg)添加语句请求用户输入。\n\
    \n```c\nprintf(\"Guess my number 1-20 : \");\n```\n\n![image](img/image00291.jpeg)然后，添加一个循环语句，将输入读入整数变量并包含一个条件测试。\n\
    \n```c\nwhile (flag == 1) {\n    scanf(\"%d\", &guess);\n    fflush(stdin);\n\
    \    /* 在此处添加条件测试 */\n}\n```\n\n![image](img/image00215.jpeg)此 C 程序将接受浮点猜测，因为它们的值在赋值给\
    \ `guess` 变量时会被截断为整数。\n\n![image](img/image00292.jpeg)最后，在循环内部添加条件测试，然后保存、编译并运行程序。\n\
