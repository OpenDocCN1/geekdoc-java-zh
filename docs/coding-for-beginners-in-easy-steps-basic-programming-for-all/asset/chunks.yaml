    存储在变量中的数据通过 Python 赋值语句进行赋值赋值。例如，为名为 `a` 的变量存储数值 8：


    `a = 8`


    随后可以使用变量名检索存储的值，因此 `print( a )` 语句将输出存储的值。该变量随后可以分配不同的值，因此其值随程序运行而变化 – 这就是“变量”一词的由来。


    在 Python 编程中，必须在声明语句中初始化变量 – 否则解释器将报告“未定义”错误。


