    `L` as the total number of elements it contains. Like the `index()` and `count()`
    methods the returned value is numeric so cannot be directly concatenated to a
    text string for output.


    String representation of numeric values can, however, be produced by Python’s
    `str(n)` function for concatenation to other strings, which returns a string version
    of the numeric `n` value. Similarly, a string representation of an entire list
    can be returned by the `str(L)` function for concatenation to other strings. In
    both cases remember that the original version remains unchanged, as the returned
    versions are merely copies of the original version.


