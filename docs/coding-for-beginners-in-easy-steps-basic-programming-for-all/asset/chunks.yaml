    ### Storing input


    The ability to store and replace coded data in a variable is great, but this ability
    can also be used to store data input by a user – allowing your programs to become
    interactive.


    In Python programming a built-in `input()` function can be used to accept user
    input from a keyboard and assign it to a variable. Optionally, this function can
    specify a string, within quote marks inside its parentheses, that will be displayed
    to request the input. The program will wait until the user hits the Return key
    before assigning their input to the variable and proceeding onwards.


    Stored variable values can be output by the built-in `print()` function by specifying
    the variable name within the function’s parentheses. Multiple values may also
    be specified for output as a comma-separated list within the parentheses.


