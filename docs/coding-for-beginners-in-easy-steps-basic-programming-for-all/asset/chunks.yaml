    ## 转换数据


    你通常需要在程序中转换数据以执行某些操作——例如算术运算或拼接。算术运算只能对数值类型（如 `int` 和 `float`）进行，而拼接只能对字符串类型（如
    `str`）进行。


    Python 提供了几个内置函数，允许你轻松将数据转换为不同的类型。这些函数不会转换原始值，而仅返回其转换后的表示。在编程术语中，这被称为“强制”（cast）操作：


    | 函数: | 描述: |

    | :--- | :--- |

    | `int(x)` | 将 `x` 转换为整数 |

    | `float(x)` | 将 `x` 转换为浮点数 |

    | `str(x)` | 将 `x` 转换为字符串 |


    ![image](img/image00193.jpeg)


    代码中的值不应包含在引号内——引号内的数字将被视为字符串值！


    代码中手动赋值给变量的数值会自动被赋予相应的 `int` 或 `float` 类型。然而，通过 `input()` 函数赋值给变量的值总是被赋予 `str`
    数据类型——即使它们是数字！这意味着在对其进行算术运算之前，必须将它们转换为相应的数值类型。


    相反，代码中手动赋值给变量的数值（自动被赋予 `int` 或 `float` 类型）无法拼接到字符串中。这意味着它们必须转换为 `str` 类型以包含字符串中。


    在 Python 中，正如许多其他编程语言一样，`+` 符号根据上下文具有多个用途。当 `+` 符号用于两个数值之间时，它执行加法（视为“加法运算符”），而当
    `+` 符号用于两个字符串之间时，它执行拼接（视为“拼接运算符”）。赋值此类操作结果的变量将自动成为相应的数据类型。


    ![image](img/image00194.jpeg)


    对 `int` 和 `float` 类型进行算术运算会自动强制转换为 `float` 结果。将值转换为 `float` 类型以便输入小数。


    ![image](img/image00188.jpeg)


    ```python

    cast.py

    ```


    ![image](img/image00225.jpeg)打开 IDLE 编辑窗口，通过赋值用户输入初始化两个变量


    ```python

    num1= input( ‘Please enter a whole number: ‘ )

    num2= input( ‘Now enter another whole number: ’ )

    ```


    ![image](img/image00226.jpeg)接下来，显示每个变量的数据类型，以查看数值实际上是存储为字符串的


    ```python

    print( ‘Input is: ‘ , type( num1 ) , type( num2 ) )

    ```


