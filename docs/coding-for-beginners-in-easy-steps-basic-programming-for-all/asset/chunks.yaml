    ![image](Images/image00289.jpeg)Add a statement to request user input


    **System.out.print( “Guess my number 1-20 : “ ) ;**


    ![image](Images/image00290.jpeg)Then, add a loop statement that reads input into
    the integer variable and will enclose a conditional test


    **while ( flag == true )**


    **{**


    **try {**


    **guess = Integer.parseInt( System.console().readLine() ) ; }**


    **catch ( NumberFormatException ex ) { }**


    **/* Conditional test to be added here */**


    **}**


    ![image](Images/image00194.jpeg)


    This Java program will not accept floating-point guesses as they are recognized
    as non-integers by the function **Integer.parseInt( )**.


    ![image](Images/image00291.jpeg)Finally, add a conditional test inside the loop
    then save, compile, and run the program


    **if( guess == 0 ) {**


    **System.out.println( “Invalid! Enter only digits 1-20” ) ;**


    **break ;**


    **}**


    **else if ( guess < num ) {**


    **System.out.print( “Too low, try again : “ ) ; }**


    **else if ( guess > num ) {**


    **System.out.print( “Too high, try again : “ ) ; }**


    **else {**


    **System.out.println( “Correct... My number is ” + num ) ;**


    **flag = false ;**


    **}**


    ![image](Images/image00409.jpeg)


    ![image](Images/image00410.jpeg)


    The Java Development Kit (JDK) is needed to create Java programs. It is available
    free from **[oracle.com](http://oracle.com)** and includes the command-line Java
    Compiler (**javac.exe**). In the command here **javac** invokes the compiler for
    **Guess.java** source code and will automatically output an executable file named
    **Guess.exe**. This can then be run by the JRE using the **java** command.


