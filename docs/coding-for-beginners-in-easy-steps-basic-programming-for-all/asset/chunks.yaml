- fmt: "\nThe position within the file, from which to read or at which to write, can\
    \ be finely controlled by the file object’s `seek()` function. This accepts an\
    \ integer argument specifying how many characters to move position as an offset\
    \ from the start of the file.\n\nThe current position within a file can be discovered\
    \ at any time by calling the file object’s `tell()` function to return an integer\
    \ location.\n\nWhen working with file objects it is good practice to use the Python\
    \ `with` keyword to group the file operational statements within a block. This\
    \ technique ensures that the file is properly closed after operations end, even\
    \ if an exception is raised on the way, and much shorter than writing equivalent\
    \ `try except` blocks.\n\n![image](Images/image00188.jpeg)\n\n### update.py\n\n\
    ![image](Images/image00225.jpeg)Start a new program by assigning a string value\
    \ to a variable containing text to be written in a file\n\n```python\ntext = ‘The\
    \ political slogan “Workers Of The World Unite!” \\nis from The Communist Manifesto.’\n\
    ```\n\n![image](Images/image00226.jpeg)Next, add statements to write the text\
    \ string into a file and display the file’s current status in the “with” block\n\
    \n```python\nwith open( ‘update.txt’ , ‘w’ ) as file :\nfile.write( text )\nprint(\
    \ ‘\\nFile Now Closed?:’ , file.closed )\n```\n\n![image](Images/image00227.jpeg)Now,\
    \ add a non-indented statement after the “with” code block to display the file’s\
    \ new status\n\n```python\nprint( ‘File Now Closed?:’ , file.closed )\n```\n\n\
    ![image](Images/image00228.jpeg)Then, re-open the file and display its contents\
    \ to confirm it now contains the entire text string\n\n```python\nwith open( ‘update.txt’\
    \ , ‘r+’ ) as file :\ntext = file.read()\nprint( ‘\\nString:’ , text )\n```\n\n\
    ![image](Images/image00231.jpeg)Next, add indented statements to display the current\
    \ file position, then reposition and display that new position\n\n```python\n\
    print( ‘\\nPosition In File Now:’ , file.tell() )\nposition = file.seek( 33 )\n\
    print( ‘Position In File Now:’ , file.tell() )\n```\n\n![image](Images/image00232.jpeg)Now,\
    \ add an indented statement to overwrite the text from the current file position\n\
    \n```python\nfile.write( ‘All Lands’ )\n```\n\n![image](Images/image00240.jpeg)Then,\
    \ add indented statements to reposition in the file once more and overwrite the\
    \ text from the new position\n\n```python\nfile.seek( 61 )\nfile.write( ‘the tombstone\
    \ of Karl Marx.’ )\n```\n\n![image](Images/image00332.jpeg)Finally, add indented\
    \ statements to return to the start of the file and display its entire updated\
    \ contents\n\n```python\nfile.seek( 0 )\ntext = file.read()\nprint( ‘\\nString:’\
    \ , text )\n```\n\n![image](Images/image00333.jpeg)Save then run the program –\
    \ to see the file strings get updated\n\n![image](Images/image00335.jpeg)\n\n\
    ![image](Images/image00194.jpeg)\n\nThe `seek()` function may optionally accept\
    \ a second argument value of `0`, `1`, or `2` to move the specified number of\
    \ characters from the start, current, or end position respectively – zero is the\
    \ default start position.\n\n![image](Images/image00193.jpeg)\n\nAs with strings,\
    \ the first character in a file is at index position zero – not at index position\
    \ one.\n\n### Summary\n\n- Strings can be manipulated by operators for concatenation\
    \ `+`, to join strings together, and for repetition `*` of strings\n- Strings\
    \ can be manipulated by operators for slice `[ ]`, and range slice `[ : ]` , that\
    \ reference the index number of string characters\n- Strings can be manipulated\
    \ by membership operators `in` and `not in` that seek to match a specified character\
    \ within a string\n- The `r` (or `R`) raw string operator can be placed immediately\
    \ before a string to suppress any escape characters it contains\n- A “docstring”\
    \ is a descriptive string within triple quote marks at the start of a module,\
    \ class, or function, to define its purpose\n- The `__doc__` attribute can be\
    \ used to reference the string description within a docstring\n- The `__builtins__`\
    \ module can be examined using the `dir()` function to reveal the names of default\
    \ functions and variables\n- A `str` object has a `format()` function for string\
    \ formatting and many functions for string modification, such as `capitalize()`\n\
    - Replacement fields in a string to be formatted using the `format` function are\
    \ denoted in a comma-separated list by `{ }` braces\n- Strings can also be formatted\
    \ using the C-style `%s` substitution operator to mark places in a string where\
    \ text is to be inserted\n- A file object has `open()`, `read()`, `write()`, and\
    \ `close()` functions for working with files, and features that describe the file\
    \ properties\n- The `open()` function must specify a file name string argument\
    \ and a file mode string parameter, such as `’r’ to read the file\n- A opened\
    \ file object has information properties that reveal its current status, such\
    \ as `mode` and `readable()` values\n- Position in a file, at which to read or\
    \ write, can be specified with the `seek()` method and reported by the `tell()`\
    \ function\n- The Python `with` keyword groups file operational statements within\
    \ a block and automatically closes an open file\n\n10\n\n### Programming objects\n\
    \n*This chapter demonstrates how to code virtual objects into your programs*.\n\
    \n- [Defining classes](#part0013_sec1)\n- [Copying instances](#part0013_sec2)\n\
    - [Addressing properties](#part0013_sec3)\n- [Deriving classes](#part0013_sec4)\n\
    - [Overriding methods](#part0013_sec5)\n- [Applying sense](#part0013_sec6)\n-\
    \ [Summary](#part0013_sec7)\n\n#### Defining classes\n\nThe real-world objects\
    \ that surround us each have attributes and behaviors we can describe. For example,\
    \ a car might be described with a color attribute “red” and an “acceleration”\
    \ behavior. Programming objects are like virtual representations of real-world\
    \ objects that describe attributes and behaviors in a “class”.\n\nA “class” is\
    \ a specified prototype describing an object. Each class has a data structure\
    \ that can contain both functions and variables. The properties of a class are\
    \ referred to as its data “members”. Class function members are known as “methods”,\
    \ and class variable members (declared within a class but outside any method definitions)\
    \ are known as its “attributes”. Class members can be referenced throughout a\
    \ program using dot notation, suffixing the member name after the class name,\
    \ with syntax of `class-name.method-name()` or `class-name.attribute-name`.\n\n\
    ![image](Images/image00336.jpeg)\n\nA class declaration begins with the `class`\
    \ keyword, followed by a programmer-specified name (adhering to the usual Python\
