  \n面向对象编程（OOP）的三个基石是封装、继承和多态。本章之前的示例演示了数据如何封装在 Python 类中，以及派生类如何继承其基类的属性。本示例介绍了多态这一最后一个基石原则。\n\
  \n“多态”（源希腊语，意思是“多种形式”）描述了根据上下文为实体分配不同含义或目的的能力。\n\n![image](img/image00349.jpeg)\n\
  \n\n\n\n\n在 Python 中，`+` 字符实体可以被描述为多态的，因为它在数值操作数的上下文中代表算术加法运算符，而在字符操作数的上下文中代表字符串拼接运算符。\n\
  \n或许更重要的是，Python 类方法也可以是多态的，因为 Python 语言使用了“鸭子类型”（duck typing）——这意味着……如果它走起来像鸭子，游起来像鸭子，叫起来像鸭子，那么这只鸟就被认为是鸭子。\n\
  \n在鸭子类型语言中，你可以创建一个函数来接受任何类型的对象并调用该对象的方法。如果该对象确实具有被调的方法（被认为是鸭子），则会执行它们；否则函数将抛出运行时错误。\n\
  \n可以创建多个类具有同名的方法，并且这些类的实例将执行关联的版本。\n\n![image](img/image00188.jpeg)\n\nDuck.py\n\
  \n![image](img/image00241.jpeg)创建一个新的类文件，声明一个带有方法以显示该类特有字符串的类\n\n```python ownclass\
  \ Duck :\n    def talk( self ) :\n        print( ‘\\nDuck Says: Quack!’ )\n    def\
  \ coat( self ) :\n        print( ‘Duck Wears: Feathers’ )\n```\n\n![image](img/image00188.jpeg)\n\
  \nMouse.py\n\n![image](img/image00242.jpeg)接下来，创建一个类文件，声明一个具有同名方法但显示此类特有字符串的类\n\n\
  ```python\nclass Mouse :\n    def talk( self ) :\n        print( ‘\\nMouse Says:\
  \ Squeak!’ )\n    def coat( self ) :\n        print( ‘Mouse Wears: Fur’ )\n```\n\
  \n![image](img/image00188.jpeg)\n\npolymorph.py\n\n![image](img/image00243.jpeg)保存这两个类文件，然后通过提供这两个类的特性启动一个新程序\n\
  \n```python\nfrom Duck import *\nfrom Mouse import *\n```\n\n![image](img/image00244.jpeg)接下来，定义一个接受任何单个对象作为参数并尝试调用该对象方法的函数\n\
  \n```python\ndef describe( object ) :\n    object.talk()\n    object.coat()\n```\n\
  \n![image](img/image00245.jpeg)现在，每个类创建一个实例对象\n\n```python\ndonald = Duck()\nmickey\
  \ = Mouse()\n```\n\n![image](img/image00246.jpeg)最后，添加语句调用该函数并将每个实例对象作为参数传递给它\n\n\
  ```python\ndescribe( donald )\ndescribe( mickey )\n```\n\n![image](img/image00247.jpeg)保存并运行程序——以看到关联版本的方法被调用\n\
  \n![image](img/image00350.jpeg)\n\n![image](img/image00351.jpeg)\n\nDuck – donald\n\
  \n![image](img/image00352.jpeg)\n\nMouse – mickey\n\n![image](img/image00193.jpeg)\n\
  \n一个类只能有一个给定名称的方法——Python 不支持方法重载。\n\nPython 的面向对象编程允许数据封装、继承和多态。基类方法可以被派生类中的同名方法覆盖。然而，Python\
  \ 不支持其他语言中常见的“重载”技术——即在单个类中可以创建具有不同参数列表的同名方法。\n\n# 总结\n\n-   编程对象类似于真实对象的虚拟表示，在“类”中描述属性和行为\n\
  -   类是一个数据结构原型，通过其方法和属性成员描述对象的属性\n-   每个类声明都以 `class` 关键字开头，后跟一个缩进的代码块，该代码块可能包含类文档字符串、类变量和类方法\n\
  -   类变量具有全局作用域，但实例变量（在方法定义内部声明）仅具有局部作用域\n-   实例变量在类结构中安全地封装数据，并在类实例创建时初始化\n-   类的属性通过点符号表示法引用，并在内部使用\
  \ `self` 前缀进行寻址\n-   类实例是原型的副本，在实例首次创建时会自动调用其 `__init__()` 方法\n-   可以使用点符号表示法添加、修改或删除类的属性，或者使用内建函数\
  \ `getattr()`、`hasattr()`、`setattr()` 和 `delattr()` 进行操作\n-   Python 自动提供的属性名称以下划线字符开头，用在逻辑上指示私有性\n\
  -   派生类继承其派自的父基类的方法和属性成员\n-   派生类的声明必须在自己的类名后的括号中写明其父基类的名称\n-   派生类的方法可以覆盖其父基类中同名的匹配方法\n\
  -   可以使用基类名进行标识来显式调用基类的方法\n-   Python 是一种鸭子类型语言，支持多个类同名方法的多态性\n-   面向对象编程（OOP）的三大基石是封装、继承和多态\n\
  \n11\n\n#### 构建接口\n\n*本章演示了如何编写图形化窗口程序的代码*。\n\n- 启动接口\n- 响应按钮\n- 显示消息\n- 收集条目\n\
  - 列出选项\n- 轮询选项/单选框\n- 勾选框检查\n- 添加图像\n- 总结\n\n#### 启动接口\n\n你可以用于创建图形化应用程序的标准 Python\
  \ 模块称为“tkinter”这是一个与系统 GUI（图形用户界面）交互的工具。tkinter 模块可以像其他模块一样导入到程序中。每个 tkinter 程序都必须从调用\
  \ `Tk()` 构造函数开始创建一个窗口。窗口的大小可以可选地作为 `widthheight` 字符串参数传递给窗口对象的 `geometry()` 方法。同样，窗口的标题可以作为标题字符串参数传递给窗口对象的\
  \ `title()` 方法。如果未指定，则将使用默认的尺寸和标题值。\n\n![image](img/image00215.jpeg)\n\n`Tk()` 构造函数只能调用一次，且它必须位于程序的开头。每个\
  \ tkinter 程序还必须调用窗口对象的 `mainloop()` 方法来捕获事件，例如用户关闭窗口退出时。此循环应该出现在程序的末尾，因为它还处理了执行期间可能实现的窗口更新。\n\
  \n在 tkinter 中，所有包含在应用程序窗口中的图形控件（如按钮或复选框）统称为“部件”（widgets）。也许简单的部件是一个非交互的标签对象，仅显示文本或图像。可以通过指定窗口对象的名称和\
  \ `text=`string` 作为 `Label()` 构造函数的参数创建一个标签对象。\n\n创建后，每个部件（如标签）都必须使用这些“布局管理器”方法添加到窗口中：\n\
  \n- `pack()` –通过向 `side=` 参数指定 `TOP`、`BOTTOM`、`LEFT` 或 `RIGHT` 常量值将部件放置在窗口的一侧\n\
  - `place()` –通过向 `x=` 和 `y=` 参数指定数值值将部件放置在窗口的 XY 坐标处\n- `grid()` –通过向 `row=` 和 `column=`\
  \ 参数指定数值值将部件放置在窗口的单元格内\n\n![image](img/image00194.jpeg)\n\n`grid()` 布局管理器方法在此处示例中进行了演示。\n\
  \n可选地，`pack()` 方法可以包含 `fill` 参数以使部件在可用空间内扩展。例如，使用 `fill=`x’。或者，`pack()` 方法可以包含 `padx`\
  \ 和 `pady` 参数，以沿轴按指定量扩展部件。\n\n![image](img/image00188.jpeg)\n\nwindow.py\n\n![image](img/image00257.jpeg)通过一个语句使“tkinter”模块的\
  \ GUI 方法和属性可用，启动一个新程序\n\n\n\n\n\n`from tkinter import ***`\n\n![image](img/image00258.jpeg)接下来，添加一条语句调用构造函数来创建一个窗口对象\n\
  \n```python\nwindow = Tk()\n```\n\n![image](img/image00259.jpeg)现在，添加一条语句为此窗口指定标题\n\
  \n```python\nwindow.title( ‘Label Example’ )\n```\n\n![image](img/image00260.jpeg)然后，添加一条语句调用构造函数来创建一个标签对象\n\
  \n```python\nlabel = Label( window , text = ‘Hello World!’ )\n```\n\n![image](img/image00261.jpeg)使用\
  \ packer 将标签添加到窗口中，并设置水平和垂直内边距进行布局\n\n```python\nlabel.pack( padx = 200 , pady =\
  \ 50 )\n```\n\n![image](img/image00262.jpeg)最后，添加强制语句通过捕获事件来维持窗口\n\n```python\n\
  window.mainloop()\n```\n\n![image](img/image00266.jpeg)保存并运行程序 – 看到一个包含标签组件的窗口\n\
  \n![image](img/image00353.jpeg)\n\n![image](img/image00193.jpeg)\n\n运行程序时，除非使用几何管理器添加组件，否则组件不会出现在窗口中。\n\
  \n### 按钮响应\n\n`Button` 组件在应用程序窗口中提供了一个图形化按钮，它可以包含文本或图像以传达按钮的作用。通过将窗口名称和选项作为 `Button()`\
  \ 构造函数的参数，可以创建一个按钮对象。每个选项都以 `option=value` 对的形式指定。`command` 选项必须始终指定用户点击该按钮时要调用的函数或方法名称。下面列出了常用的选项及其简要描述：\n\
  \n| **Option:** | **Description:** |\n| **activebackground** | 光标悬停时的背景颜色 |\n| **activeforeground**\
  \ | 光标悬停时的前景颜色 |\n| **bd** | 像素框宽（默认为 2） |\n| **bg** | 背景颜色 |\n| **command** | 点击时调用的函数\
  \ |\n| **fg** | 前景颜色 |\n| **font** | 按钮标签的字体 |\n| **height** | 按钮高度（文本以行为单位，图像以像素为单位）\
  \ |\n| **highlightcolor** | 获得焦点时的框颜色 |\n| **image** | 代替文本显示的图像 |\n| **justify**\
  \ | 多行文本对齐：LEFT、CENTER 或 RIGHT |\n| **padx** | 水平内边距 |\n| **pady** | 垂直内边距 |\n|\
  \ **relief** | 框样式：SUNKEN、RIDGE、RASED 或 GROOVE |\n| **state** | 启用状态：NORMAL 或 DISABLED\
  \ |\n| **underline** | 文本中下划线的字符索引 |\n| **width** | 按钮宽度（文本以字符为单位，图像以像素为单位） |\n\
  | **wraplength** | 换行长度 |\n\n![image](img/image00194.jpeg)\n\n你也可以调用按钮的 `invoke()`\
  \ 方法，转而调用为其 `command` 选项指定的函数。\n\n赋值给其他选项的值决定了组件的外观。可以通过向组件的 `configure()` 方法传递新的\
  \ `option=value` 对来更改它们。此外，通过将选项名称作为字符串参数传递给组件的 `cget()` 方法，可以获取当前的选项值。\n\n![image](img/image00188.jpeg)\n\
  \nbutton.py\n\n![image](img/image00257.jpeg)通过提供 GUI 功能启动新程序，然后创建一个窗口并指定标题\n\n```python\n\
  from tkinter import ***\nwindow = Tk()\nwindow.title( ‘Button Example’ )\n```\n\n\
  ![image](img/image00258.jpeg)接下来，创建一个按钮，在被点击时退出程序\n\n```python\nbtn_end = Button(\
  \ window , text = ‘Close’ , command=exit )\n```\n\n![image](img/image00259.jpeg)现在，添加一个函数，当另一个按钮被点击时切换窗口的背景颜色\n\
  \n```python\ndef tog() :\n    if window.cget( ‘bg’ ) == ‘yellow’ :\n        window.configure(\
  \ bg = ‘gray’ )\n    else :\n        window.configure( bg = ‘yellow’ )\n```\n\n\
  ![image](img/image00260.jpeg)然后，创建一个按钮，在点击时调用该函数\n\n```python\nbtn_tog = Button(\
  \ window , text = ‘Switch’ , command=tog )\n```\n\n![image](img/image00261.jpeg)带有位置内边距将按钮添加到窗口\n\
  \n```python\nbtn_end.pack( padx = 150 , pady = 20 )\nbtn_tog.pack( padx = 150 ,\
  \ pady = 20 )\n```\n\n![image](img/image00262.jpeg)最后，添加循环来捕获此窗口的事件\n\n```python\n\
  window.mainloop()\n```\n\n![image](img/image00266.jpeg)保存并运行程序并点击按钮 – 看到窗口背景颜色的变化\n\
  \n![image](img/image00354.jpeg)\n\n![image](img/image00355.jpeg)\n\n![image](img/image00215.jpeg)\n\
  \n`command` 选项仅指定了函数名。在赋值时不要添加尾随括号。\n\n![image](img/image00194.jpeg)\n\n‘gray’ 颜色是默认颜色。\n\
  \n### 显示消息\n\n通过调用 `tkinter.messagebox` 模块中的方法向用户显示消息。这必须单独导入并使用：\n\n| **Method:**\
  \ | **Icon:** | **Buttons:** |\n| :--- | :--- | :--- |\n| `showinfo()` | ![image](img/image0356.jpeg)\
  \ | OK |\n| `showwarning()` | ![image](img/image0357.jpeg) | OK |\n| `showerror()`\
  \ | ![image](img/image0358.jpeg) | OK |\n| `askquestion()` | ![image](img/image0359.jpeg)\
  \ | Yes, No |\n| `askokcancel()` | ![image](img/image0360.jpeg) | OK, Cancel |\n\
  | `askyesno()` | ![image](img/image0359.jpeg) | Yes, No |\n| `askretrycancel()`\
  \ | ![image](img/image0360.jpeg) | Retry, Cancel |\n\n`askyesno()` 方法返回一个值（1 为 Yes，0\
  \ 为 No）。`askokcancel()` 方法返回一个值（1 为 OK，0 为 Cancel）。`askretrycancel()` 方法返回一个值（1\
  \ 为 Retry，0 为 Cancel）。`askquestion()` 方法返回一个值（1 为 Yes，0 为 No）。那些返回值的函数可以通过测试它们来用于条件分支。\n\
  \n```python\nfrom tkinter import ***\nimport tkinter.messagebox as box\n\nwindow\
  \ = Tk()\nwindow.title( ‘Message Box’ )\n\ndef dialog() :\n    var = box.askyesno(\
  \ ‘Message Box’ , ‘Proceed?’ )\n    if var == 1 :\n        box.showinfo( ‘Yes Box’,\
  \ ‘Proceeding...’ )\n    else :\n        box.showwarning( ‘No Box’, ‘Canceling...’\
  \ )\n\nbtn = Button( window , text = ‘Click’ , command=dialog )\nbtn.pack( padx\
  \ = 150 , pady = 50 )\nwindow.mainloop()\n```\n\n[/content]\n\n### 获取条目\n\n`Entry`\
  \ 组件在应用程序中提供了一个单行输入框，程序可以从用户那里获取条目。通过指定父容器名称（如窗口或框架）和选项作为 `Entry()` 构造函数的参数，可以创建一个条目对象。每个选项都以\
  \ `option=value` 对的形式指定。\n\n\n\n\n\n| `highlightcolor` | 聚焦时的边框颜色 |\n| `selectbackground`\
  \ | 选中文本的背景颜色 |\n| `selectforeground` | 选中文本的前景颜色 |\n| `show` | 设置 `show='*'` 时隐藏密码字符\
  \ |\n| `state` | `NORMAL` 或 `DISABLED` 的启用状态 |\n| `width` | 以字母为单位的输入框宽度 |\n\n多个组件可以组在框架（frames）中以获得更好的定位。通过向\
  \ `Frame()` 构造函数指定窗口名称来创建一个框架对象。然后，可以将框架的名称作为第一个参数传递给组件构造函数，以将其标识为该组件的容器。\n\n在实际将组件添加到框架时，你可以使用\
  \ `TOP`、`BOTTOM`、`LEFT` 或 `RIGHT` 常量来指定将它们打包在框架的哪一侧。例如，`entry.pack( side=LEFT )`。\n\
  \n![image](img/image00194.jpeg)\n\n如果你想允许用户输入多行文本，请使用 `Text` 组件而不是 `Entry` 组件。\n\
  \n通常，输入框组件会出现在一个描述用户预期输入类型的标签旁边，或者出现在一个按钮组件旁边，用户可以点击该按钮对其输入的数据执行某些操作，因此在框架中定位是理想的。\n\
  \n程序可以使用该组件的 `get()` 方法获取当前输入到输入框中的数据。\n\n![image](img/image00188.jpeg)\n\nentry.py\n\
  \n![image](img/image00257.jpeg)通过让 GUI 功能和消息框功能以短别名的形式变为可用来启动一个新程序\n\n```python\n\
  from tkinter import ***\nimport tkinter.messagebox as box\n```\n\n![image](img/image00258.jpeg)接下来，创建一个窗口对象并指定标题\n\
  \n```python\nwindow = Tk()\nwindow.title( ‘Entry Example’ )\n```\n\n![image](img/image00259.jpeg)现在，创建一个包含用于输入的输入字段的框架\n\
  \n```python\nframe = Frame( window )\nentry = Entry( frame )\n```\n\n![image](img/image00260.jpeg)然后，添加一个函数来显示当前输入的数据\n\
  \n```python\ndef dialog() :\n    box.showinfo( ‘Greetings’ , ‘Welcome ’ + entry.get()\
  \ )\n```\n\n![image](img/image00261.jpeg)现在，创建一个按钮在点击点击时调用该函数\n\n```python\nbtn\
  \ = Button( frame, text = ‘Enter Name’ , command=dialog )\n```\n\n![image](img/image00262.jpeg)将按钮和输入框添加到框架的指定侧边\n\
  \n```python\nbtn.pack( side = RIGHT , padx = 5 )\nentry.pack( side = LEFT )\nframe.pack(\
  \ padx = 20 , pady = 20 )\n```\n\n![image](img/image00266.jpeg)最后，添加循环来捕获此窗口的事件\n\
  \n```python\nwindow.mainloop()\n```\n\n![image](img/image00362.jpeg)保存文件并运行程序，然后输入你的名字并点击按钮——查看问候消息出现\n\
  \n![image](img/image00363.jpeg)\n\n![image](img/image00364.jpeg)\n\n![image](img/image00194.jpeg)\n\
  \n如果你想显示用户无法编辑的文本，请使用 `Label` 组件而不是 `Entry` 组件。\n\n### 选项列表\n\n`Listbox` 组件提供了应用程序中的项目列表，用户可以从中进行选择。通过指定其父容器的名称（例如窗口或框架名称）并将选项作为\
  \ `Listbox()` 构造函数的参数来创建一个 listbox 对象。下面列出了常用选项及其简要描述：\n\n| 选项: | : |\n| :--- |\
  \ :--- |\n| `bd` | 以像素为单位的边框宽度（默认为 2） |\n| `bg` | 背景颜色 |\n| `fg` | 用于渲染文本的前景颜色 |\n\
  | `font` | 文本字体 |\n| `height` | 列表中的行数（默认为 10） |\n| `selectbackground` | 选中文本的背景颜色\
  \ |\n| `selectmode` | `SINGLE`（默认）或 `MULTIPLE` 选择 |\n| `width` | 以字母为单位的 Listbox\
  \ 宽度（默认为 20） |\n| `yscrollcommand` | 挂载到垂直滚动条 |\n\n![image](img/image00193.jpeg)\n\
