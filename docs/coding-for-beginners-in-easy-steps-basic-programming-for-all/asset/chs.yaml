  # 设计布局\n\n在上一页创建了所有必要的小部件后，你现在可以通过添加参数来指定小部件的位置，从而设计界面布局。水平设计将标志 `Label` 放置在左侧，在其右侧在一行内放置其他六个\
  \ `Label`，并在其下方放置两个 `Button`。grid 布局管理器在行和列中定位小部件，可以轻松地实现这种设计，因为它允许标志 `Label` 跨越包含所有六个其他\
  \ `Label` 的行，同时也跨越包含两个 `Button` 的行。其中一个 `Button` 可以跨越四列，另一个 `Button` 可以跨越两列，排列如下：\n\
