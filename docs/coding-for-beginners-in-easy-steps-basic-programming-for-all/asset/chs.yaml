  \n## 部署应用程序\n\n你用 Python 语言开发的应用程序可以部署在没有安装 Python 解释器的 Windows 系统上。为此，必须将所有程序文件“冻结”到一个包含可执行文件\
  \ (.exe) 的包中，以创建一个简单的 MSI 安装程序。`cx_Freeze` 工具是一组用于冻结 Python 程序的免费脚本和模块，可在 [cx-freeze.sourceforge.net](http://cx-freeze.sourceforge.net)\
  \ 获取。\n\n`cx_Freeze` 工具使用 Python 的“distutils”包，并需要一个设置脚本来描述你的模块分布，以便为你的应用程序封装适当的支持。设置脚本通常命名为\
  \ `setup.py`，主要由调用 `cx_Freeze setup()` 函数组成——以参数对的形式提供信息。这指定了任何构建选项，例如要包含的图像文件或模块，并识别可执行脚本和系统平台类型。例如，本章开发的应用程序的设置脚本必须包含标志文件\
  \ `lotto.gif`，并指定名为 `lotto.py` 的最终代码脚本为可执行脚本。一旦安装了 `cx_Freeze`，就可以从 Windows 命令提示符带有\
  \ `bdist-msi` 参数执行设置脚本——创建一个包含应用程序的 MSI 安装程序。\n\n![image](img/image00194.jpeg)\n\
  \n`cx_Freeze` 工具还可以为 Mac 和 Linux 系统创建可执行文件。 [cx_freeze.readthedocs.org](http://cx_freeze.readthedocs.org)\
  \ 在线了解更多关于 `cx_Freeze` setup 的信息。\n\n![image](img/image00188.jpeg)\n\nsetup.py\n\
  \n![image](img/image00270.jpeg)在 IDLE 中，通过引入 `sys` 模块和 `cx_Freeze` 模块中的项启动脚本。\n\n\
  ```python\nimport sys\nfrom cx_Freeze import setup, Executable\n```\n\n![image](img/image00271.jpeg)接下来，添加语句识别基础平台。\n\
  \n```python\nbase = None\nif sys.platform == ‘win32’ : base = ‘Win32GUI’\n```\n\n\
  ![image](img/image00272.jpeg)现在，添加列出要包含选项的语句。\n\n```python\nopts = { ‘include_files’\
  \ : [ ‘lotto.gif’ ] , ‘includes’ : [ ‘re’ ] }\n```\n\n![image](img/image00273.jpeg)最后，调用\
  \ `setup()` 函数并参数对传递所有信息。\n\n```python\nsetup( name = ‘Lotto’,\nversion = ‘1.0’,\n\
  description = ‘Lottery Number Picker’,\nauthor = ‘Mike McGrath’,\noptions = { ‘build_exe’\
  \ : opts },\nexecutables = [ Executable( ‘lotto.py’, base= base ) ]\n```\n\n![image](img/image00276.jpeg)将设置脚本与应用程序文件放在一起然后运行脚本命令创建\
