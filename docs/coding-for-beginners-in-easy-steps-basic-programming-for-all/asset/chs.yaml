  \n\n\n\n\n## 前言\n本书的创作为我 Mike McGrath 提供了一个良好的机会，为没有编程经验的读者编写一份计算机编程入门。虽然这是一本面向初学者的书，但它超越了基础知识，因此在通过简单的程序进行编程后，某些主题可能会更容易理解。所有的示例都使用流行的\
  \ Python 语言演示编程功能，书中的截图展示了执行列出的代码的实际结果。\n\n## 本书规范\n为了清楚每个示例步骤中所列的代码，我采用了 Python\
  \ 代码编辑器提供的相同默认配色方案。Python 语言本身的关键字为橙色，内置函数名为紫色，用户指定的函数名为蓝色，文本字符串为绿色，注释为红色，所有其他代码为黑色，如下所示：\n\
  \n```python\n# 用于显示问候的函数\ndef greet( reader ):\n    print( 'Welcome to Coding for\
  \ Beginners', reader )\n```\n此外，为了识别步骤中描述的每个源代码文件，图标和文件名出现在步骤旁边的边缘处，如下所示：\n\n![image](img/image00188.jpeg)\n\
  `program.py`\n\n## 获取源代码\n为了方便起见，我将书中示例的源代码放在了一个 ZIP 压缩包中。你可以按照以下简单步骤获取压缩包：\n\n\
  ![image](img/image00189.jpeg)访问 [www.ineasysteps.com](http://www.ineasysteps.com)，然后导航到\
  \ Free Resources（免费资源）并选择 Downloads（http://ineasysteps.com/resource-centre/downloads/）部分\n\
  \n![image](img/image00190.jpeg)在列表中找到 Coding for Beginners in easy steps，然后点击 All\
  \ Code Examples（所有示例）链接下载压缩包\n\n![image](img/image00191.jpeg)现在，将压缩包内容解压到计算机上的任意位置\n\
  \n# 1 开始入门\n*欢迎来到令人兴奋且有趣的计算机编程世界！本章描述了如何创建自己的编程环境，并演示了如何你的第一个程序*。\n\n- 编程代码\n- 设置环境\n\
  - 探索 IDLE\n- 获取帮助\n- 保存程序\n- 存储数值\n- 添加注释\n- 命名规则\n- 总结\n\n\n\n\n\n计算机仅仅是一个可以极快速处理一组简单指令的机器。它所处理的指令集被称为“程序”，而这些指令被称为“代码”。\n\
  \n编写计算机程序的人被称为“程序员”或“编码员”。他们的程序让计算机在现代生活的几乎每个领域都变得非常有用：\n\n-   **在手中** – 计算机存在于手机设备中，用于语音、文本和社交媒体通信等任务。\n\
  -   **在家里** – 计算机存在于电视机、游戏机和洗衣机等家用设备中。\n-   **在办公室** – 计算机存在于桌面设备中，用于文字处理、工资发放和图形设计等任务。\n\
  -   **在商店** – 计算机存在于零售设备中，如自动取款机（ATM）和条形扫描器。\n-   **在汽车** – 计算机存在控制设备中，用于发动机管理、防锁刹车和安全等任务。\n\
  -   **在空中** – 计算机存在飞机上用于飞行，并在空中交通控制中心用于安全导航。\n\n![image](img/image00192.jpeg)\n\n\
  事实上，这些只是计算机如何影响我们生活的几个例子。然而，计算机其实非常愚蠢！它们只能从零数到一，而不能独立思考。\n\n计算机是电子组件的集合——统称为“硬件”。为了让计算机运行，必须给它提供一组程序指令——被称为“软件”。\n\
  \n每个计算机程序都必须提供清晰的逐步操作说明，以便计算机可以在无错误的情况下执行，这一点非常重要。因此，编码员必须将要求计算机的任务分解为简单、无歧的步骤。例如，一个将移动机器人从室内移动到户外的程序必须包含让机器人定位门框并绕过任何障碍物的指令。因此，编码员必须始终考虑程序可能会遇到哪些潜在的意外困难。\n\
  \n程序指令必须以计算机能够理解的语言呈现给它。在最基础的层面上，计算机可以理解“机器码”，它通过在内存中移动项目来执行任务。这种晦涩的低级代码极其乏味，因为即使执行一个简单的任务也需要许多行指令。\n\
  \n幸运的是，多年来，已经开发了许多“高级”编程语言，允许编码员以更具人类可读的形式编写指令。这些现代高级程序会通过“编译器”自动翻译成计算机可以理解的机器码。为了成为一名编码员，通常需要学习这些高级语言中的一种：\n\
  \n-   **C** – 一种强大的语言，紧密关联于操作系统。\n-   **C++** – 一种增强型语言，支持面向对象编程（OOP）。\n-   **C#**\
  \ – 由微软开发的现代语言，适用于 .NET 框架。\n-   **Java** – 一种便携语言，可以在任何平台运行。\n-   **Python** –\
  \ 一种动态语言，支持面向对象编程（OOP）。\n\n![image](img/image00193.jpeg)\n\n用解释语言编写的程序可以由解释器运行，而用编译语言编写的程序必须先编译。在这个例子中，Python\
  \ 是这种语言的。\n\n![image](img/image00194.jpeg)\n\nPython 这种语言包含了标准库，并包括图形用户界面（GUI）。\n\
  \n![image](img/image00195.jpeg)\n\nPython 是一个“内置电池”的。\n\n## 设置\n\n![image](img/image00196.jpeg)\n\
  \n在开始编写 Python 程序之前，你需要设置好 Python 环境，通过安装解释器来完成。\n\n![image](img/image00197.jpeg)\n\
  \n从 Python Foundation 免费下载的安装程序适用于 Mac OS 和其他平台。\n\n![image](img/image00198.jpeg)\n\
  \n![image](img/image00199.jpeg)\n\n在 [python.org](https://python.org/downloads)\
  \ 下载安装程序并运行 Next。\n\n![image](img/image00200.jpeg)\n\n接受建议的安装目录，例如 `C:\\`。\n\n![image](img/image00201.jpeg)\n\
  \n点击 Next 按钮，并确保勾选“将 python.exe 添加到 Path”。\n\n![image](img/image00202.jpeg)\n\n\
  点击 Finish 按钮完成安装。\n\n完成后，Python 组被添加到你的开始菜单中。该组最重要的项是 IDLE，它会启动开发环境。\n\n![image](img/image00203.jpeg)\n\
  \n将 Python 添加到系统 Path 允许你在任何目录内调用它。安装后，你可以在命令提示符（Command Prompt）中准确地输入命令 `python\
  \ -V` 来查看解释器返回的版本号。\n\n![image](img/image00204.jpeg)\n\n你会经常使用 IDLE 启动器，因此右键点击其图标并选择“固定到任务栏”，以便从\
  \ Windows 桌面快捷访问。\n\n## 探索 IDLE\n\n安装的 Python 软件包包含了开发环境（IDLE），你可以在其中轻松编写和运行用 Python\
  \ 语言编写程序或代码段。IDLE 为开发提供了两个不同的窗口：\n\n-   Shell 窗口\n-   编辑窗口（Edit Window）\n\n当你启动\
  \ IDLE 时，它会打开一个窗口，包含菜单栏、描述版本的横幅和一个 `>>>` 提示符。这就是 Shell 窗口，你可以在这里通过在提示符输入语句来与解释器交互。\n\
  \n如果解释器理解你的输入，它将给出相应的响应；否则它会报告错误。\n\n你可以通过在交互式提示符输入 Python `print()` 函数语句，并在括号内的引号中包含字符串，让解释器打印出文本字符串。\n\
  \n\n\n\n![image](img/image00195.jpeg)打开一个 IDLE Shell Window，然后在交互式提示符处精确地输入此语句\n\
  \n`print( ‘Hello World!’ )`\n\n![image](img/image00196.jpeg)接下来，按下 Return 键查看解释器的响应\n\
  \n![image](img/image00205.jpeg)\n\n![image](img/image00197.jpeg)现在，在交互式提示符处输入此求和语句\n\
  \n`8 + 4`\n\n![image](img/image00194.jpeg)\n\n语句中的空格会被忽略 – 所以可以不加输入 `8+4`。\n\n![image](img/image00200.jpeg)按下\
  \ Return 查看解释器打印出的结果总和\n\n![image](img/image00206.jpeg)\n\n![image](img/image00202.jpeg)在交互式提示符处输入此无效语句\n\
  \n`8 / 0`\n\n![image](img/image00207.jpeg)按下 Return 查看解释器打印的错误信息\n\n![image](img/image00208.jpeg)\n\
  \n![image](img/image00193.jpeg)\n\nShell Window 主要用于测试代码片段。\n\n## 获取帮助\n\nIDLE Shell\
  \ Window 提供了一个极强大的帮助工具，在编写 Python 程序时，可以在其中找到任何 Python 主题的帮助。可以通过交互式 `>>>` 提示符处输入\
  \ Python `help()` 语句来寻求帮助。会出现一条欢迎消息，提示符会变为 `help>`，表示你现在正处于帮助模式。\n\n![image](img/image00195.jpeg)打开一个\
  \ IDLE Shell Window，然后在交互式提示符处精确地输入此语句\n\n`help( )`\n\n![image](img/image00196.jpeg)接下来，按下\
  \ Return 键进入帮助模式\n\n![image](img/image00209.jpeg)\n\n![image](img/image00197.jpeg)现在，在帮助工具的提示符关键字处输入此主题名称\n\
  \n![image](img/image00200.jpeg)按下 Return 列出 Python 语言的所有关键字\n\n![image](img/image00210.jpeg)\n\
  \n![image](img/image00194.jpeg)\n\n帮助工具的欢迎消息还包含实用的提示 – 但为了简洁，此处省略了。\n\n![image](img/image00193.jpeg)\n\
  \n关键字是编程语言的词汇。注意 Python 关键字是区分大小写的 – 除了 `False`、`None` 和 `True` 之外，这些均为小写。\n\n![image](img/image00202.jpeg)然后，在帮助工具提示符处输入此命令\
  \ `quit`\n\n![image](img/image00207.jpeg)按下 Return 退出帮助并返回交互式 Shell Window 提示符\n\
  \n![image](img/image00211.jpeg)\n\n![image](img/00193.jpeg)\n\n`quit` 指令不需要括号 –\
  \ 这里它是帮助工具命令，而不是 Python 语句。\n\n当你只需要某个特定主题的帮助时，只需在交互式提示符的 `help()` 语句的括号内用引号输入主题名称：\n\
  \n![image](img/image00212.jpeg)在交互式提示符处精确地输入此语句\n\n`help( ‘keywords’ )`\n\n![image](img/image00213.jpeg)按下\
  \ Return 列出 Python 语言的所有关键字并保持在交互式 Shell Window 提示符处\n\n![image](img/image00214.jpeg)\n\
  \n![image](img/image00215.jpeg)\n\n关键字在编程语言中具有特殊含义 – 不能用于命名代码中的项目。\n\n## 保存程序\n\n\
  上一页描述的 IDLE Shell Window 是尝试代码片段的好地方，但它无法保存你的代码。幸运的是，IDLE 还提供了 Edit Window，你可以在其中创建较长的程序代码，并将其存储在计算机的\
  \ (.py) 文件中。这意味着你可以轻松地重新运行代码，而无需在 Shell Window `>>>` 提示符处重新输入所有指令，并允许编辑代码以尝试新想法。创建、保存和运行代码的步骤如下：\n\
  \n*   从 Shell Window 菜单项中选择 `File`、`New File` 打开 Edit Window – 或按下快捷键 `Ctrl + N`\n\
  *   在 Edit Window 中输入代码，然后通过选择 Edit Window 菜单项中的 `File`、`Save` 来保存 – 或按下快捷键 `Ctrl\
  \ + S`\n*   通过选择 Edit Window 菜单项中的 `Run`、`Run Module` 运行保存的代码 – 或按下快捷键 `F5`\n\n\
  ![image](img/image00194.jpeg)\n\n此处描述的步骤将用于演示书中提供的所有代码示例。\n\n程序代码的输出将在程序运行时显示在 Shell\
  \ Window 中，如果解释器发现你的代码中存在错误，那里会显示一条有用的错误信息。\n\n![image](img/image00195.jpeg)打开一个\
  \ IDLE Shell Window，然后选择 `File`、`New File` 菜单项打开 IDLE Edit Window\n\n![image](img/image00216.jpeg)\n\
  \n![image](img/image00194.jpeg)\n\n注意 `File`、`Open` 和 `File`、`Recent Files` 菜单项，可以使用它们重新运行之前保存的程序代码。\n\
  \n![image](img/image00188.jpeg)\n\n`helloworld.py`\n\n![image](img/image00196.jpeg)现在，在\
  \ IDLE Edit Window 中，精确地输入此代码\n\n`print( ‘Hello World!’ )`\n\n![image](img/image00217.jpeg)\n\
  \n![image](img/image00197.jpeg)接下来，在 IDLE Edit Window 中，选择 `File`、`Save` 菜单项打开另存为对话框，然后将程序代码保存为名为\
  \ `helloworld.py` 的文件\n\n![image](img/image00218.jpeg)\n\n![image](img/image00200.jpeg)最后，在\
  \ IDLE Edit Window 中，选择 `Run`、`Run Module` 菜单项来运行你的程序代码，并看到输出显示在 Shell Window 中\n\
  \n![image](img/image00219.jpeg)\n\n![image](img/image00220.jpeg)\n\n![image](img/image00194.jpeg)\n\
  \n你的程序代码可以保存在计算机上任何方便的位置 – 这里它被保存在 `C:\\MyCode` 创建的目录中，该目录将用于所有的示例。\n\n![image](img/image00194.jpeg)\n\
  \n注意 Shell Window 在运行程序代码时会重启。\n\n## 存储值\n\n所有编程语言的一项基本功能都是存储数据值。这种功能由称为“变量”的简单数据结构提供。变量是一个容器，可以在其中存储数据，就像现实对象可以存储在盒子里。创建变量时，你给它一个名称（遵循编程语言的命名规范），就像盒子上的标签。存储在变量中的数据可以通过其名称检索，就像你通过标签找到盒子中的现实对象一样。\n\
  \n![image](img/image00221.jpeg)\n\n存储在变量中的数据通过 Python 赋值语句进行赋值赋值。例如，为名为 `a` 的变量存储数值\
  \ 8：\n\n`a = 8`\n\n随后可以使用变量名检索存储的值，因此 `print( a )` 语句将输出存储的值。该变量随后可以分配不同的值，因此其值随程序运行而变化\
  \ – 这就是“变量”一词的由来。\n\n在 Python 编程中，必须在声明语句中初始化变量 – 否则解释器将报告“未定义”错误。\n\n可以使用一系列 `=`\
  \ 赋值在单个语句中初始化多个变量。例如，将名为 `a`、`b` 和 `c` 的变量都初始化为数值 8：\n\n`a = b = c = 8`\n\n\n\n\n\
  \n![image](img/image00195.jpeg)打开 IDLE 编辑窗口，然后输入代码创建一个名为 `var` 的变量来存储一个整数。\n\n```python\n\
  var = 8\n```\n\n![image](img/image00196.jpeg)接下来，添加一条语句来显示存储的整数值。\n\n```python\n\
  print( var )\n```\n\n![image](img/image00197.jpeg)为变量赋值一个新的浮点数，然后添加一条语句显示存储的浮点数值。\n\
  \n```python\nvar = 3.142\nprint( var )\n```\n\n![image](img/image00200.jpeg)现在，为变量赋值一个文本字符串，然后添加一条语句显示存储的字符串值。\n\
  \n```python\nvar = ‘Coding for Beginners in easy steps’\nprint( var )\n```\n\n![image](img/image00202.jpeg)最后，为变量赋值一个逻辑真值，然后添加一条语句显示存储的布尔值。\n\
  \n```python\nvar = True\nprint( var )\n```\n\n![image](img/image00202.jpeg)保存文件（File,\
  \ Save）然后运行程序（Run, Run Module），以在输出中显示存储的值。\n\n![image](img/image00222.jpeg)\n\n\
  ![image](img/image00193.jpeg)\n\n文本字符串数据必须包含在引号内表示该特定字符串的开始和结束。\n\n### 添加注释\n\n\
  当你开始编写较程序时，在每段代码的开头添加注释来描述该代码的作用非常有用。这使得他人更容易理解代码，也让你自己在日后重新查看代码时更容易理解。在 Python\
  \ 编程语言中，单行中 `#` 哈希字符之后的所有内容都会被解释器忽略。这意味着可以在 `#` 字符之后插入单行注释。\n\n![image](img/image00188.jpeg)\n\
  \ncomment.py\n\n![image](img/image00195.jpeg)打开 IDLE 编辑窗口，然后输入带注释的代码来初始化变量并显示其状态。\n\
  \n```python\n# 初始化程序状态\nrunning = True\nprint( ‘Run state: ‘ , running )\n```\n\n\
  ![image](img/image00196.jpeg)保存文件并运行程序，以看到注释被忽略并在输出中显示存储的值。\n\n![image](img/image00223.jpeg)\n\
  \n为了方便识别代码的各个部分，IDLE 会自动在 Shell 窗口和编辑窗口中对代码进行着色，使用下表列出的默认颜色：\n\n![image](img/image00224.jpeg)\n\
  \n![image](img/image00193.jpeg)\n\n书中步骤中列出的代码也使用了默认的 IDLE 颜色以保持一致性。\n\n### 命名规则\n\
  \n| 关键字: | | | |\n| :--- | :--- | :--- |\n| **False** | **None** | **True** |\n\
  | **and** | **as** | **assert** |\n| **break** | **class** | **continue** |\n| **def**\
  \ | **del** | **elif** |\n| **else** | **except** | **finally** |\n| **for** | **from**\
  \ | **global** |\n| **if** | **import** | **in** |\n| **is** | **lambda** | **nonlocal**\
  \ |\n| **not** | **or** | **pass** |\n| **raise** | **return** | **try** |\n| **while**\
  \ | **with** | **yield** |\n\n![image](img/image00194.jpeg)\n\n选择反映变量内容本质的有意义名称是良好的编程习惯。\n\
  \n你在代码中创建的用于在程序中存储数据的变量容器可以使用你选择的任何名称——只要你不使用任何编程语言的关键字（例如上表中的 Python 关键字），并且名称符合下表列出的命名规则：\n\
  \n| 命名规则: | 示例: |\n| :--- | :--- |\n| 不可以包含任何关键字 | `True` |\n| 不可以包含算术运算符 | `a+b*c`\
  \ |\n| 不可以包含符号 | `%$#@! ` |\n| 不可以包含任何空格 | `no spaces` |\n| 不可以以数字开头 | `2bad` |\n\
  | 可以在其他地方包含数字 | `good1` |\n| 可以包含大小写混合字母 | `UPdown` |\n| 可以包含下划线 | `is_ok` |\n\n\
  ![image](img/image00215.jpeg)\n\n变量名在 Python 中对大小写敏感——因此名为 `VAR`、`Var` 和 `var` 的变量将被视为三个不同的变量。\n\
