  \ `guess.cpp`，而 `-o guessplus.exe` 指定了输出的可执行文件。\n\n## C++ 中的猜数字游戏 – 程序比较\n\n- C++\
  \ 程序通过 `#include` 指令使用库函数，类似于使用 Python 的 `import` 关键字\n- C++ 程序始终有一个 `main()` 函数，该函数在程序运行时会被自动调用\n\
  - C++ 程序中的语句被分组在 `{ }` 大括号内\n- C++ 中的变量不是弱类型（松散类型），因此其数据类型（例如 `int`（整数））必须在声明时定义\n\
  - C++ 中每条语句的末尾必须用 `;` 分号字符表示——制表符和空格无关\n- C++ 程序中的控制结构使用 `if`、`else` 和 `while` 关键字——这与\
  \ Python 程序的用法非常相似\n\n## 编写 C#\n\n书中通过 Python 编程语言描述并演示的编码数据结构和控制结构在 C# 编程语言中同样存在。通过识别与\
  \ Python 代码的相似之处，你通过 Python 编码获得的技能可以迁移到该语言。C# 编程语言由微软为了其 .NET 计划而开发。C# 程序需要在主机上安装通用语言运行时\
  \ (CLR) 以在运行时生成机器码——这一过程被称为“即时”（JIT）编译。\n\n在 Python 代码中此处 和此处 描述的简单猜数字程序可以用类似的 C#\
  \ 等效程序实现。\n\n![image](img/image00188.jpeg)\n\n`guess.cs`\n\n![image](img/image00287.jpeg)通过导入命名空间启动一个新的\
  \ C# 程序，以便可以使用输入输出和随机数函数\n\n```csharp\nusing System;\n```\n\n![image](img/image00288.jpeg)接下来，定义一个类结构将整个游戏代码封装在“Main”函数中\n\
  \n```csharp\nclass Guess\n{\n    static void Main( )\n    {\n        /* 在此处添加语句\
  \ */\n    }\n}\n```\n\n![image](img/image00289.jpeg)现在，添加语句用一个 1-20 范围内的随机数、布尔值\
  \ true 和一个整数初始化变量\n\n```csharp\nRandom generator = new Random();\nint num = generator.Next(1,\
  \ 20 + 1);\nbool flag = true;\nint guess = 0;\n```\n\n![image](img/image00290.jpeg)添加一条语句请求用户输入\n\
  \n```csharp\nConsole.WriteLine(“Guess my number 1-20 : ”);\n```\n\n![image](img/image00291.jpeg)然后，添加一个循环语句将输入读入整数变量，并包含一个条件测试\n\
  \n```csharp\nwhile (flag == true)\n{\n    int.TryParse(Console.ReadLine(), out guess);\n\
  \    /* 在此处添加条件测试 */\n}\n```\n\n![image](img/image00194.jpeg)\n\n此 C# 程序将不接受浮点数猜测，因为\
  \ `int.TryParse()` 函数会智能地识别它们为非整数。\n\n![image](img/image00292.jpeg)最后，在循环内部添加条件测试，然后保存、编译并运行程序\n\
  \n```csharp\nif(guess == 0)\n{\n    Console.Write(“Invalid! Enter only digits 1-20\\\
  n”);\n    break;\n}\nelse if (guess < num)\n{\n    Console.Write(“Too low, try again\
  \ : ”);\n}\nelse if (guess > num)\n{\n    Console.Write(“Too high, try again : ”);\n\
  }\nelse\n{\n    Console.Write(“Correct... My number is ” + num + “\\n”);\n    flag\
  \ = false;\n}\n```\n\n![image](img/image00407.jpeg)\n\n![image](img/image00408.jpeg)\n\
