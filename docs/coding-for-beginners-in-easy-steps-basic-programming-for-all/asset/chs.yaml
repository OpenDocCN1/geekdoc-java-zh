  \ 设置为 `MULTIPLE`，`curselection()` 返回数字元组。\n\n### 单选按钮\n\n`Radiobutton` 组件提供了应用程序中的单项，用户可以进行选择。当多个单选按钮在一起时，用户只能选择组中的一项。在\
