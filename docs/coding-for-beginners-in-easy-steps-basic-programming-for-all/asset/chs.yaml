  \ 控件在应用程序中提供一个用户可以选择的单项内容。当多个复选框一起出现时，用户可以选择一个或多个项目。复选框对象指定一个单独的控制变量对象，根据是否选中或未选中来分配值。可以使用\
  \ `StringVar()` 构造函数创建一个空字符串变量对象，或使用 `IntVar()` 构造函数创建一个空整数变量对象。\n\n通过向 `Checkbutton()`\
  \ 构造函数指定五个参数来创建一个复选框对象：\n\n- 父容器的名称，例如 `frame` 名称\n- 显示标签的文本，以 `text=text` 对的形式出现\n\
  - 控制变量对象，以 `variable=variable` 对的形式出现\n- 选中时赋值的值，以 `onvalue=value` 对的形式出现\n- 未选中时赋值的值，以\
  \ `offvalue=value` 对的形式出现\n\n复选框分配的整数值可以通过其 `get()` 方法从整数变量对象中获取。\n\n![image](img/image00188.jpeg)\n\
  \ncheck.py\n\n![image](img/image00257.jpeg)通过让 GUI 功能和消息框功能作为短别名可用来启动新程序\n\n```python\n\
  from tkinter import *\nimport tkinter.messagebox as box\n```\n\n![image](img/image00258.jpeg)接下来，创建一个窗口对象并指定标题\n\
