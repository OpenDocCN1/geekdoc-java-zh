  \n```python\nvar_1 = IntVar()\nvar_2 = IntVar()\nvar_3 = IntVar()\n```\n\n![image](img/image00261.jpeg)创建三个复选框控件，其值根据是否选中被赋值给整数变量\n\
  \n```python\nbook_1 = Checkbutton( frame , text = ‘HTML5’ ,\nvariable = var_1 ,\
  \ onvalue = 1 , offvalue = 0 )\nbook_2 = Checkbutton( frame , text = ‘CSS3’ ,\n\
  variable = var_2 , onvalue = 1 , offvalue = 0 )\nbook_3 = Checkbutton( frame , text\
  \ = ‘JS’ ,\nvariable = var_3 , onvalue = 1 , offvalue = 0 )\n```\n\n![image](img/image00262.jpeg)接下来，添加一个函数来显示复选框选择\n\
  \n```python\ndef dialog() :\n    s = ‘Your Choice:’\n    if var_1.get() == 1 : s\
