  \ 等于运算符比较两个操作数，如果两者的值相等则返回 `True`，否则将返回 `False` 值。如果两者都是相同的数字，则它们相等；如果两者都是字符，则通过数值比较它们的\
  \ ASCII  值来获得比较结果。\n\n相反，`!=` 不等于运算符在两个操作数不相等时返回 `True`，使用与 `==` 等于运算符相同的规则，否则返回\
  \ `False`。相等和不等于运算符用于测试两个变量的状态，以便根据结果在程序中执行条件分支。\n\n`>` “大于”运算符比较两个操作数，如果第一个的值大于第二个，则返回\
