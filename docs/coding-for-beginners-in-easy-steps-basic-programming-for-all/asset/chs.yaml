  \n## 保存数据\n\n*本章演示了如何创建代码来使用各种类型的数据*\n\n* 存储输入\n* 控制输出\n* 识别类型\n* 转换数据\n* 猜游戏\n\
  * 纠正错误\n* 总结\n\n### 存储输入\n\n存储并替换代码中数据的能力是非常棒的，但这种能力也可以存储用户输入——让你的程序变得交互。\n\n在 Python\
  \ 编程中，内置函数 `input()` 可接受用户输入并将其赋值给变量。可选，此函数可以指定一个字符串（位于引号内）来请求输入。程序将等待用户按下 Return\
  \ 键后将输入赋值给变量并继续执行。\n\n存储的变量值可以通过 `print()` 函数输出，只需在括号内指定变量名。多个也可以以逗号列表的形式指定输出。\n\
  \n![image](img/image00188.jpeg)\n\ninput.py\n\n![image](img/image00225.jpeg)打开 IDLE\
  \ 编辑窗口，然后输入此代码请求用户输入以初始化变量：\n\n```python\nname = input( ‘Please enter your name:\
  \ ‘ own )\n```\n\n![image](img/image00226.jpeg)接下来，添加一条语句输出字符串和变量存储的值。\n\n```python\n\
  print( ‘Hello’ , name )\n```\n\n![image](img/image00227.jpeg)现在，添加语句输出一个字符串，再次输出字符串和变量存储的值。\n\
  \n```python\nprint( ‘Welcome to Coding for Beginners’ )\nprint( ‘Remember to have\
  \ fun’ , name , ‘!’ )\n```\n\n![image](img/image00228.jpeg)保存后运行程序，在请求时输入你的名字并按\
  \ Return，在输出中看到你的名字。\n\n![image](img/image00229.jpeg)\n\n![image](img/image00193.jpeg)\n\
  \n逗号列表中不需要包含空格——解释器会忽略它们，但为了清晰起见在这里显示了。\n\n### 控制输出\n\n正如对面页面示例所示，存储在变量中的值可以重复使用，直到它被新值替换或程序结束。\n\
  \n\n\n\n\n关于此示例的输出，还有两点需要注意。首先，`print()` 函数会在输出后自动添加一个不可见的 `\\n` 换行符——因此，下一个 `print()`\
  \ 函数的输出默认将出现在下方的下一行。其次，当指定逗号分隔的列表进行输出时，`print()` 函数会在每个项目之间自动添加空格。\n\n你可以通过指定行尾为空格而不是默认的\
  \ `\\n` 来覆盖自动换行的行为。你还可以通过使用 `+` 符号“拼接”项目而不是使用逗号，来避免自动间距行为。\n\n![image](img/image00188.jpeg)\n\
  \n```python\nconcat.py\n```\n\n![image](img/image00225.jpeg)打开一个 IDLE 编辑窗口，然后输入以下代码请求用户输入，以此初始化变量\n\
  \n```python\nname = input( ‘Please enter your name: ‘ )\n```\n\n![image](img/image00226.jpeg)接下来，添加一条语句输出一个字符串和变量中存储的值——但末尾不加换行符\n\
  \n```python\nprint( ‘Hello ’ + name , end = ‘ ‘ )\n```\n\n![image](img/image00227.jpeg)现在，添加语句输出一个字符串，然后是一个与变量存储的值拼接的字符串\n\
  \n```python\nprint( ‘Welcome to Coding for Beginners’ )\nprint( ‘Remember to have\
  \ fun ’ + name + ‘!’ )\n```\n\n![image](img/image00228.jpeg)保存并运行程序，在提示时输入你的名字，按回车键查看控制输出\n\
  \n![image](img/image00230.jpeg)\n\n![image](img/image00194.jpeg)\n\n注意字符串已经过编辑，以良好的格式化输出。\n\
  \n## 识别类型\n\n在编写计算机程序时，你可以表示并存储在变量中的四种基本数据类型。虽然 Python 语言中的变量可以存储任意类型的数据，但理解不同的类型是非常，因为你有时需要在代码中将它们从一种类型转换为另一种类型：\n\
  \n| 数据类型: | 描述: | 示例: |\n| :--- | :--- | :--- |\n| `str` | 字符字符串，可以包括字母、数字、空格和符号\
  \ | ‘Daytona 500’ |\n| `int` | 整数，它**不包含**小数部分 | `1000` |\n| `float` | 浮点数，它**有**小数部分\
  \ | `98.6` |\n| `bool` | 布尔逻辑真值，为 True 或 False 二 | `True` |\n\n![image](img/image00215.jpeg)\n\
  \n整数 `int` 数字不应包含任何标点符号——因此将一千代码化为 `1000` 而不是 `1,000`。\n\n字符串仅仅是你可以从计算机键盘输入的任何字符集合，并组合在引号内。如果赋值给变量的值被包含在引号内，变量将识别该值属于\
  \ `str` “类”。\n\n![image](img/image00193.jpeg)\n\n字符串 `str` 值必须始终包含在引号中。\n\n数字是你可以从键盘输入的任何数值，但它们通过是否包含或省略小数点来定义。如果赋值给变量的数值没有小数点，变量将将其识别为属于\
  \ `int` “类”；如果确实有小数点，则识别为属于 `float` 类。\n\n布尔值是一个逻辑真值。变量通过关键字 `True` 和 `False` 识别给它的布尔值为属于\
  \ `bool` “类”，或者该值的值为 `True` 或 `False`。\n\n在 Python 编程中，你可以通过在内置 `type()` 函数的括号内指定变量名称，轻松发现存储在变量中的数据类型。\n\
  \n![image](img/image00188.jpeg)\n\n```python\ntypes.py\n```\n\n![image](img/image00225.jpeg)打开\
  \ IDLE 编辑窗口，通过赋值一个字符串初始化变量，然后显示其值和数据类型\n\n```python\nrace = ‘Daytona 500’\nprint(\
  \ race , ‘is‘ + type( race ) )\n```\n\n![image](img/image00226.jpeg)接下来，通过赋值一个整数初始化变量，然后显示其值和数据类型\n\
  \n```python\nkilo = 1000\nprint( kilo , ‘is‘ + type( kilo ) )\n```\n\n![image](img/image00227.jpeg)现在，通过赋值一个小数初始化变量，然后显示其值和数据类型\n\
  \n```python\ntemp = 98.6\nprint( temp , ‘is‘ + type( temp ) )\n```\n\n![image](img/image00228.jpeg)通过赋值一个真关键字初始化变量，然后显示其值和数据类型\n\
  \n```python\nflag = True\nprint( flag , ‘is‘ + type( flag ) )\n```\n\n![image](img/image00231.jpeg)最后，将最后一个变量值替换为比较的真结果，再次显示其值和数据类型\n\
  \n```python\nflag = 4 > 8\nprint( flag , ‘is‘ + type( flag ) )\n```\n\n![image](img/image00232.jpeg)保存并运行程序，以发现你创建的变量中存储的数据类型\n\
  \n![image](img/image00233.jpeg)\n\n![image](img/image00194.jpeg)\n\n这里的比较检查 4 是否大于\
  \ 8，这显然是不正确的。比较将在下文中完整演示。\n\n## 转换数据\n\n你通常需要在程序中转换数据以执行某些操作——例如算术运算或拼接。算术运算只能对数值类型（如\
  \ `int` 和 `float`）进行，而拼接只能对字符串类型（如 `str`）进行。\n\nPython 提供了几个内置函数，允许你轻松将数据转换为不同的类型。这些函数不会转换原始值，而仅返回其转换后的表示。在编程术语中，这被称为“强制”（cast）操作：\n\
  \n| 函数: | 描述: |\n| :--- | :--- |\n| `int(x)` | 将 `x` 转换为整数 |\n| `float(x)` | 将 `x`\
  \ 转换为浮点数 |\n| `str(x)` | 将 `x` 转换为字符串 |\n\n![image](img/image00193.jpeg)\n\n代码中的值不应包含在引号内——引号内的数字将被视为字符串值！\n\
  \n代码中手动赋值给变量的数值会自动被赋予相应的 `int` 或 `float` 类型。然而，通过 `input()` 函数赋值给变量的值总是被赋予 `str`\
  \ 数据类型——即使它们是数字！这意味着在对其进行算术运算之前，必须将它们转换为相应的数值类型。\n\n相反，代码中手动赋值给变量的数值（自动被赋予 `int`\
  \ 或 `float` 类型）无法拼接到字符串中。这意味着它们必须转换为 `str` 类型以包含字符串中。\n\n在 Python 中，正如许多其他编程语言一样，`+`\
  \ 符号根据上下文具有多个用途。当 `+` 符号用于两个数值之间时，它执行加法（视为“加法运算符”），而当 `+` 符号用于两个字符串之间时，它执行拼接（视为“拼接运算符”）。赋值此类操作结果的变量将自动成为相应的数据类型。\n\
  \n![image](img/image00194.jpeg)\n\n对 `int` 和 `float` 类型进行算术运算会自动强制转换为 `float` 结果。将值转换为\
  \ `float` 类型以便输入小数。\n\n![image](img/image00188.jpeg)\n\n```python\ncast.py\n```\n\
  \n![image](img/image00225.jpeg)打开 IDLE 编辑窗口，通过赋值用户输入初始化两个变量\n\n```python\nnum1=\
  \ input( ‘Please enter a whole number: ‘ )\nnum2= input( ‘Now enter another whole\
  \ number: ’ )\n```\n\n![image](img/image00226.jpeg)接下来，显示每个变量的数据类型，以查看数值实际上是存储为字符串的\n\
  \n```python\nprint( ‘Input is: ‘ , type( num1 ) , type( num2 ) )\n```\n\n\n\n\n\n\
  ![image](img/image00227.jpeg)现在，使用 `+` 运算符尝试加法，但你会发现结果被拼接为了 `str` 数据类型。\n\n```\n\
  total = num1 + num2\n```\n\n```\nprint( ‘Total:‘ , total , type( total ) )\n```\n\
  \n![image](img/image00228.jpeg)再次使用 `+` 运算符尝试加法，但对存储的值进行类型转换，以查看结果为 `int` 数据类型。\n\
  \n```\ntotal = int( num1 ) + int( num2 )\n```\n\n```\nprint( ‘Total:‘ , total ,\
  \ type( total ) )\n```\n\n![image](img/image00231.jpeg)最后，将存储的值转换为 `float` 数据类型，并将浮点结果值拼接到输出的\
  \ `str` 字符串中。\n\n```\ntotal = float( num1 ) + float( num2 )\n```\n\n```\nprint(\
  \ ‘Total: ‘ + str( total ) , type( total ) )\n```\n\n![image](img/image00232.jpeg)保存并运行程序，查看通过内置函数进行转换后存储的数据类型。\n\
  \n![image](img/image00234.jpeg)\n\n![image](img/image00215.jpeg)\n\n如果你忘记转换为正确的数据类型，解释器将报告错误——尝试将一个\
  \ `int` 加到一个 `str` 数据类型上以查看错误信息。\n\n## 猜数字游戏\n\n之前的简单示例说明了如何在程序中使用变量来存储文本字符串值、数值整数和浮点小数值以及布尔真值值。现在，它们可以被用来创建一个“猜数字游戏”程序：通过存储一个随机生成的整数（用户需要猜中它的值）、一个在用户猜对时结束游戏的布尔真值值，以及一个包含用户猜词结果的字符串。\n\
  \n此示例中的代码包含了一些在本书后面才会演示的功能，但由于 Python 是一门易于人类的编程语言，你应该能够原理上理解这个程序是如何工作的。\n\n![image](img/image00188.jpeg)\n\
  \n`guess.py`\n\n![image](img/image00225.jpeg)打开 IDLE 编辑窗口，通过导入一个提供随机数生成器函数的“random”库类来开始程序。\n\
  \n```\nimport random\n```\n\n![image](img/image00226.jpeg)现在初始化三个变量——一个 1 到 20 之间的随机数、一个只要游戏进行就保持为\
  \ True 的布尔值，以及一个稍后存储用户输入的数字的值。\n\n```\nnum = random.randint( 1 , 20 )\nflag = True\n\
  guess = 0\n```\n\n![image](img/image00227.jpeg)接下来，显示一条消息让用户进行猜想。\n\n```\nprint(\
  \ ‘Guess my number 1-20 : ‘ end = ‘ ‘ )\n```\n\n![image](img/image00228.jpeg)然后，精确复制这段代码，它将存储的用户猜词与存储的随机数进行比较。\n\
  \n```python\nwhile flag == True :\n    guess = input( )\n    if not guess.isdigit()\
  \ :\n        print( ‘Invalid! Enter only digits 1-20‘ )\n        break\n    elif\
