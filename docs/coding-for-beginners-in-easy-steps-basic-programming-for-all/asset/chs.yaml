  \n| **运算符：** | **操作：** |\n| :--- | :--- |\n| `and` | 逻辑与 |\n| `or` | 逻辑或 |\n| `not`\
  \ | 逻辑非 |\n\n逻辑运算符用于具有布尔值 `True` 或 `False` 的操作数，或者转换为 `True` 或 `False` 的值。\n\n（逻辑与）`and`\
  \ 运算符评估两个操作数，只有当两个操作数本身为 `True`时才返回 `True`。否则 `and` 运算符将返回 `False`。这在编程中用于执行“条件分支”，即程序的方向通过测试两个条件来决定\
  \ – 如果两个条件都满足，程序将进入某个方向，否则将进入另一个方向。\n\n与需要两个操作数都为 `True` 的 `and` 运算符不同，逻辑或）`or`\
  \ 运算符评估它的两个操作数，如果其中任一操作数本身返回 `True`，则返回 `True`。如果两个操作数都不返回 `True`，则返回 `False`。相等和不等于运算符用于测试两个变量的状态，以便根据结果在程序中执行分支。\n\
  \n`>` “大于”运算符比较两个操作数，如果第一个的值大于第二个，则返回 `True`；如果它的值等于或小于第二个，则返回 `False`。`<` “小于”运算符进行相同的比较，但如果第一个操作数的值小于第二个的，则返回\
  \ `True`，否则返回 `False`。`>` “大于”或 `<` “小于”运算符常用于测试循环中计数器的值。\n\n在 `>` “大于”或 `<` “小于”运算符后添加\
  \ `=` 运算符可以使其两个操作数的值完全相等时也返回 `True`。\n\n![image](img/image00194.jpeg)\n\nA-Z 大写字母的\
  \ ASCII 值为 65-90，a-z 小写字母的 ASCII 值为 97-122。\n\n![image](img/image00188.jpeg)\n\n\
  （逻辑与）`and` 运算符评估两个操作数，只有当两个操作数本身为 `True`时才返回 `True`。否则 `and` 运算符将返回 `False`。这在编程中用于执行“条件分支”，即程序的方向通过测试两个条件来决定\
  \ – 如果两个条件都满足，程序将进入某个方向，否则将进入另一个方向。\n\n与需要两个操作数都为 `True` 的 `and` 运算符不同，逻辑或）`or`\
  \ 运算符评估它的两个操作数，如果其中任一操作数本身返回 `True`，则返回 `True`。如果两个操作数都不返回 `True`，则返回 `False`。\n\
  \n（逻辑非）`not` 运算符是一个一元运算符，用于单个操作数。它返回给定操作数的反转值，如果操作数值为 `True`，则返回 `False`。`not` 运算符用于在编程中取反变量的值。\n\
