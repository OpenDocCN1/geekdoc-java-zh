  \ widgets）\n• 在设计程序界面时，`grid()` 布局管理器将组件按行和列进行定位\n• 静态属性在程序执行期间不会改变\n• 动态属性在程序执行期间会改变，通过运行时功能来响应用户操作\n\
  • 完成后，应对程序进行测试以确保其在各个方面都符合预期\n• 程序文件可以被“冻结”成一个包分发到没有安装 Python 解释器的计算机上\n• `cx_Freeze`\
  \ 工具使用 Python 的“disutils”包将程序冻结为适用于 Windows、Mac 或 Linux 的可执行文件\n• 设置脚本描述了你的模块发行，因此\
  \ `cx_Freeze` 将为应用程序封装适当的支持\n• 传统上，设置脚本命名为 `setup.py`，主要由对 `cx_Freeze setup()` 函数的调用组成\n\
  • 可以 `cx_Freeze` 工具在 Windows 系统上部署应用程序以创建一个简单的安装程序\n•当使用 `bdist_msi` 命令执行设置脚本时，会创建一个\
  \ MSI 安装程序，它会将分发包复制到主机计算机，其中包含一个执行文件\n\n## 技能迁移\n\n*本章演示了编写各种流行编程语言代码时的相似之处和差异*。\n\
  \n- 理解编译器\n- 编译代码\n- 编写 C 语言\n- 编写 C++ 语言\n- 编写 C# 语言\n- 编写 Java 语言\n- 总结\n\n##\
  \ 理解编译器\n\n现代应用使用“高层”语言编写，这些语言在计算机理解的机器码和人类可读的源代码之间提供了高层次的抽象。为了运行程序，源代码必须先渲染成计算机可以执行的机器码。这一过程取决于程序编写的语言，通过“解释器”或“编译器”完成。\n\
  \nPython 编程语言在书中前面的章节中一直用于演示，它使用解释器来翻译程序源代码。随着程序的进行，解释器动态地将其函数和语句代码对象翻译成“字节码”（bytecode）。然后，可以通过\
  \ Python 的字节码解释器（又称为“虚拟机”或“VM”）执行这些字节码。\n\n![image](img/image00194.jpeg)\n\n通常，使用解释器的语言被称为“解释型语言”，而使用编译器的语言被称为“编译型语言”。\n\
  \n其他使用解释器将源代码翻译成字节码并通过虚拟机由计算机执行的编程语言包括 Java 和 Ruby。\n\n![image](img/image00398.jpeg)\n\
  \n传统的编程语言（如 C 语言）使用编译器将程序源代码转换为机器码。编译获取整个源代码，并首先生成中间“目标代码”（object code），它以二进制机器码格式表示程序的函数和语句。然后，编译器将目标代码合并成单一二进制机器码文件（`.exe`），该文件可计算机直接执行。\n\
  \n![image](img/image00193.jpeg)\n\n注意，为了执行用解释型语言编写的程序，用户的计算机上必须存在虚拟机（VM）。\n\n其他使用编译器将源代码转换为机器码供计算机直接执行的编程语言包括\
  \ C++（“C 加加”）和 C#（“C 锐”）。\n\n![image](img/image00399.jpeg)\n\n因此，计算机执行“解释型语言”（如\
  \ Python）和“编译型语言”（如 C 语言）编写的程序的方式存在根本性差异。它们在性能和可移植性方面各有优缺点，如下表所示：\n\n| 解释器: | 编译器:\
  \ |\n| :--- | :--- |\n| 以单个代码对象作为输入进行*翻译* | 以整个源代码作为输入进行*转换* |\n| *不*生成中间目标代码 |\
  \ *会*生成中间目标代码 |\n| 执行条件控制语句速度*慢* | 执行条件控制语句*快* |\n| 需要*较少*内存，因为不生成目标代码 | 需要*更多*内存，因为生成了目标代码\
  \ |\n| 程序*每次*运行时都翻译源代码 | 在编译期间*转换一次*源代码 |\n| 当语句中出现任何错误时*立即*报告 | 仅在尝试编译整个源代码*后*报告任何错误\
  \ |\n| 代码对象逐个翻译为机器码时，程序运行*较慢* | 机器码直接在计算机上运行时运行时，程序运行*较快* |\n| 分发的程序是人类可读的源代码，因此*容易*修改\
  \ | 分发的程序是编译机器码，因此*难以*修改 |\n| 对知识产权的保护*较弱* | 程序运行*较快*，因为机器码直接在计算机上运行 |\n\n![image](img/image00215.jpeg)\n\
  \n不要被 Java 程序所困扰。它们被“编译”成可分发的字节码文件（`.class`），但仍然需要 Java VM 解释器。\n\n## 编译代码\n\n为了更完整地理解编译过程，详细检查\
  \ C 语言程序的编译是有用的。从原始 C 源文件生成可执行文件，编译过程实际上经历了四个独立阶段，每个阶段生成一个新文件：\n\n- 预处理：预处理阶段首先将所有预处理器指令（如导入库的语句）替换为实际库代码。例如，在\
  \ C 语言中，用库代码替换 `#include` 导入指令。包含替换的文件为文本格式，通常扩展名为 `.i`。\n- 翻译：编译器阶段将 `.i` 文件中的高层指令翻译成汇编语言指令。包含翻译的文件为文本格式，通常扩展名为\
  \ `.s`。\n- **汇编**：汇编阶段将 `.s` 文件中的汇编语言文本指令转换为机器码。包含转换的目标文件为二进制格式，通常扩展名为 `.o`。\n-\
  \ **链接**：链接阶段将一个或多个二进制目标文件 `.o` 合并成单一的可执行文件。生成的文件为二进制格式，通常扩展名为 `.exe`。\n\n![image](img/image00400.jpeg)\n\
  \n严格来说，“编译”描述的是上述三个阶段，它们作用于单一源代码文本文件，并最终生成单一的二进制目标文件。如果程序源代码包含语法错误（例如缺少语句终止符或缺少括号），编译器将报告这些错误且编译将失败。\n\
  \n\n\n\n另一方面，链接器可以对多个对象文件进行操作，并最终生成单个可执行文件。这允许从模块化的对象文件创建大型程序，每个对象文件可能包含可重用的函数。当链接器在多个对象文件中找到同名的函数时，它将报告错误且不会创建可执行文件。\n\
  \n通常情况下，编译过程中中间阶段创建的临时文件会自动删除，但 GNU C 编译器（`gcc`）在编译器中提供了一个 `-save-temps` 选项，允许将它们保存以便检查。\n\
  \n![image](img/image00287.jpeg)对于 C 语言简单的“Hello World!”程序，输入命令 `gcc hello.c -save-temps\
  \ -o hello.exe` 然后按回车键来编译并保存临时文件。\n\n![image](img/image00401.jpeg)\n\n![image](img/image00288.jpeg)用纯文本编辑器（如\
  \ Windows 记事本）打开 `hello.i` 文件，即可看到源代码出现在文件的末尾——前面是经过替换的库代码。\n\n![image](img/image00289.jpeg)现在，用纯文本编辑器打开\
  \ `hello.s` 文件，查看翻译后的低层汇编代码，并注意它与高层代码相比看起来是多么不友好。\n\n![image](img/image00402.jpeg)\n\
  \n![image](img/image00194.jpeg)\n\n在此处的命令中，`gcc` 调用了编译器，源代码文件是 `hello.c`，而 `-o hello.exe`\
  \ 指定了输出的可执行文件。\n\n![image](img/image00194.jpeg)\n\n上文提供了一个如何在 C 语言中编写代码和编译程序的完整示例。\n\
  \n### C 语言编码\n\n书中通过 Python 编程语言描述并演示的编码数据结构和控制结构在其他语言中也存在。通过识别相似之处，你通过 Python 编码获得的技能可以转移到其他语言，例如\
  \ C 编程语言。C 语言起源于 20 世纪 70 年代，设计为容易编译成低层机器代码。它的效率使其适用于从嵌入式系统到操作系统的广泛应用。\n\n在 Python\
  \ 代码中此处 和此处描述的简单猜数字游戏程序可以在类似的 C 等效程序中重建。\n\n![image](img/image00188.jpeg)\n```c\n\
  guess.c\n```\n\n![image](img/image00287.jpeg)通过导入库来使输入输出、随机数时间和函数可用，从而开始一个新的 C 程序。\n\
  \n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <time.h>\n```\n\n![image](img/image00288.jpeg)接下来，定义一个\
  \ `main()` 函数体，它将包含整个游戏代码并在完成后返回零值。\n\n```c\nint main() {\n    /* 在此处添加语句 */\n \
  \   return 0;\n}\n```\n\n![image](img/image00289.jpeg)现在，添加语句将变量初始化为 1-20 范围内的随机数、一个布尔真和一个整数。\n\
  \n```c\nsrand(time(NULL));\nint num = (rand() % 20) + 1;\nint flag = 1;\nint guess\
  \ = 0;\n```\n\n![image](img/image00290.jpeg)添加语句请求用户输入。\n\n```c\nprintf(\"Guess\
  \ my number 1-20 : \");\n```\n\n![image](img/image00291.jpeg)然后，添加一个循环语句，将输入读入整数变量并包含一个条件测试。\n\
  \n```c\nwhile (flag == 1) {\n    scanf(\"%d\", &guess);\n    fflush(stdin);\n  \
  \  /* 在此处添加条件测试 */\n}\n```\n\n![image](img/image00215.jpeg)此 C 程序将接受浮点猜测，因为它们的值在赋值给\
  \ `guess` 变量时会被截断为整数。\n\n![image](img/image00292.jpeg)最后，在循环内部添加条件测试，然后保存、编译并运行程序。\n\
  \n```c\nif(guess == 0) {\n    printf(\"Invalid! Enter only digits 1-20\\n\");\n\
  \    break;\n}\nelse if (guess < num) {\n    printf(\"Too low, try again : \");\n\
  }\nelse if (guess > num) {\n    printf(\"Too high, try again : \");\n}\nelse {\n\
  \    printf(\"Correct... My number is %d \\n\", num);\n    flag = 0;\n}\n```\n\n\
  ![image](img/image00403.jpeg)\n\n![image](img/image00404.jpeg)\n\nGNU C 编译器（`gcc`）被广泛使用，并作为\
  \ `sourceforge.net/projects/mingw` Minimalist GNU for Windows (MinGW) 包的一部分免费提供。有关安装说明和其他帮助，请参考\
  \ `mingw.org/wiki` 的文档。\n\n### C 语言猜数字游戏 – 程序比较\n\n- 库函数通过 `#include` 指令在 C 程序可用，类似于使用\
  \ Python 的 `import` 关键字。\n- C 程序始终有一个 `main()` 函数，每当程序运行时它都会被自动调用。\n- C 程序中的语句被分组在\
  \ `{ }` 大括号内。\n- C 中的变量不是弱类型的。\n\n### C++ 编码\n\n书中通过 Python 编程语言描述并演示的编码数据结构和控制结构在其他语言中也存在。通过识别相似之处，你通过\
  \ Python 编码获得的技能可以转移到其他语言，例如 C 编程语言。C 语言起源于 20 世纪 70 年代，设计为容易编译成低层机器代码。它的效率使其适用于从嵌入式系统到操作系统的广泛应用。\n\
  \n在 Python 代码中此处和此处描述的简单猜数字游戏程序可以在类似的 C 等效程序中重建。\n\n![image](img/image00188.jpeg)\n\
  ```cpp\nguess.cpp\n```\n\n![image](img/image00287.jpeg)通过导入库使输入输出、随机数时间和函数可用，从而开始一个新的\
