  \ 和 `columnspan` 属性类似于 HTML 表格单元格属性 `rowspan` 和 `colspan`。\n\n![image](img/image00188.jpeg)\n\
  \nlotto(layout).py\n\n编辑上一页开始的程序——首先将包含标志的 `Label` 放置在第一行的第一列，并让它跨越行。\n\n## 几何\n\
