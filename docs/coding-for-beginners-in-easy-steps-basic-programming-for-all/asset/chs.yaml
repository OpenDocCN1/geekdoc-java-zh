  \    if var_3.get() == 1 : s += ‘\\nJavaScript in easy steps’\n    box.showinfo(\
  \ ‘Selection’ , s )\n```\n\n![image](img/image00266.jpeg)现在，创建一个按钮在被点击时调用该函数\n\n\
  ```python\nbtn = Button( frame , text = ‘Choose’ , command = dialog )\n```\n\n![image](img/image00362.jpeg)然后，将推按钮和复选框添加到框架中\n\
  \n```python\nbtn.pack( side = RIGHT , padx = 5 )\nbook_1.pack( side = LEFT )\nbook_2.pack(\
  \ side = LEFT )\nbook_3.pack( side = LEFT )\nframe.pack( padx = 30 , pady = 30 )\n\
  ```\n\n![image](img/image00365.jpeg)最后，添加循环来捕捉此窗口的事件\n\n```python\nwindow.mainloop()\n\
