  \ | 除法 |\n| `%` | 取余 |\n| `//` | 整除 |\n| `**` | 幂 |\n\n`+` 运算符将两个数字相加，`-` 运算符从第一个数字中减去第二个数字。\n\
  \n`*` 运算符将第一个数字乘以第二个数字，`/` 运算符将第一个数字除以第二个数字。\n\n`%` 取余运算符将第一个数字除以第二个数字并返回操作结果的余数。这对于判断一个数是奇数还是偶数很有用。\n\
