  \n# 总结\n\n• `tkinter` 模块可以导入到 Python 程序中，为窗口化应用程序提供属性和方法\n• 每个 `tkinter` 程序必须从调用\
  \ `Tk()` 开始创建一个窗口，并调用其 `mainloop()` 方法来捕捉事件\n• 窗口对象的标题由其 `title()` 方法指定\n• label\
  \ 控件通过指定其父级容器的名称和文本作为 `Label()` 构造函数的参数来创建\n• 使用 `pack()`、`grid()` 或 `place()` 几何管理器将控件添加到应用程序中\n\
  • button 控件通过指定其父级容器的名称、文本以及用户点击时要调用的函数名称作为 `Button()` 构造函数的参数来创建\n• `tkinter.messagebox`\
  \ 模块可以导入到 Python 程序中，为消息框提供属性和方法\n• 要求用户做出选择的消息框将向程序返回一个值，以用于条件分支\n• `Frame()` 构造函数创建一个容器，其中多个控件可以被组合在一起以获得更好的布局\n\
  • `Entry()` 构造函数创建一个单行文本字段，其当前内容可以通过 `get()` 方法检索\n• 通过 `insert()` 方法将项添加到 `Listbox`\
  \ 对象中，并通过指定其索引号到 `get()` 方法进行检索\n• Radiobutton 和 Checkbutton 对象将值存储在由变量属性指定的 `StringVar`\
  \ 或 `IntVar` 对象中\n• `PhotoImage()` 构造函数创建一个图像对象，该对象有一个 `subsample()` 方法，可以缩小图像\n\
  • 图像可以添加到 `Button` 和 `Label` 对象中，嵌入到 `Text` 对象中，并绘制在 `Canvas` 对象上\n\n## 开发应用程序\n\
  \n*本章结合了之前的章节元素来开发一个窗口化应用程序*。\n\n- 生成随机数\n- 规划需求\n- 设计布局\n- 分配静态变量\n- 加载动态数据\n-\
  \ 添加功能\n- 测试程序\n- 部署应用程序\n- 总结\n\n## 生成随机数\n\n在本书后续页面中开发的图形化应用程序将在特定范围内生成六个随机数。最初，它的功能可以开发为控制台应用程序，稍后迁移以说明它如何应用于图形化控件组件。\n\
  \nPython 标准库有一个 `random` 模块，该模块提供了生成伪随机数的方法。每当随机生成器初始化时，默认使用当前系统时间作为“种子” – 这样它就不会重复其选择。\n\
  \n通过调用 `random` 模块中的 `random()` 方法可以生成一个 0.0 到 1.0 之间的伪随机浮点数。生成数的范围可以使用 `*` 运算符修改以指定最大值，并可以使用内置的\
  \ `int()` 函数向下取整为整数。例如，生成一个零到九范围内的整数：\n\n```python\nint( random.random() * 10 )\n\
  ```\n\n或者在 1 到 10 范围内生成一个正整数：\n\n```python\nint( random.random() * 10 ) + 1\n```\n\
  \n![image](img/image00215.jpeg)\n\n通过内置 `int()` 函数从 `float` 数据类型转换为 `int` 数据类型的浮点数会在小数点处被截断。\n\
  \n该语句可以在循环中使用以生成给定范围内的多个随机整数，但输出中的任何数字都可能重复 – 没有保证唯一性。相反，可以通过 `random` 模块中的 `sample()`\
  \ 方法在给定范围内生成多个唯一的随机整数。这需要两个参数，分别指定范围和要返回的唯一整数数量。使用内置的 `range()` 函数指定最大值是方便的。例如，在\
  \ 1 到 9 的范围内生成六个唯一的数字：\n\n```python\nrandom.sample( range( 10 ) , 6 )\n```\n\n或者在\
  \ 1 到 10 的范围内生成六个唯一的数字：\n\n```python\nrandom.sample( range( 1 , 11 ) , 6 )\n```\n\
  \n这种技术可以代表随机彩票，例如在 1 到 49 之间选择六个唯一的数字。\n\n![image](img/image00193.jpeg)\n\n`range()`\
  \ 函数可以指定起始和结束值。如果没有提供起始值，默认假设为零。\n\n![image](img/image00188.jpeg)\n\nsample.py\n\
  \n![image](img/image00270.jpeg)从“random”模块导入两个函数来启动一个新程序\n\n```python\nfrom random\
  \ import random , sample\n```\n\n![image](img/image00271.jpeg)接下来，将一个随机浮点数赋值给变量然后显示其值\n\
  \n```python\nnum = random()\n```\n\n```python\nprint( ‘Random Float 0.0-1.0 : ,\
  \ num )\n```\n\n![image](img/image00272.jpeg)现在，将浮点数相乘转换为整数转换为显示其值\n\n```python\n\
  num = int( num * 10 )\n```\n\n```python\nprint( ‘Random Integer 0 - 9 : , num )\n\
  ```\n\n![image](img/image00273.jpeg)添加一个循环将多个随机整数赋值给列表，然后显示该列表\n\n```python\nnums\
  \ = [] ; i = 0\nwhile i < 6 :\n    nums.append( int( random() * 10 ) + 1 )\n   \
  \ i += 1\n```\n\n```python\nprint( ‘Random Integers 1-10 : , nums )\n```\n\n![image](img/image00276.jpeg)最后，将唯一的随机整数赋值给列表然后显示该列表\n\
  \n```python\nnums = sample( range( 1, 49 ) , 6 )\n```\n\n```python\nprint( ‘Random\
  \ Sample 1 - 49 : , nums )\n```\n\n![image](img/image00277.jpeg)保存文件并运行程序几次 – 查看生成的数字\n\
  \n![image](img/image00375.jpeg)\n\n![image](img/image00194.jpeg)\n\n`random.sample()`\
  \ 函数返回一个列表，但不会替换指定范围内的任何元素。\n\n## 规划需求\n\n在创建新的界面时，先花一些时间规划设计是有用的。明确定义程序的精确目的，决定需要哪些应用程序功能，然后决定需要哪些界面控件。\n\
  \n![image](img/image00376.jpeg)一个彩票投注简单应用程序计划可能如下：\n\n**程序目的**\n\n•程序将在 1-49 范围内生成六个唯一的随机数，并具有重置能力\n\
  \n**所需功能**\n\n•生成并显示六个唯一随机数的函数\n•清除显示的最后六个随机数的函数\n\n**需要的界面控件**\n\n•一个不可调整大小的窗口用于包含所有其他控件并显示应用程序标题。\n\
  •一个 label 控件用于显示静态应用程序图标 – 仅增强界面外观。\n•六个 label 控件用于动态显示生成的唯一随机数序列 – 每个 Label 一个数字。\n\
  •一个 button 控件，用户点击时生成并显示 label 控件中的数字。当数字显示时，该按钮将不会启用。\n•一个 button 控件，用户点击时清除 label\
  \ 控件中显示的数字。当数字未显示时，该按钮将不会启用。\n\n建立了程序计划意味着你现在可以通过创建所有必要的控件来制作应用程序的基础。\n\n\n\n\n\n\
  ![image](img/image0019.jpeg)\n\n通过将 `Button` 小部件的 `state` 属性从 `NORMAL` 切换到 `DISABLED`\
  \ 来引导用户——在这种情况下，在生成进一步的系列随机数之前，必须先重置应用程序。\n\n![image](img/image00188.jpeg)\n\nlotto(widgets).py\n\
  \n![image](img/image00270.jpeg)从 `tkinter` 模块导入所有功能以启动一个新程序。\n\n# 小部件\n\n```python\n\
  from tkinter import *\n```\n\n![image](img/image00271.jpeg)接下来，添加语句创建一个窗口对象和一个图像对象\n\
  \n```python\nwindow = Tk()\nimg = PhotoImage( file =‘lotto.gif’ )\n```\n\n![image](img/image00373.jpeg)\n\
  \nlotto.gif\n\n![image](img/image00272.jpeg)现在，添加语句创建所有必要的小部件\n\n```python\nimgLbl\
  \ = Label( window, image = img )\nlabel1 = Label( window, relief = ‘groove’, width\
  \ = 2 )\nlabel2 = Label( window, relief = ‘groove’, width = 2 )\nlabel3 = Label(\
  \ window, relief = ‘groove’, width = 2 )\nlabel4 = Label( window, relief = ‘groove’,\
  \ width = 2 )\nlabel5 = Label( window, relief = ‘groove’, width = 2 )\nlabel6 =\
  \ Label( window, relief = ‘groove’, width = 2 )\ngetBtn = Button( window )\nresBtn\
  \ = Button( window )\n```\n\n![image](img/image00273.jpeg)然后，使用 grid 布局管理器将小部件添加到窗口中——准备好在接阶段的设计阶段接收参数，以指定小部件的位置。\n\
