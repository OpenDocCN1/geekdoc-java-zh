  \n在 Python 编程中，布尔值也可以用数值表示，其中 `True` 为 `1`，`False` 为 `0`（零）。\n\n![image](img/image00193.jpeg)\n\
  \n注意表达式 `False and False` 返回 `False`，而不是 `True` – 这也许证明了格言“错错不为正”。\n\n### 测试条件\n\
  \n许多编程语言（如 C++ 或 Java）具有 `?:` “三元运算符”，它可以评估一个 True 或 False 条件，然后根据评估结果返回两个值之一。`?:`\
  \ 三元运算符的语法如下：\n\n**( *test-expression* ) ? *if-true-return-this* : *if-false-return-this***\n\
  \n与其他编程语言不同，Python 没有 `?:` 三元运算符，而是使用“条件表达式”，它使用 `if` 和 `else` 关键字以类似的方式工作，语法如下：\n\
  \n***if-true-return-this* if ( *test-expression* ) else *if-false-return-this***\n\
  \n虽然条件表达式语法最初看起来很复杂，但非常值得熟悉，因为它可以用最少的代码执行强大的程序分支。例如，当变量的值不为 1 时进行分支：\n\n***if-true-do-this*\
  \ if ( var != 1 ) else *if-false-do-this***\n\n条件表达式可以用于 Python 编程，将两个变量的最大值或最小值赋值给第三个变量。例如，像这样赋值最小值：\n\
  \n**c = a if ( a < b ) else b**\n\n\n\n\n当变量 `a` 的值小于变量 `b` 的值时，括号中的表达式返回 True——在这种情况下，变量\
  \ `a` 的较小值赋值给变量 `c`。\n\n同样，将测试表达式中的 `<` 小于运算符替换为 `>` 大于运算符，将把变量 `b` 的较大值赋值给变量 `c`。\n\
  \n条件表达式的另一个常见用法是在测试表达式中使用 `%` 取余运算符来判断变量的值是奇数还是偶数：\n\n`if-true(odd)-do-this if (\
  \ var % 2 != 0 ) else if-false(even)-do-this`\n\n其中，如果变量值除以二后有余数，则该数为奇数；如果没有余数，则该数为偶数。测试表达式\
  \ `( var % 2 == 1 )` 具有相同的效果，但最好测试不相等性——发现不同之处比发现它们完全相同更容易。\n\n![image](img/image00194.jpeg)\n\
  \n从通用的编程术语来说来说，“表达式”（expression）总是返回一个值，而“语句”（statement）则不必——但一个语句可以包含一个或多个表达式。\n\
  \n![image](img/image00193.jpeg)\n\n条件表达式实际上有三个操作数——测试表达式和两个可能的返回值。\n\n![image](img/image00188.jpeg)\n\
  \n`condition.py`\n\n![image](img/image00241.jpeg)通过初始化两个整数值变量开始一个新程序，以进行条件评估\n\n\
  `a = 1`\n\n`b = 2`\n\n![image](img/image00242.jpeg)接下来，添加语句显示条件评估的结果——描述第一个变量的值\n\
  \n`print( ‘\\nVariable a Is :’ , ‘One’ if ( a == 1 ) else ‘Not One’ )`\n`print(\
  \ ‘Variable a Is :’ , ‘Even’ if ( a % 2 == 0 ) else ‘Odd’ )`\n\n![image](img/image00243.jpeg)现在，添加语句显示条件评估的结果——描述第二个变量的值\n\
  \n`print( ‘\\nVariable b Is :’ , ‘One’ if ( b == 1 ) else ‘Not One’ )`\n`print(\
  \ ‘Variable b Is :’ , ‘Even’ if ( b % 2 == 0 ) else ‘Odd’ )`\n\n![image](img/image00244.jpeg)然后，添加语句将条件评估的结果赋值给新变量\n\
  \n`top = a if ( a > b ) else b`\n\n![image](img/image00245.jpeg)最后，添加语句显示赋值的结果——识别两个变量值中较大的一个\n\
  \n`print( ‘\\nGreater Value Is:’ , top )`\n\n![image](img/image00246.jpeg)保存并运行此程序——查看条件表达式操作的结果\n\
  \n![image](img/image00253.jpeg)\n\n![image](img/image00215.jpeg)\n\n你可能会发现，一些 Python\
  \ 程序员不喜欢条件表达式，因为他们认为它的语法违反了易于阅读的原则。\n\n### 设置顺序\n\n运算符优先级决定了表达式进行求值的顺序。例如，在表达式 `3\
  \ * 8 + 4` 中，默认优先级决定先完成 `*` 乘法运算符的乘法，因此结果为 28 (24 + 4)。\n\n下表按降序列出了 Python 的运算符优先级——顶行的运算符优先级最高，较低行的优先级依次递减。同一行内运算符的优先级从左到右链式。\n\
  \n| Operator: | Description: |\n| :--- | :--- |\n| `**` | 幂 |\n| `+` | 正数 |\n| `-`\
  \ | 负数 |\n| `~` | 按位取反 |\n| `*` | 乘法 |\n| `/` | 除法 |\n| `//` | 整除 |\n| `%` | 取余\
  \ |\n| `+` | 加法 |\n| `-` | 减法 |\n| `\\|` | 按位或 |\n| `^` | 按位异异 |\n| `&` | 按位与 |\n\
  | `>>` | 按位右移 |\n| `<<` | 按位左移 |\n| `>, >=, <, <=, ==, !=` | 比较 |\n| `= , %= , /=\
  \ , //= , -= , += , *= , **=` | 赋值 |\n| `is , is not` | 标识 |\n| `in , not in` |\
  \ 成员性 |\n| `not` | 逻辑非 |\n| `and` | 逻辑与 |\n| `or` | 逻辑或 |\n\n![image](img/image00193.jpeg)\n\
  \n`*` 乘法运算符位于 `+` 加法运算符的上方——因此在表达式 `3 * 8 + 4` 中，乘法先完成，然后才是加法。\n\n![image](img/image00194.jpeg)\n\
  \n按位运算符用于底层操作，因此在书中被省略。标识和成员运算符稍后介绍，但为了完整性包含在这里。\n\n![image](img/image00188.jpeg)\n\
  \n`order.py`\n\n![image](img/image00241.jpeg)通过初始化三个整数值变量开始一个新程序，以进行优先级比较\n\n`a\
  \ = 2`\n\n`b = 4`\n\n`c = 8`\n\n![image](img/image00242.jpeg)接下来，添加语句显示默认优先级的结果，并强制先加法后乘法\n\
  \n`print( ‘\\nDefault Order:\\t’, a, ‘*’, c,’+’, b, ‘=’, a * c + b )`\n`print( ‘Forced\
  \ Order:\\t’, a, ‘* (‘, c,’+’, b, ‘) =’, a * ( c + b ) )`\n\n![image](img/image00243.jpeg)现在，添加语句显示默认优先级的结果，并强制先减法后除法\n\
  \n`print( ‘\\nDefault Order:\\t’, c, ‘//’, b, ‘-’, a, ‘=’, c // b - a )`\n`print(\
  \ ‘Forced Order:\\t’, c, ‘// (‘, b,’-’, a, ‘) =’, c // ( b - a ) )`\n\n![image](img/image00244.jpeg)最后，添加语句显示默认优先级的结果，并强制先加法后取余运算，以及先加法后幂运算\n\
  \n`print( ‘\\nDefault Order:\\t’, c, ‘%’, a, ‘+’, b, ‘=’, c % a + b )`\n`print(\
  \ ‘Forced Order:\\t’, c, ‘% (‘, a,’+’, b, ‘) =’, c % ( a + b ) )`\n`print( ‘\\nDefault\
  \ Order:\\t’, c, ‘**’, a, ‘+’, b, ‘=’, c ** a + b )`\n`print( ‘Forced Order:\\t’,\
  \ c, ‘** (‘, a,’+’, b, ‘) =’, c ** ( a + b ) )`\n\n\n\n\n\n# 总结\n\n## 编写列表\n\n某些编程语言允许声明变量时不赋初初始值，但在\
  \ Python 编程中，变量必须在声明它的语句中分配初始值（初始化）——否则解释器将报告“未定义”（not defined）错误。\n\n可以使用一系列的 `=`\
  \ 赋值在单条语句中为多个变量初始化相同的值。例如，同时为三个变量分配相同的值：\n\n`a = b = c = 10`\n\n![image](img/image00255.jpeg)\n\
  \n或者，可以使用逗号分隔符在单条语句中使用不同的值初始化多个变量。例如，同时为三个变量分配不同的值：\n\n`a , b , c = 1 , 2 , 3`\n\
  \n与普通变量只能存储单个数据项不同，数组变量可以存储多个数据项。在 Python 中，这些被称为“列表”（list）变量。数据按顺序存储在列表“元素”中，索引从零开始计数。因此，第一个值存储在元素\
  \ 0 中，第二个值存储在元素 1 中，以此此类推。数组列表的创建方式与其他任何变量类似，但通过在方括号内分配逗号分隔的列表来初始化。例如，创建一个名为“nums”的列表：\n\
  \n`nums = [ 0 , 1 , 2 , 3 , 4 , 5 ]`\n\n可以使用列表名后跟包含该元素索引的方括号来引用单个列表元素。这意味着 `nums[1]`\
  \ 引用的是示例中的第二个元素——而不是第一个元素。由于元素编号从零开始，因此第一个元素通过 `nums[0]` 引用。\n\n![image](img/image00256.jpeg)\n\
  \n列表可以有多个索引——以表示多个维度，而不是普通列表的单维度。具有三个或更多索引的多维列表并不常见，但二维列表对于存储如 X,Y 坐标之类的网格信息非常有用。\n\
  \n字符串值值的列表甚至可以被视为多维列表，因为每个字符串本身都是字符列表。因此，每个字符都可以通过其在特定字符串内的索引号被引用。\n\n![image](img/image00188.jpeg)\n\
  \nlist.py\n\n![image](img/image00257.jpeg)通过初始化一个包含三个字符串值元素的列表启动新程序\n\n`quarter\
  \ = [ ‘January’ , ‘February’ , ‘March’ ]`\n\n![image](img/image00258.jpeg)接下来，添加语句单独显示每个列表元素中包含的值\n\
  \n`print( ‘First Month :’ , quarter[0] )`\n`print( ‘Second Month :’ , quarter[1]\
  \ )`\n`print( ‘Third Month :’ , quarter[2] )`\n\n![image](img/image00259.jpeg)添加一条语句创建一个包含两个元素的多维列表，这些元素本身是每个都包含三个整数值的列表\n\
  \n`coords = [ [ 1 , 2 , 3 ] , [ 4 , 5 , 6 ] ]`\n\n![image](img/image00260.jpeg)现在，添加语句显示两个特定内部列表元素中包含的值\n\
  \n`print( ‘\\nTop Left 0,0 :’ , coords[0][0] )`\n`print( ‘Bottom Right 1,2 :’ ,\
  \ coords[1][2] )`\n\n![image](img/image00261.jpeg)最后，添加一条语句只显示字符串值的其中一个字符\n\n`print(\
  \ ‘\\nSecond Month First Letter :’ , quarter[1][0] )`\n\n![image](img/image00262.jpeg)保存并运行程序——看到列表元素值被显示\n\
  \n![image](img/image00263.jpeg)\n\n![image](img/image00194.jpeg)\n\n字符串索引也可以是负数——以便从右侧开始计数，其中\
  \ -1 引用最后一个字母。\n\n![image](img/image00193.jpeg)\n\n本章稍后介绍的循环结构通常用于遍历列表元素。\n\n##\
  \ 修改列表\n\n包含多个数据项的列表变量在 Python 编程中被广泛使用，并有各种函数“方法”，这些方法可以通过“点后缀”的形式附加在列表名后进行操作：\n\
  \n| 列表方法: | : |\n| :--- | :--- |\n| `list.append(x)` | 将项 `x` 添加到列表末尾 |\n| `list.extend(L)`\
  \ | 将列表 `L` 中的所有项添加到列表末尾 |\n| `list.insert(i,x)` | 在索引位置 `i` 处插入项 `x` |\n| `list.remove(x)`\
  \ | 从列表中删除第一个项 `x` |\n| `list.pop(i)` | 删除索引位置 `i` 处的项并返回它 |\n| `list.index(x)`\
  \ | 返回列表中第一个项 `x` 的索引位置 |\n| `list.count(x)` | 返回 `x` 在列表中出现的次数 |\n| `list.sort()`\
  \ | 原地排序所有列表项 |\n| `list.reverse()` | 原地反转所有列表项 |\n\n![image](img/image00194.jpeg)\n\
  \n对于既包含数值又包含字符串值的列表，`sort()` 方法返回先按数字、后按字母顺序排序的列表元素——例如 1,2,3,A,B,C。\n\nPython \
  \ true 还有一个非常有用的 `len(L)` 函数，它返回列表的长度。\n\n\n\n\n普通列表中的值可以随着程序的进行而更改。每个元素都可以使用 `=`\
  \ 赋值运算符分配替换值，以指定列表名称、元素索引数字和替换值。在编程术语中，存储在普通列表中的值是“可变的”（mutable）——它们可以被更改。随着程序的进行，还可以动态地向普通列表中添加元素，或从普通列表中动态删除元素。这意味着，如果你的程序将对元素的值进行更改，那么普通列表是理想的。\n\
  \n如果一个列表只包含常量（这些值在程序运行时永远不会改变），那么创建一个固定列表会更合适。在编程术语中，存储在固定列表中的值是“不可变的”（immutable）——它们不能被更改。随着程序的进行，无法动态地向固定列表中添加元素，或从固定列表中动态删除元素。这意味着，如果你的程序永远不会更改元素的值，那么固定列表是理想的。\n\
  \n![image](img/image00193.jpeg)\n\n与索引编号一样，元组序列中的项是从零开始编号的。\n\n受限制的不可变 Python 列表被称为“元组”（tuple），通过在括号之间按逗号分隔的列表分配值来创建，这一过程被称为“元组包”（tuple\
  \ packing）：\n\n```\ncolors_tuple = ( ‘Red’ , ‘Green’ , ‘Red’ , ‘Blue’, ‘Red’ )\n\
  ```\n\n可以使用元组名称后跟包含该元素索引数字的方括号来引用单个元组元素。有用的是，元组内部存储的所有值都可以分配给单独变量，这一过程被称为“序列解包”（sequence\
  \ unpacking）：\n\n```\na , b , c , d , e = colors_tuple\n```\n\n普通列表方法（如 `sort()`\
  \ 和 `reverse()`）不能用于元组，但可以使用 Python 内置的 `type()` 函数来显示数据类类型，并可以使用内置的 `len()` 函数来返回元组的长度。\n\
  \n![image](img/image00215.jpeg)\n\n解包元组所需的变量数量必须与项的数量相同。\n\n通常，元组用于存储一组不改变的常量集合，例如星期几名称、月份名称，或个人详情（名、姓、出生日期、地址、电话号码等）。\n\
  \n![image](img/image00188.jpeg)\n\n`tuple.py`\n\n![image](img/image00257.jpeg)通过初始化元组启动新程序，然后显示其类类型\n\
  \n```\ndays = ( ‘Mon’ , ‘Tue’ , ‘Wed’ , ‘Thu’ , ‘Fri’ , ‘Sat’ , ‘Sun’ )\nprint(\
  \ ‘days:’ , type( days ) )\n```\n\n![image](img/image00258.jpeg)接下来，显示元组的所有内容、其长度以及存储在第一个元素中的值\n\
  \n```\nprint( ‘Days of the week:’ , days )\nprint( ‘No. of days in week:’ , len(\
  \ days ) )\nprint( ‘Start day of week:’ , days[0] )\n```\n\n![image](img/image00259.jpeg)现在，初始化另一个包含用户个人详情的元组\n\
  \n```\nuser = ( ‘John’ , ‘Doe’ , ‘Paris’ , ‘555-1234’ )\n```\n\n![image](img/image00260.jpeg)然后，显示用户的全名\n\
  \n```\nprint( ‘Name:’ , user[0] , user[1] )\n```\n\n![image](img/image00261.jpeg)最后，显示用户的电话号码\n\
  \n```\nprint( ‘Phone:’ , user[3] )\n```\n\n![image](img/image00262.jpeg)保存并运行此程序——查看元组的值\n\
  \n![image](img/image00265.jpeg)\n\n![image](img/image00194.jpeg)\n\n元组可能包含与其其它元素不为唯一的项。\n\
  \n## 设置列表\n\n普通列表或固定列表元组中的值可以在其元素中重复，但可以创建一个不允许重复的唯一值列表。受限制的 Python 唯一值列表被称为“集合”（set），通过如下所示在大括号（花括号）之间按逗号分隔的列表分配值来创建：\n\
  \n```\nphonetic_set = { ‘Alpha’ , ‘Bravo’ , ‘Charlie’ }\n```\n\n![image](img/image00194.jpeg)\n\
  \n集合中不能包含与其其它元素不为唯一的项。\n\n与普通列表或元组不同，集合中的单个元素无法通过集合名称后跟包含索引数字的方括号来引用。相反，集合拥有强大的方法，可以通过点符号后缀接到集合名称后来进行对值的操作和比较：\n\
  \n| 集合方法: | 描述: |\n| :--- | :--- |\n| `set.add(x)` | 向集合添加项 `x` |\n| `set.update(x,y,z)`\
  \ | 向集合添加多个项 |\n| `set.copy()` | 返回集合的副本 |\n| `set.pop()` | 从集合中删除一个随机项 |\n| `set.discard(i)`\
  \ | 从集合中删除位置 `i` 的项 |\n| `set1.intersection(set2)` | 返回两个集合中都出现的项 |\n| `set1.difference(set2)`\
  \ | 返回在 `set1` 中不在 `set2` 中的项 |\n\n可以使用 Python 内置的 `type()` 函数显示数据类类型，并可以使用内置的 `len()`\
  \ 函数返回集合的长度。此外，可以使用 Python 内置成员运算符 `in` 来查找集合中的值。\n\n![image](img/image00193.jpeg)更多集合方法可以在在线\
  \ [docs.python.org](https://docs.python.org)找到\n\n通常，集合用于存储一组不改变的唯一值，这些值可以使用强大的集合方法进行搜索和比较。虽然不能通过索引访问集合值，但可以使用内置的\
  \ `list()` 函数将集合转换为普通列表。\n\n![image](img/image00188.jpeg)\n\n`set.py`\n\n![image](img/image00257.jpeg)通过初始化具有唯一值的集合启动新程序，然后显示其类类型\n\
  \n```\nparty_goers = { ‘Andrew’ , ‘Barbara’ , ‘Carole’ , ‘David’ }\nprint( ‘party_goers:’\
  \ , type( party_goers ) )\n```\n\n![image](img/image00258.jpeg)接下来，使用语句搜索集合中的指定值\n\
  \n```\nprint( ‘Did David go to the party?’ , ‘David’ in party_goers )\nprint( ‘Did\
  \ Kelly go to the party?’ , ‘Kelly’ in party_goers )\n```\n\n![image](img/image00259.jpeg)现在，初始化另一个具有唯一值的集合\n\
  \n```\nstudents = { ‘Andrew’ , ‘Kelly’ , ‘Lynn’ , ‘David’ }\n```\n\n![image](img/image00260.jpeg)然后，创建一个仅包含之前两个集合中共同值的集合\n\
  \n```\ncommons = party_goers.intersection( students )\n```\n\n![image](img/image00261.jpeg)初始化共同值的普通列表——以便单独访问元素值\n\
  \n```\nparty_students = list( commons )\n```\n\n![image](img/image00262.jpeg)最后，显示所有共同值以及存储在第一个列表元素中的值\n\
  \n```\nprint( ‘Students at the party:’ , party_students )\nprint( ‘First student\
  \ at the party:’ , party_students[0] )\n```\n\n![image](img/image00266.jpeg)保存并运行此程序——查看集合的值\n\
  \n![image](img/image00267.jpeg)\n\n![image](img/image00215.jpeg)\n\n注意 `list()`\
  \ 函数放置元素的顺序可能与它们在集合中出现的顺序不同。\n\n## 元素命名\n\n在 Python 编程中，“字典”是一个数据容器，可以以键值对列表的形式存储多个数据项。与通过索引数字引用的普通列表容器值不同，存储在字典中的值是通过其关联的键引用的。键在字典内是唯一的，通常是字符串名称，但也可以数字。\n\
  \n创建字典只需是将在大括号（花括号）之间按逗号分隔的键值对分配给你选择的名称。字符串通常必须包含在引号内，且键与其关联的值之间必须有一个冒号 `:` 字符。\n\
  \n\n\n通过指定字典名和键值对的键给 `del` 关键字，可以从字典中删除一个键值对。相反，通过给字典名和一个新键赋值值，可以向字典中添加一个键值对。\n\n\
  Python 字典有一个 `keys()` 方法，可以在字典名后加一个点操作符，以返回该字典中所有键的列表（顺序是随机的）。如果你希望键按字母数字顺序排序，只需将语句封装在\
  \ Python `sorted()` 函数的括号内。\n\n可以使用 Python 的 `in` 运算符对字典进行搜索，以检查其是否包含某个特定键，语法为 `key\
  \ in dictionary`。当在指定的字典找到找到键时，搜索将返回布尔值 `True`，否则将返回 `False`。\n\n字典是 Python 编程中提供的最后一种数据容器类型。综之，各种类型如下：\n\
  \n- **Variable**（变量） – 存储单个值\n- **List**（列表） – 在有序索引数组中存储多个值\n- **Tuple**（元组） –\
  \ 在序列中存储多个固定值\n- **Set**（集合） – 在无序集合中存储多个唯一值\n- **Dictionary**（字典） – 存储多个无序的键值对\n\
  \n![image](img/image00194.jpeg)\n\n数据经常以键值对的形式关联——例如，当你提交 Web 表单时，输入字段中输入的文本值通常与该文本字段的名称（键）关联。\n\
  \n![image](img/image00188.jpeg)\n\ndict.py\n\n![image](img/image00257.jpeg)通过初始化字典启动新程序，然后显示其数据类类型和其键值内容\n\
  \n```\ninfo = { ‘name’ : ‘Bob’ , ‘ref’ : ‘Python’ , ‘sys’ : ‘Win’ }\nprint( ‘info:’\
  \ , type( info ) )\nprint( ‘Dictionary:’ , info )\n```\n\n![image](img/image00258.jpeg)接下来，通过其键引用的单个值\n\
  \n```\nprint( ‘\\nReference:’ , info[ ‘ref’ ] )\n```\n\n![image](img/image00259.jpeg)现在，显示字典中的所有键\n\
  \n```\nprint( ‘\\nKeys’ , info.keys() )\n```\n\n![image](img/image00260.jpeg)从字典中删除一个对并添加一个替换对，然后显示新的键值内容\n\
  \n```\ndel info[ ‘name’ ]\ninfo[ ‘user’ ] = ‘Tom’\nprint( ‘\\nDictionary:’ , info\
  \ )\n```\n\n![image](img/image00261.jpeg)最后，搜索字典中的特定键并显示搜索结果\n\n```\nprint( ‘\\\
  nIs There A name Key?:’ ,’name’ in info )\n```\n\n![image](img/image00262.jpeg)保存文件并运行此程序——查看字典的键和值\n\
  \n![image](img/image00268.jpeg)\n\n![image](img/image00215.jpeg)\n\n注意，字符串内部的引号必须由反斜杠转义字符引导——防止字符串过早终止。\n\
  \n# 总结\n\n- 可以使用一系列 `=` 赋值在单个语句中初始化多个变量\n- Python 列表是一个数组变量，可以按从零开始的顺序编号元素中存储多个数据项\n\
  - 存储在列表元素中的数据可以使用列表名后跟 `[]` 方括号中的索引号来引用\n- 列表元素可以有多个索引来表示多个维度，例如 X 和 Y 坐标\n- 列表变量有许多方法，可以在列表名后加点操作符以进行操作\n\
  - `len()` 函数返回指定列表的长度\n- 通过指定列表名和元素索引号给 Python `del` 关键字可以删除单个列表元素\n- Python 元组是一个不可变列表，可以通过“序列解包”将值赋值给单个变量\n\
  - 存储在元组元素中的数据可以使用元组名后跟 `[]` 方括号中的索引号来引用\n- Python 集合是唯一元素的有序集合，其值可以通过其方法进行比较和操作\n\
  - 存储在集合中的数据不能通过其索引号引用\n- 集合变量有方法，可以在列表后加点操作符以进行操作和比较\n- Python 内置成员运算符 `in` 可用于在集合中查找值\n\
  - 使用 `list()` 函数将集合转换为普通列表，以便允许通过索引号引用元素数据\n- Python 字典是一个键值对列表，其中每个键必须是唯一的\n- 存储在字典元素中的数据可以使用字典名后跟其键的\
  \ `[]` 方括号来引用\n\n5\n\n## 控制块\n\n*本章演示如何创建代码来控制程序的执行流*。\n\n- 分支选择\n- 计数循环\n- 循环条件\n\
  - 跳过循环\n- 捕获错误\n- 总结\n\n### 分支选择\n\n与许多编程语言一样，Python `if` 关键字执行基本的条件测试，评估给定表达式的布尔值为\
  \ `True` 或 `False`。这允许程序根据测试结果以不同的方向进行，这被称为“条件分支”。\n\n`if` 关键字必须后跟 `:` 冒号，以及测试成功时执行的语句。语法如下：\n\
  \n```\nif test-expression:\n    statements-to-execute-when-test-expression-is-True\n\
  ```\n\n![image](img/image069.jpeg)\n\n`if: elif: else:` 序列是其他语言中 **switch** 或 **case**\
  \ 语句的 Python 等效实现。\n\n可选，`if` 测试可以通过附加 `else` 关键字提供测试失败时的替代语句。`else` 关键字必须后跟 `:`\
  \ 冒号和缩进语句。\n\n```python\nif test-expression:\n    statements-if-true\nelse:\n  \
  \  statements-if-false\n```\n\n`if` 测试块可以使用 `elif` 关键字（“else if”）后续，提供替代测试成功时执行的语句。这也必须与\
  \ `if` 关键字对齐，后跟 `:` 冒号，并缩进语句。最后可以添加 `else` 关键字来提供测试失败时的替代语句。`if-elif-else` 结构的语法如下：\n\
  \n```python\nif test-expression-1:\n    statements-to-execute-when-test-expression-1-is-True\n\
  elif test-expression-2:\n    statements-to-execute-when-test-expression-2-is-True\n\
  else:\n    statements-to-execute-when-test-expressions-are-False\n```\n\n\n\n\n\n\
  ```python\nif num > 7 and num < 9 :\n    print( ‘Number is 8’ )\n\nif num == 1 or\
  \ num == 3 :\n    print( ‘Number Is 1 or 3’ )\n```\n\n![image](img/image00273.jpeg)保存并运行程序\
  \ – 查看条件分支的运行\n\n![image](img/image00274.jpeg)\n\n![image](img/image00193.jpeg)\n\
  \n用户输入默认作为字符串值读取，因此必须使用 `int()` 强制转换为 `int` 数据类型以便进行算术比较。\n\n![image](img/image00194.jpeg)\n\
  \n`and` 关键字确保只有在两个测试都成功时结果才为 `True`，而 `or` 关键字确保在任一测试成功时结果即为 `True`。\n\n### 计数循环\n\
  \n与其他编程语言一样，Python 的 `for` 关键字遍历 `in` 关键字指定的任何列表中所有的项。在 Python 中，该语句必须以 `:` 冒号结尾，并且在循环每次迭代中执行的语句必须缩进：\n\
  \n```python\nfor each-item in list-name :\n    statements-to-execute-on-each-iteration\n\
  ```\n\n由于字符串仅仅是字符列表，`for in` 语句可以遍历每个字符。同样，`for in` 语句可以遍历列表中的每个元素、元组中的每个项、集合中的每个成员或字典中的每个键。\n\
  \n![image](img/image00275.jpeg)\n\nPython 中的 `for` 循环与 `C` 等其他语言不同，因为它不允许指定步长和结束位置。\n\
  \n`for in` 循环按照它们在序列中出现的顺序对任何列表或字符串的项进行迭代，你不能直接指定迭代次数、停止条件或迭代步长的大小。然而，你可以使用 Python\
  \ 的 `range()` 函数通过在括号内指定一个数值结束值来遍历数字序列。这将生成一个从零开始并持续到但不包含指定结束值的序列。例如，`range(5)`\
  \ 生成 `0,1,2,3,4`。\n\n可选地，你可以在 `range()` 函数的括号内指定起始值和结束值，并用逗号隔开。例如，`range(1,5)` 生成\
  \ `1,2,3,4`。此外，你可以在 `range()` 函数的括号内以逗号分隔列表的形式指定起始值、结束值和步长值。例如，`range(1,14,4)` 生成\
  \ `1,5,9,13`。\n\n你可以在 Python `enumerate()` 函数的括号内指定列表名称，以显示每个元素的索引及其关联的值。\n\n![image](img/image00193.jpeg)\n\
  \n`range()` 函数可以生成递减（倒计时）的序列，也可以生成递增的序列。\n\n当同时遍历多个列表时，可以通过在 Python 的 `zip()` 函数的括号内将列表名称作为逗号隔开的列表，将每个列表中相同索引的元素显示在一起。\n\
  \n在遍历字典时，你可以使用字典的 `items()` 方法显示每个键及其关联的值，并为 `for` 关键字指定两个逗号分隔的变量名 – 一个用于键，另一个用于值。\n\
  \n![image](img/image00188.jpeg)\n\nfor.py\n\n![image](img/image00270.jpeg)通过初始化普通列表、固定元组列表和关联字典列表启动一个新程序\n\
  \n```python\nchars = [ ‘A’ , ‘B’, ‘C’ ]\nfruit = ( ‘Apple’ , ‘Banana’ , ‘Cherry’\
  \ )\ninfo = { ‘name’ : ’Mike’ , ‘ref’ : ’Python’ , ‘sys’ : ’Win’ }\n```\n\n![image](img/image00271.jpeg)接下来，添加语句显示所有列表元素值\n\
  \n```python\nprint( ‘Elements: \\t’ , end = ‘ ‘ )\nfor item in chars :\n    print(\
  \ item , end = ‘ ‘ )\n```\n\n![image](img/image00272.jpeg)现在，添加语句显示所有列表元素值及其对应的索引号\n\
  \n```python\nprint( ‘\\nEnumerated:\\t’ , end = ‘ ‘ )\nfor item in enumerate( chars\
  \ ) :\n    print( item , end = ‘ ‘ )\n```\n\n![image](img/image00273.jpeg)然后，添加语句显示所有列表和元组元素\n\
  \n```python\nprint( ‘\\nZipped: \\t’ , end = ‘ ‘ )\nfor item in zip( chars , fruit\
  \ ) :\n    print( item , end = ‘ ‘ )\n```\n\n![image](img/image00276.jpeg)最后，添加语句显示所有字典键名和关联元素值\n\
  \n```python\nprint( ‘\\nPaired:’ )\nfor key , value in info.items() :\n    print(\
  \ key , ‘=’ , value )\n```\n\n![image](img/image00277.jpeg)保存并运行程序 – 查看循环迭代显示的项\n\
  \n![image](img/image00278.jpeg)\n\n![image](img/image00194.jpeg)\n\n在编程术语中，任何包含可以循环的多个项的内容被称为“可迭代对象”（iterable）。\n\
  \n### 循环条件\n\n`while` 循环是一个只要条件表达式为 `True` 就会重复的代码。`while` 关键字后面跟着测试表达式，然后是 `:`\
  \ 冒号。测试成功时执行的语句随其后并需要缩进。在 Python 编程中，`while` 关键字创建一个循环 – 直到测试表达式变为 `False` 为止，此时循环结束。交互式\
  \ Python 解释器在期待后续代码时会自动等待。\n\n在 Python 中必须遵守代码块的缩进 – 就像这个产生无限循环的示例：\n\n![image](img/image00193.jpeg)\n\
  \n与其他 Python 不同，关键字 `True` 和 `False` 以大写字母开头。\n\n必须遵守代码块的缩进 – 这是一个产生斐波那契数列的示例：\n\
  \n![image](img/image00279.jpeg)\n\n循环可以嵌套（一个在另一个内部），以便在外层循环的每次迭代中完全执行内层循环的所有迭代。可以在每个循环定义之前用起始值初始化“计数器”变量，将其包含在测试表达式中并在每次迭代中递增，直到测试失败。\n\
  \n![image](img/image00194.jpeg)\n\nwhile.py\n\n![image](img/image00270.jpeg)通过初始化计数器变量并在测试表达式中使用该变量启动一个新程序\n\
  \n```python\ni = 1\nwhile i < 4 :\n    print( ‘Outer Loop Iteration:’ , i )\n  \
  \  i += 1\n```\n\n![image](img/image00271.jpeg)现在（仍保持缩进）初始化第二个计数器变量并在测试表达式中使用该变量定义内层循环\n\
  \n```python\n    j = 1\n    while j < 4 :\n        print( ‘\\tInner Loop Iteration:‘\
  \ , j )\n        j += 1\n```\n\n![image](img/image00276.jpeg)内层循环打印的内容相对于外层循环通过\
  \ `\\t` 制表符缩进。`+=` 赋值语句 `i += 1` 只是 `i = i+1` 的简写方式 – 你也可以使用 `*=` `/=` `-=` 简写来为变量赋值值。\n\
  \n\n\n\n\nPython 的 `break` 关键字可以在满足特定条件时提前终止循环。`break` 语句位于循环语句块内部，其前面是一个测试表达式。当测试返回\
  \ `True` 时，循环立即结束，程序继续执行下一个任务。例如，在嵌套的内部循环中，它将进入外层循环的下一次迭代。\n\n![image](img/image00188.jpeg)\n\
  \n`nest.py`\n\n![image](img/image00270.jpeg)开始一个新程序，使用语句创建一个迭代三次的循环。\n\n```python\n\
  for i in range( 1, 4 ) :\n```\n\n![image](img/image00271.jpeg)接下来，添加一个缩进的语句，创建一个“嵌套”的内部循环，该循环也迭代三次。\n\
  \n```python\nfor j in range( 1, 4 ) :\n```\n\n![image](img/image00272.jpeg)现在，在内部循环中添加一个进一步缩进的语句，在内部循环的每次迭代中显示计数器数字（外层循环和内部循环的）。\n\
  \n```python\nprint( ‘Running i=’ + i + ‘ j=’ + j )\n```\n\n![image](img/image00273.jpeg)保存并运行此程序——查看每次循环迭代的计数器值。\n\
  \n![image](img/image00281.jpeg)\n\n![image](img/image00194.jpeg)\n\n将这些嵌套的 `for`\
  \ 循环与此处的 `while` 循环示例进行比较。\n\n![image](img/image00188.jpeg)\n\n`break.py`\n\n![image](img/image00276.jpeg)在内部循环开始处插入\
  \ `break` 语句以跳该循环——然后再次运行程序。\n\n```python\nif i == 2 and j == 1 :\n    print( ‘Breaks\
  \ inner loop at i=2 j=1’ )\n    break\n```\n\n![image](img/image00282.jpeg)\n\n\
  Python 的 `continue` 关键字可以在满足特定条件时跳过循环的单次迭代。`continue` 语句位于循环语句块内部，其前面是一个测试表达式。当测试返回\
  \ `True` 时，该次迭代结束，程序继续执行下一次迭代。\n\n![image](img/image00277.jpeg)现在，在内部循环块开始处插入 `continue`\
  \ 语句以跳过该循环的第一次迭代——再次运行程序。\n\n```python\nif i == 1 and j == 1 :\n    print( ‘Continues\
  \ inner loop at i=1 j=1’ )\n    continue\n```\n\n![image](img/image00283.jpeg)\n\
  \n![image](img/image00193.jpeg)\n\n当外层循环第二次运行它时，`break` 语句会停止内部循环的所有三次迭代。\n\n![image](img/image00188.jpeg)\n\
  \n`continue.py`\n\n![image](img/image00193.jpeg)\n\n当外层循环第一次运行它时，`continue` 语句跳过了内部循环的第一次迭代。\n\
  \n### 错误\n\n程序中可以预测错误的部分（例如处理用户输入的部分）通常可以包含在 `try except` 块中处理“异常错误”。要执行的语句分组在 `try\
  \ :` 块中，异常被传递给随后的 `except :` 块进行处理。可选的是，后面可以跟一个 `finally :` 块，其中包含处理异常后执行的语句。\n\n\
  Python 识别许多内置异常，例如在变量名未找到时发生的 `NameError`，在尝试访问的列表索引时发生的 `IndexError`，以及当内置操作或函数接收不适当的值时发生的\
  \ `ValueError`。\n\n每个异常返回一个描述性消息，可以使用 `as` 关键字将其方便地赋值给变量。然后可以使用它来显示异常发生时的性质。\n\n\
  ![image](img/image00188.jpeg)\n\n`try.py`\n\n![image](img/image00270.jpeg)通过用字符串值初始化变量开始一个新程序。\n\
  \n```python\ntitle = ‘Coding for Beginners In Easy Steps’\n```\n\n![image](img/image00271.jpeg)接下来，添加一个\
  \ `try` 语句块，尝试显示变量值——但指定了错误的名称。\n\n```python\ntry :\n    print( titel )\n```\n\n\
  ![image](img/image00272.jpeg)现在，添加一个 `except` 语句块，在发生 `NameError` 时显示错误消息。\n\n```python\n\
  except NameError as msg :\n    print( msg )\n```\n\n![image](img/image00273.jpeg)保存并运行程序——查看错误是如何处理的。\n\
  \n![image](img/image00284.jpeg)\n\n![image](img/image00194.jpeg)\n\n在某些编程语言中，这种结构被称为\
  \ try-catch 异常处理。\n\n可以通过在 `except` 块中用括号内的逗号分隔列表指定异常的类型来处理多个异常：\n\n```python\n\
  except ( NameError , IndexError ) as msg :\n    print( msg )\n```\n\n你还可以使用 `raise`\
  \ 关键字强制解释器报告异常，通过它指定要识别的异常类型和括号中的自定义描述性消息。\n\n![image](img/image00188.jpeg)\n\n\
  `raise.py`\n\n![image](img/image00270.jpeg)通过用整数值初始化变量开始一个新程序。\n\n```python\nday\
  \ = 32\n```\n\n![image](img/image00271.jpeg)接下来，添加一个 `try` 语句块，测试变量并指定异常。\n\n```python\n\
  try :\n    if day > 31 :\n        raise ValueError(Invalid’ )\n```\n\n![image](img/image00272.jpeg)现在，添加一个\
  \ `except` 语句块，在发生 `ValueError` 时显示。\n\n```python\nexcept ValueError as msg :\n\
  \    print( ‘The found’ , msg )\n```\n\n![image](img/image00273.jpeg)然后添加一个 `finally`\
  \ 语句。\n\n```python\nfinally :\n    print( ‘But Today Is Beautiful.’ )\n```\n\n![image](img/image00276.jpeg)保存并运行程序——查看引发的错误如何处理。\n\
  \n![image](img/image00281.jpeg)\n\n![image](img/image00194.jpeg)\n\n除非发生异常，否则 `try`\
  \ 块中的语句都将执行。\n\n# 总结\n\n- `if` 关键字对表达式进行布尔值的条件测试。\n- 条件分支通过 `else` 和 `elif` 为 `if`\
  \ 测试提供了替代方案。\n- Python 测试表达式后必须跟 `:` 字符，且语句块相对于测试行缩进。\n- `for` 循环遍历指定列表或字符串中的每个项。\n\
  - Python `for` 循环语句后必须跟 `:` 字符，且语句块相对于语句缩进。\n- `range()` 函数生成数值序列，可用于指定 `for` 循环的长度。\n\
  - `enumerate()` 函数可以指定列表以显示每个元素的索引及其存储的值。\n- `zip()` 函数可以显示多个列表中相同索引存储的值。\n- `while`\
  \ 循环在初始测试表达式保持 `True` 时重复，在测试表达式变为 `False` 时结束。\n- Python `while` 循环语句后必须跟 `:` 字符，且语句块相对于语句缩进。\n\
  - 计数器变量的值可以在测试表达式中测试以控制循环迭代次数。\n- `break` 关键字可用于测试表达式为 `True` 并在测试返回 `False` 时立即退出循环。\n\
  - `continue` 关键字可用于测试表达式为 `True` 并在测试返回 `False` 时退出单次迭代。\n- 预期的运行时异常错误可以通过将语句包含在\
  \ `try except` 块中来处理。\n- 可选地，可以使用 `finally` 语句指定在处理异常后执行的语句。\n\n\n\n\n本书中之前的示例使用了\
  \ Python 编程语言的内置函数，例如 `print()` 函数。然而，大多数程序都有许多由编码员定义的自定义函数，这些函数可以在程序运行时根据需要调用。\n\
  \n自定义的 Python 函数是使用 `def`（定义）关键字创建的，后面跟着你选择的名称和 `()` 括号。编码员可以为函数选择任何名称，但编程语言的关键字和现有内置函数的名称除外。此行必须以冒号\
  \ `:` 结尾，然后每次调用函数时要执行的语句必须出现在下方的行中并进行缩进。因此，函数定义的语法如下：\n\n```python\ndef function-name()\
  \ :\n    statements-to-be-executed\n    statements-to-be-executed\n```\n\n![image](img/image00286.jpeg)\n\
  \n函数语句相对于定义行的缩进量必须保持相同，这样 Python 解释器才能识别该代码块。\n\n一旦函数语句执行完毕，程序流将从函数调用后的直接点继续执行。这种模块化在编程中非常有用，可以将一组例程隔离起来，以便重复调用。\n\
  \n要创建自定义函数，有必要理解程序中变量的访问性（“范围”）：\n\n* 在函数外部创建的变量可以被函数内部的语句引用——它们具有“全局”范围\n* 在函数内部创建的变量无法从创建它的函数外部引用——这些具有“局部”范围\n\
  \n局部变量的有限访问性意味着同名变量可以在不同的函数中出现而不产生冲突。\n\n![image](img/image00215.jpeg)\n\n为了防止意外冲突，请避免使用全局变量——尽可能只使用局部变量。\n\
  \n如果你想强制一个局部变量使其在其他处可访问，必须首先使用 Python 的 `global` 关键字对其声明，后仅跟其名称。随后它可以被赋值一个值，该值可以在程序的任何地方被引用。当全局变量和局部变量同名时，函数将使用本地版本。\n\
  \n![image](img/image00188.jpeg)\n\ndef.py\n\n![image](img/image00287.jpeg)通过初始化全局变量启动新程序\n\
  \n```python\nglobal_var = 1\n```\n\n![image](img/image00288.jpeg)接下来，创建一个名为“my_vars”的函数来显示全局变量中包含的值\n\
  \n```python\ndef my_vars() :\n    print( ‘Global variable:’ , global_var )\n```\n\
  \n![image](img/image00289.jpeg)现在，在函数块中添加缩进语句来初始化局部变量并显示其包含的值\n\n```python\nlocal_var\
  \ = 2\nprint( ‘Local variable:’ , local_var )\n```\n\n![image](img/image00290.jpeg)然后，在函数块中添加缩进语句来创建一个强制性的全局变量并分配一个初始值\n\
  \n```python\nglobal inner_var\ninner_var = 3\n```\n\n![image](img/image00291.jpeg)在函数之后添加一条语句来调用该函数以执行其包含的语句\n\
  \n```python\nmy_vars()\n```\n\n![image](img/image00292.jpeg)最后，添加一条语句来显示强制全局变量中包含的值\n\
  \n```python\nprint( ‘Coerced Global:’ , inner_var )\n```\n\n![image](img/image00293.jpeg)保存并运行程序——查看自定义函数显示变量值\n\
  \n![image](img/image00294.jpeg)\n\n![image](img/image00194.jpeg)\n\n不是全局但出现在某些外部作用范围中的变量可以使用\
  \ `nonlocal` 关键字进行处理。\n\n### 添加参数\n\n在程序中定义自定义函数时，你可以在函数的括号之间可选地指定一个“参数”名称。然后，通过在函数调用的括号中指定值，可以将“参数”值传递给该参数。函数现在可以在执行期间通过参数名称引用该值来使用该传入的值。例如，定义一个接受参数并打印输出的函数：\n\
  \n```python\ndef echo( user ) :\n    print( ‘User:’ , user )\n```\n\n![image](img/image00193.jpeg)\n\
  \n参数是仅供函数内部使用的特殊变量——它们必须遵守普通变量相同的命名规则。\n\n调用此函数必须指定一个参数值传递给其括号中的参数，以便将其打印出来：\n\n\
  ```python\necho( ‘Mike’ )\n```\n\n可以通过在函数括号内包含逗号分隔的参数名称列表，在函数定义中指定多个参数：\n\n```python\n\
  def echo( user , lang , sys ) :\n    print( User:’ , user , ‘Language:’ , lang ,\
  \ ‘Platform:’ , sys )\n```\n\n调用定义指定了参数的函数时，调用必须包含与参数数量相同的参数值。例如，使用多个参数调用此示例：\n\n\
  ```python\necho( ‘Mike’ , ‘Python’ , ‘Windows’ )\n```\n\n传递的值必须以与参数列表相同的顺序出现，除非调用者也这样指定参数名称：\n\
  \n```python\necho( lang = ‘Python’ , user = ‘Mike’ , sys = ‘Windows’ )\n```\n\n\
  可选地，在定义函数时可以在参数列表中指定一个默认值。当调用者为该参数指定值时，该值将被覆盖，但当调用者没有传递参数值时，函数将使用该值：\n\n```python\n\
  def echo( user , lang , sys = ‘Linux’ ) :\n    print( User:’ , lang, ‘Platform:’,\
  \ sys )\n```\n\n这意味着你可以传递少于函数定义参数的值来调用函数以使用默认值，或者传递相同数量的值来覆盖默认值。\n\n![image](img/image00295.jpeg)\n\
  \n![image](img/image00194.jpeg)\n\nparam.py\n\n![image](img/image00287.jpeg)通过定义带有三个参数的函数启动新程序\n\
  \n```python\ndef echo( user , lang , sys ) :\n    print( User:’ , user, ‘Language:’,\
  \ lang, ‘Platform:’, sys )\n```\n\n![image](img/image00288.jpeg)接下来，按顺序向参数传递字符串\n\
  \n```python\necho( ‘Mike’ , ‘Python’ , ‘Windows’ )\n```\n\n![image](img/image00289.jpeg)现在，通过指定参数名称将字符串参数传递给函数\n\
  \n```python\necho( lang = ‘Python’ , user = ‘Mike’ , sys = ‘Windows’ )\n```\n\n\
  ![image](img/image00290.jpeg)然后，定义另一个带有默认值的两个参数函数，以打印参数值\n\n```python\ndef mirror(\
  \ user = ‘Carole’ , lang = ‘Python’ ) :\n    print( ‘\\nUser:’ , user , ‘Language:’\
  \ , lang )\n```\n\n![image](img/image00291.jpeg)最后，添加语句在使用和覆盖默认值的情况下调用第二个函数\n\n\
  ```python\nmirror()\nmirror( lang = ‘Java’ )\nmirror( user = ‘Tony’ )\nmirror( ‘Susan’\
  \ , ‘C++’ )\n```\n\n![image](img/image00292.jpeg)保存并运行程序——查看函数显示参数值或默认参数值\n\n[/content]\
  \ 修正：[content]\n参数是通过函数调用传递给函数参数的实际数据值。\n\n### 返回结果\n\n就像 Python 的内置函数 `str()` 返回调用者指定作为其参数的值的字符串表示一样，你的自定义函数也可以通过\
  \ `return` 关键字向其调用者返回一个值。例如，如下所示向调用者返回两个指定参数值的和：\n\n```python\ndef sum( a , b )\
  \ :\n    return a + b\n```\n\n调用者可以将返回的结果赋值给变量，供程序后续使用，如下所示：\n\n```python\ntotal\
  \ = sum( 8 , 4 )\nprint( ‘Eight Plus Four Is:’ , total )\n```\n\n或者返回的结果可以这样直接“内联”使用：\n\
  \n\n\n\n```python\nprint( ‘Eight Plus Four Is:’ , sum( 8 , 4 ) )\n```\n\n通常，return\
  \ 语句会出现在函数块的末尾，用于返回执行该函数中包含的所有语句后的最终结果。\n\n然而，return 语句也可以出现在函数块中的较早位置，以停止该块中后续所有语句的执行。这会立即在调用者处恢复程序的执行。可选地，return\
  \ 语句可以指定要返回给调用者的值，也可以省略该值。如果未指定值，则假设默认值为 `None`。通常，这用于在发现条件测试结果为 `False` 后停止函数语句的执行。例如，当传递的参数值低于指定的数字时：\n\
  \n```python\ndef sum( a , b ) :\n    if a < 5 :\n        return\n    return a +\
  \ b\n```\n\n![image](img/image00193.jpeg)\n\n你可以在函数定义中为参数指定默认值。\n\n在这种情况下，当第一个传递的参数小于小于时，函数将返回默认值\
  \ `None`，且最后的语句将不会执行。\n\n当函数需要执行算术运算时，可以使用内置的 `isdigit()` 函数对用户输入进行整数值验证。\n\n![image](img/image00188.jpeg)\n\
  \nreturn.py\n\n![image](img/image00287.jpeg)通过使用用户输入的整数值初始化变量来启动一个新程序以进行操作\n\n```python\n\
  num = input( ‘Enter An Integer:’ )\n```\n\n![image](img/image00288.jpeg)接下来，添加一个函数定义，接受从调用者传递的单个参数值\n\
  \n```python\ndef square( num ) :\n```\n\n![image](img/image00289.jpeg)现在，在函数块中插入一个缩进语句，以验证传递的参数值是否为整数，或停止函数语句的进一步执行\n\
  \n```python\nif not num.isdigit() :\n    return ‘Invalid Entry’\n```\n\n![image](img/image00290.jpeg)然后，添加缩进语句，将传递的参数值强制转换为\
  \ `int` 数据类型，然后将该值的平方和返回给调用者\n\n```python\nnum = int( num )\nreturn num * num\n\
  ```\n\n![image](img/image00291.jpeg)最后，添加一个语句来输出字符串和函数调用返回的值\n\n```python\nprint(\
  \ num , ‘Squared Is:’ , square( num ) )\n```\n\n![image](img/image00292.jpeg)保存并运行程序——查看函数显示返回的值\n\
  \n![image](img/image00296.jpeg)\n\n![image](img/image00215.jpeg)\n\n记住，用户输入被读取为\
  \ `str` 数据类型——因此必须转换为 `int` 或 `float` 类型才能进行算术运算。\n\n## 存储函数\n\n函数定义可以方便地存储在一个或多个单独的文件中以便于维护，并允许它们在多个程序中使用，而无需将定义复制到每个程序中。每个存储函数定义的\
  \ Python 文件称为“模块”（module），模块名是不带 `.py` 扩展的文件名。\n\n存储在模块中的函数可以通过 Python 的 `import`\
  \ 关键字后跟模块名供程序使用。虽然不是必须的，但习惯上会将任何导入语句放在程序的开头。\n\n导入的函数可以使用“模块名.函数名”的形式进行调用。例如，从一个名为“ineasy”的导入模块中调用“steps”函数可以通过\
  \ `ineasy.steps()` 完成。\n\n当存储在模块中的函数包含参数时，在定义中为参数分配默认值通常是有用的。这使得函数变得更加通用，因为调用时指定参数值就变成了可选的。\n\
  \n![image](img/image00188.jpeg)\n\ncat.py\n\n![image](img/image00287.jpeg)通过定义一个函数来启动一个新模块，该函数为其参数提供一个默认字符串值用于显示\n\
  \n```python\ndef purr( pet = ‘A Cat’ ) :\n    print( pet , ‘Says MEOW!’ )\n```\n\
  \n![image](img/image00288.jpeg)接下来再添加两个函数定义，也为它们的参数提供默认字符串值用于显示\n\n```python\ndef\
