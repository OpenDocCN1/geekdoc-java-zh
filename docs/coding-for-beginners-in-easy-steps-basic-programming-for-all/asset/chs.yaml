  \n![image](img/image00397.jpeg)\n\n`lotto.exe`\n\n# 总结\n\n• 标准 Python 库包含一个 `random`\
  \ 模块，它提供了生成伪随机数的函数\n•可以通过 `random` 模块的 `random()` 函数生成 0.0 到 1.0 之间的伪随机浮点数\n•可以通过\
