  \n## 运行计时器\n\n在事件发生前和之后获取当前时间，意味着可以通过它们的差值计算事件的持续时间。Python 的 `time` 模块可以导入程序以提供各种时间相关的函数。\n\
  \n当前系统时间通常被计算为自 1970 年 1 月 1 日 GMT 00:00:00 Epoch 经过的秒数。time 模块的 `time()` 函数在调用时返回自\
  \ Epoch 以来的当前秒数（浮点数）。\n\n![image](img/image00193.jpeg)\n`gmtime()` 函数将从 Epoch 开始的经过时间转换为\
  \ UTC 的 `struct_time` 对象，其中夏令时间始终设置为零，而 `localtime()` 则将其转换为本地系统时间的 `struct_time`\
  \ 对象。\n\n`time()` 函数返回的图形可以使用 `gmtime()` 或 `localtime()` 函数转换为“struct_time”对象。该对象具有\
  \ `tm_year`、`tm_mon`、`tm_mday`、`tm_hour`、`tm_min`、`tm_sec`、`tm_wday`、`tm_yday` 和\
  \ `tm_isdst` 属性，可以使用点表示法引用。例如，`struct.tm_wday`。\n\n`struct_time` 对象中的所有值都存储为数值，但可以使用\
  \ `strftime()` 函数转换为文本等效值。这需要一个作为格式“指令”的参数，随后是 `struct_time` 对象的名称。可能的指令包括表此处中列出的\
  \ datetime 对象指令。例如，用于周日的 `strftime( ‘%A’ , struct)`。\n\n很有用的是，time 模块还提供了一个 `sleep()`\
  \ 函数，可以用于暂停程序的执行。其参数指定了延迟执行的秒数。\n\n![image](img/image00188.jpeg)\n\n## timer.py\n\
  \n![image](img/image00195.jpeg)\n通过导入 `time` 模块启动一个新程序以可以使用其功能\n\n```python\nfrom\
  \ time import *\n```\n\n![image](img/image00196.jpeg)\n接下来，用浮点数初始化变量，该数值是自 epoch\
  \ 以来的当前经过时间\n\n```python\nstart_timer = time()\n```\n\n![image](img/image00197.jpeg)\n\
  现在，添加一条语句从经过时间值创建一个 `struct_time` 对象\n\n```python\nstruct = localtime( start_timer\
  \ )\n```\n\n![image](img/image00200.jpeg)\n然后，宣布倒计时计时器将从当前时间点开始\n\n```python\nprint(\
  \ ‘Starting Countdown At:’ , strftime( ‘%X’ , struct ) )\n```\n\n![image](img/image00202.jpeg)\n\
  添加一个循环初始化并打印计数器变量值，然后在每次迭代中计数器减一并暂停一秒\n\n```python\ni = 10\nwhile i > -1 :\n   \
  \ print( i )\n    i -= 1\n    sleep( 1 )\n```\n\n![image](img/image00207.jpeg)\n\
  接下来，用浮点数初始化变量，该数值是现在自 Epoch 以来的当前经过时间\n\n```python\nend_timer = time()\n```\n\n\
  ![image](img/image00212.jpeg)\n现在，使用时间差值初始化一个变量\n\n```python\ndifference = end_timer\
  \ - start_timer\n```\n\n![image](img/image00213.jpeg)\n最后，添加一条语句显示运行用时\n\n```python\n\
  print( ‘Runtime:’ , difference )\n```\n\n![image](img/image00323.jpeg)\n保存并运行程序——查看显示\n\
  \n![image](img/image00324.jpeg)\n\n## Summary\n\n- `sys` 模块包含 Python 版本号、解释器位置和路径\n\
  - `keyword` 属性包含所有 Python 关键字列表\n- `math` 模块提供了执行数学过程的函数，如 `math.ceil()` 和 `math.floor()`\n\
  - 三角函数可以使用 `math` 函数执行，如 `math.sin()`、`math.cos()` 和 `math.tan()`\n- `random` 模块提供了产生伪随机数的\
  \ `random()` 函数和从序列中随机选择元素的 `sample()` 函数\n- `decimal` 模块提供了 `Decimal()` 对象，可以精确表示浮点数\n\
  - `datetime` 模块提供了 `datetime` 对象，具有 `year`、`month`、`day`、`hour`、`minute`、`second`、`microsecond`\
  \ 属性，可以使用点后缀或 `getattr()` 引用\n- `time` 模块的 `time()` 函数返回自 Epoch 以来的经过时间\n- `gmtime()`\
  \ 和 `localtime()` 函数返回包含日期和时间部分的 `struct_time` 对象\n\n\n\n\n\n| `r/R` | `原始字符串 –\
  \ 取消转义字符的含义` | `print( r’\\n’ )` |\n| `‘‘‘ ‘‘‘` | `文档字符串 (Docstring) – 描述模块、函数、类或方法`\
  \ | `def sum( a,b ) : ‘‘‘ Add Args ‘‘‘` |\n\n![image](img/image00215.jpeg)\n\n成员运算符执行区分大小的匹配，因此\
  \ `‘A’ in ‘abc’` 将失败。\n\n`[ ]` 切片运算符和 `[ : ]` 范围切片运算符识别出字符串本质上是一个包含每个列表元素内单个字符的列表，可以通过它们的索引数字进行引用。\n\
  \n同样地，`in` 和 `not in` 成员运算符会遍历每个元素，寻找匹配指定的字符。\n\n原始字符串运算符 `r`（或大写的 `R`）必须紧跟在起始引号之前，以抑制字符串中的转义字符，这在字符串包含反斜杠字符时非常有用。\n\
  \n![image](img/image00215.jpeg)\n\n范围切片返回到最终指定的索引位置（但不包含该位置）的字符串。\n\n“docstring”是一个描述性字符串字面量，作为模块、函数、类或方法定义的第一个语句出现。它应该包含在三个单引号内。独特的是，docstring\
  \ 成为该对象的 `__doc__` 特殊属性，因此可以使用其名称和点后缀进行引用。所有模块通常都应该有 docstring，模块导出的所有函数和类也应该有 docstring。\n\
  \n![image](img/image00188.jpeg)\n\nmanipulate.py\n\n![image](img/image00225.jpeg)通过定义一个包含\
  \ docstring 说明的简单函数来启动新程序\n\n```python\ndef display( s ) :\n‘‘’Display an argument\
  \ value.’’’\nprint( s )\n```\n\n![image](img/image00226.jpeg)接下来，添加一条语句显示函数描述\n\n\
  ```python\ndisplay( display.doc )\n```\n\n![image](img/image00227.jpeg)现在，添加一条语句来显示包含反斜杠字符的原始字符串值\n\
  \n```python\ndisplay( r’C:\\Program Files’ )\n```\n\n![image](img/image00228.jpeg)然后，添加一条语句显示包含转义字符和空格的两个字符串值的拼接\n\
  \n```python\ndisplay( ‘\\nHello’ + ‘ Python’ )\n```\n\n![image](img/image00231.jpeg)接下来，添加一条语句，在元素索引数字范围内显示指定字符串的切片\n\
  \n```python\ndisplay( ‘Python In Easy Steps\\n’ [ 7 : ] )\n```\n\n![image](img/image00232.jpeg)最后，显示在指定字符串内查找字符的结果\n\
  \n```python\ndisplay( ‘P’ in ‘Python’ )\ndisplay( ‘p’ in ‘Python’ )\n```\n\n![image](img/image00240.jpeg)保存并运行程序\
  \ – 查看被处理的字符串被显示\n\n![image](img/image00325.jpeg)\n\n![image](img/image00193.jpeg)\n\
  \n记住字符串必须包含在单引号或双引号内。\n\n![image](img/image00194.jpeg)\n\n使用范围切片时，如果省略了起始索引数字则默认为零，如果省略了结束索引数字则认为字符串长度。\n\
  \n### 格式化字符串\n\nPython 内置函数 `dir()` 通过在括号内指定模块名称，可以用于检查模块中定义的函数和变量名称。交互模式可以轻松用于此目的，只需导入模块名然后调用\
  \ `dir()` 函数。下面的示例检查了在此处 第六章 中创建的“dog”模块：\n\n![image](img/image00326.jpeg)\n\n![image](img/image00194.jpeg)\n\
  \n注意，上一个示例中引入的 `__doc__` 属性出现在 `dir()` 函数的列表中。\n\n以双下划线开头和结尾定义的名称是 Python 对象，而其他是程序员定义的。可以使用\
  \ `dir()` 函数检查 `__builtins__` 模块，以显示默认定义的函数和变量名称，例如 `print()` 函数和 `str` 对象。\n\n\
  `str` 对象定义了几个用于字符串格式化的有用函数，包括一个执行替换的实际 `format()` 函数。要由 `format()` 函数格式化的字符串可以包含文本和“替换字段”，标记了从有序逗号分隔值列表中插入文本的位置。每个替换字段由\
  \ `{ }` 括号表示，括号内可以包含替换在列表中的索引数字位置。\n\n![image](img/image00193.jpeg)\n\n不要将此处描述的\
  \ `str` 对象与将值转换为字符串类型的 `str()` 函数混淆。\n\n字符串也可以使用 C 风格的 `%s` 替换运算符进行格式化，标记字符串中从逗号分隔的有序值列表中插入文本的位置。\n\
  \n![image](img/image00188.jpeg)\n\nformat.py\n\n![image](img/image00225.jpeg)通过初始化格式化字符串变量来启动新程序\n\
  \n```python\nsnack = ‘{} and {}’.format( ‘Burger’ , ‘Fries’ )\n```\n\n![image](img/image00226.jpeg)接下来，显示变量值以查看替换后的文本\n\
  \n```python\nprint( ‘\\nReplaced:’, snack )\n```\n\n![image](img/image00227.jpeg)现在，分配格式化字符串给变量\n\
  \n```python\nsnack = ‘{0} and {1}’.format( ‘Burger’ , ‘Fries’ )\n```\n\n![image](img/image00228.jpeg)然后，显示变量值以再次查看替换后的文本\n\
  \n```python\nprint( ‘Substituted:’, snack )\n```\n\n![image](img/image00231.jpeg)分配另一个格式化字符串给变量\n\
  \n```python\nsnack = ‘%s and %s’ ( ‘Milk’ , ‘Cookies’ )\n```\n\n![image](img/image00232.jpeg)最后，显示变量值以查看格式化的字符串\n\
  \n```python\nprint( snack )\n```\n\n/content 保存并运行程序 – 查看格式化的字符串被显示\n\n![image](img/image00325.jpeg)\n\
  \n![image](img/image00193.jpeg)你不能在索引数字周围留空格。\n\n![image](img/image00194.jpeg)其他数据类型可以使用\
  \ `%d` 表示十进制整数，`%c` 表示字符，以及 `%f` 表示浮点数。\n\n### 修改字符串\n\n`str` 对象有许多实用的函数，可以通过点后缀调用来修改字符串并检查其内容。最常用的字符串修改函数列如下所示，并带有简要描述：\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `capitalize()` | 将字符串首字母变为大写 |\n| `title()` |\
  \ 将所有首字母变为大写 |\n| `upper()` `lower()` `swapcase()` | 分别将所有字母变为大写、小写或相反的大小 |\n| `join(seq)`\
  \ | 使用分隔符合并字符串 |\n| `lstrip()` `rstrip()` `strip()` | 分别删除领先空格、尾部空格或前后空格 |\n| `replace(old,\
  \ new)` | 将所有的 *old* 替换为 *new* |\n| `ljust(w, c)` `rjust(w, c)` | 使用字符 *c* 向右或左填充到总宽度\
  \ *w* |\n| `center(w, c)` | 使用字符 *c* 在字符串两侧填充到总宽度 *w*（默认是空格） |\n| `count(sub)` |\
  \ 返回 *sub* 出现的次数 |\n| `find(sub)` | 返回 *sub* 首次出现的索引数字，如果找到则返回 -1 |\n| `startswith(sub)`\
  \ `endswith(sub)` | 如果 *sub* 在开头或结尾找到则返回 True，否则返回 False |\n| `isalpha()` `isnumeric()`\
  \ `isalnum()` | 如果所有字符仅为字母、仅为数字或均为字母或数字则返回 True，否则返回 False |\n| `islower()` `isupper()`\
  \ `istitle()` | 如果字符串字符为小写、大写或所有首字母均为大写，则返回 True，否则返回 False |\n| `isspace()` | 如果字符串仅包含空格则返回\
  \ True，否则返回 False |\n\n\n\n\n\n| `isdigit()` | `isdecimal()` | 如果字符串仅包含数字或小数则返回\
  \ True，否则返回 False |\n\n![image](img/image00215.jpeg)\n\n空格字符不是字母数字，因此在检查包含空格的字符串时，`isalnum()`\
  \ 返回 `False`。\n\n![image](img/image00188.jpeg)\n\n`modify.py`\n\n![image](img/image00225.jpeg)通过初始化一个包含小写字母和空格的字符串来启动一个新程序\n\
  \n```python\nstring = ‘coding for beginners in easy steps’\n```\n\n![image](img/image00226.jpeg)接下来，显示大写化、标题化和居中的字符串\n\
  \n```python\nprint( ‘\\nCapitalized:\\t’ , string.capitalize() )\nprint( ‘\\nTitled:\\\
  t\\t’ , string.title() )\nprint( ‘\\nCentered:\\t’ , string.center( 30 , ‘*’ ) )\n\
  ```\n\n![image](img/image00227.jpeg)现在，显示全大写的字符串并与两个星号的序列合并\n\n```python\nprint(\
  \ ‘\\nUppercase:\\t’ , string.upper() )\nprint( ‘\\nJoined:\\t\\t’ , string.join(\
  \ ‘**’ ) )\n```\n\n![image](img/image00228.jpeg)然后，显示左侧用星号填充的字符串\n\n```python\n\
  print( ‘\\nJustified:\\t\\t’ ,string.rjust( 30 , ‘*’ ) )\n```\n\n![image](img/image00231.jpeg)最后，显示将所有出现的\
  \ ‘s’ 字符替换为星号的字符串\n\n```python\nprint( ‘\\nReplaced:\\t’ , string.replace( ‘s’ ,\
  \ ‘*’ ) )\n```\n\n![image](img/image00232.jpeg)保存并运行程序 – 查看修改后的字符串显示\n\n![image](img/image00328.jpeg)\n\
  \n![image](img/image00193.jpeg)\n\n使用 `rjust()` 函数，右对齐的字符串会在其**左侧**添加填充；使用 `ljust()`\
  \ 函数，左对齐的字符串会在其**右侧**添加填充。\n\n### 访问文件\n\n可以使用 `dir()` 函数检查 `__builtins__` 模块，以发现它包含一个文件对象，该对象定义了几个处理文件的方法，包括\
  \ `open()`、`read()`、`write()` 和 `close()`。\n\n在读取或写入文件之前，必须先使用 `open()` 函数打开。这需要两个字符串参数来指定文件的名称和位置，以及以下“模式”指定符之一来打开文件：\n\
  \n| 文件模式 | 操作 |\n| :--- | :--- |\n| `r` | 打开现有文件进行读取 |\n| `w` | 打开现有文件进行写入。如果不存在则创建新文件，或打开现有文件并丢弃之前的所有内容\
  \ |\n| `a` | 追加文本。在文件末尾打开或创建一个用于写入的文本文件 |\n| `r+` | 打开文本文件进行读取或写入 |\n| `w+` | 打开文本文件进行写入或读取\
  \ |\n| `a+` | 在文件末尾打开或创建一个用于读取或写入的文本文件 |\n| 如果模式在上述列出的任何文件模式后包含 `b`，则操作涉及二进制文件而非文本文件。例如，`rb`\
  \ 或 `w+b` |\n\n![image](img/image00215.jpeg)\n\n文件模式参数是字符串值，因此必须用引号括起来。\n\n一旦打开文件并获得文件对象，就可以从其属性获取与该文件相关的各种信息：\n\
  \n| 属性 | 描述 |\n| :--- | :--- |\n| `name` | 打开的文件名 |\n| `mode` | 打开文件的模式 |\n| `closed`\
  \ |状态布尔值，True 或 False |\n| `readable()` | 可读权限布尔值，True 或 False |\n| `writable()`\
  \ | 可写权限布尔值，True 或 False |\n\n![image](img/image00194.jpeg)\n\n你还可以使用 `readlines()`\
  \ 函数，它返回包含所有行的列表。\n\n![image](img/image00188.jpeg)\n\n`access.py`\n\n![image](img/image00225.jpeg)通过创建一个名为\
  \ “example.txt”的新文本文件的文件对象来启动新程序，并在其中写入内容\n\n```python\nfile = open( ‘example.txt’\
  \ , ‘w’ )\n```\n\n![image](img/image00226.jpeg)接下来，添加语句显示文件名和模式\n\n```python\nprint(\
  \ ‘File Name:’ , file.name )\nprint( ‘File Open Mode:’ , file.mode )\n```\n\n![image](img/image00227.jpeg)现在，添加语句显示文件访问权限\n\
  \n```python\nprint( ‘Readable:’ , file.readable() )\nprint( ‘Writable:’ , file.writable()\
  \ )\n```\n\n![image](img/image00228.jpeg)然后，定义一个函数来确定文件的状态\n\n```python\ndef get_status(\
  \ f ) :\n    if ( f.closed != False ) :\n        return ‘Closed’\n    else :\n \
  \       return ‘Open’\n```\n\n![image](img/image00231.jpeg)最后，添加语句显示当前文件状态，然后关闭文件并再次显示文件状态\n\
  \n```python\nprint( ‘File Status:’ , get_status( file ) )\nfile.close()\nprint(\
  \ ‘\\nFile Status:’ , get_status( file ) )\n```\n\n![image](img/image00232.jpeg)保存并运行程序\
  \ – 查看文件被打开用于写入，然后看到文件被关闭\n\n![image](img/image00329.jpeg)\n\n![image](img/image00193.jpeg)\n\
  \n如果你的程序尝试以 `r` 模式打开不存在的文件，解释器将报告错误。\n\n#### 操作内容\n\n一旦文件成功打开，就可以读取它、添加内容或在文件中写入新文本，这取决于调用\
  \ `open()` 函数时指定的模式。之后，必须始终调用 `close()` 函数关闭打开的文件。\n\n正如你预期的，`read()` 函数返回文件的全部内容，`write()`\
  \ 函数向文件添加内容。你可以快速高效地通过循环逐行读取文件。\n\n![image](img/image00188.jpeg)\n\n`readwrite.py`\n\
  \n![image](img/image00225.jpeg)通过初始化包含换行符的变量来启动新程序\n\n```python\npoem = ‘I never\
  \ saw a man who looked\\n’\npoem += ‘With wistful eye\\n’\npoem += ‘Upon that little\
  \ tent\\n’\npoem += ‘Which prisoners call the sky\\n’\n```\n\n![image](img/image00226.jpeg)接下来，添加语句为名为\
  \ “poem.txt”的新文件创建一个文件对象以写入\n\n```python\nfile = open( ‘poem.txt’ , ‘w’ )\n```\n\
  \n![image](img/image00227.jpeg)现在，添加语句将变量中的内容写入文件，然后关闭\n\n```python\nfile.write(\
  \ poem )\nfile.close()\n```\n\n![image](img/image00228.jpeg)然后，添加语句为现有文本文件 “poem.txt”创建一个文件对象以读取\n\
  \n```python\nfile = open( ‘poem.txt’ , ‘r’ )\n```\n\n![image](img/image00231.jpeg)现在，添加语句显示文件的内容，然后关闭文件\n\
  \n```python\nfor line in file :\n    print( line , end = ‘’ )\nfile.close()\n```\n\
  \n![image](img/image00232.jpeg)保存并运行程序 – 查看创建的文件并输出\n\n![image](img/image00330.jpeg)\n\
  \n![image](img/image00240.jpeg)启动记事本文本编辑器以确认文件是否存在并显示程序写入的内容\n\n![image](img/image00331.jpeg)\n\
  \n![image](img/image00332.jpeg)现在在程序末尾添加语句向文本文件追加引用，然后再次保存脚本\n\n```python\nfile\
  \ = open( ‘poem.txt’ , ‘a’ )\nfile.write( ‘Oscar Wilde)’ )\nfile.close()\n```\n\n\
  ![image](img/image00333.jpeg)保存并再次运行程序重写文本文件，然后在记事本中查看 – 看到引用现在追加在原始文本内容之后\n\n![image](img/image00334.jpeg)\n\
  \n写入现有文件将自动覆盖其内容！\n\n![image](img/image00194.jpeg)\n\n在字符串本身包含换行符时，抑制 `print()`\
  \ 函数提供的默认换行符。\n\n![image](img/image00194.jpeg)\n\n#### 更新内容\n\n文件对象的 `read()` 函数默认会从文件的最开始（索引位置零）一直到文件的最末尾（最后一个字符的索引位置）读取全部内容。可选地，`read()`\
  \ 函数可以接受一个整数参数来指定它应该读取多少个字符。\n\n\n\n\n\n文件中的位置（即读取位置或写入的位置）可以通过文件对象的 `seek()` 函数进行精细控制。该函数接受一个整数参数，指定从文件起始位置作为偏移量需要移动的字符数。\n\
  \n可以通过调用文件对象的 `tell()` 函数随时发现文件中的当前位置，该函数会返回一个整数位置。\n\n在处理文件对象时，良好的做法是使用 Python\
  \ 的 `with` 关键字将文件操作语句分组在一个块中。这种技术可以确保文件在操作结束后被正确关闭，即使过程中抛出异常，而且比编写等价的 `try except`\
  \ 块要短得多。\n\n![image](img/image00188.jpeg)\n\n### update.py\n\n![image](img/image00225.jpeg)通过给包含要写入文件文本的变量赋值字符串值来启动一个新程序\n\
  \n```python\ntext = ‘The political slogan “Workers Of The World Unite!” \\nis from\
  \ The Communist Manifesto.’\n```\n\n![image](img/image00226.jpeg)接下来，添加语句将文本字符串写入文件，并在“with”块中显示文件的当前状态\n\
  \n```python\nwith open( ‘update.txt’ , ‘w’ ) as file :\nfile.write( text )\nprint(\
  \ ‘\\nFile Now Closed?:’ , file.closed )\n```\n\n![image](img/image00227.jpeg)现在，在“with”代码块之后添加一个非缩进语句来显示文件的新状态\n\
  \n```python\nprint( ‘File Now Closed?:’ , file.closed )\n```\n\n![image](img/image00228.jpeg)然后，重新打开文件并显示其内容，以确认它现在包含了整个字符串\n\
  \n```python\nwith open( ‘update.txt’ , ‘r+’ ) as file :\ntext = file.read()\nprint(\
  \ ‘\\nString:’ , text )\n```\n\n![image](img/image00231.jpeg)接下来，添加缩进语句显示当前文件位置，然后重新定位并显示该新位置\n\
  \n```python\nprint( ‘\\nPosition In File Now:’ , file.tell() )\nposition = file.seek(\
  \ 33 )\nprint( ‘Position In File Now:’ , file.tell() )\n```\n\n![image](img/image00232.jpeg)现在，添加一个缩进语句从当前文件位置开始覆盖文本\n\
  \n```python\nfile.write( ‘All Lands’ )\n```\n\n![image](img/image00240.jpeg)然后，添加缩进语句再次在文件中定位，并从新位置覆盖文本\n\
  \n```python\nfile.seek( 61 )\nfile.write( ‘the tombstone of Karl Marx.’ )\n```\n\
  \n![image](img/image00332.jpeg)最后，添加缩进语句返回文件开头并显示其全部更新后的内容\n\n```python\nfile.seek(\
  \ 0 )\ntext = file.read()\nprint( ‘\\nString:’ , text )\n```\n\n![image](img/image00333.jpeg)保存并运行程序——查看文件字符串的更新\n\
  \n![image](img/image00335.jpeg)\n\n![image](img/image00194.jpeg)\n\n`seek()` 函数可选性地接受第二个参数值\
  \ `0`、`1` 或 `2`，分别从起始位置、当前位置或结束位置移动指定数量字符——0 是默认的起始位置。\n\n![image](img/image00193.jpeg)\n\
  \n与字符串一样，文件中的第一个字符位于索引位置零而不是索引位置一。\n\n# 总结\n\n- 字符串可以通过运算符进行操作，例如使用 `+` 拼接字符串，以及使用\
  \ `*` 对字符串进行重复\n- 字符串可以通过切片 `[ ]` 和范围切片 `[ : ]` 运算符操作，这些操作引用字符串字符的索引号\n- 字符串可以通过成员运算符\
  \ `in` 和 `not in` 进行操作，用于在字符串中匹配指定的字符\n- `r`（或 `R`）原始字符串运算符可以放置在字符串之前，以抑制其中包含的任何转义字符\n\
  - “文档字符串”（docstring）是模块、类或函数开头用三引号括的描述性字符串，用于定义其用途\n- `__doc__` 属性可用于引用文档字符串中的字符串描述\n\
  - 使用 `dir()` 函数可以检查 `__builtins__` 模块，以显示默认函数和变量的名称\n- `str` 对象拥有用于字符串格式化的 `format()`\
  \ 函数，以及许多用于修改字符串的函数，例如 `capitalize()`\n- `format` 函数用于格式化字符串的替换字段在逗号分隔的列表中由 `{ }`\
  \ 大括号表示\n- 字符串也可以使用 C 风格的 `%s` 替换运算符格式化，标记字符串中要插入文本的地方\n- 文件对象拥有 `open()`、`read()`、`write()`\
  \ 和 `close()` 函数用于处理文件，并具有描述文件属性的功能\n- `open()` 函数必须指定一个文件名字符串参数和一个文件模式字符串参数，例如\
  \ `’r’` 读取文件\n- 已打开的文件对象具有信息属性，可以揭示其当前状态，例如 `mode` 和 `readable()` 值\n- 文件中的读取或写入位置可以通过\
  \ `seek()` 方法指定，并通过 `tell()` 函数报告\n- Python `with` 关键字将文件操作语句分组在一个块中，并自动关闭已打开的文件\n\
  \n10\n\n## 编程对象\n\n*本章将演示如何通过代码将虚拟对象编码到你的程序中*。\n\n- 定义类\n- 复制实例\n- 访问属性\n- 派生类\n\
  - 重写方法\n- 应用逻辑\n- 总结\n\n### 定义类\n\n我们周围的真实世界对象每个都有我们可以描述的属性和行为。例如，一辆汽车可以被描述为具有“红色”属性和“加速”行为。编程对象就像真实世界对象的虚拟表示，在“类”中描述属性和行为。\n\
  \n“类”是描述对象的特定原型。每个类都包含一个可以同时包含函数和变量的数据结构。类的属性被称为其数据“成员”。类函数成员被称为“方法”，类变量成员（定义在类中但在任何方法定义之外）被称为它的“属性”。可以通过点符号法在整个程序中引用类成员，即在类名后后跟成员名，语法为\
  \ `class-name.method-name()` 或 `class-name.attribute-name`。\n\n![image](img/image00336.jpeg)\n\
  \n类定义从 `class` 关键字开始，后跟一个程序员指定的名称（遵循常用的 Python 命名规范但以大写开头），然后是一个 `:` 冒号。接下来是缩进语句，可选地指定类文档字符串、类变量属性声明和类方法定义——因此类块语法如下：\n\
  \n```python\nclass ClassName :\n    ‘‘‘ class-documentation-string ‘‘‘\n    class-variable-declarations\n\
  \    class-method-definitions\n```\n\n类定义指定了其属性和方法，它是创建工作副本（“实例”）的蓝图。在方法定义内部声明的所有变量被称为“实例”变量，并且仅在定义它们的方法内部局部可用——无法在类结构之外直接引用。\n\
  \n![image](img/image00194.jpeg)\n\n习惯上类名以大写字母开头，对象名以小写字母开头。\n\n\n\n\n\n类的所有属性都通过点符号前缀\
  \ `self` 进行内部引用——因此一个名为“sound”的属性是 `self.sound`。此外，类中的所有方法定义必须将 `self` 作为第一个参数——因此一个名为“talk”的方法是\
  \ `talk( self )`。\n\n当创建类实例时，会自动调用一个特殊的 `__init__( self )` 方法。如果需要传递值来初始化其属性，可以在其括号中添加后续参数。\n\
  \n一个完整的 Python 类声明可能如下所示：\n\n```python\nclass Critter :\n    ''' 用于所有生物属性的基类。 '''\n\
  \    count = 0\n    def __init__( self , chat ) :\n        self.sound = chat\n \
  \       Critter.count += 1\n    def talk( self ) :\n        return self.sound\n\
  ```\n\n![image](img/image00193.jpeg)\n\n可以通过特殊的 `__doc__` 字符串属性 `Classname.__doc__`\
  \ 访问类的文档字符串。\n\n检查此示例的类组件是很有用的：\n\n* 变量 `count` 是一个类变量，其整数值由该类的所有实例共享——该值可以在类内部或外部通过\
  \ `Critter.count` 引用\n* 第一个方法 `__init__()` 是初始化方法，在创建类实例时会自动调用\n* 在此例中，`__init__()`\
  \ 方法初始化了一个实例变量 `sound`，其值从 `chat` 参数传递而来，并且每当创建该类的实例时，就会增加 `count` 类变量的值\n* 第二个方法\
  \ `talk()` 的声明方式与普通函数相同，但第一个参数是 `self`，它是自动包含的——调用者不需要传递任何值\n* 在此例中，`talk()` 方法简单返回封装在\
  \ `sound` 实例变量中的值\n\n![image](img/image00194.jpeg)\n\n虽然程序类不能完美模拟真实世界的对象，但目标是封装所有相关的属性和操作。\n\
  \n### 复制实例\n\n类对象的“实例”仅仅是通过调用该类的构造函数并在其括号内指定所需的参数数量而创建的原型的副本。调用的参数必须与 `__init__()`\
  \ 方法定义的参数匹配——除了内部 `self` 参数的值外。\n\n构造函数返回的类实例对象使用语法 `instance-name = ClassName(\
  \ *args* )` 赋值给变量。\n\n可以使用点符号通过在名称后加上后缀 `instance-name.method-name()` 或 `instance-name.attribute-name`\
  \ 来引用实例对象的方法和类变量属性。\n\n![image](img/image00194.jpeg)\n\n构造函数使用类名后包含任何必要参数的括号来创建类实例。\n\
  \n通常，基类可以定义为 Python 模块文件，以便它可以被导入到其他脚本中，在脚本中可以从“主”类原型轻松创建实例对象。\n\n![image](img/image00188.jpeg)\n\
  \n#### Bird.py\n\n![image](img/image00241.jpeg)通过声明一个带有描述性文档字符串的新类开始一个新的类文件\n\n\
  ```python\nclass Bird :\n    ''' 定义鸟类属性的基类.'''\n```\n\n![image](img/image00242.jpeg)接下来，添加一个缩进语句来声明并初始化一个整数值为零的类变量属性\n\
  \n```python\ncount = 0\n```\n\n![image](img/image00243.jpeg)现在，定义初始化类方法来初始化实例变量并增加类变量\n\
  \n```python\ndef __init__( self , chat ) :\n    self.sound = chat\n    Bird.count\
  \ += 1\n```\n\n![image](img/image00244.jpeg)最后，添加一个类方法在调用时返回实例变量的值——然后保存此类文件\n\n\
  ```python\ndef talk( self ) :\n    return self.sound\n```\n\n![image](img/image00193.jpeg)你不能为\
  \ `self` 参数传递参数值，因为这是 Python 自动包含的。\n\n![image](img/image00188.jpeg)\n\n#### instance.py\n\
  \n![image](img/image00245.jpeg)通过使类文件的功能可用启动程序，然后显示其文档字符串\n\n```python\nfrom Bird\
  \ import ***\nprint( ‘\\nClass Instances Of:\\n’ , Bird.__doc__ )\n```\n\n![image](img/image00246.jpeg)接下来，添加一条语句创建类的实例，并将字符串参数值传递给其实例变量\n\
  \n```python\npolly = Bird( ‘Squawk, squawk!’ )\n```\n\n![image](img/image00247.jpeg)现在，显示此实例变量值并调用类方法显示公共类变量值\n\
  \n```python\nprint( ‘\\nNumber Of Birds:’ , polly.count )\nprint( ‘Polly Says:’\
  \ , polly.talk() )\n```\n\n![image](img/image00337.jpeg)\n\nBird 实例 – polly\n\n\
  ![image](img/image00248.jpeg)创建类的第二个实例，向其实例变量传递不同的字符串参数值\n\n```python\nharry = Bird(\
  \ ‘Tweet, tweet!’ )\n```\n\n![image](img/image00338.jpeg)最后，显示此实例变量值并调用类方法显示公共类变量值\n\
  \n```python\nprint( ‘\\nNumber Of Birds:’ , harry.count )\nprint( ‘Harry Says:’\
  \ , harry.talk() )\n```\n\n![image](img/image00339.jpeg)\n\nBird 实例 – harry\n\n\
  ![image](img/image00340.jpeg)保存两个文件后运行程序——看到创建的两个 Bird 实例\n\n![image](img/image00341.jpeg)类变量\
  \ `count` 可以通过 `Bird.count` 引用，但实例变量 `sound` 只能通过调用实例的 `talk()` 方法访问。\n\n### 处理属性\n\
  \n类的属性可以使用点符号随时添加、修改或删除。向现有属性赋值的语句将更新该值或创建一个新属性：\n\n`instance-name = value`\n\n\
  或者，你可以使用以下 Python 内置函数添加、修改或删除实例变量：\n\n* `getattr(instance-name , ‘attribute-name’)`\
  \ – 返回实例的属性值\n* `hasattr(instance-name , ‘attribute-name’)` – 如果实例存在属性值则返回 True，否则返回\
  \ False\n* `setattr(instance-name , ‘attribute-name’ , value)` – 更新现有属性或在实例创建新属性\n\
  * `delattr(instance-name , ‘attribute-name’)` – 从实例中删除属性\n\n传递这些内置函数的属性名必须放在引号内。Python\
  \ 自动提供的属性以下划线字符开头——因此这些不应被修改或删除。你可以这样命名自己的属性以表示私有性，但实际上它们可以像其他属性一样被修改。\n\n![image](img/image00188.jpeg)\n\
  \n#### address.py\n\n![image](img/image00241.jpeg)通过使创建的 Bird 类的功能启动新程序\n\n```python\n\
  from Bird import ***\n```\n\n![image](img/image00242.jpeg)接下来，创建一个实例，然后使用点符号添加一个带有赋值的新属性\n\
  \n```python\nchick = Bird( ‘Cheep, cheep!’ )\nchick.age = ‘1 week’\n```\n\n![image](img/image00243.jpeg)现在，显示两个实例变量属性中的值\n\
  \n```python\nprint( ‘\\nChick Says:’ , chick.talk() )\nprint( ‘Chick Age:’ , chick.age\
  \ )\n```\n\n![image](img/image00244.jpeg)然后，使用点符号修改新属性并显示其新值\n\n```python\nchick.age\
  \ = ‘2 weeks’\nprint( ‘Chick Now:’ , chick.age )\n```\n\n![image](img/image00245.jpeg)接下来，再次修改新属性，这次使用内置函数\n\
  \n```python\nsetattr( chick , ‘age’ , ‘3 weeks’ )\n```\n\n\n\n\n\n![image](img/image00246.jpeg)现在，使用内置函数显示所有非私有实例属性及其对应的值。\n\
  \n```python\nprint( ‘\\nChick Attributes...’ )\n\nfor attrib in dir( chick ) :\n\
  \    if attrib[0] != ‘_’ :\n        print( attrib , ‘:’ , getattr( chick , attrib\
  \ ) )\n```\n\n![image](img/image00247.jpeg)最后，删除新属性并使用内置函数确认其已删除。\n\n```python\n\
  delattr( chick , ‘age’ )\nprint( ‘\\nChick age Attribute?’ , hasattr( chick , ‘age’\
  \ ) )\n```\n\n![image](img/image00248.jpeg)保存并运行程序 – 查看实例属性被处理的过程。\n\n![image](img/image00342.jpeg)\n\
  \n![image](img/image00343.jpeg)\n\n鸟类实例 – 小鸡\n\n![image](img/image00193.jpeg)\n\n\
  此循环会跳过任何以下划线开头的属性，因此“私有”属性不会显示在列表中。\n\n### 派生类\n\nPython 类可以作为一个全新的类来创建（如之前的示例所示），也可以从现有类“派生”。重要的是，派生类会继承其所派生的父类（基类）的成员，同时还拥有它自己的成员。\n\
  \n从基类继承成员的能力允许创建派生类，这些类共享某些共同属性，这些属性已经在基类中定义了。例如，“多边形”（Polygon）基类可以定义所有多边形通用的宽度和高度属性。“矩形”（Rectangle）和“三角形”（Triangle）类可以从\
  \ `Polygon` 类派生 – 继承宽度和高度属性，同时拥有定义其自身独特特征的成员。\n\n![image](img/image00344.jpeg)\n\
  \n![image](img/image00345.jpeg)\n\n继承的优点非常强大，它是面向对象编程（OOP）的第二个原则。\n\n派生类的声明在类类名后添加\
  \ `()` 括号，用以指定其父基类的名称。\n\n![image](img/image00188.jpeg)\n\n`Polygon.py`\n\n![image](img/image00241.jpeg)创建一个新类文件，声明一个具有两个类变量和一个设置其值方法的基类。\n\
  \n```python\nclass Polygon :\nwidth = 0\nheight = 0\ndef set_values( self , width\
  \ , height ) :\n    Polygon.width = width\n    Polygon.height = height\n```\n\n\
  ![image](img/image00188.jpeg)\n\n`Rectangle.py`\n\n接下来，创建一个类文件，声明一个具有返回被处理过的类变量值之方法的派生类。\n\
  \n```python\nfrom Polygon import *\nclass Rectangle( Polygon ) :\n    def area(\
  \ self ) :\n        return self.width * self.height\n```\n\n![image](img/image00188.jpeg)\n\
  \n`Triangle.py`\n\n![image](img/image00243.jpeg)现在，创建另一个类文件，声明一个具有返回被处理过的类变量值之方法的派生类。\n\
  \n```python\nfrom Polygon import *\nclass Triangle( Polygon ) :\n    def area( self\
  \ ) :\n        return ( self.width * self.height ) / 2\n```\n\n![image](img/image00244.jpeg)保存这三个类文件，然后通过提供两个派生类的的功能启动一个新程序。\n\
  \n```python\nfrom Rectangle import *\nfrom Triangle import *\n```\n\n![image](img/image00245.jpeg)接下来，为每个派生类创建一个实例。\n\
  \n```python\nrect = Rectangle()\ntrey = Triangle()\n```\n\n![image](img/image00246.jpeg)现在，调用从基类继承的类方法，传递参数以赋值给类变量。\n\
  \n```python\nrect.set_values( 4 , 5 )\ntrey.set_values( 4 , 5 )\n```\n\n![image](img/image00247.jpeg)最后，显示处理从基类继承的类变量的结果。\n\
  \n```python\nprint( ‘Rectangle Area:’ , rect.area() )\nprint( ‘Triangle Area:’ ,\
  \ trey.area() )\n```\n\n![image](img/image00248.jpeg)保存并运行程序 – 查看使用继承特性显示的输出。\n\n\
  ![image](img/image00346.jpeg)\n\n![image](img/image00188.jpeg)\n\n`inherit.py`\n\
  \n![image](img/image00194.jpeg)\n\n一个类声明可以通过在声明名称后的括号中列出多个基类来派生自多个一个类。\n\n![image](img/image00215.jpeg)\n\
  \n不要混淆类实例和派生类 – 实例是类的拷贝，而派生类是一个继承其所派生的基类属性的新类。\n\n### 方法重写\n\n可以在派生类中声明一个方法来重写基类中匹配的方法\
  \ – 如果两个方法声明都具有相同的名称且列出的参数数量相同。这有效地隐藏了基类方法，除非显式使用基类名进行标识，否则它是不可访问的。\n\n当基类中的方法提供默认参数值时，可以在显式调用基类方法中使用它，或者通过重写方法提供替代值。\n\
  \n![image](img/image00188.jpeg)\n\n`Person.py`\n\n![image](img/image00241.jpeg)创建一个新类文件，声明一个具有两个类变量和一个设置其值方法的基类。\n\
  \n```python\nclass Person :\ndef __init__( self , name ) :\n    self.name = name\n\
  def speak( self , msg = ‘Calling Base’ ) :\n    print( self.name , msg )\n```\n\n\
  ![image](img/image00188.jpeg)\n\n`Man.py`\n\n![image](img/image00242.jpeg)接下来，创建一个类文件，声明一个具有重写基类方法的派生类。\n\
  \n```python\nfrom Person import *\nclass Man( Person ) :\n    def speak( self ,\
  \ msg ) :\n        print( self.name , ‘:\\tHello!’ , msg )\n```\n\n![image](img/image00188.jpeg)\n\
  \n`Hombre.py`\n\n![image](img/image00243.jpeg)现在，创建另一个类文件，声明一个具有再次重写基类相同方法的派生类。\n\
  \n```python\nfrom Person import *\nclass Hombre( Person ) :\n    def speak( self\
  \ , msg ) :\n        print( self.name , ‘:\\tHola!’ , msg )\n```\n\n![image](img/image00188.jpeg)\n\
  \n`override.py`\n\n![image](img/image00244.jpeg)保存这三个类文件，然后通过提供两个类的功能启动一个新程序。\n\n\
