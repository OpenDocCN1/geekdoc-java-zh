  md: '# LATE NIGHT, SATURDAY


    # Sydney


    The rich blue velvet curtain. The flags again, always the flags. Flags that will
    never feel a breeze, made to be hung indoors and propped with clips and tape.


    The prime minister-elect stands behind a lectern badged with the hotel''s logo.
    It has been a long day out, framed between those flags, he is perfectly attired
    and groomed. He plucks a folded speech from his pocket and sweeps his glasses
    onto his nose.


    The crowd is crammed into the room and it swells, individual voices calling above
    the ambient sound. The PM smiles in recognition of some of them, raising and lowering
    the palms to indicate he needs silence. But he can''t help smiling. The work is
    done, the faithful seek their reward.


    ''My friends...''


    Hysteria takes over. They are his friends, all of them.


    ''My friends.


    They want to hear it. They want to hear it so much that they contain themselves
    to create a silence into which he can deliver the words.


    ''I can confirm that we have been re-elected.


    Uproar. The camera flashes sparkle blue-white over the darkened floor like the
    night sky is inverted. Balloons and streamers appear from nowhere.'
