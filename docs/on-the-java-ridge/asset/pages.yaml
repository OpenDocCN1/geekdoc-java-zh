  md: '# PROLOGUE


    He stops again, scans the press pack, knowing his eyes are filling screens across
    the nation. Behind him the staffers are nodding furiously.


    I want to make this very clear: I will not have our personnel endangered by the
    reckless conduct of criminal people smugglers. So today I am proud to announce
    a significant new border security measure ahead of next week''s federal election.


    He waits just long enough, settles the cold breath in his lungs. From this point
    forward, no unidentified vessels in Australian territorial waters will be offered
    any form of maritime assistance. None. No contact will be made with these vessels
    on the open sea, either by the Border Integrity Unit or, indeed, the navy. Any
    future incursions into territorial waters will be met with remote measures by
    our private sector partners, Core Resolve.


    I want to repeat that for absolute clarity: there will be no further boarding
    parties, no rescues. Advertisements will be placed on Indonesian television, in
    print media and online. It will be made absolutely clear that unauthorised boat
    journeys into Australian waters are the sole responsibility of those who organise
    them.


    He pauses weighty once more. The experienced correspondents brace themselves for
    a new campaign talking point.


    No Australian will be placed in danger.


    The brief silence that meets these last words is suddenly strafed by a volley
    of shouted questions.


    Yes—Daniel.


    What if the people on board are seeking asylum and mean us no harm?


    Recent experience has shown we can never make that assumption. But in any case,
    the question doesn''t arise. Indonesian personnel will already have prevented
    their entry.


