    ‘Morning ladies and gentlemen, thank you for coming out. The minister is ready.
    Thanks for your patience.’


    He squints once at the light from above and begins.


    ‘Unauthorised boat arrivals have been a scourge on our society for many years,
    and for many years we have fought vigorously with a range of policies: mandatory
    detention, excision of territorial islands and tow-backs to name a few. The Bali
    Process has been in place for twenty years now.


    The countermeasures adopted by people smugglers have been brazen and ruthless.
    The destruction of personal documents, assaults upon the hardworking men and women
    of our Border Integrity Unit: even setting fire to their own vessels. January’s
    incident, in which a young Border Integrity officer was tragically killed while
    lawfully boarding such a vessel, is only the latest in the long series of outrages
    perpetrated by these people.


    ‘Plainly, a new way forward is required. Which is why, at the recent Jakarta Summit.
    I signed the diplomatic communique between Indonesia and Australia that transfers
