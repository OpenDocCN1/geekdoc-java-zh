    Cassius pushed hard to catch the bunch as it sped northeast on the Federal Highway.
    The last of the houses at Watson fell away behind as he reached the other riders.
    He took the stragglers first: the unfit ones, the ones on cheap bikes. The firm
    silence of carbon fibre and the wind under his helmet whispered predation: the
    feeling of taking down the weak, a finger raised on the bars as he passed. He
    stood on his pedals, pumping harder as the road steepened ahead of him. He could
    work past anyone on this ride: he knew them all. He could run cadences that would
    ruin them utterly, could push until he threw up if he had to. But the reality
    was he never had to.


