  md: '# PROLOGUE


    Six Australian flags hang rich and solemn, three each side of the doorway. The
    doors stand open. Beyond them is a corridor in gloom; before them, an empty lectern.
    The light of Canberra winter throws cold geometrics on the high walls: triangular
    shadows, blades of light.


    Closer, an overcoated herd circles on the damp flagstones. Breath suspended over
    busy phones, footfalls making darker patches on the frosted lawn as the dew works
    its way into open footwear. Cables snake forward between the huddles to microphones
    laid gently, like floral tributes. The walls spear high above the cluster. The
    crowd on the lawn, seen from a currawong''s eye, make dark specks on a green square.
    The day slowly dawning over the mountains sweeps sunlight, warm and generous,
    over the city; but it will reach this little enclave last of all.


    Three figures stride through the doorway, arranged in formation with the tallest
    in the centre. As they emerge the light strikes them. Two flanking acolytes a
    step behind the man at the apex: a tall man, lean and angular in a pale grey suit.
    The triangle of white between his lapels is so bright that the shirt surely never
    been worn before. Hair slightly receding but still a youthful brown, the bones
    of his face making a robust frame for his easy smile. An open face, for a politician.


    One of the two advisors is a woman in her twenties. She leans in'
