  md: '# ACKNOWLEDGMENTS


    After I''d finished a first draft of this story, Text''s Michelle Calligaro suggested
    I read Between Sky and Sea, the 1946 debut of Herz Bergner. When I reached the
    unforgettable end of that novel I wondered how mine could have followed such a
    similar arc. The answer, I feel, lies in the sad circularity of our political
    responses to refugees. We may have escalated the stakes over seven decades, but
    our indifference is nothing new.


    There are many people to thank for their valuable contributions to this book.
    On Indonesia, the operation of a surf charter boat, I''m indebted to Chris ''Scuzz''
    Scurah of Sumatra Surfariis—he was very relaxed about my persistent interest in
