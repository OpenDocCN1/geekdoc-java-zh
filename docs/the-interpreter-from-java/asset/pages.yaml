    The sky was clear, moonless and full of stars. Beside me sat a seaman from E Company,
    whose watch ended at three. The boy seemed very edgy but when he saw I was an
    Indo, he relaxed a little and began asking question after question about life
    in the Indies and the customs and traditions of its people. We spoke in whispers.


    When my watch was almost over, I went to dig another seaman in the ribs and tried
    to catch some more sleep, sitting because I could not face making up my bed again.
    Just as I was nodding off, the sound of both machine guns firing simultaneously
    jolted me awake. I grabbed my M1 and ran back to the guard post.


    ‘I got them! Two of them!’ my replacement shouted excitedly.

    Give me your flashlight. I’ll go and take a look,’ I shouted back.


    More marines came running. With the flashlight in my left hand and my M1 in my
    right, I stepped out into the road. Instead of a couple of dead pelopors, I saw
    the body of a water buffalo. Stone dead!’ I yelled back.


    Hey, you just shot a water buffalo. A few of the others came over to take a look
    and we creased up with laughter. The gunners looked more than a little sheepish.


    ‘Oh well,’ I chuckled, ‘it’s a better catch than that monkey I shot earlier.’


    Before long, a couple of cooks appeared with their helpers. Armed with butcher’s
