  md: '# Bamboo spears and Japanese lessons


    In a matter of days, I found a job as a mandor in the packing department of the
    Lie Sin sweet factory on Undaan Kulon, by a canal near our house. As a boy of
    seventeen, I was in charge of a group of thirty native women workers and had to
    monitor their production. The factory board consisted of five Japanese, two of
    them army officers. Each day before lunch, we all had to take part in a military
    drill. The company supplied everyone with a takeyari, a Japanese bamboo spear,
    and the exercises involved plenty of lunging and stabbing. The takeyari was a
    vicious weapon: it entered easily but took your victim''s insides with it when
    you pulled it out.


    It was a good time to join the company, as we were forced to stay after work and
    learn Japanese. The classes were taught in Malay by a cane-wielding army officer.
    Anyone caught slacking would feel its sting, whether they were male or female.
    I picked up Japanese with little difficulty; my lessons with the Chinese girl
    in Blitar had stood me in stead. The characters were different and simpler, but
    the system was the same. After six months I passed the exam and was awarded my
    diploma in Japanese with considerable pomp and ceremony. In addition to katakana
    and hiragana, I also knew over two-hundred kanji characters, enough to read Japanese
    newspapers reasonably well.


    Uncle Soon was delighted with this achievement, because it meant I could be deployed
    for espionage activities. He regularly supplied me with Japanese newspapers and
    messages from military operations in the Pacific and taught me how to interpret
    them. When the Japanese press wrote about heavy Allied losses, I was to assume
    they really meant losses suffered by the Japs.


    One day I arrived home looking deathly pale and bathed in sweat after cycling
    home at full speed. Mama asked me if I had been in another fight.


    ‘No,’ I answered, ‘I was followed by an Indo girl. I don’t know

