    # Head of Prisoner Interrogation at Surabaya HQ-II


    When Mojokerto was fully under our control, I was sent to Mojosari, where Surabaya
    Headquarters II of the Marine Brigade Security Service was located, SHQ-II for
    short. I was made Head of Prisoner Interrogation under the command of First Lieutenant
    Lichtenberg of the Marine Corps. My main task was to gather as much intelligence
    as possible regarding the enemy''s overall military situation in the areas around
    Pacet and Trawas. Before the war, both had been popular holiday resorts for colonial
    families.


    With a team of five interpreters at my disposal, I interrogated dozens of prisoners
    a day and had no qualms about the use of force. After a week of grinding out counterintelligence
    and intelligence reports based on these interrogations, I began to suffer from
    acute insomnia and Lieutenant Lichtenberg sent me to Surabaya for a few days''
    leave. I travelled by food truck and took a becak through the city to our home
    in Undaan Kulon.'
