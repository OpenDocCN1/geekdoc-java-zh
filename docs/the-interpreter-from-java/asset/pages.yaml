  md: '# THE INTERPRETER FROM JAVA


    # At the pictures


    Out of the blue – I’ve been about eighteen – you decided to take me out one night.
    Rare occurrence. Granted, it had been five years since we’d lived in the same
    house, since Child Services had taken me from you at the age of thirteen and –
    in your words – ‘deported’ me to the children’s home. Dutch grub they all fed
    us there, but when it came time to leave, the authorities saw fit to lodge me
    and my brother Phil with a family steeped in the ways of the Indies. Our landlady
    swarmed around as if the sun had never set on the empire. What the hell were Child
    Services playing at? Five years of buckling under to a Dutch regime only to be
    handed over to a family stuck in the colonial past.


    It was the same old battle every time you visited us at the children’s home. You
    insisted you wanted your kids back, that we were fighting one case after another,
    that we were ‘your blood’, that we belonged to you… there was no end to it. Phil
    tried to warn me, but I ignored his brotherly advice. I fled your stifling Indo
    lodgings and headed straight for the place you told I belonged. Tram to The Hague,
    a bus from Staatspoort Voorburg and Leiden to a brand-new housing scheme in Voorscheen,
    where I stood and rang your bell in a bleak and spotless doorway less than a mile
    from my old children’s home. You opened the door with an unforgettable welcome:


    “Why did you forsake out?”


    Jesus calling out to God the Father. Back then you were sleeping with the Bible
    under your pillow, you crazy bastard. The worst of it was, I honestly believed
    I had forsaken you. My photo pressed between the pages of your Bible – what was
    that about? Was I a bookmark in place of your dagger? You didn’t think I were
    praying for me, did you? Later I became convinced you stuck pins to two girlfriends
    of mine after I fled your home once and for all, and it made them cry. They thought
    I had lost my mind, though by that time they knew you weren’t exactly sane yourself:
    I brought those sweet American hippies back to your'
  merge: -1
