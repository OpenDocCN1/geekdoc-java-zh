  md: '# ALFRED BIRNEY


    *


    When I was twelve, you gave me a pen. An old-school fountain pen, complete with
    ink pot and pen wiper. A gift to assuage your guilt after you kicked me down the
    stairs and back up again in that sad little two-up two-down of ours in The Hague
    Southwest. One of those jerry-built neighbourhoods that would end up housing society''s
    outcasts fifty years on. Even, you know what you were doing when you gave me that
    pen. You saw more in me than you ever let on, with those oblique Asian ways of
    yours.


    You didn''t stop there. When I turned twelve to inundate me with books about the
    war. A slew of aircraft carriers, jet fighters and bombers in black and white.
    Honestly, Pa, I could see no beauty in those photos. Later, much later, I found
    out that not one of those history books could be trusted. Lousy propaganda, in
    praise of the technological advances in killing machines. I spoke of Police Actions:
    a veiled term for colonial war that no researcher, journalist or writer has succeeded
    in scrapping from those worthless schoolbooks. Dutch history is filed away in
    a separate set of bookcases. And then there are the hordes of Dutchmen who think
    history begins with World War Two and are happy to consign the rest to antiquity.
    These are the people I live among. How''s that for a life sentence? They think
    War Two ground to a halt on 5 May 1945. Sure it did, for the Dutch behind their
    dunes.


    Say, Pa, your mother was Chinese, wasn''t she? That makes half Chinese and me
    a quarter, following a path in my own DNA by loosing around in the I Ching, that
    mysterious Book of Changes. Hexagram 29 has this to say: ''It is only through
    repetition that the pupil makes the material his own.''


    Critical self-reflection is hard to come by in Holland. The Dutch bang on about
    slaves, coolies, migrant workers and the children of colonial love. Your lot arrived
    here as first-generation migrants from the Indies and the Dutch scattered throughout
    the land: back in the fifties one Indo family to every street was'
