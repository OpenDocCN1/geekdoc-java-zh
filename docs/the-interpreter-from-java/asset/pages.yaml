  md: '# A Dutch subject


    Not long after my refusal to adopt Indonesian nationality, I went to the government
    building on Pasar Besar to apply for a passport. A charming Indo girl at the counter
    was there to help me.


    “You require a passport for the Netherlands, Mr Nolan?” she asked sweetly.


    “I do indeed, Miss. Here is the court’s statement regarding the matter of my nationality.”


    “Oh, but Mr Nolan, the girl replied, ‘I see here that you have refused Indonesian
    nationality. Why, Sir? I have chosen to accept warga negara. A bright future awaits
    me here, as an Indonesian citizen. My father is an Indo and a member of the Indo-European
    Alliance. He has told me all kinds of terrible things about the Dutch government
    and the colonial administration in the Indies.”


    I had no desire to discuss my future with the daughter of a defector and asked
    the girl to help me obtain a passport for the Netherlands as quickly as possible.
