    I signed out with the NCO on duty. I ducked under the barrier,

    walked to Darmo Boulevard, and took a *becak* home.


    My mother looked troubled. ''When I see you like this,'' she said,

    ''I can’t help feeling that your life is in grave danger’


    ''Mama,'' I answered, ''in a few days’ time I am going on a major

    campaign. I do not know whether I will come back alike. But

    perhaps I will be able to liberate Ina and Ella from Malang’


    My mother took me to her bedroom and sat down on a chair. I

    kelt before her and laid my head in her lap. Mama prayed over\me, pleading with
    God to stand by me in all things. I felt her tears

    fall on my head as I prayed with her. When she was finished, Mama

    stood up. ''God bless you, Arto,'' she said. ''My blessing and

    prayers will be with you’


    With a sense of relief, I went to my bedroom and filled my

    knapsack with extra clothing, underwear and socks.


    At eight thirty in the evening, Babu Tenie served dinner and we

    took our places at the table. Uncle Soen and Karel were there too.

    After dinner, I took Karel aside and told him, ‘If you have not heard

    from me six weeks from today, you must assume that I have been

    killed’


    Karel turned pale, but nodded and said nothing.


    Around ten, I took my leave of Mama, Uncle Soen, Karel, Poppy,

    Babu Tenie and Kokkie Tas. I walked to Undaan Kulon and took a

    *becak* back to barracks.


