    I was soon exhausted from bearing the heavy weight on my shoulders in the full
    glare of the sun, so exhausted that my legs gave way beneath me. But when my knees
    started to bend, the pressure from the broomstick was agony. The only way to ease
    the pain was to straighten up and lift the dead weight of the beam. Whenever I
    moved, the Japs beat my ribs, my back and my stomach with sticks. I lost all sense
    of time and think only of death coming as a release. Then I went out cold.


    I woke up to find myself lying on a thin layer of coal in a box that was around
    six feet by three by two feet; wooden planks on all sides, sheets of corrugated
    iron above me. The sun was still shining and the air in the coal box was stifling
    and getting hotter by the minute. Sweat poured from my body, and my mouth was
    dry as sand. Again I lost consciousness. Later I woke up shivering and saw through
    the cracks between the planks that evening had come. I tried to get up and banged
    my head on the iron sheeting. I tried to lift it but could not find the strength.
    I collapsed onto the coal and fell asleep.


    The following afternoon I was dragged from the box and given another beating.
    Two Javanese women who worked in the kitchen were ordered to wash me as the grinning
    Kenpeit thugs looked on. With tears in their eyes, the women wiped me clean dirt
    and blood. When they were done, I was sent back to the welding shop to continue
    my work. In all that time I had been given nothing to eat or drink.


    # Chaos


    August 1945. The streets of Surabaya were full of Japanese soldiers looking worried
    and disheartened. Uncle Soen told me that the Japs lost control of New Guinea
    and that Allied troops had landed at Balikpapan. Not only that, but the Americans
    had occupied the Philippines. Uncle Soen spoke of a shift in the Indonesians''
    attitude to the Belandas and those who sympathized with them, and made'
