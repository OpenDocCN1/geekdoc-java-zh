  md: 'until he died. No one said a word. stamped on their chests until their ribs
    cracked. The other interpreters sat at their typewriters and hammered out the
    interrogation reports.


    Every day, alongside our military exercises, I had to interrogate prisoners with
    my fellow interpreters. Every interrogation involved the use of severe force and
    each time the torture I had suffered flashed before my eyes.


    When I was home on leave one weekend, Mama handed me a letter from the Military
    Service department of the General Staff of the Royal Netherlands Indies Army.
    On my return to Firefly Barracks, I reported to Captain Groeneveld with the letter
    and provided me with a cover letter stating that I was already in active service
    with the Marines. I was given permission to visit the KNIL Military Service office,
    not from the Red Bridge. I turned up in my utility uniform and the guard sent
    me to see a lieutenant. I tried to explain that I was unable to fulfil my military
    service with the KNIL because I was already in active service with the Marines,
    but he was having no of it and sent me to see the general. The man had just exploded.


    > ‘I will not accept this, Nolan!’ he screamed at me. ‘You will rule the day!
    I assure you of that!’


    > ‘I will rule the day as a marine, Sir, when I am sent to the front.’ ‘Out of
    my sight! Dismissed!’ he barked. ‘And never let me lay eyes on you again!’


    I sprang to attend, saluted, turned on my heels and marched out of his office
    feeling relieved. Even then, I had little respect for the KNIL’s fighting power.
    I had seen them run advanced on Surabaya. Back at barracks, I informed my senior
    officers that the matter had been resolved and I was free to resume training.


    The marines I encountered could be divided into three main categories. First there
    were the Sixteen Sixty-Fivers, who took their name from 1665, the year the Dutch
    Marine Corps was founded. They were professional marines with a six-year contract
    that was up for automatic renewal until they retired. I soon realized that most
    of them were the kind of soldier I needed to watch out for:'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# THE INTERPRETER FROM JAVA


    often petty, all too ready to open their big mouths, adept at sucking

    u to their superiors and shitting on those below them.


    The second category consisted of war volunteers on a three-

    year mutual contract. Trained in the United States, they were

    cheerful bunch on the whole, though aggressive and often spoiling

    for a fight. On paper, this was my category too, though I was on a

    one-year ''local'' contract that was extended automatically. Needless

    to say, it was also the category to which most of my good friends

    belonged.


    No provisions whatsoever were made for us interpreters. We\were handed our pay
    and that was. It barely occurred to us

    at the time, but if you were married with children and killed in

    action, your dependents had to dry their tears on nothing but an

    additional one month''s wages. Many a dead interpreter''s family

    must have been reduced to begging in the streets.


    The third category of marine were the conscripts. They had

    ugone a brief spell of conventional battle training in the

    Netherlands, before being marched onto a boat to the Indies to face

    the rigours of guerrilla warfare. These poorly prepared young lads

    accounted for most of our fatalities in later battles.


    # On patrol with the Marine Brigade Security Service


    On completing my intelligence training, I was assigned to

    Krembung as additional manpower for Marine Brigade Security

    Service, Detachment III. The quartermaster issued me with a camp

    bed, two blankets, a poncho, four hand grenades and four types of

    cridge for my M1 rifle. After an early breakfast, I loaded my gear

    to a truck stacked with food crates and we set off. The pals I had

    trained with we were stationed elsewhere.


    It was a dusty ride over bad roads from Wonokromo to

    Krembung, around twenty-five miles south of Surabaya, in the

    Porong Delta. On arrival, I reported to Detachment III, which

    was based in a governor''s residence near the sugar factory. The


    277'
