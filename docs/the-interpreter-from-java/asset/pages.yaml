    I was a schoolboy in class 2D of the Architecture department when the Japanese
    Air Force attacked Pearl Harbor. December 1941. The United States declared war
    on Japan, and the Netherlands followed suit. The Dutch declaration was read out
    to us by the headmaster. Needless to say, this pretty much put an end to our studies.
    All citizens of German and Japanese origin, including any mixed blood, were arrested
    and carted off to internment camps. Among them were German and Japanese classmates
    I never saw again. A Dutch boy from our school was called up to serve with the
    Dutch Royal Navy and became a gunner on the Surabaya, a coastal defence ship.
    He was killed when Japanese planes bombed Surabaya''s docks at Tanjung Perak.


    Through the school governors, I signed up for the Air Defence Service. Equipped
    with transmitters and receivers, I was regularly posted in the airport district
    of Darmo to report back by radio and telephone. Thanks to Jacob''s books and magazines,
    I was adept at recognizing aircraft. Air Defence supplied me with binoculars and
    a .36 Colt revolver, and I wore a green khaki uniform and beret. The Royal Netherlands
    East Indies Army, known to everyone the KNIL, was not exactly a force to be reckoned
    with and reinforcements came in the shape of Australian soldiers, who showed far
    greater bravery in taking on the Japanese invaders.


    Ads appeared in the local papers calling for youngsters aged fourteen and over
