    it just cowardice? Fear we might come over and do you in? It''s still three against
    one, pal. Only we''re bigger now, stronger, a far cry from the little lads we
    once were. I''m a halfway decent jujutsuka. Phil is a killing machine with a handful
    of black belts. Arti is a streetfighter. Give it your best shot, old man. During
    your last year in Holland – South Haarlem, another desperate hole – I heard you
    slept with an axe under your bed, scared Arti would turn up one night and punch
