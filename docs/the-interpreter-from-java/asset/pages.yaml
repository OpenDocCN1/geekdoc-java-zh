    The night drifted past. Dawn broke to reveal the contours of the Wundi, the torpedo
    boat Piet Hein and other Navy vessels. Feeling sluggish, I left my spot on the
    jeep, went down to the washrooms and took a refreshing bath, perhaps the last
    of my short life.


    Back at my bunk, I put on my utility uniform and buckled my belt. I got my marching
    pack ready for action and stowed the rest of my things in my transport pack. My
    comrades rubbed their sleepy eyes in astonishment at seeing me so early. I returned
    to the deck and ambled over to the bridge. I greeted Lieutenant Colonel Aberson
    of the Marine Corps, commander of 2-INBAT and Blue Column, to which I now belonged.
    Directly on landing, I was to travel with 2-INBAT’s assault platoon.


    Between six and half past it was ‘up and em’, then off to the galley for a meagre
    Dutch breakfast of coffee and a few slices of bread with ham and cheese. As an
    Indo, I was used to starting the day with nasi goreng, but I found myself a quiet
    place on the footboard of a truck and made the best of things. I rinsed my mug
    in the washrooms, put it in its holder and carefully placed the whole thing to
    my combat belt. In the galley, I asked the cook to pour some coffee into my water
    bottle.


    Between nine and ten in the morning, a Convair PBY Catalina boat belonging to
    the KNIL air force flew over, heading south towards the famous beach at Pasir
    Putih, where we were due to land. It was followed soon after by a couple of Fairey
    Firefly fighter-bombers. Before long, I saw them launch their rockets at'
