    a side street and were amazed to find Indonesian policemen directing traffic amid
    the chaos. They were trying to wave through a couple of heavy tanks. I recognized
    them as Japanese tanks from the time of the occupation, only now their guns were
    painted with the red-and-white of Sukarno’s Indonesia. I signalled to a corporal
    rifleman to load his M1 with anti-tank rounds. I led by example and fired four
    shots at the turret, which immediately stopped turning. I had taken out the gunner.
    The others took care of the second and third tanks.


    No sooner had the marines wiped the Indonesian policemen than hordes of Hizbullah
    fanatics came charging at us wielding'
