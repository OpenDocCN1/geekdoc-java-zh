  md: '# Alan Noland discovers his father’s memoirs and learns the truth about the
    violent man he despised.


    In this unsparing family history, Alan distils his father’s life in the Dutch
    East Indies into one furious utterance. He reads about his work as an interpreter
    during the war with Japan, his life as an assassin, and his ruthless murders of
    fellow Indonesians. He fled to the Netherlands to escape being executed as a traitor,
    and there he met Alan''s mother. As he reads his father’s story, Alan begins to
    understand how war transformed his father into the monster he knew.


    Birney exposes a crucial chapter in Dutch and European history that was deliberately
    concealed behind the ideological facade of post-war optimism. Readers of this
    superb novel will find that it reverberates long afterwards in their memory.


    > ''What a great novel, its language and storytelling so light but also raw and
    lyrical. Read this book.'' — ADRIAN VAN DIS


