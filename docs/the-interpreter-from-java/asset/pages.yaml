  md: '# Another round of torture


    Despite my threats, Liem went to straight to the bosses the next day and told
    them I had deliberately tampered with the bicycle frames. I was tipped off by
    Soedjarwo, Redjo''s assistant and close friend. I managed to hide my anxiety and
    fear, but I knew what was coming. This did not stop me using the blowtorch to
    weaken the ends of the tubes.


    It was high noon and the burning sun beat down mercilessly on Croc City. A pair
    of Kenpeit officers came into the workshop and ordered me to accompany them. I
    left my welding for what it was, stole a glance at Soedjarwo and Redjo and followed
    the two thugs to the boss''s office. Soedjarwo and Redjo gave me a thumbs up to
    wish courage.


    In the office, the boss asked me, ''Did you really tamper with the welding on
    those frames?''

    I looked at shitty Sakura Jap in the eye and shook my head. He flew into a rage
    and barked one after another at the Kenpeit officers. I was taken down to the
    courtyard of the office complex and made to strip to my underpants. One of the
    Kenpeit officers unfastened the metal scabbard from his belt, drew his samurai
    sword and laid it on a table. Then he raised the scabbard and began to beat me
    with it. Blows rained down on my whole body: my head, shoulders, arms and legs,
    my stomach, my ribs and my chest. The pain was so intense that tears poured down
    my cheeks, but I bit my lips to stop myself crying out. I was not able to give
    my torturers the satisfaction. Everything went black and I passed out. When I
    came to when bucket of water was thrown over me. The clerks and kitchen workers
    were made to watch. Anyone who turned away took a beating of their own. Here and
    there I could hear cries of sympathy, women sobbing and begging them to take pity
    on me. I was ordered to stand up. They placed a thick wooden beam on my shoulders
    and bound my arms to it. A broomstick was tied across the backs of my knees.'
