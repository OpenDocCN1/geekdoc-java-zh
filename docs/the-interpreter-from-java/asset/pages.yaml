    the Harley Davidson with its 1500 cc two-cylinder engine.


    I was out for a ride one day on Arjun Boulevard, when I met my old pal Nono Sloesen,
    dressed in the khaki uniform of the Dutch Marine Corps. He talked at great length
    about the special forces intelligence work he was doing for the Marine Brigade
    Security Service. I asked him how to join up and he advised me to report to a
    man named Mulder, a captain in the Marine Corps and also an Indo.


    The next morning I donned my police uniform, jumped on the Harley and rode to
    Firefly Barracks on Porongstraat in Wonokromo district. At the barrier, I asked
    the marine on duty if I could speak to the captain about enlisting. My request
    was granted and I parked my motorcycle next to the command building. A marine
    took to see me and proceeded to question me about my police duties. It did not
    take him long to find me wanting. He thought my appearance was too feminine and
    believed I had no place in a corps of hardened soldiers. I saluted and left his
    office.


    My hopes crushed, I got back on the Harley and Nono Sloesen''s house on Arjun
    Boulevard. He assured me that a change of command was due soon on and told me
    to try again when the new commander was installed in January 1947.


    At the end of a night shift in January, I went to the family home in the early
    hours of the morning, I took a refreshing bath and changed into fresh clothes.
    Babu Tenie made breakfast. Mama had woken and come to ask me what I was up to.
    When I told her I was planning to join the Marines, she protested. "I won''t have
    it!" The school has reopened – go back and finish your studies. You have a future
    to think of?'
