    trip to Intensive Care courtesy of my own bare hands. Twenty-five years of groaning
    under your iron fist, your paranoia followed by twenty-five years writing it all
    down in an unfinished book seem like a balance of sorts, but I''d rather spent
    forty-nine years living to the full and one year behind bars for inflicting grievous
    bodily harm on a former marine. No such luck: I am a noble being, a pen-wielding
    samurai who walks a gentler path, who strums his guitar and makes people smile.
    I have been cursed with an inquisitive nature, naive enough to think I can fathom
    the inner workings of an unhinged fascist. Perhaps you deserve that too, if only
    the pages that comprise your monument may expose Dutch history for the lie that
    it is.


    The movie is over. The director chisels his heroes'' faces in the clouds.


    # THE END


    (complete with bombastic crescendo)


    In your boyhood dreams, you must have pictured your own face up there. Forget
    it, Pa. The war-movie heaven those heroes fly off to only ever existed in Hollywood.'
