  md: '# ALFRED BIRNEY


    place one day and you took them for a couple of floozies, sent them packing without
    a second glance. You turfed out an American-Dutch friend of mine too. And all
    because he was black, racist loon that you are. That same friend later told me
    you were a madman, just like Ma had always said. I didn''t want to believe it.
    I''m afraid I still do not.


    And so you took me that Tuesday night. Who goes to the pictures on a Tuesday?
    We caught a bus in Voorschten, got off at Statspoor station and walked to the
    Odeon in Herengracht. They were showing an American action flick: five death-row
    inmates offered one last chance at freedom if they rescued some military boffin
    from the clutches of the Vietnamese. Raising hell they roared through the jungles
    of Vietnam on their motorbikes, the convicts were picked off one by one but against
    all odds the scientist saved. You stared spellbound at the screen; you a handful
    of simple souls dotted the cinema. You were forty-five, give or take—an age for
    contemplation, for self-reflection—yet you sat there like a little kid next to
    a whoathed motorbikes, who squeezed his eyes shut when one of the heroes was shot
    to pieces, snared by a vine, strung upside down, impaled on a bed of bamboo spears.
    Those Viet Cong and their booby traps! Grisly tactics aside, I secretly cheered
    them on. To me they were the underdogs, my blood brothers on the silver screen.
    You rooted for the gunho Yanks. Unease was I felt sitting next to you; perhaps
    you felt uneasy next to me. On the bus back to Voorschten not a word passed between
    us. I suppose I was trying to coax me out of my shell, stuck on my own in that
    suicide flat of yours listening to the radio all day while you were out at no
    clue, what what corner of the commuter belt that was, a horseshoe of four-story
    flats in a satellite town wedged between Leiden and The Hague, home to lonely
    men and women too timid to say hello when they passed on the street, office drones
    who spent their evenings watching TV alone.


    Guess what, Pa, life in Holland hasn''t changed. Thanks for settling in this cold
    country where life is as long as you have no need of warmth. Wise of you to live
    out your days in Spain. Or is'
