  md: '# THE INTERPRETER FROM JAVA


    pretty much feigning the quota. If they had stuck you all in a ghetto. The Hague
    Southwest would have become the place to be. We, the generations that followed,
    were be leaning out of windows and lounging on balconies, the mixed-blood remnants
    of the Dutch tropics, alive and still kicking. Saturday night would be one big
    jamboree, complete with Hawaiian music, Indo rock, kite flying and a tombola.
    Now the place is home to every ethnic minority under the sun and police patrol
    bright the streets.


    # Cesspit


    Even before the Allies had liberated the southern provinces towards the end of
    World War Two, the old slogan ''If the Indies fall, disaster calls'' echoed like
    a mantra through the Netherlands. The first shiploads of volunteer soldiers, recruited
    in Brabant and Limburg, were nowhere near enough to save a colony and a swift
    amendment to the constitution needed to put recruits in the firing line. Among
    them was your mother''s brother, Uncle Jan. Very much against his will, ''Our
    Jan'', as they called him back home in Helmond, found himself in the self-proclaimed
    Republic of Indonesia, feigning stomach cramps, nausea, and a complete aversion
    to the tropical heat of the second he arrived.


    My father was around twenty when he saw the Allies'' armoured cars roll into Surabaya,
    the city of his birth, and offered his services as an interpreter. Once the Japanese
    had capitulated and the Dutch arrived to take the reins from the Allies, he took
    up with the Marines. Regular Dutch soldiers played bumbling bit parts in their
    tales of heroism, unlike the Brits, Australians and above all the Gurhas he encountered.
    Those Dutch dopes – Belandas in the local lingo – thought nothing lighting a cigarette
    in the pitch dark with a stone''s throw away. Razing villages to the ground didn''t
    count as heroism. That was just of a marine''s job, nothing romantic about it.
    Romance only reared its head when a village wasn''t tor.'
