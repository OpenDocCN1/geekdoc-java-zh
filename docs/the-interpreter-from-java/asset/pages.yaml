  md: 'By this time it was late morning and the hot sun felt good on the crown of
    my head.


    Ben de Lima and I paid one last visit to the cemetery at Kembang Kuning. Barely
    able to contain our emotions, we walked past the graves of the fallen, many of
    them our mates. We paused at each headstone and prayed for a moment. I left Ben
    waiting at the gates to the military section, hurried over to my father''s grave
    a short distance away and took my leave of him with a murmured prayer.


    In silence, Ben de Lima and I walked down the driveway to the cemetery entrance
    and back to Darmo Boulevard. We got into a becak and continued our farewell tour,
    heading for Heemskerstraat in Undaan Kulon. Unfortunately Ella and Poppy were
    at work, but Mama was home.


    “Arto, my dearest son, Mama sobbed, ‘we both had to make this momentous decision
    but it was my that sealed our choice. It is better for you to live far from me
    than here death might come at any moment. You have sacrificed yourself for the
    Netherlands, a country entirely unknown to you, and now the Netherlands will receive
    you into its fold. Arto, once hard to build a future for yourself. You have spent
    many years at war and have fallen far behind your studies. Show the Nolan family
    that their illegitimate son is now the rightful bearer of another name and that
    you can succeed in Dutch society. In my prayers and in my soul, I will be with
    you.’


    With tears in my eyes I took Mama in my arms. All I could say was, ‘Oh Mama, I
    will not be gone forever. I will return. I want to be with you, Mama, Mama, to
    go on taking care of you. That is all that matters to me.’


    I knew it was a promise I could not keep.


    ‘Keep your heart strong, Mama. Pass on my goodbyes and best wishes to Ella and
    Poppy,’ I cried out at last.


    Babu Tenie and Kokkie Tas came to me in tears and embraced them both. These servants
    were far better people than all those folk who bragged about their European blood.'
