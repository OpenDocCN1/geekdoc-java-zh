    # The ravine


    Unable to sleep one night, I went out onto the veranda to chat and drink coffee
    with a couple of men from the kampong. Ben de Lima joined us. I found myself thinking
    about one of the mysterious, almost incredible stories Pah Tjiljih used to tell
    and I asked the villagers what night it was according to the Islamic calendar.
    This was in the early hours of Friday morning and they explained that it was jumat
    legi or ''sweet Friday''. I came up with the devilish plan of trying Pah Tjiljih
    had told me once. I went to the kitchen and found a lemon. Back on the veranda
    I said to Ben and the villagers, ''See those two dead bodies by the roadside,
    brought here on stretchers a few nights ago? Would you like to hear them groan
    in pain?


    The villagers knew instantly what I was talking about and nodded, but our lads
    looked skeptical.


    There were still some patches of dried blood on the spot where the stretchers
    had first been laid. I cut the lemon into pieces and squeezed the juice onto the
    blood. Before long, agonized groans rose up from the ground. Even Ben and I were
    chilled to the bone, and the hairs on the back of our necks stood on end. I had
    never done such a thing before but I had always believed what Pah Tjiljih had
    told me and it sent a shiver up my spine. The villagers heard the groans too and
    mumbled all manner of prayers for the salvation of the souls of the two terrorists
    who had been gunned down.


    Whether it was due to the hatred shown by Jan Abas, my grisly prank on jumat legi,
    or the excessively grueling patrols with Flash Gordon I do not know, but on one
    of those countless night patrols


