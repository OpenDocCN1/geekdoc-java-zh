    me promise to watch my words whenever I was in Indonesian company.


    Around this time, I struck up a bit of a friendship with a sympathetic chap of
    around twenty from the kampong behind our house in Undaan Kulon. Soedarsono was
    his name and I regularly used to drop in to see him and his family. He and his
    father were members of the Indonesian National Party. Soedarsono was honest with
    me. He knew my loyalty to the Dutch and my love for the House of Orange. Unlike
    Soen, Soedarsono told me to keep these feelings to myself. Soedarsono told me
    that if Japan capitulated, the Indonesian people would never again allow themselves
    to be colonized by the Dutch. Instead, Sukarno would declare an independent Republic
    of Indonesia. I did not know who Sukarno was, and Soedarsono told me a few things
    about him. Such was my ignorance of all things politics.


    Among the workforce at the bicycle factory, relations between the Indos and the
    Indonesians had taken a serious turn for the worse. The situation was explosive.
