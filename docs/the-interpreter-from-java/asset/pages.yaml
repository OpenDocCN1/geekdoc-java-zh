  md: '# THE INTERPRETER FROM JAVA


    The toilet had a wooden door with a heart-shaped hole at eye level. Ben had told
    him the Dutch marines called it a cesspit and that the restaurant''s Chinese owner
    had done his best to estimate the Dutch experience. It was lit by the feeble glow
    of an oil lamp and contained a raised pot with a lid on it, something Arto had
    never encountered before. He removed the lid, sat down and set about his business.


    He counted three before he heard the turut land far below him. He scooped water
