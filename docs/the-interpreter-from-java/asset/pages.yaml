    After the barrage, the boys from 2-INBAT’s assault platoon took their places for
    landing. Rope ladders were rolled out midships and the marines clambered down
    into the landing craft.


    Just as I was about to join them, Lieutenant Havik grabbed me by the shoulders.
    ‘ Nolan,’ he said, ‘head straight for the lower deck. I need one man in the first
    truck, directly before the Sherman tank. As soon as that truck hits the sand,
    your job will be to look out for enemy gunfire and warn the troops as they land.’


    This effectively made me a sitting duck, drawing enemy fire by revealing my position.
    Not the most enviable assignment.


    I rushed to my bunk, strapped on my marching pack, grabbed my M1 and my transport
    pack, and descended to the stifling heat of the lower deck, where the rolling
    stock were already warming up engines. I glanced in the direction of the landing
    point and saw that the Pelican was heading straight for it at speed. I climbed
    aboard the truck behind the Sherman tank. The driver was bathed in sweat. My own
    uniform, the Pelican scraped onto the burning sand. Its bow doors opened and a
    stiff breeze blew in. The tank rumbled down the heavy ramp onto the beach and
    started up the slight incline towards the Panarukan road. Our truck was right
    behind. I stood up and began scanning for flashes of gunfire among the trees that
    lined the coast road above the beach. I left a marine yelled, ‘Look out, right
    above you! A pelopor in the trees!’


    I spotted a shadow among the dense leaves and fired twice. Instead of a sniper,
    a big black monkey tumbled from the branches. I looked deflated, while every lad
    who saw it happen fell about laughing. For a moment they forgot the danger they
    were in.


