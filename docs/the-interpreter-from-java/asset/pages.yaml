    In one of the rooms, I found a beautiful Indonesian woman. She was sitting with
    tears in her eyes, shivering with fear. I prodded her chest with the barrel of
    my gun and snarled, ‘Where are your husband’s weapons? Hand over all the military
    and political documents in this house. Do not try to hide anything from me or
    I will blow your head off. Understood?’


    Trembling, she went over to a wardrobe and took out a Parabellum semi-automatic
    pistol and cartridges, a samurai sword and a thick briefcase.


    ‘Who were the men we shot?’ I asked.


    ‘The man you killed in the dining room was my husband,’ she sobbed. ‘He was an
    Indonesian Army captain. The four in the back of the house were his colleagues.’


    There was no time for sentiment. I called to my mates and we left.


    A little while later, we stumbled across an Indonesian Army barracks and were
    greeted by a volley of rifle and machine-gun fire.'
