    name, jotted down in error by another interpreter. Shocked, Jan slunk away and
    returned home, where the sad news plunged my family into grief.


    Meanwhile, I was on the train to Surabaya. On arrival, I should my transport pack
    and trudged out of Gubeng station. It was late afternoon but the heat was still
    stifling. I hailed a becac and slumped into the seat. The driver cycled slowly
    to Undaan Kulon, turned onto Heemskerstraat and stopped outside No. 5. I paid
    the man, slung my trusty M1 over my right shoulder and dragged my gear onto the
    porch. I could already see Mama sitting there. She looked up and saw the ghost
    of her son. The poor woman had already rolled up her mattress and burned incense
    in my room. I had to shake her to convince me I was real. She began to cry.


    I dumped my pack in my room, where the air was still thick with incense. In my
    confusion, I walked back into the dining room with my weapon in my hand. The babus
    came to greet me with tears of joy. Then, through the window, I saw a child of
    around two years old playing in the back garden. A girl with slanted eyes.


    ‘Who does that Japanese child belong to?’ I shouted, and aimed my rifle at her.
    When the babus saw what I was doing, they flung themselves at me. My gun went
    off and the bullet missed the little Jap girl.


    ‘Jangan sinjo Arto! Jangan sinjo Arto! Minta ampun, itu anak tidak salah!’ they
    begged. ‘No, Arto! Don’t! Have mercy, Arto. The child is innocent!’


    The two women clung to me so tightly that I could not raise my rifle. ‘Enough,
    Arto! Mama shouted reproachfully. ‘That child does nothing wrong! She was born
    to your sister Ella and Yoshida, the Sakura Japanese she went out with after Kamei
    was killed. Arto, I order you, do not lay a finger on that child!’


    ‘Where is Ella?’ I shouted furiously.


    ‘At the pasar!’ Mama told me how Dutch troops liberated Ella and Ina during the
    Police Action, and that Ina had moved to Batavia with her husband and children.


