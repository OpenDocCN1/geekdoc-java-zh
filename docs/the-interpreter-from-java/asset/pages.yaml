    flames. The blast catapulted lieutenant and driver from the jeep and left them
    badly wounded at the side of the road. The truck immediately behind the jeep hit
    a heavier mine and our truck was blown into the air along with it. Everyone was
    thrown clear. The other trucks managed to brake in time but we came under machine-gun-'
