    Soenarjo, Soetopo, Soarsmaso, Soetipto and Soarmarno. Knowing they had an entire
    people behind them, we were more inclined to risk acts of violence. I often went
    down to the port with them, armed with knuckledusters and fighting knives. With
    the curfew approaching, we would roam the docks in groups of four and pick a fight
    with Japanese soldiers on their way back to barracks. As soon as the Japs drew
    their swords in anger, we pounced. The Madurese among us slit their throats with
    crooked little knives. When the fighting was over, we would scatter and regroup
    at a secret address in Krembangan or Dapuan. There we tuned to the radios we had
    stashed away and caught up on events in the Pacific. News of Allied victories
    made us rowdy and we would head out again to hunt any lone Japanese soldiers we
    could find.


    When the Kenpeitai began to raid our neighbourhoods, we became more careful, dragging
    our ''victims'' bodies off to rubbish tips or burying them in places no Kenpeitai
    thug would think to look.


    # Sabotage at the bicycle factory


    Towards the end of 1944, I was put to working in the welding shop of a large bicycle
    factory on Pasar Besar. The chief welder was a shady character called Liem, a
    bootlick on very good terms with some of the Japanese foremen and the directors.
    It was my job to make bike frames to Japanese specifications. The storeroom behind
    the welding shop was piled high with old, half-rusted European'
