  md: '# ALFRED BIRNEY


    that was stirring in Sukarno''s back yard. He was on a blacklist. The war had
    been decided, Arto had lost, decolonization could begin. Ship after ship packed
    with servicemen and civilians left for Dutch shores. Dashing Arto was ordered
    to remain within the confines of the barracks. Help came in the shape of a Dutch
    captain, a shadowy figure without whose network he would never have been able
    to escape his homeland, where the only future that awaited him was in the belly
    of a crocodile.


    Days before his departure, during the quiet, less dangerous hours of the afternoon,
    Arto swore farewell to his mother, the cook and the housemaid. The rest of his
    family were absent. That evening sneaked out of the barracks with Ben de Lima,
    an Ambonese pal, who knew a good Chinese place on Embong Malang. Ben swore the
    best pork in town, perhaps in East Java, if not the whole island. He also claimed
    to know the Chinese chef''s secret, by he buckled and kept it to himself.


    > I''ll find out,'' said Arto. Just wait. There''s no keeping a secret from me,
    you know that. Whenever you couldn''t get those bastards to talk you came to me,
    remember?


    Arto was referring to the interrogation techniques he employed to loosen the tongues
    of Indonesian prisoners. In respect, he had always been superior to good-hearted
    Ben de Lima. The two men had a long voyage ahead of them. There was more than
    enough time to make Ben spill the beans.


    Ben nodded indently; all he wanted to do was to eat and forget. Before long, Arto
    was forced to admit his friend right: he had never eaten more succulent pork in
    his life. It was a small, nondescript restaurant, a little off the beaten track,
    with a side entrance you would walk right past if you didn''t know it was there.
    Beyond the dining room was a courtyard teeming with cockroaches. Night shadows
    crowded around the dim light of bare bulbs orbited by buzzing insects. Nothing
    unusual about that, Arto had been rattled by the news that people were out to
    get him and had to suppress the urge to ask Ben to escort him to the kamar kecil.'
