    # Near death


    I was a baby, ten months old, when a wound behind my right ear began to fester
    and I was soon at death''s door. Prominent physicians and acquaintances of Papa’s
    – Dr Markovovitch, a Hungarian, and Dr De Vries, a Dutchman – gave me up for dead.
    My mother could not bear to see me die. She summoned her younger brother Soen
    Thjwan, Uncle Soen for short, and told him to seek me to her family in the country.
    Uncle Soen swaddled me in rags and an old sarong and took the train to Blitar.
    There was to seek the help of Aunty Mien, his sister Sie Mien NIO, who would attempt
    to heal me with all kinds of wild herbs. If this failed, he was to bury me in
    a secret place deep in the jungle.


    It took over two years, I was cured and Uncle Soen brought me back to my mother
    in Surabaya. She spooned cod-liver oil over me three times a day. I loathed the
    stuff, but if I refused to take it she would beat me. On Papa’s orders my head
    was shaved. He believed a bald head would make me a better scholar, though what
    is there for a child of three to learn? Until my twelfth birthday, I had to walk
    around bald headed. The other children threw stones at me.


    My older brother Jacob was fourteen years my senior, my twin sisters Ella and
    Ina were twelve years old, and my brother Karel eight. Of the five of us, I had
    the darkest skin, and so my brothers and sisters often bullied and beat me. They
    liked to insinate that I had been fathered by an Indian. Karel and both my sisters
    had a slight slant to their eyes that betrayed their Chinese blood; Jacob and
    I did not. Of course, they never dared treat Jacob the way they treated me, as
    he was the eldest and ruled the roost in his father’s absence.


    At that time my mother was a follower of the Kong Hu Cu, the teachings of Confucius.
