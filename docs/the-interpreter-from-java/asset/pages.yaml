  md: 'We had to fight tooth and nail to gain control of the compound, one block at
    a time. I fixed my bayonet to my rifle, ready for man-to-man combat but the marines
    had no time to waste and wiped out the machine-gun posts with grenades and mortar
    shells so we could get on sweeping the site. When it was all over, I trudged back
    to the truck, feeling suddenly exhausted and sickened by all the killing. At the
    outset I had carved a notch into the butt of my gun for every life I took, but
    by this time I had lost count. How many had I killed? A hundred? More? Yet I felt
    no remorse, except for the woman and her child. I was simply taking revenge for
    everything the Indonesians had done to me and those like me. I did not yet know
    how much killing had left in me.


    The main force of Blue Column advanced on the centre of Jember, and most of the
    Marine Brigade Security boys from SHQ-II went with them. I stayed with the assault
    platoon and E and F Companies. We stuck to the outskirts and at downfall we set
    camp in a suburb, having cleared the area of extremists first.


    We established a string of guard posts and tried to snatch some shut-eye in dry
    gulleys and by the sides of roads. My helmet was my pillow. But sleep was denied
    us. Shots rang out in the middle of the night, and we were fired at close range
    and then from further off. One was wide-awake and no one had even an hour’s rest.
    When dawn broke, we were all miserable. There was no coffee. We had to make do
    K rations and the filtered ditch water in our bottles. By way of breakfast, I
    cracked open a tin of chili con carne. It tasted fairly spicy and I did provide
