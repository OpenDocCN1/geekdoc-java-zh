  pgno: 293
- img_proc: true
  md: '# THE INTERPRETER FROM JAVA


    As soon as I arrived, I took an invigorating bath, after which Mama treated me
    to a delicious meal. While we ate, Mama asked me to recount my experiences. Curious
    to hear more, Babu Tenie and Kokkie Tas hovered close until I ordered them to
    join us at the table. Though taken aback, they both obeyed. It was unheard of
    servants to sit at the family table and they did not know quite what to do with
    themselves, but I reassured them and soon they were eating with us. Mama laughed
    and did not seem to mind. Of course, I gave them only the sketchiest account of
    my exploits. The meal over, I retired to my room, collapsed on the divan and fell
    into a deep sleep.


    In the tropics, night falls within ten minutes at around six in the evening and
    that was when Babu Tenie woke me. I took a bath, but on my khaki dress uniform
    and stroled over the Marines Club on Tunjungan, a thirty-minute walk. I ordered
    a tray of drinks and found myself a quiet spot at the back of the dance hall.
    The atmosphere was good. They were spinning tunes by Glenn Miller and Benny Goodman
    on the gramophone. I steadily drained one glass after another.


    After a few days, I reported to Firefly Barracks and was duly dispatched to Mojosari.
    ''Good break, Nolan!'' Lieutenant Lichten asked on my arrival. ''You look rested
    at least. Preparations are under way for the big push to Pacet and Trawas. Make
    sure you have sufficient ammunition and grenades, then help the others pack up
    the intelligence records and prepare them for transport.''


    The day came when all Marine units, including the Security Service, were ready
    for action. I was once ordered to join the vanguard and climbed onto the first
    truck of the column, already full of lads from the assault platoon. ''Welcome
    aboard, Intel!'' they said and broke into the battle song of the US Marine Corps.


    We were led off by three Greyhound armoured cars and two Sherman tanks from the
    Heavy Artillery Company. Then came the first truck, with me on board, followed
    by the Marine Brigade''s second infantry battalion. As we headed south in the
    early morning


    283'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# ALFRED BIRNEY


    and left Mojosaris behind us, the road began to rise beneath wheels. The mountainous
    terrain was magnificent but with came the danger of snipers. We passed deep ravines
    and walls of sheer rock. No one said much. Some of the men smoked nervously. I
    maintained an icy calm and kept a sharp lookout in all directions. My M1 rifle
    was primed and loaded with anti-tank rounds, which could pass through walls and
    the trunks of young trees.


    A couple of Fairey Firefly fighter-bombers escorted us on the way to our objectives
    in Pacet and Trawas. They launched rockets at enemy positions here and, after
    which our Demolition Group had to spring into action to make sure they did not
    pose a threat: a time-consuming process. Those boys usually had to perform this
    dangerous work under sniper fire. When the bullets began to fly, we leapt out
    of the truck and fanned out on both sides of the road to provide cover. By chance,
    I spotted a sniper in a tree at the edge of a ravine 200 yards away, my carbine
    aimed at one of our mine disposal squad. Without a second''s hesitation I pulled
    the trigger of my M1 and fired three shots in quick succession. The carbine fell
    from the first tree, then the pemuda.


    ‘Good shot!'' someone shouted.


    Then all hell broke loose. From behind rocks on the slopes around us, the enemy
    let rip with light artillery and small mortar shells. Almost to a man we jumped
    from the trucks, for cover and began returning fire. A single BAR gunner per truck
    stayed behind. Everywhere on the mountainside and against rocks I saw pemudas
    being blown to bits. Latching onto the assault troops, I pressed ahead of the
    column,ing deeper into hostile territory. We stumbled upon a nest of pemuda resistance,
    one of them armed with a Japanese Taisho machine gun. We dispersed rapidly and
    gunned all five of them down.


    After a mile of walking and shooting, we reached a ramshackle bridge that spanned
    a deep ravine. The railing had been knocked away. The town of Pacet was already
    visible on the other side.


    ‘There lies our first objective,’ I said to a few of the lads in the platoon.'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# THE INTERPRETER FROM JAVA


    The sergeant came stood next to me. ''Damn it,'' he said, ''that bridge is in
    bad shape. Wait here. I''ll go back to the column alone and put this to the commander.''


    Thirty minutes later, the column arrived. Assisted by the boys from the Engineering
    Corps, the commander examined the construction and the state of the bridge. After
    weighing our options for a while, it was decided that a single Sherman tank should
    cross first. When it reached the other side safely, two followed. I jumped aboard
    the second tank. The way across I could feel the bridge swaying under the heavy
    weight. The remainder of the column followed. Only the drivers remained in the
    trucks, while the rest crossed on foot.


    The hills of Pacet were studded with splendid bungalows, once the property of
    wealthy colonists and the Indo elite. Now they stood abandoned and shot to pieces.
    I searched each building for military documents and translated the few I found
    for the column commander. This yielded some information on where to expect pockets
    of resistance as we advanced towards Trawas.


    In great haste, a sick bay for wounded marines was set up in one of the larger
    bungalows and a detachment of marines stayed behind, occupying the buildings that
    were relatively intact. The main force advanced the extra mile to Trawas, which
    was already taking a pounding from our Fairey Fireflies. As we approached the
    town, our party – which included a number of journalists and one or two representatives
    of the UN Committee of God Offices – came under intense fire from Japanese knee
    mortars and machine-gun posts in the sawahs, well camouflaged among the plantain
    trees.


    I was among the dozens of marines who leapt from the road into the sawahs below
    opened fire on the enemy. A likeable Frisian lad was running not far from me.
    I caught sight of a gunman hiding behind a couple of plantain trees some two hundred
    yards away and, raising my M1 in a reflex, shot him in the head. Not quickly enough:
    my Frisian comrade fell down without so much as a whimper. Blood and brains spilled
    out as I pulled him'
