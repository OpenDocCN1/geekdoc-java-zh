  md: '# ALFRED BIRNEY


    At the end of the war, a number of Special Service Employees defected to the other
    side, and the Indonesians cobbled together a blacklist from the names in the defectors’
    notebooks. Pa’s name was on there. So was the name of the kenpō teacher. When
    the first Special Service Employees were murdered, an unwritten law kicked in:
    ''once a marine, always a marine''. They may not have been marines, but the SSE
    boys were colleagues, comrades. And so the marines took them under their wing,
    without government permission needless to say. It was left up to Pa to fetch them
    from their homes, risking his life in the process, but at least the Navy commanders
    decided to fetch the SSE boys out of East Java, knowing it couldn''t be left to
    some Queen’s envoy or other. It was the Marine Corps who made sure Pa was decorated,
    a tribute from his comrades.


    Several dozen Special Service Employees came to the Netherlands. Others went to
    New Guinea and wound God knows where. In any case they were scattered to the four
    winds and their history was never told. The rest were dead.


    Read the history books and you’d swear the war in Indonesia was all about the
