    A man in a grey hat and a Loden overcoat passes us by and tells us we need a good
    wash. We nearly rub our little brown eyes out of our little brown heads and stare
    after him in amazement.


    > ‘Oh, let those folk say what they like,’ says Mama Helmond without looking up
    from her granite kitchen counter.


