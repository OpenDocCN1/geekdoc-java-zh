    Much relieved, I left the court building, hailed a becak and rode back to Willemsoord
    Barracks in Darmo district.

    It later transpired that legal procedures of this kind had to be initiated for
    almost all Indo-Dutch, on the orders of the government in The Hague, with the
    aim of ensuring that as many Indos as possible would assimilate into the Indonesian
    population. For me, this would have been an act of high treason.


    # In cahoots with the enemy


    January 1950 was nearly at an end. Almost all of my comrades had been shipped
    off to New Guinea and I wondered how they were getting on there. When not on duty,
    Ben de Lima and I could be found in the city. Our first stop was the southern
    district telephone exchange, more specifically the adjacent pavilion where Evelyn
    Preyers lived, with her sister and sister''s fiancé. Evelyn and I were very much
    in love but I could not ask her to marry me. She already knew that I would soon
    have to leave this beautiful country. Ben de Lima had told me too much for my
    liking about the role I had played in the Marine Brigade Security Service, even
    that my name was on Sukarno''s blacklist. Often with tears in eyes, Evelyn begged
    me to stay and make a new life with her. Her tears were hard to resist, and I
    held her close and promised her the moon. But I knew ultimately I would have to
    leave her. My mother''s words of warning about falling for an Indo girl were also
    playing on my mind.


    Above all, my heart was still full of hatred and the desire to take revenge on
    the pelopors of the Indonesian Army. I was determined to fight on, if need be
