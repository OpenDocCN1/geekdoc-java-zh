  md: '# ALFRED BIRNEY


    ‘No, don’t. I’ve got a sweetheart in that kampong!’n‘Hey, those girl swears she’d
    had a baby by a cousin of mine, ha ha! those Belandas fuck themselves silly over
    here. Will us Indos get the same privileges in Holland? Weird, isn''t it: the
    Belandas hit their women. Hear that? In Holland the women hit the men! The girls
    over there are tough as nails, *duh!*’


    \nEast Java. Bodies never floated in the *kali*. Crocodiles still swam there.
    By the time Police Action No. 1 was under way, Our Jan had found himself a berth
    on a ship bound for home, the sly dog. He wiped the crocodile tears from his kisser
    and whistled tunes of nostalgia through his porthole. From the truck that drove
    him down to the docks, he had chuckled his correspondence book at a bunch of local
    interpreters for a laugh. It eventually fell into my father’s hands and became
    his most treasured possession. The lads from Limburg and Brabant wanted to wave
    those books around, brimming with photos and addresses of beguiling Dutch girls
    eager to brave young men out in the tropics: goddesses in the eyes of every Indo.


    My father’s Chinese mother had given him a Germanic name: Arend, which means eagle.
    But Java being a place where names are readily corrupted, most people just called
    him Arto. It was only in Holland that his surname was restored to him, by us,
    his children. We added the definite article for good measure: the Eagle. Calling
    your father by his given name was unheard of. Back then, we didn’t even call him
    Pa. He was something else entirely.

    Before we arrived on the scene, Arto had managed to charm no less than three Dutch
    women with the photos and letters he sent from East Java: a cultured lady from
    Amsterdam who had her picture taken on a soaring staircase in a high-class photo
    studio; a middle-class woman from The Hague who posed with a parasol in front
    of the splendid Kurhaus Hotel; and a heffalump with a cheery smile from the southern
    town of Helmond, the Kediri of the Netherlands if you will. Kediri being the town
    in East Java where Arto’s mother was born.

    The lady from Amsterdam sent impeccably calligraphhed letters'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'in green ink, tied with lilac bows. The woman from The Hague used a typewriter
    on which the e and the o had worn away, a forthcoming good made by the fact that
    she could reach speeds of up to two hundred strokes a minute, or so she said.
    This was a skill Arto envied, since the interrogation reports he had to bang out
    on rolls of paper were often the length of his arm, verbatim accounts of the agonized
    cries of Indonesian resistance fighters they were tortured by the Dutch marines
    and their interpreters.


    Arto belonged to a group of ''native'' interpreters. He could speak and write
    Dutch, English, French, German, High Javanese, Middle Javanese, Low Javanese,
    Madurese, Sundanese, Chinese Pidgin, Cantonese, Japanese, Arabic, and of course,
    Malay, the lingua franca of the Archipelago''s coastal regions. The heaffump from
    Helmond was wowed by aback by her childish handwriting, idiotic punctuation and
    inane comments. He let a marine chum from Brabant read her letters and he said
    she must be left-handed, explaining that in Holland everyone who wrote with their
    left hand was made to switch to their right. It was the Brabant boy''s considered
    opinion that left-handed women made the best lovers. Based on his own experience
    and even so far as to spurn the advances of right-handed women.


    The Helmond heaffump had a couple of sisters, the prettiest of whom was a dashing
    young man from the tropics. Her name was Riek and she dictated phrases to her
    elder sister, the heaffump, such as ''them eyes o'' yours don''t half make me
    melt like butter.


    ‘That''s barely even Dutch,’ grinned the marine from Brabant, sitting beside Arto
    as they battled along an armoured vehicle during Police Action No. 1. Seconds
    later, dashing Arto hit a landmine and was thrown 250 feet into a ravine. To his
    dismay, the spinal injuries he sustained prevented him from taking part in Police
    Action No. 2. For a time he lay low at Willemsoord Barracks in Surabaya, going
    out on the town once in a while, until he began to hear his name carried with
    increasing frequency on the wind'
