  md: '# ALFRED BIRNEY


    *


    Our holiday at end, we once again had to board a waiting troop ship. As evening
    fell, the old tub sailed slowly out of Denpasar harbour and back through the Straits
    of Bali and Madura, with the port of Tanjung Perak as our final destination.


    Early the next morning, we were piped up on deck for the mandatory prick parade.
    After leave on Bali, every marine had to strip down to his green vest and underpants
    and line up for a rubber-gloved medical officer followed by four orderlies bearing
    large trays of 606 syringes to combat venereal disease. They were followed by
    an admin sergeant major clutching a register and a fountain pen. Each man in turn
    was required to present himself to the doctor for inspection. As soon as the doctor
    uttered the word ‘positive’, the sergeant took down name, registration number
    and unit as the poor sod stole himself for a painful jab in the buttock. Every
    man serving with a naval unit was required to report to the medical department
    for disinfection within twenty-four hours of sex with a woman of easy virtue.
    ‘Paying their dues’ we called it, as the cost of any such treatment was duly noted
    and deducted from the sailor’s wages.


    Late that afternoon, the ship sailed into port and was moored at Ujung docks.
    On disembarking, we lined up on the quayside and the transport commander ordered
    all those booked by the medics to step forward. A good forty per cent did just
    that. For it was quick march to the waiting Tapeworm Express and a costly trip
    to the navy hospital at Karang Menganan in Surabaya. The rest of us were driven
    to our respective barracks: Firefly Barracks on Porongstraat for us Marine Brigade
    Security lads and Willemsoord Barracks on Jambistraat for F Company. The holiday
    was over, the prelude to a tough assignment ahead.'
