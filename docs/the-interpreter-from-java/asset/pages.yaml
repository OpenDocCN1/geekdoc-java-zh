    I tumbled eighty yards into a deep ravine. I no longer remember how many infantrymen
    it took to rescue me from my plight and haul me back up again.


    My landing had been so awkward that the pain in my injured back flared like never
    before. Sergeant Gio Montagne packed me off to Lumajang on the next mail and supplies
    truck, where I signed off with First Lieutenant Lichtenberg of the Marine Corps
    at SHQ-III. After the standard administrative rigole, a jeep was arranged to take
    me to the sick bay. I folded out my camp bed in a ward with five other marines
    with non-critical injuries. The medical officer in attendance, Dr Verbeek, was
    assisted by a senior nursing officer with the rank of sergeant.


    One ward down from us were six Madurese soldiers from the KNIL Tjakra Brigade.
    They had not been wounded in action but were being treated for venereal diseases
    contracted by messing around with loose women in and around Lumajang. Madurese
    soldiers had a fearsome reputation as fighters who were not to be trifled with,
    but before long I was on fairly good terms with them. We traded native goods,
    with Dutch boys treating the Madurese to cheese and other typically Dutch fare.


    There was a lack of medical equipment at the sick bay. They had no X-ray machines
    or infra-red lamps. Every other day, Dr Verbeek gave me injections to combat my
    fever. It was a damnable treatment. I received a jab after breakfast and then
    lay on my bed shivering to the bone, despite the blankets piled on me by my fellow
    soldiers. After an hour or two the fever would subside, leaving me completely
    exhausted. My mouth was dry as sand and though I was dying with thirst, I had
    no appetite at all. By evening my body was burning up and I was delirious as if
    a fever dream had taken hold of me. The medic appeared every now and then give
    me two vitamin tablets. This went on all week and I was supposed to lie flat on
    my back as much as possible.


    One feverish night, after hours spent tossing and turning, I went outside and
    lay on a low wall by the porch. Suddenly, all hell broke loose among the Madurese
    lads on the VD ward. Crazed


