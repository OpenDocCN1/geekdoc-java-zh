    It was gone six in the evening and already dark by Babu Tenie woke me. Feeling
    listless, I got up and took a refreshing bath, then put on my khaki dress uniform
    and headed for the Marines Club on Tunjangan. I went straight to the bar and ordered
    ten shots of brandy. The Indo barmaid looked me up and down and and said, ‘I only
    serve blond, blue-eyed Dutch boys.’


    Furious, I went in search of the manager and complained about the conduct of his
    personnel. He was too angry and took the girl to this task. ‘Hey, are you refusing
    to serve this marine because his hair is not blond and his eyes are not blue?
    What kind of nonsense is this? Serve him this minute, or take your things and
