    The exodus of most of the former Marine Brigade Security Service personnel for
    New Guinea began at Christmas Eve 1949. The transition camp for former intel personnel
    and their families was a hive of activity. Everyone was busy packing and preparing
    for the voyage. They were due to leave Willemsoord Barracks that evening, under
    cover of darkness. A great many trucks, including the Marine Brigade''s Tapeworm
    Express, had been commissioned. Everyone said their goodbyes with the hope of
    meeting again in a dim and distant future. It felt unreal to be taking leave of
    so many of my intel comrades.


    Escorted by countless Military Police in jeeps and on motorbikes, the column wound
    its way to the naval docks at Ujung. There a couple of ships lay at anchor, ready
    to take the evacuees to New Guinea where, after arriving in Hollandia, they would
    be dispersed across the island. My heart went out to those boys and their families
    as they set sail for a destination unknown to them.


    Four members of the Marine Brigade Security Service stayed behind: Ben de Lima,
    Harry Rijckaerdt, Jonker Laperia and me. None of us knew which transport ship
    would give us passage to the Netherlands.


