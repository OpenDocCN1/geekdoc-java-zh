    Firefly, January 1948


    # FAREWELL AND REMEMBRANCE


    To all those who regard the Firefly as their emblem.


    Should you re-read this brief letter at some later date, may it give you to look
    back and reflect on all the comrades with whom you have shared the bitter and
    the sweet under the name Firefly. And as you look back, be sure to remember those
    who made the greatest sacrifice a man can make, and who did so for you and the
    cause for which we fought. Our thoughts turn to them, for they have borne the
    consequences of their ideals.


    I reflect on the time we have shared in the deep conviction that we have worked
    in accordance with our beliefs and to the best of our knowledge. Duty, comradeship
    and honour: these three, in harmony with one another, have been our guides. Of
    course we have made all mistakes, most arising from the fact that error is inherent
    in the works of man and is therefore to be forgiven. Was it not our ideal to achieve
    perfection? Each of us knows for himself how close he came. The earliest memories
    of our small community lie in the United States, then in Malacca and then in our
    vision of the Indies. Those same Indies have brought us so many disappointments,
    yet have also made us men able and willing to bear responsibility under the most
    trying of circumstances, without the luxury of falling back on others.


    In the States the Firefly was born, in Malacca it was baptized, and in the Indies
    it came to life and showed us the


