    serviceman was beginning to feel that he had fought for nothing. Commands, routine
    orders and marching orders were relaxed. The intelligence units of the Marine
    Brigade Security Service and the KNIL switched their focus to gathering political
    intelligence instead of military intelligence, though the enemy were constantly
    breaching the truce and continued to wage their guerrilla war. More than ever,
    Surabaya found itself confronted with an influx of Indonesian Army infiltrators
    and other militants.


    Interpreters and marines continued to lose their lives, and we laid them to rest
    in the Marine cemetery. A sense of defeat began to weigh on us.


    My father was buried not far from the military cemetery. I paid regular visits
    to tend his grave, pray and put fresh flowers in the marble vases by his headstone.


    At this time my duties mainly consisted of office work: interrogating prisoners
    and translating political pamphlets and documents. In the evening, I engaged in
    counter-espionage and went on the occasional raid patrol.


