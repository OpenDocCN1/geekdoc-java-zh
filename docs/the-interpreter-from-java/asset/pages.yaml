  md: 'I let Mama say her piece and went down to Firefly Barracks a second time. Again
    I reported to the guard on duty and this time I was taken to see the new commander,
    Captain Rob Groeneveld of the Marine Corps. I stood to attention and saluted him.
    The captain held out his hand and introduced himself. He struck me as a friendly
    chap and asked me all kinds of questions about my past under the Japanese occupation
    and during the Bersiap period at the start of the Indonesian revolution. A first
    lieutenant of the Marine Corps was present throughout. We spoke for an hour, after
    which I was introduced to the senior interpreters Piet Dikotta and Bert Melijn.
    Piet Dikotta I already knew from the AMA Police under British command. Captain
    Groeneveld declared that I could start work immediately. He summoned his senior
    NCO, Sergeant Major Vastijk of the Marine Corps, to sort out the contracts. Proud
    as a peacock, I saluted the gentlemen of the staff, jumped on the Harley and rode
    back home.


    The next morning I handed in my resignation to the Chief Commissioner of the Municipal
    Police. After a considerable show of reluctance, he finally retired and I said
    farewell to my superior officers and fellow constables. That evening I rode that
    mighty Harley over Arjun Boulevard to return it to Inspector Van Meeuwen. Surprised,
    he asked me what this was all about. His daughters appeared on the porch behind
    him, and Truusje flew into my arms and kissed me. I looked at the three of them
    in triumph and said, ''I have signed up with the Marine Brigade and will continue
    to fight as hard as I can against those pelopor savages. I will take revenge for
    what they have inflicted on me and so many others. I will sacrifice myself for
    Queen and Country! If I died, then so it be. And as you, Mr Van Meeuwen, you have
    falsely accused me of practising guna-guna. A more serious accusation is barely
    conceivable and for this reason I will now take my leave of you.''


    Inspector Van Meeuwen froze. Truusje burst into tears and tried to throw herself
    into my arms, but I shunned her and walked away without a word of goodbye.'
