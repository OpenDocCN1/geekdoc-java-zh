    relieved to see not only our most senior commander, Colonel Roelofs of the Marine
    Corps – the tiger of the Gubeng Marine barracks – but also Lieutenant Colonel
    Aberson of the Marine Corps, commander of the second infantry battalion and Blue
    Column; Captain Groeneveld of the Marine Corps, my most senior commander within
    the Marine Brigade Security Service; his right-hand man, Lieutenant Brink of the
    Marine Corps; and of course Adjutant Mulder of the Marine Corps, commander of
    SHQ-II. Other staff officers of the Brigade were also in attendance. I even caught
    a glimpse of General Spoor, High Commander of the Land Forces in the Dutch East
    Indies.


    My wait was mercifully short. Major Versteeg of the Marine Corps, counsel for
    the defence, entered the waiting room, singled me out and led me to the courtroom.
    There I caught sight of my very own Admiral Hellfrig. I halted before the dock,
    saluted and stood to attention until the judge gave me permission to sit. The
    prosecutor, himself a Marine officer, was clearly troubled by the notion of fellow
    marines being hung out dry in the face of such intense political pressure. His
