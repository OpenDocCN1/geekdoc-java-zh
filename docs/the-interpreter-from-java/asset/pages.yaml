    # Tinned cabbage and Bali


    In mid-June 1947, I received a telephone call ordering me to report to Surabaya
    HQ-II in Mojosari. There my commander, Adjutant Mulder of the Marine Corps, told
    me to travel to Surabaya the next day with my full transport pack. On arrival,
    I was to report to Captain Groeneveld.


    I travelled with a column of food trucks and asked to be dropped near Porongstraat.
    From there I walked to Firefly Barracks, where I made my presence known to the
    duty officer. A little later, I was knocking on Captain Groeneveld’s door.


    ‘Enter!’


    I walked into the office, snapped to attention and saluted, awaiting further orders.
    Instead, Captain Groeneveld came up and shook me by the hand. He offered me a
    seat, then me a cigarette and asked for news from the front. ‘Nolan,’ he said,
    ‘we will soon be gearing up for a major military operation. Within a limited time
    frame, we have to capture capture East Java from the pelopors and occupy the entire
    area. But before we undertake this mission, I am sending you and a detachment
    from the Marine Brigade Security Service to Bali for three weeks’ leave, departing
    in three days. Until then,


