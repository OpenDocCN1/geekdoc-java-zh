  pgno: 292
- img_proc: true
  md: '# ALFRED BIRNEY


    bamboo spears and machetes in all shapes and sizes. I let loose with one clip
    after another, exhausting my slings of back-up ammo, and ran with a small troop
    of marines to the veranda of a house that had been shot to pieces. We pulled our
