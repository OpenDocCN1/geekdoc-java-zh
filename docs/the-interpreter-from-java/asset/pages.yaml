  md: 'in person. He too expressed regret at this state of affairs but insisted that
    retreating was not an act of cowardice. As marines, we had no choice but to follow
    orders. Grumbling, everyone prepared for the journey back. Of revenge and frustration,
    we booby-trapped buildings, houses and even pianos. Mines were laid on the access
    roads and on the day of departure we dynamited all the sluice gates to drain the
    water from every single swimming pool.


    In the lowest of, we made our way back to Mojosari. At Surabaya HQ-II, I resumed
    my work as head of Prisoner Interrogations with Department III. In consultation
    with the head of Department IV, we selected a number of prisoners to conduct espionage
    operations in the areas we had abandoned. One week later, our informants returned
    with news that Pacet and Tawas were once again crawling with Indonesian Army units.


    From Mojosari, I was transferred with another interpreter to the Marine Brigade
    Security detachment at Purwokerto, so fifty miles south. The entire area had to
    be purged of extremists, a mission that involved lengthy and exhausting daily
    patrols, and the occasional skirmish. Indonesian forces were waging a guerrilla
    war but though the US-trained marines had been primed for conventional warfare,
    they quickly mastered a range of guerrilla tactics. As local interpreters, we
    had all been born and raised in the country and spoke the language. Not only that,
    but we knew the mindset and habits of the Indonesians through through. This made
    us invaluable to the Marine Brigade. When I managed the border control with a
    few marines and saw people heading to market early in the morning, I could pick
    out suspects among the hard-working locals with considerable accuracy. A look
    in their eyes or something in the way they moved their arms was often enough to
    tell me who I was dealing with. Searching market-goers at the checkpoint, I often
    surprised my Dutch comrades by discovering'
