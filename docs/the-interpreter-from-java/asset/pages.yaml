  pgno: 284
- img_proc: true
  md: 'Halfway down the boulevard, I hailed a becak and asked the driver to take me
    home. My mind was a jumble of thoughts – ugly, mournful and happy. My love for
    Truusje was strong, but I felt far too young and restless to marry her. The closer
    I came to Undaan Kulon, the more relieved I felt. I wanted to be free, feel no
    love for any girl. I had to stay tough; this was war, after all. Arriving home,
    I grabbed Mama by the shoulders and said proudly, ‘Mama, from tomorrow I will
    be a marine and fight the enemy with renewed vigour. My salary will be much higher,
    so I will be able to give you more financial support.’


    ‘But I do not want to be a soldier!’ Mama whimpered. ‘You might be killed! Look
    at what happened to your cousin Willem. Are you out of your mind?’


    ‘Mama, I am duty bound to take care of you. Jacob and Karel do not want to support
    you. I am the only one who can do anything for you. The police paid me a pittance
    for those long, demanding shifts, and they were dangerous too.’


    Early in the morning I sailed farewell to Mama and walked to Undaan Kulon, where
    I took a becak to Firely Barracks. The duty officer sent me to Sergeant Major
    Vestdijk of the Marine Corps, who took me to the quartermaster’s store, where
    I was fully kitted out as a marine. Vestdijk summoned the head of household services
    to escort me to the interpreters’ dormitory. There I met a few boyhood friends,
    including Nono Sloesen and Harry Tjong. Two ammunition chests piled one on top
    of the other served as my bedside table. I hung my M1 Garand rifle from the straps
    of my folding bed and placed my bayonet at the foot.


    After down a mug of coffee, I went to see Piet Dikotta in his office. He was head
    of Espionage and Documentation. I got acquainted with Bert Hermelijn, chief interpreter
    with the Interrogation Department. Between them, these two men would be responsible
    for my training. Interrogation of political prisoners and POWs was to be my primary
    duty. Training was to take two weeks. In the meantime I underwent general military
    training alongside many other interpreters. This consisted of daily marches'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# THE INTERPRETER FROM JAVA


    in full combat gear to the golf course at Wonokromo, where I was able to let rip
    on the rifle range.


    Back at barracks, we were instructed on how to maintain an assortment of infantry
    weapons. Each interpreter harboured his feelings of hatred and revenge against
    the barbaric Indonesian freedom fighters. Our number included Indos, Chinese,
    Javanese, Ambonese and Mananese and we trained with a grim fanaticism. There were
    Indo boys who had seen family members raped, tortured and killed before their
    eyes. More than any of us, we were chanting at the bit to be sent to the front
    line. I waited my turn to be allotted a frontline posting. First I had to complete
    further training in prisoner interrogation, writing up interrogation reports,
    the appraisal and transmission of details of military importance. I also learned
    to process the entire administration of prisoners from capture to arraignment.
    My duties were both extensive and important.


    One morning I and four other interpreters were ordered to interrogate five pemudas
    who had been taken prisoner, members of a fanatical guerrilla movement called
    the Indonesian People''s Revolutionary Front. The charges brought against them
    included the murder of Reverend Laloe at the town square in Porong. Another three
    of their group were still at large. The captives'' confessions revealed how the
    pastor met his end. I told my fellow interpreters I had known Laloe well, this
    kind-hearted Mananese clergyman had christened me, my mother, my sister and my
    half-sister at the Protestant church on Bubutan during the Japanese occupation.
    The five killers sat patiently on the ground, staring indifferently into space.
    I ordered them to get up quickly and we proceeded to kick them to the ground.
    They writhed in pain. Then I asked them who had tied Reverend Laloe to the tow
    hook of the truck. Two of the pemudas confessed. I kicked them until they passed
    out. When they came to, I asked them who had been driving the truck that dragged
    Reverend Laloe across the square


