    Three infantry wielding big machetes came to the fore and began hacking their
    way through the thick lianas. I pulled out my fighting knife, but those vines
    were too tough. Our young guide walked into a liana that turned out to be a twelve-foot
    python. The snake dropped and coiled around the poor boy’s skinny body with incredible
    speed. Three of us dived on that monster. A tough corporal with hands like coal
    shovels had the presence of mind. Flash Gordon ordered us not to shoot, for fear
    of alerting the enemy, we ripped the snake with our bayonets and knives. I grabbed
    it by the tail and bent the end as far back as I could to relax the central nervous
    cord, but my own nerves jaling so much that I ended up cutting the tail clean
    off.


    Eventually the snake succumbed to the countless bayonet wounds and released its
    prey. Our young guide had lost consciousness. When he came to after a few minutes,
    I gave him a big gulp of coffee from my water bottle. Once he had recovered enough
    to get back on his feet, we continued our uphill journey.


    The dazed boy looked at me and said, ‘Tuan, the snake has crossed our path. Bad
    things will come our way. I am only the first to be touched by this ill fortune.’
    I looked him in the eye and nodded to let him know I understood. Thanks to Uncle
    Soen and Pah Tjillij, I was familiar with these superstitions.


    After two hours of hacking away at lianas without a let-up, we had barely advanced
