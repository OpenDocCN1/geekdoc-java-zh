  md: '# THE INTERPRETER FROM JAVA


    # First Police Action


    17 July 1947. Shouts and whistles at six in the morning. Cries of ‘Wakey-wakey!
    Marching orders!’ from the corporals on duty rang through every dorm in the barracks.
    Half asleep, I dragged myself out of my camp bed, folded down the mosquito net
    and staggered to the washrooms, towel and sponge in hand. The cold water did me
    good. I dressed in my utility uniform and headed for the mess. All through breakfast,
    the place was buzzing. At seven came the order: ‘Fall in!’


    Almost every man in the barracks was lined up. Captain Groeneveld and Lieutenant
    Brink took reading out the routine orders and then Captain Groeneveld addressed
    us. ‘Men, in a matter of days a major campaign will get under way. Many of you
    have already had your own baptism of fire, for so this you will present few difficulties.
    But let me assure those of fresh off the boat from Holland that all will be well
    provided if you heed the guidance of your experienced soldiers. As of this moment
    you are off duty. Go and say farewell to your family and friends. I expect to
    see you all back tomorrow at noon, which will give you ample time to check your
    equipment and your weapons. Ask the quartermaster for extra ammunition and grenades.
    Look for your names on the notice boards tomorrow to find out which division you
    have been assigned to. Now go and enjoy this short spell of leave. Dismissed!’


    Our brigade was to be divided into four columns charged with occupying Java’s
    wild Eastern Salient and purging it of every last trace of terrorism. Our intelligence
    team, referred to simply as ‘the interpreters’, were spread across diverse battalions,
    companies and platoons. I was assigned to 3-INBAT: the 3rd infantry battalion,
    with orders to penetrate as far as Malang and the surrounding area. Back in the
    dorm, I thought of my sisters Ella and Ina, both of whom were being held in women’s
    camps near Malang. I neatly made up my camp bed, folded away my mosquito net and
    checked through my equipment. Having grabbed my empty knapsack,'
