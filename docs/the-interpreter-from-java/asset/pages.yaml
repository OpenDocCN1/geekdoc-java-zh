    On the appointed day, 20 January 1950, I appeared before a judge by the name of
    Hampel. He was a mild-mannered, friendly man, with the air of a contented Indo
    about him.


    ‘Mr Nolan, he began, ‘I have before me a document sent by the Dutch government
    in The Hague asking you whether or not you wish to accept Indonesian nationality.
    You have, after all, born and raised in this country by parents who have roots
    here. You have received a good education, not to mention military training. In
    the newly founded Republic of Indonesia, we will have need of men like you, both
    from a social and a political perspective. You can count on every possible support
    from our political leaders. What is your answer?''


    ‘Your honour, I have fought against your people. I have been tortured, starved,
    humiliated and trampled underfoot. I cannot and do not wish to accept Indonesian
    citizenship. My answer must be no, Your Honour. I do not wish to become an Indonesian.
    I am a marine, and not a traitor. Since boyhood I have pledged allegiance to the
    Royal House of the Netherlands. I am loyal to the House of Orange and will remain
    so will soon sail for my fatherland, and that is the Netherlands. While I have
    been born and raised in this land, I do not feel at home here, however strange
    that may sound. Whenever the Netherlands calls on me to take up arms, I will do
    so.’


    ‘Your statement is clear. The clerk of the court has taken note of everything
    you have said. I will pass judgement accordingly. You are free to go, Mr Nolan.’'
