    # The banks of Kali Peneleh


    From Jagalan, I walked back to Undaan past the banks of Kali Peneleh. All along
    the way, I saw lepers who were facing certain death. Grubbing around among the
    iganas and crocodiles, some had been reduced to cannibalism. With no other food
    to be found, they ate the flesh of corpses. The stench was unbearable. Such was
    the state of every river that flowed through the city to the sea. If I was to
    break through and reach the British lines, my only chance would be to follow these
    waterways, to wade through this water. The thought turned my stomach. What brought
    these wretches to seek out a final resting place by the rivers? I suspected there
    were rōmusha, people who had been sentenced to hard labour by the Japanese and
    who, after the capitulation, had returned to Surabaya utterly destitute. With
    no family left in that ravaged city, they had been unable to find food, work or
    shelter, and were too weak to join the ranks of the pemudas and pelopors. Plagued
    by hunger, disease and other hardships, they had settled on the river banks. In
    desperation and then resignation, they waited for death.


