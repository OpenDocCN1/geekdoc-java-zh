  md: 'steadily wore down their resistance and ran to the sugar factory in formation
    to take the buildings while minimizing any damage. Between fifteen and twenty
    of us charged into the big factory hall, where pelopors were still planting explosives
    among the machinery. A brief exchange of gunfire was enough to wipe them out.
    In an adjacent hall, we came across two pelopors trying to set fire to piles of
    gunny sacks. I quickly shot them down, found a fire extinguisher and put out out
    the blaze. With a stick, I separated the smoldering sacks and doused them with
    the rest of the extinguisher''s contents. Meanwhile I heard intense gunfire coming
    from the machine rooms. By the time I got there, six dead bodies lay on the floor,
    one of them a Jap.


    The boys from the Demolition Group set about disarming the time bombs and booby
    traps among the machinery. We moved on, leaving behind a detachment of marines
    to guard the place until the main force arrived.


    We continued our advance towards the strategic town of Bondowoso. Blue Column
    split up to attack in a pincer movement. I stuck with the assault troops. Our
    trucks drove straight through the residential areas. Whenever we drew fire, we
    stopped the trucks, leapt out and ran for the houses on either side of the street,
    giving good as we got.


    By one one, we searched homes and offices for military documents. I kicked down
    the door of a Chinese dentist''s house to discover five blonde women, all of them
    Indos.


    ‘What are you doing in this Chinaman’s home?’ I asked, seeing the fear in their
    eyes. ‘Are you prisoners?’


    They nodded. I turned to the dentist, ‘Why are you holding these women against
    their will? What have they done wrong?''


    He looked at me as if dazed, but said nothing. I hit him with the butt of my gun.


    ‘I asked you a question!''


    Groaning with pain he said, ‘I kept these women here to protect them from the
    pemudas, to stop them being brutally raped. You know what I mean.’'
