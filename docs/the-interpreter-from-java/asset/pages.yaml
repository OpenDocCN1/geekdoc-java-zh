    Much to my delight, I ran into Ciska a couple of times on Pasar Besar, when she
    was out walking with Marietje’s children. It turned out that Ciska and her sister
    lived in Dapuan too, albeit in wretched conditions. When she had a day off, I
    would invite her to our house and she was allowed to stay overnight. Mama doted
    on her, spoiling her with tasty meals and Chinese biscuits. Ciska was Catholic
    and always wore her rosary beads around her neck. Little did I know that her rosary
    would save my life one day.


