    I thought this strange, as sciatica is almost unheard of in the tropics. The upshot
    was that I had to spend three weeks flat on my back in the sick bay.


    I ended up a large ward with seven men, all with relatively minor injuries. The
    eight men on the next ward had not been so lucky. We visited them on a daily basis
    to pump them full of hope and courage. Those Dutch lads did not have it easy.
    Some of them cried at night, calling out for their mothers and their loved ones
    in Holland.


    Lying still for so long made me restless. Thoughts of my friends, my childhood
    and the violence I grew up with began nagging away at me. Dead and wounded marines
    were brought in almost daily, doctors and medics came round the clock. And operating
