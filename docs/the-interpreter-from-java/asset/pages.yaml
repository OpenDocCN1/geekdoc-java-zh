    # Operation Harlot


    Mulder came up to me one morning after breakfast. ''Nolan,'' he said, ''I have
    a special assignment for you. Today you will be given a patrol of ten men and
    three empty trucks. Take a jeep, with Groeneboer as your driver. Your job is to
    arrest whore in Jember and the surrounding area and load them onto your trucks.
    Bring them for routine questioning and then to the city hospital for decontamination.
    I will have a word with the hospital governors beforehand. We need those whores
    keep our boys happy. Don’t be led astray and stay on the alert for gangs of guerrillas.''


    I answered with a stiff salute and headed straight for my room. There I strapped
    on my trcheon, stuck my fighting knife in my right legg, grabbed my trusty M1
    and flung a few belts of ammo around my neck. The three trucks were waiting outside,
    along with Groeneboer and his jeep.


    I took Harry Tjong and a former Indonesian POW with me in the jeep. The rest of
    my patrol climbed aboard the trucks. Off we went. The POW knew the way and directed
    us to Jember’s red-light districts. We halted the column and conducted a thorough
    search of every house. The bounty was plentiful and our trucks were full within
    the hour. Those girls stank to high heaven! The fug of their perfume turned my
    stomach. We also searched their rooms for evidence of contact with guerrillas.
    When our little convoy was


