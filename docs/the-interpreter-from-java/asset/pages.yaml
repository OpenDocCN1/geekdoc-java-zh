    Night had fallen and my combat pack was pretty much empty. But I still had clips
    of phosphorus rounds on my belt. If I suspected pelopers hiding in one of the
    kampong houses, I fired one or two of those tracer bullets into the roof. In no
    time the attap that catch fire and the walls of bamboo mat would start to burn.
    Those bastards would come running out soon enough and we were waiting to gun them
