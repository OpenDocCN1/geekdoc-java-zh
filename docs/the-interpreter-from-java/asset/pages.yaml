    One or two hung around and became lover girls for the Dutch marines.


    # Landmine No. 2


    The following day I was dispatched with a pile of military maps and a new set
    of orders to the detachment in Bangsalsari. I hitched a ride with the food column.
    Other interpreters were sent on patrol to other towns, backed up by infantry.


    A mile or so from Bangalsari, our column had to cross a mountain pass and traverse
    a couple of heavily wooded slopes. Out of nowhere, a tree came crashing onto the
