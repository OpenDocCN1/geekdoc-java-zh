  md: '# Guitar and typewriter


    As a young man in Surabaya, my father saw the flying cigars of the Japanese Air
    Force bomb his home to rubble, he saw Japanese soldiers behead civilians, he committed
    acts of sabotage for the Destruction Corps, was tortured and laid in an iron box
    to broil beneath the burning sun, he saw Japanese soldiers feed truckloads of
    caged Australian prisoners to the sharks, he saw Punjabi soldiers under British
    command sneak up on the Japanese and slit their throats, he learned of the death
    of his cousin in the Burma Railway, heard his favourite uncle was tortured to
    death by Japanese soldiers on his father''s family estate, he betrayed his ''hostess''
    sister''s Japanese lover, he guided Allied troops through the heat of East Java,
    where Indonesian rebels were hung by the ankles and interrogated while he – an
    interpreter – hammered away at a typewriter, he heard the Allies burn villages
    to the ground, heard the screams of young rebels consumed by flames as they ran
    from their simple homes into a hail of gunfire, he learned to handle a gun, at
    a railway station, riddled a woman and her child with bullets when a Japanese
    freedom fighter took cover behind them, he led an interrogation unit in Jember,
    broke the silence of the most tight-lipped prisoners, he was thrown 250 feet into
    a ravine when his armoured vehicle hit a landmine, he was ordered by a Dutch officer
    to supervise the transport of inmates from the municipal jail in Jember and, arriving
    at Wonokromo station in Surabaya after a nine-hour journey, he dragged the corpses
    of suffocated prisoners from the goods train, he found the body of an Indo friend
    who had we'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'blown his brains out because his girl had slept with a Dutch soldier, and,
    amid the chaos of Bersiap, he killed young men with whom he had a score to settle.
    But for him the worst thing was when the neck of his guitar broke.


    Or did that last detail slip your mind, Pa? Perhaps because you made it up?


    It happened during the First Police Action. Two convoys travelling in opposite
    directions passed at close quarters. Some squaddie left the barrel of his machine
    gun in harm''s way and the neck of your guitar. The make of the machine gun is
    unknown, but your guitar was an original US Gibson: every Indo''s dream, played
    by all the greats. A prize you would have given anything to own, even the sweetest
    girl in Croc City.


    You were a big man in my eyes, a fearsome figure, and you smiled as you told me
    this tale in the chilly Dutch living room. The guitar had been a faithful companion
    to you and your soldier buddies, though you never mentioned it in your writings.
    And, as long as that instrument survived, the war still resembled a Boy''s Own
    caper: tearing around, feeding your face, serenading the village girls, spying
    on women as they bathed in the river. Night after night as a kid, I had to listen
    to those ripping yarns of yours. While your Dutch mates in their green berets
    plastered their tanks with pin-ups, you hung a portrait of their queen at the
    foot of your bed in Surabaya. Your lofty dream of Holland was just a decent pay
    pocket to most of those guys, or to the psychos among them, an adventure. That
    first batch of Dutch Marines had been trained in America – to you they were heroes.
    And, pig-headed as you are, you continued to watch those mindless American movies
    all your life, in which war is for heroes and peace is for cowards. Refused to
    grow up, didn''t you, Pa? You remained that boy of twenty.'
