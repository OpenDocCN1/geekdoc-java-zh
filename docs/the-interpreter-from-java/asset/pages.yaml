    # Incubator


    In the beginning my parents created the heavens and the earth. The earth was savage
    and then tranquil and the spirit of my parents hovered over the waters. ''Let
    there be light!'' my father said and flicked the switch on his desk lamp. And
    he saw that his typewriter was good and he separated light from darkness. Light
    he called the tedium of day, darkness the playground of love. And there was evening
    and there was morning, the first day. ''I feel a vault within my body,'' said
    my mother. And so the heavens and the earth were separated. Neither she nor he
    had power over the vault within her belly and both named it hell, for soon they
    would no longer be alone in that shabby, cosy little beside in the gloom of Bilderdijkstraat,
    where rain poured and snow turned the pavement slippery and passers-by saw this
    couple as strange, for they looked nothing like the couples with hats, headscarves
    and umbrellas who peopled the streets. They were the and the stranger from the
    East. They were slaves to their desires, worse than the Jews who had been driven
    in their thousands from the city''s streets to cold, damp stations, where long
    trains stood waiting to take them to places worse than hell, where they were gassed
    and incinerated and where years later swollen cabbages sprouted from soil fertile
    by those who had choked to death in gas chambers.


    My father had another war in his head, a war no one in this city seemed to know.
    In Holland, the war had been reduced to the bitter winter of 1944–45 and the hunger
    and desperation came with it. Not a word about the Jews. And the colonies were
    just far-off places where greedy Dutchmen gave Indonesians a taste of the lash,
    rode the native girls and fathered half-breeds who had been called many a name
    through the centuries. Coloured they were, blue even.'
