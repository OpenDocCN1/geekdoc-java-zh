  md: 'commander was Sergeant Cornissen of the Marine Corps, a white Indo born and
    raised in Holland. He showed me to my room, which I was to share with an Ambonese
    soldier by name of Ben de Lima. I folded out my camp bed and attached my mosquito
    net to poles at each corner. Then I took a refreshing bath.


    At the base, we had a couple of babus and a house boy to attend to all the household
    chores. When night fell, the babus were kept otherwise occupied by the Dutch marines.
    This appeared to be standard practice. Ben de Lima and I were indifferent to their
    physical charms


    The road to the sugar factory was blocked by a barbed-wire barricade and an access
    barrier guarded by a handful of infantry from A Company. Every day around lunchtime,
    the poor from the kampong would come to the barrier and beg for leftovers. We
    fetched the occasional sack of sugar from the factory warehouse and struck up
    a lively trade with the locals. A cup of sugar would get us an egg, a saucepan
    of sugar for a whole chicken.


    A ceasefire was in place but it was violated by both sides. We were lucky that
    the pemudas were poor marksmen, so poor in fact that not one of us was wounded,
    never mind killed. That said, many of the Dutch succumbed to the usual tropical
    diseases: everything from malaria, dysentery and diarrhoea to ringworm and nasty
    rashes. We patrolled by night and day, and under cover of darkness we then encountered
    small bands of Indonesian Army infiltrators. Brief skirmishes took place, generally
    resulting in the deaths of a few pelopors and the rest being taken prisoner. For
    every dead pelopor, I carved a notch in the butt of my M1 rifle.


    Every pelopor we captured underwent tough interrogation. They were guilty of massacres
    on simple villagers and Chinese merchants and their families. But that was not
    all: they took a perverse pleasure in carving up bodies. Some Chinese women and
    children had their limbs severed before being buried alive. After questioning,
    the culprits pointed out the graves and we got them to dig up the bodies. We had
    little patience with those savages. If they'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# THE INTERPRETER FROM JAVA


    refused to confess, Ben de Lima and I threatened to make them eat paper and drink
    their own urine. These threats worked. Once interrogation was over and the reports
    were drawn up, prisoners were transported by way of General Headquarters at Firefly
    Barracks to Surabaya''s notorious Werfstraat prison.


    In Mid-March, A Company was put on high alert throughout Krembung district. Ten-tonners
    loaded with ammunition and equipment shuttled back and forth. I had to bid de
    Lima farewell, as I was the sole interpreter from Detachment III to be assigned
    to the first platoon, which was to accompany a platoon of assault troops through
    Mojosari to Mojokert, a short distance inland. Ben de Lima and I shared some good
    times during those weeks in Krembung.


    At the crack of the dawn, I filled my knapsack with ammunition, hand grenades
    and K rations. The rest, including my mosquito net and folded camp bed, went into
    my duffel bag. My baggage was then labelled with name, registration number and
    unit. Over my shirt, I hung two slings with six clips of .30-cartridges. My fighting
    knife for man-to-man combat was strapped to my right calf, the sheath tucked in
    my legging. I sharpened the blade on a whetstone with a little water till the
    edge was keen enough to shave the hair from my legs.


    I joined the assault troops and the lads from the Demolition Group and Sergeant
    Cornelissen shook me firmly by the hand and wished me luck. Both groups rode to
    Porong first and then across Porong Bridge into hostile territory. We met with
    little resistance. Not far from Mojosari, the tanks and armoured vehicles stopped
    at a river, where a bunch of amtracs stood waiting as planned. We leapt out of
    the trucks and marched aboard. When the ramp slammed behind us, we felt the full
    heat of the exhaust pipes, which ran through the body of the vehicle and out to
    the top to keep it watertight. Pouring with sweat, we cursed like devils.


    The amtracs drifted slowly to the other side of the river. The ramps opened and
    we were left to make our way to Mojosari on foot, straight through the jungle
    at times. We avoided the roads'
  merge: -1
  pgno: 290
- img_proc: true
  md: 'whenever we could for fear of landmines. Trees had been felled to form roadblocks,
    and booby-trapped barricades meant dangerous work for the Demolition Group.


    We made decent progress, encountering sporadic light artillery fire along the
    way, but the enemy stood no chance against our modern weapons. As we marched,
    other marines swept the area clean. Here and there I saw the bodies dead pemudas.
    Approaching a rice-husking plant, each gun manned under heavy fire. Pemudas had
    set up machine-gun posts in two abandoned KNIL places close to the factory building,
    each manned by three fighters. We called back for bazookas. Marksmen with Browning
    Automatic Rifles provided cover and before long the pillboxes had been blown to
    kingdom come, pemudas and all. There was no time for celebration: we needed all
    our wits about to take the plant itself. A bazooka rocket slammed into the main
    entrance and I ran into the factory with a handful of assault troops, guns blazing.
    I had to be quick reloading my M1. One of my reserve slings was already empty
    and I could see pelopors skulking among the heavy machinery. With a tight group
    of marines, I headed for the machine rooms, where we fanned out, surrounding the
    pelopors and picking them off by one. We were lucky: they had been planting explosives
    under the machines. Outside, marines were hunting down pelopors as they ran. Not
    one of them escaped with his life.


    We marched into Mojosari to find the place deserted. Almost all the villagers
    fled. A few old men and women were the ones left, wandering around with nothing
    but dogs and chickens for company. A good place to rest. We sat down by a dry
    ditch with a few lads from the Demolition Group. I slid the knapsack from my shoulder,
    took out two tins of K rations and pulled my water bottle from my belt to sip
    leftover from our early breakfast.


    After resting a while, the entire column moved on in the direction of Mojokerto.
    Above us flew a number of Fairey Strike fighters belonging to the KNIL air force.
    Every now and then the planes dived to fire rockets. Revisited with the other
    units, we made rapid progress. Arriving in the centre'
  merge: -1
