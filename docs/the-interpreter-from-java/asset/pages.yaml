    Surabaya Papa has found himself a bargain: a second-hand sled. But he will not
    come outside with us. He feels the cold. He comes from a country so warm it snows.
    I share the sled with my twin brother. We have to share everything, right down
    to the mandatory bottle of school milk. We take turns pulling each other along,
