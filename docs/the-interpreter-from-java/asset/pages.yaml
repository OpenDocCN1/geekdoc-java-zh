    all the way to Simpang. We were in luck: the good old Tapeworm Express was easing
    round the bend to Kaliasin. We raised our hands and the driver drove her down
    enough for us to take a running jump. The linked trucks snaked their way past
    Willemsoord Barracks where we hopped off and stroled up to the barrier.


    We were awakened at six the next morning. After a long bath, we dressed and immediately
    started packing. Each of us had a duffel bag and a suitcase. Breakfast over, we
    returned to our sleeping quarters in our khaki dress uniforms with cap, checked
    our baggage and humped everything everything to the parade ground, where some
    two hundred marines had gathered, ready for the overseas voyage. At the parade
    ground, Major Veenhuizen introduced me to Major of the Marine Corps Van Tielroij,
    who was to sail with us as transport commander.


    Late in the morning, fall-in was sounded. All two hundred marines lined up, raring
    to go. The barracks commander gave a short farewell speech on behalf of the Commander
    of Naval Forces. We were then issued with every possible instruction and at last
    we were able to march out onto Jambistraat, waved off by the few who remained
    behind.


    Two four-truck Tapeworm Expresses stood ready to take us to the docks at Tanjung
    Perak. Our route led through the centre of Surabaya and I fasted my eyes on the
