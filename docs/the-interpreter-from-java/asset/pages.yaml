    # Your dreams of the babu...


    By mid-1948, many volunteer marines had reached the end of their tour of duty
    in the tropics. They were withdrawn from the front and stationed in Surabaya to
    await their homeward voyage. Their places were taken by marines from Holland,
    young National Service conscripts who in no time had to be brought up to speed
    on the grim realities of guerrilla tactics and jungle warfare. I was still at
    SHQ-II in Jember when almost every Marine unit was recalled to Surabaya to be
    replaced by KNIL and Dutch Army units. This was to pave the way for the Second
    Police Action.

    I was among those ordered back to GHQ in Surabaya. On arrival, I reported to my
    commanding officer, Piet Dikotta. It was all go at HQ. Spies and informers had
    already been dispatched to locations held by Indonesian Army units and other fan
    militant groups. Messages were coming back regular as clockwork and it was my
    job to assist in their evaluation. We made notes on our military maps.

    Dikotta called me into his office one day. ‘I say, Nolan,’ he said,


