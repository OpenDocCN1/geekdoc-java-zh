    # Welcome


    I spent only two days in solitary. The first was to cool me down and on the second
    I was to hear my sentence. On 1 May 1968 they fetched me from the cell and bundled
    me into my social worker''s car. I was to be disciplined at a secure unit. I remembered
    all my trips by car, so few in number: the taxi to Voorscheten, my encounter with
    the owl in Drenthe and the head driving me back from my mother''s, away from that
    gruesome flat by Zuider Park. This drive was my longest yet, to a town I would
    come to hate with every fibre of my being for the rest of my life. It had been
    built on a river and secreted in one of its dark, narrow, cobbled streets was
    some sombre building from a place called Welcome. It had begun life as a workhouse
    for the destitute, then became an orphanage and by the time I arrived it was a
    halfway house for juvenile delinquents. On the way, my social worker – a man who
    showed his face and whose role in my life I had never understood and would never
