    to the Military Police at Wonokromo station. I gathered the interrogation files
    of the twenty-nine prisoners: mass murderers, rapists, saboteurs and arsonists.
    We knew from bitter experience that this class of criminal could expect to serve
    a maximum jail term of six months. We also knew that Judge la Parra of the court
    in Surabaya had received death threats in the post: he, his wife, his children
    and his relatives throughout the Archipelago would be slaughtered unless he handed
    down lenient sentences to


