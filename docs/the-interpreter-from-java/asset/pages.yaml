    31 August 1949: a date I will never forget. Even with the Dutch on their way out,
    Queen Wilhelmina''s birthday was cause for celebration. On Simpang, the governor
    and assorted dignitaries lined up to take the salute at a military parade. In
    addition to the Dutch armed forces, a number of Indonesian units joined as a show
    of reconciliation between the two sides. This robbed me of any desire to celebrate.
    It was almost noon by the time the troops marched past the seats of honour. First
    came the Marines, immediately followed by the Navy and a whole series of Army
    units. Then came the various branches of the KNIL, followed by units from the
    Indonesian Army and Navy. As the enemy forces went by, I stared in amazement at
    the modern firearms on show, the spoils of smuggling. The sight of those pelopers
    on parade left a bitter taste and my blood began to boil. It was ludicrous; many
    of the Indonesian soldiers marching past had no shoes, yet they were armed with
    better bazookas and mortars than the Dutch Marines. I cursed the lot of them.


