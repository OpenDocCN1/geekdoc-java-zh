  md: '# THE INTERPRETER FROM JAVA


    The next morning I joined an excursion to Sanur, where there was a beautiful beach.
    A Belgian painter by the name of Adrien-Jean Mayeur lived nearby with his lovely
    Balinese wife. That afternoon, he invited a bunch of marines to his home. First,
    he showed us his work and I was greatly impressed by his talent as a painter.
    Close to sunset, a couple of gamelan players gave to a recital. The painter''s
    wife retired to her room and changed into a dancer''s costume. She emerged as
    a picture of elegance in a beautiful sarong, naked from the waist. We stared speechless
    at her shapely breasts and hips. Embarrassed and aroused in equal measure, my
    pals and I exchanged glances. Our cheeks were burning. The Belgian painter''s
    wife danced the legong, a courtly Balinese dance, to the strains of the gamelan
    music. It was a sight to behold.


    We returned to Sanur beach the next day for a refreshing dip in the sea. There
    on the sand I got into a fight with a sergeant named Bitter. He mocked my brown
    skin and inferior background to the point where I lost control and beat him up.
    Sergeant Cornelissen – an Indo himself, though white and raised in the Netherlands
    – separated us and clearly took Sergeant Bitter''s side. Both NCOs made no secret
    of their feelings of superiority and their hatred of coloured. In my rage, I turned
    to Sergeant Cornelissen too. Other lads wanted to break up the fight. They advised
    me to forget all about it and settle the matter with a friendly handshake. Instead,
    I spat in the officers'' faces. That was my answer to their delusions of grandeur
    and Dutch brand of racial hatred. No wonder their breed of Dutchman was so reviled
    by the native population.


    Almost every day brought another excursion to the KNIL boys, who showed us the
    most beautiful parts of the island. I enjoyed those three weeks on Bali intensely,
    soaking up the glorious and exotic natural surroundings. I even had a fling with
    a Balinese beauty or two.'
