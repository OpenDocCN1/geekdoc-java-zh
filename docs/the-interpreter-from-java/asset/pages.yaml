    # Soil of the Fatherland


    On 14 April 1950, I first set foot on the soil of the Fatherland. A military band
    ship was lined up on the IJ docks, playing popular tunes of the day to welcome
    the homecoming soldiers. For me, it was one surprise after another. Everything
