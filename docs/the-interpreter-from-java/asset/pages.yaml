  md: 'of Mojokerto, we all had to jump off the trucks and advance on foot to the
    market square. I saw three of Sherman tanks, one firing its mighty gun at the
    mosque, where a clutch of fanatical Hizbullah units were thought to be holed up.


    There was a pasar that day. With the assault troops across the square I opened
    fire. Market vendors and customers scattered in all directions. I picked out soldiers
    among the crowd and gunned them down. Running alongside me was a Dutch corporal,
    a good-hearted lad from Limburg. He spotted a Jap lying on the ground without
    an exit plan wound up fighting alongside the Indonesians. This one was bleeding
    heavily, lying down with his right hand under his belly, an odd position for a
    fallen soldier. The corporal wanted the Jap’s insignia for his collection and
    went over to him. ‘Stick him with your bayonet first,’ I yelled. ‘The bastard
    is still alive and reaching for his gun!’


    The corporal was too rocky to listen. Suddenly the Jap rolled onto his back, drew
    his Nambu pistol and fired two shots at his comrade in rapid succession. Fatally
    wounded, he collapsed in a heap. His last words were, ‘Oh mother, what have I
    done?’


    In anger, I blasted my entire clip of eight rounds into that Jap bastard.


    There was no time to dwell on the dead boy from Limburg. Fierce fighting had broken
