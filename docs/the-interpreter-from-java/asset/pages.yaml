    After a couple of pleasant days, it was time to return to the front. signed off
    with the senior NCO at Firefly Barracks and was handed a bag of letters to take
    back to SHQ-II. A jeep took me to Gubeng station, where I caught the train to
    Jember.


    On arrival, the first thing I did was read through the recent combat and counterintelligence
    reports. Gangs of Indonesian guerrillas had been on the rampage, all more troubling
    since they were no longer sparing their own people. The local police had their
    hands full providing emergency assistance, while marines patrolled the region,
    day and night.


    Late one afternoon, I was out on the front porch, smoking and shooting with a
    couple of the lads when a Chinaman came staggering into the compound, battered
    and bruised. A couple of chaps leapt up and went to his aid. They cleaned his
    wounds with boracic lotion, disinfected them with sulphha, and patched him up
    as best as they could. As he was being tended to, he answered my questions.


    He lived a mile or so from Mangli. That morning, nine guerrillas had appeared
    out of nowhere and proceeded to assault him. As he lay on the ground and worked
    over with knives and pain, groaning with pain, the attackers raped his wife and
    daughter and worked them over with bayonets. His wife was killed, but his daughter,
    a girl of eighteen, survived. Those savages then decided to bury her alive before
    they moved on. The poor father staggered to the main road that runs from Mangli
    to Jember and was lucky enough to flag down a passing dokar. That was how he had
    managed to reach us.


    Wasting no time, we formed an assault squad, eight-man strong. The Chinaman came
    with us. When we arrived at his house, I jumped out of the vehicle and helped
    him down, so that he could point out the spot where he had buried his daughter.
    Carefully, we began to dig. In the heat of the moment, no one had thought to bring
    a spade, so we had to scrape away the soil with our bayonets and helmets.'
