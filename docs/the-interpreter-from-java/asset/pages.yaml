  md: '# A son returns from the grave


    After a month confined to the Jember sick bay, I was discharged towards the end
    of August 1947 and given four days'' leave to visit Surabaya. Since landing at
    Pasir Putih for the First Police Action, I had not had a single day to myself.
    I was in reasonable shape, though a little weak, and my back still hurt now and
    then.


    I set off, unaware that my brother Karel had been to see Mama one evening after
    work. Ella and Poppy were there too. Karel summoned them to the dining room, along
    with Babu Tenie and Kokkie Tas and told them he had sad news.


    Sitting at the table, Karel began, ''Ma, Ella and Poppy, babus, when Arto came
    to say goodbye to you, he took me aside and said that if I did not hear from him
    in six weeks, I was to let you know that he is no longer with us. That time has
    come. I had no word from him and must therefore assume that he is dead. I had
    asked the few marines I know for news of Arto, but no one could tell me anything.
    Many marines have lost their lives in East Java.


    Everyone, even Poppy, burst into tears. The babus were inconsolable.


    Jan van der Burgt, a marine second class who worked at the Marine Corps bakery,
    paid occasional visits to Ella. During my absence, my sister had been liberated
    from the women''s internment camp near Malang. Jan was having a fling with the
    woman next door, Mary Scheffer, whose husband was still a POW. When Jan stopped
    by a few evenings after Karel''s announcement, Mama and Ella asked him to find
    out if I was really dead. The next day, he was taking the train to Bondowoso and
    Jember to deliver a consignment of bread and other supplies. The Marine Brigade
    Security detachment in Bondowoso referred him to SHQ-II in Jember but, instead
    of going there, he took the advice of a medic and went directly to the sick bay.
    That morning, the bodies of a number of marines killed in action were due to be
    transported to Surabaya for burial at Kembang Kuning military cemetery. Jan asked
    the staff about me. A sergeant consulted his paperwork and found my'
