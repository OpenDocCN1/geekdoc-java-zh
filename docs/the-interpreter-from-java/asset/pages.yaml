    knife was tucked in my right legging as ever. The barracks was a hive of disciplined
    activity. I saw troubled faces all around. The news that half of us might not
    be returning had hit home.


    I dragged my belongings to the gate and waited to be picked up. The barrier was
    raised and a staff jeep came barreling towards me. The driver got out. ‘Are you
    Nolan of the Marine Brigade Security Service, awaiting pick-up under orders from
    Lieutenant Colonel Aberson?’


    ‘Yes,’ I replied, and hopped aboard.

    ‘Smid’s the name, driver, rookie 1st class.’ The introductions over, I shook his
