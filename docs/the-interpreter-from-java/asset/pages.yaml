    Naval Forces. We entered the room and the blood drained from my face; Opposite
    the admiral sat my mother, her gaze more forbidding than I had ever seen it.


    I sprang to attention. The admiral turned to me. ‘Nolan,’ he said, adopting the
    severe set of tones, ‘as you can see, your mother has paid me a visit. She has
    lodged a personal complaint about'
