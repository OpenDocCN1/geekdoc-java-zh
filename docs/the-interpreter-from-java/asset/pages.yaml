  md: 'It was late afternoon before the Pelican was finally loaded with materiel and
    fighting men. The ship''s whistle sounded and slowly we set sail. A little later,
    I saw the Wundi ease away from the quayside behind us. The cool sea breeze was
    a tonic.


    The Pelican was carrying the men of Blue Column, the Wundi men of Red Column.
    When we landed, Blue was to head east and push through to Jember and the rest
    of the Eastern Salient. Red was to head west to Probolinggo and Pasuran.


    On 20 July, our Pelican was making steady progress through the Madura Strait.
    The water was choppy and I began to feel seasick again. The atmosphere on board
    was tense. Some of the lads wrote letters to their loved ones back in Holland.
    A ship''s chaplain for the Catholics and a pastor for the Protestants made their
    rounds, trying to boost morale. The pastor noted my personal details and asked
    me what I wanted to happen in the event of my death. I answered that I wanted
    my belongings to be given to my mother, Sue Swan Nio, and the band of the Royal
    Marines to play Glenn Miller’s ‘Moonlight Serenade’ at my funeral.


    That night I was unable to sleep below deck. I climbed out of my bunk and went
    looking for a quiet spot in the open air. Seeing a jeep that was lashed down,
    I climbed on the bonnet, set my heels against the ship''s railing and leaned back
    against the raised windscreen. Scenes from my past flashed before my eyes. The
    beatings I took as a boy. The horrors of the Japanese occupation. The violence
    at the start of the Indonesian revolution. It did not matter much to whether I
    lived or died.


    I lit a cigarette and stared up at the countless stars in a cloudless sky. After
