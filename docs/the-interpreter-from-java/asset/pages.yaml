    # Away from the front


    When we purged those areas, scores of Dutch planters and industrialists were able
    to return and start rebuilding their enterprises. Even so, we had to keep up intensive
    patrols. The furthest reaches of East Java were rough, mountainous and densely
    wooded, and many plantations belonging to Europeans who had fled – the Nolan family
    among them – lay abandoned. Indonesian guerrilla tactics made occupying such a
    vast region a major problem, and we were fortunate to have the assistance of KNIL
    and Dutch Army units. We carried out sweeping operations and rounded up large
    numbers of prisoners. In Rogojampi near Banjuwangi, I submitted extremists guilty
    of slaughter to harsh interrogations before dispatching them to SHQ-II in Jember.
    I was ruthless in extracting all the military information we needed from the remaining
    prisoners, which enabled our commanders to pinpoint guerrilla activities on their
    maps. Prisoners of no real use to us were


