    The main street in Trawas led to a grand hotel with a beautiful swimming pool.
    It turned out to be the pemuda headquarters. Ten marines stormed the building.
    Resistance was weak and in no time we seized control of the entire complex and
    immediately began putting things in order for the staff of the second infantry
    battalion.


    In Pacet and Trawas, we all went in search of decent accommodation among the abandoned
    holiday bungalows. Sentries were stationed at strategic points. A bunch of us
    from the Marine Brigade Security Service settled into a bungalow beside a water-fall.
    I stripped off and showered in the wonderfully cool water. The Dutch lads followed
    suit.


    Events took an unfortunate turn. It transpired that we had advanced too far into
    hostile territory and put the government in an awkward spot, politically speaking.
    The order came down from on high to relinquish our newly won positions in and
    around Pacet and Trawas. This meant pulling all the way back to the boundary between
    Mojosari and Mojokerto. It felt as if our hard-earned victory had been for nothing
