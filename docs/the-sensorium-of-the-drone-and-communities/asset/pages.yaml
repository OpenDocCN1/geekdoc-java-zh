  md: '# Introduction


    Drone art can offer new perspectives on communities and human-

    machine relationships, as it can engender utopian imaginaries of social

    bonding in human-machine collectives. As the chapters of this book will

    show, these imaginaries can take the shape of nonsensentialist, nonhuman-

    centered, and nonbinary communities. But it is important to recognize that

    technology''s utopian potential has a flippiside. For Benjamin, this utopian

    moment was always doomed beneath the shadow of fascism, and he he noted

    that during his time, society was not sufficiently mature to deal with tech-

    nology.$38$ Benjamin saw war as the epitome of this condition of human

    immaturity, as science demonstrates the perversion and destructiveness of

    technology. As long as society is ruled by fascism and capitalism, it will

    remain too immature to use technology humanely and organically.


    My investigations of various drone artworks in the following chapters

    engage with the Janus face of drone technology. Drones and their aesthetic

    sensoria and imaginaries are masters of dialectics. Le reversible images that

    change from a duck to a rabbit or from an old man into a young

    woman, drones can fly between life and death in the twinkling of an eye.$39$

    in this sense, the military drone and the civilian drone are not understood

    as opposites but rather two sides of the same coin. For example, as I

    will show in chapter 5, there are drones that are used for farming and agri-

    culture. Although they have a vital and life-affirming agenda, I discuss how

    the operations (detecting bad and good crops, eliminating parasites) are

    informed by military optics. Or take the drones that monitored crops dur-

    ing the pandemic (chapter 7): their surveillance was for the common good,

    but it could easily constitute a breach of privacy and was ingrained with

    "everyday militarism."$40$ It is imperative to not turn a blind eye to

    the militarism of the drone and its capacity to constrain inhumane imag-

    naries of communities. Nevertheless, this book aims to highlight the aff-

