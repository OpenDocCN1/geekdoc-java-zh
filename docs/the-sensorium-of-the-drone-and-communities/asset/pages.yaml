    # Pandemic Communities


    This chapter shows that the drone plays a central role in the medialization of
    the pandemic. The drone and its sensoria can intervene by spraying disinfectants,
    monitoring crowds, and detecting temperatures. Further, artists use drones as
    aesthetic media and provide aesthetic imagi- naries of the pandemic. In all these
    aesthetic sens, the drone negotiates models of communities. As I have discussed
    in this book, the drone is a technology that enforces social sorting and surveillance.
    In this way, the drone can act as a biopolitical device of social segregation,
    sorting the infected from the nonexistent, separating the healthy from the unhealthy.
    Many researchers have pointed to infringements of civil liberties and privacy
    in this respect, and they see the drone as a powerful tech- nology that enforces
    police and state surveillance. The drone in this sense is a technology of control
    embedded in the power discourses of militarism.


    But besides these violent, inhumane, and military forms of commu- shaping, I have
    shown that the pandemic drone also has the power to imagine communities that are
    not defined by those criteria. In artworks particular, the drone can suggest visions
    of communities where remote sensing technology does not suppress but empowers
    the human agent. The pandemic drone as an aesthetic medium can experiment with
    new forms of social bonding, creating alliances between the human and the machine.
    The speculative imaginary of Rotor DRI suggests the drone as a companion to cope
    with the devastation of a pandemic. The film portrays a human community that has
    lost everything but has learned to relate to machines. These drones are not glorified
    as saviors; they simply coexist with humans in equal ways. This projection of
    an emotional and affective community between humans and drones is also present
    in the COVID-19 ghost town movies, in which the drone evolves into a medium that
    pro- vides an empathetic perspective. The drone mass ornament gives insights into
    how we today night imagine subjectivity and communities where the human subject/individual
