    of communities.


    # Facial Recognition and Cultural Coding


    The face is one of our most important features for communication. Our face always
    works with reciprocity: it only becomes expressive in relation to and in dynamic
    with others. Facial recognition programs disrupt reciprocity: machine vision is
    unable to flirt with us. Facial recognition systems read faces and identities
    by matching a digital image of the face against a large database of facial images.
    These systems are ubiquitous in cellphones, social media platforms (for example,
    Facebook, Snapchat, and DeepFace), identity verification systems, transportation
    (for example, flight check-in), and border control. Facial recognition practices
    are also embedded in the discourse of biometrics, the “science of using biological
    information for the purposes of identification and verification.”¹⁶ Alongside
    fingerprints, iris scans, and DNA, facial recognition plays a key role in biometrics.
    A common denominator of facial recognition is the idea that the face is an important
    index of human identity.¹⁷ Recognizing faces via machines is a complex undertaking
