    in search of new forms of communities associated with drone technology. But I
    also chosen the notion of community (rather than, say, society or social network)
    because it highlights that there is something we share with drones. This sharing
    is not necessarily an intersubjective activity which is given out exclusively
    from human to human. Instead, it is a sharing with the machines. The currencies
    of this sharing are the images, signs, signals, and bytes that the drone assemblage
    collects. These data are organized, selected, and ordered by the algorithms, software
    programs, AI, and human agents that distribute, exchange, send, receive, post,
    and circulate them. embodies processes of networking, data flows, AI, and information
    exchange between agents and machines, as well as among machines.


    Thus drones and their agents share data under very different premises and contexts.
    The sharing of drone data can indicate giving to, or even caring for, a community.
    The drone not only provides intimacy connectivity to the community but is both
    bodily and intimately attached to the human. For example, we find this personal
    community around drones in their use by protesters and environmental activists.
    In these communities, the sensorium of the drone and its data sharing can create
    new forms of human bonding beyond social divisions, such as planetary communities
    that are no longer human centered or exclusively anthropomorphic. The drone can
    suggest communities that are nontotalizing, dynamic, fluid social formations beyond
    closed unites.


    But the dialectics of the drone and its sharing activity can also take another
    turn: drone sensing can be devoid of mutual exchange and take away from people.
    Drones (like smartphones, cameras, and sensor interfaces) have radically increased
