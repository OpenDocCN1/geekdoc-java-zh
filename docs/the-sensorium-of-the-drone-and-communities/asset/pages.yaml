    human species does not ultimately own or control the earth. The human era is finite;
    we are destroying our own living conditions and wreaking environmental damage.
    Thanks to global warming and our exploitation of resources, the era of the human
    as the sovereign of creation may be near its end. This potential ending brings
    with it a change of consciousness, perhaps expressed in Timothy Morton''s conception
    of ecology without nature. For Morton, “nature” is a construct that fuels the
    differentiation between civilization and the natural world, a dichotomy that instrumentalizes
    nature as an object of exploitation. Instead, he argues for a type of ecology
    that embeds the human and the environment in less hierarchical entanglements and
