  md: '# Introduction


    visceral level of machinic sensing. It is imperative to my book''s agenda to understand
    that these drone sensoria also have a collective dimension: they are about communities.


    Drone researchers to date mainly discussed communities in a military context.
    As products of the visual politics of the scopic regime, such communities feature
    the clear options that the regime entails: top/bottom, target/narget, observer/nonobserver,
    visible/invisible, machine/human. Unlike this previous research, however, I argue
    that the aesthetic sensoria of civilian drones construct communities on the basis
    of decentralized, network-like, and fluid sensing processes. In this context,
    constructing means that in aesthetic works the sensorial assemblage of the drone
    can create imaginaries of communities. This notion of the imaginary connects in
    some ways with the work of Charles Taylor, who points to the idea that cultural
    practices shape social imaginaries. However, I use term slightly differently.
    Taylor conducts a macroanalysis of how Western cultural forms and normative discourse
    display modernity. I am more interested in the fluid, dynamic, and amorphous imaginaries
    of communities that are generated by the aesthetic sensorium of the drone in a
    plethora of different works. In addition to these aesthetic imaginaries of communities,
    I also focus on how civilian drone sensoria can generate “real” communities. There
    are real-world communities where the drone plays a constitutive role, such as
    hobby drone communities, social movements, and groups of political activists.
    But these communities too—and here I draw on Benedict Anderson—have an imaginary
    dimension, as they revolve around ideas and narratives about the drone. As I discuss
    in chapter 1, which sets up my theoretical framework and develops my understanding
    of the notion of community, I am especially interested in imaginaries of communities
    that highlight machine—human assemblages, swarms, multitudes, and data-calculable
    publics. The drone sensorium can engender visions of communities that suggest
    new forms of bonding between machinic and human environments. It can create imaginaries
    of posthuman collectives that are no longer exclusively defined by human subjectivity
    and identity but rather are manifested in looser constellations between the human
    and the nonhuman—the Zoological, the earth, and the machine.


    The Sensorium of the Drone and Communities thus explores the sensorium of civilian,
    commercial, and amateur drones, although I remain highly aware that military and
    civilian remote sensing technologies'
  merge: -1
