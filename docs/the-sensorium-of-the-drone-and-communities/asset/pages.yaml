  md: 'Modernist visions of insect communities are frequently based on hierarchical
    and authoritarian social order. For example, in Maurice Maeterlinck''s Life of
    a Bee (1901), the individual bee is overruled by the collective beehive. This
    view of the bee community also resonates in Waldemar Bonsels''s book The Adventures
    of Maya, the Story of an Industrial Bee (Die Bije Maya und ihre Abenteuer, 1912),
    later adapted into a film and a cartoon.27 The individual spirit of the bee Maya
    comes into conflict with the rules and hierarchical (even totalitarian) power
    relations of the hive. These modernist insect community visions are characterized
    by a “politics of rationalization and birth of a certain ''Fordist order.’28 Inspired
    by capitalism''s doctrine of efficiency, these communities are defined by a central
    authority that creates hierarchical, top-down social structures.


    Parikka argues that this connection between bee communities and hierarchical community
    models took a new turn with the emergence of cybernetics, a heterogeneous field
    of systems research that encompasses biology, sociology, engineering, communication
    studies, and many other disciplines.29 The rise of cybernetics is often connected
    to mathematician and engineer Norbert Wiener''s work on self-regulated systems.30
    Parikka shows how animal behavior was for Wiener''s cybernetic theory, which often
    compared the sensing of animals to the sensing of machines: Parikka discusses
    the experiments in which Wiener used to investigate light-sensitive behavior.31
    The French scientist, physiologist, and photographer Étienne-Jules Marey had already
    experimented with the connection between insects and self-steered technology as
    early as 1873. His artificial insect machine, La Machine Anime, investigated flight
    movements, using the insect as a sensory and physiological case study for the
    mechanical apparatus.32


    During the twentieth century, sensorial explorations of insect behavior continued
    to accrue social and biophysical dimensions: “Insect bodies contract and transcribe
    more abstract social and political concerns; insects mediate. . . Insects could
    offer, in addition to the lessons in rationalized management of a Taylorian kind,
    lessons in agency without a center, phenomena that during recent years have been
    raised as the new modes of radical politics through concepts as multitude, swarms,
    and smart mobs.”33 Insects can organize alternatives to Fordist models, and to
    hierarchical and sociocentric social configurations; they can offer social agency
    without a center. What alternative models can we learn from insect swarms, and
