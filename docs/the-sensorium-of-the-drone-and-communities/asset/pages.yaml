    and his dialectical embrace of mass culture and technology.


    # The Dialectics of the Drone Sensorium


    For Benjamin, mass media shape new creative processes and alter our ways\ perception,
    reception, and interpretation. Photography, for example,

    evokes the destruction of the “aura” and demands an aesthetic sensing that

    is no longer based on contemplation, ritual, or cult. Rather, photographs

    tigger disruption, thereby undoing the traditional aesthetic categories of

    contemplation, union, originality, and myth. Benjamin welcomes these

    ew media technologies and considers their destructive force as the condi-tion
    of possibility for construction, that is, for a utopian perspective on a dif-ferent
    society. Depending on how one interprets Benjamin’s philosophersabout media technology,
    this constructive moment of technology can be

    incorporated into a Marxist theoretical frame, a messianic theological horizon-,
    or a theory of aesthetic experience (or a combination of three). For

    me, it is not so important to determine which type of utopia is at stake in

    Benjamin’s thinking. Rather, what is key is that his philosophy marks the

    advent of new technologies as a productive and empowering moment, and

    that art in league with these technologies can construct, shape, and consti-tute
    imaginaries of communities.'
