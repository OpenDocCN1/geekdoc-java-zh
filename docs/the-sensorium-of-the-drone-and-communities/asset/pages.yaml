  md: '# Facial Sensing and Datafied Communities


    What does it mean for our views about data processors when a “dumb” flying drone
    can turn “smart” and learn to recognize faces? What does that in turn for the
    power of this drone sensorium to shape and imagine communities? A drone sensorium
    with facial recognition no longer senses in a scopic vertical fashion. Rather,
    as the artworks in this chapter suggest, a drone with facial recognition senses
    in a networked, datafied, and multidirectional fashion. This kind of sensing also
    defines the ways in which these artworks envision communities, and it is a dialectical
    affair. As I will show, some artworks portray the drone''s capacity to see faces
    as a special form of bonding, and reveal affective communities where drones and
    humans form an alliance. Other artists—and these are far by the majority—warn
    us about drones with facial recognition, dismantling their failures, biases, and
    violence. In these instances the drone tech turns against the human agent and
    shaping terrifying visions of communities where drones distinguish humans.


