    # Ernst Jünger’s Drone Swarm as Multitude


    In cultural and aesthetic research on drone imaginaries, Jünger’s science fiction
    story The Glass Bees (Die gläsernen Bienen, 1957) have become wide-currency. Scholars
    who have discussed the German author’s hallucinatory fables about microdrones
    in terms of the aesthetics of terror, violence, and warfare.³ A soldier and writer,
    Jünger (1895–1998) lived a long and controversial life. His conservative, antiliberal
    attitudes, his aestheticized writings about war and violence, and his fascination
    with the National Socialist movement in Germany still polarize scholars today⁵
    Jünger had a deep interest in technology, especially in automation, communication,
    and visual media. In 1994 Heliopolis: Retrospective of a City (Heliopolis: Rückblick
    auf eine Stadt), a dystopian novel about a future metropolis, he describes the
    phonophor, a mobile communication device that might be interpreted as a forerunner
    of the cellphone; in the postapocalyptic Eumesville (1977), the Luminar shows
    an early vision of the Internet. Jünger was strongly interested in emerging discussions
    about cybernetics and was likely aware of the Macy Conferences.³⁶ The Glass Bees
    connects his interests in robotics, emergent systems, and insects. And as well
