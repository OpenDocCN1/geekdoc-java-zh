  md: '# Introduction


    Drones are blobs. In Ag Haines''s art project *Drones with Desires* (2015), the
    drone is bubblelike, globular, and slimy looking. A large pink balloon that resembles
    a human organ, with dark red and bluish blotches, hovers in the gallery.¹ The
    artwork does not portray the cold, smooth drone one one would associate with precision
    remote-targeting technology. Instead, this drone is amorphous, fleshy, and alive.
    To create this drone-blob, Haines scanned her own brain and translated its visual
    anatomy into artificial neural networks that control the drone''s motions through
    sensory inputs. We might understand Haines''s drone-blob as referring to the diffuse,
    dehumanizing, and monstrous violence of military drones. However, I do not read
    this blob as epitomizing the “techno-bestary” of the drone.² For me, its “blobbness”
    exemplifies the drone''s potential for antisropic and multisensorial sensing.
    The blob and its datafied, tactile, and kinetic modes of sensing point to this
    book''s main idea: drones are more than aerial cyclopes with pointed vertical
    vision; they embody sensorialia with a plethora of heterogeneous sensing modes.


    Drone technology has garnered critical attention across disciplinary fields, from
    engineering to the social sciences and humanities. The first wave of drone scholarship
    was pivotal in initiating the debate on the emergence and routinization of this
    technology in the military. In doing so, it privileged the idea of the “scopic
    regime” in its analyses of the connection between vision and power. These early
    researchers defined the drone regime as a militarized system of hypervisibility
    that affected a vertical, hierarchical, and totalized power relation between the
    drone operator and the surveilled target. While the scopic regime is certainly
    a key characteristic of drone vision, this book broadens the drone’s spectrum
    of perception by drawing on the notion of the sensorium. Taking an'
