    The drones are singular units that piece together the human figures as giant mobile
    networks of data processors. In Kracauer''s mass ornament, the human figure is
    not an individual; it is instead constituted from what Kracauer calls “building
    blocks,⁶¹ fragments and rationalized patterns. Svea Brauenert has interpreted
    this version of the human figure as a “dividual.”⁶² The notion of the individual
    was introduced by Gilles Deleuze to explain that in modern societies of control,
    the human individual is endlessly divisible and reducible to data representations
    via technology. The individual becomes a “dividualized” body in the form of “samples,
