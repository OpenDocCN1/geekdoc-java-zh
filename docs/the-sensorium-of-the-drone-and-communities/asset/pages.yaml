    balloons, still fascinate today. Aside from stunning shows, aerial balloons also
    inspired fashion trends, influencing the design of clothing, fine china, and porcelain
    figurines.10 Many late eighteenth- and nineteenth-century literary authors were
    enchanted by balloons and wrote about these new airships with great passion.11
    Similarly to the emergence of contemporary drone art, balloon art became an aesthetic
    genre. Eighteenth- and nineteenth-century ''balloonomania'' in art and popular
    culture can be compared to the ''drone-orama'' of today''s media hype around drone
    technology.12


    As well as featuring in aesthetic works and popular entertainments, balloons,
    like drones, were seen from the outset as a dual technology that had strategic
    potential for warfare. Joseph Montgolier himself noted, "By making the balloon''s
    bag big enough, it will be possible to introduce an entire army, which, borne
    by the wind, will enter right over the heads of the English."13 Like drones, balloons
    were immediately instrumentalized by the military for aerial reconnaissance-bombing,
    and the transportation of goods. For example, at the Battle of Fleurus on June
    26, 1794, the French army used the balloon L''Entreprenant to get a better view
