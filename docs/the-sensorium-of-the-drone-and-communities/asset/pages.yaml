  md: '# 4 Flattened Sensing and Planetary Communities


    “Seeing the world from above above doesn’t just flatten things. It sharpens them,”
    says the actor playing the drone pilot in Omer Fast’s fictional short 5000 Feet
    Is the Best.¹ Flattening is an infographic feature of the images that drones produce
    while surveilling the earth from above, which show the world as an abstract surface
    without depth. Research on the scopic regime of military drones often interprets
    these images as products of an operative form of sensing that dehumanizes, controls,
    and masters the world.² As Fast’s drone pilot says, the flattened drone view sharpens
    things: it acts like a violent blade that cuts and kills. Flattening can also
    have a different effect. In contrast to the amateur drone’s flattening can evoke
    interconnectness instead of control and mastery: the drone can become a medium
    for planetaryity.


    During decades, the planetary has become an important concept in the humanities,
    including in media studies, cultural studies, and literature.³ While globalism
    is rooted in the idea that the world is connected by the global flow of capitalism,
    the discourse of the planetary positions the human in relation to the planet as
    a zone of life and climate. The planetary view does not categorize the earth according
    to nation-states, international cooperation, or global networks, it sees the people
    on the planet as one, without making them the same. According to Gayatri Chakravorty
    Spivak, the planetary stands in opposition to concepts of the worldly, the global,
    and the continental, which function according to the ideology of capitalism and
    remain imbued with cultural and national essentialisms.⁴ By contrast, for planetary
    subjects, alterity is not derivative. In the positioning of human subjects vis-à-vis
    the planet, the conditions of differentiation are erased: “The planet is the species
    of alterity, belonging to another system; and yet we inhabit it in loan.”⁵ Planetary
    subjects do not insist on their'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'property rights to the planet. They understand the earth as a place they have
    on loan and are thus positioned in opposition to the processes of global financialization
    and capitalist homogenization.⁶ It is important to note that the concept of the
    planetary is also criticized for entailing total-izing and unifying tendencies
    that erase difference and heterogeneity, and my interpretations of the artworks
    strive to show this as well.⁷


    This chapter argues that the drone''s flattening gaze has the potential to envision
    planetary communities. In these visions of community, humans appropriate the earth
    not as a specific territory that belongs to some of them, but as a common planetary
    space that needs to be protected. In order to develop this argument, my first
    step is to historicize the drone, finding “family resemblances” between the drone
    and hot-air balloons. This media-archaeological and genealogical approach turns
    its face against techno-optimistic narratives of the drone as the latest game-changing
    technology and shows that the drone as the balloon''s descendant has potential
    for creative, imaginative, and utopian visions of planetarity. Before I engage
    in a close reading of aesthetic drone imaginaries and their planetary visions,
    this filiation between the drone and the balloon must be mapped out.


    # Aerial Gas Balloons as Early Drones


    At first glance, hot-air or gas balloons and drones seem very different. Balloons
    are beautiful, colorful airships that ascend serenity; drones are rather ugly.
    Drones have been developed and utilized mostly in the twenty-first century; gas
    balloons were invented in the eighteenth century. Nevertheless, there are some
    striking similarities between the two aerial technologies. I do not see the invention
    of the drone as part of a linear, chronological narrative. Rather, I consider
    the aerial balloon as a distant relative to the drone, connected via a specific
    aesthetic mode of sensing and interpreting the earth⁸ Let us look at the beginnings
    of ballooning.


    On June 5, 1783, only a few years before the French Revolution, the Montgolfier
    brothers released their first hot-air balloon into the sky. From that day on,
    engineers, enthusiasts, entrepreneurs, artists, and writers experimented with
    improved, developed, and wrote about balloon-flying technology. Félix Nadar, for
    example, was the superstar balloonist of the nineteenth century. His spectacular
    journeys and failures (such as the crash of his balloon Le Géant), as well as
    his early attempts to take aerial photographs from his'
