    in unpredictable and uncontrollable ways (auschwärmen). Schwärmen has a sensorial
    dimension that refers to bodily ecstasy, sensory intensity, and affective exuberance.
    schwärmen can also mean to rave about something, to fantasize, to worship, to
    be enthused about something or someone. It describes an affective state of ecstasy,
