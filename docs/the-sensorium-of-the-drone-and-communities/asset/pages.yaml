    # Drone Shows as Mass Ornaments


    In drone shows, hundreds of drones illuminate the night sky, forming figures\and
    patterns in the air with various light effects. These digital fireworks serve

    as public spectacles, for example, at New Year’s celebrations or the opening

    of sports events. At the 2017 Super Bowl, over three hundred drones painted

    t US flag above the sky; the giant cover of Time magazine’s themed

    issue “The Drone Age” showed over eight hundred drones lighting up the

    sky. With the advent of the COVID-19 pandemic in 2020, such drone dis-

    plays increased in number. As social distancing rules were enforced, drone

    light shows became a reckless form of artistic display during holiday seasons

    or sporting events without physical audiences. Drone light shows that

    ly addressed the crisis became especially popular: drone displays

    would form a giant mask in the sky, or an image of the spiky red COVID-

    9 virus, or hands ready to receive sanitizer. There were also drone dis-

    plays that wrote messages, using the sky as a cover for warnings

    miniscent of the biblical scripture on the wall, mene, mene, tekel, upharsin,

    {numbered, weighed, divided”}, referring to God’s dooming of the

    kingdom Belshaazaar as well as messages of appreciation). At a display in

    South Korea, hundreds of drones drew hearts and wrote you notes in

    t sky, expressing gratitude to frontline medical staff for their work.


    How can we interpret these drone spectacles? Are they simple manifesta-

    of tech companies’ profit interests? Are they yet another allegory for the

    militarization of our pandemic everyday? Similarly to my approach to Rotor

    DRI and COVID-19 ghost drone movies, I want to find out whether

    these pandemic aesthetic drone sensors can provide us with new knowledge

    bout how we see ourselves and our communities. To do so, I will look back

    through history and delve into the mass culture of the Weimar Republic.

    This history of the drone will help me to understand the power of its

    sensorium and dismantle the image of the drone as a super-new, state-of-

    t-art technology. It will also open an experimental event to service

    machinocentric empathetic communities.


    In many ways, today’s drone shows resemble the “mass ornament” ana-

    lized by Cracauer almost hundreds years ago.56 Obviously, Cracauer’s famous

    essay “The Mass Ornament” does not mention drones; it speaks instead of

    t 1920s phenomenon of mass dance formations, exemplified by the Tiller

    Girls. This dance troupe staged mass performances in dance halls and sports'
