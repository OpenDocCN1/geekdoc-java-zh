    Where military drones focus on a target on the earth, the dronie focuses away
    from the ground as it leaves its controller behind, and the pilot''s gradual disappearance
    into the landscape inverts the target logic of the military drone view. The dronie''s
    controller is the vanishing point, a figure that becomes minimized and eventually
    unrecognizable. The more the pilot disappears, the more their body seems to merge
    with the drone machine. Although the pilot is no longer visible, the dronie suggests
    their presence in the sky, as if the drone has taken the pilot''s body and levitated
    it. Peter Ade has written about the levitation of the drone, and has suggested
    a change of perspective: instead of looking down from the sky, he focuses on the
    moment the drone takes off.¹18 For Ade, the cultural and theological myth of levitation
    is key to the drone''s fascinating power: its floating into the sky reveals religious
    narratives of ascension.¹19 Indeed, this idea of levitation links directly to
    the mythological and religious roots of telepresence, since the technology suggests
    a departure from one body and into another space or body. The drone flies with
    this cultural and religious aspect of levitation. It literally elevates the pilot''s
    body into the air, enabling it to be in the film, from the ground and in the air
    simultaneously.


    This state of levitation is not informed by the scopic, vectorized gaze of a dominating
    subject. The drone fuses the pilot''s body with the drone by making them one intertwined
    technobody. This sensorial assemblage enmeshes the remote sensing technology with
    the pilot''s body, a GPS tracking system, wireless radio frequency transmitters,
    and ultimately, the technology of social media platforms and their multiple viewers.
    This levitated assemblage is no longer bound to the ground or confined by the
    natural eye; it is able to see and sense its environment bodily. Thus the drone
    does not reiterate its military relatives'' violent gaze from the sky; it hovers
    away from its controllers, even as it paradoxically takes them with it.


    Of course, the drone tends to reiterate tourist aesthetics by filming spectacular
    landscapes and attractions. Like the panorama, which was a mass medium that exoticized
    the cultural other, the drone can also be seen as serving the tourist industry.¹20
    Nevertheless, drones have different aesthetics than travel shows. While panoramas
