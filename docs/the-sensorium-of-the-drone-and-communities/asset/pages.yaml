  md: '# Conclusion


    # 197


    and it foreshadows what might be possible in the near future. Emilio Vavarella
    and Daniel Belquer, the creators of Mnemodrone, describe the project as posthumanocentric
    because it engages with “machocentric creativity” and AI, decentering the human
    in communicative, social, and aesthetic processes.⁴


    This power of drone fusing is what this book has sought to unearth. Aesthetic
    drone sensoria and their respective imaginaries of communities can construct visions
    of the future. They can provide us with speculative scenarios regarding how humans
    might live with machines, and how we relate to remote sensing technology beyond
    its rationalized and militaristic instrumentalation. This type of fusing has nothing
    to do with preemption. It is a modern type of fusing based on dynamism, change,
    and open-endedness. I am not agreeing that drones follow a higher telos of history,
    striving for the perfectibility of technology. I simply dare to infuse the drone
    with a small dose of philosophical playfulness. Specifically in the realm of drones,
    drones can make us reflect on our relationship with intelligent machines in new
    ways and potentially shape our future in ways that will be beneficial for the
    planet.


    This view of drones is unusual in the humanities. Typically, drones are regarded
    as technological devices that nullify the future by determining it before it begins.
    They are rather modern that way.⁵ Their capacity for constant surveillance can
    predict future crimes. In combination with AI and predictive algorithms, the military
    drone can foresee terror operations and insurgencies.⁶ In these preemptive operations,
    the drone annihilates the future, because it seeks to know what will happen in
    advance: technological determinism and essentialism. Intervening in the contingencies
    of life, predicting fates before they are enacted, is a dangerous business. In
    the film Minority Report (2002), cogs, machines, and humans detect premeditations
    of crimes, and these “offenders” have not yet committed crimes, and they might
    have been about to change their minds. The very essence of the future, namely
    its unpredictability and contingency, is calculated away. We all know that this
    type of preemption is no fiction: the drone may be the technology to execute preemptive
    war strikes. As a military drone once admitted, “Sometimes I felt like a God hurling
    thunderbolts from afar.”⁷ Often, discourses that nestle the drone in a scopic
    regime of omnivoyance accentuate its Olympian powers.⁸ As Brian Massumi notes,
    impersonating the view of'
