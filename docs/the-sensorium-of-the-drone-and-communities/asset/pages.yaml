    before the boom of the World Wide Web, artists began to engage specifically with
    telepresence media technology. 36 I am interested in contemporary artists who
    work with drones as a technology that can evoke effects of telepresence, and how
    these effects can engender visions of communities.


    There have been some literary works that represent drones as telepresence machines.
    For example, in Tom Hillenbrand''s 2014 crime novel Drohnenland (Drone State),
    a "mirror space" teleports people to other places, and constructions of numerous
    invisible drone cameras can simulate faraway situations and enabling-always surveillance
    and eye-witnessing. 37 In William Gibson''s 2015 novel Peripheral, dronelike androids
    (the "Peripherals") are controlled by pilots, and the character Flynn provides
    security services through first-person-view drones. However, literary imaginings
    are not so productive, as they mention drones only marginally and do not engage
    in depth with the embodied sensorium of the drone. Instead, my focus in this chapter
    is on contemporary visual artists who explore the constructive and creative practices
    of amateur drone technology, its potential for embodied and telepresent sensing,
    and its community-shaping effects. In contrast to DIY dronists, these artists
    use the technody of the drone to reflect on the construction of the body and its
    relationship to machines. In doing so, they provoke reflections about how drone
    technology and its embodied sensorium can shape imaginaries of communities by
    revealing the drone''s dualistic and dialectical configuration. The artworks simultaneously
    reflect new, creative, symbiotic communities of drones and humans by simultaneously
    raising questions about the power and violence of such drone communities.


    The artworks in question can all be characterized as installations: they are three-dimensional
    and site-specific, and they combine diverse media and materials.38 Thus they share
