    # Humans as Drones


    As early as the 1980s, Marvin Minsky proposed that telepresence technology might
    be dealt with accidents in nuclear power plants, or to help humans gain access
    to secured and hostile areas. He saw telepresence not only as a technology to
    handle emergencies, but also as an instrument to maximize profits: “With telepresence
    one as easily work from a thousand miles away from a few feet. Manual labor could
    easily be done without leaving your home. People could work clubs. Any region
    of the world could export the specialized skills it has. Anywhere. A laborer in
    Botswana or India could market his or her abilities in Japan or Antarctica.”—52
    Minsky’s expression “work club” suggests voluntarness and self-organization, euphemizing
    the realities of outsourced labor. The outsourcing of labor—including virtual
    labor, such as telemarketing, call centers, and information technology services—is
    not a voluntary effort on the part of the worker. It is often based on social
    inequality because it is a cost-cutting measure in respect to salaries, personnel
    costs, safety, and labor regulations. Although Minsky saw economic benefits in
    telepresence, it comes as no surprise that his ideas were inspired by Robert Heinlein’s
    dystopian short story “Waldo” (1942), in which a telepresence technology turns
    humans into its servants.


    Today’s telepresence technology can use humans as surrogates and turn them into
    drones—which happens in the imaginaries of engineers and artists alike. But how
    can a human be a drone? This would certainly be a stretch with regard to the definition
    of drones as remote-controlled machines. However, if we recognize telepresence
    as a key signifier of the drone, then the examples I am about to discuss can be
    seen as cases where humans become drone sensoria.


