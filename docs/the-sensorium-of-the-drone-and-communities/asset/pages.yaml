  md: 'How do earth drones and their volumetric sensors define our relationship with
    the earth? Do the military origins of drone technology determine this relationship,
    or can earth drones generate a connection to the earth that goes beyond the power
    relations of the vertical? What do these drones tell us about the earth in the
    context of the Anthropocene? And does the earth drone’s sensorium generate imaginaries
    of communities? To find answers to these questions, I use the term volumetric
    in a slightly broader sense than is usual in the fields of mobility studies and
    human geography, although I have been greatly inspired by research in those fields.
    The fields of architecture, landscape design, and urban planning have used the
    concept of volumetric points to the idea of building up into the sky and grasping
    the threedimensionality of urban space. Lidar and point cloud modeling are often
    applied for purposes. The term lidar was originally an acronym for light detection
    and ranging, a remote sensing method that uses lasers to measure spatial ranges.
    A point cloud is a set of data points that can represent the three-dimensional
    shape of an object. In the context of these sensing technologies, the key question
    for me is what happens to our perception of the earth when volumetric sensor technologies
    are attached to a drone—when a drone camera sees in a way that creates three-dimensional
    spaces rather than flattened views from above.


    I trace the volumetric dimension of the drone primarily in aesthetic contexts,
    an angle research has left unexplored. Contemporary drone artists are experimenting
    with the volumetric sensorium of the drone, and such artworks are my focus here.
    Besides these artistic negotiations, the sensorial quality of earth drones (their
    aisément) is also important, and I focus on how drones register, calculate, and
    survey the earth in nonistic contexts, such as agriculture. My main intention
    is to show that earth drones sense volumetrically, and in doing so they can generate
    imaginaries of communities that are in close dialogue with the discourse of the
    Anthropocene.


    The term Anthropocene signifies the time period which humans have affected the
    earth. Recent discussions have extended this notion beyond its use in earth sciences;
    the humanities have used it to initiate critical debates about the human subject’s
    role and position with regard to the earth, its sustainability, and the exploitation
    of the natural environment. For me, the Anthropocene describes the'
