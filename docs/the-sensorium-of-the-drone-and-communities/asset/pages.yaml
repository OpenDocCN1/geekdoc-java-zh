  md: '# Conclusion


    These drones do not separate us from the earth enmesh us with its materiality.


    In bringing closer to the earth, the drone also engages us with what we see as
    nonhuman. Part IV, on the drone and the nonhuman, demonstrated that the aesthetic
    drone sensorium can imagine communities that integrate a zoological, nonhuman,
    swarmlike dimension. The swarm is not a pri priori for the bestial dehumanized
    “other,” but offers a trajectory for thinking communities as multitudes.


    Many of the diverse aesthetic imaginaries of drone communities that I have discussed
    in this book have utopian glimpses at their core. Some of them show communities
    where hierarchies between machines and humans are flattened, and where the drone
    and the human are thought together in a creative embracing assemblage. Some suggest
    planetary communities that seek to overcome the territorialization of the earth
    by exclusion, colonialism, and imperialism. I have traced community visions that
    connect to Jean-Luc Nancy’s and Rosi Braidotti’s ideas about communities, in which
    notions of identity, origin, and authenticity longer longer. I wanted to show
    that the multisensorial of the drone can shape a template for imagining communities
    that are defined neither by the “collective singular”11 nor by the violent exclusionary
    networks of predictive algorithms.


    The aesthetic imaginaries of communities that I have harvested from the drone
    art reveal the life-affirming and vital potentials of the remote and machinic
    drone sensorium, and experiment with community visions that arise from thoughtful
    difference, otherness, and posthumanism.


    This figuring with the drone makes us rethink our relation to the drone’s remote
    sensing technology. The drones in this book are much more than flying objects
    with sensors and computers inside. The artworks I have discussed that drones are
    epistemological engines: they shape the ways we think, interact with each other,
    and create worlds with technology. We can be closely entangled with drone technology;
    it can become like us. Following Benjamin once one might say that my book compares
    the drone to a natural “organ.” Benjamin noted that in the face of war, “society
    was not mature enough to make technology its organ.”12 Wars are still being fought
    today, but perhaps in light of our planetary vulnerability, we can begin to see
    technology as one of us. Benjamin connects his ideas to the notion of “organ projection”
    developed in Ernst Kapp’s 1877 text Elements of a Philosophy of Technology (Grundlinien
    einer Philosophie der'
