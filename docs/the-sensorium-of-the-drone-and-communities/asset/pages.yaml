  md: '# 5 Volumetric Sensing and Postcarbon Communities


    “Environment is not the ground or fundamental condition against which sensor technologies
    form, but rather develops with and through sensor technologies as they hold gras
    and concres in these contexts.”^1 This statement by Jennifer Gabrys suggests that
    our sensor-based monitoring of the earth is making new environments that intertwine
    technology, nature, and people. Through sensors, humans connect to the earth not
    only from outer space but also on and beneath its surface. These sensual geographies,
    which entwine the human and the nonhuman, are the focus of this chapter, which
    analyzes the drone’s ways of sensing the earth and enmeshing with it. As we saw
    in the previous chapter, drones can flatten the earth with their aerial view from
    above. But flattening is not the whole story: earth-sensing drones can also go
    three-dimensional. Tracing this three-dimensionality of the drone sensorium, this
    chapter investigates consumer drones that perceive the earth in the contexts of
    agriculture, landscape design, and art. I call these earth drones, since they
    are equipped with special sensors that monitor, observe, and surveil the earth.
    They are interfaces and data processors that can look up from the ground to the
    sky, monitor the surface (soil) and its in-between spaces, and sense deep into
    the ground. I characterize this multisensorium of earth drones as a form of “volumetric
    sensing”^2 that grasps the three-dimensionality of space. As Ole B. Jensen notes,
    “Volumetric meaning an awareness of an x, y, and z axis that spans out three-dimensional
    space. Spoken more plainly, the earth that can move up, down, sideways and to
    the front and back is all about the volumetric space in which it can move.”^3
    Accordingly the volumetric does not embody a static vision of three-dimensionality
    but is based on mobility pertaining a constant change of perspective.'
