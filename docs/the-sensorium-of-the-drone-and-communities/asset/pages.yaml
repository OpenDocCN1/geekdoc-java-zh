    # Cyborg Communities


    This chapter shows that the drone sensorium has a bodily dimension and can perform
    modes of embodied nonscopic sensing with telepresence effects. Dronies and drone
    racing are examples that show the telepresence effect that is inherent in the
    drone sensorium. Like their nineteenth-century predecessors, they are media that
    attempt to immerse the viewer in another reality, in a bodily and affective fashion.
    The artworks I have discussed here with these telepresence effects, either because
    the drones invite the viewer to be part of a dance performance (in Vogel''s installation)
    or because drones embody other persons (the grandmother drone in Arunanondchai''s
    work).


    All of these embodied drone sensing assemblages can also—for better or worse—shape
    the imaginaries of social communities. These communities have a local dimension,
    as we have seen with the hobby dronists. Besides connecting online and through
    social media, drone racers meet physically and organize community events in ways
    that are reminiscent of private associations. Thus the drone as remote surveillance
    technology constructs not only anonymous collectives but also communities that
    are reminiscent of (sports) clubs. The drone artworks discussed in this chapter
    also reveal this community dimension of the embodied drone sensory. In contrast
    to hobby dronists, these artists provoke debate about how machine–human communities
    are culturally and politically envisioned. The artworks by Vogel and Arunanondchai
    demonstrate the creative potentials that are available for communities when the
    drone is placed on an'
