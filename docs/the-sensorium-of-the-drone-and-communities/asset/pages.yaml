  md: '# Afterword 205


    fire to humans; the romance embodies innovation, optimism, emancipation, and progress.
    But the romance has a flip side: with the gruesome punishments he had to endure,
    Prometheus certainly paid a price for his technological optimism. Prometheus as
    the avatar of the self-made man is also a tragic figure, symbolizing alienation,
    the rift between nature and humanity, and the incessant, self-destructive Faustian
    drive to compete. I believe a key competence of the humanities is to analyze narratives
    about technology, to think about alternate plots (comedy, farce, or melodrama,
    for example), and to reflect on them critically in light of our current lifeworlds.
    Indeed, I believe this competence is truly needed in a world that deploys profit
    technofix solutions to societal problems.


    There are a couple aspects of techné that I consider important to the field of
    humanistic studies: culture techniques (Kulturtechniken), aesthetics, and technique.
    Techné as poesis implies a entwinement between culture and technology. This relationship
    has often been characterized by antagonistic and alienation: culture is threatened
    by technology, and technology is not part of culture because it is simply not
    beautiful. However, in recent decades the humanities have discussed the interdependence
    of culture and technology by pointing to the nature of culture techniques. Inspired
    by the semantics of *agriculture—culture* as the tilling of a field—culture techniques
    are concepts for handling life situations (making fire, language, maps, images).¹


    Technology as techné shares family resemblances with the arts, poetry, and fiction.
    Technology, however, also plays an important role in a role-binding discipline,
    namely aesthetics. This is the branch of philosophy that deals with questions
    of beauty and taste, as well as (and most importantly) with the nature of sensual
    knowledge. The concept of aesthetics as sensual knowledge can be traced from Aristotle
    to Alexander Gottlieb von Baumgarten, Christian Wolff, and Immanuel Kant. The
    school around the German philosopher Böhm revitalized this idea of aesthetics
    as sensual knowledge, specifically in light of technology.² Technological inventions
    demand their own technosensibilities and experiences, which is the key topic of
    this book on drones.


    One must be aware, however, that the idea of aesthetics as an epistemic discipline
    of sensual knowledge also limits the autonomy of art. Theories about sensing and
    aesthetic judgment are not art. Art does not need a discipline; it does not have
    to adhere to sense-making rules. It is precisely'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'this freedom that makes art so special. Art offers the conditions in which
    to observe the world differently, that is, noninstrumentally, affectively, and
    nondiscursively. This power of art is absolutely vital when we engage with technology
    in the humanities. Artistic interpretations of technology (whether in sci-fi novels,
    experimental film, or visual art) can reflect technology''s vulnerability, uncertainty,
    and fallibility. In artists'' work, representations of technology evoke dissensus:
    artworks that negotiate, criticize, ironize, queer, celebrate, and make technology
    strange.


    This view of critique requires me to engage with technology by moving beyond established
    thought traditions and exploring new ways of thinking about technology and humans.
    Is technique something of which only humans are capable? Is there a way of reading
    techné in a posthuman context? Artificial intelligence, autonomous machines, smart
    technologies, and algorithms are capable of pokies: they are able to make the
    world, and to create meaning. I consider it of the utmost importance that humanists—experts
    in deciphering and analyzing the production of meaning—should engage with these
    new abilities of machines, which produce new forms of intelligence. We need not
    only to reevaluate homo faber but also to embrace thinking about technology in
    new materialist constellations. We need to evaluate our human control seat amid
    technology in light of cyborgs, machinic sensing, smart algorithms, humanoid robots—and
    of course, drones.'
