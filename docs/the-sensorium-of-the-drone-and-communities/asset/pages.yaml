    by “always-on network sensors.”90 In this form of surveillance, there is no interactive
    sharing of data. Rather, the surveilled become anonymous units in a big-data pattern.
    The drone is a key figure in this ubiquitous, always-on, sensor-based monitoring
    and control.91 Thus the drone as aified sensor affects communities in destructive
    and dehumanizing ways: precisely by virtue of the connection between machines
    and humans, drones can execute violence, power, and oppression and function as
    instruments of data capitalism.92'
