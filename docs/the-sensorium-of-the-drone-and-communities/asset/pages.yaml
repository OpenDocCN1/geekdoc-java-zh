  md: 'Are these algorithms—the integral elements of facial recognition software—able
    to see? If one considers seeing to be a physiological process, one that requires
    living eyes, nerves, and brains, then machine vision does not count as seeing.
    If one understands seeing as a hermeneutic activity that interprets, opens, and
    understands the world as a synthesis of knowledge, then algorithms are not able
    to do that. An algorithm only matches images against a database, and it can only
    follow an if-logic. But things are not so easy. Algorithms can see, at least in
    a metaphorical sense.26 First of all, the physiological way of seeing might be
    only a small part of what we understand as seeing. As early as the nineteenth
    century, Hermann von Helmholtz studied the physiology of visual perception, the
    human eye and concluded that it was unable to produce objective representations
    of the world: “Insofar the quality of our sensation gives us a message about the
    peculiarity of the external influence by which it is evoked, the eye can count
    as a sign of it, but not as an image.”—27 The eye only receives signs and signals
    from the outside, which the brain then has to construct a world. In this respect,
    humans do not see images of the world; rather, the interpretive power of the brain
    shuttles between world and perception. For Helmholtz, vision is the result of
    prior cognitive experiences, unconscious inferences that rely on previous cultural
    experiences of and assumptions about the world (for example, that objects are
    not normally viewed from below, or light comes from above). In addition, human
    sight depends on technological inventions (eyeglasses, microscopes) and environments
    (light conditions, indoors, outdoors). But for algorithms, seeing seems to be
    different.


    It is true that algorithms only match images against preexisting databases, and
    this can be used as an argument against the idea that algorithms see. But they
    are intriguingly good at it; DeepFace’s neural networks “recall” the faces of
    a billion people, a feat beyond human capability. Although this is a statistical
    mode of seeing, it is a form of perception that cannot be reduced to the merely
    quantitative. Like human sight, these masses of images generate worlds and create
    new knowledge; the algorithms can train themselves. Humans too have to learn how
    to identify a cat: the human brain needs to be shown a cat (or an image and concept
    of a cat) before the human can identify it. Unless you are a Platonist, or a rigid
    follower of Noam Chomsky, you must acknowledge that the human brain, like a computer,
    must be fed with data to start the cognitive process of learning and identifying
    objects.'
