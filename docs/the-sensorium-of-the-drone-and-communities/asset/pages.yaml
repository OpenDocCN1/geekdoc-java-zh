    # Raphaela Vogel: Dancing with the Drone


    In her expansive installations, Vogel explores the relationship between the body
    and digital technology.39 For my purpose in this chapter, the most important of
    these artworks are her performances and films, in which the main actors are drones
    and Vogel herself. Her installation Prophecy (2016) shows her eyes outdoors, in
    a blue sky, controlling civilian drones with a remote. Dressed in a swimsuit,
    she dances and moves in front of the drone cameras. Long white veils cover her
    body and move in the wind, which is partly created by the drones'' propellers.
    The performance is accompanied by the heavy metal band Soulfy. This installation
    can take up an entire gallery room, encircling the visitor with two screens that
    show the drones flying in front of the artist and a white-sheet backdrop.


    Prophecy integrates movement (the artist dancing, the visitor walking around the
    installation), sound (the loud music, which vibrates in your ears and body), touch
    (the wind shown in the film), potentially smell (a portable toilet is positioned
    in-between the two video projection screens), and vision (the drone film). The
    drones do not film from a scopic, omniscient aerial perspective. Rather, they
    film from the front, and the cameras are turned slightly upward, into the air.
