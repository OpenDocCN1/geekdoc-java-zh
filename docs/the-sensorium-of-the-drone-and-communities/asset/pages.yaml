  md: 'The Gaga drone leads right into this chapter’s key questions. In what ways
    does the body play a role in the drone sensorium? How can we understand the drone
    as a technology of nonscopic embodied sensing and telepresence? How do hobby dronists
    and artists negotiate this embodied sensorium of the drone? What communities do
    these technobodies of the drone environment? Can they shed light on alternative
    symbiotic human–machine communities? Or do they naturalize their capitalist legacies,
    namely the surveillance power of tech companies and the military industry? In
    order to find answers to these questions, I first explain the idea of embodied
    sensing and its telepresence effects in a media-historical context. By focusing
    on the nineteenth-century panorama and telescope, I establish the drone as a member
    of the telepresence media family. I then proceed to discuss dronies, drone racing,
    and the work of contemporary drone artists. I show that the drone as an embodied
    sensorium can evoke effects of telepresence, and in doing so can create new imaginaries
    of machine–human communities.


    # Embodied Sensing and the Effects of Telepresence: A Short Media History


    Embodied sensing suggests a way of experiencing and perceiving the world as a
    process that embraces the whole body as an organism. It refers to the idea that
    beides the visual dimension, there are somatic, haptic, and sensor-motoric experiences
    that shape the human process of perception. In addition, the mode of embodied
    sensing rests on the idea of a body schema. This refers to how the body’s position
    emits prescriptive sensory impulses that then inform further cognitive processes.
    Technology plays an important role in relation to embodied sensing: technological
    media can channel, facilitate, enhance, and substitute embodied sensing as they
    directly interact with our bodily positions, surfaces, and movements. Embodied
    sensing connects with Ihde’s postphenomenological observations of how technology
    mediates, constitutes, and shapes human–world relations. Technology is a medium
    that can embrace the materiality, situatedness, and relationality of experiences.
    In this respect, drone technology acts as a sensorium that is not detached from
    the outer or inner body, but rather is entangled and enmeshed with them. It matters
    not only how the drone as an object is held, touched, and steered, but also how
    it can merge with the viewpoint and activities of the pilot. The first-person
