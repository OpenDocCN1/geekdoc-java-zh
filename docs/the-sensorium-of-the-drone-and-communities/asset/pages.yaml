    # The Scopic Regime


    In the field of visual studies, the term scopic regime³ expresses the idea that
    not only what we see but also how we see is historically rooted and conditioned
    by different times and places. The scopic regime is a mode of visual apprehension
    that is culturally constructed and prescriptive; it is historically variable and
    can exist within a single culture and social formation.⁴ The notion of the scopic
    regime often plays a role in analyses of discourses of sovereign power, particularly
    in the context of warfare.⁵ Etymologically, the Greek word skopos implies a direct
    connection between watching and waging war, as it can refer to both watcher and
    target.⁶ The term scopic becomes synonymous with the martial gaze. Following Paul
    Virilio, we know that military power is more than just munitions, troops, and
    weapons.⁷ War technology is also about vision: cameras employed during warfare,
    images mediated from the battlefield, perceptions of war by soldiers, victims,
    and the public. The aerial view often embodies the imperial forms of territorial
    and military power.⁸ The concept of a universal, all-seeing perspective has been
    thoroughly incorporated into colonial, state, and military modes of organization,
    management, and planning.⁹ Scholars of military drones frequently use the term
    scopic regime to characterize the way combat drones perceive their targets.¹⁰
    According to Derek Gregory, drone vision embodies a “militarized regime of hypervisibility”¹¹
