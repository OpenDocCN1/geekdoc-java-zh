    76. Rancière’s ideas about the sensible and aesthetics can be compared to Kant’s
    notion of the sensible community as a faculty of aesthetic judgment. According
    to Kant, aesthetic judgments are manifested by the sharing of a common taste,
    opinion, or beautiful experience, and art can evoke and harbor this sens communis.
    In contrast to Kant, however does not look for consensus; rather, experience in
    common opens a trajectory for the common ideal of the sensible. See John D. Schaefer,
    Sensus Communis: Vico, Rhetoric, and the Limits of Relativism (Durham, NC: Duke
