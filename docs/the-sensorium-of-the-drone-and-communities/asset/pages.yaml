  md: '# Introduction


    5000 Feet Is the Best (2011), which deals with the traumatic experiences of drone
    pilots, has garnered much attention.


    But instead of art about the military drone, I explore art with and about domestic
    consumer drones. Literary works, visual installations, films, artistic products
    from the drone scene, and artworks by political activists can all serve as a repository
    of examples that demonstrate the multisensoryality of drone and shed light on
    its community-shaping powers. For example, there have been literary novels about
    civilian drones, such as Tom Hillenbrand''s sci-fi Drone State (Dronhenland, 2015),
    which drones function as telepresence devices and provide embodied forms of communication.
    There is the drone surveillance installation Hansel and Gretel by Jacques Herzog,
    Pierre de Meuron, and Ai Weiwei, at the Armory in New York City in 2017, in which
    a drone created and observed its viewers. There have also been drone ballets,
    as Networks of Tomorrow (2021), and drone operas, such as Matthew Sleeth''s A
    Drone Opera (2019). When I concentrate on contemporary art on and with drones,
    I also look back into history. An excursion into nineteenth-century hot-air balloons
    and their scholarly poetic descriptions shows that they can be seen as early drones.
    A discussion of Ernst Jünger''s novel The Glass Bees (Die gläsernen Bienen) provides
    me with another trajectory to historize drones. This historicization is necessary
    if we are to rethink and intervene in narratives that celebrate drone technology
    as a game-changing, state-of-the-art technology.


    Although I frequently refer to drone art throughout this book, I am hesitant to
    establish it as an aesthetic genre; I use the expression more as a working term.
    The artworks and artists who engage with drones in aesthetic contexts constitute
    a heterogeneous group that includes political activists, established photographers,
    amateurs, pop-culture artists, literary authors, and avant-garde filmmakers. Even
    in the context of military drones, which have been researched more systematically,
    it is difficult to speak of drone art as a genre, as artists also come from diverse
    backgrounds, work with different media, and relate different narratives about
    the drone. In the field of civilian drones, the art scene is even more dispersed,
    these artists are often close to hobbyist and do-it-yourself drone communities.
    Indeed, this amateurship is a decisive factor, and I discuss a variety of drone
    artworks that have emerged from the hobby drone scene (such as dronies and drone
    films about the pandemic posted on YouTube). The drone as an aesthetic medium
    is fairly accessible to amateurs—commercial'
