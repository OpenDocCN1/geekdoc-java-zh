    Thacker describe the swarm as the network that has no single, centralized principle
    of power but is defined by a paradoxical simultaneity of control and emergence.¹10
    A swarm does not relativize power; it presents a contradictory toughness of formlessness
    and strategy, amorphousness and coordination, decentralization and centralization.
    The swarm presents an epistemological paradox: “Humans thrive on network interaction
    (kin groups, clans, the social), yet the moments when the network logic takes
    over—in the mob or the swarm, in contagion or infection—are the moments that are
    most disorienting, and most threatening to the human ego.¹11 Swarms entail a nonhuman
    form of intelligence that could be understood not as a single “mastermind,” but
    as a “hive mind,” a form of collective thinking that is also a particular way
    of sensing synesthetically, combining visual, haptic, olfactory, kinetic, and
    acoustic sensors, and sharing sensory impulses simultaneously and collectively.
    Sensing is not bound to the individual but is continuously interconnected, shared,
    and networked within the swarm. These sensing processes are not bundled and steered
    by a central sensorium; rather, the sensory impulses organize themselves through
    an emergent collective dynamic.


