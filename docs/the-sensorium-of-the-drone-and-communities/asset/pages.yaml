  md: '# Introduction


    deeply intertwined. In comparison with military drones, civilian drones are still
    underresearched, particularly in the fields of humanities, media studies, and
    aesthetics.11 Cultural approaches to civilian drones often highlight their close
    relationship with the military, considering domestic drones in light of a “boomerang
    effect”12 from military drones. Domestic drones thus supposedly exemplify media
    theorist Friedrich Kittler''s contention that the entertainment industry''s media
    products inherently belonging to the military-industrial complex.13 I acknowledge
    these connections, but I try to work beyond looking at the drone not only as harmful
    but also as playful. Civilian drones are not just the militarization of the everyday;
    they have their own creative power. One goal of this book is to (partially) free
    the drone from its military stigma, and to detect its creative, life-affirming
    potential without fetishizing it or forgetting its military baggage. Recent scholars
    have discussed civilian drones beyond the military genealogical fallacy, and this
    book is greatly inspired by their work.14 This does not mean I am dismissive of
    the military origins of drone technology but rather that I am attempting to interpret
    drone sensing and its shaping of communities without exclusively highlighting
    its military side. One can always trace military contexts and practices when one
    is dealing with drones. For me, it is a matter of observation: this book attempts
    to highlight the creative, constructive, and affirmative aspects of the drone,
    although I always keep the drone’s potentially violent practices in mind. The
    goal is to read drone technology in the creation of a unique sensor of which the
    visual is only a part, and to consider drones’ capacity to establish communities
    that interrupt and contradict the power relations of drone violence.15


    My book stretches the idea of what a drone is. Technically, a drone is defined
    as a flying object—an unmanned aerial vehicle that moves by remote control—or
    alternatively, as an unmanned or underwater vehicle, which drones can crawl, swim,
    and dive. For for me as a scholar of visual culture, art, and literature, a drone
    is not just a technical apparatus or instrument, it is about discourse. Drones
    do not operate somewhere “out there,” independently of us; they are our sensors,
    deeply immersed with cultural and political contexts. As sociocultural assemblages,
    they are attached to our activities, to their surrounding materialities, and to
    their embodiments. Ole Jensen has suggested that drones can act as “epistemological
    engines” that provide knowledge about our world.16'
