  md: '# 200 Conclusion


    Technik).¹³ Kapp claims that all technical artifacts are extensions of human organs
    (hammer as fist, binocular as eye). This relationship between a technical object
    and an organ speaks to an anthropological conception of technology: technology
    develops in sync with the human and its anthropomorphic body. But instead of reading
    this organ theory as a narrative of human mastery over technology, I consider
    Benjamin''s and Kapp''s organ metaphor as an invitation to understand technology
    as a type of organism, a vital cybernetic system that regulates itself and is
    closely entwined with human and nonhuman environments. This perspective on technology
    also recalls Yuk Hui''s ecology of machines, which diminishes the ontological
    distance between the environment of technological objects and the subject.¹⁴ In
    this book, I have also considered drone technology as an assemblage, seeing the
    human and the technological as milieux that are no longer divided by ontological
    difference but closely intertwined.¹⁵


    But to see the drone as an organ and excavate its potential furthering is to play
    with fire, even when one remains within the realms of aesthetics, the imaginary,
    and speculative fantasy. Drones come from a violent family, and many of the scenarios
    one imagine with them are bleak. That is also why this book has devoted many passages
    to the drones'' dark side. Although the violent (and dystopian) drone imaginaries
    that I have discussed in relation to facial recognition and embodied sensing do
    not adhere to the sophistic regime, they can still execute violence, precisely
    because of their decentralized and networked configuration. In these imaginaries,
    the drone loses its alternative power of figuring and instead shapes dystopic
    and dehumanized imaginaries of communities.


    The realm of aesthetics is a privileged one in which to confront the paradoxalities
    of the drone and the duality of its vital/dead imaginaries of technensual communities.
    Art does not care about contradictions. We should bear that in mind when we interpret
    and discuss drones. As Melvin Kranberg notes, “Technology is neither good nor
    bad; nor is it neutral.¹⁶ My readings of drone artworks do not engage in a normative
    discourse about what we ought to do. Rather, the aesthetic imaginaries of the
    drone function as prisms through which we can learn about technology and its discursive
    powers. They should inspire us to rethink drones, to see them critically as well
    as to find their constructive potentials. We do not always have to resolve the
    contradictions of technology and categorize it as good'
