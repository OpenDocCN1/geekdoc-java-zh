  md: '# 6


    # Introduction


    emit a sense of ease. Indeed, domestic drones often emanate an aura of the uncanny,
    creepy, or threatening. But this drone artists'' negotiations with the drone sensorium
    all much more interesting. Drone artists rarely stop at the affective level when
    dealing with the drone sensorium; many of them do more than just present the drone
    as a medium with "fun" sensorial possibilities. Rather, they engage with the discursivities
    of sensing. Drone artists often perform negotiations with, observations of, and
    interventions in this technology, particularly the second dimension of aesthetics
    as a critical discourse.


    Aesthetics epitomizes autonomous representation. It does not have to fulfill any
    sense-making rules. It is precisely this freedom to observe the world beyond instrumental
    codes that can render aesthetics a powerful discourse of critique. As modern theories
    of aesthetics often emphasize, art can (but does not have to) be a medium through
    which to voice. From the German Romantics to the Frankfurt School to systems theory,
    aesthetics offers the conditions in which to observe the world differently, that
    is, noninstrumentally, affectively, and nondiscively. This power of aesthetics
    is crucial for my interpretation of drone art. Aesthetic negotiations reflect
    the vulnerability, uncertainty, and fragility of drone technology and obfuscate
    techno-optimistic narratives about the drone''s precision.26 In drone artists''
    work, drone sensoria can evoke dissensus: they can be negotiated, criticized,
    ironized, queered, celebrated, and many strange.27 Of course, we have to be aware
    that this view of aesthetics—as critical—also undermines (at least momentarily)
    its autonomy, so it must attain a heteronomous determination in order to create
    dissensus.


    This book discusses drone artworks in very different aesthetic genres, including
    literature, film, photography, and visual art installations and performances.
    In science fiction novels, literary diaries, dramas, and contemporary prose, for
    example, drones can act as protagonists, violent machines, or technical gadgets.
    Often these works highlight drones'' military connections. Atef Abu Saif''s The
    Drone Eats with Me: Diaries from a City Fire (2015) narrates the experience of
    the everyday threat of drone bombardment; the one-woman drama Grounded (2013),
    by the British playwright George Brant, consists of a monologue by a former F-16
    fighter pilot who became a military drone sensor operator.28 In popular culture,
    the military drone has played starring roles, res such as in Gavin Hood''s movie
    Eye in the Sky (2015). In the realm of experimental visual art, Omer Fast''s


