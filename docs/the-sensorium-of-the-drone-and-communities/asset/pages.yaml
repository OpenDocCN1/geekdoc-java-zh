    # Chapter 6


    +   1. Drones raise a debate about autonomy, as Lucy Suchman and Jutta Weber’s
    research exemplifies. Writing about military drones, Suchman and Weber differentiate
    between two traditions of autonomy. On the one hand, autonomy is an Enlightenment
    concept that has its beginnings in Immanuel Kant’s moral philosophy: autonomy
    is an individual’s capacity for self-determination or self-governance. On the
    other hand, this liberal model of autonomy is challenged by twentieth-century
    systems theory and cybernetics, which understands humans and nonhumans like autopoietic,
    self-regulating systems. If applied to drones, this technocentric vision of autonomy
    takes the human somewhat out of the loop, and Suchman and Weber argue that in
    doing so strips us of ethical responsibility. In drones in particular, it takes
    away our ability to intercept, modify, and steer machine operations. Suchman and
    Jutta Weber, “Human-Machine Autonomies,” in *Autonomous Weapon Systems: Law, Ethics,
    Policy*, by Bhuta Nehal et al. (New York: Cambridge University Press, 2016), 75–102.
    Also James Jones, “Artificial Intelligence, Drone Swarming and Escalation Risks
    in Future Warfare,” *RUSI Journal* 16, no. 2 (2020): 26–36.


