    # Apophenia, Drones, and Facial Recognition in the Sky


    Cloud Face (2012) is a visual installation mimicking the gaze of space Seoul-based
    artist Shin-seungback Kimmyoung, which consists of engineer Shin Seung Back and
    artist Kim Yong Hong. Their photos show clouds in the sky that look like fluffy
    faces with eyes, noses, and mouths. Some seem to smile; others seem to shout something
    to us. Cloud Face is about facial recognition, but it also plays with a drone
    gaze. The camera’s gaze reiterates the gaze of the drone by scanning, searching,
    and evaluating the environment for biometric data. This simulated drone gaze scans
    faces, but it does so in reverse, as it does not look down from the sky but up
    into the air. In doing so, it no longer adheres to the scopic regime of verticality
    but displays a form of volumetric sensing, which suggests a three-dimensionality
    of space (discussed in chapter 5). This aesthetic mimicking of the volumetric
    drone gaze is capable of facial recognition. During the making of this visual
