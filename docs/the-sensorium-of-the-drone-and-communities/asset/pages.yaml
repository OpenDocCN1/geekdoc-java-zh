    aesthetic approach to the analysis of civilian drones, the book understands the
    sensorium of the drone as a complex, multimedia, synesthetic sensing assemblage,
    in which the human agent is enmeshed with the technical apparatus.³ Drone sensia
    sense in many more ways than the notion of the scopic regime suggests. Drone sensing
    can be embodied, dataified, flattened, volumetric, or swarmlike, and these different
    modes of sensing often connect to other more-than-optical sensual registers, such
    as sound, touch, smell, temperature, and movement. This sensorium disrupts the
    idea of the strawlike, surgical viral regime of the drone as an instrument of
    precision and pointed invasion.⁴


    I am specially interested in how artists experiment with these drone sensoria
    in their artworks. Many contemporary artists use the civilian drone and its sensorial
    potentials as an aesthetic and creative medium. There are literary novels that
    engage with the sensorium of the drone swarm, and there is visual art that operates
    with forms of embodied drone sensing. But it is important to note that these aesthetic
    drone sensoria also go beyond the'
