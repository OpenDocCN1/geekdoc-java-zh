  md: '# Afterword


    My general undertaking to engage with the drone must also be seen within a larger
    framework: my efforts to show that the humanities are an important player in the
    field of technology studies. The humanities have a long tradition of researching
    technology. There is research on show aesthetic representations of technology
    in visual arts and literature, as well as whole fields, as the history of technology,
    the philosophy of technology, cultural studies, media studies, design, and the
    digital humanities. This list is by no means exhaustive, and in this afterword
    I am not able to map out these different traditions. But there is perhaps one
    common denominator that connects some of the different humanities approaches to
    technology: the idea of techné.


    Techné contains the Greek linguistic root tek, which can mean to build, carpentry,
    making something from wood, or construct. In Homer’s Iliad, techné is connected
    to the skill of ship construction, to Hector’s craft and dexterity with an ax
    in the notion of building a boat. The Greek Sophists also have an interest in
    the notion of techné, which is understood very much in light of the technification
    of daily life, and occupies a place in rhetoric, art, politics, medicine, music,
    and military strategy. Aristotle defines technique as the craft to create and
    generate something that did not exist. Thus technique is different than nature
    (physis), which according to Aristotle movement in itself and is self-acting.
    In contrast, techné is the product of the human, the engineer or the artist; it
    is the product of the human capacity to bring something forth into the world.


    Martin Heidegger takes up the notion of techné in his 1954 essay “The Question
    Concerning Technology” (“Die Frage nach der Technik”). He states that “the essence
    of technology is by no means anything technological.¹¹ Similarly to Aristotle,
    Heidegger understands techné as a human activity to bring something forth into
    the world. Indeed, Heidegger closely interrelates'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'The field of art with technology because both entail the human capacity to
    create something imaginary. Heidegger says, “Techné belongs to bringing-forth,
    to poesis, it is something poetic.”² Like poetry, techné creates possible worlds
    and potential actualities. Techné is a language with which we can understand,
    project, and shape the world hermeneutically.


    For Heidegger, technology as techné is not about an apparatus with which we fix
    problems. Technology is not an instrument. For Heidegger, homo fab—the making
    human as the progress-oriented, rational, and calculating engineer—is blind. Max
    Frisch''s 1957 novel Homo Faber, a work so surely influenced by Heidegger''s musings
    on technology, shows the lapse of Walter Faber''s. Not only by chance Faber''s
    airplane have to make an emergency landing but also—by chance and unknowingly—falls
    in love with his own daughter, Sabeth. Faber eventually meets Hannah, his estranged
    former lover and the mother of his daughter. During all this, he learns about
    his own blindness to the world, which is rooted in his rational and instrumental
    conception of technology.


    Heidegger likewise does not see technology as a tool with to master the world.
    Rather, his idea of techné makes technology into a philosophical poetic activity
    that gives us access to the truth of being. Via techné, Heidegger aims to open
    a way to engage with his ontology of being and his critique of metaphysics. This
    is very much the point at which I separate from Heidegger, who essentializes techn
    as a vehicle for his conception of truth. In doing so hematically romanticizes
    preindustrial technology, fostering a nostalgic critique of civilization.


    Nevertheless, I believe that Heidegger''s ideas about techné are productive for
    us to think about why technology is a humanities subject. Heidegger''s philosophy
    demonstrates that technology, like art, has the capacity to project fictional
    worlds. The computer program of an engineer, like the pen or brush of an artist,
    can project “as-if-like” worlds. The humanities, with their analytical skills,
    can observe these technological imaginaries, interpret them, frame them, and translate
    them. We humans have the power of the imagination to discuss technology under
    the auspices of counterfactuality: What could and should technology be? And we
    have the ability to detect narratives about technology: Are we engaged in a technological
    love story, or a tragedy? Take the Greek Prometheus example, whose narrative seems
    to be a technological romance.'
