    # The Volumetric Sensing of the Drone in Landscape Design


    Drones have become a key tool in landscape architecture, a field that has always
    had an interest in new technologies to enable mapping, surveying, and spatial
    data gathering.¹40 One tradition in landscape architecture and its technologies
    of measuring can be characterized as “grounded”: the surveyor on the ground with
    a technical measuring apparatus, such as a theolite, an optical instrument developed
    during the eighteenth century to measure angles on horizontal and vertical planes.
    In the theolite tradition of landscape measuring, the surveyor conducts according
    to specific geometric features. Another approach is aerial landscape measuring,
    surveying the land from the sky, which began when surveyors observed the land
    from hilltops, church towers, balloons, and, eventually, airplanes. The aerial
    measurement technique provided views of the earth from above, suggesting its continuity,
    interconnectedness, and wholeness.¹41 The advent of satellite images of the earth
    in the late 1950s marked the apex of landscape surveying. Sputnik 1 in 1957, and
    the images of the earth as a blue marble taken from Apollo 17 in 1972, were the
    beginnings of satellite imaging, which fundamentally changed our cultural assumptions
    about virtual and physical space and our modes of representing space.¹42 Satellite
    images show the earth’s landscape as urbanized, and digital mapping gives multilayered
    information about topography, energy levels, population densities, and meteorology.¹43
    In addition, satellite images have triggered a democratization of aerial views.
