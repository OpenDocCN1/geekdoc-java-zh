    # Embodied Sensing and Telepresence in Contemporary Drone Art


    Artists have been fascinated by technologies of telepresence for a long time—indeed,
    if we include the robots and seeing machines found in literature, film, and visual
    art, for centuries. During the 1990s, however, shortly'
