    In broad strokes, sensing embodies neurophysiological processes based on stimuli,
    such as visual, acoustic, kinetic or olfactory signals that affect the subject.
    In addition to these external stimuli, the sensing process has a precursive layer
    that scientists call simulation.42 In a nutshell, this involves the activation
    of an inner, prerelective body schema (which is different from the conscious body
    image) as a prerequisite for perception. Sensing is not only about registering
    external reality but about resonating within one’s inner body schema on a neural
    level. This phenomenon of the body schema leads to interesting questions concerning
    manic sensing, as I show in chapter 2 (on drones and embedded sensing) and chapter
    7 (on drones and empathic sensing during the COVID-19 pandemic). Moreover, sensing
    is always defined by historical contexts and technological developments. As Walter
