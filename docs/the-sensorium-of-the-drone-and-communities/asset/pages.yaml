    One of my key interests in this chapter is to establish what role the drone''s
    volumetric sensorium can play in this, and in what way it can shape imaginaries
    of communities on with the earth. To put it more simply, I want to find out what
    we can learn from the drone about the earth. The drone can observe, register,
    and archive the destructive force of humans'' impact on the earth. By this the
    drone can “soften” the dichotomy between nature and civilization and demonstrate
    our close entanglements with the environment. Together with artistic, scholarly,
    and public discourses, the drone can critically reflect on environmental damage
    and our exploitation of the earth, and can make us think about the dichotomy between
    nature and civilization, which Morton sees as symptomatic of the hierarchical
    power relations of the Anthropocene. Thus the drone constitutes a critical seismograph
    of the Anthropocene and a medium that articulates postnatural (utopian) visions
    of communities. But again, we must be aware of the drone technology also exploits
