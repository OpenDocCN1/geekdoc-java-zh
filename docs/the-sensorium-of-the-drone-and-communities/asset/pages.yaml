    # Planetary Communities


    The works analyzed in this chapter, which all engage with the amateur drone as
    an artistic medium, shed light on flattening as a way in which drones sense the
    world. Drone flattening has mostly been discussed to date in military contexts,
    where it is seen as a feature of the operative images that facilitate chain operations
    in drone strikes. But in this chapter I have shown that this is not the whole
    story. The artistic experiments by Houtry, Postcommodity, and Acosta have disclosed
    another dimension of flattening, one that articulates a state of interconnectedness
    with the earth. My historicization of the drone in relation to the aerial balloon
    has helped me to unearth this other dimension of the aerial perspective.'
