    # Chapter 2


    The basic aim of the panorama was to reproduce the real world so skillfully that
    spectators could believe what they were seeing was.^{14


    My second example of a nineteenth-century pleasure technology to which the drone
    is remotely related is the teleidoscope. Unlike the panorama, the teleidoscope
    was never realized; it remained a technological fantasy. George Maurier conjured
    it in Punch magazine in 1878 as part of a cartoon about fictional inventions that
    made fun of the famous inventor Thomas Edison. Du Maurier’s teleidoscope resembled
    a very bulky video-phone-television. The cartoon shows a British couple talking
    to their daughter through an electric camera obscured above the fireplace. We
    can see the pipe-shaped “receivers” that connect them audovisually; the darkened
    room suggests an immersive, cinematic perspective. As in the panorama, the couple
    themselves are part of the illusory space. The text beneath image reads as:


    Paterfamilias (in Wilton Place): “Beatrice, come closer, I want to whisper.

    Beatrice (from Ceylon): “Yes, Papa dear."


    Paterfamilias: “Who is charming young lady playing on Charlie’s side?”nBeatrice:
    “She’s just come over from England, Papa. I’ll introduce you to her as soon as
    the game’s over"


    Like today’s Zoom calls, the teleidoscope takes its participants to other spaces
    and time zones. In doing so, it displays a fantasy of telepresence: its users
    are present in another reality, leaving their bodies behind and immersed in the
    scene before their fireplace.


    The drone belongs in this media archaeology of telepresence technology because
    drones can project humans into other places and simulate their presence in spaces
    other than their true location. In a military context, a drone pilot can sit in
    a container in Nevada and execute kill actions in Afghanistan. The civilian drones
    that I discuss in this chapter can also act as “presence machines,” to use Maximilian
    Jablonski’s term, in the sense that they suggest the sensuous, affective presence
    of a remote agent via embodied sensing.^{15} I will show that this is particularly
    evident with drones and drone races, where drones stimulate an externalization
    of the body into a different time and space. But in experimental artworks too,
    the drone can evoke telepresence effects.'
