  md: 'In his analysis of planetary art, Terry Smith defines “world scale regimes
    of seeing” as one aesthetic configuration of the planetary.42 These regimes of
    seeing are particularly enabled by “new technologies of vision and visualization”43
    such as drones, social media, and digital imaging. World-scale regimes are not
    confined within national or multinational frames; they encompass the whole world
    and planet. This approach also relates to Paglen’s statement that drones create
    their “relative geometries, folding several noncontiguous spaces around the globe
    into a single, battlefield.”44 It is interesting that this “relative geography”
    can be understood beyond the military context, as a single, distributed, planetary
    perspective. In other words, we are dealing here with similar visual features
    and visualized registers, utilized in another field.


    My readings of the artworks will show that the drone can invoke visions of community
    based on this planetary perspective. These communities are not focused on specific
    territories, or on global and local perspectives, the planetary configuration
    of seeing embraces all: the universe, the planet, the flora and fauna of the world.
    This planetary vision of community is at, as I will see, in individual aesthetic
    imaginaries that engage with aerial perceptions of the earth, as well as the drone’s
    function as a tool of protest in contexts of political activism and intervention.


    However, these planetary communities should not be seen as efforts to homogenize
    all of life into one-world totality (in this sense I would say they differ from
    Gaia). Rather, the planetary must be understood as shifting, paradoxical, incomplete,
    constantly to reconfiguration, and prone to integrate concepts of alterity.45
    It is important to keep the shifting nature of the planetary in mind as part of
    my readings of individual artworks. Although these aesthetic imaginaries evoke
    utopian perspectives on planetary communities, they also reflect the precariousness
    of such visions. And it is precisely the surveillance technology that can undermine
    and subvert those visions. These artworks evoke self-reflexivity about the military
    affiliations of the amateur drone and make it into a medium of political critique.46
    In other words, these examples of drone art make a multiperspectral mode of interpretation
    where meaning oscillates with becoming fixed. In drone artworks, the planetary
    dimension can emerge, but, as I will now show, it is also bound to a dialectic
    of appearance and disappearance.'
