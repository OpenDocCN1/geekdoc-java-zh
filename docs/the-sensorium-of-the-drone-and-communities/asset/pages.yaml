  md: '# Aisthiesis, Art as Sensorium, and Aesthetics as Critical Discourse


    To understand these worldmaking powers of the civilian drone, this book takes
    an aesthetic approach to technology, working with two intersecting understandings
    of aesthetics, namely, aisthēsis and aesthetics as a critical discourse. Following
    the original meaning of the Greek word, aisthēsis refers to aesthetics as a way
    of experiencing, as Alexander Gottlieb von Baumgarten proposed in Aesthetica.$^{17}$
    For Baumgarten, the sensuous and aesthetic realm constitutes a form of knowledge
    that has an epistemological power of its own, one that is based on sensing and
    experiencing art. Notably, Baumgarten suggests that one can train a form of knowledge
    via technology.$^{18}$ His idea of aesthetic training involves affective experiences
    with the “weapons of the senses.”$^{19}$ These are instruments of visual, thermal,
    and sonic sensing, such as “magnifying glasses, binoculars, artificial ears, barometer,
    thermometer.”$^{20}$ For Baumgarten, aisthēsis entails a form of sensory perception
    that can be drilled, enhanced, and fostered by technology. This conception of
    aisthēsis, which grasps the experientiality of technology, is vital for my work
    I explore the sensual and affective dimension of the drone and the material-bodily
    entanglements between the drone and its agent. My focus on aisthē implies an unearthing
    of the ways in which drones sense—for example, what sensory signals, images, and
    data they produce, and what sensory affordances drones can trigger in the human
    agent. But this does not only describe the technosensuality of a technological
    object. Drone artists also experiment with the aisthē of the drone by turning
    their artworks into sensoria, making drone-aisthiesis a quintessential aspect
    of their art.


    Digital artists have had an interest in the topic of machinic aisthēsis for some
    time. During the 1980s and 1990s, many began to explore the relationship between
    bodily experiences and electronics,$^{21}$ and “new forms of subjectivity were
    theorized, from cyborgs to digital flâneurs to networked hivemind.”$^{22}$ Often
    these artistic sensoria were synthetic, speaking to visual, auditory, olfactory,
    embodied, and tactile sensors.$^{23}$ Today, many artists are engaging with technological
    sensoria by critically intervening in the “techno comfortzone,”$^{24}$ investigating
    the commoditization of technosensuality as a part of our everyday lives (for example,
    the iPhone, bicomputing, and touch screens).$^{25}$ Civilian drones do not really
    form a part of this technological comfort zone: they do not'
