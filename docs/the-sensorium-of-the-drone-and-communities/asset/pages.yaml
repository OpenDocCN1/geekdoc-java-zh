    # Insects and Communities


    Biologists'' observations of swarm formations are often mediated in sociopolitical
    discourses. For example, entomologist Karl von Frisch’s An Account of the Life
    of the Honey Bee (Aus dem Leben der Bienen, 1927) analyzed bees'' social interactions,
    such as the famous “waggle dance,” which is used to convey information about distant
    food sources: “Bees, similar to other social insects such as ants, were hardworking,
    well-organized, and effective. It was as if everything was in tune in this collective
    of individual insects, which showed highly concentrated social behavior.^25 According
    to media archaeologist Jussi Parikka, bees'' behavior has offered a social and
    political trajectory to generate models of human communities. Even in classical
    political theory, bees were often contrasted against Western political and cultural
    models: “Aristotle’s political animal is contrasted to insects; Hobbes saw the
    insects as incapable of sovereignty; Marx for his explained that the human is
    superior in its capacity to extrapolate, abstract and idealize in his activity.^26
    In another famous example, Bernard Mandeville took the bee as a liberal model
    for the constitutional monarchy. His Fable of the Bee: Or, Private Vices, Public
    Benefits (1714) describes a bee community that lives in prosperity; but once the
    community decides to live by honesty and virtue, its economy collapses, showing
    that selfishness and private vice can be productive of public and economic benefit.'
