    81. Storytelling as the *Ursene* of mythmaking can also undo and interrupt myth,
    a process that turns up a constructive moment for Nancy''s ideal community. In
    storytelling''s performing setting, the listeners—or as Nancy would say, the singularities—want
    to hear about the presence of the myth, but they can only experience its absence.
    They are temporally far away from the age of myth, and they experience their own
    finitude and mortality in contrast to myths eternal nature; while listening to
    the myth, they are distanced from the story and themselves. In this fragile and
    fluid moment of worldmaking closely related to the Heideggerian view of understanding—we
    interrupt myth, but we also shape a provisional, temporary, flowlike, however
    state of being-together, which in turn renegotiates, touches, limits, and improves
    our relationships with each other.


