  md: '# Conclusion


    Mnemodrone is an art installation about a drone that stores personal memories
    and speaks with people about them. It contains the crux of what I want to say
    in this book: memory can embody a medium of እንደሚ. The word mnemonic refers to
    memory and relates to the Greek goddess Mnemosyne. Ancient Greek philosophers
    cultivated mnotechnics as a strategy to memorize speeches. The artwork Mnemodrone
    is also a prop for remembering—not speeches, but personal memories. In 2014, Mnemodrone
    sat (among other places) on the ground in a park in Brooklyn. Visitors gathered
    around it, as if a storyteller (recalling the myth of storytelling discussed with
    Jean Luc Nancy''s concept of community in chapter 1), and shared their personal
    memories with the drone. They talked about their first loves, their childhoods,
    and other personal experiences.¹ Mnemodrone embodies an archive, a database, and
    a storehouse of human experiences: it is a collective lieu de mémoire, that is
    subjective and affective form of memory based in a spatial setting²


    But Mnemodrone is not just an apparatus that stores, conserves, and seals the
    past in a time capsule. It also opens up a dimension of futurity. As Walter Benjamin
    suggests, a glance backward into the past can evoke a glimpse into the future.³
    Mnemodrone''s stored memories point toward future interactions, communities, and
    human-machinic attachments. Humans and machines do not work against each other;
    rather, they embrace each other. Mnemodrone engages in dialogue, interacts, retells,
    and makes new stories. It can do so because its memory data form the foundation
    of a database, which is then processed by an artificial intelligence (AI) learning
    program. The drone has learned to talk back. Through this AI'
