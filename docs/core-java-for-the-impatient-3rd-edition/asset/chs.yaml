  \n你可以通过这些方法获取映射的键、值和条目的*视图*：\n\n```\nSet<K> keySet()\n\nSet<Map.Entry<K, V>> entrySet()\n\
  \nCollection<V> values()\n```\n\n返回的集合不是映射的拷贝，但它们与映射是连接的。如果你从视图移除键或条目，该条目也会从映射中移除。\n\
  \n要遍历映射的所有键和值，可以使用 `entrySet` 方法：\n\n```java\nfor (Map.Entry<String, Integer> entry\
  \ : counts.entrySet()) {\n\n    String k = entry.getKey();\n\n    Integer oldValue\
  \ = entry.getValue();\n\n    int newValue = ...;\n\n    entry.setValue(newValue);\n\
  }\n```\n\n`Map.Entry` 实例与映射也是连接的。从前面的代码段可以看出，你可以使用 `entry` 对象更新映射中的值。相反，如果你通过其他方式（例如调用映射的\
  \ `put` 方法），条目也会更新。\n\n如果你想将条目传递给其他方法，应该通过 `Map.Entry.copyOf(entry)` 将它们从映射中分离。你也可以通过\
  \ `Map.entry(key, value)` 创建未关联的 `Map.Entry` 实例。这在你需要值对时非常方便。\n\n如果你不需要修改映射，使用 `forEach`\
  \ 方法遍历条目更简单：\n\n```java\ncounts.forEach((k, v) -> {\n\n   Process k, v\n\n});\n\
  ```\n\n### 警告\n\n如果你在用迭代器访问一个正在被修改的数据结构，它可能会失效。如果你继续使用它，无效的迭代器可能会抛出 `ConcurrentModificationException`。这是一个典型的示例：\n\
  \n```java\nvar friends = new LinkedList<String>(List.of(\"Fred\", \"Wilma\", \"\
  Barney\"));\n\nfor (String name : friends) {\n\n    if (name.length() < 5) friends.remove(name);\
  \ // Error—concurrent modification\n\n}\n```\n\n增强型 `for` 循环使用迭代器来遍历列表。当列表被修改时，迭代器\n\
  \n### 7.5\\. 其他集合\n\n在接下来的章节中，我简要讨论了一些你可能在实践中非常有用的集合类。\n\n#### 7.5.1\\. 属性\n\n\n\
  \n\n\n`Properties` 类实现了一个可以使用纯文本格式轻松保存和加载的 map。这种 map 通常用于存储程序的配置配置项。例如：\n\n```java\n\
  var settings = new Properties();\n\nsettings.put(\"width\", \"200\");\n\nsettings.put(\"\
  title\", \"Hello, World!\");\n\ntry (OutputStream out = Files.newOutputStream(path))\
  \ {\n    settings.store(out, \"Program Properties\");\n}\n```\n\n结果是下面的文件：\n\n```\n\
  #Program Properties\n\n#Mon Nov 03 20:52:33 CET 2014\n\nwidth=200\n\ntitle=Hello,\
  \ World\\!\n```\n\n### 注意事项\n\n从 Java 9 开始，属性文件使用 UTF-8 编码。（在此之前，它们使用 ASCII 编码，大于\
  \ `'\\u007e’` 的字符会被转义为 Unicode 转义字符 `\\u*nnnn`。）注释以 `#` 或 `!` 开头。键或值中的换行符写为 `\\\
  n`。字符 `\\`、`#` 和 `!` 被转义为 `\\\\`、`\\#` 和 `\\!`。\n\n要从文件加载属性，请调用\n\n```java\ntry\
  \ (InputStream in = Files.newInputStream(path)) {\n    settings.load(in);\n}\n```\n\
  \n然后使用 `getProperty` 方法获取键对应的值。你可以指定当键不存在时使用的默认值：\n\n```java\nString title = settings.getProperty(\"\
  title\", \"New Document\");\n```\n\n### 注意事项\n\n出于历史原因，尽管值始终是字符串，但 `Properties`\
  \ 类仍然实现了 `Map<Object, Object>`。因此，请勿使用 `get` 方法——它返回的是 `Object` 类型的值。\n\n`System.getProperties`\
  \ 方法产生一个包含系统属性的 `Properties` 对象。表 7.7 描述了其中最有用的属性。\n\n表 7.7：有用的系统属性\n\n![images](img/07tab07.jpg)\n\
  \n### 7.5.2. 位集 (Bit Sets)\n\n`BitSet` 类存储一个位序列。位集将位打包进 `long` 值的数组中，因此使用位集比使用 `boolean`\
  \ 数组更高效。位集用于标志位序列或表示非负整数集，其中第 `i` 位为 `1` 则表示 `i` 包含在集合中。\n\n`BitSet` 类提供了方便的方法来获取和设置单个位。这比在\
  \ `int` 或 `long` 变量中存储位所需的位运算操作要简单得多。还有一些方法对所有位进行统一操作以实现集合，例如并集和交集。完整列表请参见 表 7.8。注意，`BitSet`\
  \ 类并不是集合类——它没有实现 `Collection<Integer>`。\n\n表 7.8：`BitSet` 类的方法\n\n![images](img/07tab08.jpg)![images](img/07tab08a.jpg)\n\
  \n### 7.5.3. 枚举集和映射 (Enumeration Sets and Maps)\n\n如果你收集枚举值的集合，请使用 `EnumSet` 类而不是\
  \ `BitSet`。`EnumSet` 类没有公共构造函数。使用静态工厂方法来构建集合：\n\n```java\nenum Weekday { MONDAY,\
  \ TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY };\n\nSet<Weekday> always\
  \ = EnumSet.allOf(Weekday.class);\n\nSet<Weekday> never = EnumSet.noneOf(Weekday.class);\n\
  \nSet<Weekday> workday = EnumSet.range(Weekday.MONDAY, Weekday.FRIDAY);\n\nSet<Weekday>\
  \ mwf = EnumSet.of(Weekday.MONDAY, Weekday.WEDNESDAY, Weekday.FRIDAY);\n```\n\n\
  你可以使用 `Set` 接口的方法来操作 `EnumSet`。\n\n`EnumMap` 是一个键属于某个枚举类型的 map。它被实现为值的数组。你在构造函数中指定键的类型：\n\
  \n```java\nvar personInCharge = new EnumMap<Weekday, String>(Weekday.class);\n\n\
  personInCharge.put(Weekday.MONDAY, \"Fred\");\n```\n\n### 7.5.4. 栈、队列、双端队列和优先级队列\
  \ (Stacks, Queues, Deques, and Priority Queues)\n\n栈是一种用于在末端（栈的“顶端”）添加和移除元素的数据结构。队列允许你高效地从一端（“尾部”）添加元素并从另一端（“头部”）移除元素。双端队列（或\
  \ deque）支持在两端进行插入和移除。所有这些数据结构都不支持在中间添加元素。\n\n`Queue` 和 `Deque` 接口定义了这些数据结构的方法。Java\
  \ 集合框架中没有 `Stack` 接口，只有一个 Java 早期的遗留 `Stack` 类，你应该避免使用它。如果你需要栈、队列或双端队列且不担心线程安全，请使用\
  \ `ArrayDeque`。\n\n使用栈时使用 `push` 和 `pop` 方法。\n\n```java\nvar stack = new ArrayDeque<String>();\n\
  \nstack.push(\"Peter\");\n\nstack.push(\"Paul\");\n\nstack.push(\"Mary\");\n\nwhile\
  \ (!stack.isEmpty())\n    System.out.println(stack.pop());\n```\n\n使用队列时使用 `add`\
  \ 和 `remove` 方法。\n\n```java\nQueue<String> queue = new ArrayDeque<>();\n\nqueue.add(\"\
  Peter\");\n\nqueue.add(\"Paul\");\n\nqueue.add(\"Mary\");\n\nwhile (!queue.isEmpty())\n\
  \    System.out.println(queue.remove());\n```\n\n### 7.5.5. 弱哈希 (Weak Hash Maps)\n\
  \n`WeakHashMap` 类设计用于解决一个有趣的问题：如果一个值的键不再被使用，会发生什么？如果指向键的最后一个引用消失了，就没有方法引用该值对象，因此它应该被垃圾回收器移除。\n\
  \n情况并没有那么简单。垃圾回收器会追踪活对象。只要 map 对象是活的，它中的所有条目都是活的且不会被回收——被其引用的值也不会被回收。\n\n这就是 `WeakHashMap`\
  \ 类解决的问题。这种数据结构与垃圾回收器协作，当键的唯一引用是哈希表中的引用时，移除该键/值对。\n\n从技术上讲，`WeakHashMap` 使用*弱引用*（weak\
  \ references）来持有键。`WeakReference` 对象持有另一个对象的引用——在我们的案例中，是哈希表的键。这类对象会被垃圾回收器以特殊方式处理。如果一个对象*仅*通过弱引用可，垃圾回收器将回收该对象并将弱引用放入与\
  \ `WeakReference` 对象关联的队列中。每当调用它的方法时，`WeakHashMap` 都会检查其弱引用队列中的新到项并移除相关的条目。\n\n\
  ### 7.6. 视图 (Views)\n\n集合*视图*（view）是一个实现了集合接口的轻量级对象，但不存储元素。例如，map 的 `keySet` 和 `values`\
  \ 方法产生 map 的视图。\n\n在接下来的章节中，你将看到 Java 集合框架提供的一些视图。\n\n#### 7.6.1. 小型集合 (Small Collections)\n\
  \n`List`、`Set` 和 `Map` 接口提供了静态方法，用于产生给定元素的集合或列表，以及带有给定键/值对的 map。\n\n\n\n\n\n例如，\n\
  \n```\nList<String> names = List.of(\"Peter\", \"Paul\", \"Mary\");\n\nSet<Integer>\
  \ numbers = Set.of(2, 3, 5);\n```\n\n将产生一个包含三个元素的列表和一个集合。对于 map，按如下方式指定键和值：\n\n\
  ```\nMap<String, Integer> scores = Map.of(\"Peter\", 2, \"Paul\", 3, \"Mary\", 5);\n\
  ```\n\n元素、键或值不能为 `null`。\n\n`List` 和 `Set` 接口有 11 个 `of` 方法，分别接受从零到十个参数，以及一个接受变长参数的\
  \ `of` 方法。为了提高效率，提供了这些特化实现。\n\n对于 `Map` 接口，无法提供变长参数的版本，因为参数类型在键类型和值类型之间交替。有一个静态方法\
  \ `ofEntries`，它可以接受任意数量的 `Map.Entry<K, V>` 对象，你可以使用静态方法 `entry` 来创建这些对象。例如：\n\n\
  ```java\nimport static java.util.Map.*;\n\n...\n\nMap<String, Integer> scores =\
  \ ofEntries(\n    entry(\"Peter\", 2),\n    entry(\"Paul\", 3),\n    entry(\"Mary\"\
  , 5));\n```\n\n`of` 和 `ofEntries` 方法产生对象的类，这些类为每个元素都有一个实例变量，或者由数组支持。\n\n这些集合对象是不可修改的（`unmodifiable`）。任何更改其内容的尝试都会导致\
  \ `UnsupportedOperationException`。\n\n如果你需要一个可变的集合，可以将不可修改的集合传递给构造函数：\n\n```java\n\
  var names = new ArrayList<String>(List.of(\"Peter\", \"Paul\", \"Mary\"));\n```\n\
  \n### 注意\n\n还有一个静态的 `Arrays.asList` 方法，与 `List.of` 类似。它返回一个可变但不可调整大小的列表。也就是说，你可以对列表调用\
  \ `set`，但不能调用 `add` 或 `remove`。\n\n### 7.6.2. 范围\n\n你可以形成列表的子列表视图。例如：\n\n```java\n\
  List<String> sentence = ...;\n\nList<String> nextFive = sentence.subList(5, 10);\n\
  ```\n\n此视图访问索引从 5 到 9 的元素。子列表的任何变动（如设置、添加或删除元素）都会影响原始列表。\n\n对于排序后的集合和 map，你通过下界和上界指定范围：\n\
  \n```java\nTreeSet<String> words = ...;\n\nSortedSet<String> asOnly = words.subSet(\"\
  a\", \"b\");\n```\n\n与 `subList` 一样，第一个边界是包含的，第二个边界是排他的。\n\n`headSet` 和 `tailSet`\
  \ 方法产生一个没有下界或上界的子范围。\n\n```java\nNavigableSet<String> nAndBeyond = words.tailSet(\"\
  n\");\n```\n\n通过 `NavigableSet` 接口，你可以为每个边界选择它应该是包含的还是排他的——参见表 7.5。\n\n对于排序后的 map，有等价的方法\
  \ `subMap`、`headMap` 和 `tailMap`。\n\n### 7.6.3. 不可修改视图\n\n有时，你想共享集合的内容，但不想让它被修改。当然，你可以将值复制到新集合中，但这可能开销很大。不可修改视图是一个更好的选择。这里有一个典型场景：`Person`\
  \ 对象维护一个朋友列表。如果 `getFriends` 给出该列表的引用，调用者就可以修改它。但提供一个不可修改的列表视图是安全的：\n\n```java\n\
  public class Person {\n\n    private ArrayList<Person> friends;\n\n    public List<Person>\
  \ getFriends() {\n        return Collections.unmodifiableList(friends);\n    }\n\
  \n    ...\n}\n```\n\n所有的变器方法在不可修改视图上被调用时都会抛出异常。\n\n正如从表 7.3 中所示，你可以获取集合、列表、集合、排序集合、导航集合、map、排序\
  \ map 和导航 map 的不可修改视图。\n\n### 注意\n\n在第 6 章中，你已经看到可能将错误类型的元素引入泛型集合（这种现象被称为“堆污染”），并且在检索不适当元素时会报告运行时错误，而不是在插入时。如果你需要调试此类问题，请使用检查视图（`checked\
  \ view`）。当你构建（例如）一个 `ArrayList<String>` 时，改用：\n\n```java\nList<String> strings\n\
  \    = Collections.checkedList(new ArrayList<>(), String.class);\n```\n\n该视图监控所有向列表的插入，并在添加错误类型的对象时抛出异常。\n\
  \n### 注意\n\n`Collections` 类产生同步的（`synchronized`）视图，确保对数据结构的安全并发访问。在实践中，这些视图不如 `java.util.concurrent`\
  \ 包中显式为并发访问设计的数据结构有用。我建议你使用那些类并远离同步视图。\n\n### 练习\n\n1. 实现“埃拉托尼筛法”算法来确定所有 ≤ `n` 的质数。将从\
