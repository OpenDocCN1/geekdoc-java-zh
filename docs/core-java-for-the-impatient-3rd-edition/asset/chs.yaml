  \ 应该是静态的还是不是？\n\n\n\n\n\n## 引言\n\nJava 设计于 20 世纪 90 年，是一种面向对象的编程语言，当时面向对象编程是软件开发的主要范式。接口（Interfaces）是面向对象编程的关键特性：它们允许你指定“要做什么”，而无需提供具体的实现。\n\
  \n在面向对象编程出现很久，就已经存在函数式编程语言，例如 `Lisp`，在这些语言中，函数而不是对象主要的结构机制。最近，函数式编程的重要性日益提高，因为它非常适合并发和事件驱动（或“响应式”）编程。Java\
  \ 支持函数表达式，为面向对象编程和函数式编程之间提供了便利的桥梁。在本章中，你将学习接口和 Lambda 表达式。\n\n本章的关键点包括：\n\n1. 接口规定了实现类必须提供的一组方法。\n\
  2. 接口是任何实现类的超类型。因此，可以将类的实例赋值给接口类型的变量。\n3. 接口可以包含静态方法。接口的所有变量自动为 `public`、`static`\
  \ 且 `final`。\n4. 接口可以包含默认方法，实现类可以继承或重写这些方法。\n5. 接口可以包含私有方法，实现类无法调用或重写。\n6. `Comparable`\
  \ 和 `Comparator` 接口用于比较对象。\n7. 如果你需要测试对象是否符合某个子类型，请使用 `instanceof` 运算符，最好使用其“模式匹配”形式。\n\
  8. 函数式接口（Functional interface）是一个只有一个抽象方法的接口。\n9. Lambda 表达式表示一个可以在以后某个时刻执行的代码块。\n\
  10. Lambda 表达式会被转换为函数式接口。\n11. 方法和构造函数引用指向方法或构造函数，但不调用它们。\n12. Lambda 表达式和局部类可以访问闭包作用域中的有效最终变量（effectively\
  \ final）变量。\n\n### 3.1. 接口\n\n`interface` 是一种用于规定双方之间合同的机制：服务的提供者以及希望其对象可用于服务的类。在接下来的章节中，你将看到如何在\
  \ Java 中定义和使用接口。\n\n### 3.1.1 使用接口\n\n在前两个章节中，我使用了 `Random` 类来演示如何调用构造函数和方法。当 `Random`\
  \ 类在 Java 1.0 中被首次设计时，它反映了当时的技术水平。如今，已知有许多产生伪随机数的算法。`java.util.random` 包提供了具有各种权衡的强算法实现。根据你的需求，你可能需要在\
  \ `L64X128MixRandom`、`Xoroshiro128PlusPlus` 或另一个具有类似名称的算法之间选择。（该包的 API 文档提供了关于选择哪种算法的有用建议。）有趣的是，API\
  \ 并没有为每个算法暴露单独的类。这是一个好事。每当你从一种算法切换到另一种算法时，修改程序将很麻烦。而且这是没必要的——所有的生成器都拥有相同的方法集：`nextInt`、`nextDouble`\
