  \n你经常需要实现可以处理多种类型的类和方法。例如，`ArrayList<T>` 存储任意类 `T` 的元素。我们说 `ArrayList` 类是*泛型的*（generic），而\
  \ `T` 是一个*类型参数*。基本思想非常简单且极其有用。本章的前两节涵盖了简单部分。\n\n在任何带有泛型类型的编程语言中，当限制或更改类型参数时，细节就会变得复杂。例如，假设你想对元素进行排序。那么你必须指定\
  \ `T` 提供排序。此外，如果类型参数发生变化，这对泛型类型意味着什么？例如，`ArrayList<String>` 与一个期望 `ArrayList<Object>`\
  \ 的方法之间应该是什么关系？第 6.3 节和第 6.4 节将为你展示 Java 如何处理这些问题。\n\n在 Java 中，泛型编程比本应该复杂的复杂，因为泛型是在\
  \ Java 出现一段时间后添加的，并且它们的设计是为了向后兼容的。因此，存在许多不幸的限制，其中一些影响着每个 Java 程序员。另一些只对泛型类的实现者感兴趣。细节请见第\
  \ 6.5 节和第 6.6 节。最后一节涵盖了泛型和反射，如果你在自己的程序中未使用反射，可以安全地跳过它。\n\n本章的要点是：\n\n1. 泛型类是一个有一个或多个类型参数的类。\n\
  2. 泛型方法是一个带有类型参数的方法。\n3. 你可以要求类型参数是一个或多个类型的子类。\n4. 泛型类型是不变性的：当 `S` 是 `T` 的子类时，`G<S>`\
  \ 和 `G<T>` 之间没有关系。\n5. 通过使用通配符 `G<? extends T>` 或 `G<? super T>`，你可以指定一个方法可以接受泛型类型\
  \ `G` 的 `T` 的子类或超类的实例化。\n6. 泛型类和方法在编译时，类型参数会被擦除。\n7. 擦除对泛型类型有许多限制。特别是，你不能实例化泛型类或数组，不能强制转换为泛型类型，不能抛出泛型类型的对象。\n\
  8. `Class<T>` 类是泛型的，这很有用，因为 `cast` 等方法被声明产生类型为 `T` 的值。\n9. 尽管泛型类和方法在虚拟机中被擦除，但你可以在运行时发现它们是如何定义的。\n\
  \n### 6.1. 泛型类\n\n*泛型类*是一个有一个或多个*类型参数*的类。作为一个例子，考虑这个用于存储键/值对的类：\n\n```java\npublic\
  \ class Entry<K, V> {\n\n    private K key;\n\n    private V value;\n\n    public\
  \ Entry(K key, V value) {\n\n        this.key = key;\n\n        this.value = value;\n\
  \n    }\n\n    public K getKey() { return key; }\n\n    public V getValue() { return\
  \ value; }\n\n}\n```\n\n你可以看到，类型参数 `K` 和 `V` 被指定在类名后的尖括号内。在类成员的定义中，它们被用作实例变量、方法参数和返回值的类型。\n\
  \n你通过为类型变量替换类型来*实例化*（instantiate）泛型类。例如，`Entry<String, Integer>` 是普通的类，拥有方法 `String\
  \ getKey()` 和 `Integer getValue()`。\n\n### 注意\n\n类型参数不能用基本类型实例化。例如，在 Java 中 `Entry<String,\
  \ int>` 是无效的。\n\n当你*构造*（construct）泛型类的对象时，可以从构造函数中省略类型参数。例如：\n\n```java\nEntry<String,\
  \ Integer> entry = new Entry<>(\"Fred\", 42);\n\n// 等同于 new Entry<String, Integer>(\"\
  Fred\", 42)\n```\n\n注意，在构造参数之前你仍然提供了一对空尖括号。有些人将这对空括号称为*菱形*（diamond）。当你使用钻石语法时，类型参数会被推断。\n\
  \n### 6.2. 泛型方法\n\n就像泛型类是带有类型参数的类，*泛型方法*是带有类型参数的方法。泛型方法可以是普通类或泛型类的方法。这里有一个非泛型类的泛型方法示例：\n\
  \n```java\npublic class Arrays {\n\n    public static <T> void swap(T[] array, int\
  \ i, int j) {\n\n        T temp = array[i];\n\n        array[i] = array[j];\n\n\
  \        array[j] = temp;\n\n    }\n\n}\n```\n\n这个 `swap` 方法可以用于任意数组，只要数组元素不是基本类型。\n\
  \n```java\nString[] friends = ...;\n\nArrays.swap(friends, 1\n```\n\n在声明泛型方法时，类型参数放在修饰符（如\
  \ `public` 和 `static`）之后，返回类型之前：\n\n```java\npublic static <T> void swap(T[] array,\
  \ int i, int j)\n```\n\n在调用泛型方法时，不需要指定类型参数。它是根据方法参数和返回类型推断出来的。例如，在调用 `Arrays.swap(friends,\
  \ 0, 1)` 时，`friends` 的类型是 `String[]`，编译器可以推断出 `T` 应该是 `String`。\n\n如果你喜欢，可以在方法名之前显式提供类型，如下：\n\
  \n```java\nArrays.<String>swap(friends, 0, 1);\n```\n\n你可能想这样做的一个原因是在出现问题时获得更好的错误信息——参见练习\
  \ 5。\n\n### 6.3. 类型边界\n\n有时，泛型类或方法的类型参数需要满足某些要求。你可以指定*类型边界*（type bound），要求该类型扩展某些类或实现某些接口。\n\
  \n例如，假设你有一个实现了 `AutoCloseable` 接口的对象的 `ArrayList`，你想关闭它们所有：\n\n```java\npublic static\
  \ <T extends AutoCloseable> void closeAll(ArrayList<T> elems)\n\n        throws\
  \ Exception {\n\n    for (T elem : elems) elem.close();\n\n}\n```\n\n\n\n\n类型边界\
  \ `extends AutoCloseable` 确保了元素类型是 `AutoCloseable` 的子类型。因此，调用 `elem.close()` 是有效的。你可以向此方法传递一个\
  \ `ArrayList<PrintStream>`，但不能传递 `ArrayList<String>`。请注意，类型边界中的 `extends` 关键字实际上意味着“子类型”——Java\
  \ 的设计者只是使用了现有的 `extends` 关键字，而不是发明另一个关键字或符号。\n\n练习 14 提供了该方法的一个更有趣的变体。\n\n### 注意\n\
  \n在这个例中中，我们需要类型边界，因为参数的类型是 `ArrayList`。如果方法接受的是数组，你就不需要泛型方法。你可以直接使用普通方法：\n\n```\n\
  public static void closeAll(AutoCloseable[] elems) throws Exception\n```\n\n这之所以可行，是因为像\
  \ `PrintStream[]` 这样的数组类型是 `AutoCloseable[]` 的子类型。然而，正如你在下一节中看到的，`ArrayList<PrintStream>`\
  \ *并不是* `ArrayList<AutoCloseable>` 的子类型。使用边界类型参数可以解决这个问题。\n\n类型参数可以有多个边界，例如：\n\n\
  ```\nT extends Runnable & AutoCloseable\n```\n\n这种语法与捕获多个异常的语法相似，区别在于类型之间是用“与”（and）运算符组合的，而多个异常之间是用“或”（or）运算符组合的。\n\
  \n你可以根据需要拥有任意数量的接口边界，但边界中最多只能有一个类。如果你有一个类作为边界，它必须是边界列表中的第一个。\n\n### 6.4. 类型变体与通配符\n\
  \n假设你需要实现一个方法来处理一组是 `Employee` 类子类的对象数组。你只需声明参数类型为 `Employee[]` 即可：\n\n```\npublic\
  \ static void process(Employee[] staff) { ... }\n```\n\n如果 `Manager` 是 `Employee`\
  \ 的子类，你可以向该方法传递一个 `Manager[]` 数组，因为 `Manager[]` 是 `Employee[]` 的子类型。这种行为被称为 *协变*（covariance）。数组的变体方式与元素类型的方式相同。\n\
  \n现在，假设你想处理的是一个数组列表（array list）。但是存在一个问题：类型 `ArrayList<Manager>` *并不是* `ArrayList<Employee>`\
  \ 的子类型。\n\n这种限制是有原因的。如果允许将 `ArrayList<Manager>` 赋值给类型为 `ArrayList<Employee>` 的变量，你可能会通过存储非经理类员工来破坏数组列表：\n\
  \n```\nArrayList<Manager> bosses = new ArrayList<>();\n\nArrayList<Employee> empls\
  \ = bosses; // 不合法，但假设可以...\n\nempls.add(new Employee(...)); // 在 bosses 中加入了一个非经理员工！\n\
  ```\n\n由于不允许从 `ArrayList<Manager>` 转换为 `ArrayList<Employee>`，因此这种错误不会发生。\n\n###\
  \ 注意\n\n你是否可以在数组上生成相同的错误（即数组允许从 `Manager[]` 到 `Employee[]` 的转换）？当然可以，正如你在第 4 章 中所示。Java\
  \ 数组是协变的，这虽然方便但不安全。当你向 `Manager[]` 数组中存储一个普通的 `Employee` 时，会抛出 `ArrayStoreException`。相比之下，Java\
  \ 中所有的泛型类型都是 *不变的*（invariant）。\n\n在 Java 中，你使用 *通配符*（wildcards）来指定方法的参数和返回类型允许如何变化。这种机制有时被称为\
  \ *使用点变体*（use-site variance）。你将在后续章节中看到细节。\n\n#### 6.4.1. 子类型通配符\n\n在许多情况下，在不同的数组列表之间转换是完全安全的。假设一个方法永远不会写入数组列表，因此它不会破坏其参数。使用通配符来表达这一事实：\n\
  \n```\npublic static void printNames(ArrayList<? extends Employee> staff) {\n\n\
  \    for (int i = 0; i < staff.size(); i++) {\n\n        Employee e = staff.get(i);\n\
  \n        System.out.println(e.getName());\n\n    }\n\n}\n```\n\n通配符类型 `? extends\
  \ Employee` 表示 `Employee` 的某个未知子类型。你可以使用 `ArrayList<Employee>` 或子类类型的数组列表（例如 `ArrayList<Manager>`）来调用此方法。\n\
  \n类 `ArrayList<? extends Employee>` 的 `get` 方法返回类型为 `? extends Employee`。语句：\n\n\
  ```\nEmployee e = staff.get(i);\n```\n\n是完全合法的。无论 `?` 代表什么类型，它都是 `Employee` 的子类型，且\
  \ `staff.get(i)` 的结果可以赋值给 `Employee` 变量 `e`。（在这个例子中，我没有使用增强型 for 循环，以便准确展示元素是如何从数组列表中获取的。）\n\
  \n如果你尝试向 `ArrayList<? extends Employee>` 存储一个元素会发生什么？那行不通。考虑以下调用：\n\n```\nstaff.add(x);\n\
  ```\n\n`add` 方法的参数类型为 `? extends Employee`，并且 *没有对象* 可以传递给此方法。如果你传递了例如一个 `Manager`\
  \ 对象，编译器将拒绝。毕竟，`?` 可能指向 *任何* 子类，也许 `Janitor`（清洁工），而你不能向 `ArrayList<Janitor>` 中添加\
  \ `Manager`。\n\n### 注意\n\n当然，你可以传递 `null`，但那不是一个对象。\n\n总结，你可以从 `? extends Employee`\
  \ 转换为 `Employee`，但你永远无法将任何转换为 `? extends Employee`。这解释了为什么你可以从 `ArrayList<? extends\
  \ Employee>` 读取内容，但不能向其写入。\n\n#### 6.4.2. 上类型通配符\n\n通配符类型 `? extends Employee` 表示\
  \ `Employee` 的某个未知子类型。相反，通配符类型 `? super Employee` 表示 `Employee` 的上类型。这些通配符作为函数对象的参数时通常非常有用。这里有一个典型的例子。\n\
  \n```\npublic interface Predicate<T> {\n\n    boolean test(T arg);\n\n}\n```\n\n\
  此方法打印所有具有给定属性的员工名称：\n\n```\npublic static void printAll(Employee[] staff, Predicate<Employee>\
  \ filter) {\n\n    for (Employee e : staff)\n\n        if (filter.test(e))\n\n \
  \           System.out.println(e.getName());\n\n}\n```\n\n你可以使用类型为 `Predicate<Employee>`\
  \ 的对象调用此方法。由于这是一个函数式接口，你也可以传递 lambda 表达式：\n\n```\nprintAll(employees, e -> e.getSalary()\
  \ > 100000);\n```\n\n现在假设你想改用 `Predicate<Object>`，例如：\n\n```\nPredicate<Object>\
  \ evenLength = e -> e.toString().length() % 2 == 0;\n\nprintAll(employees, evenLength);\n\
  ```\n\n这不应该没问题。毕竟，每个 `Employee` 都是拥有 `toString` 方法的 `Object`。然而，像所有泛型类型一样，`Predicate`\
  \ 接口是不变的，`Predicate<Employee>` 和 `Predicate<Object>` 之间没有关系。\n\n解决办法是允许任何 `Predicate<?\
  \ super Employee>`：\n\n```\npublic static void printAll(Employee[] staff, Predicate<?\
  \ super Employee> filter) {\n\n    for (Employee e : staff)\n\n        if (filter.test(e))\n\
  \n            System.out.println(e.getName()); }\n```\n\n仔细观察调用 `filter.test(e)`。由于\
  \ `test` 的参数类型是 `Employee` 的上类型，因此传递 `Employee` 对象是安全的。\n\n这种情况是非常典型的。函数在它们的参数类型上是自然的\
  \ *逆变的*（contravariant）。例如，当期望一个可以处理员工的函数时，给出一个处理任意对象的函数是可以的。\n\n通常当你指定泛型函数接口作为方法参数时，你应该使用\
  \ `super` 通配符。\n\n### 注意\n\n有些程序员喜欢通配符的“PECS”记忆法：生产者 `extends`，消费者 `super`。从中读取值的\
  \ `ArrayList` 是生产者，所以使用 `extends` 通配符。向其提供测试值的 `Predicate` 是消费者，因此使用 `super`。\n\n\
  #### 6.4.3. 带有类型变量的通配符\n\n考虑前节方法的泛化，它用于打印满足条件的任意元素：\n\n```\npublic <T> void printAll(T[]\
  \ elements, Predicate<T> filter) {\n\n    for (T e : elements)\n\n        if (filter.test(e))\n\
  \n            System.out.println(e.toString());\n\n}\n\n```\n\n\n\n\n这是一个适用于任何类型数组的通用方法。类型参数是传入的数组的类型。然而，它存在你在前一节中看到的局限性。`Predicate`\
  \ 的类型参数必须与方法的类型参数完全匹配。\n\n解决方案与你之前看到的相同——但这次通配符的边界是一个类型变量：\n\n```\npublic static\
  \ <T> void printAll(T[] elements, Predicate<? super T> filter)\n```\n\n该方法接收一个用于类型为\
  \ `T` 或 `T` 的任何父类的元素的过滤器。\n\n这里是另一个例子。`Collection<E>` 接口（你将在下一章中详细介绍）描述了一个包含类型为\
  \ `E` 的元素的集合。它有一个方法\n\n```\npublic boolean addAll(Collection<? extends E> c)\n```\n\
  \n你可以从另一个集合中添加所有元素，只要该集合的元素类型也是 `E` 或其某个子类。通过这个方法，你可以将一个经理的集合添加到一个员工的集合中，但反之则不行。\n\
  \n为了看到类型声明可以变得复杂，请考虑 `Collections.sort` 方法的定义：\n\n```\npublic static <T extends\
  \ Comparable<? super T>> void sort(List<T> list)\n```\n\n`List` 接口（将在下一章详细介绍）描述了一个元素序列，例如链表或\
  \ `ArrayList`。`sort` 方法愿意对任何 `List<T>` 进行排序，只要 `T` 是 `Comparable` 的子类。但 `Comparable`\
  \ 接口再次是泛型的：\n\n```\npublic interface Comparable<T> {\n\n    int compareTo(T other);\
  \ }\n```\n\n它的类型参数指定了 `compareTo` 方法的参数类型。因此，`Collections.sort` 似乎可以被声明为\n\n```\n\
  public static <T extends Comparable<T>> void sort(List<T> list)\n```\n\n但那样限制太严格了。假设\
  \ `Employee` 类实现了 `Comparable<Employee>`，通过薪水比较员工。假设 `Manager` 类扩展了 `Employee`。注意它实现的是\
  \ `Comparable<Employee>`，*不是* `Comparable<Manager>`。因此，`Manager` *不是* `Comparable<Manager>`\
  \ 的子类，但它是 `Comparable<? super Manager>` 的子类。\n\n#### Note\n\n在某些编程语言（如 C# 和 Scala）中，你可以将类型参数声明为协变或逆变。例如，通过将\
  \ `Comparable` 的类型参数声明为逆变，就不需要为每个 `Comparable` 参数使用通配符。这种“声明处变性”非常方便，但它没有 Java 通配符的“使用处变性”那么强大。\n\
  \n#### 6.4.4 无界通配符\n\n对于只执行非常通用操作的情况，可以使用无界通配符。例如，这里有一个检查 `ArrayList` 是否包含任何 `null`\
  \ 元素的方法：\n\n```\npublic static boolean hasNulls(ArrayList<?> elements) {\n\n   \
  \ for (Object e : elements) {\n\n        if (e == null) return true;\n\n    }\n\n\
  \    return false;\n\n}\n```\n\n由于 `ArrayList` 的类型参数并不重要，使用 `ArrayList<?>` 是意义的。同样可以将\
  \ `hasNulls` 变成一个泛型方法：\n\n```\npublic static <T> boolean hasNulls(ArrayList<T> elements)\n\
  ```\n\n但通配符易于理解，所以这是首选方法。\n\n#### 6.4.5 通配符捕获\n\n让我们尝试使用通配符定义一个 `swap` 方法：\n\n```java\n\
  public static void swap(ArrayList<?> elements, int i, int j) {\n\n    ? temp = elements.get(i);\
  \ // 无法工作\n\n    elements.set(i, elements.get(j));\n\n    elements.set(j, temp);\n\
  \n}\n```\n\n这是行通的。你可以将 `?` 作为类型参数，但不能作为类型。\n\n不过，有一个变通方法。添加这样的辅助方法：\n\n```\npublic\
  \ static void swap(ArrayList<?> elements, int i, int j) {\n\n    swapHelper(elements,\
  \ i, j);\n\n}\n```\n\n```\nprivate static <T> void swapHelper(ArrayList<T> elements,\
  \ int i, int j) {\n\n    T temp = elements.get(i);\n\n    elements.set(i, elements.get(j));\n\
  \n    elements.set(j, temp);\n\n}\n```\n\n对 `swapHelper` 的调用是有效的，是因为有一个被称为*通配符捕获*（wildcard\
  \ capture）的特殊规则。编译器不知道 `?` 是什么，但它代表某种类型，所以调用泛型方法是。`swapHelper` 的类型参数 `T` “捕获”了通配符类型。由于\
  \ `swapHelper` 是泛型方法，而不是参数中带有通配符的方法，它可以利用类型变量 `T` 来声明变量。\n\n我们得到了什么？API 的用户看到的是一个易于理解的\
  \ `ArrayList<?>`，而不是泛型方法。\n\n### 6.5 Java 虚拟机中的泛型\n\n当泛型类型和方法被引入 Java 时，Java 设计者希望类的泛型形式能与先前的版本兼容。例如，应该能够将\
  \ `ArrayList<String>` 传递给泛型出现之前接收 `ArrayList` 类的旧方法（该类收集 `Object` 类型的元素）。语言设计者决定采用一种在虚拟机中“擦除”类型的实现方法。这在当时非常流行，因为它允许\
  \ Java 用户逐渐迁移到使用泛型。正如你可以想象的，为了兼容性而做出的妥协，在迁移完成后很长之后仍然存在。\n\n在本节中，你将看到虚拟机内部发生了什么，下一节将检查（内容）。\n\
  \n##### 6.5.1 类型擦除\n\n当你定义一个泛型类型时，它会被编译为*原始*（raw）类型。例如，`Entry<K, V>` 类会变为\n\n```\n\
  public class Entry {\n\n    private Object key;\n\n    private Object value;\n\n\
  \    public Entry(Object key, Object value) {\n\n        this.key = key;\n\n   \
  \     this.value = value;\n\n    }\n\n    public Object getKey() { return key; }\n\
  \n    public Object getValue() { return value; }\n\n}\n```\n\n每个 `K` 和 `V` 都被替换为\
  \ `Object`。如果类型变量有边界，它会被替换为第一个边界。假设我们声明 `Entry` 类为\n\n```\npublic class Entry<K\
  \ extends Comparable<? super K> & Serializable,\n\n                   V extends\
  \ Serializable>\n```\n\n那么它会被擦除为一个类：\n\n```\npublic class Entry {\n\n    private\
  \ Comparable key;\n\n    private Serializable value;\n\n    ...\n}\n```\n\n#####\
  \ 6.5.2 强制转换插入\n\n类型擦除听起来有些危险，但实际上是非常安全的。假设例如你使用了一个 `Entry<String, Integer>` 对象。当你构造该对象时，必须提供一个\
  \ `String` 类型的键和一个 `Integer` 或可转换为 `Integer` 的值。否则，你的程序甚至无法编译。因此，你可以保证 `getKey`\
  \ 方法返回 `String`。\n\n然而，假设你的程序带有“未检查”警告通过，可能是因为你使用了强制转换或混合了泛型和原始 `Entry` 类型。那么，`Entry<String,\
  \ Integer>` 可能具有不同类型的键。\n\n因此，在运行时也有必要进行安全检查。每当从擦除类型的表达式读取内容时，编译器都会插入强制转换。考虑例如\n\
  \n```\nEntry<String, Integer> entry = ...;\n\nString key = entry.getKey();\n```\n\
  \n由于擦后的 `getKey` 方法返回 `Object`，编译器生成的代码等于\n\n```\nString key = (String) entry.getKey();\n\
  ```\n\n##### 6.5.3 桥方法\n\n在前面的节中，你已经了解了擦除的基本原理。它是简单且安全的。嗯，几乎简单。在擦除方法参数和返回值类型时，有时需要编译器合成*桥方法*（bridge\
  \ methods）。这是一种实现细节，除非你想知道为什么这种方法会出现在堆栈跟踪中，或者你想了解 Java 泛型某些更晦涩的限制的解释（参见第 6.6.6 节）。\n\
  \n考虑这个例子：\n\n\n\n\n\n```java\npublic class WordList extends ArrayList<String> {\n\
  \n    public boolean add(String e) {\n        return isBadWord(e) ? false : super.add(e);\n\
  \    }\n\n    ...\n}\n```\n\n现在考虑这段代码片段：\n\n```\nWordList words = ...;\n\nArrayList<String>\
  \ strings = words; // OK—转换为父类\n\nstrings.add(\"C++\");\n```\n\n最后一次方法调用触发了 `ArrayList`\
  \ 类中（擦除后的）`add(Object)` 方法。\n\n人们会合理地预期动态方法查找在这种情况下生效，这样在 `WordList` 对象上调用 `add`\
  \ 时，调用的是 `WordList` 的 `add` 方法，而不是 `ArrayList` 的 `add` 方法。\n\n为了实现这一点，编译器在 `WordList`\
  \ 类中合成了一个桥方法（bridge method）：\n\n```java\npublic boolean add(Object e) {\n    return\
  \ add((String) e);\n}\n```\n\n在调用 `strings.add(\"C++\")` 时，调用了 `add(Object)` 方法，它又调用了\
  \ `WordList` 类的 `add(String)` 方法。\n\n当返回类型发生变化时，桥方法也可以被调用。考虑这个方法：\n\n```java\npublic\
  \ class WordList extends ArrayList<String> {\n\n    public String get(int i) {\n\
  \        return super.get(i).toLowerCase();\n    }\n\n    ...\n}\n```\n\n在 `WordList`\
  \ 类中，有两个 `get` 方法：\n\n```\nString get(int) // 定义在 WordList 中\nObject get(int) //\
  \ 重写了 ArrayList 中定义的方法\n```\n\n第二个方法是由编译器合成的，它调用第一个方法。这同样是为了让动态方法查找生效。\n\n这些方法具有相同的参数类型但不同的返回类型。在\
  \ Java 语言中，你无法实现这样一对方法。但在虚拟机中，方法是通过名称、参数类型和返回类型来指定的，这允许编译器生成这对方法。\n\n### 注意\n\n\
  桥方法不仅用于泛型类型。它们还被用于实现协变返回类型（covariant return types）。例如，在第 4 章中，你看到了如何声明一个具有适当返回类型的\
  \ `clone` 方法：\n\n```java\npublic class Employee implements Cloneable {\n    public\
  \ Employee clone() throws CloneNotSupportedException { ... }\n}\n```\n\n在这种情况下，`Employee`\
  \ 类有两个 `clone` 方法：\n\n```\nEmployee clone() // 上文定义\nObject clone() // 合成的桥方法\n\
  ```\n\n桥方法再次为了让动态方法查找生效而生成，它调用了第一个方法。\n\n## 6.6. 泛型的限制\n\n在 Java 中使用泛型类型和方法时有若干限制——有些仅仅是令人惊讶，另一些则确实不方便。它们大部分都是类型擦除的结果。接下来的章节将向你展示实践中最可能遇到的那些限制。\n\
  \n#### 6.6.1. 不支持基本类型参数\n\n类型参数永远不能是基本类型。例如，你不能构造一个 `ArrayList<int>`。正如你所见，在虚拟机中只有一种类型，即存储\
  \ `Object` 类型元素的原始 `ArrayList`。`int` 不是一个对象。\n\n当泛型首次引入时，这并不被认为是一个大问题。毕竟，人们可以构造一个\
  \ `ArrayList<Integer>` 并依赖自动装箱。然而，随着泛型使用得广泛，痛苦正在增加。现在存在大量的函数式接口，如 `IntFunction`、`LongFunction`、`DoubleFunction`、`ToIntFunction`、`ToLongFunction`、`ToDoubleFunction`——这只处理了一元函数和八种基本类型中的三种。\n\
  \n#### 6.6.2. 在运行时，所有类型都是原始类型\n\n在虚拟机中，只有原始类型。例如，你不能在运行时查询 `ArrayList` 是否包含 `String`\
  \ 对象。像这样的条件：\n\n```\nif (a instanceof ArrayList<String>)\n```\n\n是一个编译时错误，因为这种检查永远无法执行。\n\
  \n对泛型类型的实例进行强制转换同样无效，但它是合法的。\n\n```java\nObject result = ...;\n\nArrayList<String>\
  \ list = (ArrayList<String>) result;\n\n// 警告—这只检查 result 是否为原始 ArrayList\n```\n\
  \n这种强制转换是被允许的，因为有时没有办法避免它。如果 `result` 是一个非常通用过程的结果（例如通过反射调用方法，参见第 4 章），且编译器未知其确切类型，则程序员必须使用强制转换。仅转换为\
  \ `ArrayList` 或 `ArrayList<?>` 是不够的。\n\n为了让警告消失，可以像这样对变量进行注解：\n\n```java\n@SuppressWarnings(\"\
  unchecked\") ArrayList<String> list = (ArrayList<String>) result;\n```\n\n### 注意\n\
  \n滥用 `@SuppressWarnings` 注解可能会导致*堆污染*（heap pollution）——即本应属于特定泛型类型实例但实际上属于另一个实例的对象。例如，你可以将一个\
  \ `ArrayList<Employee>` 赋值给一个 `ArrayList<String>` 引用。后果是当获取错误类型的元素时会抛出 `ClassCastException`。\n\
  \n### 提示\n\n堆污染的问题在于，报告的运行时错误远离问题的根源——即插入错误的元素。如果你需要调试此类问题，可以使用“检查视图”（checked view）。当你构造（例如）一个\
  \ `ArrayList<String>` 时，改用：\n\n```java\nList<String> strings = Collections.checkedList(new\
  \ ArrayList<>(), String.class);\n```\n\n该视图监控向列表的所有插入操作，并在添加错误类型时抛出异常。通常，允许调用者提供任何长度的数组。如果提供的数组太短，方法将使用反射创建一个。\n\
  \n#### 6.6.3. 你不能实例化类型变量\n\n你不能在 `new T` 或 `new T[]` 等表达式中使用类型变量。这种尝试不可行：\n\n```java\n\
  public static <T> T[] repeat(int n, T obj) {\n    T[] result = new T[n]; // 错误—无法构造数组\n\
  \    for (int i = 0; i < n; i++) result[i] = obj;\n    return result;\n}\n```\n\n\
  要解决这个问题，让调用者通过方法引用提供数组构造函数：\n\n```\nString[] greetings = Arrays.repeat(10, \"Hi\"\
  , String[]::new);\n```\n\n该方法的实现：\n\n```java\npublic static <T> T[] repeat(int n,\
  \ T obj, IntFunction<T[]> constr) {\n    T[] result = constr.apply(n);\n    for\
  \ (int i = 0; i < n; i++) result[i] = obj;\n    return result;\n}\n```\n\n或者，你可以要求用户提供类对象并使用反射。\n\
  \n```java\npublic static <T> T[] repeat(int n, T obj, Class<T> cl) {\n    @SuppressWarnings(\"\
  unchecked\") T[] result = (T[]) java.lang.reflect.Array.newInstance(cl, n);\n  \
  \  for (int i = 0; i < n; i++) result[i] = obj;\n    return result;\n}\n```\n\n\
  该方法的调用方式如下：\n\n```\nString[] greetings = Arrays.repeat(10, \"Hi\", String.class);\n\
  ```\n\n另一种方案是让调用者分配数组。\n\n```java\npublic static <T> T[] repeat(int n, T obj, T[]\
  \ array) {\n    T[] result;\n    if (array.length >= n)\n        result = array;\n\
  \    else {\n        @SuppressWarnings(\"unchecked\") T[] newArray = (T[]) java.lang.reflect.Array.newInstance(\n\
  \                array.getClass().getComponentType(), n);\n        result = newArray;\n\
  \    }\n    for (int i = 0; i < n; i++) result[i] = obj;\n    return result;\n}\n\
  ```\n\n\n\n\n\n你 `can` 使用类型变量来实例化一个 `ArrayList`。例如，以下代码完全合法的：\n\n```java\npublic\
  \ static <T> ArrayList<T> repeat(int n, T obj) {\n    var result = new ArrayList<T>();\
  \ // OK\n\n    for (int i = 0; i < n; i++) result.add(obj);\n\n    return result;\n\
  }\n```\n\n这比你刚刚看到的变通方法要简单得多，当你没有充分的理由去创建一个数组时，我推荐使用这种方法。\n\n#### Note\n\n如果泛型类需要一个作为实现私有部分的泛型数组，你只需要构造一个\
  \ `Object[]` 数组即可。这正是 `ArrayList` 类所做的：\n\n```java\npublic class ArrayList<E> {\n\
  \    private Object[] elementData;\n\n    public E get(int index) {\n        return\
  \ (E) elementData[index];\n    }\n\n    ...\n\n}\n```\n\n#### 6.6.4. 你不能构造参数化类型的数组\n\
  \n假设你想创建一个 `Entry` 对象的数组：\n\n```java\nvar entries = new Entry<String, Integer>[100];\n\
  // Error—无法构造带有泛型组件类型的数组\n```\n\n这是一个语法错误。这种构造是被禁止的，因为在类型擦除后，该数组构造函数会创建一个原始（raw）`Entry`\
  \ 数组。这将导致你可能添加任何类型的 `Entry` 对象（例如 `Entry<Employee, Manager>`）而不会抛出 `ArrayStoreException`。\n\
  \n注意，*类型* `Entry<String, Integer>[]` 是完全合法的。你可以声明一个该类型的变量。如果你真的想初始化它，可以这样做：\n\n\
  ```java\n@SuppressWarnings(\"unchecked\") Entry<String, Integer>[] entries\n   \
  \ = (Entry<String, Integer>[]) new Entry<?, ?>[100];\n```\n\n但使用 array list 会更简单：\n\
  \n```java\nvar entries = new ArrayList<Entry<String, Integer>>(100);\n```\n\n回想可变参数（varargs）本质上是伪装的数组。如果这样一个参数是泛型的，你就可以绕过对泛型数组创建的限制。考虑这个方法：\n\
  \n```java\npublic static <T> ArrayList<T> asList(T... elements) {\n    var result\
  \ = new ArrayList<T>();\n    for (T e : elements) result.add(e);\n    return result;\n\
  }\n```\n\n现在考虑这个调用：\n\n```java\nEntry<String, Integer> entry1 = ...;\nEntry<String,\
  \ Integer> entry2 = ...;\nArrayList<Entry<String, Integer>> entries = Lists.asList(entry1,\
  \ entry2);\n```\n\n`T` 的推断类型是泛型类型 `Entry<String, Integer>`，因此 `elements` 是类型为 `Entry<String,\
  \ Integer>` 的数组。这正是你无法自己完成的数组创建方式！\n\n在这种情况下，编译器报告的是警告而不是错误。如果你的方法只从参数数组中读取元素，则应该使用\
  \ `@SafeVarargs` 注解来抑制警告：\n\n```java\n@SafeVarargs public static <T> ArrayList<T>\
  \ asList(T... elements)\n```\n\n该注解可以应用于 `static`、`final` 或 `private` 方法，或者构造函数。任何其他方法都可能被重写，因此不符合该注解条件。\n\
  \n### 6.6.5. 类类型变量在静态上下文中无效\n\n考虑一个带有类型变量的泛型类，例如 `Entry<K, V>`。你不能在静态变量或方法中使用类型变量\
  \ `K` 和 `V`。例如，以下代码不起作用：\n\n```java\npublic class Entry<K, V> {\n    private static\
  \ V defaultValue;\n    // Error—静态上下文中的 V\n\n    public static void setDefault(V\
  \ value) { defaultValue = value; }\n    // Error—静态上下文中的 V\n\n    ...\n\n}\n```\n\
  \n归根底，类型擦除意味着在擦除后的 `Entry` 类中只有一个这样的变量或方法，而不是为每个 `K` 和 `V` 都对应一个。\n\n### 6.6.6.\
  \ 方法在擦除后可能发生冲突\n\n你不能声明在擦除后会导致冲突的方法。例如，以下代码将是一个错误：\n\n```java\npublic interface\
  \ Ordered<T> extends Comparable<T> {\n    public default boolean equals(T value)\
  \ {\n        // Error—擦除与 Object.equals 冲突\n        return compareTo(value) == 0;\n\
  \    }\n\n    ...\n}\n```\n\n`equals(T value)` 方法擦除为 `equals(Object value)`，这与来自\
  \ `Object` 的相同方法发生冲突。\n\n有时候，冲突的原因更为微妙。这里有一个棘手的情况：\n\n```java\npublic class Employee\
  \ implements Comparable<Employee> {\n    ...\n    public int compareTo(Employee\
  \ other) {\n        return name.compareTo(other.name);\n    }\n}\n\npublic class\
  \ Manager extends Employee implements Comparable<Manager> {\n    // Error—不能有两个\
  \ Comparable 实例化作为超类\n    ...\n    public int compareTo(Manager other) {\n     \
  \   return Double.compare(salary, other.salary);\n    }\n}\n```\n\n`Manager` 类继承自\
  \ `Employee`，因此获取了超类 `Comparable<Employee>`。自然地，经理们想要根据薪水互相比较，而不是根据姓名。为什么不呢？这里没有擦除。只有两个方法：\n\
  \n```java\npublic int compareTo(Employee other)\npublic int compareTo(Manager other)\n\
  ```\n\n问题在于*桥接方法（bridge methods）冲突*。回想 第 6.5.3 节，这两个方法冲突。\n\n### 6.6.7. 异常与泛型\n\n\
  你不能抛出或捕获泛型对象。事实上，你甚至不能形成 `Throwable` 的子类：\n\n```java\npublic class <T> extends Exception\n\
  // Error—泛型不能是 Throwable 的子类\n```\n\n你不能在 `catch` 子句中使用类型变量：\n\n```java\npublic\
  \ static <T extends Throwable> void doWork(Runnable r, Class<T> cl) {\n    try {\n\
  \        r.run();\n    } catch (T ex) { // Error—无法捕获类型变量\n        cl.getGlobal().log(ex);\n\
  \    }\n}\n```\n\n然而，你可以在 `throws` 声明中使用类型变量：\n\n```java\npublic static <V, T extends\
  \ Throwable> V doWork(Callable<V> c) throws T {\n    // ...\n}\n```\n\n#### Note\n\
  \n#### Caution\n\n你可以使用泛型来消除检查异常和运行时异常之间的区别。关键要素在于这对方法：\n\n```java\npublic class\
  \ Exceptions {\n    @SuppressWarnings(\"unchecked\")\n    private static <T extends\
  \ Throwable>\n    void throwAs(Throwable e) throws T {\n        throw (T) e; //\
  \ 强制转换被擦除为 (Throwable) e\n    }\n\n    public static <V> doWork(Callable<V> c) {\n\
  \        try {\n            return c.call();\n        } catch (Throwable ex) {\n\
  \            Exceptions.<RuntimeException>throwAs(ex);\n            return null;\n\
  \        }\n    }\n}\n```\n\n现在考虑这个方法：\n\n```java\npublic static String[] readWords(Path\
  \ path) {\n    return doWork(() -> Files.readString(path).split(\"\\\\s+\"));\n\
  }\n```\n\n尽管 `Files.readString` 在路径未时会抛出检查异常，但该异常在 `readWords` 方法中既没有声明也没有被捕获！\n\
  \n\n\n\n\n```java\npublic static <T> ArrayList<T> repeat(int n, Class<T> cl)\n \
  \       throws ReflectiveOperationException {\n    var result = new ArrayList<T>();\n\
  \    for (int i = 0; i < n; i++)\n        result.add(cl.getConstructor().newInstance());\n\
  \    return result;\n}\n```\n\n该方法可以编译，因为 `cl.getConstructor().newInstance()` 返回类型为\
  \ `T` 的结果。\n\n假设你这样调用该方法`repeat(10, Employee.class)`。此时 `T` 被推断为类型 `Employee`，因为\
  \ `Employee.class` 的类型是 `Class<Employee>`。因此，返回类型是 `ArrayList<Employee>`。\n\n除了\
  \ `getConstructor` 方法外，`Class` 类还有几个使用类型参数的方法。它们是：\n\n```java\nClass<? super T>\
  \ getSuperclass()\n<U> Class<? extends U> asSubclass(Class<U> clazz)\nT cast(Object\
  \ obj)\nConstructor<T> getDeclaredConstructor(Class<?>... parameterTypes)\nT[] getEnumConstants()\n\
  ```\n\n正如你在 第 4 章 中看到的，在很多情况下你对 `Class` 对象描述的类一无所知。这时，你可以直接使用通配符类型 `Class<?>`。\n\
  \n### 6.7.2 虚拟机中的泛型类型信息\n\n擦（Erasure）只影响实例化的类型参数。泛型类和方法的*声明*完整信息在运行时是可用的。\n\n例如，假设调用\
  \ `obj.getClass()` 返回 `ArrayList.class`。你无法判断 `obj` 是作为 `ArrayList<String>` 还是 `ArrayList<Employee>`\
  \ 构建的。但你可以确定 `ArrayList` 类是一个泛型类，拥有一个没有边界的类型参数 `E`。\n\n同样，考虑 `Collections` 类的方法\n\
  \n```java\nstatic <T extends Comparable<? super T>> void sort(List<T> list)\n```\n\
  \n正如你在 第 4 章 中看到的，你可以通过以下方式获取相应的 `Method` 对象：\n\n```java\nMethod m = Collections.class.getMethod(\"\
  sort\", List.class);\n```\n\n通过这个 `Method` 对象，你可以恢复整个方法的签名。\n\n`java.lang.reflect`\
  \ 包中的 `Type` 接口代表泛型类型声明。该接口有以下子类型：\n\n1. `Class` 类，描述具体类型\n2. `TypeVariable` 接口，描述类型变量（例如\
  \ `T extends Comparable<? super T>`）\n3. `WildcardType` 接口，描述通配符（例如 `? super T`）\n\
  4. `ParameterizedType` 接口，描述泛型类或接口类型（例如 `Comparable<? super T>`）\n5. `GenericArrayType`\
  \ 接口，描述泛型数组（例如 `T[]`）\n\n注意，后四个子类型都是接口——虚拟机会实例化实现这些接口的相应类。\n\n类和方法都可以拥有类型变量。从技术上说，构造函数不是方法，它们在反射库中由单独的类表示。它们也可以是泛型的。要确定一个\
  \ `Class`、`Method` 或 `Constructor` 对象是否来自泛型声明，调用 `getTypeParameters` 方法。你会得到一个 `TypeVariable`\
  \ 实例数组，声明中的每个类型变量对应一个实例；如果声明不是泛型的，则返回长度为 0 的数组。\n\n`TypeVariable<D>` 接口是泛型的。类型参数是\
  \ `Class<T>`、`Method` 或 `Constructor<T>`，取决于类型变量声明的位置。例如，这里是获取 `ArrayList` 类类型变量的方法：\n\
  \n```java\nTypeVariable<Class<ArrayList>>[] vars = ArrayList.class.getTypeParameters();\n\
  String name = vars[0].getName(); // \"E\"\n```\n\n这里 `Collections.sort` 方法的类型变量：\n\
  \n```java\nMethod m = Collections.class.getMethod(\"sort\", List.class);\nTypeVariable<Method>[]\
  \ vars = m.getTypeParameters();\nString name = vars[0].getName(); // \"T\"\n```\n\
  \n后者的变量有一个边界，你可以这样处理它：\n\n```java\nType[] bounds = vars[0].getBounds();\nif (bounds[0]\
  \ instanceof ParameterizedType p) { // Comparable<? super T>\n    Type[] typeArguments\
  \ = p.getActualTypeArguments();\n    if (typeArguments[0] instanceof WildcardType\
  \ t) { // ? super T\n        Type[] upper = t.getUpperBounds(); // ? extends ...\
  \ & ...\n        Type[] lower = t.getLowerBounds(); // ? super ... & ...\n     \
  \   if (lower.length > 0) {\n            String description = lower[0].getTypeName();\
  \ // \"T\"\n            ...\n        }\n    }\n}\n```\n\n这让你了解了如何分析泛型声明的大致。我不会纠结于细节，因为这在实践中并不常见。关键点是，泛型类和方法的声明没有被擦除，你可以通过反射访问它们。\n\
  \n### 练习题\n\n1. 实现一个 `Stack<E>` 类，用于管理一个类型为 `E` 的元素数组列表。提供 `push`、`pop` 和 `isEmpty`\
  \ 方法。\n2. 重新实现 `Stack<E>` 类，使用数组来存储元素。如有必要，在 `push` 方法中扩展数组。提供两种解决方案，一种使用 `E[]`\
  \ 数组，另一种使用 `Object[]` 数组。两种解决方案都应该在无警告的情况下编译。你更倾向于哪一种？为什么？\n3. 实现一个 `Table<K, V>`\
  \ 类，用于管理 `Entry<K, V>` 元素的数组列表。提供获取值、存值和删除键的方法。\n4. 正如你在 第 4 章 中看到的，在很多情况下你对 `Class`\
  \ 对象描述的类一无所知。这时，你可以直接使用通配符类型 `Class<?>`。\n5. 在上一个练习中，将 `Entry` 改为内部类。该类应该是泛型的吗？\n\
  6. 考虑以下 `swap` 变体，可以使用变长参数：\n\n```java\npublic static <T> T[] swap(int i, int j,\
  \ T... values) {\n    T temp = values[i];\n    values[i] = values[j];\n    values[j]\
  \ = temp;\n    return values;\n}\n```\n现在看调用：\n```java\nDouble[] result = Arrays.swap(0,\
  \ 1, 1.5, 3);\n```\n你得到了什么错误信息？现在调用：\n```java\nDouble[] result = Arrays.<Double>swap(0,\
  \ 1, 1.5, 3);\n```\n错误信息改进了吗？如何修复？\n7. 实现一个泛型方法，将一个数组列表的所有元素追加到另一个中。其中一个类型参数使用通配符。提供两种等效方案，一种使用\
  \ `? extends E`，另一种使用 `? super E`。\n8. 实现类 `Pair<E>`存储类型为 `E` 的元素对。提供访问器来获取第一个和第二个元素。\n\
  9. 在工具类 `Arrays` 中提供一个方法：\n```java\npublic static <E> Pair<E> firstLast(ArrayList<E>\
