  \ view）如何为堆污染（heap pollution）的原因提供准确的错误报告。\n\n19. `Collections` 类具有静态变量 `EMPTY_LIST`、`EMPTY_MAP`\
  \ 和 `EMPTY_SET`。为什么它们没有 `emptyList`、`emptyMap` 和 `emptySet` 方法有用呢？\n\n## 8. 流 (Streams)\n\
  \n流提供了一种数据视图，让你能够在比集合更高级的概念层指定计算任务。在流中，你指定的是“想要做什么”，而不是“如何做”。你将操作的调度留给实现部分。例如，假设你想计算某个属性的平均值。你指定数据源和属性，然后流库就可以优化计算，例如通过使用多个线程计算总和和计数并合并结果。\n\
  \n本章的要点是：\n\n1. 迭代器意味着特定的遍历策略，并限制了高效的并发执行。\n2. 你可以集合、数组、生成器或迭代器创建流。\n3. 使用 `filter`\
  \ 选择元素，使用 `map` 转换元素。\n4. 其他转换流的操作包括 `limit`、`distinct` 和 `sorted`。\n5. 要从流获取结果，使用归约操作符，如\
  \ `count`、`max`、`min`、`findFirst` 或 `findAny`。其中一些方法返回一个 `Optional` 值。\n6. `Optional`\
  \ 类型旨在作为处理 `null` 值的安全替代方案。要安全地使用它，请利用 `ifPresent` 和 `orElse` 方法。\n7. 你可以将流的结果收集到集合、数组、字符串或映射中。\n\
  8. `Collectors` 类的 `groupingBy` 和 `partitioningBy` 方法允许你将流的内容分成组，并获取每个组的结果。\n9.\
  \ 针对原始数据类型 `int`、`long` 和 `double` 有专门的流。\n10. 并行流（Parallel streams）会自动将流操作并行化。\n\
  \n### 8.1. 从迭代到流操作\n\n当你处理一个集合时，通常会遍历它的元素，并对每个元素执行一些操作。例如，假设我们想统计一书中所有的长单词。首先，将它们放入列表：\n\
  \n```\nString contents = Files.readString(Path.of(\"alice.txt\"), StandardCharsets.UTF_8);\n\
  \nList<String> words = List.of(contents.split(\"\\\\PL+\"));\n\n// 拆分为单词；非字母字符是分隔符\n\
  ```\n\n现在我们准备好进行迭代了：\n\n```\nint count = 0;\n\nfor (String w : words) {\n    if\
  \ (w.length() > 12) count++;\n}\n```\n\n使用流，相同的操作看起来如下：\n\n```\nlong count = words.stream()\n\
  \    .filter(w -> w.length() > 12)\n    .count();\n```\n\n现在，你不再需要扫描循环来寻找过滤和计数的证据了。方法名会立即告诉你代码的意图。此外，当循环详尽地规定了操作顺序时，流能够以它任何想要的方式调度操作，只要结果是正确的。\n\
  \n只需将 `stream` 改为 `parallelStream`，流库即可并行执行过滤和计数。\n\n```\nlong count = words.parallelStream()\n\
  \    .filter(w -> w.length() > 12)\n    .count();\n```\n\n流遵循“做什么，而不是怎么做”的原则。在我们的流示例中，我们描述了需要做什么：获取长单词并计数。我们没有指定在哪个顺序、以什么方式执行。\n\
  \n流与集合表面上相似，但有显著差异：\n\n1. 流不存储元素。\n2. 流操作是惰性的（lazy），只有在需要时才会执行。\n3. 只要谓词拒绝一个迭代生成的值，流就会结束。\n\
  \n### 8.2. 创建流\n\n你已经看到可以通过 `stream` 方法将任何集合转换为流。如果是数组，请使用 `Stream.of`。\n\n```\n\
  Stream<String> words = Stream.of(contents.split(\"\\\\PL\"));\n\n// split 返回 String[]\n\
  ```\n\n`of` 方法具有变长参数，因此你可以从任意数量的参数构造流：\n\n```\nStream<String> song = Stream.of(\"\
  gently\", \"down\", \"stream\");\n```\n\n使用 `Arrays.stream` 从数组的一部分创建流。要创建一个空元素的流，使用静态\
  \ `Stream.empty` 方法：\n\n`Stream` 接口有两个静态方法来创建无限流。`generate` 方法接收一个无参数的函数（技术上是 `Supplier<T>`\
  \ 接口）。每当需要流值时，就会调用该函数产生值。你可以获取常量值的流：\n\n```\nStream<String> echos = Stream.generate(()\
  \ -> \"Echo\");\n```\n\n或者获取随机数的流：\n\n```\nStream<Double> randoms = Stream.generate(Math::random);\n\
  ```\n\n要产生如 `0 1 2 3 ...` 的序列，请改用 `iterate` 方法。它接受一个“种子”值和一个函数（技术上是 `UnaryOperator<T>`），并反复将该函数应用于上一个结果。例如：\n\
  \n```\nStream<BigInteger> integers\n    = Stream.iterate(BigInteger.ZERO, n -> n.add(BigInteger.ONE));\n\
  ```\n\n序列中的第一个元素是种子 `BigInteger.ZERO`。第二个元素是 `f(seed)`，即 `1`（大整数）。下一个元素是 `f(f(seed))`，即\
  \ `2`，依此类推。\n\n要产生有限流，请添加一个谓词来指定迭代何时结束：\n\n```\nvar limit = new BigInteger(\"10000000\"\
  );\n\nStream<BigInteger> integers\n    = Stream.iterate(BigInteger.ZERO,\n     \
  \  n -> n.compareTo(limit) < 0,\n       n -> n.add(BigInteger.ONE));\n```\n\n\n\n\
  \n最后，`Stream.ofNullable` 方法可以从对象创建一个非常短的流。如果对象为 `null`，流的长度为 0；否则长度为 1，且包含该对象。这在与\
  \ `flatMap` 结合时非常有用——示例参见第 8.7.7 节。\n\n### 注意\n\nJava API 中的许多方法都会产生流。例如，`String`\
  \ 类有一个 `lines` 方法，它会产生一个包含字符串中所有行的流：\n\n```\nStream<String> greetings = \"Hello\\\
  nGuten Tag\\nBonjour\".lines()\n```\n\n`Pattern` 类有一个方法 `splitAsStream`，它可以根据正则表达式分割\
  \ `CharSequence`。你可以使用以下语句将字符串拆分为单词：\n\n```\nStream<String> words = Pattern.compile(\"\
  \\\\PL+\").splitAsStream(contents);\n```\n\n`Scanner.tokens` 方法产生一个包含扫描器令牌流。从字符串中获取单词流的另一种方法是：\n\
  \n```\nStream<String> words = new Scanner(contents).tokens();\n```\n\n静态方法 `Files.lines`\
  \ 返回一个文件中所有行的 `Stream`：\n\n```\ntry (Stream<String> lines = Files.lines(path)) {\n\
  \    // 处理行\n}\n```\n\n要查看本节引入的流之一的内容，请使用 `toList` 方法，它将流的元素收集到列表中。像 `count` 一样，`toList`\
  \ 是终端操作。如果流是无限的，请先用 `limit` 方法对其进行截断：\n\n```\nSystem.out.println(Stream.generate(Math::random).limit(10).toList());\n\
  ```\n\n### 注意\n\n如果你有一个不是集合的 `Iterable`，可以通过调用将其将其转换为流：\n\n```\nStreamSupport.stream(iterable.spliterator(),\
  \ false);\n```\n\n如果你有一个 `Iterator` 并想要获取其结果的流，请使用：\n\n```\nStreamSupport.stream(Spliterators.spliteratorUnknownSize(iterator,\
  \ Spliterator.ORDERED), false);\n```\n\n### 警告\n\n在执行流操作时，**不要修改支持流的集合**，这一点非常重要。记住，流并不收集它们的数据——数据始终存储在独立的集合中。如果你修改了该集合，流操作的结果将变得不可定义。JDK\
  \ 文档将此要求称为 `noninterference`（非干扰）。\n\n确切地说，由于中间流操作是惰性的，在执行终端操作之前，集合是可以改变的。例如，下面的代码虽然绝对不建议，但是可以运行的：\n\
  \n```\nList<String> wordList = . . .;\nStream<String> words = wordList.stream();\n\
  wordList.add(\"END\");\nlong n = words.distinct().count();\n```\n\n但这段代码是错误的：\n\n\
  ```\nStream<String> words = wordList.stream();\nwords.forEach(s -> if (s.length()\
  \ < 12) wordList.remove(s));\n// 错误--干扰 (interference)\n```\n\n### 8.3. `filter`、`map`\
  \ 和 `flatMap` 方法\n\n流转换产生一个其元素派自另一个流的流。你已经见过了 `filter` 转换，它产生一个包含符合特定条件的元素的新流。在这里，我们将字符串流转换为另一个仅包含长单词的流：\n\
  \n```\nList<String> words = ...;\nStream<String> longWords = words.stream().filter(w\
  \ -> w.length() > 12);\n```\n\n`filter` 的参数是一个 `Predicate<T>`——即一个从 `T` 到 `boolean`\
  \ 的函数。\n\n通常，你想要以某种方式转换流中的值。使用 `map` 方法并传递执行转换的函数。例如，你可以这样将所有单词转换为小写：\n\n```\nStream<String>\
  \ lowercaseWords = words.stream().map(String::toLowerCase);\n```\n\n在这里，我们使用了带有方法引用的\
  \ `map`。通常，你会使用 Lambda 表达式来代替：\n\n```\nStream<String> firstLetters = words.stream().map(s\
  \ -> s.substring(0, 1));\n```\n\n生成的流包含每个单词的第一个字母。\n\n当你使用 `map` 时，函数会被应用于每个元素，结果是一个包含这些执行结果的新流。偶尔，你可能会遇到一个产生可选结果（optional）或多个结果的映射函数。例如，考虑一个\
  \ `codePoints` 方法，它产生字符串的所有代码点。例如，`codePoints(\"Hello\")` 将由 `\"H\"`、`\"e\"`、`\"\
  l\"`、`\"l\"`、`\"o\"`、`\" \"`、 `\" \"` 组成。注意地球符号 (U+1F310) 由两个 `char` 值组成，因此 `codePoints`\
  \ 方法必须进行一些大量工作来实现这一点。我们稍后来看几种实现。\n\n`codePoints` 应该如何收集它的多个结果？对于流 API 来说，该方法返回 `Stream<String>`\
  \ 是最自然的。\n\n现在让我们在字符串流上映射这样的 `codePoints` 方法：\n\n```\nStream<Stream<String>> result\
  \ = words.stream().map(w -> codePoints(w));\n```\n\n你将得到一个流的流，类似于 [. . . [\"y\"\
  , \"o\", \"u\", \"r\"], [\"b\", \"o\", \"a\", \"t\"], . . .]。从像 [. . . [\"y\", \"\
  o\", \"u\", \"r\"], [\"b\", \"o\", \"a\", \"t\"], . . .]这样的字符串获取单词流，请使用 `flatMap`\
  \ 而不是 `map`：\n\n```\nStream<String> words = words.stream().flatMap(w -> codePoints(w));\n\
  ```\n\n使用 `flatMap` 时，你提供了一个为每个流元素产生流的方法。正如你所见，这可能很冗长，而且效率可能有点低。`mapMulti` 方法提供了一种替代方案。它不是产生流，而是生成结果并将它们传递给收集器——一个实现\
  \ `Consumer` 接口的对象。对于每个结果，调用收集器的 `accept` 方法。\n\n让我们用一个示例来完成这一点。以下循环产生字符串 `s` 的代码点：\n\
  \n```\nint i = 0;\nwhile (i < s.length()) {\n    int cp = s.codePointAt(i);\n  \
  \  i += Character.charCount(cp);\n    // 对 cp 做一些处理\n}\n```\n\n调用 `mapMulti` 时，你提供了一个会被用流元素和收集器调用的函数。在你的函数中，将你的结果传递给收集器。\n\
  \n```\nStream<String> result = words.stream().mapMulti((s, collector) -> {\n   \
  \ int i = 0;\n    while (i < s.length()) {\n        int cp = s.codePointAt(i);\n\
  \        i += Character.charCount(cp);\n        collector.accept(cp);\n    }\n});\n\
  ```\n\n### 8.4. 提取子流和合并流\n\n`stream('').limit(n)` 调用返回一个在 `n` 个元素之后结束的新流（如果原始流较短，则在原始流结束时结束）。该方法对于裁剪无限流特别有用。例如，\n\
  \n```\nStream<Double> randoms = Stream.generate(Math::random).limit(100);\n```\n\
  \n产生一个包含 100 个随机数的流。\n\n`stream('').skip(n)` 调用完全相反。它丢弃前 `n` 个元素。这在我们读阅读示例中非常方便，由于\
  \ `split` 方法的工作方式，第一个元素是一个不需要的空字符串。我们可以通过调用 `skip` 让它消失：\n\n```\nStream<String>\
  \ words = Stream.of(contents.split(\"\\\\PL+\")).skip(1);\n```\n\n\n\n\n`stream`.takeWhile(`predicate`)`\
  \ 调用会在 `predicate` 为 `true` 时获取流中的所有元素，然后停止。\n\n例如，假设我们使用前一节中的 `codePoints` 方法将字符串拆分为字符，并且我们想要收集所有的初始数字。`takeWhile`\
  \ 方法可以做到这一点：\n\n```\nStream<String> initialDigits = codePoints(str).takeWhile(\n\
  \n    s -> \"0123456789\".contains(s));\n```\n\n`dropWhile` 方法的作用相反，它在条件为 `true`\
  \ 时丢弃元素，并返回从第一个条件为 `false` 的元素开始的所有元素的流。例如：\n\n```\nStream<String> withoutInitialWhiteSpace\
  \ = codePoints(str).dropWhile(String::isBlank);\n```\n\n可以使用 `Stream` 类的静态方法 `concat`\
  \ 拼接两个流：\n\n```\nStream<String> combined = Stream.concat(\n\n    codePoints(\"Hello\"\
  ), codePoints(\"World\"));\n\n    // 输出流 [\"H\", \"e\", \"l\", \"l\", \"o\", \"\
  W\", \"o\", \"r\", \"l\", \"d\"]\n```\n\n当然，第一个流不应该是无限的——否则第二个流永远没有机会执行。\n\n###\
  \ 8.5. 其他流转换\n\n`distinct` 方法返回一个流，该流按原始流的相同顺序产生元素，但会抑制重复项。重复项不需要是相邻的。\n\n```\n\
  Stream<String> uniqueWords\n\n    = Stream.of(\"merrily\", \"merrily\", \"merrily\"\
  , \"gently\").distinct();\n\n    // 只保留了一个 \"merrily\"\n```\n\n对于流的排序，有 `sorted`\
  \ 方法的多种变体。一种适用于 `Comparable` 元素的流，另一种则接受一个 `Comparator`。在这里，我们对字符串进行排序，让最长的在前面：\n\
  \n```\nStream<String> longestFirst\n\n    = words.stream().sorted(Comparator.comparing(String::length).reversed());\n\
  ```\n\n与所有的流转换一样，`sorted` 方法会产生一个新的流，其元素是原始流元素按排序后的顺序。\n\n当然，你可以在不使用流的情况下对集合排序。当排序过程是流流水线的一部分时，`sorted`\
  \ 方法非常有用。\n\n最后，`peek` 方法产生另一个与原始流元素相同的流，但每当获取元素时都会调用一个函数。这对于调试非常有用：\n\n```\nObject[]\
  \ powers = Stream.iterate(1.0, p -> p * 2)\n\n    .peek(e -> System.out.println(\"\
  Fetching \" + e))\n\n    .limit(20).toArray();\n```\n\n当元素被实际访问时，会打印一条消息。这样你就可以验证\
  \ `iterate` 返回的无限流是惰性处理的。\n\n### 提示\n\n当你使用调试器调试流计算时，可以在从转换操作调用的方法中设置断点。在大多数 IDE\
  \ 中，你也可以在 lambda 表达式中设置断点。如果你只想知道流流水线中特定一点发生了什么，可以添加：\n\n```\n.peek(x -> {\n\n \
  \   return; })\n```\n\n并在第二行设置断点。\n\n### 8.6. 简单归约\n\n现在你已经了解了如何创建和转换流，我们将终于进入最重要的一个点——从流数据中获取答案。我们在这一节中涵盖的方法称为归约（`reductions`）。归约是终端操作（`terminal\
  \ operations`）。它们将流归约为可以在程序中使用的非流值。\n\n你已经见过一个简单的归约了：`count` 方法，它返回流的元素个数。\n\n其他简单的归约还有\
  \ `max` 和 `min`，它们返回最大值或最小值。这里有一个特殊——这些方法返回一个 `Optional<T>` 值，该值要么封装答案，要么表示没有值（因为流恰好是空的）。在过去，在这种情况下返回\
  \ `null` 是很常见的。但当这在测试不完全的程序中发生时，可能会导致空指针异常。`Optional` 类型是指示缺失返回值的更好方式。我们将在下一节中详细讨论\
  \ `Optional` 类型。这里是你可以获取流的最大值的方法：\n\n```\nOptional<String> largest = words.max(String::compareToIgnoreCase);\n\
  \nSystem.out.println(\"largest: \" + largest.orElse(\"\"));\n```\n\n`findFirst`\
  \ 返回非空集合中的第一个值。它在与 `filter` 结合时通常非常有用。例如，在这里我们找到第一个以字母 Q 开头的单词（如果它存在的话）：\n\n```\n\
  Optional<String> startsWithQ\n\n    = words.filter(s -> s.startsWith(\"Q\")).findFirst();\n\
  ```\n\n如果你对任何匹配都满意，而不仅仅是第一个，请使用 `findAny` 方法。这在并行化流时非常有效，因为流可以报告它找到的任何匹配项，而不是受限于第一个。\n\
  \n```\nOptional<String> startsWithQ\n\n    = words.parallel().filter(s -> s.startsWith(\"\
  Q\")).findAny();\n```\n\n如果你只想知道是否存在匹配，请使用 `anyMatch`。该方法接受一个谓词参数，所以你不需要使用 `filter`。\n\
  \n```\nboolean aWordStartsWithQ\n\n    = words.parallel().anyMatch(s -> s.startsWith(\"\
  Q\"));\n```\n\n还有 `allMatch` 和 `noneMatch` 方法，它们在所有元素或没有元素匹配谓词时返回 `true`。这些方法也受益于并行化。\n\
  \n### 8.7. Optional 类型\n\n`Optional<T>` 对象是类型为 `T` 的对象或 `none` 的封装器。在前一种情况下，我们说值存在（`present`）。`Optional`\
  \ 类型旨在作为 `null` 的更安全的替代方案。后续节将向你如何正确使用它。\n\n#### 8.7.1. 生成替代方案\n\n有效使用 `Optional`\
  \ 的关键是在没有值时产生一个替代方案，或者仅在值存在时消费它。这两种情况都有方法。\n\n在本节中，我们查看第一种策略。通常，当没有匹配时你想要一个默认值，例如空字符串：\n\
  \n```\nString result = optionalString.orElse(\"\");\n\n   // 如果无返回 \"\"\n```\n\n\
  你还可以调用代码来计算默认值：\n\n```\nString result = optionalString.orElseGet(() -> System.getProperty(\"\
  myapp.default\"));\n\n   // 仅在需要时调用函数\n```\n\n或者如果没有值则抛出异常：\n\n```\nString result\
  \ = optionalString.orElseThrow(IllegalStateException::new);\n\n   // 提供异常异常\n```\n\
  \n#### 8.7.2. 存在时消费值\n\n在前节中，你看到了如何在值不存在时产生替代方案。处理可选值的另一种策略是仅在值存在时消费它。\n\n`ifPresent`\
  \ 方法接受一个函数。如果可选值存在，就会被传递给该函数。否则，什么都不会发生。\n\n例如，如果你想在值存在时将其添加到集合中，调用：\n\n```\noptionalValue.ifPresent(v\
  \ -> results.add(v));\n```\n\n或者简单地：\n\n```\noptionalValue.ifPresent(results::add);\n\
  ```\n\n如果你想在 `Optional` 有值时执行一个操作，在没有时执行另一个操作，使用 `ifPresentOrElse`：\n\n```\noptionalValue.ifPresentOrElse(\n\
  \n   v -> System.out.println(\"Found \" + v),\n\n   () -> logger.warning(\"No match\"\
  ));\n```\n\n#### 8.7.3. Optional 值的管道化\n\n在之前的节中，你了解了如何从 `Optional` 对象中获取值。另一种有效的策略是保持\
  \ `Optional` 完整。你可以通过 `map` 方法转换 `Optional` 内部的值：\n\n```\nOptional<String> transformed\
  \ = optionalString.map(String::toUpperCase);\n```\n\n如果 `optionalString` 是空的，那么\
  \ `transformed` 也是空的。\n\n这是另一个例子。如果值存在，我们将结果添加到列表中：\n\n```\noptionalValue.map(results::add);\n\
  ```\n\n如果 `optionalValue` 为空，什么都不会发生。\n\n\n\n\n\n这个 `map` 方法相当于你在第 8.3 节中看到的 `Stream`\
  \ 接口的 `map` 方法。简单来说，将可选值想象为一个大小为零或一的流。结果的大小同样为零或一，在后一种情况下，该函数已被应用。\n\n同样地，你可以使用\
  \ `filter` 方法在转换之前或之后，仅考虑符合特定属性的 `Optional` 值。如果不符合该属性，流水线将产生一个空结果：\n\n```\nOptional<String>\
  \ transformed = optionalString\n   .filter(s -> s.length() >= 8)\n   .map(String::toUpperCase);\n\
  ```\n\n你可以使用 `or` 方法用一个备用的 `Optional` 替换空的 `Optional`。备用方案是惰性计算的。\n\n```\nOptional<String>\
  \ result = optionalString.or(() -> // 提供一个 Optional\n   alternatives.stream().findFirst());\n\
  ```\n\n如果 `optionalString` 有值，则 `result` 就是 `optionalString`。否则，将求值 lambda 表达式并使用其结果。\n\
  \n#### 8.7.4. 如何错误地使用 Optional 值\n\n如果你不正确使用 `Optional` 值，那么你并没有比过去的“某个值或 `null`”方法有任何优势。\n\
  \n`get` 方法在 `Optional` 值存在时获取其封装的元素，如果不存在则抛出 `NoSuchElementException`。因此，\n\n```\n\
  Optional<T> optionalValue = ...;\noptionalValue.get().someMethod()\n```\n\n这并不比下面安全：\n\
  \n```\nT value = ...;\nvalue.someMethod();\n```\n\n`isPresent` 和 `isEmpty` 方法报告\
  \ `Optional<T>` 对象是否有值。但是\n\n```\nif (optionalValue.isPresent()) optionalValue.get().someMethod();\n\
  ```\n\n这并不比下面更易于：\n\n```\nif (value != null) value.someMethod();\n```\n\n**提示**\n\
  如果你发现自己正在使用 `get` 方法，请重新考虑你的方法，并尝试前两个节中的策略之一。\n\n**注意**\n`orElseThrow` 是一个比 `get`\
  \ 方法听起来更吓人的的同义词。当你调用 `optionalValue.orElseThrow().someMethod()` 时，如果 `optionalValue`\
  \ 为空，将显式地明确会发生异常。希望程序员只有在绝对确定这种情况不会发生时才使用 `orElseThrow`。\n\n以下是关于妥善使用 `Optional`\
  \ 类型的更多提示：\n\n- `Optional` 类型的变量永远不应为 `null`。\n- 不要使用 `Optional` 类型的字段。代价是额外增加了一个对象。在类内部，使用\
  \ `null` 表示字段的缺失。为了阻碍使用 `Optional` 字段，该类没有设置为可序列化。\n- `Optional` 类型的方法参数是值得怀疑的。在请求的值存在的常见情况下，它们会使调用变得不愉快。相反，考虑该方法的两个重载版本，带参数和不带参数。（另一方面，返回一个\
  \ `Optional` 是好的。它是指示函数可能没有结果的正确方式。）\n- 不要将 `Optional` 对象放入集合（set）中，也不要将其作为 map\
  \ 的键。相反，收集值。\n\n#### 8.7.5. 创建 Optional 值\n\n到为止，我们讨论了如何使用他人创建的 `Optional` 对象。如果你想写一个创建\
  \ `Optional` 对象的方法，有几个静态方法用于此目的，包括 `Optional.of(result)` 和 `Optional.empty()`。例如，\n\
  \n```\npublic static Optional<Double> inverse(Double x) {\n    return x == 0 ? Optional.empty()\
  \ : Optional.of(1 / x);\n}\n```\n\n`ofNullable` 方法旨在作为从可能的 `null` 值到可选值的桥梁。如果 `obj`\
  \ 不是 `null`，则 `Optional.ofNullable(obj)` 返回 `Optional.of(obj)`，否则返回 `Optional.empty()`。\n\
  \n#### 8.7.6. 使用 `flatMap` 组合 Optional 值函数\n\n假设你有一个产生 `Optional<T>` 的方法 `f`，目标类型\
  \ `T` 有一个产生 `Optional<U>` 的方法 `g`。如果它们是普通方法，你可以通过调用 `s.f().g()` 将它们组合。但这种组合不起通，因为\
  \ `s.f()` 的类型是 `Optional<T>`，而不是 `T`。相反，调用\n\n```\nOptional<U> result = s.f().flatMap(T::g);\n\
  ```\n\n如果 `s.f()` 存在，则对它应用 `g`。否则，返回一个空的 `Optional<U>`。\n\n显然，如果你有更多产生 `Optional`\
  \ 值的方法或 lambda 表达式，你可以重复该过程。你只需通过链式调用 `flatMap` 来构建一个步骤流水线，该流水线只有在所有部分都成功时才会成功。\n\
  \n例如，考虑前一节中安全的 `inverse` 方法。假设我们还有一个安全的平方根方法：\n\n```\npublic static Optional<Double>\
  \ squareRoot(Double x) {\n    return x < 0 ? Optional.empty() : Optional.of(Math.sqrt(x));\n\
  }\n```\n\n然后你可以计算 `inverse` 的平方根：\n\n```\nOptional<Double> result = inverse(x).flatMap(Math::squareRoot);\n\
  ```\n\n或者，如果你喜欢，\n\n```\nOptional<Double> result = inverse(x).flatMap(Math::squareRoot);\n\
  ```\n\n**注意**\n在本节中，我们考虑的是拥有 `Optional` 值的幸运情况。如今许多方法在没有结果时返回 `null`。假设 `Users.classicLookup(id)`\
  \ 返回一个 `User` 对象或 `null`。那么你当然可以过滤掉这些 `null` 值：\n\n```\nStream<User> users = ids.map(Users::classicLookup)\n\
  \    .filter(Objects::nonNull);\n```\n\n但如果你偏好 `flatMap` 方法，可以使用\n\n\n\n```\nStream<User>\
  \ users = ids.flatMap(id -> Stream.ofNullable(Users.classicLookup(id)));\n```\n\n\
  或者\n\n```\nStream<User> users = ids.map(Users::classicLookup)\n    .flatMap(Stream::ofNullable);\n\
  ```\n\n调用 `Stream.ofNullable(obj)` 在 `obj` 为 `null` 时产生空流，否则产生仅包含 `obj` 的流。\n\n\
  #### 8.7.7. 将 Optional  Stream\n\n`stream` 方法将 `Optional<T>` 转换为零或一个元素的 `Stream<T>`。当你有一个\
  \ `Optional` 流时非常有用。\n\n### 8.8. 收集结果\n\n当你完成流的操作后，通常想要查看结果。你可以调用 `iterator` 方法，它产生一个旧式的迭代器，你可以用它访问元素。\n\
  \n或者，你可以调用 `forEach` 方法对每个元素应用函数：\n\n```\nstream.forEach(System.out::println);\n\
  ```\n\n在并行流上，`forEach` 方法以任意顺序遍历元素。如果你想按流顺序处理它们，请改用 `forEachOrdered`。当然，你可能会放弃部分或全部并行带来的优势。\n\
  \n但更多时候，你将将结果收集到数据结构中。你可以调用 `toArray` 并获取流元素的数组。\n\n\n\n\n\n由于无法在运行时创建泛型数组，表达式 `stream.toArray()`\
  \ 返回一个 `Object[]` 数组。如果你想获得正确类型的数组，请传入数组构造函数：\n\n```\nString[] result = stream.toArray(String[]::new);\n\
  \n// stream.toArray() 的类型为 Object[]\n```\n\n要将流元素收集到另一个目标，有一个方便的 `collect` 方法，它接收\
  \ `Collector` 接口的实例。`collector` 是一个累积元素并产生结果的对象。`Collectors` 类为常用的收集器提供了大量的工厂方法。要将流收集到集合中，只需调用：\n\
  \n```\nSet<String> result = stream.collect(Collectors.toSet());\n```\n\n如果你想控制获取哪种类型的集合，请使用以下调用：\n\
  \n```\nTreeSet<String> result = stream.collect(Collectors.toCollection(TreeSet::new));\n\
  ```\n\n假设你想通过拼接收集流中的所有的字符串。你可以调用：\n\n```\nString result = stream.collect(Collectors.joining());\n\
  ```\n\n如果你想在元素之间使用一个分隔符，请将其传递给 `joining` 方法：\n\n```\nString result = stream.collect(Collectors.joining(\"\
  , \"));\n```\n\n如果你的流中包含字符串以外的对象，你需要先将它们转换为字符串，如下：\n\n```\nString result = stream.map(Object::toString).collect(Collectors.joining(\"\
  , \"));\n```\n\n如果你想将流结果归约为和、计数、平均值、最大值或最小值，请使用 `summarizing`(`Int`|`Long`|`Double`）方法之一。这些方法接收一个将流对象映射为数字的函数，并返回类型为\
  \ (`Int`|`Long`|`Double`)``SummaryStatistics` 的结果，同时计算和、计数、平均值、最大值最小值。\n\n```\n\
  IntSummaryStatistics summary = stream.collect(\n\n    Collectors.summarizingInt(String::length));\n\
  \ndouble averageWordLength = summary.getAverage();\n\ndouble maxWordLength = summary.getMax();\n\
  ```\n\n### 8.9. 收集到 Map\n\n假设你有一个 `Stream<Person>` 并并将元素收集到 map 中，以便以后可以通过 ID 查找人员。`Collectors.toMap`\
  \ 方法有两个函数参数，用于生成 map 的键和值。例如：\n\n```\nMap<Integer, String> idToName = people.collect(\n\
  \n    Collectors.toMap(Person::getId, Person::getName));\n```\n\n在值应该是实际元素的常见情况下，请对第二个函数使用\
  \ `Function.identity()`。\n\n```\nMap<Integer, Person> idToPerson = people.collect(\n\
  \n    Collectors.toMap(Person::getId, Function.identity()));\n```\n\n如果存在多个相同键的元素，则会发生冲突，收集器将抛出\
  \ `IllegalStateException`。你可以通过提供第三个函数参数来覆盖该行为，该参数解决冲突并根据现有值和新值确定该键的值。你的函数可以返回现有值、新值或两者的组合。\n\
  \n在这里，我们构建了一个 map，对于可用区域（locales）中的每种语言，键是其在默认区域的名称（例如 `\"German\"`），值是其本地化后的名称（例如\
  \ `\"Deutsch\"`）。\n\n```\nStream<Locale> locales = Stream.of(Locale.getAvailableLocales());\n\
  \nMap<String, String> languageNames = locales.collect(\n\n    Collectors.toMap(\n\
  \n    Locale::getDisplayLanguage,\n\n    loc -> loc.getDisplayLanguage(loc),\n\n\
  \    (existingValue, newValue) -> existingValue));\n```\n\n我们并不在乎相同语言可能出现两次（例如，在德国和瑞士的德语），所以我们只保留第一个条目。\n\
  \n### 注意\n\n在本章中，我使用 `Locale` 类作为有趣数据集的来源。有关处理区域的更多信息，请参见第 13 章。\n\n现在假设我们想知道某个国家的所有语言。我们需要一个\
  \ `Map<String, Set<String>>`。例如，`\"Switzerland\"` 的值集合 `[French, German, Italian]`。最初，我们为每种语言存储一个单元素集合。每当为某个国家发现新语言时，形成现有集合和新集合的并集。\n\
  \n```\nMap<String, Set<String>> countryLanguageSets = locales.collect(\n\n    Collectors.toMap(\n\
  \n    Locale::getDisplayCountry,\n\n         l -> Collections.singleton(l.getDisplayLanguage()),\n\
  \n         (a, b) -> { // a 和 b 的并集\n\n             var union = new HashSet<String>(a);\n\
  \n             union.addAll(b);\n\n             return union; }));\n```\n\n你将在下一节看到获取此\
  \ map 的更简单的方法。\n\n如果你想要 `TreeMap`，请将构造函数作为第四个参数。你必须提供一个合并函数。这里是节开头的示例之一，现在产生 `TreeMap`：\n\
  \n```\nMap<Integer, Person> idToPerson = people.collect(\n\n    Collectors.toMap(\n\
  \        Person::getId,\n        Function.identity(),\n        (existingValue, newValue)\
  \ -> { throw new IllegalStateException(); },\n\n        TreeMap::new));\n```\n\n\
  ### 注意\n\n对于每个 `toMap` 方法，都有一个相应的 `toConcurrentMap` 方法，它产生一个并发 map。在并行收集过程中使用单个并发\
  \ map。当与并行流一起使用，共享 map 比合并更高效。\n\n### 8.10. 分组与分区\n\n在前面的节中，你了解了如何收集某个国家的语言。但该过程有点繁琐。你需要为每个\
  \ map 生成单元素集合，然后指定如何合并。对相同特征的值进行分组非常常见，`groupingBy` 方法直接支持它。\n\n```\nMap<String,\
  \ List<Locale>> countryToLocales = locales.collect(\n\n    Collectors.groupingBy(Locale::getCountry));\n\
  ```\n\n注意\n函数 `Locale::getCountry` 是分组的*分类函数*。你现在可以查找某个国家的所有区域，例如\n\n```\nList<Locale>\
  \ swissLocales = countryToLocales.get(\"CH\");\n\n    // 产生 [it_CH, de_CH, fr_CH]\n\
  ```\n\n注意\n在这种情况下，使用 `partitioningBy` 更高效。例如，这里我们将所有区域分为使用英语的区域和其他区域：\n\n```\nMap<Boolean,\
  \ List<Locale>> englishAndOtherLocales = locales.collect(\n\n    Collectors.partitioningBy(l\
  \ -> l.getLanguage().equals(\"en\")));\n\nList<Locale> englishLocales = englishAndOtherLocales.get(true);\n\
  ```\n\n### 8.11. 下游收集器\n\n`groupingBy` 方法产生一个值为列表的 map。如果你想以某种方式处理这些列表，请提供一个*下游收集器*。例如，如果你想要集合而不是列表，可以使用前面节见过的\
  \ `Collectors.toSet` 收集器：\n\n```\nMap<String, Set<Locale>> countryToLocaleSet =\
  \ locales.collect(\n\n    groupingBy(Locale::getCountry, toSet()));\n```\n\n\n\n\
  \n在本示例中，以及本节剩余的示例中，我假设已静态导入 `java.util.stream.Collectors.*` 以使表达式更易读。\n\n提供了几个收集器可以将分组后的元素归类为数字：\n\
  \n![Images](img/sq.jpg) `counting` 产生收集元素的计数。例如，\n\n```\nMap<String, Long> countryToLocaleCounts\
  \ = locales.collect(\n\n    groupingBy(Locale::getCountry, counting()));\n```\n\n\
  统计每个国家有多少个区域（locale）。\n\n![Images](img/sq.jpg) `summing(`Int`|`Long`|`Double`)`\
  \ 接收一个函数参数，将该函数应用于下游元素，并产生它们的和。例如，\n\n```\nMap<String, Integer> stateToCityPopulation\
  \ = cities.collect(\n\n    groupingBy(City::getState, summingInt(City::getPopulation)));\n\
  ```\n\n计算城市流中每个州的人口总和。\n\n![Images](img/sq.jpg) `maxBy` 和 `minBy` 接收一个比较器并产生下游元素的最大值和最小值。例如，\n\
  \n```java\nMap<String, Optional<City>> stateToLargestCity = cities.collect(\n\n\
  \    groupingBy(City::getState,\n\n        maxBy(Comparator.comparing(City::getPopulation))));\n\
  ```\n\n产生每个州最大的城市。\n\n`mapping` 收集器对下游结果应用一个函数，它还需要需要另一个收集器来处理其结果。例如，\n\n```\nMap<String,\
  \ Optional<String>> stateToLongestCityName = cities.collect(\n\n    groupingBy(City::getState,\n\
  \n        mapping(City::getName,\n\n            maxBy(Comparator.comparing(String::length)))));\n\
  ```\n\n在这里，我们按州对城市进行分组。在每个州内部，我们产生城市名称并按最大长度归约。\n\n`mapping` 方法还为前一节中的问题提供了一个更好的解决方案——收集一个国家所有语言的集合。\n\
  \n```\nMap<String, Set<String>> countryToLanguages = locales.collect(\n\n    groupingBy(Locale::getDisplayCountry,\n\
  \n        mapping(Locale::getDisplayLanguage,\n\n            toSet())));\n```\n\n\
  还有一个 `flatMapping` 方法，用于返回流的函数（参见练习 8）。\n\n在前一节中，我使用了 `toMap`get 替 `groupingBy`。在这种形式下，你不需要担心合并单个集合。\n\
  \n如果分组或映射函数的返回类型为 `int`、`long` 或 `double`，你可以将元素收集到摘要统计对象中，如第 8.8 节所述。例如，\n\n```\n\
  Map<String, IntSummaryStatistics> stateToCityPopulationSummary = cities.collect(\n\
  \n    groupingBy(City::getState,\n\n        summarizingInt(City::getPopulation)));\n\
  ```\n\n然后你可以从每个组的摘要统计对象获取函数值的和、计数、平均值、最小值和最大值。\n\n`filtering` 收集器对每个组应用过滤器，例如：\n\
  \n```\nMap<String, Set<City>> largeCitiesByState\n\n    = cities.collect(\n\n  \
  \      groupingBy(City::getState,\n\n            filtering(c -> c.getPopulation()\
  \ > 500000,\n\n                toSet())); // 没有大城市的州为空集合\n```\n\n最后，你可以使用 `teeing`\
  \ 收集器分支到两个并行的下游收集。当你需要从一个流中计算多个结果时，这非常有用。假设你想收集城市名称并同时计算它们的平均人口。你不能读取两次流，但 `teeing`\
  \ 允许执行两次计算。指定两个下游收集器和一个合并结果的函数。\n\n```\nrecord Pair<S, T>(S first, T second) {}\n\
  \nPair<List<String>, Double> result = cities.filter(c -> c.state().equals(\"NV\"\
  ))\n\n    .collect(teeing(\n\n       mapping(City::name, toList()), // 第一个下游收集器\n\
  \n       averagingDouble(City::population), // 第二个下游收集器\n\n       (list, avg) ->\
  \ new Pair(list,  avg))); // 合并函数\n```\n\n### 注意\n\n还有三个版本的 `reducing` 方法用于应用通用的归约，如下一节所述。\n\
  \n组合收集器是强大的，但它可能导致非常复杂的表达式。最好的用法是结合 `groupingBy` 或 `partitioningBy` 来处理“下游” map\
  \ 的值。否则，请直接在流上应用 `map`、`reduce`、`count`、`max` 或 `min` 等方法。\n\n### 8.12 归约操作\n\n\
  `reduce` 方法是从流中计算值的通用机制。最简单的形式接收一个二元函数并从前两个元素开始不断应用它。如果函数是和，那么这很好很好解释：\n\n```\n\
  List<Integer> values = ...;\n\nOptional<Integer> sum = values.stream().reduce((x,\
  \ y) -> x + y);\n```\n\n在这种情况下，`reduce` 方法计算 `v[0]` + `v[1]` + `v[2]` + ..., 其中\
  \ `v[i]` 是流元素。该方法返回一个 `Optional`，因为如果流为空，就没有有效的结果。\n\n### 注意\n\n在这种情况下，你可以使用 `reduce(Integer::sum)`\
  \ 代替 `reduce((x, y) -> x + y)`。\n\n更通地说，你可以使用任何将部分结果 `x` 与下一个值 `y` 结合的操作。\n\n\n\n\
  \n\n有些时候 `reduce` 并不足够通用。例如，假设你想将结果收集到一个 `BitSet` 中。如果该集合操作是并行的，你无法直接将元素放入单个 `BitSet`\
  \ 中，因为 `BitSet` 对象不是线程安全的。由于这个原因，你无法使用 `reduce`。每个分段都需要从一个属于自己的空集合开始，而 `reduce`\
  \ 只允许你提供一个恒等值（identity value）。相反，请使用 `collect`。它接受三个参数：\n\n1. 一个 `supplier`（供给者），用于创建目标对象的新实例，例如哈集合的构造函数\n\
  2. 一个 `accumulator`（累加器），将元素添加到目标中，例如 `add` 方法\n3. 一个 `combiner`（合并器），将两个对象合并为一个对象，例如\
  \ `addAll`\n\n以下是 `collect` 方法对位集操作的工作方式：\n\n```\nBitSet result = stream.collect(BitSet::new,\
  \ BitSet::set, BitSet::or);\n```\n\n### 8.13. 基本类型流\n\n到目前为止，我们一直都在 `Stream<Integer>`\
  \ 中收集整数，尽管将每个整数封装成一个包装对象显然是低效的。对于其他基本类型 `double`、`float`、`long`、`short`、`char`、`byte`\
  \ 和 `boolean` 也是如此。流库提供了专门的类型 `IntStream`、`LongStream` 和 `DoubleStream`，它们直接存储基本值，而不使用包装类。如果你想存储\
  \ `short`、`char`、`byte` 和 `boolean`，请使用 `IntStream`；对于 `float`，使用 `DoubleStream`。\n\
  \n要创建一个 `IntStream`，调用 `IntStream.of` 和 `Arrays.stream` 方法：\n\n```\nIntStream stream\
  \ = IntStream.of(1, 1, 2, 3, 5);\n\nstream = Arrays.stream(values, from, to); //\
  \ values 是一个 int[] \n```\n\n同样可以使用静态方法 `generate` 和 `iterate`。此外，`IntStream` 和 `LongStream`\
  \ 具有静态方法 `range` 和 `rangeClosed`，它们可以生成步长为一的整数范围：\n\n```\nIntStream zeroToNinetyNine\
  \ = IntStream.range(0, 100); // 排除上限\n\nIntStream zeroToHundred = IntStream.rangeClosed(0,\
  \ 100); // 包含上限\n```\n\n`CharSequence` 接口拥有 `codePoints` 和 `chars` 方法，它们可以产生产生字符的\
  \ Unicode 码或 UTF-16 编码中代码单元的 `IntStream`。（细节请参阅 第 1 章。）\n\n```\nString sentence\
  \ = \"\\uD835\\uDD46 is the set of octonions.\";\n\n     // \\uD835\\uDD46 是字母 \U0001D546\
  \ 的 UTF-16 编码，unicode U+1D546\n```\n\n```\nIntStream codes = sentence.codePoints();\n\
  \n     // 带有进制值为 1D546 20 69 73 20 ... 的流\n```\n\n`RandomGenerator` 接口拥有 `ints`、`longs`\
  \ 和 `doubles` 方法，它们返回随机数的基本类型流。\n\n```\nIntStream randomIntegers = RandomGenerator.getDefault().ints()\n\
  ```\n\n当你有一个对象流时，可以使用 `mapToInt`、`mapToLong` 或 `mapToDouble` 方法将其转换为基本类型流。例如，如果你有一个字符串流并想以整数形式处理它们的长度，你完全可以在\
  \ `IntStream` 中进行：\n\n```\nStream<String> words = ...;\n\nIntStream lengths = words.mapToInt(String::length);\n\
  ```\n\n要将基本类型流转换为对象流，请使用 `boxed` 方法：\n\n```\nStream<Integer> integers = IntStream.range(0,\
  \ 100).boxed();\n```\n\n通常情况下，基本类型流上的方法与对象流上的方法是类似的。以下是最显著的区别：\n\n- ![Images](img/sq.jpg)\
  \ `toArray` 方法返回基本类型数组。\n- ![Images](img/sq.jpg) 产生可选结果的方法返回 `OptionalInt`、`OptionalLong`\
  \ 或 `OptionalDouble`。这些类与 `Optional` 类类似，但它们拥有 `getAsInt`、`getAsLong` 和 `getAsDouble`\
  \ 方法，而不是 `get` 方法。\n\n- ![Images](img/sq.jpg) 存在 `sum`、`average`、`max` 和 `min` 方法，分别返回总和、平均值、最大值和最小值。这些方法在对象流上并没有定义。\n\
  \n- ![Images](img/sq.jpg) `summaryStatistics` 方法产生一个 `IntSummaryStatistics`、`LongSummaryStatistics`\
  \ 或 `DoubleSummaryStatistics` 类型的对象，可以同时报告流的总和、计数、平均值、最大值和最小值。\n\n### 8.14. 并行流\n\
  \n流使得批量操作并行化变得简单。过程大部分是自动的，你需要遵循一些规则。首先，你必须有一个并行流。你可以通过任何集合的 `Collection.parallelStream()`\
  \ 方法获取并行流：\n\n```\nStream<String> parallelWords = words.parallelStream();\n```\n\
  \n此外，`parallel` 方法可以将任何顺序流转换为并行流。\n\n```\nStream<String> parallelWords = Stream.of(wordArray).parallel();\n\
  ```\n\n只要在终端方法执行时流处于并行模式，所有的中间流操作都将并行化。\n\n当流操作以并行方式运行时，其意图是并行的。为了确保结果的正确性，流操作必须是无状态的（stateless）且无副作用的（side-effect\
  \ free）。如果流操作依赖于状态，结果可能会变得不可预测。\n\n当流操作以并行方式运行时，其意图是并行的。为了确保结果的正确性，流操作必须是无状态的（stateless）且无副作用的（side-effect\
  \ free）。如果流操作依赖于状态，结果可能会变得不可预测。\n\n当流操作以并行方式运行时，其意图是并行的。为了确保结果的正确性，流操作必须是无状态的（stateless）且无副作用的（side-effect\
  \ free）。如果流操作依赖于状态，结果可能会变得不可预测。\n\n当流操作以并行方式运行时，其意图是并行的。为了并行化，操作可以按任意顺序执行。\n\n这里有一个你无法执行的示例。假设你想统计字符串流中的所有短单词：\n\
  \n```\nvar shortWords = new int[12];\n\nwords.parallelStream().forEach(\n\n    s\
  \ -> { if (s.length() < 12) shortWords[s.length]++; });\n\n         // 错误——竞态条件！\n\
  \nSystem.out.println(Arrays.toString(shortWords));\n```\n\n这是糟糕的代码。传递给 `forEach`\
  \ 的函数在多个线程中并发运行，每个线程都在更新一个共享数组。正如你在第 10 章 中看到的，那是经典的*竞态条件*。如果你多次运行此程序，可能会得到不同的计数。\n\
  \n为了并行化，你有责任确保传递给并行流操作的函数是安全的。做到这一点的最佳方法是远离可变状态。在这个示例中，如果你按长度对分组并计数，可以安全地并行化：\n\n\
  ```\nMap<Integer, Long> shortWordCounts\n\n    = words.parallelStream()\n      \
  \  .filter(s -> s.length() < 12)\n        .collect(groupingBy(\n\n            String::length,\n\
  \n            counting()));\n```\n\n\n\n\n\n```java\nMap<Integer, List<String>>\
  \ result = words.parallelStream().collect(\n\n    Collectors.groupingByConcurrent(String::length));\n\
  \n    // 值并不是按流的顺序收集的\n```\n\n当然，如果你使用与顺序无关的下游收集器，例如，你就不在乎：\n\n```java\nMap<Integer,\
  \ Long> wordCounts\n\n    = words.parallelStream()\n\n    .collect(\n        groupingByConcurrent(\n\
  \            String::length,\n            counting()));\n```\n\n不要为了加速操作就将你所有的流都转换为并行流（parallel\
  \ streams）。请记住这些问题：\n\n![Images](img/sq.jpg) 并行化的开销很大，只有在处理非常大的数据集时才有意义。\n\n![Images](img/sq.jpg)\
  \ 只有当底层数据源能够被有效地拆分成多个部分时，并行化流才是划算的。\n\n![Images](img/sq.jpg) 并行流使用的线程池可能会因为文件 I/O\
  \ 或网络访问等阻塞操作而导致饥饿。\n\n并行流在处理巨大的内存数据集合和计算密集型处理时效果最好。\n\n### 提示\n通常情况下，并行化文件输入没有收益。然而，`Files.lines`\
  \ 方法返回的流使用了内存映射文件，拆分是有效的。如果你处理一个大文件的行，并行化流可能会提高性能。\n\n### 注意\n如果你在并行流中需要随机数，请从 `RandomGenerator.SplittableGenerator.of`\
  \ 工厂方法获取一个生成器。\n\n### 注意\n默认情况下，并行流使用由 `ForkJoinPool.commonPool` 返回的全局 fork-join\
  \ 池。如果你的操作没有阻塞且没有与其他任务共享该池，那就是没问题的。有一个替换不同池的技巧。将你的操作放在自定义池的 `submit` 方法中：\n\n```java\n\
  ForkJoinPool customPool = . . .;\n\nresult = customPool.submit(() ->\n\n   stream.parallel().map(.\
  \ . .).collect(. . .)).get();\n```\n\n或者，异步地：\n\n```java\nCompletableFuture.supplyAsync(()\
  \ ->\n\n   stream.parallel().map(. . .).collect(. . .),\n\n   customPool).thenAccept(result\
  \ -> . . .);\n```\n\n### 练习\n1. 验证请求前五个长单词在找到第五个长单词后是否不再调用 `filter` 方法。只需记录每次方法调用即可。\n\
  2. 测量使用 `parallelStream` 而不是 `stream` 统计长单词的差异。在调用前后分别调用 `System.currentTimeMillis`\
  \ 并打印差异。如果你有一台快速的电脑，请切换到更大的文档（如*战争与和平*）。\n3. 假设你有一个数组 `int[] values = { 1, 4, 9,\
  \ 16 }`。`Stream.of(values)` 是什么？如何获取一个 `int` 的流呢？\n4. 使用 `Stream.iterate` 创建一个无限随机数流——不是通过调用\
  \ `Math.random`，而是通过直接实现一个*线性生成器*。在这样的生成器中，你从 `x[0]` = `seed` 开始，然后产生 `x[n]` + 1\
  \ = (*a x[n]* + *c*) `%` *m*，其中 `a`、`c` 和 `m` 是适当的值。你应该实现一个参数为 `a`、`c`、`m` 和 `seed`\
  \ 的方法，返回一个 `Stream<Long>`。尝试 `a` = 25214903917，`c` = 11 和 `m` = 248。\n5. 第 8.3 节\
  \ 中的 `codePoints` 方法有点笨拙，先填充一个列表然后将其转换为流。改写一个基于流的版本，使用 `IntStream.iterate` 方法构造一个有限的偏移量流，然后提取子字符串。\n\
  6. 使用 `String.codePoints` 方法实现一个方法，测试字符串是否为仅由字母组成的单词。（提示：`Character.isAlphabetic`。）使用相同的方法，实现一个测试字符串是否为合法的\
  \ Java 标识符的方法。\n7. 将文件转换为标记标记流，列出前 100 个符合上一个练习意义的单词标记。再次读取文件并列出出现频率最高的 10 个单词，忽略大小写。\n\
  8. 为 `Collectors.flatMapping` 方法寻找一个实际用途。考虑某个具有返回 `Optional` 的方法的类。然后根据某些特征进行分组，对于每个组，使用\
  \ `flatMapping` 和 `Optional.stream` 收集非空的可选值。\n9. 你可以将流的视为一种“拉”机制，值在需要时被懒性地拉取。相反是“推”机制，它在值可用时积极产生值并将其传递给消费者。示例有\
  \ `Iterable.forEach` 和 `Iterator.forEachRemaining` 方法。这些是带有参数 `Consumer<? super\
  \ T>` 的方法。编写一个静态方法，从此类方法产生流。例如，\n\n```java\nIterator<String> iter = ...;\n\nStream<String>\
  \ stream = fromPusher(iter::forEachRemaining);\n```\n该方法的签名格为\n```java\npublic static\
  \ <T> Stream<T> fromPusher(Consumer<Consumer<? super T>> pusher)\n```\n提示：在伪的 `Stream.of((T)\
  \ null)` 上使用 `mapMulti`。\n10. 从 `/usr/share/dict/words`（或类似的单词列表）读取单词到流中，并产生一个包含所有单词的数组。\n\
  11. 给出一个字符串流，找出所有包含元元的字符串。\n12. 给出一个有限的字符串流，找到最大长度。\n13. 你的经理要求写一个 `public static\
  \ boolean isFinite(Stream<T>)`。为什么这不是个好主意？\n14. 写一个 `public static <T> Stream<T>\
  \ zip(Stream<T> first, Stream<T> second)`，交替来自 `first` 和 `second` 的元素。\n15. 使用 `ArrayList<T>`\
  \ 连接所有元素。\n16. 使用 `reduce` 的三种形式来计算平均值。\n17. 使用并行流找到*战争与和平*中 500 个 50 位数字的素数，使用\
  \ `BigInteger.ProbablePrime` 方法。\n18. 如何从流中消除相邻元素？\n19. 你的方法如果流是并行的会工作吗？\n\n## 9\
  \ 输入与输出\n\n在本章中，你将学习如何处理文件、目录和网页，以及如何以二进制和文本格式读写数据。你还会发现关于正则表达式的讨论，这对于处理输入很有帮助。（我找不到一个更好的地方来处理这个话题，显然\
  \ Java 开发者也是如此——当正则表达式 API 被提出时，它是附加在新的 I/O 请求上的。）最后，本章将展示如何像存储文本或数字一样存储对象。\n\n\
  本章的要点是：\n\n1. `InputStream` 是字节源，`OutputStream` 是字节目的地。\n2. `Reader` 读取字符，`Writer`\
  \ 写入字符。务必指定字符编码。\n3. `Files` 类提供了方便的方法来读取文件的所有字节或所有行。\n4. `DataInput` 和 `DataOutput`\
  \ 接口具有以二进制格式写入数字的方法。\n5. 使用 `RandomAccessFile` 或内存映射文件进行随机访问。\n6. `Path` 是文件系统中绝对或相对路径组件的序列。路径可以组合（或“解析”）。\n\
  7. 使用 `Files` 类的方法来复制、移动或删除文件，并递归遍历目录树。\n8. 使用 ZIP 文件系统读取或更新 ZIP 文件。\n9. 你可以使用 `URL`\
  \ 类读取网页内容。要读取元数据或写入数据，请使用 `URLConnection` 类。\n\n\n\n\n\n10. 通过 `Pattern` 和 `Matcher`\
  \ 类，你可以在字符串中找到正则表达式的所有匹配项，以及每个匹配项的捕获组。\n\n11. 序列化机制可以保存和恢复任何实现了 `Serializable` 接口的对象，前提是该对象的实例变量也是可序列化的。\n\
  \n## 9.1 输入/输出流、读取器和写入器\n\n在 Java API 中，可以读取字节的源被称为 `input stream`（输入流）。这些字节可以来自文件、网络连接或内存中的数组。（这些流与第\
  \ 8 章中的流无关）。同样，字节的目的地是 `output stream`（输出流）。相比之下，`readers`（读取器）和`writers`（写入器）消耗并产生`characters`序列。在接下来的章节中，你将学习如何读写字节和字符。\n\
  \n### 9.1.1 获取流\n\n从文件获取流简单的方法是使用静态方法\n\n```\nInputStream in = Files.newInputStream(path);\n\
  \nOutputStream out = Files.newOutputStream(path);\n```\n\n在这里，`path` 是 `Path` 类的实例，该类将在第\
  \ 9.2.1 节介绍。\n\n如果你有一个 URL，可以从 `URL` 类 `openStream` 方法返回的输入流读取其内容：\n\n```\nvar url\
  \ = new URL(\"https://horstmann.com/index.html\");\n\nInputStream in = url.openStream();\n\
  ```\n\n第 9.3 节将如何向 Web 服务器发送数据。\n\n`ByteArrayInputStream` 类允许你从字节数组中读取。\n\n```\n\
  byte[] bytes = ...;\n\nvar in = new ByteArrayInputStream(bytes);\n```\n\n*从 in 读取*\n\
  \n反之，要向字节数组发送输出，请使用 `ByteArrayOutputStream`：\n\n```\nvar out = new ByteArrayOutputStream();\n\
  \n写入到 out\n\nbyte[] bytes = out.toByteArray();\n```\n\n### 9.1.2 读取字节\n\n`InputStream`\
  \ 类有一个方法可以读取单个字节：\n\n```\nInputStream in = ...;\n\nint b = in.read();\n```\n\n该方法要么返回\
  \ `0` 到 `255` 之间的整数字节，要么在到达输入末端时返回 `-1`。\n\n注意\n\nJava `byte` 类型的值范围在 `-128` 到 `127`\
  \ 之间。你可以在检查返回值不为 `-1` *之后* 将其转换为 `byte`。\n\n更常见的情况下，你可能希望批量读取字节。最方便的方法是 `readAllBytes`\
  \ 方法，它简单地从流中读取所有字节到字节数组中：\n\n```\nbyte[] bytes = in.readAllBytes();\n```\n\n提示\n\
  \n如果你想从文件中读取所有字节，请调用便利方法\n\n```\nbyte[] bytes = Files.readAllBytes(path);\n```\n\
  \n如果你想读取某些字节而不是所有字节，请提供一个字节数组并调用 `readNBytes` 方法：\n\n```\nvar bytes = new byte[len];\n\
  \nint bytesRead = in.readNBytes(bytes, offset, n);\n```\n\n该方法会一直读取到读取 `n` 个字节或没有更多输入为止，并返回实际读取的字节数。如果没有可用输入，这些方法将返回\
  \ `-1`。\n\n注意\n\n还有一个 `read(byte[], int, int)` 方法，其描述看起来与 `readNBytes` 完全相同。区别在于\
  \ `read` 方法只尝试读取字节，如果失败则会立即返回一个较小的计数。`readNBytes` 方法会持续调用 `read` 直到获取了所有请求的字节或 `read`\
  \ 返回 `-1`。\n\n最后，你可以跳过字节：\n\n```\nlong bytesToSkip = ...;\n\nin.skipNBytes(bytesToSkip);\n\
  ```\n\n### 9.1.3 写入字节\n\n`OutputStream` 的 `write` 方法可以写入单个字节和字节数组。\n\n```\nOutputStream\
  \ out = ...;\n\nint b = ...;\n\nout.write(b);\n\nbyte[] bytes = ...;\n\nout.write(bytes);\n\
  \nout.write(bytes, start, length);\n```\n\n当你完成流的写入后，必须*关闭*它以提交任何缓冲输出。最佳做法是使用 try-with-resources\
  \ 语句：\n\n```java\ntry (OutputStream out = ...) {\n    out.write(bytes);\n}\n```\n\
  \n如果你需要将输入流复制到输出流，请使用 `InputStream.transferTo` 方法：\n\n```java\ntry (InputStream\
  \ in = ...; OutputStream out = ...) {\n    in.transferTo(out);\n}\n```\n\n在调用 `transferTo`\
  \ 后，两个流都需要关闭。最好使用 try-with-resources 语句，如代码示例所示。\n\n要将文件写入 `OutputStream`，请调用\n\n\
  ```\nFiles.copy(path, out);\n```\n\n反之，要将 `InputStream` 保存到文件，请调用\n\n```\nFiles.copy(in,\
  \ path, StandardCopyOption.REPLACE_EXISTING);\n```\n\n### 9.1.4 字符编码\n\n输入流和输出流用于字节序列，但在许多情况下，你将处理文本——即字符序列。这时，字符如何编码为字节就变得重要了。\n\
  \nJava 使用 Unicode 标准来处理字符。每个字符或“代码点”都有一个 21 位的整数。有不同的 `character encodings`（字符编码）——即将这些\
  \ 21 位数字封装成字节的方法。\n\n最常见的编码是 UTF-8，它将每个 Unicode 代码点编码为一个到四个字节的序列（参见表 9.1）。UTF-8\
  \ 的优势在于，传统 ASCII 字符集（包含所有英语使用的字符）的字符只占用一个字节。\n\n表 9.1：UTF-8 编码\n\n![images](img/09tab01.jpg)\n\
  \n另一种常见的编码是 UTF-16，它将每个 Unicode 代码点编码为一个或两个 16 的值的值（参见表 9.2）。这是 Java 字符串中使用的编码。实际上，UTF-16\
  \ 有两种形式，称为“大端”和“小端”。考虑 16 位值 `0x2122`。在大端格式下，高位字节在前：`0x21` 随后是 `0x22`。在小端格式下，情况相反：`0x22\
  \ 0x21`。为了指示使用了两者中的哪一种，文件可以以“字节序标记”开头，即 16 位数值 `0xFEFF`。读取器可以使用此值确定字节序并丢弃它。\n\n\
  表 9.2：UTF-16 编码\n\n![images](img/09tab02.jpg)\n\n注意\n\n某些程序（包括记事本）会在 UTF-8 编码文件的开头添加字节序标记。显然，由于\
  \ UTF-8 没有字节序问题，这并非必要。但 Unicode 标准允许这样做，甚至建议这是一个很不错的主意，因为它减少了对编码的疑虑。它在读取 UTF-8 编码文件时本应该被移除。遗憾的是，Java\
  \ 并没有这样做，针对此问题的错误报告已被关闭为“不修复”。最好的办法是过滤掉输入中发现的任何领先 `\\uFEFF`。\n\n除了 UTF 编码外，还有覆盖特定用户群字符范围的局部编码。例如，ISO\
  \ 8859-1 是一种包含西欧语言使用的带音字符的单字节编码。Shift_JIS 是日语字符的变长编码。许多此类编码仍被广泛使用。\n\n没有可靠的方法从字节流中自动检测字符编码。某些\
  \ API 方法允许你使用“默认字符集”——即计算机操作系统偏好的字符编码。这与你的字节源使用的编码相同吗？这些字节可能源自世界的不同部分。因此，你应该始终显式指定编码。例如，在读取\
  \ 页面时，检查 `Content-Type` 头部。\n\n注意\n\n平台编码由静态方法 `Charset.defaultCharset()` 返回。静态方法\
  \ `Charset.availableCharsets()` 返回所有可用的 `Charset` 实例，这是一个从规范名称到 `Charset` 对象的映射。\n\
  \n注意\n\nOracle 的实现有一个系统属性 `file.encoding` 用于覆盖平台默认值。这不是一个官方支持的属性，且 Oracle Java 库实现的所有部分并未一致遵循它。你不应该设置它。\n\
  \n`StandardCharsets` 类拥有 `Charset` 类型的静态变量，对应每个 Java 虚拟机必须支持的字符编码：\n\n\n\n\n\n```\n\
  StandardCharsets.UTF_8\nStandardCharsets.UTF_16\nStandardCharsets.UTF_16BE\nStandardCharsets.UTF_16LE\n\
  StandardCharsets.ISO_8859_1\nStandardCharsets.US_ASCII\n```\n\n要获取另一种编码的 `Charset`，请使用静态方法\
  \ `forName`：\n\n```\nCharset shiftJIS = Charset.forName(\"Shift_JIS\");\n```\n\n\
  在读取或写入文本时，使用 `Charset` 对象。例如，你可以将字节数组转换为字符串：\n\n```\nvar contents = new String(bytes,\
  \ StandardCharsets.UTF_8);\n```\n\n### 提示\n某些方法允许你通过 `Charset` 对象或字符串来指定字符编码。请选择\
  \ `StandardCharsets` 常量，这样你就不必担心拼写是否正确了。例如，`new String(bytes, \"UTF 8\")` 是不可接受的，并且会导致运行时错误。\n\
  \n### 警告\n某些方法（如 `String(byte[])` 构造函数）如果你不指定任何编码，将使用默认的平台编码；其他方法（如 `Files.readAllLines`）则使用\
  \ UTF-8。\n\n### 9.1.5 文本输入\n要读取文本输入，使用 `Reader`。你可以通过 `InputStreamReader` 适配器从任何输入流获取\
  \ `Reader`：\n\n```\nInputStream inStream = ...;\n\nvar in = new InputStreamReader(inStream,\
  \ charset);\n```\n\n如果你想一次处理一个 UTF-16 代码单元的输入，可以调用 `read` 方法：\n\n```\nint ch = in.read();\n\
  ```\n\n该方法返回一个 `0` 到 `65536` 之间的代码单元，或者在输入结束时返回 `-1`。\n\n这并不方便。这里有几种替代方案。\n\n对于短文本文件，你可以这样将其读取为字符串：\n\
  \n```\nString content = Files.readString(path, charset);\n```\n\n但如果你想将文件作为行序列处理，请调用\n\
  \n```\nList<String> lines = Files.readAllLines(path, charset);\n```\n\n如果文件很大，请作为\
  \ `Stream<String>` 对其进行惰性处理：\n\n```\ntry (Stream<String> lines = Files.lines(path,\
  \ charset)) {\n    ...\n}\n```\n\n### 注意\n如果在流获取行时发生 `IOException`，该异常将被封装进 `UncheckedIOException`\
  \ 并从流操作中抛出。（这种手段是必要的，因为流操作没有声明抛出任何检查异常。）\n\n要从文件中读取数字或单词，请使用 `Scanner`，如你在第 1 章中所示。例如，\n\
  \n```\nvar in = new Scanner(path, StandardCharsets.UTF_8);\n\nwhile (in.hasNextDouble())\
  \ {\n    double value = in.nextDouble();\n    ...\n}\n```\n\n### 提示\n要读取字母单词，请将扫描器的分隔符设置为正则表达式，该正则是你想要接受的标记的补集。例如，在调用\n\
  \n```\nin.useDelimiter(\"\\\\PL+\");\n```\n\n之后，扫描器将读取字母，因为因为任何非字母序列都是分隔符。正则表达式语法请参阅第\
  \ 9.4.1 节。\n\n然后，你可以通过如下方式获取所有单词的流：\n\n```java\nStream<String> words = in.tokens();\n\
  ```\n\n如果你的输入不是来自文件，请将 `InputStream` 封装为 `BufferedReader`：\n\n```\ntry (var reader\
  \ = new BufferedReader(new InputStreamReader(url.openStream()))) {\n    Stream<String>\
  \ lines = reader.lines();\n    ...\n}\n```\n\n`BufferedReader` 为了效率会分块读取输入。（奇怪的是，基础读取器没有这个选项。）它有\
  \ `readLine` 方法读取单行，以及 `lines` 方法产生一个行流。\n\n如果某个方法要求一个 `Reader` 而你想让它从文件读取，请调用 `Files.newBufferedReader(path,\
  \ charset)`。\n\n### 9.1.6 文本输出\n要写入文本，使用 `Writer`。通过 `write` 方法，你可以写入字符串。你可以将任何输出流转换为\
  \ `Writer`：\n\n```\nOutputStream outStream = ...;\n\nvar out = new OutputStreamWriter(outStream,\
  \ charset);\n\nout.write(str);\n```\n\n要获取文件的写入器，请使用\n\n```\nWriter out = Files.newBufferedWriter(path,\
  \ charset);\n```\n\n### PrintWriter\n使用 `PrintWriter` 会更方便，它包含了 `print`、`println`\
  \ 和 `printf`，这些方法你一直都在 `System.out` 中使用。通过这些方法，你可以打印数字并使用格式化输出。\n\n如果你向文件写入，请如下构造一个\
  \ `PrintWriter`：\n\n```\nvar out = new PrintWriter(Files.newBufferedWriter(path,\
  \ charset));\n```\n\n如果你向另一个流写入，请使用\n\n```\nvar out = new PrintWriter(new OutputStreamWriter(outStream,\
  \ charset));\n```\n\n### 注意\n`System.out` 是 `PrintStream` 的实例，而不是 `PrintWriter`。这是\
  \ Java 极早期的遗留。然而，`print`、`println` 和 `printf` 方法在 `PrintStream` 和 `PrintWriter`\
  \ 类中的工作方式相同，都使用字符编码将字符转换为字节。\n\n如果你已经有一个要写入的字符串的文本，请调用\n\n```\nString content =\
  \ ...;\n\nFiles.write(path, content.getBytes(charset));\n```\n\n或者\n\n```\nFiles.write(path,\
  \ lines, charset);\n```\n\n要向文件追加内容，请使用\n\n```\nFiles.write(path, lines, charset,\
  \ StandardOpenOption.APPEND);\n```\n\n要向文件追加内容，请使用\n\n```\nFiles.write(path, lines,\
  \ charset, StandardOpenOption.APPEND);\n```\n\n### 9.1.7 读取和写入二进制数据\n`DataInput`\
  \ 接口声明了以下方法用于以二进制格式读取数字、字符、布尔值或字符串：\n\n```\nbyte readByte()\nint readUnsignedByte()\n\
  char readChar()\nshort readShort()\nint readUnsignedShort()\nint readInt()\nlong\
  \ readLong()\nfloat readFloat()\ndouble readDouble()\nvoid readFully(byte[] b)\n\
  ```\n\n`DataOutput` 接口声明了相应的 `write` 方法。\n\n### 注意\n这些方法以大端字节序读取和写入。\n\n### 警告\n\
  还有 `readUTF/writeUTF` 方法，它们使用“修改后的 UTF-8”格式。这些仅适用于 JVM。\n\n### 随机访问文件\n`RandomAccessFile`\
  \ 类允许你在文件的任何位置读取或写入数据。你可以以只读或读写结合的方式打开随机访问文件；通过在构造函数的第二个参数中使用字符串 `\"r\"`（读取访问）或\
  \ `\"rw\"`（读写访问）来指定选项。例如，\n\n```\nvar file = new RandomAccessFile(path.toString(),\
  \ \"rw\");\n```\n\n随机访问文件有一个*文件指针*，它指示下一个要读取或写入的字节的位置。`seek` 方法将文件指针设置为文件中的任意字节位置。`seek`\
  \ 的参数是一个位于 `0` 和文件长度之间的长整型（你可以通过 `length` 方法获取）。`getFilePointer` 方法返回文件指针当前的位置。\n\
  \n\n\n\n\n`RandomAccessFile` 类实现了 `DataInput` 和 `DataOutput` 接口。要从随机访问文件中读取和写入数字，可以使用你在上一节中看到过的\
  \ `readInt()`/`writeInt()` 等方法。例如：\n\n```\nint value = file.readInt();\n\nfile.seek(file.getFilePointer()\
  \ - 4);\n\nfile.writeInt(value + 1);\n```\n\n### 9.1.9. 内存映射文件\n\n内存映射文件为随机访问提供了另一种非常高效的方法，非常适用于处理大文件。然而，其数据访问的\
  \ API 与输入/输出流的完全不同。首先，获取一个文件的 `channel`：\n\n```\nFileChannel channel = FileChannel.open(path,\n\
  \    StandardOpenOption.READ, StandardOpenOption.WRITE)\n```\n\n然后，将文件的一个区域（或者如果足够小，则是整个文件）映射到内存中：\n\
  \n```\nByteBuffer buffer = channel.map(FileChannel.MapMode.READ_WRITE,\n    0, channel.size());\n\
  ```\n\n使用 `get()`、`getInt()`、`getDouble()` 等方法来读取值，并使用等效的 put 方法来写入值。\n\n```\nint\
  \ offset = ...;\n\nint value = buffer.getInt(offset);\n\nbuffer.put(offset, value\
  \ + 1);\n```\n\n在某个时刻，且肯定是在通道关闭时，这些更改会被写回文件。\n\n### 注意\n\n默认情况下，读取和写入数字的方法使用大端（big-endian）字节序。你可以通过命令更改字节序：\n\
  \n```\nbuffer.order(ByteOrder.LITTLE_ENDIAN);\n```\n\n### 9.1.10. 文件锁\n\n当多个同时执行的程序修改同一个文件时，它们需要进行某种通信，否则文件很容易损坏。文件锁可以解决这个问题。\n\
  \n假设你的应用程序保存了一个带有用户偏好的配置文件。如果用户启动了程序的两个实例，可能会发生它们都想同时写入配置文件的情况。在这种情况下，第一个实例应该锁定文件。当第二个实例发现文件被锁定时，它可以决定等待文件解锁，或者简单地跳过写入过程。要锁定文件，请调用\
  \ `FileChannel` 类的 `lock()` 或 `tryLock()` 方法。\n\n```\nFileChannel channel = FileChannel.open(path);\n\
  \nFileLock lock = channel.lock();\n```\n\n或者\n\n```\nFileLock lock = channel.tryLock();\n\
  ```\n\n第一次调用会阻塞直到锁可用。第二次调用会立即返回，返回锁或在锁不可用时返回 `null`。在锁或通道关闭之前，文件一直保持锁定状态。最好使用 try-with-resources\
  \ 语句：\n\n```\ntry (FileLock lock = channel.lock()) {\n    ...\n}\n```\n\n### 9.2.\
  \ 路径、文件和目录\n\n你已经见过用于指定文件路径的 `Path` 对象。在接下来的章节中，你将看到如何操作这些对象，以及如何与文件和目录交互。\n\n###\
  \ 9.2.1. 路径\n\n`Path` 是目录名称的序列，可选地跟一个文件名。路径的第一个组件可以是根组件，例如 `/` 或 `C:\\`。允许的根组件取决于文件系统。以根组件开头的路径是**绝对的**（absolute）。否则，它是**相对的**（relative）。例如，在这里我们构建了一个绝对路径和一个相对路径。对于绝对路径，我们假设运行在类\
  \ Unix 文件系统上。\n\n```\nPath absolute = Path.of(\"/\", \"home\", \"cay\");\n\nPath\
  \ relative = Path.of(\"myapp\", \"conf\", \"user.properties\");\n```\n\n静态方法 `Path.of()`\
  \ 接收一个或多个字符串，并使用默认文件系统的路径分隔符将它们连接（类 Unix 文件系统为 `/`，Windows 为 `\\`）。然后它解析结果，如果结果在给定的文件系统中不是有效路径，则会抛出\
  \ `InvalidPathException`。结果是一个 `Path` 对象。\n\n你也可以向 `Path.of()` 方法提供一个带有分隔符的字符串：\n\
  \n```\nPath homeDirectory = Path.of(\"/home/cay\");\n```\n\n### 注意\n\n`Path` 对象不必对应于实际存在的文件。它仅仅是一个抽象的名称序列。要创建一个文件，先创建一个路径，然后调用方法来创建对应的文件——参见第\
  \ 9.2.2 节。\n\n组合或“解析”（resolve）路径是非常常见的操作。调用 `p.resolve(q)` 根据以下规则返回路径：\n\n如果 `q`\
  \ 是绝对的，则结果为 `q`。\n\n否则，根据文件系统的规则，结果是 `p` 后接 `q`。\n\n例如，假设你的应用程序需要相对于主目录找到其配置文件。以下是你可以组合路径的方法：\n\
  \n```\nPath workPath = homeDirectory.resolve(\"myapp/work\");\n\n// 等同于 homeDirectory.resolve(Path.of(\"\
  myapp/work\"));\n```\n\n有一个便利方法 `resolveSibling()`，它相对于路径的父路径进行解析，产生一个兄弟路径。例如，如果\
  \ `workPath` 是 `/home/cay/myapp/work`，调用\n\n```\nPath tempPath = workPath.resolveSibling(\"\
  temp\");\n```\n\n将产生 `/home/cay/myapp/temp`。\n\n`resolve` 的反操作是 `relativize`。调用\
  \ `p.relativize(q)` 返回相对于 `p` 构建 `q` 的路径。例如：\n\n```\nPath relative = Path.of(\"\
  myapp/work\");\nPath absolute = Path.of(\"/home/cay\");\nPath p = absolute.relativize(relative);\
  \ // 示例逻辑\n```\n\n`normalize()` 方法移除路径中的任何 `.` 或 `..` 组件。例如：\n\n```\nPath p = Path.of(\"\
  /home/cay/../user/file\");\nPath normalized = p.normalize(); // /home/user/file\n\
  ```\n\n`toAbsolutePath()` 方法如果路径不是绝对的，则返回绝对路径。例如：\n\n```\nPath relative = Path.of(\"\
  home/cay\");\nPath absolute = relative.toAbsolutePath(); // /current/home/cay\n\
  ```\n\n`toFile()` 方法返回此路径的 File 表示。例如：\n\n```\nPath p = Path.of(\"/home/cay/user.properties\"\
  );\nFile f = p.toFile(); // user.properties\n```\n\n`getFileName()` 方法返回文件名。例如：\n\
  \n```\nPath.of(\"/home/cay\").getFileName(); // cay\n```\n\n`getParent()` 方法返回父目录。例如：\n\
  \n```\nPath.of(\"/home/cay\").getParent(); // /home\n```\n\n`getRoot()` 方法返回根组件。例如：\n\
  \n```\nPath.of(\"/home/cay\").getRoot(); // /\n```\n\n`getNameCount()` 方法返回路径中名称的数量。例如：\n\
  \n```\nPath.of(\"/home/cay\").getNameCount(); // 2\n```\n\n`getName(int index)`\
  \ 方法返回指定索引名称元素。例如：\n\n```\nPath.of(\"/home/cay/user.properties\").getName(1); //\
  \ cay\nPath.of(\"/home/cay\").getName(2); // 抛出 IndexOutOfBoundsException\n```\n\
  \n`subpath(int begin, int end)` 方法返回此路径的子路径。例如：\n\n```\nPath.of(\"/home/cay/user.properties\"\
  ).subpath(1, 3); // cay/user\n```\n\n`toString()` 方法返回路径的字符串表示。例如：\n\n```\nPath.of(\"\
  /home/cay\").toString(); // /home/cay\n```\n\n`Path.of(String)` 方法从字符串创建路径。例如：\n\
  \n```\nPath.of(\"/home/cay\");\n```\n\n### 9.2.2. 创建文件和目录\n\n要创建一个目录，调用\n\n```\n\
  Files.createDirectory(path);\n```\n\n路径中除最后一个组件以外的所有部分必须已经存在。要创建中间目录，请使用\n\n```\n\
  Files.createDirectories(path);\n```\n\n你可以可以使用创建一个空文件：\n\n```\nFiles.createFile(path);\n\
  ```\n\n如果文件已存在，则调用将抛出异常。存在检查和创建是原子的。\n\n调用 `Files.exists(path)` 检查给定的文件或目录是否存在。要测试它是一个目录还是“普通”文件（即包含数据，而不是目录或符号链接），请调用\
  \ `Files` 类的静态方法 `isDirectory` 和 `isRegularFile`。\n\n在给定或系统特定位置创建临时文件或目录有便利方法：\n\
  \n```\nPath tempFile = Files.createTempFile(dir, prefix, suffix);\n\nPath tempFile\
  \ = Files.createTempFile(prefix, suffix);\n\nPath tempDir = Files.createTempDirectory(dir,\
  \ prefix);\n\nPath tempDir = Files.createTempDirectory(prefix);\n```\n\n\n\n\n在这里，`dir`\
  \ 是一个 `Path`，而 `prefix/suffix` 是可能为空的字符串。例如，调用 `Files.createTempFile(null, \".txt\"\
  )` 可能会返回类似 `/tmp/ 1234405522364837194.txt` 的路径。\n\n#### 9.2.3. 复制、移动和删除文件\n\n要将文件从一个位置复制到另一个位置，只需调用：\n\
  \n```\nFiles.copy(fromPath, toPath);\n```\n\n移动文件（即复制并删除原始文件），调用：\n\n```\nFiles.move(fromPath,\
  \ toPath);\n```\n\n你也可以使用此命令移动空目录。\n\n如果目标存在，则复制或移动将失败。如果你想覆盖现有目标，请使用 `REPLACE_EXISTING`\
  \ 选项。如果你想复制所有文件属性，请使用 `COPY_ATTRIBUTES` 选项。你可以这样同时提供两者：\n\n```\nFiles.copy(fromPath,\
  \ toPath, StandardCopyOption.REPLACE_EXISTING,\n\n    StandardCopyOption.COPY_ATTRIBUTES);\n\
  ```\n\n你可以指定移动应该是原子性的。这样你就能确保要么移动成功完成，要么源文件依然存在。使用 `ATOMIC_MOVE` 选项：\n\n```\nFiles.move(fromPath,\
  \ toPath, StandardCopyOption.ATOMIC_MOVE);\n```\n\n参见 表 9.3 可文件操作可用选项摘要。\n\n最后，要删除文件，只需调用：\n\
  \n```\nFiles.delete(path);\n```\n\n如果文件不存在，此方法会抛出异常，因此你可能更想使用：\n\n```\nboolean deleted\
  \ = Files.deleteIfExists(path);\n```\n\n删除方法也可以用于删除空目录。\n\n表 9.3：文件操作的标准选项\n\n![images](img/09tab03.jpg)\n\
  \n#### 9.2.4. 访问目录条目\n\n静态方法 `Files.list` 返回一个读取目录条目的 `Stream<Path>`。该目录是懒性读取的，这使得高效处理包含海量条目的目录成为可能。\n\
  \n由于读取目录涉及需要关闭的系统资源，你应该使用 `try-with-resources` 块：\n\n```\ntry (Stream<Path> entries\
  \ = Files.list(pathToDirectory)) {\n\n    ...\n\n}\n```\n\n`list` 方法不会进入子目录。要处理目录的所有后代节点，请使用\
  \ `Files.walk` 方法。\n\n```\ntry (Stream<Path> entries = Files.walk(pathToRoot)) {\n\
  \n     // 包含所有后代节点，按深度优先顺序访问\n\n}\n```\n\n以下是解压后的 `src.zip` 树的遍历示例：\n\n```\njava\n\
  \njava/nio\n\njava/nio/DirectCharBufferU.java\n\njava/nio/ByteBufferAsShortBufferRL.java\n\
  \njava/nio/MappedByteBuffer.java\n\n...\n\njava/nio/ByteBufferAsDoubleBufferB.java\n\
  \njava/nio/charset\n\njava/nio/charset/CoderMalfunctionError.java\n\njava/nio/charset/CharsetDecoder.java\n\
  \njava/nio/charset/UnsupportedCharsetException.java\n\njava/nio/charset/spi\n\n\
  java/nio/charset/spi/CharsetProvider.java\n\njava/nio/charset/StandardCharsets.java\n\
  \njava/nio/charset/Charset.java\n\n...\n\njava/nio/charset/CoderResult.java\n\n\
  java/nio/HeapFloatBufferR.java\n\n...\n```\n\n如你所见，每当遍历到一个目录时，它会在继续处理兄弟节点之前被进入。\n\
  \n你可以通过调用 `Files.walk(pathToRoot, depth)` 来限制想要访问的树的深度。两个 `walk` 方法都有一个类型为 `FileVisitOption...`\
  \ 的变长参数，但你只能提供一个选项：`FOLLOW_LINKS` 用于跟随符号链接。\n\n注意\n\n如果你过滤了 `walk` 返回的路径，且你的过滤标准涉及存储在目录中的文件属性（例如大小、创建时间或类型（文件、目录、符号链接）），请使用\
  \ `find` 方法代替 `walk`。调用该方法时，传入一个接受 `path` 和 `BasicFileAttributes` 对象的谓函数。其唯一的优势是效率。既然目录正在被读取，这些属性是就可以直接获取的。\n\
  \n此代码段使用 `Files.walk` 方法将一个目录复制到另一个目录：\n\n```\nFiles.walk(source).forEach(p -> {\n\
  \n    try {\n        Path q = target.resolve(source.relativize(p));\n\n        if\
  \ (Files.isDirectory(p))\n            Files.createDirectory(q);\n\n        else\n\
  \            Files.copy(p, q);\n\n    } catch (IOException ex) {\n\n        throw\
  \ new UncheckedIOException(ex);\n    }\n\n});\n```\n\n遗憾的是，你无法轻松使用 `Files.walk`\
  \ 方法删除目录树，因为你需要在删除父目录之前先访问子。在这种情况下，请使用 `walkFileTree` 方法。它需要一个 `FileVisitor` 接口的实例。以下是文件访问器获取通知的情况：\n\
  \n1. 在处理目录之前：\n\n```\nFileVisitResult preVisitDirectory(T dir, IOException ex)\n\
  ```\n\n2. 当遇到文件时：\n\n```\nFileVisitResult visitFile(T path, BasicFileAttributes\
  \ attrs)\n```\n\n3. 当 `visitFile` 方法中发生异常时：\n\n```\nFileVisitResult visitFileFailed(T\
  \ path, IOException ex)\n```\n\n4. 在处理目录之后：\n\n```\nFileVisitResult postVisitDirectory(T\
  \ dir, IOException ex)\n```\n\n在每种情况下，方法返回以下结果之一：\n- `CONTINUE`\n- `SKIP_SUBTREE`\n\
  - `SKIP_TREE`\n- `SIBLINGS`\n- `TERMINATE`\n\n`SimpleVisitor` 类实现了此接口，在每个点继续迭代并抛出任何异常。这里是你可以删除目录的方法：\n\
  \n```\nFiles.walkFileTree(root, new SimpleVisitor<Path>() {\n\n    public FileVisitResult\
  \ visitFile(Path file, BasicFileAttributes attrs) throws IOException {\n       \
  \ Files.delete(file);\n        return FileVisitResult.CONTINUE;\n    }\n\n    public\
  \ FileVisitResult postVisitDirectory(Path dir, IOException ex) throws IOException\
  \ {\n        if (ex != null) throw ex;\n        Files.delete(dir);\n        return\
  \ FileVisitResult.CONTINUE;\n    }\n\n});\n```\n\n#### 9.2.5. ZIP 文件系统\n\n`Paths`\
  \ 类查找默认文件系统——用户本地磁盘的文件。你可以拥有其他文件系统。其中有用的是 ZIP 文件系统。如果 `zipname` 是一个 ZIP 文件的名称，那么调用\n\
  \n```\nFileSystem zipfs = FileSystems.newFileSystem(Path.of(zipname));\n```\n\n\
  建立了一个包含存档中所有文件的文件系统。如果你知道它的名称，从中复制文件是容易的：\n\n```\nFiles.copy(zipfs.getPath(sourceName),\
  \ targetPath);\n```\n\n在这里，`zipfs.getPath` 是任意文件系统的 `Path.of` 对应物。\n\n要列出 ZIP 存档中的所有文件，遍历树：\n\
  \n```\nFiles.walk(zipfs.getPath(\"/\")).forEach(p -> {\n\n    Process p\n\n});\n\
  ```\n\n创建一个新的 ZIP 文件需要多一点努力。以下是魔法咒语：\n\n```\nPath zipPath = Path.of(\"myfile.zip\"\
  );\n\nvar uri = new URI(\"jar\", zipPath.toUri().toString(), null);\n\n    // 构建\
  \ URI jar:file://myfile.zip\n\ntry (FileSystem zipfs = FileSystems.newFileSystem(uri,\n\
  \        Collections.singletonMap(\"create\", \"true\"))) {\n\n    // 要添加文件，将其复制到\
  \ ZIP 文件系统\n\n    Files.copy(sourcePath, zipfs.getPath(\"/\").resolve(targetPath));\n\
  \n}\n```\n\n注意\n\n有一个处理 ZIP 存档的旧版 API，带有 `ZipInputStream` 和 `ZipOutputStream` 类，但它不像本节描述的那个样容易使用。\n\
  \n### 9.3. HTTP 连接\n\n\n\n\n你可以通过使用 `URL.getInputStream` 方法返回的输入流从 URL 读取。然而，如果你想获取有关网络资源的更多信息，或者想写入数据，你就需要比\
  \ `URL` 类提供的更细致的流程控制。`URLConnection` 类是在 HTTP 成为 Web 通用协议之前设计的。它支持许多协议，但其对 HTTP\
  \ 的支持略显繁琐。在决定支持 HTTP/2 时，显然提供一个现代的客户端接口比重构现有的 API 更好。`HttpClient` 提供了更方便的 API 和对\
  \ HTTP/2 支持。\n\n在接下来的章节中，我将提供一个使用 `HttpURLConnection` 类的用法指南，然后给出该 API 的概述。\n\n\
  ### 9.3.1\\. `URLConnection` 和 `HttpURLConnection` 类\n\n要使用 `URLConnection` 类，请遵循以下步骤：\n\
  \n1. 获取一个 `URLConnection` 对象：\n\n```\nURLConnection connection = url.openConnection();\n\
  ```\n\n对于 HTTP URL，返回的对象实际上是 `HttpURLConnection` 的实例。\n\n2. 如果需要，设置请求属性：\n\n```\n\
  connection.setRequestProperty(\"Accept-Charset\", \"UTF-8, ISO-8859-1\");\n```\n\
  \n如果一个键有多个值，请用逗号分隔。\n\n3. 要向服务器发送数据，调用\n\n```\nconnection.setDoOutput(true);\n\n\
  try (OutputStream out = connection.getOutputStream()) {\n\n    // 向 out 写入\n\n}\n\
  ```\n\n4. 如果你想读取响应头且你还没有调用 `getOutputStream()`，请调用\n\n```\nconnection.connect();\n\
  ```\n\n然后查询头字段信息：\n\n```\nMap<String, List<String>> headers = connection.getHeaderFields();\n\
  ```\n\n对于每个键，你将得到一个值列表，因为可能存在多个具有相同键的头字段。\n\n5. 读取响应：\n\n```\ntry (InputStream in\
  \ = connection.getInputStream()) {\n\n    // 从 in 读取\n\n}\n```\n\n一个常见的用例是提交表单数据。在向\
  \ HTTP URL 写入数据时，`URLConnection` 类会自动将内容类型设置为 `application/x-www-form-urlencoded`，但你需要对键/值对进行编码：\n\
  \n```\nURL url = ...;\n\nURLConnection connection = url.openConnection();\n\nconnection.setDoOutput(true);\n\
  \ntry (var out = new OutputStreamWriter(\n        connection.getOutputStream(),\
  \ StandardCharsets.UTF_8)) {\n\n    Map<String, String> postData = ...;\n\n    boolean\
  \ first = true;\n\n    for (Map.Entry<String, String> entry : postData.entrySet())\
  \ {\n\n        if (first) first = false;\n\n        else out.write(\"&\");\n\n \
  \       out.write(URLEncoder.encode(entry.getKey(), \"UTF-8\"));\n\n        out.write(\"\
  =\");\n\n        out.write(URLEncoder.encode(entry.getValue(), \"UTF-8\"));\n\n\
  \    }\n}\n\ntry (InputStream in = connection.getInputStream()) {\n\n    ...\n\n\
  }\n```\n\n### 9.3.2\\. HTTP Client API\n\nHTTP  API 提供了另一种连接到网络服务器的机制，它比具有那套繁琐阶段设置的\
  \ `URLConnection` 类更简单。更重要的是，该实现支持 HTTP/2。\n\n`HttpClient` 可以发布请求并接收响应。你可以通过调用以下方法获取客户端：\n\
  \n```\nHttpClient client = HttpClient.newHttpClient();\n```\n\n或者，如果你需要配置客户端，请使用如下构建器\
  \ API：\n\n```\nHttpClient client = HttpClient.newBuilder()\n    .followRedirects(HttpClient.Redirect.ALWAYS)\n\
  \    .build();\n```\n\n也就是说，你获得一个构建器，调用方法来自定义将要构建的对象，然后调用 `build` 方法来完成构建过程。这是构造不可变对象的常用模式。\n\
  \n按照相同的模式来构建请求。这里有一个 `GET` 请求：\n\n```\nHttpRequest request = HttpRequest.newBuilder()\n\
  \    .uri(new URI(\"https://horstmann.com\"))\n    .GET()\n    .build();\n```\n\n\
  URI 是“统一资源标识符”，在使用 HTTP 时，它等同于 URL。然而，在 Java 中，`URL` 类拥有用于实际打开 URL 连接的方法，而 `URI`\
  \ 类只关注语法（方案、主机、端口、路径、查询、片段等）。\n\n在发送请求时，你必须告诉客户端如何处理响应。如果你只想获取字符串形式的正文，请使用 `HttpResponse.BodyHandlers.ofString()`\
  \ 发送请求，如下：\n\n```\nHttpResponse<String> response\n    = client.send(request, HttpResponse.BodyHandlers.ofString());\n\
  ```\n\n`HttpResponse` 类是一个模板，其类型表示正文的类型。你只需即可获取响应正文字符串：\n\n```\nString bodyString\
  \ = response.body();\n```\n\n还有其他响应正文处理器可以将响应获取为字节数组或文件。人们希望 JDK 最终能支持 JSON 并提供一个\
  \ JSON 处理器。\n\n对于 `POST` 请求，你同样需要一个“正文发布者”，将请求数据转换为正在发布的数据。有针对字符串、字节数组和文件的发布者。同样，人们希望库的设计者能意识到大多数\
  \ `POST` 请求涉及表单数据或 JSON 对象这一现实，并提供相应的发布者。\n\n在此期间，要发送表单 POST，你需要对请求数据进行 URL 编码，就像前一节一样。\n\
  \n```\nMap<String, String> postData = ...;\n\nboolean first = true;\n\nvar body\
  \ = new StringBuilder();\n\nfor (Map.Entry<String, String> entry : postData.entrySet())\
  \ {\n\n        if (first) first = false;\n\n        else out.write(\"&\");\n\n \
  \       out.write(URLEncoder.encode(entry.getKey(), \"UTF-8\"));\n\n        out.write(\"\
  =\");\n\n        out.write(URLEncoder.encode(entry.getValue(), \"UTF-8\"));\n\n\
  \    }\n\nHttpRequest request = HttpRequest.newBuilder()\n    .uri(new URI(\"https://horstmann.com\"\
  ))\n    .header(\"Content-Type\", \"application/x-www-form-urlencoded\")\n    .POST(HttpRequest.BodyPublishers.ofString(body.toString()))\n\
  \    .build();\n```\n\n注意，与 `URLConnection` 类不同，你需要指定内容类型。\n\n`HttpResponse` 对象还可以获取状态码和响应头。\n\
  \n```\nint status = response.statusCode();\n\nHttpHeaders responseHeaders = response.headers();\n\
  ```\n\n你可以将 `HttpHeaders` 对象转换为映射：\n\n```\nMap<String, List<String>> headerMap =\
  \ responseHeaders.map();\n```\n\n映射的值是列表，因为在 HTTP 中每个键可以有多个值。\n\n如果你只需要某个键的值，并且知道没有多个值，可以调用\
  \ `firstValue` 方法：\n\n```\nOptional<String> lastModified = headerMap.firstValue(\"\
  Last-Modified\");\n```\n\n如果没有提供，则返回空 Optional。\n\n提示\n\n要启用 `HttpClient` 的日志，请在\
  \ JDK 的 `net.properties` 中添加此行：\n\n```\njdk.httpclient.HttpClient.log=all\n```\n\
  \n除了 `all`，你可以指定一个由逗号分隔的 `headers`, `requests`, `content`, `errors`, `ssl`, `trace`\
  \ 和 `frames` 组成的列表，可选跟随 `:control`, `:data`, `:window` 或 `:all`。不要使用空格。\n\n将命名为\
  \ `jdk.httpclient.HttpClient` 的日志级别设置为 `INFO`，例如通过在 JDK 的 `logging.properties` 文件中添加此行：\n\
  \n```\njdk.httpclient.HttpClient.level=INFO\n```\n\n### 9.4\\. 正则表达式\n\n正则表达式指定字符串模式。当你需要定位匹配模式的字符串时，可以使用它们。例如，假设你想在\
  \ HTML 文件中查找链接。你需要寻找模式为 `<a href=\"...\">` 的字符串。但是——可能有额外的空格，或者 URL 可能被单引号包裹。正则表达式提供了一种精确的语法来指定哪些字符序列是合法匹配。\n\
  \n在接下来的章节中，你将看到 Java API 使用的正则表达式语法，以及如何使用正则表达式。\n\n#### 9.4.1\\. 正则表达式语法\n\n在正则表达式中，字符表示自身，除非它是保留字符之一\n\
  \n```\n. * + ? { | ( ) [ \\ ^ $\n```\n\n\n\n\n例如，正则表达式 `Java` 仅匹配字符串 `Java`。\n\n\
  符号 `.` 匹配任意单个字符。例如，`.a.a` 匹配 `Java` 和 `data`。\n\n`*` 符号表示前面的结构可以重复 0 次或多次；对于 `+`，则表示重复\
  \ 1 次或多次。后缀 `?` 表示该结构是可选的（0 次或 1 次）。例如，`be+s?` 匹配 `be`、`bee` 和 `bees`。你可以使用 `{ }`\
  \ 指定其他重复次数（参见表 9.4）。\n\n`|` 表示一种备选方案：`.(oo|ee)f` 匹配 `beef` 或 `woof`。注意括号——如果没有括号，`.oo|eef`\
  \ 将成为 `.oo` 和 `eef` 之间的备选关系。括号也用于分组——参见第 9.4.4 节。\n\n*字符类*是一组包含在括号内的字符备选集合，例如 `[Jj]`、`[0-9]`、`[A-Za-z]`\
  \ 或 `[⁰-9]`。在字符类内部，`-` 表示一个范围（所有 Unicode 值落在两个边界之间的字符）。然而，如果 `-` 是字符类中的第一个或最后一个字符，则则表示其本身。`^`\
  \ 作为字符类中的第一个字符时，表示补集（除指定字符以外的所有字符）。\n\n有许多*预定义字符类*，例如 `\\d`（数字）或 `\\p{Sc}`（Unicode\
  \ 货币符号）。参见 . 和 。\n\n字符 `^` 和 `$` 匹配输入的开始和结束。\n\n如果你需要匹配字面量 `. * + ? { | ( ) [ \\\
  \ ^ $`，请在它们前面加一个反斜杠 `\\`。在字符类内部，你只需要转义 `[` 和 `\\`，只要你小心 `] - ^` 的位置即可。例如，`[]^-]`\
  \ 是一个包含这三个字符的类。\n\n或者，使用 `\\Q` 和 `\\E` 包围字符串。例如，`\\(\\$0\\.99\\)` 和 `\\Q($0.99)\\\
  E` 均匹配字符串 `($0.99)`。\n\n### 提示\n\n如果你有一个可能包含正则表达式语法中许多特殊字符的字符串，可以通过调用 `Parse.quote(str)`\
  \ 对它们全部进行转义。这只是简单将字符串用 `\\Q` 和 `\\E` 包围起来，但它处理了 `str` 可能包含 `\\E` 的特殊情况。\n\n### 表\
  \ 9.4: 正则表达式语法\n\n![images](img/09tab04.jpg)![images](img/09tab04a.jpg)![images](img/09tab04b.jpg)\n\
  \n### 表 9.5: 预定义字符类 \\p{...}\n\n![images](img/09tab05.jpg)\n\n#### 9.4.2 测试匹配\n\n\
  通常，使用正则表达式有两种方法：你想测试字符串是否符合该表达式，或者你想在字符串中找到表达式的所有匹配项。\n\n在第一种情况下，直接使用静态 `matches`\
  \ 方法：\n\n```\nString regex = \"[+-]?\\\\d+\";\nCharSequence input = ...;\n\nif (Pattern.matches(regex,\
  \ input)) {\n    ...\n}\n```\n\n如果你需要多次使用同一个正则表达式，编译它会更高效。然后，为每个输入创建一个 `Matcher`：\n\
  \n```\nPattern pattern = Pattern.compile(regex);\nMatcher matcher = pattern.matcher(input);\n\
  \nif (matcher.matches()) ...\n```\n\n如果匹配成功，你可以获取匹配组的位置——参见第 9.4 节。\n\n如果你想测试输入是否*包含*某个匹配项，请改用\
  \ `find` 方法：\n\n```\nif (matcher.find()) ...\n```\n\n你可以将模式转换为谓词：\n\n```\nPattern\
  \ digits = Pattern.compile(\"[0-9]+\");\nList<String> strings = List.of(\"December\"\
  , \"31st\", \"1999\");\nList<String> matchingStrings = strings.stream()\n    .filter(digits.asMatchPredicate())\n\
  \    .toList(); // [\"1999\"]\n```\n\n结果包含了匹配正则表达式的字符串。\n\n使用 `asPredicate` 方法测试字符串是否包含匹配项：\n\
  \n```\nList<String> sringsContainingMatch = strings.stream()\n    .filter(digits.asPredicate())\n\
  \    .toList(); // [\"31st\", \"1999\"]\n```\n\n#### 9.4.3 查找所有匹配\n\n在本节中，我们考虑正则表达式的另一个常见用例——在输入中查找所有匹配。使用此循环：\n\
  \n```\nString input = ...;\nMatcher matcher = pattern.matcher(input);\n\nwhile (matcher.find())\
  \ {\n    String match = matcher.group();\n    int matchStart = matcher.start();\n\
  \    int matchEnd = matcher.end();\n    ...\n}\n```\n\n通过这种方式，你可以逐个处理每个匹配。如代码片段所示，你可以获取匹配字符串及其在输入字符串中的位置。\n\
  \n更优雅的方法是调用 `results` 方法获取 `Stream<MatchResult>`。`MatchResult` 接口拥有 `group`、`start`\
  \ 和 `end` 方法，与 `Matcher` 一。\n\n\n\n\n\n```\nString result = input.replaceAll(\"\\\
  \\s*,\\\\s*\", \",\");\n```\n\n替换字符串可以包含组索引 `$n` 或名称 `${name}`。它们会被替换为相应捕获组的内容。\n\
  \n```java\nString result = \"3:45\".replaceAll(\n\n    \"(\\\\d{1,2}):(?<minutes>\\\
  \\d{2})\",\n\n    \"$1 hours and ${minutes} minutes\");\n\n    // 将 result 设置为 \"\
  3 hours and 45 minutes\"\n```\n\n你可以使用 `\\` 来转义替换字符串中的 `$` 和 `\\`，或者调用 `Matcher.quoteReplacement`\
  \ 便利方法：\n\n```java\nmatcher.replaceAll(Matcher.quoteReplacement(str))\n```\n\n如果你想执行比拼接组匹配项更复杂的操作，可以提供一个替换函数而不是替换字符串。该函数接受一个\
  \ `MatchResult` 并返回一个字符串。例如，在这里我们将所有长度至少为四个字母的单词替换为大写版本：\n\n```java\nString result\
  \ = Pattern.compile(\"\\\\pL{4,}\")\n\n    .matcher(\"Mary had a little lamb\")\n\
  \n    .replaceAll(m -> m.group().toUpperCase());\n\n    // 输出 \"MARY had a LITTLE\
  \ LAMB\"\n```\n\n`replaceFirst` 方法只替换模式的第一次出现的内容。\n\n### 9.4.7. 标志 (Flags)\n\n几个标志可以改变正则表达式的行为。你可以在编译模式时指定它们：\n\
  \n```java\nPattern pattern = Pattern.compile(regex,\n\n    Pattern.CASE_INSENSITIVE\
  \ | Pattern.UNICODE_CHARACTER_CLASS);\n```\n\n或者你可以在模式内部指定它们：\n\n```java\nString\
  \ regex = \"(?iU:expression)\";\n```\n\n以下是这些标志：\n\n![Images](img/sq.jpg) `Pattern.CASE_INSENSITIVE`\
  \ 或 `i`: 忽略字母大小写匹配字符。默认情况下，此标志只考虑美国 ASCII 字符。\n\n![Images](img/sq.jpg) `Pattern.UNICODE_CASE`\
  \ 或 `u`: 与 `CASE_INSENSITIVE` 结合使用时，使用 Unicode 大小写进行匹配。\n\n![Images](img/sq.jpg)\
  \ `Pattern.UNICODE_CHARACTER_CLASS` 或 `U`: 选择 Unicode 字符类而非 POSIX。隐含 `UNICODE_CASE`。\n\
  \n![Images](img/sq.jpg) `Pattern.MULTILINE` 或 `m`: 使 `^` 和 `$` 匹配行的开头和结尾，而不是整个输入。\n\
  \n![Images](img/sq.jpg) `Pattern.UNIX_LINES` 或 `d`: 在多行模式下匹配 `^` 和 `$` 时，只有 `\\\
  n` 是行终止符。\n\n![Images](img/sq.jpg) `Pattern.DOTALL` 或 `s`: 使 `.` 符号匹配所有字符，包括行终止符。\n\
  \n![Images](img/sq.jpg) `Pattern.COMMENTS` 或 `x`: 忽略空白字符和注释（从 `#` 到行尾）。\n\n![Images](img/sq.jpg)\
  \ `Pattern.LITERAL`: 模式按字面意思处理，必须精确匹配，但可能不考虑字母大小外。\n\n![Images](img/sq.jpg) `Pattern.CANON_EQ`:\
  \ 考虑 Unicode 字符的规范等效性。例如，`u` 后跟 `¨`（变音符号）会匹配 `ü`。\n\n最后两个标志不能在正则表达式内部指定。\n\n###\
  \ 9.5. 序列化 (Serialization)\n\n在接下来的章节中，你将学习对象序列化——这是一种将对象转换为一组字节的机制，以便将其发送到其他地方或存储在磁盘上，并从这些字节恢复对象。\n\
  \n序列化是分布式处理的一个重要工具，在分布式处理中，对象从一台虚拟机传输到另一台虚拟机。它还用于故障转移和负载均衡，此时被序列化的对象可以移动到另一台服务器。如果你处理服务器端软件，通常需要为类启用序列化。接下来的章节将告诉该如何做。\n\
  \n### 9.5.1. `Serializable` 接口\n\n为了让对象能够被序列化（即转换为一组字节），它必须是实现 `Serializable` 接口的类的实例。这是一个没有方法的标记接口，类似于你在第\
  \ 4 章中看到的 `Cloneable` 接口。\n\n例如，要使 `Employee` 对象变为可序列化，需要将该类声明为：\n\n```java\npublic\
  \ class Employee implements Serializable {\n\n    private String name;\n\n    private\
  \ double salary;\n\n    ...\n\n}\n```\n\n如果类所有的实例变量都是原始类型或 `enum` 类型，或者包含指向可序列化对象的引用，那么该类实现\
  \ `Serializable` 接口是恰当的。标准库中的许多类都是可序列化的。你在第 7 章看到的数组和集合类只要其元素是可序列化的，就是可序列化的。\n\n\
  对于 `Employee` 类，实际上对于大多数类来说，这不是问题。在接下来的章节中，你将看到需要额外帮助时该做什么。\n\n要序列化对象，你需要一个 `ObjectOutputStream`，它通过另一个接收实际字节的\
  \ `OutputStream` 构建。\n\n```java\nvar out = new ObjectOutputStream(Files.newOutputStream(path));\n\
  ```\n\n现在调用 `writeObject` 方法：\n\n```java\nvar peter = new Employee(\"Peter\", 90000);\n\
  \nvar paul = new Manager(\"Paul\", 180000);\n\nout.writeObject(peter);\n\nout.writeObject(paul);\n\
  ```\n\n要读回对象，构造一个 `ObjectInputStream`：\n\n```java\nvar in = new ObjectInputStream(Files.newInputStream(path));\n\
  ```\n\n使用 `readObject` 获取对象：\n\n```java\nvar e1 = (Employee) in.readObject();\n\n\
  var e2 = (Employee) in.readObject();\n```\n\n当对象被写入时，类名和实例变量的值被保存。如果实例变量是原始类型，它会被保存。如果是对象，则再次通过\
  \ `writeObject` 写入。\n\n当读入时，过程反过来。类名和实例变量的值被读取，对象被恢复。\n\n这里有一个陷阱。假设有两个引用同一个对象。假设每个员工都有老板：\n\
  \n```java\nvar peter = new Employee(\"Peter\", 90000);\n\nvar paul = new Manager(\"\
  Barney\", 105000);\n\nvar mary = new Manager(\"Mary\", 180000);\n\npeter.setBoss(mary);\n\
  \npaul.setBoss(mary);\n\nout.writeObject(peter);\n\nout.writeObject(paul);\n```\n\
  \n读回这两个对象时，它们需要同一个老板，而不是两个相同但不同的对象。为了实现这一点，每个对象在保存时获得一个*序列号*。当你将对象引用传递给 `writeObject`\
  \ 时，`ObjectOutputStream` 会检查该引用是否已经写入。如果是，它只写入序列号，而不重复对象的内容。\n\n同样，`ObjectInputStream`\
  \ 记住它遇到的所有对象。当读入重复对象的引用时，它简单地返回之前读取的对象引用。\n\n### 9.5.2. 瞬态变量 (Transient Instance\
  \ Variables)\n\n某些实例变量不应该被序列化——例如在恢复对象时没有意义的数据库连接。此外，当对象缓存值时，丢弃缓存并重新计算可能比存储它更好。\n\
  \n要防止实例变量被序列化，只需为其标记 `transient` 修饰符。如果实例变量持有不可序列化类的实例，请务必将其标记为 `transient`。瞬态变量在序列化时会被跳过。\n\
  \n**注意**\n\n如果可序列化类的父类不可序列化，则它必须有一个可访问的无参构造函数。考虑这个例子：\n\n```java\nclass Person //\
  \ 不序列化\n\nclass Employee extends Person implements Serializable\n```\n\n当反序列化 `Employee`\
  \ 对象时，它的实例变量从对象输入流读取，但 `Person` 的实例变量由 `Person` 构造函数设置。\n\n### 9.5.3. `readObject`\
  \ 和 `writeObject` 方法\n\n在少数情况下，你需要调整序列化机制。序列化类可以通过定义签名如下的方法，为默认的读写行为添加任何所需的操作：\n\
  \n\n\n\n\n```\n@Serial private void readObject(ObjectInputStream in)\n    throws\
  \ IOException, ClassNotFoundException\n\n@Serial private void writeObject(ObjectOutputStream\
  \ out)\n    throws IOException\n```\n\n随后，对象头将像通常一样继续写入，但实例变量字段不再被自动序列化。相反，将调用这些方法。\n\
  \n请注意 `@Serial` 注解。用于调整序列化的方法不属于接口。因此，你不能使用 `@Override` 注解来让编译器检查方法声明。`@Serial`\
  \ 注解旨在对序列化方法启用相同的检查。在 Java 17 之前，`javac` 编译器并不进行这种检查，但在未来可能会发生。某些 IDE 会检查该注解。\n\n\
  `java.awt.geom` 包中的许多类（例如 `Point2D.Double`）不是可序列化的。现在，假设你想序列化一个名为 `LabeledPoint`\
  \ 的类，它存储了一个 `String` 和一个 `Point2D.Double`。首先，你需要将 `Point2D.Double` 字段标记为 `transient`，以避免\
  \ `NotSerializableException`。\n\n```java\npublic class LabeledPoint implements Serializable\
  \ {\n\n    private String label;\n\n    private transient Point2D.Double point;\n\
  \n    . . .\n\n}\n```\n\n在 `writeObject` 方法中，首先通过调用 `defaultWriteObject` 方法写入对象描述符和\
  \ `String` 字段 `label`。这是 `ObjectOutputStream` 类的一个特殊方法，只能在序列化类的 `writeObject` 方法内部调用。然后，我们使用标准的\
  \ `DataOutput` 调用写入点坐标。\n\n```java\nprivate void writeObject(ObjectOutputStream\
  \ out) throws IOException {\n\n    out.defaultWriteObject();\n\n    out.writeDouble(point.getX());\n\
  \n    out.writeDouble(point.getY());\n}\n```\n\n在 `readObject` 方法中，我们反转该过程：\n\n\
  ```java\nprivate void readObject(ObjectInputStream in)\n        throws IOException,\
  \ ClassNotFoundException {\n\n    in.defaultReadObject();\n\n    double x = in.readDouble();\n\
  \n    double y = in.readDouble();\n\n    point = new Point2D.Double(x, y);\n\n}\n\
  ```\n\n另一个示例是 `HashSet` 类，它提供了自己的 `readObject` 和 `writeObject` 方法。`writeObject`\
  \ 方法并没有保存哈希表的内部结构，而是简单保存了容量、负载因子、大小和元素。`readObject` 方法读回容量和负载因子，构建一个新表并插入元素。\n\n\
  `readObject` 和 `writeObject` 方法只需要保存和加载它们的数据。它们不关心父类数据或任何其他类信息。\n\n`Date` 类使用了这种方法。它的\
  \ `writeObject` 方法保存了自“纪元”（1970 年 1 月 1 日）以来的毫秒数。缓存日历的数据结构没有被保存。由于由于原因，第 0.0.0 节中的序列化\
  \ `Date` 实例由一个透明数据块组成。\n\n### 注意\n就像构造函数一样，`readObject` 方法操作的是部分初始化的对象。如果你在 `readObject`\
  \ 内部调用了被子类重写的非 final 方法，它可能会访问未初始化的数据。\n\n#### Note\n如果可序列化类定义了一个字段\n\n```java\n\
  @Serial private static final ObjectStreamField[] serialPersistentFields\n```\n那么序列化将使用这些字段描述符，而不是非\
  \ transient 非静态字段。还有一个 API 可以在序列化之前设置字段值，或在反序列化之后读取它们。这对于在类演进后保留遗留布局非常有用。例如，`BigDecimal`\
  \ 类使用这种机制来序列化其实例，其格式不再反映实例字段。\n\n### 9.5.4. `readExternal` 和 `writeExternal` 方法\n\
  \n与其让序列化机制保存和恢复对象数据，不如类可以定义它自己的的机制。要做到这一点，类必须实现 `Externalizable` 接口。这又要求它定义两个方法：\n\
  \n```java\npublic void readExternal(ObjectInputStream in)\n      throws IOException\n\
  \npublic void writeExternal(ObjectOutputStream out)\n      throws IOException\n\
  ```\n\n与 `readObject` 和 `writeObject` 方法不同，这些方法完全负责保存和恢复整个对象，*包括父类数据*。在写入对象时，序列化机制仅在输出流中记录对象的类。在读取一个可外部化（externalizable）对象时，对象输入流会使用无参构造函数创建一个对象，然后调用\
  \ `readExternal` 方法。\n\n你可以加密数据，或者使用比序列化格式更高效的格式。\n\n在这个示例中，`LabeledPixel` 类扩展了可序列化的\
  \ `Point` 类，但它接管了类及其父类的序列化。对象的字段没有存储在标准的序列化格式中。相反，数据被放置在一个透明数据块中。\n\n```java\npublic\
  \ class LabeledPixel extends Point implements Externalizable {\n\n    private String\
  \ label;\n\n    public LabeledPixel() {} // externalizable 类需要\n\n    @Override\
  \ public void writeExternal(ObjectOutput out)\n            throws IOException {\n\
  \n        out.writeInt((int) getX());\n\n        out.writeInt((int) getY());\n\n\
  \        out.writeUTF(label);\n\n    }\n\n    @Override public void readExternal(ObjectInput\
  \ in)\n            throws IOException, ClassNotFoundException {\n\n        int x\
  \ = in.readInt();\n\n        int y = in.readInt();\n\n        setLocation(x, y);\n\
  \n        label = in.readUTF();\n\n    }\n\n    . . .\n\n}\n```\n\n#### Note\n`readExternal`\
  \ 和 `writeExternal` 方法不应该带有 `@Serial` 注解。由于它们定义在 `Externalizable` 接口中，你可以简单地为它们加上\
  \ `@Override` 注解。\n\n### 注意\n与私有的且只能由序列化机制调用的 `readObject` 和 `writeObject` 方法不同，`readExternal`\
  \ 和 `writeExternal` 方法是公共的。特别是，`readExternal` 允许修改现有对象的状态。\n\n### 9.5.5. `readResolve`\
  \ 和 `writeReplace` 方法\n\n我们认为认为对象只能通过构造函数进行构造。然而，反序列化的对象*并不是被构造的*。它的实例变量仅仅是从对象流中恢复的。\n\
  \n如果构造函数强制执行某些条件，就会出现问题。例如，单例对象的实现可能使得构造函数只能被调用一次。另一个例子是，数据库实体的构造可以确保它们始终来自受管理的实例池。\n\
  \n你不应该为单例实现自己的机制。如果你需要一个单例，请定义一个包含一个实例的枚举类型，该实例按照惯例称为 `INSTANCE`。\n\n```java\npublic\
  \ enum PersonDatabase {\n\n    INSTANCE;\n\n    public Person findById(int id) {\
  \ ... }\n\n    ...\n\n}\n```\n\n这之所以有效，是因为 `enum` 保证被正确地反序列化。\n\n现在，假设你处于一种罕见的情况，想要控制每个反序列化实例的标识。例如，假设\
  \ `Person` 类希望在反序列化时从数据库恢复其实例。那么，不要序列化对象本身，而是序列化一个可以定位或构造对象的代理。提供一个 `writeReplace`\
  \ 方法来返回代理对象：\n\n```java\npublic class Person implements Serializable {\n\n     private\
  \ int id;\n\n     // 其他实例变量\n\n     ...\n\n     @Serial private Object writeReplace()\
  \ {\n\n         return new PersonProxy(id);\n     }\n\n}\n```\n\n当 `Person` 对象被序列化时，它的没有任何实例变量都没有被保存。相反，会调用\
  \ `writeReplace` 方法，并且*返回值*会被序列化并写入流中。\n\n代理类需要实现一个 `readResolve` 方法以产生一个 `Person`\
  \ 实例：\n\n\n\n\n\n```java\nclass PersonProxy implements Serializable {\n\n    private\
  \ int id;\n\n    public PersonProxy(int id) {\n        this.id = id;\n    }\n\n\
  \    @Serial private Object readResolve() {\n        return PersonDatabase.INSTANCE.findById(id);\n\
  \    }\n}\n```\n\n当 `readObject` 方法在 `ObjectInputStream` 中找到 `PersonProxy` 时，它会反序列化该代理，调用其\
  \ `readResolve` 方法并返回结果。\n\n### 注意\n与 `readObject` 和 `writeObject` 方法不同，`readResolve`\
  \ 和 `writeReplace` 方法不需要是私有的。\n\n### 注意\n对于枚举（enumerations）和记录（records），`readObject/writeObject`\
  \ 或 `readExternal/writeExternal` 方法不用于序列化。对于记录但不对于枚举，将使用 `writeReplace` 方法。\n\n\
  ### 9.5.6. 版本控制\n\n序列化旨在将对象从一个虚拟机发送到另一个虚拟机，或用于状态短期持久化。如果你将序列化用于长期持久化，或者在序列化和反序列化之间类可能会发生变化，你需要考虑当类演进时会发生什么。版本\
  \ 2 能读取旧数据吗？仍在使用版本 1 的用户能读取新版本产生的文件吗？\n\n序列化机制支持简单的版本控制方案。当对象被序列化时，类名和其 `serialVersionUID`\
  \ 都会被写入对象流。该唯一标识符由实现者通过定义实例变量来分配：\n\n```java\n@Serial private static final long\
  \ serialVersionUID = 1L; // Version 1\n```\n\n当类以不兼容的方式进行演进时，实现者应该更改 UID。每当反序列化对象的\
  \ UID 不匹配时，`readObject` 方法就会抛出 `InvalidClassException`。\n\n如果 `serialVersionUID`\
  \ 匹配，即使实现发生了发生了变化，反序列化也会继续。只要名称和类型匹配，被读取的对象的每个非瞬态（nontransient）实例变量都将被设置为序列化状态中的值。所有其他实例变量都将设置为默认值：对象引用为\
  \ `null`，数字为 `0`，`boolean` 值为 `false`。序列化状态中在待读对象不存在的任何内容都会被忽略。\n\n这个过程安全吗？只有类的实现者才能确定。如果是安全的，那么实现者应该给新版本的类分配与旧版本相同的\
  \ `serialVersionUID`。\n\n如果你没有分配 `serialVersionUID`，系统将通过对实例变量、方法和父类型的规范描述进行哈希自动生成一个。你可以使用\
  \ `serialver` 工具查看哈希值。命令：\n\n```\nserialver ch09.sec05.Employee\n```\n\n显示：\n\n\
  ```java\nprivate static final long serialVersionUID = -4932578720821218323L;\n```\n\
  \n当类的实现发生变化时，哈希值发生变化的概率非常高。\n\n如果你需要能够读取旧版本的实例，并且你确定这样做是安全的，请在旧版本的类上运行 `serialver`\
  \ 并将结果添加到新版本中。\n\n### 注意\n如果你想实现更复杂的版本控制方案，可以重写 `readObject` 方法并调用 `readFields`\
  \ 方法，而不是 `defaultReadObject` 方法。你将获得流中找到的所有字段的描述，并可以对它们进行任何你想要的操作。\n\n### 注意\n枚举和记录忽略\
  \ `serialVersionUID` 字段。枚举始终拥有为 `0L` 的 `serialVersionUID`。你可以声明记录的 `serialVersionUID`，但反序列化时这些\
  \ ID 不需要匹配。\n\n### 注意\n在本节中，你看到了当读取器的类版本包含对象流中不存在的实例变量时发生的情况。在类演进过程中，也可能添加父类。这时，使用新版本的读取器可能会读取一个对象流，其中父类的实例变量未被设置。默认情况下，这些字段被设置为它们的零/`false`/`null`\
  \ 默认值。这可能导致父类处于不安全状态。父类可以通过定义一个初始化方法来防止该问题：\n\n```java\n@Serial private void readObjectNoData()\
  \ throws ObjectStreamException\n```\n\n该方法应该设置与无参构造函数相同的状态，或者抛出 `InvalidObjectException`。它只在读取的对象流包含一个缺少父类数据的子类实例这种“不寻常”的情况下才被调用。\n\
  \n### 9.5.7. 反序列化与安全\n\n在可序列化类的反序列化期间，对象的创建不会调用该类的任何构造函数。即使该类有一个无参构造函数，它也不会被使用。字段值直接从对象输入流的值中设置。\n\
  \n### 注意\n对于可序列化的 `records`，反序列化会调用规范构造函数，并从对象输入流传递组件的值。（作为结果，记录中的循环引用不会被恢复。）\n\n\
  绕过构造过程是一个安全风险。攻击者可以伪造字节来描述一个永远无法构造的无效对象。例如，假设 `Employee` 构造函数在带有负工资调用时会抛出异常。我们希望认为这意味着没有任何\
  \ `Employee` 对象可以具有负工资。但检查序列化对象的字节并修改其中一些字节并不困难。通过这种方式，人们可以为一个具有负工资的员工伪造字节，然后对其进行反序列化。\n\
  \n可序列化类可以可选地实现 `ObjectInputValidation` 接口并定义 `validateObject` 方法以检查其对象是否被正确反序列化。例如，`Employee`\
  \ 类可以检查工资是否为负：\n\n```java\npublic void validateObject() throws InvalidObjectException\n\
  \n{\n   System.out.println(\"validateObject\");\n   if (salary < 0)\n      throw\
  \ new InvalidObjectException(\"salary < 0\");\n}\n```\n\n遗憾的是，该方法不会被自动调用。为了调用它，你必须提供以下方法：\n\
  \n```java\n@Serial private void readObject(ObjectInputStream in) throws IOException,\
  \ ClassNotFoundException {\n   in.registerValidation(this, 0);\n   in.defaultReadObject();\n\
  }\n```\n\n该对象会被调度进行验证，当该对象及其所有依赖对象都加载后，就会调用 `validateObject` 方法。第二个参数允许你指定优先级。优先级较高的验证请求先执行。\n\
  \n还有其他安全风险。攻击者可以创建消耗足够资源导致虚拟机崩溃的数据结构。更险的是，类路径上的任何类都可以被反序列化。黑客们一直在狡猾地组合“getget 链”（gadget\
  \ chains），即各种工具类中利用反射的操作序列，最终调用带有他们选择的字符串的 `Runtime.exec` 等方法。任何通过网络连接从不可信源接收序列化数据的应用程序都会受到此类攻击。例如，某些服务器序列化会话数据并反序列化\
  \ HTTP Session cookie 返回的任何数据。\n\n你应该避免反序列化来自不可信源的任意数据。在会话数据的示例中，服务器应对数据进行签名，仅对签名有效的数据进行反序列化。\n\
  \n*序列化过滤器*（serialization filter）机制可以增强应用程序免受此类攻击。过滤器可以看到被反序列化的类名以及若干指标（流大小、数组大小、引用总数、最引用链）。基于这些数据，可以中止反序列化。\n\
  \n在最简单的形式，你提供一个描述有效和无效类的模式。例如，如果你如下启动我们的示例序列化演示：\n\n```\njava -Djdk.serialFilter='serial.*;java.**;!*'\
  \ serial.ObjectStreamTest\n```\n\n\n\n\n随后对象将被加载。该过滤器允许 `serial` 包中的所有类以及所有包名以 `java`\
  \ 开头的类，但不再允许其他任何类。如果你不允许 `java.**`，或者至少不允许 `java.util.Date`，反序列化就会失败。\n\n你可以将过滤器模式放入配置文件，并为不同的用途指定多个过滤器。你也可以实现自己的过滤器。详情请参阅[`https://docs.oracle.com/en/java/javase/17/core/serialization-filtering1.html`](https://docs.oracle.com/en/java/javase/17/core/serialization-filtering1.html)。\n\
  \n### 练习\n\n1. 编写一个实用方法，将整个 `InputStream` 复制到 `OutputStream`，且不使用任何临时文件。提供另一种解决方案，不使用循环，使用\
  \ `Files` 类的操作和临时文件。\n\n2. 编写一个程序读取文本文件并生成一个同名但扩展名为 `.toc` 的文件，该文件包含输入文件中所有单词的字母顺序列表，以及每个单词出现的行号列表。假设文件编码为\
  \ UTF-8。\n\n3. 编写一个程序读取一个包含文本的文件，并假设大多数单词是英语，猜测其编码是 `ASCII`、`ISO 8859-1`、`UTF-8`\
  \ 还是 `UTF-16`；如果是后者，使用的是哪种字节序。\n\n4. 使用 `Scanner` 很方便，但比使用 `BufferedReader` 慢一点。在大文件中逐行读取并统计输入行数，分别使用\
  \ (a) `Scanner` 和 `hasNextLine/nextLine`，(b) `BufferedReader` 和 `readLine$，(c) `BufferedReader`\
  \ 和 `lines`。哪种最快？哪种最方便？\n\n5. 当具有部分 Unicode 覆盖的 `Charset` 编码器无法编码某个字符时，它会替换为默认值——通常（并非总是）是编码\
  \ `\"?\"。找到所有支持编码的可用字符集的替换字符。使用 `newEncoder` 方法获取编码器，并调用其 `replacement` 方法获取替换字符。对于每个唯一结果，报告使用该结果的字符集规范。\n\
