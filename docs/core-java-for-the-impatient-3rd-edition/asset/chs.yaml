  \ 使用接口\n\n在前两个章节中，我使用了 `Random` 类来演示如何调用构造函数和方法。当 `Random` 类在 Java 1.0 中被首次设计时，它反映了当时的技术水平。如今，已知有许多产生伪随机数的算法。`java.util.random`\
  \ 包提供了具有各种权衡的强算法实现。根据你的需求，你可能需要在 `L64X128MixRandom`、`Xoroshiro128PlusPlus` 或另一个具有类似名称的算法之间选择。（该包的\
  \ API 文档提供了关于选择哪种算法的有用建议。）有趣的是，API 并没有为每个算法暴露单独的类。这是一个好事。每当你从一种算法切换到另一种算法时，修改程序将很麻烦。而且这是没必要的——所有的生成器都拥有相同的方法集：`nextInt`、`nextDouble`\
  \ 等。\n\n相反，这些方法属于一个 `RandomGenerator` 接口。接口定义了支持的方法——在这里是 `nextInt`、`nextDouble`\
  \ 等。一旦你拥有一个 `implements` 该接口的类的实例，你就可以调用这些方法：\n\n```\nRandomGenerator generator\
  \ = RandomGenerator.of(\"L64X128MixRandom\");\n\nint dieToss = 1 + generator.nextInt(6);\n\
  \ndouble randomPercentage = 100 * generator.nextDouble();\n```\n\n静态方法 `RandomGenerator.of`\
  \ 获取某个类的对象，调用者不知道该类的确切类型。已知的是该类拥有 `RandomGenerator` 接口的所有方法。有了这些知识，你就可以高效地使用该对象。\n\
  \n### 3.1.2 声明接口\n\n在本节中，你将学习如何声明你自己的接口。让我们考虑一种不同的。接口规定了实现类必须提供的一组方法。接口是任何实现类的超类型。因此，可以将类的实例赋值给接口类型的变量。接口可以包含静态方法。接口的所有变量自动为\
  \ `public`、`static` 且 `final`。接口可以包含默认方法，实现类可以继承或重写这些方法。接口可以包含私有方法，实现类无法调用或重写。`Comparable`\
  \ 和 `Comparator` 接口用于比较对象。如果你需要测试对象是否符合某个子类型，请使用 `instanceof` 运算符，最好使用其“模式匹配”形式。函数式接口是一个只有一个抽象方法的接口。Lambda\
  \ 表达式表示一个可以在以后某个时刻执行的代码块。Lambda 表达式会被转换为函数式接口。方法和构造函数引用指向方法或构造函数，但不调用它们。Lambda 表达式和局部类可以访问闭包作用域中的有效最终变量变量。\n\
  \n（注：原文后半部分存在严重的重复和格式错误，以下为基于核心内容的清理翻译）\n\n`interface` 是一种用于规定双方之间合同的机制：服务的提供者以及希望其对象可用于服务的类。在接下来的章节中，你将看到如何在\
  \ Java 中定义和使用接口。\n\n### 3.1.1 使用接口\n\n...（省略重复部分，直接进入实现）\n\n```java\npublic interface\
  \ IntSequence {\n\n    boolean hasNext();\n\n    int next();\n}\n```\n\n### 3.1.3\
  \ 实现接口\n\n现在让我们看看硬币的另一面：那些希望用于 `average` 方法的类。它们需要 `implement` `IntSequence` 接口。这里有这样一个类：\n\
  \n```java\npublic class SquareSequence implements IntSequence {\n    private int\
  \ i;\n\n    public boolean hasNext() {\n        return true;\n    }\n\n    public\
  \ int next() {\n        i++;\n        return i * i;\n    }\n}\n```\n\n有无限多个平方数，该类的对象可以一次提供它们中的任意一个。（为了保持示例简单，我们忽略了整数溢出——见练习\
  \ 6。）\n\n`implements` 关键字表示 `SquareSequence` 类意图符合 `IntSequence` 接口。\n\n> 注意\n实现类必须将接口的方法声明为\
  \ `public`。否则，它们将默认为包级访问。由于接口要求公共访问，编译器将报告错误。\n\n这段代码获取前 100 个平方数的平均值：\n\n```java\n\
  var squares = new SquareSequence();\n\ndouble avg = average(squares, 100);\n```\n\
  \n有很多类可以实现 `IntSequence` 接口。例如，这个类产生一个有限序列，即正整数的数字，从最低位开始：\n\n```java\npublic class\
  \ DigitSequence implements IntSequence {\n    private int number;\n\n    public\
  \ DigitSequence(int n) {\n        number = n;\n    }\n\n    public boolean hasNext()\
  \ { // 此方法和后续方法在接口中声明\n        return number != 0;\n    }\n\n    public int next()\
  \ {\n        int result = number % 10;\n        number /= 10;\n        return result;\n\
  \    }\n\n    public int rest() { // 此方法在接口中声明\n        return number;\n    }\n\
  }\n```\n\n\n\n\n一个 `new DigitSequence(1729)` 对象在 `hasNext` 返回 `false` 之前会交付数字 `9\
  \ 2 7 1`。\n\n注意\n\n`SquareSequence` 和 `DigitSequence` 类实现了 `IntSequence` 接口的所有方法。如果一个类只实现部分方法，则它必须使用\
  \ `abstract` 修饰符对其进行声明。关于抽象类的更多信息，请参阅第 4 章。\n\n### 3.1.4. 转换为接口类型\n\n这段代码片段计算了数字序列值的平均值：\n\
  \n```\nIntSequence digits = new DigitSequence(1729);\n\ndouble avg = average(digits,\
  \ 100);\n\n// 只会查看前四个序列值\n```\n\n观察 `digits` 变量。它的类型是 `IntSequence`，而不是 `DigitSequence`。类型为\
  \ `IntSequence` 的变量引用实现了 `IntSequence` 接口的某个类的对象。你始终可以将对象赋值给类型为已实现接口的变量，或者将其传递给期望该接口的方法。\n\
  \n这里有一些实用的术语。当子类型的任何值都可以在无需转换的情况下赋值给超类型的变量时，类型 `S` 就是类型 `T`（子类型）的**超类型**（supertype）。例如，`IntSequence`\
  \ 接口是 `DigitSequence` 类的超类型。\n\n注意\n\n尽管可以声明接口类型的变量，但你永远无法拥有类型为接口的对象。所有对象都是类的实例。\n\
  \n### 3.1.5. 强制类型转换与 `instanceof` 运算符\n\n有时，你需要相反的转换——从超类型到子类型。这时你使用**强制转换**（cast）。例如，如果你恰好知道存储在\
  \ `IntSequence` 中的对象实际上是 `DigitSequence`，你可以这样转换类型：\n\n```\nIntSequence sequence\
  \ = ...;\n\nDigitSequence digits = (DigitSequence) sequence;\n\nSystem.out.println(digits.rest());\n\
  ```\n\n在这种情况下，强制转换是必要的，因为 `rest` 是 `DigitSequence` 的方法，而不是 `IntSequence` 的方法。\n\n\
  请参见练习 2 以获得更有说服力的例子。\n\n你只能将对象强制转换为其其实际类或其超类型之一。如果你错了，就会发生编译时错误或类转换异常（class cast\
  \ exception）：\n\n```\nString digitString = (String) sequence;\n\n// 不可能成功——IntSequence\
  \ 不是 String 的超类型\n\nRandomSequence randoms = (RandomSequence) sequence;\n\n// 可能成功，如果不符合则会抛出类转换异常\n\
  ```\n\n为了避免异常，你可以先使用 `instanceof` 运算符测试该对象是否属于目标类型。表达式\n\n```\nobject instanceof\
  \ Type\n```\n\n如果 `object` 是一个以 `Type` 为超类型的类的实例，则该表达式返回 `true`。在使用强制转换之前进行此项检查是一个好主意。\n\
  \n```\nif (sequence instanceof DigitSequence) {\n\n    DigitSequence digits = (DigitSequence)\
  \ sequence;\n\n    ...\n\n}\n```\n\n注意\n\n`instanceof` 运算符是 `null` 安全的：如果 `obj`\
  \ 为 `null`，则表达式 `obj instanceof Type` 为 `false`。毕竟，`null` 绝不可能是任何给定类型对象的引用。\n\n\
  ### 3.1.6. `instanceof` 的“模式匹配”形式\n\n由于“`instanceof` 和强制转换”这种惯用法非常常见，因此有一个方便的快捷方式，称为\
  \ `instanceof` 模式匹配：\n\n```\nif (sequence instanceof DigitSequence digits) {\n\n\
  \    //在这里，你可以使用 digits 变量\n\n    ...\n\n}\n```\n\n在这个示例中，`digits` 变量包含了被强制转换为 `DigitSequence`\
  \ 的 `sequence` 引用。然而，如果 `sequence` 不是 `DigitSequence` 的实例，则不会声明变量，且不会执行 `if` 主体。\n\
  \n无用的 `instanceof` 模式是一个错误：\n\n```\nDigitSequence digits = ...;\n\nif (digits instanceof\
  \ IntSequence seq) ... // 错误——显然它是一个 IntSequence\n```\n\n注意\n\n同样无用的\n\n```\nif\
  \ (digits instanceof IntSequence) ...\n```\n\n是允许的，为了与 Java 1.0 向后兼容。\n\n当 `instanceof`\
  \ 模式引入一个变量时，你可以在同一个表达式中立即使用它：\n\n```\nIntSequence sequence = ...;\n\nif (sequence\
  \ instanceof DigitSequence digits && digits.rest() >= 100) ...\n```\n\n这之所以有效，是因为\
  \ `&&` 表达式的右侧只有在左侧为 `true` 时才会被求值。如果求值了右侧，则 `digits` 已经绑定到了 `DigitSequence` 实例。\n\
  \n然而，以下是编译时错误：\n\n```\nif (sequence instanceof DigitSequence digits || digits.rest()\
  \ >= 100) ... // 错误\n```\n\n当 `||` 的左侧为 `false` 时会执行右侧，此时没有内容绑定到变量 `digits`。\n\n\
  这里是另一个使用条件运算符的例子：\n\n```\ndouble rest = sequence instanceof DigitSequence digits\
  \ ? digits.rest() : 0;\n```\n\n变量 `digits` 定义在 `?` 之后的子表达式中，但未定义 `:` 之后的子表达式中。\n\
  \n注意\n\n这种声明变量的 `instanceof` 形式被称为“模式匹配”（pattern matching），因为它与 `switch` 中的类型模式（type\
  \ patterns）相似，这是 Java 17 的一项“预览”功能。我不会详细讨论预览性功能，但这里有一个语法的示例：\n\n```\nString description\
  \ = switch (sequence) {\n\n    case DigitSequence digits -> \"digit sequence \"\
  \ + digits.rest();\n\n    case SquareSequence squares -> \"square sequence\";\n\n\
  \    default -> \"other sequence\";\n\n}\n```\n\n### 3.1.7. 接口的扩展\n\n接口可以扩展另一个接口，在原有接口的基础上提供额外的方法。例如，`Closeable`\
  \ 是一个有一个方法的接口：\n\n```\npublic interface Closeable {\n\n    void close();\n}\n```\n\
  \n正如你在第 5 章中看到的，这是一个发生异常时关闭资源的接口。\n\n`Channel` 接口扩展了这个接口：\n\n```\npublic interface\
  \ Channel extends Closeable {\n\n    boolean isOpen();\n}\n```\n\n实现 `Channel` 接口的类必须提供这两个方法，并且它可以转换为这两个接口类型。\n\
  \n### 3.1.8. 实现多个接口\n\n类可以实现任意数量的接口。例如，一个从文件读取整数的 `FileSequence` 类除了 `IntSequence`\
  \ 之外还实现了 `Closeable`：\n\n```\npublic class FileSequence implements IntSequence,\
  \ Closeable {\n\n    ...\n}\n```\n\n那么 `FileSequence` 类拥有 `IntSequence` 和 `Closeable`\
  \ 超类型。\n\n### 3.1.9. 常量\n\n接口中定义的任何变量都是 `public static final`。\n\n例如，`SwingConstants`\
  \ 接口定义了方向的常量：\n\n```java\npublic interface SwingConstants {\n\n    int NORTH = 1;\n\
  \n    int NORTH_EAST = 2;\n\n    int EAST = 3;\n\n    ...\n}\n```\n\n你可以通过限定名称引用它们，即\
  \ `SwingConstants.NORTH`。如果你的类选择了实现 `SwingConstants` 接口，你可以省略 `SwingConstants` 限定符直接写\
  \ `NORTH`。然而，这并不是常见的惯用法。对于常量集，使用枚举要好得多；参见第 4 章。\n\n注意\n\n接口中不能有实例变量。接口规范行为而非对象状态。\n\
  \n### 3.2. 静态、默认和私有方法\n\n在 Java 早期版本中，接口的所有方法都必须是抽象的——没有方法体。现在你可以添加三种具有具体实现的方法：静态方法、默认方法和私有方法。接下来的章节将描述这些方法。\n\
  \n### 3.2.1. 静态方法\n\n技术上接口从未不能拥有静态方法，但它们不符合接口作为抽象规范的观点。这种想法现在已经演变。特别是工厂方法在接口中非常有意义。例如，`IntSequence`\
  \ 接口可以有一个静态方法 `digitsOf`，用于生成给定整数的数字序列：\n\n```\nIntSequence digits = IntSequence.digitsOf(1729);\n\
  ```\n\n\n\n\n该方法产生一个实现了 `IntSequence` 接口的类实例，但调用者无需关心具体是哪一个。\n\n```java\n public\
  \ interface IntSequence {\n\n    ...\n\n    static IntSequence digitsOf(int n) {\n\
  \n        return new DigitSequence(n);\n\n    }\n}\n```\n\n### 注意事项\n在过去，将静态方法放在伴侣类中是常见的做法。在\
  \ Java API 中，你会发现接口和工具类的成对，例如 `Collection`/`Collections` 或 `Path`/`Paths`。这种划分不再是必要的。\n\
  \n### 3.2.2. 默认方法\n你可以为任何接口方法提供一个 `default` 实现。你必须使用 `default` 修饰符来标记此类方法。\n\n```java\n\
  \ public interface IntSequence {\n\n    default boolean hasNext() { return true;\
  \ }\n\n        // 默认情况下，序列是无限的\n\n    int next();\n\n}\n```\n\n实现此接口的类可以选择重写 `hasNext`\
  \ 方法，也可以继承默认实现。\n\n### 注意事项\n默认方法结束了一种经典模式，即提供一个接口和一个实现其大部分或所有方法的伴侣类，例如 Java API\
  \ 中的 `Collection`/`AbstractCollection` 或 `WindowListener`/`WindowAdapter`。现在你只需要在接口中实现方法即可。\n\
  \n默认方法的一个重要用途是*接口演进*。考虑例如在 Java 中存在多年的 `Collection` 接口。假设在很久以前，你提供了一个类：\n\n```java\n\
  public class Bag implements Collection\n```\n\n后来在 Java 8 中，接口增加了一个 `stream` 方法。\n\
  \n假设 `stream` 方法不是默认方法。那么 `Bag` 类将无法编译，因为它没有实现这个新方法。在接口中添加非默认方法不是*源码兼容*的。\n\n但假设你没有重新编译该类，而是直接使用包含它的旧\
  \ JAR 文件。即使缺少该方法，类仍然可以加载。程序仍然可以创建 `Bag` 实例，且不会发生任何问题。（向接口中添加方法是`二进制兼容`的。）然而，如果一个程序在\
  \ `Bag` 实例上调用 `stream` 方法，就会发生 `AbstractMethodError`。\n\n将该方法设为 `default` 方法解决了这两个问题。`Bag`\
  \ 类将能够再次编译。如果该类在没有重新编译的情况下被加载，并且在 `Bag` 实例上调用了 `stream` 方法，则会调用 `Collection.stream`\
  \ 方法。\n\n### 3.2.3. 解析默认方法冲突\n如果一个类实现了两个接口，其中一个有一个默认方法，另一个接口具有相同名称和参数类型的方法（无论是否是默认方法），你必须解决这个冲突。这种情况并不经常发生，而且处理起来通常很容易。\n\
  \n让我们来看一个例子。假设我们有一个接口 `Person`，它包含一个 `getId` 方法：\n\n```java\n public interface Person\
  \ {\n\n    String getName();\n\n    default int getId() { return 0; }\n\n}\n```\n\
  \n假设有另一个接口 `Identified`，它也有类似的方法。\n\n```java\n public interface Identified {\n\n\
  \    default int getId() {\n\n    return Math.abs(hashCode()); }\n\n}\n```\n\n你将在第\
  \ 4 章中看到 `hashCode` 方法的作用。目前，重要的是它返回一个派生自对象的整数。\n\n如果你形成了一个同时实现这两个接口的类，会发生什么？\n\n\
  ```java\n public class Employee implements Person, Identified {\n\n    ...\n\n}\n\
  ```\n\n该类继承了由 `Person` 和 `Identified` 接口提供的两个 `getId` 方法。Java 编译器无法在两者之间选择一个。编译器会报告错误，并将解决歧义的任务留给给你。在\
  \ `Employee` 类中提供一个 `getId` 方法，并实现你自己的 ID 方案，或者委托给冲突方法中的其中一个，如下：\n\n```java\n public\
  \ class Employee implements Person, Identified {\n\n    public int getId() { return\
  \ Identified.super.getId(); }\n\n    ...\n\n}\n```\n\n### 注意事项\n`super` 关键字允许你调用超类型方法。在这种情况下，我们需要指定想要用哪个超类型。这种语法看起来可能有点奇怪，但它与你在第\
  \ 4 章中看到的调用父类方法的语法是一致的。\n\n现在假设 `Identified` 接口没有为 `getId` 提供默认实现：\n\n```java\n\
  \ interface Identified {\n\n    int getId();\n\n}\n```\n\n`Employee` 类可以继承来自 `Person`\
  \ 接口的默认方法吗？乍一看，这似乎是合理的。但编译器如何知道 `Person.getId` 方法是否真的实现了 `Identified.getId` 预期的功能呢？毕竟，它返回的可能是人的弗洛伊德\
  \ id 层级，而不是 ID 号。\n\nJava 的设计者选择了安全和统一。两个接口如何冲突并不重要；只要至少有一个接口提供了实现，编译器就会报告错误，并由程序员来解决歧义。\n\
  \n### 注意事项\n如果两个接口都没有为共享方法提供默认实现，那么不存在冲突。实现类有两个选择：实现该方法，或者将其留为未实现并将类声明为`abstract`。\n\
  \n### 注意事项\n如果一个类继承自一个父类（参见第 4 章\n\nstatic of(int a, int b)\n\nstatic of(int a,\
  \ int b, int c)\n```\n\n那么这些方法都可以调用一个辅助方法：\n\n```java\nprivate static IntSequence\
  \ makeFiniteSequence(int... values) { ... }\n```\n\n### 3.3 接口示例\n乍一看，接口似乎并没有做什么。接口仅仅是类承诺实现的方法集。为了让接口的重要性更加具体，接下来的章节将展示\
  \ Java API 中的四个常用接口示例。\n\n### 3.3.1. Comparable 接口\n假设你想对数组进行排序。排序算法反复比较元素，如果顺序不对则进行重新排列。当然，比较的规则对于每个类都是不同的，排序算法应该只调用类提供的方法。只要所有类对该方法的名称达成一致，排序算法就能完成工作。这就是接口大显身的地方。\n\
  \n如果一个类想要对其对象启用排序，它应该实现 `Comparable` 接口。关于这个接口有一个技术点。我们想要比较字符串之间、员工之间，以及等等。因此，`Comparable`\
  \ 接口有一个类型参数。\n\n```java\n public interface Comparable<T> {\n\n    int compareTo(T\
  \ other);\n\n}\n```\n\n例如，`String` 类实现了 `Comparable<String>`，以便其 `compareTo` 方法的签名变为：\n\
  \n```java\nint compareTo(String other)\n```\n\n### 注意事项\n带有类型参数（如 `Comparable` 或\
  \ `ArrayList`）的类型是泛型类型。你将在第 6 章中学习关于泛型类型的全部知识。\n\n\n\n当调用 `x.compareTo(y)` 时，`compareTo`\
  \ 方法返回一个整数值，指示 `x` 或 `y` 应该排在前面。返回正值（不一定是 `1`）表示 `x` 应该在 `y` 之后。当 `x` 应该在 `y` 之前时，返回一个负整数（不一定是\
  \ `-1`）。如果 `x` 和 `y` 被认为相等，则返回值为 `0`。\n\n请注意，返回值可以是任何整数。这种灵活性非常有用，因为它允许你返回两个整数之间的差值。只要差值不会产生整数溢出，这种方法非常方便。\n\
  \n```\n public class Employee implements Comparable<Employee> {\n\n    ...\n\n \
  \   public int compareTo(Employee other) {\n\n        return getId() - other.getId();\
  \ // 如果 ID 始终 ≥ 0，则可行\n\n    }\n\n}\n```\n\n### 注意事项\n\n返回整数的差值并不总是有效。对于符号相反的大操作数，差值可能会溢出。在这种情况下，请使用\
  \ `Integer.compare` 方法，它对所有整数都能正常工作。不过，如果你知道整数是非负的，或者它们的绝对值小于 `Integer.MAX_VALUE\
  \ / 2`，那么使用差值就可以了。\n\n在比较浮点值时，你不能直接返回差值。相反，请使用静态方法 `Double.compare`。即使对于 `±∞` 和\
  \ `NaN` 它也能正确处理。\n\n以下是 `Employee` 类如何实现 `Comparable` 接口，按工资对员工进行排序：\n\n```\n public\
  \ class Employee implements Comparable<Employee> {\n\n    ...\n\n    public int\
  \ compareTo(Employee other) {\n\n        return Double.compare(salary, other.salary);\n\
  \n    }\n\n}\n```\n\n### 注意\n\n`compare` 方法访问 `other.salary` 是完全合。在 Java 中，方法可以访问所属类的任何对象的私有属性。\n\
  \n`String` 类以及 Java 库中的其他百多个类都实现了 `Comparable` 接口。你可以使用 `Arrays.sort` 方法对 `Comparable`\
  \ 对象的数组进行排序：\n\n```\nString[] names = { \"Peter\", \"Paul\", \"Mary\" };\n\nArrays.sort(names);\
  \ // names 现在是 [\"Mary\", \"Paul\", \"Peter\"]\n```\n\n### 注意\n\n奇怪的是，`Arrays.sort`\
  \ 方法在编译时并不检查参数是否是 `Comparable` 对象的数组。相反，如果它遇到没有实现 `Comparable` 接口的类的元素，会抛出异常。\n\n\
  ### 3.3.2. `Comparator` 接口\n\n现在假设我们想要按长度递增对字符串进行排序，而不是按字典顺序。我们无法让 `String` 类以两种方式实现\
  \ `compareTo` 方法——而且无论如何，`String` 类也不是由我们修改。\n\n为了处理这种情况，`Arrays.sort` 方法有第二个版本，其参数是一个数组和一个比较器——比较器是一个实现了\
  \ `Comparator<T>` 接口的类实例，该接口包含以下抽象方法：\n\n```\nint compare(T first, T second);\n\
  ```\n\n按长度比较字符串，定义一个实现 `Comparator<String>` 的类：\n\n```\n class LengthComparator\
  \ implements Comparator<String> {\n\n    public int compare(String first, String\
  \ second) {\n\n        return first.length() - second.length();\n\n    }\n\n}\n\
  ```\n\n要实际执行比较，你需要创建一个实例：\n\n```\nComparator<String> comp = new LengthComparator();\n\
  \nif (comp.compare(names[i], names[j]) > 0) ...\n```\n\n将此调用与 `names[i].compareTo(names[j])`\
  \ 进行对比。`compare` 方法是在比较器对象上调用的，而不是在字符串本身上。\n\n### 注意\n\n即使 `LengthComparator` 对象没有状态，你仍然需要创建一个实例。你需要该实例来调用\
  \ `compare` 方法——它不是一个静态方法。\n\n要对数组排序，将 `LengthComparator` 对象传递给 `Arrays.sort` 方法：\n\
  \n```\nString[] names = { \"Peter\", \"Paul\", \"Mary\" };\n\nArrays.sort(names,\
  \ new LengthComparator());\n```\n\n现在数组是 `[\"Paul\", \"Mary\", \"Peter\"]` 或 `[\"\
  Mary\", \"Paul\", \"Peter\"]`。\n\n你将在第 3.4.2 节 中看到如何使用 lambda 表达式更方便地使用 `Comparator`。\n\
  \n### 3.3.3. `Runnable` 接口\n\n在几乎处理器都有多个内核时代，你想让这些核心忙起来。你可能希望在单独的线程运行某些任务，或者将它们交给线程池执行。要定义任务，你需要实现\
  \ `Runnable` 接口。该接口只有一个方法。\n\n```\n class HelloTask implements Runnable {\n\n  \
  \  public void run() {\n\n        for (int i = 0; i < 1000; i++) {\n\n         \
  \   System.out.println(\"Hello, World!\");\n\n        }\n\n    }\n\n}\n```\n\n如果你想在新线程中执行此任务，请从\
  \ `Runnable` 创建线程并启动它。\n\n```\nRunnable task = new HelloTask();\n\nThread thread\
  \ = new Thread(task);\n\nthread.start();\n```\n\n现在 `run` 方法在单独的线程中执行，当前线程可以继续其他工作。\n\
  \n### 注意\n\n在第 10 章 中，你将看到执行 `Runnable` 的其他方法。\n\n### 注意\n\n还有一个 `Callable<T>` 接口，用于返回结果的任务。\n\
  \n### 3.3.4. 回调函数\n\n在图形界面中，你需要在用户点击按钮、选择菜单选项、拖动滑块时指定操作。这些操作通常被称为回调，因为当操作发生时，某些代码会被调用。\n\
  \n在 Java 的 GUI 中，使用了接口。例如，在 Swing 中使用以下接口：\n\n```\n public interface ActionListener\
  \ {\n\n    void actionPerformed(ActionEvent event);\n}\n```\n\n为了指定操作，实现：\n\n```\n\
  \ class ClickAction implements ActionListener {\n\n    public void actionPerformed(ActionEvent\
  \ event) {\n\n        System.out.println(\"Thanks for clicking!\");\n\n    }\n\n\
  }\n```\n\n然后创建该类的实例并添加到按钮：\n\n```\nvar button = new JButton(\"Click me!\");\n\n\
  button.addActionListener(new ClickAction());\n```\n\n### 注意\n\n由于它是 JDK 的一部分，我在示例中使用\
  \ Swing。（你不需要了解更多关于 Swing 的细节。）每个界面，无论是 Swing、JavaFX 还是 Android，都需要按钮一段想要运行的代码。\n\
  \n当然，这种定义按钮的方法相当繁琐。在其他语言中，你只需要给按钮一个函数，而无需经过创建类和实例化的过程。下一节将展示如何在 Java 中实现。\n\n###\
  \ 3.4. Lambda 表达式\n\nLambda 表达式是一个可以传递的代码块，稍后执行。在前面的章节中，你已经看到了许多需要指定此类代码块的情况：\n\n\
  - 向 `Arrays.sort` 传递比较方法\n- 在单独的线程中运行任务\n- 当用户点击按钮时发生的操作\n\n然而，Java 是一种面向对象的语言，其中（几乎）一切都是对象。Java\
  \ 没有函数类型。相反，函数表示为对象，即特定接口的类实例。Lambda 表达式为创建此类实例提供了方便的语法。\n\n### 3.4.1. Lambda 表达式的语法\n\
  \n再次考虑第 3.3.2 节 中的排序示例。我们传递代码检查一个字符串是否短于另一个。我们计算\n\n```\nfirst.length() - second.length()\n\
  ```\n\n`first` 和 `second` 是什么？它们都是字符串。Java 是一种强类型语言，我们也必须指定这一点：\n\n```\n(String\
  \ first, String second) -> first.length() - second.length()\n```\n\n你刚刚看到了第一个 Lambda\
  \ 表达式。这样的表达式仅仅是一个代码块，加上对传递给代码的变量的指定。\n\n\n\n\n## 为什么用这个名字？\n\n多年前，在计算机出现之前，逻辑学家埃隆佐·丘（Alonzo\
  \ Church）想要对数学函数的有效可计算性进行形式化。（有趣的是，已知某些函数存在，但没有人知道如何计算它们的值。）他使用希腊字母 `lambda` (λ)\
  \ 来标记参数，类似于：\n\n```\nλfirst.λsecond. first.length() - second.length()\n```\n\n###\
  \ 注意\n\n为什么使用字母 `λ`？是因为丘把字母表都用光了吗？实际上，备受推誉的*数学原理*（参见 [`http://plato.stanford.edu/entries/principia-mathematica`](http://plato.stanford.edu/entries/principia-mathematica)）使用了\
  \ `^` 符号来表示函数参数，这启发了丘使用大写的 lambda `Λ`，但最终他切换到了小写版本。从那时起，带有参数变量的表达式一直被称为 lambda 表达式（lambda\
  \ expression）。\n\n如果 lambda 表达式的主体执行的计算不适合单个表达式，请完全按照你编写方法的方式来编写它：封装在 `{}` 中，并带有显式的\
  \ `return` 语句。例如：\n\n```\n (String first, String second) -> {\n\n   int difference\
  \ = first.length() < second.length();\n\n   if (difference < 0) return -1;\n\n \
  \  else if (difference > 0) return 1;\n\n   else return 0;\n\n}\n```\n\n如果 lambda\
  \ 表达式没有参数，请提供空括号，就像无参数的方法一样：\n\n```\nRunnable task = () -> { for (int i = 0; i <\
  \ 1000; i++) doWork(); }\n```\n\n如果 lambda 表达式的参数类型可以推断，你可以省略它们。例如：\n\n```\n Comparator<String>\
  \ comp\n\n    = (first, second) -> first.length() - second.length();\n\n    // 等同于\
  \ (String first, String second)\n```\n\n在这里，编译器可以推导出 `first` 和 `second` 必须是字符串，因为该\
  \ lambda 表达式被赋值给了一个字符串比较器。（我们下一节中详细讨论这一赋值。）\n\n如果一个方法只有一个类型可推断的单一参数，你甚至可以省略括号：\n\
  \n```\n ActionListener listener = event ->\n\n    System.out.println(\"Thanks for\
  \ clicking!\");\n\n        // 代替 (event) -> 或 (ActionEvent event) ->\n```\n\n你永远不需要指定\
  \ lambda 表达式的结果类型。然而，编译器会从主体中推断结果并检查它是否符合预期类型。例如，该表达式：\n\n```\n(String first, String\
  \ second) -> first.length() - second.length()\n```\n\n可以使用在预期结果为 `int`（或兼容类型如 `Integer`、`long`\
  \ 或 `double`）的上下文。\n\n### 3.4.2. 函数式接口\n\n正如你所看到的，Java 中有很多表示动作的接口，例如 `Runnable`\
  \ 或 `Comparator`。lambda 表达式与这些接口兼容。\n\n每当需要具有*单个抽象方法*的接口对象时，你都可以提供一个 lambda 表达式。这种接口被称为函数式接口（functional\
  \ interface）。\n\n为了演示转换为函数式接口，考虑 `Arrays.sort` 方法。它的第二个参数需要 `Comparator` 实例，这是一个只有一个方法的接口。只需提供一个\
  \ lambda 即可：\n\n```\n Arrays.sort(names,\n\n    (first, second) -> first.length()\
  \ - second.length());\n```\n\n在底层，`Arrays.sort` 方法的第二个参数变量接收了一个实现了 `Comparator<String>`\
  \ 的某个类的对象。在该对象上调用 `compare` 方法会执行 lambda 表达式的主体。这些对象和类的管理完全取决于实现，并经过了高度优化。\n\n在大多数支持函数字面量的编程语言中，你可以声明类型如\
  \ `(String, String) -> int` 的函数类型，声明这些类型的变量，将函数放入这些变量中并调用它们。在 Java 中，你对 lambda 表达式*只有可以做一件事*：将其放入类型为函数式接口的变量中，这样它就会转换为该接口的实例。\n\
  \n### 注意\n\n你不能将 lambda 表达式赋值给 `Object` 类型的变量，`Object` 是 Java 中所有类的公共父类（参见第 4 章）。`Object`\
  \ 是类，而不是函数式接口。\n\nJava API 提供了大量的函数式接口（参见第 3.6.2 节）。其中之一是：\n\n```\n public interface\
  \ Predicate<T> {\n\n    boolean test(T t);\n\n    // 额外的默认和静态方法\n\n}\n```\n\n`ArrayList`\
  \ 类有一个 `removeIf` 方法，其参数是 `Predicate`。它专门设计为接收 lambda 表达式而设计。例如，以下语句从数组列表中删除所有 `null`\
  \ 值：\n\n```\nlist.removeIf(e -> e == null);\n```\n\n## 3.5. 方法引用和构造函数引用\n\n有时，已经有一个方法可以执行你想传递给其他代码的完全动作。*方法引用*（method\
  \ reference）有一种特殊的语法，比调用该方法的 lambda 表达式更短。构造函数也有类似的快捷方式。你将在接下来的章节中看到这两者。\n\n###\
  \ 3.5.1. 方法引用\n\n假设你想不分大小写对字符串进行排序。你可以调用：\n\n```\nArrays.sort(strings, (x, y) ->\
  \ x.compareToIgnoreCase(y));\n```\n\n而是你可以传递这个方法表达式：\n\n```\nArrays.sort(strings,\
  \ String::compareToIgnoreCase);\n```\n\n表达式 `String::compareToIgnoreCase` 是等价于 lambda\
  \ 表达式 `(x, y) -> x.compareToIgnoreCase(y)`。\n\n这是另一个例子。`Objects` 类定义了方法 `isNull`。调用\
  \ `Objects.isNull(x)` 只是返回 `x == null` 的值。这种情况似乎没必要专门方法，但它是被设计作为方法表达式传递的。调用：\n\n\
  ```\nlist.removeIf(Objects::isNull);\n```\n\n从列表中删除所有 null 值。\n\n另一个例子，假设你想打印列表的所有元素。`ArrayList`\
  \ 类有一个 `forEach` 方法，它将函数应用到每个元素。你可以调用：\n\n```\nlist.forEach(x -> System.out.println(x));\n\
  ```\n\n然而，如果可以直接将 `println` 方法传递给 `forEach` 方法会更好。这样做如下：\n\n```\nlist.forEach(System.out::println);\n\
  ```\n\n从这些示例可以看出，`::` 运算符将方法名与类或对象分开。有三种变体：\n\n1. *类*::*实例方法*\n2. *类*::*静态方法*\n\
  3. *对象*::*实例方法*\n\n在第一种情况下，第一个参数将成为方法的接收者，任何其他参数都传递给该方法。例如，`String::compareToIgnoreCase`\
  \ 等同于 `(x, y) -> x.compareToIgnoreCase(y)`。\n\n在第二种情况下，所有参数都传递给静态方法。方法表达式 `Objects::isNull`\
  \ 等同于 `x -> Objects.isNull(x)`。\n\n在第三种情况下，方法在给定对象上调用，参数被传递给实例方法。因此，`System.out::println`\
  \ 等同于 `x -> System.out.println(x)`。\n\n### 注意\n\n当存在多个同名的重载方法时，编译器会尝试根据上下文确定你指的是哪一个。例如，`println`\
  \ 方法有多个版本。当传递给 `ArrayList<String>` 的 `forEach` 方法时，选择了 `println(String)` 方法。\n\n\
  你可以在方法引用中捕获 `this` 参数。例如，`this::equals` 等同于 `x -> this.equals(x)`。\n\n### 注意\n\n\
  在内部类中，你可以捕获外部类的 `this` 引用，格式为 *包围类*.this::`*方法*。你也可以捕获 `super`——参见第 4 章。\n\n\n\n\
  \n构造方法引用与方法引用相似，区别在于方法名是 `new`。例如，`Employee::new` 是对 `Employee` 构造函数的引用。如果一个类有多个构造函数，则取决于上下文选择哪一个构造函数。\n\
  \n这里有一个使用此类构造引用的示例。假设你有一个字符串列表：\n\n```\nList<String> names = ...;\n```\n\n你想得到一个员工列表，每个名称对应一个员工。正如在第\
  \ 8 章中所示，你可以使用流（streams）来完成这一点，而无需循环：将列表转换为流，然后调用 `map` 方法。它会应用函数并收集所有结果。\n\n```\n\
  Stream<Employee> stream = names.stream().map(Employee::new);\n```\n\n由于 `names.stream()`\
  \ 包含 `String` 对象，编译器知道 `Employee::new` 指向构造函数 `Employee(String)`。\n\n你可以使用数组类型创建构造方法引用。例如，`int[]::new`\
  \ 是一个有一个参数的构造方法引用：即数组的长度。它等同于 lambda 表达式 `n -> new int[n]`。\n\n数组构造方法引用对于克服 Java\
  \ 的一个局限性非常有用：无法构造泛型数组。（详情参见第 6 章）。因此，像 `Stream.toArray` 这样的方法返回 `Object` 数组，而不是元素类型的数组：\n\
  \n```\nObject[] employees = stream.toArray();\n```\n\n但这并不尽人意。用户想要的是员工数组，而不是对象数组。为了解决这个问题，`toArray`\
  \ 的另一个版本接受构造方法引用：\n\n```\nEmployee[] staff = stream.toArray(Employee[]::new);\n\
  ```\n\n`toArray` 方法调用此构造函数来获取正确类型的数组。然后它填充并返回该数组。\n\n### 3.6. 处理 Lambda 表达式\n\n\
  到目前，你已经学习了如何产生 lambda 表达式并将其传递给期望函数式接口的方法。在接下来的章节中，你将看到如何编写可以消费 lambda 表达式自定义方法。\n\
  \n#### 3.6.1. 实现延迟执行\n\n使用 lambda 的意义在于*延迟执行*。毕竟，如果你现在就执行某些代码，你会直接执行，而不会将其封装在 lambda\
  \ 内部。延迟执行代码有很多原因，例如：\n\n- ![Images](img/sq.jpg) 在单独线程中运行代码\n- ![Images](img/sq.jpg)\
  \ 多次运行代码\n- ![Images](img/sq.jpg) 在算法的正确点运行代码（例如，排序中的比较操作）\n- ![Images](img/sq.jpg)\
  \ 在某些事件发生时运行代码（按钮被点击、数据到达等）\n- ![Images](img/sq.jpg) 仅在需要时运行代码\n\n让我们来看一个简单的例子。假设你想重复执行一个操作\
  \ `n` 次。操作和计数被传递给 `repeat` 方法：\n\n```\nrepeat(10, () -> System.out.println(\"Hello,\
  \ World!\"));\n```\n\n为了接受该 lambda，我们需要选择（或在极少数情况下提供）一个函数式接口。在这种情况下，我们可以直接使用 `Runnable`：\n\
  \n```java\npublic static void repeat(int n, Runnable action) {\n    for (int i =\
  \ 0; i < n; i++) action.run();\n}\n```\n\n**注意**\n\n这里是 Java API 的另一个示例。静态方法 `Arrays.setAll`\
  \ 对数组的所有元素应用 `IntFunction`，并用结果设置每个元素：\n\n```java\nvar squares = new int[10];\n\
  Arrays.setAll(squares, index -> index * index) // 将 squares 设置为 { 0, 1, 4, ...,\
  \ 81 }\n```\n\n注意，lambda 表达式体在调用 `action.run()` 时被执行。\n\n现在让这个例子变得复杂一点。我们想告诉操作它发生在哪一次迭代。为此，我们需要选择一个具有带有\
  \ `int` 参数和 `void` 返回值的函数式接口。与其自己实现，我强烈建议你使用下一节描述的标准接口之一。处理 `int` 值的标准接口是：\n\n```java\n\
  public interface IntConsumer {\n    void accept(int value);\n}\n```\n\n这里是改进后的 `repeat`\
  \ 方法：\n\n```java\npublic static void repeat(int n, IntConsumer action) {\n    for\
  \ (int i = 0; i < n; i++) action.accept(i);\n}\n```\n\n以及是调用它的方式：\n\n```java\nrepeat(10,\
  \ i -> System.out.println(\"Countdown: \" + (9 - i)));\n```\n\n#### 3.6.2. 选择函数式接口\n\
  \n在大多数函数式编程语言中，函数类型是*结构性的*。要指定将两个字符串映射到整数的函数，你使用类似于 `Function2<String, String, Integer>`\
  \ 或 `(String, String) -> int` 的类型。在 Java 中，你通过函数式接口（如 `Comparator<String>`）声明函数的意图。在编程语言理论中，这被称为*名义*类型。\n\
  \n当然，在许多情况下你想接受没有特定语义的“任何函数”。为了这个目的有很多泛型函数类型（参见表 3.1），使用其中之一是一个非常好的主意。\n\n表 3.1\
  \ 常见函数式接口\n![Images](img/01.jpg)\n\n例如，假设你写了一个匹配某些标准的方法。你应该使用 `FileFilter` 类还是 `Predicate<File>`？我强烈建议你使用下一节描述的标准接口。**注意**\n\
  \n大多数函数式接口都有默认方法 `and`、`or`、`negate`。例如，`Predicate.isEqual(a)` 等同于：\n\n```java\n\
  Predicate.isEqual(a).or(Predicate.isEqual(b))\n```\n\n```java\nx -> a.equals(x)\n\
  ```\n\n表 3.2 原始类型的函数式接口 *p*, *q* 是 `int`、`long`、`double`。*P*, *Q* 是 `Int`、`Long`、`Double`\n\
  ![Images](img/02.jpg)\n\n#### 3.6.3. 实现自己的接口\n\n你经常遇到没有任何标准函数式接口都适用的情况。这时你需要自己实现。\n\
  \n假设你想用颜色模式填充图像，其中用户提供一个产生每个像素颜色的函数。对于映射 `(int, int) -> Color`，没有标准类型。你可以使用 `BiFunction<Integer,\
  \ Integer, Color>`，但这涉及自动装箱。\n\n在这种情况下，定义一个新的接口是有意义的：\n\n```java\n@FunctionalInterface\n\
  public interface PixelFunction {\n    Color apply(int x, int y);\n}\n```\n\n**注意**\n\
  \n用 `@FunctionalInterface` 注解标记函数式接口是一个好习惯。这有两个优点：首先，编译器会检查被注解的实体是否带有单个抽象方法的接口。其次，javdoc\
  \ 页面会包含一条说明你的接口是函数式接口的语句。\n\n现在你准备好实现一个方法了：\n\n```java\nBufferedImage createImage(int\
  \ width, int height, PixelFunction f) {\n    var image = new BufferedImage(width,\
  \ height, BufferedImage.TYPE_INT_RGB);\n    for (int x = 0; x < width; x++)\n  \
  \      for (int y = 0; y < height; y++) {\n            Color color = f.apply(x,\
  \ y);\n            image.setRGB(x, y, color.getRGB());\n        }\n    return image;\n\
  }\n```\n\n调用它时，提供一个两个整数产生颜色值的 lambda 表达式：\n\n```java\nBufferedImage frenchFlag =\
  \ createImage(150, 100,\n    (x, y) -> x < 50 ? Color.BLUE : x < 100 ? Color.WHITE\
  \ : Color.RED);\n```\n\n\n\n\n\n在接下来的章节中，你将学习变量如何在 lambda 表达式内部工作。这些信息具有一定的技术性，但对于使用\
  \ lambda 表达式至关重要。\n\n### 3.7.1 Lambda 表达式的作用域\n\nlambda 表达式体具有`与嵌套块相同的作用域`。名称冲突和遮蔽的规则同样适用。在\
  \ lambda 中声明与局部变量同名的参数或局部变量是非法的。\n\n```\nint first = 0;\n\nComparator<String> comp\
  \ = (first, second) -> first.length() - second.length();\n\n    // Error: Variable\
  \ first already defined\n```\n\n在方法内部，你不能有两个同名的局部变量，因此你也无法在 lambda 表达式中引入此类变量。\n\
  \n作为“相同作用域”规则的另一个结果，lambda 表达式中的 `this` 指向创建该 lambda 的方法的 `this` 参数。例如，考虑\n\n```java\n\
  \ public class Application() {\n\n    public void doWork() {\n\n        Runnable\
  \ runner = () -> { ...; System.out.println(this.toString()); ... };\n\n        ...\n\
  \n    }\n}\n```\n\n表达式 `this.toString()` 调用了 `Application` 对象的 `toString` 方法，*而不是*\
  \ `Runnable` 实例。在 lambda 表达式中使用 `this` 并没有特殊之处。lambda 表达式的作用域嵌套在 `doWork` 方法内部，`this`\
  \ 在该方法的任何地方都具有相同的含义。\n\n### 3.7.2 访问闭包作用域中的变量\n\n通常，你想在 lambda 表达式中访问闭包方法或类的变量。考虑这个示例：\n\
  \n```java\n public static void repeatMessage(String text, int count) {\n\n    Runnable\
  \ r = () -> {\n\n        for (int i = 0; i < count; i++) {\n\n            System.out.println(text);\n\
  \n        }\n\n    };\n\n    new Thread(r).start();\n\n}\n```\n\n注意，lambda 表达式访问的是闭包作用域中定义的参数变量，而不是\
  \ lambda 表达式本身的。\n\n考虑调用\n\n```java\nrepeatMessage(\"Hello\", 1000); // 在单独线程中打印\
  \ Hello 1000 次\n```\n\n现在看 lambda 表达式内部的变量 `count` 和 `text`。如果你仔细考虑，这里发生着一些非显而易见的事情。lambda\
  \ 表达式的代码可能在 `repeatMessage` 调用返回且参数变量消失很久后仍在运行。当 lambda 表达式准备执行时，`text` 和 `count`\
  \ 变量是如何保留的？\n\n为了理解发生了什么，我们需要完善对 lambda 表达式的理解。lambda 表达式包含三个要素：\n\n1. 一个代码块\n2.\
  \ 参数\n3. *自由*变量的值——即既不是参数又未在代码内部定义的变量\n\n在我们的示例中，lambda 表达式有两个自由变量，`text` 和 `count`。表示该\
  \ lambda 表达式的数据结构必须存储这些变量的值——在我们的案例中，为 `\"Hello\"` 和 `1000`。我们说这些值被 lambda 表达式*捕获*（captured）了。（具体如何实现是实现细节。例如，可以将\
  \ lambda 表达式转换为一个只有一个方法的对象，这样自由变量的值就会复制到该对象的实例变量中。）\n\n**注意**\n\n代码块连同自由变量的值的专业术语是*闭包*（closure）。在\
  \ Java 中，lambda 表达式就是闭包。\n\n正如你所看到的，lambda 表达式可以捕获闭包作用域中变量的值。为了确保被捕获的值定义明确，有一项重要的限制。在\
  \ lambda 表达式中，你只能引用值不会改变的变量。这有时描述为 lambda 表达式捕获的是值而不是变量。例如，以下是编译时错误：\n\n```java\n\
  \ for (int i = 0; i < n; i++) {\n\n    new Thread(() -> System.out.println(i)).start();\n\
  \n        // Error—cannot capture i\n\n}\n```\n\nlambda 表达式尝试捕获 `i`，但这是非法的，因为 `i`\
  \ 会改变。它没有单一的值可以捕获。规则是，lambda 表达式只能访问闭包作用域中*有效最终的*（effectively final）局部变量。有效最终变量从不被修改——它要么已经是最终的，要么可以被声明为\
  \ `final`。\n\n**注意**\n\n同样的规则也适用于局部类捕获的变量（参见第 3.9 节）。过去，规则更加严格，要求被捕获的变量必须实际声明为 `final`。现在不再如此了。\n\
  \n**注意**\n\n增强 `for` 循环的变量是有效最终的，因为它的作用域是单次迭代。以下是完全合法的：\n\n```java\n for (String\
  \ arg : args) {\n\n    new Thread(() -> System.out.println(arg)).start();\n\n  \
  \  // OK to capture arg\n\n}\n```\n\n每次迭代都会创建一个新变量 `arg`，并分配来自 `args` 数组的下一个值。相比之下，上一个示例中变量\
  \ `i` 的作用域是整个循环。\n\n由于“有效最终”规则，lambda 表达式不能修改任何被捕获的变量。例如，\n\n```java\n public static\
  \ void repeatMessage(String text, int count, int threads) {\n\n    Runnable r =\
  \ () -> {\n\n        while (count > 0) {\n\n            count--; // Error: Can’t\
  \ mutate captured variable\n\n            System.out.println(text);\n\n        }\n\
  \n    };\n\n    for (int i = 0; i < threads; i++) new Thread(r).start();\n\n}\n\
  ```\n\n这实际上是一件好事。正如你在第 10 章中看到的，如果两个线程同时更新 `count`，它的值是未定义的。\n\n**注意**\n\n不要依赖编译器来捕获所有的并发错误。对修改的禁止仅适用于局部变量。如果\
  \ `count` 是实例变量或静态变量，那么即使结果只是未定义的，也不会报告错误。\n\n**警告**\n\n可以使用长度为 1 的数组来绕过对不当修改的检查：\n\
  \n```java\nint[] counter = new int[1];\n\nbutton.addActionListener(event -> counter[0]++);\n\
  ```\n\n变量 `counter` 是有效最终的——它始终引用同一个数组，所以你可以在 lambda 中访问它。\n\n当然，这样的代码不是线程安全的。除了单线程\
  \ UI 中的回调外，这是一个极糟糕的主意。你将在第 10 章中看到如何实现线程安全的共享计数器。\n\n### 3.8 高阶函数\n\n在函数式编程语言中，函数是一等公民。就像你可以将数字传递给方法并让方法产生数字一样，你可以拥有函数的参数和返回值。处理或返回函数的被称为*高阶函数*。这听起来很抽象，但在实践中非常有用。Java\
  \ 不完全是函数式语言，因为它使用函数式接口，但原理相同。在接下来的章节中，我们将查看一些示例并检查 `Comparator` 接口中的高阶函数。\n\n####\
  \ 3.8.1 返回函数的方法\n\n假设我们有时想按升序对字符串数组，有时想按降序。我们可以编写一个产生正确比较器的方法：\n\n```java\n public\
  \ static Comparator<String> compareInDirection(int direction) {\n\n    return (x,\
  \ y) -> direction * x.compareTo(y);\n\n}\n```\n\n调用 `compareInDirection(1)` 产生一个升序比较器，而调用\
  \ `compareInDirection(-1)` 产生一个降序比较器。\n\n结果可以传递给另一个期望此类接口的方法（如 `Arrays.sort`）。\n\
  \n```java\nArrays.sort(names, compareInDirection(-1));\n```\n\n通常，不要害羞编写产生函数的方法（从技术上说，实现函数式接口类的实例）。这对于生成传递给带有函数式接口方法的自定义函数很有用。\n\
  \n#### 3.8.2 修改函数的方法\n\n\n\n\n\n在上一节中，你看到了一种可以产生递增或递减字符串比较器的方法。我们可以通过反转任何比较器来泛化这个思想：\n\
  \n```java\npublic static Comparator<String> reverse(Comparator<String> comp) {\n\
  \    return (x, y) -> comp.compare(y, x);\n}\n```\n\n该方法作用于函数。它接收一个函数并返回一个修改后的函数。要获取不区分大小写的降序排列，请使用\n\
  \n```\nreverse(String::compareToIgnoreCase)\n```\n\n#### Note\n`Comparator` 接口有一个默认方法\
  \ `reversed`，它正通过这种方式产生给定比较器的反转结果。\n\n### 3.8.3 `Comparator` 方法\n`Comparator` 接口有很多实用的静态方法，这些方法是生成比较器的高阶函数。\n\
  \n`comparing` 方法接收一个“键值提取器”函数，该函数将类型 `T` 映射到可比较的类型（例如 `String`）。该函数被应用于待比较的对象，然后根据返回的键值进行比较。例如，假设一个\
  \ `Person` 类有一个方法 `getLastName`。那么你可以这样按姓氏对 `Person` 对象数组进行排序：\n\n```java\nArrays.sort(people,\
  \ Comparator.comparing(Person::getLastName));\n```\n\n你可以使用 `thenComparing` 方法链用比较器来打破平局。例如，按姓氏对人员数组进行排序，对于姓氏相同的人，使用名字：\n\
  \n```java\nArrays.sort(people, Comparator\n    .comparing(Person::getLastName)\n\
  \    .thenComparing(Person::getFirstName));\n```\n\n这些方法有几种变体。你可以指定一个比较器，用于由 `comparing`\
  \ 和 `thenComparing` 方法提取的键值。例如，这里我们按名字长度对人员进行排序：\n\n```java\nArrays.sort(people,\
  \ Comparator.comparing(Person::getLastName,\n    (s, t) -> s.length() - t.length()));\n\
  ```\n\n此外，`comparing` 和 `thenComparing` 方法都有变体，可以避免 `int`、`long` 或 `double` 值的装箱（boxing）。按名字长度排序的更简单的方法是：\n\
  \n```java\nArrays.sort(people, Comparator.comparingInt(p -> p.getLastName().length()));\n\
  ```\n\n如果你的键函数可以返回 `null`，那么你会喜欢 `nullsFirst` 和 `nullsLast` 适配器。这些静态方法接收一个现有的比较器并修改它，使其在遇到\
  \ `null` 值时不抛出异常，而是将其排得比普通值小或大。例如，假设当人没有中间名时 `getMiddleName` 返回 `null`。你可以使用 `Comparator.comparing(Person::getMiddleName,\
  \ Comparator.nullsFirst(...))`。\n\n`nullsFirst` 方法需要一个比较器——在这种情况下，是一个比较两个字符串的比较器。`naturalOrder`\
  \ 方法为任何实现 `Comparable` 的类创建一个比较器。这里是按可能为空的中间名进行排序的完整调用。我使用了 `java.util.Comparator.*`\
  \ 的静态导入来使表达式更具读性。注意 `naturalOrder` 的类型是推断出来的。\n\n```java\nArrays.sort(people, comparing(Person::getMiddleName,\n\
  \    nullsFirst(naturalOrder())));\n```\n\n静态方法 `reverseOrder` 提供自然顺序的反转。\n\n###\
  \ 3.9 局部类和匿名类\n在 lambda 表达式出现很久以前，Java 就拥有一种机制可以简洁地定义实现接口（无论是否是函数式的）的类。对于函数式接口，你应该使用\
  \ lambda 表达式，但偶尔你可能希望非函数式接口也有一种简洁的形式。你还会在遗留代码遇到经典的构造。\n\n#### 3.9.1 局部类\n你可以在方法内部定义一个类。这种类被称为\
  \ `局部类`（local class）。你会在仅具策略性的类这样做。这经常发生在类实现了一个接口，而方法的调用者只关心接口而不关心类时。\n\n例如，考虑一个方法\n\
  \n```java\npublic static IntSequence randomInts(int low, int high)\n```\n\n它生成一个给定范围内无限随机整数序列。\n\
  \n由于 `IntSequence` 是一个接口，该方法必须返回实现该接口的某个类的对象。调用者不在乎该类，因此可以在方法内部声明它：\n\n```java\n\
  private static RandomGenerator generator = RandomGenerator.getDefault();\n\npublic\
  \ static IntSequence randomInts(int low, int high) {\n    class RandomSequence implements\
  \ IntSequence {\n        public int next() { return low + generator.nextInt(high\
  \ - low + 1); }\n        public boolean hasNext() { return true; }\n    }\n    return\
  \ new RandomSequence();\n}\n```\n\n#### Note\n局部类不声明为 `public` 或 `private`，因为它在方法外部是无法访问的。\n\
  \n将类变为局部类有两个优点。首先，它的名称在方法的作用范围内是隐藏的。其次，类的方法可以访问封闭作用域的变量，就像 lambda 表达式的变量一样。\n\n\
  在示例中，`next` 方法捕获了三个变量：`low`、`high` 和 `generator`。如果你将 `RandomInt` 变成嵌套类，你必须提供一个显式的构造函数来接收这些值并将它们存储在实例变量中（参见练习\
  \ 16）。\n\n#### 3.9.2 匿名类\n在上一节的示例中，`RandomSequence` 名字只使用了一次：用于构造返回值。在这种情况下，你可以让类变成`匿名`的：\n\
  \n```java\npublic static IntSequence randomInts(int low, int high) {\n    return\
  \ new IntSequence() {\n        public int next() { return low + generator.nextInt(high\
  \ - low + 1); }\n        public boolean hasNext() { return true; }\n    };\n}\n\
  ```\n\n表达式 `new Interface() { methods }` 意味着：定义一个实现接口的类，并构造一个。\n\n#### Note\n一样，`new`\
  \ 表达式中的 `()` 表示构造参数。调用的是匿名类的默认构造函数。\n\n在 Java 有 lambda 表达式之前，匿名内部类是提供 runnable、比较器和其他函数对象的简洁语法。你经常会在遗留代码中看到它们。如今，只有当你需要提供多个方法时（如示例），匿名内部类才是必要的。如果\
  \ `IntSequence` 接口有一个默认的 `hasNext` 方法（如 3.2.2 所示），你可以简单使用 lambda 表达式：\n\n```java\n\
  public static IntSequence randomInts(int low, int high) {\n    return () -> low\
  \ + generator.nextInt(high - low + 1);\n}\n```\n\n### Exercises\n1. 提供一个接口 `Measurable`，包含一个方法\
  \ `getMeasure()` 用于测量对象。让 `Employee` 实现 `Measurable`。提供一个方法 `double average(Measurable[]\
  \ objects)` 计算平均测量值。使用它计算员工数组的平均薪水。\n2. 继续上一个练习，并提供一个方法 `Measurable largest(Measurable[]\
  \ objects)`。使用它找到薪水最高的员工的名字。为什么你需要强制转换？\n3. `String` 的所有父类型有哪些？`Scanner` 的呢？`ImageOutputStream`\
  \ 的呢？注意每个类型都是自身的父类型。没有声明父类型的类或接口其父类型为 `Object`。\n4. 为 `IntSequence` 类实现一个静态方法 `of`，产生带有参数的序列。例如，`IntSequence.of(3,\
  \ 1, 4, 1, 5, 9)` 产生包含六个值的序列。如果返回匿名内部类的实例，加分。\n5. 为 `IntSequence` 类添加一个名为 `constant`\
  \ 的静态方法，产生一个无限常量序列。例如，`IntSequence.constant(1)` 产生值 `1 1 1`...，无休止。如果用 lambda 表达式实现，加分。\n\
  \n\n\n\n6. `SquareSequence` 类由于整数溢出，实际上无法提供无限的平方序列。具体来说，它的表现如何？请通过定义一个 `Sequence<T>`\
  \ 接口和一个实现 `Sequence<BigInteger>` 的 `SquareSequence` 类来修复这个问题。\n\n7. 在此练习中，你将尝试向接口中添加方法时会发生什么。在\
  \ Java 7 中（你可以从 Java 归档 `https://www.oracle.com/java/technologies/downloads/archive/`\
  \ 获取），实现实现 `Iterator<Integer>` 而不是 `IntSequence` 的类 `DigitSequence`。提供 `hasNext`、`next`\
  \ 方法和一个什么都不做的 `remove` 方法。编写一个打印实例元素的程序。在 Java 8 中，`Iterator` 类增加了另一个方法 `forEachRemaining`。当你切换到\
  \ Java 8 时，你的代码还能编译吗？如果你将 Java 7 的类放入 JAR 文件且不重新编译，它在 Java 8 中可以工作吗？如果你调用 `forEachRemaining`\
  \ 方法会怎样？另外，`remove` 方法在 Java 8 中变成了一个默认方法，并抛出 `UnsupportedOperationException`。当在你的类实例上调用\
  \ `remove` 时会发生什么？\n\n8. 实现方法 `void luckySort(ArrayList<String> strings, Comparator<String>\
  \ comp)`，该方法不断对列表调用 `Collections.shuffle`，直到元素按照比较器确定的升序排列为止。\n\n9. 实现实现 `Runnable`\
  \ 的类 `Greeter`，其 `run` 方法打印 `n` 份 `\"Hello, \" + target`，其中 `n` 和 `target` 在构造函数中设置。构造两个不同消息的实例并在两个线程中并发执行它们。\n\
  \n10. 实现方法：\n\n```\npublic static void runTogether(Runnable... tasks)\n\npublic\
  \ static void runInOrder(Runnable... tasks)\n```\n\n第一个方法应该在独立的线程中运行每个任务，然后返回。第二个方法应该在当前线程中运行所有方法，并在最后一个方法完成后返回。\n\
  \n11. 使用 `java.io.File` 类的 `listFiles(FileFilter)` 和 `isDirectory` 方法，写一个返回给定目录下的所有子目录的方法。使用\
