  ## 5. 异常、断言与日志\n\n在许多程序中，处理意外情况比实现“理想”场景更为复杂。与大多数现代编程语言一样，Java 拥有一种健壮的异常处理机制，可以将控制权从故障点转移到胜任的处理器。此外，`assert`\
  \ 提供了一种结构化且高效的方式表达内部假设。最后，你将看到如何使用日志 API 来记录程序执行过程中各种事件（无论是例行的还是可疑的）。本章的关键点是：\n\n\
  1. 当你抛出异常时，控制权会被转移到最近的处理器。\n2. 在 Java 中，异常由编译器跟踪。\n3. 使用 `try/catch` 结构来处理异常。\n\
  4. try-with-resources 语句在执行后自动关闭资源。\n5. 使用 `try/finally` 结构处理无论是否执行都必须的操作。\n6. 你可以捕获并重抛异常，或将其链接到另一个异常。\n\
  7. 堆栈跟踪描述了执行点处的所有方法调用。\n8. 断言检查条件（前提是断言已启用），如果不符合条件则抛出错误。\n9. 日志器按层次排列，并可以接收从 `SEVERE`\
  \ 到 `FINEST` 级别的日志消息。\n10. 日志处理器可以将日志消息发送到不同的目标，格式化器控制消息格式。\n11. 你可以通过日志配置控制日志属性。\n\
  \n### 5.1 异常处理\n\n当方法遇到无法履行合约的情况时该怎么办？传统的答案是方法应该返回某个错误代码。但这对调用该方法的程序员来说是麻烦的。调用者被迫检查错误，如果它们无法处理，则向自己的调用者返回错误代码。\n\
  \n与其让错误代码在方法调用链中传播，Java 支持异常处理，方法可以通过“抛出”异常来信号严重问题。调用链中的某个方法（但不一定是直接调用者）负责通过“捕获”异常来处理它。异常处理的基本优势是将检测错误与处理错误的过程解耦。在接下来的章节中，你将看到如何在\
  \ Java 中处理异常。\n\n#### 5.1.1 抛出异常\n\n方法可能会发现自己无法执行当前的任务。也许是所需的资源缺失，或者调用时的参数不一致。在这种情况下，最好的办法是抛出一个异常。\n\
  \n假设你实现了一个在两个边界之间产生随机整数的方法：\n\n```\npublic static int randInt(int low, int high)\
  \ {\n    return low + (int) (Math.random() * (high - low + 1));\n}\n```\n\n如果有人调用\
  \ `randInt(10, 5)` 会发生什么？尝试修复这个问题可能不是好主意，因为调用者可能在多个方面都困惑。相反，抛出一个适当的异常：\n\n\n\n\n\
  \n```\nif (low > high)\n    throw new IllegalArgumentException(\n        \"low should\
  \ be <= high but low is %d and high is %d\".formatted(low, high));\n```\n\n如你所见，`throw`\
  \ 语句用于“抛出”一个类的对象——在这里是 `IllegalArgumentException`。该对象是使用一条调试消息来构造的。你将在下一节中看到如何选择合适的异常类。\n\
  \n当执行 `throw` 语句时，正常的执行流会立即中断。`randInt` 方法停止执行，并且不会向其调用者返回值。相反，控制将转移到处理程序，正如你在第\
  \ 5.1.4 节 中看到的那样。\n\n## 5.1.2 异常层次结构\n\n图 5.1 显示了 Java 中异常的层次结构。所有异常都是 `Throwable`\
  \ 类的子类。`Error` 的子类是在发生程序无法预料处理的异常情况时抛出的异常，例如内存耗尽。对于错误，你所做的做的多也就是向用户发送一条消息，告诉他们发生了严重的错误。\n\
  \n![images](img/05fig01.jpg)\n\n图 5.1：异常层次结构\n\n程序员报告的异常是 `Exception` 类的子类。这些异常分为两类：\n\
  \n![Images](img/sq.jpg) 未检查（Unchecked）异常是 `RuntimeException` 的子类。\n\n![Images](img/sq.jpg)\
  \ 所有其他异常都是已（checked）异常。\n\n正如你将在下一节中看到的，程序员要么捕获已异常，要么在方法头中声明它们。编译器会检查这些异常是否被妥善处理。\n\
  \n注意\n\n`RuntimeException` 这个名字起得不好。当然，所有异常都发生在运行时。然而，`RuntimeException` 的子类异常在编译期间是不被检查的。\n\
  \n已异常用于应该预见到可能会失败的情况。失败的一个常见原因是输入和输出。文件可能会损坏，网络连接可能会失败。许多异常类继承自 `IOException`，你应该使用合适的异常类来报告你遇到的任何错误。例如，当本该存在的文件不存在时，应抛出一个\
  \ `FileNotFoundException`。\n\n未检查异常表示由程序员引起的逻辑错误，而不是不可避免的外部风险。例如，`NullPointerException`\
  \ 是不检查的。几乎任何方法都可能抛出这种异常，程序员不应该花时间去捕获它们。相反，他们应该确保从根本上不对 `null` 进行解引用。\n\n有时，实现者需要根据自己的判断来区分已异常和未检查异常。考虑调用\
  \ `Integer.parseInt(str)`。当 `str` 不包含有效整数时，它会抛出一个未检查的 `NumberFormatException`。另一方面，当\
  \ `str` 不包含有效的类名时，`Class.forName(str)` 会会抛出一个已检查的 `ClassNotFoundException`。\n\n\
  为什么会有这种区别？这是因为在调用 `Integer.parseInt` 之前，可以检查字符串是否为有效整数，但在实际尝试加载类之前，无法知道一个类是否可以被加载。\n\
  \nJava API 提供了许多异常类，例如 `IOException`、`IllegalArgumentException` 等。你应该在适当的时候使用它们。然而，如果没有哪一个标准异常类适用于你的需求，你可以通过扩展\
  \ `Exception`、`RuntimeException` 或另一个现有的异常类来创建自己的异常。\n\n当你这样做时，同时提供一个无参数构造函数和一个带消息字符串的构造函数是一个好主意。例如：\n\
  \n```\npublic class FileFormatException extends IOException {\n    public FileFormatException()\
  \ {}\n    public FileFormatException(String message) {\n        super(message);\n\
  \    }\n    // 也为链式异常添加构造函数——参见第 5.1.7 节\n}\n```\n\n## 5.1.3 声明已异常\n\n任何可能引起已异常的方法必须在方法头中使用\
  \ `throws` 子句声明它：\n\n```\npublic void write(Object obj, String filename)\n    throws\
  \ IOException, ReflectiveOperationException\n```\n\n列出方法可能抛出的异常，可能是因为 `throw` 语句，也因为它调用了另一个带有\
  \ `throws` 子句的方法。\n\n在 `throws` 子句中，你可以将异常合并到一个公共超类中。这是否是一个好主意取决于异常。例如，如果一个方法可以抛出多个\
  \ `IOException` 的子类，那么在 `throws IOException` 子句中涵盖它们是有意义的。但如果异常之间彼此无关，不要将它们合并为 `throws\
  \ Exception`——那将违背异常检查的目的。\n\n提示\n\n有些程序员认为承认方法可能会抛出异常是可耻的。与其这样做，不是直接处理更好吗？实际上，恰恰相反。你应该让每个异常找到胜任的处理器。异常的黄金法则是：“尽早抛出，晚捕获”。\n\
  \n当你重写一个方法时，它抛出的已异常不能多于父类方法声明的。例如，如果你扩展了本节开始的 `write` 方法，则重写的方法可以抛出更少的异常：\n\n```\n\
  public void write(Object obj, String filename)\n    throws FileNotFoundException\n\
  ```\n\n但如果该方法尝试抛出一个无关的已异常（例如 `InterruptedException`），它将无法通过编译。\n\n警告\n\n如果父类方法没有\
  \ `throws` 子句，则没有重写方法可以抛出已异常。\n\n你可以使用 javadoc 的 `@throws` 标签来记录方法何时抛出（已检查或未检查）异常。大多数程序员只在有有意义的内容需要记录时这样做。例如，在输入输出出现问题时告诉用户抛出了\
  \ `IOException` 意义不大。但这样的注释是有意义的：\n\n```\n@throws NullPointerException 如果 filename\
  \ 为 null\n@throws FileNotFoundException 如果没有名为 filename 文件\n```\n\n注意\n\n你永远不会指定\
  \ lambda 表达式的异常类型。然而，如果 lambda 表达式可以抛出已异常，你只能将其传递给声明了该异常的函数式接口。例如，调用\n\n```\nlist.forEach(obj\
  \ -> write(obj, \"output.dat\"));\n```\n\n是错误的。`forEach` 方法的参数类型是函数式接口\n\n```\n\
  public interface Consumer<T> {\n    void accept(T t);\n}\n```\n\n`accept` 方法没有声明抛出任何异常。\n\
  \n## 5.1.4 捕获异常\n\n要捕获异常，请设置 `try` 块。其简单形式如下：\n\n```\ntry {\n    statements\n} catch\
  \ (ExceptionClass ex) {\n    handler\n}\n```\n\n如果在执行 `try` 块语句时发生了指定的异常，控制将转移到处理程序。异常变量（示例中的\
  \ `ex`）引用处理程序根据需要检查的异常对象。\n\n对这种基本结构进行两种修改。你可以为不同的异常类设置多个处理程序：\n\n```\ntry {\n \
  \  statements\n} catch (ExceptionClass1 ex) {\n   handler1\n} catch (ExceptionClass2\
  \ ex) {\n   handler2\n} catch (ExceptionClass3 ex) {\n   handler3\n}\n```\n\n`catch`\
  \ 子句是从上到下匹配的，因此最具体的异常类必须排在前面。\n\n或者，你可以在多个异常类之间共享一个处理器：\n\n```\ntry {\n   statements\n\
  } catch (ExceptionClass1 | ExceptionClass2 | ExceptionClass3 ex) {\n   handler\n\
  }\n```\n\n在这种情况下，处理程序只能调用异常变量上属于所有异常类的方法。\n\n### 5.1.5 try-with-resources 语句\n\n\
  异常处理的一个问题是资源管理。假设你向文件写入内容并在完成后关闭它：\n\n\n\n\n\n```java\nArrayList<String> lines =\
  \ ...;\n\nvar out = new PrintWriter(\"output.txt\");\n\nfor (String line : lines)\
  \ {\n    out.println(line.toLowerCase());\n}\n\nout.close();\n```\n\n这段代码隐藏着一个危险。如果任何方法抛出异常，`out.close()`\
  \ 的调用将永远不会发生。这是糟糕的。输出可能会丢失，或者如果触发多次异常，系统可能会耗尽文件句柄。\n\n`try` 语句的一种特殊形式可以解决这个问题。你可以在\
  \ `try` 语句的头部指定资源`resources`）。资源必须属于实现了 `AutoCloseable` 接口的类。你可以在 `try` 块的头部中声明变量：\n\
  \n```java\nArrayList<String> lines = ...;\n\ntry (var out = new PrintWriter(\"output.txt\"\
  )) { // 变量声明\n    for (String line : lines)\n        out.println(line.toLowerCase());\n\
  }\n```\n\n或者，你可以在头部提供之前声明的有效最终的（effectively final）变量：\n\n```java\nvar out = new\
  \ PrintWriter(\"output.txt\");\n\ntry (out) { // 有效最终变量\n    for (String line :\
  \ lines)\n        out.println(line.toLowerCase());\n}\n```\n\n`AutoCloseable` 接口仅有一个方法：\n\
  \n```java\npublic void close() throws Exception\n```\n\n#### Note\n\n还有一个 `Closeable`\
  \ 接口。它是 `AutoCloseable` 的子接口，同样有一个 `close` 方法。然而，该方法被声明为抛出 `IOException`。\n\n当 `try`\
  \ 块退出时（无论是由于正常结束还是因为抛出了异常），资源对象的 `close` 方法都会被调用。例如：\n\n```java\ntry (var out =\
  \ new PrintWriter(\"output.txt\")) {\n    for (String line : lines) {\n        out.println(line.toLowerCase());\n\
  \    }\n} // 在此处调用 out.close()\n```\n\n你可以声明多个资源，用分号隔开。这里有两个资源声明的示例：\n\n```java\n\
  try (var in = new Scanner(Path.of(\"/usr/share/dict/words\"));\n        var out\
  \ = new PrintWriter(\"output.txt\")) {\n    while (in.hasNext())\n        out.println(in.next().toLowerCase());\n\
  }\n```\n\n资源按照它们初始化的相反顺序关闭——也就是说，`out.close()` 在 `in.close()` 之前被调用。\n\n假设 `PrintWriter`\
  \ 构造函数抛出了异常。此时 `in` 已经初始化但 `out` 尚未初始化。`try` 语句做了正确的事：调用 `in.close()` 并传播异常。\n\n\
  某些 `close` 方法可能会抛出异常。如果当 `try` 块正常完成时发生这种情况，该异常将抛抛给调用者。然而，如果抛出了另一个异常，导致资源的 `close`\
  \ 方法被调用，并且其中一个抛出了异常，那么该异常的重要性可能低于原始异常。\n\n在这种情况下，原始异常会被重新抛出，而调用 `close` 产生的异常会被捕获并作为“被抑制的”（suppressed）异常附加。这是一个非常实用的机制，手动实现将非常繁琐（参见练习\
  \ 5）。当你捕获到主异常时，可以通过调用 `getSuppressed` 方法获取次要异常：\n\n```java\ntry {\n    ...\n} catch\
  \ (IOException ex) {\n    Throwable[] secondaryExceptions = ex.getSuppressed();\n\
  \    ...\n}\n```\n\n如果你想在一种（希望是罕见的）无法使用 try-with-resources 语句的情况下，自己实现这种机制，请调用 `ex.addSuppressed(secondaryException)`。\n\
  \ntry-with-resources 语句可以选择包含 `catch` 子句，以捕获语句中的任何异常。\n\n### 5.1.6. `finally` 子句\n\
  \n正如你所见，无论是否发生异常，try-with-resources 语句都会自动关闭资源。有时，你需要清理某些不是 `AutoCloseable` 的内容。在这种情况下，请使用\
  \ `finally` 子句：\n\n```java\ntry {\n    执行工作\n} finally {\n    清理工作\n}\n```\n\n`finally`\
  \ 子句在 `try` 块结束时（无论是正常结束还是由于异常）都会执行。\n\n每当你需要获取并释放锁、或者增加和递减计数器、或者在栈上推入内容并在完成后将其弹出时，这种模式就会出现。你希望确保这些操作无论可能抛出什么异常都会发生。\n\
  \n你应该避免在 `finally` 子句中抛出异常。如果 `try` 块的主体由于异常而终止，它会被 `finally` 子句中的异常所掩盖。你在上一节中看到的抑制机制仅适用于\
  \ try-with-resources 语句。\n\n同样，`finally` 子句不应包含 `return` 语句。如果 `try` 块的主体也有 `return`\
  \ 语句，那么 `finally` 子句中的那一个将替换返回值。考虑这个示例：\n\n```java\npublic static int parseInt(String\
  \ s) {\n    try {\n        return Integer.parseInt(s);\n    } finally {\n      \
  \ return 0; // 错误\n    }\n}\n```\n\n看起来在调用 `parseInt(\"42\")` 时，`try` 块的主体返回了整数\
  \ 42。然而，`finally` 子句在方法实际返回之前被执行，导致方法返回 0，忽略了原始返回值。\n\n情况更糟了。考虑调用 `parseInt(\"zero\"\
  )`。`Integer.parseInt` 方法抛出了 `NumberFormatException`。然后 `finally` 子句被执行，而 `return`\
  \ 语句吞噬了异常！\n\n#### Tip\n\n`finally` 子句旨在清理资源。不要在 `finally` 子句中改变控制流的语句（`return`、`throw`、`continue`）。\n\
  \n可以形成带有 `catch` 子句以及 `finally` 子句的 `try` 语句。但你必须小心 `finally` 子句中的异常。例如，看下面这个来自在线教程的\
  \ `try` 块：\n\n```java\nBufferedReader in = null;\ntry {\n    in = Files.newBufferedReader(path,\
  \ StandardCharsets.UTF_8);\n    从 in 读取\n} catch (IOException ex) {\n    System.err.println(\"\
  Caught IOException: \" + ex.getMessage());\n} finally {\n    if (in != null) {\n\
  \        in.close(); // 注意——可能抛出异常\n    }\n}\n```\n\n这段代码显然考虑了 `Files.newBufferedReader`\
  \ 抛出异常的情况，但它实际上漏掉了：：一个异常。通常最好将复杂的 `try/catch/finally` 语句重写为 try-with-resources 语句，或者在\
  \ `try/catch` 中嵌套 `try/finally`——参见练习 6。\n\n#### 5.1.7. 重新抛出和链异常\n\n当异常发生时，你可能不知道该如何处理，但你可能想要记录失败。在这种情况下，重新抛出异常，以便胜任的处理器可以处理它：\n\
  \n```java\ntry {\n    执行工作\n} catch (Exception ex) {\n    logger.log(level, message,\
  \ ex);\n    throw ex;\n}\n```\n\n#### Note\n\n当这段代码位于一个可能抛出检查异常的方法内部时，发生了一些微妙的事情。假设闭包方法声明为：\n\
  \n```java\npublic void read(String filename) throws IOException\n```\n\n乍一看，似乎需要将\
  \ `throws` 子句改为 `throws Exception`。然而，Java 编译器会仔细跟踪流向，并意识到 `ex` 只能是 `try` 块中某个语句抛出的异常，而不是任意的\
  \ `Exception`。\n\n有时，你想更改抛出异常的类。例如，你可能需要用对子系统用户合理的异常类来报告子系统的失败。假设你在 servlet 中遇到了数据库错误。执行\
  \ servlet 的代码可能不想详细知道发生了什么，但它确实想知道是 servlet 的错。在这种情况下，捕获原始异常并将其链到更高层次的异常上：\n\n```java\n\
  try {\n    访问数据库\n} catch (SQLException ex) {\n    throw new ServletException(\"\
  database error\", ex);\n}\n```\n\n\n\n\n当捕获到 `ServletException` 时，可以如下所示获取原始异常：\n\
  \n```\nThrowable cause = ex.getCause();\n```\n\n`ServletException` 类有一个构造函数，可以将异常的成因作为参数传入。并不是所有的异常类都这样做。在这种情况下，你必须调用\
  \ `initCause` 方法，如下所示：\n\n```\ntry {\n    Access the database\n}\ncatch (SQLexception\
  \ ex) {\n    var ex2 = new CruftyOldException(\"database error\");\n    ex2.initCause(ex);\n\
  \    throw ex2;\n}\n```\n\n如果你自定义异常类，除了 第 5.1.2 节 中描述的两个构造函数外，还应该提供以下构造函数：\n\n```java\n\
  public class FileFormatException extends IOException {\n    ...\n    public FileFormatException(Throwable\
  \ cause) { initCause(cause); }\n\n    public FileFormatException(String message,\
  \ Throwable cause) {\n        super(message);\n        initCause(cause);\n    }\n\
  }\n```\n\n**提示**\n\n如果在不允许抛出检举异常的方法中发生了检举异常，链式技术也很有用。你可以捕获该检举异常并将其链到一个非检举异常上。\n\n\
  #### 5.1.8. 未捕获的异常与堆栈跟踪\n\n如果异常在任何地方都没有被捕获，就会显示 `stack trace`（堆栈跟踪）——即异常抛出处所有待处理方法调用的列表。堆栈跟踪会被发送到\
  \ `System.err`，即错误消息流。\n\n如果你想将异常保存到其他地方（以便供技术支持人员检查），可以设置默认的未捕获异常处理器：\n\n```\n\
  Thread.setDefaultUncaughtExceptionHandler((thread, ex) -> {\n    Record the exception\n\
  });\n```\n\n**注意**\n\n未捕获的异常会终止发生该异常的线程。如果你的应用程序只有一个线程（你目前为止看到的程序都是如此），那么程序在调用未捕获异常处理器后将会退出。\n\
  \n有时，你被迫捕获某个异常，但并真的不知道该如何处理它。例如，`Class.forName` 方法会抛出一个你需要处理的检举异常。与其忽略异常，不如至少打印出堆栈跟踪：\n\
  \n```\ntry {\n    Class<?> cl = Class.forName(className);\n    ...\n} catch (ClassNotFoundException\
  \ ex) {\n    ex.printStackTrace();\n}\n```\n\n如果你想存储异常的堆栈跟踪，可以如下所示将其放入字符串中：\n\n\
  ```\nvar out = new ByteArrayOutputStream();\nex.printStackTrace(new PrintWriter(out));\n\
  String description = out.toString();\n```\n\n**注意**\n\n如果你需要更详细地处理堆栈跟踪，请使用 `StackWalker`\
  \ 类。例如，以下代码会打印所有的堆栈帧：\n\n```\nStackWalker walker = StackWalker.getInstance();\n\
  walker.forEach(frame -> System.err.println(\"Frame: \" + frame));\n```\n\n你也可以详细分析\
  \ `StackWalker.StackFrame` 实例。详情请参考 API 文档。\n\n#### 5.1.9. 用于抛出异常的 API 方法\n\n`Objects`\
  \ 类有一个方法可以对参数进行空检查。这里是一个用法示例：\n\n```java\npublic void process(String direction)\
  \ {\n    this.direction = Objects.requireNonNull(direction);\n    ...\n}\n```\n\n\
  如果 `direction` 为 `null`，则会抛出 `NullPointerException`。乍一看，这似乎有点没意义，因为在使用该值时最终也会抛出\
  \ `NullPointerException`。但请从堆栈跟踪回溯考虑。当你看到对 `requireNonNull` 的调用是罪祸之首时，你立刻知道自己做错了。\n\
  \n你还可以为异常提供一个消息字符串：\n\n```java\nthis.direction = Objects.requireNonNull(direction,\
  \ \"direction must not be null\");\n```\n\n该方法的变体允许你提供一个备用值而不是抛出异常：\n\n```java\n\
  this.direction = Objects.requireNonNullElse(direction, \"North\");\n```\n\n如果默认值的计算代价很高，请使用另一个变体：\n\
  \n```java\nthis.direction = Objects.requireNonNullElseGet(direction,\n   () -> System.getProperty(\"\
  com.horstmann.direction.default\"));\n```\n\n只有当 `direction` 为 `null` 时，Lambda 表达式才会求值。\n\
  \n还有一个用于进行范围检查的便利方法：\n\n```java\nthis.index = Objects.checkIndex(index, length);\n\
  ```\n\n如果索引在 0 到 `length - 1` 之间，则返回该索引；否则抛出 `IndexOutOfBoundsException`。\n\n###\
  \ 5.2. 断言\n\n断言是防御性编程中常用的一种惯用法。假设你确定某个属性已满足，并且在代码中依赖该属性。例如，你可能正在计算：\n\n```java\n\
  double y = Math.sqrt(x);\n```\n\n你确定 `x` 不是负数。尽管如此，你仍然想再次检查，而不是让“非数字”（NaN）浮点值渗透到你的计算中。当然，你可以抛出一个异常：\n\
  \n```java\nif (x < 0) throw new IllegalStateException(x + \" < 0\");\n```\n\n但这个条件在测试完成后仍然留在程序中，会减慢运行速度。断言机制允许你在测试期间插入检查，并在生产代码中自动移除它们。\n\
  \n**注意**\n\n在 Java 中，断言旨在作为验证内部假设的调试辅助，而不是强制契约的机制。例如，如果你想报告公共方法的参数不当，请不要使用断言，而要抛出\
  \ `IllegalArgumentException`。\n\n#### 5.2.1. 使用断言\n\nJava 中的断言语句有两种形式：\n\n```\n\
  assert condition;\n\nassert condition : expression;\n```\n\n`assert` 语句评估条件，如果条件为假，则抛出\
  \ `AssertionError`。在第二种形式中，表达式会被转换为字符串并作为消息。\n\n**注意**\n\n如果表达式是 `Throwable`，它也会被设置为断言错误的成因（参见\
  \ 5.1.7）。\n\n例如，要断言 `x` 为非负数，你可以直接使用：\n\n```\nassert x >= 0;\n```\n\n或者你可以将 `x`\
  \ 的实际值传入 `AssertionError` 对象以便进行显示：\n\n```\nassert x >= 0 : x;\n```\n\n### 5.2.2.\
  \ 启用和禁用断言\n\n默认情况下，断言是禁用的。通过在运行程序时使用 `-enableassertions` 或 `-ea` 来启用它们：\n\n```\n\
  java -ea MainClass\n```\n\n你不需要重新编译程序，因为启用或禁用断言是由类加载器处理的。当禁用断言时，类加载器会剥离断言代码，从而不会影响速度。你甚至可以在特定的类或整个包中启用断言，例如：\n\
  \n```\njava -ea:MyClass -ea:com.mycompany.mylib... MainClass\n```\n\n此命令将开启 `MyClass`\
  \ 类以及 `com.mycompany.mylib` 包及其子包中所有类的断言。`-ea...` 开启默认包中所有类的断言。\n\n你也可以用 `-disableassertions`\
  \ 或 `-da` 禁用某些类和包的断言：\n\n```\njava -ea:... -da:MyClass MainClass\n```\n\n当你使用 `-ea`\
  \ 和 `-da` 启用或禁用所有断言（而不是针对特定类或包），它们不适用于无类加载器加载的“系统类”。使用 `-enablesystemassertions/-esa`\
  \ 来启用系统类的断言。\n\n还可以通过以下方法动态控制类加载器的断言状态：\n\n```\nvoid ClassLoader.setDefaultAssertionStatus(boolean\
  \ enabled);\n\nvoid ClassLoader.setClassAssertionStatus(String className, boolean\
  \ enabled);\n\nvoid ClassLoader.setPackageAssertionStatus(String packageName, boolean\
  \ enabled);\n```\n\n与 `-enableassertions` 命令行一样，`setPackageAssertionStatus` 方法设置指定包及其子包的断言状态。\n\
  \n### 5.3. 日志记录\n\n\n\n\n\n每个 Java 程序员都熟悉这种过程：在棘手的代码中插入 `System.out.println` 调用以了解程序的行为。当然，一旦你找到了问题的根源，就会移除这些打印语句——当下一个问题出现时，你又把它们加回来。日志框架的设计就是为了解决这个问题。\n\
  \n### 5.3.1 你应该使用 Java 日志框架吗？\n\nJava 有一个标准的日志框架，通常以其包名 `java.util.logging` 命名，有时缩写为\
  \ `j.u.l`。然而，其他日志框架拥有更多功能且广泛使用，例如 Log4j ([`logging.apache.org/log4j/2.x/`](https://logging.apache.org/log4j/2.x/))\
  \ 和 Logback ([`logback.qos.ch/`](https://logback.qos.ch/))。\n\n如果你想让你代码的用户选择日志框架，那么你应该使用一个“\
  \ facade”（façade）库，将日志消息发送到首选的框架。一个常用且 API 良好的 facade 是 SLF4J ([`www.slf4j.org/`](https://www.slfj.org/))。另一个\
  \ facade 是“平台日志 API”（也称为 JEP 246）。它非常基础，但是 JDK 的一部分。这个 facade 有时被称为 `frontend`（前端）。它提供了程序员用于记录消息的\
  \ API。`backend`（后端）负责过滤、格式化消息并将其放入某处。后端需要由部署者进行配置，通常通过编辑配置文件来实现。\n\n在接下来的章节中，我将向你展示如何使用平台日志\
  \ API 作为前端，并将 `java.util.logging` 作为后端。如果你发现前端 API 足够用，这是一个很合理的选择，因为你可以随时切换后端。\n\
  \n`java.util.logging` 后端的特性比那些更流行的替代方案少，但对于许多用例来说已经足够。由于其简单性，它不容易受到攻击。相比之下，Log4j\
  \ 的某些晦涩特性允许黑客构造程序输入，当这些输入被记录时，会导致恶意代码的执行。\n\n无论你最终是否会使用它们，学习平台日志 API 和 `java.util.logging`\
  \ 后端都能让你对日志框架的能力有一个良好的基础。\n\n### 5.3.2 日志入门\n\n平台日志记录器实现了 `System.Logger` 接口。每个日志记录器都有一个名称。名称可以是任意的，但它通常是生成日志消息的方法所属类的包名。你可以这样获取一个平台日志记录器：\n\
  \n```\nSystem.Logger logger = System.getLogger(\"com.mycompany.myapp\");\n```\n\n\
  当你第一次请求具有给定名称的日志记录器时，它会被创建。对相同名称的后续调用将产生同一个记录器对象。\n\n现在你准备好记录日志了：\n\n```\nlogger.log(System.Logger.Level.INFO,\
  \ \"Opening file \" + filename);\n```\n\n记录打印打印如下：\n\n```\nAug 04, 2014 09:53:34\
  \ AM com.mycompany.myapp read\n\nINFO: Opening file data.txt\n```\n\n注意，时间以及调用类和方法的名称会自动包含在内。\n\
  \n为了在程序部署时关闭这些信息性消息，你可以配置后端。对于 `java.util.logging` 后端，请准备一个包含以下内容的 `logging.properties`\
  \ 文件：\n\n```\nhandlers=java.util.logging.ConsoleHandler\n\ncom.mycompany.myapp.level=WARNING\n\
  ```\n\n然后像这样启动应用程序：\n\n```\njava -Djava.util.logging.config.file=logging.properties\
  \ com.mycompany.myapp.Main\n```\n\n由于 `INFO` 级别低于 `WARNING` 级别，消息将不再显示。\n\n获取日志记录器和记录消息的\
  \ API 是前端的一部分——在这种情况下，是平台日志 API。如果你使用不同的前端，API 将是不同的。\n\n消息的去地、格式化和过滤，以及配置机制是后端的一部分——在这里是\
  \ `java.util.logging`。如果你使用不同的后端，你需要遵循它的配置说明进行配置。\n\n### 5.3.3 平台日志 API\n\n正如你在上一节中看到的，每条记录的消息都有一个级别。`System.Logger.Level`\
  \ 枚举有以下值，按严重程度从高到低排序：`ERROR`、`WARNING`、`INFO`、`DEBUG` 和 `TRACE`。\n\n提示\n\n使用导入语句\n\
  \n```\nimport static java.lang.System.Logger.Level.*;\n```\n\n你可以缩短级别：\n\n```\n\
  logger.log(INFO, \"Opening file \" + filename); // 代替 System.Logger.Level.INFO\n\
  ```\n\n在上面的示例中，即使消息被抑制，消息 `\"Opening file \" + filename` 也会创建。如果你担心创建消息字符串的成本，可以使用\
  \ lambda 表达式来代替：\n\n```\nlogger.log(INFO, () -> \"Opening file \" + filename);\n\
  ```\n\n这样消息只有在实际被记录时才会被计算。\n\n记录异常是很常见的：\n\n```\ncatch (IOException ex) {\n\n  \
  \  logger.log(WARNING, \"Cannot open file \" + filename, ex);\n}\n```\n\n你可以使用 `MessageFormat`\
  \ 类（你将在 第 13 章 中看到）来格式化消息：\n\n```\nlogger.log(WARNING, \"Cannot open file {0}\"\
  , filename)\n```\n\n可以使用资源包机制将日志消息本地化为不同的语言，该机制在 第 13 章 中也有介绍。\n\n你可以使用该机制指定包：\n\
  \n```\nlogger.log(WARNING, \"Cannot open file {0}\", filename)\n```\n\n这样就不需要在每次调用时指定包。\n\
  \n```\nlogger.log(INFO, \"file.bad\");\n```\n\n或者，获取日志记录器：\n\n```\nSystem.Logger\
  \ logger = System.getLogger(\"com.mycompany.myapp\");\n```\n\n某些但并非所有这些功能（延迟消息计算、添加\
  \ throwable、格式化）都是支持的。表 5.1 显示了完整的 API。\n\n表 5.1：`System.Logger` API\n\n05tab01\n\
  \n### 5.3.4 日志配置\n\n现在让我们转向后端。正如前面提到的，平台 API 的默认后端是 `java.util.logging`。以下信息特定该后端。\n\
  \n你可以通过编辑配置文件更改后端的各种属性。默认配置文件位于 JDK 中的 `conf/logging.properties`。要使用另一个文件，在启动应用程序时设置\
  \ `java.util.logging.config.file` 属性为文件位置：\n\n```\njava -Djava.util.logging.config.file=configFile\
  \ MainClass\n```\n\n警告\n\n在 `main` 中调用 `System.setProperty(\"java.util.logging.config.file\"\
  , configFile)` 是无效的，因为日志管理器在 `main` 执行之前在 VM 启动期间就已经初始化了。\n\n要更改默认日志级别，编辑配置文件并修改该行：\n\
  \n```\n.level=INFO\n```\n\n你可以通过添加此类行来指定你自己的记录器的日志级别：\n\n```\ncom.mycompany.myapp.level=WARNING\n\
  ```\n\n即在记录器名称后附加 `.level` 后缀。\n\n警告\n\n由于历史原因，某些级别在平台日志 API 和 `java.util.logging`\
  \ 框架中的名称不同。以下是对应关系：\n\njpg\n\n与包名类似，日志记录器名称具有层次性。事实上，它们比包更具层次性。包和父包之间没有语义关系，但日志记录器的父子共享某些属性。例如，如果你关闭到记录器\
  \ `\"com.mycompany\"` 的消息，那么子记录器也会被禁用。\n\n正如你在下一节中看到的，日志记录器并没有将消息发送到控制台——那是处理器的工作。处理器也有级别。为了在控制台上看到\
  \ `DEBUG/FINE` 消息，你还需要设置：\n\n```\njava.util.logging.ConsoleHandler.level=FINE\n\
  ```\n\n警告\n\n日志管理器配置中的设置不是系统属性。使用 `-Dcom.mycompany.myapp.level=FINE` 启动程序对日志记录器没有任何影响。\n\
  \n\n\n\n\n还可以通过使用 `jconsole` 程序在运行中的程序更改日志级别。详细信息，请参阅 `www.oracle.com/technetwork/articles/java/jconsole-1564139.html#LoggingControl`。\n\
  \n### 5.3.5. 日志处理器 (Log Handlers)\n\n在默认配置中，日志记录器（loggers）将记录发送到 `ConsoleHandler`，将其打印到\
  \ `System.err` 流中。具体而言，日志记录器将记录发送给父处理器，而最终祖先（名称为 `\"\"`）拥有一个 `ConsoleHandler`。\n\
  \n与日志记录器一样，处理器也有日志级别。要使一条记录被记录，其日志级别必须高于日志记录器和处理器的阈值。日志管理器配置文件设置默认控制台处理器的日志级别为：\n\
  \n```\njava.util.logging.ConsoleHandler.level=INFO\n```\n\n要记录级别为 `FINE` 的记录，请在配置中更改默认日志记录器级别和处理器级别。\n\
  \n要将日志记录发送到其他地方，请添加另一个处理器。日志 API 为此目的提供了两个处理器：`FileHandler` 和 `SocketHandler`。`SocketHandler`\
  \ 将记录发送到指定的主机和端口。更有趣的是 `FileHandler`，它将记录收集在一个文件中。\n\n你可以简单地将记录发送到默认文件处理器，如下所示：\n\
  \n```\nvar handler = new FileHandler();\nlogger.addHandler(handler);\n```\n\n记录被发送到用户主目录下的\
  \ `java*n.log` 文件，其中 `n` 是一个使文件保持唯一的数字。默认情况下，记录以 XML 格式格式化。一个典型的日志记录形式如下：\n\n```\n\
  <record>\n    <date>2014-08-04T09:53:34</date>\n    <millis>1407146014072</millis>\n\
  \    <sequence>1</sequence>\n    <logger>com.mycompany.myapp</logger>\n    <level>INFO</level>\n\
  \    <class>com.horstmann.corejava.Employee</class>\n    <method>read</method>\n\
  \    <thread>10</thread>\n    <message>Opening file staff.txt</message>\n</record>\n\
  ```\n\n你可以通过在日志管理器配置中设置各种参数，或使用以下构造函数之一来修改文件处理器的默认行为：\n\n```\nFileHandler(String\
  \ pattern)\nFileHandler(String pattern, boolean append)\nFileHandler(String pattern,\
  \ int limit, int count)\nFileHandler(String pattern, int limit, int count, boolean\
  \ append)\n```\n\n构造参数的含义请参见表 5.2。你可能不想使用默认的日志文件名。请使用如 `%h/ myapp.log` 的模式（模式变量的解释参见表\
  \ 5.3）。\n\n如果多个应用程序（或同一应用程序的多个副本）使用同一个日志文件，你应该开启 `append` 标志。或者，在文件名模式中使用 `%u`，以便每个应用程序都创建一个唯一的日志副本。\n\
  \n开启文件轮转（file rotation）也是一个好主意。日志文件以循环序列保存，例如 `myapp.log.0`、`myapp.log.1`、`myapp.log.2`\
  \ 等。当文件超过大小限制时，旧的日志会被删除，其他文件会被重命名，并创建一个生成号为 `0` 的新文件。\n\n表 5.2：文件处理器配置参数\n![images](img/05tab02.jpg)\n\
  \n表 5.3：日志文件模式变量\n![images](img/05tab03.jpg)\n\n### 5.3.6. 过滤器和格式化器 (Filters and\
  \ Formatters)\n\n除了按日志级别过滤外，每个处理器还可以有一个实现 `Filter` 接口的过滤器，该接口是一个具有方法的函数接口：\n\n```\n\
  boolean isLoggable(LogRecord record)\n```\n\n要向处理器安装过滤器，请在日志配置中添加如下条目：\n\n```\n\
  java.util.logging.ConsoleHandler.filter=com.mycompany.myapp.MyFilter\n```\n\n`ConsoleHandler`\
  \ 和 `FileHandler` 类以文本和 XML 格式输出日志记录。然而，你也可以定义自己的格式。扩展 `java.util.logging.Formatter`\
  \ 类并重写方法：\n\n```\nString format(LogRecord record)\n```\n\n以你喜欢的任何方式格式化记录并返回生成的字符串。在你的\
  \ `format` 方法中，可以通过调用表 5.4 中的任意方法来获取有关 `LogRecord` 的信息。\n\n在你的 `format` 方法中，你可能想要调用方法：\n\
  \n```\nString formatMessage(LogRecord record)\n```\n\n该方法格式化记录的消息部分，在资源包中查找消息键并替换消息格式参数。\n\
  \n许多文件格式（如 XML）需要围绕格式化记录的头部和尾部。为此，重写方法：\n\n```\nString getHead(Handler h)\nString\
  \ getTail(Handler h)\n```\n\n最后，在日志配置中设置格式化器：\n\n```\njava.util.logging.FileHandler.formatter=com.mycompany.myapp.MyFormatter\n\
