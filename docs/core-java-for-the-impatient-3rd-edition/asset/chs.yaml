  \n## 7. 集合 (Collections)\n\n许多许多数据结构以便程序员高效地存储和检索值。Java API 提供了常用数据结构和算法的实现，以及组织它们的框架。在本章中，你将学习如何处理列表、集合、映射和其他集合。\n\
  \n本章的要点是：\n\n1. `Collection` 接口为所有集合提供了通用方法，但由 `Map` 接口描述的映射除外。\n2. 列表（list）是一个顺序集合，每个元素都有一个整数索引。\n\
  3. 集合（set）针对高效的包含性测试进行了优化。Java 提供了 `HashSet` 和 `TreeSet` 实现。\n4. 对于映射（maps），你可以在\
  \ `HashMap` 和 `TreeMap` 实现之间选择。`LinkedHashMap` 保留插入顺序。\n5. `Collection` 接口和 `Collections`\
  \ 类提供了许多有算法：集合操作、搜索、排序、洗牌等。\n6. 视图（Views）允许标准集合接口访问存储在别处的数据。\n\n### 7.1 集合框架概述\n\
  \nJava 集合框架提供了常用数据结构的实现。为了便于编写不依赖于数据结构选择的代码，集合框架提供了许多通用接口，如图 7.1 所示。基础接口是 `Collection`，其方法在表\
  \ 7.1 所示。\n\n![images](img/07fig01.jpg)\n\n图 7.1：Java 集合框架中的接口\n\n表 7.1：`Collection<E>`\
  \ 接口的方法\n\n![images](img/07tab01.jpg)\n\n`List` 是一个顺序集合：元素具有位置 0, 1, 2 等。表 7.2 显示了该接口的方法。\n\
  \n表 7.2：`List` 接口\n\n![images](img/07tab02.jpg)\n\n`List` 接口既由 `ArrayList` 类（你在全书中都看到了它）也由\
  \ `LinkedList` 类实现。如果你上过数据结构课程，`LinkedList` 类是一个顺序列表。`ArrayList` 是基于数组的列表。`LinkedList`\
  \ 是双向链表。`ArrayList` 在随机访问方面更快，而 `LinkedList` 在端部插入和删除方面更快。\n\n`List` 接口提供了通过索引访问元素。`ArrayList`\
  \ 实现了 `RandomAccess`，但 `LinkedList` 仅实现 `List`。\n\n在集合（Set）中，元素不插入到特定位置，不允许重复元素。`HashSet`\
  \ 和 `TreeSet` 是实现。`SortedSet` 允许按排序迭代，`NavigableSet` 具有寻找相邻元素的方法。你将在第 7.3 节学习更多关于集合的知识。\n\
  \n`Queue` 保留插入顺序，但你只能从尾部插入元素并从头部移除。`Deque` 是可以在两端插入队列。\n\n所有集合接口都是泛型的，带有元素的类型参数（`Collection<E>`,\
  \ `List<E>` 等）。`Map<K, V>` 接口具有键类型参数 `K` 和值类型参数 `V`。\n\n鼓励在代码中尽可能使用接口。例如，在构造 `ArrayList`\
  \ 后，将其存储在 `List` 类型的变量中：\n\n```\nList<String> words = new ArrayList<>();\n```\n\n\
  当你实现处理集合的方法时，使用限制最少的接口作为参数类型。通常，`Collection`、`List` 或 `Map` 即可。\n\n集合框架的一个优势是，在处理常用算法时不需要重复发明。一些基本算法（如\
  \ `addAll` 和 `removeIf`）是 `Collection` 接口的方法。`Collections` 工具类包含许多操作各种集合的额外算法。你可以对列表进行排序、洗牌、旋转和反转，找到集合中的最大或最小值或任意元素的位置，并生成没有元素、一个元素或\
  \ `n` 个相同元素的集合。表 7.3 提供了总结。\n\n表 7.3：`Collections` 类的有用方法\n\n![images](img/07tab03.jpg)![images](img/07tab03a.jpg)\n\
  \n### 7.2 迭代器 (Iterators)\n\n每个集合都提供了某种顺序遍历其元素的方法。`Collection` 的父接口 `Iterable<T>`\
  \ 定义了一个方法\n\n```\nIterator<T> iterator()\n```\n\n产生产生迭代器，你可以使用它访问所有元素。\n\n\n\n\n\
  ```\nCollection<String> coll = ...;\n\nIterator<String> iter = coll.iterator();\n\
  \nwhile (iter.hasNext()) {\n\n    String element = iter.next();\n\n    Process element\n\
  \n}\n```\n\n在这种情况下，你可以直接使用增强型 `for` 循环：\n\n```\nfor (String element : coll)  {\n\
  \n    Process element\n\n}\n```\n\n### 注意事项\n\n对于实现了 `Iterable<E>` 接口的类的*任意*对象 `c`，增强型\
  \ `for` 循环会被翻译为前述的形式。\n\n`Iterator` 接口还有一个 `remove` 方法，它可以可以删除上一次访问的元素。此循环删除了所有满足条件的元素：\n\
  \n```java\nwhile (iter.hasNext()) {\n\n    String element = iter.next();\n\n   \
  \ if (element fulfills the condition)\n\n        iter.remove();\n\n}\n```\n\n然而，使用\
  \ `removeIf` 方法更简单：\n\n```\ncoll.removeIf(e -> e fulfills the condition);\n```\n\
  \n### 警告\n\n`remove` 方法删除的是迭代器返回的最后一个元素，而不是迭代器当前指向的元素。你不能在没有调用 `next` 或 `previous`\
  \ 的情况下连续调用两次 `remove`。\n\n`ListIterator` 接口是 `Iterator` 的子接口，具有在迭代器之前添加元素、将访问过的元素设置为不同值以及向后导航的方法。它主要用于处理链表。\n\
  \n```java\nvar friends = new LinkedList<String>();\n\nListIterator<String> iter\
  \ = friends.listIterator();\n\niter.add(\"Fred\"); // Fred |\n\niter.add(\"Wilma\"\
  ); // Fred Wilma |\n\niter.previous(); // Fred | Wilma\n\niter.set(\"Barney\");\
  \ // Fred | Barney\n```\n\n### 警告\n\n如果你在用迭代器访问一个正在被修改的数据结构，它可能会失效。如果你继续使用它，无效的迭代器可能会抛出\
  \ `ConcurrentModificationException`。这是一个典型的示例：\n\n```java\nvar friends = new LinkedList<String>(List.of(\"\
  Fred\", \"Wilma\", \"Barney\"));\n\nfor (String name : friends) {\n\n    if (name.length()\
  \ < 5) friends.remove(name); // Error—concurrent modification\n\n}\n```\n\n增强型 `for`\
  \ 循环使用迭代器来遍历列表。当列表被修改时，迭代器\n\n### 7.3\\. 集合（Sets）\n\n集合可以高效地测试一个值是否为元素，但它是有代价：它不记住元素添加的顺序。在顺序不重要的情况下，集合非常有用。例如，如果你不允许将一组脏词作为用户名，那么它们的顺序并不重要。你只需要知道提议的用户名是否在集合中。\n\
  \n`Set` 接口由 `HashSet` 和 `TreeSet` 类实现。在内部，这些类使用了完全不同的实现。如果你上过数据结构课程，你可能知道如何实现哈希表和二叉树——但你可以在不知道它们内部细节的情况下使用这些类。\n\
  \n通常，如果你为元素有一个良好的*哈希函数*，哈希集合会高效一些。`String` 或 `Path` 等库类具有良好的哈希函数。你在第四章中学习了如何为自己的类编写哈希函数。\n\
  \n例如，那个脏词集合可以简单地实现为：\n\n```java\nvar badWords = new HashSet<String>();\n\nbadWords.add(\"\
  sex\");\n\nbadWords.add(\"drugs\");\n\nbadWords.add(\"c++\");\n\nif (badWords.contains(username.toLowerCase()))\n\
  \n    System.out.println(\"Please choose a different user name\")\n```\n\n如果你想按排序顺序遍历集合，则使用\
  \ `TreeSet`。你可能想这样做的一个的原因是向用户展示排序后的选项列表。\n\n集合的元素类型必须实现 `Comparable` 接口，或者你需要在构造函数中提供一个\
  \ `Comparator`。\n\n```java\nvar countries = new TreeSet<String>(); // 按顺序访问已添加的国家\n\
  \nvar countries2 = new TreeSet<String>((u, v) ->\n\n    u.equals(v) ? 0\n\n    :\
  \ u.equals(\"USA\") ? -1\n\n    : v.equals(\"USA\") ? 1\n    : u.compareTo(v));\n\
  \n    // USA 始终在第一\n```\n\n`TreeSet` 类实现了 `SortedSet` 和 `NavigableSet` 接口，其方法显示在\
  \ 和 中。\n\n表 7.4：`SortedSet<E>` 方法\n\n![images](img/07tab04.jpg)\n\n表 7.5：`NavigableSet<E>`\
  \ 方法\n\n![images](img/07tab05.jpg)\n\n### 7.4\\. 映射（Maps）\n\n映射存储了键和值之间的关联。调用 `put`\
  \ 来添加新的关联，或更改现有键的值：\n\n```java\nvar counts = new HashMap<String, Integer>();\n\n\
  counts.put(\"Alice\", 1); // 向映射中添加键/值对\n\ncounts.put(\"Alice\", 2); // 更新键的值\n\
  ```\n\n此示例使用了哈希映射，与集合一样，如果你不需要按排序顺序访问键，那么它通常是更好的选择。如果需要，请使用 `TreeMap` 替代。\n\n以下是获取与某个键关联的值的方法：\n\
  \n```java\nint count = counts.get(\"Alice\");\n```\n\n如果键不存在，`get` 方法返回 `null`。在示例中，当对值进行自动拆箱（unboxing）时，这会导致\
  \ `NullPointerException`。更好的替代方案是：\n\n```java\nint count = counts.getOrDefault(\"\
  Alice\", 0);\n```\n\n当键不存在时，`getOrDefault` 方法返回默认值。在示例中，当值进行自动拆箱时，这会避免 `NullPointerException`。更好的替代方案是：\n\
  \n```java\ncounts.merge(\"Alice\", 1, Integer::sum);\n```\n\n当键不存在时，`merge` 方法会将新值与现有值合并。`merge`\
  \ 方法简化了这一点：\n\n```java\ncounts.merge(\"Alice\", 1, Integer::sum);\n```\n\n如果键不存在，则返回\
  \ `0`。表 7.6 总结了映射的操作。\n\n表 7.6：`Map<K, V>` 方法\n\n![images](img/07tab06.jpg)![images](img/07tab06.jpg)\n\
  \n你可以通过这些方法获取映射的键、值和条目的*视图*：\n\n```\nSet<K> keySet()\n\nSet<Map.Entry<K, V>> entrySet()\n\
  \nCollection<V> values()\n```\n\n返回的集合不是映射的拷贝，但它们与映射是连接的。如果你从视图移除键或条目，该条目也会从映射中移除。\n\
  \n要遍历映射的所有键和值，可以使用 `entrySet` 方法：\n\n```java\nfor (Map.Entry<String, Integer> entry\
  \ : counts.entrySet()) {\n\n    String k = entry.getKey();\n\n    Integer oldValue\
  \ = entry.getValue();\n\n    int newValue = ...;\n\n    entry.setValue(newValue);\n\
  }\n```\n\n`Map.Entry` 实例与映射也是连接的。从前面的代码段可以看出，你可以使用 `entry` 对象更新映射中的值。相反，如果你通过其他方式（例如调用映射的\
  \ `put` 方法），条目也会更新。\n\n如果你想将条目传递给其他方法，应该通过 `Map.Entry.copyOf(entry)` 将它们从映射中分离。你也可以通过\
  \ `Map.entry(key, value)` 创建未关联的 `Map.Entry` 实例。这在你需要值对时非常方便。\n\n如果你不需要修改映射，使用 `forEach`\
  \ 方法遍历条目更简单：\n\n```java\ncounts.forEach((k, v) -> {\n\n   Process k, v\n\n});\n\
  ```\n\n### 警告\n\n如果你在用迭代器访问一个正在被修改的数据结构，它可能会失效。如果你继续使用它，无效的迭代器可能会抛出 `ConcurrentModificationException`。这是一个典型的示例：\n\
  \n```java\nvar friends = new LinkedList<String>(List.of(\"Fred\", \"Wilma\", \"\
  Barney\"));\n\nfor (String name : friends) {\n\n    if (name.length() < 5) friends.remove(name);\
  \ // Error—concurrent modification\n\n}\n```\n\n增强型 `for` 循环使用迭代器来遍历列表。当列表被修改时，迭代器\n\
