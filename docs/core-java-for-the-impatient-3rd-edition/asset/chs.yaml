  \ `list(FilenameFilter)` 方法，写一个返回给定目录下具有特定扩展名的文件的方法。使用 lambda 表达式而不是 `FilenameFilter`。它捕获了封装作用域中的哪个变量？\n\
  \n13. 给定一个 `File` 对象数组，对其进行排序，使得目录在文件之前，在每个组内，元素按路径名称排序。使用 lambda 表达式指定 `Comparator`。\n\
  \n14. 写一个方法，接收一个 `Runnable` 实例数组并返回一个 `Runnable`，其 `run` 方法按顺序执行这些实例。返回一个 lambda\
  \ 表达式。\n\n15. 写一个 `Arrays.sort` 的调用，按薪水对员工进行排序，相同的按名称。使用 `Comparator.thenComparing`。然后以反序执行此操作。\n\
  \n16. 在 3.9.1 节中将 `RandomSequence` 实现为一个嵌套类，位于 `randomInts` 方法之外。\n\n## 4. 继承与反射\n\
  \n前面的章节向你介绍了类和接口。在本章中，你将学习面向对象编程的另一个基本概念：继承。继承是基于现有类创建新类的过程。当你继承一个现有类时，你重用了（或继承了）它的方法，并可以添加新的方法和字段。\n\
  \n### 注意\n实例变量和静态变量统称为 `fields`（字段）。类内部的字段、方法和嵌套类/接口统称为它的 `members`（成员）。\n\n本章还涵盖反射，即在运行程序中发现更多关于类及其成员信息的能力。反射是一个强大的特性，但不可否认地复杂。由于反射对工具构建者比对应用程序程序员更有趣，你第一次阅读时可以略过该章的这部分，以后再回来。\n\
  \n本章的要点是：\n\n1. 子类可以继承或重写父类的方法，只要它们不是 `private` 的。\n2. 使用 `super` 关键字调用父类方法或构造函数。\n\
  3. `final` 方法不能被重写；`final` 类不能被扩展。\n4. `abstract` 方法没有实现；`abstract` 类不能实例化。\n5.\
  \ 父类的 `protected` 成员在子类方法中是可访问的，但仅当应用于相同子类的对象时有效。它在所在的包中也是可访问的。\n6. 每个类都是 `Object`\
  \ 的子类，它提供了 `toString`、`equals`、`hashCode` 和 `clone` 方法。\n7. `sealed`（密封）类型指定了可以在其他源文件中定义的子类型。\n\
  8. 每个枚举类型都是 `Enum` 的子类，它提供了实例方法 `toString` 和 `compareTo` 以及静态方法 `valueOf`。\n9. `Class`\
  \ 类提供了关于 Java 类型的信息，该类型可以是类、数组、接口、基本类型或 `void`。\n10. 你可以使用 `Class` 对象加载放置在类文件旁边的资源。\n\
  11. 你可以使用类加载器从类路径以外的位置加载类。\n12. `ServiceLoader` 类提供了一种定位和选择服务实现的机制。\n13. 反射库允许程序发现成员、访问变量和调用方法。\n\
  14. 代理对象动态地实现接口，将所有方法调用路由到处理器中。\n\n### 4.1 扩展类\n\n让我们回到第 2 章中讨论过的 `Employee` 类。假设（唉）你在一家经理对经理对待方式不同的公司工作。当然，经理在许多方面和员工一样。员工和经理都领取薪水。然而，员工被期望完成任务以换取薪水，而经理如果他们实际上应该实现的目标，就能获得奖金。这种情况可以用继承来建模。\n\
  \n### 4.1.1 父类与子类\n\n让我们定义一个新类 `Manager`，保留 `Employee` 类的一些功能，但指定经理的特殊之处。\n\n```\n\
  public class Manager extends Employee {\n\n    新增的字段\n\n    新增或重写的方法\n\n}\n```\n\
  \n`extends` 关键字表示你正在创建一个派生自现有类的新类。现有类被称为 `superclass`（父类），新类被称为 `subclass`（子类）。在我们的示例中，`Employee`\
  \ 类是父类，`Manager` 类是子类。注意，父类并不“优于”它的子类。相反：子类的功能比父类更多。父/子术语源于集合论。经理集是员工集的子集。\n\n###\
  \ 4.1.2 定义和继承子类方法\n\n我们的 `Manager` 类有一个新的实例变量来存储奖金，并有一个新方法来设置它：\n\n```\npublic class\
  \ Manager extends Employee {\n\n    private double bonus;\n\n    ...\n\n    public\
  \ void setBonus(double bonus) {\n\n        this.bonus = bonus;\n\n    }\n\n}\n```\n\
  \n当你拥有一个 `Manager` 对象时，你当然可以应用 `setBonus` 方法，以及 `Employee`类的非私有方法。这些方法是*继承*的。\n\n\
  ```\nManager boss = new Manager(...);\n\nboss.setBonus(10000); // 在子类中定义\n\nboss.raiseSalary(5);\
  \ // 继承自父类\n```\n\n### 4.1.3 方法重写\n\n\n\n\n\n有时，需要在子类中修改父类方法。例如，假设 `getSalary` 方法预期用于报告员工的总薪资。那么，所继承的方法对于\
  \ `Manager` 类来说是不够的。相反，你需要 `override`（重写）该方法，以便其返回基本工资和奖金之和。\n\n```\npublic class\
  \ Manager extends Employee {\n\n    ...\n\n    public double getSalary() { // 重写父类方法\n\
  \n        return super.getSalary() + bonus;\n\n    }\n}\n```\n\n该方法调用了父类方法，该方法获取基本工资并加上奖金。注意，子类方法无法直接访问父类的私有实例变量。这就是为什么\
  \ `Manager.getSalary` 方法调用了公有的 `Employee.getSalary` 方法。`super` 关键字用于调用父类方法。\n\n\
  ### 注意事项\n\n与 `this` 不同，`super` 不是对象的引用，而是一个用于跳过动态方法查找（参见第 4.1.5 节）并调用特定方法的指令。\n\
  \n在重写方法时并不要求调用父类方法，但这样做很常见。\n\n当你重写一个方法时，必须小心确保参数类型完全匹配。例如，假设 `Employee` 类有一个方法：\n\
  \n```\npublic boolean worksFor(Employee supervisor)\n```\n\n如果你在 `Manager` 类中重写此方法，你不能更改参数类型，尽管显然没有经理会向一个普通的员工汇报。假设你定义了这样一个方法：\n\
  \n```\npublic class Manager extends Employee {\n\n    ...\n\n    public boolean\
  \ worksFor(Manager supervisor) {\n\n        ...\n\n    }\n}\n```\n\n这仅仅是一个新方法，现在\
  \ `Manager` 拥有了两个独立的 `worksFor` 方法。你可以通过对意图重写父类方法的方法标记 `@Override` 注解，来防止此类错误的发生：\n\
  \n```java\n@Override public boolean worksFor(Employee supervisor)\n```\n\n如果你犯了错误并正在定义一个新方法，编译器会报告错误。\n\
  \n在重写方法时，你可以将返回类型更改为子类型。（在术语中，允许使用`协变返回类型`/covariant return types。）例如，如果 `Employee`\
  \ 类有一个方法：\n\n```\npublic Employee getSupervisor()\n```\n\n那么 `Manager` 类可以使用以下方法重写它：\n\
  \n```\n@Override public Manager getSupervisor()\n```\n\n### 警告\n\n当重写方法时，子类方法的访问权限必须**至少与父类方法相同**（at\
  \ least as accessible）。特别是，如果父类方法是 public 的，那么子类方法也必须声明为 `public`。一个常见的错误是不小心漏掉了子类方法的\
  \ `public` 修饰符。此时，编译器会对访问权限过弱报错。\n\n#### 4.1.4 子类的构造\n\n让我们为 `Manager` 类提供一个构造函数。由于\
  \ `Manager` 构造函数无法访问 `Employee`类的私有实例变量，它必须通过父类构造函数来初始化它们。\n\n```\npublic Manager(String\
  \ name, double salary) {\n\n    super(name, salary);\n\n    bonus = 0;\n\n}\n```\n\
  \n在这里，`super` 关键字表示调用父类 `Employee` 的构造函数并将 `name` 和 `salary` 作为参数。父类构造函数的调用必须是子类构造函数的**第一条语句**（first\
  \ statement）。\n\n如果子类没有显式调用任何父类构造函数，则父类必须有一个会被隐式调用的无参构造函数。\n\n#### 4.1.5 父类赋值\n\n\
  将子类的对象赋值给类型为父类的变量是合法的，例如：\n\n```\nManager boss = new Manager(...);\n\nEmployee empl\
  \ = boss; // 赋值给父类变量是允许的\n```\n\n现在考虑当在父类变量上调用方法时会发生什么。\n\n```\ndouble salary =\
  \ empl.getSalary();\n```\n\n尽管 `empl` 的类型是 `Employee`，但调用的是 `Manager.getSalary`\
  \ 方法。在调用方法时，虚拟机会查看对象的实际类并定位其方法版本。这个过程被称为`动态方法查找`（dynamic method lookup）。\n\n你为什么要将一个\
  \ `Manager` 对象赋值给 `Employee` 变量呢？它允许你编写适用于**所有**（all）员工的代码，无论是经理、清洁工还是另一个 `Employee`\
  \ 子类的实例。\n\n```\nEmployee[] staff = new Employee[...];\n\nstaff[0] = new Employee(...);\n\
  \nstaff[1] = new Manager(...); // 赋值给父类变量是允许的\n\nstaff[2] = new Janitor(...);\n\n\
  ...\n\ndouble sum = 0;\n\nfor (Employee empl : staff)\n    sum += empl.getSalary();\n\
  ```\n\n多亏于动态方法查找，调用 `empl.getSalary()` 调用的是 `empl` 所引用对象的 `getSalary` 方法，这可能是 `Employee.getSalary`、`Manager.getSalary`\
  \ 等。\n\n### 警告\n\n在 Java 中，父类赋值也适用于数组：你可以将 `Manager[]` 数组赋值给 `Employee[]` 变量。（技术术语是\
  \ Java 数组是**协变的**/covariant。）这很方便，但也是**不安全的**（unsound）——即类型错误的可能原因。考虑这个例子：\n\n```\n\
  Manager[] bosses = new Manager[10];\n\nEmployee[] empls = bosses; // 在 Java 中合法\n\
  \nempls[0] = new Employee(...); // 运行时错误\n```\n\n编译器接受最后一条语句，因为在 `Employee[]` 数组中存储\
  \ `Employee` 通常是合法的。然而，这里 `empls` 和 `bosses` 指向同一个 `Manager[]` 数组，它无法持有 `Employee`。这个错误只有在运行时被发现，虚拟机会抛出\
  \ `ArrayStoreException`。\n\n#### 4.1.6 强制转换\n\n在上一节中，你看到类型为 `Employee` 的变量可以引用 `Employee`、`Manager`\
  \ 或另一个 `Employee` 子类的对象。这对于处理多个类的对象很有用。但只有一个缺点：你只能调用属于父类的方法。例如：\n\n```\nEmployee\
  \ empl = new Manager(...);\n\nempl.setBonus(10000); // 编译错误\n```\n\n尽管这个调用在运行时可以成功，但它是编译错误。编译器检查你只调用接收者类型存在的方法。在这里，`empl`\
  \ 类型为 `Employee`，该类没有 `setBonus` 方法。\n\n与接口一样，你可以使用 `instanceof` 运算符和强制转换将父类转换为子类。\n\
  \n```\nif (empl instanceof Manager mgr) {\n    mgr.setBonus(10000);\n}\n```\n\n\
  #### 4.1.7 匿名子类\n\n正如你可以创建一个接口的匿名类，你可以创建一个扩展父类的匿名类。这对于调试非常有用：\n\n```\nvar names\
  \ = new ArrayList<String>(100) {\n\n    public void add(int index, String element)\
  \ {\n        super.add(index, element);\n        System.out.printf(\"Adding %s at\
  \ %d\\n\", element, index);\n    }\n\n};\n```\n\n父类名称后括号中的参数被传递给父类构造函数。在这里，我们构造了一个\
  \ `ArrayList<String>` 的匿名子类，它重写了 `add` 方法。实例构造时的初始容量为 100。\n\n一种被称为`双括号初始化`（double\
  \ brace initialization）的技巧以一种非常奇怪的方式使用了内部类语法。假设你想构造一个数组列表并将其传递给方法：\n\n```\nvar friends\
  \ = new ArrayList<String>();\n\nfriends.add(\"Harry\");\n\nfriends.add(\"Sally\"\
  );\n\ninvite(friends);\n```\n\n如果你再也不需要这个数组列表，那么把它变成匿名类会很好。但那么，如何添加元素呢？方法如下：\n\n\
  ```\ninvite(new ArrayList<String>() {{ add(\"Harry\"); add(\"Sally\"); }});\n```\n\
  \n注意双大括号。外层大括号创建了一个 `ArrayList<String>` 的匿名子类。内部大括号是一个初始化块（参见第 2 章）。\n\n\n\n\n我不建议你在\
  \ Java 趣味知识竞赛之外使用这种技巧。它是低效的。取决于 `equals` 方法的实现方式，所构建的对象在相等性测试中的行为可能不一致。\n\n如果 `invite`\
  \ 方法参数的类型为 `List`，只需按照如下方式调用：\n\n```\ninvite(List.of(\"Harry\", \"Sally\"));\n```\n\
  \n### 4.1.8 使用 `super` 的方法表达式\n\n回想第 3 章，方法表达式可以以 `object`::::`instanceMethod` 的形式存在。使用\
  \ `super` 代替对象引用也是有效的。方法表达式\n\n```\nsuper::instanceMethod\n```\n\n使用 `this` 作为目标，并调用给定方法的父类版本。这里是一个展示其机制的人工示例：\n\
  \n```\npublic class Worker {\n\n    public void work() {\n\n         for (int i\
  \ = 0; i < 100; i++) System.out.println(\"Working\");\n\n    }\n\n}\n\npublic class\
  \ ConcurrentWorker extends Worker {\n\n    public void work() {\n\n        var t\
  \ = new Thread(super::work);\n\n        t.start();\n\n    }\n}\n```\n\n该线程构建时使用了一个\
  \ `Runnable`，其 `run` 方法调用了父类的 `work` 方法。\n\n### 4.2 继承层次结构\n\n你刚刚看到了如何扩展一个类。显然，你可以再次扩展子类并重复该过程，形成类的类的层次结构。在接下来的章节中，你将学习\
  \ Java 语言提供的用于控制此类继承结构中可以操作内容的构造。\n\n#### 4.2.1 final 方法和类\n\n当你将一个方法声明为 `final`\
  \ 时，没有任何子类可以重写它。\n\n```\npublic class Employee {\n\n    ...\n\n    public final\
  \ String getName() {\n\n        return name;\n\n    }\n}\n```\n\nJava API 中 `final`\
  \ 方法的一个很好的例子是 `Object` 类的 `getClass` 方法，你将在第 4.5.1 节中看到。允许对象对其所属的类撒谎并不明智，因此该方法永远无法更改。\n\
  \n一些程序员认为 `final` 关键字有助于效率。这在 Java 早期可能是真的，但现在不再是了。现代虚拟机会推测地“内联”简单方法（例如上面的 `getName`\
  \ 方法），即使它们没有被声明为 `final`。在加载了重写了此类方法的子类的罕见情况下，内联会被取消。\n\n一些程序员认为一个类的大多数方法都应该声明为\
  \ `final`，只有那些专门设计为可重写的方法才不如此。另一些人认为这种做法过于严苛，因为阻止了即使是无害的重写（例如为了日志记录或调试目的）。\n\n偶尔你可能希望防止别人从你的某个类中创建子类。在类定义中使用\
  \ `final` 修饰符来指示这一点。例如，这里是防止他人对 `Executive` 类进行扩展的方法：\n\n```\npublic final class\
  \ Executive extends Manager {\n\n    ...\n\n}\n```\n\nJava API 中有很多 `final` 类，例如\
  \ `String`、`LocalTime` 和 `URL`。\n\n#### 4.2.2 抽象方法和类\n\n类可以定义一个没有实现体的方法，迫使子类去实现它。这种方法以及包含它的类被称为\
  \ `abstract`（抽象），并且必须标记有 `abstract` 修饰符。这通常用于非常通用的类，例如：\n\n```\npublic abstract\
  \ class Person {\n\n    private String name;\n\n    public Person(String name) {\
  \ this.name = name; }\n\n    public final String getName() { return name; }\n\n\
  \    public abstract int getId();\n\n}\n```\n\n任何扩展 `Person` 的类必须提供 `getId` 方法的实现，或者本身被声明为\
  \ `abstract`。\n\n请注意，抽象类可以拥有非抽象方法，例如上一个示例中的 `getName` 方法。\n\n**注意**\n\n与接口不同，抽象类可以拥有实例变量和构造函数。\n\
  \n无法构造抽象类的实例。例如，以下调用\n\n```\nPerson p = new Person(\"Fred\"); // 错误\n```\n\n将是一个编译时错误。\n\
  \n然而，你可以拥有一个类型为抽象类的变量，只要它包含一个指向具体子类对象的引用。假设 `Student` 类声明如下：\n\n```\npublic class\
  \ Student extends Person {\n\n    private int id;\n\n    public Student(String name,\
  \ int id) { super(name); this.id = id; }\n\n    public int getId() { return id;\
  \ }\n\n}\n```\n\n那么你就可以构建一个 `Student` 并将其赋值给 `Person` 变量。\n\n```\nPerson p = new\
  \ Student(\"Fred\", 1729); // OK，具体子类\n```\n\n#### 4.2.3 protected 访问\n\n有时你希望将方法限制为仅子类可见，或者较少地，允许子类方法访问父类的实例变量。为了这一点，将类特性声明为\
  \ `protected`。\n\n例如，假设父类 `Employee` 将实例变量 `salary` 声明为 `protected` 而不是 `private`。\n\
  \n```\npackage com.horstmann.employees;\n\npublic class Employee {\n\n    protected\
  \ double salary;\n\n    ...\n\n}\n```\n\n与 `Employee` 相同包的所有类都可以访问此字段。现在考虑来自不同包的子类：\n\
  \n```\npackage com.horstmann.managers;\n\nimport com.horstmann.employees.Employee;\n\
  \npublic class Manager extends Employee {\n\n    ...\n\n    public double getSalary()\
  \ {\n\n        return salary + bonus; // 访问受保护变量 OK\n\n    }\n\n    protected double\
  \ bonus;\n\n}\n```\n\n`Manager` 类只能访问 `Manager` 对象的 `salary` 变量，而不能访问 `Employee`\
  \ 对象的。这种限制是为了防止你通过创建子类来滥用保护机制以获取受保护特性。当然，受保护字段应该谨慎使用。一旦提供，你就无法在破坏使用它们的类的情况下撤销它们。\n\
  \n受保护的方法和构造函数更为常见。例如，`Object` 类的 `clone` 方法是受保护的，因为使用它有些复杂（参见第 4.3.4 节）。\n\n**警告**\n\
  \n在 Java 中，`protected` 授予包级访问权限，仅保护来自其他包的访问。\n\n#### 4.2.4 密封类型\n\n除非类被声明为 `final`，否则任何人都可以创建它的子类。如果你想有更多控制权呢？例如，假设你觉得需要编写自己的\
  \ JSON 库，因为现有的没有一个完全符合你的需求。\n\nJSON 标准规定 JSON 值是数组、数字、字符串、布尔值、对象或空。一种明显的方法是用 `JSONArray`、`JSONNumber`\
  \ 等类来建模，这些类扩展抽象类 `JSONValue`：\n\n```\npublic abstract class JSONValue\n\n{\n\n \
  \  // 适用于所有 JSON 值的方法\n\n}\n\npublic final class JSONArray extends JSONValue\n\n\
  {\n\n   . . .\n\n}\n\npublic final class JSONNumber extends JSONValue\n\n{\n\n \
  \  . . .\n\n}\n```\n\n通过将 `JSONArray`、`JSONNumber` 等类声明为 `final`，我们可以确保没有人创建子类。但我们无法阻止任何人创建\
  \ `JSONValue` 的另一个子类。\n\n我们为什么可能需要这种控制权？考虑这段代码，它使用了带有模式匹配的 `switch` 表达式（Java 17\
  \ 的预览功能）：\n\n```\npublic String type()\n\n{\n\n   return switch (this)\n   {\n \
  \     case JSONArray j -> \"array\";\n      case JSONNumber j -> \"number\";\n \
  \     case JSONString j -> \"string\";\n      case JSONBoolean j -> \"boolean\"\
  ;\n      case JSONObject j -> \"object\";\n      case JSONNull j -> \"null\";\n\
  \      // 这里不需要 default\n   };\n\n}\n```\n\n编译器可以检查出不需要 `default` 子句，因为 `JSONValue`\
  \ 的所有直接子类都作为 case 出现。\n\n注意\n\n\n\n\n前面的 `type` 方法看起来并不非常面向对象。符合面向对象（OOP）精神的做法是让六个类中的每一个都提供自己的\
  \ `type` 方法，依赖于多态而不是 `switch` 语句。对于开放的层次结构，这是一个很好的方法。但当存在一组固定的类时，将所有备选方案放在一个方法中通常更方便。\n\
  \n我们希望编译器知道 `JSONValue` 的所有直接子类。这不是一个开放的层次结构。JSON 标准不会改变。即使它改变了，我们这些库实现者也会添加第七个子类。我们不希望别人来干扰这个类层次结构。\n\
  \n在 Java 中，`sealed`（密封）类控制哪些类可以扩展它。`sealed` 接口（密封接口）控制哪些类可以实现它。\n\n以下是如何将 `JSONValue`\
  \ 类声明为密封类的：\n\n```\npublic abstract sealed class JSONValue\n\n   permits JSONArray,\
  \ JSONNumber, JSONString, JSONBoolean, JSONObject, JSONNull\n\n{\n\n   . . .\n\n\
  }\n```\n\n定义一个未被许可的子类是错误的：\n\n```\npublic class JSONComment extends JSONValue {\
  \ . . . } // 错误\n```\n\n这倒也好，因为 JSON 不允许注释。正如你所看到的，密封类型允许对领域约束进行精确建模。\n\n密封类型的所有直接子类型必须在同一个包中。然而，如果你使用了模块（参见第\
  \ 15 章），那么它们必须在同一个模块中。\n\n**注意**\n\n密封类型可以在不带 `permits` 子句的情况下声明。在这种情况下，它的所有直接子类型必须声明在同一个文件中。无法访问该文件的程序员无法创建子类型。\n\
  \n初看之下，密封类的子类似乎必须是 `final`（最终）。但对于穷尽性测试，我们只需要知道所有的直接子类。如果这些类有进一步的子类，那并不是问题。例如，我们可以这样重组\
  \ JSON 层次结构：\n\n![Images](img/04fig01a.jpg)\n\n在这个层次结构中，`JSONValue` 允许三个子类：\n\n\
  ```\npublic abstract sealed class JSONValue permits JSONObject, JSONArray, JSONPrimitive\
  \ {\n\n  . . .\n}\n```\n\n`JSONPrimitive` 类也是密封的：\n\n```\npublic abstract sealed\
  \ class JSONPrimitive extends JSONValue\n\n     permits JSONString, JSONNumber,\
  \ JSONBoolean, JSONNull {\n\n  . . .\n}\n```\n\n密封类的子类必须指定它是 `sealed`、`final` 还是允许扩展的\
  \ `open`。在后者的情况下，它必须被声明为 `non-sealed`（非密封）。\n\n**注意**\n\n由于 `sealed` 关键字比 Java 语言要年轻得多，它是“上下文相关”的。它只在作为类型修饰符使用时才具有意义。你可以声明名为\
  \ `sealed` 的变量或方法：\n\n```\nint sealed = 1; // 使用上下文关键字作为标识符\n```\n\n当然，由于连字符的存在，你不能将\
  \ `non-sealed` 作为标识符。唯一的歧义在于减法：\n\n```\nint non = 0;\n\nnon = non-sealed; // 减法，而不是关键字\n\
  ```\n\n你为什么需要一个 `non-sealed` 子类？考虑一个具有六个直接子类的 XML 节点类：\n\n```\npublic abstract sealed\
  \ class Node permits Element, Text, Comment,\n\n      CDATASection, EntityReference,\
  \ ProcessingInstruction\n\n{\n\n   ...\n\n}\n```\n\n然而，以下 `Element` 类不是密封的，并且允许任意的子类：\n\
  \n```\npublic non-sealed class Element extends Node { ... }\n\npublic class HTMLDivElement\
  \ extends Element { ... }\n\npublic class HTMLImgElement extends Element { ... }\n\
  \n...\n```\n\n**注意**\n\n本节中的示例展示了如何使用密封类。接口也可以是密封的。Record 和枚举不能被扩展，因此它们不能被密封。然而，它们可以扩展密封接口。\n\
  \n### 4.2.5 继承和默认方法\n\n假设一个类扩展另一个类并实现了一个接口，两者恰好都有同名的方法。\n\n```\npublic interface\
  \ Named {\n\n    default String getName() { return \"\"; }\n}\n\npublic class Person\
  \ {\n\n    ...\n\n    public String getName() { return name; }\n\n}\n\npublic class\
  \ Student extends Person implements Named {\n\n    ...\n\n}\n```\n\n在这种情况下，父类的实现总是优于接口的实现。子类不需要解决这种冲突。\n\
  \n相反，正如你在第 3 章中看到的，当从两个接口继承相同的默认方法时，你必须解决这种冲突。\n\n“类胜出”规则确保了兼容性。如果你向接口添加默认方法，它对在没有默认方法之前运行的代码没有影响。\n\
  \n### 4.3 `Object`：宇宙超级父类\n\nJava 中的每个类都直接或间接地扩展 `Object` 类。当一个类没有显式的父类时，它会隐式地扩展\
  \ `Object`。例如，\n\n```java\npublic class Employee { ... }\n```\n\n等同于\n\n```java\n\
  public class Employee extends Object { ... }\n```\n\n`Object` 类定义了适用于任何 Java 对象的方法（参见表\
  \ 4.1）。我们将在接下来的章节中详细检查其中的几个方法。\n\n**注意**\n\n数组是类。因此，将数组（即使是基本类型数组）转换为 `Object` 类型的引用是合法的。\n\
  \n表 4.1：`java.lang.Object` 类的方法\n\n![images](img/04tab01.jpg)\n\n#### 4.3.1 `toString`\
  \ 方法\n\n`Object` 类中的一个重要方法是 `toString`，它返回对象的字符串描述。例如，`Point` 类的 `toString` 方法返回如下字符串：\n\
  \n```\njava.awt.Point[x=10,y=20]\n```\n\n许多 `toString` 方法遵循这种格式：类名，后面跟着方括号内的实例变量。这里是\
  \ `Employee` 类的 `toString` 方法实现：\n\n```\npublic String toString() {\n\n    return\
  \ getClass().getName() + \"[name=\" + name\n\n        + \",salary=\" + salary +\
  \ \"]\";\n}\n```\n\n通过调用 `getClass().getName()`不是硬编码字符串 \"Employee\"，该方法对子类有效。\n\
  \n在子类中，调用 `super.toString()` 并添加子类的实例变量，使用另一对方括号：\n\n```\npublic class Manager extends\
  \ Employee {\n\n    ...\n\n    public String toString() {\n\n        return super.toString()\
  \ + \"[bonus=\" + bonus + \"]\";\n\n    }\n\n}\n```\n\n对象与字符串拼接时，Java 编译器会自动调用 `toString`\
  \ 方法。例如：\n\n```\nvar pos = new Point(10, 20);\n\nString message = \"The current\
  \ position is \" + pos;\n\n// 拼接 pos.toString()\n```\n\n**提示**\n\n与其写 `x.toString()`，你可以写\
  \ `\"\" + x`。这个表达式即使 `x` 为 `null` 或基本类型值也有效。\n\n`Object` 类定义 `toString` 方法来打印类名和哈希值（参见节\
  \ 4.3.3）。例如，调用\n\n```\nSystem.out.println(System.out)\n```\n\n产生类似于 `java.io.PrintStream@2f6684`\
  \ 的输出，因为 `PrintStream` 类的实现者没有重写 `toString` 方法。\n\n**注意**\n\n数组继承自 `Object` 的 `toString`\
  \ 方法，异常的是数组类型以旧格式打印。例如，如果你有数组\n\n```\nint[] primes = { 2, 3, 5, 7, 11, 13 };\n```\n\
  \n那么 `primes.toString()` 会产生类似于 `[I@1a46e30` 的字符串。前缀 `[I` 表示整数数组。\n\n解决办法是改用 `Arrays.toString(primes)`，这将产生字符串\
  \ `[2, 3, 5, 7, 11, 13]`。为了正确打印多维数组（即数组的数组），使用 `Arrays.deepToString`。\n\n#### 4.3.2\
  \ `equals` 方法\n\n\n\n\n\n`equals` 方法用于测试一个对象是否被认为与另一个对象相等。`Object` 类中实现的 `equals`\
  \ 方法判断两个对象引用是否是完全相同的（相同）。这是一个非常合理的默认行为——如果两个对象是完全相同的，它们它们理应该是相等的。对于许多类来说，不需要其他操作。例如，比较两个\
  \ `Scanner` 对象的相等性并没有意义。\n\n仅在进行基于状态的相等性测试时才重写 `equals` 方法，在这种情况下，当两个对象的内容相同时，它们被认为是相等。例如，`String`\
  \ 类重写了 `equals` 来检查两个字符串是否由相同的字符组成。\n\n### 注意\n\n每当你重写 `equals` 方法时，*必须*也提供一个兼容的\
  \ `hashCode` 方法——参见第 4.3.3 节。\n\n假设我们认为如果 `Item` 类的两个对象的描述和价格匹配，则认为它们相等。以下是实现 `equals`\
  \ 方法的方法：\n\n```\npublic class Item {\n\n    private String description;\n\n    private\
  \ double price;\n\n    ...\n\n    public boolean equals(Object otherObject) {\n\n\
  \        // 检查对象是否完全相同的快速测试\n\n        if (this == otherObject) return true;\n\n\
  \        // 如果参数为 null，必须返回 false\n\n        if (otherObject == null) return false;\n\
  \n        // 检查 otherObject 是否为 Item 类型\n\n        if (getClass() != otherObject.getClass())\
  \ return false;\n\n        // 测试实例变量是否具有相同的值\n        var other = (Item) otherObject;\n\
  \        return Objects.equals(description, other.description)\n            && price\
  \ == other.price;\n\n    }\n\n    public int hashCode() { ... } // 参见第 4.3.3 节\n\
  \n}\n```\n\n在 `equals` 方法中，你需要完成若干例行步骤：\n\n1. 相等的对象通常是相同的，这种测试的开销非常小。\n2. 每个 `equals`\
  \ 方法都要求在与 `null` 比较时返回 `false`。\n3. 由于 `equals` 方法重写了 `Object.equals`，它的参数类型为 `Object`，你需要将其转换为实际类型以便查看其实例变量。在在此之前，请使用\
  \ `getClass` 方法或 `instanceof` 运算符进行类型检查。\n4. 最后，比较实例变量。对于基本类型使用 `==`。然而，对于 `double`\
  \ 值，如果你担心 ±∞ 或 NaN，请使用 `Double.equals`。对于对象，使用 `Objects.equals`，这是 `equals` 方法的空安全版本。调用\
  \ `Objects.equals(x, y)` 在 `x` 为 `null` 时返回 `false`，而 `x.equals(y)` 则会抛出异常。\n\n\
  ### 提示\n\n如果你有是数组的实例变量，请使用静态的 `Arrays.equals` 方法检查数组长度是否相等以及对应的数组元素是否相等。\n\n当为子类定义\
  \ `equals` 方法时，首先调用父类中的 `equals`。如果该测试没有通过，则这些对象不相等。如果父类的实例变量相等，那么你就可以准备比较子类的实例变量了。\n\
  \n```\npublic class DiscountedItem extends Item {\n\n    private double discount;\n\
  \n    ...\n\n    public boolean equals(Object otherObject) {\n\n        if (!super.equals(otherObject))\
  \ return false;\n\n        var other = (DiscountedItem) otherObject;\n\n       \
  \ return discount == other.discount;\n    }\n\n    public int hashCode() { ... }\n\
  \n}\n```\n\n注意，如果 `otherObject` 不是 `DiscountedItem`，则父类中的 `getClass` 测试将失败。\n\n\
  当比较属于不同类的值时，`equals` 方法应该如何表现？这一直是一个存在争议的领域。在以前的示例中，如果类不同，`equals` 方法将返回 `false`。许多程序员使用\
  \ `instanceof` 测试来代替：\n\n```\nif (!(otherObject instanceof Item)) return false;\n\
  ```\n\n然而，这留下了 `otherObject` 属于子类的可能性。`equals` 方法的要求之一是对称的：如果 `x` 和 `y` 相等，那么 `x.equals(y)`\
  \ 和 `y.equals(x)` 必须都返回 `true`。如果 `x` 和 `y` 不相等，那么 `x.hashCode()` 和 `y.hashCode()`\
  \ 可以不相等，但如果相等，则哈希值必须相同。对于 `x` 和 `y`，如果 `x.equals(y)`，那么 `x.hashCode() == y.hashCode()`\
  \ 必须为真的。\n\n### 4.3.3 `hashCode` 方法\n\n哈希值是一个派自对象的整数。哈希值应该是散乱的——如果 `x` 和 `y` 不相等，`x.hashCode()`\
  \ 和 `y.hashCode()` 是不同的。例如，`\"Mary\".hashCode()` 为 239079，而 `\"Myra\".hashCode()`\
  \ 为 241381。\n\n`String` 类使用以下算法计算哈希值：\n\n```\nint hash = 0;\nfor (int i = 0; i <\
  \ length(); i++)\n    hash = 31 * hash + charAt(i);\n```\n\n`Object.hashCode` 方法以依赖实现的方式派生哈希值。它可以来自内存位置、数字（顺序或伪随机）或两者的组合。由于\
  \ `Object.equals` 测试相同对象，唯一重要的是相同对象具有相同的哈希值。\n\n如果你重写 `equals` 方法，你还需要重写 `hashCode`\
  \ 方法以与 `equals` 兼容。如果不这样做，类的用户将对象插入哈希集合或哈希映射时，可能会丢失！\n\n在你的 `hashCode` 方法中，简单地组合实例变量的哈希值。例如，这里是\
  \ `Item` 类的 `hashCode` 方法：\n\n```\nclass Item {\n\n    ...\n\n    public int hashCode()\
  \ {\n        return Objects.hash(description, price);\n    }\n\n}\n```\n\n`Objects.hash`\
  \ 可变参数方法计算参数的哈希值并将它们组合。该方法是空安全的。\n\n如果你的类具有数组实例变量，请先使用静态的 `Arrays.hashCode` 方法计算它们的哈希值，该方法计算由元素组成的哈希值。将结果传递给\
  \ `Objects.hash`。\n\n#### 4.3.4 克隆对象\n\n\n\n\n你刚刚看到了 `Object` 类中常用的、经常重写的“三大”方法：`toString`、`equals`\
  \ 和 `hashCode`。在本节中，你将学习如何重写 `clone` 方法。正如你将看到的，这非常复杂，而且也并不必要。除非你有充分的理由，否则不要重写 `clone`。Java\
  \ 标准库中不足 5% 的类实现了 `clone`。\n\n`clone` 方法的目的是创建一个对象的“克隆”——一个与原始具有相同状态的不同对象。如果你修改了其中一个对象，另一个将保持不变。\n\
  \n```\nEmployee cloneOfFred = fred.clone();\n\ncloneOfFred.raiseSalary(10); // fred\
  \ 保持不变\n```\n\n`clone` 方法在 `Object` 类中被声明为 `protected`，所以如果你想让你的类的用户能够克隆实例，就必须重写它。\n\
  \n`Object.clone` 方法执行的是*浅拷贝*。它简单地将所有实例变量从原始对象拷贝到克隆对象。如果这些变量是基本类型或不可变对象，那是没问题的。但如果它们不是，原始对象和克隆对象将共享可变状态，这可能会引发问题。\n\
  \n考虑一个拥有收件者列表的邮件类。\n\n```java\npublic final class Message {\n\n    private String\
  \ sender;\n\n    private ArrayList<String> recipients;\n\n    private String text;\n\
  \n    ...\n\n    public void addRecipient(String recipient) { ... };\n\n}\n```\n\
  \n如果你对 `Message` 对象进行浅拷贝，原始对象和克隆对象将共享 `recipients` 列表（参见图 4.2）：\n\n```\nMessage\
  \ specialOffer = ...;\n\nMessage cloneOfSpecialOffer = specialOffer.clone();\n```\n\
  \n![Images](img/04fig02.jpg)\n\n图 4.2：对象的浅拷贝\n\n如果其中一个对象更改了收件者列表，更改将反映在另一个对象上。因此，`Message`\
  \ 类需要重写 `clone` 方法以实现*深拷贝*。\n\n克隆可能是不可能，或者不值得尝试。例如，克隆一个 `Scanner` 对象将非常有挑战性。\n\n\
  通常情况下，当你实现一个类时，你需要决定：\n\n1. 你不想提供 `clone` 方法，或者\n2. 继承来的 `clone` 方法是可以接受的，或者\n3.\
  \ `clone` 方法应该执行深拷贝。\n\n对于第一种选择，什么都不做即可。你的类将继承 `clone` 方法，但你的类的用户将无法调用它，因为它是 `protected`\
  \ 的。\n\n要选择第二种方案，你的类必须实现 `Cloneable` 接口。这是一个没有任何任何方法的接口，被称为*标记*接口（tagging or marker\
  \ interface）。（记住 `clone` 方法定义在 `Object` 类中）。`Object.clone` 方法在执行浅拷贝之前会检查是否实现了此接口，否则将抛出\
  \ `CloneNotSupportedException`。\n\n你可能还想将 `clone` 的作用范围从 `protected` 提升到 `public`，并更改返回类型。\n\
  \n最后，你需要处理 `CloneNotSupportedException`。这是一个*检查型*异常，正如你在第 5 章中看到的，你必须要么声明它要么捕获它。如果你的类是\
  \ `final` 的，你可以捕获它。否则，请声明该异常，因为子类可能再次想要抛出它。\n\n```java\npublic class Employee implements\
  \ Cloneable {\n\n    ...\n\n    public Employee clone() throws CloneNotSupportedException\
  \ {\n         return (Employee) super.clone();\n\n    }\n\n}\n```\n\n强制转换 `(Employee)`\
  \ 是必要的，因为 `Object.clone` 的返回类型是 `Object`。\n\n实现 `clone` 方法的第三种选择（类需要执行深拷贝）是最复杂的情况。你完全不需要使用\
  \ `Object.clone` 方法。这里是 `Message.clone` 的简单实现：\n\n```java\npublic Message clone()\
  \ {\n\n    var cloned = new Message(sender, text);\n\n    cloned.recipients = new\
  \ ArrayList<>(recipients);\n\n    return cloned;\n\n}\n```\n\n或者，你可以在父类和可变实例变量上调用\
  \ `clone`。\n\n`ArrayList` 类实现了 `clone` 方法产生浅拷贝。这意味着原始列表和克隆列表共享元素引用。在我们的情况下，这是没问题的，因为元素是字符串。如果不是，我们必须克隆每个元素。\n\
  \n然而，由于历史原因，`ArrayList.clone` 方法的返回类型是 `Object`。你需要使用强制转换。\n\n```\ncloned.recipients\
  \ = (ArrayList<String>) recipients.clone(); // 警告\n```\n\n不幸的是，正如你在第 6 章中看到的，该转换无法在编译时完全检查，你会得到一个警告。你可以使用注解来抑制警告，但该注解只能附加到声明（参见第\
  \ 12 章）。这里是完整的方法实现：\n\n```java\npublic Message clone() {\n\n    try {\n        var\
  \ cloned = (Message) super.clone();\n\n        @SuppressWarnings(\"unchecked\")\
  \ var clonedRecipients\n\n            = (ArrayList<String>) recipients.clone();\n\
  \n        cloned.recipients = clonedRecipients;\n\n        return cloned;\n\n  \
  \  } catch (CloneNotSupportedException ex) {\n        return null; // 不可能\n\n  \
  \  }\n}\n```\n\n在这种情况下，`CloneNotSupportedException` 不可能，因为 `Message` 类是 `final`\
  \ 的，且 `ArrayList` 不抛出该异常。\n\n注意\n\n如果 `recipients` 是一个数组而不是列表，你可以这样克隆它：\n\n```\n\
  cloned.recipients = (ArrayList<String>) recipients.clone();\n```\n这里不需要强制转换。\n\n\
  ### 4.4 枚举类\n\n你在第 1 章中看到了如何定义枚举类型。这里有一个典型的示例，定义了四个实例：\n\n```java\npublic enum Size\
  \ { SMALL, MEDIUM, LARGE, EXTRA_LARGE };\n```\n\n在接下来的章节中，你将看到如何处理枚举。\n\n#### 4.4.1\
  \ 枚举类的方法\n\n由于枚举类型的每个实例都是唯一的，你永远不需要使用 `equals`。只需使用 `==` 来比较它们即可。（如果你喜欢，也可以调用 `equals`，它会触发\
  \ `==` 测试。）\n\n你也不需要提供 `toString` 方法。它会自动提供，以返回枚举对象的名称——在我们的示例中，为 `\"SMALL\"`、`\"\
  MEDIUM\"` 等。\n\n`toString` 的反向是静态方法 `valueOf`，它为每个枚举类型合成。例如，语句\n\n```\nSize notMySize\
  \ = Size.valueOf(\"SMALL\");\n```\n将 `notMySize` 设置为 `Size.SMALL`。如果没有对应名称的实例，`valueOf`\
  \ 方法将抛出异常。\n\n每个枚举类型都有一个静态 `values` 方法，按声明顺序返回枚举的所有实例。调用\n\n```\nSize[] allValues\
  \ = Size.values();\n```\n返回包含 `Size.SMALL`、`Size.MEDIUM` 等元素的数组。\n\n提示\n\n使用增强型\
  \ `for` 循环遍历枚举类型的所有实例：\n\n```java\nfor (Size s : Size.values()) { System.out.println(s);\
  \ }\n```\n\n`ordinal` 方法产生实例在 `enum` 声明中的位置，从零开始。例如，`Size.MEDIUM.ordinal()` 返回 `1`。当然，你需要小心使用这个方法。如果插入新的常量，值会发生偏移。\n\
  \n每个枚举类型 `E` 自动实现 `Comparable<E>`，允许仅与其自己的对象进行比较。比较按序值进行。\n\n注意\n\n从技术上，枚举类型 `E`\
  \ 扩展了 `Enum<E>` 类，并从中继承 `compareTo` 方法以及本节描述的其他方法。表 4.2 显示了 `Enum` 类的方法。\n\n####\
  \ 4.4.2 构造函数、方法和字段\n\n如果你喜欢，可以为枚举类型添加构造函数、方法和字段。这里有一个示例：\n\n\n\n\n```java\npublic\
  \ enum Size {\n\n    SMALL(\"S\"), MEDIUM(\"M\"), LARGE(\"L\"), EXTRA_LARGE(\"XL\"\
  );\n\n    private String abbreviation;\n\n    Size(String abbreviation) {\n    \
  \    this.abbreviation = abbreviation;\n    }\n\n    public String getAbbreviation()\
  \ { return abbreviation; }\n}\n```\n\n枚举的每个实例都保证只被构造一次。\n\n### 注意\n枚举的构造函数始终是私有（private）的。你可以省略\
  \ `private` 修饰符，如前面的示例所示。将枚举构造函数声明为 `public` 或 `protected` 会导致语法错误。\n\n### 4.4.3.\
  \ 实例体\n\n你可以为每个单独的 `enum` 实例添加方法，但这些方法必须重写在枚举中定义的方法。例如，为了实现一个计算器，你可以这样做：\n\n```java\n\
  public enum Operation {\n\n    ADD {\n        public int eval(int arg1, int arg2)\
  \ { return arg1 + arg2; }\n    },\n\n    SUBTRACT {\n        public int eval(int\
  \ arg1, int arg2) { return arg1 - arg2; }\n    },\n\n    MULTIPLY {\n        public\
  \ int eval(int arg1, int arg2) { return arg1 * arg2; }\n    },\n\n    DIVIDE {\n\
  \        public int eval(int arg1, int arg2) { return arg1 / arg2; }\n    };\n\n\
  \    public abstract int eval(int arg1, int arg2);\n\n}\n```\n\n在计算器程序的循环中，人们会根据用户输入将一个变量设置为这些值之一，然后调用\
  \ `eval`：\n\n```java\nOperation op = ...;\n\nint result = op.eval(first, second);\n\
  ```\n\n### 注意\n从技术上讲，这些常量每一个都属于 `Operation` 的一个匿名子类。任何你可以放入匿名子类体中的内容，也可以添加到成员的体中。\n\
  \n### 4.4.4. 静态成员\n\n枚举拥有静态成员是合法的。然而，你必须小心构造顺序。枚举常量是在静态成员*之前*构造的，因此你不能在枚举构造函数中引用任何静态成员。例如，以下代码是非法的：\n\
  \n```java\npublic enum Modifier {\n\n    PUBLIC, PRIVATE, PROTECTED, STATIC, FINAL,\
  \ ABSTRACT;\n\n    private static int maskBit = 1;\n\n    private int mask;\n\n\
  \    Modifier() {\n        mask = maskBit; // 错误—无法在构造函数访问静态变量\n\n        maskBit\
  \ *= 2;\n    }\n\n    ...\n\n}\n```\n\n解决办法是在静态初始化器中进行初始化：\n\n```java\npublic enum\
  \ Modifier {\n\n    PUBLIC, PRIVATE, PROTECTED, STATIC, FINAL, ABSTRACT;\n\n   \
  \ private int mask;\n\n    static {\n        int maskBit = 1;\n\n        for (Modifier\
  \ m : Modifier.values()) {\n            m.mask = maskBit;\n\n            maskBit\
  \ *= 2;\n        }\n\n    }\n\n    ...\n\n}\n```\n\n一旦常量构造完成，静态变量初始化和静态初始化器将按照通常的、从上到下的方式运行。\n\
  \n### 注意\n枚举类型可以嵌套在类内部。这种嵌套枚举是隐式的静态嵌套类——这意味着，它们的方法不能引用外部类的实例变量。\n\n### 4.4.5. 对枚举进行\
  \ switch\n\n你可以在 `switch` 表达式或语句中使用枚举常量。\n\n```java\nenum Operation { ADD, SUBTRACT,\
  \ MULTIPLY, DIVIDE };\n\npublic static int eval(Operation op, int arg1, int arg2)\
  \ {\n    return switch (op) {\n        case ADD -> arg1 + arg2;\n        case SUBTRACT\
  \ -> arg1 - arg2;\n        case MULTIPLY -> arg1 * arg2;\n        case DIVIDE ->\
  \ arg1 / arg2;\n    }\n}\n```\n\n如果你为枚举的所有实例都提供了分支，就不需要 `default` 情况。\n\n请注意，在 `switch`\
  \ 语句内部，你可以使用 `ADD` 代替 `Operation.ADD`。枚举是从操作数的类型推断出来的。\n\n### 提示\n如果你想在 `switch`\
  \ 外部通过简单名称引用枚举的实例，请使用静态导入声明。例如，使用以下声明：\n\n```java\nimport static com.horstmann.corejava.Size.*;\n\
  ```\n\n你可以使用 `SMALL` 代替 `Size.SMALL`。\n\n### 4.5. 运行时类型信息与资源\n\n在 Java 中，你可以在运行时确定给定对象属于哪个类。这有时是有用的，例如，在\
  \ `equals` 和 `toString` 方法的实现中。此外，你可以发现该类是如何加载的，并加载与其相关的数据，称为*资源*。\n\n#### 4.5.1.\
  \ `Class` 类\n\n假设你有一个 `Object` 类型的变量，其中填充了某些对象引用，你想了解更多关于该对象的信息，例如它属于哪个类。\n\n`getClass`\
  \ 方法产生一个名为 `Class` 的类的对象，这并不意外。\n\n```java\nObject obj = ...;\n\nClass<?> cl = obj.getClass();\n\
  ```\n\n### 注意\n请参阅第 6 章 关于 `<?>` 后缀的解释。目前，只需忽略它即可。但不要省略它。如果你省略了，不仅你的 IDE 会给你出一个难看的警告，还会关闭涉及该变量的表达式中的用类型检查。\n\
  \n一旦你有了一个 `Class` 对象，就可以找到类名：\n\n```java\nSystem.out.println(\"This object is an\
  \ instance of \" + cl.getName());\n```\n\n或者，你可以使用静态方法 `Class.forName` 获取类名：\n\n\
  ```java\nString className = \"java.lang.String\";\n\nClass<?> cl = Class.forName(className);\n\
  ```\n\n### 警告\n`Class.forName` 方法以及许多其他用于反射的方法，在出现问题时会抛出受检异常（例如，当没有指定名称的类时）。目前，请参阅第\
  \ 5 章了解如何处理异常。如果你提前知道想要哪个类，请使用*类字面量*代替：\n\n```java\nClass<?> cl = Scanner.class;\n\
  ```\n\n`.class` 后缀也可以用于获取其他类型的信息：\n\n```java\nClass<?> cl2 = String[].class; //\
  \ 描述数组类型 String[]\n\nClass<?> cl3 = Runnable.class; // 描述 Runnable 接口\n\nClass<?>\
  \ cl4 = int.class; // 描述 int 类型\n\nClass<?> cl5 = void.class; // 描述 void 类型\n```\n\
  \n数组是 Java 中的类，但接口、原始类型和 `void` 不是。`Class` 这个名字有点不好——`Type` 会更准确。\n\n### 警告\n`getName`\
  \ 方法为数组类型返回奇怪的名字：\n\n```java\nString[].class.getName() // 返回 \"[Ljava.lang.String;\"\
  \n```\n\n```java\nint[].class.getName() // 返回 \"[I\"\n```\n\n这种表示法自虚拟机古代时代起一直存在。使用\
  \ `getCanonicalName` 代替可以获取如 `\"java.lang.String[]\"` 和 `\"int[]\"` 的名字。\n\n虚拟机为每个类型管理唯一的\
  \ `Class` 对象。因此，你可以使用 `==` 运算符来比较类对象。例如：\n\n```java\nif (other.getClass() == Employee.class)\
  \ ...\n```\n\n你已经在第 4.3.2 节见过这种类对象的用法。\n\n在接下来的章节中，你将看到可以使用 `Class` 对象做什么。参见表 4.3\
  \ 获取方法的总结。\n\n#### 4.5.2. 加载资源\n\n`Class` 类的一个有用服务是定位程序需要的资源，例如配置文件或图像。如果你将资源放在与类文件相同的目录下，可以这样打开该文件的输入流：\n\
  \n```java\nInputStream stream = MyClass.class.getResourceAsStream(\"config.txt\"\
  );\n\nvar in = new Scanner(stream);\n```\n\n\n\n\n\n一些遗留方法如 `Applet.getAudioClip`\
  \ 和 `javax.swing.ImageIcon` 构造函数从 `URL` 对象读取数据。在这种情况下，你可以使用 `getResource` 方法，它会返回指向资源的\
  \ `URL`。\n\n资源可以包含子目录，这些目录可以是相对路径或绝对路径。例如，`MyClass.class.getResourceAsStream(\"\
  /config/menus.txt\")` 在 `MyClass` 所属包根目录所在的目录下定位 `config/menus.txt`。\n\n如果你将类打包成\
  \ JAR 文件，并将资源与类文件一起压缩，那么它们也会被正确定位。\n\n### 4.5.3 类加载器 (Class Loaders)\n\n虚拟机指令存储在类文件中。每个类文件包含针对单个类或接口的指令。类文件可以位于文件系统、JAR\
  \ 文件、远程位置，甚至可以在内存中动态构建。一个``class loader`（类加载器）负责加载字节流并将它们转换为虚拟机中的类或接口。\n\n虚拟机按需（on-demand）加载类文件，从要调用的包含\
  \ `main` 方法的类开始。该类将依赖于其他类，例如 `java.lang.System` 和 `java.util.Scanner`，这些类将与它们所依赖的类一起加载。\n\
  \n执行 Java 程序时，至少涉及三个类加载器。\n\n`bootstrap class loader`（启动类加载器）加载最基础的 Java 库类。它是虚拟机的一部分。\n\
  \n`platform class loader`（平台类加载器）加载其他库类。与启动类加载器加载的类不同，平台类加载器的权限可以通过安全策略进行配置。\n\n\
  `system class loader`（系统类加载器）加载应用程序类。它在类路径（class path）和模块路径（module path）上的目录和 JAR\
  \ 文件中定位类。\n\n### 注意事项\n\n在 Oracle JDK 的之前的版本中，平台和系统类加载器是 `URLClassLoader` 类的实例。现在已不再如此。某些程序员使用\
  \ `URLClassLoader` 的 `getURLs` 方法来查找类路径。请改用 `System.getProperty(\"java.class.path\"\
  )`。\n\n你可以通过创建自己的 `URLClassLoader` 实例，从尚未在类路径上的目录或 JAR 文件中加载类。这通常用于加载插件。\n\n```\n\
  URL[] urls = {\n    new URL(\"file:///path/to/directory/\"),\n    new URL(\"file:///path/to/jarfile.jar\"\
  )\n};\n\nString className = \"com.mycompany.plugins.Entry\";\n\ntry (var loader\
  \ = new URLClassLoader(urls)) {\n    Class<?> cl = Class.forName(className, true,\
  \ loader);\n    // 现在构造 cl 的实例——参见第 4.6.4 节\n    ...\n}\n```\n\n### 注意事项\n\n在调用\
  \ `Class.forName(className, true, loader)` 时，第二个参数确保类的静态初始化在加载后发生。你绝对希望这种情况发生。\n\
  \n不要使用 `ClassLoader.loadClass` 方法。它不会运行静态初始化器。\n\n#### Note 释\n\n`URLClassLoader`\
  \ 从文件系统加载类。如果你想从其他地方加载类，则需要编写自己的类加载器。你只需要实现的方法是 `findClass`，如下所示：\n\n```\npublic\
  \ class MyClassLoader extends ClassLoader {\n\n    ...\n\n    @Override public Class<?>\
  \ findClass(String name)\n              throws ClassNotFoundException {\n      \
  \  byte[] bytes = the bytes of the class file\n        return defineClass(name,\
  \ bytes, 0, bytes.length);\n    }\n\n}\n```\n\n参见第 14 章 关于类被编译到内存中然后加载的示例。\n\n###\
  \ 4.5.4 上文类加载器 (The Context Class Loader)\n\n大多数时候，你不需要担心类加载过程。类在被其他类需要时会被透明地加载。然而，如果一个方法动态加载类，而该方法是从一个本身通过另一个类加载器加载的类中调用的，就会出现问题。这里有一个具体的例子。\n\
  \n1. 你提供了一个由系统类加载器加载的工具类，它有一个方法：\n```\npublic class Util {\n    Object createInstance(String\
  \ className) {\n        Class<?> cl = Class.forName(className);\n        ...\n \
  \   }\n    ...\n}\n```\n\n2. 你使用另一个类加载器加载插件，它从插件 JAR 中读取类。\n\n3. 插件调用 `Util.createInstance(\"\
  com.mycompany.plugins.MyClass\")` 来实例化插件 JAR 中的类。\n\n插件的作者期望该类被加载。然而，`Util.createInstance`\
  \ 使用它自己的类加载器来执行 `Class.forName`，而该类加载器不会查找插件 JAR。这种现象被称为 `classloader inversion`（类加载器反转）。\n\
  \n一种解决方法是将类加载器传递给工具方法，然后传递给 `forName` 方法。\n\n```\npublic class Util {\n    public\
  \ Object createInstance(String className, ClassLoader loader) {\n        Class<?>\
  \ cl = Class.forName(className, true, loader);\n        ...\n    }\n    ...\n}\n\
  ```\n\n另一种策略是使用当前线程的`context class loader`（上下文类加载器）。主线程的上下文类加载器是系统类加载器。当创建新线程时，它的上下文类加载器被设置为创建线程的上下文类加载器。因此，如果你不做任何操作，所有线程的上下文类加载器都将设置为系统类加载器。但是，你可以通过调用设置任何类加载器：\n\
  \n```\nThread t = Thread.currentThread();\nt.setContextClassLoader(loader);\n```\n\
  \n工具方法随后可以获取该类加载器：\n```\npublic class Util {\n    Object createInstance(String className)\
  \ {\n        Thread t = Thread.currentThread();\n        ClassLoader loader = t.getContextClassLoader();\n\
  \        Class<?> cl = Class.forName(className, true, loader);\n        ...\n  \
  \  }\n}\n```\n\n#### Tip\n\n如果你写了一个通过名称加载类的方法，不要简单地使用方法的类加载器。调用插件类的方法时，应用程序将类加载器设置为插件加载器。之后恢复之前的设置。\n\
  \n### 4.5.5 服务加载器 (Service Loaders)\n\n某些服务在程序组装或部署时需要配置。实现此目的的方法是提供不同的实现，并让程序从中选择一个。`ServiceLoader`\
  \ 类便于加载符合通用接口的服务实现。\n\n定义一个接口（或者如果你喜欢，一个超类），包含每个服务实例应该提供的方法。例如，假设你的服务提供加密。\n\n```java\n\
  package com.corejava.crypt;\n\npublic interface Cipher {\n    byte[] encrypt(byte[]\
  \ source, byte[] key);\n    byte[] decrypt(byte[] source, byte[] key);\n    int\
  \ strength();\n}\n```\n\n服务提供者提供一个或多个实现此服务的类，例如\n\n```java\npackage com.corejava.crypt.impl;\n\
  \npublic class CaesarCipher implements Cipher {\n    public byte[] encrypt(byte[]\
  \ source, byte[] key) {\n        var result = new byte[source.length];\n       \
  \ for (int i = 0; i < source.length; i++)\n            result[i] = (byte)(source[i]\
  \ + key[0]);\n        return result;\n    }\n\n    public byte[] decrypt(byte[]\
  \ source, byte[] key) {\n        return encrypt(source, new byte[] { (byte) -key[0]\
  \ });\n    }\n\n    public int strength() { return 1; }\n}\n```\n\n现在在 `META-INF/services`\
  \ 目录下的一个 UTF-8 编码文本文件中添加提供者类的名称。文件名是接口的全限定名。在我们的示例中，文件 `META-INF/services/com.corejava.crypt.Cipher`\
  \ 包含行：\n\n```\ncom.corejava.crypt.impl.CaesarCipher\n```\n\n\n\n\n\n完成这些准备后，程序将如下初始化服务加载器：\n\
  \n```java\npublic static ServiceLoader<Cipher> cipherLoader = ServiceLoader.load(Cipher.class);\n\
  ```\n\n这在程序中只需执行一次。\n\n服务加载器的 `iterator` 方法提供了一个用于遍历所有提供的服务实现的迭代器。（有关迭代器的更多详细信息，请参阅第\
  \ 7 章）。使用增强型 `for` 循环来遍历它们是最简单的。在循环中，选择一个合适的对象来执行服务。\n\n```java\npublic static Cipher\
  \ getCipher(int minStrength) {\n\n    for (Cipher cipher : cipherLoader) // 隐式调用\
  \ iterator\n\n        if (cipher.strength() >= minStrength) return cipher;\n\n \
  \   return null;\n\n}\n```\n\n或者，你可以使用流（参见第 8 章）来定位所需的服务。`stream` 方法产生一个 `ServiceLoader.Provider`\
  \ 实例的流。该接口拥有 `type` 和 `get` 方法，用于获取提供者类和提供者实例。如果你按类型选择提供者，只需调用 `type`，而不会不必要地实例化服务实例。在示例中，我们需要获取提供者，因为我们要对具有所需强度的加密流进行过滤：\n\
  \n```java\npublic static Optional<Cipher> getCipher2(int minStrength) {\n\n    return\
  \ cipherLoader.stream()\n\n        .map(ServiceLoader.Provider::get)\n        .filter(c\
  \ -> c.strength() >= minStrength)\n        .findFirst();\n\n}\n```\n\n如果你愿意接受任何实现，只需调用\
  \ `findFirst`：\n\n```java\nOptional<Cipher> cipher = cipherLoader.findFirst();\n\
  ```\n\n`Optional` 类在第 8 章中会有解释。\n\n## 4.6. 反射\n\n反射允许程序在运行时检查对象的内容，并在其上调用任意方法。这种能力对于实现如对象关系映射器或\
  \ GUI 构建器等工具非常有用。\n\n由于反射主要对工具的构建者感兴趣，应用程序程序员可以安全地跳过本节，并在需要时再回来。\n\n### 4.6.1. 枚举类成员\n\
  \n`java.lang.reflect` 包中的三个类 `Field`、`Method` 和 `Constructor` 描述类的字段、方法和构造函数。所有三个类都有一个名为\
  \ `getName` 的方法，返回成员名称。`Field` 类有一个 `getType` 方法，返回一个 `Class` 对象，描述字段类型。`Method`\
  \ 和 `Constructor` 类拥有报告类型的方法，`Method` 类也报告返回类型。\n\n这三个类都有一个名为 `getModifiers` 的方法，返回一个整数，其位描述了使用的修饰符（如\
  \ `public` 或 `static`）。你可以使用 `Modifier.isPublic` 和 `Modifier.isStatic` 等静态方法来分析\
  \ `getModifiers` 返回的整数。`Modifier.toString` 返回修饰符的字符串。`Class` 类 `getFields`、`getMethods`\
  \ 和 `getConstructors` 方法返回支持的公共字段、方法和构造函数；这包括继承的成员。`getDeclaredFields`、`getDeclaredMethods`\
  \ 和 `getDeclaredConstructors` 方法返回类声明的所有字段、方法和构造函数；这包括私有的、包私有的成员，但不包括父类的成员。`Executable`\
  \ 类 `getParameters` 方法返回描述方法参数的 `Parameter` 对象数组。\n\n**注意**\n\n只有当类使用 `-parameters`\
  \ 标志编译时，参数名称在运行时才是可用的。例如，这里是你可以打印类所有的方法：\n\n```java\nClass<?> cl = Class.forName(className);\n\
  \nwhile (cl != null) {\n\n      for (Method m : cl.getDeclaredMethods()) {\n\n \
  \         System.out.println(\n              Modifier.toString(m.getModifiers())\
  \ + \" \" +\n              m.getReturnType().getCanonicalName() + \" \" +\n    \
  \          m.getName() + Arrays.toString(m.getParameters()));\n\n      }\n\n   \
  \   cl = cl.getSuperclass();\n}\n```\n\n这段代码的卓越之处在于它可以分析 Java 虚拟机加载的任何类——而不仅仅是编译时可类。\n\
  \n**注意**\n\n正如你在第 15 章中看到的，Java 平台模块系统对反射访问有严格限制。默认情况下，只有同一模块中的类可以通过反射进行分析。然而，Java\
  \ 库类属于不同的模块，对其非公共成员的反射访问是被限制的。\n\n### 4.6.2. 检查对象\n\n如上一节所示，你可以获取描述对象字段类型和名称的 `Field`\
  \ 对象。这些 `Field` 对象可以更多：它们可以访问具有该字段的对象的值。例如，这里是枚举对象所有字段的方法：\n\n```java\nObject obj\
  \ = ...;\n\nfor (Field f : obj.getClass().getDeclaredFields()) {\n\n    f.setAccessible(true);\n\
  \n    Object value = f.get(obj);\n\n    System.out.println(f.getName() + \":\" +\
  \ value);\n}\n```\n\n关键在于读取字段值的 `get` 方法。如果字段是基本类型，则返回一个包装对象；在这种情况下，你也可以调用 `getInt`、`getDouble`\
  \ 等。\n\n**注意**\n\n在使用 `Field` 和 `Method` 对象之前，必须使它们“可访问”。调用 `setAccessible(true)`\
  \ 会解锁字段或方法。然而，模块系统或安全管理器可能会阻止请求。在这种情况下，如果字段或方法不可访问，`trySetAccessible` 方法简单返回 `false`。\n\
  \n**注意**\n\n正如你在第 15 章中看到的，Java 平台包包含在模块中，其类受来自反射的保护。例如，如果你调用\n\n```java\nField\
  \ f = String.class.getDeclaredField(\"value\");\n\nf.setAccessible(true);\n```\n\
  \n将抛出 `InaccessibleObjectException`。\n\n一旦字段可访问，你也可以设置它。这段代码将作用于 `obj`，无论它属于哪个类，只要它有一个\
  \ `double` 或 `Double` 类型的 `salary` 字段。\n\n```java\nField f = obj.getClass().getDeclaredField(\"\
  salary\");\n\nf.setAccessible(true);\n\ndouble value = f.getDouble(obj);\n\nf.setDouble(obj,\
  \ value * 1.1);\n```\n\n### 4.6.3. 调用方法\n\n就像 `Field` 对象可以用于读写对象的字段一样，`Method` 对象可以在对象上调用给定的方法。\n\
  \n```java\nMethod m = ...;\n\nObject result = m.invoke(obj, arg1, arg2, ...);\n\
  ```\n\n如果方法是静态的，请为初始参数提供 `null`。\n\n要获取方法，你可以搜索在第 4.6.1 节中看到的 `getMethods` 或 `getDeclaredMethods`\
  \ 返回的数组。或者你可以调用 `getMethod` 并提供参数类型。例如，在 `Person` 对象上获取 `setName(String)` 方法：\n\n\
  ```java\nPerson p = ...;\n\nMethod m = p.getClass().getMethod(\"setName\", String.class);\n\
  \nm.invoke(obj, \"********\");\n```\n\n**注意**\n\n尽管 `clone` 是所有数组类型的公共方法，但在描述数组的\
  \ `Class` 对象上调用 `getMethod` 时，它并不会报告。\n\n### 4.6.4. 构造对象\n\n要构造对象，首先找到 `Constructor`\
  \ 对象，然后调用其 `newInstance` 方法。例如，假设你知道某个类有一个参数为 `int` 的公共构造函数。那么你可以这样构造新实例：\n\n\n\n\
  \n\n```java\nConstructor constr = cl.getConstructor(int.class);\n\nObject obj =\
  \ constr.newInstance(42);\n```\n\n### 注意事项\n\n`Class` 类有一个 `newInstance` 方法，用于通过无参构造函数构造给定类的对象。该方法现在已过时，因为它有一个奇异的缺陷：如果无参构造函数抛出了受检异常（checked\
  \ exception），`newInstance` 方法会重新抛出它，*尽管它并未被声明*，从而完全破坏了对受检异常的编译检查。相反，你应该调用 `cl.getConstructor().newInstance()`。这样任何异常都会被封装在\
  \ `InvocationTargetException` 中。\n\nTable 4.5 总结了处理 `Field`、`Method` 和 `Constructor`\
  \ 对象的最重要方法。\n\n#### 表 4.5：`java.lang.reflect` 包中的实用类和方法\n\n![images](img/04tab05.jpg)![images](img/04tab05a.jpg)\n\
  \n### 4.6.5. JavaBeans\n\n许多面向对象的编程语言支持属性，将表达式 `object.propertyName` 映射为 getter\
  \ 或 setter 方法的调用，取决于该属性是可读还是可写的。Java 没有这种语法，但它有一种约定，即属性与 getter/setter 对相对应。JavaBean\
  \ 是一个具有无参构造函数、getter/setter 对以及任意数量其他方法的类。\n\ngetter 和 setter 必须遵循特定的模式：\n\n```java\n\
  public Type getProperty()\n\npublic void setProperty(Type newValue)\n```\n\n通过省略\
  \ setter 或 getter 可以实现只读和只写属性。\n\n属性名称是 `get`/`set` 后后缀的去驼峰化（decitalized）形式。例如，`getSalary`/`setSalary`\
  \ 对会产生一个名为 `salary` 的属性。然而，如果后缀的前两个字母是大写的，则原样保留。例如，`getURL` 产生一个名为 `URL` 的只读属性。\n\
  \n### 注意\n\n对于布尔类型属性，你可以使用 `getProperty` 或 `isProperty` 作为 getter，且优选后者。\n\nJavaBeans\
  \ 起于 GUI 构造器，JavaBeans 规范包含处理属性编辑器、属性更改事件和自定义属性发现的奥秘规则。这些功能在如今很少使用。\n\n当你需要处理任意属性时，使用标准类来支持\
  \ JavaBeans 是好主意。给定一个类，如下所示获取 `BeanInfo` 对象：\n\n```java\nClass<?> cl = ...;\n\n\
  BeanInfo info = Introspector.getBeanInfo(cl);\n\nPropertyDescriptor[] props = info.getPropertyDescriptors();\n\
  ```\n\n对于给定的 `PropertyDescriptor`，调用 `getName` 和 `getPropertyType` 获取属性的名称和类型。`getReadMethod`\
  \ 和 `getWriteMethod` 产生 getter 和 setter 的 `Method` 对象。\n\n遗憾的是，没有方法根据指定的属性名获取描述符，因此你必须遍历描述符数组：\n\
  \n```java\nString propertyName = ...;\n\nObject propertyValue = null;\n\nfor (PropertyDescriptor\
  \ prop : props) {\n\n    if (prop.getName().equals(propertyName))\n       propertyValue\
  \ = prop.getReadMethod().invoke(obj);\n}\n```\n\n### 4.6.6. 处理数组\n\n`isArray` 方法检查给定的\
  \ `Class` 对象是否表示数组。如果是，`getComponentType` 方法产生描述数组元素类型的 `Class`。若要进行进一步分析或动态创建数组，请使用\
  \ `java.lang.reflect` 包中的 `Array` 类。Table 4.6 显示了它的方法。\n\n作为一个练习，让我们实现 `Arrays`\
  \ 类中的 `copyOf` 方法。回想该方法如何用于扩展一个已满的数组。\n\n```java\nvar friends = new Person[100];\n\
  \n...\n\n// 数组已满\n\nfriends = Arrays.copyOf(friends, 2 * friends.length);\n```\n\
  \n如何写这样一个泛型方法？这里是第一次尝试：\n\n```java\npublic static Object[] badCopyOf(Object[] array,\
  \ int newLength) { // 无用\n\n    var newArray = new Object[newLength];\n\n    for\
  \ (int i = 0; i < Math.min(array.length, newLength); i++)\n\n        newArray[i]\
  \ = array[i];\n\n    return newArray;\n\n}\n```\n\n然而，在实际使用生成的数组时存在问题。此方法返回的数组类型是\
  \ `Object[]`。对象数组不能被强制转换为 `Person[]` 数组。点在于，正如我们之前提到的，Java 数组会记住其元素的类型——即创建它的 `new`\
  \ 表达式中所使用的类型。将 `Person[]` 数组临时强制转换为 `Object[]` 数组然后再转换回是合法的，但一个初始类型为 `Object[]`\
  \ 数组的数组永远无法转换为 `Person[]` 数组。\n\n为了创建一个与原数组相同类型的新数组，你需要 `Array` 类的 `newInstance`\
  \ 方法。提供组件类型和所需的长度：\n\n```java\npublic static Object goodCopyOf(Object array, int\
  \ newLength) {\n\n    Class<?> cl = array.getClass();\n\n    if (!cl.isArray())\
  \ return null;\n\n    Class<?> componentType = cl.getComponentType();\n\n    int\
  \ length = Array.getLength(array);\n\n    Object newArray = Array.newInstance(componentType,\
  \ newLength);\n\n    for (int i = 0; i < Math.min(length, newLength); i++) {\n\n\
  \        Array.set(newArray, i, Array.get(array, i));\n    }\n\n    return newArray;\n\
  }\n```\n\n注意此 `copyOf` 方法可以扩展任何类型的数组，而不只是数组。\n\n```java\nint[] primes = { 2, 3,\
  \ 5, 7, 11 };\n\nint[] copy = (int[]) copyOf(primes, 10);\n```\n\n`copyOf` 的参数类型是\
  \ `Object`，而不是 `Object[]`。\n\n表 4.6：`java.lang.reflect.Array` 类\n\n![images](img/04tab06.jpg)\n\
  \n### 4.6.7. 代理\n\n`Proxy` 类可以在运行时创建给定接口的新类。这种代理只有在编译时不知道需要实现哪些接口时才是必要的。\n\n代理类拥有指定接口所需的方法，以及\
  \ `Object` 类中定义的方法（`toString`、`equals` 等）。然而，由于无法在运行时为这些方法定义新代码，你需要提供一个调用处理器（invocation\
  \ handler），即实现 `InvocationHandler` 接口的对象。该接口有一个方法：\n\n```java\nObject invoke(Object\
  \ proxy, Method method, Object[] args)\n```\n\n当在代理对象上调用方法时，处理器的 `invoke` 方法会被调用，并传入\
  \ `Method` 对象和调用参数。处理器必须决定如何处理该调用。处理器可以采取许多操作，例如将调用路由到远程服务器或为了调试目的跟踪调用。\n\n要创建代理对象，使用\
  \ `Proxy` 类的 `newProxyInstance` 方法。该方法有三个参数：\n\n![images](img/sq.jpg) 类加载器（参见第 4.5.3\
  \ 节），或使用 `null` 使用默认类加载器\n\n![images](img/sq.jpg) `Class` 对象数组，每个接口对应一个\n\n![images](img/sq.jpg)\
  \ 调用处理器\n\n为了展示代理的机械原理，这里有一个示例，其中数组填充了 `Integer` 对象的代理，并将调用转发给原始对象：\n\n```java\n\
  var values = new Object[1000];\n\nfor (int i = 0; i < values.length; i++) {\n\n\
  \    var value = Integer.valueOf(i);\n\n    values[i] = Proxy.newProxyInstance(\n\
  \        null,\n\n        value.getClass().getInterfaces(),\n\n        // 调用处理器的\
  \ Lambda 表达式\n        (Object proxy, Method m, Object[] margs) -> {\n\n        \
  \    System.out.println(value + \".\" + m.getName() + Arrays.toString(margs));\n\
  \n            return m.invoke(value, margs);\n\n        });\n\n}\n```\n\n当调用\n\n\
  ```java\nArrays.binarySearch(values, Integer.valueOf(500));\n```\n\n时会产生以下输出：\n\n\
  \n\n\n\n```\n499.compareTo[500]\n749.compareTo[500]\n624.compareTo[500]\n561.compareTo[500]\n\
  530.compareTo[500]\n514.compareTo[500]\n506.compareTo[500]\n502.compareTo[500]\n\
  500.compareTo[500]\n```\n\n你可以看到二分查找算法如何每一步将搜索范围缩小一半来定位目标键。\n\n关键点在于，`compareTo`\
  \ 方法是通过代理调用的，尽管这在代码中并没有显式提到。`Integer` 实现的任何接口中的所有方法都被代理了。\n\n### 注意事项\n\n当调用处理程序（invocation\
  \ handler）被无参数的方法调用时，参数数组为 `null`，而不是长度为 `0` 的 `Object[]` 数组。这是完全不可理喻的，你不应该在自己的代码中这样做。\n\
