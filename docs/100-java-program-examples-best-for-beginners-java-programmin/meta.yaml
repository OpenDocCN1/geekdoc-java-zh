    \n# 100 JAVA PROGRAM\n\nBEST FOR COMPUTER SCIENCE STUDENTS\n\nDEVBRAT RUDRA\n\n\
    # 100 JAVA PROGRAM\n\nBY - DEVBRAT RUDRA\n\nwww.englishmybook.com | www.rudyhelp.com\n\
    \n## SET-1\n\n### 1. Hello World:\n\n```java\npublic class HelloWorld {\n    public\
    \ static void main(String[] args) {\n        System.out.println(\"Hello, World!\"\
    );\n    }\n}\n```\n\n### 2. Add Two Numbers:\n\n```java\npublic class AddTwoNumbers\
    \ {\n    public static void main(String[] args) {\n        int num1 = 5, num2\
    \ = 15, sum;\n        sum = num1 + num2;\n        System.out.println(\"Sum of\
    \ these numbers: \" + sum);\n    }\n}\n```\n\n### 3. Factorial of a Number:\n\n\
    ```java\npublic class Factorial {\n    public static void main(String[] args)\
    \ {\n        int num = 5;\n        long factorial = 1;\n        for (int i = 1;\
    \ i <= num; ++i) {\n            factorial *= i;\n        }\n        System.out.println(\"\
    Factorial of \" + num + \" = \" + factorial);\n    }\n}\n```\n\n### 4. Fibonacci\
    \ Series:\n\n```java\npublic class Fibonacci {\n    public static void main(String[]\
    \ args) {\n        int n = 10, t1 = 0, t2 = 1;\n        System.out.print(\"Fibonacci\
    \ Series: \");\n        for (int i = 1; i <= n; ++i) {\n            System.out.print(t1\
    \ + \" \");\n            int sum = t1 + t2;\n            t1 = t2;\n          \
    \  t2 = sum;\n        }\n    }\n}\n```\n\n### 5. Reverse a String\n\n```java\n\
    public class ReverseString {\n    public static void main(String[] args) {\n \
    \       String str = \"Hello World\";\n        String reversed = new StringBuilder(str).reverse().toString();\n\
    \        System.out.println(\"Reversed string: \" + reversed);\n    }\n}\n```\n\
    \n### 6. Check for Even or Odd:\n\n```java\npublic class EvenOrOdd {\n    public\
    \ static void main(String[] args) {\n        int num = 5;\n        if (num % 2\
    \ == 0) {\n            System.out.println(\"The number is even.\");\n        }\
    \ else {\n            System.out.println(\"The number is odd.\");\n        }\n\
    \    }\n}\n```\n\n### 7. Check for Prime Number:\n\n```java\npublic class PrimeNumber\
    \ {\n    public static void main(String[] args) {\n        int num = 29;\n   \
    \     boolean flag = false;\n        for (int i = 2; i <= num / 2; ++i) {\n  \
    \          if (num % i == 0) {\n                flag = true;\n               \
    \ break;\n            }\n        }\n        if (!flag) {\n            System.out.println(num\
    \ + \" is a prime number.\");\n        } else {\n            System.out.println(num\
    \ + \" is not a prime number.\");\n        }\n    }\n}\n```\n\n### 8. Sum of Natural\
    \ Numbers:\n\n```java\npublic class SumOfNaturalNumbers {\n    public static void\
    \ main(String[] args) {\n        int num = 10, sum = 0;\n        for (int i =\
    \ 1; i <= num; ++i) {\n            sum += i;\n        }\n        System.out.println(\"\
    Sum = \" + sum);\n    }\n}\n```\n\n### 9. Generate Multiplication Table:\n\n```java\n\
    public class MultiplicationTable {\n    public static void main(String[] args)\
    \ {\n        int num = 5;\n        for (int i = 1; i <= 10; ++i) {\n         \
    \   System.out.printf(\"%d * %d = %d\\n\", num, i, num);\n        }\n    }\n}\n\
    ```\n\n### 10. Find Largest Among Three Numbers:\n\n```java\npublic class LargestAmongThree\
    \ {\n    public static void main(String[] args) {\n        double n1 = 5, n2 =\
    \ 7, n3 = 3;\n        if (n1 >= n2 && n1 >= n3) {\n            System.out.println(n1\
    \ + \" is the largest number.\");\n        } else if (n2 >= n1 && n2 >= n3) {\n\
    \            System.out.println(n2 + \" is the largest number.\");\n        }\
    \ else {\n            System.out.println(n3 + \" is the largest number.\");\n\
    \        }\n    }\n}\n```\n\n## SET-2\n\n### 1. Find the Maximum Element in an\
    \ Array:\n\n```java\npublic class MaxElement {\n    public static void main(String[]\
    \ args) {\n        int[] arr = { 1, 4, 7, 2, 9, 3 };\n        int max = arr[0];\n\
    \        for (int i = 1; i < arr.length; i++) {\n            if (arr[i] > max)\
    \ {\n                max = arr[i];\n            }\n        }\n        System.out.println(\"\
    Maximum element in the array: \" + max);\n    }\n}\n```\n\n### 2. Calculate Average\
    \ of Array:\n\n```java\npublic class AverageArray {\n    public static void main(String[]\
    \ args) {\n        double[] numbers = { 2.5, 3.4, 1.9, 3.2 };\n        double\
    \ sum = 0;\n        for (double num : numbers) {\n            sum += num;\n  \
    \      }\n        double average = sum / numbers.length;\n        System.out.println(\"\
    Average of the array: \" + average);\n    }\n}\n```\n\n### 3. Check if a String\
    \ is Palindrome:\n\n```java\npublic class PalindromeCheck {\n    public static\
    \ void main(String[] args) {\n        String original = \"madam\";\n        String\
    \ reverse = \"\";\n        for (int i = original.length() - 1; i >= 0; i--) {\n\
    \            reverse += original.charAt(i);\n        }\n        if (original.equals(reverse))\
    \ {\n            System.out.println(\"The string is a palindrome.\");\n      \
    \  } else {\n            System.out.println(\"The string is not a palindrome.\"\
    );\n        }\n    }\n}\n```\n\n### 4. Calculate Factorial using Recursion:\n\n\
    ```java\npublic class FactorialRecursive {\n    public static void main(String[]\
    \ args) {\n        int num = 5;\n        long factorial = multiplyNumbers(num);\n\
    \        System.out.println(\"Factorial of \" + num + \" = \" + factorial);\n\
    \    }\n    public static long multiplyNumbers(int num) {\n        if (num >=\
    \ 1) {\n            return num * multiplyNumbers(num - 1);\n        } else {\n\
    \            return 1;\n        }\n    }\n}\n```\n\n### 5. Display Characters\
    \ of a String:\n\n```java\npublic class DisplayCharacters {\n    public static\
    \ void main(String[] args) {\n        String str = \"Hello\";\n        for (int\
    \ i = 0; i < str.length(); i++) {\n            System.out.print(str.charAt(i)\
    \ + \" \");\n        }\n    }\n}\n```\n\n### 6. Swap Two Numbers:\n\n```java\n\
    public class SwapNumbers {\n    public static void main(String[] args) {\n   \
    \     float first = 20f, second = 45f;\n        System.out.println(\"--Before\
    \ swap--\");\n        System.out.println(\"First number: \" + first);\n      \
    \  System.out.println(\"Second number: \" + second);\n        // Value swap\n\
    \        float temporary = first;\n        first = second;\n        second = temporary;\n\
    \        System.out.println(\"--After swap--\");\n        System.out.println(\"\
    First number: \" + first);\n        System.out.println(\"Second number: \" + second);\n\
    \    }\n}\n```\n\n### 7. Calculate Power of a Number:\n\n```java\npublic class\
    \ PowerOfNumber {\n    public static void main(String[] args) {\n        int base\
    \ = 3, exponent = 4;\n        long result = 1;\n        while (exponent != 0)\
    \ {\n            result *= base;\n            --exponent;\n        }\n       \
    \ System.out.println(\"Answer = \" + result);\n    }\n}\n```\n\n### 8. Print ASCII\
    \ Value of a Character:\n\n```java\npublic class ASCIIValue {\n    public static\
    \ void main(String[] args) {\n        char ch = 'a';\n        int ascii = ch;\n\
    \        System.out.println(\"The ASCII value of \" + ch + \" is: \" + ascii);\n\
    \    }\n}\n```\n\n### 9. Display Prime Numbers between Two Intervals:\n\n```java\n\
    public class PrimeIntervals {\n    public static void main(String[] args) {\n\
    \        int low = 20, high = 50;\n        while (low < high) {\n            boolean\
    \ flag = false;\n            for (int i = 2; i <= low / 2; ++i) {\n          \
    \      if (low % i == 0) {\n                    flag = true;\n               \
    \     break;\n                }\n            }\n            if (!flag) {\n   \
    \             System.out.print(low + \" \");\n            }\n            ++low;\n\
    \        }\n    }\n}\n```\n\n### 10. Find the GCD (Greatest Common Divisor) of\
    \ Two Numbers:\n\n```java\npublic class GCD {\n    public static void main(String[]\
    \ args) {\n        int n1 = 81, n2 = 153;\n        while (n1 != n2) {\n      \
    \      if (n1 > n2)\n                n1 -= n2;\n            else\n           \
    \     n2 -= n1;\n        }\n        System.out.println(\"G.C.D = \" + n1);\n \
    \   }\n}\n```\n\n## SET-3\n\n### 1. Check Leap Year:\n\n```java\npublic class\
    \ LeapYear {\n    public static void main(String[] args) {\n        int year =\
    \ 2024;\n        boolean leap = false;\n        if (year % 4 == 0) {\n       \
    \     if (year % 100 == 0) {\n                if (year % 400 == 0)\n         \
    \           leap = true;\n                else\n                    leap = false;\n\
    \            } else\n                leap = true;\n        } else\n          \
    \  leap = false;\n        if (leap)\n            System.out.println(year + \"\
    \ is a leap year.\");\n        else\n            System.out.println(year + \"\
    \ is not a leap year.\");\n    }\n}\n```\n\n### 2. Reverse an Array:\n\n```java\n\
    import java.util.Arrays;\n\npublic class ReverseArray {\n    public static void\
    \ main(String[] args) {\n        int[] array = { 1, 2, 3, 4, 5 };\n        System.out.println(\"\
    Original Array: \" + Arrays.toString(array));\n        for (int i = 0; i < array.length\
    \ / 2; i++) {\n            int temp = array[i];\n            array[i] = array[array.length\
    \ - 1 - i];\n            array[array.length - 1 - i] = temp;\n        }\n    }\n\
    }\n```\n"
