    \ Algorithm:\n\n```java\npublic class MergeSort {\n    void merge(int[] arr, int\
    \ l, int m, int r) {\n        int n1 = m - l + 1;\n        int n2 = r - m;\n \
    \       int[] L = new int[n1];\n        int[] R = new int[n2];\n        for (int\
