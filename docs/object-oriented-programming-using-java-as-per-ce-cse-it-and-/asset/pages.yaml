  md: '# 13.5 State Diagram Behavior


    Activity

    An activity can be defined as an operation that takes time to complete its function.
    It is associated with a state. When a state enters, an activity gets started,
    and it can run to completion. But, an activity may get interrupted by an outgoing
    transition. When an activity is completed, transition occurs automatically.


    An activity can be performed upon a transition, entry to or exit from a state,
    or some other event within a state.


    A state can have the following associated activities:


    +   - Do-Activity: A do-activity is a type of activity that can be continued for
    an extended time, and it cannot be attached to a transition. A do-activity can
    be used for a continuous operation and sequential operation. Displaying a picture
    in a television is an example of continuous operation and closing a value is an
    example of sequential operation.

    - A do-activity may also be interrupted by an event that is received during its
    execution. However, such an event or may not cause a transition out of the state
    that contains the do-activity. For example, airlines try to find an alternative
    flight for its customer whenever a flight gets cancelled.


    +   - Entry-Activity: An entry-activity is a type of behavior that occurs when
    the object is transitioning into a state. For example, the schedule for a flight
    is posted on the Internet as the flight becomes scheduled.

    - Exit-Activity: An exit-activity is a type of behavior that occurs when the object
    is transitioning out of a state. For example, when a flight lands, the system
    records the landing time. Exit-activities are less common than entry activities.


    # Summary


    This chapter discussed the concept of events used in state modeling and the various
    types of events. It also explained the concept of states used in state modeling,
    transitions and conditions, and state diagram with the help of some examples.
    At the end, it covered the state diagram behavior.


    # Key Terms


    +   - Events: Represent an occurrence of something that has a location in time
    and space

    - State: Represents the current status of an object and its properties

    - Transition: Represents the relationship between two states

    - Activity: Refers to an operation that takes time to complete its function'
