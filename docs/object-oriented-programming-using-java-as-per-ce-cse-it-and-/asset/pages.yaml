    # 2.1.6.7 The Special Operators


    Here, we discuss the instanceof and dot operators. The instanceof operator is
    a binary operator that checks whether an object is of a particular type (here,
    type can be a class, interface, or an array). It is used for object reference
    variables only. The syntax to use it is instanceof:


    ```

    <objectReference> <XxxType>

    ```


    Here, the left-hand operand of the instanceof operator is object Reference, which
    must be an instance (or we can say object) of a class while the right-hand operand
    (XxxType) can be a class, interface, or an array type. The instanceof operator
    returns true if the object mentioned on the left-hand side is an instance that
    is mentioned at the right-hand side of this operator; otherwise, it (instanceof
    operator) returns false.


    Apart from the instanceof operator, in Java we use the dot (.) operator as shown
    in the following code snippet:


    ```

    x X;

    x= new X();

    nx.go();

    ```


    In the preceding snippet, the x instanceof the X class is followed by a dot (.)
    operator to invoke the method, i.e., member of the X class.


    Now after understanding all types of operators in detail, let''s discuss the precedence
    of operators and their associativity.


    # 2.2 Operator Precedence and Associativity


    In Java, each operator has an associated precedence which helps in determining
    how an expression is evaluated if more than one operator is used. On the basis
    of operator precedence, the evaluation depends. In other words, the operators
    at the higher level of precedence are evaluated first and operators of same precedence
    are evaluated either from left to right or vice versa. Such a property of operator
    is known as associativity. Table 7 describes operator precedence and its associativity.


