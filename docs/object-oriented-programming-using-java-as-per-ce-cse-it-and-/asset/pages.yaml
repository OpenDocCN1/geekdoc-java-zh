  md: '# Class Modeling and Advanced Class Modeling


    # OBJECTIVES


    +   - Describing the concept of object and class

    - Discussing the basic notations of class and object diagrams

    - Explaining links and associations

    - Discussing aggregation and composition

    - Describing the concept of generalization and inheritance

    - Discussing the concept of metadata, constraints, derived data, and packages


    A class model describes the structure of objects in the system. It is also used
    to discuss the relationships between objects. A class model contains class diagram.
    A class diagram shows a collection of classes and interfaces, along with the relationships
    among classes and interfaces.

    This chapter begins with a discussion on the concept of object and class. It also
    explains the relationship between objects and classes, the concept of generalization
    and inheritance, multiple inheritance, associations, aggregation, composition,
    metadata, and constraints. Finally, the chapter ends with a discussion on the
    concept of derived data and packages.


    # 12.1 Concepts of Object and Class


    Object was first utilized in Simul language to simulate some aspect of reality.
    An object is an entity and it provides services. An object has a well-defined
    boundary. In an object oriented system, everything is considered as an object,
    such as numbers, arrays, records, fields, etc.


    A class is a set of objects that share the same attributes, operations, relationships,
    and semantics. Class is like a template of many objects. Classes are used to classify
    objects found in real world. Class and objects are the main blocks of object oriented
    software development.


    A class diagram is used to describe static view of system in the form of classes
    and relationship between them. Class diagram contains basic aspects of system
    such as states, behavior, and relationship among objects in other dynamic models
    like sequence diagrams and state diagrams. In an object oriented application,
    classes have attributes (member variables), operations (member functions), and
    relationships with other classes.'
