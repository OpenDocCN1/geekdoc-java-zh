    # 3.1.1.3 Initializing a One-dimensional Array


    Adding values in an array is known as initialization. The syntax to initialize
    an array is as follows:


    ```

    var_name [ index_name ] = value;

    ```


    In the preceding syntax:


    +   - var_name is the array name.

    - index_no is the array index where the value is be stored.

    - value can be any number or character, which is stored at the index_no.


    See the following example to initialize an array:


    ```

    roll_no [0]=121;

    roll_no [1]=122;

    roll_no [2]=123;

    roll_no [3]=124;

    roll_no [4]=125;

    ```


    You can also initialize an array at the time of declaration. If you initialize
    an array at the time

    of declaration, you do not need to use the new keyword to assign memory to array
    elements.

    You do not need to specify the size of the array either. The syntax to initialize
    an array at the

    time of declaration is as follows:


    ```

    data_type_var_name [ ] = { array_element1, array_element2,

    array_elementn};

    ```


    In the preceding syntax:


    +   - data_type is the data type of the array, which specifies the type of elements
    that will be

    stored in the array.

    - var_name is the name of the array.

    - array_element1 is the first element, which is to be stored in the array. You
    can

    store n of elements in an array. Commas must separate all the array elements.


    While initializing an array at the time of declaration, you do not need to specify
    the array size.

    This is because at runtime itself itself calculates the array size based on the
    total number

    elements added to the array. Therefore, the JVM also internally assigns memory
    to the

    array on the basis of the calculated array size.'
