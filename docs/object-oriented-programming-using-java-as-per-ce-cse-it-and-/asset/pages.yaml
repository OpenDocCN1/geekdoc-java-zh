  md: '# 08 Working with Streams


    OBJECTIVES


    +   - Introducing streams

    - Explaining NIO

    - Describing stream classes

    - Elaborating file handling features

    - Describing buffers

    - Using character arrays

    - Describing PrintWriter class

    - Explaining StreamTokenizer class

    - Specifying Serializable interface

    - Discussing Console class

    - Describing Formatter Class

    - Explaining Scanner class


    The concept of streams was introduced to make programming more uniform for handling
    disparate data sources or stores. A stream is composed of bytes or characters
    that you can read from or write. You can connect them to data sources and stores—even
    bytes and character arrays. When using streams, you use the java.io package and
    can handle input and output in the same way—whether you are working with a file,
    a memory buffer, or a network.


    In this chapter, you learn about streams, New Input Output (NIO), and working
    with some stream classes. Next, you learn about file handling in Java. Then, you
    learn about buffers, character arrays, and the PrintWriter class. You also learn
    about the StreamTokenizer class, Serializable interface, and Console class. At
    the end of this chapter, you will learn about the Formatter class and Scanner
    class.

    Let us begin the chapter with introduction to stream.


    # 8.1 Introduction to Stream


    In Java, stream I/O is based on InputStream, OutputStream, Reader, and Writer
    classes. InputStream and OutputStream are used for byte-oriented streams (as when
    you work with binary files), while Reader and Writer classes are applied in character-oriented'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# Chapter 8


    streams (as you work with text files). You do not use these classes directly;
    instead you derive classes from them. In fact, Java has already done a lot of
    that for you, so much that there are dozens of classes to work with.


    In fact, the I/O stream classes have become somewhat of a thicket in Java. There
    seems to be at least one available for every possible use, and some of these probably
    not have even thought of. Some provide data buffering, some do not. Some are designed
    to work with data in memory buffers, some with files. We will cover the important
    ones here.


    Typically, you use a stream''s constructor to create a stream. The stream classes
    are usually divided into input and output streams, you select the one that is
    appropriate. After you have a stream object, you use its methods—typically, read()
    and write()—to transfer the data. When you are done with the stream object, you
    typically use its close() method to close and end your work with the data source
    store.


    Let us learn about NIO in the following section.


    # 8.2 Introduction to NIO


    Initially, New Input Output (NIO) was introduced with JSSE 1.4 by Sun Microsystems.
    It is a collection of Java programming language Application Programming Interfaces
    (APIs) that provides features for performing I/O operations.


    The APIs of NIO were created for providing accessibility to the low-level I/O
    operations. The objective of creating high-level APIs is to enable an implementation
    that can easily utilize the most effective operations of the existing platform.


    The java.nio package and its sub-packages contain the Java NIO APIs. Some of their
    features are listed as follows:


    +   - Buffers for the primitive data type

    - Character encoders and decoders

    - Pattern matching on the basis of Perl-style regular expressions (in the package
    java.util.regex)

    - A new primitive I/O abstraction provision

    - A file interface, which supports locking and memory mapping of files up to Integer.MAX_VALUE
    (2 GiB)

    - A multiplexed, non-blocking I/O facility for writing scalable servers


    # 8.21 Essentials in NIO


    NIO is built on two fundamental concepts—buffers and channels. These are used
    in data handling—a buffer holds data, while a channel represents an open connection
    to an I/O device, such as a file or a socket. Generally, to use the NIO system,
    you obtain a channel to an I/O device and a buffer to hold that data. Operating
    be done on the buffer by providing input or output data.'
