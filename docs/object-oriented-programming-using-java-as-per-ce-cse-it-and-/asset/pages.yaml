    # 9.4 The Enumeration


    In its simplest form, you can define Enumeration as a list of named constants.
    An Enumeration type can be considered as a special form of class while defining
    an enumeration type at the type of writing code. The specified enumeration constant
    creates as objects of the class that contains the enum class. This class is defined
    in the java.lang package assuperclass. The object corresponding to each enumeration
    constant stores the constant''s name in a field. The toString() method is inherited
    by the enumeration class type from the enum class


    Enumeration in Java is different from other languages, though it seems to be similar.
    In C++, enumeration is a list of named integer constants, while in Java, enumeration
    defines a class type. This concept is elaborated by making enumeration into classes.


    Using the new enum keywords, an Enumeration is created. For example, given here
    is a simple enumeration that lists various Wheat varieties:


    ```

    enum wheat { Durum, Spelt, Commonwheat, Emmer }

    ```


    Enumeration constants are the identifiers as Durum, Spelt, and so on each of which
    is implicitly declared as a public static member of Wheat. In addition to this,
    their type is the type of enumeration in which they are declared, which is Wheat
    in this case. These constants in Java are known as self-typed, which self-corresponds
    to the enclosed enumeration.


    You can create a variable of enumeration type you have defined. However, it is
    found that, even though enumeration defines a class type, you do not instantiate
    an enum using a new. Instead, you declare and use an enumeration variable in much
    the same way as you have done in case of the primitive types. For example, the
    code given here declares al as a variable of enumeration type Wheat:


    ```

    wheat al ;

    ```


    The only values that al can assign are defined by the enumeration, because al
    is of wheat type Wheat. For example, the value Emmer is assigned to al by this:


    ```

    al=wheat.Emmer;

    ```'
