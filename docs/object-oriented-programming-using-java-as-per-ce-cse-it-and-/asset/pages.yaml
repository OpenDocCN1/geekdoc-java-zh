    # 3.1.2 Using Multidimensional Array


    So far, we have read only about one-dimensional arrays where only a single value
    can be allocated, but there can be cases when more values are needed to represent
    the elements of an array. Then, multidimensional arrays come into use.


    A multidimensional array is also known as an array of arrays. The process to declare,
    initialize, and use a multidimensional array will be discussed under the following
    headings:


    # 3.1.2.1 Declaring a Multidimensional Array


    Declaring a multidimensional array is the first step to start working with a multidimensional
    array. The syntax to declare a multidimensional array is


    ```

    data_type var_name [ ] [];

    ```


    In the preceding syntax:


    +   - **data_type** is the type of the array, which specifies the type of elements
    that will be stored in the array.

    - **var_name** is the name of the array.

    - [ ] is the first/left brackets, which represents the row numbers.

    - [ ] is the second/right brackets, which represents the column numbers.


    Another syntax to declare a multidimensional array is


    ```

    data_type [ ] var_name;

    ```


    See the following examples in which arrays of name even_no and odd_no of data
    type are declared:


    ```

    int even_no [ ] [];

    int [ ] odd_no;

    ```


    Both arrays in the preceding examples are multidimensional arrays. Now when a
    multidimensional array is declared, you can move ahead to create a multidimensional
    array.


    # 3.1.2.2 Creating a Multidimensional Array


