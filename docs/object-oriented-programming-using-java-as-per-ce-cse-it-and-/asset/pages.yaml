    The foundation of the collection framework is the Collection interface and because
    the collection classes implement this interface, we''ll take a look at its methods
    here for reference. Here are some collection interfaces:


    +   - Collection: It is the topmost in collection hierarchy. It supports basic
    grouping of elements.


    +   - Deque: It extends Queue to handle a double-ended queue.


    +   - List: It extends Collection to implement lists of objects.


    +   - Set: It extends Collection to implement sets, in which all elements must
    be unique.


    +   - Map: It does not have duplicate keys and each key should map to at least
    one value. This interface generally maps values with keys.


    +   - SortedSet: It extends Set to implement a sorted set.


    +   - SortedMap: It extends Map to implement a sorted map.


    +   - Deque: It extends Collection to handle special type of lists.


    The implementations of the interfaces are provided in Table 1:


    | Table 1: Implementations of the Interfaces |

    | Interface | Hash Table | Resizable Array | Balanced Tree | Linked List |

    | --- | --- | --- | --- | --- |

    | Collection | HashSet | ArrayList | TreeSet | LinkedList |

    | Set | HashSet | | TreeSet | |

    | SortedSet | | ArrayList | TreeSet | |

    | List | | | | LinkedList |

    | Map | HashMap | | TreeMap | |

    | SortedMap | | | | LinkedList |

    | Queue | | | | LinkedList |

    | Deque | | | | LinkedList |


    # 9.1 The List Interface


    The List interface is the foundation of classes such as LinkedList and ArrayList.
    It is basically an extension of the Collection interface that stores the behavior
    of a collection. So, we''ll take a look at the methods of this interface for reference.
    The methods of the List interface are provided in Table 2:


    | Table 2: Methods of the List interface |

    | Method | Description |

    | --- | --- |

    | void add (int index, E element) | It is used for inserting the given element
    at the given position in this list.'
