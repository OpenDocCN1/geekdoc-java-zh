    # 14.1.2.2 Extend Relationship


    An extend relationship is a type of relationship where an extended use case is
    connected to the base use case in order to add the incremental behavior of the
    use case.


    It specifies how and when the defined behaviors in the extended use case can be
    inserted into the behaviors that are defined in the base use case.


    An extend relationship is generally used for representing the optional features
    of the modeling. Extend use case can be used when the systems are deployed in
    different configurations.


    An extent relationship is represented as a dotted arrow, as shown below:


