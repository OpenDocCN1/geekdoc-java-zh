    Talking about earlier versions of Java, legacy classes and interfaces formed the
    collections framework and how they are reconstructed in coming versions. With
    the Java SE 7 release, for legacy file I/O class, the java.io.File class was the
    process used for file I/O; however, if it has the following:


    +   - Many methods did not throw exceptions when they failed, so as it was impossible
    to retrieve a useful error message.

    - The rename method did not work properly across platforms.

    - There was no real support for symbolic links.

    - Needed more support for metadata, such as file permissions, file owner, and
    other security attributes.

    - Executing file metadata was inefficient.


    It was impossible to write a readable class that could iteratively walk a file
    tree and result back accurately if there were circular symbolic links.


    So, you have the legacy code that uses java.io.File and would prefer taking benefit
    of the java.nio.file.Path functionality with minimal impact on your code.


