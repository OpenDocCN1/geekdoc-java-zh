    \ the need for static member of the Circumference class with the name PI and would\
    \ provide a much more accurate definition of π. The Math prefix to the name PI\
    \ does not add clarity to the code, and it would be better without it.\nWe can\
    \ avoid the prefixing of PI to the Math class by importing the PI member from\
    \ the Math class:\n\n```\nimport static java.lang.Math.PI;\nclass circumference\
    \ {\n    double circumference_circle() { return 2*PI*radius; }\n}\n```\n\nAll\
    \ members can also be imported by using the * notation. This import applies only\
    \ to the classes defined in a named package for the static members of a class.\
    \ If you require importing the name of a static member of a class that you define,\
    \ the definition of the class should be included in a named package. Names of\
    \ static members with no names in the default package cannot be imported. The\
    \ class in the static import statement must always be qualified with its package\
    \ name.\n\n# 6.1.5 Classpath\n\nJava veterans will wonder about the environment\
    \ variable CLASPATH when they install Java SDK. The CLASPATH variable tells Java\
    \ how to find compiled bytecode files. These include both the ones you created\
    \ and the ones required by the system that the SDK itself. CLASPATH has the focus\
    \ of a great deal of confusion when working with Java, and we are glad to say\
    \ that Sun has made things easier.\n\nWhen you install the SDK, you do not have\
    \ to worry about setting the CLASPATH now because the SDK will know how to find\
    \ its installed libraries. However, if you want to search other custom bytecode\
    \ files in a file, you will have to set the CLASPATH yourself. There are two ways\
    \ to indicate to the Java compiler where to find bytecode files you particularly\
    \ want to search—by setting the CLASPATH variable and by using the CLASPATH switch."
