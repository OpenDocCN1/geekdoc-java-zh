  md: '# 10.7.1 Understanding the InNetAddress Class


    The platform on which TCP and UDP are built is the IP address. An IP address comprises
    either a 32-bit or 128-bit unsigned number used by IP and host name which either
    may be constructed or have a reverse host name. An IP address specifies a number
    used for identifying a particular host computer on the Internet. Going by that,
    the designers of Java could have simply represented IP addresses as long numbers.
    The various address types are as follows:


    Unicast: As the name indicates, it is an identifier for a single interface. The
    unicast address is of the following:


    +   * The Unspecified Address: It is also known as any local or wildcard; it has
    no address. Basically, it is not assigned to any node.

    * The Loopback Address: It refers to the address allocated to the loopback interface.
    Data received at this IP address circulates around and gets IP input on the local
    host.


    +   * Multicast: Multicast refers to an identifier for a collection of interfaces.
    A packet provided to a multicast address gets delivered to all interfaces determined
    by that address.


