  md: '# 2.1.3.4 Character Literals


    In Java, the source code representation of a single character value is called
    character literal. The character literals in Java are represented by a single
    character or an escape sequence enclosed within single quotes. Consider the following
    code snippet


    ```

    char letter=''A'';

    char value=''y'';

    char newline=''\n'';

    ```


    Here, the character literals A, y, and \n (escape sequence character for a new
    line)


    # 2.1.3.5 String Literals


    Unlike C++, in Java programming language, String is considered as class instead
    of a primitive data type and thereby all string literals are the String class
    objects. The source code representation of a value of a String object is called
    String literal. The String is a collection of characters enclosed within double
    quotes. The following code snippet


    ```

    String msg="welcome to Java Programming";

    System.out.println(msg);

    ```


    In the preceding code snippet, a String literal is assigned as a value to the
    String object msg and then the literal assigned is displayed on the standard output
    console.


    # 2.1.4 Using Constants


    Sometimes the values assigned to variables throughout the execution of a program;
    however, it may be possible that you want to lock the assigned value to a variable.
    In other words, if you want a value to remain fixed throughout the execution of
    a program, then it is known as constant.


    Let''s consider an example, suppose you want to calculate the area of a circle
    in your program. While calculating the area of a circle, the value of pi remains
    irrespective of the change in radius. Therefore, you need to assign a fixed value,
    3.14, as shown in the following code snippet:


    ```

    final double pi = 3.14;

    ```


    In the preceding code snippet, the pi variable is assigned a fixed value 3.14.
    You must note that the final keyword is used to avoid the modifications in the
    value of pi variable. The final keyword in Java is similar to const in C/C++.
    You must remember the following points in the context of the usage of final keyword:


    +   - You should choose all uppercase identifiers for final variables, as it is
    a common convention'
