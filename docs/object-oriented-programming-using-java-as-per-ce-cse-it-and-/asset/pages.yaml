    Yahoo, America Online, MSN,

    and many others.


    +   - Filter requests: Proxy servers can also be used to filter requests, which
    means to

    only request those that are appropriate for the organization. For example, a college

    might use a proxy server to prevent its students from accessing a specific set
    of websites.


    Therefore, we can conclude that a proxy server is a connection between a Local
    Area Network

    (LAN) and an external network such as the Internet. These days, proxy servers
    are facing major

    competition from Network Address Translation (NAT) and firewalls. In order to
    remain in

    demand, the role of proxy servers has been widened to content caching and authentication

    besards guard-dog security and connection sharing.


