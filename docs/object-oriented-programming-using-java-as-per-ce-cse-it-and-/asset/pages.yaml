    # 5.5.4 Inheriting Interfaces


    In other languages, such as C+, one class can inherit from multiple classes at
    once, but this technique doesn''t work directly in Java, that is, you can only
    use the extends keyword with one class at a time. Therefore, you cannot:


    ```

    class A extends B, C //won''t work!

    { . . . }

    ```


    There are two ways to implement what amounts to multiple inheritance in Java.
    The first is to use single inheritance in stages (if that will work for the classes
    you want to inherit from):


    ```

    class C { . . . }

    class B extends C { . . . }

    class A extends B { . . . }

    ```


    The other way is to use interfaces. Interfaces will start becoming important in
    the next chapter, so we will introduce them now.

    An interface specifies the form of its methods, but does not give any implementation
    details; therefore, you can think of it much like the declaration of a class.
    You can create interfaces with the interface keyword as follows:


    ```

    interface C { . . . }

    interface B { . . . }

    ```


    Now, you can use these two interfaces with the implements keyword as:


    ```

    class A implements B, C{ . . . }

    ```


