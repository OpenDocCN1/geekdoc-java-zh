  md: '# 07 Working with Thread


    # OBJECTIVES


    +   - Introducing Threads

    - Defining a Thread

    - Instantiating a Thread

    - Starting a Thread

    - Discussing Thread States and Transitions

    - Explaining Code Synchronization

    - Discussing Thread Interaction


    Thread is the smallest unit of an executable code in a game. It helps you divide
    a process in multiple parts to speed up the process. A process is a program that
    executes as a single thread.


    Programs that run as single threads can cause problems when you perform two or
    more tasks simultaneously. For example, while playing an online game, you sometimes
    come across a situation where the game does not show the updated score but still
    displays the graphics properly. These are two different tasks. Therefore, it is
    important to ensure that the game provides support to handle these multiple tasks
    to make the game fast and interactive to enjoy.


    To overcome such problems, Java provides built-in support for multithreaded programming,
    which enables a single program to perform multiple tasks simultaneously. In multithreaded
    programming, each thread is assigned a task to perform and each of the threads
    executes independently in a program. Multithread within a program share the same
    memory address space, and therefore share the same set of variables and objects
    among themselves.


    This chapter discusses threads, their life cycle, and how they are created, run,
    and terminated. It also explains the concepts of thread synchronization, interthread
    communication, thread priorities, and deadlocks in threads. We begin by providing
    an overview of threads.


    # 7.1 An Overview of Threads


    Threads are used to implement concurrency in Java programs. Concurrency is the
    simultaneous execution of multiple tasks. These tasks can be implemented either
    as separate processes, or as a set of threads within a single program. For example,
    working in a word'
