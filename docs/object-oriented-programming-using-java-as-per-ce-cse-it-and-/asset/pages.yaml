    # 8.4 Working with Files


    You have learned about the streams that provide a simple model for reading and
    writing data, which you will learn how to work with a file using the non-stream
    file I/O.


    The File class handles files that are machine-dependent in an independent manner.
    This means that you can create platform-independent code that easily keeps monitoring
    and manipulating files using the File class. This class is available in the java.io
    package.


    # 8.4.1 Using the File Class


    Except for the File class, most of the classes are defined by java.io operate
    on streams. This implies that they deal directly with the file and the file system.
    The File class does not state how information is accessed or stored in files.
    Instead, it describes the properties of a file itself.


    You can use the File class to determine file details, such as their sizes; whether
    you can write to them; whether an item is a file, directory, or named pipe. From
    this, you can manipulate the information associated with a disk file, such as
    permissions, time, date, and for navigating subdirectory hierarchies. A Java directory
    is considered to be an additional property, in which an array of filenames can
    be verified using the list() method. You will find the constructors of the File
    class in Table 22 and its methods in Table 23:


    | Table 22: Constructors of the File Class |

    | Constructor | Does this |

    | File(File parent, String child) | It constructs a new File instance from a parent
    pathname and a child pathname. |

    | File(String pathname) | It constructs a new File instance by converting the
    given pathname into an abstract pathname. |

    | File(String parent, String child) | It constructs a new File instance from a
    parent string and a child pathname string. |

    | File(URI uri) | It constructs a new File instance by converting the given file:URI
    into an abstract pathname. |'
