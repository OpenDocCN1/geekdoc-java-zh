  md: '# Introduction to Java


    Bytecode is a set of instructions generated by Java compiler while compiling a
    Java program. In other programming languages, a program is compiled into an executable
    code. However in Java, a program gets compiled into an intermediate code bytecode.
    This bytecode then gets executed by Java runtime system the JVM. So, in order
    to run your Java program, you should only install JVM. JVM is also considered
    as the interpreter of bytecode. In this way, Java has solved the problem of portability.


    #  4.4.4 Robust


    Generally, software programs fail for the following two reasons:


    +   - Memory management: Lock of memory management for allocating and deallocating
    memory for objects


    +   - Exceptional conditions: Occurrence of unexpected exceptions


    Considering the first reason, Java is designed to provide the ability to create
    robust programs. Therefore, Java compiles the programmers to resolve the mistakes
    during compilation. Moreover, it frees the programmer from the worries of common
    causes of programming errors as the program code is verified during compilation.


    Java also eradicates the problem of memory management by performing automatic
    garbage collection. It manages the memory allocation and deallocation for unused
    objects.


    #  4.4.5 Multithreaded


    Java is a programming language designed for the distributed environment of the
    Internet and for that the concept of multithreading is implemented. This feature
    helps to write interactive programs wherein multiple tasks can be performed simultaneously;
    thus making it a robust programming language.


    Java is inherently multithreaded as there can be executing threads in a single
    Java program. For example, a Java program can run three Java applets on the same
    page, provided that each applet gets equal time from the CPU.


    The multithreaded feature of Java makes it very responsive and robust. It is very
    important to note that since Java is highly multithreaded, it is difficult to
    port it to architectures, such as Windows 3.1 or PowerMac, which do not natively
    support multithreading.


    #  4.4.6 Platform Independent


    It is one of the most important features of Java as it is the first programming
    language, which is not bound to any operating system. In other words, Java programs
    can be executed anywhere on any system. No other programming language, before
    the evolution of Java, was platform independent and therefore it is a revolutionary
    programming language. Apart from cross-platform source form, Java is also platform
    independent of compiled binary form.


    A Java program does not execute natively on the host machine, instead Java interpreter
    reads the bytecode and executes the corresponding native machine instructions.
    Java interpreter is'
