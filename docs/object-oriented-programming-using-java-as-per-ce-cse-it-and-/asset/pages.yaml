  md: "# Chapter 6\n\nThe current version of the SDK does not require CLASPATH to\
    \ be defined; and if it has been defined by some Java version or system, it is\
    \ likely to create problems. If you want to keep the CLASPATH environment variable\
    \ for any reason, you need to use the command line to define the CLASPATH temporarily.\n\
    \nBy default, Java will be able to find its bootstrap classes (the ones it comes\
    \ with), extension classes (those that use the Java Extension Framework), and\
    \ classes in the current directory (that is, where you are compiling your program).\
    \ Classes can be stored in .class files, .jar files, and .zip files. Java can\
    \ search all these types of files.\n\n+   - Bootstrap classes are the classes\
    \ that can search by default with JDK, and Extension classes are the classes that\
    \ use the Java Extension Framework. However, if you want to have Java search for\
    \ classes in another directory or a .jar file supplied by a third party you can\
    \ do that with the CLASPATH environment variable because Java uses this variable\
    \ to determine where you search for classes.\n\nHere's an example that was first\
    \ introduced in the previous solution. If you have a class named Printer in file\
    \ Printer.java and that class has one method print:\n\n```\npublic class Printer\
    \ {\n    public void print() { System.out.println(\"Hello from Java!\"); }\n}\n\
    ```\n\nIn the previous solution, you want to use the print method in another class—as\
    \ in this case we are creating a new object of the Printer class using the new\
    \ operator and using object's print method in an application App:\n\n```\nimport\
    \ Printer.*;\npublic class App {\n    public static void main(String[] args) {\
    \ (new Printer()).print(); }\n}\n```\n\nThis works if Printer.class is in the\
    \ same directory where you are compiling this application, as the Java compiler\
    \ will search the current directory by default. However, suppose you want to store\
    \ all your classes in a directory named c:\\classes. How will the Java compiler\
    \ find Printer.class in such a case?\n\nTo make the Java compiler search c:\\\
    classes you can set the CLASPATH environment variable to include that. By default,\
    \ there are no paths or directories in CLASPATH, but you can add a semicolon-separated\
    \ list to CLASPATH, like this (note that it is important not to have any spaces\
    \ around the equals sign):\n\n```\nSET CLASPATH=c:\\classes;c:\\newclasses\n```\n\
    \nYou can also determine the current CLASPATH setting by typing the SET CLASPATH\
    \ at the command line and pressing Enter. To permanently set the classpath in\
    \ Windows 7, follow the following steps:"
