    \ a derived class is created using the extends keyword. The following code snippet\
    \ shows how to declare the class A and the derived class B:\n\n```\nclass A {\n\
    \  // members of class A\n}\nclass B extends A{\n  // members of class B\n}\n\
    ```\n\nIn the preceding code snippet, the derived class B is extended by class\
    \ A by using the extends keyword.\n Inheritance is an important feature of OOP,\
