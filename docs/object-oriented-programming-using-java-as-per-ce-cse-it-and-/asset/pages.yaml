    # 14.3.3 A Generic Activity Diagram


    A generic activity diagram shows the flow of activities through a system. It is
    read from top to bottom. In order to describe conditions and parallel activities,
    it uses forks and joins or branches.


    In a generic activity diagram, a fork is used when multiple activities occur at
    the same time. Figure 19 shows a generic activity diagram:'
