    # 9.2 Classes of Collection


    A collection is a series of items of the same type unlike arrays. The main drawback
    of arrays was that you could not know or predict the number of items of the list
    and its solution was to create your own list. The class contains exclusive static
    methods that operate on return collections. It contains polymorphic (more than
    one feature) algorithms that operate on collections, ''wrappers'', which return
    a new collection.


    Here are the standard classes that implement the collection interfaces:


    +   - AbstractCollection: It implements the Collection interface.

    - AbstractList: It extends AbstractCollection and implements the List interface.

    - AbstractQueue: It extends AbstractCollection and implements parts of the Queue
    interface.

    - AbstractSequentialList: It extends AbstractList into a sequential (not random
    access) list.

    - LinkedList: It extends AbstractLinkedList into a linked list, where each element
    knows the next element.

    - ArrayList: It implements a dynamic (resizable) array.

    - ArrayDeque: It implements a dynamic double-ended queue by extending AbstractCollection
    and implementing the Deque interface.

    - AbstractSet: It extends AbstractCollection and implements the Set interface.

    - HashSet: It extends AbstractSet to be used with a hash.

    - TreeSet: It extends AbstractSet to implement a set using hash internally. In
    Java, hash stores information using hashing; this converts a key to a hashcode
    that is used to access the corresponding value. You don''t deal with the hashcode
    yourself—it''s generated internally in Java.


    Note the Hash class, which implements a set using hash internally. In Java, hash
    stores information using hashing; this converts a key to a hashcode that is used
    to access the corresponding value. You don''t deal with the hashcode yourself—it''s
    generated internally in Java.'
