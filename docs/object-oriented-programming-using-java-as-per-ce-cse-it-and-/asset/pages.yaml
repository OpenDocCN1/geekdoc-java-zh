  md: 'processor while listening to an audio file on the same computer are two tasks
    that are implemented as two separate processes. However, we often need a single
    program or process to perform these multiple tasks at the same time, such as a
    word processor that calculates the number of words in a document while printing
    the document. Here, the word processor is a single program that performs two tasks
    simultaneously, calculating the number of words in the document and printing the
    document. These two tasks are implemented as two separate threads within the process.


    Threads are lightweight processes, because creating a new thread requires fewer
    resources than creating a new process. For example, a newly thread shares the
    same address space with the other threads in a program, whereas every individual
    process has its own separate address space. Therefore, creating a new thread involves
    less overhead than creating a new process.


    The simultaneous execution of threads is implemented with the help of time-slice.
    Time-slice is the time that each thread gets for its processing. Each thread executes
    according to the time allotted to it by you appears as if these threads were running
    at the same time.


    The objective of multithreading is to use the idle time of a CPU. For example,
    the CPU remains idle until you enter a character from the keyboard or move the
    mouse.


    Some important uses of threads are as follows:


    +   Threads are used in server-side programs to serve the needs of multiple clients
    on a network or the Internet. On the Internet, the server has to cater to the
    needs of thousands of clients at a time. Threads are used to handle multiple clients
    simultaneously.


    +   Threads are used to create games and animations. For example, you can use
    threads to show a picture in motion. In such a case, you have to set the thread
    in a way that it sleeps for some specific period of time and is activated for
    a specific period of time and continues this cycle. In this, threads can be used
    to create animations.


    +   In many games, a user has to perform more than one task simultaneously. Threads
    can be very useful in such situations.


    # 7.2 Defining a Thread


    Every application program has a control of execution that executes a set of instructions
    of a program. These instructions are executed in a predefined manner or path of
    execution. This path of execution is known as execution thread. Each program has
    at least one execution thread, although, depending on the requirement, more than
    one execution thread can be created in a program through which you can perform
    more than one task simultaneously.'
