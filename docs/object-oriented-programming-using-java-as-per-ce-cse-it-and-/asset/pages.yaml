  md: '# 14.3.2 Concepts in Activity Diagram


    The following are the main concepts related to an activity diagram:


    +   * Branches: In an activity diagram, branching specifies an alternative path
    based on some Boolean expression. A branch is represented as a diamond. In a branch,
    there may be incoming transition and two or more outgoing transitions. A Boolean
    expression should be placed on each outgoing transition, and these expressions
    are evaluated on entering the branch.

    In a branch, each arrow of the alternative path is labeled by some condition.
    A condition is specified within a square bracket. When it is necessary to merge
    two paths together, they are merged in diamond.


    Figure 16 shows an airline reservation system to represent branches:


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_386_0.png)


    ▲ Transition is used to show how the flow of control can be moved from one activity
    to another. Generally, transitions are shown with the help of a simple arrow and
    it is assumed that as one activity ends, the next activity will start. However,
    it is also possible to set a limitation on transitions in order to control when
    a transition occurs. This is generally done either by using an event or a guard
    condition.


    Figure 17 depicts the airline reservation system to show the transition.


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_386_1.png)


    ▲ Figure 17: Airline reservation system representing transition


    In Figure 17, the customer changes his mind and performs a cancel event. Thus,
    the price for purchasing the ticket is refunded and the ticket is cancelled.'
