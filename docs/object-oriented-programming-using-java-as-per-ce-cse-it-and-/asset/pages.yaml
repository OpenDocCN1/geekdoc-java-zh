    # 6.3 Defining Java API Packages


    Similar to other programming languages, Java also provides some built-in functionalities
    you can use in your programs. These built-in functionalities are coded in the
    form of classes and interfaces. These classes and interfaces are grouped in packages
    according to their purpose. Table 2 lists the important packages available in
    the Java API:


    | Table 2: Packages Available in Java API |

    | Package Name | Description |

    | --- | --- |

    | java.lang | Contains essential Java classes, including Number, String, Object,
    Compiler, Runtime, and Thread. This is the only package that is automatically
    imported into every Java program. |

    | java.io | Provides classes to manage input and output streams to read and write
    data, respectively, to files, strings, and other sources. |

    | java.util | Provides Miscellaneous utility classes, including generic data structures,
    bit sets, Time, Date, Calendar string manipulation classes, random number generation
    classes, system properties classes, notification classes, and enumeration of data
    structures classes. |

    | java.net | Contains the classes used to implement network applications. It provides
    classes for network support, including URLs, TCP and UDP sockets, IP addresses,
    and a binary-to-text converter. |'
