  md: '# Chapter 14


    Concurrent Activities: Activities can be of two types:


    +   - Sequential Activities

    - Concurrent Activities


    Sequential activities are those activities that are performed one after another.

    A system can perform more than one activity at a time. The activities performed
    at the same time are called concurrent activities. In an activity diagram, the
    concurrent activities can be split into several activities or several activities
    can be joined or merged to perform some actions. Fork and join are used to represent
    concurrent activities. The fork represents the separation of two control flows,
    and joins represent the joining of two control flows.


    Figure 18 shows the concurrent activities with the forks and joins:


