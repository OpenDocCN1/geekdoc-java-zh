    # 7.5.7 Blocking for I/O


    Threads in a program can also be used to perform I/O operations. When multiple
    threads share resources, it is not guaranteed that a thread eligible for execution
    gets the needed resources. This is because other threads may be using the shared
    resources at the time and the thread eligible for execution and trying to access
    the shared resources is blocked temporarily. The blocked thread attains the runnable
    state after the shared resources are free.


    The threads that are instantiated and used in a program have a definite life cycle
    and finally get terminated at the end of their life cycle.'
