  md: '# Summary


    The chapter discussed the concepts of interaction modeling and use case models,
    and explained the relationships used in use case model. Sequence models and activity
    models were also discussed in the chapter. It also explained of generic activity
    diagrams, executable activity diagrams, and collaboration diagrams. To the end,
    the similarities and differences between sequence and collaboration diagrams were
    explained.


    # Key Terms


    +   - Associations: Refers to an element of a use case diagram. It is used to
    describe the communication that takes place between an actor and a use case.


    +   - Generalization relationship: It refers to a parent-child relationship between
    two or more use cases.


    +   - Focus of the Control: Refers to an element of a sequence diagram. It is
    used to show the period of time during which an actor is performing an action.


    +   - Transitions: Refers to the component of an activity diagram used to show
    how the flow of control can be moved from one activity to another.


    +   - Swimlanes: Refers to the component of an activity diagram used for modeling
    the distribution of activities among different roles.


