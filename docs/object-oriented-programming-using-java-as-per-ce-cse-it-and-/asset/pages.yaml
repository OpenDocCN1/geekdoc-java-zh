    # 6.4.2 Exception Handling


    In Java, we have various techniques, such as try and catch to handle exceptions.
    These techniques use various clauses, such as try-catch blocks, finally clause,
    throws clause, and throws clause. We use these techniques to create programs in
    which the exceptions are handled properly. This, in turn, in creating well-designed
    applications. Exception handling is discussed under the following subheading:


    +   - Using the try and catch block


    +   - Using Nested try and catch Block


    +   - Using the finally Clause


    +   - Using throws Clause


    +   - Using throw Clause


    Let''s discuss these one by one in detail.


    # 6.4.2.1 Using the try and catch Block


    The try in a Java program is used to enclose a statement that may lead to an exception.
    A try block must be followed by a catch block. The catch block acts as an exception
    handler and contains the object of the specified exception class, which handles
    the raised exception. The code written in the catch block is executed when the
    exception handler is invoked by the Java runtime system. Figure 9 shows the flow
    structure of handling exceptions using the try-catch construct:'
