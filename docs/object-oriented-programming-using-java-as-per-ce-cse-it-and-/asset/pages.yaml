  md: '# 11.1 Object Orientation


    Object Orientation (OO) is an approach that is based on the Object-oriented approach.
    This approach is quite different from the structured approach. Object-oriented
    approach focuses on objects that represent abstract or concrete things of the
    real world. Objects are instances of classes. Objects have data and provide services.
    An object can be a combination of variables, functions, and data structure. Objects
    can be categorized, described, organized, combined, manipulated, or created.


    A class is a template, and the object is an instance of a class. A class represents
    a set of objects having similar properties and behavior. A class is made up of
    member variables and functions to operate on those variables. If we want to use
    a person in our program, we should be able to describe the person''s properties
    and activities. A class called ''Person'' may provide a template for what a person
    looks like and what a person can do.


    The advantages of OO are listed as follows:


    +   - Easy application development and maintenance

    - Supports data hiding so that the object data cannot be accessed outside

    - Effective simulation of real-world problems


    OO means that the software system is organized as a collection of discrete objects,
    which can contain both member data and methods (behavior).


    OO has four main characteristics. These are given as follows:


    +   - Identity

    - Classification

    - Polymorphism

    - Inheritance


    # 11.1.1 Identity


    The following are the identity characteristics of OO:


    +   - Software system creates many objects of the same or different classes. Each
    object has a unique identity which is used to differentiate objects.

    - Within a program, objects are identified by their names.

    - Internally, each object is given automatically generated unique ID (OID). This
    ID is not visible to external users.

    - Each object has its own data values of attributes.


    # 11.1.2 Classification


    The following are the classification characteristics of OO:


    +   - Objects with similar structure and behavior are classified in the form of
    a class.

    - Class provides a blueprint or template for the object.

    - Objects are also known as instances of a class.'
  merge: -1
