    # 10.9 Understanding the URL Class


    No browser can identify any information from the Web without using URL. URLs are
    nothing but Uniform Resource Locators that identify a resource anywhere on the
    Internet.


    Tim Bern-Lee defined a flexible way to locate all the resources of the network.
    WWW is a light collection of high-level protocols and file formats; URL transforms
    this loose collection into heavy collection when the information is accurately
    defined.


    The URL is based on four components—protocol(separated from the rest by a colon);
    host name or IP address of the host to use; port and actual file path (of the
    HTTP servers) will append a file named index.html. Some protocols are used http,
    ftp, gopher and nowadays, everything is done by HTTP.


    For example, http://docs.oracle.com/java/8/docs/api/java/net/URL.html specifies
    that the protocol used is Http (HyperText Transfer Protocol) and that the information
    is available on a host name docs.oracle.com. The name of the information on host
    machine is /java/8/docs/api/java/net/URL.html and its accurate meaning is dependent
    on both the protocol and the host.


    A URL can optionally indicate a "port," which is the port number to the TCP connection
    made to the remote host. If the port is not specified, the default port is used.
    For example, the default port for HTTP is 80.'
