  md: '# 8 Chapter 1


    # 1.4 Features of Java


    Java is a simple, robust, platform independent, portable programming language.
    It is designed to meet the practical requirements of our daily life with the following
    features:


    +   - Simple

    - Secure

    - Portable

    - Robust

    - Multithreaded

    - Platform Independent

    - Distributed

    - Dynamic


    These features are explained in the following subsections:


    # 1.4.1 Simple


    Java is simple to learn and use. In Java, it is easy to write and debug programs
    because Java does not use pointers. Moreover Java provides bug-free system to
    strong memory management and has automatic memory allocation and deallocation
    system. Unlike other programming languages, which provide dozens of complicated
    ways to perform a simple task, Java provides a simple and clear approach to achieve
    a given task. If a programmer understands the basic concepts of OOP, it becomes
    easier for him/her to learn Java.


    # 1.4.2 Secure


    In today''s world, everybody needs safety and security. Due to the threat of hackers
    people feel unsafe when performing monetary transactions over Internet. In order
    to overcome such fears, Java provides the safety and security features.


    While using a Java compatible browser, Java applets can be safely downloaded without
    the risk of virtual infection or malicious intent. Since the Java programs are
    confined to the Java runtime environment, they can access only part of your computer
    which is required for program execution. The data outside Java runtime environment
    cannot be accessed by Java programs, and therefore downloading a Java application
    through Internet will not harm your computer. That''s why Java is a secure language.


    # 1.4.3 Portable


    In the distributed world of Internet, an application developed with the help of
    a programming language might be accessed on various computers having different
    kinds of operating systems. But, it is not guaranteed that the application is
    portable, i.e. the application can run successfully on all operating systems.
    To overcome this portability issue, Java introduces a concept of what is known
    as bytecode.'
