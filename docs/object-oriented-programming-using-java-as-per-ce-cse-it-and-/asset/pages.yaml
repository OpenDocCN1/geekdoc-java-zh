    # 2.5 Control Statements


    In a Java program, to achieve certain results, some specific operations need to
    be performed repeatedly. The execution of these operations is based upon the fulfillment
    of certain conditions. These conditions are placed in various control flow statements,
    such as conditional statements, iteration statements, and jump statements. The
    operation to be performed is provided in the block of control flow statements.
    A conditional statement is a control statement that allows choosing between two
    or more execution paths in a program. Iteration statements repeatedly execute
    the code block on the basis of the conditional statement. Once the conditional
    statement evaluates to false, the loop exits. After that, the control transfers
    to the next statement that follows the loop. Jump statements explicitly redirect
    the flow of program execution.


    # 2.5.1 Using Selection Statements


    Selection statements, as the name suggests, cause a program to execute a block
    of code on evaluating a conditional expression and selecting code for execution.
    If the conditional expression comes to be true, the accompanying block of code
    is executed and if it is false, the accompanying block of code is bypassed. Following
    are the selection statements available in Java:


    +   - if statement

    - if-else statement

    - switch statement


    Let''s discuss these selection statements in detail.'
