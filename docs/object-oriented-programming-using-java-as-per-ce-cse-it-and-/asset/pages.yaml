    specific and a way to set these options on all of the standard socket types


    +   - Changes in the class HttpClient


    Q3. Define proxy server. What are its goals?


    A proxy server can be viewed as a bridge between the client application, such
    as a Web browser, and a real server. It gets and gathers all requests from the
    real server if it can satisfy the requests itself. The two main goals are served
    by proxy servers:


    +   - Improve performance: To improve the performance of all users, a proxy server
    is used. A proxy server saves the response for all requests for some time.


    +   - Filter requests: Proxy servers can also be used to filter requests, which
    means to allow only those requests that are appropriate for the organization.


    Q4. Explain the concept of DNS.


    The Internet would not be user friendly if users had to refer their intended addresses
    as numbers. So, a parallel hierarchy of names to go with all these numbers exists.
    Such a hierarchy is called Domain Name Service (DNS).


    Let''s understand this way. Host names are created using a naming standard DNS.
    If DNs did not exist, we would be ordering books from 176.32.98.166 instead of
    www.amazon.com; we might sell our CDs at 23.207.146.7 instead of ebay.com; and
    we''d search the Web at 173.194.36.84 instead of www.google.com.


    The DNS server on the Internet resolves hostnames for its corresponding IP addresses.
    DNS is related to URL, which stands for universal resource locator. URL is a naming
    scheme that can uniquely identify any resource (file) on the internet.'
