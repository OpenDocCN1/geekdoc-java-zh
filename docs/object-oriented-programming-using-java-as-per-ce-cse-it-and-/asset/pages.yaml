    #  11.1.3 Polymorphism


    The following are the polymorphism characteristics of OO:


    +   - Polymorphism is an object-oriented programming concept in which a function
    can take on multiple forms.


    +   - Function name remains the same but behavior changes on the basis of arguments
    given.

    - Two classes, say, Circle and Square, have a method findArea(). Name and purpose
    of these methods are similar. However, internal implementation changes, i.e.,
    the process of calculating area is different for each class. When an object of
    class Circle invokes its findArea() method, the operation finds the area of the
    circle without any conflict with the findArea() method of the Square class.


    #  11.1.4 Inheritance


    The following are the inheritance characteristics of OO:


    +   - Inheritance is the concept of sharing properties and methods among objects.

    - Inheritance is the hierarchical relationship between classes and objects.

    - Inheritance relates various classes with parent (base)-child (derived) relationship.

    - Derived class reuses properties and actions of the base class and adds its own
    functionality.


