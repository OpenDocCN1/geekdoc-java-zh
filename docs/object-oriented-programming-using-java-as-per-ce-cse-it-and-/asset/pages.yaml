    # 8.2.4 Charsets and Selectors


    Apart from buffers and channels, NIO has two more entities. These are charsets
    and selectors. A charset allows mapping of bytes to characters. An encoder decodes
    a sequence of characters into bytes, while a decoder decodes a sequence of bytes
    into characters.


    The classes defined in the java.nio.charset package support charsets, encoders,
    and decoders.


    Selectors allow you to execute I/O operations through multiple channels. The classes
    defined in the java.nio.channels package support selectors. There are three types
    of keys maintained by a selector—key-set, selected-key-set, and cancelled-key
    set.


    Each time a channel is registered with a selector, a selection key is created.
    It encapsulates two operation sets—Interest and Ready Set.'
