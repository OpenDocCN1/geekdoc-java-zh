  md: '# Understanding the Java Object Class


    Every class in Java is derived automatically from the java.lang.Object class,
    and there are certain advantages to know this, including knowing that all objects
    have already inherited quite a few methods, ready for you to use. The methods
    of the class Object are listed in Table 1:


    Table 1: The Java Object Class Methods


    | Method | Does this |

    | --- | --- |

    | protected Object clone() | It yields a copy of this object |

    | boolean equals(Object obj) | It indicates whether another object is equal to
    this one |

    | protected void finalize() | It is called by the garbage collector on an object
    when the garbage is about to dispose of the object |

    | Class<?> getClass() | It yields the runtime class of object |

    | int hashCode() | It yields a hash code value for the object |

    | void notify() | It wakes up a single thread that''s waiting on this object''s
    monitor |

    | void notifyAll() | It wakes up all threads that are waiting on this object''s
    monitor |

    | String toString() | It yields a string representation of the object |

    | void wait() | It makes the current thread wait until another invokes the notify
    method or the notifyAll method |


