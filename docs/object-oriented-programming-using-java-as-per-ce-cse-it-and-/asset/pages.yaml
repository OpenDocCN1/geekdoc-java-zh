    # 6.1.4 Static Import


    To access static members, it is required to qualify references with the class
    they belong to. For example,


    ```

    double calc = Math.cos(Math.PI * theta);

    ```


    To understand this better, you sometimes add static members to an interface and
    inherit the same from that interface. This is not advised though, because a class
    of the static members of another class you are using is just a plain implementation
    detail. Whenever a class implements an interface, it becomes the part of the class''s
    public API, and implementation detail should not interfere with other public APIs.


    The static import allows unqualified access to static members. You do not need
    to inherit from the type containing static members. Alternatively, the program
    may import the members individually:


    ```

    import static java.lang.Math.PI;

    or collectively:

    import static java.lang.Math.*;

    The static members may be used without criterion, once imported:

    double calc = cos(PI * theta);

    ```


    The static import declaration mentioned previously and the normal import declaration
    is comparable.


    You can use the static import instead of declaring local copies of constants,
    or utilizing inheritance (the Constant Interface Antipattern). This means that
    the static import is used when we require frequent access to static members from
    a couple of classes. However, excess'
