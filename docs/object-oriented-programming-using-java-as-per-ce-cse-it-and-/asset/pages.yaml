  md: '# 3.1.1.1 Declaring a One-dimensional Array


    The first step to working with an array is to declare an array. In Java, an array
    is declared in the same way as data variable is declared. The syntax to declare
    a one-dimensional array is:


    ```

    data_type var_name [ ];

    ```


    In the preceding syntax:


    +   - data_type is the type of the array, which specifies the type of elements
    that will be stored in the array.

    - var_name is the name of the array.


    Another syntax to declare a one-dimensional array is:


    ```

    data_type [ ] var_name;

    ```


    See the following examples in which arrays of name roll_no and tele_no of data
    type int are declared:


    ```

    int roll_no [ ];

    int [] tele_no;

    ```


    Both arrays given in the preceding examples are declared correctly according to
    the Java syntaxes. Declaring an array does not mean creating an array. To create
    an array, memory must be allocated to it. Until memory is allocated to an array,
    the null value is assigned to the declared array.


    # 3.1.1.2 Creating a One-dimensional Array


    Once you have declared a one-dimensional array, the next step is to actually create
    that array by allocating memory to it. The new operator is used to allocate memory
    to an array. The syntax to create an array is as follows:


    ```

    var_name = new data_type [size];

    ```


    In the preceding syntax:


    +   - var_name is the name of the array.

    - new is the operator, which is used to allocate memory to var_name.

    - data_type is the type of the elements that will be stored in the array.

    - size is the total number of elements that will be stored in the array.


    Total memory that will be allocated to an array depends on the data_type of the
    array and the size of the array. The following example creates an array of size
    5:


    ```

    roll_no = new int [5];

    ```


    According to the preceding example, the total number of elements that the array
    roll_no can store is 5. The total amount of the memory allocated to roll_no is
    20 bytes. The array'
