    # 2.1.6.4 The Increment and Decrement Operators


    The increment and decrement operators can be used in two ways: before or after
    operand. Depending on the placement of these operators, they can be classified
    as prefix or postfix. The difference between prefix and postfix notations is that
    in the prefix notation, the value of the operand is incremented or decremented
    before assigning it to another variable, while in the postfix notation, the value
    of the operand is incremented or decremented after assigning it to another variable.


    Consider the following code snippet:


    ```

    int x=10;

    int y=20;

    ++;//Prefix notation of increment operator

    --y; //Prefix notation of decrement operator

    x++;//Postfix notation of increment operator

    y--;//Postfix notation of decrement operator

    ```


    In the preceding code snippet, ++x is the prefix notation of the increment operator
    and --y is the prefix notation of decrement operator. x++ is the postfix notation
    of increment operator and y-- is the postfix notation of decrement operator. Listing
    4 shows how to use the prefix and postfix notations of the increment (++) operator.'
