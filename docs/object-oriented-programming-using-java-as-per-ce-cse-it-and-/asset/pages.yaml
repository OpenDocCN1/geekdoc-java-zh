  md: '# Working with Packages and Exceptions 147


    +   1. Click the Windows icon on the taskbar, right-click the Computer, and select
    the Properties option. You can also reach the same location by opening the Control
    Panel -> System and Security -> System.

    2. Click the Advanced settings option in the System Properties window. This opens
    up the System Properties dialog box.

    3. Click the Environment Variables button to open the Environment Variables dialog
    box.

    4. Edit the CLSPATH setting the way you want.

    5. You may append the new classpath to the already existing CLSPATH variable or
    create a new CLSPATH variable.

    6. Finally, click OK.


    Note that if you are appending the CLSPATH variable, the different paths must
    be separated by semicolons ().

    Now, the Java compiler (and other Java tools, such as the java tool) will know
    enough to search c:\classes and c:\newclasses automatically. This means that the
    following code will work if Printer.class because that directory is in c:\classes
    CLSPATH:


    ```

    import printer.*;

    public class App {

    public static void main(String[] args) { new Printer().print(); }

    }

    ```


    You can append the current settings in CLSPATH to a new setting, like this:


    ```

    SET CLSPATH=c:\classes;c:\newclasses;%SPATH%

    ```


    Note that you can use .jar and .zip files for classes, as shown:


    ```

    SET CLSPATH=server.jar;classes.zip;%SPATH%

    ```


    Originally, CLSPATH was a big obstruction for beginners in Java programming because
    no classes were bootstrap classes, which meant you had to set up and understand
    CLSPATH before you could use Java. At all that has been fixed with the concept
    of bootstrap classes, which are the classes that come with Java (and are searched
    automatically). However, if you want to use non-standard packages or store your
    own classes in other directories, it is important to know how to set CLSPATH.


