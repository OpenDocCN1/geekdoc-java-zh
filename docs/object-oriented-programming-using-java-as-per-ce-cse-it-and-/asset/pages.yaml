    # Descriptive Questions


    +   Q1. What is an array and why do we need it?


    Ans. An array is a collection of data storage locations, each of which holds the
    same type of data. There can be a situation when you need to store similar types
    of values for a large number of data items. For example, to store phone numbers
    of 50 people, you normally have to declare 50 variables each storing a number
    in it, which is a tedious and complex approach.


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_100_0.png)


    With arrays, we can declare a single variable that is capable of storing all the
    50 numbers. The advantage of using arrays is that they simplify programming by
    replacing a number of statements with just one or two statements.


    +   Q2. Discuss the concept of Wrapper classes in Java.


    Ans. In Java, there are eight primitive data types: byte, short, int, long, float,
    double, boolean, and char. These primitive types cannot be treated as objects
    unless you convert them into objects using their respective Wrapper classes. Converting
    primitive types into their respective objects, Wrapper classes serve:


    +   - After conversion into objects, the primitive data types can be used in vectors.

    - The Wrapper classes provide a variety of utility methods to convert any of the
    objects into primitive types (such as byte, int, float, boolean, and char), or
    vice versa.


