  md: '# Object Oriented Programming using Java


    This book introduces the Java programming language and explains how to create
    Java applications and work with UML. It also discusses various Java programming
    concepts, such as Object Oriented Programming (OOP), as data structure, inheritance,
    multithreaded programming, and networking. Moreover, this book also covers the
    fundamentals of UML.


    # In this book, you will learn:


    +   - Java Fundamentals: Explains OOP concepts; need and features of Java; comparison
    of Java with C and C++; Java tokens, such as keywords, identifiers, literals,
    operators and separators


    +   - Working with Java Members and Flow Control Statements: Explains use of primitive
    data types; declaration of variables, methods, objects, and classes in Java; concept
    of overloading and overriding of methods; flow control statements


    +   - Working with Arrays, Strings, and Wrapper Classes: Explains one-dimensional
    and multi-dimensional arrays; methods of the String class; comparison of equals()
    method and == operator; wrapper classes in Java


    +   - Exception Handling and I/O Operations: Explains exception hierarchy in Java;
    the try and catch block; the finally, throws and how to read and write data using
    the I/O programming


    +   - Implementing Inheritance in Java: Explains the forms of inheritance and
    the Java keywords, such as super, final, and abstract; use of access specifiers;
    implementation of interfaces; invocation of constructors in inheritance; inheritance
    hierarchy in Java


    +   - Multithreading and Packages in Java: Explains how to define, instantiate,
    and start a thread; thread states and transitions; concept of code synchronization;
    packages and Java APIs, such as java.lang and java.util


    +   - Unified Modeling Language (UML): Discusses the concept and characteristics
    of object orientation; explains object development and object orientation themes;
    explains the concept of modeling and the types of models, and discusses the relationship
    among various models


    # About the Authors


    **Chirag. Patel** is a post-graduate in Computer Engineering, with 12+ years of
    teaching experience. His research areas include visualization, cloud computing,
    distributed computing and networking. He is currently pursuing PhD in the area
    of Cloud Computing. He is currently serving as an Associate Professor at Computer
    Engineering Department, Government Engineering College, Modasa. Previously he
    was at L.D. College of Engineering, Ahmedabad. He has delivered several expert
    lectures in areas like cloud computing, .NET programming, Web technology etc.
    He has presented 3 International and 2 National research papers in the area of
    Cloud Computing.


    DT Services has seized the market of engineering textbooks, bringing excellent
    content in technical and education to the fore. The team is committed to providing
    excellence in quality of content by diligently analyzing the needs of readers
    and ensuring dedication of its authors and editors in catering the same.


