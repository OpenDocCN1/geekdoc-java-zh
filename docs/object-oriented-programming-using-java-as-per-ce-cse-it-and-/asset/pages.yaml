  md: '# 366 Chapter 14


    **Guard Conditions:** In an activity diagram, to make the decision for choosing
    the next step, it becomes necessary to specify the conditions to be fulfilled.
    These conditions are called guard conditions. These conditions label the arrows,
    and they should be written inside square brackets. These conditions must evaluate
    to either true or false. Guard conditions are represented as follows:


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_385_0.png)


    **Loop:** It is represented as an arrow that comes out from an activity and ends
    at activity or group of activities. A loop is represented as follows:


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_385_1.png)


    **Solid Lines:** Solid lines are used to identify synchronization for the end
    of tasks and start of a task. It is represented as follows:


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_385_2.png)


    **Swimlanes:** Swimlanes are vertical bars to show the activities performed by
    different individuals. They are used for modeling the distribution of activities
    among different roles, for example, who performed activity, where, and when. Swimlanes
    are represented as follows:


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_385_3.png)


    **Fork:** Fork is used to split a single activity flow into two concurrent activities.
    A fork has one input and two or more outputs. In activity diagram, a fork notation
    is a control node that splits a flow into multiple concurrent flows, as shown
    below:


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_385_4.png)


    **Join:** Join is used to combine two concurrent activities and reintroduce those
    activities into a flow where one activity occurs at a time. A join can have two
    or more incoming transitions and one outgoing transition. In activity diagram,
    a join node is a control node that synchronizes multiple flows, as shown below:


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_385_5.png)'
