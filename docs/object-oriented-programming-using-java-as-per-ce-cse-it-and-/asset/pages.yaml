    This will help the reader in determining the flow of control in the structural
    organization of objects.


    # 14.5 Difference and Similarities between Sequence and Collaboration Diagrams


    # Similarities


    The following are the similarities between sequence and collaboration diagrams:


    +   1. Both sequence and collaboration diagrams are semantically equivalent.


    +   2. Both diagrams are used to model the dynamic aspects of a system.


    +   3. Both diagrams allow to capture semantics of the use cases flow of events.


    +   4. Both diagrams help to identify objects classes, interactions, and responsibilities.


    +   5. Both diagrams help to validate the architecture.


    # Differences


    The following are the differences between sequence and collaboration diagrams:


    +   1. Sequence diagrams show time-based object interaction while collaboration
    diagrams show how objects are associated with each other.


    +   2. Sequence diagrams show flow of control whereas collaboration diagrams show
    data flow.


    +   3. Sequence diagrams are useful when it is required to review the flow of
    logic through a scenario, but a collaboration diagram is useful to assess the
    impact of a change of an object.


    +   4. Sequence diagrams are better for real-time specifications and complex scenarios,
    whereas collaboration diagrams are better for understanding all the effects of
    a given object and for procedural designs.


    +   5. A sequence diagram does not include object relationships, i.e., it only
    shows the explicit sequence of messages, but a collaboration diagram shows the
    relationships among the objects in addition to interactions.'
