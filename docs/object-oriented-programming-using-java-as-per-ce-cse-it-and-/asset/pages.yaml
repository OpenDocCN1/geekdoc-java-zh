  md: '# Q4. What do you mean by the OutputStream class? Describe any four methods
    of this class.


    Ans. The OutputStream class refers to an abstract class defining byte output.
    All methods of this class return void and throw an IOException in case of errors.
    The four methods of the InputStream are given as follows:


    +   - void close(): It flushes this output stream.


    +   - void flush(): It flushes this output stream and writes any buffered bytes.


    +   - void write(byte []): It writes b.length bytes from the given byte array
    to this stream.


    +   - abstract write(int b): It writes the given byte to this output stream.


    # Q5. What do you mean by the Writer class? Describe all constructors of this
    class.


    Ans. The Writer class is the character-based counterpart of the Reader class.
    The Writer implements the Closeable, Flushable, and Append interfaces. A void
    value is returned and an IOException is thrown by all the methods in this class
    in the event of errors.


    There are two constructors of the Writer class, which are as follows:


    +   - protected Writer(): It creates a new character-stream writer.


    +   - protected Writer(Object lock): It creates a new character-stream writer
    whose critical sections will synchronize on the given lock.


