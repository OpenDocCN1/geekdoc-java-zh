  md: '# # 14 Interaction Modeling


    # OBJECTIVES


    +   - Discussing use case models

    - Describing sequence models

    - Explaining activity models

    - Describing the generic and executable activity diagram

    - Explaining the collaboration diagram

    - Discussing the similarities and differences between the sequence and collaboration
    diagrams


    Interaction modeling describes how the elements in an object model interact with
    each other. The term interaction is a set of exchanged messages between the objects.
    A class diagram makes it possible to identify the classes that take part in the
    interaction, and it is also possible to get a general idea of the purpose of the
    interaction by classifying the class relationships. But it is not possible to
    determine how the classes interact and what actually happens at run. In order
    to address this issue, interaction diagrams are used, i.e., to determine the behavior
    of an object at run time. Interaction diagrams are also used for modeling dynamic
    objects.


    The interaction model uses use case diagrams, sequence diagram, activity diagrams,
    and collaboration diagrams. The use case diagram shows the overall functionality
    of a system. A sequence diagram describes a pattern of interactions among the
    objects. An activity diagram is used to describe the dynamic aspect of the system.
    A collaboration diagram emphasizes the structural organization of the object.


    This chapter begins the discussion with use case models. It also explains the
    relationships in the use case model, sequence models, activity models, and the
    components of an activity diagram. Moreover, this chapter discusses the collaboration
    diagram and towards the end, it explains the similarities and differences between
    the sequence and collaboration diagrams.


    # ## 14.1 Use Case Models


    A use case model is a technique to describe the interactions between the users
    of a system and the system itself. It explains the functional requirement of a
    system. It generally defines the interaction between an actor and a system of
    the model.'
  merge: -1
