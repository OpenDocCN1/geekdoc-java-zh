  md: '# 8.2.2 Buffers


    Buffers are the integral part of the java.nio package. All buffers are the subclasses
    of Buffer class. The Buffer class defines the core functionality—current position,
    limit, and capacity. The current position is the index in the buffer where the
    next read or write operation takes place. The current position is advanced by
    most read and write operations. The limit in the index refers to the end of the
    buffer. The capacity is the number of elements the buffer can hold.


    The Buffer class also supports the mark() and reset() methods. It defines several
    methods, which are shown in Table 1:


    | Table 1: Some Notable Methods of the Buffer Class |

    | Method | Description |

    | --- | --- |

    | abstract Object array() | It returns an array backing this buffer. |

    | abstract int arrayOffset() | It returns the offset of the first element of the
    buffer in backing array. |

    | int capacity() | It returns the number of elements that the invoking buffer
    is capable of holding. |

    | Buffer clear() | It clears the invoking buffer and returns a reference to the
    buffer. |

    | Buffer flip() | It sets the invoking buffer''s limit to the current positions
    and resets the current positions to 0. It returns a reference to the buffer. |

    | abstract boolean hasArray() | It returns true if the buffer is backed by some
    accessible array. |

    | boolean hasRemaining() | It returns true if there are elements remaining in
    the invoking buffer; otherwise, it returns false. |

    | abstract boolean isDirect() | It returns true if the buffer is direct. |

    | abstract boolean isReadOnly() | It returns true if the invoking buffer is read-only;
    otherwise, it returns false. |


    Table 2 shows the specific buffer subclasses derived from the Buffer class:


    | Table 2: The Specific Buffer Subclasses Derived from the Buffer Class |

    | --- |

    | --- | --- |

    | ByteBuffer | CharBuffer |

    | DoubleBuffer | FloatBuffer |

    | IntBuffer | LongBuffer |

    | MappedByteBuffer (a subclass of ByteBuffer; used to map a file to a buffer)
    | ShortBuffer |'
