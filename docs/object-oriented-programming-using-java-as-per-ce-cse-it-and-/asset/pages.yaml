  md: '# 7.5.8 Thread Termination


    A thread is moved to the dead state from either the runnable or running state.
    Moreover, a thread is said to be in the dead state after it completes its run(),
    which also implies that the thread is terminated. If any other thread or event
    does not interrupt a thread, then it terminates normally. However, if a running
    thread is interrupted, it throws the InterruptedException and is terminated. After
    a thread is moved into the dead state, it cannot be made alive even after the
    invocation of the start() method.


    With an attempt to invoke the start() method on a dead thread, the start() method
    throws the IllegalThreadStateException. In Java, the invocation of methods that
    are not allowed in a particular thread state throw the IllegalThreadStateException.


    With this, to come under another important concept related to threads, there are
    deadlocks.


    # 7.5.9 Deadlocks


    When multiple threads are used in a program, they share the resources. A particular
    resource is allocated to a thread that acquires the Object lock for that resource.
    Object locks are variables that are acquired by any thread from the runnable pool.
    A deadlock is when two threads wait for the Object locks acquired by each other.
    The Object locks are not released by the respective threads before completing
    their execution. This situation, where threads are waiting for the Object lock
    forever, leads to a deadlock. Figure 9 shows a deadlock:


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_211_0.png)


    ▲ Figure 9: Threads Showing Deadlock


    Figure 9 shows that thread1 and thread2 are in a deadlock. The thread1 thread
    holds the lock for the R1 resource and waits for the R2 resource, which is acquired
    by the thread2 thread. At the same time, the thread2 waits for the lock of the
    R2 resource, which is held by the thread1 thread. Therefore, the both keep waiting,
    leading to a deadlock.


    # 7.6 Code Synchronization


    When multiple threads are used in a Java program, it is possible that more than
    one thread accesses the same instance of a class. When multiple threads try to
    modify the state of an object simultaneously without intimating the other threads,
    it leads to an inconsistency in the state of the object.'
