  md: '# 3.5 Using the Wrapper Classes


    Wrapper classes are the Java classes that convert the primitive data types into
    their respective objects. In Java, there are eight primitive data types: byte,
    short, int, long, float, double, boolean. These primitive data types cannot be
    treated as objects unless you convert them into objects by their respective Wrapper
    classes. By converting primitive data types into their respective objects, Wrapper
    classes serve the following two purposes:


    +   - First after conversion into objects, the primitive data types can be used
    in vectors.

    - Second, the Wrapper classes provide a variety of utility methods to convert
    any of the objects into primitive types (such as byte, int, float, boolean, and
    char) or vice versa.


    All classes belong to the java.lang package. The java.lang package is an indispensable
    part of Java programming. At compile time, the java.lang package contains the
    Object class that is the parent of all classes. Boolean, Character, and Number
    are child classes of the Object class, which are also Wrapper classes. The Number
    class is the parent to Wrapper classes (Byte, Short, Integer, Long, Float, Double)
    to handle primitive values as objects.


    When we create an object of a wrapper class, it contains a field. In this field,
    we can store a primitive data value. For example, if we create an Integer wrapper
    class, it contains a field int data and it is possible to store an integer such
    as 34 or 89. Therefore, Integer is a wrapper class of int data the primitive data
