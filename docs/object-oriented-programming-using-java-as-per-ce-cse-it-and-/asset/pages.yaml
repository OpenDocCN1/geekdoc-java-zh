  md: '# Interaction Modeling


    An activity diagram is similar to a flow chart. It uses all types of flow control
    like lines, arrows, rounded rectangles, diamonds, etc. The advantage of an activity
    diagram over a flow chart is that the activity diagram can represent parallel
    activity and synchronization aspects involved in different activities.


    Activity diagrams are generally used in business process modeling. It is very
    useful to represent the complex processing activities where the roles of many
    activities are involved. Activity diagrams can also be used to represent the three
    structural components (sequence, selections, and iteration) of all procedural
    programming languages.


    # 4.3.1 Component of Activity Diagram


    The main components of activity diagram are as follows:


    +   - Solid Circle: A solid circle is used to represent the entry point of an
    activity. In an activity diagram, there must be one initial activity state, and
    in most cases, the flow starts at the beginning of an activity. This is also known
    as the initial node. A solid circle is shown below:


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_384_0.png)


    +   - Bull''s Eye Symbol: It is used to represent a completed activity. It corresponds
    to the final activity state. It is also called the activity final node. It is
    depicted as a black circle within a larger white circle with a black border, as
    shown below:


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_384_1.png)


    +   - Rounded Rectangle: A rounded rectangle is used to identify the tasks to
    be performed. It is one of the main components of an activity diagram as it indicates
    the activity that make up a model process. The text written inside the rounded
    rectangle can either be an activity name or an operation signature. A rounded
    rectangle is shown below:


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_384_2.png)


    +   - Arrows: It is used to show the directional flow or control flow of an activity.
    The arrows between two or more rounded rectangles represent the transitions between
    the activities. The arrow indicates that as soon as the first activity is complete,
    the next activity will start. Thus, it identifies the transition from one task
    to the next. An arrow is shown below:


    +   - Diamond: Diamond represents a conditional branch point or decision node.
    There can be more than one transition from one activity. In such a case, the choice
    of the next step depends on some decision to be made. In an activity diagram,
    these decisions are represented either with the help of a diamond symbol or with
    several alternative arrows coming out of an activity. A diamond is represented
    as follows:


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_384_3.png)'
  merge: -1
