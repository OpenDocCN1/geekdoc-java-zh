    The operators that are used to perform arithmetic operations are called arithmetic
    operators, such as addition (+), subtraction (-), and multiplication (*). Table
    3 lists the arithmetic operators supported in Java:


    | Arithmetic operator | Description |

    |---|---|n| + | Addition |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division |

    | % | Modulus |


    The arithmetic operators are used to perform mathematical operations as in algebra.
    Apart from the arithmetic operator, you also need to understand the assignment
    operator, which is discussed in the following section.


    # 2.1.6.1 The Arithmetic Assignment Operator


    The equal (=) symbol is known as the assignment operator. The assignment (=) operator
    is used to store or assign a value to a variable. For example, in expression,
    i=10, we are assigning a value 10 to the variable i. Remember that in expression
    i=10, we are not comparing the variable i with 10; rather we are assigning the
    value 10 to the variable i.


    In Java, assignment operators can be used in two ways—simple and compound. In
    simple assignment, we use the (=) operator for assigning a value to a variable.
    The following code snippet shows an example of simple assignment:


    ```

    x = 10;          // x stores 10

    x = x + 10;     // x stores 20

    x = x + 5;       // x stores 95

    ```


    In compound assignment, we use the +=, -=, /=, and %= operators. The following
    code snippet shows an example of compound assignment:


    ```

    i = 10;      // i is initialized with the value 10

    i += 15;     // i is compound assigned with 25

    i -= 5;      // i is compound assigned with 20

    ```


    In the preceding code snippet, the variable i is assigned with the value 10. In
    the expression i+=15, the value 15 is added to the value already contained in
    the variable i and the total value is reassigned to i, so i will contain 25. In
    the expression i-=5, the value 5 is subtracted from the value already contained
    in the variable i and then the resultant value is reassigned to i, so in this
    case the variable i will contain 20. Listing 1 shows an example of compound assignment:'
