    features, using an extend relationship.


    # 14.1.2.3 Generalization Relationship


    Generalization relationship is a parent-child relationship between two or more
    use cases. It is a kind of relationship in which the properties of the parent
    use case are inherited by the child use cases. The child use case is an enhancement
    of the parent use case.


