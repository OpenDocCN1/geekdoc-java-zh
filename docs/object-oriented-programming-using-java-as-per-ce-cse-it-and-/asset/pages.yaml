    # # 7.5 Threads and Transitions


    Threads are scheduled for execution by the thread scheduler, which is a part of
    the JVM. Threads are stored in a runnable pool and the scheduler selects the threads
    that are eligible for execution in random order. The runnable pool is a collection
    of threads that are in the runnable state. The thread selected by the scheduler
    starts executing and it dies as soon as the execution of the run() method is complete.
    Apart from new, running, and dead states, threads also have some intermediate
    states.


    # ## 7.5.1 Thread States


    When an instance of the Thread class is created, you need to invoke different
    methods to make the thread functional. In other words, when you create a thread,
    it is only an instance of the Thread class instead of an independently executed
    thread. To make the thread eligible for execution, the start() method of the Thread
    class is invoked by a Thread object. After invoking the start() method, the thread
    moves to its runnable state.


    To work with threads in a program, you need to identify the thread state. Let''s
    discuss how to identify the thread state in the following section.


    # ### 7.5.1.1 Identifying Thread States


    A thread in a program is a path of execution, which can be in any one of the following
    states:


    +   **New**: A thread is known to be in the new state when it has been instantiated
    and the start() method has not been invoked yet on the instance. In other words,
    the Thread object exists but it is not a thread of execution (that is, cannot
    execute any instruction) as it is not yet alive.


    +   **Runnable**: Threads on which the start() method has been invoked and are
    eligible to run but the thread scheduler has not yet selected them for execution
    to be in the runnable state. Threads in the runnable state are kept inside the
    runnable pool from where the scheduler selects them for execution. Runnable threads
    are also called threads. A thread attains the runnable state the first time by
    the invocation of the start() method. A thread can also come back to the runnable
    state from a blocked, waiting, or sleeping state.'
