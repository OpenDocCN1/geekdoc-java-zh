    # 2.3 Declaring Variables


    Java provides containers or placeholders to store data in a program. These containers
    are called variables since the values stored in them can be changed during the
    course of execution of a program. To declare a variable in a Java program, you
    need to use the combination of a data type and an identifier. The identifier is
    the name given to the variable and it must be a logical name. A variable must
    be declared before it is used in the program. The syntax for declaring a variable
    is:


    ```

    dataType variable; // declaring variable

    ```


    In the preceding syntax, `dataType` specifies a valid Java data type, such as
    `int`, `char`, and so on. `variable` can be any name that follows some naming
    conventions, which are discussed later in this topic.'
