  md: '# 14.1.5 Benefits of Use Case Model


    The main benefits of use case modeling are as follows:


    +   - Use case model provides an excellent technique to capture the functionality
    of a system.

    - Use case model provides a complete summary of the whole system in a single illustration.

    - Use case model can be used for various aspects of software development, such
    as estimating, scheduling, and validating efforts.

    - Use case models are not written in any particular language; rather, they can
    be written in any style that suits the project.

    - Use case models are composed of narrative text and written in such a way that
    even a non-technical person can understand the model of the system.


    # 14.2 Sequence Model


    Sequence model represents the flow of system events, actions, and messages between
    the objects over a time period.

    A sequence model is of two types:


    +   - Scenario

    - Sequence Diagram


    # 14.2.1 Scenario


    Scenario is a series of systematic events that occurs during a specific execution
    of a system. Scenarios make it easy to make a sequence diagram. In scenarios,
    the interaction between the objects are generally written at high level. The exchanged
    messages are also written at high level.


    While writing a scenario, the objects that will interact with each other must
    be first identified. Then the sender and receiver of each message should be determined.
    Finally, the sequence of messages should be decided.

    The following is an example of a scenario for booking a flight ticket:


    +   - A customer logs in.

    - The system validates the customer.

    - The system displays the Home page of the Airline reservation system.

    - The customer scrolls through the available options.

    - The customer selects the desired available flight.

    - The system displays the form to be filled up.'
