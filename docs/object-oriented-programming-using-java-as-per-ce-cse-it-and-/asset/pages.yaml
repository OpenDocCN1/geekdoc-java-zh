    - 15–or F


    An important aspect that must be taken into consideration while representing integers
    in the hexadecimal notation is the prefix 0x (zero with x). All hexadecimal representations
    must start with 0x or 0X to tell the JVM that the given number is in hexadecimal
    format.


    # 2.1.3.2 Floating-Point Literals


    In Java program, the whole numbers are represented as integers with a fractional
    number is represented and assigned using floating-point literals. The source code
    representation of floating-point values in a Java program is called floating point
    literals. A floating point number consists of integers and a decimal point. Consider
    the following example:


    ```

    double distance=42313.13245;

    ```


    Here, we have represented a floating-point literal as 42313.13245 in which the
    first part is 42313, by a decimal point (.), and the second part is 13245.


    In Java programming language, by default, the floating-point literals are defined
    as double that has a width of 64 bits. You can assign a floating-point literal
    in a float type of variable but it will generate compilation error. The error
    states the possible loss of precision as the width of float data is 32 bits.


    Apart from integer and floating-point literals, we also have Boolean literals
    which can have either true or false as their value. Now, let''s discuss the Boolean
    literals in detail.


    # 2.1.3.3 Boolean Literals


    In Java, Boolean values are the result of conditions, which return either true
    or false. The source code representation of the Boolean values is called Boolean
    literals. The possible Boolean literals are true and false. In Java, Boolean literals
    cannot be represented in the form of numbers 0 for false and 1 or any number for
    true. In other words, the Java programming language does not support any true
    for true and false Boolean. Consider the following code snippet:


    ```

    boolean status=true;   // no error

    boolean status=1;      // will generate compilation error

    ```


    In the preceding code snippet, the first representation of the Boolean literal
    is correct and executes without any compilation error. However, the second representation
    of Boolean literal is incorrect as 1 is assigned to a Boolean data type leading
    to a compilation error.'
