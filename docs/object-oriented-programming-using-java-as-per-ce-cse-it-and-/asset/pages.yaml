    - Learning about the Abstract Class

    - Declaring the Nested Classes

    - Working with the Inner Class

    - Using the Anonymous Inner Class


    In the earlier chapters, you have already learned that a Java program consists
    of Object-Oriented Programming (OOP) components, such as classes, variables, and
    methods, which are known as Java members. A Java class is a template used for
    creating Java programs consisting of variables (state) and methods (behavior).
    A variable is the basic element of a Java program which acts as a container for
    data. On the other hand, for increasing the cohesion of the Java program, methods
    are used for performing specific tasks. While declaring the members of a class,
    you can set the accessibility of the class by using the public, private, and protected
    keywords. These keywords are specifiers of the Java programming language.


    In OOP, classes provide a sort of template, i.e., if you think of a class as a
    cookie cutter, the objects you create are the cookies. Each object of a class
    has its own set of variables and methods. You can consider a class an object''s
    type—you use a class to create an object and then you can call the object''s methods
    from code. To create an object, you call a class''s constructor, which is a method
    with the same name as the class itself. This constructor creates a new object
    of the class.


    This chapter discusses the concept of classes and objects. Next, it explains constructors
    and methods in Java. Further, the chapter provides a brief outline on recursion
    and the abstract and nested classes. Towards the end, it discusses inner and anonymous
    inner classes.'
