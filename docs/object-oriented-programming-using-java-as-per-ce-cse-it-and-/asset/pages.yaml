    # # 12.9 Derived Data and Packages


    A derived element is a function of one or more elements. These elements may also
    be derived from some other element. A derived attribute is that attribute which
    is created from one or more other attributes.


    An example of derived attribute is shown in Figure 25.


    | Square |

    |---|

    | Length |

    | Breadth |

    | /Area |


    ▲ Figure 25: Example of Derived Attributes


    In Figure 25, the class squares have attributes length and breadth. It might also
    have an attribute called Area. Now since the attribute area is derived from the
    other two attributes, length and breadth, area is considered as derived attribute.
    In UML, derived attributes are marked with a slash (/) before the attribute name
    as shown in Figure 25.


    Packages are a mechanism to model elements into groups. It provides a namespace
    for the grouped elements. A package may have other packages. Thus, a package can
    provide a hierarchical organization of packages. Packages are used to organize
    elements properly.


    Figure 26 shows an example of UML package.'
