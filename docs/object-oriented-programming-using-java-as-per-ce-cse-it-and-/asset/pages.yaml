    # 8.3 Working with Stream Classes


    Generally, programs use data from external sources. This data can be from remote
    machines or from the local files on the same system. Java uses the concept of
    streams for reading data from the system and writing data to it.


    Stream sources include files, buffers, sockets, and other streams. Stream destinations
    include the same objects as stream sources and others as well, such as printers.
    Generally, there are two types of streams—input stream and output stream. In case
    of input stream, a stream of data items flows from a source, where, in case of
    output stream, the data items flows to a destination.


