    # 3.3 Using the StringBuffer Class


    Similar to the String class, the StringBuffer is also present in the java.lang
    package. The difference between both classes is that the String class creates
    immutable strings, while the StringBuffer class helps in creating mutable strings.
    In other words, the strings using the StringBuffer class can be changed dynamically.
    Table 1 lists the methods of the StringBuffer class:


    | Table 1: Methods of the StringBuffer Class |

    | Method | Explanation |

    |---|---|n| StringBuffer append(Object obj) | Appends the value stored in the
    given object at the end of the invoking StringBuffer object |

    | StringBuffer append(int i) | Appends an integer value at the end of the invoking
    StringBuffer object |

    | StringBuffer delete(int start_index, int end_index) | Removes a sequence of
    characters from the invoking StringBuffer object. The start_index specifies the
    index of the starting character and the end_index specifies the index of the last
    character |

    | StringBuffer deleteCharAt(int index) | Removes a character located at the given
    index in the invoking StringBuffer object |

    | StringBuffer insert(int index, boolean b) | Adds a boolean value at the specified
    index in the invoking StringBuffer object |

    | StringBuffer insert(int index, char c) | Adds a character at the specified index
    in the invoking StringBuffer object |

    | int length() | Returns the length of the invoking StringBuffer object |

    | StringBuffer reverse() | Reverses the characters sequence of the invoking StringBuffer
    object |

    | String toString() | Returns the value of the StringBuffer object as a string
    |'
