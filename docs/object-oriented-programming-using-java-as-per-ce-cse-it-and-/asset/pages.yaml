  md: '# Networking with Java.net


    # OBJECTIVES


    +   - Discussing the basics of networking

    - Discussing networking enhancements in Java SE 8

    - Explaining client-server networking

    - Learning about proxy servers and domain name service

    - Understanding networking interfaces and classes in the java.net package

    - Discussing about internet addressing

    - Understanding the concept of sockets in Java

    - Discussing about URL class and URI class

    - Learning about datagrams


    Networking is a particularly important topic in Java. The infrastructure for networking
    provided by the java.net package is very robust and flexible. This package has
    many classes as a component of the networking infrastructure, making the package
    hard to understand. Moreover, these classes are rarely used by normal applications.
    The java.net package provides the facility to perform low-level networking. In
    this chapter, we will take a look at the URL class, which about how Java handles
    Uniform Resource Identifiers (URIs), the URLConnection class, which allows you
    to get information for communication across the Internet and intranets. The Socket
    class is particularly powerful—using it, you can write client/server programs
    when the client is on one machine and the server is on another.


    This chapter first discusses about. Then it explains networking enhancements in
    Java SE 8. Next, you learn about client server networking. It also discusses about
    proxy servers and domain name service. Further, it provides a brief explanation
    on networking interfaces and classes in the java.net package. It also outlines
    Internet addressing and the concept of sockets in Java. In the end, it discusses
    about Uniform Resource Locator (URL) class, URI class, and datagrams.


