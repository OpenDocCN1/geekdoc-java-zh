  md: '# 332 Chapter 12


    # 12.7 Metadata


    Metadata is data that describes other data. So it is called data about data. It
    summarizes the basic information about data. Definition of class is an example
    of metadata. Another example of metadata is model. In model we describe the things
    to be modeled. So is a type of metadata. Relational Database Management System
    (RDBMS) is also a type of metadata.


    Metadata is also useful in images, videos, spreadsheets, and Web pages. It is
    used to describe how, when, and by whom a particular set of data were collected
    and formatted. It is very useful in data warehouse as it helps in understanding
    information stored in data warehouse. Metadata is also useful in XML Web application.


    Metadata can be of three types:


    +   - Structural metadata: It indicates how compound objects are put together.
    For example, how pages are ordered to form chapters.


    +   - Descriptive metadata: It describes a resource for a particular purpose.
    For example, it can include elements, such as title, authors, and keywords.


    +   - Administrative metadata: It provides information that helps to manage a
    resource, such as file type and other technical information.


    # 12.8 Constraints


    Constraints are functional relationship between entities of an object model. Constraints
    are used to express a condition, restriction or assertion that are related to
    semantics of an element.


    Constraints are mostly used in class diagrams. It is a condition or restriction
    on UML element, where the elements can be objects, classes, attributes, links,
    associations, or generalizations. Constraint in UML is a Boolean expression that
    must evaluate to a Boolean value, i.e., True or False.


    In UML, there are some predefined constraints and constraint element to introduce
    user defined constraints and restrictions. Object Constraint Language (OCL) is
    a predefined constraint language in UML.


    In UML, there are four types of constraints on the generalization sets. They are
    as follows:


    +   - Complete: Complete constraint specifies that all children in the generalization
    are specified completely in the model and no additional children are permitted.


    +   - Incomplete: Incomplete constraint specifies that not all children in the
    generalization are specified completely in the model and additional children are
    permitted.'
