    - protected: When you can access the methods and fields from the same class to
    which the methods and fields belong, within its subclasses, and within the units
    of the same package, but not from other packages. The protected access specifier
    cannot be used with class declaration.

    - private: You cannot access the methods and fields only within the same class
    to which the methods and fields belong. When you declare a method or field as
    private, it is not visible within the class and is not inherited by the subclasses.
    The private access specifier opposite to the public access specifier. The concept
    of encapsulation in which data are hidden within the class and accessor methods
    are provided through the use of private access specifier.

