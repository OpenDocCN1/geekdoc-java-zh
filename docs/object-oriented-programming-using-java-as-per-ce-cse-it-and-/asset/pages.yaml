  md: '# Chapter 1


    Now that Java has been popularized by the Internet, a huge and increasing number
    of corporations are adopting it internally instead of C++ for just because of
    its popularity—in some versions, such as Microsoft''s C#, are now being modeled
    after Java. Oak was renamed Java in 1995, when it was released for public use.
    By that time, Java had adopted a model that made it perfect for the Internet—the
    bytecode model


    A Microsoft Visual C++ program is, typically starting off at a minimum of 5 MB
    for a MFC program, and doesn''t even count the Dynamic Link Libraries (DLLs) that
    the Windows platform needs to run Visual C++ programs. Due to the large size of
    Visual C++ program, it becomes difficult to download it as of a Web page to perform
    some specified task on your computer.


    Java programs, on the other hand, are constructed differently. Java itself is
    implemented as the JVM, which is the application that actually runs your program.
    When JVM is installed on a computer, it can run Java programs. Java programs,
    therefore, don''t need to be self-sufficient, and they don''t have to include
    all machine-level code that actually runs on the computer. Java programs are compiled
    into bytecode, and it is bytecodes that the JVM reads and interprets to run your
    program. When you download a Java applet on the Internet, you are actually downloading
    a bytecode file.


    In this way, your Java program can be very small, because all the machine-level
    code to run your program is already on the target computer and does not have to
    be downloaded. To host Java on all computers, Sun Systems had to rewrite JVM to
    work on those computers. When your program is stored in a bytecode file, it will
    run on any computer which JVM is installed.


    Java programs were originally interpreted by the JVM, which performed by bytecode
    execution. This made interpretation a slow process. To overcome the slow process,
    Java 2 introduced the Just-In-Time (JIT) compiler, which is built into the JVM.
    The JIT compiler actually reads your bytecode in sections and compiles them interactively
    into machine language so that the program can run faster (the whole Java program
    is not compiled at once Java runtime performs checks on various sections of the
    code).


    # Comparing Java with C++


    Here, we discuss the comparison of Java with C++. Java has adopted object-oriented
    features from C++ language. Table 1 compares Java with C++:


    | Table 1: Comparison between Java and C++ |

    | Points of Difference | Java | C++ |

    | --- | --- | --- |

    | Support for overloading | It does not support overloading. | It supports overloading.
    |

    | Concept of template classes | It does not provide the concept of template classes.
    | It provides support for template classes. |'
