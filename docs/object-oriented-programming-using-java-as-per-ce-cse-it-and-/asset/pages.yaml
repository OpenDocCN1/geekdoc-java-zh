  md: '# Working with Packages and Exceptions


    # OBJECTIVES


    +   - Understanding Packages in Java

    - Defining Java API Packages

    - Handling Exceptions


    A package can be considered a directory or folder, which allows you to store various
    classes related to each other in an application. Packages resolve the problem
    of class name collision.

    On the other hand, exceptions are certain abnormal conditions or errors that occur
    at runtime and cause an abrupt termination of a program. A program should be able
    to handle exceptions efficiently in order to overcome the problem of sudden program
    termination resulting from exception. Let''s suppose that you created a package
    to perform division operations. However, if you used 0 to divide a number This
    generates Arithmetic Exception (a built-in Java exception). Java provides various
    techniques to handle exceptions. Java also provides Input/Output (I/O) framework.
    This framework provides a simple, standardized Application Programming Interface
    (API) for reading and writing the data that is in the form of characters or bytes,
    from various data sources. The I/O framework java.io (input-output package) contains
    a collection of classes such as FileInputStream, OutputStream provides useful
    abstractions and better I/O performance. These classes are wrapper classes of
    InputStream and OutputStream. Input streams are streams that receive data, whereas
    output streams are streams that send or write data. Classes in java.io package
    represent all elements.


    This chapter first discusses the packages in Java. Further, it discusses creating
    and importing packages in Java. Next, it gives access control in Java. This chapter
    also discusses Java API packages, such as java.lang and java.util. In the end,
    it explains exceptions and statements for handling exceptions.


    # 6.1 Understanding Packages in Java


    In Java, you cannot create two classes with the same name. This means you have
    to assign a different name for every new class. This, however, is a tedious task.
    To resolve this problem, you can use a package. Let''s consider an example to
    understand how packages resolve the problem of class name collision. Suppose you
    have created some classes with'
