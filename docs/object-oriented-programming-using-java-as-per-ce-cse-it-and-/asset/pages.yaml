  md: '# State Modeling 341


    A state is normally attached to some event. If any state is attached to state
    transition, the state transition is done when an event occurs. A ''do action''
    is a kind of ongoing process performed while an object is in a particular state.
    Examples of ''do action'' are polling, waiting, etc. ''Do actions'' can be interrupted
    by an event outside the state. If the state does not have an event signed, the
    attached state changes when internal actions in the source state executed.


    State charts represent possible sequences of state change from a particular point
    of view. Each transition is a realization of an action or use case. A state of
    an object is denoted by a rounded rectangle with state name inside. Figure 2 shows
