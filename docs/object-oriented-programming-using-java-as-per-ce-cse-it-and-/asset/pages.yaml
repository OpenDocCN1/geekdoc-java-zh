  md: '# Key Terms


    +   - Built-in packages: Refer to packages that are already present in Java.


    +   - Compile time errors: Refer to errors that occur due to syntactical problems
    in a program.


    +   - Exceptions: Refer to certain abnormal conditions or errors that occur at
    runtime and can cause an abrupt termination of a program.


    +   - Package: Refers to a directory or folder, which allows you to store various
    classes related to each other in an application.


    +   - Run-time errors: Refer to errors that occur due to certain conditions, such
    as failure, or if not found error.


    +   - User-defined packages: Refer to packages that are defined by the user.


    # Review Exercise


    True or False

    **Q1. A package declaration should be the first statement of a Java source file.**

    Ans. True


    **Q2. A single package can only be imported in a Java source file.**

    Ans. False


    **Q3. The Throwable class is an immediate subclass of the Object class.**

    Ans. True


    **Q4. All exceptions are broadly divided into two categories: checked exceptions
    and unchecked exceptions.**

    Ans. True


    **Q5. A try block can be used without a catch or finally block.**

    Ans. False


    **Q6. You can only use a single try and catch block in a Java program.**

    Ans. False


    **Q7. The finally block is used to display information or to execute statements,
    which need to be executed irrespective of the catch block.**

    Ans. True


    **Q8. Java provides the java.io package to handle exception in a program.**

    Ans. False'
