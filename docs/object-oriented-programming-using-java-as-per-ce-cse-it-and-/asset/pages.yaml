  md: '# 13 State Modeling


    # OBJECTIVES


    +   - Discussing the concept of events

    - Explaining the concept of states

    - Describing the concept of transitions and conditions

    - Discussing the state diagram

    - Describing the state diagram behavior


    State modeling is used to represent the state of an individual object during the
    object''s whole cycle. Each object may have multiple states during its life cycle.
    Depending on the operation performed, the value of the attribute of an object
    and its state.


    This chapter begins with events, then it explains the concept of states, transitions
    and conditions, and state diagram. Finally, it ends with a discussion on the behavior
    of a state diagram.


    # 13.1 Events


    An event is something that happens and that may involve some action. It is the
    specification of a significant occurrence that has a location in time and space.
    An event can happen synchronously or asynchronously, and it can trigger state
    changes. Events may be external or internal and asynchronous or synchronous. Examples
    of events are:


    +   - Starting the engine of a car

    - Entering PIN in an ATM machine

    - Opening the door of a microwave oven


    For explaining synchronous and asynchronous events let us take an example of a
    telephone call. If person is calling to some number, a signal passes from the
    origin (caller) to destination receiver. This calling event is asynchronous till
    the call is not attended, and it becomes synchronous when the receiver attends
    the call. In simple words, in case of a telephonic conversation, if the two persons
    are exchanging information, we can call it synchronous otherwise it is asynchronous.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# 340  Chapter 13


    An external event is caused by something (for example, an actor) outside the system.
    For example, when a cashier presses the ‘Enter an Item’ button, an external event
    occurs.


    An internal event is caused by something inside the body system. An internal event
    arises when a method is invoked via a message or signal that was sent from another
    internal object.

    The basic syntax of events is as follows:


    ```

    event-name ‘parameters)’ [guard condition] ''/'' action-expression

    destination-expression destination-event name (arguments)

    ```


    In the UML, there are four kinds of events:


    +   - Signal Event: A signal event represents a named object that is dispatched
    asynchronously by one object and received by another. Any instance of any class
    can send a signal to invoke an operation of a receiving object. When an object
    sends a signal, the sender dispatches the signal and continues along its flow
    of control, waiting for return from the receiver.


    +   - Call Event: A call event represents the dispatch of an operation. A call
    event is synchronous. When an object calls an operation, the sender dispatches
    the operation and waits for the result.


    +   - Time Event: A time event is an event that represents the passage of time.


    +   - Change Event: A change event is an event that represents a change in state
    or the satisfaction of some condition.


    Figure 1 shows an example of time and change events.


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_359_0.png)


    # 13.2 States


    A state represents the current status of an object and its properties. An object
    state is generally determined by values of attributes and links with other objects.
    Depending on the current status and event, the state of an object changes and
    the object goes into the next state. Examples of states can be:


    +   - Engine (object) is running (state)


    +   - Bank account (object) is blocked (state)


    +   - User (object) is logged in (state)'
