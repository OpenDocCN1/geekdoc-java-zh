  md: '# 14.2.3 Guidelines for Sequence Model


    While constructing a sequence model, the following guideline should be followed:


    +   1. A scenario should be written for each use case. The simple mainline action
    should be enlisted in the scenario, and if there are some alternate mainline actions,
    those that actions should be written in a separate scenario.

    2. A sequence diagram should be created using the actions enlisted in the scenarios.

    3. In a sequence diagram, the conditions of each actor should be clearly shown.

    4. When there are a large number of interactions, separate sequence diagram should
    be modeled by separating the interactions logically.

    5. The system response to error condition should be shown in a separate sequence
    diagram.


    # 14.2.4 Procedural Sequence Model


    In a sequence diagram, there can be many objects that can interact with each other
    by exchanging messages between them. The objects can remain in an active state
    after sending the messages, and thus, they can receive the message from any other
    objects. The procedural calls are represented by the sequence model.


    # 14.2.4.1 Sequence Diagram with Active and Passive Objects


    In a sequence diagram, all objects do not remain active all the time. The objects
    become active when they receive the message for invoking their procedure. The
    objects become passive when the operations are completed and the control returns
    back to the caller.


    In sequence diagram, the entire time period during which an object exists is lifeline
    and the period of time for an object execution is called focus of control.


    Figure 14 shows a simple sequence diagram for online course registration system:


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_382_0.png)


    ▲ Figure 14: Sequence diagram for online course registration system'
