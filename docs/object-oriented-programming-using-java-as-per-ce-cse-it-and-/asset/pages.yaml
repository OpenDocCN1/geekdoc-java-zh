    # 2.1.1 Using Keywords


    Keywords are reserved words that cannot be used while naming a variable or method.

    Table 1 shows certain Java keywords:


    | Table 1: Java Keywords |

    | abstract | cast | throws | int | protected | else |

    | --- | --- | --- | --- | --- | --- |

    | assert | catch | transient | instanceof | private | return |

    | boolean | char | try | import | package | synchronized |

    | break | class | var | implements | new | switch |

    | byte | const | void | if | native | super |

    | byvalue | continue | volatile | goto | long | strictfp |

    | case | default | while | for | interface | static |

    | enum | do | throw | float | extends | short |

    | final | double | public | finally |


    The keywords in Table 1 should not be used as identifiers in Java. The following
    section explains what identifiers are and rules for declaring legal identifiers.


    # 2.1.2 Using Identifiers


    An identifier is a symbolic name that refers to the name of variables, methods,
    classes, packages, or interfaces in a Java program. Each variable is identified
    by its name. The variable name should relate to its purpose. Similarly, in case
    of a method, the name of the method should relate to the method''s functionality.
    Java identifiers consist of alphabets, numbers, underscore (_), and the dollar
    sign ($). Some rules for legal identifiers are follows:


    +   - Must start with an underscore (_), a letter, or a dollar sign ($)

    - May consist of a letter, a number, an underscore, and a dollar sign

    - Does not allow spaces in between an identifier

    - Cannot have a name that is similar to a Java reserved keyword

    - Are case-sensitive, that is, the word salary, Salary, and SALARY are three different
    identifiers'
