    \ be put in a package. In this way, you can use the same names to create other\
    \ classes outside the package. In Java, packages are divided into the following\
    \ two categories:\n\n+   - User-defined packages\n- Built-in packages\n\nThe Java\
    \ Application Programming Interface (API) consists of many classes and interfaces,\
    \ which are arranged in the form of packages according to their functionality.\
