    in a condensed

    format in zip pattern. The .jar is the extension for JAR files. A JAR file is
    unzipped by using

    software and then all its contents are extracted. Also, many processors, such
    as the Java

    Virtual Machine or browsers can use the files in a JAR directly without extracting
    the files.


    # 6.2.1 Creating a JAR File


    A JAR allows you to wrap various files into one. In fact, JAR files compress their
    contents

    using the ZIP format. If your needs a lot of large files, then it makes sense
    to create

    and download a JAR file. Web browsers only need one connection rather than

    connections for each file, which can improve download times. The digital signature
    is

    used by the files in a JAR file for proving their origin. You create JAR files
    with the jar tool.

    This tool comes with, Java, and here is how you use it:


    ```

    jar [options] [manifest] destination input-file [additional input files]

    ```


    Here, options refer to the options that you can use with the jar tool, and they
    are much

    t options that you can use with the UNIX tar tool. The optional manifest consists

    of name of a manifest file, which supports digital signing and lists the contents
    of the JAR

    file. When you create a Java bean, you use the manifest file to indicate which
    classes are

    beans. The following possible options can be used with the jar tool:


    +   - c: it creates a new or empty archive on the standard output.

    - t: it lists the table of contents from standard output.

    - x file: it extracts all files or just the named files. In case a file is not
    present, then all the files are accessed; else, only the specific files are accessed.

    - f: the argument specifies a JAR file to work with.

    - v: it generates "verbose" output on stderr.

    - m: it includes manifest information from a specified manifest file.

    - 0: it indicates "store only," without using ZIP compression.

    - M: it specifies that a manifest file should not be created for the entries.

    - u: it updates an existing JAR file by adding files or changing the manifest.

    - -C: it changes directories during execution of the jar command.


    > Use an argument beginning with the character "@" to specify a file containing
    additional

    uments, i.e. one argument per line. The arguments are inserted into the command
    line at the

    position of @filename argument.


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_167_0.png)


    The typical usage of the jar tool is as follows:


    ```

    D:\chapter6> cf jarfile.jar *.class

    ```'
