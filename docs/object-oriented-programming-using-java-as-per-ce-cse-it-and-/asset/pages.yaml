  md: "# Working with Classes, Objects, and Methods\n\nThe output of Listing 14 is\
    \ in Figure 14:\n\n![](img/4f531a2e69cb8c7a51fb7463c748ad72_120_0.png)\n\nFigure\
    \ 14: Output of the AppAbs Program\n\n# 4.7 Working with Nested Classes\n\nJava\
    \ allows you to create classes within classes. A class declared within another\
    \ class is called a nested class. A nested class has the following features:\n\
    \n+   - The scope of the nested classes is within the class where it is declared.\
    \ In other words, if a class Address is declared within the class Employee, then\
    \ the Address class is known to the Employee class only and not outside the Employee\
    \ class.\n\n+   - A nested class can access members of the enclosing class, including\
    \ its private members, whereas the enclosing class does not have access to the\
    \ members of the nested class.\n\nIn Java, nested classes are of the two types:\n\
    \n+   - Static nested class: A nested class declared using the static keyword\
    \ or within a static context of enclosing class is called a static nested class.\
    \ A static nested class cannot access the instance variables of the class directly;\
    \ it needs the object of the enclosing class to access its member. Due to this\
    \ limitation, the static nested class is not preferably used.\n\n+   - Non-static\
    \ nested class: A normal nested class declared using the static keyword is a non-static\
    \ nested class. It is also called an inner class. The non-static nested class\
    \ can access the instance variable of the enclosing class directly without initializing\
    \ it. Therefore, you can conclude that the non-static nested class is fully within\
    \ the scope of the enclosing class.\n\nListing 15 shows an example of the nested\
    \ class:\n\n+   Listing 15: Creating a Nested Java Class\n\n```\nclass Enclosing{\n\
    \    int outer_num=100;\n    void display() {\n        Nested n=new Nested();\n\
    \        n.showData();\n    }\n    class Nested {\n        void showData() {\n\
    \            System.out.println(\"The value stored in the member variable outer_num\
    \ of\ninclosing class is \"+outer_num+\");\n        }\n    }\n}\n```"
