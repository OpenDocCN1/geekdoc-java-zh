  md: '# 2.1.3 Using Literals


    In a Java program, you can assign a literal value to a variable. Literal refers
    to the constant values that can be changed depending on the program requirement.
    The source code representations of primitive data types in a Java program are
    known as primitive literals. These primitive literals can be an integer, floating-point
    number, and a Boolean value, or a character that you use in your program. Some
    examples of the primitive literals are:


    ```

    24          //an int literal

    124.543     // a double literal

    true        // a boolean literal

    ''v''         // a char literal

    ```


    In the above example, 24 is an integer value, 124.543 is a floating number, true
    is the Boolean literal, and v is a character value. Now, let''s discuss the following
    literals in detail:


    +   - Integer Literals

    - Floating-Point Literals

    - Boolean Literals

    - Character Literals

    - String Literals


    # 2.1.3.1 Integer Literals


    Based on the requirement of the program, an integer number can be represented
    in the following three ways:


    +   - Decimal Literals: The decimal literals are commonly used to represent numbers
    in real life. They have base 10 and use digits between 0 and 9 to represent all
    numbers. The decimal representation of an integer number does not use any prefix
    as compared to other forms of representing integers.

    - Octal Literals: The other way of representing integer numbers is octal representation,
    which has base 8. It uses only 8 digits, from 0 to 7, to represent all numbers.
    In Java, the octal numbers are preceded by a prefix 0, which notifies the compiler
    that the number is represented in the octal form.

    - Hexadecimal Literals: The hexadecimal representation of an integer number has
    base 16. It uses 10 digits and 6 special symbols/characters to represent the numbers.
    The digits used by hexadecimal notation are 0 to 9 and the special symbols are
    a, b, c, d, e, and f. The representation of 0-9 in the hexadecimal notation are
    the same as in the decimal notation and the remaining 6 are represented by characters
    a to f. The respective representations of 10 to 15 in the hexadecimal notation
    are:


    +   - 10 - a or A'
