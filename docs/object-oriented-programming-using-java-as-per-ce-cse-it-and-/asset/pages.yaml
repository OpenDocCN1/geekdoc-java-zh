    # 13.3 Transitions and Conditions


    A transition is a relationship between two states. It indicates that an object
    in first state will execute some actions and enter into next state. In a state
    machine, a set of states is connected by transitions. It is possible to have state
    transitions without explicit events. This kind of transition will occur when activities
    within each state are completed.


