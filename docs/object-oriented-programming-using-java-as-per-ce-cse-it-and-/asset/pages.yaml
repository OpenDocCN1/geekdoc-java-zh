  md: '# 14.2.4.2 Sequence Diagram with Transient Objects


    Transient objects exist for a short period of time. In a sequence diagram, emphasis
    is given on the ordering of messages. The objects that interact are placed horizontally
    at the top of the sequence diagram. The objects that initiate the interaction
    are placed at the left, and the subordinate objects are placed to the right. The
    messages are placed along the vertical axis, in the order of increasing time from
    top to bottom.


    In a sequence diagram, a lifeline is shown as a vertical dashed line, which represents
    the existence of the object over a period of time. In certain cases, the interaction
    represents the history of specific objects. So it is represented by underlining
    the objects. The focus of control shows the time period during which the object
    is active and interacts. It is represented by a tall, thin rectangle. The nesting
    function can also be shown in a sequence diagram by a self-loop or by stacking
    one over the other. Messages are shown by dashed arrow horizontally from one lifeline
    to another, with the arrow head pointing towards the receiver.


    Synchronous messages are shown by a filled arrow head and asynchronous messages
    are shown by a line with a stick arrow.


    Figure 15 shows a simple sequence diagram with transient objects:


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_383_0.png)


    ▲ Figure 15: Sequence diagram with transient objects


    # 14.3 Activity Model


    Activity diagram is used to describe the dynamic aspect of a system. It is used
    to show the flow of control from one activity to another activity in the system.
    It may be created to show the workflow for an operation.'
