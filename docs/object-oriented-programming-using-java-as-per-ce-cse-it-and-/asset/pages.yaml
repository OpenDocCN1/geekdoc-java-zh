  md: '# GUJARAT TECHNOLOGICAL UNIVERSITY


    # OBJECT ORIENT PROGRAMMING USING JAVA

    SUBJECT CODE: 2150704

    B.E. 5th SEMESTER


    Content:


    | Sr. No | Content | Total Hrs | Weightage (Out of 100%) |

    | --- | --- | --- | --- |

    | 1 | Basics of Java: Features of Java, Byte Code and java Virtual Machine, JDK,
    Data types, Operator, Control Statements - If, else, nested If, if-else ladders,
    Switch, do-while, for, for-break, continue. | 2 | 5 |

    | 2 | Array and String: Single and Multidimensional Array, String class, StringBuffer
    class, Operations on string, Command line argument, Use of Wrapper Class. | 2
    | 5 |

    | 3 | Class, Objects and Method: Class, Object, Object reference, Constructor,
    Constructor Overloading, Method Overloading, Recursion, Passing and Returning
    object from Method, new operator, this and static keyword, finalize() method,
    Access control, modifiers, Nested class, Inner class, Anonymous class, Abstract
    class. | 6 | 15 |

    | 4 | Inheritance and Interfaces: Use of Inheritance, Inheriting Data members
    and Methods, constructor in inheritance, Multilevel Inheritance method overriding,
    handle multilevel constructors - super keyword, Stop Inheritance - Final keywords,
    and Implementation of an interface, Interface reference, instanceof operator,
    Interface inheritance, Dynamic method dispatch, Understanding of Java Object Class,
    Comparison between Abstract class and interface, Understanding of System.out.println
    - statement. | 6 | 10 |

    | 5 | Package: Use of Package, CLASSPATH, Import statement, Static import, Access
    control | 2 | 3 |'
  merge: -1
  pgno: 4
- img_proc: true
  md: '# Syllabus


    | Sr. No | Content | Total Hrs | Weightage (Out of 100%) |

    |---|---|---|--|

    | 6 | **Exception Handling:** Exception and Error, Use of try, catch, throws and
    finally, Built in Exception, Custom exception, Throwableable Class. | 5 | 10 |

    | 7 | **Multithreaded Programming:** Use of Multithreaded programming, Thread
    class and Runnable interface, ThreadReader, Thread priority, Thread synchronization,
    Thread communication, Deadlock | 4 | 5 |

    | 8 | **IO Programming:** Introduction to Stream, Byte Stream, Character stream,
    Readers and Writers, File Class, File InputStream, File Output Stream, InputStream,
    OutputStream, FileReader, FileWriter, Buffered Reader | 5 | 10 |

    | 9 | **Collection Class:** List, AbstractList, ArrayList, LinkedList, Enumeration,
    Vector, Properties, Introduction to Java package | 1 | 2 |

    | 10 | **Networking with java.net** InetAddress class, Socket class, DatagramSocket
    class, DatagramPacket class | 2 | 5 |

    | 11 | Introduction to Object orientation, Modeling as a Design Technique Modeling
    Concepts, abstraction, The three models, Class Model, State model and Interaction
    model | 1 | 2 |

    | 12 | **Class Modeling** Object and class concepts, link and association, Generalization
    and Inheritance | 3 | 5 |

    | 13 | **Advance class Modeling** Object and class concepts, Association Ends,
    N-ary associations, aggregation, abstract class, multiple inheritance, Metadata,
    Constraints, Derived data, Packages. | 3 | 5 |

    | 14 | **State modeling** Event, states, Transition and conditions, state diagram,
    state diagram behavior | 2 | 8 |

    | 15 | **Interaction Modeling** Use case Models, sequence models, activity models
    | 4 | 10 |'
