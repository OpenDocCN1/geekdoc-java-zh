    # 2.4 Introducing Data Types


    Java is a strongly typed language, therefore it is important to understand the
    data types available in Java. You cannot even declare a variable without specifying
    its data type in Java program. The data types available in Java can be divided
    into four broad categories:


    +   - Integer: Represents integers using byte, short, int, and long

    - Floating-point: Represents fractional numbers using float and double data types

    - Character: Represents char, which is used to store characters

    - Boolean: Represents logical values using Boolean data type


    Let''s start discussion with Integer data types first.


