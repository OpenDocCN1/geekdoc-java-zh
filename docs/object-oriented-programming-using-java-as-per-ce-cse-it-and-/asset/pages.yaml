  md: '# 12.3 Aggregation


    Aggregation is a binary association representing a whole–part relationship. It
    indicates that a particular class is built by collection of other classes. For
    example, the class "library" is made of one or more books. In aggregation, if
    an aggregate (whole) is deleted, its parts are not deleted. Figure 20 shows an
    example of aggregation. To render aggregation in a diagram, draw a line from the
    part to the class with a diamond shape near the parent class. Here, it can be
    seen that a library has many books and parts are the part of Library.


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_348_0.png)


    # 12.3.1 Composition


    Composition is also a binary association representing a whole–part relationship.
    In composition, if a composite (whole) is deleted, all of its composite parts
    are “normally” deleted with it.


    Composition is represented as a binary association decorated with a filled black
    diamond at the aggregate (whole) end. Figure 21 shows some examples of composition.


    In Figure 21 (a), Folder is composed of one or more files. One folder may contain
    more than one file. Similarly, in Figure 21 (b), one College may have one or more
    departments. In Figure 21 (c), one department may have one or more staff members.


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_348_1.png)


    # 12.3.2 Difference between Aggregation and Composition


    In case of aggregation, if an aggregate (whole) is deleted, its parts are not
    deleted. But in case of composition if an aggregate (whole) is deleted, all its
    parts are deleted. In Figure 20, if library object is deleted, books can remain
    without it. But in Figure 21, if Department object is deleted, all staff from
    that department are also removed.'
