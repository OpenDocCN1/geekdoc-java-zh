  md: 'Generally, a transition has five parts:


    +   1. Source State: It specifies the current state of transition. In this state,
    object will perform transition to the target state if it receives any trigger
    event and specified guard conditions are satisfied.


    +   2. Event Trigger: It specifies the event by which transition occurs and object
    state changes.


    +   3. Guard Condition: It is a type of Boolean expression that is evaluated before
    doing transition from the source state to target state. If event triggers guard
    condition is not satisfied, a transition will not be performed, and event will
    be lost.


    Figure 7 shows an example of transition with the following guard condition:


    ```

    [ t = 10 sec]

    [Balance ≥ withdrawal Amount]

    ```


    The customer must pass authentication before withdrawing money. Authentication
    is done by checking a PIN. The PIN can be correct or incorrect, and if the number
    of unsuccessful attempts exceeds a limit, the customer will not be allowed to
    withdraw money.


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_362_0.png)


    **Figure 7: State diagram with guard condition***


    +   4. Action: It is an executable part, which will be executed on object. It
    may affect other related objects. It may be written as operations and attributes
    of an object. It may have parameters as well as more than action for one state
    transition. Actions are executed by one from left to right. Nested and recursive
    actions are not allowed.


    +   5. Target State: This state occurs after a successful transition. It means
    a target state is a state that becomes active after the completion of the transition.


    Transition is the relationship between two states where an object in the first
    state will perform certain actions and enter into the second state where a specified
    event occurs and specified conditions are satisfied.'
