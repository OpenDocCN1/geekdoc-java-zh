    a condition or restriction on UML element, where the elements are objects, classes,
    attributes, links, or generalizations. Constraint in UML is a Boolean expression
    that must evaluate to a Boolean value, i.e., True or False.


    In UML, there are some predefined constraints and constraint element allows to
    introduce user defined conditions and restrictions. Object Constraint Language
    (OCL) is a predefined constraint language in UML.


    In UML, there are four types of constraints on the generalization sets. They are
