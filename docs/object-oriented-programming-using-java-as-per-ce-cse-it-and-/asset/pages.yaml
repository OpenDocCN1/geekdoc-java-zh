  md: '# 12.4 Generalization and Inheritance


    Generalization can be used to show hierarchical relationship among classes in
    a model. It is a relationship between classes who have something common. Programming
    languages support generalization via the concept of inheritance. Child (derived)
    class obtains or shares features from parent (base) class.


    Generalization is the relationship between two classifiers, i.e., as class can
    inherit other object but an object cannot inherit other object. This relationship
    is also called ''is-a'' relationship. To get proper generalization, ''is-a'' relationship
    is required between generalized class and specialized class. Generalization is
    a relationship between general class and specific class. The specific class is
    called subclass or child or derived class. The general class is called super class
    or parent class. The subclass reuses properties and operations of super class.
    Public and protected members of super class are accessible in subclass. Private
    members are not available in subclass. Subclasses inherit super class and is inherited
    by subclass.


    Generalization is modeled as solid line from super class to general class with
    hollow triangle at super class side. Figure 22 shows an example of generalization.
    In Figure 22, Vehicle is super class (base class or general class or parent class)
    and Car, Bus, and Truck are subclasses (derived classes or specialized classes).


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_349_0.png)


    Figure 22: Example of Generalization


    # 12.5 Abstract Class


    Abstract class is a type of class that cannot have objects. It contains common
    attributes and behaviors of other classes. In class modeling, abstract classes
    are specified by abstract keyword. Abstract class has one or more methods specified
    as abstract. Abstract methods in abstract classes have only declarations and not
    definitions. Abstract methods are defined by more specialized or derived classes.


    Concrete class is exactly an opposite of abstract class. Concrete class is the
    default class. This means that concrete class can have direct instances. It can
    have abstract subclasses. A concrete class can usually be redefined into several
    subclasses. For a concrete class it is possible to create objects.


    Figure 23 shows an example of abstract class and concrete class.'
