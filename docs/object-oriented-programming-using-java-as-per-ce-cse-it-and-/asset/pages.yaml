    Now considering the example of the vehicle class, the following code snippet declares
    the object of the vehicle class:


    ```

    vehicle v;

    ```


    In the preceding code snippet, the v object is declared of the vehicle class.


    # 1.1.1.3 Data Hiding and Encapsulation


    The concept of wrapping data and functions into a single unit is known as encapsulation.
    It is a mechanism that binds classes members (variables and methods) together
    and prevents them from being accessed by other classes. The term, data hiding,
    implies that the data is not accessible by other classes and only the methods
    which are wrapped within the class access it. The methods that serve as a mediator
    over the object''s data and the program are known as member methods. Objects access
    data members of other objects via their methods. Figure 1 shows the concept of
    data hiding:


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_22_0.png)


    Figure 1: Displaying Data Hiding


    In Figure 1, the data members are hidden from the other classes, thereby they
    can only access the member methods.


    # 1.1.1.4 Data Abstraction


    The concept of representing important features without including the background
    details is known as abstraction. Abstraction is the mechanism by which we hide
    data that is not required by a user. The advantage of abstraction is that the
    user can work with the required data and does not need to view unwanted data.


    Let''s take the example of a car to understand the concept of abstraction. As
    the owner of the car, you must know how to drive it. This obviously implies that
    you know about the various components of the car and how to use them. For example,
    you know that the accelerator pedal is used to increase the speed of the car and
    pressing the brake pedal stops it. To perform these simple actions, you just need
    to know how to use these components, and not how they function. Similarly, in
    OOP, you need to know about the specific classes or methods that are implemented
    to implement program logic, without knowing how these classes or methods work.
    This concept is known as abstraction.'
