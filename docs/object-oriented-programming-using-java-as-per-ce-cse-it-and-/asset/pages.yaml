  md: '# Introduction to Object Orientation and Modeling Concepts ◀ 311


    +   - Modifiable: A model should be made in such a way that any change, if required,
    can be made easily.


    The advantages of modeling are given as follows:


    +   - Models capture and state system requirements and provide domain knowledge
    to all stakeholders.

    - Models can be used to explore multiple solutions and find the best one.

    - Models capture only the important aspects of the system under development and
    omit any unnecessary detail.


    # 11.5 The Three Models


    There are three main models that are used to represent a system. These are given
    as:


    +   - Class model

    - State model

    - Interaction model


    All these models are interlinked to represent the whole system.


    # 11.5.1 Class Model


    Class describes the static structure of classes and objects in a system. It also
    represents how these objects relate to each other. It also depicts dependencies
    between objects. Class diagrams, object diagrams, package diagrams, and component
    diagrams are used to create a class model.


    # 11.5.2 State Model


    State models are used to represent the dynamics of individual objects. Here, state
    represents the condition of an object during its life. When an object is in a
    particular state, it satisfies a certain condition, performs an action, and waits
    for a certain event. Each state represents the cumulative history of the object.
    A state model is a graph in which nodes are states and arcs are transitions between
    states caused by events.


    # 11.5.3 Interaction Model


    Interaction model represents how objects interact or cooperate with each other
    to perform some activity. Various models, such as case diagram, sequence diagram,
    and activity diagram, are used to prepare the interaction model of a system. A
    use case focuses on the functionality of a system, that is, what a system does
    for the users. A sequence diagram shows the objects that interact with other objects.
    It also shows the time sequence of their interactions. An activity diagram elaborates
    the important processing steps.'
