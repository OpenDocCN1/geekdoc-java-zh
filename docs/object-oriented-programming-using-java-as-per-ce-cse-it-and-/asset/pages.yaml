  md: '# 14.1.2 Relationships in Use Case Model


    In UML, there are three kinds of relationships between use cases:


    +   - Include Relationship

    - Extend Relationship

    - Generalizations Relationship


    # 14.1.2.1 Include Relationship


    An include relationship is a type of relationship that is extracted from a base
    use case to an inclusion use case. It specifies how the behaviors defined for
    the included use case are inserted explicitly into the behavior of the base use
    case. There can be multiple steps to carry out a single task. These multiple tasks
    can be divided into sub-functions and are denoted by the use cases. For example,
    payment for a product can be done by cash, credit card, or through cheque, as
    shown in Figure 3. Here, the mode of payment is explicitly inserted into the behavior
    of the base use case "Payment for Product."


    Include relationships are used to split a large use case into several small use
    cases in order to make it simple. It is also used to extract the common parts
    of two or more use cases into a separate use case.


    A large task may have multiple steps. In order to make it simple, it can be divided
    into sub functions. While designing a use case diagram the same procedures are
    followed. A large use case may have some behaviors that can be separated into
    smaller use cases to make them more manageable. This can be done with the help
    of include relationships.


    Include relationships are represented as a dotted arrow, as shown below:


    > <<include>>


    Let us understand the include relationship with the help of Figure 3:


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_373_0.png)


    **Figure 3:** Use case for payment of a product using include relationship'
