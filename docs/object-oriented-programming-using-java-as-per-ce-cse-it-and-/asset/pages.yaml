    # ## 1.1.1.7 Dynamic Binding


    The process of linking a method call to the executable code at runtime in response
    to the call is known as binding. The binding process exhibited is dynamic binding.
    This means that when a method is called, the method call is bound to the method
    body during the runtime of the program. The Java compiler is not aware of the
    method to be invoked during compilation; therefore, the JVM invokes the relevant
    method during runtime. Hence, this is also called runtime polymorphism or dynamic
    binding.


    # ## 1.1.1.8 Message Passing


    An OOP comprises a set of objects that communicate with each other. The following
    steps are involved in the process of programming in OOP:


    +   - Create classes that define objects and their behaviors

    - Create objects from class definitions

    - Establish communication among objects


    The one or more objects can communicate with one another by sending and receiving
    information. This process is similar to the way people pass messages to each other.
    A message for an object is a request for the execution of a method. Then, the
    method is invoked which provides the desired result. Message passing involves
    the name of the object, the name of the method, and the information to be sent.


    Now, after understanding the OOP concepts, let''s discuss the evolution of Java.


    # ## 1.2 Evolution of Java


    Java has inherited features from C and C++ programming languages, for example,
    it derives its syntax from C and many of its object-oriented features are influenced
    by C++. Here, we discuss the sequence of events and underlying factors that led
    to the evolution of Java.


    During the late 1970s and early 1980s, C became the most important and widely
    used computer programming language. Although C gained popularity, due to the increasing
    complexity in its programs, programmers started looking for better options. During
    this time, OOP became popular as it was used to manage and cut complex programs
    semi-autonomous units.


    # ## 1.2.1 Introducing Java


    The first version of Java was introduced in 1991 and was called Oak, instead of
    Java. The original idea for Oak was to create a platform-independent, OOP language.
    The driving inspiration behind Oak was to create something that could be used
    on all the computers.'
