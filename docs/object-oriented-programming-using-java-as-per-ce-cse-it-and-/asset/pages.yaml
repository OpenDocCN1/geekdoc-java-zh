    # 10.10 Understanding the URI Class


    The term URI stands for Uniform Resource Identifier. This class provides constructors
    for the URI instances to be created with the help of composing or parsing (analyzing)
    the string patterns to access the several components of an instance and methods
    for normalizing and judging the URI instances. Objects of this class are immutable,
    which means that the object is created, it cannot be modified.


    Every URL can be regarded as a URI, but not every URI is regarded as a URL. This
    is because of another subdivision of URI, Uniform Resource Names (URNs), which
    name the resources but not mention their location. The news and ISBN URIs are
    examples of URNs.


    A URL class instance specifies the syntactic components of a URL along with some
    of the information needed for accessing the resource that is described by it.


    A URL must always define a scheme, that it be absolute. A URI string follows this
    scheme for parsing. A stream handler is necessary for URL scheme, and without
    this, it is impossible to create a URL.


    # 10.10.1 URI Syntax and Components


    A URI reference (called URI) has a syntax [scheme]: scheme-specific-part [#fragment],
    where square brackets [.] denote elective components and the symbols : and # denote
    for themselves. An opaque URI is referred to as an absolute URI and its scheme-specific
    portion does not initiate with a scheme (''''). Opaque URIs cannot be parsed further.
    Examples of opaque URIs are:


    ```

    mailto:java-net@oracle.com

    mailto:java-net@java.sunrise.com

    comp:lang-java

    unurn:087149110x

    ```


    A hierarchical URI is either an absolute URI or a relative URI. In absolute URI,
    the scheme-specific part of hierarchical URI starts with a slash character, whereas
    in case of relative URI, the scheme is not specified. An instance of hierarchical
    URIs is:


    ```

    http://www.oracle.com/technet/java/java/8-compatibility-guide-

    2153666.html

    ```'
