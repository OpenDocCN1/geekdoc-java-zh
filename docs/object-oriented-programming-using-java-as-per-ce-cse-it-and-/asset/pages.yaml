  md: '# 10.7 Internet Addressing


    A computer accessing the Internet has a specific address, which is a number that
    uniquely finds each computer on the Internet. On the Internet, there is only one
    type of electronic address. Once we know someone''s Internet address, we can send
    mail, transfer files, a conversation, and find out information about that person.
    The address on the Internet is always referred to as an electronic address, which
    is of the form—a string followed by a @ (the “at” sign), which is further followed
    by the unique name of a computer.


    The part of the address mentioned after the @ character is known as domain. Each
    part of a domain is called a sub-domain, and they are separated by periods. For
    example, xyz@pccrn.co.uk.


    In the example, there are three sub-domains—pcrenn, co, and uk. You can understand
    a domain name by looking at the sub-domains, considering them from right to left.
    The name is created so that each sub-domain identifies the user about that. Top-level
    domain is the rightmost sub-domain. The top-level uk means the computer is in
    the United Kingdom. The next sub-domain refers to a name. Next, pccrenn tells
    about the user, that is, name of a specific computer.


    > Generally, only lowercase are used for Internet addresses. There is no need
    to mix uppercase letters. If an address has some of the letters in uppercase,
    it is always safe to change to lowercase.


    Internet addresses consist of 32-bit values organized as 8-bit values. IP addresses
    are represented by the dotted-decimal notation. In the dotted-decimal notation,
    each group of 8 bits is called an octet and is specified by its decimal equivalent,
    such as 192.167.134.12. Besides the IP addresses, a port must be used for accessing
    data from a computer over the Internet. For example, the port number for the Web
    protocol HTTP is 80. Port numbers are specified with a colon. For example, the
    HTTP service on a server whose IP address is 192.167.134.20 is 192.167.143.20.


    There are three classes for IP addressing—Inetaddress, In4address, and In6address.
    Inetaddress is either a 32-bit or 128-bit unsigned number used by IP. In4Address
    is provided for representing 32-bit IPv4address and 128-bit IPv6addresses. An
    IPv4address is represented by the form nnn.nnn.nnn.nnn, where n is an integer.
    In4address and In6Address are the subclasses of InetAddress, as shown in Figure
    1:


    | | InetAddress |

    |---||

    | | In4Address | In6Address |


    Figure 1: Subclasses of the InetAddress'
