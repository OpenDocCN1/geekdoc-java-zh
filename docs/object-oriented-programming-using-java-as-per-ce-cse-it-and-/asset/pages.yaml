  md: 'their own exceptions to be thrown in a Java program. These are known as user-defined

    exceptions. In this section, we will explore the types of exceptions in the following
    sub-headers:


    +   - Built-in Exceptions


    +   - User-defined or Custom Exceptions


    Let''s discuss them by one.


    # 6.4.4.1 Built-in Exceptions


    Built-in exceptions are exceptions that are already available in Java. These exceptions
    are

    thrown by the Java runtime system to explain the exception condition. Built-in
    exceptions are

    further categorized into the following types:


    +   - Checked Exceptions: The Checked exceptions are classes that are extended
    from the

    Exception class the RuntimeException class. The Checked exceptions must be

    caught using either of the implicit or explicit exception handling techniques.
    The

    compiler is able to detect the checked exceptions during compilation-time. Some
    of

    the examples of Checked exceptions are ClassNotFoundException, CloneNotSupportedException,
    and IllegalAccessException.


    +   - Unchecked Exceptions: The Unchecked exceptions are classes that are extended
    from

    t RuntimeException class. The compiler is not able to detect the unchecked

    exceptions at the time of compilation. The unchecked exceptions are not required
    to be

    caught using either of the implicit or explicit exception handling techniques.
    Some of

    the examples of Unchecked exceptions are ArrayOutOfBoundsException, ArithmeticException,
    and NullPointerException.


    Table 4 explains some commonly used built-in exceptions:


    | Exception | Description |

    | --- | --- |

    | ArithmeticException | Thrown when a problem in an arithmetic operation is noticed
    by the Java runtime system. For example, this exception is thrown when a number
    is divided by 0. |

    | ArrayOutOfBoundsException | When you try to access an array with an illegal
    index. Let''s say you have declared an array to store a maximum of 5 elements,
    while traversing the loop, you try to access the 6th element. In such a situation,
    this exception will be thrown. |

    | ClassNotFoundException | Thrown when you try to access a class, which is not
    defined in your Java program. |

    | FileNotFoundException | Thrown when you try to access a non-existing file or
    one that fails to open.'
