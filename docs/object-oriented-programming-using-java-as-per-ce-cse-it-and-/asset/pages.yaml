    # 3.1 Working with Arrays


    An array is a collection of data storage locations, each of which holds the same
    type of data. There can be a situation when you need to store similar types of
    values for a large number of data items. For example, to store telephone numbers
    of 50 persons, you normally would have to declare 50 variables each storing a
    number in it, which is not a correct approach and also very tedious and consuming.


    With arrays, we can declare a single variable that is capable of storing all 50
    numbers. The advantage of using arrays is that they simplify programming by replacing
    a number of statements with one or two statements. However, the size of an array
    cannot be modified. All the values stored in an array are considered elements.
    All the elements in an array are stored at a specific index number. An index number
    in an array starts with 0 and continues up to the size of an array. Its numbers
    will range from 0 to 4, that is, the 5th element will be accessed by the index
    number 4. See Figure 1, which explains indices in an array:


    | 1st index | | | | | 5th index |

    |---|---|---|---|---|n| 0 | 1 | 2 | 3 | 4 |


    ▲ Figure 1: An Array Showing Indices


    In Figure 1, you can see that the 0th element is showing the first index, while
    the 4th element is showing the 5th index. Let us discuss arrays under the following
    headings:


    +   * Using One-dimensional Array

    "* Using Multidimensional Array"


    Let us start studying arrays in the given sequence.


