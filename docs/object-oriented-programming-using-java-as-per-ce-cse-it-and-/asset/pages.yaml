    # 6.4.1 Understanding Exception and Error


    There are two types of errors in Java—compile-time and run-time errors. On the
    other hand, run-time errors occur due to situational problems in a program. For
    example occur due to certain conditions, such as memory failure, or file not found.
    Exceptions are events that occur during program execution and interrupt the flow
    of a program. Whenever an exception occurs, an object of the Exception class is
    created. It contains information about the exception, such as the type of exception
    and the state of the program when the exception occurred. After the object is
    created, it is thrown in the method that caused the exception. The Java runtime
    system searches for the exception handling techniques to handle the exception
    raised. If no exception handling technique is found, the Java runtime system searches
    the Java class in which the method raising exception is defined for exception
    handling techniques. In case, no technique is found to handle exceptions, the
    Java runtime system terminates and the program is interrupted. All types of exceptions
    come under the Exception class. Let''s discuss about the hierarchy of the Exception
    class in the following section.'
