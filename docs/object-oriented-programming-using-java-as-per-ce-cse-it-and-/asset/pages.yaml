  md: '# 2 Chapter 1


    # 1.1 Introducing Object-Oriented Programming


    Object-Oriented Programming (OOP) is a technique that allows you to implement
    the famous programming dictum: "divide and conquer". The idea behind OOP is to
    encapsulate private data and methods into objects, thereby making each object
    semi-autonomous.

    Now, let''s discuss some fundamental concepts in OOP.


    # 1.1.1 Explaining OOP Concepts


    The OOP provides basic concepts, which help in programming. Java, being an OOP
    language, implements and applies the concepts of OOP. The basic concepts of OOP
    are as:


    +   - Objects

    - Classes

    - Data Hiding and Encapsulation

    - Data Abstraction

    - Inheritance

    - Polymorphism

    - Dynamic Binding

    - Message Passing


    Now, let''s discuss each concept loop in detail.


    # 1.1.1.1 Objects


    Objects are the basic runtime entities in OOP. An object can represent a person,
    place, a bank account, or user-defined data such as vectors, lists, and collections.
    When a program is executed, the objects interact with each other by sending messages.
    For example, if employee and salary are two objects in a company program, the
    employee object may send a message to the salary object requesting the annual
    salary. Each object contains data and code to manipulate that data.


    OOP decomposing a problem into a number of entities known as objects and then
    the methods are invoked using the objects.


    # 1.1.1.2 Classes


    In OOP, classes provide a sort of template for objects. You use a class to create
    an object and then you can call the object''s methods from your code. In other
    words, objects are variables of type class. After defining a class, any number
    of objects belonging to that class can be declared.


    A class is a collection of objects of similar type. For example, car, bike, scooter
    are members of the vehicle class. The syntax for declaring an object of a class
    is:


    ```

    class_name object_name;

    ```'
