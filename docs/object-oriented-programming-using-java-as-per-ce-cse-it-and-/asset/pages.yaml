    ▲ Figure 19: A generic activity diagram


    In Figure 19, Activity B and Activity C are forks. This indicates that Activity
    B and Activity C are occurring at the same time.


    In a generic activity diagram, a join or branch is used to describe the activities
    that will take place based on certain conditions. All branches in a generic activity
    will merge to end the conditional behavior started by that branch. After merging,
    all parallel activities will be combined by a join before transitioning into the
    final activity state.


    # # 14.3.4 An Executable Activity Diagram


    In a complex process, an activity diagram can be used to show the progress of
    control during execution. In order to represent the execution of the activity,
    an activity token can be placed on the activity nodes. It can be removed and placed
    on the outgoing arrows when completing the activities. In a simple case, the activity
    token moves to the next activity. In multiple flow of execution, the activity
    token can be placed on one of the executing flow.


    If there are multiple outgoing arrows with conditions, the conditions in the multiple
    control flow are examined to determine the successor activity. Even if more than
    one condition is true, the successor activity will receive the token. If no condition
    is satisfied, the activity diagram is ill-formed.


    Multiple tokens can also be raised by concurrency. When an executing activity
    is followed by a concurrent split of control, the activity token is placed on
    each of the concurrent activities, and there will be an increase of tokens. There
    will be a decrease in the number of tokens when the control will merge, as tokens
    will migrate from input activities to'
  merge: -1
