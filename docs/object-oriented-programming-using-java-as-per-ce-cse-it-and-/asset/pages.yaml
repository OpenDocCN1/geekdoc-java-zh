    A simple state may have compartments. The compartments of the state are:


    +   - □ Name compartment


    +   - □ Internal activities compartment


    +   - □ Internal transitions compartment


    The name compartment holds the (optional) name of the state, as the string. States
    without names are called anonymous states and are all considered distinct (different)
    states. Name compartments should not be used if a name tab is used and vice versa.


    The internal activities compartment holds a list of internal actions or state
    (do) activities (behaviors) that are performed while the element is in that state.
    The activity label identifies the circumstances under which the behavior specified
    by the activity expression will be invoked.


    Several labels are reserved for special purposes and cannot be used as event names.
    The following are the reserved activity labels:


    +   - □ Entry (actions on the entry of state)


    +   - □ Do (actions performed while in the state)


    +   - □ Exit (actions on the exit of state)


    The basic syntax for the internal activities compartment is:


