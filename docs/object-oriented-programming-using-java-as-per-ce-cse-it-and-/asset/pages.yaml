    # 12.6 Multiple Inheritance


    When a class is derived from two or more base classes, it is known as multiple
    inheritance. If a child class has more than one parent, then its features contain
    the union of the features from all of its parents.


    Advantage of multiple inheritance is that it permits private inheritance. It is
    closer to the real world.


    Figure 24 shows an example of multiple inheritance. Here, class Consultant Manager
    has two parent classes: Consultant and Manager.


