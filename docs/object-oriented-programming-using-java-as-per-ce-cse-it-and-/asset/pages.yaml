    # Summary


    This chapter first discussed about networking. It discussed about networking enhancements
    in Java SE8. Next, you learned about client server networking. It has also explained
    proxy servers and DNS. Further, it discussed about networking interfaces and classes
    in the java.net package. Next, it explained Internet addressing and the concept
    of sockets in Java. In the end, it discussed URL class, URI class, and datagrams.


    # Key Terms


    +   * Networking: Refers to interconnection of computers

    * Clients: Refers to those computers on which users run their applications

    * Proxy server: Refers to the server that acts as a bridge between the client
    application, such as a Web browser, and a real server

    * Unicast: Refers to an identifier for a single interface

    * Multicast: Refers to the class that provides the efficiency of caching successful
    as well as unsuccessful resolutions of host name

    * Factory methods: Refer to those methods where static methods in a class return
    an instance of class

    * Socket: Refers to an IP Port on a specific host machine


