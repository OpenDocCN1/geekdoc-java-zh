    \n▲ Figure 13: Output of the AppCal Program\n\n# 4.6 Working with Abstract Class\n\
    \nWhile writing a class, you may find cases where you can only provide general\
    \ code, and it is up to the developer who subclasses your class to customize it.\
    \ To make sure that the developer custom your class, you can make the method abstract,\
    \ which means the developer will have to override your method; otherwise, Java\
    \ will complain. To make a method abstract, use the abstract keyword. If you make\
    \ any methods in a class abstract, you also have to make the class itself abstract\
    \ as well.\n\nHere is an example. We'll create a class A that has a method print(),\
    \ which prints out a string, and gets the string to print by calling a method\
    \ getData():\n\n```\nclass A {\n    String getData(); public void print() {\n\
    \        System.out.println(getData());\n    }\n}\n```\n\nNote that there is no\
    \ implementation of the getData() method because we want developers to specify\
    \ what data they want to print out. To know that they must provide an implementation\
    \ of the getData() method, we can make the method abstract, which means we must\
    \ make the class itself abstract as well, as shown in Listing 14:\n\n+   ▶ Listing\
    \ 14: Implementing an Abstract Class\n\n```\nclass A {\n    abstract String getData();\n\
    \    public void print() { System.out.println(getData()); }\n}\n\n//Now, when\
    \ we subclass A, we have to provide an implementation of\ngetData() like this:\n\
    class B extends A {\n    String getData() { return \"Hello from Java!\"; }\n}\n\
    \n//Here's how we can put the subclass to work (note that an abstract class\n\
    cannot be instantiated directly):\n    public class AppAbs {\n        public static\
    \ void main(String[] args) { B b1 = new B();\n        b1.print(); \n    }\n}\n\
    ```"
