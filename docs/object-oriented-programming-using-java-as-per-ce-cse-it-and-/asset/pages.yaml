  md: '# 6.4.3 Handling Multiple Exceptions


    So far, you have learned using only one catch block to handle exceptions and Exception,
    the super class of exceptions to perform exception handling. However, there are
    many exception classes and subclasses, and remembering all of them is not easy.
    You may forget to include some exceptions in the catch classes that may lead to
    program interruption or termination. For example, the RuntimeException has multiple
    subclasses, but you may be familiar with only the ArithmeticException and NullPointerException
    subclasses. Let''s imagine that a program runs many exceptions, but you have used
    the ArithmeticException and NullPointerException subclasses to handle the raised
    exceptions. Now, the question asks—what will happen if any other exception is
    raised? In such case, your program gets interrupted. To avoid the interruption,
    use the Exception class in the last catch block so that all remaining exceptions
    can be handled. The Exception class must be used in the last catch block; otherwise,
    an error will occur during compilation because a super class cannot be used before
    a subclass.


    Multiple exception handlers can be used by multiple catch blocks for a try block.
    If an exception is raised by multiple catch blocks, the Java runtime system first
    looks for the exception handler with the specified exception class. If it is not
    found then the search continues for a superclass. Figure 15 shows the flow structure
    of handling exceptions using multiple try-catch blocks:


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_184_0.png)


    ▲ Figure 15: Flow Structure of Multiple try-catch Blocks'
