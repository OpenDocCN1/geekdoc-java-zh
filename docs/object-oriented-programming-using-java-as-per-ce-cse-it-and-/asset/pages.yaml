    # 12.2.7 Association Class


    An association class is used to model an association as a class. Association classes
    often occur in many-to-one and many-to-many associations where the association
    itself has attributes.

    As example, consider a many-to-many association between classes, Person, and Company.
    The association could be shown as Employment class with properties such as salary,
    period, etc. In this case, the association could be modeled better as an association
    class with attributes rather than trying to fold the attributes into one of the
    classes in the association.


    Some important points about association classes are as follows:


    +   - Same class cannot be attached to more than one association.

    - The name of association can be omitted because it is same as association class
    name.

