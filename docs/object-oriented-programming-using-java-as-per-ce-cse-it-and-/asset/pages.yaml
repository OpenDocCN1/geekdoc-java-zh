- img_proc: true
  md: '# Chapter 14


    In order to make the interaction simple, a use case model depicts a subset of
    the model. For a particular model, there can be several use case diagrams where
    each diagram can show a subset of the model elements that are applicable to a
    specific purpose. The use case diagram is a graphical view that can involve an
    actor, use, and their interactions. The overall functionality of a system is in
    a use case diagram. One advantage of the use case diagram is that anyone interested
    in the system can view the diagram and understand what the system is supposed
    to do.


    Thus, use case models are techniques that describe the functional requirements
    of a system. It works by explaining the interactions between the users of a system
    and the system itself. It then explains how a system is used.


    # 14.1.1 Elements of Use Case Model


    In a use case model, there are a number of model elements. The following are the
    basic use case elements:


    +   Actor: An actor specifies a role played by an external entity (user or any
    other system) that interacts with the subject. The term “role” means some services
    expected from the subject that is modeled with the associated use case. Whenever
    any external entity interacts with the system, the external entity plays the role
    of a specific actor. Single entity may have different roles and a specific role
    may be played by a single or multiple instances. For example, an actor may be
    a salesperson, manager, support person, or Web store system. In cases, it may
    be possible that the same person may be a salesperson and he may also provide
    support. Thus, it should be noted when creating a use case diagram, we should
    not be concerned with the individual but the roles played by the individuals.
    All actors must have a name. Examples of an actor are customer, client, teacher,
    student, passenger, payment system. In a use case diagram, an actor is shown as
    a “stick man” icon. The name of the actor should appear above or below the system
    boundary. Capitalization should always be used to name an actor and the names
    of an abstract actor should be in italics. An abstract actor represents shared
    common behavior between two or more actors. The properties of an actor include
    the actor’s name and a brief description. Figure 1 shows an actor named “Teacher”.


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_371_0.png)


    Figure 1: An actor in a use case diagram


    > An actor is external to the subject and so an actor is generally defined in
    the same classifier or package that includes the subject.


    +   Use Cases: In a use case diagram, a use case represents functionality in a
    system. A use case is used to describe the interaction case may include anything
    that is within the system.'
