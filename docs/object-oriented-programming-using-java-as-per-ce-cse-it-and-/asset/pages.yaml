  md: '# Descriptive Questions


    Q1. What do you mean by a stream?


    Ans. In Java, stream I/O is based on the InputStream, OutputStream, Reader, and
    Writer classes. InputStream and OutputStream are used for byte-oriented streams
    (as you work with binary files), and Reader and Writer classes are applied to
    character-oriented streams (as you work with text files). You do not use these
    classes directly; instead, derive classes from them. In fact, Java has already
    done a lot of that for you, so much there are dozens of classes to work with.


    Typically, you use a stream class''s constructor to create a stream. The streams
    are usually divided into input and output streams, so you select the one that
    is appropriate. After you have a stream object, you can use its methods—typically,
    read() and write()to transfer the data. When you are done with the stream object,
    use its close() method to close it and end your work with the data source.


    Q2. Explain charsets and selectors in NIO.


    Ans. Apart from buffers and channels, NIO supports two more entities. These are
    charsets and selectors. A charset allows mapping of bytes to characters. An encoder
    encodes a sequence of characters into bytes, while a decoder decodes a sequence
    of bytes into characters. The classes defined in the java.nio.charset package
    support charset, encoders, and decoders.


    Selectors allow you to execute I/O operations through multiple channels. The classes
    defined in the java.nio.channels package support selectors. There are three sets
    of keys maintained by a selector—selection-key, selected-key, and cancelled-key.
    Each time a channel is registered with a selector, a selection key is created.
    This encapsulates two operation sets—Interest Set and Ready Set.


    Q3. What do you mean by the InputStream class? Describe any five methods of this
    class.


    Ans. The InputStream is an abstract class that defines Java''s model of bytes
    input. All the methods of this class will throw an IOException.


    The five methods of the InputStream class are described as:


    +   - int available(): It gets the number of bytes that can be read from this
    input stream.

    - void close(): It closes this stream.

    - void mark(int readlimit): It marks the current position in this input stream.

    - boolean markSupported(): It returns true if this input stream supports the mark()
    and reset() methods.

    - abstract int read(): It reads the next byte of data from the input stream.'
