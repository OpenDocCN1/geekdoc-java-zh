  md: "# 3.4 Using Command Line Arguments\n\nThe command line arguments are those\
    \ arguments that are passed to a program at the time of its execution. Accessing\
    \ command line arguments inside a Java program is very simple, as they are stored\
    \ in String array passed to the args parameter of the main() method. Consider\
    \ the following List 11:\n\n+   Listing 11: Using the Command Line Arguments\n\
    \n```\nclass CmdLineExample{\n    public static void main(String args[]){\n  \
    \      System.out.println(\"Your first argument is: \"+args[0]);\n        System.out.println(\"\
    Your second argument is: \"+args[1]);\n    }\n}\n```\n\nWhat's happening here\
    \ is we are creating a method in the CmdLineExample class. A method in OOP is\
    \ like a function or subroutine in standard programming–block of code that you\
    \ can pass control to and can return a value. Methods provide handy ways of wrapping\
    \ code into a single functional unit; when you call the method, the JVM executes\
    \ the code in the method.\n\nHere, the idea is we are creating a method named\
    \ main, which is what the JVM will look for when it starts an application. When\
    \ it finds the main method, the JVM passes control to it, and we will place the\
    \ code we want to execute in this method's code block.\n\nThere are few things\
    \ to note before continuing: The main method must be declared with the public\
    \ access specifier, which means it may be outside its class. It must be declared\
    \ static which means main is a class method, not an object method. It must not\
    \ return a value when it has finished execution, which is why we use the keyword\
    \ void in this code (other words, a return value of type void means there is actually\
    \ no return value). Finally, note the argument list in the parentheses following\
    \ the main word: String[] args to indicate what values are passed to the method\
    \ and can be used by the code in this method. In this case, we are indicating\
    \ that main has passed an array of string values called args. These string hold\
    \ the values passed from the command line when you start the application; for\
    \ example, if you type java CmdLineExample Hello there,\"Hello\" and \"there\"\
    \ would be the two strings in the array. The output of List 11 is shown in Figure\
    \ 13:\n\n![](img/4f531a2e69cb8c7a51fb7463c748ad72_96_0.png)\n\n+   Figure 13:\
    \ The output of CmdLineExample Class"
