    # 14.1.4 Guidelines for Use Case Model


    While constructing the use case model, the following guidelines should be followed:


    +   1. The first step in designing a use case model is to determine the system
    boundary. It is not possible to decide the actor and use cases without determining
    the system boundary.


    +   2. The actor must be defined with respect to the system, and the actors must
    have a definite purpose for interaction with the system.


    +   3. The use case must provide value to the users. In any case, the use case
    must not be too wide or too narrow.


    +   4. Each actor must be associated with at least one use case, and the use case
    must also be co-related with at least one actor.


    +   5. The use case must be designed from the user''s point of view and the functionalities
    should be arranged accordingly.'
