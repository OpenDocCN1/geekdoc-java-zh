  md: 'In the Java programming language, a program can have more than one thread,
    where each thread has its own path of execution. All the threads in a program
    share the same address space, data, and code in a program; therefore, threads
    are considered lightweight processes. Threads in Java are objects that have all
    the characteristics of an object, such as member data and methods. You can create
