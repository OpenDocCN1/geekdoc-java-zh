    create any thread in a Java program, the main thread is always created. Let''s
    discuss the main thread in the following section.


    # 7.2.1 The Main Thread


    During the execution of a program, the Java Virtual Machine (JVM) creates a user
    thread automatically to execute the main() method, which is called the main thread.
    If any other thread is not created in the program, the main thread terminates
    after the main() method finishes its execution. Apart from the main thread, a
    Java program can also have child threads. The threads created with the Help Thread
    are known as the child threads. Apart from the main thread, all the threads created
    in the program inherit the user status of the main thread. In this case, if the
    main() method terminates, the program keeps running until the user threads finish
    their execution.


    Let''s now discuss how threads are created and used. A thread can be created in
    Java in the following ways:


    +   - Extending the java.lang.Thread Class


    +   - Implementing the java.lang.Runnable Interface


    Let''s discuss these ways in detail.


    # 7.2.2 Extending the Thread Class


    Threads can be created in a Java program by extending the Thread class. This is
    the simplest form of creating threads in a program. Some of the important factors
    to keep in mind while creating threads in this way are:


    +   - The class that extends the Thread class overrides the run() method in which
    the code executed by the thread is defined


    +   - The constructor of the Thread class may be called explicitly in the constructor
    of the class, extending it by using the super keyword to initialize the thread


    +   - The class extending the Thread class invokes the start() method inherited
    from the Thread class to make the thread eligible for running'
