    # 7.5.3 Thread Scheduler


    The component of the JVM that decides the order in which threads are executed
    is called the thread scheduler. A system with a single processor, when executing
    a program, executes only a single thread at a particular point even though the
    program may have multiple threads. This means that if there are multiple active
    threads, the resources are allocated only to the thread that is executing. The
    thread scheduler selects a thread for execution from the runnable pool and sends
    back the executing thread to the pool depending on the priority of the thread
    and the code inside the run() method of the thread.


    In a Java program, you need not write explicit code to control the thread scheduler
    as it is the part of JVM. In most cases, the thread scheduler maps a thread of
    your program to the thread of the operating system of your machine. You cannot
    control the sequence of thread execution; rather, you can invoke methods of the
    Thread class to influence the thread scheduler. Now, let''s discuss the methods
    that can affect the activities of the thread scheduler.


