  md: '# Working with Arrays, Strings,

    StringBuffer Class, and Wrapper Classes


    # OBJECTIVES


    +   - Working with arrays

    - Working with strings

    - Explaining the StringBuffer class

    - Discussing command line arguments

    - Explaining the Wrapper classes


    As a Java programmer, you may need to create programs to process information of
    similar types. For example, you have to create a program to store the roll numbers
    of 25 students from a class. All the roll numbers are of numeric type; therefore,
    they should be stored in integer data type. Now, you declare 25 variables to store
    25 roll numbers. Declaring and remembering a large number of variables are tedious
    tasks. To get rid of this hectic work, Java provides arrays. Using arrays, you
    can use just a single variable to store large numbers of elements of the same
    data type. However, you cannot delete the elements stored in an array. You have
    to define the size of the array while creating it. Therefore, you can only store
    the total number of elements equal to the size of the array. You cannot add elements
    beyond the size of the array. In case you have to add more elements to an array,
    you have create another array. For managing two or more arrays, Java provides
    the Vector class, which is used to create an object similar to an array. The object
    created using the Vector class is dynamic, that the object size is automatically
    increased during runtime to store additional elements.


    In Java, primitive values such as int, char, and byte cannot be put into a collection
    because collection can only hold object references. Therefore, to put primitive
    values into a collection, they must be converted into objects. Java provides Wrapper
    classes to convert primitive values into objects. Apart from Wrapper classes,
    Java also provides String and StringBuffer classes that are used to handle text
    strings.'
