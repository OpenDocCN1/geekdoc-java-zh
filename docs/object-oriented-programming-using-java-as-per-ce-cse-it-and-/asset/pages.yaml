    # 14.3.5 Guidelines for Activity Model


    While constructing an activity model, the following guidelines should be followed:


    +   1. The activity diagram should be used appropriately as it is used to study
    the algorithms and workflow of the system.

    2. In an activity diagram, consistent levels of details should be drawn. For any
    additional details, a separate activity diagram should be drawn.

    3. The branches and conditions should be handled carefully. If there are many
    conditions, then at least one condition should be satisfied when the activity
    completes.

    4. The concurrent activities should be handled carefully. All concurrent activities
    should be completed before merging into a single activity.

    5. An executable activity diagram should be designed because it helps the user
    to understand the process of execution of the system. An executable activity diagram
    helps us to understand the system in a better manner.


    # 14.4 Collaboration Diagram


    A collaboration diagram is also called a communication diagram. It is an interaction
    diagram that emphasizes the structural organization of the object.


    The main function of a collaboration diagram is to capture the interaction among
    the objects and the structural relationships among the objects involved in the
    interaction. It also helps to determine the links between the objects and the
    messages passed between the objects.


    Figure 20 shows the functions of a collaboration diagram:


    | Collaboration Diagram |

    |---|---||

    | Objects participating in the interaction | Links between the objects | Messages
    passed between the objects |


    ▲ Figure 20: Functions of a collaboration diagram


    Unlike a sequence diagram, a collaboration diagram shows the interaction between
    the classes of a given use case that is not arranged by a time sequence. A collaboration
    diagram generally looks like a graph or network. However, there are no particular
    rules to organize objects graphically. The objects can be placed anywhere on the
    graph.'
