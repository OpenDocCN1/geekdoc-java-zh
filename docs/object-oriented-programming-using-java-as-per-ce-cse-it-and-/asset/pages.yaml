  md: '# 11.3.1 Abstraction


    Abstraction means to focus on important features of the system and ignore some
    extraneous details. It is a process that allows representing a complex problem
    in a simpler way by considering only the important and relevant aspects while
    ignoring the irrelevant details. It not only helps in understanding a complex
    problem but also helps in comprehension of system design. Thus, an abstraction
    is a powerful methodology used to manage complex systems.


    Some examples of abstraction are given as follows:


    +   - When a class Student is designed, the attributes such as enrollment number,
    name, course, and address are included. On the other hand, characteristics such
    as height and blood group are eliminated, as they are irrelevant with respect
    to an educational institution.

    - When we make a phone call, we focus on calling and ignore how the call is connected
    or how the call is dialed.


    # 11.3.2 Encapsulation


    Encapsulation is the process of binding data members and methods in a class. Information
    hiding is the principle of concealing internal data and procedures. Encapsulation
    hides the internal details of a class so that it cannot be accessed from outside
    only through the interface provided by the class. It protects data members through
    the mechanism of access modifiers, such as public, private, and protected. It
    is used for wrapping of data and function together. It is also known as data hiding.


    For example, when electric fitting is done, the electrician encapsulates all mission
    of wires and circuits only leaves the switches exposed to the users. All functionality
    is hidden inside the ON/OFF methods of the switches. Figure 2 shows the process
    of encapsulation:


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_328_0.png)


    ▲ Figure 2: Encapsulation'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# 11.3.3 Modularity


    Modular design is the concept of decomposing a system into a set of subsystems
    called modules. It reduces the overall complexity of the problem. Modularity is
    the property of a system by which it can be decomposed into cohesive and loosely
    coupled modules. Modules are independently created so they are more reusable.


    Figure 3 shows a module design of the student management system:


    ![](img/4f531a2e69cb8c7a51fb7463c748ad72_329_0.png)


    ▲ Figure 3: Module Design of a Student Management System


    # 11.3.4 Synergy


    Synergy can be defined as two or more agents that work together to produce a result
    that may not be obtained by any of the independent agents. Abstraction, encapsulation,
    and modularity work independently and are used in isolation, but together they
    complement each other synergistically. Thus, synergy is beneficial to object orientation
    approach.


    # 11.4 Concepts of Modeling and Modeling as a Design Technique


    Many times software projects fail because of various reasons, such as poor documentation,
    improper requirement analysis, incorrect development methodology, etc. Modeling
    provides a way to graphically represent a system that is under development. Modeling
    helps to visualize, specify, and construct a complex system. Modeling of a system
    describes the structure and behavior of the system. Languages such as the Unified
    Modeling Language (UML) are used for modeling a software system. Modeling is an
    abstraction of something for the purpose of understanding it before building it.


    The important characteristics of a model are given as follows:


    +   * **Accuracy**: A model must describe a system precisely and correctly.

    * **Understandable**: A model should be so simple that all stakeholders can communicate
    with each other.

    * **Consistency**: Different views and models must not contain things that conflict
    with each other.'
