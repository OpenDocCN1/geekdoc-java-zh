  md: "# Working with Packages and Exceptions\n\nuse of this feature can make your\
    \ program unreachable and difficult to maintain, creating problems with the namespace\
    \ of all the static members you.\n\n# 6.1.4.1 Importing Static Members\n\nIn a\
