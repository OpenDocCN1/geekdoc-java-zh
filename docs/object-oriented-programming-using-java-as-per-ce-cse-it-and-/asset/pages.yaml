  md: '# 344 ► Chapter 13


    Such changes occur through the following four types of transition:


    +   1. **Entry Transition:** This is used when we want to perform some action
    while entering into a state. The entry keyword used to specify entry transition
    is as follows:


    `entry/action`


    +   2. **Exit Transition:** This is used when we want to perform some action while
    exiting from a state. The exit keyword used to specify exit transition is as follows:


    `exit/action`


    +   3. **Internal Transition:** This is used to handle events without leaving
    a state. An internal transition represents the reaction to an event that triggers
    an activity. It executes without exiting or re-entering the state. Internal transitions
    are modeled within states.


    +   4. **External Transition:** An external transition is a transition that changes
    the active state. It is the most common kind of transition. It is drawn as an
    arrow from the source state to the target state, with other properties shown as
    a text string attached to the arrow. The syntax of external transition is as follows:


    e(a:T) [guard condition] / effect


    # 13.4 State Diagram


    A state diagram models the dynamic behavior of individual classes or any other
    objects. During its life cycle, an object receives number of events, and in response
    to those events, object is changed.


    There are two types of state machine diagrams:


    +   - Behavioral

    - Protocol


    Behavioral state machine diagram models the life cycle of an object or subsystems.
    It specifies states of object and how state change based on events received by
    an object.

    Protocol state machine diagram is used to express possible transitions that may
    occur in abstract classifiers as interfaces and packages.


    A state diagram depicts the data and behavior of a single object throughout its
    lifetime. It contains the following:


    +   - Set of states (including start and end state)

    - Transitions between states


    Entire diagram is drawn from large and complex objects with a long lifespan. State
    diagrams are also used for Domain ("model") objects. But, they are not useful
    to draw state diagrams for every class in the system.'
