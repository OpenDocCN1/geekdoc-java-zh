  md: 'For example, consider an example of the railway reservation system, where two
    passengers are trying to reserve seats from Delhi to Mumbai in Rajhani Express
    from two different locations. Although the passengers are at different locations,
    they have access to the same railway reservation system. Now, let''s suppose that
    both passengers start their reservation process at 1 pm and observe that two seats
    are available. The first passenger reserves these two seats and simultaneously
    the second passenger reserves one seat. Now, the available numbers of seats two
    and the reserved seats are three. This leads to inconsistency due to the asynchronous
    access to the railway reservation system. In this scenario, both passengers can
    be considered as two threads, and the reservation system can be considered as
    a single object, which is modified by these two threads asynchronously.


    This problem of inconsistency is known as the race condition, in which multiple
    threads access the same object and modify the object state inconsistently. The
    solution to this problem is to provide a mechanism in which, if one thread is
    modifying an object''s state, the other thread does not have access of the same
    object at that point of time. In other words, the modification of the state of
    an object must be synchronized and atomic.


    # 7.6.1 Locks


    Synchronization of code in a Java program is done with the help of locks. Every
    object in the Java programming language has a default object lock, which can be
    used for synchronization. Threads gain access to a shared object of program by
    first acquiring the lock associated with it. After a thread acquires the lock
    associated with an object, other threads are prevented from acquiring the lock
    associated with the object at that point of time. This guarantees that only one
    thread may modify the state of the object at a time. The Object lock, also known
    as monitor, allows only one thread to use the shared resources at a time. In this
    way, the lock implements mutual exclusion.


    In Java, the access to the shared resources (objects) is synchronized by the object
    lock mechanism. The rules that need to be followed when synchronizing shared resources
    are:


    +   - A thread must acquire the object lock associated with a shared object before
    it uses the shared object. The runtime system ensures that if a thread has the
    lock of the shared object, it will not allow another thread to access the shared
    object. If a thread needs to access the shared resource at the same time, it is
    blocked and has to wait until the resource becomes available.


    +   - When a thread completes its execution and finishes modifying the shared
    resource, the runtime system ensures the lock of the shared resource has been
    relinquished by the thread using the resource. The resource is then assigned to
    the thread waiting for it.


    +   - Methods or blocks can be synchronized, but not variables or classes.


    +   - Only one lock is associated with each object/shared resource.


    In Java, code synchronization can be achieved in the following two ways:


    +   - Synchronized Methods'
