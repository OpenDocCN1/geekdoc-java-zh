    # 11.6 Relationship among the Models


    Class model generally describes the static view of a system. It contains various
    class diagrams. Each class contains member variables and functions. State diagram
    represents the states of various objects in a system. The state of an object at
    any point in time contains values of member variables. It also contains a state
    transition diagram to represent the object changes from one state to another.
    Transition of an object from one state to another depends on the current values
    of object member variables and the event occurred. Events in the state diagram
    are closely related to methods in a class diagram. Similarly, interaction model
    represents how objects interact with each other. Interaction among objects occurs
    by various events (calling methods) and state changes, that changes in data values
    of member variables.


