    Inheritance is one of the most important features of Object-Oriented Programming
    (OOP). It facilitates the creation of a new class by extending a previously declared
    class. The class that is used to create a new class is called a base class, superclass,
    or parent class, and the newly created class is called a subclass, child class,
    or derived class. The process of creating a derived class from a base class is
    called inheritance.


    On the other hand, Java provides interface that can be considered similar to an
    abstract class. An interface does not contain implementation of any method and
    is therefore considered abstract. Unlike an interface, an abstract class can define
    both abstract and non-abstract methods.


    This chapter introduces to the various forms of inheritance in Java. Next, it
    discusses constructors in inheritance and the forms of inheritance. It explains
    the concept of final keyword. Then, it discusses the interfaces in Java, including
    their definition and implementation, and explains how to extend interfaces and
    access interface variables. Finally, the chapter discusses dynamic method dispatch
    and Java object class.


