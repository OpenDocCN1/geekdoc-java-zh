    # 3.2.1 Defining the String Class


    In Java, we have int to store integers, float to floating point numbers, and so
    on, but there is no primitive type to store the string data. To handle string
    data in Java, we require objects of the String class. The String class is included
    in the java.lang package. which we can use without importing any package. We use
    the following code snippet to create and initialize a String object:


    ```

    string str = "Hello";

    ```


    The preceding code snippet creates a String object str and initializes it with
    the value Hello. You can also assign the value of a String object to another String
    object. See the following code snippet to assign the value of a String object
    to another String object:


    ```

    string str1="Now";

    string str2="Are";

    str1=str2; // now the str contains the value Are

    ```


    # 3.2 Operations on String


    The String class is enormously powerful, with methods that enable you to convert
    a string into a character array, convert numbers into strings, search strings,
    create substrings, change the case of string, get a string length, compare strings,
    and much more.


    # 3.2.2.1 Implementing Strings Concatenation


    In Java, a string can be concatenated with other strings or the elements of other
    data types, such as integers or floats. You may need to concatenate two strings
    or more strings with a number or symbol to display information as per requirement.
    For example, when you fill any online registration form, you provide your first
    name, middle name (if any), and last name in three separate columns. However,
    when you have finished and submitted the form, you show your complete name as
    a single string on the form.


    # Concatenation of Strings


    Two or more strings in Java are concatenated using the concatenation operator
    +. See the following code snippet in which two strings "Hello" and "World" are
    concatenated to form a single string HelloWorld.'
