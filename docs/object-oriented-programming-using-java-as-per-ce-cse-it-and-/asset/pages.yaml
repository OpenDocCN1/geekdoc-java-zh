    URI comprises a path that can be empty and a scheme-specific part that might contain
    any of the other components.


    # 10.1 Working with Datagrams


    It is not always necessary to have a guaranteed point-to-point channel by TCP-based
    protocols because some applications might prefer to have independent packages
    of information which need confirmation of its arrival or any sort of guarantee.
    Here comes the time of action for UDP protocol sends small packages of data Datagrams
    in order to transfer data from one to the other.


    The DatagramPacket and DatagramSocket classes available in the java.net package
    are for implementing system-independent datagram communication through UDP.


    In words, Java implements Datagrams on top of the UDP protocol by using these
    two classes. The object of the DatagramPacket class is the data container, and
    the DatagramSocket class is used for sending or receiving the DatagramPacket.


    # 10.1.1 Understanding the DatagramSocket Class


    As discussed earlier, the DatagramSocket class is used to send and receive datagram
    packets using sockets. A datagram socket acts as a sending or receiving point
    for a packet'
