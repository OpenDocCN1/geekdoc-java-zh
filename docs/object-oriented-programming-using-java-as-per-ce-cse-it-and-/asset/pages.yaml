    # 10.3 Client-Server Networking


    The relationship between two computer programs in one program, the client, makes
    a service request from another program, the server, which fulfills the request
    is self-explanatory to discriminate between the client from the server. A network
    architecture comprises clients and servers among which communication occurs. A
    server is a powerful computer that manages disk drives (file servers), printers
    (print servers), or network traffic (network servers), whereas clients are those
    computers which users run their applications. Clients depend on various resources,
    such as files, devices, and even processing power.


    The client server model is preferred for distributed systems where the systems
    are at several locations.


    For example, cash withdrawal from an ATM machine uses the concept of client server
    model. The customer requests to the ATM machine for cash from his/her account;
    the ATM forwards the request from the user to the bank, and after verification
    (through its database) from the bank, the bank sends approval to the ATM. Further,
    the ATM responds back by providing the cash according to instructions given in
    the field of amount. It automatically generates the receipt if the user asks for
    it and deducts the amount from the customer''s account.


    # 10.4 Proxy Servers


    Generally, a proxy server can be viewed as a bridge between the client applications,
    such as a Web browser, and a real server. It gets and gathers all requests from
    the real server to view if'
