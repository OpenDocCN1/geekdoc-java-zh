    \ invoke the sum() with float parameter and display 36.0 as the result.\n\n# 4.5\
    \ Recursion in Java\n\nEach time you call a method in Java, Java allocates new\
    \ space on its internal stack for all the variables in the method, which means\
    \ there is no reason you can't call the same method again—a new set of variables\
    \ will be allocated on the stack automatically. Recursion is a technique in which\
    \ a method can call itself.\n\nThe classic recursion example is to calculate a\
    \ factorial, so we'll implement it here. The factorial of a positive integer n\
    \ can be calculated as follows:\n\n```\nn! = n * (n - 1) * (n - 2) ... * 2 * 1\n\
    ```\n\nThis process lends itself to recursion easily each stage of the recursion\
    \ can calculate one multiplication in it multiplies the number by the factorial\
    \ of the number minus 1. When the number has finally reduced to 1 through successive\
    \ calls, the method simply returns and comes back through the successive stages,\
    \ performing multiplication at each stage until all nested calls have returned\
    \ and you have the factorial.\n\n+   Listing 13: Calculating Factorial Using Recursion\n\
    \n```\nclass calculator {\n    public int factorial(int n) {\n        if (n ==\
    \ 1) { return n; }\n        else { return n * factorial(n - 1); }\n    }\n}\n\
    public class App {\n    public static void main(String[] args) {\n        calculator\
    \ calc = new calculator();\n        System.out.println(\"6! = \" + calc.factorial(6));\n\
    \    }\n}\n```"
