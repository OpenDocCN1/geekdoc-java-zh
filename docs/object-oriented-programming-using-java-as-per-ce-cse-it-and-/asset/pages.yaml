    # Descriptive Questions


    Q1. Explain class variable.

    Ans. Variables are declared inside a class as its member with a static modifier.
    They are associated with class and only one memory space is allocated for all
    the objects of that class. In other words, value of the class variable is shared
    by all the objects of that class. Class variables are available in the program
    till the existence of their associated class.


    Q2. Describe non-static nested class.

    Ans. A normal nested class declared without using the static keyword is called
    a non-static nested class. It is also called an inner class. The non-static nested
    class can access the instance variable of the enclosing class directly without
    instantiating it. Therefore, you can conclude that the non-static nested class
    is fully within the scope of the enclosing class.


    Q3. What is call by reference?

    Ans. When you pass the object reference to the methods as its parameter, such
    method invocations are called call by reference. In call by reference, objects
    are passed as the method parameter. Any change to the dummy parameter is also
    reflected in the actual parameter because both the actual and dummy parameters
    refer to the same object.


    Q4. Explain method overloading.

    Ans. Method overloading is an object-oriented technique that allows you to define
    several versions of a method with the same name, but each with a different parameter
    list. When you use an overloaded method, the Java compiler decides which method
    is to be invoked by the number and/or types of the parameters you pass to the
    method.


    Q5. What are constructors? What are the points to remember while working constructors?

    Ans. Constructors are a special type of methods having the same name as the class
    name; for example, if a class carries a name Demo, then the constructor will also
    have the name Demo. Constructors are syntactically similar to methods and used'
