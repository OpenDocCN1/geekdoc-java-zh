  md: '# 09 Collection Classes


    | OBJECTIVES |

    | - Discussing about interfaces of collection |

    | - Exploring about classes of collection |

    | - Discussing about legacy classes |

    | - Explaining legacy classes |


    The collection classes in Java are supported by the java.util package. As you
    can infer from the name, the collection classes help in grouping objects in various
    ways. The collection classes also define several methods that provide easier way
    of working with items. These classes are important, not just for their utility
    but many other Java methods use or return objects of these classes, such as the
    ArrayList and HashMap classes.


    The original Java did not introduce Collections within it. So Java used ad hoc
    classes, such as Dictionary, Vector, Stack, and Properties. The drawback of using
    ad classes was that these classes lacked a unifying scheme and were not designed
    to be easily extended or adapted. Collections were finally added by JSE 1.2 and
    Java SE 8 has significantly increased the power and streamlined the use of collections
    framework.


    In this chapter, you first learn about this chapter interfaces of collection such
    as List and Queue interface, classes of collection such as AbstractList class,
    ArrayList class and LinkedList class. It also discusses about legacy classes such
    as vector class and properties class and enumeration.


    # 9.1 Collection Interfaces


    The Collection interface revolves the objects to provide maximum generality. For
    all, general-purpose collection executions have a constructor that takes Collection
    parameter. This constructor, known as a constructor, initializes the new collection
    to hold all of the elements in the intended location, whatever be the collection''s
    subinterface or implementation type. You can say that it permits you to convert
    the collection''s type.


    Consider an example that you have a Collection<String> co, which can be a List,
    a Set, or another kind of Collection. It creates a new ArrayList (an implementation
    of the List interface), which consists of all the elements in co.'
