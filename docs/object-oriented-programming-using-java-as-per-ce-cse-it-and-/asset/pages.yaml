  md: '# Networking with Java.net 303


    Consider an example of communication that occurs between two ends, such as a telephone
    conversation. TCP ensures that the data send from one to the other goes in the
    same order as it was sent; otherwise, error occurs.


    The examples of applications that need a consistent communication network are
    Hypertext Transfer Protocol (HTTP), File Transfer Protocol (FTP), and Telnet.
    The success of these applications depends on the sequence which data is set and
    received over the network. To read the data from the Uniform Resource Locator
    (URL), the data must be received in the same order as it was sent. Otherwise,
    a corrupt zip file or an HTML file is retrieved in the end.


    Q2. Enlist the various enhancements done in Java SE 8.


    The various enhancements in Java SE 8 are as follows:


    +   - Addition of a new class java.net.URLPermission


