- md: "\n## 9.4 Writing into Files\n\nWriting into files using Python is accomplished\
    \ almost the same way as reading from files. Example 9.4.1 shows how it's done.\
    \ Note that Example 9.4.1 overwrites existing file content every time it is executed.\
    \ Also note that if a file doesn't exist, the program will create a file, but\
    \ only if the specified path to the file exists. If one or more directories do\
    \ not exist, the following program will throw an exception.\n\nEXAMPLE 9.4.1\n\
    \nJava:\n\n```java\nimport java.io.*;\nclass WriteFileContent {\n    public static\
    \ void main(String args[]) {\n        String fileNameWithPath = \"/path/to/file/filename.txt\"\
    ;\n        File fileToWrite = new File(fileNameWithPath);\n        if (!fileToWrite.exists())\
    \ {\n            fileToWrite.createNewFile();\n        }\n        PrintWriter\
    \ writer = new PrintWriter(fileNameWithPath, \"UTF-8\");\n        writer.println(\"\
    text to write\");\n        writer.close();\n    }\n}\n```\n\nPython:\n\n```python\n\
    class WriteFileContent():\n    def __init__(self):\n        fileToWrite = open(\"\
    filename.txt\", \"w\")\n        fileToWrite.writelines(\"text to write\")\n  \
    \      fileToWrite.close()\n\nWriteFileContent()\n```\n\n## 9.5 Appending into\
    \ Files\n\nWhen writing into files, often you need to append lines of text into\
    \ the same file while preserving the file’s existing content. Using Example 9.4.1\
    \ and changing only one character for the second argument of function `open()`,\
    \ I can start appending into a file instead of overwriting it every time I access\
    \ it. Please take a look at Example 9.5.1. the second argument of function `open()`\
    \ is set to $a$, which in this case stands for “append”.\n\nEXAMPLE 9.5.1\n\n\
    Python:\n\n```python\nclass WriteFileContent():\n    def __init__(self):\n   \
    \     fileToRead=open(\"filename.txt\", \"a\")\n        fileToRead.writelines(\"\
    text to write\")\n        fileToRead.close()\n\nWriteContent()\n```\n\n## 9.6\
    \ Checking Path Existence\n\nTo prevent a program from throwing an exception,\
    \ if the path to a file that is being read from or written into doesn't exist,\
    \ it's helpful to first perform a check for the existence of the specified path.\
    \ To make that, I first need to import the `os` module and then use its `path.exists`\
    \ function, which will return a boolean value, letting me know whether a path\
    \ exists. Example 9.6.1 demonstrates the implementation of this check.\n\n# EXAMPLE\
    \ 9.6.1\n\nPython:\n\n```python\nimport os\n\nclass SomeClass():\n    def __init__(self):\n\
    \        print(os.path.exists(\"/path/to/bla/bla/\")\n\nSomeClass()\n```\n\nExample\
    \ 9.6.2 demonstrates how to check for path existence in combination with writing\
    \ into a file if a path does exist.\n\n# EXAMPLE 9.6.2\n\nPython:\n\n```python\n\
    class WriteFileContent():\n    def __init__(self):\n        pathToFile = \"/path/to/file/\"\
    \n        fileName = \"filename.txt\"\n        if os.path.exists(pathToFile):\n\
    \            fileToRead = open(os.path.join(pathToFile, fileName), \"w\")\n  \
    \          fileToRead.writelines(\"text to write\")\n        fileToRead.close()\n\
    \nWriteFileContent()\n```\n\n## 9.7 Creating a Path to File\n\nWhen you are trying\
    \ to write into a file but the path doesn't exist, you can simply create it by\
    \ adding all missing directories and sub directories of the missing path. It can\
    \ be easily done in Python using the os module, as shown in Example 9.7.1. You\
    \ may notice that I moved out the code that writes text to file, into its own\
    \ method and added an else to my condition, which checks for the existence of\
    \ the provided path. If the path doesn't exist, it will create all directories\
    \ that are missing in the path. Function os.makedirs(pathToFile) works perfectly\
    \ for that and is demonstrated in Example 9.7.1.\n\n# EXAMPLE 9.7.1\n\nPython:\n\
    \n```python\nclass WriteFileContent():\n    def __init__(self):\n        pathToFile\
    \ = \"path/to/file/\"\n        fileName = \"filename.txt\"\n        if os.path.exists(pathToFile):\n\
    \            self.write(pathToFile, fileName)\n        else:\n            os.makedirs(pathToFile)\n\
    \            self.write(pathToFile, fileName)\n\ndef write(self, pathToFile, fileName):\n\
    \    fileRead = open(os.path.join(pathToFile, fileName), \"w\")\n    fileRead.writelines(\"\
