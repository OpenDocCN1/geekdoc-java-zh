    # 16.3 Pyramid


    Pyramid is a very general open source Python web framework. As a framework, its
    primary job is to make it easier for a developer to create an arbitrary web application.
    The type of application being created isn’t really important; it could be a spreadsheet,
    a corporate intranet, or a social networking platform. Pyramid is general enough
    that it can be used in a wide variety of circumstances.


    Please visit Pyramid’s website for more details and tutorials:


    http://www.pylonsproject.org/projects/pyramid/about'
