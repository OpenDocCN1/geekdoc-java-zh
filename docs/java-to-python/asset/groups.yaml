    # 15. BUILDING STAND-ALONE APPLICATIONS WITH PYTHON


    Believe it or not, you can also build a fully functional desktop-based application
    with great user-friendly interface. Just like Java, Python is also a multi-platform
    language, therefore the application needs to be developed once and it can run
    on multiple platforms, such as Mac OS X, MS Windows, and Linux. You probably have
    read somewhere that Python is an interpreted scripting language. Not for me, Python
    is a fully featured, object-oriented programming language that gives you the ability
    to run interpreted scripts or programs, as well as the ability to compile programs
    into a fully featured, stand-alone, multi-platform applications that would run
    on all major desktop operating systems. As I am writing this book, Python hasn''t
    yet reached the mobile platform world, but who knows, it might just be around
    the corner for [you]. For now, I list three resources that will help you build
    Linux-based, Mac OS-based, or Windows-based applications.


    ## 15.1 PyInstaller


    According to developers of PyInstaller, it is a program that freezes (packages)
    Python programs into stand-alone executables, under Windows, Linux, Mac OS X,
    FreeBSD, Solaris, and AIX. Its main advantages over similar tools are that PyInstaller
    works with Python 2.7 and 3.3—it builds smaller executables than transparent compression,
    it is fully multi-platform, and it uses the OS support to load the dynamic libraries,
    ensuring full compatibility. The main goal of PyInstaller is to be compatible
    with third-party packages out of the box. This means that, with PyInstaller, all
    the required tricks to make external packages work are already integrated within
    PyInstaller so that there is no user intervention required. You''ll never be required
    to look for tricks in wikis and apply custom modification to your files or your
    setup scripts. As an example, libraries like PyQt, Django, and matplotlib are
    fully supported, without requiring you to handle plugins or external data files
    manually.


    Please visit PyInstaller’s website for more details and tutorials:


    http://www.pyinstaller.org/


    ## 15.2 py2app


    According to developers of py2app, it is a Python setuptools command, which will
    allow you to make stand-alone application bundles and plugins from Python scripts
    for Mac OS operating system. The website of py2app offers a great tutorial that
    explains in the tiniest detail how to install the py2app and compile Python programs
    using it.


    Please visit py2app’s website for more details and tutorials:

    https://pythonhosted.org/py2app/tutorial.html


    ## 15.3 py2exe


    According to developers of py2exe, it is a Python DistUtils extension, which converts
    Python scripts into executable Windows programs, able to run without requiring
    a Python installation. The website of py2exe also has a great tutorial that goes
    into great detail in explaining how to install py2exe and compile Python programs
    using it.


    Please visit py2exe’s website for more details and tutorials:


    http://www.py2exe.org/index.cgi/Tutorial


    # 16. BUILDING WEBSITES WITH PYTHON


    Python also provides a wealth of platforms for you to develop fully featured,
    database-driven web applications. Below I list three of the most popular platforms
    that can be used to build websites with Python.


    ## 16.1 Django


    Developers of the Django platform promote it as a high-level Python Web framework
    that encourages rapid development and clean, pragmatic design. Built by experienced
    developers, it takes care of much of the hassle of web development, so you can
    focus on writing your web application without needing to reinvent the wheel. It
    is free and open source. Django is by far my favorite platform and what I use
    to develop online. There are extensive free tutorials all over YouTube and Django’s
    own website.


    Please visit Django’s website for more details and tutorials:


    https://www.djangoproject.com/


    ## 16.2 Flask


    Flask is also very popular in the world of web development with Python. However,
    Flask is designed for small-scale websites, as opposed to Django, which is designed
    for building larger and more complex websites.


    Please visit Flask’s website for more details and tutorials:


    http://flask.pocoo.org


    ## 16.3 Pyramid


    Pyramid is a very general open source Python web framework. As a framework, its
    primary job is to make it easier for a developer to create an arbitrary web application.
    The type of application being created isn’t really important; it could be a spreadsheet,
    a corporate intranet, or a social networking platform. Pyramid is general enough
    that it can be used in a wide variety of circumstances.


    Please visit Pyramid’s website for more details and tutorials:


    http://www.pylonsproject.org/projects/pyramid/about


    # Author’s Blog


    I hope you have found this book helpful in speeding up your transition from Java
    to Python. My blog is another resource as you convert to Python, since there is
    indeed a lot more to Python than is contained here. Python has grown into a very
    serious competitor for powerful languages such as Java, and it continues to evolve,
    offering more and more modules that open up doors to the development of more complex
    systems.


    As I deepen my experience as a Python programmer, I take notes in the form of
    articles and post them to my blog. So on my blog you will find additional tricks
    that are possible with Python. My online blog is accessible free for all at http://ToProgramInPython.com.


    The Contact page on my blog is a communication tool you can use to reach me with
    your questions, suggestions, and corrections to this book. I hope that in reading
    this book, you see how much you already know about Python as a Java engineer,
    and how quickly you can master Python and become an even stronger software developer.

    '
