- md: "\n## 9.10 Reading CSV Files\n\nCSV format is very popular, especially among\
    \ big data developers, to use as feed export and injection format. Python has\
    \ a great library that makes working with CSVs as simple as it can get. In the\
    \ next example, Example 9.10.1, I demonstrated reading from a CSV file by providing\
    \ the path to your CSV file and filename, and then return Python’s CSV object\
    \ that contains all content from the given CSV file. Just as with the json module,\
    \ the csv module needs to be imported first. Please note that you can specify\
    \ different delimiters—it could be comma (,), pipe (|), or tab (\t)—depending\
    \ on what delimiter is used in the CSV file you are trying to read from.\n\nEXAMPLE\
    \ 9.10.1\n\nPython:\n\n```python\nimport csv\n\nclass WorkingWithContent:\n  \
    \  def getCSVContentPath(csvFileWithPath=\"/path/to/file/our_csv_file.csv\"):\n\
    \        with open(csvFileWithPath, 'rb') as csvFile:\n            csvContent\
    \ = csv.reader(csvFile, delimiter=',', quotechar='|')\n            return csvContent\n\
    ```\n\nExample 9.10.2 demonstrates how to extract and read values of the csvContent\
    \ object. As you can see in Example 9.10.2, I added iteration of csvContent, which\
    \ outputs each row of the content, then I print it out into a console. If you\
    \ run the following example, you will see that each row is an array of values\
    \ from each row of the CSV file. Since each row is a list, you can extract its\
    \ values just as you would extract elements from any array list by index.\n\n\
    EXAMPLE 9.10.2\n\nPython:\n\n```python\nimport csv\n\nclass WorkingWithCSV():\n\
    \    def getCSVContent(self):\n        csvFileWithPath = \"/path/to/file/our_csv_file.csv\"\
    \n        with open(csvFileWithPath, 'rb') as csvFile:\n            csvContent\
    \ = csv.reader(csvFile, delimiter=',', quotechar='|')\n            for row in\
    \ csvContent:\n                print(row)\n```\n\nThere is more to it. Just as\
    \ with JSON, in Python there are multiple powerful modules available to work with\
    \ CSV format. The next example demonstrates module pandas, which solves a problem\
    \ of grabbing the list of values of only one column out of a given CSV file. Let's\
    \ say I have a CSV file that column names specified at the header and I need to\
    \ extract a list of values of only one specific column. The example below shows\
    \ exactly how to achieve this in Python. Module pandas also first needs to be\
    \ imported before it could be referenced and used in a program. Please take a\
    \ look at Example 9.10.3.\n\n## EXAMPLE 9.10.3\n\nPython:\n\n```python\nimport\
    \ pandas\n\nclass WorkingWithCSV():\n    def getCSVContent(self):\n        csvFileWithPath\
    \ = \"/path/to/file/our_csv_file.csv\"\n        csvContent = pandas.read_csv(csvFileWithPath)\n\
    \        column_values_list = csvContent['column_name']\n        return column_values_list\n\
    ```\n\n## 9.11 Writing CSV Files\n\nWriting into CSV can also be done with ease\
    \ in Python using the same csv module. First, you need to aggregate all values\
    \ into the array list. Pass this array list object to the csv.writer and it will\
    \ do the rest. It's as simple as it sounds. Please note that you can specify different\
    \ delimiters, with comma (,), pipe (|), or tab (|). In Example 9.11.1, I specified\
    \ a comma delimiter for the CSV file that I am trying to generate.\n\n## EXAMPLE\
    \ 9.11.1\n\nPython:\n\n```python\nimport csv\n\nclass WorkingContentToCSV():\n\
    \    def writeContentToCSV(self):\n        csvFileWithPath = \"/path/to/file/our_csv_file.csv\"\
    \n\n        values = [\"value-one\", \"value-two\", 3, 44:44, \"value five\"]\n\
    \n        with open(csvFileWithPath, 'w') as csvWrite:\n            csvWriter\
    \ = csv.writer(csvWrite, delimiter=',')\n            csvWriter.writerows(values)\n\
    ```\n\n## 9.12 Lambda Expressions\n\nAlighty lambdas, the anonymous functions\
    \ not bound to the name generated at the runtime. Lambdas are supported in Java\
    \ starting from Java 8 and also in Python. In both languages the concept of lambda\
    \ is pretty much the same. Syntax, however is slightly different, but it's easy\
    \ to understand if you know what lambdas are and how to use them in Java. Lambdas,\
    \ by the way, can also be passed as arguments to other functions in both languages.\
    \ Example 9.12.1 demonstrates the differences in syntax between the same lambda\
    \ implemented in Java and in Python. It's a very simple example that returns a\
    \ boolean value after comparing two strings.\n\n## EXAMPLE 9.12.1\n\nJava:\n\n\
    ```java\nboolean comparingStrings = (String strOne, String strTwo) -> strOne.equals(strTwo);\n\
    ```\n\nPython:\n\n```python\ncomparingStrings = lambda strOne, strTwo: strOne\
    \ == strTwo\n```\n\nTo run lambda function from Example 9.12.1 after it has been\
    \ generated, you need to do the following. As part of Example 9.12.2 let's print\
    \ out the returned result of above lambdas using Java and Python.\n\n## EXAMPLE\
    \ 9.12.2\n\n# Java:\n\n```java\nboolean comparingStrings = (String strOne, String\
    \ strTwo) -> strOne.equals(strTwo);\nSystem.out.println(comparingStrings);\n```\n\
    \n# Python:\n\n```python\ncomparingStrings = lambda strOne, strTwo: strOne ==\
    \ strTwo\n```\n\nTo run lambda function from Example 9.12.1 after it has been\
    \ generated, you need to do the following. As part of Example 9.12.2 let's print\
    \ out the returned result of above lambdas using Java and Python.\n\n## 10.1 String\
    \ Concatenation with Other Types\n\nI decided to mention string concatenation\
    \ with other types because in Java, it works automatically. In Python, you need\
    \ to convert them to string. Example 10.1 shows. In Python, however, automatic\
    \ conversion does not happen.\n\n## 10.2 Character Extraction\n\nPython sees strings\
    \ as arrays. Therefore, to extract a character out of a string you would use index.\
    \ Example 10.2.1 demonstrates how to get a character by index.\n\n## EXAMPLE 10.2.1\n\
    \nJava:\n\n```java\nString strVar = \"Hello World\";\nchar charVar = strVar.charAt(4);\n\
    ```\n\nPython:\n\n```python\nstrVar = \"Hello World\"\ncharVar = strVar[4]\n```\n"
  mdcn: "\n\n## 9.10 读取 CSV 文件\n\nCSV 格式非常流行，特别是在大数据开发者中，常被用数据导出和注入格式。Python 拥有一个非常强大的库，让处理\
    \ CSV 变得极其简单。在接下来的示例 9.10.1 中，我演示了如何通过提供 CSV 文件的路径和文件名从 CSV 文件读取内容，然后返回一个 Python\
    \ 的 CSV 对象，该对象包含给定 CSV 文件的所有内容。与 `json` 模块一样，`csv` 模块需要先导入。请注意，你可以指定不同的分隔符——可以是逗号\
    \ (,)、管道 (|) 或制表符 (\t) ——这取决于你尝试读取的 CSV 文件所使用的分隔符。\n\n示例 9.10.1\n\nPython:\n\n\
    ```python\nimport csv\n\nclass WorkingWithContent:\n    def getCSVContentPath(csvFileWithPath=\"\
    /path/to/file/our_csv_file.csv\"):\n        with open(csvFileWithPath, 'rb') as\
    \ csvFile:\n            csvContent = csv.reader(csvFile, delimiter=',', quotechar='|')\n\
    \            return csvContent\n```\n\n示例 9.10.2 演示了如何提取和读取 `csvContent` 对象的值。如示例\
    \ 9.10.2 所示，我添加了 `csvContent` 的迭代，它会输出内容的每一行，然后将其打印到控制台。如果你运行以下示例，你将看到每一行都是 CSV\
    \ 文件中每行值的数组。由于每行都是一个列表，你可以像从任何数组列表中通过索引提取元素一样，提取它的值。\n\n示例 9.10.2\n\nPython:\n\
    \n```python\nimport csv\n\nclass WorkingWithCSV():\n    def getCSVContent(self):\n\
    \        csvFileWithPath = \"/path/to/file/our_csv_file.csv\"\n        with open(csvFileWithPath,\
    \ 'rb') as csvFile:\n            csvContent = csv.reader(csvFile, delimiter=',',\
    \ quotechar='|')\n            for row in csvContent:\n                print(row)\n\
    ```\n\n这还有更多内容。就像 JSON 一样，在 Python 中有多个强大的模块可以处理 CSV 格式。下一个示例演示了 `pandas` 模块，它解决了从给定的\
    \ CSV 文件中提取单列值列表的问题。假设我有一个 CSV 文件，列名定义在表头，我需要提取某一个特定列的值列表。下面的示例准确展示了如何在 Python\
    \ 中实现这一目标。`pandas` 模块在程序中引用和使用之前也需要先导入。请查看示例 9.10.3。\n\n##  9.10.3\n\nPython:\n\
    \n```python\nimport pandas\n\nclass WorkingWithCSV():\n    def getCSVContent(self):\n\
    \        csvFileWithPath = \"/path/to/file/our_csv_file.csv\"\n        csvContent\
    \ = pandas.read_csv(csvFileWithPath)\n        column_values_list = csvContent['column_name']\n\
    \        return column_values_list\n```\n\n## 9.11 写入 CSV 文件\n\n使用相同的 `csv` 模块也可以轻松地写写入\
    \ CSV。首先，你需要将所有值聚合到数组列表中。将此列表对象传递给 `csv.writer`，它将完成剩下的工作。这听起来非常简单。请注意，你可以指定不同的分隔符，逗号\
    \ (,)、管道 (|) 或制表符 (|)。在示例 9.11.1 中，我为尝试生成的 CSV 文件指定了逗号分隔符。\n\n##  9.11.1\n\nPython:\n\
    \n```python\nimport csv\n\nclass WorkingContentToCSV():\n    def writeContentToCSV(self):\n\
    \        csvFileWithPath = \"/path/to/file/our_csv_file.csv\"\n\n        values\
    \ = [\"value-one\", \"value-two\", 3, 44:44, \"value five\"]\n\n        with open(csvFileWithPath,\
    \ 'w') as csvWrite:\n            csvWriter = csv.writer(csvWrite, delimiter=',')\n\
    \            csvWriter.writerows(values)\n```\n\n## 9.12 Lambda 表达式\n\n让我们来看看\
    \ lambda，即在运行时没有绑定到生成名称的匿名函数。Java 从 Java 8 开始支持 lambda，Python 也是如此。在这两种语言中，lambda\
    \ 的概念几乎相同。然而，语法略有不同，但如果你知道 lambda 是什么以及如何在 Java 中使用它们，就很容易理解。顺便说，在两种语言中，lambda\
    \ 都可以作为参数传递给其他函数。示例 9.12.1 演示了 Java 和 Python 实现相同 lambda 时的语法差异。这是一个非常简单的示例，在比较两个字符串后返回布尔值。\n\
    \n## EXAMPLE 9.12.1\n\nJava:\n\n```java\nboolean comparingStrings = (String strOne,\
    \ String strTwo) -> strOne.equals(strTwo);\n```\n\nPython:\n\n```python\ncomparingStrings\
    \ = lambda strOne, strTwo: strOne == strTwo\n```\n\n在运行示例 9.12.1 中的 lambda 函数后，你需要执行以下操作。在示例\
    \ 9.12.2 中，让我们使用 Java 和 Python 打印上述 lambda 的返回结果。\n\n## EXAMPLE 9.12.2\n\n# Java:\n\
    \n```java\nboolean comparingStrings = (String strOne, String strTwo) -> strOne.equals(strTwo);\n\
    System.out.println(comparingStrings);\n```\n\n# Python:\n\n```python\ncomparingStrings\
    \ = lambda strOne, strTwo: strOne == strTwo\n```\n\n"
