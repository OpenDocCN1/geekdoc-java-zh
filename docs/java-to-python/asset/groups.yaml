    # 15. 使用 Python 构建独立应用程序


    信你不信，你也可以构建一个具有极佳用户界面的全功能桌面应用程序。与 Java 类似，Python 也是一种多平台语言，因此应用程序只需要开发一次，就可以在多个平台（如
    Mac OS X、MS Windows 和 Linux）上运行。你可能在某处读过 Python 是一种解释型脚本语言。对我而言并非，Python 是一种功能完备的面向对象的编程语言，它赋予了你运行解释脚本或程序的能力，还能将程序编译成功能完备、独立且多平台的应用程序，这些程序可以在所有主要的桌面操作系统上运行。在我写此书时，Python
    尚未进入移动平台世界，但谁知道呢，它可能对[你]来说指日可待。目前，我列出了三种资源，将帮助你构建基于 Linux、Mac OS 或 Windows 的应用程序。


    ## 15.1 PyInstaller


    根据 PyInstaller 开发者的介绍，它是一个可以将 Python 程序冻结（打包）为 Windows、Linux、Mac OS X、FreeBSD、Solaris
    和 AIX 下独立可执行程序的。它与类似工具相比的主要优势在于 PyInstaller 支持 Python 2.7 和 3.3——它构建的可执行文件比透明压缩更小，它是完全多平台的，并且利用操作系统的支持来加载动态库，确保了完全兼容。PyInstaller
    的主要目标是开箱兼容第三方包。这意味着，通过 PyInstaller，所有让外部包运行所需的技巧都已集成在 PyInstaller ，因此不需要用户干预。你永远不需要在
    wiki 中寻找技巧，并对你的文件或设置脚本进行自定义修改。例如，PyQt、Django 和 matplotlib 等库都得到了完全支持，不需要你手动处理插件或外部数据文件。


    请访问 PyInstaller 网站获取更多详情和教程：


    http://www.pyinstaller.org/


    ## 15.2 py2app


    根据 py2app 开发者的介绍，它是一个 Python setuptools 命令，允许你为 Mac OS 操作系统从 Python 脚本创建独立的应用程序包（bundles）和插件。py2app
    网站提供了一个非常出色的教程，详尽地解释了如何安装 py2app 以及使用它编译 Python 程序。


    请访问 py2app 网站获取更多详情和教程：

    https://pythonhosted.org/py2app/tutorial.html


    ## 15.3 py2exe


    根据 py2exe 开发者的介绍，它是一个 Python DistUtils 扩展，可以将 Python 脚本转换为可执行的 Windows 程序，这些程序无需安装
    Python 即可运行。py2exe 网站也有一个非常出色的教程，详尽地解释了如何安装 py2exe 以及使用它编译 Python 程序。


    请访问 py2exe 网站获取更多详情和教程：


    http://www.py2exe.org/index.cgi/Tutorial


    # 16. 使用 Python 构建网站


    Python 还提供了丰富的平台，供你开发全功能、数据库驱动的 Web 应用程序。下面我列出了三个用于用 Python 构建网站的最流行的平台。


    ## 16.1 Django


    Django 平台的开发者将其推为一种高级 Python Web 框架，鼓励快速开发和简洁、务实的设计。它由经验丰富的开发者构建，处理了 Web 开发中的许多繁琐工作，因此你可以专注于编写自己的
    Web 应用程序，而不需要重复造轮子。它是免费开源的。Django 是目前为止我最喜欢的平台，也是我用于在线环境的工具。YouTube 和 Django 官方网站上都有大量的免费教程。


    请访问 Django 网站获取更多详情和教程：


    https://www.djangoproject.com/


    ## 16.2 Flask


    Flask 在 Python Web 开发领域也非常受欢迎。然而，Flask 设计是为小型网站设计的，而 Django 则设计用于构建更大、更复杂的网站。


    请访问 Flask 网站获取更多详情和教程：


    http://flask.pocoo.org


    ## 16.3 Pyramid


    Pyramid 是一个非常通用的开源 Python Web 框架。作为一个框架，它的首要任务是让开发者更容易创建任意的 Web 应用程序。创建的应用程序类型并不重要；它可以是一个电子表格、企业内网或社交网络平台。Pyramid
    足够通用，可以用于各种情况。


    请访问 Pyramid 网站获取更多详情和教程：


    http://www.pylonsproject.org/projects/pyramid/about


