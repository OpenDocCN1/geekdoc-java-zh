- md: "\n## 8. MULTITHREADING AND MULTIPROCESSING\n\nJava lets you run separate processes\
    \ in parallel using Java’s Thread Model. Python also gives you that ability, but\
    \ in two variations unique to each other: “multithreading” and “multiprocessing.”\
    \ The difference between the two lies in how separate processes share virtual\
    \ memory where they run.\n\n### 8.1 Multithreading\n\nMultithreading runs within\
    \ the same memory and shares it based on availability. For example, if one thread\
    \ took 80% of available memory, then only 20% is left to run other processes until\
    \ more memory out of the occupied 80% becomes available. Example 8.1.1 demonstrates\
    \ the implementation of multithreading in Java and in Python. I kept the class\
    \ and method names the same between Java and Python examples for you to compare\
    \ how the two languages implement multithreading.\n\nEXAMPLE 8.1.1\n\nJava:\n\n\
    ```java\nclass SomeClass {\n    public static void main(String args[]) {\n   \
    \     new ThreadNode(\"First\");\n        new ThreadNode(\"Second\");\n      \
    \  new ThreadNode(\"Third\");\n        new ThreadNode(\"Fourth\");\n    }\n}\n\
    \nclass ThreadNode implements Runnable {\n    String threadName;\n    Thread threadObj;\n\
    \n    ThreadNode(String threadName) {\n        String name = threadName;\n   \
    \     threadObj = new Thread(this, name);\n        threadObj.start();\n    }\n\
    \n    public void run() {\n        for (int counter = 5; counter > 0; counter--)\
    \ {\n            System.out.println(threadName + \": \" + counter);\n        }\n\
    \    }\n}\n```\n\nPython:\n\n```python\nimport threading\n\nclass ThreadNode(threading.Thread):\n\
    \n    def __init__(self, threadName):\n        threading.Thread.__init__(self)\n\
    \        self.threadName = threadName\n\n    def run(self):\n        for counter\
    \ in range(5):\n            print(self.threadName + \": \" + str(counter))\n\n\
    class SomeClass:\n    def __init__(self):\n        thread1 = ThreadNode(\"First\"\
    )\n        thread1.start()\n        thread2 = ThreadNode(\"Second\")\n       \
    \ thread2.start()\n        thread3 = ThreadNode(\"Third\")\n        thread3.start()\n\
    \        thread4 = ThreadNode(\"Fourth\")\n        thread4.start()\n\nSomeClass()\n\
    ```\n\n### 8.2 Synchronization in Multithreading\n\nPython’s `threading` module\
    \ provides the concept that a `Lock()` can lock out the rest of the processes\
    \ and line them up in the queue. All consequent threads execute only after the\
    \ current one has completed its execution. Before execution, the thread needs\
    \ to `acquire()` its reserved spot in the queue. When the execution is completed,\
    \ the thread has to `release()` itself, opening a pathway for the next thread\
    \ in line. Example 8.2.1 demonstrates exactly how that is done in Python.\n\n\
    EXAMPLE 8.2.1\n\nPython:\n\n```python\nimport threading\n\nclass ThreadNode(threading.Thread):\n\
    \    def __init__(self, threadName, lockObj):\n        threading.Thread.__init__(self)\n\
    \        self.threadName = threadName\n        self.lockObj = lockObj\n\n    def\
    \ run(self):\n        self.lockObj.acquire()\n        for counter in range(5):\n\
    \            print(self.threadName + \": \" + str(counter))\n        self.lockObj.release()\n\
    \nclass SomeClass():\n    def __init__(self):\n        lockObj = threading.Lock()\n\
    \n        thread1 = ThreadNode(\"First\", lockObj)\n        thread1.start()\n\
    \        thread2 = ThreadNode(\"Second\", lockObj)\n        thread2.start()\n\
    \        thread3 = ThreadNode(\"Third\", lockObj)\n        thread3.start()\n \
    \       thread4 = ThreadNode(\"Fourth\", lockObj)\n        thread4.start()\n\n\
    SomeClass()\n```\n\n### 8.3 Multiprocessing\n\nMultiprocessing splits memory evenly\
    \ among the processes that are to run in parallel. Each process then runs within\
    \ its virtual memory and does not take memory away from other processes. If, for\
    \ example, we run four processes on a quad core CPU, then each process would run\
    \ on its own core without violating the cores of other processes. In Python, multiprocessing\
    \ can be implemented using multiple ways. I specified two ways in Examples 8.3.1\
    \ and 8.3.2. Both work well and demonstrate the flexibility of Python.\n\nEXAMPLE\
    \ 8.3.1\n\nPython:\n\n```python\nfrom multiprocessing import Process\n\nclass\
    \ ThreadNode:\n    def __init__(self, threadName):\n        self.threadName =\
    \ threadName\n        Process(target=self.run, args=()).start()\n\n    def run(self):\n\
    \        for counter in range(5):\n            print(self.threadName + \": \"\
    \ + str(counter))\n\nclass SomeClass():\n    def __init__(self):\n        ThreadNode(\"\
    First\")\n        ThreadNode(\"Second\")\n        ThreadNode(\"Third\")\n    \
    \    ThreadNode(\"Fourth\")\n\nSomeClass()\n```\n\nEXAMPLE 8.3.2\n\nPython:\n\n\
    ```python\nfrom multiprocessing import Process\n\nclass ThreadNode:\n    def run(self,\
    \ threadName):\n        for counter in range(5):\n            print(threadName\
    \ + \": \" + str(counter))\n\nclass SomeClass():\n    def __init__(self, args):\n\
    \        # Implementation details seem missing or incomplete in source\n     \
    \   pass\n```\n"
  mdcn: "\n\n## 8. 多线程与多进程\n\nJava 允许你使用 Java 的线程模型（Thread Model）并行运行独立的进程。Python\
    \ 也提供了这种能力，但通过两种互具独特的变体来实现：“多线程”和“多进程”。两者之间的区别在于独立进程如何共享它们运行的虚拟内存。\n\n### 8.1\
    \ 多线程\n\n多线程在同一内存空间中运行，并根据可用情况共享内存。例如，如果一个线程占用了 80% 的可用内存，那么只剩下 20% 内存用于运行其他进程，直到被占用的\
    \ 80% 中有更多内存变得可用。示例 8.1.1 展示了 Java 和 Python 中多线程的实现。我保持了 Java 和 Python 示例之间的类名和方法名相同，以便你比较这两种语言如何实现多线程。\n\
    \n示例 8.1.1\n\nJava:\n\n```java\nclass SomeClass {\n    public static void main(String\
    \ args[]) {\n        new ThreadNode(\"First\");\n        new ThreadNode(\"Second\"\
    );\n        new ThreadNode(\"Third\");\n        new ThreadNode(\"Fourth\");\n\
    \    }\n}\n\nclass ThreadNode implements Runnable {\n    String threadName;\n\
    \    Thread threadObj;\n\n    ThreadNode(String threadName) {\n        String\
    \ name = threadName;\n        threadObj = new Thread(this, name);\n        threadObj.start();\n\
    \    }\n\n    public void run() {\n        for (int counter = 5; counter > 0;\
    \ counter--) {\n            System.out.println(threadName + \": \" + counter);\n\
    \        }\n    }\n}\n```\n\nPython:\n\n```python\nimport threading\n\nclass ThreadNode(threading.Thread):\n\
    \n    def __init__(self, threadName):\n        threading.Thread.__init__(self)\n\
    \        self.threadName = threadName\n\n    def run(self):\n        for counter\
    \ in range(5):\n            print(self.threadName + \": \" + str(counter))\n\n\
    class SomeClass:\n    def __init__(self):\n        thread1 = ThreadNode(\"First\"\
    )\n        thread1.start()\n        thread2 = ThreadNode(\"Second\")\n       \
    \ thread2.start()\n        thread3 = ThreadNode(\"Third\")\n        thread3.start()\n\
    \        thread4 = ThreadNode(\"Fourth\")\n        thread4.start()\n\nSomeClass()\n\
    ```\n\n### 8.2 多线程中的同步\n\nPython 的 `threading` 模块提供了一种概念，即 `Lock()` 可以锁定其他进程并将它们在队列中排队。所有后续线程只有在当前线程完成执行后才会执行。在执行之前，线程需要\
    \ `acquire()` 它在队列中的预留位置。当执行完成后，线程必须 `release()` 自己，为队列中的下一个线程开辟路径。示例 8.2.1 详细演示了在\
    \ Python 中是如何实现的。\n\n示例 8.2.1\n\nPython:\n\n```python\nimport threading\n\nclass\
    \ ThreadNode(threading.Thread):\n    def __init__(self, threadName, lockObj):\n\
    \        threading.Thread.__init__(self)\n        self.threadName = threadName\n\
    \        self.lockObj = lockObj\n\n    def run(self):\n        self.lockObj.acquire()\n\
    \        for counter in range(5):\n            print(self.threadName + \": \"\
    \ + str(counter))\n        self.lockObj.release()\n\nclass SomeClass():\n    def\
    \ __init__(self):\n        lockObj = threading.Lock()\n\n        thread1 = ThreadNode(\"\
    First\", lockObj)\n        thread1.start()\n        thread2 = ThreadNode(\"Second\"\
    , lockObj)\n        thread2.start()\n        thread3 = ThreadNode(\"Third\", lockObj)\n\
    \        thread3.start()\n        thread4 = ThreadNode(\"Fourth\", lockObj)\n\
    \        thread4.start()\n\nSomeClass()\n```\n\n### 8.3 多进程\n\n多进程将内存平均分配给并行运行的进程。每个进程在自己的虚拟内存中运行，不会夺取其他进程的内存。例如，如果我们在四核\
    \ CPU 上运行四个进程，那么每个进程都将在自己的核心上运行，而不会干扰其他进程的核心。在 Python 中，可以使用多种方式实现多进程。我在示例 8.3.1\
    \ 和 8.3.2 中指定了两种方法。两者效果良好，并展示了 Python 的灵活性。\n\n示例 8.3.1\n\nPython:\n\n```python\n\
    from multiprocessing import Process\n\nclass ThreadNode:\n    def __init__(self,\
    \ threadName):\n        self.threadName = threadName\n        Process(target=self.run,\
    \ args=()).start()\n\n    def run(self):\n        for counter in range(5):\n \
    \           print(self.threadName + \": \" + str(counter))\n\nclass SomeClass():\n\
    \    def __init__(self):\n        ThreadNode(\"First\")\n        ThreadNode(\"\
    Second\")\n        ThreadNode(\"Third\")\n        ThreadNode(\"Fourth\")\n\nSomeClass()\n\
    ```\n\n示例 8.3.2\n\nPython:\n\n```python\nfrom multiprocessing import Process\n\
    \nclass ThreadNode:\n    def run(self, threadName):\n        for counter in range(5):\n\
