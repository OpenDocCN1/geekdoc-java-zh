    # 3. VARIABLES


    Variables in Python carry the same definition as they do in Java. A variable is
    the storage location in virtual memory that could be assigned with some value.
    The value of a variable may be changed during the execution of the program or
    could be left unchanged as constant. The next program shows how a variable is
    declared and how it is assigned with a value in Python.


    In Python, a variable acts in the same manner as in Java, but again, simpler.
    In Java, all variables must be declared with a specific data type, such as integer,
    string, or boolean. Python again eliminates the need to specify a variable''s
    data type. You simply give a variable its name and assign it a value. Python automatically
    detects if the assigned value is an integer, string, or any other data type and
    automatically assigns variable the correct data type.


    When a variable is created with an integer value, it becomes a variable of an
    integer type. Therefore, if at a later time you wish to convert the variable to
    a string, you would so explicitly as such: str(integerVariable).


    Why would you want to convert an integer variable to a string? A great example
    would be the concatenation of the integer variable to the string. (Concatenation
    in Python is done in the same way as in Java, by placing a + sign between a string
    and the variable that is concatenated to the string.) When concatenation is done
    in Java, all concatenated variables are automatically converted to a string. Python,
    however, does not provide the luxury of automatic conversion. To concatenate an
    integer variable to a string variable, the integer variable has be explicitly
    converted to the string in the following example:


    ```

    strVariable = "String One"

    ```


    ```

    intVariable = 123

    ```


    ```

    concatenated Variable = strVariable + str(intVariable)

    ```'
