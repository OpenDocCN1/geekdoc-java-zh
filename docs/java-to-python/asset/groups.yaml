    # 7.15 Python’s Dictionary Is Java’s Map


    Dictionaries in Python serve the same purpose as maps in Java. Keys and values
    pair with each other. Keys must be unique, but if any chance you have specified
    a duplicate key, don’t worry, the program will still run. When duplicate keys
    are encountered during assignment, the last assignment overwrites all previous
    assignments. Keys can only be of immutable types such as integers, strings, or
    tuples. As you have learned previously, tuples are immutable and can therefore
    be used as keys in Python’s dictionaries. In Java’s maps, keys can only be of
    one data type within the same map, for example integer. But in Python, even within
    the same dictionary, keys can be of different data types. One key could be an
    integer, another a string, and a third a tuple, as long as they are immutable.
    Values could be any mutable or immutable of any data types, even lists, tuples,
    and/or nested dictionaries. Examples 7.15.1 and 7.15.2 demonstrate how Java’s
    map would look if converted to Python’s dictionary.


