    # 9.3 How to Avoid Slurping While Reading Content of Large Files\n\nLet’s start\
    \ with defining what slurping. Slurping is reading the content of the whole file\
    \ at once into virtual memory, working with it out of the virtual memory. It is\
    \ the fastest way to read the content of a file, but what if the size of this\
    \ content is larger than the size of your virtual memory? Then slurping will cause\
    \ an out-of-memory exception.\n\nIn Python, file.read() and file.readlines() both\
    \ slurp the whole file into memory. In cases when slurping a full file is not\
    \ an option, Python provides a way to read the file line by line very simply,\
    \ such as in Example 9.3.1.\n\nEXAMPLE 9.3.1\n\nPython:\n\n```\nclass ReadFileContentWihtoutSlurping():\n\
    \    def __init__(self):\n        sourceFile = \"/path/to/file/filename.txt\"\n\
    \        with open(sourceFile, \"r\") as file:\n            for line in file:\n\
    \                print line\n```\n\nReadFileContentWihtoutSlurping()"
