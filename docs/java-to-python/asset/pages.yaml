    # Steps:


    First, run the following command and see what version of GLIBC runs on your Linux
    distribution:


    ```

    rpm -qa glibc

    ```


    The response you will see should look something like this:


    ```

    glibc-2.12-1.192.el6.x86_64

    ```


    That tells you that you run on machine x86_64 and GLIBC version 2.12, as in my
    case. Remember, the latest version at the time of this writing is cx_Oracle version
    5.2.1, which requires GLIBC version 2.14 or higher.


    Next, follow these steps to set up Oracle SDK and install cx_Oracle.


