  md: 'sudo rpm -ivh oracle-instantclient11.1-devel-11.1.0.7-0-x86_64.rpm


    # Step 2:


    Run the following exports:


    +   1) export LD_LIBRARY_PATH=/usr/lib/oracle/11.1/client64/lib/ >> ~/.bash


    +   2) export ORACLE_HOME=/usr/lib/oracle/11.1/client64 >> ~/.bash


    +   3) export PATH=$ORACLE_HOME/bin:$PATH >> ~/.bash


    # Step 3:


    Download and install the following version of cx_Oracle module:


    https://sourceforge.net/projects/cx-oracle/files/5.1.2/cx_Oracle-5.1.2-11g-py27-1.x86_64.rpm/download


    The command to install is:


    ```

    sudo rpm -ivh cx_Oracle-5.1.2-11g-py27-1.x86_64.rpm

    ```


    After SDK is setup, all dependencies are installed, and paths are set in the bash_profile,
    you then need to install Python''s module, cx_Oracle. As explained on its website
    (http://cx-oracle.sourceforge.net), the module can be installed simply using pip
    install cx_Oracle. However, from my experience, I could not make the latest version
    work and ended up installing an older version. Older versions of the cx_Oracle
    module can be found here https://sourceforge.net/projects/cx-oracle/files/.


    When the cx_Oracle module is installed, please make sure that import it works
    without any errors.


