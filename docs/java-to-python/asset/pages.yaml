  md: '# 12. PYTHON’S MODULES, JAVA’S LIBRARIES


    # 12.1 Installing Required Modules


    Just like with Java, Python software programming engineers have developed and
    continue to develop a wealth of libraries that are packaged in the form of modules.
    In Java, libraries are downloaded and imported in the form of jar files. In Python,
    modules are installed using package manager pip. The command to install a module
    is very simple: `pip install module_name`. Python’s own website provides a complete
    Python Package Index that lists most, if not all, available modules for development
    in Python. Python itself comes prepackaged with lots of useful modules, but if
    you tried to import a certain module and received the error ImportError: No module
    named paramiko, means module paramiko is not installed in your Python environment
    and needs to be installed. You can do so with the command `pip install paramiko`.
    I randomly chose the paramiko module to use for this example, but it is actually
    a great SFTP utility with many useful features. You can use the same procedures
    for other modules that are not installed into your Python environment. After installing
    them, you’ll be able to use them without issues.


    # 12.2 Packaging-Required Modules with Your Project


    What makes Java so comfortable to work with is its inclusion of all required libraries
    with your project in the form of jar files. This way when project is moved from
    one machine to another, all required libraries move with it. It could be done
    manually by downloading and storing .jar files with the project or using Maven’s
    pom.xml.


    In Python, modules can be installed what makes them available for all projects
    running on that environment. Modules can also be packaged and included with the
    project, so if a project gets moved to an environment where required modules are
    not installed, they can still be imported without the need to install them.'
