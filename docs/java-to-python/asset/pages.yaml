  md: "# 2. COMPILING A PROGRAM\n\nBefore you can run a Java program, it first needs\
    \ to be compiled by a Java compiler and turned into a set of bytecodes that the\
    \ JVM can understand and execute. In Python, this is not necessary since programs\
    \ can run as interpreted, although there is a way to compile a Python program\
    \ into an executable file.\n\nMethod main() is used in Java applications to define\
    \ the starting point of the application when Java's compiled .jar file is being\
    \ executed to start a program. In Python, there is no main() method since the\
    \ program is not compiled and I have access to all files of the program. As such,\
    \ I can start a program by running the python command along with the file name\
    \ passed to it as a first argument. Thus, any one of the files of the application\
    \ could be my starting point for the application to take off running.\n\nIf you\
    \ have ever taken a look at the code of Python programs, you probably noticed\
    \ the following line of code:\n\n```\nif __name__ == \"__main__\":\n```\n\nDon't\
    \ let this confuse you. This is not the main() as the one that exists in Java.\
    \ Python's if __name__ == \"__main__\": condition is used to prevent a class from\
    \ being executed when it is imported by another class, but it will execute when\
    \ called directly by the python command. Examples 2.1 and 2.2 demonstrate the\
    \ difference in syntax between a Python code with the if __name__ == \"__main__\"\
    : condition and one without it.\n\nEXAMPLE 2.1\n\n# Start of the program\n\nclass\
    \ SimpleProgram:\n\n```\ndef __init__(self):\n    self.PrintHelloWorld()\n```\n\
    \n```\ndef printHelloWorld(self):\n    print \"Hello World\\n\"\n```"
