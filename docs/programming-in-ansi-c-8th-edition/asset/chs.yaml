  \ 项目\n## 附录 V C99/C11 特性\n## 附录 VI 使用 C 进行图形编程\n## 参考文献\n## 索引\n## 引言\n计算是指计算机处理数据的操作。为了能够使用计算机进行计算，我们首先需要了解计算机中存在的不同组件，并理解这些组件如何服务于我们的目的。在本章中，我们将简要讨论计算机的不同硬件组件。我们还将讨论开发程序的方法，以此实现解决问题和执行各种计算活动的目标。\n\
  ## 计算机的组件\n计算机是一种电子设备，可执行各种涉及算术和逻辑运算的计算。[图 1.1] 显示了计算机的主要组件。\n![Image00030.jpg]\n\
  \n\n\n\n图 1.2 示例型 CPU 的布局\n### 输入设备\n输入设备是允许用户向计算机输入数据和其他指令的设备。输入设备最流行的选择是键盘和鼠标。其他示例包括扫描仪、阅读器等。大多数输入设备本质上是机电的，通过机械手段接受用户的输入，例如通过按下键盘上的键来输入某些数据，或在表面移动鼠标以确定位置。通过这些机械手段获得的信息会被数字化（转换为电子信号）并传输到\
  \ CPU/内存。\n### 输出设备\n正如输入设备被用于向计算机传递信息一样，输出设备被计算机用于向用户传回信息。几乎所有计算机都有的最常见输出设备是显示器。显示器用于显示计算结果、消息等。输出设备的其他示例包括打印机、扬声器、绘图仪等。\n\
  输入和输出设备有时被称为外设备。这些辅助设备可以连接到计算机并使用。它们之所以被称为辅助设备，是因为与 CPU 或内存不同，它们在计算机中的存在并非强制性的。\n\
  ### 内存\n内存/存储单元是计算机中用于数据存储的组件。这些单元具有不同的访问速度和易失性。访问速度是指从内存存储/检索数据所需的时间。易失性是指数据存储在内存中的持续或条件。根据这些特征，计算机内存可以分为不同的类型。[图\
  \ 1.3] 显示了计算机内存的分类。\n![Image00032.jpg]\n\n\n\n\n\n\n\n\n\n\n\n\n- 内存管理\n- 文件管理\n\
  简单来说，操作系统管理计算机的所有资源。它还解释从用户接收到的所有底层硬件命令。如今的操作系统配备了易于操作的智能图形用户界面(`GUI`)）。它们还提供了多种实用程序，如计算器、文本编辑器、扫描软件、绘图工具和图像编辑工具。\n\
  ## 翻译器\n翻译器涵盖了一类系统软件，将用一种编程语言编写的程序翻译成另一种。`编译器`、`汇编器`、`解释器`等是最常用的翻译器。源编程语言是高级编程语言或汇编语言。在几乎所有情况下，目标语言都是机器语言，其本质上是二进制（1\
  \ 和 0——高电压和低电压），这是计算机能理解的语言。翻译器之所以是系统软件是因为它们需要对底层硬件的体系配置有深入的理解。这种知识是必要的，因为目标代码取决于机器。特定架构支持的机器指令集可能不受其他架构支持。\n\
  编译器是将用高级语言(`HLL`)编写的程序翻译成机器语言的系统软件。`C`、`C++`、`Java`等都是`HLL`的示例。因此，编译器必须意识到`HLL`的语法细节以及目标程序预期执行的机器的指令集、寻址模式、寄存器配置等。编程语言的语法规范通过该语言的语法提供给编译器。因此，为`C`编程语言设计的编译器无法处理用`Java`语言编写的程序。这是因为`C`编译器被提供了`C`语言的语法规则，并将使用`Java`编写的语句视为错误。编译器的输出是机器语言，并使用计算机`CPU`支持的指令。因此，为配备`Intel`处理器的计算机生成机器代码的编译器将无法为包含`Motorola`处理器的计算机生成机器代码。对于任何编译器，同时指定源语言和输出程序将执行的目标机器都是关重要的。编译器生成的机器代码被称为目标代码。\n\
  汇编器将汇编语言编写的程序翻译成机器语言。汇编语言由底层处理器支持的指令组成。汇编语言和机器语言的区别在于，汇编语言使用如`ADD`、`SUB`等助记符，而机器语言使用这些助记符对应的二进制操作码。\n\
  ## 链接器\n链接器将属于程序所有子程序/函数的目标代码连接起来，形成可执行代码。这种可执行代码可以存储在辅助内存中，并在需要执行时加载到主内存中。\n##\
  \ 加载器\n加载器是一种将程序从辅助内存加载到主内存指定区域以执行的系统软件。现代操作系统内置加载器。`绝对加载器`、`可重加载器`、`直接链接加载器`是加载器的几种形式。在这，一种被称为`引导加载器`(boot\
  \ strap loader)的特殊加载器值得特别提及。正如前面提到的，引导加载器`在计算机启动后立即将操作系统的内存驻部分加载到主内存中。然后操作系统接管计算机的控制权。\n\
  ## 应用程序\n应用程序是旨在执行特定活动并以各种方式帮助用户的软件。文字处理软件、图像编辑、表格软件包、数据库软件和会计软件都是应用程序的示例。这些每一个都是为了服务特殊目的而设计的。\n\
  # 通过算法和流程图掌握编程艺术\n![](img/Image00033.gif)\n我们在上一节中已经看到软件是计算机不可但不可或的一部分，它使用户能够与计算机交互，并按照个人的规范和要求运行以实现计算目标。软件可以被视为一组协同工作以执行任务的程序。程序是一组指令，按顺序执行时完成任务。\n\
  让我们考虑一个程序的示例，该程序执行后允许用户输入两个数字，将其相加并显示结果。显然，这个程序将包含三组指令；第一组指令允许用户输入数据，第二组指令相加数字，第三组指令显示结果。在编写程序时，程序员会规划这三组指令，并使用其中的语句来实现每组指令。这里考虑的示例是极其简单的。\n\
  然而，大多数时候，计算机应该解决的问题会比这复杂得多。此类复杂的问题不可避免需要复杂的解决方案。这些解决方案涉及许多复杂的算术运算和逻辑决策。当下的需求是一种工具，它能够允许我们表示程序所需的逻辑，并使将逻辑转换为等指令集成为可能，这些指令由计算机执行时将解决问题。算法和流程图就是这样两种工具。这些工具独立于编程语言以及目标机器。因此，使用这些工具之一表示的逻辑可以用于用程序员选择的任何语言编写程序。事实上，逻辑应该始终独立于编程语言。无论选择何种工具和语言来编写程序，编程逻辑结构分为三种重要类型（除了输入/输出和子程序调用结构外）：\n\
  - 指令性语句（动作）\n- 迭代语句（重复/循环）\n我们所讨论的工具应该能够表示这三种结构中的每一种，因为程序包含了属于这三类任一的语句。\n建议始终使用算法和流程图等工具先计划后编写程序。毕竟俗话所说，计划得周就成功了一半。\n\
  ## 算法\n算法是一组有限的明确指令，执行时能正确完成任务。在这种对算法的描述中有三个特征特征。它们是：\n- 执行任务所需的步骤数应该是有限的。\n\n\n\
