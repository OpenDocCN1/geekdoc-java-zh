  \n![](img/Image00821.gif) `[LO 11.3 H]`\n\n![\n\n![\n\n\n\n\n\n## 引言\n\n指针是 C 语言中的派生数据类型。它是基于\
  \ C 中提供的基本数据类型之一构建的。指针包含内存地址作为值。由于这些内存地址是计算机内存中存储程序指令和数据的位置，因此指针可以访问和操作存储在内存中的数据。\n\
  \n指针无疑是 C 语言中最独特且令人兴奋的特性之一。它为该语言增加了动力和灵活性。虽然对于初学者来说，它们似乎有些困惑且难以理解，但一旦掌握了，它们就是非常强大且实用的工具。\n\
  \n指针在 C 中被频繁使用，因为它们为程序员提供了许多优势。这些包括：\n\n1. 指针可以通过函数参数从函数返回多个值。\n2. 指针允许对函数进行引用，从而便于将函数作为参数传递给其他函数。\n\
  3. 使用指针数组处理字符字符串可以节省内存中的数据存储空间。\n4. 指针让 C 支持动态内存管理。\n5. 指针为操作动态数据结构（如结构体、链表、队列、栈和树）提供了高效的工具。\n\
  \n当然，C 真正的威力在于对指针的正确使用。在本章中，我们将详细研究指针，并说明如何在程序开发中使用它们。第 14 章将研究如何使用指针来创建和管理链表。\n\
  \n## 理解指针\n\n计算机内存是存储单元的顺序集合，如 [图 12.1] 所示。每个单元（通常称为字节，byte）都关联有一个名为“地址”的数字。通常，地址从\
  \ 0 开始连续编号。最后一个地址取决于内存的大小。一个拥有 64 K 内存的计算机系统，其最后一个地址将是 65,535。\n\n![](img/Image00824.gif)\n\
  \n**图 12.1** 内存结构\n\n每当我们声明一个变量时，系统都会在内存的某处分配一个合适的位置来存放变量的值。由于每个字节都有唯一的地址数字，该位置将有它自己的地址数字。考虑以下语句：\n\
  \n![](img/Image00825.gif)\n\n图 12.2 变量的表示\n\n```\nint quantity = 179;\n```\n\n该语句指示系统为整数变量\
  \ `quantity` 寻找一个位置，并将值 179 放在该位置。假设系统为 `quantity` 选择了地址位置 5000。我们可以像 [图 12.2] 所示对其进行表示。（注意，变量的地址是该变量所占用的第一个字节的地址。）\n\
  \n在程序执行期间，系统始终将名称 `quantity` 与地址 5000 关联起来。（这类似于既有门号又有房名。）我们可以通过使用名称 `quantity`\
  \ 或地址 5000 来访问值 179。由于内存地址仅仅是数字，它们可以像其他变量一样被赋值给某些存储在内存中的变量。这些持有内存地址的变量被称为指针变量（pointer\
  \ variables）。因此，指针变量本质无非是一个包含地址的变量，而该地址是内存中另一个变量的位置。\n\n![](img/Image00826.gif)\n\
  \n图 12.3 指针变量\n\n记住，由于指针是一个变量，它的值也存储在内存的另一个位置中。假设我们将 `quantity` 的地址赋值给变量 `p`。变量\
  \ `p` 和 `quantity` 之间的关系可以可视化，如图 12.3 所示。`p` 的地址是 5048。\n\n由于变量 `p` 的值是变量 `quantity`\
  \ 的地址，我们可以通过 `p` 的值来访问 `quantity` 的值，因此我们说变量 `p` “指向”变量 `quantity`。因此，`p` 获得了“指针”（pointer）这一名称。（我们并不真正关心指针变量的实际值。每次运行程序时这些值可能不同。我们关心的是变量\
  \ `p` 和 `quantity` 之间的关系。）\n\n## 指针的底层概念\n\n指针建立在以下三个底层概念之上，如下所示：\n\n![46036.png](img/Image00827.jpg)\n\
  \n计算机内部内存地址被称为指针常量（pointer constants）。我们无法更改它们，只能使用它们来存储数据值。它们就像门号。\n\n我们不能直接保存内存地址的值。我们只能通过地址运算符（`&`）存储在该处的变量来获取值。因此获得的值被称为指针值（pointer\
  \ value）。指针值（即变量的地址）可能会在程序的多次运行之间发生变化。\n\n一旦我们有了指针值，就可以将其存储在另一个变量中。包含指针值的变量被称为指针变量。\n\
  \n# 访问变量的地址\n\n![](img/Image00828.gif)\n\n变量在内存中的实际位置取决于系统，因此我们无法立即得知变量的地址。那么我们如何确定变量的地址呢？这可以通过\
  \ C 语言提供的 `&` 运算符来完成。我们已经在 `scanf` 函数中见过这个地址运算符了。紧跟在变量之前的 `&` 运算符返回与该变量关联的地址。例如，语句：\n\
  \n```\np = &quantity;\n```\n\n该语句将地址 5000（`quantity` 的位置）赋值给变量 `p`。`&` 运算符可以被记忆为“……的地址”（address\
  \ of）。\n\n`&` 运算符只能与简单变量或数组元素一起。以下是地址运算符的非法用法：\n\n1. `&125`（指向常量）。\n2. `&x`（指向数组名）。\n\
  3. `&(x+y)`（指向表达式）。\n\n如果 `x` 是数组，那么像 `&x[0]` 和 `&x[i+3]` 这样的表达式是有效的，代表 `x` 的第 0\
  \ 个和第 i+3 个元素的地址。\n\n![](img/Image00829.gif)\n\n图 12.4 所示程序声明并初始化了变量，然后打印出这些值及其相应的存储位置。注意我们在打印地址时使用了\
  \ `%u` 格式。内存地址是无符号整数。\n\n![](img/Image00830.gif)\n\n图 12.4 访问变量的地址\n\n## 声明指针变量\n\
  \n![](img/Image00831.gif)\n\n在 C 语言中，每个变量必须声明其类型。由于指针变量包含特定的地址，在使用它们之前必须将其声明为指针。指针变量的声明如下：\n\
  \n![](img/Image00832.gif)\n\n这告诉编译器关于变量 `pt_name` 的三个信息：\n\n1. 星号（`*`）告诉变量 `pt_name`\
  \ 是指针变量。\n2. `pt_name` 需要一个内存位置。\n3. `pt_name` 指向 `data_type` 变量。\n\n例如，\n\n```\n\
  int *p; /* 整数指针 */\n```\n\n将变量 `p` 声明为指向整数类型的指针变量。记住，`int` 类型是指所指向变量的类型，而不是指针值的类型。同样，语句：\n\
  \n```\nfloat *x; /* 浮点型指针 */\n```\n\n将 `x` 声明为指向浮点型变量的指针。\n\n声明导致编译器为指针变量 `p` 和\
  \ `x` 分配内存位置。由于这些内存位置尚未分配任何值，它们可能包含某些未知值，因此它们指向未知的位置，如下：\n\n![](img/Image00833.gif)\n\
  \n![](img/Image00834.gif)\n\n## 指针声明样式\n\n指针变量的声明与普通变量相似，区别在于增加了一元运算符 `*`。该符号可以出现在类型名和变量名之间的任何位置。程序员使用以下样式：\n\
  \n![](img/Image00835.gif)\n\n\n\n\n然而，由于以下原因，风格 2 变得越来越流行：\n\n1. 这种风格允许在同一条语句中进行多个声明。例如：\n\
  ```\nint *p, x, *q;\n```\n\n2. 这种风格与访问目标值时的格式一致。例如：\n```c\nint x, *p, y;\nx = 10;\n\
  p = & x;\ny = *p; /* 通过 p 访问 x */\n*p = 20; /* 将 20 赋值给 x */\n```\n\n我们在本书中使用风格\
  \ 2，即：\n```c\nint *p;\n```\n\n## 指针变量的初始化\n\n将变量的地址赋值给指针变量的过程称为 `initialization`（初始化）。如前所述，所有未初始化的指针都具有某些未知的值，这些值会被解释为内存地址。它们可能不是有效地址，或者可能指向某些错误的值。由于编译器不会检测这些错误，带有未初始化指针的程序将产生错误的结果。因此，在程序中使用指针变量之前，仔细初始化它们是非常重要的。\n\
  \n一旦声明了指针变量，我们就可以使用赋值运算符来初始化该变量。示例：\n![](img/Image00836.gif)\n\n我们也可以将初始化与声明结合。也就是说，\n\
  ```c\nint *p = &quantity;\n```\n是允许的。这里的要求是变量 `quantity` 必须在初始化发生之前声明。记住，这是 `p`\
  \ 的初始化，而不是 `*p` 的初始化。\n\n我们必须确保指针变量始终指向对应类型的数据。例如，\n![](img/Image00837.gif)\n将导致错误输出，因为我们正试图将\
  \ `float` 类型变量的地址赋值给一个整数指针。当我们声明一个指针为 `int` 类型时，系统假设该指针持有的任何地址都指向一个整数变量。由于编译器不会检测此类错误，因此应该注意避免错误的指针赋值。\n\
  \n还可以在一步中同时完成数据变量的声明、指针变量的声明以及指针变量的初始化。例如：\n```c\nint x, *p = &x; /* 三合一 */\n```\n\
  这是完全有效的。它将 `x` 声明为整数变量`p` 声明为指针变量，然后将 `p` 初始化为 `x` 的地址。同样记住，目标变量 `x` 是先声明的。以下语句\n\
  ```c\nint *p = &x, x;\n```\n是无效。\n\n我们还可以定义一个初始值为 `NULL` 或 `0`（零）的指针变量。也就是说，以下语句是有效的\n\
  ```c\nint *p = NULL;\nint *p = 0;\n```\n\n## 指针的灵活性\n\n指针是灵活的。我们可以让同一个指针在不同的语句指向不同的数据变量。示例：\n\
  ![](img/Image00838.gif)\n![](img/Image00839.gif)\n\n我们也可以使用不同的指针指向同一个数据变量。示例：\n\
  ```c\nint x;\n```\n![](img/Image00840.gif)\n![](img/Image00841.gif)\n\n除了 `NULL`\
  \ 和 `0` 之外，没有其他常量可以赋值给指针变量。例如，以下是错误的：\n```c\nint *p = 5360; / *绝对地址 */\n```\n\n\
  ## 通过指针访问变量\n\n一旦指针被赋予了变量的地址，问题变成了如何使用指针访问变量的值？这是通过使用另一个一元运算符 `*`（星号）实现的，通常称为间接运算符。间接运算符的另一个名称是\
  \ `dereferencing operator`（解引用运算符）。考虑以下语句：\n![](img/Image00842.gif)\n\n第一行声明 `quantity`\
  \ 和 `n` 为整数变量，`p` 声明为指向整数的指针变量。第二行将值 `179` 赋值给 `quantity`，第三行将 `quantity` 的地址赋值给指针变量\
  \ `p`。第四行包含间接运算符 `*`。当运算符 `*` 放在表达式中的指针变量之前（等号右侧）时，指针返回该指针值作为地址的变量的值。在这种情况下，`*p`\
  \ 返回变量 `quantity` 的值，因为 `p` 是 `quantity` 的地址。可以将 `*` 记住为“地址处的值”。因此，`n` 的值将是 `179`。以下两个语句\n\
  ```c\np = &quantity;\nn = *p;\n```\n等同于\n```c\nn = *&quantity;\n```\n这反过来等同于\n```c\n\
  n = quantity;\n```\n\n在 C 语言中，指针和地址的赋值总是通过符号名称以符号方式完成的。你无法通过编写 `*5368` 来访问存储在地址\
  \ `5368` 处。这不起作用。程序 12.2 说明了指针值与其所指向的值之间的区别。\n![](img/Image00843.gif)\n\n程序和输出如图\
  \ 12.5 所示。程序清楚地显示了我们如何使用指针访问变量的值。你可能会注意到指针 `ptr` 的值为 `4104`，而它指向的值是 `10`。此外，你可能还会注意到以下等价关系：\n\
  ```\nx = *(&x)\n```\nptr = 4104\n[此处原文似乎有乱码] * 错误]\n\n\n\n我们不能在除法或乘法中使用指针。例如，如下的表达式\n\
  \n`p1 / p2` 或 `p1 * p2` 或 `p1 / 3`\n\n是不允许的。同样，两个指针不能相加。也就是说，`p1 + p2` 是非法的。\n\n\
  ![](img/Image00854.gif)\n\n图 12.7 中的程序展示了如何在表达式中直接指针变量。它还说明了表达式的求值顺序。例如，表达式\n\n\
  `4* – *p2 / *p1 + 10`\n\n求值如下：\n\n```\n((4 * (–(*p2))) / (*p1)) + 10\n```\n\n当 `*p1\
  \ = 12` 且 `*p2 = 4` 时，该表达式的值为 `9`。记住，由于所有变量类型均为 `int`，整个求值过程都是使用整数运算完成的。\n\n![](img/Image00855.gif)\
  \ ![](img/Image00856.gif)\n\n图 12.7 指针表达式的求值\n\n### 指针递增与比例因子\n\n我们已经看到指针可以这样递增：\n\
  \n```\np1 = p2 + 2;\np1 = p1 + 1;\n```\n\n以此类推。但记住，像这样的表达式\n\n```\np1++;\n```\n\n\
  会导致指针 `p1` 指向其类型的下一个值。例如，如果 `p1` 是一个初始值为（例如）2800`的整数指针，那么在执行操作 `p1 = p1 + 1` 后，`p1`\
  \ 的值将是 `2804` 而不是 `2801`。也就是说，当我们递增指针时，它的值增加的是它所指向的数据类型的“长度”（假设在 32 位计算机中，`int`\
  \ 是 4 字节类型）。这种长度被称为**比例因子**（scale factor）。对于 32 位计算机，各种数据类型的长度如下：\n\n![](img/Image00857.gif)\n\
  \n![](img/Image00858.gif)\n\n存储各种数据类型所使用的字节数取决于系统，可以通过使用 `sizeof` 运算符来找到。例如，如果 `x`\
  \ 是一个变量，那么 `sizeof(x)` 返回该变量所需的字节数。（32 位系统使用 4 字节存储整数，使用 2 字节存储短整数）。\n\n### 指针操作规则\n\
  \n在对指针变量执行操作时，适用以下规则：\n\n1. 指针变量可以被赋值另一个变量的地址。\n2. 指针变量可以赋值另一个指针变量的值。\n3. 指针变量可以用\
  \ `NULL` 或零值初始化。\n4. 指针变量可以使用前置或后置递增/递减运算符。\n5. 指针变量可以加或减一个整数值。\n6. 当两个指针指向同一个数组时，一个指针变量可以减去另一个。\n\
  7. 当两个指针指向相同数据类型的对象时，可以使用关系运算符对其进行比较。\n8. 指针变量不能乘以常数。\n9. 两个指针变量不能相加。\n10. 不能不能赋值给任意地址（即，`&x\
  \ = 10;` 是非法的）。\n\n## 指针与数组\n\n![](img/Image00859.gif)\n\n当声明数组时，编译器会分配一个基地址和足够的存储空间，以在连续的内存位置包含数组的所有元素。基地址是数组第一个元素（索引\
  \ 0）的位置。编译器还将数组名定义为指向第一个元素的常量指针。假设我们如下声明一个数组 `x`：\n\n```\nint x[5] = {1, 2, 3, 4,\
  \ 5};\n```\n\n假设 `x` 的地址为 `1000`，且假设每个整数需要 4 字节，这五个元素将如下存储：\n\n![](img/Image00860.gif)\n\
  \n名称 `x` 被定义为指向第一个元素 `x[0]` 的常量指针，因此 `x` 的值为 `1000`，即 `x[0]` 存储的位置。也就是说：\n\n```\n\
  x = &x[0] = 1000\n```\n\n如果我们将 `p` 为整数指针，可以通过以下赋值让指针 `p` 指向数组 `x`：\n\n```\np = x;\n\
  ```\n\n这等同于\n\n```\np = &x[0];\n```\n\n现在，我们可以使用 `p++` 从一个元素移动到另一个元素，从而访问 `x` 的每一个值。`p`\
  \ 和 `x` 之间的关系所示：\n\n```\np = &x[0] (= 1000)\np + 1 = &x[1] (= 1004)\np + 2 = &x[2]\
  \ (= 1008)\np + 3 = &x[3] (= 1012)\np + 4 = &x[4] (= 1016)\n```\n\n你可能会注意到，元素的地址是通过其索引和数据类型的比例因子计算的。例如，\n\
  \n![](img/Image00861.gif)\n\n在处理数组时，可以使用指针代替数组索引来访问元素。注意 `*(p+3)` 就是 `x[3]` 的值。\n\
  \n练习 12.4 展示了指针访问方法的使用。\n\n![](img/Image00862.gif)\n\n### 指针与字符串\n\n我们在第 8 章中已经看到，字符串被视为字符数组处理，因此它们的声明和初始化如下：\n\
  \n```\nchar str [5] = “good”;\n```\n\n编译器会自动在字符串末尾插入空字符 `\\0`。C 支持另一种使用 `char` 指针变量创建字符串的方法。例如：\n\
  \n```\nchar *str = “good”;\n```\n\n这为字面量创建了一个字符串，然后将其地址存储在指针变量 `str` 中。指针 `str`\
  \ 现在指向字符串“good”的第一个字符：\n\n![](img/Image00868.gif)\n\n我们还可以使用运行时赋值为字符串指针赋值。例如：\n\n\
  ```\nchar * string1;\nstring1 = “good”;\n```\n\n注意，赋值 `string1 = “good”;` 不是字符串拷贝，因为变量\
  \ `string1` 是一个指针而不是字符串。（正如第 9 章所述，C 不支持通过赋值操作将一个字符串拷贝到另一个字符串。）\n\n我们可以使用 `printf`\
  \ 或 `puts` 函数打印字符串 `string1` 的内容：\n\n```\nprintf(\"%s”, string1);\nputs (string1);\n\
  ```\n\n记住，虽然 `string1` 是指向字符串的指针，但它也是字符串的名称。因此，这里我们不需要使用间接运算符 `*`。\n\n就像一维数组一样，我们可以使用指针来访问字符串中的单个字符。这通过练习\
  \ 12.5 所示。\n\n![](img/Image00869.gif)\n\n计算字符串长度的程序所示图 12.10 中。语句\n\n```\nchar *cptr\
  \ = name;\n```\n\n![](img/Image00870.gif)\n\n图 12.10 通过指针处理字符串\n\n\n\n\n将 `cptr`\
  \ 声明为指向字符的指针，并将 `name` 第一个字符的地址赋值为它的初始值。由于字符串始终以空字符终止，该语句\n\n```c\nwhile(*cptr !=\
  \ ‘\\0’)\n```\n\n将一直成立，直到到达字符串结束。\n\n当 `while` 循环结束时，指针 `cptr` 持有空字符的地址。因此，语句\n\n\
  ```\nlength = cptr – name;\n```\n\n给出了字符串 `name` 的长度。\n\n![](img/Image00871.gif)\n\
  \n输出还显示了每个字符的地址位置。注意，每个字符占用一个内存单元（字节）。\n\n在 C 语言中，常量字符字符串始终代表指向该字符串的指针。因此，以下语句是有效的：\n\
  \n```c\nchar *name;\nname = “Delhi”;\n```\n\n这些语句将 `name` 声明为指向字符的指针，并将常量字符字符串 `“Delhi”`赋值给\
  \ `name`。你可能记得这种赋值不适用于字符数组。如下的语句\n\n```c\nchar name[20];\nname = “Delhi”;\n```\n\
  \n是不起作用的\n\n## 指针数组\n\n指针的一个重要用途是处理字符串表。考虑以下字符串数组：\n\n```c\nchar name [3][25];\n\
  ```\n\n这表示 `name` 是一个包含三个名称的表，每个名称的最大长度为 25 个字符（包括空字符）。`name` 表的总存储需求为 75 字节。\n\n\
  ![45527.png](img/Image00872.jpg)\n\n我们知道，各个字符串的长度很少相相等。因此，与其让每行具有固定数量的字符，我们可以将其变为指向变变长度字符串的指针。例如，\n\
  \n![](img/Image00873.gif)\n\n`将 name 声明为指向三个字符指针的数组，每个指针指向一个特定的名称，如下:`\n\n![](img/Image00874.gif)\n\
  \n此声明仅分配了 28 字节，足以容纳所示的所有字符\n\n![](img/Image00875.gif)\n\n以下语句将打印所有三个名称：\n\n![](img/Image00876.gif)\n\
  \n要访问第 `ith` 个名称中的第 `jth` 个字符，我们可以写为\n\n```c\n*(name[i]+j)\n```\n\n行长度各异的字符数组被称为“锯齿数组”（ragged\
  \ arrays），用指针处理更好。\n\n记住符号 `*p[3]` 和 `(*p)[3]` 之间的区别。由于 `*` 的优先级低于 `[ ]`，`*p[3]`\
  \ 将 `p` 声明为包含 3 个指针的数组，而 `(*p )[ 3 ]` 将 `p` 声明为指向包含三个元素的数组指针。\n\n![](img/Image00877.gif)\n\
  \n## 返回多个值的函数\n\n到目前为止，我们已经说明了使用 `return` 语句仅返回一个值的函数。这是因为 `return` 语句只能返回一个值。然而，假设我们想从函数获取更多信息。在\
  \ C 语言中，我们可以利用参数不仅用于接收信息，还用于向调用函数传回信息。用于“发送”信息的参数被称为输出参数。\n\n通过参数传回信息的机制是通过所谓的地址操作符\
  \ `&` 和间接操作符 `*` 实现的。让我们考虑一个例子来来说这一点。\n\n![](img/Image00878.gif)\n\n实际参数 `x` 和 `y`\
  \ 是输入参数，`s` 和 `d` 是输出参数。在函数调用中，虽然我们将 `x` 和 `y` 的实际值传递给函数，但我们传递的是内存中存储 `s` 和 `d`\
  \ 值位置的地址。（这就是为什么操作符 `&` 被称为地址操作符。）当函数被调用时，发生了以下赋值：\n\n![](img/Image00879.gif)\n\n\
  注意，在 `sum` 和 `diff` 的声明中，间接操作符 `*` 表示这些变量将存储地址，而不是变量的实际值。现在，变量 `sum` 和 `diff` 分别指向\
  \ `s` 和 `d` 的内存位置。\n\n（操作符 `*` 被称为间接操作符，因为它通过地址提供了对变量的间接引用。）\n\n在函数体中，我们有两个语句：\n\
  \n* `sum = a+b;`\n* `diff = a-b;`\n\n第一条将 `a` 和 `b` 的值相加并将结果存储在 `sum` 指向的内存位置。记住，这个内存位置与\
  \ `s` 的内存位置相同。因此，存储在 `sum` 指向的位置中的值就是 `s` 的值。\n\n同样，`a–b` 的值存储在 `diff` 指向的位置，该位置与\
  \ `d` 相同。在函数调用实现后，`s` 的值为 `a+b`，`d` 的值为 `a–b`。输出将是：\n\n```\ns = 30\nd = 10\n```\n\
  \n变量 `*sum` 和 `*diff` 被称为指针，`sum` 和 `diff` 被称为指针变量。由于它们被声明为 `int`，它们可以指向 `int` 类型数据的位置。\n\
  \n将指针变量作为实际参数用于函数之间的数据通信被称为“指针传递”（pass by pointers）或“按地址或引用调用”（call by address or\
  \ reference）。\n\n### 指针传递的规则\n\n1. 实际参数和形式参数的类型必须相同。\n2. 实际参数（函数调用中）必须是调用函数局部变量的地址。\n\
  3. 函数头中的形式参数必须以间接操作符 `*` 前缀。\n4. 在原型中，参数必须以符号 `*` 为缀。\n5. 要访问被调用函数中实际参数的值，我们必须使用间接操作符\
  \ `*`。\n\n### 按值传递与指针传递\n\n用于从一个函数传递数据到另一个函数的技术被称为参数传递。参数传递可以通过以下方式进行：\n\n* 按值传递（也称为按值调用）。\n\
  * 指针传递（也称为按指针调用）。\n\n在按值传递中，实际参数的值被复制到被调用函数的参数列表中。被调用函数在副本上工作而不是在原始值上工作。这确保了调用函数中的原始数据不会被改变。\n\
  \n在指针传递中（也称为按地址传递），发送到被调用的是变量的内存地址而不是值的副本。在这种情况下，被调用函数直接处理调用函数中的数据，改变后的值在调用函数中是可见。\n\
  \n指针传递方法通常用于操作数组和字符串。当我们要求被调用函数返回多个值时，也会使用这种方法。\n\n## 指针作为函数参数\n\n![](img/Image00880.gif)\n\
  \n我们之前已经看到，当数组作为参数传递给函数时，传递的只是数组第一个元素的地址，而不是数组元素的实际值。如果 `x` 是一个数组，当我们调用 `sort(x)`\
  \ 时，`x[0]` 的地址被传递给函数 `sort`。函数使用该地址来操作数组元素。同样，我们可以以普通方式将变量的地址作为参数传递给函数。我们在讨论返回多个值的函数时使用过这种方法。\n\
  \n当我们向函数传递地址时，接收地址的参数应该是指针。使用指针传递变量地址调用函数的过程被称为“引用调用”（call by reference）。（你知道，传递变量实际值的过程被称为“按值调用”。）按“引用”调用的函数可以改变调用中变量的值。\n\
  \n考虑以下代码：\n\n![](img/Image00881.gif)\n\n当函数 `change( )` 被调用时，变量 `x` 的地址而不是其值被传递到函数\
  \ `change()` 。在 `change( )` 内部，变量 `p` 被声明为指针，因此 `p` 是变量 `x` 的地址。语句\n\n```c\n*p =\
  \ *p + 10;\n```\n\n意味着“给存储在地址 `p` 处的值加 10”。由于 `p` 代表 `x` 的地址，`x` 的值从 20 变为了 30。因此，程序的输出将是\
  \ 30 而不是 20。\n\n![](img/Image00882.gif)\n\n\n\n\n\n图 12.11 中的程序展示了如何使用地址位置交换两个位置的内容。`exchange()`\
  \ 函数接收变量 `x` 和 `y` 的地址并交换它们的内容。\n\n![](img/Image00883.gif) ![](img/Image00884.gif)\n\
  \n图 12.11 作为函数参数传递指针\n\n你可能会留到以下几点：\n\n1. 函数参数被声明为指针。\n2. 在函数体内使用了对指针的解引用。\n3. 当调用函数时，地址作为实际参数传递。\n\
  \n在 C 语言中，使用指针访问数组元素是非常常见的。我们在程序 12.4 中已经使用了指针来遍历数组元素。我们也可以在设计第 9 章讨论的用户定义函数时使用这种技术。让我们考虑一下程序\
  \ 9.6 中讨论的整数数组排序问题。\n\n`sort` 函数可以使用指针（而不是数组索引）来编写，如下所示：\n\n![](img/Image00885.gif)\n\
  \n注意，我们使用了指针 `x`（而不是数组 `x[ ]`）来接收传递的数组地址，因此指针 `x` 可被用于访问数组元素（如第 12.10 节所示）。该函数可以如下对整数数组进行排序：\n\
  \n![](img/Image00886.gif)\n\n调用函数必须使用以下原型声明。\n\n```\nvoid sort (int, int *);\n```\n\
  \n这告诉编译器，接收数组的形式形参数是一个指针，而不是数组变量。\n\n指针参数常用于字符串函数。考虑将一个字符串拷贝到另一个字符串的 `copy` 函数。\n\
  \n![](img/Image00887.gif)\n\n该函数将 `s2` 的内容复制到字符串 `s1` 中。参数 `s1` 和 `s2` 是指向字符字符串的指针，它们的初始值从调用函数传递。例如，调用语句\n\
  \n```\ncopy(name1, name2);\n```\n\n会将 `name1` 第一个元素的地址赋值给 `s1`，并将 `name2` 第一个元素的地址赋值给\
  \ `s2`。\n\n注意 `*s2++` 的值是 `s2` 在自增之前所指向的字符。由于使用了后置 `++`，`s2` 只在获取当前值后才会递增。同样，`s1`\
  \ 只在赋值完成后才会递增。\n\n每个字符在被复制后都会与 `'\\0'` 进行比较，因此一旦复制到 `'\\0'`，复制就会终止。\n\n![](img/Image00888.gif)\
  \ ![](img/Image00889.gif) ![](img/Image00890.gif)\n\n图 12.12 使用引用传递方法传递参数的程序\n\n\
  ## 返回指针的函数\n\n到目前为止，我们看到函数可以通过名称返回单个值，或者通过指针参数返回多个值。由于指针是 C 语言中的数据类型，我们也可以强制函数返回一个指向调用函数的指针。考虑以下代码：\n\
  \n```\nint *larger (int *, int *); /* 原型 */\n```\n\n![](img/Image00891.gif)\n\n\
  `larger` 函数接收变量 `a` 和 `b` 的地址，使用指针 `x` 和 `y` 判断哪一个较大，然后返回其位置的地址。返回的值随后赋值给调用函数中的指针变量\
  \ `p`。在这种情况下，返回了 `b` 的地址并赋值给 `p`，因此输出将是 `b` 的值，即 20。\n\n注意，返回的地址必须是调用函数中变量的地址。返回被调用函数局部局部的指针是错误的。\n\
  \n## 函数指针\n\n函数和变量一样，在内存中有一个类型和一个地址位置。因此，可以声明一个指向函数的指针，该指针随后可以作为另一个函数的参数。函数指针的声明如下：\n\
  \n```\ntype (*fptr) ();\n```\n\n这告诉编译器 `fptr` 是一个指向函数的指针，该函数返回 `type` 类型的值。`*fptr`\
  \ 外的括号是必要的。记住，这样的语句\n\n```\ntype *gptr();\n```\n\n会将 `gptr` 声明为一个返回 `type` 指针的函数。\n\
  \n我们可以通过将函数名赋值给指针，使函数指针指向特定的函数。例如，以下语句\n\n```\ndouble mul(int, int);\ndouble (*p1)();\n\
  p1 = mul;\n```\n\n将 `p1` 声明为指向函数的指针，将 `mul` 声明为函数，然后让 `p1` 指向 `mul` 函数。要调用 `mul`\
  \ 函数，我们现在可以使用指针 `p1` 配合参数列表。即：\n\n```\n(*p1)(x,y) /* 函数调用 */\n```\n\n等同于\n\n```\n\
  mul(x,y)\n```\n\n注意 `*p1` 周围的括号。\n\n![](img/Image00892.gif)\n\n在给定值范围内打印函数值的程序在图\
  \ 12.13 所示。该程序通过评估由 main 传递的函数来进行打印。\n\n![](img/Image00893.gif) ![](img/Image00894.gif)\n\
  \n图 12.13 函数指针的使用\n\n在 `table` 中，我们将参数 `f` 声明为指向函数的指针：\n\n```\ndouble (*f)();\n\
  ```\n\n函数的返回值是 `double` 类型。当调用 `table` 时，语句\n\n```\ntable(f);\n```\n\n我们传递了一个函数指针。注意\
  \ `f` 后面没有参数。同样，语句\n\n```\nvalue = (*f)(a);\n```\n\n调用了 `f` 所指向的函数 `a`。\n\n## 兼容性与转换\n\
  \n声明为指针的变量不仅仅是一个指针类型。它还是指向特定数据类型的指针，例如字符。（注：此处为逻辑流）。\n\n## 指针与结构体\n\n我们知道数组名代表其第一个元素的地址。结构体数组名也是如此。假设\
  \ `product` 是一个结构体类型的数组。`product` 名称代表其第一个元素的地址。考虑以下声明：\n\n![](img/Image00895.gif)\n\
  \n该语句将 `product` 声明为包含两个元素的数组，每个元素均为 `struct inventory`，并将 `ptr` 声明为指向 `struct inventory`\
  \ 类型对象的指针。赋值语句\n\n```\nptr = product;\n```\n\n会将 `product` 元素的地址赋值给 `ptr`。也就是说，指针\
  \ `ptr` 现在将指向 `product[0]`。其成员可以通过以下表示法访问：\n\n```\nptr->name\nptr->number\nptr->price\n\
  ```\n\n符号 `->` 称为箭头（也称为成员选择运算符），由一个减号和一个大于号组成。注意 `ptr->` 仅仅是 `product[0]` 的另一种写法。\n\
  \n\n\n\n当指针 `ptr` 增加 1 时，它将指向下一个记录，即 `product[1]`。接下来的 `for` 语句将打印 `product` 数组中所有元素成员的值。\n\
  \n![](img/Image00896.gif)\n\n我们也可以使用以下符号：\n\n```\n(*ptr).number\n```\n\n来访问成员 `number`。在\
  \ `*ptr` 周围加上括号是必要的，因为成员运算符 `.` 的优先级高于运算符 `*`。\n\n![](img/Image00897.gif)\n\n图中展示了使用结构指针操作结构体数组元素的程序（图\
  \ 12.14）。该程序突显了上述讨论的所有特征。注意，指针 `ptr`（类型为 `struct invent`）也被用作 `for` 循环的控制索引。\n\n\
  ![](img/Image00898.gif)\n\n图 12.14 指向结构变量的指针\n\n在使用结构指针时，我们应该注意运算符的优先级。\n\n`->`\
  \ 和 `.` 以及 `()` 和 `[]` 在运算符中具有最高优先级。它们与操作数结合得非常紧密。例如，给定定义：\n\n![](img/Image00899.gif)\n\
  \n那么语句\n\n```\n++ptr->count;\n```\n\n增加的是 `count`而不是 `ptr`。然而，\n\n```\n(++ptr)->count;\n\
  ```\n\n先增加 `ptr`，然后链接 `count`。语句\n\n```\nptr++ -> count;\n```\n\n是合法的，并在访问 `count`\
  \ 之后增加 `ptr`。\n\n接下来的语句也以类似的方式运行。\n\n![](img/Image00900.gif)\n\n在上节中，我们讨论了将结构作为参数传递给函数。我们还看到一个示例，其中函数接收整个结构的拷贝并在对其进行处理后返回它。正如我们之前提到的，这种方法在执行速度和内存方面都是低效的。我们可以通过传递指向结构的指针，然后使用该指针操作结构成员来克服这一缺点。考虑以下函数：\n\
  \n![](img/Image00901.gif)\n\n该函数可以通过以下方式调用：\n\n```\nprint_invent(&product);\n```\n\
  \n形式参数项接收结构 `product` 的地址，因此它必须被声明为类型 `struct invent` 的指针，这代表 `product` 的结构。\n\n\
  ![](img/Image00902.gif)\n\n## 指针问题 (#text00006.html_ch12-20a)\n\n指针赋予我们巨大的力量和灵活性。然而，当使用不当时，它们可能会变成一场噩梦。错误使用指针的主要问题是，在大多数情况下编译器可能检测不到错误，因此程序可能会产生意外的结果。输出可能没有提供任何关于使用错误指针的线索。因此，调试变成了一项困难的任务。\n\
  \n我们在这里列出了一些程序员经常犯的指针错误。\n\n- 给未初始化的指针赋值\n  ```c\n  int * p, m = 100 ;\n  *p = m;\
  \ /* 错误 */\n  ```\n- 给指针变量赋值\n  ```c\n  int *p, m = 100 ;\n  p = m; /* 错误 */\n \
  \ ```\n- 需要时未对指针进行解引用\n  ```c\n  int *p, x = 100;\n  p = &x;\n  printf(“%d”,p);\
  \ /* 错误 */\n  ```\n- 将未初始化变量的地址赋值\n  ```c\n  int m, *p\n  p = &m; /* 错误 */\n  ```\n\
  - 比较指向不同对象的指针\n\n![](img/Image00903.gif)\n\n在使用指针之前，我们必须正确地声明并为指针赋值。我们还必须确保正确地对指针应用地址运算符\
  \ `&` 和引用运算符 `*`。这将使我们免于彻夜不眠。\n\n## 核心概念 (#text00006.html_ch12-21a)\n\n- **内存**：这是存储单元的顺序集合，每个单元都有一个关联的地址值。[LO\
  \ 12.1]\n- **指针**：它用于存储内存地址作为值。[LO 12.1]\n- **指针变量**：它是存储另一个变量内存地址的变量。[LO 12.2]\n\
  - **引用传递**：使用指针传递变量地址来调用函数的过程。[LO 12.6]\n- **值传递**：传递变量实际值的过程。[LO 12.6]\n\n## 务必记住\
  \ (#text00006.html_ch12-22a)\n\n- 指针变量中只能存储变量的地址。[LO 12.1]\n- 不要将一种类型的变量地址存储到另一种类型的指针变量中。[LO\
  \ 12.1]\n- 变量的值不能赋值给指针变量。[LO 12.1]\n- 一个非常常见的错误是在某些地方使用（或不使用）地址运算符（`&`）和间接运算符（`*`）。小心。编译器可能不会警告此类错误。[LO\
  \ 12.1]\n- 记住指针变量的定义只为指针变量分配内存，而不为它指向的变量分配内存。[LO 12.1]\n- 指针变量在初始化之前包含垃圾值。因此，在赋值变量地址之前，我们不能使用指针变量。[LO\
  \ 12.2]\n- 将数值常量赋值给指针变量是一个错误。[LO 12.2]\n\n## 简案例 (#text00006.html_ch12-23a)\n\n\
  ### 1. 成绩处理 (LO 12.2, 12.5, 12.6 H)\n\n一批学生在年终考试中的成绩如下所示：\n\n![](img/Image00904.gif)\n\
  \n需要计算每个学生的总分并根据总分打印排名表。图 12.15 程序将学生姓名存储在 `name` 数组中，将成绩存储在 `marks` 数组中。在计算所有学生的总分后，程序准备并打印排名表。声明\n\
  \n```c\nint marks[STUDENTS][SUBJECTS+1];\n```\n\n将 `marks` 定义为数组第一行的指针。我们使用 `rowptr`\
  \ 作为指向行的指针。`rowptr` 初始化如下：\n\n```c\nint (*rowptr)[SUBJECTS+1] = array;\n```\n\n\
  注意 `array` 是形式参数，其值会被实际参数的值替换。`rowptr` 周围的括号使得 `rowptr` 成为 `SUBJECTS+1` 个整数数组的指针。记住，语句\n\
  \n```c\nint *rowptr[SUBJECTS+1];\n```\n\n会将 `rowptr` 声明为 `SUBJECTS+1` 个元素的数组。\n\n\
  当我们增加 `rowptr`（通过 `rowptr+1`）时，增加是按数组每行的大小为单位进行的，使得 `rowptr` 指向下一行。由于 `rowptr` 指向特定行，`(*rowptr)[x]`\
  \ 指向行的第 `x` 个元素。\n\n![](img/Image00905.gif) ![](img/Image00906.gif) ![](img/Image00907.gif)\
  \ ![](img/Image00908.gif)\n\n图 12.15 级排名表的准备\n\n### 2. 库存更新 (LO 12.2, 12.6 M)\n\n\
  商店中库存的价格和数量每天都会变化。它们可能会增加或减少。图 12.16 程序读取价格和数量的增量值，并计算库存物品的总值。\n\n\n\n\n该程序演示了将结构体指针作为函数参数的使用。`&item`\
  \ 是结构体项目的地址，被传递给函数 `update()` 和 `mul()`。接收 `&item` 值的形式参数 `product` 和 `stock` 被声明为\
  \ `struct stores` 类型的指针。\n\n![](img/Image00909.gif) ![](img/Image00910.gif)\n\n\
  图 12.16 结构体指针作为函数参数的使用\n\n## 单选题\n\n为以下每个单选题选择正确答案：\n\n12.1 C 语言中的指针是 [LO 12.1 E]\n\
