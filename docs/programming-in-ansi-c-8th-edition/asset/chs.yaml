  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n```\nEnter data number 1 : 40\nEnter data\
  \ number 3 : 78\n```\n在编写算法和程序时，假设用户输入的元素个数大于或等于 1。通过检查用户在步骤 1 中输入的数字是否大于或等于 1，可以使逻辑更加健壮。如果输入了无效数字，可能会显示适当的提示。\n\
