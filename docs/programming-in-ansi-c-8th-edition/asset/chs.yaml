  \ 使用什么种格式说明符来打印指针的地址？[LO 12.1 M]\n\n### 12.2 什么是二级指针？[LO 12.3 E]\n\n### 12.3 下述代码的输出是什么：\n\
  ```\nchar *ptr;\nprintf(\"%d %d\",sizeof(*ptr),sizeof(ptr));\n```\n[LO 12.4 H]\n\
  \n### 12.4 什么是空指针？[LO 12.1 E]\n\n### 12.5 什么是函数指针？[LO 12.6 E]\n\n### 12.6 什么是空指针？[LO\
  \ 12.4 E]\n\n### 12.7 未初始化指针和空指针之间的区别是什么？[LO 12.1 M]\n\n## 引言\n\n到为止，我们一直使用如 `scanf`\
  \ 和 `printf` 等函数来读写数据。这些是面向控制台的 I/O 函数，始终使用终端（键盘和屏幕）作为目标。只要数据量小，这种方法就能正常工作。然而，许多现实问题涉及大量数据，在这种情况下，面向控制台的\
  \ I/O 操作带来了两个主要问题：\n\n1. 通过终端处理大量数据变得繁琐且耗时。\n2. 当程序终止或计算机关闭时，所有数据都会丢失。\n\n因此，需要一种更灵活的方法，可以将数据存储在磁盘上，并在需要时读取，而不会破坏数据。这种方法利用文件的概念来存储数据。文件是磁盘上存储一组相关数据的地方。与大多数其他语言一样，C\
  \ 语言支持许多能够执行基本文件操作的函数，包括：\n\n- 命名文件，\n- 打开文件，\n- 从文件中读取数据，\n- 向文件中写入数据，以及\n- 关闭文件。\n\
  \n在 C 语言中执行文件操作有两种截然不同的方法。第一种称为低级 I/O，使用 UNIX 系统调用。第二种方法称为高级 I/O 操作，使用 C 标准 I/O\
  \ 库中的函数。我们将在本章中讨论 C 库提供的重要文件处理函数。它们列在表 13.1 中。\n\n**表 13.1** 高级 I/O 函数\n\n![](img/Image00921.gif)\n\
  \n还有许多其他函数。但并非所有函数都被所有编译器支持。在使用特定的 I/O 函数之前，你应该检查你的 C 语言库。\n\n## 定义和打开文件\n\n![](img/Image00922.gif)\n\
  \n如果我们想在次级内存文件中存储数据，我们必须向操作系统指定关于文件的某些信息。这些包括：\n\n1. 文件名\n2. 数据结构\n3. 目的\n\n文件名是组成操作系统有效文件名的字符字符串。它可能包含两个部分：主名和一个可选的带扩展名的点。例如：`Input.data`、`store`、`PROG.C`、`Student.c`、`Text.out`。\n\
  \n文件的数据结构在标准 I/O 函数定义库中定义为 `FILE`。因此，在使用所有文件之前，应将其声明为 `FILE` 类型。`FILE` 是一个定义的数据类型。\n\
  \n当我们打开文件时，必须指定我们想对文件执行的操作。例如，我们可以向文件写入数据或读取已存在的数据。\n\n以下是声明和打开文件的通用格式：\n\n![](img/Image00923.gif)\n\
  \n第一条语句将变量 `fp` 声明为“指向 `FILE` 类型的指针”。如前所述，`FILE` 是 I/O 库中定义的结构体。第二条语句打开名为 `filename`\
  \ 的文件，并为 `FILE` 类型指针 `fp` 分配一个标识符。该指针包含了文件的所有信息，随后作为系统与程序之间的通信链路。\n\n第二条语句还指定了打开此文件的目的。`mode`\
  \ 负责这项工作。`mode` 可以是以下之一：\n\n- `r` 只读模式打开文件。\n- `w` 以只写模式打开文件。\n- `a` 以追加（或添加）数据的方式打开文件。\n\
  \n注意，`filename` 和 `mode` 都是作为字符串指定的。它们应该包含在双引号中。\n\n尝试打开文件时，可能会发生以下情况之一：\n\n1. 当模式为“写入”时，如果文件不存在，将创建一个指定名称的文件。如果文件已存在，则内容将被删除。\n\
  2. 当目地为“追加”时，如果文件不存在，将创建一个指定名称的文件。\n3. 如果目的是“读取”且文件不存在，则会发生错误。\n\n考虑以下语句：\n![](img/Image00924.gif)\n\
  \n许多现代编译器包含额外的操作模式。它们包括：\n\n- `r+` 从文件开始读写打开现有文件。\n- `w+` 与 `w` 相同，用于读写。\n- `a+`\
  \ 与 `a` 相同，用于读写。\n\n## 关闭文件\n\n在完成文件操作后必须关闭文件。这确保了与文件相关的所有信息都从缓冲区刷新，并断开与文件的连接。另一个需要关闭文件的情况是我们想要以不同的模式重新打开同一个文件时。I/O\
  \ 库支持实现此此函数。其格式如下：\n\n```\nfclose(file_pointer);\n```\n\n这将关闭与 `FILE` 指针 `file_pointer`\
  \ 相关的文件。查看以下程序段：\n\n![](img/Image00926.gif)\n\n该程序打开两个文件并在操作完成后关闭它们。一旦文件关闭，其文件指针就可以重用于另一个文件。\n\
  \n事实上，当程序终止时，所有文件都会关闭。然而，在完成文件操作后关闭它是良好的编程习惯。\n\n## 文件的输入输出操作\n\n![](img/Image00927.gif)\n\
  \n一旦打开文件，可以使用表 13.1 中列出的标准 I/O 例程进行读取或写入。\n\n### getc 和 putc 函数\n\n简单的文件 I/O 函数是\
  \ `getc` 和 `putc`。它们类似于 `getchar` 和 `putchar` 函数，一次处理一个字符。假设文件以 `w` 模式打开，文件指针为 `fp1`。那么，语句\n\
  \n```\nputc(c, fp1);\n```\n\n会将字符变量 `c` 中的字符写入与 `FILE` 指针 `fp1` 相关的文件。同样，`getc`\
  \ 用于从以读模式打开的文件读取字符。例如，语句\n\n```\nc = getc(fp2);\n```\n\n![](img/Image00928.gif)\n\
  \n将从文件指针为 `fp2` 的文件中读取一个字符。\n\n每次执行 `getc` 或 `putc` 操作，文件指针都会移动一个位置。当到达文件末时，`getc`\
  \ 将返回文件结束标记 `EOF`。因此，当遇到 `EOF` 时应终止读取。\n\n\n\n\n\n一个程序以及相关的输入输出数据如图 13.1 所示。我们通过键盘输入输入数据，程序将逐个字符地将其写入文件\
  \ `INPUT` 中。数据的结束通过输入 `EOF` 字符来指示，在参考系统中该字符是 `control-Z`。（在其他系统中这可能是 `control-D`。）在接收此信号时，`INPUT`\
  \ 文件被关闭。\n\n![](img/Image00930.gif)\n\n![](img/Image00931.gif)\n\n**图 13.1** 文件上面向字符的读写操作\n\
  \n再次打开 `INPUT` 文件进行读取。程序随后逐个字符地读取其内容，并将其显示在屏幕上。当 `getc` 遇到文件结束标记 `EOF` 时，读取终止。\n\
  \n测试文件结束条件是非常重要的。任何越文件结尾读取的尝试都可能导致程序带错误终止，或者导致无限循环的情况。\n\n### `getw` 和 `putw` 函数\n\
  \n`getw` 和 `putw` 是面向整数的函数。它们与 `getc` 和 `putc` 函数相似，用于读取和写入整数值。当我们只处理整数数据时，这些函数将非常有用。`getw`\
  \ 和 `putw` 的通用形式如下：\n\n![](img/Image00932.gif)\n\n练习题 13.2 演示了 `putw` 和 `getw` 函数的使用。\n\
  \n![](img/Image00933.gif)\n\n程序如图图 13.2 所示。它同时使用三个文件，因此我们需要定义三个文件指针 `f1`、`f2` 和\
  \ `f3`。\n\n首先，创建包含整数值的 `DATA` 文件。整数值从终端读取，并通过以下语句写入 `DATA` 文件：\n\n```c\nputw(number,\
  \ f1);\n```\n\n注意，当我们输入 –1 时，读取终止且文件被关闭。下一步是打开所有三个文件：用于读取的 `DATA`以及用于写入的 `ODD` 和\
  \ `EVEN`。通过函数 `getw(f1)` 逐整数读取 `DATA` 文件的内容，并在适当测试后将其写入 `ODD` 或 `EVEN` 文件。注意，语句\n\
  \n```c\n(number = getw(f1)) != EOF\n```\n\n读取一个值，将其赋值给 `number`，然后测试是否到达文件结束。\n\n\
  最后，程序显示 `ODD` 和 `EVEN` 文件的内容。需要注意的是，用于写入的 `ODD` 和 `EVEN` 文件在重新打开用于读取之前会被关闭。\n\n\
  ![](img/Image00934.gif)\n\n![](img/Image00935.gif)\n\n**图 13.2** 整数数据操作\n\n### `fprintf`\
  \ 和 `fscanf` 函数\n\n到为止，我们看到的都是一次只能处理一个字符或一个整数的函数。大多数编译器都支持另外两个函数，即 `fprintf` 和 `fscanf`，它们可以同时处理一组混合数据。\n\
  \n`fprintf` 和 `fscanf` 执行的 I/O 操作与熟悉的 `printf` 和 `scanf` 函数相同，唯一的区别是它们作用于文件。这些函数的第一个参数是文件指针，用于指定要使用的文件。`fprintf`\
  \ 的通用形式为：\n\n![](img/Image00936.gif)\n\n其中 `fp` 是与已打开写入的文件关联的文件指针。控制字符串包含列表中项的输出规范。列表可以包括变量、常量和字符串。例如：\n\
  \n```c\nfprintf(f1, “%s %d %f”, name, age, 7.5);\n```\n\n在这里，`name` 是 `char` 类型的数组变量，`age`\
  \ 是 `int` 变量。\n\n`fscanf` 的通用格式为：\n\n![](img/Image00937.gif)\n\n该语句将根据控制字符串包含的规范，从\
  \ `fp` 指定的文件读取列表中的项。例如：\n\n```c\nfscanf(f2, “%s %d”, item, &quantity);\n```\n\n\
  像 `scanf` 一样，`fscanf` 也返回成功读取的项目的数量。当到达文件结束时，它返回值 `EOF`。\n\n![](img/Image00938.gif)\n\
  \n程序如图 13.3 所示。文件名 `INVENTORY` 通过键盘提供。使用函数 `fscanf` 从文件 `stdin`（指向终端）读取数据，然后将其写入文件指针\
  \ `fp` 所指向的文件。记住文件指针 `fp` 指向 `INVENTORY` 文件。\n\n在关闭 `INVENTORY` 文件后，再次打开它进行读取。文件中的数据连同项目值被写入\
  \ `stdout`（指向屏幕）。在从文件读取时，应注意使用与写入文件内容时相同的格式规范……\n\n![](img/Image00939.gif)\n\n![](img/Image00940.gif)\n\
  \n**图 13.3** 混合数据类型操作\n\n![](img/Image00941.gif)\n\n### I/O 操作期间错误处理\n\n![](img/Image00942.gif)\n\
  \n在文件操作时可能会发生错误。在 I/O 操作期间可能会发生错误。典型的错误情况包括：\n\n1. 尝试越文件结尾读取。\n2. 设备溢出。\n3. 尝试使用未打开的文件。\n\
  4. 对打开的文件执行操作。\n5. 使用无效文件名打开。\n6. 写入受保护的文件。\n\n如果我们不检查这些读写错误，程序在发生错误可能会运行异常。幸运的是，我们有两个状态函数：`feof`\
  \ 和 `ferror` 可以帮助我们检测。`feof` 函数可用于测试文件结束。它接受文件指针作为参数，如果已读取所有数据，则返回非零值，否则返回 0。如果\
  \ `fp` 是刚刚打开的文件，那么语句\n\n![](img/Image00943.gif)\n\n将显示“数据结束”。\n\n`ferror` 函数报告文件的状态。它也接受文件指针作为参数，如果检测到错误，则返回非零整数。在处理到该点之前返回\
  \ 0。\n\n我们知道每当使用 `fopen` 函数打开文件时，都会返回一个文件指针。由于某些原因无法打开文件，则返回 `NULL` 指针。这种机制可以用于测试文件是否已打开。例如：\n\
  \n![](img/Image00945.gif)\n\n![](img/Image00946.gif)\n\n程序图 13.4 演示了 `NULL` 指针测试和\
  \ `feof` 函数的使用。当我们输入文件名 `TETS` 时，函数\n\n```c\nfopen(“TETS”, “r”);\n```\n\n返回 `NULL`\
  \ 指针，因为文件 `TETS` 不存在，因此打印“无法打开文件”。\n\n同样，`feof(fp2)` 在读取完数据时返回非零整数，因此程序打印“数据耗尽”并终止进一步读取。\n\
  \n![](img/Image00947.gif)\n\n![](img/Image00948.gif)\n\n**图 13.4** 文件操作错误处理说明\n\n\
  ### 文件的随机访问\n\n![](img/Image00949.gif)\n\n到为止我们讨论的是用于顺序读写数据的字函数。但在某些情况下，我们对访问文件的特定部分，而不是读取其他部分。这可以通过\
  \ I/O 库中的 `fseek`、`ftell` 和 `rewind` 函数来实现。\n\n`ftell` 接受文件指针并返回一个 `long` 类型的值，对应于当前位置。该函数对于保存文件的当前位置有用，可以在程序的后续可以使用。它的形式如下：\n\
  \n```c\nn = ftell(fp);\n```\n\n`n` 将给出当前位置的偏移量（字节）。这意味着已经读取（或写入）了 n 个字节。\n\n`rewind`\
  \ 接受文件指针并将重置为文件开头。例如，语句\n\n```c\nrewind(fp);\nn = ftell(fp);\n```\n\n\n\n\n会将 `n`\
  \ 赋值为 0，因为 `rewind` 已将文件位置设置为文件的开头。记住，文件中的第一个字节编号为 0，第二个字节为 1，依此类推。此函数可以帮助我们多次读取文件，而无需关闭并重新打开文件。记住，每当打开文件进行读取或写入时，都会隐式地执行一次\
  \ `rewind`。\n\n`fseek` 函数用于将文件位置移动到文件内的指定位置。它的格式如下：\n\n![](img/Image00950.gif)\n\
  \n`file_ptr` 是指向相关文件的指针，`offset` 是一个 `long` 类型的数字或变量，`position` 是一个整数。`offset` 指定了从\
  \ `position` 指定的位置移动的偏移数（字节数）。`position` 可以取以下三个值中的之一：\n\n![](img/Image00951.gif)\n\
  \n`offset` 可以是正数（表示向前移动），也可以是负数（表示向后移动）。\n\n表 13.2 中的示例说明了 `fseek` 函数的操作：\n\n**表\
  \ 13.2** `fseek` 函数的操作\n\n![](img/Image00952.gif)\n\n当操作成功时，`fseek` 返回零。如果我们尝试将文件指针移动到文件边界之外，就会发生错误且\
  \ `fseek` 返回 –1（负一）。在继续之前检查是否发生了错误是一个良好的习惯。\n\n![](img/Image00953.gif)\n\n使用 `ftell`\
  \ 和 `fseek` 函数的程序所示 图 13.5 。我们创建了一个名为 `RANDOM` 的文件，内容如下：\n\n![](img/Image00954.gif)\n\
  \n我们读取了两次文件。第一次，我们读取每五个位置的内容，并将其值及其在屏幕上的位置打印出来。第二次，我们从文件末尾读取内容并在屏幕上打印打印。\n\n在第一次读取期间，当\
  \ `fseek(fp,n,0)` 的参数 `n` 变为 30 时，文件指针越过了文件结束标记。因此，在打印位置 30 的内容后，循环终止。\n\n为了从末尾读取文件，我们使用语句：\n\
  \n```\nfseek(fp,–1L,2);\n```\n\n将文件指针定位到最后一个字符。由于每次读取都会使位置向前移动一个，我们必须向后移动两个位置以读取下一个字符。这是通过在\
  \ `while` 语句中使用该函数实现的：\n\n```\nfseek(fp, –2L, 1);\n```\n\n该语句还测试了文件指针是否越过了文件边界。一旦越界，循环就会终止。\n\
  \n![](img/Image00955.gif)\n\n![](img/Image00956.gif)\n\n**图 13.5** `fseek` 和 `ftell`\
  \ 函数的示例\n\n![](img/Image00957.gif)\n\n程序所示 图 13.6 。它使用结构体定义来描述每个项目，并使用函数 `append()`\
  \ 向文件中添加项目。\n\n执行时，程序会请求要追加数据的文件名。在添加完项目后，文件中最后一个字符的位置被赋值给 `n`，然后关闭文件。\n\n重新打开文件进行读取并显示其内容。注意，读取和显示是在\
  \ `while` 循环的控制下完成的。循环将当前文件位置与 `n` 进行比较，当两者相等时循环终止。\n\n![](img/Image00958.gif)\n\
  \n![](img/Image00959.gif)\n\n![](img/Image00960.gif)\n\n**图 13.6** 向现有文件添加项目\n\n\
  ## 命令行参数\n\n![](img/Image00961.gif)\n\n什么是命令行参数？它是当程序被调用时提供给程序的参数。该参数可能代表程序应该处理的文件名。例如，如果我们想执行一个程序将名为\
  \ `X_FILE` 的文件内容复制到另一个名为 `Y_FILE` 的文件中，那么我们可能如下如下命令行：\n\n```\nC > PROGRAM X_FILE\
  \ Y_FILE\n```\n\n其中 `PROGRAM` 是存储程序可执行代码的文件名。这消除了程序在执行期间要求用户输入文件名的需求。这些参数是如何进入程序的呢？\n\
  \n我们知道每个 C 程序都应该有一个 `main` 函数，它标记了程序的开始。但我们到为止还没有提到的是，它也可以像其他函数一样接受参数。事实上，`main`\
  \ 可以接受两个名为 `argc` 和 `argv` 的参数，当系统调用 `main` 时，命令行中包含的信息通过这些参数传递给程序。\n\n变量 `argc`\
  \ 是参数计数器，用于计算命令行上参数的数量。`argv` 是参数向量，表示一个指向命令行参数的字符指针数组。该数组的大小将等于 `argc` 的值。例如，对于上面的命令行，`argc`\
  \ 是三，而 `argv` 是一个包含三个指向字符串指针的数组，如下所示：\n\n`argv[0] –> PROGRAM`\n\n`argv[1] –> X_FILE`\n\
  \n`argv[2] –> Y_FILE`\n\n为了访问命令行参数，我们必须如下声明 `main` 函数及其及其参数：\n\n![](img/Image00962.gif)\n\
  \n命令行中的第一个参数始终是程序名，因此 `argv[0]` 始终代表程序名。\n\n![](img/Image00963.gif)\n\n![](img/Image00964.gif)\n\
  \n![](img/Image00965.gif)\n\n**图 13.7** 反转文件中 `n` 个字符的程序\n\n![](img/Image00966.gif)\n\
  \n图 13.8 显示了命令行参数的使用。命令行是：\n\n```\nF12_7 TEXT AAAAAA BBBBBB CCCCCC DDDDDD EEEEEE\
  \ FFFFFF GGGGGG\n```\n\n命令行中的每个单词都是 `main` 的参数，因此参数总数为 9。\n\n参数向量 `argv[1]` 指向字符串\
  \ `TEXT`，因此语句\n\n```\nfp = fopen(argv[1], “w”);\n```\n\n打开一个名为 `TEXT` 的文件。紧随其后的\
  \ `for` 循环将剩余的 7 个参数写入文件 `TEXT`。\n\n![](img/Image00967.gif)\n\n![](img/Image00968.gif)\n\
  \n![](img/Image00969.gif)\n\n**图 13.8** 命令行参数的使用\n\n![](img/Image00970.gif)\n\n\
  ## 核心概念\n\n- **文件名 (Filename)**：组成操作系统有效文件名的字符字符串。\n- **fseek**：这是一个将位置设置为文件内指定点的函数。\n\
  - **ftell**：这是一个返回文件当前位置的函数。\n- **rewind**：这是一个将位置设置为文件开头的函数。\n- **命令行参数 (Command\
  \ line argument)**：当程序被调用时从命令行提示提供给程序的参数。\n\n## 始终记住\n\n- 不要尝试在打开文件之前使用它。\n- 记住，使用\
  \ ‘w’ 模式打开现有文件时，文件内容会被删除。\n- 当文件用于读取和写入时，我们必须以 ‘w+’ 模式打开。\n- 使用文件函数时省略文件指针是错误的。\n\
  - 在文件不存在时打开文件读取是错误的。\n- 使用文件名而非文件指针访问文件是错误的。\n- 在程序终止前关闭所有文件是一个良好的习惯。\n- EOF 是值为\
  \ –1 的整数类型。因此我们必须使用整数变量来测试 EOF。\n- 从写入模式的文件中读取是错误的，反之亦然。\n- 为了在处理文件时避免 I/O 错误，良好的习惯是在程序中通过\
  \ `feof` 和 `ferror` 等函数包含错误处理代码。\n- 尝试将文件标记放在文件第一个字节之前是错误的。\n- 每次调用 `fseek` 函数时都检查其返回值是一个良好的习惯。正值确保文件指针在文件边界内。\n\
  \n## 选择题\n\n为下列每个选择题选择正确答案：\n\n13.1 下列哪些函数用于向文件写入整数？[LO 13.2 E]\n\n(a) `fprintf()`\n\
  \n(b) `putw()`\n\n(c) `putc()`\n\n(d) `puts()`\n\n\n\n\n\n### 13.2 以下哪些符号用于表示 EOF（文件结束符）？\
  \ [LO 13.2 M]\n\n(a) `^z`\n(b) `~z`\n(c) `EOF`\n(d) 以上均不是\n\n### 13.3 在文件中读写整数数据时，用以下哪个整数值表示\
  \ EOF？ [LO 13.2 M]\n\n(a) `-1`\n(b) `0`\n(c) `-9999`\n(d) 以上均不是\n\n### 13.4 下列哪个状态查询函数用于检测文件处理过程中的\
  \ I/O 错误？\n[LO 13.3 E]\n\n(a) `feof()`\n(b) `error()`\n(c) `ferror()`\n(d) 以上均不是\n\
  \n## [复习题]\n\n### 13.1 判断下列陈述的对错. .\n\n(a) 文件在可以使用之前必须打开。[LO 13.1 E]\n(b) 所有文件都必须显式地关闭。[LO\
  \ 13.1 E]\n(c) 在 C 程序中，文件始终通过名称引用。[LO 13.1 E]\n(d) 使用 `fseek` 将文件位置置于结尾之外是一个错误。[LO\
  \ 13.1 M]\n(e) 函数 `fseek` 可能仅用于从文件开始定位。[LO 13.4 E]\n(f) 如果以写模式打开一个现有文件，则文件的当前内容将被删除。[LO\
