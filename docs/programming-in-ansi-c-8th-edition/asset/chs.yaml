  ![](img/Image00124.gif)\n整数是特定机器支持的值范围内的整数。通常，整数占用一个字（word）的存储空间，由于机器的字长不同（通常为 16\
  \ 或 32 位），可以存储的整数大小取决于计算机。如果我们使用 16 位字长，整数值的大小限制在 -32768 到 +32767 之间（即 $-2^{15}$\
  \ 到 $+2^{15}-1$）。有符号整数使用 1 位表示符号，15 位表示数值大小。同样，32 位字长可以存储从 -2,147,483,648 到 2,147,483,647\
  \ 的整数。\n![](img/Image00125.gif)\n图. 3.5 整数类型\n为了对数值范围和存储空间提供一些控制，C 有三类整数存储类型，即 `short\
  \ int`、`int` 和 `long int`，分为有符号和无符号形式。ANSI C 定义这些类型以便它们能够从小到大进行排列，如图图 3.5 所示。例如，`short\
  \ int` 表示较小的整数值，所需的存储空间是普通 `int` 使用空间的一半。与有符号整数不同，无符号整数使用所有位来表示数值，且始终为正数。因此，对于 16\
  \ 位机器，无符号整数的范围将从 0 到 65,535。\n我们声明 `long` 和 `unsigned` 整数以扩大数值范围。在整数上使用限定符 `signed`\
  \ 是可选的，因为默认声明假设是有符号数。表 3.8 显示了基本类型和限定符的所有允许组合以及它们在 16 位机器上的大小和范围。\n![](img/Image00126.gif)\n\
