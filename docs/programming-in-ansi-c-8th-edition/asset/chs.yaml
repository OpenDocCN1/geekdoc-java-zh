  \n![](img/Image01198.gif)\n\n![](img/Image01199.gif)\n\n# 项目 2：使用 C 语言开发 Web 服务\n\
  \n## 概述\n\n在本课程，我们将使用 C 语言开发 RESTful API。这可能很有趣，因为 Web 服务或 RESTful API（它们确实如此）通常是使用\
  \ Ruby、Java 或 Python 等面向对象的语言开发的。\n\n## 我们将使用什么？\n\n1. **Ubuntu**：开发 C 语言 Web 服务时我们将使用\
  \ Ubuntu 平台，但请注意，你同样可以使用任何其他平台，如 Windows 或 Macintosh。本课程显示的命令适用于 Ubuntu 平台，其他平台也有对应的命令。\n\
  2. **Onion**：我们将使用一个名为 `Onion` 的第三方库。该库采用 Apache2 许可和 GPLv2+ 双重许可，因此我们可以用它创建任何内容，用于商业或免费软件，并根据需要进行修改。这是一个简单的库，用于通过回调机制开发\
  \ C Web 服务。\n\n## 什么是回调机制？\n\n在开始开发 C Web 服务并查看 `Onion` 库实际上如何工作之前，我们需要了解什么是回调机制以及它是如何工作的。\n\
  \n回调作为参数传递给其他代码的可执行代码，这些代码预计在给定时间回调（执行）该参数[来源：维基]。简单来说，如果将函数的引用作为参数传递给另一个函数以调用它，那么它就被称为回调函数。让我们考虑下面的例子：\n\
  \n![](img/Image01199.gif)\n\n![](img/Image01200.gif)\n\n在这里，`populate_array` 函数接受函数指针作为第三参数，并调用它以获取填充数组的值。我们编写了回调函数\
  \ `getNextRandomValue()`，它返回一个随机值，并将其指针传递给 `populate_array()`。`populate_array()`\
  \ 函数将调用我们的回调函数 10 次，并将返回的值赋值给给定数组中的元素。\n\n\n\n这意味着，回调函数（callback function）是指参数传递给另一个函数的函数，并在函数内部发生事件或处理某些逻辑且需要回调被传递的函数时被调用。\n\
  \n给好奇的读者：\n\n回调有两种使用方式：同步回调和异步回调。同步回调提供给另一个函数，该函数将执行某些任务，并在任务完成后返回给调用者。异步回调则提供给另一个函数，该函数将启动一项任务，并在任务可能尚未完成时就返回给调用者。\n\
  \n同步回调通常用于为另一个函数提供一个委托（delegate），让该函数将任务的某些步骤委托给它。这种委托的经典示例是标准 C 库中的 `bsearch()`\
  \ 和 `qsort()` 函数。这两个函数都接受一个回调，该回调在函数提供的任务期间被使用，因此被搜索的数据类型（在 `bsearch()` 中）或排序的数据类型（在\
  \ `qsort()` 中）不需要被使用的函数感知。\n\n# 使用 C 语言编写 Web 服务器\n\n现在，我们将开始用 C 编写一个简单的 Web 服务器，它可以处理程序中对\
  \ GET 端点的调用。请注意，使用上述程序需要配置 Onion 库。该库可以在此链接找到：`https://github.com/davidmoreno/onion`。设置该库的指令在仓库的\
  \ wiki 中有非常的说明。\n\n我们首先提供一个简单的头文件列表，我们需要在程序包含它们：\n\n```c\n#include <onion/onion.h>\n\
  #include <onion/log.h>\n#include <onion/version.h>\n#include <signal.h>\n#include\
  \ <netdb.h>\n#include <stdlib.h>\n#include <unistd.h>\n```\n\n此包含部分涉及 Onion 库的库以及一些标准\
  \ C 库，有助于调用标准函数并使用 C 二进制文件中的信号参数。\n\n尽管现在开始看起来可能有点早，但我们现在将定义两个非常简单的回调函数：\n\n![](img/Image01201.gif)\n\
  \n让我们看看在上面的回调函数中做了什么：\n\n* 我们定义的第一个函数是 `hello` 函数。这是一个非常简单的函数，包含了一些参数，包括 Onion 库的请求和响应引用对象指针。这些指针应该出现在每一个回调函数中，以便它们修改响应对象并从请求对象本身中获取参数。\n\
  * 此函数简单地向 Onion 库的响应对象写入 Hello World 字符串。请注意，尽管此函数返回一个整数而不是响应对象本身，但当返回的整数实际上是系统关于\
  \ HTTP 调用方法处理完成的信号时，响应对象仍然会被处理并返回给用户。\n* 相同的整数在下一个回调函数 `random_timeout` 中也会返回。这样做的原因是一致的。\n\
  * 第二个回调函数只是随机超时。它首先找到一个随机数，睡眠几毫秒，在响应对象中写入一个字符串，最后信号回调函数的处理完成。\n\n现在，我们终于一个 `main`\
  \ 函数来调用我们上面写的所有内容。等一下，我们在哪里定义了这些回调方法将与哪些 REST 端点关联呢？很容易猜到这将在 `main` 函数中完成。让我们写下程序的\
  \ `main` 函数：\n\n```\n![](img/Image0120.gif)\n```\n\n```\n![](img/Image0121.gif)\n\
  ```\n\n```\n![](img/Image0122.gif)\n```\n\n```\n![](img/Image0123.gif)\n```\n\n\
  ```\n![](img/Image0124.gif)\n```\n\n---\n\n# C99 特性\n\n## 引言\nC 语言由 ANSI 开发并标准化，是一种强大、可移植且优雅的语言。由于它同时适用于系统和应用程序，它已成为行业标准。致力于\
  \ C 语言的标准化委员会一直在批判性地检查每个元素，并查看是否有必要的更改或增强。委员会还与许多用户组交互，并收集了关于改进所需的建议。结果就是 C 的新版本，称为\
  \ C99。\n\nC99 标准整合了任何现代语言所理想的增强和新特性。尽管它从 C++ 中借用了一些特性并修改了一些结构，但它保留了 ANSI C 的所有特性，因此仍然是真正的\
  \ C 语言。\n\n在本附录中，我们将介绍 1999 标准添加到 C 中的重要变化和新特性。\n\n## 关键字\nANSI C 定义了 32 个关键字。C99\
  \ 又添加了五个关键字。它们如下：\n\n`_Bool`, `_Complex`, `_Imaginary`, `inline`, `restrict`。\n\n\
  这些关键字的添加可能是 C99 最显著的特征。这些关键字的使用将在附录稍后的部分重点介绍。\n\n## 注释\nC99 增加了所谓的单行注释，这是从 C++ 借用的特性。单行注释以\
  \ `//`（两个反斜杠）开始，并在行尾结束。示例：\n\n![](img/Image0125.gif)\n\n当需要简短的逐行注释时，单行注释非常有用。\n\n\
  ## 数据类型\nC 定义了五种基本数据类型，即 `char`, `int`, `float`, `double` 和 `void`。C99 增加了三种新的内置数据类型。它们如下：\n\
  \n`_Bool`, `_Complex`, `_Imaginary`。\n\nC99 还允许 `long` 修改 `long`，从而创建了另外两个修改数据类型，即\
  \ `long long int` 和 `unsigned long long int`。\n\n## _Bool 类型\n`_Bool` 是一种整数类型，可以存储值\
  \ 1 和 0。示例：\n\n```c\n_Bool x, y;\nx = 1;\ny = 0;\n```\n\n我们知道关系和逻辑表达式在假时返回 0，真时返回\
  \ 1。这些值可以存储在 `_Bool` 类型变量中。例如，\n\n```c\n_Bool b = m > n;\n```\n\n\n\n如果 `m` 大于 `n`，则变量\
  \ `b` 被赋值为 `1`，否则为 `0`。\n\n# _ 复数与虚数类型\n\nC99 增加了两个关键字 `Complex` 和 `_Imaginary`，以支持数值编程所需的复数运算。支持以下复数类型：\n\
  \n![](img/Image01206.gif)\n\n# long long 类型\n\n`long long int` 的范围至少从 $-(2^{63}-1)$\
  \ 到 $2^{63}-1$。同样，`unsigned long long int` 的范围是从 $0$ 到 $2^{64}-1$。\n\n## 变量声明\n\n\
  在 C 语言中，我们知道所有变量必须在块或函数的开头、在任何可执行语句之前声明。然而，C99 允许我们在任何位置声明变量，只需在其在使用之前。例如，以下代码在\
  \ C99 中是合法的。\n\n![](img/Image01207.gif)\n\nC99 将这一概念扩展到 `for` 循环中控制变量的声明。也就是说，C99\
  \ 允许在循环的初始化部分声明一个或多个变量。例如，以下代码是合法的。\n\n![](img/Image01208.gif)\n\n在 `for` 循环内部声明的变量仅对该循环可见。一旦循环结束，变量的值就会丢失。（这个概念也是借自\
  \ C++。）\n\n# I/O 格式\n\n为了处理带有 `long long` 规格的新数据类型，C99 在 `scanf()` 和 `printf()`\
  \ 格式规范中都增加了一个新的格式修符 `ll`。例如：`%lld`、`%llu`、`%lli`、`%llo` 和 `%llx`。\n\n同样，在处理 `char`\
  \ 类型的值时，C99 为 `d`、`i`、`o`、`u` 和 `x` 规范增加了 `hh` 修符。\n\n# 数组的处理\n\nC99 引入了一些增强数组实现的特性。\n\
  \n在 ANSI C 中，我们必须使用整数常量来声明数组维度，因此数组的大小在编译时就固定了。C99 允许使用整数变量或任何有效的整数表达式来声明数组维度。这些变量的值可以在使用之前指定。此类数组被称为变长数组。\n\
  \n示例：\n\n![](img/Image01209.gif)\n\n我们可以在运行时交互地指定 `m` 和 `n` 的值，从而在每次程序运行时创建不同大小的矩阵。\n\
  \n## 数组声明中的类型规范\n\n当我们将数组作为函数参数传递时，可以使用关键字 `static` 对维度参数进行限定。例如：\n\n![](img/Image01210.gif)\n\
  \n限定符 `static` 保证数组 `x` 至少包含指定数量的元素。\n\n## 结构中的灵活数组\n\n在设计结构体时，C99 允许将不指定大小的数组作为最后一个成员。这被称为灵活数组成员。示例：\n\
  \n```c\nstruct find\n```\n![](img/Image01211.gif)\n\n# 函数实现\n\nC99 在函数的实现上引入了一些变化。它们包括：\n\
  \n- 移除“默认 int”规则\n- 移除“隐式函数声明”\n- 对返回语句的限制\n- 使函数设为内联（*inline*）\n\n## 默认 int 规则\n\
  \n在 ANSI C 中，当未指定函数的返回类型时，返回类型被假设为 `int`。例如：\n\n![](img/Image01212.gif)\n\n是一个合法的定义。返回类型默认认为是\
  \ `int`。隐式 `int` 规则在 C99 中不再有效。它要求显式提到返回类型，即使函数返回的是整数值。上述定义必须写为：\n\n![](img/Image01213.gif)\n\
  \n我们另一个使用隐式 `int` 规则的地方是在使用限定符声明函数参数时。例如，如下函数定义\n\n![](img/Image01214.gif)\n\n在\
  \ C99 中是不被接受的。参数 `a`、`x` 和 `y` 必须显式声明为 `int`，例如：\n\n```c\nconst int a\nconst register\
  \ x\n```\n\n## 显式函数声明\n\n虽然在 ANSI C 中技术上并不要求先进行显式函数声明，但在 C99 中是要求的（类似于 C++）。\n\n\
  # 对返回语句的限制\n\n在 ANSI C 中，非 void 类型函数可以包含不带值的返回语句。例如，以下代码在 ANSI C 中是有效的。\n\n![](img/Image01215.gif)\n\
  \n但在 C99 中，如果指定一个函数返回值，则其返回语句必须带有一个返回值。因此，上述定义在 C99 中是无效的。上述函数的返回语句可以采取以下形式之一：\n\
  \n![](img/Image01216.gif)\n\n# 使函数内联（inline functions）\n\n新关键字 `inline` 用于在程序执行时优化函数调用。`inline`\
  \ 限定符在函数定义中的用法如下：\n\n![](img/Image01217.gif)\n\n此类函数被称为内联函数。当调用内联函数时，函数的代码会在内联处展开，而不是被调用。这消除了调用和返回机制所需要的大量开销，从而显著缩短了执行时间。然而，当函数被调用多次时，这种“内联”展开可能会增加程序对象代码的大小。因此，只有较小的函数会被设为内联。\n\
  \n# 受限指针（restrict pointers）\n\nC99 引入了新关键字 `restrict` 作为一种仅应用于指针的类型限定符。被 `restrict`\
  \ 限定的指针被称为受限指针。受限指针的声明如下：\n\n![](img/Image1218.gif)\n\n受限指针是访问其所指向对象的唯一手段。（不过，也可以使用派生的受限指针。）\n\
  \n# 编译器限制\n\n所有编译器在处理某些功能（如标识符长度、参数数量等）方面都有限制。C99 增强了许多此类限制，如下：\n\n- 标识符的重要字符：从\
  \ 6 增加到 31\n- 块嵌套层：从 15 增加到 127\n- 函数参数：从 31 增加到 127\n- 结构体成员：从 127 增加到 1023\n\n\
  # C11 特性\n\n## 简介\n\nC11 是当前的 C 标准，取代了之前的 C99。C11 主要旨在标准化大多数编译器常用的特性。为了克服 C99 中编译器遵循标准延迟的问题，C11\
  \ 将其许多特性设为可选。\n\n## 语言和库规范的变化\n\n让我们来看看 C11 为 C99 标准带来的一些关键语言和库规范变化：\n\n### Noreturn\
  \ 函数限定符\n\n用于函数声明语句，表示该函数不通过返回语句或到达函数体结束来返回。该限定符在 `stdnoreturn.h` 头文件中。\n\n使用 `noreturn`\
  \ 限定符声明的一些标准函数包括 `abort()`、`exit()`、`longjmp()` 等。\n\n### Generic 关键字\n\n提供了一种在编译时选择给定表达式之一的方法。\n\
  \n语法：`_Generic (controlling-expression, association-list)`\n\n这里，controlling-expression\
  \ 是除逗号运算符之外的任何表达式，association-list 是由逗号分隔的关联列表。\n\n### Thread_local 限定符\n\n使用 `_Thread_local`\
  \ 限定符声明的变量被赋予线程特定的存储 Duration。也就是说，变量在线程开始时分配，在线程结束时释放。此外，符合线程特定的行为，每个线程都有该变量的实例。新头文件\
  \ `<threads.h>` 包含 `_Thread_local` 限定符。\n\n## 增强的 Unicode 支持\n\n\n\n\n\nC11 支持某些与\
  \ Unicode 支持相关的增强。例如：\n\n* 新头文件 `uchar.h`，包含与 UTF-16 和 UTF-32 相关的字符工具\n* `u` 和 `U`\
  \ 字符串字面量前缀\n* 用于 UTF-8 编码字面量的 `u8` 前缀\n\n## 匿名结构和联合体\n\nC11 支持匿名结构和联合体的实现，这在联合体和结构嵌套的情况下特别有用。示例代码说明了这一点：\n\
  \n![](img/Image01219.gif)\n\n注意，在上述代码中 `union` 是匿名的，因为它没有命名。\n\n### 添加 `quick_exit`\
  \ 函数\n\n这是一个用于快速终止程序的新函数。它会在不清理系统资源的情况下终止程序。\n\n### 用 `gets_s` 替换 `gets`\n\n`gets()`\
  \ 函数在 C11 中已被完全移除，因为它不进行边界检查，会导致缓冲区溢出问题。新的 `gets_s()` 函数通过从 `stdin` 读取最多字符，克服了这一局限性。它会持续读取直到遇到新行或文件结束，并只向输入缓冲区返回部分读取到的字符。\n\
  \n### 对齐规范\n\nC11 提供了四个用于对象对齐的新宏。这些是：\n\n* `_alignas`\n* `_alignof`\n* `_alignas_is_defined`\n\
  * `_alignof_is_defined`\n\n这些宏在新的 `stdalign.h` 头文件中提供。\n\n![](img/Image01220.gif)\n\
  \n![](img/#text00006.html_app6)\n\n## 引言\n\nC 语言主要被程序员用于系统编程以及开发嵌入式和实时应用。然而，C 也具备图形编程能力。头文件\
  \ `graphics.h` 包含了用于开发图形形状、动画等的函数。\n\n在本附录中，我们将从使用 C 进行图形编程开始。\n\n## 示例程序 1：画圆\n\
  \n考虑图 VI.1 所示的简单图形程序。\n\n![](img/Image01222.gif)\n\n图 VI.1 一个画圆的程序\n\n该程序执行时会产生以下输出：\n\
  \n![](img/Image01223.gif)\n\n让我们分析程序指令，看看是如何产生上述输出的。程序从包含以下两个头文件的预处理指令开始：\n\n* `graphics.h`\
  \ : 它包含了图形库函数，用于在输出屏幕上绘制图形。\n* `conio.h` : 它包含了执行控制台输入/输出操作的函数。\n\n`main` 函数从以下初始化图形模式的指令开始：\n\
  \n```c\nint gd=DETECT, gm;\ninitgraph(&gd, &gm, “C:\\Turbo\\TC\\BGI” );\n```\n\n\
  在这里，`gd` 和 `gm` 被声明为整数变量分别代表图形驱动程序和图形模式。`gd` 被赋值为 `DETECT`，这是 `graphics.h` 头文件中定义的一个宏。随后调用\
  \ `initgraph` 函数来初始化图形，即选择合适的图形驱动程序并设置可能的最大屏幕分辨率。`initgraph` 函数的参数包括：\n\n* `gd`\
  \ 变量的地址\n* `gm` 变量的地址\n* BGI 文件的目录路径（路径可能根据 C 编译器的位置而变化）\n\n一旦设置了图形驱动程序和模式，环境就准备好让你使用图形库中的函数绘制图形形状。在上述程序中，调用了\
  \ `circle` 函数在输出屏幕上画了一个圆。`circle` 函数的前两个参数是代表圆心的 `x` 和 `y` 坐标。第三个参数代表圆的半径。\n\n一旦绘制完图形形状，恢复图形系统是非常关重要的。`closegraph`\
  \ 函数正是此，它关闭图形模式并将其恢复到调用 `initgraph` 函数时的模式。\n\n![](img/Image01224.gif)\n\n## 图形库函数\n\
