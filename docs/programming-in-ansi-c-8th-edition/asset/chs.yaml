  \ = %p”,main);\n}\n```\n[LO 14.1 H]\n- **14.3** 什么是野指针（wild pointer）？[LO 14.4 M]\n\
  - **14.4** `NULL` 和 `NUL` 有什么区别？[LO 14.4 H]\n- **14.5** 什么是悬指针（dangling pointer）？[LO\
  \ 14.3 H]\n- **14.6** 什么是限制指针（restricted pointer）？[LO 14.1 H]\n- **14.7** 栈（stack）和队列（queue）的主要区别是什么？[LO\
  \ 14.5 M]\n\n*注：E 代表简单，M 代表中等，H 代表困难*\n\n## 引言\n\nC 语言在许多方面都是一种独特的语言。我们已经看到了结构体和指针等特征。C\
  \ 语言的另一个独特之处是预处理器。C 预处理器提供了其他高级语言中不具备的工具。程序员可以使用这些工具使程序易于阅读、易于修改、可移植且更高效。\n\n预处理器，正如其名，是一个在源代码传递给编译器之前对其进行处理的程序。它在所谓的预处理器命令行或指令的控制下运行。预处理器指令被放置在源程序的主体行之前。在源代码传递给编译器之前，预处理器会检查代码中是否存在任何预处理器指令。如果有，则会根据指令采取相应的行动，然后将源程序交给编译器。\n\
  \n预处理器指令遵循不同于普通 C 语法的特殊语法规则。它们都以第一列的符号 `#` 开头，且末尾不需要分号。我们已经有限地使用过 `#define` 和 `#include`\
  \ 指令。表 15.1 给出了常用的预处理器指令及其功能。\n\n### 表 15.1 预处理器指令\n\n| 指令 | 功能 |\n| :--- | :---\
  \ |\n| `#define` | 定义宏替换 |\n| `#undef` | 取消宏定义 |\n| `#include` | 指定要包含的文件 |\n| `#ifdef`\
  \ | 测试宏是否已定义 |\n| `#endif` | 指定 `#if` 的结束 |\n| `#ifndef` | 测试宏是否未定义 |\n| `#if` |\
  \ 测试编译时条件 |\n| `#else` | 当 `#if` 测试失败时指定备选方案 |\n\n这些指令可以分为以下三类：\n1. 宏替换指令。\n2. 文件包含指令。\n\
  3. 编译器控制指令。\n\n## 宏替换\n\n宏替换是将程序中的标识符替换为由一个或多个标记（tokens）组成的预定义字符串的过程。预处理器在 `#define`\
  \ 语句的指导下完成这项任务。该语句通常被称为宏定义（或简单称为宏），具有以下通用形式：\n\n如果该语句包含在程序的开头，那么预处理器会将源代码中标识符的每次出现都替换为该字符串。关键字\
  \ `#define` 正如所示写入（从第一列开始），后面跟着标识符和字符串，两者之间至少有一个空格。注意，定义不是以分号结束的。字符串可以是任何文本，而标识符必须是有效的\
  \ C 标识。\n\n宏替换有不同的形式。最常见的形式如下：\n1. 简单宏替换。\n2. 带参数的宏替换。\n3. 嵌套宏替换。\n\n### 简单宏替换\n\
  \n简单的字符串替换通常用于定义常量。常量定义的例如所示：\n\n注意，我们将所有的宏都写了大写字母。用大写字母宏以识别它们是一种惯例。一个定义，例如\n\n\
  `#define M 5`\n\n将从该行到程序结束的所有 `M` 替换为 `5`。然而，字符串内部的宏不会被替换。考虑以下两行：\n\n`total = M\
  \ * value;`\n`printf(“M = %d\\n”, M);`\n\n这两行在预处理期间将更改为：\n\n`total = 5 * value;`\n\
  `printf(“M = %d\\n”, 5);`\n\n注意字符串 `=%d\\n` 保持不变。\n\n宏定义可以包含不仅仅简单的值。它还可以包含表达式。以下是有效的定义：\n\
  （为了简洁省略了示例）\n\n每当我们使用表达式进行替换时，应注意防止意外的求值顺序。考虑方程的求值：\n\n`ratio = D/A;`\n\n其中 `D`\
  \ 和 `A` 定义为：\n\n`#define D 45-22`\n`#define A 78+32`\n\n预处理器替换的结果是 `ratio = 45-22/78+32;`，这显然与预期的表达式不同。通过在字符串周围使用括号，可以获得正确的结果。如前所述，每当定义的名称出现时，预处理器都会执行字面文本替换。这解释了为什么我们不能使用分号来终止\
  \ `#define` 语句。这表明我们可以使用宏定义几乎任何内容。例如，我们可以使用定义：\n\n`#define TEST if(x>y)`\n`#define\
  \ PRINT printf(“Very Good.\\n”)`\n\n来构建语句 `TEST AND PRINT`。预处理器会将该行翻译为 `if(x>y)\
  \ printf(“Very Good.\\n\");`。C 语法的某些标记容易混淆或出错。例如，一种常见的编程错误是在逻辑表达式中使用 `=` 替换 `==`。`&&`\
  \ 的情况也是如此。以下是一些可能有助于构建无错误且可读性更高的程序的定义：（为了简洁省略了示例）。\n\n## 带参数宏\n\n预处理器允许我们定义更复杂、更有用的替换形式。它的形式为：\n\
  \n`#define MACRO(f1, f2...fn)`\n\n注意宏标识符和左括号之间没有空格。标识符 `f1, f2, ...,fn` 是形式宏参数，类似于函数定义中的形式参数。\n\
  \n上述讨论的简单替换与带参数宏的替换之间本质区别。带参数宏的后续出现被称为宏调用（类似于函数调用）。当调用宏时，预处理器会替换字符串，用实际参数替换形式参数。因此，字符串表现得像模板。\n\
  \n带参数宏的一个简单示例是：\n\n`#define CUBE(x) ((x)*(x)*(x))`\n\n如果程序后面出现以下语句\n\n`volume =\
  \ CUBE(side);`\n\n那么预处理器将该语句展开为：\n\n\n\n\n`volume = (side * side * side );`\n\n\
  考虑以下语句：\n\n`volume = CUBE(a+b);`\n\n它会被展开为：\n\n`volume = (a+b * a+b * a+b);`\n\n\
  这显然不会产生正确的结果。这是因为预处理器对参数 `a+b` 执行了盲目替换以代替 `x`。这种缺点可以通过在字符串中每个形式参数的出现处都使用括号来纠正。\n\
  \n示例：\n\n![](img/Image01063.gif)\n\n这将导致 `CUBE(a+b)` 正确展开为：\n\n`volume = ( (a+b)\
  \ * (a+b) * (a+b));`\n\n记住对每个形式参数的出现处都使用括号，对整个字符串也使用括号。\n\n一些常用的定义有：\n\n![](img/Image01064.gif)\n\
  \n## 宏的嵌套\n\n我们还可以在一个宏的定义中使用另一个宏。也就是说，宏定义是可以嵌套的。例如，考虑以下宏定义。\n\n![](img/Image01065.gif)\n\
  \n预处理器展开每个 `#define` 宏，直到文本中不再出现宏为止。例如，最后一个定义首先展开为：\n\n```\n((SQUARE(x) * (x)) *\
  \ (SQUARE(x) * (x)))\n```\n\n由于 `SQUARE (x)` 仍然是一个宏，它会被进一步展开为：\n\n```\n( ( ((x)*(x))\
  \ * (x) ) * ( ((x) * (x)) * (x)) )\n```\n\n最终评估为 `x 6`。\n\n宏也可以作为其他宏的参数。例如，假定 `M`\
  \ 和 `N` 的定义，我们可以定义以下宏来给出这两个值的最大值：\n\n```\n#define MAX(M,N) (( (M) > (N) ) ? (M)\
  \ : (N))\n```\n\n宏调用的嵌套方式与函数调用非常。例如：\n\n![](img/Image01066.gif)\n\n同样，假定 `MAX(a,b)`\
  \ 的定义，我们可以使用以下嵌套调用来给出三个值 `x`、`y` 和 `z` 的最大值：\n\n`MAX (x, MAX(y,z))`\n\n## 取消宏\n\n\
  已定义的宏可以使用语句取消定义：\n\n```\n#undef identifier\n```\n\n当我们想要将定义仅限制在程序的特定部分时非常有用。\n\n\
  ![](img/Image01067.gif)\n\n## 文件包含\n\n![](img/Image01068.gif)\n\n包含函数或宏定义的外部文件可以作为程序的一部分包含进来，这样我们就不需要重写那些函数或宏定义。这是通过预处理器指令：\n\
  \n```\n#include “filename”\n```\n\n其中 `filename` 是包含所需定义或函数的文件。此时，预处理器会将 `filename`\
  \ 的全部内容插入程序的源代码中。当 `filename` 被包含在双引号内时，首先在当前目录搜索文件，然后在标准目录搜索。\n\n或者，该指令也可以采取形式：\n\
  \n```\n#include <filename>\n```\n\n不带双引号。在这种情况下，只会在标准目录中搜索文件。\n\n允许包含文件的嵌套。也就是说，被包含的文件可以包含其他文件。然而，文件不能包含自身。\n\
  \n如果未找到包含的文件，将报告错误并终止编译。\n\n假设我们创建了以下三个文件：\n\n![](img/Image01069.gif)\n\n我们可以通过在程序中包含这些文件来使用其中任何一个文件中包含的定义或函数：\n\
  \n![](img/Image01070.gif)\n\n## 编译器控制指令\n\n在开发大型程序时，你可能会遇到以下一种或多种情况：\n\n![](img/Image01071.gif)\n\
  \n1. 你包含了一个包含某些宏定义的文件。不知道某个特定宏（例如 `TEST`）是否在该头文件中已定义。然而，你想确定 `Test` 是否已定义（或未定义）。\n\
  2. 假设客户有两台不同类型的计算机，你被要求编写一个可以在两个系统上运行的程序。你希望使用同一个程序，尽管对于每个系统，某些代码行必须有所不同。\n3. 你正在为开放市场销售开发一个程序（例如，用于销售分析的程序）。某些客户可能坚持要求具有某些附加功能。然而，你希望有一个单一程序能同时满足这两类客户的需求。\n\
  4. 假设你正在测试你的程序，该程序相当庞大。你希望在某些地方插入打印调用，以显示中间结果和消息，以便跟踪执行流和错误（如果有的话）。此类语句被称为“调试”语句。你希望这些语句成为程序的一部分，并仅在你决定时才变为“激活”状态。\n\
  \n解决这些问题的方案之一是开发针对不同情况需求的不同程序。另一种方法是开发一个包含所有可选代码的单一、综合程序，然后引导编译器在不需要某些部分时跳过源代码的某些部分。幸运的是，C\
  \ 预处理器提供了一种名为“条件编译”的功能，可以用于“开启”或“关闭”程序中的某行或一组行。\n\n### 情况 1\n\n这种情况指的是宏的条件定义。我们希望确保宏\
  \ `TEST` 总是被定义的，无论它是否已经在头文件中被定义过。这可以通过以下方式实现：\n\n![](img/Image01072.gif)\n\n`DEFINE.H`\
  \ 应该包含 `TEST` 的定义。指令 `#ifndef` 搜索 `TEST` 的定义，如果未定义，则 `#ifndef` 到相应的 `#endif` 之间的行在程序中是“激活”的。也就是说，预处理器处理：\n\
  \n`#define TEST`\n\n如果 `TEST` 已定义，`#ifndef` 条件为假，因此所有的调试语句都会被排除。记住，你不能简单地写：\n\n\
  ```\n#define TEST 1\n```\n\n如果 `TEST` 已定义，将会发生错误。\n\n当我们希望宏永远不被定义时，情况也是类似的。这里的问题是使程序具有移植性。这可以通过以下方式实现：\n\
  \n![](img/Image01074.gif) ![](img/Image01075.gif)\n\n如果我们希望程序在 `MOTOROLA` 上运行，我们在程序中包含指令\
  \ `#define MOTOROLA`；否则不包含。注意编译器控制指令位于函数内部。必须将 `#` 字符放在第一列。如果定义了 `MOTOROLA`，编译器编译\
  \ `MOTOROLA` 计算机的代码，否则编译 `INTEL` 的代码。\n\n### 情况 3\n\n这与上述情况相似，因此控制指令采取以下形式：\n\n\
  ![](img/Image01076.gif)\n\n如果定义了 `ABC`，则包含组 A 行。否则，包含组 B 行。\n\n### 情况 4\n\n调试和测试用于检测程序中的错误。虽然编译器可以检测语法和语义错误，但它无法检测执行但产生结果错误的算法错误。\n\
  \n错误检测和隔离的过程从使用已知测试数据对程序进行测试开始。将程序拆分并在不同部分放置 `printf` 语句查看中间结果。此类语句被称为调试语句，一旦错误被隔离并修正，就不再需要它们。我们可以删除所有它们，或者通过使用控制指令使它们失效，如：\n\
  \n![](img/Image01077.gif)\n\n只有当宏 `TEST` 被定义时，`#ifdef` 到 `#endif` 之间的语句才包含。一旦一切正常，删除或取消\
  \ `TEST`。这使得 `#ifdef TEST` 条件为假，因此所有的调试语句都被排除。\n\n\n\n\n常量表达式可以是任何逻辑表达式，例如：\n\n\
  ![](img/Image01079.gif)\n\n778899101011111212*\n\n如果常量表达式的结果为非零（真），则 `#if` 和 `#endif`\
  \ 之间的所有语句都将被纳入处理；否则它们将被跳过。`TEST`、`LEVEL` 等名称可以定义为宏。\n\n## ANSI 扩展\n\n![](img/Image01080.gif)\n\
  \nANSI 委员会在表 15.1 中给出的现有列表中添加了一些更多的预处理器指令。它们如下：\n\n![](img/Image01081.gif)\n\nANSI\
  \ 标准还包括两个新的预处理器处理操作：\n\n![](img/Image01082.gif)\n\n## #elif 指令\n\n`#elif` 允许我们建立一个“if..else..if..”序列来测试多个条件。`#elif`\
  \ 的一般使用形式为：\n\n![](img/Image01083.gif)\n\n例如：\n\n![](img/Image01084.gif)\n\n## #pragma\
  \ 指令\n\n`#pragma` 是一种面向实现的指令，允许我们向编译器指定各种指令。它采用以下形式：\n\n![](img/Image01085.gif)\n\
  \n其中，`name` 是我们所需要的 pragma 名称。例如，在 Microsoft C 下，\n\n```c\n#pragma loop_opt(on)\n\
  ```\n\n这会导致执行循环优化。如果编译器不识别它，它将被忽略。\n\n## #error 指令\n\n`#error` 指令用于在调试期间产生诊断信息。其一般形式为\n\
  \n![](img/Image01086.gif)\n\n当遇到 `#error` 指令时，它会显示错误信息并终止处理。示例。![](img/Image01087.gif)\n\
  \n注意我们使用了与 `#if` 一起定义的特殊处理器运算符。`defined` 是新增的，接受一个用括号括起来名称。如果编译器不支持，我们可以将其替换为：\n\
  \n![](img/Image01088.gif)\n\n## 字符串化运算符 #\n\nANSI C 提供了一个名为字符串化运算符的运算符 `#`，用于宏函数的定义。该运算符允许将宏定义中的形式参数转换为字符串。考虑下面的示例：\n\
  \n![](img/Image01089.gif)\n\n预处理器会将该行\n\n```c\nsum(a+b);\n```\n\n转换为\n\n```c\nprintf(“a+b”\
  \ “=%f\\n”, a+b);\n```\n\n这等于\n\n```c\nprintf(“a+b =%f\\n”, a+b);\n```\n\n注意，ANSI\
  \ 标准还规定相邻的字符串将被合并。\n\n## 标记粘贴运算符 ##\n\n由 ANSI 标准定义的标记粘贴运算符 `##` 允许我们在宏定义中组合两个标记（token）以形成单个标记。例如：\n\
  \n![](img/Image01090.gif)\n\n预处理器会将语句\n\n```c\nprintf(\"%f”, combine(total, sales));\n\
  ```\n\n转换为语句\n\n```c\nprintf(\"%f”, totalsales);\n```\n\n考虑另一个宏定义：\n\n```c\n#define\
  \ print(i) printf(“a” #i “=%f”, a##i)\n```\n\n此宏会将语句\n\n```c\nprint(5);\n```\n\n\
  转换为语句\n\n```c\nprintf(“a5 = %f”, a5)\n```\n\n## 核心概念\n\n-   **宏调用**：它将宏标识符替换为相应的字符串，并将形式参数替换为实际参数。[LO\
  \ 15.1]\n-   **宏替换**：这是一个程序中的标识符被替换为一个或多个标记组成的预定义字符串的过程。[LO 15.1]\n-   **预处理器**：它是一个在源代码传递给编译器之前对其处理的程序。[LO\
  \ 15.1]\n-   **条件编译**：这是一种功能，允许在满足某些条件时对特定的某行或一组代码进行编译。[LO 15.3]\n-   **字符串化运算符**：它允许宏函数定义中的形式参数转换为字符串。[LO\
  \ 15.4]\n\n## 始终记住\n\n-   使用宏以系统化的方式对程序代码所做的更改。[LO 15.1]\n-   使用 `#undef` 取消宏的定义，以便将其限制在程序的特定部分。[LO\
  \ 15.1]\n-   记住 `#include <filename>` 指令仅在编译器定义的标准目录中搜索文件。然而，`#include \"filename\"\
  ` 指令会在程序的源目录中搜索文件；如果未找到该文件，它将在标准目录中搜索该文件。[LO 15.2]\n\n## 单选题\n\n为以下每个单选题选择正确答案：\n\
  \n15.1 下列哪项是文件包含预处理器指令？[LO 15.2 E]\n(a) `#include`\n(b) `#define`\n(c) `#pragma`\n\
  (d) 1 和 2 都\n\n15.2 关于编译器控制指令，以下陈述错误的是？[LO 15.3 M]\n(a) `#ifdef` 指令必须跟随 `#endif`\
  \ 指令。\n(b) `#ifndef` 指令必须跟随 `#endif` 指令。\n(c) `#undef` 指令取消宏的定义。\n(d) `#if` 指令必须跟随\
  \ `#endif`。\n\n15.3 下列哪个指令提供了替代测试以建立“if..else..if..”序列？[LO 15.3]\n(a) `#elif`\n\
  (b) `#if`\n(c) `#else`\n(d) `#pragma`\n\n## 复习题\n\n15.1 判断下列陈述的对错：\n(a) `#define`\
  \ 必须从第一列开始。\n(b) 处理器指令必须以分号结尾。\n(c) 所有预处理器指令都以 `#` 开头。\n(d) 我们不能在宏中使用另一个宏。\n(e)\
