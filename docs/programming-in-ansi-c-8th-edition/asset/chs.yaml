  \ 类型表示与 `float` 相同的数据类型，但精度更高。为了进一步扩展精度，我们可以使用使用 80 位的 `long double`。浮点数在计算机内存中使用\
  \ IEEE 标准表示。浮点类型之间的关系在图 3.6 中所示。\n### 空类型\n`void` 类型没有值。这通常用于指定函数的类型。当一个函数不向调用函数返回任何值时，该函数的类型被称为\
