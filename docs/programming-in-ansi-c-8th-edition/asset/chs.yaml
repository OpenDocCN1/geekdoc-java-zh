  a is positive\");\n}\n```\n\n6.5 什么样的 `if` 表达式总是返回真假值？[LO 6.1 E]\n\n6.6 `switch`\
  \ 语句允许使用哪些类型的值？[LO 6.3 M]\n\n\n\n\n在本章中，我们将讨论这些语句的特征和应用。\n\n## 哨兵循环 (Sentinel Loops)\n\
  \n根据控制变量的性质以及为了测试控制表达式而赋予它的值的类型，循环可以分为以下两大类：\n\n1. 计数控制循环 (Counter-controlled loops)\n\
  2. 哨兵控制循环 (Sentinel-controlled loops)\n\n当我们预先确切知道循环将执行多少次时，使用计数控制循环。我们使用名为 `counter`\
  \ 的控制变量。为了实现所需的循环操作，必须对 `counter` 进行正确的初始化、测试和更新。我们想要执行循环的次数可以是一个常量，也可以是一个赋了值的变量。计数控制循环有时被称为定数重复循环。\n\
  \n在哨兵控制循环中，使用一个称为“哨兵值”（sentinel value）的特殊值将循环控制表达式从真变为假。例如，在读取数据时，我们可能用特殊值（如 `-1`\
  \ 和 `999`）来指示“数据结束”。控制变量被称为“哨兵变量”（sentinel variable）。哨兵控制循环通常被称为不确定重复循环，因为在循环开始执行之前不知道重复的次数。\n\
  \n### while 语句\n\n![](img/Image00404.gif)\n\nC 语言中所有循环结构中最简单的是 `while` 语句。我们在之前的程序中已经使用了\
  \ `while`。`while` 语句的基本格式为：\n\n![](img/Image00405.gif)\n\n`while` 是一种入口控制循环语句。会对\
  \ `test-condition` 进行评估，如果条件为真，则执行循环体。在执行完循环体后，再次评估 `test-condition`，如果它为真，则再次执行循环体。这种重复执行循环体的过程一直持续，直到\
  \ `test-condition` 最终变为假，控制权转移到循环之外。退出时，程序继续执行紧跟循环循环之后的语句。\n\n循环体可以包含一个或多个语句。只有当循环体包含两个或多个语句时，才需要大括号。然而，即使循环体只有一个语句，使用大括号也是一种良好的习惯。\n\
  \n我们可以如下重写第 7.1 节讨论的程序循环：\n\n![](img/Image00406.gif)\n\n当 `n = 1, 2, ....., 10`\
  \ 时，循环体执行 10 次，每次都加上 `n` 值的平方，而 `n` 在循环内部被递增。测试条件也可以写成 `n < 11`；结果是相同的。这是一个计数控制循环的典型示例。变量\
  \ `n` 被称为 `counter` 或 `control variable`（控制变量）。\n\n另一个使用键盘输入的 `while` 语句示例所示：\n\n\
  ![](img/Image00407.gif)\n\n首先，将字符初始化为‘ '。然后 `while` 语句开始测试 `character` 是否不等于 `Y`。由于\
  \ `character` 初始化为‘ '，测试结果为真，并执行循环语句：\n\n```\ncharacter = getchar();\n```\n\n每当键入一个字母，就会进行测试并执行循环语句，直到按下字母\
  \ `Y`。当按下 `Y` 时，由于 `character` 等于 `Y`，条件变为假，循环终止，从而将控制权转移到语句 `xxxxxx;`。这是一个哨兵控制循环的典型示例。字符常量‘y’\
  \ 被称为 `sentinel value`，变量 `character` 是条件变量，通常称为 `sentinel variable`。\n\n![](img/Image00408.gif)\n\
  \n变量 `y` 初始化为 1，然后通过 `while` 循环乘以 `x` `n` 次。循环控制变量 `count` 在循环外初始化并在循环内递增。当 `count`\
  \ 的值大于 `n` 时，控制退出循环。\n\n![](img/Image00409.gif)\n\n**图 7.2** 使用 `while` 循环计算 `x`\
  \ 的方的程序\n\n![](img/Image00410.gif)\n\n## do 语句\n\n![](img/Image00411.gif)\n\n我们在上一节讨论的\
  \ `while` 循环结构在执行循环之前进行条件测试。因此，如果第一次尝试未满足条件，循环体可能完全不执行。在某些情况下，可能需要在执行测试之前执行循环体。这种情况可以通过\
  \ `do` 语句来处理。它的形式如下：\n\n![](img/Image00412.gif)\n\n遇到 `do` 语句时，程序首先评估循环体。在循环结束时，评估\
  \ `while` 语句中的 `test-condition`。如果条件为真，程序将再次评估循环体。只要条件为真，这个过程就会持续。当条件变为假时，循环将终止，控制权进入紧跟在\
  \ `while` 语句之后的语句。\n\n由于 `test-condition` 在循环底部进行评估，`do...while` 结构提供了一种出口控制循环，因此循环体至少会被执行一次。\n\
  \n一个 `do...while` 循环的简单示例是：\n\n![](img/Image00413.gif)\n\n这段程序从键盘读取一个数字，直到键入零或负数，并将其赋值给哨兵变量\
  \ `number`。\n\n测试条件也可以包含复合关系。例如，语句：\n\n```\nwhile (number > 0 && number < 100);\n\
  ```\n\n上面的示例会在 `number` 位于 0 和 100 之间时执行循环。\n\n考虑另一个示例：\n\n![](img/Image00414.gif)\n\
  \n只要两个关系中的一个为真，循环就会执行。\n\n![](img/Image00415.gif)\n\n该程序包含嵌套的 `do...while` 循环。外层循环由变量\
  \ `row` 控制并执行 12 次。内部循环由变量 `column` 控制，每外层循环执行一次时执行 10 次。也就是说，内部循环总共执行了 120 次，每次打印表格中的一个值。\n\
  \n![](img/Image00416.gif)\n\n**图 7.3** 使用 `do...while` 打印乘法表\n\n![](img/Image00417.gif)\n\
  \n注意内部循环的 `printf` 不包含任何换行符 (`\\n`)。这允许在一行内打印所有的值。外层循环中的空 `printf` 开启新行以打印下一行。\n\
  \n### for 语句\n\n![](img/Image00418.gif)\n\n简单的‘for’循环\n\n`for` 循环是另一种入口控制循环，提供了更简洁的循环控制结构。`for`\
  \ 循环的通用格式为：\n\n![](img/Image00419.gif)\n\n`for` 语句的执行如下：\n\n1. 首先使用赋值语句初始化控制变量，例如\
  \ `i = 1` 和 `count = 0`。变量 `i` 和 `count` 被称为循环控制变量。\n2. 使用 `test-condition` 测试控制变量的值。`test-condition`\
  \ 是关系表达式，例如 `i < 10` 或 `i > 0`，决定循环何时退出。如果条件为真，则执行循环体；否则循环终止，执行从紧跟循环的语句继续。\n3. 当执行循环体时，在评估完循环最后一个语句后，控制权传回\
  \ `for` 语句。现在，使用赋值语句递增或减少控制变量，例如 `i = i+1` 或 `i = i – 1`，并再次测试控制变量的值以查看是否满足循环条件。这一过程一直持续直到控制变量的值不再满足\
  \ `test-condition`。\n\n考虑以下程序段：\n\n![](img/Image00420.gif)\n\n![](img/Image00421.gif)\n\
  \n\n\n此 `for` 循环执行 10 次，并在一行中打印从 `0` 到 `9` 的数字。括号内的三个部分必须用分号隔开。注意，增量部分 `x = x+1`\
  \ 的末尾没有分号。\n\n`for` 语句允许负增量。例如，上述讨论的循环可以写如下所示：\n\n![](img/Image00422.gif)\n\n此循环也执行\
  \ 10 次，但输出将是从 `9` 到 `0`，而不是从 `0` 到 `9`。注意，当循环体只包含一条语句时，大括号是可选的。\n\n由于条件测试始终在循环开始时进行，如果条件在开始时失败，则循环体可能完全不会执行。例如，\n\
  \n![](img/Image00423.gif)\n\n将永远不会执行，因为测试条件在最开始时就失败了。\n\n让我们再次考虑第 7.1 节讨论的整数平方和问题。这个问题可以使用\
  \ `for` 语句按如下方式编码：\n\n![](img/Image00424.gif)\n\n循环体\n\n```\nsum = sum + n*n;\n\
  ```\n\n对于 `n = 1, 2, ..... 10` 会执行 10 次，每次将 `sum` 增加 `n` 值的平方。\n\n`for` 循环的重要点之一是所有三个操作（即初始化、测试和递增/减）都放置在\
  \ `for` 语句本身中，因此它们对程序员和用户来说在一个地方可见。`for` 语句及其等效的 `while` 和 `do` 语句见表 7.1。\n\n**表\
  \ 7.1** 三种循环的比较\n\n![](img/Image00425.gif)\n\n![](img/Image00426.gif)\n\n![](img/Image00427.gif)\n\
  \n**图 7.4** 使用 `for` 循环打印“2 的幂”表的程序\n\n该程序通过将 `2` 自乘 `n` 次来连续求出值：\n\n`p = 2 ^ n`\n\
  \n![](img/Image00428.gif)\n\n注意我们将 `p` 声明为 `long int`，将 `q` 声明为 `double`。\n\n![](img/Image00429.gif)\n\
  \n![](img/Image00430.gif)\n\n**图 7.5** 打印第 n 个斐波那契数的程序\n\n![](img/Image00431.gif)\n\
  \n![](img/Image00432.gif)\n\n![](img/Image00433.gif)\n\n**图 7.6** 打印 1 到 n 之间所有素数的程序\n\
  \n在图 7.6 所示的程序中，定义并使用了一个名为 `prime()` 的自定义函数。该函数检查给定的数字是否为素数。用户自定义函数将在后面的章节中详细讨论。\n\
  \n### for 循环的附加功能\n\nC 语言中的 `for` 循环具有一些其他循环结构中不具备的功能。例如，在 `for` 语句中可以同时初始化多个变量。语句\n\
  \n```\np = 1;\nfor (n=0; n<17; ++n)\n```\n\n可以重写为：\n\n```\nfor (p=1, n=0; n<17;\
  \ ++n)\n```\n\n注意初始化包含两个部分。\n\n与初始化部分一样，增量部分也可以有多多个部分。例如，\n\n![](img/Image00434.gif)\n\
  \n第三个特性是测试条件可以具有复合关系。例如，\n\n![](img/Image00435.gif)\n\n`for` 循环的另一个方面是某些部分可以省略。注意我们将\
  \ `p` 声明为 `long int`，将 `q` 声明为 `double`。\n\n```\np = 1;\nfor (n=0; n<17; ++n)\n\
  ```\n\n（注：原文后续存在重复段落，已按要求不再进行重复输出）\n\n\n\n\n可以使用 `break` 语句或 `goto` 语句来实现循环的提前退出。我们已经在\
  \ `switch` 语句中见过 `break`，在 `if...else` 结构中见过 `goto`。这些语句也可以用于 `while`、`do` 或 `for`\
  \ 循环。它们在图 7.9 和图 7.10 中得到了演示。\n\n![](img/Image00447.gif)\n\n**图 7.9** 使用 `break`\
  \ 语句退出循环\n\n当在循环内部遇到 `break` 语句时，循环将立即退出，程序将继续执行循环后的紧条语句。当存在嵌套循环时，`break` 只会退出包含它的那层循环。也就是说，`break`\
  \ 只会退出单层循环。\n\n由于 `goto` 语句可以将控制转移到程序的任何位置，因此在循环内部提供分支跳转是非常有用的。`goto` 的另一个重要用途是在发生错误时退出深层嵌套循环。此时，简单的\
  \ `break` 语句无法起作用。\n\n`goto` 语句将程序的控制从一个点转移到另一个点。然而，使用该语句时必须非常谨慎，因为这种控制转移会使程序失去结构。\n\
  \n![](img/Image00448.gif)\n\n**图 7.10** 使用 `goto` 语句在循环内跳转并退出循环\n\n![](img/Image00449.gif)\n\
  \n程序读取一个正值列表并计算它们的平均值。`for` 循环被编写为读取 1000 个值。然而，如果我们想要程序计算任何少于 1000 个值的平均值，那么我们必须在列表最后一个值之后输入一个“负”数，以标记输入的结束。\n\
  \n![](img/Image00450.gif)\n\n**图 7.11** 在程序中使用 `break`\n\n每个值在被读取时，都会被测试判断是否为正数。如果是正数，则将该值加到总和中；否则，循环终止。退出时，计算所读数值的平均值并打印结果。\n\
  \n![](img/Image00451.gif)\n\n我们使用 `for` 语句对级数中的每一项进行重复相加。由于这是一个无限级数，当项 `xn` 达到所需的精度时，函数的求将终止。决定循环操作次数的\
  \ `n` 值是未知的，因此我们任意选择了 100 这个值，这可能导致也可能无法预期的精度水平。\n\n![](img/Image00452.gif)\n\n\
  ![](img/Image00453.gif)\n\n**图 7.12** 使用 `goto` 退出循环\n\n精度测试使用 `if` 语句进行，`goto`\
  \ 语句一旦满足精度条件就会立即退出循环。如果循环次数不够大以产生预期的精度，程序将打印一条适当的消息。\n\n注意，`break` 语句在这里使用并不方便。正常退出和\
  \ `break` 退出都会将控制转移到出现在循环后面的同一条语句。但在当前的问题中，正常退出会打印消息“N 的最终值不足以达到所需的精度（FINAL VALUE\
  \ OF N IS NOT SUFFICIENT TO ACHIEVE DESIRED ACCURACY）”，而强制退出则打印评估结果。注意结尾处使用了空语句。这是必要的，因为程序不应该以标签结束。\n\
  \n## 结构化编程\n\n结构化编程是一种程序设计和开发的方法。它是一种通过仅使用以下三种基本控制结构来使程序逻辑易于理解的学科：\n\n*   顺序（直线）结构\n\
  *   选择（分支）结构\n*   重复（循环）结构\n\n虽然顺序和循环结构已足够满足所有的编程需求，但在某些情况下，选择结构证明更加方便。\n\n使用结构化编程技术有助于确保程序设计良好，与非结构化程序相比，这些程序更容易编写、读取、调试和维护。\n\
  \n结构化编程不提倡使用 `goto`、`break` 和 `continue` 等跳转语句来实现无条件分支。在最纯的形式下，结构化编程等同于“少 goto 编程（goto\
  \ less programming）”。\n\n**不要使用 `goto` 语句！**\n\n## 跳过循环的一部分\n\n在循环操作期间，在某些条件下可能需要跳过循环体的一部分。例如，在处理某些工作的申请时，我们可能希望排除属于某类别的申请人的数据处理。在读取申请人的类别代码时，会进行测试判断其申请是否应该被考虑。如果不考虑，将跳过处理申请详情的程序循环部分，继续执行下一次循环操作。\n\
  \n与 `break` 语句类似，C 支持另一种类似的语句，称为 `continue` 语句。然而，与导致循环终止的 `break` 不同，`continue`\
  \ 正其名，会在跳过中间的任何语句后使循环继续下一次迭代。`continue` 语句告诉编译器：“跳过后续语句并继续下一次迭代”。`continue` 语句的格式简单如下\n\
  \n```c\ncontinue;\n```\n\n在循环中使用 `continue` 语句的示例见图 7.13。在 `while` 和 `do` 循环中，`continue`\
  \ 会导致控制直接进入测试条件，然后继续迭代过程。对于 `for` 循环，在评估测试条件之前会执行增加部分。\n\n![](img/Image00454.gif)\n\
  \n**图 7.13** 跳过并继续循环\n\n![](img/Image00455.gif)\n\n程序计算一系列数字的平方根并打印结果。当输入 9999 时过程停止。\n\
  \n如果序列包含任何负数，则应跳过这些数的平方根评估过程，因为负数的平方根没有定义。使用 `continue` 语句来实现这一点。程序还会打印消息说明该数字为负数，并记录负数的数量。\n\
  \n最终输出包括评估的正数数量和遇到的负数数量。\n\n![](img/Image00456.gif)\n\n![](img/Image00457.gif)\n\
  \n**图 7.14** 使用 `continue` 语句\n\n## 避免 goto\n\n如前所述，避免使用 `goto` 是一种良好的做法。有很多原因。使用\
  \ `goto` 时，许多编译器会生成效率较低的代码。此外，大量使用会让程序逻辑变得复杂并导致程序不可读。通过仔细 get 的设计可以避免 `goto`。如果绝对需要任何\
  \ `goto`，应该对其进行记录。图 7.15](#text00013.html_fig7-15) 所示的 `goto` 跳转会导致问题，因此必须避免。\n\n\
  ![](img/Image00458.gif)\n\n**图 7.15** 必须避免的 goto 跳转\n\n## 跳出程序\n\n我们刚刚看到可以使用 `break`\
  \ 语句或 `goto` 语句跳出循环。类似地，我们可以通过库函数 `exit()` 跳出程序。如果由于某些原因，我们希望跳出程序并返回操作系统，可以使用 `exit()`\
  \ 函数，如下所示：\n\n![](img/Image00459.gif)\n\n`exit()` 函数接受一个整数作为参数。通常用零表示正常终止，用非零表示由于错误或异常情况导致的终止。使用\
  \ `exit()` 函数需要包含头文件 `<stdlib.h>`。\n\n\n\n\n\n我们经常在 `if`、`for`、`while` 和 `do` 语句中使用测试表达式，通过对其求值并与零比较来做出分支决策。由于每个整数表达式都有真/假值，我们不需要与零进行显式比较。例如，当\
  \ `x` 不为零时，表达式 `x` 为真；当 `x` 为零时，为假。通过应用 `!` 运算符，我们可以写出不需要任何关系运算符的简洁测试表达式。\n\n```\n\
  if (expression ==0)\n```\n\n等同于\n\n```\nif(!expression)\n```\n\n同样地，\n\n```\nif\
  \ (expression! = 0)\n```\n\n等同于\n\n```\nif (expression)\n```\n\n例如，\n\n`if (m%5\
  \ == 0 && n%5 == 0)` 等同于 `if (!(m%5)&&!(n%5))`。\n\n## [核心概念]\n\n- **控制语句**：测试某些条件并引导循环体的重复执行。[LO\
  \ 7.1]\n- **程序循环**：重复执行一组语句，直到满足循环终止的某些条件为止。[LO 7.1]\n- **while 语句**：是一种进入控制循环，先评估测试条件，如果条件为真，则执行循环体。[LO\
  \ 7.1]\n- **do 语句**：先执行循环体，然后在随后的 `while` 语句中评估测试条件。[LO 7.2]\n- **break 语句**：终止循环并将程序控制权交给紧随循环后的语句。[LO\
  \ 7.4]\n- **continue 语句**：跳过循环的剩余部分，并将程序控制权交给下一次循环迭代。[LO 7.4]\n\n## [始终记住]\n\n-\
  \ 在测试表达式中使用错误的关系运算符是一个常见错误。请确保循环执行的次数恰好等于要求。[LO 7.1]\n- 避免使用 `=` 代替 `==` 运算符的常见错误。[LO\
  \ 7.1]\n- 不要对浮点值进行等值比较。[LO 7.1]\n- 在循环体中对变量进行重复操作时，确保该变量在进入循环之前已正确初始化。[LO 7.1]\n\
  - 适当对循环体中的语句进行缩进，以增强可读性和理解性。[LO 7.1]\n- 强烈建议在循环和结束标记前后留空格。[LO 7.1]\n- 不要忘记在 `do\
  \ ….while` 语句末尾放置分号。[LO 7.2]\n- 不要忘记在 `while` 或 `do…while` 循环体中放置递增语句。[LO 7.2]\n\
  - 避免使用 `while` 和 `for` 语句来实现退出控制（后测试）循环。请使用 `do…while` 语句。同样，不要将 `do…while` 用于前测试循环。[LO\
  \ 7.2]\n- 在 `while` 或 `for` 语句的控制表达式后放置分号不是语法错误，但它极可能是一个逻辑错误。[LO 7.3]\n- 在 `for`\
  \ 语句的头部使用逗号代替分号是一个错误。[LO 7.3]\n- 不要在 `for` 语句和循环体中同时更改控制变量。这是一个逻辑错误。[LO 7.3]\n-\
  \ 虽然法律上允许将初始化、测试和递增部分放在 `for` 语句头部之外，但请尽可能避免这样做。[LO 7.3]\n- 虽然允许在初始化和递增部分使用算术表达式，但要注意在评估过程中的舍入和截断误差。[LO\
  \ 7.3]\n- 虽然可以将 `for` 之前的语句和循环体中的语句放置在 `for` 头部中，但请避免这样做，因为这会让程序更难以阅读。[LO 7.3]\n\
  - 在任何循环中使用 `break` 和 `continue` 语句均被视为无结构化编程。尝试尽可能消除对这些跳转语句的使用。[LO 7.4]\n- 避免在程序的任何地方使用\
  \ `goto`。[LO 7.4]\n- 仅在需要跳出程序时才使用函数 `exit()`。[LO 7.4]\n\n## [案例分析]\n\n### 1. 二项式系数表\
