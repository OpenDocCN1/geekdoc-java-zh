  图. 2.5 投资问题的程序\n让我们考虑此程序中引入的新特性。第二行和第三行以 `#define` 指令开头。`#define` 指令将一个值定义为一个符号常量，供程序使用。每当遇到符号名称时，编译器会自动替换与该名称关联的值。要更改该值，只需更改定义即可。在这个示例中，我们定义了两个符号常量\
  \ `PERIOD` 和 `PRINCIPAL`，并分别赋值为 10 和 5000.00。这些值在程序的整个执行过程中保持不变。\n![](img/Image00071.gif)\n\
  图. 2.6 投资程序的输出\n### #define 指令\n`#define` 是一个预处理器编译器编译指令，而不是一条语句。因此，`#define` 行不应以分号结尾。符号常量通常用大写字母写，以便与小写变量名区分来。`#define`\
  \ 指令通常放置在 `main()` 函数之前。符号常量不在声明区域中声明。预处理器指令将在第 15 章中讨论。\n![](img/Image00072.gif)\n\
  我们必须注意，定义的常量不是变量。我们不能通过赋值语句在程序中更改它们的值。例如，语句\n```c\n```\n是非法的。\n声明部分将 `year` 声明为整数，将\
  \ `amount`、`value` 和 `inrate` 声明为浮点数。注意所有浮点变量都在一个语句中声明。它们也可以声明为：\n```c\nfloat value;\n\
  ```\n当在一个语句中声明两个或多个变量时，用逗号隔开。\n所有的计算和打印都在 `while` 循环中完成。`while` 是一种重复评估一条语句或一组语句的机制。在这种情况下，只要\
  \ `year` 的值小于或等于 `PERIOD` 的值，`while` 之后的四条语句就会执行。注意这四条语句是用括号分组的。当 `year` 大于 `PERIOD`\
  \ 时，我们退出循环。循环的概念和类型将在第 7 章讨论。\nC 支持基本的四种算术运算符（–、+, \\*, /）以及其他几种运算符。它们将在第 4 章讨论。\n\
