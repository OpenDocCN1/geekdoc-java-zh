  ![](img/#text00006.html_ch6-2a)\n引言\n\n我们已经看到，C 程序是一组语句，这些语句通常按照它们出现的顺序顺序执行。这在不需要某些选项或不需要对某些计算进行重复时发生。但在实践中，我们有很多情况，可能需要根据某些条件改变语句的执行顺序，或者重复一组语句直到满足某些特定条件。这涉及到一种决策过程，以判断特定条件是否发生，然后指导计算机相应执行某些语句。\n\
  \nC 语言通过支持以下语句具备了这种决策能力：\n\n1. `if` 语句\n2. `switch` 语句\n3. 三目运算符语句\n4. `goto` 语句\n\
  \n这些语句俗被称为决策语句。由于这些语句“控制”了执行流，因此它们也被称为控制语句。\n\n我们已经在早早的示例中使用过这些语句中的一些。在这里，我们将更详细地讨论它们的特征、功能和应用。\n\
  \n## 使用 if 语句进行决策\n\n![](img/Image00301.gif)\n\n`if` 语句是一种强大的决策语句，用于控制语句的执行流。它基本上是一个双向决策语句，并与表达式结合使用。它的形式如下：\n\
  \n```c\nif (test expression)\n```\n\n![](img/Image00302.gif)\n\n图 6.1 双向分支\n\n它允许计算机首先评估表达式，然后根据表达式的值（关系或条件）是“真”（非零）还是“假”（零），将控制转移到特定的语句。程序的这一部分有两条路径可以走，一条用于真条件，另一条用于假条件，如图\
  \ 6.1 所示。\n\n使用 `if` 语句进行决策的一些示例是：\n\n1. `if (银行余额为零)` 借钱\n2. `if (房间是黑暗)` 开灯\n\
  3. `if (代码为 1)` 人是男性\n4. `if (年龄大于 55)` 人已退休\n\n`if` 语句可以根据测试条件的复杂性以不同的形式实现。不同的形式有：\n\
  \n1. 简单 `if` 语句\n2. `if.....else` 语句\n3. 嵌套 `if....else` 语句\n4. `else if` 阶梯。\n\n\
  我们将在接下来的几中讨论其中的每一个一个。\n\n## 简单 if 语句\n\n简单 `if` 语句的一般形式为\n\n![](img/Image00303.gif)\n\
  \n`statement-block` 可以是单条语句，也可以一组语句。如果测试表达式为真，则执行 `statement-block`；否则，将跳过 `statement-block`，执行将跳转到\
  \ `statement-x`。记住，当条件为真时，`statement-block` 和 `statement-x` 都会顺序执行。这在图 6.2 所示。\n\
  \n![](img/Image00304.gif)\n\n**图 6.2** 简单 if 控制流程图\n\n考虑以下用于处理入学考试获得分数的程序段。\n\n\
  ![](img/Image00305.gif)\n\n程序测试学生的类别类型。如果学生属于体育（SPORTS）类别，则在打印分数之前，会在分数中加上额外的 `bonus_marks`。对于其他人，则不加\
  \ `bonus_marks`。\n\n![](img/Image00306.gif)\n\n图 6.3 所示的程序已针对两组数据运行过，以查看路径功能正常。第一次运行的结果打印为：\n\
  \nRatio = –3.181818\n\n![](img/Image00307.gif)\n\n**图 6.3** 简单 if 语句说明\n\n![](img/Image00308.gif)\n\
  \n第二次运行没有产生任何结果或任何消息。在第二次运行期间，`(c–d)` 的值为零，因此，`statement-block` 中的语句被跳过了。由于 `statement-block`\
  \ 之后没有其他语句，程序在不产生任何输出的情况下停止。\n\n注意在评估比例的语句中使用 `float` 转换。这对于避免整数除法导致的截断是必要的。记住，第一次运行的输出\
  \ -3.181818 是正确的。在评估比例的语句中使用 `float` 转换对于避免整数除法导致的截断是必要的。\n\n![](img/Image00309.gif)\n\
  \n程序必须测试两个条件，一个针对体重，另一个针对身高。这是通过以下方式实现的：\n\n```c\nif (weight < 50)\n```\n这是通过两个\
  \ if 语句实现的：\n\n```c\nif (weight < 50)\nif (height > 170)\n    count = count +1;\n\
  ```\n\n![](img/Image00310.gif)\n\n![](img/Image00311.gif)\n\n**图 6.4** 使用 if 进行计数\n\
  \n## [应用德·摩根定律]\n\n在设计决策语句时，我们经常会遇到逻辑非（NOT）运算符应用于复合表达式的情况，例如 `!(x&&y)`。然而，正逻辑总是比负逻辑更容易读。在这种情况下，我们可以应用所谓的德·摩根定律来使表达式变为正逻辑。规则如下：\n\
  \n- `x` 变为 `!x`\n- `!x` 变为 `x`\n- `&&` 变为 `||`\n- `||` 变为 `&&`\n\n示例：\n\n- `!(x\
  \ && y || !z)` 变为 `!x || !y && z`\n- `!(x <=0 || !condition)` 变为 `x > condition`\n\
  \n## if.....else 语句\n\n![](img/Image00312.gif)\n\n`if...else` 语句是简单 `if` 语句的扩展。其一般形式为\n\
  \n```c\nif (test expression)\n{\n    // true-block\n}\nelse\n{\n    // false-block\n\
  }\n```\n\n![](img/Image00313.gif)\n\n如果测试表达式为真，则执行紧随 `if` 语句的 `true-block`；否则，执行\
  \ `false-block`。在任何情况下，只会执行 `true-block` 或 `false-block`，而不会都执行。这在图 6.5 所示。\n\n\
  ![](img/Image00314.gif)\n\n**图 6.5** if......else 控制图\n\n让我们考虑一个统计教室男女人数的示例。我们用代码\
  \ 1 代表男，2 代表女。执行此操作的程序语句写如下：\n\n```c\nif (code == 1)\n    boys = boys +1;\nif (code\
  \ == 2)\n    girls = girls +1;\n```\n\n第一个测试确定学生是否为男孩。如果是，男孩人数增加 1，然后程序继续到第二个测试。第二个测试再次确定学生是否为女。。这是没有必要的。上面的程序段可以使用\
  \ `else` 子句修改如下：\n\n```c\nif (code == 1)\n    boys = boys +1;\nelse\n    girls =\
  \ girls +1;\n```\n\n![](img/Image00315.gif)\n![](img/Image00316.gif)\n\n\n\n\n在这里，如果代码等于\
  \ 1，则执行语句 `boy = boy + 1 ;`，控制转移到语句 `xxxxxx`，并跳过 `else` 部分。如果代码不等于 1，则跳过语句 `boy\
  \ = boy + 1 ;`，并在控制到达语句 `xxxxxxxxxxxx` 之前执行 `else` 部分的语句 `girl = girl + 1 ;`。\n\n\
  考虑图 6.3 所示的程序。当值 `(c–d)` 为 0 时，不计算比率，程序停止且不显示任何信息。在这种情况下，我们可能不知道程序停止是因为零值还是其他错误。可以通过如下方式添加\
  \ `else` 子句来改进该程序：\n\n![](img/Image00317.gif)\n\n![](img/Image00318.gif)\n\n幂级数包含以下类型的递归关系：\n\
  \n![](img/Image00319.gif)\n\n如果已知 `T n-1`（通常称为前一项），则通过将前一项乘以 `x/n` 就可以很容易找到 `T n`（称为当前项）。然后\n\
  \n`ex = T0 + T1 + T2 + ...... + Tn = sum`\n\n![](img/Image00320.gif)\n\n![](img/Image00321.gif)\n\
  \n**图. 6.6** if...else 语句的示例\n\n程序使用 `count` 来统计相加项数。当项的值小于 `0.0001`（`ACCURACY`）时，程序停止。注意，当项小于\
  \ `ACCURACY` 时，`n` 的值被设置为 `999`（一个大于 100 的数字），因此 `while` 循环终止。结果在 `while` 循环之外打印。\n\
  \n### if....else 语句的嵌套](#text00006.html_ch6-7a)\n\n当涉及一系列决策时，我们可能需要使用多个嵌套形式的 `if...else`\
  \ 语句，如下：\n\n![](img/Image00322.gif)\n\n执行逻辑如图图 6.7 所示。如果 `condition-1` 为假，则将执行 `statement-3`；否则，继续进行第二个测试。如果\
  \ `condition-2` 为真，则将评估 `statement-1`；否则，将评估 `statement-2`，然后控制转移到 `statement-x`。\n\
  \n![](img/Image00323.gif)\n\n**图. 6.7** 嵌套 if…else 语句的流程图\n\n某商业银行引入了一项激励政策，向所有存款持有者发放奖金。政策如下：每人将获得\
  \ 12 月 31 日当日余额的 2% 作为奖金，无论余额金额多少；如果账户持有者是女性且余额余额超过 5000 卢比，则获得 5% 的奖金。这种逻辑可以如下所示编写代码：\n\
  \n![](img/Image00324.gif)\n\n嵌套时，应注意将每个 `if` 与一个 `else` 匹配。考虑上述程序的以下替代方案（乍看是正确的）：\n\
  \n```\nif (sex is female)\n```\n\n![](img/Image00325.gif)\n\n关于 `else` 属于哪个 `if`\
  \ 存在歧义。在 C 语言中，`else` 与最近的未终止的 `if` 链接。因此，`else` 与内部的 `if` 关联，外部的 `if` 没有 `else`\
  \ 选项。这意味着计算机正尝试执行语句\n\n```\nbalance = balance + bonus;\n```\n\n而没有真正为男性账户持有者计算奖金。\n\
  \n考虑另一个替代方案，它看起来也是正确的：\n\n![](img/Image00326.gif)\n\n![](img/Image00327.gif)\n\n\
  在这种情况下，`else` 与外部的 `if` 关联，因此为男性账户持有者计算了 `bonus`。然而，余额等于或小于 5000 的女性账户持有者没有计算 `bonus`，因为内部的\
  \ `if` 缺少 `else` 选项。\n\n![](img/Image00328.gif)\n\n![](img/Image00329.gif)\n\n![](img/Image00330.gif)\n\
  \n**图. 6.8** 选择三个数中的最大值\n\n### 悬空 else 问题 (Dangling Else Problem)\n\n![](img/Image00331.gif)\n\
  \n当我们开始使用嵌套 if….else 语句时，遇到的经典问题之一就是悬空 else。当 `if` 没有匹配的 `else` 时就会发生这种情况。该问题的答案非常简单：始终将\
  \ `else` 与当前块中最近的未匹配的 `if` 匹配。在某些情况下，可能不需要假条件。在这种情况下，可以省略 `else` 语句。\n\n“else 总是与最近的未配对\
  \ if 配对”\n\n### else if 阶梯\n\n当涉及多路径决策时，还有另一种将 `if` 组合的方法。多路径决策是一个 `if` 链，其中与每个\
  \ `else` 关联的语句是 `if`。它具有以下通用形式：\n\n![](img/Image00332.gif)\n\n这种结构被称为 else if 阶梯。条件从顶部（梯子顶端）开始向下评估。一旦发现真条件，就会执行与其关联的语句。当所有条件都为假时，将执行包含\
  \ `default-statement`。图 6.9 展示了 else if 语句的执行逻辑。\n\n![](img/Image00333.gif)\n\n\
  **图. 6.9** else if 阶梯的流程图\n\n让我们考虑一个学术机构的评分示例。根据以下规则进行评分：\n\n![](img/Image00334.gif)\n\
  \n可以使用 else if 阶梯如下所示进行评分：\n\n![](img/Image00335.gif)\n\n![](img/Image00336.gif)\n\
  \n考虑另一个示例：\n\n![](img/Image00337.gif)\n\n除 1、2 或 3 以外的代码被视为 YELLOW。相同的结果可以通过嵌套 if...else\
  \ 语句获得。\n\n![](img/Image00338.gif)\n\n在这种情况下，选择权交给程序员。然而，为了选择既有效又高效的结构，程序员必须充分了解\
  \ if 的各种形式。在上述两个示例中，RED、GREEN 和 WHITE 被假设为符号常量。\n\n![](img/Image00339.gif)\n\n图\
  \ 6.10 中的程序读取客户编号和消耗量，并打印客户需要支付的金额。\n\n![](img/Image00340.gif)\n\n**图. 6.10** else..if\
  \ 阶梯的示例\n\n### 缩进规则 (Rules for Indentation)\n\n在使用控制结构时，一个语句通常控制随其后的许多语句。在这种情况下，使用缩进来显示缩进的语句依赖于前面的语句是一种良好的做法。使用缩进时可以遵循的一些指南如下：\n\
  \n- 对依赖于先前语句进行缩进；提供至少三个空格的缩进。\n- 将 `else` 子句与其匹配的 `if` 子句对齐。\n- 使用单独成行的括号来识别语句块。\n\
  - 将块中的语句相对于大括号向右缩进至少三个空格。\n- 对齐起始和结束括号。\n- 使用适当的注释标记块的开始和结束。\n- 按照上述规则对嵌套语句缩进。\n\
  - 每行仅编写一个子句或语句。\n\n![](img/Image00341.gif)\n\n## switch 语句\n\n![](img/Image00342.gif)\n\
  \n我们已经看到当需要从许多备方案中选择一个时，可以使用 if 语句来控制选择。然而，当备方案数量增加时，程序的复杂性会剧增。程序变得难以阅读和遵循。有时甚至会让设计它的人感到困惑。幸运的是，C\
  \ 语言内置了一种名为 switch 的多路决策语句。switch 语句将给定变量（或表达式）的值与一组 case 值比较，当找到匹配项时，执行与该 关联的语句块。switch\
  \ 语句的通用形式如下：\n\n![](img/Image00343.gif)\n\n\n\n该表达式是一个整数表达式或字符。`value-1`、`value-2`\
  \ ..... 是常量或常量表达式（可求值为整常量），被称为分支标签（case labels）。这些值中的每一个在 `switch` 语句中都应当是是唯一的。`block-1`、`block-2`\
  \ .... 是语句列表，可以包含零个或多个语句。不需要在这些块周围加大括号。注意，分支标签以冒号（`:`）结尾。\n\n当执行 `switch` 时，表达式的值将与\
  \ `value-1`、`value-2`、.... 等值进行比较。如果找到某个 case 值与表达式的值匹配，则执行该 case 之后的语句块。\n\n每个块末尾的\
  \ `break` 语句表示特定 case 的结束，并导致退出 `switch` 语句，将控制转移到 `switch` 之后的 `statement-x`。\n\
  \n`default` 是一个可选的 case。如果存在，当表达式的值与任何 case 值都不匹配时，将将执行它。如果不存在，当所有匹配都失败时，不执行任何操作，控制将转移到\
  \ `statement-x`。（ANSI C 允许使用多达 257 个分支标签）。\n\n`switch` 语句的选择过程如图图 6.11 所示的流程图。\n\
  \n![](img/Image00344.gif)\n\n**图 6.11** `switch` 语句的选择过程\n\n正如上一节讨论的，`switch` 语句可以对学生进行评分，如下所示：\n\
  \n![](img/Image00345.gif)\n\n注意我们使用了一个转换语句\n\n```\nindex = marks / 10;\n```\n\n\
  其中，`index` 被定义为整数。变量 `index` 取以下整数值。\n\n![](img/Image00346.gif)\n\n程序的这部分代码展示了两个重要特性。首先，它使用了空\
  \ case。前三个 case 将执行相同的语句\n\n```\ngrade = ‘H’;\nbreak;\n```\n\n`case 7` 和 `case 6`\
  \ 也是如此。其次，`default` 条件被用于所有 `marks` 小于 40 的其他情况。\n\n`switch` 语句通常用于菜单选择。例如：\n\n\
  ![](img/Image00347.gif)\n\n可以嵌套 `switch` 语句。也就是说，一个 `switch` 可以是 case 语句的一部分。ANSI\
  \ C 允许 15 层嵌套。\n\n### Switch 语句的规则\n\n![](img/Image00348.gif)\n\n- `switch` 表达式必须是整数类型。\n\
  - 分支标签必须是常量或常量表达式。\n- 分支标签必须是唯一的。任意两个标签不能具有相同的值。\n- 分支标签必须以冒号结尾。\n- `break` 语句将控制转移到\
  \ `switch` 语句之外。\n- `break` 语句是可选的。也就是说，两个或多个分支标签可以属于相同的语句。\n- `default` 标签是可选的。如果存在，当表达式找不到匹配的分支标签时，将执行它。\n\
  - 最多可以有一个 `default` 标签。\n- `default` 可以放在任何地方，但通常放置在末尾。\n- 允许嵌套 `switch` 语句。\n\n\
  ![](img/Image00349.gif)\n![](img/Image00350.gif)\n![](img/Image00351.gif)\n\n**图\
  \ 6.12** 读取并打印 1 到 12 范围内月份名称的程序\n\n![](img/Image00352.gif)\n\n### ? : 运算符\n\n![](img/Image00353.gif)\n\
  \nC 语言中有一个特殊的运算符，用于进行双向决策。该运算符是 `?` 和 `:` 的组合，并接受三个操作数。该运算符俗称为条件运算符（conditional\
  \ operator）。条件运算符的般用形式如下：\n\n```\nconditional expression ? expression1 : expression2\n\
  ```\n\n首先求值条件表达式。如果结果非零，则求值 `expression1` 并作为条件表达式的值返回。否则，求值 `expression2` 并返回其值。例如，段代码\n\
  \n![](img/Image00354.gif)\n\n可以写为\n\n```\nflag = ( x < 0 ) ? 0 : 1;\n```\n\n考虑以下函数的求值：\n\
  \n```\ny = 1.5x + 3 for x £ 2\ny = 2x + 5 for x > 2\n```\n\n可以使用条件运算符如下求值：\n\n```\n\
  y = ( x > 2 ) ? (2 * x + 5) : (1.5 * x + 3);\n```\n\n条件运算符可以嵌套以求值更复杂的赋值决策。例如，考虑一个销售家产产品的女销售的周工资。如果\
  \ `x` 是每周销售的产品数量，她的周工资由给出\n\n![](img/Image00355.gif)\n\n这个复杂的方程可以写为：\n\n```\nsalary\
  \ = (x != 40) ? ((x < 40) ? (4*x+100) : (4.5*x+150)) : 300;\n```\n\n可以使用 `if...else`\
  \ 语句按如下方式求值：\n\n![](img/Image00356.gif)\n\n当使用条件运算符时，代码变得更加简洁。然而可读性较差。当需要多层嵌套时，使用\
  \ `if` 语句更好。\n\n用于处理申请并进行分支处理的程序如图图 6.13 所示。\n\n![](img/Image0357.gif)\n\n使用条件运算符的插图\n\
  \n![](img/Image0358.gif)\n![](img/Image0359.gif)\n\n**图 6.13** 条件运算符的插图\n\n程序使用了以下变量：\n\
  \n`loan3` - 存在\n`loan2` - 之前的\n`sum23` - 总和\n`sanction` - 授权\n\n授权规则如下：\n\n1. `loan1`\
  \ 应为零。\n2. `loan2 + sum3` 不应大于 MAX\n\n注意使用 `long int` 类型声明变量。\n\n![](img/Image00360.gif)\n\
  ![](img/Image0361.gif)\n![](img/Image0362.gif)\n\n**图 6.14** 确定两个数最大公约数的程序\n\n图\
  \ 6.14 中的程序使用了自定义递归函数 `GCD()`。函数的声明、定义和调用将在后面的章节详细讨论。\n\n### 编写多路选择的指南\n\n复杂的多路选择语句需要特别注意。读者应该能够理解逻辑。以下是一些有助于改进和维护的指南：\n\
  \n- 避免复合否定语句。尽可能使用肯定语句。\n- 保持逻辑表达式简单。必要时我们可以使用嵌套的 `if` 语句来实现（KISS - 保持简单直接）。\n-\
  \ 尝试编写正常/预期条件。\n- 使用最可能的条件。这将消除不必要的测试，提高程序的效率。\n- 嵌套 `if` 和 `switch` 语句之间的选择取决于个人喜好。\n\
  \n当替代路径有三到十条时，使用 `switch` 是一个很好的法则。\n\n- 使用正确的缩进（参见缩进规则）。\n- 养成在 `switch` 语句中使用\
  \ `default` 子句的习惯。\n- 将相似操作的分支标签分组。\n\n\n\n\n注意，`goto` 会打破程序正常的顺序执行。如果 `label:`\
  \ 位于语句 `goto label;` 之前，则会形成一个循环，某些语句将被重复执行。这种跳转被称为向后跳转。相反，如果将 `label:` 放置在 `goto\
  \ label;` 之后，则某些语句将被跳过，这种跳转被称为正向跳转。\n\n`goto` 通常用于程序的末尾，将控制权导向输入语句，以读取更多数据。考虑以下示例：\n\
  \n![](img/Image00365.gif)\n\n![](img/Image00366.gif)\n\n该程序用于计算从终端读取的一系列数字的平方根。程序使用了两个\
  \ `goto` 语句：一个位于末尾打印结果之后，用于将控制权传回输入语句；另一个用于在数字为负时跳过任何进一步的计算。\n\n由于末尾有无条件 `goto`\
  \ 语句，控制权总是传回输入语句。实际上，这个程序让计算机进入了一个被称为“死循环”的永久循环。计算机会一直循环运行，直到我们采取某些特殊步骤来终止循环。应该避免此类死循环。习题\
  \ 6.9 示例了如何消除此类死循环。\n\n![](img/Image00367.gif)\n\n![](img/Image00368.gif)\n\n![](img/Image00369.gif)\n\
  \n**图 6.15** `goto` 语句的使用\n\n`goto` 语句的另一个用途是在遇到某些特殊条件时，将控制权移出循环（或嵌套循环）。例如：\n\n\
  ![](img/Image00370.gif)\n\n我们应该尽量避免使用 `goto`。但如果我们用它来增强程序的可读性或提高执行速度，那也没有什么问题。\n\
  \n## 核心概念 (#text00006.html_ch6-12a)\n\n- **决策语句 (Decision-making statements)**：控制程序执行流的语句。[LO\
  \ 6.1]\n- `switch` 语句：一种多路决策语句，通过将给定的值与 `case` 值列表进行匹配来选择要执行的语句块。[LO 6.3]\n- **条件运算符\
  \ (Conditional operator)**：一种双路决策语句，根据条件表达式的结果返回两个表达式值之一。[LO 6.4]\n- `goto` 语句：用于无条件分支。它将控制流转移到找到匹配标签的地方。[LO\
  \ 6.5]\n- **死循环 (Infinite loop)**：一组指令被重复执行的条件。[LO 6.5]\n\n## 始终记住 (#text00006.html_ch6-13a)\n\
  \n- 注意控制表达式中的任何副作用，例如 `if(x++)`。[LO 6.1]\n- 检查是否用 `=` 运算符代替了等号运算符 `==`。[LO 6.1]\n\
  - 在关系运算符 `=`、`!=`、`>=` 和 `<=` 的符号之间不要留任何空格。[LO 6.1]\n- 将 `!=`、`>=` 和 `<=` 运算符写成\
  \ `=! `、`=>` 和 `=<` 是错误的。[LO 6.1]\n- 记得逻辑运算符要使用两个和符号（`&&`）和两个竖线（`||`）。使用单个运算符会导致逻辑错误。[LO\
  \ 6.1]\n- 不要忘记为 `if` 表达式加上括号。[LO 6.1]\n- 在 `if` 表达式后放置分号是错误的。[LO 6.1]\n- 不要使用等号运算符比较两个浮点值。它们很少完全相等。[LO\
  \ 6.1]\n- 避免在逻辑二元表达式中使用具有副作用的操作数，例如 `(x--&&++y)`。第二个操作数可能完全不被求值。[LO 6.1]\n- 注意悬空\
  \ else 语句（dangling else）。[LO 6.2]\n- 使用大括号封装 `if...else` 语句中 `if` 和 `else` 子句的语句。[LO\
  \ 6.2]\n- 当 `switch` 语句中的各个 case 互斥时，不要忘记使用 `break` 语句。[LO 6.3]\n- 虽然是可选的，但在 `switch`\
  \ 语句中使用 `default` 子句是一个良好的编程习惯。[LO 6.3]\n- 在 `switch` 语句的 `case` 标签中使用变量作为值是错误的。（只允许整型常量。）[LO\
  \ 6.3]\n- 在 `switch` 语句的两个 `case` 标签中使用相同的常量。[LO 6.3]\n- 尝试使用简单的逻辑表达式。[LO 6.4]\n\
  - 在程序中放置 `goto` 标签时要小心，因为它可能导致死循环条件。[LO 6.5]\n\n## 案例分析 (#text00006.html_ch6-14a)\n\
