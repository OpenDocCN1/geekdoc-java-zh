  \ 16.4 M]\n\n![](img/#text00006.html_app1)\n\n## 引言\n\nC 语言与其他高级语言相比，其独特特征之一是它允许直接操作字中的单个位。位级操作被用于将特定位或一组位设置为\
  \ 1 或 0。它们也被用于更快地执行某些数值计算。如第 4 章所示，C 支持以下运算符：\n\n1. 位逻辑位运算符。\n2. 位移位运算符。\n3. 反码运算符。\n\
  \n所有这些运算符只对整数类型的操作数有效。\n\n## 位逻辑位运算符\n\n有四种逻辑位运算符。它们如下：\n\n* 位逻辑与 (`&`)\n* 位逻辑或\
  \ (`|`)\n* 位逻辑取反/非 (`~`)\n* 位逻辑异或 (`^`)\n\n除了取反符号外，所有运算符都是二元运算符，需要两个整数类型的操作数。取反\
  \ (`~`) 是一个一元运算符。这些运算符从最低位（即最右侧的位）开始逐位对其操作数进行操作，如表 I.1 所示设置结果中的每个位。\n\n表 I.1 逻辑位运算的结果\n\
  \n![](img/Image01128.gif)\n\n### 位逻辑与\n\n位逻辑与运算符由单个 ampersand (`&`) 表示，并在两边被整数表达式包围。如果两个位的值均为\
  \ 1，则与运算的结果为 1；否则为 0。让我们考虑两个变量 `x` 和 `y`，其值分别为 13 和 25。这两个变量的二进制表示如下：\n\n`x - -\
  \ -> 0000 0000 0000 1101`\n`y - - -> 0000 0000 0001 1001`\n\n如果我们执行语句\n\n```\nz\
  \ = x & y ;\n```\n\n那么结果将是：\n\n`z - - -> 0000 0000 0000 1001`\n\n尽管生成的位模式表示十进制 9，但这三个变量的十进制值之间没有明显的联系。\n\
  \n位逻辑与通常用于测试特定位是 1 还是 0。例如，以下程序测试变量 `flag` 的第四位是 1 还是 0。\n\n![](img/Image01129.gif)\n\
  \n请注意，位逻辑位运算符的优先级低于关系运算符。以下程序测试一个数字是奇数还是偶数。\n\n![](img/Image01130.gif)\n![](img/Image01131.gif)\n\
  \n### 位逻辑或\n\n位逻辑或由符号 `|` 表示，并由两个操作数包围。如果位中至少有一个的值为 1，则或运算的结果为 1；否则为 0。考虑上面的变量 `x`\
  \ 和 `y`。\n\n![](img/Image01132.gif)\n\n位逻辑或运算通常用于将特定位设置为 1。例如：\n\n```\nflag = |\n\
  ```\n\n![](img/Image01133.gif)\n\n### 位逻辑取反\n\n取反运算符 `~`（也称为反码）是一个一元运算符，它会反转操作数的所有位。也就是说，0\
  \ 变成 1，1 变成 0。例如：\n\n`x = 1111 1111 1111 1011`\n`~x = 0000 0000 0000 0100`\n\n该运算符通常与与运算符结合以关闭特定位。例如，语句\n\
  \n```\nflag = &x\n```\n\n将关闭第四位。\n\n### 位逻辑异或 (XOR)\n\n位逻辑异或由符号 `^` 表示。如果只有一个位的值为\
  \ 1，则异或的结果为 1。考虑相同的变量 `x` 和 `y`。\n\n![](img/Image01134.gif)\n\n异或运算可以使用基础位运算符——与、或和取反来实现：\n\
  \n`x^y = (x & (~y)) | ((~x) & y)`\n\n`x = 0000 0000 0000 1101`\n`y = 0000 0000 0001\
  \ 1001`\n`~x = 1111 1111 1111 0010`\n`~y = 1111 1111 1111 0110`\n`x & (~y) = 0000\
  \ 0000 0000 0100`\n`(~x) & y = 0000 0000 0001 0000`\n`(x & (~y)) | ((~x) & y) =\
  \ 0000 0000 0001 0100`\n\n应该注意，结果与计算 `x^y` 的结果相同。\n\n## 位移运算符\n\n位移运算符用于将位模式向左或向右移动。位移运算符由符号\
  \ `<<` 和 `>>` 表示，并如下所示：\n\n左移：`op << n`\n\n右移：`op >> n`\n\n`op` 是要移动的整数表达式，`n` 是要移动的位数。\n\
  \n左移操作使 `op` 中的所有位向左移动 `n` 位。原始位模式中最左侧的 `n` 位将丢失，右侧空出的 `n` 位将填充 0。\n\n同样地，右移操作使\
  \ `op` 中的所有位向右移动 `n` 位。最右侧的 `n` 位将丢失。如果 `op` 是无符号整数，则左侧空出的 `n` 位将填充零。如果要移动的变量是有符号的，则该操作取决于机器。\n\
  \n运算符 `op` 和 `n` 都可以常量或变量。对 `n` 的值有两个限制。它不能为负数，且不能超过表示左操作数 `op` 的位数。\n\n假设 `x` 是一个无符号整数，其位模式为\n\
  \n![](img/Image01135.gif)\n\n位移运算符常用于 2 的幂次的乘法和除法。考虑以下语句：\n\n```\nx = y << 1;\n\
  ```\n\n\n\n\n该语句将 `y` 中的位左移一位，并将结果赋值给 `x`。`x` 的十进制值将是 `y` 的值乘以 2。同样，语句\n\n```\n\
  x = y >> 1;\n```\n\n将 `y` 向右移位一位并将结果赋值给 `x`。在这种情况下，`x` 的值将是 `y` 的值除以 2。\n\n移位运算符与逻辑位运算符结合使用时，用于从包含多个信息的整数字段中提取数据。这一过程被称为掩码（Masking）。下文将讨论\
  \ `Mask`。\n\n# 掩码\n\n掩码是指通过逻辑位运算，从变量中提取所需的位（或转换变量中所需的位）的过程。用于执行掩码操作的操作数（常量或变量）称为\
  \ `mask`。示例：：\n\n```\ny = x & mask;\n```\n\n```\ny = x | mask;\n```\n\n掩码有许多不同的用法，如下所示：\n\
  \n- 确定整数变量的位模式。\n- 将给定的位模式的一部分复制到新变量中，同时新变量的剩余部分用 0 填充（使用位与运算）。\n- 将给定的位模式的一部分复制到新变量中，同时新变量的剩余部分用\
  \ 1 填充（使用位或运算）。\n- 将给定的位模式的一部分复制到新变量中，同时原始位模式的剩余部分在新变量内被反转（使用位异或运算）。\n\n以下函数使用掩码显示变量的位模式：\n\
