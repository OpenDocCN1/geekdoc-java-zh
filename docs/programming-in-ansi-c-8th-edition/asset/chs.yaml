  \ III。\n## C 程序的基本结构\n![](img/Image00080.gif)\n到目前为止的示例说明，C 程序可以被视为一组称为函数的构建块。函数是执行特定任务的一条或多条语句的子程序。编写\
  \ C 程序时，我们首先创建函数，将它们组合在一起。C 程序可能包含多个部分，如图 2.9 所示。\n![](img/Image00081.gif)\n图. 2.9\
  \ C 程序的概述\n文档部分由一组注释组成组成提供了程序名称、作者以及程序员以后需要的细节。链接部分指示编译器链接系统库。定义部分定义所有的符号常量。\n有些变量在多个函数中使用。此类变量被称为全局变量，声明在所有函数之外的全局声明区域。该部分还声明了所有用户定义的函数。\n\
  每个 C 程序必须有一个 `main()` 函数部分。该部分包含两个部分：声明部分和执行部分。声明部分声明执行部分中使用的所有变量。执行部分至少有一条语句。这两个部分必须出现在左括号和右括号之间。程序执行从左括号开始，到右括号结束。主函数部分的右括号是程序的逻辑终点。声明部分和执行部分中的所有语句都以分号(;)结尾。\n\
  \n\n子程序部分包含在主函数中调用的所有用户定义函数。用户定义函数通常放在主函数之后，尽管它们可以以任何顺序出现。\n除了主函数部分外，所有部分在不需要时均可以缺失。\n\
  ## 编程风格\n![](img/Image00082.gif)\n与其他某些编程语言（如 COBOL、FORTRAN 等）不同，`C` 是一种自由格式的语言。这意味着，`C`\
  \ 编译器并不在乎我们在行的哪个位置开始输入。虽然这可能为编写糟糕的代码提供了借口，但我们应该尝试利用这一事实来开发出具有可读性的程序。尽管有多种可选的风格，但我们应该选择一种风格并保持完全一致地使用它。\n\
  首先，我们必须养成用小写字母编写程序的习惯。`C` 程序语句是用小写字母写的。大写字母仅用于符号常量。\n大括号将程序语句分组在一起，并标记函数的开始和结束。对大括号和语句进行适当的缩进会使程序更容易阅读和调试。请注意图\
  \ 2.5 程序中大括号的对齐方式和语句的缩进情况。\n由于 `C` 是自由格式语言，我们可以将语句组合在同一行。语句\n![](img/Image00083.gif)\n\
