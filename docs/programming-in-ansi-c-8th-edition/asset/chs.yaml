  ```c\n```\n`volatile` 类型限定符对于多线程程序和涉及并行进程的程序特别相关。\n![](img/Image00160.gif)\n## 数据溢出与下溢\n\
  当变量的值太大或太小，导致数据类型无法容纳时，就会发生数据溢出问题。变量能容纳的最大值也取决于机器。由于浮点值会被四舍入到允许（或指定）的有效位数，溢出通常会导致最大的可能的实值，而下溢则导致变为零。\n\
  整数在所使用的整型数据类型的范围内始终是精确的。然而，如果数据类型与常量的值不匹配，可能会发生严重的溢出问题。`C` 不对整数溢出提供任何警告或指示。它只是会给出错误的结果。（溢出通常会产生一个负数。）因此，我们在定义处理输入/输出值的正确数据类型时应该更加小心。\n\
