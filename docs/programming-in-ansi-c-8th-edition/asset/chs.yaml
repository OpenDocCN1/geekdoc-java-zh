  \nC 是一种强大、灵活、可移植且结构优雅的编程语言。由于 C 结合了高级语言的特征和汇编语言的元素，它既适用于系统也适用于应用程序。它无疑是目前操作系统和嵌入式系统开发中最广泛使用的通用语言。它的影响力在几乎所有现代编程语言中都可见。自\
  \ 1989 年标准化以来，C 经历了一系列变化。\n\n## 本版新增\n作为畅销书之一，《ANSI C 语言编程》又向完美迈出了一步。该书在保持前作优势的同时平衡了理论与实践方法。为了建立坚实的基础，引入了一个新章节《计算机基础》。包含新特性的版本称为\
  \ `C11`。\n\n## 本书结构\n* 第 1 章：计算机基础向学生介绍了计算机的不同组件并讨论了计算问题的方面。\n* 第 2 章：C 语言概述讨论了\
  \ C 程序的基本结构及其执行。\n* 第 3 章讨论了如何声明常量、变量和数据类型。\n* 第 4 章：介绍了运算符和表达式。\n* 第 5 章：涉及输入输出操作的管理。\n\
  * 第 6 章：讲解了分支。\n* 第 7 章：解释了决策和循环的概念。\n* 第 8 章和第 9 章：讨论了数组、字符数组和字符串。\n* 第 10 章和第\
  \ 11 章：涵盖了自定义函数、结构和联合体。\n* 第 12 章：讲解了指针。\n* 第 13 章：简述了 C 中的文件管理。\n* 第 14 章：动态内存分配与链表。\n\
  * 第 15 章：解释了预处理器。\n* 第 16 章：提供了开发 C 程序的指南。\n\n## 本书主要特点\n* 一本涵盖 C 编程基础及最新特性的综合书籍。\n\
  * 每个章节都根据`布鲁姆分类法`采用基于成果的学习方法。\n* 强有教学功能，包括：\n    * 习例题\n    * 提示和重要笔记\n    * 24\
  \ 个详细案例研究\n    * 多选择题\n    * 编程与调试题\n    * 面试题\n* 两个全新且有趣的项目，关于：\n    * 电力局管理系统\n\
  \    * 使用 C 制作 Web 服务\n* 一个关于`使用 C 进行图形编程`的引人入胜的附录\n\n## 数字辅助\n可以通过链接（`http://www.mhhe.com/balagurusamy/ansic8e`）访问数字辅助材料。它包含：\n\
