  \ 1.25 卢比。编写一个程序读取客户代码和通话次数，打印每个客户的账单。[LO 4.5 H]\n\n4.14 编写一个程序，打印从 0 到 180 度增量为\
  \ 15 的 `sin` 和 `cos` 函数表，如所示。[LO 4.1 E]\n\n![](img/Image00225.gif)\n\n4.15 编写一个程序计算\
  \ 0 到 100 数字步长为 10 的平方根和平方，并以如下所示的表格形式输出。[LO 4.5 M]\n\n![](img/Image00226.gif)\n\
  \n4.16 编写一个程序，说明在现实生活中类型转换运算符（cast operator）的使用。[LO 4.4 H]\n\n4.17 编写一个 C 程序将给定数据左移两位。[LO\
  \ 4.1 M]\n\n4.18 编写一个 C 程序将给定数据左移两位并单行打印以下输出：[LO 4.4 M]\n\n4.19 编写一个 C 程序将给定数据左移两位并单行打印以下输出：[LO\
  \ 4.4 M]\n\n4.20 编写一个 C 程序将给定数据左移两位并单行打印以下输出：[LO 4.4 M]\n\n## 引言\n\n读取、处理和写入数据是计算机程序的三个基本功能。大多数程序接收某些数据作为输入，并在合适的介质上显示处理后的结果（通常称为信息）。\n\
  \n到为止，我们已经看到了两种向程序提供数据的方法。一种方法是通过赋值语句给变量赋值，例如 `x = 5;`、`a = 0;` 等。另一种方法是使用输入函数 `scanf`，它可以从键盘读取数据。我们在示例程序中已经使用了这两种方法。对于输出结果，我们广泛地使用了\
  \ `printf` 函数，它可以将结果发送到终端。与其他高级语言不同，C 语言的语法中不包含任何内置的输入/输出语句。所有的输入输出操作都是通过 `printf`\
  \ 等函数调用完成的。\n\n\n\n\n\n所有输入/输出操作中最简单的是从“标准输入”单元（通常是键盘）读取一个字符并写入“标准输出”单元（通常是屏幕）。读取单个字符可以使用\
  \ `getchar` 完成。（这也可以借助第 5.4 节中讨论的 `scanf` 函数来实现。）`getchar` 的取形式如下：\n\n![](img/Image00230.gif)\n\
  \n`variable_name` 是一个已声明为 `char` 类型的有效 C 语言标识符。当遇到这条语句时，计算机会等待直到按键被按下，然后将该字符作为值赋给\
  \ `getchar`。由于由于 `getchar` 用在赋值语句的右侧，`getchar` 的字符值反过来会被赋给左侧的 `variable_name`。例如：\n\
  \n```c\nchar name;\nname = getchar();\n```\n\n当我们按下键盘上的 H 键时，该语句将字符 ‘H’ 赋值给变量 `name`。\n\
  \n![](img/Image00231.gif)\n\n程序向用户显示一个 YES/NO 类型的问题，并以单个字符读取用户的响应（Y 或 N）。如果响应是 Y\
  \ 或 y，则输出消息\n\nMy name is BUSY BEE\n\n否则，输出\n\nYou are good for nothing\n\n![](img/Image00232.gif)\n\
  ![](img/Image00233.gif)\n![](img/Image00234.gif)\n\n**图 5.1** 使用 `getchar` 从键盘读取字符\n\
  \n可以连续调用 `getchar` 来读取一行文本中包含的字符。例如，以下程序段会一个一个从键盘读取字符，直到按下“回车”（Return）键为止。\n\n![](img/Image00235.gif)\n\
  ![](img/Image00236.gif)\n![](img/Image00237.gif)\n![](img/Image00238.gif)\n\n该程序从键盘接收一个字符，测试它是否为字母或数字，并相应打印消息。这些测试是通过以下函数完成的：\n\
  \n`isalpha(character)`\n`isdigit(character)`\n\n例如，如果参数 `character` 包含字母表字符，`isalpha`\
  \ 假设值为非零（真）；否则假设为 0（假）。`isdigit` 函数也是如此。\n\n![](img/Image00239.gif)\n\n**图 5.2**\
  \ 测试字符类型的程序\n\nC 还支持许多其他类似的函数，如表 5.1 所示。这些字符函数的原型包含在 `ctype.h` 文件，因此程序中必须包含该语句：\n\
  \n```c\n#include <ctype.h>\n```\n\n**表 5.1** 字符测试函数\n\n![](img/Image00240.gif)\n\
  \n## 写入字符\n\n![](img/Image00241.gif)\n\n与 `getchar` 类似，`putchar` 用于一次一次向终端写入字符。它的形式如下所示：\n\
  \n![](img/Image00242.gif)\n\n其中 `variable_name` 是一个包含字符的 `char` 类型变量。该语句在终端上显示 `variable_name`\
  \ 中包含的字符。例如，语句\n\n```c\nanswer = ‘Y’;\nputchar (answer);\n```\n\n将在屏幕上显示字符 Y。语句\n\
  \n```c\nputchar (‘n’);\n```\n\n将导致屏幕上的光标移动到下一行的开头。\n\n![](img/Image00243.gif)\n\n\
  程序使用了三个新函数：`islower`、`toupper` 和 `tolower`。`islower` 函数是一个条件函数，如果参数是小写字母，则取值为 TRUE；否则取值为\
  \ FALSE。`toupper` 函数将小写参数转换为大写字母，而 `tolower` 函数执行相反的操作。\n\n![](img/Image00244.gif)\n\
  \n**图 5.3** 反向转换中字母的读写\n\n## 格式化输入\n\n![](img/Image00245.gif)\n\n格式化输入是指按照特定格式安排的输入数据。例如，考虑以下数据：\n\
  \n15.75 123 John\n\n这一行包含三个按特定格式排列的数据。数据必须按照其出现的格式进行读取。例如，数据的第一部分应该读入 `float` 变量，第二部分读入\
  \ `int`，第三部分读入 `char`。这在 C 语言中可以通过 `scanf` 函数实现（`scanf` 意为格式化扫描）。\n\n我们已经在许多示例中使用过此输入函数。在这里，我们将探索使用\
  \ `scanf` 函数读取格式化数据的可用选项。`scanf` 的通用形式为\n\n![](img/Image00246.gif)\n\n控制字符串指定了输入数据的字段格式，参数\
  \ `arg1`、`arg2` ...,argn` 指定了存储数据的位置地址。控制字符串和参数之间用逗号分隔。\n\n控制字符串（也称为格式字符串）包含字段规范，用于指导输入数据的解释。它可能包括：\n\
  \n- 字段（或格式）规范，由转换字符 `%`、一个数据类型字符（或类型说明符）和一个可选的指定字段宽数字组成。\n- 空格、制表符或换行符。\n\n空格、制表符和换行会被忽略。数据类型字符指示要赋值给对应参数变量的数据类型。字段宽度说明符是可选的。随后的讨论将澄清这些概念。\n\
  \n### 输入整数\n\n读取整数的字段规范为：\n\n![](img/Image00247.gif)\n\n百分号 (`%`) 表示后面跟着一个转换规范。`w`\
  \ 是一个整数，指定要读取数字的字段宽度，`d` 作为数据类型字符，表示要读取的数字是整数模式。考虑以下示例：\n\n```c\nscanf(\"%2d %5d\"\
  , &num1, &num2);\n```\n\n数据行：\n50 31426\n\n值 50 被赋给 `num1`，31426 被赋给 `num2`。由于指定了\
  \ `%2d`，值 31 被赋给 `num2`。未读取的值 50 将赋给下一次 `scanf` 调用中的第一个变量。如果我们使用不带字段宽度的字段规范，就可以消除此类错误。即语句\n\
  \n```c\nscanf(\"%d %d\", &num1, &num2);\n```\n\n将正确读取数据\n\n31426 50\n\n并将 31426\
  \ 赋给 `num1`，50 赋给 `num2`。\n\n输入数据项必须由空格、制表符或换行符分隔。标点符号不视为分隔符。当 `scanf` 函数在输入数据行搜索读取的值时，它总是会跳过空白字符。\n\
  \n如果我们输入浮点数而不是整数会怎样？小数部分可能会被忽略！此外，`scanf` 可能会跳过后续输入。\n\n当 `scanf` 读取特定值时，一旦达到字段宽度指定的字符数（如果已指定）或遇到对于读取的值无效的字符，读取将终止。对于整数，有效字符是可选带符号的数字序列。\n\
  \n通过在字段宽度位置指定 `*` 可以跳过输入字段。例如，语句\n\n```c\nscanf(\"%d %*d %d\", &a, &b)\n```\n\n\
  将数据\n\n123 456 789\n\n赋值如下：\n\n123 给了 `a`\n\n456 跳过（因为有 `*`）\n\n789 给了 `b`\n\n数据类型字符\
  \ `d` 前可以加上 `l`（字母 ell）来读取长整数，或者加上 `h` 来读取短整数。\n\n![](img/Image00248.gif)\n![](img/Image00249.gif)\n\
  ![](img/Image00250.gif)\n![](img/Image00251.gif)\n\n**图 5.4** 使用 `scanf` 读取整数\n\n\
  第一个 `scanf` 请求三个整数值 `a`、`b` 和 `c` 的输入数据，相应地键入了三个值 1、2 和 3。由于指定了 `%*d`，值 2 已被跳过，3\
  \ 被赋给变量 `b`。注意，由于 `c` 没有可用数据，它包含垃圾值。\n\n\n\n\n第二个 `scanf` 分别为变量 `x` 和 `y` 指定了格式\
  \ `%2d` 和 `%4d`。每当我们为读取整数指定字段宽度时，输入数字所包含的位数不应超过指定的长度。否则，右侧多余的数字将被截断，并赋值给列表中的下一个变量。因此，第二个\
  \ `scanf` 截断了四位数字 `6789`，并将 `67` 赋值给 `x`，将 `89` 赋值给 `y`。值 `4321` 被赋值给紧随其后的一个 `scanf`\
  \ 语句中的第一个变量。\n\n注意：在字段说明符之间使用非空白字符是合法的。但是，`scanf` 期望在给定位置有一个相应的字符。例如，\n\n```c\n\
  scanf(\"%d-%d\", &a, &b);\n```\n\n接受如下输入：\n\n```\n123-456\n```\n\n将 `123` 赋值给 `a`，将\
  \ `456` 赋值给 `b`。\n\n### 输入实数\n\n![](img/Image00252.gif)\n\n与整数不同，实数的字段宽度是不指定的，因此\
  \ `scanf` 使用简单的规格 `%f` 对两种表示法（即小数计数法和指数计数法）读取实数。例如，该语句\n\n```c\nscanf(\"%f %f %f\"\
  , &x, &y, &z);\n```\n\n使用输入数据\n\n```\n475.89 43.21E-1 678\n```\n\n将把值 `475.89` 赋值给\
  \ `x`，将 `4.321` 赋值给 `y`，将 `678.0` 赋值给 `z`。输入字段说明符之间可以用任意空白空格分隔。\n\n如果读取的数字是双类型，则规格应为\
  \ `%lf` 而不是简单的 `%f`。可以使用 `%*f` 规格跳过一个数字。\n\n![](img/Image00253.gif)\n\n![](img/Image00254.gif)\n\
  \n**图 5.5** 实数的读取\n\n### 输入字符字符串\n\n我们已经看到如何使用 `getchar()` 函数从终端读取单个字符。使用 `scanf()`\
  \ 函数也可以实现同样的功能。此外，`scanf()` 函数可以输入包含多个字符的字符串。以下是读取字符字符串的规格：\n\n![](img/Image00255.gif)\n\
  \n对应的参数应该是指向字符数组的指针。然而，当参数是指向 `char` 变量的指针时，可以使用 `%c` 来读取单个字符。\n\n![](img/Image00256.gif)\n\
  \n图 5.6 中的程序说明了用于读取字符串的各种字段说明符的使用。当我们使用 `%wc` 读取字符串时，系统将等待到输入第 w 个字符为止。\n\n请注意，规格\
  \ `%s` 会在遇到空白处符时停止读取。因此，`name2` 只读取了“New York”的第一部分，第二部分被自动赋值给 `name3`。然而，在第二次运行时，字符串“New-York”被正确地赋值给\
  \ `name2`。\n\n![](img/Image00257.gif)\n\n**图 5.6** 字符串的读取\n\n某些版本的 `scanf` 支持以下字符串的转换规格：\n\
  \n- `%[characters]`\n- `%[^characters]`\n\n规格 `%[characters]` 意味着输入字符串中只允许方括号内指定的字符。如果输入字符串包含任何其他字符，字符串将在第一次遇到此类字符时终止。规格\
  \ `%[^characters]` 则恰恰相反。也就是说，在脱符号 (`^`) 之后指定的字符不允许出现在输入字符串中。字符串的读取将在遇到其中任何一个字符时终止。\n\
  \n![](img/Image00258.gif)\n\n![](img/Image00259.gif)\n\n**图 5.7** 字符串的读取\n\n###\
  \ 输入空格\n\n我们已经看到如何使用 `getchar()` 函数从终端读取单个字符。使用 `scanf()` 函数也可以实现同样的功能。此外，`scanf()`\
  \ 函数可以输入包含多个字符的字符串。以下是读取字符字符串的规格：\n\n请注意，规格 `%s` 会在遇到空白处时停止读取。因此，`name2` 只读取了“New\
  \ York”的第一部分，第二部分被自动赋值给 `name3`。然而，在第二次运行时，字符串“New-York”被正确地赋值给 `name2`。\n\n...\
  \ 输入字段说明符之间可以用任意空白空格分隔。\n\n如果读取的数字是双类型，则规格应为 `%lf` 而不是简单的 `%f`。可以使用 `%*f` 规格跳过一个数字。\n\
  \n![](img/Image00258.gif)\n\n![](img/Image00259.gif)\n\n**图 5.7** 字符串的读取\n\n###\
  \ 输入空格\n\n我们已经看到如何使用 `getchar()` 函数从终端读取单个字符。使用 `scanf()` 函数也可以实现同样的功能。此外，`scanf()`\
  \ 函数可以输入包含多个字符的字符串。以下是读取字符字符串的规格：\n\n... (由于原文存在重复且逻辑错乱，此处已按要求翻译并整合内容)\n\n\n\n\n\
  – 已达到最大字符数限制，或\n– 检测到错误，或\n– 已到达文件末\n\n## 格式化输出\n\n![](img/Image00268.gif)\n\n我们已经看到过使用\
  \ `printf` 函数来打印标题和数值结果。让输出以易于理解且易于使用的形式呈现出来是非常理想的。因此，程序员有必要对其程序产生的输出的外观和清晰度进行仔细考虑。\n\
  \n`printf` 语句提供了某些功能，可以有效利用这些功能来控制终端打印内容的对齐和间距。`printf` 语句的一般形式为：\n\n![](img/Image00269.gif)\n\
  \n控制字符串由以下三类项目组成：\n\n1. 按原样显示在屏幕上的字符。\n2. 定义每个项目显示格式的格式规范（format specifications）。\n\
  3. 转义序列字符，如 `\\n`、`\\t` 和 `\\b`。\n\n控制字符串指示了后续有多少参数以及它们的类型是什么。参数 `arg1`、`arg2`、……\
  \ `argn` 是变量，其值将根据控制字符串的规范进行格式化并打印。参数的数量、顺序和类型应与格式规范相匹配。\n\n简单的格式规范具有如下形式：\n\n![](img/Image00270.gif)\n\
  \n其中 `w` 是一个整数，指定输出值的总列数，`p` 是另一个整数，指定小数点后（对于实数）的位数，或者从字符串中要打印的字符数。`w` 和 `p` 都是可选的。一些格式化\
  \ `printf` 语句的示例：\n\n```c\nprintf(“Programming in C”);\nprintf(“ “);\nprintf(\"\\\
  n”);\nprintf(\"%d”, x);\nprintf(“a = %f\\n b = %f”, a, b);\nprintf(“sum = %d”, 1234);\n\
  printf(\"\\n\\n”);\n```\n\n`printf` 永远不会自动提供换行，因此可以使用多个 `printf` 语句来构建一行输出。如上述某些示例所示，可以通过换行符\
  \ `\\n` 来引入换行。\n\n## 整数的输出\n\n打印整数的格式规范为：\n\n```\n% w d\n```\n\n其中 `w` 指定输出的最小字段宽度。然而，如果数字大于指定的字段宽度，它将完整打印，覆盖最小宽度限制。`d`\
  \ 指定要打印的值是一个整数。该数字在给定的字段宽度内右对齐。根据需要显示前空格。以下示例说明了数字 9876 在不同格式下的输出：\n\n![](img/Image00271.gif)\n\
  \n可以通过在 `%` 字符后直接放置一个减号（`-`）来强制进行左对齐打印，如上上面的第四个示例所示。也可以通过在字段宽度指定符之前放置一个 `0`（零）来用零填充前空格，如上面的最后一项所示。减号（`–`）和零（`0`）被称为标志位（flags）。\n\
  \n通过在格式规范中将 `d` 替换为 `ld` 可以打印长整数。类似地，我们可以使用 `hd` 来打印短整数。\n\n![](img/Image00272.gif)\n\
  ![](img/Image00273.gif)\n\n**图 5.9** 整数的格式化输出\n\n## 实数的输出\n\n实数的输出可以使用以下格式规范以十进制表示显示：\n\
  \n```\n% w.p f\n```\n\n整数 `w` 表示显示该值所需的最小位置数，整数 `p` 表示小数点后显示的位数（精度）。显示在给定的字段宽度内右对齐。根据需要显示前空格。\n\
  \n我们也可以使用以下指数计数法显示实数：\n\n```\n% w.p e\n```\n\n以下示例显示了各种规范的效果：\n\n```c\nprintf(\"\
  %*f\", width, number);\nprintf(\"%*.*f\", 7, 2, number);\n```\n\n![](img/Image00274.gif)\n\
  ![](img/Image00275.gif)\n![](img/Image00276.gif)\n![](img/Image00277.gif)\n\n**图\
  \ 5.10** 实数的格式化输出\n\n## 单个字符的打印\n\n可以使用以下格式在指定位置显示单个字符：\n\n```\n%wc\n```\n\n该字符将在\
  \ `w` 列的字段内右对齐显示。我们可以通过减号使显示变为左对齐。`w` 的默认值为 1。\n\n## 字符串的打印\n\n输出字符串的格式规范与实数相似。其形式为：\n\
  \n```\n% w.ps\n```\n\n其中 `w` 指定字段宽度，`p` 指示仅显示字符串的前 `p` 个字符。显示为右对齐。以下示例显示了打印包含 16\
  \ 个字符（包括空格）的“NEW DELHI 110001”时各种规范的效果。\n\n![](img/Image00279.gif)\n![](img/Image00280.gif)\n\
  ![](img/Image00281.gif)\n![](img/Image00282.gif)\n\n**图 5.11** 字符和字符串的打印\n\n## 混合数据输出\n\
  \n在一个 `printf` 语句中混合数据类型是允许的。例如，类型为如下的语句是有效的（此处为代码内容）：\n\n如前面所述，`printf` 使用其控制字符串来决定要打印的变量数量及其类型。因此，格式规范应与变量的数量、顺序和类型匹配。如果变量不足或类型错误，输出结果将是不正确的。\n\
  \n## 增强输出的可读性\n\n计算机输出是被用于分析变量之间的某些关系以及做出决策的信息。因此，输出的正确性和清晰度至关重要。正确性取决于求解过程，而清晰度取决于输出呈现的方式。以下是我们可以采取的一些步骤，以提高清晰度，从而提高可读性和理解性：\n\
  \n1. 在两个数字之间提供足够的空格。\n2. 在输出中引入适当的标题和变量名。\n3. 当输出出现特殊情况时，打印特殊消息。\n4. 在输出的重要部分之间引入空行。\n\
  \n\n\n\n\n系统通常在数字之间提供两个空格。然而，可以通过为数字选择合适的字段宽度，或通过在规范之间引入“制表符”字符来增加间距。例如，语句\n\n```c\n\
  printf(“a = %d\\t b = %d”, a, b);\n```\n\n将在两个字段之间提供四个空格。我们也可以使用语句将它们打印在单独的两行：\n\
  \n```c\nprintf(“a = %d\\n b = %d”, a, b);\n```\n\n可以通过直接在 `printf` 语句中使用字符字符串来打印消息和标题。示例：\n\
  \n```c\nprintf(\"\\n OUTPUT RESULTS \\n”);\nprintf(“Code\\t Name\\t Age\\n”);\n\
  printf(“Error in input data\\n”);\nprintf(“Enter your name\\n”);\n```\n\n## 概念\n\
  \n- `getchar`: 从标准输入读取一个字符。[LO 5.1]\n- `putchar`: 从标准输入输出一个字符。[LO 5.2]\n- 格式化输入：从标准输入读取一个字符。[LO\
  \ 5.3]\n- 控制字符串：格式规范、转义序列和要在屏幕上打印的字符的组合。[LO 5.4]\n- 格式化输出：指按照特定格式排列输出数据以增强可读性。[LO\
  \ 5.4]\n\n## 始终记住\n\n- 使用 `getchar` 时，应注意清除输入流中的任何不需要的字符。[LO 5.1]\n- 使用标准输入输出库中的函数时，不要忘记包含\
  \ `<stdio.h>` 头文件。[LO 5.1]\n- 使用字符处理库中的函数时，不要忘记包含 `<ctype.h>` 头文件。[LO 5.2]\n- 为每个要读取或打印的变量提供适当的字段规范。[LO\
  \ 5.3]\n- 将格式控制字符串括在双引号中。[LO 5.3]\n- 在 `scanf` 的输入列表中，基本类型变量不要忘记使用地址操作符 `&`。[LO\
  \ 5.3]\n- 不要在输入字段规范中指定任何精度。[LO 5.3]\n- 不要在 `scanf` 语句的格式字符串末尾提供任何空白字符。[LO 5.3]\n\
  - 不要在 `scanf` 语句的格式字符串中使用逗号。[LO 5.3]\n- 字符字符串常量使用双引号。[LO 5.4]\n- 单字符常量使用单引号。[LO\
  \ 5.4]\n- 提供足够的的字段宽度以处理要打印的值。[LO 5.4]\n- 注意由于格式化可能导致输出不准确的情况。[LO 5.4]\n- 不要忘记在 `scanf`\
  \ 或 `printf` 语句中用双引号闭合格式字符串。[LO 5.4]\n- 对读取或写入的数据类型使用不错误的转换代码将导致运行时错误。[LO 5.4]\n\
  - 不要忘记 `scanf` 和 `printf` 语句中格式字符串后的逗号。[LO 5.4]\n- 未分离读和写参数是一个错误。[LO 5.4]\n- 在 `printf`\
  \ 语句中对变量使用地址操作符 `&` 将导致运行时错误。[LO 5.4]\n\n## 案例分析\n\n### 1. 库存报告 [LO 5.3, 5.4 M]\n\
