  \n\n\n\n\n/* = = =/* = = = = */ = = = = */\n\n\n\n\nprintf(“I see, I remember”);\n\
  \n\n\n\n\n\n\n\nprintf(”I see, \\n”);\n```\n括号之间包含的信息被称为函数的参数。第一个 `printf` 函数的参数是\
