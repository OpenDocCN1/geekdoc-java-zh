  \n## 16.7 一个程序已成功编译并链接。当你运行此程序时，会面临以下一种或多种情况。[LO 16.4 M]\n\n(a) 程序执行了但没有输出。\n\n\
  (b) 它产生了错误的答案。\n\n(c) 它没有停止运行。\n\n请对这些情况出现的原因进行评述。\n\n## 16.8 列出五种常见的编程错误。编写一个包含这些错误的小程序，并尝试在计算机帮助帮助定位它们。[LO\
