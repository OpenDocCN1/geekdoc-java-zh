  \ `NOTEQUAL` 的宏，执行逻辑非操作。[LO 15.1 M]\n\n## 面试题\n\n15.1 下面代码中变量 `i1` 和 `i2` 的类型将是什么的？\n\
  \n```c\n#define INTPTR int*\n\nvoid main()\n{\nINTPTR i1,i2;\n}\n```\n[LO 15.1 H]\n\
  \n15.2 `#include <file>` 和 `#include “file\"` 之间有什么区别？[LO 15.2 M]\n\n15.3 下述程序的输出将是什么？\n\
  \n```c\n#include<stdio.h>\n\n#define X -Y\n#define Y -Z\n#define Z 10\n\nint main()\n\
  {\nprintf(“The value of X is %d\\n”, X);\nreturn 0;\n}\n```\n[LO 15.1 M]\n\n## 引言\n\
  \n到为止，我们讨论了 C 语言的各种特性，并准备好编写和执行中等复杂的程序。然而，在尝试开发复杂程序之前，考虑一些有助于设计高效且无错误程序的技术是值得的。\n\
  \n程序开发过程包括三个重要阶段，即程序设计、程序编码和程序测试。这三个阶段都对高质量程序的产生都有贡献。在本章中，我们将讨论用于程序设计、编码和测试的一些技术。\n\
  \n## 程序设计\n\n程序设计是良好程序的基础，因此是程序开发周期中的重要部分。在编码程序之前，应该对程序进行良好的构思，并详细考虑程序设计的各个方面。\n\
  \n程序设计基本上涉及开发一种用于编写程序的策略，以实现问题的解决方案。这包括规划解决方案程序以及程序将采取的形式。程序设计涉及以下四个阶段：\n\n1. 问题分析。\n\
  2. 勾勒程序结构。\n3. 算法开发。\n4. 控制结构的选择。\n\n### 问题分析\n\n在我们思考问题的解决方案程序之前，我们必须充分理解问题的本质以及我们希望程序做什么。如果没有对当前手头的问题进行理解和定义，程序设计可能会变成一种碰运气的方法。在这一阶段，我们必须仔细决定以下内容：\n\
  \n- 将输入什么类型的数据？\n- 需要什么样的输出？以及\n- 程序运行的约束条件和条件是什么？\n\n### 勾勒程序结构\n\n一旦我们决定了想要什么以及拥有什么，下一步就是决定如何做。C\
  \ 作为一种结构化语言，适用于自顶向下的方法。自顶向下意味着将解决方案程序分解为形成层次结构的任务，如图[Fig. 16.1]所示。自顶向下设计的本质是将整个问题分解成若干个独立的组成任务，然后将这些任务分解成更小的子任务，以此此类推，直到它们小到可以在脑海中理解并易于编码。这些任务和子任务可以构成程序函数的基础。\n\
  \n图 16.1 层次结构\n\n自顶向下设计的一个重要特征是，在每一层，低层的细节都是隐藏的。高层函数首先设计，因此设计从上到下进行，逐步引入更多的精细化。这种方法将产生可读且模块化的代码，易于理解。\n\
  \n### 算法开发\n\n在我们决定了解决方案程序和程序的整体大纲之后，下一步是制定一个确定的、逐步的程序，称为算法。描述算法最常用的方法是通过使用流程图。另一种方法是编写所谓的伪代码（pseudocode）。流程图以图形形式展示算法，而伪代码则按逻辑顺序描述步骤。任何一种方法都涉及逻辑和创造力。\n\
  \n由于算法是开发高效程序的关键因素，我们应该对这一步投入足够的注意力。一个问题可能有多种解决方法。例如，有很多排序技术可以对列表进行排序。同样，有很多方法可以计算曲线下的面积。我们必须考虑所有的方法，并选择一种易遵循、执行时间短且结果准确符合要求的方法。\n\
  \n### 控制结构\n\n复杂的解决方案程序可能涉及大量的控制语句来引导执行流。在这种情况下，不加选择使用 `goto` 等控制语句可能会导致程序不可读且不可理解。已经证明，任何算法都可以使用三种基本的控制结构来构建，即顺序结构、选择结构和循环结构。\n\
  \n顺序结构表示语句的逐一执行。选择结构涉及基于条件的判断，并可能有两个或多个分支，这些分支通常在之后汇合。C 中的 `if . . .else` 和 `switch`\
  \ 语句可以实现选择结构。循环结构用于重复评估一组指令。这种结构可以使用 `do`、`while` 或 `for` 语句来实现。\n\n良好的设计将提供以下益处：\n\
  \n1. 编码容易且无错误。\n2. 测试简单。\n3. 维护容易。\n4. 可以编写良好的文档。\n5. 可以做出更准确的成本估算。\n6. 编码进度可以更精确地控制。\n\
  \n## 程序编码\n\n在前节开发的算法必须翻译成计算机可以理解的指令集。编码的主要重点应该是简单和清晰。一个人编写的程序以后可能需要其他人阅读。因此，它应该是易读且易于理解的。编码风格的元素包括：\n\
  \n\n\n\n\n* 内部文档。\n* 语句的构建。\n* 程序的通用性。\n* 输入/输出格式。\n\n# 内部文档\n\n文档指的是描述程序的细节。某些细节可能作为程序的不可或的一部分被构建出来，这些被称为内部文档。\n\
  \n内部文档的两个重要方面是：选择有意义的变量名以及使用注释。选择有意义的名称对于理解程序至关重要。例如，\n\n`area = breadth * length`\n\
  \n比\n\n`a = b * l;` 更有意义。\n\n必须避免可能引起混淆的名称。使用有意义的函数名也有助于程序的理解和维护。\n\n描述性注释应该嵌入源代码体中，以描述处理步骤。\n\
  \n以下指南可能有助于明智地使用注释：\n\n1. 描述语句块，而不是对每一行都进行注释。\n2. 使用空行或缩进，使注释易于阅读。\n3. 使用恰当的注释；错误的注释比没有注释更糟糕。\n\
  \n# 语句的构建\n\n虽然逻辑流在设计阶段已经决定，但单个语句的构建是在编码阶段完成的。每条语句都应该是简单直接的。虽然允许每行编写多个语句，但应尝试每行只使用一条语句并带有必要的缩进。考虑以下代码：\n\
  \n![](img/Image01098.gif)\n\n尽管它是完全有效的，但可以重新重组如下：\n\n![](img/Image01099.gif)\n\n\
  语句构建的通用指南是：\n\n1. 每行一条语句。\n2. 在实现选择和循环结构时使用适当的缩进。\n3. 避免循环的高度嵌套，最好不要超过三层。\n4. 使用简单的条件测试；如有必要，将复杂的条件拆分为多个简单的条件。\n\
  5. 使用括号来澄清逻辑和算术表达式。\n6. 尽可能使用空格来提高可读性。\n\n# 输入/输出格式\n\n输入/输出格式应该是简单且让用户接受的。编码过程中应考虑若干条指南：\n\
  \n1. 保持格式简单。\n2. 使用文件结束标志，而不是要求用户指定项目的数量。\n3. 标记所有的交互式输入请求。\n4. 标记所有的输出报告。\n5. 当输出包含某些特殊结果时，使用输出消息。\n\
  \n# 程序的通用性\n\n应注意减少程序对特定数据集或参数特定值的依赖。例如：\n\n![](img/Image01100.gif)\n\n![](img/Image01101.gif)\n\
  \n此循环相加 1,2, …, 10。可以将其变得更具通用性：\n\n![](img/Image01102.gif)\n\n初始值 `m`、终止值 `n` 和步长\
  \ `step` 可以在程序执行期间交互地指定。当 `m=2`、`n=100` 且 `step=2` 时，循环将相加直到 1100 的所有偶数。\n\n## 常见编程错误\n\
  \n![](img/Image01103.gif)\n\n此时你应该意识到 C 有某些容易产生错误的特性。此外，它不会检查并报告所有的运行时错误。因此，建议跟踪此类错误，并确保程序中不存在这些已知错误。本节将经验较少的\
  \ C 程序员可能犯的一些常见错误。\n\n### 缺少分号\n\n每个 C 语句都必须以分号结束。缺少分号可能会给编译器带来相当困惑，并导致“误导性”的错误信息。考虑以下语句：\n\
  \n```c\na = x+y\nb = m/n;\n```\n\n编译器将第二行视为第一行的一部分，并将 `b` 视为变量名。因此，你可能会在第二行得到“未定义名称”的错误信息。注意，信息和位置都是错误的。在这些报告的行没有错误的情况下，我们应该检查前一行是否缺少分号。\n\
  \n可能会出现一种情况，缺少分号会导致编译器“发疯”并产生一系列错误信息。如果发现这些错误是怀疑的，请检查错误列表开头是否缺少分号。\n\n### 分号误用\n\
  \n另一个常见错误是把分号放在错误的位置。考虑以下代码：\n\n```c\nfor(i = 1; i<=10; i++);\nsum = sum + i;\n\
  ```\n\n这段代码本意是求加从 1 到 10 的所有整数。但实际上发生的是只有 `i` 的退出值被加到了和中。此类错误的其他示例为：\n\n![](img/。\n\
  \n一个简单的分号代表一个空语句，因此在语法上是有效的。编译器不会产生任何错误信息。记住，这类错误比语法错误更糟糕。\n\n### 使用 = 代替 == ==\n\
  \n当我们执行关系测试时，极有可能忘记使用双倍等号。例如：\n\n```c\nif(code = 1)\ncount ++;\n```\n\n这是一个语法上有效的语句。变量\
  \ `code` 被赋值为 1，然后因为 `code = 1` 为真，所以 `count` 递 1。事实上，上述语句没有对 `code` 执行任何关系测试。无论\
  \ `code` 的之前值是什么，`count ++;` 总是会被执行。\n\n类似的错误也可能发生在其他控制语句中，例如 `for` 和 `while`。循环控制语句中的此类错误可能会导致死循环。\n\
  \n### 缺少大括号\n\n在编码时忘记闭合大括号是很常见的。在编写深度嵌套循环时，这通常会被编译器检测到，因为大括号应该是匹配的。然而，如果我们把匹配括号放在错误的位置，编译器就不会察觉，程序将产生意想不到的结果。\n\
  \n大括号的另一个问题是在需要组合语句时没有使用它们。例如，考虑以下语句：\n\n![](img/Image01105.gif)\n\n这段代码本意是在 `i`\
  \ 从 1 到 10、步长为 1 的情况下计算 `sum1`, `sum2`，然后打印它们的值。但实际上，由于缺少大括号，`for` 循环被编译器解释如下：\n\
  \n![](img/Image01106.gif)\n\n`for` 循环只将第一个语句 `sum1 = sum1 + i;` 视为其体，因此 `sum2 =\
  \ sum2 + i*i;` 只在循环退出时计算一次。该代码段的正确编码方式如下：\n\n![](img/Image01107.gif)\n\n### 引号误用\n\
  \n在处理单个字符时，我们可能会经常使用单引号。应确保相关变量已正确声明。例如，语句\n\n`city = ‘M’;`\n\n如果 `city` 被声明为带维度的字符变量（即字符指针），则该语句是无效的。\n\
  \n### 不正确的注释字符\n\n每个注释都应该以 `/*` 开始并以 `*/` 结束。它们之间的内容会被编译器忽略。如果我们漏掉了闭合的 `*/`，编译器会在程序后续查找闭合的\
  \ `*/`，将所有行都视为注释。在这种情况下未能找到 `*/`，我们可能会得到错误信息。考虑以下几行：\n\n![](img/Image01108.gif)\n\
  \n由于注释行 1 中缺少 `*/`，其后的所有语句，直到注释行 2 中的闭合注释 `*/` 为止，都会被忽略。\n\n我们应该记住 C 不支持嵌套注释。假设我们想注释掉以下片段：\n\
  \n![](img/Image01109.gif)\n\n我们可能会受诱按所示添加注释字符：\n\n![](img/Image01110.gif)\n\n这是错误的。第一个开启注释与第一个闭合注释匹配，因此这两者之间的行被忽略。语句\
  \ `ratio = x/y;` 没有被注释掉。注释掉该片段的正确方式所示：\n\n![](img/Image01111.gif)\n\n### 未定义的变量\n\
  \n\n\n\nC 语言要求每个变量在使用之前必须对其其类型进行声明。在大型程序的开发过程中，很有可能会使用一个变量来存储中间结果而忘记声明它。\n\n###\
  \ 忘记运算符的优先级\n\n![](img/Image01112.gif)\n\n表达式的评估是根据运算符的优先级进行的。初学者经常忘记这一点。考虑以下语句：\n\
  \n![](img/Image01113.gif)\n\n调用 `product()` 返回两个数字的积，并将其与 `100` 进行比较。如果它等于或大于 `100`，则关系测试为真，并将\
  \ `1` 赋值给 `value`，否则赋值 `0`。无论何种情况，`value` 能够取的值只有 `1` 或 `0`。这显然不是程序员想要的。\n\n该语句实际的预期是将\
  \ `product()` 返回的值赋值给 `value`，然后将 `value` 与 `100` 进行比较。如果 `value` 等于或大于 `100`，应该使用以下语句计算\
  \ `tax`：\n\n```\ntax = 0.05 * value;\n```\n\n错误的原因是关系运算符的优先级高于赋值运算符。我们可以通过使用括号来强制先进行赋值，如下：\n\
  \n![](img/Image01114.gif)\n\n同样，逻辑运算符 `&&` 和 `||` 的优先级低于算术运算符和关系运算符，在这两个之间，`&&`\
  \ 的优先级高于 `||`。尝试一下以下语句之间是否存在差异：\n\n![](img/Image01115.gif)\n\n### 忽略递增/递减运算符的求顺序\n\
  \n我们经常在循环中使用递增或递减运算符。例如：\n\n![](img/Image01116.gif)\n\n语句 `string[i++] = c;` 等价于：\n\
  \n```\nstring[i] = c;\ni = i+1;\n```\n\n这与语句 `string[++i] = c;` 不同，后者等价于：\n\n```\n\
  i = i+1;\nstring[i] = c;\n```\n\n### 忘记声明函数参数\n\n记住在函数头中声明所有的函数参数。\n\n### 函数调用中实际参数与形式参数类型不匹配\n\
  \n调用带参数的函数时，我们应该确保传递的值类型与被调用函数预期的类型匹配。否则，可能会出现错误的结果。必要时，我们可以使用类型转换运算符来局部更改类型。例如：\n\
  \n```\ny = cos((double)x);\n```\n\n### 函数未声明\n\n每个被调用的函数都应该在调用它的函数中声明，其返回值的类型。考虑以下程序：\n\
  \n![](img/Image01117.gif)\n\n该函数返回一个 `double` 类型的值，但编译器并这一事实，因此它期望接收一个 `int` 类型的值。程序在编译期间会产生类似“重定义”的错误信息。\n\
  \n`division` 函数对于 `main` 来说与其他变量一样，因此在 `main` 中应将其声明为 `double`。\n\n现在，假设函数 `division`\
  \ 代码如下：\n\n![](img/Image01118.gif)\n\n![](img/Image01119.gif)\n\n尽管值 `x` 和 `y` 是浮点数，且\
  \ `x/y` 的结果也是 `float`，但该函数只返回整数值，因为在函数定义中没有给出类型说明符。这也是错误的。函数头应该包含类型说明符，以强制函数返回特定类型的值。\n\
  \n### scanf 参数中缺少 & 运算符\n\n在 `scanf` 调用中，所有非指针变量前面都应该有一个 `&` 运算符。如果变量 `code` 被声明为整数，那么语句：\n\
  \n```\nscanf(\"%d\", code);\n```\n\n是错误的。正确的应该是 `scanf(\"%d\", &code);`。\n\n记住，编译器不会检测到这个错误，你可能会得到一个奇怪的输出。\n\
  \n### 越数组边界\n\n所有 C 语言索引都从零开始。一个常见的错误是从 `1` 开始索引。例如，段代码\n\n![](img/Image01120.gif)\n\
  \n将无法找到 `array x` 元素的正确和。`for` 循环表达式应该修正为：\n\n```\nfor(i=0;i<10;i++)\n```\n\n###\
  \ 忘记为字符串中的空字符留空间\n\n所有的字符数组都以空字符终止，因此其声明的大小应该比实际字符串长度多一个字符。\n\n### 使用未初始化的指针\n\n\
  未初始化的指针指向垃圾数据。以下程序是错误的：\n\n![](img/Image01121.gif)\n\n指针 `ptr` 没有经过初始化。\n\n### 缺少间接引用和地址运算符\n\
  \n另一个常见错误是忘记在某些地方使用运算符 `*` 和 `&`。考虑以下程序：\n\n![](img/Image01122.gif)\n\n这将导致编译器生成错误信息，因为指针赋值\n\
  \n```\np1 = m;\n```\n\n是错误的。它应该是：\n\n```\np1 = &m;\n```\n\n考虑以下表达式：\n\n```\ny =\
  \ p1 + 10;\n```\n\n也许 `y` 预期被赋值为位置 `p1` 处的值加上 `10`。但事实并非如此。这条语句也会产生编译错误。上面的表达式应该重写为：\n\
  \n```\ny = *p1 + 10;\n```\n\n### 指针表达式中缺少括号\n\n以下两个语句是不相同的：\n\n```\nx = *p1 + 1;\n\
  x = *(p1 + 1);\n```\n\n前者赋值 `*p1` 加 1，而后者赋值 `*(p1 + 1)` 的值。\n\n### 宏定义中参数缺少括号\n\n\
  这在宏定义替换时会导致表达式评估错误。\n\n![](img/Image01123.gif)\n\n我们常见的某些错误如下：\n\n1. 循环索引错误。\n2.\
  \ 循环终止错误。\n3. 死循环。\n4. 使用关系测试错误。\n5. 未考虑所有条件。\n6. 除以零。\n7. `scanf` 和 `printf` 中的数据规格不匹配。\n\
  8. 忘记舍入误差。\n\n# 程序测试与调试\n\n![](img/Image0124.gif)\n\n测试和调试是指检测并消除程序错误的任务，使其在所有情况下产生预期的结果。每个程序员都应该意识到程序很少第一次就能运行。无论设计得多么彻底，无论编码时多么小心，都无法说程序是完全无错误的。因此，有必要努力检测并纠正可能存在的错误。\n\
  \n#### 错误类型\n\n我们讨论了许多常见错误。可能还有其他错误，有些显而易见，有些则不然。所有这些错误可以分为四类，即：语法错误、运行时错误、逻辑错误和潜在错误。\n\
  \n#### 语法错误\n\n任何违反语言规则的行为导致语法错误。编译器可以检测并隔离此类错误。当存在语法错误时，编译将失败并在列出错误及其在源代码中的行号。记住，在某些情况下，行号可能无法精确指示错误的位置。在其他情况下，一个语法错误可能会导致长长的错误列表。修正程序开头的的一个或两个错误可能会消除整个列表。\n\
  \n#### 运行时错误\n\n诸如数据类型不匹配或引用范围外元素的错误不会被编译器检测。带有这些错误的程序会运行，但会产生错误的结果，因此此类错误被称为运行时错误。隔离运行时错误通常是一项艰巨的任务。\n\
  \n#### 逻辑错误\n\n如其名，这些错误与程序的执行逻辑有关。如采取错误的路径、未考虑特定条件以及语句评估顺序错误都属于此类。逻辑错误不会显示为编译器生成的错误信息。相反，它们会导致错误的结果。\n\
  \n\n\n\n```c\nif(x ==y)\n    printf(\"They are equal\\n\");\n```\n\n当 `x` 和 `y`\
  \ 是浮点类型的值时，由于截断误差，它们很少变得相等。`printf` 调用可能根本不会执行。诸如 `while(x != y)` 的测试可能会导致死循环。\n\
  \n## 潜伏错误\n\n这是一种仅在使用特定组数据时才会出现的“隐藏”错误。例如，考虑以下语句：\n\n```\nratio = (x+y)/(p–q);\n\
  ```\n\n只有当 `p` 和 `q` 相等时，才会发生错误。这种错误只有通过使用所有可能的测试数据组合才能检测到。\n\n## 程序测试\n\n测试是审查和执行程序的过程，其目的是检测错误，这些错误可能属于上述讨论的四种错误中的任何一种。我们知道，虽然编译器可以检测语法和语义错误，但它无法检测程序执行期间出现的运行时错误和逻辑错误。因此，测试应该包含必要的步骤，以检测程序中所有可能的错误。然而，重要的是，找到所有错误是不现实的。测试过程可能包括以下两个阶段：\n\
  \n1. 人工测试。\n2. 基于计算机的测试。\n\n人工测试是一种有效的错误检测过程，在计算机测试开始之前进行。人工测试方法包括程序员的代码检查、测试小组的代码检查以及同伴小组的审查。测试是逐语句进行的，并根据常见编程错误清单进行分析。除了发现错误外，还会对编程风格和算法选择进行审查。\n\
  \n基于计算机的测试涉及两个阶段，即编译器测试和运行时测试。编译器测试是两者中最简单的，它用于检测尚未被发现的语法错误。当编译器没有检测到更多错误时，程序开始执行。这是否意味着程序是正确的？它会产生预期的结果吗？答案是否定的。程序可能仍然包含运行时错误和逻辑错误。\n\
  \n运行时错误可能会产生运行时错误消息，如“空指针赋值”和“栈溢出”。当程序没有所有此类错误时，它会产生输出，这些输出可能正确也可能不正确。现在是关键的测试，即预期输出测试。其目标是确保程序在所有输入数据条件下都能产生预期的结果。\n\
  \n正确输出的测试是使用已知结果的测试数据进行的，以便比较。这里最重要的考虑因素是有效测试数据的设计或发明。测试数据的有用标准是：必须测试执行过程中可能采取的所有各种条件和路径。\n\
  \n程序测试可以在模块（函数）级或程序级进行。模块级测试（通常称为单元测试）在每个模块上进行，以发现模块边界内的错误。当一个模块被设计为只执行一个功能时，单元测试变得简单。\n\
  \n一旦对所有模块执行了单元测试，就应该将它们集成在一起以执行所需的功能。可能会出现接口问题，例如模块之间的数据不匹配。通过集成测试来发现与接口相关的错误。\n\
  \n## 程序调试\n\n调试是隔离和修正错误的过程。一种简单的调试方法是在整个程序中使用打印语句来显示变量的值。它显示了程序的动态情况，并允许我们在各个点检查和比较信息。一旦确定了错误的位置并修正了错误，就可以删除调试语句。我们可以使用第\
  \ 15 章讨论的条件编译语句来开启或关闭调试语句。\n\n另一种方法是使用推演法。通过排除和精炼的过程找到错误的位置。这是通过使用错误可能的原因列表的。\n\n\
  第三种错误定位方法是根据程序的逻辑对错误结果回溯，直到找到错误。\n\n## 程序效率\n\n计算机系统的两个关键资源是执行时间和内存。程序的效率是根据这两个资源衡量的。通过良好的设计和编码实践可以提高效率。\n\
  \n### 执行时间\n\n执行时间与所选算法的效率直接相关。然而，某些编码技术可以提高执行效率。以下是编写程序时可以应用的技术：\n\n1. 选择尽可能快的算法。\n\
  2. 简化算术和逻辑表达式。\n3. 尽可能使用快速的算术运算。\n4. 仔细评估循环，避免循环内部任何不必要的计算。\n5. 如果可能，避免使用多维数组。\n\
  6. 使用指针处理数组和字符串。\n\n尝试提高效率时，请记住以下：\n\n1. 在尝试任何效率更改之前，分析算法和程序的各个部分。\n2. 先让它运行，再让它更快。\n\
  3. 在尝试让它更快的同时保持正确。\n4. 不要为了效率而牺牲清晰度。\n\n### 内存需求\n\n微机环境中的内存限制是程序员关注的问题。因此，最好采取所有必要步骤压缩内存。\n\
  \n1. 保持程序简单。\n2. 使用简单且需求较少的算法。\n3. 用正确的尺寸声明数组和字符串。\n4. 如果可能，限制多维数组的使用。\n5. 尝试评估并利用语言提供的内存特性。\n\
  \n## 核心概念\n\n- **程序设计**：分析问题和设计程序逻辑的过程。\n- **回溯**：一种错误定位方法，通过反向追踪程序来定位错误。\n- **潜伏错误**：一种仅在使用某些特定组数据时才发生的隐藏错误。\n\
  - **逻辑错误**：由编程逻辑错误引起的错误。\n- **运行时错误**：在程序运行时发生的错误。\n\n## 始终记住\n\n- 在开发大型程序时，确保其设计被体现在程序结构和算法中。\n\
  - 遵循良好的设计和编码实践以确保程序效率。\n- 避免常见的编程错误，如缺失或位置错误的分号、括号不匹配、未声明的变量、函数参数不匹配、引用数组边界之外的位置等。\n\
  - 正确测试程序以检测并消除潜伏错误。\n\n## 单选题\n\n为以下每个单选题选择正确答案：\n\n**16.1 下列哪种类型的错误被认为是仅在使用数据集时才显现的潜伏错误？**\n\
  (a) 语法错误\n(b) 逻辑错误\n(c) 运行时错误\n(d) 潜伏错误\n\n**16.2 下列哪些错误应该在编译阶段检测到？**\n(a) 缺失分号\n\
  (b) 用 `=` 代替 `==`\n(c) 缺失括号\n(d) 缺失引号\n\n**16.3 下列哪些是程序设计的关键元素？**\n(a) 算法\n(b) 伪代码\n\
  (c) 流程图\n(d) 以上所有\n\n## 复习题\n\n16.1 判断下列陈述的对错。\n\n\n\n\n\n(a) C 语言允许程序员交替使用某些控制结构。例如，`switch`\
