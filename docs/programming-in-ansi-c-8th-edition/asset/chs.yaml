  ```c\n```\n## 存储类的声明\nC 语言中的变量不仅有数据类型，还有存储类，存储类提供了关于其位置和可见性的信息。存储类决定了变量在程序的哪个部分内可以被识别。考虑以下示例：\n\
  ![](img/Image00140.gif)\n在调用 `main` 函数之前声明的变量 `m` 是全局变量。它可以在程序中的所有函数中使用。不需要在其他函数中声明。全局变量也称为外部变量。\n\
  变量 `i`、`balance` 和 `sum` 被称为局部变量，因为它们是在函数内部声明的。局部变量只在声明它们的函数内部可见且有意义。它们对其他函数是不可知的。注意，变量\
  \ `i` 在两个函数中都被声明了。在一个函数中对 `i` 值的任何更改都不会影响它在另一个函数中的值。\nC 提供了多种存储类限定符，用于显式声明变量的作用域和生命周期。作用域和生命周期的概念仅在多函数和多文件程序中重要，因此在以后讨论函数时会详细讨论存储类。现在，请记住有四种存储类限定符（`auto`、`register`、`static`\
  \ 和 `extern`），它们的含义见表 3.10。\n存储类是另一个限定符（类似于 `long` 或 `unsigned`），可以像下面一样添加到变量声明中：\n\
