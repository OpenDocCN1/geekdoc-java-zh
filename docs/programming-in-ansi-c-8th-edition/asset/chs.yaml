  ### 9.5 是否有一个名为 `strstr` 的函数？[LO 9.4 E]\n\nE 代表简单（Easy），M 代表中等（Medium），H 代表困难（High）\n\
  \n\n\n\nC 函数可以分为两类，即库函数和用户定义函数。`main` 是用户定义函数的一个示例。`printf` 和 `scanf` 属于库函数类。我们还使用了其他库函数，如\
  \ `sqrt`、`cos`、`strcat` 等。这两类函数之间的主要区别在于，库函数不需要由我们编写，而用户定义函数必须在编写程序时由用户开发。然而，用户定义函数以后可以成为\
  \ C 程序程序库的一部分。事实上，这是 C 语言的优势之一。\n\n## 用户定义函数的需要\n\n![](img/Image00643.gif)\n\n如前所述，`main`\
  \ 是 C 语言中一个特殊的函数。每个程序必须有一个 `main` 函数，以指示程序从哪里开始执行。虽然可以使用仅 `main` 函数来编写任何程序，但这会导致许多问题。程序可能会变得过于庞大和复杂，导致调试、测试和维护任务变得困难。如果将一个程序被划分为不同的功能部分，那么每个部分就可以独立编码，并在稍后组合成单个单元。这些独立编码的程序被称为子程序，它们更容易理解、调试和测试。在\
  \ C 语言中，这种子程序被称为“函数”。\n\n![67218.png](img/Image00644.jpg)\n\n图 10.1 使用函数的自顶向下模块化编程\n\
  \n在某些情况下，某些类型的操作或计算会在程序的多个点重复。例如，我们可能在程序的多个点使用一个数字的阶乘。在这种情况下，我们可能在需要的地方重复程序语句。另一种方法是设计一个可以在需要时随时调用和使用的函数。这既节省了时间又节省了空间。\n\
  \n这种“划分”方法显然带来了许多优势：\n\n1. 它促进了自顶向下的模块化编程，如图 10.1 所示。在这种编程风格中，首先解决整体问题的高层逻辑，而稍后处理每个低层函数的细节。\n\
  2. 通过在适当的位置使用函数，可以缩短源程序的长度。这一因素对于内存空间有限的微型计算机尤为关键。\n3. 易于定位和隔离故障函数以进行进一步调查。\n4.\
  \ 一个函数可以被许多其他程序使用。这意味着 C 程序员可以在他人已经完成的基础上进行构建，而不是从零重新开始。\n\n## 多函数程序\n\n函数是一个执行特定任务的自包含代码块。一旦函数被设计并封装，它就可以被视为一个“黑盒”，从主程序接收某些数据并返回一个值。操作的内部细节对程序的其余部分是不可见的。程序对函数了解的所有信息只有：输入什么以及输出什么。每个\
  \ C 程序都可以使用一组这些被称为函数的“黑盒”集合来设计。\n\n考虑如下一组语句：\n\n![](img/Image00645.gif)\n\n上述语句定义了一个名为\
  \ `printline` 的函数，该函数可以打印一行长度为 39 个字符的字符。该函数可以如下所示在程序中使用：\n\n![](img/Image00646.gif)\n\
  \n该程序将打印以下输出：\n\n——————————————————————————————————————— -\n\n这说明了 C 函数的使用\n\n————————————————————————————————————\
  \ — -\n\n上述程序包含两个用户定义函数：\n\n- `main()` 函数\n- `printline()` 函数\n\n众所周知，程序的执行始终从 `main`\
  \ 函数开始。在 `main` 执行期间，遇到的第一个语句是\n\n```\nprintline();\n```\n\n这表示要执行函数 `printline`。此时，程序控制被转移到函数\
  \ `printline`。执行完 `printline` 函数（输出一行 39 个字符长度的行）后，控制传回 `main`。现在，执行从函数调用执行的地方继续。在执行完\
  \ `printf` 语句后，控制再次转移到 `printline` 函数以再次打印该行。\n\n`main` 函数调用了两次用户定义的 `printline`\
  \ 函数，并调用了一次库函数 `printf`。我们可能会注意到 `printline` 函数本身重复调用了 39 次库函数 `printf`。\n\n任何函数都可以调用任何其他函数。事实上，它也可以调用自己。一个“被调用的函数”也可以调用另一个函数。一个函数可以被调用多次。事实上，这是使用函数的主要特征之一。图\
  \ 10.2 描述了多函数程序中的控制流。\n\n除了起点之外，构成完整程序的函数之间没有其他预定的对应关系、优先级规则或层级结构。函数可以按任何顺序放置。被调用的函数可以放在调用函数的之前也可以放在之后。然而，通常的做法是将所有被调用的函数放在最后。参见“模块化编程”框。\n\
  \n### 模块化编程\n\n模块化编程是一种应用于软件系统设计开发的策略。它被定义为将大型程序组织成较小的、独立的程序段，称为模块，这些模块是单独命名并可单独调用的程序单元。这些模块经过仔细整合，成为一个满足系统要求的软件系统。这基本上是解决问题的一种“分治法”方法。\n\
  \n![](img/66250.png](Image00647.gif)\n\n图 10.2 多函数程序中的控制流\n\n模块的识别和设计使其能够组织成自顶向下的层次结构（类似于组织结构）。在\
  \ C 语言中，每个模块指的是负责单一任务的函数。\n\n模块化编程的一些特征如下：\n\n![](img/Image00648.gif)\n\n1. 每个模块只做一件事。\n\
  2. 模块之间的通信仅通过调用模块允许。\n3. 一个模块可以且仅能被一个上层模块调用。\n4. 没有调用关系的模块之间不能进行直接通信。\n5. 所有模块都设计为单入口、单出口系统。\n\
  \n## 用户定义函数的要素\n\n![](img/Image00649.gif)\n\n到目前为止，我们在程序中讨论并使用了各种数据类型和变量。然而，这些变量的声明和使用主要是在\
  \ `main` 函数内部进行的。正如我们在第 5 章提到的，函数被分类为 C 语言中的派生数据类型。因此，我们可以定义函数并像使用其他变量一样使用它们。因此，注意到函数和变量之间存在某些相似之处并不意外。\n\
  \n- 函数名和变量名都被视为标识符，因此它们必须遵守标识符的规则。\n- 像变量一样，函数也有相关的类型（如 `int`）。\n- 像变量一样，函数名及其类型在在使用之前必须进行声明和定义。\n\
  \n为了使用用户定义函数，我们需要建立三个与函数相关的要素：\n\n1. 函数定义。\n2. 函数调用。\n3. 函数声明。\n\n\n\n\n函数定义是一个独立的程序模块，专门编写以实现某个功能的需求。为了使用此函数，我们需要在程序中需要的地方调用它。这被称为函数调用。调用函数的程序（或函数）被称为调用程序或调用函数。调用程序应该声明稍后在程序中使用的任何函数（类似于变量声明）。这被称为函数声明或函数原型。\n\
  \n## 函数的定义\n\n函数定义，也称为函数实现，应包含以下元素：\n\n1. 函数名；\n2. 函数类型；\n3. 参数列表；\n4. 局部变量声明；\n\
  5. 函数语句；以及\n6. 返回语句（return statement）。\n\n这六个元素被分为两部分，即：\n\n* 函数头（前三个元素）；和\n* 函数体（后三个元素）。\n\
  \n实现这两个部分的函数定义通用格式如下所示：\n\n![](img/Image00650.gif)\n\n第一行 `function_type function_name(parameter\
  \ list)` 被称为函数头，而大括号内的语句构成了函数体，函数体是一个复合语句。\n\n### 函数头\n\n函数头由三部分组成：函数类型（也称为返回类型）、函数名和形式参数列表。注意，函数头末尾不用分号。\n\
  \n#### 名称和类型\n\n函数类型指定了预期返回给调用函数的值的类型（如 `float` 或 `double`）。如果没有显式指定返回类型，`C` 将假设它是一个整数类型。如果函数不返回任何内容，则我们需要指定返回类型为\
  \ `void`。记住，`void` 是 `C` 中的基本数据类型之一。即使返回的是整数，显式编写返回类型也是一种良好的编程习惯。返回的值是函数产生的输出。\n\
  \n函数名可以是任何有效的 `C` 标识符，因此必须遵循与 `C` 中其他变量相同的形成规则。名称应当与函数所执行的任务匹配。然而，必须小心避免与库例程名称或操作系统命令重复。\n\
  \n#### 形式参数列表\n\n参数列表声明了将接收调用程序发送的数据的变量。它们作为函数的输入数据，以执行指定的任务。由于它们代表实际输入值，因此通常被称为形式参数。这些参数也可以用于将值发送给调用程序。这一方面将在稍后讨论更多关于函数时介绍。参数也被称为实（arguments）。\n\
  \n参数列表包含由逗号分隔并用括号括起来的变量声明。示例：\n\n```\nfloat quadratic (int a, int b, int c) {. .\
  \ . . . }\ndouble power (double x, int n) {. . . ..}\nfloat mul (float x, float\
  \ y) {. . . . . }\nint sum (int a, int b) {. . . . . }\n```\n\n记住，右括号后没有分号。注意参数变量的声明不能合并。也就是说，`int\
  \ sum (int a,b)` 是非法的。\n\n函数并不总是需要从调用程序接收值。在这种情况下，函数没有形式参数。为了指示参数列表为空，我们在括号之间使用关键字\
  \ `void`，如下所示：\n\n```c\nvoid printline (void)\n{\n    . . . .\n}\n```\n\n此函数既不接收任何输入值，也不返回任何值。许多编译器接受空括号，而不指定任何内容，如\
  \ `void printline ( )`。但是，使用 `void` 来表示空参数列表是一种良好的编程风格。\n\n### 函数体\n\n函数体包含了执行所需任务所需的声明和语句。大括号括围的体包含三部分，按顺序排列如下：\n\
  \n1. 局部声明，指定函数所需的变量。\n2. 执行函数任务的函数语句。\n3. 返回语句，返回函数求得的值。\n\n如果函数不返回任何值（如 `printline`\
  \ 函数），我们可以省略返回语句。但是，请注意其返回类型应指定为 `void`。再次，即使对于 `void` 函数，拥有一个返回语句也是好的。\n\n一些典型的函数定义示例为：\n\
  \n![](img/Image00651.gif)\n![](img/Image00652.gif)\n\n## 返回值及其类型\n\n如前所述，函数可能会向调用函数发送任何值，也可能不会。如果发送，它是通过\
  \ `return` 语句完成的。虽然可以向被调用函数传递任意数量的值，但被调用函数每次最多只能返回一个值。\n\n`return` 语句可以采取以下形式之一：\n\
  \n```\nreturn;\n```\n或\n```\nreturn expression;\n```\n\n第一种形式，“纯”返回，不返回任何值；它的作用类似于函数的结束大括号。当遇到\
  \ `return` 时，控制权会立即传回调用函数。简单返回的用法示例如下：\n\n```c\nif(error)\n    return;\n```\n\n\
  ![Note.tif](img/Image00653.jpg) 注意 C 9 9，如果指定函数返回一个值，则返回必须有与它关联的值。\n\n第二种带表达式的返回形式返回表达式的值。例如，函数\n\
  \n![](img/Image00654.gif)\n\n返回 `p` 的值，即 `x` 和 `y` 的乘积。最后两个语句可以合并为：\n\n```c\nreturn\
  \ x*y;\n```\n\n函数可以有多个返回语句。这种情况发生在返回值基于某些条件时。例如：\n\n![](img/00655.gif)\n\n函数返回什么类型的数据？所有函数默认返回\
  \ `int` 类型。但如果函数必须返回其他类型呢？我们可以通过前面讨论的函数头中使用指定符来强制函数返回特定类型。\n\n当返回值时，它会自动转换为函数的类型。对于使用\
  \ `double` 计算但返回 `int` 的函数，返回的值将被截断为整数。例如，函数\n\n![](img/00656.gif)\n\n将返回结果 7。\n\
  \n## 函数调用\n\n函数可以通过简单使用函数名后跟括号括起来的实际参数列表（或参数）来调用。示例：![](img/00657.gif)\n\n当编译器遇到函数调用时，控制权转移到函数\
  \ `mul()`。然后按照描述逐行执行该函数并在遇到 `return` 语句时返回值。该值被赋值给 `y`。如下所示：Image0058.jpg\n\n函数调用将两个整数值\
  \ 10 和 5 发送到函数：\n\n```c\nint mul(int x, int y)\n```\n\n分别赋值给 `x` 和 `y`。函数计算 `x`\
  \ 和 `y` 的积，将结果赋值给局部变量 `p`，然后向 `main` 返回 25，再次赋值给 `y`。\n\n调用函数有多种方法。列出了调用 `mul` 函数的一些方法：\n\
  \n* mul (10, 5)\n* mul (m, 5)\n* mul (10, n)\n* mul (m, n)\n* mul (m + 5, 10)\n\
  * mul (10, mul(m,n))\n* mul (expression 1, expression2)\n\n注意，第六次调用使用了自己的调用作为其参数之一。当我们使用表达式时，它们应该被求值为可以作为实际参数传递的单个值。\n\
  \n返回值的函数可以像任何其他变量一样在表达式中使用。以下语句每个都是有效的：\n\n```c\nprintf(“%d\\n”, mul(p,q));\ny =\
  \ mul(p,q) / (p+q);\n```\n\n\n\n\n\n```\nif (mul(m,n)>total) printf(\"large\");\n\
  ```\n\n然而，函数不能用于赋值语句的右侧。例如，\n\n```\nmul(a,b) = 15;\n```\n\n是无效的。\n\n不返回任何值的函数不能用于表达式；但可以被调用以执行函数指定的特定任务。第\
  \ 10.3 节中讨论的 `printline()` 函数就属于此类。此类函数可以通过直接写出名称作为独立语句来调用。\n\n示例：\n\n```\nmain()\
  \ \n{\n    printline();\n}\n```\n\n注意末尾有一个分号。\n\n## 函数调用\n\n函数调用是一个后置表达式。运算符 `..`\
  \ 的优先级非常高（见表 4.8）。因此，当函数调用作为表达式的一部分时，它将首先被求，除非使用括号来改变优先级顺序。\n\n在函数调用中，函数名是操作数，而包含实际参数的括号\
  \ `..` 是运算符。实际参数的类型、顺序和数量必须与函数的形参数匹配。多个实际参数之间必须用逗号分隔。\n\n![](img/Image00659.gif)\n\
  \n## 函数声明\n\n与变量一样，C 程序中的所有函数在被调用之前都必须声明。函数声明（也称为函数原型）由四部分组成：\n\n- 函数类型（返回类型）。\n\
  - 函数名。\n- 参数列表。\n- 终止分号。\n\n它们按照以下格式进行编码：\n\n`Function-type function-name (parameter\
  \ list);`\n\n这与函数头行非常相似，区别在于缺少终止分号。例如，上一节中定义的 `mul` 函数将声明为：\n\n```\nint mul (int\
  \ m, int n); /* 函数原型 */\n```\n\n### 注意事项\n\n1. 参数列表必须用逗号分隔。\n2. 原型声明和函数定义中的参数名不需要相同。\n\
  3. 类型必须与函数定义中的参数类型在数量、顺序和类型上保持一致。\n4. 在声明中使用参数名是可选的。\n5. 如果函数没有形参数，则列表应写为 `(void)`。\n\
  6. 当函数返回 `int` 类型的数据时，返回类型是可选的。\n7. 如果没有返回值，则返回类型必须是 `void`。\n8. 当声明的类型与函数定义中的类型不匹配时，编译器将产生错误。\n\
  \n`mul` 函数同样的声明形式如下：\n\n![](img/Image00660.gif)\n\n当函数不接受任何参数且不返回任何值时，其原型写为：\n\n\
  ```\nvoid display (void);\n```\n\n原型声明可以放在程序中的两个位置：\n\n1. 在所有函数（包括 `main`）之上。\n\
  2. 在函数定义内部。\n\n当我们把声明放在所有函数上方（全局声明区域）时，该原型被称为全局原型。此类声明对程序中的所有函数都可用。\n\n当我们将其放在函数定义内部（局部声明区域）时，该原型被称为局部原型。此类声明主要供包含它的函数使用。\n\
  \n函数的声明位置定义了程序中的一个区域，其他函数可以使用该函数。该区域被称为函数的作用域。（作用域将在本章稍后讨论）。在 `main` 之前在全局声明区域中声明原型是一种良好的编程风格。它增加了灵活性，为程序中使用的函数提供了极好的快速参考，并增强了文档性。\n\
  \n### 原型：要不要\n\n原型声明并不是必不可少的。如果一个函数在使用之前没有被声明，C 将假设其细节在链接时可用。由于原型不可用，C 将假设返回类型为整数，且参数类型与形式定义匹配。如果这些假设是错误的，链接器将失败，我们必须修改程序。教训是，我们必须始终包含原型声明，最好放在全局声明区域中。\n\
  \n## 参数无处不在！\n\n参数（也称为参数）用于以下三个地方：\n\n1. 在声明（原型）中；\n2. 在函数调用中；\n3. 在函数定义中。\n\n![](img/Image00661.gif)\n\
  \n在原型和函数定义中使用的参数称为形参数，在函数调用中使用的称为实际参数。调用语句中使用的实际参数可以是简单的常量、变量或表达式。\n\n形参数和实际参数在类型、顺序和数量上必须完全匹配。然而，它们的名称不需要匹配。\n\
  \n## 函数分类\n\n![](img/Image00662.gif)\n\n函数根据是否存在参数以及是否返回结果，可能属于以下类别之一：\n\n- 类别 1：无参数且无返回值的函数。\n\
  - 类别 2：有参数无返回值的函数。\n- 类别 3：有参数和一个返回值的函数。\n- 类别 4：无参数但有返回值的函数。\n- 类别 5：返回多个值的函数。\n\
  \n在接下来的章节中，我们将结合示例讨论这些类别。注意，从现在起，我们将更频繁地使用 arguments 一术语（而不是 parameters）。\n\n##\
  \ 无参数且无返回值\n\n当一个函数没有参数时，它不从调用函数接收任何数据。同样，当它不返回结果时，调用函数也不从被调用函数接收任何数据。实际上，调用函数和被调用函数之间没有数据传递。这在图\
  \ 10.3 中所示。虚线表示只有控制权的传递而没有数据传递。\n\n![](img/Image00663.gif)\n\n图 10.3 函数间的通信\n\n\
  如前面所述，不返回任何值的函数不能用于表达式。它只能作为独立语句使用。\n\n![](img/Image00664.gif)\n\n图 10.4 给了一个包含三个自定义函数的程序。`main`\
  \ 是调用 `printline` 和 `value` 函数的调用函数。由于两个被调用函数都没有参数，因此没有参数声明。当遇到 `printline` 函数时，它按照函数规定打印一行长度为\
  \ 35 个字符的字符。`value` 函数计算若干年后 `principal` 金额的值并打印结果。反复计算以下方程：\n\n```\nvalue = principal(1+interest-rate)\n\
  ```\n\n![](img/Image00665.gif)\n\n![](img/Image00666.gif)\n\n图 10.4 无参数且无返回值的函数\n\
  \n需要注意的是，`value` 函数直接从终端接收数据。输入数据包括 `principal amount`、`interest rate` 以及计算最终值所需的期限。`while`\
  \ 循环计算最终值，结果由库函数 `printf` 打印。当到达 `value()` 的右括号时，控制权传回调用函数 `main`。由于所有工作都是由 `value`\
  \ 自身完成的，实际上没有东西需要传回给被调用函数。`printline` 和 `value` 的返回类型都声明为 `void`。\n\n注意这里没有使用 `return`\
  \ 语句。当没有可以返回的内容时，`return` 语句是可选的。函数的右括号信号函数执行的结束，从而将控制权返回给调用函数。\n\n\n\n\n在图. 10.4\
  \ 中，主函数无法控制函数接收输入数据的方式。例如，`printline` 函数在每次被调用时都会打印相同的行。`value` 函数的情况也是如此。我们可以让调用函数从终端读取数据并将其传递给被调用函数。这种方法似乎更明智，因为调用函数可以在数据传递给被调用函数之前，在必要时检查数据的有效性。\n\
  \n![](img/Image00667.gif)\n\n图 10.5 单向数据通信\n\n调用函数与带有参数但没有值的被调用函数之间数据通信的性质如图图 10.5\
  \ 所示。\n\n我们将按照所示修改被调用函数的定义以包含参数：\n\n```\nvoid printline(char ch)\nvoid value(float\
  \ p, float r, int n)\n```\n\n参数 `ch`、`p`、`r` 和 `n` 被称为形式参数。调用函数现在可以通过包含适当参数的函数调用向这些参数发送值。例如，函数调用\n\
  \n```\nvalue(500,0.12,5)\n```\n\n会将值 `500`、`0.12` 和 `5` 发送给函数\n\n```\nvoid value(\
  \ float p, float r, int n)\n```\n\n并将 `500` 分配给 `p`，`0.12` 分配给 `r`，`5` 分配给 `n`。值\
  \ `500`、`0.12` 和 `5` 是实际参数，它们变成了被调用函数内部的形式参数的值。\n\n实际和形式参数在数量、类型和顺序上应该匹配。实际参数的值逐一分配给形式参数，从第一个参数开始，如图图\
  \ 10.6 所示。\n\n![](img/Image00668.gif) \n\n图 10.6 函数调用与被调用函数之间的参数匹配\n\n我们应该确保函数调用具有匹配的参数。如果实际参数多于形式参数（`m\
  \ > n`），额外的实际参数将被丢弃。另一方面，如果实际参数少于形式参数，不匹配的形式参数将初始化为某些垃圾值。数据类型的任何不匹配也可能导致传递垃圾值。请记住，不会生成任何错误信息。\n\
  \n虽然形式参数必须是有效的变量名，但实际参数可以是变量名、表达式或常量。实际参数中使用的变量在进行函数调用之前必须赋值。\n\n记住，当进行函数调用时，只有实际参数值的副本被传递到被调用函数中。在函数内部发生的情况对实际参数列表中使用的变量没有影响。\n\
  \n![](img/Image00669.gif)\n\n带有函数参数的修改后的程序如图图 10.7 所示。程序的大部分与图 10.4 中的程序相同。输入提示符和\
  \ `scanf` 赋值语句已从 `value` 函数移动到 `main` 函数。变量 `principal`、`inrate` 和 `period` 在 `main`\
  \ 中声明，因为它们在 `main` 中被用于接收数据。函数调用\n\n```\nvalue(principal, inrate, period);\n```\n\
  \n将其包含的信息传递给函数 `value`。\n\n`value` 函数头有三个形式参数 `p`、`r` 和 `n`，它们对应于函数调用中的实际参数，即 `principal`、`inrate`\
  \ 和 `period`。执行函数调用时，实际参数的值被分配给相应的形式参数。事实上，以下赋值跨越函数边界完成：\n\n```\np = principal;\n\
  r = inrate;\nn = period;\n```\n\n![](img/Image00670.gif)\n\n![](img/Image00671.gif)\n\
  \n图 10.7 带有参数但没有返回值的函数\n\n在函数内部声明的变量被称为局部变量，因此它们的值是局部的，不能被任何其他函数访问。我们将在本书的后部分详细讨论这一点。\n\
  \n`value` 函数计算给定周期的最终金额并像以前一样打印结果。在到达函数的右括号时返回控制权。注意，该函数没有返回任何值。\n\n`printline`\
  \ 函数被调用了两次。第一次传递了字符‘Z’，第二次向函数传递字符‘C’。这些字符被分配给形式参数 `ch` 用于打印行（参见输出）。\n\n### 可变数量参数\n\
  \n某些函数具有数量和类型在编译时不可知的可变参数。`printf` 和 `scanf` 函数是典型的例子。ANSI 标准提出了一种新符号称为省略号（ellipsis），用于处理此类函数。省略号由三个点（…）组成，用法所示：\n\
  \n```\ndouble area (int num, …)\n```\n\n函数声明和定义都应该使用省略号表示参数在数量和类型上都是任意的。\n\n###\
  \ 带返回值的参数\n\n图 10.7 中的 `value` 函数通过参数接收调用函数的数据，但不传回任何值。相反，它在终端显示结果。我们可能总是希望通过函数传回结果，可以在调用函数中使用它进行进一步处理。为了确保函数的高度可移植性，函数应该通过交出结果来克服这些缺陷![69433.png](img/Image00672.gif)\
  \ 图 10.8 双向数据通信\n\n自包含的函数应该像一个“黑盒”，接收预定义的输入形式并输出所需的值。此类函数将具有双向数据通信，如图图 10.7 所示。我们将修改程序以说明调用函数和被调用函数之间的双向通信。\n\
  \n![](img/Image00673.gif)\n\n带有建议更改的修改后程序位于图 10.10。其中一个主要变化是将 `printf` 语句移动到 `main`。\n\
  \n![](img/Image00674.gif)\n![](img/Image00675.gif)\n\n图 10.9 带有参数和返回值的函数\n\n计算出的值通过语句传递给\
  \ main：\n\n```\nreturn(sum);\n```\n\n由于默认情况下 `value` 函数的返回类型为 `int`，此时 `sum` 的“整数”值返回到\
  \ `main`并通过函数调用赋值给变量 `amount`：\n\n```\namount = value (principal, inrate, period);\n\
  ```\n\n在函数调用处，发生了以下间接赋值：\n\n```\nvalue(principal, inrate, period) = sum;\n```\n\n\
  当执行上述函数调用时，按顺序发生以下事件：\n\n1. 函数调用连同实际参数值的副本副本传递给函数 `value`，其中形式参数 `p`、`r` 和 `n` 分别被赋予\
  \ `principal`、`inrate` 和 `period` 的实际值。\n2. 被调用函数 `value` 逐行执行，直到遇到 `return(sum);`\
  \ 语句。此时，`sum` 的整数值传回 `main` 中的函数调用。\n3. 调用语句正常执行，返回的值因此被赋值给浮点变量 `amount`。\n4. 由于\
  \ `amount` 是一个浮点变量，`sum` 返回的整数部分被转换为浮点值。请查看输出。\n\n另一个重要的更改是为 `printline` 函数增加了第二个参数，以便从调用函数接收行长度的值。因此，函数调用\n\
  \n```\nprintline('*’, 52);\n```\n\n将把控制权传递给函数 `printline`，并将以下值分配给形式参数 `ch` 和 `len`：\n\
  \n```\nch = ‘’ ;\nlen = 52;\n```\n\n### 返回浮点数\n\n\n\n\n我们之前提到，当没有显式指定其他类型时，C 语言函数默认返回一个\
  \ `int` 类型的值。例如，程序 10.3 中的函数值虽然使用浮点数进行所有计算，但返回语句\n\n```\nreturn(sum);\n```\n\n只返回了\
  \ `sum` 的整数部分。这是由于函数头中缺少了类型指定符符的。在这种情况下，我们可以接受 `sum` 的整数值，因为被截断的小数部分与整数部分相比是忽略不道的。然而，有时我们可能会发现需要接收\
  \ `float` 或 `double` 类型的数据。例如，计算一组数值的平均值或标准差的函数应该返回 `float` 或 `double` 类型的函数值。\n\
  \n在所有此类情况下，我们都必须在函数定义和原型声明中显式地指定返回类型。\n\n如果被调用函数返回的数据类型与调用函数期望的数据类型之间不匹配，我们将产生不可预测的结果。因此，我们必须非常小心，确保两种类型是兼容的。\n\
  \n![](img/Image00676.gif)\n\n图 10.10 显示了一个返回 `double` 的幂函数。原型声明\n\n```\ndouble power(int,\
  \ int);\n```\n\n出现在 `main` 函数中，位于调用 `power` 之前。\n\n![](img/Image00677.gif) ![](img/Image00678.gif)\n\
  \n图 10.10 幂函数：浮点值返回说明\n\n![](img/Image00679.gif)\n\n![](img/Image00680.gif) ![](img/Image00681.gif)\n\
  \n图 10.11 返回数组中第一个最小值的位置程序\n\n另一种保证 `power` 的类型在 `main` 中调用之前已声明的方法，是在定义 `main`\
  \ 之前定义 `power` 函数。这样，`power` 的类型就可以从其定义中获知，因此我们不再需要在 `main` 中对其进行类型声明。\n\n## 无参数但有返回值\n\
  \n在某些情况下，我们可能需要设计不接受任何参数但向调用函数返回值的函数。一个典型的例子是在头文件 `<stdio.h>` 中声明的 `getchar` 函数。我们之前在很多地方使用过这个函数。`getchar`\
  \ 函数没有参数，但它返回一个代表字符的整数类型数据。\n\n我们可以设计类似的函数并在程序中使用。示例：\n\n![](img/Image00682.gif)\n\
  \n可以存在具有多个返回值的函数，这可以通过指针来实现。我们将在第 13 章讨论指针时详细讨论这一点。\n\n## 函数的嵌套\n\nC 语言允许自由嵌套函数。`main`\
  \ 可以调用 `function1`，`function1` 调用 `function2`，`function2` 调用 `function3`……以此此类推。从原则上讲，函数嵌套的深度没有限制。\n\
  \n考虑以下程序：\n\n![](img/Image00683.gif)\n\n上述程序计算比例率\n\n![65730.png](img/Image00684.jpg)\n\
  \n并打印结果。我们有以下三个函数：\n\n*   `main()`\n*   `ratio()`\n*   `difference()`\n\n`main`\
  \ 读取 `a`、`b` 和 `c` 的值，并调用函数 `ratio` 计算值 `a/(b–c)`。如果 `(b–c) = 0`，则该比例无法计算。因此，`ratio`\
  \ 调用另一个函数 `difference` 来测试差 `(b–c)` 是否为零；如果 `b` 不等于 `c`，`difference` 返回 1；否则向函数\
  \ `ratio` 返回零。反之，如果 `ratio` 收到 1，它计算值 `a/(b–c)` 并以 `float` 返回结果。如果 `ratio` 从 `difference`\
  \ 收到零，它向 `main` 返回 `0.0`，表示 `(b–c) = 0`。\n\n函数调用的嵌套也是可能的。例如，这样的语句\n\n```\nP = mul(mul(5,2),6);\n\
  ```\n\n是有效的。这代表了两次连续的函数调用。先评估内部函数调用，其返回值再次作为外部函数调用的实际参数。如果 `mul` 返回其参数的乘积，那么 `p`\
  \ 的值将是 60 (= 5 × 2 × 6)。\n\n注意，嵌套并不意味着在另一个函数内部定义一个函数。这样做是违法的。\n\n![](img/Image00685.gif)\n\
  \n## 递归\n\n![](img/Image00686.gif)\n\n当被调用的函数再次调用另一个函数时，就会发生“链式”过程。递归是这种过程的一种特殊情况，即函数调用其自身。下面是一个非常简单的递归示例：\n\
  \n![](img/Image00687.gif)\n\n执行时，该程序将产生如下的输出：\n\n```\nThis is an example of recursion\n\
  This is an example of recursion\nThis is an example of recursion\nThis is an ex\n\
  ```\n\n执行突然终止；否则执行将无限持续。\n\n递归的另一个有用示例是计算给定数字的阶乘。数字 `n` 的阶乘表示为如下连续乘法：\n\n`factorial\
  \ of n = n(n–1)(n–2)...`\n\n例如，\n\n`factorial of 4 = 3 × 2 × 1 =`\n\n计算 `n` 的阶乘函数如下：\n\
  \n![](img/Image00688.gif)\n\n让我们看看递归的工作。假设 `n = 3`。由于 `n` 的值不是 1，语句\n\n```\nfact\
  \ = factorial(n-1);\n```\n\n将在 `n = 3` 时执行。这一次，\n\n```\nfact = factorial(n-1);\n\
  ```\n\n将在 `n = 2` 时评估。再次，\n\n```\nfact = factorial(n-1);\n```\n\n将在 `n = 1` 时执行。这种调用返回。操作序列总结如下：\n\
  \n![](img/Image00689.gif)\n\n![](img/Image00690.gif)\n\n递归的另一个经典示例是斐波那契数列。数列的第 `n`\
  \ 项使用递归方程定义：\n\n`F1 = 1`\n`F2 = 1`\n`Fn = Fn – 1 + Fn – 2`\n\n因此，数列的项为 1, 1, 2,\
  \ 3, 5, 8, 13, 21……前两项有时被定义为 0 和 1。生成此类数列第 项的 C 函数如下：\n\n![](img/Image00691.gif)\n\
  \n注意 `fibonacci` 函数被递归调用了两次：一次计算 (n–1) 项，另一次计算 (n–2) 项。\n\n阿曼函数是另一个定义良好的全可计算函数示例。该函数的增长速度比指数函数快。该函数有多种形式。我们讨论一种常用的变体。阿曼函数\
  \ `A(m, n)` 当 `m>=0` 且 `n>=0` 时定义如下：\n\n![65658.png](img/Image00692.gif)\n\n编写计算阿曼函数元素的\
  \ C 函数时应非常小心。由于该函数的倍指数增长率，即使对于如 `m=4, n=3` 或 `m=4, n=4` 这样的小索引，阿曼函数的值也是巨大的。操作也非常消耗资源。因此，用于存储此类数值的数据类型至少应该是\
  \ `long int` 或 `long double`。这里是计算 `A(m, n)` 的递归实现。\n\n![](img/Image00693.gif)\n\
  \n![](img/Image00694.gif)\n\n## 向函数传递数组\n\n## 一维数组\n\n![](img/Image00695.gif)\n\n\
  就像简单变量的值一样，将数组的值传递给函数也是可能的。要将一维数组传递给被调用函数，只需列出数组名称（不带任何下标）和数组的大小作为参数。例如，调用\n\n```\n\
  largest(a,n)\n```\n\n将整个数组 `a` 传递给被调用函数。期望此调用的被调用函数必须适当定义。`largest` 函数头可能如下：\n\n\
  \n\n\n\n```c\nfloat largest(float array[ ], int size)\n```\n\n`largest` 函数定义接收两个参数：数组名和数组的大小，用以指定数组中元素的数量。形式参数\
  \ `array` 的声明如下：\n\n```c\nfloat array[ ];\n```\n\n这对括号告知编译器参数 `array` 是一个数字数组。在这里没有必要指定数组的大小。\n\
  \n让我们考虑一个在元素数组中寻找最大值的问题。程序如下：\n\n![](img/Image00696.gif)\n\n当调用函数 `largest (value,4)`\
  \ 时，`array value` 中所有元素的值将成为被调用函数中 `array a` 对应的元素。`largest` 函数找到数组中的最大值并将结果返回给主函数（main）。\n\
  \n在 C 语言中，数组名代表其第一个元素的地址。通过传递数组名，我们实际上是将数组的地址传递给被调用函数。被调用函数中的数组现在指向内存存储的同一个数组。因此，被调用函数中数组的任何更改将反映在原始数组中。\n\
  \n将参数地址传递给函数称为按地址传递（或指针传递）。请注意，我们不能像处理普通变量那样通过值传递整个数组。\n\n![](img/Image00697.gif)\n\
  \n一组 `n` 个值的标准差由公式给出：\n\n![](img/Image00698.gif)\n\n其中 `![65550.png](img/Image00699.jpg)`\
  \ 是值的平均值。\n\n![](img/Image00700.gif) ![](img/Image00701.gif)\n\n图 10.12 将数组传递给函数\n\
  \n一个由 `main`、`std_dev` 和 `mean` 函数组成的多功能程序所示图 10.12 。`main` 从终端读取数组 `value` 的元素，并调用函数\
  \ `std_dev` 来打印数组元素的标准差。而 `std_dev` 反而调用另一个函数 `mean` 来提供数组元素的平均值。\n\n`std_dev` 和\
  \ `mean` 都定义为浮点型（float），因此它们在程序的全局区域被声明为 float。\n\n### 将数组传递给函数的三条规则\n\n1. 调用函数时必须仅传递数组名。\n\
  2. 在函数定义中，形式参数必须是数组类型；不需要指定数组的大小。\n3. 函数原型必须显示该参数是一个数组。\n\n在处理数组参数时，我们应该记住一个主要的区别。如果函数更改了数组元素的值，那么这些更改将应用在传递给函数的原始数组上。当整个数组作为参数传递时，数组的内容不会复制到形式参数数组中；相反，数组元素地址的信息会被传递给函数。因此，对数组元素引入任何更改都会真实地反映在调用函数中的原始数组中。然而，当单个元素作为参数传递时，这种情况并不适用。程序\
  \ 10.6 强调了这些概念。\n\n### 搜索与排序\n\n搜索和排序是涉及数组和函数的两个常见应用程序。让我们尝试理解每种操作所涉及的内容。\n\n####\
  \ 搜索\n\n搜索是一种用于对一组数据进行查找以定位特定元素的操作。这种搜索操作可以通过多种方式进行。线性搜索和二分搜索是两种流行的搜索技术。线性搜索操作的工作原理是从数组的第一个位置开始，按顺序在每个位置查找所需的元素。这种搜索过程的时间复杂度为\
  \ O(n)。这个复杂度告诉我们，要从数组中检索元素，所需的比较操作次数是 `n` 数量级的。\n\n让我们考虑以下实现线性搜索算法的程序。该程序使用一个函数\
  \ `linear_search()`，如果找到元素则返回该元素的位置，否则返回 -1。\n\n![](img/Image00702.gif)\n\n![](img/Image00703.gif)\n\
  \n以下是程序的示例输出：\n\n```\nEnter the size of the list: 5\nEnter the elements of the array:\n\
  Enter A[0] = 50\nEnter A[1] = 30\nEnter A[2] = 10\nEnter A[3] = 60\nEnter A[4] =\
  \ 80\nEnter the data that needs to be searched: 60\nThe data 60 is present at position\
  \ 3 of the array\n```\n\n另一种可能的输出如下：\n\n```\nEnter the size of the list: 5\nEnter\
  \ the elements of the array:\nEnter A[0] = 50\nEnter A[1] = 30\nEnter A[2] = 10\n\
  Enter A[3] = 60\nEnter A[4] = 80\nEnter the data that needs to be searched: 75\n\
  The data 75 is not present in the array\n```\n\n#### 排序\n\n排序是按照指定顺序排列数据集所需的操作。冒泡排序、合并排序、堆排序、基数排序和快速排序是一些排序算法。我们现在考虑一种名为选择选择排序（Selection\
  \ sort）的常用排序算法，将一组数字升序排列。该算法从所有元素中选择最小值并放在第一个位置（最小值应该在第一个位置）。现在考虑列表中的剩余数字。\n\n该算法的复杂度为\
  \ O(n²)。\n\n表 1 第一轮通过\n| Number | 5 | 7 | 3 | 2 | 1 |\n| :--- | :--- | :--- | :---\
  \ | :--- | :--- |\n| Position | 0 | 1 | 2 | 3 | 4 |\n\n表 2 第二轮通过\n| Number | 1 |\
  \ 7 | 3 | 2 | 5 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| Position | 0 |\
  \ 1 | 2 | 3 | 4 |\n\n表 3 第三轮通过\n| Number | 1 | 2 | 3 | 7 | 5 |\n| :--- | :--- |\
  \ :--- | :--- | :--- | :--- |\n| Position | 0 | 1 | 2 | 3 | 4 |\n\n表 4 第四轮通过\n|\
  \ Number | 1 | 2 | 3 | 7 | 5 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| Position\
  \ | 0 | 1 | 2 | 3 | 4 |\n\n表 5 四轮通过后的最终列表\n| Number | 1 | 2 | 3 | 5 | 7 |\n| :---\
  \ | :--- | :--- | :--- | :--- | :--- |\n| Position | 0 | 1 | 2 | 3 | 4 |\n\n现在让我们考虑一个对\
  \ n 个数字进行排序的 C 程序：\n\n![](img/Image00704.gif) ![](img/Image00705.gif)\n\n以下是上述程序的示例输出：\n\
  \n```\nEnter the size of the list: 5\nEnter the elements of the array:\nEnter A[0]\
  \ = 5\nEnter A[1] = 3\nEnter A[2] = 10\nEnter A[3] = 6\nEnter A[4] = 8\nThe sorted\
  \ list is as follows:\nA[0] = 3\nA[1] = 5\nA[2] = 6\nA[3] = 8\nA[4] = 10\n```\n\n\
  \n\n\n\n![](img/Image00706.gif)\n\n一个使用冒排序算法对整数数组进行排序的程序如图图 10.13 所示。\n\n![](img/Image00707.gif)\n\
  \n图 10.13 使用函数对数组元素排序\n\n## 二维数组\n\n类似于简单数组，我们也可以将多维数组传递给函数。方法与我们处理一维数组的方法相似。规则很简单。\n\
  \n1. 调用函数时必须仅传递数组名。\n2. 在函数定义中，我们通过包含两组括号来指示该数组是二维的。\n3. 必须指定第二个维度的大小。\n4. 数据的原型声明应与函数头相似。\n\
  \n下面给出的函数计算二维矩阵中所有值的平均值。\n\n![](img/Image00708.gif)\n\n该函数可以在主函数中使用，如下所示：\n\n![](img/Image00709.gif)\n\
  \n## 向函数传递字符串\n\n在 C 语言中，字符串被视为字符数组，因此将字符串传递给函数的规则与将数组传递给函数的规则非常相似。\n\n基本规则是：\n\n\
  1. 要传递的字符串在定义函数时必须声明为函数的形参数。例如：\n\n![](img/Image00710.gif)\n\n2. 函数原型必须显示该参数是一个字符串。对于上面的函数定义，原型可以写为：\n\
  \n`void display(char str[ ]);`\n\n3. 调用函数时必须有一个不带下标的字符串数组名作为实际参数。例如：\n\n`display\
  \ (names);`\n\n其中 `names` 是调用函数中一个声明正确的字符串数组。\n\n![](img/Image00711.gif)\n\n## 变量的作用域、可见性和生命周期\n\
  \n![](img/Image00712.gif)\n\nC 语言中的变量行为与大多数其他语言中的变量不同。例如，在 BASIC 程序中，变量在整个程序运行期间保留其值。但在\
  \ C 语言中并非总是如此。这完全取决于变量可能承担的“存储”类。\n\n在 C 语言中，所有变量不仅具有数据类型，而且具有存储类。以下变量存储类与函数最相关：\n\
  \n1. 局部变量（自动变量）\n2. 全局变量（外部变量）\n3. 静态变量。\n4. 寄存器变量。\n\n我们将简要讨论上述每一类变量的作用域、可见性和长寿。变量的作用域决定了变量在程序的哪个区域内实际上是可用的（“活跃”的）。长寿指的是变量在程序执行期间保留给定值的时长（“存活”期）。因此，长寿直接影响给定变量的效用。可见性指的是从内存访问变量的权限。\n\
  \n变量还可以根据其声明的位置大致分为内部（局部）或外部（全局）。内部变量是在特定函数内部声明的变量，而外部变量是在任何函数之外声明的变量。\n\n理解存储类的概念及其效用，对于开发高效的多功能程序非常重要。\n\
  \n### 自动变量\n\n自动变量声明在将要它的函数内部。它们在函数被调用时创建，并在函数退出时自动销毁，因此被称为自动变量。因此，自动变量对于其声明的函数是私有的（或局部的）。由于这一属性，自动变量也被称为局部变量或内部变量。\n\
  \n在函数内部声明且未指定存储类的变量默认是自动变量。例如，在下面的示例中变量 `number` 的存储类是自动的。\n\n![](img/Image00713.gif)\n\
  \n我们也可以使用关键字 `auto` 来显式声明自动变量。\n\n![](img/Image00714.gif)\n\n自动变量的一个重要特性是，其值不会因为程序中某些其他函数的执行而意外改变。这确保了我们可以在程序的不同函数中声明并使用相同的变量名，而不会给编译器引起任何混乱。\n\
  \n![](img/Image00715.gif)\n\n一个包含两个子程序 `function1` 和 `function2` 的程序如图图 10.14 所示。`m`\
  \ 是一个自动变量，在每个函数的开头声明。`m` 在 `function1`、`function2` 和 `main` 中分别初始化为 `10`、`100` 和\
  \ `1000`。\n\n执行时，`main` 调用 `function2`，`function2` 再调用 `function1`。当 `main` 活跃时，`m\
  \ = 1000`；但当调用 `function2` 时，`main` 的 `m` 暂时被存起，新的局部 `m = 100` 变为活跃。同样，当调用 `function1`\
  \ 时，之前的两个 `m` 值都被存起，最新的 `m` 值 (=10) 变为活跃。一旦 `function1 (m=10)` 完成，`function2 (m=100)`\
  \ 接管。一旦完成，`main (m=1000)` 接管。输出清楚地显示，在一个函数中赋值给 `m` 的值不会影响它在其他函数中的值；且 `m` 的局部值在离开函数时会被销毁。\n\
  \n![](img/Image00716.gif) ![](img/Image00717.gif)\n\n图 10.14 自动变量的工作\n\n自动变量的作用域和长寿有两个值得记忆的后果。首先，局部于\
  \ `main` 的变量在整个程序范围内都是可见的，尽管它是活跃的。其次，在递归期间，嵌套变量是唯一的自动变量，类似于函数同名的情况。\n\n### 外部变量\n\
  \n在整个程序范围内存活且活跃的变量被称为外部变量。它们被称为全局变量。与局部变量不同，全局变量可以被任何函数访问。外部变量声明在函数之外。例如，`integer\
  \ number` 和 `float length` 的外部声明可能如下：\n\n![](img/Image00718.gif)\n\n变量 `number`\
  \ 和 `length` 在所有函数中都是可用的。如果局部变量和全局变量同名，局部变量在声明它的函数中具有优先权。考虑以下示例：\n\n![](img/Image00719.gif)\n\
  \n当函数引用变量 `count` 时，它引用的是局部变量而不是全局变量。`main` 中的 `count` 值不会受到影响。\n\n![](img/Image00720.gif)\n\
  \n一个说明全局变量特性的程序如图图 10.15 所示。注意变量 `x` 被所有函数使用，但除了 `fun2` 之外没有函数对 `x` 有定义。由于 `x` 在所有函数的上方声明，因此每个函数都可以使用它，无需将其作为函数参数传递。此外，由于\
  \ `x` 的值直接可用，我们不需要在 `fun1` 和 `fun3` 中使用 `return(x)` 语句。然而由于 `fun2` 有 `x` 的定义，它返回了其局部\
  \ `x` 值，因此使用了返回语句。在 `fun2` 中，全局 `x` 是不可见的。局部 `x` 在这里隐藏了它的可见性。\n\n![](img/Image00721.gif)\
  \ ![](img/Image00722.gif)\n\n图 10.15 全局变量特性说明\n\n一旦变量被声明为全局，任何函数都可以使用并改变它的值。那么，后续函数只能引用该新值。\n\
  \n### 全局变量作为参数\n\n由于程序源文件中所有函数都可以访问全局变量，因此可以用于函数之间传递值。然而，将全局变量作为参数传递值会带来某些问题。\n\n\
  - 传递给调用函数的全局变量值可能会被调用函数意外改变。\n- 函数应该是独立且隔离的模块。如果它们使用全局变量，这种特性就会丢失。\n\n\n\n\n\n-\
  \ 读者无法立即看出哪些值被发送到了被调用的函数。\n- 使用全局变量的函数会受到重用性的影响。\n\n全局变量的另一个方面是，它仅从声明点到程序结束时可用。考虑如下所示程序段：\n\
  \n![](img/Image00723.gif)\n\n我们这里有一个问题。对于 `main` 而言，`y` 未定义定义。因此，编译器将发出错误信息。与局部变量不同，全局变量默认初始化为零。因此，语句\n\
  \n```c\ny = y+1;\n```\n\n在 `fun1` 中将把 `1` 赋值给 `y`。\n\n## 外部声明\n\n在上述程序段中，`main`\
  \ 无法访问变量 `y`，因为它在 `main` 函数之后才被声明。这个问题可以通过使用存储类型类 `extern` 声明该变量来解决。\n\n例如：\n\n\
  ![](img/Image00724.gif)\n\n![](img/Image00725.gif)\n\n虽然变量 `y` 在两个函数之后都被定义，但在函数内部对\
  \ `y` 的外部声明告知编译器 `y` 是在程序其他地方定义的整数类型。注意，`extern` 声明不为变量分配存储空间。对于数组，定义也应该包含它们的大小。\n\
  \n例如：\n\n![](img/Image00726.gif)\n\n函数内部的 `extern` 为该特定函数提供类型信息。我们可以通过在任何函数之前放置外部声明，为文件中的所有函数提供类型信息。\n\
  \n例如：\n\n![](img/Image00727.gif)\n\n定义和声明之间的区别也适用于函数。当指定函数的参数和函数体时，函数被定义。这告诉编译器为函数代码分配空间，并为参数提供类型信息。由于函数默认是外部的，我们在（调用函数中）声明它们时不使用限定符\
  \ `extern`。因此，声明\n\n```c\nvoid print_out(void);\n```\n\n等于\n\n```c\nextern void\
  \ print_out(void);\n```\n\n任何函数之外的声明行为与变量声明相同。\n\n## 静态变量\n\n顾其名，静态变量的值持续到程序结束。可以使用\
  \ `static` 关键字将变量声明为静态，例如：\n\n```c\nstatic int x;\nstatic float y;\n```\n\n取决于声明的位置，静态变量可以是内部类型，也可以是外部类型。\n\
  \n内部静态变量是那些在函数内部定义的变量。内部静态变量的作用范围延伸到它们定义的函数结束。因此，内部静态变量与自动变量相似，区别在于它们在程序的剩余时间内一直保持存在（存活）。因此，内部静态变量可以用于在函数调用之间保留值。例如，它可以用于计算对函数的调用次数。\n\
  \n![](img/Image00728.gif)\n\n图. 10.16 中的程序解释了静态变量的行为。\n\n![](img/Image00729.gif)\n\
  \n图 10.16 静态变量说明图\n\n静态变量仅在程序编译时初始化一次。它不再被初始化。在第一次调用 `stat` 时，`x` 增加到 `1`。由于 `x`\
  \ 是静态的，这个值会持续，因此，下次调用向 `x` 又增加了 `1`，使其值变为 `2`。当进行第三次调用时，`x` 的值变为三。\n\n如果我们把 `x`\
  \ 声明为自动变量，输出将是：\n\n```text\nx = 1\nx = 1\nx = 1\n```\n\n这是因为每次调用 `stat` 时，自动变量 `x`\
  \ 都会初始化为零。当函数终止时，它的值 `1` 就丢失了。\n\n外部静态变量在所有函数之外声明，对程序中的所有函数可用。静态外部变量和简单外部变量之间的区别在于，静态外部变量仅在定义它的文件中可用，而简单外部变量可以被其他文件访问。\n\
  \n也可以控制函数的作用范围。例如，我们希望某个特定函数仅对其定义所在文件中的函数可见，而对其他文件中的任何函数可见。这可以通过使用存储类型 `static`\
  \ 定义“该”函数来实现。\n\n## 寄存器变量\n\n我们可以告诉编译器变量应该保存在机器的一个寄存器中，而不是保存在内存中（普通变量存储的地方）。由于寄存器访问远快于内存访问，将频繁访问的变量（例如循环控制变量）保留在寄存器中将导致程序运行更快。实现方法如下：\n\
  \n```c\nregister int count;\n```\n\n尽管 ANSI 标准没有限制其应用于任何特定数据类型，但大多数编译器仅允许将 `int`\
  \ 或 `char` 变量放在寄存器中。\n\n由于寄存器中只能放置少数变量，因此为此目的仔细选择变量非常重要。然而，一旦达到限制，C 将自动将寄存器变量转换为非寄存器变量。\n\
  \n表 10.1 总结了函数和文件中变量的可见性和生命周期信息。\n\n表 10.1 变量的作用范围和生命周期\n\n![](img/Image00730.gif)\n\
  \n## 嵌套块\n\n一组被大括号括起来的语句被称为块或复合语句。注意，包括 `main` 在内的所有函数都使用复合语句。块可以有自己的声明和其他语句。还可以在函数体或另一个块内部定义语句块，从而产生所谓的嵌套块，如下：\n\
  \n![65151.png](img/Image00731.jpg)\n\n执行此程序时，`c` 的值将是 `10`，而不是 `30`。语句 `b = a;`\
  \ 将 `20` 赋值给 `b`而不是零。尽管 `a` 的作用范围延伸到 `main` 结束，但在再次声明 `a` 的内部块内，它是不可见的。内部的 `a` 隐藏了内部块中外部\
  \ `a` 的可见性。然而，当我们离开内部块时，外部 `a` 再次可见。记住，变量 `b` 在内部块中没有重新声明，因此在两个块中都是可见的。这就是为什么当评估语句\n\
  \n```c\nint c = a + b;\n```\n\n时，`a` 取值为 `0`，`b` 取值为 `10`。\n\n尽管 `main` 的变量在嵌套块内部可见，反之则。\n\
  \n## 作用范围规则\n\n### 作用范围\n变量可使用的区域。\n\n### 可见性\n程序访问内存的能力。\n\n### 生命周期\n变量在执行期间存在于内存中的持续。\n\
  \n### 使用规则\n1. 全局变量的作用范围是整个程序文件。\n2. 局部变量的作用范围从声明点开始，到定义它的块或函数结束。\n3. 形式函数参数的作用范围是其的函数。\n\
  4. 在 `main` 中声明的自动变量的寿命是整个程序执行时间，尽管其作用范围仅限于 `main` 函数。\n5. 在函数中声明的自动变量生命在函数退出时结束。\n\
  6. 静态局部变量的作用范围限于其函数，但其寿命持续到程序结束。\n7. 所有变量在它们的作用范围内可见可见，只要它们没有被再次声明。\n8. 如果变量在其作用范围内再次被重新声明，它将失去在重新声明变量的作用范围内的可见性。\n\
  \n\n\n\n\n到目前为止，我们假设所有函数（包括 `main`）都定义在一个文件中。然而，在现实的编程环境中，我们可能会使用多个源文件，这些文件可以单独编译并在以后链接形成一个可执行对象。这种方法非常有用，因为一个文件中的任何更改都不会影响其他文件，从而消除了重新编译的需求。\n\
  \n只要变量被声明为外部变量，多个源文件就可以共享该变量。被两个或多个文件共享的变量是全局变量，因此我们必须在一个文件中相应地声明它们，然后在其他文件中使用 `extern`\
  \ 显式定义。图 10.17 展示了在多文件程序中使用 `extern` 声明。\n\n`file1` 中的函数可以引用在 `file2` 中声明为全局的变量\
  \ `m`。然而，`function1` 无法访问变量 `m`。如果将 `extern int m;` 语句放在 `main` 之前，这两个函数都可以引用 `m`。也可以通过在\
  \ `file1` 中的每个函数内部使用 `extern int m;` 语句来实现。\n\n`extern` 说明符告诉编译器后续的变量和名称已经声明，不需要为它们创建存储空间。解决引用问题是链接器的责任。需要注意的是，多文件全局变量应该在不带\
  \ `extern` 的文件中（仅限一个）进行声明。`extern` 声明是在进行二次引用的地方。如果我们在同一个程序使用的两个不同文件中将一个变量声明为全局变量，那么链接器将对使用哪个变量产生冲突，从而发出警告。(Image0732)\n\
  \n### 图.10.17 多文件程序中 extern 的使用\n\n如图 10.18 所示的多文件程序可以按照如图 10.17 所示的方式进行修改。(Image00733)\n\
  \n### 图.10.18 多文件程序的另一个版本\n\n当函数在一个文件中定义并在另一个文件中访问时，后一个文件必须包含该函数的声明。该声明将该函数标识为外部函数，其定义出现在其他地方。我们通常将此类声明放在文件的开头，位于所有函数之前。虽然假设所有函数都是外部的，但使用存储类型类\
  \ `extern` 显式声明此类函数是一个良好的习惯。\n\n### 核心概念 (#text00006.html_ch10-23a)\n\n- **参数 (Arguments)**：传递给函数的数值集合，使函数能够执行所需的任务。[LO\
  \ 10.1]\n- **块语句 (Block statement)**：括在一在大括号内的一组语句。[LO 10.1]\n- **函数 (Function)**：执行特定任务的独立编码的子程序。[LO\
  \ 10.1]\n- **模块化编程 (Modular Programming)**：一种软件开发方法，将一个大型程序组织成较小的、独立的程序段，称为模块。[LO\
  \ 10.1]\n- **调用用者程序 (Calling program)**：调用另一个函数的程序或函数。[LO 10.2]\n- **函数体 (Function\
  \ body)**：包含执行所需任务的语句块。[LO 10.2]\n- **函数类型 (Function type)**：指定函数将返回的值的类型。[LO 10.2]\n\
  - **参数列表 (Parameter list)**：在函数调用时将接收数据值的变量列表。[LO 10.2]\n- **程序定义 (Program definition)**：编写以执行特定任务的独立程序模块。也称为函数定义。[LO\
  \ 10.2]\n- **递归 (Recursion)**：函数调用自身的情景。[LO 10.4]\n- **外部变量 (External variable)**：在整个程序运行期间都有效的变量。也称为全局变量。[LO\
  \ 10.6]\n- **局部变量 (Local variable)**：仅在特定函数或语句块内有效的变量。也称为内部变量。[LO 10.6]\n\n### 始终记住\
  \ (#text00006.html_ch10-24a)\n\n- 返回值的函数可以像其他 C 变量一样用在表达式中。[LO 10.1]\n- 返回值的函数不能作为独立语句使用。[LO\
  \ 10.1]\n- 在使用更多函数的地方，可以以任何顺序放置。[LO 10.1]\n- 如果声明和函数定义中的类型不匹配，则为语法错误。[LO 10.2]\n\
  - 如果函数调用中的实际参数数量与声明语句中的数量不匹配，则为语法错误。[LO 10.2]\n- 如果函数调用中的参数顺序放置错误，则为逻辑错误。[LO 10.2]\n\
  - 在头文件行尾放置分号是非合法的。[LO 10.2]\n- 忘记原型声明末尾的分号是一个错误。[LO 10.2]\n- `return` 语句可以出现在函数体内的任何位置。[LO\
  \ 10.2]\n- 函数定义可以放在 `main` 函数之后或之前。[LO 10.2]\n- 如果返回类型是 `void` 除的任何类型，则需要一个返回语句。[LO\
  \ 10.3]\n- 如果函数不返回任何值，则返回类型必须声明为 `void`。\n- 如果函数没有参数，参数列表必须声明为 `void`。[LO 10.3]\n\
  - 在期望返回时使用 `void` 作为类型是错误的。[LO 10.3]\n- 在函数体内部定义函数是不允许的。[LO 10.3]\n- 如果返回的数据类型与函数类型不匹配，会导致逻辑错误。[LO\
  \ 10.3]\n- 如果函数调用中的参数顺序错误，最可能导致逻辑错误。[LO 10.3]\n- 函数默认返回整数值。\n- 当值传递参数时，没有 `return`\
  \ 语句的函数无法返回值。[LO 10.3]\n- 当返回值赋值给变量时，它将转换为变量的类型。\n- `void` 返回类型的函数不能作为赋值的目标。它只能作为独立语句使用。[LO\
  \ 10.3]\n- 函数可以有多个 `return` 语句。[LO 10.3]\n- 递归函数必须有一个强制函数不进行递归调用的条件并返回，否则函数永远不会返回。[LO\
  \ 10.4]\n- 将形式参数名作为局部变量名是非法的。[LO 10.5]\n- 参数列表中的变量必须单独声明类型。我们不能像局部或全局变量那样使用多个声明。[LO\
  \ 10.5]\n- 尽可能使用值传递，以避免被调用函数对调用者变量的意外更改。[LO 10.5]\n- 虽然不是必须的，但为了文档目的，在原型声明中包含参数名称。[LO\
  \ 10.5]\n- 在函数使用的全局变量将保留其值供以后使用。[LO 10.6]\n- 定义在函数内部的局部变量在该函数已知。它在函数退出时被销毁。[LO 10.6]\n\
  - 全局变量可见范围从其声明处到程序结束。[LO 10.6]\n- 当作用域内（函数或块内）重新声明变量时，原始变量在重新声明变量的作用域内是不可见的。[LO\
  \ 10.6]\n- 声明为 `static` 的局部变量在函数退出后仍保留其值。[LO 10.6]\n- 静态变量在编译时初始化，因此它们只初始化一次。[LO\
  \ 10.6]\n- 避免使用隐藏外层作用域名称。[LO 10.6]\n\n### 简案例 (#text00006.html_ch10-25a)\n\n1. 曲线下面积的计算\
  \ [LO 10.1, 10.2, 10.3, 10.6 M]\n\n\n\n\n\n计算机在数值分析中的应用之一是计算曲线下的面积。计算曲线下面积的一种简单方法是将面积划分为若干个宽度相同的梯形，并累加每个梯形的面积。梯形的面积公式为：\n\
  \n`Area = 0.5 * (h1 + h2) * b`\n\n其中 `h1` 和 `h2` 是两个侧边的高度，`b` 是宽度，如图图 10.19 所示。\n\
  \n![](img/Image00734.gif)\n\n图 10.19 曲线下的面积\n\n图 10.21 中的程序计算函数：\n\n`f(x) = x2 +\
  \ 1`\n\n在任意两个给定范围（例如，`A` 和 `B`）之间的面积。\n\n### 输入\n- 下限 (`A`)\n- 上限 (`B`)\n- 梯形数量\n\
  \n### 输出\n- 给定范围内曲线下的总面积。\n\n## 算法\n![](img/Image00735.gif)\n\n图 10.20 模块化图\n\n\
  1. 输入下限、上限和梯形数量。\n2. 计算梯形的宽度。\n3. 初始化总面积。\n4. 计算梯形的面积并加到总面积中。\n5. 重复步骤 4 直到完成所有梯形的计算。\n\
  6. 打印总面积。\n\n该算法采用自顶向模块化形式实现，如图图 10.20 所示。\n\n`f(x)` 的评估是通过一个单独函数完成的，以便方便修改以允许评估其他函数。\n\
  \n两次运行的结果显示，梯形数量越多，准确性越高。对于范围 `0` 到 `3`，实际面积为 12 个单位（通过解析法得出）。\n\n![](img/Image00736.gif)\
  \ ![](img/Image00737.gif)\n\n图 10.21 计算曲线下的面积\n\n### 单选题](#text00006.html_ch10-26a)\n\
