  ![](img/#text00006.html_ch11-2a)\n\n介绍\n\n我们已经看到，数组可以用于表示一组相同类型的数据项，例如 `int` 或 `float`。然而，如果我们想用一个单一名称来表示一组不同类型的数据项，就无法使用数组。幸运的是，C\
  \ 语言支持一种名为“结构体”（structures）的构造数据类型，这是一种将不同类型数据的机制。结构体是处理一组逻辑相关数据项的方便工具。例如，它可以用于表示一组属性，如\
  \ `student_name`（学生姓名）、`roll_number`（学号）和 `marks`（分数）。此类结构的更多示例如下：\n\n![](img/Image00749.gif)\n\
  \n结构体有助于以更有意义的方式组织复杂数据。这是一个我们在程序设计中经常可能需要的强大概念。本章专门研究结构体及其在程序开发中的应用。还会讨论另一个名为“联合”（unions）的相关概念。\n\
  \n### 定义结构体\n\n![](img/Image00750.gif)\n\n与数组不同，结构体必须先定义格式，以后可以用于声明结构体变量。让我们用一个例子来说说明结构体定义和结构体变量创建的过程。考虑一个包含书名、作者、页数和价格的图书数据库。我们可以如下定义一个结构体来存储这些信息：\n\
  \n![](img/Image00751.gif)\n\n关键字 `struct` 声明了一个用于包含四个数据字段的结构体，即 `title`（标题）、`author`（作者）、`pages`（页数）和\
  \ `price`（价格）。这些字段被称为结构元素或成员（members）。每个成员可能属于不同类型的数据。`book_bank` 是结构体的名称，被称为“结构标签”（structure\
  \ tag）。该标签名后续可用于声明具有该标签结构的变量。\n\n注意，上述定义并没有声明任何变量。它仅仅是描述了一个名为“模板”（template）的格式，用于表示所示的信息：\n\
  \n![](img/Image00752.gif)\n\n结构体定义的通用格式如下：\n\n![](img/Image00753.gif)\n\n在定义结构体时，你可能会注意到以下语法：\n\
  \n![](img/Image00754.gif)\n\n1. 模板以分号结束。\n2. 虽然整个定义被视为一条语句，但每个成员都在模板内部的独立语句中根据其名称和类型被独立声明。\n\
  3. 这如 `book_bank` 这样的标签名可以在程序的后续部分用于声明其所属类型的结构体变量。\n\n#### 数组与结构体\n\n数组和结构体都被归类为结构化数据类型，因为它们提供了一种机制，使能够以相对简单的方式访问和操作数据。但它们在许多方面不同，如下：\n\
  \n1. 数组是相同类型相关数据元素的集合。结构体可以拥有不同类型的元素。\n2. 数组是派生数据类型，而结构体是程序员定义的类型。\n3. 任何数组的行为都像内置数据类型。我们只需声明一个数组变量并使用它即可。但在结构体的情况下，在声明和使用该类型的变量之前，我们必须设计并声明数据结构。\n\
  \n## 声明结构体变量\n\n在定义结构体格式后，我们可以声明该类型的变量。结构体变量声明与任何其他数据类型的变量声明相似。它包含以下元素：\n\n1. 关键字\
  \ `struct`。\n2. 结构标签名。\n3. 用逗号分隔的变量名列表。\n4. 结束性分号。\n\n例如，语句\n\n```\nstruct book_bank,\
  \ book1, book2, book3;\n```\n\n将 `book1`、`book2` 和 `book3` 声明为 `struct book_bank`\
  \ 类型的变量。\n\n这些变量中的每一个都有模板指定的四个成员。完整的声明可能像这样：\n\n![](img/Image00755.gif)\n\n记住，结构体的成员本身并不是变量。在它们与如\
  \ `book1` 等结构体变量关联之前，它们不占用任何内存。当编译器遇到声明语句时，它会为结构体变量预留内存空间。允许将结构体定义和变量声明合并在一条语句中。\n\
  \n声明\n\n```\n![](img/Image00756.gif\n\n\n是有效的。在这里使用标签名是可选的。例如：\n\n```\nstruct book1,\
  \ book2, book3;\n```\n\n将 `book1`、`book2` 和 `book3` 声明为代表三本书的结构体变量，但不包含标签名。然而，这种方法不被推荐的简单原因是：没有标签名的结构体无法从其他任何地方引用。\n\
  \n#### 类型定义的结构体\n\n我们可以使用关键字 `typedef` 按如下方式定义结构体：\n\n![](Image00758.gif)\n\n`type_name`\
  \ 代表与其相关的结构体定义，因此，可以如下所示声明结构体变量：\n\n```\ntype_name variable1, variable2 . . . ;\n\
  ```\n\n记住 (1) `type_name` 是类型定义而不是变量，(2) 我们不能通过 `typedef` 定义变量。\n\n![](img/Image00759.gif)\n\
  \n复数有两个部分：实部和虚部。结构体可以用于在 C 中实现复数，如下所示：\n\n![](img/Image00760.gif)\n\n### 访问结构体成员\n\
  \n我们可以通过多种方式访问并为结构体成员赋值。如前，成员本身不是变量。它们应该与结构体变量关联以产生意义。例如，`title` 词没有意义，而 `title\
  \ of book3` 这个短语有意义。成员与变量之间的链接使用成员运算符 `.` 建立，它也称为点运算符。例如，`book1.price` 是代表 `book1`\
  \ 价格的变量，可以像任何普通变量一样处理。这里我们为 `book1` 的成员赋值：\n\n```\nstrcpy(book1.title, \"BASIC\"\
  );\nstrcpy(book1.author, \"Balagurusamy\");\nbook1.pages = 250;\nbook1.price = 120.50;\n\
  ```\n\n我们也可以使用 `scanf` 通过键盘给出值。\n\n```\nscanf(\"%s\\n\", book1.title);\nscanf(\"\
  %d\\n\", &book1.pages);\n```\n\n都是有效的输入语句。\n\n![](img/Image00763.gif)\n\n结构体定义及程序如图\
  \ 11.1\n\n图 11.1 定义并访问结构体成员\n\n### 结构初始化\n\n与其他类型一样，结构体变量可以在编译时初始化。\n\n![](img/Image00765.gif)\n\
  \n这会将 `60` 赋值给 `student.weight`并将 `180.75` 赋值给 `student.height`。成员与其初始化值之间存在一一对应的关系。\n\
  \n初始化结构体时可以有很多变化。以下语句初始化了两个结构体变量。在这里必须使用标签名。\n\n![](img/Image00766.gif)\n\n另一种方法是在函数外初始化结构体变量，如下：\n\
  \n![](img/Image00767.gif)\n\nC 语言不允许在模板内初始化单个结构体成员。初始化必须仅在实际变量的声明时完成。\n\n注意结构体变量的编译时初始化必须包含以下元素：\n\
  \n\n\n\n\n1. 关键字 `struct`。\n2. 结构体标签名。\n3. 要声明的变量名。\n4. 赋值运算符 `=`。\n5. 结构体变量成员的一组值，用逗号分隔并括在大括号中。\n\
  6. 终止分号。\n\n## 结构体的初始化规则\n\n![](img/Image00768.gif)\n\n在编译时初始化结构体变量时，有几条规则需要注意，如下：\n\
  \n1. 我们不能在结构体模板内部初始化单个成员。\n2. 大括号内值的顺序必须与结构体定义中成员的顺序匹配。\n3. 允许进行部分初始化。我们可以只初始化前几个成员，并将剩余部分留空。未初始化的成员应位于列表的末尾。\n\
  4. 未初始化的成员将被赋予默认值，如下所示：\n   - 整数和浮点数赋值为 0。\n   - 字符和字符串赋值为 `'\\0'`。\n\n## 结构体变量的复制与比较\n\
  \n![](img/Image00769.gif)\n\n相同结构类型的变量可以像普通变量一样进行复制。如果 `person1` 和 `person2` 属于同一个结构，那么以下语句是有效的：\n\
  \n```c\nperson1 = person2;\nperson2 = person1;\n```\n\n然而，如下语句\n\n![](img/Image00770.gif)\n\
  \n```c\nperson1 == person2\nperson1 != person2\n```\n\n是不允许的。C 语言不允许对结构体变量进行任何逻辑操作。在我们需要比较它们的情况下，可以通过逐个比较成员来实现。\n\
  \n![](img/Image00771.gif)\n\n图 11.2 所示的程序说明了如何将一个结构体变量复制到另一个相同类型的变量中。它还执行了成员比较，以判断两个结构体变量是否相同。\n\
  \n![](img/Image00772.gif) ![](img/Image00773.gif)\n\n图 11.2 结构体变量的比较与复制\n\n## 字边界与填充字节（Slack\
  \ Bytes）\n\n计算机使用“字边界”（word boundary）的概念来存储结构体。字边界的大小取决于机器。在双字节字边界的计算机中，结构体的成员左对齐存储在字边界上，如下所示。字符数据占用一个字节，整数占用两个字节。在它们之间留了一个未占用的字节。这个未占用的字节被称为填充字节（slack\
  \ byte）。\n\n![](img/Image00774.gif)\n\n当我们声明结构体变量时，每个变量都可能包含填充字节，存储在这些填充字节中的值是未定义的。由于由于原因，即使两个变量的成员相等，它们的结构也不一定比较相等。因此，C\
  \ 语言不允许对结构体进行比较。但是，我们可以设计自己的函数，通过逐个比较成员来判断结构体是否相等。\n\n## 对单个成员的操作\n\n如前所述，单个成员是通过成员运算符点\
  \ `.` 来标识的。带有点运算符的成员及其结构体变量可以像任何其他变量名一样处理，因此可以使用表达式和运算符对其进行操作。考虑图 11.2 中的程序。我们可以执行以下操作：\n\
  \n![](img/Image00775.gif)\n\n我们还可以对数值类型的成员应用递增和递减运算符。例如，以下语句是有效的：\n\n```c\nstudent1.number\
  \ ++;\n++student1.number;\n```\n\n成员运算符的优先级高于所有算术和关系运算符，因此不需要括号。\n\n## 访问成员的三种方法\n\
  \n我们使用点运算符来访问结构体变量的成员。实际上，还有两种方法。考虑以下结构体：\n\n![](img/Image00776.gif)\n\n标识符 `ptr`\
  \ 被称为指针，它被分配了结构体变量 `n` 的地址。现在可以通过以下三种方式访问成员：\n\n- 使用点表示法：`ν . x`\n- 使用间接表示法：`(*ptr)\
  \ . x`\n- 使用选择表示法：`ptr -> x`\n\n第二和第三方法将在第 12 章中考虑。\n\n![](img/Image00777.gif)\n\
  \n## 结构体数组\n\n![](img/Image00778.gif)\n\n我们使用结构体来描述一组相关变量的格式。例如，在分析一个学生的成绩时，我们可能使用模板来描述学生姓名和各科的成绩，然后将所有学生声明为结构体变量。在这种情况下，我们可以声明一个结构体数组，数组的每个元素代表一个结构体变量。例如：\n\
  \n```c\nstruct class student[100];\n```\n\n定义了一个名为 `student` 的数组，包含 100 个元素。每个元素被定义为\
  \ `struct class` 类型。考虑以下声明：\n\n![](img/Image00779.gif)\n\n这声明了 `student` 是一个包含三个元素的数组\
  \ `student[0]`、`student[1]` 和 `student[2]`，并初始化了它们的成员如下：\n\n![](img/Image00780.gif)\n\
  \n注意，数组的声明方式与其他任何数组完全相同。由于 `student` 是数组，我们使用通常的数组访问方法来访问单个元素，然后使用成员运算符访问成员。记住，`student`\
  \ 数组的每个元素都是带有三个成员的结构体变量。\n\n结构体数组在内存中的存储方式与多维数组相同。数组 `student` 实际上如图 11.3 所示。\n\n\
  ![](img/Image00781.gif)\n\n图 11.3 内存中的 student 数组\n\n![](img/Image00782.gif)\n\n\
  程序如图 11.4 所示。我们声明了一个四成员的结构体，用于存储学生总分。我们还声明了一个数组 `total` 来存储科目总分和总分。总分由 `total.total`\
  \ 表示。注意成员名可以是任何有效的 C 名称，并与现有的结构体变量名相同。`total.total` 代表结构体变量 `total` 的成员。\n\n![](img/Image00783.gif)\
  \ ![](img/Image00784.gif)\n\n图 11.4 结构体数组：下标结构变量的说明\n\n## 结构体内部数组\n\nC 允许将数组作为成员。我们已经在结构体内部使用了字符数组。同样，我们可以使用\
  \ `int` 或 `float` 类型的一维或多维数组。例如，以下结构体声明是有效的：\n\n![](img/Image00785.gif)\n\n在这里，成员\
  \ `subject` 包含三个元素 `subject[0]`、`subject[1]` 和 `subject[2]`。这些元素可以通过适当的下标访问。例如，名称\n\
  \n```c\nstudent[1].subject[2];\n```\n\n将指向第二个学生的第三科目的成绩。\n\n![](img/Image00786.gif)\n\
  \n修改后的程序如图 11.5 所示。你可能会注意到代码中科目数组的使用变得简单。\n\n![](img/Image00787.gif) ![](img/Image00787.gif)\n\
  \n图 11.5 结构体中下标数组的使用\n\n## 嵌套结构体\n\n![](img/Image00788.gif)\n\n结构体内部的结构体意味着结构的嵌套。C\
  \ 允许结构的嵌套。让我们考虑以下用于存储员工工资信息的结构：\n\n![](img/Image00789.gif)\n\n该结构定义了名称、部门、基本工资和三种津贴。我们可以将所有与津贴相关的项放在一起，如下所示在一个子结构中：\n\
  \n![](img/Image00790.gif)\n\n工资结构包含一个名为 `allowance` 的成员，该成员本身是一个带有三个成员的结构。内部结构中包含的成员即\
  \ `dearness`、`house_rent` 和 `city` 可以引用为：\n\n`employee.allowance.dearness`\n\n`employee.allowance.house_rent`\n\
  \n`employee.allowance.city`\n\n\n\n\n嵌套结构中的最内成员可以通过点运算符将所有相关的结构变量（从最外层到最内层）与成员连接起来来访问。以下情况是无效的：\n\
  \n`employee.allowance`（缺少实际成员）\n\n`employee.house_rent`（缺少内部结构变量）\n\n内部结构可以包含多个变量。以下声明的形式是合法的：\n\
  \n![](img/Image00791.gif)\n\n该内部结构有两个变量，`allowance` 和 `arrears`。这意味着它们具有相同的结构模板。注意名称\
  \ `allowance` 之后有一个逗号。可以通过以下方式访问基础成员：\n\n`employee[1].allowance.dearness`\n\n`employee[1].arrears.dearness`\n\
  \n我们也可以使用标签名（tag names）来定义内部结构。例如：\n\n![](img/Image00792.gif)\n\n`pay` 模板定义在 `salary`\
  \ 模板之外，用于定义 `salary` 结构内部 `allowance` 和 `arrears` 的结构。\n\n嵌套超过一种类型的结构也是允许的。\n\n\
  ![](img/Image00793.gif)\n\n该结构的第一个成员是 `name`，类型为 `struct name_part`。同样，其他成员也有自己的结构类型。\n\
  \n![](img/Image00794.gif)\n\n## 结构与函数](#text00006.html_ch11-13a)\n\n我们知道 C 语言的主要哲学是使用函数。因此，C\
  \ 支持将结构值作为参数传递给函数是很自然的。有三种方法可以将结构的值从一个函数传递到另一个函数。\n\n1. 第一种是将结构的每个成员作为函数调用的实参。实参随后被像普通变量一样独立地处理。这是最基础的方法，当结构体很大时，它会变得难以管理且效率低下。\n\
  \n2. 第二种方法涉及将整个结构的拷贝传递给调用函数。由于函数是在结构的副本上运行，函数内部对结构成员的任何更改都不会反映在原始结构（调用函数）中。因此，函数有必要将整个结构返回给调用函数。并不是所有的编译器都支持这种将整个结构作为参数传递的方法。\n\
  \n3. 第三种方法采用指针的概念将结构作为参数传递。在这种情况下，结构的地址位置被传递给被调用函数。函数可以间接访问整个结构并对其进行操作。这与数组传递给函数的方式类似。与第二种相比，这种方法更高效。\n\
  \n在本节中，我们将详细讨论第二种方法，而使用指针的第三种方法将在下一章详细处理指针时讨论。\n\n将结构拷贝发送给调用函数的通用格式为：\n\n![](img/Image00795.gif)\n\
  \n被调用函数的格式如下：\n\n![](img/Image00796.gif)\n\n以下是需要注意的重要点：\n\n1. 被调用函数必须声明其类型与其预期返回的数据类型匹配。例如，如果返回的是整个结构的拷贝，则必须声明为带有适当标签名的\
  \ `struct`。\n\n2. 作为实参的结构变量与被调用函数中对应的形参必须是相同的 `struct` 类型。\n\n3. 只有当函数向调用函数返回某些数据时，才需要\
  \ `return` 语句。该表达式可以是任何简单变量、结构变量或使用简单变量的表达式。\n\n4. 当函数返回结构时，它必须在调用函数中赋值给相同类型的结构。\n\
  \n5. 被调用函数必须在调用函数中恰当地声明。\n\n![](img/Image00797.gif)\n\n图 11.6 显示了一个更新项目的程序。`update`\
  \ 函数接收结构变量 `item` 的拷贝作为其参数之一。注意，函数 `update` 和形参 `product` 都被声明为 `struct stores`\
  \ 类型。这样做是因为函数使用参数 `product` 来接收结构变量 `item` 并返回 `item` 的更新值。\n\n函数 `mul` 的类型为 `float`，因为它返回了\
  \ `price` 和 `quantity` 的乘积。然而，接收结构变量 `item` 的参数 `stock` 被声明为 `struct stores` 类型。\n\
  \n`update` 返回的整个结构可以拷贝到相同类型的结构中。语句：\n\n```\nitem = update(item,p_increment,q_increment);\n\
  ```\n\n用新值替换 `item` 的旧值。\n\n![](img/Image00798.gif) ![](img/Image00799.gif)\n\n\
  图 11.6 使用结构作为函数参数\n\n你可能会注意到 `stores` 的模板是在 `main()` 之前定义的。这使得数据类型 `struct stores`\
  \ 变成了全局，并使函数 `update` 和 `mul` 能够使用该定义。\n\n![](img/Image00800.gif)\n\n## 联合体](#text00006.html_ch11-14a)\n\
  \n![](img/Image00801.gif)\n\n联合体是借自结构的概念，因此遵循与结构相同的语法。然而，它们在存储方面存在有本质的区别。在结构中，每个成员都有自己的存储位置，而\
  \ `union` 的所有成员都使用同一个位置。这意味着，尽管 `union` 可能包含多个成员，但它一次只能处理一个成员。像结构一样，可以使用 `union`\
  \ 关键字如下声明联合体：\n\n![](img/Image00802.gif)\n\n这声明了一个类型为 `union item` 的变量 `code`。该\
  \ `union` 包含三个不同类型的成员，但我们一次只能使用其中一个。这是因为无论其大小如何，联合体只分配一个存储空间。\n\n![](img/Image00803.gif)\n\
  \n图 11.7 联合体成员共享存储\n\n编译器分配了足够容纳最大变量的存储空间。在上述联合体中，所有成员都共享同一个地址。这假设 `float` 变量需要\
  \ 4 字节，而 `int` 变量需要 2 字节。\n\n要访问联合体成员，可以使用与访问结构成员相同的语法。即：\n\n`code.m`\n\n`code.x`\n\
  \n`code.c`\n\n都是有效的成员变量。在访问时，我们应该确保访问的是当前存储的成员。例如，如下语句：\n\n```\ncode.m = 379;\n\
  code.x = 7859.36;\nprintf(\"%d\", code.m);\n```\n\n将产生错误输出（取决于机器）。\n\n实际上，`union`\
  \ 创建了一个供其任何一个成员使用的存储位置。当给不同的成员赋值新值时，新值将取代先一个成员的值。\n\n联合体可以使用任何允许使用结构的地方。嵌套在结构内部的联合体成员的访问法与嵌套结构相同。\n\
  \n联合体可以在声明变量时进行初始化。但与结构不同，它只能与第一个联合体成员类型的值进行初始化。例如，对于前面的，声明：\n\n```\nunion item\
  \ abc = {100};\n```是有效的，但声明：\n\n```\nunion item abc = {10.75};\n```\n\n是非的。这是因为第一个成员的类型是\
  \ `int`。其他成员可以通过赋值或从键盘读取来初始化。\n\n## 结构的大小](#text00006.html_ch11-15a)\n\n我们通常使用结构、联合体和数组来创建大型的变量。这些变量在字节方面的实际大小可能会随机器而变化。我们可以使用一元运算符\
  \ `sizeof` 来获取结构（或任何变量）的大小。表达式：\n\n```\nsizeof(struct x)\n```\n\n\n\n将计算存储结构 `x`\
  \ 中所有成员所需的字节数。如果 `y` 是一个类型为 `struct x` 的简单结构变量，那么表达式\n\n`sizeof(y)`\n\n也会得到相同的答案。然而，如果\
  \ `y` 是一个类型为 `struct x` 的数组变量，那么\n\n`sizeof(y)`\n\n将给出数组 `y` 所需的字节总数。\n\n这类信息对于确定数据库中的记录数非常有用。例如，表达式\n\
  \n`sizeof(y)/sizeof(x)`\n\n将给出数组 `y` 中的元素个数。\n\n## 位域字段 (Bit Fields)\n\n到目前为止，我们一直在使用\
  \ 16 位的整型字段来存储数据。在某些情况下，数据项所需的空间远小于 16 位。在这种情况下，我们浪费了内存空间。幸运的是，C 语言允许我们使用小的位域字段来存储数据项，从而在一个内存字中封装多个数据项。位域字段允许直接操作一组预选的位。\n\
  \n位域字段是一组相邻的位，其长度可以从 1 到 16 位不等。因此，一个字可以被分为若干个位域字段。位域字段的名称和大小是通过结构体定义的。位域字段定义的通用格式为：\n\
  \n![](img/Image00804.gif)\n\n数据类型可以是 `int`、`unsigned int` 或 `signed int`，位宽是用于指定名称的位数数。记住，有符号的位域至少应该有\
  \ 2 位（1 位用于符号位）。注意，字段名后跟着一个冒号。位宽由要存储的值的范围决定。可以存储的最大值是 $2^{n-1}$，其中 `n` 是位宽。\n\n\
  位域字段的内部表示取决于机器。也就是说，它取决于 `int` 的大小和位的顺序。某些机器从左到右存储位，而另一些则从右到左存储。下面的草图说明了位域字段的布局，假设这是一个从右到左排序的\
  \ 16 位字。\n\n![](img/Image00805.gif)\n\n有几个特定的点需要注意：\n\n1. 第一个字段始终从字的第一个位开始。\n2.\
  \ 位域不能跨越整数边界。也就是说，结构体中所有字段的长度之和不大于字的大小。如果超过，重叠的字段将被强制到下一个字的开头。\n3. 可以声明带大小的未命名字段。例如：\n\
  \   `Unsigned : bit-length`\n   此类字段在字内提供填充。\n4. 字中可能存在未使用的位。\n5. 我们不能对位域变量取地址。这意味着我们不能使用\
  \ `scanf` 将值读入位域中。我们也无法使用指针来访问位域。\n6. 位域不能组成数组。\n7. 位域的赋值值应在其大小的范围内范围内。如果我们尝试分配更大的值，行为将是不可预测的。\n\
  \n假设我们想以压缩的形式存储和使用员工的个人信息，可以如下所示：\n\n![](img/Image00806.gif)\n\n这定义了一个名为 `emp` 的变量，包含四个位域字段。每个字段可能取值的范围如下所示：\n\
  \n![](img/Image00807.gif)\n\n一旦定义了位域，就可以像引用任何其他结构类型数据项一样引用它们。以下赋值语句是有效的：\n\n```\n\
  emp.sex = 1;\nemp.age = 50;\n```\n\n记住，我们不能使用 `scanf` 将值读入位域中。我们可能需要先读入一个临时变量，然后将其值赋值给位域。例如：\n\
  \n```c\nscanf(\"%d %d\", &AGE, &CHILDREN);\nemp.age = AGE;\nemp.children = CHILDREN;\n\
  ```\n\n访问位域的一个限制是不能使用指针。然而，它们可以像其他变量一样用在普通表达式中。例如：\n\n```c\nsum = sum + emp.age;\n\
  if(emp.m_status). . . .;\nprintf(\"%d\\n\", emp.age);\n```\n\n这些都是有效语句。\n\n可以将普通结构元素与位域元素结合起来。例如：\n\
  \n![](img/Image00808.gif)\n\n这将 `emp` 声明为包含 100 个元素的 `struct personal` 类型数组。这将普通变量名、结构类型变量地址与位域结合在了一起。\n\
  \n位域按照它们在定义中顺序被封装到字中。考虑以下定义：\n\n![](img/Image00809.gif)\n\n在这里，位域 `a` 将在一个字中，变量\
  \ `count` 将在第二个字中，位域 `b` 将在第三个字中。字段 `a` 和 `b` 不会被封装到同一个字中。\n\n![](img/Image00810.gif)\n\
  \n## 核心概念\n\n- **数组 (Array)**：它是一个固定大小的相同数据类型元素的序列集合。[LO 11.1]\n- **点运算符 (Dot operator)**：它将结构体变量与结构体成员连接起来。它用于读/写成员值。[LO\
  \ 11.1]\n- **结构体 (Structure)**：这是一种用户定义的数据类型，允许将不同的数据类型组合在一起表示一条数据记录。[LO 11.1]\n\
  - **联合体 (union)**：它在语法上与结构体相似，但存储技术不同。与结构体不同，联合体成员使用相同的内存位置来存储所有成员值。[LO 11.1]\n\
  - **位域 (Bit field)**：指的是一组相邻的位，长度可以从 1 到 16 位不等。[LO 11.1]\n\n## 必须记住 (ALWAYS REMEMBER)\n\
  \n- 初始化联合体时使用与第一个类型不匹配的数据是错误的。[LO 11.5]\n- 我们不能对位域取地址。因此，我们不能使用 `scanf` 将值读入位域中。我们也无法使用指针来访问位域。[LO\
  \ 11.5]\n- 记住在定义末尾加上分号。[LO 11.1]\n- 在大括号后使用结构标签名。[LO 11.1]\n- 我们不能在结构类型时声明变量。[LO\
  \ 11.1]\n- 使用其自身的结构成员是非法的。[LO 11.1]\n- 仅使用标签名（不带 `struct` 关键字）声明变量是错误的。[LO 11.1]\n\
  - 使用成员名。[LO 11.1]\n- 使用 `scanf` 读取值时，对于非字符串成员必须使用地址运算符 `&`。[LO 11.1]\n- 创建结构体时始终提供结构标签名。[LO\
  \ 11.1]\n- 使用简洁且有意义的结构标签名。[LO 11.1]\n- 避免在不同结构体中使用相同的名称（尽管这是合法的）。[LO 11.1]\n- 比较两个结构体变量是错误的。[LO\
  \ 11.2]\n- 将一种类型的结构体赋值给另一种类型的结构体是错误的。[LO 11.2]\n- 当使用指针和点符号访问成员时，需要对指针加括号，例如 `(*ptr).number`。[LO\
  \ 11.2]\n- 选择运算符 `->` 是一个单一标记。在符号 `-` 和 `>` 之间有任何空格都是错误的。[LO 11.2]\n- 在引用结构体数组中的单个结构体时，忘记包含数组下标是错误的。[LO\
  \ 11.3]\n- 当结构体嵌套时，必须通过所有嵌套它的结构体进行限定。[LO 11.4]\n- 通过指针将结构体传递给函数比按值传递更有效。（指针传递将在第\
  \ 12 章中讨论）。[LO 11.4]\n- 联合体每次只能存储其成员中的一个。我们在访问正确的成员时必须非常小心。访问错误的数据是逻辑错误。[LO 11.5]\n\
  \n\n\n\n-   位字段不能作为数组。`[LO 11.5]`\n\n## 案例分析\n\n### 1. 书店库存 `[LO 11.1, 11.2, 11.3,\
  \ 11.4, 11.5 M]`\n\n一家书店使用个人电脑来维护店内销售书籍的库存。列表包含了作者、标题、价格、出版社、架位等详细信息。每当客户想要某本书书时，店主输入书籍的标题和作者，系统会回复该书是否在列表中。如果没有，则会显示适当的消息。如果书在列表中，系统将显示书籍详情并询问数量。如果请求的数量有货，则显示书籍的总费用；否则，显示消息“所需副本无库存”。\n\
  \n实现此目的的程序如图 `Fig. 11.8` 所示。该程序使用模板（template）来定义书籍的结构。请注意，出版日期作为记录结构的一个成员，也被定义为一个结构体。\n\
  \n当指定书籍的标题和作者时，程序使用以下函数在列表中查找书籍：\n\n```\nlook_up(table, s1, s2, m)\n```\n\n接收结构变量\
  \ `book` 的参数 `table` 被为类型 `struct record`。参数 `s1` 和 `s2` 接收标题和作者的字符串值，而 `m` 接收列表中书籍的总数。书籍总数由表达式给出：\n\
  \n```\nsizeof(book)/sizeof(struct record)\n```\n\n当在列表中找到书籍时搜索结束，函数返回书籍的序列号。当未找到书籍时，函数返回\
  \ `-1`。记住，列表中第一本书的序列号为 0。当我们对问题“你还想要其他书吗？”回答“NO”时，程序终止。\n\n请注意，我们使用函数：\n\n```\n\
  get(string)\n```\n从终端获取标题、作者等信息。这使我们能够输入带有空格的字符串，例如“C Language”。我们不能使用 `scanf` 来读取这个字符串，因为它包含两个单词。\n\
  \n由于我们使用 `get(string)` 函数将数量作为字符串读取，因此在任何表达式中使用之前，必须将其转换为整数。这是通过 `atoi()` 函数完成的。\n\
  \n![](img/Image00811.gif) ![](img/Image00812.gif) ![](img/Image00813.gif)\n\n图 11.8\
  \ 书店库存程序\n\n## 多选题\n\n为以下每个多项选择题选择正确答案：\n\n11.1 访问结构体变量成员的正确方法是哪一个？`[LO 11.3 H]`\n\
