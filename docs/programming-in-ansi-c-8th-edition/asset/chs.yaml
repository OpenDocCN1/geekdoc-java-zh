  \n`10 + 15`\n\n是一个表达式，其值为 25。\n\n当单个算术表达式（如 `a+b`）中的操作数都是整数时，该表达式被称为整数表达式，该操作被称为整数算术。整数算术始终产生整数值。最大的整数值取决于机器，如之前所述。在上面的示例中，如果\
  \ a 和 b 是整数，那么 a = 14，b = 4，结果如下：\n\na – b = 10\n\na + b = 18\n\na * b = 56\n\n\
  a / b = 3（小数部分被截断）\n\na % b = 2（余数）\n\n整数除法截断任何小数部分。模运算产生整数除法的余数。模运算符 % 不能用于浮点数据。请注意\
  \ C 没有指数运算符。旧版本的 C 不支持一元加，但 ANSI C 支持。\n\n## 整数算术 (Integer Arithmetic)\n\n在整数除法期间，如果两个操作数的符号相同，则结果向零截断。如果其中一个是负数，截断的方向取决于实现。也就是说，\n\
  \n`6/7 = 0`  `–6/–7 = 0`\n\n\n\n\n但 `-6/7` 可能是 0 或 `-1\\.`（取决于机器）\n\n同样，在取模除法期间，结果的符号始终是第一个操作数（被除数）的符号。即\n\
  \n`–14 % 3 = –2`\n\n`–14 % –3 = –2`\n\n`14 % –3 = 2`\n\n## 练习题 4.1 ![](img/Image00149.gif)\n\
  \n图 4.1 中的程序展示了使用整数算术将给定的天数转换为月份和天。\n\n![](img/Image00176.gif)\n\n**图 4.1** 整数算术的说明\n\
  \n变量 `months` 和 `days` 被声明为整数型。因此，语句\n\n`months = days/30;`\n\n会截断小数部分并将整数部分赋值给\
  \ `months`。同样，语句\n\n`days = days%30;`\n\n将除法的余数部分赋值给 `days`。因此，给定的天数转换为等数量的月份和天，并按输出所示打印结果。\n\
  \n### 实数算术\n\n仅涉及实数操作数的算术运算称为实数算术。实数操作数可以是小数计数法或指数计数法。由于浮点值会被舍入到允许的有效位数，因此最终值是正确结果的近似值。如果\
  \ `x`、`y` 和 `z` 是浮点型，我们将得到：\n\n`x = 6.0/7.0 = 0.857143`\n\n`y = 1.0/3.0 = 0.333333`\n\
  \n`z = –2.0/3.0 = –0.666667`\n\n运算符 `%` 不能用于实数操作数。\n\n### 混合模式算术\n\n当一个操作数是实数而另一个是整数时，表达式被称为混合模式算术表达式。如果任一操作数是实数类型，则只执行实数运算，结果始终是实数。因此\n\
  \n`15/10.0 = 1.5`\n\n而\n\n`15/10 = 1`\n\n关于混合运算的更多内容将在处理表达式求值时在后面讨论。\n\n### 关系运算符](#text00006.html_ch4-5a)\n\
  \n我们经常比较两个量，并根据它们的关系做出某些决策。例如，我们可以比较两个人的年龄，或者两件物品的价格等。这些比较可以在关系运算符的帮助下完成。我们已经使用过符号‘<’，意思是“小于”。像\n\
  \n`a < b` 或 `1 < 20` 这样包含关系运算符的表达式被称为关系表达式。关系表达式的值为 1 或 0。如果指定的关系为真，值为 1；如果关系为假，则值为\
  \ 0。例如\n\n`10 < 20` 是真的\n\n但\n\n`20 < 10` 是假的\n\nC 总共支持六种关系运算符。这些运算符及其含义如 4.2 所示。\n\
  \n**表 4.2** 关系运算符\n\n![](img/Image00177.gif)\n\n简单的关系表达式只包含一个关系运算符，并如下形式：\n\n![](img/Image00178.gif)\n\
  \n`ae-1` 和 `ae-2` 是算术表达式，可以是简单的常量、变量或它们的组合。下面是一些简单关系表达式及其值的示例：\n\n`4.5 <= 10` 真\n\
  \n`4.5 < –10` \n\n`–35 >= 0` \n\n`10 < 7+5` 真\n\n`a+b == c+d` 仅当 `a` 和 `b` 的值之和等于\
  \ `c` 和 `d` 的值之和时为真。\n\n当关系运算符的两侧使用算术表达式时，先求值算术表达式然后再比较结果。也就是说，算术运算符的优先级高于关系运算符。\n\
  \n关系表达式用于 `if` 和 `while` 等决策语句中，以决定运行程序的执行路径。我们已经在第 2 章中用过 `while` 语句。决策语句将在第 6\
  \ 和第 7 章详细讨论。\n\n#### 关系运算符补对\n\n在六种关系运算符中，每一个都是另一个运算符的补对。\n\n`>` 是 `<=` 的补对\n\n\
  `<` 是 `>=` 的补对\n\n`==` 是 `!=` 的补对\n\n我们可以使用这些补对来简化涉及非和小于运算符的表达式，如下所示：\n\n![](img/Image00179.gif)\n\
  \n![](img/Image00180.gif)\n\n### 逻辑运算符](#text00006.html_ch4-6a)\n\n除了关系运算符，C 还有以下三个逻辑运算符。\n\
  \n![](img/Image00181.gif)\n\n当我们需要测试多个条件并做出决策时，使用逻辑运算符 `&&` 和 `||`。示例是：\n\n`a >\
  \ b && x == 10`\n\n这种结合了两个或多个关系表达式的表达式被称为逻辑表达式或复合关系表达式。与简单关系表达式一样，根据表 4.3 所示的真值表，逻辑表达式也产生一个一或零的值。上述逻辑表达式只有在\
  \ `a > b` 为真且 `x == 10` 为真时才为真。如果其中（或两者）为假，则表达式为假。\n\n**表 4.3** 真值表\n\n![](img/Image00182.gif)\n\
  \n逻辑表达式的一些用法示例有：\n\n1. `if (age > 55 && salary < 1000)`\n2. `if (number < 0 || number\
  \ > 100)`\n\n逻辑运算符 `&&` 和 `||` 用于我们需要测试多个条件并做出决策时。示例是：\n\n`a > b && x == 10`\n\n\
  ### 赋值运算符](#text00006.html_ch4-7a)\n\n赋值运算符用于将表达式的结果赋值给变量。我们已经见过普通的运算符‘=’。此外，C 有一组简写运算符。\n\
  \n![](img/Image0184.gif)\n\n其中 `v` 是变量，`exp` 是表达式，`op` 是二元运算符。运算符 `op =` 被称为简写赋值运算符。\n\
  \n`v op = exp;`\n\n等同于\n\n`v = v op;`\n\n简写 `+=` 意味着“向 `x` 加上 `y+1`”。对于 `y = 2`，上述语句变为\n\
  \n`x += 3;`\n\n等同于\n\n`x = x + 3;`\n\n简写 `+=` 意味着“向 `x` 加上 `y+1`”。如果 `x` 的旧值为 5，表\
  \ 4.4 阐释了一些常用的简写运算符。\n\n**表 4.4** 简写赋值运算符\n\n![](img/Image00185.gif)\n\n使用简写运算符有三个优势：\n\
  \n1. 左侧的内容不需要重复，因此更容易编写。\n2. 语句更简洁，更易读。\n3. 语句效率更高。\n\n## 练习题 4.2 ![](img/Image0149.gif)\n\
  \n图 4.2 中的程序打印了一个平方序列。注意简写 `*=` 的使用。\n\n程序尝试打印从 2 开始的平方序列。语句 `a *= a;` 将 `a` 的当前值替换为其平方。当\
  \ `a` 的值等于或大于 `N (=100)` 时，`while` 终止。注意输出包含 2、4 和 16。\n\n![](img/Image0186.gif)\n\
  \n**图 4.2** 运算符 *= 的使用\n\n### 自增和自减运算符](#text00006.html_ch4-8a)\n\nC 允许两种其他语言中没有非常有用的运算符。这些是自增和自减运算符：\n\
  \n`++` 和 `--`\n\n运算符 `++` 将操作数加 1，而 `--` 减 1\\.。两者都是一元运算符，形式如下：\n\n![](img/Image0187.gif)\n\
  \n我们在 `for` 和 `while` 循环中频繁使用自增和自减语句。\n\n虽然 `++m` 和 `m++` 在独立语句中含义相同，但当它们在赋值语句右侧的表达式中使用时，行为不同。考虑以下：\n\
  \n`m = 5;`\n\n`y = ++m;`\n\n在这种情况下，`y` 和 `m` 的值都将是 6。假设我们将上述语句重写为\n\n`m = 5;`\n\n\
  `y = m++;`\n\n那么 `y` 的值将是 5，`m` 将是 6。前缀运算符先将操作数加 1，然后将结果赋值给左侧变量。相反，后置运算符先将值赋值给左侧变量，然后增加操作数。\n\
  \n下标变量中使用 `++`（或 `--`）的情况也是类似的。也就是说，语句\n\n`a[i++] = 10;`\n\n等同于\n\n\n\n\n```\na[i]\
  \ = 10;\ni = i+1;\n```\n\n递增和递减运算符可以在复合语句中使用。例如：\n\n```\nm = n++ –j+10;\n```\n\n\
  `n` 的旧值用于表达式的值。`n` 在求值后增加。某些编译器要求 `n++` 或 `++n` 的两边都要有空格。\n\n让我们来看另一个例子。考虑以下代码段：\n\
  \n```c\na = 4;\nb = a++ + a++;\n```\n\n在执行完上述代码段后，`a` 将持有值 `6`，`b` 将持有值 `8`。这是因为递增操作在加法操作求值之后才发生。加法操作两个操作数的值分别为\
  \ `4` 和 `4`，因此和为 `8` 并存储在 `b` 中。一旦加法完成，就会发生两个连续的后置递增，结果是 `a` 的最终值将是 `6`。\n\n现在让我们考虑以下代码段：\n\
  \n```c\na = 4;\nb = ++a + ++a;\n```\n\n在执行完上述代码段后，`a` 将持有值 `6`，`b` 将持有值 `12`。这是因为该段使用了前置递增运算符。在加法操作发生之前，`a`\
  \ 增加了两次，结果变为 `12`。因此，当加法最终发生时，和产生 `12` 并赋值给 `b`。\n\n### `++` 和 `--` 运算符的规则\n\n![](img/Image00188.gif)\n\
  \n- 递增和递减运算符是一元运算符，它们需要变量作为操作数。\n- 当在表达式中使用后置 `++`（或 `--`）时，先使用变量的原始值求值表达式，然后变量增加（或减少）\
  \ 1。\n- 当在表达式中使用前置 `++`（或 `--`）时，变量先增加（或减少），然后使用变量的新值求值表达式。\n- `++` 和 `--` 运算符的优先级和结合性与一元\
  \ `+` 和一元 `-` 相同。\n\n### 三元运算符\n\nC 中提供了三元运算符对 `? :` 用于构造如下形式的条件表达式\n\n![](img/Image00189.gif)\n\
  \n其中 `exp1`、`exp2` 和 `exp3` 是表达式。\n\n运算符 `? :` 的工作原理如下：首先求值 `exp1`。如果它非零（真），则求值表达式\
  \ `exp2` 并其结果变为表达式的值。如果 `exp1` 为假，则求值 `exp3`，其结果变为表达式的值。注意，只有表达式中的一个（`exp2` 或 `exp3`）会被求值。例如，考虑以下语句。\n\
  \n```c\na = 10;\nb = 15;\nx = (a > b) ? a : b ;\n```\n\n在这个例中，`x` 将赋值为 `b` 的值。可以通过以下\
  \ `if..else` 语句实现：\n\n```c\nif (a > b)\n    x = a;\nelse\n    x = b;\n```\n\n![](img/Image00190.gif)\n\
  \n### 位运算符\n\n![](img/Image00191.gif)\n\nC 语言支持一种特殊的运算符，称为位运算符，用于在位位上进行数据操作。这些运算符用于测试位，或将位向右或左左。位运算符不能应用于\
  \ `float` 或 `double`。表 4.5 列出了位运算符及其含义。它们在附录 I 中进行了详细讨论。\n\n**表 4.5** 位运算符\n\n![](img/Image00192.gif)\n\
  \n## 特殊运算符\n\nC 支持一些感兴趣的特殊运算符，如逗号运算符、`sizeof` 运算符、指针运算符（`&` 和 `*`）以及成员选择运算符（.` 和\
  \ `->`）。逗号运算符和 `sizeof` 运算符在本节中讨论，而指针运算符将在第 12 章讨论。用于选择结构成员的成员选择运算符将在第 11 和 12 章讨论。ANSI\
  \ 委员会引入了两种预处理器运算符，被称为“字符串化”和“标记粘贴”运算符（`#` 和 `##`）。它们将在第 15 章讨论。\n\n#### 逗号运算符\n\n\
  逗号运算符可以将相关的表达式连接在一起。逗号连接的表达式列表从左到右求值，最右表达式的值就是组合表达式的值。例如，语句\n\n```c\nvalue = (x\
  \ = 10, y = 5, x+y);\n```\n\n首先将值 `10` 赋值给 `x`，然后将 `5` 赋值给 `y`，最后将 `15`（即 `10 +\
  \ 5`）赋值给 `value`。由于逗号运算符的优先级在所有运算符中最低，因此括号是必要的。逗号运算符的应用包括：\n\n- 在 `for` 循环中：\n \
  \ ```c\n  for ( n = 1, m = 10, n <=m; n++, m++)\n  ```\n- 在 `while` 循环中：\n  ```c\n\
  \  while (c = getchar( ), c != ‘10’)\n  ```\n- 交换值：\n  ```c\n  t = x, x = y, y =\
  \ t;\n  ```\n\n#### `sizeof` 运算符\n\n`sizeof` 是编译时运算符，当与操作数一起时，它返回操作数占用的字节数。操作数可以是变量、常量或数据类型限定符。\n\
  \n示例：\n\n```c\nm = sizeof (sum);\nn = sizeof (long int);\nk = sizeof (235L);\n```\n\
  \n`sizeof` 是编译时运算符，当与操作数一起时，它返回操作数占用的字节数。操作数可以是变量、常量或数据类型限定符。（注：根据原文，此处重复了内容）。\n\
  \n\n\n\n\n基础评估过程包括对表达式从左到右进行“两次”扫描。在第一次扫描中，遇到高优先级的运算符（如果有）就对其进行处理。在第二次扫描中，遇到低优先级的运算符（如果有）就对其进行处理。考虑以下在图\
  \ 4.4 程序中使用的评估语句：\n\n```\nx = a – b/3 + c*2 – 1\n```\n\n当 `a = 9`，`b = 12` 且 `c\
  \ = 3` 时，语句变为：\n\n```\nx = 9 – 12/3 + 3*2 – 1\n```\n\n其评估过程如下：\n\n### 第一次扫描\n步骤\
  \ 1：`x = 9 – 4+3*2 – 1`\n步骤 2：`x = 9 – 4+6 – 1`\n\n### 第二次扫描\n步骤 3：`x = 5+6 – 1`\n\
  步骤 4：`x = 11 – 1`\n步骤 5：`x = 10`\n\n这些步骤在图 4.5 中所示。括号内的数字表示步骤编号。\n\n![](img/Image00200.gif)\n\
  \n**图 4.5** 运算层次结构图\n\n然而，通过在表达式中引入括号可以改变评估顺序。考虑如下带有括号的相同表达式：\n\n```\n9 – 12/(3+3)*(2\
  \ – 1)\n```\n\n只要使用括号，括号内的表达式就具有最高优先级。如果连续出现两个或多个组括号（如所示），则先评估最左侧括号中的表达式，最后评估最右侧的。以下是新的评估步骤：\n\
  \n### 第一次扫描\n步骤 1：`9-12/6 * (2-1)`\n步骤 2：`9-12/6 * 1`\n\n### 第二次扫描\n步骤 3：`9-2 *\
  \ 1`\n步骤 4：`9-2`\n\n### 第三次扫描\n步骤 5：`7`\n\n这一次，过程由三次从左到右的扫描组成。然而，评估步骤的数量仍为 5 （即等于算术运算符的数量）。\n\
  \n括号是可以嵌套的，在这种情况下，表达式的评估将从最内层括号向外进行。只需确保每个左括号都有匹配的右括号即可。例如：\n\n```\n9 – (12/(3+3)\
  \ * 2) – 1 = 4\n```\n\n而：\n\n```\n9 – ((12/3) + 3 * 2) – 1 = – 2\n```\n\n虽然括号允许我们改变优先级顺序，我们也可以用它们来提高程序的可读性。当有疑问时，我们始终可以添加额外的括号，以确保假设的优先级是我们所需要的。\n\
  \n### 表达式评估规则\n\n*   首先，从左到右评估带括号的子表达式。\n*   如果括号嵌套，则评估从最内层的子表达式开始。\n*   在评估子表达式时确定运算符的应用顺序时，应用优先级规则。\n\
  *   当子表达式中出现两个或多个相同优先级的运算符时，应用结合性规则。\n*   算术表达式根据优先级规则从左到右进行评估。\n*   当使用括号时，括号内的表达式具有最高优先级。\n\
  \n**例题 4.5** ![](img/Image00151.gif)\n\n为以下表达式编写一个 C 程序：`a=5<=8 && 6!=5`。\n\n![](img/Image00201.gif)\n\
  \n**图 4.6** 表达式的程序：`a = 5 < = 8 && 6! = 5`\n\n计算题\n\n当表达式包含实值时，采取必要的预防措施以防止某些计算错误是重要的。我们知道计算机对实数给出近似值，由于这种近似产生的误差可能会导致严重的问题。例如，考虑以下语句：\n\
  \n```\na = 1.0/3.0;\nb = a * 3.0;\n```\n\n我们知道 `(1.0/3.0) 3.0` 等于 `1`。但不能保证程序计算出的\
  \ `b` 的值等于 `1`。\n\n另一个问题是除以零。在大多数计算机上，任何试图以零除数的尝试都会导致程序异常终止。在某些情况下，这种除法可能会产生意义的结果。应该测试可能取零值的分母，并避免任何除以零的操作。\n\
  \n第三个问题是避免溢出或下溢错误。我们的责任是保证操作数具有正确的类型和范围，结果可能产生任何溢出或下溢。\n\n**例题 4.6** ![](img/Image00151.gif)\n\
  \n图 4.7 中程序的输出显示了浮点数计算中可能舍入误差。\n\n![](img/Image00202.gif)\n\n**图 4.7** 浮点计算中的舍入误差\n\
  \n我们知道 `n` 项 `1/n` 之和是 `1`。但由于浮点表示的误差，结果并不总是 `1`。\n\n![](img/Image00203.gif)\n\n\
  类型转换\n\nImage00204.gif)\n\n### 隐式转换\n\n当表达式包含实值时，采取必要的预防措施以防止某些计算错误是重要的。我们知道计算机对实数给出近似值，由于这种近似产生的误差可能会导致严重的问题。例如，考虑以下语句：\n\
  \n```\na = 1.0/3.0;\nb = a * 3.0;\n```\n\n我们知道 `(1.0/3.0) 3.0` 等于 `1`。但不能保证程序计算出的\
  \ `b` 的值等于 `1`。\n\n另一个问题是除以零。在大多数计算机上，任何试图以零除数的尝试都会导致程序异常终止。在某些情况下，这种除法可能会产生意义的结果。应该测试可能取零值的分母，并避免任何除以零的操作。\n\
  \n第三个问题是避免溢出或下溢错误。我们的责任是保证操作数具有正确的类型和范围，结果可能产生任何溢出或下溢。\n\n**例题 4.6** ![](img/Image00151.gif)\n\
  \n图 4.7 中程序的输出显示了浮点数计算中可能舍入误差。\n\n![](img/Image00202.gif)\n\n**图 4.7** 浮点计算中的舍入误差\n\
  \n我们知道 `n` 项 `1/n` 之和是 `1`。但由于浮点表示的误差，结果并不总是 `1`。\n\n![](img/Image00203.gif)\n\n\
  ### 隐式转换\n\nC 允许表达式中混合不同类型的常量和变量。在评估期间，C 会自动将低类型转换为高类型。这种自动转换被称为隐式转换。\n\n在赋值之前，表达式的最终结果会被转换为左侧变量的类型，然后赋值给它。典型的类型转换如图\
  \ 4.8 所示：\n\n![](img/Image00205.gif)\n\n**图 4.8** 隐式转换过程\n\n以下是评估表达式时采用的规则序列：\n\n\
  1. 如果一个操作数是 `long double`，另一个将被转换为 `long double` 结果为 `double`；\n2. 否则，如果一个操作数是 `double`，另一个将被转换为\
  \ `double` 结果为 `double`；\n3. 否则，如果一个操作数是 `float`，另一个将被转换为 `float` 结果为 `float`；\n\
  4. 否则，如果一个操作数是 `unsigned long int`，另一个将被转换为 `unsigned long int` 结果为 `unsigned long\
  \ int`；\n5. 否则，如果一个操作数是 `long int`，另一个是 `unsigned int`，那么：\n   (a) 如果 `unsigned\
  \ int` 可以转换为 `long int`，则 `unsigned int` 操作数将被转换，结果为 `long int`；\n   (b) 否则，两个操作数将被转换为\
  \ `unsigned long int` 结果为 `unsigned long int`；\n6. 否则，如果一个操作数是 `long int`，另一个将被转换为\
  \ `long int` 结果为 `long int`；\n7. 否则，如果一个操作数是 `unsigned int`，另一个将被转换为 `unsigned int`\
  \ 结果为 `unsigned int`。\n\n注意，C 在除赋值外的所有表达式中，任何隐式类型转换都是从低尺寸类型转换为高尺寸类型，如下：\n\n![](img/Image0206.gif)\n\
  \n注意某些版本的 C 会自动将所有浮点操作数转换为双精度。\n\n### 显式转换\n\n我们刚刚讨论了 C 如何自动执行类型转换。然而，在某些情况下，我们希望以不同于自动转换的方式强制进行类型转换。例如，考虑城市男女比例的计算：\n\
  \n```\nratio = female_number/male_number\n```\n\n由于 `female_number` 和 `male_number`\
  \ 在程序中声明为整数，除法结果的小数部分将丢失，`ratio` 将表示错误的数字。这个问题可以通过局部将其中一个变量转换为浮点数来解决，如下所示：\n\n```\n\
  ratio = ( float) female_number/male_number\n```\n\n\n\n运算符 `(float)` 将 `female_number`\
  \ 转换为浮点数，用于对表达式进行求值。然后，根据自动转换规则，在浮点模式下执行除法，从而保留结果的小数部分。\n\n请注意，`(float)` 运算符不会以任何方式影响变量\
  \ `female_number` 的值。同样，在程序的其他部分，`female_number` 的类型仍然是 `int`。\n\n这种局部转换的过程被称为显式转换或强制转换（casting）。强制转换的一般形式为：\n\
  \n```\n(type-name) expression\n```\n\n其中 `type-name` 是标准 C 数据类型之一。表达式可以是常量、变量或另一个表达式。表\
  \ 4.7 给出了一些强制转换的示例及其作用。\n\n### 表 4.7 强制转换的使用\n\n![](img/Image00207.gif)\n![](img/Image00208.gif)\n\
  \n强制转换可用于对给定的值进行四舍舍入处理。考虑以下语句：\n\n```c\nx = (int ) (y+0.5);\n```\n\n如果 `y` 是 `27.6`，则\
  \ `y + 0.5` 为 `28.1`，强制转换后结果变为 `28`，即赋值给 `x` 的值。当然，被强制转换的表达式本身并没有改变。\n\n**计算例题 4.7**\
  \ ![](img/Image00209.gif)\n\n[图 4.9] 显示了一个使用强制转换计算方程的程序\n\n![](img/Image00210.gif)\n\
  ![](img/Image00211.gif)\n\n**图 4.9** 强制转换的使用\n\n## 运算符优先级与结合性\n\n![](img/Image00212.gif)\n\
  \n如前所述，C 语言中的每个运算符都有一个与其相关的优先级。这种优先级用于确定包含多个运算符的表达式如何被求值。优先级有不同的层级，运算符可能属于其中一个层级。优先级较高的运算符先求值。相同优先级的运算符根据级别从“左到右”或从“右到左”求值。这被称为运算符的结合性（associativity）。表\
  \ 4.8 提供了运算符的完整列表、它们的优先级级别以及结合规则。分组按优先级递减的顺序列出。排名 1 表示最高优先级，15 表示最低优先级。列表还包含了我们尚未讨论过的运算符。\n\
  \n### 表 4.8 C 运算符摘要\n\n![](img/Image00213.gif)\n![](img/Image00214.gif)\n\n仔细注意运算符的优先级和结合性是非常重要的。考虑以下条件语句：\n\
  \n```c\nif (x == 10 + 15 && y < 10)\n```\n\n优先级规则规定，加法运算符的优先级高于逻辑运算符 (`&&`）以及关系运算符\
  \ (`==` 和 `<`）。因此，首先执行 `10` 和 `15` 相加。这等同于：\n\n```c\nif (x == 25 && y < 10)\n```\n\
  \n下一步是确定 `x` 是否等于 `25` 以及 `y` 是否小于 `10`。如果假设 `x` 的值为 `20`，`y` 的值为 `5`，那么：\n\n`x\
  \ == 25` 为假 (0)\n\n`y < 10` 为真 (1)\n\n注意由于运算符 `<` 的优先级高于 `==`，因此先测试 `y < 10`，然后测试\
  \ `x == 25`。\n\n最后我们得到：\n\n```c\nif (FALSE && TRUE)\n```\n\n由于其中一个条件为假，整个复合条件为假。\n\
  \n在 `&&` 的情况下，如果第一个操作数为 0，则保证第二个操作数不会求值；在 `||` 的情况下，如果第一个操作数非零，则第二个操作数不会求值。\n\n\
  #### 优先级与结合性规则\n\n- 优先级规则决定了不同运算符的应用顺序。\n- 结合规则决定了同一级别运算符多次出现的应用顺序。\n\n### 数学函数\n\
  \n如 `cos`、`sqrt`、`log` 等数学函数经常用于分析现实问题。大多数 C 编译器都支持这些基础数学函数。然而，某些系统拥有更全面的数学库，应该查阅参考手册以查找可用函数。表\
  \ 4.9 列出了一些标准数学函数。\n\n### 表 4.9 数学函数\n\n![](img/Image00215.gif)\n\n**注意：**\n\n1.\
  \ `x` 和 `y` 应该声明为 `double`。\n2. 在三角和双曲函数中，`x` 和 `y` 的单位是弧度。\n3. 所有函数都返回 `double`。\n\
  4. C99 增加了这些函数的 `float` 和 `long double` 版本。\n5. C99 增加了更多的数学函数。\n6. 详情请参见附录“C99\
  \ 特性”。\n\n如第 2 章早期指出的，要在程序中使用任何这些函数，应该在程序开头包含该行：\n\n```c\n#include <math.h>\n```\n\
  \n## 核心概念\n\n- **运算符 (Operator)**：用于对数据和变量执行数学或逻辑操作的符号。[LO 4.1]\n- **表达式 (Expression)**：操作数和运算符的组合，最终还原为一个单一值。[LO\
  \ 4.1]\n- **整数表达式 (Integer expression)**：涉及整数操作数的算术表达式。[LO 4.1]\n- **实数算术 (Real\
  \ arithmetic)**：涉及实数操作数。[LO 4.1]\n- **关系运算符 (Relational operators)**：用于比较两个操作数，结果为真（1）或假（0）。[LO\
  \ 4.1]\n- **逻辑运算符 (Logical operators)**：用于组合多个表达式。[LO 4.1]\n- **赋值运算符 (Assignment\
  \ operators)**：用于将表达式的值赋予变量。[LO 4.1]\n- **位运算符 (Bitwise operators)**：用于在位级别处理数据的特殊运算符。[LO\
  \ 4.2]\n- **算术运算 (Arithmetic operation)**：指运算符优先级的求值。[LO 4.3]\n\n## 始终记住\n\n- 小心使用递增递减运算符。在使用前理解后置和前置的区别。[LO\
  \ 4.1]\n- 不要对标识符使用递增递减运算符。[LO 4.1]\n- 对非整数应用模运算 `%` 是非法的。[LO 4.1]\n- 表达式的结果将转换为赋值左侧的类型。赋值时注意转换过程中的信息丢失。[LO\
  \ 4.1]\n- `==`、`!=`、`<=` 和 `>=` 运算符符号之间出现空格是错误的。[LO 4.1]\n- `!=`、`<=` 和 `>=` 运算符符号反转是错误的。（原文可能有误）\n\
  - 在二元运算符两侧使用空格以提高代码可读性。[LO 4.1]\n- 不要对浮点变量使用递增递减运算符。[LO 4.1]\n- 不要混淆相等运算符 `==` 和赋值运算符\
  \ `=`。[LO 4.1]\n- 在未知数组和结构体大小的情况下使用 `sizeof` 运算符确定长度。[LO 4.2]\n- 注意某些表达式产生的副作用。[LO\
  \ 4.3]\n- 避免任何尝试除以零的操作。这通常是未定义的。它将导致致命错误或错误的结果。[LO 4.3]\n- 不要忘记语句末尾有分号。[LO 4.3]\n\
  - 在变量赋值之前，不要在表达式中使用它。[LO 4.3]\n- 整数除法总是截断结果的小数部分。请谨慎使用。必要时使用强制转换。[LO 4.4]\n- 在任何你认为有助于明确求值顺序的地方添加括号。[LO\
  \ 4.5]\n- 清楚地理解表达式中运算符的优先级。必要时使用括号。[LO 4.5]\n- 当在表达式中使用多个相同优先级的运算符时，应用结合性。理解哪些运算符从右到左结合，哪些从左到右结合。[LO\
  \ 4.5]\n\n### 简案例\n\n**1. 销售员工资 [LO 4.3 M]**\n\n一家计算机制造公司对销售人员有以下每月薪酬政策：\n\n- 最低基本工资：1500.00\n\
