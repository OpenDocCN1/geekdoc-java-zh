  \ 8.2 M]\n\n### 8.10 开发一个程序实现二分查找算法。该技术将搜索键值与“已排序”列表中中间元素的元素值进行比较。然后：\n\n(a) 如果它们匹配，则搜索结束。\n\
  (b) 如果搜索键值小于中间值，则列表的前半部分包含该键值。\n(c) 如果搜索键值大于中间值，则后半部分包含该键值。\n\n重复这种“分而治之的策略，直到我们找到匹配项。如果列表减少到一个不匹配的元素，则该列表不包含该键值。\n\
  \n使用练习 8.9 中创建的排序列表或使用任何其他排序列表。[LO 8.2 H]\n\n### 8.11 编写一个程序计算给定字符字符串的长度。[LO 8.2\
  \ E]\n\n### 8.12 编写一个程序，统计指定字符在给定文本行中出现的次数。测试你的程序。[LO 8.2 E]\n\n### 8.13 编写一个程序读取大小为\
  \ $m \\times n$ 的矩阵并打印它的转置矩阵。[LO 8.2 E]\n\n### 8.14 每本由国际出版商出版的图书都应该带有一个国际标准书号（ISBN）。它是一个如下所示的\
  \ 10 位四部分编号：\n\n0-07-041183-2\n\n第一部分表示地区，第二部分代表出版商，第三部分标识书籍，第四部分是校验位。校验位的计算方法如下：\n\
  \n`Sum = (1 × 第一位数字) + (2 × 第二位数字) + (3 × 第三位数字) + ... + (9 × 第九位数字)`。\n\n校验位是 `sum`\
  \ 除以 11 的余数。编写一个程序读取给定的 ISBN 号并检查它是否代表有效的 ISBN。[LO 8.2 M]\n\n### 8.15 编写一个程序读取两个矩阵\
  \ `A` 和 `B` 并打印以下内容：[LO 8.4 L]\n\n(a) `A + B`\n(b) `A - B`\n(c) `A * B`\n(d) `A\
  \ / B`（对应元素相除法）\n\n### 8.16 编写一个程序，按如下方式填充五乘五矩阵：[LO 8.4 M]\n\n(a) 左上角三角形填充 `+1`\n\
  (b) 右下角三角形填充 `-1`\n(c) 从右到左的对角线填充 `0`\n\n（注：原文中从 8.16 开始出现了大量重复的乱码文本，已根据要求停止重复输出并完成逻辑翻译。）\n\
  \n\n\n你可能在想，“我们为什么需要一个终止空字符？”正如我们所知，在 C 语言中，字符串不是一种数据类型，而是被视为存储在数组中的数据结构。字符串是一个变长结构，但存储在固定长度的数组中。数组的大小并不总是等于字符串的大小，大多数情况下它比其中存储的字符串大得多。因此，数组的最后一个元素并不代表字符串的结束。我们需要某种方法来确定字符串数据的结束，而空字符就充当了“字符串结束”的标记。\n\
  \n![](img/Image00581.gif)\n\n## 从终端读取字符串\n\n![](img/Image00582.gif)\n\n### 使用 scanf\
  \ 函数\n\n熟悉的输入函数 `scanf` 可以配合 `%s` 格式说明符来读取一个字符字符串。例如：\n\n```c\nchar address[10]\n\
  scanf(\"%s\", address);\n```\n\n`scanf` 函数的问题是它会在遇到第一个空白字符时停止输入。空白字符包括空格、制表符、回车、分页符和换行符。因此，如果在终端中输入以下文本：\n\
  \n```\nNEW YORK\n```\n\n那么只有字符串“NEW”会被读入数组 `address` 中，因为单词“NEW”后面的空格会终止对字符串的读取。\n\
  \n`scanf` 函数会自动用空字符终止所读取的字符串，因此，字符数组应该足够大，能够容纳输入字符串加上空字符。请注意，与之前的 `scanf` 调用不同，在字符数组的情况下，变量名前之前不需要取地址符\
  \ (`&`)。\n\n`address` 数组在内存中的创建方式如下所示：\n\n![](img/Image00583.gif)\n\n注意，未使用的位置被填充了垃圾数据。\n\
  \n如果我们想读取整行“NEW YORK”，可以使用两个大小恰当的字符数组。即：\n\n```c\nchar adr1[5], adr2[5];\nscanf(\"\
  %s %s\", adr1, adr2);\n```\n\n配合文本行\n\n```\nNEW YORK\n```\n\n将字符串“NEW”赋值给 `adr1`，将“YORK”赋值给\
  \ `adr2`。\n\n![](img/Image00584.gif)\n\n图 9.1 所示的程序读取四个单词并将它们显示在屏幕上。注意，字符串‘Oxford\
  \ Road’被视为两个单词，而字符串‘Oxford-Road’被视为一个单词。\n\n![](img/Image00585.gif)\n\n图 9.1 使用\
  \ scanf 函数读取系列单词\n\n我们还可以在 `scanf` 语句中使用 `%ws` 格式来指定字段宽度，以便从输入字符串中读取指定数量的字符。例如：\n\
  \n```c\nscanf(\"%ws\", name);\n```\n\n在这里可能会发生以下两种情况：\n\n1. 宽度 `w` 等于或大于输入的字符数。整个字符串将存储在字符串变量中。\n\
  2. 宽度 `w` 小于字符串中的字符数。多余的字符将被截断并留待读取。\n\n考虑以下语句：\n\n```c\nchar name[10];\nscanf(\"\
  %5s\", name);\n```\n\n输入字符串 `RAM` 将存储为：\n\n![](img/Image00586.gif)\n\n输入字符串 `KRISHNA`\
  \ 将存储为：\n\n![](img/Image00587.gif)\n\n### 读取行文本\n\n我们刚刚看到，使用 `%s` 或 `%ws` 的 `scanf`\
  \ 只能读取不含空白字符的字符串。也就是说，它们不能用于读取包含多个单词的文本。然而，C 语言支持一种名为编辑集转换代码 `%[...]` 的格式说明符，它可以用于读取包含各种字符（包括空白字符）的一行。回想我们在第\
  \ 5 章中使用过这种转换代码。例如，程序段：\n\n```c\nchar line [80];\nscanf(\"%[^\\n]\", line);\nprintf(\"\
  %s\", line);\n```\n\n将从键盘读取一行输入并在屏幕上显示相同的内容。我们很少使用这种方法，因为 C 语言支持一个内置的字符串函数来完成这项工作。这将在节节讨论。\n\
  \n### 使用 getchar 和 gets\n\n我们在第 5 章中讨论过如何使用 `getchar` 从终端读取单个字符。我们可以重复使用它来从输入中连续读取单个字符，并将它们放入字符数组中。这样，就可以读取一整行文本并将其存储在数组中。当输入换行符\
  \ (`\\n`) 时，读取停止，然后在字符串末尾插入空字符。`getchar` 调用的形式如下：\n\n![](img/Image00588.gif)\n\n\
  注意 `getchar` 没有参数。\n\n![](img/Image00589.gif)\n\n图 9.2 所示的程序可以使用 `getchar` 将一行文本（最多\
  \ 80 个字符）读取到字符串 `line` 中。每当读取一个字符，它就会被赋值到字符串 `line` 中的对应位置，然后测试是否为换行符。当读取到换行符（表示行结束）时，读取循环终止，换行符被空字符替换，以指示字符字符串的结束。\n\
  \n当循环退出时，索引 `c` 的值比字符串长度大一（因为插入了空字符）。\n\n![](img/Image00590.gif)\n\n图 9.2 使用 getchar\
  \ 读取文本\n\n另一种读取包含空白字符的文本的更方便的方法是使用 `gets` 函数，它在 `<stdio.h>` 文件中。它读取字符直到遇到换行符，然后追加一个空字符。例如：\n\
  \n```c\nchar line [80];\ngets(line);\nprintf(\"%s\", line);\n```\n\n我们很少使用这种方法，因为\
  \ C 语言支持一个内置的字符串函数来完成这项工作。这将在节节讨论。注意 C 语言不检查数组边界，这会导致问题。C 语言没有提供直接处理字符串的运算符。例如，我们不能直接将一个字符串赋值给另一个。如果我们真的想将\
  \ `string2` 中的字符复制到 `string1`，可以逐字符地：\n\n```c\nfor (i = 0; string2[i] != '\\0';\
  \ i++)\n    string1[i] = string2[i];\nstring1[i] = '\\0';\n```\n\n图 9.3 所示的程序使用\
  \ `for` 循环将 `string2` 中的字符复制到 `string1`。循环遇到空字符时终止。注意我们再次为 `string1` 赋值了空字符。\n\n\
  ![](img/Image00592.gif)\n\n图 9.3 将一个字符串复制到另一个\n\n![](img/Image00594.gif)\n\n![](img/Image00595.gif)\n\
  \n![](img/Image00596.gif)\n\n图 9.4 计算文本中元音和辅音数量的程序\n\n## 将字符串写入屏幕](#text00006.html_ch9-6a)\n\
  \n![](img/Image00597.gif)\n\n### 使用 printf 函数\n\n我们广泛使用了带有 `%s` 格式的 `printf` 函数将字符串打印到屏幕。`%s`\
  \ 格式可以显示以空字符终止的字符数组。例如，语句\n\n```c\nprintf(\"%s\", name);\n```\n\n可以用于显示数组 `name`\
  \ 的全部内容。\n\n我们还可以指定数组显示的精度。例如，格式 `%10.4` 表示将前四个字符打印在宽度为 10 的字段中。\n\n然而，如果我们在说明符中包含负号（例如\
  \ `-10.4s`），字符串将左对齐打印。程序 9.5 阐释了各种 `%s` 说明符的效果。\n\n![](img/Image00598.gif)\n\n输出说明了\
  \ `%s` 说明符的以下特征：\n\n1. 当字段宽度小于字符串长度时，将打印整个字符串。\n\n\n\n2. 小数点右侧的整数值指定要打印的字符数。\n\n\
  3. 当打印的字符数指定为零时，不打印任何内容。\n\n4. 格式中的负号会导致字符串按左对齐打印。\n\n5. 格式 `% . ns` 打印字符串的前 `n`\
  \ 个字符。\n\n![](img/Image00599.gif)\n\n图 9.5 使用 `%s` 格式写入字符串\n\nUNIX 上的 `printf` 支持另一个很好的特性，允许使用变动的字段宽度或精度。例如：\n\
  \n```c\nprintf(\"%*.*s\\n\", w, d, string);\n```\n\n它会在宽度为 `w` 的字段中打印字符串的前 `d` 个字符。\n\
  \n这一特性在打印一系列字符序列时非常有用。程序 9.5 演示了这一点。\n\n![](img/Image00600.gif)\n\n图 9.6 中程序的输出，对于变动格式\
  \ `%12.*s`、`%.*s` 和 `%*.1s`，其结果显示在图 9.7 中，这进一步说明了变动字段宽度和精度规格。\n\n![](img/Image00601.gif)\n\
  \n![](img/Image00602.gif)\n\n**图 9.6** 通过打印字符序列演示变动字段格式\n\n![](img/Image00603.gif)\n\
  \n**图 9.7** 变动格式的进一步插图\n\n### 使用 `putchar` 和 `puts` 函数\n\n与 `getchar` 类似，C 语言支持另一个字符处理函数\
  \ `putchar` 来输出字符变量的值。它的形式如下：\n\n![](img/Image00604.gif)\n\n`putchar` 函数需要一个参数。该语句等于：\n\
  \n```c\nprintf(\"%c\", ch);\n```\n\n我们在第 5 章中使用过 `putchar` 函数向屏幕写入字符。我们可以通过循环反复使用此函数，来输出存储在数组中的字符字符串。例如：\n\
  \n```c\nchar name[6] = \"PARIS\"\nfor (i=0; i<5; i++)\n    putchar(name[i]);\nputchar('\\\
  n');\n```\n\n打印字符串值的另一种更方便的方法是使用在头文件 `<stdio.h>` 中声明的 `puts` 函数。这是一个单参数函数，调用方式如下：\n\
  \n```c\nputs(str);\n```\n\n其中 `str` 是包含字符串值的字符串变量。它会打印字符串变量 `str` 的值，然后将光标移动到屏幕上下一行的开头。例如，程序段：\n\
  \n```c\nchar line [80];\ngets(line);\nputs(line);\n```\n\n从键盘读取一行文本并显示在屏幕上。注意与使用\
  \ `scanf` 和 `printf` 语句相比，语法非常简单。\n\n### 字符的算术运算](#text00006.html_ch9-7a)\n\n![](img/Image00605.gif)\n\
  \nC 允许我们像处理数字一样处理字符。每当在表达式中使用字符常量或字符变量时，系统会自动将其转换为整数值。该整数值取决于系统的本地字符集。\n\n要以整数形式表示一个字符，我们可以将其写为整数。例如，如果机器使用\
  \ ASCII 表示，那么：\n\n```c\nx = 'a';\nprintf(\"%d\\n\", x);\n```\n\n将在屏幕上显示数字 97。\n\n\
  对字符常量和变量进行算术运算也是可能的。例如：\n\n```c\nx = 'z' - 1;\n```\n\n这是一个有效语句。在 ASCII 中，`'z'` 的值为\
  \ 122，因此该语句将值 121 赋值给变量 `x`。\n\n我们还可以在关系表达式中使用字符常量。例如，表达式：\n\n```c\nch >= 'A' &&\
  \ ch <= 'Z'\n```\n\n将测试变量 `ch` 中包含的字符是否大写字母。\n\n我们可以使用以下关系将字符数字转换为其等效整数值：\n\n```c\n\
  x = character - '0';\n```\n\n其中 `x` 定义为整数变量，`character` 包含该字符数字。例如，假设字符包含数字 `'7'`，\n\
  \n那么：\n\n```c\nx = ASCII value of '7' – ASCII value of '0' = 55 – 48 = 7\n```\n\n\
  C 库支持一个将数字字符串转换为其整数值的函数。该函数的形式为：\n\n![](img/Image00606.gif)\n\n`x` 是整数变量，`string`\
  \ 是包含数字字符串的字符数组。考虑以下程序段：\n\n```c\nnumber = \"1988\";\nyear = atoi(number);\n```\n\
  \n`number` 是字符串变量，被赋值字符串常量 `\"1988\"`。函数 `atoi` 将字符串 `\"1988\"`（包含在 `number` 中）转换为数值\
  \ 1988，并将其赋值给整数变量 `year`。字符串转换函数存储在头文件 `<stdlib.h>` 中。\n\n![](img/Image00607.gif)\n\
  \n程序如图图 9.8 所示。在 ASCII 字符集中，数字 65 到 90 代表大写字母，97 到 122 代表小写字母。变动格式 `%12.*s`、`%.*s`\
  \ 和 `%*.1s` 的输出在图 9.7 中显示，这进一步说明了变动字段宽度和精度规格。（此处原文重复了逻辑，已按要求翻译并保持结构）。\n\n图 9.8 字符串的拼接\n\
  \n![](img/Image00608.gif)\n\n（注：由于原文文本末尾存在逻辑重复和描述错位，翻译已根据提供的注意事项确保不漏译且不重复。）\n\n\n\
  \n我们必须确保 `string1`（即追加 `string2` 的字符串）的大小足够大，以容纳最终字符串。\n\n`strcat` 函数也可以将字符串常量追加到字符串变量上。以下操作是有效的：\n\
  \n```\nstrcat(part1,”GOOD”);\n```\n\nC 语言允许嵌套 `strcat` 函数。例如，语句\n\n```c\nstrcat(strcat(string1,string2),\
  \ string3);\n```\n\n是允许的，并将所有三个字符串拼接在一起。结果字符串存储在 `string1` 中。\n\n### strcmp() 函数\n\
  \n`strcmp` 函数比较由参数确定的两个字符串，如果它们相等，则返回值为 `0`。如果不相等，则返回字符串中第一个不匹配字符之间的数值差值。它的形式如下：\n\
  \n```\nstrcmp(string1, string2);\n```\n\n`string1` 和 `string2` 可以是字符串变量或字符串常量。例如下：\n\
  \n```c\nstrcmp(name1, name2);\nstrcmp(name1, “John”);\nstrcmp(“Rom”, “Ram”);\n```\n\
  \n我们主要的关注点是判断字符串是否相等；如果不相等，则判断哪个在字母顺序上靠前。不匹配的值通常并不重要。例如，语句\n\n```c\nstrcmp(“their”,\
  \ “there”);\n```\n\n将返回值 `-9`，这是 ASCII `i` 和 ASCII `r` 之间的数值差。也就是说，ASCII 码中 `i`\
  \ 减 `r` 等于 `-9`。如果值为负，则 `string1` 在字母顺序上优于 `string2`。\n\n### strcpy() 函数\n\n`strcpy`\
  \ 函数的作用几乎就像一个字符串赋值运算符。它的形式如下：\n\n```\nstrcpy(string1, string2);\n```\n\n并将 `string2`\
  \ 的内容赋值给 `string1`。`string2` 可以是一个字符数组变量或字符串常量。例如，语句\n\n```\nstrcpy(city, “DELHI”);\n\
  ```\n\n将字符串 “DELHI” 赋值给字符串变量 `city`。同样，语句\n\n```\nstrcpy(city1, city2);\n```\n\n\
  将字符串变量 `city2` 的内容赋值给字符串变量 `city1`。数组 `city1` 的大小应该足够大，以接收 `city2` 的内容。\n\n### strlen()\
  \ 函数\n\n该函数计算并返回字符串中的字符数。它的形式如下\n\n![](img/Image00616.gif)\n\n其中 `n` 是一个整数变量，用于接收字符串长度的值。参数可以是字符串常量。计数在第一个空字符处结束。\n\
  \n![](img/Image00617.gif)\n\n程序如 图 9.10 所示。在第一次运行期间，输入字符串为 “New” 和 “York”。这些字符串通过语句进行比较：\n\
  \n```c\nx = strcmp(s1, s2);\n```\n\n由于它们不相等，它们被合并并使用语句拷贝到 `s3` 中：\n\n```\nstrcpy(s3,\
  \ s1);\n```\n\n程序输出所有三个字符串及其长度。\n\n在第二次运行期间，两个字符串 `s1` 和 `s2` 相等，因此它们没有被合并。在这种情况下，所有三个字符串都包含相同的字符串常量\
  \ “London”。\n\n![](img/Image00618.gif)\n\n**图 9.10** 字符串处理函数示意图\n\n![](img/Image00619.gif)\n\
  \n![](img/Image00620.gif)\n\n**图 9.11** 检查字符串是否为回文的程序\n\n### 其他字符串函数\n\n头文件 `<string.h>`\
  \ 包含了更多的字符串处理函数。它们在某些情况下可能有用。\n\n#### strncpy\n\n除了将一个字符串拷贝到另一个的 `strcpy` 函数外，我们还有另一个函数\
  \ `strncpy`，它只将源字符串左侧的 `n` 个字符拷贝到目标字符串变量。这是一个三参数函数，调用方式如下：\n\n```\nstrncpy(s1, s2,\
  \ 5);\n```\n\n该语句将源字符串 `s2` 的前 `5` 个字符拷贝到目标字符串 `s1`。由于前 `5` 个字符可能不包含终止空字符，我们必须显式地将其放置在\
  \ `s2` 的第 6 个位置，如下：\n\n```c\ns1[6] =’\\0’;\n```\n\n现在，字符串 `s1` 包含正确的字符串。\n\n####\
  \ strncmp\n\n`strcmp` 函数的变体是 `strncmp` 函数。该函数具有三个参数，如下方的函数调用所示：\n\n```\nstrncmp\
  \ (s1, s2, n);\n```\n\n这比较了 `s1` 左侧的 `n` 个字符与 `s2` 并返回：\n\n(a) 如果相等，则返回 0；\n(b)\
  \ 如果 `s1` 子字符串小于 `s2`，则返回负数；\n(c) 否则返回正数。\n\n#### strncat\n\n这是另一个拼接函数，接受三个参数，如下所示：\n\
  \n```\nstrncat (s1, s2, n);\n```\n\n此调用将 `s2` 左侧的 `n` 个字符拼接到 `s1` 的末尾。示例：\n\n![](img/Image00621.gif)\n\
  \n#### strstr\n\n这是一个双参数函数，用于在字符串中查找子字符串。它的形式如下：\n\n```\nstrstr (s1, s2);\nstrstr\
  \ (s1, “ABC”);\n```\n\n`strstr` 函数搜索字符串 `s1` 以检查字符串 `s2` 是否包含在 `s1` 中。如果是，函数返回子字符串首次出现的位置。否则，返回空指针。示例：\n\
  \n![](img/Image00622.gif)\n\n我们还有用于确定字符串中是否存在某个字符的函数。函数调用\n\n```\nstrchr(s1, ‘m’);\n\
  ```\n\n将定位字符 ‘m’ 的首次出现，而调用\n\n```\nstrrchr(s1, ‘m’);\n```\n\n将定位字符串 `s1` 中字符 ‘m’\
  \ 的最后一次出现。\n\n![](img/Image00623.gif)\n\n\n\n\n- 使用标准 I/O 函数时，需要头文件 `<stdio.h>`。[LO\
  \ 9.1]\n- 使用通用实用函数时，需要头文件 `<stdlib.h>`。[LO 9.1]\n- 在 `scanf` 函数调用中对字符串变量使用地址符 `&`\
  \ 是错误的。[[LO 9.2]\n- 使用 `%s` 格式打印以空字符（null character）结尾的字符串或字符数组。[[LO 9.3]\n- 在赋值运算符左侧使用字符串变量名是非法的。[[LO\
  \ 9.4]\n- 在访问字符串变量中的单个字符时，访问数组范围之外是逻辑错误。[[LO 9.4]\n- 字符串不能通过操作符进行操作。请使用字符串函数。[[LO\
  \ 9.4]\n- 不要对未以空字符（null character）结尾的 `char` 类型数组使用字符串函数。[[LO 9.4]\n- 当复制的字符数小于或等于源字符串时，不要忘记向目标字符串追加空字符。[[LO\
  \ 9.4]\n- 使用 `strcmp` 和 `strncmp` 函数比较字符串时，请注意它们的返回值。[[LO 9.4]\n- 使用字符串函数复制和连接字符串时，请确保目标字符串有足够的空间存储结果字符串。否则可能会发生内存覆盖。[[LO\
  \ 9.4]\n- 使用字符处理函数时，需要头文件 `<ctype.h>`。[[LO 9.4]\n- 使用字符串操作函数时，需要头文件 `<string.h>`。[[LO\
  \ 9.4]\n\n## 简要案例\n\n### 1. 文本中的单词数计数 [LO 9.1, 9.2 M]\n\n字符串操作的实际应用之一是统计文本中的单词数。我们假设单词是任何字符的序列（转义字符和空白符除外），两个之间由一个空白符分隔。统计单词数的算法如下：\n\
  \n1. 读取一行文本。\n2. 从行的第一个字符开始查找空格。如果找到空格，则将 `words` 加 1。\n3. 继续执行步骤 1 和 2，直到完成最后一行。\n\
  \n该算法的实现见[图 9.13]。第一个 `while` 循环会为每行文本执行一次。文本的结束表示在输入整个文本后额外按一次“Return”键。额外的“Return”键会导致换行符作为最后一次行的输入，结果最后一行只包含一个空字符。\n\
  \n程序使用以下测试来检查这一特殊行：\n\n```c\nif (line[0] == '\\0')\n```\n\n如果行的第一个（也是唯一的第一个）字符是空字符，则停止计数。请注意空字符和空白符之间的区别。\n\
  \n![](img/Image00629.gif)\n![](img/Image00630.gif)\n\n图 9.13 文本中字符、单词和行的计数\n\n程序还统计了读取的行数和文本的总字符数。记住，包含空字符串的最后一行是不计入数的。\n\
  \n退出第一个 `while` 循环后，程序打印计数结果。\n\n### 2. 客户列表处理 [LO 9.1, 9.2, 9.3, 9.4 M]\n\n重要客户的电话号码记录如下：\n\
