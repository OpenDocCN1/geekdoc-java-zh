  ### 13.1 `printf` 和 `cprintf` 函数有什么区别？[LO 13.2]\n\n### 13.2 `getc`、`getw` 和 `fscanf`\
  \ 函数有什么区别？[LO 13.2]\n\n### 13.3 `ftell` 函数的作用是什么？[LO 13.4]\n\n### 13.4 `fseek` 函数的作用是什么？[LO\
  \ 13.4]\n\n### 13.5 `printf` 和 `sprintf` 函数有什么区别？[LO 13.4]\n\n\n\n\n\n动态数据结构为运行时添加、删除或重新排列数据项提供了灵活性。动态内存管理技术允许我们在运行时分配额外的内存空间或释放不需要的空间，从而优化了存储空间的使用。本章将讨论链表的概念，它是动态数据结构的基本类型之一。在学习链表之前，我们先简要介绍\
  \ C 语言中可用的动态存储管理函数。这些函数在处理链表时会被广泛使用。\n\n## 动态内存分配\n\n![](img/Image00973.gif)\n\n\
  C 语言要求在编译时指定数组的元素个数。但我们可能并不总是做到。我们对大小的初始判断如果是错误的，可能会导致程序失败或内存空间浪费。\n\n![](img/Image00974.gif)\n\
  \n许多语言允许程序员在运行时指定数组的大小。这些语言能够在执行期间计算并分配程序中变量所需的内存空间。在运行时分配内存的过程被称为动态内存分配。虽然 C 语言本身不具备这种功能，但有四个被称为“内存管理函数”的库例程可用于在程序执行期间分配和释放内存。它们列在表\
  \ 14.1 中。这些函数帮助我们构建能够智能利用可用内存的复杂应用程序。\n\n### 表 14.1 内存分配函数\n\n| 函数 | 任务 |\n| :---\
  \ | :--- |\n| `malloc` | 分配请求的字节大小并返回指向分配空间第一个字节的指针。 |\n| `calloc` | 为元素数组分配空间，将其初始化为零，然后返回指向内存的指针。\
  \ |\n| `free` | 释放之前分配的空间。 |\n| `realloc` | 修改之前分配的空间 own。 |\n\n## 内存分配过程\n\n在讨论这些函数之前，让我们看看与\
  \ C 程序相关的内存分配过程。图 14.1 显示了 C 程序在内存中存储的概念性视图。\n\n![](img/Image00975.gif)\n\n图 14.1\
  \ C 程序的存储\n\n程序指令以及全局和静态变量存储在一个被称为永久存储区域的区域，而局部变量存储在另一个称为栈的区域。位于这两个区域之间的内存空间可以在程序执行期间用于动态分配。这个空闲内存区域被称为堆（heap）。由于函数和块中局部变量的创建和销毁，堆的大小在程序执行时不断变化。因此，在动态分配过程中可能会遇到内存“溢出”。在这种情况下，上述内存分配函数（当它们无法找到足够的请求内存时）将返回一个\
  \ `NULL` 指针。\n\n## 分配内存块：malloc\n\n![](img/Image00976.gif)\n\n可以使用 `malloc` 函数分配一块内存。`malloc`\
  \ 函数预留一个指定大小的内存块并返回一个 `void` 类型的指针。这意味着我们可以将其赋值给任何类型的指针。它的形式如下：\n\n![](img/Image00977.gif)\n\
  \n`ptr` 是一个类型转换类型的指针。`malloc` 返回一个指向大小为 `byte-size` 内存区域的（经过类型转换的）指针。\n\n示例：\n\n\
  ```c\nx = (int *) malloc (100 *sizeof(int));\n```\n\n在该语句成功执行后，将预留一个等于“100 倍 int\
  \ 大小”字节的内存空间，并将分配内存的第一个字节的地址赋予 `int` 类型的指针 `x`。\n\n同样，语句\n\n```c\ncptr = (char*)\
  \ malloc(10);\n```\n\n为 `char` 类型的指针 `cptr` 分配了 10 字节的空间。如图所示：\n\n![](img/Image00978.gif)\n\
  \n注意，动态分配的存储空间没有名称，因此只能通过指针访问其内容。\n\n我们还可以使用 `malloc` 为结构体等复杂数据类型分配空间。示例：\n\n```c\n\
  st_var = (struct store *)malloc(sizeof(struct store));\n```\n\n其中，`st_var` 是一个 `struct\
  \ store` 类型的指针。\n\n记住，`malloc` 分配的是一块连续的字节块。如果堆中的空间不足以满足请求，分配可能会失败。如果失败，它将返回 `NULL`。因此，在使用内存指针之前，我们应该检查分配是否成功。这在图\
  \ 14.2 的程序中得到了说明。\n\n![](img/Image00979.gif)\n\n图 14.2 给出了程序。它测试所需大小内存空间的可用性。如果可用，则分配所需的空间并显示分配空间第一个字节的地址。该程序还说明了如何使用指针变量来存储和访问表值。\n\
  \n![](img/Image00980.gif) ![](img/Image00981.gif)\n\n图 14.2 使用 malloc 进行内存分配\n\n\
  ## 分配多个内存块：calloc\n\n`calloc` 是另一个内存分配函数，通常用于运行时请求内存空间以存储派生数据类型，如数组和结构体。虽然 `malloc`\
  \ 分配单个存储块，但 `calloc` 分配多个等大小相同的存储块，然后将所有字节置零。`calloc` 的通用形式如下：\n\n![](img/Image00982.gif)\n\
  \n上述语句为 `n` 个块分配连续空间，每个块的大小为 `elem-size`。所有字节被初始化为零，并返回指向分配区域第一个字节的指针。如果没有足够的空间，则返回\
  \ `NULL` 指针。\n\n以下程序段为变量分配空间：\n\n![](img/Image00983.gif)\n\n`record` 是 `struct`\
  \ 类型，拥有三个成员：`name`、`age` 和 `id_num`。`calloc` 为 30 个记录分配内存。在使用 `st_ptr` 之前，我们必须确保内存已分配。可以如下操作：\n\
  \n![](img/Image00984.gif)\n\n![](img/Image00985.gif)\n\n![](img/Image00986.gif)\
  \ ![](img/Image00987.gif)\n\n图 14.3 使用 calloc 进行内存分配\n\n## 释放使用的空间：free\n\n![](img/Image00988.gif)\n\
  \n变量的编译时存储根据其存储类型由系统分配和释放。对于动态分配，释放空间是我们的责任。当存储有限时，释放存储空间变得非常重要。\n\n![](img/Image00989.gif)\n\
  \n当我们不再需要在内存块中的数据且不打算将该块用于其他信息时，可以使用 `free` 函数释放该内存块以后以后：\n\n```c\nfree (ptr);\n\
  ```\n\n`ptr` 是指向由 `malloc` 或 `calloc` 创建的内存块的指针。调用无效指针可能会产生问题并导致系统崩溃。我们需要记住两点：\n\
  \n1. 被释放的不是指针，而是它指向的内容。\n2. 对于通过 `calloc` 分配的内存数组，只需要释放一次指针。尝试释放元素是错误的。\n\n`free`\
  \ 函数的使用已在练习题 14.3 中说明。\n\n\n\n\n## 分配\n\n该函数为指针变量 `ptr` 分配大小为 `newsize` 的新内存空间，并返回指向新内存块第一个字节的指针。`newsize`\
  \ 可能大于或小于原有大小。请记住，新内存块可能也可能无法与旧内存块从相同的位置开始。如果无法在同一区域内找到额外空间，它将在完全新的区域创建相同的空间，并将旧块的内容移动到新块中。该函数保证旧数据将保持完好无。\n\
  \n如果该函数未能成功找到额外空间，它将返回 `NULL` 指针并释放（丢失）原始块。这意味着在继续执行之前，有必要测试操作是否成功。这在习题 14.3 的程序中得到了体现。\n\
  \n![](img/Image00990.gif)\n\n程序见图 14.4。输出说明了获取的原始缓冲区大小被修改，以包含一个更大的字符串。请注意，即使在修改了原始大小后，缓冲区的原始内容仍然保持不变。\n\
  \n![](img/Image00991.gif) ![](img/Image00992.gif)\n\n图 14.4 内存空间的重新分配与释放\n\n## 自引用结构\n\
  \n自引用结构是指其中至少有一个成员是指指向自身相同类型的另一个结构的指针。这种“自引用”的含义体现在它引用了另一个与自身类型相同的结构。自引用结构的典型声明如下：\n\
  \n![](img/Image00993.gif)\n\n名为 `self_type_pointer` 的指针其类型与结构本身相同，这使其成为一个自引用结构。考虑下面的程序，它演示了自引用结构的使用：\n\
  \n![](img/Image00994.gif)\n\n假设第一个结构从地址 1000 开始分配了空间，而第二个结构从地址 2000 开始分配了空间。\n\n\
  当运行上述程序时，输出如下：\n\n```\nFirst number = 25\nFirst number = 25\nSecond number = 35\n\
  Second number = 35\nAddress of first = 1000\nAddress of first = 1000\nAddress of\
  \ second = 2000\nAddress of second = 2000\n```\n\n![](img/Image00995.gif)\n\n由于\
  \ `first.other` 和 `second.other` 都是指针成员，请标记箭头运算符 (`->`) 的使用。\n\n自引用结构有很多应用。其中最突出的应用是使用自引用结构来表示链数据结构，如链表、二叉树等。\n\
  \n## 链表的概念 (#text00006.html_ch14-9a)\n\n![](img/Image00996.gif)\n\n我们知道列表是指一组顺序组织的项目。数组是列表的一种示例。在数组中，顺序组织是通过其索引隐式提供的。我们使用索引来访问和操作数组元素。数组的一个主要问题是数组的大小必须在开始时精确指定。正如之前指出的，在许多现实应用中这可能是一项困难的任务。\n\
  \n表示列表的完全不同的方法是使用指针。这在图 14.4 中所示。输出说明了获取的原始缓冲区大小被修改，以包含一个更大的字符串。请注意，即使在修改了原始大小后，缓冲区的原始内容仍然保持不变。\n\
  \n![](img/Image00991.gif) ![](img/Image00992.gif)\n\n图 14.4 内存空间的重新分配与释放\n\n\n\n\
  \n循环链表没有起点也没有终点。最后一个项指向第一个项。双向链表使用两组指针，一个指向下一个项，另一个指向前一个项。这允许我们以任一方向对列表进行遍历。循环双向链表则以环形形式同时采用前向指针和后向指针。图\
  \ 14.7 展示了各种类型的链表。\n\n![](img/Image01008.gif)\n\n图 14.7 不同类型的链表\n\n## 复习指针\n\n![](img/Image01009.gif)\n\
  \n指针的概念在第 12 章中讨论过。由于指针在链表的处理中被广泛使用，我们将简要回顾一些与列表处理直接相关的指针属性。\n\n我们知道变量可以被声明为指针，并指定它们可以指向的数据项的类型。实际上，指针将保存数据项的地址，并可用于访问其值。在处理链表时，我们主要使用结构体类型的指针。\n\
  \n最重要的是记住包含变量地址的指针变量 `ptr` 与表示 `ptr` 值所指向变量值的引用变量 `ptr` 之间的区别。以下示例说明了这种区别。在这些图中，我们假设指针\
  \ `p` 和 `q` 以及变量 `x` 和 `y` 被声明为相同类型。\n\n### (a) 初始化\n\n![](img/Image01010.gif)\n\
  \n指针 `p` 包含 `x` 的地址，`q` 包含 `y` 的地址。\n\n`*p =100`且 `*q = 200`  `p<>q`\n\n### (b)\
  \ 赋值 `p = q`\n\n赋值 `p = q` 将变量 `y` 的地址分配给指针变量 `p`，因此 `p` 现在指向变量 `y`。\n\n![](img/Image01011.gif)\n\
  \n两个指针变量指向同一个变量。\n\n`*p = *q = 200` 但 `x <> y`\n\n### (c) 赋值 `*p = *q`\n\n此赋值语句将\
  \ `q` 所指向变量的值放在 `p` 所指向变量的位置。\n\n![](img/Image01012.gif)\n\n指针 `p` 仍然指向变量 `x`，但\
  \ `x` 的旧值被替换为 200（由 `q` 指向）。\n\n`x = y = 200` 但 `p <> q`\n\n### (d) NULL 指针\n\n\
  C 语言提供一种名为 `NULL` 指针 `(0)` 的特殊常量，用于初始化指向空内容的指针。即语句\n\n![](img/Image01013.gif)\n\n\
  使指针 `p` 和 `q` 指向空内容。它们以后可以被用于指向任何值。\n\n我们知道，在使用指针之前必须通过分配内存地址来对其初始化。为指针分配内存地址有两种方法。\n\
  \n1. 分配现有变量的地址（静态分配）\n\n```\nptr = &count;\n```\n\n2. 使用内存分配函数（动态分配）\n\n```\nptr\
  \ = (int*) malloc(sizeof(int));\n```\n\n## 创建链表\n\n我们可以将链表视为一种抽象数据类型，并执行以下基本操作：\n\
  \n1. 创建列表。\n2. 遍历列表。\n3. 统计列表中的项。\n4. 打印列表（或子列表）。\n5. 查找用于编辑或打印的项。\n6. 插入项。\n7.\
  \ 删除项。\n8. 合并两个列表。\n\n在第 14.7 节中，我们使用结构体变量名 `node1` 和 `node2` 创建了一个两个元素的链表。我们还使用了地址运算符\
  \ `&` 以及成员运算符 `.` 和 `->` 来创建和访问单个项。使用链表的核心思想是避免对列表中特定数量项的引用，以便我们根据需要插入或删除项。这可以通过使用“匿名”位置来存储节点来实现。这些位置不是通过名称访问的，而是通过引用它们的指针访问的。（例如，我们必须避免使用如\
  \ `node1.age` 和 `node1.next->age` 这样的引用。）\n\n匿名位置是通过指针和动态内存分配函数（如 `malloc`）创建的。我们使用指针\
  \ `head` 来创建和访问匿名节点。考虑以下情况：\n\n![](img/Image01014.gif)\n\n`struct` 声明仅描述了节点的格式，并不分配存储。只有在语句中调用函数\
  \ `malloc` 时，才会为节点的存储空间：\n\n```\nhead = (node *) malloc(sizeof(node));\n```\n\n\
  此语句获取了一块足够存储一个节点的内存，并将其地址分配给指针变量 `head`。该指针指示链表的起始位置。\n\n![](img/Image01015.gif)\n\
  \n以下语句在成员字段中存储值：\n\n![](img/Image01016.gif)\n\n可以如下所示添加第二个节点：\n\n![](img/Image01017.gif)\n\
  \n虽然这个过程可以继续以创建任意数量的节点，但如果节点超过两个，它就会变得繁琐且笨拙。上述过程可以通过递归和迭代技术轻松实现。可以通过如下替换语句将指针从当前节点移动到下一个节点：\n\
  \n```\nhead = head->next;\n```\n\n习题 14.4 显示了使用递归创建完整链表并打印其内容。\n\n![](img/Image01018.gif)\n\
  \n图 14.8 所示所示程序展示了使用递归创建完整链表并打印其内容。\n\n```\nhead = (node *) malloc(sizeof(node));\n\
  ```\n\n![](img/Image01019.gif) ![](img/Image01020.gif) ![](img/Image01021.gif)\n\
  \n图 14.8 创建线性链表\n\n## 插入项\n\n链表的优势之一是插入新节点的情况简单。这只需要重置两个指针（而不是像数组那样移动整个数据列表）。\n\n\
  向列表插入新项（假设为 X）有：\n\n1. 在列表头部插入。\n2. 在列表中间插入。\n3. 在列表末尾插入。\n\n插入过程发生在查找插入位置的搜索之前。搜索涉及定位要插入新项之后的节点。\n\
  \n一种通用的插入算法如下：\n\n```\n开始\n如果列表为空或\n新节点在头部节点之前\n将新节点作为头部插入，\n否则\n如果新节点在最后一个节点之后，则\n\
  将新节点作为尾节点插入，\n否则\n将新节点插入到列表主体中\n结束\n```\n\n在链表开头放置新项的算法：\n\n1. 获取新节点的空间。\n2. 将数据分配给新节点的项字段。\n\
  3. 将新节点的下一个字段设置为指向列表的起始。\n4. 将头部指针更改指向新节点。\n\n在两个现有节点（假设为 N1 和 N2）之间插入新节点 X 的算法；\n\
  \n1. 为新节点 X 设置空间。\n2. 将值分配给 X 的项字段。\n\n\n\n\n3. 将 `X` 的 `next` 字段指向节点 `N2`。\n\n\
  4. 将 `N1` 的 `next` 字段指向 `X`。\n\n在列表末尾插入项的算法与插入到中间的算法相似，不同之处新节点的 `next` 字段被设置为 `NULL`（或如果存在哨兵节点/哑节点，则设置为指向哨兵节点）。\n\
  \n![](img/Image01022.gif)\n\n图 14.9 所示的 `insert` 函数请求要插入的项以及“关键节点”。如果插入恰好发生在开头，为新节点创建内存空间，将新项的值赋给它，并将指针\
  \ `head` 赋值给下一个成员。指示新节点起始位置的指针 `new` 被赋值给 `head`。注意以下语句：\n\n![](img/Image01023.gif)\n\
  \n![](img/Image01024.gif) ![](img/Image01025.gif)\n\n图 14.9 向链表中插入项的函数\n\n然而，如果要把新项插入到现有节点之后，我们使用递归的\
  \ `find` 函数来定位“关键节点”。使用上述讨论的算法在关键节点之前插入新项。如框所示：\n\n插入前\n\n![](img/Image01026.gif)\n\
  \n插入后\n\n![](img/Image01027.gif)\n\n## 删除项\n\n从列表中删除节点比插入更简单，因为只需要更改一个指针值。这里仍然有三种情况：\n\
  \n1. 删除第一个项。\n2. 删除最后一项。\n3. 删除列表中间两个节点之间的项。\n\n在第一种，`head` 指针被修改指向列表中的第二个项。在另外两种情况下，紧邻被删除项的前一个项的指针被修改指向被删除项之后的项。删除的一般算法如下：\n\
  \n```\n开始\n如果列表为空，则，\n    无法删除节点\n否则\n    如果要删除的节点是第一个节点，则，\n    让头指向第二个节点，\n  \
  \  否则\n    从列表主体中删除节点。\n结束\n```\n\n被删除节点的内存空间可以释放以便重用。与插入一样，删除过程也涉及对要删除项的查找。\n\n\
  ![](img/Image01028.gif)\n\n图 14.10 给出了一个删除指定节点的函数。该函数首先检查指定项是否属于第一个节点。如果是，则将第二个节点的指针临时赋值给指针变量\
  \ `p`，释放第一个节点占用的内存空间，并将第二个节点的位置赋给 `head`。因此，原来的第二个节点变成了新列表的第一个节点。\n\n如果要删除的项不是第一个，则我们使用\
  \ `find` 函数来定位包含要删除项的“关键节点”的位置。在临时指针变量的帮助下交换指针，使前一个节点中的指针指向关键节点之后的节点。被删除的关键节点的内存空间将被释放。底部的图显示了关键节点的相对位置。\n\
  \n![](img/Image01029.gif)\n\n以下代码的执行删除了关键节点。\n\n```\n![](img/Image01030.gif)\n![](img/Image01031.gif)\
  \ ![](img/Image01032.gif)\n```\n\n图 14.10 从链表中删除项的函数\n\n## 链表的应用\n\n链表概念对于许多不同的抽象数据类型（如队列、栈和树）有用。\n\
  \n如果我们将插入过程限制在列表的一端并将删除限制在另一端，那么我们就得到了队列模型。也就是说，我们可以在尾部插入项并在头部移除项（参见图 14.11 a)）。这符合“先进先出”（FIFO）原则。现实应用中有许多队列的例子。\n\
  \n如果我们将插入和删除限制只发生在列表开头，那么我们建模了另一种被称为“栈”的数据结构。栈也被称为推入列表。栈的一个例子是忙碌高管的“收件”盘。文件在托盘中堆积，每当高管有时间处理文件时，他就从顶部取走。也就是说，文件从顶部添加并从顶部移除（参见图\
  \ 14.11 b)）。栈有时也被称为“后进先出”（LIFO）结构。\n\n列表、队列和栈本质上都是一维的。树代表了二维链表。树在日常生活中经常遇到。一个例子是大公司的组织结构图。另一个例子是体育赛事的图表。\n\
  \n![](img/Image01033.gif)\n\n图 14.11 链表的应用\n\n![](img/Image01034.gif)\n\n## 核心概念\n\
  \n- **动态分配**：在运行时分配内存的过程。\n- **堆**：用于动态分配的可用空间。\n- **栈**：基于后进先出（LIFO）原则的推入列表。\n\
  - **calloc**：分配数组空间并将其初始化为零然后返回指针的函数。\n- **malloc**：分配请求大小的字节并返回分配空间指针的函数。\n- **sizeof**：用于确定数据类型的大小。\n\
  - **realloc**：修改之前分配的内存的函数。\n- **链表**：不是按物理位置排列，而是通过存储在数据部分的逻辑链接连接的结构集合。\n- **NULL\
  \ 指针**：不是按物理位置排列，而是通过存储在数据部分的逻辑链接连接的结构集合。\n\n## 始终记住\n\n- 在不再需要时释放动态分配的内存以避免可能的“内存泄漏”。\n\
  - 使用 `sizeof` 操作确定链表的大小。\n- 使用内存分配函数 `malloc` 和 `calloc` 时，测试返回值是否为空。如果内存分配失败，打印适当的消息。\n\
  - 永远不要调用零大小分配函数。\n- 将 `malloc` 或 `calloc` 的返回值赋给指针以外的其他内容是错误的。\n- 逐释放使用 `calloc`\
  \ 创建的数组元素是错误的。\n- 使用 `free` 函数释放未动态分配的内存是错误的。\n- 使用无效指针调用 `free` 可能导致问题，有时会导致系统崩溃。\n\
  - 在释放后使用指针是错误的。\n- 在释放节点之前将指针设置为 `NULL` 是逻辑错误。该节点将无法找回。\n- 在没有结构标签的情况下声明自引用结构是错误的。\n\
  - 未能将最后一个节点的链接字段设置为 `null` 是逻辑错误。\n\n## 简要案例\n\n### 在有序列表中插入 [LO 14.2, 14.5 M]\n\
  \n在有序链表的当前位置插入一个值的任务涉及两个操作：\n\n1. 找到要插入新节点之前的节点。我们称该节点为“关键节点”。\n2. 创建带有要插入值的新节点，并通过妥善操作指针来插入新节点。\n\
  \n\n\n\n\n为了阐明插入过程，我们使用在练习题 14.4 中讨论过的 `create` 函数创建的有序链表。图 14.12 显示了一个完整的程序，该程序先创建一个列表（使用排序后的输入数据），然后使用\
  \ `insert` 函数将给定值插入到正确的位置。\n\n![](img/Image01035.gif)\n\n![](img/Image01036.gif)\n\
  \n![](img/Image01037.gif)\n\n![](img/Image01038.gif)\n\n**图 14.12** 在有序链表中插入一个数字\n\
  \n该函数接受两个参数：一个是要要插入的值，另一个是指向链表的指针。该函数使用两个指针 `p1` 和 `p2` 来搜索列表。两个指针都沿链向下移动，其中 `p1`\
  \ 紧随 `p2` 后一个节点，同时将 `p2` 指向的数值与要插入的值进行比较。当 `p2` 指向的数字大于（或等于）要插入的数字时，就找到了“关键节点”。\n\
  \n一旦找到关键节点，就会创建一个包含该数字的新节点，并将其插入到 `p1` 和 `p2` 指向的节点之间。下面的图说明了整个过程。\n\n![](img/Image01039.gif)\n\
