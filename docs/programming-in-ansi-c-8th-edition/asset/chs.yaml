  \ 8.6]\n\n## 简要案例\n\n### 1. 数字列表的中位数 [LO 8.2, M]\n\n当列表中的所有项都按顺序排列时，将项分成两部分且两边数量相同的中间值称为中位数。奇数个数的项目恰有一个中间值，而偶数个数的项目有两个中间值。因此，偶数个数项的中位数被指定为两个中间值的平均值。\n\
  \n寻找中位数的步骤步骤如下：\n\n1. 将项读入数组，同时统计项的数量。\n2. 按升序对项排序。\n3. 计算中位数。\n\n程序和示例输出如图图 8.10\
  \ 所示。所使用的排序算法如下：\n\n1. 比较列表的前两个元素，例如 `a[1]` 和 `a[2]`。如果 `a[2]` 小于 `a[1]`，则交换它们的值。\n\
  2. 比较 `a[2]` 和 `a[3]`；如果 `a[3]` 小于 `a[2]`，则交换它们。\n3. 继续此过程，直到最后两个元素被比较并交换。\n4. 重复上述步骤\
  \ `n–1` 次。\n\n在数组的反复遍历中，最小的元素“泡”到顶部。由于这种冒泡效应，该算法被称为冒泡排序。下图展示了四个项目的冒泡效应。\n\n![](img/Image00547.gif)\n\
  \n在第一次遍历中，每当需要时都会对三对项进行比较和交换。需要注意的是，数字 80 是项中最大的，它在第一次遍历结束时移动到了底部。这意味着元素 80（新列表中的最后一项）不需要考虑。因此，数字\
  \ 65（第二大的）移动到了底部。这次，数字 80（最大的）移动到了底部。这只需要两对。\n\n![](img/Image00548.gif)\n![](img/Image00549.gif)\n\
  \n**图 8.10** 数字中位数程序\n\n### 2. 标准差计算 [LO 8.2, M]\n\n在统计学中，标准差用于衡量数据与其平均值的偏差。计算标准差的算法如下：\n\
