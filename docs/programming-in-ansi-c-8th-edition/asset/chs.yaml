  ![](img/#text00006.html_ch2-2a)\n## C 语言的历史](#text00006.html_ch2-3a)\n“C”对于一种编程语言来说听起来是个奇怪的名字。但这种听起来很奇怪的语言是今天最流行的计算机语言之一，因为它是一种结构化、高级且与无关无关语言。它允许软件人员开发程序，而无需担心它们将实现的硬件平台。\n\
  所有现代语言的根源是 `ALGOL`，它于 20 世纪 60 年代初引入。`ALGOL` 是第一个使用块结构的计算机语言。尽管在美国并没有流行，但在欧洲被广泛使用。`ALGOL`\
  \ 将结构化编程的概念引入了计算机科学界。Corrado Bohm、Guiseppe Jacopini 和 Edsger Dijkstra 这样的计算机科学家在\
  \ 20 世纪 60 年代普及了这一概念。随后，多种语言相继问世。\n1967 年，Martin Richards 开发了一种名为 `BCPL`（基础组合编程语言）的语言，主要用于编写系统软件。1970\
  \ 年，Ken Thompson 创建了一种使用许多 `BCPL` 特性的语言，并简单地将其命名为 `B`。`B` 被用于在贝尔实验室创建早期版本的 `UNIX`\
  \ 操作系统。`BCPL` 和 `B` 都是“无类型”系统编程语言。\n`C` 是 Dennis Ritchie 在 1972 年在贝尔实验室由 `ALGOL`、`BCPL`\
  \ 和 `B` 进化而来的。`C` 使用了这些语言的许多概念，并增加了数据类型和其他强大的特性。由于它是与 `UNIX` 操作系统一起开发的，因此它与 `UNIX`\
  \ 紧密相连。这个同样在贝尔实验室开发的操作系统几乎完全用 `C` 语言编写。`UNIX` 是今天世界上最流行的网络操作系统之一，也是互联网数据超级高速的核心。\n\
  多年来，`C` 主要用于学术环境，但随着许多用于商业用途的 `C` 编译器的发布以及 `UNIX` 流行程度的提高，它开始在计算机专业人士中获得广泛支持。今天，`C`\
  \ 运行在各种操作系统和硬件平台上。\n在 20 世纪 70 年代，`C` 演变成了现在所知的“传统 C”。在 1978 年 Brian Kerningham\
  \ 和 Dennis Ritchie 出版《C 编程语言》一书后，它变得更加流行。这本书非常受欢迎，以至于该语言在编程界被称为“K&R C”。`C` 的快速增长导致了不同版本的语言开发，这些版本虽然相似但通常不兼容。这为系统开发人员带来了严重的问题。\n\
  为了确保 `C` 语言保持标准，1983 年，美国国家标准协会（ANSI）任命了一个技术委员会来为 `C` 定义标准。该委员会在 1989 年 12 月批准了一个\
  \ `C` 版本，现在被称为 `ANSI C`。它随后于 1990 年被国际标准组织（ISO）批准。这个版本的 `C` 语言也被称为 `C89`。\n在 20\
  \ 世纪 90 年代，完全基于 `C` 的语言 `C++` 经历了了多次改进和变化，并于 1977 年 11 月成为 ANSI/ISO 批准的语言。`C++`\
  \ 为 `C` 增加了许多新特性，使其不仅成为一种真正的面向对象的语言，而且成为一种更多功能的语言。在同一时期，美国太阳系统公司创建了一种基于 `C` 和 `C++`\
  \ 模型的新语言 `Java`。\n![](img/Image00061.gif)\n图 2.1 ANSI C 历史\n所有流行的计算机语言本质上都是动态的。它们通过引入新特性不断提高自己的功能和范围，`C`\
  \ 例外。尽管 `C++` 和 `Java` 是从 `C` 进化而来的，但 `C` 的标准化委员会认为，将 `C++/Java` 的某些特性加入 `C` 将增强该语言的实用性。结果就是\
  \ 1999 年的 `C` 标准。这个版本通常被称为 `C99`。`C` 的历史和发展如图图 2.1\n![](img/Image00062.gif)\n`C`\
  \ 的日益流行可能因为它具有许多理想的品质。它是一种健壮的语言，其丰富的内置函数和运算符可以用于编写任何复杂程序。`C` 编译器将汇编语言的能力与高级语言的特性相结合，因此非常适合编写系统软件和业务软件包。事实上，市场上许多许多\
  \ `C` 编译器都是用 `C` 编写的。\n用 `C` 编写的程序高效且快速。这归功于它多样的数据类型和强大的运算符。它比 BASIC 快很多。例如，一个将变量从\
  \ 0 增加到 15000 的程序在 `C` 中大约需要 1 秒钟，而在 BASIC 中需要超过 50 秒。\n`ANSI C` 中只有 32 个关键字，它的优势在于内置函数。提供了几个标准函数，可以用于开发程序。\n\
  `C` 具有极高的可移植性。这意味着为一台计算机编写的 `C` 程序可以在另一台计算机上运行，只需很少或完全不需要修改。如果我们计划使用具有不同操作系统的新计算机，可移植性就很重要。\n\
  `C` 语言非常适合结构化编程，因此要求用户以函数模块或块来考虑问题。这些模块的合理集合将构成一个完整的程序。\n另一个 `C` 的重要特性是它的自扩展能力。`C`\
  \ 程序基本上是 `C` 库支持的函数集合。我们可以不断向 `C` 库添加我们自己的函数。有了大量可用函数，编程任务变得简单。\n## 示例程序 1：打印消息](#text00006.html_ch2-5a)\n\
