    “我告诉他我留在你这儿——”


    她睁大了眼睛，更紧地抓住了他的手。


    他冲向门外，“但我没有告诉他任何细节。他不认为我应该见你，所以我一直在试图说服他，我是对你是认真的。”


    “他不认为你应该见我？我有什么问题吗？”


    “闭嘴。”


    她盯着他看了一会儿，才松开了他的手。她向床头缩了缩，从床头柜上拿起药瓶，没加水就吞下了一粒，然后靠在枕头上。她闭上眼睛，等待过去一小时的情绪痛苦和腿部的酸痛消退。此时，她所做的只是将这一切都放大了十倍。


    罗斯（Royce）滑过床铺，将手放在她的腹部。他的身体紧紧贴着她的侧脸，但她没有睁眼。


    他说：“我知道我们彼此并不熟悉，但我昨晚告诉过你，我是打算长久发展的。我没有逃避你。对不起，我没给你留便条。”他从她的腹部移开手，向旁边挪了挪。


    她深吸了一口气。紧绷的肌肉随之放松了下来。一分钟后，她的手机响了。她睁开眼拿起手机。短信写道：“我是罗斯。现在你有我的号码了。”


    “你怎么拿到我的号码的？”


    “我从你的档案里拿的，为了好给你打电话。我一直在想裁员之后我应该等几个小时，结果你走进了酒吧。”


    “几个小时？你没考虑过几年吗？”


    “既然你还没发现，我为你迷死了。”


    她拉过他吻了一吻，沉醉在他的唇间。他们亲昵依偎了几分钟，这时他的手机响了，中断了他们。


    他推开她道歉道：“我本该关掉铃声的。我不知道我老板为什么周日打电话。”


    他翻到床的另一侧接起电话。格蕾丝（Grace）听了一段漫长的单向对话，罗斯期间不断发出“嗯”、“啊”。最后最后他说：“我今天有计划，而且这是特德（Ted）的专长。让他一个人过来，我周一再跟进。”


    格蕾丝的心沉了下去。这局面不会有好下。她刚从以为他离开고恐惧中缓过神，现在他真的要离开她了。当然，在内心深处，她知道他周一要去上班，但她不想面对现实。她想留在这一段新恋情的的茧里。她看向门口的行李箱。他一定计划在度假村的剩余时间里和她一起度过。


    罗斯把手机扔在床上，打开窗帘向外望去。光线亮了房间，与她从罗斯身上感受到的阴郁形成对比。


    他说：“看来我们的相处时间被缩短了。”他转过身，带着请求的目光。“我很抱歉，格蕾丝。我们下周工作的公司意识到他们的重组计划完全错了，需要我和特德进去帮他们完成。”


    “重组？”格蕾丝的手抓紧了床单。


    “直白地说，他们需要我们决定从哪里裁减员工。”


    愤怒涌上并爆发出来。“所以你一直一直负责开除我。你为什么要在这件事上骗我？”


    “不，不！”罗斯回到床上，但格蕾丝抬起手掌阻止他靠近。他继续解释道：“我们没有为你们公司规划重组。那完全是公司内部的决定。相信我，如果听我的，我会建议让你和你的项目经理调到公司的其他部门。你一个人就承担了你团队一半的生产力。”


    格蕾丝双手交叉在胸前。“但你要去决定别人的命运？”


    他的眼神变得坚硬了。“这就是我的工作。把它看作是一段糟糕的关系，其中一方察觉到了而另一方没有。分手对双方都是好事，即使让被抛弃的那个人需要更长时间才能意识到。”


    “什么？这就是你甩掉我的方式吗？出去！”


    “不，我不是那个意思。”


    “出去。我是认真的。我现在无法接受你呆在这里。上帝，我不敢相信我做了什么。”


    当罗斯试图碰她时，格蕾丝缩了一下。震惊感袭来，就像埃里克（Eric）之前在诊所试图吻她一样，但罗斯不是她的英雄，而是痛苦的根源。


    他站了起来——眉头紧锁。“这还没结束，格蕾丝。如果你能停止疯狂一秒钟你就——”


    “滚蛋！”她大叫道。


    他走出了门，留下了滑雪装备和行李箱。


    当门“咔哒”一声关上时，格蕾丝滑进被子并将盖在头上。她任由自周五以来席卷她生活的痛苦风暴在心心中翻涌，并将痛苦散布到各处。她不想失去工作。她不想断腿。她不想失去罗斯。


    但她无法忍受那个她在短时间内变得如此亲密的男人，走在世俗间每天都遭受着该死的痛苦。


    # 12 | 道歉


    格蕾丝无法理解她的生活怎么会变得如此失控。她本是有规律的。现在她的生活变成了一团乱。


