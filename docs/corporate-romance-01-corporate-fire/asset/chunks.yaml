    她刚才太蠢了。她并没有要求他和她共度一夜——她只是想当然地以为。


    晨光透过紧闭的窗帘渗进来。她转向时钟，`7:03` 冰冷地回望着她。也许他已经去滑雪了，不想吵醒她。他可能留了字条。


    她撑起身体，差点又要躺下去了。她的腿部比昨天还要疼得多。她强迫自己靠在床头板上，环顾房间。她没有看到他的任何遗物——没有手表，没有手机，没有一点表明他计划回来的迹象。甚至晚饭后的所有碗具都消失了，仿佛从没发生过一样。


    她越是试图让自己冷静下来，呼吸就越急。


    他不会就这样离开的。男人们不会仅仅为了做爱就陪着女孩做完体检检查。嗯，也许他们会，但他当时并不知道自己能得到做爱。


    吸气。呼气。屏息。


    他本有多次机会和她发生，但他没有采取。她几乎是在求他让她为他口交。


    吸气。呼气。屏息。


    也许这就是他的圈套——让一个女人觉得向他献身完全是她自己的主意。


    在一个清醒的念头中，她意识到自己疯了。她应该给他打电话的。她从床头柜上抓起手机，解锁后把它扔在床上。她不知道该如何联系他。没有电话号码，没有邮箱，什么都没有。


    他一定留了字条的。


    她跳下床，拄着拐在房间里到处走动，甚至去了浴室，寻找他会回来的迹象。一无所有。


    她的腿疼得要命。心因为恐惧而剧跳。她回到床边，把好的一条腿抱在胸前。她头靠在膝盖上，忘记了他对她说过的所有动听的话，只记得自己做错的事。


    她告诉过他她的童年和她的强迫症。她评价过他的工作很很。。她的口交技巧可能很糟糕。他甚至不想留下来进一步诱惑她，因为她确信第一回合对他来说简直糟糕透了。


    她大脑的一小部分要求她给他留出时间回来。也许他只是出去吃早餐了，打算回来的。她专注于这唯一的希望，就像她教导自己去关注比她所纠结的事情更紧迫的问题一样。


    她滑下好的一条腿，跳到浴室进行晨间活动，但她没有洗澡，而是用一条毛巾又擦了一遍。


    之后，她依然穿着睡衣，因为她不想整理行李箱，她感到清爽了一些。但当她看到已经过了 `7:30` 而罗伊斯（Royce）仍然不在那里时，她的心沉了半底。


    她转向床边，胃里一阵抽挛。她第一次意识到她的应用书籍和备用手机放在床角。他翻过它们吗？他尝试解锁过她的手机吗？那关他的屁事。


    她的笔记本电脑包还拉着链，但在她没醒来时他清理了碗具。也许他也进过那里。


    她头晕眼眩，瘫倒在床上。再给他一点时间。她需要给他更多时间。他会回来的。


    她在床头柜上找到了遥控器并打开电视。由于无法集中注意力超过一分钟，她不停地切换频道。她整个人脑子里都是罗伊斯，试图说服自己与他亲密并不是错的。


    她转向时钟。已经过了 `8:00`。他已经离开了一个多小时，没有任何回来的迹象。


    她的目光落在他给她的那本数独书上，那是他在这里过的唯一证明。她从抽屉里拿出一铅笔开始做题。`8:15`。`8:20`。`8:30`。


    她的手机响了。她拿起看到是吉尔（Jill）的名字。她滑动手指解锁。


    “吉尔？”她颤抖着说道。


    “格蕾丝（Grace）！谢天谢地。我以为你割腕了。你还好吗？”


    这个简单的问题让她崩溃了。她怎么会认为一个靠开人为生的男人在说爱时是真心的呢？“我，我做了一些坏事。我不知道该怎么办。”她感觉自己像个必须向父母交代事情的小女孩。但这比考试考了
    B 要糟糕得多。


    “你做了坏事？你没有真的割腕吧？我需要拨打 `911` 吗？”吉尔的声音听起来很恐慌。


    “不，不是那样。”泪水顺着脸颊流下。她不想哭。不想在吉尔面前哭。吉尔会觉得她是个巨婴。


    “如果你不需要救护车，我就直接过去。无论发生了什么，我确定我们能解决的。”


    “我在布雷肯岭（Breckenridge）。我约了一个男人，他完全完全抛弃了我。我以为……我以为和他在一起一切不一样。”


    “你约了——你的规则呢？”


    “和他在一起时，那些规则似乎并不重要。他在我房间里住了一晚，但我醒来时，他已经走了。没有字条或之类的。看起来他根根没来过，除了那个……”

