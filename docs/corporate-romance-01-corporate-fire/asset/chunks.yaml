    “You bitch!” yelled Doug. “Do you have any idea what you''ve done?”


    Grace and Jill turned to see a handcuffed Doug being led by a couple of cops to
    a different part of the building and through a door. Detective Carlisle broke
    off from the group to head over to them. “Thank you so much for your help. I''m
    afraid we have to keep your laptop and phone for now, but you''re free to go.”


    “Doug was framing me?”


    “Yes, and we found Jeff''s keycard at his apartment.”


    Jill and Grace stared at each other.


    Detective Carlisle said, “I''m sorry for all the stress I know we''ve caused you,
    but we shouldn''t need to bother you much more after this.”


    “What about Royce?”


    “If you go out and wait in the lobby, he''ll be joining you soon.”


    Soon did not have the same meaning to Grace as it did to Carlisle. It was about
    an hour later when Royce finally appeared, tired but grinning.


    Grace hopped up and embraced him right away. “I''m sorry I got you arrested. I
    was just so nervous that I kept mentioning you without thinking.”


    He held her tightly and said, “It wasn''t you. Jeff told them I had the key, and
    the security guards were covering their butts. And when they released me they
    said all the programmers were implying we planned it together.”


    Jill laughed behind them. “Can you imagine Grace in prison? No privacy. People
    all up in her business. You should''ve seen her freaking out in the precinct.”


    Grace pushed away a little but still held on to him. Finally relaxing she said,
    “That''s nothing. They moved my chairs away from the table. I told them they had
    to move them back and we could talk at the table or they could sit on the floor
    if they wanted to stay at the coffee table.”


    Royce pulled her back to him as he laughed. “You told the officers to sit on the
    floor?”


    “Yeah before you got there.”


    Jill said, “So lets get some burgers and beer and go back to Grace''s. Jail break
    party!”


    “I''ll drink to that,” said Royce.


    ## 24 | Night Out


    Grace sat on her futon filled with apprehension. It was close to five in the afternoon,
    and she hadn''t seen Royce all day. She''d woken to find a note on her nightstand
    on top of five new Sudoku puzzle books and next to a vase with a single red rose.
    “I have some things I need to take care of, but I''ll be back soon. Whatever you
    do, don''t worry. I haven''t run away.”


    Easy not to worry in the morning, but he''d been gone all day now with no sign.
    She could email him on her second phone, but that wouldn''t really show she trusted
    him or was overcoming her fear of being hurt. But waiting all day was a killer.


    She hadn''t heard from Jill either, which wasn''t a surprise since Jill worked,
    but it made the day lonely.


    Royce had stayed the night, but between the events of the day and her pain medication,
    she’d fallen asleep before Jill had left. She wanted to have some time with him
    alone.


    The buzzer sounded. Finally. She didn''t even ask who it was before pressing to
    unlock the door downstairs. She opened her door to find Jill dressed in a black
    cocktail dress with her blonde hair done up in curls on the top of her head. “Big
    date?” asked Grace, filled with disappointment.


    She started back to her futon, but Jill said, “You''re not sitting on the couch
    all night. We''re going out to dinner. Put on your best dress.”


    Grace turned around with her eyebrows scrunched together. “I can''t go. Royce
    left me a note saying he''d be back soon, but he''s been gone all day. I was still
    asleep when he left.”


    “Royce is a guy. Maybe he went back to Maryland to get some things, thinking he
    could call you. He probably didn''t realize the police have your phone.”


    “Back to Maryland? Did he tell you that? He could''ve woken me up. That''s not
    soon. I can''t believe he''d do that to me.”


    “Guys can be stupid that way. Come on. Let''s go.”


    “I''m not exactly up for fancy.”


    “Why not? You just broke your leg. It''s not like you''re in a body cast. Come
    on, or I''m going through your closet myself.” Jill took off to Grace''s bedroom.


    “Hey! Don''t touch my clothes!”


    “Then pick out your dress yourself.”


    Grace pounded the crutches across her apartment as fast as she could. Jill was
    sitting on the edge of her bed with one leg crossed over the other, waiting expectantly.
    “We''ll get a couple of men to buy us a bottle of champagne, and who knows where
    the night will take us now that you''ve let go of your rules?”


    “What about Royce?”


    “He''s a big boy; he''ll live. Besides he needs a little competition.”


    “Jill!”


    She laughed and said, “Okay, okay. No men. Just us tonight. Get dressed.”


    ![](images/00007.jpeg)


    Grace rode in Jill''s car, dressed in a black and white cocktail dress she''d
    never worn before. She''d been saving the dress for a special occasion, but Jill
    hadn''t liked any of the other dresses Grace had gotten out. When Jill spied it
    in the back of the closet she''d said, “You want to wear that one, trust me.”


    It had a black shoulder strap over only the right side and was tight around the
    chest and hips. Black sequins divided the two colors and made the dress pop. She
    wore one black flat on her good foot, which clashed with her white cast, but she''d
    thrown her white flats out at the end of summer. Still, she wished for the hundredth
    time that Royce was there to see her. Had he really gone back to Maryland without
    telling her?


    She also wished the car heater would warm up faster. Even she had her limits for
    cold.


    “Why didn''t you let me get my coat? It''s freezing tonight.”


    “You keep your apartment colder than anyone I know. I want all eyes on us when
    we enter. You can stand to be chilly for a little bit.”


    Grace looked out at the clear night. It was always colder when the clouds left.
    “The Ritz Carlton?” she asked as they pulled into the parking lot.


    “Elway''s is the best in the city.”


    “I just lost my job. I really shouldn''t be spending money on a dinner like this.”


    “Relax, okay? I''m buying.” Jill stopped at the curb for valet parking.


    Grace grabbed her hand and said, “You don''t need to do this. I really don''t
    deserve a friend like you.”


    Jill gave her a soft smile. “Yes you do. You got me through, what, three break
    ups now? You always keep everything to yourself while helping me with my problems.
    Let me do this for you.”


    “All I did was listen.”


    “You might be surprised to know that not everyone does that.”


    Grace squeezed her hand. “Thanks.” A valet helped her out of the car. She didn''t
    feel exactly sexy walking in on the crutches, but she felt good—like the whole
    world was an opportunity waiting for her. When they stepped into the restaurant
    with it''s soft lighting and light wood paneling, Grace saw heads turn to stare
    at them, just as Jill had wanted. She had to admit to enjoying the feeling.


    Jill leaned over and said, “We don''t have to wait to be seated. Just follow the
    curve of the restaurant around a bit.”


    Grace started in that direction but stopped about four tables in, gaping in amazement.


    Royce stood up dressed in a black suit and a blue tie that matched his eyes. “You
    look gorgeous, Grace.”


    “I could kill you for that note you left this morning.”


    “I felt bad leaving it, but I swear I''ll make it up to you tonight.” He winked
    at her.


    She turned to Jill and said, “And you, I can''t believe you didn''t tell me he
    was going to be here.”


    “I can''t believe you thought I could afford this place.”


    The two women laughed. Jill leaned in and kissed her cheek. “Have fun. I think
    I''ll go over to the bar. No sense wasting all the time I spent getting dressed
    up.”


    “Thanks, Jill,” said Royce. “I owe you.”


    “I''ll remember.” Jill took off, leaving Grace speechless.


    Royce stepped over, took her face in his hands and gently kissed her lips. “I
    hope you didn''t think I ran off.”


    “Jill had me thinking you''d gone to Maryland to get some things. I couldn''t
    believe you''d leave Denver without waking me up.”

