    “You just have to keep me in the loop. Jeff was there too and freaking out because
    he kept his keycard, but it was missing now. Instead of saying he''d kept it,
    he told the cops Royce had it.”


    “That must be why they arrested Royce.”


    “It gets worse. I didn''t eat with them, but when I left, I overheard Doug saying
    it was a good thing they''d all stuck to their plan of making you sound like the
    most suspicious one. He told them that you probably got Royce to set the fire
    for you.”


    “Oh my god, this is bad. This is really bad. I told them I was with you and Royce
    last night. What if they start to suspect you too?”


    “But I was with you guys. We were all together, so it couldn''t have been Royce.”


    Grace sat up. “But Royce took off on his own, remember. We can''t vouch for him
    for like an hour. And he''s the one who phoned it in, which they already know.
    What if they figure out that we weren’t with him when he phoned it in?”


    “Why would he phone in his own crime? If they really thought it was you, they
    would''ve arrested you.”


    “The detective made it sound like that was a possibility. Maybe it depends on
    what Royce says.”


    “He''s not going to say anything without a lawyer. I''d be more worried about
    Doug coming up with more stories to tell them.”


    Doug. She remembered him being so annoyed with her at not answering the group
    emails, and then he sent her that weird text. “The emails! Bring me my laptop.”


    Jill ran back to Grace''s room and emerged with her computer. Jill sat next to
    her as Grace loaded her email client. She scrolled all the way down to the first
    email.


    The emails started with the first person to be fired. Yet another reason why Grace
    should''ve seen the layoff coming because the email arrived an hour before she
    was fired. But she always turned off her email while she worked—apparently she
    was the only one.


    A knock at the door made both Grace and Jill jump. “Ms. Arden, it''s Detective
    Carlisle. Please open up.”


    “Shit, I need more time.”


    “Keep looking. I''ll try to stall them, but I don''t know how.” Jill stood up,
    but she made no move to answer the door.


    The emails were a flurry of crap, and Grace didn''t see anything that would cause
    a mass text about not mentioning the emails. Even the text was a stupid move because
    it had to be on a dozen phones. It was like her whole department had turned idiotic
    after they lost their jobs.


    There was another knock at the door, and Jill shouted out, “Coming,” but didn''t
    move. “Anything?” she asked.


    “Not yet, oh here''s one from Jeff.”


    “Ms. Arden, we need to take you to the precinct for further questioning.”


    Jill finally went to the door as Grace read Jeff''s email, “I kept my keycard.
    Anyone want to go to the office this weekend and trash it?”


    Detective Carlisle and Sergeant Lujan pushed past Jill. Carlisle said, “Ms. Arden,
    I''m afraid we need to take you in for more questioning.”


    “I found it!” Grace yelled. “Jeff still has his keycard. He says so in this email.”


    Detective Carlisle said, “What did you say?”


    “I went skiing, so I didn''t read my emails all weekend, and when I came back
    I didn''t feel like it because I''d broken my leg. But I got several texts today
    from the whole programming department telling me not to mention the emails.”


    Detective Carlisle and Sergeant Lujan walked over to peer at the computer screen.
    Jill came up behind her to read it over her shoulder.


    “You have a lot of unread emails here,” said Carlisle.


    “I just started reading them right before you got here.”


    “Ms. Arden, we need your laptop and phone as evidence, and would you and Jill
    come down to make an official statement?”


    Grace cringed at the thought of the police going through her computer files and
    phone, but it was the only way to help Royce. And he wouldn''t be in this position
    if it wasn''t for her. “Can you release Royce now?”


    “We need to look everything over first.”


    Grace nodded. Jill grabbed up both her and Grace''s purses while the police confiscated
    Grace''s computer and phone. Grace had to bite her lip to keep from shouting at
    them about privacy and not touching her belongings. Royce needed her help.


    ### 23| Waiting


    Grace slumped on her crutches behind Detective Carlisle and Sergeant Lujan as
    they opened up her laptop. The fluorescent lights buzzed overhead, jangling her
    nerves further. Jill stood next to her with a hand on Grace''s shoulder, knowing
    Grace was about to pop.


    “What''s your password?” asked Carlisle.


    “Can I just type it in myself? I''ll show you everything--”


    “I think we''d better do this,” said Carlisle.


    “I can''t just give you my password,” Grace almost shouted, but Jill tightened
    her grip on Grace''s shoulder.


    “You can change it when you get your laptop back,” said Jill. “It''s okay.”


    “But it''s private, and--”


    “And you want Royce to be released. Take a deep breath.” Jill put her hand on
    Grace''s cheek and turned her head to lock eyes with her.


    Grace relaxed, realizing that Jill was a true friend, sticking by her through
    all of this. She took a deep breath and tried to ignore the fact that the invasion
    of privacy felt like a doctor cracking her chest open. She let the air out of
    her lungs and recited her complex password, a meaningless jumble of uppercase
    and lowercase, numbers and other characters.


    “I had a password,” mumbled Lujan. Carlisle entered the password, and the screen
    opened her email client, where Carlisle started reading sent by former coworkers.


    “Wait,” said Lujan, pointing at the screen. “This one was sent five minutes ago.
    Does else have your password?”


    “No, I never give that out. I''m very private.”


    “Well, someone''s hacked it because another one just popped up.”


    Hacked. The word charged through Grace''s synapses, and she remembered Doug saying,
    “I have my hacker''s certification.”


    Grace sat down. Jill pulled her phone from her purse, turned Jewel Chase on and
    shoved it in front of Grace.


    Grace felt like a toddler being given a toy by an exasperated mother, but she
    took the offering.


    An hour or so later while the two friends were discussing the quirks of the game
    and how to make it better, a man shouted across the precinct.

