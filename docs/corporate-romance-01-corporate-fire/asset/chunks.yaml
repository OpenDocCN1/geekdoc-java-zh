    Grace shook her head, still unable to answer the question. The pain was bad, but
    she could take it. “No medication. I''m fine without it. Really.”


    Royce slipped his hand into hers and said, “Grace, I really think you could use
    some painkillers. Your leg has got to be killing you, you''re in shock, and, let''s
    face it, yesterday was shit. I''d take as much as they let me.”


    Her bad experiences with prescription drugs when her parents had tried to medicate
    her OCD made her insistent. “I don''t like drugs. They mess with me.”


    Royce expelled a long breath. He must be exasperated with her. “You drink alcohol.
    Think of these as super-powered cosmopolitans.”


    His logic stunned her and then actually made her giggle. She loosened up enough
    to say, “I''m not pregnant.”


    The answer didn''t seem to satisfy the nurse who said, “Are you sure? Even if
    you use protection there''s still a chance. When was your last period?”


    No way. She was not asking that question.


    Royce shifted uncomfortably next to her.


    The torture needed to end. She rushed out the words, “I haven''t had sex in forever.
    So I really truly know I''m not pregnant. And please don''t ask me when the last
    time I had sex was because I only just met this man yesterday.”


    She heard Royce choke or cough like he was trying not to laugh.


    The nurse raised her eyebrows and said, “I''ll get you a strong painkiller. It''ll
    help with the shock too.”


    Grace didn''t think her discomfort could grow worse until the nurse left the room.
    To avoid a long silence she said, “I''m so sorry I asked you to stay. I had no
    idea she''d ask me some of those questions. Please go ski more, or if it’s too
    late go back to the bar.” She hung her head and mumbled out, “Find another woman
    to send notes to.”


    The thought of him flirting with another woman made her heart drop. Maybe it was
    the way he''d chased off Doug and Eric, or the way he calmed her with the touch
    of his hand when all other men made her cringe, but she''d forgotten her hatred.


    He put his hand on her cheek and forced her to face him. When she kept her eyes
    lowered he said, “Hey.”


    She looked up. Sincerity mixed with concern gazed back at her. He said, “I think
    tomorrow you''re going to be embarrassed and not want to see me again, and I''m
    going to have to start all over gaining your confidence. So tomorrow could you
    please remember that I''m happier holding your hand in a doctor''s office than
    I''ve been in a very long time.”


    He knew all the right things to say. Grace relaxed her grip a fraction. “Why are
    you being so nice to me? You could be drinking at the bar with beautiful women
    surrounding you. Please, go and enjoy your Saturday night.”


    He moved his hand to the back of her neck. She tensed her muscles in an attempt
    to prevent from shaking. She imagined what it would be like if he kissed her right
    then. Amazing, she was sure.


    He said, “When you bounced into the office Friday morning, you were so excited
    and filled with energy that I knew I had to meet you. Do you know how rare your
    attitude is? Most people I lay off are going through the motions, but you''re
    so passionate. I listened to your program manager and CFO fight about you and
    hoped your boss would win. I don''t want to be at the bar surrounded by beautiful
    women. I want to comfort this one gorgeous woman sitting in front of me.”


    She caught her breath. He understood how much she loved her job. And she''d never
    been called gorgeous.


    The nurse returned, and Royce pulled away. She gave Grace Vicodin with a small
    cup of water and said to Royce, “I''m going to wheel her into the X-ray room.
    You can wait here if you like, and she''ll be right back.”


    After that speech Grace wanted him to stay more than anything, but she didn''t
    want him to feel obligated. “You don''t have to wait,” said Grace. “I''ll be fine
    now. I can feel the medicine taking the edge off already.” Not exactly true.


    “I''ll go if you want me to, but I''m happy to wait.”


    She nodded, and the nurse wheeled her away. Royce would be perfect if it wasn''t
    for his job. He was great at building her up; he shouldn''t be tearing people
    down for a living.


    In the X-ray room Grace wished they''d given the painkillers a little more time
    to kick in. The nurse set her leg this way and that, making Grace want to yell,
    but she kept her mouth shut. About halfway through, numbness set in, and all her
    muscles relaxed. Her hand felt empty without Royce''s hand to grip. His palm had
    been so soft and his strength so reassuring. Maybe it didn''t matter anymore that
    he''d fired her. She didn''t know any guy who''d stick by her through this after
    knowing her for one day. Just a day. It seemed like forever.


    Whoa. The medication was really kicking in. Euphoria pulsed through her veins
    and made her forget everything but Royce and his concerned eyes. A small worry
    pushed itself in: maybe he''d left. She hadn''t answered his question about staying
    or going.


    The Vicodin stole her worries. She returned to blissful thoughts about seeing
    him again. She was sure she would. He''d stuck through the worst part after all.


    The nurse wheeled her back out saying, “The doctor will see you soon,” but Grace
    hardly heard her.


    Royce was gone.


    Her euphoria tumbled down. Logically it was silly to think that he''d wait for
    her. The discussion with the nurse had been embarrassing for both of them. She
    imagined talking to the doctor wouldn''t be much better. Maybe he finally realized
    that skiing or drinking at the bar would be a lot better than sitting in a clinic
    with a crazy programmer. At least his company had gotten her through the worst
    of it.


    The medicine wouldn''t allow her mood to bottom out completely, but she definitely
    heaped on the self-pity until she heard a knock at the door. Thinking it was the
    doctor, she said, “Come in.”


    Royce opened the door.


    She sighed in relief. “It''s sooo good to see you.”


    Royce grinned, closed the door and sat down next to her. He said, “You know, you
    were my first target to ever tell me it was good to meet me. I kept playing those
    words over and over in my mind on the drive here.”


    “Well, I had nooo idea why you were there. I just knew you were the most handsome
    man I''d ever seen.” She slapped her hand over her mouth


    “Really?” He folded his arms across his chest and smiled. “I thought you hated
    me. Tell me more.”


    She lowered her hand and said, “You''re trying to take advantage of me being all
    drugged up.”


    “Naturally. I take what I can in this job.” He leaned over and took her hand again.
    “Tell me what you were thinking when you walked into work early and we couldn''t
    stop staring at each other?”


    He paused, and Grace widened her eyes. Even on drugs she didn''t think she could
    open up about that.


    He continued, “Because what I was thinking was, ''Please don''t let that beautiful,
    determined woman be in my files. Please let her be somebody who will come skiing
    with me this weekend.''”'
