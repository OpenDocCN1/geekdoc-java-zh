    could muster was a lame, “Just wait till everyone hears about this.” Then he turned
    around and skied away, to Grace''s relief.


    She relaxed her arms around Royce, embarrassed that she had practically thrown
    herself at him, but he didn''t relax his arm. “Thanks,” she mumbled.


    “You okay?”


    A snowmobile roared up to them, and she was saved from answering. Eric held out
    an arm for her, and she reluctantly took it, still keeping him at a distance.
    Royce strapped her skis and poles onto the snowmobile.


    As Eric helped her lay down on the stretcher behind the snowmobile, he brushed
    his lips against her ear and whispered, “I enjoyed you watching last night.”'
