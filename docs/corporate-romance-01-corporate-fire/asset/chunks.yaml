    格蕾斯的眼睛睁大了。他的唇触让她太受不了了，尤其是发生了道格那的意外之后。她的喉咙收紧，不确定自己是否还能呼吸。埃里克坐在雪地摩托车上，她看到罗斯正瞪着他。罗斯说：“我猜你还是会赢得比赛的。我会和你——”话还没说完，他们就轰鸣着离开了。


    格蕾斯全身紧绷。她想要的是罗斯在她身边，而不是这个家伙。埃里克对她产生了误解。尽管如此，她表现得不像常常。她讨厌罗斯，但他触碰她时，并不会让她心惊肉跳。这一切太让人混乱了，尤其是现在她的腿还在隐隐作痛。也许在他解雇她之前，他对她的第一种吸引比她想象的要强烈得多。


    去诊所的途中，剧痛传遍了她的腿。她觉得自己在他们停下之前可能会尖叫起来。至少诊所和酒店是连通的。


    她无法停止思考罗斯帮助她。他到底是怎么想？也许他只是想通过对她好一点来缓解职业上的负罪感；这看起来不再像是一种征服游戏。但也许他只是很擅长玩这种游戏——他同时扮演了坏警察和好警察。


    她不安地扭动。他看起来真的很担心她。她什么时候还能见到他？他提到过见面，但她没听清最后部分。


    雪地摩托车停了。埃里克站起来，走过来解开她的束带。他说：“你昨晚是一个人。你男朋友今天早上来了吗？”


    “他不是我的男朋友，”格蕾斯说。真蠢。她本应该撒谎的。为了避免任何太尴尬的话，她说：“你也教滑雪课吗，还是这是你的主业？”


    “这就是我的工作。我去给你拿把轮椅。”


    “我觉得我可以走路——”


    “省了吧。你几乎站不稳。”


    在她进一步抗议之前，他就消失在里面了。她的腿很疼，她想到了所有的麻烦——没有工作，在完全无视吉尔二十四小时后现在没有朋友了，甚至连走路的能力都没有。她只是想——噢天天。她没办法回家。


    过度呼吸发生了。她知道很快就会感到头目晕。


    “我们到了，”埃里克推着轮椅走出诊所门说，“嘿，你还好吗？”


    “不好。我呼吸不顺，我的腿好疼……非常疼。”


    “没关系。我会帮你进去，医生会马上来看你。”他握她的手，但这让她想起了他的唇落在耳边。她的呼吸变得更加剧烈，焦虑感飙升。他把她放到轮椅上说：“好了。你知道吗，凯莉也觉得你很辣。她希望今晚晚些见到你。”


    “凯莉？什么？”她的声音调高到了震碎玻璃的程度。


    “我昨晚在一起的那个女人。”


    她无法接受这个。她紧紧抓住轮椅的扶手，直到手臂上的青筋暴起。


    “我以前没做过那种。你呢？你只是喜欢看，还是你也是个暴露狂？”他像是在进行日常聊天一样说着，一边推着她经过斜道进入诊所。


    眩晕感侵袭了她。她的脸色一定很苍白，因为他说：“等一下。你要进入休克了。我去给你拿条毯子。”他跑过一扇门，回来带着一条毛茸茸的毯裹在她的肩上。他移动了轮椅上的杠杆撑起她的腿，问道：“哪里疼？”


    她指向自己的小腿，他取掉她的滑雪鞋，在上面放上冰袋，坐在她旁边的椅子上。他倾身道：“我很庆幸遇到你。但你现在的痛苦可能让你无法进行我今晚的计划。”


    “什么？”她尖声问道。


    “我本以为我们可以晚点在酒吧见面，然后——”他没有说完句子，而是吻了她。


    格蕾斯崩溃并给了他耳光。“你在做什么？我有规矩。我必须和你约三次会你才能亲我，约会十点五次之后我们才能性交。而且我不是偷淫狂或暴露狂。老天爷的，我昨晚实在忍不住看了。你竟然就在酒吧吧边干她。”


    “一切还好吗？”罗斯穿过门框。


    格蕾斯的肌肉放松了。她没料他会出现在这里。但即使在他出现带来的片刻宽慰中，她仍念叨着：“我不想他亲我——”


    “对不起，”埃里克站起来举起手，“这是误会。她当时要休克了——”


    “所以你觉得亲她会有用？”罗斯打断道。他走向埃里克，语气中带着愤怒。


    “如果你昨晚在场，你就不会觉得这这么奇怪了。”


    罗斯抓住埃里克的红色外套。他说话时每个字咬得有力。“我昨晚在场，但坐在你大腿上的不是她。”


    埃里克从罗斯的抓手中挣脱，说道：“对不起。我去告诉医生你准备好了。”他跑过一扇门，格蕾斯怀疑是从后门出去的。罗斯坐在她身边，神态放松。他微笑着出手。她没想就接了过去，但她确定自己看起来像是一只受困的动物。


    他捏了捏她的手说：“没关系。你会没事的。”


    “我有约会规矩。他一直试图打破它们。他不明白。”


    “你为什么不告诉我这些，这样我就不会打破它们了？”


    格蕾斯的呼吸平稳了——和道格形成了鲜明对比。“我还是讨厌你，”她说，但握住他的手越越紧。


    ## 6 药物


    格蕾斯靠在轮椅上闭上眼睛。她似乎无法松开罗斯的手，但也同样无法回答他的问题。那些规矩很荒谬，但她无能为力。此刻他可能觉得她因为摔倒和埃里克的搭讪有点疯，更不用说丢工作了。但当他听到那些规矩时，他可能会觉得她彻底疯了。


    他的另一只手按在她的手背上，用两只手握住她的手。他的掌心温暖了她，皮肤的顺滑抚慰了她。他说：“嘿，你能说话吗，还是说你完全休克了？我不介意闯门进去告诉他们你现在需要检查。”


    她睁开眼睛说：“请不要离开我。”为什么，为什么，为什么她要表现成这样？她继续解释，与其说是对他，倒不如说是对自己说。“我的腿真的很疼。如果骨折了怎么办？我以后怎么找工作？保险怎么办？噢该死，我昨天丢掉保险了吗？”


    他的大拇指停住了，他低下了头。“时间太久了。至少这会迫使你休息一下。”他的一侧嘴角掠起一抹微笑。


    她低下目光，伸手摸他按在她脖子上的手。她本以为会缩回来，但手指只是抓住了他的手。讽刺的是，他对她工作处境的了解此刻竟然很有用，并帮助她从休克中恢复。


    她或许可以一直握着他的手，但护士进来了。


    她说听起来有人摔得厉害。让我们送你回去。”护士是一个身穿深红色刷服的年长女性。


    罗斯松手，试图放开她在轮椅扶手上的手。格蕾斯抓得更紧，恐慌他会离开。“你要走吗？”


    他的眉头皱起，显得很困惑。他为什么不该走？就在昨晚她还给了他耳光。他说：“我，呃，我以为你想自己进去。但如果你愿意，我当然会留下。”


