    “For what?” Grace had never seen her friend so upset, especially over something
    that apparently concerned Grace. Though Grace saw Jill as her best friend, she
    knew the feeling wasn''t mutual. Still, she must rate with Jill to warrant this
    reaction.


    Jill shook her head and led Grace by the arm to an office that''d been empty for
    a year. The door to the next office over opened, and Doug, a fellow Java programmer,
    walked out with a wide-eyed, stunned look on his face. He saw Grace and said,
    “Even you?”


    Before she could answer, another man from her morning greeting party came out
    of the same office as Doug. He was young, with a boy-next-door appeal. He said,
    “I''m ready for Gary.”


    Jill nodded and squeezed Grace''s elbow. “I''m so sorry.” Jill tilted her head
    to the office with the closed door and walked away.


    Doug put his hand on her shoulder, and Grace recoiled out of his grip. She hated
    anyone but friends touching her. Doug was fine as a coworker, but he found fault
    with everything; to a perfectionist like Grace, that was hell. “Geez Grace, I
    was just gonna say I’m sorry. You''re always so cold.”


    She didn''t breathe again until he''d walked past her. Something bad must be going
    down. Bewildered, Grace stepped in and found the corporate god flipping through
    a manila file with her name on the tab. She caught her breath again, but this
    time it was in the “OMG I can''t believe I''m in the same room with him” way.
    Up close he was even more handsome. The thin lines in the corners of his eyes
    told her he’d already hit his thirties, a little older than Grace. Jill shouldn''t
    be apologizing for leaving her alone with him; she should be talking with the
    higher pitched voice she got when she was excited.


    He looked up with his deep blue eyes, stared a moment, then said, “Grace, please
    have a seat. I''m Royce Hendrix.”


    Grace shook his hand, holding her breath through the duration of the firm grip
    that made her heart pound. He sort of fit rule number one: any guy she dated had
    to know someone she knew. It was probably a loose relationship, but obviously
    he knew someone at this company. If he wasn’t a skier, he’d probably pick it up
    quickly, judging from his athletic physique. Maybe they could hit the slopes together
    tomorrow if she got the nerve to ask. But all nerve fled when she withdrew her
    hand and saw her chipped nail polish again. She made a fist and hoped he hadn''t
    noticed. The silence lengthened. Oh, it was her turn to speak. “It''s good to
    meet you Mr. Hendrix.”


    It seemed like a reasonable thing to say, but he tilted his head and drew his
    eyebrows together as if no one had ever said that to him before. He shuffled the
    papers in her file around before he met her gaze again and said, “Uh, yes. I wish
    we were meeting under much better circumstances. I have the unfortunate task of
    informing you that Mile High Innovations is letting go of all its Java programmers.
    Greener Pastures is here to make the transition easier for you. This packet will
    help you get started in your new life.” He held out a folder with a picture of
    a field of grass and wildflowers.


    The florescent light above buzzed like a fly. Grace blinked, unwilling to comprehend
    what he''d said.


    He cleared his throat and continued, “Your severance pay is for a generous three
    months, but a hard worker such as yourself will find a new job in much less time.
    We''re offering a free headhunter service to all the Java programmers. I hope
    you''ll take advantage of it.” He leaned over the desk to hold the folder closer
    to her.


    Her brain shut down. She kept staring at the folder and finally asked, “Am I being
    fired?”


    “No, that would imply you''d done something wrong or were the only one. This is
    a corporate layoff, but we prefer to look at it as moving on to better ventures.”


    She shook her head. She was supposed to be flirting with this guy in a strictly
    professional way. “No, there''s been a mistake. I''ve gotten a raise here every
    year. My last project helped them with a multi-million dollar deal.”


    “Which is why you should take advantage of our headhunter program. Here--” he
    set the folder down and reached inside his suit coat. He pulled out a card and
    set it on top of the folder. “Call Terri. She''s our top headhunter. She''ll help
    you turn this loss into a win.”


    Grace stared at the business card without seeing it and then at his eyes, now
    a cold blue. Her face burned in embarrassment. “I came in early to finish—I said
    it was good to meet you—I must look like such a fool.” The room blurred into a
    stream of zeros falling down in rapid succession.


    “No, no, not at all. I wish my coworker had half your work ethic.”


    “Why? Clearly it doesn''t matter. He has a job, and I don''t.” Grace''s face still
    burned. She couldn''t believe the company she''d dedicated not only her 9-5 but
    also her evenings and weekends to was getting rid of her.


    “I will personally call Terri and let her know how impressed I was with you. She''ll
    get you a job in no time at all.”


    Grace blinked repeatedly. She had so misread this guy. Who''d want to go skiing
    with someone who fired people for a living?


    He cleared his throat and said, “I''ll need your keycard, please.”


    Grace didn''t know how long she sat there gaping. It must''ve been a while because
    he said, “Keycard?” again. She stood up, reached into her pocket and tossed the
    key at him before leaving the office, the folder and business card left behind.


    ## 2 | Leaving


    Grace took the few items that belonged to her off her desk and shoved them into
    her backpack, blinking furiously because she refused to cry in front of everyone.
    In an act of defiance, she picked up the Coke can Jill had knocked over and emptied
    the rest of it onto the keyboard.


    “Yeah, you show ''em,” said a voice behind her.


    Grace whipped around to see Doug watching her over the half-wall of her cubicle.
    They''d been hired around the same time, but the five years had worn differently
    on each. She''d kept herself in shape and appeared much the same as she had on
    her first day of work, but he''d spread. He wasn''t fat, just pudgy. She dropped
    the can and said, “It already spilled when Jill came to get me.”


    “It''s okay by me if you ruin all the keyboards here. I''m sorry about earlier.
    I was just mad about being fired.”


    “It''s okay.” But it wasn''t really. If he touched her again, she''d probably
    scream. She thought everyone she worked with knew not to touch by now. The way
    she cringed every time wasn''t friendly.


    “If they''re firing you, I guess they''re firing everybody. Though there was that
    time you screwed up the email--”


    “I wasn''t fired; I was laid off.” She didn''t like how she heard Royce''s voice
    in her head as she repeated his words. “And that wasn''t my fault. I was the one
    who found the problem, which was your code.”


    He shrugged. “Maybe. I doubt it, but maybe.”


    “Please leave.” She stared at the floor as she spoke, feeling an urge to cry coming
    on.


    “Wait, I''m sorry.” He reached over the wall to grab her by the arm, but she escaped.
    “I always say the wrong thing around you. I don''t get it.”


    She pushed the tears back and looked straight at him. “You always insult me. What''s
    not to understand?”


    ... going to Tony''s. They''re worried about finding a new job, but not me. I
    just got my hacking certification—companies will be begging me to come protect
    their systems. Anyway, people might have some leads on jobs for you. Wanna come?”


    “No. I''m getting the hell out of town.” She wasn''t sure why she said that, maybe
    just so she would have a solid excuse not to meet up with everyone and cry in
    her beer. It just wasn''t her style.


    “Oh yeah? Where ya going?”

