    “Oh, how cool. I''ll make it perfect just for you.”


    He paid for the drink and sat down in the first seat at a counter that ran perpendicular
    to the cash register counter. There were a couple of people there with their laptops
    and phones plugged in. He set his phone on the counter so he wouldn''t appear
    too out of place. Taking in the rest of the cafe, he saw a gas fire burning in
    the fireplace at the back of the room. A couple cuddled on the couch next to it,
    making him clench his jaw and look away. The warmth made him want to take his
    leather jacket off, but he had his SIG in a holster under his jacket. He certainly
    wouldn’t leave his firearm at his motel, and this wasn''t a place to flash one.
    He probably shouldn''t have brought it from Texas, but he''d felt buck naked on
    the plane home without a gun.


    He noted how Chloe assessed him out of the corner of her eye. Maybe he''d hook
    up with her if things didn''t work out with Stacy. Hmmm, maybe not. He got a weird
    vibe from her like she was appraising the goods rather than appreciating them.


    The cafe had a tall ceiling and a loft on one side. Maybe Stacy was up there.
    He checked the time on his phone and decided that 5:05 was a little too early
    to be here after work unless her bank was close by. He clicked on the Words with
    Friends app. Sweet. He had a message she’d posted a couple of hours ago along
    with her word: turgid. His cock hardened as if the word was a suggestion. All
    her words did that to him these days. There was no doubt that he needed a good
    fuck. Her tiny icon made it hard to see what she really looked like other than
    an attractive businesswoman.


    Chloe slid a whipped cream topped, caramel laced concoction in front of him, and
    he said, “So have you seen Stacy here recently?”


    “I usually see her on Fridays, but if it''s a bad week, I''ll see her today.”


    It was Thursday. He didn''t want to wish a shit week on anyone, but he couldn''t
    help but hope she''d show up. He hadn''t had the balls to tell her he was coming
    to town. He clicked on her message. “I didn''t expect a play from you while you
    caught up with your girlfriend. I hope everything''s okay.”


    He set the phone on the counter and took a sip of the latte, prepared for a sickeningly
    sweet experience. He paused and then drew more of the amazing liquid into his
    mouth. It was grandma''s apple pie with an edge. He set it on the counter and
    made a fist with his empty hand. This was supposed to have been the best Thanksgiving
    ever, after years of Army food in a desert where he might be shot before dinner
    was finished.


    He dove down into the darkness of self-pity but jumped out when the door opened
    behind him.


    “Hey, Stacy!” called Chloe.


    He turned to see. Oh, fuck, she was right behind him. He didn''t even try to slow
    his pulse. She wasn''t supermodel gorgeous or anything like that, but she was
    perfect. Her long brown hair fell in waves down to her shoulders. She had a heart-shaped
    face with ruby lips that didn''t appear to have lipstick. She strutted to the
    counter with a sassy sway in her hips covered by a business skirt; she smiled,
    though her eyes appeared tired.


    “Rough week?” asked Chloe.


    “It''s November.” She stated it as if it were a full explanation before continuing,
    “Work was okay, but my sisters are in an uproar that I''m insisting on hosting
    Thanksgiving this year. Won''t you please, please give me the recipe for the Holiday
    Cafe pecan pie?”


    Hudson loved pecan pie, but mostly he was fascinated by seeing in person a woman
    he''d only exchanged texts with.


    Chloe held up her hands. “I told you, I don''t have the authority to do that.
    Just buy one.” She didn''t seem angry, just a little exasperated.


    “I can''t buy anything. Grandma''s coming.” She reached into her purse and pulled
    out a business card. “Give this to whoever can give me the recipe...I''m willing
    to pay.”


    Chloe took the card, tucked it into her skirt pocket and said, “You have a visitor.”


    The muscles in Hudson’s neck tightened when he realized he was about to be introduced.
    She was even better than he''d allowed himself to imagine.


    “Oh, really? I wasn''t planning on meeting anyone today.”'
