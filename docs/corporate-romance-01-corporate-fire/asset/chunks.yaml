    “Sweetie, we''re here to protect you from any sort of violation.” Carlisle pushed
    the door open more, and they walked into the apartment. She patted Grace''s futon
    and said, “Why don''t you sit on the sofa, and Sergeant Lujan will pull over some
    chairs for us from your table. We''ll be out of here real quick.”


    If it wasn''t for the drugs, Grace knew she would''ve been hyperventilating. Even
    so she felt her face flush. She hated people in her apartment.


    She maneuvered around to the futon and sat down. Once everyone was seated, Carlisle
    said, “So, Ms. Arden, were you upset when Mile High laid you off?”


    Grace stared, hearing the question but only thinking about the fact that strangers
    were sitting in her chairs. And those chairs didn''t belong by the coffee table.
    They belonged at the kitchen table.


    “Ms. Arden?”


    “Could we discuss this at the kitchen table? That''s where those chairs belong.”


    The police officers stared at each other. “Excuse me?” said Lujan, speaking for
    the first time.


    The medication was definitely wearing off. She had police in her house, and they
    were moving things out of place. She was about to seriously freak out. “Those
    chairs belong at the table. I can''t talk to you with you sitting in the chairs
    in my living room. If you want to sit over here, you''ll have to sit on the floor.”


    Oh no. Had she really just told the police they''d have to sit on the floor?


    “Well, let''s just go to the kitchen table then,” said Carlisle, as if Grace hadn''t
    said anything crazy.


    Was it too late to call Royce back?


    Grace pushed herself up on her crutches and went to the kitchen table, where she
    sat down, feeling slightly better about the situation.


    The police put the chairs in the right spots and sat down too. “So were you upset
    when you lost your job at Mile High Innovations?”


    “Well, yeah,” said Grace. “I''d gotten a raise there every year. It was a total
    shock.”


    “And why do you think you were laid off?”


    “Royce said the CFO decided to lay off the whole department regardless of skill.”


    “Who''s Royce?” asked Lujan, flipping through papers on a clipboard.


    Grace held her hand up to her mouth, realizing she wasn''t supposed to say anything
    about Royce.


    Detective Carlisle said, “Who''s Royce, Ms. Arden?”


    She drew her hand away from her mouth. “Um, Royce is the man from Greener Pastures
    who told me I lost my job.”


    “Here he is,” said Lujan. “He was also the 911 caller.”


    “The man who did the layoffs was the 911 caller?” asked Carlisle.


    “Yeah,” said Lujan. “I hadn''t made that connection yet.” He started writing stuff
    down.


    “Do you know Royce Hendrix? Why was he here last night? We were told he''d gone
    on to the next job. Is it in Denver?”


    There was no reason Grace should know the answer to that. She could just shrug
    or make a non-committal comment. Her eyes blinked over and over as she stared
    at Carlisle. Just a shrug. and maybe they would go.


    “Were you friends with Jeff Harris?” asked Carlisle, changing tack.


    Grace couldn''t help but sigh. At least she''d moved on from Royce. “Not really.”


    “Were you close with any of the other Java programmers?”


    “No.” Though it was the truth, it sounded bad to Grace''s ears. She kept talking
    to try to make it sound better, but it only got worse. “It''s hard to get to know
    me, being OCD and all. I''m not exactly warm and fuzzy.”


    “Where were you last night around eight?”


    Why were they asking her that? She hadn''t done anything wrong. And why were they
    still in her apartment, sitting in her chairs? “I was here. I can''t get around
    very well.”


    “Was anyone with you?”


    Focused more on hoping they''d leave then anything else, she blurted out, “Jill
    and Royce were with me.”


    Lujan leaned forward and said, “Royce the 911 caller?”


    “Oh shit.” She smacked her hand over her mouth. She shouldn''t have said that
    out loud. They needed to get out of here. She had rules about people being in
    her apartment. Rules...


    “Why was the man who fired you here?”


    Just as she asked the question, the door opened, and Royce barged into the apartment.
    Grace would''ve jumped up if she could, but instead, she blurted out, “You shouldn''t
    be here.”


    “I couldn''t do it,” he said. He ignored the police, but they stared at him as
    if trying to piece together a puzzle. “I couldn''t go and tell all those people
    their company didn''t want them anymore. You''re right. It''s not a job for me.
    I can do better.”


    “You quit?” Grace pushed herself into a standing position. The world spun, though
    she didn''t know if it was from the drugs or from Royce''s news.


    “Yeah, I quit.” He left his suitcase and laptop at the door and stepped toward
    her. But before he reached her, Detective Carlisle stepped between them.


    “Are you Royce Hendrix?” she asked.


    “Yes,” he said.


    “Did you fire Jeff Harris?”


    His shoulders slumped. “Yes.”


    She nodded to Detective Lujan, who approached him with handcuffs. She said, “You’re
    under arrest for the arson that occurred at Mile High Innovations last night.”


    Grace couldn''t believe what was happening. As Detective Carlisle began giving
    him his Miranda rights, Grace said, “No. He didn''t do it. He was with me.”


    “It''s okay, Grace. The arrest won''t stick. I never had the keycard.”


    “But...”


    He shook his head as if he didn''t want her to say anything. Probably a good idea
    since she''d already blurted out too much. She couldn''t believe she''d done this
    to him after he quit his job for her. She stood helplessly as they led him out
    the door in handcuffs.


    Detective Carlisle turned around and said, “I wouldn''t go too far from home,
    Ms. Arden. I suspect we''ll be seeing you again soon.”


    A shiver crept up her spine. When the door closed Grace crutched herself over
    to her phone. She hated to ask, but she was tired of getting lectured on not relying
    on her friends. She punched Jill''s name and waited for her to answer. She said,
    “I need your help. Royce has just been arrested, and it’s all my fault.”


    ## 22 Emails


    Jill arrived at Grace''s apartment faster than Grace thought possible, especially
    when she saw she had two steaming mochas with her.


    Jill got right to the point when she sat down at the table with Grace. “What was
    Royce still doing here? I thought he had a flight back to Tulsa.”


    “He quit,” said Grace, still stunned by his act of love and her unwitting betrayal.


    “Man, he must really be in love,” said Jill. “Is he moving here?”


    “I have no idea. He came back while the police were here, announced he''d quit
    and got arrested.”


    “Well, you''re not going to like what I have to tell you.” Jill pushed a mocha
    towards Grace and waited for her to have a sip.


    Grace didn''t know if she could take more bad news. She took a sip, hoping the
    caffeine and chocolate would bolster her spirits.


    Jill said, “I worked out of the other Mile High Innovations office today and went
    over to Tony''s for lunch as usual. All your old coworkers were there talking.”


    Grace thought of all the emails she''d received that she hadn''t read and the
    texts she got while she was at the doctor. There must''ve been an invitation in
    there somewhere. “That doesn''t sound so strange.”


    Jill put her elbows on the table. “They called me over and asked if I''d heard
    from you since Friday. It was kind of weird the way they asked, like they were
    sussing me out. So I lied and said that I had no idea what had happened to you,
    and I sat down and asked what was going on. Why didn''t you tell me Doug was at
    Breckenridge too? Did he hit on you?”


    Grace slid the mocha away and put her head on the table. When she came up, she
    said, “I''d forgotten about Doug. He kept asking me out, but you know how he is...turning
    any compliment into an insult. He saw me and Royce together after I broke my leg
    and freaked out.”


    “Well, he was there making you sound like the biggest slut in the history of the
    corporate world. I finally punched his arm and told him to knock it off.”


    Grace squeezed Jill''s hand. “Thanks. I owe you, like, ten times.”

