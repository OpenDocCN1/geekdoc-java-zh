  trans: '

    她摇了摇头。“我不让别人进我的公寓。泰德不能进来。也许你也不该进来。”


    罗伊斯用双手托住她的脸吻了她。他的手和唇抚慰了她的心绪。也许她可以让罗伊斯进来，但绝不会让泰德进来。


    他直起身体说道：“我会把你的东西直接推进去。我不想让你所有的东西都留在门外。对你来说，把这些东西搬进来太累了。你现在的`crutches`用得方便。”


    格蕾丝把手放在肚子上，深呼吸了几次。“泰德可以先在车里等一下吗？”


    罗伊斯闭上眼睛。也许他在心里在倒计时，因为她太让他沮狂了。他睁开眼睛说：“我看看办法。他其实无无的，只是说话很粗俗。”


    “我不让别人进我的公寓。只有吉尔进去过。”


    “噢，我很高兴你和吉尔关系那么近。我希望你给她打电话，告诉她我们之间的事还有你断腿的事。你这周得约个时间把骨接好。”


    泰德大喊道：“在这儿呢！”


    格蕾丝转过身体看向窗外。罗伊斯把手放在她的肩膀上说：“没事的。我会处理的。”


    罗伊斯跳了。他砰地关上门，跑过去和泰德说话。她看着泰德朝她点头，罗伊斯翻了个白眼。她甚至不想知道泰德在说什么。


    罗伊斯回来打开 SUV 的后箱。“，把我的东西放在租车里，我去拿她的东西。谢了。”


    真松了一口气。公寓里没有泰德。他抱起她的包放在地上。他走到她门口打开门。“是哪把钥匙？”


    “是带紫色丝带的那把。”


    他在拿起她的东西并费力走上楼梯之前，先吻了她一下。


    格蕾丝决定坐在车里等罗伊斯回来太傻了。她迟早得自己解决楼梯之类的问题。不应该那么难。她伸手向后座去拿她的`crutches`。她把它们滑过控制台，挪到人行道上。车和地面之间有一个很大的台阶。她以前从没想过这个问题。


    “嘿，你需要帮忙吗？”泰德走过来问。


    她摇了摇头说：“我确定自己可以行，谢谢。”


    泰德看起来并不那么确定，站得得比她喜欢的还要近。她从椅子上滑下来，用好的一只脚落地，但失去了平衡。她身体前倾，无法停住。


    泰德抓住她的肩膀，帮她跳着离开了门口。她所有的肌肉都紧了，但她还是挤出一句简短的“谢谢。”


    泰德在她身后关上门说道：“嘿，我想为周五晚上的事道歉。我没意识到罗伊斯有多喜欢你，真的没想过你会记得我。我不是想在你工作的事上刺你心疼。”


    格蕾丝眨了眨眼。他看起来很有礼貌，关于罗伊斯有多喜欢她的评价让她有些吃惊。“谢谢。这几天过得很不好。”


    “噢，如果这能让你好受点的话，连木屋里的那些女人都觉得你很辣。”


    “什么？”一股火气传遍全身。


    “是啊，我遇到一个叫凯莉的女人，她说希望和你发生关系。她是那个在酒吧里和滑雪教练做爱的女人，还说你在看。她在做的时候，她看到你我在一起聊天。”


    格蕾丝觉得自己快晕倒了。难道还有人不知道她在看凯莉和那个医护吗？她好的一条腿一软，但两只有力的手接住了她，罗伊斯说：“你还好吗？泰德，你对她说什么？”


    “什么都没说。我只是和她聊聊酒吧那对夫妇。”


    格蕾丝找回平衡，退开罗伊斯。“谢谢你送我回家。可以把钥匙给我吗？”她费力伸出一只手。


    “不，我送你上去。”


    “求你了，”她说，不敢直视他的眼睛。


    罗伊斯转身冲向入口。他打开大楼的门并把它撑开。她无视了泰德，用力挪了过去。腋下很疼，但其他地方大碍。在里面，她没对罗伊斯说一句话就走完了那层楼梯到达公寓门口。她的行李箱和滑雪板在门外。


    “我确定他说的那些话没什么坏的，”罗伊斯评价道。


    她终于看着他说：“为什么没有人 watch 看那对人在亲热，但显然所有人都在看我看他们？”


    “他们没看，宝贝。”他把她拉进怀里，她靠在他身上放松了下来。


    “因为那次意外，我会收到多少邀请？”


    罗伊斯后退一步，手依然放在她的肩膀上。“泰德调戏你了吗？”


    她摇了摇头。“不，只是那个女人，凯莉。他告诉我她在找我。”


    罗伊斯笑了。“对女人也这么热。”


    “噢，我知道怎么回事了。你嫉妒泰德调戏我，但另一个女人就完全不同。你并不想要三个人行。”


    “当你觉得会是我我和乔治·克鲁尼时，你很感兴趣的。”


    格蕾丝翻了个白眼，但不由自主地笑了。


    他举起她的钥匙说：“哪把是你的？”


    “给我给好。剩下的交给我。”


    “不，我送你上去。”


    ## 分离 16


    在和行李搏斗了几分钟后，格蕾丝用好的一只脚踢开它，撑起拐杖走向冰柜。她想像以前从滑雪回来时那样进行拆包仪式，但她的腿在作痛。她的心更疼。


    格蕾丝挪到沙发旁，把腿搁在靠垫上，在受伤的地方敷上冰袋。


    看着 DVD 播放器上的时间，她心里算着这段关系的数字。她在周五早上 7 点遇到罗伊斯并为他倾倒。然后三小时后，在他传递她被裁员的消息后，她恨他。失去工作大约十小时后，他发来信息，她给了他一个耳光。遇到他三十二小时后，她和他比滑时摔断了腿，而这竟然成了她恨之不得的开始。随后是一个夜晚的亲吻，罗伊斯偷走了她的心。这是一场持续
    56 小时的恋爱，充满了清晨的争吵和和好的早餐。


    她不知道自己还能忍受多少。


    她从咖啡几上拿起手机，点开吉尔的名字。她想倾诉发生的一切，但她真的无法开口告诉吉尔，她爱上了那个开除她的男人。吉尔会认为她是个彻头彻尾的失败者。

