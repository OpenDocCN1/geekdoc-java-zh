    her hop to her other foot and clutch his arm with both her hands. “Fuck.” She
    put her head on his shoulder without even thinking about it. The pain was like
    nothing she''d ever felt.


    He wrapped his other arm around her back and said, “Want me to get the ski patrol?”


    Grace didn''t want to answer. His arm comforted and humiliated her all at the
    same time. Maybe if she stood for a few minutes, the pain would subside enough
    for her to make it down on her own; it was only a little farther. He lifted his
    arm from her back, and it felt like he was waving.


    She heard a shooshing behind her. Someone stopped a little below and crunched
    back up.


    “You guys need some help?”


    Grace looked up and blushed: it was the scruffy ski instructor who''d had sex
    with his date while she gawked, except he was wearing a red coat with a white
    cross on the front like he was a medic. A smile grew across his face, and her
    cheeks burned hotter.


    Royce said, “She hurt her ankle or leg, I think.”


    “Oh bummer. I''ll go get the snowmobile and take you to the clinic.”


    Grace found her voice and said, “I don''t think I need to go to the clinic. I''m
    sure I just twisted--” she ended with a cry when she tried to step forward. She
    was probably cutting off the circulation in Royce''s arm by now. When she balanced
    herself again, she loosened her grip.


    “Looks like a snowmobile,” said Royce.


    “No problem,” said the patrol guy. “I''m happy to help. I''m Eric by the way.”
    He winked at Grace before turning and skiing down to the lodge.


    “Did you see that?” said Royce. “He winked at you. I could be your boyfriend,
    and he''s flirting with you.”


    “Maybe he saw me slap you last night.”


    “I think he was a little too busy to notice that.”


    “Well, he wasn''t too busy to notice me.” Grace wanted to snatch the words back
    immediately.


    “You''re a little kinky, aren''t you?” He grinned at her and put his arm around
    her back again.


    “No, you have me all wrong. I shouldn''t have said that. I have rules when it
    comes to dating.” She tried to shove his arm away, but it made her almost fall.


    He tightened his arm and said, “I didn''t mean to upset you. I just saw you watching
    them last night.”


    “It was hard to look away, okay? I couldn''t believe I was the only one noticing
    or that they would just do that.” She swayed again, and didn''t let him fall.

