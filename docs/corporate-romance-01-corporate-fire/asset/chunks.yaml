    她尽力在不让腿太疼的情况下从瑜伽裤和内裤里滑出来。罗伊斯脱掉剩下的衣服快得多，站在她床边，昂首勃起。当她推开衣服后，她挪到床边，将他的阴茎握在手中，想要尽可能带给他更多的快乐。


    她从他的睾丸一直舔到顶端，然后将其含入口中。他呻吟着，手指穿过她的头发。“别太用力，格蕾斯。我不想来太快。”她很高兴看到自己已经让他如此兴奋，于是在他阴茎上来回地舔舐。他的呼吸变得急促，抓着她的头慢慢抽了出来。“轮到你了，这次我不会听从任何拒绝的。”


    他的手落在她的肩膀上，将她按在床垫上。直到他跪在地上并分开她的双腿，她才意识到他的意思。她张开嘴想要抗议，但他的舌头舔舐着她私处的褶皱。他用手指将它们分开，舌尖正抵在她的阴蒂上。她倒吸了一口气——快感席卷全身。他的舌头快速拨动，她的臀部在他身下起伏。她希望自己没有伤到他，但快感太让她沉醉，没时间顾及太久。他的舌头改变了力度并进入她的体内，让她在意想不到的尖叫中陷入了极乐。她试图挣脱他的手的束缚，因为那种强度已经超过了她的承受能力，但他继续舔舐的同时，用双手按住她的乳房。另一声尖叫和几声呻吟传出，随后他抬起了头。


    ——嗡嗡嗡。


    格蕾斯的身体僵住了。她完全忘记了吉尔。


    “你在等别人吗？”罗伊斯站起来问道。


    格蕾斯坐起来。“真抱歉。是吉尔。她要给我送一杯摩卡咖啡。你出现时，我完全忘记了她要来了。”这糟了。在已经邀请了她过来而且周末又没给她发信息的情况下，她不可能推掉吉尔。但罗伊斯在这里，而她没有告诉吉尔任何关于他的事。“我应该去接接电话的。真的很抱歉。”


    “没关系。我去收拾一下，在外面接你。”他对她一笑说：“反正我知道我想等一个特别的夜晚。”


    “但刚才真的棒极了。”


    嗡嗡嗡嗡嗡嗡。


    “听到你这么说我很高兴，因为你刚才那么犹豫。把衣服穿好。”


    这下麻烦了。


    ## 19| 吉尔


    格蕾斯手忙脚乱地穿衣服，跳到客厅。她按下对讲机的按钮。“抱歉，是你吗，吉尔？”


    “我带着摩卡咖啡和马芬来了，格蕾斯，我不打算走的。”


    格蕾斯按下按钮让她进来，没有回答。她设法让手沿着墙壁去拿拐杖，然后打开门看到吉尔正要敲门。


    “格蕾斯！发生什么了？”


    “我滑雪时摔断了腿。”


    “祸不不单单？你为什么不告诉我？”


    “我还在为被解雇感到尴尬。”


    “财务总监才是应该丢脸的人。没有你，高海拔创新公司（Mile High Innovations）就要完入厕桶了。我不知道他以为是谁完成了所有的编程工作。”


    吉尔推过她身边，将摩卡咖啡和马芬放在厨房餐桌上。即使穿着牛仔裤和 T 恤，她看起来依然很迷人。格蕾斯每天都要做一套完整的美容程序才能看起来平平，但吉尔穿上囚犯服看起来也像个模特。罗伊斯约的是格蕾斯而不是她，这真让人惊讶——他甚至还没来解雇吉尔。


    吉尔坐在椅子上继续说道。“快点，拿杯摩卡。我有事要告诉你。”


    格蕾斯满脸通红，坐下从提袋里拿了一杯摩卡。“嗯，吉尔，有些事我需要告诉你。”


    “我知道。你保守了你周末的秘密欠我一个大个人情，所以说出来吧。”


    吉尔盯着格蕾斯，嘴里的马芬停在半路路上。“天哪，格蕾斯。你这儿有个男人？是你吧，对不对？和那个布雷基农镇的家伙在一起？”


    罗伊斯走了出来，衬衫没塞进去，领口敞开，但其他地方看起来比格蕾斯状态要体面。“嘿，吉尔。很高兴在更好的情况下再次见到你。”


    吉尔跳了起来大喊道：“你？你到底在这里干什么？我告诉过你要离她远点。”


    “什么？”格蕾斯问道，希望也能跟着跳起来。“你为什么要告诉他？”


    “他和他的小跟班在讨论怎么搞定你的身体，我带了一个同事回去开除掉了他们。我本想警告你的，但我想你的规矩已经足够保护你了，我不想让你担心。”


    格蕾斯把好的一条腿抱在胸前。她刚刚告诉过她爱他。她刚刚比以前对男人任何时候都更加脆弱。她的偏执排除了这些事实：是他先说出爱她的，而且他一直对她很体贴。


    吉尔继续争辩，而格蕾斯保持沉默。“别把这一切都归咎在他身上。看看你是在做什么工作的。这也是你工作的一部分吗？你们挑选那些漂亮的女孩并进一步伤害她们？”


