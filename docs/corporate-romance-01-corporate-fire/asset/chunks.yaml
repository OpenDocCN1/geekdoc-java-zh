    the smell of sunblock from earlier in the day. A guy who looked scruffy like a
    ski instructor sat on a stool with his back against the bar and stared right at
    Grace. He nodded towards her, and his blond bangs fell over his eyes. Her eyebrows
    rose in surprise, and she twisted her head to see if a beautiful woman was behind
    her; she was used to being ignored. When she saw no women close to her, she turned
    back to the guy and gave a hesitant smile. He actually smiled back. Not love at
    first sight, but he was the eye candy she''d been hoping for.'
