    “This is a program I wrote in my spare time. Royce said he''d help me market it,
    and I was wondering, if you liked it, if you''d tweet about it when I have it
    up and running.” She handed her phone over to Jill.


    “You made this?” asked Jill, sitting up.


    “It''s awesome,” said Royce. “Totally addictive like those Facebook games.”


    “How would you know?” asked Grace.


    “I spend my fair share of time on Facebook.”


    “How do you play it?” asked Jill.


    Grace showed her and watched her friend catch on faster than Royce had. She gave
    him a sidelong glance, and he said, “Well obviously it''s aimed more towards women
    than men.”


    “It''s okay. Jill''s the queen of app games. Believe it or not, I was planning
    on asking her to be one of my beta testers before I got laid off.”


    “Oh, official terms. You''ve been reading the links I sent you.”


    Grace hit him with a pillow. “I knew about beta testing before you told me.”


    Jill paused the game and said, “This rocks. When are you planning on uploading
    it? I''ll tell all my friends about it.”


    “I hope pretty soon. I just had a few secret levels to add in because it seems
    like app games don''t have as much in the way of secret levels as other games.”


    “So true. Can you put it on my phone? I should go home and get some sleep so I
    can keep up with everything tomorrow. On the bright side, if we''re all out of
    a job, we''ll incorporate with Grace and make her churn out the app games. We
    can ride on the coattails of her hard work.”


    Grace rolled her eyes. “It''s not going to be another Flappy Birds.” She held
    out her hand for Jill''s phone and asked Royce to get her a connector from a drawer
    in the entertainment center so she could transfer the game over. When it was loaded
    up Jill took off, leaving Royce and Grace finally alone again.


    Unfortunately Royce made no move to resume where they''d left off.


    He leaned back against the futon and stretched an arm behind Grace’s shoulders.
    “So I have a suitcase in the car. Should I go get a hotel room, or can I crash
    here?” He sounded exhausted and definitely not in the mood to pick up where they''d
    left off before Jill arrived.


    Grace didn''t know whether to push it or not—their relationship had tumbled into
    new territory for her from the beginning. All she knew was he''d be gone again
    tomorrow. “I just assumed you were staying here tonight.”


    He lifted up her chin with his finger, and the gaze from his dark eyes smoldered
    with desire. “I never assume when it comes to you. Should I sleep on--”


    “My bed.”


    He smiled and kissed her. “I wish I wasn''t so tired, and I know that my boss
    will call me early in the morning. How are you holding up?”


    “Pretty good. I''ll be glad when tomorrow is over, but not when you leave.”


    They kissed awhile on the futon—chaste and tender, her heart reaching out to his
    more and more. When he finally withdrew like he intended to stand up, Grace took
    both his hands in hers and kissed the tops of them. “I love you, Royce. I''m sorry
    about the scene with Jill, and I’m sorry I shut her out when I was let go. It
    wasn''t my intention to hurt everyone. I was so worried about protecting myself
    that I didn''t see the pain I was causing.”


    He flipped their hands so hers were on top and kissed them in return. “I''m so
    glad you''re letting us in...” he gave her a lopsided grin. “Well, particularly
    me, but having Jill as a friend will be really good for you. I love you too, which
    is hard for me to believe so early on in our relationship. Be patient with me
    about my job. I have a lot to figure out.”


    Grace nodded. He let go of her and stood up. “The keys are in the basket,” she
    said. “I''ll get ready for bed since it takes me at least five times longer to
    do everything.”


    “I''ll be right back,” he said with no hint of desire to make love when he returned.


    Damn it. Even though she knew she was tired, just having him around was keeping
    her awake like she''d had ten cups of coffee. She cleaned up, but he still hadn''t
    come back. It really shouldn''t take so long to get his suitcase.


    She pushed back the worry that he''d ditched her and gone to a hotel. She''d already
    been through that at the ski resort and didn''t want to do it again. But as she
    sat on her bed in fresh satin pajamas and waited and waited it became harder to
    think that he''d stuck around.


    At last she heard the front door open. She hopped to the doorframe and peered
    out. Royce left his suitcase by the door and slung his laptop onto the futon.


    “I thought you left,” she said.


    He looked at her, his face a blank slate. “I considered it. I''m not going to
    be good company right now, but I decided that would really torpedo our relationship.
    I don''t want to lose you.”


    “What''s wrong?”


    “I drove somebody to arson, Grace. It''s a little bit of a wake up.”


    “Don''t be testy with me. All I''ve heard is how I need to be patient and understanding
    about your job.”


    “I don''t want to fight about this. The `CEO` in Tulsa is thinking about what
    I said, but I don''t think I won him.”


