  raw: 'Damn it, now she had to think of a place. Tearing down the slopes with powder
    flying everywhere popped into her mind—and right next to her on the slope was
    the gorgeous god who''d canned her. She clenched her jaw. She needed to get that
    guy out of her head.. “I''m going to Breckenridge.”


    “Great idea. Skiing might be just what I need. Maybe I''ll see you there.”


    Oh hell in a hand basket, that was not what she wanted at all.


    As she scrambled for a reason to change her mind, Jill came up and said, “Take
    off, Doug.”


    Doug frowned but walked away. Men always did whatever Jill wanted.


    Jill walked into her cubicle, and for the first time, Grace noticed her new navy
    skirt suit. Her blonde hair was pulled back and most likely twisted into some
    sort of cute bun. Her eyes were normal again, and she''d even cleaned up her mascara.
    She said, “You okay, Grace?”


    Her throat swelled, and pressure hit the backs of her eyes. Her friendship with
    Jill was over. Oh, sure, Jill would still make an attempt to call and include
    her when she went out, but the calls would become fewer and further between. It
    was like signing a yearbook for someone you knew you''d never see again.


    She couldn''t stand it. She pulled her backpack on and said, “Thanks for trying
    to warn me. You must think I''m such an idiot.”


    Jill blocked her exit and embraced her. She whispered, “You''re not an idiot.
    The CFO is. I know change is hard for you, so call me, and I''ll help.” Grace
    squeezed her hard and tried to break the embrace, but Jill still whispered, “And
    I wanted to warn you--” Jill stepped back and held her shoulders.


    Grace''s throat tightened, and she started breathing faster.


    Jill shook her head, “No, sorry, never mind. Your rules will keep you safe I''m
    sure.”


    Grace took a deep breath and relaxed. “Were you going to warn me about Doug asking
    me out? Don''t worry. I plan on never seeing him again.”


    Jill''s lips smiled, but her eyes didn''t.


    Grace couldn''t debate it because tears wanted to leak out again. She had to get
    out of there before she started bawling. “Thanks for everything, Jill, but I''ve
    gotta go.”


    She pushed past Jill and heard her cry out, “Call me, Grace!”


    But she didn''t know if she had it in her to hang on to what she knew was crumbling
    in her hands.


    ![](images/00002.jpeg)


    Back in her apartment Grace stood in her hospital-clean bathroom and scrubbed
    at her fingernails with a cotton ball soaked in nail polish remover, the acrid
    smell filling the room. The stain clung at the sides, taunting her.


    She found a Q-tip, dipped it in remover and scoured the sides of her nails. She
    couldn''t stand the feeling of helpless anger and sorrow. She half wanted to hit
    the streets and look for a new job right then, but it was Friday and she''d just
    been let go—probably not a good mix. Damn it. The nails still had a hazy stain.
    She got a new cotton ball and started all over again.


    Maybe she should go skiing. She feared that Doug would show up, but Breckenridge
    was big. Even if he went, she could probably ski the whole weekend without running
    into him. Cobalt eyes hovered before her, reminding her of her earlier daydreams.
    She''d actually been thinking about bending the rules for that guy. What a mistake.
    This was exactly why she had them to begin with.


    Grace stomped back to her bedroom and clicked through the rules as she neatly
    folded clothes into her suitcase. She couldn''t help it—she was a coder, and okay,
    about as OCD as you could get without being medicated for it. Everything for her
    had to have rules. To reach the moment in a relationship where she could have
    sex, the man had to be up for a bit of a wait.


    Rule 1: He had to be in some way connected to one of her circles of friends, like
    a friend of her book club friends or her best friend''s cousin, something like
    that. It made her feel safer to know he wasn’t a complete stranger.


    Rule 2: She wouldn''t kiss him for three dates. This was a deal breaker for guys
    who needed to shove their tongue down her throat after the first date, or even
    before the first date ended. One date was not long enough for such intimacy.


    Rule 3: If the kiss after the third date went well, she still needed to go on
    at least 10.5 dates with them before having sex. It used to be 14, but she whittled
    it down since Jill kept telling her three dates was the norm for sex, not just
    a kiss. And when the big sex date finally arrived, it was always at his place—never
    at hers.


    She sighed and shut her suitcase. She was hopeless. Maybe she could discover that
    mythical love at first sight, and the rules would fade away. That “greener pastures”
    bastard said she needed to seek out new opportunities. She couldn''t believe she''d
    thought of him as a corporate god—he was a corporate devil.


    When she picked up her suitcase, she spied her app programming books in a neat
    pile on her desk. She was very close to finishing a game she''d designed and hoped
    to upload. She grabbed the extra smart phone she used for testing apps along with
    her books and laptop. She''d finish it up in the evenings and forget about love.


    3| Bar Notes


