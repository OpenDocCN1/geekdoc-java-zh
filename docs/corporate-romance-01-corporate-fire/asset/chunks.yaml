  raw: 'She texted, “I''m back home. Sorry again for not texting you before and for
    bawling over the phone.” She put the phone in her lap, and a few seconds later
    it rang. Jill.


    “Hey,” said Grace.


    “Hey yourself. I thought you weren''t coming home until tomorrow. You didn''t
    have another fight with that guy you hooked up with, did you?”


    Grace stared at her broken leg and gritted her teeth. “No, he got called back
    to work unexpectedly, so I came home.”


    “Oh.”


    The one word told Grace that Jill didn''t think the guy was going to call her
    again. She forced herself to remember all his reassuring words so she wouldn''t
    think the same thing.


    Jill said, “I so want to know what happened, but I''ve got my spinning classes
    to teach. How about a late night mocha?”


    Grace stared at her leg. She couldn''t just put Jill off because maybe they really
    could be friends beyond work, but if Jill saw her leg, she''d spill the whole
    story about Royce. Her throat tightened, and she felt panic setting in. “I''m
    pretty beat. I think I need to sort out what happened before I tell you about
    it.”


    “Well you''d better be ready tomorrow because I''m seeing you even if that means
    barging into your den of solitude. Got it?”


    Grace had to smile. “Okay, I''ll call you tomorrow. And thanks for checking up
    on me.”


    After Grace hung up the phone, she dug her way back into her bag to get her medicine.
    Knowing Jill was coming by tomorrow bolstered her spirits. She''d get Jill''s
    opinion about the situation. She could just say she met a man who traveled a lot
    and didn''t know if she could handle a long distance relationship.


    Medicine swallowed, it was time to conquer the back from skiing unpacking ritual,
    but it was more like the ritual conquered her. Instead of keeping her thoughts
    off Royce, it reminded her that he was traveling further and further away from
    her. It didn''t help that everything took ten times longer to do.


    She unpacked and filled a plastic bag with her dirty clothes. She crutched them
    over to the washing machine and started a load. She somehow managed a real shower,
    but it was far from relaxing, as a hole in her heart grew wider and wider with
    Royce''s absence. After fighting to get dressed, she ate a bowl of cereal over
    the sink and then crutched herself up and over to the couch to settle.


    She grabbed her phone off the coffee table and saw she''d missed a text from Royce.


    “Landed in Tulsa. Wished the whole trip you were holding my hand.”


    She couldn''t bring herself to answer the text. The reality of his travel gave
    her too much pain.


    She put her foot up on the coffee table and clicked on the television. She found
    a movie to watch, but her mind kept drifting. When the phone rang, she answered
    it right away.


    “Hello?”


    “Hey sweetheart. God I miss you. Why didn''t you answer my text?”


    She waited a moment before answering, trying to collect her emotions together
    into something coherent. “Because everything hurts. I don''t know if I can do
    this.”


    “Do what? What do you mean?” His voice sounded tired and a little frantic, making
    her regret her words.


    “I''ve never been in a long distance relationship. It''s almost worse than my
    broken leg.”


    “It''ll be better in the morning. Sunday night is always the worst, but by Wednesday
    we''ll be enjoying the anticipation of seeing each other on Friday.”


    “God, you have it down to a routine.”


    He sighed, and she heard something slide down a wall. Maybe he was leaning on
    one. “Yes, I''ve been in long distance relationships before, but I...I''ve never
    wanted to forget it all and stay with a woman as much as I want to stay with you.”


    She pressed the phone closer to her ear, but it didn''t make him appear by her
    side. “I don''t know what to say, Royce. You know how I feel about your job. I''ve
    gotta go. It''s hard to hear your voice without holding you.” She clicked the
    phone off and leaned back on the couch. The whirlwind of the weekend had finally
    ended, leaving her to face the wreckage and collect anything worth keeping. She
    wanted Royce to be in the pile she kept, but he wasn''t even there to collect.


    17| Up and Down


    Grace woke up and decided to stay under the covers for a change. For one, her
    leg felt like a hundred pound weight filled with agony, and for another, she hadn''t
    thought up a new routine yet. She slid her phone off her lamp table, hoping for
    and dreading a text from Royce. She didn’t deserve a text after the way she''d
    hung up so abruptly last night. The hole of him being gone didn''t seem quite
    so huge this morning, but nothing was so horrible after just waking up—she was
    sure by afternoon she''d be miserable again.


    She pushed her phone on.


    No text.


    She put her phone back on the lamp table and stifled her disappointment. She slid
    her laptop onto the bed, or tried to. That required actually sitting up, which
    took forever. Once settled, she opened her email, which she hadn''t checked since
    Friday. Emails from coworkers who had also been fired cluttered up her inbox,
    but she hardly saw them because an email from Royce was right at the top as the
    most recent. She clicked it open. Whoa, it was much longer than she''d expected.


    Good morning, Grace. Take today to be miserable. You get one.


    Grace had to smile. It was so unexpected to hear him say it was all right to be
    depressed. She continued reading.


    But you do need to get one thing done, and that''s finding and making an appointment
    with an orthopedist. From my research, these are the best ones covered under your
    company''s insurance.


    He gave her a list of three with hyperlinks to websites.


    I think you also need to fill your prescription, and I''m sure Jill would be happy
    to help you with that.


    The next part outlined what she should do on Tuesday.


    Tomorrow, call Terri and have her get started on finding you a new job. And then
    work on finishing Jewel Chase and researching how to market it. Here are some
    sites to help you.


    More hyperlinks. Man, he was thorough. He really was on the wrong side of the
    business.


    His closing paragraph made her catch her breath and pushed the hole of his absence
    wide open.


    You have no idea how scared I am that you''re going to give up on us right away.
    We need more time together to see where this is really going. I''ll book my Friday
    flight today and text you with my arrival time. Please text me when you make your
    appointment with the doctor. Royce


    He was such a bastard for being so helpful. Didn''t he realize he was making her
    miss him more? Still, she smiled as she took her crutches and made her way out
    to have breakfast. She was halfway through her bowl of cereal when the downstairs
    ringer buzzed. She went to the intercom. “Yes?”


    “Flower delivery for Grace Arden.” Her eyes widened, and she buzzed him up. When
    she opened her door, she saw a huge bouquet of pink gladiolas ascend the stairs.
    A man carried them, but she couldn''t see his face until she managed to take them
    from him in front of her door. He offered to carry them inside for her, but she
    refused. When he left she tossed one crutch inside and used the other to help
    her limp in and over to the kitchen to find a vase. Once the flowers were in the
    vase and watered, she pulled out the card and read, “I can''t wait till Friday.”


    She returned to her phone, on the verge of calling him. She had no idea what his
    schedule was. Maybe a text would be better. No, she wanted to hear his voice.
    He probably had his phone off if he couldn''t talk, so no harm in calling. She
    pressed his number, and he answered right away.


    She said, “The flowers are beautiful.”


    “I''m glad. I wish I''d delivered them myself.” He sounded beat, and it was still
    the morning.


    “Everything okay?”


    “This company''s in bad shape. I''m trying to save all the employees who''ve kept
    the company from completely failing, but it''s hard.”


    She touched a flower petal. She couldn''t exactly feel sorry for his position,
    but her spirits lifted at the thought of him trying to save people''s jobs. “I
    know you tried hard for me. Maybe it''ll work out better this time.”'
