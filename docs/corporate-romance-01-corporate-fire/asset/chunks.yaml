    She gave her head a slight shake and wished another cosmo would appear. But if
    Doug was sitting with her, the stranger might lose interest. “Nothing. You know,
    telling you I was coming to Breckenridge was not an invitation.”


    “Yeah, but this gives us a chance to get to know each other away from work. We
    missed you at Tony''s. Did you hear Jeff slugged the guy who fired you?”


    “What?”


    “Ah, that got your attention. Security had to escort Jeff out and everything.”


    “He punched him?” Grace didn''t know why she felt sorry for Royce. Getting punched
    was getting off easy compared to losing your job.


    Doug placed his hand on top of hers and said, “Does that turn you on? Should I
    find out where he lives and hit him too?”


    “What? No!” Grace wriggled her hand out of his grip. The touch and the notes and
    the sex at the bar converged in her mind and made her gasp for air. She might
    go into full-blown hyperventilation.


    “What is with you--”


    As if to save her, the waitress slid another cosmo in front of her followed by
    another napkin.


    Grace reached out to take the napkin, but Doug snatched it away. He read out loud,
    “I''m sorry if that''s your date. Should I quit sending drinks?”


    “Give that to me!”


    Doug looked around the room and said, “What the hell? You''re flirting with someone
    you''ve never seen? I heard that you''re a prude.”


    Grace grabbed the stem of her new cosmo glass, debating whether to toss it on
    him or drink it. She took a drink, her instinct to avoid making messes kicking
    in. The alcohol calmed her enough to settle her breathing. “Give the napkin back.
    It''s none of your business.”


    “Excuse me miss, is this man bothering you?”


    Grace turned to the stranger, excited that he must be the one sending the notes.
    He was boy next door cute. The odd thing was he looked familiar. Her heart raced
    as she spoke. “Um, it''s all right, thanks. Were you by chance sending me notes?”


    The man grinned, but before he answered, Doug jumped up and shouted, “You''ve
    been flirting with him all night?”


    “He''s been sending me drinks.”


    “That''s the asshole who fired me!”


    Grace''s blood drained from her head to her feet in a nanosecond. “What do you
    want?”


    He calmly held out his hand. “I''m Ted. I just came over to help you get rid of
    this guy. Come on. Let''s sit at the bar.”


    Angry at the layoff and the notion that one of the people involved was trying
    to ask her out, she tossed the cosmo on him and set the glass back on the table.
    “Get away from me.”


    A man behind her cleared his throat. She turned and saw the corporate god. His
    blue eyes appeared apologetic, and he said, “I think there''s been a misunderstanding.
    I was sending you the drinks while I tried to figure out how to approach you.
    I really wish we''d met under better circumstances.”


    “So you sent your partner to try to pick me up first? Is my life some kind of
    sick joke to you?” Her vision blurred with tears, and she slapped him right across
    the cheek.


    Ignoring whatever he was trying to say, she pushed past him and through the doors
    out to the dining room and then the lobby, clattering over the tile floor in her
    heels and stopping in front of the elevator. A hand fell on her shoulder and turned
    her around.


    “Doug, quit touching me!”


    But it wasn''t Doug. It was Royce. His name jumped to her mind all too fast. She
    hated him, so she couldn''t stand it that his freaking blue eyes made her pulse
    speed like she was on the slopes. He said, “I didn''t want Ted to talk to you.
    I had nothing to do with him coming over aside from being too chicken shit to
    do it earlier myself.”


    She should''ve been shrugging off his grip, but she didn''t. “Leave me alone.”
    The elevator opened, and she stepped in, free of his hand.


    He followed and said, “I''m sorry about how we met--”


    She pushed the button for the top floor. “Your job is the reason we met.” She
    slipped out of the elevator as the doors closed. His eyes seemed to plead with
    her not to go, though he stayed in the elevator.


    Grace turned to the stairwell and started her four floor hike with her legs and
    hands shaking. What kind of person fires other people for a living?


    Unfortunately, the kind who looks like a GQ model.


    ## 4 | The Wager


    Grace woke up later than planned to the sound of a text tone. She grabbed her
    phone off the lamp table and saw several missed calls and texts from Jill. She
    sighed, sat up and tried to figure out how best to answer her. “I''m being stalked
    by the guy who fired me,” came to mind, but she couldn''t even bring herself to
    joke about it.


    She was such a loser.


    The sum total of her night had been watching a ski instructor screw at the bar,
    fending off Doug, tossing a drink at ax man number one and slapping Royce. She
    shouldn''t even know his name. She hung her hand at the side of her bed and let
    the phone fall to the floor.


    The phone chimed again.


    She tilted her head off the edge of the bed to read it. “This is Doug. Join me
    for breakfast.”


    He shouldn''t even have her personal number. She had to get rid of Doug. Picking
    it up, she typed, “Go skiing. I''m not going to date you.”


    A moment later she read, “I''ve been waiting for you for a long time. Good skiing.”


    Grace dressed and made her way to the dining room. She saw the hostess at the
    station and was led to a booth on the right.


    “How many?” asked the hostess.


    Grace held up one finger.


    The waitress arrived. “All right, then. Coffee or orange juice?”


    “Both.”


    “Will do. And here''s a note from another customer.” She plopped a napkin right
    in front of Grace.


    Anger wrenched her stomach. She turned and saw Royce sitting in a booth the opposite
    side of the restaurant. He hadn''t shaved, making him look like a model for the
    cover of the L.L Bean catalog in his black sweater and ski pants. He smiled and
    raised his cup of coffee to her.


    Her gaze moved to the napkin. “I should''ve asked you on a date instead of laying
    you off. I''m sorry.”


    She clenched her hands together on top of the table as if that would stop her
    emotions softening. The blast of attraction the first time she''d seen him pushed
    against the pain of being dismissed from her job. Out of the corner of her eye,
    she noticed him crossing the room. Pain defeated attraction.


    She crumpled the napkin.


    He sat across from her and smiled. “Good morning. I hoped we could start fresh
    today.”


    “Funny, I hoped I would never see you again.” She threw the napkin at him. “Take
    your note and leave.”


    “I want you to know that the layoffs were a financial decision. Your program director
    was completely against you getting the ax. I know because he ripped the CFO a
    new one after you arrived.”


    Royce rubbed his cheek. “Your slap hurt more.”

