    Grace''s eyes widened. The contact of his lips had been too much, especially after
    the incident with Doug. Her throat tightened, and she wasn''t sure she could breathe.
    Eric sat in the snowmobile, and she saw Royce glaring at him. Royce said, “I guess
    you''ll win the race after all. I''ll meet you--” They roared away before he''d
    finished.


    Grace tensed all over. She wanted Royce with her, not this guy. Eric had the wrong
    idea about her. Even so, she wasn''t acting like herself. She hated Royce, but
    he could touch her without giving her a minor heart attack. It was all too confusing,
    especially now that her leg was throbbing with pain. Maybe that first attraction
    to him before he''d fired her had been stronger than she''d thought.


    The ride over to the clinic jolted agony into her leg. She thought she might scream
    before they stopped. At least the clinic was connected to the hotel.


    She couldn''t stop thinking about Royce helping her. What was his deal? Maybe
    he was just trying to assuage his career guilt by being so nice to her; it no
    longer seemed like a conquest game. But maybe he was just really good at the game—he
    played both bad cop and good cop.


    She squarmed. He''d seemed genuinely concerned for her. When would she see him
    again? He''d said something about meeting, but she hadn''t heard the last part.


    The snowmobile stopped. Eric stood up and came around to unstrap her. He said,
    “You were alone last night. Did your boyfriend get in this morning?”


    “He''s not my boyfriend,” said Grace. Stupid. She should''ve lied. Trying to avoid
    anything too awkward she said, “Do you give ski lessons too, or is this your main
    job?”


    “This is it. I''ll go get a wheelchair for you.”


    “I think I can walk--”


    “Forget it. You could barely stand.”


    He disappeared inside before she could protest further. Her leg ached, and she
    thought of all her problems—no job, no friends now that she''d completely ignored
    Jill for twenty-four hours, and no ability to even walk. She just wanted to—oh
    God. She had no way of getting home.


    Hyperventilation set in. She knew lightheadedness would soon follow.


    “Here we are,” said Eric, stepping out the clinic door, pushing a wheelchair.
    “Hey, are you okay?”


    “No. I can''t breathe right, and my leg hurts...it hurts a lot.”


    “It''s okay. I''ll help you in, and the doctor will be right with you.” He took
    her hand, but it reminded her of his lips on her ear. She breathed harder, and
    her anxiety soared. He pulled her up and into the wheelchair and said, “There
    you go. You know, Carrie thought you were hot too. She was hoping to see you later
    tonight.”


    “Carrie? What?” The pitch of her voice rose to glass shattering range.


    “The woman I was with last night.”


    She couldn''t handle this. She gripped the arms of her wheelchair until her veins
    popped out on her arms.


    “I never did that before. How about you? Do you just like to watch, or are you
    an exhibitionist too?” He chatted like this was an everyday conversation as he
    wheeled her up a ramp and into the clinic.


    Dizziness overtook her. She must''ve looked pale because he said, “Hang on. You''re
    going into shock. I''ll get you a blanket.” He ran through a door and came back
    with a fuzzy blanket that he wrapped around her shoulders. He moved a lever on
    the wheelchair to prop her leg up and asked, “Where does it hurt?”


    She pointed to her shin, and he removed her ski boot and put an ice pack on top
    of it as he sat down in a chair next to her. He leaned in and said, “I''m glad
    I ran into you. But you might be in too much pain for what I had in mind tonight.”


    “What?” she squeaked out.


    “I thought we could meet later at the bar, and--” Instead of finishing his sentence,
    he kissed her.


    Grace lost it and slapped him. “What are you doing? I have rules. I have to go
    on a date with you three times before you can kiss me and ten point five times
    before we can have sex. And I''m not a voyeur or an exhibitionist. I couldn''t
    help but watch last night, for Christ''s sake. You were fucking her right at the
    bar.”


    “Everything okay?” Royce stepped through the doorway.


    Grace''s muscles relaxed. She hadn''t expected him to show up here. But even in
    the momentary reprieve of his appearance, she kept ranting. “I don''t want him
    kissing me--”


    “I''m sorry,” said Eric, standing and holding up his hands. “There was a misunderstanding.
    She was going into shock--”


    “So you thought kissing her would help?” interrupted Royce. He stepped toward
    Eric, his words edged with fury.


    “If you had been there last night, you wouldn''t think it’s so weird.”


    Royce grabbed Eric by his red coat. He clipped each word as he spoke. “I was there
    last night, and she was not the one sitting on your lap.”


    Eric jerked out of Royce''s grasp and said, “I''m sorry. I''ll go tell the doctor
    you''re ready.” He ran through a door, and, Grace suspected, out a back door.
    Royce sat down next to her, his demeanor relaxed. He smiled and held out his hand.
    She took it without thought, but she was sure she looked like a trapped animal.


    He squeezed her hand and said, “It''s okay. You''re going to be okay.”


    “I have dating rules. He was trying to break them. He didn''t understand.”


    “Why don''t you tell me about them so I don''t break them?”


    Grace''s breathing evened out—what a contrast to Doug. “I still hate you,” she
    said, but she held his hand tighter and tighter.


    ## 6 Meds


    Grace leaned back in the wheelchair and closed her eyes. She seemed unable to
    let go of Royce''s hand, but she was equally unable to answer his question. The
    rules were ridiculous, but she couldn''t help them. At this moment he might think
    she was a little nutty due to the fall and the come-on from Eric, not to mention
    the job loss. But when he heard the rules, he might think she was flat out crazy.


    His other hand rested on top of hers so that he held her hand with both of his.
    His palm warmed her, and the smoothness of his skin soothed her. He said, “Hey,
    can you talk, or are you in complete shock? I don''t mind barging through the
    door to tell them you need to be seen now.”


    She opened her eyes and said, “Please don''t leave me.” Why, why, why was she
    behaving this way? She kept on, explaining her actions more than to him. “My leg
    really hurts. What if it’s broken? How will I find a job then? What about insurance?
    Oh shit, did I lose my insurance yesterday?”


    His thumb stilled, and he lowered his chin. “That''s too long. At least this will
    force you to take a break.” One side of his mouth curved up in a half smile.


    She lowered her gaze and reached up to his hand on her neck. She thought she''d
    pull it away, but she just wrapped her fingers around his instead. Ironic how
    his knowledge of her job situation was beneficial at the moment and helping ease
    out of shock.


    She might''ve held his hand forever, but the nurse came in.


    She said, “Sounds like somebody had a bad fall. Let''s get you back.” The nurse
    was an older woman in crimson scrubs.


    Royce pulled away and tried to let go of her hand on the wheel chair arm. Grace
    gripped his tighter, panicked he''d leave. “Are you going?”


    His eyebrows drew together, and he looked confused. Why shouldn''t he be? Just
    last night she''d slapped him. He said, "I, uh, thought you''d want to go in alone.
    But of course I''ll stay if you want."

