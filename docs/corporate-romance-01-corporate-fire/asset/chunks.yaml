    her better ability to navigate the moguls and pushed herself harder by anticipating
    the sweet victory. This time she’d be the one sending him packing.


    But fresh powder was not her friend on a race over an open slope. Her skis sunk
    into a deeper pile of powder hidden in her path, twisting her legs. After a moment
    of air, one ski hit the ground at a jarring angle, and she fell on her ass, tumbling
    a few more feet down the hill. Rage made her numb to any pain. The bastard was
    going to win.


