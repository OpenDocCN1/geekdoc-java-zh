    她用雪杖蹬地出发，但他跃到了前面。格蕾保持着冷静。他走的路上挤满了几棵紧挨着的树。她也掠过树木滑行，但很快前方就变得开阔了。面包向她袭来，但至少她能清晰地看到一段时间。她在起伏不平的山谷中转弯，保持头部高度不变，让双腿自然弯曲和伸直——道格的建议完全是狗扯。随着速度增加，风拂过脸颊，这种感觉给了她信心。这是她一生都在做的滑雪。


    路过他时，她瞥了一眼树林中的罗伊斯，在到达一片林丛前倾斜身体切入弯道。她在树林间穿梭，依然能感受着地面的起伏。接下来的部分非常棘手，有几个急转，但她轻松地应对了，并记得低着头避开低矮的树枝。她滑过最后一个面包，冲出树林时，距离罗伊斯在另一侧做同样的动作仅差几秒钟。该死，他真厉害。


    她弯下腰完成了最后一段滑雪。凭借更出色的处理面包地形的能力，她与他拉开了距离，并预见着甜蜜的胜利而更加努力。这一次，她将是那个让他滚盖蛋的人。


    但在在开阔斜坡上的比赛中，新鲜的雪并不是她的朋友。她的雪板陷入路径中一处隐蔽的深雪里，扭到了她的双腿。在短暂的腾空后，一只雪板以一个刺耳的角度撞击地面，她屁股朝坐在地上，顺着山滚了好几米。愤怒让她对任何痛苦都麻木。那个混蛋要赢了。


    ### 5| 放软


    她摘下护目镜头盔，把它们狠狠摔在地上。


    罗伊斯转而停止，解开雪板跑了。“你还好吗？”


    “不！”格蕾呼吸很很浅，但她必须对他大喊，“你先是解雇了我，现在我甚至在雪道上赢不过你。我恨你。”


    他跪在她身旁。当他拨开她脸上的头发时，她吃了一惊，但并没有畏缩。也许是因为他还戴着手套。她的怒气消减了一些。


    “我是说，你身体上受伤了吗？”


    她第一次注意到自己的脚踝附近在跳痛。她缩了缩眼睛，不想回答他的问题。他可能会幸灾乐祸，或者更糟，继续对她好一点。“我没事，”她说，试图推起身站起来。疼痛穿过腿部，她尖叫一声，又摔在了屁股上。


    “听起来不太妙。让我帮你吧。我真的不是怪物。”


    格蕾解开了雪板。“我确定没事的。我只是摔倒时脚扭了一下了。”他伸出一只手扶她起来。她盯着那只手，但认为自己无法独立支撑。无奈地叹了口气，握住了他的手。


    当她在受伤的腿上受力时，一阵阵剧痛袭来，让她跳到另一只脚，双手紧紧抱住他的手臂。“妈。”她甚至没想就把头靠在他的肩膀上。那种疼痛是她从未感受过的。


    他用另一只手臂搂住她的背，问道：“要我去叫滑雪救援队吗？”


    格蕾不想回答。他的手臂既让她感到安慰，又让她感到羞辱。也许如果她站站几分钟，疼痛就会消退到足以让她自己滑下去；路只有不远了。他从她的背上移开手臂，感觉像是在挥手。


    她听到身后传来嗖的一声。有人在下方稍停下，又咯吱吱地滑回来。


    “你们需要帮助吗？”


    格蕾抬头，脸红了：是那个邋遢的滑雪教练，他在她目瞪口呆时和约会对象做了性，只不过他穿着一件正面有白色十字的红色外套，像个医务人员。他脸上露出微笑，她的脸颊更烫了。


    罗伊斯说：“我想她伤了脚踝或腿。”


    “噢，真倒霉。我去拿雪地车送你去诊所。”


    格蕾找回了自己的声音说：“我觉得不需要去诊所。我确定只是扭了——”她在尝试向前迈一步时叫着结束了。现在她可能已经压住了罗伊斯手臂的循环。当她再次平衡重心时，松开了手。


    “看起来是雪地车，”罗伊斯说。


    “没问题，”救援人员说，“我很乐意帮忙。顺便介绍一下，我是埃里克。”他向格蕾眨了眨眼，然后转身滑向旅馆。


    “你看到了吗？”罗伊斯说，“他冲你眨眼。我可以当你男朋友，而他却在调你的调。”


    “也许他看到我昨晚扇了你光光。”


    “我觉得他太忙了没注意到那个。”


    “嗯，但他没忙到没注意到我。”格蕾立刻想把刚才说的话收回去。


    “你有点小众，不是吗？”他对她一笑，再次伸手搂住她的背。


    “不，你完全误会我了。我不该那样的。约会方面我有规矩。”她试图推开他的手臂，但那让她差点摔倒。


    他收紧了手臂，说：“我不是不想让你不开心。我只是看到你昨晚在看他们。”


    “很难移开视线，好吗？我不敢相信只有我一个人注意到，或者他们竟然会那样做。”她又摇晃了一下身体，但没有让他倒下。

