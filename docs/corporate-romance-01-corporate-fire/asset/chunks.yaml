    looking for some sign that he''d be back. Nothing.


    Her leg hurt like a bitch. Her heart thumped in fear. She made her way back to
    the bed and pulled her good leg up to her chest. She laid her head on her knee
    and forgot all of the wonderful things he''d said to her and remembered only the
    things she''d done wrong.


    She''d told him about her childhood and her OCD. She''d called his job crappy.
    She''d probably been terrible at giving oral sex. He didn''t even want to stick
    around to seduce her further because she was sure the first round had been horrible
    for him.


    A small part of her brain demanded that she give him time to return. Maybe he''d
    gone out for breakfast and intended on coming back. She focused on that one hope
    as she''d taught herself to focus on more pressing problems than whatever she
    was obsessed about.


    She slid her good leg down and hopped to the bathroom to do her morning routine,
    but instead of a bath, she gave herself another washcloth wipe down.


    Afterwards, still dressed in her pajamas because she didn''t want to sort through
    her suitcase, she felt refreshed. But her heart fell when she saw that it was
    after 7:30 and Royce still wasn''t there.


    She turned back to the bed, and her stomach twisted. For the first time she realized
    her app books and extra phone were sitting on the corner of the bed. Had he gone
    through them? Had he tried to unlock her phone? That was none of his damn business.


    Her laptop case was still zipped shut, but he''d cleared out the dishes without
    her waking up. Maybe he''d been in there too.


    Her head spun. She flopped down to the bed. More time. She needed to give him
    more time. He was going to come back.


    She found the remote control on the nightstand and turned the TV on. Unable to
    concentrate for more than a minute at a time, she kept clicking through the channels.
    Her thoughts were on Royce the whole time, trying to convince herself that she
    hadn''t been wrong to become intimate with him.


    She turned to the clock. It was after 8:00\. He''d been gone over an hour now
    with no sign of returning.


    Her eyes fell on the Suduko book he''d given to her, the one sign he had been
    there. She retrieved a pencil from the drawer and started to work it. 8:15\. 8:20\.
    8:30.


    Her phone rang. She grabbed it and saw Jill’s name. She slid her finger across
    to unlock it.


    “Jill?” she said in a quivering voice.


    “Grace! Thank God. I thought you''d slit your wrists. Are you okay?”


    Her spirit crashed with the simple question. How could she have possibly thought
    a man who fired people for a living was sincere when he said that he was falling
    in love? “I, I''ve done something bad. I don''t know what to do.” She felt like
    a little girl having to confess something to her parents. But this was far worse
    than a B on an exam.


    “You''ve done something bad? You didn''t really slit your wrists, did you? Do
    I need to call 911?” Jill''s voice sounded panicked.


    “No, nothing like that.” Tears streamed down her cheeks. She didn''t want to cry.
    Not in front of Jill. She was going to think she was such a baby.


    “If you don''t need an ambulance, I''ll just come over. Whatever''s happened,
    I''m sure we''ll fix it.”


    “I''m at Breckenridge. I hooked up with a guy, and he totally bailed on me. I
    thought... I thought everything was different with him.”


    “You hooked—what about your rules?”


    “They didn''t seem important when I was with him. He spent the night in my room,
    but I woke up, and he was gone. No note or anything. It doesn''t even look like
    he was ever here except for the Suduko book he gave me.”


    “I''m gonna kill him, literally.”


    “How? I don''t have his phone number or anything. I can''t believe how violated
    I feel right now. I''m such a screw up.”


    Grace sobbed despite all the soothing words Jill said and the declarations to
    hunt him down. She tried to hold her breath to calm herself and heard the whir
    of the lock. The door handle clicked, and Royce opened it, rolling his suitcase
    in and leaning their skis against the wall. He added his boot bag to the pile.


    Stunned, she interrupted Jill and said, “He came back.”


    “What?”


    “He, he brought his suitcase and our skis.”


    “He''s there?”


    “Yeah.”


    “Put him on.”


    “I don''t think...”


    “Put him on, Grace.”


    She held the phone out to Royce while she wiped the tears off her cheek. “Jill
    wants to talk to you.”


    “Are you okay?”


    He sat down next to her and put his arm around her.


    “I wouldn''t keep her waiting.”


    He took the phone and said, “Hello...Royce.”


    He watched Grace as he listened. Grace could hear Jill''s voice, but not enough
    to catch what she was saying.


    “Yes I know what a pen and paper is for...I didn''t think I''d be gone as long
    as I was...Yes, I realize she''s sensitive...I know she doesn''t sleep around.
    It''s not like...I''ll give her my number now...I have every intention of seeing
    her as much as possible. I think she''s amazing...I understand.”


    He handed the phone back to Grace. She put it to her ear and said, “I''m sorry
    for crying like that. You caught me at a bad moment. I guess I just needed to
    wait a little longer.”


    “Don''t be sorry about the crying. He was an asshole for not leaving a note. I
    don''t know what you''ve gotten yourself into, but I expect a full report when
    you get back. I can''t believe you didn''t invite me or tell me you were going.”


    “I was embarrassed about the layoff.”


    “That wasn''t your fault.”


    “I''ll call you Monday. I swear. Thanks for everything.” She paused and then added,
    “You''re a good friend.”


    “Only when you let me. I so would''ve gone skiing with you. You''d better call
    when you get home.”


    “I will.”


    Grace hung up and turned to Royce. He embraced her and stroked her back with his
    hand.


    He asked, “What happened?”


    She pressed her head against his shoulder. “I woke up, and you were gone, and
    you''ve been gone a really long time. I tried to tell myself you went skiing and
    you''d be back, but you cleaned everything up like you hadn''t even been here,
    and you didn''t leave a note.”


    “I remembered our skis when I woke up and knew you''d kill me if I lost your skis
    along with all the other things that have gone wrong. I didn’t think you’d want
    to wake up to the dinner mess either, so I put it all outside our door when I
    left. I really only intended to be gone about fifteen minutes, but I ran into
    Ted.”


    She pulled back with unease seeping in again. “Ted? Your partner in crime?”


    He took her hands and said, “Yeah, he had to tell me all about his exploits last
    night--”


    “You didn''t tell him about us, did you?” Her fingers tightened around his.'
