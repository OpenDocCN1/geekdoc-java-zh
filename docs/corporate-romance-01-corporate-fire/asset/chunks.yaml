  raw: 'Royce turned crimson and seemed unable to speak for a moment. “You have me
    all wrong. I look at my job as helping people to new ventures. Not victimizing
    anyone.” He turned his rage to Grace. “And maybe if you would let people get close
    to you, Jill would already know about us and know that everything I''ve done this
    weekend has been to help you.”


    Grace couldn''t look at him and bent her head to her knee instead. She heard him
    walk across the apartment and slam the door behind him.


    What a disaster. She''d screwed everything up.


    Jill pulled one of the kitchen chairs over, sat down and put her arm on Grace''s
    shoulder. “What the hell are you doing hooking up with the guy who fired you?”


    Grace lifted her head up and said, “He''s the most incredible man I''ve ever met.”
    The whole story burst forth, though she left the sexual details out. Jill stared
    with wide eyes and sipped her mocha the whole time.


    When Grace was done, Jill said, “Shit, he''s right.”


    “About which part?”


    “You make it impossible to get close to you, Grace. You should''ve told me all
    this. You should''ve called and let me know you were going skiing. I was seriously
    worried about you. I''d already come over to your apartment once, and you were
    gone.”


    “You had?”


    “Yes! Jesus Christ, you and I talk all the time. Did you think since you got fired
    I''d drop you?”


    Grace swiped away the tears on her cheeks feeling like a complete idiot, and then
    she did something she''d never done before—she hugged Jill. “I''m so sorry. You''re
    my best friend. I just never thought you felt the same way. You have so many friends.”


    Jill''s arms felt good around Grace''s back—like warm comfort that would always
    be there. “Most of them are just clubbing friends. But you, I can always count
    on—I just wish you realized I would do the same for you.”


    “I''m so sorry. I just--”


    “I know. It''s hard for you to get close to people.”


    Grace let her go and finally had a long sip of the mocha.


    “I have to admit, you make Royce sound pretty amazing. I can''t believe he stayed
    with you at the clinic instead of going back to the slopes.”


    Grace sighed. “I know, but I hate his job.”


    “I''m with you there,” said Jill, popping a piece of muffin into her mouth.


    “And not only is it a crap job, but he travels all the time.”


    “Maybe he''s ready to settle down.”


    “I doubt it. Every time I mention his job, he gets totally defensive.”


    “Well, I don''t think I''ve ever screamed with a man like I heard you screaming.
    At least he''ll make a good weekend lover.” Jill grinned as she spoke.


    Grace just drank her mocha in silent embarrassment—she had no defense. “Should
    I call him?”


    “Definitely.”


    She picked up her phone and tried Royce''s number, but he didn''t answer. She
    knew she''d really messed up, but she hoped he wouldn’t ignore her all night.
    He''d left his coat behind and had to be freezing. At least she knew he''d be
    coming back at some point.


    Jill had gossip from the office, and Grace listened to what the first day had
    been like without all the Java programmers.


    And then her phone rang. Grace answered it right away.


    “What''s the address of your old office?” he asked.


    That had to be the most unexpected question ever. She gave it to him and asked,
    “Why?”


    “Your building is on fire.”


    20| Fire


    As they drove by, Grace saw Royce standing on a corner looking up at her old workplace.
    Fire trucks and ambulances swarmed the base of the building, but the fire seemed
    to be contained to the floor of Mile High Innovations—right in the area where
    she used to work.


    Jill had seen Royce too, and she parked her car before they reached him. She asked,
    “Do you need help?”


    “I think I''ve got it,” said Grace, but Jill came around and helped her anyway,
    much to her relief.


    The two friends made their way on the sidewalk. Grace had his coat hanging from
    one of her crutches. “How did you get all the way over here without a coat? You''re
    going to be knocked out with pneumonia.”


    “Grace!” He embraced her, preventing her from handing him his coat.


    “I''m sorry about earlier. You''re right, I should''ve told Jill about you or
    in the very least defended you before you ran out.”


    “It''s okay. I just hope we''re all square now because you might be getting your
    wish.”


    She pulled back and said, “What wish?”


    Jill stood in front of them on the corner and said, “It doesn''t look too bad.
    Somebody must''ve called it in soon after it started.”


    “I think I was the first,” said Royce. I didn''t see any firetrucks until well
    after I''d phoned it in.”


    Grace handed him his coat and said, “What were you talking about?”


    “I think Jeff started the fire, and if he did, they might try to hold me responsible.
    I could get fired for this.”


    Grace gaped, and Jill spun around. “Jeff? He''s got a bit of a temper, but I hardly
    think he''d start a fire. Oh snap, did he give you that bruise on your face?”


    Royce nodded. “I didn''t get his keycard, but I told security to get it when they
    took him away. The only thing I didn''t do right was I didn''t phone in the incident.
    I didn''t want my company harassing him, and I just wanted to get out of there
    so I could figure out when to call Grace.”


    Grace wanted to put her arm around him, but the crutches made that impossible.


    “Let''s get out of here,” said Jill. “It''s fucking cold, and I''m hungry. I was
    gonna order a pizza when I got to Grace’s. You guys want some?”


    Grace''s stomach grumbled. Cereal all day wasn''t exactly filling. “Yeah, that
    sounds great.”


    Royce hadn''t answered. He just stared at Jill. “I''m not out to hurt Grace. I
    came here to take her to the doctor tomorrow because she told me she hadn''t asked
    you to do it.”


    “Well, there''s not much we can do about Grace being an idiot.”


    “Hey! I''m standing right here.”


    Jill grinned and continued. “Maybe together we can convince her the world isn''t
    out to get her.”


    “That sounds like a good deal.” Royce held out his hand and shook Jill''s.


    “You guys make me sound like a paranoid recluse. Next you''re gonna be saying
    I set the fire.”


    “Oooo, yeah,” said Jill. “I could sell that story to the press. Hang on. I need
    to tweet about it.”


    Grace tried to whack Jill with her crutch, but Jill was too nimble. They kept
    joking as they got into the car, but Royce grew silent. Sitting next to him in
    the backseat, Grace could feel the worry coming off him the same way she could
    feel his tenderness when they were intimate.


    “It''s going to be okay,” she said.


    He nodded and kissed her, but she knew the worry still ate at him.


    ![](images/00005.jpeg)


    They watched the news as they ate pizza together. The fire at Mile High was definitely
    arson, and the reporters brought up the layoffs as much as they could without
    directly saying the Java programmers were suspected.


    Sitting next to Royce on the futon, Grace put her hand on his and said, “If Jeff
    did it though, wouldn''t the security guards get fired and not you?”


    “Do you think they''re going to fess up to not taking the keycard when they can
    blame it on me instead? My only chance is for Ted to have heard the whole exchange.”


    “You''re up shit creek if you have to rely on that asshole,” said Jill before
    she took a bite of pizza.


    “He''s not that bad,” said Royce. He sounded tired and annoyed. “He just has an
    obnoxious mouth.”


    Grace wanted to change the subject. Hearing the same report over and over on the
    television wasn''t doing anyone any good. And everyone had been giving her crap
    about not opening up. It was time to change that. She blurted out, “I have something
    to tell you about, Jill.”


    Jill drained a glass of wine and said, “Something more than hooking up with the
    ax man?”


    Royce actually grinned and leaned in to kiss Grace like he knew what she was about
    to say. He probably did.


    She clicked off the TV and took her extra phone from the corner of the coffee
    table. She played with it a moment, and the chimes sounded for the beginning of
    her game.


    “What is this?” asked Jill.'
