    她发了短信：“我回到家里了。很抱歉之前没给你发信息，还对着电话大哭了大大一场。”她把手机放在大腿上，几秒钟后手机响了。是吉尔。


    “嘿，”格蕾丝说道。


    “嘿啊。我以为你明天才会回来。你没有又和那个混在一起的男的吵架吧？”


    格蕾斯盯着自己断掉的腿，咬了咬牙说：“没有，他被意外叫回去上班了，所以我回来了。”


    “噢。”


    这一个词让格蕾丝意识到，吉尔认为那个男人不会再给她打电话了。她强迫自己记住他所有安抚的话，以免自己也产生同样的想法。


    吉尔说：“我很想知道发生了什么，但我还有旋转健身课要教。今晚去喝杯摩卡咖啡怎么样？”


    格蕾斯盯着自己的腿。她不能就这样打发吉尔，因为也许她们真的可以成为工作之外的朋友，但如果吉尔看到她的她的腿，她就会把关于罗斯的整个故事全交代。她的喉咙收紧，感到恐慌袭上心。“我累坏了。我想在告诉你之前，得先理清到底发生了什么。”


    “那你最好明天做好准备，因为我一定要见你，哪怕这意味着要闯进你的独处之所。明白吗？”


    格蕾丝不得不笑了。“好，我明天给你打电话。谢谢你来关心我。”


    格蕾丝挂掉电话后，又回到包里翻找药。知道吉尔明天会过来看让她提振了精神。她可以听听吉尔对这处状况的意见。她完全可以说自己遇到了一个经常出差的男人，不知道自己是否能处理好异地恋。


    服下药后，是时候完成滑雪后的拆行李仪式了，但感觉更像是仪式征服了她。这并并没有让她忘掉关于罗斯的思绪，反而提醒她，他正离她越越远。糟糕的是，做每件事都比平时慢了十倍。


    她拆开行李，把脏衣服装进塑料袋里。她用拐杖把衣服拿到洗衣机旁，开始洗衣服。她总算洗了个热水澡，但一点也不轻松，随着罗斯的缺席，她内心的空洞变得越来越大。费力穿好衣服后，她在水池边吃了一碗麦片片，然后拄着拐杖走到沙发上坐下。


    她从咖啡几上拿起手机，看到错过了罗斯的一条短信。


    “在图苏萨落地了。希望这趟旅途中你一直牵着我的手。”


    她没法让自己回信息。他旅行的现实带给她了太大的痛苦。


    她把脚搁在咖啡几上，打开电视。她找了一部电影看，但心神总是飘忽。电话响起时，她立刻接听了。


    “喂？”


    “嘿，亲爱的。天哪，我想死你了。为什么不回我的短信？”


    她等了一会儿才回答，试图把情绪汇聚成一段连贯的话。“因为每件事都很疼。我不知道我能不能做到。”


    “做什么？你什么意思？”他的声音听起来疲惫且带着一丝慌乱，让她后悔自己说出的话。


    “我从未谈过异地恋。这简直比我断了腿还难受。”


    “早上起来会好好的。周日晚上总是最糟糕，但到周三我们就会期待周五的见面了。”


    “老天，你这简直快成套路了。”


    他叹了口气，她听到东西顺着墙滑落。也许他正靠着墙。“是的，我以前谈过异地恋，但我……我从未像现在这样想待在你身边，从未想忘记这一切并留在一个女人身边。”


    她把手机贴贴耳朵更近，但并不能让他出现在她身边。“我不知道该说什么，罗斯。你知道我对你工作的看法。我得挂了。没法抱着你听你的声音真好难受。”她按掉电话，靠在沙发上。周末的旋风终于结束了，留下她独自面对残局，收集任何值得留的东西。她希望罗斯出现在她留下的那堆东西里，但他甚至不在那里供她收集。


    # 17| 起起伏伏


    格蕾丝醒来，决定换个方式一直呆在窝子里。首先，她的腿感觉像……（注：后续文本存在重复/乱码，已按要求逻辑处理）。

