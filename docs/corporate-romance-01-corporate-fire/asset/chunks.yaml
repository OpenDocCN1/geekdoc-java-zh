    He tightened his arm and said, “I didn''t mean to upset you. I just saw you watching
    them last night.”


    “It was hard to look away, okay? I couldn''t believe I was the only one noticing
    or that they would just do that.” She swayed again, and he pulled her right up
    against him. She should be going nuts with the physical contact, but instead she
    found it soothing.


    “Do you want to sit down while we wait?” he asked.


    She didn''t want to sit in the snow, but it was embarrassing leaning on him. Her
    body was too pleased with his. “I could sit down, and you could go ski. No sense
    wasting the rest of the afternoon on me.”


    “And leave you alone with Eric? No way. I figure we''ll cross the finish line
    together, and I can bring you room service tonight.”


    Dinner together in her room was too much. She never let men inside her apartment.
    She couldn''t let him think he was making progress. But instead of shutting him
    down entirely, she said, “Before you leave?”


    He tilted her face up to his. She had to hop on her good foot to adjust, and her
    knee buckled when she looked into his eyes—sincere and pleading. He held her up
    and said, “Your CFO was the one who let you go. I''m just the one who said the
    words. That company may have been good for you in the past, but you''ve outgrown
    them. Let me help you move on. I''m really good at it.”


    “If you''re really good at helping people move on, why aren''t you a headhunter
    or a life coach?”


    He scrunched his eyebrows together as if he''d never considered that possibility.
    Before he answered, someone skied up to them and yelled, “You''re fucking kidding
    me, right?”


    Grace was so surprised by Doug''s approach that she dropped Royce''s arm and then
    ended up wrapping both her arms around his waist before she fell over. His arms
    looped around her as if he was protecting her.


    Doug continued to yell, “You''re throwing yourself at the ax man? You''re the
    coldest bitch I''ve ever known.”


    Grace opened her mouth to yell back, but Royce let go of her with one arm and
    shoved Doug. “Leave her the fuck alone. I''ve seen her tell you twice that she
    doesn''t want you around.”


