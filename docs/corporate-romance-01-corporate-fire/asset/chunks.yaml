    her bedroom. When he broke off the kiss he said, “I think I''ll be too busy for
    football. I''ll leave you an email about the doctor''s instructions. You have
    to call tomorrow and set up an appointment this week. And get Jill to take you.”


    Grace nodded, wanting to say many things but saying nothing. She leaned in, and
    he met her for another kiss. “I''ll miss you,” she finally got out.


    “Me too.” He turned away and headed out the door. Grace crumpled onto the couch
    and tried to make sense of the weekend, but it turned out to be impossible.


    16| Apart


    After struggling with her luggage for a few minutes, Grace kicked it with her
    good leg, hoisted herself on her crutches and limped over to the freezer. She
    wanted to do the unpacking ritual she always did when she came home from skiing,
    but her leg throbbed. Her heart ached even more. It was so stupid.


    Grace limped back over to the couch, put her leg up on some cushions and settled
    a bag of ice where it was broken.


    Looking at the time on her DVD player, she ran through the numbers of their relationship.
    She''d met Royce around 7:00 Friday morning and flipped for him. Then three hours
    later she''d hated him after he delivered the message that she''d been laid off.
    About ten hours after she lost her job, he sent her a cosmo, and she slapped him.
    About thirty-two hours after she met him, she raced him and broke her leg, and
    that was somehow the beginning of the end of her hatred for him. Followed by a
    night of making out and Royce stealing her heart. A fifty-six hour romance replete
    with an early morning fight and a make-up breakfast.


    She didn''t know if she could take any more.


    She grabbed her phone off the coffee table and clicked on Jill''s name. She wanted
    to spill everything that had happened, but she just couldn''t bring herself to
    tell Jill she was in love with the man who''d fired her. Jill would think she
    was a total loser.'
