    for breakfast.”


    He shouldn''t even have her personal number. She had to get rid of Doug. Picking
    it up, she typed, “Go skiing. I''m not going to date you.”


    A moment later she read, “I''d be better than the ax man sending you notes last
    night.”


    “Go skiing.”


    She chucked the phone to the foot of her bed and got up to splash water on her
    face at the sink, followed by brushing her teeth. As she screwed the lid back
    on the toothpaste tube, she noticed her legs shook from the lack of food. Just
    a quick shower and then breakfast. She turned the water on and stripped. When
    the water was warm, she stepped in and let the water fall on her face, refusing
    to think about being fired and refusing to think about cobalt eyes that made her
    squirm. He''d better not approach her today or send his slimy little henchman
    over. She''d punch him.


    Once groomed and dressed in black ski pants and a soft, azure sweater Grace made
    her way down to the hostess station at the dining room. She stared through the
    wall of windows at the back and watched the skiers zooming down the mountain,
    wishing she''d gotten up earlier.


    “How many?” asked the hostess.


    Grace held up one finger and followed the hostess to a booth on the right. Her
    stomach grumbled and felt nauseous all at the same time. It''d been far too long
    since she''d eaten. When the waitress arrived Grace ordered eggs, pancakes and
    bacon before she''d even finished saying good morning.


    “All right, then,” said the waitress. “Coffee or orange juice?”


    “Both.”


    “Will do. And here''s a note from another customer.” She plopped a napkin right
    in front of Grace.


    Anger wrenched her stomach. She turned and saw Royce sitting in a booth on the
    opposite side of the restaurant. He hadn''t shaved, making him look like a model
    for the cover of the winter L.L Bean catalog in his black cashmere sweater and
    dark ski pants. He smiled and raised his cup of coffee to her.


