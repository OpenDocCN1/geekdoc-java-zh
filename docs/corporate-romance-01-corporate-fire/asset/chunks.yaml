  trans: '

    她低下了视线，无法承受他那强烈的目光。


    他越过桌子。“我真的很想重新开始。”


    他的声音让她后颈的汗毛竖了起来，她犯了一个错误，抬头看去。他长得太帅了。即使是脸上的青青也增添了他的魅力。


    她在心里责备了自己。仅仅因为他长得好看，并不意味着他不是个混蛋。“而且我很希望你离我远点。”


    他笑了。“也许我们在雪道上见。”


    当他起身离开时，她的菜上了，格蕾斯开始用用。


    随着胃部填饱，她的怒气消了一些。能再次吃上饭真好。也许她太刻薄了。开除她是 Mile High 公司的决定，而不是他的决定。


    不。只有混蛋才会有那种工作。


    ![](img/00003.jpeg)


    格蕾斯站在一条双黑钻雪道的顶端，庆幸自己远离了人群，尤其是罗伊斯和道格。昨晚的雪压低了树枝，与蓝蓝的天空形成鲜明对比。冷风吹着她的脸颊——那是她身上唯一露出的部位。


    终于获得了自由。


    她撑着雪杖向前滑去，喜欢雪花飞溅的样子。在陡峭的径道上滑行带给她的快乐就像解谜或编程一样。


    整个上午，她都在雪道上飞驰，在缆道回程时放松心情，忘记了自己的工作处境。唯一扰乱她宁静的是对罗伊斯的思绪。希望他在远处的初级道上，但她对此表示怀疑。


    午餐休息后她跳下缆道，走向她最喜欢的几条道之一的起点。罗伊斯的影子依然在脑海中闪过，但她已经完全忘记了道格。所以当她听到身后传来他的声音时，她感到格外心惊。


    “嘿，格蕾斯。”


    他从岩石上的位置滑了过来。简直就像他一直在等她，这让她的脊背感到一阵发凉。她甚至连招呼都没打。


    “你的姿势不错，但滑过土丘时膝盖应该再弯曲一点。”


    “别跟踪我。”


    “我没在跟踪你。我只是在想，既然我们同时被录用，又同时被开除，也许我们可以尝试约会会。”


    “这并不意味着除了那份失败的工作，我们还有什么共同语言。”


    “但我们有。你是完美主义者，我也是。我们会是很棒的搭档。我确信我可以让你打破我听过的所有规则。”


    格蕾斯紧紧握住手中的雪杖，身体在厚实的滑雪装备下渗出了汗。她讨厌那些想要让她为了他们打破规则的男人。她大喊道：“我永远不会为你打破我的规则，你想知道为什么吗？你说你是完美主义者，但你在这方面是个混蛋。你发现一个缺陷，要么向你认为犯了错的人抱怨，要么如果是你自己造成的，就找别人背锅。当我看到问题时，我会直接修复它，无论是不是我的错。自从我被开除以来，你每次跟我说话都会找点什么来刺我。既然我是完美主义者，被讨论我的缺陷对我来说就像指甲划过黑板一样难受。你我绝不会约会。”


    格蕾斯气极了，她解开雪板，跺脚走到一块岩石上坐下。


    “你正在犯一个错误，格蕾斯，”他喊道，“其他的程序员们都觉得你是个臭女人，因为你拒绝回他们的任何一封邮件。”


    她理了了他，双膝抱在胸前，雪板靠在岩石底部。最后他把雪杖插进地里，顺坡滑了下去。她希望他摔断腿。


    她头埋在膝盖上，试图隔绝世界。但岩石的寒气渗透了滑雪裤，让她保持着警觉。滑雪声越来越近了。


    更糟糕的是，她听到了那个在早餐时让她后颈汗毛竖起的声音。“嘿，有什么我可以帮你的吗？”


    她本应该邀请吉尔和她一起。她们可能会变得亲近，而且吉尔会把那些失败者挡开。她今晚得给她打电话。格蕾斯没有抬头，嘟囔道：“走开。”


    沉默是她的回答。他就在她身边。她叹了口气，抬头。罗伊斯的眼中流露出担忧。如果他戴着护目镜就好忽略了，但他把眼镜挂在脖子上。


    他说：“能滑完这条道，你一定很厉害。”


    在道格不断的纠缠后，这句赞美让她感到宽慰。她发现自己在说：“这是我最喜欢的路线之一。”


    “你多久滑一次雪？”


    不知道是因为突如其来的孤独感，还是因为他随和的态度，她发现自己在透露个人信息。“每个冬天滑几次。这就是为什么我住在丹佛。”


    “如果我住在这里，我也会滑一整个冬天。”


    很自然。她是他的完美男人，除了他开除了她。“你为什么要浪费时间在我身上？我不想和你有任何关系。”


    “因为你聪明又漂亮。而且你已经知道我是做什么的了。暴露职业对女性来说非常反感。”


    聪明又漂亮。她经常听到夸聪明，但从未听过漂亮。他在玩心机。“噢，真意外。我本以为你会保守这个秘密的。”


    “我不喜欢留秘密。”

    '
- fmt: '

    She pushed off with her poles, but he jumped ahead. Grace stayed calm. The path
    he''d taken was cluttered with several close trees. She glided by trees as well,
    but they soon opened up. Moguls met her, but at least she could see clearly for
    a while. She turned in the valleys of the bumps, keeping her head the same height
    and allowing her legs to bend and straighten—Doug''s advice had been pure bullshit.
    The air brushing her cheeks as she gained speed gave her confidence. It was a
    run she''d done all her life.


    She caught a glimpse of Royce in the trees when she passed him and leaned into
    a curve before she arrived at a copse. She swooshed among the trees, still feeling
    the rise and fall of the bumps. The next part was tricky with several sharp turns,
    but she managed them with ease and remembered to keep her head down for the low
    branches. She skied through the final mogul and emerged from the trees only seconds
    before Royce did the same on the other side. Damn, he was good.


