  trans: '


    “宝贝，我们来这里保护你免受任何形式的侵害。”卡莱尔多推开了门，他们走进了公寓。她拍了拍格蕾斯的折人垫说：“你不坐在沙发上吧，卢江警官会从你的桌子上搬几把椅子给我们坐。我们很快就会离开这里。”


    如果不是因为药物的作用，格蕾斯知道自己已经过度呼吸了。尽管如此，她还是感到脸颊发红。她讨厌别人出现在自己的公寓里。


    她绕到折人垫旁坐了下来。等大家都坐好后，卡莱尔说：“那么，阿登小姐，当高空创新公司（Mile High）裁掉你时，你难过吗？”


    格蕾斯盯着他们，听着这个问题，但脑子里想的只有陌生人坐在她的椅子上的事实。而且那些椅子不该放在咖啡桌旁。它们该待在餐桌旁。


    “阿登小姐？”


    “我们可以在餐桌旁讨论这件事吗？那才是那些椅子该去的地方。”


    警察们互相看了一眼。“你说什么？”卢江第一次开口道。


    药效肯定在消退了。她家里有警察，他们正在挪动东西。她快要彻底崩溃了。“那些椅子应该在桌子上。我不能在你们坐在我客厅椅子上的时候和你们说话。如果你们想坐在这儿，就得坐在地板上。”


    噢不。她真的刚刚告诉警察他们必须坐在地板上吗？


    “好吧，那我们就去餐桌旁吧，”卡莱尔说，好像格蕾斯并没有说什么胡话一样。


    现在去给罗伊斯回电话还晚吗？


    格蕾斯撑着拐杖站起来，走向餐桌，坐下后感觉情况好了一点。


    警察把椅子放在正确的位置，也坐了下来。“所以，当你失去高空创新公司的工作时，你难过吗？”


    “嗯，是的，”格蕾斯说，“我在那里每年都能加薪。这完全是一个震惊。”


    “你认为你为什么会被裁员？”


    “罗伊斯说首席财务官决定无论技术如何都裁掉整个部门。”


    “罗伊斯是谁？”卢江问，一边翻阅剪字板上的文件。


    格蕾斯捂住嘴巴，意识到她不应该提到任何关于罗斯的事。


    卡莱尔探员说：“罗伊斯是谁，阿登小姐？”


    她把手从嘴离开。“嗯，罗伊斯是绿意牧场（Greener Pastures）的男人，他告诉我我丢工作了。”


    “他在这儿，”卢江说，“他也是 911 的报警人。”


    “负责裁员的那个男人就是 911 报警人？”卡莱尔探员问。


    “是的，”卢江说，“我还没把这件事联系起来。”他开始记录起来。


    “你认识罗伊斯·亨德烈吗？他昨晚为什么在这里？我们被告知他去了下一份工作。是在丹佛吗？”


    格蕾斯没有理由知道那个问题的答案。她可以耸耸肩，或者给出一个含糊的评价。她盯着卡莱尔，眼睛不停地眨着。只要耸肩，也许他们就会走了。


    “你和杰夫·哈里斯是朋友吗？”卡莱尔换了一个话题问。


    格蕾斯忍不住叹了口气。至少她已经放下了罗伊斯。“并不太像。”


    “你和其他几个 Java 程序员关系亲密吗？”


    “不。”虽然是实话，但在格蕾斯听起来很糟糕。她继续说下去试图让它听起来好一点，但结果越说越糟。“因为我有强迫症（OCD）之类的，别人很难了解我。我并不怎么亲切友好。”


    “昨晚八点左右你在哪？”


    他们为什么要问她这个？她没做错任何事。而且他们还在她的公寓里，坐在她的椅子上？“我在这儿。我行动不太方便。”


    “有人和你在一起吗？”


    更多是关注于希望他们离开而不是其他事情，她脱口而出：“吉尔和罗伊斯和我在一起。”


    卢江前倾身体说：“那个 911 报警人罗伊斯？”


    “噢死了。”她手捂住嘴巴。她不应该大声说出来的。他们需要离开这里。她对别人进入她的公寓是有规则的。规则……”


    “那个开除你的男人为什么要在这里？”


    就在她问出问题的瞬间，门开了，罗伊斯冲进了公寓。如果格蕾斯可以，她会跳起来的，但她脱口而出：“你不该在这儿。”


    “我做不到，”他说。他忽略了警察，但警察盯着他看，仿佛在试图拼凑一个图画。“我没法告诉所有人他们的公司不再需要他们了。你是对的。这份工作不适合我。我可以做得更好。”


    “你辞职了？”格蕾斯撑着身体站了起来。世界在旋转，尽管她不知道是因为药物还是因为罗伊斯的消息。


    “是的，我辞职了。”他把箱子和笔记本留在门口，走向她。但在他到达她面前，卡莱尔探员走到了他们之间。


    “你是罗伊斯·亨德烈吗？”她问道。


    “是的，”他说。


    “是你开除了杰夫·哈里斯吗？”


    他的肩膀垮了。“是的。”


    她向卢江探员点头，卢江带着手铐走向他。她说：“你因昨晚高空创新公司发生的火灾案被捕了。”


    格蕾斯无法相信正在发生的一切。当卡莱尔探员开始向他告知米兰达权利时，格蕾斯说：“不。不是他。他跟我在一起。”


    “没关系的，格蕾斯。逮捕不会成立的。我没有门卡。”


    “但是……”


    他摇了摇头，好像不想让她再说什么。这可能是个好主意，因为她已经说了太多。她无法相信，在罗伊斯为了她辞职后，她竟然对他做了这种。她无助地看着他们戴着手铐带他出门。


    卡莱尔探员转过身说：“不要离家太远，阿登小姐。我怀疑我们很快还会见到你。”


    寒意爬上她的脊背。门关上后，格蕾斯拄拐杖走到手机旁。她不想请求，但她厌倦了听不要依赖朋友的教导。她拨了吉尔的名字等她接听。她说：“我你需要帮助。罗伊斯刚被捕了，这一切都是我的错。”


    ## 22 封邮件


    吉尔到达格蕾斯公寓的速度比格蕾斯想象的要快，尤其是当她看到自己带着两杯热腾腾的摩卡时。


    吉尔坐在格蕾斯桌桌旁时，直奔主题：“罗伊斯怎么还在这儿？我以为他飞回图尔萨了。”


    “他辞职了，”格蕾斯说，依然对罗斯的举动和自己的无意背叛感到震惊。


    “老兄，他一定是真爱了，”吉尔说，“他要搬到这里吗？”


    “我不知道。警察在这儿时他回来了，宣布他辞职并被捕了。”


    “好吧，你不会喜欢我要告诉你的。”吉尔把摩卡推向格蕾斯，等她喝了一口。


    格蕾斯不知道自己还能不能承受更多坏消息。她喝了一口，希望咖啡因和巧克力能提她的精神。


    吉尔说：“今天我在高空创新公司的另一个办公室办公，像往常一样去托尼那里吃午饭。你所有的老同事都在那聊天。”


    格蕾斯想起了收到的所有没读的邮件，以及她在看医生时收到的短信。那里一定藏着邀请。“那听起来并不奇怪。”


