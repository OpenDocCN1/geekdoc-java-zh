    Grace 深吸了一口粗气。她脱口而出：“我本希望你也是个滑雪高手，这周末能和我一起去滑雪。为了让你符合我的要求，我真的在挑战我的第一规则了。”


    “啊，规则。是时候让我听听了，免得我违反它们。”


    她对着他皱了皱鼻子。她真不该提到这些的。“你不想知道的。那会让我看起来像个怪胎。”


    “我觉得那会让你很可爱。”


    她咯咯笑起来。“嗯……好吧。我只和我认识的人约会。我不喜欢肢体接触，有时在第二次约会也是如此。三次约会我不接吻，十点五次约会我不发生性。”


    “真精确。”


    “我是一个程序员。”


    他低头看着他们的手说道：“我怕我摸着你。我应该收回手吗？”


    她缓慢地摇摇头。“不。我不知道为什么你这样做时，我并不反感。”


    在 `Royce` 回答之前，医生走了进来并介绍了自己。“你好，我是杨医生。”她伸出手握手，Grace 不得不松开了 `Royce`。


    她和医生握了手说：“你好，我是 Grace Arden。这位是将来会开除你最帅的男人，`Royce`，我忘了他的姓氏了。”


    医生试图掩住微笑，握了握 `Royce` 的手。“亨德克斯，”他说。


    医生说：“看来药物起作用了。我给你了一些今晚和明天要吃的药，直到你能回家开处方为止。你的腿确实断了，但好消息是它只断在了一处。”她把 X 光片挂在背光板上给他们看。她使用了许多
    Grace 因为药效太大无法跟上的专业术语。`Royce` 像对待她丈夫一样问了一些问题。她本该觉得很奇怪，但更多的是感到庆幸，有人为她操心。


    她听到医生说：“所以我我会把它包起来防止你移动，但你应该在大三天后在家里预约一个骨科医生来复位。`Royce`，你会负责送她回家的吗？”


    这个问题让 Grace 惊了一跳，她说：“不，”就在这时 `Royce` 说道：“会的。”


    “我不能这样麻烦你，”Grace 说，“我有可以联系的朋友和家人。”她想到了 `Jill` 和那些未回的短信。她真的需要给她打电话。


    “怎么了？”`Royce` 说，“让他们大老远跑过来接你？你的车怎么办？我可以开你的车送你回家，`Ted` 开租来的车跟着就行。这真的是最好的解决方案。我是个安全的司机。如果你需要参考意见，可以拨打我租过的所有地方电话。那里的人喜欢我。”


    Grace 想象他住在她的公寓里，让 `Ted` 独自开车去机场。她摇了摇头。那是药效在作用。她从未允许男人进入她的公寓。“你确定吗？”她说。


    他握住她的手说：“这是我能做的。”


    “既然这样定好了，”医生说，“这是你接下来的几天的说明。”她递给 Grace 一张纸开始讲解。Grace 懂了前几条，接着就有些出神了，想着 `Royce`
    送她回家的场景。还有今晚。她希望他还会和她一起点房间服务。疼痛在腿上跳动，提醒着她现在的状态并不适合做很多，但她不想考虑与他分开。


    ## 7 | 房间里


    Grace 拄着拐杖通过诊所的后门走下酒店走廊。一袋冰系在其中一个手上，随着她的移动发出金属摩擦声。木护板和昏暗的光线让她希望蜷缩在炉旁——和 `Royce`
    一起。可惜她的房间没有壁炉。


    她停下来喘气，稳住身体，试图思考如何回到房间。


    `Royce` 把手放在她的肩胛骨之间说道：“我简直相信他们竟然不能腾出一个轮椅至少送你回房间。我会把它送回来的。”


    “我想我得习惯这些些……”当她注意到他提着她的滑雪靴时，声音消失了。“我的滑雪板！他们把我的雪板放哪儿了？`Eric` 拿走了吗？”


    她在她的背上画圈，引起一阵酥麻感流过她的皮肤。“别担心。你拍 X 光的时候，我从雪地摩托上拿了它们，把它们放在了户外酒吧旁我边的架子上。我等会儿去取。”


    她想靠过去亲亲他，但幸运或不幸的是，拐杖让这种尝试变得太困难。“谢谢你……再次。这个周末简直是一场灾难。我现在感到这么开心，真奇怪。”


    `Royce` 笑了笑。“我希望那是因为我，但我确定那是药的作用。我只是希望药效过去后你不会恨我。”


    “恨是我现在完全没考虑的事。这一切期间你真的、非常体贴。”


    他用掌心压在她背上，靠得更近。绝对在接吻的范围内。“我想对规则稍微明确。既然我握手表现很好，而且你也没有推开我背后的手，今晚我们看电影时有没有机会抱抱？我发誓，我会管住嘴。”


    她想要他现在就吻她。她想起昨晚她希望自己能没有这么多顾忌，而药物确实降低了这些顾忌。她应该利用机会。


    Grace 挺直身体，踮起脚尖微微前倾。她的唇碰到了他的唇，那是一秒的天堂。她闭上眼睛享受着那份温柔。当她睁开眼睛时，`Royce` 的眼睛快掉出来了。


    “我很对不起，”Grace 急口道，“我做错什么了吗？你看起来很惊恐。”


    `Royce` 绕过身，让他的身体正对着她。他搂住她的腰，再次吻了她——好几次。没有舌头，但他的唇挑逗着她的唇，不用言语就诉了他的欲望。


    当他停下来时他说：“我很惊讶，不是惊恐。我从你发火的对象变成了分享你极少给予的亲密。我从未对一个女人如此着迷。”


    Grace 的呼吸一滞。她并不会说亲吻他是个错误，但她还没有准备好迎接涌入体内的的情绪洪流。她从未经历过这种感受。她试图压过这些情绪，说道：“我觉得我必须在倒下之前回到房间。”

