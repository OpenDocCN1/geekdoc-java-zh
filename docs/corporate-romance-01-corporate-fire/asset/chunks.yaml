    罗斯前往图尔萨的飞机在 4:10 起飞。他拿走了她的钥匙，要把滑雪板放进她的 SUV 里。期间，她尽力完成了她例行的打扮程序，甚至化了妆并穿好了衣服。她很快意识到，没办法让牛仔裤穿过包着的腿部，于是她穿上了滑雪裤，搭配了一件深红色的毛衣。


    费劲让她精疲力竭，她回到床上，拿起数独游戏。等罗斯回来时，她已经进入了一种状态，就像她编程时那样。


    他说：“老兄，你那支铅笔动得飞快。准备好出发了吗？”


    她说话时没有抬头。“你介意把我的书和笔记本包放进我的行李箱吗？”


    “没问题。”


    她听到他把东西收了起来，但他并没有去收东西，而是坐在了她身边。


    他说：“所以那些应用书是怎么回事？你在做些要售卖的东西吗？”


    她的铅笔慢了下来，但她没有立刻回答。她甚至还没告诉吉尔 `Jewel Chase` 的事。她一直打算告诉她的，只是总是会退缩。


    她说：“没什么大不了。只是我为了消遣做的事。”


    他把手放在游戏书上方并按了。“我觉得这意义重大，因为你没告诉我关于它的事。”


    他在黑色 T 恤外面套了一件靛蓝色的毛衣。他还没刮胡子，这很性感。他的眼神没有从她身上移开，她最终告诉了他她的秘密。


    “这只是个小游戏，我想着上传上去看看会发生什么。”


    “看看会发生什么？你得推销这些东西。”


    “我不确定它值不值得营销。”


    “我可以玩玩吗？”


    格蕾丝放下铅笔和游戏书。“我以为我们该上路了？”


    “你住在哪里？”


    “市区。”


    “我们有时间。”


    他等她从床头柜拿起手机。她没有立刻解锁屏幕。他凑近吻了她的脖子、脸颊和嘴。当他触碰她的唇时，她用手指环住他的脖子，让他久留留。


    “别走，”她说。“明天请个假，我们在这里再住一晚。”


    他继续吻着她，让她躺在枕头上。“刚跟我老板说完话，这不是个好主意。”


    他挪到她身边举起手机。她甚至没注意到他从她手里拿走了。他说：“尽管我很想和你亲热，但这真的会让我们迟到。给我看看你的游戏。”


    她抢了回来：“这又是一个没人知道的秘密。我甚至没告诉过吉尔。”


    罗斯紧紧抱住她。“你需要让人们走进来。他们并不是都想针对你。”


    “那个开掉我的人这么说的。”


    他捏了捏她，吻她，直到她以为他们可能会一直亲到不得不离开为止。但他最终推开说：“这不是常常状况。我真的很想看看你喜欢做的东西。”


    “答应我不要告诉我它很糟之类的。我现在可受不了。”


    “我发誓。”


    她终于解锁了手机，打开了一个色彩鲜艳的屏幕，配有一段结尾带有叮叮声的小片曲。`Jewel Chase` 的字样出现了，接着是一个简单的迷宫，格蕾丝说：“你需要解迷宫并收集宝石。快速解谜会获得加分，收集更多宝石也会获得加分。在更高关卡，宝石会变得稀有，所以如果你错过了，除非你从头开始，否则可能再也看不见了。”


    头脑比昨晚清醒了，她手指划过迷宫，捕捉了所有宝石，并在时间限制前很早完成了。“就是这样。你想尝试下一关吗？”


    “好，这很酷。”他按了 `continue`。他的手指划过迷宫，在时间结束前到达了终点。“噢老天。我没拿到任何宝藏。”


    “但你到了迷宫终点，所以你可以进入下一关。”


    罗斯点击了 `continue`，这次他收集了所有的宝石，但在时间结束时离终点还很远。“嘿，我得到的那些宝石都去哪了？”


    “你没走到终点，所以它们消失了。”


    “噢，来来。我要重新开始。”


    格蕾斯靠在罗斯的肩膀上，喜笑溢颜。这个游戏正如她希望的那样——足够的挑战性让他感兴趣，又不会难到让他放弃。他在第六关卡住了，接着在第九关又卡住了。


    格蕾斯看了一眼时钟说：“嘿，十十一点了。你的飞机是几点的？”


    “该死。”格蕾斯听到了失败的声音，但罗斯对她笑了笑。“你得推销这个。它真的让人上瘾。”


    “我不知道怎么做那些。”


    “我懂——或者以前懂。那是我学位的专业，我也一直在保持关注。”


    “如果你有营销学学位，到底为什么会开掉人？”


    他把手机放在床上，试图把格蕾丝揽进怀里，但她推开了他的手。他说：“我不想聊我的工作。”


    “我想聊。而且我告诉过你了。”

    '
- fmt: '

    “Yeah, do you need a ride?”


    “No, I''ve got it covered.” It was the nicest conversation she''d had with him
    recently. Of course that didn''t last.


    “So why haven''t you responded to any of the group emails? We''re getting together
    tomorrow at Tony''s and hoping you''ll come.”


    “I haven''t checked my email since Thursday. I''m really not in any shape to meet
