    To his surprise, she leaned in with her face only inches from his. “I''m not going
    to do that. I''m afraid soldiers are a weak spot of mine. You spent all that time
    serving our country, so I''ll have to buy you dinner at least.”


    He brushed a stray hair away from her eye and tucked it behind her ear. Kissing
    her now would be too fast given that they were pretty much strangers, but she
    didn''t seem to be holding back.


    And then her phone rang.

