    Royce kept kissing her but slowed the pace until their lips closed together. He
    lifted his chest off of her, and whispered, “It''s probably a good thing room
    service arrived just now.”


    She held her breath, unable to respond. She didn''t know whether she was glad
    or not. A part of her was ready to make the sex at the bar last night look tame.
    Another part of her wanted to retreat and slow things down.


    “Room Service.”


    “Coming,” said Royce, standing up. He picked up a book that had been on the bed
    behind him and handed it to her.


    “Suduko! How''d you know I love these?”


    “It was either that or a shirt that said Denver.”


    She grinned and said, “Good choice.”


    He took the bag of water off her leg and set it on the dresser. When he finally
    opened the door, a white-coated waiter rolled in a cart holding plates, a basket,
    glasses with ice cubes and a two liter bottle of Coke. Royce moved the laptop
    bag, programming books and cell phones from the table and placed them on the nightstand.


    As the waiter set everything on the table, uncovering the plates of pasta and
    revealing a basket full of breadsticks, Grace laughed and said, “Coke? Exactly
    what was in your file on me?”


    “I just figured wine was out for tonight. Programmers on TV always drink orange
    soda, but you seem a bit more sophisticated than that.”


    As Royce tipped the waiter, she admired his casual grey suit. The collar of his
    black shirt was open enough to show a black undershirt below. Good thing she''d
    chosen to dress up for him. She''d feel pretty off balance right now if she''d
    worn yoga pants and a cami.


    Once the waiter left, Royce held out his hand to her. She grabbed it and stood
    up, wincing in pain.


    Royce asked, “Should I get more ice now? I meant to ask the waiter, but I forgot.”


    “That''s okay. Maybe after dinner you could get some for me. Do you know when
    I can take more pain medication?” She had no idea how long it''d been.


    Thankfully, Royce was on top of it. He looked at his watch and said, “One more
    hour.”


    He helped her hop over to the table. She didn’t want to break contact with him,
    but she sat and let go of his hand.


    Royce poured them the Coke and held his glass up to toast. “To our first date.”


    Grace clinked her glass against his and said, “Thank you.”


    They ate in silence, Grace a bundle of sudden nerves, having no idea what to say.
    It wasn''t as if she''d never dated, but her brain seemed fuzzy. She really wanted
    to ask him why he fired people for a living, but she didn''t want to talk about
    something so unpleasant. Finally she realized she needed to even out the relationship
    a bit since he''d listened to her answers to all those embarrassing questions
    in the doctor''s office.


    Royce had started making small talk while she tried to make sense of her blurry
    thoughts, and when he paused she blurted out, “So I''m assuming you don''t have
    a girlfriend. When was the last time you had sex, and were you tested for HIV?”


    Royce coughed but managed to swallow his food instead of spitting it out. “Where
    did that come from?”


    “Well, you know I haven''t had sex in forever, and I''m not pregnant. I think
    you owe me a little info here.”


    “Going in the examination room with you was your idea, not mine.” Royce sounded
    put out, but he grinned.


    “Hey, I was in shock, and I''d just been sexually harassed by the medic.”


    Royce put his fork down and raised his hands in surrender. “Okay, you win. I haven''t
    had sex in six months, and I''m HIV clear.”


    Grace''s eyebrows shot up her forehead.


    “What''s that look?”


    “I don''t know. I guess I just thought you had a different woman in every town.”


    “I think I should be insulted, but I''ll let it pass. I don''t have all your rules,
    but I like my relationships serious.”


    Grace gazed into his eyes, her emotions for him intensifying with each word he
    said.


    Royce cleared his throat and changed the subject. “I was surprised to see programming
    books on the table. Do you have private contracts?”


    Grace blushed. She hadn''t told anyone about her app project. She took a bite
    of the pasta so she could avoid the question a little longer. When she''d swallowed
    she said, “That''s just something I do for fun. It''s not a contract or anything.”


    “You program for fun?”


    “Well, yeah. Would you ask a professional musician if she enjoyed playing her
    instrument?”


    Royce laughed and said, “I guess not, but I never equate musicians and programmers.”


    Grace shrugged, feeling a tiny bit of annoyance rising, and said, “I love what
    I do.”


    “So what''s the project?”


    Grace lifted her nose. “I don''t know if I want to tell you.”


    “In that case maybe I won''t share dessert.”


    Grace gave a mock gasp. “You''d keep dessert from a wounded skier? That''s just
    cruel.” At that moment the pain in her leg suddenly increased, and she let out
    a moan.


    “You okay? You should probably get your leg back up, and I should get you more
    ice.”


    “I can finish dinner, and maybe we can have dessert in bed—I mean… that didn''t
    come out right.”


    Royce grinned. “Sounds just right to me. I should''ve mentioned earlier that the
    way you''re dressed takes my breath away.”


    “Really?” This man was going to make her crazy.


    He took her hand and pulled it to his lips—so soft and warm. “You''re a conundrum,
    Grace.”


    “How so?”


    “You''re vital and strong—you would''ve won the race if you hadn''t hit that deep
    patch of powder, but you have this vulnerable side too with all your rules. Have
    you been badly hurt in the past?”


    Grace lowered her eyes and withdrew her hand. His question took her back to her
    parents standing over her as a child yelling at her about the spilled milk or
    the dirt on the floor or the book on the table. She picked at her food without
    answering Royce. He was getting too close. She didn''t talk about these things—ever.


    After a pause Royce said, “I''m sorry. I didn''t mean to upset you. I just want
    to understand you better so you''re not uncomfortable around me.”


    “I''m too comfortable around you is the problem.” She put her fork down, and her
    words tumbled over each other. She didn''t mean to tell the whole story, but it
    spilled out on its own.


    “I''m a bit, well maybe a lot, OCD. I like things exact. My parents are very strict.
    I can''t tell them I was laid off. Some of the OCD was probably how I was born,
    but some of it I think was living with them. I wasn''t allowed to leave anything
    out of place or make mistakes. I was so worried I''d do the wrong thing that I''d
    overdo everything. If I put a book away, I couldn''t leave the bookshelf until
    I''d alphabetized everything on-de it. They medicated me, but it made me stupid
    and life uninteresting, so I swore I''d get over it on my own. And I did, but
    I have all these idiosyncrasies left that I can''t get rid of.”


    She''d kept her eyes lowered the whole time she talked, but now she stared straight
    at him. He appeared stunned and didn''t speak. The silence was worse than anything.
    It was only a few seconds, but to her it seemed like few minutes. She''d really
    blew it. She clutched the napkin in her lap. Tears brimmed at her eyelids. “You
    don''t need to sit there trying to think of an excuse to leave. I know I''m a
    wack job. You can just go, and I''ll understand.”


    ## Dessert


    In an instant Royce jumped up, swooped her up in his arms and held her to his
    chest. Her leg ached even more because it was pressed against his arm, but she
    was too distraught to notice. “Hey, it''s okay now,” he whispered. “I''m not leaving
    you. You didn''t have to count the pasta on your plate before you ate it, so I
    think we''re good.”


    She started breathing again. He was holding her instead of running out the door.
    After a moment, she put a hand on his cheek. “I''ve never told anybody any of
    that. I prefer people think I''m a little kooky rather than full-blown insane.”

