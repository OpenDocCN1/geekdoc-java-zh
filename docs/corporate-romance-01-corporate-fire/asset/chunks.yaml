    “为了什么？”格蕾从未见过朋友如此沮丧，尤其是因为一件显然关乎格蕾的事情。尽管格蕾把吉尔看作最好的朋友，但她知道这种感觉并不对等。尽管如此，她和吉尔的关系一定好到足以引起这种反应。


    吉尔摇摇头，拉着格蕾的手走向一间空置了一年的办公室。隔壁办公室的门开了，同事 Java 程序员道格走了出来，脸上写满了震惊和错愕。他看到了格蕾，说道：“连你也是？”


    等她来得及回答，另一个来自早晨招呼小组的男人也从道格同一个办公室走了出来。他很年轻，带有一种邻家男孩的魅力。他说：“我准备好见加里了。”


    吉尔点头，捏了捏格蕾的肘部。“我很抱歉。”吉尔歪看向那扇关上的门，转身走开。


    道格把手放在她的肩膀上，格蕾从他的抓手里缩了回来。她讨厌除了朋友以外的任何人碰她。道格作为一个同事还行，但他事事事挑剔；对于格蕾这样的完美主义者来说，那简直是地狱。“天呐，格蕾，我只是想说对不起。你总是这么冷淡。”


    直到他走过她身边，她才重新顺过气。一定发生了什么糟糕的事情。格蕾不知所措地走进去，发现那位“公司之神”正翻阅一个标签上着她名字的牛皮纸文件夹。她再次屏住呼吸，但这次是因为“我的天，我不敢相信我竟然和他呆同一个房间里”的心情。近距离看，他甚至更帅了。眼角细细的纹路告诉他已经步入三十了，比格蕾大一点。吉尔不应该为把她单独留和他相处而道歉；她应该用她兴奋时那种会变高的音调说话才对。


    他抬起深蓝色的眼睛，凝视了一片刻，然后说道：“格蕾，请坐。我是罗伊斯·亨德烈。”


    格蕾握了他的手，在那个有力而有力的握手期间一直屏住呼吸，心跳剧加速。他从某种程度上符合她的第一准则：她约会的任何男人都必须认识她认识的人。这可能只是松散的关系，但显然他认识这家公司的某人。如果他不是滑雪手，从他健壮的身材来看，他可能很快学会。也许如果她胆子大，明天他们可以一起去滑雪。但当她收回手再次看到自己剥落的指甲油时，所有的勇气消失殆尽。她握紧拳头，希望他没有注意到。沉默持续了。噢，轮到她说话了。“很高兴见到你，亨德烈先生。”


    这似乎像是一句得体的话，但他歪着头皱起眉头，仿佛从未有人对他说过这样的话。他整理了一下她文件夹里的文件，在再次对上她的目光之前说道：“呃，是的。我希望我们能在更好的情况下见面。我有一个不幸的任务，要通知你，高高创新（Mile
    High Innovations）正在辞退所有的 Java 程序员。绿意之地（Greener Pastures）在这里是为了让你的过渡变得更容易。这份材料将帮助你开始新生活。”他递过文件夹，上面印着一片草地和野花的照片。


    上方的荧光灯像苍蝇一样嗡嗡响。格蕾眨了眨眼，不愿理解他说的话。


    他清了清嗓继续道：“你的遣散费是慷慨的三个月，但像你这样努力工作的人会在短得的时间找到新工作。我们为所有的 Java 程序员提供免费的猎头服务。我希望你能利用它。”他越过办公桌，将文件夹拿离她更近的地方。


    她的大脑一片空白。她一直盯着文件夹，终于问道：“我是被解雇了吗？”


    “不，那意味着你做错了什么，或者你是唯一的那个。这是一次公司裁员，但我们更倾向于将其看作迈向更好的事业。”


    她摇了摇头。她本应该以一种极其专业的方式和这个男人调情。“不，这一定是有误会。我在这里每年都会加薪。我的上一个项目帮助他们谈成了一笔数百万美元的交易。”


    “这就是为什么你应该利用我们的猎头计划。这里——”他放下文件夹，手向西装外套里摸去。他掏出一张名片放在文件夹上方。“给特莉打电话。她是我们最顶尖的猎头。她会帮助你把这次损失化为胜利。”


    格蕾盯着名片看却如视而不见，然后看向他的眼睛，那现在是冰冷的蓝色。她的脸因为尴尬而红了。“我早点来是为了完成——我说过很高兴见到你——我看起来一定像个大傻瓜。”房间模糊成了一串连续掉落的数字零。


    “不，不，完全不是。我希望我的同事能有你一半的工作伦理。”


    “为什么？显然这并不重要。他有工作，而我没有。”格蕾的脸依然发烫。她不敢相信，这家她不仅投入了 9 到 5 工作，还投入了晚上和周末的公司，竟然在除掉她。


    “我会亲自给特莉打电话，告诉她我对你留下的深刻印象。她会很快为你找到一份工作的。”


    格蕾反复眨着眼。她太误读这个男人的了。谁会想和一个以开除别人为生的人去滑雪呢？


    他清了清嗓子说：“请给我你的钥匙卡。”


    格蕾不知道自己在那儿呆口呆了多久。一定过了一会儿，因为他又说了一遍：“钥匙卡？”她站起来，伸手进口袋，把钥匙扔给他，然后离开了办公室，留下了文件夹和名片。


    ## 2 | 离开


    格蕾把办公桌上属于她的几件物品拿走，塞进背包里，用力地眨着眼，因为她拒绝在大家面前哭。作为一种反抗，她捡起吉尔撞倒的可口乐罐，把剩下的液体全倒在了键盘上。


    “是啊，你给他们看。”身后传来一个声音。


    格蕾猛转过头，看到道格正隔着格子间的半墙看着她。他们是同一时间入职的，但这五年每个人留下的痕迹不同。她保持着体型，看起来和上班第一天时无二致，但他发福了。他不胖，只是肉肉肉的。她丢掉罐子说道：“吉尔来找我的时候它已经洒了。”


    “如果你弄坏这里所有的键盘，我没意见。刚才我很抱歉。我只是对被解雇的事很生气。”


    “没关系。”但其实不是。如果他再碰她，她可能会叫起来。她以为和一起工作的同事现在应该知道不要碰了。她每次局缩的样子一点也不友好。


    “如果他们要开除你，我想他们要裁掉所有人。虽然有一次你搞砸那封邮件——”


    “我不是被解雇，我是被裁员了。”当她在脑海中重复罗伊斯的话时，她心里很不舒服。“那不是我的错。我是发现问题的人，那是你的代码。”


    他耸了耸肩。“也许吧。我不认为，但也许吧。”


    “请离开。”她说话时盯着地板，感到一阵想哭的冲动。


    “等等，我很抱歉。”他越过墙抓住她的手臂，但她逃脱了。“在你面前我总是说错话。我不明白。”


    她把眼水憋回去，直视着他。“你总是侮辱我。有什么不明白的？”


    “我们要去托尼那里。他们担心找新工作，但我并不担心。我刚拿到了黑客认证——公司会求着我去保护他们的系统。总之，人们也许能为你提供一些工作机会。想一起去吗？”


    “不。我要彻底离开这个城市。”她不知道自己为什么这么说，也许只是为了给自己找一个合理的借口，不去和大家聚在一起喝酒哭泣。这不是她的风格。


    “噢是吗？你要去哪儿？”


