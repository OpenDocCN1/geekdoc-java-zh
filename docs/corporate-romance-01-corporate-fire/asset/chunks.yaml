- fmt: '

    “I have no idea. I didn''t want to say anything about him because why should I
    know what happened between him and Royce?”


    “I thought I was the paranoid one. Thanks for the heads up. Gotta get ready for
    my doctor appointment.”


    She hung up the phone and said, “Jill says the police are interviewing all of
    the Java programmers who were let go.”


    Royce looked up from pouring two bowls of cereal. “Shit, hopefully I''ll be gone
    before they get to you. According to Ted, the security guards are saying they
    don''t know anything about a `keycard`. As far as they know, I took all of them
    that day.”


    “You’re kidding me. Does that mean you''re a suspect?”


    “That means I''m sure they''d love to talk to me, but as far as everyone knows,
    I''m in `Tulsa`. I imagine I''ll get a call eventually. Let’s eat.” He took the
    bowls to her kitchen table.


    Her stomach churned. Doctors and police officers—her throat tightened at the thought
    of the police officers. But she hadn''t done anything, and Royce hadn''t done
    anything. There was no reason to freak out about the possibility of being interviewed
    by them. Still, police. They were coming to her apartment.


    “I''m not hungry.”


    Instead of sitting down Royce came back to soothe her. “It''s okay. I have no
    motive. Why would I want to set it on fire? Ted heard me tell the security guards
    to get Jeff''s `keycard`. His voice sounded pinched and exhausted.


    “You''re worried. I can tell.”


    “Then let me worry. Not you. Soon you''ll be all doped up again and trying to
    talk me into sex.”


    She grinned before he kissed her again. It was a momentary reprieve, but the thought
    of the police being in her apartment hung at the back of her mind.


    ![](images/00006.jpeg)


    The doctor visit was much like the one in the clinic, with nurses asking her personal
    questions and the X-ray people twisting her leg around until she wanted to punch
    someone. They doped her up before they set her leg even more than they had on
    the mountain. Despite all the medicine Grace thought she''d break Royce''s hand
    in her grip. With her cast on and prescription filled, she was slightly loopy
    as Royce drove her up to her apartment complex. She pulled out her phone to let
    Jill know everything had gone all right only to find about a dozen texts on her
    phone from former coworkers. They all said the same thing: “Don''t mention the
    emails.”


    “What the hell?” she said.


    “What''s wrong?” asked Royce.


    “I have all these texts telling me not to mention the emails to the cops.”


    “What emails?”


    “I have no idea. I saw there were a bunch of emails in my inbox from former coworkers,
    but I only took the time to read yours yesterday.”


    Royce parked and turned off the car. He twisted to look at her and said, “That
    sounds like they''re trying to cover something up.” He leaned back against the
    headrest, closed his eyes and ran his fingers through his hair. He put his hands
    back on the steering wheel but didn''t look at her as he talked. “I can''t stay.
    I have to get back---”


    “I know, don''t worry about it. I can handle it.”


    He turned to her and said, “But what if the police come while you''re all doped
    up?”


    ### The Investigation Begins


    The world was a wonderful place at the moment, and she couldn''t imagine anything
    going wrong. “I have nothing to tell them. I didn''t set the building on fire.”


    He put his hand on her neck, and she wished he would kiss her, but instead he
    said, “Just don''t say anything about us. I don''t know who has the `keycard`,
    and if I get mixed up in it because I didn''t take it from Jeff, I don''t want
    to cause trouble for you.”


    “Sure. There''s no reason I should mention you. Who''d believe I was getting it
    on with the guy who fired me anyway?”


    “I didn''t fire you---” She grinned at him until he finally leaned in and kissed
    her. “You''re gonna drive me crazy.”


    “That''s the plan.”


    He gave her one more kiss and said, “And let me know what those emails say when
    you''re feeling up to it. Have you texted Jill?”


    Grace rolled her eyes. “You''re so bossy. I was just about to when I saw all those
    texts about the email.”


    Royce finally got out of the car and walked around to help her out. Up in the
    apartment, he set her up with a movie while she chatted about how sexy he was
    and how much she loved him.


    “I can''t believe I''m missing out on you on meds again,” he said before he kissed
    her and ran back to the bedroom to get his things.


    “It''s probably your last chance because I''m never breaking my leg again.” Maybe
    the drugs would keep the gaping hole away when he left. She hoped they took their
    time wearing off at least.


    He ran back out with his carry-on rolling behind him. His phone rang, and he pulled
    it out of his pocket. “Oh fuck. It''s the CEO.”


    Grace listened to the one-sided conversation.


    “Hello?”


    “But sir, you need some of the seasoned workers to bring your company back up
    to its full potential.”


    “I know it''s not my company. I just want you to be successful.”


    His tone of voice changed to defeat. “I understand. I''ll be in soon.” He hung
    up and put the phone back in his pocket.


    “He didn''t go with your plan?” she asked.


    “He''s going with Ted''s plan of firing all the highly paid employees so he can
    keep as many people on as possible. He''s hoping to keep the numbers down so it
    won''t sound so bad in the news.”


    Grace sobered enough to say, “You tried your best.”


    “You know, I thought I was pretty good at my job until I saw how much losing your
    job depressed you. I had convinced myself that people just moved on to the next
    job, a better job. Now I have to go tell several long time employees, longer than
    you, that they''re done.”


    “You could always stay here.”


    ### The Police Arrival


    Right after the words came out of her mouth, the buzzer sounded. Her eyes widened.
    She''d forgotten about the police.


    Royce started to answer it, but she said, “I''ll get it. It''s probably the police.
    You need to leave.”


    “But you shouldn''t answer questions in your state.”


    “I''m not a suspect. Besides, if you stay you''ll miss your plane and lose your
    job for sure.” She couldn''t believe she said the last part. The buzzer sounded
    again. She reached the door. opened it.


    He gave her a doubtful look but kissed her as he walked out the door. It sounded
    like Royce reached the door as she buzzed it open. When she turned the stairs,
    she pushed the intercom.


    “Yes?”


    “Grace Arden?” said a female voice.


    “Yes.”


    “I''m Detective Carlisle. I''d just like to ask you a few questions about the
    fire at `Mile Innovations`.”


    Her stomach tightened, and she couldn''t think straight. She wished Royce had
    stayed, though she didn''t want him arrested. She refrained from calling out to
    him and said into the intercom, “Sure, come on up.”


    The woman smiled and held out her badge as she reached the top and said, “I''m
    sorry about your leg, but this will take just a minute, and then we can cross
    you off our list.”

