    Grace woke to the sound of Royce''s voice in the living room. 7:05 AM. Had he
    gotten any sleep or stayed up all night? His voice paused and started again like
    he was talking on the phone. She hobbled out of bed and to the bathroom before
    retrieving her crutches and hoisting herself out to see him.


    He stood in fitted boxer shorts and a t-shirt, his muscles defined like an underwear
    model’s. Her heart raced even though there''d be no time to make love to him this
    morning. He held a phone to his ear, but when he saw her, he told whoever it was
    that he had to go and hung up.


    “Hey,” he said. His eyes were shadowed and a tinge bloodshot. If he''d slept,
    it hadn''t been much. “I meant to get up and fix you breakfast, but my boss called,
    followed by Ted. It''s going to be a shitty day.”


    She turned up her thermostat, thinking he must be freezing. Not everyone liked
    the cold, but she usually kept her apartment at 65. “That''s okay. Cereal is good
    enough for me. Want some?” She made her way to the kitchen.


    He met her there and wrapped his arms around her and kissed her until she had
    to break it off just to breathe. He said, “Your apartment is freaking cold.”


    “Well, if you''d joined me in bed last night, I could''ve kept you warm.”


    “I''m sorry. I really needed to try to convince the CEO to save some people. And
    then I had to think about what you said about outgrowing my job. I told you before
    that it''s no fair using my own lines on me.”


    “It seems to be the only thing that makes you stop and think,” she said.


    He shook his head. “You make me think. You make me see my life in a completely
    different way.”


    “Then you''re quitting?” Her eyes widened as she spoke, but her face fell when
    he shook his head again.


    “I can''t do that. You got a severance package, if you ever bother signing the
    paperwork in your folder. I''ll have absolutely nothing if I just quit.”


    Before she could answer, her phone rang.


    Royce let her go and retrieved it for her.


    It was Jill. Grace said, “Hey, what''s up?”


    “I wanted to warn you that the police are interviewing all the former Java employees
    today. They just came by and asked if I thought any of them were more likely to
    do this than the others. I told them you were totally psychotic and not to believe
    your alibi.”


