    她将目光移向桌子。余光中，她看到他也转过了头。她抬头悄悄观察他，没被他发现，但他回看了她，并眨了眨眼。格蕾屏住呼吸。如果他走过来怎么办？那会违反第一条规则，因为他和她认识的任何人完全没有任何关系。她深吸了一气，告诉自己如果他走过来也没关系的。人们在酒吧里聊天是常有的有的事，这是酒吧里的正常行为。


    一名女生出现，在她面前放了一杯饮料。她甚至还没点餐。“我想搞错了，”她对女生说。


    “一位绅士为你买的，亲爱的，”女生说。她看起来几乎还没到可以上酒的年纪。“噢，这儿附了条信息。”女生在冲向下一张桌子之前，将一张印有酒吧名字的餐巾推到格蕾面前。


    在印章下方歪斜写着：“他不适合你。”


    格蕾很惊讶，抬头看向吧台。那个男人在再次移开视线前微笑了一下。她没看到他在餐巾上写字。那条信息是在说那个滑雪教练吗？她看了看那杯饮料：大格尾鸡——那是她去夜店时通常会点的。她回头看向那个男人。天哪。


    他的手现在按在一个正咬着他下唇的金发女人臀部上。为什么他只是在等他的约会，却在和她调情呢？他捏了捏女人的臀部，然后将手滑向她的大腿，顺着她的短裙向上移动。格蕾睁大了眼睛——即使在一百次约会后，她绝不会在公共场合允许那样。那个女人走近了些，他的手又向上滑动了一点，让格蕾感到一阵颤栗。她盯着他们的脸。他们说话的样子就像他没有在酒吧里抚摸女人的隐私一样。红晕染红了格蕾的脸，她移开眼睛看向餐巾。所以如果那个男人不是给她发信息，而是别人在发。她把餐巾推开。她已经被骗过两次了。第三次总会好的。她盯着饮料，手指在桌子上敲击。它看起来很欢快——可能是她一整天看到的最让人开心的东西。她小口抿了一口，让明亮的味道浸入舌尖。她的心情稍微好了一点。她至少应该感谢那个男人。她从包里拿出一支笔时，手在抖。她告诉自己她不会和任何人约会的——只是告诉某人。在把笔收起来之前，她在餐巾的另一面写道：“谢谢你的饮料。它让我笑了。”她不确定最后那部分怎么写。似乎分享得太多了，但在她来得及揉餐巾之前，女生就把它拿走了。


    “我猜这是写给秘密恋人的对吧？”格蕾目瞪口呆地点了点头。她试图观察女生穿过人群的背影，但跟丢了她。格蕾大口喝了一口大格尾鸡。酒精在她的肩膀上发挥了魔力，她感到肌肉放松了。她看到滑雪教练的手伸进了金发女人的裙下，而金发女人闭着眼睛。滑雪教练的另一只手在腰上，但格蕾看到他的大拇指正在揉搓女人的乳头。老天爷，他们没意识到自己正处于公共场合吗？格蕾又喝了一口大格尾鸡，心想也许酒精能帮她理清这个夜晚的思路。女生在桌子上放了另一条信息。格蕾意识到这对夫妇让她脸红了。她清了清嗓子说：“是谁在给我发这些？”


    “他现在想保持匿名。”女生俯下身。“他帅吗？”话语从她口中而出，尽管只喝了几口，她却像已经醉了一样。“如果你说的帅是有钱又漂亮的话，真的吗？”她点了点头走向吧台。餐巾上写着：“让你微笑是今天发生过最棒的事。”哇。这个男人很老练。她及时瞥了一眼滑雪教练，看到他把手从金发女人的裙下抽出来。他把食指放在嘴里，然后又滑出来。他的约会对象用一个吻作为奖励——在唇吻之前，他们的舌头交在一起了。格蕾叠起双腿，感到既兴奋又对这种奇怪的痴迷感到羞耻。她从未想过自己是个窥淫者。她的浪漫小说就是她观察别人的唯一方式了。金发女人向后跨坐在他的一条腿上，这对夫妇又开始聊天。他把手放在手臂下，再次在她乳头位置的衣服上转动大拇指。她对他说的某句话笑了起来，格蕾强迫自己移开目光。这太奇怪了。她试图通过思考是谁在给她发信息来分散注意力。酒吧里满了人，但她没有看到明显有钱又漂亮的男人。让她更惊讶的是，似乎没有人注意到酒吧里上演的“成人电影”。每个人都在和朋友聊天；她似乎是那里唯一的单身。她转回餐巾，写道：“我想知道你是谁。”格蕾为自己震惊了。女生从桌上夺走了餐巾，而格蕾试图控制自己的呼吸。格蕾再次看向滑雪教练。他的大拇指已经压下了女人内心背的顶部，足以磨擦到乳头的皮肤。格蕾的乳头硬了。能如此无拘忌简直是梦想成真。他的另一只大拇指按在金发女人的裙子上，那里下面一定是她阴蒂所在。金发女人把头向他靠，当金发女人在他耳边耳语了什么时，他面对格蕾。格蕾知道自己因为看着而湿了。这太不像她了。他对着格蕾眨眨眼，微笑了一下，然后点了点头。他转开格蕾，移动了身体，让他的背对着格蕾，而金发女人的背抵着吧台。他盯着自己的腿了一分钟，然后站了起来，金发女人的手抓着他的臀。当他的臀部抵着她时，她的指节泛白了。一群人从他们面前经过，但在格蕾看到女人对她微笑之前。格蕾紧紧并双腿盯着桌子，当另一张餐巾被放在她面前时，她流汗了。“滑雪教练让你兴奋了吗？”噢不，噢不，噢不。他完全误解了她。她在做什么？和陌生男人调情并接受他们的饮料，同时还在酒吧里看一场偷窥秀？她应该直接离开。她喝光了大格尾鸡，希望酒精能让她足够冷静，以便她能在不发抖的情况下走出酒吧。酒精在血液中流淌并稳定了她的神经，她决定至少应该再写一条信息来把事情说清楚。“我更喜欢隐私。”这样，简单明了。酒精在她的血管中蔓延，她发现自己又坐了回去。至少她没有考虑她的工作。也许我可以做到这一点。也许我可以遇到一个陌生人。女生走过来拿走了餐巾，紧接着一个男人熟悉的声音走近。“我本来希望你真的来这里了，而不是只是在敷衍我。”道格绕过桌子，坐在另一边的椅子上，还穿着他的工作服。

