  trans: '

    她轻轻摇了摇头，希望能再出现一杯康乃尾鸡。但如果道格（Doug）坐在她身边，那个陌生人可能会失去兴趣。“没什么。你知道的，告诉你我要来布雷克金农并不是一种邀请。”


    “是啊，但这给了我们一个在工作之余互相了解的机会。我们在托尼那里可真想念你。你听说杰夫（Jeff）揍那个开除你的家伙了吗？”


    “什么？”


    “啊，这引起你的注意了。保安人员不得不把杰夫请出去，闹得很大。”


    “他动手了？”格蕾丝（Grace）不知道自己为什么会对罗伊斯（Royce）感到同情。比起丢工作，挨一拳算便宜的。


    道格把手放在她的手手上说：“这让你兴奋吗？要不要我去查查他住在哪儿，也揍他一顿？”


    “什么？不！”格蕾丝从他的握中挣回手。那种触碰、那些纸条以及酒吧里的性爱在她脑海中汇聚在一起，让她急促呼吸起来。她可能会陷入严重的过度换气。


    “你到底怎么——”


    仿佛为了救她一样，女服务员在她面前滑过另一杯康乃尾鸡，随后又一张纸巾。


    格蕾丝伸手去拿纸巾，道格却抢了过去。他大声读道：“如果那是你的约会对象，我很抱歉。我应该停止送饮料吗？”


    “把那个还给我！”


    道格环顾四周说：“你在搞什么鬼？你在和一个从未见过面的人调情？我听过你是个守女。”


    格蕾丝抓住那个新康乃尾鸡杯的杯梗，纠结是该把它扔在他身上还是喝掉。她喝了一口，那种避免混乱的本能让她发挥作用。酒精让她冷静下来，呼吸恢复平稳。“把纸巾还给我。不关你的事。”


    “不好意思，小姐，这个先生打扰你了吗？”


    格蕾丝转向陌生人，兴奋地觉得他一定就是发纸条的人。他是那种邻家男孩型的帅。奇怪的是，他看起来很眼熟。说话时她的心跳加速。“嗯，没关系，谢谢。是你刚才在给我发纸条吗？”


    男人笑了，但在他回答之前，道格跳了起来喊道：“你整晚都在跟他调情？”


    “他一直在给我送饮料。”


    “那是那个开除我的混蛋！”


    格蕾丝感觉血液在几毫秒内从头顶流到了脚尖。“你想干什么？”


    他冷静地伸出手。“我是泰德（Ted）。我过来只是为了帮你摆脱这个家伙。来吧，我们去酒吧坐坐。”


    对被裁员以及其中一个当事人试图约她的这个念头感到愤怒，她直接把康乃尾鸡洒在他身上，把杯子放回桌上。“离我远。”


    她身后一个男人清了清嗓子。她转过身看到了那位公司之神。他的蓝眼睛显得很歉意，他说：“我觉得这有些误会。我给你送饮料时，其实在考虑如何接近你。我真的希望我们能在更好的情况下相遇。”


    “所以你派你的伙伴先来搭讪我？我的生活对你来说是某种病态的笑话吗？”她的视线因泪而模糊，直接甩了他脸一个耳光。


    没理他想说什么，她推开他，穿过门来到大厅，然后是门堂，高跟鞋在瓷砖地板上咯哒作响，在电梯前停下。一只手落在她的肩膀上将她转了过来。


    “道格，别碰我！”


    但不是道格。是罗伊斯。他的名字在她脑海中跳得太快了。她讨厌他，所以无法忍受他那该死的蓝眼睛让她的脉搏加速得像在雪道上一样。他说：“我不想让泰德跟你说话。他过来跟我没关系，除了我之前太胆小，没能亲自去做的。”


    她本该甩开他的抓着，但她没有。“放过我吧。”电梯开了，她走了进去，挣脱了他的手。


    他跟了上来说：“对我相遇的方式我很抱歉——”


    她按了顶层的按钮。“你的工作就是我们相遇的原因。”电梯门关闭时她滑了出去。他的眼神似乎在哀求她不要离开，尽管他留在了电梯里。


    格蕾丝转向楼梯间，手脚颤抖着开始了她步行四层楼的征程。什么样的人靠开除别人为生？


    不幸的是，是那种看起来像 GQ 模特的人。


    ## 4 | 赌约


    格蕾丝比计划晚醒来，是被短信声吵醒的。她从床头柜拿起手机，看到吉尔（Jill）打的几个未接电话和短信。她叹了口气，坐起来，试图思考怎么回复最好。“我被那个开除我的男人跟踪了，”这个念头浮现在脑海，但她甚至没法开这种玩笑。


    她真是个失败者。


    她整晚的总和就是看着一个滑雪教练在酒吧鬼混、拒绝道格、向头号裁员扔了一杯饮料，然后扇了罗斯的脸。她甚至不应该知道他的名字。她手垂在床边，让手机掉在地上。


    手机又响了。


    她歪头探出床沿去看。“我是道格。和我一起吃早餐吧。”


    他不应该有她的私人号码。她必须得甩掉道格。她拿起手机打字道：“去滑雪吧。我不会和你约会的。”


    过了一会儿她看到：“我已经等了很久了。滑雪愉快。”

