    Grace drew in a raspy breath. She blurted out, “I was hoping you were a skier
    too and would come skiing with me this weekend. I was really stretching rule number
    one to make you fit.”


    “Ah, the rules. Time to tell me about them so I don''t break them.”


    She wrinkled her nose at him. She should never have brought them up. “You don''t
    want to know those. It''ll make me seem freaky.”


    “I think it will make you adorable.”


    She giggled. “Welllll, okay. I only date people who know people I know. I don''t
    like touching, even sometimes on the second date. I don''t kiss until the third
    date, and I don''t have sex for ten point five dates.”


    “So precise.”


    “I''m a programmer.”


    He looked down at their hands and said, “I''m afraid I''m touching you. Should
    I withdraw my hands?”


    She shook her head slowly. “No. I don''t know why it doesn''t bother me when you
    do it.”


    Before `Royce` could reply the doctor came in and introduced herself. “Hi, I''m
    Dr. Young.” She held out her hand to shake, and Grace had to let go of `Royce`.


    She shook the doctor''s hand and said, “Hi, I''m Grace Arden. And this is the
    most handsome man who will ever fire you, `Royce`, whose last name I forgot.”


    The doctor tried to hide a smile and shook `Royce`''s hand. “Hendrix,” he said.


    The doctor said, “Sounds like the drugs are doing their job. I have some for you
    to take tonight and tomorrow until you can get home and fill a prescription. Your
    leg is definitely broken, but the good news is it''s only in one place.” She put
    the X-ray up on a lit board and showed them. She used a lot of technical terms
    that Grace was too drugged to follow. `Royce` asked some questions like he was
    her husband. She should''ve found it strange, but mostly she was relieved to have
    someone paying attention for her.


    She heard the doctor say, “So I''ll wrap it to keep you from moving it, but you
    should make an appointment at home with an orthopedist to set it in about three
    days. Are you her ride home, `Royce`?”


    The question jolted Grace, and she said, “No,” just as `Royce` said, “Yes.”


    “I can''t impose on you like that,” said Grace. “I''ve got friends and family
    I can call.” She thought of `Jill` and the unanswered texts. She really needed
    to call her.


    “And what?” said `Royce`. “Make them drive all the way up here to get you? What
    are you going to do with your car? I can drive you home in your car, and `Ted`
    can follow in the rental. It''s really the best solution. I''m a safe driver.
    You can call all the places I''ve rented from if you need references. They love
    me there.”


    Grace envisioned him staying at her apartment and letting `Ted` drive on alone
    to the airport. She gave her head a shake. That was the medicine talking. She
    never allowed men inside her apartment. “Are you sure?” she said.


    He took her hand and said, “It''s the least I can do.”


    “So if that''s settled,” said the doctor, “here are your instructions for the
    next few days.” She handed Grace a sheet of paper and started going over them.
    Grace understood the first ones and then sort of glazed over thinking about `Royce`
    taking her home. And about tonight. She hoped he was still going to have room
    service with her. Pain thrummed at her leg reminding her she wasn''t exactly in
    shape to do much, but she didn''t want to think about parting from him.


    ## 7 | In the Room


    Grace hoisted herself on crutches through a back door of the clinic and down a
    hotel hallway. A bag of ice tied to one of the handles crunched against the metal
    as she went. The wood paneling and dim lighting made her wish she was curled up
    in front of a fire—with `Royce`. Too bad her room didn''t have a fireplace.


    She paused to catch her breath, steady herself and try to figure out how she was
    ever going to make it all the way to her room.


    `Royce` put his hand between her shoulder blades and said, “I can''t believe they
    couldn''t spare the wheelchair to get you to your room at least. I would''ve brought
    it back.”


    “I guess I have to get used to these some--” her voice trailed off as she noticed
    him carrying her ski boot. “My skis! What did they do with my skis? Did `Eric`
    take them?”


    He rubbed his hand in a circle on her back, causing tingles to arc through her
    skin. “Don''t worry. While you were being X-rayed, I snagged them off the snowmobile
    and took them to a rack next to mine by the outdoor bar. I''ll get them later.”


    She wanted to lean in and kiss him, but fortunately or not the crutches made it
    too difficult to try. “Thank you...again. This weekend has been such a disaster.
    It''s strange how happy I am right now.”


    `Royce` grinned. “I''d like to think it''s me, but I''m sure it''s the drugs.
    I''m just hoping you don''t hate me when they wear off.”


    “Hate is the furthest thing from my mind right now. You''ve been really, really,
    sweet during all this.”


    He pressed his palm into her back and stepped closer. Definitely in kissing range.
    “I''d like a little clarification on the rules. Since I''ve done so well holding
    your hand, and you haven''t shrugged off my hand on your back, any chance for
    snuggling while we watch a movie tonight? I''ll keep my lips to myself, I swear.”


    She wanted him to kiss her now. She recalled how last night she wished she could
    live without so many inhibitions, and the drugs had certainly lowered them. She
    should take advantage of the situation.


    Grace pushed herself upright, stood on her toes and tilted forward slightly. Her
    lips brushed his for one second of heaven. She kept her eyes closed savoring the
    tenderness. When she opened them, `Royce`''s eyes were popping out of his head.


    “I''m so sorry,” rushed out Grace. “Did I do something wrong? You look horrified.”


    `Royce` stepped around so his body was right in front of hers. He grabbed her
    by the waist and kissed her again—several times. No tongue, but his lips teased
    hers, telling her his desire without words.


    When he stopped he said, “I was surprised, not horrified. I''ve gone from being
    the object of your wrath to sharing intimacy you rarely give. I''ve never been
    so intrigued by a woman.”


    Grace''s breath hitched. She wouldn''t say it was a mistake to have kissed him,
    but she wasn''t prepared for the rush of emotions coursing through her body. She''ve
    never experienced them before. She attempted to push through them and said, “I
    think I need to get to my room before I collapse.”

