    “我先从培根和鸡蛋开始，然后往后推，”她说。


    在把盘子和一杯橙汁放在她面前后，他也给自己拿了一份煎蛋，坐在她的对面。


    她咯咯笑着说：“我猜你注意到这是我昨天早上点的菜了。我真的并不总是吃那么丰盛的早餐。但昨天，我从那时起没吃东西了，”她不想提到裁员的事，“自从我离开公司起。”


    “只要我们一起吃早餐，就会这样吃，我希望我们每次见面都是这样。”


    格蕾的心猛地跳了一下。她真的很喜欢这个男人。他管她叫“谜题”，但她觉得他更像个谜题。她说：“所以，我脑海中想象着你住在像《云端》里的乔治·克鲁尼那样的公寓。你冰箱里有变质的牛奶吗？”


    罗伊斯坏笑了一下：“我承认，我的公寓很像他的，但我希望这种比较仅此为止——尽管如果你觉得我像乔治·克鲁尼一样有魅力，我并不介意。”


    她挑起眉毛：“噢，你也喜欢男人？男生通常想要一女二的模式。我想我是那个幸运的了。”话一出口，她就掉了叉子，咬住嘴唇，眼睛依然睁得圆大的。她不敢相信自己竟然说了这样的话。


    罗伊斯抓住她的手，带着微笑越过桌子向她倾身。“我不认为你像人们表现的那样那么古板，格蕾·阿登。但我不会在床上和任何其他人分享你。”


    格蕾知道自己脸红了，必须换个话题。她清了清嗓子，从他的手中抽回手。“所以，你住在哪儿？是的，是时候问二十个问题了。我不希望你自己在没给我任何生活细节的情况下再次消失。你走得挺轻松的——”格蕾低低下头，笑声流了出来，“但也许没我那么容易。”


    罗伊斯大声笑了起来：“我正努力不让那种事情在我们离开再次再次。我不确定还能和你一起请假多久。”


    “这取决于你怎么回答我的问题。你能递给我一个华夫饼吗？”


    他把她的盘子换成了华夫饼盘，在他说话之前，她舔了一口鲜奶油。“我住在马里兰州。”


    格蕾瘫了下去。她猜到不在科罗拉多州，但现实似乎比比脑海中想象的糟糕。“该死。”


    罗伊斯用餐巾擦了擦嘴，然后滑到她面前蹲下。。“只要你想，我随时可以让公司在周末派我去丹佛，而不是回家。如果他们不答应，我有大量的常旅客飞行里程。那是我福利的一部分。”


    她用双手托住他的脸。“然后呢？即使我在马里兰州找到了一份工作，你也不会在那儿。”


    他把手放在她的臀部上，温柔地吻了她。


    当他什么都没说就离开时，她说：“你提到过你在这里长大。你在这里还有家人吗？”


    他的手在她的臀部收紧。“我的父母和哥哥。我已经多年没跟我哥哥说话了。”


    他的声音听起来很生气。她慢慢地说：“所以你并不打算搬回这里。”


    “丹佛很大，忽略我哥哥很容易，尤其是正如你所说，我反正不在身边。我怀念大山，但我的工作对我很重要。”


    她直视着他，终于鼓起勇气问出了她最好奇的问题。“你为什么要靠裁员过日子？”


    他皱起眉说：“我猜这是一个合理的问题。我很擅长这个。企业都是坏种蛋。我想让这个过程稍微好一点。”


    “为什么不干脆让他们自己干脏活呢？你很擅长与人相处。你可以在其他几十工作中游刃有余。”


    “用我的话来怼我并不公平。”


    她比这周末以来任何时候都要清醒。“你的工作会成为我们之间的一个痛点。我不看到如何绕开它。”


    他请求道，眼神像个小男孩。“我们不就试着周末恋怎么样？”


    “你根本不知道自己在要求什么。我从未让男人进过我的公寓。”


    他眨了眨眼，仿佛不理解。他很快恢复过来道：“没关系。我们会慢慢来。我有大量的假期时间，当你准备好时，我可以呆一周左右。你可以跟我一起住酒店，我们可以看看情况如何。”


    她无法回答。她的身体确实想要一直待在他身边，她的心也尖叫着让她尝试一下，但她的大脑一想到他进她的公寓就停滞了。最终，他会想看那里的。


    罗伊斯在他们成为情侣之前就伤害过她，而现在他有能力造成更大的伤害。她的大脑正试图保护她免受可能的毁灭。


    罗伊斯用一个吻打破了她的思绪。他的唇温暖了她直到脚趾，让她回想起手指按摩她某些部位的感觉，那些地方从未带给她如此巨大的快乐。当他结束吻时，他说：“我知道接受我的工作对你来说将是一个挣，但请给我们一个机会。昨晚让我着迷，我知道你也有同感，因为你允许自己在我面前脆弱。”


    当他用手指滑过她的手臂时，格蕾身上起了一层鸡皮疙瘩。“今天早上你不在，然后当你被叫去上班时，我慌坏了。我没有工作，我的腿断了，而这样一个善良体贴的男人却在各地进行企业裁员。你得对我有耐心。”


    “我对此没有异议。我确定如果我推得太过了，你会告诉我的。”


    她点了点头。


    “那我们现在没问题了？我可以送你回家吗？”


    她笑了。“我觉得我是唯一的选择。我可能今天早上对着吉尔大哭了一场，把对她的人情都用光了。”


    他皱起眉头。“你知道的，她告诉我如果我弄碎你的心，她会杀了我。这样的朋友不是那种你可以‘用光所有人情’的人。”


    “她真的那样说的吗？”


    “是的，为什么这很难相信？我从她痛骂我一顿的样子，以为你们很亲密。”


    “我把她当作最好的朋友，但她有很多朋友。”

