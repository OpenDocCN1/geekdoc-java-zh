    overreacted a little to him being called into work. She just hadn’t let herself
    think about what would happen Monday.


    The app loaded with a tinkling melody and a chime at the end. Three jewels glistened
    in various points of a maze, and Grace ran her finger over the screen, collecting
    two of them on the way to the finish. She was definitely off—she should''ve gotten
    all three. She went on to the next level and focused entirely on the puzzle.


    Several levels later she heard a knock at the door followed by “Room service.”


    Glancing at the clock, she saw it was 9:30\. This had to be some sort of peace
    offering from Royce. Her stomach grumbled even as her heart fluttered. She eased
    out of bed and crutched over to open the door, or try to. The waiter had to push
    through to get it to open wider.


    He rolled in two carts as if there was a family of five in the room. “I think
    there''s been some mistake. I can''t possibly eat all of this.”


    “Room 854, right?”


    Grace nodded.


    “Perhaps this will help.” He lifted the silver top off of one of the plates, revealing
    a note on the lodge stationary. Grace had to smile. “Enjoy,” said the waiter,
    departing before she''d even thought to tip him.


    She snatched the note up to read it. “I didn''t know what you wanted for breakfast
    today. Please forgive me for talking like an asshole. I know my job is a problem,
    but I also know we can work past it. I''m nuts about you. Royce”.


    Grace fell back on the bed and grabbed her main phone. She pushed Royce''s name
    and didn''t have long to wait before she heard, “Grace, I''m sorry.”


    “Would you like to have breakfast? Some jerk sent me ten plates of it in the hopes
    I''d forgive him.”


    She heard a knock at the door. She said into the phone, “Come in.” The lock clicked,
    and Royce pushed into the room, crossed over to the bed and lifted her into his
    arms.


    “I''m so sorry. I know I said all the wrong things, I just get very defensive
    about my job.”


    She leaned her head on his shoulder and said, “Can we talk about this after breakfast?
    I''m starving.”


    He kissed away the remnants of her annoyance—all but the thought that a man like
    him shouldn''t be firing people for a living. He carried her over to a chair at
    the table. With a flourish of his arm, he took the silver covers off all the plates.
    Omelets, pancakes, waffles with whipped cream and French toast with strawberries
    all called to her.'
