    Thanks also to Hang Le for doing a great job on the cover.


    # 1| Greener Pastures

    Grace noticed the chip in the “sassy red” nail polish on her index finger as she
    removed the bicycle clips from her pants. The compulsion to slam her hand on the
    elevator''s emergency stop button pulsed all the way to her fist, but she clenched
    it at her side—the bells would draw too much attention. She''d ride to her floor,
    wait for the door to open and close and go back down. It''d only take what, another
    half hour to bike back to her apartment? Then she''d be late.


    She wished the desire to fix her nail came from her pride in being a fashionable
    Java programmer, but the real problem was having a visible imperfection. When
    something was wrong, she had to correct it—fantastic for her job but detrimental
    to her life. The elevator continued to go up, and she refocused her mind to a
    different problem like she''d been practicing. She was coming in early because
    she''d woken up with an algorithm fully formed in her mind to make a slow process
    a hundred times faster. The slow process bugged her more than the chipped nail.
    She took a deep breath and envisioned the solution in her mind.


    The elevator doors opened, and she stepped out into the hall in front of Mile
    High Innovations. Oh, holy ones and zeroes. She hadn''t switched to her pumps
    like she always did in the elevator. After a few deep breaths and furtive glances,
    she slung her backpack off her shoulder and switched her shoes. There. Everything
    was just right...except the nail. She slung the backpack on her shoulder again
    and slid her keycard through the lock. As she opened the door, she was surprised
    to hear voices from inside.


    She stepped in and froze at the sight of a corporate god standing amongst a group
    of businessmen.


    For just one moment, her world became his indigo eyes that looked as startled
    as she felt. His sable hair was combed back and slightly to one side. He had broad
    shoulders and stood about half a foot taller than Grace—the perfect height. He
    raised his eyebrows, staring back at her. Grace placed her hand on her fluttering
    stomach and wished she''d scraped the frost off her car windows and driven to
    work so she could have worn a skirt. Her Penney''s pantsuit must look like a trash
    bag compared to his Brooks Brothers suit.


    The other men had stopped talking and were staring at her, though she hardly noticed.
    Damn the nail. She dropped her hand, hoping he hadn''t seen it. The first time
    in her life she''d ever experienced something akin to love at first sight, and
    she had chipped nail polish.


    Finally her balding program director broke away from the group and said, “Grace,
    why are you here so early?”


    She forced herself to avert her eyes from the stranger and saw that the CFO was
    there as well. Odd. “Uh, I have a fix for that problem I was talking to you about
    yesterday. I woke up, and the solution was just there. If I''m lucky I''ll have
    it done before lunch.”


    “That''s great,” he said and turned to glare at the CFO.


    Grace didn''t understand the look and didn''t care. She locked eyes with the god
    again, wishing someone would introduce them. If there was ever a man she might
    be able to break her rules of dating for, he was the one. He tilted his head and
    put his hand in his pocket. His other hand held a briefcase. She imagined defined
    muscles below his tailored suit to match the firm jawline of his face. She’d bet
    he was a skier.


    Realizing she must be gawking, and since no one was introducing her, she blushed
    and took a side step around the group.


    “I''ll let you know if it was just dream thinking,” she called over her shoulder.
    No one answered. Instead she heard them walk to the offices in the back as she
    made her way through the maze of cubicles. A quiet hum filled the office from
    computers that were on 24/7.


    If only Jill came in this early, they could gossip a bit about that gorgeous man.
    Hmmm. Maybe not. She was a short, geeky coder; Jill was a tall, beautiful woman.
    One look at Jill, and he''d forget about her.


    She tried to push her thoughts aside as she sat at her desk. He was probably an
    out of town customer she was never supposed to meet. As the manager''s assistant,
    Jill was sure to be introduced to him as soon as she arrived at work.


    Never mind. Right now she had some programming to do. She put earbuds in and cranked
    up Green Day. Java code flooded her computer screen as the office filled up with
    coworkers. Her mind occasionally dipped out of work mode to picture the corporate
    god, but mostly she stayed focused. Eventually she paused to take a Coke out of
    the small refrigerator below her desk. But she was so close to being done. Her
    fingers returned to the keyboard and clicked away until Jill pulled out Grace''s
    earbuds and said, “The people at Greener Pastures are ready to see you now.”


    Grace kept coding and said, “Who''s that? Can they wait? Because I''m almost done
    with this algorithm.”


    “Grace! Didn''t you get my texts?”


    “You know I don''t stop when I''m near the end.”


    “Trust me, you don''t want to go the distance this time.”


    Grace kept coding until Jill bumped her hip against the desk and spilled Coke
    all over the keyboard.


    “What the hell?” Grace jumped up and finally looked at Jill. Her eyes were red
    and her mascara smudged. “What''s going on? Are you okay?” Grace put her hand
    on Jill''s arm—a rare show of affection from Grace.


    Jill put a hand to her chest. “Am I okay? It''s you I''m worried about. You''re
    far too good for this.”

