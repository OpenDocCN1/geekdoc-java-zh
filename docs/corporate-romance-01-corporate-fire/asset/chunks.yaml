    The room had one queen sized bed and the standard furniture of a dresser, TV and
    small table. A picture of a skier spraying powder everywhere as he went down a
    trail hung over the headboard of the bed. Her app books were on top of her laptop
    case, her phones were on the table and her suitcase was zipped up on the luggage
    rack, with her boot and ski bags against the wall behind it. It hardly looked
    like anyone was staying in the room at all.


    “Hand me your crutches. I''ll help you inside.”


    She had to lean on the doorframe holding the door open when he took her crutches.
    He tossed them and the ski boot at the foot of her bed and turned to her. She
    thought he intended her to hold onto him and hop into the room, but he lifted
    her into his arms.


    She didn''t take her eyes off of him while he pressed her to his chest and let
    the door slam behind them.


    He said in a low voice, even though they were the only ones in the room, “I barely
    squeaked by the first of your dating rules. I was the bastard who told you you''d
    lost your job. And you could blame me for your broken leg. Why is it you broke
    your second rule for me?”


    His arms gave her peace. His voice filled her with desire.


    She wrapped her arms around his neck and said in a more lucid voice than she felt,
    “It seems that first moment we had was interrupted by a lot of things outside
    of our control. If I set those aside, you''ve been nothing but patient and thoughtful
    with me. Do you think Doug would''ve been a comfort in the waiting room? He would''ve
    told me all the things I did wrong to cause the accident and how superior he is.
    Seems like I''ve run into a lot of Doug''s in my life, but you''re the only Royce.”


    He stepped over to the bed and laid her down with her broken right leg on the
    inside of the bed. He propped up the pillows behind her, brushing her cheek with
    his. Her lips sought out his, but the kiss was far too short for what she wanted.


    He pulled back and said, “Don''t get me wrong, I''m grateful for the `Vicodin`
    that''s allowing you to overlook things, but I don''t want you to regret anything.”


    She shook her head. “I''m not going to regret you helping me, kissing you in the
    hall, you being on my bed--”


    “You say that now, but I''m worried about tomorrow and the next day. I''m playing
    the long game here. I don''t want a moment of passion now to ruin our future.”


    Grace couldn''t help but hold his face in her hands and pull him in for another
    kiss.


    But he broke it off with a laugh and said, “I''m not feeding you lines. I really
    don''t want to screw this up. Believe me, this is requiring an extreme amount
    of restraint on my part.”


    He stood up, walked to the foot of her bed and bent down. She heard the ice jostling.
    When he stood up, he put it on her wrapped leg. “I have a room here too, so I
    think I''ll go shower and order us room service. Can I come back in a couple hours?”


    Grace wanted him to stay but was sure he''d like a break from her craziness. “Yeah,
    keep the key so I don''t have to get up.”


    “What do you like to eat? I''m sure there''s a menu here somewhere.” He opened
    the nightstand drawer, pulled out a laminated sheet of paper and handed it to
    her.


    Grace couldn''t focus enough to read it. “Do they have a pasta dish? Something
    with a cream sauce sounds good.”


    He took the menu and glanced over it. “Fettuccini Alfredo?”


    She nodded. He was damn gorgeous.


    “Can I get you more ice?”


    “This is still good, and I''m gonna take a shower too.”


    He frowned at her.


    “I''ll be fine. I''ll take a bath if it makes you feel better.”


    “If I said I''d rather be here when you did that, you might misconstrue my words
    and think I was trying to take advantage of you, but I just don''t want you to
    fall.”


    “I never thought I''d be telling a man this, but you need to quit worrying.”


    He hesitated. It appeared that he might sit down next to her again, but he didn''t.
    “I''ll see you in a couple hours.”


    When he left, Grace''s sigh filled the room like a fan turning on. What the hell
    was going on? He was model handsome, funny and caring—he just didn''t seem like
    the type of person who''d fire people for a living. She wanted him more than any
    man she''d ever been with, and he was the only man who''d tried to keep things
    moving slowly. Maybe that was part of the attraction.


    ## 8 | Dinner


    Grace ended up taking a washcloth bath at the sink and then spent what felt like
    forever staring at the contents of her suitcase. In her state of mind, putting
    underwear on seemed like too much work: the bandage around her leg and foot was
    pretty thick. But she always wore underwear with a matching bra—how could she
    even consider going without?


    A little bit of pain had made its way past the medicine, but mostly she felt exhausted.
    Screw it. She would go without bra and underwear and just put on the blue cocktail
    dress she''d brought for the night. It was chiffon like last night''s dress had
    been. Maybe she liked the material so much because it was flowing and romantic—how
    she wanted to be—not stiff and unyielding like she was. The skirt covered her
    thighs when she was sitting up in bed. She did her hair and make-up as best she
    could, but she just wanted to take a nap.


    She sat in bed over the covers, leaned back on the propped up pillows and fell
    asleep.


    She slept without dreams.


    A hand on her waist and the backs of fingers brushing her cheek drew her into
    a foggy sort of consciousness. She opened her eyes to Royce gazing back at her
    with an expression she''d never seen on a man before. If her thoughts were clearer
    she might''ve described it as tenderness or sincerity, but those didn''t really
    cover all the emotions.


    In her haziness all that registered was that this man made her happy, while others
    made her cringe. She turned her head so that her cheek pressed into his fingers.
    “You came back.”


    His fingers straightened, allowing her cheek to settle into his palm. “I promised
    you dinner, remember? I''m sorry I woke you. It''s just that you look like a beautiful
    flower, and it was hard to keep my hands to myself.”


    “Mmmm, I don''t mind at all, but it''d be better if you kissed me again.”


    He leaned in closer. His hand at her waist heated her through the material of
    her dress. His breath caressed her cheek. “I''m trying not to break my rules.
    We haven''t had three dates yet.”


    “Well,” she said, barely above a whisper, “we could count the night at the bar
    when you sent me all those notes as our first date, this morning at breakfast
    as our second date and the ski race as our third date.”


    He breathed in deeply and leaned in more. “I don''t think so. They were unplanned,
    and the first one ended with you slapping me, the second one ended with you telling
    me to leave alone and the third one ended with you breaking your leg. Dinner tonight
    will be our first date, and I hope a thousand times better than those.”


    “You realize you''re forcing me to break my own rule again.”

