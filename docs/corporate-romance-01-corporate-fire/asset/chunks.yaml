    of hiding in her room all night. Her arms high in the air, she released the spaghetti
    straps of her black cocktail dress and let the chiffon material fall over her
    head and down her body. She tugged it into place, fussed with it for a few minutes
    and then forced her hands away. She could adjust the dress all night and never
    be satisfied.


    She brushed through her brown locks several times and applied her makeup, taking
    care not to smudge her eyeliner as she drew the pencil across her eyelid. She
    hated having to remove eyeliner and redo it. As she criticized her appearance
    in the mirror, an image of the man who''d fired her passed through her mind. She
    really needed to find a hunky ski instructor to occupy her thoughts—not that she''d
    dare say anything to him, but some eye candy would be great tonight.


    She left her room and made her way through the wood paneled hallway, down the
    elevator, out into the tiled lobby and to the hostess station at the dining room.
    The floodlights that shone outside the window wall at the back of the dining room
    captured a picturesque view of new snow falling. At least the skiing tomorrow
    would be good.


    The hostess smiled and asked how many. Grace inhaled, and her stomach wanted to
    revolt at the aroma of steak and potatoes that would normally appeal to her. Apparently
    she hadn''t reached the peace she thought she had about her job. With a noise
    like an erp more than anything intelligible, she turned away from the dining room
    and fled toward a steady bass beat.


    Maybe the noise and drink of the bar would keep her thoughts away from what had
    happened that morning and the man who''d done it.


