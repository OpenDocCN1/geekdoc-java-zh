    She shifted her eyes down, unable to take the intensity of his stare.


    He leaned across the table. “I''d really like to start again.”


    His voice raised the hairs on the back of her neck, and she made the mistake of
    glancing up. He looked too handsome. Even the bruise worked for him.


    She reprimanded herself. Just because he was gorgeous didn''t mean he wasn''t
    a jerk. “And I''d really like you to leave me alone.”


    He smiled. “Maybe I''ll see you on the slopes.”


    Her food arrived as he stood to leave, and Grace dug in.


    Her anger lessened as her stomach filled. It was good to have food again. Maybe
    she was being too mean. It had been Mile High''s decision to let her go, not his.


    No. Only a bastard would have a job like that.


    ![](images/00003.jpeg)


    Grace stood at the top of a double black diamond slope, glad to be away from people,
    especially Royce and Doug. Snow from the previous night weighted down the branches
    on the trees, contrasting with the blue sky. Cold air nipped at her cheeks—the
    only part of her body uncovered.


    Freedom, finally.


    She pushed off with her poles, loving the way the snow flew up. Skiing down hard
    trails gave her the same joy as puzzles or programs.


    She spent the morning forgetting about her job situation as she zoomed down the
    slopes and relaxed on the lift rides back up. The only intrusion to her peace
    was thoughts of Royce. Hopefully he was on the beginner slopes far away, but she
    doubted it.


    She hopped off the ski lift after stopping for lunch and headed over to the start
    of one of her favorite trails. Thoughts of Royce still intruded, but she''d completely
    forgotten about Doug by now. That made it all the more jarring when she heard
    his voice behind her.


    “Hey Grace.”


    He skied over from his perch on a rock. It was almost like he’d been waiting for
    her, which sent a shiver up her spine. She didn''t even say hello.


    “Your form isn''t bad, but you should bend at the knees more when you go over
    the moguls.”


    “Quit stalking me.”


    “I''m not stalking you. I just thought that since you and I were hired at the
    same time and fired at the same time, we might try going out.”


    “That doesn''t mean we have anything in common except our failed job.”


    “But we do. You''re a perfectionist. I''m a perfectionist. We''d make a great
    team. I''m sure I could get you to break all those rules I hear about.”


    Grace tightened her grip around her ski poles, and her body broke into a sweat
    under all the ski gear. She hated it when men wanted her to break the rules for
    them. She yelled, “I would never break my rules for you, and do you want to know
    why? You say you''re a perfectionist, but you''re an asshole about it. You find
    a flaw and either complain to whoever you think did it, or if it''s you, find
    someone else to blame. When I see a problem, I just fix it, whether it''s mine
    or not. And every time you''ve talked to me since I was fired, you''ve found something
    to pick at me about. Since I am a perfectionist, having my flaws talked about
    is like fingernails on a chalkboard to me. You and I are not going out.”


    Grace was so upset that she unlatched her skis and stomped over to sit on a boulder.


    “You''re making a mistake, Grace,” he yelled. “And the rest of the programmers
    think you''re a bitch since you won''t answer any of their emails.”


    She ignored him and pulled her knees to her chest, her skis lying at the base
    of the rock. Finally he shoved his poles into the ground and took off down the
    slope. She hoped he broke his leg.


    She put her head on her knees, trying to block out the rest of the world. But
    the cold from the rock crept through her ski pants and kept her alert. The sound
    of skis drew near.


    To make the moment worse, she heard the voice that at breakfast had raised the
    hairs on the back of her neck. “Hey, anything I can do to help?”


    She should''ve asked Jill to join her. They might''ve grown closer, and Jill would''ve
    kept the losers away. She''d have to call her tonight. Without lifting her head,
    Grace mumbled, “Just go away.”


    Silence answered her. He was right next to her. She sighed and looked up. Royce''s
    eyes expressed concern. It''d be easier to ignore if his goggles were on, but
    they hung around his neck.


    He said, “You must be pretty good to do this run.”


    The compliment was a relief after the constant badgering from Doug. She found
    herself saying, “It''s one of my favorites.”


    “How often do you ski?”


    She didn''t know if it was her sudden sense of loneliness or his easy manner,
    but she found herself responding with personal information. “Several times every
    winter. That’s why I live in Denver.”


    “If I lived here, I''d ski all winter too.”


    Naturally. Her perfect man except that he’d axed her. “Why are you wasting your
    time on me? I don''t want anything to do with you.”


    “Because you''re smart and beautiful. And you already know what I do. Revealing
    my job is a huge turn off to women.”


    Smart and beautiful. She heard the smart part often, but never beautiful. He was
    playing at something. “Gee, what a surprise. I''d think you''d keep it a secret.”


    “I don''t like to keep secrets.”

