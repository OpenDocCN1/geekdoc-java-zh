    ### The Police


    Grace woke to the sound of Royce in the living room. `7:05 AM`. Had he slept or
    stayed up all night? His eyes were shadowed and bloodshot. He stood in fitted
    shorts and a t-shirt, his muscles defined like an underwear model. He held a phone
    to his ear, but when he saw her, he told whoever it was he had to go and hung
    up.


    “Hey,” he said. Grace said, “what''s up?”


    “I wanted to warn you that the police are interviewing all the former `Java` employees
    today. They just came by and asked if I thought any of them were more likely to
    do this than the others. I told them you were totally psychotic and not to believe
    your alibi.”


    “Is this about me not telling you about Royce still?” The two friends laughed
    together until Grace said, “Didn'' they arrest Jeff?”

