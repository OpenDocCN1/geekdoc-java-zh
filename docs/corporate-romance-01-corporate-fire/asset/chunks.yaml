    “CFO 至少看起来对我的想法感兴趣。但我不知道 CEO 怎么想。嘿，你收到我的邮件了吗？”


    他们聊了一会儿关于她决定打给哪位医生，然后他得走了。那句“我爱你”差点从她口中脱而出，但她希望在第一次说这句话时他就在身边。她转而是说了再见并挂断了电话。


    公寓里的寒意渗透进她的皮肤。继续过这一天总比让他的缺席困扰她好。她写了一份待办清单，忙着试着划掉每一项。


    ![](img/00004.jpeg)


    Grace 的电视上放着一部浪漫喜剧片，她几乎没有注意。她的腿伸在沙发上，小腿上敷着她能做出的最大的冰袋。她的待办清单还没做几项，但已经写得太长了。她的药瓶空了，腿疼得要命。


    她好不容易约了医生，但一直通过和`Jill` 来回短信来决定合适的过去时间，从而推迟了这件事。要在`Jill` 的动单课之后的某个时间。


    她的手机响了——`Royce`。她皱了皱脸。他可能因为她没发短信告诉他医生医生了。


    “嘿，”她说。


    “嘿，我还没收到你关于医生预约的消息。你约好了吧？”


    Grace 伸了伸身体，努力让自己听起来不疲惫。“是的，明天九点。”


    “然后`Jill`会送你过去，对吧？”


