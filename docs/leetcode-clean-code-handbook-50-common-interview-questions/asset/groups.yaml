    \n让我们开始定义两个变量 $L$ 和 $R$，它们分别代表搜索范围的最低和最高包含索引，初始化为 0 和 $n-1$。\n\n```\nint L = 0,\
    \ R = A.length - 1;\nwhile (L < R) {\n    int M = (L + R) / 2;\n    // TODO: 实现条件检查。\n\
