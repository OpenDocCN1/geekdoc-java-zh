- md: "\n# 47. Coins in a Line\n\nCode it now: Coming soon! | Difficulty: Hard, Frequency:\
    \ N/A\n\nQuestion:\n\nThere are n coins in a line. (Assume n is even). Two players\
    \ take turns to take a coin from one of the ends of the line until there are no\
    \ more coins left. The player with the larger amount of money wins.\n\n- 1. Would\
    \ you go first or second? Does it matter?\n- 2. Assume that you go first, describe\
    \ an algorithm to compute the maximum amount of money you can win.\n\n![](img/172f5d31191b965fe8ccb5a0f5becd9a_90_0.png)\n\
    \nHints:\n\nIf you go first, is there a strategy you can follow prevents you from\
    \ losing? Try to consider how it matters when the number of coins is odd vs. even.\n\
    \nSolution:\n\nGoing first will guarantee that you will not lose. By following\
    \ the strategy below, will always win the game (or get a possible tie).\n\n- 1.\
    \ Count the sum of all coins that are odd-numbered. (Call this X)\n- 2. Count\
    \ the sum of all coins that are even-numbered. (Call this Y)\n- 3. If X > Y, take\
    \ the left-most coin first. Choose all odd-numbered coins in subsequent moves.\n\
    - 4. If X < Y, take the right-most coin first. Choose all even-numbered coins\
    \ in subsequent moves.\n- 5. If X == Y, you will guarantee to get a tie if you\
    \ stick with taking only evennumbered/odd-numbered coins.\n\nYou might be wondering\
    \ how you can always choose odd-numbered/even-numbered coins. Let me illustrate\
    \ this with an example where you have 10 coins:\n\nIf you take the coin numbered\
    \ 1 (the left-most coin), your opponent can only have the choice of taking coin\
    \ numbered 2 or 10 (which are both even-numbered coins). On the other hand, if\
    \ you choose to take the coin numbered 10 (the right-most coin), your opponent\
    \ can only take coin numbered 1 or 9 (which are odd-numbered coins).\n\nNotice\
    \ the total number of coins change from even to odd and vice-versa when player\
    \ takes each time. Therefore, by going first and depending on the coin you choose,\
    \ you are essentially forcing your opponent to take either even-numbered or odd-numbered\
    \ coins.\n\nNow that you have found a non-losing strategy, could you compute the\
    \ maximum amount of money you can win?\n\n# Hints:\n\nOne misconception is to\
    \ think that the above non-losing strategy would generate the maximum amount of\
    \ money as well. This is probably incorrect (You might need at least 6 coins to\
    \ find a counter example).\n\nAssume that you are finding the maximum amount of\
    \ money in a certain range (ie, from coins numbered i to j, inclusive). Could\
    \ you express this as a recursive formula? Find ways to make it as efficient as\
    \ possible.\n\n# Solution for (2):\n\nAlthough the simple strategy illustrated\
    \ in Solution (1) guarantees you not to lose, it not guarantee that it is optimal\
    \ in any way.\n\nHere, we use a good counter example to see better why this is\
    \ so. Assume the coins are laid out as:\n\n- * 3, 2, 2, 3, 1, 2\n\nFollowing our\
    \ previous non-losing strategy, we would count the sum of odd-numbered coins,\
    \ X = 3 + 2 + 1 = 6, and the sum of even-numbered coins, Y = 2 + 3 + 2 = 7. As\
    \ Y > X, we would take the last coin first and end up winning with the total amount\
    \ of 7 by taking only even-numbered coins.\n\nHowever, let us try another way\
    \ by taking the first coin (valued at 3, denote by (3)) instead. The opponent\
    \ is left with two possible choices, the left coin (2) and the right coin (2),\
    \ both valued at 2. No matter which coin the opponent chooses, you can always\
    \ take the other coin (2) and then the configuration of the coins: { 2, 3, 1 }.\
    \ Now, the coin in the middle (3) would be yours to keep for. Therefore, you win\
    \ the game by a total amount of 3 + 2 + 3 = 8, which proves that the previous\
    \ non-losing strategy is not necessarily optimal.\n\nTo solve this problem in\
    \ an optimal way, we need to find efficient methods in enumerating all possibilities.\
    \ This is when Dynamic Programming (DP) kicks in and become so powerful that you\
    \ start to feel magical.\n\nFirst, we would need some observations to establish\
    \ a recurrence relation, which is essential as our first step in solving DP problems.\n\
    \nFigure 8: The remaining coins are { Ai ... Aj } and it is your turn. Let P(i,\
    \ j) denotes the maximum amount of money you get. Should you choose Ai or Aj?\n\
    \nAssume that P(i, j) denotes the maximum amount of money you can win when the\
    \ remaining coins are { Ai, ..., Aj }, and it is your turn now. You have two choices,\
    \ either take Ai or Aj. First, let us focus on the case you take Ai, so that the\
    \ remaining coins become { Ai+1 ... Aj }. Since the opponent is as smart as you,\
    \ he must choose the best move that yields the maximum for him, where the maximum\
    \ amount you can get is denoted by P(i+1, j).\n\nTherefore, if you choose Ai,\
    \ the maximum amount you can get:\n\n```\n$P_1 = \\sum_{k=i}^{j} A_k - P(i+1,\
    \ j)\n```\n\nSimilarly, if you choose Aj, the maximum amount you can get:\n\n\
    ```\n$P_2 = \\sum_{k=i}^{j} A_k - P(i, j-1)\n```\n\nTherefore,\n\n```\n$P(i, j)\
    \ = \\max(P_1, P_2)$$\\n= \\max \\left( \\sum_{k=i}^{j} A_k - P(i+1, j), \\sum_{k=i}^{j}\
    \ A_k - P(i, j-1) \\right)$\n```\n\nIn fact, we can simplify the above relation\
    \ further to (Why?):\n\n```\n$P(i, j) = \\sum_{k=i}^{j} A_k - min(P(i+1, j), P(i,\
    \ j-1))\n```\n\nAlthough the above recurrence is easy to understand, we need to\
    \ compute the value of $\\sum_{k=i}^{j} A_k$ in each step, which is not very efficient.\
    \ To avoid this problem, we can store value of $\\sum_{k=i}^{j} A_k$ in a table\
    \ and avoid re-computations by computing in a certain order. Try to figure this\
    \ out by yourself. (Hint: You would first compute $P(1,1), P(2,2), \\dots P(n,n)$\
    \ and work your way up).\n\n# A Better Solution:\n\nThere is another solution\
    \ that does not rely on computing and storing results of $\\sum_{k=i}^l A_k$,\
    \ therefore is more efficient in terms of time and space. We rewind back to the\
    \ case where you take Ai, and the remaining coins become $\\{A_{i+1} \\dots A_j\\\
    }$.\n\n| A1 | ... | Ai | Ai+1 | ... | Aj | ... | An |\n|---|---|---|---|---|---|---|---|\n\
    \nFigure 9: You took Ai from the coins { Ai ... Aj }. The opponent will either\
    \ choose Ai+1 or Aj. Which one would he choose?\n\nLet us consider one extra step\
    \ ahead by considering the two coins the opponent will possibly take, $A_{i+1}$\
    \ and $A_j$. If the opponent takes $A_{i+1}$, the remaining coins are $\\{A_{i+2}\
    \ \\dots A_j\\}$, whose maximum is denoted by $P(i+2, j)$. On the other hand,\
    \ if the opponent takes $A_j$, our maximum is $P(i, j-1)$. Since the opponent\
    \ is as smart as you, would have chosen the choice that yields the minimum amount\
    \ to you.\n\nTherefore, the maximum amount you can get when you choose Ai is:\n\
    \n```\n$P_1 = A_i + \\min(P(i+2, j), P(i+1, j-1))$\n```\n\nSimilarly, the maximum\
    \ amount you can get when you choose Aj is:\n\n```\n$P_2 = A_j + \\min(P(i+1,\
    \ j-1), P(i, j-2))$\n```\n\nTherefore,\n\n```\n$P(i, j) = \\max(P_1, P_2)\n= \\\
    max(A_i + \\min(P(i+2, j), P(i+1, j-1)), A_j + \\min(P(i+1, j-1), P(i, j-2)))$\n\
    ```\n\nAlthough the recurrence relation could be implemented in few lines of code,\
    \ its complexity is exponential. The reason is that each recursive call branches\
    \ into a total of four separate recursive calls, and it could be $n$ levels deep\
    \ from the first call. Memoization provides an efficient way by avoiding re-computations\
    \ using intermediate results stored in a table. Below is the code which contains\
    \ a function printMoves which prints out all the moves you and opponent make (assuming\
    \ both of you are taking the coins in an optimal way). It runs in $O(n^2)$ time\
    \ and takes $O(n^2)$ space.\n\n```\nconst int MAX_N = 100;\n\nvoid printMoves(int\
    \ P[MAX_N][MAX_N], int A[], int N) {\n    int m = 0, n = N-1;\n    bool myTurn\
    \ = true;\n    while (m < n) {\n        int P1 = P[m+1]; // If Take A[m], opponent\
    \ can get...\n        int P2 = P[n-1]; // Take A[n]\n        cout << (myTurn ?\
    \ \" I \" : \"You\") << \" take coin no. \" << \"\\n\";\n        if (P1 < P2)\
    \ {\n            cout << \" \" << m+1 << \" (\" << A[m] << \");\";\n         \
    \   m++;\n        } else {\n            cout << \" \" << n+1 << \" (\" << A[n]\
    \ << \");\";\n            n--;\n        }\n        cout << (myTurn ? \", \" :\
    \ \" \") << \"\\n\";\n        myTurn = !myTurn;\n    }\n    cout << \"\\nt total\
    \ amount of money (maximum) I gets \" << P[0][N-1] << \" <<n\";\n}\n\nint maxMoney(int\
    \ A[], int N) {\n    int P[MAX_N][MAX_N] = {0};\n    for (int i = 0; i < N; i++)\
    \ {\n        for (int m = 0, n = i; n < N; m++, n++) {\n            int a = (m+2\
    \ < N-1) ? P[m+2][n] : 0;\n            int b = (m+1 < N-1 && n-1 >= 0) ? P[m+1][n-1]\
    \ : 0;\n            int c = (n > 0) ? P[m][n-2] : 0;\n            P[m][n] = max(A[m]\
    \ + min(a,b),\n            A[n] + min(b,c));\n        }\n    }\n    printMoves(P,\
    \ A, N);\n    return P[0][N-1];\n}\n```\n\n# Further Thoughts:\n\nAssume that\
    \ your opponent is dumb that you are able to manipulate him into choosing the\
    \ coins you want him to choose. Now, what is the maximum possible amount of money\
    \ you can win?\n"
  mdcn: "\n\n# 47. 一行中的硬币\n\n现在编写代码：即将上线！ | 难度：困难，频率：不适用\n\n题目描述：\n\n有一行 $n$ 个硬币。（假设\
    \ $n$ 为偶数）。两个玩家轮轮流从行的末端取一个硬币，直到硬币取完。金钱最多的人获胜。\n\n- 1. 你想先手还是后手？这重要吗？\n- 2. 假设你先手，描述一个算法来计算你可能获得的最大金额。\n\
    \n![](img/172f5d31191b965fe8ccb5a0f5becd9a_90_0.png)\n\n提示：\n\n如果你先手，是否存在一种你可以遵循的策略可以防止你失败？尝试考虑当硬币数量为奇数和偶数时会有什么影响。\n\
    \n解决方案：\n\n先手将保证你不会失败。通过遵循以下策略，将始终赢得游戏（或可能获得平局）。\n\n- 1. 计算所有奇数位置硬币的总和。（记为 X）\n\
    - 2. 计算所有偶数位置硬币的总和。（记为 Y）\n- 3. 如果 X > Y，先取最左边的硬币。在后续移动中选择所有奇数位置的硬币。\n- 4. 如果\
    \ X < Y，先取最右边的硬币。在后续移动中选择所有偶数位置的硬币。\n- 5. 如果 X == Y，如果你坚持只取偶数/奇数位置的硬币，你保证获得平局。\n\
    \n你可能会好奇你如何总是选择奇数/偶数位置的硬币。让我用一个有 10 个硬币的例子来解释这一点：\n\n如果你取第 1 号硬币（最左边的硬币），你的对手只能选择取\
    \ 2 号或 10 号硬币（它们都是偶数位置的硬币）。另一方面，如果你选择取 10 号硬币（最右边的硬币），你的对手只能取 1 号或 9 号硬币（它们都是奇数位置的硬币）。\n\
    \n注意当玩家每次取硬币时，硬币的总数从偶数变为奇数，反之亦然。因此，通过先手并根据你选择的硬币，你本质上是在强迫对手取偶数位置或奇数位置的硬币。\n\n\
    现在你已经找到了一种不失败的策略，你能计算你可能获得的最大金额吗？\n\n# 提示：\n\n一个误区是认为上述不失败策略也会产生最大金额。这可能是错误的（你可能至少需要\
    \ 6 个硬币才能找到一个反例）。\n\n假设你正在寻找某个范围内的最大金额（即：从从编号为 $i$ 到 $j$ 的硬币，包含端点）。你能将其表示为递归公式吗？找到使其尽可能高效的方法。\n\
    \n# 第 (2) 的解答：\n\n虽然解决方案 (1) 中说明的简单策略保证了你不会失败，但它并没有保证在任何方面都是最优的。\n\n在这里，我们使用一个很好的反例来更好地理解为什么是这样。假设硬币布局如下：\n\
    \n- * 3, 2, 2, 3, 1, 2*\n\n按照我们之前的不失败策略，我们将计算奇数位置硬币的总和 X = 3 + 2 + 1 = 6，以及偶数位置硬币的总和\
    \ Y = 2 + 3 + 2 = 7。由于 Y > X，我们将先取最后一个硬币，并最终通过只取偶数位置的硬币以总金额 7 获胜。\n\n然而，让我们尝试另一种方法，改为取第一个硬币（值为\
    \ 3，记为 (3)）。对手剩下两个选择：左边的硬币 (2) 和右边的硬币 (2)，价值均为 2。无论对手选择哪一个硬币，你都可以取另一个硬币 (2)，然后硬币的配置为：{\
    \ 2, 3, 1 }。现在，中间的硬币 (3) 将留给你。因此，你以总金额 3 + 2 + 3 = 8 赢得游戏，这证明了之前的不失败策略并不一定最优。\n\
    \n要以最优方式解决这个问题，我们需要找到枚举所有可能的高效方法。这就是动态规划（DP）大显身手并变得如此强大以让你觉得像魔法的地方。\n\n首先，我们需要一些观察来建立递归关系，这对我们解决\
    \ DP 问题的第一步至关重要。\n\n图 8：剩余的硬币为 $\\{ A_i \\dots A_j \\}$，轮到你的了。你应该选择 $A_i$ 还是 $A_j$？\n\
    \n假设 $P(i, j)$ 表示当剩余硬币为 $\\{ A_i, \\dots, A_j \\}$ 且现在轮到你时，你可以获得的最大金额。你有两个选择，取\
    \ $A_i$ 或取 $A_j$。首先，让我们关注你取 $A_i$ 的情况，此时剩余硬币变为 $\\{ A_{i+1} \\dots A_j \\}$。由于对手和你一样聪明，他必须选择对他产生最大收益的最佳移动，其中你能获得的最大金额记为\
    \ $P(i+1, j)$。\n\n因此，如果你选择 $A_i$，你可能获得的最大金额：\n\n```\n$P_1 = \\sum_{k=i}^{j} A_k\
