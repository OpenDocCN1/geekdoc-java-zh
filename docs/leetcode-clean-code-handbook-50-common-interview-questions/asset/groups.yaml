    ## Chapter 0: Foreword


    Hi, leetCoders:


    First, I would like to express thank you for buying this eBook: “Clean Code Handbook:
    50 Common Interview Questions”. As the title suggested, this is the definitive
    guide to write clean and concise code for interview questions. You will learn
    how to write clean code. Then, you will ace the interviews.


    This eBook is written to serve as perfect companion for LeetCode Online Judge
    (OJ).


    Each problem has a “Code it now” link that redirects to the OJ. You can write
    the code and submit it to the OJ, which will get you immediate feedback on whether
    your solution is correct. If the “Code it now” says “Coming soon”, the problem
    will be added soon in the future, stay tuned.


    On the right side of each problem are the Difficulty and Frequency ratings. There
    are three levels of difficulty: Easy, Medium, and Hard. Easy problems are problems
    that are easy to come up with and the implementation should be pretty straightforward.
    Most interview questions fall into this level.


    On the other end, there are hard problems. Hard problems are usually algorithmic
    in require more thoughts beforehand.


    There are three frequency ratings: Low, Medium, and High. The frequency of a problem
    being asked in a real interview is based on data collected from the user survey:
    “Have you met this question in a real interview?” This should give you an idea
    of what kind of questions is currently being asked in real interviews.


    Each question may contain a section called “Example Questions Candidate Might
    Ask”. These are examples of good questions to ask your interviewer. Asking clarifying
    questions is important and is a good chance to demonstrate your thought process.
    Each question is accompanied with as many approaches as possible. Each approach
    begins with runtime and space complexity so you can quickly compare different
    approaches. The analysis of the runtime and space complexity is usually provided
    with the solution. Analyzing complexity is frequently being asked in a technical
    interview, so you should definitely prepare for it.


    You learn best when you solve a problem by yourself. If you get stuck, there are
    usually hints in the book to help you. If you are still stuck, read the analysis
    and try to write the code in the Online Judge.


    Even though you think a problem is easy, writing code that is concise and clean
    is not as easy as most people think. For example, if you are writing more than
    30 lines of code during a coding interview, your code is probably not concise
    enough.

