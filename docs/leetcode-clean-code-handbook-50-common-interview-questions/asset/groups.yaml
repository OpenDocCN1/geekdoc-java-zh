    \n解决方案：\n\n最直观的方法首先将整数转换为字符串，因为这样更容易操作。虽然这可行，但它违反了不使用额外空间的限制（即你必须分配 n 个字符来存储整数字符串，其中\
    \ n 是位数）。我知道这听起来像是不合理的要求（因为它用的空间很小），难道面试题不都有要求吗？\n\n另一种方法是先反转数字。如果数字与其反转数字相同，那么它必须是回文。\n\
    \n```java\npublic int reverse(int num) {\n    assert num >= 0; // 仅限非负整数\n   \
    \ int rev = 0;\n    while (num != 0) {\n        rev = rev * 10 + num % 10;\n \
    \       num /= 10;\n    }\n    return rev;\n}\n```\n\n这似乎可行，但你考虑过反转后的数字溢出的可能？如果溢出，行为取决于语言（Java\
    \ 在溢出时会回绕，但在 C/C++ 中行为是未定义的）。糟糕。\n\n当然，我们可以通过返回一个比 int 更大的类型（long）来避免溢出。但请注意，这是特定语言的，较大的类型可能在所有语言上都可用。\n\
    \n我们可以构建一个更好、更通用的解决方案。一点是我们必须从某处开始比较数字。你知道只有两种方法：从中间扩展或从两端比较。\n\n事实是从两端比较更简单。首先比较第一位和最后一位。如果它们不同，则一定不是回文。如果它们相同，从两端各切掉一位并继续，直到没有数字为止，得出结论是回文。现在，获取并切掉最后一位很容易。然而，以通用方式获取并切掉第一位需要一些思考。我把它留给你作为一个练习。请在看下面的解决方案之前先思考你的方案。\n\
    \n```java\npublic boolean isPalindrome(int x) {\n    if (x < 0) return false;\n\
    \    int div = 1;\n    while (x / div >= 10) {\n        div *= 10;\n    }\n  \
    \  while (x != 0) {\n        int l = x / div;\n        int r = x % 10;\n     \
    \   if (l != r) return false;\n        x = (x % div) / 10;\n        div /= 100;\n\
    \    }\n    return true;\n}\n```\n\n"
