    \ Difficulty: Easy, Frequency: High\n\nQuestion:\n\nYou are climbing a staircase.\
    \ It takes $n$ steps to reach the top. Each time you can climb 1 or 2 steps. How\
    \ many distinct ways can you climb the top?\n\nSolution:\n\nO(n) runtime, O(1)\
    \ space – Dynamic programming:\n\nThis is a classic Dynamic problem. Define:\n\
    \n$f(n) = \\text{number of ways you can climb the } n^{\\text{th}}$ step.\n\n\
    To reach one step from the $n-1^{\\text{th}}$ step, you have two choices:\n\n\
    - 1. Advance one step from $n-1^{\\text{th}}$ step.\n- 2. Advance two steps from\
    \ $n-2^{\\text{th}}$ step.\n\nTherefore, $f(n) = f(n-1) + f(n-2)$, which is the\
    \ exact recurrence of the [Fibonacci sequence](https://en.wikipedia.org/wiki/Fibonacci_sequence)\
    \ (with different base cases).\n\nSet base cases $f(1)=1, f(2)=2$ and you are\
    \ almost done. Now we can calculate $f(n)$ easily by storing previous values in\
    \ one dimension array and work up to n. Here we even optimize this further by\
    \ storing the previous two values.\n\n```java\npublic int climbStairs(int n) {\n\
    \    int p = 1, q = 1; own    for (int i = 2; i <= n; i++) {\n        int temp\
    \ = q;\n        q += p;\n        p = temp;\n    }\n    return q;\n}\n```\n\n##\
    \ Combinatorics:\n\nInterestingly, this problem could also be solved using combinatorics.\
    \ Warning: Math-y stuff, feel free to skip this section if you are not interested.\
    \ For example, let's assume $n = 6$.\n\nLet:\n\n$x$ = number of 1s,\n$y$ = number\
    \ of 2s.\n\nWe could reach the top using one of the combinations below:\n\n| x\
    \ | y |\n| --- | --- |\n| 6 | 0 | => 1) Six single steps. |\n| 4 | 1 | => 2) Four\
    \ single steps and one double step. |\n| 2 | 2 | => 3) Two single steps and two\
    \ double steps. |\n| 0 | 3 | => 4) Three double steps. |\n\nFor the first combination\
    \ pair $(x,y) = (6,0)$, there's obviously one way of arranging six single steps.\n\
    \nFor the second combination pair $(4,1)$, there's five ways of arranging (think\
