    \ $M_1$ 为划分点。由于 $A_{M1} > A_R$，我们知道 $[A_L \\dots AM_1]$ 中的每个元素都大于 $A_R$。另一方面，假设我们选择\
    \ $M_2$ 为划分点。由于 $A_{M2} \\le A_R$，我们知道 $[A_{M2+1} \\dots A_R]$ 中的每个元素都大于 $A_R$。\n\
    \n为了理解正确的终止条件，观察两个元素。让我们选择中位数 $M = (L + R) / 2$。对于两个元素，有两种情况：\n\n- A = [1,2]\n\
