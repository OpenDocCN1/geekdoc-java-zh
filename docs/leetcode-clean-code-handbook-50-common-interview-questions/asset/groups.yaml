    \ the provided OCR text.)\n\n[content]\n## 13. Longest Palindromic Substring\n\
    \nCode now: https://oj.leetcode.com/problems/longest-palindromic-substring/ Difficulty:\
    \ Medium, Frequency: Medium\n\nQuestion:\n\nGiven a string $S$, find the longest\
    \ palindromic substring in $S$. You may assume that the maximum length of $S$\
    \ is 1000, and there exists one unique palindromic substring.\n\nHint:\n\nFirst,\
    \ make sure you understand what a palindrome means. A palindrome is a string which\
    \ reads the same in both both directions. For example, \"aba\" is a palindrome,\
    \ \"abc\" is not.\n\nA common mistake:\n\nSome will be tempted to come up with\
    \ a quick solution, which is unfortunately flawed (however can be corrected easily):\n\
    \n> Reverse S and come S'. Find the longest common substring between S and S',\
    \ which must also be the longest palindromic substring.\n\nThis seemed to work,\
    \ let us see some examples below.\n\nFor example, $S = “caba”$, $S' = “abac”$.\n\
    \nThe longest common substring between S and S' is “aba”, which is the answer.\n\
    \nLet’s try another example: $S = “abcdaba”$, $S' = “abcddfdcaba”$.\n\nThe longest\
    \ common substring between S and S' is “abacd”. Clearly, this is not a valid palindrome.\n\
    \nWe could see that the longest common substring method fails when there exists\
    \ a reversed copy of a non-palindromic substring in some other part of S. To rectify\
    \ this, each time we find a common substring candidate, we check if the substring’s\
    \ indices are the same as the reversed substring’s original indices. If it is,\
    \ we attempt to update the longest palindromic found found so far; if not, we\
    \ skip this and find the next candidate.\n\nThis is an $O(n^2)$ DP solution using\
    \ $O(n)$ space (which could be improved to $O(n)$ space). Please read more about\
    \ Longest Common Substring here.\n\n$O(n^3)$ runtime, $O(1)$ space – Brute force:\n\
    \nThe obvious brute force solution is to pick all possible starting and ending\
    \ positions for a substring, and verify if it is a palindrome. There are a total\
    \ of $\\binom{n}{2}$ substrings (excluding the trivial solution where a character\
    \ itself is a palindrome).\n\nSince verifying each substring takes $O(n)$ time,\
    \ the run time complexity is $O(n^3)$.\n\n## O(n²) runtime, O(n) space – Dynamic\
    \ programming:\n\nTo improve the brute force solution from a DP approach, first\
    \ think how we can avoid unnecessary re-computation in validating palindromes.\
    \ Consider the case “ababa”. If we already know that “bab” is a palindrome, it\
    \ is obvious that “ababa” must be a palindrome since the left and right end letters\
    \ are the same.\n\nStated more formally below:\n\nDefine $P[i, j] \\leftarrow\
    \ true$ if the substring $S_i \\dots S_j$ is a palindrome, otherwise false.\n\n\
    Therefore,\n\n```\nP[ i, j ] ← ( P[ i+1, j-1 ] and S_i = S_j )\n```\n\nThe base\
    \ cases are:\n\n```\nP[ i, i ] ← true\n```\n\n```\nP[ i, i+1 ] ← ( S_i = S_{i+1}\
    \ )\n```\n\nThis yields a straight forward DP solution, which we first initialize\
    \ the one and two letters palindromes, and work our way up finding all three letters\
    \ palindromes, and so on...\n\nThis gives us a runtime complexity of O(n²) and\
    \ uses O(n²) space to store the table.\n\n## Additional exercise:\n\nCould you\
    \ improve the space complexity further and how?\n\n## O(n²) runtime, O(1) space\
    \ – Simpler solution:\n\nIn fact, we could solve it in O(n²) time using only constant\
    \ space.\n\nWe observe that a palindrome mirrors around its center. Therefore,\
    \ a palindrome can be expanded from its center, and there are only $2n –1$ such\
    \ centers.\n\nYou might be asking why there $2n –1$ but not n centers? The reason\
    \ is the center of a palindrome is between two letters. Palindromes have even\
    \ number of letters (such as \"abba\") and its center are between the two 'b's.\n\
    \nSince expanding a palindrome around its center can take O(n), the overall complexity\
    \ is O(n²).\n\n```\npublic String longestPalindrome(String s) {\n    int start\
    \ = 0, end = 0;\n    for (int i = 0; i < s.length(); i++) {\n        int len =\
    \ expandAroundCenter(s, i, i);\n        int len2 = expandAroundCenter(s, i, i\
    \ + 1);\n        len = Math.max(len, len2);\n        if (len > start) {\n    \
    \        start = i - (len - 1) / 2;\n            end = i + len / 2;\n        }\n\
    \    }\n    return s.substring(start, end + 1);\n}\n```\n\n```\nprivate int expandAroundCenter(String\
    \ s, int left, int right) {\n    int L = left, R = right;\n    while (L >= 0 &&\
    \ R < s.length() && s.charAt(L) == s.charAt(R)) {\n        L--;\n        R++;\n\
    \    }\n    return R - L - 1;\n}\n```\n\n## O(n) runtime, O(n) space – Manacher’s\
    \ algorithm:\n\nThere is an O(n) algorithm called Manacher's algorithm, explained\
    \ here in detail. However, it is a non-trivial algorithm, and no one expects you\
    \ to come up with this algorithm in a 30 minutes coding session. But, please go\
    \ ahead and understand it, I promise it will be a lot of fun.\n\n## 14. One Edit\
    \ Distance\n\nCode it now: Coming soon!\n\n## Question:\n\nGiven two strings $S$\
    \ and $T$, determine if they are both one edit distance apart.\n\n## Hint:\n\n\
    - 1. If $|n - m|$ is greater than 1, we know immediately that both are not one-edit\
    \ distance apart.\n- 2. It might help you if you consider these cases separately,\
    \ $m == n$ and $m \\neq n$.\n- 3. Assume that $m$ is always $\\leq n$, which greatly\
    \ simplifies the conditional statements. If $m > n$, we could just swap $S$ and\
    \ $T$.\n- 4. If $m == n$, it becomes finding if there is *exactly* one modified\
    \ operation. If $m \\neq n$, you do not have to consider the deletion operation.\
    \ Just consider the insert operation in $T$.\n\n## Solution:\n\nLet us assume\
    \ $m =$ length of $S$, $n =$ length of $T$.\n\n$O(n)$ runtime, O(1) space – Simple\
    \ one-pass:\n\n(Note: The OCR text for the solution was highly repetitive/corrupted;\
    \ the following logic is reconstructed based on standard Edit Distance algorithms\
    \ which match the provided hints.)\n\nIf $|n-m| > 1$, return false.\nIf $m ==\
    \ n$:\n  Iterate through strings, find first index where $S[i] \\neq T[i]$.\n\
    \  Check if substrings $S[i+1:]$ and $T[i+1:]$ are equal.\nIf $m \\neq n$:\n \
    \ Swap $S, T$ if $m > n$.\n  Iterate through $S$, find first index where $S[i]\
    \ \\neq T[i]$.\n  Check if $S[i:]$ equals $T[i+1:]$.\n\n## 15. Read N Characters\
    \ Given4\n\nCode it now: Coming soon! Difficulty: Easy, Frequency: N/A\n\nQuestion:\n\
    \nThe API: int read4(char *buf) reads 4 characters at a time from a file.\n\n\
    The return value is the actual number of characters read. For example, it returns\
    \ 3 if only 3 characters left in the file.\n\nBy using the read4 API, implement\
    \ the function int read(char *buf, int) that reads n characters from the file.\n\
    \nNote: The read function will only be called once for each test case.\n\n```\n\
    public class Solution extends Reader4 {\n    /**\n     * @param n Maximum number\
    \ of characters to read\n     * @return The number of characters read\n     */\n\
    \    public int read(char[] buf, int n) {\n        char[] buffer = new char[4];\n\
    \        int readBytes = 0;\n        boolean eof = false;\n        while (!eof\
    \ && readBytes < n) {\n            int sz = read4(buffer);\n            if (sz\
    \ < 4) eof = true;\n            int bytes = Math.min(n - readBytes, sz);\n   \
    \         System.arraycopy(buffer, 0, buf, readBytes, bytes);\n            readBytes\
    \ += bytes;\n        }\n        return readBytes;\n    }\n}\n```\n"
  mdcn: "\n\n## 13. 最长回文子串\n\n代码地址：https://oj.leetcode.com/problems/longest-palindromic-substring/\
    \ 难度：中等，频率：中等\n\n题意：\n\n给定一个字符串 $S$，找到 $S$ 中最长的回文子串。你可以假设 $S$ 的最大长度为 1000，且存在一个唯一的回文子串。\n\
    \n提示：\n\n首先，确保你理解什么是回文。回文是一个正着读和反过来读都相同的字符串。例如，\"aba\" 是一个回文，而 \"abc\" 则不是。\n\n\
    常见错误：\n\n有些人会倾向于想出一个快速解决方案，遗憾的是该方案是有缺陷的（但可以很容易修正）：\n\n> 反转 $S$ 得到 $S'$。找到 $S$\
    \ 和 $S'$ 的最长公共子串，这必须也是最长回文子串。\n\n这看起来似乎可行，让我们看下面的几个示例。\n\n例如，$S = “caba”，$S' =\
    \ “abac”$。\n\n$S$ 和 $S'$ 之间的最长公共子串是 “aba”，这是答案。\n\n让我们尝试另一个例子：$S = “abcdaba”，$S'\
    \ = “abcddfdcaba”$。\n\n$S$ 和 $S'$ 之间的最长公共子串是 “abacd”。显然，这不是一个有效的回文。\n\n我们可以看到，当\
    \ $S$ 的其他部分存在非回文子串的反转副本时，最长公共子串方法就会失效。为了修正这一点，每当我们找到一个公共子串候选时，检查该子串的索引是否与反转子串的原始索引相同。如果是，我们尝试更新目前为止发现的最长回文；如果不是，我们就跳过它并寻找下一个候选。\n\
    \n这是一个使用 $O(n)$ 空间的 $O(n^2)$ DP 解决方案（可以优化到 $O(n)$ 空间）。请在此处阅读更多关于最长公共子串的内容。\n\n\
    $O(n^3)$ 运行时间，$O(1)$ 空间 – 暴力法：\n\n显然的暴力破解法是选取子串所有可能的起始和结束位置，并验证它是否为回文。总共有 $\\\
    binom{n}{2}$ 个子串（不包括字符本身就是回文的平凡解）。\n\n由于验证每个子串需要 $O(n)$ 时间，因此运行时间复杂度为 $O(n^3)$。\n\
    \n## $O(n^2)$ 运行时间，$O(n)$ 空间 – 动态规划：\n\n为了通过 DP 方法改进暴力法，首先考虑我们如何避免在验证回文时进行不必要的计算。考虑\
    \ “ababa”的情况。如果我们已经知道 “bab”是一个回文，那么显然 “ababa”也必须是一个回文，因为左右两端的字母是相同的。\n\n下面是更正式的表述：\n\
    \n如果子串 $S_i \\dots S_j$ 是回文，则定义 $P[i, j] \\leftarrow true$，否则为 false。\n\n因此，\n\
    \n```\nP[ i, j ] ← ( P[ i+1, j-1 ] and S_i = S_j )\n```\n\n基础情况为：\n\n```\nP[ i,\
    \ i ] ← true\n```\n\n```\nP[ i, i+1 ] ← ( S_i = S_{i+1} )\n```\n\n这产生了一个直接的 DP\
    \ 解决方案，我们首先初始化一个和两个字母的回文，然后逐向上寻找所有三个字母的回文，以此此类推……\n\n这给了我们一个 $O(n^2)$ 的运行时间复杂度，并使用\
    \ $O(n^2)$ 空间存储表格。\n\n## 额外练习：\n\n你能进一步改进空间复杂度吗？如何做？\n\n## $O(n^2)$ 运行时间，$O(1)$\
    \ 空间 – 更简单的：\n\n事实上，我们可以在 $O(n^2)$ 时间内仅用常数空间解决它。\n\n我们观察到回文围绕其中心对称。因此，回文可以从它的中心扩展，且只有\
    \ $2n-1$ 个这样的中心。\n\n你可能会问为什么是 $2n-1$ 而不是 $n$ 个中心？原因是回文的中心在两个字母之间。回文具有偶数个字母（例如\
    \ \"abba\"），它的中心在两个 'b' 之间。\n\n由于围绕其中心扩展回文需要 $O(n)$，因此整体复杂度是 $O(n^2)$。\n\n```\n\
    public String longestPalindrome(String s) {\n    int start = 0, end = 0;\n   \
    \ for (int i = 0; i < s.length(); i++) {\n        int len = expandAroundCenter(s,\
    \ i, i);\n        int len2 = expandAroundCenter(s, i, i + 1);\n        len = Math.max(len,\
    \ len2);\n        if (len > start) {\n            start = i - (len - 1) / 2;\n\
    \            end = i + len / 2;\n        }\n    }\n    return s.substring(start,\
    \ end + 1);\n}\n```\n\n```\nprivate int expandAroundCenter(String s, int left,\
    \ int right) {\n    int L = left, R = right;\n    while (L >= 0 && R < s.length()\
    \ && s.charAt(L) == s.charAt(R)) {\n        L--;\n        R++;\n    }\n    return\
    \ R - L - 1;\n}\n```\n\n## $O(n)$ 运行时间，$O(n)$ 空间 – Manacher 算法：\n\n有一种名为 Manacher\
    \ 算法的 $O(n)$ 算法，在这里详细解释。然而，这是一个非平凡的算法，没人期望你能在 30 分钟的编码面试中想出这个算法。但是，请尽管理解它，我保证它会非常有趣。\n\
    \n## 14. 单编辑距离\n\n现在编写代码：即将上线！\n\n## 题意：\n\n给定两个字符串 $S$ 和 $T$，判断它们是否好差一个编辑距离。\n\
    \n## 提示：\n\n- 1. 如果 $|n - m|$ 大于 1，我们立即知道两者不是一个编辑距离。\n- 2. 如果你分别考虑这些情况，$m == n$\
    \ 和 $m \\neq n$，可能会对你有帮助。\n- 3. 假设 $m$ 总是 $\\leq n$，这极大地简化了条件语句。如果 $m > n$，我们只需交换\
    \ $S$ 和 $T$。\n- 4. 如果 $m == n$，则变为寻找是否存在*恰好*一次修改操作。如果 $m \\neq n$，你不需要考虑删除操作。只需考虑\
    \ $T$ 中的插入操作。\n\n## 解决方案：\n\n让我们假设 $m =$ $S$ 的长度，$n =$ $T$ 的长度。\n\n（注：原文 OCR 文本存在大量重复和混乱，此处根据逻辑要求进行清理还原。）\n\
    \n$O(n)$ 运行时间，$O(1)$ 空间 – 简单单次遍历：\n\n由于 OCR 文本重复，核心逻辑应为：\n1. 检查长度差，若差 $> 1$ 返回\
    \ false。\n2. 如果长度相等 $m == n$，遍历字符串找到第一个不同的字符，检查后续剩余部分是否完全相等。\n3. 如果长度不等 $m \\\
    neq n$，确保 $S$ 是短字符串，找到第一个不同的字符，检查短字符串剩余部分是否等于长字符串对应的剩余部分。\n\n"
