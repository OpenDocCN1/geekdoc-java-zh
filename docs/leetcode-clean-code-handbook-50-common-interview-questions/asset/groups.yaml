    Question:


    A robot is located at the top-left corner of a $m \times n$ grid (marked ''Start''
    in the diagram below). The robot can only move down or right at any point in time.
    The robot is trying to reach the bottom-right corner of the grid (marked ''Finish''
    in the diagram below). How many possible unique paths are there?


    ![](img/172f5d31191b965fe8ccb5a0f5becd9a_83_0.png)


    # $O((m+n))$ runtime, $O(m+n)$ space - Backtracking:


    The most direct way is to write code that traverses each possible path, which
    can be done using backtracking. When you reach $row = m$ and $col = n$, you know
    you''ve reached the bottom-right corner, and there is one unique path to it. When
    you reach $row > m$ or $col > n$, then it''s an invalid path and you should stop
    traversing. For any grid $row = r$ and $col = c$, you have two choices: Traverse
    to the right or traverse to the bottom. Therefore, the total unique paths at $(r,
    c)$ are equal to the sum of total unique paths from the grid to the right and
    the grid below.


    Deriving the runtime complexity is slightly tricky. Observe that the robot must
    go right exactly $m$ times and goes down $n$ times. Assume that the movement is
    0 and the down movement is 1. We could represent the robot''s path as a binary
    string of $length = m+n$, where the string contains $m$ zeros and $n$ ones. Since
    the backtracking algorithm is just trying to explore all possibilities, its runtime
    complexity is equivalent to the total permutations of a binary string that contains
    $m$ zeros and $n$ ones, which is ${m+n \choose m}$.


    On the other hand, the space complexity is $O(m+n)$ due to the recursion that
    goes at most $m+n$ level depth.


