    \ ways is the sum of all individual terms,\n\n$f(6) = 1 + 5 + 6 + 1 = 13$.\n\n\
    Generalizing for all $n$'s (including odd n),\n\n$f(n) = \\binom{n}{0} + \\binom{n-1}{1}\
