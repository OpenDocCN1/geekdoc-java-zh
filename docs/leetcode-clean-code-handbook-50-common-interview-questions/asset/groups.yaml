    \ it without using extra memory?\n\n## Solution:\n\nTo solve this problem using\
    \ only constant space, you have to rethink how the numbers are being represented\
    \ in computers – using bits.\n\nIf you sum the $i^{th}$ bit of all numbers $n$,\
    \ it must be either 0 or 1 due to the constraint of this problem where each number\
    \ must appear either three times or once. This will be the $i^{th}$ bit of \"\
    single number\".\n\nA straightforward implementation is to use an array of size\
    \ 32 to keep track of the total count of $i^{th}$ bit.\n\n```cpp\nint singleNumber(int\
    \ A[], int n) {\n  int count[32] = {0};\n  int result = 0;\n  for (int i = 0;\
    \ i < 32; i++) {\n    for (int j = 0; j < n; j++) {\n      if ((A[j] >> i) & 1)\
    \ {\n        count[i]++;\n      }\n    }\n    result |= ((count[i] % 3) << i);\n\
    \  }\n  return result;\n}\n```\n\nWe can improve this based on the previous solution\
    \ using three bit variables:\n\n- 1. ones as a bitmask to represent the $i^{th}$\
    \ bit had appeared once.\n- 2. twos as a bitmask to represent the $i^{th}$ bit\
    \ had appeared twice.\n- 3. threes as a bitmask to represent the $i^{th}$ bit\
    \ had appeared three times.\n\nWhen the $i^{th}$ bit had appeared for the third\
    \ time, clear the $i^{th}$ bit of both ones and twos to 0. The final answer will\
    \ be the value of ones.\n\n```cpp\nint singleNumber(int A[], int n) {\n    int\
    \ ones = 0, twos = 0, threes = 0;\n    for (int i = 0; i < n; i++) {\n       \
    \ twos |= A[i];\n        ones ^= A[i];\n        threes = ones & twos;\n      \
    \  ones &= ~threes;\n        twos &= ~threes;\n    }\n    return ones;\n}\n```\n\
