- md: "\n## Chapter 1: Array/String\n\n## 1. Two Sum\n\nCode it now: https://oj.leetcode.com/problems/two-sum/\
    \ Difficulty: Easy, Frequency: High\n\n### Question:\n\nGiven an array of integers,\
    \ find two numbers that they add up to a specific target number.\n\nThe function\
    \ twoSum should return indices of the two numbers that they add up to the target,\
    \ where index1 must be less than index2. Please note that your returned answers\
    \ (both index1 and index2) are not zero-based.\n\nYou may assume that each input\
    \ would have exactly one solution.\n\n### Solution:\n\nO(n²) runtime, O(1) space\
    \ – Brute force:\n\nThe brute force approach is simple. Loop through each element\
    \ x and find if there is another value that equals to target - x. By finding another\
    \ value looping through the rest of array, its runtime complexity is O(n²).\n\n\
    O(n) runtime, O(n) space – Hash table:\n\nWe could reduce the runtime complexity\
    \ of looking up a value to O(1) using a hash map that maps a value to its index.\n\
    \n```java\npublic int[] twoSum(int[] numbers, int target) {\n  Map<Integer, Integer>\
    \ map = new HashMap<>();\n  for (int i = 0; i < numbers.length; i++) {\n    int\
    \ x = numbers[i];\n    if (map.containsKey(target - x)) {\n      return new int[]\
    \ { map.get(target - x) + 1, i + 1 };\n    }\n    map.put(x, i);\n  }\n  throw\
    \ new IllegalArgumentException(\"No two sum solution\");\n}\n```\n\n### Follow\
    \ up:\n\nWhat if the given input is already sorted in ascending order? See Question\
    \ [2. Two Sum II – Input array is sorted].\n\n## 2. Two Sum II – Input array is\
    \ sorted\n\nCode now: Coming soon! Difficulty: Medium, Frequency: N/A\n\n### Question:\n\
    \nSimilar to Question [1. Two Sum], except the input array is already sorted in\
    \ ascending order.\n\n### Solution:\n\nOf course we could still apply the [Hash\
    \ table] approach, but it costs us O(n) extra space, plus it does not make use\
    \ of the fact that the input is already sorted.\n\nO(n log) runtime, O(1) space\
    \ – Binary search:\n\nFor each element x, we could look up if target exists in\
    \ O(log n) time by applying binary search over the sorted array. Total runtime\
    \ complexity is O(n log n).\n\n```java\npublic int[] twoSum(int[] numbers, int\
    \ target) {\n    // Assume input is already sorted.\n    for (int i = 0; i < numbers.length;\
    \ i++) {\n        int j = bsearch(numbers, target - numbers[i], i + 1);\n    \
    \    if (j != -1)\n            return new int[] {i + 1, j};\n    }\n    throw\
    \ new IllegalArgumentException(\"No two sum solution\");\n}\n\nprivate int bsearch(int[]\
    \ A, int key, int start) {\n    int L = start, R = A.length - 1;\n    while (L\
    \ < R) {\n        int M = (L + R) / 2;\n        if (A[M] < key)\n            L\
    \ = M + 1;\n        } else\n            R = M;\n    }\n    return (L <= R && A[L]\
    \ == key) ? L : -1;\n}\n```\n\n### O(n) runtime, O(1) space – Two pointers:\n\n\
    Let's assume we have two indices pointing to the $i^{th}$ and $j^{th}$ elements,\
    \ $A_i$ and $A_j$ respectively. The sum of $A_i$ and $A_j$ can only fall into\
    \ one of these three possibilities:\n\n- i. $A_i + A_j > target$. Increasing $i$\
    \ isn't going to help us, as it makes the sum bigger. Therefore we should decrement\
    \ $j$.\n- ii. $A_i + A_j < target$. Decreasing $j$ isn't going to help us, as\
    \ it makes the sum smaller. Therefore we should increment $i$.\n- iii. $A_i +\
    \ A_j = target$. We have found the answer.\n\n```java\npublic int[] twoSum(int[]\
    \ numbers, int target) {\n    // Assume input is already sorted.\n    int i =\
    \ 0, j = numbers.length - 1;\n    while (i < j) {\n        int sum = numbers[i]\
    \ + numbers[j];\n        if (sum < target) {\n            i++;\n        } else\
    \ if (sum > target) {\n            j--;\n        } else {\n            return\
    \ new int[] { i + 1, j + 1 };\n        }\n    }\n    throw new IllegalArgumentException(\"\
    No two sum solution\");\n}\n```\n\n## 3. Two Sum III – Data structure design\n\
    \nCode it now: Coming soon! Difficulty: Easy. Frequency: N/A\n\n### Question:\n\
    \nDesign and implement a TwoSum class. It should support the following operations:\
    \ add and find.\n\n- add(input) – Add the number input to an internal data structure.\n\
    - find(value) – Find if there exists any pair of numbers whose sum is equal to\
    \ the value.\n\nFor example, add(1); add(3); add(5); find(4) → true; find(7) →\
    \ false\n\n### Solution:\n\n**add – O(n) runtime, find – O(1) runtime, O(n²) space\
    \ – Store pair sums in hash table:**\ncould store all possible sums into a hash\
    \ table. The extra space needed is in order of O(n). You would also need the list\
    \ of added numbers. Each add operation goes through the list and find operation\
    \ involves a single hash table lookup in O(1) runtime. This method is useful if\
    \ the number of find operations exceeds the number of add operations.\n\n**add\
    \ – O(log n) runtime, find – O(n) runtime, O(n) space – Binary search + Two pointers:**\n\
    Maintain a sorted array of numbers. Each add operation would need O(log n) time\
    \ to insert it at the correct position using a binary search (See Question [4.\
