    \ Difficulty: Hard, Frequency: High\n\n## Question:\n\nA linked list is given\
    \ such that each node contains an additional random pointer that could point to\
    \ any node in the list or null.\nReturn a deep copy of the list.\n\n## Solution:\n\
    \nCloning a linked list without an additional random pointer is easy to solve.\
    \ The trickier part however, is to clone the linked list node structure.\n\n![](img/172f5d31191b965fe8ccb5a0f5becd9a_43_0.png)\n\
    \n### $O(n^2)$ runtime, $O(n)$ space – Brute force:\n\nTo get started, it is helpful\
    \ to label each individual node with an index. According to the above list, node\
    \ 0's random points to node 1, node 1's random points to node 0, and node 2's\
    \ random points to itself, node 2.\n\nWe could rebuild the structure assume we\
    \ have the above connections. As we know that node 0 random points to node 1,\
    \ we need to connect the cloned version from node 0' to node 1'. We would have\
    \ to iterate over the list each time to link the nodes and it takes $O(n)$, making\
    \ the overall complexity $O(n^2)$.\n\nHow do we represent the connection? We can\
    \ build a map that maps the original node to its indices. Having this map will\
    \ allow us to clone the structure. If we have that, we just have to connect them,\
    \ right? The only issue is connecting them $O(n)$ complexity, because we have\
    \ to traverse the cloned list to find the node connect.\n\n### $O(n)$ runtime,\
    \ $O(n)$ space – Hash table:\n\nIt is natural to use a mapping so that we can\
    \ quickly lookup the node to connect. We can easily build the map of indices of\
    \ cloned nodes. Therefore, we have reduced the complexity to $O(1)$ when connecting\
    \ the random nodes.\n\nThis got us started, although it requires two maps. On\
    \ closer inspection, it turns out that the two maps could be shortened into one\
    \ single map. We just need to map the original node to its random node directly.\n\
    \n```\npublic RandomListNode copyRandomList(RandomListNode head) {\n    Map<RandomListNode,\
    \ RandomListNode> map = new HashMap<>();\n    RandomListNode p = head;\n    RandomListNode\
    \ dummy = new RandomListNode(0);\n    RandomListNode q = dummy;\n    while (p\
    \ != null) {\n        q.next = new RandomListNode(p.label);\n        map.put(p,\
    \ q.next);\n        p = p.next;\n        q = q.next;\n    }\n    p = head;\n \
    \   q = dummy;\n    while (p != null) {\n        q.next.random = map.get(p.random);\n\
    \        p = p.next;\n        q = q.next;\n    }\n    return dummy.next;\n}\n\
    ```\n\n### O(n) runtime, O(1) space – Modify original structure:\n\nThe algorithm\
    \ uses extra space O(n), can not use extra space? What if we eliminate the map?\
    \ The only way is to modify the original structure. Imagine if we modify the next\
    \ node of the original node to point to its own copy.\n\n![](img/172f5d31191b965fe8ccb5a0f5becd9a_44_0.png)\n\
    \nNow, assume we have the above configuration could assign the random node pointers\
    \ of each copy with the following code:\n\n```\nnode.next.random = node.random.next;\n\
    ```\n\nTo summarize, we need three iterations over the list:\n\n- i. Create a\
    \ copy of each of the original node and insert them between two original nodes\
    \ in an alternate fashion.\n- ii. Assign random pointer of each node copy.\n-\
    \ iii. Restore the input to its original configuration.\n\nWe achieved O(n) runtime\
    \ complexity with using only constant extra space.\n\n```\npublic RandomListNode\
    \ copyRandomList(RandomListNode head) {\n    RandomListNode p = head;\n    while\
    \ (p != null) {\n        RandomListNode next = p.next;\n        RandomListNode\
    \ copy = new RandomListNode(p.label);\n        p.next = copy;\n        copy.next\
    \ = next;\n        p = next;\n    }\n    p = head;\n    while (p != null) {\n\
    \        p.next.random = (p.random != null) ? p.random : null;\n        p = p.next.next;\n\
    \    }\n    p = head;\n    RandomListNode headCopy = (p != null) ? p.next : null;\n\
