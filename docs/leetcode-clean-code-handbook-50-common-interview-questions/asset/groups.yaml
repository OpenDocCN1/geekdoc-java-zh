    \ this problem, we define empty string as valid palindrome.\n\n# Solution:\n\n\
    # O(n) runtime, O(1) space:\n\nThe idea is simple, have two pointers – one at\
    \ the head while the other one at the tail.\nMove them towards each other until\
    \ they meet while skipping non-alphanumeric characters.\n\nConsider the case where\
    \ given string contains only non-alphanumeric characters.\nA valid palindrome\
    \ because the empty string is also a valid palindrome.\n\n```\npublic boolean\
    \ isPalindrome(String s) {\n    int i = 0, j = s.length() - 1;\n    while (i <\
    \ j) {\n        while (i < j && !Character.isLetterOrDigit(s.charAt(i))) i++;\n\
    \        while (i < j && !Character.isLetterOrDigit(s.charAt(j))) j--;\n     \
    \   if (Character.toLowerCase(s.charAt(i)) != Character.toLowerCase(s.charAt(j)))\
    \ {\n            return false;\n        }\n        i++; j--;\n    }\n    return\
    \ true;\n}\n```"
  - "[PAGE 11]\n\n# 5. Implement strstr()\n\nCode now: https://oj.leetcode.com/problems/implement-strstr/\
    \ Difficulty: Easy, Frequency: High\n\nQuestion:\n\nImplement strstr(). Returns\
    \ the index of the first occurrence of needle in haystack, or –1 needle is not\
    \ part of haystack.\n\nSolution:\n\nO(nm) runtime, O(1) space – brute force:\n\
    \nThere are known efficient algorithms such as Rabin-Karp algorithm, KMP algorithm,\
    \ or the Boyer-Moore class. Since these algorithms are usually studied in an advanced\
    \ algorithms class, it is sufficient to solve it using the most direct method\
    \ in an interview – The brute force method.\n\nThe brute method is straightforward\
    \ to implement. We can search the needle with the haystack from its first position\
    \ and start matching all subsequent letters by one. If the letters do not match,\
    \ we start over with the next position in the haystack.\n\nAssume that n = length\
    \ of haystack and m = length of needle, the runtime complexity is O(nm).\n\nHave\
    \ you considered these scenarios?\n\n+   - needle or haystack is empty. If needle\
    \ is empty, always return 0. If haystack is empty, then there will be no match\
    \ (return –1) unless needle is also empty which is 0\n\n+   - needle’s length\
    \ is greater than haystack’s length. Always return –1.\n\n+   - needle is located\
    \ at the end of haystack. For example, “aaaba” and “ba”. Catch possible-by-one\
    \ errors.\n\n+   - needle occurs multiple times in haystack. For example, “mississippi”\
    \ and “issi”. It should return index 2 the first match of “issi”.\n\n+   - Imagine\
    \ two long strings of equal length = n, haystack = “aaa...aa” and needle = “aaa...ab”.\
    \ You should not do more than n comparisons, or your code will get Time Limit\
    \ Exceeded in OJ.\n\nBelow is a simple implementation – no special statements\
    \ for all the above scenarios.\n\n```\npublic int strStr(String haystack, String\
    \ needle) {\n  for (int i = 0; i++) {\n    for (int j = 0; j++) {\n      if (j\
    \ == needle.length()) return i;\n      if (i + j == haystack.length()) return\
    \ -1;\n      if (needle.charAt(j) != haystack.charAt(i + j)) break;\n    }\n \
    \ }\n}\n\n```\n\n11"
- md: "\n# 6. Reverse Words in a String\n\nCode it now: https://oj.leetcode.com/problems/reverse-words-in-a-string/\
    \ Difficulty: Medium, Frequency: High\n\n# Question:\n\nGiven an input string\
    \ s, reverse the string by word.\nFor example, given s = \"the sky is blue\",\
    \ return \"blue is the sky\".\n\n# Examples Candidates Might Ask:\n\n- Q: What\
    \ constitutes a word?\nA: A sequence of non-space characters constitutes a word.\n\
    - Q: Does tab or newline character count as space characters?\nA: Assume the input\
    \ does not contain any tabs or newline characters.\n- Q: Could the input string\
    \ contain leading or trailing spaces?\nA: Yes. However, your reversed string should\
    \ not contain leading or trailing spaces.\n- Q: How many spaces between two words?\n\
    A: Reduce them to a single space in the reversed string.\n\n# Solution\n\n# O(n)\
    \ runtime, O(n) space:\n\nOne simple approach is a two-pass solution: First to\
    \ split the string by spaces into an array of words, then second pass to extract\
    \ the words in reversed order.\nWe can do better in one-pass. While iterating\
    \ the string in reverse order, we keep track of a word's begin and end position.\
    \ When we are at the beginning of a word, we append it.\n\n```java\npublic String\
    \ reverseWords(String s) {\n    StringBuilder reversed = new StringBuilder();\n\
    \    int j = s.length();\n    for (int i = s.length() - 1; i >= 0; i--) {\n  \
    \      if (s.charAt(i) == ' ') {\n            j = i;\n        } else if (i ==\
    \ 0 || s.charAt(i - 1) == ' ') {\n            if (reversed.length() != 0) {\n\
    \                reversed.append(' ');\n            }\n            reversed.append(s.substring(i,\
    \ j));\n        }\n    }\n    return reversed.toString();\n}\n```\n\n# Follow\
    \ up:\n\nIf the input string does not contain leading or trailing spaces, could\
    \ you do it in-place without allocating extra space? See Question [7]. Reverse\
    \ Words in a String II.\n\n# 7. Reverse Words in a String\n\nCode it now: Coming\
    \ soon! Difficulty: Medium, Frequency: N/A\n\n# Question:\n\nSimilar to Question\
    \ [6. Reverse Words in String], but with the following constraints:\n\n“The string\
    \ does not contain leading or trailing spaces and the words are always separated\
    \ by a single space.”\n\nCould you do in-place without allocating extra space?\n\
    \n# Solution:\n\n# O(n) runtime, O(1) space – In-place reverse:\n\nLet us indicate\
    \ the $i^{th}$ word by $w_i$ and its reversal as $w_i'$. Notice that when you\
    \ reverse a word, you get back the original word. That is, $(w_i)' = w_i$.\n\n\
    The input string is $w_1 w_2 ... w_n$. If we reverse the entire string, it becomes\
    \ $w_n' ... w_2' w_1'$. Finally, we reverse each individual and it becomes $w_n\
    \ ... w2 w1$. Similarly, the result could be reached by reversing each individual\
    \ word, and then reverse the entire string.\n\n```java\npublic void reverse(char[]\
    \ s) {\n    reverse(s, 0, s.length);\n    for (int i = 0, j = s.length - 1; j\
    \ < s.length; j++) {\n        if (s[j] == ' ') {\n            reverse(s, i, j);\n\
    \            i = j + 1;\n        }\n    }\n}\n\nprivate void reverse(char[] s,\
    \ int begin, int end) {\n    for (int i = 0; i < (end - begin) / 2; i++) {\n \
    \       char temp = s[begin + i];\n        s[begin + i] = s[end - i - 1];\n  \
    \      s[end - i - 1] = temp;\n    }\n}\n```\n\n# Challenge 1:\n\nImplement the\
    \ two-pass solution without using the library’s split function.\n\n# Challenge\
    \ 2:\n\nRotate an array to the right by k steps in-place without allocating extra\
    \ space. For instance, with k = 3, the array [0, 1, 2, 3, 4, 5, 6] is rotated\
    \ to [4, 5, 6, 0, 1, 2, 3].\n\n# 8. String to Integer (atoi)\n\nCode it now: https://oj.leetcode.com/problems/string-to-integer-atoi/\
    \ Difficulty: Easy, Frequency: High\n\n# Question:\n\nImplement atoi to convert\
    \ a string to an integer.\n\nThe atoi function first discards as many whitespace\
    \ characters as necessary until the first non-whitespace character is found. Then,\
    \ starting from this character, takes an optional plus or minus sign followed\
    \ by as many digits as possible, and interprets them as a numerical value.\n\n\
    The string can contain additional characters after those that form the integral\
    \ number, which are ignored and have no effect on the behavior of this function.\n\
    \nIf the first sequence of non-whitespace characters in str is not a valid integral\
    \ number, or if no such sequence exists because either str is empty or it contains\
    \ only whitespace characters, no conversion is performed.\n\nIf no valid conversion\
    \ can be performed, a zero value is returned. If the correct value is out of the\
    \ range of representable values, the maximum value (2147483647) or the minimum\
    \ integer value (-2147483648) is returned.\n\n# Solution:\n\nThe heart of this\
    \ problem is dealing with overflow. A direct approach is to store the number as\
    \ a string so we can evaluate at each step the number had overflowed. A desirable\
    \ solution does not require any assumption on how language works. In each step\
    \ we are appending a digit to the number by multiplication and addition. On the\
    \ other hand, if the current number is greater than 214748364, we know it will\
    \ overflow. Remember to also consider edge case for the smallest number.\n\n```java\n\
    private static final int max10 = 2147483647;\n\npublic int atoi(String str) {\n\
    \    int i = 0, n = str.length();\n    while (i < n && Character.isWhitespace(str.charAt(i)))\
    \ i++;\n    int sign = 1;\n    if (i < n && str.charAt(i) == '+') {\n        i++;\n\
    \    } else if (i < n && str.charAt(i) == '-') {\n        sign = -1;\n    }\n\
    \    int num = 0;\n    while (i < n && Character.isDigit(str.charAt(i))) {\n \
    \       int digit = Character.getNumericValue(str.charAt(i));\n        if (num\
    \ > max10 / 10 || (num == max10 / 10 && digit > 7)) {\n            return sign\
    \ == 1 ? Integer.MAX_VALUE : Integer.MIN_VALUE;\n        }\n        num = num\
    \ * 10 + digit;\n        i++;\n    }\n    return sign * num;\n}\n```\n\n# 9. Valid\
    \ Number\n\nCode it now: https://oj.leetcode.com/problem/valid-number/ Difficulty:\
    \ Easy. Frequency: Low\n\n# Question:\n\nValidate if a given string is numeric.\n\
    \nSome examples:\n\n- \"0\" -> true\n- \"0.1\" -> true\n- \"abc\" -> false\n\n\
    # Example Candidates Might Ask:\n\n- Q: How to account for whitespaces in the\
    \ string?\nA: When deciding if a string is numeric, ignore both leading and trailing\
    \ whitespaces.\n- Q: Should I ignore spaces between numbers as \"1 1\"?\nA: No,\
    \ only ignore leading and trailing whitespaces. \"1 1\" is not numeric.\n- Q:\
    \ If the string contains additional characters after a number, is it considered\
    \ valid?\nA: If the string contains any non-numeric characters (excluding whitespaces\
    \ and decimal point), it is not numeric.\n- Q: Is valid if a plus or minus sign\
    \ appears before the number?\nA: Yes, \"+1\" and \"-1\" are both numeric.\n- Q:\
    \ Should I consider only decimal? How about other bases as hexadecimal (0xFF)?\n\
    A: Only consider decimal numbers. \"0xFF\" is not numeric.\n- Q: Should I consider\
    \ exponent as \"1e0\" as numeric?\nA: No. But free to work on the challenge that\
    \ takes exponent into consideration. The Online Judge problem exponent into account.\n\
    \n# Solution:\n\nThis problem is very similar to Question [8. String to Integer\
    \ (atoi)]. Due to corner cases, it is helpful to break the problem down to components\
    \ that can be solved individually.\n\nA string could be divided into these four\
    \ substrings in the order from left to right:\n\n- s1. Leading whitespaces (optional).\n\
    - s2. Plus (+) or minus (-) sign (optional).\n- s3. Number.\n- s4. Optional whitespaces\
    \ (optional).\n\nWe ignore $s1, s2, s4$ and evaluate whether $s3$ is a valid number.\
    \ We realize that a number could either be a whole number or a decimal number.\
    \ For a whole number, it is easy: We evaluate $s3$ contains only digits and we\
    \ are done.\n\nOn the other hand, a decimal number could be further divided into\
    \ three parts:\n\nThe integer and fractional parts contain only digits. For example,\
    \ the number \"3.64\" has integer part (3) and fractional part (64). Both of them\
    \ are optional, but at least one of them must present. For example, a single dot\
    \ '.' is not a valid number, but \"1.\", \".1\"; and \"1.0\" are all valid. Please\
    \ note that \"1.\" is valid because it implies \"1.0\".\n\nBy now, it is pretty\
    \ straightforward to translate the requirements into code, where the main logic\
    \ to determine if x is numeric comes from line 6 to 17.\n\n```java\npublic boolean\
    \ isNumeric(String s) {\n    int i = 0, n = s.length();\n    while (i < n && Character.isWhitespace(s.charAt(i)))\
    \ i++;\n    if (i < n && (s.charAt(i) == '+' || s.charAt(i) == '-')) i++;\n  \
    \  boolean isNumeric = false;\n    while (i < n && Character.isDigit(s.charAt(i)))\
    \ {\n        i++;\n        isNumeric = true;\n    }\n    if (i < n && s.charAt(i)\
    \ == '.') {\n        i++;\n        while (i < n && Character.isDigit(s.charAt(i)))\
    \ {\n            i++;\n            isNumeric = true;\n        }\n    }\n    while\
    \ (i < n && Character.isWhitespace(s.charAt(i))) i++;\n    return isNumeric &&\
    \ i == n;\n}\n```\n"
  mdcn: "\n\n# 6. 反转字符串中的单词\n\n立即开始编码：https://oj.leetcode.com/problems/reverse-words-in-a-string/\
    \ 难度：中等，频率：高\n\n# 题目：\n\n给定一个输入字符串 s，按单词反转该字符串。\n例如，给定 s = \"the sky is blue\"\
    ，返回 \"blue is the sky\"。\n\n# 候选人可能提问的问题：\n\n- Q：什么构成单词？\n答：一序列非空格字符构成了一个单词。\n\
    - Q：制表符或换行符算作空格字符吗？\n答：假设输入中不包含任何制表符或换行符。\n- Q：输入字符串可能包含开头或结尾空格吗？\n答：是的。但是，你反转后的字符串不应该包含开头或结尾空格。\n\
    - Q：两个单词之间有多少个空格？\n答：在反转字符串中将它们减少为一个空格。\n\n# 解决方案\n\n# O(n) 时间复杂度，O(n) 空间复杂度：\n\
    \n一种简单的方法是两遍遍历法：首先通过空格将字符串拆分为单词数组，然后第二次遍历按反向顺序提取单词。\n我们可以在一遍遍历中做得更好。在按反序遍历字符串时，我们记录单词的起始和结束位置。当我们处于单词的开头时，将其进行追加。\n\
    \n```java\npublic String reverseWords(String s) {\n    StringBuilder reversed\
    \ = new StringBuilder();\n    int j = s.length();\n    for (int i = s.length()\
    \ - 1; i >= 0; i--) {\n        if (s.charAt(i) == ' ') {\n            j = i;\n\
    \        } else if (i == 0 || s.charAt(i - 1) == ' ') {\n            if (reversed.length()\
    \ != 0) {\n                reversed.append(' ');\n            }\n            reversed.append(s.substring(i,\
    \ j));\n        }\n    }\n    return reversed.toString();\n}\n```\n\n# 进阶：\n\n\
    如果输入字符串不包含开头或结尾空格，可以在不分配额外空间的情况下完成吗？参见题目 [7]. 反转字符串中的单词 II。\n\n# 7. 反转字符串中的单词\n\
    \n立即开始编码：即将上线！难度：中等，频率：N/A\n\n# 题目：\n\n类似于题目 [6. 反转字符串中的单词]，但带有以下限制：\n\n“字符串不包含开头或结尾空格，且单词始终由单个空格分隔。”\n\
    \n你可以在不分配额外空间的情况下完成吗？\n\n# 解决方案：\n\n# O(n) 时间复杂度，O(1) 空间复杂度 – 原地反转：\n\n让我们用 $w_i$\
    \ 表示第 $i$ 个单词，其反转后的表示为 $w_i'$。注意，当你反转一个单词时，你会得到原始单词。也就是说，$(w_i)' = w_i$。\n\n输入字符串为\
    \ $w_1 w_2 ... w_n$。如果我们反转整个字符串，它变成了 $w_n' ... w_2' w_1'$。最后，我们反转每个个体，它就变成了 $w_n\
    \ ... w2 w1$。同样，可以通过先反转每个单词，然后反转整个字符串得到结果。\n\n```java\npublic void reverse(char[]\
    \ s) {\n    reverse(s, 0, s.length);\n    for (int i = 0, j = s.length - 1; j\
    \ < s.length; j++) {\n        if (s[j] == ' ') {\n            reverse(s, i, j);\n\
    \            i = j + 1;\n        }\n    }\n}\n\nprivate void reverse(char[] s,\
    \ int begin, int end) {\n    for (int i = 0; i < (end - begin) / 2; i++) {\n \
    \       char temp = s[begin + i];\n        s[begin + i] = s[end - i - 1];\n  \
    \      s[end - i - 1] = temp;\n    }\n}\n```\n\n# 挑战1：不使用库函数实现两遍遍历方案。\n\n# 挑战2：在不分配额外空间的情况下向右旋转\
    \ $k$ 步。例如，当 $k = 3$ 时，数组 [0, 1, 2, 3, 4, 5, 6] 旋转到 [4, 5, 6, 0, 1, 2, 3]。\n\n\
    # 8. 字符串转整数 (atoi)\n\n立即开始编码：https://oj.leetcode.com/problems/string-to-integer/\
    \ 难度：简单，频率：高\n\n# 题目：\n\n实现 atoi 将字符串转换为整数。\n\natoi 函数首先丢弃尽可能多的空格字符，直到找到第一个非空格字符。然后从该字符开始，取一个可选的正负号，后跟尽可能多的数字，并将它们解释为数值。\n\
    \n字符串在形成整数的字符之后可能包含额外字符，这些字符会被忽略且不影响函数行为。\n\n如果字符串中的第一个非空格字符不是有效的整数，或者字符串为空或只包含空格字符，则返回零。如果正确的值超出范围，返回最大值\
    \ (2147483647) 或最小整数值 (-2147483648)。\n\n# 解决方案：\n\n该问题的核心是处理溢出。直接的方法是将数字存储为字符串，以便我们在每一步评估数字是否溢出。理想的解决方案是在每一步通过乘法和加法构建数字。另一方面，如果当前数字大于\
    \ 214748364，我们就知道会溢出了。还要考虑最小数字的边界情况。\n\n```java\nprivate static final int max10\
    \ = 2147483647;\n\npublic int atoi(String str) {\n    int i = 0, n = str.length();\n\
    \    while (i < n && Character.isWhitespace(str.charAt(i))) i++;\n    int sign\
    \ = 1;\n    if (i < n && str.charAt(i) == '+') {\n        i++;\n    } else if\
    \ (i < n && str.charAt(i) == '-') {\n        sign = -1;\n    }\n    int num =\
    \ 0;\n    while (i < n && Character.isDigit(str.charAt(i))) {\n        int digit\
    \ = Character.getNumericValue(str.charAt(i));\n        if (num > max10 / 10 ||\
    \ (num == max10 / 10 && digit > 7)) {\n            return sign == 1 ? Integer.MAX_VALUE\
    \ : Integer.MIN_VALUE;\n        }\n        num = num * 10 + digit;\n        i++;\n\
    \    }\n    return sign * num;\n}\n```\n\n# 9. 有效数字\n\n立即开始编码：https://oj.leetcode.com/problem/valid-number/\
    \ 难度：简单，频率：低\n\n# 题目：\n\n验证给定字符串是否为数字。\n\n一些示例：\n\n- \"0\" -> true\n- \"0.1\"\
    \ -> true\n- \"abc\" -> false\n\n# 候选人可能提问的问题：\n\n- Q：如何处理字符串中的空格？\n答：在判断字符串是否为数字时，忽略开头和结尾空格。\n\
    - Q：应该忽略数字之间的空格（如 \"1 1”）吗？\n答：不，只忽略开头和结尾空格。“1 1”不是数字。\n- Q：如果数字后面还有额外字符，它是有效的吗？\n\
    答：如果字符串包含任何非数字字符（空格和小数点），它不是数字。\n- Q：数字前出现正负号是有效的吗？\n答：是的，“+1”和“-1”都是数字。\n- Q：应该只考虑十进制吗？十六进制（如\
    \ 0xFF）如何？\n答：只考虑十进制。“0xFF”不是数字。\n- Q：应该把指数“1e0”视为数字吗？\n答：不是。但可以尝试考虑指数的挑战。在线判断题考虑了指数。\n\
    \n# 解决方案：\n\n这个问题与题目 [8. 字符串转整数 (atoi)] 非常相似。由于边界情况的存在，将问题分解为可以单独解决的组件很有帮助。\n\n\
    字符串可以从左到右分为以下四个子字符串：\n\n- s1. 开头空格（可选）。\n- s2. 正号 (+) 或负号 (-)（可选）。\n- s3. 数字。\n\
    - s4. 结尾空格（可选）。\n\n我们忽略 $s1, s2, s4$ 并评估 $s3$ 是否为有效数字。我们意识到一个数字可以是整数，也可以是小数。对于整数，很简单：我们评估\
    \ $s3$ 是否仅包含数字，然后完成了。\n\n另一方面，小数可以进一步分为三部分：\n\n整数部分和小数部分只包含数字。例如，数字“3.64”有整数部分（3）和小数部分（64）。两者都是可选的，但至少必须存在一个。例如，单个点\
    \ '.' 不是有效数字，但“1.””、“.1”和“1.0”都是有效的。请注意，“1.”是有效的，因为它意味着“1.0”。\n\n到目前，将需求转换为代码是非常直接的，判断\
    \ x 为数字的主要逻辑来自第 6 行到第 17 行。\n\n```java\npublic boolean isNumeric(String s) {\n\
    \    int i = 0, n = s.length();\n    while (i < n && Character.isWhitespace(s.charAt(i)))\
    \ i++;\n    if (i < n && (s.charAt(i) == '+' || s.charAt(i) == '-')) i++;\n  \
    \  boolean isNumeric = false;\n    while (i < n && Character.isDigit(s.charAt(i)))\
    \ {\n        i++;\n        isNumeric = true;\n    }\n    if (i < n && s.charAt(i)\
    \ == '.') {\n        i++;\n        while (i < n && Character.isDigit(s.charAt(i)))\
    \ {\n            i++;\n            isNumeric = true;\n        }\n    }\n    while\
    \ (i < n && Character.isWhitespace(s.charAt(i))) i++;\n    return isNumeric &&\
    \ i == n;\n}\n```\n\n"
