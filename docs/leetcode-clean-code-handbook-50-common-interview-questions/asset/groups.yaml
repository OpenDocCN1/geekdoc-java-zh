    \ UndirectedGraphNode graphCopy = new UndirectedGraphNode(graph.label);\n    map.put(graph,\
    \ graphCopy);\n    while (!q.isEmpty()) {\n        UndirectedGraphNode node =\
    \ q.poll();\n        for (UndirectedGraphNode neighbor : node.neighbors) {\n \
    \           if (map.containsKey(neighbor)) {\n                map.get(node).neighbors.add(map.get(neighbor));\n\
    \            } else {\n                UndirectedGraphNode neighborCopy = new\
    \ UndirectedGraphNode(neighbor.label);\n                map.get(node).neighbors.add(neighborCopy);\n\
    \                map.put(neighbor, neighborCopy);\n                q.add(neighbor);\n\
    \            }\n        }\n    }\n    return graphCopy;\n}\n```\n\n# Chapter 7:\
    \ Stack\n\n# 39. Min Stack\n\nCode it now: https://oj.leetcode.com/problems/min-stack/\
    \ Difficulty: Easy, Frequency: N/A\n\n# Question:\n\nDesign a stack that supports\
    \ push, pop, top, and retrieving the minimum element in constant time.\n\n- push(x)\
    \ – Push element onto stack.\n- pop() – Removes the element on top of the stack.\n\
    - top() – Get the top element.\n- getMin() – Retrieve the minimum element in the\
    \ stack.\n\n# Hints:\n\n- Consider space-time tradeoff. How would you keep track\
    \ of minimums using extra space?\n- Make sure to consider duplicate elements.\n\
    \n# Solution:\n\n# O(n) runtime, O(n) space – Extra stack:\n\nUsing an extra stack\
    \ to keep track of the minimum value. During the push operation we choose the\
    \ new element or the current minimum, whichever is smaller to push onto the stack.\n\
    \nFor the pop operation, we would pop from both stacks. getMin() is reflected\
    \ by the top element of min stack.\n\nTo illustrate this idea, we push the elements\
    \ 1, 4, 3, 0, 3 in that order.\n\n| Main stack | Min stack |\n| :--- | :--- |\n\
    | 3 | 0 |\n| 0 | 0 |\n| 3 | 1 |\n| 4 | 1 |\n| 1 | 1 |\n\nAfter popping two elements\
    \ the stack becomes:\n\n| Main stack | Min stack |\n| :--- | :--- |\n| 3 | 1 |\n\
    | 4 | 1 |\n| 1 | 1 |\n\n# O(n) runtime, O(n) space – Minor optimization:\n\nIf\
    \ a new element is larger than the current minimum, we do not need to push it\
    \ on the min stack. When we perform the pop operation, check if the popped element\
    \ is the same as the current minimum. If it is, it pop off the min stack too.\n\
    \n```java\nclass MinStack {\n    private Stack<Integer> stack = new Stack<>();\n\
    \    private Stack<Integer> minStack = new Stack<>();\n\n    public void push(int\
    \ x) {\n        stack.push(x);\n        if (minStack.isEmpty() || x <= minStack.peek())\
    \ {\n            minStack.push(x);\n        }\n    }\n\n    public void pop()\
    \ {\n        if (stack.pop().equals(minStack.peek())) minStack.pop();\n    }\n\
    \n    public int top() {\n        return stack.peek();\n    }\n\n    public int\
    \ getMin() {\n        return minStack.peek();\n    }\n}\n```\n\n# 40. Evaluate\
    \ Reverse Polish Notation\n\nCode it now: https://oj.leetcode.com/problems/evaluate-reverse-polish-notation/\
    \  Difficulty: Medium, Frequency: Low\n\n# Question:\n\nEvaluate the value of\
    \ an arithmetic expression in Reverse Polish Notation.\nValid operators are +,\
    \ -, *, /. Each operand may be an integer or another expression.\nSome examples:\n\
    \n- [\"2\", \"1\", \"+\", \"3\", \"*\"] -> ((2 + 1) * 3) -> 9\n- [\"4\", \"13\"\
    , \"5\", \"/\", \"+\"] -> (4 + (13 / 5)) -> 6\n\n# Example Candidates Might Ask:\n\
    \nQ: Is an empty array a valid input?\nA: No.\n\n# Solution:\n\nThe Reverse Polish\
    \ Notation (RPN) is also known as the postfix notation, because each operator\
    \ appears *after* its operands. For the infix notation \"3 + 4\" is expressed\
    \ as \"3 4 +\" in RPN.\n\n# The brute force approach:\n\nWe look for the simplest\
    \ RPN sequence that could be evaluated immediately, that is: Two successive operands\
    \ followed by an operator such as “4 2 +\\ We replace this sequence with the expression's\
    \ value and repeat until there is only one operand left.\n\nFor example:\n\n-\
    \ [\"4\", \"13\", \"5\", \"/\", \"+\"]\n- [\"4\", \"2\", \"+\"]\n- [\"6\"]\n\n\
    How would you replace it? Could you do it in-place with the input array, but it\
    \ would result in quadratic runtime as elements have to be shifted every time\
    \ a replacement occurs.\n\nA workaround is to copy the input array to a doubly\
    \ linked list. The replacement is efficient and the next scan begins with the\
    \ replaced value's previous element. This results in an algorithm with linear\
    \ runtime and linear space. Although this works, the implementation is complex\
    \ and is far from ideal in an interview session.\n"
