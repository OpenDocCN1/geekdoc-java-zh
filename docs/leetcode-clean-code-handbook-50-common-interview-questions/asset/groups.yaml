    \ well (e.g., -43 % 10 = -3).\n\n```java\npublic int reverse(int x) {\n    int\
    \ ret = 0;\n    while (x != 0) {\n        ret = ret * 10 + x % 10;\n        x\
    \ /= 10;\n    }\n    return ret;\n}\n```\n\nThere is a flaw in the above code\
    \ – the reversed integer could overflow/underflow. Take $x = 1000000003$ for example.\
    \ To check for overflow/underflow, we could check if $ret > 214748364$ or $ret\
    \ < -214748364$ before multiplying by 10. On the other hand, if $ret == 214748364$,\
    \ it must not overflow because the last digit is guaranteed to be 1 due to constraint\
    \ of $x$.\n\n```java\npublic int reverse(int x) {\n    int ret = 0;\n    while\
    \ (x != 0) {\n        // handle overflow/underflow\n        if (Math.abs(ret)\
    \ > 214748364) {\n            return 0;\n        }\n        ret = ret * 10 + x\
    \ % 10;\n        x /= 10;\n    }\n    return ret;\n}\n```\n\n## 18. Plus One\n\
    \nCode it now: https://oj.leetcode.com/problems/plus-one/ Difficulty: Easy, Frequency:\
    \ High\n\nQuestion:\n\nGiven a number represented as an array of digits, plus\
    \ one.\n\nExample Questions Might Ask:\n\n- Q: Could the number be negative?\n\
    - A: No. Assume it is a non-negative number.\n- Q: How are the digits ordered?\
    \ For example, is number 12 represented by [1,2] or [2,1]?\n- A: The most significant\
    \ digit is at the head.\n- Q: Could the number contain leading zeros, such as\
    \ [0,0,1]?\n- A: No.\n\nSolution:\n\nIterate from the least significant digit,\
    \ and simulate by adding one to it. Adding to a digit less than nine is straightforward\
    \ — Add one to it and we done. On the other hand, adding one to a digit of 9 brings\
    \ it to 10, so we set the digit to 0 and this behavior continues until the most\
    \ significant digit. Finally, be sure to handle where each digit is 9.\n\n```java\n\
    public void plusOne(List<Integer> digits) {\n    for (int i = digits.size() -\
    \ 1; i >= 0; i--) {\n        int digit = digits.get(i);\n        if (digit < 9)\
    \ {\n            digits.set(i, digit + 1);\n            return;\n        } else\
    \ {\n            digits.set(i, 0);\n        }\n    }\n    digits.add(0);\n   \
    \ digits.set(0, 1);\n}\n```\n\nWhen all digits are 9, we append 0 and modify the\
    \ most significant digit to 1. If implemented as an ArrayList, appending is more\
    \ efficient than inserting to the front because all elements have to be shifted.\n\
    \n## 19. Palindrome Number\n\nCode it now: https://oj.leetcode.com/problems/palindrome-number/\
    \ Difficulty: Easy, Frequency: Medium\n\nQuestion:\n\nDetermine whether an integer\
    \ is a palindrome. Do this without extra space.\n\nExample Questions Might Ask:\n\
    \n- Q: Does negative integer -1 qualify as a palindrome?\n- A: For the purpose\
    \ of discussion here we define negative integers as non-palindrome.\n\nSolution:\n\
    \nThe most intuitive approach is to first represent the integer as a string, since\
    \ it is more convenient to manipulate. Although this works, it violates the restriction\
    \ of not using extra space (ie. you have to allocate n characters to store the\
    \ integer as string, where n is the maximum number of digits). I know this sounds\
    \ like an unreasonable requirement (since it uses so little space), don't most\
    \ interview problems have requirements?\n\nAnother approach is to first reverse\
    \ the number. If the number is the same as its reversed, then it must be a palindrome.\n\
    \n```java\npublic int reverse(int num) {\n    assert num >= 0; // for non-negative\
    \ integers only.\n    int rev = 0;\n    while (num != 0) {\n        rev = rev\
    \ * 10 + num % 10;\n        num /= 10;\n    }\n    return rev;\n}\n```\n\nThis\
    \ seemed to work, but did you consider the possibility that the reversed number\
    \ might overflow? If it overflows, the behavior is language specific (For Java\
    \ the number wraps around on overflow, but in C/C++ its behavior is undefined).\
    \ Yuck.\n\nOf course, we could avoid overflow by returning a type that has larger\
    \ size than int (long). However, note that this is language specific, and the\
    \ larger type might not be available on all languages.\n\nWe could construct a\
    \ better and more generic solution. One pointer is that we must start comparing\
    \ the digits somewhere. And you know there could only be two ways, expand from\
    \ the middle or compare the two ends.\n\nIt turns out that comparing from the\
    \ two ends is easier. First, compare the first and last digit. If they are not\
    \ the same, it must not be a palindrome. If they are the same, chop off one digit\
    \ from both ends and continue until you have no digits left, which you conclude\
    \ must be a palindrome. Now, getting and chopping the last digit is easy. However,\
    \ getting and chopping the first digit in a generic way requires some thought.\
    \ I will leave this to you as an exercise. Please think your solution before you\
    \ peek on the solution below.\n\n```java\npublic boolean isPalindrome(int x) {\n\
    \    if (x < 0) return false;\n    int div = 1;\n    while (x / div >= 10) {\n\
    \        div *= 10;\n    }\n    while (x != 0) {\n        int l = x / div;\n \
    \       int r = x % 10;\n        if (l != r) return false;\n        x = (x % div)\
    \ / 10;\n        div /= 100;\n    }\n    return true;\n}\n```\n"
