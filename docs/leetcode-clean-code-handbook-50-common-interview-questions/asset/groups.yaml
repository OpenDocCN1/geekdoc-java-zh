    # Question:


    Design a stack that supports push, pop, pop, top, and retrieving the minimum element
    in constant time.


    +   * push(x) – Push element x onto stack.

    * pop() – Removes the element on top of the stack.

    * top() – Get the top element.

    * getMin() – Retrieve the minimum element in the stack.


    # Hints:


    +   > Consider space-time tradeoff. How would you keep track of the minimums using
    extra space?

    > Make sure to consider duplicate elements.


    # Solution:


    # O(n) runtime, O(n) space – Extra stack:


    Using an extra stack to keep track of the current minimum value. During the push
    operation we choose the new element or the current minimum, whichever is smaller
    to push onto the stack.


    For the pop operation, we would pop from both stacks. getMin() is reflected by
    the top element of min stack.


    To illustrate this idea, we push the elements 1, 4, 3, 0, 3 in that order.


    | Main stack | Min stack |

    |---|---|

    | 3 | 0 |

    | 0 | 0 |

    | 3 | 1 |

    | 4 | 1 |

    | 1 | 1 |


    After popping two elements from the stack becomes:


    | Main stack | Min stack |

    |---|---|

    | 3 | 1 |

    | 4 | 1 |

    | 1 | 1 |


