    }\n```\n\n```\nprivate boolean isSubtreeGreaterThan(TreeNode p, int val) {\n \
    \   if (p == null) return true;\n    return p.val > val\n    && isSubtreeGreaterThan(p.left,\
    \ val)\n    && isSubtreeGreaterThan(p.right, val);\n}\n```\n\nThe worst case complexity\
    \ is O(n^2) for the brute force algorithm, where the tree degenerates into a list\
    \ with n nodes.\n\n# O(n) runtime, O(n) stack space: Top-down recursion:\n\nHere\
    \ is the much better solution. We can examine all nodes of subtrees in each pass\
    \ by passing the low and high limits from the parent to its children.\n\nRefer\
    \ back to the binary tree (1). As we traverse the tree from node (10) to right\
    \ node (15), we know for sure that the right node's value fall between 10 and\
    \ +∞. Then, as we traverse further from node (15) to left node (6), we know for\
    \ sure that the left node's value fall between 10 and 15. And since (6) does not\
    \ satisfy the above requirement, we can quickly determine it is not a valid BST.\n\
    \n```\npublic boolean isValidBST(TreeNode root) {\n    return valid(root, Integer.MIN_VALUE,\
    \ Integer.MAX_VALUE);\n}\n```\n\n```\nprivate boolean valid(TreeNode p, int low,\
    \ int high) {\n    if (p == null) return true;\n    return p.val > low && p.val\
    \ < high\n    && valid(p.left, low, p.val)\n    && valid(p.right, p.val, high);\n\
    }\n```\n\nThis algorithm runs in O(n) time, where n is the number of nodes of\
    \ the binary tree.\n\nSharp readers may notice that the above code does not work\
    \ if the tree contains the smallest or largest integer value. How could we fix\
    \ this? One way to fix this is to use null to represent the infinity."
