    # 49. Find Minimum in Sorted Rotated Array


    Code it now: https://oj.leetcode.com/problems/find-minimum-in-rotated-sorted-array/    Difficulty:
    Medium, Frequency: High


    # Question:


    Suppose a sorted array is rotated at some pivot unknown to beforehand.

    (i.e., 0 1 2 3 4 5 6 7 might become 4 5 6 7 0 1 2).

    Find the minimum element.


    You may assume no duplicate exists in the array.


    # Solution:


    The minimum is at $A_L$ where $A_{L-1} > A_L$. Notice that if we subdivide the
    array into two, one will always be sorted, while the other contains the minimum.


    ![](img/172f5d31191b965fe8ccb5a0f5becd9a_97_0.png)


    We have an array [1,2,3,4,5,6,7] (See graph 1) which was rotated 3 steps to the
    right [5,6,7,1,2,3,4] (See graph 2). Let''s say we subdivide the array at point
    $k$ to two subarrays $[A_L, A_{L+1}, \dots, A_k]$. $[A_{k+1} \dots A_R]$.


    If the array is not rotated, then $A_L < A_R$ we can return $A_L$ as the minimum
    immediately.


    Otherwise for a sorted array that was rotated at least one step, $A_L$ must always
    be greater than $A_R$.


    Let''s choose $M_1$ as the dividing point. Since $A_{M1} > A_R$, we know that
    each element in $[A_L \dots AM_1]$ is greater than $A_R$ (Remember that $A_L >
    A_R$?). Therefore, the minimum value must locate in $[A_{M1+1} \dots A_R]$.


    On the other hand, let''s assume we choose $M_2$ as the dividing point. Since
    $A_{M2} \le A_R$, we know that each element in $[AM_{2+1} \dots A_R]$ is greater
    than $A_{M2}$. Therefore, the minimum point must locate in $[A_L \dots AM_2]$.


