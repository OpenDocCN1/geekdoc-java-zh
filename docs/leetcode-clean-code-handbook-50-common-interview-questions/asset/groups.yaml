    \ Difficulty: Medium, Frequency: High\n\n# Question:\n\nGiven an input string\
    \ s, reverse the string by word.\nFor example, given s = \"the sky is blue\",\
    \ return \"blue is the sky\".\n\n# Examples Candidates Might Ask:\n\n+   Q: What\
    \ constitutes a word?\nA: A sequence of non-space characters constitutes a word.\n\
    Q: Does tab or newline character count as space characters?\nA: Assume the input\
    \ does not contain any tabs or newline characters.\nQ: Could the input string\
    \ contain leading or trailing spaces?\nA: Yes. However, your reversed string should\
    \ not contain leading or trailing spaces.\nQ: How many spaces between two words?\n\
    A: Reduce them to a single space in the reversed string.\n\n# Solution\n\n# O(n)\
    \ runtime, O(n) space:\n\nOne simple approach is a two-pass solution: First to\
    \ split the string by spaces into an array of words, then second pass to extract\
    \ the words in reversed order.\nWe can do better in one-pass. While iterating\
    \ the string in reverse order, we keep track of a word's begin and end position.\
    \ When we are at the beginning of a word, we append it.\n\n```\npublic String\
    \ reverseWords(String s) {\n    StringBuilder reversed = new StringBuilder();\n\
    \    int j = s.length();\n    for (int i = s.length() - 1; i >= 0; i--) {\n  \
    \      if (s.charAt(i) == ' ') {\n            j = i;\n        } else if (i ==\
    \ 0 || s.charAt(i - 1) == ' ') {\n            if (reversed.length() != 0) {\n\
    \                reversed.append(' ');\n            }\n            reversed.append(s.substring(i,\
    \ j));\n        }\n    }\n    return reversed.toString();\n}\n```\n\n# Follow\
    \ up:\n\nIf the input string does not contain leading or trailing spaces, could\
    \ you do it in-place without allocating extra space? See Question [7]. Reverse\
    \ Words in a String II."
  - "[PAGE 13]\n\n# 7. Reverse Words in a String\n\nCode it now: Coming soon! Difficulty:\
    \ Medium, Frequency: N/A\n\n# Question:\n\nSimilar to Question [6. Reverse Words\
    \ in String], but with the following constraints:\n\n“The string does not contain\
    \ leading or trailing spaces and the words are always separated by a single space.”\n\
    \nCould you do in-place without allocating extra space?\n\n# Solution:\n\n# O(n)\
    \ runtime, O(1) space – In-place reverse:\n\nLet us indicate the $i^{th}$ word\
    \ by $w_i$ and its reversal as $w_i'$. Notice that when you reverse a word, you\
    \ get back the original word. That is, $(w_i)' = w_i$.\n\nThe input string is\
    \ $w_1 w_2 ... w_n$. If we reverse the entire string, it becomes $w_n' ... w_2'\
    \ w_1'$. Finally, we reverse each individual and it becomes $w_n ... w2 w1$. Similarly,\
    \ the result could be reached by reversing each individual word, and then reverse\
    \ the entire string.\n\n```\npublic void reverse(char[] s) {\n    reverse(s, 0,\
    \ s.length);\n    for (int i = 0, j = s.length - 1; j < s.length; j++) {\n   \
    \     if (s[j] == ' ') {\n            reverse(s, i, j);\n            i = j + 1;\n\
    \        }\n    }\n}\n\nprivate void reverse(char[] s, int begin, int end) {\n\
    \    for (int i = 0; i < (end - begin) / 2; i++) {\n        char temp = s[begin\
    \ + i];\n        s[begin + i] = s[end - i - 1];\n        s[end - i - 1] = temp;\n\
    \    }\n}\n```\n\n# Challenge 1:\n\nImplement the two-pass solution without using\
    \ the library’s split function.\n\n# Challenge 2:\n\nRotate an array to the right\
    \ by k steps in-place without allocating extra space. For instance, with k = 3,\
    \ the array [0, 1, 2, 3, 4, 5, 6] is rotated to [4, 5, 6, 0, 1, 2, 3]."
