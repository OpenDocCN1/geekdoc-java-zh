    \ unbalanced so we avoid unnecessary calculations.\n\nIn each step, we look at\
    \ the left subtree's depth (L), and ask: “Is the left subtree unbalanced?” If\
    \ it is indeed unbalanced, we return -1 right away. Otherwise, L represents the\
    \ left subtree's depth. We then repeat the same process for the right subtree's\
    \ depth (R).\n\nWe calculate the absolute difference between L and R. If the subtrees'\
    \ depth difference is less than one, we could return the height of the current\
    \ node, otherwise return -1 meaning the current tree is unbalanced."
