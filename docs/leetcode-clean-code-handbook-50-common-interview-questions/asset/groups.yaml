  - "[PAGE 46]\n\n# Chapter 4: Binary Tree\n\n# 25. Validate Binary Search Tree\n\n\
    Code it now: https://oj.leetcode.com/problems/validate-binary-search-tree/ Difficulty:\
    \ Medium, Frequency: High\n\n# Question:\n\nGiven a binary tree, determine if\
    \ it is a valid Binary Search Tree (BST).\n\n# Solution:\n\nFirst, you must understand\
    \ the difference between Binary Tree and BST. Binary tree is a tree data structure\
    \ in which each node has at most two child nodes. A BST is based on binary tree,\
    \ with the following additional properties:\n\n+   - The left subtree of a node\
    \ contains only nodes with keys less than the node's key.\n- The right subtree\
    \ of a node contains only nodes with keys greater than the node's key.\n- Both\
    \ the left and right subtrees must also be binary search trees.\n\nPeople who\
    \ do not understand the definition of BST may give the following algorithm:\n\
    Assume the current node's value is k. For each node, check if the left node's\
    \ value is less than k and the right node's value is greater than k. If all of\
    \ the nodes satisfy this property, then it is a BST.\n\nIt sounds correct and\
    \ convincing, but look at this counter example below: A sample tree that we name\
    \ it binary tree (1).\n\n```\n10\n / \\\n5 15 ------ binary tree (1)\n / \\\\\n\
    6 20\n```\n\nIt's obvious that this is not a BST, since (6) could never be on\
    \ the right of (10).\n\nO(n²) runtime, O(n) stack space - Brute force:\n\nBased\
    \ on BST's definition, we can easily devise a brute force solution:\n\nAssume\
    \ the current node's value is k. For each node, check if all nodes of left subtree\
    \ contain values that are less than k. Also check if all nodes of right subtree\
    \ contain values that are greater than k. If all of the nodes satisfy this property,\
    \ then it must be a BST.\n\nBelow is the brute force code that is inefficient:"
