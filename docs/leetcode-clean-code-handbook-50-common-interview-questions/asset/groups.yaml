    \ 5, 6 ],\n[ 7, 8, 9 ]\n```\n\nYou should return [1,2,3,6,9,8,7,4,5].\n\n## Solution:\n\
    \n![](img/172f5d31191b965fe8ccb5a0f5becd9a_66_0.png)\n\nWe simulate walking the\
    \ matrix from the top left corner in a spiral manner. In the outermost level,\
    \ we traverse n steps right, m – 1 steps down, n – 1 steps left, and m – 2 steps\
    \ up, then we continue traverse into its next level.\n\nAs the traversal toward\
    \ the matrix’s center, we stop by determining if we have reached the “center”.\
    \ However, defining the “center” is difficult since the matrix is not necessarily\
    \ a square. Think of edge cases such as 1×1, 1×10 and 10×1 matrices, where the\
    \ \"center\" is tricky. A cleaner solution is to keep track of the current position\
    \ and change direction when the number of steps in that direction decreases.\n\
    \n```java\npublic List<Integer> spiralOrder(int[][] matrix) {\n    List<Integer>\
