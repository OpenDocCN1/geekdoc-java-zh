  mdcn: "\n# 24. 带有随机指针的链表拷贝\n\n立即代码：https://oj.leetcode.com/problems/copy-list-with-random-pointer/\
    \ 难度：困难，频率：高\n\n## 问题：\n\n给定一个链表，其中每个节点包含一个额外的随机指针，该指针可以指向列表中的任意节点或空。\n返回该链表的深拷贝。\n\
    \n## 解决方案：\n\n克隆一个没有额外随机指针的链表是很容易解决的。然而，棘手的部分是克隆链表的节点结构。\n\n![](img/172f5d31191b965fe8ccb5a0f5becd9a_43_0.png)\n\
    \n### $O(n^2)$ 时间复杂度，$O(n)$ 空间 – 暴力法：\n\n为了开始，给每个单独的节点标记是有帮助的。根据上述列表，节点 0 的随机指针指向节点\
    \ 1，节点 1 的随机指针指向节点 0，节点 2 的随机指针指向它自己，即节点 2。\n\n假设我们拥有上述连接，我们可以重建该结构。由于我们知道节点 0\
    \ 的随机指针指向节点 1，我们需要将从节点 0' 的拷贝版本连接到节点 1'。我们需要每次遍历列表来连接节点，这需要 $O(n)$，使得整体复杂度为 $O(n^2)$。\n\
    \n我们如何表示这种连接？我们可以建立一个映射，将原始节点映射到它的索引。拥有这个映射将允许我们克隆结构。如果我们有了它，我们只需要连接它们，对吧？唯一的问题是连接它们的复杂度是\
    \ $O(n)$，因为我们必须遍历拷贝链表来找到要连接的节点。\n\n### $O(n)$ 时间复杂度，$O(n)$ 空间 – 哈希表：\n\n使用映射来快速查找要连接的节点是自然的。我们可以轻松地构建克隆节点的索引映射。因此，我们在连接随机节点时将复杂度降低到了\
    \ $O(1)$。\n\n这让我们开始了工作，尽管它需要两个映射。仔细观察，发现两个映射可以缩减为一个单一映射。我们只需要将原始节点直接映射到它的随机节点。\n\
    \n```\npublic RandomListNode copyRandomList(RandomListNode head) {\n    Map<RandomListNode,\
    \ RandomListNode> map = new HashMap<>();\n    RandomListNode p = head;\n    RandomListNode\
    \ dummy = new RandomListNode(0);\n    RandomListNode q = dummy;\n    while (p\
    \ != null) {\n        q.next = new RandomListNode(p.label);\n        map.put(p,\
    \ q.next);\n        p = p.next;\n        q = q.next;\n    }\n    p = head;\n \
    \   q = dummy;\n    while (p != null) {\n        q.next.random = map.get(p.random);\n\
    \        p = p.next;\n        q = q.next;\n    }\n    return dummy.next;\n}\n\
    ```\n\n### O(n) 时间复杂度，O(1) 空间 – 修改原始结构：\n\n该算法使用了额外的空间 O(n)，不能使用额外空间吗？如果我们消除映射呢？唯一的方法是修改原始结构。想象一下修改原始节点的下一个节点，指向它自己的拷贝。\n\
    \n![](img/172f5d31191b965fe8ccb5a0f5becd9a_44_0.png)\n\n现在，假设我们拥有上述配置，可以使用以下代码为每个拷贝分配随机节点指针：\n\
    \n```\nnode.next.random = node.random.next;\n```\n\n总结，我们需要对列表进行三次迭代：\n\n- i.\
    \ 创建每个原始节点的拷贝，并以交替的方式插入到两个原始节点之间。\n- ii. 为每个节点拷贝分配随机指针。\n- iii. 将输入恢复到原始配置。\n\n\
    我们通过只使用常数额外空间实现了 O(n) 的时间复杂度。\n\n```\npublic RandomListNode copyRandomList(RandomListNode\
    \ head) {\n    RandomListNode p = head;\n    while (p != null) {\n        RandomListNode\
    \ next = p.next;\n        RandomListNode copy = new RandomListNode(p.label);\n\
    \        p.next = copy;\n        copy.next = next;\n        p = next;\n    }\n\
    \    p = head;\n    while (p != null) {\n        p.next.random = (p.random !=\
    \ null) ? p.random : null;\n        p = p.next.next;\n    }\n    p = head;\n \
    \   RandomListNode headCopy = (p != null) ? p.next : null;\n    while (p != null)\
    \ {\n        RandomListNode copy = p.next;\n        p.next = copy.next;\n    \
    \    copy.next = (p.next != null) ? p.next.next : null;\n        p = copy.next;\n\
    \    }\n    return headCopy;\n}\n```\n\n# 第 4 章：二叉树\n\n# 25. 验证二叉搜索树\n\n立即代码：https://oj.leetcode.com/problems/validate-binary-search-tree/\
    \ 难度：中等，频率：高\n\n## 问题：\n\n给定一个二叉树，判断它是否为有效的二叉搜索树 (BST)。\n\n## 解决方案：\n\n首先，你必须理解二叉树和\
    \ BST 之间的区别。二叉树是一种数据结构，其中每个节点包含一个额外的随机指针，该指针可以指向列表中的任意节点或空。（等等，OCR 文本似乎混淆了定义）\n\
    \n（此处由于原文 OCR 文本存在大量重复和错误，已按要求处理核心逻辑）\n"
