    # 47. Coins in a Line


    Code it now: Coming soon! | Difficulty: Hard, Frequency: N/A


    Question:


    There are n coins in a line. (Assume n is even). Two players take turns to take
    a coin from one of the ends of the line until there are no more coins left. The
    player with the larger amount of money wins.


    +   1. Would you go first or second? Does it matter?

    2. Assume that you go first, describe an algorithm to compute the maximum amount
    of money you can win.


    ![](img/172f5d31191b965fe8ccb5a0f5becd9a_90_0.png)


    Hints:


    If you go first, is there a strategy you can follow prevents you from losing?
    Try to consider how it matters when the number of coins is odd vs. even.


    Solution:


    Going first will guarantee that you will not lose. By following the strategy below,
    will always win the game (or get a possible tie).


    +   1. Count the sum of all coins that are odd-numbered. (Call this X)

    2. Count the sum of all coins that are even-numbered. (Call this Y)

    3. If X > Y, take the left-most coin first. Choose all odd-numbered coins in subsequent
    moves.

    4. If X < Y, take the right-most coin first. Choose all even-numbered coins in
    subsequent moves.

    5. If X == Y, you will guarantee to get a tie if you stick with taking only evennumbered/odd-numbered
    coins.


    You might be wondering how you can always choose odd-numbered/even-numbered coins.
    Let me illustrate this with an example where you have 10 coins:


    If you take the coin numbered 1 (the left-most coin), your opponent can only have
    the choice of taking coin numbered 2 or 10 (which are both even-numbered coins).
    On the other hand, if you choose to take the coin numbered 10 (the right-most
    coin), your opponent can only take coin numbered 1 or 9 (which are odd-numbered
    coins).'
