- md: "\n## 26. Maximum Depth of Binary Tree\n\nCode it now: https://oj.leetcode.com/problems/maximum-depth-of-binary-tree/\
    \ Difficulty: Easy, Frequency: High\n\n### Question:\n\nGiven a binary tree, find\
    \ its maximum depth.\n\nThe maximum depth is the number of nodes along the longest\
    \ path from the root node to the farthest leaf node.\n\n### Solution:\n\nThe maximum\
    \ height of a binary tree is defined as the number of nodes along the path from\
    \ the root node to the deepest leaf node. Note that the maximum depth of an empty\
    \ tree is 0.\n\n### O(n) runtime, O(log n) space – Recursion:\n\nWe could solve\
    \ this easily using recursion, because each of the left child and right child\
    \ of a node is a sub-tree itself. We first compute the max height of left sub-tree,\
    \ and compute the max height of right sub-tree. The maximum depth of the current\
    \ node is the greater of the two maximus plus one. For the base case, we look\
    \ at a tree that is empty, which we return 0.\n\nAssume that $n$ is the total\
    \ number of nodes in the tree. The runtime complexity is O(n) because it traverse\
    \ each node exactly once. As the maximum depth of a binary tree is O(log n), the\
    \ extra space cost is O(log n) due to the extra space used by the recursion.\n\
    \n```java\npublic int maxDepth(TreeNode root) {\n    if (root == null) return\
    \ 0;\n    return Math.max(maxDepth(root.left), maxDepth(root.right)) + 1;\n}\n\
    ```\n\n## 27. Minimum Depth of Binary Tree\n\nCode it now: https://oj.leetcode.com/problems/minimum-depth-of-binary-tree/\
    \ Difficulty: Easy, Frequency: High\n\n### Question:\n\nGiven a binary tree, find\
    \ its minimum depth.\n\nThe minimum depth is the number of nodes along the shortest\
    \ path from the root node down to the nearest leaf node.\n\nSimilar to [26. Maximum\
    \ Depth of Binary Tree], here we need to find the minimum depth instead.\n\n###\
    \ Solution:\n\n### O(n) runtime, O(log n) space – Depth-first traversal:\n\nSimilar\
    \ to the [Recursion] approach to find the maximum depth, but make sure you consider\
    \ these cases:\n\n- i. The node is a leaf node. The minimum depth is one.\n\n\
    - ii. Node that has one empty subtree while the other is non-empty. Return the\
    \ minimum depth of that non-empty subtree.\n\n```java\npublic int minDepth(TreeNode\
    \ root) {\n  if (root == null) return 0;\n  if (root.left == null) return minDepth(root.right)\
    \ + 1;\n  if (root.right == null) return minDepth(root.left) + 1;\n  return Math.min(minDepth(root.left),\
    \ minDepth(root.right)) + 1;\n}\n```\n\n### O(n) runtime, O(n) space – Breadth-first\
    \ traversal:\n\nNote that this previous approach traverses all the nodes for a\
    \ highly unbalanced tree. In fact, we could optimize this by doing a breadth-first\
    \ traversal (also known as level-order traversal). When we encounter the first\
    \ leaf node, we immediately stop the traversal.\n\nWe also keep track of the current\
    \ depth and increment it when we reach the end of level. We know that we have\
    \ reached the end of level when the current node is the right-most node.\n\nCompared\
    \ to the recursion approach, the breadth-first traversal works well for highly\
    \ unbalanced tree because it does not need to traverse all nodes. The worst case\
    \ is when the tree is a full binary tree with a total of n nodes. In this case,\
    \ we have to traverse all nodes. The worst case space complexity is O(n), due\
    \ to the extra space needed to store current level nodes in the queue.\n\n```java\n\
    public int minDepth(TreeNode root) {\n    if (root == null) return 0;\n    Queue<TreeNode>\
    \ q = new LinkedList<>();\n    q.add(root);\n    TreeNode rightMost = root;\n\
    \    int depth = 1;\n    while (!q.isEmpty()) {\n        TreeNode node = q.poll();\n\
    \        if (node.left == null && node.right == null) break;\n        if (node.left\
    \ != null) q.add(node.left);\n        if (node.right != null) q.add(node.right);\n\
    \        if (node == rightMost) {\n            rightMost = (node.right != null)\
    \ ? node.right : node.left;\n            depth++;\n        }\n    }\n    return\
    \ depth;\n}\n```\n\n## 28. Balanced Binary Tree\n\nCode it now: https://oj.leetcode.com/problems/balanced-binary-tree/\
    \ Difficulty: Easy, Frequency: High\n\n### Question:\n\nGiven a binary tree, determine\
    \ if it is height-balanced.\n\nFor this problem, a height-balanced binary tree\
    \ is defined as a binary tree in which the depth of the subtrees of every node\
    \ never differs by more than 1.\n\n### Solution:\n\n### O(n^2) runtime, O(n) stack\
    \ space – Brute force top-down recursion:\n\nWe could devise a brute force algorithm\
    \ to find the maximum depth of a subtree. We also reused the [Recursion] approach\
    \ to find the worst case complexity O(n²) when the input tree is degenerated.\n\
    \n```java\npublic boolean isBalanced(TreeNode root) {\n    if (root == null) return\
    \ true;\n    return Math.abs(maxDepth(root.left) - maxDepth(root.right)) <= 1\n\
    \    && isBalanced(root.left)\n    && isBalanced(root.right);\n}\n```\n\n```java\n\
    public int maxDepth(TreeNode root) {\n    if (root == null) return 0;\n    return\
    \ Math.max(maxDepth(root.left), maxDepth(root.right)) + 1;\n}\n```\n\n### O(n)\
    \ runtime, O(n) stack space – Bottom-up recursion:\n\nIt seems that this approach\
    \ is recalculating max depth repeatedly for each node. We could avoid the recalculation\
    \ by passing the depth bottom-up. We use a sentinel value -1 to represent that\
    \ the tree is unbalanced so we avoid unnecessary calculations.\n\nIn each step,\
    \ we look at the left subtree's depth (L), and ask: “Is the left subtree unbalanced?”\
    \ If it is indeed unbalanced, we return -1 right away. Otherwise, L represents\
    \ the left subtree's depth. We then repeat the same process for the right subtree's\
    \ depth (R).\n\nWe calculate the absolute difference between L and R. If the subtrees'\
    \ depth difference is less than one, we could return the height of the current\
    \ node, otherwise return -1 meaning the current tree is unbalanced.\n\n```java\n\
    public boolean isBalanced(TreeNode root) {\n    return maxDepth(root) != -1;\n\
    }\n\nprivate int maxDepth(TreeNode root) {\n    if (root == null) return 0;\n\
    \    int L = maxDepth(root.left);\n    if (L == -1) return -1;\n    int R = maxDepth(root.right);\n\
    \    if (R == -1) return -1;\n    if (Math.abs(L - R) > 1) return -1;\n    return\
    \ Math.max(L, R) + 1;\n}\n```\n\n## 29. Convert Sorted Array to Binary Tree\n\n\
    Code it now: https://oj.leetcode.com/problems/convert-sorted-array-to-binary-tree/\
    \ Difficulty: Medium, Frequency: Low\n\n### Question:\n\nGiven an array where\
    \ elements are sorted, convert it to height balanced BST.\n\n### Hint:\n\nThis\
    \ question is highly recursive in nature. Think of how binary search works.\n\n\
    ![](img/172f5d311965fe8cc5a0fbecd9a)\n\nFigure 2: An example of a height-balanced\
    \ tree. A height-balanced tree is a tree whose subtrees differ in height no more\
    \ than one and the subtrees are height-balanced, too.\n\n### Solution:\n\n###\
    \ O(n) runtime, O(log n) space – Divide and conquer:\n\nIf you would have to choose\
    \ an array element to be the root of a balanced BST, which element would you pick?\
    \ The root of a balanced BST should be the middle element from the sorted array.\n\
    \nYou would pick the middle element from the sorted array in each iteration. You\
    \ then create a node in the tree initialized this element. After the element is\
    \ chosen, what is left? Could you identify the sub-problems within the problem?\n\
    \nThere are two arrays left – The one on its and the one on its right. These two\
    \ arrays are the sub-problems of the original problem, since both of them are\
    \ sorted. Furthermore, they are subtrees of the current node's left and right\
    \ child.\n\nThe code below creates a balanced BST from the sorted array in O(n)\
    \ time (n is the number of elements in the array). Compare how similar the code\
    \ is to a binary search algorithm. Both are using the divide and conquer methodology.\
    \ Because the input array could be subdivided in most log(n) times, the extra\
    \ stack space used by the recursion is in O(log n).\n\n```java\npublic TreeNode\
    \ sortedArrayToBST(int[] num) {\n  return sortedArrayToBST(num, 0, num.length-1);\n\
    }\n\nprivate TreeNode sortedArrayToBST(int[] arr, int start, int end) {\n  if\
    \ (start > end) return null;\n  int mid = (start + end) / 2;\n  TreeNode node\
