    # 9. Valid Number


    Code it now: https://oj.leetcode.com/problem/valid-number/


    Difficulty: Easy. Frequency: Low


    # Question:


    Validate if a given string is numeric.


    Some examples:


    +   - "0" \rightarrow true

    - "0.1" \rightarrow true

    - "abc" \rightarrow false


    # Example Questions Candidate Might Ask:


    +   - Q: How to account for whitespaces in the string?

    - A: When deciding if a string is numeric, ignore both leading and trailing whitespaces.

    - Q: Should I ignore spaces between numbers such as "1 1"?

    - A: No, only ignore leading and trailing whitespaces. "1 1" is not numeric.

    - Q: If the string contains additional characters after a number, is it considered
    valid?

    - A: If the string contains any non-numeric characters (excluding whitespaces
    and decimal point), it is not numeric.

    - Q: Is valid if a plus or minus sign appears before the number?

    - A: Yes, "+1" and "-1" are both numeric.

    - Q: Should I consider only decimal? How about other bases such as hexadecimal
    (0xFF)?

    - A: Only consider decimal numbers. "0xFF" is not numeric.

    - Q: Should I consider exponent as "1e10" as numeric?

    - A: No. But free to work on the challenge that takes exponent into consideration.
    The Online Judge problem does exponent into account.


    # Solution:


    This problem is very similar to Question [8. String to Integer (atoi)]. Due to
    corner cases, it is helpful to break the problem down to several components that
    can be solved individually.


    A string could be divided into these four substrings in the order from left to
    right:


    +   - s1. Leading whitespaces (optional).

    - s2. Plus (+) or minus (-) sign (optional).

    - s3. Number.

    - s4. Optional whitespaces (optional).


    We ignore $s1, s2, s4$ and evaluate whether $s3$ is a valid number. We realize
    that a number could either be a whole number or a decimal number. For a whole
    number, it is easy: We evaluate $s3$ contains only digits and we are done.'
