    https://leetcode.com/problems/longest-substring-without-repeating-characters/\n\
    \n## 题目：\n\n给定一个字符串，找到无重复字符的最长子串的长度。例如，对于“abcabcbb”，无重复字母的最长子串是“abc”，长度为 3。对于“bbbb”，最长子串是“b”，长度为\
    \ 1。\n\n## 解决方案：\n\nO(n) 运行时间，O(1) 空间复杂度 – 两次迭代：\n\n我们如何瞬间查找某个字符是否存在于子串中？答案是使用一个简单的表来存储出现过的字符。如果字符串包含\
    \ ‘a’–z’ 以外的字符，请确保与面试官沟通（例如：数字？大写字母？只包含 ASCII 字符？甚至是唯一的字符集？）。\n\n下一个问题是问自己，当你发现重复字符时会发生什么？例如，如果字符串是“abcd”，当你遇到第二个“c”时会发生什么？\n\
    \n当你发现一个重复字符时（假设在索引 j 处），意味着当前子串（当然不包括重复字符）是一个潜在的最大值，如果有必要，更新最大值。这也意味着重复字符必须在之前的索引\
    \ i 出现过，其中 i 小于 j。\n\n由于你知道所有从索引 i 之前或在该索引处开始的子串长度都小于你当前的最大值，你可以安全地从恰索引 i + 1\
    \ 处开始寻找下一个子串。\n\n因此，你需要两个索引来记录当前子串的头部和尾部。由于 i 和 j 都最多遍历 n 步，最坏情况是 2n 步，运行复杂度必须是\
    \ O(n)。\n\n注意空间复杂度是常数 O(1)，尽管我们分配了一个数组。这是因为无论字符串有多长，数组的大小始终保持为 256。\n\n```java\n\
    public int lengthOfLongestSubstring(String s) {\n    boolean[] exist = new boolean[256];\n\
    \    int i = 0, maxlen = 0;\n    for (int j = 0; j < s.length(); j++) {\n    \
    \    while (exist[s.charAt(j)]) {\n            exist[s.charAt(i)] = false;\n \
    \           i++;\n        }\n        exist[s.charAt(j)] = true;\n        maxlen\
    \ = Math.max(j - i + 1, maxlen);\n    }\n    return maxlen;\n}\n```\n\n如果字符集包含\
    \ ascii 之外的 unicode 怎么办？我们可以通过 Set 代替大小为 256 的布尔数组来修改上面的解决方案。\n\n## O(n) 运行时间，O(1)\
    \ 空间 – 单次：\n\n上面的解决方案最多 2n 步。事实上，它可以优化为只需要 n 步。与其使用表来判断字符是否存在，我们可以定义字符到其索引的映射。这样当发现重复字符时，我们可以立即跳过它。\n\
    \n```java\npublic int lengthOfLongestSubstring(String s) {\n    int[] charMap\
