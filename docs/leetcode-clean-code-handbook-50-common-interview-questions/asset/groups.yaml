    \ | 1 |\n| V | 5 |\n| X | 10 |\n| L | 50 |\n| C | 100 |\n| D | 500 |\n| M | 1000\
    \ |\n\nTable 2: Roman literals and its decimal representations.\n\nLet’s work\
    \ through some examples. Assume the input is “VII”, using the [additive notation],\
    \ we could simply add up each roman literal, ‘V’ + ‘I’ = 5 + 1 + 1 = 7,\n\nNow\
    \ let's look at another example “IV”. Now we need to use the [subtractive notation].\
    \ We first look at ‘I’, and add 1 to it. Then we look at ‘V’ and since a smaller\
    \ roman literal ‘I’ appears before it, we need to subtract ‘I’ from ‘V’. Remember\
    \ that we already added another ‘I’ before it, so we need to subtract a total\
    \ of two one’s from it.\n\nBelow is a more complex example that involves both\
    \ additive and subtractive notation: “MXCVI”.\n\n| Roman literals from left to\
    \ right | Accumulated total |\n| :--- | :--- |\n| M | 1000 |\n| MX | 1000 + 10\
    \ = 1010 |\n| MXC | 1010 + (100 – 2 * 10) = 1010 + 80 = 1090 |\n| MCV | 1090 +\
    \ 5 = 1095 |\n| MXCVI | 1095 + 1 = 1096 |\n\nTable 3: Step by step calculation\
    \ of roman number \"MXCVI”.\n\n```java\nprivate Map<Character, Integer> map =\n\
    \    new HashMap<Character, Integer>() {{\n        put('I', 1); put('V', 5); put('X',\
    \ 10);\n        put('L', 50); put('C', 100); put('D', 500);\n        put('M',\
    \ 1000);\n    }};\n\npublic int romanToInt(String s) {\n    int prev = 0, total\
    \ = 0;\n    for (char c : s.toCharArray()) {\n        int curr = map.get(c);\n\
    \        total += (curr > prev) ? (curr - 2 * prev) : curr;\n        prev = curr;\n\
    \    }\n    return total;\n}\n```\n\n# 38. Clone graph\n\nCode now: https://oj.leetcode.com/problems/clone-graph/\
    \ Difficulty: Medium, Frequency: Medium\n\n# Question:\n\nClone an undirected\
    \ graph. Each node in the graph contains a label and a list of its neighbors.\n\
    \n# Solution:\n\nThere are two main ways to traverse a graph: *breadth-first*\
    \ or *depth-first*. Let's try the depth-first approach, which is a recursion algorithm.\
    \ We will then look at the breadth-first approach, which is an iterative algorithm\
    \ that uses a queue.\n\n# O(n) runtime, O(n) space – Depth-first traversal:\n\n\
    A graph is simply represented by a graph node that serves as its starting point.\
    \ In fact, the starting point could be any other graph nodes and it does not affect\
    \ the cloning algorithm.\n\nAs each of its neighbors is a graph too, we could\
    \ recursively clone each of its neighbors and assign it to each neighbor of the\
    \ cloned node. We can easily see that it is doing a depth-first traversal of each\
    \ node.\n\nNote that the graph could contain cycles, for a node could have a neighbor\
    \ that points back to it. Therefore, we should use a map that records each node's\
    \ copy to avoid infinite recursion.\n\n```java\npublic UndirectedGraphNode cloneGraph(UndirectedGraphNode\
    \ graph) {\n    if (graph == null) return null;\n    Map<UndirectedGraphNode,\
    \ UndirectedGraphNode> map = new HashMap<>();\n    return DFS(graph, map);\n}\n\
    ```\n\n```java\nprivate UndirectedGraphNode DFS(UndirectedGraphNode graph, Map<UndirectedGraphNode,\
    \ UndirectedGraphNode> map) {\n    if (map.containsKey(graph)) {\n        return\
    \ map.get(graph);\n    }\n    UndirectedGraphNode graphCopy = new UndirectedGraphNode(graph.label);\n\
    \    map.put(graph, graphCopy);\n    for (UndirectedGraphNode neighbor : graph.neighbors)\
    \ {\n        graphCopy.neighbors.add(DFS(neighbor, map));\n    }\n    return graphCopy;\n\
    }\n```\n\n# O(n) runtime, O(n) space – Breadth-first traversal:\n\nHow does the\
    \ breadth-first traversal works? Easy, as we pop a node off the queue, we copy\
    \ each of its neighbors, and push them to the queue.\n\nA straight forward breadth-first\
    \ traversal seemed to work. But some details are still missing. For example, how\
    \ do we connect the nodes of the cloned graph?\n\nThe fact that B can traverse\
    \ back to A implies that the graph may contain a cycle. You must take extra care\
    \ to handle this case or your code could have an infinite loop.\n\nLet's analyze\
    \ this further by using the below example:\n\n![](img/172f5d3119b965fe8cc5a0f5bec9a730.png)\
    \ Figure 4: A simple graph\n\nAssume that the starting point of graph is A. First,\
    \ you make a copy of node A (A2), and found that A has one neighbor B. You make\
    \ a copy of B (B2) and connect A2→B as A2's neighbor. Next, you find that B has\
    \ neighbor, which you have already made a copy of. Here, need to be careful not\
    \ to make a copy of A, but to connect B2→A using A2's neighbor. But, how do we\
    \ know if a node has been copied?\n\nEasy, we could use a hash table! As we copy\
    \ a node, we insert it into the table. If we find that one of node's neighbors\
    \ is already in the table, we do not make a copy of. Instead, the hash table would\
    \ need to store a map of key-value pairs where the key is the node in the original\
    \ graph and the value is the node's copy.\n\n```java\npublic UndirectedGraphNode\
    \ cloneGraph(UndirectedGraphNode graph) {\n    if (graph == null) return null;\n\
    \    Map<UndirectedGraphNode, UndirectedGraphNode> map = new HashMap<>();\n  \
