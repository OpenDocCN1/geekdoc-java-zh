- md: "\n# Chapter 9: Binary Search\n\n## 48. Search Insert Position\n\nCode it now:\
    \ https://leetcode.com/problems/search-insert-position/ Difficulty: Medium, Frequency:\
    \ Low\n\n# Question:\n\nGiven a sorted array and a target value, return the index\
    \ if the target is found. If not, return the index where it would be if it were\
    \ inserted in order.\n\nYou may assume no duplicates in the array.\n\nHere are\
    \ few examples.\n\n- [1,3,5,6], 5 → 2\n- [1,3,5,6], 2 → 1\n- [1,3,5,6], 7 → 4\n\
    - [1,3,5,6], 0 → 0\n\n# Solution:\n\nThis problem is a direct application of Binary\
    \ Search, as you can spot it easily by the keywords *sorting* and *finding* target.\
    \ The requirements seem complex, but let's first start with something we're already\
    \ familiar with – The raw binary search algorithm.\n\nLet's start with defining\
    \ two variables, $L$ and $R$ representing its lowest and highest inclusive indices\
    \ that are searched, which are initialized to 0 and $n-1$ respectively.\n\n```\n\
    int L = 0, R = A.length - 1;\nwhile (L < R) {\n    int M = (L + R) / 2;\n    //\
    \ TODO: Implement conditional checks.\n}\n```\n\nCode 1: Getting started with\
    \ a Binary Search template.\n\nNow, the key part of binary search – Look at the\
    \ middle element, and ask: “Is the middle element smaller than the target element?”\
    \ If this is true, then it means all elements from $L$ up to $M$ inclusive could\
    \ be excluded from the search. Otherwise, the middle element is greater or equal\
    \ to the target element and that means all elements from $M+1$ up to $R$ could\
    \ be excluded.\n\n```\nint L = 0, R = A.length - 1;\nwhile (L < R) {\n  int M\
    \ = (L + R) / 2;\n  if (A[M] < target) {\n    L = M + 1;\n  } else {\n    R =\
    \ M;\n  }\n}\n```\n\nCode 2: Filling out the key part of the Binary Search algorithm.\n\
    \nA good thing to verify your binary search does not stuck in an infinite loop\
    \ is to test with input containing two elements, e.g., [1,3] and test with target\
    \ = 0 and 1. Here, our binary search works properly, but if we were to define\
    \ M as the upper middle, that is: M = (L+R+1)/2, then it would be stuck in an\
    \ infinite loop.\n\nWe've now reached the final step. While the loop ends, L must\
    \ be equal to R and it is a valid index. Obviously, if A[L] is equal to target,\
    \ we return L. If A[L] is greater than target, that means we are inserting target\
    \ before A[L], so we return L. If A[L] is less than target, that means we insert\
    \ target after A[L], so we return L + 1.\n\n```java\npublic int searchInsert(int[]\
    \ A, int target) {\n  int L = 0, R = A.length - 1;\n  while (L < R) {\n    int\
    \ M = (L + R) / 2;\n    if (A[M] < target) {\n      L = M + 1;\n    } else {\n\
    \      R = M;\n    }\n  }\n  return (A[L] < target) ? L + 1 : L;\n}\n```\n\n##\
    \ 49. Find Minimum in Sorted Rotated Array\n\nCode it now: https://oj.leetcode.com/problems/find-minimum-in-rotated-sorted-array/\
    \ Difficulty: Medium, Frequency: High\n\n# Question:\n\nSuppose a sorted array\
    \ is rotated at some pivot unknown to beforehand. (i.e., 0 1 2 3 4 5 6 7 might\
    \ become 4 5 6 7 0 1 2).\nFind the minimum element.\n\nYou may assume no duplicate\
    \ exists in the array.\n\n# Solution:\n\nThe minimum is at $A_L$ where $A_{L-1}\
    \ > A_L$. Notice that if we subdivide the array into two, one will always be sorted,\
    \ while the other contains the minimum.\n\n![](img/172f5d31191b965fe8ccb5a0f5becd9a_97_0.png)\n\
    \nWe have an array [1,2,3,4,5,6,7] (See graph 1) which was rotated 3 steps to\
    \ the right [5,6,7,1,2,3,4] (See graph 2). Let's say we subdivide the array at\
    \ point $k$ to two subarrays $[A_L, A_{L+1}, \\dots, A_k]$. $[A_{k+1} \\dots A_R]$.\n\
    \nIf the array is not rotated, then $A_L < A_R$ we can return $A_L$ as the minimum\
    \ immediately.\n\nOtherwise for a sorted array that was rotated at least one step,\
    \ $A_L$ must always be greater than $A_R$.\n\nLet's choose $M_1$ as the dividing\
    \ point. Since $A_{M1} > A_R$, we know that each element in $[A_L \\dots AM_1]$\
    \ is greater than $A_R$. On the other hand, let's assume we choose $M_2$ as the\
    \ dividing point. Since $A_{M2} \\le A_R$, we know that each element in $[A_{M2+1}\
    \ \\dots A_R]$ is greater than $A_R$.\n\nTo understand the correct terminating\
    \ condition, we look at two elements. Let us choose the lower median as M = (L\
    \ + R) / 2. There are two cases for two elements:\n\n- A = [1,2]\n- B = [2,1]\n\
    \nFor A, 1 < 2 => A_M < A_R, and therefore it will set R = M = 0.\nFor B, 2 >\
    \ 1 => A_M > A_R, and therefore it will set L = M + 1 = 1.\n\nTherefore, it is\
    \ clear that when L == R, we have found the minimum.\n\n```java\npublic int findMin(int\
    \ A[]) {\n    int L = 0, R = A.length - 1;\n    while (L < R && A[L] >= A[R])\
    \ {\n        int M = (L + R) / 2;\n        if (A[M] > A[R]) {\n            L =\
    \ M + 1;\n        } else {\n            R = M;\n        }\n    }\n    return A[L];\n\
    }\n```\n\n## 50. Find Minimum in Rotated Array II – with duplicates\n\nCode it\
    \ now: https://oj.leetcode.com/problems/find-minimum-in-rotated-sorted-array/\
    \ Difficulty: Hard, Frequency: Medium\n\n# Question:\n\nIf the rotated array could\
    \ contain duplicates? Is your algorithm still O(log n)?\n\n# Solution:\n\nFor\
    \ case where A_L == A_M == A_R, the minimum could be on A_M’s left or right side\
    \ (eg. [1, 1, 1, 0, 1] or [1, 0, 1, 1, 1]). In this case, we could not discard\
    \ either subarrays and therefore sort worst case degenerates to the O(n).\n\n\
    ```java\npublic int findMin(int[] A) {\n    int L = 0, R = A.length - 1;\n   \
    \ while (L < R && A[L] <= A[R]) {\n        int M = (L + R) / 2;\n    if (A[M]\
    \ > A[R]) {\n            L = M + 1;\n        } else if (A[M] < A[L]) {\n     \
    \       R = M;\n        } else { // A[L] == A[M] == A[R]\n            L = L +\
    \ 1;\n        }\n    }\n    return A[L];\n}\n```\n"
  mdcn: "\n\n# 第9章：二分查找\n\n## 48. 搜索插入位置\n\n现在编写代码：https://leetcode.com/problems/search-insert-position/\
    \ 难度：中等，频率：低\n\n# 题目：\n\n给定一个升序数组和一个目标值，如果找到目标值，则返回它的索引。如果没有找到，则返回它按序插入后应所在的索引。\n\
