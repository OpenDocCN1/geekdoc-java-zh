    \n以下是将单链表转换为平衡 BST 的代码。请注意，该算法要求在函数参数中传递列表的长度。可以通过遍历整个列表在 $O(n)$ 时间内找到列表长度。递归调用按照列表顺序遍历列表并创建树节点，也需要\
