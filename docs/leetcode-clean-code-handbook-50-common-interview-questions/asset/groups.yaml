- md: "\n# Chapter 3: Linked List\n\n## 20. Merge Two Sorted Lists\n\nCode it now:\
    \ https://oj.leetcode.com/problems/merge-two-sorted-lists/ Difficulty: Easy, Frequency:\
    \ Medium\n\n**Question:**\n\nMerge two sorted linked lists and return it as a\
    \ new list. The new list should be made by splicing together the nodes of the\
    \ first two lists.\n\n**Solution:**\n\nWe insert a dummy head before the new list\
    \ so we don't have to deal with special cases as initializing the new list's head.\
    \ Then the new list's head could just easily be returned as dummy head's next.\n\
    \nUsing dummy head allows you to write simpler code and adds a powerful tool to\
    \ your interview arsenal. To see more examples of dummy head usage, please see\
    \ these questions: [21. Add Two Numbers], [22. Swap Nodes in Pairs], and [23.\
    \ Merge K Sorted Linked Lists].\n\n```java\npublic ListNode mergeTwoLists(ListNode\
    \ l1, ListNode l2) {\n    ListNode dummyHead = new ListNode();\n    ListNode p\
    \ = dummyHead;\n    while (l1 != null && l2 != null) {\n        if (l1.val < l2.val)\
    \ {\n            p.next = l1;\n            l1 = l1.next;\n        } else {\n \
    \           p.next = l2;\n            l2 = l2.next;\n        }\n        p = p.next;\n\
    \    }\n    if (l1 != null) p.next = l1;\n    if (l2 != null) p.next = l2;\n \
    \   return dummyHead.next;\n}\n```\n\n## 21. Add Two Numbers\n\nCode it now: https://oj.leetcode.com/problems/add-two-numbers/\
    \ Difficulty: Medium, Frequency: High\n\n**Question:**\n\nYou are given linked\
    \ lists representing two non-negative numbers. The digits are stored in reverse\
    \ order and each of their nodes contains a single digit. Add the two numbers and\
    \ return it as a linked list.\n\nInput: (2 → 4 → 3) + (5 → 6 → 4)\n\nOutput: 7\
    \ → 0 → 8\n\n**Solution:**\n\nKeep track of the carry using a variable and simulate\
    \ digits-by-digits sum from the head of list, which contains the least-significant\
    \ digit.\n\nTake extra caution of the following cases:\n\n- When one list is longer\
    \ than the other.\n- The sum could have an extra carry at the end at the end,\
    \ which is easy to forget. (e.g., (9 → 9) + (1) = (0 → 0 → 1))\n\n```java\npublic\
    \ ListNode addTwoNumbers(ListNode l1, ListNode l2) {\n    ListNode dummyHead =\
    \ new ListNode();\n    ListNode p = l1, q = l2, curr = dummyHead;\n    int carry\
    \ = 0;\n    while (p != null || q != null) {\n        int x = (p != null) ? p.val\
    \ : 0;\n        int y = (q != null) ? q.val : 0;\n        int digit = carry +\
    \ x + y;\n        carry = digit / 10;\n        curr.next = new ListNode(digit\
    \ % 10);\n        curr = curr.next;\n        if (p != null) p = p.next;\n    \
    \    if (q != null) q = q.next;\n    }\n    if (carry > 0) {\n        curr.next\
    \ = new ListNode(carry);\n    }\n    return dummyHead.next;\n}\n```\n\n## 22.\
    \ Swap Nodes in Pairs\n\nCode it now: https://oj.leetcode.com/problems/swap-nodes-in-pairs/\
    \ Difficulty: Medium, Frequency: Medium\n\n**Question:**\n\nGiven a linked list,\
    \ swap every two adjacent nodes and return its head.\n\nFor example,\n\nGiven\
    \ 1 → 2 → 3 → 4, you should return the list as 2 → 1 → 4 → 3.\n\nYour algorithm\
    \ should use only constant space. You may not modify the values in the list, only\
    \ nodes itself can be changed.\n\n**Example Candidates Might Ask:**\n\n- Q: What\
    \ if the number of nodes in the linked list has only odd number of nodes?\nA:\
    \ The last node should not be swapped.\n\n**Solution:**\n\nLet’s assume $p, q,\
    \ r$ are the current, next, and next’s next node.\n\nWe could swap the nodes pairwise\
    \ by adjusting where it’s pointing next:\n$q.next = p$; $p.next = r$;\n\nThe above\
    \ operations transform the list from $\\{ p \\rightarrow q \\rightarrow r \\rightarrow\
    \ s \\}$ to $\\{ q \\rightarrow p \\rightarrow r \\rightarrow s \\}$.\n\nIf the\
    \ next pair of nodes exists, we should remember to connect $p$'s next to $s$.\
    \ Therefore, we should record the current node before advancing to the next pair\
    \ of nodes.\n\nTo determine the new list’s head, you should look if the list contains\
    \ two or more elements. Basically, these extra statements could be avoided by\
    \ inserting an extra node (also known as the dummy head) to the front of the list.\n\
    \n```java\npublic ListNode swapPairs(ListNode head) {\n    ListNode dummy = new\
    \ ListNode(0);\n    dummy.next = head;\n    ListNode p = head;\n    ListNode prev\
    \ = dummy;\n    while (p != null && p.next != null) {\n        ListNode q = p.next,\
    \ r = p.next.next;\n        prev.next = q;\n        q.next = p;\n        p.next\
    \ = r;\n        prev = q;\n        p = r;\n    }\n    return dummy.next;\n}\n\
    ```\n\n## 23. Merge K Sorted Lists\n\nCode it now: https://oj.leetcode.com/problems/merge-sorted-lists/\
    \ Difficulty: Hard, Frequency: High\n\n**Question:**\n\nMerge sorted linked lists\
    \ and return it as one sorted list. Analyze its complexity.\n\n**Solution:**\n\
    \n- $O(nk^2)$ runtime, $O(1)$ space — Brute force: The brute force approach is\
    \ to merge list by one. For example, if lists = $[l1, l2, l3, l4]$, then merge\
    \ $l1$ and $l2$, then merge the result with $l3$, and finally $l4$. To analyze\
    \ its time complexity, we are going to assume a total of $k$ lists, and each list\
    \ is of size $n$. There will be total of $k-1$ merge operations. The first merge\
    \ operation will be two lists of size $n$, therefore in worst case there could\
    \ be $n$ comparisons. The second merge operation will be two lists of size $2n$\
    \ and $n$. Notice that each merge operation increase the size of merged lists\
    \ by $n$. Therefore, the total number of comparisons is $2n + 3n + 4n + \\dots\
    \ + kn = n\\frac{k+1)}{2} - 1 = O(nk^2)$.\n\n- $O(nk \\log k)$ runtime, $O(k)$\
    \ space — Heap: We could use a heap of size $k$. The heap is first initialized\
    \ with smallest element from each list. Then as we extract nodes from the heap,\
    \ we must remember to insert its next node into the heap. As each insert into\
    \ the heap costs $\\log k$ and there are total of $nk$ elements, the total runtime\
    \ is $O(nk \\log k)$. Ignoring the extra space used to store output list, we only\
    \ use extra space of $O(k)$ due to heap.\n\n```java\nprivate static final Comparator<ListNode>\
    \ listComparator = new Comparator<ListNode>() {\n    @Override\n    public int\
    \ compare(ListNode x, ListNode y) {\n        return x.val - y.val;\n    }\n};\n\
    \npublic ListNode mergeLists(List<ListNode> lists) {\n    if (lists.isEmpty())\
    \ return null;\n    PriorityQueue<ListNode> queue = new PriorityQueue<>(lists.size(),\
    \ listComparator);\n    for (ListNode node : lists) {\n        if (node != null)\
    \ {\n            queue.add(node);\n        }\n    }\n    ListNode dummyHead =\
    \ new ListNode(0);\n    ListNode p = dummyHead;\n    while (!queue.isEmpty())\
    \ {\n        ListNode node = queue.poll();\n        p.next = node;\n        p\
    \ = p.next;\n        if (node.next != null) {\n            queue.add(node.next);\n\
    \        }\n    }\n    return dummyHead.next;\n}\n```\n\n- $O(n \\log k)$ time,\
    \ $O(1)$ space – Divide and conquer using two way merge: If you still remember\
    \ how merge sort works, we can use a divide and conquer mechanism to solve this\
    \ problem. Here, we apply merge lists algorithm from [20. Merge Sorted Lists].\
    \ Basically, the algorithm merges two lists at a time, so the number of lists\
    \ reduces from:\n$k \\rightarrow \\frac{k}{2} \\rightarrow \\frac{k}{4} \\rightarrow\
    \ \\dots \\rightarrow 2 \\rightarrow 1$\n\nSimilarly, the size of the lists increases\
    \ (Note that the lists could subdivide at most $\\log k$ times):\n$n \\rightarrow\
    \ 2n \\rightarrow 4n \\rightarrow \\dots \\rightarrow 2^{\\log k}n$\n\nTherefore\
    \ the runtime complexity is:\n$k \\cdot \\frac{k}{2} \\cdot 2n + \\frac{k}{4}\
    \ \\cdot 4n + \\dots + 2^{\\log k} \\cdot 1$\n$= nk + nk + \\dots + nk$\n$= nk\
    \ \\log k$\n\nSince we are implementing this divide and conquer algorithm iteratively,\
    \ the space complexity is constant at $O(1)$, yay!\n\n```java\npublic ListNode\
    \ mergeKLists(List<ListNode> lists) {\n    if (lists.isEmpty()) return null;\n\
    \    int end = lists.size() - 1;\n    while (end > 0) {\n        int begin = 0;\n\
    \        while (begin < end) {\n            lists.set(begin, merge2Lists(lists.get(begin),\
    \ lists.get(end)));\n            begin++;\n        }\n        end--;\n    }\n\
    \    return lists.get(0);\n}\n\nprivate ListNode merge2Lists(ListNode l1, ListNode\
    \ l2) {\n    ListNode dummyHead = new ListNode(0);\n    ListNode p = dummyHead;\n\
    \    while (l1 != null && l2 != null) {\n        if (l1.val < l2.val) {\n    \
    \        p.next = l1;\n            l1 = l1.next;\n        } else {\n         \
    \   p.next = l2;\n            l2 = l2.next;\n        }\n        p = p.next;\n\
    \    }\n    if (l1 != null) p.next = l1;\n    if (l2 != null) p.next = l2;\n \
    \   return dummyHead.next;\n}\n```\n"
  mdcn: "\n\n# 第3 章：链表\n\n## 20. 合并两个有序链表\n\n现在编写代码：https://oj.leetcode.com/problems/merge-two-sorted-lists/\
    \ 难度：简单，频率：中等\n\n**题目描述：**\n\n合并两个有序链表并返回一个新的新列表。新列表应通过拼接前两个列表的节点来形成。\n\n**解决方案：**\n\
    \n我们在新列表之前插入一个虚拟头节点（dummy head），这样我们就不需要处理初始化新列表头部的特殊情况。然后，新列表的头部就可以轻松地作为虚拟头节点的下一个节点返回。\n\
    \n使用虚拟头可以让你写出更简洁的代码，并为你的面试兵库增添一个强大的工具。要查看更多关于虚拟头使用的示例，请参考这些题目：[21. 两个数字相加]、[22.\
    \ 两交换交换] 和 [23. 合并 K 个有序链表]。\n\n```java\npublic ListNode mergeTwoLists(ListNode\
    \ l1, ListNode l2) {\n    ListNode dummyHead = new ListNode();\n    ListNode p\
    \ = dummyHead;\n    while (l1 != null && l2 != null) {\n        if (l1.val < l2.val)\
    \ {\n            p.next = l1;\n            l1 = l1.next;\n        } else {\n \
    \           p.next = l2;\n            l2 = l2.next;\n        }\n        p = p.next;\n\
    \    }\n    if (l1 != null) p.next = l1;\n    if (l2 != null) p.next = l2;\n \
    \   return dummyHead.next;\n}\n```\n\n## 21. 两个数字相加\n\n现在编写代码：https://oj.leetcode.com/problems/add-two-numbers/\
    \ 难度：中等，频率：高\n\n**题目描述：**\n\n给你两个链表，表示两个非负数。数字以反序存储，且每个节点包含一个单独的数字。这两个数字相加，并以链表的形式返回。\n\
    \n输入：(2 → 4 → 3) + (5 → 6 → 4)\n\n输出：7 → 0 → 8\n\n**解决方案：**\n\n使用一个变量记录进位（carry），并从链表头部（包含最低位）开始模拟逐位相加。\n\
    \n需要特别注意以下情况：\n\n- 当一个列表比另一个列表长时。\n- 和在末尾可能会有一个额外的进位，这很容易被忘记。（例如：(9 → 9) + (1)\
    \ = (0 → 0 → 1)）。\n\n```java\npublic ListNode addTwoNumbers(ListNode l1, ListNode\
    \ l2) {\n    ListNode dummyHead = new ListNode();\n    ListNode p = l1, q = l2,\
    \ curr = dummyHead;\n    int carry = 0;\n    while (p != null || q != null) {\n\
    \        int x = (p != null) ? p.val : 0;\n        int y = (q != null) ? q.val\
    \ : 0;\n        int digit = carry + x + y;\n        carry = digit / 10;\n    \
    \    curr.next = new ListNode(digit % 10);\n        curr = curr.next;\n      \
    \  if (p != null) p = p.next;\n        if (q != null) q = q.next;\n    }\n   \
    \ if (carry > 0) {\n        curr.next = new ListNode(carry);\n    }\n    return\
    \ dummyHead.next;\n}\n```\n\n## 22. 两两交换节点\n\n现在编写代码：https://oj.leetcode.com/problems/swap-nodes-in-pairs/\
    \ 难度：中等，频率：中等\n\n**题目描述：**\n\n给定一个链表，交换每两个相邻节点并返回它的头部。\n\n例如，\n\n给定 1 → 2 → 3\
    \ → 4，你应该返回列表 2 → 1 → 4 → 3。\n\n你的算法应该只使用常数额外空间。你不能修改列表中的值，只能改变节点本身。\n\n**面试候选者可能会问的问题：**\n\
    \n- Q：如果链表中的节点数是奇数怎么办？\nA: 最后一个节点不应该被交换。\n\n**解决方案：**\n\n假设 $p, q, r$ 分别是当前节点、下一个节点以及下下一个节点。\n\
    \n我们可以通过调整它们的指向来两两对地交换节点：\n$q.next = p$; $p.next = r$;\n\n上述操作将列表从 $\\{ p \\rightarrow\
    \ q \\rightarrow r \\rightarrow s \\}$ 转换到 $\\{ q \\rightarrow p \\rightarrow\
    \ r \\rightarrow s \\}$。\n\n如果下一对节点存在，我们应该记住将 $p$ 的下一个节点连接到 $s$。因此，在移动下一对节点之前，我们应该记录当前节点。\n\
    \n为了确定新列表的头部，你应该检查列表是否包含两个或多个元素。基本上，这些额外的语句可以通过在列表前端插入一个额外的节点（也称为虚拟头）来避免。\n\n\
    ```java\npublic ListNode swapPairs(ListNode head) {\n    ListNode dummy = new\
    \ ListNode(0);\n    dummy.next = head;\n    ListNode p = head;\n    ListNode prev\
    \ = dummy;\n    while (p != null && p.next != null) {\n        ListNode q = p.next,\
    \ r = p.next.next;\n        prev.next = q;\n        q.next = p;\n        p.next\
    \ = r;\n        prev = q;\n        p = r;\n    }\n    return dummy.next;\n}\n\
    ```\n\n## 23. 合并 K 个有序链表\n\n现在编写代码：https://oj.leetcode.com/problems/merge-k-sorted-lists/\
    \ 难度：困难，频率：高\n\n**题目描述：**\n\n给定一组有序的链表，将它们合并成一个排序后的有序链表。\n\n**解决方案：**\n\n- $O(n^2)$\
    \ 时间复杂度，$O(1)$ 空间 —— 暴力法：\n遍历所有链表，找到最小节点并取出。\n\n- $O(n \\log k)$ 时间复杂度，$O(1)$\
    \ 空间 —— 分治法：\n每次两两合并链表，直到剩下一个。\n\n- $O(n \\log k)$ 时间复杂度，$O(k)$ 空间 —— 堆排序：\n使用一个最小顶堆来维护所有链表的头部。\n\
    \n"
