    \ Repeating Characters\n\nCode it now: Difficulty: Medium, Frequency: Medium\n\
    https://leetcode.com/problems/longest-substring-without-repeating-characters/\n\
    \n## Question:\n\nGiven a string, find the length of the longest substring without\
    \ repeating characters. For example, the longest substring without repeating letters\
    \ for “abcabcbb” is “abc”, which the longest substring is 3. For “bbbb” the longest\
    \ substring is “b”, with the length of 1.\n\n## Solution:\n\nO(n) runtime, O(1)\
    \ space – Two iterations:\n\nHow can we look up if a character exists in a substring\
    \ instantaneously? The answer is to use a simple table to store the characters\
    \ that have appeared. Make sure you communicate with your interviewer if the string\
    \ has characters other than ‘a’–z’, (ie, Digits? Upper case letter? Does it contain\
    \ ASCII characters only? Or even unique character sets?)\n\nThe next question\
    \ is to ask yourself what happens when you found a repeated character? For example,\
    \ if the string is “abcd”, what happens when you reach the second appearance of\
    \ “c”?\n\nWhen you have found a repeated character (let's say at index j), it\
    \ means the current substring (excluding the repeated character of course) is\
    \ a potential maximum, so update the maximum if necessary. It also means the repeated\
    \ character must have appeared before at an index i, where i is less than j.\n\
    \nSince you know that all substrings that start before or at index i would be\
    \ less than your current maximum, you can safely start to look for the next substring\
    \ with head starts exactly at index i + 1.\n\nTherefore, you will need two indices\
    \ to record the head and the tail of the current substring. Since i and j both\
    \ traverse at most n steps, the worst case would be 2n steps, which the runtime\
    \ complexity must be O(n).\n\nNote that the space complexity is constant O(1),\
    \ even though we are allocating an array. This is because no matter how long the\
    \ string is, the size of the array stays the same at 256.\n\n```java\npublic int\
    \ lengthOfLongestSubstring(String s) {\n    boolean[] exist = new boolean[256];\n\
    \    int i = 0, maxlen = 0;\n    for (int j = 0; j < s.length(); j++) {\n    \
    \    while (exist[s.charAt(j)]) {\n            exist[s.charAt(i)] = false;\n \
    \           i++;\n        }\n        exist[s.charAt(j)] = true;\n        maxlen\
    \ = Math.max(j - i + 1, maxlen);\n    }\n    return maxlen;\n}\n```\n\nWhat if\
    \ the character set contains unicode characters that is out of ascii? We could\
    \ modify the above solution by using a Set instead of a boolean array of size\
    \ 256.\n\n## O(n) runtime, O(1) space – Single iteration:\n\nThe above solution\
    \ requires at most 2n steps. In fact, it could be optimized to require only n\
    \ steps. Instead of using a table to tell if a character exists or not, we could\
    \ define a mapping of the characters to its index. Then we can skip the characters\
    \ immediately when found a repeated character.\n\n```java\npublic int lengthOfLongestSubstring(String\
    \ s) {\n    int[] charMap = new int[256];\n    Arrays.fill(charMap, -1);\n   \
    \ int i = 0, maxlen = 0;\n    for (int j = 0; j < s.length(); j++) {\n       \
    \ if (charMap[s.charAt(j)] >= i) {\n            i = charMap[s.charAt(j)] + 1;\n\
    \        }\n        charMap[s.charAt(j)] = j;\n        maxlen = Math.max(j - i\
    \ + 1, maxlen);\n    }\n    return maxlen;\n}\n```\n\n## 11. Longest Substring\
    \ with At Most Distinct Characters\n\nCode it now: Coming soon! Difficulty: Hard,\
    \ Frequency: N/A\n\n## Question:\n\nGiven a string $S$, find the length of the\
    \ longest substring $T$ that contains at most two characters. For example, given\
    \ $S = \"ceba\"$, $T = \"ece\"$ has length 3.\n\n## Solution:\n\nFirst, we could\
    \ simplify the problem by assuming that $S$ contains two or more distinct characters\
    \ which means $T$ must contain exactly two characters. The brute force approach\
    \ $O(n^2)$ where $n$ is the length of $S$. We can form every possible substring,\
    \ and for each substring insert all characters into a Set indicating the number\
    \ of distinct characters. This could be easily improved to $O(n)$ by reusing the\
    \ same Set. The trick is to maintain a sliding window that always satisfies the\
    \ invariant where there are at most two characters in it. When we add a new character\
    \ that breaks this invariant, how can we move the begin pointer to satisfy the\
    \ invariant? Using the above example, our first window is \"abba\". When we add\
    \ the character 'c' into the sliding window, it breaks the invariant. Therefore\
    \ we have to readjust the window to satisfy the invariant again. The question\
    \ is which starting point to choose so the invariant is satisfied. Let's look\
    \ at another example $S = \"abaac\"$. When we add 'c' to the window, the new sliding\
    \ window should be \"aac\". This method iterates $n$ times and therefore its runtime\
    \ complexity is $O(n)$. We use three pointers: $i$, $j$, and $k$.\n\n```java\n\
    public int longestSubstringTwoDistinct(String s) {\n    int i = 0, j = -1, maxLen\
    \ = 0;\n    for (int k = 0; k < s.length(); k++) {\n        if (s.charAt(k) ==\
    \ s.charAt(k - 1)) continue;\n        if (j > 0 && s.charAt(j) == s.charAt(k))\
    \ {\n            maxLen = Math.max(k - i, maxLen);\n            i = j + 1;\n \
    \       }\n        j = k - 1;\n    }\n    return Math.max(s.length() - i, maxLen);\n\
    }\n```\n\n## Further Thoughts:\n\nAlthough the above method works fine, it could\
    \ not be easily generalized to the case where $T$ contains at most $k$ distinct\
    \ characters. The key is when we adjust the sliding window to satisfy the invariant,\
    \ we need a counter of the number of times each character appears in the substring.\n\
    \n```java\npublic int lengthOfLongSubstringTwoDistinct(String s) {\n    int[]\
    \ count = new int[256];\n    int i = 0, numDistinct = 0, maxLen = 0;\n    for\
    \ (int j = 0; j < s.length(); j++) {\n        if (count[s.charAt(j)] == 0) numDistinct++;\n\
    \        count[s.charAt(j)]++;\n        while (numDistinct > 2) {\n          \
    \  count[s.charAt(i)]--;\n            if (count[s.charAt(i)] == 0) numDistinct--;\n\
    \            i++;\n        }\n        maxLen = Math.max(j - i + 1, maxLen);\n\
    \    }\n    return maxLen;\n}\n```\n\n## 12. Missing Ranges\n\nCode it now: Coming\
    \ soon! Difficulty: Medium, Frequency: N/A\n\n## Question:\n\nGiven a sorted integer\
    \ array where the range of elements are [0, 99] inclusive, return its missing\
    \ ranges. For example, given [0, 1, 3, 50, 75], return [\"2->49\", \"51->74\"\
    , \"76->99\"]\n\n## Example Questions Might Ask:\n\n- Q: What if the given range\
    \ is empty?\nA: Then you should return \"0->99\" as those ranges are missing.\n\
    - Q: What if the given range contains all elements from the ranges?\nA: Return\
    \ an empty list, which no range is missing.\n\n## Solution:\n\nCompare the gap\
    \ between two neighbor elements and output its range, simple as that? This seems\
    \ deceptively easy, except there are multiple edge cases to consider, such as\
    \ the first and last element, which does not have previous and next element respectively.\
    \ Also, what happens when the given range is empty? We should output the range\
    \ \"0->99\".As it turns out, if we could add two \"artificial\" elements, -1 before\
    \ the first element and 100 after the last element, we could avoid all the above\
    \ pesky cases.\n\n## Further Thoughts:\n\n- i. List out test cases.\n- i. You\
    \ should be able to extend the above cases not only for the range [0, 99], but\
    \ any arbitrary range [start, end].\n\n```java\npublic List<String> findMissingRanges(int[]\
    \ vals, int start, int end) {\n    List<String> ranges = new ArrayList<>();\n\
    \    int prev = start - 1;\n    for (int i = 0; i <= vals.length; i++) {\n   \
    \     int curr = (i == vals.length) ? end + 1 : vals[i];\n        if (curr - prev\
    \ > 1) {\n            ranges.add(getRange(prev + 1, curr - 1));\n        }\n \
    \       prev = curr;\n    }\n    return ranges;\n}\n```\n\n```java\nprivate String\
    \ getRange(int from, int to) {\n    return (from == to) ? String.valueOf(from)\
    \ : from + \"->\" + to;\n}\n```\n"
