    \ 'c' to the window, the new sliding window should be \"aac\"\n\nThis method iterates\
    \ $n$ times and therefore its runtime complexity is $O(n)$. We use three pointers:\
    \ $i$, $j$, and $k$.\n\n```\npublic int longestOfSubstringTwoDistinct(String s)\
