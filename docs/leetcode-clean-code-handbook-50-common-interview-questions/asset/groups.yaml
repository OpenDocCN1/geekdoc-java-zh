    \ = 0 和 1。在这里，我们的二分查找工作正常，但如果我们把 M 定义为上中间，即：M = (L+R+1)/2，那么它就会陷入无限循环。\n\n我们现在到了最后一步。当循环结束时，L\
    \ 必须等于 R，且它是一个有效的索引。显然，如果 A[L] 等于目标值，我们返回 L。如果 A[L] 大于目标值，意味着我们在 A[L] 之前插入目标值，因此返回\
    \ L。如果 A[L] 小于目标值，意味着我们在 A[L] 之后插入目标值，因此返回 L + 1。\n\n```java\npublic int searchInsert(int[]\
