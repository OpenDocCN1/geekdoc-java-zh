  md: "# 19. Palindrome Number\n\nCode it now: https://oj.leetcode.com/problems/palindrome-number/\
    \ Difficulty: Easy, Frequency: Medium\n\n# Question:\n\nDetermine whether an integer\
    \ is a palindrome. Do this without extra space.\n\nExample Questions Might Ask:\n\
    \n+   - Q: Does negative integer as -1 qualify as a palindrome?\n- A: For the\
    \ purpose of discussion here we define negative integers as non-palindrome.\n\n\
    # Solution:\n\nThe most intuitive approach is to first represent the integer as\
    \ a string, since it is more convenient to manipulate. Although this dearly works,\
    \ it violates the restriction of not using extra space. (ie. you have to allocate\
    \ n characters to store the reversed integer as string, where n is the maximum\
    \ number of digits). I know, this sound like an unreasonable requirement (since\
    \ it uses so little space), don't most interview problems have requirements?\n\
    \nAnother approach is to first reverse the number. If the number is the same as\
    \ its reversed, then it must be a palindrome. You could reverse a number by doing\
    \ the following:\n\n```\npublic int reverse(int num) {\n    assert num >= 0; //\
    \ for non-negative integers only.\n    int rev = 0;\n    while (num != 0) {\n\
    \        rev = rev * 10 + num % 10;\n        num /= 10;\n    }\n    return rev;\n\
    }\n```\n\nThis seemed to work, but did you consider the possibility that the reversed\
    \ number might overflow? If it overflows, the behavior is language specific (For\
    \ Java the number wraps around on overflow, but in C/C++ its behavior is undefined).\
    \ Yuck.\n\nOf course, we could avoid overflow by returning a type that has larger\
    \ size than int (int, long). However, note that this is language specific, and\
    \ the larger type might not be available on all languages.\n\nWe could construct\
    \ a better and more generic solution. One pointer is that we must start comparing\
    \ the digits somewhere. And you know there could only be two ways, expand from\
    \ the middle or compare the two twos.\n\nIt turns out that comparing from the\
    \ two ends is easier. First, compare the first and last digit. If they are not\
    \ the same, it must not be a palindrome. If they are the same, chop off one digit\
    \ from both ends and continue until you have no digits left, which you conclude\
    \ that must be a palindrome."
