  md: '# O(n²) runtime, O(n) space – Dynamic programming:


    To improve the brute force solution from a DP approach, first think how we can
    avoid unnecessary re-computation in validating palindromes. Consider the case
    “ababa”. If we already know that “bab” is a palindrome, it is obvious that “ababa”
    must be a palindrome since the left and right end letters are the same.


    Stated more formally below:


    Define P[i, j ] ← true if the substring S Si ... Sj is a palindrome, otherwise
    false.


    Therefore,


    ```

    P[ i, j ] ← ( P[ i+1, j-1 ] and Si = Sj )

    ```


    The base cases are:


    ```

    P[ i, i ] ← true

    ```


    ```

    P[ i, i+1 ] ← ( Si = Si+1 )

    ```


    This yields a straight forward DP solution, which we first initialize the one
    and two letters palindromes, and work our way up finding all three letters palindromes,
    and so on...


    This gives us a runtime complexity of O(n²) and uses O(n²) space to store the
    table.


    # Additional exercise:


    Could you improve the space complexity further and how?'
