  md: '# 24. Copy List with Random Pointer


    Code it now: https://oj.leetcode.com/problems/copy-list-with-random-pointer/  Difficulty:
    Hard, Frequency: High


    # Question:


    A linked list is given such that each node contains an additional random pointer
    that could point to any node in the list or null.

    Return a deep copy of the list.


    # Solution:


    Cloning a linked list without an additional random pointer is easy to solve. The
    trickier part however, is to clone the linked list node structure.


    ![](img/172f5d31191b965fe8ccb5a0f5becd9a_43_0.png)


    $O(n^2)$ runtime, $O(n)$ space – Brute force:


    To get started, it is helpful to label each individual node with an index. According
    to the above list, node 0''s random points to node 1, node 1''s random points
    to node 0, and node 2''s random points to itself, node 2.


    We could rebuild the structure assume we have the above connections. As we know
    that node 0 random points to node 1, we need to connect the cloned version from
    node 0'' to node 1''. We would have to iterate over the list each time to link
    the nodes and it takes $O(n)$, making the overall complexity $O(n^2)$.


    How do we represent the connection? We can build a map that maps the original
    node to its indices. Having this map will allow us to clone the structure. If
    we have that, we just have to connect them, right? The only issue is connecting
    them $O(n)$ complexity, because we have to traverse the cloned list to find the
    node connect.


    # $O(n)$ runtime, $O(n)$ space – Hash table:


    It is natural to use a mapping so that we can quickly lookup the node to connect.
    We can easily build the map of indices of cloned nodes. Therefore, we have reduced
    the complexity to $O(1)$ when connecting the random nodes.


    This got us started, although it requires two maps. On closer inspection, it turns
    out that the two maps could be shortened into one single map. We just need to
    map the original node to its random node directly.'
