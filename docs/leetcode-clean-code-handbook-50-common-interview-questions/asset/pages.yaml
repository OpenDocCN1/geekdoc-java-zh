  md: "We make a first pass over S and T concurrently and stop at the first non-matching\
    \ character between S and T.\n\n+   1. If S matches all characters in T, then\
    \ check if there is an extra character at the end of T. (Modify operation)\n\n\
    +   2. If |n - m|==1, that means we must skip this non-matching character only\
    \ in T and make sure the remaining characters between S and T are exactly matching.\
    \ (Insert operation)\n\n+   3. If |n - m|==0, then we skip both non-matching characters\
    \ in S and T and make sure the remaining characters between S and T are exactly\
    \ matching. (Append operation)\n\n```\npublic boolean isOneEditDistance(String\
    \ s, String t) {\n    int m = s.length(), n = t.length();\n    if (m > n) return\
    \ isOneEditDistance(t, s);\n    if (n > m) return false;\n    int i = 0, shift\
    \ = 0;\n    while (i < m && s.charAt(i) == t.charAt(i)) i++;\n    if (i == m)\
    \ return shift > 0;\n    if (shift == 0) i++;\n    while (i < m && s.charAt(i)\
    \ == t.charAt(i + shift)) i++;\n    return i == m;\n}\n```"
