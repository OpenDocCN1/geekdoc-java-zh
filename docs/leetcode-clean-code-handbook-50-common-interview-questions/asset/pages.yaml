  md: "# O(n²) runtime, O(1) space – Simpler solution:\n\nIn fact, we could solve\
    \ it in O(n²) time using only constant space.\n\nWe observe that a palindrome\
    \ mirrors around its center. Therefore, a palindrome can be expanded from its\
    \ center, and there are only 2n –1 such centers.\n\nYou might be asking why there\
    \ 2n –1 but not n centers? The reason is the center of a palindrome is between\
    \ two letters. Palindromes have even number of letters (such as \"abba\") and\
    \ its center are between the two 'b's.\n\nSince expanding a palindrome around\
    \ its center can take O(n), the overall complexity is O(n²).\n\n```\npublic String\
    \ longestPalindrome(String s) {\n    int start = 0, end = 0;\n    for (int i =\
    \ 0; i < s.length(); i++) {\n        int len = expandAroundCenter(s, i, i);\n\
    \        int len2 = expandAroundCenter(s, i, i + 1);\n        len = Math.max(len,\
    \ len2);\n        if (len > start) {\n            start = i - (len - 1) / 2;\n\
    \            end = i + len / 2;\n        }\n    }\n    return s.substring(start,\
    \ end + 1);\n}\n```\n\n```\nprivate int expandAroundCenter(String s, int left,\
    \ int right) {\n    int L = left, R = right;\n    while (L >= 0 && R < s.length()\
    \ && s.charAt(L) == s.charAt(R)) {\n        L--;\n        R++;\n    }\n    return\
    \ R - L - 1;\n}\n```\n\n# O(n) runtime, O(n) space – Manacher’s algorithm:\n\n\
    There is an O(n) algorithm called Manacher's algorithm, explained here in detail.\
    \ However, it is a non-trivial algorithm, and no one expects you to come up with\
    \ this algorithm in a 30 minutes coding session. But, please go ahead and understand\
    \ it, I promise it will be a lot of fun."
