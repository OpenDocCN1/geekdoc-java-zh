    \   int begin = 0;\n        while (begin < end) {\n            lists.set(begin,\
    \ merge2Lists(lists.get(begin), lists.get(end)));\n            begin++;\n    \
    \    --}\n    }\n    return lists.get(0);\n}\n\nprivate ListNode merge2Lists(ListNode\
