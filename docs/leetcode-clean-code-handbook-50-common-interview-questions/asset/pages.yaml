  md: "# 45. Maximum Sum Subarray\n\nCode it now: https://oj.leetcode.com/problems/maximum-sum-subarray/\n\
    \nDifficulty: Medium, Frequency: High\n\n# Question:\n\nFind the contiguous subarray\
    \ within an array (containing at least one number) that has the largest sum.\n\
    \nFor example, given the array [2, 1, -3, 4, -1, 2, 1, -5, 4],\n\nThe contiguous\
    \ array [4, -1, 2] has the largest sum = 6.\n\n# Solution:\n\n# O(n log n) runtime,\
    \ O(log n) stack space – Divide and Conquer:\n\nAssume we partition the array\
    \ A into two smaller arrays S and T at the middle index, M. Then, S = A1 ... AM-1,\
    \ and T = AM+1 ... AN.\n\nThe contiguous subarray that has the largest sum could:\n\
    \n+   1. Contain the middle element:\n   a. The largest sum is the maximum sum\
    \ of S + Am + the maximum prefix sum of T.\n2. Does not contain the middle element:\n\
    \   a. The largest sum is in S, which we could apply the same algorithm to S.\n\
    \   b. The largest sum is in T, which we could apply the same algorithm to T.\n\
    \n```\npublic int maxSubArray(int[] A) {\n    return maxSubArrayHelper(A, 0, A.length\
    \ - 1);\n}\nnprivate int maxSubArrayHelper(int[] A, int L, int R) {\n    if (L\
    \ > R) return Integer.MIN_VALUE;\n    int M = (L + R) / 2;\n    int leftAns =\
    \ maxSubArrayHelper(A, L, M - 1);\n    int rightAns = maxSubArrayHelper(A, M +\
    \ 1, R);\n    int lMax = 0;\n    int sum = 0;\n    for (int i = M; i >= L; i--)\
    \ {\n        sum += A[i];\n    }\n    lMax = Math.max(sum, leftAns);\n    int\
    \ rMax = 0;\n    sum = 0;\n    for (int i = M + 1; i <= R; i++) {\n        sum\
    \ += A[i];\n    }\n    rMax = Math.max(sum, rightAns);\n    return Math.max(lMax\
    \ + A[M] + rMax, Math.max(leftAns, rightAns));\n}\n```"
