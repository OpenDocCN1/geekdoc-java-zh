  md: '# 23. Merge K Sorted Lists


    Code it now: https://oj.leetcode.com/merge-k-sorted-lists/ Difficulty: Hard, Frequency:
    High


    # Question:


    Merge sorted linked lists and return it as one sorted list. Analyze and describe
    its complexity.


    # Solution:


    $O(nk^2)$ runtime, $O(1)$ space — Brute force:


    The brute force approach is to merge a list by one. For example, if the lists
    = $[l1, l2, l3, l4]$, then first merge $l1$ and $l2$, then merge the result with
    $l3$, and finally $l4$.


    To analyze its time complexity, we are going to assume there a total of $k$ lists,
    and each list is of size n. There will be a total of $k-1$ merge operations. The
    first merge operation will be two lists of size $n$, therefore in the worst case
    there could be $n+n$ comparisons. The second merge operation will be two lists
    of size $2n$ and $n$. Notice that each merge operation increase the size of the
    merged lists by $n$. Therefore, the total number of comparisons required is $2n
    + 3n + 4n + \dots + kn = n(\frac{k(k+1)}{2} - 1) = O(nk^2)$.


    $O(nk \log k)$ runtime, $O(k)$ space — Heap:


    We could use a heap of size $k$. The heap is first initialized with the smallest
    element from each list. Then as we extract the nodes from the heap, we must remember
    to insert its next node into the heap. As each insert operation into the heap
    costs $\log(k)$ and there are a total of $nk$ elements, the total runtime complexity
    is $O(nk \log k)$.


    Ignoring the extra space that is used to store the output list, we only use extra
    space of $O(k)$ due to the heap.'
