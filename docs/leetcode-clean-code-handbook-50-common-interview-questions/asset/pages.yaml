    \ return it as a linked list.\n\nInput: (2 → 4 → 3) + (5 → 6 → 4)\n\nOutput: 7\
    \ → 0 → 8\n\n# Solution:\n\nKeep track of the carry using a variable and simulate\
    \ digits-by-digits sum from the head of list, which contains the least-significant\
    \ digit.\n\nTake extra caution of the following cases:\n\n+   - When one list\
    \ is longer than the other.\n\n+   - The sum could have an extra carry at the\
    \ end at the end, which is easy to forget. (e.g., (9 → 9) + (1) = (0 → 0 → 1))\n\
    \n```\npublic ListNode addTwoNumbers(ListNode l1, ListNode l2) {\n    ListNode\
    \ dummyHead = new ListNode();\n    ListNode p = l1, q = l2, curr = dummyHead;\n\
    \    int carry = 0;\n    while (p != null || q != null) {\n        int x = (p\
    \ != null) ? p.val : 0;\n        int y = (q != null) ? q.val : 0;\n        int\
    \ digit = carry + x + y;\n        carry = digit / 10;\n        curr.next = new\
    \ ListNode(digit % 10);\n        curr = curr.next;\n        if (p != null) p =\
    \ p.next;\n        if (q != null) q = q.next;\n    }\n    if (carry > 0) {\n \
    \       curr.next = new ListNode(carry);\n    }\n    return dummyHead.next;\n\
    }\n```"
