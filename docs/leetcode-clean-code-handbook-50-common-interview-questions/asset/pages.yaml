  md: '# 40. Evaluate Reverse Polish Notation


    Code it now: https://oj.leetcode.com/problems/evaluate-reverse-polish-notation/  Difficulty:
    Medium, Frequency: Low


    # Question:


    Evaluate the value of an arithmetic expression in Reverse Polish Notation.

    Valid operators are +, -, *, /. Each operand may be an integer or another expression.

    Some examples:


    +   - ["2", "1", "+", "3", ""] -> ((2 + 1) * 3) -> 9

    - ["4", "13", "5", "/", "+"] -> (4 + (13 / 5)) -> 6


    # Example Candidates Might Ask:


    Q: Is an empty array a valid input?

    A: No.


    # Solution:


    The Reverse Polish Notation (RPN) is also known as the postfix notation, because
    each operator appears *after* its operands. For the infix notation "3 + 4" is
    expressed as "3 4 +" in RPN.


    # The brute force approach:


    We look for the simplest RPN sequence that could be evaluated immediately, that
    is: Two successive operands followed by an operator such as “4 2 +\”. We replace
    this sequence with the expression''s value and repeat until there is only one
    operand left.


    For example:


    +   - ["4", "13", "5", "/", "+"]

    - ["4", "2", "+"]

    - ["6"]


    How would you replace it? Could you do it in-place with the input array, but it
    would result in quadratic runtime as elements have to be shifted every time a
    replacement occurs.


    A workaround is to copy the input array to a doubly linked list. The replacement
    is efficient and the next scan begins with the replaced value''s previous element.
    This results in an algorithm with linear runtime and linear space. Although this
    works, the implementation is complex and is far from ideal in an interview session.'
