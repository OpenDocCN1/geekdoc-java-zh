    \nThis problem is very similar to Question [45. Maximum Subarray]. There is a\
    \ slight twist though. Besides keeping track of the largest product, we also need\
    \ to keep track of the smallest product. Why the smallest product, which is the\
    \ largest in the negative sense could be the maximum when multiplied by a negative\
    \ number.\n\nLet us denote that:\n\nf(k) = Largest product subarray, from index\
    \ 0 up to k.\n\nSimilarly,\n\ng(k) = Smallest product subarray, from index 0 up\
    \ to k.\n\nThen,\n\nf(k) = max(f(k-1) * A[k], g(k-1) * A[k])\ng(k) = min(g(k-1)\
    \ * A[k], f(k-1) * A[k])\n\nWe have a dynamic programming formula. Using two arrays\
    \ of size n, we could deduce the final answer as f(n-1). Since we need to access\
    \ its previous elements each step, two variables are sufficient.\n\n```\npublic\
    \ int maxProduct(int[] A) {\n    assert A.length > 0;\n    int max = A[0], min\
    \ = A[0], maxAns = A[0];\n    for (int i = 1; i < A.length; i++) {\n        int\
    \ mx = max, mn = min;\n        max = Math.max(Math.max(A[i], mx * A[i]), mn *\
    \ A[i]);\n        min = Math.min(Math.min(A[i], mx * A[i]), mn * A[i]);\n    \
    \    maxAns = Math.max(max, maxAns);\n    }\n    return maxAns;\n}\n```"
