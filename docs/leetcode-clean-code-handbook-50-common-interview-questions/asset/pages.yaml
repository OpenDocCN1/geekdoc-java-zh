    \ just swap $S$ and $T$.\n4. If $m == n$, it becomes finding if there is *exactly*\
    \ one modified operation. If $m \neq n$, you do not have to consider the deletion\
    \ operation. Just consider the insert operation in $T$.\n\n# Solution:\n\nLet\
    \ us assume $m =$ length of $S$, $n =$ length of $T$.\nAlthough this problem is\
    \ solvable by directly applying the famous Edit distance dynamic programming with\
    \ runtime complexity of $O(mn)$ there exists a simpler and more efficient one-pass\
    \ algorithm.\n\n# $O(n)$ runtime, $O(1)$ space – Simple one-pass:\n\nFor the case\
    \ where $m$ is equal to $n$, it becomes finding if there is exactly one modified\
    \ character. Now let $m \\leq n$ we could just swap them.\n\nAssume $X$ represents\
    \ the one-edit character. There are *three* one-edit distance operations\n\n+\
    \   i. Modify operation – Modify a character to $X$ in $S$.\n$S = \"abcde\"\n\
    T = \"abXde$$\n\n+   ii. Insert operation – $X$ was inserted before a character\
    \ in $S$.\n$S = \"abcde\"\nT = \"abXcde$$\n\n+   iii. Append operation – $X$ was\
    \ appended at the end of $S$.\n$S = \"abcde\"\nT = \"abcdeX$$"
