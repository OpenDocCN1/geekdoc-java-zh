  md: '# Combinatorics:


    Interestingly, this problem could also be solved using combinatorics.


    Warning: Math-y stuff ahead, feel free to skip this section if you are not interested.


    For example, let''s assume n = 6.


    Let:


    x = number of 1''s,

    y = number of 2''s.


    We could reach the top using one of the four combinations below:


    | x | y |

    |---|---||

    | 6 | 0 | => 1) Six single steps. |

    | 4 | 1 | => 2) Four single steps and one double step. |

    | 2 | 2 | => 3) Two single steps and two double steps. |

    | 0 | 3 | => 4) Three double steps. |


    For the first combination pair (x,y) = (6,0), there''s obviously only one way
    of arranging six single steps.


    For the second combination pair (4,1), there''s five ways of arranging (think
    of it as slotting the double step between the single steps).


    Similarly, there are six ways C(4,2) $\frac{4}{2}$ of arranging the third and
    fourth combination pairs respectively.


    Generally, for pair (x,y), there are a total of $\frac{(x+y)!}{x!y!}$ ways of
    arranging the 1''s and 2''s.


    The total number of possible ways is the sum of all individual terms,


