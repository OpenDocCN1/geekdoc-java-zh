  md: "```\nprivate static final Comparator<ListNode> listComparator =\n    new Comparator<ListNode>()\
    \ {\n    @Override\n    public int compare(ListNode x, ListNode y) {\n       \
    \ return x.val - y.val;\n    }\n};\n\npublic ListNode mergeLists(List<ListNode>\
    \ lists) {\n    if (lists.isEmpty()) return null;\n    PriorityQueue<ListNode>\
    \ queue = new PriorityQueue<ListNode>(lists.size(), listComparator);\n    for\
    \ (ListNode node : lists) {\n        if (node != null) {\n            queue.add(node);\n\
    \        }\n    }\n    ListNode dummyHead = new ListNode(0);\n    ListNode p =\
    \ dummyHead;\n    while (!queue.isEmpty()) {\n        ListNode node = queue.poll();\n\
    \        p.next = node;\n        p = p.next;\n        if (node.next != null) {\n\
    \            queue.add(node.next);\n        }\n    }\n    return dummyHead.next;\n\
    }\n```\n\n# ### O(n k) time, O(1) space – Divide and conquer using two way merge:\n\
    \nIf you still remember how merge sort works, we can use a divide and conquer\
    \ mechanism to solve this problem. Here, we apply the merge lists algorithm from\
    \ Question [20. Merge Two Sorted Lists].\n\nBasically, the algorithm merges two\
    \ lists at a time, so the number of lists reduces from:\n\n$k \\to \\frac{k}{2}\
    \ \\to \\frac{k}{4} \\to \\dots \\to 2 \\to 1$\n\nSimilarly, the size of the lists\
    \ increases (Note that the lists could subdivide itself at most log(k) times):\n\
    \n$n \\to 2n \\to 4n \\to \\dots \\to 2^{\\log k}n$\n\nTherefore the runtime complexity\
    \ is:\n\n$k \\cdot \\frac{k}{2} \\cdot 2n + \\frac{k}{4} \\cdot 4n + \\dots +\
    \ 2^{\\log k} \\cdot 1$\n$= nk + nk + nk + \\dots + nk$\n$= nk \\log k$\n\nSince\
    \ we are implementing this divide and conquer algorithm iteratively, the space\
    \ complexity is constant at $O(1)$, yay!"
