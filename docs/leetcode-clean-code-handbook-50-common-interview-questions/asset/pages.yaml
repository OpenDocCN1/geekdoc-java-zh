  md: 'Notice the total number of coins change from even to odd and vice-versa when
    player takes each time. Therefore, by going first and depending on the coin you
    choose, you are essentially forcing your opponent to take either even-numbered
    or odd-numbered coins.


    Now that you have found a non-losing strategy, could you compute the maximum amount
    of money you can win?


    # Hints:


    One misconception is to think that the above non-losing strategy would generate
