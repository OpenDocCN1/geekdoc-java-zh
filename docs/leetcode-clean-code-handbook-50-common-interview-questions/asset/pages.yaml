  md: "# # Chapter 8: Dynamic Programming\n\n# ## 42. Climbing Stairs\n\nCode it now:\
    \ https://oj.leetcode.com/problems/climbing-stairs/ Difficulty: Easy, Frequency:\
    \ High\n\n**Question:**\n\nYou are climbing a staircase. It takes $n$ steps to\
    \ reach the top.\n\nEach time you can climb 1 or 2 steps. In how many distinct\
    \ ways can you climb to the top?\n\n**Solution:**\n\n**O(n) runtime, $O(1)$ space\
    \ – Dynamic programming:**\n\nThis is a classic Dynamic Programming problem.\n\
    \nDefine:\n\n$f(n) = \\text{number of ways you can climb to the } n^{\\text{th}}$\
    \ step.\n\nTo reach one step from the $n-1^{\\text{th}}$ step, you have two choices:\n\
    \n+   1. Advance one step from the $n-1^{\\text{th}}$ step.\n\n+   2. Advance\
    \ two steps from the $n-2^{\\text{th}}$ step.\n\nTherefore, $f(n) = f(n-1) + f(n-2)$,\
    \ which is the exact recurrence formula by the [Fibonacci sequence](https://en.wikipedia.org/wiki/Fibonacci_sequence)\
    \ (with different base cases, though).\n\nSet base cases $f(1)=1, f(2)=2$ and\
    \ you are almost done.\n\nNow, we can calculate $f(n)$ easily by storing previous\
    \ values in one dimension array and work our way up to n. Here, we even optimize\
    \ this further by storing just the previous two values.\n\n```\npublic int climbStairs(int\
    \ n) {\n    int p = 1, q = 1;\n    for (int i = 2; i <= n; i++) {\n        int\
    \ temp = q;\n        q += p;\n        p = temp;\n    }\n    return q;\n}\n```\n\
    \n81"
