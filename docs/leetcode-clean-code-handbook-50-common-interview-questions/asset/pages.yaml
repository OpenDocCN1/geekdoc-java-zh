    \ s, reverse the string by word.\nFor example, given s = \"the sky is blue\",\
    \ return \"blue is the sky\".\n\n# Examples Candidates Might Ask:\n\n+   Q: What\
    \ constitutes a word?\nA: A sequence of non-space characters constitutes a word.\n\
    Q: Does tab or newline character count as space characters?\nA: Assume the input\
    \ does not contain any tabs or newline characters.\nQ: Could the input string\
    \ contain leading or trailing spaces?\nA: Yes. However, your reversed string should\
    \ not contain leading or trailing spaces.\nQ: How many spaces between two words?\n\
    A: Reduce them to a single space in the reversed string.\n\n# Solution\n\n# O(n)\
    \ runtime, O(n) space:\n\nOne simple approach is a two-pass solution: First to\
    \ split the string by spaces into an array of words, then second pass to extract\
    \ the words in reversed order.\nWe can do better in one-pass. While iterating\
    \ the string in reverse order, we keep track of a word's begin and end position.\
    \ When we are at the beginning of a word, we append it.\n\n```\npublic String\
    \ reverseWords(String s) {\n    StringBuilder reversed = new StringBuilder();\n\
    \    int j = s.length();\n    for (int i = s.length() - 1; i >= 0; i--) {\n  \
    \      if (s.charAt(i) == ' ') {\n            j = i;\n        } else if (i ==\
    \ 0 || s.charAt(i - 1) == ' ') {\n            if (reversed.length() != 0) {\n\
    \                reversed.append(' ');\n            }\n            reversed.append(s.substring(i,\
    \ j));\n        }\n    }\n    return reversed.toString();\n}\n```\n\n# Follow\
    \ up:\n\nIf the input string does not contain leading or trailing spaces, could\
    \ you do it in-place without allocating extra space? See Question [7]. Reverse\
    \ Words in a String II."
