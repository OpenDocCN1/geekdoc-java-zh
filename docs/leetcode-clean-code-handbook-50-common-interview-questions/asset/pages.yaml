    \ that it recalculates the same solution for a grid over and again. By caching\
    \ the results, we prevent precalculation and only calculate when necessary. Here,\
    \ we are using a dynamic programming (DP) technique memoized.\n\n```\nprivate\
    \ int backtrack(int r, int c, int m, int n, int[][] mat) {\n    if (r == m - 1\
