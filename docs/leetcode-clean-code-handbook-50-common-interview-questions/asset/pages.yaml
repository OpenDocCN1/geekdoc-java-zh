    \ where $n$ is the length of $S$. We can form every possible substring, and for\
    \ each substring insert all characters into a Set which the Set's size indicating\
    \ the number of distinct characters. This could be easily improved to $O(n)$ by\
    \ reusing the same Set when adding a character to form a new substring.\n\nThe\
    \ trick is to maintain a sliding window that always satisfies the invariant where\
    \ there are always at most two distinct characters in it. When we add a new character\
    \ that breaks this invariant, as above, how can we move the begin pointer to satisfy\
    \ the invariant? Using the above example, our first window is the string \"abba\"\
    . When we add the character 'c' into the sliding window, it breaks the invariant.\
    \ Therefore, we have to readjust the window to satisfy the invariant again. The\
    \ question is which starting point to choose so the invariant is satisfied.\n\n\
    Let's look at another example $S = \"abaac\"$. When we add 'c' to the window,\
    \ the new sliding window should be \"aac\"\n\nThis method iterates $n$ times and\
    \ therefore its runtime complexity is $O(n)$. We use three pointers: $i$, $j$,\
    \ and $k$.\n\n```\npublic int longestOfSubstringTwoDistinct(String s) {\n    int\
    \ i = 0, j = -1, maxLen = 0;\n    for (int k = 0; k < s.length(); k++) {\n   \
    \     if (s.charAt(k) == s.charAt(k - 1)) continue;\n        if (j > 0 && s.charAt(j)\
    \ == s.charAt(k)) {\n            maxLen = Math.max(k - i, maxLen);\n         \
    \   i = j + 1;\n        }\n        j = k - 1;\n    }\n    return Math.max(s.length()\
    \ - i, maxLen);\n}\n```\n\n21"
