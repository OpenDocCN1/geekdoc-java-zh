  md: "# 13. Longest Palindromic Substring\n\nCode now: https://oj.leetcode.com/problems/longest-palindromic-substring/\
    \ Difficulty: Medium, Frequency: Medium\n\nQuestion:\n\nGiven a string $S$, find\
    \ the longest palindromic substring in $S$. You may assume that the maximum length\
    \ of $S$ is 1000, and there exists one unique palindromic substring.\n\nHint:\n\
    \nFirst, make sure you understand what a palindrome means. A palindrome is a string\
    \ which reads the same in both directions. For example, \"aba\" is a palindrome,\
    \ \"abc\" is not.\n\nA common mistake:\n\nSome will be tempted to come up with\
    \ a quick solution, which is unfortunately flawed (however can be corrected easily):\n\
    \n> Reverse S and come S'. Find the longest common substring between S and S',\
    \ which must also be the longest palindromic substring.\n\nThis seemed to work,\
    \ let us see some examples below.\n\nFor example, $S = “caba”$, $S' = “abac”$.\n\
    \nThe longest common substring between S and S' is “aba”, which is the answer.\n\
    \nLet’s try another example: $S = “abcdaba”$, $S' = “abcddfdcaba”$.\n\nThe longest\
    \ common substring between S and S' is “abacd”. Clearly, this is not a valid palindrome.\n\
    \nWe could see that the longest common substring method fails when there exists\
    \ a reversed copy of a non-palindromic substring in some other part of S. To rectify\
    \ this, each time we find a common substring candidate, we check if the substring’s\
    \ indices are the same as the reversed substring’s original indices. If it is,\
    \ we attempt to update the longest palindromic found found so far; if not, we\
    \ skip this and find the next candidate.\n\nThis us an $O(n^2)$ DP solution using\
    \ $O(n)$ space (which could be improved to $O(n)$ space). Please read more about\
    \ Longest Common Substring here.\n\n$O(n^3)$ runtime, $O(1)$ space – Brute force:\n\
    \nThe obvious brute force solution is to pick all possible starting and ending\
    \ positions for a substring, and verify if it is a palindrome. There are a total\
    \ of $\binom{n}{2}$ substrings (excluding the trivial solution where a character\
    \ itself is a palindrome).\n\nSince verifying each substring takes $O(n)$ time,\
    \ the run time complexity is $O(n^3)$."
