  md: 'Figure 8: The remaining coins are { Ai ... Aj } and it is your turn. Let P(i,
    j) denotes the maximum amount of money you get. Should you choose Ai or Aj?


    Assume that P(i, j) denotes the maximum amount of money you can win when the remaining
    coins are { Ai, ..., Aj }, and it is your turn now. You have two choices, either
    take Ai or Aj. First, let us focus on the case you take Ai, so that the remaining
    coins become { Ai+1 ... Aj }. Since the opponent is as smart as you, he must choose
    the best move that yields the maximum for him, where the maximum amount you can
    get is denoted by P(i+1, j).


    Therefore, if you choose Ai, the maximum amount you can get:


    ```

    $P_1 = \sum_{k=i}^{j} A_k - P(i+1, j)$

    ```


    Similarly, if you choose Aj, the maximum amount you can get:


    ```

    $P_2 = \sum_{k=i}^{j} A_k - P(i, j-1)$

    ```


    Therefore,


    ```

    $P(i, j) = \max(P_1, P_2)$$\n= \max \left( \sum_{k=i}^{j} A_k - P(i+1, j), \sum_{k=i}^{j}
    A_k - P(i, j-1) \right)$

    ```


    In fact, we can simplify the above relation further to (Why?):


    ```

    $P(i, j) = \sum_{k=i}^{j} A_k - min(P(i+1, j), P(i, j-1))$

