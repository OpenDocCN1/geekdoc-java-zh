    \ if the number of nodes in the linked list has only odd number of nodes?\nA:\
    \ The last node should not be swapped.\n\n# Solution:\n\nLet’s assume $p, q, r$\
    \ are the current, next, and next’s next node.\n\nWe could swap the nodes pairwise\
    \ by adjusting where it’s pointing next:\n$q.next = p$;n$p.next = r$;\n\nThe above\
    \ operations transform the list from $\\{ p \rightarrow q \rightarrow r \rightarrow\
    \ s \\}$ to $\\{ q \rightarrow p \rightarrow r \rightarrow s \\}$.\n\nIf the next\
    \ pair of nodes exists, we should remember to connect $p$'s next to $s$. Therefore,\
    \ we should record the current node before advancing to the next pair of nodes.\n\
    \nTo determine the new list’s head, you should look if the list contains two or\
    \ more elements. Basically, these extra statements could be avoided by inserting\
    \ an extra node (also known as the dummy head) to the front of the list.\n\n```\n\
    public ListNode swapPairs(ListNode head) {\n    ListNode dummy = new ListNode(0);\n\
    \    dummy.next = head;\n    ListNode p = head;\n    ListNode prev = dummy;\n\
    \    while (p != null && p.next != null) {\n        ListNode q = p.next, r = p.next.next;\n\
    \        prev.next = q;\n        q.next = p;\n        p.next = r;\n        prev\
    \ = q;\n        p = r;\n    }\n    return dummy.next;\n}\n```\n\n39"
