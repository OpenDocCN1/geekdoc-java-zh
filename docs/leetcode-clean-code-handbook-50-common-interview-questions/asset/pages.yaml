  md: "# 2. Two Sum II – Input array is sorted\n\nCode now: Coming soon! Difficulty:\
    \ Medium, Frequency: N/A\n\n# Question:\n\nSimilar to Question [1. Two Sum], except\
    \ the input array is already sorted in ascending order.\n\n# Solution:\n\nOf course\
    \ we could still apply the [Hash table] approach, but it costs us O(n) extra space,\
    \ plus it does not make use of the fact that the input is already sorted.\n\n\
    O(n log) runtime, O(1) space – Binary search:\n\nFor each element x, we could\
    \ look up if target exists in O(log n) time by applying binary search over the\
    \ sorted array. Total runtime complexity is O(n log n).\n\n```\npublic int[] twoSum(int[]\
    \ numbers, int target) {\n    // Assume input is already sorted.\n    for (int\
    \ i = 0; i < numbers.length; i++) {\n        int j = bsearch(numbers, target -\
    \ numbers[i], i + 1);\n        if (j != -1)\n            return new int[] {i +\
    \ 1, j};\n    }\n    throw new IllegalArgumentException(\"No two sum solution\"\
    );\n}\n\nprivate int bsearch(int[] A, int key, int start) {\n    int L = start,\
    \ R = A.length - 1;\n    while (L < R) {\n        int M = (L + R) / 2;\n     \
    \   if (A[M] < key)\n            L = M + 1;\n        } else\n            R = M;\n\
    \    }\n    return (L <= R && A[L] == key) ? L : -1;\n}\n```\n\n# O(n) runtime,\
    \ O(1) space – Two pointers:\n\nLet's assume we have two indices pointing to the\
    \ i^{th} and j^{th} elements, $A_i$ and $A_j$ respectively. The sum of $A_i$ and\
    \ $A_j$ can only fall into one of these three possibilities:\n\n+   i. $A_i +\
    \ A_j > target$. Increasing $i$ isn't going to help us, as it makes the sum bigger.\
    \ Therefore we should decrement $j$.\nii. $A_i + A_j < target$. Decreasing $j$\
    \ isn't going to help us, as it makes the sum smaller. Therefore we should increment\
    \ $i$.\niii. $A_i + A_j = target$. We have found the answer."
