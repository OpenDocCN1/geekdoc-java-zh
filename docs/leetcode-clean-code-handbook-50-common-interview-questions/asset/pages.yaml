    formula? Find ways to make it as efficient as possible.


    # Solution for (2):


    Although the simple strategy illustrated in Solution (1) guarantees you not to
    lose, it not guarantee that it is optimal in any way.


    Here, we use a good counter example to see better why this is so. Assume the coins
    are laid out as:


    +   * 3, 2, 2, 3, 1, 2


    Following our previous non-losing strategy, we would count the sum of odd-numbered
    coins, X = 3 + 2 + 1 = 6, and the sum of even-numbered coins, Y = 2 + 3 + 2 =
    7. As Y > X, we would take the last coin first and end up winning with the total
    amount of 7 by taking only even-numbered coins.


    However, let us try another way by taking the first coin (valued at 3, denote
    by (3)) instead. The opponent is left with two possible choices, the left coin
    (2) and the right coin (2), both valued at 2. No matter which coin the opponent
    chooses, you can always take the other coin (2) and then the configuration of
    the coins: { 2, 3, 1 }. Now, the coin in the middle (3) would be yours to keep
    for. Therefore, you win the game by a total amount of 3 + 2 + 3 = 8, which proves
    that the previous non-losing strategy is not necessarily optimal.


    To solve this problem in an optimal way, we need to find efficient methods in
    enumerating all possibilities. This is when Dynamic Programming (DP) kicks in
    and become so powerful that you start to feel magical.


    First, we would need some observations to establish a recurrence relation, which
    is essential as our first step in solving DP problems.'
