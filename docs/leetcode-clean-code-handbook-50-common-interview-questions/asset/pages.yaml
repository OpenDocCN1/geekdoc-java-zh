  md: '# 8. String to Integer (atoi)


    Code it now: https://oj.leetcode.com/problems/string-to-integer-atoi/                                               Difficulty:
    Easy, Frequency: High


    # Question:


    Implement atoi to convert a string to an integer.


    The atoi function first discards as many whitespace characters as necessary until
    the first non-whitespace character is found. Then, starting from this character,
    takes an optional plus or minus sign followed by as many digits as possible, and
    interprets them as a numerical value.


    The string can contain additional characters after those that form the integral
    number, which are ignored and have no effect on the behavior of this function.


    If the first sequence of non-whitespace characters in str is not a valid integral
    number, or if no such sequence exists because either str is empty or it contains
    only whitespace characters, no conversion is performed.


    If no valid conversion can be performed, a zero value is returned. If the correct
    value is out of the range of representable values, the maximum value (2147483647)
    or the minimum integer value (-2147483648) is returned.


    # Solution:


    The heart of this problem is dealing with overflow. A direct approach is to store
    the number as a string so we can evaluate at each step the number had indeed overflowed.
    There are some other ways to detect overflow that requires knowledge about how
    a specific programming language or operating systems works.


    A desirable solution does not require any assumption on how the language works.
    In each step we are appending a digit to the number by doing a multiplication
    and addition. On the other hand, if the current number is greater than 214748364,
    we know it is going to overflow. If the current number is equal to 214748364,
    we know that it will overflow only when the current digit is greater than or equal
    to 8. Remember to consider also edge case for the smallest number. -2147483648
    (-2³¹¹).


    14'
