  md: "# O(n) runtime, O(n) space – Minor optimization:\n\nIf a new element is larger\
    \ than the current minimum, we do not need to push it on to the min stack. When\
    \ we perform the pop operation, check if the popped element is the same as the\
    \ current minimum. If it is, it pop off the min stack too.\n\n```\nclass MinStack\
    \ {\n    private Stack<Integer> stack = new Stack<>();\n    private Stack<Integer>\
    \ minStack = new Stack<>();\n\n    public void push(int x) {\n        stack.push(x);\n\
    \        if (minStack.isEmpty() || x <= minStack.peek()) {\n            minStack.push(x);\n\
    \        }\n    }\n\n    public void pop() {\n        if (stack.pop().equals(minStack.peek()))\
    \ minStack.pop();\n    }\n\n    public int top() {\n        return stack.peek();\n\
    \    }\n\n    public int getMin() {\n        return minStack.peek();\n    }\n\
    }\n```"
