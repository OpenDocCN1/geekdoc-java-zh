  md: "```\nint L = 0, R = A.length - 1;\nwhile (L < R) {\n  int M = (L + R) / 2;\n\
    \  if (A[M] < target) {\n    L = M + 1;\n  } else {\n    R = M;\n  }\n}\n```\n\
    \nCode 2: Filling out the key part of the Binary Search algorithm.\n\nA good thing\
    \ to verify your binary search does not stuck in an infinite loop is to test with\
    \ input containing two elements, e.g., [1,3] and test with target = 0 and 1. Here,\
    \ our binary search works properly, but if we were to define M as the upper middle,\
    \ that is: M = (L+R+1)/2, then it would be stuck in an infinite loop.\n\nWe've\
    \ now reached the final step. While the loop ends, L must be equal to R and it\
    \ is a valid index. Obviously, if A[L] is equal to target, we return L. If A[L]\
    \ is greater than target, that means we are inserting target before A[L], so we\
    \ return L. If A[L] is less than target, that means we insert target after A[L],\
    \ so we return L + 1.\n\n```\npublic int searchInsert(int[] A, int target) {\n\
    \  int L = 0, R = A.length - 1;\n  while (L < R) {\n    int M = (L + R) / 2;\n\
    \    if (A[M] < target) {\n      L = M + 1;\n    } else {\n      R = M;\n    }\n\
    \  }\n  return (A[L] < target) ? L + 1 : L;\n}\n```"
