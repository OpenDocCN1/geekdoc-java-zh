  md: "The runtime complexity could be expressed as $T(n) = 2T(\\frac{n}{2}) + O(n)$,\
    \ which is $O(n \\log n)$. We will not attempt to prove it here; you could read\
    \ up any advanced algorithm textbooks to learn the proof.\n\n# **O(n) runtime,\
    \ O(1) space – Dynamic programming:**\n\nTo devise a programming formula, let\
    \ us assume that we are calculating the maximum sum of subarray that ends at a\
    \ specific index.\n\nLet us denote that:\n\n$f(k) = Maximum$ sum of subarray ending\
    \ at index $k$.\n\nThen,\n\n$f(k) = max(f(k-1)) + A[k]$.\n\nUsing an array of\
    \ size $n$, We could deduce the final answer by $f(n-1)$, with the initial state\
    \ of $f(0) = A[0]$. Since we only need to access its previous element at each\
    \ step, two variables are sufficient. Notice the difference between the two: $maxEndingHere$\
    \ and $maxSoFar$, the former is the maximum sum of subarray that must end at index\
    \ $k$, while the latter is the global maximum subarray sum.\n\n```\npublic int\
    \ maxSubArray(int[] A) {\n    int maxEndingHere = A[0], maxSoFar = A[0];\n   \
    \ for (int i = 1; i < A.length; i++) {\n        maxEndingHere = Math.max(maxEndingHere\
    \ + A[i], A[i]);\n        maxSoFar = Math.max(maxEndingHere, maxSoFar);\n    }\n\
    \    return maxSoFar;\n```"
