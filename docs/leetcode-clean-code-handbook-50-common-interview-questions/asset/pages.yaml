    We first look at ‘I’, and add 1 to it. Then we look at ‘V’ and since a smaller
    roman literal ‘I’ appears before it, we need to subtract ‘I’ from ‘V’. Remember
    that we already added another ‘I’ before it, so we need to subtract a total of
