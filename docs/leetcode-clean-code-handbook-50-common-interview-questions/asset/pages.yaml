  md: "As we are discarding all the elements at each step, the runtime complexity\
    \ is O(log n).\n\nTo understand the correct terminating condition, we look at\
    \ two elements. Let us choose the lower median as M = (L + R) / 2. Therefore,\
    \ if there are two elements, it will choose A_L as the first element.\n\nThere\
    \ are two cases for two elements:\n\n+   A = [1,2]\n\n+   B = [2,1]\n\nFor A,\
    \ I < 2 => A_M < A_R, and therefore it will set R = M => R = 0.\n\nFor B, 2 >\
    \ 1 => A_M > A_R, and therefore it will set L = M + 1 => L = 1.\n\nTherefore,\
    \ it is clear that when L == R, we have found the minimum element.\n\n```\npublic\
    \ int findMin(int A[]) {\n    int L = 0, R = A.length - 1;\n    while (L < R &&\
    \ A[L] >= A[R]) {\n        int M = (L + R) / 2;\n        if (A[M] > A[R]) {\n\
    \            L = M + 1;\n        } else {\n            R = M;\n        }\n   \
    \ }\n    return A[L];\n}\n```\n\n# Further Thoughts:\n\nIf the rotated sorted\
    \ array could contain duplicates? Is your algorithm still O(log n) in runtime\
    \ complexity?"
