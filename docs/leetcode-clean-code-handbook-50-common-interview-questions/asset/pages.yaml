    Difficulty: Medium, Frequency: Low


    # Question:


    Given an array where elements are sorted in ascending order, convert it to a height
    balanced BST.


    # Hint:


    This question is highly recursive in nature. Think of how binary search works.


    ![](img/172f5d31191b965fe8ccb5a0f5becd9a_54_0.png)


    Figure 2: An example of a height-balanced tree. A height-balanced tree is a tree
    whose subtrees differ in height by no more than one and the subtrees are height-balanced,
    too.


    # Solution:


    O(n) runtime, O(log n) stack space – Divide and conquer:


    If you would have to choose an array element to be the root of a balanced BST,
    which element would you pick? The root of a balanced BST should be the middle
    element from the sorted array.


    You would pick the middle element from the sorted array in each iteration. You
    then create a node in the tree initialized with this element. After the element
    is chosen, what is left? Could you identify the sub-problems within the problem?


    There are two arrays left – The one on its and the one on its right. These two
    arrays are the sub-problems of the original problem, since both of them are sorted.
    Furthermore, they are subtrees of the current node''s left and right child.


    The code below creates a balanced BST from the sorted array in O(n) time (n is
    the number of elements in the array). Compare how similar the code is to a binary
    search algorithm. Both are using the divide and conquer methodology. Because the
    input array could be subdivided in at most log(n) times, the extra stack space
    used by the recursion is in O(log n).'
