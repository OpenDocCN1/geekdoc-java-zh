  md: "# 38. Clone graph\n\nCode now: https://oj.leetcode.com/problems/clone-graph/\
    \ Difficulty: Medium, Frequency: Medium\n\n# Question:\n\nClone an undirected\
    \ graph. Each node in the graph contains a label and a list of its neighbors.\n\
    \n# Solution:\n\nThere are two main ways to traverse a graph: *breadth-first*\
    \ or *depth-first*. Let's try the depth-first approach, which is a recursion algorithm.\
    \ We will then look at the breadth-first approach, which is an iterative algorithm\
    \ that uses a queue.\n\n# O(n) runtime, O(n) space – Depth-first traversal:\n\n\
    A graph is simply represented by a graph node that serves as its starting point.\
    \ In fact, the starting point could be any other graph nodes and it does not affect\
    \ the cloning algorithm.\n\nAs each of its neighbors is a graph too, we could\
    \ recursively clone each of its neighbors and assign it to each neighbor of the\
    \ cloned node. We can easily see that it is doing a depth-first traversal of each\
    \ node.\n\nNote that the graph could contain cycles, for a node could have a neighbor\
    \ that points back to it. Therefore, we should use a map that records each node's\
    \ copy to avoid infinite recursion.\n\n```\npublic UndirectedGraphNode cloneGraph(UndirectedGraphNode\
    \ graph) {\n    if (graph == null) return null;\n    Map<UndirectedGraphNode,\
    \ UndirectedGraphNode> map = new HashMap<>();\n    return DFS(graph, map);\n}\n\
    ```\n\n```\nprivate UndirectedGraphNode DFS(UndirectedGraphNode graph, Map<UndirectedGraphNode,\
    \ UndirectedGraphNode> map) {\n    if (map.containsKey(graph)) {\n        return\
    \ map.get(graph);\n    }\n    UndirectedGraphNode graphCopy = new UndirectedGraphNode(graph.label);\n\
    \    map.put(graph, graphCopy);\n    for (UndirectedGraphNode neighbor : graph.neighbors)\
    \ {\n        graphCopy.neighbors.add(DFS(neighbor, map));\n    }\n    return graphCopy;\n\
    }\n```\n\n# O(n) runtime, O(n) space – Breadth-first traversal:\n\nHow does the\
    \ breadth-first traversal works? Easy, as we pop a node off the queue, we copy\
    \ each of its neighbors, and push them to the queue."
