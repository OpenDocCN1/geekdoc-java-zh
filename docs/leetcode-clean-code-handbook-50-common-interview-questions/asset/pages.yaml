  md: '# A Better Solution:


    There is another solution that does not rely on computing and storing results
    of $\sum_{k=i}^l A_k$, therefore is more efficient in terms of time and space.
    We rewind back to the case where you take Ai, and the remaining coins become $\{A_{i+1}
    \dots A_j\}$.


    | A1 | ... | Ai | Ai+1 | ... | Aj | ... | An |


    Figure 9: You took Ai from the coins { Ai ... Aj }. The opponent will either choose
    Ai+1 or Aj. Which one would he choose?


    Let us consider one extra step ahead by considering the two coins the opponent
    will possibly take, $A_{i+1}$ and $A_j$. If the opponent takes $A_{i+1}$, the
    remaining coins are $\{A_{i+2} \dots A_j\}$, whose maximum is denoted by $P(i+2,
    j)$. On the other hand, if the opponent takes $A_j$, our maximum is $P(i, j-1)$.
    Since the opponent is as smart as you, would have chosen the choice that yields
    the minimum amount to you.


    Therefore, the maximum amount you can get when you choose Ai is:


    ```

    $P_1 = A_i + \min(P(i+2, j), P(i+1, j-1))$

    ```


    Similarly, the maximum amount you can get when you choose Aj is:


    ```

    $P_2 = A_j + \min(P(i+1, j-1), P(i, j-2))$

    ```


    Therefore,


    ```

    $P(i, j) = \max(P_1, P_2)

    = \max(A_i + \min(P(i+2, j), P(i+1, j-1)), A_j + \min(P(i+1, j-1), P(i, j-2)))$

    ```


    Although the recurrence relation could be implemented in few lines of code, its
    complexity is exponential. The reason is that each recursive call branches into
    a total of four separate recursive calls, and it could be $n$ levels deep from
    the very first call). Memoization provides an efficient way by avoiding re-computations
    using intermediate results stored in a table. Below is the code which runs in
    $O(n^2)$ time and takes $O(n^2)$ space.


    The code contains a function printMoves which prints out all the moves you and
    the opponent make (assuming both of you are taking the coins in an optimal way).'
