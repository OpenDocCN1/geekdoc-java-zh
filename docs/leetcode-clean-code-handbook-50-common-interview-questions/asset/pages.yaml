  md: '# 36. Integer to Roman


    Code it now: https://oj.leetcode.com/problems/integer-to-roman/ Difficulty: Medium,
    Frequency: Low


    # Question:


    Given an integer, convert it to a roman numeral.


    Input is guaranteed to be within the range from 1 to 3999.


    # Hint:


    What is the range of the numbers?


    # Solution:


    | Roman Literal | Decimal |

    |---|---|

    | I | 1 |

    | V | 5 |

    | X | 10 |

    | L | 50 |

    | C | 100 |

    | D | 500 |

    | M | 1000 |


    Table 1: Roman literals and its decimal representations.


    First, let''s understand how to read roman numerals. The rule of roman numerals
    is simple: Symbols are placed from left to right starting with the largest, and
    we add the values according to the additive notation. However, there is an exception
    to avoid four symbols being repeated in succession, also known as the subtractive
    notation.


    # The additive notation:


    We combine the symbols and add the values. For example, III is three ones, which
    is 3. Another example XV ten followed by a five, which is 15.


    # The subtractive notation:


    Four characters are avoided being repeated in succession (such as III). Instead,
    Using the symbol I could appear before V and X to signify 4 (IV) and 9 (IX) respectively.
    Using the pattern, we observe that X appears before L and C to signify 40 (XL)
    and 90 (XC). The same pattern could be applied to C that is placed before D and
    M.


    With our understanding of roman numerals, we have to decide how to extract the
    digits from the integer. We extract from right to left (the least significant
    digit) or from left to right (the most significant digit)?


    If digits are extracted from right to left, we have to append the symbols in reversed
    order. Extracting digits from left to right seem more natural. It is also trickier
    but if we know the maximum number of digits could the number have in advance,
    which we do – The number is within the range from 1 to 3999.'
