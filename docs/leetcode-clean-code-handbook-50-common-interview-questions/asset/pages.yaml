    \n**add – O(1) runtime, find – O(n) runtime, O(n) space – Store input in hash\
    \ table:**\n\nA simpler approach is to store each input into a hash table. To\
    \ find if a pair exists, just iterate through the hash table in O(n) runtime.\
    \ Make sure you are able to handle duplicates correctly."
