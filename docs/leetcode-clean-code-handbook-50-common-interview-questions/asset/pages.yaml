    Difficulty: Hard, Frequency: Low


    # Question:


    Given a singly linked list where elements are sorted in ascending order, convert
    it to a height balanced BST.


    # Hint:


    Things get a little complicated when you have a singly linked list instead of
    an array. Please note that in linked list, you no longer have random access to
    an element in $O(1)$ time.


    How about inserting nodes following the list''s order? If we can achieve this,
    we no longer need to find the middle element, as we are traverse the list while
    inserting nodes to the tree.


    $O(n \log n)$ runtime, $O(n \log n)$ stack space – Brute force:


    A naive way is to apply the previous solution from Question [29. Convert Sorted
    Array to Balanced Binary Search Tree]. In each recursive call, you would have
    to traverse half of the list''s length to find the middle element. The run time
    complexity is clearly $O(n \log n)$, where $n$ is the total number of elements
    in the list. This is because each level of recursive call requires a total of
    $\frac{n}{2}$ traversals steps in the list, and there are a total of $O(n \log
    n)$ level of nodes (ie, the height of the balanced tree).


    $O(n)$ runtime, $O(n \log n)$ stack space – Bottom-up recursion:


    As usual, the best solution requires you to think from another perspective. In
    other words, we no longer create nodes in the tree using the top-down approach.
    We create nodes bottom-up, and assign them to their parents. The bottom-up approach
    enables us to access the list in their order while creating nodes.


    Isn''t the bottom-up approach near? Each time you are stuck with the top-down
    approach, give-bottom a try. Although bottom-up is not the most natural way we
    think, it is extremely helpful in some cases. However, you should prefer top-down
    instead of bottom-up in general, since the latter is more difficult to verify
    in correctness.


    Below is the code for converting a singly linked list to a balanced BST. Please
    note that the algorithm requires the list''s length to be passed in the function''s
    parameters. The list''s length could be found in $O(n)$ time by traversing the
    entire list''s once. The recursive call traverse the list and create tree nodes
    by the list''s order, which also takes $O(n)$ time. Therefore, the overall run
    time complexity is still $O(n)$.


