  md: "# 4. Valid Palindrome\n\nCode now: https://oj.leetcode.com/problem/valid-palindrome/\
    \  Difficulty: Easy, Frequency: Medium\n\n# Question:\n\nGiven a string, determine\
    \ if it is a palindrome, considering only alphanumeric characters\nignoring cases.\n\
    \nFor example,\n\n\"A man, a plan, a canal: Panama\" is a palindrome.\n\"race\
    \ car\" is not a palindrome.\n\n# Example Questions Candidate Might Ask:\n\nQ:\
    \ What about an empty string? Is it a valid palindrome?\nA: For the purpose of\
    \ this problem, we define empty string as valid palindrome.\n\n# Solution:\n\n\
    # O(n) runtime, O(1) space:\n\nThe idea is simple, have two pointers – one at\
    \ the head while the other one at the tail.\nMove them towards each other until\
    \ they meet while skipping non-alphanumeric characters.\n\nConsider the case where\
    \ given string contains only non-alphanumeric characters.\nA valid palindrome\
    \ because the empty string is also a valid palindrome.\n\n```\npublic boolean\
    \ isPalindrome(String s) {\n    int i = 0, j = s.length() - 1;\n    while (i <\
    \ j) {\n        while (i < j && !Character.isLetterOrDigit(s.charAt(i))) i++;\n\
    \        while (i < j && !Character.isLetterOrDigit(s.charAt(j))) j--;\n     \
    \   if (Character.toLowerCase(s.charAt(i)) != Character.toLowerCase(s.charAt(j)))\
    \ {\n            return false;\n        }\n        i++; j--;\n    }\n    return\
    \ true;\n}\n```"
