    \ add(1); add(3); add(5); find(4) → true; find(7) → false\n\n# Solution:\n\n**add\
    \ – O(n) runtime, find – O(1) runtime, O(n²) space – Store pair sums in hash table:**\n\
    \ could store all possible pair sums into a hash table. The extra space needed\
    \ is in the order of O(n). You would also need the list of added numbers. Each\
    \ add operation essentially goes through the list and find new pairs that go into\
    \ the hash table. The find operation involves a single hash table lookup in O(1)\
    \ runtime.\n\nThis method is useful if the number of find operations exceeds the\
    \ number of add operations.\n\n**add – O(log n) runtime, find – O(n) runtime,\
    \ O(n) space – Binary search + Two pointers:**\n\nMaintain a sorted array of numbers.\
