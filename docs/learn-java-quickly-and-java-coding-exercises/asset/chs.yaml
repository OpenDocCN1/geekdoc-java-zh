- "# 快速学习 Java 与 Java 编码练习\n\n\n\n![](img/cover00186.jpeg)\n\n\n## Java 简介\n\n## 在\
  \ Java 中运行简单的 Hello World \n\n### 安装\n你可以从以下位置下载 java 软件：\nhttp://www.oracle.com/java/javase/downloads/index.html\
  \ 安装该产品。\n\n### 设置 Java 环境\n\n#### 在 Windows 上\n假设你将 java 安装在以下目录：\n`C:\\Program\
  \ Files\\Java`\n\n那么 java 编译器 `javac` 和 java 启动器 `java` 将位于：\n`C:\\Program Files\\\
  Java\\jdk.7.0_13\\bin`\n\n我们需要将 `C:\\Program Files\\Java\\jdk.7.0_13\\bin` 添加到系统路径中，这样我们就可以任何地方运行程序了。按照以下步骤操作：\n\
  \n1. 右键点击“电脑”图标，打开属性窗口。\n2. 点击下所示的“高级设置”。这将打开系统属性窗口。\n3. 打开系统属性并选择“高级”选项卡。点击“环境变量”按钮。\n\
  4. 你将看到类似下方的窗口。它包含两个部分，一个用户变量，另一个是系统变量。\n5. 编辑系统变量部分的 `path`。将 java bin 路径添加到系统变量\
  \ \"path\" 的值中。在添加之前，像下面所示先加一个分号：`;C:\\Program Files\\Java\\jdk.7.0_13\\bin`\n6.\
  \ 点击确定。\n\n#### 如何检查路径是否设置正确\n打开命令提示符并输入 `javac`。如果你看到输出，说明你成功设置了 java 环境。\n\n####\
  \ 在 Unix 系统上\n如果你将 java 安装在下面的目录 `/usr/java7`，那么 java 编译器 `javac` 和 java 启动器 `java`\
  \ 位于 `/usr/java7/bin` 目录。你需要如下所示更新路径：\n\n```bash\nexport PATH=/usr/java7/bin:$PATH\n\
  ```\n\n或者如下你在 Linux 的 `/etc/environment` 文件或 AIX 的 `.profile` 文件中更新路径变量：\n\n```bash\n\
  export PATH=/usr/java7/bin:$PATH\n```\n\n## Hello World \n让我们从通常打印“Hello World”的简单程序开始。\n\
  \n打开记事本，输入以下代码：\n\n```java\nclass Hello{\n    public static void main(String args[]){\n\
  \        System.out.println(\"Hello World\");\n    }\n}\n```\n\n将文件保存为 `Hello.java`。让文件保存在\
  \ `C:\\java Programs` 路径。打开命令提示符并进入文件保存的目录。\n\n### 如何编译程序\n使用以下命令：\n```bash\njavac\
  \ Hello.java\n```\n\n### 如何运行程序\n使用以下命令：\n```bash\njava Hello\n```\n在使用命令 `java\
  \ Hello` 运行程序后，你将看到输出 \"Hello World\"。\n\n### 讨论\n1. 文件名应与 `class` 名称完全相等。这里 `class`\
  \ 名称是 \"Hello\"，所以我将文件名保存为 `Hello.java`。\n\n## Java 中的数据类型\nJava 主要支持两类数据类型：\n1.\
  \ 原型类型\n2. 引用类型\n\n### 1. 原型类型\nJava 语言支持 8 种数据数据类型。它们是：\n- `byte`, `short`, `int`,\
  \ `long`\n- `float`, `double`\n\n# Java 中的运算符\n## 算术运算符\n## 算术运算符：++, --\n### 条件运算符\n\
