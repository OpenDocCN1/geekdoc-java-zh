  `cat`、`lion`、`Elephant` 属于 `Animals`（动物）类别\n\n因此，类或类别是具有相似属性和行为的对象组。\n\n# 编程术语中的对象与类\n\
  \n## 什么是对象？\n对象是相关状态和行为的软件组合包。`java` 的主要优势在于你可以将 `Java` 中的对象与现实世界的对象进行比较。因此，在 `Java`\
  \ 中操作对象非常容易。\n\n## 什么是类？\n类是用于创建对象的蓝图或原型。\n\n# 声明类\n`java` 中的 `class` 使用关键字“class”来声明。\n\
  \n### 语法\n```java\nclass ClassName{\n\n}\n```\n\n### 示例\n```java\nclass Person{\n\
  }\n```\n\n## 如何声明类的属性\n每个属性都由一个变量表示。\n\n```java\nclass Person{\nfloat height, weight;\n\
  String color, country;\n}\n```\n\n由于 `height` 和 `weight` 是实数类型值，因此它们被声明为 `float`。而\
  \ `color` 和 `country` 是 `String` 类型。因此它们被声明为 `string` 类型。\n\n**注意：**\n我们还没有讨论任何关于字符串的内容，只需记住\
  \ `string` 是一组字符。\n\n## 如何为类定义行为\n`Java` 中的每个行为由 `method`（方法）表示。\n`Method` 是一个语句块，并关联有一个名称。\n\
  \n### 语法：\n```java\nreturnType methodName(parameters){\n\n}\n```\n\n### 示例\n```java\n\
  int sum(int a, int b){\n    return (a+b);\n}\n```\n这里，`returnType` 是 `int`，`parameters`\
  \ 是 `a`, `b`。\n返回值必须与方法的返回类型匹配。\n\n在为 `Person` 类添加行为后，代码更改如下：\n\n```java\nclass\
  \ Person{\nfloat height, weight;\nString color, country;\nfloat getHeight(){\n \
  \ return height;\n}\n\nfloat getWeight(){\n  return weight;\n}\n\nString getColor(){\n\
  \  return color;\n}\n\nString getCountry(){\n  return country;\n}\n}\n```\n\n# 创建对象\n\
  \n## 创建对象的语法\n```java\nClassName objectName = new ClassName();\n```\n\n### 示例\n\
  ```java\nPerson personA = new Person();\n```\n这里 `Person` 是类名，`personA` 是为类 `Person`\
  \ 创建的对象。\n一旦定义了 `class`，你就可以为它创建任何数量的对象。\n```java\nPerson personB = new Person();\n\
  Person personC = new Person();\n```\n\n## 如何访问对象的属性\n`java` 提供了 `.` 运算符来访问对象的属性。\n\
  \n### 语法\n```java\nobjectName.propertyName = value;\n```\n\n### 示例\n```java\npersonA.height\
  \ = 6;\npersonB.height = 5.5;\n```\n\n## 如何调用行为\n就像访问属性一样，你可以调用行为。\n\n### 语法\n```java\n\
  objectName.behavior();\n```\n\n### 示例\n```java\npersonA.getHeight();\npersonB.getHeight();\n\
  ```\n\n## Person 类的完整工作示例\n```java\nclass Person{\nfloat height, weight;\nString\
  \ color, country;\nfloat getHeight(){\n  return height;\n}\n\nfloat getWeight(){\n\
  \  return weight;\n}\n\nString getColor(){\n  return color;\n}\n\nString getCountry(){\n\
  \  return country;\n}\n\npublic static void main(String args[]){\n  /* 声明两个 person\
  \ 对象 */\n  Person personA = new Person();\n  Person personB = new Person();\n  /*\
  \ 为 personA 对象设置属性 */\n  personA.height = 6;\n  personA.weight = 75;\n  personA.color\
  \ = \"White\";\n  personA.country = \"India\";\n  /* 为 personB 对象设置属性 */\n  personB.height\
  \ = 5.5;\n  personB.weight = 76;\n  personB.color = \"Black\";\n  personB.country\
  \ = \"America\";\n  /* 调用行为并打印 personA 的细节 */\n  System.out.println(\"PersonA Height\
  \ is \" + personA.getHeight());\n  System.out.println(\"PersonA Weight is \" + personA.getWeight());\n\
  \  System.out.println(\"PersonA color is \" + personA.getColor());\n  System.out.println(\"\
  PersonA country is \" + personA.getCountry());\n  /* 调用行为并打印 personB 的细节 */\n  System.out.println(\"\
  PersonB Height is \" + personB.getHeight());\n  System.out.println(\"PersonB Weight\
  \ is \" + personB.getWeight());\n  System.out.println(\"PersonB color is \" + personB.getColor());\n\
  \  System.out.println(\"PersonB country is \" + personB.getCountry());\n}\n}\n```\n\
  **输出：**\n```\nPersonA Height is 6.0\nPersonA Weight is 75.0\nPersonA color is White\n\
  PersonA country is India\nPersonB Height is 5.5\nPersonB Weight is 76.0\nPersonB\
  \ color is Black\nPersonB country is America\n```\n\n# 构造函数\n构造函数用于在创建时初始化对象。\n\n\
  ### 语法\n```java\nmodifier className(){\n}\n```\n`modifier` 是任何如 `private`、`public`、`protected`、`default`\
  \ 等内容。将在 `packages` 部分进一步讨论更多。由于构造函数没有任何 `return` 类型，因此它们与方法不同。构造函数的名称与类名相同。如果你不提供构造函数，编译器将提供默认构造函数。###\
  \ 示例\n```java\nclass Person{\nfloat height, weight;\nString color, country;\nfloat\
  \ getHeight(){\n  return height;\n}\n\nfloat getWeight(){\n  return weight;\n}\n\
  \nString getColor(){\n  return color;\n}\n\nString getCountry(){\n  return country;\n\
