  \ if-else\n###  ：：switch\n### 循环：while, do-while\n### 循环：for\n# 分支语句：break\n# 分支语句：continue\n\
  \n# 数组\n## 一维数组\n## 多维数组\n\n## 类与对象\n### 声明一个类\n# 创建对象\n# 构造函数\n### 类变量 \n\n## JAVA\
  \ 编程练习\n### 打印 hello\n### 打印和\n### 除以两个数\n# 打印结果\n# 打印乘法表\n### 计算面积\n# 交换两个变量\n\
  # 打印一个脸\n# 华氏度转摄氏度\n### 英尺转米\n### 数字相加\n### 打印年份和天数\n# 计算 (BMI)\n### 计算米制的速度\n###\
