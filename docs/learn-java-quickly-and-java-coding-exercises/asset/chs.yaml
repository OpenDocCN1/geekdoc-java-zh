  \ = new Person();\n  Person personB = new Person();\n  /* 为 personA 对象设置属性 */\n\
  \  personA.height = 6;\n  personA.weight = 75;\n  personA.color = \"White\";\n \
  \ personA.country = \"India\";\n  /* 为 personB 对象设置属性 */\n  personB.height = 5.5;\n\
  \  personB.weight = 76;\n  personB.color = \"Black\";\n  personB.country = \"America\"\
  ;\n  /* 调用行为并打印 personA 的细节 */\n  System.out.println(\"PersonA Height is \" + personA.getHeight());\n\
  \  System.out.println(\"PersonA Weight is \" + personA.getWeight());\n  System.out.println(\"\
  PersonA color is \" + personA.getColor());\n  System.out.println(\"PersonA country\
  \ is \" + personA.getCountry());\n  /* 调用行为并打印 personB 的细节 */\n  System.out.println(\"\
  PersonB Height is \" + personB.getHeight());\n  System.out.println(\"PersonB Weight\
  \ is \" + personB.getWeight());\n  System.out.println(\"PersonB color is \" + personB.getColor());\n\
  \  System.out.println(\"PersonB country is \" + personB.getCountry());\n}\n```\n\
  \n重载构造函数\n就像重载方法一样，我们也可以重载构造函数。\n\n### 示例\n```java\nclass Box{\nint width,height;\n\
  Box(){\n  width = 0;\n}\nBox(int h){\n  height = h;\n}\nBox(int w, int h){\n  width\
  \ = w;\n  height = h;\n}\n}\nclass BoxTest{\npublic static void main(String args[]){\n\
  \  Box b1 = new Box();\n  Box b2 = new Box(10);\n  Box b3 = new Box(15, 25);\n \
  \ System.out.println(\"b1 width is \" + b1.width);\n  System.out.println(\"b2 height\
  \ is \" + b2.height);\n  System.out.println(\"b3 width is \" + b3.width);\n  System.out.println(\"\
  b3 height is \" + b3.height);\n}\n}\n```\n**输出：**\n```\nb1 width is 0\nb2 height\
  \ is 10\nb3 width is 15\nb3 height is 25\n```\n\n## 一些需要记忆的点\n1. **我们可以让构造函数和方法同名吗？**\
  \ 是的，这在 `Java` 中是有效的。\n### 示例\n```java\nclass Box{\nint width,height;\nBox(){\n\
  \  width = 10;\n  height = 10;\n}\nvoid Box(){\n  System.out.println(width+\"\\\
  t\"+height);\n}\npublic static void main(String args[]){\n  Box b1 = new Box();\n\
  \  b1.Box();\n}\n}\n```\n**输出：**\n```\n10\t10\n```\n\n2. **构造函数可以抛出异常吗？** 是的，构造函数是\
