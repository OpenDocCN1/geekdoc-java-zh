    ```\n\nAlways assign a value to a float variable by appending “f” to it like below:\n\
    \n```java\nfloat floatVar = 10.09f\n```\n\notherwise compiler will throw error.\n\
    \n```java\nclass Compatible{\n    public static void main(String args[]){\n  \
    \      float floatVar = 10.09;\n        System.out.println(floatVar);\n    }\n\
    }\n```\n\nWhile compiling you will get the below error:\n\n```\nCompatible.java:3:\
    \ error: possible loss of precision\nfloat floatVar = 10.09;\n^\nrequired: float\n\
    found: double\n1 error\n```\n\nTo solve the above error define the float variable\
    \ like below:\n\n```java\nfloat floatVar = 10.09f;\n```\n\n# Operators in Java\n\
    \nAn operator is a symbol which perform an operation.\n\nAn operator is said to\
    \ be `unary`, if it performs operation on single operand.\nEx:\n```java\nint a\
    \ = 10;\na++;\n```\n\nAn operator is said to be `binary`, if it performs operation\
    \ on two operands.\nEx:\n```java\nint a=10, b=20;\nint c = a-b;\n```\n\nAn Operator\
    \ is said to be `ternary` if it perform operation on three operands.\nEx:\n```java\n\
    int a = 10, b=20, c;\nc= (a>b) ? a : b;\n```\n\nOperators in java are divided\
    \ into 4 major categories:\n- Arithmetic\n- Conditional\n- Logical\n- Bitwise\n\
    - otheroperators like (assignment, comma, etc.,)\n\n# Arithmetic Operators\n\n\
    | Operator | Performs |\n| :--- | :--- |\n| `+` | Additon (also used for String\
    \ concatenation) |\n| `-` | Subtraction |\n| `/` | Division |\n| `*` | Multiplication\
    \ |\n| `%` | Gives Remainder |\n| `++` | Pre or post increment |\n| `--` | Pre\
    \ or post decrement |\n\n```java\nclass ArithmeticOperation{\n    public static\
    \ void main(String args[]){\n        int operand1 = 30;\n        int operand2\
    \ = 10;\n        System.out.println(\"Addition of operand1 and operand2 is \"\
    \ + (operand1 + operand2));\n        System.out.println(\"Subtraction of operand1\
    \ and operand2 is \" + (operand1 - operand2));\n        System.out.println(\"\
    Multiplication of operand1 and operand2 is \" + (operand1 * operand2));\n    \
    \    System.out.println(\"Division of operand1 and operand2 is \" + (operand1\
    \ / operand2));\n        System.out.println(\"Remainder of operand1 and operand2\
    \ is \" + (operand1 % operand2));\n    }\n}\n```\n\nOutput\n```\nAddition of operand1\
    \ and operand2 is 40\nSubtraction of operand1 and operand2 is 20\nMultiplication\
    \ of operand1 and operand2 is 300\nDivision of operand1 and operand2 is 3\nRemainder\
    \ of operand1 and operand2 is 0\n```\n\n## Some points to be Noted\n\n1. Multiplication,\
    \ Division and remainder operators has more priority than Addition and Subtraction\
    \ operators.\n\n#### Example\n```java\nclass ArithmeticPriority{\n    public static\
    \ void main(String args[]){\n        int var1 = 10, var2 = 20;\n        int result\
    \ = var1+var2*var1;\n        System.out.println(result);\n        result = var1-var2/var1;\n\
    \        System.out.println(result);\n        result = var1+var2%var1;\n     \
    \   System.out.println(result);\n    }\n}\n```\n\nOutput\n```\n210\n8\n10\n```\n\
    \n#### Explanation\nfor the Expression:\n- `result = var1+var2*var1`\n  `= 10\
    \ + 20*10`\n  `= 10 +200`\n  `= 210`\n- `result = var1-var2/var1`\n  `= 10-20/10`\n\
    \  `= 10-2`\n  `= 8`\n- `result = var1+var2%var1`\n  `= 10 + 20 % 10`\n  `= 10\
    \ + 0`\n  `= 10`\n\n2. Remainder operator always returns the sign of numerator.\n\
    Ex:\n`5 % 2 = 1`\n```java\nclass RemainderEx{\n    public static void main(String\
    \ args[]){\n        int var1 = 25, var2 = 10;\n        System.out.println(var1%var2);\n\
    \    }\n}\n```\n\n## Arithmetic Operators: ++, --\n\n`++` operator increments\
    \ a value by 1\n`--` operator decrements a value by 1.\n\n### Pre increment\n\
    Syntax: `++variable`\npre increment increments the value by 1 immediately.\nExample:\n\
    ```java\nclass PreIncrement{\n    public static void main(String args[]){\n  \
    \      int var = 10;\n        System.out.println(++var);\n    }\n}\n```\nOutput\n\
    ```\n11\n```\n\n### Post increment\nSyntax: `variable++`\npost increment increments\
    \ the value by 1 after executing the current statement.\n```java\nclass PostIncrement{\n\
    \    public static void main(String args[]){\n        int var = 10;\n        System.out.println(var++);\n\
    \        System.out.println(var);\n    }\n}\n```\nOutput\n```\n10\n11\n```\n\n\
    ### Pre decrement\nSyntax: `--variable`\npre decrement decrements the value by\
    \ 1 immediately.\nExample:\n```java\nclass PreDecrement{\n    public static void\
    \ main(String args[]){\n        int var = 10;\n        System.out.println(--var);\n\
    \    }\n}\n```\nOutput\n```\n9\n```\n\n### Post decrement\nSyntax: `variable--`\n\
    post decrement decrements the value by 1 after executing the current statement.\n\
    ```java\nclass PostIncrement{ // Note: original text used PostIncrement here\n\
    \    public static void main(String args[]){\n        int var = 10;\n        System.out.println(var--);\n\
    \        System.out.println(var);\n    }\n}\n```\nWait, the text says:\n```\n\
    class PostIncrement{\n    public static void main(String args[]){\n        int\
    \ var = 10;\n        System.out.println(var--);\n        System.out.println(var);\n\
    \    }\n}\n```\nOutput\n```\n10\n9\n```\n\n### Some more Examples\n```java\nClass\
    \ ArithmeticEx{\n    public static void main(String args[]){\n        int var\
    \ = 10;\n        int result = var++ + var++;\n        System.out.println(\"value\
    \ of variable is \" + var);\n        System.out.println(\"Result is \" + result);\n\
    \        result = var++ + ++var;\n        System.out.println(\"value of variable\
    \ is \" + var);\n        System.out.println(\"Result is \" + result);\n      \
    \  result = var++ + var--;\n        System.out.println(\"value of variable is\
    \ \" + var);\n        System.out.println(\"Result is \" + result);\n        result\
    \ = --var + var--;\n        System.out.println(\"value of variable is \" + var);\n\
    \        System.out.println(\"Result is \" + result);\n    }\n}\n```\nOutput\n\
    ```\nvalue of variable is 12\nResult is 21\nvalue of variable is 14\nResult is\
    \ 26\nvalue of variable is 14\nResult is 29\nvalue of variable is 12\nResult is\
    \ 26\n```\n\n# Conditional operators\n\nConditional operators determine if one\
