    class RemainderEx{\n    public static void main(String args[]){\n        int var1\
    \ = 25, var2 = 10;\n        System.out.println(var1%var2);\n    }\n}\n```\n\n\
    ## 算术运算符： ++, --\n\n`++` 运算符将值加 1。\n`--` 运算符将值减 1。\n\n### 前增\n语法：`++variable`\n\
    前增会立即将值加 1。\n示例：\n```java\nclass PreIncrement{\n    public static void main(String\
    \ args[]){\n        int var = 10;\n        System.out.println(++var);\n    }\n\
    }\n```\n输出\n```\n11\n```\n\n### 后增\n语法：`variable++`\n后增在执行完当前语句后将值加 1。\n```java\n\
    class PostIncrement{\n    public static void main(String args[]){\n        int\
