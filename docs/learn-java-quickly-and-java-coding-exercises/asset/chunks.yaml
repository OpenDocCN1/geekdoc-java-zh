- fmt: "\n![](Images/cover00186.jpeg)\n\n# LEARN JAVA QUICKLY AND JAVA CODING EXERCISES\
    \ CODING FOR BEGINNERS WITH HANDS ON PROJECTS BY J J TAM\n\n## Introduction to\
    \ Java\n\n## Running Simple Hello World Application in Java\n\n### Installation\n\
    You can download the java software from the below location:\nhttp://www.oracle.com/java/javase/downloads/index.html\
    \ Install the product.\n\n### Setting up the java environment\n\n#### On Windows\n\
    Suppose you install the java in the below directory:\n`C:\\Program Files\\Java`\n\
    \nThen java compiler `javac` and java launcher `java` will present in:\n`C:\\\
    Program Files\\Java\\jdk.7.0_13\\bin`\n\nWe need to add `C:\\Program Files\\Java\\\
    jdk.7.0_13\\bin` to system path, then we can run our programs from where. Follow\
    \ the below steps:\n\n1. Right click computer icon, and open the properties window.\n\
    2. Click on Advanced settings as shown below. Then it will open system properties\
    \ window.\n3. Open the System properties and choose Advanced tab. Click on the\
    \ `Environment Variable` button.\n4. You will get a window like below. It contains\
    \ 2 sections, one for user variables and other for System variables.\n5. Edit\
    \ the `path` from system variables section. Append the java bin path to the value\
    \ of System variable \"path\". Before appending prepend a semicolon like below:\
    \ `;C:\\Program Files\\Java\\jdk.7.0_13\\bin`\n6. Press Ok.\n\n#### How to check\
    \ whether you set the path properly not\nOpen command prompt and type `javac`.\
    \ If you see the output, you successfully set up the java environment.\n\n####\
    \ On Unix Systems\nIf you install the java on below directory `/usr/java7`, then\
    \ java compiler `javac` and java launcher `java` present in the directory `/usr/java7/bin`.\
    \ You have to update the path like below:\n\n```bash\nexport PATH=/usr/java7/bin:$PATH\n\
    ```\n\nOR you update the path variable in `/etc/environment` file for linux or\
    \ `.profile` file in AIX like below:\n\n```bash\nexport PATH=/usr/java7/bin:$PATH\n\
    ```\n\n## Hello World Application\nLet's start by simple program usually printing\
    \ \"Hello World\".\n\nOpen notepad, and type the below code:\n\n```java\nclass\
    \ Hello{\n    public static void main(String args[]){\n        System.out.println(\"\
    Hello World\");\n    }\n}\n```\n\nSave the file as `Hello.java`. Let the file\
    \ saved in location `C:\\java Programs`. Open command prompt and goto to the directory\
    \ where the file is saved.\n\n### How to compile the Program\nUse the below command:\n\
    ```bash\njavac Hello.java\n```\n\n### How to run the Program\nUse the below command:\n\
    ```bash\njava Hello\n```\nAfter you run the program with the command `java Hello`,\
    \ you will see the output \"Hello World\".\n\n### Discussion\n1. File name should\
    \ be exactly equal with `class` Name. Here `class` name is \"Hello\", so i saved\
    \ the file name as `Hello.java`.\n\n## Data Types in Java\nJava supports mainly\
    \ two categories of Data Types:\n1. Primitive Types\n2. Reference Types\n\n###\
    \ 1. Primitive Types\nJava language supports 8 primitive types of data. Those\
    \ are:\n- `byte`, `short`, `int`, `long`\n- `float`, `double`\n\n## Operators\
    \ in Java\n### Arithmetic Operators\n#### Arithmetic Operators: ++, --\n### Conditional\
    \ operators\n### Logical Operators\n### Bit Wise Operators\n### Other Operators\
    \ in Java\n\n## Control flow statements\n### Decision Making: if-then, if-else,\
    \ if-else if-else\n### Decision Making: switch\n### Looping: while, do-while\n\
    ### Looping: for\n### Branching statement: break\n### Branching statement: continue\n\
    \n## Arrays\n### One Dimensional Array\n### Multi Dimensional Arrays\n\n## Classes\
    \ and Objects\n### Declaring a class\n### Creating Object\n### Constructors\n\
    ### class variables \n\n## JAVA CODING EXERCISES\n### Print hello\n### Print the\
    \ sum\n### Divide two numbers\n### Print the result\n### Print multiplication\
    \ table\n### Find the area\n### Swap two variables\n### Print a face\n### Fahrenheit\
    \ to Celsius degree\n### Inches to meters\n### Adds all the digits\n### Print\
    \ the number of years and days\n### Compute (BMI)\n### Calculate speed in meters\n\
    ### Divide the two specified integers\n### Multiply two specified integers\n###\
    \ Print the sum\n### Find the greatest of three numbers\n### Display the multiplication\
    \ table\n### Display the pattern\n### Print a pattern like a pyramid\n### Display\
    \ the number rhombus structure\n"
