  trans: "\n\n![](img/cover00186.jpeg)\n\n# 快速学习 Java 与初学者编程练习：带实战项目的编程 J J TAM 著\n\
    \n## Java 简介\n\n## 在 Java 中运行简单的 Hello World \n\n### 安装\n你可以从以下位置下载 java 软件：\n\
    http://www.oracle.com/java/javase/downloads/index.html 安装该产品。\n\n### 设置 Java 环境\n\
    \n#### 在 Windows 上\n假设你将 java 安装在以下目录：\n`C:\\Program Files\\Java`\n\n那么 java 编译器\
    \ `javac` 和 java 启动器 `java` 将位于：\n`C:\\Program Files\\Java\\jdk.7.0_13\\bin`\n\
    \n我们需要将 `C:\\Program Files\\Java\\jdk.7.0_13\\bin` 添加到系统路径中，这样我们就可以任何地方运行程序了。按照以下步骤操作：\n\
    \n1. 右键点击“电脑”图标，打开属性窗口。\n2. 点击下所示的“高级设置”。这将打开系统属性窗口。\n3. 打开系统属性并选择“高级”选项卡。点击“环境变量”按钮。\n\
    4. 你将看到类似下方的窗口。它包含两个部分，一个用户变量，另一个是系统变量。\n5. 编辑系统变量部分的 `path`。将 java bin 路径添加到系统变量\
    \ \"path\" 的值中。在添加之前，像下面所示先加一个分号：`;C:\\Program Files\\Java\\jdk.7.0_13\\bin`\n\
    6. 点击确定。\n\n#### 如何检查路径是否设置正确\n打开命令提示符并输入 `javac`。如果你看到输出，说明你成功设置了 java 环境。\n\n\
    #### 在 Unix 系统上\n如果你将 java 安装在下面的目录 `/usr/java7`，那么 java 编译器 `javac` 和 java 启动器\
    \ `java` 位于 `/usr/java7/bin` 目录。你需要如下所示更新路径：\n\n```bash\nexport PATH=/usr/java7/bin:$PATH\n\
    ```\n\n或者如下你在 Linux 的 `/etc/environment` 文件或 AIX 的 `.profile` 文件中更新路径变量：\n\n```bash\n\
    export PATH=/usr/java7/bin:$PATH\n```\n\n## Hello World \n让我们从通常打印“Hello World”的简单程序开始。\n\
    \n打开记事本，输入以下代码：\n\n```java\nclass Hello{\n    public static void main(String args[]){\n\
    \        System.out.println(\"Hello World\");\n    }\n}\n```\n\n将文件保存为 `Hello.java`。让文件保存在\
    \ `C:\\java Programs` 路径。打开命令提示符并进入文件保存的目录。\n\n### 如何编译程序\n使用以下命令：\n```bash\n\
    javac Hello.java\n```\n\n### 如何运行程序\n使用以下命令：\n```bash\njava Hello\n```\n在使用命令\
    \ `java Hello` 运行程序后，你将看到输出 \"Hello World\"。\n\n### 讨论\n1. 文件名应与 `class` 名称完全相等。这里\
    \ `class` 名称是 \"Hello\"，所以我将文件名保存为 `Hello.java`。\n\n## Java 中的数据类型\nJava 主要支持两类数据类型：\n\
    1. 原型类型\n2. 引用类型\n\n### 1. 原型类型\nJava 语言支持 8 种数据数据类型。它们是：\n- `byte`, `short`,\
    \ `int`, `long`\n- `float`, `double`\n\n## Java 中的运算符\n### 算术运算符\n#### 算术运算符：++,\
    \ --\n### 条件运算符\n### 逻辑运算符\n### 位运算符\n### Java 中的其他运算符\n\n## 控制流语句\n### 决策：if-then,\
    \ if ifelse, if-else if-else\n###  ：：switch\n### 循环：while, do-while\n### 循环：for\n\
    ### 分支语句：break\n### 分支语句：continue\n\n## 数组\n### 一维数组\n### 多维数组\n\n## 类与对象\n###\
    \ 声明一个类\n### 创建对象\n### 构造函数\n### 类变量 \n\n## JAVA 编程练习\n### 打印 hello\n### 打印和\n\
    ### 除以两个数\n### 打印结果\n### 打印乘法表\n### 计算面积\n### 交换两个变量\n### 打印一个脸\n### 华氏度转摄氏度\n\
    ### 英尺转米\n### 数字相加\n### 打印年份和天数\n### 计算 (BMI)\n### 计算米制的速度\n### 除以两个指定的整数\n###\
    \ 乘以两个指定的整数\n### 打印和\n### 找出三个数中的最大值\n### 显示乘法表\n### 显示图案\n### 打印金字塔形状图案\n###\
    \ 显示数字菱形结构\n\n"
- fmt: "\n- `boolean`\n- `char`\n- `byte`, `short`, `int` and `long` are used to store\
    \ integer values\n- `float` and `double` are used to store real values.\n- `Boolean`\
    \ is used to store true or false values\n- `char` is used to store single character.\n\
    \n# How to define variable\n\n### Syntax:\n`dataType variableName = value;`\n\n\
    ### Example:\n```\nint intVariable = 10;\n```\nHere:\n- `dataType` is `int`\n\
    - `variableName` is `intVariable`\n- `value` is `10`\n\nA variable is a named\
    \ memory location, which holds a value.\n\n### Naming convention to define a variable\n\
    1. A variable name must start with a character or underscore.\n2. Variable name\
    \ can contain alpha numeric characters.\n3. Variable names shouldn't be a reserved\
    \ or keyword of `java`.\n4. By convention a variable name starts with small letter,\
    \ and each sub-sequent word starts with a capital letter.\n   Ex: `noOfChar`,\
    \ `mySalary` etc.,\n\n# Java Keywords\nKeyword is a reserved word, which has special\
    \ meaning defined for it.\n\n| abstract | continue | for | New | switch |\n\n\
    Note: All keywords are in lower case only\n\n```java\n/* Simple Program to Print\
    \ the variable values */\nclass DataTypes{\n    public static void main(String\
    \ args[]){\n        byte byteVariable = 10;\n        short shortVariable = 20;\n\
    \        int intVariable = 30;\n        long longVariable = 40;\n        float\
    \ floatVariable = 10;\n        double doubleVariable = 20.123;\n        boolean\
    \ booleanVariable = false;\n        char charVariable ='A';\n        System.out.println(\"\
    ******************************************\");\n        System.out.println(\"\
    Value Of byte Variable is \" + byteVariable);\n        System.out.println(\"Value\
    \ Of short Variable is \" + shortVariable);\n        System.out.println(\"Value\
    \ Of int Variable is \" + intVariable);\n        System.out.println(\"Value Of\
    \ long Variable is \" + longVariable);\n        System.out.println(\"Value Of\
    \ float Variable is \" + floatVariable);\n        System.out.println(\"Value Of\
    \ double Variable is \" + doubleVariable);\n        System.out.println(\"Value\
    \ Of boolean Variable is \" + booleanVariable);\n        System.out.println(\"\
    Value Of char Variable is \" + charVariable);\n        System.out.println(\"******************************************\"\
    );\n    }\n}\n```\n\n### Output\n```\n******************************************\n\
    Value Of byte Variable is 10\nValue Of short Variable is 20\nValue Of int Variable\
    \ is 30\nValue Of long Variable is 40\nValue Of float Variable is 10.0\nValue\
    \ Of double Variable is 20.123\nValue Of boolean Variable is false\nValue Of char\
    \ Variable is A\n******************************************\n```\n\n# Reference\
    \ Types\nIn `java`, `Strings`, `Arrays` and `Objects` are considered to be reference\
    \ types. Will discuss more about these in later posts.\n\n# Some Points to Remember\n\
    1. Like many other languages `java` doesn't support unsigned numbers. There is\
    \ no unsigned specifier in `java`.\n\n```java\nclass UnsignedEx{\nunsigned int\
    \ a;\n}\n```\nWhen you try to compile the above class, below error is thrown:\n\
    ```\nUnsignedEx.java:2: error: <identifier> expected\n  unsigned int a;\n    ^\n\
    UnsignedEx.java:2: error: <identifier> expected\n  unsigned int a;\n    ^\n2 errors\n\
    ```\n\n2. In `java` all the `bytes`, `shorts` are promoted to `int` before performing\
    \ operations on them, So we need to explicitly cast them.\n\n```java\nclass ConversionEx{\n\
    \    public static void main(String args[]){\n        byte b1 = 1;\n        byte\
    \ b2 = 2;\n        byte b = (b1 + b2);\n        System.out.println(b);\n     \
    \   short s1 = 1;\n        short s2 = 2;\n        short s = (s1 + s2);\n     \
    \   System.out.println(s);\n    }\n}\n```\nWhen you tries to compile the above\
    \ program, compiler throws the below error:\n```\nConversionEx.java:6: error:\
    \ possible loss of precision\nbyte = (b1 + b2);\n^\nrequired: byte\nfound: int\n\
    ConversionEx.java:10: error: possible loss of precision\nshort s = (s1 + s2);\n\
    ^\nrequired: short\nfound: int\n2 errors\n```\nTo make the program fine, we need\
    \ to explicitly cast after performing the operation:\n```java\nclass ConversionEx{\n\
    \    public static void main(String args[]){\n        byte b1 = 1;\n        byte\
    \ b2 = 2;\n        byte b = (byte)(b1 + b2);\n        System.out.println(b);\n\
    \        short s1 = 1;\n        short s2 = 2;\n        short s = (short)(s1 +\
    \ s2);\n        System.out.println(s);\n    }\n}\n```\n**Output**\n`3`\n\n3. In\
    \ `java`, if one of the operand is `double`, then other promoted as `double`,\
    \ and the final result will be `double`.\n\n```java\nclass ConversionEx{\n   \
    \ public static void main(String args[]){\n        float f1 = 1.1f;\n        double\
    \ f2 = 1.2f;\n        float f = (f1 + f2);\n        System.out.println(f);\n \
    \   }\n}\n```\nWhen you tries to compile the above program, compiler throws the\
    \ below error:\n```\nConversionEx.java:6: error: possible loss of precision\n\
    float f = (f1 + f2);\n^\nrequired: float\nfound: double\n1 error\n```\nTo make\
    \ the program run, cast the result to `float`:\n```java\nclass ConversionEx{\n\
    \    public static void main(String args[]){\n        float f1 = 1.1f;\n     \
    \   double f2 = 1.2f;\n        float f = (float)(f1 + f2);\n        System.out.println(f);\n\
    \    }\n}\n```\n**Output**\n`2.3000002`\n\n# More About primitive types\n### 1.\
