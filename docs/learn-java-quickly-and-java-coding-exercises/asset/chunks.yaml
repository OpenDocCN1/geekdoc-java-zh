  trans: "\n\nJava 提供了三个逻辑运算符：它们是 `&&`（与）、`||`（或）和 `!`（非）。\n\n- 逻辑与也被称为条件与。\n- 逻辑或也被称为条件或。\n\
    - 逻辑与、`OR` 被称为短路运算符，很快就会看到为什么这些被称为短路运算符。\n\n## 逻辑与运算符\n\n| 操作数 1 | 操作数 2 | 求值结果为\
    \ |\n| :--- | :--- | :--- |\n| TRUE | TRUE | TRUE |\n| TRUE | FALSE | FALSE |\n\
    | FALSE | TRUE | FALSE |\n| FALSE | FALSE | FALSE |\n\n如上表所示，当两个操作数的求值均为 `true`\
    \ 时，`&&` 运算符返回 `true`，否则返回 `false`。\n\n### 示例\n```java\nclass AndEx{\n    public\
    \ static void main(String args[]){\n        boolean operand1 = true;\n       \
    \ boolean operand2 = true;\n        System.out.println((operand1 && operand2));\n\
    \        operand1 = true;\n        operand2 = false;\n        System.out.println((operand1\
    \ && operand2));\n        operand1 = false;\n        operand2 = true;\n      \
    \  System.out.println((operand1 && operand2));\n        operand1 = false;\n  \
    \      operand2 = false;\n        System.out.println((operand1 && operand2));\n\
    \    }\n}\n```\n\n### 输出\n```\ntrue\nfalse\nfalse\nfalse\n```\n\n### 为什么逻辑与被称为短路运算符\n\
    因为如果表达式中的第一个语句求值为为 `false`，那么 `java` 就不会求值整个表达式。因此，逻辑与被称为短路与。\n\n### 示例\n```java\n\
    class ShortCircuitAnd{\n    public static void main(String args[]){\n        int\
    \ a = 10, b=21;\n        if( (a>b) && (a++ > b) ){\n            System.out.println(\"\
    This statement not evaluated\");\n        }\n        System.out.println(\"a is\
    \ not incremented \" + a);\n        if( (a<b) && (a++ < b) ){\n            System.out.println(\"\
    This statement is evaluated\");\n        }\n        System.out.println(\"a is\
    \ not incremented \" + a);\n    }\n}\n```\n\n### 输出\n```\na is not incremented\
    \ 10\nThis statement is evaluated\na is not incremented 11\n```\n\n### 观察\n在表达式\
    \ `(a>b) && (a++ > b)` 中，`a>b` 为 `false`，所以 `&&` 运算符不会求值表达式中的第二个语句，因此 `a` 没有增加。\n\
    \n## 逻辑或运算符\n\n| 操作数 1 | 操作数 2 | 求值结果为 |\n| :--- | :--- | :--- |\n| TRUE | TRUE\
    \ | TRUE |\n| TRUE | FALSE | TRUE |\n| FALSE | TRUE | TRUE |\n| FALSE | FALSE\
    \ | FALSE |\n\n如上表所示，当任意一个操作数求值为 `true` 时，`||` 运算符返回 `true`，否则返回 `false`。\n\n\
    ### 示例\n```java\nclass OrEx{\n    public static void main(String args[]){\n  \
    \      boolean operand1 = true;\n        boolean operand2 = true;\n        System.out.println((operand1\
    \ || operand2));\n        operand1 = true;\n        operand2 = false;\n      \
    \  System.out.println((operand1 || operand2));\n        operand1 = false;\n  \
    \      operand2 = true;\n        System.out.println((operand1 || operand2));\n\
    \        operand1 = false;\n        operand2 = false;\n        System.out.println((operand1\
    \ || operand2));\n    }\n}\n```\n\n### 输出\n```\ntrue\ntrue\ntrue\nfalse\n```\n\
    \n### 为什么逻辑或被称为短路\n因为如果第一个语句求值为 `true`，`java` 就不会求值整个表达式。因此，逻辑或被称为短路或。\n\n###\
    \ 示例\n```java\nclass ShortCircuitOr{\n    public static void main(String args[]){\n\
    \        int a = 10, b=21;\n        if( (a<b) || (a++ < b) ){\n            System.out.println(\"\
    This statement evaluated\");\n        }\n        System.out.println(\"a is not\
    \ incremented \" + a);\n        if( (a>b) || (a++ > b) ){\n            System.out.println(\"\
    This statement is evaluated\");\n        }\n        System.out.println(\"a is\
    \ incremented \" + a);\n    }\n}\n```\n\n### 输出\n```\nThis statement evaluated\n\
    a is not incremented 10\na is incremented 11\n```\n\n## 逻辑非运算符\n\n| 操作数 | 求值结果为\
    \ |\n| :--- | :--- |\n| FALSE | TRUE |\n| TRUE | FALSE |\n\n如果操作数为 `FALSE`，`!`\
    \ 运算符求值为 `TRUE`。如果操作数为 `TRUE`，`!` 运算符求值为 `FALSE`。\n\n### 示例\n```java\nclass LogicalNot{\n\
    \    public static void main(String args[]){\n        boolean a = true;\n    \
    \    System.out.println(!a);\n        a = false;\n        System.out.println(!a);\n\
    \    }\n}\n```\n\n### 输出\n```\nfalse\ntrue\n```\n\n## 位运算符\n\nJava 语言提供了对整型类型执行位运算和移位操作的运算符。\n\
    \n| 运算符 | 描述 |\n| :--- | :--- |\n| `~` | 反反位模式 |\n| `<<` | 执行左移 |\n| `>>` | 执行右移\
    \ |\n| `>>>` | 执行无符号右移 |\n| `&` | 位与 |\n| `\\|` | 位或 |\n| `^` | 位异异 |\n\n在讨论位运算符之前，我们先看位运算。\n\
    \n### 1 补码\n如果第一个语句求值为 `false`，那么它求值为 `true`。\n\n### 取反 (~)\n取反运算符反转位模式。\n\n###\
    \ 2 补码\n负数以 2 补码存储。\n\n### 1 补码\n取反运算符反转位模式。\n\n例如：\n`a = 7;`\n`a` 的二进制格式为 `00000111`\n\
    `~(a)` 的二进制格式为 `11111000`。\n\n### 2 补码\n`8` 的 2 补码是 `00001000`。\n\n### 示例\n```java\n\
    class BitWiseEx{\n    public static void main(String args[]){\n        byte a\
    \ = 7;\n        System.out.println(a);\n        System.out.println(~a);\n    }\n\
    }\n```\n\n### 输出\n```\n7\n-8\n```\n\n### 左移 (<<)\n左移运算符将所有位向左移动，即使值翻倍。\n\n语法：\n\
    `expression << n`\n将 `expression` 向左移动 `n` 位。\n\n例如：\n`1 << 1` = `2`\n`1 << 2`\
    \ = `4`\n`1 << 3` = `8`\n`1 << 4` = `16`\n`1 << 5` = `32`\n`1 << 6` = `64`\n`1\
    \ << 7` = `128`\n`1 << 8` = `256`\n`1 << 9` = `512`\n\n### 示例\n```java\nclass\
    \ LeftShiftEx{\n    public static void main(String args[]){\n        int a = 1;\n\
    \        System.out.println(a << 1);\n        System.out.println(a << 2);\n  \
    \  }\n}\n```\n\n### 输出\n```\n2\n4\n```\n\n### 右移 (>>)\n右移运算符将所有位向右移动，即使值减半。\n\n\
    语法：\n`expression >> n`\n将 `expression` 向右移动 `n` 位。\n\n例如：\n`128 >> 1` = `64`\n\
    `128 >> 2` = `32`\n`128 >> 3` = `16`\n`128 >> 4` = `8`\n`128 >> 5` = `4`\n`128\
    \ >> 6` = `2`\n`128 >> 7` = `1`\n\n### 示例\n```java\nclass RightShiftEx{\n    public\
    \ static void main(String args[]){\n        int a = 128;\n        System.out.println(a\
    \ >> 1);\n        System.out.println(a >> 2);\n    }\n}\n```\n\n### 输出\n```\n\
    64\n32\n```\n"
