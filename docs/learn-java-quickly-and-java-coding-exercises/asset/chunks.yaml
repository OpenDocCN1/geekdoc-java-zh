- fmt: "\nJava provides three logical operators: these are `&&` (AND), `||` (OR),\
    \ and `!` (NOT).\n\n- Logical AND is also called Conditional AND.\n- Logical OR\
    \ is also called Conditional OR.\n- Logical AND, `OR` are called Short circuit\
    \ operators, will see why these are called short circuit soon.\n\n## Logical AND\
    \ Operator\n\n| Operand1 | Operand2 | Evaluates To |\n| :--- | :--- | :--- |\n\
    | TRUE | TRUE | TRUE |\n| TRUE | FALSE | FALSE |\n| FALSE | TRUE | FALSE |\n|\
    \ FALSE | FALSE | FALSE |\n\nAs shown in the above table, the `&&` operator returns\
    \ `true` if both the operands evaluate to `true`, otherwise returns `false`.\n\
    \n### Example\n```java\nclass AndEx{\n    public static void main(String args[]){\n\
    \        boolean operand1 = true;\n        boolean operand2 = true;\n        System.out.println((operand1\
    \ && operand2));\n        operand1 = true;\n        operand2 = false;\n      \
    \  System.out.println((operand1 && operand2));\n        operand1 = false;\n  \
    \      operand2 = true;\n        System.out.println((operand1 && operand2));\n\
    \        operand1 = false;\n        operand2 = false;\n        System.out.println((operand1\
    \ && operand2));\n    }\n}\n```\n\n### Output\n```\ntrue\nfalse\nfalse\nfalse\n\
    ```\n\n### Why Logical AND is called short circuit operator\nSince if the first\
    \ statement in the expression evaluates to `false`, then `java` won't evaluate\
    \ the entire expression. So Logical AND is called short circuit AND.\n\n### Example\n\
    ```java\nclass ShortCircuitAnd{\n    public static void main(String args[]){\n\
    \        int a = 10, b=21;\n        if( (a>b) && (a++ > b) ){\n            System.out.println(\"\
    This statement not evaluated\");\n        }\n        System.out.println(\"a is\
    \ not incremented \" + a);\n        if( (a<b) && (a++ < b) ){\n            System.out.println(\"\
    This statement is evaluated\");\n        }\n        System.out.println(\"a is\
    \ not incremented \" + a);\n    }\n}\n```\n\n### Output\n```\na is not incremented\
    \ 10\nThis statement is evaluated\na is not incremented 11\n```\n\n### Observation\n\
    In the expression `(a>b) && (a++ > b)`, `a>b` is `false`, so the `&&` operator\
    \ won't evaluate the second statement in the expression, so `a` is not incremented.\n\
    \n## Logical OR Operator\n\n| Operand1 | Operand2 | Evaluates To |\n| :--- | :---\
    \ | :--- |\n| TRUE | TRUE | TRUE |\n| TRUE | FALSE | TRUE |\n| FALSE | TRUE |\
    \ TRUE |\n| FALSE | FALSE | FALSE |\n\nAs shown in the above table, the `||` operator\
    \ returns `true` if any of the operand evaluates to `true`, otherwise returns\
    \ `false`.\n\n### Example\n```java\nclass OrEx{\n    public static void main(String\
    \ args[]){\n        boolean operand1 = true;\n        boolean operand2 = true;\n\
    \        System.out.println((operand1 || operand2));\n        operand1 = true;\n\
    \        operand2 = false;\n        System.out.println((operand1 || operand2));\n\
    \        operand1 = false;\n        operand2 = true;\n        System.out.println((operand1\
    \ || operand2));\n        operand1 = false;\n        operand2 = false;\n     \
    \   System.out.println((operand1 || operand2));\n    }\n}\n```\n\n### Output\n\
    ```\ntrue\ntrue\ntrue\nfalse\n```\n\n### Why Logical OR is called short circuit\n\
    Since if the first statement evaluates to `true`, `java` won't evaluate the entire\
    \ expression. So Logical OR is called short circuit OR.\n\n### Example\n```java\n\
    class ShortCircuitOr{\n    public static void main(String args[]){\n        int\
    \ a = 10, b=21;\n        if( (a<b) || (a++ < b) ){\n            System.out.println(\"\
    This statement evaluated\");\n        }\n        System.out.println(\"a is not\
    \ incremented \" + a);\n        if( (a>b) || (a++ > b) ){\n            System.out.println(\"\
    This statement is evaluated\");\n        }\n        System.out.println(\"a is\
    \ incremented \" + a);\n    }\n}\n```\n\n### Output\n```\nThis statement evaluated\n\
    a is not incremented 10\na is incremented 11\n```\n\n## Logical NOT operator\n\
    \n| Operand | Evaluate To |\n| :--- | :--- |\n| FALSE | TRUE |\n| TRUE | FALSE\
    \ |\n\nIf the operand is `FALSE`, `!` operator evaluates to `TRUE`. If the operand\
    \ is `TRUE`, `!` operator evaluates to `FALSE`.\n\n### Example\n```java\nclass\
    \ LogicalNot{\n    public static void main(String args[]){\n        boolean a\
    \ = true;\n        System.out.println(!a);\n        a = false;\n        System.out.println(!a);\n\
    \    }\n}\n```\n\n### Output\n```\nfalse\ntrue\n```\n\n## Bit Wise Operators\n\
    \nThe Java language provides operators that perform bit wise and shift operations\
    \ on integral types.\n\n| Operator | Description |\n| :--- | :--- |\n| `~` | Inverts\
    \ a bit pattern |\n| `<<` | Perform Left shift |\n| `>>` | Perform Right Shift\
    \ |\n| `>>>` | Perform unsigned right shift |\n| `&` | Bit wise AND |\n| `\\|`\
    \ | Bit wise OR |\n| `^` | Bit wise Exclusive OR |\n\nBefore discussing bit wise\
    \ operators, we will discuss Binary representations of a number.\n\n### 1's Complement\n\
    1's complement simply inverts the bits: if the bit is set to zero, it sets the\
    \ bit to `1` and if the bit is set to `1` it sets the bit to `0`.\n\nExample:\n\
    `8` in binary is `00000000`\n`1's complement(8)` = `11111111`\n\n### 2's Complement\n\
    Negative numbers are stored in 2's complement form. i.e., `-8` is 2's complement\
    \ of `8`.\n2's complement is sum of (`1's complement of a number` + `1`).\n\n\
    Example:\n`8` in binary = `00000000`\n`1's complement(8)` = `11111111`\n`2's complement(8)`\
    \ = `11111111` + `1` = `11111000`\nTherefore for `-8` in 2's complement form is\
    \ `11111000`.\n\n### Inversion (~)\nInversion operator change the bit value to\
    \ zero if it is one and change the bit value to one if it is zero.\n\nExample:\n\
    `byte a = 7;`\n`a` in binary format is `00000111`\n`~(a)` in binary format is\
    \ `11111000`\n`~(a)` represents `-8` in binary format.\n\n### Example Code\n```java\n\
    class BitWiseEx{\n    public static void main(String args[]){\n        byte byteVar\
    \ = 7;\n        System.out.println(\"Value of Byte variable is \" + byteVar);\n\
    \        System.out.println(\"Value of Byte variable after inversion is \" + ~(byteVar));\n\
    \    }\n}\n```\n\n### Output\n```\nValue of Byte variable is 7\nValue of Byte\
    \ variable after inversion is -8\n```\n\n### Bit Wise Left Shift(<<)\nLeft shift\
    \ operator simply shifts all the bits to the left, i.e., it doubles the value.\n\
    \nSyntax:\n`expression << n`\nshifts `expression` to the left by `n` bits.\n\n\
    Example:\n`1 << 1` = `2`\n`1 << 2` = `4`\n`1 << 3` = `8`\n`1 << 4` = `16`\n`1\
    \ << 5` = `32`\n`1 << 6` = `64`\n`1 << 7` = `128`\n`1 << 8` = `256`\n`1 << 9`\
    \ = `512`\n\n### Example Code\n```java\nclass BitWiseEx{\n    public static void\
    \ main(String args[]){\n        byte byteVar = 7;\n        System.out.println(\"\
    Value of Byte variable is \" + byteVar);\n        System.out.println(\"Value of\
    \ Byte variable after inversion is \" + ~(byteVar));\n    }\n}\n```\n\n### Bit\
    \ Wise Right Shift(>>)\nRight shift operator simply shifts all the bits to the\
    \ right, i.e., it halves the value.\n\nSyntax:\n`expression >> n`\nshifts `expression`\
    \ to the right by `n` bits.\n\nExample:\n`128 >> 1` = `64`\n`128 >> 2` = `32`\n\
    `128 >> 3` = `16`\n`128 >> 4` = `8`\n`128 >> 5` = `4`\n`128 >> 6` = `2`\n`128\
    \ >> 7` = `1`\n"
  raw: 'Java provides three logical operators, These are &&(AND), || (OR), and !(NOT)


    Logical AND is also called Conditional AND


    Logical OR is also called Conditional OR


    Logical AND, OR are called Short circuit operators, will see why these are called
    short circuit soon.


    Logical AND Operator


    | Operand1 | Operand2 | Evaluates To |


    | TRUE | TRUE | TRUE |


    | TRUE | FALSE | FALSE |


    | FALSE | TRUE | FALSE |


    | FALSE | FALSE | FALSE |


    As shown in the above table, && operator returns true if both the operands evaluates
    to true, otherwise returns false.


    Example


    class AndEx{


    public static void main(String args[]){


      boolean operand1 = true;


      boolean operand2 = true;


      System.out.println((operand1 && operand2));


      operand1 = true;


      operand2 = false;


      System.out.println((operand1 && operand2));


      operand1 = false;


      operand2 = true;


      System.out.println((operand1 && operand2));


      operand1 = false;


      operand2 = false;


      System.out.println((operand1 && operand2));


    }


    }


    Output


    true


    false


    false


    false


    Why Logical AND is called short circuit operator


    Since if the first statement in the expression evaluates to false, then java won''t
    evaluates the entire expression. So Logical AND is called short circuit AND


    Example


    class ShortCircuitAnd{


    public static void main(String args[]){


      int a = 10, b=21;


      if( (a>b) && (a++ > b) ){


       System.out.println("This statement not evaluated");


      }


      System.out.println("a is not incremented " + a);


      if( (a<b) && (a++ < b) ){


       System.out.println("This statement is evaluated");


      }


      System.out.println("a is not incremented " + a);


    }


    }


    Output


    a is not incremented 10


    This statement is evaluated


    a is not incremented 11


    Observation


    In the expression (a>b) && (a++ > b), a>b is false, so && operator won''t evaluates
    second statement in the expression, so a is not incremented.


    Logical OR Operator


    | Operand1 | Operand2 | Evaluates To |


    | TRUE | TRUE | TRUE |


    | TRUE | FALSE | TRUE |


    | FALSE | TRUE | TRUE |


    | FALSE | FALSE | FALSE |


    As shown in the above table, || operator returns true if any of the operand evaluates
    to true, otherwise returns false.


    Example


    class OrEx{


    public static void main(String args[]){


      boolean operand1 = true;


      boolean operand2 = true;


      System.out.println((operand1 || operand2));


      operand1 = true;


      operand2 = false;


      System.out.println((operand1 || operand2));


      operand1 = false;


      operand2 = true;


      System.out.println((operand1 || operand2));


      operand1 = false;


      operand2 = false;


      System.out.println((operand1 || operand2));


    }


    }


    Output


    true


    true


    true


    false


    Why Logical OR is called short circuit operator


    Since if the first statement evaluates to true, then java won''t evaluates the
    entire expression. So Logial OR is called short circuit OR


    Example


    class ShortCircuitOr{


    public static void main(String args[]){


      int a = 10, b=21;


      if( (a<b) || (a++ < b) ){


       System.out.println("This statement evaluated");


      }


      System.out.println("a is not incremented " + a);


      if( (a>b) || (a++ > b) ){


       System.out.println("This statement is evaluated");


      }


      System.out.println("a is incremented " + a);


    }


    }


    Output


    This statement evaluated


    a is not incremented 10


    a is incremented 11


    Logical (!)NOT operator


    | Operand | Evalutes To |


    | FALSE | TRUE |


    | TRUE | FALSE |


    If the operand is FALSE, ! Operator evaluates it to TRUE


    If the operand is TRUE, ! Operator evaluates it to FALSE


    Example


    class LogicalNot{


    public static void main(String args[]){


      boolean a = true;


      System.out.println((!a));


      a = false;


      System.out.println((!a));


    }


    }


    Output


    false


    true


    # Bit Wise Operators


    The Java programming language provides operators that perform bit wise and bit
    shift operations on integral types.


    | Operator | Description |


    | ~ | Inverts a bit pattern |


    | << | Perform Left shift |


    | >> | Perform Right Shift |


    | >>> | Perform unsigned right shift |


    | & | Bit wise AND |


    | &#124; | Bit wise OR |


    | ^ | Bit wise Exclusive OR |


    Before discuss about the Bit wise operators, will discuss about Binary representations
    of a number


    1''s Complement


    1''s complement simply inverts the bits, if the bit is set to zero, it sets the
    bit to 1 and if the bit is set to 1 it sets the bit to zero.


    Ex:


    8 in binary            = 0 0 0 0 1 0 0 0


    1''s complement(8) = 1 1 1 1 0 1 1 1


    2''s complement


    Negative numbers are stored in 2''s complement form. i.e., -8 is 2''s complement
    of 8.


    2''s complement is sum of (1''s complement of a number + 1)


    Ex:


    8 in binary            = 0 0 0 0 1 0 0 0


    1''s complement(8) = 1 1 1 1 0 1 1 1


    2''s complement(8) =               (+) 1


                                                 -----------------


                                                 1 1 1 1 1 0 0 0


                                                  ----------------


    there for -8 in 2''s complement form is 11111000


    Inversion (~)


    Inversion operator change the bit value to zero, if it is one and change the bit
    value to one if it is zero.


    Example


    byte a = 7;


    a in binary format is       0 0 0 0 0 1 1 1


    ~(a) in binary format is  1 1 1 1 1 0 0 0


    ~(a) represents -8 in binary format.


    Example


    class BitWiseEx{


    public static void main(String args[]){


      byte byteVar = 7;


      System.out.println("Value of Byte variable is " + byteVar);


      System.out.println("Value of Byte variable after inversion is " + ~(byteVar));


    }


    }


    Output


    Value of Byte variable is 7


    Value of Byte variable after inversion is -8


    Bit Wise Left Shift(<<)


    Left shift operator simply shifts all the bits to one bit left, i.e, it simply
    doubles the value.


    Syntax:


        variable << n


        left shift the variable by ''n'' number of times.


        Variable << n is equals to variable = variable * 2 power n


            int var = 2;


            var << 1 = 2 * 2 power 1 = 4


            var << 2 = 2 * 2 power 2 = 8


            var << 9 = 2 * 2 power 9 = 1024


    Example


    class BitWiseEx{


    public static void main(String args[]){


      byte byteVar = 7;


      System.out.println("Value of Byte variable is " + byteVar);


      System.out.println("After shifting 1 bit left " + (byteVar<<1));


      System.out.println("After shifting 2 bits left " + (byteVar<<2));


      System.out.println("After shifting 3 bits left " + (byteVar<<3));


      System.out.println("After shifting 4 bits left " + (byteVar<<4));


      System.out.println("After shifting 5 bits left " + (byteVar<<5));


      System.out.println("After shifting 6 bits left " + (byteVar<<6));


      System.out.println("Value of Byte variable is " + byteVar);


    }


    }


    Output


    Value of Byte variable is 7


    After shifting 1 bit left 14


    After shifting 2 bits left 28


    After shifting 3 bits left 56


    After shifting 4 bits left 112


    After shifting 5 bits left 224


    After shifting 6 bits left 448


    Value of Byte variable is 7


    Bit Wise Right Shift(>>)


       Right shift operator simply shifts all the bits to one bit right, i.e, it simply
    half (divide by 2) the value


       Syntax:


       variable >> n


          right shift the variable by ''n'' number of times.


       Variable >> n is equals to variable = variable / 2 power n


       int var = 128;


       var >> 1 = 128 / (2 power 1) = 64


       var >> 2 = 128 / (2 power 2) = 32


    Example


    class BitWiseEx{


    public static void main(String args[]){


      int intVar = 128;


      System.out.println("Value of int variable is " + intVar);


      System.out.println("After shifting 1 bit Right " + (intVar>>1));


      System.out.println("After shifting 2 bits Right " + (intVar>>2));


      System.out.println("After shifting 3 bits Right " + (intVar>>3));


      System.out.println("After shifting 4 bits Right " + (intVar>>4));


      System.out.println("After shifting 5 bits Right " + (intVar>>5));


      System.out.println("After shifting 6 bits Right " + (intVar>>6));


      System.out.println("After shifting 6 bits Right " + (intVar>>7));


      System.out.println("Value of int variable is " + intVar);


    }


    }


    Output


    Value of int variable is 128


    After shifting 1 bit Right 64


    After shifting 2 bits Right 32


    After shifting 3 bits Right 16'
