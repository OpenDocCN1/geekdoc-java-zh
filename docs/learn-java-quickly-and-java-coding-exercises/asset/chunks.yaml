    \ is America\n```\n\n# 构造函数\n构造函数用于在创建时初始化对象。\n\n### 语法\n```java\nmodifier className(){\n\
    }\n```\n`modifier` 是任何如 `private`、`public`、`protected`、`default` 等内容。将在 `packages`\
    \ 部分进一步讨论更多。由于构造函数没有任何 `return` 类型，因此它们与方法不同。构造函数的名称与类名相同。如果你不提供构造函数，编译器将提供默认构造函数。###\
    \ 示例\n```java\nclass Person{\nfloat height, weight;\nString color, country;\n\
    float getHeight(){\n  return height;\n}\n\nfloat getWeight(){\n  return weight;\n\
    }\n\nString getColor(){\n  return color;\n}\n\nString getCountry(){\n  return\
    \ country;\n}\n\npublic static void main(String args[]){\n  /* 声明两个 person 对象\
    \ */\n  Person personA = new Person();\n  Person personB = new Person();\n  /*\
    \ 为 personA 对象设置属性 */\n  personA.height = 6;\n  personA.weight = 75;\n  personA.color\
    \ = \"White\";\n  personA.country = \"India\";\n  /* 为 personB 对象设置属性 */\n  personB.height\
    \ = 5.5;\n  personB.weight = 76;\n  personB.color = \"Black\";\n  personB.country\
    \ = \"America\";\n  /* 调用行为并打印 personA 的细节 */\n  System.out.println(\"PersonA\
    \ Height is \" + personA.getHeight());\n  System.out.println(\"PersonA Weight\
    \ is \" + personA.getWeight());\n  System.out.println(\"PersonA color is \" +\
    \ personA.getColor());\n  System.out.println(\"PersonA country is \" + personA.getCountry());\n\
    \  /* 调用行为并打印 personB 的细节 */\n  System.out.println(\"PersonB Height is \" + personB.getHeight());\n\
    \  System.out.println(\"PersonB Weight is \" + personB.getWeight());\n  System.out.println(\"\
    PersonB color is \" + personB.getColor());\n  System.out.println(\"PersonB country\
    \ is \" + personB.getCountry());\n}\n```\n\n重载构造函数\n就像重载方法一样，我们也可以重载构造函数。\n\n\
