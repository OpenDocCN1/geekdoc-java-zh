    # Control flow statements : Decision Making: switch


    The body of a switch statement is known as a switch block. A statement in the
    switch block can be labelled with one or more case or default labels. The switch
    statement evaluates its expression, then executes all statements that follow the
    matching case label.


    switch works with the byte, short, char, and int primitive data types. It supports enums also


