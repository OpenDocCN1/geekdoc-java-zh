    Value Of char Variable is A


    ******************************************


    Reference Types


    In java Strings, Arrays and Objects are considered to be reference types. Will
    discuss more about these in later posts.


    Some Points to Remember


    1\. Like many other languages Java doesn''t support unsigned numbers. There is
    no unsigned specifier in Java


    class UnsignedEx{


    unsigned int a;


    }


    When you try to compile the above class, below error is thrown.


    UnsignedEx.java:2: error: <identifier> expected


       unsigned int a;


        ^


    UnsignedEx.java:2: error: <identifier> expected


       unsigned int a;


       ^


    2 errors


    2\. In java all the bytes, shorts are promoted to int before performing operations
    on them, So we need to explicitly cast them.


    class ConversionEx{


        public static void main(String args[]){


            byte b1 = 1;


            byte b2 = 2;


            byte b = (b1 + b2);


            System.out.println(b);


            short s1 = 1;


            short s2 = 2;


            short s = (s1 + s2);


            System.out.println(s);


        }


    }


    When you tries to compile the above program, compiler throws the below error


    ConversionEx.java:6: error: possible loss of precision


    byte b = (b1 + b2);


    ^


    required: byte


    found:    int


    ConversionEx.java:10: error: possible loss of precision


    short s = (s1 + s2);


    ^


    required: short


    found:    int


    2 errors


    To make the program compiles fine, we need to explicitly cast, after performing
    the operation


    class ConversionEx{


        public static void main(String args[]){


            byte b1 = 1;


            byte b2 = 2;


            byte b = (byte)(b1 + b2);


            System.out.println(b);


            short s1 = 1;


            short s2 = 2;


            short s = (short)(s1 + s2);


            System.out.println(s);


        }


    }


    Output


    3


    3


    3\. In Java, if one of the operand is double, then other also promoted as double,
    and the final result will be double


    Example


    class ConversionEx{


        public static void main(String args[]){


            float f1 = 1.1f;


            double f2 = 1.2f;


            float f = (f1 + f2);


            System.out.println(f);


        }


    }


    When you tries to compile the above program, compiler throws the below error


       ConversionEx.java:6: error: possible loss of precision


          float f = (f1 + f2);


          ^


          required: float


          found: double


    1 error


    To make the program run, cast the result to float.


    class ConversionEx{


        public static void main(String args[]){


            float f1 = 1.1f;


            double f2 = 1.2f;


            float f = (float)(f1 + f2);


            System.out.println(f);


        }


    }


    Output


    2.3000002


