    ```\n\n# Java 中的运算符\n\n运算符是执行某种操作的符号。\n\n如果一个运算符对单个操作数执行操作，则称为 `unary`（一元运算符）。\n\
    例如：\n```java\nint a = 10;\na++;\n```\n\n如果一个运算符对两个操作数执行操作，则称为 `binary`（二元运算符）。\n\
    例如：\n```java\nint a=10, b=20;\nint c = a-b;\n```\n\n如果一个运算符对三个操作数执行操作，则称为 `ternary`（三元运算符）。\n\
    例如：\n```java\nint a = 10, b=20, c;\nc= (a>b) ? a : b;\n```\n\nJava 中的运算符分为 4 大类：\n\
    - 算术运算符\n- 条件运算符\n- 逻辑运算符\n- 位运算符\n- 其他运算符（如赋值、逗号等）\n\n# 算术运算符\n\n| 运算符 | 执行操作\
    \ |\n| :--- | :--- |\n| `+` | 加法（也用于字符串拼接） |\n| `-` | 减法 |\n| `/` | 除法 |\n| `*`\
    \ | 乘法 |\n| `%` | 取余数 |\n| `++` | 前增或后增 |\n| `--` | 前减或后减 |\n\n```java\nclass\
    \ ArithmeticOperation{\n    public static void main(String args[]){\n        int\
    \ operand1 = 30;\n        int operand2 = 10;\n        System.out.println(\"Addition\
    \ of operand1 and operand2 is \" + (operand1 + operand2));\n        System.out.println(\"\
    Subtraction of operand1 and operand2 is \" + (operand1 - operand2));\n       \
    \ System.out.println(\"Multiplication of operand1 and operand2 is \" + (operand1\
    \ * operand2));\n        System.out.println(\"Division of operand1 and operand2\
    \ is \" + (operand1 / operand2));\n        System.out.println(\"Remainder of operand1\
    \ and operand2 is \" + (operand1 % operand2));\n    }\n}\n```\n\n输出\n```\nAddition\
    \ of operand1 and operand2 is 40\nSubtraction of operand1 and operand2 is 20\n\
    Multiplication of operand1 and operand2 is 300\nDivision of operand1 and operand2\
    \ is 3\nRemainder of operand1 and operand2 is 0\n```\n\n## 注意事项\n\n1. 乘法、除法和取数运算符的优先级高于加法和减法运算符。\n\
    \n#### 示例\n```java\nclass ArithmeticPriority{\n    public static void main(String\
    \ args[]){\n        int var1 = 10, var2 = 20;\n        int result = var1+var2*var1;\n\
    \        System.out.println(result);\n        result = var1-var2/var1;\n     \
    \   System.out.println(result);\n        result = var1+var2%var1;\n        System.out.println(result);\n\
    \    }\n}\n```\n\n输出\n```\n210\n8\n10\n```\n\n#### 解析\n对于表达式：\n- `result = var1+var2*var1`\n\
    \  `= 10 + 20*10`\n  `= 10 +200`\n  `= 210`\n- `result = var1-var2/var1`\n  `=\
