  - "[PAGE 32]\n\n+   - java.time.OffsetTime\n\n+   - java.time.ZonedonedDateTime\n\
    \nWhen you don't provide any additional mapping information, Hibernate maps entity\
    \ attributes of these types to database columns with the same name. It maps the\
    \ entity attributes **id**, **version**, and **firstName** in the following code\
    \ snippet to the database columns **id**, **version**, and **firstname.\n\nIf\
    \ you want to map an entity attribute to a column with a different name, you can\
    \ annotate it with @Column and provide the column name as the **name** attribute.\
    \ I use this annotation in the following code snippet to map the **lastName**\
    \ attribute to the database column **lname**.\n\nYou can also use the @Column\
    \ annotation to provide additional mapping information that Hibernate can use\
    \ to generate the database schema and to apply internal optimizations. I don't\
    \ recommend using Hibernate's schema generation feature to create the final version\
    \ of your table model, and you shouldn't add any additional annotations for your\
    \ entity mappings. But, you should tell Hibernate if a column is **nullable**,\
    \ **insertable**, and **updatable** because it can use this information for internal\
    \ optimizations. I show that in the following example for the primary key id.\
    \ The mapping doesn't allow **null** as a value, and Hibernate doesn't support\
    \ updates on primary key attributes.\n\n```\n@Entity\npublic class Author {\n\n\
    \    @Id\n    @GeneratedValue(strategy = GenerationType.AUTO)\n    @Column(updatable\
    \ = false, nullable = false)\n    private Long id;\n\n```"
