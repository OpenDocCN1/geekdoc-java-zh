    ### Author\n\n- Long id\n- int version\n- String firstName\n- String lastName\n\
    - Set<Publication> publications\n\n### Publication\n\n- Long id\n- String title\n\
    - int version\n- Set<Author> authors\n- Date publishingDate\n\n- Long getId()\n\
    - int getVersion()\n- String getFirstName()\n- void setFirstName(String firstName)\n\
    - String getLastName()\n- void setLastName(String lastName)\n- Set<Publication>\
    \ getPublications()\n- void setPublications(Set<Publication> publications)\n-\
    \ boolean equals(Object obj)\n- int hashCode()\n- String toString()\n\n- Long\
    \ getId()\n- String getTitle()\n- void setTitle(String title)\n- int getVersion()\n\
    - Set<Author> getAuthors()\n- void setAuthors(Set<Author> authors)\n- Date publishingDate(Date\
    \ publishingDate)\n- String toString()\n- int hashCode()\n\n### BlogPost\n\n-\
    \ boolean equals(Object obj)\n\n### Book\n\n- boolean equals(Object obj)\n\n你现在可以使用\
    \ `TREAT` 操作符将 `Publication` 转型为 `Book`，并选择所有写过关于 Java 书的作者。以下代码段是此类查询的示例。\n\n\
    ```java\nList<Object[]> result = em.createQuery(\n  \"SELECT a, p FROM Author\
    \ JOIN a.publications p \"\n+ \"WHERE TREAT(p AS Book).title LIKE '%Java%%'\"\
    )\n  .getResultList();\n```\n\n如果在此示例中使用 `SINGLE_TABLE` 继承策略，会将继承层次结构中的实体映射到 `Publication`\
