  - "[PAGE 235]\n\nThat's all you need to call a function in a CriteriaQuery. You\
    \ can now use it to create a TypedQuery and execute it.\n\n```\n// Define the\
    \ CriteriaQuery\nCriteriaBuilder cb = em.getCriteriaBuilder();\nCriteriaQuery<Tuple>\
    \ cq = cb.createTupleQuery();\nRoot<Author> root = cq.from(Author.class);\ncq.multiselect(root,\
    \ cb.size(root.get(Author_.books)));\ncq.groupBy(root.get(Author_.id));\n\n//\
    \ Execute the Query\nTypedQuery<Tuple> q = em.createQuery(cq);\nList<Tuple> results\
    \ = q.getResultList();\n```\n\nThe size function is JPA-specific. You can use\
    \ it to count the elements in a mapped association. As you can see in the log\
    \ message, Hibernate generates a JOIN statement to join the associated table and\
    \ calls the SQL count function to count the number of associated records in the\
    \ Author table.\n\n```\n05:47:23,682 DEBUG [org.hibernate.SQL] -\nselect\n   \
    \ author0_.id as col_0_,\n    count(books1_.authorId) as col_1_0,\n    author0_.id\
    \ as id1_0,\n    author0_.firstName as firstName2_0,\n    author0_.lastName as\
    \ lastName3_0,\n    author0_.version as version4_0_\nfrom\n    Author author0_\
    \ cross\njoin BookAuthor books1_\nwhere\n    author0_.id=books1_.authorId\ngroup\
    \ by\n    author0_.id\n```"
