  - '[PAGE 154]


    # JAVA 8


    Java 8 introduced a lot of powerful and convenient changes to the Java world.
    Hibernate supports the new concepts and data type since version 5. It started
    with the support of the classes of the Date and Time API as BasicTypes in version
    5.0. The required changes were packaged into the optional hibernate-java8.jar
    file which were needed to add to the classpath of your application. Since version
    5.1, this is no longer required. The Hibernate team switched the code base of
    their core project to Java 8 and started to use Java 8 in their APIs.


    I show you how to use some of the most popular new data types and concepts in
    the following Hibernate tips:


    +   - How to map an association to an Optional

    - How to map classes of Java 8’s Date and Time API

    - How to retrieve a query result as a Java 8 Stream'
