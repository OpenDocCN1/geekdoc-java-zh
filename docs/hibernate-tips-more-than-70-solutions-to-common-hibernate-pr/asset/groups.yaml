  - "[PAGE 114]\n\n# How to model a derived primary key with Hibernate\n\n# Problem\n\
    \nMy database table uses a derived primary key that includes the primary key of\
    \ an associated entity. How do I model such a primary key with Hibernate?\n\n\
    # Solution\n\nYou can model a derived primary key with an embedded id and a @MapsId\
    \ annotation on the association whose primary key is part of the derived identifier.\
    \ The following code snippet shows an example of such a mapping.\n\n```\n@Entity\n\
    public class Review {\n\n    @EmbeddedId\n    private ReviewId id;\n\n    private\
    \ String comment;\n\n    @ManyToOne\n    @JoinColumn(name = \"fk_book\")\n   \
    \ @MapsId(\"book\")\n    private Book book;\n\n    ...\n}\n```\n\nThe id attribute\
    \ models the primary key of the Review entity. It is of type ReviewId, which is\
    \ an embeddable and shown in the following code snippet.\n\nThe second important\
    \ part of this mapping is the @MapsId annotation on the Book book association.\
    \ You can use this annotation with many-to-one and"
- md: "\none-to-one associations. It tells Hibernate to use the primary key of the\
    \ to-one side of the association as a primary key attribute of the to-many side\
    \ of the association. It also provides the name of the embedded id attribute to\
    \ which it shall be mapped. In this example, the id attribute of the Book entity\
    \ becomes part of the primary key of the Review entity and gets mapped to the\
    \ bookId attribute of the ReviewId class.\n\nYou can see the ReviewId class in\
    \ the following code snippet. It models the primary key with the attributes bookId\
    \ and userName. It is used as an embedded id and needs to fulfill the requirements\
    \ of a primary key class. A primary key class must be public, have a public default\
    \ constructor, be serializable and implement the equals and hashCode methods.\n\
    \n```\n@Embeddable\npublic class ReviewId implements Serializable {\n\n    private\
    \ static final long serialVersionUID = -507374564537962235L;\n\n    private String\
    \ userName;\n\n    private Long bookId;\n    public ReviewId() {\n}\n\n    public\
    \ ReviewId(String userName, Long bookId) {\n        this.userName = userName;\n\
    \        this.bookId = bookId;\n}\n\n    public String getUsername() {\n     \
    \   return userName;\n}\n```\n\n```java\npublic void setUserName(String userName)\
    \ {\n    this.userName = userName;\n}\n\npublic Long getBookId() {\n    return\
    \ bookId;\n}\n\npublic void setBookId(Long bookId) {\n    this.bookId = bookId;\n\
    }\n\n@Override\npublic int hashCode() {\n    final int prime = 31;\n    int result\
    \ = 1;\n    result = prime * result\n    + ((bookId == null) ? 0 : bookId.hashCode());\n\
    \    result = prime * result\n    + ((userName == null) ? 0 : userName.hashCode());\n\
    }\n\n@Override\npublic boolean equals(Object obj) {\n    if (this == obj) {\n\
    \        return true;\n    }\n\n    if (obj == null) {\n        return false;\n\
    \    }\n\n    if (getClass() != obj.getClass()) {\n        return false;\n   \
    \ }\n\n    ReviewId other = (ReviewId) obj;\n\n    return Objects.equals(bookId,\
    \ other.bookId)\n        && Objects.equals(userName, other.userName);\n}\n```\n\
    \nThe following code snippet shows an example that persists a new Review entity.\
    \ Due to the @MapsId annotation, Hibernate automatically initializes the primary\
    \ key attribute texId when you call the setBook(Book b) method. That requires\
    \ you to initialize the id attribute before you set the Book association.\n\n\
    ```\nReview r = new Review();\nr.setId(new ReviewId());\nr.getId().setName(\"\
    peter\");\nr.setBook(em.find(Book.class, 1L));\n\nr.setComment(\"This is a comment\"\
    );\n\nem.persist(r);\n```\n\nThe Review class only contains the bookId attribute\
    \ of type Long and not the association to the Book entity. This makes it easy\
    \ to instantiate a new ReviewId object, if you want to look up a Review entity.\n\
    \n```\nReview r = em.find(Review.class, new ReviewId(\"peter\", 1L));\n```\n\n\
    # Source Code\n\nYou can find a project with executable test cases for this Hibernate\
    \ tip in the DerivedPrimaryKey module of the example project. If you haven’t already\
    \ done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n# Learn More\n\nDerived primary keys are often used by entities that model the\
    \ join tables of many-to-many associations. I use one in the Hibernate tip How\
    \ to model an association with additional attributes.\n\n# How to model an association\
    \ with additional attributes\n\n# Problem\n\nI need to persist additional attributes\
    \ for my many-to-many association. How do I do that with Hibernate?\n\n# Solution\n\
    \nModelling a many-to-many association with JPA and Hibernate is simple. You just\
    \ need an entity attribute and a @ManyToMany annotation. Hibernate internally\
    \ maps the relationship to the join table you need in your table model. But this\
    \ approach has one downside. It doesn't allow you to map any columns of the join\
    \ table. If you want to do that, you need to model it in the same way as you do\
    \ it in the database. You need to split the many-to-many association into an entity\
    \ that maps the join table and has two many-to-one relationships to the associated\
    \ entities.\n\nThe following diagram shows the domain model of a bookstore that\
    \ uses an association with additional attributes. There are books in multiple\
    \ formats (e.g. hardcover, paperback, ebook) and each format is published by a\
    \ different publisher. The Book and Publisher entities model the two main domain\
    \ objects. The BookPublisher entity models the association between them and persists\
    \ the Format as an additional attribute.\n\n# Book\n\n- Long id\n- int version\n\
    - String title\n- List<BookPublisher> publishers\n\n- Long getTid()\n- int getVersion()\n\
    - String getTitle()\n- void setTitle(String title)\n- List<BookPublisher> getPublishers()\n\
    - void setPublishers(List<BookPublisher> publishers)\n- boolean equals(Object\
    \ obj)\n- int hashCode()\n- String toString()\n\n# BookPublisher\n\n- BookPublisherId\
    \ id\n- Format format\n- Book book\n- Publisher publisher\n\n- BookPublisherId\
    \ gettid()\n- void settid(BookPublisher id)\n- Format getFormat()\n- void setFormat(Format\
    \ format)\n- Book getBook()\n- void setBook(Book book)\n- Publisher getPublisher()\n\
    - void setPublisher(Publisher publisher)\n- String toString()\n\n# Publisher\n\
    \n- Long id\n- int version\n- String title\n- List<BookPublisher> publishers\n\
    \n- Long getTid()\n- int getVersion()\n- String getTitle()\n- void setTitle(String\
    \ title)\n- List<BookPublisher> getPublishers()\n- void setPublishers(List<BookPublisher>\
    \ publishers)\n- boolean equals(Object obj)\n- int hashCode()\n- String toString()\n\
    \nThe BookPublisher entity models the association between them and stores the\
    \ additional Format attribute. There is nothing special about the Book and Publisher\
    \ entities. They model the primary keys of the associated entities. I explain\
    \ primary keys and how to model them with an embedded id in.\n"
