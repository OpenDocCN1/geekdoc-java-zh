  - '[PAGE 178]


    The JPQL query is the same as you would use in an ad-hoc JPQL query and it looks
    very similar to an SQL query. The main difference between SQL and JPQL is that
    SQL uses database tables and JPQL the entity model to define the query. That makes
    JPQL easier to use for most Java developers, but you still need to be familiar
    with SQL. Hibernate transforms the JPQL statement to SQL, and you should always
    check the generated statements after you created or adapted to a JPQL query.


    That''s all you need to do define a named JPQL query. You can use its name to
    instantiate it in your business logic.


    ```

    TypedQuery<Book> q = em.createNamedQuery(Book.QUERY_SELECT_BY_ID, Book.class);

    q.setParameter(Book.PARAM_ID, 1L);

    Book b = q.getSingleResult();

    ```


    As you can see in the code snippet, you use a named JPQL query in a similar way
    as an ad-hoc query. The only difference is the way you instantiate the TypedQuery.
    You already defined the query with the @NamedQuery annotation, and you only need
    to provide its name to the createNamedQuery method of the EntityManager to instantiate
    it. That is the point where the usage of the static String for query name pays
    off. It''s lot easier to use the static String in your business code, and it allows
    you to refactor the query name easily.


    I also provided the class of the Book entity as the second parameter to the createNamedQuery
    method to get a TypedQuery instance. This one is strongly typed and doesn''t require
    any type casting off the query result.'
