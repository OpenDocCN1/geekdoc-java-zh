    \ 5.1, this is no longer required. The Hibernate team switched the code base of\
    \ their core project to Java 8 and started to use Java 8 in their APIs.\n\nI show\
    \ you how to use some of the most popular new data types and concepts in the following\
    \ Hibernate tips:\n\n- How to map an association to an Optional\n- How to map\
    \ classes of Java 8’s Date and Time API\n- How to retrieve a query result as a\
    \ Java 8 Stream\n\n# How to map an association to an Optional\n\n# Problem\n\n\
    How do I map an optional-to-one association to a Java 8 Optional?\n\n# Solution\n\
    \nHibernate does not support Optional as an attribute type. But you can implement\
    \ your own getter method to wrap the attribute in an `Optional<T>`, if Hibernate\
    \ uses field access. This provides you the option to wrap the attribute which\
    \ represents the to-one association into an Optional. You can see an example of\
    \ it in the following code snippet.\n\n```java\n@Entity\npublic class Book implements\
    \ Serializable {\n\n  ...\n  @ManyToOne\n  @JoinColumn(name=\"publisherid\")\n\
    \  private Publisher publisher;\n\n  ...\n  public Optional<Publisher> getPublisher()\
    \ {\n    return Optional.ofNullable(this.publisher);\n  }\n\n  public void setPublisher(final\
    \ Publisher publisher) {\n    this.publisher = publisher;\n  }\n\n}\n```\n\nAs\
    \ you can see in the code snippet, I wrap the publisher into an Optional in the\
    \ `getPublisher` method and return an Optional instead of a Publisher entity.\
    \ The caller of this method immediately sees that the publisher might be null\
    \ and that she needs to handle it.\n\n# Source Code\n\nYou can find a project\
    \ with executable test cases for this Hibernate tip in the MapOptionalAssociations\
    \ module of the example project. If you haven’t already done so, you can download\
    \ it at http://www.hibernate-tips.com/download-examples.\n\n# Learn More\n\nHibernate\
    \ 5 also provides proprietary support for other features, like Optional and the\
    \ Stream. You can read more about it in:\n\n- How to map an association to an\
    \ Optional\n- How to retrieve a query result as a Java 8 Stream\n\n# How to map\
    \ classes of Java 8’s Date and Time API\n\n# Problem\n\nI want to use a Java 8\
    \ Stream to process the result of a query. What is the best way to get a query\
    \ result as a Stream?\n\n# Solution\n\nThe most obvious but not the most efficient\
    \ approach is to just call the stream method on the List interface. You can see\
    \ an example of it in the following code snippet. I first call the `getResultList`\
    \ method on the Query interface to get the query result as a List and then call\
    \ the stream method of the List interface.\n\n```java\nList<Book> books = session.createQuery(\"\
    SELECT b FROM Book b\", Book.class).getResultList();\nbooks.stream()\n  .map(b\
    \ -> ...)\n```\n\nThe following table shows which JDBC types Hibernate maps:\n\
    \n| Java type | JDBC type |\n| :--- | :--- |\n| java.time.Duration | BIGINT |\n\
    | java.time.Instant | TIMESTAMP |\n| java.time.LocalDate | TIMESTAMP |\n| java.time.LocalTime\
    \ | TIME |\n| java.time.OffsetDateTime | TIMESTAMP |\n| java.time.OffsetTime |\
    \ TIME |\n| java.time.ZonedDateTime | TIMESTAMP |\n\n# How to map an optional-to-one\
    \ association to a Java 8 Optional\n\n# Problem\n\nI want to use Optional in my\
    \ domain model but I can't use `@Temporal` annotation. How do I map them?\n\n\
    # Solution\n\nThe good news is, since 5, you don’t need any additional annotations\
    \ to use the Date and Time API. In contrast to the old `java.util.Date`, Hibernate\
    \ 5 provides the correct mappings. If you can't use 5 or if you're not allowed\
    \ to use proprietary features, you can implement an `AttributeConverter` which\
    \ converts the class of the Date and Time API to a supported Java type. I show\
    \ you how to do that in the following code:\n\n```java\n@Entity\npublic class\
