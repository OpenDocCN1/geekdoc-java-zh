    \ 下载。\n\n# 了解更多信息\n\n派生主键通常用于建模多对多关联连接表的实体。我在 Hibernate 技巧《如何建模带有额外属性的关联》中使用了它。\n\
    \n# 如何建模带有额外属性的关联\n\n# 问题\n\n我需要为我的多对多关联持久化额外的属性。我该如何使用 Hibernate 实现这一点？\n\n#\
    \ 解决方案\n\n使用 JPA 和 Hibernate 建模多对多关联非常简单。你只需要一个实体属性和一个 `@ManyToMany` 注解。Hibernate\
    \ 在内部会将该关系映射到你表模型所需的连接表上。但这种方法有一个缺点：它不允许你映射连接表的任何列。如果你想这样做，你需要像在数据库中那样对其进行建模。你需要将多对多关联拆分为一个映射连接表的实体，该实体与关联实体具有两个多对一的关系。\n\
    \n接下来的图显示了一个使用带有额外属性关联的书店领域模型。有多种格式的图书（例如：精装、平装、电子书），每种格式都由不同的出版社出版。`Book` 和 `Publisher`\
    \ 实体建模了两个主要的领域对象。`BookPublisher` 实体建模了它们之间的关联，并将 `Format` 作为额外属性持久化。\n\n# Book\n\
    \n- Long id\n- int version\n- String title\n- List<BookPublisher> publishers\n\
    \n- Long getTid()\n- int getVersion()\n- String getTitle()\n- void setTitle(String\
