    </persistence-unit>\n```\n\nThe container creates an EntityManagerFactory for\
    \ each persistence-unit defined in the configuration. It also enables you to inject\
    \ an EntityManagerFactory or an EntityManager when you need it.\n\n```\n@PersistenceUnit\n\
    private EntityManagerFactory emf;\n\n@PersistenceUnit\nprivate EntityManager em;\n\
    ```\n\n# Learn More\n\nJPA and Hibernate also provide two approaches to bootstrap\
    \ Hibernate in a Java SE environment. I explain them in How to bootstrap Hibernate\
    \ in a Java SE environment and How to use Hibernate’s native bootstrapping API.\n\
    \nIf you want to use Hibernate with Spring Boot, take a look at How to bootstrap\
    \ Hibernate with Spring Boot."
  - "[PAGE 16]\n\n# How to use Hibernate’s native bootstrapping API\n\n# Problem\n\
    \nI need more control over Hibernate’s internal configuration. How do I use its\
    \ native bootstrapping API?\n\n# Solution\n\nHibernate’s native bootstrapping\
    \ API is very flexible, which makes it more complicated to use but also more powerful\
    \ than the JPA bootstrapping API. If you don’t need this flexibility, I recommend\
    \ using the JPA API.\n\nBefore you can start the bootstrapping process, you need\
    \ to add the required dependencies to your classpath. I’m using Hibernate 5.2.8.Final\
    \ for the examples of this book, the **hibernate-core.jar** file is the only required\
    \ Hibernate dependency. It also includes the JPA jar-file as a transitive dependency.\n\
    \n```\n<dependency>\n  <groupId>org.hibernate</groupId>\n  <artifactId>hibernate-core</artifactId>\n\
    \  <version>5.2.8.Final</version>\n</dependency>\n```\n\nYou also need to add\
    \ a database-specific JDBC driver to the classpath of your application. Please\
    \ check your database documentation for more information.\n\nAs soon as you add\
    \ the required dependencies, you can implement the bootstrapping process. You\
    \ need to create a **StandardServiceRegistry**,"
  - "[PAGE 17]\n\nbuild a Metadata object, and use that object to instantiate a SessionFactory.\n\
    \nHibernate uses two service registries --- the BootstrapServiceRegistry and the\
    \ StandardServiceRegistry. The default BootstrapServiceRegistry provides a good\
    \ solution for most applications, so I skip the programmatic definition in this\
    \ example.\n\nHowever, you need to configure the StandardServiceRegistry. In this\
    \ example, I do that using a `hibernate.cfg.xml` file, which makes the implementation\
    \ easy and allows allows you to change the configuration without changing the\
    \ source code. Hibernate loads the configuration file automatically from the classpath\
    \ when you call the `configure` method on the StandardServiceRegistryBuilder.\
    \ You can then adapt the configuration programmatically before you call the `build`\
    \ method to get a ServiceRegistry.\n\n```\nServiceRegistry standardRegistry =\n\
    \    new StandardServiceRegistryBuilder()\n    .configure()\n    .build();\n```\n\
    \nThe following code snippet shows an example of a `hibernate.cfg.xml` configuration\
    \ file. It tells Hibernate to use the `PostgreSQLDialect` and to connect to a\
    \ PostgreSQL database on localhost. It also tells Hibernate to generate the database\
    \ tables based on the entity mappings. Your configuration may differ if you use\
    \ a different database or a connection pool."
- md: "Generating your database tables based on entity mappings is not recommended\
    \ for production.\nYou should use SQL scripts instead so that you are in control\
    \ of your database model and can optimize it for your requirements.\n\n```\n<hibernate-configuration>\n\
    \  <session-factory name=\"dialect\">\n    <property>org.hibernate.dialect.PostgreSQLDialect</property>\n\
    \    <property name=\"connection.driver_class\">org.postgresql.Driver</property>\n\
    \    <property name=\"connection.url\">jdbc:postgresql://localhost:5432/recipes</property>\n\
    \    <property name=\"connection.username\">postgres</property>\n    <property\
    \ name=\"connection.password\">postgres</property>\n    <property name=\"connection.pool_size\"\
    >1</property>\n    <property name=\"hbm2ddl.auto\">create</property>\n  </session-factory>\n\
    </hibernate-configuration>\n```\n\nAfter you instantiate a configured ServiceRegistry,\
    \ you need to create a Metadata representation of your domain model. You can do\
    \ that based on the configuration files hbm.xml or orm.xml or annotated entity\
    \ classes. I use annotated classes in the following code snippet. I first use\
    \ the ServiceRegistry, which I created in the previous step to instantiate a new\
    \ MetadataSources object. Then I add my annotated entity classes and call the\
    \ buildMetadata to create the Metadata representation. In this example, I use\
    \ only the Author entity. After that, I call the buildSessionFactory method on\
    \ the Metadata object to instantiate a SessionFactory.\n\n```\nSessionFactory\
    \ sessionFactory =\nnew MetadataSources(standardRegistry)\n.addAnnotatedClass(Author.class)\n\
    .buildMetadata()\n.buildSessionFactory();\n session = sessionFactory.openSession();\n\
    ```\n\nThat is all you need to do create a basic Hibernate setup with its native\
    \ API. You can now use the SessionFactory to open a new Session and use it to\
    \ read or persist entities.\n\n```\nAuthor a = new Author();\na.setFirstName(\"\
    Thorben\");\na.setLastName(\"Janssen\");\nsession.persist(a);\n```\n\n# Source\
    \ Code\n\nYou can find a project with executable test cases for this Hibernate\
    \ tip in the HibernateBootstrapping module of the example project. If you haven't\
    \ already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n# Learn More\n\nThe bootstrapping API defined by the JPA standard is easier\
    \ to use but not as flexible. I explain it in more detail in:\n\n- How to bootstrap\
    \ Hibernate in a Java SE environment\n- How to bootstrap Hibernate in a Java EE\
    \ environment\n\nYou can also use Hibernate with Spring Boot. I explain the required\
    \ bootstrapping process in How to bootstrap Hibernate with Spring Boot.\n\n# How\
    \ to bootstrap Hibernate with Spring Boot\n\n# Problem\n\nHow do I use Hibernate\
    \ in my Spring Boot application?\n\n# Solution\n\nSpring Boot makes it extremely\
    \ easy to bootstrap Hibernate. You just need to add the Spring Boot JPA starter\
    \ to your classpath, and Spring Boot handles the bootstrapping for you.\n\n```\n\
    <dependency>\n  <groupId>org.springframework.boot</groupId>\n  <artifactId>spring-boot-starter-data-jpa</artifactId>\n\
    </dependency>\n```\n\nYou also need to add a database-specific JDBC driver to\
    \ the classpath of your application. Please check your database documentation\
    \ for more information.\n\nYou define your data source with a few properties in\
    \ the application.properties file. The following configuration defines a data\
    \ source that connects to a PostgreSQL database on localhost.\n\n```\nspring.datasource.url\
    \ = jdbc:postgresql://localhost:5432/recipes\nspring.datasource.username = postgres\n\
    spring.datasource.password = postgres\n```\n\nIf you add an H2, HSQL, or Derby\
    \ database on the classpath, you can safely omit the configuration, and Spring\
    \ Boot starts and connects to an in-memory database. You can also add multiple\
    \ JDBC drivers and an in-memory database to your classpath and use different configurations\
    \ for different target environments.\n\nThat's all you need to do bootstrap Hibernate\
    \ in a Spring Boot application. You can now use the @Autowired annotation to inject\
    \ an EntityManager.\n\n```\n@Autowired\nprivate EntityManager em;\n```\n\n# Source\
    \ Code\n\nYou can find a project with executable test cases for this Hibernate\
    \ tip in the SpringBootBootstrapping module of the example project. If you haven't\
    \ already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n# Learn More\n\nJPA defines a bootstrapping approach for Java SE and Java EE\
    \ environments. I explain it in:\n\n- How to bootstrap Hibernate in a Java SE\
    \ environment\n- How to bootstrap Hibernate in a Java EE environment\n\nYou can\
    \ also use Hibernate’s proprietary bootstrapping API, which gives you access to\
    \ proprietary configuration features. I show you how to do that in How to use\
    \ Hibernate’s native bootstrapping API.\n\n# How to access Hibernate APIs from\
    \ JPA\n\n# Problem\n\nI’m using Hibernate via the EntityManager API. Is there\
    \ a way to access the proprietary Hibernate Session and SessionFactory?\n\n# Solution\n\
    \nSince version 2.0, JPA provides easy access to the APIs of the underlying implementations.\
    \ EntityManager and EntityManagerFactory provide an unwrap method, which returns\
    \ the corresponding classes of the JPA implementation. In Hibernate’s case, Session\
    \ and SessionFactory give you full access to proprietary Hibernate features, such\
    \ as the support for Streams and Optional.\n\nThe following code snippet shows\
    \ you how to get the Hibernate Session from EntityManager. You just need to call\
    \ the unwrap method on EntityManager and provide the Session class as a parameter.\n\
    \n```\nSession session = em.unwrap(Session.class);\n```\n\nAs you can see in the\
    \ next code snippet, you can get Hibernate SessionFactory in a similar way. You\
    \ first get EntityManagerFactory from EntityManager and then call unwrap method\
    \ with the SessionFactory class.\n\n```\nSessionFactory sessionFactory = em.getEntityManagerFactory().unwrap(SessionFactory.class);\n\
    ```\n\n# Source Code\n\nYou can find a project with executable test cases for\
    \ this Hibernate tip in the AccessApi module of the example project. If you haven’t\
    \ already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n# Learn More\n\nYou also get direct access to Hibernate’s Session and SessionFactory\
    \ classes, if you use its native API. For more information, see How to use Hibernate’s\
    \ native bootstrapping API.\n\n# How to automatically add Metamodel classes to\
    \ your project\n\n# Problem\n\nI use Hibernate’s Static Metamodel Generator to\
    \ generate the JPA Metamodel.\nThese classes are generated to a different directory,\
    \ which isn’t used as a source folder. There is a way to automatically register\
    \ this folder as a source folder?\n\n# Solution\n\nDuring my research, I learned\
    \ from Frits Walraven that there is a Maven plugin that can do that. Special thanks\
    \ to Frits, who also reviewed this book.\n\nThe only thing you need to do is to\
    \ add the following Maven plugin to your build configuration. It registers a list\
    \ of directories as additional source folders. I use it in the parent pom.xml\
    \ of my project to add the directory, to which the JPA Metamodel classes get (target/generated-sources/annotations),\
    \ as a source folder.\n\n```xml\n<project>\n  <build>\n    <plugins>\n      <plugin>\n\
    \        <groupId>org.codehaus.mojo</groupId>\n        <artifactId>build-helper-maven-plugin</artifactId>\n\
    \        <version>3.0.0</version>\n        <executions>\n          <execution>\n\
    \            <id>add-source</id>\n            <phase>generate-sources</phase>\n\
    \          </execution>\n        </executions>\n      </plugin>\n    </plugins>\n\
    \  </build>\n</project>\n```\n\n```xml\n<goals>\n  <goal>add-source</goal>\n</goals>\n\
    <configuration>\n  <sources>\n    <source>target/generated-sources/annotations</source>\n\
    \  </sources>\n</configuration>\n<executions>\n  <plugin>\n    </plugins>\n  </plugin>\n\
    </executions>\n<build>\n  ...\n</build>\n</project>\n```\n\n# Source Code\n\n\
    You can find an example of a complete maven build configuration in the example\
    \ project. If you haven't already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n# Learn More\n\nThe JPA Metamodel provides a type-safe way to reference entity\
    \ attributes you create a CriteriaQuery or an EntityGraph. I explain it in more\
    \ detail in How to reference entity attributes in a type-safe way.\n"
  mdcn: "\n不建议在生产环境中根据实体映射生成数据库表。\n你应该应该使用 SQL 脚本，这样你就可以控制自己的数据库模型并根据需求对其进行优化。\n\n\
    ```\n<hibernate-configuration>\n  <session-factory name=\"dialect\">\n    <property>org.hibernate.dialect.PostgreSQLDialect</property>\n\
    \    <property name=\"connection.driver_class\">org.postgresql.Driver</property>\n\
    \    <property name=\"connection.url\">jdbc:postgresql://localhost:5432/recipes</property>\n\
    \    <property name=\"connection.username\">postgres</property>\n    <property\
    \ name=\"connection.password\">postgres</property>\n    <property name=\"connection.pool_size\"\
    >1</property>\n    <property name=\"hbm2ddl.auto\">create</property>\n  </session-factory>\n\
    </hibernate-configuration>\n```\n\n在实例化配置好的 ServiceRegistry 后，你需要为你的领域模型创建一个元数据表示（Metadata\
    \ representation）。你可以根据 `hbm.xml` 或 `orm.xml` 配置文件或注解实体类来实现。我在下面的代码片段中使用了注解类。我首先使用上一步创建的\
    \ ServiceRegistry 来实例化一个新的 `MetadataSources` 对象。然后我添加我的注解实体类并调用 `buildMetadata`\
    \ 来创建元数据表示。在这个示例中，我只使用了 `Author` 实体。之后，我在元数据对象上调用 `buildSessionFactory` 方法来实例化\
    \ `SessionFactory`。\n\n```\nSessionFactory sessionFactory =\nnew MetadataSources(standardRegistry)\n\
    .addAnnotatedClass(Author.class)\n.buildMetadata()\n.buildSessionFactory();\n\
    \ session = sessionFactory.openSession();\n```\n\n这就是你使用原生 API 创建基础 Hibernate\
    \ 设置所需要的所有操作。你现在可以使用 SessionFactory 打开一个新的 Session 并使用它来读取或持久化实体。\n\n```\nAuthor\
    \ a = new Author();\na.setFirstName(\"Thorben\");\na.setLastName(\"Janssen\");\n\
    session.persist(a);\n```\n\n# 源代码\n\n你可以在示例项目的 HibernateBootstrapping 模块中找到包含此此\
    \ Hibernate 提示的可执行测试用例的项目。如果你还没有下载，可以在 http://www.hibernate-tips.com/download-examples\
    \ 下载。\n\n# 了解更多\n\n由 JPA 标准定义的引导程序（bootstrapping）API 更容易使用，但灵活性较低。我在以下文章中进行了详细解释：\n\
    \n- 如何在 Java SE 环境中引导 Hibernate\n- 如何在 Java EE 环境中引导 Hibernate\n\n你也可以在 Spring\
    \ Boot 中使用 Hibernate。我在《如何使用 Spring Boot 引导 Hibernate》中解释了所需的引导过程。\n\n# 如何使用 Spring\
    \ Boot 引导 Hibernate\n\n# 问题\n\n我如何在我的 Spring Boot 应用中使用 Hibernate？\n\n# 解决方案\n\
    \nSpring Boot 让引导 Hibernate 变得极其简单。你只需要将 Spring Boot JPA 启动器添加到类路径中，Spring Boot\
    \ 就会为你处理好引导工作。\n\n```\n<dependency>\n  <groupId>org.springframework.boot</groupId>\n\
    \  <artifactId>spring-boot-starter-data-jpa</artifactId>\n</dependency>\n```\n\
    \n你还需要将特定数据库的 JDBC 驱动程序添加到应用的类路径中。请检查你的数据库文档以获取更多信息。\n\n你可以在 `application.properties`\
    \ 文件中通过几个属性定义数据源。以下配置定义了一个连接到本地 localhost PostgreSQL 数据库的数据源。\n\n```\nspring.datasource.url\
    \ = jdbc:postgresql://localhost:5432/recipes\nspring.datasource.username = postgres\n\
    spring.datasource.password = postgres\n```\n\n如果你在类路径中添加了 H2、HSQL 或 Derby 数据库，你可以安全地省略配置，Spring\
    \ Boot 将启动并连接到内存数据库。你也可以向类路径中添加多个 JDBC 驱动和一个内存数据库，并为不同的目标环境使用不同的配置。\n\n这就是你从 Spring\
    \ Boot 应用中引导 Hibernate 所需要的所有操作。你现在可以使用 `@Autowired` 注解来注入 `EntityManager`。\n\n\
    ```\n@Autowired\nprivate EntityManager em;\n```\n\n# 源代码\n\n你可以在示例项目的 SpringBootBootstrapping\
    \ 模块中找到包含此 Hibernate 提示的可执行测试用例的项目。如果你还没有下载，可以在 http://www.hibernate-tips.com/download-examples\
    \ 下载。\n\n# 了解更多\n\nJPA 为 Java SE 和 Java EE 环境定义了一种引导方法。我在以下文章中解释了它：\n\n- 如何在 Java\
    \ SE 环境中引导 Hibernate\n- 如何在 Java EE 环境中引导 Hibernate\n\n你也可以使用 Hibernate 专有的引导程序\
    \ API，这让你能够访问专有的配置功能。我在《如何使用 Hibernate 的原生引导 API》中向你展示如何这样做。\n\n# 如何从 JPA 访问 Hibernate\
    \ API\n\n# 问题\n\n我正在通过 EntityManager API 使用 Hibernate。是否有办法可以访问专有的 Hibernate Session\
    \ 和 SessionFactory？\n\n# 解决方案\n\n从 2.0 版本开始，JPA 提供了访问底层实现 API 的便捷方法。`EntityManager`\
    \ 和 `EntityManagerFactory` 提供了一个 `unwrap` 方法，该方法返回 JPA 实现的对应类。在 Hibernate 的情况下，`Session`\
    \ 和 `SessionFactory` 让你完全访问 Hibernate 的专有功能，例如对 Streams 和 Optional 的支持。\n\n下面的代码片段展示了如何从\
    \ `EntityManager` 获取 Hibernate `Session`。你只需要在 `EntityManager` 上调用 `unwrap` 方法并提供\
    \ `Session` 类作为参数即可。\n\n```\nSession session = em.unwrap(Session.class);\n```\n\
    \n正如下一个代码片段所示，你可以以类似的方式获取 Hibernate `SessionFactory`。你首先从 `EntityManager` 获取 `EntityManagerFactory`，然后使用\
    \ `SessionFactory` 类调用 `unwrap` 方法。\n\n```\nSessionFactory sessionFactory = em.getEntityManagerFactory().unwrap(SessionFactory.class);\n\
    ```\n\n# 源代码\n\n你可以在示例项目的 AccessApi 模块中找到包含此 Hibernate 提示的可执行测试用例的项目。如果你还没有下载，可以在\
    \ http://www.hibernate-tips.com/download-examples 下载。\n\n# 了解更多\n\n如果你使用原生 API，你也可以直接访问\
    \ Hibernate 的 `Session` 和 `SessionFactory` 类。有关更多信息，请参阅《如何使用 Hibernate 的原生引导 API》。\n\
    \n# 如何将 Metamodel 类自动添加到你的项目中\n\n# 问题\n\n我使用 Hibernate 的静态元模型生成器（Static Metamodel\
    \ Generator）来生成 JPA Metamodel。这些类生成到一个不同的目录，该目录没有被作为源文件夹。是否有方法自动将此文件夹注册为源文件夹？\n\
    \n# 解决方案\n\n在研究过程中，我从 Frits Walraven 那处了解到有一个 Maven 插件可以做到。特别感谢 Frits，他也审阅了这本书。\n\
    \n你只需要将以下 Maven 插件添加到你的构建配置中。它会将目录列表注册为额外的源文件夹。我在项目的父级 `pom.xml` 中使用它，将 JPA Metamodel\
    \ 类所在的目录（`target/generated-sources/annotations`）添加为源文件夹。\n\n```xml\n<project>\n\
    \  <build>\n    <plugins>\n      <plugin>\n        <groupId>org.codehaus.mojo</groupId>\n\
    \        <artifactId>build-helper-maven-plugin</artifactId>\n        <version>3.0.0</version>\n\
    \        <executions>\n          <execution>\n            <id>add-source</id>\n\
    \            <phase>generate-sources</phase>\n          </execution>\n       \
    \ </executions>\n      </plugin>\n    </plugins>\n  </build>\n</project>\n```\n\
    \n```xml\n<goals>\n  <goal>add-source</goal>\n</goals>\n<configuration>\n  <sources>\n\
    \    <source>target/generated-sources/annotations</source>\n  </sources>\n</configuration>\n\
    <executions>\n  <plugin>\n    </plugins>\n  </executions>\n<build>\n  ...\n</build>\n\
    </project>\n```\n\n# 源代码\n\n你可以在示例项目中找到一个完整的 Maven 构建配置示例。如果你还没有下载，可以在 http://www.hibernate-tips.com/download-examples\
    \ 下载。\n\n# 了解更多\n\nJPA Metamodel 为在创建 `CriteriaQuery` 或 `EntityGraph` 时提供了一种类型安全的方式引用实体属性。我在《如何类型安全的方式引用实体属性》中进行了更详细的解释。\n\
    \n"
