    # Learn More


    You can also use the function function in a JPQL query. I show you how in How
    to call a user-defined function in a JPQL query.'
  - '[PAGE 240]


    # How to update multiple entities with the Criteria API


    Problem

    Have to update a lot of entities. With SQL, I would only need 1 UPDATE statement
    to update all entities. Is there a way to do the same with the Criteria API?


    Solution

    The CriteriaUpdate interface allows you to define an update statement that changes
    multiple entities. The following code snippet shows an example of such a statement.
    It increases the price of all Books by 10%.


    ```

    // define the CriteriaUpdate

    CriteriaBuilder cb = em.createCriteriaBuilder();

    CriteriaUpdate<Book> update = cb.createCriteriaUpdate(Book.class);

    Root<Book> root = update.from(Book.class);

    update.set(Book_.price, cb.prod(root(Book_.price), 1.1));


    // create and execute the Query

    Query query = em.createQuery(update);

    query.executeUpdate();

    ```


    As you can see, I define the CriteriaUpdate statement in a similar way as a CriteriaQuery.
    I first get a CriteriaBuilder from the EntityManager and use it to create a CriteriaUpdate
    instance.


    Then I define the Root of the query in the same way as I do it for a CriteriaQuery.'
  - '[PAGE 241]


    In the next step, I call the set method on the CriteriaUpdate interface to define
    the update operation. The first parameter specifies the entity attribute I want
    to change. In this example, I want to update the price attribute. The second parameter
    is an Expression that calculates the new price. I want to increase the price by
    10% and therefore multiply the current price with 1.1. That''s all you need to
    define a CriteriaUpdate statement.


    If you don''t want to update all entities, you can add a WHERE clause to the statement.
    You can define it in the same way as you do it for a CriteriaQuery.


    The only step that''s left is to create a Query based on the CriteriaUpdate and
    execute it. Hibernate then generates a SQL UPDATE statement that increases the
    price of all Books by 10%. You can check the generated SQL statement in the log
    file if you activate logging for the SQL statements.


    ```

    18:57:25,118 DEBUG [org.hibernate.SQL] - update Book set price=price*1.1

    ```


    > Updating multiple entities with a CriteriaUpdate statement is more efficient
    than updating the entities one by one. Hibernate doesn''t know which database
    records get changed and doesn''t update any entities in the first-level cache.
    You need to make sure that the cache doesn''t contain any outdated entities or
    you need to invalidate the cache programmatically.


    # Source Code'
  - '[PAGE 242]


    You can find a project with executable test cases for this Hibernate tip in the
    CriteriaUpdate module of the example project. If you haven''t already done so,
    you can download it at http://www.hibernate-tips.com/download-examples.


    # Learn More


    The CriteriaUpdate interface is just one option to update multiple entities with
    one query. You can also use a JPQL update statement as I explain in How to update
    multiple entities with one JPQL query.'
  - '[PAGE 243]


    # How to delete multiple entities with the Criteria API


    # Problem


    I need to delete multiple entities. Is there a way to do that with the Criteria
    API that doesn’t remove the entities one by one?


    # Solution


    You can use the CriteriaDelete interface to remove multiple entities with one
    SQL statement. The definition of the statement is similar to the definition of
    a CriteriaUpdate or a CriteriaQuery. You can see an example in the following code
    snippet. It deletes all Book entities from the database.


    ```

    // define the CriteriaDelete

    CriteriaBuilder cb = em.getCriteriaBuilder();

    CriteriaDelete<Book> delete = cb.createCriteriaDelete(Book.class);

    delete.from(Book.class);


    // create and execute the Query

    Query query = em.createQuery(delete);

    query.executeUpdate();

    ```


    You first need to get the CriteriaBuilder from the EntityManager and create a
    CriteriaDelete instance. Then you need to define the FROM clause of the delete
    statement, and you can add an optional WHERE clause. You do do it in the same
    way as you do for a CriteriaQuery.


    That’s all you need to define a CriteriaDelete statement. You can now use it to
    create a Query and execute it.'
  - '[PAGE 244]


    Hibernate generates a SQL DELETE statement based on your CriteriaDelete statement.
    In this example, it also manages the mapped associations. It first performs an
    SQL DELETE statement to remove all references to the deleted Book entities from
    the association table BookAuthor. When that is done, Hibernate executes another
    SQL statement to remove the Book entities.


    ```

    16:49:44,984 DEBUG [org.hibernate.SQL] - delete from BookAuthor

    where (bookId) in (select id from Book)

    16:49:44,986 DEBUG [org.hibernate.SQL] - delete from Book

    ```


    Deleting multiple entities with a CriteriaDelete statement is more efficient than
    removing them one by one. Hibernate doesn''t know which database records the statement
    deletes and doesn''t remove any entities from the first-level cache. You need
    to make sure that the cache doesn''t contain any deleted entities or you need
    to invalidate the cache programmatically.


    # Source Code


    You can find a project with executable test cases for the Hibernate tip in the
    CriteriaDelete module of the example project. If you haven’t already done so,
    you can download it at http://www.hibernate-tips.com/download-examples.


    # Learn More


    The CriteriaDelete interface is just one option to delete multiple entities with
    one query. You can also use a JPQL delete statement as I explain in How to delete
    multiple entities with one JPQL query.'
- md: "\n# How to use pagination with a CriteriaQuery\n\n## Problem\n\nThe Criteria\
    \ API does not provide a method to define the number of returned records. How\
    \ do I paginate the result of a CriteriaQuery?\n\n## Solution\n\nDefining pagination\
    \ for a CriteriaQuery is easy but not intuitive, if you're familiar with SQL.\
    \ The Criteria API doesn't provide any method to define pagination. You have to\
    \ set the pagination information on the Query and not on the CriteriaQuery interface.\
    \ You can do that by calling the setFirstResult(int startPosition) and setMaxResults(int\
    \ maxResults) methods. This provide the advantage that you can also use this approach\
    \ to paginate the result of JPQL queries.\n\nThe following code snippet shows\
    \ a simple example that returns the first five Author entities from the database.\
    \ The result set index is 0 based and you need to provide 0 as a startPosition\
    \ to begin with the first element.\n\n```\n// Define the CriteriaQuery\nCriteriaBuilder\
    \ cb = em.getCriteriaBuilder();\nCriteriaQuery<Book> cq = cb.createQuery(Book.class);\n\
    Root<Book> root = cq.from(Book.class);\ncq.orderBy(cb.asc(root.get(\"id\")));\n\
    \n// Execute query with pagination\nList<Book> books = em.createQuery(cq)\n  \
    \  .setMaxResults(5)\n    .setFirstResult(0)\n    .getResultList();\n```\n\nTo\
    \ select the next five Authors from the database, you only need to change the\
    \ startPosition to 5.\n\n```\n// Define the CriteriaQuery\nCriteriaBuilder cb\
    \ = em.getCriteriaBuilder();\nCriteriaQuery<Book> cq = cb.createQuery(Book.class);\n\
    Root<Book> root = cq.from(Book.class);\ncq.orderBy(cb.asc(root.get(Book..id)));\n\
    \n// Execute query with pagination\nList<Book> books = em.createQuery(cq)\n  \
    \  .setMaxResults(5)\n    .setFirstResult(5)\n    .getResultList();\n```\n\n##\
    \ Source Code\n\nYou can find a project with executable test cases for this Hibernate\
    \ tip in the CriteriaQueryPagination module of the example project. If you haven't\
    \ already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n## Learn more\n\nYou can use the same approach to paginate the result of a JPQL\
    \ query. I explain it in more detail in How to use pagination with JPQL.\n\n#\
    \ How to reference entity attributes in a type-safe way\n\n## Problem\n\nReferencing\
    \ entity attributes by their name is error-prone and makes the code hard to refactor.\
    \ How do I reference an attribute in a type-safe way so that I don't run into\
    \ problems when I have to change its name?\n\n## Solution\n\nI prefer to use the\
    \ JPA Metamodel to reference entity attributes in a type-safe way. The metamodel\
    \ consists of a generated class for each managed class in the persistence unit.\
    \ These classes are stored in the same package and have the name as the corresponding\
    \ managed classes with an added \"_\" at the end.\n\nThe only thing you have to\
    \ do to generate these classes is to add a dependency to Hibernate's Static Metamodel\
    \ Generator to your build process like I do in the following Maven pom.xml file.\n\
    \n```\n<project>\n  <modelVersion>4.0.0</modelVersion>\n\n  <dependencies>\n \
    \   <dependency>\n      <groupId>org.hibernate</groupId>\n      <artifactId>hibernate-jpamodelgen</artifactId>\n\
    \    </dependency>\n    ..\n  </dependencies>\n\n  ..\n</project>\n```\n\nHibernate\
    \ generates the Metamodel classes with each Maven build and stores them in the\
    \ target/generated-sources/annotations folder of your project.\n\nLet's have a\
    \ look at an example of a Metamodel class. The first code snippet shows the Book\
    \ entity that you know from most examples in this book. The second one shows the\
    \ generated metamodel class Book_.\n\n```\n@Entity\npublic class Book {\n\n  \
    \  @Id\n    @GeneratedValue(strategy = GenerationType.AUTO)\n    private Long\
    \ id;\n\n    @Version\n    private int version;\n\n    private String title;\n\
    \n    private Double price;\n\n    @Temporal(TemporalType.DATE)\n    private Date\
    \ publishingDate;\n\n    @ManyToOne\n    @JoinColumn(name=\"publisherid\")\n \
    \   private Publisher publisher;\n\n    @ManyToMany\n    @JoinTable(name=\"BookAuthor\"\
    ,\n        joinColumns={\n            @JoinColumn(name=\"bookId\", referencedColumnName=\"\
    id\")),\n        inverseJoinColumns={\n            @JoinColumn(name=\"authorId\"\
    , referencedColumnName=\"id\")\n        })\n    private Set<Author> authors =\
    \ new HashSet<Author>>();\n```\n\n...\n}\n```\n\n```\n@Generated(\n    value=\"\
    org.hibernate.jpamodelgen.JPAMetaAModelEntityProcessor\")\n@StaticMetamodel(Book.class)\n\
    public abstract class Book_ {\n\n    public static volatile SingularAttribute<Book,\
    \ Double> price;\n    public static volatile SingularAttribute<Book, Publisher>\
    \ publisher;\n    public static volatile SingularAttribute<Book, Long> id;\n \
    \   public static volatile SingularAttribute<Book, String> title;\n    public\
    \ static volatile SingularAttribute<Book, Date> publishingDate;\n    public static\
    \ volatile SingularAttribute<Book, Integer> version;\n    public static volatile\
    \ SetAttribute<Book, Author> authors;\n\n}\n```\n\nAs you can see, the generated\
    \ class Book_ has a static attribute for each attribute of the Book entity. You\
    \ can use it to reference the entity attribute in a type-safe way. I do that in\
    \ the following code snippet to reference the title and publishingDate attribute\
    \ of the Book.\n\n```\n// Define the CriteriaQuery\nCriteriaBuilder cb = em.getCriteriaBuilder();\n\
    CriteriaQuery<Book> cq = cb.createQuery(Book.class);\nRoot<Book> root = cq.from(Book.class);\n\
    cq.orderBy(cb.asc(root.get(\"id\")));\n\n// Execute query with pagination\nList<Book>\
    \ books = em.createQuery(cq)\n    .setMaxResults(5)\n    .setFirstResult(0)\n\
    \    .getResultList();\n```\n\n## Source Code\n\nYou can find a project with executable\
    \ test cases for this Hibernate tip in the CriteriaQueryPagination module of the\
    \ example project. If you haven't already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n## Learn more\n\nYou can use the same approach to paginate the result of a JPQL\
    \ query. I explain it in more detail in How to use pagination with JPQL.\n\n#\
    \ STORED PROCEDURES\n\nStored procedures are a common approach to implement logic.\
    \ But in the past, Hibernate and JPA didn't support them well. That changed with\
    \ JPA 2.1 and the introduction of StoredProcedureQuery. You can now define ad-hoc\
    \ queries at runtime:\n\n- How to create ad-hoc stored procedure\n- How to call\
    \ stored procedure with named query\n\n# How to create ad-hoc procedure call\n\
    \n## Problem\n\nMy database administrator created a stored procedure that I need\
    \ to call. How do I create ad-hoc procedure call?\n\n## Solution\n\nSince JPA\
    \ 2.1, you can use the createStoredProcedureQuery method of the EntityManager.\
    \ If you're using Hibernate version older than 4.3, you need to use native query.\
    \ The following code snippet shows an example of ad-hoc procedure call.\n\n```\n\
    // define the stored procedure\nStoredProcedureQuery query = em.createStoredProcedureQuery(\"\
    calculate\");\nquery.registerStoredProcedureParameter(\"x\", Double.class, ParameterMode.IN);\n\
    query.registerStoredProcedureParameter(\"y\", Double.class, ParameterMode.IN);\n\
    query.registerStoredProcedureParameter(\"sum\", Double.class, ParameterMode.OUT);\n\
    \n// set input parameter\nquery.setParameter(\"x\", 1.23);\nquery.setParameter(\"\
    y\", 4);\n\n// call the stored procedure and get result\nquery.execute();\nDouble\
    \ sum = (Double) query.getOutputValue();\n\nYou can split an ad-hoc stored procedure\
    \ call into three parts. You first need to define the stored procedure call, set\
    \ the input parameters in the second part and then call the stored procedure and\
    \ retrieve its return value in the final part.\n\nLet's start with the definition\
    \ of the stored procedure call. You need to call the `createStoredProcedureQuery`\
    \ method of the EntityManager with the name of the stored procedure you want to\
    \ execute. This method returns a `StoredProcedureQuery` interface that you can\
    \ use to define a stored procedure call, set its input parameters and call it.\n\
    \nIn this example, I call the stored procedure `calculate`. It's a simple procedure\
    \ that expects the input parameters `x` and `y` and returns the sum of them. I\
    \ call the `registerStoredProcedureParameter` method of the `StoredProcedureQuery`\
    \ for each of them and register them with their name, type and `ParameterMode`.\
    \ The `ParameterMode` specifies if the parameter is used as an input `(ParameterMode.IN)`,\
    \ input and output `(ParameterMode.INOUT)` or as a result cursor `(ParameterMode.REF_CURSOR)`.\n\
    \nThat's all you need to to define the stored procedure call. The second and third\
    \ part of an ad-hoc stored procedure call is identical to the execution of a `@NamedStoredProcedureQuery`.\n\
    \nI set the values for both input parameters by calling the `setParameter` method\
    \ on the `StoredProcedureQuery` interface for each of them. And then I call the\
    \ `execute` and the `getOutputParameterValue` methods to execute the stored procedure\
    \ and to read the return value.\n"
  mdcn: "\n\n# 如何在 CriteriaQuery 中使用分页\n\n## 问题\n\nCriteria API 未提供用于定义返回记录数量的方法。我该如何对\
    \ CriteriaQuery 的结果进行分页？\n\n## 解决方案\n\n如果你熟悉 SQL，那么为 CriteriaQuery 定义分页虽然简单，但并不直观。Criteria\
    \ API 没有提供任何定义分页的方法。你必须在 `Query` 对象上设置分页信息，而不是在 `CriteriaQuery` 接口上。你可以通过调用 `setFirstResult(int\
    \ startPosition)` 和 `setMaxResults(int maxResults)` 方法来实现这一点。这样做的好处是，你也可以使用这种方法对\
    \ JPQL 查询的结果进行分页。\n\n以下代码段展示了一个简单的示例，从数据库中返回前五个 `Author` 实体。结果集索引从 0 开始，你需要提供\
    \ 0 作为 `startPosition` 以从第一个元素开始。\n\n```\n// Define the CriteriaQuery\nCriteriaBuilder\
    \ cb = em.getCriteriaBuilder();\nCriteriaQuery<Book> cq = cb.createQuery(Book.class);\n\
    Root<Book> root = cq.from(Book.class);\ncq.orderBy(cb.asc(root.get(\"id\")));\n\
    \n// 使用分页执行查询\nList<Book> books = em.createQuery(cq)\n    .setMaxResults(5)\n\
    \    .setFirstResult(0)\n    .getResultList();\n```\n\n要从数据库中选择下五个 `Author`，你只需要将\
    \ `startPosition` 改为 5 即可。\n\n```\n// Define the CriteriaQuery\nCriteriaBuilder\
    \ cb = em.getCriteriaBuilder();\nCriteriaQuery<Book> cq = cb.createQuery(Book.class);\n\
    Root<Book> root = cq.from(Book.class);\ncq.orderBy(cb.asc(root.get(Book..id)));\n\
    \n// 使用分页执行查询\nList<Book> books = em.createQuery(cq)\n    .setMaxResults(5)\n\
    \    .setFirstResult(5)\n    .getResultList();\n```\n\n## 源代码\n\n你可以在示例项目的 `CriteriaQueryPagination`\
    \ 模块中找到包含此 Hibernate 技巧可执行测试用例的项目。如果你还没有下载，可以访问 http://www.hibernate-tips.com/download-examples\
    \ 进行下载。\n\n## 了解更多信息\n\n你可以使用相同的方法对 JPQL 查询的结果进行分页。我将在《如何在 JPQL 中使用分页》中进行更详细的解释。\n\
    \n# 如何以类型安全的方式引用实体属性\n\n## 问题\n\n通过名称引用实体属性容易出错，并且使代码难以重构。我该如何以类型安全的方式引用属性，以便在必须更改其名称时不遇到问题？\n\
    \n## 解决方案\n\n我更倾向于使用 JPA Metamodel（元模型）来以类型安全的方式引用实体属性。元模型由持久化单元中每个受管理类生成的类组成。这些类存储在相同的包中，名称与相应的受管理类相同，但在末尾添加了\
    \ `_`。\n\n生成这些类唯一需要做的是在你的构建过程中为 Hibernate 的静态元模型生成器（Static Metamodel Generator）添加依赖项，就像我在下面的\
    \ Maven `pom.xml` 文件中所做的那样。\n\n```\n<project>\n  <modelVersion>4.0.0</modelVersion>\n\
    \n  <dependencies>\n    <dependency>\n      <groupId>org.hibernate</groupId>\n\
    \      <artifactId>hibernate-jpamodelgen</artifactId>\n    </dependency>\n   \
    \ ..\n  </dependencies>\n\n  ..\n</project>\n```\n\nHibernate 在每次 Maven 构建时生成元模型类，并将其存储在项目的\
    \ `target/generated-sources/annotations` 文件夹中。\n\n让我们来看元模型类的示例。第一个代码段显示了你在书书中大多数示例中见过的\
    \ `Book` 实体。第二个显示了生成的元模型类 `Book_`。\n\n```\n@Entity\npublic class Book {\n\n  \
    \  @Id\n    @GeneratedValue(strategy = GenerationType.AUTO)\n    private Long\
    \ id;\n\n    @Version\n    private int version;\n\n    private String title;\n\
    \n    private Double price;\n\n    @Temporal(TemporalType.DATE)\n    private Date\
    \ publishingDate;\n\n    @ManyToOne\n    @JoinColumn(name=\"publisherid\")\n \
    \   private Publisher publisher;\n\n    @ManyToMany\n    @JoinTable(name=\"BookAuthor\"\
    ,\n        joinColumns={\n            @JoinColumn(name=\"bookId\", referencedColumnName=\"\
    id\")),\n        inverseJoinColumns={\n            @JoinColumn(name=\"authorId\"\
    , referencedColumnName=\"id\")\n        })\n    private Set<Author> authors =\
    \ new HashSet<Author>>();\n```\n\n...\n}\n```\n\n```\n@Generated(\n    value=\"\
    org.hibernate.jpamodelgen.JPAMetaAModelEntityProcessor\")\n@StaticMetamodel(Book.class)\n\
    public abstract class Book_ {\n\n    public static volatile SingularAttribute<Book,\
    \ Double> price;\n    public static volatile SingularAttribute<Book, Publisher>\
    \ publisher;\n    public static volatile SingularAttribute<Book, Long> id;\n \
    \   public static volatile SingularAttribute<Book, String> title;\n    public\
    \ static volatile SingularAttribute<Book, Date> publishingDate;\n    public static\
    \ volatile SingularAttribute<Book, Integer> version;\n    public static volatile\
    \ SetAttribute<Book, Author> authors;\n\n}\n```\n\n如你所示，生成的类 `Book_` 为 `Book`\
    \ 实体的每个属性提供了一个静态属性。你可以用它以类型安全的方式引用实体属性。我在下面的代码段中引用了 `Book` 的 `title` 和 `publishingDate`\
    \ 属性。\n\n```\n// Define the CriteriaQuery\nCriteriaBuilder cb = em.getCriteriaBuilder();\n\
    CriteriaQuery<Book> cq = cb.createQuery(Book.class);\nRoot<Book> root = cq.from(Book.class);\n\
    cq.orderBy(cb.asc(root.get(\"id\")));\n\n// 使用分页执行查询\nList<Book> books = em.createQuery(cq)\n\
    \    .setMaxResults(5)\n    .setFirstResult(0)\n    .getResultList();\n```\n\n\
    ## 源代码\n\n你可以在示例项目的 `CriteriaQueryPagination` 模块中找到包含此 Hibernate 技巧可执行测试用例的项目。如果你还没有下载，可以访问\
    \ http://www.hibernate-tips.com/download-examples。\n\n## 了解更多信息\n\n你可以使用相同的方法对\
    \ JPQL 查询的结果进行分页。我将在《如何在 JPQL 中使用分页》中详细解释。\n\n# 存储过程 (Stored Procedures)\n\n存储过程是实现逻辑的常用方法。但过去\
    \ Hibernate 和 JPA 对它们的支持并不良好。随着 JPA 2.1 引入 `StoredProcedureQuery`，情况发生了变化。你现在可以定义动态查询：\n\
    \n- 如何创建存储过程\n- 如何使用命名查询调用存储过程\n\n# 如何创建动态存储过程调用\n\n## 问题\n\n我的数据库管理员创建了一个需要调用的存储过程。我如何创建动态存储过程调用？\n\
    \n## 解决方案\n\n从 JPA 2.1 开始，你可以使用 `EntityManager` 的 `createStoredProcedureQuery`\
    \ 方法。如果你使用的是低于 4.3 的 版本，则需要使用原生查询。以下代码段展示了存储过程调用的示例。\n\n```\n// 定义存储过程\nStoredProcedureQuery\
    \ query = em.createStoredProcedureQuery(\"calculate\");\nquery.registerStoredProcedureParameter(\"\
    x\", Double.class, ParameterMode.IN);\nquery.registerStoredProcedureParameter(\"\
    y\", Double.class, ParameterMode.IN);\nquery.registerStoredProcedureParameter(\"\
    sum\", Double.class, ParameterMode.OUT);\n\n// 设置输入参数\nquery.setParameter(\"x\"\
    , 1.23);\nquery.setParameter(\"y\", 4);\n\n// 调用存储过程并获取结果\nquery.execute();\n\
    Double sum = (Double) query.getOutputValue();\n```\n\n你可以将动态存储过程调用分为三部分。你首先定义存储过程调用，在第二部分设置输入参数，最后在最后部分调用存储过程并获取返回值。\n\
    \n首先是调用 `EntityManager` 的 `createStoredProcedureQuery` 方法并传入要执行的存储过程名称。该方法返回一个\
    \ `StoredProcedureQuery` 接口，可以使用它来定义存储过程调用、设置输入参数并执行它。\n\n在示例中，我调用了存储过程 `calculate`。它是一个简单的过程，接收输入参数\
    \ `x` 和 `y` 并返回它们的和。我通过 `StoredProcedureQuery` 的 `registerStoredProcedureParameter`\
    \ 方法对每个参数进行注册，并传入它们的名称、类型和 `ParameterMode`。`ParameterMode` 指定了参数是作为输入 `(ParameterMode.IN)`、输入输出\
    \ `(ParameterMode.INOUT)` 还是结果游标 `(ParameterMode.REF_CURSOR)`。\n\n这就是定义存储过程调用所需的全部工作。动态存储过程调用的第二部分部分与执行\
    \ `@NamedStoredProcedureQuery` 完全相同。\n\n我通过调用 `StoredProcedureQuery` 接口上的 `setParameter`\
    \ 方法为两个输入参数赋值。然后调用 `execute` 和 `getOutputParameterValue` 方法来执行存储过程并读取返回值。\n\n"
