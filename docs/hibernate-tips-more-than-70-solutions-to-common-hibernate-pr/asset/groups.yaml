  - "[PAGE 167]\n\n# How to count the executed queries in a Session\n\nProblem\n\n\
    Some of my use cases are slow and seem to perform too many queries. How do I count\
    \ all queries executed within a Hibernate Session?\n\n# Solution\n\nThe easiest\
    \ way to count all executed queries is to activate Hibernate's statistics component.\
    \ Hibernate then collects a lot of internal statistics and provides them as a\
    \ log message and via the Statistics API.\n\n> Do not use this in production!\
    \ Collecting the statistical information creates an overhead that slows down your\
    \ application.\n\nHibernate's statistics component is deactivated by default.\
    \ You can activate it by setting the hibernate.generate_statistics parameter to\
    \ true. You can either this by providing a system property with the same name\
    \ or by setting the parameter in the persistence.xml file.\n\n```\n<persistence>\n\
    \  <persistence-unit name=\"my-persistence-unit\">\n    <description>Hibernate\
    \ Tips</description>\n    <provider>\n      org.hibernate.jpa.HibernatePersistenceProvider\n\
    \    </provider>\n    <properties>\n      <property name=\"hibernate.generate_statistics\"\
    \ value=\"true\" />\n    </properties>\n  </persistence-unit>\n</persistence>\n\
    ```"
  - '[PAGE 168]


    ```

    </properties>

    </persistence-unit>

    </persistence>

    ```


    You have two options to access the statistics. Hibernate can write a subset with
    the most important information of each session to the log file or you can access
    them via the Statistics API.


    Let''s take a look at the log messages first. Hibernate writes a log message,
    similar to the following one, at the end of each session. It shows the number
    of SQL statements, the time spent for their preparation and execution and the
    interaction with the second-level cache.


    ```

    16:24:55,318 INFO

    [org.hibernate.engine.internal.StatisticalLoggingSessionEventEventListener] -
    Session Metrics {

    25659 nanoseconds acquiring 1 JDBC connections;

    22394 nanoseconds spent releasing 1 JDBC connections;

    109216 nanoseconds spent preparing 12 JDBC statements;

    1111842 nanoseconds spent executing 12 JDBC statements;

    0 nanoseconds spent executing 0 JDBC batches;

    0 nanoseconds spent performing 0 L2C puts;

    0 nanoseconds spent performing 0 L2C hits;

    0 nanoseconds spent performing 0 L2C misses;

    1699942 nanoseconds spent executing 1 flushes (flushing a total of 17 entities
    and 17 collections);

    63915 nanoseconds spent executing 1 partial-flushes (flushing a total of 0 entities
    and 0 collections)

    ```


    You can also access the Statistics API via Hibernate''s Statistics interface.

    You can get it from the SessionFactory. It provides several getter methods that
    give you access to more detailed information than the log output.


    ```

    Statistics stats = sessionFactory.getStatistics();

    long queryCount = stats.getQueryExecutionCount();

    long collectionFetchCount = stats.getCollectionFetchCount;

    ```'
- md: "\n## Source Code\n\nYou can find a project with executable test cases for this\
    \ Hibernate tip in the CheckSQLStatementCount module of the example project. If\
    \ you haven't already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n## Learn more\n\nIf you want to learn more about Hibernate's logging features,\
    \ you should have a look at these tips:\n\n- How to log SQL statements and their\
    \ parameters\n- How to use query comments to identify a query\n\n## How to use\
    \ query comments to identify a query\n\n## Problem\n\nMy application performs\
    \ a lot of similar queries and I need to find the output of a specific query in\
    \ my log file. Is there any way to make it easier to find a specific query in\
    \ the log output?\n\n## Solution\n\nHibernate can add a comment when it generates\
    \ an SQL statement for a JPQL or Criteria query or executes a native SQL query.\
    \ You can see it in your application log file, when you activate SQL statement\
    \ logging and in your database logs.\n\nYou need to activate SQL comments by setting\
    \ the configuration parameter hibernate.use_sql_comments to true. The following\
    \ code snippet shows an example configuration in the persistence.xml file.\n\n\
    ```\n<persistence>\n  <persistence-unit name=\"my-persistence-unit\">\n    <description>Hibernate\
    \ Tips</description>\n    <provider>\n      org.hibernate.jpa.HibernatePersistenceProvider\n\
    \    </provider>\n    <exclude-unlisted-classes>false</exclude-unlisted-classes>\n\
    \    <properties>\n      <property name=\"hibernate.dialect\" value=\"org.hibernate.dialect.PostgreSQLSQLDialect\"\
    \ />\n      <property name=\"hibernate.use_sql_comments\" value=\"true\" />\n\
    \    </properties>\n  </persistence-unit>\n</persistence>\n```\n\nWhen you activate\
    \ SQL comments, Hibernate generates a comment for each query. These are often\
    \ not useful to find a specific query. It's better to provide your own comment\
    \ with the org.hibernate.comment hint.\n\nI use it in the following example to\
    \ set the SQL comment for my query to \"This is my comment\".\n\n```\nTypedQuery\
    \ q = em.createQuery(\n  \"SELECT FROM Author a WHERE a.id = :id\",\n  Author.class);\n\
    q.setParameter(\"id\", 1l);\nq.setHint(\"org.hibernate.comment\", \"This is my\
    \ comment\")\nAuthor a = q.getSingleResult();\n```\n\nHibernate adds this comment\
    \ to the generated SQL statement and writes it to the log file.\n\n```\n08:14:57,432\
    \ DEBUG [org.hibernate.SQL] - /* This is my comment */ /\nselect author0_.id as\
    \ id1_0_, author0_.firstName as firstName2_0_,\nauthor0_.lastName as lastName3_0_,\
    \ author0_.version as version4_0_\nfrom Author author0_ where author0_.id=?\n\
    ```\n\n## Source Code\n\nYou can find a project with executable test cases for\
    \ this Hibernate tip in the CommentsSQLStatements module of the example project.\
    \ If you haven't already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n## Learn More\n\nHibernate and JPA support several other hints. I summarized\
    \ the most interesting ones in 11 JPA and Hibernate query hints every developer\
    \ should know.\n\n### JPQL\n\nJPQL is a query language defined by the JPA specification\
    \ that you can use to read, update or delete entities. Its syntax is very similar\
    \ to SQL but the queries are defined based on the entity object model instead\
    \ of the table model. That makes it easier to use for most Java developers.\n\n\
    The following Hibernate tips show you several example use cases:\n\n- How to create\
    \ a JPQL query at runtime\n- How to create a named JPQL query\n- How to select\
    \ a POJO with a JPQL query\n- How to select multiple scalar values with a JPQL\
    \ query\n- How to initialize lazy relationships within a JPQL query\n- How to\
    \ downcast entities in JPQL queries\n- How to call a standard function in a JPQL\
    \ query\n- How to call a user-defined function in a JPQL query\n- How to use pagination\
    \ with JPQL\n- How to define a timeout for a JPQL query\n- How to delete multiple\
    \ entities with one JPQL query\n- How to update multiple entities with one JPQL\
    \ query\n\nJPQL is comfortable to use but it also has two main disadvantages.\
    \ The most noticeable one is that it is not as powerful as SQL. And it it also\
    \ introduces an additional abstraction on top of SQL and it’s not supported by\
    \ relational databases. Hibernate needs to generate an SQL query based on the\
    \ JPQL query to interact with the database.\n\n## How to create a JPQL query at\
    \ runtime\n\n## Problem\n\nI need to create a JPQL query based on user input.\
    \ How do I do that at runtime?\n\n## Solution\n\nYou can call the createQuery\
    \ method of the EntityManager with a JPQL query as a String to create an ad hoc\
    \ query. The following code snippet shows an example of such a query. The Book\
    \ entity with a given id.\n\n```\nTypedQuery<Book> q = em.createQuery(\n    \"\
    SELECT b FROM Book b WHERE b.id = :id\", Book.class);\nq.setParameter(\"id\",\
    \ 11);\nBook b = q.getSingleResult();\n```\n\nAs you can see, I provide a String\
    \ with the JPQL query and the class of the Book entity as parameters to the createQuery\
    \ method. The JPQL syntax is pretty similar to SQL. But it uses the entity object\
    \ instead of database tables to define the query. That makes it very comfortable\
    \ for Java developers, but you have to keep in mind that the database still uses\
    \ SQL. Hibernate, and any other JPA implementation to transform the JPQL query\
    \ into SQL. It is, therefore, a good practice to activate the logging of the SQL\
    \ statements during development to check the generated SQL statements.\n\nThe\
    \ query selects a Book entity with a given id, and I use the named parameter :id\
    \ as a placeholder in the WHERE clause of the query. Bind parameters provide huge\
    \ benefits compared to putting the parameter values directly into the query String.\
    \ Hibernate maps the bind parameter value to the correct type and escapes it if\
    \ necessary. That makes them easier to handle and prevents SQL injection vulnerabilities.\
    \ You can set the value of each bind parameter by calling the setParameter method\
    \ of the Query TypedQuery interface with the parameter name and its value.\n\n\
    I also provide the class of the Book entity as the second parameter to the createQuery\
    \ method. This parameter is optional. It tells the Hibernate type of the query\
    \ results and allows it to use the strongly typed TypedQuery instead of the untyped\
    \ Query interface. You can see the main benefit of it in the last line of the\
    \ code sample. The getSingleResult method of the TypedQuery returns a Book entity\
    \ instead of an Object, and I don’t need to cast the query result.\n\n## Source\
    \ Code\n\nYou can find a project with executable test cases for this Hibernate\
    \ tip in the JPQLADHocQuery module of the example project. If you haven’t already\
    \ done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n## Learn More\n\nAd-hoc queries are just one option to create a JPQL query.\
    \ You can also use named queries that you statically define via annotations and\
    \ reference by their name. I explain them in more detail in How to create a named\
    \ JPQL query.\n\n## How to create a named JPQL query\n\n## Problem\n\nI have queries\
    \ that I want to use in multiple places in my business logic. What is the best\
    \ way to define these queries once and use them when needed?\n\n## Solution\n\n\
    Named queries provide a good solution if you want to define a query once and in\
    \ multiple parts of your business logic. You define a named query with the @NamedQuery\
    \ annotation. The following code snippet shows a simple example of such a query.\n\
    \n```\n@Entity\n@NamedQuery(\n    name = Book.QUERY_SELECT_BY_ID,\n    query =\
    \ \"SELECT b FROM Book b WHERE b.id = :\" + Book.PARAM_ID)\npublic class Book\
    \ {\n    public static final String QUERY_SELECT_BY_ID =\n        \"Book.selectById\"\
    ;\n    public static final String PARAM_ID = \"id\";\n\n    ...\n}\n```\n\nThe\
    \ @NamedQuery annotation requires two parameters: The name and the JPQL query\
    \ String. As you can see, I use a static String as the name of the query and the\
    \ bind parameter. That makes it easier to reference them in the business logic.\n"
  mdcn: "\n\n## 源代码\n\n你可以在示例项目的 `CheckSQLStatementCount` 模块中找到包含此 Hibernate 技巧的可执行测试用例的项目。如果你还没有下载，可以访问\
    \ http://www.hibernate-tips.com/download-examples 进行下载。\n\n## 了解更多\n\n如果你想学习更多关于\
    \ Hibernate 日志功能的知识，你应该查看以下技巧：\n\n- 如何记录 SQL 语句及其参数\n- 如何使用查询注释来识别特定查询\n\n## 如何使用查询注释来识别查询\n\
    \n## 问题\n\n我的应用程序执行了许多相似的查询，我需要在日志文件中找到特定查询的输出。有没有什么方法可以更方便地在日志输出中找到特定的查询？\n\n\
    ## 解决方案\n\n当 Hibernate 为 JPQL 或 Criteria 查询生成 SQL 语句，或者执行原生 SQL 查询时，它可以添加一条注释。当你激活了\
    \ SQL 语句日志记录时，你可以在应用程序的日志文件以及你的数据库日志中看到它。\n\n你需要通过将配置参数 `hibernate.use_sql_comments`\
    \ 设置为 `true` 来启用 SQL 注释。以下代码段显示了 `persistence.xml` 文件中的一个示例配置。\n\n```\n<persistence>\n\
    \  <persistence-unit name=\"my-persistence-unit\">\n    <description>Hibernate\
    \ Tips</description>\n    <provider>\n      org.hibernate.jpa.HibernatePersistenceProvider\n\
    \    </provider>\n    <exclude-unlisted-classes>false</exclude-unlisted-classes>\n\
    \    <properties>\n      <property name=\"hibernate.dialect\" value=\"org.hibernate.dialect.PostgreSQLSQLDialect\"\
    \ />\n      <property name=\"hibernate.use_sql_comments\" value=\"true\" />\n\
    \    </properties>\n  </persistence-unit>\n</persistence>\n```\n\n当激活 SQL 注释时，Hibernate\
    \ 会为每个查询生成一条注释。这些注释对于寻找特定查询通常并不有用。更好的做法是使用 `org.hibernate.comment` 提示提供自己的注释。\n\
    \n我在下面的示例中使用它，将我的查询的 SQL 注释设置为 \"This is my comment\"。\n\n```\nTypedQuery q =\
    \ em.createQuery(\n  \"SELECT FROM Author a WHERE a.id = :id\",\n  Author.class);\n\
    q.setParameter(\"id\", 1l);\nq.setHint(\"org.hibernate.comment\", \"This is my\
    \ comment\")\nAuthor a = q.getSingleResult();\n```\n\nHibernate 将此注释添加到生成的 SQL\
    \ 语句中，并将其写入日志文件。\n\n```\n08:14:57,432 DEBUG [org.hibernate.SQL] - /* This is my\
    \ comment */ /\nselect author0_.id as id1_0_, author0_.firstName as firstName2_0_,\n\
    author0_.lastName as lastName3_0_, author0_.version as version4_0_\nfrom Author\
    \ author0_ where author0_.id=?\n```\n\n## 源代码\n\n你可以在示例项目的 `CommentsSQLStatements`\
    \ 模块中找到包含此 Hibernate 技巧的可执行测试用例的项目。如果你还没有下载，可以访问 http://www.hibernate-tips.com/download-examples\
    \ 进行下载。\n\n## 了解更多\n\nHibernate 和 JPA 支持其他几种提示。我在《每个开发者应该知道的11个 JPA 和 Hibernate\
    \ 查询提示》中总结了最有趣的几个。\n\n### JPQL\n\nJPQL 是 JPA 规范定义的一种查询语言，你可以用它来读取、更新或删除实体。它的语法与\
    \ SQL 非常相似，但查询是基于实体对象模型而不是表模型定义的。这使得大多数 Java 开发者使用起来更加方便。\n\n以下 Hibernate 技巧向你展示了几个示例用例：\n\
    \n- 如何在运行时创建 JPQL 查询\n- 如何创建命名的 JPQL 查询\n- 如何使用 JPQL 查询选择 POJO\n- 如何使用 JPQL 查询选择多个标量值\n\
    - 如何在 JPQL 查询中初始化延迟关联\n- 如何在 JPQL 查询中对实体进行向下类型转换\n- 如何在 JPQL 查询中调用标准函数\n- 如何在\
    \ JPQL 查询中调用自定义函数\n- 如何在 JPQL 中使用分页\n- 如何为 JPQL 查询定义超时\n- 如何用一个 JPQL 查询删除多个实体\n\
    - 如何用一个 JPQL 查询更新多个实体\n\nJPQL 使用起来很方便，但它也有两个主要缺点。最明显的一点是它没有 SQL 强大。而且它它在 SQL 之上引入了额外的抽象，关系型数据库并不支持它。Hibernate\
    \ 需要根据 JPQL 查询生成 SQL 查询来与数据库交互。因此，在开发期间激活 SQL 语句的日志记录是一个良好的做法。\n\n## 如何在运行时创建\
    \ JPQL 查询\n\n## 问题\n\n我需要根据用户输入创建一个 JPQL 查询。我如何在运行时做到这一点？\n\n## 解决方案\n\n你可以调用\
    \ `EntityManager` 的 `createQuery` 方法，并传入字符串形式的 JPQL 查询创建一个即时查询。以下代码段显示了此类查询的示例：具有给定\
    \ ID 的 `Book` 实体。\n\n```\nTypedQuery<Book> q = em.createQuery(\n    \"SELECT b\
    \ FROM Book b WHERE b.id = :id\", Book.class);\nq.setParameter(\"id\", 11);\n\
    Book b = q.getSingleResult();\n```\n\n如你所示，我将带有 JPQL 查询的字符串和 `Book` 实体的类作为参数传递给\
    \ `createQuery` 方法。JPQL 的语法与 SQL 非常相似。但它使用实体对象而不是数据库表来定义查询。这让 Java 开发者感到非常舒服，但你必须记住数据库仍然在使用\
    \ SQL。Hibernate 以及任何其他 JPA 实现会将 JPQL 查询转换为 SQL。因此，在开发期间激活 SQL 语句的日志记录是一个良好的实践。\n\
    \n## 源代码\n\n你可以在示例项目的 `JPQLADHocQuery` 模块中找到包含此 Hibernate 技巧的可执行测试用例的项目。如果你还没有下载，可以访问\
    \ http://www.hibernate-tips.com/download-examples 进行下载。\n\n## 了解更多\n\n即时查询只是创建\
    \ JPQL 查询的一种选择。你还可以使用通过注解静态定义的命名查询，并通过它们的名称进行引用。我将在“如何创建命名的 JPQL 查询”中详细解释它们。\n\
    \n## 如何创建命名的 JPQL 查询\n\n## 问题\n\n我有一些查询需要在业务逻辑的多个地方使用。一次性定义这些查询并在需要时使用的最佳方法是什么？\n\
    \n## 解决方案\n\n如果你想在业务逻辑的多个部分中定义一个查询，命名查询提供了一个很好的解决方案。你使用 `@NamedQuery` 注解定义命名查询。以下代码段显示了此类查询的简单示例。\n\
    \n```\n@Entity\n@NamedQuery(\n    name = Book.QUERY_SELECT_BY_ID,\n    query =\
    \ \"SELECT b FROM Book b WHERE b.id = :\" + Book.PARAM_ID)\npublic class Book\
    \ {\n    public static final String QUERY_SELECT_BY_ID =\n        \"Book.selectById\"\
    ;\n    public static final String PARAM_ID = \"id\";\n\n    ...\n}\n```\n\n`@NamedQuery`\
    \ 注解需要两个参数：名称和 JPQL 查询字符串。如你所示，我使用静态字符串作为查询的名称。这使得在业务逻辑中引用它们变得更加容易。你可以通过调用 `TypedQuery`\
    \ 接口的 `setParameter` 方法设置每个绑定参数的值。\n\n我还将 `Book` 实体的类作为第二个参数传递给 `createQuery`\
    \ 方法。此参数是可选的。它告诉 Hibernate 查询结果的类型，并允许使用强类型的 `TypedQuery` 而不是未类型的接口 `Query`。你可以在代码示例的最后一行看到它的主要优势。`TypedQuery`\
    \ 的 `getSingleResult` 方法返回 `Book` 实体而不是 `Object`，我不需要对查询结果进行强制转换。\n\n"
