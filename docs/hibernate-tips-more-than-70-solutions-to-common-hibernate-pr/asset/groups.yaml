    # MappedSuperclass


    The MappedSuperclass approach maps each entity class to a database table but not
    the superclass. In this example, it maps the entity classes Author, BlogPost and
    Book to the database tables author, blogpost and book. The Publication class does
    not get mapped to any database table.'
