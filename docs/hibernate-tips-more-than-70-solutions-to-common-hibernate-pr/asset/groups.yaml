- md: "\n```sql\ninner join\nBookAuthor authors1_\n on book._id=authors1.bookId\n\
    inner join\nauthor2_\n on authors1._authorId=author2._id\nwhere\n author2._firstName=?\n\
    \ and author2._lastName=?\n13:43:58,571 TRACE [org.hibernate.type.descriptor.sql.BasicBinder]\
    \ - \nbinding parameter [1] as [VARCHAR] - [Thorben]\n13:43:58,572 TRACE [org.hibernate.type.descriptor.sql.BasicBinder]\
    \ - \nbinding parameter [2] as [VARCHAR] - [Janssen]\n```\n\n## Source Code\n\n\
    You can find a project with executable test cases for this Hibernate tip in the\
    \ CriteriaQuery module of the example project. If you haven't already done so,\
    \ you can download it at http://www.hibernate-tips.com/download-examples.\n\n\
    ## Learn More\n\nThe CriteriaQuery in this example selects only one entity class.\
    \ That is the most common projection. But you can also use POJOs or more complex\
    \ projections that select multiple entities, POJOs or scalar values. I provide\
    \ examples for that in:\n\n- *How to select POJOs with a CriteriaQuery*\n- *How\
    \ to select multiple scalar values in a CriteriaQuery*\n\n## How to select POJOs\
    \ with a CriteriaQuery\n\n### Problem\n\nJPQL supports constructor expressions\
    \ to select POJOs instead of entities or scalar values. Can I do the same with\
    \ the Criteria API?\n\n### Solution\n\nYou can use a similar constructor expression\
    \ with the Criteria API as you use in JPQL queries. In the following example,\
    \ I want to select AuthorValue objects.\n\n```java\npublic class AuthorValue {\n\
    \n    private String firstName;\n    private String lastName;\n\n    public AuthorValue(String\
    \ firstName, String lastName) {\n        this.firstName = firstName;\n       \
    \ this.lastName = lastName;\n    }\n\n    ...\n}\n```\n\nThe definition of the\
    \ CriteriaQuery follows the same approach as you use to select entities.\n\nYou\
    \ first need to get a CriteriaBuilder instance from the EntityManager. It's a\
    \ factory class that helps you to define different parts of your query, like bind\
    \ parameters, function calls, and predicates.\n\nYou create a CriteriaQuery instance\
    \ that is the root of the object graph that represents your query. I recommend\
    \ providing the return type of your query as a parameter to the createQuery method.\
    \ It creates a typed instance of the CriteriaQuery interface. I want to select\
    \ AuthorValue objects in this example and, therefore, provide AuthorValue.class\
    \ as the parameter.\n\nIn the next step, you define the FROM clause of the query.\
    \ In this example, I use the Author entity as the root of the query.\n\nThen you\
    \ can define the projection of your query. In this example, it's a call of the\
    \ AuthorValue constructor. The construct method of CriteriaBuilder allows you\
    \ to define constructor classes. Call this method using the class that Hibernate\
    \ instantiates as the first parameter and optional list of Selections that are\
    \ used as constructor parameters.\n\nIn this example, I use the JPA Metamodel\
    \ class Author_ to reference the firstName and lastName attributes of the Author\
    \ entity. If you're not familiar with the JPA Metamodel, take a look at How to\
    \ reference entity attributes in a type-safe way, which provides a comfortable\
    \ and type-safe way to reference entity attributes.\n\nThe definition of the WHERE\
    \ clause is optional. If you want to select all records from the database, you\
    \ can skip this block and execute your query. That's what I do in this example.\
    \ You can see an example of a WHERE clause definition in How to select entities\
    \ with a CriteriaQuery.\n\n```java\nCriteriaBuilder cb = em.getCriteriaBuilder();\n\
    CriteriaQuery<AuthorValue> q = cb.createQuery(AuthorValue.class);\nRoot<Author>\
    \ root = q.from(Author.class);\nq.select(\ncb.construct(\n    AuthorValue.class,\n\
    \    root.get(Author_.firstName),\n    root.get(Author_.lastName));\n```\n\nThat’s\
    \ all you need to define the CriteriaQuery. You can execute it in two steps. You\
    \ first need to call the createQuery method of the EntityManager with your CriteriaQuery.\
    \ This method call returns the same TypedQuery interface as you use in your JQL\
    \ queries. You can use it to bind parameter values or to paginate the query result.\
    \ You don’t use any bind parameters in this example and therefore, skip this part.\
    \ In the final step, you need to call the getResultList method on the TypedQuery\
    \ interface to execute the query and retrieve a List of AuthorValue objects.\n\
    \n```java\nTypedQuery<AuthorValue> query = em.createQuery(q);\nList<AuthorValue>\
    \ authors = query.getResultList();\n```\n\nWhen I created the query, I referenced\
    \ the firstName and lastName attributes in the constructor call definition. As\
    \ you can see in the following log messages, Hibernate used these references to\
    \ generate an SQL query that selects the firstName and lastName columns from the\
    \ Author table.\n\n```sql\n13:43:09,884 DEBUG [org.hibernate.SQL] - \nselect\n\
    author0_.firstName as col_0_0,\nauthor0_.lastName as col_1_0\nfrom\nauthor0\n\
    ```\n\n## Source Code\n\nYou can find a project with executable test cases for\
    \ this Hibernate tip in the **CriteriaConstructor** module of the example project.\
    \ If you haven't already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n## Learn More\n\nIf you don't want to create a POJO to represent your query\
    \ result, you can also select a set of scalar values.\n\n## How to select scalar\
    \ values in a CriteriaQuery\n\n### Problem\n\nHow do I select a list of scalar\
    \ values using the Criteria API?\n\n### Solution\n\nYou can select multiple values\
    \ using the multiselect method of the CriteriaQuery. The following code snippet\
    \ shows an example of such:\n\n```java\n// Prepare query\nCriteriaBuilder cb =\
    \ em.getCriteriaBuilder();\nCriteriaQuery<Tuple> q = cb.createTupleQuery();\n\
    Root<Author> author = q.from(Author.class);\n\n// Select multiple values\nq.multiselect(\n\
    \  author.get(Author_.firstName).alias(\"firstName\"),\n  author.get(Author_.lastName).alias(\"\
    lastName\")\n);\n\nTypedQuery<Tuple> query = em.createQuery(q);\nList<Tuple> authorNames\
    \ = query.getResultList();\n\nfor (Tuple authorName : authorNames) {\n  log.info(authorName.get(\"\
    firstName\")\n  + authorName.get(\"lastName\"));\n}\n```\n"
  mdcn: "\n\n```sql\ninner join\nBookAuthor authors1_\n on book._id=authors1.bookId\n\
    inner join\nauthor2_\n on authors1._authorId=author2._id\nwhere\n author2._firstName=?\n\
    \ and author2._lastName=?\n13:43:58,571 TRACE [org.hibernate.type.descriptor.sql.BasicBinder]\
    \ - \nbinding parameter [1] as [VARCHAR] - [Thorben]\n13:43:58,572 TRACE [org.hibernate.type.descriptor.sql.BasicBinder]\
    \ - \nbinding parameter [2] as [VARCHAR] - [Janssen]\n```\n\n## 源代码\n\n你可以在示例项目的\
    \ CriteriaQuery 模块中找到包含此 Hibernate 技巧的可执行测试用例的项目。如果你还没有下载，可以访问 http://www.hibernate-tips.com/download-examples\
    \ 下载它。\n\n## 更多信息\n\n此示例中的 CriteriaQuery 仅选择一个实体类。这是最常见的投影方式。但你也可以使用 POJOs 或更复杂的投影来选择多个实体、POJOs\
    \ 或标量值。我在下文中提供了这些这些示例：\n\n- *如何使用 CriteriaQuery 选择 POJOs*\n- *如何使用 CriteriaQuery\
    \ 中选择多个标量值*\n\n## 如何使用 CriteriaQuery 选择 POJOs\n\n### 问题\n\nJPQL 支持使用构造函数表达式来选择\
    \ POJOs 而不是实体或标量值。我可以在 Criteria API 中同样这样做吗？\n\n### 解决方案\n\n你可以在 Criteria API\
    \ 中使用与 JPQL 查询相似的构造函数表达式。在接下来的示例中，我想选择 `AuthorValue` 对象。\n\n```java\npublic class\
    \ AuthorValue {\n\n    private String firstName;\n    private String lastName;\n\
    \n    public AuthorValue(String firstName, String lastName) {\n        this.firstName\
    \ = firstName;\n        this.lastName = lastName;\n    }\n\n    ...\n}\n```\n\n\
    CriteriaQuery 的定义与选择实体的方法相同。\n\n首先，你需要从 `EntityManager` 获取一个 `CriteriaBuilder`\
    \ 实例。它是一个工厂类，帮助你定义查询的不同部分，如绑定参数、函数调用和谓词。\n\n你创建一个 `CriteriaQuery` 实例，它是表示你查询的对象图的根节点。我建议将查询的返回类型作为参数传递给\
    \ `createQuery` 方法。它会创建一个 `CriteriaQuery` 接口的泛型实例。在示例中，我想选择 `AuthorValue` 对象，因此将\
    \ `AuthorValue.class` 作为参数。\n\n在下一步，你定义查询的 `FROM` 子句。在示例中，我使用 `Author` 实体作为查询的根。\n\
    \n然后你可以定义查询的投影。在示例中，它是对 `AuthorValue` 构造函数的调用。`CriteriaBuilder` 的 `construct`\
    \ 方法允许你定义构造函数类。使用 Hibernate 实例化的类作为第一个参数调用此方法，以及可选的 `Selections` 列表作为构造函数参数。\n\
    \n在示例中，我使用 JPA Metamodel 类 `Author_` 来引用 `Author` 实体的 `firstName` 和 `lastName`\
    \ 属性。如果你熟悉 JPA Metamodel，请查看《如何以类型安全的方式引用实体属性》，它提供了一种舒适且类型安全的方法引用实体属性。\n\n`WHERE`\
    \ 子句的定义是可选的。如果你想从数据库中选择所有记录，可以跳过此块并执行查询。这就是我在示例中所做的。你可以在《如何使用 CriteriaQuery 选择实体》中看到\
    \ `WHERE` 子句定义的示例。\n\n```java\nCriteriaBuilder cb = em.getCriteriaBuilder();\n\
    CriteriaQuery<AuthorValue> q = cb.createQuery(AuthorValue.class);\nRoot<Author>\
    \ root = q.from(Author.class);\nq.select(\ncb.construct(\n    AuthorValue.class,\n\
    \    root.get(Author_.firstName),\n    root.get(Author_.lastName));\n```\n\n这就是定义\
    \ CriteriaQuery 需要的所有内容。你可以分两个步骤执行它。首先，你需要调用 `EntityManager` 的 `createQuery` 方法并传入你的\
    \ `CriteriaQuery`。该方法返回与你在 JQL 查询中相同的 `TypedQuery` 接口。你可以使用它来绑定参数值或对查询结果进行分页。在这个示例中没有没有任何绑定参数，因此跳过此部分。在最后一步，你需要在\
    \ `TypedQuery` 接口上调用 `getResultList` 方法来执行查询并获取 `AuthorValue` 对象列表。\n\n```java\n\
    TypedQuery<AuthorValue> query = em.createQuery(q);\nList<AuthorValue> authors\
    \ = query.getResultList();\n```\n\n当我创建查询时，我在构造函数调用定义中引用了 `firstName` 和 `lastName`\
    \ 属性。正如在接下来的日志消息所示，Hibernate 使用这些引用来生成一个 SQL 查询，从 `Author` 表中选择 `firstName` 和\
    \ `lastName` 列。\n\n```sql\n13:43:09,884 DEBUG [org.hibernate.SQL] - \nselect\n\
    author0_.firstName as col_0_0,\nauthor0_.lastName as col_1_0\nfrom\nauthor0\n\
    ```\n\n## 源代码\n\n你可以在示例项目的 **CriteriaConstructor** 模块中找到包含此 Hibernate 技巧的可执行测试用例的项目。如果你还没有下载，可以访问\
    \ http://www.hibernate-tips.com/download-examples 下载它。\n\n## 更多信息\n\n如果你不想创建一个\
    \ POJO 来表示查询结果，也可以选择一组标量值。\n\n## 如何在 CriteriaQuery 中选择标量值\n\n### 问题\n\n我如何使用 Criteria\
    \ API 选择标量值列表？\n\n### 解决方案\n\n你可以使用 `CriteriaQuery` 的 `multiselect` 方法选择多个值。下面的代码片段展示了此类示例：\n\
    \n```java\n// 准备查询\nCriteriaBuilder cb = em.getCriteriaBuilder();\nCriteriaQuery<Tuple>\
    \ q = cb.createTupleQuery();\nRoot<Author> author = q.from(Author.class);\n\n\
    // 选择多个值\nq.multiselect(\n  author.get(Author_.firstName).alias(\"firstName\"\
    ),\n  author.get(Author_.lastName).alias(\"lastName\")\n);\n\nTypedQuery<Tuple>\
    \ query = em.createQuery(q);\nList<Tuple> authorNames = query.getResultList();\n\
    \nfor (Tuple authorName : authorNames) {\n  log.info(authorName.get(\"firstName\"\
    )\n  + authorName.get(\"lastName\"));\n}\n```\n\n"
