    # How to map a bidirectional one-to-one association


    # Problem


    My table contains a one-to-one association. How do I model it with Hibernate so
    that I can navigate it in both directions?


    # Solution


    You need to model the association on both entities if you want to be able to navigate
    in both directions. Let''s have a look at an example. A book gets created from
    a manuscript. You could model this with a Book Manuscript entity and a one-to-one
    association between them. You need to model that with a one-to-one association
    on the Book entity and the Manuscript entity.


    | Book | Manuscript |

    | --- | --- |

    | -Id id: Long | -Id id: Long |

    | -OneToOne manuscript: List<Manuscript>... | -OneToOne book: ... |


    Let''s begin with the Manuscript entity, which is the owning side of the association
    in this example. That means that it defines the relationship and the Book entity
    just references it.


    The relationship definition consists of two mandatory and one optional part. The
    entity attribute Book book and the @OneToOne annotation are required. The attribute
    models the association, and the annotation declares the kind of relationship.
    The @JoinColumn annotation is optional. It allows you to define the name of the
    foreign key column that links the book to the manuscript. I use it'
