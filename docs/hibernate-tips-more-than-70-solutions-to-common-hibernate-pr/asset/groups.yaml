  - '[PAGE 148]


    Natural IDs are immutable by default. If you need mutable, natural identifier,
    you have to set the mutable attribute of the @NaturalId annotation to true.


    Hibernate’s Session interface provides the methods byNaturalId and bySimpleNaturalId
    to read an entity by its natural identifier from the database. The byNaturalId
    method allows you to use complex natural identifiers that consist of multiple
    attributes.


    ```

    Book b = session.byNaturalId(Book.class)

    .using(Book_.isbn.getName(), "123-4567890123")

    .load();

    ```


    When have to provide the class or the name of the entity as a parameter to the
    byNaturalId method to tell Hibernate which entity you want to retrieve. The following
    call of the using method provides the name of the natural ID attribute and its
    value. If the natural ID consists of multiple attributes, you have to call this
    method for each part of the ID. In this example, I use the JPA metamodel to reference
    the name of the isn attribute in a type-safe way.


    After you’ve provided the value of the natural id, you can call the loadReference
    or loadOptional method to get the entity identified by it.


    When your natural identifier consists of only one entity attribute, you can also
    use the bySimpleNaturalId method to load it. As you can see in the following code
    snippet, it provides a more convenient way to load entities with simple natural
    ids.


    ```

    Book b = session.bySimpleNaturalId(Book.class)

    .load("123-4567890123");

    ```'
