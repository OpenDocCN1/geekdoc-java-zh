    \ UPDATE statement. I first define which entity I want to update and define the\
    \ update operation in the SET clause.\n\nThis statement updates all Book entities.\
    \ If you only want to update a specific set of entities, you can add a WHERE clause\
    \ to the statement. You can define it in the same way as you do for a JPQL SELECT\
    \ statement.\n\nYou can check the generated SQL statement in the log file if you\
    \ activate logging for the SQL statements.\n\n```\n18:57:25,118 DEBUG [org.hibernate.SQL]\
    \ - update Book set price=price*1.1\n```"
- md: "\nUpdating multiple entities with a JPQL UPDATE statement is more efficient\
    \ than updating the entities one by one. But Hibernate doesn't know which database\
    \ records get changed and doesn't update any entities in the first-level cache.\
    \ You need to make sure that the cache doesn't contain any entities affected by\
    \ the update statement or you need to invalidate the cache programmatically.\n\
    \n## Source Code\n\nYou can find a project with executable test cases for this\
    \ Hibernate tip in the JPQLUpdate module of the example project. If you haven't\
    \ already done, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n## Learn More\n\nA JPQL UPDATE statement is just one option to update multiple\
    \ entities with 1 query. You can create the same statement with the Criteria API\
    \ as I explain How to update multiple entities with the Criteria API.\n\nJPQL\
    \ is the preferred query language of most Hibernate users because it operates\
    \ on the entity model and the defined associations instead of the table model.\
    \ But it implements only a small subset of SQL feature set and that is most often\
    \ not enough to implement all queries of complex business applications.\n\nThat\
    \ is the point when native SQL queries come into play. JPA and Hibernate are designed\
    \ as a leaky abstraction and allow you to implement and execute native SQL queries\
    \ within your current context. The following Hibernate tips show you how to do\
    \ that:\n\n- How to create a native SQL query at runtime\n- How to create a named\
    \ native SQL query\n- How to map the result of a native SQL query to entities\n\
    - How to map the result of a native SQL query to a POJO\n\n## How to create a\
    \ native SQL query at runtime\n\n### Problem\n\nI need to adapt a native query\
    \ based on user input. How do I create a native SQL query at runtime?\n\n### Solution\n\
    \nYou can create ad-hoc native queries in a similar way as you create ad-hoc JPQL\
    \ queries. You just need to provide a String with the SQL statement to the createNativeQuery\
    \ method of the EntityManager.\n\nI do that in the following code snippet with\
    \ an SQL query that selects a record from the book table with an id equal to a\
    \ bind parameter value. The ? you can see at the end of the query is the placeholder\
    \ for a positional bind parameter. You can set the bind parameter values of a\
    \ native query in the same way as you set the bind parameters of a JPQL query.\
    \ You just need to call the setParameter method of the Query interface with the\
    \ parameter position and its value.\n\n> The index of positional parameters in\
    \ ad-hoc native queries starts at 1.\n\nI also provide the class of the Book entity\
    \ as an additional parameter to tell Hibernate map the query result to a Book\
    \ entity. I explain the mapping of native query results to entities in more detail\
    \ in How to map the result of a native SQL query to entities.\n\n```\nQuery q\
    \ = em.createNativeQuery(\"SELECT * FROM book b WHERE id = ?\",\nBook.class);\n\
    q.setParameter(1,1);\nBook b = (Book) q.getSingleResult();\n```\n\n## Source Code\n\
    \nYou can find a project with executable test cases for this Hibernate tip in\
    \ the **NativeQuery** module of the example project. If you haven’t already done\
    \ so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n## Learn More\n\nNative queries don’t return the strongly typed results you\
    \ know from JPQL queries. They return an `Object[]` or a `List<Object[]>` and\
    \ you need to cast them yourself or tell Hibernate how to handle the result. Hibernate\
    \ can map the query result to entities or POJOs, as I show you in:\n\n- How to\
    \ map the result of a native SQL query to entities\n- How to map the result of\
    \ a native SQL query to a POJO\n\n## How to create a named native SQL query\n\n\
    ### Problem\n\nI don't want to define the native query in my business logic. Is\
    \ there an option to specify a named native query similar to JPQL?\n\n### Solution\n\
    \nYou can define named native SQL queries with the @NamedNativeQuery annotation.\
    \ As you can see in the following code snippet, it's very similar to the @NamedQuery\
    \ annotation you use to define a named JPQL query.\n\n```\n@Entity\n@NamedNativeQuery(name=Book.QUERY_SELECT_BY_ID,\n\
    query=\"SELECT * FROM book b WHERE id = ?\",\nresultClass = Book.class)\n\npublic\
    \ class Book {\n\n    public static final final String QUERY_SELECT_BY_ID =\n\
    \        \"Book.selectById\";\n\n    ...\n}\n```\n\nYou need to provide a name\
    \ and a native SQL query. As you can see, I use a static String as the name of\
    \ the query. That makes it easier to reference it in the business logic. The SQL\
    \ query in this example is very simple. It uses a positional bind parameter to\
    \ select a record from the book table. Hibernate also supports named bind parameters\
    \ for native SQL queries but the JPA specification does not. So, you should use\
    \ positional bind parameters, if you want to be able to use your application with\
    \ a different JPA implementation.\n\nI also provide a new resultClass in this\
    \ example to tell Hibernate to map the query result to a Book entity. That's all\
    \ you need to do to define a named native query.\n\nYou can use this query in\
    \ the same way as a named JPQL query.\n\n```\nQuery q = em.createNamedQuery(Book.QUERY_SELECT_BY_ID);\n\
    q.setParameter(1, 100);\nBook b = (Book) q.getSingleResult();\n```\n\nYou instantiate\
    \ a new Query by calling the createNamedQuery method of the EntityManager with\
    \ the name of the @NamedNativeQuery. That is the same Query interface that you\
    \ know from your JPQL queries. You can use it to set bind parameter values or\
    \ define pagination. In this example, I just call the setParameter method to set\
    \ the value for the positional bind parameter.\n\n> The index of positional parameters\
    \ in named native queries starts at 1.\n\n## Source Code\n\nYou can find a project\
    \ with executable test cases for this Hibernate tip in the NamedNativeQuery module\
    \ of the example project. If you haven't already done so, you can download it\
    \ at http://www.hibernate-tips.com/download-examples.\n\n## Learn More\n\nNative\
    \ queries don't return the strongly typed results you know from JPQL queries.\
    \ They return an Object[] or a List<Object[]> and you need to cast them yourself\
    \ or tell Hibernate how to handle the result. Hibernate can map the query result\
    \ to entities or POJOs, as I show you in:\n\n- How to map the result of a native\
    \ SQL query to entities\n- How to map the result of a native SQL query to a POJO\n\
    \n## How to map the result of a native SQL query to entities\n\n### Problem\n\n\
    My query is too complex for JPQL, and I have to use a native query. Is there a\
    \ way to map the result of the query to managed entities?\n\n### Solution\n\n\
    If your query returns all columns that are mapped to an entity, you can tell Hibernate\
    \ to map the result to a managed entity. Afterward, you can use the entity in\
    \ the same way as any managed entity.\n\nThere are two options to define the mapping:\n\
    \n1. You can use implicit mapping if your query uses the same column names as\
    \ your entity mapping.\n2. You can create a custom mapping if the column names\
    \ do not match.\n\n#### Implicit Mapping\n\nIf you can use it, the implicit mapping\
    \ is the easier to use and better approach for most cases. You only need to provide\
    \ the class of the entity as the second parameter to the createNativeQuery method.\n\
    \n```\nBook b = (Book) em.createNativeQuery(\n  \"SELECT * FROM book b WHERE id\
    \ = 1\", Book.class\n).getSingleResult();\n```\n\n#### Explicit Mapping\n\nIf\
    \ the column names of your query result do not match the column names of your\
    \ entity mapping, you have to define the mapping yourself. The following query\
    \ shows a very simple example of such a situation. It renames the column id to\
    \ bookId so that Hibernate cannot use the implicit mapping.\n\n```\nBook b = (Book)\
    \ em.createNativeQuery(\n\"SELECT id as bookId, version, title,\n+ \"publishingDate,\
    \ publisherid \"\n+ \"FROM b WHERE id = 1\", \"BookMapping\")\n).getSingleResult());\n\
    ```\n\nYou can define a custom result mapping with @SqlResultSetMapping annotation.\
    \ It specifies the entity class and a mapping for each entity attribute.\n\n```\n\
    @SqlResultSetMapping(\nname = \"BookMapping\",\nentities = @EntityResult(\nentityClass\
    \ = Book.class,\nfields = {\n@FieldResult(name = \"id\", column = \"bookId\",\n\
    @FieldResult(name = \"version\", column = \"version\",\n@FieldResult(name = \"\
    title\", column = \"title\",\n@FieldResult(name = \"publishingDate\",\ncolumn\
    \ = \"publishingDate\",\n@FieldResult(name = \"publisher\",\ncolumn = \"publisherid\\\
    )))\n```\n\nAs you can see in the code snippet, it sets a name and a @EntityResult\
    \ annotation on the @SqlResultSetMapping annotation. To use the mapping, you need\
    \ to provide its name as the second parameter to the createNativeQuery method.\n"
  mdcn: "\n\n使用 JPQL UPDATE 语句更新多个实体比逐个更新实体更高效。但 Hibernate 并不知道哪些数据库记录发生了变化，因此它不会更新一级缓存中的任何实体。你需要确保缓存中不包含任何受该更新语句影响的实体，或者你需要通过程序化方式使缓存失效。\n\
    \n## 源代码\n\n你可以在示例项目中的 `JPQLUpdate` 模块中找到包含此 Hibernate 技巧的可执行测试用例的项目。如果你还没有下载过，可以从\
    \ http://www.hibernate-tips.com/download-examples 下载它。\n\n## 更多信息\n\nJPQL UPDATE\
    \ 语句只是通过 1 条查询更新多个实体的选项之一。你可以使用 Criteria API 创建相同的语句，正如我在《如何使用 Criteria API 更新多个实体》中所解释的样样。\n\
    \nJPQL 是大多数 Hibernate 用户首选的查询语言，因为它作用于实体模型和定义的关联上，而不是作用于表模型（table model）。但它只实现了\
    \ SQL 特集的一小部分子集，这通常不足以实现复杂业务应用中的所有查询。\n\n这正是原生 SQL 查询（native SQL queries）大显身手的地方。JPA\
    \ 和 Hibernate 被设计为“泄漏抽象”（leaky abstraction），允许你在当前上下文中实现并执行原生 SQL 查询。以下 Hibernate\
    \ 技巧向你展示了如何操作：\n\n- 如何在运行时创建原生 SQL 查询\n- 如何创建命名原生 SQL 查询\n- 如何将原生 SQL 查询的结果映射到实体\n\
    - 如何将原生 SQL 查询的结果映射到 POJO\n\n## 如何在运行时创建原生 SQL 查询\n\n### 问题\n\n我需要根据用户输入调整原生查询。我如何在运行时创建原生\
    \ SQL 查询呢？\n\n### 解决方案\n\n你可以以类似于创建即时（ad-hoc）JPQL 查询的方式创建即时原生查询。你只需要向 `EntityManager`\
    \ 的 `createNativeQuery` 方法提供一个包含 SQL 语句的字符串即可。\n\n我在下面的代码段中就是这样做，使用一个 SQL 查询从\
    \ `book` 表中选择 `id` 等于绑定参数值的记录。你在查询末尾看到的 `?` 是位置绑定参数的占位符。你可以像设置 JPQL 查询的绑定参数一样设置原生查询的绑定参数值。你只需要调用\
    \ `Query` 接口的 `setParameter` 方法，并传入参数位置及其值。\n\n> 即时原生查询中位置参数的索引从 1 开始。\n\n我在此提供了\
    \ `Book` 实体的类作为额外参数，告诉 Hibernate 将查询结果映射到 `Book` 实体。我在《如何将原生 SQL 查询的结果映射到实体》中更详细解释了原生查询结果到实体的映射。\n\
    \n```\nQuery q = em.createNativeQuery(\"SELECT * FROM book b WHERE id = ?\",\n\
    Book.class);\nq.setParameter(1,1);\nBook b = (Book) q.getSingleResult();\n```\n\
    \n## 源代码\n\n你可以在示例项目中的 **NativeQuery** 模块中找到包含此 Hibernate 技巧的可执行测试用例的项目。如果你还没有下载过，可以从\
    \ http://www.hibernate-tips.com/download-examples 下载它。\n\n## 更多信息\n\n原生查询不会返回你从\
    \ JPQL 查询中熟悉的强类型结果。它们返回的是 `Object[]` 或 `List<Object[]>`，你需要手动对其进行类型转换，或者告诉 Hibernate\
    \ 如何处理结果。Hibernate 可以将查询结果映射到实体或 POJO，正如我在下面展示的样：\n\n- 如何将原生 SQL 查询的结果映射到实体\n\
    - 如何将原生 SQL 查询的结果映射到 POJO\n\n## 如何创建命名原生 SQL 查询\n\n### 问题\n\n我不想在业务逻辑中定义原生查询。是否有类似于\
    \ JPQL 的选项可以指定命名原生查询？\n\n### 解决方案\n\n你可以使用 `@NamedNativeQuery` 注解来定义命名原生 SQL 查询。正如你在下面的代码段中看到的，它与你用于定义定义命名\
    \ JPQL 查询的 `@NamedQuery` 注解非常相似。\n\n```\n@Entity\n@NamedNativeQuery(name=Book.QUERY_SELECT_BY_ID,\n\
    query=\"SELECT * FROM book b WHERE id = ?\",\nresultClass = Book.class)\n\npublic\
    \ class Book {\n\n    public static final final String QUERY_SELECT_BY_ID =\n\
    \        \"Book.selectById\";\n\n    ...\n}\n```\n\n你需要提供一个名称和一个原生 SQL 查询。如你所见，我使用一个静态字符串作为查询的名称。这使得在业务逻辑中引用它变得更容易。示例中的\
    \ SQL 查询非常简单，它使用位置绑定参数从 `book` 表中选择记录。Hibernate 也支持原生 SQL 查询的命名绑定参数，但 JPA 规范不支持。因此，如果你希望你的应用程序能够兼容不同的\
    \ JPA 实现，你应该使用位置绑定参数。\n\n我在这个示例中还提供了一个新的 `resultClass`，告诉 Hibernate 将查询结果映射到 `Book`\
    \ 实体。这就是定义命名原生查询所需的所有操作。\n\n你可以像使用命名 JPQL 查询一样使用此查询。\n\n```\nQuery q = em.createNamedQuery(Book.QUERY_SELECT_BY_ID);\n\
    q.setParameter(1, 100);\nBook b = (Book) q.getSingleResult();\n```\n\n你通过调用 `EntityManager`\
    \ 的 `createNamedQuery` 方法并传入 `@NamedNativeQuery` 的名称来实例化一个新的 `Query`。这就是你在 JPQL\
    \ 查询中熟悉的 `Query` 接口。你可以用它来设置绑定参数值或定义分页。在这个示例中，我只是调用了 `setParameter` 方法来设置位置绑定参数的值。\n\
    \n> 命名原生查询中位置参数的索引从 1 开始。\n\n## 源代码\n\n你可以在示例项目中的 `NativeQuery` 模块中找到包含此 Hibernate\
    \ 技巧的可执行测试用例的项目。如果你还没有下载过，可以从 http://www.hibernate-tips.com/download-examples\
    \ 下载。\n\n## 更多信息\n\n原生查询不返回你从 JPQL 查询中熟悉的强类型结果。它们返回 `Object[]` 或 `List<Object[]>`，你需要手动进行类型转换，或者告诉\
    \ Hibernate 如何处理结果。Hibernate 可以将查询结果映射到实体或 POJO，正如我在下面展示的：\n\n- 如何将原生 SQL 查询的结果映射到实体\n\
    - 如何将原生 SQL 查询的结果映射到 POJO\n\n## 如何将原生 SQL 查询的结果映射到实体\n\n### 问题\n\n我的查询太复杂无法使用\
    \ JPQL，必须使用原生查询。是否有方法可以将查询结果映射到托管实体？\n\n### 解决方案\n\n如果你的查询返回了所有映射到实体的列，你可以告诉 Hibernate\
    \ 将结果映射到实体。之后，你可以像使用任何托管实体一样使用该实体。\n\n定义映射有两种方式：\n\n1. 如果你的查询列名与实体映射名一致，可以使用隐式映射（implicit\
    \ mapping）。\n2. 如果不一致，可以创建自定义映射。\n\n#### 隐式映射\n\n如果可以使用，隐式映射是大多数情况下更容易使用且更好的方法。你只需要在\
    \ `createNativeQuery` 方法的第二个参数中提供实体类。\n\n```\nBook b = (Book) em.createNativeQuery(\n\
    \  \"SELECT * FROM book b WHERE id = 1\", Book.class\n).getSingleResult();\n```\n\
    \n#### 显式映射\n\n如果查询结果的列名与实体的列名不匹配，你必须自己定义映射。下面的查询展示了这种情况的一个非常简单的示例。它重命名了 `id`\
    \ 列为 `bookId`，导致 Hibernate 无法使用隐式映射。\n\n```\nBook b = (Book) em.createNativeQuery(\n\
    \  \"SELECT id as bookId, version, title,\n+ \"publishingDate, publisherid \"\n\
    + \"FROM b WHERE id = 1\", \"BookMapping\")\n).getSingleResult());\n```\n\n你可以使用\
    \ `@SqlResultSetMapping` 注解定义自定义结果映射。它指定了实体类以及每个实体属性的映射。\n\n```\n@SqlResultSetMapping(\n\
    name = \"BookMapping\",\nentities = @EntityResult(\nentityClass = Book.class,\n\
    fields = {\n@FieldResult(name = \"id\", column = \"bookId\",\n@FieldResult(name\
    \ = \"version\", column = \"version\",\n@FieldResult(name = \"title\", column\
    \ = \"title\",\n@FieldResult(name = \"publishingDate\",\ncolumn = \"publishingDate\"\
    ,\n@FieldResult(name = \"publisher\",\ncolumn = \"publisherid\\)))\n```\n\n如你在代码段中所示，它在\
    \ `@SqlResultSetMapping` 注解上设置了一个名称和一个 `@EntityResult` 注解。要使用该映射，你需要将其名称作为 `createNativeQuery`\
    \ 方法的第二个参数传入。\n\n"
