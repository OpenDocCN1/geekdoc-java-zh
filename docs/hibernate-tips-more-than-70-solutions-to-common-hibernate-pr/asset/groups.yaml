- md: "\nThe same applies for enumerations. Hibernate can map them by default, but\
    \ you might want to customize the way it does it. I show you how to do that in\
    \ How to map an enum to a database column.\n\n## How to map a util Date or Calendar\
    \ to a database column\n\n### Problem\n\nI use a java.util.Date to model a date\
    \ as an entity attribute. But Hibernate maps it to a timestamp with nanoseconds.\
    \ How do I change the mapping so that Hibernate only stores the years, months,\
    \ and days?\n\n### Solution\n\nThe SQL standard supports three different data\
    \ types to store date and time information. Hibernate can map all of them to a\
    \ java.util.Date or a java.util.Calendar. You need to decide which of the following\
    \ SQL types by Hibernate will use:\n\n- TIMESTAMP: Persists the date and time\
    \ with nanoseconds. Hibernate uses this type by default.\n- TIME: Stores only\
    \ the time of day without nanoseconds.\n- DATE: Persists only the date with years,\
    \ months, and days.\n\nYou can define the preferred mapping with the @Temporal\
    \ annotation. As you can see in the following code snippet, the annotation takes\
    \ a TemporalType enum as a value. The enum allows you to select the SQL type (DATE,\
    \ TIME, or TIMESTAMP) that you want to use.\n\n```\n@Entity\npublic class Author\
    \ {\n```\n\n```\n@Temporal(TemporalType.DATE)\nprivate Date dateOfBirth;\n\n...\n\
    }\n```\n\nAs you can see in the following log output, the dateOfBirth attribute\
    \ of the Author entity gets mapped to an SQL DATE without any time information.\n\
    \n```\n07:22:50,453 DEBUG [org.hibernate.SQL] -\nselect\n  author.id as id1_0_,\n\
    \  author.dateOfBirth as dateOfBi2_0_,\n  author.firstName as firstName3_0_,\n\
    \  author.lastName as lastName4_0_,\n  author.version as version5_0__\nfrom\n\
    \  Author author\nwhere\n  author.id=?\n07:22:50,454 TRACE [org.hibernate.type.descriptor.sql.BasicBinder]\
    \ -\nbinding parameter [1] as [BIGINT] - [1]\n07:22:50,464 TRACE [org.hibernate.type.descriptor.sql.BasicExtractor]\
    \ - extracted value\n([[dateOfBi2_0_]] : [DATE]) - [1980-01-01]\n..\n```\n\n###\
    \ Source Code\n\nYou can find a project with executable test cases for this Hibernate\
    \ tip in the MapUtilDate module of the example project. If you haven't already\
    \ done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n### Learn More\n\nSince Hibernate 5, you can also use the classes of the Java\
    \ 8 Date and Time API as entity attribute types. The new classes solve a lot of\
    \ issues with the java.util.Date and provide all information Hibernate needs to\
    \ map them to the correct JDBC types. I explain the mapping of the Date and Time\
    \ API classes in more detail in How to map classes of Java 8’s Date and Time API.\n\
    \n## How to map an enum to a database column\n\n### Problem\n\nHow do I map an\
    \ enum attribute to a database column? Which option should I choose?\n\n### Solution\n\
    \nJPA and Hibernate provide two standard options to map an enum to a database\
    \ column. You can use either the String representation or the ordinal value.\n\
    \nBoth approaches have their drawbacks:\n\n- The String representation is verbose,\
    \ and renaming an enum value requires that you also update your database.\n- The\
    \ ordinal of an enum value is its position in the enum declaration. This value\
    \ changes and requires you to update your database when you remove an existing\
    \ value or do not add new values to the end of the enum declaration.\n\nYou have\
    \ to decide which drawback is the lesser evil for your specific application or\
    \ use an AttributeConverter to define a custom mapping to avoid these issues.\n\
    \nWhen you use the JPA and Hibernate standard mapping, you can either rely on\
    \ the default mapping of its ordinal value or specify the mapping approach. You\
    \ can do that with an @Enumerated annotation.\n\nThe following examples use the\
    \ AuthorStatus enum. This enum indicates if an author published a book with a\
    \ publisher, self-published, or is still writing a book.\n\n```\npublic enum AuthorStatus\
    \ {\n\n    PUBLISHED, SELF_PUBLISHED, NOT_PUBLISHED;\n}\n```\n\nThe following\
    \ example mapping uses the @Enumerated annotation to explicitly tell Hibernate\
    \ to use the ordinal value. If you don't provide an @Enumerated annotation or\
    \ don't set an EnumType as its value, Hibernate also uses the ordinal value as\
    \ the default mapping.\n\n```\n@Entity\npublic class Author {\n\n    @Enumerated(EnumType.ORDINAL)\n\
    \    private AuthorStatus status;\n\n    ...\n}\n```\n\nWhen you use this mapping\
    \ to persist an Author entity with status PUBLISHED, Hibernate stores the value\
    \ 0 in the database.\n\nIf you want to store the String representation of the\
    \ enum value in the database, you need to annotate the entity attribute with @Enumerated\
    \ and set EnumType.STRING as its value.\n\n```\n@Entity\npublic class Author {\n\
    \n    @Enumerated(EnumType.STRING)\n    private AuthorStatus status;\n\n    ...\n\
    }\n```\n\nWhen you now persist the same entity in the database, Hibernate writes\
    \ the value PUBLISHED into the database column status.\n\n### Source Code\n\n\
    You can find a project with executable test cases for this Hibernate tip in the\
    \ MapEnumerations module of the example project. If you haven't already done so,\
    \ you can download it at http://www.hibernate-tips.com/download-examples.\n\n\
    ### Learn More\n\nYou can use an AttributeConverter to define your own mapping\
    \ and avoid the drawbacks of the JPA standard mapping. I show you how to do that\
    \ in How to define a custom enum mapping.\n\n## How to map a simple primary key\n\
    \n### Problem\n\nHow do I map a simple primary key of a database table with an\
    \ entity?\n\n### Solution\n\nYou can model a simple primary key with an entity\
    \ attribute that you annotate with @Id annotation. JPA and Hibernate support the\
    \ following data types as primary keys:\n\n- Primitive Java types and their wrapper\
    \ types\n- java.lang.String\n- java.util.Date and java.sql.Date\n- java.math.BigDecimal\n\
    - java.math.BigInteger\n\nThe following code snippet shows an example of a primary\
    \ key attribute. It is of type java.lang.Long. I annotated it with @Id and a @Column\
    \ annotation. You don't need the @Column annotation to define a primary key, but\
    \ it allows you to provide additional mapping information. In this example, I\
    \ tell Hibernate that the id can't be null and can't be updated.\n\n```\n@Entity\n\
    public class Author {\n\n    @Id\n    @Column(updatable = false, nullable = false)\n\
    \    private Long id;\n\n    ...\n}\n```\n\nThat's all you need to do to define\
    \ a primary key attribute. You can now use it, for example, to read an entity\
    \ via the EntityManager find method.\n\n```\nAuthor a = em.find(Author.class,\
    \ 1L);\n```\n\nWhen you persist a new Author entity, you need to provide a unique\
    \ primary key value.\n\n```\nAuthor a = new Author();\na.setId(1L);\na.setFirstName(\"\
    Thorben\");\na.setLastName(\"Janssen\");\n\nem.persist(a);\n```\n\n### Source\
    \ Code\n\nYou can find a project with executable test cases for this Hibernate\
    \ tip in the PrimaryKey module of the example project. If you haven't already\
    \ done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n### Learn more\n\nJPA and Hibernate support different strategies to generate\
    \ primary key values. You should use one of these strategies if the primary key\
    \ value is not provided as user input. I explain them in more detail in:\n\n-\
    \ How to use a custom database sequence to generate primary key values\n- How\
    \ to use an auto-incremented column to generate primary key values\n- How to use\
    \ a database table to generate primary key values\n- How to use a generated UUID\
    \ as a primary key\n\n## How to use an auto-incremented column to generate primary\
    \ key values\n\n### Problem\n\nHow do I use an auto-incremented column to generate\
    \ primary key values?\n\n### Solution\n\nJPA and Hibernate support different strategies\
    \ to generate primary key values. One of them is the identity strategy that uses\
    \ an auto-incremented database column.\n\nIf you want to use this strategy, you\
    \ have to annotate the primary key attribute with an @Id and a @GeneratedValue\
    \ annotation with GenerationType.IDENTITY as the value of the strategy attribute.\n\
    \nThe following code snippet shows an example of this annotation.\n\n```\n@Entity\n\
    public class Author {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n\
    \    @Column(name = \"id\", updatable = false, nullable = false)\n    private\
    \ Long id;\n\n    ...\n}\n```\n"
