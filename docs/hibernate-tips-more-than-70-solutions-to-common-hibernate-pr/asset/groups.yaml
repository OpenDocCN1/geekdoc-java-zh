    # How to map an unidirectional one-to-one association


    # Problem


    My table model contains an one-to-one association. I only need to navigate it
    one direction. How do I model that with Hibernate?


    # Solution


    You only need to model the association on the entity from which you want to navigate
    the relationship. Let''s have a look at an example. A book gets created from a
    manuscript. You could model this with a Book and a Manuscript entity and a one-to-one
    association between them. If you just want to navigate it from the Manuscript
    to the Book entity, you only need to model it as a one-to-one association on the
    Manuscript entity.


