    # How to select entities with a CriteriaQuery


    # Problem


    I need to define a query based on user input. What is the best way to programmatically
    create a query at runtime with Hibernate?


    # Solution


    You can use JPA''s Criteria API to define queries programmatically. It provides
    a type-safe way to create a query and supports the same features as JPQL.


    > Hibernate''s proprietary Criteria API is deprecated. You should use JPA''s Criteria
    API instead.


    The following code snippet shows the definition of a CriteriaQuery, which selects
    all Books written by an Author with a given first and last name.


