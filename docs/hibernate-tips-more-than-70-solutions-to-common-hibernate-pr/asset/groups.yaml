- md: "\n## How to map generated values\n\n### Problem\n\nMy database administrator\
    \ set up a trigger to generate the value of a database column. How do I map this\
    \ column so that Hibernate retrieves the value after it gets generated?\n\n###\
    \ Solution\n\nYou can annotate an entity attribute with @Generated(GenerationTime\
    \ value), to tell Hibernate that the database will generate the value of the attribute.\
    \ The GenerationTime enum tells Hibernate when the database will generate the\
    \ value. It can either do this NEVER, only on INSERT or ALWAYS (on insert and\
    \ update). Hibernate executes an additional query to retrieve the generated value\
    \ from the database.\n\nThe following code snippet shows an example of such an\
    \ entity mapping.\n\n```java\n@Entity\npublic class Author {\n    @Column\n  \
    \  @Generated(GenerationTime.ALWAYS)\n    private LocalDateTime lastUpdate;\n\
    \    ......\n}\n```\n\nAs you can see in the log output, Hibernate now performs\
    \ an additional query for each insert and update statement to retrieve the generated\
    \ value.\n\n```java\n// Transaction 1\nem.getTransaction().begin();\n\nAuthor\
    \ a = new Author();\na.setFirstName(\"Thorben\");\na.setLastName(\"Janssen\");\n\
    em.persist(a);\n\nem.getTransaction().commit();\nlog.info(a);\n```\n\n```java\n\
    // Transaction 2\nem.getTransaction().begin();\n\na = em.find(Author.class, a.getId());\n\
    a.setFirstname(\"Changed Firstname\");\n\nem.getTransaction().commit();\nlog.info(a);\n\
    ```\n\n```\n12:06:36,349 DEBUG [org.hibernate.SQL] - insert into Author (firstName,\
    \ lastName, version, id) VALUES (?, ?, ?)\n12:06:36,353 DEBUG [org.hibernate.SQL]\
    \ - select author_.lastUpdate as lastUpdate4_0_ from author_ where author_.id=?\n\
    12:06:36,376 INFO [org.thoughts.on.java.model.TestGeneratedColumn] - Author[id=1,\
    \ version=0, firstName=Thorben, lastName=Janssen, lastUpdate=2017-03-09T12:06:36.322]\n\
    ```\n\n```\n12:06:36,382 DEBUG [org.hibernate.SQL] - update Author set firstName=?,\
    \ lastName=?, version=? where id=? and version=?\n12:06:36,384 DEBUG [org.hibernate.SQL]\
    \ - select author_.lastUpdate as lastUpdate4_0_ from Author author_ where author_.id=?\n\
    12:06:36,387 INFO [org.thoughts.on.java.model.TestGeneratedColumn] - Author [id=1,\
    \ version=1, firstName=Changed Firstname, lastName=Janssen, lastUpdate=2017-03-09T12:06:36.383]\n\
    ```\n\n### Source Code\n\nYou can find a project with executable test cases for\
    \ this Hibernate tip in the MapGeneratedColumns module of the example project.\
    \ If you haven't already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n## How to calculate entity attributes with a @Formula\n\n### Problem\n\nThe\
    \ value of one of the entity attributes needs to be calculated by a SQL expression.\
    \ How do I map that with Hibernate?\n\n### Solution\n\nYou can use the @Formula\
    \ annotation to provide a SQL snippet. Hibernate executes it when it fetches the\
    \ entity from the database. The return value of the SQL expression gets mapped\
    \ to a read-only entity attribute.\n\nThe following examples shows a @Formula\
    \ that calculates the age of an author.\n\n```java\n@Entity\npublic class Author\
    \ {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.AUTO)\n    @Column(name\
    \ = \"id\", updatable = false, nullable = false)\n    private Long id;\n\n   \
    \ @Column\n    private LocalDate dateOfBirth;\n\n    @Formula(value = \"date_part('year',\
    \ age(dateOfBirth))\")\n    private int age;\n\n...\n    public int getAge() {\n\
    \        return age;\n    }\n}\n```\n\nWhen Hibernate fetches an Author entity\
    \ from the database, it adds the SQL snippet of the @Formula annotation to its\
    \ SQL statement.\n\n```\n05:35:15,762 DEBUG [org.hibernate.SQL] - select author0_.id\
    \ as id1_0_, author0_.dateOfBirth as dateOfBirth2_0_, author0_.firstName as firstName3_0_,\
    \ author0_.lastName as lastName4_0_, author0_.version as version5_0_, date_part('year',\
    \ age(author0_..dateOfBirth)) as formula0_ from Author author0_ where author0_.id=1\n\
    ```\n\n> The @Formula annotation provides an easy way to map the result of an\
    \ SQL snippet to an entity attribute. It also has some downsides you should be\
    \ aware of:\n\n> - Hibernate executes the SQL snippet for every Author entity\
    \ it fetches from the database. So better make sure, that you only use it for\
    \ attributes you need in all of your use cases.\n> - You need to provide a native\
    \ SQL snippet to the @Formula annotation. This can affect the database portability\
    \ of your application.\n\n### Source Code\n\nYou can find a project with executable\
    \ test cases for the Hibernate tip in the Formula module of the example project.\
    \ If you haven't already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n"
  mdcn: "\n\n## 如何映射生成的值\n\n### 问题\n\n我的数据库管理员设置了一个触发器来生成数据库列的值。我该如何映射这一列，以便 Hibernate\
    \ 在值被生成后获取到它呢？\n\n### 解决方案\n\n你可以对实体属性使用 `@Generated(GenerationTime value)` 注解，告诉\
    \ Hibernate 数据库将生成该属性的值。`GenerationTime` 枚举告诉 Hibernate 数据库何时生成该值。它可以是 `NEVER`（从不）、仅在\
    \ `INSERT`（插入）时或 `ALWAYS`（插入和更新）时。Hibernate 会执行一个额外的查询以从数据库中检索生成的值。\n\n下面的代码段展示了此类实体映射的示例。\n\
    \n```java\n@Entity\npublic class Author {\n    @Column\n    @Generated(GenerationTime.ALWAYS)\n\
    \    private LocalDateTime lastUpdate;\n    ......\n}\n```\n\n如日志输出所示，Hibernate\
    \ 现在会为每个 `insert` 和 `update` 语句执行额外的查询以获取生成的值。\n\n```java\n// Transaction 1\n\
    em.getTransaction().begin();\n\nAuthor a = new Author();\na.setFirstName(\"Thorben\"\
    );\na.setLastName(\"Janssen\");\nem.persist(a);\n\nem.getTransaction().commit();\n\
    log.info(a);\n```\n\n```java\n// Transaction 2\nem.getTransaction().begin();\n\
    \na = em.find(Author.class, a.getId());\na.setFirstname(\"Changed Firstname\"\
    );\n\nem.getTransaction().commit();\nlog.info(a);\n```\n\n```\n12:06:36,349 DEBUG\
    \ [org.hibernate.SQL] - insert into Author (firstName, lastName, version, id)\
    \ VALUES (?, ?, ?)\n12:06:36,353 DEBUG [org.hibernate.SQL] - select author_.lastUpdate\
    \ as lastUpdate4_0_ from author_ where author_.id=?\n12:06:36,376 INFO [org.thoughts.on.java.model.TestGeneratedColumn]\
    \ - Author[id=1, version=0, firstName=Thorben, lastName=Janssen, lastUpdate=2017-03-09T12:06:36.322]\n\
    ```\n\n```\n12:06:36,382 DEBUG [org.hibernate.SQL] - update Author set firstName=?,\
    \ lastName=?, version=? where id=? and version=?\n12:06:36,384 DEBUG [org.hibernate.SQL]\
    \ - select author_.lastUpdate as lastUpdate4_0_ from Author author_ where author_.id=?\n\
    12:06:36,387 INFO [org.thoughts.on.java.model.TestGeneratedColumn] - Author [id=1,\
    \ version=1, firstName=Changed Firstname, lastName=Janssen, lastUpdate=2017-03-09T12:06:36.383]\n\
    ```\n\n### 源代码\n\n你可以在示例项目的 `MapGeneratedColumns` 模块中找到包含此 Hibernate 技巧的可执行测试用例的项目。如果你还没有下载，可以访问\
    \ http://www.hibernate-tips.com/download-examples 下载它。\n\n## 如何使用 @Formula 计算实体属性\n\
    \n### 问题\n\n其中一个实体属性的值需要通过 SQL 表达式进行计算。我该如何用 Hibernate 映射它？\n\n### 解决方案\n\n你可以使用\
    \ `@Formula` 注解提供 SQL 代码段。Hibernate 在从数据库获取实体时会执行它。SQL 表达式的返回值将映射到只读的实体属性上。\n\n\
    下面的示例展示了一个使用 `@Formula` 计算作者年龄的例子。\n\n```java\n@Entity\npublic class Author {\n\
    \n    @Id\n    @GeneratedValue(strategy = GenerationType.AUTO)\n    @Column(name\
    \ = \"id\", updatable = false, nullable = false)\n    private Long id;\n\n   \
    \ @Column\n    private LocalDate dateOfBirth;\n\n    @Formula(value = \"date_part('year',\
    \ age(dateOfBirth))\")\n    private int age;\n\n...\n    public int getAge() {\n\
    \        return age;\n    }\n}\n```\n\n当 Hibernate 从数据库中获取 `Author` 实体时，它会将 `@Formula`\
    \ 注解中的 SQL 代码段添加到其 SQL 语句中。\n\n```\n05:35:15,762 DEBUG [org.hibernate.SQL] - select\
    \ author0_.id as id1_0_, author0_.dateOfBirth as dateOfBirth2_0_, author0_.firstName\
    \ as firstName3_0_, author0_.lastName as lastName4_0_, author0_.version as version5_0_,\
    \ date_part('year', age(author0_..dateOfBirth)) as formula0_ from Author author0_\
    \ where author0_.id=1\n```\n\n> `@Formula` 注解提供了一种将 SQL 代码段的结果映射到实体属性的简单方法。它也有一些你应该注意的缺点：\n\
    \n> - Hibernate 会为从数据库中获取的每一个 Author 实体执行该 SQL 代码段。因此，最好确保你只在所有用例场景中都需要的属性上使用它。\n\
    > - 你需要为 `@Formula` 注解提供一个原生 SQL 代码段。这可能会影响应用程序的数据库移植性。\n\n### 源代码\n\n你可以在示例项目的\
    \ `Formula` 模块中找到包含此 Hibernate 技巧的可执行测试用例的项目。如果你还没有下载，可以访问 http://www.hibernate-tips.com/download-examples\
    \ 下载它。\n\n"
