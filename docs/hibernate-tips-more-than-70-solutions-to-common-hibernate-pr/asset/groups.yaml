    \ test cases for this Hibernate tip in the MapNativeQueryToEntity module of the\
    \ example project. If you haven't already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n# Learn More\n\n@SqlResultSetMapping is a powerful feature that allows you to\
    \ define complex mappings for native query results. You can also use it to map\
    \ the query result to a POJO as I show in How to map the result of a native SQL\
    \ query to a POJO.\n\n# How to map the result of a native SQL query to a POJO\n\
    \n# Problem\n\nMy query is too complex for JPQL, and I have to use a native query.\
    \ What is the easiest way to map the result of the query to a POJO?\n\n# Solution\n\
    \nJPA supports @SqlResultMappings, which you can use to map the query result to\
    \ a POJO. In the following example, I want to map the result of a native SQL query\
    \ to BookValue objects.\n\n```\npublic class BookValue {\n    private String title;\n\
    \    private Date publishingDate;\n\n    public BookValue(String title, Date publishingDate)\
    \ {\n        this.title = title;\n        this.publishingDate = publishingDate;\n\
    \    }\n\n    ...\n}\n```\n\nYou can use a @SqlResultSetMapping to define a constructor\
    \ call similar to the constructors expressions you know from JPQL. The following\
    \ code snippet shows an example of such a mapping.\n\n```\n@SqlResultSetMapping(\n\
    \    name = \"BookValueMapping\",\n    classes = @ConstructorResult(\n```\n\n\
    ```\ntargetClass = BookValue.class,\ncolumns = {{@ColumnResult(name = \"title\"\
    ),\n@ColumnResult(name = \"date\")}}\n```\n\nThe mapping consist of a name and\
    \ a @ConstructorResult annotation. To use the mapping, you need to provide its\
    \ name as the second parameter to the createNativeQuery method. So, make sure\
    \ to choose a name that describes the mapping and is easy to remember.\n\nThe\
    \ @ConstructorResult annotation defines a constructor call of the BookValue class.\
    \ The @ColumnResult annotations describe how Hibernate shall map the columns of\
    \ the result to the parameters of the constructor. In this example, Hibernate\
    \ performs a constructor call using the value of the title column as the first\
    \ and the value of the date column as the second parameter.\n\nWhen you provide\
    \ the name of the @ResultSetMapping as the second parameter to the createNativeQuery\
    \ method, Hibernate applies the mapping to the query result. You can use it to\
    \ map the results of all queries that return at the parameters defined by the\
    \ @ColumnResult annotations.\n\n```\nBookValue b = (BookValue) em.createNativeQuery(\n\
    \"SELECT b.publishingDate as date, b.title, b.id \"\n+ \"FROM b WHERE b.id = 1\"\
    , \"BookValueMapping\")\n.getSingleResult();\n```\n\n# Source Code\n\nYou can\
    \ find a project with executable test cases for this Hibernate tip in the MapNativeQueryToPojo\
    \ module of the example project. If you haven’t already done so, you can download\
    \ it at http://www.hibernate-tips.com/download-examples.\n\n# Learn More\n\n@SqlResultSetMapping\
    \ is a powerful feature that allows you to define complex mappings for native\
    \ query results. You can also use it to map the query result to multiple POJOs\
    \ or managed entities as I show in How to map the result of a native SQL query\
    \ to entities.\n\n# CREATE QUERIES PROGRAMMATICALLY WITH THE CRITERIA API\n\n\
    Like all JPA implementations, Hibernate implements the Criteria API. It supports\
    \ the same feature set as JPQL and is a good solution if you need to dynamically\
    \ define queries at runtime. Common use cases for that are complex search operations\
    \ based on user input. For these use cases, the dynamic approach of the Criteria\
    \ API is often a better solution than defining multiple JPQL queries.\n\nBut as\
    \ you'll see in the examples, the definition of a query can become complex. I\
    \ therefore recommend using JPQL for all use cases that allow the static definition\
    \ of a query.\n\nThis chapter includes the following Hibernate tips:\n\n- How\
    \ to select entities with a CriteriaQuery\n- How to select POJOs with a CriteriaQuery\n\
    - How to select multiple scalar values in a CriteriaQuery\n- How to call a standard\
    \ database function in a CriteriaQuery\n- How to call a user-defined function\
    \ in a CriteriaQuery\n- How to update multiple entities with the Criteria API\n\
    - How to delete multiple entities with the Criteria API\n- How to use pagination\
    \ with a CriteriaQuery\n- How to reference entity attributes in a type-safe way\n\
    \n# How to select entities with a CriteriaQuery\n\n# Problem\n\nI need to define\
    \ a query based on user input. What is the best way to programmatically create\
    \ a query at runtime with Hibernate?\n\n# Solution\n\nYou can use JPA's Criteria\
    \ API to define queries programmatically. It provides a type-safe way to create\
    \ a query and supports the same features as JPQL. The first thing you should do\
    \ is to define the bind parameters. I create two parameters of type String. One\
    \ for the first name and one for the last name. Then I define the WHERE clause\
    \ by calling the where method on the CriteriaQuery. The Predicate in this example\
    \ checks that the firstName and lastName attribute are equal to the values of\
    \ the bind parameters.\n\nI've defined my query, and now I want to execute it.\
    \ That requires multiple steps, as you can see in the code sample. You first need\
    \ to call the createQuery method of the EntityManager with your CriteriaQuery\
    \ instance. Hibernate returns an instance of the TypedQuery interface. That is\
    \ the same interface as you get when you create a JPQL query and you're probably\
    \ familiar with the following steps. I set the values for the two bind parameters\
    \ by calling the setParameter method for each of them and call the getResultList\
    \ method on the TypedQuery interface to execute the query.\n\nYou can use JPA's\
    \ Criteria API to define queries programmatically. It provides a type-safe way\
    \ to create a query and supports the same features as JPQL. The following code\
    \ snippet shows an example of such a mapping. In the next step, I define the FROM\
    \ clause. You first need to get the CriteriaBuilder instance from the EntityManager.\n\
    \n```\nCriteriaBuilder cb = em.getCriteriaBuilder();\nCriteriaQuery<Book> cq =\
    \ cb.createQuery(Book.class);\n\n// define FROM clause\nRoot<Book> root = cq.from(Book.class);\n\
    Join<Book, Author> authors = root.join(Book_.authors);\n\n// define WHERE clause\
    \ with bind parameters\nParameterExpression<String> paramFirstName =\ncb.parameter(String.class);\n\
    ParameterExpression<String> paramLastName =\ncb.parameter(String.class);\n```\n\
    \n```\ncq.where(\n  cb.and(\n    cb.equal(authors.get(Author_.firstName), paramFirstName),\n\
    \    cb.equal(authors.get(Author_.lastName), paramLastName))\n  )\n)\n\n// execute\
    \ query\nTypedQuery<Book> query = em.createQuery(cq);\nquery.setParameter(paramFirstName,\
    \ \"Thorben\");\nquery.setParameter(paramLastName, \"Janssen\");\nList<Book> books\
    \ = query.getResultList();\n```\n\nHibernate then generates a SQL query based\
    \ on the CriteriaQuery and executes it with the provided bind parameter values.\n\
    \n```\n13:43:58,566 DEBUG [org.hibernate.SQL] -\nselect\n  book0_.id as id1_\n\
    \  book0_.price as price2_\n  book0_.publisherid as publishe6_\n  book0_.publishingDate\
    \ as publishi3_\n  book0_.title as title4_\n  book0_.version as version5_\nfrom\n\
    \  Book book0_\n```\n"
