    \ m.getBook());\n```\n\n# Source Code\n\nYou can find a project with executable\
    \ test cases for this Hibernate tip in the AssociationUnidirectionalOneToOne module\
    \ of the example project. If you’ve already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n# Learn More\n\nUnidirectional one-to-one associations are just one way to model\
    \ relationships between entities. I show other options in:\n\n- How to map a bidirectional\
