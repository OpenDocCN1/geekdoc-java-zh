  - "[PAGE 177]\n\n# How to create a named JPQL query\n\n# Problem\n\nI have queries\
    \ that I want to use in multiple places in my business logic. What is the best\
    \ way to define these queries once and use them when needed?\n\n# Solution\n\n\
    Named queries provide a good solution if you want to define a query once and in\
    \ multiple parts of your business logic. You define a named query with the @NamedQuery\
    \ annotation. The following code snippet shows a simple example of such a query\
    \ definition.\n\n```\n@Entity\n@NamedQuery(\n    name = Book.QUERY_SELECT_BY_ID,\n\
    \    query = \"SELECT b FROM Book b WHERE b.id = :\" + Book.PARAM_ID)\npublic\
    \ class Book {\n    public static final String QUERY_SELECT_BY_ID =\n        \"\
    Book.selectById\";\n    public static final String PARAM_ID = \"id\";\n\n    ...\n\
    }\n```\n\nThe @NamedQuery annotation requires two parameters: The name and the\
    \ JPQL query String. As you can see, I use a static String as the name of the\
    \ query and the bind parameter. That makes it easier to reference them in the\
    \ business logic."
- md: "\nThe JPQL query is the same as you would use in an ad-hoc JPQL query and it\
    \ looks very similar to an SQL query. The main difference between SQL and JPQL\
    \ is that SQL uses database tables and JPQL the entity model to define the query.\
    \ That makes JPQL easier to use for most Java developers, but you still need to\
    \ be familiar with SQL. Hibernate transforms the JPQL statement to SQL, and you\
    \ should always check the generated statements after you created or adapted to\
    \ a JPQL query.\n\nThat's all you need to do define a named JPQL query. You can\
    \ use its name to instantiate it in your business logic.\n\n```\nTypedQuery<Book>\
    \ q = em.createNamedQuery(Book.QUERY_SELECT_BY_ID, Book.class);\nq.setParameter(Book.PARAM_ID,\
    \ 1L);\nBook b = q.getSingleResult();\n```\n\nAs you can see in the code snippet,\
    \ you use a named JPQL query in a similar way as an ad-hoc query. The only difference\
    \ is the way you instantiate the TypedQuery. You already defined the query with\
    \ the @NamedQuery annotation, and you only need to provide its name to the createNamedQuery\
    \ method of the EntityManager to instantiate it. That is the point where the usage\
    \ of the static String for query name pays off. It's lot easier to use the static\
    \ String in your business code, and it allows you to refactor the query name easily.\n\
    \nI also provided the class of the Book entity as the second parameter to the\
    \ createNamedQuery method to get a TypedQuery instance. This one is strongly typed\
    \ and doesn't require any type casting off the query result.\n\nThe named query\
    \ in this example selects a Book entity with a given id, and I used a named bind\
    \ parameter in the WHERE clause of the query. I need to set its value before I\
    \ can execute the query. I do that by calling the setParameter method of the Source\
    \ TypedQuery method with the parameter name and its value.\n\n# Source Code\n\n\
    You can find a project with executable test cases for this Hibernate tip in the\
    \ JPQLNamedQuery module of the example project. If you haven’t already done so,\
    \ you can download it at http://www.hibernate-tips.com/download-examples.\n\n\
    # Learn More\n\nNamed queries are just one option to create a JPQL query. You\
    \ can also use ad-hoc queries to define queries at runtime. I explain them in\
    \ more detail in How to create a JPQL query at runtime.\n\n# How to select a POJO\
    \ with a JPQL query\n\n# Problem\n\nThe entity projection doesn't fit my use case.\
    \ Is there an easy option to select POJOs instead of entities?\n\n# Solution\n\
    \nJPQL supports constructor expressions that allow you to define a constructor\
    \ call in the SELECT clause of your query. You can see an example of such a query\
    \ in the following code snippet.\n\n```\nTypedQuery<BookValue> q = em.createQuery(\n\
    \  \"SELECT new org.thoughts.java.model.BookValue(\"\n  + \"b.id, b.title, b.publisher.name)\
    \ FROM Book b \"\n  + \"WHERE b.id = :id\", BookValue.class);\nq.setParameter(\"\
    id\", 1L);\nBookValue b = q.getSingleResult();\n```\n\nInstead of selecting an\
    \ entity, I define a constructor expression in the SELECT clause. It consists\
    \ of the keyword **new**, the fully qualified name of the class you want to instantiate\
    \ and a comma separated list of parameters. The example in the previous code snippet\
    \ calls the constructor of the **BookValue** class and provides the **id** and\
    \ the **title** of the book and the **name** of the **Publisher** as parameters.\n\
    \n```\npublic class BookValue {\n  public Long id;\n  public String title;\n \
    \ public String publisherName;\n\n  public BookValue(Long id, String title, String\
    \ publisherName) {\n    this.id = id;\n    this.title = title;\n    this.publisherName\
    \ = publisherName;\n  }\n\n...\n```\n\nHibernate maps this statement to a SQL\
    \ query that selects the required columns from the database and performs the defined\
    \ constructor call for each record of the result set.\n\n```\n15:25:38,544 DEBUG\
    \ [org.hibernate.SQL] -\nselect\n    book0_.id as col_0_,\n    book0_.title as\
    \ col_1_,\n    publisher1_.name as col_2__\nfrom\n    book0_,\n    publisher1_\n\
    where\n    book0_.publisherid=publisher1_.id\nand book0_.id=?\n```\n\n# Source\
    \ Code\n\nYou can find a project with executable test cases for this Hibernate\
    \ tip in the JPQLConstructorExpression module of the example project. If you haven't\
    \ already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n# Learn More\n\nPOJOs are just one of the projections you can use with JPQL.\
    \ You can also select managed entities or multiple scalar values:\n\n- How to\
    \ create a JPQL query at runtime\n- How to select multiple scalar values with\
    \ a JPQL query\n\n# How to select multiple scalar values with a JPQL query\n\n\
    # Problem\n\nI only need a few attributes of my entity. How do I select one or\
    \ more scalar values in a JPQL query instead of entities?\n\n# Solution\n\nYou\
    \ can select scalar values in the same way as you select managed entities. The\
    \ following code snippet shows a JPQL query that selects the **title** of the\
    \ Book entity and the **name** of the associated **Publisher** entity.\n\n```\n\
    TypedQuery<Object[]> q = em.createQuery(\n\"SELECT b.title, b.publisher.name FROM\
    \ Book b WHERE b.id = :id\", Object[].class);\nq.setParameter(\"id\", 1L);\nObject[]\
    \ result = q.getSingleResult();\n```\n\nAs you can see, you can select scalar\
    \ values in the same way as you select managed entities. The following code snippet\
    \ shows a JPQL query that selects the **title** of the Book entity and the **name**\
    \ of the associated **Publisher** entity. (Note: The OCR text had some disjointed\
    \ code here, reconstructed based on context).\n\n```book0_.publisherid=publisher1_.id\n\
    and book0_.id=?```\n\n# Source Code\n\nYou can find a project with executable\
    \ test cases for this Hibernate tip in the JPQLScalarValues module of the example\
    \ project. If you haven’t already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n# Learn More\n\nScalar values are just one of the projections you can use with\
    \ JPQL. You can also select managed entities or POJOs:\n\n- How to create a JPQL\
    \ query at runtime\n- How to select a POJO with a JPQL query\n\n# How to initialize\
    \ lazy relationships within a JPQL query\n\n# Problem\n\nHow do I initialize a\
    \ lazy relationship within a query to avoid LazyInitializationExceptions?\n\n\
    # Solution\n\nHibernate throws a LazyInitializationException if you try to use\
    \ the attribute of a lazily fetched relationship outside an active Hibernate Session.\n\
    \n```\nEntityManager em = emf.createEntityManager();\nem.getTransaction().begin();\n\
    \nAuthor a = em.createQuery(\"SELECT FROM Author WHERE id = 1\", Author.class).getSingleResult();\n\
    \nlog.info(\"Commit transaction and close\");\nem.getTransaction().commit();\n\
    em.close();\n\nlog.info(a.getFirstName()+\" \"+a.getLastName()+\" wrote \"+a.getBooks().size()+\"\
    \ book.\");\n```\n\n```\n06:23:38,969 DEBUG [org.hibernate.SQL] - \nselect\n \
    \   author0_.id as id1_,\n    author0_.firstName as firstName2_,\n    author0_.lastName\
    \ as lastName3_,\n    author0_.version as version4_,\nfrom\n    author0_\nwhere\n\
    \    author0_.id=1\n```\n\n```\n06:23:38,993 INFO [org.thoughts.java.model.TestJoinFetch]\
    \ -\nCommit transaction and close Session\n06:23:39,008 ERROR [org.thoughts.java.model.TestJoinFetch]\
    \ -\norg.hibernate.LazyInitializationException: failed to lazily initialize a\
    \ collection of role:\norg.thoughts.java.model.Author.books, could not initialize\
    \ proxy\nno Session\n```\n\nYou can avoid that by initializing the relationship\
    \ before you close the Session. The easiest way to do that is a JOIN FETCH statement\
    \ within a query, like the one in the following code snippet.\n\n```\nEntityManager\
    \ em = emf.createEntityManager();\nem.getTransaction().begin();\n\nAuthor a =\
    \ em.createQuery(\n\"SELECT FROM Author a JOIN FETCH a.books WHERE a.id = 1\"\
    ,\nAuthor.class).getSingleResult();\n\nem.getTransaction().commit();\nem.close();\n\
    \nlog.info(a.getFirstName()+\" \"+a.getLastName()+\" wrote \"+a.getBooks().size()+\"\
    \ book.\");\n```\n\nThe additional FETCH keyword tells Hibernate not only to join\
    \ the entity for the query also to fetch it from the database to initialize the\
    \ attribute. That prevents LazyInitializationExceptions if you access the relationship\
    \ attribute of an active Hibernate Session.\n\n```\n06:25:10,081 DEBUG [org.hibernate.SQL]\
    \ -\nselect\nauthor0_.id as id1_0_0_,\nbook2..id as id1_1_1_,\nauthor0..firstName\
    \ as firstName2_0_0_,\nauthor0..lastName as lastName3_0_0_,\nauthor0..version\
    \ as version4_0_0_,\nfrom\n    author0_\n```\n"
