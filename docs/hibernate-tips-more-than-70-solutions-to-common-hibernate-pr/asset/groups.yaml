    You also need to activate caching for the query results you want to cache. You
    can do that by calling the setCacheable method of the Hibernate-specific Query
    interface using the parameter true.


    ```

    Session s = (Session) em.getDelegate();

    Query q = s.createQuery("SELECT a FROM Author WHERE id = :id");

    q.setParameter("id", 1l);

    q.setCacheable(true);

    Author a = q.uniqueResult();

    ```


    Hibernate now stores the result of this query in the query cache. When your next
    use case executes this query, Hibernate checks if the query cache contains a result
    for the given parameter values. If the cache contains a matching record, Hibernate
    gets the query result from there. Otherwise, it executes the query and store its
    result in the cache.


    # Source Code


    You can find a project with executable test cases for this Hibernate tip in the
    QueryCache module of the example project. If you haven''t already done so, you
    can download it at http://www.hibernate-tips.com/download-examples.


    # Learn More


    The query cache stores query results and no entities. If you want to cache entities
    that you often use in your business code, you can use the second-level cache.
    I show you how in How to store an entity in the second-level cache.'
