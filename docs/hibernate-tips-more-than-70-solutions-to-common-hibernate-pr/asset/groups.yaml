  - '[PAGE 237]


    # How to call a user-defined function in a CriteriaQuery


    # Problem


    How do I call a user-defined database function in the WHERE clause of my CriteriaQuery?


    # Solution


    Since JPA 2.1, you can use the function(String name, Class<T> type, Expression<?>...
    args) method of the CriteriaBuilder to call user-defined or database-specific
    functions. You need to provide the name and the expected result type of the function
    as the first two parameters, and you can provide one or more Expression that will
    be used as function arguments.


    The following code snippet shows an example that calls the user-defined database
    function calculate. The definition of the query follows the same structure as
    the definition of any other CriteriaQuery. I explain it in more detail in How
    to select entities with a CriteriaQuery.


    The definition of the WHERE clause is the interesting part of this code sample.
    I use it to call the user-defined database function calculate. Before I do that,
    I need to define the two parameters of type Double that I want to provide to the
    database function. The calculate function returns a Double, and I provide the
    price of the Book and a query parameter as function arguments.


    ```

    // Create the CriteriaQuery

    CriteriaBuilder cb = em.getCriteriaBuilder();

    CriteriaQuery<Book> cq = cb.createQuery(Book.class);

    Root<Book> root = cq.from(Book.class);

    ```'
  - "[PAGE 238]\n\n```\n// call the database function calculate\nParameterExpression<Double>\
    \ doubleParam1 =\n  cb.parameter(Double.class);\nParameterExpression<Double> doubleParam2\
    \ =\n  cb.parameter(Double.class);\ncq.where(\n  cb.greaterThan(\n    doubleParam2,\n\
    \    cb.function(\"calculate\", Double.class,\n      root.get(Book_.price), doubleParam1)));\n\
    \n// Set bind parameter values and execute the Query\nTypedQuery<Book> q = em.createQuery(cq);\n\
    q.setParameter(doubleParam1, 10.0D);\n.setParameter(doubleParam2, 40.0D);\nList<Book>\
    \ books = q.getResultList();\n```\n\nWhen you execute CriteriaQuery, Hibernate\
    \ generates a SQL query with the defined function call.\n\n```\n15:08:12,187 DEBUG\
    \ [org.hibernate.SQL] -\nselect\n  book0_.id as id1_0,\n  book0_.price as price2_0,\n\
    \  book0_.publishingDate as publi3_0,\n  book0_.title as title4_0,\n  book0_.version\
    \ as version5_0_\nfrom\n  book0_\nwhere\n  ?>calculate(book0_.price, ?)\n```\n\
    \nYou can use this approach in the WHERE clause to call all functions supported\
    \ by your database."
  - '[PAGE 239]


    You can also use the function function in the SELECT clause of your query. But
    you then need to register the database function so that Hibernate knows it''s
    result type. That makes the function function superfluous because you can use
    all registered functions directly in your query.


    # Source Code


    You can find a project with executable test cases for this Hibernate tip in the
    CriteriaCustomFunction module of the example project. If you haven''t already
