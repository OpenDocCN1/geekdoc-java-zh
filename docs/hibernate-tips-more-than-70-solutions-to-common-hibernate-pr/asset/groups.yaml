  - '[PAGE 119]


    # How to model an association with additional attributes


    # Problem


    I need to persist additional attributes for my many-to-many association. How do
    I do that with Hibernate?


    # Solution


    Modelling a many-to-many association with JPA and Hibernate is simple. You just
    need an entity attribute and a @ManyToMany annotation. Hibernate internally maps
    the relationship to the join table you need in your table model. But this approach
    has one downside. It doesn''t allow you to map any columns of the join table.
    If you want to do that, you need to model it in the same way as you do it in the
    database. You need to split the many-to-many association into an entity that maps
    the join table and has two many-to-one relationships to the associated entities.


    The following diagram shows the domain model of a bookstore that uses an association
    with additional attributes. There are books in multiple formats (e.g. hardcover,
    paperback, ebook) and each format is published by a different publisher. The Book
    and Publisher entities model the two main domain objects. The BookPublisher entity
    models the association between them and persists the Format as an additional attribute.'
