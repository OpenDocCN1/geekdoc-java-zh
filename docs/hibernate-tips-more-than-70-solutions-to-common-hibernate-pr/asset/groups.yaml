    \ \" \n+ \"FROM Book b JOIN Review r ON r.fkBook = b.id \" \n+ \"GROUP BY b.title\"\
    );\nObject[] r = (Object[]) q.getSingleResult();\n```\n\nHibernate 使用了你可能在 SQL\
    \ 中过的相同语法。你引用想要连接的两个实体以及想要执行的连接类型。Hibernate 支持 `inner JOIN`、`LEFT outer join`\
    \ 和 `RIGHT outer join`。你还需要在 `JOIN` 子句的 `ON` 中定义连接条件。\n\n之前的代码片段显示了所有 `Book` 和\
    \ `Review` 实体的内连接，以便我统计每本书的评论数量。当你执行此查询时，Hibernate 将 JPQL `JOIN` 子句转换为外观相似的 SQL\
    \ 子句。\n\n```sql\n19:48:12,518 DEBUG [org.hibernate.SQL] -\nselect\nbook_.title\
    \ as col_0_0_,\ncount(review1_.id) as col_1_0\n\nfrom\n  Book book_\n  inner join\n\
    \    Review review1_\n    on (\n      review1_.fkBook=book0_.id\n    )\n  group\
    \ by\n    book0_.title\n```\n\n## Source Code\n\n你可以在示例项目的 `HibernateJoinUnassociatedEntities`\
    \ 模块中找到包含此 Hibernate 技巧的可执行测试用例的项目。如果你还没有下载，可以从 http://www.hibernate-tips.com/download-examples\
    \ 下载。\n\n## 如何映射自然 ID\n\n### Problem\n\n我的领域模型包含几个自然 ID，我需要在业务逻辑中使用它们来查找对象。在 Hibernate\
    \ 中建模这些 ID 的最佳方法是什么？\n\n### Solution\n\nHibernate 为自然 ID 提供了私有支持。建模为自然 ID 需要的是添加\
    \ `@NaturalId`。如果自然 ID 包含多个属性，你需要对 ID 的每个部分调用此方法。在这个示例中，我使用元数据模型（metamodel）来引用名称。\n\
    \n```java\n@Entity\npublic class Book {\n\n    @Id\n    @GeneratedValue(strategy\
    \ = GenerationType.AUTO)\n    @Column(name = \"id\", nullable = false)\n    private\
    \ Long id;\n\n    @NaturalId\n    private String isbn;\n\n    ...\n}\n```\n\n\
    自然 ID 默认是不可变的。如果你需要可变的自然 ID，必须 `@NaturalId` 注解设置为 `true`。Hibernate 的 Session 提供了\
    \ `byNaturalId` 和 `bySimpleNaturalId` 方法来检索它们。当自然标识仅包含一个属性时，可以使用 `byNaturalId`\
    \ 方法来加载。\n\n```java\nBook b = session.byNaturalId(Book.class)\n.using(Book_.isbn,\
    \ \"123-45678902\")\n.load();\n\nBook b = session.bySimpleNaturalId(Book.class)\n\
    .load(\"123-45678902\");\n```\n\n## Source Code\n\n你可以在示例项目的 `HibernateNaturalId`\
    \ 模块中找到包含此 Hibernate 技巧的可执行测试用例的项目。如果你还没有下载，可以从 http://www.hibernate-tips.com\
    \ 下载。\n\n## 如何通过主键加载多个实体\n\n### Problem\n\n我需要通过主键加载多个实体。编写 JPQL 查询有更简单的方法吗？\n\
    \n### Solution\n\n通过主键加载多个实体是一个非常常见的用例。从 5.1 版本开始，Hibernate 提供了一个私有 API，使得加载多个实体变得简单得多，并提供了额外的优势，例如分批获取巨大的列表。\n\
    \n你只需要在 Hibernate Session 上调用 `byMultipleIds(Class entityClass)` 方法，并提供想要加载的实体类作为参数。然后你将获得一个泛型的\
    \ `MultiIdentifierLoadAccess` 接口实例。它可以一次性加载多个实体并配置数据库交互。\n\n```java\nMultiIdentifierLoadAccess<Book>\
    \ multi =\nsession.byMultipleIds(Book.class);\nList<Book> books = multi.multiLoad(1L,\
    \ 2L, 3L);\n```\n\n示例中 `multiLoad` 方法的调用根据给定的主键加载 `Book` 实体。Hibernate 为此方法调用创建一个查询，并将三个主键作为参数传递给\
    \ `IN` 语句。\n\n```sql\n06:25:30,202 DEBUG [org.hibernate.SQL] -\nselect\nbook0_.id\
    \ as id1_0_0_,\n```\n\n"
