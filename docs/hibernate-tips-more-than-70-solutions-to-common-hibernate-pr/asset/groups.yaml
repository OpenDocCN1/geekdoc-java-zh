  - "[PAGE 161]\n\nYou might already know the concept from JDBC result sets or Hibernate's\
    \ ScrollableResults. Scrolling through the records of a result set and processing\
    \ them as a Stream are a great fit. Both approaches process one record after the\
    \ other, and there is no need to fetch all of them upfront.\n\nSince Hibernate\
    \ 5.2, you can do exactly that with the stream method of Hibernate's Query interface.\
    \ It returns a Stream of the query result and uses Hibernate's ScrollableResults\
    \ internally. That allows you to scroll through the result set without fetching\
    \ all records in the beginning.\n\n```\nStream<Book> books = session.createQuery(\"\
    SELECT b FROM Book Book.class\").stream();\nbooks.map(b -> b.getTitle() + \" was\
    \ published on \" + b.getPublishingDate())\n    .forEach(m -> log.info(m));\n\
    ```\n\n# Source Code\n\nYou can find a project with executable test cases for\
    \ this Hibernate tip in the ResultsAsStreams module of the example project. If\
    \ you haven't already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n# Learn More\n\nHibernate 5 also provides proprietary support for other Java\
    \ 8 features, like Optional and the Date and Time API. You can read more about\
    \ it in:\n\n+   * How to map an association to an Optional\n* How to map classes\
    \ of Java 8's Date and Time API"
