    \ = \"id\", updatable = false, nullable = false)\n  private Long id;\n\n  @ToOneToOne\n\
    \  @JoinColumn(name = \"fk_book\")\n  private Book book;\n\n  ...\n}\n```\n\n\
    这就是定义单向一对一关联所需的所有操作。你现在可以在 JPQL 或 Criteria 查询中或者在你的领域对象上从 `Manuscript` 导航到 `Book`\
    \ 实体。\n\n```java\nBook b = em.find(Book.class, 1L);\nManuscript m = b.getManuscript();\n\
    Assert.assertEquals(b, m.getBook());\n```\n\n# 源代码\n\n你可以在示例项目的 `AssociationUnidirectionalOneToOne`\
