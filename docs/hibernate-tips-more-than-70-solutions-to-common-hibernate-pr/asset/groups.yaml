    \ Long id;\n\n    @Column(name = \"publishing_date\", updatable = false, nullable\
    \ = false)\n    private LocalDate publishingDate;\n\n    ...\n}\n```\n\n# Source\
    \ Code\n\nYou can find a project with executable test cases for this Hibernate\
    \ tip in the DateAndTime module of the example project. If you haven’t already\
    \ done so, you can download it at http://www.hibernate-tips.com/download-examples.\n"
