    # How to map an inheritance hierarchy to one table


    # Problem


    My database contains one table, which I want to map to an inheritance hierarchy
    of entities. How do I define such a mapping?


    # Solution


    JPA and Hibernate support different inheritance strategies which allow you to
    map the entities to different table structures. The **SingleTable** strategy is
    one of them and maps an inheritance hierarchy of entities to a single database
    table.


    Let''s have a look at the entity model before I explain the details of the **SingleTable**
    strategy. **Authors** can write different kinds of **Publications**, like **Books**
    and **BlogPosts**. The **Publication** class is the super class of the **Book**
    and **BlogPost** classes.'
