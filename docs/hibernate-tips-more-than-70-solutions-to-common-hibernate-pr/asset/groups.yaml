  - '[PAGE 59]


    # How to map a bidirectional many-to-one association


    # Problem


    My table model contains a many-to-one association. How do I model it with Hibernate
    so that I can navigate it in both directions?


    # Solution


    You need to model the association on both entities if you want to be able to navigate
    in both directions. Consider this example. A book in an online bookstore can have
    multiple reviews. In your domain model, the Book entity has a one-to-many association
    to the Review entity, and the Review entity has a many-to-one relationship to
    the Book entity.


    | Book | Review |

    | --- | --- |

    | -Id id: Long | -Id id: Long |

    | -ToMany reviews: List<Review>... | -ManyToOne book: Book ... |


    Let’s begin with the Review entity, which is the owning side of the association
    in this example. That means it defines the association and the Book entity just
    references it. The relationship consists of two mandatory and one optional part.
    The entity attribute of type Book and the @ManyToOne annotation are required.
    The attribute models the association, and the annotation declares the type of
    relationship. The @JoinColumn annotation is optional. It allows you to define
    the name of the foreign key column. I use it in the following code snippet to
    set the column name to fk_book.'
  - "[PAGE 60]\n\nIf you don't define the name yourself, Hibernate generates a name\
    \ by combining the name of the association mapping attribute and the name of the\
    \ primary key attribute of the associated entity. In this example, Hibernate would\
    \ use book_id as the default column name.\n\n```\n@Entity\npublic class Review\
    \ {\n\n  @Id\n  @GeneratedValue(strategy = GenerationType.AUTO)\n  @Column(name\
    \ = \"id\", updatable = false, nullable = false)\n  private Long id;\n\n  @ManyToOne\n\
    \  @JoinColumn(name = \"fk_book\")\n  private Book book;\n\n  ...\n}\",}\n```\n\
    \nYou also need to map the one-to-many association on the Book entity to make\
    \ it bidirectional. As you can see in the following code snippet, this is done\
    \ in a similar way as to the many-to-one association.\n\n```\n@Entity\npublic\
    \ class Book {\n\n  @Id\n  @GeneratedValue(strategy = GenerationType.AUTO)\n \
    \ @Column(name = \"id\", updatable = false, nullable = false)\n  private Long\
    \ id;\n\n  @OneToMany(mappedBy = \"book\")\n  private List<Review> reviews = new\
    \ ArrayList<Review>();\n\n  ...\n}\",}\n```"
  - '[PAGE 61]


    You need an attribute that models the association, which is the List<Review> reviews
    attribute in this example and a @OneToMany annotation. Like in the table model,
    the bidirectional one-to-many association gets defined on the many side. The table
    on the many side stores the foreign key and its entity defines the association.
    It’s similar for the entity mapping. You just need to reference the name of the
    association attribute of the many side as the value of the mappedBy attribute
    and Hibernate has all the information it needs.


