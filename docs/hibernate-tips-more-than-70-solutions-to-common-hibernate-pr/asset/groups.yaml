    # Problem


    My domain model contains an inheritance structure, and I need to limit my query
    to a specific subclass. How do I do that with JPQL?


    # Solution


    JPA 2.1 introduced the TREAT operator to JPQL, which you can use to downcast an
    entity within your query.


    You can, for example, create a domain model with **Authors** who have written
    different kinds of **Publications**, like **Books** and **BlogPosts**. **Publication**
    is the super class of **Book** and **BlogPost** and you can model the relationship
    between the **Author** and the **Publication** entity.'
