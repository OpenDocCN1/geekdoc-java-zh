    # How to store an entity in the second-level cache


    # Problem


    Several of my use cases read the same entities from the database without changing
    them. How do I cache them in my application so that Hibernate doesn’t always have
    to get them from the database?


    # Solution


    You can use Hibernate’s session-independent second-level cache to cache entities
    that are used by multiple Hibernate Session. The cache is deactivated by default,
    and you need to set two configuration parameters to activate it:


    +   1. You need to define the shared-cache-mode. It tells Hibernate how to select
    entities for the second-level cache. You can choose between ALL to cache all entities,
    NONE to don’t cache any entities, ENABLE_SELECTIVE to select the entities that
    will be cached and DISABLE_SELECTIVE to select the entities that will not be cached.
    I prefer ENABLE_SELECTIVE because it requires me to explicitly decide which entities
    are cached.


    +   2. You need to specify specifying the cache provider you want to use by setting
    the hibernate.cache.region.factory_class property.


    The following code snippet shows parts of a persistence.xml file with a second-level
    cache configuration. It uses the shared_cache_mode ENABLE_SELECTIVE and EhCache
    as the caching provider.'
