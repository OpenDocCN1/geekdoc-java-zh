    # How to order the elements of a collection


    # Problem


    How do I order the elements of a collection without writing my own query?


    # Solution


    JPA supports the @OrderBy annotation. You can use it to define the order in which
    associated entities shall be retrieved from the database.


    > Hibernate applies the ordering every time it loads the associated entities from
    the database. That slows down the query, and you should make sure that you always
    need to retrieve the entities in the defined order. Otherwise, you should use
    a case-specific query that returns the entities in the defined order.


    You can apply the @OrderBy annotation to a relationship attribute and define the
    ordering in the same way as in a JPQL query. You have to provide one or more entity
    attributes as, comma-separated list. Hibernate applies an ascending order by default.
    But you can also define the preferred order for each of the attributes. You just
    need to add ASC to define an ascending order or DESC for an descending order behind
    the attribute name.


    I use this annotation in the following code snippet to retrieve the Authors of
    a Book in the ascending order of their lastName attribute.


