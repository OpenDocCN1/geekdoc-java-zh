    \n# JAVA 8\n\nJava 8 introduced a lot of powerful and convenient changes to the\
    \ Java world. Hibernate supports the new concepts and data type since version\
    \ 5. It started with the support of the classes of the Date and Time API as BasicTypes\
    \ in version 5.0. The required changes were packaged into the optional `hibernate-java8.jar`\
