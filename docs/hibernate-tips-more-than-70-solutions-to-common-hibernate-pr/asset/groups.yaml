- md: "\n# How to call a user-defined function in a CriteriaQuery\n\n## Problem\n\n\
    How do I call a user-defined database function in the WHERE clause of my CriteriaQuery?\n\
    \n## Solution\n\nSince JPA 2.1, you can use the function(String name, Class<T>\
    \ type, Expression<?>... args) method of the CriteriaBuilder to call user-defined\
    \ or database-specific functions. You need to provide the name and the expected\
    \ result type of the function as the first two parameters, and you can provide\
    \ one or more Expression that will be used as function arguments.\n\nThe following\
    \ code snippet shows an example that calls the user-defined database function\
    \ calculate. The definition of the query follows the same structure as the definition\
    \ of any other CriteriaQuery. I explain it in more detail in How to select entities\
    \ with a CriteriaQuery.\n\nThe definition of the WHERE clause is the interesting\
    \ part of this code sample. I use it to call the user-defined database function\
    \ calculate. Before I do that, I need to define the two parameters of type Double\
    \ that I want to provide to the database function. The calculate function returns\
    \ a Double, and I provide the price of the Book and a query parameter as function\
    \ arguments.\n\n```java\n// Create the CriteriaQuery\nCriteriaBuilder cb = em.getCriteriaBuilder();\n\
    CriteriaQuery<Book> cq = cb.createQuery(Book.class);\nRoot<Book> root = cq.from(Book.class);\n\
    ```\n\n```java\n// call the database function calculate\nParameterExpression<Double>\
    \ doubleParam1 =\n  cb.parameter(Double.class);\nParameterExpression<Double> doubleParam2\
    \ =\n  cb.parameter(Double.class);\ncq.where(\n  cb.greaterThan(\n    doubleParam2,\n\
    \    cb.function(\"calculate\", Double.class,\n      root.get(Book_.price), doubleParam1)));\n\
    \n// Set bind parameter values and execute the Query\nTypedQuery<Book> q = em.createQuery(cq);\n\
    q.setParameter(doubleParam1, 10.0D);\nq.setParameter(doubleParam2, 40.0D);\nList<Book>\
    \ books = q.getResultList();\n```\n\nWhen you execute CriteriaQuery, Hibernate\
    \ generates a SQL query with the defined function call.\n\n```sql\n15:08:12,187\
    \ DEBUG [org.hibernate.SQL] -\nselect\n  book0_.id as id1_0,\n  book0_.price as\
    \ price2_0,\n  book0_.publishingDate as publi3_0,\n  book0_.title as title4_0,\n\
    \  book0_.version as version5_0_\nfrom\n  book0_\nwhere\n  ?>calculate(book0_.price,\
    \ ?)\n```\n\nYou can use this approach in the WHERE clause to call all functions\
    \ supported by your database.\n\nYou can also use the function method in the SELECT\
    \ clause of your query. But you then need to register the database function so\
    \ that Hibernate knows it's result type. That makes the function superfluous because\
    \ you can use all registered functions directly in your query.\n\n# Source Code\n\
    \nYou can find a project with executable test cases for this Hibernate tip in\
    \ the CriteriaCustomFunction module of the example project. If you haven't already\
    \ done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n# Learn More\n\nYou can also use the function method in a JPQL query. I show\
    \ you how in How to call a user-defined function in a JPQL query.\n\n# How to\
    \ update multiple entities with the Criteria API\n\n## Problem\n\nHave to update\
    \ a lot of entities. With SQL, I would only need 1 UPDATE statement to update\
    \ all entities. Is there a way to do the same with the Criteria API?\n\n## Solution\n\
    \nThe CriteriaUpdate interface allows you to define an update statement that changes\
    \ multiple entities. The following code snippet shows an example of such a statement.\
    \ It increases the price of all Books by 10%.\n\n```java\n// define the CriteriaUpdate\n\
    CriteriaBuilder cb = em.createCriteriaBuilder();\nCriteriaUpdate<Book> update\
    \ = cb.createCriteriaUpdate(Book.class);\nRoot<Book> root = update.from(Book.class);\n\
    update.set(Book_.price, cb.prod(root.get(Book_.price), 1.1));\n\n// create and\
    \ execute the Query\nQuery query = em.createQuery(update);\nquery.executeUpdate();\n\
    ```\n\nAs you can see, I define the CriteriaUpdate statement in a similar way\
    \ as a CriteriaQuery. I first get a CriteriaBuilder from the EntityManager and\
    \ use it to create a CriteriaUpdate instance.\n\nThen I define the Root of the\
    \ query in the same way as I do it for a CriteriaQuery.\n\nIn the next step, I\
    \ call the set method on the CriteriaUpdate interface to define the update operation.\
    \ The first parameter specifies the entity attribute I want to change. In this\
    \ example, I want to update the price attribute. The second parameter is an Expression\
    \ that calculates the new price. I want to increase the price by 10% and therefore\
    \ multiply the current price with 1.1. That's all you need to define a CriteriaUpdate\
    \ statement.\n\nIf you don't want to update all entities, you can add a WHERE\
    \ clause to the statement. You can define it in the same way as you do it for\
    \ a CriteriaQuery.\n\nThe only step that's left is to create a Query based on\
    \ the CriteriaUpdate and execute it. Hibernate then generates a SQL UPDATE statement\
    \ that increases the price of all Books by 10%. You can check the generated SQL\
    \ statement in the log file if you activate logging for the SQL statements.\n\n\
    ```sql\n18:57:25,118 DEBUG [org.hibernate.SQL] - update Book set price=price*1.1\n\
    ```\n\nUpdating multiple entities with CriteriaUpdate is more efficient than updating\
    \ one by one. The CriteriaUpdate statement doesn't know which records get changed\
    \ and you need to make sure the cache doesn't contain outdated entities programmatically.\n\
    \n# Source Code\n\nYou can find a project with executable test cases for this\
    \ Hibernate tip in the CriteriaUpdate module of the example project. If you haven't\
    \ already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n# Learn More\n\nThe CriteriaUpdate interface is just one option to update multiple\
    \ entities with one query. You can also use JPQL update statement as I explain.\n\
    \n# How to delete multiple entities with the Criteria API\n\n## Problem\n\nI need\
    \ to delete multiple entities. Is there a way to do that with the Criteria API\
    \ that removes them one by one?\n\n## Solution\n\nThe CriteriaDelete interface\
    \ allows you to remove multiple entities with one statement. The definition of\
    \ the statement is similar to a CriteriaQuery or CriteriaUpdate. You can see an\
    \ example in the following code snippet. It deletes all Book entities from the\
    \ database.\n\n```java\n// define the CriteriaDelete\nCriteriaBuilder cb = em.getCriteriaBuilder();\n\
    CriteriaDelete<Book> delete = cb.createCriteriaDelete(Book.class);\ndelete.from(Book.class);\n\
    \n// create and execute the Query\nQuery query = em.createQuery(delete);\nquery.executeUpdate();\n\
    ```\n\nYou first need to get the CriteriaBuilder from the EntityManager and create\
    \ a CriteriaDelete instance. Then you need to define the FROM clause of the delete\
    \ statement, and you can add an optional WHERE clause. You do it in the same way\
    \ as you do for a CriteriaQuery.\n\nThat's all you need to define a CriteriaDelete\
    \ statement. You can now use it to create a Query and execute it.\n\nHibernate\
    \ generates a SQL DELETE statement based on your CriteriaDelete statement. In\
    \ this example, it also manages mapped associations. It first performs an SQL\
    \ DELETE statement to remove all references to the deleted Book entities from\
    \ the association table BookAuthor. When that is done, Hibernate executes another\
    \ SQL statement to remove the Book entities.\n\n```sql\n16:49:44,984 DEBUG [org.hibernate.SQL]\
    \ - delete from BookAuthor\nwhere (bookId) in (select id from Book)\n16:49:44,986\
    \ DEBUG [org.hibernate.SQL] - delete from Book\n```\n\nDeleting multiple entities\
    \ with CriteriaDelete is more efficient than removing them one by one. Hibernate\
    \ doesn't know which database records the statement deletes and doesn't remove\
    \ any entities from the first-level cache. You need to make sure that the cache\
    \ doesn't contain any deleted entities or you need to invalidate the cache programmatically.\n\
    \n# Source Code\n\nYou can find a project with executable test cases for this\
    \ Hibernate tip in the CriteriaDelete module of the example project. If you haven't\
    \ already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n# Learn More\n\nThe CriteriaDelete interface is just one option to delete multiple\
    \ entities with one query. You can also use a JPQL delete statement as I explain.\n"
  mdcn: "\n\n# 如何在 CriteriaQuery 中调用自定义函数\n\n## 问题\n\n如何在 CriteriaQuery 的 WHERE 子句中调用自定义的数据库函数？\n\
    \n## 解决方案\n\n从 JPA 2.1 开始，你可以使用 `CriteriaBuilder` 的 `function(String name, Class<T>\
    \ type, Expression<?>... args)` 方法来调用自定义或特定于数据库函数。你需要通过前两个参数提供函数的名称和预期的结果类型，并可以提供一个或多个作为函数参数的\
    \ `Expression`。\n\n下面的代码段展示了调用自定义数据库函数 `calculate` 的示例。查询的定义与任何其他 `CriteriaQuery`\
    \ 的结构相同。我将在《如何使用 CriteriaQuery 查询实体》中进行详细解释。\n\nWHERE 子句的定义是这段代码示例中有趣的部分。我使用它来调用自定义数据库函数\
    \ `calculate`。在在此之前，我需要定义两个提供给数据库函数的 `Double` 类型参数。`calculate` 函数返回一个 `Double`\
    \ 类型，我提供了 `Book` 的价格和一个查询参数作为函数参数。\n\n```java\n// 创建 CriteriaQuery\nCriteriaBuilder\
    \ cb = em.getCriteriaBuilder();\nCriteriaQuery<Book> cq = cb.createQuery(Book.class);\n\
    Root<Book> root = cq.from(Book.class);\n```\n\n```java\n// 调用数据库函数 calculate\n\
    ParameterExpression<Double> doubleParam1 =\n  cb.parameter(Double.class);\nParameterExpression<Double>\
    \ doubleParam2 =\n  cb.parameter(Double.class);\ncq.where(\n  cb.greaterThan(\n\
    \    doubleParam2,\n    cb.function(\"calculate\", Double.class,\n      root.get(Book_.price),\
    \ doubleParam1)));\n\n// 设置绑定参数值并执行查询\nTypedQuery<Book> q = em.createQuery(cq);\n\
    q.setParameter(doubleParam1, 10.0D);\nq.setParameter(doubleParam2, 40.0D);\nList<Book>\
    \ books = q.getResultList();\n```\n\n当你执行 `CriteriaQuery` 时，Hibernate 会生成一个包含定义函数调用的\
    \ SQL 查询。\n\n```sql\n15:08:12,187 DEBUG [org.hibernate.SQL] -\nselect\n  book0_.id\
    \ as id1_0,\n  book0_.price as price2_0,\n  book0_.publishingDate as publi3_0,\n\
    \  book0_.title as title4_0,\n  book0_.version as version5_0_\nfrom\n  book0_\n\
    where\n  ?>calculate(book0_.price, ?)\n```\n\n你可以在 WHERE 子句中使用这种方法来调用你数据库支持的所有函数。\n\
    \n你也可以在查询的 `SELECT` 子句中使用 `function` 方法。但你随后需要注册该数据库函数，以便 Hibernate 知道它的结果类型。这会让该函数变得多余，因为你可以直接在查询中使用所有所有已注册的函数。\n\
    \n# 源码\n\n你可以在示例项目的 `CriteriaCustomFunction` 模块中找到包含此 Hibernate 技巧的带有执行测试用例的项目。如果你还没有下载，可以在\
    \ http://www.hibernate-tips.com/download-examples 下载它。\n\n# 了解更多\n\n你也可以在 JPQL\
    \ 查询中使用 `function` 方法。我将在《如何在 JPQL 查询中调用自定义函数》中向你展示如何操作。\n\n# 如何使用 Criteria API\
    \ 更新多个实体\n\n## 问题\n\n必须更新大量实体。使用 SQL，我只需要 1 条 `UPDATE` 语句即可更新所有实体。是否有方法使用 Criteria\
    \ API 实现同样的操作？\n\n## 解决方案\n\n`CriteriaUpdate` 接口允许你定义一个更改多个实体的更新语句。下面的代码段展示了此类语句的示例。它将所有\
    \ `Book` 的价格增加了 10%。\n\n```java\n// 定义 CriteriaUpdate\nCriteriaBuilder cb = em.createCriteriaBuilder();\n\
    CriteriaUpdate<Book> update = cb.createCriteriaUpdate(Book.class);\nRoot<Book>\
    \ root = update.from(Book.class);\nupdate.set(Book_.price, cb.prod(root.get(Book_.price),\
    \ 1.1));\n\n// 创建并执行查询\nQuery query = em.createQuery(update);\nquery.executeUpdate();\n\
    ```\n\n如你所见，我以类似于 `CriteriaQuery` 的方式定义了 `CriteriaUpdate` 语句。我首先从 `EntityManager`\
    \ 获取 `CriteriaBuilder` 并使用它创建一个 `CriteriaUpdate` 实例。\n\n然后，我以与 `CriteriaQuery`\
    \ 相同的方式定义查询的 `Root`。\n\n下一步，我调用 `CriteriaUpdate` 接口上的 `set` 方法来定义更新操作。第一个参数指定我想要更改的实体属性。在这个示例中，我想更新\
    \ `price` 属性。第二个参数是计算新价格的 `Expression`。我想将价格增加 10%，因此将当前价格乘以 1.1。这就是定义一个 `CriteriaUpdate`\
    \ 语句所需的所有内容。\n\n如果你不想更新所有实体，可以为语句添加一个 `WHERE` 子句。你可以以定义 `CriteriaQuery` 相同的方式定义它。\n\
    \n剩下的唯一步骤是根据 `CriteriaUpdate` 创建一个 `Query` 并执行它。Hibernate 随后会生成一个 SQL `UPDATE`\
    \ 语句，将所有 `Book` 的价格增加 10%。如果你激活了 SQL 语句的日志，可以在日志文件中检查生成的 SQL 语句。\n\n```sql\n18:57:25,118\
    \ DEBUG [org.hibernate.SQL] - update Book set price=price*1.1\n```\n\n使用 `CriteriaUpdate`\
    \ 更新多个实体比逐个更新更高效。`CriteriaUpdate` 语句并不知道哪些记录被更改了，你需要手动确保缓存是新的。\n\n# 源码\n\n你可以在示例项目的\
    \ `CriteriaUpdate` 模块中找到包含此 Hibernate 技巧的带有执行测试用例的项目。如果你还没有下载，可以在 http://www.hibernate-tips.com/download-examples\
    \ 下载它。\n\n# 了解更多\n\n`CriteriaUpdate` 接口只是通过一个查询更新多个实体的方法。你也可以使用 JPQL 更新语句，我会解释。\n\
    \n# 如何使用 Criteria API 删除多个实体\n\n## 问题\n\n我需要删除多个实体。是否有方法使用 Criteria API 实现，而不是逐个删除？\n\
    \n## 解决方案\n\n`CriteriaDelete` 接口允许你通过一个语句删除多个实体。该语句的定义与 `CriteriaQuery` 类似。你可以在下面的代码段中看到示例。它从数据库中删除所有的\
    \ `Book` 实体。\n\n```java\n// 定义 CriteriaDelete\nCriteriaBuilder cb = em.getCriteriaBuilder();\n\
    CriteriaDelete<Book> delete = cb.createCriteriaDelete(Book.class);\ndelete.from(Book.class);\n\
    \n// 创建并执行查询\nQuery query = em.createQuery(delete);\nquery.executeUpdate();\n\
    ```\n\n你首先需要从 `EntityManager` 获取 `CriteriaBuilder` 并创建一个 `CriteriaDelete` 实例。然后你需要定义删除语句的\
    \ `FROM` 子句，并添加一个可选的 `WHERE` 子句。其方式与定义 `CriteriaQuery` 相同。\n\n这就是定义 `CriteriaDelete`\
    \ 语句所需的所有内容。你现在可以使用它创建一个 `Query` 并执行它。\n\nHibernate 会根据你的 `CriteriaDelete` 语句生成\
    \ SQL `DELETE` 语句。在这个示例中，它还会处理映射关联。它首先执行一个 SQL `DELETE` 语句，从关联表 `BookAuthor` 中删除对已删除\
    \ `Book` 实体的引用。完成后，Hibernate 会执行另一个 SQL 语句来删除 `Book` 实体。\n\n```sql\n16:49:44,984\
    \ DEBUG [org.hibernate.SQL] - delete from BookAuthor\nwhere (bookId) in (select\
    \ id from Book)\n16:49:44,986 DEBUG [org.hibernate.SQL] - delete from Book\n```\n\
    \n使用 `CriteriaDelete` 删除多个实体比逐个删除更高效。Hibernate 并不知道语句删除了哪些数据库记录，也不会从一级缓存中移除任何实体。你需要确保缓存不包含任何已删除的实体，或者你需要程序地使缓存失效。\n\
    \n# 源码\n\n你可以在示例项目的 `CriteriaDelete` 模块中找到包含此 Hibernate 技巧的带有执行测试用例的项目。如果你还没有下载，可以在\
    \ http://www.hibernate-tips.com/download-examples 下载它。\n\n# 了解更多\n\n`CriteriaDelete`\
    \ 接口只是通过一个查询删除多个实体的方法之一。你也可以使用 JPQL 删除语句，我会解释。\n\n"
