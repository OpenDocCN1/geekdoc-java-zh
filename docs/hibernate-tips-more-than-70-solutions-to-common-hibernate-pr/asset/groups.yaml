    ```


    Bidirectional associations are easy to use in queries, but they also require an
    additional step when you persist a new entity. You need to update the association
    on both sides when you add or remove an entity. You can see an example of it in
    the following code snippet in which I first create a new Manuscript entity and
    initialize its association to the Book entity. And after that, I also need to
    set the new Manuscript entity on the Book entity.


    ```

    Book b = em.find(Book.class, 1L);


    Manuscript m = new Manuscript();

    m.setBook(b);


    b.setManuscript(m);


    em.persist(m);

    ```


