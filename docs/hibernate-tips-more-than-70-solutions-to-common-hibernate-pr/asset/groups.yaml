- md: "\n@@EntityResult annotation defines to which entity the query result will be\
    \ mapped. Therefore, you need to specify the class of the query result and a set\
    \ of @FieldResult annotations. Each @FieldResult annotation defines the mapping\
    \ between a result column and an entity attribute. You can define multiple @EntityResult\
    \ mappings for a @SqlResultSetMapping if you want to map the query result to multiple\
    \ entities.\n\nYou can use this mapping by providing its name as the second parameter\
    \ to the createNativeQuery method. The defined @SqlResultSetMapping tells Hibernate\
    \ to map the query result to a Book entity, but it doesn't change the return type\
    \ of the getSingleResult method. It still returns an Object and you need to cast\
