  - "[PAGE 247]\n\n# # How to reference entity attributes in a type-safe way\n\n#\
    \ ## Problem\n\nReferencing entity attributes by their name is error-prone and\
    \ makes the code hard to refactor. How do I reference an attribute in a type-safe\
    \ way so that I don't run into problems when I have to change its name?\n\n# ##\
    \ Solution\n\nI prefer to use the JPA Metamodel to reference entity attributes\
    \ in a type-safe way. The metamodel consists of a generated class for each managed\
    \ class in the persistence unit. These classes are stored in the same package\
    \ and have the name as the corresponding managed classes with an added \"_\" at\
    \ the end.\n\nThe only thing you have to do to generate these classes is to add\
    \ a dependency to Hibernate's Static Metamodel Generator to your build process\
    \ like I do in the following Maven pom.xml file.\n\n```\n<project>\n  <modelVersion>4.0.0</modelVersion>\n\
    \n  <dependencies>\n    <dependency>\n      <groupId>org.hibernate</groupId>\n\
    \      <artifactId>hibernate-jpamodelgen</artifactId>\n    </dependency>\n   \
    \ ..\n  </dependencies>\n\n  ..\n</project>\n```"
