  mdcn: "\n# 在 JPQL 查询中调用用户定义的函数\n\n## 问题\n\n我如何在 JPQL 查询的 WHERE 子句中调用用户定义的数据库函数？\n\
    \n## 解决方案\n\nJPA 2.1 在 JPQL 中添加了函数 `function(function_name, function_arg)`，以提供调用用户定义函数和特定数据库函数的方法。你需要将函数名称作为第一个参数，并可以提供额外的参数作为函数参数。\n\
    \n以下代码段展示了调用自定义数据库函数 `calculate` 的示例。该函数返回一个 `Double`，我提供了 `Book` 的 `price` 和一个查询参数作为函数参数。\n\
    \n```\nTypedQuery<Book> q = em.createQuery(\n  \"SELECT b FROM Book b \"\n+ \"\
    WHERE :double2 > function('calculate', b.price, :double1)\",\n  Book.class);\n\
    \nq.setParameter(\"double1\", 10.0D);\nq.setParameter(\"double2\", 40.0D);\nList<Book>\
    \ books = q.getResultList();\n```\n\n你可以在 WHERE 子句中使用这种方法来调用你的数据库支持的所有函数。\n\n\
    你也可以在查询的 SELECT 子句中使用函数 **function**。但此时你需要注册该数据库函数，以便 Hibernate 知道它的结果类型。这使得函数\
    \ **function** 变得多余，因为你可以直接在查询中使用所有已注册的函数。\n\n## 源码\n\n你可以在示例项目的 **QLCustomFunction**\
    \ 模块中找到包含此 Hibernate 技巧的可执行测试用例的项目。如果你还没有下载，可以访问 http://www.hibernate-tips.com/download-examples\
    \ 下载它。\n\n## 了解更多\n\n你也可以在 CriteriaQuery 中使用函数 **function**。我将在《如何在 CriteriaQuery\
    \ 中调用用户定义的函数》中向你展示操作方法。\n\n# 如何在 JPQL 中使用分页\n\n## 问题\n\nJPQL 不支持 `LIMIT` 关键字。我该如何在\
    \ Hibernate 中使用分页？\n\n## 解决方案\n\n使用 JPA 和 Hibernate，你必须在 Query 接口上设置分页信息，而不是像在\
    \ SQL 中那样在查询字符串中设置。你可以通过调用 `setFirstResult(int startPosition)` 和 `setMaxResults(int\
    \ maxResults)` 方法来实现。\n\n以下代码段展示了一个从数据库返回前五个作者（Authors）的简单示例。结果集索引为 0，你需要提供 0\
    \ 作为 `startPosition` 以从第一个元素开始。\n\n```\nList<Author> authors = em.createQuery(\n\
    \"SELECT a FROM Author ORDER BY a.id\", Author.class)\n    .setMaxResults(5)\n\
    \    .setFirstResult(0)\n    .getResultList();\n```\n\n要从数据库中选择下五个作者，你只需要将 `startPosition`\
    \ 改为 5。\n\n```\nList<Author> authors = em.createQuery(\n\"SELECT a FROM Author\
    \ ORDER BY a.id\", Author.class)\n    .setMaxResults(5)\n    .setFirstResult(5)\n\
    \    .getResultList();\n```\n\n## 源码\n\n你可以在示例项目的 **QueryPination** 模块中找到包含此 Hibernate\
    \ 技巧的可执行测试用例的项目。如果你还没有下载，可以访问 http://www.hibernate-tips.com/download-examples\
    \ 下载。\n\n## 更多\n\n你可以使用相同的方法对 `CriteriaQuery` 的结果进行分页。我将在《如何在 CriteriaQuery 中使用分页》中进行更详细的解释。\n\
    \n# 如何为 JPQL 查询定义超时\n\n## 问题\n\n我想确保我的查询在一定时间后被取消。有办法为查询定义超时时间吗？\n\n## 解决方案\n\n\
    JPA 和 Hibernate 支持 `javax.persistence.query.timeout` 提示（hint），以毫秒为单位定义查询超时。Hibernate\
    \ 使用它来调用 JDBC Statement 的 `setTimeout` 方法，本身并不处理超时。因此，查询提示是否起作用取决于取决于 JDBC 驱动程序和数据库的能力。\n\
    \n以下两个代码段展示了如何向 Query 和 `EntityManager.find` 方法提供查询超时提示。\n\n```\nList<Author>\
    \ authors = em.createQuery(\"SELECT a FROM Author a\")\n    .setHint(\"javax.persistence.query.timeout\"\
    , 1)\n    .getResultList();\n```\n\n```\nHashMap<String, Object> hints = new HashMap<>();\n\
    hints.put(\"javax.persistence.query.timeout\", 1);\n\nem.find(Author.class, 1L,\
    \ hints);\n```\n\n## 源码 \n\n你可以在示例项目的 **QueryTimeout** 模块中找到包含此 Hibernate 技巧的可执行测试用例的项目。如果你还没有下载，可以访问\
    \ http://www.hibernate-tips.com/download-examples 下载。\n\n## 更多\n\n查询超时只是 JPA 和\
    \ Hibernate 支持的多个查询提示之一。我将在《每个开发者都应该知道的 11 个 JPA 和 Hibernate 查询提示》中解释更多内容。\n\n\
    # 如何用一条 JPQL 查询删除多个实体\n\n## 问题\n\n我需要删除多个实体。有办法像 SQL 一样用一条 JPQL 查询来实现吗？\n\n##\
    \ 解决方案\n\n你可以使用 JPQL DELETE 语句一次删除多个实体。它的语法与 SQL DELETE 语句相似。你可以在下面的代码段中看到删除 Book\
    \ 表中所有记录的 JPQL 语句示例。\n\n```\nQuery query = em.createQuery(\"DELETE Book b\");\n\
    query.executeUpdate();\n```\n\n（注：由于原文中存在大量重复和碎片化的 OCR 内容，已根据逻辑合并并翻译了核心内容。）\n"
