  - "[PAGE 160]\n\n# How to retrieve a query result as a Java 8 Stream\n\n# Problem\n\
    \nI want to use a Java 8 Stream to process the result of a query. What is the\
    \ best way to get a query result as a Stream?\n\n# Solution\n\nThe most obvious\
    \ but not the most efficient approach is to just call the stream method on the\
    \ List interface. You can see an example of it in the following code snippet.\
    \ I first call the getResultList method on the Query interface to get the query\
    \ result as a List and then call the stream method of the List interface.\n\n\
    ```\nList<Book> books = session.createQuery(\"SELECT b FROM Book b\", Book.class).getResultList();\n\
    books.stream()\n  .map(b -> b.getTitle() + \" was published on \"\n  + b.getPublishingDate())\n\
    \  .forEach(m -> log.info(m));\n```\n\nThat approach might look OK but it has\
    \ a drawback that can create performance issues for huge result sets. In this\
    \ example, Hibernate gets all the selected Book entities from the database, stores\
    \ them in memory, and puts them into a List. Then I call the stream method and\
    \ processes the results by one.\n\nThere is no need to fetch all records of the\
    \ query result at the beginning. For huge result sets it's better to scroll through\
    \ the records and fetch them in smaller chunks."
- md: "\nYou might already know the concept from JDBC result sets or Hibernate's ScrollableResults.\
    \ Scrolling through the records of a result set and processing them as a Stream\
    \ are a great fit. Both approaches process one record after the other, and there\
    \ is no need to fetch all of them upfront.\n\nSince Hibernate 5.2, you can do\
    \ exactly that with the stream method of Hibernate's Query interface. It returns\
    \ a Stream of the query result and uses Hibernate's ScrollableResults internally.\
    \ That allows you to scroll through the result set without fetching all records\
    \ in the beginning.\n\n```\nStream<Book> books = session.createQuery(\"SELECT\
    \ b FROM Book Book.class\").stream();\nbooks.map(b -> b.getTitle() + \" was published\
    \ on \" + b.getPublishingDate())\n    .forEach(m -> log.info(m));\n```\n\n# Source\
    \ Code\n\nYou can find a project with executable test cases for this Hibernate\
    \ tip in the ResultsAsStreams module of the example project. If you haven't already\
    \ done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n# Learn More\n\nHibernate 5 also provides proprietary support for other Java\
    \ 8 features, like Optional and the Date and Time API. You can read more about\
    \ it in:\n\n- How to map an association to an Optional\n- How to map classes of\
    \ Java 8's Date and Time API\n\n# LOGGING\n\n**Logging is an often ignored but\
    \ important topic. A good logging** configuration can help you to find potential\
    \ issues during development and doesn't slow down your application in production.\n\
    \nThe definition of a good production configuration is simple. You just need to\
    \ set the log level of Hibernate's **org.hibernate** category to **ERROR** to\
    \ avoid any unnecessary log messages.\n\nThe development configuration is more\
    \ complex. You need more internal information while you implement new or change\
    \ existing cases. I show you how to get these information in the following Hibernate\
    \ tips:\n\n- How to log SQL statements and their parameters\n- How to count the\
    \ executed queries in a Session\n- How to use query comments to identify a query\n\
    \n# How to log SQL statements and their parameters\n\n# Problem\n\nHow do you\
    \ configure Hibernate so that it writes the executed SQL statements and used bind\
    \ parameters to the log file?\n\n# Solution\n\nHibernate uses two different log\
    \ categories and log levels to log the executed SQL statements and their bind\
    \ parameters:\n\n- The SQL statements are written as DEBUG messages to the category\
    \ org.hibernate.SQL.\n- The bind parameter values are logged to the org.hibernate.type.descriptor.sql\
    \ category with log level TRACE.\n\nYou can activate and deactivate them independently\
    \ of each other in your log configuration.\n\n> Logging all SQL queries and their\
    \ bind parameter bindings can slow down your application and create huge log files.\
    \ You shouldn't activate these log messages in production.\n\nThe following code\
    \ snippet shows an example of a log4j configuration which activates both of them.\n\
    \n```\nlog4j.append.stdout.org.apache.log4j.ConsoleAppender\nlog4j.append.stdout.Target=System.out\n\
    log4j.append.stdout.layout=org.apache.log4j.PatternLayout\nlog4j.append.stdout.layout.ConversionPattern=%d{HH:mm:ss,\
    \ SSS} %-5p\n[%c] - %m%n\n```\n\n```\nlog4j.rootLogger=info, stdout\n# basic log\
    \ level for all messages\nlog4j.logger.hibernate=-info\n```\n\n```\n# SQL statements\
    \ and parameters\nlog4j.logger.hibernate.SQL=debug\nlog4j.logger.hibernate.type.descriptor.sql=trace\n\
    ```\n\nHibernate writes log messages like the following ones to your log file.\n\
    \n```\n17:34:50,DEBUG [org.hibernate.SQL] - select author0_.id as\nid1_0_, author0_.firstName\
    \ as firstName2_0_, author0_.lastName as\nlastName3_0_, author0_.version as version4_0\
    \ from Author author0_\nwhere author0_.id=1\n17:34:50, TRACE\n[org.hibernate.type.descriptor.BasicExtractor]\
    \ - extracted value\n[[id1_0_ : [BIGINT]]) - [1]\n17:34:50, TRACE\n[org.hibernate.type.descriptor.BasicExtractor]\
    \ - extracted value\n[[firstName2_0_ : [VARCHAR]]) - [Thorben]\n17:34:50, TRACE\n\
    [org.hibernate.type.descriptor.BasicExtractor] - extracted value\n[[lastName3_0_\
    \ : [VARCHAR]]) - [Janssen]\n17:34:50, TRACE\n[org.hibernate.type.descriptor.BasicExtractor]\
    \ - extracted value\n[[version4_0_ : [INTEGER]]) - [0]]\n```\n\nThe SQL statement\
    \ in the code snippet isn't easy to read. That gets a lot better when you tell\
    \ Hibernate to format it. You can do that by setting the configuration parameter\
    \ hibernate.format_sql to true. You can provide it as a system property or set\
    \ it in the persistence.xml file, like in the following code snippet, or in the\
    \ hibernate.cfg.xml file.\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    \ standalone=\"yes\"?>\n<persistence>\n  <persistence-unit name=\"my-persistence-unit\"\
    >\n    <description>Hibernate TRACE</description>\n    <provider>\n      org.hibernate.jpa.HibernatePersistenceProvider\n\
    \    </provider>\n    <exclude-unlisted-classes>false</exclude-unlisted-classes>\n\
    \    <properties>\n      <property name=\"hibernate.format_sql\" value=\"true\"\
    \ />\n    </properties>\n  </persistence-unit>\n</persistence>\n```\n\nThe following\
    \ code snippet shows the formatted SQL which is much better to read than the previous.\n\
    \n```\n17:34:50,DEBUG [org.hibernate.SQL] - select author0_.id as\nid1_0_, author0_.firstName\
    \ as firstName2_0_, author0_.lastName as\nlastName3_0_, author0_.version as version4_0\
    \ from Author author0_\nwhere author0_.id=1\n17:34:50, TRACE\n[org.hibernate.type.descriptor.BasicExtractor]\
    \ - extracted value\n[[id1_0_ : [BIGINT]]) - [1]\n17:34:50, TRACE\n[org.hibernate.type.descriptor.BasicExtractor]\
    \ - extracted value\n[[firstName2_0_ : [VARCHAR]]) - [Thorben]\n17:34:50, TRACE\n\
    [org.hibernate.type.descriptor.BasicExtractor] - extracted value\n[[lastName3_0_\
    \ : [VARCHAR]]) - [Janssen]\n17:34:50, TRACE\n[org.hibernate.type.descriptor.BasicExtractor]\
    \ - extracted value\n[[version4_0_ : [INTEGER]]) - [0]]\n```\n"
  mdcn: "\n\n你可能已经从 JDBC 结果集或 Hibernate 的 `ScrollableResults` 中了解过这个概念。遍历结果集的记录并将其作为\
    \ `Stream` 处理是非常契合的。两种方法都是逐条处理记录的，并且不需要预先获取所有记录。\n\n从 Hibernate 5.2 开始，你可以通过 Hibernate\
    \ `Query` 接口的 `stream` 方法精确实现这一操作。它返回一个查询结果的 `Stream`，并在内部使用了 Hibernate 的 `ScrollableResults`。这允许你遍历结果集，而不需要在开始时所有记录。\n\
    \n```\nStream<Book> books = session.createQuery(\"SELECT b FROM Book Book.class\"\
    ).stream();\nbooks.map(b -> b.getTitle() + \" was published on \" + b.getPublishingDate())\n\
    \    .forEach(m -> log.info(m));\n```\n\n# 源代码\n\n你可以在示例项目的 `ResultsAsStreams`\
    \ 模块中找到包含此 Hibernate 技巧的可执行测试用例的项目。如果你还没有下载，可以在 http://www.hibernate-tips.com/download-examples\
    \ 下载它。\n\n# 更多信息\n\nHibernate 5 还对其他 Java 8 特性提供了原生支持，例如 `Optional` 以及日期和时间 API。你可以在下文中阅读更多信息：\n\
    \n- 如何将关联映射到 Optional\n- 如何映射 Java 8 日期和时间 API 的类\n\n# 日志 (LOGGING)\n\n**日志是一个经常忽略但重要的主题。良好的日志**\
    \ 配置可以帮助你在开发期间发现潜在问题，并且不会在生产环境中降低应用程序运行速度。\n\n良好的生产环境配置定义非常简单。你只需要将 Hibernate\
    \ 的 **org.hibernate** 类别的日志级别设置为 **ERROR**，以避免任何必要的日志消息。\n\n开发环境的配置更为复杂。在实现新功能或修改现有用例时，你需要更多的内部信息。我在下面的\
    \ Hibernate 技巧中向你展示如何获取这些信息：\n\n- 如何记录 SQL 语句及其参数\n- 如何统计 Session 中执行的查询数量\n-\
    \ 如何使用查询注释来标识查询\n\n# 如何记录 SQL 语句及其参数\n\n# 问题\n\n如何配置 Hibernate 以便将执行的 SQL 语句和所使用的绑定参数写入日志文件？\n\
    \n# 解决方案\n\nHibernate 使用两个不同的日志类别和日志级别来记录执行的 SQL 语句及其绑定参数：\n\n- SQL 语句作为 DEBUG\
    \ 消息写入类别 `org.hibernate.SQL`。\n- 绑定参数值记录到 `org.hibernate.type.descriptor.sql`\
    \ 类别，日志级别为 TRACE。\n\n你可以在日志配置中独立地激活或停用它们。\n\n> 记录所有的 SQL 查询及其绑定参数会减慢应用程序的速度并创建巨大的日志文件。你不应该在生产环境中激活这些日志消息。\n\
    \n下面的代码片段展示了同时激活这两者的 log4j 配置示例。\n\n```\nlog4j.append.stdout.org.apache.log4j.ConsoleAppender\n\
    log4j.append.stdout.Target=System.out\nlog4j.append.stdout.layout=org.apache.log4j.PatternLayout\n\
    log4j.append.stdout.layout.ConversionPattern=%d{HH:mm:ss, SSS} %-5p\n[%c] - %m%n\n\
    ```\n\n```\nlog4j.rootLogger=info, stdout\n# 所有消息的基础日志级别\nlog4j.logger.hibernate=-info\n\
    ```\n\n```\n# SQL 语句和参数\nlog4j.logger.hibernate.SQL=debug\nlog4j.logger.hibernate.type.descriptor.sql=trace\n\
    ```\n\nHibernate 会向你的日志文件写入如下日志消息。\n\n```\n17:34:50,DEBUG [org.hibernate.SQL]\
    \ - select author0_.id as\nid1_0_, author0_.firstName as firstName2_0_, author0_.lastName\
    \ as\nlastName3_0_, author0_.version as version4_0 from Author author0_\nwhere\
