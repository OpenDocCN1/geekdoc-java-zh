- md: "\n# How to call a user-defined function in a JPQL query\n\n## Problem\n\nHow\
    \ do I call a user-defined database function in the WHERE clause of a JPQL query?\n\
    \n## Solution\n\nJPA 2.1 added the function `function(function_name, function_arg)`\
    \ to JPQL to provide a way to call user-defined and database-specific functions.\
    \ You need to provide the name of the function as the first parameter and you\
    \ can provide additional parameters that will be used as function arguments.\n\
    \nThe following code snippet shows an example that calls the custom database function\
    \ `calculate`. The function returns a `Double` and I provide the `price` of the\
    \ `Book` and a query parameter as function arguments.\n\n```\nTypedQuery<Book>\
    \ q = em.createQuery(\n  \"SELECT b FROM Book b \"\n+ \"WHERE :double2 > function('calculate',\
    \ b.price, :double1)\",\n  Book.class);\n\nq.setParameter(\"double1\", 10.0D);\n\
    q.setParameter(\"double2\", 40.0D);\nList<Book> books = q.getResultList();\n```\n\
    \nYou can use this approach in the WHERE clause to call all functions supported\
    \ by your database.\n\nYou can also use the function **function** in the SELECT\
    \ clause of your query. But then you need to register the database function so\
    \ that Hibernate knows it's result type. This makes the function **function**\
    \ superfluous because you can use all registered functions directly in your query.\n\
    \n## Source Code\n\nYou can find a project with executable test cases for this\
    \ Hibernate tip in the **QLCustomFunction** module of the example project. If\
    \ you haven't already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n## Learn More\n\nYou can also use the function **function** in a CriteriaQuery.\
    \ I show you how in How to call a user-defined function in a CriteriaQuery.\n\n\
    # How to use pagination with JPQL\n\n## Problem\n\nJPQL does not support the LIMIT\
    \ keyword. How do I use pagination with Hibernate?\n\n## Solution\n\nWith JPA\
    \ and Hibernate, you have to set the pagination information on the Query interface\
    \ and not in the query String as you would do it in SQL. You can do that by calling\
    \ the setFirstResult(int startPosition) and setMaxResults(int maxResults) methods.\n\
    \nThe following code snippet shows a simple example that returns the first five\
    \ Authors from the database. The result set index is 0 and you need to provide\
    \ 0 as a startPosition to begin with the first element.\n\n```\nList<Author> authors\
    \ = em.createQuery(\n\"SELECT a FROM Author ORDER BY a.id\", Author.class)\n \
    \   .setMaxResults(5)\n    .setFirstResult(0)\n    .getResultList();\n```\n\n\
    To select the next five Authors from the database, you only need to change the\
    \ startPosition to 5.\n\n```\nList<Author> authors = em.createQuery(\n\"SELECT\
    \ a FROM Author ORDER BY a.id\", Author.class)\n    .setMaxResults(5)\n    .setFirstResult(5)\n\
    \    .getResultList();\n```\n\n## Source Code\n\nYou can find a project with executable\
    \ test cases for this Hibernate tip in the **QueryPination** module of the example\
    \ project. If you haven’t already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n## Learn more\n\nYou can use the same approach to paginate the result of a `CriteriaQuery`.\
    \ I explain it in more detail in How to use pagination with a CriteriaQuery.\n\
    \n# How to define a timeout for a JPQL query\n\n## Problem\n\nI want to make sure\
    \ that my query gets canceled after a certain time. Is there a way to define a\
    \ timeout for queries?\n\n## Solution\n\nJPA and Hibernate support the javax.persistence.query.timeout\
    \ hint to define a query timeout in milliseconds. Hibernate uses it to call the\
    \ setTimeout method on the JDBC Statement and doesn't handle the timeout itself.\
    \ It, therefore, depends on the JDBC driver and the database capabilities, if\
    \ the query hint has any effect.\n\nThe following two code snippets show you how\
    \ to provide the query timeout hint to a Query and the EntityManager.find method.\n\
    \n```\nList<Author> authors = em.createQuery(\"SELECT a FROM Author a\")\n   \
    \ .setHint(\"javax.persistence.query.timeout\", 1)\n    .getResultList();\n```\n\
    \n```\nHashMap<String, Object> hints = new HashMap<>();\nhints.put(\"javax.persistence.query.timeout\"\
    , 1);\n\nem.find(Author.class, 1L, hints);\n```\n\n## Source Code\n\nYou can find\
    \ a project with executable test cases for this Hibernate tip in the QueryTimeout\
    \ module of the example project. If you haven't already done so, you can download\
    \ it at http://www.hibernate-tips.com/download-examples.\n\n## Learn more\n\n\
    The query timeout is just one of multiple query hints supported by JPA and Hibernate.\
    \ I explain more of them in 11 JPA and Hibernate query hints every developer should\
    \ know.\n\n# How to delete multiple entities with one JPQL query\n\n## Problem\n\
    \nI need to delete multiple entities. Is there a way to do that with one JPQL\
    \ query like SQL?\n\n## Solution\n\nYou can use a JPQL DELETE statement to remove\
    \ multiple entities at once. It's syntax is similar to an SQL DELETE statement.\
    \ You can see an example of a JPQL statement that deletes all records from the\
    \ Book table in the following code snippet.\n\n```\nQuery query = em.createQuery(\"\
    DELETE Book b\");\nquery.executeUpdate();\n```\n\nYou can use a JPQL DELETE statement\
    \ to remove multiple entities at once. It's syntax is similar to an SQL DELETE\
