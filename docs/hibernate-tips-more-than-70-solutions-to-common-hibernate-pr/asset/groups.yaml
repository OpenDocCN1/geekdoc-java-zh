    \ it at http://www.hibernate-tips.com/download-examples.\n\n# Learn more\n\nIt\
    \ is a common practice to model the primary key of the association table and its\
    \ entity as a derived primary key. I explain the required mapping in more detail\
    \ in How to model a derived primary key with Hibernate.\n\n# How to map an inheritance\
    \ hierarchy to multiple tables\n\n# Problem\n\nMy database contains multiple tables\
    \ that I want to map to an inheritance hierarchy of entities. How do I define\
    \ such a mapping?\n\n# Solution\n\nJPA and Hibernate support different inheritance\
    \ strategies that allow you to map the entities to different table structures.\
    \ The **MappedSuperclass** approach and the strategies **TablePerClass** and **Joined**\
    \ map an inheritance hierarchy of entities to multiple tables. Each of them maps\
    \ the entities to a different table structure with its advantages and disadvantages.\
    \ You need to decide for your particular use case which approach you want to use.\n\
    \nLet's take a look at the entity model that I use in all examples of this Hibernate\
    \ tip before I show you the different inheritance strategies. **Authors** can\
    \ write different kinds of **Publications**, like **Books** and **BlogPosts**.\
    \ The **Publication** class is the super class of the **Book** and **BlogPost**\
    \ classes.\n\n# Author\n\n# Publication\n\n- Long id\n- int version\n- String\
    \ firstName\n- String lastName\n- List<Publication> publications\n\n- Long id\n\
    - int version\n- String title\n- LocalDate publishingDate\n- Set<Author> authors\n\
    \n```java\nLong getId()\nint getVersion()\nString getFirstName()\nvoid setFirstName(String\
    \ firstName)\nString getLastName()\nvoid setLastName(String lastName)\nList<Publication>\
    \ getPublications()\nvoid setPublications(List<Publication> publications)\nboolean\
    \ equals(Object obj)\nint hashCode()\nString toString()\n```\n\n```java\nLong\
    \ getId()\nint getVersion()\nString getTitle()\nvoid setTitle(String title)\n\
    LocalDate getPublishingDate()\nvoid setPublishingDate(LocalDate publishingDate)\n\
    Set<Author> getAuthors()\nvoid setAuthors(Set<Author> authors)\nboolean equals(Object\
    \ obj)\nint hashCode()\nString toString()\n```\n\n```java\nLong getId()\nint getVersion()\n\
    String getTitle()\nvoid setTitle(String title)\nLocalDate getPublishingDate()\n\
    void setPublishingDate(LocalDate publishingDate)\nSet<Author> getAuthors()\nvoid\
    \ setAuthors(Set<Author> authors)\nboolean equals(Object obj)\nint hashCode()\n\
    String toString()\n```\n\n```java\nLong getId()\nint getVersion()\nString getTitle()\n\
    void setTitle(String title)\nLocalDate getPublishingDate()\nvoid setPublishingDate(LocalDate\
    \ publishingDate)\nSet<Author> getAuthors()\nvoid setAuthors(Set<Author> authors)\n\
    boolean equals(Object obj)\nint hashCode()\nString toString()\n```\n\n# MappedSuperclass\n\
    \nThe MappedSuperclass approach maps each subclass to its own table. The superclass\
    \ itself is not mapped to any table. In this example, it maps the Author and BlogPost\
    \ entities to tables.\n\n```java\n@MappedSuperclass\npublic abstract class Publication\
    \ {\n\n    @Id\n    private Long id;\n\n    @Version\n    private int version;\n\
    \n    private String title;\n\n    private LocalDate publishingDate;\n}\n```\n\
    \n@Entity\npublic class Author extends Publication {\n\n    private String firstName;\n\
    \    private String lastName;\n\n    @OneToMany\n    private List<Publication>\
    \ publications;\n}\n\n@Entity\npublic class BlogPost extends Publication {\n\n\
    \    private String url;\n\n    @ManyToMany\n    private Set<Author> authors;\n\
    }\n```\n\n# Joined\n\nThe Joined strategy maps each class in the hierarchy to\
    \ its own table. Each table contains only the attributes specific to that class,\
    \ plus a foreign key to the superclass table.\n\n```java\n@Entity\n@Inheritance(strategy\
    \ = InheritanceType.JOINED)\npublic abstract class Publication {\n\n    @Id\n\
    \    private Long id;\n\n    @Version\n    private int version;\n\n    private\
    \ String title;\n\n    private LocalDate publishingDate;\n}\n\n@Entity\npublic\
    \ class Author extends Publication {\n\n    private String firstName;\n    private\
    \ String lastName;\n\n    @OneToMany\n    private List<Publication> publications;\n\
    }\n\n@Entity\npublic class BlogPost extends Publication {\n\n    private String\
    \ url;\n\n    @ManyToMany\n    private Set<Author> authors;\n}\n```\n\n# TablePerClass\n\
    \nThe TablePerClass strategy maps each concrete entity class of the hierarchy\
    \ to its own table. Each table contains all attributes of the class, including\
    \ those inherited from the superclass.\n\n```java\n@Entity\n@Inheritance(strategy\
    \ = InheritanceType.TABLE_PER_CLASS)\npublic abstract class Publication {\n\n\
    \    @Id\n    private Long id;\n\n    @Version\n    private int version;\n\n \
    \   private String title;\n\n    private LocalDate publishingDate;\n}\n\n@Entity\n\
    public class Author extends Publication {\n\n    private String firstName;\n \
    \   private String lastName;\n\n    @OneToMany\n    private List<Publication>\
    \ publications;\n}\n\n@Entity\npublic class BlogPost extends Publication {\n\n\
    \    private String url;\n\n    @ManyToMany\n    private Set<Author> authors;\n\
    }\n```\n"
