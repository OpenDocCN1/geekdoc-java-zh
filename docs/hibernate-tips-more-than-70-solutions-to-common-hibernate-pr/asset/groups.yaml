    # LOGGING


    **Logging is an often ignored but important topic. A good logging** configuration
    can help you to find potential issues during development and doesn''t slow down
    your application in production.


    The definition of a good production configuration is simple. You just need to
    set the log level of Hibernate''s **org.hibernate** category to **ERROR** to avoid
    any unnecessary log messages.


    The development configuration is more complex. You need more internal information
    while you implement new or change existing cases. I show you how to get these
    information in the following Hibernate tips:


    +   - How to log SQL statements and their parameters

    - How to count the executed queries in a Session

    - How to use query comments to identify a query'
  - '[PAGE 163]


    # How to log SQL statements and their parameters


    # Problem


    How do you configure Hibernate so that it writes the executed SQL statements and
    used bind parameters to the log file?


    # Solution


    Hibernate uses two different log categories and log levels to log the executed
    SQL statements and their bind parameters:


    +   The SQL statements are written as DEBUG messages to the category org.hibernate.SQL.

    The bind parameter values are logged to the org.hibernate.type.descriptor.sql
    category with log level TRACE.


    You can activate and deactivate them independently of each other in your log configuration.


    > Logging all SQL queries and their bind parameter bindings can slow down your
    application and create huge log files. You shouldn''t activate these log messages
    in production.


    The following code snippet shows an example of a log4j configuration which activates
    both of them.'
