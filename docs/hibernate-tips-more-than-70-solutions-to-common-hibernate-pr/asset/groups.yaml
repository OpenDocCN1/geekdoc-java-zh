- md: "\n# BASIC MAPPINGS\n\nHibernate supports a set of standard mappings that allows\
    \ you to map an entity attribute to a database column easily. The examples in\
    \ this chapter show how to use standard mappings for entity attributes, map primary\
    \ key attributes, generate unique primary key values, and map associations between\
    \ entities. You can find more advanced mapping definition in the Advanced Mappings\
    \ chapter.\n\nTo learn about standard mappings for entity attributes, see:\n\n\
    - How to define schema and table names\n- How to map basic entity attributes to\
    \ database columns\n- How to map a util Date or Calendar to a database column\n\
    - How to map an enum to a database column\n\nTo learn about the mapping of primary\
    \ key attributes and generation of unique primary key values, see:\n\n- How to\
    \ map a simple primary key\n- How to use an auto-incremented column to generate\
    \ primary key values\n- How to use a custom database sequence to generate primary\
    \ key values\n- How to use a database table to generate primary key values\n-\
    \ How to use a generated UUID as a primary key\n\nTo learn about the mapping of\
    \ associations between entities, see:\n\n- How to map a bidirectional many-to-one\
    \ association\n- How to map an unidirectional many-to-one association\n- How to\
    \ map an unidirectional one-to-many association\n- How to map a bidirectional\
    \ many-to-many association\n- How to map an unidirectional many-to-many association\n\
    - How to map a bidirectional one-to-one association\n- How to map an unidirectional\
    \ one-to-one association\n\n## How to define schema and table names\n\n### Problem\n\
    \nHow do I define the name of the database schema and table to which Hibernate\
    \ maps an entity?\n\n### Solution\n\nYou can define the schema and table name\
    \ with the **schema** and **name** attributes of the `javax.persistence.Table`\
    \ annotation. See a related example in the following code snippet. You just have\
    \ to add the @Table annotation to your entity class and set the name and schema\
    \ attributes.\n\n```\n@Entity\n@Table(name = \"author\", schema = \"bookstore\"\
    )\npublic class Author {...}\n```\n\nWhen you use the entity, Hibernate uses the\
    \ provided schema and table names to create the SQL statements. The following\
    \ code snippet persists a new **Author** entity and performs a query to get all\
    \ **Author** entities with the given first name.\n\n```\nAuthor a = new Author();\n\
    a.setFirstName(\"firstName\");\na.setLastName(\"lastName\");\nem.persist(a);\n\
    a = em.createQuery(\n  \"SELECT FROM Author a WHERE firstName = 'firstName'\"\
    ,\n  Author.class).getSingleResult();\n```\n\nAs you can see in the following\
    \ log output, Hibernate persists the Author entity to the author table in the\
    \ bookstore database schema and performs the SELECT statement on the same table.\n\
    \n```\n06:11:42,481 DEBUG [org.hibernate.SQL] - \ninsert\ninto\n  bookstore.author\n\
    \  (firstName, lastName, version, id)\nvalues\n  (?, ?, ?)\n06:11:42,785 DEBUG\
    \ [org.hibernate.SQL] - \nselect\n  author0_.id as id1_,\n  author0_.firstName\
    \ as firstNam2_0_,\n  author0_.lastName as lastName3_0_,\n  author0_.version as\
    \ version4_0_\nfrom\n  bookstore.author author0_\nwhere\n  author0_.firstName='firstName'\n\
    ```\n\n### Source Code\n\nYou can find a project with executable test cases for\
    \ this Hibernate tip in the DefineTableAndSchemaName module of the example project.\
    \ If you haven’t already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n## How to map basic entity attributes to database columns\n\n### Problem\n\n\
    How do I map basic entity attributes to database columns?\n\n### Solution\n\n\
    Hibernate doesn't need any additional information to map entity attributes of\
    \ the following Java types:\n\n- java.lang.String\n- char and java.lang.Character\n\
    - boolean and java.lang.Boolean\n- byte and java.lang.Byte\n- short and java.lang.Short\n\
    - int and java.lang.Integer\n- long and java.lang.Long\n- float and java.lang.Float\n\
    - double and java.lang.Double\n- java.math.BigInteger\n- java.math.BigDecimal\n\
    - java.sql.Timestamp\n- java.sql.Time\n- java.sql.Date\n- java.util.Calendar\n\
    - java.util.Date\n- java.util.Locale\n- java.util.Timezone\n- java.net.URL\n-\
    \ java.sql.Blob\n- java.sql.Clob\n- byte[] and java.lang.Byte[]\n- char[] and\
    \ java.lang.Character[]\n- java.util.UUID\n- java.sql.NCLob\n\nHibernate also\
    \ supports a default mapping for enumerations which doesn't require any additional\
    \ annotations. I get into more detail about that mapping and its customization\
    \ options in How to map an enum to a database column.\n\nSince version 5.0, Hibernate\
    \ also supports the classes of the Date and Time API as basic types:\n\n- java.time.Duration\n\
    - java.time.Instant\n- java.time.LocalDateTime\n- java.time.LocalDate\n- java.time.LocalTime\n\
    - java.time.OffsetDateTime\n- java.time.OffsetTime\n- java.time.ZonedonedDateTime\n\
    \nWhen you don't provide any additional mapping information, Hibernate maps entity\
    \ attributes of these types to database columns with default settings.\n"
  mdcn: "\n\n# 基础映射\n\nHibernate 支持一组标准映射，允许你轻松地将实体属性映射到数据库列。本章中的示例展示了如何对实体属性使用标准映射、映射主键属性、生成唯一主键值以及映射实体之间的关联。你可以在“高级映射”（Advanced\
    \ Mappings）章节中找到更高级的映射定义。\n\n要了解实体属性的标准映射，请参阅：\n\n- 如何定义模式 schema 和表名\n- 如何将基础实体属性映射到数据库列\n\
    - 如何将 util Date 或 Calendar 映射到数据库列\n- 如何将枚举（enum）映射到数据库列\n\n要了解主键属性的映射和唯一主键值的生成，请参阅：\n\
    \n- 如何映射简单主键\n- 如何使用自增列生成主键值\n- 如何使用自定义数据库序列（sequence）生成主键值\n- 如何使用数据库表生成主键值\n\
    - 如何使用生成的 UUID 作为主键\n\n要了解实体之间关联的映射，请参阅：\n\n- 如何映射双向多一关联\n- 如何映射单向多一关联\n- 如何映射单向一对多关联\n\
    - 如何映射双向多多关联\n- 如何映射单向多多关联\n- 如何映射双向一对一关联\n- 如何映射单向一对一关联\n\n## 如何定义 schema 和表名\n\
    \n### 问题\n\n我如何定义 Hibernate 映射实体时数据库模式 schema 和表名？\n\n### 解决方案\n\n你可以通过 `javax.persistence.Table`\
    \ 注解的 **schema** 和 **name** 属性来定义模式和表名。参见下方代码段中的相关示例。你只需要在实体类上添加 @Table 注解并设置\
    \ name 和 schema 属性即可。\n\n```\n@Entity\n@Table(name = \"author\", schema = \"bookstore\"\
    )\npublic class Author {...}\n```\n\n当你使用该实体时，Hibernate 会使用提供的模式和表名来创建 SQL 语句。下面的代码段持久化了一个新的\
    \ **Author** 实体，并执行查询以获取所有具有指定 firstName 的 **Author** 实体。\n\n```\nAuthor a = new\
    \ Author();\na.setFirstName(\"firstName\");\na.setLastName(\"lastName\");\nem.persist(a);\n\
    a = em.createQuery(\n  \"SELECT FROM Author a WHERE firstName = 'firstName'\"\
    ,\n  Author.class).getSingleResult();\n```\n\n正如你在接下来的日志输出所示，Hibernate 将 Author\
    \ 实体持久化到 bookstore 模式下的 author 表中，并在同一表上执行 SELECT 语句。\n\n```\n06:11:42,481 DEBUG\
    \ [org.hibernate.SQL] - \ninsert\ninto\n  bookstore.author\n  (firstName, lastName,\
    \ version, id)\nvalues\n  (?, ?, ?)\n06:11:42,785 DEBUG [org.hibernate.SQL] -\
    \ \nselect\n  author0_.id as id1_,\n  author0_.firstName as firstNam2_0_,\n  author0_.lastName\
    \ as lastName3_0_,\n  author0_.version as version4_0_\nfrom\n  bookstore.author\
    \ author0_\nwhere\n  author0_.firstName='firstName'\n```\n\n### 源代码\n\n你可以在示例项目的\
    \ DefineTableAndSchemaName 模块中找到包含此 Hibernate 提示的可执行测试用例的项目。如果你还没有下载，可以在 http://www.hibernate-tips.com/download-examples\
    \ 下载。\n\n## 如何将基础实体属性映射到数据库列\n\n### 问题\n\n我如何将基础实体属性映射到数据库列？\n\n### 解决方案\n\nHibernate\
    \ 映射以下 Java 类型的实体属性不需要额外信息：\n\n- java.lang.String\n- char and java.lang.Character\n\
    - boolean and java.lang.Boolean\n- byte and java.lang.Byte\n- short and java.lang.Short\n\
    - int and java.lang.Integer\n- long and java.lang.Long\n- float and java.lang.Float\n\
    - double and java.lang.Double\n- java.math.BigInteger\n- java.math.BigDecimal\n\
    - java.sql.Timestamp\n- java.sql.Time\n- java.sql.Date\n- java.util.Calendar\n\
    - java.util.Date\n- java.util.Locale\n- java.util.Timezone\n- java.net.URL\n-\
    \ java.sql.Blob\n- java.sql.Clob\n- byte[] and java.lang.Byte[]\n- char[] and\
    \ java.lang.Character[]\n- java.util.UUID\n- java.sql.NCLob\n\nHibernate 还支持枚举的默认映射，不需要任何额外的注解。我将在“如何将枚举映射到数据库列”中详细介绍该映射及其自定义选项。\n\
    \n从 5.0 版本开始，Hibernate 还支持 Date 和 Time API 的类作为基础类型：\n\n- java.time.Duration\n\
    - java.time.Instant\n- java.time.LocalDateTime\n- java.time.LocalDate\n- java.time.LocalTime\n\
    - java.time.OffsetDateTime\n- java.time.OffsetTime\n- java.time.ZonedonedDateTime\n\
    \n当你不提供额外的映射信息时，Hibernate 会按照默认设置将这些类型的实体属性映射到数据库列。\n\n"
