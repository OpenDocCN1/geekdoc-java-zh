    \ - BookView[id=1,version=0, title=Hibernate Tips, publishingDate=2017-04-04,\
    \ authors=Thorben Janssen]\n```\n\n## Source Code\n\nYou can find a project with\
    \ executable test cases for this Hibernate tip in the DatabaseViews module of\
    \ the example project. If you haven't already done so, you can download it at\
    \ http://www.hibernate-tips.com/download-examples.\n\n## How to define a custom\
    \ enum mapping\n\n## Problem\n\nI need to map enum values from a legacy database\
    \ that don’t match the enum standard mapping.\n\nOr:\n\nI don’t want to face the\
    \ drawbacks of JPA’s standard enum mapping. How do I avoid them?\n\n## Solution\n\
    \nSince JPA 2.1, you can use an AttributeConverter to implement a custom mapping\
    \ for your enums. It allows you to implement the conversion between a Java type\
    \ and its database representation. You can use it to convert all basic attributes\
    \ defined by entity classes, mapped superclasses, or embeddable classes. The only\
    \ exceptions are id attributes, version attributes, relationship attributes and\
    \ attributes annotated as @Temporal or @Enumerated.\n\nIn this example, I define\
    \ a custom mapping for the AuthorStatus enumerations. I want to persist the value\
    \ PUBLISHED as P, SELF_PUBLISHED as S and NOT_PUBLISHED as N.\n\n```java\npublic\
    \ enum AuthorStatus {\n\n    PUBLISHED, SELF_PUBLISHED, NOT_PUBLISHED;\n}\n```\n\
    \nThe implementation of the custom mapping is simple. You just need to implement\
    \ the AttributeConverter interface with its 2 methods convertToDatabaseColumn\
    \ and convertToEntityAttribute. The implementation of these methods is pretty\
    \ simple in this example. The convertToDatabaseColumn uses a switch statement\
    \ to return the String representation of each value. The convertToEntityAttribute\
    \ also uses a switch statement to implement the inverse mapping from the String\
    \ representation to the AuthorStatus enum.\n\nYou also need to annotate the class\
    \ with the @Converter annotation. The auto attribute of the @Converter annotation\
    \ defines if Hibernate shall apply the AttributeConverter to all entity attributes\
    \ of the given type. That is a good approach if you want to define a custom mapping\
    \ for your enum values.\n\nIf you don't want to use the AttributeConverter for\
    \ all entity attributes of AuthorStatus, you can set the autoApply attribute to\
    \ false. You then need to activate the converter for specific attributes. You\
    \ can do that by annotating the entity attribute with a @Convert(converter = AuthorStatusConverter.class)\
    \ annotation that references the class of the AttributeConverter you want to use.\n\
    \n```java\n@Converter(autoApply = true)\npublic class AuthorStatusConverter implements\
    \ AttributeConverter<AuthorStatus, String> {\n\n    @Override\n    public String\
    \ convertToDatabaseColumn(AuthorStatus status) {\n        switch (status) {\n\
    \            case NOT_PUBLISHED:\n                return \"N\";\n\n          \
    \  case PUBLISHED:\n              return \"P\";\n\n            case SELF_PUBLISHED:\n\
    \              return \"S\";\n\n            default:\n              throw new\
    \ IllegalArgumentException(\n                \"AuthorStatus [\"+status+\"] not\
    \ supported.\");\n        }\n    }\n\n    @Override\n    public AuthorStatus convertToEntityAttribute(String\
    \ dbData) {\n      switch (dbData) {\n        case \"N\":\n          return AuthorStatus.NOT_PUBLISHED;\n\
    \        case \"P\":\n          return AuthorStatus.PUBLISHED;\n        case \"\
    S\":\n          return AuthorStatus.SELF_PUBLISHED;\n        default:\n      \
    \    throw new IllegalArgumentException(\n            \"AuthorStatus [\"+dbData+\"\
    ] not supported.\");\n      }\n    }\n}\n```\n\nThe autoApply attribute makes\
    \ this AttributeConverter easy to use. You just need to define an entity attribute\
    \ of type AuthorStatus without @Enumerated annotation, and Hibernate applies the\
    \ conversion automatically.\n\n```java\n@Entity\npublic class Author {\n\n   \
    \ private AuthorStatus status;\n\n    ...\n}\n}\n```\n\n## Source Code\n\nYou\
    \ can find a project with executable test cases for this Hibernate tip in the\
    \ CustomEnumerationsMapping module of the example project. If you haven't already\
    \ done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n## Learn More\n\nJPA and Hibernate also support a standard mapping for enum\
    \ values. You can read more about it in How to map an enum to a database column.\n\
    \nCustom enum mappings are just one use case for an **AttributeConverter**. You\
    \ can also use it to map the classes of Java 8's Date and Time API with older\
    \ Hibernate versions, as I show in How to map the Date and Time API with Hibernate\
    \ 4.4.\n\n## How to map the Date and Time API with Hibernate 4.4\n\n## Problem\n\
    \nHibernate 4.4 doesn’t support the classes of Java 8’s Date and Time API as attribute\
    \ types. How do I persist these classes with Hibernate?\n\n## Solution\n\nSince\
    \ JPA 2.1, you can use an AttributeConverter to easily implement a custom mapping\
    \ for unsupported data types. It allows you to implement the conversion between\
    \ a Java type and its database representation. You can use it to convert all basic\
    \ attributes defined by entity classes, superclasses, or embeddable classes. The\
    \ only exceptions are id attributes, version attributes, relationship attributes\
    \ and attributes annotated as @Temporal or @Enumerated.\n\nThe following code\
    \ snippet shows an AttributeConverter<LocalDate, Date> that converts an entity\
    \ type of java.time.LocalDate to a java.sql.Date to persist in the database. When\
    \ Hibernate reads the database column, it calls the AttributeConverter to transform\
    \ the java.sql.Date into a java.time.LocalDate.\n\nYou just need to implement\
    \ the AttributeConverter interface with its methods convertToDatabaseColumn and\
    \ convertToEntityAttribute. In this example, the implementation of these methods\
    \ is pretty simple. The java.sql.Date class already provides the required methods\
    \ to transform java.time.LocalDate into a java.sql.Date and to a java.time.LocalDate\
    \ from a java.sql.Date.\n\nYou also need to annotate the class with the @Converter\
    \ annotation. Its autoApply attribute defines if Hibernate shall apply the AttributeConverter\
    \ to all entity attributes of the given type. That is a good approach if you want\
    \ to define custom mappings for the classes of the Date and API.\n\nIf you don't\
    \ want to use the AttributeConverter for all entity attributes of LocalDate you\
    \ can set the autoApply attribute to false. You then need to activate the converter\
    \ for specific attributes. You can do that by annotating the entity attribute\
    \ with a @Convert(converter = LocalDateTimeConverter.class) annotation that references\
    \ the class of the AttributeConverter you want to use.\n\n```java\n@Converter(autoApply\
    \ = true)\npublic class LocalDateConverter\n    implements AttributeConverter<LocalDate,\
    \ Date> {\n\n    @Override\n    public Date convertToDatabaseColumn(LocalDate\
    \ attribute) {\n        return Date.valueOf(attribute);\n    }\n\n    @Override\n\
    \    public LocalDate convertToEntityAttribute(Date dbData) {\n        return\
    \ dbData.toLocalDate();\n    }\n}\n```\n\nThe autoApply attribute makes this AttributeConverter\
    \ easy to use. You just need to define an entity attribute of type java.time.LocalDate\
    \ and Hibernate applies the conversion automatically.\n\n```java\n@Entity\npublic\
    \ class Author {\n\n    private LocalDate dateOfBirth;\n\n    ...\n}\n```\n\n\
    ## Source Code\n\nYou can find a project with executable test cases for this Hibernate\
    \ tip in the AttributeConverterForDateTime module of the example project. If you\
