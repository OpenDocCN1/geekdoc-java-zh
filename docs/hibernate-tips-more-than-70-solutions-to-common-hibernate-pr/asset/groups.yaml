    # # How to map a bidirectional many-to-many association


    # ## Problem


    My table contains a many-to-many association. How do I model it with Hibernate
    so that I can navigate it in both directions?


    # ## Solution


    You need to model the association on both entities if you want to be able to navigate
    it in both directions. Let’s have a look at an example. Multiple Authors can write
    multiple books and a book can be written by one or more authors. That’s a typical
    many-to-many association, and you probably want to navigate it in both directions
    in your domain model and queries. You need to model it as a many-to-many association
    on the Book entity and the Author entity.


    | Book | Authors |

    | --- | --- |

    | -Id: Long | -id: Long |

    | @ManyToMany authors: List<Author> | @ManyToMany books: List<Book> |

    | ... | |


    Let’s begin with the Book entity, which is the owning side of the association
    in this example. That means it defines the association and the Author entity just
    references it.


    The relationship definition consists of two mandatory and one optional part. The
    entity attribute List<Author> authors and the @ManyToMany annotation are required.
    The attribute models the association, and the annotation declares the kind of
    relationship. The @JoinTable annotation is optional. It allows you to define the
    name of the join table and foreign key columns that store the many-to-many association.
    I use it in the following code snippet'
