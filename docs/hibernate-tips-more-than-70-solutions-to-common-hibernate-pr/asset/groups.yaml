- md: "\nYou can use Hibernate in several different environments. You can use it as\
    \ a JPA implementation in a Java SE or Java EE environment, as a proprietary persistence\
    \ framework in Java SE or as a persistence provider in Spring. The core Hibernate\
    \ features that I explain in the Hibernate Tips in this book, are available in\
    \ all these environments. The only differences are features that other frameworks\
    \ in your environment provide on top of Hibernate and the bootstrapping mechanism.\n\
    \nYou can find examples for the different bootstrapping approaches in the following\
    \ Hibernate tips:\n\n- How to bootstrap Hibernate in a Java SE environment\n-\
    \ How to bootstrap Hibernate in a Java EE environment\n- How to use Hibernate’s\
    \ native bootstrapping API\n- How to bootstrap Hibernate with Spring Boot\n- How\
    \ to access Hibernate APIs from JPA\n- How to automatically add Metamodel classes\
    \ to your project\n\n## How to bootstrap Hibernate in a Java SE environment\n\n\
    ### Problem\n\nI want to use Hibernate as my JPA provider in a Java SE environment.\
    \ How do I bootstrap Hibernate?\n\n### Solution\n\nBefore you can bootstrap Hibernate\
    \ in your Java SE application, you need to add the required dependencies to your\
    \ classpath. I'm using Hibernate 5.2.8.Final for the examples of this book, and\
    \ the hibernate-core.jar file is the only required Hibernate dependency. The JPA\
    \ jar-file is included as a transitive dependency of hibernate-core.\n\n```\n\
    <dependency>\n  <groupId>org.hibernate</groupId>\n  <artifactId>hibernate-core</artifactId>\n\
    \  <version>5.2.8.Final</version>\n</dependency>\n```\n\nYou also need to add\
    \ a database-specific JDBC driver to the classpath of your application. Please\
    \ check your database documentation for more information.\n\nAfter you've added\
    \ the required dependencies, you can bootstrap Hibernate as is defined in the\
    \ JPA specification. You need to add a persistence.xml file to the META-INF directory\
    \ of your application. The following code snippet shows a simple example of a\
    \ persistence.xml file. It configures a persistence-unit with the name my-persistence-unit.\
    \ It also tells Hibernate to use the PostgreSQLDialect and to connect to a PostgreSQL\
    \ database on localhost. Your configuration might differ if you use a different\
    \ database or a connection pool.\n\n```\n<persistence-unit name=\"my-persistence-unit\"\
    >\n  <description>Hibernate Tips</description>\n  <provider>\n    org.hibernate.jpa.HibernatePersistenceProvider\n\
    \  </provider>\n  <exclude-unlisted-classes>false</exclude-unlisted-classes>\n\
    \n  <properties>\n    <property name=\"hibernate.dialect\"\n      value=\"org.hibernate.dialect.PostgresDialect\"\
    \ />\n\n    <property name=\"java.persistence.jdbc.driver\"\n      value=\"org.postgresql.Driver\"\
    \ />\n    <property name=\"java.persistence.jdbc.url\"\n      value=\"jdbc:postgresql://localhost:5432/recipes\"\
    \ />\n    <property name=\"java.persistence.jdbc.user\"\n      value=\"postgres\"\
    \ />\n    <property name=\"java.persistence.jdbc.password\"\n      value=\"postgres\"\
    \ />\n  </properties>\n</persistence-unit>\n```\n\nYou can then call the createNativeFactory\
    \ of the Persistence class to create an EntityManagerFactory you configured in\
    \ your persistence.xml file. The EntityManagerFactory provides a method to get\
    \ an EntityManager, which I use in most examples in this book. That's all you\
    \ need to bootstrap Hibernate in your application.\n\n```\nEntityManagerFactory\
    \ emf = \n  Persistence.createEntityManagerFactory(\"my-persistence-unit\");\n\
    EntityManager em = emf.createEntityManager();\n```\n\n### Source Code\n\nYou can\
    \ find a project with executable test cases for this Hibernate Tip in the JPABootstra\
    \ module of the example project. If you haven't already done so, you can download\
    \ it at http://www.hibernate-tips.com/download-examples.\n\n### Learn More\n\n\
    JPA also defines a bootstrapping approach for Java EE environments. I explain\
    \ it in How to bootstrap Hibernate in a Java EE environment.\n\nYou can also use\
    \ Hibernate's proprietary bootstrapping API, which gives you access to proprietary\
    \ configuration features. I show you how to do that in How to use Hibernate's\
    \ native bootstrapping API.\n\nIf you want to use Hibernate with Spring Boot,\
    \ take a look at How to bootstrap Hibernate with Spring Boot.\n\n## How to bootstrap\
    \ Hibernate in a Java EE environment\n\n### Problem\n\nI want to use Hibernate\
    \ as my JPA provider in a Java EE environment. How do I bootstrap Hibernate?\n\
    \n### Solution\n\nBootstrapping Hibernate in a Java EE environment is pretty simple.\
    \ You need to make sure that Hibernate is set up in your Java EE application server.\
    \ That's the case if you're using a JBoss Wildfly or JBoss EAP server. Please\
    \ check your application server documentation if you're using a different server.\
    \ Your server might use Hibernate as the JPA implementation or you need to decide\
    \ if you want to replace the existing JPA implementation.\n\nYou can then bootstrap\
    \ Hibernate as it is defined in the JPA specification. You just need to add a\
    \ persistence.xml file to the META-INF directory of a deployment unit. The following\
    \ code snippet shows a simple example of a persistence.xml file that defines the\
    \ persistence-unit-persistence-unit. It tells Hibernate to use the PostgreSQLDialect\
    \ and to connect to a PostgreSQL database on localhost. Your configuration might\
    \ differ if you use a connection pool provided by an application server.\n\n```\n\
    <persistence>\n  <persistence-unit name=\"my-persistence-unit\">\n    <description>Hibernate\
    \ Tips</description>\n    <provider>\n      org.hibernate.jpa.HibernatePersistenceProvider\n\
    \    </provider>\n    <exclude-unlisted-classes>false</exclude-unlisted-classes>\n\
    \    <properties>\n      <property name=\"hibernate.dialect\"\n        value=\"\
    org.hibernate.dialect.PostgresDialect\" />\n\n      <property name=\"java.persistence.jdbc.driver\"\
    \n        value=\"org.postgresql.Driver\" />\n      <property name=\"java.persistence.jdbc.url\"\
    \n        value=\"jdbc:postgresql://localhost:5432/recipes\" />\n      <property\
    \ name=\"java.persistence.jdbc.user\"\n        value=\"postgres\" />\n      <property\
    \ name=\"java.persistence.jdbc.password\"\n        value=\"postgres\" />\n   \
    \ </properties>\n  </persistence-unit>\n</persistence>\n```\n\nThe container creates\
    \ an EntityManagerFactory for each persistence-unit defined in the configuration.\
    \ It also enables you to inject an EntityManager when you need it.\n\n```\n@PersistenceUnit\n\
    private EntityManagerFactory emf;\n\n@PersistenceUnit\nprivate EntityManager em;\n\
    ```\n\n### Learn More\n\nJPA and Hibernate also provide two approaches to bootstrap\
    \ Hibernate in a Java SE environment. I explain them in How to bootstrap Hibernate\
    \ in a Java SE environment and How to use Hibernate’s native bootstrapping API.\n\
    \nIf you want to use Hibernate with Spring Boot, take a look at How to bootstrap\
    \ Hibernate with Spring Boot.\n\n## How to use Hibernate’s native bootstrapping\
    \ API\n\n### Problem\n\nI need more control over Hibernate’s configuration. How\
    \ do I use its native bootstrapping API?\n\n### Solution\n\nHibernate’s native\
    \ bootstrapping API is very flexible, which makes it more complicated to use but\
    \ also more powerful than the JPA API. If you don’t need this flexibility, I recommend\
    \ using the JPA API.\n\nBefore you can start the bootstrapping process, you need\
    \ to add the required dependencies to your classpath. I’m using Hibernate 5.2.8.Final\
    \ for the examples of this book, the hibernate-core.jar file is the only required\
    \ Hibernate dependency. It also includes the JPA-file as a transitive dependency.\n\
    \n```\n<dependency>\n  <groupId>org.hibernate</groupId>\n  <artifactId>hibernate-core</artifactId>\n\
    \  <version>5.2.8.Final</version>\n</dependency>\n```\n\nYou also need to add\
    \ a database-specific JDBC driver to the classpath of your application. Please\
    \ check your database documentation for more information.\n\nAs soon as you add\
    \ the required dependencies, you can implement the bootstrapping process. You\
    \ need to create a StandardServiceRegistry, build a Metadata object, and use that\
    \ object to instantiate a SessionFactory.\n\nHibernate uses two service registries\
    \ --- the BootstrapServiceRegistry and the StandardServiceRegistry. The default\
    \ BootstrapServiceRegistry provides a good solution for most applications, so\
    \ I skip the programmatic definition in this example.\n\nHowever, you need to\
    \ configure the StandardServiceRegistry. In this example, I do that using a `hibernate.cfg.xml`\
    \ file, which makes the implementation easy and allows you to change the configuration\
    \ without changing the source code. Hibernate loads the configuration file automatically\
    \ from the classpath when you call the `configure` method on the StandardServiceRegistryBuilder.\
    \ You can then adapt the configuration programmatically before you call the `build`\
    \ method to get a ServiceRegistry.\n\n```\nServiceRegistry standardRegistry =\n\
    \    new StandardServiceRegistryBuilder()\n    .configure()\n    .build();\n```\n\
    \nThe following code snippet shows an example of a `hibernate.cfg.xml` configuration\
    \ file. It tells Hibernate to use the PostgreSQLDialect and to connect to a PostgreSQL\
    \ database on localhost. It also tells Hibernate to generate the database tables\
    \ based on the entity mappings. Your configuration may differ if you use a different\
    \ database or a connection pool.\n"
