    \ 5.1 版本开始，这不再需要。Hibernate 团队将其核心项目的代码库切换到 Java 8，并在 API 中开始使用 Java 8。\n\n在下面的\
    \ Hibernate 技巧中，我将展示如何使用一些最流行的新数据类型和概念：\n\n- 如何将关联映射到 Optional\n- 如何映射 Java 8\
    \ 日期时间 API 的类\n- 如何将查询结果检索为 Java 8 Stream\n\n# 如何将关联映射到 Optional\n\n# 问题\n\n我如何将可选对一（optional-to-one）关联映射到\
    \ Java 8 的 Optional？\n\n# 解决方案\n\nHibernate 不支持 Optional 作为属性类型。但如果 Hibernate\
    \ 使用字段访问，你可以实现自己的 getter 方法来将属性封装在 `Optional<T>` 中。这为你提供了一个将代表对一关联的属性封装到 Optional\
    \ 中的可选项。你可以在下面的代码段中看到一个示例。\n\n```java\n@Entity\npublic class Book implements Serializable\
    \ {\n\n  ...\n  @ManyToOne\n  @JoinColumn(name=\"publisherid\")\n  private Publisher\
    \ publisher;\n\n  ...\n  public Optional<Publisher> getPublisher() {\n    return\
    \ Optional.ofNullable(this.publisher);\n  }\n\n  public void setPublisher(final\
    \ Publisher publisher) {\n    this.publisher = publisher;\n  }\n\n}\n```\n\n如代码段所示，我在\
    \ `getPublisher` 方法中将 publisher 封装进 Optional，并返回一个 Optional 而不是 Publisher 实体。该方法的调用者会立即看到\
    \ publisher 可能为空，并且她需要处理它。\n\n# 源代码\n\n你可以在示例项目中的 MapOptionalAssociations 模块中找到针对此\
    \ Hibernate 技巧的包含可执行测试用例的项目。如果你还没有下载，可以在 http://www.hibernate-tips.com/download-examples\
    \ 下载它。\n\n# 了解更多\n\nHibernate 5 还对 Optional 和 Stream 等其他功能提供了专有支持。你可以在此处阅读更多相关信息：\n\
    \n- 如何将关联映射到 Optional\n- 如何将查询结果检索为 Java 8 Stream\n\n# 如何映射 Java 8 的日期时间 API 的类\n\
    \n# 问题\n\n我想使用 Java 8 Stream 来处理查询结果。获取查询结果作为 Stream 的最佳方法是什么？\n\n# 解决方案\n\n最明显但不是最高效的方法是在\
    \ List 接口上调用 stream 方法。你可以在下面的代码段中看到示例。我首先调用 Query 接口上的 `getResultList` 方法获取 List\
    \ ，然后调用 List 接口的 stream 方法。\n\n```java\nList<Book> books = session.createQuery(\"\
    SELECT b FROM Book b\", Book.class).getResultList();\nbooks.stream()\n  .map(b\
    \ -> ...)\n```\n\n下表显示了 Hibernate 映射的：\n\n| Java 类型 | JDBC 类型 |\n| :--- | :---\
    \ |\n| java.time.Duration | BIGINT |\n| java.time.Instant | TIMESTAMP |\n| java.time.LocalDate\
    \ | TIMESTAMP |\n| java.time.LocalTime | TIME |\n| java.time.OffsetDateTime |\
    \ TIMESTAMP |\n| java.time.OffsetTime | TIME |\n| java.time.ZonedDateTime | TIMESTAMP\
    \ |\n\n# 如何将可选对一关联映射到 Java 8 Optional\n\n# 问题\n\n我想在领域模型中使用 Optional，但我无法使用 `@Temporal`\
    \ 注解。我该如何映射它们？\n\n# 解决方案\n\n好消息是，自 5 版本以来，使用日期时间 API 无需任何额外的注解。与旧的 `java.util.Date`\
    \ 不同，Hibernate 5 提供了正确的映射。如果你无法使用 5 或不允许使用专有功能，你可以实现一个 `AttributeConverter`，将日期时间\
    \ API 的类转换为支持的 Java 类型。我将在下面的代码向你展示如何这样做：\n\n```java\n@Entity\npublic class Book\
    \ {\n    @Id\n    @GeneratedValue(strategy = GenerationType.AUTO)\n    private\
    \ Long id;\n\n    @Column(name = \"publishing_date\", updatable = false, nullable\
    \ = false)\n    private LocalDate publishingDate;\n\n    ...\n}\n```\n\n"
