    \ Java 类型与其数据库表示之间的转换。你可以用它来转换由实体类、父类或嵌入类定义的所有基本属性。唯一的例外是 id 属性、版本 属性、关联 属性以及标记了\
    \ `@Temporal` 或 `@Enumerated` 注解的属性。\n\n下面的代码显示了一个 `AttributeConverter<LocalDate,\
    \ Date>`，它将 `java.time.LocalDate` 实体类型转换为 `java.sql.Date` 以持久化到数据库。当 Hibernate\
    \ 读取数据库列时，它会调用 `AttributeConverter` 将 `java.sql.Date` 转换为 `java.time.LocalDate`。\n\
    \n你只需要实现 `AttributeConverter` 接口及其方法 `convertToDatabaseColumn` 和 `convertToEntityAttribute`。在示例中，这些方法的实现非常简单。`java.sql.Date`\
    \ 类已经提供了必要的方法来将 `java.time.LocalDate` 转换为 `java.sql.Date` 以及将 `java.sql.Date`\
    \ 转换为 `java.time.LocalDate`。\n\n你还需要在类上加上 `@Converter` 注解。其 `autoApply` 属性定义了\
    \ Hibernate 是否将 `AttributeConverter` 应用于给定类型的所有实体属性。如果你想为这些类定义自定义映射，这是一个很好的方法。\n\
    \n如果你不想对 `LocalDate` 的所有实体属性使用 `AttributeConverter`，可以将 `autoApply` 属性设置为 `false`。然后你需要为特定属性激活转换器。你可以通过在实体属性上使用\
    \ `@Convert(converter = LocalDateTimeConverter.class)` 注解来实现，该注解引用了你想使用的 `AttributeConverter`\
    \ 类。\n\n```java\n@Converter(autoApply = true)\npublic class LocalDateConverter\n\
    \    implements AttributeConverter<LocalDate, Date> {\n\n    @Override\n    public\
    \ Date convertToDatabaseColumn(LocalDate attribute) {\n        return Date.valueOf(attribute);\n\
    \    }\n\n    @Override\n    public LocalDate convertToEntityAttribute(Date dbData)\
    \ {\n        return dbData.toLocalDate();\n    }\n}\n```\n\n`autoApply` 属性使得 `AttributeConverter`\
    \ 易于使用。你只需要定义一个类型为 `java.time.LocalDate` 的实体属性，Hibernate 就会自动应用转换。\n\n```java\n\
    @Entity\npublic class Author {\n\n    private LocalDate dateOfBirth;\n\n    ...\n\
    }\n```\n\n## 源代码 \n\n你可以在示例项目的 AttributeConverterForDateTime 模块中找到包含此 Hibernate\
    \ 技巧的可执行测试用例的项目。如果你还没有下载，可以从 http://www.hibernate-tips.com/download-examples 处下载。\n\
    \n## 了解更多\n\nHibernate 5 支持将日期时间 API 的类作为 `BasicType`。我在[如何映射 Java 8 日期时间 API\
    \ 类]中向你展示如何使用它们。\n\n你还可以使用 `AttributeConverter` 实现自定义枚举映射，正如我在[如何定义自定义枚举映射]中展示的那样。\n\
    \n"
