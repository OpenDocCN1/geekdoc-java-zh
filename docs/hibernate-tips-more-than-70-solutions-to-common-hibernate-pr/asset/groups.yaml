    \ http://www.hibernate-tips.com/download-examples 下载。\n\n# 了解更多信息\n\n如果你在业务逻辑中需要多次调用存储过程，且不需要根据用户输入对其进行调整，那么使用\
    \ `@NamedStoredProcedureQuery` 可能会更好。它与命名的 JPQL 查询类似，允许你通过注解定义存储过程调用，并通过名称对其进行实例化。我会在《如何使用命名查询调用存储过程》中进行更详细的解释。\n\
    \n# 如何使用命名查询调用存储过程\n\n## 问题\n\n我的数据库管理员创建了一个存储过程，我需要在 Java 代码的多个地方调用它。使用 Hibernate\
    \ 实现此点的最佳方法是什么？\n\n## 解决方案\n\n在 JPA 2.0 之前，你必须使用原生 SQL 查询来调用存储过程。在 2.1 版本中，JPA\
    \ 引入了 API 和 `@NamedStoredProcedureQuery` 注解来定义存储过程调用。如果你需要在业务逻辑的多个部分调用存储过程，而不需要根据输入参数进行调整，那么基于注解的方法是更好的解决方案。\n\
    \n以下代码片段展示了 `@NamedStoredProcedureQuery` 定义的示例。\n\n```java\n@NamedStoredProcedureQuery(\n\
    name = \"calculate\",\nprocedureName = \"calculate\",\nparameters = {\n  @StoredProcedureParameter(mode\
    \ = ParameterMode.IN,\n  type = Double.class,\n  name = \"x\"),\n  @StoredProcedureParameter(mode\
    \ = ParameterMode.IN,\n  type = Double.class,\n  name = \"y\"),\n  @StoredProcedureParameter(mode\
    \ = ParameterMode.OUT,\n  type = Double.class,\n  name = \"sum\")\n})\n```\n\n\
    该查询通过输入参数 `x` 和 `y` 以及输出参数 `sum` 调用存储过程 `calculate`。如你所示，每个参数都通过 `@StoredProcedureParameter`\
    \ 注解定义，该注解定义了参数模式及其名称。参数模式指定了参数是作为输入（`ParameterMode.IN`）、输出（`ParameterMode.OUT`）、输入输出（`ParameterMode.INOUT`）还是结果游标（`ParameterMode.REF_CURSOR`）。\n\
    \n这就是定义存储过程调用所需的所有内容。你现在可以在业务代码中使用它了。你只需要向 `EntityManager` 的 `createNamedStoredProcedureQuery`\
    \ 方法提供名称以实例化查询，设置输入参数，执行查询并读取输出参数即可。\n\n```java\n// 实例化 NamedStoredProcedureQuery\n\
    StoredProcedureQuery query =\n  this.em.createNamedStoredProcedureQuery(\"calculate\"\
    );\n```\n\n```java\n// 设置绑定参数值并执行查询\nquery.setParameter(\"x\", 1.23d);\nquery.setParameter(\"\
    y\", 4.56d);\nquery.execute();\n```\n\n```java\n// 读取返回值\nDouble sum = (Double)\
    \ query.getOutputValue(\"sum\");\n```\n\n# 源代码\n\n你可以在示例项目的 `StoredProcedureQuery`\
    \ 模块中找到包含此 Hibernate 技巧的带有可执行测试用例的项目。如果你还没有下载，可以访问 http://www.hibernate.com/download-examples\
    \ 下载。\n\n# 了解更多信息\n\n`@NamedStoredProcedureQuery` 很容易使用，但你无法在运行时对其进行调整。如果你需要更大的灵活性，应该查看\
    \ `StoredProcedureQuery` API。你可以用它在运行时定义存储过程调用，这需要更多代码，但也提供了更大的灵活性。我会在《如何创建即时存储过程调用》中进行解释。\n\
    \n缓存的基本思想非常简单：你将经常使用的实体或查询结果存储在业务层的内存中，而不是数据库。如果操作正确，可以避免大量的数据库请求并提高应用程序的性能。本章中的\
    \ Hibernate 技巧将告诉你如何激活和使用 Hibernate 的二级缓存和查询缓存：\n\n- 如何在二级缓存中存储实体\n- 如何使用查询缓存避免额外的查询\n\
    \n如果你想深入研究这些主题，请查看我的《Hibernate 性能调优在线培训》。它将更详细地介绍 Hibernate 不同缓存的通用概念及其及其陷阱。\n\
    \n# 如何在二级缓存中存储实体\n\n## 问题\n\n我的几个用例从数据库中读取相同的实体且不对它们进行任何更改。我应该如何在我的应用程序中缓存它们，以便\
    \ Hibernate 就不需要总是从数据库中获取它们呢？\n\n## 解决方案\n\n你可以使用 Hibernate 与 Session 无关的二级缓存来缓存被多个\
    \ Hibernate Session 使用的实体。缓存默认是禁用的，你需要设置两个配置参数来激活它：\n\n1. 你需要定义 `shared-cache-mode`。它告诉\
    \ Hibernate 如何选择用于二级缓存的实体。你可以选择：`ALL`（缓存所有实体）、`NONE`（不缓存任何实体）、`ENABLE_SELECTIVE`（选择要缓存的实体）和\
    \ `DISABLE_SELECTIVE`（选择不缓存的实体）。我更倾向于使用 `ENABLE_SELECTIVE`，因为它要求我显式地决定哪些实体被缓存。\n\
    \n2. 你需要通过设置 `hibernate.cache.region.factory_class` 属性指定你想使用的缓存提供者。\n\n以下代码片段显示了带有二级缓存配置的\
    \ `persistence.xml` 文件部分。它使用了 `shared_cache_mode ENABLE_SELECTIVE` 并并将 `EhCache`\
    \ 作为缓存提供者。\n\n```xml\n<persistence>\n  <persistence-unit name=\"my-persistence-unit\"\
    >\n    ...\n    <!-- 启用二级缓存 -->\n    <shared-cache-mode>ENABLE_SELECTIVE</shared-cache-mode>\n\
    \n    <properties>\n      <!-- 配置缓存 -->\n      <property name=\"hibernate.cache.region.factory_class\"\
    \ value=\"org.hibernate.cache.ehcache.EhCacheRegionFactory\"/>\n    </properties>\n\
    \  </persistence-unit>\n</persistence>\n```\n\n如果你使用 `ENABLE_SELECTIVE` 作为你的 `shared-cache-mode`，你需要用\
    \ JPA 的 `@Cacheable` 注解标记想要缓存的实体。\n\n```java\n@Entity\n@Cacheable\npublic class\
    \ Author {\n  ...\n}\n```\n\n如果你使用 `shared_cache_mode DISABLE_SELECTIVE`，也可以使用\
    \ `@Cacheable(false)` 将某个实体排除在缓存之外。\n\n这就是你为应用程序激活二级缓存所需要的所有操作。Hibernate 现在会将你使用过的所有实体存储在二级缓存中。当你下一次使用\
    \ `EntityManager` 的 `find` 方法，或者 Hibernate 需要检索一个实体以初始化关联关系时，它会在执行数据库查询之前尝试从二级缓存中获取它。\n\
    \n> Hibernate 在使用 JPQL 或 Criteria 查询时不会使用二级缓存。\n\n# 源代码\n\n你可以在示例项目的 `2ndLevelCache`\
    \ 模块中找到包含此 Hibernate 技巧的带有可执行测试用例的项目。如果你还没有进行过下载，可以访问 http://www.hibernate-tips.com/download-examples\
    \ 下载。\n\n# 了解更多信息\n\n二级缓存存储实体，而不存储查询结果。如果你想缓存查询结果，可以使用 Hibernate 的查询缓存。我会在《如何使用查询缓存避免额外的查询》中向你展示。\n\
    \n# 如何使用查询缓存避免额外的查询\n\n## 问题\n\nHibernate 不对查询使用一级和二级缓存。是否有方法缓存查询结果？\n\n## 解决方案\n\
    \nHibernate 也支持查询缓存，它存储查询结果。\n\n> 查询结果取决于所执行的 SQL 语句和使用的参数值。因此，缓存针对特定参数集合的查询结果。在决定缓存查询结果之前，确保你经常使用相同的参数值。\n\
    \n如果你识别出一个经常使用相同参数值执行的查询，你需要在 `persistence.xml` 文件中激活查询缓存。通过设置参数 `hibernate.cache.use_query_cache`\
    \ 为 `true` 并定义 `hibernate.cache.region.factory_class` 来实现。\n\n```xml\n<persistence>\n\
    \  <persistence-unit name=\"my-persistence-unit\">\n    ...\n    <properties>\n\
    \      <!-- 配置缓存 -->\n      <property name=\"hibernate.cache.use_query_cache\"\
    \ value=\"true\"/>\n      <property name=\"hibernate.cache.region.factory_class\"\
    \ value=\"org.hibernate.cache.ehcache.EhCacheRegionFactory\"/>\n    </properties>\n\
    \  </persistence-unit>\n</persistence>\n```\n\n"
