    # STORED PROCEDURES


    Stored procedures are a common approach to implement logic in a database. But
    in the past, Hibernate and JPA didn''t support them well. That changed with JPA
    2.1 and the introduction of the @NamedStoredProcedureQuery annotation and the
    StoredProcedureQuery interface. You can now define named queries or create ad-hoc
    queries at runtime to call stored procedures. I show you how to do that in these
    Hibernate tips:


    +   * How to create an ad-hoc stored procedure call

    * How to call a stored procedure with a named query'
  - '[PAGE 252]


    # How to create an ad-hoc stored procedure call


    # Problem


    My database administrator created a stored procedure that I need to call in my
    business code. How do I create an ad-hoc stored procedure call with Hibernate?


    # Solution


    Since JPA 2.1, you can use the createStoredProcedureQuery method of the EntityManager
    to create an ad-hoc stored procedure call.


    If you''re using a Hibernate version older than 4.3 that doesn''t implement JPA
    2.1, you need to use a native SQL query to call the stored procedure.


    The following code snippet shows an example of an ad-hoc stored procedure call.


    ```

    // define the stored procedure

    StoredProcedureQuery query =

    em.createStoredProcedureQuery("calculate");

    query.registerStoredProcedureParameter("x", Double.class, ParameterMode.IN);

    query.registerStoredProcedureParameter("y", Double.class, ParameterMode.IN);

    query.registerStoredProcedureParameter("sum", Double.class, ParameterMode.OUT);


    // set input parameter

    query.setParameter("x", 1.23d);

    query.setParameter("y", 4d);


    // call the stored procedure and get the result

    query.execute();

    Double sum = (Double) query.getOutputValue("sum");

    ```'
  - '[PAGE 253]


    You can split an ad-hoc stored procedure call into three parts. You first need
    to define the stored procedure call, set the input parameters in the second part
    and then call the stored procedure and retrieve its return value in the final
    part.


    Let''s start with the definition of the stored procedure call. You need to call
    the `createStoredProcedureQuery` method of the EntityManager with the name of
    the stored procedure you want to execute. This method returns a `StoredProcedureQuery`
    interface that you can use to define a stored procedure call, set its input parameters
    and call it.


    In this example, I call the stored procedure `calculate`. It''s a simple procedure
    that expects the input parameters `x` and `y` and returns the sum of them. I call
    the `registerStoredProcedureParameter` method of the `StoredProcedureQuery` for
    each of them and register them with their name, type and `ParameterMode`. The
    `ParameterMode` specifies if the parameter is used as an input `(ParameterMode.IN)`,
    input and output `(ParameterMode.INOUT)` or as a result cursor `(ParameterMode.REF_CURSOR)`.


    That''s all you need to to define the stored procedure call. The second and third
    part of an ad-hoc stored procedure call is identical to the execution of a `@NamedStoredProcedureQuery`.


    I set the values for both input parameters by calling the `setParameter` method
    on the `StoredProcedureQuery` interface for each of them. And then I call the
    `execute` and the `getOutputParameterValue` methods to execute the stored procedure
    and to read the return value.'
- md: "\n# Source Code\n\nYou can find a project with executable test cases for this\
    \ Hibernate tip in the StoredProcedureQuery module of the example project. If\
    \ you haven’t already done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n# Learn More\n\nIf you have to call the stored procedure multiple times in your\
    \ business logic and don’t need to adapt it based on user input, it might be better\
    \ to use @NamedStoredProcedureQuery. Similar to a named JPQL query, it allows\
    \ you to define the stored procedure call via annotations and instantiate it by\
    \ its name. I explain it in more detail in How to call a stored procedure with\
    \ a named query.\n\n# How to call a stored procedure with a named query\n\n##\
    \ Problem\n\nMy database administrator created a stored procedure that I need\
    \ to call from multiple places in my Java code. What’s the best way to do that\
    \ with Hibernate?\n\n## Solution\n\nBefore JPA 2.0, you had to use a native SQL\
    \ query to call a stored procedure. In version 2.1, JPA introduced an API and\
    \ the @NamedStoredProcedureQuery annotation to define stored procedure calls.\
    \ The annotation-based approach is the better solution if you have to call the\
    \ stored procedure from multiple parts of your business logic without adapting\
    \ it based on input parameters.\n\nThe following code snippet shows an example\
    \ of a @NamedStoredProcedureQuery definition.\n\n```java\n@NamedStoredProcedureQuery(\n\
    name = \"calculate\",\nprocedureName = \"calculate\",\nparameters = {\n  @StoredProcedureParameter(mode\
    \ = ParameterMode.IN,\n  type = Double.class,\n  name = \"x\"),\n  @StoredProcedureParameter(mode\
    \ = ParameterMode.IN,\n  type = Double.class,\n  name = \"y\"),\n  @StoredProcedureParameter(mode\
    \ = ParameterMode.OUT,\n  type = Double.class,\n  name = \"sum\")\n})\n```\n\n\
    This query calls the stored procedure calculate with the input parameters x and\
    \ y and the output parameter sum. As you can see, each parameter is defined by\
    \ a @StoredProcedureParameter annotation that defines the parameter mode and its\
    \ name. The parameter mode specifies if the parameter is used as an input (ParameterMode.IN),\
    \ output (ParameterMode.OUT), and output (ParameterMode.INOUT) or as a result\
    \ cursor (ParameterMode.REF_CURSOR).\n\nThat's all you need to define the stored\
    \ procedure call. You can now use it in your business code. You just have to provide\
    \ its name to the createNamedStoredProcedure method of the EntityManager to instantiate\
    \ the query, set the input parameters, execute it, and read the output parameter.\n\
    \n```java\n// Instantiated NamedStoredProcedureQuery\nStoredProcedureQuery query\
    \ =\n  this.em.createNamedStoredProcedureQuery(\"calculate\");\n```\n\n```java\n\
    // Set bind parameter values and execute Query\nquery.setParameter(\"x\", 1.23d);\n\
    query.setParameter(\"y\", 4.56d);\nquery.execute();\n```\n\n```java\n// Read return\
    \ value\nDouble sum = (Double) query.getOutputValue(\"sum\");\n```\n\n# Source\
    \ Code\n\nYou can find a project with executable test cases for this Hibernate\
    \ tip in the StoredProcedureQuery module of the example project. If you haven't\
    \ already done so, you can download it at http://www.hibernate.com/download-examples.\n\
    \n# Learn More\n\nA @NamedStoredProcedureQuery is easy to use, but you can't adapt\
    \ it at runtime. If you need more flexibility, you should have a look at the StoredProcedureQuery\
    \ API. You can use it to define a stored procedure call at runtime, which requires\
    \ more code but also provides more flexibility. I explain it in How to create\
    \ an ad-hoc stored procedure call.\n\nThe general idea of caching is pretty simple:\
    \ You store often used entities or query results in the memory of your business\
    \ tier instead of the database. If done correctly, this can avoid a lot of database\
    \ requests and improve the performance of your application. The Hibernate tips\
    \ in this chapter show you how to activate and use Hibernate’s second-level and\
    \ query cache:\n\n- How to store an entity in the second-level cache\n- How to\
    \ use the query cache to avoid additional queries\n\nIf you like to dive deeper\
    \ into these topics, please take a look at my Hibernate Performance Tuning Online\
    \ Training. It gets into lot more details about the general concept of Hibernate’s\
    \ different caches and their pitfalls.\n\n# How to store an entity in the second-level\
    \ cache\n\n## Problem\n\nSeveral of my use cases read the same entities from the\
    \ database without changing them. How do I cache them in my application so that\
    \ Hibernate doesn’t always have to get them from the database?\n\n## Solution\n\
    \nYou can use Hibernate’s session-independent second-level cache to cache entities\
    \ that are used by multiple Hibernate Session. The cache is deactivated by default,\
    \ and you need to set two configuration parameters to activate it:\n\n1. You need\
    \ to define the shared-cache-mode. It tells Hibernate how to select entities for\
    \ the second-level cache. You can choose between ALL to cache all entities, NONE\
    \ to’t cache any entities, ENABLE_SELECTIVE to select the entities that will be\
    \ cached and DISABLE_SELECTIVE to select the entities that will not be cached.\
    \ I prefer ENABLE_SELECTIVE because it requires me to explicitly decide which\
    \ entities are cached.\n\n2. You need to specify the cache provider you want to\
    \ use by setting the hibernate.cache.region.factory_class property.\n\nThe following\
    \ code snippet shows parts of a persistence.xml file with a second-level cache\
    \ configuration. It uses the shared_cache_mode ENABLE_SELECTIVE and EhCache as\
    \ the caching provider.\n\n```xml\n<persistence>\n  <persistence-unit name=\"\
    my-persistence-unit\">\n    ...\n    <!-- enable nd level cache -->\n    <shared-cache-mode>ENABLE_SELECTIVE</shared-cache-mode>\n\
    \n    <properties>\n      <!-- configure caching -->\n      <property name=\"\
    hibernate.cache.region.factory_class\" value=\"org.hibernate.cache.ehcache.EhCacheRegionFactory\"\
    />\n    </properties>\n  </persistence-unit>\n</persistence>\n```\n\nIf you use\
    \ ENABLE_SELECTIVE as your shared-cache-mode, you need to annotate the entities\
    \ you want to cache with JPA @Cacheable.\n\n```java\n@Entity\n@Cacheable\npublic\
    \ class Author {\n  ...\n}\n```\n\nYou can also use @Cacheable(false) to exclude\
    \ an entity from caching if you use shared_cache_mode DISABLE_SELECTIVE.\n\nThat's\
    \ all you need to do to activate the second-level cache for your application.\
    \ Hibernate now stores all entities you've used in the second-level cache. When\
    \ your next use the find method on the EntityManager or when Hibernate needs to\
    \ retrieve an entity to initialize an association, it tries to get it from the\
    \ second-level cache before it performs a database query.\n\n> Hibernate doesn't\
    \ use the second-level cache with a JPQL or Criteria query.\n\n# Source Code\n\
    \nYou can find a project with executable test cases for this Hibernate tip in\
    \ the 2ndLevelCache module of the example project. If you haven't already done\
    \ so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n# Learn More\n\nThe second-level cache stores entities and no query results.\
    \ If you want to cache the result of a query, you can use Hibernate’s Query Cache.\
    \ I show you how in How to use the query cache to avoid additional queries.\n\n\
    # How to use the query cache to avoid additional queries\n\n## Problem\n\nHibernate\
    \ does not use the first- and second-level cache for queries. Is there a way to\
    \ cache the result of a query?\n\n## Solution\n\nHibernate also supports the query\
    \ cache, which stores query results.\n\n> The result of a query depends on the\
    \ executed SQL statement and the used parameter values. The cache, therefore,\
    \ stores the result for a query with a specific set of parameters. Make sure that\
    \ you often use the same parameter values before you decide to cache the result\
    \ of a query.\n\nIf you identify a query that you often execute with the same\
    \ parameter values, you need to activate the query cache in the persistence.xml\
