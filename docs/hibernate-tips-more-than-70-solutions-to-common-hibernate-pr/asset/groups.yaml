  - "[PAGE 91]\n\n# How to define a custom enum mapping\n\n# Problem\n\nI need to\
    \ map enum values from a legacy database that don’t match the enum standard mapping.\n\
    \nOr:\n\nI don’t want to face the drawbacks of JPA’s standard enum mapping. How\
    \ do I avoid them?\n\n# Solution\n\nSince JPA 2.1, you can use an AttributeConverter\
    \ to implement a custom mapping for your enums. It allows you to implement the\
    \ conversion between a Java type and its database representation. You can use\
    \ it to convert all basic attributes defined by entity classes, mapped superclasses,\
    \ or embeddable classes. The only exceptions are id attributes, version attributes,\
    \ relationship attributes and attributes annotated as @Temporal or @Enumerated.\n\
    \nIn this example, I define a custom mapping for the AuthorStatus enumerations.\
    \ I want to persist the value PUBLISHED as P, SELF_PUBLISHED as S and NOT_PUBLISHED\
    \ as N.\n\n```\npublic enum AuthorStatus {\n\n    PUBLISHED, SELF_PUBLISHED, NOT_PUBLISHED;\n\
    }\n```"
  - "[PAGE 92]\n\nThe implementation of the custom mapping is simple. You just need\
    \ to implement the AttributeConverter interface with its 2 methods convertToDatabaseColumn\
    \ and convertToEntityAttribute. The implementation of these methods is pretty\
    \ simple in this example. The convertToDatabaseColumn uses a switch statement\
    \ to return the String representation of each value. The convertToEntityAttribute\
    \ also uses a switch statement to implement the inverse mapping from the String\
    \ representation to the AuthorStatus enum.\n\nYou also need to annotate the class\
    \ with the @Converter annotation. The auto attribute of the @Converter annotation\
    \ defines if Hibernate shall apply the AttributeConverter to all entity attributes\
    \ of the given type. That is a good approach if you want to define a custom mapping\
    \ for your enum values.\n\nIf you don't want to use the AttributeConverter for\
    \ all entity attributes of AuthorStatus, you can set the autoApply attribute to\
    \ false. You then need to activate the converter for specific attributes. You\
    \ can do that by annotating the entity attribute with a @Convert(converter = AuthorStatusConverter.class)\
    \ annotation that references the class of the AttributeConverter you want to use.\n\
    \n```\n@Converter(autoApply = true)\npublic class AuthorStatusConverter implements\
    \ AttributeConverter<AuthorStatus, String> {\n\n    @Override\n    public String\
    \ convertToDatabaseColumn(AuthorStatus status) {\n        switch (status) {\n\
    \            case NOT_PUBLISHED:\n                return \"N\";\n\n```"
