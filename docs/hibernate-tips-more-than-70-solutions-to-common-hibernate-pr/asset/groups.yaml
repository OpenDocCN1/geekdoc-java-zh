    # Problem


    How do I call a database function in a CriteriaQuery?


    # Solution


    The Criteria API supports a set of database functions you can use in your queries.
    You can define function calls with the `CriteriaBuilder`. It provides a method
    for each supported function.


    Table 1. Functions


    | CriteriaBuilder method | Description |

    |---|---|

    | upper(Expression<String> x) | Create an Expression to transform String x to
    upper case |

    | lower(Expression<String> x) | Create an Expression to transform String x to
    lower case |

    | currentDate() | Create an Expression to return the current date of the database
    |

    | currentTime() | Create an Expression to return the current time of the database
    |

    | currentTimestamp() | Create an Expression to return a timestamp of the current
    date and time of the database |

    | substring(Expression<String> s, Expression<Integer> from) | Create an Expression
    to return a substring of the given String |'
