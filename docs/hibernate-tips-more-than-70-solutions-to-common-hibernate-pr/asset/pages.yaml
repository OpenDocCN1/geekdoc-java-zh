  md: '# How to use a custom database sequence to generate primary key values


    # Problem


    Hibernate uses its default database sequence to generate primary key values.

    How do I use my own sequence?


    # Solution


    The JPA specification supports four options to generate primary key values. One
    of them is the GenerationType.SEQUENCE, which uses a database sequence to generate
    primary key values.


    When you want to use a custom database sequence, you have to annotate the primary
    key attribute with the @GeneratedValue annotation and set GenerationType.SEQUENCE
    as the value of the strategy attribute. This tells Hibernate to use a database
    sequence to generate the primary key value. If you don''t provide any additional
    information, Hibernate uses its default sequence, hibernate_sequence.


    You can configure the name and schema of a custom database sequence using a @SequenceGenerator
    annotation. The following code snippet shows an example of such a mapping. The
    @GeneratedValue annotation references a custom generator with the name author_generator.
    This generator gets defined by the @SequenceGenerator annotation, which tells
    Hibernate to use the author_seq database sequence.'
