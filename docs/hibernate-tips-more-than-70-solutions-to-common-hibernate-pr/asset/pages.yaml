- img_proc: true
  md: '# How to create an ad-hoc stored procedure call


    # Problem


    My database administrator created a stored procedure that I need to call in my
    business code. How do I create an ad-hoc stored procedure call with Hibernate?


    # Solution


    Since JPA 2.1, you can use the createStoredProcedureQuery method of the EntityManager
    to create an ad-hoc stored procedure call.


    If you''re using a Hibernate version older than 4.3 that doesn''t implement JPA
    2.1, you need to use a native SQL query to call the stored procedure.


    The following code snippet shows an example of an ad-hoc stored procedure call.


    ```

    // define the stored procedure

    StoredProcedureQuery query =

    em.createStoredProcedureQuery("calculate");

    query.registerStoredProcedureParameter("x", Double.class, ParameterMode.IN);

    query.registerStoredProcedureParameter("y", Double.class, ParameterMode.IN);

    query.registerStoredProcedureParameter("sum", Double.class, ParameterMode.OUT);


    // set input parameter

    query.setParameter("x", 1.23d);

    query.setParameter("y", 4d);


    // call the stored procedure and get the result

    query.execute();

    Double sum = (Double) query.getOutputValue("sum");

    ```'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'You can split an ad-hoc stored procedure call into three parts. You first need
    to define the stored procedure call, set the input parameters in the second part
    and then call the stored procedure and retrieve its return value in the final
    part.


    Let''s start with the definition of the stored procedure call. You need to call
    the `createStoredProcedureQuery` method of the EntityManager with the name of
    the stored procedure you want to execute. This method returns a `StoredProcedureQuery`
    interface that you can use to define a stored procedure call, set its input parameters
    and call it.


    In this example, I call the stored procedure `calculate`. It''s a simple procedure
    that expects the input parameters `x` and `y` and returns the sum of them. I call
    the `registerStoredProcedureParameter` method of the `StoredProcedureQuery` for
    each of them and register them with their name, type and `ParameterMode`. The
    `ParameterMode` specifies if the parameter is used as an input `(ParameterMode.IN)`,
    input and output `(ParameterMode.INOUT)` or as a result cursor `(ParameterMode.REF_CURSOR)`.


    That''s all you need to to define the stored procedure call. The second and third
    part of an ad-hoc stored procedure call is identical to the execution of a `@NamedStoredProcedureQuery`.


    I set the values for both input parameters by calling the `setParameter` method
    on the `StoredProcedureQuery` interface for each of them. And then I call the
    `execute` and the `getOutputParameterValue` methods to execute the stored procedure
    and to read the return value.'
  merge: -1
  pgno: 253
