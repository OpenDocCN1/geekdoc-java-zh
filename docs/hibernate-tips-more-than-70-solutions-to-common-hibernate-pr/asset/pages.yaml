  md: "# How to use the query cache to avoid additional queries\n\n# Problem\n\nHibernate\
    \ does not use the first- and second-level cache for queries. Is there a way to\
    \ cache the result of a query?\n\n# Solution\n\nHibernate also supports the query\
    \ cache, which stores query results.\n\n> The result of a query depends on the\
    \ executed SQL statement and the used parameter values. The cache, therefore,\
    \ stores the result for a query with a specific set of parameters. Make sure that\
    \ you often use the same parameter values before you decide to cache the result\
    \ of a query.\n\nIf you identify a query that you often execute with the same\
    \ parameter values, you need to activate the query cache in the persistence.xml\
    \ file. You do that by setting the parameter hibernate.cache.use_query_cache to\
    \ true and defining a hibernate.cache.region.factory_class.\n\n```\n<persistence>\n\
    \  <persistence-unit name=\"my-persistence-unit\">\n    ...\n    <properties>\n\
    \      <!-- configure caching -->\n      <property name=\"hibernate.cache.use_query_cache\"\
    \ value=\"true\"/>\n      <property name=\"hibernate.cache.region.factory_class\"\
    \ value=\"org.hibernate.cache.ehcache.EhCacheRegionFactory\"/>\n    </properties>\n\
    \  </persistence-unit>\n</persistence>\n```"
  merge: -1
  pgno: 262
- img_proc: true
  md: '```

    </properties>

    </persistence-unit>

    </persistence>

    ```


    You also need to activate caching for the query results you want to cache. You
    can do that by calling the setCacheable method of the Hibernate-specific Query
    interface using the parameter true.


    ```

    Session s = (Session) em.getDelegate();

    Query q = s.createQuery("SELECT a FROM Author WHERE id = :id");

    q.setParameter("id", 1l);

    q.setCacheable(true);

    Author a = q.uniqueResult();

    ```


    Hibernate now stores the result of this query in the query cache. When your next
    use case executes this query, Hibernate checks if the query cache contains a result
    for the given parameter values. If the cache contains a matching record, Hibernate
    gets the query result from there. Otherwise, it executes the query and store its
    result in the cache.


    # Source Code


    You can find a project with executable test cases for this Hibernate tip in the
    QueryCache module of the example project. If you haven''t already done so, you
    can download it at http://www.hibernate-tips.com/download-examples.


    # Learn More


    The query cache stores query results and no entities. If you want to cache entities
    that you often use in your business code, you can use the second-level cache.
    I show you how in How to store an entity in the second-level cache.'
