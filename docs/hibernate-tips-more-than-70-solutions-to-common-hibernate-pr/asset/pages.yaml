  md: 'You can use Hibernate in several different environments. You can use it as
    a JPA implementation in a Java SE or Java EE environment, as a proprietary persistence
    framework in Java SE or as a persistence provider in Spring. The core Hibernate
    features that I explain in the Hibernate Tips in this book, are available in all
    these environments. The only differences are features that other frameworks in
    your environment provide on top of Hibernate and the bootstrapping mechanism.


    You can find examples for the different bootstrapping approaches in the following
    Hibernate tips:


    +   - How to bootstrap Hibernate in a Java SE environment

    - How to bootstrap Hibernate in a Java EE environment

    - How to use Hibernate’s native bootstrapping API

    - How to bootstrap Hibernate with Spring Boot

    - How to access Hibernate APIs from JPA

    - How to automatically add Metamodel classes to your project'
