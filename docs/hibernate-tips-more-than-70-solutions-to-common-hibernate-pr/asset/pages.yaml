  md: "# How to call a user-defined function in a JPQL query\n\n# Problem\n\nHow do\
    \ I call a user-defined database function in the WHERE clause of a JPQL query?\n\
    \n# Solution\n\nJPA 2.1 added the function `function(function_name, function_arg)`\
    \ to JPQL to provide a way to call user-defined and database-specific functions.\
    \ You need to provide the name of the function as the first parameter and you\
    \ can provide additional parameters that will be used as function arguments.\n\
    \nThe following code snippet shows an example that calls the custom database function\
    \ `calculate`. The function returns a `Double` and I provide the `price` of the\
