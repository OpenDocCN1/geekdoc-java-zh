- img_proc: true
  md: 'You need an attribute that models the association, which is the List<Review>
    reviews attribute in this example and a @OneToMany annotation. Like in the table
    model, the bidirectional one-to-many association gets defined on the many side.
    The table on the many side stores the foreign key and its entity defines the association.
    It’s similar for the entity mapping. You just need to reference the name of the
    association attribute of the many side as the value of the mappedBy attribute
    and Hibernate has all the information it needs.


    That''s all you need to do to define a bidirectional many-to-one association.
    You can now navigate it in both directions in your JPQL or Criteria API queries
    or on your domain objects.


    ```

    b = em.find(Book.class, 1L);

    List<Review> reviews = b.getReviews();

    Assert.assertEquals(b, reviews.get(0).getBook());

    ```


    Bidirectional associations are easy to use in queries, but they also require an
    additional step when you persist a new entity. You need to update the association
    on both sides when you add or remove an entity. You can see an example of it in
    the following code snippet, which I first create a Review entity and initialize
    its association to the Book entity. And after that, I also need to add the new
    Review entity to the List of reviews on the Book entity.


    ```

    b = em.find(Book.class, 1L);


    Review r = new Review();

    r.setComment("This is a comment");

    r.setBook(b);


    b.getReviews().add(r);


    em.persist(r);

    ```'
