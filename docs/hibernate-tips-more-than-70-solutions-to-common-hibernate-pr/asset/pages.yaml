    \ column names. The default table name is the combination of both entity names.\
    \ In this example, it would be Book_Author. The foreign key column is generated\
    \ by combining the name of the association mapping attribute and the name of the\
    \ primary key attribute of the entity. These would be books_id and authors_id\
    \ in this example.\n\n```\n@Entity\npublic class Book {\n  @Id\n  @GeneratedValue(strategy\
    \ = GenerationType.AUTO)\n  @Column(name = \"id\", updatable = false, nullable\
    \ = false)\n  private Long id;\n\n  @ManyToMany\n  @JoinTable(\n    name = \"\
    book_author\",\n    joinColumns = { @JoinColumn(name = \"fk_book\") },\n    inverseJoinColumns\
    \ = { @JoinColumn(name = \"fk_author\") }\n  )\n  private List<Author> authors\
    \ = new ArrayList<Author>();\n}\n```\n\nThat's all you need to define a unidirectional\
    \ many-to-many association. You can now navigate it from the Book to the Author\
