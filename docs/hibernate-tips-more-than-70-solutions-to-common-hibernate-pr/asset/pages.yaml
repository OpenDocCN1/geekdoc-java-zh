  md: "# How to bootstrap Hibernate in a Java EE environment\n\n# Problem\n\nI want\
    \ to use Hibernate as my JPA provider in a Java EE environment. How do I bootstrap\
    \ Hibernate?\n\n# Solution\n\nBootstrapping Hibernate in a Java EE environment\
    \ is pretty simple. You need to make sure that Hibernate is set up in your Java\
    \ EE application server. That's the case if you're using a JBoss Wildfly or JBoss\
    \ EAP server. Please check your application server documentation if you're using\
    \ a different server. Your server might use Hibernate as the JPA implementation\
    \ or you need to decide if you want to replace the existing JPA implementation.\n\
    \nYou can then bootstrap Hibernate as it is defined in the JPA specification.\
    \ You just need to add a persistence.xml file to the META-INF directory of a deployment\
    \ unit. The following code snippet shows a simple example of a persistence.xml\
    \ file that defines the persistence-unit-persistence-unit. It tells Hibernate\
    \ to use the PostgreSQLDialect and to connect to a PostgreSQL database on localhost.\
    \ Your configuration might differ if you use a connection pool provided by an\
    \ application server.\n\n```\n<persistence>\n  <persistence-unit name=\"my-persistence-unit\"\
    >\n    <description>Hibernate Tips</description>\n    <provider>\n      org.hibernate.jpa.HibernatePersistenceProvider\n\
    \    </provider>\n    <exclude-unlisted-classes>false</exclude-unlisted-classes>\n\
    ```"
  merge: -1
  pgno: 14
- img_proc: true
