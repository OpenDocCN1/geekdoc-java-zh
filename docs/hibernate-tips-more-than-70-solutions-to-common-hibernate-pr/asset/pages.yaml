  md: '# # How to call a standard function in a JPQL query


    # ## Problem


    How do I call a database function in a JPQL query?


    # ## Solution


    JPQL supports the following set of database functions that you can use in the
    SELECT and WHERE clause of your queries.


    Table 1. JPQL Functions


    | Function | Description |

    | --- | --- |

    | upper(String s) | Transforms String to upper case |

    | lower(String s) | Transforms String to lower case |

    | current_date() | Returns the current date of the database |

    | current_time() | Returns the current time of the database |

    | current_timestamp() | Returns a timestamp of the current date and time of the
    database |

    | substring(String s, int offset, int length) | Returns a substring of the given
    String s |

    | trim(String s) | Removes leading and trailing whitespaces from the given String
    s |

    | length(String s) | Returns the length of the given String s |

    | locate(String search, String s, int offset) | Returns the position of the String
    search in s. The search starts at the position offset |'
