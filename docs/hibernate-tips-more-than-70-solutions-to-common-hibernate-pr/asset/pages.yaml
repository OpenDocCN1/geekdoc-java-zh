  md: "# How to use query comments to identify a query\n\n# Problem\n\nMy application\
    \ performs a lot of similar queries and I need to find the output of a specific\
    \ query in my log file. Is there any way to make it easier to find a specific\
    \ query in the log output?\n\n# Solution\n\nHibernate can add a comment when it\
    \ generates an SQL statement for a JPQL or Criteria query or executes a native\
    \ SQL query. You can see it in your application log file, when you activate SQL\
    \ statement logging and in your database logs.\n\nYou need to activate SQL comments\
    \ by setting the configuration parameter hibernate.use_sql_comments to true. The\
    \ following code snippet shows an example configuration in the persistence.xml\
    \ file.\n\n```\n<persistence>\n  <persistence-unit name=\"my-persistence-unit\"\
    >\n    <description>Hibernate Tips</description>\n    <provider>\n      org.hibernate.jpa.HibernatePersistenceProvider\n\
    \    </provider>\n    <exclude-unlisted-classes>false</exclude-unlisted-classes>\n\
    \    <properties>\n      <property name=\"hibernate.dialect\" value=\"org.hibernate.dialect.PostgreSQLSQLDialect\"\
    \ />\n      <property name=\"hibernate.use_sql_comments\" value=\"true\" />\n\
    \    </properties>\n  </persistence-unit>\n</persistence>\n```"
  merge: -1
  pgno: 170
- img_proc: true
  md: "```\n</properties>\n</persistence-unit>\n</persistence>\n```\n\nWhen you activate\
    \ SQL comments, Hibernate generates a comment for each query. These are often\
    \ not useful to find a specific query. It's better to provide your own comment\
    \ with the org.hibernate.comment hint.\n\nI use it in the following example to\
    \ set the SQL comment for my query to \"This is my comment\".\n\n```\nTypedQuery\
    \ q = em.createQuery(\n  \"SELECT FROM Author a WHERE a.id = :id\",\n  Author.class);\n\
    q.setParameter(\"id\", 1l);\nq.setHint(\"org.hibernate.comment\", \"This is my\
    \ comment\")\nAuthor a = q.getSingleResult();\n```\n\nHibernate adds this comment\
