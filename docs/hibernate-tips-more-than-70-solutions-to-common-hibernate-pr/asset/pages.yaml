  md: '# HIBERNATE SPECIFIC QUERIES AND MAPPINGS


    Most of the Hibernate Tips in this book use features defined by the JPA specification.
    But Hibernate also provides a set of very useful extensions of the standard. The
    most commonly used ones are:


    +   - How to join unassociated entities in a query

    - How to map natural IDs

    - How to load multiple entities by their primary key


    If you''re using Hibernate 5, you should also have a look at the chapter about
    the Java 8 support in Hibernate. It shows some additional extensions to the JPA
    standard.'
