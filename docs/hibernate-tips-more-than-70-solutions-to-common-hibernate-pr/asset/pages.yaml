  md: "# How to count the executed queries in a Session\n\nProblem\n\nSome of my use\
    \ cases are slow and seem to perform too many queries. How do I count all queries\
    \ executed within a Hibernate Session?\n\n# Solution\n\nThe easiest way to count\
    \ all executed queries is to activate Hibernate's statistics component. Hibernate\
    \ then collects a lot of internal statistics and provides them as a log message\
    \ and via the Statistics API.\n\n> Do not use this in production! Collecting the\
    \ statistical information creates an overhead that slows down your application.\n\
    \nHibernate's statistics component is deactivated by default. You can activate\
    \ it by setting the hibernate.generate_statistics parameter to true. You can either\
    \ this by providing a system property with the same name or by setting the parameter\
    \ in the persistence.xml file.\n\n```\n<persistence>\n  <persistence-unit name=\"\
    my-persistence-unit\">\n    <description>Hibernate Tips</description>\n    <provider>\n\
    \      org.hibernate.jpa.HibernatePersistenceProvider\n    </provider>\n    <properties>\n\
    \      <property name=\"hibernate.generate_statistics\" value=\"true\" />\n  \
    \  </properties>\n  </persistence-unit>\n</persistence>\n```"
