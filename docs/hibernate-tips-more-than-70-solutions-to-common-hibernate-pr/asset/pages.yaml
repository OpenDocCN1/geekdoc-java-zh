  md: "This query calls the stored procedure calculate with the input parameters x\
    \ and y and the output parameter sum. As you can see, each parameter is defined\
    \ by a @StoredProcedureParameter annotation that defines the parameter mode and\
    \ its name. The parameter mode specifies if the parameter is used as an input\
    \ (ParameterMode.IN), output (ParameterMode.OUT), and output (ParameterMode.INOUT)\
    \ or as a result cursor (ParameterMode.REF_CURSOR).\n\nThat's all you need to\
    \ to define the stored procedure call. You can now use it in your business code.\
