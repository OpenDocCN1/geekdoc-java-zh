  md: "# How to map natural IDs\n\n# Problem\n\nMy domain model contains several natural\
    \ IDs which I need to use to find objects in my business logic. What's the best\
    \ way to models these IDs with Hibernate?\n\n# Solution\n\nHibernate provides\
    \ proprietary support for natural IDs. It allows you to model them as a natural\
    \ identifier of an entity and provides an additional API for retrieving them from\
    \ the database.\n\nThe only thing you have to do to model an attribute as a natural\
    \ id is to add the @NaturalId annotation to it. If your natural id consists of\
    \ multiple attributes, you have to add this annotation to each of the attributes.\
    \ You can see a simple example of such a mapping in the following code snippet.\
    \ The ISBN number is a common natural id that is often used in the business logic\
    \ to identify a book.\n\n```\n@Entity\npublic class Book {\n\n    @Id\n    @GeneratedValue(strategy\
    \ = GenerationType.AUTO)\n    @Column(name = \"id\", updatable = false, nullable\
    \ = false)\n    private Long id;\n\n    @NaturalId\n    private String isbn;\n\
    \n    ...\n}\n```"
