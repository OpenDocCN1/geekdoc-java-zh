  md: "# How to retrieve a query result as a Java 8 Stream\n\n# Problem\n\nI want\
    \ to use a Java 8 Stream to process the result of a query. What is the best way\
    \ to get a query result as a Stream?\n\n# Solution\n\nThe most obvious but not\
    \ the most efficient approach is to just call the stream method on the List interface.\
    \ You can see an example of it in the following code snippet. I first call the\
    \ getResultList method on the Query interface to get the query result as a List\
    \ and then call the stream method of the List interface.\n\n```\nList<Book> books\
    \ = session.createQuery(\"SELECT b FROM Book b\", Book.class).getResultList();\n\
    books.stream()\n  .map(b -> b.getTitle() + \" was published on \"\n  + b.getPublishingDate())\n\
    \  .forEach(m -> log.info(m));\n```\n\nThat approach might look OK but it has\
    \ a drawback that can create performance issues for huge result sets. In this\
    \ example, Hibernate gets all the selected Book entities from the database, stores\
    \ them in memory, and puts them into a List. Then I call the stream method and\
    \ processes the results by one.\n\nThere is no need to fetch all records of the\
    \ query result at the beginning. For huge result sets it's better to scroll through\
    \ the records and fetch them in smaller chunks."
  merge: -1
  pgno: 160
- img_proc: true
  md: "You might already know the concept from JDBC result sets or Hibernate's ScrollableResults.\
    \ Scrolling through the records of a result set and processing them as a Stream\
    \ are a great fit. Both approaches process one record after the other, and there\
    \ is no need to fetch all of them upfront.\n\nSince Hibernate 5.2, you can do\
    \ exactly that with the stream method of Hibernate's Query interface. It returns\
    \ a Stream of the query result and uses Hibernate's ScrollableResults internally.\
    \ That allows you to scroll through the result set without fetching all records\
    \ in the beginning.\n\n```\nStream<Book> books = session.createQuery(\"SELECT\
    \ b FROM Book Book.class\").stream();\nbooks.map(b -> b.getTitle() + \" was published\
    \ on \" + b.getPublishingDate())\n    .forEach(m -> log.info(m));\n```\n\n# Source\
    \ Code\n\nYou can find a project with executable test cases for this Hibernate\
    \ tip in the ResultsAsStreams module of the example project. If you haven't already\
    \ done so, you can download it at http://www.hibernate-tips.com/download-examples.\n\
    \n# Learn More\n\nHibernate 5 also provides proprietary support for other Java\
    \ 8 features, like Optional and the Date and Time API. You can read more about\
