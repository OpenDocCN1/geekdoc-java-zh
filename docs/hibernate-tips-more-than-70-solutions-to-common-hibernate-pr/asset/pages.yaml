  md: "# How to map an association to an Optional\n\n# Problem\n\nHow do I map an\
    \ optional-to-one association to a Java 8 Optional?\n\n# Solution\n\nHibernate\
    \ does not support Optional as an attribute type. But you can implement your own\
    \ getter method to wrap the attribute in an Optional<T>, if Hibernate uses field\
    \ access. This provides you the option to wrap the attribute which represents\
    \ the to-one association into an Optional. You can see an example of it in the\
    \ following code snippet.\n\n```\n@Entity\npublic class Book implements Serializable\
    \ {\n\n  ...\n  @ManyToOne\n  @JoinColumn(name=\"publisherid\")\n  private Publisher\
    \ publisher;\n\n  ...\n  public Optional getPublisher() {\n    return Optional.ofNullable(this.publisher);\n\
    \  }\n\n  public void setPublisher(final Publisher publisher) {\n    this.publisher\
    \ = publisher;\n  }\n\n}\n```"
