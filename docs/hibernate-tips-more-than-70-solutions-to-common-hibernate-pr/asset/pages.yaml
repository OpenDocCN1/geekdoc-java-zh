  md: "# How to join unassociated entities in a query\n\n# Problem\n\nJPQL requires\
    \ a mapped association to join two entities. Is there any other option to join\
    \ unassociated entities in a query?\n\n# Solution\n\nHibernate extends JPQL's\
    \ limited join feature with the proprietary support for joins of unassociated\
    \ entities. You can see an example of such a JOIN clause in the following code\
    \ snippet.\n\n```\nQuery q = em.createQuery(\"SELECT b.title, count(r.id) \" \n\
    + \"FROM Book b JOIN Review r ON r.fkBook = b.id \" \n+ \"GROUP BY b.title\");\n\
    Object[] r = (Object[]) q.getSingleResult();\n```\n\nHibernate uses the same syntax\
    \ as you probably know from SQL. You reference the two entities you want to join\
    \ and the kind of join you want to perform. Hibernate supports an inner JOIN,\
    \ a LEFT outer join and a RIGHT outer join. You also need to define a join condition\
    \ in the ON clause of the JOIN clause.\n\nThe previous code snippet shows an inner\
    \ join of all Book and Review entities so that I can count the number of reviews\
    \ for each book. When you execute this query, Hibernate transforms the JPQL JOIN\
    \ clause into a similar looking SQL clause.\n\n```\n19:48:12,518 DEBUG [org.hibernate.SQL]\
    \ -\nselect\nbook_.title as col_0_0_,\ncount(review1_.id) as col_1_0_\n```"
