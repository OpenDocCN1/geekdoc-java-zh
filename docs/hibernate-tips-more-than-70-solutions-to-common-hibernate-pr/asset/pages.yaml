  md: "# How to use a generated UUID as a primary key\n\n# Problem\n\nI want to use\
    \ a UUID as a primary key. How do I map them with Hibernate? Can Hibernate generate\
    \ UUID values for new entities?\n\n# Solution\n\nHibernate provides proprietary\
    \ support for attributes of type java.util.UUID as primary keys and offers two\
    \ generators to create UUID values. The generators support the standards IETF\
    \ RFC 4122 version 4 and IETF RFC 4122 version 1.\n\nIETF RFC 4122 version 4 ---\
    \ Random number-based UUID\n\nBy default, Hibernate uses a random number-based\
    \ generation strategy. As always, you don't have to do much to get the default\
    \ behavior. You just need to add a @GeneratedValue annotation to a primary key\
    \ attribute of type java.util.UUID.\n\nYou can see an example of it in the following\
    \ code snippet.\n\n```\n@Entity\npublic class Author {\n\n    @Id\n    @GeneratedValue\n\
    \    @Column(name = \"id\", updateable = false, nullable = false)\n    private\
    \ UUID id;\n\n    ...\n}\n```"
