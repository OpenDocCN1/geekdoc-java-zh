  md: "# # How to reference entity attributes in a type-safe way\n\n# ## Problem\n\
    \nReferencing entity attributes by their name is error-prone and makes the code\
    \ hard to refactor. How do I reference an attribute in a type-safe way so that\
    \ I don't run into problems when I have to change its name?\n\n# ## Solution\n\
    \nI prefer to use the JPA Metamodel to reference entity attributes in a type-safe\
    \ way. The metamodel consists of a generated class for each managed class in the\
    \ persistence unit. These classes are stored in the same package and have the\
    \ name as the corresponding managed classes with an added \"_\" at the end.\n\n\
    The only thing you have to do to generate these classes is to add a dependency\
    \ to Hibernate's Static Metamodel Generator to your build process like I do in\
    \ the following Maven pom.xml file.\n\n```\n<project>\n  <modelVersion>4.0.0</modelVersion>\n\
    \n  <dependencies>\n    <dependency>\n      <groupId>org.hibernate</groupId>\n\
    \      <artifactId>hibernate-jpamodelgen</artifactId>\n    </dependency>\n   \
    \ ..\n  </dependencies>\n\n  ..\n</project>\n```"
  merge: -1
  pgno: 247
- img_proc: true
  md: "Hibernate generates the Metamodel classes with each Maven build and stores\
    \ them in the target/generated-sources/annotations folder of your project.\n\n\
    Let's have a look at an example of a Metamodel class. The first code snippet shows\
    \ the Book entity that you know from most examples in this book. The second one\
    \ shows the generated metamodel class Book_.\n\n```\n@Entity\npublic class Book\
    \ {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.AUTO)\n    private\
    \ Long id;\n\n    @Version\n    private int version;\n\n    private String title;\n\
    \n    private Double price;\n\n    @Temporal(TemporalType.DATE)\n    private Date\
    \ publishingDate;\n\n    @ManyToOne\n    @JoinColumn(name=\"publisherid\")\n \
    \   private Publisher publisher;\n\n    @ManyToMany\n    @JoinTable(name=\"BookAuthor\"\
    ,\n        joinColumns={\n            @JoinColumn(name=\"bookId\", referencedColumnName=\"\
    id\")),\\n        inverseJoinColumns={\n            @JoinColumn(name=\"authorId\"\
    , referencedColumnName=\"id\")\n        })\n    private Set<Author> authors =\
    \ new HashSet<Author>>();\n```"
  merge: -1
  pgno: 248
- img_proc: true
  md: "...\n}\n\n```\n@Generated(\n    value=\"org.hibernate.jpamodelgen.JPAMetaAModelEntityProcessor\"\
    )\n@StaticMetamodel(Book.class)\npublic abstract class Book_ {\n\n    public static\
    \ volatile SingularAttribute<Book, Double> price;\n    public static volatile\
    \ SingularAttribute<Book, Publisher> publisher;\n    public static volatile SingularAttribute<Book,\
    \ Long> id;\n    public static volatile SingularAttribute<Book, String> title;\n\
    \    public static volatile SingularAttribute<Book, Date> publishingDate;\n  \
    \  public static volatile SingularAttribute<Book, Integer> version;\n    public\
    \ static volatile SetAttribute<Book, Author> authors;\n\n}\n```\n\nAs you can\
    \ see, the generated class Book_ has a static attribute for each attribute of\
    \ the Book entity. You can use it to reference the entity attribute in a type-safe\
    \ way. I do that in the following code snippet to reference the title and publishingDate\
    \ attribute of the Book entity in a CriteriaQuery.\n\n```\n// Define CriteriaQuery\n\
    CriteriaBuilder cb = em.getCriteriaBuilder();\nCriteriaQuery<Tuple> cq = cb.createTupleQuery();\n\
    Root<Book> root = cq.from(Book.class);\n\n// Use metamodel to reference attributes\n\
    cq.multiselect(root.get(Book_.title), root.get(Book_.publishingDate));\n\n// Execute\
    \ Query\nList<Tuple> results = em.createQuery(cq).getResultList();\n```"
