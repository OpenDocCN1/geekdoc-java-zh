    \ />\n  <property name=\"javax.persistence.jdbc.url\"\n    value=\"jdbc:postgresql://localhost:5432/recipes\"\
    \ />\n  <property name=\"javax.persistence.jdbc.user\"\n    value=\"postgres\"\
    \ />\n  <property name=\"javax.persistence.jdbc.password\"\n    value=\"postgres\"\
