  md: "# How to automatically add Metamodel classes to your project\n\n# Problem\n\
    \nI use Hibernate’s Static Metamodel Generator to generate the JPA Metamodel.\n\
    These classes are generated to a different directory, which isn’t used as a source\
    \ folder. There is a way to automatically register this folder as a source folder?\n\
    \n# Solution\n\nDuring my research, I learned from Frits Walraven that there is\
    \ a Maven plugin that can do exactly that. Special thanks to Frits, who also reviewed\
    \ this book.\n\nThe only thing you need to do is to add the following Maven plugin\
    \ to your build configuration. It registers a list of directories as additional\
    \ source folders. I use it in the parent pom.xml file of my project to add the\
    \ directory, to which the JPA Metamodel classes get generated (target/generated-sources/annotations),\
    \ as a source folder.\n\n```\n<project>\n  <build>\n    <plugins>\n      <plugin>\n\
    \        <groupId>org.codehaus.mojo</groupId>\n        <artifactId>build-helper-maven-plugin</artifactId>\n\
    \        <version>3.0.0</version>\n        <executions>\n          <execution>\n\
    \            <id>add-source</id>\n            <phase>generate-sources</phase>\n\
    \          </execution>\n        </executions>\n      </plugin>\n    </plugins>\n\
    </build>\n</project>\n```"
  merge: -1
  pgno: 24
- img_proc: true
  md: "```\n<goals>\n  <goal>add-source</goal>\n</goals>\n<configuration>\n  <sources>\n\
    \    <source>target/generated-sources/annotations</source>\n  </sources>\n</configuration>\n\
