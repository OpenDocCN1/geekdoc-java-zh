  md: '# How to map classes of Java 8’s Date and Time API


    # Problem


    I want to use the Date and Time API in my domain model but I can''t annotate them
    with JPA’s @Temporal annotation. How do I use the new classes with Hibernate?


    # Solution


    The good news is, since Hibernate 5, you don’t need any additional annotations
    to map classes of the Date and Time API. If you’re using an older Hibernate version
    you need to implement your own mapping. I show you how to do that in How to map
    the Date and Time API with Hibernate 4.4.


    Hibernate 5 supports the classes of the Date and Time API as BasicType. In contrast
    to the old java.util.Date, the classes of the Date and Time API provide all information
    Hibernate needs to map them to the correct JDBC types. The following table shows
    to which JDBC types Hibernate maps the new Java classes.


    Table 1. JDBC Mappings


    | Java type | JDBC type |

    | --- | --- |

    | java.time.Duration | BIGINT |

    | java.time.Instant | TIMESTAMP |

    | java.time.LocalDate | TIMESTAMP |

    | java.time.LocalTime | DATE |'
