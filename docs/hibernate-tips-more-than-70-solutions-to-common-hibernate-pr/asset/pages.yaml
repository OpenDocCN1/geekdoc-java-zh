  md: "# How to map a view with Hibernate\n\n# Problem\n\nI have a read-only view\
    \ that I want to use in associations and JPQL queries. How do I map it with Hibernate?\n\
    \n# Solution\n\nDatabase views, in general, are mapped in the same way as database\
    \ tables. You just have to define an entity that maps the view with the specific\
    \ name and one or more of its columns.\n\nBut the normal table mapping is not\
    \ read-only, and you can use the entity to change its content.\n\nDepending on\
    \ the database you use and the definition of the view, you're not allowed to perform\
    \ an update on the view content. You should therefore prevent Hibernate from updating\
    \ it.\n\nYou can easily achieve that by annotating your entity with Hibernate’s\
    \ @Immutable annotation.\n\n```\n@Entity\n@Immutable\npublic class BookView {\n\
    \  @Id\n@GeneratedValue(strategy = GenerationType.AUTO)\n@Column(name = \"id\"\
    , updatable = false, nullable = false)\nprivate Long id;\n  @Version\n@Column(name\
    \ = \"version\")\n```"
