    \ {\n    public static final String QUERY_SELECT_BY_ID =\n        \"Book.selectById\"\
    ;\n    public static final String PARAM_ID = \"id\";\n\n    ...\n}\n```\n\nThe\
    \ @NamedQuery annotation requires two parameters: The name and the JPQL query\
    \ String. As you can see, I use a static String as the name of the query and the\
    \ bind parameter. That makes it easier to reference them in the business logic."
