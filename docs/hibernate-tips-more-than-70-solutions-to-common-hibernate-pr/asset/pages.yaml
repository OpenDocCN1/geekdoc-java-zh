  md: "# How to call a stored procedure with a named query\n\n# Problem\n\nMy database\
    \ administrator created a stored procedure that I need to call from multiple places\
    \ in my Java code. What’s the best way to do that with Hibernate?\n\n# Solution\n\
    \nBefore JPA 2.0, you had to use a native SQL query to call a stored procedure.\
    \ In version 2.1, JPA introduced an API and the @NamedStoredProcedureQuery annotation\
    \ to define stored procedure calls. The annotation-based approach is the better\
    \ solution if you have to call the stored procedure from multiple parts of your\
    \ business logic without adapting it based on input parameters.\n\nThe following\
    \ code snippet shows an example of a @NamedStoredProcedureQuery definition.\n\n\
    ```\n@NamedStoredProcedureQuery(\nname = \"calculate\",\nprocedureName = \"calculate\"\
    ,\nparameters = {\n  @StoredProcedureParameter(mode = ParameterMode.IN,\ntype\
    \ = Double.class,\nname = \"x\"),\n  @StoredProcedureParameter(mode = ParameterMode.IN,\n\
    type = Double.class,\nname = \"y\"),\n  @StoredProcedureParameter(mode = ParameterMode.OUT,\n\
    type = Double.class,\nname = \"sum\")\n})\n```"
  merge: -1
