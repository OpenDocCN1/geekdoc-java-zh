  md: '# How to map an enum to a database column


    # Problem


    How do I map an enum attribute to a database column? Which option should I choose?


    # Solution


    JPA and Hibernate provide two standard options to map an enum to a database column.
    You can use either the String representation or the ordinal value.


    Both approaches have their drawbacks:


    +   - The String representation is verbose, and renaming an enum value requires
    that you also update your database.


    +   - The ordinal of an enum value is its position in the enum declaration. This
    value changes and requires you to update your database when you remove an existing
    value or do not add new values to the end of the enum declaration.


    You have to decide which drawback is the lesser evil for your specific application
    or use an AttributeConverter to define a custom mapping to avoid these issues.


    When you use the JPA and Hibernate standard mapping, you can either rely on the
    default mapping of its ordinal value or specify the mapping approach. You can
    do that with an @Enumerated annotation.


    The following examples use the AuthorStatus enum. This enum indicates if an author
    published a book with a publisher, self-published, or is still writing a'
