    # Learn More


    If you have to call the stored procedure multiple times in your business logic
    and don’t need to adapt it based on user input, it might be better to use @NamedStoredProcedureQuery.
    Similar to a named JPQL query, it allows you to define the stored procedure call
    via annotations and instantiate it by its name. I explain it in more detail in
    How to call a stored procedure with a named query.'
