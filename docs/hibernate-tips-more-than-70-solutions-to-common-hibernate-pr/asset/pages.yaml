  md: '# How to load multiple entities by their primary key


    # Problem


    I need to load multiple entities by their primary key. Is there an easier way
    to do that writing a JPQL query?


    # Solution


    Loading multiple entities by their primary keys is a very common use case. Since
    version 5.1, Hibernate offers a proprietary API that makes it a lot easier to
    load multiple entities and provides additional benefits, like fetching huge lists
    in multiple batches.


    You just need to call the byMultipleIds(Class entityClass) method on the Hibernate
    Session and provide the class of the entities you want to load as a parameter.
    You then get a typed instance of the MultiIdentifierLoadAccess interface. You
    can use it to load multiple entities at once and to configure the database interaction.


    ```

    MultiIdentifierLoadAccess<Book> multi =

    session.byMultipleIds(Book.class);

    List<Book> books = multi.multiLoad(1L, 2L, 3L);

    ```


    The call of the multiLoad method in this example loads the Book entities with
    the given primary keys. Hibernate creates one query for this method call and provides
    the three primary keys as parameters to an IN statement.


    ```

    06:25:30,202 DEBUG [org.hibernate.SQL] -

    select

    book0_.id as id1_0_0_,

    ```'
  merge: -1
