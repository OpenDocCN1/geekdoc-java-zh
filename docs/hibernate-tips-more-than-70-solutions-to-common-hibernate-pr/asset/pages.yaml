  md: 'Hibernate is one of the most popular Java Persistence API (JPA) implementations
    and also one of the most popular Java Object Relational Mapping (ORM) frameworks
    in general. It helps you to map your domain model to database tables and automatically
    generate SQL statements to update the database on object state transitions. That
    is a complex task, Hibernate makes it look easy. You just annotate your domain
    classes, and Hibernate takes care of the rest. Or, it at least seems like that
    in the beginning.


    When you’ve used Hibernate for a while, you begin to recognize that you need to
    do more than just add an @Entity annotation to your domain model classes. Real-world
    applications often require advanced mappings, complex queries, custom data types,
    and caching.


    Hibernate can do all of it. You just have to know which annotations and APIs to
    use. The acute need for this knowledge prompted me to write the Hibernate Tips
    series on my Thoughts on Java blog in 2016. In this book, you’ll find more than
    35 exclusive tips and the most popular tips from the blog.'
  merge: -1
