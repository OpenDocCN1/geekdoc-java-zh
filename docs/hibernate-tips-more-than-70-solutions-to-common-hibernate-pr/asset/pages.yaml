  md: "# How to bootstrap Hibernate with Spring Boot\n\n# Problem\n\nHow do I use\
    \ Hibernate in my Spring Boot application?\n\n# Solution\n\nSpring Boot makes\
    \ it extremely easy to bootstrap Hibernate. You just need to add the Spring Boot\
    \ JPA starter to your classpath, and Spring Boot handles the bootstrapping for\
    \ you.\n\n```\n<dependency>\n  <groupId>org.springframework.boot</groupId>\n \
    \ <artifactId>spring-boot-starter-data-jpa</artifactId>\n</dependency>\n```\n\n\
    You also need to add a database-specific JDBC driver to the classpath of your\
    \ application. Please check your database documentation for more information.\n\
    \nYou define your data source with a few properties in the application.properties\
    \ file. The following configuration defines a data source that connects to a PostgreSQL\
    \ database on localhost.\n\n```\nspring.datasource.url = jdbc:postgresql://localhost:5432/recipes\n\
    spring.datasource.username = postgres\nspring.datasource.password = postgres\n\
    ```\n\nIf you add an H2, HSQL, or Derby database on the classpath, you can safely\
    \ omit the configuration, and Spring Boot starts and connects to an in-memory\
    \ database. You can also add multiple JDBC drivers and an in-memory database to\
    \ your classpath and use different configurations for different target environments."
