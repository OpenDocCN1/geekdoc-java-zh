  md: '# Who this book is for


    This book is for developers who are already working with Hibernate and who are
    looking for solutions for their current development tasks or problems. The tips
    are designed as self-contained recipes that provide specific solutions and can
    be accessed as needed. Most tips contain links to related tips that you can follow
    if you want to dive deeper into a topic or need a slightly different solution.
    There is no need to read the tips in a specific order. Feel free to read the book
    from cover to cover or just pick the tips that help you in your current project.


    To get the most out of this book, you should already be familiar with the general
    concepts of JPA and Hibernate. You''re in the right place if you are looking for
    tips on how to use Hibernate to implement your business requirements. I don’t
    explain Hibernate’s general concepts, and therefore this book is not intended
    for beginners. But, if you’re already familiar with ORM frameworks and like to
    learn by doing, you may find this example-based approach helpful.'
