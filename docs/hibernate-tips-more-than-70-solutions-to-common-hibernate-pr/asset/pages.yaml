  md: '# FOREWORD


    Undoubtedly, Hibernate ORM and JPA have a steep learning curve. You develop a
    quick prototype, add a few annotations to your Java classes and everything just
    works — things seem easy. But, as you try to tackle complex mappings or resolve
    performance problems, you quickly realize that you need a deeper understanding
    of Hibernate to implement a complete and efficient database access layer.


    How do you obtain this deeper understanding? The Hibernate documentation is useful,
    and we always suggest that users read it all. But, that is a daunting task because
    the documentation contains a lot of content. Also, the structure of the documentation
    is to describe individual parts of the solutions. However, object/relational mapping
    is a very complex concept --- it is simply not feasible for a manual to cover
    all combinations that are often needed to solve real-world problems and implement
    real-world use cases.


    For example, you might not remember the combination of annotations needed to define
    a specific mapping idea, or you''re just wondering how to implement a specific
    use case. You need a recipe or a quick tip on how to implement the task you''re
    currently working on. For such cases, users have many options to find solutions
    including Hibernate’s blogs, its user forums, its IRC channels, HipChat rooms,
    StackOverflow, and so on. Another great resource are the'
  merge: -1
  pgno: 3
- img_proc: true
  md: 'numerous books using Hibernate. Additionally a number of blogs exist, dedicated
    to using Hibernate by community experts --- long-time Hibernate power users. Many
    of these community expert blogs focus on showing how to use Hibernate''s existing
    features and annotations to implement specific use cases or how to research solving
    performance problems.


    Thorben has been part of this community expert group for a long time, helping
    Hibernate users via his blog posts, articles, and various forums. And now he has
    written a book. And, as always, Thorben has a lot of great Hibernate insight to
    share. This is the first book on Hibernate I have seen that takes an FAQ-style
    approach, which is an unusual structure. Other books on Hibernate, as well as
    the Hibernate documentation itself, take the same basic approach to teaching ---
    they explain the individual pieces in detail, sequentially. While this is valuable
    (and I''d argue critical) knowledge, it is often hard for new users to apply this
    sequential, segmented knowledge to resolve more complex topics.


    The FAQ approach makes it easier for users to find help on common higher-level
    concepts and topics. Both forms of knowledge are useful in learning Hibernate.
    Together with the other listed resources, this book will be a great addition to
    every developer’s Hibernate toolbox.


    Steve Ebersole


    Lead Developer - Hibernate ORM


    Principal Software Engineer - Red Hat, Inc.'
