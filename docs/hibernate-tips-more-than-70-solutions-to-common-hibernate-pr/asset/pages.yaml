  md: '# How to map an inheritance hierarchy to multiple tables


    # Problem


    My database contains multiple tables that I want to map to an inheritance hierarchy
    of entities. How do I define such a mapping?


    # Solution


    JPA and Hibernate support different inheritance strategies that allow you to map
    the entities to different table structures. The **MappedSuperclass** approach
    and the strategies **TablePerClass** and **Joined** map an inheritance hierarchy
    of entities to multiple tables. Each of them maps the entities to a different
    table structure with its advantages and disadvantages. You need to decide for
    your particular use case which approach you want to use.


    Let''s take a look at the entity model that I use in all examples of this Hibernate
    tip before I show you the different inheritance strategies. **Authors** can write
    different kinds of **Publications**, like **Books** and **BlogPosts**. The **Publication**
    class is the super class of the **Book** and **BlogPost** classes.'
  merge: -1
  pgno: 127
