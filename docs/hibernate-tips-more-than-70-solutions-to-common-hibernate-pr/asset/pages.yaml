  md: "# How to select multiple scalar values in a CriteriaQuery\n\n# Problem\n\n\
    How do I select a list of scalar values in a Criteria query?\n\n# Solution\n\n\
    You can select multiple scalar values using the multiselect method of the CriteriaQuery\
    \ interface. The following code snippet shows an example of such a query.\n\n\
    ```\n// Prepare query\nCriteriaBuilder cb = em.getCriteriaBuilder();\nCriteriaQuery<Tuple>\
    \ q = cb.createTupleQuery();\nRoot<Author> author = q.from(Author.class);\n\n\
    // Select multiple scalar values\nq.multiselect(\n  author.get(Author_.firstName).alias(\"\
    firstName\"),\n  author.get(Author_.lastName).alias(\"lastName\")\n);\n```\n\n\
    The definition of the CriteriaQuery follows the same approach as you use to select\
    \ entities.\n\nYou first need to get a CriteriaBuilder instance from the EntityManager.\
    \ It's a factory class that helps you to define different parts of your query,\
    \ like bind parameters, function calls, and predicates.\n\nYou then create a CriteriaQuery\
    \ instance by calling the createTuple method of the CriteriaBuilder. The CriteriaQuery\
    \ is the root of the object graph that represents your query."
