  md: '# What you get in this book


    More than 70 Hibernate tips show you how to solve different problems with Hibernate.
    Each of these tips consists of one or more code samples and an easy-to-follow
    procedure. You can also download an example project with executable test cases
    for each Hibernate tip. I recommend downloading this project before you start
    reading the book so that you can try each Hibernate tip when you read it.


    To help you find the tip for your development task, I grouped them into the following
    chapters:


    +   - I show you how to bootstrap Hibernate in different execution environments
    in the Setting up Hibernate chapter.


    +   - In the Basic Mappings chapter, I introduce you to basic attribute mappings
    that allow you to use Hibernate’s standard mappings to map an entity to a database
    table.


    +   - The tips in the Advanced Mappings chapter show you some of Hibernate’s advanced
    features and how you can use them for things like defining custom mappings for
    unsupported data types, mapping of read-only database views, defining derived
    primary keys, and mapping of inheritance hierarchies.


    +   - Hibernate implements the JPA specification, but it also provides several
    proprietary features. I show you some of them in the Hibernate Specific Queries
    and Mappings chapter.


    +   - Java 8 introduced several new APIs and programming concepts. Since version
    5, you can use them with Hibernate. I show you a few examples in the Java 8 chapter.'
  merge: -1
  pgno: 6
- img_proc: true
  md: '+   Logging is an important topic that gets ignored in a lot of projects. You
    should always make sure that Hibernate logs useful information during development
    and doesn''t slow down your application in production. I give you several configuration
    tips in the Logging chapter.


    +   The tips in the JPQL chapter show you how to use JPA’s query language to read
    from the database and how you can use it to update or delete multiple entities
    at once.


    +   If your queries are too complex for JPQL, take a look at the Native SQL Queries
    chapter, which shows how to perform native SQL queries with Hibernate.


    +   The Criteria API provides another option to create database queries. It is
    especially useful if you need to create queries programmatically. I show you several
    examples using this API in the Create queries programmatically with the Criteria
    API chapter.


    +   In the Stored Procedures chapter, I explain how you can use the @NamedStoredProcedureQuery
    annotation and the StoredProcedureQuery interface to execute stored procedures
    in your database.


    +   Caching can be an effective approach to improve the performance of your application.
    I show you how to activate and use Hibernate’s second-level and query cache in
    the Caching chapter.'
