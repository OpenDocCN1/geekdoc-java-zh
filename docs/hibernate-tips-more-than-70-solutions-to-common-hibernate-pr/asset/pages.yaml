  md: '# How to access Hibernate APIs from JPA


    # Problem


    I’m using Hibernate via the EntityManager API. Is there a way to access the proprietary
    Hibernate Session and SessionFactory?


    # Solution


    Since version 2.0, JPA provides easy access to the APIs of the underlying implementations.
    EntityManager and EntityManagerFactory provide an unwrap method, which returns
    the corresponding classes of the JPA implementation. In Hibernate’s case, Session
    and SessionFactory give you full access to proprietary Hibernate features, such
    as the support for Streams and Optional.


    The following code snippet shows you how to get the Hibernate Session from EntityManager.
    You just need to call the unwrap method on EntityManager and provide the Session
    class as a parameter.


    ```

    Session session = em.unwrap(Session.class);

    ```


    As you can see in the next code snippet, you can get Hibernate SessionFactory
    in a similar way. You first get EntityMangerFactory from EntityManager and then
    call the unwrap method with the SessionFactory class.


    ```

    SessionFactory sessionFactory = em.getEntityManagerFactory().unwrap(SessionFactory.class);

    ```'
  merge: -1
  pgno: 22
