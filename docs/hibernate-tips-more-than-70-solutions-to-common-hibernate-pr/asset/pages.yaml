  md: '# How to log SQL statements and their parameters


    # Problem


    How do you configure Hibernate so that it writes the executed SQL statements and
    used bind parameters to the log file?


    # Solution


    Hibernate uses two different log categories and log levels to log the executed
    SQL statements and their bind parameters:


    +   The SQL statements are written as DEBUG messages to the category org.hibernate.SQL.

    The bind parameter values are logged to the org.hibernate.type.descriptor.sql
    category with log level TRACE.


    You can activate and deactivate them independently of each other in your log configuration.


    > Logging all SQL queries and their bind parameter bindings can slow down your
    application and create huge log files. You shouldn''t activate these log messages
    in production.


    The following code snippet shows an example of a log4j configuration which activates
    both of them.'
