  md: "You need to annotate a primary key attribute of type java.util.UUID with @GeneratedValue\
    \ annotation that references a custom ID generator by its name. The ID generator\
    \ defines the strategy Hibernate uses to generate the primary key value. You can\
    \ define it with Hibernate’s @GenericGenerator annotations. It requires the name\
    \ of the generator, the name of the class that implements the generator strategy,\
    \ and an additional @Parameter annotation. In this case, the generator is implemented\
    \ by the org.hibernate.id.UUIDGenerator class. That is the same generator that\
    \ Hibernate uses by default to generate UUIDs. You need to tell it to use a different\
    \ generation strategy. You can do that using the @Parameter annotation. You need\
    \ to set the name to uuid_gen_strategy_class and provide the fully qualified class\
    \ name of the CustomVersionOneStrategy class as the value.\n\n```\n@Entity\npublic\
    \ class Book {\n  @Id\n  @GeneratedValue(generator = \"UUID\")\n  @GenericGenerator(\n\
    \    name = \"UUID\",\n    strategy = \"org.hibernate.id.UUIDGenerator\",\n  \
    \  parameters = {\n      @Parameter(\n        name = \"uuid_gen_strategy_class\"\
    ,\n        value = \"org.hibernate.id.uuid.CustomVersionOneStrategy\"\n      )\n\
    \    }\n  )\n  @Column(name = \"id\", updatable = false, nullable = false)\n \
    \ private UUID id;\n```"
