  md: '# How to cache preprocessed, non-persistent attributes


    # Problem


    I often use a value that gets calculated based on an entity attribute, like the
    age of a person. How do I cache this calculated attribute in the entity without
    storing it in the database?


    # Solution


    There are different ways to provide a calculated value to the user of the entity:


    +   1. You can use a @Formula to provide an SQL expression that returns the value.

    2. You can use field access and calculate the value in a getter method.

    3. You can use a transient entity attribute that stores the calculated value without
    persisting it in the database.


    I already explained option 1 in How to calculate entity attributes with a @Formula.
    Here, I focus on options 2 and 3.


    # Calculate the value in a getter method


    Option 2 is easy to implement. When you use field access, you can add additional
    getter methods to your entity. You can for example, add a getAge() method that
    calculates and returns the age of the Author.


    This approach requires you to calculate the value for each call of the getAge()
    method. It is, therefore, not a good solution for complex calculations that you
    need to perform often.'
