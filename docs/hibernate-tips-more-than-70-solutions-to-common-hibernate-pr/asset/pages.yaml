    a type-safe way to create a query and supports the same features as JPQL.


    > Hibernate''s proprietary Criteria API is deprecated. You should use JPA''s Criteria
    API instead.


    The following code snippet shows the definition of a CriteriaQuery, which selects
    all Books written by an Author with a given first and last name.


    You first need to get a CriteriaBuilder instance from the EntityManager. It''s
    a factory class that helps you to define different parts of your query, like bind
    parameters, function calls, and predicates.


    You then create a CriteriaQuery instance that is the root of the object graph
    that represents your query. I recommend providing the return type of your query
    as a parameter to the createQuery method. It creates a typed instance of the CriteriaQuery
    interface. I want to select Book entities in this example, and therefore, provide
    Book.class as the parameter.'
