  md: "# How to bootstrap Hibernate in a Java SE environment\n\n# Problem\n\nI want\
    \ to use Hibernate as my JPA provider in a Java SE environment. How do I bootstrap\
    \ Hibernate?\n\n# Solution\n\nBefore you can bootstrap Hibernate in your Java\
    \ SE application, you need to add the required dependencies to your classpath.\
    \ I'm using Hibernate 5.2.8.Final for the examples of this book, and the hibernate-core.jar\
    \ file is the only required Hibernate dependency. The JPA jar-file is included\
    \ as a transitive dependency of hibernate-core.\n\n```\n<dependency>\n  <groupId>org.hibernate</groupId>\n\
    \  <artifactId>hibernate-core</artifactId>\n  <version>5.2.8.Final</version>\n\
    </dependency>\n```\n\nYou also need to add a database-specific JDBC driver to\
    \ the classpath of your application. Please check your database documentation\
    \ for more information.\n\nAfter you've added the required dependencies, you can\
    \ bootstrap Hibernate as is defined in the JPA specification. You need to add\
    \ a persistence.xml file to the META-INF directory of your application. The following\
    \ code snippet shows a simple example of a persistence.xml file. It configures\
    \ a persistence-unit with the name my-persistence-unit. It also tells Hibernate\
    \ to use the PostgreSQLDialect and to connect to a PostgreSQL"
  merge: -1
  pgno: 11
- img_proc: true
  md: "database on localhost. Your configuration might differ if you use a different\
    \ database or a connection pool.\n\n```\n<persistence-unit name=\"my-persistence-unit\"\
    >\n  <description>Hibernate Tips</description>\n  <provider>\n    org.hibernate.jpa.HibernatePersistenceProvider\n\
    \  </provider>\n  <exclude-unlisted-classes>false</exclude-unlisted-classes>\n\
    \n  <properties>\n    <property name=\"hibernate.dialect\"\n      value=\"org.hibernate.dialect.PostgresDialect\"\
    \ />\n\n    <property name=\"java.persistence.jdbc.driver\"\n      value=\"org.postgresql.Driver\"\
    \ />\n    <property name=\"java.persistence.jdbc.url\"\n      value=\"jdbc:postgresql://localhost:5432/recipes\"\
    \ />\n    <property name=\"java.persistence.jdbc.user\"\n      value=\"postgres\"\
    \ />\n    <property name=\"java.persistence.jdbc.password\"\n      value=\"postgres\"\
    \ />\n  </properties>\n</persistence-unit>\n```\n\nYou can then call the createNativeFactory\
    \ of the Persistence class to create an EntityManagerFactory you configured in\
    \ your persistence.xml file. The EntityManagerFactory provides a method to get\
    \ an EntityManager, which I use in most examples in this book. That's all you\
    \ need to bootstrap Hibernate in your application.\n\n```\nEntityManagerFactory\
    \ emf = \n  Persistence.createEntityManagerFactory(\"my-persistence-unit\");\n\
    EntityManager em = emf.createEntityManager();\n```"
