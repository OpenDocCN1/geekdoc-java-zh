  md: '# How to map an unidirectional many-to-many association


    # Problem


    My table model contains a many-to-many association. I only need to navigate in
    one direction. How do I model that with Hibernate?


    # Solution


    You only need to model the association on the entity from which you want to navigate
    the relationship. Let''s have a look at an example. Multiple Authors write multiple
    books, and a book can be written by one or more authors. That''s a typical many-to-many
    association. If you only want to navigate it from the Book to the Author entities,
    you only need to model it as a many-to-many association on the Book entity.


    | Book | Authors |

    |---|---|n| -Id id: Long | -id: Long |

    | -ManyToMany authors: List<Author> | ... |


    The relationship definition consists of two mandatory and one optional part. The
    entity attribute List<Author> authors and the @ManyToMany annotation are required.
    The attribute models the association, and the annotation declares the kind of
    relationship. The @JoinTable annotation is optional. It allows you to define the
    name of the join table and foreign key columns store the many-to-many association.
    I use it in the following code snippet to set the name of the join table to book_author
    and the names of the foreign key columns to fk_book and fk_author.'
