    He said: ‘She was a lovely little ship and of course all the people of Hexham
    and Northumberland had paid for her and adopted her. She had a very interesting
    career, but when she was sunk two thirds of the crew were lost. Out of those that
    did survive there were a number that died back on shore. When I went overboard
    I took off all of my heavy clothing, including my boots. But when I was found
    they recognised me straight away – still had my Navy cap on. It was the last thing
    I thought about taking off!’


    Engineer `Ron` told how the incident was a remarkable coincidence after `Tynedale`
    had opened fire against the same U-boat about eighteen months earlier and thought
    they had sunk it, which was not the case. The U-boat exacted its revenge on `Tynedale`
    but was in turn sunk by allied forces the following day. But the war was between
    countries, not individuals, and captain of the `U-593` `Gerd Kelbling`, who survived
    the sinking, and `Ron` exchanged Christmas cards for many years after the war.


    ## Local War Efforts


    While `Hexham` had `HMS Tynedale`, `Haltwhistle` had its own Warship Week to raise
    £52,000 to sponsor the trawler minesweeper `HMS Hornpipe` and succeeded in bringing
    in over £86,000, while `Prudhoe` had to raise £15,000 to equip a motor launch,
    and in fact raised £37,700. The North Tyne district was charged with raising £40,000
    to adopt and equip the trawler minesweeper `HMS Birdlip`, and succeeded in bringing
    in £65,000, representing in the region of £10 per head of the population.


    ## Stories from the Middle East


    As the tide of the war started to turn, in the Middle East, a `Hexham` soldier’s
    medical skills were given as the reason for his being kept prisoner by the Germans
    while others of his unit were turned loose by their German captors. Corporal `Leonard
    C.B. Ward`, the son of well known solicitor `Septimus G. Ward`, was captured by
    the Germans during a battle in the Middle East. A colleague wrote to his sister
    that during the battle Corporal `Ward` had behaved in an exemplary manner, showing
    an entire disregard for danger. He said:


    ‘When resistance was no longer possible, and we were surrounded, he remained calm,
    and as soon as his captors allowed, he proceeded to attend to the wounded, both
    British and German.


    I am convinced he saved the lives of at least two men, by his prompt action performed
    under very intense fire, and it was this very humane work which was responsible
    for him remaining a prisoner. When the Germans found they were losing the battle,
    they released us, no doubt on the grounds that we would be a hindrance to them
    in their withdrawal. However, Corporal `Ward` was kept by the enemy, and I can
    only supposed the reason was to look after the enemy wounded.’


    ![Image](Images/f0114-01.jpg)


    Somehow finding time for football in Western Desert are men of the `Recce Regiment`,
    `Royal Northumberland Fusiliers`, as they prepared to go into Libya. The picture
    was taken by Captain `Lionel Stephenson` of `Hexham`, who had been killed in action
    two months before the picture was published, Fusilier `Matt Young` (back row,
    second left) of `Hexham`, was subsequently taken prisoner, while Company Sergeant
    Major `David Forster` (back row, third from right), also of `Hexham`, was killed
    in action on 17 July and is buried in Tripoli.


    ## Home Front and Accidents


    As a housing crisis gripped the district, `Prudhoe UDC` wrote to the `Ministry
    of Health` with a view to reopening some houses that had been deemed unfit for
    human inhabitation before the conflict. Town vicar Councillor the `Rev. R.E. Robson`
    said more and more people were being crowded into the district, but there was
    not so much accommodation as an empty soap box available to them.


    Two men were killed when the tank on which they were riding overturned when it
    failed to negotiate an S-bend on `Bewclay Bank`, near `Stagshaw`. They were engine
    fitter `Ronald Crole`, of `Littlehoughton`, `Alnwick`, and mechanical examiner
    `Edward Nettleton`, of `Newcastle`. The driver, tank tester `Oliver Richardson`
    of `Blaydon`, escaped with cuts and bruises.


    ## The broadcaster Romany


    More than 1,000 schoolchildren packed into the `Central Methodist Hall` in `Hexham`
    to hear a nature talk, illustrated by blackboard sketches, delivered by legendary
    broadcaster `Romany` of the `BBC`. He began his talk by apologising for the absence
    of his famous spaniel `Raq` and explained: ‘With the shortage of petrol, I am
    not able to use a car, and if I take `Raq` on the crowded buses people clamber
    in on his feet, which he does not like, so I have had to leave him at home.’


    `Romany` was the first ever wildlife broadcaster and had an immense following
    as he wandered the country in his gypsy caravan, pulled by his horse `Comma`,
    and his two young companions `Muriel` and `Doris`. In real life, `Romany` was
    Methodist minister the `Rev. George Bramwell Evens`, most famous for his `Out
    with the Romany` programmes (later `Out with Romany`), which started in 1933 on
    the `BBC`’s `Children’s Hour`. His posts included a twelve-year spell at the `Methodist
    Central Hall, Carlisle`.


    ### RAF hero taken prisoner


    In May 1942 `Hexham` held its breath when local hero Pilot Officer `Arthur Garwell`DFM`
    was reported missing following the famous low-level raid by `Lancaster` bombers
    on the `M.A.N.` diesel factory at Augsburg in southern Germany – and there was
    a sigh of relief when it was confirmed he had been taken prisoner after making
    a perfect crash landing in his burning `Lancaster` after being hit by shellfire
    over the target.


    ![Image](Images/f0115-01.jpg)


    Pilot Officer `Arthur John Garwell` of `Oakwood`, who was awarded the `Distinguished
    Flying Medal` after completing thirty bombing raids over enemy territory.


    `Garwell` was the epitome of the dashing ‘Brylcreem Boys’ of the RAF. Born in
    February 1920, he enlisted in the `Air Force Volunteer Reserve` in May 1939 and
    after gaining his wings was posted to `83 Squadron`, a `Hampden` unit operating
    out of `Scampton`, in September 1940. Between then and March 1941, `Garwell` completed
    a full tour of operations, more often than not attacking well-defended German
    targets – thus a brace of trips to `Berlin`, `Cologne`, and no less than three
    outings to `Hamburg`, `Wilhelmshaven`.


    Unusually, too, he flew a night-fighter sortie over `Birmingham` in December 1940.
    On the night of 22-23 December he was compelled to divert to `Emden` from `Dessau`
    – and made a forced-landing on his return as a result of near-empty fuel tanks.
    He was posted as an instructor to `No.25 OTU` at `Finningley` and awarded the
    `DFM`.


    `Garwell` joined the `Intensive Flying (Lancaster) Flight` at `Boscombe Down`
    in November 1941, at which establishment he flew on occasion as second pilot to
    Squadron Leader `J.D. Nettleton`. By April 1942 he had become Nettleton’s right-hand
    man. On the way out to dispersal in a squadron truck for the `Augsburg Raid`,
    the pair of them agreed that they would not take evasive action if attacked by
    fighters, but rather hold their course. `Garwell` said: ‘The only thing to do
    is press straight on and keep flat on the ground. If anyone gets crippled I suggest
    he throttles back and belly-lands straight ahead.’


    During the daring daylight hedge-hopping raid, the `Lancasters` were attacked
    by waves of German fighters and of his group, `Garwell` was the only one to reach
    the target and unleash his four 1,000lb bombs. No sooner had he done so than he
    was hit by anti-aircraft fire. What happened next is recounted in `Ralph Barker`’s
    book `Strike Hard, Strike Sure`:


    ```

    As Garwell heard Flux, his wireless operator, yelling in his ear. “We’re on fire!”
    Flux kept pointing over his shoulder, and Garwell took a quick look behind him.
    The armour-plated door leading into the fuselage was open and the interior was
    a mass of flames. “Shut the door!” ordered Garwell who decided to crash-land at
    once rather than attempt to climb and bale out. Five of the crew had crowded into
    the front cockpit but there were still two more men behind the wall of fire.

    ```

