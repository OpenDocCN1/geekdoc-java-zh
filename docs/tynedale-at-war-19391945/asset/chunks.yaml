    They received a great welcome, Europeans and natives alike lining the harbour
    and shouting: ‘Long Live England!’ Mr Rowlands said the men had come through their
    ordeal remarkably well, apart from suffering from exposure and sunburn eating
    into their salt-caked skin. He said: ‘It was quite exciting and an interesting
    experience, but one of these is sufficient for a lifetime.’


    The first bombing raid on the Allen Valleys was recorded on the night of Saturday,
    26 April 1941, shortly before midnight. A single Luftwaffe bomber, apparently
    lost, roamed the skies above Tynedale for some time, scattering bombs seemingly
    at random. In the Allen Valleys the aircraft dropped 200 incendiaries on open
    ground between High Acton and Knockshield Farms, and a further 50 between Thornley
    Gate and Bishopfield, none of which caused any casualties. Later, four of the
    containers which had held the incendiaries in the aircraft were also found in
    the area.


    Former Allendale resident and centenarian Allen Smith remembered his uncle’s reaction
    to the bombing. ‘The night they dropped the bombs, my uncle – Everest Charlton
    from Burnfoot near Sinderhope – heard the explosions and got his double-barrelled
    gun out because he thought the Germans were coming. He sat with his wife and the
    gun and he was going to shoot the first German to come up the garden path – it’s
    lucky that no-one walked by that night!’


    Another raid took place in the Allen Valleys later in 1941, on Sunday, 12 October.
    Several German bombers, returning from a raid on Manchester, chose the Tyne Gap
    as their return route, which was often used in raids on Merseyside and Clydeside.
    At 10.51pm a lights warning was issued in the North East, followed by the sirens
    at 11.05pm. Although there was no air-raid siren in Allendale or Allenheads during
    the war, there were several in the district, including one at Hexham which was
    just audible on a quiet night across the ’Dale.


    At 11.25pm an aircraft released a single bomb which landed in a quarry one mile
    west of Allendale on Oustley Farm, Keenley. It was a very large bomb and it made
    a crater 30ft in diameter and 20ft deep. The blast caused slight damage to windows
    and a door at the farm. Former Allendale resident June Walker was only three when
    war broke out, but she can remember her father taking her to see the damage caused
    by the bomb. ‘I remember going to see the bomb crater because my father was in
    the Home Guard and he took me along to see it,’ she said.


    ## War Weapons Week


    The Tynedale district, saving at the rate of £1,000 per day via the National Savings
    Movement, had already contributed more than half a million pounds to the war effort
    since hostilities broke out, as well as raising £5,000 to buy its Spitfire. However
    the district prepared to do even more when a War Weapons Week was planned from
    26 April to 3 May 1941 with a target of a staggering £60,000 in seven days. It
    was stated that every sixpence raised would buy a heavy machine gun bullet and
    would therefore be another nail in Hitler’s coffin.


    ![Image](Images/f0079-01.jpg)


    Scores of Hexham businesses supported the Hexham and District War Weapons Week
    in the spring of 1941.


    ![Image](Images/f0080-01.jpg)


    A packed Hexham Market place at the launch of Hexham War Weapons Week by Lord
    Eustace Percy.


    The War Department’s shopping list ranged from £8m for a battleship to £3m for
    an aircraft carrier to £4 10s for a Webley pistol and 4s for a hand grenade –
    not to mention those sixpenny machine gun bullets.


    The week began with a parade from Dene Park rugby field in the east of the town
    to the Market Place, where a vast crowd welcomed the turnout of soldiers, the
    Home Guard, the Auxiliary Fire Service, Red Cross Detachment, the ARP and other
    Civil Defence personnel, headed by a military band. Taking the salute was Brigadier
    General Sir Loftus Bates who was accompanied by Brigadier General Edward Riddell.
    Addressing the crowd, War Weapons Week organiser Lord Eustace Percy said that
    the war was costing £50m per week and this sort of money could not be raised by
    taxation alone. Additional voluntary contributions were required in the form of
    savings which could be redeemed once the war was over.


    It soon became clear that the target was a deliberately modest one because on
    the very first day of the campaign £90,856 was raised, with the town’s banks –
    Barclays, Midland, Lloyds, Martins, and the National Provincial – alone pledging
    £10,000 each.


    Four days into the campaign, the total stood at in excess of £150,000 and the
    final total was £236,959 19s 11d – almost four times the target – which earned
    a warm thank you letter from Chancellor of the Exchequer, Sir Kingsley Wood. Chairman
    of the Hexham and District War Weapons Committee Anthony Emerson added: ‘It shows
    that the Heart of All England is as sound and loyal as ever.’


    A forestry worker from Otterburn, John Walton (25) was fined £5 by Bellingham
    Magistrates for failing to register under the National Service Act of 1939\. He
    told the court he had not registered because he was a conscientious objector,
    who felt that the war was ‘entirely unnecessary’. He refused to pay the fine and
    when he asked what the alternative was, he was told by the chairman of the bench
    Major G.D. Anderson: ‘There is no alternative; you will be forced to pay the fine
    and given a month to do so. Your personal views on the subject do not affect us.
    The National Service Act is just much the law of the land as any other law, and
    you know perfectly well you failed to comply with that law.’


    Walton did not pay the fine and was brought back to court two months later, when
    he told the bench he still had no intention of paying the fine. He was sent to
    prison for a month and told the court: ‘It does not matter if it is six months
    or six years; it is immaterial.’


    Air raid precautions continued to occupy local authorities, with Hexham UDC applying
    to the Ministry of Home Security for a grant towards the provision of home air
    raid shelters. Councillor H.H. Darlington said that while Hexham had some excellent
    public air raid shelters, very few people used them ‘because they were unwilling
    to leave a warm bed to go into the shelters at night’.


    There was grave dissatisfaction at Haydon Bridge at the method of raising the
    alarm when enemy aircraft threatened, which involved the chief air raid warden
    Mr E. Kirsopp running round the village knocking on the doors of his wardens.
    Appeals to the Northumberland Air Raid Committee for an air raid siren had repeatedly
    been turned down, even though a siren cost just £20\. A local councillor asked
    ‘Is it not time we ended this farce and told the county council not to be so niggardly
    in its interpretation of air raid precautions?’


    The German nation was vilified by Judge John Richardson when he addressed a smoking
    concert arranged by the Corbridge branch of the British Legion. He said: ‘It’s
    all very well to say nice things about the German people, but I have never met
    a nice German – certainly not when I was in Germany in 1938\. There can be no
    good in people who show such slavish devotion to people of the Hitler type and
    temperament. People of that kind are not to be trusted for the sake of Europe,
    and Germany has to be kept down for all time.’

