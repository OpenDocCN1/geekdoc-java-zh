  trans: '

    由于入侵威胁无处不在，泰因代尔（Tynedale）的居民被警告要加强灯管制措施，违反灯管制条例的标准罚款已从 12 先令 6 便士增加到更昂贵的 2 英镑。公众还被警告要严肃地对待防空警报。北方地区专员亚瑟·兰伯特爵士（Sir
    Arthur Lambert）表示：“有相当一部分公众似乎没有意识到炸弹爆炸的风险，这种爆炸可能在防空警报后几乎立即发生。许多人聚集在自己房屋的门窗前。许多人来到户外，甚至还带着他们的孩子。被炸弹直接命中的几率很小，但爆炸后的碎片可以在
    70-80 码的范围内造成可怕的伤害。”


    人们还被警告要服从部署在地区各敏感地点的哨兵的指示。J·麦维卡尔·蒙罗（Major J. MacVicar Munro）少将警告道：“我们正处于战争中，这些哨兵被警告要阻止靠近哨所的人，如果不听从命令就开火。你是一个忠诚臣民，你可能在执行某个完全忠诚的任务，哨兵是并不知道的。最近有一个人认为哨兵命令他停下是在开玩笑，在受到第二次警告时仍继续开车移动，直到一把刺刀刺穿了他的前轮胎才停下来。聋哑人士在没有朋友陪同的情况下，不应接近任何守卫点。”


    人们对赫克斯姆（Hexham）市政学校防空避难所的有效性提出了质疑，并向当局投诉，称在最近一次演习中，避难所的通风不足，导致孩子们几乎窒息。许多孩子还因为避难所内极度炎热而导致严重的头痛。解释是门必须锁紧，否则无法隔挡毒气。


    户主还被警告要节约用水用于消防，并禁止洗车、浇灌花园或冲洗小路和院子。


    为了支持战争努力，一项决定在北部一个著名的风景胜地之一——贝灵汉（Bellingham）的哈雷肖林林（Hareshaw Linn）砍伐树木。贝灵汉农村地区委员会主席
    T·辛普森（T. Simpson）议员表示，他已经检查了通往壮丽瀑布的林地山谷，并表示这是一个非常漂亮的地方——它看起来非常美丽，我们不得不破坏它真是件遗憾。”尽管如此，他们仍决定砍伐溪流南侧所有的橡树和软木，留下一窄窄的树带以尽可能保持树林的美观。


    ## 军人勋章与更多伤亡


    回到前线，一名来自福尔斯通斯（Fourstones）的 20 岁掷枪兵成为该地区首位因英勇受勋的军士。皇家诺坎伯郡陆掷枪兵团的克里斯托弗·威尔逊（Private
    Christopher Wilson）下士因在 5 月 21 日在阿拉斯（Arras）表现出非凡的英勇被授予军人勋章，当时他用他的反坦克炮击毁了两辆坦克，并持续射击直到炮筒炸裂。


    从海峡彼岸传来的噩耗不断，米克利（Mickley）的步兵威廉·沃克（William Walker）的家人被告知他在战斗中阵亡——恰好是其父亲在索姆战役战死的纪念日。服役于皇家诺坎伯郡陆掷枪兵团的来自贝灵汉的埃德温·约翰逊（Edwin
    Johnson）中尉也被报告失踪。他是一位著名的运动员，曾帮助泰因代尔橄榄球俱乐部在 1935 年和 1936 年获得诺坎伯郡高级杯并代表诺坎伯郡参赛；他还是一位县级高尔夫选手。后来确认他已被俘，正在战俘营中。


    ![Image](img/f0048-01.jpg)


    来自福尔斯通斯的军人勋章获得者克里斯托弗·威尔逊。


    服役于“光荣丽号”（HMS Glorious）的普鲁霍（Prudhoe）医生、休休·阿达尔·洛克哈特（Surgeon Lieutenant Commander
    Hugh Adare Lockhart）外科上校指挥的家人拒绝接受海军部关于他被推定死亡的正式通知，他的母亲提到了他出色的游泳能力以及他拥有一件特别好用的救生衣。遗憾的是，他们的信念寄托错了地方——他在战斗中阵亡。


    ![Image](img/f0049-01.jpg)


    三名被确认关押在德国战俘营的泰因代尔军官。


    来自贝灵汉的亨利·斯托克（Henry Stokes）中尉、普鲁霍的罗伯特·布利斯（Robert Bliss）上尉和来自赫克斯姆的托马·克莱克（Thomas
    Clark）少尉被确认关押在德国战俘营。1940 年 5 月，由于来自英东北沿海城镇的难民涌入，贝灵汉农村地区委员会向卫生部申请将赫克斯姆的肯尼迪·史密斯（Kenneth
    Smith）等人的难民安置在那些被判定为不宜居住的空房子里。


    普鲁霍地区也失去了一名最有希望的士兵，来自陆军军械团的约翰·雷尔顿（John Railton）军士在 22 岁时伤亡。赫克斯姆市政委员会（UDC）在 1940
    年 7 月被通知，可能需要为来自阿德代尔（Allendale）和卡特顿（Catton）的难民安置，如果人们不自愿接受，将使用强制手段。


    在赫克斯姆安置 800 名难民的情况被报告为“困难重重”，因为由于来自危险地区的人迁入，由于难民进入导致贝灵汉的人口也增加了一倍。《快报》（The Courant）指出，由于大量人口迁入，最近的人口普查已完全失效。


    户主对安置更多陌生人持抵触情绪，因为发往当地 3000 户家庭的征集令仅收到了 30 个名额。安置到阿德代尔的许多孩子被安置在阿德代尔的节制厅（Temperance
    Hall）和卡特顿阅读室。贝灵汉的人口翻了一番，引发了对水供应的担忧。


    当来自英东北沿海城镇的大量难民在不到一小时内到达贝灵汉时，贝灵汉农村地区委员会向卫生部提出了强烈抗议。他们中的大多数有生虫，有四个人患有疥疮。委员会被迫将他们安置在一个大房间里，并提供床铺、毯子和食物。曾尝试联系位于布恩格（Brownrigg）新建立的营地学校，那里有医院和护理人员，以加速清理工作，但营地并不接受他们。来自赫克斯姆的肯尼迪·史密斯（Kenneth
    Smith）指出，他们最终被转移到了 30 英外的莫普菲斯（Morpeth）的一所机构。


    布恩格格在国家营地公司（National Camps Corporation）仍在建造时，便被征用为难民中心。它是全国一系列学校计划的一部分，旨在让城市孩子体验乡村生活，但这一想法在战争期间被搁置了。1940
    年春季，尚未完工的布恩格格成为来自纽卡斯尔小学的 400 名女孩的家园，尽管现场有自来水，但并没有管道连接到五个宿舍，因此在早期，女孩们必须流经校场的小溪中洗。。


    但一旦建筑工作完成，他们比大多数人都要幸运，因为布恩格格广阔的土地意味着工作人员可以自己种蔬菜，这意味着在配给时代食物短缺的情况下，布恩格格的女孩经常可以加饭。

