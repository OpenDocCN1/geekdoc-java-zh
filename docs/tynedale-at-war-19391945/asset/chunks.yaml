    ## Acknowledgements


    The bound volumes of the Hexham Courant newspaper covering the years before, during
    and immediately after the Second World War provide a unique contemporaneous treasure
    house of facts on how the conflict impacted on the lives of people living in this
    part of rural Northumberland. I am once again eternally grateful to the editor,
    proprietors and staff of this wonderful newspaper for allowing me unrestricted
    access to the files for the purpose of compiling this book.


    I would also like to thank Muriel Sobo for permission to use her fine photographs
    of Land Girls based in the district; my brother Michael Tilley for photographic
    assistance; Terry Robson for the loan of photographs and information about the
    Home Guard and all the many other people who have helped in any way.


    Special mention also to book editor and former colleague Irene Moore for her generous
    help and encouragement, and most importantly to my wife Maureen for her unfailing
    patience and forbearance in tolerating large and dusty volumes in the house, and
    my frequent lengthy disappearances upstairs to slave over a hot computer.


    ## CHAPTER ONE: The Gathering Storm


    The two squadrons of German bombers swooped on Hexham out of the setting sun one
    evening in late May. Thwarted in their intended plan to blitz industrial Tyneside,
    the Luftwaffe pilots broke to the northwest and then headed for home along the
    Tyne Valley and, in order to lighten their heavy payload, opened their bomb doors
    over defenceless Hexham. Hardly had the newly-installed air raid siren on top
    of the police station in Beaumont Street begun to wail before the bombs started
    to rain down, causing havoc throughout the town.


    The first high explosive bomb fell at Lowgate, blocking the Allendale Road, and
    seconds later, a mustard gas bomb exploded in woodland to the west of the Hydro
    building. There was a direct hit on Tynedale Cricket Club’s pavilion at Prior’s
    Flat by an incendiary bomb, and within seconds the wooden structure was a mass
    of flames. The upper storey of a house in Hextol Terrace was also ablaze after
    being hit by an incendiary bomb, while in Shaftoe Crescent, a high explosive bomb
    fractured a gas main which was belching flames high into the sky.


    The destruction continued in the Market Place, where a strong smell of garlic
    indicated that a 250lb bomb dropped there had been packed with gas. The road surface,
    the market cross and the roof of the Shambles covered market stalls were all splashed
    with a brown liquid, as were two members of the public.


    ![Image](Images/f0007-01.jpg)

    The Northumberland Hussars at summer training in Welbeck in July 1939. The Hussars
    were one of the few units to have retained their horses.


    Incendiaries continued to rain down, with one lying unexploded in Beaumont Street
    while yet another set set fire to a house close to the gates of Hexham Hospital.
    Another hit Gibson’s sawmill yard and huge stacks of timber were well alight.
    A high explosive bomb landed close to the entrance of Hexham’s Queen Elizabeth
    Grammar School, but failed to go off, and the deadly device was lying deeply embedded
    in gravel.


    There were casualties in Priestpopple where more bombs had severed water mains
    and cut off the electricity supply. Many shop windows were blown in, and disgracefully,
    a number of teenage boys were seen looting the damaged shops.


    Thankfully, there were no fatalities and indeed damage was entirely superficial
    – those looters were in fact Boy Scouts doing their good deeds for the day for
    the ‘air raids’ happened in May 1939, several months before the Second World War
    began. It was all part of a major exercise, planned in total secrecy, to test
    the readiness of the civil defence and air raid precaution services of the town
    as Germany flexed its military muscles across the English Channel.


    The event was deemed a great success, for when the new air raid siren began to
    moan, motorists and pedestrians alike showed commendable zeal and promptitude
    in seeking shelter and the streets were cleared in a remarkably quick time. There
    was a total of fifteen incidents, with police, fire, ambulance, decontamination
    units and military authorities all dispatched to deal with the chaos caused.


    A post mortem on the mock raid was held the following week at Hexham Infants School,
    where chief organiser Major MacVicar Munro said: ‘The exercise reflected considerable
    credit on those who were involved. I was pleased too with the way in which members
    of the general public co-operated.’


    Major Munro acknowledged there had been errors, the identifying of which had been
    one of the main reasons for the exercise. He urged wardens to be as quick and
    concise as possible with their messages, saying: ‘Remember that the control room
    is the heart and pulse of the whole exercise, and if there is not complete cohesion
    between the wardens and the control room, then the practices will be a complete
    fiasco.’


    ![Image](Images/f0009-01.jpg)

    The newly installed air raid siren on the roof of Hexham police station in Beaumont
    Street in May 1939.


    Chairman of Hexham Urban Council, Councillor Tom Wheatley, said the air raid had
    made it plain there was a shortage of twenty to thirty volunteers to make the
    warden services in Hexham complete.

