    ![Image](img/f0179-01.jpg)![Image](img/f0179-02.jpg)


    当工党宣布将在 1945 年大选中中反对赫克斯姆（Hexham）的议员道格拉斯·克夫顿-布朗上校（Colonel Douglas Clifton-Brown）时，传统被颠覆了。克夫顿-布朗上校曾任下议院议长，按照传统，议长是不经竞争当选的。工党候选人是来自利兹的欧内·卡瓦纳格（Ernest
    Cavanagh），但议长以 4,645 票的优势当选。


    卡瓦纳格先生辩称他并不是反对议长，因为克夫顿-布朗上校在议会解散时已经卸下了该职位，他仅仅是保守党的候选人。克夫顿-布朗上校没有以任何党派身份参选，正如议长的身份一样，他以
    4,645 票的优势当选。他获得了 16,431 票，而卡瓦纳格先生也获得了 11,786 票，成绩相当亮眼。


    赫克斯姆小组医院供应站（Hexham Group Hospital Supply Depot）成立于战争初期，并于 1945 年 6 月底关闭。到那时，它已向军人、医院患者和需要的平民运送了超过一百万份慰问品和手术用品。卷好了超过
    1000 英里的绷带，外科部门使用了 1000 英里的材料，还有 200 吨羊毛被织成了生活用品。战争期间，供应站平均有 300 人在工作，多年来有超过 4000
    人参与过供应站的工作。通过捐款和自愿努力为供应站筹集了约 20,800 英镑，但该计划很大程度上是自给自足的，因为由 T.M.罗布森夫人（Mrs T.M.
    Robson）管理的食堂提供了超过 26,000 份餐。


    供应站委员会主席诺曼·D·纽瓦尔夫人（Mrs Norman D. Newall）表示：“这完全不符合逻辑，但供应站关闭时笼罩着阴郁氛围，因为对于许多在战争期间快乐、自愿共同工作并建立了如此深厚友谊的工人来说，这将是一个巨大的心痛时刻。”


    随着从德国战俘营回乡的人流逐渐汇成洪流，赫克斯姆警方陷入了尴尬，因为四名等待入室窃窃审判的囚犯从赫克斯姆警察局逃脱，他们拆掉了牢室的砖块和石头，从墙上的洞爬了出去。四人失踪十二小时后，在惠特菲尔德（Whitfield）被重新捕。


    赫克斯姆治安法官得知，这四个人由于晚上很暖和，被允许使用警察局后方的操场。晚上 7 点他们接受了检查，发现所有人都在场，但晚上 9 点的进一步检查发现，牢房和操场均已空如。。他们用从牢房走廊百叶窗上撬下来的铁杠，以及从操场墙上扯下的排水管，撬破了操场墙上的石头和砖块。他们开了一个
    2 英尺长、18 英寸高、18 英寸宽的洞。


    在欧洲胜利日（VE Day）三个月后，当日本投降的消息传开时，人们在凌晨的赫克斯姆街头上跳舞。篝火被点燃，烟花非常抢手，不仅是孩子们，还有来自急诊医院穿着蓝色衣服的康复病人，他们乐于在最令人意想不到的地方放鞭炮。一名来自斯托克斯菲尔德（Stocksfield）的年轻男子，“贝文男孩”（Bavin
    Boy）艾兰·林恩（Alan Lynn，19 岁）在科布里奇（Corbridge）的王子电影院放映电影时燃放庆祝用的闪光，被带上法庭罚款 2 英镑。


    阿伦代尔（Allendale）真是尽情了，除了通常篝火和烟花外，还增加了一场活动画巡游，主角包括丘吉尔、山姆叔、斯大林、蒋介石，最后是希特勒和日本领导人东条裕机，他们被绳在一起。尽管由于配给制食物短缺，整个地区还是举行了街派对和舞会。


    ### 大卫·贝尔（David Bell）


    作为战争期间首批从舰上驾驶飞机的帅气年轻人之一，斯托克斯菲尔德的大卫·贝尔属于精英飞行员阶层。但即使在皇家海军航空队的顶尖王牌中，大卫也有自己的特殊成名理由。作为一名海军飞行员，他在远东战争最后阶段从一艘航空母上起飞。他的中队原定对日本进行轰炸空袭，但在几天前，原子弹的投掷结束了敌对行动。然而，他仍然必须执行任务，并且内心非常不安地意识到，投降的消息尚未传给所有日军成员。


    在太平洋胜利日（VJ day）之后，大卫驾驶了十二架飞机中的一架飞往当时由日本人控制的香港启角机场（Kai Tak airport）执行侦察。油箱里几乎只剩下燃油，他降落在香港机场——当看到一辆日军座车在他飞机停下时朝他驶来时，他感到非常震惊。当他爬出驾驶舱时，几名高级日本军官正从车里出来。其中一人走上大卫，把他的礼剑交给了大卫——他把整个机场交给了大卫的悉心照顾！这把剑是大卫最引自豪的物品之一，在他位于斯托克斯菲尔德巴特路（Batt
    House Road）的家走廊里展示了整整四十时间。


    大卫于 1924 出生于沃尔尔森（Wallsend），第二次世界大战开始时，他随沃尔尔森文法学校的其他学生疏散到阿尔尼克（Alnwick）。18 岁时，大卫加入空军预备役队，在加拿大安大略开始训练成为皇家海军航空队的飞行员，驾驶虎蛾式双翼机（Tiger
    Moth）和更现代的哈佛式（Harvard）飞机。在空中飞行 186 小时后，他获得了飞行执，回到英国继续训练，于 1944 年 7 月加入 814 海军航空中队。


    同事称他“丁格”（Dinger），他驾驶飞马鱼式攻击机（Fairey Barracuda），主要在苏格兰练习低空飞行、夜间编队和俯冲。1945 年 3 月，他在克莱德河登了胜利号航空母舰（HMS
    Venerable），前往远东迎接他的命运。同年晚些时候，在太平洋和中国海域执行演习时，一次故障的着陆导致大卫在悉尼住院，随后在阿德莱德休养。


    他在医院的经历导致他与中队分离，让他不得不“搭便”回家，其中包括他在新几内亚度过段时间，那里的日本人仍在战斗，不知道战争已经结束。


    战后，大卫于 1958 年成为布鲁利县小学（Broomley County Primary School）校长，最后成为杜伦大学教师。他惊讶地发现，作为校长，被预计成为斯托克斯菲尔德教政会成员——部分原因是会议在他的书房举行。职责还包括确保火炉有足够的煤，并在会议中途准备茶。这是他三十年政治生涯的开始，他从教政会一直发展到在
    1985-86 年担任泰恩代尔委员会（Tynedale Council）主席。


    ### 日本战俘营的恐怖


    太平洋胜利日几周后，人们带着在日本人战俘营的恐怖经历回家。N.T·贝维克（N.T. Bewick）上尉在被关押三个半年后回到他位于科布里奇（Corbridge）的家中——他读到的第一个消息之一是官方伤亡名单上关于他自己的死亡通知。他在
    1942 年新加坡沦落战斗中受伤被日本人俘。在遣返后，他说：


