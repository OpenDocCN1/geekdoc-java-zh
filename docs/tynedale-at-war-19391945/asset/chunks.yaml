    # 在那个历史性的头版上的主要故事之一，是关于纳粹伞兵会堕落到何种地步的警告。读者被告知，一个卑鄙的匈奴人使用气胶降落伞降落在比利时，他不仅带了机枪，还带了一把挤奶凳。着陆后，他冲向最近的一头牛并开始挤奶，但他那德国人的诡计并未能欺骗当地人，反而被他们俘虏了。


    # 文中还有招募更多防空识别（ARP）志愿者的呼吁，以及对医疗物资援助的请求。读者被警告，糖的配额将从每人每周`12oz`削减至每人`8oz`。然而，对于利用自己花园种植的水果制作果酱的人，有特殊的优惠政策。赫克斯姆市政议会要求
    11.5 吨制作果酱用的糖，而贝灵汉地区议会则想要 19 吨。


    # 然而，日常生活仍在继续，报纸上两个最大的案件是：两名普鲁德霍的农民因稀释牛奶分别被罚款`£4`和`£5`，以及一对米克利的夫妇因忽视儿童被入狱。他们甚至不确定自己是有十三个还是十四个孩子。


    ![Image](img/f0038-01.jpg)


    # 在其 74 年的历史上首次，《赫克斯姆纪事报》在`1940 年 5 月 25 日`的头版刊登了新闻而非广告。显著位置是一条警告，要提心携带挤奶凳作为掩护的纳粹伞兵。


    J.V.C. 法夸尔（Farquhar）牧师在`1919`年至`1944`年间担任赫克斯姆牧师。在 1939 年敌对爆发时，他在修道院安装了扬声器系统，以便晨礼时的会众能听到内维尔·奇伯林宣布英德两国处于战争状态的洪亮声音。


    法夸尔先生对燃烧弹摧毁修道院深表恐惧，因此他组织了一支守火员队伍，他们住在建筑内。他自己也许多晚上睡在半夜楼梯顶部的折叠床。。当地历史学家罗兰·查尔顿（Rowland
    Charlton）是民卫队的一员，曾在市政厅（Moot Hall）执行守火任务。起初，民卫队被称为地方防御志愿者，简称`LDV`——查尔顿先生一直认为这三个首字母的真实含义是“看、躲、溜溜”（Look,
    Duck and Vanish）！


    ## 民卫队的事迹


    随着“假战争”阶段的结束，`LDV`在赫克斯姆的活动加强了，所有自愿服役的退役军人都被发放了装备，包括一套卡其工作服、一顶野猎帽和一支步枪。超过 1000
    名男子自愿报名，令他们非常失望的是，很快就清楚并非所有人都需要服役。指挥赫克斯姆小组的奥特伯恩阿奇巴德·怀特爵士（Sir Archibald White）中校表示，一切进展顺利，一旦各个部门练好了射击术，巡逻工作就会开始。他补充道：“我无法说会有多少志愿者被召唤；这取决于我们被允许多少套装备。然而，可以肯定，人数将远低于志愿者的总数。”


    各单位的负责人分别是：阿尼克的助理小组指挥官查尔斯·贝克·霍恩比（Charles Beck Hornby）少校；赫克斯姆的里德利·罗布（Ridley Robb）中校；贝灵汉的
    J.D·杰布（J.D. Jebb）准将以及贝宾顿的 H.S·贝尔（H.S. Bell）上校。


    雷德斯代尔的居民们怀怀记忆着西伍德伯恩和里兹代尔民卫队的事迹。他们过去会在柯基卡哈尔指挥官安德森少校的监视下，在全圣教堂后的田野进行每周演习和阅兵。参与者包括罗伯特·泰特（Robert
    Tait）、托马斯·泰特（Thomas Tait）、休·斯奈斯（Hugh Snaith）、吉·威尔逊（Jim Wilson）、威利·罗布森（Willie Robson）、杰克·布罗迪（Jack
    Brodie）和哈里·康梅（Harry Comer）。他们喜欢的训练之一是实弹手榴弹训练，志愿者们必须将手榴弹投过山脊，掉进一个方便的凹地处以安全爆炸。


    ![Image](img/f0040-01.jpg)


    赫克斯姆民卫队准备好在德国人入侵时尽一份力。


    ![Image](img/f0040-02.jpg)


    瓦克民卫队在阅兵。


    不用说，在一次著名的场合，，一个特别笨拙的新兵投出的手榴弹没能飞越山脊，而是轻轻地滚回了连队的其他人那里，导致他们惊恐地散开了来。


    在另一次演习中，连队被要求爬上伍德伯恩长坡到达采石场顶部，以监视敌方伞兵。同一个倒霉的新兵被任命为传令兵，被命令把一辆沉重的自行车从村中心骑到采石场。他还没等得及喘气，就被士官命令骑着那台机器回到营部——也就是那个广受人们怀念的“狐狸与猎狗”（Fox
    and Hounds）酒吧。那个可怜的士兵吞了口口水拒绝了命令，当被他满脸紫色的士官询问为什么时，他不得不回答道：“因为我骑不了这该死的自行车，士官！”


    其他人还记得那个所谓的德国入侵东北部海岸的著名夜晚。命令程序是：指挥官安德森少校会打电话给卡皮顿克洛克米尔的汤米·汤普森（Tommy Thompson），再由他拨打给连队成员汤米·沃尔顿（Tommy
    Walton）。然后他会打给下一个，以此类推，这样所有人都能收到警报。


    在疑似入侵的夜晚，汤米·沃尔顿接到了安德森少校的电话，说怀疑有入侵。然而，少校联系不上汤米·汤普森，于是请沃尔顿先生开车去叫醒他。沃尔顿先生如约去了克洛克米尔，尽管拼命敲门并向窗户扔石头，但并没有能叫醒汤普森。最后，沃尔顿先生回到车里回家睡觉了，所以也许德国人决定不入侵就好了。


    ![Image](img/f0042-01.jpg)


    埃迪·怀特（Eddie Waite）在`1980 年代`曾担任泰代尔议会主席——图中左侧，右侧是哈罗德·罗布（Harold Robson）。中间是基思（Keith）上尉。


    民卫队的训练在某些地区比其他地区更认真，正如一个不幸的志愿者在参加一次涉及赫克斯姆和纽伯罗部队的演习时付出的代价那样。该连由赫克斯姆村学校的校长爱德华·怀特（Edward
    Waite）运营，他将士兵分为两组——他的一组是英国，另一组由第一次世界大战的诺森伯郡陆军士官哈罗德·罗布带领，即为敌方。


    怀特在霍格顿路为“德国人”设了伏击，但那个不幸的志愿者发现了怀特和他的士兵躲在油桶和灌木丛后，并无意地告诉了罗布。那个狡猾的士官随后得以偷袭了怀特的人并俘虏了他们所有人，这让校长大发雷霆。


    第二天在学校，当学生们正在上早课时，怀特追问是谁泄露了伏击战的消息，当那个年轻人承认是他自己时，怀特的愤怒非常可怕。他训斥那个恐惧的的孩子，说口言不慎会导致生命损失，并告诉他民卫队处理第五纵奸的简单方法——他们会被处决。


    随后他派了另一个学生去学校家里取回他的手枪和萨姆布恩带，然后蒙住那个孩子的眼睛，问他是否有最后的遗言。


    在校长罢手之前，那个孩子已经吓尿了裤子。


    还有一个传说说，安德森少校决定在他自己的庄园上藏起所有民卫队的弹药和爆炸物，以防入侵。不幸的是，这位老少校忘记了把它们埋在哪里了，据称从未被发现。


    在科布里奇民卫队，劳伦斯·贝斯特（Laurence Best）在`14`岁时就当士官的跑腿。在他年过`80`多岁时，他回忆道：“有些孩子非常认真，这也许是件好事，但有一个‘尴尬小组’（Awkward
    Squad）——我是荣誉成员——他们把它当成大玩笑。”


