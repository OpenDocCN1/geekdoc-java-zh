    With invasion an ever-present threat, Tynedale residents were warned to step up
    their blackout procedures and the standard fine for breaches of the blackout regulations
    was increased from 12s 6d to a more hefty £2. The public were also warned to take
    air raid warnings more seriously. Northern Regional Commissioner Sir Arthur Lambert
    said: ‘There is a fairly numerous section of the public who do not seem to realise
    the risk from bursting bombs, which may follow almost immediately from an air
    raid warning. Large numbers appear at the doors and windows of their homes. Many
    come outside and even bring their children with them. The chances of a direct
    hit from a bomb are small, but the splinters after a burst can do terrible damage
    over a distance of 70-80 yards.’


    People were also warned to obey instructions from sentries posted at various sensitive
    locations around the district. Major J. MacVicar Munro warned: ‘We are at war,
    and these sentries are warned to halt people approaching their posts and, if the
    order is not obeyed, to fire. The fact that you are a loyal subject, and that
    you may be on some perfectly loyal errand, is not known to the sentry. One person
    recently thought the sentry was joking when ordering him to halt and kept his
    car moving even when challenged a second time, and only came to halt when a bayonet
    pierced his front tyre. People who are deaf should not approach any guarded point
    unless accompanied by a friend.’


    Questions were raised about the effectiveness of the air raid shelters at the
    council schools in Hexham, with a complaint to the authorities that at a recent
    drill, the ventilation in the shelters proved inadequate and the children almost
    suffocated. Many children also suffered severe headaches because of the extreme
    heat inside the shelters. The explanation was the doors had to be secure or they
    would not keep the gas out.


    Householders were also warned to conserve water for firefighting purposes, and
    there was a ban on washing cars, watering gardens or swilling down paths and yards.


    A decision was taken to fell trees at one of the North’s great beauty spots, Hareshaw
    Linn at Bellingham, to further the war effort. Chairman of Bellingham Rural District
    Council, Councillor T. Simpson said he had inspected the wooded dene leading to
    a spectacular waterfall, and said: ‘It is a very pretty place – it looks very
    beautiful and it seems a pity we should have to spoil it.’ Nevertheless, it was
    agreed to fell all the oaks and soft woods on the south side of the burn, leaving
    a narrow strip of trees to preserve the beauty of the wood as far as possible.


    ## A Military Medal and more casualties


    Back at the front, a 20-year-old fusilier from Fourstones became the first from
    the district to be decorated for bravery. Private Christopher Wilson of the Royal
    Northumberland Fusiliers, was awarded the Military Medal for conspicuous gallantry
    at Arras on 21 May, when he put two tanks out of action with his anti-tank gun,
    which he continued firing until it burst.


    Grim news continued to come from across the Channel, with the family of Fusilier
    William Walker of Mickley being told he had been killed in action – on the anniversary
    of the death of his father on the Somme. Serving with the Royal Northumberland
    Fusiliers, Second Lieutenant Edwin Johnson of Bellingham was also reported missing.
    He was a renowned sportsman, helping Tynedale Rugby Club win the Northumberland
    Senior Cup in 1935 and 1936 and winning his cap for Northumberland; he was also
    a county golfer. It was later confirmed he had been taken prisoner and was in
    a PoW camp.


    ![Image](Images/f0048-01.jpg)


    Military Medal winner Christopher Wilson of Fourstones.


    The family of Prudhoe doctor Surgeon Lieutenant Commander Hugh Adare Lockhart,
    serving aboard HMS Glorious refused to accept the official notice from the Admiralty
    that he was presumed killed, with his mother speaking of his fine swimming qualities
    and the fact he had an exceptionally good lifebelt. Sadly their faith was misplaced
    – he was killed in action.


    ![Image](Images/f0049-01.jpg)


    Three Tynedale officers confirmed as being held in German prisoner of war camps
    in May 1940 were (from left) Lieutenant Colonel F.B. Clarke, from Prudhoe; Major
    Kenneth Seth-Smith of Hexham and Major Kenneth Clark of Haltwhistle.


    The Prudhoe district also lost one of its most promising footballers when Sergeant
    John Railton Yielder of the Royal Army Ordnance Corps, died from wounds at the
    age of 22. He was being watched by the scouts of many big clubs before the war
    and was on the amateur books of Middlesbrough AFC.


    Hexham UDC was notified in July 1940 it may have to find accommodation for another
    800 evacuees from the coastal towns – and if people did not accept them on a voluntary
    basis, compulsory powers would be used. Meanwhile Haltwhistle Rural District Council
    was seeking permission from the Ministry of Health to put evacuees up in empty
    houses which had been condemned as being unfit for human habitation.


    The accommodation of extra evacuees in Hexham was reported to be ‘bristling with
    difficulties’ as the town was already crowded with war workers and the wives of
    families of business people from Tyneside who had moved away from the danger areas.
    The Courant noted that the recent census was now totally useless because of the
    large number of people who had moved into the area. Evidence of the influx was
    the fact that 1,500 emergency ration books had been issued by the Hexham Food
    Centre over the previous three weeks.


    There was reluctance among householders to accommodate more strangers, as a circular
    seeking volunteers which went out to 3,000 homes in the area produced offers of
    just thirty places. Many children evacuated to Allendale were being provided with
    emergency accommodation in the Temperance Hall in Allendale and in Catton Reading
    Room. The population of Bellingham had also doubled, leading to concerns about
    the water supply.


    Bellingham Rural District Council sent a strong protest to the Ministry of Health
    when a large number of children evacuated from a North East coastal town arrived
    in Bellingham at less than an hour’s notice. Most of them were verminous and four
    were suffering from scabies. The council was compelled to accommodate them in
    one large room, and provide beds, bedding and a meal. An approach was made to
    the recently established camp school at Brownrigg, where there was a hospital
    and nursing staff, to expedite the cleansing of the children, but the camp would
    not have them. They were eventually moved to an institution in Morpeth, 30 miles
    away, with Bellingham councillors pointing out that they should never have been
    sent to Bellingham in such condition in the first place.


    Brownrigg was still in the process of being built by the National Camps Corporation
    when it was pressed into service as a centre for evacuees. It was part of a chain
    of schools across the country designed to give city children a taste of rural
    life, but that idea was put on hold for the duration of the war. The half-completed
    Brownrigg became home to 400 girls from elementary schools in Newcastle from the
    spring of 1940 and, although there was mains water on the site, it was not piped
    to the five dormitories, so the girls had to wash in the stream which ran through
    the school grounds in the early days.


    Once building work was complete though, they were more fortunate than most, for
    Brownrigg’s substantial grounds meant the staff could grow their own vegetables,
    meaning that while food was scarce in the days of rationing, Brownrigg girls could
    often have seconds. The children thrived and were soon laying on entertainment
    for local residents, including pantomimes, with Peter Pan being a particular favourite.

