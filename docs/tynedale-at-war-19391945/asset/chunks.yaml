    - 第六章：帝国反击\n- 第七章：管理和平\n- 参考文献\n\n## 致谢\n\n《赫克斯姆快报》（Hexham Courant）报纸涵盖二世界大战前、期间及结束后不久的装订本，提供了一个独特的当代事实宝库，记录了冲突如何影响生活在诺森伯兰郡这一农村地区的人们。我再次感谢这家优秀报纸的编辑、所有者和员工，他们允许我无限制地查阅文件以编写本书。\n\
    \n我还要感谢穆里埃尔·索博（Muriel Sobo）允许我使用她在当地拍摄的精美女子军照片；感谢我哥哥迈克尔·蒂利（Michael Tilley）提供的摄影协助；感谢特里·罗布森（Terry\
    \ Robson）提供的民卫队照片和信息，以及所有以任何方式提供帮助的人。\n\n特别感谢书籍编辑、我的前同事艾琳·摩尔（Irene Moore）的慷慨帮助和鼓励，最重要的是感谢我的妻子莫琳（Maureen），她对我忍受家里厚重且满是灰尘的书，以及我频繁长时间在楼上对着电脑苦干时作时表现出的无限耐心和宽容。\n\
    \n## 第一章：风暴前夕\n\n5 月下旬的一个傍晚，两个中队的德国轰炸机从夕阳方向俯冲赫克斯姆。由于轰炸工业区泰因赛德的计划失败，德国军飞行员转向西北方向，然后沿着泰因河谷回家，为了减轻沉重的负荷，他们在毫无防备的赫克斯姆上方打开了弹舱。博蒙特街（Beaumont\
    \ Street）警察局顶部新安装的防空警报器刚刚鸣响，炸弹便开始如雨落下，导致整个城镇陷入混乱。\n\n第一枚高爆弹落在罗盖特（Lowgate），封锁了安伦德尔路（Allendale\
