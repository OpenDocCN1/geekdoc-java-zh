    Councillor Joe Cullen called on Hexham UDC to ban parking in the street and accused
    the offending drivers of gross selfishness, saying: ‘If they had the brains of
    a haddock, they could see perfectly well that parking their vehicles in such a
    manner constitutes a danger to pedestrians.’


    The blackout was also being used as cover by thieves who raided the allotments
    in Hexham to steal produce planted as part of the Dig for Victory campaign. Indignant
    allotment holders said the thefts were particularly despicable at a time when
    vegetables were hard to obtain. A plot created by local Boy Scouts, to provide
    fresh vegetables for Hexham Emergency Hospital as well as their parents, had more
    than half its produce taken.


    One gardener said: ‘During the blackout, it is very difficult to catch those who
    raid our gardens in their despicable way. We cannot be in our gardens every night
    standing guard over our vegetables. I counted ten turnips taken from one garden
    in one night.’


    There was an early Christmas present for Mr and Mrs William Bell, of Acomb, whose
    son Ivan, of the Argyll and Sutherland Highlanders, had been reported missing
    since July when he was involved in the Dunkirk evacuation. They were delighted
    to receive a letter from him in November to say that although he was wounded,
    he was in a prison camp and progressing well.


    ![Image](Images/f0063-01.jpg)


    Farmers across Tynedale responded well to the Government plea to plough out grassland
    for planting crops to aid the war effort.


    Despite repeated reminders both in the press and over the wireless, many Tynedale
    people had failed to apply for the new issue of ration books, leaving them with
    the possibility of facing a bleak Christmas. More than 40 per cent of Hexham residents
    had failed to complete applications and at Bellingham, less than half the populace
    had applied – and many of those who had applied had filled in their forms incorrectly.


    Food Executive officer J. Robinson said: ‘This failure causes great inconvenience
    to the smooth working of the Food Office, and I therefore urge all members of
    the public who have not done so to make application at once, otherwise the issue
    of books cannot be guaranteed.’


    There was amusement at Hexham Petty Sessions when a retired ‘clerk in holy orders’,
    William Kerr Smyth (64) appeared on a charge of being drunk and disorderly in
    Hexham. A Ministry of Information official was addressing an open air public meeting
    in the Market Place when a clearly inebriated Smyth pushed him to one side and
    knocked over his microphone stand before being forcibly removed by police. Smyth
    denied being either drunk or disorderly and told the court that he could not hear
    himself think because of the terrible noises coming from the loudspeaker. He had
    merely approached the official and asked him to ‘shut up his gabble’. Found guilty
    and fined the maximum of £2, Smyth told the court: ‘That’s a pity – the speaker
    should have been fined £6.’


    In the run up to Christmas, the ladies of the Corbridge War Servicemen’s Gift
    Fund were putting together 10s packages for the 200-plus men from the village
    on active service. Each parcel contained a 2lb fruit loaf, fifty cigarettes, two
    slabs of chocolate, a packet of biscuits and either a hand-knitted pair of socks
    or a balaclava helmet.


    ## CHAPTER THREE


    ## Taking Stock and Fighting Back


    Australian soldiers billeted in the Tynedale area took part in a sporting jamboree
    at Dene Park in Hexham and exhibited the sort of sporting superiority over the
    UK sportsmen we have become used to.


    A log chopping competition was won by six members of the Imperial forces, who
    hacked their way through their log in just fifty-one seconds; the men from Down
    Under also won a tug o’war competition against Hexham Police by two straight pulls.
    A three-legged race, a relay and a 100 yards sprint were all won by the colonials
    too. The Australians also gave an exhibition of Australian Rules football.


    On stage the celebrated BBC contralto Essie Ackland headed a troupe of ENSA artistes
    who performed to wounded soldiers at the Emergency Hospital in Hexham. She was
    supported by her Australian husband Reg Morphan, an accomplished baritone.


    It wasn’t only the human population who were suffering the effects of rationing.
    The many budgerigar breeders around the district were being forced to consider
    drastically reducing the number of birds in their aviaries or disposing of their
    birds altogether due to a Government crack down on the importation of the foreign
    seeds which were their staple diet. Breeders had managed to continue their hobbies
    by economising with the stocks they had, but it was just about all gone and major
    problems were anticipated in the New Year.


    One Hexham breeder said: ‘So far we have not been too short of food, but I am
    experimenting with other cereals to see if I can persuade the birds to change
    their diet. It is most difficult to get budgerigars to eat other seeds. Coarse
    oatmeal mixed with the seeds does eke out the supply, and I hope they take to
    the mixture. Inability to obtain these imported seeds will undoubtedly necessitate
    a reduction in the number of birds we keep.’


    Christmas shoppers found themselves short of farthings, for despite the Royal
    Mint producing adequate numbers of the little coins, they were not finding their
    way into general circulation as traders were not paying them into banks and housewives
    were not spending them.


    There was a Christmas tragedy at Acomb, where a 67-year-old man slipped in the
    blackout, while making his way home by the side of the Birkey Burn on Christmas
    Eve and tumbled into a burn, where he drowned in just four inches of water.


    There was somewhat surprising praise for Hitler in a Christmas address to Hexham
    Rotarians by the Rector of Hexham, the Rev. J.V.C. Farquhar, who described the
    Führer as a genius who under different circumstances could have been a second
    John the Baptist. He pointed out that while Britain was by and large a peace-loving
    nation, Germany had been warlike since long before Hitler was born. He said:


    ‘What he has done is very cleverly exploit that passion, so that now he is master
    – probably the greatest master the world has ever known – of that country. He
    has done that by such ruthless measures that in the process he has developed a
    heart of iron and a passion for world conquest. We made a great mistake when we
    called Hitler a lunatic. He might have the obsessions of lunacy, but he also has
    a great genius.


    If Hitler had been sent to some religious institution or a monastery as a child,
    where his soul could have lived in communion with God, he might have been a second
    John the Baptist.’


    The threat of invasion did not deter Tynedale folk from heading to the shops as
    Hexham traders enjoyed one their best Christmases for many years. Many shops,
    especially confectioners and tobacconists, were denuded of all stock by early
    on Christmas Eve. The only grumble of the traders was their inability to meet
    the demands of their customers because of wartime restrictions. One businessman
    told the Courant: ‘There is more money about than I have ever seen before. Price
    increases brought about by the introduction of Purchase Tax did not seem to matter,
    and for every five people I served, two had to go away empty-handed.’


    The continued presence of many evacuees meant there was a keen demand for toys,
    with toy soldiers, anti-aircraft guns and dolls in service uniforms particularly
    popular. Jewellers noted a strong demand for cigarette cases and other novelties
    bearing regimental crests.


    ### 1941'
