    明星们在纽卡斯尔的“赫尔伯特剧院”（The Hulberts Follies）亮相，尽管行程繁忙，他们还是同意为了友谊的名义放弃周日的下午。剧院的使用由赫克斯姆娱乐公司免费提供，所有利润都捐给了当地的战争慈善机构。他们得到了杰斯蒙德小丑团（Jesmond
    Jesters）的支持，自大战以来，他们的滑稽表演一直深受士兵的欢迎。


    明星们处于最灿烂、最快乐的心情中，受到了欢呼观众的持久掌声。杰克在谢幕时站在台上说：“今天下午能来到赫克斯姆太棒了，我们热爱这里的每一分钟。”非现役人员观众的门票销售额为
    52 英镑 19 先，由赫克斯姆小组医院补给站、英国红十字会赫克斯姆分会和赫克斯姆援助协会平。


    ## 修道院的防御


    赫克斯姆这座拥有 1300 年历史的修道院的重要性遭到了质疑，因为一项招募火警员的募员仅吸引了少数几个名字，这让牧师`J.V.C. Farquhar` 感到非常不悦。尽管多次呼吁，但只有十名志愿者站了出来。他说：“这不仅仅是教会当局的问题，也关乎整个教区和镇民。我们都应该尽力守护修道院，因为通过这样做，我们是在守护我们自己的家。这是关乎整座城市的事。”


    守门员`George Reah` 表示，在一个人口一万的城市里，竟然只能找到 10 个人来守护其最著名的建筑，这简直是“一种耻辱”。


    ## 法庭审判与纪律问题


    在赫克斯姆警察法庭，一名当地水员因无故擅离船只后被拘留等待军事护送。助理厨师`本杰明·詹姆斯`（Benjamin Jameson）声称他回到了船只停靠的泊地，但船不在了，于是他决定回家。在另一场听证中，来自格拉斯哥的
    25 岁`詹姆斯·汤斯利`（James Townsley）因盗取新布鲁诺奥勒沃什农场（Allerwash Farm）的财产被判处六个月苦役，他在那里曾被允许在一个谷仓里和一个
    19 岁的女性伴侣同睡。事实证明，他是卡梅隆高地团的一名逃兵，已经潜逃了三个月，审判席主席`约翰·查尔顿`（John Charlton）告诉他：“你是苏格兰的耻辱。你是一个军队的逃兵，却在全国流荡过着偷盗的生活。”


    历史也为`弗朗西斯·沃尔兰特`（Francis Volante）留了一个位子，他因在赫克斯姆镇的福尔街（Fore Street）醉酒并扰乱治安被带到赫克斯姆治安官法庭审判，当时他大声唱歌并使用淫秽语言。当被要求安静时，他变得具有攻击性并被捕。警察局长`威廉·古德费洛`（William
    Goodfellow）表示，他对不得不提出指控感到遗憾，因为这是自战争开始以来，赫克斯姆地区任何武装部队成员的首例。通过破坏这一记录，`沃尔兰特`不仅蒙辱了自己，也蒙辱了驻扎在该地区的所有士兵。


    ## 急诊医院的火灾


    受伤的士兵和护士齐力作战，扑灭了 2 月份在赫克斯姆急诊医院发生的火灾。一名护士和一名士兵看到浴室冒出烟雾。火起于锅炉房，破入浴室，并沿着伤员卧的病房上方的屋顶空间蔓延。病房被疏散，康复中的士兵、护士和医院工作人员使用手摇泵和化学灭火器扑灭火势，直到医院自己的消防队接手。当镇消防队到达时，有三根水管正在工作，火势被扑灭。浴室被烧毁，除了屋顶受损外，大量床具被毁了。


    ## 战争努力与勇敢


    那些没有为战争努力做出贡献的人，被老兵将军`E.P.A. 瑞德尔`（E.P.A. Riddell）在莱丁·米尔（Riding Mill）的青年协会食堂开业上进行了一番严厉训斥，他称他们为“寄生个人”。他宣布，国家不需要那些不为战争努力发挥作用的人，并补充道：“每个人都有自己的位置，那些说因为不知道去哪里而无法服务的人，他们没用心去找。如果我们想要击败纳粹和法西斯主义者，我们都必须战斗和服役。我们已经给了意大利人一些思考的空间，现在必须继续完成痛击德国人的工作。”


    其中一个正在做出贡献的人是 30 岁的`罗伯特·巴蒂`（Robert Baty），曾任赫克斯姆童军领，因在伦敦空袭期间的英勇表现被授予乔治勋章。作为一名全职防空警员（ARP
    warden），他与同事`J.B. 米尔`（J.B. Milne）爬上铅制水管进入了一栋被炸弹击中的房屋的三楼，此时其他轰炸机仍在上方盘旋投下炸弹，破裂煤气管火焰在他们身边轰鸣。他们在房子里搜寻了两个小时，已知有三人在里面，最终在废墟中发现的一名幸存女性通过床单结成的绳子降到地面并送往医院。


    ![Image](img/f0076-01.jpg)


    前赫克斯姆童军领`罗伯特·巴蒂`（Robert Baty）（30 岁）在伦敦空袭期间担任防空警员时因英雄事迹被授予乔治勋章。


    在搬到伦敦之前，巴蒂先生曾是赫克斯姆业余戏剧协会的舞台调度，后前往伦敦担任戏剧工程师，对灯光特别感兴趣。他工作过的对象包括著名制片人`C.B. 柯克兰`（C.B.
    Cochran）和著名演员`南希·普莱斯`（Nancy Price）。


    ### “罗宾逊·克鲁索”式的经历


    对于来自巴登·米尔（Bardon Mill）的 23 岁商船炮手`埃里克·罗兰兹`（Eric Rowlands）来说，现实就是真正的戏剧，他的第一次航海以灾难告终——船只被鱼雷击沉——他因此过上了罗宾逊·克鲁索的生活。他告诉《快报》：“我感觉到船在颤动并立即向左舷倾斜，看起来要翻覆了。我抓了一个装有几支香烟的小包，当我上甲板时几乎被冲走。”


    他设法进入了一艘救生艇，并意识到船只沉没时被吸入水下的可能性。这种情况没有发生，但他认为幸存者遭到了击沉船只的潜艇船员的机枪扫射。他们活了下来，然后掉进了另一艘来自同样遭遇不幸的荷兰商人船的救生艇中。那艘船只有
    20 英尺长，挤满了人，根本无法躺下。由于不知道会在公海上漂流多久，幸存者每天被限制为两勺水（大约两个葡萄酒杯量）、两块船用饼干、一点牛肉罐和炼奶。


    `罗兰兹`说：“我白天很享受这种航行，但晚上太糟糕了。你无法躺下，天气冷刺骨，我只穿了一件外套和一条炮手裤。”


    在开放式船上漂流了两天后，他们发现了一个岛屿，但没有找到合适的登陆点。在海上又漂了一个晚上后，他们决定靠岸，但在进入时撞击了岩石，救生艇被撞碎。他们设法爬上陆地，回收了能找到的物资，吃了一顿饭后，他们在四个晚上以来第一次在岸上睡觉。


    第二天他们去探险，发现了一个由无窗小土房组成的村庄，屋顶是草做的，羊和猪在房屋内外穿梭。当地人出来，给了他们热烈的欢迎，并给他们吃咖啡和水果。妇女们来到登陆点，将行李顶在头上带回村庄。他们在村庄里住了几天，然后骑驴走了
    20 英里到达他们受困的这个岛屿群的首府，乘坐一艘被派来接他们的轮船。


