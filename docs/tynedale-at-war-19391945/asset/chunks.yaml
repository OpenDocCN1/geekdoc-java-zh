  trans: '


    并不是所有人人都准备好接收疏散民的。李（Lee）圣奥斯尔德教堂的牧师弗雷德里克·塞西·韦斯特加斯（Reverend Frederic Cecil Westgarth）在坚持拒绝人们进入他位于沃尔尔（Wall）、与母亲和一名女佣人居住的九间房住宅后，被赫克斯瑟姆（Hexham）治安法庭罚款
    5 英镑——并被告知罚款本可以是 50 英镑，或监禁三个月。法庭主席洛夫图斯·贝茨准将士（Brigadier Sir Loftus Bates）表示：“我对于对一位宗教神职提出提出指控感到非常遗憾。”


    赫克斯瑟姆农村区的首席安置官塞尔尔比·伍德（Selby Wood）对该地区应对紧急状况的方式赞赞有加。他说`99`%的家庭都全心全意地配合了，并补充道：“对于安置官们出色的志愿者工作，怎么赞美都不过。他们执行了一项极其复杂且艰巨的任务，并以令人赞叹的乐观和高效完成了任务。如果没有住户的配合，他们的任务是不可能完成的。许多住户告诉我，一些被疏散的母亲非常愿意为了所提供的款待做些回报。她们的许多丈夫已经自愿参军，孩子们也已经离开了熟悉的环境。”


    赫克斯瑟姆的学校推行了双班制制度，当地孩子在`9am`到`12-30pm`之间上课，下午与疏散民交换座位，而疏散民在`1-30`到`5pm`之间上课。随后的几周里，位置进行了对换，疏散民在上午上课，当地人在下午上课。


    但到战争爆发的第二周，几位疏散民及其母亲发现自己无法适应乡村生活，宁愿回到纽卡斯尔面对炸弹。


    当时发了征集血者的呼召，赫克斯瑟姆医院的护士还呼吁捐赠旧睡衣和睡裤。


    在普鲁德霍（Prudhoe）充满了闷气，该镇的志愿者防空警员们愤怒地发现，当敌对行动发生时，他们任命了许多全职的`ARP`警员担任有薪职位——而志愿者们却被要求培训他们。阿达·布莱克恩（Ada
    Blackburn）议员告诉普鲁德霍城市市政会：“我们的警员对这件事感到非常心痛。他们是自愿的，而现在某个在征集志愿者时没有站出来的人却获得了一个全职有薪的岗位。让一个自愿服务的人去培训另一个正在拿薪做工作的人，这是一个非常不寻常的。”


    ## 潜艇袭击后的逃生


    战争恐怖的初次体验发生于，一艘德国潜艇在`9 月 10 日`击沉了从利物浦开往加拿大的`雅典尼亚号`（`SS Athenia`）邮轮。船上的人包括来自安大略省温莎多市的
    A·巴特利夫人（Mrs A. Butterley），她在汉姆绍（Humshaugh）长大，当时正在沃尔尔探望姐姐。巴特利夫人告诉一位《快报》（`Courant`）记者：“大家心情都很好，因为我们在战争爆发前正要回乡。船上非常拥挤，其中一个餐厅不得不被改装了宿舍。突然，听到一声无法描述的沉闷响，所有的灯都灭了。没有人考虑过鱼雷或潜艇，但我们本能地知道发生了什么。孩子们被吓坏了，但总来说并没有怎么恐慌。”


    她设法在黑暗的船上摸索到达甲板，但等了一个半小时才来上救生艇。她报告说，当其中一个救生艇放入水中时，吊架断了，导致许多乘客溺水。另一艘船完全满了妇女和儿童，没有男人划船，但巴特利夫人不知道他们是否幸还。


    她最终得以爬上了最后一艘离开船只的救生艇，这艘本设计只能容纳 50 人的船上拥挤了 75 个人，她并报告说潜艇在再次潜水之前曾浮出水面并射了两射。“那是一次噩梦般的经历，”她说，“我们挤在一起，由于担心弄翻船，几乎不敢移动。每一波浪都冲过船身，我们很快就湿透了。那些穿着鞋的人把鞋脱掉，用它们来舀水。”


    在狂野的大西洋上坐在救生上度过十二小时后，他们愈发微弱的“呼救”声引起了一艘经过的英国海军驱逐舰的注意，他们被救了。巴特利夫人说她感到昏迷疲惫，对船员提供的热饮深表感谢。她相信她船上的每个人都幸存了，尽管有许多人遭受了骨折。


    巴特利夫人觉得自己被救是双倍的幸运的，因为她曾乘坐`雅典尼亚号`横跨大西洋，并尝试在回程时预订同一个客间，但已经被订掉了。她后来得知，她选中的那个客间在潜艇袭击中被炸成了碎片。


    她曾七次横跨大西洋，但说：“一旦安全回到加拿大，我再也不会横跨它了。”


    当时发出了一个呼召，要求年龄在`18`到`43`岁之间的女性加入女子辅助空军，那里有厨师、食堂勤员、汽车运输司机、文员、电话和电传勤员以及织工的空缺。日薪从初级军官的`7s
    10d`到高级军官的`£1 2s 4d`不等。


    战争才持续两周就发生了第一起归因于灯光管制伤亡事故，一名`89 岁`的疏散民在赫克斯瑟姆东部的怀德豪（`Widehaugh`）被公交车撞死。联合巴士公司司机威廉·伊德（William
    Eade）在关于`本杰明·钱伯斯`（`Benjamin Chambers`）死亡的验讯会上说，他在晚上`9 点`之后不久正开着巴士从赫克斯瑟姆开往纽卡斯尔。


    战争才持续两周，该地区就发生了第一起归因于灯光管制伤亡事故，一名`89 岁`的疏散民在赫克斯瑟姆东部的怀德豪（`Widehaugh`）被公交车撞死。联合巴士公司司机威廉·伊德（William
    Eade）在关于`本杰明·钱伯斯`（`Benjamin Chambers`）死亡的验讯会上说，他在晚上`9 点`之后不久正开着巴士从赫克斯瑟姆开往纽卡斯尔。在一个黑暗阴雨的夜晚，他开启着允许的灯光，以`10-15`英里的速度行驶时，感到撞到了什么。尸检结果显示他遭受了多处伤，，其中任何一处都可能致命。


    南诺福克郡法医官多德斯（Dodds）取证说`钱伯斯先生`既听力又有近视，并在裁决时评论道：“一个`89 岁`、患有视力和听力障碍的人，在这种情况下独自外出，真是太大的遗憾。”


    他建议在灯光管制期间，人们不要在路中间行走，而应该靠人行道，并且应该佩戴或携带白色或浅色物品，以便被发现。


    ![图像](img/f0021-01.jpg)


    即使是希特勒也无法抑制 1939 年赫克斯瑟姆的圣诞精神。


    灯光管制规定执行非常严格，在海登桥（`Haydon Bridge`），海登酒店（`Haydon Hotel`）和苏格兰酒馆（`Scotch Arms`）的房东因场所灯光可见而被罚款
    10 先令，赫克斯瑟姆的灰牛酒馆（`Grey Bull Inn`）房东也被处以同样的罚。


    战争爆发关闭后，该地区的电影院和舞厅在三周后开始重新开放，前提是所有顾客都自带防毒面具。各学校的课程被削减，木工课被用于制作夹板，作为学校救护设施的一部分。塞勒学校（`Sele
    School`）和圣玛利亚罗马天主教学校（`St Mary’s Roman Catholic School`）也提供了防碎片和防气的避难所。中学提供了八个避难所，伊丽莎白女王语法学校（`Queen
    Elizabeth Grammar School`）的每个部门提供六个，小学也提供了六个。家长被建议，在发生空袭时，当地学校是孩子们最安全的地方。


