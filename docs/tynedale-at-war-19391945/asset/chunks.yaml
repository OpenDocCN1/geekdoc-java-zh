  trans: '


    对于泰恩代尔（Tynedale）狩猎协会来说，这是一个坏消息：他们收到政府的一项新指令，要求将犬群中的猎犬数量减少到战前水平的六分之一。泰恩代尔将被每周仅狩猎两天，而不是传统的四天，且猎犬数量将减少到八半对或九对。一位猎头人表示：“自从战争开始以来，狩猎活动为了国家利益一直在牺牲，虽然这项新规定将极大削减我们的活动，但与数百万人赢得战争所付出的牺牲相比，这算不上什么。”


    ### 醉酒、滋事和其他犯罪


    澳大利亚帝国军成员在周六晚上来到赫克斯姆（Hexham）的行为，引起了赫克斯姆法庭日益的关注。在对一名澳大利亚人因醉酒滋事处以`£2` 的最高罚款后，法庭主席约翰·布鲁格登（John
    Brogdon）议员警告说，任何更多不听话的闹者将被送往监狱，且没有罚款的机会。当地警察局局长威廉·古德费洛（William Goodfellow）告诉法庭，澳大利亚人在醉酒方面的行为远低于对制服人员的预期标准。警察在让他们于午夜或凌晨
    1 点前离开城镇非常困难，而且他们的行为对在该地区驻的许多其他部队是不公平的，而那些部队没有收到任何投诉。该士兵部队的一名军官说：“这种情况让我们感到非常困扰，因为我们非常看重自己的名誉。”


    该月晚些时候，由于存在可能发生混乱的风险，法官们拒绝为赫克斯姆举行的一场支持海外联盟（Overseas League）的舞会发放晚间饮酒许可，理由是赫克斯姆附近驻扎了来自许多不同国家的大量士兵。由于下班士兵滋事行为增加（包括打破和投掷玻璃杯），警察反对了这项申请。


    出现在法庭的不止是澳大利亚人。一名在当周早些时候击落过一架德国飞机的波兰飞行员出现在被告席，他被指控偷窃了一只价值`12s` 的艾尔斯里鸭，那只鸭属于一名当地警察。名飞行军士穿着全套飞行装备出现在被告席，且不会英语，因此需要翻译服务。逮捕人员承认了这名波兰人偷鸭并不是为了食物，而是想将其作为吉祥物，案件遂被驳回。然而，该飞行员被命令支付`5s`
    的诉讼费，法庭的一名成员表示，考虑到该男子击落了一架德国空军飞机，他将自掏腰包支付费用。


    另一位匿名陆军军官也出现在法庭，被指控在没有许可的情况下在科布里奇（Corbridge）附近的泰恩河捕钓鲑鱼。当被法官询问时，他问道：“这就是我们战斗的吗？我以为钓鱼是免费的；这太琐了。”尽管他告诉法庭他习惯在苏格兰钓鱼（那里不需要执照），但他被罚款`15s`，并承担`5s`的诉讼费。


    1941 年中，赫克斯姆辅助消防队（AFS）的活动引起了赫克斯姆地区委员会（UDC）的高度震惊，当时有人指控有人偷窃了单位消防车的汽油，要求解雇所有全职人员。人们对消防车燃料消耗量过高表示担忧，委员会官员的调查显示，在`5
    月 5 日`到`5 月 20 日`期间，该车辆仅行驶了`46 miles`——但提取的燃料量却是`44 gallons`。检查显示，泡沫装置的一根管子被用来将汽油从消防车抽入一个容器中。据信，在某个阶段，车辆在出任务时油箱曾被完全干涸。


    针对要求解雇 AFS 所有全职成员，委员会副主席乔·库伦（Joe Cullen）表示：“我们至少可以说，在看护和管理这种珍贵的物资时存在完全的疏忽，而这种物资是我们油罐兵们用血、汗水和生命带入这个国家的。你们可能觉得我的建议非常激进，但极端的恶行需要激进的补救，在目前的情况下不允许这些事情发生。”


    警方被召集，但事实证明无法确定真凶——就像在其他几次 AFS 库存中燃料发生莫名其妙消失一样。


    ![Image](img/f0084-01.jpg)


    赫克斯姆的临时军士诺曼·P·麦基（Norman P. McKie）在“索马里号”（HMS Somali）舰在执行北极护护队任务期间被鱼雷击中后，自愿留在舰上，被追授表彰。在几乎所有士兵离开船只后，他作为加热小组的一部分留在了船上。表文中写：“麦基军士在船只沉没前的三天半中表现出的热情、勇气和对职责的忠诚，是所有和他在一起的人的典范。”


    其他议员同样对燃料的损失表示担忧，但对在国家危机时期辞雇训练良好且能力出的消防员的做法表示质疑。解雇提议被拒绝了，但双方同意必须加强纪律和安全措施。


    在食品方面，西红柿极缺，以至于店主将它们留给有长期订单的老客户，这导致一位主妇询问：“这意味着工人阶级的人吃不上西柿了吗，因为他们付不起长期订单费用？”


    赫克斯姆的一个店主评论道：“当你带着西柿从市场回来时，人们为了抢西柿几乎要撞破你的窗户，如果你拒绝，你就真的惹上麻烦了。”


    做果酱的糖仍然是一个争议点，但制作果酱的工作交给了泰恩代尔的妇女协会（women''s institutes）来负责。该地区设立了多余水果保存中心。该计划专门用于保存本会被浪费的水果，并鼓励水果生产者按照战前的方式直接食用、装罐或制成果酱。只有剩余产品才能运往各个中心，价格由政府设定。醋栗每百磅最高价为`30s`，覆盆子`47s
    6d`、黑醋栗`90s`、草莓`75s`以及奇异`50s`。


    该计划在贝灵汉姆（Bellingham）启动，但最初由于没有水果供应而显得毫无进展。该计划生产的第一批果酱出现在斯托克斯菲尔德（Stockfield），比威尔（Bywell）和分支端（Branch
    End）协会的妇女们制作了`100lb`的醋栗酱，水果是按每磅`3½d`的固定价格购买的。除了清洗和煮沸水果，妇女们还负责清洗和消毒由当地学生为该计划收集的`2000`多个果酱罐。


    其他中心很快运转起来，科布里奇、迪尔斯顿（Dilston）和斯塔肖（Stagshaw）联合妇女协会生产了`154lb`的大黄和醋栗酱，被当地店主迅速抢购。安德尔兰男爵夫人（Dowager
    Viscountess Allendale）提供了她在比威尔厅（Bywell Hall）的厨房供事业使用，业务非常繁忙。


    泰恩代尔水疗馆（Tynedale Hydropathic Establishment）的居民感到了一个震惊，当他们吃完晚饭起身离开时，发现接待处贴了一张告示，称酒店正在出售中，他们必须寻找替代住所。虽然细节很少，但据了解，出售是迫使业主做出的，因为该建筑正被政府征用作为儿童疗养院。


    许多居民已将酒店作为永久住所，有些人是因为他们在英格兰东北部其他地方的家被炸了，他们无处可去。


