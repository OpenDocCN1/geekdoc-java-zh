    他们受到了热烈的欢迎，欧洲人和当地人一齐聚集在港口，欢呼着：“大英万岁！”罗兰兹先生（Mr Rowlands）表示，这些男人们非常出色地度过了难关，除了遭受了严寒和日晒，侵蚀了他们结满盐渍的皮肤之外。他说：“这是一次非常兴奋且有趣的经历，但这种经历一辈子一次就够了。”


    对艾伦山谷（Allen Valleys）的首次轰炸记录在 1941 年 4 月 26 日（星期六）午夜，午夜不久。一架显然迷路的德国空军轰炸机在泰恩代尔（Tynedale）上空盘旋了一段时间，似乎在随机投掷炸弹。在艾伦山谷，飞机在海阿克顿（High
    Acton）和诺克谢尔德（Knockshield）农场之间的空地上投掷了 200 枚燃烧弹，在索恩利门（Thornley Gate）和毕晓菲尔（Bishopfield）之间又投了
    50 枚，但未造成任何人员伤亡。后来，在该地区还发现了四个装载过燃烧弹的飞机容器。


    前艾伦代尔（Allendale）居民、百岁老人艾伦·史密斯（Allen Smith）记得他叔叔对轰炸的反应。“他们投弹的那个晚上，我叔叔——住在辛德霍普（Sinderhope）附近伯恩富（Burnfoot）的埃弗斯特·查尔顿（Everest
    Charlton）听到了爆炸声，拿出了他的双管枪，因为他以为德国人过来了。他带着妻子和枪坐在，准备射掉第一个出现在花园小径上的德国人——幸运的是那天晚上没有人路过！”


    1941 年晚些时候，10 月 12 日（星期日），艾伦山谷再次遭了轰炸。几架从曼彻斯特轰炸任务归回的德国轰炸机选择了泰恩峡谷（Tyne Gap）作为返回路线，这条路线通常被用于袭击默西赛德（Merseyside）和克莱德斯赛德（Clydeside）。晚上
    10:51，东北部地区发布了灯光预警，随后在晚上 11:05 响了警报。虽然战争期间艾伦代尔或艾伦海德（Allenheads）没有防空警报器，但该地区有几个警报器，其中包括赫克斯姆（Hexham）的一个，在安静的夜晚，跨越整个山谷都能听到。


    晚上 11:25，一架飞机投下了一枚炸弹，掉落在艾伦代尔西西一英处的奥斯特利农场（Oustley Farm），位于肯恩利（Keenley）。这是一枚巨大的炸弹，形成了一个直径
    30 英尺、深 20 英尺的坑。爆炸导致农场的窗户和一扇门受到轻微损坏。前艾伦代尔居民朱·沃克勒（June Walker）在战争爆发时只有三岁，但她还记得父亲带她去看炸弹造成的破坏。“我记得去看炸弹坑，因为我父亲是民兵卫队的（Home
    Guard），他带我一起去的，”她说。


    ## 战争武器周


    泰恩代尔地区通过国家储蓄运动每天节省 1,000 英镑，自敌对爆发以来，他们已为战争努力贡献了超过 50 万英镑，还筹集了 5,000 英镑购买他们的“喷火式战斗机”。然而，当计划
    1941 年 4 月 26 日至 5 月 3 日举行“战争武器周”时，该地区准备做得更多，目标是在七天内达到惊人的 60,000 英镑。当时称，每募集六便士就能买一颗重机枪子弹，因此成为在希特勒棺材上再钉的一枚钉子。


    ![Image](img/f0079-01.jpg)


    1941 年春季，许多赫克斯姆的企业支持了赫克斯姆及地区战争武器周。


    ![Image](img/f0080-01.jpg)


    尤斯塔斯·珀西勋爵（Lord Eustace Percy）启动赫克斯姆战争武器周时，挤满了赫克斯姆市场。


    陆军部的购物清单从一艘战舰的 800 万英镑到一艘航空母舰的 300 万英镑，从一把韦伯利手枪的 4 英镑 10 令到手榴弹的 4 令——更不用说那些六便士的机枪子弹了。


    这一周从镇东部的德尼公园（Dene Park）橄榄球场开始游行，到达市场广场，大量群众欢迎了在军乐队带领下的士兵、民兵卫队、辅助消防队、红十字分队、防空识别员（ARP）和其他民防人员的登场。致礼的是洛夫图斯·贝茨爵士准将（Brigadier
    General Sir Loftus Bates），随行的是爱德华·里德尔尔准将（Brigadier General Edward Riddell）。战争武器周组织者尤斯塔斯·珀西勋爵向群众演讲时说，战争每周花费
    5,000 万英镑，这种资金不能仅靠税收。。还需要储蓄形式的额外自愿捐款，可以在战争结束后兑换。


    很快很清楚，目标是刻意保守的，因为在活动的第一天就筹到了 90,856 英镑，仅该镇的银行——巴克莱斯、米德兰、莱莱丰、马丁和国家省级银行——每家就承诺捐款
    10,000 英镑。


    活动开始四天后，总额超过 150,000 英镑，最终总额为 236,959 英镑 19 令 11 便——几乎是目标的四倍——这赢得了财政大臣金斯利·伍德爵士（Sir
    Kingsley Wood）的一封热烈感谢信。赫克斯姆及地区战争武器委员会主席安东尼·埃默森（Anthony Emerson）补充道：“这表明全英的心脏如既往一样坚定忠诚。”


    来自奥特伯恩（Otterburn）的林业工人约翰·沃尔顿（John Walton，25 岁）因未根据《1939 年兵役法案》注册而被贝灵汉姆（Bellingham）法庭罚款
    5 英镑。他告诉法庭，他没有注册是因为他是一个良心反对者，他认为战争“完全没有必要”。他拒绝缴纳罚款，当他询问还有什么其他选择时，法官席 G.D.安德森少校（Major
    G.D. Anderson）告诉他：“没有其他选择；你将被迫缴纳罚款，并给一个月的时间交。你对这一问题的个人观点并不影响我们。《兵役法案》和其他任何法律一样是这个国家的法律，你完全清楚自己没有遵守该法律。”


    沃尔顿没有交罚款，两个月后被再次带回法庭，他告诉法官他仍然打算交罚款。他被关禁一个月，并对法庭说：“无论是六个月还是六年，并不重要。”


    防空措施继续占据地方当局的精力，赫克斯姆地区委员会（Hexham UDC）向国内安全部申请了一项拨款，用于提供家庭防空难所。H.H.达林顿（H.H. Darlington）议员表示，虽然赫克斯姆有一些出色的公共防空难所，但很少有人使用它们，“因为他们不愿意在晚上离开温暖的床去进难所”。


    海德登桥（Haydon Bridge）对敌机飞机威胁时发出警报的方法深表不满，这涉及到首席防空警员 E·基尔索普先生（Mr E. Kirsopp）在整个村子里敲开警员们的门。向诺森伯兰防空委员会申请防空警报器的请求反复被拒绝，尽管一个警报器只要
    20 英镑。一位当地议员问：“我们现在不是应该结束这场闹剧，并告诉郡议会他们在解释防空措施时不要那么吝啬吗？”


    约翰·理查森法官（Judge John Richardson）在英国军团科布奇（Corbridge）分会组织的吸烟会上诋毁了德国民族。他说：“对德国人说好话固然很好但我从未遇到过一个好的德国人——至少在我
    1938 年去德国时没有。对于对希特勒类型和性格的人表现出这种盲目忠诚的人，是不值得信任的。为了欧洲，不能信任那类人，德国必须永远被打制。”

