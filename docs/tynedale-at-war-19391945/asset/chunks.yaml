    与此同时，真正的战斗仍在多个战线持续。来自费尔赛德、科尔布里奇的约翰·鲁德·马基基（John Rudd Mackie）中尉在蒂利-卡恩地区巡逻时，俘获了两名德国人。然而，随后由于一条绊线触发了德国人的陷阱，导致他受伤，而两名战俘试图逃跑。尽管受伤，马基基仍成功用他的
    `Sten` 冲锋枪击中了他们两人，使他们被重新捕获。他曾获得过由蒙哥马利元帅签署的表彰卓越服务的证书，但在逃跑计划失败后仅几周便在战斗中阵亡。


    R.C. 奥斯伯恩·赫德林准准少将（Brigadier R.C. Osborne Hedley）被授予卓越服务勋章，是因为他在缅甸钦岭领导印度陆军团对抗日军表现了典范般的领导力，特别是在萨考山战役中，那是远东战争的关键转折点之一。赫德林的戈尔卡士兵开辟了密不可入的丛林绕过日军侧翼，他们曾一度用步枪柄制作简易梯子爬上悬崖，开辟了通往英法尔的道路。


    ### 意大利战营逃亡者的回归

    投降后，从意大利战营逃出的人在躲避纳粹并四处奔波数月后，开始返回泰恩代尔。其中包括皇家诺森兰伯郡掷枪兵团的基特·帕特森（Kit Patterson）上尉，他徒走了
    250 英里回到盟军阵线，耗时九半个月。他是五人逃生小组中的一个，其他四人均被重新捕获。他因天气延误，在山中依靠智慧生存，并由意大利农民提供食物，他发现这些农民非常友好且乐于帮助。他回到赫克斯姆后注意到的第一件事是建筑周围所有的围栏都消失了。


    ![Image](img/f0163-01.jpg)


    来自亨绍的的约翰·奥斯瓦德·诺兰（John Oswald Nolan）军士，他在从战俘营逃脱后利用他的“流利意大利语”骗过了纳粹军队。


    另一位逃亡者是来自亨绍的的约翰·诺兰（John Nolan）军士，他也失踪了九个月，躲过了德国巡逻队的搜捕。有一次，他遇到了一队骑自行车的德国部队，但他只是挥了挥手，用装出来的意大利语对他们胡言乱语，他们就让他通过了。之后，他小心避开主路，在树丛和森林的掩护下走向自由。和帕特森上尉一样，他受到了当地人的照顾，他们与他分享了贫乏的食物。他曾为一个意大利家庭工作，当他说要回家时，那个家人崩溃落泪。由于他曾在特拉波利、布林迪西和马切拉塔的监狱营被关押，他说许多意大利战营的食物非常贫劣，如果没有红十字会的食品包，许多英国战俘将无法幸存。


    诺兰军士于 1942 年在骑士桥被俘，但他此前已经参加过战斗，他曾从敦尔克撤离，并因在阿拉斯战战中的英勇表现——在猛火力下驾驶一辆满载士兵的卡车开往安全地带而获得战报表扬。当时的火势之猛烈，卡车轮胎被炸飞，他沿着轮毂行驶了许多英里。


    ![Image](img/f0163-02.jpg)


    前阿康姆矿工出身的西德尼·库珀（Sidney Cooper）军士，他在法国卡格尼捡起一箱燃烧的炸弹并将其处理安全，拯救了许多生命。


    ### 前线的英雄事迹

    前阿康姆矿工出身的西德尼·库珀军士（32 岁）展现了更多英雄事迹，他当时在卡昂的一个装甲师服役，面对过精锐的德国装甲部队和伞兵师。在卡格尼的一个艰苦的日子里，一枚德国
    88 毫米高射弹落在距离他位置五码处，点燃了一堆二十枚迫击弹的火药。这些炸弹随时可能爆炸，但机智敏捷的库珀军士撕掉了燃烧炸弹的箱子，并铲了一堆土盖在上面以熄灭火苗。一名军官告诉军事观察员：“库珀军士的行为拯救了宝贵的设备和生命。这是我遇到的最冷静、最勇敢的任务之一。”


    当盟军横跨法国挺进时，来自赫克斯姆葡萄酒店的罗伯特·麦克法拉恩（Robert MacFarlane）列兵向父母写信，讲述了法国人给予他们的欢迎。他说：“我们进入一个村庄的边缘，被居民围住了，他们撒下花并带来酒，因为我们是第一个进入村庄的英国士兵。一位老太太高兴得流泪，我跳下坦克给她一些巧克力，她亲了我并抱住我，就像我是她的亲儿子一样。”


    麦克法拉恩列兵在写信后不久受伤，被转往南威尔士南部的一家军事医院。


    ### 空战与本土守卫队

    在空中，喷气式风暴战斗机（Hawker Typhoon）发射火箭的工作是由来自宾菲尔德的 D·穆里（D. Murray）飞行尉描述的，他曾参与了阿姆斯特附近莱茵河南岸工厂的进攻，该工厂当时被德国人用作军营和据点。


    他告诉《时代报》（Courant）：“这是一个大工厂，派了两个中队过去，每个小组负责拆毁工厂的一个区域。瞄准非常精准，每个小组发射的火箭都正中目标，等我们完成时，整个工厂已经彻底被毁了。当进攻开始时，那些鬼子逃光了，我们把他们击退。”


    尽管入侵威胁逐渐消退，本土守卫队开始精简，来自普拉斯特斯（Plashetts）的牧羊人乔治·威廉·罗伯森（George William Robson）告诉贝林汉法庭，他曾独自管理一个
    1000 英里的农场，照顾着 400 只母羊和 300 只羔羊。作为诺森兰伯郡第 10 团本土守卫队的士兵，他已经两年没有参加阅兵了。尽管如此，他仍被判定无故缺勤并罚款
    6 英镑。


    在案件发生后，诺森兰伯郡第 4 团本土守卫队的指挥官 J·罗布（J. Robb）中校将 1944 年后期本土守卫队的处境比作足球队的守门员。在科尔布奇举行的一场本土守卫队运动会上，他面对
    500 名观众说：“当对方施压时，本土守卫队曾非常活跃，而现在他们处于获胜的一方，守门员很容易靠在门柱上，但他们必须意识到对方可能快速突破。本土守卫队就像守门员一样，在终场哨响之前必须保持警惕。”


    ![Image](img/f0165-01.jpg)


    在科尔布奇的红十字会花园游华筹集了 200 英镑，图中（从左到右）是举办豪登巷活动的 R.D·拉斯（Mrs R.D. Glass）、主持活动的布拉克利女夫人（Viscountess
    Brackley）、主持会议的斯蒂福德的迪金森夫人（Mrs Dickinson）以及诺森兰伯郡红十字会主任 M.M·威廉森小姐（Miss M.M. Williamson）。


    终场哨响出现在 11 月 19 日，在皇家诺森兰伯郡掷枪兵乐队演奏的激昂《布莱登赛马》（Blaydon Races）曲中，诺森兰伯郡第 4 团本土守卫队在赫克斯姆的普里斯特波尔（Priestipple）举行了告别阅兵。


    总共有 1200 名来自该地区各连的士兵自豪地走过泰恩谷储蓄银行前的检阅台。接受检阅的是是诺森兰伯郡副区本土守卫队指挥 A.E·霍金斯（Colonel A.E.
    Hawkins）上校告诉他们，在 1940 年那些黑暗的日子里，希特勒没有执行入侵计划的原因之一，是因为他知道除了正规军，他还要对付 200 万本土守卫队成员。

