    来自克劳克克的士兵罗纳德·牛顿（Ronald Newton）是第一波登陆者，他表示所有参与的滑翔机飞行员都因其勇敢应该被授予维利亚十字勋章。他补充说，从德国进攻中撤退的士兵们必须给靴子包底，才能安全地回到莱河。


    阿姆姆行动导致了来自威尔拉姆的`滑翔机飞行员团`威廉·N·巴里（`William N. Barrie`）上尉（26 岁）牺牲，他此前曾因在西西里英勇且卓越的服务而获得卓越飞行勋章。巴里上尉的妻子玛格丽特曾服役于陆军辅助队（`ATS`），几个月前还陪同他前往白金汉宫参加了他的授勋仪式。


    ![Image](img/f0170-01.jpg)


    在白金汉宫的仪式上被别上卓越飞行勋章后不久，来自威尔拉姆的威廉·巴里（`William Barrie`）上尉在阿姆姆`滑翔机飞行员团`服役期间殉职。


    战争爆发时，他正在接受会计师培训，后被任命为皇家诺森伯兰陆团（`Royal Northumberland Fusiliers`），随后转入陆军航空兵团（`Army
    Air Corps`）。在日常生活中，他深度参与童军运动，是赫克斯姆的首位皇家童军军员。他曾代表泰恩代尔（Tynedale）参加过橄榄球赛。


    两名在赫克斯姆 Wanless Close 共同长大的士兵同随侦察团（`Recce Regiment`）参战，约翰·詹姆斯·斯凯尔顿（`John James
    Skelton`）24 岁军士和托马斯·威廉·哈德森（`Thomas William Hudson`）23 岁士兵，两人因在西北欧英勇表现被授予军事勋章，并在布鲁塞尔的一场特别仪式上，由伯纳德·蒙特马利（`Bernard
    Montgomery`）元帅将勋章丝带别在他们胸前。


    这些奖励是在维姆莱伊（Vemraij）侦逻期间获得的，当时遭遇了猛火，导致一名士兵伤势严重不得不留在原地。在返回基地时，斯凯尔顿军士自愿营救该士兵，哈德森士兵也自愿一同前往。他们乘坐一辆装甲车，在距离伤员
    50 码处时遭遇了来自步枪和机枪的致命火力，被迫他们停下。然而，这两个好伙伴在距离敌人不到 100 码的情况下下车，成功找到了受伤的战友并将其拖回了装甲车。


    ![Image](img/f0171-01.jpg)


    两名赫克斯姆的和平时期邻居在服役于皇家诺森伯兰陆团（`Royal Northumberland Fusiliers`）侦察团（`Recce Corps`）期间，均因在欧洲的英勇表现被授予军事勋章。托马斯·哈德森（`Thomas
    Hudson`）士兵和约翰·詹姆斯·斯凯尔顿（`John James Skelton`）军士在布鲁塞尔的仪式上，由伯纳德·蒙特马利（`Bernard Montgomery`）元帅将勋章别在制服上。


    记载写道：“斯凯尔顿军士凭借其卓越的英勇行为完全不顾自身安全，防止了战友被俘，并很可能挽救了他的生命。哈德森士兵保持了完全冷静，他卓越的勇气典范对他所有同仁来说都是极大的鼓舞。”


    圣诞前的一周，赫克斯姆西端客馆（West End Inn）的经理被罚款 20 英镑，加 5 镑 16 先的诉费。一名衡量官称这是一起“令人廉耻的严重掺假案件——是我从事这份工作
    40 年来见过最糟糕的一起。”执照人约翰·威廉·伯恩（`John William Burns`）被发现出售稀释比例高达 34%的威士忌以及添加了 33.4%水的金酒。他声称这些稀释酒仅供他自己使用，以便在接受客户提供的饮料时不会醉，但法官驳回了他的说法。


    ### 1945 年


    1945 年初开始阴郁，一名在伯明翰从事战争工作的赫克斯姆女性被发现遇害，喉咙里塞满了 75 英镑现金。她是阿格尼斯·杜杜利（`Agnes Dooley`），在她尸体旁边的是赫克斯姆医院的前门守卫
    J·约翰逊（`J. Johnson`）。验尸团判定约翰逊杀杀了杜杜利小姐后自杀。


    据已确认，由赫克斯姆地区赞助的失难泰恩德尔号（`HMS Tynedale`）的替换舰是位于米德伯斯堡建造的洛赫埃克号（`HMS Loch Eck`）护卫舰，该舰许多成员来自该地区。舰长
    R·C·弗里克（`R.C. Freaker`）中校表示，他对继承泰恩德尔号在当地赢得的喜爱感到自豪，并希望自己的船在面对敌人时同样出色。她一深受当地学生的欢迎，赫克斯姆高级中学的五十多名学生给船员写信寻找笔友。


    洛赫埃克号（`HMS Loch Eck`）是一艘成功的潜艇杀手，得益于从布莱切利公园的恩 igma 密码破解员获得的信息，她能够精准定位德国潜艇的位置。她驻扎在西北海口的斯卡帕流（Scapa
    Flow），仅在 1945 年 2 月就帮助击沉了三艘潜艇。她度过了战争，随后被转交给新西兰海军，更名为哈维亚号（`HMNZS Hawea`）。


    ![Image](img/f0172-01.jpg)


    泰恩德尔号（`HMS Tynedale`）沉没后，赫克斯姆地区采用的驱逐舰洛克号（`HMS Lock Eck`）。


    一名骗子在对沃克附近的奇普奇城堡（`Chipchase Castle`）居住者身上耍“阴险花招”后被判禁六个月。肯尼斯·麦克纳斯（`Kenneth McManus`）穿着加拿大陆中尉服出现在泰勒（`Taylor`）家族的领地。他说他是服役于爱尔兰卫队（`Irish
    Guards`）的罗伯特·泰勒（`Robert Taylor`）上尉的好友，并在安齐奥滩头曾与其并肩战斗。他声称泰勒上尉曾敦促他，如果来到北方一定要在城堡停下。作为一名官和绅士，他受到了热烈欢迎，并获得了城堡的一套房间。他去打猎和钓鱼，度过了四天的奢侈生活。


    直到他离开后，泰勒夫妇才发现价值 200 多英镑的珠宝丢失了，还有枪房的一支步枪和手枪。


    警方报警，几周后麦克纳斯在爱丁堡被捕。事实证明他是梅西赛德的布特尔人，从未去过加拿大、安齐奥或任何战区，实际上是一名逃亡逃兵。据推测他在逃亡期间结识了泰勒上尉，并找到了对方的住处。他在赫克斯姆的一家酒吧卖掉了一些被盗的珠宝，声称那是姨妈留给他的。


    与此同时，随着盟军逼近德国，一名服役于阿盖尔和苏格兰高地（`Argyll and Sutherland Highlanders`）、来自西蒙伯恩的 21 岁士兵以英勇的表现平定了一次德国反击。爱德华·杰弗里（`Edward
    Jeffrey`）士兵曾是小组坦克支持下攻下一个农场堡垒的一部分，但坦克撤离后，德国人重新集结并试图夺回。杰弗里士兵让他们他们靠近，然后用他的布伦机枪击杀了六人，导致其余人员撤退。


    ### 德国战俘逃亡


    ###监狱逃亡的不只有英国战俘，1945 年 4 月 1 日，19 岁的奥地利人约瑟夫·基尔希多夫（`Josef Kirchdorfer`）与其他名同胞从哈尔特威斯附近的费瑟斯通城堡（`Featherstone
    Castle`）战俘营逃脱。基尔希多夫在 1944 年在荷兰敌后执行间谍任务时被捕。得益于他口袋里有一封来自世界首位女性测试飞行员——著名的汉娜·瑞奇希（`Hanna
    Reitsch`）的信（她曾被希特勒授予铁十字勋章和空军钻石勋章），他被送往英国审讯。


    在伦敦留了两周后，他被送到费瑟斯通，很快成为逃跑计划的核心。他们在深夜逃脱，打算偷飞机回国。如果小组中至少有两名飞行员，这个计划本可以可行，但这次冒险变成了灾难。


