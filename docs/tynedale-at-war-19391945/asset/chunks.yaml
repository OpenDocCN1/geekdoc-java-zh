- fmt: "\nHerr X witnessed old people being beaten to death and sadistic crimes of\
    \ every form of cruelty being perpetrated. On several occasions, all 20,000 prisoners\
    \ in a camp built to hold 5,000 were woken in the middle of the night to witness\
    \ mass hangings. Everyone who died in the camp was cremated and their ashes sent\
    \ to relatives, who were not allowed to ask how or why they had died. Relatives\
    \ were allowed to send parcels, but inmates had to queue for them, sometimes for\
    \ as long as a whole day. If parcels contained tobacco or fruit they were confiscated\
    \ by camp officials and letters from home were torn up in front of their intended\
    \ recipients.\n\nFood consisted of a drink the colour of coffee and a quarter\
    \ of a piece of bread for breakfast, soup with the faintest trace of meat for\
    \ lunch and small pieces of heavily salted sausage and salted herring for evening\
    \ meal. Herr X said: ‘This was another form of torture, for we were not allowed\
    \ water and if you took your supper, you suffered a terrible thirst all night.’\n\
    \nHe spoke of the despair of the majority of the German people who had been dragged\
    \ into a war they did not want by a government which ruthlessly put down any hint\
    \ of resistance to the Nazi party.\n\nThere was much sympathy for the plight of\
    \ Second Officer Cyril Clemitson of Brigwood, Haydon Bridge, who was close to\
    \ the end of a 50,000-mile journey to the Far East and back in the Newcastle steamer\
    \ `Dalryan` when it struck a mine just off the south-east coast of England.\n\n\
    He told the Courant: ‘I was having forty winks in my cabin before getting the\
    \ landing gear ready when I was aroused by a terrifying noise. The metal side\
    \ of the ship was ripped apart like so much paper. My cabin was completely shattered;\
    \ my radio, wardrobe and other furnishings were turned to matchwood. I groped\
    \ around for my torch and lifebelt and ran up on deck where a second explosion\
    \ occurred and we had to take cover from falling wreckage.’\n\nFortunately, all\
    \ thirty-eight crew members were rescued, as the explosion had been seen from\
    \ the shore and, in Second Officer Clemitson’s words, the only casualties were\
    \ ‘my goldfish and somebody else’s canaries’.\n\nThe first Christmas of the war\
    \ brought quiet defiance, with the shops reporting better trade than before the\
    \ conflict. The Post Office reported a big increase in the number of greetings\
    \ cards exchanged. Many local men serving with the forces were home on leave so\
    \ there were some happy family reunions. And while many of the evacuees went home\
    \ for the festive season, others remained in Tynedale, with one big party for\
    \ the incomers held at the Masonic Hall in Hexham where dance music was provided\
    \ by the Jolly Millers.\n\nA major feature of Christmas Day was the Empire link-up\
    \ programme on the wireless, in which the Corbridge Carol Singers took part, concluding\
    \ with a message to the Empire from King George VI. The Corbridge broadcast took\
    \ place from the home of 84-year-old J.T. Mail at Roecliffe Lodge. The carols\
    \ sung were Silent Night and We Three Kings of Orient Are, accompanied by Jack\
    \ Armstrong, the well-known Northumbrian piper.\n\nThe wards of Hexham War Memorial\
    \ Hospital were gaily decorated with streamers and other items made by the nurses\
    \ and the patients themselves. Several soldier patients received gifts of woollens\
    \ knitted by the nurses. The Post Office coped well with the avalanche of mail\
    \ despite the problems caused by the blackout, with most people heeding the plea\
    \ to post early for Christmas.\n\n## 1940\n\nDespite being thought of as more\
    \ of a retreat for safety than a hive of activity during the Second World War,\
    \ Tynedale is not entirely devoid of evidence that the conflict took place. The\
    \ district is littered with boggy craters and overgrown hillocks disguising torn\
    \ wreckage, providing proof aplenty that the area has witnessed its fair share\
    \ of tragedy over the years.\n\n## Air crashes\n\nSadly, very few of the local\
    \ crash sites have revealed enemy aircraft – the majority tell sad stories of\
    \ the multiple loss of young Allied lives. In October 1940 a Whitley bomber was\
    \ returning from a raid on the Stettin oil plant in Poland when it ran out of\
    \ fuel. The five-strong crew baled out safely but for some unknown reason their\
    \ plane had not been pointed out to sea and flew on as the crew slowly descended\
    \ to earth. Three miles south-west of Bellingham, the stricken bomber hit high\
    \ ground and eventually crashed at the Meslings. Among the crew of the `Whitley`\
    \ was Sergeant Mark Alfred Niman, who began serving as a wireless operator with\
    \ `10 Squadron` at `RAF Leeming`, where the aircraft was based. The crew eventually\
    \ landed eight miles south at `Ladyhill`, near Stonehaugh, and spent a cold night\
    \ sleeping wrapped in their parachutes.\n\nOnly two weeks after the `Whitley`\
    \ crashed, a Vickers Wellington bomber from `RAF Newmarket` came down on its return\
    \ from a mission to bomb Berlin. Poor weather conditions and low visibility caused\
    \ the aircraft to crash on `Blakehope Fell`, west of Otterburn. It is thought\
    \ that the pilot opted to descend through the cloud in order to pinpoint their\
    \ position when the `Wellington` struck high ground. The aircraft crashed through\
    \ a dry stone wall and caught fire on impact, taking the life of one of the six\
    \ crew.\n\nIn July 1941 a `Hurricane` crashed into woods at `Fairley Farm`, Whittonstall,\
    \ the pilot breaking his ankle parachuting to safety. A `Spitfire` crashed at\
    \ `Wallington Hall` in August 1941, killing the pilot, the same day that `Mootlaw\
    \ Farm` at Ryal was hit by five bombs.\n\nIn September 1941, a `Hawker Hurricane`\
    \ from `Crosby-on-Eden` was forced to make a wheels-up landing after the fuel\
    \ level became low in bad weather. The `Hurricane` was on a camera gun exercise\
    \ when the French pilot, Sous-Lieutenant Jean de Tedesco, came down successfully\
    \ at `Yarrow`, Falstone. A local man reported seeing an aircraft flying very low\
    \ up the North Tyne Valley from the direction of Bellingham and saw it come down\
    \ in a field at the foot of `Yarrow Bank`. By the time the man reached the aircraft,\
    \ Jean de Tedesco was sitting on the wing, having already contacted his base,\
    \ and allowing local children to sit in the cockpit.\n\nAnother `Hurricane` crashed\
    \ into the summit of `Peel Fell` at Kielder, killing the pilot in November that\
    \ same year. Pilot Officer Hukum Chand Mehta (24) of the Royal Indian Air Force\
    \ was piloting one of four `Hurricanes` which took off from `RAF Acklington` for\
    \ a formation flying exercise. Mehta, of `43 Squadron`, was leading the formation\
    \ but went missing on the return journey. The next two days were spent searching\
    \ for the aircraft to no avail until a local shepherd reported seeing the aircraft\
    \ crash into the hillside at incredible speed, leaving only the tail unit visible.\
    \ Mehta’s body was found some distance from the point of impact, buried under\
    \ 8ft of peat. \n\nThere was no let-up for Christmas in 1941, with another `Hurricane`\
    \ crashing while flying low near `Ovingham`. Also in December a `Westland Lysander`\
    \ came down at `Otterburn` while taking part in an artillery cooperation exercise\
    \ over the ranges. The pilot, Flying Officer J.K. Astin, noticed the engine beginning\
    \ to cut out after arriving at `Otterburn` from `RAF Clifton`. Unable to rectify\
    \ the problem, he was forced to land on soft, uneven ground, causing the aircraft\
    \ to overturn on landing. Luckily Astin escaped without injury and the aircraft\
    \ was later salvaged.\n"
  raw: 'Herr X witnessed old people being beaten to death and sadistic crimes of every
    form of cruelty being perpetrated. On several occasions, all 20,000 prisoners
    in a camp built to hold 5,000 were woken in the middle of the night to witness
    mass hangings. Everyone who died in the camp was cremated and their ashes sent
    to relatives, who were not allowed to ask how or why they had died. Relatives
    were allowed to send parcels, but inmates had to queue for them, sometimes for
    as long as a whole day. If parcels contained tobacco or fruit they were confiscated
    by camp officials and letters from home were torn up in front of their intended
    recipients.


    Food consisted of a drink the colour of coffee and a quarter of a piece of bread
    for breakfast, soup with the faintest trace of meat for lunch and small pieces
    of heavily salted sausage and salted herring for evening meal. Herr X said: ‘This
    was another form of torture, for we were not allowed water and if you took your
    supper, you suffered a terrible thirst all night.’


    He spoke of the despair of the majority of the German people who had been dragged
    into a war they did not want by a government which ruthlessly put down any hint
    of resistance to the Nazi party.


    There was much sympathy for the plight of Second Officer Cyril Clemitson of Brigwood,
    Haydon Bridge, who was close to the end of a 50,000-mile journey to the Far East
    and back in the Newcastle steamer Dalryan when it struck a mine just off the south-east
    coast of England.


    He told the Courant: ‘I was having forty winks in my cabin before getting the
    landing gear ready when I was aroused by a terrifying noise. The metal side of
    the ship was ripped apart like so much paper. My cabin was completely shattered;
    my radio, wardrobe and other furnishings were turned to matchwood. I groped around
    for my torch and lifebelt and ran up on deck where a second explosion occurred
    and we had to take cover from falling wreckage.’


    Fortunately, all thirty-eight crew members were rescued, as the explosion had
    been seen from the shore and, in Second Officer Clemitson’s words, the only casualties
    were ‘my goldfish and somebody else’s canaries’.


    The first Christmas of the war brought quiet defiance, with the shops reporting
    better trade than before the conflict. The Post Office reported a big increase
    in the number of greetings cards exchanged. Many local men serving with the forces
    were home on leave so there were some happy family reunions. And while many of
    the evacuees went home for the festive season, others remained in Tynedale, with
    one big party for the incomers held at the Masonic Hall in Hexham where dance
    music was provided by the Jolly Millers.


    A major feature of Christmas Day was the Empire link-up programme on the wireless,
    in which the Corbridge Carol Singers took part, concluding with a message to the
    Empire from King George VI. The Corbridge broadcast took place from the home of
    84-year-old J.T. Mail at Roecliffe Lodge. The carols sung were Silent Night and
    We Three Kings of Orient Are, accompanied by Jack Armstrong, the well-known Northumbrian
    piper.


    The wards of Hexham War Memorial Hospital were gaily decorated with streamers
    and other items made by the nurses and the patients themselves. Several soldier
    patients received gifts of woollens knitted by the nurses. The Post Office coped
    well with the avalanche of mail despite the problems caused by the blackout, with
    most people heeding the plea to post early for Christmas.


    ### 1940


    Despite being thought of as more of a retreat for safety than a hive of activity
    during the Second World War, Tynedale is not entirely devoid of evidence that
    the conflict took place. The district is littered with boggy craters and overgrown
    hillocks disguising torn wreckage, providing proof aplenty that the area has witnessed
    its fair share of tragedy over the years.


    ### Air crashes


    Sadly, very few of the local crash sites have revealed enemy aircraft – the majority
    tell sad stories of the multiple loss of young Allied lives. In October 1940 a
    Whitley bomber was returning from a raid on the Stettin oil plant in Poland when
    it ran out of fuel. The five-strong crew baled out safely but for some unknown
    reason their plane had not been pointed out to sea and flew on as the crew slowly
    descended to earth. Three miles south-west of Bellingham, the stricken bomber
    hit high ground and eventually crashed at the Meslings. Among the crew of the
    Whitley was Sergeant Mark Alfred Niman, who began serving as a wireless operator
    with 10 Squadron at RAF Leeming, where the aircraft was based. The crew eventually
    landed eight miles south at Ladyhill, near Stonehaugh, and spent a cold night
    sleeping wrapped in their parachutes.


    Only two weeks after the Whitley crashed, a Vickers Wellington bomber from RAF
    Newmarket came down on its return from a mission to bomb Berlin. Poor weather
    conditions and low visibility caused the aircraft to crash on Blakehope Fell,
    west of Otterburn. It is thought that the pilot opted to descend through the cloud
    in order to pinpoint their position when the Wellington struck high ground. The
    aircraft crashed through a dry stone wall and caught fire on impact, taking the
    life of one of the six crew.


    In July 1941 a Hurricane crashed into woods at Fairley Farm, Whittonstall, the
    pilot breaking his ankle parachuting to safety. A Spitfire crashed at Wallington
    Hall in August 1941, killing the pilot, the same day that Mootlaw Farm at Ryal
    was hit by five bombs.


    In September 1941, a Hawker Hurricane from Crosby-on-Eden was forced to make a
    wheels-up landing after the fuel level became low in bad weather. The Hurricane
    was on a camera gun exercise when the French pilot, Sous-Lieutenant Jean de Tedesco,
    came down successfully at Yarrow, Falstone. A local man reported seeing an aircraft
    flying very low up the North Tyne Valley from the direction of Bellingham and
    saw it come down in a field at the foot of Yarrow Bank. By the time the man reached
    the aircraft, Jean de Tedesco was sitting on the wing, having already contacted
    his base, and was allowing local children to sit in the cockpit.


    Another Hurricane crashed into the summit of Peel Fell at Kielder, killing the
    pilot in November that same year. Pilot Officer Hukum Chand Mehta (24) of the
    Royal Indian Air Force was piloting one of four Hurricanes which took off from
    RAF Acklington for a formation flying exercise. Mehta, of 43 Squadron, was leading
    the formation but went missing on the return journey. The next two days were spent
    searching for the aircraft to no avail until a local shepherd reported seeing
    the aircraft crash into the hillside at incredible speed, leaving only the tail
    unit visible. Mehta’s body was found some distance from the point of impact, buried
    under 8ft of peat. He was the son of Karam Chand Mehta, of Lyallpur, Pakistan;
    he was cremated at Newcastle’s West Road Crematorium.


    There was no let-up for Christmas in 1941, with another Hurricane crashing while
    flying low near Ovingham. Also in December a Westland Lysander came down at Otterburn
    while taking part in an artillery cooperation exercise over the ranges. The pilot,
    Flying Officer J.K. Astin, noticed the engine beginning to cut out after arriving
    at Otterburn from RAF Clifton. Unable to rectify the problem, he was forced to
    land on soft, uneven ground, causing the aircraft to overturn on landing. Luckily
    Astin escaped without injury and the aircraft was later salvaged.'
