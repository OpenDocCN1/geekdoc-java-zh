    他们八人分为两组，约瑟夫（Josef）和他的两个伙伴沿着南泰恩河一直上走到尔斯顿（Alston）。然而，当地警官威尔逊（PC Wilson）拦住了这三个人并“发现他们是德国人”，并在休假的士兵约翰·福塞特（John
    Fawcett）的帮助下，将这些人带到了警察局。威严的威尔逊警官还在位于尔斯顿附近的哈尔登磨坊（Haldon’s Mill）逮捕了其他五名逃犯中的四名。那组选择过河是为了让用来追踪他们的猎狗失去气味，但小组中一名德国空军卡尔·克罗普（Karl
    Kropp）最后被看到试图涉过涨水的南泰恩河，水没过腰。


    三天后，他的遗体在赫克斯姆（Hexham）的泰恩河被找到，他被埋在赫克斯姆墓地的战区区域，棺盖覆盖着��字旗，由六名空军战友抬送。另外六名德国战俘在武装护送下走在棺材后面。当棺材降入墓穴时，所有德国人都行了军礼并脱下帽子。仪式结束时，每位战俘都走到墓旁行礼，并各向棺材上撒了三把泥土，然后再次行礼并回到队列。


    克罗普的遗体在 1958 年被挖出，与在赫克斯姆去世的其他战俘一同被送回了德国。


    # 第七章


    ## 管理和平


    当胜利的盟军直逼柏林时，许多战俘被遣返回泰恩代尔（Tynedale），每个人都有关于他们所遭受的苦难的故事。其中包括赫克斯姆的乔治·克拉克（George Clark）下士，他在
    1942 年服役于皇家诺森伯兰郡掷击团期间，在骑士桥（Knightsbridge）被俘。


    他在意大利被关押了一年，随后被转往西西里西亚（Silesia）的一个营地，该地于 1945 年 4 月被美国人解放。他告诉《快报》（Courant），随着美国人的逼近，德国守卫撤退并升起了白旗，但这些美国陆兵为了追击撤退的德国军，绕过了小镇。有两天没有守卫值班，但很明显美军短期内不会回来了，守卫重新上了岗，白旗也被拉了下来。


    当美国人终于回来时，联合国旗和星条旗在营地上空飘扬，战俘们用他们的床单做了“战俘”的字样。克拉克下士说：“欢呼声震耳欲聋。”


    ![图像](img/f0175-01.jpg)


    在当了三年战俘后，来自赫克斯姆的乔治·克拉克下士在美军解放营地后，经历了长达 530 英里的徒步，体重因此减轻了三又半石磅（约 22 公斤）。


    然而，他的磨难并没有结束，因为在释放后，他面临着长达 39 天、530 英里的路程才能回家，在此期间他又减轻了三又半石磅。令人惊讶的是，他对他的俘者似乎并没有产生仇恨，他说这些俘者尊重死者，并为伤员尽尽所能。


    他说，英国与他离开的国家相比似乎没有太大区别，尤其是当监狱营地周围流传国家处于饥饿边缘、人们除了黑面包外无物吃时。


    ![图像](img/f0176-01.jpg)


    《赫克斯姆快报》在头版如何迎接欧洲胜利日的消息。


    ### 欧洲胜利


    当欧洲胜利最终于 1945 年 5 月 8 日确认时，泰恩代尔收到的消息引起了克制的喜悦，而非疯狂的狂欢。除了装饰华丽的街道和商店橱窗，以及大多数人在外套上戴着爱国标志外，那里就像赫克斯姆一个普通的集市日。赫克斯姆县法院的法官脱掉了假发和法袍，在判决时改戴了一个红白蓝三丝花。


    修道院广场上立了一个扬声器，用来听首相温斯顿·丘吉尔宣布停火，赫克斯姆修道院的钟响起了胜利之钟。那天晚上，超过 1000 人挤进教堂，参加由院长 A.G.
    哈迪（Canon A.G. Hardie）牧师主持的感恩仪式，整个地区也举行了类似的活动。当地点了许多篝火，其中包括急诊医院内的一堆，那里仍有许多人在接受战伤治疗。在欧洲胜利日当天，酒吧、俱乐部和其他许可经营场所被允许开放到晚上
    11:30，但实际上，由于啤酒和烈酒短缺，大多数地方在正常时间就关门了。


    在奥伦代尔（Allendale），当地小学生搭建了一个巨大的篝火，并由一位前战俘汤米·谢尔德（Tommy Shield）下士点燃；而在海德登桥（Haydon
    Bridge），当地红十字会的青年分队在他们的胜利篝火上焚烧了希特勒的人偶。整个地区举行了露天舞会、运动会和其他庆祝活动，但没有哪一次能达到第一次世界大战结束时的那种狂欢规模。


    奥伦代尔也发生了悲剧，26 岁的哈罗德·菲利普森（Harold Phillipson）在参加完胜利日派对后选择穿过荒丘步行回辛德霍普（Sinderhope），他不慎掉下桥的护栏，坠落
    30 英尺死亡。


    人们对给予德国战俘的慷慨食物配额表示担忧，因为当时英国人不得不依靠配给制度日。赫克斯姆区委员会（UDC）主席乔·库伦（Joe Cullen）议员表示，德国人吃得比英国人好，这简直是耻辱，并补充道：“在不违反日内瓦公约的情况下，我确定可以将德国战俘的配给降低到英国平民的水平。我们是一个奇特而卓越的民族，似乎对敌人非常慷慨。我们在配给上没有受到任何伤害，德国人也不会如此。这些人人回到德国时会精力充沛，不知道未来该怎么办。”


    ![图像](img/f0178-01.jpg)


    在佩斯角（Peth Head）举行了一场胜利茶会，每个家户都贡献了食物。在奇装比赛之后，举行了一场游行。


    欧洲胜利后的周日，修道院举行了另一场感恩仪式，在此之前是民防部门和其他组织的游行，其中包括赫克斯姆区委员会的成员。游行的还有赫克斯姆区警察和特别警察、英国军人团、民兵军以及红十字会的男、女、青年队、军官训练团、空军训练团、童子军、女童军和妇女辅助兵。


    欧洲胜利的兴奋情绪被部分抑制，因为泰恩代尔的男人们仍在远东与日本人战斗，仍有生命损失。不过，这也意味着某种回归常的迹象，因为将举行大选，当工党宣布将对赫克斯姆的议员道格拉斯·克利夫顿-布朗（Douglas
    Clifton-Brown）推出候选人时，引发了愤怒，他在 1943 年被选为议会议长。按照传统，政党不会反对议会议长的候选人，因为他是整个议会的代表，而非单一政党的代表。


    尽管如此，工党选择了北方工人运动的先驱哈罗德·史密斯（Harold Smith）作为候选人，但史密斯后因“个人原因”退出了，接力棒给了来自利兹的导师欧内斯特·卡瓦纳（Ernest
    Kavanagh），他是利兹市会最年轻的成员。

