  trans: '

    英国空军被恰当地归功于在 1940 年那个黑暗的日子拯救了英国。当时，英国远征军刚刚被强大的德国战争机器蔑视地驱逐至敦尔克海峡。赫尔曼·戈林的`Luwaffe`（德国空军）正轰炸伦敦，英国加入在希特勒的皮靴统治下的欧洲其他国家似乎只是时间问题。


    但从全国各地的小机场起飞的，像一群骚扰猛禽的鸣鸟一样，云般的`喷火机`和`飓风战斗机`肆虐着德国的轰炸机和护航机，极大地削弱了德国的战争努力，导致入侵计划被推迟。尽管像肯特郡的`Biggin
    Hill`和`Duxford`等机场留在英国人的集体记忆中，但泰恩代尔（Tynedale）也为丘吉尔那不朽的名言贡献了自己的力量：“在人类冲突的领域，如此多的人竟亏了如此少数的人。”


    ### 乌斯顿皇家空军基地 (RAF Ouston)


    如今位于哈洛山（Harlow Hill）的`Albemarle Barracks`最初始于`乌斯顿皇家空军基地`。它建于二战早期，作为一个战斗机站，是东北部最繁忙的基地之一。该机场于
    1941 年 3 月 10 日正式开放，其首个作战单位是`317 (Wilenski) 中队`的`飓风战斗机`，这是在 4 月底月底抵达的新一批波兰战斗机部队之一。波兰人很快就对护航巡逻的常规工作感到厌倦，并不断抱怨该地区缺乏德国飞机供其进攻。


    他们没有等多久，因为 5 月 7 日，28 架敌机袭击了泰恩赛德（Tyneside）——乌斯顿就在目标名单上。该机场遭受了一架孤立的`容克斯 88`战斗轰炸机的协同攻击，该机投掷了十枚炸弹，然后在低空盘旋并对机场进行机枪扫射。它最终被哨塔上的`刘易斯`机枪火力击退，但导致
    16 名飞行员受伤，3 架飞机受损。


    当时在米克利（Mickley）担任 15 岁学徒木工并在机场工作的艾万·西摩尔（Ivan Seymour）目睹了这次轰炸。他说：


    > “这是一个狡猾的入侵者，我从当时住在米克利的`Rosedale`的降落窗观察着他。那里是一个绝佳的观察点，我可以观察到`乌斯顿`上方发生的一切。

    >

    > 掉落了五枚 500 磅炸弹，幸运的是，唯一一枚可能造成严重破坏的炸弹没有爆炸。它滑过拱门掉落在`NAAFI`（空军福利协会）建筑后的院子里，在造成任何真正严重的破坏之前就停住了。任何意识到`NAAFI`在战期间关键作用的人都会理解如果这枚炸弹爆炸了后果将有多么严重！

    >

    > 在炸弹被拆除、移除并清理现场之前，那里的‘茶和点心’严重短缺。”


    波兰飞行员对行动的渴望在 6 月 2 日得到了满足，当时两名乌斯顿的飞行员在泰内茅斯（Tynemouth）海外击落了一架`容克斯 88`。当波兰人被一个`喷火机`中队取代时，乌斯顿作为国际联盟机场的角色继续延续，尽管该中队被称为`肯特郡郡`，但实际上几乎完全由比利时飞行员组成。


    1941 年 9 月，乌斯顿再次遭到袭击，一枚炸弹在机场中心炸出一个宽 20 英尺、深 6 英尺的坑。炸弹炸断了水管并炸破了几扇窗户，但人员和飞机均无伤亡。


    同月，一架`喷火机`在进近乌斯顿时坠毁，导致一名加拿大飞行员牺牲，他安葬在`斯坦姆福德姆教区教堂`（Stamfordham Parish Church）墓地。另一名加拿大飞行员在乌斯顿`WAAF`（英国空军妇女辅助队）宿舍附近的`飓风战斗机`迫降时遇难。1942
    年基地的开始非常糟糕——一名在跑道上除雪的民工被一架滑脱的`喷火机`撞死，另一名飞行员在第二天于`喷火机`与`虎蛾式`的相撞中去世。


    著名的夜间战斗机`波尔顿·保罗挑战者式`（Boulton Paul Defiant）于 10 月抵达乌斯顿短暂停，但未与敌军接触。


    1942 年，乌斯顿承担了海空救援部队的新角色，最初使用改装的`挑战者`向被困的飞行员投送救生艇，后来使用了另一种更早时代的双翼水陆机`黄牛`，然后是装备更好的`安罗·安逊号`。


    驻守乌斯顿不太成功的单位之一是`226 中队`，配备了新型美国制双引擎`道格拉斯·波士顿`轰炸机。恶天气推迟了这十二架飞机的抵达，在当天结束前，其中三架发生坠毁，造成一人死亡。一架在进近时发动机熄灭坠毁，另一架在两个发动机失效后在`格特惠廷顿`（Great
    Whittington）的田里腹着陆，第三架则在机场上进行了一次壮观的迫降。


    1943 年 6 月，乌斯顿发生了另一场悲剧，两架`喷火机`在进近机场时空中相撞，两名比利时飞行员均当场死亡。


    乌斯顿后续的角色包括拖曳靶练习用的阻力靶，随后作为空中观测哨站。它还是使用空中雷达的先驱站之一，令人难以信的是，曾一度有 50 多架`安逊号`驻在此。`威灵顿`轰炸机也被改装为雷达训练机，其中
    29 架驻在乌斯顿，外加近两架`飓风战斗机`为雷达训练员提供移动目标。


    在欧洲战争结束前四天，乌斯顿失去了它仅有一架`飓风战斗机`，该飞机发生发动机故障并在`埃肖特农场`（Eshott Farm）腹着陆。


    与那个时代不同的是，`乌斯顿皇家空军基地`的宿舍设有中央供暖和自来水，这深受飞行员和军官的欢迎。基地建造了大型站总部和精密的、受高度保护的控制室，表明该机场在开放后可能具有重要作用。此外还有为军官、士官和飞行员准备的舒适食堂。


    机场有三条跑道，最长的一条有 1400 码，而且在那个时代不寻常的是，它们的设计几乎在一点交汇。这种设计不受待，因为一旦遭到敌军攻击，一组精准的炸弹可以一次性关闭三条跑道。由于敌袭概率极高，乌斯顿甚至在`庞特兰德`（Ponteland）北部的`贝瑞克山`（Berwick
    Hill）建造了自己的诱饵机场。


    在铺设沥青层之前，`皇家空军`就已经利用乌斯顿平整的草地了。它是`第 13 集团通信飞行队`轻型飞机的所在地，该飞行队使用一系列飞机，包括爆发时被征用的民用飞机。除了像`格洛斯特·角斗士`这样老可靠的军用双翼机外，还有许多被遗忘的机型如`珀西瓦·维加鸥`（Percival
    Vega Gull）和`迈斯·惠特`（Miles Whitney Straight）。乌斯顿还被驻在`哈灵顿厅`（Hallington Hall）的第 3
    号无线电段校准飞行队使用。

    '
- fmt: '

    However, its reports of a lone Messerschmitt flying in low over the Northumberland
    moors were laughed off by staff at `RAF Fighter Command` in Middlesex, for `Ottercops`
    did not enjoy a reputation for reliability – it was known for its inability to
    distinguish between thunderstorms and incoming aircraft. Designed to provide long-range
    early warning of enemy attack, the intelligence it provided had been questioned
    the previous year when, in August 1940, it reported thirty hostile aircraft approaching
    the coast from the north. But when the four Spitfires scrambled by `Ottercops`
    got into the skies, they were horrified to discover ninety German bombers escorted
    by a further twenty-one fighter planes!


    Women’s Auxiliary Air Force Corporal Felicity Ashbee remembered there had been
    little to do on the evening of 10 May 1940, until a single counter was put down
    on the map at `Fighter Command` – far out in the North Sea, off the coast of Northumberland
    – picked up by `Ottercops` Moss. The three members on duty laughed and thought
    the country bumpkins were confused again.


    When first plotted, the height of the Messerschmitt was about `15,000ft`, travelling
    almost due west at `300mph`. `Ottercops` reported the potential raid as ‘three
    plus’ but, as the aircraft approached, four other stations (Danby Beacon, Douglas
    Wood, Bamburgh and Cresswell) correctly identified it as a single aircraft. The
    aircraft was designated ‘Raid 42’. By the time it was 50 miles off the coast,
    it had been reported to the `RAF`’s `13 Fighter Group` at `RAF Ouston` and at
    `22.30 hours` a Spitfire was scrambled.


    It was a full two days later when a BBC broadcast revealed that Hess – the deputy
    führer and Hitler’s right-hand man – had landed, somewhat unceremoniously – on
    the outskirts of Glasgow, where Hess revealed he wanted to meet the Duke of Hamilton,
    a man he believed he could do business with. Although Wing Commander Hamilton
    later professed himself bewildered about why he had been chosen, Hess believed
    their common interest in aviation, their pre-war desire to avoid war between Britain
    and Germany and their mutual friendship with Albrecht Haushofer (son of Karl Haushofer,
    professor of geopolitics and main architect of the `Lebensraum` philosophy hijacked
    by Hitler) would pave the way to talks.


    Hess dressed himself in the uniform of a `hauptmann` (a captain) in the Luftwaffe
    and equipped himself with a `Leica` camera and numerous pills for both his real
    and his imaginary ailments – he was known to be something of a hypochondriac.
    He had memorised his flight route and then strapped his flight plan to his right
    thigh. Hess flew over the North Sea on a course that kept him well below the horizon
    of British radar, at least 200 miles from the English coast. The weather was clear
    and a full moon was rising by the time he turned due west and began approaching
    the North East coast, but with an hour to go before sunset, he feared being spotted
    and shot down by an `RAF` fighter.


    He later told the Duke of Hamilton he had compensated by circling just off the
    coast for forty minutes until the sun began to set. Hess was travelling too fast
    to be intercepted and in letters he later wrote to his wife, he said he was enjoying
    himself at that stage, flying at full throttle. He climbed the slope of The Cheviot,
    which rises to `2,676ft`, and slid down the other side into Scotland, he said.
    Hess failed to spot Hamilton’s Dungavel House in the darkness and overshot his
    mark. As his fuel began to run out, he took the decision to bale out.


    The plane crashed on to Bonnyton Moor, 10 miles south of Glasgow, while he landed
    on a farm nearby. He was found by head ploughman David McLean, who asked him ‘Are
    you German?’ Hess replied: ‘Yes, I am Hauptmann Alfred Horn – I have an important
    message for the Duke of Hamilton.’


    McLean’s elderly mother made the finicky Hess a pot of tea (but he declined it
    in favour of a glass of water) while admiring his well-cut uniform and his expensive
    watch. A farmhand had been dispatched to find someone in authority and Hess was
    soon on his way to the Tower of London, the first of three prisons where he was
    held during the following months. He tried to commit suicide twice. In the meantime,
    an announcement on German radio said Hess had flown the country, adding that the
    deputy führer had been suffering hallucinations and mental illness for several
    years.


    Despite strong evidence that he was indeed psychotic, Hess was found fit to plead
    at the Nuremberg War Trials. He was accused of many crimes, including plotting
    to wage war and issuing the directive that allied airmen baling out over German
    territory should be ‘liquidated’. He was found guilty and sentenced to life in
    prison. He served his time in Spandau Prison in Berlin, where he finally succeeded
    in committing suicide in August 1987, at the age of 93.


    The new year came in with a fancy dress ball at Hexham Hydro, where one brave
    soul turned up as Mussolini and was summarily drummed out of the hall.


    There was a lucky escape for a 26-year-old Hexham man, who was crossing the Newcastle
    Carlisle railway line at Quality Cottages, near Warden, when his car stalled on
    the line. As John Longstaff tried to restart the engine, the vehicle was smashed
    into by a goods train and carried half a mile along the track on the buffers of
    the engine.


    His mother-in-law, Mrs I. Huddlestone, witnessed the incident from her bedroom
    window as she waved him off and was convinced he had been killed. She told the
    `Courant`: ‘The goods train was heavily laden and was travelling quite fast. I
    saw the train before John did, but was too shocked to call out. I closed my eyes
    at the moment of impact, and then called out to my daughter that John was gone.
    All that was left on the track was the hub cap off one of the car wheels and I
    never expected to see John alive again.’


    However, John not only survived with minor cuts and bruises, but was able to return
    home the same day. He said: ‘The car had been running perfectly, but then stalled
    in the middle of the line. I was examining the dashboard and the self starter
    when I heard the train coming. I looked up and the engine was just 20 yards from
    the car. I hadn’t time to do anything other than remain in the driving seat with
    eyes closed, hoping for the best. The next thing I knew I was outside the car,
    having pieces of sticking plaster affixed to the small cuts on my face. I remember
    nothing of the accident at all.’


    January 1941 also saw the introduction of school meals, known as communal feeding
    on their inception, which were served in the pleasant canteen in the Queen Elizabeth
    Grammar School. Some 140 children were catered for in two sittings, at a cost
    of `4d` per single meal, `1s 3d` for a week and `2s 4d` for a week’s meals for
    two children from the same family. The charges covered only the cost of buying
    the foodstuffs, with the remainder of the cost met by the county education committee.


    A Corbridge café proprietor was fined `10s` and order to pay costs of `30s`, when
    she was discovered to be selling watered down milk. A test purchase at the River
    View Cafe of a glass of hot milk served to a man from the county weights and measures
    department was found to contain 36 per cent added water. It emerged that a pint
    of water had been added to two pints of milk, but the defendant said the hot milk
    had been served in error, as it had been set aside to be used in the making of
    coffee.


    Those irresistible funmakers of stage and screen, Jack Hulbert and Cicely Courtneidge,
    made a personal appearance at the Forum Theatre in Hexham, where they gave a special
    free matinee performance for all forces personnel. The entire downstairs accommodation
    in the theatre was reserved for servicemen and women in a performance made possible
    by the fact the West End stars were personal friends of Major and Mrs P.P. Phillips
    of Summerrods, Hexham.

    '
