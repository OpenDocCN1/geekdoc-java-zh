    As a teenager, former Sinderhope farmer Cyril Forsyth got to know an Italian PoW,
    Alberto Catena, who joined a dozen other imprisoned Italians doing drainage work
    at his father, Alec’s, farm, High Acton. Alberto was the only one who talked to
    the family and shared a drink with them and before leaving Alberto presented the
    teenage Cyril with a hand-made cigarette tin engraved with his name alongside
    Alberto’s, with the date 6-5-1944, ‘Catton’, some holly sprigs, an old fashioned
    lantern and a cat. Cyril recalled: ‘He never talked about how he got captured
    or anything. I thought it was very nice what he did. He must have had a little
    pin and hammer. I think he probably gave it to me because of the kindness my family
    showed to him and it would have been something to entertain him.’


    Cyril remembered seeing the PoWs around the village and at the age of 17, even
    worked on Catton’s Stone Hall Farm, where the PoW camp was based. Although he
    recalls no problems with the Italian prisoners, who were not under constant guard,
    he was frightened by the Germans who were often more heavily guarded. He said:
    ‘I was ploughing the land in Catton when I was about 17 and couldn’t keep straight
    for the sight of the Germans. They were working surrounded by sentries with guns,’
    he added. ‘The Italians didn’t want to be in the war. They never talked about
    home. It would’ve been very difficult left in a strange country.’


    Catton’s Italian prisoners also left a mark by carving their PoW IDs into beech
    trees in Allen Banks woodland, and prisoners in the Byrness PoW satellite camp
    667 did something similar.


    There was an interesting development at Wylam, where German prisoners had their
    headquarters in Nissen huts while working on local farms. Among them were a carpenter
    and stonemason, who decided to augment the neat gardens they had created around
    the huts with something special. Over a period of just eight days, they built
    a mini castle in the gardens, with four towers, electric lighting and elaborate
    tapestries and carpets they had made themselves.


    The three-foot high masterpiece was made using stones lifted from the bed of the
    Tyne by fellow prisoners, and the roof was made out of tins salvaged from the
    camp kitchens. Prisoners also constructed the furniture, embroidered tapestries
    and wove the carpet for the grand banqueting hall. Electricity was piped in from
    the Nissen huts and an ingenious homemade device allowed the front door to be
    opened and closed electronically. Wylam Castle even had its own ornamental fountain.


    A discreet panel above the front door read ‘Built by German prisoners’ and it
    was intended as a lasting reminder of their stay in Wylam. Completed in 1947,
    it attracted hundreds of sightseers over the next two years, but some villagers
    were unhappy about this reminder of the war years, no matter how cleverly constructed.
    One day in May 1949, a lorry appeared on the site, and the castle was lifted from
