    1942 年 3 月 22 日，Wark 的居民听到头空有一架单引擎飞机引擎的声音。澳大利亚军士克拉里·哈克（Clarrie Harker）是`RAF Usworth`一架`Hurricane`战斗机的飞行员，这架飞机在未能成功从仰角中拉出后，垂直向地面俯冲。他设法跳出了机舱，留下`Hurricane`坠落在
    Moat Hill 农场的一块田里，并在火球中爆炸。哈克的降落伞挂在了附近的一棵树上，使他悬挂在半空中。当地孩子们赶到现场，发现村里的一位年老女性正对着他大骂脏话，误把他当成了德国人。


    北泰恩著名的坠机事故之一发生在 1943 年 2 月，当时一架美国`Mustang`战斗机以约每小时 400 英里的速度撞 Bellingham 附近的 Hareshaw
    Head 的一处沼泽山坡。飞行员仅 22 岁的飞行军尉约翰·菲舍尔（Johnny Fisher）遇难，一支`RAF`救援队在沼泽中挖掘了 16 英尺深才寻回了他的遗体。


    1943 年 3 月，一组六人乘坐一架`Vickers Wellington`轰机坠毁。从`RAF Harwell`起飞后，事故原因仍是一个谜团，但飞机在
    Greenhaugh 的 Comb Moor 冒着火坠落在此。调查表明，飞行员可能失去了控制，导致飞机俯冲进荒地的一处泥炭沼，造成全体机员遇难。


    一架来自诺森伯兰郡 Wooler 附近`RAF Milfield`的`Hurricane`战斗机于 1943 年 6 月坠毁在 Elsdon 的`Ottercops
    Moss`。飞行飞行军士约翰·盖茨（John Gates）在坠毁中昏迷，但在飞机停止移动时恢复了意识。他在未能从一次低空俯冲动作中恢复后，被附近附近的士兵从残骸中救了出来。


    遭遇悲剧命运的不只有盟军飞机，1943 年 3 月 25 日，一架德国`Dornier`轰炸机在罗马墙附近的 Twice Brewed 附近的 Steel
    Rigg 被一架夜战机击落。四名机组成全部遇难，并葬在卡莱斯尔。


    ![Image](img/f0030-01.jpg)


    这张 1940 年 1 月的海报解释了配给制的现实。


    混乱一直持续到 1944 年，同年 4 月，年仅 20 岁的军士西里尔·杰克·朱威尔（Cyril Jack Jewell）在他的`Spitfire`战斗机撞上
    Wark 的 Houxty Woods 时牺牲。


    1940 年带来了新的配给规定，黄油、培根、火腿和糖都需要券。黄油、火腿和培根的基本配额每人每周 4 盎司，糖的配额为每人每周 12 盎司。对于想要制作果酱或养蜂的人，提供了额外的糖供应。在外工作的人还被告知，他们可以在不使用任何券的情况下订购培根、鸡蛋、圆面包和黄油，他们的茶也会随附提供糖。


    被店主们称为“票券一”（Coupon Monday）的日子进行得有序，但并没有急于领取双倍培根配额。一位肉铺师说：“我们的培根柜台很冷清，对额外配额的需求很小。政府设定的培根价格阻止了人们购买。普通的主妇认为培根和火腿是某种可以轻易放弃的奢侈品——购物者负担不起每磅
    1 英镑 8 便士的培根。普通主妇正在忍受，用更便宜但提供同等营养的食物来养活家人。”


    战争初期几年引起了公众关注的是威廉·乔斯（William Joyce）那尖锐的语调，他从第三帝国发出的“德国呼唤”广播为他赢得了“鹰勋爵”（Lord Haw-Haw）的绰号。很快就确定，乔斯对赫克斯姆（Hexham）并不陌生，在战前不久曾到该镇代表英国法西斯联合联盟传播宣传。他甚至去过`Courant`报办公室，为宣传他在
    1936 年在该镇上举行的一场会议。


    专栏作家 Hextol 在 1940 年 3 月回忆道：“我从他口中得知，他曾多次代表法西斯领袖奥斯瓦德·莫斯莱爵士（Sir Oswald Mosley）办事。我没有亲自报道过他的会议，但记录显示他曾请求结束国际金融和犹太人对市场的控制。他认为，一个经人民认可的领袖进行公开独裁，比国际金融的隐性独裁要好得多。”


    到年底，赫克斯姆医院供应仓库已派发了 7000 多物品，从 11 月初开始，仓库交付了 1000 双袜子、370 双手套、310 个头盔、300 条围巾和
    104 条针织毯。织者们使用白色羊毛为芬兰士兵制作护脸头盔，并为皇家海军制作海靴袜。拖鞋制造商也被迫切需要。


    南诺森伯兰马术俱乐部在 Hydro Hotel 举行了年度舞会，酒店装饰有俱乐部的色彩——紫色和金色。舞会音乐由 Clement Millard 乐队提供，《西格里德防线》、《Boomps
    a Daisy》、《兰贝斯漫步》和《栗树》证明非常受欢迎。


    天气在 2 月变恶化，记录到零下 34 度的霜冻，Allendale 和北泰恩的道路被大雪封堵。


    1 月 29 日发生了一次空袭警报，赫克斯姆所有学校的孩子进入了防空洞，他们的歌声包括《滚出木桶》和《跑吧，兔子，跑吧》。没有敌机进入泰恩河谷，25 分钟后响起了解除信号。


    灯空管制持续给泰恩郡（Tynedale）的人们带来许多问题，司机和行人在黑暗中挣扎，导致数人死亡。知名人物之一是`Courant`报最近退休的主记者弗雷德·古斯（Fred
    Guthrie），他被一辆双人自行车撞导致头部骨折。他去世时 71 岁，在报社工作了半个世纪。


    ![Image](img/f0032-01.jpg)


    ### 海员的故事


    战争第一年英国的早期胜利之一是击败德国口袋战舰“海军上将号”（Admiral Spee），这变成了著名的河口海战——而一位来自 Fourstones 的海员在摧毁舰队中发挥了作用。他是锅炉工查尔顿（Stoker
    Charlton），当时在“亚历克斯号”上，与“阿基琉斯号”和“埃克斯特号”一起围了该者，直到其最终在蒙特维的亚附近自沉。


    从南美水域返回家中享受 26 天休假后，锅炉工查尔顿说，胜利是因为“海军上将号”的船员是由年轻纳粹组成的，当他们发现预定目标可以反击时，他们就没有战斗斗志了。


    他告诉`Courant`：“他们的队长是一个真正的绅士，一个老派的人，但船员是由希特勒运动的年轻人组成的。在对我们发动一次进攻后，他们就没有战斗斗志了。当他们看到我们可以反击时，他们就不想战斗了。”


