    Fusiliers to be guest of honour at a special event at Stagshaw Church Hut, where
    he was feted for the actions which led to his being awarded the Military Medal
    for two separate acts of bravery with the British Expeditionary Force (BEF) on
    May 28 and May 31\. He continued to carry messages, both on foot and on his motor
    cycle, when under heavy shellfire and mortar attack. He never took cover or rested,
    but continued on all his journeys with dauntless courage, ensuring the rapid delivery
    of vital information. He was presented with a suitably inscribed gold watch from
    the Corbridge War Services Fund, at the conclusion of a whist drive.


    ![Image](Images/f0057-01.jpg)


    Military Medal winner Fusilier Roy Clarke (19) of Stagshaw who gained the award
    for bravery in delivering messages on foot and on his motor bike under heavy shell
    and mortar fire serving with the British Expeditionary Force at Viestraat and
    Moeres in May 1940.


    The courts were becoming increasingly severe on breaches of the blackout restrictions,
    with fines stepped up to as high as £4 – even for those not directly involved
    in closing curtains. Among those penalised that amount was the landlord of the
    Wheatsheaf Inn at Corbridge, who had ensured that all thirty-five windows at the
