  trans: '

    来自 Acomb Millersfield 的莎拉·贝尔（Sarah Bell）在 1939 年之前一直在 Ridsdale 农村担任起居女佣，她迅速自愿加入了了陆农军（Land
    Army）。她的第一个驻扎地是 `Belsay` 附近的 `East Shaftoe Farm`。她每周工作七天，负责挤奶、喂牛和驾驶拖拉机——她很快也精通了操作马犁。不过，她也有时间尽情玩乐。每周，女孩们都会去当地的村公堂（通常在
    `Belsay` 或 `Kirkwhelpington`）参加周五晚上的舞会。在那些年里，她们也建立了深厚的友谊，对贝尔夫人来说无疑也是如此。她在 `East
    Shaftoe Farm` 的陆农军队友玛丽·汤普森（Mary Thompson）成了她最好的朋友，后来还当她的伴娘。


    不过，有些社交经历是贝尔夫人并不怎么喜欢的。有一次，陆农军的女孩们聚集在 `Morpeth` 领取代表其服役等级的菱形别针，这就像士兵的条纹一样。在多番劝说下，她最终被说服和大家一起去一家酒馆庆祝。当时她只有
    25 岁，那是她第一次进酒吧。她说：“我从小生活的环境没接触过那种地方，所以我没待多久——他们中有些人只是为了喝酒。我很怕会有认识我的人走进来。”


    她对那些被雇来协助收割的临时工也无太印象深刻。“他们以前会从 `Ashington` 找人来帮忙采土豆，每个人都分配一段特定长度的任务。但是，如果你不盯着他们，他们就会把自己的份量也推给你。那群
    `Ashington` 的人真是一群古怪家伙！”


    `Hexham` 的议员道格拉斯·克利夫顿·布朗（Douglas Clifton Brown）在镇上的一场陆农军集会上赞扬了陆农女孩们的工作，并表示陆农女孩们的重要性与食物运输船的船员或护航运输队的船只一样重要。虽然他不希望贬低
    `WAFFs`（女子空军妇女）在预测器上、`ATS`（陆军辅助队）在炮位以及 `WRNS`（皇家女子海军辅助队）在其他战场所的工作，但在许多情况下，她们正在做与战前所做相同的工作。许多陆农女孩承担了对她们来说完全全新的工作，这些工作并不容易也不愉快。


    ![Image](img/f0097-01.jpg)


    `Tynedale` 全地的女孩被鼓励加入`辅助领土军`（Auxiliary Territorial Service），为战争努力贡献力量。


    女性贡献力量的领域不仅限于陆农军。1941 年 10 月，曾有人呼吁 `Tynedale` 的女性加入`辅助领土军`，这是武装军种的一个分支，旨在让女性从事士兵的常规工作，从而释放男性去执行战斗任务。


    `Tynedale` 分有 300 个名额待填补，年龄在 17½岁到 43 岁之间，如果是退役军人则为 50 岁。`劳工和国家服务部`通过 `Courant`
    报发布了一条给当地女性的消息，写道：“提醒 `Hexham` 的女性们她们所属著名郡团——皇家诺坎伯郡掷击团（Royal Northumberland Fusiliers）的辉绩，告诉她们不要让家里的男人失望。”


    基本工资为每天 1s8d，虽然这只是私人收入，但根据所承担的工作和通过的技能测试，可以增加到每天 2s10d 甚至 3s4d。根据兵种，一名军士每天约赚 4s6d，而上军士的工资可以达到每天
    9s4d。


    ### 火火式飞行员


    来自 `Greenhead` 的前 `Hexham Courant` 记者伍德罗·雷恩（Woodrow Raine）军士飞行员本人也成了新闻焦点，因为他被拍到了“喷火式
    Venture 1”战斗机的驾驶舱内，而这架飞机是由 `Midland Bank` 员工捐款购买的。在写给银行员工的信中，`雷恩军士飞行员`以非常帅气的英国皇家空军（RAF）风格写道：


    “抱歉没能立即回复，但正如你们想象的，我们最近忙于在法国度假，并与`梅塞斯密 109`们享受茶会。


    `Venture I` 是一台伟大的机器。我拥有它大约六个月了，在过去的两三周里，我们确实共同度过了生活，它现在几乎可以自己飞越法国了。它受到的唯一损伤是升降板上中了一颗弹，那是在我在法国的一个机场上集结用机枪扫射
    `109` 时被击中的。我在 30 英尺的高度飞过去，扫射了几架 `109` 和一些站在停机道上的纳粹。从他们向我发射的火力量来看，一定有人表示反对，但我们只带着那个弹孔逃之大幸。”


    ![Image](img/f0098-01.jpg)


    前 `Courant` 记者军士飞行员伍德罗·雷恩，坐在他由 `Midland Bank` 员工资助的喷火式“Venture I”战斗机中，他曾“在法国度假并与`梅塞斯密
    109`们享受茶会”。`雷恩军士`于 1941 年 8 月 21 日被击落身亡，葬在帕德卡莱尔省的圣奥梅尔（St Omer）。


    遗憾的是，雷恩的运气并没有长久；1941 年 8 月 21 日，他的喷火式在敦刻尔附近被一架 `Me109` 击落。他葬在圣奥梅尔的龙涅纪念墓（Longuenesse
    Souvenir Cemetery）。不过在此之前他也经历过惊险，他在 1939 年 2 月加入 `RAFVR`（皇家空军志愿备役队）成为学员飞行员。他在
    9 月 1 日被征召，完成训练后，在 `7 OTU Hawarden` 转换驾驶喷火式，并在 9 月 18 日的喷火式迫降中死里逃生。


    他于 1940 年 10 月 5 日被分配到北坎伯兰郡 `Acklington` 的 `610 中队`，同年 11 月 19 日，他又躲过一劫，当时他的喷火式在
    `Acklington` 着陆时轮胎爆了，起落架塌陷，飞机头朝下倾。


    ![Image](img/f0099-01.jpg)


    1942 年 6 月，发起了一项“每周一便士”活动，旨在募集资金为战俘提供红十字会包裹。


    1941 年夏末，在`哈德良墙`的阴影下聚集了一群戴着旧战争勋章的老兵，当时`第四营民兵卫队`的士官们聚在一起温习现代战争方法。他们乘坐私家车、卡车和自行车从
    `Prudhoe`、`Haltwhistle`、`Slaggyford` 和 `Blanchland` 。一位 `Hexham Courant` 记者写道：“对于某些人来说，这是自从一战以来第一次体验军营，但正如胸前五彩斑斓的丝所示，这勾起了
    25 年前的回忆。这支平民军队尽管有多年正规军经验，发现在现代战争方面有许多要学。”


    没有讲座，只有关于命令的下达与接收、第五人和伞兵的危险以及如何对付他们的讨论。演示了散击战中猎枪的使用，但当每个人都发一把猎枪时，那些百孔射穿的目标表明这些老兵在使用上指导。


    正规军官解释了《皇家条例》，在进行进一步练习后，他们躺在床上，`Courant`记者注意到：“对许多人来说，睡在帐篷里并不是什么舒服的新奇体验，但在经历了高强度的一天后，再加上无尽的轶事和过去的战争故事作为睡酒，他们陷入了甜甜的睡眠。”


    ![Image](img/f0100-01.jpg)


    来自 `Ramshaw Hunstanworth` 的玛格丽特·皮登，她在 91 岁生日时在为士兵织袜子。


    这个周末对民兵卫队成员非常受欢迎，以至于几个人预订了后续课程。


    ### 周日运动——有罪还是否？


    关于是否允许在周日在 `Prudhoe` 的公园内进行运动的棘手问题在 `Prudhoe UDC` 的会议上引发了一场神学分歧，牧师 `R.E. Robson`
    博士支持，而 `St John` 和 `Prudhoe Station` 的方法格教会表示强烈反对，`主日观察协会`也认为遵守主日比以往任何时候都更重要。

