    the Haltwhistle–Alston line at Featherstone. The queen, the former Elizabeth Bowes-Lyon,
    had family links with the Bardon Mill and Beltingham areas. Ridley Hall at Bardon
    Mill, now the boarding wing of Haydon Bridge High School, was owned by Francis
    Bowes-Lyon, the queen’s uncle, up to 1948\. He was a great benefactor to the area,
    carrying out a major rebuilding programme at Ridley Hall, and providing the lych
    gate and stained glass windows at St Cuthbert’s Church in Beltingham. He was also
    a survivor of the infamous ‘Wet Review’ of Scottish troops in Edinburgh in 1881
    where, as Master of the Queen’s Archers, he had the honour of holding an umbrella
    over Queen Victoria for four hours as the rain teemed down mercilessly.


    ### Medal winners and other local heroes


    Corbridge provided a double war hero in Captain John Richardson of the King’s
    Dragoon Guards, who was awarded a bar to his Military Cross. He was awarded the
    MC for his part in an attack on enemy positions south of Bir Hacheim in the Libyan
    desert near Tobruk in May 1942, and gained the bar following an action in the
    Marble Arch area of Libya when he volunteered to lead a 370-mile patrol which
    succeeded in cutting off a large part of the German army.


    ![Image](Images/f0140-01.jpg)


    Corbridge’s Lieutenant John David Benbow Richardson, of the King’s Dragoon Guards
    was Awarded the Military Cross for gallantry while serving with the Eighth Army
    in the Middle East. He was the great great grandson of Sir Alexander James Gordon,
    the last surviving captain who had served with Nelson.


    In recognition of his exemplary service, Captain Richardson was presented with
    a silver cigarette case through Corbridge War Servicemen’s Gift Fund, but accepting
    it on his behalf, his father Judge John Richardson, of Cliffe House, Corbridge,
    said his son was still serving in the Western Desert. The judge said: ‘He could
    have been here, because he was offered a job back home as an instructor, but he
    said it was impossible to accept the post, because he felt he had to stay on and
    finish the job he had started.’


    There was a Distinguished Conduct Medal for Langley’s Private John Armstrong (23)
    of the Green Howards in recognition of his outstanding bravery at the Munasin
    Depression near El Alamein in October 1942, when his platoon came under attack
    from an enemy machine-gun post. His platoon commander was wounded and unable to
    continue and, with complete disregard for his own safety, Armstrong attacked the
    post and destroyed it, enabling the attack to continue. Later in the day, the
    Allied patrol was again held up by machine-gun fire and flash bombs, but Armstrong
    and another private stormed the position, putting it out of action and killing
    or wounding seven Italians. The following day, under intense mortar fire, Armstrong
    kept up a withering hail of fire on an enemy sniper post, killing at least one
    sniper and forcing the others to abandon the post,


    ![Image](Images/f0141-01.jpg)


    Private John Armstrong of Langley was awarded the Distinguished Conduct Medal
    after destroying two enemy machine gun posts at the Munnasib Depression in North
    Africa. Fighting in his fifth campaign in North West Europe in 1944 though, he
    died of his wounds.


    RAF brothers Jim and Thomas Robinson travelled halfway round the world after fleeing
    Japanese forces following the fall of Singapore – but said that nowhere on their
    travels had they seen anything to compare with Hexham. Warrant Officer Jim and
    Corporal Thomas fled Singapore for Java when the island fell, but the Japanese
    were soon swarming all over Java too, and the brothers became separated, one finding
    his way to Australia and the other to India. Thomas stayed in Australia for six
    weeks before travelling to Ceylon, from where he went to Bombay, and a happy reunion
    with brother Jim, whom he had not seen for eighteen months before making their
    way back to Hexham.


    Jim, a former member of the machine room staff at the Courant, said: ‘No matter
    where we were in the world, we always seemed to find a copy of the Courant, which
    was read with the greatest of interest. The Courant seemed to follow us wherever
    we went.


    ‘Before the war, we used to get copies of the Courant when they were three weeks
    old, but on one occasion we got one which had come off the press a full sixteen
    months earlier. That did not matter; it was read with great interest just the
    same.’


    The invasion of Sicily saw Hexham’s Lance Corporal Tom Newton in the thick of
    the action with the Highland Division machine gunners and during the fighting,
    he and just one fellow soldier captured seventy Italian prisoners. The incident
    occurred when the Highlanders had winkled two Italians out of a slit trench and
    they pointed to a wadi – a dried up river bed. The platoon sergeant sent Newton
    to investigate with another soldier and the seventy men came out with their hands
    up.


    ![Image](Images/f0142-01.jpg)


    Hexham’s Lance Corporal Tom Newton, who took seventy Italian prisoners hiding
    in a wadi in Sicily.


    Advances in Italy brought mixed feelings for Lance Corporal George Clark, who
    had been captured during the Battle of Knightsbridge, near Tobruk, in 1942 while
    serving with the Recce Regiment of the Royal Northumberland Fusiliers. He had
    been held in an Italian prisoner of war camp for twelve months, only to be transferred
    to another camp in Germany. In a letter to his wife Doris in Round Close, Hexham,
    he wrote: ‘I had an idea it might not be long before we were back home, but that
    has been knocked on the head. However we are in a very decent camp, and are much
    better off for grub. All I want now is some sort of work to fill in the time,
    which drags heavily.’'
