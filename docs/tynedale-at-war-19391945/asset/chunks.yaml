    Private Ronald Newton, of Crawcrook, who was in the first wave of landings, said
    that all the glider pilots involved should have been awarded the Victoria Cross
    for their bravery. He added that men retreating from the German offensive had
    to have their boots blanketed so they could get safely back to the Rhine.


    The Arnhem raid brought the death of Wylam’s Captain `William N. Barrie` (26)
    of the `Glider Pilot Regiment`, who was already the holder of the Distinguished
    Flying Cross for gallant and distinguished service in Sicily. Captain Barrie’s
    wife Margaret, serving in the `ATS`, had gone with him to Buckingham Palace for
    his investiture a few months earlier.


    ![Image](Images/f0170-01.jpg)


    Shortly after having the Distinguished Flying Cross pinned on his chest in a ceremony
    at Buckingham Palace, Captain `William Barrie` of Wylam was killed in action while
    serving with the `Glider Pilot Regiment` at Arnhem.


    He was training as an accountant when war broke out but was commissioned in the
    `Royal Northumberland Fusiliers`, before transferring to the `Army Air Corps`.
    In civilian life, he was very much involved in the Boy Scouts movement and was
    Hexham’s first-ever King’s Scout. He also played rugby for Tynedale.


    Two men who grew up together in Wanless Close, Hexham, went to war together with
    the `Recce Regiment`, Sergeant `John James Skelton` (24) and Trooper `Thomas William
    Hudson` (23), were both awarded the Military Medal for gallantry in North West
    Europe, and had the medal ribbons pinned on their chests by Field Marshal `Bernard
    Montgomery` at a special ceremony in Brussels.


    The awards came following a patrol in Vemraij, which came under heavy fire, leaving
    a sergeant so severely wounded he had to be left behind. On their return to base,
    Sergeant `Skelton` volunteered to try to rescue the sergeant and Trooper `Hudson`
    volunteered to go with him. They boarded an armoured car and got within 50 yards
    of the wounded man before coming under such withering fire from rifles and machine
    guns they had to stop. However, the two pals got out of the vehicle with the enemy
    less than 100 yards away and managed to reach their wounded comrade and drag him
    back to the armoured car.


    ![Image](Images/f0171-01.jpg)


    Two Hexham men who were peacetime neighbours were both awarded the Military Medal
    for gallantry in Europe while serving with the `Recce Corps` of the `Royal Northumberland
    Fusiliers`. Trooper `Thomas Hudson` (left) and Sergeant `John James Skelton` had
    their medals pinned on their tunics by Field Marshal `Bernard Montgomery` at a
    ceremony in Brussels.


    The citation read: ‘Sergeant `Skelton`, by his superb act of gallantry, and complete
    disregard for his own safety prevented his comrade from being made a prisoner,
    and may well have been responsible for saving his life. Trooper `Hudson` remained
    completely calm and his outstanding example of bravery proved a great inspiration
    to all serving with him.’


    In the week before Christmas, the manager of the West End Inn in Hexham was fined
    £20, with £5 16s costs, in what was described by a weights and measures officer
    as ‘a disgracefully serious case of gross adulteration – the worst I have ever
    come across in 40 years doing this job.’ The licensee, `John William Burns`, was
    found to be selling whisky which was up to 34 per cent watered down, and gin with
    33.4 per cent added water. He claimed the diluted spirits were for his own use,
    so that he could accept drinks from customers without becoming intoxicated, but
    magistrates rejected his claim.


    ### 1945


    There was a grim start to 1945, when a Hexham women who was engaged on war work
    in Birmingham was found murdered, with £75 in cash jammed into her throat. She
    was `Agnes Dooley`, and beside her body was that a former porter at Hexham Hospital,
    one `J. Johnson`. An inquest jury decided `Johnson` had murdered Miss `Dooley`
    and then taken his own life.


    It was also confirmed that the replacement vessel for the stricken `HMS Tynedale`
    sponsored by the Hexham district was the frigate `HMS Loch Eck`, built in Middlesbrough,
    with many of its ship’s company from the region. Her skipper, Lieutenant Commander
    `R.C. Freaker`, spoke of his pride in succeeding `HMS Tynedale` in the district’s
    affections and hoped his ship would do as well against the enemy. She was an immediate
    hit with local schoolchildren and more than fifty pupils at Hexham Senior School
    wrote letters to the ship’s company seeking pen pals.


    `HMS Loch Eck` was a successful U-boat killer, pinpointing the presence of the
    German submarines thanks to information gleaned from the `Enigma` code crackers
    at Bletchley Park. Based at Scapa Flow on the north-western approaches, she helped
    sink three U-boats in February 1945 alone. She survived the war, and was later
    transferred to the New Zealand Navy as `HMNZS Hawea`.


    ![Image](Images/f0172-01.jpg)


    `HMS Lock Eck`, the destroyer adopted by the Hexham district following the sinking
    of `HMS Tynedale`.


    A conman was jailed for six months after playing ‘a mean trick’ on the occupants
    of `Chipchase Castle`, near Wark. `Kenneth McManus` appeared at the family seat
    of the `Taylor` family wearing the uniform of a lieutenant in the `Canadian Army`.
    He said he was a personal friend of Captain `Robert Taylor`, who was serving with
    the `Irish Guards`, and had fought with him at the Anzio beachhead. He claimed
    that Captain `Taylor` had urged him to stop by the castle if he was ever in the
    North. He was welcomed with open arms as an officer and a gentleman and allocated
    a suite of rooms at the castle, with free access to the property. He was taken
    out shooting and fishing and spent four days living a life of luxury before moving
    on.


    It was only after he had gone that Mr and Mrs `Taylor` realised that jewellery
    worth over £200 was missing, along with a rifle and revolver from the gun room.


    The police were called, and `McManus` was arrested in Edinburgh some weeks later.
    It turned out he was a native of Bootle on Merseyside, had never been to Canada,
    Anzio or any other theatre of war and was in fact an army deserter in the run.
    It was assumed he had met Captain `Taylor` while on the run and had managed to
    find out where he lived. He had sold some of the stolen jewellery in a Hexham
    pub, saying it had been left to him by an aunt.


    Meanwhile, as the Allied forces closed in on Germany, a 21-year-old soldier from
    Simonburn serving with the `Argyll and Sutherland Highlanders` snuffed out a German
    counter-attack in bold fashion. Private `Edward Jeffrey` had been part of a group
    which had taken a farmhouse redoubt with the support of tanks, but when the tanks
    withdrew, the Germans regrouped and tried to take it back. Private `Jeffrey` let
    them get close and then killed six of them with his `Bren gun`, causing the others
    to retreat.


    ### German PoWs escape


    It wasn’t only British prisoners who escaped from prison camps, for on 1 April
    1945, Austrian `Josef Kirchdorfer` (19) and seven fellow prisoners broke out of
    the PoW camp at `Featherstone Castle` near Haltwhistle. `Kirchdorfer` was arrested
    while on a spying mission behind enemy lines in Holland in 1944. Thanks to the
    fact he had a letter in his pocket from the world’s first female test pilot –
    the celebrated `Hanna Reitsch`, who was awarded the Iron Cross and the Luftwaffe
    Diamond Clasp by Hitler – he was dispatched to England for interrogation.


    After two weeks in London, he was sent to `Featherstone`, where he was soon at
    the centre of a plot to escape. They broke out in the middle of the night with
    the intention of stealing an aeroplane to return to the Fatherland. With at least
    a couple of pilots in the group, the plan might have been feasible but the venture
    turned to catastrophe.

