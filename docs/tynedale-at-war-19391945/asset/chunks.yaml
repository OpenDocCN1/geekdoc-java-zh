    在所做出的离奇决定中，一个是让科布里奇（Corbridge）圣安德鲁教堂的钟声沉默，使其在战争期间不再报时。这一决定是由科布里奇教区委员会副主席 `R.R.
    Ridley` 议员做出的，理由是“安全措施”，但当时正在休假的牧师 `Rev. M.M. Barlow` 对此无所知。这一决定在村子里引起了一些恐慌，尤其是当时大本钟（`Big
    Ben`）依然在伦敦上空轰鸣作响。牧师认为，教区委员会在没有咨询他或教会执事的情况下，没有权力命令停止时钟运行。他说：“我不是最后一个不在乎自己权利的人，但我在乎教会的荣誉，而我是我在该教区的个人代表。我很惊讶在没有咨询我的情况下，时钟竟然停止了敲击。”


    内政部（`Home Office`）并未发布过关于时钟运行的命令，双方同意恢复钟声。


    在贝林格姆（Bellingham）治安法庭，来自沃克（`Wark`）牧场（`Pasture House`）的 `Ellen Charlton` 因被控以每枚
    4 便士出售鸡蛋出庭，而非政府规定的每枚 3 便士的最高价。Charlton 告诉法庭，她知道《本产鸡蛋最高价格令》（`Maximum Prices for
    Home Produced Eggs`）的规定，但她认为自己有权收取更高的价格，因为贝林格姆食品控制委员会（`Bellingham Food Control
    Committee`）的 `Sidney Clough` 在测试购买中买到的鸡蛋特别大，可能是双黄的。


    她被罚款 1 英镑，外加 1 英镑诉费，法庭主席 `Major G.D. Anderson` 少将告诉她，她本可以被罚款 100 英镑。面对她关于自己只有几只产蛋很少的鸡的恳求，`Anderson`
    少将说：“你有多少家禽并不重要。如果你只有一只每天产一个蛋的鸡，而你以高于最高价出售这枚蛋，就构成了犯罪。无论这些规定多么令人厌烦，它们都是为了国家的整体利益而制定的，每个人都应该尽可能愉快地执行这些规定。”


    他请求媒体报道此案以起到震慑作用，因为有暗示——虽无法证实——北泰恩河（North Tyne）的其他养殖者一直在以高于许可的价格出售鸡蛋。


    对于住在科布里奇迪尔斯顿霍格（`Dilston Haugh`）的 `J. Atkinson` 夫妇来说，这是一个好消息。一个月前他们被告知长子、熟练水兵 `Joseph
    Atkinson` 在埃斯克号（`HMS Esk`）驱逐舰因鱼雷或水雷沉没后失踪，推定遇难。当他们确认儿子已被救起并正处于战俘营时，他们欣喜若狂。


    ![Image](img/f0059-01.jpg)


    来自科布里奇的熟练水兵 `Joseph Atkinson`（22 岁）在埃斯克号（`HMS Esk`）沉没时被错误报告为战死。他帽子织带上的船名曾被划掉，以防向敌人提供信息。


    《快报》（`Courant`）在战争期间除了传播坏消息也能传播好消息，例如来自赫克斯姆（`Hexham`）的空军中士 `Harold Robson` 的例。正是一位《快报》记者告诉他的家人，他因在占领领土上执行
    41 次白间任务而被授予卓越飞行勋章（`Distinguished Flying Medal`）。尽管他强调该奖是对整个布里斯托布林姆（`Bristol Blenheim`）轰炸机小组工作的认可，但这位观察员在对荷兰、比利时和法国北部的袭击中经历了一些惊心胆跳的时刻。


    ![Image](img/f0060-01.jpg)


    来自赫克斯姆的中士 `Harold Robson`（26 岁）在 1940 年 10 月参加了 41 次进入占领区域的飞行后被授予卓越飞行勋章。


    最刺激的事件发生在纳粹突破法国马奇诺线（`Maginot Line`）时，空军（`RAF`）被派去阻止德国机械纵队的推进。`Robson 的布林姆`因防空火与中部队分离。他说：“我们发现自己在灌木丛中穿梭，受到地面机枪和步枪火力的骚扰，还有五架梅塞斯密（`Messerschmitts`）在后面追。我们的射击手击落了一架敌机，之后其他的就放过了我们，因为它们似乎弹药光了。我们回到家时，布林姆飞机上有了一两个弹孔，但仅此而已了。”


    在另外一次中，他感到腿部剧痛，低头一看发现他的皮质飞行靴被碎片炸破了。但这算不上什么——只是一天工作的一部分。


    他在空中最令他满意的时刻之一是对被占领的荷兰某处机场的袭击，他说：“我们从云层中俯冲到约 1000 英尺处，然后投下炸弹。我们看到炸弹在机场中间的一个机库上爆炸，在他们防空炮就位之前我们就飞回了云中。”


    他对布林姆飞机（`Blenheim`）的制造商表示高度赞誉，这是首批采用全金属应力皮肤结构、可收缩起落架、襟翼、动力炮塔和变螺距螺旋桨的飞机之一。他观察到：“我见过布林姆飞机在遭受防空炮和纳粹战斗机的猛烈炮击后返回，尽管它们几乎被被打成了碎片，但还是以某种方式回了。这归功于我们飞行员的技巧，以及他们所驾驶机器的品质。”


    在后方，泰恩代尔（`Tynedale`）的女士们听到了一个毁灭性的消息：贸易部（`Board of Trade`）宣布，从 1940 年 12 月 1 日起禁止销售丝袜，因为战争努力需要丝绸，特别是降落伞的生产。《快报》的“女性话题”（`Women’s
    Topics`）专栏报道：


    “一夜之间，一双丝袜变成了赫克斯姆最炙求的商品，周六早上女装店开门后不久，丝袜柜前就排起了队。到了周一早晨，一双丝袜就像夏天的雪一样稀缺。对于那些打算储备丝袜作为养老金来说，这进一步令人失望，因为为了确保所有客户都能公平分到现有库存，顾客被限制只能买一对。一家商店甚至采取记录所有丝袜购买者姓名的方法来迷惑潜在的囤者。店主说：‘这种限制只是又一次牺牲——与其正在做的其他牺牲相比，很小的牺牲——女性被要求以自由的名义做出。’”


    在赫克斯姆战争物资仓库（`Hexham War Supplies`）的第一次年度会议上，据报告，10 英里的材料已制作了 3051 件服装，25 英里的纱布制成了
    44000 个棉签，12.5 英里的材料制成了 3685 条绷带。该仓库每周产出 3000 件，全年产量为 109000 件，由 33 个工作小组组成。其中包括赫克斯姆高级学校的木工班，他们正在制作木夹、床托和拐杖。


    对宵禁违规的打击仍在继续，科布里奇斯塔格肖矿矿（`Stagshaw Colliery`）的所有者因导致煤堆闷燃被罚款 5 英镑，因为煤堆发出的光芒在远处都能看到。科布里奇消防队用了
    1000 加仑水扑灭了火灾。来自赫克斯姆的所有者 `Thomas English` 说，他知道煤堆正在升热，正在组装一台电动泵以控制火情。他曾用土覆盖煤堆以压制火源，但强风助长了火势。


    普鲁德（`Prudhoe`）河景路（`River View`）的 `George Stoker` 因宵禁违规被罚款 1 英镑，原因是炉火上的炸薯锅翻了，燃燃的油脂点燃了烟囱，形成了
    3 英尺高的火焰，在远处可见。


