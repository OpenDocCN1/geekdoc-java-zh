    侦察团（Recce Corps）是人们亲切的称呼，主要由服役过皇家诺森伯郡掷击团的民兵军员组成。它被视为“军队的眼睛”，被认为是布尔战争中表现卓越的侦察兵以及上一次大战中骑兵的继任者。侦察团被归类为骑兵连，乘坐`Bren`
    载兵器、装甲车或卡车行动。这些士兵被要求能够驾驶任何车辆，并能够修理它们。他们的工作是发现其他部队前方的状况，并汇报回情况。人们说，土生土长的、对乡村环境有眼光且精通野外生存技巧的人，非常适合这项工作。


    ![Image](img/f0121-01.jpg)


    1942 年 9 月在意大利意大利战俘营的、来自赫克斯姆的皇家诺森伯郡掷击团侦察团成员，从左到右分别是：步击兵 T.H. Whitfield、下士 George
    Clark、连军士 Leslie Dodds 和 士 R. Brotherton。


    当当地士兵在中东继续牺牲时，英国本土也发生了悲剧。前军人、赫克斯姆家园卫队成员 Benjamin Gunton 在其位于镇上罗德克罗斯（Round Close）的家中花园时，听到了一声巨大的爆炸声，发现他
    18 岁的儿子 Desmond 不小心被手榴弹炸死了。


    Gunton 先生在法医质询会上告诉，这名青少年被士兵给了四枚手榴弹作为纪念品，并存放在花园底部的一个小屋里。他习惯于把炸弹拆开再组装。他承认本应该从孩子那里没收这些炸弹，但一直没得及处理。


    泰恩代尔的第一家“英国餐厅”（British Restaurant）建立在普鲁霍的威斯利礼堂，该礼堂花费`£600`进行改造，一次可为 100 人提供廉价且营养丰富的餐点。营业时间为周一至周六上午
    11:45 至下午 2:15，提供四道菜套餐，包括`2d` 的汤、`7d` 的肉和蔬菜（儿童为`4d`）、`2d` 的甜点和`1d` 的杯茶。


    ![Image](img/f0122-01.jpg)


    据报道，位于意大利战俘营的是来自科布里奇的下士 William Foster（左），而来自赫克斯姆的士官 Fred Barrable（右二）在位于地中海的`HMS
    Manchester`号沉没后被关在阿尔及利亚。然而，来自海登桥的飞行军官 Sidney Melvin（左二）和他的皇家空军同事、来自科布里奇的军士 John
    Ridley Elliott（右）均下落不明。


    英国餐厅是`1940`年创建的社区厨房，旨在帮助那些因轰炸流离失所、用完配给券或其他需要帮助的人们。这也具有政治意义，因为工党将其视为跨阶层平衡消费差异的永久解决方案，并确保贫困人口获得营养丰富的饮食。


    这些餐厅最初被称为“社区供餐中心”，“英国餐厅”这一名称由首相温斯顿·丘吉尔命名。它们由食品部设立，由地方政府或自愿机构以非营利性质运营。


    ### 良心的问题


    第一次世界大战的老兵、来自普鲁霍的 Robert William Marriner 因不服国家兵役官要求其从事国家重要工作的命令，被赫克斯姆治安法庭判处有禁苦役两个月。Marriner
    向法庭表示，如果他接受了被指派的工作，他目前的工作每周将损失`20s`到`30s`的工资。他说：“我在上一次大战中每天为了 6 个便士战斗，并被承诺回来后会有更好的待遇——现在我回来却遭受到这种对待。”


    在同一处法庭，来自海登桥的 25 岁女孩 Kathleen Margo Jupp 在被告席上朗读她的圣经，当时她被指控未参加执行国家重要工作的面试。她解释自己的职业是全职耶和华见证人，在被问及诉求时，她说：“从技术上讲，我有罪；从道德上讲，我是无罪的。”她此前申请注册为良心拒绝者，但被告知根据《就业登记令》（`Registration
    of Employment Order`）的规定这是不可能的。法庭获悉，Jupp 女士有一些“奇特的宗教信仰”，这使得她难以承担被指派的工作，即使这些工作与战争无关。


    国家兵役官 Charles Welburn 告诉法庭，由于她的信仰，Jupp 女士未被分配军火工作或任何与战争直接相关的任务，而是被去赫克斯姆的儿童疗院工作，但她拒绝与护士长面试。当法庭主席
    John Charlton 问她是否不是受英国法律约束的英国臣民时，她说：“我首先服从上帝的法律。”


    法庭获悉她曾是妇女土地军的成员，但在“受到耶和华见证人运动的影响”后辞职了。在休庭两周后，她被罚款`£20`。


    诺森伯郡和德里郡良心拒绝者法庭的主席 T.Richardson 法官随后在向赫克斯姆轮社俱乐部发言时表示，在他看来，一旦战斗结束，所有拒绝为战争努力做任何事的良心拒绝者都应该被冷落。这同样适用于那些雇佣“良心拒绝者”的公司，在其他员工为国家牺牲生命时，这些公司往往在职位上提拔了这些人。法官说，最近有越来越多的女性声称自己是良心拒绝者，他发现她们比男性“更有毒性”。


    他说：“大部分人根本不是真正的良心拒绝者，而是无异于逃兵。还有一些人利用所谓的宗教团体作为掩护，以逃避为国家做任何事。总来说，这些宗教团体由非常无知但危险的人组成，他们到处煽动。”一名
    19 岁的士兵 Hugh Weir 军士在海登桥的一次陆军演习中不幸溺水于泰恩河。Weir 被要求提着一根钢绳横渡河流，将钢绳固定在对岸，以便其他士兵过河。然而河水位迅速上涨，下了放弃演习的命令。遗憾的是，计划的变化没有传达给
    Weir，他穿着裤子和运动背心走入激涨的河流，钢绳的一端系在腰带上，另一端系在一个鼓上。他刚进入河流四码远，就被水流冲走了。钢绳的另一端从鼓上散落下来，没有人能抓住绳头。


    Weir 的尸体在河流下游 50 码处被找到，法官认为取消指令没能送达非常“遗憾”。


    ## 第五章


    ## 通往诺曼地的坎坷之路


    一名来自斯克斯菲尔德（Stocksfield）的 15 岁女孩被赫克斯姆少年法庭送往收容学校，法庭对她在被描述为极其肮脏案件中表现出的“丑闻”行为感到震惊。她的父亲描述她完全失控，她被送到纽卡斯尔的一个教区静修地，但通过从顶层窗户爬出并顺着排水管滑到防空洞屋顶逃脱了。


    她伴同一名水手出现在纽卡斯尔的一家酒店，自称是他的妻子，但当“丈夫”回到船上后，她与同一家酒店的另一位客人住在一起，并告诉被冒犯的经理她的丈夫并不介意她与其他男性友好地交往。她拒绝支付`45s`的酒店单，但这笔钱由她现在共用房间的另一个男人支付了。


