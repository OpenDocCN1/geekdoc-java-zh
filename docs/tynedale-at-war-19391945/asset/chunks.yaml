    There was a double tragedy in Hencotes, Hexham, when an army truck went out of
    control, killing a military policeman and a young Hexham woman. The driver, Fusilier
    `George Farrand`, was fined `£5` for driving a wagon to the public danger, with
    `£1 18s 9d` costs. He was also banned from holding a civilian driving licence
    for three years.


    Hexham magistrates heard that the truck was driven along Hencotes at an excessive
    speed and hit a stationary car being driven by an ATS private, killing military
    policeman Lance Corporal `William Hanley` of the Grenadier Guards, who was talking
    to her at the time. The lorry then veered onto the pavement, scattering pedestrians,
    and killing the young woman, 23-year-old `Winifred Taylor`, of Osborne Avenue,
    Hexham. At the subsequent inquest, the coroner remarked on the irony of the fact
    that while `Farrand` could not drive a private car, he could continue to drive
    army vehicles.


    On a less serious note, seven boys were each fined `10s` by Hexham Juvenile Court
    for playing football in the street. The boisterous game took place in Beaumont
    Street and in the Market Place, as well as in front of the Abbey. The court heard
    the ball on occasion went dangerously close to shop windows and that pedestrians
    were inconvenienced.


    A military despatch rider was brought before Hexham Magistrates for riding his
    machine through Howden Dene at Corbridge at a speed in excess of `60 mph` – and
    without lights. Signaller `Peter Green` of the Royal Artillery was fined `£1`
    on each charge, but his commanding officer told the court that he believed it
    was a case of excessive zeal rather than riding to the public danger. A despatch
    rider’s job was to get through at all costs and `Green` had had the best traditions
    of the corps at heart.


    Christmas `1941` was again a bright affair, despite the shortages caused by rationing
    and coupon requirements. One retailer said: ‘Stockings may not contain the variety
    of other years, but they certainly won’t be completely empty. There has been a
    keen demand for warlike toys, but it has been impossible to meet that demand.’


    Shoe shops were particularly busy, one interesting development being the resurgence
    in demand for clogs, which were not subject to rationing and could be bought without
    coupons. One boot and shoe dealer said: ‘If there had been more available, I am
    sure half the women in Hexham would be wearing clogs, not just in the garden,
    but in the street.’


    The biggest shortage was in children’s footwear, especially for toddlers and young
    children.


    ## 1942


    The new year began with the tragic death of Leading Aircraftsman `John Nattress`
    (22) of Beech Grove, Prudhoe, who sportingly gave up his leave to accommodate
    a colleague and was killed in an accident. He was a member of Prudhoe Cycling
    Club before the war as well as being a chorister at St Mary Magdalene’s Church.


    ## A grim warning about Hitler


    There was also a grim warning to Hexham Rotarians from the deputy controller of
    ARP Services in Northumberland, Major `J. McVicar Munro` who said that as the
    tide of the war started to turn against `Hitler`, the dictator would not hesitate
    to launch a deadly gas attack against Britain.


    He said:


    ‘I am convinced that when `Hitler` the tiger is properly netted – and that will
    be before very much longer – he will use every possible means he can to launch
    a gas attack on Britain. It is only with an element of surprise he will be able
    to succeed though and a nation armed with effective respirators, and a ready supply
    of number two anti-gas ointment, and taking simple but necessary precautions,
    can laugh at any attack `Hitler` may launch.’


    Major `Munro` said that `Hitlerism` should not be regarded as a present day phase,
    but something that was ingrained in the German psyche. He added:


    ‘The Huns of the present day are no different from the old Huns of `Atilla`. When
    we win the war we will be told by the Germans that it was the canker of `Hitlerism`
    that caused the trouble. Don’t let us believe that. `Hitler` at the beginning
    was allowed to attain power because he was thought by the German military authorities
    to be a suitable pawn in their hands.


    The machine behind `Nazism` has the same kind of gear wheels as have been working
    for centuries, and this time, we have to see that the wheels do not simply have
    a few cogs knocked out but are filed down with a very coarse rasp.’


    ## Ossie Chipchase’s ordeal


    January `1942` saw the beginning of a nightmare for draper `Ossie Chipchase`,
    who had left school at the age of 16 to work in a drapery warehouse. When the
    warehouse closed down in the depression year of `1933`, he set up his own drapery
    business at the age of 23. Shortly before war broke out in `1939`, he married
    Hexham lass `Dorothy` and two years later was called up into the Royal Signals
    Corps as a wireless operator. He was attached to an anti-aircraft section which,
    in November that year, set sail for Singapore which was facing an imminent Japanese
    attack. He arrived at the outpost of the British Empire in January `1942` and
    was posted to a camp near the Royal Naval base, before being transferred to the
    Argyll and Sutherland Highlanders.


    On Sunday, `15 February 1942`, Singapore was surrendered to the Japanese Imperial
    Army and `Ossie` was taken prisoner. He was then transferred to a school near
    the infamous `Changi camp`, and was put to work building a road. Then he was sent
    on a five-day train journey to Thailand, to work on the building of a railway
    line. There was little in the way of food or clothes and he was forced to live
    and work in bare feet, wearing nothing other than a loincloth. He was frequently
    beaten with bamboo canes by the guards.


    In an interview in `2005`, he said: ‘For the first 18 months as a prisoner, my
    wife `Dorothy` did not know where I was. The Japanese were not interested in Geneva
    Conventions and they did as they liked. Eventually we received a card which had
    the pre-written messages “I am well, I am working for pay, or I am in hospital.”
    We had to tick the correct box, but were not allowed to write anything. `Dorothy`
    used to write every week but I didn’t receive the letters.’


    She even received the Widow’s Payment Form on the basis that he was missing presumed
    dead.


    But `Ossie` was still much alive and in June `1944` was taken back to Singapore
    to be transferred by ship to Japan. He was one of 1200 prisoners on board a ship
    for three months – and was nearly killed by his own side. The ship was bombed
    in Manila harbour in the Philippines by American aircraft. Around 750 prisoners
    were drowned, but `Ossie` swam to the top of the hold and, after a desperate struggle
    removed the hatch cover, he escaped just as the ship sank. Together with three
    companions `Ossie` used the hatch covers and wooden panels to get to shore – where
    he was recaptured by the Japanese.


    He was then put aboard another ship bound for Japan, which again came under attack
    from the US Air Force. The Japanese battened down the hatches – and of 800 men
    in the hold, 300 died of suffocation. `Ossie` only just survived and was put on
    one of two ships bound for Taiwan. One of the ships was sunk, with no survivors,
    but `Ossie’s` made it to southern Japan, where he was put to work in a coal mine
    near the Japanese city of Nagasaki.


    Six months later `Ossie` witnessed a huge glow in the sky – the second atomic
    bomb of the war had been dropped on Nagasaki. The war was over and the guards
    fled. A month later, the Americans arrived overland and `Ossie` was put on a hospital
    ship bound for San Francisco. He then travelled across the US and took ship to
    England.


    On `28 November 1945`, `Ossie` and `Dorothy` were finally united, against all
    the odds, on the pedestrian footbridge at Newcastle Central Station.

