    Virtually all exceeded their targets as a note of optimism started to creep into
    the everyday life of the district. It was agreed the saving would go on though,
    as hardly had the `Salute the Soldier` cash been banked than a new drive was launched
    to raise money to replace lost `HMS Tynedale` with another destroyer bearing the
    same name within six months. The Admiralty though declined the offer, pointing
    out it was not possible to name naval vessels with regards to local savings campaigns.
    Ships could only be named in accordance with pre-arranged schemes.


    Life went on though and a 31-year-old woman from Haydon Bridge, Dorothy Charlton,
    was jailed for two months for refusing to take up work as a shorthand typist as
    it would clash with her beliefs as a Jehovah’s Witness. Chairman of the Hexham
    bench `J.M. Heslop` said Charlton’s stance was a ‘rank defiance of the law’.


    A sentence of three months with hard labour was imposed on Russell Alexander,
    of Allendale, a 22-year-old painter and decorator, who refused to take up a job
    as an agricultural labourer as required by the `National Service Office`. He had
    already served a year for refusing to submit himself for medical examination,
    but Alexander said he was a pacifist and refused to take any part in the war effort.


    A private in the Royal Army Ordnance Corps was fined `10s` for driving an army
    wagon to the danger of the public, and a further `£1` for being drunk in charge
    of the vehicle. `John Philip Metcalfe` (36) was seen driving the liberty wagon
    through Acomb at excessive speed, on the wrong side of the road, with his offside
    wheels in a ditch. He travelled in the ditch for 60 yards, before hitting a telegraph
    pole, which was snapped in half, and then mounting an embankment. The vehicle
    then veered to the opposite side of the road where it crashed through a garden
    fence and came to a halt festooned in telegraph wires and pieces of broken fence.


    The owner of the fence came out to remonstrate with Metcalfe, who refused to get
    out of the vehicle, but reversed it back onto the road before setting off towards
    Hexham at a furious pace, swaying from side to side. His journey ended when he
    failed to take the bend at St John Lee corner and crashed through the fence into
    a field, where he ploughed on for 60 yards before coming to a final halt. When
    he tried to get out of the vehicle, he fell to the ground and was clearly totally
    drunk.


    Speaking on Metcalfe’s behalf at court, solicitor `John Baty` said that he was
    not used to drinking, and his condition was brought about by ‘excessive treating’
    by other people. An officer from his regiment told the court that on his usual
    pay, Metcalfe would have been unable to afford to buy the amount of liquor he
    had clearly consumed.


    Northumberland Quarter Sessions heard the tale of a man who had lost his wife
    and two children in the London Blitz, and found himself in Catton where he was
    given free board and lodgings by a kindly widow. Labourer `Arthur Wharton` (54)
    of no fixed abode, responded to her kindness by stealing a gold watch, silver
    cigarette case and other items together worth `£30`. He was sentenced to four
    years’ penal servitude.


    The first recipient of an award from the `Bellingham Welcome Home Fund` was 19-year-old
    Corporal `James Daley`, of the `Seaforth Highlanders`, who was awarded the `Military
    Medal` for gallantry in action in Italy. During a period of heavy fighting, he
    saved many lives by silencing two German machine-gun posts. He had already had
    spells in hospital after being wounded twice. He was presented with a cheque for
    `£30` by the fund in a ceremony at the town hall, along with another cheque from
    the `Bellingham` company of the `Home Guard`, of which he had been a member before
    joining up. The presentations were followed by a party at the `Black Bull Inn`,
    where he lived with his mother and stepfather.


    ![Image](Images/f0160-01.jpg)


    Corporal `James Daley` (19) of Bellingham was awarded the `Military Medal` for
    gallantry in Italy, where he silenced two machine gun posts. He was twice wounded
    and spent time in hospitals.


    A soldier from Wall owed his life to the new technique of plasma transfusion,
    it was claimed. Trooper `N. Craig` lost both legs when the slit trench he was
    occupying at Anzio in Italy took a direct hit from a German `88mm` shell. He was
    suffering catastrophic blood loss as well as shock when he was carried into a
    casualty station, but after an emergency plasma transfusion, he made a remarkable
    recovery. Within ten days, he was well enough to be carried out of hospital on
    a stretcher to watch a football match.


    ### Racketeering at Haltwhistle


    A major fiddle was uncovered at Haltwhistle, where a spot check on the stores
    of an army unit stationed in the area found that enormous quantities of property
    was missing. As a result, sixteen local people found themselves before magistrates
    charged with unlawful possession of everything from army clothing and blankets
    to a iron bed, complete with mattress, all the property of `HM War Department`.


    Police Superintendent `William Goodfellow` told the town’s magistrates: ‘There
    has been what may be described as a proper ramp in the buying and selling of army
    property in Haltwhistle and it has been going on for some considerable time.’’


    The racket came to light when an army unit based in the Haltwhistle area moved
    on and a large discrepancy came to light when an audit was made of the base stores.
    It was soon established that it was common practice for Haltwhistle people to
    buy whatever property they needed from willing soldiers. Search warrants were
    obtained and property recovered from various homes included army blankets, socks,
    shirts, towels, pullovers, wellington boots, khaki tunics, boots, greatcoats and
    even a complete bed and mattress. The bench was shown women’s and children’s coats
    which had been made from army blankets, as had a child’s dressing gown.


    Sixteen people – eight men and eight women – appeared in court, fifteen of them
    pleading guilty to receiving stolen goods, and fines totalling `£62` were announced
    by chairman of the bench `J.R. Blackett-Ord` who said the magistrates took a serious
    view of the wholesale theft of government property and were determined to put
    a stop to it.


    At a later court, four more civilians from the Haltwhistle area were convicted
    of possessing Army property including boots, socks, shirts, blankets and greatcoats.
    The officers who had conducted the case, Detective Constable `Scott` and PC `Halliday`,
    were commended by the bench for the diligent work in unravelling a complex case
    of wholesale thievery.


    Heralded by a peal of bells from the Abbey, Hexham’s second Home Holiday Week
    saw 13-year-old Betty Ambler, whose parents ran the Sun Inn in Fore Street, crowned
    Holiday Queen in a ceremony in the Abbey Grounds, which was followed by a band
    contest organised by the `Northumberland Band League`.


    A rabbit show in `St Wilfrid’s Institute` attracted 134 entries, and other attractions
    included a sword dancing display by the `2nd Hexham Girl Guides` and a gymnastics
    display by the `3rd Hexham Presbyterian Scout Troop`, as well as a pantomime ballet.
    There was a baby show and a walking contest staged by the `Hexham Home Guard`,
    over a course between Dilston, Corbridge and Beaufront, won by 18-year-old Home
    Guard `George Elliott`, of the `Whitley Chapel` company of the `Home Guard` in
    a time of ninety minutes, beating forty-seven other competitors.


    A Holiday Ball at the `Queen’s Hall` attracted more than 500 people to dance to
    the music of `Jos Q. Atkinson` and his Orchestra. On the sporting front there
    was six-a-side football and rugby sevens, as well as the novelty of a display
    of baseball in the Abbey Grounds provided by locally based American troops with
    a commentary explaining to baffled locals just what was going on.

