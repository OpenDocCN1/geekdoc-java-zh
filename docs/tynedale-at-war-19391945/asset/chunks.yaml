    几乎所有人都超过了他们的目标，一种乐观的情绪开始渗透进地区的日常生活。尽管他们同意储蓄将继续进行，但“向士兵致敬”的现金才刚入账，一项新的募捐活动已启动，旨在于六个月内筹集资金，为丢失的`HMS
    Tynedale` 号换回另一艘同名驱逐舰。然而，海军部拒绝了这一提议，指出无法根据当地的储蓄活动为海军舰船命名。船只只能按照预先安排的方案命名。


    生活仍在继续，来自海伊登桥（Haydon Bridge）的 31 岁女性多萝丝·查尔顿（Dorothy Charlton）因拒绝担任速记打字员而被入狱两个月，因为这与她作为耶华见证人的信仰相冲突。赫克斯姆法庭主席`J.M.
    Heslop`表示，查尔顿的立场是对法律的“公然蔑视”。


    来自奥伦代尔（Allendale）的 22 岁画家兼装饰师罗塞尔·亚历山大（Russell Alexander）因拒绝按照`National Service
    Office`（兵役局）的要求担任农工，被处以三个月苦役徒刑。他此前因拒绝接受体检已服一年刑，但亚历山大表示他是一个和平主义者，拒绝参与任何战争努力。


    一名皇家陆军军种兵团列兵因驾驶军用货车危害公共安全被罚款`10s`，并因醉酒开车被额外罚款`£1`。36 岁的约翰·菲利普·梅特卡夫（`John Philip
    Metcalfe`）被目击在阿姆（Acomb）以超速驾驶休假用车，行驶在道路错误的一侧，侧轮掉进了沟里。他在沟中行了 60 码，撞撞上了一根电线杆，电线杆被折断成两段，冲上了土堤。车辆随后偏向道路另一侧，撞穿了一个花园的栅栏并停下，身上挂满了电线和断裂的栅栏碎片。


    栅栏的主人出来向梅特卡夫抗议，梅特卡夫拒绝下车，但他将车倒回马路上，然后以疯狂的速度向赫克斯姆出发，身体左右摇晃。他的旅程结束于未能通过圣约翰李角（St John
    Lee corner）的弯道，撞穿栅栏进入一片田，在田里犁了 60 码后才最终停止。当他试图下车时，摔倒在地上，显然完全醉了。


    在法庭代表梅特卡夫发言时，律师约翰·巴蒂（`John Baty`）表示他不习惯喝酒，这种状态是由于“过度款待”造成的。他所属部队的一名军官告诉法庭，按照他的薪水，梅特卡夫根本买不起他显然已经喝掉那么多酒。


    诺森伯兰郡地方法院（Northumberland Quarter Sessions）审理了一个男子在伦敦轰炸中失去妻子和两个孩子的故事，他发现自己在卡顿（Catton），在那里一位友好的寡妇提供了免费的食宿。无固定住所的劳工亚瑟·华特顿（`Arthur
    Wharton`，54 岁）通过偷走一只金表、一个银质烟盒和其他总价值`£30`的物品来报答她的善意。他被判处四年徒役劳役刑。


    贝灵汉姆归家基金（`Bellingham Welcome Home Fund`）的首位奖项获得者是 19 岁的詹姆斯·戴利（`James Daley`）下士，来自塞福高地人（`Seaforth
    Highlanders`），因在意大利战斗中英勇被授予军事勋章（`Military Medal`）。在激烈战斗期间，他通过消灭两个德国机枪阵地拯救了许多生命。他曾两次受伤并多次住院。在小镇市政厅举行的仪式上，该基金向他颁发了一张`£30`的支票，另一一张来自贝灵汉姆民兵队（`Home
    Guard`）公司的支票，他在入伍前一直是该组织的成员。颁奖结束后，在黑牛酒馆（`Black Bull Inn`）举行了一场派对，他与母亲和继父住在一起。


    ![Image](img/f0160-01.jpg)


    来自贝灵汉姆的 19 岁下士詹姆斯·戴利（`James Daley`）因在意大利英勇获得军事勋章，他在那里消灭了两个机枪阵地。他两次受伤并在医院治疗。


    据称，一名来自沃尔（Wall）的士兵得益于新的血浆输血技术。尼·克雷格（`N. Craig`）士兵在意大利安齐奥（Anzio）所在的战壕遭到德国`88mm`
    炮弹直接命中，失去了双腿。当他被抬进伤员站时，正遭受灾难性的失血和休克，但在急救血浆后，他奇迹地康复了。十天内，他好到可以被担架出院去看足球比赛。


    ### 哈尔特斯斯尔的勒索活动


    哈尔特斯斯尔（Haltwhistle）发现了一起大骗局，对驻在该地区的一支军队仓库进行抽查时，发现大量物资丢失。结果，16 名当地人出现在治安法官面前，被指控非法持有从军服、毯子到带床垫的铁床等物品，这些物品都是皇家战争部（`HM
    War Department`）的财产。


    警察警司威廉·古德费尔（`William Goodfellow`）告诉镇上的法官：“在哈尔特斯斯尔，军产买卖中存在一种被称为正当勒索的行为，而且已经持续了相当长的时间。”


    一支基地在哈尔特斯斯尔地区的军队搬迁时，这一勒索活动暴露无遗，在对基地仓库进行审计时发现了巨大的差异。很快证实，哈尔特斯斯尔的人从乐于的士兵那里购买他们需要的任何物品是一种常态。获得搜查令后，从各种家中追回的财产包括军毯子、袜子、衬衫、毛巾、毛衣、雨靴、卡其军装、大衣，甚至有一套床和床垫。法庭还展示了由军毯子制成的女装和儿童大衣。


    16 人（8 男 8 女）出庭，其中 15 人承认收受物品，法庭主席 J.R. 布莱克特-奥德（J.R. Blackett-Ord）宣布罚款总额为`£62`，他表示法官对盗窃政府财产严肃。


    在随后的一场法庭上，又有四名来自哈尔特斯斯尔地区的平民因持有靴子、袜子、衬衫、毯子和大衣被定罪。负责此案的侦探警斯科特（`Scott`）和警员哈利迪（`Halliday`）因在破解这起复杂的批发盗窃案中的辛勤工作受到法庭表扬。


    在教堂钟声的预热下，赫克斯姆的第二届家庭假期周来临。13 岁的贝蒂·阿姆布勒（Betty Ambler）的父母在福雷街（Fore Street）经营阳光酒馆，她在教堂广场举行的仪式上被冕为假期皇后，随后是由诺森伯兰乐队联盟（`Northumberland
    Band League`）组织的乐队比赛。


    圣威尔弗雷德学院（`St Wilfrid’s Institute`）举办的兔子展吸引了 134 项参赛，其他活动还包括第二届赫克斯姆女童子军的剑舞表演、第三届赫克斯姆长老信会童军军团（`3rd
    Hexham Presbyterian Scout Troop`）的体操表演，以及一场滑剧芭蕾。还有由赫克斯姆民兵举办的婴儿展和徒步比赛，路线横跨了迪尔斯顿（Dilston）、科布里奇（Corbridge）和博弗朗特（Beaufront），冠军是来自
    188 岁的民兵乔治·埃利特（`George Elliott`）以 80 分钟的成绩获得，击败了其他 47 名竞争者。


    在女王厅（`Queen’s Hall`）举行的假期舞会吸引了 500 多人随着乔斯·Q·阿特金森（`Jos Q. Atkinson`）及其乐队的跳舞。体育方面有六人制足球和七人制橄榄球赛，还有由驻当地的美军在教堂广场提供的新奇棒球表演，配有解说向困惑的当地人解释比赛到底发生了什么。

