  trans: "\n他说：“她是一艘可爱的小船，当然，赫克斯姆和诺森伯兰郡的所有人都为她出了钱并收养了她。她有一段非常有趣的经历，但当她沉没时，三分之二的船员丧生了。在幸存者中，还有一些回到岸后去世了。当我跳入海中时，脱掉了所有的厚衣服，包括靴子。但当我被发现时，他们一眼认出了我——我头上戴着我的海军军帽。那是我最后没想过要摘掉的东西！”\n\
    \n工程师 `Ron` 讲述了这一事件是一个惊人的巧合，因为在 `Tynedale` 号大约 18 个月前曾对同一艘 U 艇开过火，并以为击沉了它，但事实并非如此。那艘\
    \ U 艇对 `Tynedale` 号进行了报复，但第二天又被盟军击沉。然而战争是国家之间的战争，而不是个人的战争，`U-593` 号的艇长 `Gerd Kelbling`\
    \ 在沉没中幸存，他与 `Ron` 在战后交换了多年的圣诞贺卡。\n\n## 本地战争努力\n\n当 `Hexham` 拥有 `HMS Tynedale`\
    \ 号时，`Haltwhistle` 举办了自己的“战舰周”，筹集了 52,000 英镑以赞助拖网扫雷舰 `HMS Hornpipe` 号，并成功募集了超过\
    \ 86,000 英镑；而 `Prudhoe` 需要募集 15,000 英镑来装备一艘动力艇，实际上筹集了 37,700 英镑。泰河北部地区被负责筹集 40,000\
    \ 英镑以收养并装备拖网扫雷舰 `HMS Birdlip` 号，成功筹集了 65,000 英镑，相当于该地区人均 10 英镑。\n\n## 中东故事\n\n\
    随着战争局势开始扭转，在中东，一名 `Hexham` 士兵因其医术高而被德国人留为俘虏，而他部队的其他成员却被他们的德国俘俘者释放。`Leonard C.B.\
    \ Ward` 下士是著名律师 `Septimus G. Ward` 之子，他在中东的一场战斗中被德国人俘。一位同事写信给妹妹说，在战斗期间，`Ward`\
    \ 下士表现得非常有模范性，完全不顾危险。他说：\n\n“当无法再抵抗且我们被包围时，他保持了冷静，只要他的俘虏允许，他就继续救治伤员，无论是英国人还是德国人。\n\
    \n我深信通过他在猛烈炮火下的果断行动，他救了至少两个人的生命，正是这种人道主义的工作让他留下了俘虏。当德国人发现他们要掉战斗时，他们释放了我们，无疑是因为我们会对他们的撤退造成阻碍。然而，`Ward`\
    \ 下士被敌人留下了，我只能推测原因是为了照顾敌方的伤员。”\n\n![Image](img/f0114-01.jpg)\n\n在西沙漠，`皇家诺森伯兰步兵团`\
    \ 侦察团的男士们竟然设法抽出时间踢足球，当时他们正准备前往利比亚。这张照片是由 `Hexham` 的 `Lionel Stephenson` 上尉拍摄的，他在照片发布两个月前已战死。随后来自\
    \ `Hexham` 的步兵 `Matt Young`（后排左起第二）被俘，而同样来自 `Hexham` 的连军士 `David Forster`（后排右起第三）于\
    \ 7 月 17 日战死，安葬在特利波。\n\n## 后方线与事故\n\n当住房危机席卷该地区时，`Prudhoe 地方委员会` 写信给 `卫生部`，希望重新开放一些在冲突前被认为不宜人类居住的房屋。镇牧师、议员\
    \ `R.E. Robson` 教师表示，越来越多的人涌入该地区，但可提供的住宿甚至不如一个空肥皂箱多。\n\n两名男子在他们乘坐的坦克在 `Stagshaw`\
    \ 附近的 `Bewclay Bank` 无法通过一个 S 型弯道翻覆时遇难。他们分别是来自 `Alnwick`, `Littlehoughton` 的机械配师\
    \ `Ronald Crole` 和来自 `Newcastle` 的机械审查员 `Edward Nettleton`。来自 `Blaydon` 的坦克测试员司机\
    \ `Oliver Richardson` 仅受了擦伤，得以逃生。\n\n## 播音员 Romany\n\n 1,000 多名学生挤在 `Hexham` 的\
    \ `中央卫公会堂` 听由 `BBC` 传奇播音员 `Romany` 主角的自然讲座，并配有黑板画演示。他在开始演讲时为他著名的英国宾犬 `Raq` 缺席道歉并解释道：“由于汽油紧张，我无法开车，如果我带\
    \ `Raq` 坐拥挤的公交，人们会踩在他的脚上，它不喜欢那样，所以我不得不把它留在家里。”\n\n`Romany` 是第一位野生动物播音员，他赶着马 `Comma`、吉普赛马车和两个年轻伙伴\
    \ `Muriel` 和 `Doris` 在全国范围内，人气巨大。生活中，`Romany` 是卫公认为 `George Bramwell Evens` 教师，以他的《跟随\
    \ Romany 出行》（后来改为《跟随 Romany》）节目而最闻名，该节目于 1933 年在 `BBC` 的《儿童时间》中开始。他的职业经历包括在卡莱尔卫公会中心大厅度过的十二。\n\
    \n### 空军英雄被俘\n\n1942 年 5 月，当当地英雄飞行军尉 `Arthur Garwell DFM` 被报道失踪后，`Hexham` 屏息以待。在此之前大约\
    \ 18 个月前，`Tynedale` 号曾对同一艘 U 艇开过火，并以为击沉了它，但事实并非如此。那艘 U 艇对 `Tynedale` 号进行了报复，但第二天又被盟军击沉。然而战争是国家之间的战争，而不是个人的战争，`U-593`\
    \ 号的艇长 `Gerd Kelbling` 在沉没中幸存，他与 `Ron` 在战后交换了多年的圣诞贺卡。\n\n### 空军英雄被俘\n\n1942 年\
    \ 5 月，当当地英雄飞行军尉 `Arthur Garwell DFM` 被报道失踪后，`Hexham` 屏息以待。飞行军尉 `Arthur Garwell`\
    \ 来自 `Oakwood`，在著名的低空飞行任务中，德国南部的奥格斯堡目标，`Lancaster` 轰炸机在中弹后由于由于完美坠毁被俘，他获得了卓越飞行勋章。\n\
    \n![Image](img/f0115-01.jpg)\n\n飞行军尉 `Arthur Garwell` 来自 `Oakwood`，在著名的低空飞行任务中，德国南部的奥格斯堡目标，`Lancaster`\
    \ 轰炸机在中弹后由于完美坠毁被俘，他获得了卓越飞行勋章。\n"
