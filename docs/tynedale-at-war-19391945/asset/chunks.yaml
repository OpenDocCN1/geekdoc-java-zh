    喷火式战斗机运动确实激发了公众的想象力，在一个工人工年薪约为每周 3 英镑的年代，捐款非常慷慨。当资金在 1941 年 2 月结束时，总共募集了 5,250
    英镑，行政费用仅为 34 英镑 16 先 3 便——仅占总额的 0.76%。


    各地区募集资金的明细显示了资金来源：Acomb £54；Allendale £163；Barrasford £110；Bellingham £75；Blanchland
    £17；Corbridge £595；Fourstones £74；Haydon Bridge £116；Hexham £2,658；Horsley £50；Humshaugh
    £34；Langley £21；Lowgate £61；Matfen £40；Newton £69；North Tyne £114；Ovingham and
    Ovington £29；Riding Mill £175；Hexhamshire £59；Slaley £61；Stamfordham £7；Stocksfield
    £170；Wall £45；Wark £99；殖民及海外 £356。


    一些捐赠和筹款活动筹集的金额较小——Stocksfield 的一场婚礼上的“起抢钱（hoy oot）”带来了微薄的 2 先令，一次舞会仅筹了 5 英镑——但社区努力带来了
    3,588 英镑，这通过学校和学生带来的 240 英镑、社交活动、销售和音乐会的 784 英镑、募捐箱 240 英镑、雇主和员工的每周贡献 107 英镑、竞赛
    91 英镑以及全地区的灯光日 199 英镑得到了进一步增加。


    比弗鲁克勋爵本希望亲自来到克斯姆领取支票，但这并不可，于是支票通过邮寄寄出，并要求在飞机制造后，在机身上标上“克斯姆及地区”字样。


    ## U 潜艇袭击


    当英国空战战在空中激烈进行时，德国 U 潜艇在海上继续造成了沉重损失。《库报》（The Courant）详细描述了哈尔特威斯三等兵约翰·弗朗西斯·布莱基（25
    岁）的痛苦经历，他是当时一艘油轮上的 39 名海员之一，这艘油轮在赫布里迪群岛以西 120 英处被鱼雷击中。他告诉《库报》，U 潜艇在晚上 8:30 左右浮出水面，并说：“他们受到的冲击似乎和我们一样大。我们试图转身以部署火炮，但在我们来得及之前，她潜下了，留下了我们，所以我们希望继续旅程。”


    他们的希望落了空，因为在两个小时后，大约在 10:30，油轮在中部被一枚鱼雷击中，还摧毁了其中一艘救生艇。布莱基说：


    “我们只剩下一艘救生艇和一条我们都挤进去的小艇（jolly boat）。我们 14 个人挤在小艇里，几乎没有活动空间，只有少量的船用饼干和水。船下没得非常慢，但当我们脱离危险区域时，第二次爆炸折断了它的船脊——我想那可能击中了我们的药库。


    “当我们撤离时，又救了另外两名同伴，其中包括一个正值第一次航海的 16 岁舱童，他在随后的几天里成了大家的活动中心。第二次爆炸发生后不久，潜艇再次浮出水面并靠向我们的小艇，船长问我（作为小艇的负责人）我们船的名字。我向指挥官提供了必要信息，他的英语非常流利。事后有个人说，他们曾想过向指挥官透露一些前一天德国空军损失，但他们认为在这种情况下保持沉默更为明智。”


    这些男士在敞口的小艇中在极其恶劣的海面上漂了三天，通常每天只吃几块饼干喝一点水，尽管有些人完全什么都没吃。布莱基报告说士气非常好，并说：“那个舱童异常地乐观，他带领男士们唱歌来提振精神。”


    他们最终操纵这艘小船到达了巴拉岛可见范围内，在那里被“新兰斯号”（Newlands）拖拉船救起。布莱基说：


    “我们好几个人都受到了严寒的影响，但得知噩梦结束了我们感到非常感激。我们穿着鱼雷击中时身上的那几件衣服上岸，有些原本在病床上的人既没有鞋也没有袜子。在托伯莫里，我们先得到了食物，然后前往奥班，那里的酒店的居民自愿为我们提供床位，我们还得到了衣服。”


    来自斯塔格肖的步兵罗伊·克拉克（19 岁）获准从诺森伯郡步兵团休假，担任在斯塔格肖教堂小屋举行的一场特别活动的贵宾。在活动中，他因在 5 月 28 日和 5
    月 31 日在英国远征军（BEF）战斗中的两次独立英勇行为而被授予军事勋章并受到表扬。他曾在密集的炮火和迫击攻击下，继续通过步行和骑摩托车传递信息。他从未躲避或休息，而是以无畏的勇气完成每一段旅程，确保重要信息的快速送达。在一次扑克牌活动结束后，他收到了科布里战争服务基金赠送的一块刻有纪念文字的金表。


    ![图像](img/f0057-01.jpg)


    军事勋章奖得者、来自斯塔格肖的步兵罗伊·克拉克（19 岁），他因步行和骑摩托车传递信息的英勇行为获得此奖项。


    法院对违反灯宵规定的处罚变得越来越严厉，罚金增加到高达 4 英镑——即使对于那些没有直接参与的人也是如此。在处以该金额的人中，包括科布里小麦穗旅馆（Wheatsheaf
    Inn）的房东，他确保了所有 35 扇窗户都做了遮挡。一名女佣被指示在灯宵前半小时巡视，确保所有窗帘都拉上，但这一次，一位客人打开了门并开着灯。


    住在莱丁米尔的德国难民保琳·马因泽（Pauline Mainzer）因在莱丁米尔的平台有未遮挡的灯光被罚款 2 英镑，但法院认为这并非故意引导敌军。


    一群敌对群众在普鲁霍（Prudhoe）聚集，威胁要打破西路建筑的窗户，那里的费斯斯特车库（Fewster’s Garage）天窗透出亮光，从 150 码外就能看到。警方最终闯入建筑熄灭了灯光。主詹姆斯·费斯斯特（James
    Fewster）在承认违规时被罚 2 英镑，但他归咎于一名本该锁门的学徒没有关掉灯。


    普鲁霍的居民通过捐赠和特别订阅募集了 241 英镑 10 先令 11 便，用于 135 英镑购买三辆汽车，另外花了 100 英镑将其转换为当地民防（ARP）小组的救护车。


    克斯姆郡罗利伯溪（Rowley Burn）一项失败的铅矿矿计划在启动 70 年后获得了回报。采矿者曾将资金投入了一项名为“鞋匠冒险”（Cobblers Venture）的采矿作业，但只开采了一小层铅矿，工厂随后被遗弃并荒废。在被遗弃的机器中，有一个重约
    5 吨的大水轮，它在 1940 年被发现并运往回收计划。

