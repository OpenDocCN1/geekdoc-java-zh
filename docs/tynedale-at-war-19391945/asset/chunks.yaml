  trans: '

    X 先生目睹了老人被打死，以及各种形式的残忍罪行。在好几次中，这处为容纳 5000 人而建造的营中所有 20000 名囚犯在半夜被唤醒，目睹大规模绞决。营中所有死者都被火化，骨灰被送给亲属，但亲属不被允许询问死亡的原因和方式。亲属可以寄包裹，但囚犯必须排队领取，有时要排一整天。如果包裹里有烟草或水果，会被营地官员没收，家中的信件会在预定收件人面前被撕碎。


    早餐是一杯咖啡色的饮料和四分之一块面包，午餐是带有极少量肉痕迹的汤，晚餐是小块重盐香肠和盐渍鱱。X 先生说：“这是另一种形式的酷刑，因为我们不被用水，如果你吃了晚餐，整晚都会忍受极度口渴。”


    他谈到了大多数德国人的绝望，他们被一个政府拖入了一场并不想要的战争，而这个政府无情地镇压了任何对纳粹党的反抗苗头。


    人们对来自布里伍德、海登顿桥的二等军官西里尔·克莱米特森的遭遇深表同情。他当时乘坐纽卡斯尔号 `Dalryan` 轮船在往返远方的 5 万英里旅程接近结束时，船只在英国东南岸附近击中了水雷。


    他告诉《快报》：“在准备起落架之前，我正在舱内小睡，这时被一个恐怖的声音惊醒了。船侧的金属侧面像纸一样被撕碎了。我的舱室完全破碎；我的无线电、衣柜和其他家具变成了木屑。我摸索着寻找手电筒和救生衣，跑到甲板上，那里发生了第二次爆炸，我们不得不躲避坠落的残骸。”


    幸运的是，所有 38 名船员都获了救援，因为爆炸从岸上可以看到。正如克莱米特森中尉所说，唯一的伤亡是“我的金鱼和别人的人的金丝雀”。


    战争中的第一个圣诞节带来了无声的反抗，商店报告的生意比冲突前更好。邮政局报告交换的问候卡数量大幅增加。许多在部队服役的当地男子休假回家，因此有一些快乐的家庭团聚。虽然许多疏散人员回家过节，但另一些人留在了泰恩代尔，在赫克斯姆的共济会大厅为新来者举行了一场大型派对，由快乐磨坊乐队提供跳舞音乐。


    圣诞节的一大特色是无线电中的帝国联动节目，科布里奇圣歌队参加了该节目，并以乔治六世国王给帝国的消息结束。科布里奇的广播是在罗克利夫庄园（Roecliffe
    Lodge）84 岁的 J.T. 梅尔家中进行的。吟唱的圣歌有《寂静夜》和《东方三博士》，由著名的诺森伯兰郡风琴手杰克·阿姆斯特朗伴奏。


    赫克斯姆战争纪念医院的病房被装饰得色彩斑斓，挂着护士和患者自己制作的带和其他物品。几位士兵病人收到了护士编织的羊毛礼物。尽管灯控带来了麻烦，邮政局很好地应对了雪片般的邮件，大多数人都听从了尽早寄送圣诞邮件的建议。


    ## 1940


    尽管在第二次世界大战期间泰恩代尔被认为更多是一个寻求安全的避难所而非活动中心，但这里并非完全没有冲突发生的证据。该地区布满了沼泽弹坑和掩盖着撕裂残骸的草丛山丘，这充分证明了该地区多年来见证了与其相当的悲剧。


    ## 航空坠机


    遗憾的是，当地的坠机现场很少发现敌方飞机——大多数现场讲述了年轻盟军士兵多次丧生命的悲惨故事。1940 年 10 月，一架 `Whitley` 轰炸机在从对波兰斯廷廷油厂的袭击返回的途中耗尽了燃料。五名机组成员安全跳伞，但由于某些未知原因，他们的飞机没有指向大海，随着机组成员缓慢降落，飞机继续飞行。在贝勒林姆西南三英里处，失事的轰炸机撞击高地，最终在梅斯林斯（Meslings）坠毁。`Whitley`
    的机组成员包括马克·阿尔弗雷德·尼曼中士，他曾在驻扎于利明皇家空军基地的 `RAF Leeming` `10 中队` 担任无线电员。机组成员最终在南方八英里的斯通豪什（Stonehaugh）附近的
    `Ladyhill` 着陆，裹着降落伞度过了一个寒冷的夜晚。


    在 `Whitley` 坠毁仅两周后，一架来自 `RAF Newmarket` 的维克斯士林顿轰炸机在执行轰炸柏林的任务返回途中坠落。恶劣的天气条件和低能见度导致飞机在奥特伯恩西部的布莱克霍普山（Blakehope
    Fell）坠毁。据认为，飞行员在 `Wellington` 撞击高地时选择穿云层以确定位置。飞机撞过了一道干石墙并在撞击时起火，导致六名机组成员中的一人丧生。


    1941 年 7 月，一架 `Hurricane` 战斗机坠落在惠顿斯托尔费尔利农场（Fairley Farm）的森林中，飞行员在跳伞时脚折。1941 年
    8 月，一架 `Spitfire` 战斗机坠落在华灵顿厅（Wallington Hall），飞行员死亡，同一天，莱尔的穆特劳农场（Mootlaw Farm）被五枚炸弹命中。


    1941 年 9 月，一架来自克罗斯比-昂恩埃登的 `Hawker Hurricane` 战斗机在糟糕天气下燃料水平过低，被迫迫着陆。当时这架 `Hurricane`
    正在进行摄像枪演习，法国飞行员让·德·泰德斯科副中尉在法尔斯通的亚罗（Yarrow）成功降落。一名当地人报告看到一架飞机从贝勒林姆方向沿北泰恩河谷低空飞行，并看到它坠落在亚罗银行（Yarrow
    Bank）脚下的一田里。当这个人到达飞机时，让·德·泰德斯科坐在机翼上，他已经联系了基地，并允许当地孩子坐在驾驶舱内。


    同年 11 月，另一架 `Hurricane` 战斗机坠落在凯尔德的皮尔山（Peel Fell）山顶，飞行员死亡。皇家印度空军的胡库姆·钱德·梅塔军官（24
    岁）驾驶着四架从 `RAF Acklington` 起飞参加编队演习的 `Hurricane` 之一。来自 `43 中队` 的梅塔领领编队，但在返程途中失踪。接下来的两天都在寻找飞机却无无果，直到一名当地牧羊人报告看到飞机以惊人的速度撞入山坡，只留了尾部可见。梅塔的遗体在撞击点不远处被发现，埋在
    8 英尺厚的泥炭下。


    1941 年的圣诞节并没有宁静，另一架 `Hurricane` 在奥文格姆（Ovingham）附近低空飞行时坠毁。同样在 12 月，一架 `Westland
    Lysander` 飞机在靶场上方参加炮兵协作演习时坠落在奥特伯恩（Otterburn）。飞行员 J.K. 阿斯汀飞行官注意到，从 `RAF Clifton`
    到达奥特伯恩后引擎开始熄火。无法解决问题，他被迫在软且不平整的地面着陆，导致飞机在着陆时翻扣。幸运的是，阿斯汀未受伤逃，飞机后来被打捞。

