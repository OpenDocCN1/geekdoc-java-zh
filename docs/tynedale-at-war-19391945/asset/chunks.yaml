- fmt: '

    Not everyone was prepared to take in evacuees and, after persistently turning
    away people from his nine-room vicarage at Wall, where he lived with his mother
    and one domestic servant, the vicar of St Oswald in Lee, the Reverend Frederic
    Cecil Westgarth, was fined £5 by Hexham Magistrates – and was told it could have
    been £50, or three months in prison. Chairman of the bench Brigadier Sir Loftus
    Bates said: ‘I cannot help regretting that this charge should be preferred against
    a minister of religion.’


    Chief billeting officer for the Hexham Rural District Selby Wood was full of praise
    for the way the district had responded to the emergency. He said `99` per cent
    of households had co-operated wholeheartedly, and added: ‘No praise can be too
    high for the splendid voluntary work of the billeting officers. They had a most
    complex and difficult task to carry out, and they carried it through with a cheerfulness
    and efficiency which was truly laudable. Their task would have been impossible
    without the co-operation of the householders. Many of the householders tell me
    that some of the mothers who have been evacuated are only too willing to do something
    in return for the hospitality provided. Many of their husbands have volunteered
    for service and the children have been moved from familiar surroundings.’


    A two shift system was introduced at the Hexham schools, with local children taught
    from `9am` to `12-30pm`, swapping desks with the evacuees in the afternoon, as
    they were taught from `1-30` to `5pm`. Positions were reversed in subsequent weeks,
    with the evacuees taught in the morning and the locals in the afternoon.


    By the second week of the war though, several of the evacuees and their mothers
    found they could not cope with country life and preferred to brave the bombs back
    in Newcastle.


    An appeal went out for blood donors and the matron of Hexham Hospital also called
    for donations of old nightdresses and pyjamas.


    There was bitterness at Prudhoe, where the town’s volunteer air raid precaution
    wardens were furious to find that when hostilities broke out, a number of full
    time `ARP` wardens were appointed to paid positions – and the volunteers were
    being asked to train them. Councillor Mrs Ada Blackburn told Prudhoe Urban Council:
    ‘Our wardens are very sore about the matter. They volunteered, and now someone
    else who did not come forward when there was a call for volunteers is given a
    full time paid post. It is a very unusual position to ask a man who volunteered
    to train someone else who is being paid for the job.’


    ## Escape after U-boat attack


    An early taste of the horrors of war came when a German U-boat sank the liner
    `SS Athenia` on `10 September` as it was travelling to Canada from Liverpool.
    Among those on board was Mrs A. Butterley of Windsor, Ontario, who grew up in
    Humshaugh and had been visiting her sister in Wall. Mrs Butterley told a `Courant`
    reporter: ‘Everyone was in good spirits, because we were heading for home before
    the war broke out. The ship was so crowded that one of the dining rooms had to
    be converted into a dormitory. Suddenly, there was an indescribable thud and all
    the lights went out. No-one was thinking about torpedoes or submarines but we
    instinctively knew what had happened. The children were terrified, but on the
    whole there was little in the way of panic.’


    She managed to grope her way through the darkened ship to reach the deck, but
    had to wait for an hour and a half for a lifeboat. A davit broke when one of the
    lifeboats was being lowered into the water and a number of passengers drowned,
    she reported. Another boat was filled entirely with women and children, with no
    men to row it, but Mrs Butterley had no idea whether they had survived.


    She was finally able to scramble aboard the last lifeboat to leave the ship, one
    of seventy-five people crammed into a craft designed for just fifty, and she reported
    that the submarine had surfaced and fired two shots before submerging again. ‘It
    was nightmare experience,’ she said. ‘We were packed together, scarcely daring
    to move for fear of upsetting the boat. Every wave washed over the boat and we
    were soon drenched to the skin. Those who had shoes on took them off and used
    them to bale out the water.’


    After twelve hours in an open boat on the wild Atlantic, their increasingly weak
    cries of ‘Ahoy’ were heeded by a passing Royal Navy destroyer and they were picked
    up. Mrs Butterley said she felt dazed and weary and was deeply grateful for the
    hot drinks served by the crew. She believed everyone in her boat was saved, although
    a significant number were suffering from broken limbs.


    Mrs Butterley felt herself doubly fortunate to have been saved, for she had crossed
    the Atlantic on the `Athenia`, and had tried to get the same cabin for the return
    journey, but it had already been booked. She later learned that her cabin of choice
    had been blown to pieces in the U-boat attack.


    She had crossed the Atlantic seven times, but said: ‘Once I get safely back to
    Canada, I will cross it no more.’


    An appeal went out for women aged between `18` and `43` to enlist with the Women’s
    Auxiliary Air Force, where there were vacancies for cooks, mess orderlies, motor
    transport drivers, clerks, telephone and teleprinter orderlies and fabric workers.
    The daily rates of pay ranged from `7s 10d` for a junior officer to `£1 2s 4d`
    for a senior officer.


    The war was only two weeks old when the district suffered its first casualty blamed
    on the blackout, when an `89-year-old` evacuee was killed after being struck by
    a bus at `Widehaugh`, east of Hexham. United Bus Company driver William Eade told
    the inquest into the death of `Benjamin Chambers` that he had been driving his
    bus from Hexham to Newcastle just after `9pm` on a dark and rainy night. He was
    showing the permitted lights, side lights masked over, which would have been visible
    to anyone coming towards him. He was travelling between `10-15 mph` when he felt
    something hit his offside headlamp. He stopped the bus within its own length and
    found `Mr Chambers` lying close to the white line in the centre of the road. A
    post mortem examination showed he had suffered multiple injuries, any one of which
    could have killed him.


    Coroner for South Northumberland P.M. Dodds heard that `Mr Chambers` was both
    deaf and short-sighted and in returning his verdict, commented: ‘It seems a great
    pity that a man of `89`, suffering from short sidedness and deafness, should be
    out unattended in the dark at this time.’


    He suggested that during the blackout, people should not walk in the centre of
    the road, but stick to the footpath, and should also wear or carry something white
    or light coloured so that they would be distinguishable.


    ![Image](Images/f0021-01.jpg)


    Even Hitler couldn’t stifle the Christmas spirit in Hexham in `1939`.


    The blackout regulations were stringently enforced and at `Haydon Bridge` the
    landlords of the `Haydon Hotel` and the `Scotch Arms` were each fined `10s` for
    having lights visible at their premises, with a similar fine imposed on the landlord
    of the `Grey Bull Inn` at Hexham.


    After closing at the outbreak of war, cinemas and dance halls across the district
    started to reopen three weeks later, with the proviso that all patrons brought
    their own gas masks with them. Lessons at the various schools were curtailed,
    with woodwork lessons devoted to making splints to form part of the ambulance
    facilities at the schools. Splinter and gas proof air raid shelters were also
    provided at the `Sele School` and `St Mary’s Roman Catholic School`. Eight shelters
    were provided at the senior school, six for each section of the `Queen Elizabeth
    Grammar School` and six for the junior school. Parents were advised that in the
    event of an air raid, the local schools were the safest place for their children
    to be.

