    汤姆林先生表示，该中心将具有无法估量的价值，因为它为工人提供了为期两周的假期，防止他们因过度而疾病并导致彻底崩溃，从而节省了数千小时宝贵的工业工时。东北休息委员会主席希尔拉·贝文顿博士（Dr
    Sheila Bevington）表示，在战争第五年，对休息的需求不仅是身体上的，也是心理上的。她提到，赫克斯姆中心尤为需要，因为东北战争工人的体力很差——这反映了女孩们营养不良，以及该地区可怕的失业和大萧条时期的遗症。


    ![Image](img/f0147-01.jpg)


    加拿大驱逐舰 `Restigouche` 号的船员在停靠于泰河下游的贾罗进行维修期间，在博弗朗特（Beaufront）和安尼克（Anick）地区协助收割，并与当地人交流。


    两名在船只停靠贾罗维修期间于安尼克地区协助收割的加拿大海员，在当地的一家酒吧过度地庆祝了他们即将重返大海。来自多伦多的等兵水兵 `Samuel Patton`
    和来自蒙特利尔的主任水兵 `詹姆斯·菲兹杰拉德`（James Fitzgerald）决定从他们在博弗朗特城堡意大利花园的底座上拆下两只青铜鹿作为纪念品。每只鹿价值
    `£50`，且由于暴力拆除留下的损坏无法修复。在受到警方质问时，这两个人起初否认参与，但事后承认各偷走了一个。


    警察督警 `威廉·古德费尔洛`（William Goodfellow）告诉赫克斯姆治安官，这两名男子以自愿身份在收割工作中表现异常出色，深受当地社区的喜爱和优待。因此，他们的这种行为给自己和船员全体带来了耻辱，这非常令人遗憾。


    代表两名男子的律师 `K.H. Bolam` 表示，他们在饮用过量酒精后去了城堡，那那里的人们对他们非常友好，于是决定拿走那只鹿。


    博姆先生说：“当这两个人清醒过来时，他们发现自己偷了鹿，感到非常尴尬。考虑到他们的体重，不知道他们是如何把那些鹿带回营地的，这引起了人们的推测。”


    他表示他们对自己的行为深表遗憾，并渴望支付费用。由于他们的行为，他们在`杜鲁姆监狱`（Durham Gaol）度过了几个夜晚，这对他们产生了深远的影响。他还指出，虽然土地主
    `哈罗德·库伯特上尉`（Captain Harold Cuthbert）正在海外服役，但他拥有委托书的母亲 `瑞雷夫人`（Lady Rayleigh）并没有要求严判，也没有寻求任何赔偿。


    治安官们同意，监狱里的时光对盗窃行为已经是足够的处罚，并撤销了指控。他感谢这些人通过协助收割为英国做出的贡献。


    这些男子来自加拿大驱逐舰 `HMCS Restigouche` 号，全船员都协助城堡以及附近的安尼克庄园（Anick Grange）进行了收割。


    ### 被“流氓”气球杀死


    1943 年 11 月 4 日（周四），两个用于防止德国空军（`Luftwaffe`）低空攻击和精确轰炸的防御气球从它们海岸附近的锚点脱离，向内陆漂移至泰德尔（Tynedale）地区。其中一个流氓气球在斯帕蒂·利（Sparty
    Lea）附近的奥伦代尔山（Allendale fells）停了下来，其锚绳被挂在一个干石墙上。


    警察迅速放气了第一个气球，然后出发放气停在山上更高处的第二个气球。许多观者聚集在一起观看，其中一位来自辛德霍普（Sinderhope）布罗盖特小屋（Broadgate
    Cottage）的委员会员工 `罗伯特·贝蒂`（Robert Batey，47 岁）决定近距离观察。看到贝蒂先生进入田野并在气球旁蹲下，似乎开始卷它。然而，气球随后爆炸，导致他致命伤。他稍后在赫克斯姆医院因伤去世。


    在随后的验讯会上作证时，来自斯帕蒂·利低哈伊雷克（Low Hayrake）的玛乔丽·吉尔穆（Marjorie Gilmour）表示，当警察离开第一个气球时，他们警告人们远离它。包括一名老人和两个孩子在内的人群站在墙后看着气球，此时气球爆炸了。


    来自斯帕蒂·利辛霍普米尔（Swinhope Mill）索德登房屋（Thorndene House）的 `约翰·莱特`（John Wright，79 岁）被送往纽卡斯尔皇家维多利亚医院，左眼割伤；同样来自辛霍普米尔的
    `安妮·费瑟斯坦`（Annie Featherstone，28 岁）也受了多伤。来自艾伦黑德（Allenheads）教堂小屋（Chapel Cottages）的
    7 女孩 `薇拉·尼克森`（Vera Nixon）被送往赫克斯姆医院，患轻微割伤；而来自斯帕蒂·利白岭（White Ridge）的 14 岁少年 `哈罗德·尼克森`（Harold
    Nixon）被送往肖特利桥医院（Shotley Bridge Hospital），胸部穿刺伤和多处碎片伤。


    在 2006 年，当时 77 岁的尼克森先生表示，爆炸后他在医院呆了近两个月，身上仍然留下了疤痕。“我记得有两个防御气球被挂在山上，”他回忆道，“周围有几个人，警察也在那里。他们排出了其中一个的气体，但突然‘砰’的一声，等我再反应过来时，已经在
    50 码外了！我在肖特利桥医院住了七周，直到今天我身上还带着碎片。”


    爆炸后，气球尾部起火，火焰逐渐蔓延到头部，直到完全烧毁。空军部的一位专家在验讯会上告诉，他认为爆炸可能是由于气球内的一小袋气体和空气因摩擦引发的。某些版本的防御气球携带有小型爆炸药，可在被敌机缠绕时触发以毁灭，这也是爆炸的另一个可能原因。


    ### 战斗中的当地英雄


    在南斯福克郡郡服役的普鲁德（Prudhoe）士兵威廉·亨利·查沃斯（William Henry Charlesworth）在西西里的战斗精神让他赢得了军事勋章。他是参加滑翔机袭击小组的一员，其目标是占领一座名为“大桥”（Ponte
    Grande）的桥，士兵们称其为“沃卢桥”（Waterloo Bridge）。


    大桥被占领后，炸药被移除，电话线被切断，确保了这座重要桥梁没有被炸毁。在大桥被占领 15 分钟后，一队乘坐卡车的德国士兵试图强攻大桥北端，但查沃斯手持`布伦`机枪战斗，击毙了五人。当弹匣用光后，他英勇地用`布伦`枪当棍子冲向剩余的人员，此举确保了拆炸药的工作没有中断。


    ![Image](img/f0150-01.jpg)


    来自普鲁德的士兵威廉·亨利·查沃斯在西西里战获得了军事勋章，此前是因为他在腹部中弹的情况下仍拒绝向敌人投降。


    在另一次行动中，他在猛火力下手持`布伦`机枪跑了 50 码，以便他的小队撤离战斗。第二天下午，查沃斯腹部受伤，在 24 小时内没有接受医疗治疗，其期间他一直在清洁和维护他的`布伦`机枪。当大桥被敌人重新占领时，他拒绝投降并躲了起来，后来重新加入了他的排。


