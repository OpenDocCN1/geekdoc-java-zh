    Councillor Edward Pigg of Corbridge, told Hexham Rural District Council there
    was strong local feeling that while railings had been removed from cottage gardens
    and terraced houses, those of the big estates, some of which were guarded by large
    metal gates which would yield much valuable iron, had been left in situ. He said:
    ‘People are getting very annoyed about this. Why should the poor people have to
    give up their rails, while the big estates get off scot free? Something needs
    to be done about it.’


    He was supported by Councillor M.S. Burdus, who said that on one estate alone,
    there were over 100 metal tree guards supposedly protecting trees which in fact
    were ‘as old as Methusalah’.


    In the King’s New Year Honours List, Merchant Navy captain John Thomson, of Allendale,
    was made an OBE in recognition of his heroism when his ship was not only torpedoed,
    but then subjected to a dive bombing attack. His vessel was seriously damaged
    in the U-boat attack, and there was grave danger of an explosion from the benzine
    fumes rising from both the ship and the sea. Captain Thomson and his crew managed
    to get the stricken vessel into port, but there it was again attacked by German
    dive bombers and suffered further damage. The citation noted that Captain Thomson
    had exercised fine powers of leadership during both actions and it was largely
    through his determination, resource and skill that the ship had been saved.


    ![Image](Images/f0129-01.jpg)


    Captain John Thomson of Allendale (40) was awarded an OBE in the King’s New Year
    Honours List of 1943, for his bravery in saving his oil tanker after it had been
    torpedoed and dive bombed. There was always grave danger of fire and explosion,
    not only from the falling bombs, but also fumes from the cargo, with the deck
    and sea around the vessel awash with benzine.


    Also honoured was Trooper Peter MacDonald (25) of Birtley, who gained the Military
    Medal for distinguished bravery in saving the lives of several of his comrades
    in the Battle of El Alamein. Trooper MacDonald, who was serving with the Notts
    Sherwood Rangers Yeomanry, lost a leg in the battle.


    ![Image](Images/f0130-01.jpg)


    Trooper Peter MacDonald (25) of Birtley, near Wark, was awarded the Military Medal
    for saving the lives of several comrades at the Battle of El Alamein. Serving
    with the Nottinghamshire Sherwood Rangers Yeomanry, he lost a leg in the action.


    Observance of the blackout in Hexham was described as ‘ludicrous’ by Councillor
    Joe Cullen at a meeting of Hexham UDC with particular reference to the practice
    of carrying large torches, which were flashed in people’s faces. He said: ‘It
    does not matter what time of night you are out, you are likely to meet one of
    these comatose cockroaches. Some of these so-called torches are not torches at
    all, but more like portable searchlights. I hope people are not lulling themselves
    in a false sense of security. This war is not over yet and anything may still
    happen.’


    Councillor J.M. Heslop grumbled: ‘I would love to know where these people with
    big torches manage to get their batteries ...’


    ### Seven killed in grenade accident


    The biggest local loss of life in the war came at Coanwood on 21 January 1943
    when seven men were killed, and seventeen others injured when a rifle grenade
    exploded during a training exercise. The dead were two officers, four NCOs and
    a gunner in an accident which was never satisfactorily explained.


    The dead men were Captain Mark Francis Shackle (25) of Northwood, Middlesex; Second
    Lieutenant Alfred James Bell (30) of Harlesden, London; Regimental Sergeant Major
    Herbert William Revel-Burroughes DCM (38) of Birkenhead; Battery Quartermaster
    Sergeant John Stanley Wilks (31) of High Wykeham; Lance Bombardier William John
    Wright (25) of Luton; Sergeant Raymond Porritt (32) of Darlington and Gunner Edward
    John Weston (32) of London.


    The inquest at Haltwhistle heard that a group of soldiers were being instructed
    in the use of the rifle grenade by Battery Sergeant Major F.J. Jenkins, and were
    gathered in a semi-circle around him as he explained the use of the weapon, which
    was supposed to fire the grenade a distance of 200 yards. The grenade was fitted
    to a dispenser cup and the men were told to retreat to a distance of six to seven
    yards away when the weapon was discharged. A witness saw the sergeant major pull
    the pin out of the grenade and put in into the dispenser correctly, but when the
    trigger was pulled there was ‘a terrific explosion and blinding flash’ and the
    blast left twenty-four people lying dead or injured.


    The battery sergeant major survived the explosion, but was lying critically ill
    in hospital and could not give evidence, although it was clear that the grenade
    had never left the dispenser cup.


    In reaching his verdict, Coroner P.M. Dodds said that the only possible explanations
    were that the grenade had not been fitted in the dispenser correctly – which witnesses
    said was not the case – or there had been some defect with the grenade itself.
    He recorded findings of death by multiple injuries through the explosion of a
    grenade, the cause of which was unascertained.


    History was made at Hexham Magistrates’ Court in January when auxiliary policewoman
    Greta Arthur became the first female officer to give evidence there. She told
    magistrates she had seen big sparks belching from the chimney of a house in Round
    Close in Hexham, thereby creating a breach of the blackout regulations. Defendant
    Thomas Cowan said the sparks were caused by his putting water on the fire to damp
    it down and this had set fire to the chimney. He was fined 10s.


    At the same court, it was reported there had been ‘considerable trafficking in
    clothing coupons’ in Hexham when the first case involving a breach of the Consumer
    Rationing Order came before the local bench. It involved 74-year-old pensioner
    Thomas Akenhead from Gilesgate, Hexham, 64-year-old labourer Thomas Bracken from
    Newcastle and Mrs N. Robson from Princes Street in Corbridge.


    Akenhead reported to staff at the Assistance Board that he had lost his clothing
    ration book from a locker at the lodging house in which he was staying. When questioned
    though, he admitted selling it for £1 to fellow lodger Bracken, who in turn had
    sold it on to Robson for 25s, spending the profit on beer. Robson was fined £10
    with £2 costs, while the two men were bound over in the sum of £5 to be of good
    behaviour.


    Stfordham farmer John Dodds of Brixter Hill was also taken to court for failing
    to plough out sufficient land on his farm as instructed under the Defence (General)
    Regulations. He was ordered to plough out 44 of the 134 acres on his farm, but
    had only ploughed 33\. Prosecuting on behalf of the War Agricultural Committee,
    barrister Richard Ellis said there was a requirement for 165,000 acres to be ploughed
    out in Northumberland, and if all farmers had followed Dodds’ example of failing
    to carry out a quarter of the work demanded, there would have been chaos.


    Dodds told the court he felt he had been given an unreasonably heavy allocation
    and, because of the weather and other issues, he had been unable to meet his target
    in the time available, although he had ploughed it since. He said: ‘We had a bumper
    harvest – 50 large stacks of corn – which was a great contribution to the national
    larder. We have done all that is humanly possible to help the national cause.
    We have done our duty as farmers.’


    ![Image](Images/f0132-01.jpg)


    After being reported missing believed killed in action during fighting in the
    Middle East, Captain Kit Patterson of the Recce Corps of the Royal Northumberland
    Fusiliers, was confirmed as being a prisoner in an Italian transit camp in July
    1942.


    The bench did not agree and Dodds was fined £5, with five guineas costs.


