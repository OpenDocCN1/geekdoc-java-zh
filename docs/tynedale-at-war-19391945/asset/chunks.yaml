  trans: '


    多萝西维持着布料生意，而奥西很快又回到诺森伯兰郡的村庄和农场继续经营他的职业。这对夫妇于 1946 年搬到海克斯姆，并幸福地生活了 59 年，直到多萝西去世。奥西于
    1969 年退休，即便在 90 多岁时他仍在驾驶汽车。


    《海克斯姆快报》（Hexham Courant）中“弗雷德叔叔儿童角”的成员们与地区妇女协会、妇女志愿服务团和其他机构合作，在灌木丛中采摘玫瑰花刺果。他们获悉，全国范围内的这一行动收获了
    200 吨这种橙色的果实，其中富含对抗感染的维生素 C。根据每磅 300 个花果的估算，这意味着全国范围内从多刺枝头上采摘了约 1.43 亿个花果，足够制作成
    60 万瓶糖浆，糖浆以每 6 盎司 1 先 9 士的价格出售，或每 8 盎司 2 先 4 士。孩子每天喝一勺，就足够提供其一半的维生素需求。


    一个来自普鲁霍埃德奇威尔（Edgewell）的无赖子找错了对象，向对方求买一张抽取肥鹅奖的彩票票。这位潜在买家是一名下班警察，当被问及是否想要票时，他说他全要了，并以非法组织彩票罪逮捕了那个无赖子。他在海克斯姆小事法庭被罚款
    10 先士。


    在同一所法庭上，一名因汽车保险杠未涂白色油漆而被罚款的驾驶员抱怨道，在圣诞平安夜午夜时分，警方对海克斯姆的一处停车场进行搜查后，他被收到了传票。他表示搜查的时机选择得糟糕，这与一年中这一夜晚惯有的善意精神和唱圣诞歌的氛围形成了鲜明对比。


    两名男子因滥用汽油被罚款各 5 英镑：一人使用他单位的家具货车从海克斯姆开车前往 5 英外的汉肖（Humshaugh）参加舞会；另一人则非法开车从科布里奇奇（Corbridge）三英里去海克斯姆看电影。


    尽管两名士兵被俘的时间不同且频繁被转移到不同的战俘营，但科布里奇的两个士兵在同一个营地会合了，两人的家人都在圣诞贺卡中得到了问候。在同一个营中，还有皇家工程师团的
    H·布罗迪·科克兰恩（H. Brodie Cochrane）中尉、皇家炮兵队的芬尼克·迪·汉蒙德（Fenick Deane Hammond）中尉，以及皇家诺森伯兰掷军队的哈特威斯尔肯尼斯·克拉克（Kenneth
    Clark）少校。


    汉蒙德中尉在圣诞卡中报告了这次会面，信中提到他身体良好，并请问候科布里奇的朋友。他还报告说营里有一个舞蹈乐队和一个交响乐团。


    ## 军舰周与泰恩代尔号战舰


    1942 年 2 月，海克斯姆军舰周宣告启动，该地区被负责筹集 20 万英镑以赞助皇家海军驱逐舰`HMS Tynedale`。这艘驱逐舰并未直接以地区命名，但作为一艘亨特级舰船，它以“泰恩代尔狩猎队”（Tynedale
    Hunt）命名，该队的猎犬居住在科布里奇附近的斯塔格肖（Stagshaw）。舰的军官室里挂着一只诺森伯兰狐狸的面具，是由狩猎队队长送给该舰的。


    募捐活动通过穿越全镇的大游行启动，由民兵卫队的乐队领队其中包括其中包括兵卫队、军事和民防运动的代表，以及国家消防局、红十字会、空军训练团、妇女土地、童子军和女童子军。


    全地区举行了众多活动，包括募捐、音乐会和纸牌赛，而阿伦代尔（Allendale）附近的基恩利议会学校的学生们筹到了 93 英镑 13 先士——折合每人 5
    英镑 10 先士 2 便——其他学校也筹集了类似的金额。


    在了一周忙碌的筹款后，组织者召集了四位当地战争英雄正式揭晓了筹集到的总额：三等军官德里克·吉尔克斯特（Derek Gilchrist，大英帝国勋章）、飞行军官哈罗德·罗布森（Harold
    Robson，卓越飞行勋章）、飞行军官亚瑟·加威尔尔（Arthur Garwell，卓越飞行勋章）以及罗伯特·巴蒂（Robert Baty，盖然勋章）——当公布在武装部队日存入了
    268,476 英镑时，现场爆发了巨大的欢呼声。到周末结束，最终数字为 325,099 英镑。


    ![Image](img/f0110-01.jpg)


    当地企业对 1942 年海克斯姆军舰周的启动给予了巨大的支持。


    `HMS Tynedale`的船员们被问及想要从新收的“家庭”那里得到什么舒适，向海克斯姆妇女协会要袜子、毛衣、足球鞋、扫雷手套、飞镖盘、棋游、长凳棋、书籍和纸牌——还有一台用于协助舰上戏剧表演的钢琴。在一周内，他们收到了海克斯姆海因斯（High
    Reins）的莱斯利·曼（Leslie Mann）夫妇赠送的一台钢琴，他们唯一的独子在几个月前服役于舰队航空兵时牺牲了。


    `HMS Tynedale`于 1939 年 4 月 11 日从格拉斯哥克莱河的亚历山大·蒂芬父公司订购，于 1939 年 7 月 27 日下水。她于 1940
    年 6 月 5 日下水并于 1940 年 12 月 2 日服役，总建造成本为 425,000 英镑。她的排水量 904 吨，配备有四门 4 英寸防空炮和八门较小炮。


    `Tynedale`主要负责护队和护卫任务，最初作为驻在普利茅斯的第一驱逐队的一部分，但在 1941 年 3 月 11 日，她在德国空军对普利茅斯码头的袭击中受损，停止了九天。


    12 月 15 日，她被转移到驻在普利茅斯的第 15 舰队。`Tynedale`的高光时刻出现在 1942 年 3 月 27 日，当时她参加了著名的圣纳代尔突袭行动（St
    Nazaire Raid），作为过时的、装满炸药的驱逐舰`HMS Campbeltown`号的护卫舰之一，后者被撞入德国占领的法国港口诺曼德（Normand）干船坞的闸门内。这次大胆的联合行动攻击使该港口不仅在战争剩余时间内瘫痪，在随后的五年内也无法使用。在位于尚岛西南，`Tynedale`发现了潜艇`U-593`并对其进行了攻击，最初使用深水弹，在潜艇被迫浮出水面后使用甲板炮。然而，潜艇设法潜水逃脱了——却在次年带着致命的报复归来。


    ![Image](img/f0111-01.jpg)


    `HMS Tynedale`。


    在与港口外袭击行动中幸存的小船只会合时，`Tynedale`和另一艘驱逐舰`HMS Atherstone`交战了五艘德国鱼雷艇。


    `Tynedale`于 3 月 29 日返回普利茅斯，与护队的其余舰只一同返回。她于 4 月 18 日修复完毕，继续在西南部海域执行护队任务。5 月 14
    日，她遭遇了德国辅助巡舰`Stier`号，并参与了击沉该舰的任务，尽管当时仅作为支持舰。她在 10 月还参与了击沉德国辅助巡舰`Komet`号的任务。


    `Tynedale`随后被派往地中海服役，作为第 59 驱逐队的一部分（她于 1943 年 3 月 8 日加入），负责护卫直布罗陀与阿尔及利亚之间的护队。在盟军入侵西西里期间，她充当了拦截者，并在
    1943 年 10 月荷兰货船`Felix Jan Van Manix`号被鱼雷击沉后，协助救援了 218 名乘客。'
