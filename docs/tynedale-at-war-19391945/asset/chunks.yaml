    然而，关于一架梅塞斯密战斗机在诺森伯兰郡荒原上低空飞行的报告，被米德尔塞克斯 `RAF Fighter Command` 的工作人员付之大笑，因为 `Ottercops`
    雷达的可靠性口碑并不好——它以无法区分雷暴天气和来袭飞机而闻名。该系统旨在为敌方攻击提供远程早期预警，但其提供的情报在去年曾受到质疑：在 1940 年 8
    月，它报告有三十架敌对飞机从北方接近海岸。但当由 `Ottercops` 派遣四架喷火式战斗机进入云霄时，他们惊恐地发现有 90 架德国轰炸机在另外 21
    架战斗机的护护下！


    女子空军辅助军士费莉西蒂·阿什比（Felicity Ashbee）记得，1940 年 5 月 10 日的晚上几乎无事可做，直到 `Fighter Command`
    的地图上出现了一个标记点——在北海远的海域，诺森伯兰郡岸外——被 `Ottercops` 莫斯（Moss）捕捉到了。值班的三名成员大笑起来，认为那些乡下佬又搞混了。


    最初绘图时，那架梅塞斯密特战斗机的高度约为`15,000ft`，以`300mph` 的速度几乎正西飞行。`Ottercops` 将这次潜在袭击报告为“三架以上”，但随着飞机的接近，其他四个站点（Danby
    Beacon、Douglas Wood、Bamburgh 和 Cresswell）正确地将其识别为单架飞机。该飞机被命名为“42 号袭击”。当它距离海岸 50
    英里时，它已报告给位于 `RAF Ouston` 的 `RAF` `13 Fighter Group`，并在 `22.30 hours` 派遣了一架喷火式战斗机出动。


    整整两天后，BBC 的一则广播透露，赫斯（Hess）——副元人和希特勒的得力助手——相当不体面地降落在格拉斯哥郊外，赫斯在那里透露他想会见汉密顿公爵，他认为自己可以和这位士做生意。尽管汉密顿飞行翼指挥官后表示对自己为什么被选中感到困惑，但赫斯相信他们对航空的共同兴趣、战前避免英德战争的愿望，以及他们与阿尔布雷希特·豪泽弗（Albrecht
    Haushofer，卡尔·豪泽弗之子，地缘政治教授，希特勒劫持的 `Lebensraum` 哲学的主要建筑师）的友谊，将为谈判铺平道路。


    赫斯穿上德国空军的 `hauptmann`（上尉）制服，配备了一台 `Leica` 相机和许多用于治疗真实和虚幻疾病的药物——众所周知他有些疑病症倾向。他背诵了飞行路线，然后将飞行计划绑在右大腿上。赫斯飞越北海，其路线使他保持在英国雷达视线以下方，距离英格兰海岸至少
    200 英里。当他向正西转向并开始接近东北海岸时，天气晴朗，满月正升起，但距离日落还有一小时，他担心被 `RAF` 战斗机发现并击落。


    他事后告诉汉密顿公爵，他通过在海岸外盘旋 40 分钟直到太阳下山作为补偿。赫斯飞行得太快，无法被拦截；在后来写给妻子的信中，他说在那阶段他正全速飞行并享受其中。他说爬上了高度为`2,676ft`
    的切维特山坡，从另一侧滑入苏格兰。赫斯在黑暗中没有发现汉密顿公爵的邓加维尔别墅（Dungavel House），错过了目标。当燃料开始耗尽时，他决定跳伞。


    飞机坠落在格拉斯哥以南 10 英里的博尼顿荒原，而他降落在附近的一个农场。他被首席耕地农大卫·克莱恩（David McLean）发现，克莱恩问他：“你是德国人吗？”赫斯回答：“是的，我是阿尔弗雷德·霍恩上尉——我给汉密顿公爵带了重要消息。”


    麦莱恩的老母亲为那位事事挑剔的赫斯泡了一壶茶（但他拒绝了，转而要了一杯水），同时赞叹他剪裁得体的制服和昂贵的手表。一名农夫被派去寻找有权威的人，赫斯很快就前往伦敦塔，那是他在随后几个月里被关押三个监狱中的第一个。他曾两次自杀。期间，德国广播宣布赫斯飞过了该国，并补充说这位副元人一直遭受幻觉和精神疾病。


    尽管有充分证据表明他确实精神异常，赫斯在纽伦堡审判被判定具有受审能力。他被指控犯有许多罪，包括策划发动战争以及指示盟军飞行员在德国领土上跳伞应被“清理”。他被判定有罪，并判处终身监禁。他在柏林的施潘道监狱服刑，并最终于
    1987 年 8 月成功自杀，享年 93 岁。


    新年是随着赫克斯姆水电站（Hexham Hydro）的一场化装舞会开启的，那里一位勇敢的人打扮成墨索里尼，被当场逐出大厅。


    一名 26 岁的赫克斯姆男子死里逃生，他当时在 Warden 附近的 Quality Cottages 穿过纽卡斯尔-卡莱的铁路线，他的车在轨道上熄火了。当约翰·隆斯塔夫（John
    Longstaff）尝试重新启动引擎时，车辆被一列货车撞上，沿着轨道被缓冲垫推向前了半英里。


    他的岳母 I·哈德尔斯坦夫人（Mrs I. Huddlestone）从卧室窗外目睹了这一切，她在向他挥手时确信他已经死了。她告诉 `Courant` 报：“货载得很重，运行得很快。我比约翰先看到火车，但震惊得没能大喊。撞击的那一刻我闭上了眼睛，然后对女儿说约翰不在了。轨道上剩下的只有汽车轮子掉下的轮毂，我从没想过能再次看到活着的约翰。”


    然而，约翰不仅仅受了轻微割伤和淤青并生存，而且当天就回了家。他说：“汽车之前运行完全正常，但在轨道中间熄火了。我正在检查仪表盘和自启动器时，听到火车过来了。我抬头一看，引擎离汽车只有
    20 码了。除了坐在驾驶位上闭上眼睛祈祷最好的结果外，我没有时间做任何事情了。等我知道我已经在车外了，脸上的小伤口贴着创可贴。我完全不记得事故的任何事。”

    1941 年 1 月还引入了学校午餐（在之初被称为集体用餐），在伊丽莎白女王文法学校（Queen Elizabeth Grammar School）宜人的食堂里供应。约
    140 名孩子分两批次用餐，每餐费用为`4d`，一周`1s 3d`，同一家庭两个孩子一周`2s 4d`。费用仅涵盖购买食物的成本，剩余部分由县教育委员会承担。


    科布里奇奇（Corbridge）的一家咖啡馆老板被罚 10s 并处支付 30s 诉讼费，因为她被发现在卖水牛奶。县衡量部门一名男子在 River View
    咖啡馆购买了一杯热牛奶进行测试，发现含有 36%的水。结果显示，两品牛奶中加入了一品脱水，但被告称那杯热牛奶是误用来冲咖啡的。


    这对舞台和银幕上不可挡的喜剧大师杰克·赫伯特（Jack Hulbert）和西西莉·库特尼奇（Cicely Courtneidge）出现在赫克斯姆的论坛剧院（Forum
    Theatre），为所有军方人员表演了一场特别的免费午场演出。这场演出的之所以能实现，是因为这些伦敦西区明星是赫克斯姆 Summerrods 的 P.P.
    菲利普少校及夫人的私人朋友。

