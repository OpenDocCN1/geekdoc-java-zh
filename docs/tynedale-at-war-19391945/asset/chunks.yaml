    One of the more bizarre decisions which had been taken was the silencing of the
    bells at St Andrew’s Church in Corbridge so they no longer chimed the hours, for
    the duration of the war. The decision was taken by the vice chairman of Corbridge
    Parish Council Councillor `R.R. Ridley` as ‘a security measure’ but without the
    knowledge of the vicar, the `Rev. M.M. Barlow`, who was on holiday at the time.
    The decision had caused some consternation in the village, especially as `Big
    Ben` was still booming out over London. The vicar felt the parish council did
    not have the powers to order the silencing of the clock, without reference to
    him or the church wardens. He said: ‘I am the last person to be concerned about
    my rights, but I am concerned about the honour of the Church, of which I am the
    personal representative in the parish. I am surprised the clock was stopped striking
    without consulting me.’


    No order had been issued by the `Home Office` with regard to the striking of clocks
    and it was agreed that the clock chimes should be restored.


    At Bellingham Magistrates’ Court, `Ellen Charlton`, of `Pasture House`, `Wark`,
    appeared on a charge of selling eggs at 4d each, rather than the Government stipulated
    maximum price of 3d each. Charlton told the court she was aware of the provisions
    of the `Maximum Prices for Home Produced Eggs` order, but felt she was entitled
    to charge more, because the eggs bought in a test purchase by `Sidney Clough`
    of the `Bellingham Food Control Committee` were particularly large and might have
    been double yolked.


    She was fined £1, with £1 costs, and chairman of the bench `Major G.D. Anderson`
    told her she could have been fined £100\. In response to her plea that she only
    had a few hens which laid very few eggs, `Major Anderson` said: ‘It does not matter
    how many poultry you have. If you have only one hen which lays only one egg a
    day, and you sell that egg above the maximum price, then an offence has been committed.
    However irksome the regulations might be, they have been made in the best interests
    of the country as a whole, and it is up to everyone to carry out those regulations
    as cheerfully as they can.’


    He asked the press to publicise the case as a deterrent, as there had been suggestions
    – which could not be proved – that other poultry keepers in the North Tyne had
    been selling eggs above the permitted price.


    There was good news for `Mr and Mrs J. Atkinson`, of `Dilston Haugh`, `Corbridge`,
    who had been told a month earlier that their eldest son, `Able Bodied Seaman Joseph
    Atkinson`, was missing, presumed killed, following the sinking of the destroyer
    `HMS Esk` either by torpedo or mine. They were overjoyed when they received confirmation
    that he had been picked up and was now in a prisoner of war camp.


    ![Image](Images/f0059-01.jpg)


    `Able Bodied Seaman Joseph Atkinson` (22) of `Corbridge` wrongly reported killed
    in action when his ship `HMS Esk` was sunk. Note on his cap tally the name of
    his ship has been scratched out to avoid giving information to the enemy.


    As well as being the bearer of bad news in wartime the `Courant` could also spread
    good news, as in the case of `RAF Sergeant Harold Robson`, of `Hexham`, for it
    was a `Courant` reporter who told his family that he had been awarded the `Distinguished
    Flying Medal` in recognition of his forty-one daylight missions over occupied
    territory. While stressing that the award was for teamwork by the whole crew of
    his `Bristol Blenheim` bomber, the observer had experienced some hair-raising
    experiences in raids over Holland, Belgium and Northern France.


    ![Image](Images/f0060-01.jpg)


    `Sergeant Harold Robson` (26) of `Hexham` was awarded the `Distinguished Flying
    Medal` in October 1940 after taking part in 41 flights over enemy occupied territory.


    The most exciting incident came when the Nazis broke through the `Maginot Line`
    in France and the `RAF` was sent to check the advance of the mechanised German
    columns. `Robson’s Blenheim` was separated from the rest of the squadron by anti-aircraft
    fire. He said: ‘We found ourselves hedge-hopping, being harassed from the ground
    by machine gun and rifle fire, and with five `Messerschmitts` on our tail. Our
    gunner shot down one of the enemy planes and after that the others left us alone,
    as they seemed to have run out of ammunition. We came home with one or two bullet
    holes in the `Blenheim`, but that was all.’


    On another occasion, he felt a sharp pain in his leg, and looked down to see his
    leather flying boot had been torn by shrapnel. But that was nothing – only part
    of a day’s work.


    One of his more satisfying moments in the air was a raid on an airfield in occupied
    Holland, where he said: ‘We dropped out of the clouds to about 1,000 feet and
    then released our bombs. We saw them burst on a hangar in the middle of the aerodrome,
    and then flew back into the clouds before they could get the anti-aircraft guns
    into action.’


    He paid high tribute to the manufacturers of the `Blenheim`, one of the first
    British aircraft to have all-metal stressed-skin construction, retractable landing
    gear, flaps, a powered gun turret and variable-pitch propellers. He observed:
    ‘I have seen `Blenheims` returning after receiving terrible punishment from the
    anti-aircraft guns and Nazi fighter planes, and although they have been almost
    shot to ribbons, they have somehow or other got back. This is due to the skill
    of our pilots as well as the character of the machines they fly.’


    On the Home Front, there was devastating news for the ladies of `Tynedale` in
    that the `Board of Trade` had announced there would be a ban on the sale of silk
    stockings from 1 December 1940, as silk was needed for the war effort, notably
    the production of parachutes. The `Courant’s Women’s Topics` column reported:


    ‘Overnight, a pair of silk stockings became the most sought after commodity in
    `Hexham`, and soon after the opening of the ladies’ shops on Saturday morning,
    queues were forming at the stockings counters. By Monday morning, a pair of silk
    stockings was as scarce as snow in summer. There was further disappointment for
    those who intended investing in a nest egg of silks, for in order to ensure that
    all customers got a fair share of the available stocks, customers were restricted
    to one pair only. One shop even resorted to taking the names of all stocking buyers
    to confound would-be hoarders. The shopkeeper said: “The restriction is just one
    more sacrifice – a small one in comparison with others that are being made – that
    women are being called upon to make in the name of freedom.”’


    At the first annual meeting of the `Hexham War Supplies` depot, it was reported
    that 10 miles of material had been used to make 3,051 garments, 25 miles of gauze
    had been turned into 44,000 swabs and 12.5 miles of material been rolled into
    3,685 bandages. The depot was turning out 3,000 items per week, and the total
    output for the year was 109,000 items, made up by 33 different working parties.
    Among them was the woodwork class from `Hexham Senior School`, which was making
    wooden splints, bed rests and crutches.


    The crackdown on blackout offences continued, with the owner of the `Stagshaw
    Colliery` at `Corbridge` being fined £5 for allowing the pit heap to smoulder,
    giving out a glow which could be seen for a considerable distance. `Corbridge
    fire brigade` used 1,000 gallons of water to extinguish the blaze. Owner `Thomas
    English` of `Hexham` said he knew the heap was heating up and was in the process
    of assembling an electric pump to keep the fire under control. He had blanketed
    the heap in clay to damp down the fire but high winds had fanned the flames.


    `George Stoker` of `River View`, `Prudhoe` was fined £1 for a blackout breach
    when a chip pan on the hearth overturned and the blazing fat set fire to the chimney,
    creating a 3ft flame which could be seen from a considerable distance.

