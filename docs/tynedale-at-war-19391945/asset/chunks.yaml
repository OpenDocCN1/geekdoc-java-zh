    into by a goods train and carried half a mile along the track on the buffers of
    the engine.


    His mother-in-law, Mrs I. Huddlestone, witnessed the incident from her bedroom
    window as she waved him off and was convinced he had been killed. She told the
    Courant: ‘The goods train was heavy laden and was travelling quite fast. I saw
    the train before John did, but was too shocked to call out. I closed my eyes at
    the moment of impact, and then called out to my daughter that John was gone. All
    that was left on the track was the hub cap off one of the car wheels and I never
    expected to see John alive again.’


    However, John not only survived with minor cuts and bruises, but was able to return
    home the same day. He said: ‘The car had been running perfectly, but then stalled
    in the middle of the line. I was examining the dashboard and the self starter
    when I heard the train coming. I looked up and the engine was just 20 yards from
    the car. I hadn’t time to do anything other than remain in the driving seat with
    eyes closed, hoping for the best. The next thing I knew I was outside the car,
    having pieces of sticking plaster affixed to the small cuts on my face. I remember
    nothing of the accident at all.’


    January 1941 also saw the introduction of school meals, known as communal feeding
    on their inception, which were served in the pleasant canteen in the Queen Elizabeth
    Grammar School. Some 140 children were catered for in two sittings, at a cost
    of 4d per single meal, 1s 3d for a week and 2s 4d for a week’s meals for two children
    from the same family. The charges covered only the cost of buying the foodstuffs,
    with the remainder of the cost met by the county education committee.


    A Corbridge café proprietor was fined 10s and order to pay costs of 30s, when
    she was discovered to be selling watered down milk. A test purchase at the River
    View Cafe of a glass of hot milk served to a man from the county weights and measures
    department was found to contain 36 per cent added water. It emerged that a pint
    of water had been added to two pints of milk, but the defendant said the hot milk
    had been served in error, as it had been set aside to be used in the making of
    coffee.


    Those irresistible funmakers of stage and screen, Jack Hulbert and Cicely Courtneidge,
    made a personal appearance at the Forum Theatre in Hexham, where they gave a special
    free matinee performance for all forces personnel. The entire downstairs accommodation
    in the theatre was reserved for servicemen and women in a performance made possible
    by the fact the West End stars were personal friends of Major and Mrs P.P. Phillips
    of Summerrods, Hexham.'
