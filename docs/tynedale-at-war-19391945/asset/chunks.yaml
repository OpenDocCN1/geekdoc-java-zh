    卡鲁瑟斯告诉《库兰报》：“我设法拿到了两个红十字战俘包裹，这让我得以维持了相当长一段时间，但之后我不得不尽所能地搜寻食物。有时日子过得并不太艰难，因为山坡上长满了葡萄和桃子。


    ‘我们遇到的意大利人大多非常友好，他们冒着极大的个人安全危险为我们提供食物和住所。他们当时并不知道我是英国人还是德国人。当他们发现我是英国人时，他们提醒我注意附近的法西斯分子，并告诉我如何避开他们。我多次险些没有再次被捕。在我获得自由的七周里，有四周时间一直处于德军后方’”


    他成功找到了前往瑞士的路并与盟军汇合。


    并不是所有从意大利战俘营的逃亡都能如此成功。来自赫克斯姆的皇家诺森森伯兰掷骑兵团连上军士长大卫·福斯特（David Forster，29 岁）在 1912
    年 6 月于骑士桥被捕后，在试图逃跑时被击杀。与他的父亲大卫·福斯特军士（一位一战勋章获得者）一样，他是泰恩代尔橄榄球俱乐部的著名成员。他因在中非战役中英勇且卓越的行为被追记表彰。


    ![Image](img/f0154-01.jpg)


    在试图从意大利战俘营逃跑时被击杀的来自赫克斯姆的连上军士长大卫·福斯特，因在中非战役期间表现英勇且卓越被追记表彰。


    农业军团的女孩们被指责导致斯坦纳斯伯恩皇冠客馆的执照者陷入麻烦。衡器官员对北泰恩酒吧进行访问时发现，女店主玛丽·维尔·内维辛（Mary Wear Nevin）出售的金酒被严重稀释了，浓度比标准值低了约六%。


    法官们被告知，在金酒中加入水是因为内维辛夫人觉得，原汁的金酒对于经常光顾这家店的农业军团女孩们来说太烈了。检查官告诉法庭：“内维辛夫人可能觉得通过确保女孩子们们不喝过烈酒是在照顾她们，但她稀释金酒的行为完全站不住脚。”内维辛夫人被罚款
    4 英镑，并加 15 先令诉讼费。


    ## 六章


    ## 帝国反击


    许多泰恩代尔的人士参加了 6 月 6 日的 D 日登陆，因为第 50（诺森森伯兰）师是诺尔曼迪海滩登陆队的先遣部队。随着进攻的加速，伯纳德·蒙特马利将军（Bernard
    Montgomery）特别点名表扬了他们。


    从记者转行军人的唐纳德·莱斯利上尉（Donald Leslie）告诉《库兰报》，诺森森伯兰人在赢得上一场战争中发挥了巨大作用，在接下来的几个月里他们将再次如此。在描述
    D 日登陆舰队——这支有史以来集结规模最大的入侵船船队时，他说：


    ‘这是一场壮丽的奇观，大大小各的船只一眼望不到头——从万万吨的大舰到小小的动力登陆艇——而且我们上方有强大的空中保护伞罩。我们曾被警告可能会受到纳粹鱼快艇和
    U 潜艇的攻击，但那个夜晚几乎没有发生意外——这是对我们从皇家海军和皇家空军所获得支持的持久致敬。黎明前，天空闪烁着光，我们知道轰炸机正在寻找目标’”


    随着靠近法国海岸，莱斯利上尉回忆起听到一个明显的诺森森伯兰口音喊道：“离他们不远了。没多久我们又要加入他们了。”（Wah not far away from
    them noo. It’ll not be lang afore wah’re amang them agyen.）


    第 50 师在超过 5000 英尺的战线上进攻黄金海滩，那里布满了水线下的钢刺和致命武器。尽管他们遭受了岸上猛烈的火力，但在敦迪尔克撤离四年后，他们成功回到了法国土地。莱斯利上尉说：


    ‘我们是以极其艰难的方式完成的，因为这不是一次干岸登陆。我们进入海中，有些人没过腰部，有些人过了脖子，还有人完全没过了，但到下午 2 点，我们就有十二个营上岸了，到最后的光亮，桥头堡已经建立，我们向内陆推进了三到四英里’”


    他向来自赫克斯姆四特拉布拉斯的克拉克（Clark）下士致敬，这位士兵虽然受了伤，但请求留在海滩上，以免阻碍同伴的前进。


    ### “致敬士兵”筹款活动


    入侵与该地区几乎每个城镇和村庄开展的“致敬士兵”（Salute the Soldier）筹款活动恰好重合。激动人心的口号是：“通过巨大的个人牺牲捐款，回报我们士兵所成就的伟大事业。”


    现场有游行和特别行动——金钱源源涌入。在赫克斯姆，这一周由下议院院长、当地地议员道格拉斯·克利夫顿·布朗（Douglas Clifton Brown）上校启动，他看到美国大兵穿着整齐的制服在市中心游行，感到非常高兴。布朗上校说：“我想对他们表示热烈欢迎，并对我们这些英勇的盟友今天与我们在一起感到非常自豪。你们可能读过他们在海峡彼岸的表现有多好，以及在意大利的表现有多出色。我们为为一位伟大的美国人艾森豪威尔将军（Eisenhower，这位世界伟大将军之一）效力感到自豪。”


    ![Image](img/f0157-01.jpg)


    米克利的飞行军士西德尼·罗斯·安德森（Sidney Ross Anderson）因在对敌占领土的轰炸行动中被授予卓越飞行勋章。他是皇家空军大坝者小组的成员，还参与了在挪威峡湾沉没德国战舰“提尔比特茨号”。他在
    1945 年 1 月因飞机在对贝尔根 U 潜艇巢的袭击中失而丧生。


    赫克斯姆的爱国主义活动目标是 275,000 英镑，用于维持第 50 师的一个步兵营一年。该项目以游行启动，由赫克斯姆家庭军乐队领队，涉及皇家海军、家庭卫军、陆军辅助队（ATS）、女子空军（WAAFs）、民防队、国民妇女服务团（NFS）、红十字学员、童子军和女童军、救世军、男女旅团、农业军团和
    NAAFI 等单位。仅第一天就承诺捐了超过 106,000 英镑，总额由来自赫克斯姆小学的七岁女孩芭芭拉·阿姆斯特朗（Barbara Armstrong）在一次五月花柱舞蹈和其他庆祝活动上宣布。


    消防队举行了健身展示，家庭卫军的传令兵进行了表演。到周末，总额达到了 413,875 英镑，赫克斯姆远超目标。整个泰恩代尔也是如此，每个家庭和企业都倾尽全力支持这一事业。在贝灵汉姆，目标是筹集
    45,000 英镑以购买三辆丘吉尔坦克，最终通过扑克牌筹款、舞会、足球赛、体操表演以及来自贝灵汉姆的“闪光音乐会”的表演筹集了 70,000 英镑。


    全地区的目标为：阿康姆（Acomb）2,500 英镑，通过家庭卫军乐队音乐会、趣味足球赛和变装游行等努力实现；奥尔代尔（Allendale）6,000 英镑，通过皇家诺森森伯兰掷骑兵团乐队的音乐会；布兰奇兰（Blanchland）1,000
    英镑；科布里奇（Corbridge）15,000 英镑，通过音乐会、舞会和花园游览会实现；福尔通斯（Fourstones）和纽布罗（Newbrough）5,000
    英镑，通过五人制足球赛、音乐会、寻宝活动和保龄锦标赛实现；海登桥（Haydon Bridge）5,000 英镑，通过谷仓舞、灯笼讲座、运动会和扑克牌筹款实现；斯托克斯菲尔德（Stocksfield）20,000
    英镑，通过沙堡比赛、扑克牌筹款、儿童运动、团体射击比赛以及普鲁霍格莱曼人（Prudhoe Gleemen）的音乐会实现；里丁米尔（Riding Mill）10,000
    英镑，通过舞会、鼓击仪式、综艺演唱、电影放映、板球赛、儿童运动和乡村运动会实现；威拉姆（Wylam）15,000 英镑，其特别活动包括莫里诗舞蹈表演。


