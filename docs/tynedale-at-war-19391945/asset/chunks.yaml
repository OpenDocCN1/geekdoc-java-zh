    # 第 18 号营与费瑟斯顿公园


    第 18 号营与南威尔士的第 186 号营一样，是英国最大的军官营营。其人数有时达到 4,000 多名官兵战俘和多达 600 名德国勤务。为了容纳这庞大的人口，需要四个营区（`A`到`D`）内的约
    200 间小屋。除了住宿区外，营内还有一个剧院、图书馆、礼拜堂、医疗中心、面包店和一套原始的下水道系统。


    营里有自己的报纸——《泰因时代报》（`Die Zeit am Tyne`），共有十七个版本，全部在`Hexham Courant`报社印刷并分发全英国。随着遣返战俘回家工作的启动，最后一份报纸于
    1948 年 3 月付梓。


    ![Image](img/f0187-01.jpg)


    《泰因时代报》这本起源位于南泰恩河谷费瑟斯顿（Featherstone）战俘营的报纸，为泰恩代尔（Tynedale）带来了德国风味。


    该营开设了大学课程，由邻近纽卡斯尔和杜伦大学的学者授课，甚至接待了几位牛津大学教授的特别访问。


    对于德国勤务人员，这里设有职业课程，为他们回国后开启新职业做准备。该营还汇聚了他们那代最有天赋的德国音乐家和艺术家。这里有三个不同的管乐团，甚至还有一个木偶剧院，都为英格兰北部的观众表演。该营的文化声望之高，著名小提琴家犹迪·梅纽因（`Yehudi
    Menuhin`）曾曾在 1946 年至 1948 年间的某段时间访问费瑟斯顿。至于他为何在那些在美国和欧洲巡演以及与`柏林爱乐乐团`合作期间，抽空来到哈尔特威斯（Haltwhistle），仍然是一个谜。


    ## 恩格尔伯特·霍珀的经历


    在《海峡岛占领回顾》（`Channel Islands Occupation Review`）一书中，来自阿琛附近埃施魏勒（`Eschweiler`）的恩格尔伯特·霍珀（`Engelbert
    Hoppe`）描述了在泽西岛被俘并被送往英国前往哈尔特威斯的漫长旅程是什么样的感受。经过顺利航行后，海峡岛的战俘在南安普顿登陆，并从港口步行到车站。途中，他们遇到了波兰难民，这些人对德国士兵大声辱骂，甚至向他们扔石头。“在经历了所有可怕的经历和苦难后，谁能责怪他们呢？”`恩格尔伯特`问道，“但我记得英国守卫是如何制止这种行为并保护他们的战俘的，这给我们留下了深刻的印象。”


    `恩格尔伯特`没有忘记看到维拉斯夫军队（Vlasov army）的人员（他们背变加入德国人对抗斯大林）时，被一名俄罗斯政治官辱骂时的感受。“看着他们脸上写满了恐惧、焦虑和惊恐，我现在看来，他们意识到了即将发生的事情——被从赫尔运往海拉迪沃斯克或其他西伯利亚的某个港口接受折磨和处决，或者被丢在古拉格中饿死。”


    在连续三周除了守卫外没见过任何人后，`恩格尔伯特`和他的同伴被带往另一个火车站，送他们前往诺丁森郡。他们到达哈尔特威斯，沿着南泰恩河走过一座桥，穿过`恩格尔伯特`描述的世外桃源般的偏远景色，那里有起伏的丘陵，牧着牛和羊。


    ## 营内生活


    由于有高大的铁丝网围栏和地面上厚实的卷网，这个巨大的营有四个营区来安置战俘。在严厉的晨点人数后，`恩格尔伯特`和其他军官被带到不同的营区和尼森小屋（`Nissen
    huts`），每间小屋可居住多达 100 名战俘。第二天早上，他们看了关于德国和被占领东欧国家集中营的电影。这种情况持续了一周多。“这太残忍、太震惊了，几乎没有人相信，”他说。小屋里的课程标准等同于德国文法学校最后一年级。“我们被告诉课程将持续一年，”他说，“我们开始时几乎没有任何书，只能在卫生纸上写笔记。”


    其他想工作的军官被允许担任农场工、园丁和建筑工人。


    1945 年秋季，`恩格尔伯特`记得新一批战俘被送到了第 18 号营。无缘故，他们的物品被没收，并被来自安德斯军（`Anders Army`）的波兰守卫毒打。`Hexham
    Courant`报出现了愤怒的信，几天后，一个由英国军官和红十字代表组成的委员会出现了。案件被诉至法庭，者受到惩罚，战俘的物品被归还。`恩格尔伯特`说：“这次事件以及处理过程的公正性，即使在我们极少数纳粹分子或军国主义者眼中留下了巨大的印象，他们带着极高的尊重谈论此事。”


    ## 领导与和解


    圣诞节前，费瑟斯顿公园收到了一名为维克斯中校（`Lieutenant Colonel Vickers`）的绝佳礼物。新营长曾在 1916 年在法国作为一名受伤的英国军官成为战俘，立即赢得了费瑟斯顿数千战俘的信任和尊重。他对士兵们说：“在第一次世界大战期间，我曾是战俘，并像绅士一样被对待。因此，我将同样地对待你们。”


    次年，维克斯加入了赫尔伯特·苏尔茨巴赫（`Herbert Sulzbach`），这位来自德国的难民在英军中拥有上尉军衔，成为英德和解的中流柱。对纳粹复活的恐惧是毫无根据的。在赫尔伯特·苏尔茨巴赫（英军授予上尉军衔）的监督下，第
    18 号营的“和解”实验取得了巨大的成功。苏尔茨巴赫后来成为 1949 年成立的德意志联邦共和国（`Federal Republic of West Germany`）发展的领军人物，讽刺的是，许多从第
    18 号营“毕业”的学生也是如此。


    他也是费瑟斯顿公园战俘中的一位领军人物，而他对将人员分为不同小组的筛选小组的强烈反感，令`恩格尔伯特`印象最深。“他不认为这符合《日内瓦公约》（`Geneva
    Convention`），`恩格尔伯特`说，“这为谎言、歧视和不信任开启了大门。”


    在`恩格尔伯特`的书中，他们被称为“人性的骑士”，苏尔茨巴赫和维克斯成功地建立了管乐团、图书馆、学习小组，甚至有一所大学。他们在 1946 年开放了营区，拆除了大卷铁丝网，推倒了高大的哨塔。取而代之的是一道作为“防止羊牛进入”的象征性围栏。


    此后，营里的状况日益改善。两个剧院工作坊已经成立，从学生时代起对戏剧感兴趣的`恩格尔伯特`加入了泰因剧院（`Theater am Tyne` / `Theatre
    on Tyne`）的阵容并进行了多次演出。剧院有专业的制片人和一两个专业演员，但最大的转折出现在决定女主角时！“在这个过程中我们充满了乐趣，尽管我们非常清楚自己要传承老维多剧院（`Old
    Vic`）的传统，”`恩格尔伯特`说，“我们的表演非常成功，我们巡演了从纽卡斯尔到卡莱莱的等地，去了许多营地，也为英国观众表演过。”


