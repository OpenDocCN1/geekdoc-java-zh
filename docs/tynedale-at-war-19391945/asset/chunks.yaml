  trans: '


    作为一名青少年，前辛德霍普农场的西里尔·福赛斯（Cyril Forsyth）结识了一位意大利战俘阿尔伯托·卡特纳（Alberto Catena）。阿尔伯托和其他十多名意大利战俘在他父亲亚历克（Alec）的海阿顿（High
    Acton）农场从事排水工作。阿尔伯托是唯一一个与这个家人聊天并和他们一起喝酒的人。在离开之前，阿尔伯托送给了青少年西里尔一个手工制的烟盒，上面刻有他的名字和阿尔伯托的名字，日期为
    1944 年 6 月 5 日、“卡顿（Catton）”、还有几枝冬青、一盏老式灯笼和一只猫。西里尔回忆道：“他从未提过自己是如何被俘的或任何事情。我觉得他做的事情非常棒。他一定有一把小别针和锤子。我想他可能把它送给我是因为我的家人对他表现出的善意，而且对他来说也是一种消遣之物。”


    西里尔记得曾在村子里见过那些战俘，在 17 岁时，他甚至在卡顿的斯通石农场（Stone Hall Farm）工作过，那里是战俘营的所在地。尽管他不记得意大利战俘出过什么问题（他们并没有受到时刻看守），但他对那些被守卫得严密的德国人感到恐惧。他说：“我大约
    17 岁时在卡顿耕地，一看到德国人的眼睛就没法直视地干活。他们被持枪的哨兵包围着工作，”他补充道，“意大利人不想参加战争。他们从不谈论家乡。处在一个陌生的国家生活一定非常困难。”


    卡顿的意大利战俘也留下了印记，他们在艾伦班克斯（Allen Banks）林地的山毛树上刻了自己的战俘身份证，比恩斯（Byrness）667 战俘卫星营的囚犯也做了类似的事情。


    在威尔姆（Wylam）发生了一件趣事，德国战俘在当地农场工作时，总部设在尼森小屋（Nissen huts）中。其中有一名木匠和一名石匠，他们决定为在小屋周围布置的那些整齐划一的园卉花园增添一些特别的装饰。在短短八天内，他们在花园里建造了一座微型城堡，拥有四座塔楼、电力照明，以及他们自己制作的精美挂毯和地毯。


    这座高三英尺的作是利用战友们从泰河（Tyne）河床抬起的石头制成的，屋顶是用从营厨房回收的罐头制成的。囚犯们还制作了家具、刺绣了挂毯，并为宏大的宴会厅织了地毯。电力从尼森小屋引入，一个精制的自制设备让前门能够电子化地开启。威尔姆城堡甚至还有自己的装饰性喷泉。


    正门上方一个隐蔽的面板上写着“由德国战俘建造”，旨在作为他们在威尔姆停留期间的永恒提醒。这座城堡于 1947 年完工，在接后的两年里吸引了数百名游客，但一些村民对这个战争年代的提醒物感到不悦，无论它建造得多么精巧。1949
    年 5 月的一天，一辆卡车出现在现场，城堡从地基上被抬起并运走，再也没有出现过……尽管传言依然存在，说它仍然在该地区某人的后院里占据着显眼的位置！


    ![Image](img/f0195-01.jpg)


    威尔姆城堡，战后由德国战俘建造的三英尺高建筑。


    ## 参考文献


    - `The Hexham Courant` 报纸文件 1939-46。

    - `Land Girls of Northumberland 1940-1950`，Muriel Sobo。Northern Heritage, 2003
    年 4 月 1 日。

    - `Air Crash Northumberland`，Russell Gray, Neil Anderson, Jonathan Shipley 和 Jim
    Corbett。Countryside Books, 2008。

    - `Strike Hard, Strike Sure`，Ralph Barker。Pen & Sword Military Classics, 2003。


