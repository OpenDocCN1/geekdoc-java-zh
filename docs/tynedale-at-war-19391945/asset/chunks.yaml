    # The PoW Legacy of Featherstone and Northumberland


    Barely a year after the end of the Second World War and only a week after Remembrance
    Sunday, when the town’s usual, less populous congregation paid its respects to
    loved ones who had sacrificed their lives in the defeat of Hitler, there was one
    of the most poignant occasions witnessed in the Abbey’s long history. The prisoners-of-war
    from Featherstone were brought to Hexham as their reward for helping to bring
    in the harvest on 300 farms stretching across the south of Northumberland.


    It was a unique service which attracted a huge amount of interest. Apart from
    the German prisoners, there was room for only 300 members of the public. Some
    queued for hours to guarantee themselves a seat. Many were turned away as the
    door was locked. Those locals lucky to attend sat next to some of Hitler’s most
    loyal and ardent lieutenants. The service featured some of the finest music and
    singing ever heard in the Abbey. The seventy-strong prisoners’ choir included
    pre-war members of German opera houses. Former leading members of the Berlin and
    Leipzig State Opera orchestras were in an orchestra under the direction of the
    one-time conductor of the Saarbrucken Opera Company.


    Speaking in German, the Rev. John Ramsbotham, of St George’s, Jesmond, delivered
    the sermon. He told PoWs that on their eventual return to Germany they would take
    with them the gratitude of Northumberland’s people for their work on the farms.
    ‘I know that many real friendships have been formed and hope that they may help
    to build up understanding between the two nations,’ he said.


    Two years later, inmates were informed that Featherstone Park would be closed.
    They were still about 1,800 in number, with quite a few living in hostels without
    any guards. During his last months in England, Engelbert stayed outside the camp
    with friends he had made at Lambley and Halton Lea Gate. At the end of April,
    he was told to prepare for repatriation, the departure date being 11 May. ‘I remember
    the strange feelings I had – of being happy to see my family again, but at the
    same time being overcome by a melancholy feeling of leaving all these people I
    had grown so fond of,’ he said.


    Now the only indication of `Camp 18`’s former presence is a plaque on a wall at
    the former entrance dedicated to Herbert Sulzbach.


    ## The Success of Jurgen Oestens


    Jurgen Oestens was a highly successful operator in the dark days of the war, earning
    the coveted Knight’s Cross for his exploits against the Allies, which included
    the sinking of eighteen Allied ships. He survived the war, and after his spell
    at `Camp 18` at Featherstone, he became a successful industrialist. He had fond
    memories of his enforced residence in the South Tyne, as he has revealed in a
    letter to Stocksfield’s Ian Maclean, who managed to track the old sea wolf down
    after reading an article on `Camp 18` in the Courant.


    Herr Oestens wrote: ‘German officers could work outside the camp, although they
    were not obliged to do so. As most of the prisoners had qualified civilian professions,
    we had experts on almost all technical and other fields. The camp was approached
    if anything went wrong in the area at a power station or a mine – we even could
    supply water diviners! As the relevant British experts were still busy in the
    war, the camp could do a lot of good.’


    He said that the British employers had to pay the same wages they would for British
    labour, otherwise the war-agricultural committee and the trade unions would have
    ‘played hell’. Some farmers in Northumberland were very pleased that a German
    PoW was working on their farm, he said.


    ## A Piece of Sporting History


    The PoWs also created a unique piece of sporting history at Featherstone, in the
    shape of what is believed to be the first 400m running track in the UK. Current
    owner of the castle, John Clark, was a schoolboy at the private Hillbrow School,
    based in the castle at the time, and remembers the enormous popularity of the
    track.


    He said: ‘As far as I can see, every athletics track in Britain, until around
    1965 and 1966, was in yards and not metres. But the Germans designed and built
    a 400m track out of cinder while at Featherstone, which was something different
    for the time. I can remember up in the big school room, looking out of the window
    and seeing them all on the athletics track or doing long-distance running.’


    The story behind the creation of the track is an intriguing one, with the Germans
    given permission to build it for leisure activities by the British commandant
    Lieutenant Colonel Vickers.


    Mr Clark said: ‘When the Germans came here, the commandant said he had been a
    PoW in World War One and the greatest problem was boredom. He said “I am going
    to do everything in my power to make sure you don’t get bored and have every opportunity
    to develop your skills.” So basically they developed their athletics and football,
    although they didn’t play cricket like the British officers did.’


    From there, the popularity of athletics with the young PoWs – they were generally
    aged between 18 and 24 – mushroomed and it was a permanent feature throughout.
    Mr Clark said: ‘I can remember, more than anything, hearing the sound of the pistol
    to start the races, because they had quite big events within the PoW camps. Whether
    they had competitions with other PoWs brought in, I am not sure, but it is highly
    likely.’


    ## Notable Individuals and Satellite Camps


    One person who did flourish as a result of his time at Featherstone was a young
    man named Günter Behnisch, who studied architecture at the camp for two years.
    He hit the big time as an architect following his spell in the district, designing
    the Munich Olympic Stadium.


    As well as Featherstone there were other satellite PoW camps around the district.
    Men from Germany, Italy and other Axis countries found themselves living within
    the quiet communities, working the land, doing manual labour and improving infrastructure.
    Despite living under guard in the camps, inmates were generally accepted by the
    locals.


    Some camps, like the one at Byness, even opened their doors to the public to share
    special celebrations such as Christmas. Opposite the site of the old camp – now
    the Forest Caravan Park – is a road leading up to the Otterburn Ranges, which
    was built by German PoWs.


    Located on the roadside is a large rock which is carved with the words `POW Camp
    667 1945/46`, a lasting reminder of the part played by the prisoners in the local
    area.


    In Byness, village resident Ian Scott recalls life alongside the prisoners from
    the camp, which would often be open to residents. He said: ‘It was an interesting
    time, especially for the children, as it was always a fascination. I can remember
    the camp was fenced with barbed wire and you could see a guard walking around
    with a rifle on his shoulder. They had dances and had their own band, and there
    were parties at Christmas time. The first prisoners were Italian who panicked
    when they heard the Germans were coming. They didn’t want them there, but most
    of the Italians had gone by the time the Germans arrived.’


    Derek MacDonald of Otterburn had a small wooden wheelbarrow made for him by a
    prisoner, which he had for almost seventy years. His father Tommy MacDonald drove
    for haulage company Forster’s, based in the village, and got to know the PoWs
    while transporting them from the local camp to jobs at the ranges.

