  trans: '

    与此同时，科布里奇（Corbridge）利用了已有数百年历史的安全设施为最坏的情况做准备。牧师佩尔塔（Pele Tower）建于 1318 年，墙厚达`4ft
    3in`，用于抵御入侵的苏格兰人，现被用作防空哨点（`ARP）；而更老的是在`Corstopitum`罗马遗址处出土的一座有 2000 年历史的地下宝库，被指定用作防空难所。


    到 9 月底，在`Abbey Hotel`举行会议后，赫克斯姆建立了一个医院物资仓库，延续了 25 年前为第一次世界大战建立的仓库的优良传统。会议由来自纽布鲁（Newbrough）的`Mrs
    Norman D. Newall`组织，她的姐姐、来自洛布鲁（Loughbrow）的`Mrs Clarence D. Smith`是第一个仓库的推动者。`妇女协会`（Women’s
    Institute）的各地方分支已表示愿意组成工作小组提供帮助。


    ![Image](img/f0022-01.jpg)


    赫克斯姆集团医院物资仓库的工作人员正在整理和包装寄往海外军人的生活用品。


    Smith 夫人确信这一倡议将取得巨大成功，因为人们有了时间为战斗做好准备，不像 1914 年战争开始得如此突然。她非常高兴，许多参与过最初仓库的女士士们再次挺身而出，而且往往还带着他们的孩子和其他亲属。她说：“我从没想过在
    1918 年后我还要再次站出来要求在赫克斯姆建立一个医院仓库。我觉得太棒了，上一次我们有 600 人（不包括分支仓库）共同工作，在过去的四年里没有一次发生过争执，也没有遇到过最细微的麻烦。每个人都非常乐意，我知道他们现在依然会如此。一些最初的女士士们身体已经不再像以前那样健康或强壮了，但她们带来了无价的经验。”


    物资仓库迅速发放了一本战时食谱和实用小贴士。这书标价六便士，在无数食谱中精选出来的一道是羊头汤——脑花要单独烹饪——同时还提供了关于如何烹饪荨、如何治疗疣以及如何将山榉树叶保存“一两年”的建议。


    到 9 月底，汽油已实行严格配给，当地一名零售商报告说，他平时每周 1500 加仑的燃料销量已跌至 50 加仑出。他说：“我们这些零售商正面临严峻的考验，我们中的一些会发现很难维持下去。”燃料短缺导致许多车主停运汽车并改骑自行车，导致对新旧二手自行车的需求爆发性增长，其中后者尤为难寻。


    ![Image](img/f0023-01.jpg)


    由赫克斯姆集团医院物资仓库制作的菜谱，包含了如何烹饪羊头的建议。


    到 10 月中旬，疏散者的新奇感开始消退，此时贝林哈姆（Bellingham）的卫生官指责新来者导致了当地多种传染病的传播，包括猩红、天花、脓疮和疥疮，以及虱虫感染。


    到月中旬，来自`Cowgate`地区的约四分之一的孩子已返回纽卡斯尔，这通常是违背了他们的意愿的，但因为他们的父母想让他们回到家里。大多数人在乡下期间体重增加了，学业也进展顺利。


    10 月 17 日，当东北部海岸探测到不明飞机时，该地区的防空警报器真的鸣响了。没有警报器的村庄依靠教堂钟声，而在警报解除前整整等了九十分。赫克斯姆的警卫员感到沮丧，因为繁忙的`Market
    Place`（市场广场）上的购物者几乎瞬间消失，而`Priestpopple`的人行道依然人满为患。


    《国民服役法》（`National Service Act`）的实施要求所有年龄在 20 至 22 岁的男性必须在武装部队登记，共有 216 名男子了登记——其中只有一人注明自己是良心拒绝者。


    战争开始仅六周，对于来自赫克斯姆`Round Close`的 20 岁阿尔弗雷德·格顿士兵（`Corporal Alfred Gunton`）来说就结束了。他是皇家空军（`RAF`）的一名无线电员，在
    1939 年 10 月 15 日在执行德国上空任务时未能回来。他的父母焦虑地等待了近三周，才听到他被俘并作为战俘扣留。自从在赫克斯姆伊丽莎白女王文法学校（`Hexham
    Queen Elizabeth Grammar School`）读书起他就酷爱“航空之魂”，此前他曾两次幸运死里逃生：一次是被迫从一架在高空起火的飞机上跳伞，另一次是在战争开始仅两天后，他所在的组员的飞机因燃料耗尽而被迫在法国紧急迫陆。


    `格顿士兵`是医院物资仓库提供的生活包裹的首批接收者之一，并被允许通过德国短波电台向英国广播。在从战俘营写给父母的一封信中，他揭露了自己的飞机被防空火炮击落，并说：“我们不得不跳伞逃生。飞行员被弹片炸死，再没有离开过飞机，但其他人都没有受伤。我们在这里对待得很好。最近下了两英寸厚的雪，但我被给了很多保暖衣服。”


    ![Image](img/f0024-01.jpg)


    在战争第二个月被俘后，皇家空军的阿尔弗雷德·罗纳德·格顿军士（`Warrant Officer Alfred Ronald Gunton`）于 1944 年
    9 月被遣返回他在赫克斯姆的家，此前他在战俘营被关了近五年。


    在战俘营关押了近五年后，`格顿士兵`在写给父母的一封未审查信中用铅笔写道：“我需要一些巧克力、饼干、罐装牛肉和一罐水果，如果可以的话，请寄一些黄油。战后见！”


    货轮`Cairmona`从蒙特利尔出发前往英国时，船上有两只黑猫，但它们并没有带来好运，因为该船在苏格兰东北海岸被鱼雷命中后十五分钟内就沉没了。幸存者中包括赫克斯姆的
    C.D.博伊学员（`Cadet C.D. Boyd`），他在第 36 次跨越大西洋时失去了所有财产。桑德兰号`SS Cairmona`属于`Cairn Line`公司，赫克斯姆公宅（`Dukes
    House`）的 T.鲁塞尔少校（`Major T. Russell`）担任董事会主席。

