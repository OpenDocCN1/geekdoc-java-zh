    The Recce Corps, as it was fondly known, was made up largely of territorials who
    had served with the Royal Northumberland Fusiliers. It was regarded as ‘the eyes
    of the army’ and seen as a successor to the Scouts who had served with such distinction
    in the Boer War and the cavalry of the last war. The Recce Corps was classed as
    a cavalry squadron, mounted in `Bren` carriers, armoured cars or trucks. The men
    were expected to be able to drive any vehicles, as well as being able to repair
    them. Their job was to find out what lay ahead for other troops, and to report
    back on the situation. It was said that men-country born and bred, who had an
    eye for the countryside and knew woodcraft, would be admirably suited for the
    work.


    ![Image](Images/f0121-01.jpg)


    Recce Regiment Royal Northumberland Fusiliers from Hexham held in Italian prison
    camps in Italy in September 1942 were from left: Fusilier T.H. Whitfield, Lance
    Corporal George Clark, Company Sergeant Major Leslie Dodds and Corporal R. Brotherton.


    While local men continued to fall in the Middle East, there was tragedy on the
    Home Front, when former serviceman and member of the Hexham Home Guard Benjamin
    Gunton heard a terrific explosion as he came into the garden of his home in Round
    Close in the town, and found his 18-year-old son Desmond had accidentally blown
    himself up with a hand grenade.


    Mr Gunton told the inquest that the teenager had been given four grenades by a
    soldier as a souvenir and kept them in a hut at the bottom of the garden. He was
    in the habit of taking them to pieces and reassembling them. He accepted he should
    have confiscated them from the boy, but never got round to it.


    Tynedale’s first British Restaurant was established in the Wesley Hall in Prudhoe,
    which was converted at the cost of `£600` to provide cheap and nourishing meals
    for 100 people at a time. It was open from 11-45am to 2-15pm Monday to Saturday,
    and offered a four course meal comprising soup at `2d`, meat and vegetables `7d`
    (`4d` for children), `2d` for pudding and `1d` for a cup of tea.


    ![Image](Images/f0122-01.jpg)


    Reported to be held in an Italian PoW camp was Lance Corporal William Foster (left)
    of Corbridge, while Petty Officer Fred Barrable of Hexham, (second from right)
    was interned in Algeria following the sinking of his ship `HMS Manchester`, in
    the Mediterranean. However, Pilot Officer Sidney Melvin (second left) of Haydon
    Bridge and his RAF colleague, Sergeant John Ridley Elliott (right) of Corbridge
    were both missing in action.


    British Restaurants were communal kitchens created in `1940` to help people who
    had been bombed out of their homes, had run out of ration coupons or otherwise
    needed help. There was a political dimension as well, as the Labour Party saw
    them as a permanent solution to equalising consumption across the class line and
    guarantee a nourishing diet to the poor.


    Originally called ‘Community Feeding Centres’, the name British Restaurants was
    coined by the Prime Minister, Winston Churchill. They were set up by the Ministry
    of Food and run by local government or voluntary agencies on a non-profit basis.


    ### Matters of conscience


    A veteran of the First World War, Robert WIlliam Marriner of Prudhoe, was jailed
    for two months with hard labour by Hexham Magistrates for failing to comply with
    an order from a National Service Officer to take up work of national importance.
    Marriner told that court that if he had taken up the job he was directed to it
    would have cost him `20s` to `30s` per week in lost wages from his present job.
    He said: ‘I fought in the last war for sixpence a day and was promised I would
    come back to something better – now I come back to treatment like this.’


    At the same court 25-year-old Kathleen Margo Jupp, of Haydon Bridge, read her
    bible in the dock when she was charged with failing to attend an interview to
    carry out work of national importance. Giving her job as a full time Jehovah’s
    Witness, she said when asked what her plea was: ‘Technically I am guilty; morally,
    I am not guilty.’ She had earlier asked to be registered as a conscientious objector,
    but was told this was not possible under the provisions of the `Registration of
    Employment Order`. The court was told that Miss Jupp had some ‘peculiar religious
    belief’ which made it difficult for her to take up the work to which she was directed,
    even when it had nothing to do with the war.


    National Service Officer Charles Welburn told the court that because of her beliefs,
    Miss Jupp had not been directed towards munitions work or anything directly related
    to the war, and had been asked to go to work at the children’s sanitorium at Hexham,
    but had refused to attend an interview with the matron. When asked by the chairman
    of the bench John Charlton whether she was not a British subject who came under
    the law in England, she said: ‘I am under the law of God first.’


    The court heard she had been a member of the Women’s Land Army but had resigned
    ‘when she came under the influence of the Jehovah’s Witness movement.’ After a
    two-week adjournment, she was fined `£20`.


    Addressing Hexham Rotary Club later, chairman of the Northumberland and Durham
    Conscientious Objectors Tribunal, Judge T. Richardson, said that in his opinion,
    all conscientious objectors who refused to do anything for the war effort should
    be cold shouldered once hostilities were over. The same applied to companies which
    employed ‘conshies’, often promoting them in their jobs while other employees
    were laying down their lives for their country. The judge said in recent times
    more and more young women were claiming to be conscientious objectors and he found
    them ‘more poisonous’ than the men.


    He said: ‘The great proportion are not genuine COs at all, but are nothing less
    than shirkers. There are also those who use so-called religious societies as a
    cloak to get out of doing anything for their country. In the main, these religious
    societies are composed of very ignorant, but dangerous people, who go round getting
    a hold of.’ A 19-year-old soldier, Sergeant Hugh Weir drowned in the Tyne at Haydon
    Bridge when an army exercise went badly wrong. Weir was asked to wade across the
    river carrying a wire rope, which was to be secured on the far bank, to allow
    other soldiers to cross. However the river started to rise quickly and the order
    was given to abandon the exercise. Sadly, the change of plan was not relayed to
    Weir who, dressed in his trousers and gym vest, waded into the swollen river with
    one end of the wire attached to his belt, and the other to a drum. He only got
    four yards into the river when he was swept away by the current. The other end
    of the wire unravelled from the drum and noone was able to grab the end of it.


    Weir’s body was recovered 50 yards down river, and the coroner found it ‘unfortunate’
    that the cancellation message had not got through.


    ## CHAPTER FIVE


    ## The Rocky Road to Normandy


    A 15-year-old girl from Stocksfield was sent to an approved school by Hexham Juvenile
    Court, which was staggered by her ‘scandalous’ behaviour in what was described
    as a very sordid case. Described as being out of control by her father, she was
    sent to a diocesan retreat in Newcastle but escaped by climbing out of a top floor
    window and shinning down a drainpipe onto the roof of an air raid shelter.


    She turned up at a Newcastle hotel in the company of a sailor, claiming she was
    his wife, but when the ‘husband’ returned to his ship, she took up with another
    resident at the same hotel, telling the affronted manageress that her husband
    did not mind her associating with other men in a friendly manner. She declined
    to pay her hotel bill of `45s`, but the bill was settled by the other man with
    whom she was now sharing a room.

