    # 费瑟斯通与诺森伯郡的战俘传奇


    在第二次世界大战结束短短一年后，在纪念星期日仅一周后，当镇上常年人数较少的信众向那些在击败希特勒中牺牲生命的亲人致敬时，见证了修道院长历史上最令人感动的时刻之一。来自费瑟斯通的战俘被带到了赫克斯姆，这是对他们帮助诺森伯郡南部
    300 个农场收割的报答。


    这是一场吸引了巨大关注的独特仪式。除了德国战俘，公众空间只能容纳 300 人。为了确保能有座位，有些人排队了几个小时。许多人因为门锁了而被拒之门外。幸运参加的当地人坐在希特勒一些最忠诚、最狂热的下属旁边。仪式上表演了修道院历史上听过的最美的音乐和歌声。由
    70 人组成的战俘合唱团包括德国歌剧院战前的成员。柏林和莱比锡国立歌剧院乐团的前任首席成员在曾在萨尔布鲁肯歌剧院指挥的指挥下，组成了一支乐团。


    来自杰斯蒙德圣乔治教堂的约翰·拉姆斯索姆（John Ramsbotham）牧师用德语演讲。他告诉战俘们，当他们回到德国时，将带着诺森伯郡人民对他们在农场工作的感激。“我知道已经建立了许多真正的友谊，希望这些友谊有助于建立两国之间的理解，”他说。


    两年后，囚犯们被通知费瑟斯通公园将关闭。他们人数仍有 1800 人左右，相当多住在没有任何守卫的旅舍里。在英国的最后几个月里，恩格伯特（Engelbert）与他在兰姆利（Lambley）和哈尔顿门（Halton
    Lea）结的朋友住在营地外。4 月底，他被要求准备遣返，日期定在 5 月 11 日。“我记得当时那种奇怪的感觉——既为再次见到家人感到高兴，又被离开这些我如此喜爱的人的忧郁情绪所淹没，”他说。


    现在，`Camp 18` 曾经存在的唯一迹象是旧入口处墙上的一块纪念赫伯特·苏尔茨巴赫（Herbert Sulzbach）的纪念牌。


    ## 尤尔根·奥滕斯滕的成功


    尤尔根·奥滕斯滕（Jurgen Oestens）在战争的黑暗日子里是一个非常成功的经营者，他因对抗盟军的战绩获得了寐以求的骑士十字勋，其中包括击没 18 艘盟军船只。他活了下来，在费瑟斯通的`Camp
    18`度过之后，他成为了一名成功的工业家。他对泰恩河南部的强制留守有着美好的回忆，正如他在给斯托克斯菲尔德（Stocksfield）的安·麦克林（Ian Maclean）信中所透露的那样，后者在《库兰报》上读到关于`Camp
    18`的文章后找到了这位老海狼。


    奥滕斯滕先生写道：“德国士兵可以在营地外工作，尽管他们没有义务这样做。由于大多数战俘都有合格的民用职业，我们拥有几乎所有技术和其他领域的专家。如果该地区的发电站或矿井出现任何问题，人们就会找营地——我们甚至能提供寻水师！由于相关的英国专家仍忙于战争，营地可以提供很多帮助。”


    他说，英国雇主必须支付与英国劳动力相同的工资，否则战争农业委员会和工会将会“闹得不可开交”。他说诺森伯郡的一些农场主对德国战俘在他们的农场工作感到非常高兴。


    ## 一段体育史


    战俘们在费瑟斯通还创造了一段独特的体育史，其形式被认为是英国第一条 400 米田径跑道。城堡现的所有者约翰·克拉克（John Clark）当时是位于城堡的私立希尔布罗高学校（Hillbrow
    School）的学生（当时学校就设在城堡里），他记得那条跑道曾极受欢迎。


    他说：“据我所知，直到 1965 年和 1966 年左右，英国所有的田径跑道都是以码为单位而不是米。但德国人在费瑟斯通期间设计并用碎渣铺设了一条 400 米的跑道，这在当时是非常与寻常的。我记得那时在大教室里，向窗外望去，看到他们都在田径跑道上或在进行长跑。”


    跑道形成的背后的故事非常引人注目，英国指挥官维克斯斯中校（Lieutenant Colonel Vickers）准许德国人为了休闲活动建造了它。


    克拉克先生说：“当德国人来到这里时，指挥官他说他在第一次世界大战中战俘，最大的问题就是无聊。他说‘我将尽全力确保你们不感到无聊，并有一切机会发展技能。’所以基本上他们发展了田径和足球，尽管他们不像英国士兵那样打板球。”


    从那时，田径在年轻战俘（他们年龄通常在 18 到 24 岁之间）中的人气急剧增长，并成为了一项常态活动。克拉克先生说：“我记得最深的是听听到比赛开始的枪声，因为他们在战俘营内举办过相当大的活动。我不确定他们是否与其他运进来的战俘进行过比赛，但很有可能。”


    ## 著名人物与卫星营地


    有一个因为在费瑟斯通的经历而大放异彩的人，名叫君特·贝尼施（Günter Behnisch）的年轻人，他在营地里学习了两年建筑。在在该地区待一段时间后，他作为一名建筑师声名在外，设计了慕尼黑奥运体育场。


    除了费瑟斯通，该地区还有其他卫星战俘营。来自德国、意大利和其他轴心国的士兵生活在宁静的社区中，从事耕作、体力劳动和基础设施建设。尽管在营地里受监管生活，囚犯通常被当地人接受。


    一些营地，如比内斯（Byness）的营地，甚至向公众开放分享圣诞节等节日。旧营地所在地（现在是森林汽车公园）对面有一条通往奥特伯恩靶场（Otterburn
    Ranges）的路，那是德国战俘建造的。


    路边有一块大石头，上面刻着`POW Camp 667 1945/46`字样，提醒着人们战俘在当地所起的作用。


    在比内斯，村民伊·斯科特（Ian Scott）回忆了与战俘共处的生活，营地经常向居民开放。他说：“那是段有趣的时光，对孩子们来说尤其是，因为一直吸引他们。我记得营地周围围着铁丝网，你可以看到守卫扛着步枪巡逻。他们举办舞会，还有自己的乐队，在圣诞节期间会有派对。第一批战俘是意大利人，当他们听到德国人要来时惊慌失措。我们并不想要他们在这里，但等德国人到达时，大多数意大利人已经离开了。”


