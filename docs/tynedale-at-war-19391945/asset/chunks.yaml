    克拉克下士（Lance Corporal Clark）是来自泰恩代尔（Tynedale）地区的 23 名签署人之一，他们写了一封来自意大利营地的信，赞扬了赫克斯姆为战俘提供服务的各种组织。信中写道：“我们对所做的一切深表感激。我们都健康健康，期待早日回到‘英格兰的心脏’。我们经常希望看到《赫克斯姆纪报》（Hexham
    Courant）。”


    同样来自赫克斯姆的莱纳德·沃德军士（Corporal Leonard Ward）从意大利转运后，在营地 `Stalag IVB` 写信称，德国的食物和待遇远好于意大利。


    ![Image](img/f0142-02.jpg)


    海德登桥（Haydon Bridge）的杰西·沃奇（Jessie Waugh）姐姐在登陆西西里岛的 21 名英国护士中是一位广受欢迎的人物。她不仅提供护理服务，还通过音乐会娱乐士兵，她的才华使她赢得了加入娱乐国家服务协会（广为人知的
    `ENSA`）的邀请。


    ![Image](img/f0143-01.jpg)


    赫克斯姆的 E·霍林格顿军士（Corporal E. Horlington，左侧）和海德登桥的 F.H·沃德士兵（Private F.H. Ward，右侧）与来自富勒姆的华纳·史密斯军士长（Regimental
    Sergeant Major Warner Smith）在一起，通过划船暂时远离中东战场的战斗。


    回到国内后，一名 21 岁的妇女土地军成员在赫克斯姆郡斯尔魔鬼水（Devil’s Water）的一处深潭中被发现溺亡，令人悲痛。这个来自索普顿（Thropton）地区的女孩曾在斯莱利（Slaley）工作，当时她去骑自行车后再也没有回来。她留了一封给母亲的信，说：“我厌倦了生活——每个人都反对我。他们恨我，我无法继续下去了；也许我去的地方会很快乐。”验验官判定结论为自杀。


    ## 赫克斯姆站的弹药爆炸


    赫克斯姆在第二次世界大战期间落在泰恩河、蒂斯河和威尔士河工业区的纳粹炸弹中相对幸免，但是英国弹药造成了该镇国内唯一的人员死亡。


    三名士兵在赫克斯姆火车站卸载火车上的弹药时在爆炸中丧生。没有人真正知道 1943 年 9 月 9 日那个决定性日子发生的完整经过，但存在非凡的英雄主义范例，与海外发生的任何事情一样值得承认。已知情况是，有一箱弹药掉落并爆炸，导致两名
    19 岁的苏格兰皇家掷弹兵（Royal Scots Fusilier）军官和一名 24 岁的陆军运输勤兵司机死亡。


    来自菲夫郡莱文的约翰·米德尔马斯中尉（Lieutenant John Middlemass）和来自彼得伯勒的斯坦利·道道斯（Stanley Dowse）司机当场死亡。来自皮布尔斯（Peebles）的帕特里克·威尔逊中尉（Lieutenant
    Patrick Wilson）稍后在赫克斯姆医院离世。另一名被卷入爆炸波的士兵受伤，而一名站在附近家外的平民——达格利什夫人（Mrs Daglish）被爆炸弹药的碎片击中。


    所有轨道交通被中断，由于担心进一步爆炸的巨大危险，附近的所有房屋都被疏散。通勤者在路线更远处下车后乘巴士回到家中，已迟晚了几个小时。火势加剧了危险，军人员在国家消防队和警察的协助下，共同对抗舔舐弹药箱的火焰。


    五名士兵冒着巨大的危险，解开了其中一节满载的货厢，并将其拖到安全地带。拆弹小组工作了一整晚，清理车站区域的未爆炸弹药，其中包括各种类型的步兵武器，包括手榴弹。


    调车工罗伯特·亨利·汤普森（Robert Henry Thompson，50 岁）和他的两位同事——机车罗伯特·诺里斯（Robert Norris）和司炉工爱德华·利德尔（Edward
    Liddle）也发挥了作用。汤普森试图从装卸货平台撤出装载的弹药车厢。他拦截了一台牵引机，回到四辆弹药车厢旁将它们连接起来以便拖走。此时，一些车厢已经起火，汤普森不得不用他的调车杆将一节车厢顶部的易燃物推开。


    在车厢被充分隔离后，汤普森将它们与牵引机分离并撤离。在随后的死因调查会上，一名证人说他曾看到一个放在卡车背上的箱子掉到了地上。司机似乎在鹅卵石路上滑倒了。箱子只掉了两三英尺，但立即爆炸了。几分钟后，军卡后部发生第二次爆炸，随后引发火灾。弹药和磷散落在四周，在整个过程中，由于火势猛，铁路车厢和军卡都发生了轻微爆炸。


    然而，爆炸的原因仍然是一个谜团，因为专家在调查会上告诉他们，弹药不应该仅仅因为箱子掉落而爆炸。苏格兰皇家掷弹兵的军士长托马斯·基比（Thomas Kirby）表示，弹药装在密封箱内，手榴弹没有插引信。在被问及爆炸理论时，基比军士长告诉调查会：“我完全无法解释。”在受到追问时，他只能假设弹药的某种成分有问题，或者存在缺陷。


    调车工汤普森的勇敢使他获得了大英帝国勋，而诺里斯和利德尔也受到了高度表扬。他们的行动被北方司令部指挥官视为“最高等级”，该指挥官代表陆军感谢了他们。


    对于参与解开车厢的士兵的英勇也得到了正式认可。几枚“表彰赫克斯姆弹药爆炸中英勇”的大英帝国勋章颁给了掷弹兵威廉·查塞尔斯（William Chassels）和掷弹兵安德鲁·麦克莱尔（Andrew
    McMichael），而表扬信颁给了下士 W·辛明灵顿（W. Symington）、下士吉米·桑德森（Jimmy Saunderson）和掷弹兵 J·蒙特哥马里（J.
    Montgomery）。


    不幸的是，这两位获得勋章的掷弹兵都没有活过战争。威廉·查塞尔斯于 1944 年 7 月 16 日在诺曼迪去世。他 21 岁，来自拉纳克郡的汉密顿。


    安德鲁·麦克莱尔于 1945 年 3 月 24 日在跨越莱茵河期间去世。他 37 岁，来自艾尔郡郡的梅博尔。


    来自艾尔郡郡的下士吉·桑德森活过了战争，但几年后在纽卡斯尔地区尝试过河时与另外两人一同溺水。


    赫克斯姆法庭审理的罕常案件之一发生在 10 月，当时康姆煤炭公司（Acomb Coal Company）因 47 名矿工未到工违反合同而对其起诉。起诉对象是年龄在
    19 至 66 岁的矿工，他们来自西威廉姆、普鲁德霍、米克利和分支端地区，乘坐专门安排的巴士往返康姆矿场工作。


    然而，在 8 月 11 日，换了一辆新巴士，运营商要求后班的 22 名男子在煤堆场（距离矿场 200 码）下车，因为他不想让通往矿场路上的树枝划伤他的新车。男们拒绝下车，在僵持后，他们表示不准备在这种情况下工作并回了家。


    从地下上来的 25 名夜班工在听到发生的事情后停工表示同情。公司向每人索要 1 英镑赔偿，但在与诺森伯郡矿工协会协商后撤回了诉讼，协商达成的方案是每人需支付
    10 先令，每周从工资中扣除 2 英镑 6 先令。


    赫克斯姆在一项帮助泰恩地区疲劳女工的计划中做出了贡献，在西区（West Quarter）建立了一个休息中心，为 40 名女性提供住宿。该中心由劳工和国家服务部联合副国务官乔治·汤姆森（George
    Tomlinson）揭幕。

