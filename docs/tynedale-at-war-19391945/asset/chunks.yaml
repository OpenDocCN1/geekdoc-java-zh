    YOUR TOWNS & CITIES IN WORLD WAR TWO

    TYNEDALE

    AT WAR 1939-45


    This book is dedicated to all the men and women of Tynedale who stood together
    against the might of Hitler’s war machine, whether as members of the armed forces,
    serving with the Women’s Land Army, Home Guard or Civil Defence Corps, or simply
    by opening their homes to the thousands of evacuees who poured into the district.
    You all did your bit.


