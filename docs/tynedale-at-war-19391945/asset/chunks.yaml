    # Camp 18 and Featherstone Park


    Camp 18 was, with Camp 186 in South Wales, the largest officers’ camp in Britain.
    Its population rose, at times, to 4,000 or more officer PoWs and up to 600 German
    orderlies. Around 200 huts in four compounds (`A` to `D`) were needed to house
    this sizeable population. Apart from the accommodation blocks, there was a theatre,
    library, chapel, medical centre, bakery and a rudimentary sewerage system.


    The camp had its own newspaper – `Die Zeit am Tyne` – which had seventeen editions,
    all printed at the `Hexham Courant` offices and distributed throughout Britain.
    The last one came off the press in March 1948 as the process of sending home prisoners
    got under way.


    ![Image](Images/f0187-01.jpg)


    Bringing a taste of Germany to Tynedale was `Zeit Am Tyne` the newspaper of the
    Prisoner of War camp at Featherstone in the South Tyne Valley.


    The camp ran university courses, led by academics from neighbouring Newcastle
    and Durham universities, and even hosted a few special visits by Oxford dons.


    For the German orderlies, there were vocational courses to prepare them for repatriation
    and a new career when they returned home. The camp housed some of the most talented
    German musicians and artists of their generation. It had three different orchestras
    and even a puppet theatre, all of which entertained audiences across the North
    of England. The cultural reputation of the camp was such that famous violinist
    `Yehudi Menuhin` is known to have dropped in at Featherstone some time between
    1946 and 1948. Just why he took time out from his major tours during those years
    of America and Europe and engagements with the `Berlin Philharmonic Orchestra`,
    to come to Haltwhistle remains a mystery.


    ## Experiences of Engelbert Hoppe


    In his book, `Channel Islands Occupation Review`, `Engelbert Hoppe` from `Eschweiler`,
    near Aachen, describes what it was like to be taken prisoner in Jersey and shipped
    off to England on the long journey to Haltwhistle. After a smooth voyage, the
    Channel Islands prisoners landed at Southampton and were marched from the harbour
    to a railway station. On their way, they passed Polish refugees, who shouted abuse
    at the German soldiers and even threw stones at them. ‘Who could blame them after
    all their terrible experiences and suffering?’ asked `Engelbert`. ‘However, I
    do remember how the British guards put a stop to it and protected their prisoners,
    which made quite an impression on us.’


    `Engelbert` did not forget how he felt when he saw the Vlasov army people, who
    had changed sides to fight with the Germans against Stalin, being shouted at by
    a Russian political officer. ‘Looking at their faces, full of fear, anxiety and
    and terror, it seems to me now that they were aware of what was coming – being
    shipped from Hull to Vladivostok or some other Siberian harbour to be tortured
    and executed, or left to starve in a gulag.’


    After three weeks of seeing nobody but the guards, `Engelbert` and his compatriots
    were marched to another railway station which would take the men to Northumberland.
    They arrived at Haltwhistle and were taken along the River South Tyne, over a
    bridge and through what `Engelbert` describes as idyllic remote landscape surrounded
    by rolling hills with grazing cows and sheep.


    ## Life inside the Camp


    With high barbed wire fences and thick rolls of wire around the fences on the
    ground, the huge camp had four compounds to cater for the prisoners. After a harsh
    roll-call, `Engelbert` and the other officers were taken to their different compounds
    and to the `Nissen huts`, each of which housed up to 100 PoWs. The following morning
    they were shown films about concentration camps in Germany and in the Eastern
    European countries that had been occupied. This went on for more than a week.
    ‘It was so cruel and shocking that hardly anyone would believe it,’ he said. ‘Some
    of us collapsed, while others shouted “will you stop your bloody Hollywood fakes?”’
    But discussion in the hut began: “If this is true what will happen to us?”’


    During the first few weeks, the men had little food and were faced with a strict
    regime, but `Engelbert` knew that lying idle in the huts would not do any good.
    Small study groups had already begun, and via the `Red Cross`, a maturity course
    was founded for young prisoners who had been given the so-called ‘war maturity’
    of being drafted into the army instead of taking exams. `Engelbert` joined one
    of these courses, which had a curriculum standard equal to the final year of a
    German grammar school. ‘We were told the course would last one year,’ he said.
    ‘We started with almost no books, scribbling notes on toilet paper.’


    Other officers who wanted to work were allowed to work as farmhands, gardeners
    and builders.


    In the autumn of 1945, `Engelbert` recalls a new batch of prisoners being brought
    to `Camp 18`. For no reason, their belongings were confiscated and they were beaten
    by the guards, who were Poles of the `Anders Army`. There were letters of outrage
    in the `Hexham Courant` and, after a few days, a commission of British officers
    and `Red Cross` representatives appeared. The cases were brought to court, the
    offenders punished and the prisoners’ belongings restored. `Engelbert` said: ‘This
    incident, and the correctness with which it was dealt, made such a great impression
    even among the few Nazis or militarists among us that they spoke of it with the
    highest respect.’


    ## Leadership and Reconciliation


    Before Christmas, Featherstone Park got a wonderful gift in the shape of `Lieutenant
    Colonel Vickers`. The new commandant had been a PoW as a wounded British officer
    in France in 1916 and immediately earned the trust and respect of thousands of
    prisoners at Featherstone. He said to the men: ‘In the First World War, I was
    in a German prisoner-of-war camp and was treated like a gentleman. I will therefore
    treat you in the same way.’


    The following year Vickers was joined by `Herbert Sulzbach`, a Jewish refugee
    from Germany, given the rank of captain in the British Army, who went on to be
    a mainstay of reconciliation between Britain and Germany. Fears of a Nazi revival
    were unfounded. Under the watchful eye of `Herbert Sulzbach`, a Jewish refugee
    given the rank of captain by the British Army, the ‘reconciliation’ experiment
    at `Camp 18` was a spectacular success. `Sulzbach` went on to become a leading
    figure in the development of the `Federal Republic of West Germany`, founded in
    1949, as, ironically, did many of his star students, ‘graduated’ from `Camp 18`.


    He too was a leading light among the Featherstone Park prisoners, and it was his
    strong dislike of the screening teams, who came to categorise the men into different
    groups, that struck `Engelbert` the most. ‘He did not believe this was in accordance
    with the `Geneva Convention`,’ said `Engelbert`. ‘It opened the doors for packs
    of lies, for discrimination and for mistrust.’


    Referred to in `Engelbert`’s book as ‘the knights of humanity’, `Sulzbach` and
    `Vickers` managed to set up an orchestra, library, study group and even a university.
    They opened up the compounds in 1946, removed the large rolls of barbed wire and
    sent the huge watch towers crashing down. Instead a token wire was erected as
    a fence ‘to keep the sheep and cows out’.


    Thereafter things at the camp increasingly improved. Two theatre workshops had
    been founded and `Engelbert`, who had been interested in theatre since his schooldays,
    joined the cast of the `Theater am Tyne` (`Theatre on Tyne`) for a number of performances.
    The theatre had professional producers and one or two professional actors, but
    the big crunch came when the female parts were decided! ‘There was a lot of fun
    in the game, although we were very much aware of living up to the `Old Vic` tradition,’
    `Engelbert` said. ‘Our performances were so successful that we went on tour to
    various places from Newcastle to Carlisle, to many camps, but also to English
    audiences.’

