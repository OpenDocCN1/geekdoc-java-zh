    空射手飞行军士乔治·米尔伯（George Milburn，25 岁）是奥伦德尔（Allendale）人，居住在分支端（Branch End）。他因在敌空上冷静表现被授予卓越飞行勋。在气球防空部队服役两年半后转为机组人员，他参加了
    40 多次任务飞行。表彰指出，在一次进攻汉诺威的任务中，他的飞机被搜照灯光束困住了 8 分钟，当时正遭受德国战斗机的攻击。尽管被搜照灯晃得眼睛疼，米尔伯冷静的指挥和精准的射击使他的飞行员采取了必要的规避动作。


    来自科布里奇（Corbridge）的担架兵士兵内斯特·赫尔斯（Ernest Hulse）也因在意大利的一场战斗中在猛烈的炮火和迫弹袭击下营救伤员表现出卓越英勇而被授予了军勋。


    ## 1944


    1944 年的开端异常惨淡，两起重大悲剧接踵而至，给整个地区带来了巨大的痛苦。1 月 22 日的《快报》（Courant）不仅报道了泰恩代尔号军舰（HMS
    Tynedale）的沉没，还报道了广受欢迎的赫克斯姆伊丽莎白女王文法学校教师、泰恩代尔橄榄球之星 K.W.D. 霍森森（K.W.D. Hodgson）在参加国民卫队（Home
    Guard）演习时不幸身亡。


    ![Image](img/f0151-01.jpg)


    泰恩代尔橄榄球俱乐部明星、赫克斯姆伊丽莎白女王文法学校历史老师 K.W.D. 霍森森少校，在参加国民卫队训练演习时遭遇爆炸后不幸去世。


    霍森森少校是赫克斯姆国民卫队总部连的指挥官。1944 年 1 月 16 日，他负责主持一次国民卫队武器的演习和演示。训练在连队的武器训练学校进行，在那里，进行了多次使用“布莱克尔炸弹”（Blacker
    Bombards，又称插塞式火箭弹，一种反坦克装置）、炸弹和其他爆炸装置的练习。当霍森森少校在军士长乔治·道格拉斯（George Douglas）的协助下布设地雷向士兵们演示其作用时，课程结束。


    道格拉斯在和平时期是一名铁路信号员，他在随后的质询中告诉，他曾帮助少校安置地雷，地雷被埋在地下，并连有电线以便通过遥控爆炸。随后他们离开地雷约 20 码，躲在一个土堤后，该土堤比地雷所在的平面低约
    15 英尺。这种地雷是在地面上爆炸，然后发射出一个弹体使其在空中爆炸。


    道格拉斯说：“我们都躲了起来，然后我听到一声爆炸声，紧接着是第二声，我知道地雷爆炸了。我一直用双臂护住头部，在第二次爆炸后，我问霍森森少校他是否无事。我没有收到回答。”


    道格拉斯走过去发现他脸朝下躺在土堤上，当把他翻转过来时，显然他伤得很重。他的额头鼻梁上方有一个穿刺伤，且处于半昏迷状态。


    国民卫队的其他成员对他进行了急救，随后他被送往赫克斯姆医院，后又转到纽卡斯尔的另一家医院。霍森森少校坚持了十三天，但最终没于伤势。官方死因是颅骨复合骨折导致的脓毒性脑膜炎。


    道格拉斯告诉纽卡斯尔市法医阿尔弗雷德·阿贝尔爵士（Sir Alfred Appleby），地雷并没有按照常理爆炸。地雷本应产生伞状爆炸效果，但碎片只从两个方向落下来，而不是四周散开。


    “左右差两三英寸，造成致命伤的碎片就会避开霍森森少校了，”他说。当被问及对发生事的看法时，道格拉斯说，霍森森少校可能将第二次爆炸误认为是第一次，而且抬头得太早了。


    法庭判定为意外死亡，但这场悲剧结束了一个年仅 38 岁的非凡生命。


    他的全名是金斯利·沃尔斯沃思·大卫·霍森森（Kingsley Wallsworth David Hodgson），但他一直只以缩写相识。他是泰恩代尔历史上最出色的运动员之一，在
    1933-1936 年间，作为泰恩代尔橄榄球俱乐部一队队长带领连续四年获得声誉显赫的诺康伯郡高级杯，赢得了永恒的名声。他拥有罕见的荣誉，曾代表三个不同的郡打过橄榄球：在
    1933 年代表诺康伯郡对阵切舍尔郡，还曾代表约克郡和德姆郡打球。


    尽管他已正式退役并担任球队秘书，但在战争期间仍代表泰恩代尔参加比赛。他也是一名相当优秀的板球手，曾为泰恩代尔俱乐部打过多次精彩的得分。他在伊丽莎白女王文法学校（QEGS）担任了十三年的历史游戏老师，他在赫克斯姆修道院的追思礼是当年参加人数最多的仪式之一。


    同样在 1 月，《快报》的另一名编辑人员飞行军士哈里·安南（Harry Annan）在飞行任务中殉职。他当时正驾驶一架哈利法克斯轰炸机（Halifax bomber）进行训练演习，飞机在飞行仅两分钟后坠毁，倒朝掉落在斯凯尔顿下方费菲尔尔德疗养院附近的乌斯河中，距离约克中心四英里。他是该报社在空军服役的十名成员之一（总共有
    19 人在军队服役）。


    不过，《快报》的一名员工确实在博蒙特街的技能派上了用场，记者西德尼·福克斯克夫特（Sidney Foxcroft）当时在皇家信号兵团担任下士，被任命为第八军团新闻以及军方报纸《十字军报》（*The
    Crusader*的前线区域记者。


    在写给位于温莎瑟露台（Windsor Terrace）父母的信中，这位来自赫克斯姆的福克斯克夫特下士说：“这最后几天可能是我入伍以来最有趣的时光。我广泛地穿了各地，并收集素材。在编辑人员中，我是唯一在前线的成员，渴望证明自己的价值。我今天待在最前线的医院和护士们在一起，与不同国籍的人聊天。”


    ![Image](img/f0153-01.jpg)


    哈里·安南是《快报》的另一名成员，他在飞行任务中因事故丧生。


    在战前，西德尼·福克斯克夫特曾参与童军运动。他本人是一名国王级童军，并曾担任第 3 赫克斯姆狼童队的童军长。战后，他回归了职业新闻界，多年担任《人民报》的东北部通讯员。


    不过 1 月也传来了一个好消息，来自兰格尔的士兵威斯利·詹珀·霍森森（33 岁）从意大利俘营逃脱并徒步 200 英里回到家中。他在赫克斯姆斯特拉克家族的利斯庄园（Leases
    Estate）担任场工人，二战爆发时加入了皇家诺康伯郡掷弹团，曾在法国服役并从丹麦尔基撤离，随后回到中东战场，在骑士桥战役中被俘。


