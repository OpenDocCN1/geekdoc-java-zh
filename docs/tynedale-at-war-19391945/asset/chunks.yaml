    Tynedale 在二月份发现了一种对抗纳粹的新武器，当时他们发起了`赫克斯姆及地区土豆周`，敦促当地主妇们停止使用面包，改而供应土豆饼干。这一活动得到了食品部长`伍尔顿勋爵`的支持，他在给零售水果贸易协会赫克斯姆分会主席`S.F.
    Robinson`的电报表示：“通过承认食用本地食品的重要性并为我们的小麦运输空间腾出更坚固的货物，赫克斯姆正在树立良好的典范。”他还为最佳原创土豆食谱设立了两吉尼的奖金。该地区的烘焙师也参与了进来，出售由土豆制成的饼干、蛋糕和点心，许多商人还参与了《库兰特报》上关于土豆周的押韵广告活动。


    最受关注的是由`西威拉姆和普鲁埃合作社`创作的一首诗，他们当地的押韵诗人写道：


    ```

    希特勒对戈培尔说，

    英国人都是没用的，

    他忘记了泰恩赛德的乔迪人

    他们为了土豆简直是恶魔

    他们在埃及证明了这一点

    当时隆梅尔正被追得败北

    他回电给希特勒说，

    我的天哪，我们得逃命。

    ```


    来自`Wark`的杂货商`W. Civil`的贡献是：


    ```

    你无法驾驶飞机，

    无法指挥英国潜艇

    但你可以通过吃当地的土豆

    击败纳粹。

    ```


    来自赫克斯姆`Woodbine Terrace`的商人`E. Dawson` 写道：


    ![Image](img/f0134-01.jpg)


    一场敦促主妇在准备餐食时使用自产而非进口面粉的大型活动，促成了`赫克斯姆土豆周`的启动，食品部为最佳土豆食谱提供了两吉尼的奖金。


    ```

    节省小麦，多吃土豆

    帮助赢得战斗

    它将援助我们英勇的海军

    让侵匈人落于逃路

    ```


    哈尔特威斯尔的水果零售商`E. Carrick` 写道：


    ```

    少吃面包，多吃土豆

    为了营养，它们是好东西

    让船只运送大炮和坦克

    赢得伍尔顿勋爵最热诚的谢意

    ```


    在随附的社中，《库兰特报》写道：


    “谦卑的土豆，印加人的真正财富，可能是击败威胁我们运输的潜艇的主要因素之一。通过多吃土豆、少吃面包，用于进口小麦的大量运输空间将释放给重要的战争物资。整个地区的当地商人、妇女协会和学校正联合起来，努力让人们更好地了解普通土豆的营养价值。尽管土豆在英国被遗憾地忽视，但长期以来一直是爱尔兰农民的主食，在大陆，它们的使用比在本国广泛得多。”


    有人指出，德国的`奥芬堡`有一座纪念英国海盗弗朗西斯·德雷爵士的雕像，以纪念他将土豆引入欧洲大陆。


    `土豆周`取得了巨大的成功，尽管当地议员`I.M. Iveson 小姐`评论道：“我认为，如果伍尔顿勋爵能禁止土豆一个月，他会更好地实现普及土豆的目标，因为在上次大战期间土豆稀缺时，它们才价值金连城。我认为我们正处于这场战争的最后冲刺，但那总是是最的。”


    总共有 41 位商人参加了土豆相关的橱窗竞赛，五吉尼一等奖的获得者是来自哈尔特威斯尔的`R. Wright 父子公司`。安慰奖颁给了赫克斯姆`Battle
    Hill`的`伦敦和纽卡斯尔茶公司`以及普鲁埃的`Walter Willson`商店。赫克斯姆的`Brough`公司和`泰恩河苗场`也获得了特别表扬。


    伍尔顿勋爵颁发的最佳原创土豆食谱两吉尼奖金被授予了赫克斯姆`Acomb House`的`Stanley 夫人`，她的土豆模具被评委描述为“一个非常实用的战时配方”。由于拒绝让他的童子军参加赫克斯姆周的木鸽清点活动，导致了来自`爱德华·格雷学院野鸟类学研究所`的区专员`T.
    Russell Cairns 少校`遭到谴责，该研究所指责他“过度谨慎且短视”。`Cairns 少校`反驳道，该研究所认为木鸽（当地称为`cushats`）筑巢在灌木丛中，而众周知它们更青睐高树顶，他认为让童子军参与太危险了，而且给童军领造成了巨大的责任。他总结道：“我告诉他们，与其爬两三次高树去数幼鸟，不如爬一次，然后把结果做进饼里。”


    他认为童子军在当地承担了许多更重要的国家服务工作，例如担任`防空警报员`、`国民卫队`的信号兵、`青年会`的助理以及药草采集者。他们还进行过鼠尾收集，其中一个童子军独自收集了
    106 条尾，赢得了一枚国家服务勋章。


    赫克斯姆商店的吸引力意味着镇外的人早晨就乘坐巴士来到镇上扫空非配给物资的货架，`赫克斯姆地方议会`会议上的`Ned Fenwick 议员`这样抱怨道。他说每周二（集市日）和周六都是“一场真正的抢购”，等赫克斯姆当地人出去购物时，已经没剩下什么东西了。他说早晨的购物者回到巴士站汇集他们的购买物品，并要求采取措施保护赫克斯姆居民的利益。


    议会食品控制委员会主席`Tom Wheatley 议员`表示，议会没有权力干预此事事，并补充道：“在我看来，如果周边地区的人可以坐巴士进城购物，说明镇上的人下床还不够够快。”


    当赫克斯姆的保守党议员`Douglas Clifton-Brown`被任命为第 139 届下议院议长（王国第一平民）时，赫克斯姆获得了一个非凡的荣誉。他向
    1918 年首次选举他为赫克斯姆议员的选民保证，尽管他的新职位意味着他必须在威斯敏花费更多时间，但他不会搬到伦敦，而是倾向于留在位于`Blanchland`附近的`Ruffside`家中。他自
    1938 年起担任副议长，一直担任议长直到 1951 年退休，被授予“诺森伯郡赫克斯姆鲁夫赛德子爵”的头衔。


    赫克斯姆高尔夫俱乐部是许多郡级锦标赛的举办地，被认为是国内最好的内陆球场之一，但正面临生存之战。有许多成员加入了军队，导致会费减少了 530 英镑，果费从
    1938 年的 538 英镑骤降至 71 英镑。尽管采取了严格的节约，俱乐部仍有许多难以承担的债务，因此发起了一项 2000 英镑的募捐，以确保在战争胜利军人回来时可以使用`Spittal`球场。


    ### 胜利之翼


    “胜利之翼”活动于 1943 年夏天在赫克斯姆和普鲁埃同时启动，赫克斯姆的目标是筹集 25 万英镑以提供四中队的`霍克“飓风”战斗机，而普鲁埃的目标是 4
    万英镑，以发射一架`航空英国斯特”轰炸机。普鲁埃率先实现了目标，筹集了 52039 英镑，这在很大程度上归功于`Mickley 联合煤矿`1.5 万英镑的投资。Rio
    Cinema`还举办了庆祝音乐会，由澳大利亚女高音`Florence Austral`和英国男低音`Norman Allin`以及当地合唱团`普鲁埃合唱团`演出。


    赫克斯姆的活动由新任命的下议院议长`Douglas Clifton-Brown`启动，他发表了关于非洲战争局势转折的激昂演讲，当时他曾担任指挥官的`诺森伯郡骑兵团`正作为反坦克部队表现出色。


