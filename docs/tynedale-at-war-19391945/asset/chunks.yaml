    赫克斯姆（Hexham）街道上举行了一场盛大的游行，一支军队领着规模庞大的队伍，其中包括国内卫军、皇家空军（RAF）、皇家空军女子辅助队（WAAF）、防空团（ATC）、国家消防局、女子训练团、英国军团团、民防队、英国红十字会、女童军和男童军。现场还有一支着装整齐的妇女土地军分队，国内卫军乐队也在游行。镇上的商人们以爱国主义风格装饰窗户参与其中，其中一个广受欢迎的特色是在炸弹上贴上储蓄债券，这枚炸弹后来被投向德国。


    ![Image](img/f0138-01.jpg)


    1943 年夏天，“赫克斯姆之翼周”的目标是筹集`£250,000`以购买四架霍克“飓风”战斗机。


    “胜利之翼周”再次大获成功，赫克斯姆超过了`£250,000`的目标额万`£100,000`。最终总额为`£339,106`，其中`£79,206`来自国家储蓄证书；`£46,030`来自廷代尔郡银行或邮局的存款；`£54,885`通过国防债券；`£4,615`通过储蓄债券；`£67,150`通过战争债券以及`£86,900`通过储蓄债券。


    该地区的 48 所学校的目标是共同筹集`£5,000`，但实际上筹到了`£9,941`。该地区的 39 家邮局募集了`£94,089`的捐款。


    该地区许多地方都超过了目标，包括康姆（Acomb）（目标`£1,000`，总额`£4,082`）、奥伦代尔（Allendale）（`£6,000`，`£18,227`）、布兰奇兰（Blanchland）（`£1,500`，`£3,542`）、科布里奇（Corbridge）（`£10,000`，`£23,
    07`）、科威尔尔（Colwell）（`£150`，`£287 10s`）、海登桥（Haydon Bridge）（`£3,000`，`£11,506`）、汉姆绍（Humshaugh）（`£6,000`，`£9,348`）、新布鲁赫和福尔斯通（Newbrough
    and Fourstones）（`£759`，`£8,567`）、奥文姆（Ovingham）（`£350`，`£1,291`）、瑞丁·米尔（Riding Mill）（`£500`，`£11,160`）、西蒙伯恩（Simonburn）（`£1,000`，`£1,654`）、斯托克斯菲尔德（Stocksfield）（`£12,000`，`£32,420`）以及威拉姆（Wylam）（`£16,000`，`£19,508`）。


    贝灵汉姆的“胜利之翼周”在一周后举行，目标是筹集`£40,000`购买一架兰斯特轰炸机。北泰恩的人们不仅实现了该目标，还额外筹了`£25,000`，以提供五架战斗战斗机，护护兰斯特轰炸机前往德国执行任务。


    1943 年较不为人知的活动之一是乔治六世国王和伊丽莎白王后私访该地区，他们在费瑟斯顿（Featherstone）哈尔特威斯尔–阿尔斯顿线的皇家火车上度了一夜。女王（原伊丽莎白·鲍斯-莱恩）与巴多登米尔（Bardon
    Mill）和贝林廷格姆（Beltingham）地区有家族渊源。巴多登米尔里德利堂（现在是海登桥高中的宿舍楼）在 1948 年以前由女王的叔叔弗朗西斯·鲍斯-莱恩所有。他是该地区的大慈善人，在里德利堂进行了一项重大的重建计划，并在贝林廷格姆的圣库伯特教堂提供了门廊和彩色玻璃窗。他还是
    1881 年爱丁堡苏格兰士兵那臭名昭著的“湿淋阅兵”的幸存者，当时作为女王射箭团长，在暴雨倾盆时，他荣幸为维多利亚女王撑了四个小时伞。


    ### 勋章获得者及其他当地英雄


    科布里奇培养出了一双战争英雄，一位是皇家骑兵卫队的约翰·理查森上尉，他获得了军事勋章（Military Cross）并获得了一枚勋扣。他在 1942 年 5
    月在托布鲁克附近的利比亚沙漠比尔·哈切姆（Bir Hacheim）南方的敌方阵地进攻中表现出色，被授予`MC`；随后在利比亚大理石门地区的一次行动中获得了勋扣，当时他自愿领导一次长达
    370 英里的巡逻，成功切断了德军的大部分。


    ![Image](img/f0140-01.jpg)


    科布里奇的皇家骑兵卫队中尉约翰·大卫·本博·理查森在中东随第八军服役期间，因英勇被授予军事勋章。他是亚历山大·詹姆斯·戈登爵士的曾曾孙孙，后者是曾随尼逊的最后幸存上尉。


    为了纪念他卓越的表现，理查森上尉通过科布里奇战争战役人员捐赠基金收到了一个银质烟盒，但他的父亲——住在住在科布里奇克里夫豪宅（Cliffe House）的约翰·理查森法官代为接受了礼物，并表示儿子仍在西沙漠服役。这位法官说：“他本可以回这里的，因为家里提供了一份当老师的工作，但他说不可能接受这个职位，因为他觉得自己必须留下来完成他开始的工作。”


    兰格利（Langley）的绿色豪亚德团（Green Howards）二等兵约翰·阿姆斯特朗（23 岁）被授予卓越行为勋章，以表他在 1942 年 10 月在艾拉曼因（El
    Alamein）附近的穆纳西布盆地（Munasin Depression）表现出的非凡勇气，当时他的班遭受了敌方机枪阵的袭击。他的班长受伤无法继续战斗，阿姆斯特朗完全不顾自身安全，进攻了该阵地并将其摧毁，使进攻得以继续。当天晚些时候，盟军巡逻队再次被机枪火和闪光弹阻拦，但阿姆斯特朗和另一名等兵冲进了该位置，使其失去战斗能力，并杀死或伤了七名意大利人。第二天，在猛烈的迫击炮火下，阿姆斯特朗对敌方狙击小组持续进行猛烈火力覆盖，杀死至少一名狙击手并迫使其他人放弃了阵地。


    ![Image](img/f0141-01.jpg)


    兰格利的二等兵约翰·阿姆斯特朗在北非穆纳西布盆地摧毁了两个敌方机枪阵后被授予卓越行为勋章。然而在 1944 年西北欧的第五次战役中，他因伤势去世。


    皇家空军兄弟吉姆和托马斯·罗宾森在新加坡沦落后逃离日军，走了世界上半个地球——但他们说，旅途中哪里也没有见过能与赫克斯姆相提并的。军官吉姆和下士托马斯在新加坡沦陷时逃往爪哇，很快日本人也占满了整个爪哇，兄弟俩失散了，一个找到了前往澳大利亚的路，另一个去了印度。吉姆曾是《库兰报》（Courant）机舱室的工作人员，他说：“无论我们在何处，似乎总能找到一份《库兰报》，大家都会带着极大的兴趣阅读它。战前，我们经常能拿到三周以前的《库兰报》，但有一次，我们拿到了一份整整一个月前出厂的。但这并不重要，大家照样读得津津有味。”


    入侵入侵期间，赫克斯姆的下等兵牛顿（Newton）与高地师的机枪手一起处于战斗中心，在战斗期间，他和仅的一名士兵俘了七十名战俘。这一事件发生在高地人从一个狭缝中引出两个意大利人之后，他们指向了一个干谷（wadi——干涸的河床）。班长派牛顿和另一名士兵去调查，结果那七十个人就举着手了出来。


    ![Image](img/f0142-01.jpg)


    赫克斯姆的下等兵汤姆·牛顿在西西里岛的一个干谷中抓了七十名意大利战俘。


    意大利战场的进展让下等兵乔治·克拉克感到感触复杂。他在 1942 年为皇家诺森伯郡团（Royal Northumberland Fus）侦察团服役期间，在托布鲁附近的骑士桥战役（Battle
    of Knightsbridge）被俘。他在一个意大利战俘营里关了十二个月，随后被转到德国的另一个营地。在写给住在赫克斯姆圆形住宅（Round Close）妻子多丽丝的信中，他写道：“我曾以为很快就能回家了，但这个想法已经破灭了。不过，我们待的营地非常好，伙食也好得多。现在我只想找点工作来打发时间，时间过得非常缓慢。”


