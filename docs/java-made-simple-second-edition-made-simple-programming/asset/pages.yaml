- img_proc: true
  md: '# Choice


    These are drop-down lists, from which the user can select one option.


    # Label


    Labels are purely for display. You need them because there is no reliable way
    to integrate drawString items with GUI components. drawString items have their
    positions set by co-ordinates, while GUI components are placed wherever they will
    fit – with Layouts (page 118) giving you some control.


    # List


    These differ from Choice lists in two respects: several or all of the list items
    are displayed – with a scrollbar appearing if needed – and more one item at a
    time can be selected.


    # TextField


    Use these when you want your user to enter or edit a (short), single line of text.
    If a user enters more text than the field is designed for, characters are scrolled
    off the side and cannot easily be accessed again for editing.


    # TextArea


    These are far more flexible than TextFields, with room for an (almost) infinite
    amount of text and scroll bars for easy reading and editing.


    # Layouts and Panels


    These invisible components give you control over the positioning of elements.
    In the sample screenshot, three Panels are used to divide the area vertically,
    and the middle panel uses a Layout to give equal area to the TextArea and Canvas.'
