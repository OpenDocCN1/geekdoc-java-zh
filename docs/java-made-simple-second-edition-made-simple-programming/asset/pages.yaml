  md: "# Displaying images\n\nImages can be displayed directly on the applet, or in\
    \ a canvas, using\nthe drawImage() method. At its simplest, it takes this form:\n\
    g.drawImage(pic, 0, 0, 0, this);\n\nThe pic is drawn at its natural size, with\
    \ the top left corner at\n0.0. this refers to the window or canvas in which the\
    \ image is being\ndrawn. The method needs to know which object to update as it\
    \ is\nscaling or converting the image.\n\nThe second common form of the method\
    \ has two extra parameters to\nset the width and height - if these are different\
    \ from the original.\ng.drawImage(pic, 0, 0, 100, 50, this);\n\nThe image will\
    \ be 100 pixels wide by 50 high.\n\nImage1.java pulls these methods together in\
    \ a simple demonstration.\n\n# Image1.java (Applet)\n\n```\nimport java.awt.*;\n\
    import java.applet.*;\n\npublic class Image1 extends Applet\n{\n    Image pic;\n\
    \n    public void init() {\n        pic = getImage(getCodeBase(), \"car.gif\"\
    );\n    }\n\n    public void paint(Graphics g)\n{\n        g.drawImage(pic, 0,\
    \ 0, this);\n        g.drawImage(pic, 100, 100, 125, 100, this);\n    }\n}\n```\n\
