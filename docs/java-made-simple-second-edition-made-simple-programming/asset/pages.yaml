  md: '# The scope of variables


    # The shape of Java programs


    So far, the example programs have had a very simple structure – a set of statements
    inside the main() method. In practice, most programs will contain several methods,
    each performing a specific function, and all controlled and run from main(). As
    you will see later, applets normally have at least two, and usually far more,
    methods.


    This approach makes programming easier in any language – small blocks of code
    are simpler to develop and test them! Where there is to go wrong – and you can
    sometimes reuse a method in a new program, and save some effort! Methods are integral
    to object oriented programming – when working with classes, you often have to
    write methods to extend or replace existing methods in the classes that you are
    using.


    # Scope


    Variables can be declared more or less anywhere in a program – as long as they
    are declared before you use them! Where they are declared affects where they can
    be used.


    +   * Variables declared at class level – at the top of the program can be accessed
    from any point in the program. These declarations must start with the keyword
    static, which allocates permanent memory space to the variable.

    * Variables declared within a method can only be used within that method.

    * Variables can be declared within such structures as for loops (see page 56).
    They only exist within the loop and are discarded when the program exits the loop.

    * The same name can be used for variables in different methods, without confusing
    the program – though it may confuse you!


    ProgShape.java shows the structure of a program with two methods. It also illustrates
    the scope of variables. b, a class level variable, can be accessed from both methods.
    There are two variables called a which have different values in the two methods.


