  md: '# The Java Virtual Machine


    With Java, Sun came up with a novel solution to the problem of how allow one program
    to run on different platforms, and that is a neat piece of software called the
    Java Virtual Machine (or JVM). When you pass your Java source code to the Java
    compiler, it turns it into byte code. This is not machine code, but a half-way
    stage. Pass it to any computer that has the JVM installed, and this will read
    the byte code, convert it into machine code and run it.


    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_16_0.png)


    The main advantage of this approach is obvious. You can publish your program over
    the Internet knowing that any computer can run it, as long as it has the JVM.
    As this is built into Netscape and Internet Explorer, anyone using those browsers
    can run the same Java program.


    The main disadvantage is less obvious. Because the JVM has to convert the byte
    code instructions to machine code before they can be executed, the program does
    not run as fast as a compiled program.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'There is also another disadvantage. A program is written specifically for one
    type of computer, can make full use of its facilities, optimising its speed, display,
    and use of peripherals. A program written for any (JVM) computer can use only
    those features that can be implemented on all. Sun Microsystems have got this
    limitation by giving Java the ability to handle ''native code'', i.e. code written
    specifically for one machine – which rather seems to take away the point...


    # JVM, browsers and versions


    Just about every browser developed since 1997 has had a Java Virtual Machine.
    But Java has not stood still, and continues to change. If you get the latest version
    when you download the Java SDK (see page 12), you will be able to test and run
    the programs because you will have the latest version of the JVM. If you publish
    your programs on the Web, people with older browsers will not be able to run those
    programs that use the latest Java features – unless they update their browser
    or their JVM.


    This is a perennial problem for Web developers. Do you use the latest software
    to create the best pages that you can do, or do you restrict yourself to older,
    widely-used technologies so that more people can enjoy your site? You decide.


    | Take note |

    | This book was originally written for Java 1.0 and has since been updated to
    Java 2.0, version 1.4. |'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Object oriented programming


    Java is an object oriented (OO) language. It''s not the first, but is built on
    the firm foundations of earlier OO languages. The approach is now established
    as the way to do programming. You can - generally produce better, more reliable
    programs faster with an object oriented language.


    People write big books about the theory and practice of object oriented programming.
    I''m going to spend a couple of pages on it, which should be enough to give you
    a working grasp of its principles. We''ll come back to it from time to time, as
    necessary.


    # Traditional v. OO languages


    First, let''s look at the difference between a ''traditional'' programming language
    and an object oriented one. Think of a clickable button on a Windows screen. If
    you wanted to create this in a traditional language, you would have to write some
    code to draw the button on the screen, then write some more to track the mouse
    movement (drawing the pointer) and watch for the click, and some more to draw
    the button as it is clicked, and at last - you can write the code to do the job
    called up by the click. Oh yes, and you''ll have to do most of it again next time
    you want another clickable button!


    Java, like most new object oriented languages, knows about buttons. It knows what
    they look like and how they interact with mice. If you want a clickable button
    in a Java program, all you have to do is specify where to put it, what to write
    on it, and what to do when it is clicked.


    In an object oriented language, you have ready-made, reusable blocks of code -
    the objects.


    # The nature of objects


    To understand the characteristics of objects, let''s take an analogy from the
    real world. Think of a car. It has certain characteristics including its shape,
    colour, and speed and direction (when moving). In OO jargon, these are variables,
    which are set at the time of creation, and others which can be changed at any
    time.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'With simple variables, you use expressions like this to change their values:


    speed = 90


    When working with objects, you use **methods – built-in routines – to change the
    values held by its variables.** This is a safety feature, ensuring that values
    are within acceptable ranges and that in changing one value do not have unwanted
    effects on other aspects of the object. The method for changing the colour might
    look like this:


    ```

    mycar.setColor(red);

    ```


    In the jargon, we are sending a *message* to the setColor method of the mycar
    object, with the *parameter* object.


    To go back to the analogy, if you want the car resrayed red, you could do it yourself,
    but you get a better result by taking it into a bodyshop. If you want to read
    the stockmarket reports in the paper and talk to your broker on the phone while
    you are travelling by car, you''d be safer with a chauffeur.


    In OO jargon, this is called *encapsulation*. An object''s variables are protected
    from direct contact with the outside world and can only be changed through the
    object''s methods.


    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_19_0.png)


    An object consists of variables and methods. Some methods are used for changing
    variables, others control its activities.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Objects and classes


    When manufacturers are making cars, they does not design each one from scratch.
    Instead, they have a blueprint, and follow that – setting the colour, upholstery,
    engine size and other variables as required.


    In OO jargon, the blueprint is called a class, and an object is an instance of
    a class. The process of creating a new object is called instantiation. (I never
    said the jargon was elegant.) The distinction between class and object gets a
    bit blurred, and here’s why.


    # Inheritance


    Let’s look in on the design studio of the car manufacturer. Their new models will
    come in several versions – saloon, hatchback and estate, with a choice of 2-door
    or 4-door in each. They draw a new blueprint for each version. They start with
    a blueprint that covers the common elements, then adapt this to produce the basic
    saloon, hatchback and estate, and finally take each of to develop the 2- and 4-door
    versions. After the first, each blueprint inherits all the characteristics of
    its predecessor. It may adapt them slightly, and will add extra features of its
    own.


    For an example of inheritance with objects and classes, let’s look at the development
    of a simple database program for a car repair garage. The programmers have defined
    a simple record structure, to store the name, address, phone number and car model
    for each customer, with methods to collect these details. This class is called
    Owner and can be used to create objects in which store the customers’ data. This
    might be called Owner1, Owner2, Owner3, etc.


    If they want to care for customers with a second car, they do not need to write
    another definition, but can create a new object of the Owner class, adding space
    for the second car. This might be called RichOwner– and it becomes a class, as
    it can be used to create new objects.


    In the jargon, RichOwner is a subclass of Owner (and Owner is a super of RichOwner).
    The connection between the two continues after creation. If the Owner class is
    adapted to add date of last service, then that new field is added automatically
    to the RichOwner class.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_21_0.png)


    class


    OWNER


    OWNER1


    OWNER2


    OWNER3


    objects


    RICHOWNER


    class


    RICHOWNER1


    RICHOWNER2


    # Polymorphism


    If object oriented programmers had been working on that car''s blueprints, they
    could have produced a new blueprint (class) for each version; or incorporated
    all the variations within one master blueprint. This is polymorphism – the ability
    to create a new object in several different forms. For example, all of these are
    valid:


    ```

    new rect = Rectangle()

    new rect = Rectangle(50,100)

    new rect = Rectangle(50,100,25,25)

    ```


    The first creates a rectangle, 0 pixels high and wide, and at the top left of
    the screen – it''s ready to be grown and moved later. The second creates one 50
    x 100 pixels, at the top left. The third creates one 50 x 100 pixels, 25 pixels
    down and right from the top left.


    The message is the same in all cases – only the number of parameters changes.
    Technically this is achieved through having several methods with the same name
    but different definitions. The practical result is to give you much more flexibility.'
  merge: -1
