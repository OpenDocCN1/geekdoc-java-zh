  md: '# Layouts


    The arrangement of components depends upon the Layout. If you do not specify it,
    the default Flow Layout is used – and this is fine where you have only a few components.
    With more complex displays, you should set the layout. The Border and Grid layouts
    are simple to manage, and though they have some significant restrictions, using
    them with Panels (see page 121) can produce well-balanced displays.


    # BorderLayout()


    This can take up to five components – four around the edges, and one in the centre.
    The components are expanded (or shrunk) as necessary to fill the space allocated
    to them, and you cannot control this this. In the following example, all the components
    are buttons, as they show clearly the resizing, but they could be any other GUI
    objects.


    The simplest way to define a Border layout is with this line:

    setLayout(new BorderLayout());


    If required, you can set the horizontal and vertical gaps between components using
    this variation:

    setLayout(new BorderLayout(hgap, vgap));


    The hgap and vgap values are ints, and measured in pixels.


    When adding components to the layout, you must specify where they go, using the
    keywords “North", “South", “East", and “Center”. This places a Button, with the
    label “North", at the top of the layout:

    add(new Button("North"), "North");


    Border layouts can take a maximum of five objects, but do not have to take this
    many. A layout that just used “North” and “Center” would give you one large main
    area and a thin component across the top.


    > Take note

    There is also a GridBagLayout which gives you more control over positioning, but
    is far more complicated to use.


    118'
