  md: '# AND and OR


    && (AND) operator compares the results from two tests, with the

    expression being true if both tests are true.


    ( ( x >= 20) && (y <= 30) )


    This expression is true for all values of x from 20 to 30.


    With an || (OR) operator, the expression is true if either or both of the

    tests are true.


    ( ( x > 100) || (y > 200) )


    This expression is true if x is greater than 100 or y is greater than 200,

    or if both are over its limits.


    A logical expression can have more than two tests and can include

    both && and ||. In mixed expressions, && is evaluated first, unless

    y use brackets – here, as in arithmetic, anything in brackets is

    evaluated.


    ( ( x >= 20) && (x <= 30) || (y > 200) )


    For this to be true, the x value must be between 20 and 30, or the y

    value over 200 – in which case, the x value is irrelevant.


    ((x > 100) || (y > 200)) && (edgecheck = true))


    This is true if either, or both, the x and y values are over the limit, and

    edgecheck has been set to true.


    Take

    The aim of this chapter is to explain the words that can be used to structure
    Java

    programs. So that we can focus on those, and not get bogged down in other matters,

    the examples are all applications and are either trivial or contrived. The interesting

    stuff comes later, once we have got the basics out of the way!


    55'
