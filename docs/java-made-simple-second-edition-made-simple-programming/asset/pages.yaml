  md: "# Arcs\n\nThe arc methods are developed from those that draw ovals. They have\
    \ two additional parameters – one to fix the start of the arc, and one for size\
    \ of the angle. For example:\ngfillArc(10,100,100,100,0,90);\n\nThis draws a segment\
    \ of a circle by 100 pixels, with the top left corner of its bounding rectangle\
    \ at 10,10. The segment starts at 3 o'clock and goes round to 12 o'clock. Two\
    \ points about the angles:\n\n+   - Arc angles are given in degrees (whole degrees,\
    \ the parameters are ints), rather than the radians that are used in sine and\
    \ cosine calculations.\n- 0° is at 3 o'clock, and angles are measured counter-clockwise\
    \ using a negative value if you want to swing clockwise.\n\nHere are some drawArc()\
    \ and fillArc() statements at work:\n\n# Arcs.java (Applet)\n\n```\nimport java.awt.*;\n\
    import java.applet.*;\n\npublic class Arcs extends Applet {\n    public void paint(Graphics\
    \ g) {\n        g.fillArc(10,100,100,100,0,90);\n        g.drawArc(10,100,100,100,0,180);\n\
    \        g.fillArc(12,100,100,90,-60);\n        g.drawArc(120,120,100,50,270,-210);\n\
    \    }\n```\n\nThese two work within the same circle boundaries\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_142_0.png)\n\
    \nStart at the top and fill to 60° right\n\n```\nThis line will produce the same\
    \ result:\ng.drawArc(120,120,100,50,60,210);\n```\n\n132"
