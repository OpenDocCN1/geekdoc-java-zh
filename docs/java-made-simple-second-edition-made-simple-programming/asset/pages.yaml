    you write the code if you want to do anything when the object is set up. Here
    we are adding the Mouse and MouseMotion Listeners.


    Within MyCanvas are the mouse methods and paint(), which must be there because
    they work on the draw drawarea object – if they were within the main program they
    would work on the overall applet window.


    ToolPanel is similarly a new sub-class of Panel, but notice the difference in
