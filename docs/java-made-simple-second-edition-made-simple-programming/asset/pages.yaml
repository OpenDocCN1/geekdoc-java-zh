  md: "# # Catching the mouse\n\nIf you intend to write any games or interactive graphics\
    \ programs, you will need to know how to control the mouse. The code given on\
    \ the next few pages explores the basics of mouse control.\n\nMouse activity is\
    \ picked up by the methods of two Listener classes, MouseListener and MouseMotionListener.\
    \ These are initial-when the applet starts:\n\n```\npublic void init() {\n   \
    \ addMouseMotionListener(this);\n    addMouseListener(this);\n}\n```\n\nAnd should\
    \ be cleared away when the applet closes, they may otherwise lock up system resources,\
    \ destroy() is a standard Applet method which is automatically called after stop().\n\
    \n```\npublic void destroy() {\n    removeMouseMotionListener(this);\n    removeMouseListener(this);\n\
    }\n```\n\nThe MouseListener methods are:\n\n+   - mouseEntered, when the cursor\
    \ moves over the component\n- mouseExited, when the cursor moves off the component\n\
    - mouseClicked, picks up the two actions of pressing and releasing a button —\
    \ these can also be picked up separately by...\n- mousePressed, a button has been\
    \ pressed down\n- mouseReleased, a button has been released\n\nThe MouseMotionListener\
    \ methods are:\n\n+   - mouseMoved when the cursor is in motion\n- mouseDragged\
    \ = mouseMoved with a button pressed\n\nAll of these have the same single parameter\
    \ of a MouseEvent object. This observes the state of the buttons and the position\
    \ of the mouse. It's the position that we are interested in here:"
  merge: -1
  pgno: 96
