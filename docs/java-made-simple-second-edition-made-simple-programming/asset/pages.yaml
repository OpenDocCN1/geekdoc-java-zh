  md: '# Choices and Lists


    A Choice object is a drop-down list, from which the user can select one item.
    A List object is displayed in full, or in a scrollable box, and the user can normally
    select several items at once. So, although the two types of Components are set
    up with similar routines, a different approach is needed for checking and recording
    selections.


    # addItem()


    With a CheckboxGroup, each of its Checkboxes is a separate object which must be
    created individually. The opposite applies to Choices and Lists. A Choice (or
    List) is a single Component, and its options are an integral part of it. At its
    simplest, a Choice could be set up like:


    ```

    Choice c = new Choice();

    c.addItemListener(this);

    c.addItem("Option 1");

    c.addItem("Option 2");

    add(c);

    ```


    Notice that we are using an ItemListener, as for Checkboxes, but we only need
    one to handle the whole set. A List is set up in the same way, except that the
    addItem() is replaced by add():

    partsList.add("Another option");


    # The index


    Options are displayed on screen, in the order of their addItem() lines. They are
    also stored within the Choice in their order, and can be identified by their index
    value, starting from 0. You can use the index to set default values. For example,
    to set "Option 2" as the initial selection, you would use the select() method,
    like:


    ```

    c.select(1);

    ```


    After the user has made a choice, you can read the index value to find out what
    it was:


    ```

    chosen = c.getSelectedIndex();

    ```


    An index is rarely used in its raw form. You normally would want to use it to
    select an action or set another variable. This could be done


    114'
