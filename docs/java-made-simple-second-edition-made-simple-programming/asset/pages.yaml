  md: '# Pie charts


    The next program again demonstrates arcs, but is also an example of working with
    arrays and shows another way to define colours. It takes a set of figures and
    displays them as a pie chart.


    # The arrays


    There are three arrays, each of six elements (or as many as you like):


    ```

    double[ ] value = new double[6]; // the figures to be charted

    int[ ] slice = new int[6]; // the degrees in each slice

    Color[ ] col = new Color[6]; // the colours of the slices

    ```


    value must be a double or float type because the calculations that are performed
    on its contents. Numbers are assigned to the value in int(), and are then totalleded,
    running them through a loop:

    for (int loop = 0; loop < 6; loop++)

    total++= value[loop];


    If we divide each value by total, it gives a fraction of the whole. Multiplying
    this by 360 converts it to degrees.

    for (int loop = 0; loop < 6; loop++)

    slice[loop] = (int) (value[loop]/total*360);


    > Take note

    The program could be rewritten to take the value figures as parameters, or from
    the user through a TextField.


    # Predefined Colors


    In the documentation for java.awt.Color you will find a set of thirteen predefined
    Color values. They are handy in situations like this, where you want a variety
    of colours, but aren''t too bothered about the exact shades. To use them, write
    ‘Color’ followed by the name, e.g.


    ```

    col[0] = Color.red;

    ```


    The other names are black, blue, cyan, darkGray, gray, green, lightGray, magenta,
    orange, pink, white and yellow.


    133'
