  md: "# while loops\n\nfor loops are normally repeated a set number of times. while\
    \ loops give you greater flexibility in two ways:\n\n+   - the exit test can check\
    \ any variable, not just a loop counter;\n- the exit test can be at the start\
    \ or end of the loop – so, if the right condition is met, the loop's statement\
    \ may not be performed at all.\n\nThe while loop takes this shape:\nwhile (test)\n\
    { statement(s);\n\nThe system performs the test on entry to the loop, and before\
    \ each repetition. Here's a very simple example, using a counter to determine\
    \ the number of repetitions.\n\n# WhileEx.java (application)\n\n```\nclass WhileEx\
    \ {\n    public static void main(String[] args) {\n        int count = 0;\n  \
    \      while (count < 10) {\n            count++;\n            System.out.println(count);\n\
    \        }\n    }\n}\n```\n\nOne of the things to notice here is that this displays\
    \ 1 to 10, even though the text is < 10. That's because the increment and print\
    \ is done after the test. Compare this with the equivalent for loop, and keep\
    \ the difference in mind when setting up loop tests.\n\n```\nfor (count = 0;count\
    \ < 10; count++) {\n    System.out.println(count); //displays 0 to 9\n}\n```\n\
