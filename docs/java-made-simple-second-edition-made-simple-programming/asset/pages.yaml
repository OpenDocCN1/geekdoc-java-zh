  md: '# Errors and exceptions


    Your programs will not always be perfect – no programmer ever achieves this –
    but you can try to anticipate possible errors, and Java will help you with this.


    # Runtime errors


    The fact that a program compiles successfully does not mean that it is error-free.
    Compilation tells you that you have written the Java statements and methods using
    the correct syntax. It will not tell you that a while loop will run forever as
    the exit test will never be true, or that under certain conditions – a variable
    will not hold an acceptable value, or an array''s subscript will be outside the
    range of the array. These errors will only show up at runtime.


    Rigorous testing will help to turn up some bugs. You must check every possible
    route through your program, and test all values across the range of possible –
    and impossible – values. When you have done all to test it, hand the program to
    people who have not seen it before. They will try to do things that you never
    thought of!


    If you cannot see where a program is going wrong, insert statements to display
    the values held in key variables or to mark the progress through a routine:


    ```

    System.out.println("The total is " + total);

    System.out.println("Into the calculating loop\");"

    ```


    These stubs (in the jargon) are best used one or two at a time to narrow the bug-search
    first to the method, then the line that is causing the trouble.


    # Exceptions


    Runtime errors are probably less common in Java programs than those written in
    other languages because of its exception-handling. Those methods that are likely
    to hit errors – for example those that open files, which may not be present –
    throw exceptions (a kind of error report). When using these methods, you must
    add code to catch the exceptions.


    72'
