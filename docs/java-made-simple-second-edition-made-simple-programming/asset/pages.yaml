  md: "# # Rectangles\n\nThere are two rectangle methods: drawRect() draws an outline,\
    \ and\nfillRect() produces a solid block. Both must be given the co-ordinates\n\
    of the top left corner and the size of the rectangle:\ng.fillRect(50,150,200,100);\n\
    \nThis draws a block, 200 pixels wide and 100 high, starting at 50, 150,\ndrawRect()\
    \ lines are thin. If you want a thick frame, use a loop or place\none fillRect()\
    \ block within another. These are illustrated below.\n\n```\nimport java.awt.*;\n\
    import java.applet.*;\n\npublic class Rectangle extends Applet\n{\n    Color red\
    \ = new Color(255,0,0);\n    Color yellow = new Color(255,255,0);\n    Color black\
    \ = new Color(0,0,0);\n    Font text = new Font(\"SansSerif\",Font.BOLD,18);\n\
    \n    public void paint(Graphics g) {\n        g.setFont(text);\n        g.setColor(red);\n\
    \        for (int loop = 0; loop < 5; loop++)\n            g.drawRect(50+loop,50+loop,150-loop,25-loop);\n\
    \        g.setColor(black);\n        g.drawString(\"Framed\",80,90);\n\n     \
    \   g.setColor(red);\n        g.fillRect(50,150,200,100);\n        g.setColor(yellow);\n\
    \        g.fillRect(60,160,180,80);\n        g.setColor(black);\n        g.drawString(\"\
    ...again!\",100,200);\n        if the inner corner is the\n            as the\
    \ background, only the\n            frame will be visible\n}\n```\n\nSuccessive\
    \ rectangle is 2 pixels\nsmaller and start 1 pixel in and down\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_138_0.png)\n\
    \n128"
