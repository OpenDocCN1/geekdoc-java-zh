  md: '# Arrays


    Arrays let you store and manipulate information in bulk. Use wherever you have
    a lot of data of the same type – list of names, sets of co-ordinates, results
    from surveys and the like.


    The basic principles behind arrays are simple. Instead of having 10, 100 or 1
    million or more variables each with a unique name, you have one name which refers
    to the whole set, with each individual element identified by its subscript – its
    position in the set. The subscript is written in [square brackets] after the array
    name.


    As the subscript can be a variable, you have a simple way of accessing any – or
    all the elements in the array. We will look this properly in the next chapter
    when we get on ways of repeating actions, here''s a simple example to show what
    is possible. Suppose you had an array of 1,000 numbers (num) and a variable (count).
    If you ran count through the full range of subscripts, while repeating this single
    line:


    ```

    System.out.println(num[count]);

    ```


    it would display all the numbers in the array. If you had numbers been stored
    in individual variables, you would have needed 1,000 ints to display them!


    # Initialising arrays


    It takes a little more work to set up an array than it does to set up a primitive
    variable, such as an int or char. The system needs to know what type of data is
    to be stored, and how many elements there will be. A typical declaration statement
    looks like this:


    ```

    int[] number = new int[100];

    ```


    This sets up an int array, called number. The new constructor (the method that
    creates objects) allocates memory space for 100 ints. Numbering starts from 0,
    so the subscripts for the elements in this array will run from 0 to 99. Notice
    the [square brackets] again.


    An array element can be used wherever you would use a simple variable of the same
    type. You can see this in the following program – the only real difference in
    the assignment and println statements is the presence of the subscript in the
    variable name.'
