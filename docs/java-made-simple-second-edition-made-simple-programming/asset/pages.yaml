  md: "# Text layout\n\nIf you want to place text accurately, the FontMetrics methods\
    \ will give you the height, width and other measurements, of text written in a\
    \ given font. The example below creates a FontMetrics object metrics, which is\
    \ linked to Font l. It uses the methods getHeight() to set the vertical spacing\
    \ between lines, and stringWidth() to find the width of each string. If a string\
    \ will fit on the line after an existing one, it is placed there, otherwise, it\
    \ is displayed on the next line.\n\nI've designed the program to take its text\
    \ and font size as parameters, to make experimentation easier. They could be written\
    \ directly into the applet if you prefer.\n\n# Fonts1.java (Applet)\n\n```\nimport\
    \ java.awt.*;\nimport java.applet.*;\n\npublic class Fonts1 extends Applet\n{\n\
    \    Font f;\n    FontMetrics metrics;\n    int size;\n    int textSize;\n   \
