  md: "Here's a better solution. The if ... else structure gives two branches from\
    \ the same test – one to follow if it is true, and one if it is false. This can\
    \ be extended to handle multiple branching.\n\n```\nif (test1)\n    (statement(s)\
    \ if test1 is true)\n  else if (test2)\n    (statement(s) if test2 is true)\n\
    \  ...\n  else\n    (statement(s) if no tests are true)\n```\n\nIf test1 is false,\
    \ the program tries test2, and failing that, tries the next. If all the tests\
    \ prove false, the program performs the statements after the final else. Here's\
    \ a better solution to the character analysis problem.\n\n# AsciiElse.java (application)\n\
    \n```\nclass AsciiElse\n{\n    public static void main(String[ ] args)\n    {\n\
    \        char letter;\n        do\n            letter = (char)(java.lang.Math.random()\
    \ * 128);\n            System.out.println(\"Non-printing\");\n        else if\
    \ (letter >= ' ' && letter <= '~')\n            System.out.println(letter + \"\
    \ Lower case\");\n        else if (letter >= 'A' && letter <= 'Z')\n         \
    \   System.out.println(letter + \" Upper case\");\n        else if (letter >=\
    \ '0' && letter <= '9')\n            System.out.println(letter + \" Digit\");\n\
    \        else\n            // If flow reaches here, the character is not non-printing,\
    \ not a letter and not a digit\n            System.out.println(letter + \" Symbol\"\
    );\n    } while(letter != ' ');\n}\n```"
