- img_proc: true
  md: "If you were loading an array, or other set, of images, you could use this to\
    \ hold execution until a particular image was loaded, or wait for the whole set\
    \ to load with:\n\n```\ntrack.waitForAll();\n```\n\nwaitID() and waitForAll()\
    \ do not check that the images have been loaded properly. This shouldn't matter\
    \ too much if you are reasonably sure that the files are present and the communications\
    \ are good. If you want to check for errors, the test:\n\n```\nif(track.isError(0))\
    \ ...\n```\n\nwill be true if there was an error during loading.\n\nMediaTracker\
    \ has other methods for checking the status and progress of incoming images –\
    \ look them up in the help pages for the java.awt set.\n\n# The thread and the\
    \ loaded variable\n\nThe thread is set up in exactly the same way as in the previous\
    \ programs in this set. Its run() method has only one real job, which is to wait\
    \ for the image to load. After that, it sets the loaded variable to true, calls\
    \ for a repaint() and exits.\n\nloaded is needed to control the screen display.\
    \ Its state determines whether to show the \"Loading please wait\" message, or\
    \ the image.\n\n```\nif (loaded == false)\n  g.drawString(\"Loading please wait\"\
    ,0,50);\nelse\n  if (cropped)\n    ...\n```\n\nYou could of, replace the simple\
    \ message with a more colourful title screen – created with text and drawn objects,\
    \ not images!"
