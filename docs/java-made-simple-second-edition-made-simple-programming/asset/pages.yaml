  md: '# Exercises


    +   1 Design and write a simple ''jigsaw'' applet. It should have an array, holding
    a set of images which form a picture when moved into the right places. To create
    the pieces, take a picture and cut it to equal size pieces, saving each as a GIF.
    If the names are in a series, e.g. "pic0.gif", "pic1.gif", "pic2.gif", etc., you
    will be able to generate their names as you run through the loop to load the files.
    The name-making line will look something like this:

    name = "pic" + loop + ".gif";


    +   2 Write an applet which will roll the characters in a string, shifting each
    one to the left and bringing the first round to the end of the string. The rolling
    should be repeated until the characters are back in their original places.


