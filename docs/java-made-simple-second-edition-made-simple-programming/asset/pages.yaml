  md: 'The sleep() method works in milliseconds, so 1000 = 1 second. This

    feature of the Thread class is invaluable for animation - it only

    suspends the thread, leaving the rest of the program active.


    In stop(), the thread is turned off:


    ```

    timer = null;

    This is that it also stops execution when the user leaves the applet

    And of course, it is restarted by start(). This is not essential in this

    case - the thread could be left running without interfering with

    anything else, or coming to any harm.

    ```


    mouseDD() is nothing to do with the thread. It is there simply

    show that the rest of the program can be doing active things while the

    thread is running. One lets you drag a string around the screen.


