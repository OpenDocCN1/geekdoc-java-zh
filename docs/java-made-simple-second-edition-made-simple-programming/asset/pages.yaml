  md: '# Polygons


    You can use drawPolygon() and fillPolygon() to produce anything from triangles
    to complex regular and irregular shapes with any number of sides. The shapes are
    defined by the co-ordinates of their vertices, which are written into a pair of
    matching arrays.


    If you want to get a reasonably accurate image, you will find it useful to draw
    it on squared paper and read off the co-ordinates.


    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_140_0.png)


    The next example draws a hexagon. It starts by declaring the arrays, at the class
    level:


    ```

    int[ ] x = new int[6];    // horizontal co-ordinates

    int[ ] y = new int[6];    // vertical co-coordinates

    ```


    Next, it assigns values to define the points. This can be done in init() or start().
    The code will be more readable if you write pairs of statements on one line –
    ending each with a semi-colon.


    x[0] = 100; y[0] = 145;


    Remember that in a 6-element array, the subscripts run from 0 to 5.


    The drawing methods should be called from within paint(). They take as parameters
    the names of the two arrays and the number of points.

    g.drawPolygon(x,y,6)


    Note that the arrays are identified simply by their names – the [] brackets have
    no place here!


    130'
