    line1\");\n        text[2] = getParameter(\"line2\");\n        text[3] = getParameter(\"\
    size\");\n        f = new Font(\"Serif\",0,fsize);\n        metrics = getFontMetrics(f);\n\
    \        resize(400,250);\n    }\n```\n\n> new FontMetrics(f) would not work -\
    \ FontMetrics is an abstract class, and you cannot create an object directly from\
