  md: '# Inputs


    There is, alas, no simple equivalent to println for getting keyboard input into
    a Java application. In practice, this does not matter if your aim is to write
    applets – there are (relatively) easy ways of getting input into applets! (See
    page 108.) However, you should at least know how to read a single character from
    the keyboard – you''ll have to do this in a couple of examples later in the book.
    also illustrates some fundamental points about the Java system.


    # System.in.read()


    This method reads the keyboard, and is used like this:

    a = System.in.read();


    Notice that read() alone is not sufficient – you have to say where the data is
    to be read. In this case it is from the standard input stream, System.in. Other
    streams include disk files and the ports.


    The keyboard is a buffered stream – the data is initially stored in a special
    block of memory. It is transferred from there to the program when the buffer is
    full, or when the [Enter] key is pressed. This means that you cannot pick up a
    single keystroke directly.


    # Typecasting


    read() returns an int value – not a char. Java is a 32-bit system, which means
    that it normally handles data in 32-bit chunks – the size of an int. Converting
    this to a char presents no problems. You can convert data from one type to another
    by typecasting. To do this, you write the required type, in brackets, in front
    of the data, e.g:

    letter = (char) input_data;

    In the example program, the data is typecast as it is read, in the line:

    c = (char)System.in.read();


    # Exceptions


    Java is safety-conscious. Any method which may produce a fatal error must be protected
    by an error-trapping. In the Java jargon, this is known as exception-handling.
    Sometimes you will have to write your'
