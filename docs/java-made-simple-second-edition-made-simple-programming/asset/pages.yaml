  md: "# Branching with if\n\nLoops make programs powerful, giving them the ability\
    \ to process masses of data. Branches make them flexible, allowing them to vary\
    \ their actions in response to incoming data. The simplest form of branch uses\
    \ the if keyword. This is the basic syntax:\n\n```\nif (test)\n    statement(s)\
    \ if true\n```\n\nThe test checks the value held by a variable. If the test proves\
    \ true, the program performs the statement(s), otherwise they are ignored.\n\n\
    A variation on uses the else keyword, which handles the actions to perform if\
    \ the test does not proves true. The syntax is:\n\n```\nif (test)\n    statement(s)\
    \ if true\nelse\n    statement(s) if false\n```\n\nFor example:\n\n```\nif (age\
    \ < 18)\n    cost = 3.50\nelse\n    cost = 5.00\n```\n\nUnder 18s get in for $3.50.\
    \ Everybody else pays $5.00.\n\nYou can see the if structure act at work in the\
    \ next example. It gets the computer to work out the value of a random number,\
    \ which it does by splitting the difference between the highest and lowest possible\
    \ values. If its 'guess' is too high, or too low, a message is displayed and the\
    \ upper or lower limits adjusted.\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_72_0.png)"
