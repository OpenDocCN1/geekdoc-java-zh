  md: '# The GUI and its components


    The Java AWT gives you all the tools you need for building a standard Windows
    GUI – sorry, jargon attack, I''ll try again in English. The Windows screen, with
    its buttons, scroll bars, dialog boxes and other display and interactive elements,
    is referred to as a Graphical User Interface, or GUI (pronounced ''gooey'') -
    as Java is object oriented, it is an OO-GUI or ''oesey-gooey''! All of the standard
    components are available within Java.


    | | |


    TextArea


    List


    Label


    TextField


    Button


    Checkbox


    Choice


    Button


    Canvas


    Buttons are for clicking. You can specify their labels, and control what happens
    when they are clicked.


    This is an area in which you can draw graphics or text – just as you can in the
    main window, but a defined space is sometimes convenient.


    Checkbox and CheckboxGroup


    These are set up in similar ways, but used differently. With the Checkbox, any
    number can be selected at the same time. With the related CheckboxGroup, only
    one of each set can be selected.


    98'
  merge: -1
