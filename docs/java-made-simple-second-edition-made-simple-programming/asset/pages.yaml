  md: '# Panels


    Panels are invisible and largely inactive, essential to good screen displays.
    This is because you can place Panels within layouts, and set layouts within panels.
    You can also mix panels and other components in a layout – the next program has
    Panels at the West and South, and a Canvas at the Center. Here''s its plan, showing
    the arrangement of panels and layouts. Compare it with the screen display.


    Panel: Grid Layout (1x3)


    Applet: Border Layout

    (West, South, Center)


    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_131_0.png)


    Panel: Grid Layout (2x1)


    To create a panelled layout, start by setting the layout for the applet:

    setLayout(new BorderLayout());

    Then create a panel, and set its layout – and note that you must prefix setLayout()
    with the panel''s name.

    Panel p1 = new Panel();

    p1.setLayout(new GridLayout(2,5));

    Components are created and added to the main applet, except that you must prefix
    add() with the panel''s name.

    p1.add(new Label("Control Bar"));

    When the panel is complete, add it to the main layout, just as you would add any
    other component.

    add(p1, "South");


    121'
