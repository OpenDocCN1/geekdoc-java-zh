  md: "# Simple animation\n\nAs long as the image is small, and you don't want to\
    \ do anything else in the applet, you can produce simple animation by moving the\
    \ image, controlling its speed with a delay loop.With larger images, which take\
    \ longer to load and to draw, or where you want to run the animation alongside\
    \ other activities, you must use threads (see Chapter 8). Next example bounces\
    \ a ball across the screen.\n\n# Image2.java (Applet)\n\n```\nimport java.awt.*;\n\
    import java.applet.*;\n\npublic class Image2 extends Applet {\n    Image ball;\n\
    \    public void init() {\n        ball = getCodeBase(\"ball.gif\");\n    }\n\n\
    \    public void paint(Graphics g) {\n        int y = 100;\n        int move =\
    \ 1;\n        for (int x = 0; x < 500; x++) {\n            g.drawImage(ball, x,\
    \ y, this);\n            if (y > 150) move = -1;\n            else if(y < 50)\
    \ move = 1;\n            y += move;\n            for (int delay = 0; delay < 50000;\
    \ delay++);\n        }\n    }\n}\n```\n\nThe image should be no more than 50 by\
    \ 50 pixels\n\nChange direction when the upper and lower limits are reached\n\n\
    Use the end value to control the speed\n\nPath of the ball (not drawn by the program)\n\
    \n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_155_0.png)"
