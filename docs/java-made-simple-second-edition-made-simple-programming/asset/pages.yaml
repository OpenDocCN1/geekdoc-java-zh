  md: '# Sounds


    Java can currently handle sound files only in the au audio clip format developed
    by Sun. This is a bit limiting, as Windows uses the WAV format, but all is not
    lost. For testing purposes, you can use the au files in the Audio folders of the
    JumpingBox and TicTacToe demos.


    If you want to record your own messages and music, Cool Edit, by David Johnson,
    will convert WAV files (and other formats) into au sounds. CoolEdit is available
    from all good shareware sites - try www.shareware.com for a start. When converting
    the files, you must set the options to 8 bit µlaw, and set the sample rate to
    8000 Hz. This is the only version of au that Java can play.


    There are two ways to play sounds. The simplest uses the play() method, taking
    as its parameter the URL of the file:


    ```

    play(getCodeBase(), "ding.au");

    ```


    That loads and plays the file immediately.


    The alternative is to set up an AudioClip object, load the file into there, and
    then play it later in the program:


    ```

    AudioClip beeper = getAudioClip(getCodeBase(), "beep.au");

    ```


    This approach gives you more control as you now have access to the three AudioClip
    methods - play(), loop() and stop().


    ```

    beeper.play(); // plays the clip once

    beeper.loop(); // plays the clip repeatedly

    beeper.play(); // stops both loop or single play

    ```


    The example program uses the beep.au and ding.au files from the TicTacToe/Audio
    folder. They are not very special, but at least they are there! If you copy them
    into your Java files folder, the URLs will be much simpler to write.


    When the app runs, you will hear a continuous beeping and see two buttons. Clicking
    "Press for service" will load and run the "ding" file; clicking "Stop that beeping!"
    will give you some peace.


    150'
