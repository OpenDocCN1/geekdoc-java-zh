- img_proc: true
  md: '# # Creating variables


    # ## Declaration


    This is the process of setting up a variable. You tell the system the type and
    what you want to call it, like this:


    ```

    int Count;

    float Salary;

    ```


    These declarations create an integer called Count, and a floating point variable
    called Salary. Notice that these lines, with all commands, have a semi-colon variable
    at the end.


    You can declare several variables of the same type in one line. Give the type
    at the start, and separate the variable names with commas.


    ```

    int startVal, currentVal, endVal;

    ```


    Variables can be declared at any point in a program – as long as it is before
    you attempt to use them. Normal practice is to declare variables at the start
    of the program, or at the start of the block of code in which they are used. (But
    see *The scope of variables*, page 50.)


    # ## Variable names


    Variable names must start with a letter, dollar sign ($) or underscore (_) and
    may contain any combination of letters and digits. Spaces cannot be used, and
    symbols (apart from _) $) should be avoided.


    You can use either upper or lower case letters in a name, but mix them with care
    as Java is case-sensitive. *myName*, *myname*, *VariableName*, and *MYNAME* are
    four different things. The convention is to use capitals only at the start of
    following words in a multi-word name.


    Keeping names reasonably short and simple will cut down typing errors, but perhaps
    the most important rule is to make sure that the names mean something to you!


    ```

    int age;

    char sex;

    int oldX, oldY, newX, newY;

    double taxToDate;

    ```'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# Assigning values


    You can assign a value to a variable when you declare it, like this:

    type variable = expression;

    or assign a value later in the program, with the simpler statement:

    variable = expression;


    It doesn''t matter which way you do it. If a variable is to have an initial value,
    you may as well assign it when you declare the variable.


    The expression can be a literal value (a number, character or string of text),
    or a calculation or other operation that produces a value. The values should be
    of the same type as the variable, though you can give number values which are
    too large for the type – they are chopped down to fit.


    Numbers can be given as octal, hexadecimal or exponential values, as well as in
    normal (denary) form. We''ll stick to ordinary numbers, which will do all we want
    to do.


    Single characters are given in single quotes, e.g. ''A''. If you should need to
    use ones from the unicode system, it must be given as a hexadecimal value like:

    "\u01F2"


    Strings of text are given in "double quotes".


    These are valid assignments:

    count = 42;

    char sex = ''M'';\myName = "Fred";


    > Take note


    You can make variables into constants (fixed values), by using the keywords ''static
    final'' when you declare and assign them:

    static final float VAT = 17.5

    By convention, constant names are in capitals. Java has some predefined ones,
    as you will see later in the book.


    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_41_0.png)'
