  md: '# Working with numbers


    We have already seen that Text Components offer a simple way to get String input
    from a user. Getting a number value is not quite so easy. Text Components produce
    Strings, and there is no direct way to convert a String into a simple number data
    type.


    If you want a method for converting Strings to numbers, it''s no good looking
    in the String class, but you will find them in the Integer, Short, Float and Double
    classes. These are ''type wrapper'' classes designed to provide extra functions
    for the related types. In the Integer class, you will find parseInt(),which converts
    a String to an int.


    This is what we have to do to get an int value out of a TextField. First get the
    String, *temp*, from the TextField, *entry*.


    ```

    temp = entry.getText();

    ```


    Then use the parseInt() method, from the Integer class, to convert the String
    to the int, **number**.

    number = Integer.parseInt(temp);


    The following program demonstrates getting number values out of a TextField. It
    invites the user to guess a random number, giving "Too high" and "Too low" messages
    until it is guessed correctly.


    When run through the AppletViewer, the applet should look like this:


    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_122_0.png)


    112'
