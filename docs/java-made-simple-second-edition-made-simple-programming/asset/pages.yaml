  md: '# The Java SDK


    If you want to write Java programs, you need the SDK (Software Development Kit).
    You can get your copy, from Sun’s Java site, at:

    http://java.sun.com


    Look for the links to the SDK download area, and remember that you want the SDK,
    not the JRE (Java Runtime Environment). Find a suitable version – the SDK is available
    for Windows, Linux and Solaris machines – and pick the best FTP download site.


    To run your PC must be at least a 166Mhz Pentium with 32Mb (preferably 48Mb) of
    RAM and at least 70Mb of space on the hard disk.


    The SDK is huge and getting bigger. When Java first came out, the kit was under
    4Mb. At the time of writing it was nearly 40Mb, and takes nearly three hours to
    download over a dial-up line. Make sure that you have time to do the job before
    you start!


