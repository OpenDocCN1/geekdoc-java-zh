  md: "# Ovals\n\nIf you want ovals (and circles are just regular ovals), use the\
    \ drawOval() or fillOval(). These follow the same pattern as those for rectangles.\
    \ You do not define them by their centre and radius, but by the top left corner\
    \ and size of the rectangle that would enclose them. You can see this in the demonstration\
    \ program, where ovals are drawn with their matching rectangles.\n\n# Ovals.java\
    \ (Applet)\n\n```\nimport java.awt.*;\nimport java.applet.*;\n\npublic class Ovals\
    \ extends Applet\n{\n    Color grey = new Color(160,160,160);\n    Color black\
    \ = new Color(0,0);\n\n    public void paint(Graphics g)\n{\n        g.drawRect(10,10,150,100);\n\
    \        g.setColor(grey);\n        g.fillOval(10,10,150,100);\n\n        g.fillRect(180,40,100,100);\n\
    \        g.setColor(black);\n        g.fillOval(180,40,100,100);\n        g.setColor(grey);\n\
    \        g.fillOval(200,60,60,60);\n    }\n}\n```\n\n> The parameters are given\
    \ in exactly the same way for ovals and rectangles\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_139_0.png)\n\
    \nTip\nWhen designing with ovals, it may be easier to place them accurately if\
    \ you think in terms of centre and radius, then convert these to the top left\
    \ and size parameters.\n\n129"
