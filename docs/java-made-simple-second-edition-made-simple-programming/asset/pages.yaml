  md: '# Operator precedence


    The calculations so far have been simple ones, with only one operator.

    You can have Java expressions with several operators and values - just as you
    can on paper. The rules of precedence apply here, much as in ordinary arithmetic.


    Where an expression has several operators, multiplication and division- are done
    first, then addition and subtraction, and finally the assignment operators (though
    these are normally used only in simple calculations). If part of the expression
    is enclosed in brackets, that part is evaluated before the rest. e.g.:


    2 + 3 * 4 - (9 - 3) / 2


    has its bracket operation dealt with:


    2 + 3 * 4 / 2


    then its multiplication and division:


    2 + 12 - 3


    11


    Where you have a sequence of multiplication and division (or addition and subtraction),
    it does not matter which you do first. e.g.:


    4 * 6 / 3 = 24 / 3 = 8


    or = 4 * 2 = 8


    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_53_0.png)'
