  md: '# The AppletViewer


    After you have compiled the applet, and written the HTML file, view it through
    the AppletViewer with the command:

    appletviewer test.htm


    Pull down the Applet menu and give the commands Stop, then Start, several times.
    Your applet should now look like this.


    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_88_0.png)


    You have noticed that a Stop clears the display, but when a Start is then given,
    and the display is restored, message has had "Stop... Start..." appended to it.


    While you have the AppletViewer running, you might like to explore some of its
    other commands.

    Restart clears the display, resets any variables and runs init().

    Reload in practice, normally the same as Restart.

    Clone... opens a new window and runs a copy of the applet there - use this to
    compare the applet at different stages of execution.

    Tag... shows the <APPLET...> tag that hosts the applet.

    Print... copies the display to your printer.

    Close/Quit Shuts down the applet and the viewer.

    The other commands can be ignored for now.'
