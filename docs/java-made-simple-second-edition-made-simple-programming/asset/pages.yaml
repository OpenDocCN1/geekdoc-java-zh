  md: "# Switch\n\nThe switch structure can be used to replace a whole set of statements,\
    \ where these all test the same simple variable for different values. A typical\
    \ use would be with a menu, where the switch directs the flow to the chosen option's\
    \ routine. The basic shape of the structure is:\n\n```\nswitch (var) {\n  case\
    \ value1 : statement(s); break;\n  case value2 : statement(s); break;\n  default\
    \ : statement(s); break;\n}\n```\n\n+   * The var being tested will typically\
    \ be an int or char.\n* The values must be literal values – not other variables.\n\
    * The switch does a simple match, comparing each of the values with the var –\
    \ you cannot use the relational operators.\n* The flow runs from one line to the\
    \ next, unless you put a break at the end to force it to jump out of the switch\
    \ block.\n* The statements on the (optional) default line are performed if there\
    \ are no matching cases.\n* You can test only one value with each case. If several\
    \ values lead to the same actions, write them on successive lines. e.g.: case\
    \ 'q';\n  case 'Q' : (exit routine)...\n\nThe following program shows switch at\
    \ work. The choice value is read from the keyboard – and look for a moment at\
    \ that reading routine.\n\n```\nchoice = (char)System.in.read();\nexcess = (char)System.in.read();\n\
    excess = (char)System.in.read();\n```\n\nYou must press [Enter] to get the data\
    \ from the buffer – but the [Enter] keystroke is itself stored in the buffer.\
    \ In a PC, the keystroke is two characters – ‘line feed’, move the cursor to the\
    \ next line, and ‘carriage return’, move it to the left of the screen. In some\
    \ systems the [Enter] keystroke is a single newline character. These surplus characters\
    \ must be read and discarded – hence the excess... lines.\n\n66"
