  md: "The next program creates a simple animated effect - a line sweeping round in\
    \ a circle. Here's the maths behind the circle routine:\n\nJava measures angles\
    \ in Radians, and 2PI(6.28) radians equals 360 degrees. At any angle, the radius\
    \ can be treated as the hypotenuse of a triangle, and the two others give the\
    \ x,y values of a point on the circumference.\n\n```\nx = (int)(java.Math.cos(angle)\
    \ * 100) + 150;\n```\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_137_0.png)\n\n\
    # Lines2.java (Applet)\n\n```\nimport java.awt.*;\nimport java.applet.*;\n\npublic\
    \ class Lines2 extends Applet\n{\n    Color white = newColor(180,255,255);\n \
    \   Color black = newColor(0,0,0);\n    public void paint(Graphics g)\n    {\n\
    \        int x, y;\n        double angle = 0;\n        do {\n            x = (int)(java.Math.cos(angle)\
    \ * 100) + 120;\n            y = (int)(java.Math.sin(angle) * 100) + 120;\n  \
    \          g.setColor(black);\n            g.drawLine(120,120,x,y);\n        \
    \    for (int delay = 0; delay < 5000; delay++)\n                g.setColor(white);\n\
    \                g.drawLine(120,120,x,y);\n            angle = angle + 0.01;\n\
    \        } while (angle < 6.28);\n        g.setColor(black);\n        g.drawLine(120,120,x,y);\n\
    \    }\n\nDrawn to show final position\n```\n\n| 100 = length of line |\n| 120\
    \ = co-ordinate of centre |\n\n> Is this pale blue, to leave a track use 255,255,255\
    \ to erase\n\n> Blank loop to slow down\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_137_1.png)\n\
    \n127"
