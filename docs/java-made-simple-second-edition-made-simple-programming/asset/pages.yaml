  md: "# for loops\n\nThe for loop allows you to repeat a set of instructions for\
    \ a given\number of times. The basic shape of the loop is:\n\n```\nfor (var =\
    \ start_value; end_test) {\n  statement(s); }\n```\n\nWhen the program hits this\
    \ line for the first time, the var is assigned\nstart_value. The following statement,\
    \ block of statements, are\nexecuted, and the flow loops back to the for line.\
    \ The value of var is\nthen adjusted as specified by the change. The end_test\
    \ is performed\n– this typically compares the var with a given value, e.g. counter\
    \ < 100.\nIf the end value has not been reached, the statements are performed\n\
    again, and flow continues to loop back until the end_test is met.\n\nThis simple\
    \ for line:\n\n```\nfor (counter = 0; counter < 10; counter++)\n```\n\nsets up\
    \ a loop that will repeat its statements a total of 10 times, as\ncounter is incremented\
    \ through the values 0 to 9.\n\nThe change does not have to be an increment. This\
    \ loop will repeat 20\ntimes, as counter is taken through the values 100, 95,\
    \ 90, down to 0.\n\n```\nfor (counter = 100; counter >0; counter = counter - 5)\n\
    ```\n\nIf you like, the for variable can be declared within the statement. This\n\
    would restrict its scope purely to the loop, and it would be discarded\non exit\
    \ from the loop.\n\n```\nfor (int counter = 0; counter < 10; counter++)\n```\n\
    \nYou can also give it its start value before the for line, and\nmiss out of the\
    \ line – but you must include a semi-colon; so that the\nend_test is still the\
    \ second item.\n\n```\nint counter = 0\nfor (; counter < 10; counter++)\n```\n\
    \nThe next program demonstrates a simple loop in action, producing a\nvery basic\
    \ times table display. Type it in and try it, then try it with\ndifferent start\
    \ values, end tests and changes."
