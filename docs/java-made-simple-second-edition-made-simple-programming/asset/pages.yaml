  md: "# Preface\n\nThe Java programming language has been designed for portability.\n\
    The same Java code can be downloaded from the Internet and run,\nwithout change,\
    \ on a Sun workstation running Unix, a Windows PC or\nan an Apple. It is mainly\
    \ used to create applets on Web pages, but is\ncapable of producing full-scale\
    \ applications.\n\nThe language is based upon C++, and is very similar in its\
    \ style and\nstructures. It is a large and wordy language. Gaining full proficiency\
    \ in\nit must take time – only because of the amount to be learned.\nHowever,\
    \ its structures follow a clear pattern, so that once the\nessentials have been\
    \ mastered, it is relatively easy to extend one's\nknowledge.\n\nThis book is\
    \ not intended for proficient C++ programmers who want\nto transfer to Java –\
    \ there are plenty of other books already on the\nshelves that do that job. It\
    \ is aimed at those who have little or\nno experience of programming, and it starts\
    \ from scratch. I have\nconcentrated on the basic concepts and practical uses\
    \ of the language,\nand tried to avoid getting bogged down in technicalities.\
    \ Purists may\nobject to some over-simplifications – I hope you will appreciate\
    \ them!\n\nJava Made Simple will take you to the point where you can\nwrite small\
    \ applets for your Web pages, and give you the foundations\n the confidence to\
    \ go further into the language, if you wish to\ndevelop larger applications. Each\
    \ feature is demonstrated at work in\nan applet or a short program, as new concepts\
    \ are learned through\npractical examples. You will find exercises at the end\
    \ of each chapter\n– use to test your knowledge and experiment with new ideas.\n\
    \nThe text files for the larger programs, and for all the answers to the\nexercises,\
    \ can be found on the Made Simple Programming pages at:\nhttp://www.madesimple.co.uk\n\
    \nThis second edition has been rewritten around Java 2.0. All the\nsample programs\
    \ have been recompiled and updated as necessary to\nreflect the development of\
    \ the language.\n\nHappy programming.\n\nP.K. McBride, macbride@tcp.co.uk\n\n\
    ix"
  merge: -1
