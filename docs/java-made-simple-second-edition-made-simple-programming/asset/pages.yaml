  md: "# The first application\n\nA Java application is a free-standing program that\
    \ can be run – with the help of the Java Interpreter – from the MS-DOS Prompt.\
    \ This first example is about as small as they come, but it is enough to show\
    \ the basic shape of a Java application. It will also be enough to test that your\
    \ system is working correctly.\n\n```\n```java\nclass Hello {\n    public static\
    \ void main(String[] args) {\n        System.out.println(\"Hello from Java\");\n\
    \    }\n}\n```\n```\n\nLet's take a line at a time.\n\nclass Hello\n\nA Java program\
    \ is a **class**. Every class has a name, and the convention is that a class starts\
    \ with a capital letter.\n\npublic static void main(String[] ) args\n\nThis is\
    \ the first line in all applications. Java applications must have a method called\
    \ main, which is where execution starts. public makes the application accessible\
    \ from outside, i.e. from MS-DOS. We'll come back to this and to the rest of that\
    \ line later.\n\nSystem.out.println(\"Hello from Java\");\n\nA program consists\
    \ of a number of statements (instructions) – in this case, only one. We use the\
    \ println method (part of the out of the System object) to display a message on\
    \ the screen. The in the end does a Line Feed to push the cursor down to the next\
    \ line. You can use any text you like here, but it must be enclosed in \"double\
    \ quotes\".\n\nDon't miss the semi-colon. Every statement must end with one.\n\
    \nThe {brackets} hold blocks of code together. The outer pair enclose the code\
    \ of the whole program; the inner pair enclose that of the main method – normally\
    \ more than one line! Indenting the code between the brackets shows the structure\
    \ of the program, but is not essential."
