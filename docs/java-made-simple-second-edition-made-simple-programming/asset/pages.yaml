  md: '# Colours


    In a computer system colours are made up of red, green and blue light.


    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_94_0.png)


    This simple pattern applies where the lights are fully on or off. In practice,
    each colour can be present at a range of intensities, so that instead of, say,
    red and green making yellow, they will produce anything from a dark brown through
    to a pale primrose. The simplest devices define


    Java offers several ways to handle colour-setting. The intensity of each colour,
    in the order Red – Green – Blue, on a scale of 0 (off) to 255 (brightest); e.g.
    80,64 gives a reddish-brown.


    In theory, this can give a range of 24 million colours, how how many are actually
    displayed depends upon the graphics system – you may well find that your screen
    resolves the colours to a far smaller set.


    # Color objects and setColor()


    Colours are defined through the Color class, e.g.


    ```

    Red = new Color(255,0,0);

    ```


    This creates the Color object ''red'' and defines it as having red fully on, and
    green and blue off.


    Text and draw objects (see Chapter 6) are drawn in the current colour, so you
    must first set the colour before drawing. To do this, use the setColor() method,
    passing to it a Color object:


    ```

    g.setColor(red);

    ```


    This simple demonstration of colour, defines the three primary colours, and mixes
    a new one – try some combinations of your own.'
