  md: "# Using images\n\nImages are easy to handle. They are stored in Image objects,\
    \ with the files loaded into them by the getImages() method.\n\nImage pic;\n\n\
    pic = getImage(getCodeBase()), \"images/car.gif\";\n\ngetCodeBase() takes its\
    \ as a parameter URL – Uniform Resource Locator – the standard means of identifying\
    \ a file anywhere on the Internet or in a computer.\n\n# URLs\n\nThe easiest way\
    \ to handle the URL is with getCodeBase(). This works out of the directory in\
    \ which the program is stored. If the image file is in the same directory, then\
    \ you would simply follow it with the filename:\n\n```\ngetCodeBase(), \"car.gif\"\
    ;\n```\n\nIf the file is in a sub-directory, you also need to add its name, as\
    \ in the first example, where car.gif is in the images sub-directory.\n\nThe great\
    \ thing about the getCodeBase() approach is that it will give the right URL when\
    \ the files are on your system and when they are uploaded to your Web space on\
    \ your access provider's server.\n\nIf the image file is stored in a completely\
    \ different place from the code, you will have to define the URL using the java.net.URL\
    \ class. This throws an exception that you must catch (see page 72). If you wanted\
    \ to use an image from your access provider's store:\n\n```\nimport java.net.*;\n\
    \ntry{\n    pic = getImage(new URL(\"http://www.net.co/images/ukflag.gif\"));\n\
    } catch(MalformedURLException e) {\n}\n```\n\nThe address is written in full,\
    \ then converted to a URL object. The catch block might get an alternative image\
    \ from a more secure source.\n\n143"
