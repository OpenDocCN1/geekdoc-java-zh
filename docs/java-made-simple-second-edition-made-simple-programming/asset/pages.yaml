  md: "# Multiple branching\n\nThe basic if structure has the beauty of simplicity\
    \ – it shows very clearly the relationship between the test and the outcome. However,\
    \ it is not always the best solution. Consider this problem. You want to analyse\
    \ incoming incoming characters to see if they are upper or lower case letters,\
    \ digits, spaces or symbols. Here's the first draft of a program that should do\
    \ the job.\n\n```\n```java\nclass Ascii {\n    public static void main(String[]\
    \ args) {\n        char letter;\n        do {\n            letter = (char)(java.lang.Math.random()\
    \ * 128);\n            if (letter < ' ') {\n                System.out.println(\"\
    Non-printing\");\n            } else if (letter >= 'a' && letter <= 'z') {\n \
    \               System.out.println(\"Lower case\");\n            } else if (letter\
    \ >= 'A' && letter <= 'Z') {\n                System.out.println(\"Upper case\"\
    );\n            } else if (letter >= '0' && letter <= '9') {\n               \
    \ System.out.println(\"Digit\");\n            }\n        } while (letter != '\
    \ ');\n    }\n}\n```\n```\n\nSo far, so code handles the non-printing characters\
    \ (0 to 31) up to space, the sets, 'a' to 'z', 'A' to 'Z' and '0' to '9'. Now\
    \ what about the rest? Look at any character set (use Windows Character Map),\
    \ and you will see that there are punctuation and other symbols scattered between\
    \ the blocks of letters and digits. A test for these would look like this ' '\
    \ and I'm not guaranteeing that this is correct!\n\nif ((letter >= ' ') && (letter\
    \ <= '0') || (letter >= '9') && (letter <= 'a') || (letter >= '\\') && (letter\
    \ <= 'A') || (letter >= 'Z'))\n\n64"
