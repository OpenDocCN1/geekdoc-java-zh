  md: "# Fonts\n\nJava gives its programmers a remarkable degree of control over the\
    \ appearance of text – though we only have room to cover the basics of this book.\n\
    \nThe Font class has three properties:\n\n+   - Name – Java has a small set of\
    \ standard font names, which are translated into the equivalent fonts on the host\
    \ machine when a program is executed. The keys ones:\n  - Helvetica (SanSerif)\
    \ – may be displayed as Arial\n  - TimesRoman (Serif) – may be displayed as Times\
    \ New Roman\n  - Courier (Monospaced) – may be displayed as Courier New\n  The\
    \ names in brackets are the JDK 1.1 equivalents.\n\n+   - Style – bold, italic\
    \ or plain. This can be set by the numbers: 0 = plain, 1 = bold, 2 = italic, 3\
    \ = bold and italic\n  using the built-in constants:\n  Font.BOLD, Font.ITALIC\
    \ and Font.PLAIN.\n\n+   - The constants can be combined ‘Font.BOLD + Font.ITALIC’\
    \ will give you bold, italic text.\n\n+   - Size – nominally in points, the typesetters’\
    \ measure, but actually displayed in pixels.\n\nThe simplest way to handle fonts\
    \ is to hold each text style in a separate Font object, and to define when it\
    \ is created; e.g.\n  Font mainhead = new Font(\"TimesRoman\",Font.BOLD,36);\n\
    \nWhen you want to set this style, use the setFont() method.\n  g.setFont(mainhead);\n\
    \nThe new font will remain active until you set a new one.\n\nThe next program\
    \ is a simple demonstration of Fonts. Get this running, then play with it – try\
    \ some different style and size settings."
