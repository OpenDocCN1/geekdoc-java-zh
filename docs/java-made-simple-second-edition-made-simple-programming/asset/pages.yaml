  md: '# Outputs


    When you display a variable, you will normally display a message to tell the user
    what it is. The println method has two limitations:


    +   - you can only display one item at a time;

    - it does a line feed, forcing the cursor to the next line.


    So, you could do this:


    ```

    System.out.println("The score is ");

    System.out.println(score);

    ```


    but the display is not impressive:

    The score is

    29


    There are two solutions to this:


    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_44_0.png)


    # System.out.print


    This method also displays values or variables on screen, but does not do a line
    feed at the end. If you want two or more items to appear in a continuous line,
    use a succession of prints, followed by a println.


    ```

    System.out.print("The score is ");

    System.out.println(score);

    ```


    The output this time is:

    The score is

    29


    Which definitely looks better – and remember to include a space at the end of
    the first bit of text, to separate it from the following item.


    # Combined outputs


    You can combine any number of values, variables and literal strings to create
    one output string, using the + operator, e.g.


    ```

    System.out.println("The score is "+ score);

    ```


    This also outputs:

    The score is 29


    As a general rule, the combined string approach works best where there are a limited
    number of smallish items in the output line. The strings themselves can be thousands
    of characters long, but beyond


    34'
