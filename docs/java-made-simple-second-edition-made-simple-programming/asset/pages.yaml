  md: '# Data types


    Variables are named places in memory where you can store the data needed in your
    programs. You can have as many variables as you need, and call them what you like
    – though there are certain rules and conventions for variable names (see page
    30). When you compile your program, the system will allocate space for the variables,
    and convert the names into memory address (that the computer uses).


    | Variable names | Memory | Values stored |

    | --- | --- | --- |

    | Count | 42 | |

    | Sum | 110 | |

    | NextNum | 9 | |


    We return to variables shortly. First we must look at data types. Java recognises
    several data types, allocating different amounts of memory to each – the aim being
    not to use more than necessary.


    # Primitive data types


    These are the simplest types and are used for storing numbers, characters and
    Boolean values.


    There are four formats for integers (whole numbers):


    +   - byte: -128 to +127 (1 byte)

    - short: -32768 to +32767 (2 bytes)

    - int: -2,147,483,648 to +2,147,483,647 (4 bytes)

    - long: +/- 9 billion! (8 bytes)


    And for floating point numbers – those with decimal places. Both can cope with
    astronomical or microscopic values. The most significant difference is in the
    precision with which they store the numbers.


    +   - float: Accurate to 8 significant figures

    - double: Accurate to 16 significant figures


    What this means is that if you calculated a float value to be 12345.6789123 it
    would actually be held as 12345.679.'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'Most programming languages can only handle ASCII characters, which is fine
    for limited (Western) character sets. Java uses Unicode encoding which can cope
    with character sets of up to 65,000 characters.


    char single character

    Boolean values can be either true or false. As you will see in Chapter 3, they
    are mainly used for carrying the results of a test from one part of a program
    to another.


    # Reference data types


    When you create a variable of a primitive data type, you set up a named place
    in memory with just enough space to hold the value. This is fine with numbers
    and characters as they have a defined size. You cannot use the same approach with
    more complex data structures because the amount of storage space will vary from
    one item to another. How much space do you need for someone''s name or address?
    How much space does an object take?


    With a reference data type, the named space in memory does not hold the data.
    Instead it holds the address of where the data is stored. If you haven''t done
    any programming before, you may find this a rather subtle distinction, but it
    has a crucial impact on how you handle these variables of types. You will see
    this when we start to use them.


    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_39_0.png)


    Reference data types include:


    String and stringBuffer for storing text (page 48)

    Arrays sets of variables of the same type (page 44)'
  merge: -1
