  md: "# Lines\n\nThe Graphics class contains several drawing methods. They are fairly\
    \ limited – lines are one pixel thick, and the object is always drawn in the current\
    \ colour – but serve well for diagrams and for enhancing text, and can even be\
    \ used for simple animation.\n\nDrawing is best done within paint(). You can draw\
    \ directly onto the applet, or onto a Canvas. Drawing on Canvases raises problems\
    \ that we touched on the last section. It is dealt with on page 135.\n\ndrawLine()\n\
    \nThis draws a line between two points, with their co-ordinates given in pixels\
    \ (counting from the top left).\n\n```\ng.drawLine(0,0,100,50);\n```\n\nThis draws\
    \ a thin line from the top left corner to a point 100 pixels to the left and 50\
    \ pixels down. If a thicker line is needed, you can draw more lines alongside.\
    \ You can see this in the next example.\n\n# Lines.java (Applet)\n\n```\nimport\
    \ java.awt.*;\nimport java.applet.*;\n\npublic class Lines extends Applet {\n\
    \    public void paint(Graphics g) {\n        g.drawLine(0,0,100,50);\n      \
    \  g.setColor(new Color(255,0,0));\n        g.drawLine(50,75,200,25);\n      \
    \  g.drawLine(50,76,200,26);\n        g.drawLine(50,77,200,27);\n        g.setColor(new\
    \ Color(0,0,255));\n        for (int y1 = 120; y1 < 130; y1++) {\n           \
    \ g.drawLine(100,y1,200,y1+20);\n        }\n    }\n\n```\n\n> Tip\nSet the applet\
    \ width and height in the HTML page to suit the displays.\n\nA second drawLine()\
    \ thickens the line\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_136_0.png)\n\n\
    Looped lines for greater thickness – use drawRect() for vertical or horizontal\
    \ applet started.\n\n126"
