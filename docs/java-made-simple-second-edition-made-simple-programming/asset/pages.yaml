  md: "# Using methods\n\nYou can write a program as a single block of code, but beyond\
    \ a certain size, such programs become hard to read and hard to debug. A better\
    \ solution is to divide the code into distinct blocks, of which is defined as\
    \ a new method. main() calls (transfers to) the method when it needs to execute\
    \ its code, and after its execution, the flow returns from the method to main().\
    \ This process can be taken further, with one new method calling another. Program\
    \ flow always returns to the line after the call.\n\nThe example below is actually\
