    \ x1 = 50;\nint y1 = 50;\nThread timer = null;\nint count = 0;\npublic void init()\
    \ {\naddMouseMotionListener(this);\n}\npublic void start() {\nif(timer == null)\
    \ {\ntimer = new Thread(this);\ntimerer.start();\n}\n}\n}\n```\n\nthis links this\
    \ thread to\n the Runnable applet\n\n```java\npublic void stop() {\n    timer\
    \ = null;\n}\n\npublic void destroy() {\n    removeMouseMotionListener(this);\n\
    }\n\npublic void run() {\n    while (timer != null) {\n        try {\n       \
    \     Thread.sleep(1000);\n        } catch (ruptedException e) {\n           \
    \ count++;\n        }\n        repaint();\n    }\n}\n\npublic void mouseDragged(MouseEvent\
