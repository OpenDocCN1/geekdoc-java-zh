  - "[PAGE 110]\n\n# Buttons and events\n\nButtons are probably the easiest – and\
    \ most useful – GUI components to add to your applets. Here's the code that sets\
    \ up a button. The pattern with variations – is used for all components.\n\n```\n\
    btnClick = new Button(\"Click Me\");\nbtnClick.addActionListener(this);\nadd(btnClick);\n\
    ```\n\nThe first line creates the button and sets its label text. The addActionListener\
    \ attaches an EventListener to the button to spot when it is used. The code should\
    \ be written into the init() or start().\n\nIn the days before Windows (and other\
    \ GUIs), event-handling in real time – picking up user's actions as they happened\
    \ – was really hard work. Now it is simpler. When you move or click the mouse,\
    \ press a key or interact with an applet in any way, you generate an event. Java,\
    \ through the Windows system, is constantly monitoring the hardware. When it receives\
    \ an incoming signal, such as a mouse click, it relates this to the current cursor\
    \ position and screen components, records the information about what you did and\
    \ what you did it to, in an event.\n\nThere are many methods which handle events.\
    \ If you write one of these into your program, the method will be executed when\
    \ an event occurs. What you have to do is work out which type of event handler\
    \ to use, then decide what should happen in response to the event and write the\
    \ code for it – but at least you don't have to write code to spot the event!\n\
    \nTo pick the button's click, use the actionPerformed() method, like this:\n\n\
    ```\npublic void actionPerformed(ActionEvent e) {\n    ... whatever the button\
    \ does\n}\n```\n\nactionPerformed() has as its parameter an ActionEvent object\
    \ which can be examined to get details of the event. In this instance we do not\
    \ need to that as there is only one button and only one possible action – it is\
    \ enough to know that an action has been performed."
  - "[PAGE 111]\n\nIn this first Button example, clicking the button produces a message\
