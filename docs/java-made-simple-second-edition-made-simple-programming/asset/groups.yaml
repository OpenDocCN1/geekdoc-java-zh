    \ 加载时运行，并且当 applet 页面重新加载时再次运行。如果你想在有人返回页面时重新启动某个操作，请在此方法中执行。\n\n`stop()` 在浏览器关闭或打开另一个页面时运行。\n\
    \n`paint()` 在页面加载或重新加载时重绘显示。\n\n`Applet` 类的定义包含了这些方法，但是以如下留空的形式存在的：\n\n```java\n\
