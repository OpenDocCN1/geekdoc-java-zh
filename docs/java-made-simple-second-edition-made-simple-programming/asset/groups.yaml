    \ `getItem()` 读取标签来确定是哪一个复选框。\n\nString option = (String) e.getItem();\n并测试获取了什么：\n\
    \n```java\nif (option.equals(\"Bold\"))\n```\n\n现在发生的情况取决于它是单独的复选框还是复选框组。\n\n\
