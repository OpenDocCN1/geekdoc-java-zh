  - "[PAGE 153]\n\n# Using images\n\nImages are easy to handle. They are stored in\
    \ Image objects, with the files loaded into them by the getImages() method.\n\n\
    Image pic;\n\npic = getImage(getCodeBase()), \"images/car.gif\";\n\ngetCodeBase()\
    \ takes its as a parameter URL – Uniform Resource Locator – the standard means\
    \ of identifying a file anywhere on the Internet or in a computer.\n\n# URLs\n\
    \nThe easiest way to handle the URL is with getCodeBase(). This works out of the\
    \ directory in which the program is stored. If the image file is in the same directory,\
    \ then you would simply follow it with the filename:\n\n```\ngetCodeBase(), \"\
    car.gif\";\n```\n\nIf the file is in a sub-directory, you also need to add its\
    \ name, as in the first example, where car.gif is in the images sub-directory.\n\
    \nThe great thing about the getCodeBase() approach is that it will give the right\
    \ URL when the files are on your system and when they are uploaded to your Web\
    \ space on your access provider's server.\n\nIf the image file is stored in a\
    \ completely different place from the code, you will have to define the URL using\
    \ the java.net.URL class. This throws an exception that you must catch (see page\
    \ 72). If you wanted to use an image from your access provider's store:\n\n```\n\
    import java.net.*;\n\ntry{\n    pic = getImage(new URL(\"http://www.net.co/images/ukflag.gif\"\
    ));\n} catch(MalformedURLException e) {\n}\n```\n\nThe address is written in full,\
    \ then converted to a URL object. The catch block might get an alternative image\
    \ from a more secure source.\n\n143"
  - "[PAGE 154]\n\n# Displaying images\n\nImages can be displayed directly on the\
    \ applet, or in a canvas, using\nthe drawImage() method. At its simplest, it takes\
    \ this form:\ng.drawImage(pic, 0, 0, 0, this);\n\nThe pic is drawn at its natural\
    \ size, with the top left corner at\n0.0. this refers to the window or canvas\
    \ in which the image is being\ndrawn. The method needs to know which object to\
    \ update as it is\nscaling or converting the image.\n\nThe second common form\
    \ of the method has two extra parameters to\nset the width and height - if these\
    \ are different from the original.\ng.drawImage(pic, 0, 0, 100, 50, this);\n\n\
    The image will be 100 pixels wide by 50 high.\n\nImage1.java pulls these methods\
    \ together in a simple demonstration.\n\n# Image1.java (Applet)\n\n```\nimport\
    \ java.awt.*;\nimport java.applet.*;\n\npublic class Image1 extends Applet\n{\n\
    \    Image pic;\n\n    public void init() {\n        pic = getImage(getCodeBase(),\
    \ \"car.gif\");\n    }\n\n    public void paint(Graphics g)\n{\n        g.drawImage(pic,\
    \ 0, 0, this);\n        g.drawImage(pic, 100, 100, 125, 100, this);\n    }\n}\n\
    ```\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_154_0.png)\n\n144"
- md: "\n## Simple animation\n\nAs long as the image is small, and you don't want\
    \ to do anything else in the applet, you can produce simple animation by moving\
    \ the image, controlling its speed with a delay loop. With larger images, which\
    \ take longer to load and to draw, or where you want to run the animation alongside\
    \ other activities, you must use threads (see Chapter 8). Next example bounces\
    \ a ball across the screen.\n\n## Image2.java (Applet)\n\n```java\nimport java.awt.*;\n\
    import java.applet.*;\n\npublic class Image2 extends Applet {\n    Image ball;\n\
    \    public void init() {\n        ball = getCodeBase(\"ball.gif\");\n    }\n\n\
    \    public void paint(Graphics g) {\n        int y = 100;\n        int move =\
    \ 1;\n        for (int x = 0; x < 500; x++) {\n            g.drawImage(ball, x,\
    \ y, this);\n            if (y > 150) move = -1;\n            else if(y < 50)\
    \ move = 1;\n            y += move;\n            for (int delay = 0; delay < 50000;\
    \ delay++);\n        }\n    }\n}\n```\n\n- The image should be no more than 50\
    \ by 50 pixels\n- Change direction when the upper and lower limits are reached\n\
    - Use the end value to control the speed\n- Path of the ball (not drawn by the\
    \ program)\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_155_0.png)\n\n## Image\
    \ filters\n\nIf you check out the documentation for the java.awt.image package,\
    \ you will find that it contains several interfaces and classes that can be used\
    \ for manipulating images. The next program dips into these to create cropped\
    \ and enlarged images. It displays an image – I have used a map – and when the\
    \ mouse is clicked anywhere on it, it displays an enlarged view of the area around\
    \ the mouse.\n\n## The interfaces\n\nInterfaces act as links between objects and\
    \ classes, providing them with extra facilities. There are three in the image\
    \ class:\n\n- ImageConsumer is the object which takes the data for a new image\
    \ after it has been processed. We are not using one here.\n- ImageObserver is\
    \ the object which monitors the progress of an image as it is being drawn where\
    \ images are being prepared off-screen, for use in animation. In this, as in the\
    \ previous Image programs, we are using one – though it is not obvious. The drawImage\
    \ parameter this tells Java to use the image as its own ImageObserver.\n- ImageProducer\
    \ is the source of data for an image. In this program we load one image from file,\
    \ and use that as the source for a second image.\n\n## The classes and methods\n\
    \nImageFilter brings in methods for changing the colour, size and scale of image\
    \ objects.\n\nCropImageFilter is an extension of ImageFilter that crops a rectangular\
    \ section of an image.\n\n```java\nImageFilter imgF = new CropImageFilter(cropX,cropY,420,330);\n\
    ```\n\nThis line defines the ImageFilter object imgF as one which takes a block\
    \ 420 x 330 pixels, starting at cropX, cropY. Where it takes it from is not defined\
    \ at this stage.\n\nFilteredImageSource forms the link between the source image\
    \ and the ImageFilter object, with the output depending upon the nature of the\
    \ ImageFilter. Here, the line:\nImageProducer imgP = new FilterImageSource(source.getSource(),\
    \ imgF);\ncrops the area defined in imgF of the source image. This is then converted\
    \ from an ImageProducer object to a standard image by:\ncrop = createImage(imgP);\n\
    \n## Before you start...\n\nThe program below was designed to work with an image\
    \ 840 x 660 pixels, and a display area of 420 x 330 – half scale. All the calculations\
    \ are based on those values, so if your image is a different size, you will have\
    \ to vary the numbers to suit.\n\nIf you want to simplify things a bit, you can\
    \ omit the limit checks in Cropper() – this output will be a bit messier, but\
    \ it won't hurt to go beyond the limits of the original image.\n\nTop left limits:\
    \ 105,83 (210,165)\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_157_0.png)\n\n\
    330 (660)\nCursor position\nBottom right limits: 315,247 (630,495)\n420 (840)\n\
    \n(Applet values) (Image values)\n147\n\n## Image3.java (Applet)\n\n```java\n\
    import java.awt.*;\nimport java.awt.event.*;\nimport java.awt.image.*;\nimport\
    \ java.awt.applet.*;\n\npublic class Image3 extends Applet implements MouseListener\n\
    {\n    Image source;\n    Image crop;\n    boolean cropped = false;\n\n    public\
    \ void init() {\n        source = getImage(getCodeBase(), \"map.gif\");\n    \
    \    addMouseListener(this);\n    }\n\n    public void destroy() {\n        removeMouseListener(this);\n\
    \    }\n\n    public void mouseClicked(MouseEvent e) {\n        int x = e.getX();\n\
    \        int y = e.getY();\n        if (cropped == false) {\n            Cropper(x,y);\n\
    \            cropped = true;\n        } else {\n            cropped = false;\n\
    \        }\n        repaint();\n    }\n\n    public void mousePressed(MouseEvent\
    \ e) { }\n    public void mouseEntered(MouseEvent e) { }\n    public void mouseExited(MouseEvent\
    \ e) { }\n    public void mouseReleased(MouseEvent e) { }\n\n    public void Cropper(int\
    \ x, int y) {\n        if (x < 105) x = 105;\n        if (x > 315) x = 315;\n\
    \        if (y < 83) y = 83;\n        if (y > 247) y = 247;\n        int cropX;\n\
    \        cropX = 2 * x - 210;\n        cropY = 2 * y - 165;\n        ImageFilter\
    \ imgF = new CropFilter(cropX,cropY,420,330);\n        ImageProducer imgP = new\
    \ FilterImageSource(source.getSource(), imgF);\n        crop = createImage(imgP);\n\
    \    }\n\n    public void paint(Graphics g) {\n        if (cropped) g.drawImage(crop,0,0,420,330,this);\n\
    \        else g.drawImage(source,0,0,420,330,this);\n    }\n}\n```\n\nThe limit\
    \ checks are optional, but produce a neater result. The screen's x,y coordinates\
    \ are converted to image coordinates - subtracting 210 and 165 gives the top left\
    \ corner of the crop area. This is all one line\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_159_0.png)\n\
    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_159_1.png)\n\nApplet Viewer: Image3.class\n\
    Applet started.\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_159_2.png)\n\nClick\
    \ here selects the area for cropping and enlargement\n\n## Sounds\n\nJava can\
    \ currently handle sound files only in the audio clip format developed by Sun.\
    \ This is a bit limiting, as Windows uses the WAV format, but all is not lost.\
    \ For testing purposes, you can use the au files in the Audio folders of JumpingBox\
    \ and TicTacToe demos.\n\nIf you want to record your own messages and music, CoolEdit\
    \ by David Johnson, will convert WAV files (and other formats) into au sounds.\
    \ CoolEdit is available from all good shareware sites - try www.shareware.com\
    \ for a start. When converting the files, you must set the options to 8 bit law,\
    \ and set the sample rate to 8000 Hz. This is the only version of au that Java\
    \ can play.\n\nThere are two ways to play sounds. The simplest uses the play()\
    \ method, taking as its parameter the URL of the file:\n\n```java\nplay(getCodeBase(),\
    \ \"ding.au\");\n```\n\nThat loads and plays the file immediately.\n\nThe alternative\
    \ is to set up an AudioClip object, load the file into there, and then play it\
    \ later in the program:\n\n```java\nAudioClip beeper = getAudioClip(getCodeBase(),\
    \ \"beep.au\");\n```\n\nThis approach gives you more control as you now have access\
    \ to the three AudioClip methods - play(), loop() and stop.\n\n```java\nbeeper.play();\
    \ // plays the clip once\nbeeper.loop(); // plays the clip repeatedly\nbeeper.play();\
    \ // stops both loop or single play\n```\n\nThe example program uses the beep.au\
    \ and ding.au files from the TicTacToe/Audio folder. They are not very special,\
    \ but at least they are there! If you copy them into your Java files folder, the\
    \ URLs will be much simpler to write.\n\nWhen the app runs, you will hear a continuous\
    \ beeping and see two buttons. Clicking \"Press for service\" will load and run\
    \ the \"ding\" file; clicking \"Stop that beeping!\" will give you some peace.\n\
    \n## Sound1.java (Applet)\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\
    import java.awt.applet.*;\n```\n\n```java\npublic class Sound1 extends Applet\
    \ implements ActionListener\n{\n    AudioClip beeper;\n    Button ringer;\n  \
    \  Button quiet;\n\n    public void init() {\n        beeper = getAudioClip(getCodeBase(),\
    \ \"beep.au\");\n        ringer = new Button(\"Press for service\");\n       \
    \ ringer.addActionListener(this);\n        quiet = new Button(\"Stop beeping!\"\
    );\n        quiet.addActionListener(this);\n        add(quiet);\n        beeper.loop();\n\
    \    }\n\n    public void actionPerformed(ActionEvent e) {\n        String butLabel\
    \ = e.getActionCommand();\n        if (butLabel.equals(\"Press for service\"))\n\
    \            play(getCodeBase(), \"ding.au\");\n        if (butLabel.equals(\"\
    Stop beeping!\"))\n            beeper.stop();\n    }\n}\n```\n\nLoad beep.au into\
    \ the beeper AudioClip\n\nSet beeper playing continuously\n\nLoad and play ding.au\
    \ once\n\n> Tip\nIf you are including sounds in applets that will be used on your\
    \ Web pages, keep them as short and the files as small as possible. And if you\
    \ are going to make your visitors wait to hear something, do make sure that it\
    \ is worth the wait!\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_161_0.png)\n"
  mdcn: "\n\n## 简单动画\n\n只要图片较小，且你不想在 Applet 中执行任何其他操作，就可以通过移动图片并使用延迟循环控制其速度来产生简单的动画。对于较大的图像（加载和绘制耗时更长），或者你希望在运行动画的同时进行其他活动，必须使用线程（参见第\
    \ 8 章）。下一个示例展示了一个球在屏幕上弹跳。\n\n## Image2.java (Applet)\n\n```java\nimport java.awt.*;\n\
    import java.applet.*;\n\npublic class Image2 extends Applet {\n    Image ball;\n\
    \    public void init() {\n        ball = getCodeBase(\"ball.gif\");\n    }\n\n\
    \    public void paint(Graphics g) {\n        int y = 100;\n        int move =\
    \ 1;\n        for (int x = 0; x < 500; x++) {\n            g.drawImage(ball, x,\
    \ y, this);\n            if (y > 150) move = -1;\n            else if(y < 50)\
    \ move = 1;\n            y += move;\n            for (int delay = 0; delay < 50000;\
    \ delay++);\n        }\n    }\n}\n```\n\n- 图片不应超过 50x 50 像素\n- 当达到上限和下限时改变方向\n\
    - 使用结束值来控制速度\n- 球的路径（不由程序绘制）\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_155_0.png)\n\
    \n## 图像过滤器\n\n如果你查看 `java.awt.image` 包的文档，你会发现它包含了几个可以用于处理图像的接口和类。接下来的程序深入使用了这些类来创建裁剪和放大的图像。它显示一张图片——我使用了一张地图——当鼠标点击图片的任何地方时，它会显示鼠标周围区域的放大视图。\n\
    \n## 接口\n\n接口充当对象和类之间的桥梁，为它们提供额外的设施。在图像类中共有三个：\n\n- `ImageConsumer` 是在处理完数据后接收新图像数据的对象。我们在这里没有使用它。\n\
    - `ImageObserver` 是监控图像绘制进度的对象，当图像在屏幕外准备时（用于动画）进行监控。在这一点中，与之前的 Image 程序一样，我们使用了一个——尽管这并不明显。`drawImage`\
    \ 参数告诉 Java 使用该图像作为自身的 `ImageObserver`。\n- `ImageProducer` 是图像的数据源。在程序程序中，我们从文件加载一张图像，并将其用作第二张图像的源。\n\
    \n## 类与方法\n\n`ImageFilter` 引入了更改图像对象颜色、大小和比例的方法。\n\n`CropImageFilter` 是 `ImageFilter`\
    \ 的扩展，用于裁剪图像的矩形区域。\n\n```java\nImageFilter imgF = new CropImageFilter(cropX,cropY,420,330);\n\
    ```\n\n这一行代码定义了 `ImageFilter` 对象 `imgF`，它取从 `cropX`, `cropY` 开始的 420 x 330 像素的块。目前尚未定义从何处取该块。\n\
    \n`FilteredImageSource` 建立了源图像与 `ImageFilter` 对象之间的链接，输出取决于 `ImageFilter` 的性质。在这里，该行：\n\
    `ImageProducer imgP = new FilterImageSource(source.getSource(), imgF);`\n裁剪源图像中由\
    \ `imgF` 定义的区域。然后通过以下将 `ImageProducer` 对象转换为标准图像：\n`crop = createImage(imgP);`\n\
    \n## 开始之前...\n\n下面的程序设计用于处理 840 x 660 像素的图像以及 420 x 330 的显示区域——半倍缩放。所有计算都是基于这些值进行的，因此如果你的图像尺寸不同，你将不得不更改数字以适应。\n\
    \n如果你想稍微简化一下，可以省略 `Cropper()` 中的限制检查——这样输出会稍微乱一点，但超出原始图像的限制并无害。\n\n左上角限制：105,83\
    \ (210,165)\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_157_0.png)\n\n330 (660)\n\
    光标位置\n右下角限制：315,247 (630,495)\n420 (840)\n\n(Applet 值) (图像值)\n147\n\n## Image3.java\
    \ (Applet)\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nimport java.awt.image.*;\n\
    import java.awt.applet.*;\n\npublic class Image3 extends Applet implements MouseListener\n\
    {\n    Image source;\n    Image crop;\n    boolean cropped = false;\n\n    public\
