    Clone... opens a new window and runs a copy of the applet there - use this to
    compare the applet at different stages of execution.

    Tag... shows the <APPLET...> tag that hosts the applet.

    Print... copies the display to your printer.

    Close/Quit Shuts down the applet and the viewer.

    The other commands can be ignored for now.'
  - '[PAGE 89]


    # Text display


    If you want to display text, use drawString(). This takes three parameters – the
    text, and the x,y coordinates that fix its position. The x, y coordinates are
    measured in pixels – screen dots. They start at the top left of the window, and
    refer to the bottom left of the text. Accurate positioning is a bit tricky as
    you have to take the size of the font and the length of the text into account.
    e.g.


    ```

    g.drawString("Hello there", 100, 50);

    ```


    This displays "Hello there", starting 100 pixels from the left and 50 pixels down
    the top.


    | 0 | 100 | 200 | 300 | ...WIDTH |

    |---|---|---|---|---|

    | 0 | | | | |

    | 50 | Hello there | | | |

    | 100 | | | | |


    The text can be a literal string (in “quotes”), a String variable or any other
    object or value that can be converted to a String. For example, to display a StringBuffer
    object, you would convert it with the toString() method (in the StringBuffer class):


    ```

    g.drawString(s.toString(), 200, 100);

    ```


    The ''g'' is a Graphics object, and is defined in the line:


    ```

    public void paint(Graphics g)

    ```


    Even() line must have this – you don’t have to call it ‘g’, but you must have
    a Graphics object so that you can call up the drawing methods.


    The next two programs demonstrate positioning, and different types of strings.
    The strings are placed at the corners and centre of the applet. In the first,
    the default font settings are used.'
