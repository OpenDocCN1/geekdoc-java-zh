  - '[PAGE 25]


    # The kit parts


    The SDK consists of a number of tools and supporting files, including:


    # The compiler (javac.exe)


    This converts the text files of your Java programs (the source code) into Java
    byte code. In the Windows version, this, like all the tools, is a DOS program
    and is best run from the MS-DOS prompt. See page 20.


    # The interpreter (java.exe)


    This will take the byte code of a java application – not an applet – and execute
    it. Though you are not developing any serious applications in this book, we will
    be using them to test methods and techniques. It is simpler to test applications
    than applets. See page 20.


    # The appletviewer (appletviewer.exe)


    This is a small window in which you can view an HTML page containing an applet.
    Most of the time you can view applets conveniently in your browser, though you
    will need it for those that use the 1.1 features if your browser cannot handle
    this. See pages 24 and 78.


    # The decompiler (javac.exe)


    This will take a compiled program and convert it into a Java text file. Use this
    when you come across the Java byte code of a finished applet and want to know
    how it was written. If the applet was called ‘finished.class’, then this command
    line would generate the text file: javap finished.class finished.java


    # The documentation


    This is an optional extra, but worth the download time and the disk space – over
    140Mb if you want to get deep into Java.


    # Other files


    Among these are several tools, such as the debugger, for advanced users. When
    you are ready for these, explore them with the help of the documentation.'
- md: "\n## Getting ready\n\nIn Windows, the Java tools are designed to be used from\
    \ the MS-DOS prompt. If you haven't used it before, find it now – it should be\
    \ on the Programs or the Accessories part of the Start menu.\n\nThe next thing\
    \ to do is to create a short batch file. This is a list of DOS commands stored\
    \ in a file with a .BAT extension, and we need a file to do two things for us\
    \ at the start of each session.\n\n- Switch to the folder in which you store your\
    \ Java programs. This could be the top-level JDK folder, but it's better to create\
    \ a new one for them. Mine is called FILES, C:\\JSDK1.4 on my machine.\n- Set\
    \ the PATH. This list of folders that DOS searches when it needs a file to run\
    \ a program - if the file isn't in the current folder. (The PATH was used by early\
    \ versions of Windows; since 98, Windows has recorded routes to programs in another\
    \ way.) The Java tools are stored in the BIN folder, so the PATH must include\
    \ this. if you do not set the PATH, you will have to type the full folders-and-filename\
    \ whenever you want to use a Java tool, e.g. C:\\JSDK1.4\\BIN\\java.\n\nCreate\
    \ this short file in Notepad, adjusting the paths to the Java BIN and the working\
    \ folders to suit your setup.\n\n```\nPATH=C:\\JSDK1.4\\BIN\nCD \\JSDK1.4\\FILES\n\
    ```\n\n- The first line takes the PATH settings (%PATH%) and adds the \\BIN folder\
    \ to it.\n- The second moves you to your working folder.\n\nSave the file in your\
    \ WINDOWS folder as GOJAVA.BAT.\nAt the start of a session, prompt the MS-DOS\
    \ prompt and type 'GOJAVA'.\n\n## Tip\n\n- Accessories\n- Adobe\n- Internet Tools\n\
    - Internet Explorer\n- Microsoft Word\n- Outlook Express\n- Windows Explorer\n\
    - Microsoft Office\n- Java Runtime Environment\n- Java Web Start\n- MS-DOS Prompt\n\
    - Start\n- Visual Basic 6.0\n- HP LaserJet G Series\n\nYou can use lower case\
    \ or capitals in the command lines of a BAT file.\n\n- Programs\n- Favorites\n\
    - Documents\n- Settings\n- Help\n- Bin\n- Log Off Mac...\n- Shut Down...\n\nFrom\
    \ the Start button, go to Programs and select MS-DOS Prompt\n\n- Leave the MS-DOS\
    \ window open or minimize it\n- Sets the PATH to the Java tools\n\n```\nMS-DOS\
    \ Prompt\nMicrosoft Windows 98\n(C) Microsoft Corp. 1981-1998.\nC:\\>dir\nC:\\\
    >set JAVA_HOME=C:\\java\nC:\\>set PATH=%PATH%;C:\\java\\bin\nC:\\>dir\nC:\\>dir\\\
    s>\n```\n\n## 2 Type 'gojava' to run the batch file\n\nYou are in your files,\
    \ ready to start work.\n\n> Take note\nYou could write the PATH line into your\
    \ AUTOEXEC.BAT file. Its commands are performed when you turn on the PC. You will\
    \ still have to run the MS-DOS Prompt and switch folders.\n\n## The first application\n\
    \nA Java application is a free-standing program that can be run – with the help\
    \ of the Java Interpreter – from the MS-DOS Prompt. This first example is about\
    \ as small as they come, but it is enough to show the basic shape of a Java application.\
    \ It will also be enough to test that your system is working correctly.\n\n```java\n\
    class Hello {\n    public static void main(String[] args) {\n        System.out.println(\"\
    Hello from Java\");\n    }\n}\n```\n\nLet's take a line at a time.\n\n`class Hello`\n\
    \nA Java program is a **class**. Every class has a name, and the convention is\
    \ that a class starts with a capital letter.\n\n`public static void main(String[]\
    \ args)`\n\nThis is the first line in all applications. Java applications must\
    \ have a method called main, which is where execution starts. public makes the\
    \ application accessible from outside, i.e. from MS-DOS. We'll come back to this\
    \ and to the rest of that line later.\n\n`System.out.println(\"Hello from Java\"\
    );`\n\nA program consists of a number of statements (instructions) – in this case,\
    \ only one. We use the println method (part of the out object) to display a message\
    \ on the screen. The in the end does a Line Feed to push the cursor to the next\
    \ line. You can use any text like here, but it must be enclosed in \"double quotes\"\
    . Don't miss the semi-colon. Every statement must end with one.\n\nThe {} hold\
    \ blocks of code together. The outer pair enclose the code of the whole program;\
    \ the inner pair enclose the main method – normally more than one line! Indenting\
    \ the code between brackets shows the structure of the program, but is not essential.\n\
    \nSave your text editor or wordprocessor and type in the text exactly as given.\
    \ Correct use of capitals and punctuation is crucial. Save the file as a Text\
    \ document and call it “Hello.java”. Again, notice the capital letter. The filename\
    \ must be the same as the class name and must have the .java extension.\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e948a_29_png)\n\
    \n## 2 Save it as a Text Document\n\n## Which wordprocessor?\n\nWordPad is handy\
    \ for this job. You dont need the facilities of a full-blown wordprocessor, and\
    \ Notepad can handle only small files – you’d be surprised how programs grow!\
    \ WordPad also has the recently used files on its Menu. When you are switching\
    \ between applet and HTML code (see page 22) – it is very handy to pick them off\
    \ here. The first time you save a file, you will probably find that WordPad adds\
