  - "[PAGE 176]\n\n# Controlled loading\n\nIf you have tried to use any large images,\
    \ you will have noticed that Java load slowly and builds up the image in stages.\
    \ This is messy – and unavoidable (Though you can't get around the slowness!)\n\
    \nThe MediaTracker methods will allow you to monitor the progress of incoming\
    \ images, and if you set this inside a thread, the rest of the program can be\
    \ doing something useful while it waits for the images. At the very least, you\
    \ can display a \"Loading\" message, then replace it with the completed image\
    \ in one movement.\n\nHere's the Image3.java 'cropping' applet, rewritten to use\
    \ this loading technique. The new material is picked out in bold in the full listing\
    \ that you can see what to add. This is how it works.\n\n# MediaTracker\n\nThe\
    \ MediaTracker is essentially a list of incoming files with methods for adding\
    \ files to the list, and for checking when they are fully loaded. An instance\
    \ should be declared at class level:\n\nMediaTracker track;\n\nIt is created in\
    \ init(), and – after the downloading has been started by getimage() – the file\
    \ is added to the list.\n\n\n```\ntrack = new MediaTracker(this);\nsource = getimage(getCodeBase(),\
    \ \"map.gif\");\ntrack.addImage(source,0);\n```\n\naddImage(source) takes two\
    \ parameters – the name of the image and an ID number to identify it on the list.\
    \ There is only one image on this list, but it must be numbered, and it may well\
    \ be 0.\n\nWithin the thread's run(), we waitWaitFor(0) to suspend execution until\
    \ the image with the ID 0 is fully loaded. The method throws InterruptedException\
    \ which must be caught – though you don't have to do anything with it.\n\n```\n\
    try {\n  track.waitWaitFor(0);\n} catch (InterruptedException e) { }\n```\n\n\
    166"
