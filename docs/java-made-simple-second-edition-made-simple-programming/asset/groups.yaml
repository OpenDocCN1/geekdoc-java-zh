    # Programming languages


    A computer can only understand one language, and that is machine code. This consists
    of (binary) numbers that the chip translates into instructions, values and memory
    addresses. The instructions are extremely simple; e.g. ''move this value to memory
    at this address'', ''compare these numbers'', ''increment this value''.


    There was a time when people wrote programs in machine code, but no-one in their
    right mind does it now - it''s very hard work and there are better ways to write
    software.


    Most programming languages use words and structures that are (or less) comprehensible
    to humans. The sequences of instructions as a text file - known as the source
    code - which must be converted into machine code for the computer. Until Java,
    there have been two ways of doing this.


    - Some programming languages are compiled. The source code is passed to a compiler
    program, which first checks the text for syntax errors, and if it finds any, stops
    and displays a list of errors. The programmer must sort them all out and produce
    error-free code before the compiler will on to the next stage and turn the text
    into an executable program. This is a block of machine code and can only be run
    on the right sort of machine - normally the sort that it was compiled.


    If you want to run the same program on different platforms, such as Windows PCs,
    Linux computers and Macintoshes, you can in theory-take the source code across
    and recompile it. In practice, the code will normally need to do things in its
    own ways.


    - Source code can also be interpreted. Here, the code is processed by the interpreter
    during execution. Each line is taken in turn, checked for errors, then - if it''s
    error-free - converted to machine code and executed. As with the compiled languages,
    you normally have to rewrite the source code to transfer a program to a different
    platform.


    JavaScript, another new language for use in Web pages, is interpreted. Its code
    can be embedded in Web pages and executed when the page is displayed in a browser.
    If you want to know more about JavaScript, look out for JavaScript Made Simple.


    | Source code | Source code | Source code |

    | --- | --- | --- |

    | Compile/ Interpret | Compile/ Interpret | Compile/ Interpret |

    | Program (Machine code) | Program (Machine code) | Program (Machine code) |

    | Run | Run | Run |


    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_15_0.png)


    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_15_1.png)


    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_15_2.png)


    > Take note

    A Java program can have several separate routines all running at the same time.
    This is known as multi-threading and we will be looking at this aspect in Chapter
    8.


    # The Java Virtual Machine


    With Java, Sun came up with a novel solution to the problem of how allow one program
    to run on different platforms, and that is a neat piece of software called the
    Java Virtual Machine (or JVM). When you pass your Java source code to the Java
    compiler, it turns it into byte code. This is not machine code, but a half-way
    stage. Pass it to any computer that has the JVM installed, and this will read
    the byte code, convert it into machine code and run it.


    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_16_0.png)


    The main advantage of this approach is obvious. You can publish your program over
    the Internet knowing that any computer can run it, as long as it has the JVM.
    As this is built into Netscape and Internet Explorer, anyone using those browsers
    can run the same Java program.


    The main disadvantage is less obvious. Because the JVM has to convert the byte
    code instructions to machine code before they can be executed, the program does
    not run as fast as a compiled program.


    There is also another disadvantage. A program is written specifically for one
    type of computer, can make full use of its facilities, optimising its speed, display,
    and use of peripherals. A program written for any (JVM) computer can use only
    those features that can be implemented on all. Sun Microsystems have got this
    limitation by giving Java the ability to handle ''native code'', i.e. code written
    specifically for one machine – which rather seems to take away the point...


    # JVM, browsers and versions


    Just about every browser developed since 1997 has had a Java Virtual Machine.
    But Java has not stood still, and continues to change. If you get the latest version
    when you download the Java SDK (see page 12), you will be able to test and run
    the programs because you will have the latest version of the JVM. If you publish
    your programs on the Web, people with older browsers will not be able to run those
    programs that use the latest Java features – unless they update their browser
    or their JVM.


    This is a perennial problem for Web developers. Do you use the latest software
    to create the best pages that you can do, or do you restrict yourself to older,
    widely-used technologies so that more people can enjoy your site? You decide.


    | Take note |

    | This book was originally written for Java 1.0 and has since been updated to
    Java 2.0, version 1.4. |


    # Object oriented programming


    Java is an object oriented (OO) language. It''s not the first, but is built on
    the firm foundations of earlier OO languages. The approach is now established
    as the way to do programming. You can - generally produce better, more reliable
    programs faster with an object oriented language.


    People write big books about the theory and practice of object oriented programming.
    I''m going to spend a couple of pages on it, which should be enough to give you
    a working grasp of its principles. We''ll come back to it from time to time, as
    necessary.


    # Traditional v. OO languages


    First, let''s look at the difference between a ''traditional'' programming language
    and an object oriented one. Think of a clickable button on a Windows screen. If
    you wanted to create this in a traditional language, you would have to write some
    code to draw the button on the screen, then write some more to track the mouse
    movement (drawing the pointer) and watch for the click, and some more to draw
    the button as it is clicked, and at last - you can write the code to do the job
    called up by the click. Oh yes, and you''ll have to do most of it again next time
    you want another clickable button!


    Java, like most new object oriented languages, knows about buttons. If you want
    a clickable button in a Java program, all you have to do is specify where to put
    it, what to write on it, and what to do when it is clicked. In an object oriented
    language, you have ready-made, reusable blocks of code - the objects.


    # The nature of objects


    To understand the characteristics of objects, let''s take an analogy from the
    real world. Think of a car. It has certain characteristics including its shape,
    colour, and speed and direction (when moving). In OO jargon, these are variables,
    which are set at the time of creation, and others which can be changed at any
    time.


    With simple variables, you use expressions like this to change their values:


    speed = 90


    When working with objects, you use methods – built-in routines – to change the
    values held by its variables. This is a safety feature, ensuring that values are
    within acceptable ranges and that in changing one value do have unwanted effects
    on other aspects of the object. The method for changing the colour might look
    like this:


    mycar.setColor(red);


    In the jargon, we are sending a message to the setColor method of the mycar object,
    with the parameter object.


    To go back to the analogy, if you want the car sprayed red, you could do it yourself,
    but you get a better result by taking it into a bodyshop. If you want to read
    the stockmarket reports in the paper and talk to your broker on the phone while
    you are travelling by car, you''d be safer with a chauffeur.


    In OO jargon, this is called encapsulation. An object''s variables are protected
    from direct contact with the outside world and can only be changed through the
    object''s methods.


    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_19_0.png)


    An object consists of variables and methods. Some methods are used for changing
    variables, others control its activities.

    '
