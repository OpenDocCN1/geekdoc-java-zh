    The score is 29\n\nWhich definitely looks better – and remember to include a space\
    \ at the end of the first bit of text, to separate it from the following item.\n\
    \n# Combined outputs\n\nYou can combine any number of values, variables and literal\
    \ strings to create one output string, using the + operator, e.g.\n\n```\nSystem.out.println(\"\
    The score is \"+ score);\n```\n\nThis also outputs:\nThe score is 29\n\nAs a general\
    \ rule, the combined string approach works best where there are a limited number\
    \ of smallish items in the output line. The strings themselves can be thousands\
    \ of characters long, but beyond a certain point, the combined expression becomes\
    \ difficult to type correctly and to read, and it is easier to break the output\
    \ down lines. Clarity is more important than compactness!\n\nThe next example\
    \ demonstrates the combined approach, and also uses a few data types. It is an\
    \ extension of the last, saving a little time and typing by copying its code as\
    \ a basis for this.\n\n# PrintVars.java (application)\n\n```\nclass PrintVars\
    \ {\n    public static void main(String[] args) {\n        int number;\n     \
    \   long bigNum;\n        double decimalNum;\n        char letter;\n        boolean\
    \ reply;\n\n        number = -100000;\n        bigNum = 2000000;\n        decimalNum\
    \ = 12345.67;\n        letter = 'A';\n        reply = true;\n\n        System.out.println(\"\
    The int holds \" + number);\n        System.out.println(\"The long holds \" +\
    \ bigNum);\n        System.out.println(\"The double holds \" + decimalNum);\n\
    \        System.out.println(\"The char holds \" + letter);\n        System.out.println(\"\
    The boolean holds \" + reply);\n    }\n}\n```\n\n| The file should be saved as\
    \ PrintVars.java | Assign values in the declarations if you use | Don't forget\
    \ the space, inside the end of the text |\n| Your output should look like this:\
    \ The int holds -100000 The long holds 2000000 The double holds 12345.67 The char\
    \ holds A The boolean holds true | |\n\n# Inputs\n\nThere is, alas, no simple\
    \ equivalent to println for getting input into a Java application. In practice,\
    \ this does not matter if your aim is to write applets – there are (relatively)\
    \ easy ways of getting input into applets! (See page 108.) However, you should\
    \ at least know how to read a single character from the keyboard – you'll have\
    \ to do this in a couple of examples later in the book. This illustrates some\
    \ fundamental points about the Java system.\n\n# System.in.read()\n\nThis method\
    \ reads the keyboard, and is used like this:\na = System.in.read();\n\nNotice\
    \ that read() alone is not sufficient – you have to say where the data is to read.\
    \ In this case it is from the standard input stream, System.in. Other streams\
    \ include disk files and the ports. The keyboard is a buffered stream – the data\
    \ is initially stored in a special block of memory. It is transferred from there\
    \ to the program when the buffer is full, or when the [Enter] key is pressed.\
    \ This means that you cannot pick up a single keystroke directly.\n\n# Typecasting\n\
    \nread() returns an int value – not a char. Java is a 32-bit system, which means\
    \ that it normally handles data in 32-bit chunks – the size of an int. Converting\
    \ this to a char presents no problems. You can convert data from one type to another\
    \ by typecasting. To do this, you write the required type, in brackets, in front\
    \ of the data, e.g:\nletter = (char) input_data;\nIn the example program, the\
    \ data is typecast as it is read, in the line:\nc = (char)System.in.read();\n\n\
    # Exceptions\n\nJava is safety conscious. Any method which may produce a fatal\
    \ error must be protected by an error-trapping. In the Java jargon, this is known\
