    handy to pick them off here.


    The first time you save a file, you will probably find that WordPad adds a .txt
    extension to its name – Word and Notepad will do the same. Go into Windows Explorer
    and edit the name, then right-click on your new .java file, select Open with and
    specify WordPad (whichever wordprocessor you use) as the program to use to open
    .java files. When you save files in future, it will not try to add .txt to the
    name.'
