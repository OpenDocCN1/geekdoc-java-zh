    # Text Components


    TextField and TextArea are both sub-classes of the Text Component class. This
    doesn''t just mean that they have a great deal in common sub-classes contain the
    methods of their super-classes (the ones that they are derived from) as well as
    their own ones. So, when you are looking through the documentation for methods
    to use a TextField or TextArea, step back up the class hierarchy, and have a look
    at the Text Component class as well.


    When setting up a new TextField, you can use any of these constructors:


    +   new TextField() which must be followed somewhere by a setColor() method to
    fix its size;


    +   new TextField(int) where the int value sets its width;


    +   new TextField(String) creates a field displaying the String;


    +   new TextField(String, intWidth) displays the String, but sets the width according
    to the int value.


    TextAreas have a similar set of constructors, with two ints, setting the size
    in rows and columns. There is also a fifth:


    +   new TextArea(String, intRows, intCols, intScroll) where intScroll controls
    the scrollbars: 1 turns off the vertical scroll bar; 2 turns off the horizontal
    and 3 turns off both scrollbars.


    The first example shows a typical use for these two components. The TextField
    collects a short item from the user; the TextArea collects a longer, multi-line
    entry.


    Notice the prompts - you must tell users what you want to enter. The email TextField
    is accompanied by a Label. For the details, the prompt has been written into the
    TextArea, then selected so that it can be easily deleted and replaced. Either
    approach can be used for either type.'
