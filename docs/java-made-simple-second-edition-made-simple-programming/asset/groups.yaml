    \ test.bat.\n\n# Colours\n\nIn a computer system colours are made up of red, green\
    \ and blue.![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_94_0.png)\n\nThis simple pattern\
    \ applies where lights are fully on or off. In practice, each colour can be present\
    \ at a range of intensities, so that instead of, say red and green making yellow,\
    \ they will produce anything from dark brown through to pale rose. The simplest\
    \ devices define several ways to handle colour-setting. The intensity of each\
