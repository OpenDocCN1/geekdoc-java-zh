- md: "\n# Polygons\n\nYou can use drawPolygon() and fillPolygon() to produce anything\
    \ from triangles to complex regular and irregular shapes with any number of sides.\
    \ The shapes are defined by the co-ordinates of their vertices, which are written\
    \ into a pair of matching arrays.\n\nIf you want to get a reasonably accurate\
    \ image, you will find it useful to draw it on squared paper and read off the\
    \ co-ordinates.\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_140_0.png)\n\nThe\
    \ next example draws a hexagon. It starts by declaring the arrays, at the class\
    \ level:\n\n```\nint[ ] x = new int[6];    // horizontal co-ordinates\nint[ ]\
    \ y = new int[6];    // vertical co-coordinates\n```\n\nNext, it assigns values\
    \ to define the points. This can be done in init() or start(). The code will be\
    \ more readable if you write pairs of statements on one line – ending each with\
    \ a semi-colon.\n\nx[0] = 100; y[0] = 145;\n\nRemember that in a 6-element array,\
    \ the subscripts run from 0 to 5.\n\nThe drawing methods should be called from\
    \ within paint(). They take as parameters the names of the two arrays and the\
    \ number of points.\ng.drawPolygon(x,y,6)\n\nNote that the arrays are identified\
    \ simply by their names – the [] brackets have no place here!\n\n# Polygon.java\
    \ (Applet)\n\n```\nimport java.awt.*;\nimport java.applet.*;\n\npublic class Polygon\
    \ extends Applet {\n    int[] x = new int[6];\n    int[] y = new int[6];\n\n \
    \   public void init() {\n        x[0] = 100; y[0] = 145;\n        x[1] = 200;\
    \ y[1] = 145;\n        x[2] = 250; y[2] = 100;\n        x[3] = 200; y[3] = 186;\n\
    \        x[4] = 100; y[4] = 186;\n        x[5] = 50; y[5] = 100;\n    }\n\n  \
    \  public void paint(Graphics g) {\n        g.drawPolygon(x,y,6);\n    }\n}\n\
    ```\n\nThe final line is drawn back to the start position – you do not need to\
    \ repeat its co-ordinates.\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_141_0.png)\n\
    \n# Take note\n\nThe drawPolyline() method is used in the same way as drawPolygon().\
    \ Its lines are connected, but do not form a closed shape.\n\n# Arcs\n\nThe arc\
    \ methods are developed from those that draw ovals. They have two additional parameters\
    \ – one to fix the start of the arc, and one for size of the angle. For example:\n\
    g.fillArc(10,100,100,100,0,90);\n\nThis draws a segment of a circle by 100 pixels,\
    \ with the top left corner of its bounding rectangle at 10,10. The segment starts\
    \ at 3 o'clock and goes round to 12 o'clock. Two points about the angles:\n\n\
    - Arc angles are given in degrees (whole degrees, the parameters are ints), rather\
    \ than the radians that are used in sine and cosine calculations.\n- 0° is at\
    \ 3 o'clock, and angles are measured counter-clockwise using a negative value\
    \ if you want to swing clockwise.\n\nHere are some drawArc() and fillArc() statements\
    \ at work:\n\n# Arcs.java (Applet)\n\n```\nimport java.awt.*;\nimport java.applet.*;\n\
    \npublic class Arcs extends Applet {\n    public void paint(Graphics g) {\n  \
    \      g.fillArc(10,100,100,100,0,90);\n        g.drawArc(10,100,100,100,0,180);\n\
    \        g.fillArc(12,100,100,90,-60);\n        g.drawArc(120,120,100,50,270,-210);\n\
    \    }\n}\n```\n\nThese two work within the same circle boundaries\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_142_0.png)\n\
    \nStart at the top and fill to 60° right\n\n```\nThis line will produce the same\
    \ result:\ng.drawArc(120,120,100,50,60,210);\n```\n\n# Pie charts\n\nThe next\
    \ program again demonstrates arcs, but is also an example of working with arrays\
    \ and shows another way to define colours. It takes a set of figures and displays\
    \ them as a pie chart.\n\n# The arrays\n\nThere are three arrays, each of six\
    \ elements (or as many as you like):\n\n```\ndouble[ ] value = new double[6];\
    \ // the figures to be charted\nint[ ] slice = new int[6]; // the degrees in each\
    \ slice\nColor[ ] col = new Color[6]; // the colours of the slices\n```\n\nvalue\
    \ must be a double or float type because the calculations performed on its contents.\
    \ Numbers are assigned to the value in int(), and are then totalled, running them\
    \ through a loop:\nfor (int loop = 0; loop < 6; loop++)\ntotal += value[loop];\n\
    \nIf we divide each value by total, it gives a fraction of the whole. Multiplying\
    \ this by 360 converts it to degrees.\nfor (int loop = 0; loop < 6; loop++)\n\
    slice[loop] = (int)(value[loop]/total*360);\n\n# Take note\n\nThe program could\
    \ be rewritten to take the value figures as parameters, or from the user through\
    \ a TextField.\n\n# Predefined Colors\n\nIn the documentation for java.awt.Color\
    \ you will find a set of predefined values. They are handy in situations like\
    \ this where you want a variety of colours but aren't bothered about the exact\
    \ shades. To use them, write ‘Color’ followed by the name, e.g.\n```\ncol[0] =\
    \ Color.red;\n```\n\nThe other names are black, blue, cyan, darkGray, green, lightGray,\
    \ magenta, orange, pink and yellow.\n\n# PieCharts.java (Applet)\n\n```java\n\
    import java.awt.*;\nimport java.applet.*;\n\npublic class PieCharts extends Applet\
    \ {\n    double[] value = new double[6];\n    int[] slice = new int[6];\n    Color[]\
    \ col = new Color[6];\n\n    public void init() {\n        double total = 0;\n\
    \        value[0] = 1000;\n        value[1] = 500;\n        value[2] = 750;\n\
    \        value[3] = 1200;\n        value[4] = 300;\n        value[5] = 1650;\n\
    \        for (int loop = 0; loop < 6; loop++) {\n            total += value[loop];\n\
    \        }\n        for (int loop = 0; loop < 6; loop++) {\n            slice[loop]\
    \ = (int)(value[loop]/total*360);\n        }\n        col[0] = Color.red;\n  \
    \      col[1] = Color.green;\n        col[2] = Color.blue;\n        col[3] = Color.gray;\n\
    \        col[4] = Color.magenta;\n        col[5] = Color.yellow;\n    }\n\n  \
    \  public void paint(Graphics g) {\n        int start = 0;\n        for (int loop\
    \ = 0; loop < 6; loop++) {\n            g.setColor(col[loop]);\n            g.fillArc(20,20,200,200,start,slice[loop]);\n\
    \            start += slice[loop];\n        }\n    }\n}\n```\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_144_0.png)\n\
    \n> slice[loop] contains the size adding this to start gives the angle for the\
    \ next slice\n\n> 'gray' not 'grey'\n\n# Painting on a Canvas\n\nThe next example\
    \ ties together a number of points covered in the last three chapters. It is a\
    \ simple ‘paint’ program – and I mean simple! The aim is to demonstrate ideas,\
    \ not to create a functional graphics application. It has a palette of four colours\
    \ and a choice of three tools with which you can draw one item at a time. To make\
    \ it a working graphics you need to store each item after drawing – either by\
    \ saving the canvas image (difficult) or by adding them to an array of drawing\
    \ instructions (complicated).\n\nThe applet uses a panel layout, to the same pattern\
    \ as the one in Layout3.java (page 122). The tools panel contains labelled buttons\
    \ for the drawing modes and colours, arranged in a GridLayout. The centre is taken\
    \ by a redefined Canvas drawarea. Let’s start with that.\n\n```\nclass MyCanvas\
    \ extends Canvas\n```\n\nThis creates a new class, MyCanvas, which is a sub-class\
    \ of the standard Canvas, and so shares all its properties, fields and methods.\
    \ It starts with a type of method that we have not used so far:\n\n```\npublic\
    \ MyCanvas()\n```\n\nThis is a constructor, a method called when an object is\
    \ created by lines like this:\n\n```\ndrawarea = new MyCanvas();\n```\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_145_0.png)\n\
    \nThis method must be present, even if left blank, but it is also the place where\
    \ you write the code if you want to do anything when the object is set up. Here\
    \ we are adding the Mouse and MouseMotion Listeners.\n\nWithin MyCanvas are the\
    \ mouse methods and paint(), which must be there because they work on the drawarea\
    \ object – if they were within the main program they would work on the overall\
    \ applet window.\n\nToolPanel is similarly a new sub-class of Panel, but notice\
    \ the difference in the line that creates it, in init():\n\n```\ntools = new ToolPanel(drawarea);\n\
    ```\n\n```\npublic ToolPanel(MyCanvas target)\n```\n\nThe panel is linked to the\
    \ drawarea, allowing values to be passed between them.\n\nThe rest of the program\
    \ should need little explanation, as most of the techniques have been seen before.\n\
    \nButton clicks are picked by actionPerformed() and either set the currentTool\
    \ value (0 = Line, 1 = Rectangle, 2 = Oval) or define the currentColor.\n\nmousePressed()\
