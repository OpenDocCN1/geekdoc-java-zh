    \n在向布局中添加组件时，你必须使用关键字“North”、“\"South”、“\"East\" 和 \"Center\"来指定它们的位置。这会将标签为“North”的按钮放在布局的顶部：\n\
    `add(new Button(\"North\"), \"North\");`\n\n边框布局最多可以容纳五个对象，但不必非取这么多。一个只使用“North”和“Center”的布局将给你一个大的主区域和一个横跨顶部的窄组件。\n\
