    # The Applet methods


    All applets are based on the Applet class, which contains a whole batch of ready-made
    methods. Some of these are run automatically in response to system activity. The
    first example in this chapter looks at these key methods:


    init() is run when the applet is first loaded, and only then. If you have variables
    that need to be given initial values, this is where it should be done.


    start() is run when the applet is loaded, and again whenever the applet''s page
    is reloaded. If you want to restart an action when someone returns to a page,
    do it from this method.


    stop() is run when the browser is shut down or another page is opened.


    paint() redraws the display when the page is loaded or reloaded.


    The definition of the Applet class includes these methods, but as blanks like
    this:


