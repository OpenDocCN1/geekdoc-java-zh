    # # Checkboxes and CheckboxGroups


    Whether used individually or within CheckboxGroups, Checkboxes are handled in
    much in the same way. The main difference lies in the choices they present to
    the user.


    +   - Individual Checkboxes can be set on or off, irrespective of the state of
    any others on the page.


    +   - When used in CheckboxGroups, only one Checkbox in the group can be turned
    one at any time.


    You can see this in the next example program, which allows the user to select
    the font – from a choice of three – and turn Bold and Italics. The applet will
    look like this.


    Individual Checkboxes CheckboxGroups


    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_114_0.png)


    # # Creating Checkboxes


    Checkboxes must exist as objects at program level, as they will be added to the
    window in the init() or start() method, and their state changed elsewhere. It
    is simplest to declare and define them at the same time; for example, this creates
    the Bold Checkbox:


    ```

    Checkbox checkBox = new Checkbox("Bold",false);

    ```


    Notice that we are using two parameters here. The first sets label, and the second
    sets the initial state – true for checked (on) or false for unchecked. You can
    omit the state parameter. If you do, the Checkbox is initially off. It can it
    therefore be omitted in this case.


    104'
  - '[PAGE 115]


    The Checkbox can be added to the window in the init() method:


    ```

    add(fontBold);

    fontBold.addItemListener(this);

    ```


    We need an ItemListener to pick up Checkbox events, and we''ll

    back to that shortly.


    When the Checkbox is part of a group, the CheckboxGroup must be

    created first.


    ```

    CheckboxGroup fontName= new CheckboxGroup();

    Checkbox sans = new Checkbox("Sans Serif", fontName, true);

    ```


    And you can see why the CheckboxGroup''s name is the second

    parameter used in setting up the Checkbox. The true/false state is

    now the third parameter, and, of course – only one of the group can

    set to true.


    # Checking Checkboxes


    Checkboxes are handled through the ItemListener class. This is

    using an ActionListener, but with subtle variations. A click on a

    Checkbox can be picked up by the itemStateChanged(ItemEvent e)

    method, and we can work out which Checkbox it was by reading its

    label with getItem().


    String option = (String) e.getItem();

    and testing to see what we got:


    ```

    if (option.equals("Bold"))"

    ```


    What happens now depends on whether it is an individual Checkbox

    one in a CheckboxGroup.


    With an individual Checkbox, a click will toggle between on and off.

    Its code likewise can toggle a variable between two states.


    ```

    if (bold == 1)

    bold = 0;

    else bold = 1;

    ```


    The variable is used to carry the selection information to wherever it

    is needed in the program. In this case, it is used in the setFont() line.'
