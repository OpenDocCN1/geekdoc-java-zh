  mdcn: "\n# 对象与类\n\n当制造商制造汽车时，他们并不是从零开始设计每一辆车。相反，他们有一份蓝图，并按照它执行——根据需要设置颜色、内饰、引擎尺寸和其他变量。\n\
    \n在面向对象的术语中，蓝图被称为**类**（class），而**对象**（object）是类的一个实例。创建新对象的过程被称为**实例化**（instantiation）。（我从未说过这些术语很优雅。）类和对象之间的区别变得有些模糊，原因如下。\n\
    \n# 继承\n\n让我们来看看汽车制造商的设计工作室。他们新车型将有几个版本 —— 轿车、掀背车和旅行车，每个版本都有 2 门或 4 门供选择。他们为每个版本绘制了一张新的蓝图。他们从一张涵盖了共同元素的蓝图开始，然后对其进行调整以产出基础的轿车、掀背车和旅行车，最后对其中每一个开发出\
    \ 2 门和 4 门版本。从第一个之后，每个蓝图都继承了其前身的所有特征。它可能会对特征进行微调，并添加自己的额外功能。\n\n关于对象和类的继承示例，让我们看看为汽车修理厂开发一个简单数据库程序。程序员们定义了一个简单的记录结构，用于存储每个客户的姓名、地址、电话和汽车型号，并带有收集这些详情的方法。这个类被称为\
    \ `Owner`，可以用于创建存储客户数据的对象。这些可能被称为 `Owner1`、`Owner2`、`Owner3` 等。\n\n如果他们想照顾拥有第二辆车的客户，他们不需要编写另一个定义，而是创建一个\
    \ `Owner` 类的新对象，为第二辆车留出空间。这可能被称为 `RichOwner`，它变成了一个类，因为它可以创建新对象。\n\n在术语中，`RichOwner`\
    \ 是 `Owner` 的子类（`Owner` 是 `RichOwner` 的父类）。两者之间的连接在创建后仍然存在。如果对 `Owner` 类进行修改以添加维修日期，那么该新字段会自动添加到\
    \ `RichOwner` 类中。\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_21_0.png)\n\n| |\
    \ | |\n| :--- | :--- | :--- |\n| class | OWNER | |\n| OWNER1 | | |\n| OWNER2 |\
    \ | |\n| OWNER3 | | |\n| objects | RICHOWNER | |\n| class | RICHOWNER1 | |\n|\
    \ class | RICHOWNER2 | |\n\n# 多态\n\n如果面向对象的程序员们在编写那些汽车的蓝图，他们可以为每个版本生成一个新蓝图（类）；或者将所有变体整合在一个主蓝图中。这就是**多态**（polymorphism）——以几种不同形式创建新对象的能力。例如，以下所有都是有效的：\n\
    \n```\nnew rect = Rectangle()\nnew rect = Rectangle(50,100)\nnew rect = Rectangle(50,100,25,25)\n\
    ```\n\n第一个创建一个高和宽均为 0 像素的矩形，位于屏幕左上角 —— 它准备好在以后增长和移动。第二个创建一个 50 x 100 像素的矩形，位于左上角。第三个创建一个\
    \ 50 x 100 像素的矩形，位于左上角下方向右偏移 25 像素处。\n\n在所有情况下，消息都是相同的 —— 只有参数的数量发生了变化。技术上，这是通过具有相同名称但不同定义的多个方法实现的。实际结果是为你提供了更大的灵活性。\n\
