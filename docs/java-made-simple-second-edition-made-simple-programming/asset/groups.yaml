    # Testing values


    Program flow refers to the order in which a program''s instructions are carried
    out. So far, all the example programs have run straight through a sequence, then
    stopped. There are few practical uses for such simple programs. The addition of
    loops and branches makes programs far more useful and powerful. In a loop, a set
    of instructions will be repeated a fixed number of times, or until a condition
    is met. Branches take the flow off different routes, depending upon the values
    held by variables. Before we go any further, let''s see how we test values.


    # Relational operators


    These are used to compare variables with values or with the contents of other
    variables. There are six relational operators:


    +   - == equal to less than <= less or equal to

    - != equal to > greater >= greater or equal to


    Notice the equality test uses a double equals sign ''=''. The single sign ''=''
    is used for assigning values. Typical test expressions are:


    ```

    (x 99)

    (newNum != oldNum)

    ```


    Tests are enclosed in brackets, and return a Boolean value – true or false. You
    don''t normally need to worry about this – just use the test – but occasionally
    it is useful to store the result of the test in a variable, for later reference
    in the program, e.g.


    ```

    boolean result; // create a boolean variable

    ...

    result = (newNum > oldNum) // store the test result

    ...

    if (result == true) // same as if (newNum > oldNum)

    ```


    # Logical operators


    The relational operators test against one value at a time, but you often want
    to check if a variable falls into a range of values, or is one of several possibilities.
    This is where the logical operators come into play.


