    </HEAD>\n<BODY>\n<P>Output:</P>\n<APPLET CODE=\"StartStop.class\" WIDTH=500 HEIGHT=200></APPLET>\n\
    </BODY>\n</HTML>\n```\n\n# AppletViewer\n\n在你编译了 applet 并编写了 HTML 文件后，通过 AppletViewer\
    \ 查看它![](img/e0aa6bf61b552cacf6e870d5e948)\n\n你会注意到 Stop 会清除显示，当给出 Start 时，显示会恢复。\n\
    \n# 文本显示\n\n如果你想显示文本，使用 `drawString()`。它接受三个参数：文本以及确定其位置的 x,y 坐标。x,y 坐标以像素（屏幕点）为单位。它们从文本的左上角开始。精确定位有点复杂，因为你需要考虑字体的大小和文本的长度。例如：\n\
    \n```java\ng.drawString(\"Hello there\", 100, 50);\n```\n\n这显示 \"Hello there\"\
    ，距离左侧 100 像素，距离顶部 50 像素。\n\n| 0 | 100 | 200 | 300 | ...WIDTH |\n|---|---|---|---|---|\n\
    | 0 | | | | |\n| 50 | | | | |\n| 100 | | | | |\n\n文本可以是字面量字符串（在引号内）、String 变量或任何可以转换为字符串的对象或值。例如，为了显示一个\
    \ StringBuffer 对象，你需要使用 `toString()` 方法（在 StringBuffer 类中）：\n\n```java\ng.drawString(s.toString(),\
    \ 200, 100);\n```\n\n'g' 是一个 Graphics 对象，定义在这一行中：\n\n```java\npublic void paint(Graphics\
    \ g)\n```\n\n这一行必须存在——你不需要称它为 'g'，但你必须有一个 Graphics 对象以便调用绘图方法。\n\n接下来两个程序演示了定位以及不同类型的字符串。字符串被放置在\
    \ applet 的角落和中心。在第一个中，使用了默认字体设置。\n\n"
