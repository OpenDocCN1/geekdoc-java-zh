    \ if you don't want to bring the rest of the applet to a halt.\n\nIf you have\
    \ any time-consuming tasks to do – such as downloading images or other files –\
    \ handling them through a Thread will allow you to do something else to keep your\
    \ viewers happy while they wait.\n\n## Threaded applets\n\nThe simplest way to\
    \ include a thread in a program is to implement the Runnable interface. This handles\
    \ the `run()` method, which holds all the thread's code. The addition of `implements\
    \ Runnable` to the class line brings in the interface:\n\n```java\npublic class\
    \ Counter implements Applet, Runnable\n```\n\nThe thread is declared at class\
    \ level, but set to null. When `start()` is executed, an instance is created and\
    \ the thread's `start()` method is called. This calls `run()`, to execute the\
    \ thread code.\n\n```java\nThread timer = null;\n```\n\n```java\ntimer = new Thread(this);\n\
    timer.start();\n```\n\nIn `run()`, there is a first check to see if the thread\
    \ is active – if the user leaves and returns to the applet, `start()` will be\
    \ executed, and you do not want to create a second instance.\n\n```java\nwhile\
    \ (timer != null)\n```\n\nIf it is, the thread waits for a second, updates a counter\
    \ and repaints the display.\n\n```java\ntry {\n  Thread.sleep(1000);\n} catch\
    \ (InterruptedException e){}\ncount++;\nrepaint();\n```\n\nThe `sleep()` method\
    \ works in milliseconds, so 1000 = 1 second. This feature of the Thread class\
    \ is invaluable for animation - it only suspends the thread, leaving the rest\
    \ of the program active.\n\nIn `stop()`, the thread is turned off:\n\n```java\n\
    timer = null;\n```\n\nThis is that it also stops execution when the user leaves\
    \ the applet. And of course, it is restarted by `start()`. This is not essential\
    \ in this case - the thread could be left running without interfering with anything\
    \ else, or coming to any harm.\n\n`mouseDragged()` is nothing to do with the thread.\
    \ It is there simply show that the rest of the program can be doing active things\
    \ while the thread is running. One lets you drag a string around the screen.\n\
    \n## Counter.java (applet)\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\
    import java.applet.*;\n\npublic class Counter extends Applet implements Runnable,\
    \ MouseEventListener {\n    int x1 = 50;\n    int y1 = 50;\n    Thread timer =\
    \ null;\n    int count = 0;\n\n    public void init() {\n        addMouseMotionListener(this);\n\
    \    }\n\n    public void start() {\n        if(timer == null) {\n           \
    \ timer = new Thread(this);\n            timer.start();\n        }\n    }\n}\n\
    ```\n\nthis links this thread to the Runnable applet\n\n```java\npublic void stop()\
    \ {\n    timer = null;\n}\n\npublic void destroy() {\n    removeMouseMotionListener(this);\n\
    }\n\npublic void run() {\n    while (timer != null) {\n        try {\n       \
    \     Thread.sleep(1000);\n        } catch (ruptedException e) {\n           \
    \ count++;\n        }\n        repaint();\n    }\n}\n\npublic void mouseDragged(MouseEvent\
    \ e) {\n    x1 = e.getX();\n    y1 = e.getY();\n    repaint();\n}\n\npublic void\
    \ mouseMoved(MouseEvent e) { }\n\npublic void paint(Graphics g) {\n    g.setFont(new\
    \ Font(\"SansSerif\", Font.BOLD, 24));\n    g.drawString(\"Count = \" + count,\
    \ 10, 20);\n    g.drawString(\"Drag me\", x1, y1);\n}\n```\n\nThreads are fully\
    \ integrated into programs - count is a program variable.\n\nYou must catch the\
    \ `InterruptedException` thrown by `sleep`.\n\n`repaint()` is also called from\
    \ `run()`.\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_172_0.png)\n\nThe count\
    \ display is updated every second, no matter what else happens. Dragging the text\
