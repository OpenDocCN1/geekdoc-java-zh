    \n## BorderLayout()\n\n它可以容纳五个组件——四个在边缘，一个在中心。组件会根据需要扩展（或缩小）以填充分配给它们的空间，你无法控制这一点。在下面的示例中，所有组件都是按钮，因为它们清楚地显示了尺寸缩放，但它们可以是任何其他\
    \ GUI 对象。\n\n定义边框布局最简单的方法是使用这一行：\n`setLayout(new BorderLayout());`\n\n如果需要，可以使用此变体设置组件之间的水平和垂直间隙：\n\
