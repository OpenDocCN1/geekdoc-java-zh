    This method must be present, even if left blank, but it is also the place where
    you write the code if you want to do anything when the object is set up. Here
    we are adding the Mouse and MouseMotion Listeners.


    Within MyCanvas are the mouse methods and paint(), which must be there because
    they work on the draw drawarea object – if they were within the main program they
    would work on the overall applet window.


    ToolPanel is similarly a new sub-class of Panel, but notice the difference in
    the line that creates it, in init():


    ```

    tools = new ToolPanel(drawarea);

    ```


    ```

    public ToolPanel(MyCanvas target)

    ```


    The panel is linked to the drawarea, allowing values to be passed between them.


    The rest of the program should need little explanation, as most of the techniques
    have been seen before.


    Button clicks are picked by actionPerformed() and either set the currentTool value
    (0 = Line, 1 = Rectangle, 2 = Oval) or define the currentColor.


    mousePressed() and mouseDragged() are almost identical to those in Mouse1.java
    (page 88) – copy and paste from there. When the button is first pressed, the start
    co-ordinates are collected into mx and my. As it is dragged, the end co-ordinates
    are passed into mx1 and my1, the line, rectangle or oval is then drawn by a call
    to paint().


    In paint(), the currentTool value is used to select the drawing action. With drawLine(mx,
    my, mx1, my1 co-ordinates are used directly to define the line);


    ```

    if (currentTool == 0)

    g.drawLine(mx,my,mx1,my1);

    ```


    fillRect() and fillOval() need the width and height values. These can be calculated
    from the start and end co-ordinates.


    ```

    else if (currentTool == 1)

    g.fillRect(mx,my,mx1-mx,my1-my);

    ```


