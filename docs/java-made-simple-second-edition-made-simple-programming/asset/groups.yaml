    \   public void horizontal(Graphics g) {\n        int x;\n        for (x = 50;\
    \ x < 450; x = x + 50)\n            g.drawString(\"X = \" + x, x, 10);\n    }\n\
    }\n```\n\nNote the new methods take the same Graphics parameter as paint(). This\
    \ allows them to use the drawString() method, and provides a route for passing\
    \ information between the new methods and paint(). The \"Y = ...\" items are drawn\
    \ on it.\n\n# Applet parameters\n\nYou can pass values from the HTML page to your\
    \ applet. The great thing about this is that it allows you to get different effects\
    \ from the same applet – having to rewrite and recompile it. In the simple example\
    \ given here, the applet slides a message across the window, with both the message\
    \ and the slide controlled by values set in the HTML page.\n\nValues are passed\
    \ through parameters. These are written into the HTML page using `<PARAM>` tags,\
    \ and read into the applet with the getParameter() method.\n\n# Planning\n\nAs\
    \ both the HTML page and the Java program must be complete and correct before\
    \ the applet can be tested, it doesn't make any difference which one do. Before\
    \ you start to write either, you should decide which values will be passed, and\
    \ what names you give them. In fact, with any program – not just those that use\
    \ parameters – you should start by planning on paper. Any time that you spend\
    \ working out the screen layout and thinking through the sequence of events, is\
    \ well spent. When you sit down to the keyboard to type in the code, you should\
    \ have a written outline of the program’s structure and a list of the main variables\
    \ and parameters that will use.\n\nHere's the plan for this applet, where the\
    \ aim is to move a message across the screen, starting in the centre and ending\
    \ on the left edge.\n\n- 1 Get the text (name = message) and the delay limit (name\
    \ = limit, will need temp String variable) from the HTML code;\n- 2 Write the\
    \ message\n- 3 Loop from 200 down to 0 (loop variable = x)\n- 3.1 delay by running\
    \ an empty loop – size by delay limit\n- 3.2 draw a filled rectangle to wipe the\
    \ message\n- 3.3 rewrite the message\n\nNote: the text written at 2 is erased\
    \ immediately. Could miss out this line.\n\n# <PARAM...>\n\nThe tags are written\
    \ within the `<APPLET>` block, and take this form:\n`<PARAM NAME = param_name\
    \ VALUE = param_value>`\n\n- The param_name identifies it – you can have any number\
    \ of parameters in your applet.\n- The param_value can be text or a number. If\
    \ the text has more than one word it must be enclosed in \"quotes\". Miss them\
    \ out and only the first word will be picked up by the browser, while the AppletViewer\
    \ won't run at all!\n\nThis HTML code defines two parameters – message and limit.\n\
    \n```html\n<HTML>\n<HEAD>\n<TITLE> Applet tester </TITLE>\n</HEAD>\n<body>\n<P>Applet\
    \ output:</P>\n<P><APPLET CODE=\"MoveText.class\" WIDTH=500 HEIGHT=200>\n<PARAM\
    \ NAME=message VALUE=\"Anyone for Java coffee?\">\n<PARAM NAME=limit VALUE=20000>\n\
    </APPLET></P>\n</body>\n</HTML>\n```\n\n# getParameter()\n\nThis collects the\
    \ values from the HTML code, and is used like this:\n`text = getParameter(\"message\"\
    );`\n\n- Two important points to note about getParameter():\n- The name of the\
    \ parameter must be given in \"quotes\" – though this is not necessary in the\
    \ HTML code.\n- The method always returns a String value. If it is a number, it\
