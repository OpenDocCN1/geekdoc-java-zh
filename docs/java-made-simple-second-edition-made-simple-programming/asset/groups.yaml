    \n## 选择与列表\n\nChoice 对象是一个下拉列表，用户可以从中选择一个项目。List 对象完整地显示，或者在一个可滚的框中显示，用户通常可以选择多个项目。因此，尽管这两种类型的组件使用的设置程序相似，但在检查和记录选择时需要不同的方法。\n\
    \n## addItem()\n\n在 CheckboxGroup 中，每个 Checkbox 都是独立的对象，必须单独创建。Choices 和 Lists\
    \ 的情况则相反。Choice（或 List）是一个单一组件，其选项是其不可分割的一部分。在最简单的情况下，Choice 可以这样设置：\n\n```java\n\
    Choice c = new Choice();\nc.addItemListener(this);\nc.addItem(\"Option 1\");\n\
    c.addItem(\"Option 2\");\nadd(c);\n```\n\n注意，对于 Checkbox 的情况下我们使用了 ItemListener，但对于\
    \ List，它被 add() 替换了：\n`partsList.add(\"Another option\");`\n\n## 索引\n\n选项按照 `addItem()`\
    \ 的顺序显示在屏幕上。它们存储在 Choice 中，可以通过索引值进行识别。例如，为了设置“Option 2”为默认，你会使用 select() 方法：\n\
    \n```java\nc.select(1);\n```\n\n在用户做出选择后，你可以读取索引值来查看结果：\n\n```java\nchosen = c.getSelectedIndex();\n\
    ```\n\n索引很少以原始形式使用。你通常会使用它来选择一个操作或设置变量。这可以通过我们在上一个程序中 CheckboxGroup 中所使用的 if...\
    \ else... 块来实现。索引也可以驱动 switch 块：\n\n```java\nswitch (c.getSelectedIndex()) {\n\
    \  case 0: ...对应0的操作...; break;\n  case 1: ...对应1的操作...; break;\n  ...\n}\n```\n\
    \n还有另一种证明非常方便的方法。想一下数组。数组是元素组，每个元素都可以通过下标标识——实际上与 Choice 或 List 的结构相同。\n\n下一个程序允许用户指定自己的\
