    \ 1,000 次。\n\n- 4. 写一个程序，接收一个字符，并使用 `if` 测试和 `switch` 块打印消息，说明它是大写、小写、数字、不可打印字符还是符号。至少三个符号应该被单独识别。\n\
    \n## 4 Applet 基础\n\n- Applet 方法 ................................ 76\n- AppletViewer\
    \ ................................. 78\n- 文本显示 ............................................\
    \ 79\n- 字体 ..................................................... 82\n- 颜色 ...................................................\
    \ 84\n- 捕获鼠标 ................................. 86\n- 新方法 ................................................\
    \ 90\n- Applet 参数 ................................ 92\n- 练习 ................................................\
    \ 96\n\n## Applet 方法\n\n所有的 applet 都基于 `Applet` 类，该类包含了一整批内置方法。其中某些方法会响应系统活动自动运行。本章的示例查看了这些关键方法：\n\
