    # Painting on a Canvas


    The next example ties together a number of the points covered in the last three
    chapters. It is a simple ‘paint’ program – and I mean simple! The aim is to demonstrate
    ideas, not to create a functional graphics application. It has a palette of four
    colours and a choice of three tools with which you can draw one item at a time.
    To make it a working graphics you need to store each item after drawing – either
    by saving the canvas image (difficult) or by adding them to an array of drawing
    instructions (complicated).


    The applet uses a panelled layout, to the same pattern as the one in Layout3.java
    (page 122). The tools panel contains labelled buttons for the drawing modes and
    colours, arranged in a GridLayout. The centre is taken by a redefined Canvas drawarea.
    Let’s start with that.


    ```

    class MyCanvas extends Canvas

    ```


    This creates a new class, MyCanvas, which is a sub-class of the standard Canvas,
    and so shares all its properties, fields and methods. It starts with a type of
    method that we have not used so far:


    ```

    public MyCanvas()

    ```


    This is a constructor, a method called when an object is created by lines like
    this:


    ```

    drawarea = new MyCanvas();

    ```


