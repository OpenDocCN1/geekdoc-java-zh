    # <PARAM...>


    The tags are written within the <APPLET...> block, and take this form:

    <PARAM NAME = param_name VALUE = param_value>


    +   * The param_name identifies it – you can have any number of parameters in
    your applet.

    * The param_value can be text or a number. If the text has more than one word
    it must be enclosed in "quotes". Miss them out and only the first word will be
    picked up by the browser, while the AppletViewer won''t run at all!


    This HTML code defines two parameters – message and limit.


    ```

    <HTML>

    <HEAD>

    <TITLE> Applet tester </TITLE>

    </HEAD>

    <body>

    <P>Applet output:</P>

    <P><APPLET CODE="MoveText.class" WIDTH=500 HEIGHT=200>

    <PARAM NAME=message VALUE="Anyone for Java coffee?">

    <PARAM NAME=limit VALUE=20000>

    </APPLET></P>

    </body>

    </HTML>

    ```


    # getParameter()


    This collects the values from the HTML code, and is used like this:

    text = getParameter("message");


    +   Two important points to note about getParameter():

    * The name of the parameter must be given in "quotes" – though this is not necessary
    in the HTML code.

    * The method always returns a String value. If it is a number, it must be converted
    from a String within the applet. We''ll look at this in more detail on page 112,
    for now, accept that these lines read in the value as a String and convert it
    to an int.


    ```

    temp = getParameter("limit");

    delayLimit = Integer.parseInt(temp);

    ```


