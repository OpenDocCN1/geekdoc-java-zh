- md: "\n# Event targets\n\nIf you have more than one button you have to test the\
    \ event to see which one was involved. This can be done by reading the button's\
    \ label - getActionCommand() will give us that: \n\n```java\nString buttonName\
    \ = e.getActionCommand();\n```\n\nWe can then test this to see which button was\
    \ clicked. Notice we must use the equals() method to compare the strings.\n\n\
    ```java\nif(\"Red\".equals(butName))\n```\n\nIn this program the applet displays\
    \ two buttons, butRed and butGreen, and a coloured rectangle. Only one button\
    \ is enabled at a time clicking it changes the rectangle and turns on the other\
