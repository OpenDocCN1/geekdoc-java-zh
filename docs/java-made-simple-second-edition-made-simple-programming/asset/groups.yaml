  - '[PAGE 26]


    # # Getting ready


    In Windows, the Java tools are designed to be used from the MS-DOS prompt. If
    you haven''t used it before, find it now – it should be on the Programs or the
    Accessories part of the Start menu.

    The next thing to do is to create a short batch file. This is a list of DOS commands
    stored in a file with a .BAT extension, and we need a file to do two things for
    us at the start of each session.


    +   - Switch to the folder in which you store your Java programs. This could be
    the top-level JDK folder, but it''s better to create a new one for them. Mine
    is called FILES, C:\JSDK1.4 on my machine.

    - Set the PATH. This list of folders that DOS searches when it needs a file to
    run a program - if the file isn''t in the current folder. (The PATH was used by
    early versions of Windows;since 98, Windows has recorded routes to programs in
    another way.) The Java tools are stored in the BIN folder, so the PATH must include
    this if you do not set the PATH, you will have to type the full folders-and-filename
    whenever you want to use a Java tool, e.g. C:\JSDK1.4\BIN\java whenever you want
    to use a Java tool, e.g. `C:\JSDK1.4\BIN\java`


    Create this short file in Notepad, adjusting the paths to the Java BIN and the
    working folders to suit your setup.


    ```

    PATH=C:\JSDK1.4\BIN

    CD \JSDK1.4\FILES

    ```


    +   - The first line takes the PATH settings (%PATH%) and adds the \BIN folder
    to it.

    - The second moves you to your working folder.


    Save the file in your WINDOWS folder as GOJAVA.BAT.

    At the start of a session, prompt the MS-DOS prompt and type ''GOJAVA''.'
