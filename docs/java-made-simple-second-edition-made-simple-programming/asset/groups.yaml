    \ in CheckboxGroups, only one Checkbox in the group can be turned one at any any\
    \ time.\n\nYou can see this in the next example program, which allows the user\
    \ to select the font – from a choice of three – and turn Bold and Italics. The\
    \ applet will look like this.\n\nIndividual Checkboxes CheckboxGroups\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_114_0.png)\n\
    \n# Creating Checkboxes\n\nCheckboxes must exist as objects at program level,\
    \ as they will be added to the window in the init() or start() method, and their\
    \ state changed elsewhere. It is simplest to declare and define them at the same\
    \ time; for example, this creates the Bold Checkbox:\n\n```java\nCheckbox checkBox\
    \ = new Checkbox(\"Bold\",false);\n```\n\nNotice that we are using two parameters\
    \ here. The first sets label, and the second sets the initial state – true for\
    \ checked (on) or false for unchecked. You can omit the state parameter. If you\
    \ do, the Checkbox is initially off. It can it therefore be omitted in this case.\n\
    \nThe Checkbox can be added to the window in the init() method:\n\n```java\nadd(fontBold);\n\
    fontBold.addItemListener(this);\n```\n\nWe need an ItemListener to pick up Checkbox\
    \ events, and we'll back to that shortly.\n\nWhen the Checkbox is part of a group,\
    \ the CheckboxGroup must be created first.\n\n```java\nCheckboxGroup fontName=\
    \ new CheckboxGroup();\nCheckbox sans = new Checkbox(\"Sans Serif\", fontName,\
    \ true);\n```\n\nAnd you can see why the CheckboxGroup's name is the second parameter\
    \ used in setting up the Checkbox. The true/false state is now the third parameter,\
    \ and, of course – only one of the group can set to true.\n\n# Checking Checkboxes\n\
    \nCheckboxes are handled through the ItemListener class. This is using an ActionListener,\
    \ but with subtle variations. A click on a Checkbox can be picked up by the itemStateChanged(ItemEvent\
    \ e) method, and we can work out which checkbox it was by reading its label with\
    \ getItem().\n\nString option = (String) e.getItem();\nand testing to see what\
    \ got:\n\n```java\nif (option.equals(\"Bold\"))\n```\n\nWhat happens now depends\
    \ on whether it is an individual Checkbox or a CheckboxGroup.\n\nWith an individual\
    \ Checkbox, a click will toggle between on and off. Its code likewise can toggle\
    \ a variable between two states:\n\n```java\nif (bold == 1)\nbold = 0;\nelse bold\
    \ = 1;\n```\n\nThe variable is used to carry selection information wherever it\
    \ is needed. In this case, it is used in the setFont() line. If you remember,\
    \ we use 1 to set the font to bold and 2 to set it to italic. Look at the program\
    \ and you will see that italic variable is toggled between 2 and 0. With CheckboxGroup,\
    \ the question is which checkbox is selected. We can test the label (held in *option*)\
    \ and act accordingly:\n\n```java\nif (option.equals(\"Sans Serif\"))\nfName =\
    \ \"Sans Serif\";\n```\n\nAfter working through this, the String *option* has\
    \ the name of the font, ready for use in the setFont() line in paint(). Here's\
    \ the full program.\n\n# Checks.java (Applet)\n\n```java\nimport java.awt.*;\n\
    import java.awt.event.*;\nimport java.awt.applet.*;\npublic class Checks extends\
    \ Checkbox implements ItemListener {\n    Checkbox fontBold = new Checkbox(\"\
    Bold\", false);\n    Checkbox fontalic = new Checkbox(\"Italic\", false);\n  \
    \  int bold = 0;\n    int italic = 0;\n    CheckboxGroup fontName = new CheckboxGroup();\n\
    \    Checkbox sans = new Checkbox(\"Sans Serif\", fontName, true);\n    Checkbox\
    \ serif = new Checkbox(\"Serif\", fontName, false);\n    Checkbox mono = new Checkbox(\"\
    Monospaced\", fontName, false);\n    String fName = new String(\"Serif\");\n\n\
    \    // bold and italic are set to 0 to match their states\n    public void init()\
    \ {\n        add(fontBold);\n        fontBold.addItemListener(this);\n       \
    \ add(fontalic);\n        fontalic.addItemListener(this);\n        add(sans);\n\
    \        sans.addItemListener(this);\n        add(serif);\n        serif.addItemListener(this);\n\
    \        add(mono);\n        mono.addItemListener(this);\n    }\n\n    // All\
    \ Checkboxes are added in the same way - the CheckboxGroup is not added\n    public\
    \ void itemStateChanged(ItemEvent e) {\n        String option = (String) e.getItem();\n\
    \        if (option.equals(\"Bold\")) {\n            if (bold == 1) {\n      \
    \          bold = 0;\n            } else bold = 1;\n        }\n        if (option.equals(\"\
    Italic\")) {\n            if (italic == 2) {\n                italic = 0;\n  \
    \          } else italic = 2;\n        }\n        if (option.equals(\"Sans Serif\"\
    )) {\n            fName = \"Sans Serif\";\n        }\n        if (option.equals(\"\
    Serif\")) {\n            fName = \"Serif\";\n        }\n        if (option.equals(\"\
    Monospaced\")) {\n            fName = \"Monospaced\";\n        }\n        repaint();\n\
    \    }\n\n    // Update the display\n    public void paint(Graphics g) {\n   \
    \     g.setFont(new Font(fName, bold + italic, 18));\n        g.drawString(\"\
    This font is \"+fName, 30,50);\n    }\n}\n```\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_16_0.png)\n\
    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_117_0.png)\n\n| All Checkboxes are added\
    \ in the | |\n| :--- | :--- |\n| same way - the CheckboxGroup | |\n| is not added\
    \ | |\n\n# Text Components\n\nTextField and TextArea are both sub-classes of the\
    \ Component class. This doesn't just mean that they have a great deal in common\
    \ sub-classes contain the methods of their super-classes (the ones they are derived\
    \ from) as well as their own ones. So, when you are looking through the documentation\
    \ for methods to use a TextField or TextArea, step back up the class hierarchy,\
    \ and have a look at the Text Component class as well.\n\nWhen setting up a new\
    \ TextField, you can use any of these constructors:\n\n- `new TextField()` which\
    \ must be followed somewhere by a `setColor()` method to fix its size;\n- `new\
    \ TextField(int)` where the int value sets the width;\n- `new TextField(String)`\
    \ creates a field displaying the String;\n- `new TextField(String, intWidth)`\
    \ displays the String, but sets the width according to the int value.\n\nTextAreas\
    \ have a similar set of constructors, with two ints, setting the size in rows\
    \ and columns. There is also a fifth:\n\n- `new TextArea(String, intRows, intCols,\
    \ intScroll)` where intScroll controls the scrollbars: 1 turns off the vertical\
    \ scroll bar; 2 turns off the horizontal and 3 turns off both scrollbars.\n\n\
    The first example shows a typical use for these two components. The TextField\
    \ collects a short item from the user; the TextArea collects a longer, multi-line\
    \ entry.\n\nNotice the prompts - you must tell users what you want to enter. The\
    \ email TextField is accompanied by a Label. For the details, the prompt has been\
    \ written into the TextArea, then selected so that it can be easily deleted and\
    \ replaced. Either approach can be used for either type.\n"
