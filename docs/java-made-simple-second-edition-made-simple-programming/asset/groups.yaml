    # Threads


    Threads are sequences of code that can be executed independently alongside another.
    A simple applet can only do one thing at a time, but one that contains Threads
    can do several things at once.


    Threads are essential for good animation, and for simple animation if you don''t
    want to bring the rest of the applet to a halt.


    If you have any time-consuming tasks to do – such as downloading images or other
    files – handling them through a Thread will allow you to do something else to
    keep your viewers happy while they wait.


    # Threaded applets


    The simplest way to include a thread in a program is to implement the Runnable
    interface. This handles the run() method, which holds all the thread''s code.
    The addition of implements Runnable to the class line brings in the interface:


    +   public class Counter implements Applet Runnable


    The thread is declared at class level, but set to null. When start() is executed,
    an instance is created and the thread''s start() method is called. This calls
    run(), to execute the thread code.


    ```

    Thread timer = null;

    ```


    ```

    timer = new Thread(this);

    timer.start();

    ```


    In run(), there is a first check to see if the thread is active – if the user
    leaves and returns to the applet, start() will be executed, and you do not want
    to create a second instance.


    ```

    while (timer != null)

    ```


    If it is, the thread waits for a second, updates a counter and repaints the display.


    ```

    try

    {Thread.sleep(1000);}

    catch (InterruptedException e){}

    count++;

    repaint();

    ```'
  - '[PAGE 171]


    The sleep() method works in milliseconds, so 1000 = 1 second. This

    feature of the Thread class is invaluable for animation - it only

    suspends the thread, leaving the rest of the program active.


    In stop(), the thread is turned off:


    ```

    timer = null;

    This is that it also stops execution when the user leaves the applet

    And of course, it is restarted by start(). This is not essential in this

    case - the thread could be left running without interfering with

    anything else, or coming to any harm.

    ```


    mouseDD() is nothing to do with the thread. It is there simply

    show that the rest of the program can be doing active things while the

    thread is running. One lets you drag a string around the screen.


