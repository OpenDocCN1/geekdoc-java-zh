    \n# Checkboxes and CheckboxGroups\n\nWhether used individually or within CheckboxGroups,\
    \ Checkboxes are handled in much in the same way. The main difference lies in\
    \ the choices they present to the user.\n\n- Individual Checkboxes can be set\
