    \ the thread, leaving the rest of the program active.\n\nIn `stop()`, the thread\
    \ is turned off:\n\n```java\ntimer = null;\n```\nThis is that it also stops execution\
    \ when the user leaves the applet\nAnd of course, it is restarted by `start()`.\
    \ This is not essential in this\ncase - the thread could be left running without\
