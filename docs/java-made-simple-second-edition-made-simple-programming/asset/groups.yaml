    \ in pixels.\n\nThe simplest way to handle fonts is to hold each text style in\
    \ a separate Font object, and to define when it is created; e.g.\n  Font mainhead\
    \ = new Font(\"TimesRoman\",Font.BOLD,36);\n\nWhen you want to set this style,\
