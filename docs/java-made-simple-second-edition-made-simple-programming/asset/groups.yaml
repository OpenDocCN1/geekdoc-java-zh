    # Animated images


    The hardest part to animation is not in writing the code – that''s the easy bit
    – but in creating the images. If you are light on artistic talent, stick to simple
    pictures – like I do!


    This program animates a set of three images of an old jalopy, moving across the
    screen and backfiring as it goes. Here are the images:


    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_173_0.png)


    The images are stored in the pic[]array, with the subscript of the one to be displayed
    by current. This is cycled through the values 0 to 2 by the:


    ```

    current++;

    if (current >2)

    current = 0;

    ```


    The technique can be extended for as large an array as you need.

    The movement is simply straight across screen, with the x position incrementing
    by 10 each time.


    The image is changed and moved every 1/10th of a second – faster would be smoother,
    but smoothness is not wanted here – with the timing controlled by a sleep(100)
    instruction.


    Experiment to find how far and how fast to move your images.


    Animation is improved by sound effects, so add those if possible. The AudioClip
    should be loaded into an object, if it will be reused, could be loaded and played
    directly if it is a one-off. (Look back to page 150 for more on the sound methods.)


    The thread is set up and used to the same pattern as in the last program – you
    could use Counter.java as a basis for this.


