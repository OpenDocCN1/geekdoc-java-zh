    \n# Color objects and setColor()\n\nColours are defined through the Color class,\
    \ e.g.\n```java\nRed = new Color(255,0,0);\n```\n\nThis creates the Color object\
    \ 'red' and defines it as having red fully on, and green and blue off. Text objects\
    \ (see Chapter 6) are drawn in the current colour, so you must first set the colour\
    \ before drawing. To do this, use the setColor() method, passing to it a Color\
    \ object:\n\n```java\ng.setColor(red);\n```\n\nThis simple demonstration of colour,\
