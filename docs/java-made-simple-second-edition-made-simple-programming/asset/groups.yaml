- md: "\n# Errors and exceptions\n\nYour programs will not always be perfect – no\
    \ programmer ever achieves this – but you can try to anticipate possible errors,\
    \ and Java will help you with this.\n\n## Runtime errors\n\nThe fact that a program\
    \ compiles successfully does not mean that it is error-free. Compilation tells\
    \ you that you have written the Java statements and methods using the correct\
    \ syntax. It will not tell you that a while loop will run forever as the exit\
    \ test will never be true, or that under certain conditions – a variable will\
    \ not hold an acceptable value, or an array's subscript will be outside the range\
    \ of the array. These errors will only show up at runtime.\n\nRigorous testing\
    \ will help to turn up some bugs. You must check every possible route through\
    \ your program, and test all values across the range of possible – and impossible\
    \ – values. When you have done all to test it, hand the program to people who\
    \ have not seen it before. They will try to do things that you never thought of!\n\
    \nIf you cannot see where a program is going wrong, insert statements to display\
    \ the values held in key variables or to mark the progress through a routine:\n\
    \n```java\nSystem.out.println(\"The total is \" + total);\nSystem.out.println(\"\
    Into the calculating loop\");\n```\n\nThese stubs (in the jargon) are best used\
    \ one or two at a time to narrow the bug-search first to the method, then the\
    \ line that is causing the trouble.\n\n## Exceptions\n\nRuntime errors are probably\
    \ less common in Java programs than those written in other languages because of\
    \ its exception-handling. Those methods that are likely to hit errors – for example\
    \ those that open files, which may not be present – throw exceptions (a kind of\
    \ error report). When using these methods, you must add code to catch the exceptions.\n\
    \nFor example, when you try to open a file, there is a real possibility that it\
    \ may not be there. Use this line by itself...\n\n```java\nFileInputStream inStream\
    \ = new FileInputStream(file);\n... and you will get an error message telling\
    \ you that you must catch FileNotFoundException on the new FileInputStream() statement.\n\
    ```\n\nThe solution is to enclose the statement in a try block. This is followed\
    \ by one or more catch blocks. Each of these has the name of the exception being\
    \ caught.\n\n```java\ntry {\n  FileInputStream inStream = new FileInputStream(file);\n\
    } catch (FileNotFoundException e) {\n  System.out.println(\"Error: \" + e);\n\
    }\n```\n\nIt is up to what you do with the exception when you've caught it. Here\
    \ the error message e is printed - this is useful for debugging and filename and\
    \ looped back to try again. catch blocks can even be left empty - but they must\
    \ be there!\n\nYou will find some examples of exception handling in some of the\
    \ programs in Chapters 7 and 8.\n\n### Take note\n\nThere is never any problem\
    \ in knowing which exception name to use as the catch() parameter. Just write\
    \ the statements without the try and catch blocks and the compiler will tell you\
    \ what you should be catching.\n\n## Exercises\n\n- 1. Write a program, using\
    \ two loops, to produce this pattern of asterisks:\n*\n**\n***\n****\n*****\n\
    ******\n*******\n********\n\n- 2. Find out fast Java runs on your PC. Write a\
    \ program that displays \"Starting to count\", runs through a loop, then displays\
    \ \"Done\".\n\nHow long does it take your PC to count to 500,000? How long to\
    \ count to 5,000,000?\n\n- 3. How are the numbers produced by random()? Set up\
    \ an array of 10 ints, then generate random numbers in the range 0 to 9 and increment\
    \ the matching element in the array. This should loop round for at least 1,000\
    \ times.\n\n- 4. Write a program that takes a character and, using if tests and\
    \ a switch block, prints out a message to say whether it is upper case, lower\
    \ case, digit, non-printing or a symbol. At least three symbols should be individually\
    \ recognised.\n\n## 4 Applet basics\n\n- The Applet methods ................................\
    \ 76\n- The AppletViewer ................................. 78\n- Text display\
    \ ............................................ 79\n- Fonts .....................................................\
    \ 82\n- Colours ................................................... 84\n- Catching\
    \ the mouse ................................. 86\n- New methods ................................................\
    \ 90\n- Applet parameters ................................ 92\n- Exercises ................................................\
    \ 96\n\n## The Applet methods\n\nAll applets are based on the Applet class, which\
    \ contains a whole batch of ready-made methods. Some of these are run automatically\
    \ in response to system activity. The first example in this chapter looks at these\
    \ key methods:\n\ninit() is run when the applet is first loaded, and only then.\
    \ If you have variables that need to be given initial values, this is where it\
    \ should be done.\n\nstart() is run when the applet is loaded, and again whenever\
    \ the applet's page is reloaded. If you want to restart an action when someone\
    \ returns to a page, do it from this method.\n\nstop() is run when the browser\
    \ is shut down or another page is opened.\n\npaint() redraws the display when\
    \ the page is loaded or reloaded.\n\nThe definition of the Applet class includes\
    \ these methods, but as blanks like this:\n\n```java\npublic void init()\n{}\n\
    ```\n\nThey do not anything, but by being there they link the method names to\
    \ the relevant system events. If you write your own init() method, it will override\
    \ the original, and be performed when the applet is first loaded.\n\nIn the next\
    \ example applet, the init() and start() methods have been given. The paint()\
    \ method then displays.\n\n# StartStop.java\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Applet</TITLE>\n\
    </HEAD>\n<BODY>\n<P>Output:</P>\n<APPLET CODE=\"StartStop.class\" WIDTH=500 HEIGHT=200></APPLET>\n\
    </BODY>\n</HTML>\n```\n\n# The AppletViewer\n\nAfter you have compiled the applet,\
    \ and written the HTML file, view it through the AppletViewer\n\n![](img/e0aa6bf61b0552cacf6e870d5e9489)\n\
    \nYou have noticed that a Stop clears the display, but when Start is given, the\
    \ display is restored.\n\n# Text display\n\nIf you want to display text, use drawString().\
    \ This takes three parameters – the text, and the x,y coordinates that fix its\
    \ position. The x, y coordinates are measured in pixels – screen dots. They start\
    \ at the top left of the, and refer to the bottom left of the text. Accurate positioning\
    \ is a bit tricky as you have to take the size of the font and the length of the\
    \ text into account. e.g.\n\n```java\ng.drawString(\"Hello there\", 100, 50);\n\
    ```\n\nThis displays \"Hello there\", starting 100 pixels from the left and 50\
    \ pixels down the top.\n\n| 0 | 100 | 200 | 300 | ...WIDTH |\n|---|---|---|---|---|\n\
    | 0 | | | | |\n| 50 | | | | |\n| 100 | | | | |\n\nThe text can be a literal literal\
    \ string (in “quotes”), a String variable or any other object or value that can\
    \ be converted to a String. For example, to display a StringBuffer object, you\
    \ would convert it with the toString() method (in the StringBuffer class):\n\n\
    ```java\ng.drawString(s.toString(), 200, 100);\n```\n\nThe 'g' is a Graphics object,\
    \ and is defined in the line:\n\n```java\npublic void paint(Graphics g)\n```\n\
    \nEven line must have this – you don’t have to call it ‘g’, but you must have\
    \ a Graphics object so that you can call up the drawing methods.\n\nThe next two\
    \ programs demonstrate positioning, and different types of strings. The strings\
    \ are placed at the corners and centre of the applet. In the first, the default\
    \ font settings are used.\n"
  mdcn: "\n\n# 错误与异常\n\n你的程序并不会总是完美的——没有任何一个程序员能做到这一点——但你可以尝试预测可能的错误，Java 会在这方面为你提供帮助。\n\
    \n## 运行时错误\n\n程序成功编译并不意味着它没有错误。编译只是在告诉你你使用了正确的语法编写了 Java 语句和方法。它不会告诉你一个 `while`\
    \ 循环会因为退出条件永远为真而导致无限循环，或者在某些情况下——变量将不会持有可接受的值，或者数组的下标超出了数组的范围。这些错误只会在运行时出现。\n\n\
    严谨的测试将有助于发现一些 bug。你必须检查程序中每条可能的路径，并测试所有可能（以及不可能）的数值范围内的值。当你完成了所有测试后，将程序交给以前没见过它的人。他们会尝试那些你从未想过的事情！\n\
    \n如果你无法看出程序哪里出了问题，可以插入语句来显示关键变量所持的值，或者标记执行例程的进度：\n\n```java\nSystem.out.println(\"\
    The total is \" + total);\nSystem.out.println(\"Into the calculating loop\");\n\
    ```\n\n这些存根（术语中）最好一次使用一或两个，以便首先将 bug 搜索范围缩小到方法，然后缩小到导致问题的代码行。\n\n## 异常\n\nJava\
    \ 程序中的运行时错误可能比其他语言编写的程序少，因为 Java 有其异常处理机制。那些可能遇到错误的方法——例如打开文件的方法（文件可能不存在）——会抛出异常（一种错误报告）。在使用这些方法时，你必须添加代码来捕获（catch）这些异常。\n\
    \n例如，当你尝试打开一个文件时，很有可能它并不在那里。单独使用这一行……\n\n```java\nFileInputStream inStream = new\
    \ FileInputStream(file);\n... 然后你将得到一个错误消息，告诉你必须在 `new FileInputStream()` 语句上捕获\
    \ `FileNotFoundException`。\n```\n\n解决方案是将语句封装在 `try` 块中。紧随其的是一个或多个 `catch` 块。每个\
    \ `catch` 块都有被捕获异常的名称。\n\n```java\ntry {\n  FileInputStream inStream = new FileInputStream(file);\n\
    } catch (FileNotFoundException e) {\n  System.out.println(\"Error: \" + e);\n\
    }\n```\n\n捕获异常后取决于你如何处理该异常。在这里打印了错误消息 `e` —— 这对于调试和文件名有用，并循环重试。`catch` 块甚至可以留空——但它们必须存在！\n\
    \n你将在第 7 章和第 8 章的一些程序中找到异常处理的示例。\n\n### 注意事项\n\n使用哪种异常名称作为 `catch()` 参数永远没有问题。只管编写不带\
    \ `try` 和 `catch` 块的语句，编译器会告诉你你应该捕获什么。\n\n## 练习\n\n- 1. 写一个程序，使用两个循环来产生如下星号图案：\n\
    *\n**\n***\n****\n*****\n******\n*******\n********\n\n- 2. 快速测试 Java 在你 PC 上运行的速度。写一个程序显示“Starting\
