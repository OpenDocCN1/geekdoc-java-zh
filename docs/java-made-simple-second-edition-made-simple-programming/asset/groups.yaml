    \ // displays 0 to 9\n}\n```\n\n# do ... while\n\nThis variation moves the test\
    \ to the end of the loop. The statements within it are therefore always performed\
    \ at least once. Its shape is:\n```java\ndo\n{ statement(s); }\nwhile (test);\n\
    ```\n\nNotice that there is a semi-colon at the end of the while line – this is\
    \ essential.\n\nThe following program demonstrates the do ... while loop, and\
    \ again uses the (java.lang.Math.random()) method to emphasize that the repetition\
    \ can be controlled by values arising from within the loop.\n\n# WhileDo.java\
    \ (application)\n\n```java\nclass WhileDo\n{\n    public static void main(String[]\
    \ args)\n    {\n        int num = 0;\n        System.out.println(\"Looking for\
    \ number \");\n        do {\n            num = (int)(java.lang.Math.random() *\
    \ 100);\n            System.out.print(num + \" \");\n        } while (num != 6);\n\
    \        System.out.println(\"Got it\");\n    }\n}\n```\nThe space is needed to\
    \ separate the numbers on screen The output from this program will be something\
    \ like:\nLooking for number 4 9 3 5 0 6\n\n# Branching with if\n\nLoops make programs\
    \ powerful, giving them the ability to process data. Branches make them flexible,\
    \ allowing them to vary their actions in response to data. The simplest form of\
    \ branch uses the if keyword. This is the basic syntax:\n```java\nif (test)\n\
    \    statement(s); // true\n```\n\nThe test checks the value held by a variable.\
    \ If the test proves true, the program performs the statement(s), otherwise they\
    \ are ignored. A variation uses else keyword, which handles the actions if the\
    \ test does not prove true. The syntax is:\n```java\nif (test)\n    statement(s);\
    \ // true\nelse\n    statement(s); // false\n```\n\nFor example:\n```java\nif\
    \ (age < 18)\n    cost = 3.50\nelse\n    cost = 5.00\n```\n\nYou can see the if\
    \ structure act in the next example. It gets the computer to work out the value\
    \ of a random number, which it does by splitting the difference between the highest\
    \ and lowest possible values. If 'guess' is too high, or too low, a message is\
    \ displayed and the upper or lower limits adjusted.\n\n# Guess1.java (application)\n\
    \n```java\nclass Guess1\n{\n    public static void main(String[] args)\n     \
    \   int target = (int)(java.lang.Math.random() * 100);\n        int guess;\n \
    \       int count = 0;\n        int lower = 0;\n        int upper = 100;\n   \
    \     do {\n            count++;\n            guess = (upper - lower) / 2 + lower;\n\
    \            if (guess > target) {\n                upper = guess;\n         \
    \       System.out.println(guess + \" high - trying again\");\n            }\n\
    \            if (guess < target) {\n                lower = guess;\n         \
    \       System.out.println(guess + \" low - trying again\");\n            }\n\
    \        } while (guess != target);\n        System.out.println(guess + \" Got\
    \ it in \" + count + \" goes\");\n}\n```\n\n> Results in a number half way between\
    \ the upper and lower limits\n> We could have used a while loop, but would have\
    \ to assign an initial value to guess.\n\nA typical output is shown below – the\
    \ computer never takes more than seven goes. Why not?\n\n| | |\n|---|---|\n| 50\
    \ | high - trying again |\n| 25 | - trying again |\n| 37 | low - trying again\
    \ |\n| 43 | high - trying again |\n| 40 | high - trying again |\n| 38 | Got it\
    \ in 6 goes |\n\n# Multiple branching\n\nThe basic if structure has the beauty\
    \ of simplicity – it shows very clearly the relationship between the test and\
    \ the outcome. However, it is not always the best solution. Consider this problem:\
    \ You want to analyse incoming characters to see if they are upper or lower case\
    \ letters, digits, spaces or symbols. Here's the first draft of a program that\
    \ should do the job.\n\n```java\nclass Ascii {\n    public static void main(String[]\
    \ args) {\n        char letter;\n        do {\n            letter = (char)(java.lang.Math.random()\
    \ * 128);\n            if (letter < ' ') {\n                System.out.println(\"\
    Non-printing\");\n            } else if (letter >= 'a' && letter <= 'z') {\n \
    \               System.out.println(\"Lower case\");\n            } else if (letter\
    \ >= 'A' && letter <= 'Z') {\n                System.out.println(\"Upper case\"\
    );\n            } else if (letter >= '0' && letter <= '9') {\n               \
    \ System.out.println(\"Digit\");\n            }\n        } while (letter != '\
    \ ');\n    }\n}\n```\n\nSo far, the code handles the non-printing characters (0\
    \ to 31) up to space, the sets 'a' to 'z', 'A' to 'Z' and '0' to '9'. Now what\
    \ about the rest? Look at any character set (use Windows Character Map), and you\
    \ will see that there are punctuation and other symbols scattered between the\
    \ blocks of letters and digits. A test for these would look like this, and I'm\
    \ not guaranteeing that this is correct!\n\n`if ((letter >= ' ') && (letter <=\
    \ '0') || (letter >= '9') && (letter <= 'a') || (letter >= '\\') && (letter <=\
    \ 'Z'))`\n\nHere's a better solution. The if ... else structure gives two branches\
    \ from the same test – one to follow if it is true, and one if it is false. This\
    \ can be extended to handle multiple branching.\n\n```java\nif (test1)\n    statement(s);\
    \ // if test1 is true\nelse if (test2)\n    statement(s); // if test2 is true\n\
    ...\nelse\n    statement(s); // if no tests are true\n```\n\nIf test1 is false,\
    \ the program tries test2, and failing that, tries the next. If all the tests\
    \ prove false, the program performs the statements after the final else. Here's\
    \ a better solution to the character analysis problem.\n\n# AsciiElse.java (application)\n\
    \n```java\nclass AsciiElse\n{\n    public static void main(String[ ) args)\n \
    \   {\n        char letter;\n        do {\n            letter = (char)(java.lang.Math.random()\
    \ * 128);\n            if (letter < ' ') {\n                System.out.println(\"\
    Non-printing\");\n            } else if (letter >= ' ' && letter <= '~')\n   \
    \             System.out.println(letter + \" Lower case\");\n            else\
    \ if (letter >= 'A' && letter <= 'Z')\n                System.out.println(letter\
    \ + \" Upper case\");\n            else if (letter >= '0' && letter <= '9')\n\
    \                System.out.println(letter + \" Digit\");\n            else\n\
    \                // If flow reaches here, the character is not non-printing, not\
    \ a letter and not a digit\n                System.out.println(letter + \" Symbol\"\
    );\n        } while(letter != ' ');\n    }\n}\n```\n"
