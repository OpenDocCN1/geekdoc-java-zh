    -butGreen.setEnabled(true);\n\nThis turns the Red off and the Green one on.\n\n\
    # But2.java (Applet)\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\
    import java.awt.applet.*;\npublic class But2 extends Applet implements ActionListener\
