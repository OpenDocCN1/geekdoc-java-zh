    # Image filters


    If you check out the documentation for the java.awt.image package, you will find
    that it contains several interfaces and classes that can be used for manipulating
    images. The next program dips into these to create cropped and enlarged images.
    It displays an image – I have used a map – and when the mouse is clicked anywhere
    on it, it displays an enlarged view of the area around the mouse.


    # The interfaces


    Interfaces act as links between objects and classes, providing them with extra
    facilities. There are three in the image class:


    +   - ImageConsumer is the object which takes the data for a new image after it
    has been processed. We are not using one here.

    - ImageObserver is the object which monitors the progress of an image as it is
    being drawn where images are being prepared off-screen, for use in animation.
    In this, as in the previous Image programs, we are using one – though it is not
    obvious. ThedrawImage parameter this tells Java to use the image as its own ImageObserver.

    - ImageProducer is the source of data for an image. In this program we load one
    image from file, and use that as the source for a second image.


    # The classes and methods


    ImageFilter brings in methods for changing the colour, size and scale of image
    objects.


    CropImageFilter is an extension of ImageFilter that crops a rectangular section
    of an image.


    ```

    ImageFilter imgF = new CropImageFilter(cropX,cropY,420,330);

    ```


    This line defines the ImageFilter object imgF as one which takes a block 420 x
    330 pixels, starting at cropX, cropY. Where it takes it from is not defined at
    this stage.'
  - '[PAGE 157]


    FilteredImageSource forms the link between the source image and the ImageFilter
    object, with the output depending upon the nature of the ImageFilter. Here, the
    line:

    ImageProducer imgP = new FilterImageSource(source.getSource(), imgF);

    crops the area defined in imgFout of the source image. This is then converted
    from an ImageProducer object to a standard image by:

    crop = createImage(imgP);


    # Before you start...


    The program below was designed to work with an image 840 x 660 pixels, and a display
    area of 420 x 330 – half scale. All the calculations are based on those values,
    so if your image is a different size, you will have to vary the numbers to suit.


    If you want to simplify things a bit, you can omit the limit checks in Cropper()
    – this output will be a bit messier, but it won''t hurt to go beyond the limits
