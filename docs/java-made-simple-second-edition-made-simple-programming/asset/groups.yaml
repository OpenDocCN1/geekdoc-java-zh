- md: "\n## Exercises\n\n- 1. Write a program that will calculate a person's age in\
    \ days, working from their age in days, months and years. Assume that all months\
    \ have 30 days - it will make life much easier!\n\n- 2. Adapt the previous program\
    \ so that it takes a person's date of birth and today's date, and works out the\
    \ age from that.\n\n- 3. Write a program that will take two command line arguments\
    \ and add them to a StringBuffer containing the phrase \"You entered \" and output\
    \ the new string.\n\n## 3 Program flow\n\nTesting values ................................................\
    \ 54\nfor loops ........................................................ 56\n\
    while loops ................................................ 60\nBranching with\
    \ if ............................................ 62\nMultiple branching .................................\
    \ 64\nSwitch ......................................................... 66\nUsing\
    \ methods ................................................ 68\nErrors and exceptions\
    \ ................................. 72\nExercises ................................................\
    \ 74\n\n## Testing values\n\nProgram flow refers to the order in which a program's\
    \ instructions are carried out. So far, all the example programs have run straight\
    \ through a sequence, then stopped. There are few practical uses for such simple\
    \ programs. The addition of loops and branches makes programs far more useful\
    \ and powerful. In a loop, a set of instructions will be repeated a fixed number\
    \ of times, or until a condition is met. Branches take the flow off different\
    \ routes, depending upon the values held by variables. Before we go any further,\
    \ let's see how we test values.\n\n## Relational operators\n\nThese are used to\
    \ compare variables with values or with the contents of other variables. There\
    \ are six relational operators:\n\n| Operator | Description |\n| :--- | :--- |\n\
    | == | equal to |\n| < | less than |\n| <= | less or equal to |\n| != | not equal\
    \ to |\n| > | greater than |\n| >= | greater or equal to |\n\nNotice the equality\
    \ test uses a double equals sign '='. The single sign '=' is used for assigning\
    \ values. Typical test expressions are:\n\n```\n(x == 99)\n(newNum != oldNum)\n\
    ```\n\nTests are enclosed in brackets, and return a Boolean value – true or false.\
    \ You don't normally need to worry about this – just use the test – but occasionally\
    \ it is useful to store the result of the test in a variable, for later reference\
    \ in the program, e.g.\n\n```\nboolean result; // create a boolean variable\n\
    ...\nresult = (newNum > oldNum) // store the test result\n...\nif (result == true)\
