    # Applet parameters


    You can pass values from the HTML page to your applet. The great thing about this
    is that it allows you to get different effects from the same applet – without
    having to rewrite and recompile it. In the simple example given here, the applet
    slides a message across the window, with both the message and the slide rate controlled
    by values set in the HTML page.


    Values are passed through parameters. These are written into the HTML page using
    <PARAM ...> tags, and read into the applet with the getParameter() method.


    # Planning


    As both the HTML page and the Java program must be complete and correct before
    the applet can be tested, it doesn''t make any difference which one you do. Before
    you start to write either, you should decide which values will be passed, and
    what names you will give them. In fact, with any program – not just those that
    use parameters – you should start by planning on paper. Any time that you spend
    working out the screen layout and thinking through the sequence of events, is
