- md: "\n# Calculations\n\nIn Java there are five arithmetic operators:\n\n- + addition\n\
    - - subtraction\n- * multiplication\n- / division — how many times it goes\n-\
    \ % division — remainder\n\nNotice these last two. When you divide integers (on\
    \ paper), you get two results — how many times, and the remainder. e.g.\n\n14\
    \ / 4 = 3 remainder 2\n\nTo get both values in Java, you must do two calculations:\n\
    14 / 4 = 3 then 14 % 4 = 2\n\nThe values produced by arithmetic expressions can\
    \ be used wherever you can use a variable or a literal value, e.g. print them\
    \ on screen, assign them to variables, or use them within other calculations.\
    \ We'll start by printing them on the screen. This program displays the sums as\
    \ (text) followed by the expressions. The system will calculate the results and\
    \ display them.\n\n## Sums1.java (application)\n\n```java\nclass Sums1 {\n   \
    \ public static void main(String[] args) {\n        System.out.print(\"29 + 7\
    \ = \");\n        System.out.println(29 + 7);\n        System.out.println(\"29\
    \ - 7 = \" + (29 - 7));\n        System.out.println(\"29 * 7 = \" + (29 * 7));\n\
    \n        System.out.print(\"29 / 7 = \");\n        System.out.print(29 / 7);\n\
    \        System.out.print(\" remainder \");\n        System.out.println(29 % 7);\n\
    \    }\n}\n```\n\nWhen compiled and executed, you should see this output:\n\n\
    | 29 + 7 = 36 |\n| 29 - 7 = 22 |\n| 29 * 7 = 203 |\n| 29 / 7 = 4 remainder 1 |\n\
    \nThat last program used integer values. See what happens with decimal fractions.\
    \ Edit it to change 29 to 29.5, and 7 to 7.1. (If you are using WordPad, its Replace\
    \ function will make this a simple job.) Compile again and run. This time you\
    \ should see this:\n\n| 29.5 + 7.1 = 36.6 |\n| 29.5 - 7.1 = 22.4 |\n| 29.5 * 7.1\
    \ = 4.15492597464789 remainder 1.100000000000024 |\n\nLook at the accuracy! Java\
    \ treats decimal values as doubles (accurate to 15 digits), unless you tell it\
    \ otherwise.\n\nNow let's trying expressions to variables. We'll start with some\
    \ simple ints.\n\n## Sums2.java (application)\n\n```java\nclass Sums2 {\n    public\
    \ static void main(String[] args) {\n        int num1, num2, num3;\n        num1\
    \ = 4;\n        num2 = 1 + 1;\n        num3 = num1 + num2;\n        System.out.print(num1);\n\
    \        System.out.print(\" \" + num2);\n        System.out.print(\" \" + num3);\n\
    \        System.out.print(\" = \");\n        System.out.println(num3);\n    }\n\
    }\n```\n\n| Declares int variables |\n| :--- |\n| The result is assigned to num2\
    \ |\n| The values in num1 and num2 are added and assigned to num3 |\n| These five\
    \ items could have been output in one single printing |\n\nThis should give a\
    \ single line output:\n\n```\n4 + 2 = 6\n```\n\nUse the program as a basis for\
