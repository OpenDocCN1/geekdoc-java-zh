    # # What is Java?


    Java is a platform-independent, object oriented, multi-threading, dynamically-linked
    programming language – and it has a lot of jargon. I''ll try to keep the jargon
    to a minimum, but some is unavoidable. With that mind, I''ll try to answer the
    ''What is Java?'' question again.


    Java is a programming language developed by Sun Microsystems, primarily for use
    on the World Wide Web. It has a lot in common with C++, so if you are competent
    in that language, you are well on the way to understanding Java. This book does
    not assume that you know anything about C++, or any other programming language,
    though a familiarity with Windows and a Web browser is assumed.


    # ## What can you do with Java?


    With Java, you can produce three distinct types of programs – applets, applications
    and beans.


    Applets are programs embedded into the HTML documents that form Web pages. Typically,
    they are small – so that someone browsing the Web does not have to wait long to
    download them. They will normally serve a limited purpose. Applets may provide
    a slicker means of navigating around a Web site, produce attention-grabbing animations,
    or simply entertain to encourage visitors to return regularly. They can also be
    used for more serious work. Plain Web pages are good for display but allow only
    limited feedback. Applets add true-on interaction with the visitor – an insurance
    business, for example, use applets to calculate instant quotes.


    Applications are free-standing programs. You could use Java to write a wordprocessor,
    a spreadsheet, a graphics utility – in fact, any kind of application. Part of
    the Java grand design was the idea that of installing standard software on PCs
    in a network, Java applications would be installed on a central server, and downloaded
    into small networked computers for use as required. It would allow simpler and
    cheaper upgrading, as each application would only need installing once for the
    whole office.'
  - '[PAGE 13]


    These applications would be modular. Instead of a 50+Mb all-singing, all-dancing
    wordprocessor, you would have a small editing module, and separate modules for
    spell-checking, layout, printing, etc., which could be downloaded - quickly –
    as needed. This approach allows the use of smaller, cheaper computers, and could
    simplify the production of software as the same modules could be reused in different
    applications – for example, the printing module could print documents from a wordprocessor
    or a spreadsheet.


    It''s a neat idea, Java-using networked computers have yet to move from the drawing
    board to the desktop in any real numbers.


    Beans take the modular approach further. The concept here is that a bean should
    perform a specific, limited function, that could be called upon by other beans,
    applets or applications.


