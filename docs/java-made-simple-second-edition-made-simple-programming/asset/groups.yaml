- md: "\n# Sound control\n\nSound1 is a fine example of the cheap and cheerful approach\
    \ to programming - it's short and it works, in a limited fashion, as long as everything\
    \ is OK. But if you are sending a program out into the big wide world, where anything\
    \ can happen, some refinements are needed.\n\n## Checking the file\n\nWhat happens\
    \ if the sound file is not where it is supposed to be, or fails to reach the user?\
    \ Neither the play(URL) nor the getAudioClip() return error reports if they cannot\
    \ find the file - the program carries soundlessly. This may be acceptable. If\
    \ it isn't, there is a solution - but it is not a tidy one.\n\nThe basic problem\
    \ is that you can create a URL to a non-existent file and few of the URL-using\
    \ methods complain! One will throw an exception over `openStream()`. To use this,\
    \ we must first create the URL as an object, and then try to open a stream (a\
    \ link to file) to.\n\n```java\ntry\n{\n  mytuneURL = new URL(getCodeBase(),\"\
    mytune.au\");\n  inst = mytuneURL.openStream();\n} catch(MalformedURLException\
    \ e)\n{\n} catch(IOException e)\n{\n  message = \"Failed to find sound file\"\
    ;\n}\n```\n\nThe `URL(...)` line throws the `MalformedURLException` - which does\
    \ not test that it actually exists and must be caught, though you can't do anything\
    \ with it. `openStream()` throws the `IOException` and is in its catch block that\
    \ we write the code to respond to a missing file.\n\n## Stopping and starting\n\
    \nIf you run Sound1 in a browser, rather than the AppletViewer, you may notice\
    \ a very irritating effect. The looped sound continues to play after you have\
    \ moved off the page containing the applet! The solution is to turn it off in\
    \ the applet's `stop()` method that runs when the applet goes out of view. And\
    \ in case the user returns to the applet, you should restart the loop in the `start()`\
    \ method.\n\n## Sound2.java (Applet)\n\n```java\nimport java.awt.*;\nimport java.applet.*;\n\
    import java.net.*;\nimport java.io.*;\n\npublic class Sound2 extends Applet {\n\
    \    AudioClip mytune;\n    URL mytuneUrl;\n    InputStream inst;\n    boolean\
    \ playing = false;\n    String message = \" \";\n\n    public void init() {\n\
    \        try{\n            mytuneUrl = new URL(getCodeBase(), \"mytune.au\");\n\
    \            inst = mytuneUrl.openStream();\n        } catch(MalformedURLException\
    \ e)\n        {\n        } catch(IOException e)\n        {\n            message\
    \ = \"Failed to find sound file\";\n        }\n\n        mytune = getAudioClip(mytuneUrl);\n\
    \        mytune.loop();\n        playing = true;\n    }\n\n    public void start()\
    \ {\n        if (playing)\n            mytune.loop();\n    }\n\n    public void\
    \ stop() {\n        if (playing)\n            mytune.stop();\n    }\n\n    public\
    \ void paint(Graphics g) {\n        g.drawString(message,0,30);\n        g.setFont(new\
    \ Font(\"SansSerif\",Font.BOLD,30));\n        g.drawString(\"Welcome to my world\"\
    ,50,100);\n    }\n}\n```\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_163_0.png)\n\
    \n- playing is true when loop() is active\n- Indicates that loop() is active\n\
    - (playing) is the same as (playing==true)\n- The loop has been stopped, but playing\
    \ is still true\n\n## Text layout\n\nIf you want to place text accurately, the\
    \ FontMetrics methods will give you the height, width and other measurements,\
    \ of text written in a given font. The example below creates a FontMetrics object\
    \ `metrics`, which is linked to Font f. It uses the methods `getHeight()` to set\
    \ the vertical spacing between lines, and `stringWidth()` to find the width of\
    \ each string. If a string will fit on the line after an existing one, it is placed\
    \ there, otherwise, it is displayed on the next line.\n\nI've designed the program\
    \ to take its text and font size as parameters, to make experimentation easier.\
    \ They could be written directly into the applet if you prefer.\n\n## Fonts1.java\
    \ (Applet)\n\n```java\nimport java.awt.*;\nimport java.applet.*;\n\npublic class\
    \ Fonts1 extends Applet\n{\n    Font f;\n    FontMetrics metrics;\n    int size;\n\
    \    int textSize;\n    int textWidth;\n    String[] text = new String[4];\n\n\
    \    public void init() {\n        text[0] = getParameter(\"line0\");\n      \
    \  text[1] = getParameter(\"line1\");\n        text[2] = getParameter(\"line2\"\
    );\n        text[3] = getParameter(\"size\");\n        f = new Font(\"Serif\"\
    ,0,fsize);\n        metrics = getFontMetrics(f);\n        resize(400,250);\n \
    \   }\n```\n\n> `new FontMetrics(f)` would not work - FontMetrics is an abstract\
    \ class, and you cannot create an object directly from it\n\n> `resize(x,y)`\n\
    > - overriding the width and height passed from the applet\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_164_0.png)\n\
    \n```java\npublic void paint(Graphics g)\n{\n    int x = 0;\n    g.setFont(f);\n\
    \    int textHeight = metrics.getHeight();\n    int y = textHeight;\n    for (int\
    \ loop = 0; loop < textSize; loop++) {\n        int textWidth = metrics.stringWidth(text[loop]);\n\
    \        if (x + textWidth > 400) {\n            x = 0;\n            y = textHeight;\n\
    \        }\n        g.drawString(text[loop],x,y);\n        x += textWidth;\n \
    \   }\n}\n```\n\n- Find the width of each string\n- This applet is 400 wide\n\
    - Here are the parameters:\n- `line0`: \" \"\n- `line1`: \" \"\n- `line2`: \"\
    \ \"\n- `size`: \" \"\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_165_0.png)\n\
    \n# Strings and arrays\n\nIf you break a String into individual characters, you\
    \ can do with with. `toCharArray()` will convert a String to array.\n\n- `length()`\
    \ returns the length of the String.\n- `charWidth()` gives you the width of a\
    \ single character.\n- `drawChars()` in Graphics, displays more characters.\n\
    - `drawChars(string,loop,x,y)` needs to be given the position.\n\n## WaveText.java\
    \ (Applet)\n\n```java\nimport java.awt.*;\nimport java.applet.*;\nimport java.event.*;\n\
    \npublic class WaveText extends Applet implements MouseListener\n{\n String text\
    \ = \"Not drowning\";\n int length;\n char[] letter;\n Font f = new Font(\"Serif\"\
    ,Font.BOLD,24);\n FontMetrics metrics;\n\n public void init()\n{\n  length = text.length();\n\
    \  letter = text.toCharArray();\n  metrics = getFontMetrics();\n  addMouseListener(this);\n\
    }\n\npublic void destroy()\n{\n    removeMouseListener(this);\n}\n\npublic void\
    \ mouseDragged(MouseEvent e)\n{\n    int x = e.getX();\n    int y = e.getY();\n\
    \    repaint();\n}\n\npublic void mouseMoved(MouseEvent e) { }\n\npublic void\
    \ paint(Graphics g)\n{\n    int x, y;\n    g.setFont(f);\n    x = 0;\n    y =\
    \ 50;\n    for (int loop = 0; loop < length; loop++) {\n        g.drawChars(letter,loop,1,x,y);\n\
    \        x += metrics.charWidth(letter[loop]);\n        y = 50 + (int)(java.lang.Math.random()*20)\
    \ - 10;\n    }\n}\n```\n\n- letter[ ] is the same size as the String\n- When the\
    \ mouse is dragged, along for the width of the text waves\n- Moves the print position\
    \ along for the width of the current character\n- Produces a value in the range\
    \ of 50 +/- 10\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_167_0.png)\n\n# Exercises\n\
    \n- 1 Design and write a simple 'jigsaw' applet. It should have an array, holding\
    \ a set of images which form a picture when moved into the right places. To create\
    \ the pieces, take a picture and cut it to equal size pieces, saving each as a\
    \ GIF. If the names are in a series, e.g. \"pic0.gif\", \"pic1.gif\", \"pic2.gif\"\
    , etc., you will be able to generate their names as you run through the loop to\
    \ load the files. The name-making line will look something like this: `name =\
    \ \"pic\" + loop + \".gif\";`\n\n- 2 Write an applet which roll the characters\
    \ in a string, shifting each one to the left and bringing the first round to the\
    \ end of the string. The rolling should be repeated until the characters are back\
    \ in their original places.\n\nHints: Include a delay if you want to see anything!\n\
    \nClear old text off the drawing area before displaying the characters again,\
    \ or you will get a nasty blur!\n"
  mdcn: "\n\n# 音频控制\n\nSound1 是“廉价且实用”编程方法的一个极佳示例——它代码很短且有效，只要一切正常，它在有限范围内就能良好工作。但如果你要将程序发布到变幻万测的大外世界，那里可能发生任何事情，那么就需要进行一些改进。\n\
    \n## 检查文件\n\n如果声音文件不在它应该在的位置，或者未能送达用户会发生什么？如果 `play(URL)` 或 `getAudioClip()` 找不到文件，它们都不会返回错误报告——程序将无声地运行。这可能是可以接受的。如果不可接受，那么有一个解决办法——但这个方案并不整洁。\n\
    \n根本问题在于，你可以创建一个指向不存在的文件的 URL，而很少有使用 URL 的方法会抱怨！其中一个方法会在 `openStream()` 时抛出异常。要使用该方法，我们必须先将\
    \ URL 创建为一个对象，然后尝试打开一个流（通向文件的链接）。\n\n```java\ntry\n{\n  mytuneURL = new URL(getCodeBase(),\"\
    mytune.au\");\n  inst = mytuneURL.openStream();\n} catch(MalformedURLException\
    \ e)\n{\n} catch(IOException e)\n{\n  message = \"Failed to find sound file\"\
    ;\n}\n```\n\n`URL(...)` 行会抛出 `MalformedURLException`——它并不测试文件是否真实存在，必须被捕获，尽管你对此无法做任何事情。`openStream()`\
    \ 会抛出 `IOException`，而我们在它的 `catch` 块中编写了用于响应文件缺失的代码。\n\n## 停止与启动\n\n如果你在浏览器中运行\
    \ Sound1 而不是 AppletViewer，你可能会注意到一个非常恼人的效果：当你离开包含该 applet 的页面后，循环声音仍会继续播放！解决方案是在\
    \ applet 的 `stop()` 方法中关闭它，该方法在 applet 移视图时运行。以防用户返回 applet，你应该在 `start()` 方法中重启循环。\n\
    \n## Sound2.java (Applet)\n\n```java\nimport java.awt.*;\nimport java.applet.*;\n\
    import java.net.*;\nimport java.io.*;\n\npublic class Sound2 extends Applet {\n\
    \    AudioClip mytune;\n    URL mytuneUrl;\n    InputStream inst;\n    boolean\
    \ playing = false;\n    String message = \" \";\n\n    public void init() {\n\
    \        try{\n            mytuneUrl = new URL(getCodeBase(), \"mytune.au\");\n\
    \            inst = mytuneUrl.openStream();\n        } catch(MalformedURLException\
    \ e)\n        {\n        } catch(IOException e)\n        {\n            message\
    \ = \"Failed to find sound file\";\n        }\n\n        mytune = getAudioClip(mytuneUrl);\n\
    \        mytune.loop();\n        playing = true;\n    }\n\n    public void start()\
    \ {\n        if (playing)\n            mytune.loop();\n    }\n\n    public void\
    \ stop() {\n        if (playing)\n            mytune.stop();\n    }\n\n    public\
    \ void paint(Graphics g) {\n        g.drawString(message,0,30);\n        g.setFont(new\
    \ Font(\"SansSerif\",Font.BOLD,30));\n        g.drawString(\"Welcome to my world\"\
    ,50,100);\n    }\n}\n```\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_163_0.png)\n\
    \n- 当 `loop()` 激活时，`playing` 为 true\n- 表示 `loop()` 激活状态\n- (playing) 等同于 (playing==true)\n\
    - 循环已停止，但 `playing` 仍为 true\n\n## 文本布局\n\n如果你想准确地放置文本，`FontMetrics` 方法将为你提供给定字体写入文本的高度、宽度和其他测量值。下面的示例创建了一个与字体\
    \ f 关联的 FontMetrics 对象 `metrics`。它使用 `getHeight()` 方法设置行之间的垂直间距，并使用 `stringWidth()`\
    \ Find每个字符串的宽度。如果一个字符串可以放在现有字符串之后的行内，它会被放置在那里；否则它将显示在下一行。\n\n我设计了该程序接收文本和字体大小作为参数，以便于实验。如果你愿意，也可以将它们直接写入\
    \ applet 中。\n\n## Fonts1.java (Applet)\n\n```java\nimport java.awt.*;\nimport\
    \ java.applet.*;\n\npublic class Fonts1 extends Applet\n{\n    Font f;\n    FontMetrics\
    \ metrics;\n    int size;\n    int textSize;\n    int textWidth;\n    String[]\
    \ text = new String[4];\n\n    public void init() {\n        text[0] = getParameter(\"\
    line0\");\n        text[1] = getParameter(\"line1\");\n        text[2] = getParameter(\"\
    line2\");\n        text[3] = getParameter(\"size\");\n        f = new Font(\"\
    Serif\",0,fsize);\n        metrics = getFontMetrics(f);\n        resize(400,250);\n\
    \    }\n```\n\n> `new FontMetrics(f)` 将无法工作——FontMetrics 是一个抽象类，你无法直接从它创建对象\n\n\
    > `resize(x,y)`\n> - 重写从 applet 传递的宽度和高度\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_164_0.png)\n\
    \n```java\npublic void paint(Graphics g)\n{\n    int x = 0;\n    g.setFont(f);\n\
    \    int textHeight = metrics.getHeight();\n    y = textHeight;\n    for (int\
    \ loop = 0; loop < textSize; loop++) {\n        int textWidth = metrics.stringWidth(text[loop]);\n\
    \        if (x + textWidth > 400) {\n            x = 0;\n            y = textHeight;\n\
    \        }\n        g.drawString(text[loop],x,y);\n        x += textWidth;\n \
    \   }\n}\n```\n\n- 获取每个字符串的宽度\n- 该 applet 宽度为 400\n- 这里是参数：\n- `line0`: \" \"\n\
    - `line1`: \" \"\n- `line2`: \" \"\n- `size`: \" \"\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_165_0.png)\n\
    \n# 字符串与数组\n\n如果你将字符串拆分为单个字符，你可以使用 `toCharArray()` 完成。\n\n- `length()` 返回字符串的长度。\n\
    - `charWidth()` 给你单个字符的宽度。\n- `drawChars()` 在 Graphics 中绘制字符。\n- `drawChars(string,loop,x,y)`\
    \ 需要位置。\n\n## WaveText.java (Applet)\n\n```java\nimport java.awt.*;\nimport java.applet.*;\n\
    import java.event.*;\n\npublic class WaveText extends Applet implements MouseListener\n\
    {\n String text = \"Not drowning\";\n int length;\n char[] letter;\n Font f =\
    \ new Font(\"Serif\",Font.BOLD,24);\n FontMetrics metrics;\n\n public void init()\n\
    {\n  length = text.length();\n  letter = text.toCharArray();\n  metrics = getFontMetrics();\n\
    \  addMouseListener(this);\n}\n\npublic void destroy()\n{\n    removeMouseListener(this);\n\
    }\n\npublic void mouseDragged(MouseEvent e)\n{\n    int x = e.getX();\n    int\
    \ y = e.getY();\n    repaint();\n}\n\npublic void mouseMoved(MouseEvent e) { }\n\
    \npublic void paint(Graphics g)\n{\n    int x, y;\n    g.setFont(f);\n    x =\
    \ 0;\n    y = 50;\n    for (int loop = 0; loop < length; loop++) {\n        g.drawChars(letter,loop,1,x,y);\n\
    \        x += metrics.charWidth(letter[loop]);\n        y = 50 + (int)(java.lang.Math.random()*20)\
    \ - 10;\n    }\n}\n```\n\n- `letter[ ]` 与字符串的大小相同\n- 当鼠标被拖动时，沿文本宽度移动\n- 移动打印位置，沿当前字符宽度\n\
    - 产生一个 50 +/- 10 范围内的值\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_167_0.png)\n\
    \n# 练习\n\n- 1 设计并编写一个简单的拼图游戏 applet。它应该有一个数组，存储一组移动到正确位置后就能形成图片的图像。要创建碎片，请拍摄一张照片并将其切割成等大小的部分，每个部分保存为\
    \ GIF。如果文件名是系列化的，例如 \"pic0.gif\", \"pic1.gif\", \"pic2.gif\" 等，你可以在运行循环加载文件时生成它们的名称。生成名称的行看起来像这样：`name\
    \ = \"pic\" + loop + \".gif\";`\n\n- 2 编写一个 applet，滚动字符串中的字符，将每个字符向左移动，并将第一轮带到字符串的末尾。重复滚动，直到字符回到原始位置。\n\
    \n提示：如果你想看到效果，请包含延迟！\n\n在再次显示字符之前，清除绘制区域的旧文本，否则会产生严重的模糊！\n\n"
