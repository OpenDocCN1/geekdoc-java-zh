    Java offers several ways to handle colour-setting. The intensity of each colour,
    in the order Red – Green – Blue, on a scale of 0 (off) to 255 (brightest); e.g.
    80,64 gives a reddish-brown.


    In theory, this can give a range of 24 million colours, how how many are actually
    displayed depends upon the graphics system – you may well find that your screen
    resolves the colours to a far smaller set.


