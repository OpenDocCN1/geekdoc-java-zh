  - "[PAGE 75]\n\nHere's a better solution. The if ... else structure gives two branches\
    \ from the same test – one to follow if it is true, and one if it is false. This\
    \ can be extended to handle multiple branching.\n\n```\nif (test1)\n    (statement(s)\
    \ if test1 is true)\n  else if (test2)\n    (statement(s) if test2 is true)\n\
    \  ...\n  else\n    (statement(s) if no tests are true)\n```\n\nIf test1 is false,\
    \ the program tries test2, and failing that, tries the next. If all the tests\
    \ prove false, the program performs the statements after the final else. Here's\
    \ a better solution to the character analysis problem.\n\n# AsciiElse.java (application)\n\
    \n```\nclass AsciiElse\n{\n    public static void main(String[ ] args)\n    {\n\
    \        char letter;\n        do\n            letter = (char)(java.lang.Math.random()\
    \ * 128);\n            System.out.println(\"Non-printing\");\n        else if\
    \ (letter >= ' ' && letter <= '~')\n            System.out.println(letter + \"\
    \ Lower case\");\n        else if (letter >= 'A' && letter <= 'Z')\n         \
    \   System.out.println(letter + \" Upper case\");\n        else if (letter >=\
    \ '0' && letter <= '9')\n            System.out.println(letter + \" Digit\");\n\
    \        else\n            // If flow reaches here, the character is not non-printing,\
    \ not a letter and not a digit\n            System.out.println(letter + \" Symbol\"\
    );\n    } while(letter != ' ');\n}\n```"
- md: "\n## Switch\n\nThe switch structure can be used to replace a whole set of statements,\
    \ where these all test the same simple variable for different values. A typical\
    \ use would be with a menu, where the switch directs the flow to the chosen option's\
    \ routine. The basic shape of the structure is:\n\n```\nswitch (var) {\n  case\
    \ value1 : statement(s); break;\n  case value2 : statement(s); break;\n  default\
    \ : statement(s); break;\n}\n```\n\n- The var being tested will typically be an\
    \ int or char.\n- The values must be literal values – not other variables.\n-\
    \ The switch does a simple match, comparing each of the values with the var –\
    \ you cannot use the relational operators.\n- The flow runs from one line to the\
    \ next, unless you put a break at the end to force it to jump out of the switch\
    \ block.\n- The statements on the (optional) default line are performed if there\
    \ are no matching cases.\n- You can test only one value with each case. If several\
    \ values lead to the same actions, write them on successive lines. e.g.: case\
    \ 'q';\n  case 'Q' : (exit routine)...\n\nThe following program shows switch at\
    \ work. The choice value is read from the keyboard – and look for a moment at\
    \ that reading routine.\n\n```\nchoice = (char)System.in.read();\nexcess = (char)System.in.read();\n\
    excess = (char)System.in.read();\n```\n\nYou must press [Enter] to get the data\
    \ from the buffer – but the [Enter] keystroke is itself stored in the buffer.\
    \ In a PC, the keystroke is two characters – ‘line feed’, move the cursor to the\
    \ next line, and ‘carriage return’, move it to the left of the screen. In some\
    \ systems the [Enter] keystroke is a single newline character. These surplus characters\
    \ must be read and discarded – hence the excess... lines.\n\n66\n\n## Switch1.java\
    \ (application)\n\n```\nclass Switch1\n{\n    public static void main(String [\
    \ ] args)\n    throws java.io.IOException {\n        char choice, excess;\n  \
    \      System.out.println(\"Start a new file....1\");\n        System.out.println(\"\
    Open a file.......2\");\n        System.out.println(\"Save the file.......3\"\
    );\n        System.out.println(\"Exit........4\");\n        do {\n           \
    \ System.out.println(\"Type your choice and press [Enter]\");\n            choice\
    \ = (char)System.in.read();\n            excess = (char)System.in.read();\n  \
    \          switch (choice) {\n                case '1': System.out.println(\"\
    Starting\"); break;\n                case '2': System.out.println(\"Opening\"\
    ); break;\n                case '3': System.out.println(\"Saving\"); break;\n\
    \                case '4': System.out.println(\"Goodbye\"); break;\n         \
    \       default: System.out.println(\"Invalid option\");\n            }\n    \
    \    } while (choice != '4');\n    }\n}\n```\n\nThe exception handling is needed\
    \ for the read() method (see page 72)\n\nTry it without these lines or or put\
    \ // at the start to turn them into comments\n\nThese are the digits '1', '2',\
    \ '3', '4' not number values.\n\n## Here's a typical output:\n\n- Start a new\
    \ file....1\nOpen a file.......2\nSave the file.......3\nExit........4\nType your\
    \ choice and press [Enter]\n2\nOpening\nType your choice and press [Enter]\n4\n\
    Goodbye\n\n## Using methods\n\nYou can write a program as a single block of code,\
    \ but beyond a certain size, such programs become hard to read and hard to debug.\
    \ A better solution is to divide the code into distinct blocks, of which is defined\
    \ as a new method. main() calls (transfers to) the method when it needs to execute\
    \ its code, and after its execution, the flow returns from the method to main().\
    \ This process can be taken further, with one new method calling another. Program\
    \ flow always returns to the line after the call.\n\nThe example below is actually\
    \ very short, but I'm not going to ask you to type in lots of lines just to provide\
    \ a point!\n\nFirst, here's the program as one block of code. It raises a number\
    \ to integer power, using a loop. To see how it works, dry run the program on\
    \ paper:\n\n| loop | temp | number |\n| :--- | :--- | :--- |\n| 1 | 4 | 4 |\n\
    | 2 | 4 | 16 |\n| 3 | 16 | 64 |\n| 4 | 64 | 256 |\n\n```java\nPower (application)\n\
    class Power {\n    public static void main(String[] args) {\n        int number\
    \ = 4;\n        int p = 3;\n        int temp = 1;\n        int loop;\n\n     \
    \   for (loop = 1; loop <= p; loop++) {\n            temp = temp * number;\n \
    \       }\n        System.out.println(number + \" to the power of \" + p + \"\
    \ = \" + temp);\n    }\n}\n```\n\nNow let's see how it works, in this first version,\
    \ the parameters are transferred to the method.\n\n## PowerMethod1.java (application)\n\
    \n```java\nclass PowerMethod1 {\n    public static void main(String[] args) {\n\
    \        int number = 4;\n        int p = 3;\n        int temp = 1;\n        int\
    \ loop;\n\n        for (loop = 1; loop <= p; loop++) {\n            temp = temp\
    \ * number;\n        }\n        System.out.println(number + \" to the power of\
    \ \" + p + \" = \" + temp);\n    }\n\n    public static int powerOf(int n, int\
    \ p) {\n        int temp = 1;\n        int loop;\n        for (loop = 1; loop\
    \ <= p; loop++) {\n            temp = temp * n;\n        }\n        return temp;\n\
    \    }\n}\n```\n\n## Parameters\n\nWhen passing values to a method, it can be\
    \ either a variable or a literal. This would work:\n\npowerOf(5, 3)\n\nA method\
    \ that returns a value must be treated as a value. You cannot call it with a simple\
    \ statement:\n\npowerOf(5);\n\nThis would work for a void method, but if a value\
    \ is returned it must be assigned to a variable, printed or otherwise used as\
    \ a value. This would work:\n\nSystem.out.println(\"The answer is \" + powerOf(5,\
    \ 3));\n\n## Return values\n\nLet's turn our attention to the start of the definition\
    \ line.\n\n public says that the method can be accessed by other methods. static\
    \ allocates memory space for its variables. void refers to the value returned\
    \ by the method.\n\nvoid methods return nothing, but methods can return values\
    \ of any type. If you have used other languages, void methods act as subroutines,\
    \ while those returning values act as functions.\n\n## PowerMethod2.java (application)\n\
    \n```java\nclass PowerMethod2 {\n    public static void main(String [ ] args)\
    \ {\n        int number = 4;\n        int p = 3;\n        int ans;\n        ans\
    \ = powerOf(number,p);\n        System.out.println(number + \" to the power of\
    \ \" + p + \" = \" + ans);\n    }\n\n    public static int powerOf(int n, int\
    \ p) {\n        int temp = 1;\n        int loop;\n        for (loop = 1; loop\
    \ <= p; loop++) {\n            temp = temp * n;\n        }\n        return temp;\n\
    \    }\n}\n```\n"
  mdcn: "\n\n## switch（分支）\n\nswitch 结构可以用于替换一组语句，这些语句都对同一个简单变量进行不同值的测试。一个典型的用法是菜单，通过\
    \ switch 将执行流引导至所选选项的程序。该结构的基本形状如下：\n\n```\nswitch (var) {\n  case value1 : statement(s);\
    \ break;\n  case value2 : statement(s); break;\n  default : statement(s); break;\n\
    }\n```\n\n- 被测试的 var 通常是一个整数（int）或字符（char）。\n- 这些值必须是字面量值——而不是其他变量。\n- switch\
    \ 执行简单的匹配，将每个值与 var 进行比较——你不能使用关系运算符。\n- 程序的执行流会从一行运行到下一行，除非你在末尾放置一个 `break` 来强制让它跳出\
    \ switch 块。\n- 如果没有匹配的 case，则执行（可选的）`default` 线路上的语句。\n- 每个 case 只能测试一个值。如果多个值导致导致相同的操作，请将它们写在连续的行上。例如：case\
    \ 'q';\n  case 'Q' : (退出程序)...\n\n下面的程序展示了 switch 的用法。选择值是从键盘读取的——让我们看一眼那个读取程序。\n\
    \n```\nchoice = (char)System.in.read();\nexcess = (char)System.in.read();\nexcess\
    \ = (char)System.in.read();\n```\n\n你必须按下 [Enter] 来从缓冲区获取数据——但 [Enter] 键本身也存储在缓冲区中。在\
    \ PC 中，该按键是两个字符——“换行”（将光标移动到下一行）和“回车”（将它移动到屏幕左侧）。在某些系统中，[Enter] 键是一个单一换行符。这些多余的字符必须被读取并丢弃——这就是那些\
    \ `excess...` 行的原因。\n\n66\n\n## Switch1.java (应用程序)\n\n```\nclass Switch1\n{\n\
    \    public static void main(String [ ] args)\n    throws java.io.IOException\
    \ {\n        char choice, excess;\n        System.out.println(\"Start a new file....1\"\
    );\n        System.out.println(\"Open a file.......2\");\n        System.out.println(\"\
    Save the file.......3\");\n        System.out.println(\"Exit........4\");\n  \
    \      do {\n            System.out.println(\"Type your choice and press [Enter]\"\
    );\n            choice = (char)System.in.read();\n            excess = (char)System.in.read();\n\
    \            switch (choice) {\n                case '1': System.out.println(\"\
    Starting\"); break;\n                case '2': System.out.println(\"Opening\"\
    ); break;\n                case '3': System.out.println(\"Saving\"); break;\n\
    \                case '4': System.out.println(\"Goodbye\"); break;\n         \
    \       default: System.out.println(\"Invalid option\");\n            }\n    \
    \    } while (choice != '4');\n    }\n}\n```\n\n`read()` 方法需要异常处理（见第 72 页）\n\n\
    尝试在没有这些行的情况下运行，或者在开头加上 `//` 将它们变成注释\n\n这些是数字 '1'、'2'、'3'、'4'而不是数值。\n\n## 这是一个典型的输出：\n\
    \n- Start a new file....1\nOpen a file.......2\nSave the file.......3\nExit........4\n\
    Type your choice and press [Enter]\n2\nOpening\nType your choice and press [Enter]\n\
    4\nGoodbye\n\n## 使用方法\n\n你可以将程序写成一个代码块，但超过一定尺寸后，这些程序将变得难以阅读和调试。更好的解决方案是将代码分成不同的块，每个块被定义为一个新方法。当\
    \ `main()` 需要执行其代码时，它会调用（跳转到）方法，执行完成后，流从方法返回到 `main()`。这个过程可以进一步，即一个新方法调用另一个方法。程序流始终返回到调用之后的一行。\n\
    \n下面的示例实际上非常短，但我不会要求你输入很多行仅仅为了说明一个观点！\n\n首先，这是作为一个代码块的程序。它使用循环将数字转换为整数幂。要查看它是如何工作的，请在纸上对程序进行干跑运行：\n\
    \n| loop | temp | number |\n| :--- | :--- | :--- |\n| 1 | 4 | 4 |\n| 2 | 4 | 16\
    \ |\n| 3 | 16 | 64 |\n| 4 | 64 | 256 |\n\n```java\nPower (application)\nclass\
    \ Power {\n    public static void main(String[] args) {\n        int number =\
    \ 4;\n        int p = 3;\n        int temp = 1;\n        int loop;\n\n       \
    \ for (loop = 1; loop <= p; loop++) {\n            temp = temp * number;\n   \
    \     }\n        System.out.println(number + \" to the power of \" + p + \" =\
    \ \" + temp);\n    }\n}\n```\n\n现在让我们看看它是如何工作的，在第一个版本中，参数被传递给方法。\n\n## PowerMethod1.java\
    \ (应用程序)\n\n```java\nclass PowerMethod1 {\n    public static void main(String[]\
    \ args) {\n        int number = 4;\n        int p = 3;\n        int temp = 1;\n\
    \        int loop;\n\n        for (loop = 1; loop <= p; loop++) {\n          \
    \  temp = temp * number;\n        }\n        System.out.println(number + \" to\
    \ the power of \" + p + \" = \" + temp);\n    }\n\n    public static int powerOf(int\
    \ n, int p) {\n        int temp = 1;\n        int loop;\n        for (loop = 1;\
    \ loop <= p; loop++) {\n            temp = temp * n;\n        }\n        return\
    \ temp;\n    }\n}\n```\n\n## 参数\n\n向方法传递值时，可以可以是变量也可以是字面量。这样做是有效的：\n\npowerOf(5,\
    \ 3)\n\n返回值的方法必须被视为一个值。你不能用简单的语句调用它：\n\npowerOf(5);\n\n这对于 `void` 方法是有效的，但如果返回了值，必须将其赋值给变量、打印或作为值使用。这样做是有效的：\n\
    \nSystem.out.println(\"The answer is \" + powerOf(5, 3));\n\n## 返回值\n\n让我们关注定义行的开头。\n\
    \n public 表示该方法可以被其他方法访问。static 为其变量分配内存空间。void 指方法返回的值。\n\nvoid 方法不返回任何内容，但方法可以返回任何类型的值。如果你使用过其他语言，`void`\
    \ 方法相当于子程序，而返回值的方法相当于函数。\n\n## PowerMethod2.java (应用程序)\n\n```java\nclass PowerMethod2\
    \ {\n    public static void main(String [ ] args) {\n        int number = 4;\n\
    \        int p = 3;\n        int ans;\n        ans = powerOf(number,p);\n    \
    \    System.out.println(number + \" to the power of \" + p + \" = \" + ans);\n\
    \    }\n\n    public static int powerOf(int n, int p) {\n        int temp = 1;\n\
    \        int loop;\n        for (loop = 1; loop <= p; loop++) {\n            temp\
    \ = temp * n;\n        }\n        return temp;\n    }\n}\n```\n\n"
