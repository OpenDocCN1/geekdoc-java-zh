    Add that line to main(), compile and run the program again. The output this time
    should be:


    +   4 to the power of 3 = 64

    5 to the power of 5 = 3125


    You must pass the same number of values – and in the right order. This would not
    compile:

    powowerOf(5);


    if we had written the method to cope with double values, with this definition
    line:

    public static powerOf(double n, int p)


    then it could be called by these lines:

    double num...

    powowerOf(num, p)

    powowerOf(5.234, 3)


    # Return values


    Let''s turn our attention to the start of the definition line.

    public static void...


    +   public says that the method can be accessed by other methods.

    static allocates permanent memory space for its variables.

    void refers to the value returned by the method.


    void methods return nothing, but methods can return values of any type. If you
    have used other programming languages, void methods act as subroutines, while
    those returning values act as functions.


    Here''s the Power program again, this time rewritten so that the powowerOf() method
    returns an int value.


