    \ {\n            prompt.setText(\"Too high. Try again\");\n        } else {\n\
    \            prompt.setText(\"Found it!\");\n        }\n    }\n}\n```\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_123_0.png)\n\
    \n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_123_1.png)\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_123_2.png)\n\
    \n## Choices and Lists\n\nA Choice object is a drop-down list, from which the\
    \ user can select one item. A List object is displayed in full, or in a scrollable\
    \ box, and the user can normally select several items. So, although the two types\
    \ of Components are set up with similar routines, a different approach is needed\
    \ for checking and recording selections.\n\n## addItem()\n\nWith CheckboxGroup,\
    \ each of its Checkboxes is a separate object which must be created individually.\
    \ The opposite applies to Choices and Lists. A Choice (or List) is a single Component,\
    \ and its options are an integral part of it. At its simplest, a Choice could\
    \ be set up like:\n\n```java\nChoice c = new Choice();\nc.addItemListener(this);\n\
    c.addItem(\"Option 1\");\nc.addItem(\"Option 2\");\nadd(c);\n```\n\nNotice that\
    \ we are using an ItemListener, as for Checkboxes, but we only need one to handle\
    \ the whole set. A List is set up in the same way, except that addItem() is replaced\
    \ by add():\n`partsList.add(\"Another option\");`\n\n## The index\n\nOptions are\
    \ displayed on screen, in the order of their addItem() lines. They are also stored\
    \ within the Choice in their order, and can be identified by their index value,\
    \ starting from 0. You can use the index to set default values. For example, to\
    \ set \"Option 2\" as the initial selection, you would use the select() method,\
    \ like:\n\n```java\nc.select(1);\n```\n\nAfter the user has made a choice, you\
    \ can read the index value to find out what it was:\n\n```java\nchosen = c.getSelectedIndex();\n\
    ```\n\nAn index is rarely used in its raw form. You normally would want to use\
    \ it to select an action or set another variable. This could be done through an\
    \ if... else... block, as we did with the CheckboxGroup in the last program. The\
    \ index could also be used to drive a switch block:\n\n```java\nswitch (c.getSelectedIndex())\
    \ {\n  case 0: ...action for 0...; break;\n  case 1: ...action for 1...; break;\n\
    \  ...\n}\n```\n\nThere's another approach which can prove very convenient. Think\
    \ for a moment arrays. An array is a set of elements, each of which can be identified\
    \ by a subscript – in effect, the same structure as a Choice or List.\n\nThe next\
    \ program allows its users to specify their own PC. It has a Choice, micro, which\
    \ lists processors. In the action() method you will find these lines:\n\n```java\n\
    p = micro.getSelectedIndex();\nspec.setText(\"Pentium \"+procType[p] + \" at \"\
    +procCost[p] + \"\\n\");\n```\n\nThe index is assigned to p, which is then used\
    \ to pull corresponding values from the procType[] and procCost[] arrays – these\
    \ are set up in init() and hold the type number and price of the processors.\n\
    \ngetSelectedIndex is of little use with a List, where several items can be selected\
    \ at once. (Though you can force single item selection with setMultipleMode(false)).\n\
    \nTo find out if an item has been selected, use the isSelectedIndex() method.\
    \ Give this index number of the item, and it will return true if the item is selected.\
    \ In the example, this is used to pick values from the peripheral[] array. The\
    \ names of selected peripherals are then added to the spec TextArea.\n\n```java\n\
    for(int loop = 0; loop < 8; loop++)\n  if(parts.isSelected(loop))\n    spec.append(periph[loop]\
    \ + \"\\n\");\n```\n\nLook at the program, and you will see that this selection\
    \ is only done when the \"Done\" button is pressed – not when an item is selected.\n\
    \nWhy is this?\n"
