    \  int misses = 0;\n  boolean ontarget = false;\n  Thread target = null;\n\n \
    \ public void init() {\n    addMouseListener(this);\n  }\n\n  public void start()\
    \ {\n    if(target == null) {\n      target = new Thread(this);\n      target.start();\n\
