  - '[PAGE 152]


    # Image files


    Like Web browsers, Java is designed to handle graphics files in two formats -
    GIF (including animated GIFs) and JPEG (with either a JPEG or a .JPG extension).
    It cannot cope with the standard Windows Wide formats BMP and PCX. If you want
    to create your own images, you will need a suitable graphics application, such
    as Paint Shop Pro. You can use this for drawing new images, or for converting
    pictures created in Paint – almost anywhere else – into the GIF or JPEG formats.


    As a general rule, you should use the GIF format in preference to JPEG. GIF files
    are significantly smaller, and therefore faster to load – an important consideration,
    especially when files have to be transferred over the World Web. The main reason
    why GIF files are larger is that they have palettes of 16.7 million colours, as
    opposed to the 256-colour palette of GIFs. Use JPEGs only where you need to show
    subtle variations of colour over a huge palette – and if the file is going up
    onto the Web, remember that many people will be viewing it on 256, or even 16-colour
    screens!


    An animated GIF is a set of images, which are displayed in sequence, with a defined
    delay between each. They are used in exactly the way as still images – the animation
    is entirely built into the image file, so all Java has to do is display it. The
    main things to remember here are that the files tend to be large, and that the
    animation speed is defined within the GIF. There are plenty of ready-made animated
    GIFs freely available on the Web – dig around in any shareware site and if you
    want to create your own, go to Microsoft’s site and find lots – and if you want
    to pick up a copy of GIF Animator.


    > Take note

    You can normally convert JPEG files to GIFs without significant loss of colour
    definition.


    ![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_152_0.png)


