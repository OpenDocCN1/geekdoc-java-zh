    \nWe’ll come back to exceptions as we need to, later in the book.\n\n# ReadChar.java\
    \ (application)\n\n```\nclass ReadChar{\n    public static void main(String[]\
    \ args)\n    throws java.io.IOException\n    {\n        char c;\n        System.out.println(\"\
    Hit a key and press [Enter]\");\n        c = (char)System.in.read();\n       \
    \ System.out.println(\"You typed \" + c);\n    }\n}\n```\n\n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_47_0.png)\n\
