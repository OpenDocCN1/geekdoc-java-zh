    \ holds all the thread's code. The addition of `implements Runnable` to the class\
    \ line brings in the interface:\n\n```java\npublic class Counter implements Applet,\
    \ Runnable\n```\n\nThe thread is declared at class level, but set to null. When\
    \ `start()` is executed, an instance is created and the thread's `start()` method\
    \ is called. This calls `run()`, to execute the thread code.\n\n```java\nThread\
    \ timer = null;\n```\n\n```java\ntimer = new Thread(this);\ntimer.start();\n```\n\
    \nIn `run()`, there is a first check to see if the thread is active – if the user\
    \ leaves and returns to the applet, `start()` will be executed, and you do not\
    \ want to create a second instance.\n\n```java\nwhile (timer != null)\n```\n\n\
    If it is, the thread waits for a second, updates a counter and repaints the display.\n\
    \n```java\ntry\n{Thread.sleep(1000);}\ncatch (InterruptedException e){}\ncount++;\n\
    repaint();\n```\n\nThe `sleep()` method works in milliseconds, so 1000 = 1 second.\
