    # Preface


    The Java programming language has been designed for portability.

    The same Java code can be downloaded from the Internet and run,

    without change, on a Sun workstation running Unix, a Windows PC or

    an Apple. It is mainly used to create applets on Web pages, but is

    capable of producing full-scale applications.


    The language is based upon C++, and is very similar in its style and

    structures. It is a large and wordy language. Gaining full proficiency in

    it must take time – only because of the amount to be learned.

    However, its structures follow a clear pattern, so that once the

    essentials have been mastered, it is relatively easy to extend one''s

    knowledge.


    This book is not intended for proficient C++ programmers who want

    transfer to Java – there are plenty of other books already on the

    shelves that do that job. It is aimed at those who have little or

    no experience of programming, and it starts from scratch. I have

    concentrated on the basic concepts and practical uses of the language,

    and tried to avoid getting bogged down in technicalities. Purists may

    object to some over-simplifications – I hope you will appreciate them!


    Java Made Simple will take you to the point where you can

    write small applets for your Web pages, and give you the foundations

    the confidence to go further into the language, if you wish to

    develop larger applications. Each feature is demonstrated at work in

    an applet or a short program, as new concepts are learned through

    practical examples. You will find exercises at the end of each chapter

    – use to test your knowledge and experiment with new ideas.


    The text files for the larger programs, and for all the answers to the

    exercises, can be found on the Made Simple Programming pages at:

    http://www.madesimple.co.uk


    This second edition has been rewritten around Java 2.0. All the

    sample programs have been recompiled and updated as necessary to

    reflect the development of the language.


    Happy programming.


    P.K. McBride, macbride@tcp.co.uk


