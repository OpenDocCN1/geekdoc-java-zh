    # The Java SDK


    If you want to write Java programs, you need the SDK (Software Development Kit).
    You can get your copy, from Sun’s Java site, at:

    http://java.sun.com


    Look for the links to the SDK download area, and remember that you want the SDK,
    not the JRE (Java Runtime Environment). Find a suitable version – the SDK is available
