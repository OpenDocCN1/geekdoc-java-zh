    ## 什么是 Java?


    Java 是一种平台无关、面向对象、多线程的动态链接编程语言——它包含很多术语。我会尽量减少术语的使用，但有些是不可避免的。基于这一点，我将再次回答“什么是
    Java？”的问题。


    Java 是由 Sun Microsystems 开发的语言，主要用于万维网。它与 C++ 有许多共同点，因此如果你熟悉该语言，就已经处于理解 Java 的道路上了。本书并不假设你对
    Windows 或任何浏览器有所了解。


    ## 用 Java 可以做什么?


    通过 Java，你可以制作三种不同类型的程序——applet、应用程序和 bean。


    Applet 是嵌入到 HTML 文档中的程序。通常，它们很小——这样浏览 Web 的人就不需要等很久来下载。它们通常用于有限的目的。Applet 可以提供更流畅的网站导航方式、制作引人注目的动画，或仅仅鼓励访客经常回来。它们也可以用于更严肃的工作——例如，保险业务可以使用
    applet 来计算即时报价。


    应用程序是独立的程序。你可以用 Java 编写文字处理器、电子表格、图形工具——事实上，是任何类型的应用程序。Java 的设计理念之一是，与其在网络中的 PC
    上安装标准软件，不如在中央服务器上安装，根据需要下载到小型计算机中。这将允许更简单更便宜的升级，因为整个办公室只需要安装一次。


    这些应用程序是模块化的。而不是一个 50MB+的全功能文字处理器，你将有一个小型编辑模块，以及拼写检查、布局、打印等独立模块，可以根据需要快速下载。这种方法可以使用更小更便宜的计算机，并简化软件生产，因为相同的模块可以在不同的应用程序中用——例如，打印模块可以打印文字处理器或电子表格的文档。


    这是一个不错的主意，使用 Java 的网络计算机尚未从设计图变为桌面现实。


    Bean 将模块化方法推向了一步。这里的概念是，一个 bean 应该执行特定的有限功能，并供其他 bean、applet 或应用程序调用。


    ## 你需要学习什么?


    要开始 Java 编程，你需要理解：


    - 一些通用的编程概念，特别是面向对象的编程（见后几页）

    - 如何设置你的系统环境（在本章后文）

    - 应用程序和 applet 的基本结构（在本章后文）

    - 如何在程序中存储数据（第2章）

    - 如何控制程序的流程和顺序（第3章）

    - 如何使用 Java 的例程和结构——本书其余部分将涵盖这个庞大系统的基础。


    > 注意

    > 本专注于 applet。你可以通过它们最快地获得结果并获得最大的乐趣。


