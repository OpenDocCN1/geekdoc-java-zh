    \n![](img/e0aa6bf61b0552cacf6e87d0d5e9489a_101_0.png)\n\n```java\nimport java.awt.*;\n\
    import java.applet.*;\n\npublic class Method1 extends Applet {\n    public void\
    \ paint(Graphics g) {\n        vertical(g);\n        horizontal(g);\n    }\n \
    \   public void vertical(Graphics g) {\n        int y;\n        for (y = 25; y\
