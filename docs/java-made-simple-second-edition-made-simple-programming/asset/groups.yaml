  - '[PAGE 20]


    # Objects and classes


    When manufacturers are making cars, they does not design each one from scratch.
    Instead, they have a blueprint, and follow that – setting the colour, upholstery,
    engine size and other variables as required.


    In OO jargon, the blueprint is called a class, and an object is an instance of
    a class. The process of creating a new object is called instantiation. (I never
    said the jargon was elegant.) The distinction between class and object gets a
    bit blurred, and here’s why.


    # Inheritance


    Let’s look in on the design studio of the car manufacturer. Their new models will
    come in several versions – saloon, hatchback and estate, with a choice of 2-door
    or 4-door in each. They draw a new blueprint for each version. They start with
    a blueprint that covers the common elements, then adapt this to produce the basic
    saloon, hatchback and estate, and finally take each of to develop the 2- and 4-door
    versions. After the first, each blueprint inherits all the characteristics of
    its predecessor. It may adapt them slightly, and will add extra features of its
    own.


    For an example of inheritance with objects and classes, let’s look at the development
    of a simple database program for a car repair garage. The programmers have defined
    a simple record structure, to store the name, address, phone number and car model
    for each customer, with methods to collect these details. This class is called
    Owner and can be used to create objects in which store the customers’ data. This
    might be called Owner1, Owner2, Owner3, etc.


    If they want to care for customers with a second car, they do not need to write
    another definition, but can create a new object of the Owner class, adding space
    for the second car. This might be called RichOwner– and it becomes a class, as
    it can be used to create new objects.


    In the jargon, RichOwner is a subclass of Owner (and Owner is a super of RichOwner).
    The connection between the two continues after creation. If the Owner class is
    adapted to add date of last service, then that new field is added automatically
    to the RichOwner class.'
