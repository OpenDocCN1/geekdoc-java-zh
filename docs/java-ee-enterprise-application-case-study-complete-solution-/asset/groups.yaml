    # Figure 7: Presentation Request Processing – Class Diagram


    The following key architectural decisions have been captured by the Presentation
    Request Processing mechanisms:


    - All user requests are handled by a single web Controller (the front controller
    of the application)

    - The front controller forwards the request to the appropriate Command Handler
    with the help of resource and access mapping information stored in the form of
    an XML file (BackingBean.xml)

    - Command Handler manages user interactions for a specific use case and coors
    use case interactions with the user.

    - The Command Handlers do not perform business logic. Instead, they use Business
    delegates as the Business provider to the Application Server services.

    - The Command Handlers do not produce any User output. Instead, they call views
    to create HTML type of a stream that is returned to the user.

    - Views are implemented as JSPs.

    - Business delegates are implemented as Java Beans that run in the thread of the
    calling Delegates.


    ![](img/a46bf6e20cc12a7ad84c822666a2a2b9_59_0.png)


    Figure 8: Presentation Request Processing – Sequence Diagram


    # BUSINESS SERVICE ACCESS


    Business Service Access combines implementation strategies of the following Sun
    Java EE patterns:


    - Business Delegate

    - Session Facade

    - Service Locator


    The participant diagram and the collaboration diagram of the mechanism are shown
    below.


    ![](img/a46bf6e20cc12a7ad84c822666a2a2b9_59_1.png)


    Figure 9: Business Service Access – Class Diagram


    This mechanism is a blueprint to access the Application Server components for
    the organisation. The architecture does not allow any Presentation layer components
    (Command Handlers in particular) to communicate directly with entities. Hence
    only beans that can be accessed remotely are session beans.


    The mechanism captures the following architectural decisions:


    - All business service components are implemented as Session EJBs or have Session
    EJB facades.

    - A client (in most cases it is a Bean handlers) that requires access to a Business
    service component and creates an instance of a Business Delegate.


    As a consequence of using two mechanism of framework, the application has a distinct
    separation between presentation and business logic. The boundary is business delegates,
    which are smart proxies to business services of application. This separation is
    desirable for few reasons.


    - It provides an explicit contract between designers and developers of presentation
    tier and the business tier of the system

    - It allows the business tier to change independently from presentation tier

    - It allows for concurrent development of the two tiers.


    ![](img/a46bf6e20cc12a7ad84c822666a2a2b9_61_0.png)


    Figure 10: Business Service Access – Sequence Diagram


    # DATA SERVICE ACCESS


    The application architecture uses Local CMP Entity Beans for read/write operations
    on the database. These will handle concurrency for accounts when there are situations
    both customer and agents accessing the same details.


    ![](img/a46bf6e20cc12a7ad84c822666a2a2b9_61_1.png)


    Figure 11: Data Service Provider – Zamco


