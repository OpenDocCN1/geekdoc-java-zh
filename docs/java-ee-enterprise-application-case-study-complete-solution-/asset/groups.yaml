- md: '

    Deployment diagrams show the physical configurations of software and hardware.
    The deployment diagram complements the component diagram. It shows the configuration
    of runtime processing elements such as servers and other hardware and the software
    components, processes, and objects that they comprise. Software component instances
    represent runtime manifestations of classes. Components that do not runtime entities
    do not appear on these diagrams they are shown on component diagrams. Deployment
    diagram is a graphical representation of nodes connected by communication links
    or associations. Nodes may contain component instances, which indicate that the
    component resides and runs on the node. The deployment diagram can be used to
    show which components run on which nodes. The migration of components from node
    to node or objects from component to component may also be represented.


    ## Sequence Diagram – Use Cases to Sequence Diagrams


    Sequence diagram describes how groups of objects collaborate in some behavior
    over time. It records the behavior of a single use case. It displays objects and
    the messages passed among these objects in the use case. A design can have lots
    of methods in different classes. This makes it difficult to determine the overall
    sequence of behavior. This diagram is simple and logical, so as to make the sequence
    and flow of control obvious.


    The sequence diagram shows the explicit series of interactions as they flow through
    the system to address the desired objective or result. The sequence diagram is
    especially useful in systems with time-dependent functionality (such as real-time
    applications) and for complex scenarios where time dependencies are critical.
    It has two aspects namely Time and Various objects participating in a sequence
    of events required for a purpose.


    Usually the sequence of events to which the objects of the system subject is important
    in real-time applications, the time axis is an important measurement. This view
    identifies the roles of the objects in your system through the sequence of states
    they traverse to accomplish the goal. This view is an event driven perspective
    of the system. The relationships among the roles are not shown. Class and object
    diagrams present such static views. Sequence and interaction diagrams are dynamic.
    They describe how objects collaborate or interact. A sequence diagram is an interaction
    diagram that details the functionality and messages (requests and responses) and
    the timing. The time progresses as you move down the page. The objects involved
    in the operation are listed from left to right according to when they take part
    in the message sequence. The sequence diagram can have a clarifying note, text
    inside a dog-eared rectangle. Notes can be put into any kind of UML diagram.


    Sequence diagrams are models of business processes that represent the different
    interactions between actors and objects in the system. Each process has a process
    owner and goals (such as cycle time, defect rate, and cost) consists of a set
    of business activities (in sequence and/or in parallel).


    Sequence or collaboration diagram should be covered for each specified use case.
    Do not roll one or more cases together into a single diagram to save time. Sequence
    diagrams should be clear and broadly map to the complexity of the use case. The
    classes and components you created in the class and component diagram should be
    represented, along with the calls between them necessary to implement the use
    case being documented.


    ## Design Decisions


    This section provides highlights on the various design decisions an architect
    has to make while building the enterprise Java solutions. This section covers
    all the critical areas including, transaction, security, frameworks, hardware
    sizing, deployment models and scaling of the applications.


    ## Java EE Frameworks for Rescue


    The common practice in J2EE 1.3 and J2EE 1.4 was indeed to supplement the J2EE
    stack with quite a lot of additional frameworks.


    Starting from Java EE 5 and now certainly with Java EE 6 & 7 you don''t need additional
    frameworks as JEE provides reference implementations for all the specs. Everything
    core Spring container provided to J2EE can now be done with the lightweight EJB3.1
    and CDI component models, ORM support is provided by JPA which is often implemented
    by Hibernate. The MVC web framework is part of the standard stack via JSF.


    Of course individuals may still prefer the Spring and Struts programming APIs,
    but with Java EE 6 there is no pressing need to use them. Or put differently,
