    # Bean Managed Vs Container Managed Transaction


    The Java Platform EE platform supports two transaction-management paradigms: declarative
    transaction demarcation and programmatic transaction demarcation. Declarative
    transaction management refers to a non-programmatic demarcation of transaction
    boundaries, achieved by specifying within the deployment descriptor for the various
    methods of the container-managed EJB component. This is a flexible approach that
    facilitates changes in the application’s transactional characteristics without
    modifying any code. Container-managed transaction demarcation must be used by
    entity EJB components.'
  - '[PAGE 31]


    In bean-managed transaction demarcation, the EJB bean uses UserTransaction. Only
    session beans can choose to use bean-managed transactions. In container-managed
    transaction demarcation, the EJB container is responsible for transaction demarcation.
    Moreover, you should use container-managed transaction demarcation because it
    is less prone to error, and you should let the container handle transaction demarcation
    automatically. It frees the component provider from writing transaction demarcation
    code in the component. It is easier to group enterprise beans to perform a certain
    task with specific transaction behavior. The application assembler can customize
    the transaction attributes in the deployment descriptor without modifying the
    code.


    However, programmatic (procedural) access control is sometimes necessary to satisfy
    fine-grained or application-specific conditions.


    # Bean Managed Vs Container Managed Security


    To simplify the development process for the enterprise bean provider, the implementation
    of the security infrastructure is left to the EJB container provider and the task
    of defining security policies is left to the bean deployer. By avoiding putting
    hard-coded security policies inside bean code, EJB applications gain flexibility
    when configuring and reconfiguring security policies for complex enterprise applications.
    Applications also gain portability across different EJB servers that may use different
    security mechanisms. EJB framework specifies flexibility with regard to security
    management, allowing it to be declarative (container-managed) or programmatic
    (bean-managed).'
  - '[PAGE 32]


    Security management that defines method permissions is declared in the enterprise
    bean’s deployment descriptor or by using annotations (if using EJB 3.0). Container-managed
    security makes an enterprise bean more flexible, since it isn’t tied to the security
    rules defined by a particular application. A security role is a name given to
    a grouping of information resource permissions that are defined for an application.
    Associating a principal with this security role grants the associated access permissions
    to that principal as long as the principal is in the role.



    However, programmatic (procedural) access control is sometimes necessary to satisfy
    fine-grained or application-specific conditions. Enterprise beans can programmatically
    manage the security by using the isCallerRole() and getCallerPrincipal() methods
    contained on the EJBs context object. The isCallerRole() method tests whether
    the caller has a given security role, returning true if the caller has and false
    if not. The getCallerPrincipal() method returns the java.security.Principal that
    identifies the caller.


