    Figure 1: Java EE Framework Components


    ## Tackling Business Problem


    The analyst’s team will come up with a brief introduction to the customer background
    and the needs for a Java EE application. They will include a structured description
    of the main requirements, a domain model, use case diagrams and NFRs and you are
    expected to deliver the solution for the Java application using the Java EE technologies
    and framework.


    The business problem captured or discussed during workshops might be vague and
    may specify very high-level description of the main use cases and thus there will
    be many open questions or areas where further deep dive should be planned. The
    requirements may be incomplete namely the use case diagrams, and miss information
    necessary for the design. Therefore you have to fill the missing parts for yourself
    and replace the missing information with assumptions, perhaps adding the unclear
    element to the list of risks. This is best done through workshops, interview and
    discussion with various stakeholders from business and technology departments.
    Once the proper levels of details are available and you have the solution in your
    mind, it’s not too difficult to draw the views for the solution using a suitable
    Visual editor. One can leverage tools like MS Visio for the diagrams as they are
    very intuitive and more than solves the purpose.


    The key part of the solution itself the various diagrams or the views are the
    key outputs delivered by the architects. As an architect you have to decide which
    components or interfaces the system should have their integration into the eco-system
    and how the non-functional and functional requirements will be addressed.


    The process will also involve a considerable amount of time estimating the resource
    (Hardware) requirements of the application and exploring and comparing deployment
    environments and the non-functional characteristics for various physical vs the
    cloud options. This section will cover this methodology and approach that you
    should apply while creating your Java solution.


    The solution typically includes among other things


    - Class Diagram

    - Component Diagram that describes various tiers and components in scope

    - Deployment diagram that describes the proposed physical layout of the major
    tiers

    - Sequence or Collaboration diagram for each use case

    - Technical risks & mitigation strategies

    - Design Decision that are made for the Solutions

    - Assumptions made for the Solution


    ## Risks and Assumptions


    In this segment you are tested on the ability to recognize the top technical risks
    present in the given business scenario and the technology landscape and how these
    will be addressed by your solution. Be strategic and objective in your assessment
    of risk. Low-level risks should be avoided and high-level, systemic risks that
    would be nightmare scenarios should be included in this section. E.g In an online
    auction application, a security limitation in any form would be a major risk than
    worrying about if the application could run in multiple browsers. The mitigation
    and hopefully complete removal will be the focus of this section.


    ## Class Diagram – from Domain Model to Class Diagrams


    One has to ensure that all the objects detailed in the domain model are present
    in the class diagram. Select and commit to a method or framework that describes
    how you plan to build the solution at the web/presentation, business logic, persistence,
    and integration tiers. There are important points to note on the class diagram,
    as follows:


    - The level of details in the class diagram will include the entities, important
    manager EJBs and few other classes representing important architectural concepts
    (a cache, an interceptor, a DAO for accessing an external tool etc. which needs
    to be addressed by the solution)

    - The domain model will map to classes nearly directly, only on a few occasions
    modifications and extensions will be required e.g. introducing a base class.

    - Annotations will be used to show how specific items in the domain model are
    mapped onto JEE components specifically, session beans and Entity classes. The
    class diagram will contain important information pertaining to @Entity or @Embeddable,
    where ever applicable.

    - The class diagram remains web framework agnostic. Any web framework can be leveraged
    to build the solution.


    Class diagram may also contain types, packages, relationships, and even instances
    such as objects and links. Class diagrams are even static; they display what interacts
    but not what happens when they do interact. A class diagram can have three kinds
    of relationships:


    - Association is a relationship between instances of the two classes. An association
    exists between two classes if an instance of one class must know about the other
    to perform its work. In a diagram, an association is a link connecting two classes.

    - Aggregation is an association in which one class belongs to a collection. An
    aggregation shows a diamond end pointing to the part containing the whole.

    - Generalization is an inheritance link indicating one class is a superclass of
    another. A generalization shows a triangle pointing to the superclass.


    Using the initial list of business classes, you develop class diagrams by identifying
    and defining the relationships among the classes from the domain model. This is
    done in an interactive development workshop with business partners. It is also
    useful to keep these diagrams on display on a whiteboard or other medium, and
    to develop it gradually as the project progresses. The diagrams are stored on
    a UML tool to provide access to all team members and other interested parties.
    The class diagrams are also shows relationships among classes. This aspect of
    the diagrams may tend to evolve later in the design process, as lower level classes
    are identified. The class diagrams will improve the definition of the classes,
    which in turn may require changes to the sequence diagrams and, when developed,
    the state transition diagrams. These other diagrams will also have an impact on
    the class diagrams.


    ## Component Diagram – Logical Architecture


    The component diagram is another view of the system, at a higher level than the
    class diagram. In this view, you are expected to demonstrate the ability to visualize
    the system at a higher level and understand all of the critical parts in your
    solution. If you have proposed a MDBs to solve a particularly integration issue,
    here is where you need to depict in the diagram. The component diagram represents
    the high-level parts that make up the modeled application. This diagram is a high-level
    depiction of the components and the relationships. A component diagram depicts
    the components’ refined post-development or construction phase.


    Component diagrams are physical versions of class diagrams. A component diagram
    shows the relationships and dependencies between software components, including
    Java source code components, Java class components, and Java deployable components
    JAR (Java Archive) files. Within the deployment diagram, a software component
    may be represented as a component type. With respect to Java EE some components
    exist at compile time, some exist at runtime and some exist at more than one time.
    A compile-only component is the one that is meaningful only at compile time similarly
    the runtime component in this case would be an executable program.


    ## Deployment Diagram – Physical Architecture


    The deployment diagram captures information about the infrastructure characteristics.
    Naming specific machines, vendors, or routers may not be essential, as these decisions
    change so quickly. Do indicate a vendor/machine-agnostic way the resources you
    expect to be deployed in order to support the architecture namely CPUs, RAM, network
    requirements, disk configuration, and so on and then provide concrete examples
    of a specific vendor/machine combination that satisfies your theoretical capacity
    prediction. Although the resources deemed necessary will vary from one scenario
    to the next, the fundamental resources themselves will not. These are as follows:


    - CPUs (number of cores, clock speed)

    - RAM (quantity in GB)

    - Network (minimum interface speed)

    - Storage (disk/SAN configuration)


    Deployment diagram puts it altogether and captures the configuration of the runtime
    elements of the application. This diagram is obviously most useful when an application
    is complete and ready to be deployed. Depicts the nodes i.e., a JEE server, a
    database server it accesses, and the user workstation used to access the JEE application.

