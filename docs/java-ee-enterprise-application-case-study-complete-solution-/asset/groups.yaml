    achieve required security:


    +   • The security will be provided through DMZ using inner and outer firewall.
    Application and Database servers will be behind the inner firewall and the web
    server will be behind outer firewall in the DMZ.'
  - '[PAGE 82]


    +   • The architecture uses Form Based authentication for the web tier and the
    security logic is implemented in reusable business component (UserManager) in
    the application tier.


    +   • SSL will provide the desired security for sending sensitive information
    to critical systems like Merchant Bank and Market Place


    +   • JMS Message-level (Using Encryption and Digital signatures) and Transport-layer
    security (Using SSL).


    +   • The application will use LDAP for authentication at the web tier and use
    role based security at the web and business tier for authorization.


    Best Practices:


    SQL Injection: Prepared or Dynamic SQL Statements


    Cross Site Scripting: JSF Validation, Avoid JavaScript’s, and Avoid Frame/iFrames


    Denial of Service: Service Request Queue Technique. Limiting the number of Concurrent
    Request and queuing all excess requests.


    Man-in-the-Middle: Using SSL, Avoid Frames/iFrames, Avoid URL Rewriting


    # Reliability


    The following mechanisms were recommended for Zamco Application architecture to
    achieve reliability:'
  - '[PAGE 83]


    +   • Primary application server although serves all the request, a backup server
    is configured to route traffic if primary goes down.


    +   • Data Integrity is achieved with security controls/mechanisms which will
    prevent third party from making any unauthorized access and/or changes to data.


    +   • Database transactions would ensure data integrity as it be a full commit
    or a rollback based on success/failure status.


    # Extensibility and Maintainability


    The following mechanisms were recommended for Zamco Application architecture to
    achieve extensibility and maintainability:


    +   • The logical separation of the application into different tiers (Client,
    Presentation, Business Logic, Integration and EIS tier) allows a system to be
    flexible and easily maintainable. When there are any changes in presentation,
    it will be done at presentation tier and it will not affect the other tiers. If
    there are business logic changes only EJB components business logic is altered
    and it will not affect other tiers and vice versa.


    +   • The architecture uses command pattern at the web tier (JSF Backing Bean
    classes) for handling web events. Therefore, when new functionalities are added
    to the system, it will not affect the existing system. We can easily create a
    new web action by developing BackingBean class and configure it in faces-config.xml
    file. Even modifying the existing functionality becomes easy by changing the respective
    Backing Bean classes.'
  - '[PAGE 84]


    +   - Object oriented design like encapsulation, inheritance, low coupling and
    high cohesion are leveraged in application design. So any change to sub systems
    will have less impact on systems which are using it as long the interfaces remain
    same.


    +   - Independence of interface from implementation – This mechanism allows architects
    to substitute different implementations for the same functionality.


    +   - This is supported with good documentation of the application (Architecture
    diagrams, Interface agreements with external systems, Class diagrams, Sequence
    diagrams, Coding Guidelines etc)


    # Manageability


    The following mechanisms were recommended for Zamco Application architecture to
    achieve manageability


    +   - Good logging mechanism to indicate any Fatal or Error conditions


    +   - Leverage Tivoli software to provide extensive monitoring and management
    capability for the application


    +   - Instrumentation and profiling of code to ensure that it meets the quality
    thresholds


    # Sessions ( State ) Management


    The following mechanisms were recommended for Zamco Application architecture for
    session / state management'
  - '[PAGE 85]


    +   • The architecture uses JSF Faces servlet (FrontController), which is the
    gateway to all the incoming requests to the system. It handles the client session
    at common place in HttpSession object at the web tier.


    +   • EJB tier is not used for handling the stateful session hence affecting the
    application''s scalability.


    +   • Most of the application server supports HTTP session in memory replication
    and will be used during the applications clustered failover.


    # Transaction & Concurrency


    The following mechanisms were recommended for Zamco Application architecture for
    transaction & Concurrency


    +   • The application design incorporates container-managed transaction for database
    transactions, which allows for simpler, more portable code.


    +   • All transactions related to one component are managed by a single workflow
    manager object through an EJB. This EJB is a stateless session bean designed using
    the facade pattern.


    +   • The architecture uses JPA Entity (Payment (@Entity)) to handle the payment
    transaction. The method is invoked with Requires New transaction attribute set
    via a stateless session bean.


    +   • Entity instance are based on rows and EntityManager takes care of concurrency.'
- md: '

    # Persistence


    The following mechanisms were recommended for Zamco Application architecture for
    persistence:


    - The architecture uses JPA Entities to persist the data into the relational database.

    - JPA Entity provides composite view of relational tables to easily manage the
    persistence and JPA query language provides fast access to the table rows with
    optimized queries.

    - The use of JPA Entities to persist the data increases scalability across multiple
    nodes.

    - JPA improves database portability because of database independent JPA Query
    language.


    # Distribution


    The following mechanisms were recommended for Zamco Application architecture for
    distribution.


    - The architecture uses remote stateless session beans for accessing the business
    service from web tier. These components act as the facade to the JPA Entity layer,
    which are designed with composite model to support container managed relationship.

    - This way we can distribute the business components by deploying with multiple
    machines and they can be accessed by the web tier components from remote. This
    will increase the application''s scalability as well.


    # Part III – Java EE Best Practices


    # Best Practices – Java EE Applications


    To provide some simple guidance for entering this world, I have compiled this
    best-of-the-best list of what I feel are the most important and significant best
    practices for Java EE. In order to avoid omitting critical best practices list
    instead is an essential top best practices for Java EE application.


    # Web Tier


    ## Leverage MVC


    Clean separate business logic (Java beans and EJB components) from controller
    logic (servlets/Struts actions) from presentation (JSP, XML/XSLT). Good layering
    can cover a multitude of sins.


    This practice is so central to the successful adoption of Java EE that there is
    no competition for the #1 slot. Model-View-Controller (MVC) is fundamental to
    design a good Java EE application. It is simply the division of labor of your
    programs into the following parts:


    Those responsible for business logic (the Model – often implemented using Enterprise
    JavaBeans or plain old Java objects). Those responsible for presentation of the
    user interface (the View). Those responsible for application navigation (the Controller
    -- usually implemented with Java servlets or associated classes like Struts controllers).


    There are a number of problems that can emerge from not following basic MVC architecture.
    The most problems occur from putting too much into the View portion of the architecture.
    Practices like using JSP tag libraries to perform database access, or performing
    application flow control within a JSP are relatively common in small-scale applications,
    but these can cause issues in later development as JSPs become progressively more
    difficult to maintain and debug.


    Likewise, we often see migration of View layer constructs into business logic.
    For instance, a common problem is to push XML XML parsing technologies used in
    the construction of views into the business layer. The business layer should operate
    on business objects and not on a particular data representation tied to the view.


    However, just having the proper components does not make your application properly
    layered. It is quite common to find applications that have three of servlets,
    JSPs, and EJB components, where the majority of the business logic is done in
    the servlet layer, or where application navigation is handled in the JSP. You
    must be rigorous about code review and refactoring to ensure that business logic
    is handled in the Model layer only, that application navigation is solely the
    province of the Controller layer, and that your Views are simply concerned with
    rendering model objects into appropriate HTML and Javascript.


    Just a few years ago, user interface developers for Web applications could choose
    from servlets and JSPs, struts, and perhaps XML/XSL transformation. Since then,
    Tiles and Faces have become popular, and now AJAX is gaining a strong following.
    It would be a shame to have to redevelop an application''s core business logic
    every time the preferred user interface technology changes.


    ## Prefer JSFs as your first choice of presentation technology


    Using JSF, one will get automatic binding of data to visual components, mapping,
    and validation of input data and saving of state between requests. Using JSP -
    you have to implement it manually. JSF also supports Ajax interaction with the
    server.


    If you are developing an application that requires a standard behavior, such as
    data entry, editing and display - that JSF is the best bet. If you need an online
    application with fast response, navigation within a page on the client side, such
    as Gmail or twitter - you can spend a lot of time translating the client-side
    logic components in the JSF. In this case, you better use the JSP, as a source
    of data and JavaScript library to display data.


    ## Store only as much state as you require


    Enable session persistence.


    HttpSession are great for storing information about application state. Unfortunately,
    developers often lose sight of the intent of the HttpSession -- to maintain temporary
    user state. It''s not an arbitrary data cache. Many systems put enormous amounts
    of data -- megabytes -- in each user''s session. Well, if there are 1000 logged-in
    users, each with a 1 MB HTTP session, that''s one gigabyte or more of memory in
    use just for sessions. Keep those HTTP sessions small and if you don''t your application''s
    performance will suffer. Good rule of thumb is something under 2K-4K. This isn''t
    a hard rule. 8K is still okay, but obviously slower than 2K.


    One common problem is in using HttpSession information that can be easily recreated,
    if necessary. Since the sessions are persisted, this is a very expensive decision
    forcing unnecessary serialization and writing of the data. Instead, use an in
    memory hash table to cache the data and just keep a key to the data in the session.
    This enables the data to be recreated should the user fail over to another application
    server.


    Enable session persistence, if you don''t enable session persistence, should a
    server is stopped for any reason (a server failure or ordinary maintenance); any
    user that is currently on that application server will lose their session. That
    makes for a very unpleasant experience. They have to log in again and redo whatever
    they were on on If instead, session persistence is enabled, AS will automatically
    move the user (and their session) to another application server, transparently.
    They won''t even know it happened. This works so well, that we''ve actually seen
    production systems that crashes regularly provide adequate service.


    # Business Tier


    Always use session facades whenever you use EJB components Use local EJBs when
    architecturally appropriate.


    Using a session facade is one of the best-established best practices for the use
    of EJBs. In fact, the general practice is widely advocated for any distributed
    technology, including CORBA, EJB, and DCOM. Basically, the lower the distribution
    "cross-section" of your application, the less time will be wasted in overhead
    caused by multiple, repeated network hops for small pieces of data. The way to
    accomplish this is to create very large-grained "facade" objects that wrap logical
    subsystems and can accomplish useful business functions in a single method. Not
    only will this reduce network overhead, but within EJBs, it critically reduces
    the number of database calls by creating a single transaction context for the
    entire business function. This is actually one of the core principles of Service
    Oriented Architecture (SOA).


    EJB specification, provide performance optimization for co-located EJBs. Local
    interfaces must be explicitly invoked by your application, requiring code changes
    and preventing the ability to later distribute the EJB without application changes.
    If you are certain the EJB call will always be local, take advantage of the optimization
    of local EJBs. However, the implementation of the session facade itself, typically
    a stateless session bean, should be designed for remote interfaces. This way,
    the EJB itself can be used remotely by other clients without major breakage to
    existing business logic.


    For performance optimization, a local interface can be added to the session facade.
    This takes advantage of the fact that most of the time, in Web applications at
    least; your EJB client and the EJB will be co-located within the same JVM. Alternatively,
    Java EE application server optimizations, such as WebSphere "No Local Copies,"
    can be used if the session facade is invoked locally by using the

