    部署图显示了软件和硬件的物理配置。部署图是对组件图的补充。它显示了运行时处理元素（如服务器和其他硬件）的配置，以及它们包含的软件组件、进程和对象。软件组件实例代表类的运行时表现。不作为运行实体的组件不会出现在这些图中，它们显示在组件图中。部署图是通过通信链接或关联连接的节点的图形化表示。节点可能包含组件实例，这表示组件居住并运行在节点上。部署图可以用于显示哪些组件运行在哪些节点上。还可以表示组件从节点到节点的迁移，或对象从组件到组件的迁移。


    ## 序图 – 从用例到序图


    序图描述了对象组如何随时间推移对某些行为进行协作。它记录了单个用例的行为。它显示了用例中的对象以及这些对象之间传递的消息。一个设计在不同类中可能有很多方法，这使得很难确定行为的整体序列。该图简单且逻辑性，使得序列和控制流一目了然。


    序图显示了流经系统以实现所需目标或结果的显式交互序列。序图对于具有时间依赖功能的系统（如实时应用）以及时间依赖性至关重要的复杂场景特别有用。它有两个方面，即时间以及参与实现目的所需事件序列的各种对象。


    通常，在实时应用中，系统对象所经历的事件序列非常重要，时间轴是一个重要的衡量标准。此视图通过对象为了完成目标而经历的状态序列，识别了对象在系统中的角色。这种视图是系统的事件驱动视角。角色之间的关系没有显示。类图和对象图展示了此类静态视图。序图和交互图是动态的。它们描述了对象如何协作或交互。序图是一种交互图，详细说明了功能、消息（请求和响应）以及时机。随着你向下移动页面，时间在推进。操作涉及的对象根据它们参与消息序列的顺序从左到右列出。序图可以有一个说明注释，即放在有折角的矩形内的文本。注释可以放在任何类型的
    UML 图中。


    序图是业务过程模型，代表了系统中参与者（Actor）和对象之间的不同交互。每个过程都有一个过程所有者和目标（如周期时间、缺陷率和成本），由一组业务活动（按顺序和/或并行）组成。


    每个指定的用例都应该有一个序图或协作图。不要为了节省时间将一个或多个用例合并到一个图中。序图应该是清晰的，并能大致对应于用例的复杂度。你在类图和组件图中创建的类和组件应该被表示出来，以及它们之间实现所记录的用例所需的调用。


    ## 设计决策


    本节提供了架构师在构建企业级 Java 解决方案时必须做出的各种设计决策亮点。本节涵盖了所有关键领域，包括事务、安全、框架、硬件选型、部署模型和应用程序扩展。


    ## 用于救援的 Java EE 框架


    J2EE 1.3 和 J2EE 1.4 的常见做法确实是用大量的附加框架来补充 J2EE 栈。


    从 Java EE 5 开始，现在特别是 Java EE 6 & 7，你不需要额外的框架，因为 JEE 为所有规范都提供了参考实现。Spring 容器为 J2EE
    提供的核心功能，现在可以通过轻量级的 EJB3.1 和 CDI 组件模型来实现，ORM 支持由 JPA 提供，它 通常由 Hibernate 实现。MVC
    Web 框架通过 JSF 成为标准栈的一部分。


    当然，个人可能仍然偏好 Spring 和 Struts 编程 API，但有了 Java EE 6，已经没有迫切需要使用它们。或者换句话说，除非 Oracle
    没有提供相应的参考实现，否则不再绝对需要补充 Java EE。


    RedHat Seam 确实为 Java EE 提供了一些非常棒（可移植的）扩展，而 JSF 实际上是为配合扩展和第三方组件库使用而构建的。然而，这样的库并不是真正的“框架”，它只是在你的页面上提供了额外的小组件使用，而不是像用
    Struts 或 GWT 替换 JSF。


