    # 持久化


    针对 Zamco 应用架构，推荐了以下持久化机制：


    - 架构使用 JPA Entity 将数据持久化到关系型数据库中。

    - JPA Entity 提供了关系型表的复合视图，便于管理持久化，而 JPA 查询语言（JQL）通过优化查询提供了快速访问表行的能力。

    - 使用 JPA Entity 持久化数据增加了跨多个节点的可扩展性。

    - 得益于与无关的 JPA 查询语言，JPA 提高了数据库的可移植性。


    # 分布式


    针对 Zamco 应用架构，推荐了以下分发机制。


    - 架构使用远程无状态会话豆（stateless session beans）从 Web 层访问业务服务。这些组件作为 JPA Entity 层的门面（Facade），该层采用复合模型设计，以支持容器管理的关系。

    - 通过这种方式，我们可以通过部署到多台机器来分配业务组件，并允许 Web 层组件从远程访问它们。这将增加应用程序的可扩展性。


    # 第三部分 – Java EE 最佳实践


    # 最佳实践 – Java EE 应用


    为进入这一领域提供一些简单的指导，我整理了这份我认为对 Java EE 最重要且最重大的最佳实践清单。为了避免遗漏关键实践，这份清单是 Java EE 应用中至关重要的顶级最佳实践。


    # Web 层


    ## 利用 MVC


    将业务逻辑（Java beans 和 EJB 组件）与控制器逻辑（servlets/Struts actions）以及表现层（JSP, XML/XSLT）进行清晰分离。良好的分层可以掩盖许多错误。


    这种实践对于 Java EE 的成功采用至关重要，以至于在“第一”的位置上没有竞争。模型-视图-控制器（MVC）是设计良好的 Java EE 应用的基础。它简单来说是将你的程序分为以下几个部分：


    负责业务逻辑的部分（Model – 通常使用 Enterprise JavaBeans 或普通 Java 对象 POJO 实现）。负责用户界面展示的部分（View）。以及负责应用程序导航的部分（Controller
    -- 通常用 Java servlets 或关联类，如 Struts 控制器，实现）。


    如果不遵循基本的 MVC 架构可能会出现很多问题。大多数问题发生在在架构的 View 部分放置了过多的内容。在实践中，如使用 JSP 标签库执行数据库访问，或在
    JSP 中执行应用流控制，这种做法在小型应用中很常见，但随着 JSPs 变得越来越难以维护和调试，这在后期开发中可能会导致问题。


    同样，我们经常看到 View 层的构造迁移到业务逻辑中。例如，一个常见问题是将用于构建视图的 XML 解析技术推送到业务层。业务层应该作用在业务对象上操作，而不是作用于与视图绑定的特定数据表示。


    然而，仅仅拥有适当的组件并不意味着你的应用程序具备了正确的分层。常见的情况是发现某些应用虽然有 servlets、JSPs 和 EJB 组件，但大部分业务逻辑都在
    servlet 层完成，或者应用程序导航是在 JSP 中处理的。你必须在代码审查和重构上保持严谨，以确保业务逻辑仅在 Model 层中处理，应用程序导航完全是
    Controller 层的职责，并且你的 Views 仅关注将模型对象渲染为适当的 HTML 和 Javascript。


    就在几年前，Web 应用的用户界面开发者还可以从 servlets 和 JSPs、struts 以及可能可能的 XML/XSL 转换之间进行选择。从那时起，
    和 Faces 变得流行，现在 AJAX 正在获得大量追随。如果每当首选的用户界面技术发生变化时都得重新开发应用程序的核心业务逻辑，那将是一个遗憾。


    ## 将 JSF 作为你首选表现技术的备选


    使用 JSF，可以实现数据到视觉组件的自动绑定、映射、输入数据验证以及请求之间的状态保存。使用 JSP 则你必须手动实现这些。JSF 还支持与服务器的 Ajax
    交互。


    如果你正在开发一个需要标准行为（如数据输入、编辑和显示）的应用程序，那么 JSF 是最佳选择。如果你需要一个响应快速、支持客户端页面内导航的在线应用（例如
    Gmail 或 twitter），你可能需要花费大量时间在 JSF 中翻译客户端逻辑组件。在这种情况下，你最好使用 JSP 作为数据源，并使用 JavaScript
    库来显示数据。


    ## 仅存储所需的状态


    启用会话持久化（session persistence）。


    HttpSession 是存储应用程序状态信息的绝佳工具。遗憾的是，开发者经常忽略了 HttpSession 的意图——即维护临时的用户状态。它不是任意的数据缓存。许多系统在每个用户的会话中放入海量数据——数兆字节（MB）。嗯，如果有
    1000 个已登录用户，每个用户拥有 1 MB 的 HTTP session，那么仅仅会话就会占掉 1 GB 或更多内存。保持这些 HTTP session
    尽可能小，否则你应用程序的性能将会受损。一个经验法是保持在 2K-4K 以下。这不是硬性规定。8K 仍然可以，但显然比 2K 慢。


    一个常见问题是使用了可以根据需要轻松重新创建的 HttpSession 信息。由于会话是持久化的，这是一个非常昂贵的决策，会强制进行不必要的数据序列化和写入。相反，使用内存中的哈希表来缓存数据，仅在
    session 中保留一个指向数据的键。这使得当用户故障转移到另一个应用程序服务器时，数据可以被重建。


    启用会话持久化。如果不启用，一旦服务器由于任何原因停止（服务器故障或常规维护），任何当前在该应用程序服务器上的用户将丢失其会话。这将导致非常糟糕的体验。他们必须重新登录并重做之前正在的操作。相反，如果启用了会话持久化，AS
    将透明地将用户（及其会话）移动到另一个应用程序服务器。他们甚至不会知道发生了什么。这种效果非常好，我们实际上看到过生产系统经常崩溃也能提供服务。


    # 业务层


    在使用 EJB 组件时始终使用会话门面（session facades），在架构适当的情况下使用本地 EJB（local EJBs）。


    使用会话门面是使用 EJB 的公认最佳实践之一。事实上，这种通用做法被适用于任何分布式技术，包括 CORBA、EJB 和 DCOM。基本上，应用程序的分布“交叉面”越低，在小块数据的多次网络往返上浪费的时间就越少。实现这一点的方法是创建大粒度的“门面”对象，它们封装了子系统并在单个方法中完成有用的业务功能。这不仅减少了网络开销，在
    EJB 内部，通过为整个业务功能创建一个单一事务上下文，关键地减少了数据库调用。这实际上是面向架构的核心原则之一。


    EJB 规范为本地 EJB 提供了性能优化。本地接口必须由应用程序显式调用，这需要更改代码，并防止以后在不更改应用程序的情况下分布 EJB。如果你确定 EJB
    调用将始终是本地的，可以使用本地 EJB 的优化。然而，会话门面本身的实现（通常是无状态会话豆）应该为远程接口设计。这样，EJB 本身就可以被其他客户端远程调用，而不会破坏现有业务逻辑。


    为了性能优化，可以为会话门面添加本地接口。这利用了这样一个事实：在大多数情况下（至少在 Web 应用中），你的 EJB 客户端和 EJB 将位于同一个 JVM
    中。或者，可以使用 Java EE 应用服务器优化（如 WebSphere 的“无本地副本”），当会话门面被本地调用时通过使用的


    '
