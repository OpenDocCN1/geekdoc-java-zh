    彻底理解问题陈述和范围，不要让你现有的偏好和概念影响你的决策。


    ## 严谨地选择框架和库


    了解每一层中备选技术的优缺点（JSF 对比 JSP 对比 JSTL 等），以及在什么时候一种技术比另一种更合适。


    拥有业务问题范围之外的知识是非常重要的。例如，你应该了解与安全相关的方面，如中间人攻击、拒绝服务、欺骗、加密机制等。


    不要随处推行酷炫的技术（JSF, EJB, JPA 等），也不要因为某事通常被认为是好实践或坏实践就去做或避免去做。人们必须根据现有框架的能力并对优缺点进行理性考虑来做出决定。例如，在某些特殊情况下，使用带有
    JSTL 标签的 JSP 进行数据库查询可能是最合适的解决方案。


    ## 不要重复轮子


    使用常用的、验证过的框架，如 Apache Struts、JavaServer Faces 和 Eclipse RCP。使用经过验证的模式。


    当我们最初开始帮助客户教育如何使用当时新兴的 Java EE 标准时，我们发现，开发一个用于用户界面开发的框架，比直接基于基础 servlet 和 JSP
    规范构建 UI 应用程序显著提高了开发者的生产力。结果是，许多公司开发了自己的 UI 框架，简化了界面开发任务。


