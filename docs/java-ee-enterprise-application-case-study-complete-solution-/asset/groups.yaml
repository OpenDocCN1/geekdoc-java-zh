    图 1：Java EE 框架组件


    ## 解决业务问题


    分析师团队将对客户背景和 Java EE 应用的需求进行简要介绍。他们将包含对主要需求的结构化描述、领域模型、用例图以及非功能性需求（NFRs），并预计你使用
    Java EE 技术和框架为 Java 应用提供解决方案。


    在研讨会期间记录或讨论的业务问题可能是模糊的，并且可能对主要用例给出非常高层次的描述，因此会有许多未解决的问题或需要计划进一步深挖的领域。需求可能是不完整的，例如用例图可能缺少设计所需的必要信息。因此，你必须自己填补缺失的部分，并用假设替换缺失的信息，可能将不明确的元素添加到风险列表中。这最好通过与来自业务部门和技术部门的各种利益相关者进行研讨会、访谈和讨论来完成。一旦获得了适当的详细信息并且你脑海中有了解决方案，那么使用合适的可视化编辑器为解决方案绘制视图就并不困难。可以利用如
    MS Visio 等工具绘制图表，因为它们非常直观，且足以满足需求。


    解决方案本身的关键部分（即各种图表或视图）是架构师交付的核心输出。作为架构师，你必须决定系统应该具有哪些组件或接口集成到生态系统中，以及如何处理非功能性和功能性需求。


    该过程还将涉及大量时间来估计应用程序的资源（硬件）需求，并探索和比较部署环境以及各种物理与云端选项的非功能性特性。本节将涵盖你在创建 Java 解决方案时应该采用的方法论和方法。


    解决方案通常包括：


    - 类图（Class Diagram）

    - 描述范围内各种层级和组件的组件图（Component Diagram）

    - 描述主要层级建议物理布局的部署图（Deployment diagram）

    - 每个用例的时序图或协作图（Sequence or Collaboration diagram）

    - 技术风险与缓解策略

    - 为解决方案做的设计决策（Design Decision）

    - 为解决方案提出的假设


    ## 风险与假设


    在这一部分，你将被测试识别给定业务场景和技术版图中存在的顶级技术风险的能力，以及你的解决方案如何解决这些问题。在评估风险时要具有战略性和客观性。应避免低级风险，并将可能导致噩梦场景的高级、系统性风险包含在本节中。例如，在一个在线拍卖应用程序中，任何形式的安全限制都是一个主要风险，比担心应用程序是否能在多个浏览器中运行要严重得多。缓解并可能的完全消除是本节的重点。


    ## 类图 – 从领域模型到类图


    必须确保领域模型中详细列出的所有对象都出现在类图中。选择并确定一种方法或框架，描述你计划如何在 Web/表示层、业务逻辑层、持久化层和集成层构建解决方案。类图中有一些需要注意的重要要点，如下：


    - 类图中的细节水平将包括实体、重要的管理器 EJBs 以及其他几个代表重要架构概念的类（如缓存、拦截器、访问外部工具的 DAO 等，这些是解决方案需要处理的）。

    - 领域模型将几乎直接地映射到类，仅在少数情况下需要修改和扩展，例如引入基类。

    - 将使用注解来显示领域模型中的特定项目如何映射到特定的 JEE 组件上，特别是会话 bean 和实体类（Entity classes）。类图将包含与 @Entity
    或 @Embeddable 相关的重要信息（在适用处）。

    - 类图保持与 Web 框架无关。可以利用任何 Web 框架来构建解决方案。


    类图还可能包含类型、包、关系，甚至是如对象和链接之类的实例。类图甚至是静态的；它们显示了哪些在相互交互，但没有显示在交互时发生了什么。类图可以三种关系：


    - 关联（Association）是两个类实例之间的关系。如果一个类的实例必须知道另一个类才能执行其工作，则两个类之间存在关联。在图中，关联是连接两个类的链接。

    - 聚合（Aggregation）是一种一个类属于某个集合的关联。聚合显示一个菱形端指向包含整体的部分。

    - 泛化（Generalization）是一种继承链接，表示一个类是另一个类的超类。泛化显示指向超类的三角形。


    使用初始的业务类列表，通过识别和定义领域模型中类之间的关系来开发类图。这是在与业务伙伴的交互式开发研讨中进行的。将这些图表显示在白板或其他媒介上也是有用的，并随着项目的进行逐渐开发。图表存储在
    UML 工具中，以便所有团队成员和其他利益相关方访问。类图还展示了类与类之间的关系。图表的这一方面在设计过程的后期可能会演变，因为会识别出更的类。类图将改进对类的定义，反过来这可能需要更改时序图，以及开发后的状态转换图。这些其他图表也会对类图产生影响。


    ## 组件图 – 逻辑架构


    组件图是系统的另一个视图，比类图层次更高。在这个视图中，你被期望展示在更高层次上视觉化系统并理解你解决方案中所有关键部分的能力。如果你建议使用 MDBs 来解决特定的集成问题，这就是你需要在图中描绘的地方。组件图代表了构成建模应用程序的高级部分。该图是对组件及其关系的高级描述。组件图描绘了组件在开发后或构建阶段的细化状态。


    组件图是类图的物理版本。组件图显示了软件组件之间的关系和依赖，包括 Java 源代码组件、Java 类组件和 Java 可部署组件 JAR（Java 存档）文件。在部署图中，软件组件可以表示为组件类型。对于
    Java EE，某些组件存在于编译时，某些存在于运行时，某些则存在于多个时间。仅编译的组件是仅在编译时有意义的，类似，在这种情况下运行时组件将是一个可执行程序。


    ## 部署图 – 物理架构


    部署图捕获了关于基础设施特性的信息。命名特定的机器、供应商或路由器可能不是必要的，因为这些决策变化非常快。请指示一种与供应商/机器无关的资源部署方式以支持架构，即
    CPU、内存、网络需求、磁盘配置等，然后提供特定供应商/机器组合的具体示例以满足你的理论容量预测。虽然认为所需的资源会随场景而异，但基础资源本身不会。这些如下：


    - CPU（核心数、时钟频率）

    - RAM（GB 容量）

    - 网络（最小接口速度）

    - 存储（磁盘/SAN 配置）


    部署图将所有元素整合在一起，捕获应用程序运行时元素的配置。该图显然在应用程序完成并准备好部署时最有用。描绘了节点，例如：JEE 服务器、其访问的数据库服务器以及用于访问
    JEE 应用的用户工作站。


    '
