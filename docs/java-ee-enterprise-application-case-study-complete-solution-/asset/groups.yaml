  - '[PAGE 116]


    # Appendix I: Approach and Methodology


    RUP is based on software engineering best practices, offers a configurable framework
    and is scalable to support enterprise initiatives. Therefore, all aspects of RUP
    can also be applied to the development of an SOA. RUP provides a systematic approach
    to bridge the gap between business and IT to support a major area of concern,
    identification of services and how business processes are realized through execution
    of services. RUP also provides support for both the bottom-up and top-down approaches
    by acknowledgement of existing design elements and through activities such as
    architectural analysis to identify architectural elements as services.


    ![](img/a46bf6e20cc12a7ad84c822666a2a2b9_116_0.png)


    **Figure 22: RUP Methodology**


    # Approach – Solutioning


    Domain decomposition represents a top-down approach where business domains are
    decomposed into functional areas across the value net. Through this technique
    we can establish the scope of the effort. After domains have have been decomposed
    into functional areas, each area can then be further decomposed into processes
    and sub-processes and high-level'
  - '[PAGE 117]


    business use cases. Experience shows that the business use cases are considered
    good candidates for exposure.


    Existing asset analysis represents the bottom-up approach where we analyze and
    leverage APIs, transactions and models from legacy and packaged applications as
    possible candidate services.


    Goal-service modeling provides a middle-out approach that relates services to
    goals, sub goals, KPIs and metrics of the enterprise. This technique provides
    a certain level of validation in the form of a completeness check and may reveal
    candidate services that were not identified through the top-down and bottom-up
    activities.


    Finally, subsystem analysis expands on sub-systems identified during domain decomposition
    and specifies interdependencies and flows between them. A key aspect of the identification
    step is that it employs a meet-in-the-middle approach including a combination
    of top-down, bottom-up and middle-out analysis techniques. In many cases a pure
    bottom-up approach is taken, however, this approach typically leads to poor definition
    of services that are driven mainly by architecture of legacy application interfaces
    and not from a business perspective.'
