    # Estimating Resource Needs – Hardware Sizing


    The NFR specifies the no. of concurrent users and the required up time. The transactions
    per second – tps can be derived from this data. So below are a few examples that
    can give you an idea for the hardware sizing of the solution.


    # Example 1: Business Application


    The application is a JEE learning management software that must support 2000 concurrent
    users with the availability of 24/7 and hence needs a very powerful DB Hardware.
    The infrastructure is:


    +   • 2 physical Application Server nodes and HTTP Server


    +   o 4 GB Memory (2GB will be for OS)


    +   o 8 (virtual) processors'
  - '[PAGE 41]


    +   • Database

    • master-slave with automatic fail-over

    • 32 GB RAM

    • 24 (virtual) processors


    # Example 2: Web Application


    Liferay Portal for 5000 registered users with 500 of them accessing it would need
    an application server with 4GB memory and a 3GHz quad-core Xeon processor; for
    the database, a server below 4GB/1-quad 3GHz would suffice.


    # Conclusion


    Given the examples above, other information, for a requirement of 200 concurrent
    users doing no resource-intensive actions and 10h/day availability, One 4GB, 2-core
    2.5GHz machine running both a single AS and the DB would be able to satisfy the
    performance requirements.


    IBM recommends typical deployments of IBM WebSphere Application Server v7.0 require
    at least a high-cpu medium instance to have access to enough physical memory and
    computing power. That means 2 GB RAM and 2 (virtual) cores each with the power
    of 2.5-3.0 GHz 2007 Opteron processor. This is minimum production configuration
    to run WebSphere and can be taken as the minimum configuration for any standard
    Java EE web application.'
