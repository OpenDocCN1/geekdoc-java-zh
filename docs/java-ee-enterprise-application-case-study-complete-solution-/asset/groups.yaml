    ## 附录 II：Java EE 对比 Dot Net


    Java EE 或 .Net - 一种中立观点


    ### Java EE


    - Java EE 在 ORM 支持方面优于 .NET。JPA、Hibernate 等。NET 带有 Entity Framework，但它没有 JPA 那么精简。在
    .NET 世界，有一些来自 Java 的移植版，如 NHibernate。.NET 似乎更依赖于存储过程，而在 Java 中，领域对象中的一切内容都在数据库之外。


    - Java 的构建系统和 CI 工具更加先进。Hudson、Maven 和 ANT 是非常优秀且精简的解决方案。在 .Net 侧，你可以使用 NAnt 或微软的专用工具。


    - 社区：Java 社区非常棒了 —— 在 .NET 中，你必须依赖 MSDN。然而——这也可以被视为一种优势，也可以被视为缺点。你可以找到解决问题和查询的答案。


    - Java 是最流行的语言，位列第一。


    - Java IDE：如果你在考虑 .NET 与 Java EE 的对比，说明你已经为工具分配了预算（否则选择将显而易见）。在这种情况下，你应该先看看 IntelliJ。它是最好的商业
    IDE。如果你在寻找免费 IDE，可以从 NetBeans（最好的开箱用体验）和 Eclipse（最流行的）开始。Java 工具生态系统非常卓越。


    - 集成：Java 的集成故事非常出色。人们可以免费获得 SAP、AS400、文件等的连接器。ESB、LDAP 服务器都是免费的。


    - 框架 / 库：如果你需要特定的库 —— 你会在 Java 中找到一切。在开始写第一行代码之前，你应该先做一些研究。


    - 战略考虑：使用 Java EE，你真正实现了厂商中立化。这在价格谈判阶段非常有用。你甚至可以在不产生任何费用（订阅、许可证等）的情况下进入生产环境。Java
    EE 应用具有很强的移植性。Java EE 甚至不依赖于 Oracle —— 它是由所有主要供应商开发的。


    - 稳定性：Java 语言已经稳定了多年。没有破坏性的更改。Java EE 5 和 6 平台也具有向后兼容性。因此你可以将旧的 J2EE 1.X 应用部署到
    Java EE 环境中并进行平滑迁移。


    - 最佳实践：Java EE 进入市场已有约 10 年时间。有很多应用程序和框架。大多数错误已经犯过，且最佳实践/模式已经非常成熟。


    - 在大多数 .NET 项目中，你会发现开源扩展，以及商业级 .NET 工具。这种混合（就支持问题而言）可能会变得非常“有趣”。


    - 操作系统：你可以为生产和开发选择你想要的任何操作系统。


    - 开源：生产环境中的 80% 的 Java 应用是基于开源工具构建的。这是你的终极保障。


    ### Dot Net


    - 一切都来自同一个供应商。


    - C# 的发展非常快，并且拥有比 Java 更好的特性。C# 在 DSL（领域特定语言）领域表现优异。LINQ 对于数据库（以及树形结构）查询非常好用（不过，如果你需要类似的功能，应该看看
    Scala 和 Groovy）。


    - 你不需要搜索特定的解决方案，因为选择是显而易见的。这可以为你节省大量时间。


    - 大多数工具都在 MSDN 上 —— 不需要预先评估工具和 IDE。


    Visual Studio .NET 是一个非常好的环境，拥有非常好的数据库和团队扩展。配合商业插件（例如 Resharper），它和 IntelliJ 一样好。


    UI 的最佳实践比 Java 更具一致性。例如，ASP.NET MVC 是 .NET 的主流选择。在 Java EE 中，你必须在 JSF、Wicket、GWT
    和 Struts 2 之间选择。


    .NET 中的语言集成是无缝的。你可以轻松地从 C# 调用 VB.NET 方法。在 Java 中，从 Groovy 调用 Scala 函数很困难。


    SharePoint、Exchange 和 Office 产品与 .NET 的集成非常良好。你可以用 Java 访问它们，但需要第三方库。


    - 持续集成已随 Visual Studio Team System 自。


    ## 附录 III：开源开发


    在开源领域，将炒作与现实区分开来并不。它不仅成了一个技术热词，还成为了大量争议的中心：从版权法和知识产权辩论，到言论自由以及关于自由市场竞争的争论。J2EE
    市场演变迅速，首先经历了整合阶段，现在进入了商品化阶段。这第二个阶段在很大程度上是由这一事实驱动的：为了展示价值，应用服务器供应商不能仅仅依靠其核心应用服务器。这创造了一个增值服务市场，特别是在开发工具和开发生产力领域。书中介绍的许多开源工具和框架都属于这一类。


    开源也改变了全球大学学习编程的方式；离开学术界进入职场的新一代程序员要么使用过开源，要么贡献过开源。现在的学生可以通过检查展示了世界许多来源贡献的级级软件来学习。


    在全球各地的企业 IT 部门，程序员们正聚集在 Ant、JUnit、Tomcat 和 JBoss 等开源项目之后。尽管接受开源的战斗在很大程度上是在程序员和中层管理层面进行的，但考虑到近期
    Linux 对企业的影响，高层管理已开始看到开源的许多优势，特别是在企业 Java 领域。寻求减少软件成本的组织发现，与商业产品相比，开源（OSS）提供了较低的所有成本。


    ## 开源的优缺点


    许多组织以不同程度使用开源项目。某些组织仅在不影响任何生产环境的开发阶段使用开源。组织还可能开源用于日志记录和 XML 解析等活动。开源应用服务器、Web
    容器通用对象请求体系 (CORBA) 服务器可以提供基础设施。使用开源的组织发现，除了财务利益外，还有一些理由。


    使用开源显而易见且重要的理由是初始所有成本较低。组织可以免费向多个开发者和用户分发软件。考虑一个拥有 100 个用户群和 10 人开发团队的应用，使用 500
    美元的许可商业产品。这将总计 55,000 美元。使用开源产品，组织可以立即消除这笔费用并在不产生额外费用的情况下增加用户群。


    也可以实现其他财务利益。由于开源免费复制，因此不需要产生许可证管理费用。此外，法律部门只需要对使用该许可证的所有项目审核并批准一次开源许可证，而不是每个商业产品许可证。使用流行的开源项目可以通过提供更大的资源池来减少培训费用。可以从外部招聘拥有开源框架知识的开发者。


    ### 缺点


    行业支持是考虑开源的另一个原因。IBM、Sun、Oracle、BEA 和 Borland 等许多主要公司在使用开源项目。这些组织对项目的成功有兴趣，因为它们的产品依赖于该框架。Java
    开源项目的贡献者不再仅仅是业余时间编写代码的独立人士。许多大型公司有专门的开源部门。此外，许多开源项目如 Eclipse、NetBeans 和 Tomcat
    最初是由大型企业赞助捐赠的。将开源视为一种扩展全球优秀资源的手段。访问源码是开源的一个优势。源代码是唯一 100% 准确的文档。JavaDocs、营销材料、架构图和说明往往没有保持更新。


    '
