    in the operation are listed from left to right according to when they take part
    in the message sequence. The sequence diagram can have a clarifying note, text
    inside a dog-eared rectangle. Notes can be put into any kind of UML diagram.


    Sequence diagrams are models of business processes that represent the different
    interactions between actors and objects in the system. Each process has a process
    owner and goals (such as cycle time, defect rate, and cost) consists of a set
    of business activities (in sequence and/or in parallel).


