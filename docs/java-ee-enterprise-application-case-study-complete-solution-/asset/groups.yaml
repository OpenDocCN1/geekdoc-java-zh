    数据完整性。企业 Bean 支持事务，即管理共享对象并发访问的机制。应用程序将有很多客户端。只需几行代码，远程客户端即可定位企业 Bean。这些客户端可以是轻量级的、多样化的且大量的。可以使用
    EJBs 构建可扩展的应用程序。


    EJB 3.0 已被分为两个部分：EJB 规范和 JPA 规范。在 JEE 5 及更高版本中，EJBs 现在被称为实体（entities），并且是 POJO。JPA（Java
    Persistence API）顾其实名，是 API 的持久化部分。它通常用于 EclipseLink、Hibernate 和 Toplink 等库。Hibernate
    是最流行的且早于 JPA，但两者之间的差异并不大。JPA 是一种 ORM（对象关系映射器），用于将对象模型投影到关系型数据库上。


    ## EJB 3 改进


    - 简化了 ejb 的开发过程显著减少了开销。使用 Java 语言注解作为配置，提高了开发者的效率。

    - 规范了程序化默认值（包括针对元数据），减少了开发者在 EJB 容器上指定常见预期行为和需求的需求。

    - 通过使用注解、依赖注入机制和简单的查找机制，对环境依赖和 JNDI 访问进行了封装。

    - 简化了企业 Bean 的类型。

    - EJB 支持继承和多态。

    - 使用 JPA EntityManager API 进行轻量级 CRUD 操作。

    - 增强了 JPA 查询能力。

    - 生命周期回调方法可以定义在 ejb 自身，也可以定义在 bean 监听类中。

    - 针对 Session Bean 和消息驱动 Bean 的拦截器监听器。拦截器方法可以定义在 bean 类上或与 bean 关联的拦截器类上。

    - 在一个应用程序中同时使用 CMP 和 JPA


    ## Bean 托管事务与容器托管事务


    Java Platform EE 平台支持两种事务管理范式：声明式事务边界划分和程序化事务边界划分。声明式事务管理指的是非程序的事务边界划分，通过在部署描述符中为容器管理的
    EJB 组件的各种方法指定边界来实现。这是一种灵活的方法，可以在不修改任何代码的情况下更改应用程序的事务特性。实体 EJB 组件必须使用容器管理的事务边界划分。


    在 Bean 托管事务边界划分中，EJB Bean 使用 `UserTransaction`。只有 Session Bean 可以使用 Bean 托管事务。在容器管理的事务边界划分中，EJB
    容器负责事务边界划分。此外，你应该使用容器管理的事务边界划分，因为它不容易出错，而且你应该让容器自动处理事务划分。这让组件提供者无需在组件中编写事务划分代码。更容易将企业
    Bean 分组以执行具有特定事务行为的某些任务。应用程序组装器可以在部署描述符中自定义事务属性，而无需修改代码。


    然而，有时需要程序化（过程化）访问控制来满足细粒度或特定应用程序的条件。


    ## Bean 托管安全与容器托管安全


    为了简化企业 Bean 提供者的开发过程，安全基础设施的实现留给 EJB 容器提供者，而定义安全策略的任务留给 Bean 部署者。通过避免在 Bean 代码中硬编码安全策略，EJB
    应用程序在为企业应用程序配置和重新配置安全策略时获得了灵活性。应用程序在可能使用不同安全机制的不同 EJB 服务器之间也获得了可移植性。EJB 框架规定了安全管理方面的灵活性，允许它是声明式的（容器托管）或程序化的（Bean
    托管）。


    定义方法权限的安全管理在企业 Bean 的部署描述符或通过使用注解（如果使用 EJB 3.0）进行声明。容器托管安全使企业 Bean 更加灵活，因为它没有绑定到特定应用程序定义的安全规则。安全角色是赋予应用程序定义的一组信息资源权限的名称。将主体（principal）与此安全角色关联，只要该主体在该角色中，就会向该主体授予相应的访问权限。


    然而，有时需要程序化（过程化）访问控制来满足细粒度或特定应用程序的条件。企业 Bean 可以使用 EJBs 上文对象中的 `isCallerRole()`
    和 `getCallerPrincipal()` 方法程序化地管理安全。`isCallerRole()` 方法测试调用者是否具有指定的安全角色，如果具有则返回
    true，否则返回 false。`getCallerPrincipal()` 方法返回标识调用者的 `java.security.Principal`。


    ## QoS 考虑因素


    - 性能 – 根据响应时间或单位时间内的事务数来衡量系统。负载均衡（例如 DNS 轮询）和负载均衡是有助于获得更高性能的两种技术。应用程序调优、服务器调优和数据库调优等任务也能提高系统性能。

    - DNS 轮询：在系统中分配负载的过程。如果我们有十台可以处理 HTTP 请求的 Web 服务器，第一个请求指向服务器 1，第二个请求指向服务器 2，依此类推。当所有十台服务器都处理了一个请求后，该过程将重新开始。注意，这只是负载均衡技术之一。DNS
    轮询并不均衡负载。

    - 反向代理负载均衡：当你拥有不同 CPU 和内存的服务器时，使用反向代理负载均衡。你可能有一些强大的服务器专门用于 SSL 会话，而另一些服务器处理静态
    HTML。使用这将最大化你应用程序的性能。

    - 可扩展性 – 系统在负载增加时以满意的方式执行和运行的能力。可扩展性可以通过两种方式实现——垂直扩展（向现有硬件添加额外的处理器、内存或磁盘）和水平扩展（向系统添加更多机器）。垂直扩展比水平扩展更容易实现。然而，许多
    J2EE 厂商也支持水平扩展。

    - 可靠性 – 系统随着负载增加而确保应用程序及其所有数据完整性和一致性的能力。

    - 可用性 – 系统确保所有服务和资源始终可用的。这可以通过容错（在服务/组件故障时防止系统故障的能力）技术，如主动复制和被动复制来实现。


    ## 遗留采集器


    - 屏幕采集器（Screen Scraper）：屏幕采集器模拟大型机终端。基本上，屏幕采集器像普通用户一样登录大型机，向大型机发送请求然后读取响应。屏幕采集器的问题是，如果你更改了大型机的任何代码，屏幕采集器总有可能停止工作。

    - Java 原生接口（JNI）：JNI 用于允许 Java 与 C++ 等语言编写的程序通信。实际上，你正在封装 C++ 代码以供 Java 使用。例如，你用一个
    C++ 方法 `debitAccount (int amount)` 封装一个类似的 Java 方法；Java 方法将直接调用 C++ 方法。这意味着你现在可以通过
    RMI 使该方法可用。

    - Java IDL：Java IDL 为 Java 平台增加了 CORBA（公共对象请求代理架构）能力，提供了基于标准的互操作性和连接性。Java IDL
    允许分布式 Web  Java 应用程序使用对象组定义的行业标准 IDL（对象组接口定义语言）和 IIOP（互联网 ORB 协议）透明地调用远程网络服务的操作。运行时组件包括用于
    IIOP 通信进行分布式计算的 Java ORB。


    ## Hibernate Vs JPA


    JPA 只是一个规范，意味着它没有实现。你可以尽可能地对你的类进行注解


