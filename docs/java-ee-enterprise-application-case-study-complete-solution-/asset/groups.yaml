  mdcn: "\n\n本项目范围内的关键用用例：\n\n- 售卖石油产品\n- 石油产品竞标\n- 转移所有权/运输石油产品\n- 支付中标标款项\n\n设计的系统必须满足以下标准，即非功能性需求：\n\
