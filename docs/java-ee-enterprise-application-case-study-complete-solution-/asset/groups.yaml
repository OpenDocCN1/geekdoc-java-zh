    \ 应用 JEE 版本\n\n应用程序将在 Web 层使用 LDAP 进行身份验证。\n\n- 12 应用安全\n\n应用程序将在 Web 层和业务层使用基于角色的安全性进行授权。\n\
    \n# 架构决策\n\n# 系统/组件/架构决策框架\n\n- 1 Zamco 架构框架\n\nMVC 框架强制的一致结构和功能分离使得应用程序更可靠、更易维护和扩展。出于这些原因，Zamco\
    \ 应用采用框架设计。\n\n应用程序将使用 JEE 框架提供的错误与异常处理、日志记录和资源注入能力构建。这将使应用程序具有维护性和可靠性，并有助于更快解决问题。\n\
    \n- 2 通用能力\n\n解决方案架构利用设计模式，因为它们使应用程序具有维护性和扩展性。\n\n- 3 设计模式\n\n为了提供可扩展性和业务逻辑复用性，利用\
