    +   - Scalability – The ability of a system to perform and behave in a satisfactory
    manner with increases in load. Scalability can be achieved in two ways – Vertical
    (adding additional processors, memory or disks to existing hardware) and Horizontal
    (adding more machines to the system.) Vertical scalability is easier to implement
