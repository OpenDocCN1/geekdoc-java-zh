    # 图 7：显示请求处理 – 类图


    显示请求处理机制捕获了以下关键架构决策：


    - 所有用户请求均由单个 Web Controller（应用程序的前台控制器）处理。

    - 前台控制器借助存储在 XML 文件（BackingBean.xml）形式中的资源和访问映射信息，将请求转发给适当的命令处理程序（Command Handler）。

    - 命令处理程序管理特定用用例的用户交互，并与用户协调用用例的交互。

    - 命令处理程序不执行业务逻辑。相反，它们使用业务委托（Business delegates）作为应用程序服务器服务的业务提供者。

    - 命令处理程序不产生任何用户输出。相反，它们调用视图（Views）来创建 HTML 类型的流并返回给用户。

    - 视图通过 JSP 实现。

    - 业务委托以 Java Beans 实现，运行在调用者委托的线程中。


    ![](img/a46bf6e20cc12a7ad84c822666a2a2b9_59_0.png)


    图 8：显示请求处理 – 序图


    # 业务服务访问


    业务服务结合了以下 Sun Java EE 模式的实现策略：


    - 业务委托（Business Delegate）

    - 会话 Fac面（Session Facade）

    - 服务定位器（Service Locator）


    该机制的参与者图和协作图所示。


    ![](img/a46bf6e20cc12a7ad84c822666a2a2b9_59_1.png)


    图 9：业务服务访问 – 类图


    该机制是组织访问应用程序组件的蓝图。该架构不允许任何显示层组件（特别是命令处理程序）直接与实体通信。因此，只有可以远程访问的 Bean 是会话 Bean（session
    beans）。


    该机制捕获了以下架构决策：


    - 所有业务服务组件均实现为 Session EJBs 或具有 Session EJB Facade。

    - 客户端（大多数情况下是 Bean处理器）需要访问业务服务组件并创建业务委托的实例。


    由于使用了框架的两种机制，应用程序在显示层和业务逻辑之间有了明确的分。边界是业务委托，它们是应用程序业务服务的智能代理（smart proxies）。这种分离由于以下原因是有益的：


    - 它在系统的显示层设计人员/开发者与业务层之间提供了一个显式的约。

    - 它允许业务层独立于显示层进行更改。

    - 它允许这两个层进行并发开发。


    ![](img/a46bf6e20cc12a7ad84c822666a2a2b9_61_0.png)


    图 10：业务服务访问 – 序图


