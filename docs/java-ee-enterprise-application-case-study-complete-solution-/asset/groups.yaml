    ## EJB 3 Improvements


    - Simplified process of developing ej reduces significantly overhead. own- Using
    Java Language Language annotations as configuration improves developer’s productivity.

    - Specification of programmatic defaults, including for metadata, reducing the
    need for the developper to specify common, expected behaviors and requirements
    on the EJB container.

    - Encapsulation of environmental dependencies and JNDI access through the use
    of annotations, dependency injection mechanisms, and simple lookup mechanisms.

    - Simplification of the enterprise bean types.

    - EJB support inheritance and polymorphism.

    - Light-weight CRUD operations with JPA EnityManager API.

    - Enhanced query JPA capabilities.

    - Life cycle callback methods can be defined in ejb itself or in a bean listener
    class.

    - Interceptor facility listeners for session beans and message-driven beans. An
    interceptor method may be defined on the bean class or on an interceptor class
    associated with the bean.

    - It is possible to use both CMP and JPA in one application


    ## Bean Managed Vs Container Managed Transaction


    The Java Platform EE platform supports two transaction-management paradigms: declarative
    transaction demarcation and programmatic transaction demarcation. Declarative
    transaction management refers to a non-programmatic demarcation of transaction
    boundaries, achieved by specifying within the deployment descriptor for the various
    methods of the container-managed EJB component. This is a flexible approach that
    facilitates changes in the application’s transactional characteristics without
    modifying any code. Container-managed transaction demarcation must be used by
    entity EJB components.


    In bean-managed transaction demarcation, the EJB bean uses UserTransaction. Only
    session beans can choose to use bean-managed transactions. In container-managed
    transaction demarcation, the EJB container is responsible for transaction demarcation.
    Moreover, you should use container-managed transaction demarcation because it
    is less prone to error, and you should let the container handle transaction demarcation
    automatically. It frees the component provider from writing transaction demarcation
    code in the component. It is easier to group enterprise beans to perform a certain
    task with specific transaction behavior. The application assembler can customize
    the transaction attributes in the deployment descriptor without modifying the
    code.


    However, programmatic (procedural) access control is sometimes necessary to satisfy
    fine-grained or application-specific conditions.


    ## Bean Managed Vs Container Managed Security


    To simplify the development process for the enterprise bean provider, the implementation
    of the security infrastructure is left to the EJB container provider and the task
    of defining security policies is left to the bean deployer. By avoiding putting
    hard-coded security policies inside bean code, EJB applications gain flexibility
    when configuring and reconfiguring security policies for complex enterprise applications.
    Applications also gain portability across different EJB servers that may use different
    security mechanisms. EJB framework specifies flexibility with regard to security
    management, allowing it to be declarative (container-managed) or programmatic
    (bean-managed).


    Security management that defines method permissions is declared in the enterprise
    bean’s deployment descriptor or by using annotations (if using EJB 3.0). Container-managed
    security makes an enterprise bean more flexible, since it isn’t tied to the security
    rules defined by a particular application. A security role is a name given to
    a grouping of information resource permissions that are defined for an application.
    Associating a principal with this security role grants the associated access permissions
    to that principal as long as the principal is in the role.


    However, programmatic (procedural) access control is sometimes necessary to satisfy
    fine-grained or application-specific conditions. Enterprise beans can programmatically
    manage the security by using the isCallerRole() and getCallerPrincipal() methods
    contained on the EJBs context object. The isCallerRole() method tests whether
    the caller has a given security role, returning true if the caller has and false
    if not. The getCallerPrincipal() method returns the java.security.Principal that
    identifies the caller.


    ## QoS Considerations


    - Performance – A measure of the system in terms of response time or number of
    transactions per unit time. Load Distribution (e.g. DNS Round Robin) and Load
    Balancing are two techniques that aid in higher performance. Tasks such as Application
    Tuning, Server Tuning, and Database Tuning also improve system perform.

    - DNS Round Robin: a process for distributing load in a system. If we have ten
    web servers that can service HTTP requests, the first request is directed to server
    1, the second to server 2 and so on. When all ten servers have serviced one request
    each, the process starts all over again. Note that this one of the load distribution
    technique. DNS Round Robin does not balance the load.

    - Reverse proxy load balancing: Reverse proxy load balancing is used when you
    have servers with different amounts of CPUs and Memory. You might have some powerful
    servers just to be used for SSL sessions and others to handle static html. Using
    this will maximize the performance of your application

    - Scalability – The ability of a system to perform and behave in a satisfactory
    manner with increases in load. Scalability can be achieved in two ways – Vertical
    (adding additional processors, memory or disks to existing hardware) and Horizontal
    (adding more machines to the system.) Vertical scalability is easier to implement
    than Horizontal scalability. Many J2EE vendors do however support horizontal scaling
    as well.

    - Reliability – The ability of a system to assure the integrity and consistency
    of the application and all its data as the load.

    - Availability – The ability of a system to assure that all services and resources
    are always accessible. This can be achieved through fault tolerance (the ability
    to prevent system failures in the event of service(s) / component(s) failures)
    techniques such as Active and Passive Replication.


    ## Legacy Scraper


    - Screen Scraper: A screen scraper emulates a mainframe terminal. Basically the
    screen scraper logs onto the mainframe like a normal user and sends requests to
    the mainframe and then reads the response. The problem with a screen scraper is
    that if you change any of the mainframes code there is always the possibility
    that the screen scraper will stop working.

    - Java Native Interface: JNI is used to allow Java to communicate with programs
    written in languages like C++. In effect you are wrapping the C++ code to make
    it available to Java. For example you will wrap a C++ method debitAccount (int
    amount) with a similar Java method; the Java method will just call the C method.
    This means you can now make the method accessible via RMI

    - JAVA IDL: Java IDL adds CORBA (Common Object Request Broker Architecture) capability
    to the Java platform, providing standards-based interoperability and connectivity.
    Java IDL enables distributed Web-enabled Java applications to transparently invoke
    operations on remote network services using the industry standard IDL (Object
    Management Group Interface Definition Language) and IIOP (Internet Inter-ORB Protocol)
    defined by the Object Management Group. Runtime components include Java ORB for
