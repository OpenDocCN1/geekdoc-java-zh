    ## Deployment Diagram!


    The following diagram shows the deployment diagram for the Zamco Application.
    The deployment diagram captures information about how the system operates in production.
    The deployment diagram depicts how the proposed solution will execute at runtime,
    including the hardware and configuration that will be needed to support the software
    solution. In this diagram, we have adopted the convention of specifying three
    hardware profiles (A, B and C) to call out the fact that we expect the web server,
    application servers and the database server to require different system resources.


    The deployment diagram is divided into the following tiers:


    - Web Server

    - Application Server

    - Database Server

    - External Applications


    To be able to provide high availability a hot backup has been configured. Although
    primary application server is capable of handling 400 users, hot backup server
    will be able to handle users when primary server fails. Load balancer will be
    configured to route traffic when primary fails or reaches its capacity threshold.


    ![](img/a46bf6e20cc12a7ad84c822666a2a2b9_70_0.png)


