  - '[PAGE 125]


    Open Source projects are more agile than commercial products in their evolution.
    Often Open Source projects have shorter release cycles than their commercial counterparts,
    if for no other reason than the fact that most projects provide nightly snapshots
    or direct access to the source code repository. In addition, organizations don’t
    have to wait for a vendor’s next release to get a bug fixed. Having source code
    provides a means for the organization to fix the bug itself. Organizations willing
    to contribute to Open Source projects can also have influence on the future direction
    of the project. Unlike proprietary development, Open Source has the advantage
    of being reviewed and tested by potentially hundreds or thousands of users. Unit
    and regression testing is an important part of software quality. Open Source projects
    such as the Jakarta Commons project requires that JUnit tests be available and
    passed before version releases. Having access to JUnit tests can reduce risks
    by providing means of testing new releases against the unit tests of the currently
    utilized release. The results of the tests can be used as a risk management tool
    to determine the impact of an upgrade on a project. Open Source can contribute
    to an individual''s career development. Developers can use the source code to
    learn new techniques or APIs. Open Source can also lower the barriers of entry
    by allowing for more economical means of evaluating new technologies. For inexperienced
    Java developers, contributing to an Open Source project may be a way of demonstrating
    knowledge to an employer or potential employer. It’s common for developers to
    evaluate a technology and prototype proof-of-concept applications using an Open
    Source project as a development environment while deploying on a commercial platform
    for production use.


    # Disadvantages'
  - '[PAGE 126]


    Open Source projects have been documented poorly. In addition, Open Source software
    usually doesn’t have a recognized company behind it to provide support, whether
    it’s free or paid for. These disadvantages are changing. A new market has grown
    up around Open Source to provide quality documentation and support—for a price.
    In addition, many of the projects have active newsgroups or forums that can be
    effectively used to troubleshoot an Open Source application.


    Open Source projects can also be plagued with backward-compatibility problems.
    Open Source projects don’t take backward compatibility into consideration as much
    as commercial organizations. Yet, at the same time open source projects tend to
    be more daring when it comes to innovation and trying radically different ways
    to approach a problem.


    The biggest disadvantage of Open Source is lack of marketing dollars. Often, organizations
    aren’t aware of the existence of an Open Source project or how it might apply.
    Open Source projects don’t have conference booths, magazine advertisements, or
    salespeople explaining the problems they can solve. Open Source projects also
    depend on the enthusiasm and number of collaborators as well as the areas that
    their efforts are focused on. For example, lack of documentation and administrative
    tools is a common complaint with regards to Open Source projects.


    This brings to mind successful emergence of Open Source projects with heavy commercial
    backers such as the Eclipse project, which is backed by IBM and thus has very
    good'
  - '[PAGE 127]


    documentation given the resources available, namely, IBM staff technical writers
    and editors.'
  - '[PAGE 128]


    # Appendix IV: Sizing and Capacity Planning


    Benchmark your code on hardware similar to what you''ll be using in production,
    identify any bottlenecks, then determine how much of a workload your current hardware
    can handle, and/or how much hardware horsepower you need to handle your target
    workload.


    A brief overview of the process:


    +   - Create User Scenarios

    - Add monitoring capability

    - Add User Load

    - Analyze results

    - Remediate

    - Rinse & Repeat


    # Step I: Create User Scenarios


    Set up an environment to test against. This should be a fairly close your production
    hardware if possible, otherwise you will be left extrapolating your data. Set
    up your servers, accounts, websites, bandwidth, etc. Even if you do this in VMs
    that''s OK just as long as you''re prepared to scale your results.


    # Step II: Add Monitoring Capability'
  - '[PAGE 129]


    You''ll need metrics to monitor e.g how many requests get through to the web servers,
    and how many requests can squeeze through per second before users start getting
    a response time of over two seconds. You will have to monitor RAM, CPU and disk
    usage to make sure that the load balancer can handle the connections. might need
    to review web server log files, start performance counters, or rely on the reporting
    ability of your stress test tool. Aspects required to be monitored:


    +   * CPU usage

    * RAM usage

    * Disk usage

    * Disk latency

    * Network utilization


    You might also choose to look at SQL deadlocks, seek times, etc depending on what
    you''re specifically testing.


    # Step III: Add User Load


    Simulate a test load. There are plenty of tools that can do this, with configurable
    options:


    +   * JMeter (Web)

    * Apache Benchmark (Web)

    * Grinder (Web)'
  - '[PAGE 130]


    +   • httpperf (Web)

    • WCAT (Web)

    • Visual Studio Load Test (Web)

    • SQLIO (SQL Server)


    Choose a number and let''s say you''re going to see how the system responds with
    hits a minute. It doesn''t matter what number you choose because you''re going
    to repeat this step many times, adjusting that number up or down to see how the
    system responds.


    Ideally, you should distribute these 10,000 requests over multiple load testing
    clients/nodes so that a single client does not become a bottleneck of requests.
    For example, JMeter''s Remote Testing provides a central interface from which
    to launch several clients from a controlling JMeter machine. Press the magic Go
    button and watch your web servers melt down and crash.


    # Step IV: Analyze Results


    So, now you need to go back to your metrics you collected in step 2. You see that
    with 10,000 concurrent connections, your high availability proxy box is barely
    breaking a sweat, but the response time with two web servers is a touch over five
    seconds. Remember, your response time is aiming for two seconds. So, we need to
    make refinements to the configurations.


    # Step V: Remediate'
  - '[PAGE 131]


    Now, you need to speed up your website by more than twice. So you know that you
    need to either scale up, or scale out. To scale up, get bigger web servers, more
    RAM, faster disks. To scale out, get more servers.


    Use your metrics from step 2, and testing, to make this decision. For example,
    if you saw that the disk latency was massive during the testing, you know you
    need to scale up and get faster hard drives. If you saw that the processor was
    sitting at 100% during the test, perhaps you need to scale out to add additional
    web servers to reduce the pressure on the existing servers. There''s no generic
    right or wrong answer, there''s only what''s right for you. Scaling up, and if
    that doesn''t work, scale out instead. Or not, it''s up to you and some thinking
    outside the box. Let''s say we''re going to scale out. So I decide to clone my
    two web servers (they''re VMs) and now I have four web servers.


    # Step VI: Rinse & Repeat


    Start again from Step 3. If you find that things aren''t going as you expected
    (for example, we doubled the web servers, but the response times are still more
    than two seconds), then look into other bottlenecks. For example, you doubled
    the web servers, but still have a crappy database server. Or you cloned more VMs,
    but because they''re on the same physical host, you only achieved higher contention
    for the server''s resources. You can then use this procedure to test other parts
    of the system. Instead of hitting the load balancer, try hitting the web server
    directly, or the SQL server using an SQL benchmarking tool.'
  - '[PAGE 132]


    The factors that affect the scalability of the server and long term strategy and
    tabulated below.


    | Determinant | Current Factor | Increase in 3 Yrs |

    |---|---|---|n| Number of Transaction | X | 50% |

    | Per cost transaction | Y | 10% |

    | Number of concurrent user | | 10% |


    # Figure 23: Growth Projections


    Capacity planning starts with measurement, in this case response time versus load.
    Once you know the degree to which the programs slows down with load, which is
    NOT a linear function, you can select a response time target, and then discover
    what resources it will take to meet that target for a given amount of load.


    Performance measurement is always done with time units, as they are what users
    care about and they can be scaled up and down. Things like %CPU and IOPS are system-specific,
    so you only use them when you have planned the system and measured it in pre-production,
    to act as a "surrogate" for the thing you care about, time.'
