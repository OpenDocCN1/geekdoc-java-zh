    The section depicts the component diagram for the Zamco Application. This diagram
    shows the component interactions for the Zamco Application. The component diagram
    is another view of the system, at a higher level than the class diagram. The component
    diagram builds further on the class diagram, related classes are logically grouping
    together into components that carry out a distinct business operation. The component
    diagram is laid out so as to make the layered nature of the architecture clear.


