    immediately eliminate the large expense and increase the install base without
    incurring additional expenses. Other financial benefits can be realized as well.
    Because Open Source is free to copy, the expense of license management isn’t incurred.
    In addition, legal departments only have to review and approve an Open Source
    license once for all projects using that license rather than each time for commercial
    product license. Using popular Open Source projects can reduce training expenses
    by providing a larger resource pool. Developers can be hired from outside the
