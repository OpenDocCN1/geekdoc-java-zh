    # 第四部分 附录


    # 附录 I：方法与方法论


    RUP 基于软件工程最佳实践，提供可配置的框架并可以扩展以支持企业级计划。因此，RUP 的所有方面也可以应用于 SOA 的开发。RUP 提供了一种系统的方法来弥合业务与
    IT 之间的差距，以支持主要的关注领域：服务的识别以及业务流程如何通过执行服务来实现。RUP 通过承认现有的设计元素以及通过架构分析等活动将架构元素识别为服务，从而为自底向上（bottom-up）和自上而下（top-down）的方法提供了支持。


    ![](img/a46bf6e20cc12a7ad84c82266a222b9_116_0.png)


    图 22：RUP 方法论


    # 方法 – 方案设计


    领域分解（Domain decomposition）代表了一种自上而下的方法，将业务领域分解为价值网中的各个功能区域。通过这种技术，我们可以确定工作范围。在领域被划分为功能区域后，每个区域可以进一步划分为流程、子流程和高层业务用例。经验表明，业务用例被认为是良好的暴露候选对象。


    现有资产分析（Existing asset analysis）代表了自底向上的方法，我们分析并利用遗留系统和软件包中的 API、事务和模型作为可能的候选服务。


    目标-服务建模（Goal-service modeling）提供了一种从中间开始（middle-out）的方法，将服务与目标、子目标、KPI 和指标相关联。这种技术以完整性检查的形式提供了某种程度的验证，并可能发现通过自上而下和自底向上活动未识别的候选服务。最后，子系统分析（subsystem
    analysis）扩展了在领域分解期间识别的子系统，并指定了它们之间的依赖关系和流。识别步骤的关键方面在于，它采用了会师中间的方法，包括自上而下、自底向上和从中间开始的分析技术的组合。。在许多情况下，人们采取纯的自底向上方法，然而，这种方法会导致服务定义糟糕，因为主要由遗留应用程序接口的架构驱动，而不是从业务角度出发。

    '
