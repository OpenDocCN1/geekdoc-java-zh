    ## Appendix II: Java EE Vs Dot Net


    Java EE Or .Net - An Unbiased Opinion


    ### Java EE


    - Java EE has better ORM-support than .NET. JPA, Hibernate etc. .NET comes with
    Entity Framework, but it isn''t as lean as JPA. In .NET world there are some ports
    from Java available like NHibernate. .NET seems to more rely on stored procedures,
    whereby in Java everything in domain objects is outside the DB.


    - Build systems and CI tools in Java are more advanced. Hudson, Maven and ANT
    are a really nice and lean solution. On .Net side you can use NAnt or a proprietary
    MS tool.


    - Community: Java community rocks - in .NET you have to rely on MSDN. However
    - this can be considered as advantage and disadvantage as well. You will find
    answers for your issues and queries.


    - Java is the most popular language and is #1.


    - Java IDEs: If you are thinking about .NET vs. Java EE you have already allocated
    some budget for tooling (otherwise the choice would be obvious). In that case
    you should look at IntelliJ first. It is the best, commercial IDE. If you are
    looking for free IDEs, start with NetBeans (best out-of-the-box experience) and
    Eclipse (the most popular one). Java tool ecosystem is remarkable.


    - Integration: Java integration story is excellent. One gets connectors for SAP,
    AS400, files etc. for free. ESBs, LDAP servers are free.


    - Framework / Libraries: If you need a specific library - you will find everything
    in Java. Before you are going to write a single line of code you should do some
    research first.


    - Strategic consideration: with Java EE you are truly vendor-neutral. This is
    very handy in the price-negotiation phase. You can even go into production without
    any costs (subscriptions, licenses etc). Java EE apps are very portable. Java
    EE is not even dependent on Oracle - it was developed by all major vendors.


    - Stability: Java language is stable for ages. There are no breaking changes.
    Java EE 5 and 6 platform is backward compatible as well. So you can deploy your
    legacy J2EE 1.X app to a Java EE environment and smooth-migrate it.


    - Best practices: Java EE are about 10 years on the market. There are many applications
    and frameworks. The most mistakes are already made and not the best practices
    / patterns are very mature.


    - In most of the .NET projects you will find open source extensions, as well as,
    commercial .NET tools. Such a mixture can be very "interesting" (regarding support
    issues)


    - Operating System: you can choose whatever operating system you want to for production
    and development.


    - Opensource: 80% of Java applications in production are built on open source
    tools. This is your ultimate insurance.


    ### Dot Net


    - Everything from one vendor.


    - C# develops very fast and has nicer features, than Java. C# shines in the DSL
    area. LINQ is very nice for database (and tree-like) queries (however you should
    look at Scala and Groovy if you need similar features).


    - You don''t have to search for a given solution as the choice is clear. It can
    save you a considerable amount of time.


    - Most of the tools are at MSDN - there is no need to evaluate tools and IDEs
    in advance.


    Visual Studio .NET is a very good environment with very good DB and team extensions.
    With a commercial plugin (e.g. Resharper), it is good, as IntelliJ.


    The UI best practices are more consistent, than in Java. ASP.NET MVC is e.g. the
    way to go in .NET. In Java EE you will have to choose between JSF, Wicket, GWT
    and Struts 2.


    The language integration in .NET is seamless. You can easily call methods from
    C# to VB.NET. In Java it is hard to call Scala functions from Groovy.


    SharePoint, Exchange and Office Products are very well integrated with .NET. You
    can access them with Java, but will need third-party libraries.


    - Continuous Integration comes already with Visual Studio Team System.


    ## Appendix III: Open Source Development


    Separating the hype from reality isn’t easy when it comes to Open Source. Not
    only has it become the technological buzzword, but it has also become the epicenter
    of a great deal of controversy: from copyright laws and intellectual property
    debates to freedom of speech and arguments about free-market competition. The
    J2EE market has evolved swiftly, by first going through a phase of consolidation
    and now by entering a phase of commoditization. This second phase has been driven
    largely by the fact that in order to show value, application server vendors can
    no longer rely on their core application server. This has created a market of
    value-added offerings, particularly in the area of development tools and development
    productivity. Many Open Source tools and frameworks showcased in this book are
    in this category.


    Open Source is also changing the way programming is being studied in universities
    around the world; new generations of programmers leaving academia and entering
    the workplace have either used or contributed to Open Source. Students nowadays
    can learn by examining enterprise-level software that displays contributions from
    a great many sources around the world.


    At corporate IT departments worldwide, programmers are rallying behind Open Source
    projects like Ant, JUnit, Tomcat, and JBoss. Though the battle for the acceptance
    of Open Source has been largely fought at the level of the programmer and middle
    management, upper management, given the recent impact of Linux on corporations,
    is beginning to see the many advantages of Open Source, especially in the area
    of enterprise Java. Organizations seeking to reduce software expenses have found
    that Open Source (OSS) provides a lower cost of ownership compared to commercial
    offerings.


    ## Advantages and Disadvantages of Open Source


    Many organizations are using Open Source projects to varying degrees. Some organizations
    use Open Source only during development phases that doesn’t affect any production
    environment. Organizations may also use Open Source for activities such as logging
    and XML parsing. Open Source application servers, web containers, and Common Object
    Request Architecture (CORBA) servers can be used to provide the infrastructure.
    Organizations using Open Source are discovering there are some compelling reasons
    besides financial benefits.


    The most obvious and compelling reason to use Open Source is the initial lower
    cost of ownership. Organizations are free to copy and distribute software to multiple
    developers and users. Consider an application with an installed base of 100 users
    and a 10-person development team using a $500 licensed commercial product. This
    would total $55,000. With Open Source products the organization could immediately
    eliminate the large expense and increase the install base without incurring additional
    expenses.


    Other financial benefits can be realized as well. Because Open Source is free
    to copy, the expense of license management isn’t incurred. In addition, legal
    departments only have to review and approve an Open Source license once for all
    projects using that license rather than each time for commercial product license.
    Using popular Open Source projects can reduce training expenses by providing a
    larger resource pool. Developers can be hired from outside the company with existing
    knowledge of Open Source frameworks.


    ### Disadvantages


    Industry support is another reason to consider Open Source. Many major companies
    such as IBM, Sun, Oracle, BEA, and Borland are using Open Source projects. These
    organizations have a vested interest in the project’s success because their products
    rely on the framework. Contributors to the Java Open Source projects aren’t necessarily
    the independent writing code in their spare time anymore. Many of these large
    companies have departments dedicated to Open Source. In addition, many of the
    Open Source projects such as Eclipse, NetBeans, and Tomcat were initially donated
    by large corporate backers. Consider the use of Open Source as a means of expanding
    your development team to include some of the best resources from all around the
    world. Access to the source is an important advantage of Open Source. The source
    code is the only 100 percent-accurate documentation. JavaDocs, marketing material,
    architectural diagrams, and instructions often aren’t kept up to date.

