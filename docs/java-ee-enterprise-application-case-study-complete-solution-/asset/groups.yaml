    # Part I - Solution'
  - '[PAGE 15]


    # Introduction


    This book presents a specific scenario similar in complexity to that you can expect
    in a real world for enterprise customers, and then presents a step by step approach
    to creating the Java Application. The solution is built using Java EE frameworks
    and technologies. Initial context around the business problem is presented which
    includes business requirements, use cases and NFR expected for the solution. As
    an architect you will be required to apply your analytical abilities and knowledge
    of Java technologies and frameworks to come up with the best solution for the
    given problem statement while making the right designs where ever required. As
    an architect you will be required to make assumptions, design decision and identify
    risk and mitigation actions which are also captured and covered in this artifact.


    Non-functional requirements are critical to the success of project and NFRs are
    the life-line of any software application. Capturing and addressing them is a
    critical activity in any IT project. This book provides comprehensive details
    for analysis and solutioning of non-functional requirements for the enterprise
    Java Application.


    | JSP 2.2 | JSF 2.2 | JSR 315 | Bean Validation (JSR 303) | Java EE 7 (JSR 336)
    |

    |---|---|---|---|-|

