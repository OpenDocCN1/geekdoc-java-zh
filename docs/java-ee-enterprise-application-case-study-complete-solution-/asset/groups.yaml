  mdcn: "\n\n通常情况下，安装程序发现数据库服务器的容量耗尽速度远快于 WebLogic 服务器。你必须规划一个足够健壮的数据库服务器来处理应用程序。一个良好的应用程序数据库性能比应用程序服务器硬件高三四倍。\n\
    \n## 生产环境中的多节点与单节点\n\n对于有限数量的并发用户（例如 400 个并发用户），在机器上部署单个服务器实例就足够了，因为应用程序服务器及随后的\
    \ JVM 都是为支持多处理器扩展扩展而设计的。然而，在单台机器上创建多个实例对于应用隔离和滚动升级可能是有有益的。\n\n## 部署环境 – 云端或物理机\n\
    \n你可以选择三种部署环境之一。\n\n- 租用物理服务器——费用最高，但从长远来看可能更有成本效益，特别是当服务器存在永久高负载时。\n- 租赁虚拟专用服务器\
    \ (VPS)——提供的资源较低（如 0.5-1.5 GB，~1 GHz），因此很少适用于 Java EE。\n- 云端部署——非常灵活（易于添加新实例、伸缩实例规模），将提供非常好的\
    \ SLA，但由于各种小费用的累积，最终价格可能会增加。\n\n## 总结\n\n记住，一张清晰易懂的图胜过千言万语。重要的是，提供的图表/视图代表了记录\
    \ Java 解决方案的一种方式。只要你遵循前面章节列出的标准，请提供你自己的 UML 图，展示你对分配业务场景的独特解决方案。具体执行以下操作：\n\n\
    - 重点应放在业务解决方案上，即如果你的类图 80% 都是框架和逻辑，那么就有失败的风险。\n- 使用英文文本增强图表，但确保你的视图清晰可见。\n- Web\
    \ 应用程序的常见部分可能未在需求中提到，例如用户注册/登录。这应该由解决方案解决。\n- 如果需求的某些方面或解决方案的要求不明确，请与利益相关者沟通并进行讨论。\n\
    - 需要时做出相应调整并记录这些，以便所有方可以使用。\n- 风险和缓解是一个重要领域且必须涵盖。所有高级风险都应得到处理，并确定缓解措施。\n- 设计决策应与其理由一同记录在制品。\n\
    \n## 业务问题 – 案例研究\n\n### 背景：\n\n油气行业面临着持续创新的压力。地缘政治不稳定性、环境问题以及能源价格和消耗的上升创造了一个业务环境，在这种环境下，缺乏灵活性的石油公司受到自由市场定价和政府制裁的共同惩罚，而敏捷灵活的公司可以获得回报。Zamco\
    \ 是一家总部位于英国的石油公司，在俄罗斯、非洲和墨西哥湾有重要业务。该公司最近与一家大型拍卖市场达成了协议，以更有效地将其产品推向市场，改善现金流并降低配送成本。Zamco\
    \ 的内部业务案例预计，在五年内将节省 22% 的成本，且利润和收益管理将比目前的业务稳态每年提高 7%。\n\n### 工作坊产出\n\n你是 Zamco\
    \ 市场项目的架构师。你被 Zamco 管理层委派领导负责整个系统交钥匙解决方案的设计、实施和持续管理的团队。在与内部业务分析师和领域专家进行了一系列深入的工作坊后，你了解到如下：\n\
    \n- 拍卖市场暴露了一个基于 Java 技术的 API，使用 Java Message Service (TMS) 技术允许公司发送销售信息并竞标石油，并具有保证性消息传递和安全性等特性。\n\
    - Zamco 已经在内部运行了一套复杂的定价系统，该系统计算拍卖市场中每笔石油投放的价格（基于其提取方式、到达目的地的运输方法）。作为解决方案架构师，你需要使用\
    \ Web 服务与此系统集成，在进入市场销售之前对其进行定价。\n- 最终的外部系统是 Zamco 的库存管理系统，该系统也通过 Web 服务访问，并将允许你查看剩余可拍卖的容量。\n\
    - Zamco 与银行有合作处理交易。\n- 拍卖管理系统的实际订单投放是手动处理的。Zamco 雇佣了一个交易员团队，跟踪油价的涨跌，并结合定价信息以及项目范围之外的其他系统来决定出售石油的最佳时机。\n\
