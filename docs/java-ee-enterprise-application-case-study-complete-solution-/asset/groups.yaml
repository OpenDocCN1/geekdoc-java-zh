  mdcn: "\n\n# Java EE\n企业级应用\n\n# 案例研究\n\n解决非功能性需求（NFR）的完整解决方案\n\n![](img/a46bf6e20cc12a7ad84c822666a2a2b9_0_0.png)\n\
    \n# Java EE 企业级应用\n案例研究\n\n解决非功能性需求（NFR）的完整解决方案\n\n版权所有。\n\n本作品受版权保护。无论材料的整体还是部分涉及翻译、印刷、插图重用、朗诵、广播、在微胶片或其他任何方式上的复制，以及在数据库中的存储，所有权利均保留。\n\
    \nISBN: 9781483544731\n\n# 前言\n\n编写这本书的动力源于这样一个事实：如今有大量的框架和技术可用于使用 Java 框架构建自定义的企业级应用。那么我应该选择哪一个？我需要做出哪些选择？我是需要采购多个框架，还是\
    \ Java EE（5及以上版本）已经提供了构建企业级应用的全面能力？理解这一点以及多种 Java EE 技术的优缺点，以及它们如何融入 Java 企业级应用中，是本书的主题。本书还涉及了非功能性需求（NFR），并解释了如何在解决方案中解决这些需求。本书提供循序渐进的方法和最佳实践，帮助架构师和领域专家（SME）推广解决方案，涵盖了各种视图/图表，包括设计决策、假设、风险以及缓解措施。\n\
    \n目前还没有涵盖从需求到企业级 Java 应用解决方案全过程的参考资料。这些参考资料侧重于描述框架及其能力，但没有一个能提供端到端的视图以及如何推广解决方案（包括处理\
    \ NFR）的流程。本书涵盖的关键领域包括事务、安全、框架、硬件选型、部署模型和应用程序的扩展。大多数书籍和参考资料仅提供理论方法，指导有限，对于现实世界的场景或企业级应用来说是不够的。对于理解领域专家、设计师和架构师如何利用\
    \ UML 表示和各种模型来记录企业级应用是一个很好的参考。\n\n本书描述了使用 JEE（5.0及以上）应用框架构建全方位真实世界解决方案的过程。\n\n\
    # 致谢\n\n感谢我的讨论伙伴、评审者和支持者，他们宝贵的意见和反馈对本书做出了贡献。我期待你们对本书提供持续的反馈。\n\n特别感谢我的妻子 Vaishali\
    \ 和家人在本书开发期间的鼓励和持续支持。\n\n# 关于作者\n\nSameer S Paradkar 是一位企业架构师，在 ICT 行业拥有 15 年以上的丰富经验，横跨咨询、产品开发和系统集成。他拥有\
    \ Open Group TOGAF、Oracle Master Java EA (SCEA)、TMForum NGOSS、IBM SOA Solutions、IBM\
    \ Cloud Solutions 和 ITIL Foundation V3 认证。他在企业架构倡议中担任顾问架构师和导师，并继续作为领域专家和作者工作。他曾在美国、英国、欧洲、亚洲和中东地区参与过多个架构转型项目，提供了分阶段的转型路线图，在最大化业务价值的同时最小化了成本和风险。在\
    \ ICT 职业中，他曾环球旅行，访问过五个大洲的多个国家。\n\n- 他曾在全球多个 IT 架构转型和现代化项目中担任企业架构师。过往客户包括：英国 AVIVA、美国\
    \ AOL、英国 BT、花旗银行（亚太地区）、印度 LIC、英国伦敦德银行、美国微软、沙特阿拉伯 Mobily、沙特阿拉伯港务局、德国西门子股份、沙特阿拉伯\
    \ STC、新西兰电信、亚洲地区 Telenor、澳大利亚 Telstra、突尼斯电信、美国 Walgreens。\n\n- 他曾与部门主管、技术和业务领导层级接触，并就技术采纳战略和路线图向他们提供建议。他曾作为企业架构咨询实践的一部分担任企业架构师，专注于跨垂直行业的评估、战略对齐、业务案例开发和治理。\n\
    \n- 在过去的几年里，他撰写了多篇在全球范围内发表的文章，包括 BPTrends、BPMInstitute 和 SOAInstitute。\n\n- 他还担任过顾问，专注于\
    \ EAI、SOA 和 BPM，为财富 100 强客户规划并构建 IT 系统和业务关键应用——涵盖主要的零售、银行、电信、保险和医疗健康行业。\n\n- 多年来他在领导和推动多个大型架构现代化项目方面拥有成功的经验。\n\
    \n在加入 EY - IT 转型 - IT 咨询之前，他曾在 IBM GBS、Wipro Consulting Services、Infosys Technologies\
    \ 和 Deloitte Consulting 等组织工作，精通 IT 战略和企业转型倡议。\n\n# 目录\n\n- 版权所有。\n- 前言\n- 致谢\n\
