    # JPA Pros:


    - Isolate application from the database.

    - Increase manageability of application.

    - Improve developer productivity.

    - Ease of development and efficient persistence logic.

    - Can outperform hand-crafted SQL reducing the number of database roundtrips.

    - JPA entities can be used outside container hence promoting reuseability and
    coding effort.

    - JPA entities can be used on both presentation layer and business layer thus
    reducing coding effort and maintenance cost.

    - Supports lazy loading hence improving performance.

    - Best integration with EJB.


    # JPA Cons:

    - Loss of performance include additional layer.

    - Can not tuning SQL by hand.

    - Datastore is not well supported by ORM providers.

    - Developers need skilled in ORM (learning curve).


    # Java EE Vs Spring


    Some points to help you choose between Java EE and Spring:


    - Freedom to choose container - There are more than Java EE 6 compliant application
    servers today with a variety of open source and commercial offerings. If you would
    like to scale up deployed your application on GlassFish or WebLogic you can even
    take it to a different vendor because of the portability of Java EE 6. Spring
    is a set of products from a single company requires to bundle all libraries in
    one WAR file which could be bloated.

    - The Java EE 6 platform is created using Java Community where all big players
    like Oracle, RedHat, and Apache are contributing to make the platform successful.
    This allows you to choose application server for deploying your Java EE applications.
    If you are not happy with the support of one vendor then you can move your application
    to a different vendor because of portability offered by the platform - one price,
    one support, one sustaining organization, one sales organization, etc. Java EE
    backed by multiple vendors, is a safer bet for those that are averse.

    - Production support - With Spring you typically need to get support from two
    vendors - VMware. With Java EE 6 all of this is typically provided by one vendor.
    For example, Oracle offers commercial support from systems, operating systems,
    JDK, application server, and applications on top of them. VMware certainly offers.

    - Maintainability - With Spring you will be building your own distribution with
    multiple JAR files integrating, patching, versioning, etc. of all components.
    Spring''s claim is that multiple JAR files allow you can pick the latest versions
    of different components. The Java EE application servers manage all of this for
    you and provide a well-tested and commercially supported bundle.


    While it is always good to realize that there is something new and improved that
    replaces older frameworks like Spring, the good news is the Java EE container
    not only offers what is described but also lets you deploy and run your applications
    while you go through an upgrade to a more modern architecture. The end result
    is you get the best of both worlds keeping your legacy investment but moving to
    a more agile, lightweight world of Java EE 6.


    ![](img/a46bfe20cc12a7ad84c82266a2a2b9_38_0.png)


    Figure 3: Java EE Vs Spring


    # JSF Vs JSP


    Using JSF, one will get automatic binding of data to visual components, mapping,
    and validation of input data and saving of state between requests. Using JSP -
    you have to implement it manually. JSF also supports Ajax interaction with the
    server.


    If you are developing an application that requires a standard behavior such as
    data entry, editing and display - JSF is the best bet. If you need an online application
    with fast response, navigation within a page on the client side such as Gmail
    or twitter - you can spend a lot of time translating the client-side logic components
    in JSF. In this case you better use the JSP as a source of data and JavaScript
    library to display data. Therefore JSF is not suitable for all types of projects
    so those who use JSP will not be moving to JSF.


    # JSF Pros:


    - MVC framework. Offers a clean separation between behavior and presentation.

    - UI component model (binding, events, state saving, validation).

    - Multiple frontends (desktop and mobile browsers).

    - Hides the HTTP infrastructure.

    - Use IDE RAD environments.

    - Automatic event handling (map http requests to component specific).

    - Automatic server side validations and conversion.

    - Automatic I18N (i10n).

    - All features result in reduces development time.

    - Expression Language and Tag Libraries.


    # JSF Cons:


    - Standard HTML editor will not render the JSF. Need to deploy JSF app to page
    rendered.


    # Estimating Resource Needs – Hardware Sizing


    The NFR specifies the no. of concurrent users and the required up time. The transactions
    per second – tps can be derived from this data. So below are a few examples that
    can give you an idea for the hardware sizing of the solution.


    # Example 1: Business Application


    The application is a JEE learning management software that must support 2000 concurrent
    users with the availability of 24/7 and hence needs a very powerful DB Hardware.
    The infrastructure is:


    - 2 physical Application Server nodes and HTTP Server

    - 4 GB Memory (2GB will be for OS)

    - 8 (virtual) processors

    - Database: master-slave with automatic fail-over

    - 32 GB RAM

    - 24 (virtual) processors


    # Example 2: Web Application


    Liferay Portal for 5000 registered users with 500 of them accessing it would need
    an application server with 4GB memory and a 3GHz quad-core Xeon processor; for
    the database, a server below 4GB/1-quad 3GHz would suffice.


    # Conclusion


    Given the examples above, other information, for a requirement of 200 concurrent
    users doing no resource-intensive actions and 10h/day availability, One 4GB, 2-core
    2.5GHz machine running both a single AS and the DB would be able to satisfy the
    performance requirements.


    IBM recommends typical deployments of IBM WebSphere Application Server v7.0 require
    at least a high-cpu medium instance to have access to enough physical memory and
    computing power. That means 2 GB RAM and 2 (virtual) cores each with the power
    of 2.5-3.0 GHz 2007 Opteron processor. This is minimum production configuration
    to run WebSphere and can be taken as the minimum configuration for any standard
    Java EE web application.

