    ## Log your program state using a standard logging framework


    This includes exception handlers. Use a logging framework like JDK 1.4 or above
    logging or Log4J.


    Logging is sometimes the most tedious, undervalued part of programming, but it
    is the difference between long hours of debugging and going home at a reasonable
    time. As a general rule of thumb, at every transition point, log it. When you''re
    passing parameters from one method to another method, or between classes, log
    it. When some transformation on an object, log it. When in doubt, log it.


    Once you''ve made the decision to log, choose an appropriate framework. There
    are lots of good choices out there but we are partial to the JDK 1.4 trace APIs,
    as they are fully integrated into the WebSphere Application Server trace subsystem
    and are standards-based.


    ## Persistent Tier


    ## Favor Conventions over Exceptions


    In an ideal world, the default configuration settings would always be exactly
    what we wanted. Our use of configuration by exception would not require any exceptions
    to be configured. We can approach this ideal world by minimizing the frequency
    and severity of our deviations from the assumed configuration. Although there
    is nothing inherently wrong about providing specific exceptions to the default
    configuration settings, doing so requires more effort on our part to denote and
    maintain the metadata describing the exceptions to the default configuration.


    ## Use Portable Inheritance Mapping Strategies


    Even if your JPA provider does implement the optional “table per concrete class”
    inheritance mapping strategy, it is best to avoid this if you need JPA provider
    portability.


    It is also best to use a single inheritance mapping strategy within a given Java
    entity class hierarchy, because support for mixing multiple mapping inheritance
    strategies within a single class hierarchy is not required of JPA implementations.


    ## Leverage the Latest Tools


    Major integrated development environments (IDEs) now bundle several JPA-related
    tools. JDeveloper offers a wizard that can easily create JPA-based entity classes
    with appropriate annotations directly from specified database tables. With just
    a couple clicks, the JDeveloper user can similarly create a stateless session
    bean to act as a facade for these newly created entity beans. NetBeans 6.0 offers
    similar JPA wizards, and the Eclipse Dali project supports JPA tools for the Eclipse
    IDE.


    ## Add Spring to Your JPA


    A developer can use Spring to write JPA-based applications that can be easily
    run in standard Java environments, web containers, and full application server
