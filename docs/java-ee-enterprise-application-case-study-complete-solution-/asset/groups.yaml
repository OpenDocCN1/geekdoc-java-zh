- md: "\n# Java EE\nEnterprise Application\n\n# Case Study\n\nComplete Solution addressing\
    \ NFRs\n\n![](img/a46bf6e20cc12a7ad84c822666a2a2b9_0_0.png)\n\n# Java EE Enterprise\
    \ Application\nCase Study\n\nComplete Solution addressing NFRs\n\nRights Reserved.\n\
    \nThis work is subject to copyright. All rights are reserved, whether the whole\
    \ or part of the material is concerned specifically the rights of translation,\
    \ reprintting, reuse of illustrations, recitation, broadcasting, reproduction\
    \ on microfilm or in any other way, and storage in data banks.\n\nISBN: 9781483544731\n\
    \n# Preface\n\nThe motivation to write this book comes from facts that there a\
    \ a gamut of frameworks and technologies today to build a custom enterprise applications\
    \ using Java frameworks. Which options should I go with and what are the choices\
    \ that I need to make. Do I need to procure multiple frameworks or Java EE (5\
    \ and above) provides comprehensive capabilities to build an enterprise application.\
    \ Understanding this and the pros and cons of the several JEEEE technologies how\
    \ they fit into the Java enterprise application is the subject of this book. This\
    \ book also addresses the NFRs and explains how they will be addressed in the\
    \ solution. This title provides a step by step approach and best practices to\
    \ help architects and SME evangelize the solution which cover various views/diagrams\
    \ including design decision, assumptions, and risk and mitigation actions.\n\n\
    There are no reference artifacts in today that covers the entire process from\
    \ requirements to solutioning for an enterprise grade Java Application. These\
    \ references focus on describing the frameworks and its capability but none provides\
    \ an end-2-end view and process of how the solution can be evangelized including\
    \ addressing NFRs. This critical areas covered are transaction, security, frameworks,\
    \ hardware sizing, deployment models and scaling of the applications. Most of\
    \ the books and references will provide theoretical approach giving only limited\
    \ guidance which is not adequate for real world scenarios or enterprise scale\
    \ applications. The book is a good reference for understanding how the UML notations\
    \ and various models are leveraged by SME, designers and architects to document\
    \ enterprise applications.\n\nThis book describes the process of building a full\
    \ scale real world solution using the JEE (5.0 and above) application framework.\n\
    \n# Acknowledgements\n\nThank you to my discussion partners, reviewers and supporters,\
    \ whose valuable comments and feedback have greatly contributed to this book.\
    \ I look forward to your feedback on this title on an on-going basis.\n\nSpecial\
    \ thanks to my wife Vaishali and family members for the encouragement and constant\
    \ support during the development of the book.\n\n# About the Author\n\nSameer\
    \ S Paradkar is an Enterprise Architect with 15+ years of extensive experience\
    \ in the ICT industry which spans across Consulting, Product Development and Systems\
    \ Integration. He is certified in Open Group TOGAF, Oracle Master Java EA (SCEA),\
    \ TMForum NGOSS, IBM SOA Solutions, IBM Cloud Solutions and ITIL Foundation V3.\
    \ He serves as an advisory architect and mentor on Enterprise Architecture initiatives\
    \ and continues to work as a Subject Matter Expert and author. He has worked on\
    \ multiple architecture transformation engagements in the USA, UK, Europe, Asia\
    \ Pacific and Middle East Regions that presented a phased roadmap to transformation\
    \ that maximized the business value, while minimizing cost and risks. He has been\
    \ a globe-trotter and has travelled to multiple countries in 5 continents in his\
    \ ICT career.\n\n- He has worked as an enterprise architect on several IT architecture\
    \ transformation and modernization projects worldwide. Past clients includes AVIVA\
