    \ 的说辞是，多个 JAR 文件允许你选择不同组件的最新版本。Java EE 应用程序服务器为你管理这一切，并提供一个经过良好测试并受商业支持的包。\n\n\
    虽然意识到有新的、改进的框架来取代旧框架（如 Spring）总是好事，但好消息是 Java EE 容器不仅提供了上述描述的内容，还允许你在迁移到更现代架构的同时部署并运行你的应用程序。最终结果是你可以兼顾了两者的优点，既保留了遗留投资，又转向更敏捷、轻量级的\
    \ Java EE 6 世界。\n\n![](img/a46bfe20cc12a7ad84c82266a2a2b9_38_0.png)\n\n图 3: Java\
    \ EE 对 Spring\n\n# JSF 对 JSP\n\n使用 JSF，用户将获得数据到视觉组件的自动绑定、映射、输入数据验证以及请求之间的状态保存。使用\
    \ JSP 则需要手动实现。JSF 还支持与服务器的 Ajax 交互。\n\n如果你正在开发一个需要标准行为（如数据输入、编辑和显示）的应用程序——JSF\
    \ 是最佳选择。如果你需要一个响应快速、支持客户端页面内导航的在线应用程序（如 Gmail 或 twitter）——你可能花费大量时间在 JSF 中翻译客户端逻辑组件。在这种情况下，你最好使用\
    \ JSP 作为数据源，并使用 JavaScript 库来显示数据。因此，JSF 并不适用于所有的项目，所以使用 JSP 的人不会迁移到 JSF。\n\n\
    # JSF 优点：\n\n-   MVC 框架。在行为和表现层之间提供了整洁的分离。\n-   UI 组件模型（绑定、事件、状态保存、验证）。\n-   多个前端（桌面和移动浏览器）。\n\
    -   隐藏了 HTTP 基础设施。\n-   使用 IDE RAD 环境。\n-   自动事件处理（将 http 请求映射到特定组件）。\n-   自动的服务器端验证和转换。\n\
    -   自动国际化 (I18N)。\n-   所有功能都缩短了开发时间。\n-   表达式语言和标签库。\n\n# JSF 缺点：\n\n-   标准的 HTML\
    \ 编辑器无法渲染 JSF。需要部署 JSF 应用后才能渲染页面。\n\n# 估算资源需求 – 硬件选型\n\nNFR（非功能性需求）指定了并发用户数和所需的运行时间。每秒事务数（tps）可以从这些数据中得出。以下是几个可以提供解决方案硬件选型思路的示例。\n\
    \n# 示例 1：业务应用程序\n\n该应用程序是一个 JEE 学习管理软件，必须支持 2000 个并发用户并 24/7 可用，因此需要非常强大的数据库硬件。基础设施如下：\n\
    \n-   2 个物理应用程序服务器节点和 HTTP 服务器\n-   4 GB 内存（2GB 用于操作系统）\n-   8 个（虚拟）处理器\n-   数据库：主从模式且带自动故障转移\n\
    -   32 GB RAM\n-   24 个（虚拟）处理器\n\n# 示例 2：Web \n\n为 5000 个注册用户（其中 500 人访问）提供 Liferay\
    \ Portal，需要一个拥有 4GB 内存和 3GHz 四核 Xeon 处理器的应用程序服务器；对于数据库，一台低于 4GB/1四核3GHz 的服务器即可。\n\
    \n# 结论\n\n鉴于上述示例和其他信息，对于 200 个不执行资源密集型操作的并发用户且每天可用 10 小时的需求，一台 4GB 内存、2 核 2.5GHz、同时运行单个\
    \ AS 和数据库的机器能够满足性能要求。\n\nIBM 建议典型的 IBM WebSphere Application Server v7.0 部署至少需要高\
    \ CPU 实例以访问足够的物理内存和计算能力。这意味着 2 GB RAM 和 2 个（虚拟）核心，每个核心 2.5-3.0 GHz 2007 代 Opteron\
    \ 处理器。这是运行 WebSphere 的最小生产配置，也可以作为任何标准 Java EE Web 应用的最小配置。\n"
