    ## Sequence Diagram


    The sequence diagram shows the flow of messages between different objects. The
    sequence diagram explains the use case realization of Post Oil for Sale Use Case,
    Bid on Oil Product Use Case, Transfer Ownership Use Case, and Pay for Winning
    Bid Use Cases.


    ## POST OIL PRODUCT FOR SALE – SEQUENCE DIAG


    The following diagram shows the mapping to the Post Oil for Sale Use Case. This
    allows the Zamco Representative to place oil product for sale in the market place.


    ![](img/a46bf6e20cc12a7ad84c822666a2a2b9_73_0.png)


    Figure 17: Post Oil for Sale Sequence Diagram – Zamco


    ## BID ON OIL PRODUCT – SEQUENCE DIAG


    The following diagram shows the mapping to Bid on Oil Product Use Case. This allows
    potential buyer to place bids for a specific quantity of Oil Product. The potential
    buyer searches offers matching criterion and the system responds with matching
    offer. The potential buyer selects a specific offer of interest and places bid
    for the product.


    ![](img/a46bf6e20cc12a7ad84c822666a2a2b9_74_0.png)


    Figure 18: Bid on Oil Product Sequence Diagram – Zamco


    ## TRANSFER OWNERSHIP / SHIP OIL PRODUCT – SEQUENCE DIAG


    The following diagram shows the mapping to the Transfer Ownership Use Case. This
    allows an authorized Zamco Representative to transfer Ownership of the purchased
    offer directly to the purchaser or to a named intermediary for transport to destination.
    This is initiated with the Zamco Representative selects a specified close successful
    offer.


    ![](img/a46bf6e20cc12a7ad84c822666a2a2b9_75_0.png)


    Figure 19: Transfer Ownership Ship Product Sequence Diagram – Zamco


    ## PAY FOR WINNING BID – SEQUENCE DIAG


    The following diagram shows the mapping to the Pay for Winning Bid Use Case. This
    allows the authorized buyer to pay for an oil product won at at the auction. After
    successful buyer executes request for successful bid the system responds with
    successful bid.


    ![](img/a46bf6e20cc12a7ad84c822666a2a2b9_76_0.png)


    Figure 20: Pay for Winning Bid Sequence Diagram – Zamco

