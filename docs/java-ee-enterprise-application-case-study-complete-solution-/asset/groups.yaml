    use of JAAS modules rather than relying on built-in spec compliant application
    server mechanisms for authentication and authorization. Be very wary of going
    beyond the authentication mechanisms provided by the Java EE specification. This
    can be a major source of security holes and vendor compatibility problems. Likewise,
    rely on the authorization mechanisms provided by the servlet and EJB specs, and
    where you need to go beyond them, make sure you use the spec''s APIs (such as
    CallerPrincipal()) as the basis for your implementation. This way you will be
    able to leverage the vendor-provided strong security infrastructure and, where
    business needs require, support more complex authorization rules.


    Other common problems include using persistence mechanisms that are not tied to
    the Java EE spec (making transaction management difficult), relying on inappropriate
    Java Standard Edition facilities (like threading or singletons) within your Java
    EE programs, and "rolling your own" solutions for program-to-program communication
    instead of staying within supported mechanisms like Java 2 Connectors, JMS, or
    Web services. Such design choices cause no end of difficulty when moving from
    one Java EE compliant server to another, or even when moving to new versions of
    the same server. Using elements outside of Java EE often causes subtle portability
    problems. The only time you should ever deviate from a spec is when there is a
    clear problem that cannot be addressed within the spec.


    Finally, be careful about adopting new technologies too early. Overzealously adopting
    a technology before it has been integrated into the rest of the Java EE specification,
    or into a vendor''s product, is often a recipe for disaster. Support is critical
    and if your vendor doesn''t directly support a particular technology, you should
    carefully consider if you should use it. People tend to focus too much on easing
    the development process and neglect the long term consequences of depending on
    large amounts of code developed outside your organization which is not supported
    by a vendor. Many project teams are enamored with new technology (for example,
    the latest open source framework) and quickly become dependent upon it without
    considering the very real costs to the business. Frankly, the decision to use
    any technology beyond what you''ve bought from your vendors should be carefully
    reviewed by corporate architecture, business, and legal teams (or their equivalent
    in your environment); just as normal product purchasing decisions are evaluated.
    After all, with rare exceptions, most of us are in the business of solving business
    problems, not advancing technology for the sheer fun of it.


    # Plan for Java EE security proactively


    Turn on Application Server security. Lock down all your EJBs and URLs to at least
    all authenticated users.


    It''s a continual source of astonishment to us how few customers we work with
    originally plan to turn on WebSphere Application Server''s Java EE security. Only
    around 50% of the customers we plan to use this feature. We have even worked with
    several major financial institutions that did not plan on turning security on;
    luckily this situation was usually addressed in review prior to deployment.


    Not leveraging Java EE security is a dangerous game. Assuming your application
    requires security (almost all do); you are betting that your developers can better
    build a security infrastructure than the one you bought from the Java EE vendor.
    This is not a good bet. Securing a distributed application is extraordinarily
    difficult. For example, you need to control access to EJBs using a network-safe
    encrypted token. Most home-grown security infrastructures are not secure -- with
    significant weaknesses that leave production systems terribly vulnerable.


    In particular, while products like Access Manager provide excellent security features,
    they alone cannot secure an entire Java EE application. They must work hand in
    hand with the Java EE application server to secure all aspects of the system.


    Another common reason given for not using Java EE security is that the role-based
    model does not provide sufficiently granular access control to meet complex business
    rules. Though this is often true, this is no reason to avoid Java EE security.
    Instead, leverage the Java EE authentication model and Java EE roles in conjunction
    with your specific extended rules. If a complex business rule is needed to make
    a security decision, write the code to do it, basing the decision upon the readily
    available and trustable Java EE authentication information (the user''s ID and
    roles).


    # Iterative and Incremental Development


    Iterative development enables you to gradually master all the moving pieces of
    Java EE. Build small, vertical slices through your application rather than doing
    everything at once.


    Java EE is a big framework and if a development team is just starting with Java
    EE, it is far too difficult to try learning it all at once. There are simply too
    many concepts and APIs to master. The key to success in this environment is to
    take Java EE on in small, controlled steps.


    This approach is best implemented through building small, vertical slices through
    your application. Once a team has built its confidence by building a simple domain
    model and back-end persistence mechanism (perhaps using JDBC), and has thoroughly
    tested model, they can move onto mastering front-end development with servlets
    and JSPs that use that domain model. If a development team finds a need for EJBs
    they could likewise start with simple session facades atop container-managed persistence
    EJBs or JDBC-based DAOs (Data Access Objects) before moving onto more sophisticated
    constructs like message-driven beans and JMS. This approach is nothing new, but
    relatively few teams actually build their skills in this way.


    Instead, most teams cave in to schedule pressures by trying to build everything
    at once -- they attack the View layer, the Model layer, and the Controller layer
    in MVC, simultaneously. Instead, consider adopting some of the new Agile development
    methods, such as Extreme Programming (XP), that foster this kind of incremental
    learning and development. There is a procedure often used in XP known as Model
    First that involves building the domain model first as a mechanism for organizing
    and implementing your user stories. Basically, you build the domain model as part
    of the first set of user stories you implement, and then build a UI on top of
    it as a result of implementing later user stories. This fits very well with letting
    a team learn technologies one at a time, as opposed to sending them to a dozen
    simultaneous classes (or letting them read a dozen books), which can be overwhelming.


    Also, iterative development of each application layer fosters the application
    of appropriate patterns and best practices. If you begin with the lower layers
    of your application and apply patterns like Data Access Objects and session facades,
    you should not end up with domain logic in your JSPs and other View objects.


    Finally, when you develop in thin vertical slices, it makes it easier to start
    early in performance testing your application. Delaying performance testing until
    the end of an application development cycle is a sure recipe for disaster.


    # Leverage Java EE capabilities


    Commit to building real Java EE applications that truly leverage Java EE function.


    One of the most disturbing things we''ve seen more than once is an application
    that claims to "run in WebSphere" but isn''t really a WebSphere application. We''ve
    seen several examples where there is a thin piece of code (perhaps a servlet)
    in WebSphere Application Server and all of the remaining application logic is
