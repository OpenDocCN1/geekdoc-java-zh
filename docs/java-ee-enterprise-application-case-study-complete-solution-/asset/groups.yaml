    开源项目在演进方面比商业产品更敏捷。通常，开源项目的发布周期比其对应的商业产品短，这至少是因为大多数项目都提供每夜快照（nightly snapshots）或直接对源代码仓库的访问权限。此外，组织不需要等待供应商的下一个发布版本来修复漏洞。拥有源代码为组织提供了自己修复漏洞的方法。愿意为开源项目做贡献的组织对项目的未来方向产生影响力。与专有开发不同，开源的优势在于可以接受潜在成百甚至上千名用户的审查和测试。单元测试和回归测试是软件质量的重要部分。像
    Jakarta Commons 这样的开源项目要求在版本发布之前必须提供并通过 JUnit 测试。获取 JUnit 测试的访问权限可以通过提供将新版本与当前使用版本的单元测试进行对比的手段，来降低风险。测试结果可以作为风险管理工具，以确定升级对项目的影响。开源还能够促进个人的职业发展。开发者可以使用源代码学习新技术或
    API。开源还通过允许使用更具经济效益的手段评估新技术，降低了准入门槛。对于缺乏经验的 Java 开发者来说，为开源项目做贡献可能是向雇主或潜在雇主展示知识的一种方式。开发者通常会评估某项技术并使用开源项目作为开发环境对概念验证应用进行建模，同时在商业平台上进行部署以供生产使用。


    ## 缺点


    开源项目的文档记录通常较差。此外，开源软件通常没有背后受认可的公司为其提供支持（无论是免费还是付费）。这些缺点正在发生。一个围绕开源的新兴市场已经建立，以提供高质量的文档和支持——尽管是付费的。此外，许多项目拥有活跃的新闻组或论坛，可以有效地用于排查开源应用程序的故障。


    开源项目还会受到后兼容问题的困扰。开源项目对后兼容性的考虑没有商业组织那么充分。然而与此同时，开源项目在创新和尝试从完全不同的角度解决问题时，往往变得更大胆。


    开源最大的缺点是缺乏营销资金。通常，组织并不知道某个开源项目的存在，也不知道它可能如何应用。开源项目没有会议展位、杂志广告，也没有推销人员来解释它们可以解决的问题。开源项目还取决于贡献者的热情和人数，以及他们努力所关注的领域。例如，缺乏文档和管理工具是关于开源项目常见的投诉。


    这让人想起了具有强力商业背景支持的成功开源项目，例如 Eclipse 项目，它由 IBM 支持，因此考虑到可用资源（即 IBM 员工、技术作家和编辑），拥有非常好的文档。


    ## 附录 IV：规模与容量规划


    在与你生产环境中类似的硬件上对你的代码进行基准测试，识别任何瓶颈，然后确定当前硬件可以处理多少工作负载，和/或你需要多少硬件算力来处理目标工作负载。


    流程的简要概述：


    - 创建用户场景

    - 添加监控功能

    - 增加用户负载

    - 分析结果

    - 修复

    - 清洗并重复


    ## 第一步：创建用户场景


    搭建一个用于测试的环境。如果可能，这应该与你的生产硬件相当相当，否则你将不得不对数据进行外推。设置好你的服务器、账户、网站、带宽等。即使你在 VM 中进行这些操作也可以，只要你准备好扩展你的测试结果即可。


    ## 第二步：添加监控功能


    你需要指标来监控，例如：有多少请求到达 Web 服务器，以及在用户开始获得超过两秒响应时间之前，每秒可以挤入多少请求。你必须监控 RAM、CPU 和磁盘使用情况，以确保负载均衡器能够处理连接。你可能需要查看
    Web 服务器日志文件、启动性能计数器，或依靠压力测试工具的报告功能。需要监控的方面有：


    - CPU 使用率

    - RAM 使用率

    - 磁盘使用率

    - 磁盘延迟

    - 网络利用率


    取决于你具体测试的内容，你可能还会查看 SQL 死锁、寻道时间等。


    ## 第三步：增加用户负载


    模拟负载。有很多工可以做到这一点，并带有可配置选项：


    - JMeter (Web)

    - Apache Benchmark (Web)

    - Grinder (Web)

    - httpperf (Web)

    - WCAT (Web)

    - Visual Studio Load Test (Web)

    - SQLIO (SQL Server)


    选择一个数字，假设你想看系统在每分钟点击次数下的响应。你选择哪个数字并不重要，因为你要多次重复这一步骤，向上或向下调整数字以观察系统的响应。


    理想情况下，你应该将这 10,000 次请求分布在多个负载测试客户端/节点上，这样单个客户端就不会成为请求的瓶颈。例如，JMeter 的 Remote Testing
    提供了一个中心界面，可以从控制 JMeter 的机器启动多个客户端。按下那个神奇的 Go 按钮，看着你的 Web 服务器熔化并崩溃。


    ## 第四步：分析结果


    现在，你需要回到第 2 步收集的指标。你发现当 10,000 个并发连接时，你的高可用代理框几乎是不费吹灰，但两个 Web 服务器的响应时间超过了五秒。


    ## 第五步：修复


    现在你需要将你的网站速度提高一倍以上。所以你知道你需要向上扩展（scale up）或水平扩展（scale out）。要向上扩展，获取更大的服务器、更多的内存、更快的磁盘。要水平扩展，获取更多服务器。使用第
    2 步的指标来做此决定。例如，如果你看到测试期间磁盘延迟巨大，你需要向上扩展并获取更快的驱动器。如果你看到处理器占用 100%，你可能需要水平扩展以减轻现有服务器的压力。没有通用的正确答案，只有适合你的答案。向上扩展，如果这样做无效，就改为水平扩展。假设我们要水平扩展，所以我决定克隆我的
    Web 服务器。


    ## 第六步：清洗并重复


    从第 3 步重新开始。如果你发现不符合预期（例如，我们双倍了 Web 服务器，但仍然有瓶颈），那么请检查其他瓶颈。例如，你双倍了 Web 服务器，但数据库服务器仍然糟糕。或者你克隆了更多
    VM，但由于它们在同一个物理主机上，你只导致了对服务器资源的竞争。你可以使用此程序测试系统的其他部分。与其直接访问负载均衡器，不如直接访问 Web 服务器，或使用
    SQL 基准测试工具访问 SQL 服务器。


    影响服务器可扩展性和长期策略的因素如下表。


    | 决定因素 | 当前因素 | 三年后的增长 |

    |---|---|---|

    | 事务数量 | X | 50% |

    | 单次事务成本 | Y | 10% |

    | 并发用户数 | | 10% |


    ## 图 23：增长预测


    容量规划始于测量，在本例中是响应时间与负载。一旦知道了程序随负载变慢的程度（这不是线性函数），你就可以选择一个响应时间目标，然后发现满足该目标需要多少资源。


    性能测量始终使用时间单位进行，因为时间是用户关心的，而且它们可以扩展或缩小。像 %CPU 和 IOPS 这样的指标是特定系统的，因此只有在你对系统进行了规划并在生产环境中进行了测量后，才使用它们作为你所关心的事物（时间）的“代理”。'
