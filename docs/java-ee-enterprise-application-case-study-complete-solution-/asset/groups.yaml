    # Java EE Vs Spring


    Some points to help you choose between Java EE 6 and Spring


    +   • Freedom to choose container - There are more than 14 Java EE 6 compliant
    application servers today, with a variety of open source and commercial offerings.
    A Java EE 6 application can be deployed on any of those containers. So if'
  - '[PAGE 37]


    you deployed your application on GlassFish today and would like to scale up then
    you can deploy the same application to WebLogic. And because of the portability
    of a Java EE 6 application, you can even take it to a different vendor altogether.
    Spring requires a runtime which could be any of these app servers as well. Spring
    also has a different definition of portability where they claim to bundle all
    the libraries in the WAR file and move to any application server. But that archive
    could be bloated.


    +   - Vendor choice - The Java EE 6 platform is created using the Java Community
    Process where all the big players like Oracle, IBM, RedHat, and Apache are contributing
    to make the platform successful. Each application server provides the basic Java
    EE 6 platform compliance and has its own competitive offerings. This allows you
    to choose an application server for deploying your Java EE 6 applications. If
    you are not happy with the support or feature of one vendor then you can move
    your application to a different vendor because of the portability promise offered
    by the platform.


    +   - Spring is a set of products from a single company, one price book, one support
    organization, one sustaining organization, one sales organization, etc. Java EE,
    backed by multiple vendors, is a safer bet for those that are averse.


    +   - Production support - With Spring, typically you need to get support from
    two vendors - VMware and the container provider. With Java EE 6, all of this is
    typically provided by one vendor. For example, Oracle offers commercial support
    from systems, operating systems, JDK, application server, and applications on
    top of them. VMware certainly offers'
  - '[PAGE 38]


    complete production support but this will putting all your eggs in one basket.


    +   - Maintainability - With Spring, you will be building your own distribution
    with multiple JAR files, integrating, patching, versioning, etc of all those components.
    Spring''s claim is that multiple JAR files allow you can pick the latest versions
    of different components. The Java EE application servers manage all of this for
    you and provide a well-tested and commercially supported bundle.


    While it is always good to realize that there is something new and improved that
    updates and replaces older frameworks like Spring, the good news is the Java EE
    6 container not only offers what is described, but also lets you deploy and run
    your Spring applications on them while you go through an upgrade to a more modern
    architecture. The end result is you get the best of both worlds keeping your legacy
    investment but moving to a more agile, lightweight world of Java EE 6.


    ![](img/a46bf6e20cc12a7ad84c822666a2a2b9_38_0.png)


    Figure 3: Java EE Vs Spring


    # JSF Vs JSP'
