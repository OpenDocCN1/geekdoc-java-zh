    # Part II – Non-Functional Requirements


    ## Tackling the NFRs


    You should have a clear view on the non-functional characteristics of the application
    and why your solution meets and or or exceeds these requirements. You should also
    understand and appreciate the main technical risks inherent in both the business
    and technology landscape and provide mitigations actions.


    - Performance

    - Scalability

    - Reliability

    - Security

    - Availability


    Maintainability Handling NFRs will boil down to the following key aspects:


    - Why and How are you meeting the individual non-functional requirements (performance,
    security, ...)

    - What were the individual technological choices you have made and alternatives
    considered and why you''veve rejected them.

    - Key ones are communication with external systems, Patterns leveraged, frameworks
    that were leveraged during the design process


    ## NFRs – Solution


    The below sections describes the solution options for the NFR for the given business
    problem.


    ### Performance


    The following mechanisms were recommended for Zamco Application architecture to
    achieve required performance:


    - The 3 tiers namely web, application and database are hosted on different hardware
    machines. Hence the resource intensive operations implemented in EJB tier and
    the Database are hosted on dedicated hardware providing improved performance.

    - Use of connection pooling for data base connections will improve performance.

    - Use of bean pooling in the EJB container will improve the performance

    - Using Business Delegate pattern will reduce the number of round trips between
    presentation and Business logic layer hence improving the performance.

    - Using Service locator will improve the performance. Service Locator will avoid
    performance overhead due to initial context creation and service lookups.

    - Transfer Object can avoid network performance degradation caused by chattier
    applications.

    - Caching of objects will improve the application performance


    ### Scalability


    The following mechanisms were recommended for Zamco Application architecture to
    achieve required scalability:


    - The architecture is designed to support both vertical as well as horizontal
    scalability.

    - To handle more number of client requests the application can be scaled by deploying
    additional Web containers in multiple machines.

    - The application server will be clustered which allows the ability to add processing
    capability by simply adding instances to the cluster.

    - Using connection pooling for database and bean pooling for EJB improves scalability
    of applications.

    - Design of application using stateless session beans improves scalability of
    application. (ProductSaleManager, BidManager and PaymentManager)

    - Application or database servers nodes can be added (horizontal scaling) to improve
    the scalability of the application.

    - The business logic is not tightly coupled with web tier components and hence
    deploying the application components (EJB components) in separate node and clustering
    them is very easy.

    - The architecture does not use any entity beans (EJB 2.1). This increases the
    amount of objects created in memory and would enhance scalability.


    ### Availability


    The following mechanisms were recommended for Zamco Application architecture to
    achieve high availability:


    - Application is designed with a hot stand-by configuration for high availability.

    - Incase the primary servers goes down the load balancer will be able to route
    the request to secondary / hot standby nodes.

    - The load balancer can be configured to route traffic to hot standby in case
    the primary reaches capacity threshold.

    - Stateless design - When a particular stateless server fails, its work can be
    re-directed to a different server instance without implications for state management.


    ### Security


    The following mechanisms were recommended for Zamco Application architecture to
    achieve required security:


    - The security will be provided through DMZ using inner and outer firewall. Application
    and Database servers will be behind the inner firewall and the web server will
    be behind outer firewall in the DMZ.

    - The architecture uses Form Based authentication for the web tier and the security
    logic is implemented in reusable business component (UserManager) in the application
    tier.

    - SSL will provide the desired security for sending sensitive information to critical
    systems like Merchant Bank and Market Place

    - JMS Message-level (Using Encryption and Digital signatures) and Transport-layer
    security (Using SSL).

    - The application will use LDAP for authentication at the web tier and use role
    based security at the web and business tier for authorization.


    **Best Practices:**


    - SQL Injection: Prepared or Dynamic SQL Statements

    - Cross Site Scripting: JSF Validation, Avoid JavaScript’s, and Avoid Frame/iFrames

    - Denial of Service: Service Request Queue Technique. Limiting the number of Concurrent
    Request and queuing all excess requests.

    - Man-in-the-Middle: Using SSL, Avoid Frames/iFrames, URL Rewriting


    ## Reliability


    The following mechanisms were recommended for Zamco Application architecture to
    achieve reliability:


    - Primary application server serves all the request, a backup server is configured
    to route traffic if primary goes down.

    - Data Integrity is achieved with security controls which prevent unauthorized
    access.

    - Database transactions ensure a full commit or rollback based on success/failure.


    ## Extensibility and Maintainability


    The following mechanisms were recommended for Zamco Application architecture to
    achieve extensibility and maintainability:


    - The logical separation of the application into different tiers (Client, Presentation,
    Business Logic, Integration and EIS) allows system to be flexible. When there
    are changes in presentation it will not affect other tiers. The The architecture
    uses command pattern at the web tier (JSF Backing classes) for handling web events.
    We can easily create a new action by developing BackBean class and configure it
    in faces-config.xml. modifying the existing functionality becomes easy. Object
    oriented design like encapsulation, inheritance, low coupling and high cohesion
    are leveraged in application design. So any change to sub systems will have less
    impact on systems are using it as long interfaces remain same.

    - Independence of interface from implementation – This mechanism allows architects
    to substitute different implementations for the same functionality.

    - This is supported with good documentation of the application (Architecture diagrams,
    Interface agreements with external systems, Class diagrams, Sequence diagrams,
    Coding Guidelines etc)


    ## Manageability


    The following mechanisms were recommended for Zamco Application architecture to
    achieve manageability:


    - Good logging mechanism to indicate any Fatal or Error conditions

    - Leverage Tivoli software to provide extensive monitoring and management capability
    for the application

    - Instrumentation and profiling of code to ensure that it meets the quality thresholds


    ## Sessions ( State ) Management


    The following mechanisms were recommended for Zamco Application architecture for
    session / state management:


    - The architecture uses JSF Faces servlet (FrontController), which is the gateway
    to all the incoming requests to the system. It handles the client session at common
    place in HttpSession object at the web tier.

    - EJB tier is not used for handling the stateful session hence affecting the application''s
    scalability.

    - Most of the application server supports HTTP session in memory replication and
    will be used during the applications clustered failover.


    ## Transaction & Concurrency


    The following mechanisms were recommended for Zamco Application architecture for
    transaction & concurrency:


    - The application design incorporates container-managed transaction for database
    transactions, which allows for simpler, more portable code.

    - All transactions related to one component are managed by a single workflow manager
    object through an EJB. This EJB is a stateless session bean designed using the
    facade pattern.

    - The architecture uses JPA Entity (Payment (@Entity)) to handle the payment transaction.
    The method is invoked with Requires New transaction attribute set via a stateless
    session bean.

    - Entity instance are based on rows and EntityManager takes care of concurrency.

    '
