    应用服务器 Application Server。确保您的解决方案以厂商中立的格式交付。


    # 总结


    清晰性使利益相关者能够快速、简要地理解您提出的解决方案。在开发和记录解决方案时，请提出以下问题以确保您的方案不偏离轨道：


    - 我是在为所提出的业务问题提供解决方案，还是在解决我想解决的问题？

    - 我的解决方案是否有清晰的文档，它是否反映了设计意图？

    - 我的解决方案是否简单简洁，同时能清晰地解决场景中呈现给我的业务问题？


    在处理 Java EE 时，我们所需大部分服务都由应用程序服务器提供。因此，所需的依赖项极少。在大多数情况下，Java EE 提供了“例外配置”（configuration
    by exception），这意味着几乎不需要进行任何配置，在绝大多数情况下都使用了合理的默认值。当需要配置时，通过注解完成，这允许我仅通过查看源代码即可获取全貌，而无需在
    XML 配置文件和源代码之间来回切换。


    ![](img/a46bf6e20cc12a7ad84c822666a2a2b9_110_0.png)


    图 21：Java EE Framework 7


    Java EE 为开发和部署多层、分布式应用程序提供平台，这些应用的设计目标是可维护、可扩展和可移植的。就像办公大楼需要许多水利、电力等电信隐藏基础设施一样，大型应用程序需要大量的支持基础设施。这些基础设施包括数据库访问、事务支持和安全性。Java
    EE 提供了这些基础设施，让您可以专注于自己的应用程序。


    构建分布式应用程序允许您将软件划分为不同的责任层（或层）。分布式应用程序通常被划分为三个主要层：表示层、业务规则层和数据访问层。将应用程序划分为不同的层可以使软件更具维护性，并在对应用程序的需求增加时提供扩展应用的机会。


    Java EE 架构基于围绕多层责任构建应用的想法。应用程序开发者创建组件，这些组件由 Java EE 容器托管。容器在 Java EE 架构中起着核心作用。


    Servlets 是 Java EE Web 组件的一种。这些 Java 类托管在 Java EE 服务器内部，并通过对 Web 服务器发出的请求被调用。这些
    Servlets 通过动态生成 HTML 来响应这些请求，并将 HTML 返回给请求客户端。


    JSPs 在概念上与 Servlets 非常相似，但不同之处在于 Java 代码嵌入在 HTML 文档中。Java EE 服务器随后将该 HTML 文档编译为
    Servlet，然后该 Servlet 响应客户端请求生成 HTML。


    JSF 是一种用于创建完整且丰富的用户界面的 Java EE 技术。标准用户界面组件在服务器端创建并与业务逻辑组件连接。自定义渲染器（Custom renderers）获取这些组件并创建实际的用户界面。


    JDBC 是一种允许应用程序与数据存储通信的技术。通常情况下，它是关系数据库，数据存储在表中，表通过表之间的逻辑关系连接起来。JDBC 提供了一个通用接口，允许您通过标准接口与数据库通信，而无需学习特定数据库的语法。


    EJBs 是 Java EE 的核心，是构建 Java EE 中业务规则逻辑的组件模型。EJBs 可以设计为在与客户端会话期间保持状态，也可以是无状态的。它们还可以被设计为短寿命且瞬态的，或者持久化以供以后使用。EJBs
    还可以设计为监听消息队列并响应特定的消息。Java EE 的内容远不止 EJBs，尽管 EJBs 确实扮演着重要角色。


    Java EE 平台除了 Servlets、JSPs 和 EJBs 的组件托管外，还提供了许多服务。基础服务包括对 XML、Web 服务、事务和安全性的支持。


    对 XML 的广泛支持是 Java EE 的核心组件。支持基于文档和基于流的 XML 文档解析构成了 XML 支持的基础。额外的 API 提供了 XML 注册服务、通过
    XML 的远程过程调用调用以及基于 XML 的消息支持。


    Web 服务高度依赖 XML，它们提供了在 Web 上描述、注册、查找和调用对象服务的支持。Java EE 提供了将 Java EE 组件作为 Web 服务进行发布和访问的支持。


    为了确保分布式数据库系统的数据完整性，需要事务支持。这允许将复杂的、多步骤的数据库更新视为单个步骤，并有相应的机制在成功时提交整个过程或在失败时通过回滚完全撤销。Java
    EE 为分布式数据库事务提供了内在支持。


    Java EE 提供了可配置的安全性，以确保敏感系统获得适当的保护。安全性以认证和授权的形式提供。


