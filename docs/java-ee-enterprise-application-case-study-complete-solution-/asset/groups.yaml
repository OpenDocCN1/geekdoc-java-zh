    - 组件图 – 逻辑架构\n- 部署图 – 物理架构\n- 序序图 – 从用例到时序图\n- 设计决策\n- 总结\n- 业务问题——案例研究\n- 解决方案\n\
    - 目标与范围\n- Zamco 业务领域模型\n- 假设\n- 架构决策\n- 风险与缓解\n- Zamco 架构概述\n- Zamco 应用框架\n-\
    \ Zamco UML 图表\n- 第二部分 – 非功能性需求\n- 处理 NFR\n- NFR - 解决方案\n- 性能\n- 可扩展性\n- 可用性\n\
    - 安全\n- 可靠性\n- 可扩展性和可维护性\n- 可管理性\n- 会话\n- 事务\n- 分布\n- 第三部分 – Java 最佳实践\n- 最佳实践\
