    如今常见的问题是，开发者通过使用 JAAS 模块接管 Java EE 安全，而不是依赖内置的符合规范的应用服务器机制进行身份验证和授权。要非常警惕超出 Java
    EE 规范提供的身份验证机制，这可能是安全漏洞和供应商兼容性问题的主要来源。同样，请依赖 servlet 和 EJB 规范提供的授权机制，当你的需要超出这些范围时，确保你使用规范的
    API（例如 `CallerPrincipal()`）作为你实现的基础。这样一来，你能够利用供应商提供的强力安全基础设施，并在业务需要时支持更复杂的授权规则。


    其他常见问题还包括：使用与 Java EE 规范脱的持久化机制（这会导致事务管理变得困难）、在 Java EE 程序中依赖不恰的 Java SEset（如线程或单例）、以及在程序间通信中“自研”解决方案，而不是留在
    Java 2 Connectors、JMS 或 Web 服务等支持的机制内。此类设计选择在从一个符合 Java EE 标准的服务器迁移到另一个服务器，甚至是迁移到同一服务器的新版本时，会带来无穷的困难。使用
    Java EE 之外的元素通常会导致微妙的移植性问题。只有当存在无法在规范内解决的明确问题时，你才应该偏离规范。


    最后，要小心过早采用新技术。在某项技术集成到 Java EE 规范的其他部分或供应商产品之前就过度狂热地采用它，往往是导致灾难的根源。支持至关重要，如果你的供应商不直接支持某项技术，你应该仔细考虑是否应该使用它。人们倾向于过度关注简化开发过程，而忽视了依赖由组织之外开发且不受支持的大量代码的长期后果。许多项目团队痴迷于新技术（例如，最新的开源框架），并迅速对其产生依赖，而没有考虑给业务带来的非常真实的成本。坦率地说，使用任何超出你从供应商处购买范围的技术决策，都应该由公司架构、业务和法律团队（或你环境中的对应部门）进行仔细审查，就像评估正常的产品购买决策一样。毕竟，除少数例外外，我们大多数人的业务是解决业务问题，而不是为了纯粹的乐趣而追求技术。


    # 主动规划 Java EE 安全


    开启应用服务器安全。将所有的 EJB 和 URL 锁定到至少允许已验证的用户访问。


    让我们感到惊讶的是，我们合作的客户中，最初很少有人计划开启 WebSphere Application Server 的 Java EE 安全。只有大约 50%
    的客户计划使用此功能。我们甚至与几家没有计划开启安全的大型金融机构合作过；幸运的是，这种情况通常在部署前的评审中得到了解决。


    不利用 Java EE 安全是一场危险的游戏。假设你的应用程序需要安全防护（几乎所有程序都是如此）；你是在赌你的开发者可以构建出比你从 Java EE 供应商处购买的更优的安全基础设施。这不是一个好的赌注。保护一个分布式应用程序是非常困难的。例如，你需要使用网络安全的加密令牌来控制对
    EJB 的访问。大多数自建的安全基础设施是不安全的——具有明显的弱点，会导致生产系统变得极其脆弱。


    特别是，虽然像 Access Manager 等产品提供了卓越的安全功能，但它们本身无法保护整个 Java EE 应用程序。它们必须与 Java EE 应用服务器协同工作，以确保系统的各个方面。


    另一个不使用 Java EE 安全的常见原因是：基于角色的模型无法提供足够细粒度的访问控制来满足复杂的业务规则。虽然这通常是事实，但这并不是避免 Java
    EE 安全的理由。相反，请结合 Java EE 身份验证模型、Java EE 角色以及你特定的扩展规则。如果需要复杂的业务规则来做出安全决策，请编写代码来实现，并基于易于获取且可靠的
    Java EE 身份验证信息（用户 ID 和角色）来做出决策。


    # 迭代与增量开发


    迭代开发让你能够逐渐掌握 Java EE 的所有组成部分。通过在应用程序中构建细小的垂直切片，而不是一次性完成所有工作。


    Java EE 是一个巨大的框架，如果一个开发团队刚开始接触 Java EE，试图一次性学习所有内容就太困难了。要掌握的概念和 API 太多了。在这个环境中，成功的关键是以小小的、受控的步骤来接受
    Java EE。


    这种方法通过在你的应用程序中构建细小的垂直切片来实现最好。一旦团队通过构建一个简单的领域模型和后端持久化机制（可能使用 JDBC）建立了信心，并对模型进行了彻底测试，他们就可以转向精通使用该领域模型的
    servlets 和 JSPs 进行前端端开发。如果开发团队发现需要 EJB，他们同样可以从容器管理的持久化 EJB 或基于 JDBC 的 DAO（数据访问对象）之上构建简单的会话门面（Session
    Facades）开始，然后再迁移到如消息驱动 de beans 和 JMS 等更复杂的结构。这种方法并不新鲜，但实际上很少有团队以这种方式建立自己的技能。


    相反，大多数团队为了应对进度压力而妥协，试图一次性构建所有内容——他们同时攻击 MVC 中的视图层、模型层和控制器层。相反，请考虑采用一些新的敏捷开发方法，例如极端编程（XP），这些方法可以促进这种增量式的学习和开发。XP
    中常用的一种程序被称为“模型优先”（Model First），它涉及首先构建领域模型，作为组织和实现用户故事的机制。基本上，你是在实现的第一批用户故事时构建领域模型，然后根据实现后续用户故事的结果，在其之上构建
    UI。这非常契合让团队一次学习一种技术，而不是让他们去参加几十门同时进行的课程（或让他们读十几本书），后者会让人应接不暇。


    此外，应用程序每一层的迭代开发有助于应用模式和最佳实践。如果你从应用程序的底层开始，并应用数据访问对象和会话门面等模式，你就不应该在 JSP 和其他视图对象产生领域逻辑。


    最后，当你以垂直切片进行开发时，更容易更早地对应用程序进行性能测试。将性能测试推到应用程序开发周期的最后是注定失败的。


    # 利用 Java EE 能力


    致力于构建真正利用 Java EE 功能的真实 Java EE 应用程序。


    我们多次看到的最令人不安现象之一是，某些应用程序声称“在 WebSphere 中运行”，但实际上并不是真正的 WebSphere 应用程序。我们见过几个例子，在
    WebSphere Application Server 中只有一段薄薄的代码（可能是 servlet），而所有的应用程序逻辑实际上都在另一个独立的进程中；例如，一个用
    Java、C、C++ 或其他编写的守护进程——但没有使用 Java EE——执行了实际工作。这不是推荐的方法。应用服务器提供的几乎所有服务质量对于此类应用程序都是不可用的。对于那些认为这就是
    WebSphere 的人来说，这可能是一个非常痛苦的觉醒。

    '
