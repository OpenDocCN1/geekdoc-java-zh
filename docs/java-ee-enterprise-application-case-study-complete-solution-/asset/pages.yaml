  md: 'The performance gains are substantial and the overhead minimal, while the programming
    model is unaffected. The merits of caching to improve performance are well understood.
    Unfortunately, the current Java EE specification does not include a mechanism
    for servlet/JSP caching. However, WebSphere Application Server provides support
    for page and fragment caching through its dynamic cache function without requiring
    any application changes. The cache policy is specified declaratively and configuration
    is through XML deployment descriptors. Therefore, your application is unaffected,
    remaining Java EE specification compliant and portable, while benefiting from
    the performance optimizations provided from WebSphere''s servlet and JSP caching.


    The performance gains from dynamic caching of servlets and JSPs can be substantial,
    depending on the application characteristics. Performance benefits go up to a
    multiplier of 10 from applying dynamic caching to an existing RDF (Resource Description
    Format) site summary (RSS) servlet.


    For additional performance gains, the WebSphere Application Server servlet/JSP
    cache is integrated with the WebSphere ESI Fragment processor, the IBM HTTP Server
    Fast Response Cache Accelerator (FRCA) and Edge caching capabilities. For heavy
    read-based workloads, significant additional benefits are gained through leveraging
    these capabilities.


    For another example of the principle take advantage of the WebSphere Prepared
    Statement Cache when using JDBC code. By default, whenever you use a JDBC PreparedStatement
    in WebSphere Application Server, it will'
  merge: -1
  pgno: 97
- img_proc: true
  md: 'compile the statement once and then place it in a cache that will be reused
    not just later in the same method where the PreparedStatement is created, but
    across all points in your program where the same SQL code is used in the same
    or another PreparedStatement. Saving this re-compilation step can result in a
    significantly lower number of calls to the JDBC driver and improve the performance
    of your application. You don''t have to do anything special to take advantage
    of this; just write your JDBC code to use PreparedStatements. By writing your
    code to use a PreparedStatement instead of a regular JDBC class (which uses purely
    dynamic SQL) you can take advantage of this performance enhancement while not
    losing any portability.


    One more important area that we see far often is clustering. Applications need
    to be designed and delivered to run in a clustered environment. Most realistic
    environments require clustering for scalability and reliability. Applications
    that don''t cluster lead quickly to disaster.


