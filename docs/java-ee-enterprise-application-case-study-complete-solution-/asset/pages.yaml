  md: 'Java EE provides a platform for developing and deploying multitiered, distributed
    applications that are designed to be maintainable, scalable, and portable. Just
    as an office building requires a lot of hidden infrastructure of plumbing, electricity,
    and telecommunications, large-scale applications require a great deal of support
    infrastructure. This infrastructure includes database access, transaction support,
    and security. Java EE provides that infrastructure and allows you to focus on
    your applications.


    Building distributed applications allows you to partition the software into layers
    of responsibility, or tiers. Distributed applications are commonly partitioned
    into three primary tiers: presentation, business rules, and data access. Partitioning
    applications into distinct tiers makes the software more maintainable and provides
    opportunities for scaling up applications as the demand on those applications
    increases.


    Java EE architecture is based on the idea of building applications around multiple
    tiers of responsibility. The application developer creates components, which are
    hosted by the Java EE containers. Containers play a central theme in the Java
    EE architecture.


    Servlets are one type of Java EE web component. Java classes that are hosted within,
    and invoked by the Java EE server by requests made to, a web server. These Servlets
    respond to those requests by dynamically generating HTML, which is then returned
    to the requesting client.


    JSPs are very similar in concept to Servlets, but differ in that the Java code
    is embedded within an HTML document. The Java EE server then compiles that HTML
    document into a'
  merge: -1
  pgno: 111
- img_proc: true
  md: 'Servlet, and that Servlet generates HTML in response to client requests.


    JSF is a Java EE technology designed to create full and rich user interfaces.
    Standard user interface components are created on the server and connected to
    business logic components. Custom renderers take the components and create the
    actual user interface.


    JDBC is a technology that enables an application to communicate with a data-storage.
    Most often that is a relational database that stores data in tables that are linked
    through logical relations between tables. JDBC provides a common interface that
    allows you to communicate with the database through a standard interface without
    needing to learn the syntax of a particular database.


    EJBs are the centerpiece of Java EE and are the component model for building the
    business rules logic in a Java EE application. EJBs can be designed to maintain
    state during a conversation with a client or it can be stateless. They can also
    be designed to be short-lived and ephemeral, or can be persisted for later use.
    EJBs can also be designed to listen to message queues and respond to specific
    messages. Java EE is about a lot more than EJBs, although EJBs do play a prominent
    role.


    The Java EE platform provides a number of services beyond the component hosting
    of Servlets, JSPs, and EJBs. Fundamental services include support for XML, web
    services, transactions, and security.'
  merge: -1
