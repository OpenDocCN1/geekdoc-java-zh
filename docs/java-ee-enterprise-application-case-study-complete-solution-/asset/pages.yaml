  md: '# Tackling Business Problem


    The analyst’s team will come up with a brief introduction to the customer background
    and the needs for a Java EE application. They will include a structured description
    of the main requirements, a domain model, use case diagrams and NFRs and you are
    expected to deliver the solution for the Java application using the Java EE technologies
    and framework.


    The business problem captured or discussed during workshops might be vague and
    may specify very high-level description of the main use cases and thus there will
    be many open questions or areas where further deep dive should be planned. The
    requirements may be incomplete namely the use case diagrams, and miss information
    necessary for the design. Therefore you have to fill the missing parts for yourself
    and replace the missing information with assumptions, perhaps adding the unclear
    element to the list of risks. This is best done through workshops, interview and
    discussion with various stakeholders from business and technology departments.
    Once the proper levels of details are available and you have the solution in your
    mind, it’s isn too difficult to draw the views for the solution using a suitable
    Visual editor. One can leverage tools like MS Visio for the diagrams as they are
    very intuitive and more than solves the purpose.


    The key part of the solution itself the various diagrams or the views are the
    key outputs delivered by the architects. As an architect you have to decide which
    components or interfaces the system should have their integration into the eco-system'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'and how the non-functional and functional requirements will be addressed.


    The process will also involve a considerable amount of time estimating the resource
    (Hardware) requirements of the application and exploring and comparing deployment
    environments and the non-functional characteristics for various physical vs the
    cloud options. This section will cover this methodology and approach that you
    should apply while creating your Java solution.


    The solution typically includes among other things


    +   • Class Diagram


    +   • Component Diagram that describes various tiers and components in scope


    +   • Deployment diagram that describes the proposed physical layout of the major
    tiers


    +   • Sequence or Collaboration diagram for each use case


    +   • Technical risks & mitigation strategies


    +   • Design Decision that are made for the Solutions


    +   • Assumptions made for the Solution


    # Risks and Assumptions


    In this segment you are tested on the ability to recognize the top technical risks
    present in the given business scenario and'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'the technology landscape and how these will be addressed by your solution.
    Be strategic and objective in your assessment of risk. Low-level risks should
    be avoided and high-level, systemic risks that would be nightmare scenarios should
    be included in this section. E.g In an online auction application, a security
    limitation in any form would be a major risk than worrying about if the application
    could run in multiple browsers. The mitigation and hopefully complete removal
    will be the focus of this section.


    # Class Diagram – from Domain Model to Class Diagrams


    One has to ensure that all the objects detailed in the domain model are present
    in the class diagram. Select and commit to a method or framework that describes
    how you plan to build the solution at the web/presentation, business logic, persistence,
    and integration tiers. There are important points to note on the class diagram,
    as follows:


    +   - The level of details in the class diagram will include the entities, important
    manager EJBs and few other classes representing important architectural concepts
    (a cache, an interceptor, a DAO for accessing an external tool etc. which needs
    to be addressed by the solution)


    +   - The domain model will map to classes nearly directly, only on a few occasions
    modifications and extensions will be required e.g. introducing a base class.


    +   - Annotations will be used to show how specific items in the domain model
    are mapped onto JEE components specifically, session beans and Entity classes.
    The class diagram will'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'contain important information pertaining @Entity or @Embeddable, where ever
    applicable.


    +   * The class diagram remains web framework agnostic. Any web framework can
    be leveraged to build the solution.


    Class diagram may also contain types, packages, relationships, and even instances
    such as objects and links. Class diagrams are even static; they display what interacts
    but not what happens when they do interact. A class diagram can have three kinds
    of relationships:


    +   * Association is a relationship between instances of the two classes. An association
    exists between two classes if an instance of one class must know about the other
    to perform its work. In a diagram, an association is a link connecting two classes.


    +   * Aggregation is an association in which one class belongs to a collection.
    An aggregation shows a diamond end pointing to the part containing the whole.


    +   * Generalization is an inheritance link indicating one class is a superclass
    of another. A generalization shows a triangle pointing to the superclass.


    Using the initial list of business classes, you develop class diagrams by identifying
    and defining the relationships among the classes from the domain model. This is
    done in an interactive development workshop with business partners. It is also
    useful to keep these diagrams on display on a whiteboard or other medium, and
    to develop it gradually as the project progresses. The diagrams are stored on
    a UML'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'tool to provide access to all team members and other interested parties. The
    class diagrams are also shows relationships among classes. This aspect of the
    diagrams may tend to evolve later in the design process, as lower level classes
    are identified. The class diagrams will improve the definition of the classes,
    which in turn may require changes to the sequence diagrams and, when developed,
    the state transition diagrams. These other diagrams will also have an impact on
    the class diagrams.


    # Component Diagram – Logical Architecture


    The component diagram is another view of the system, at a higher level than the
    class diagram. In this view, you are expected to demonstrate the ability to visualize
    the system at a higher level and understand all of the critical parts in your
    solution. If you have proposed a MDBs to solve a particularly integration issue,
    here is where you need to depict in the diagram. The component diagram represents
    the high-level parts that make up the modeled application. This diagram is a high-level
    depiction of the components and the relationships. A component diagram depicts
    the components’ refined post-development or construction phase.


    Component diagrams are physical versions of class diagrams. A component diagram
    shows the relationships and dependencies between software components, including
    Java source code components, Java class components, and Java deployable components
    JAR (Java Archive) files. Within the deployment diagram, a software component
    may be represented as a component type. With respect to Java EE some components
    exist at compile time, some exist at runtime and some exist at more than one'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'time. A compile-only component is the one that is meaningful only at compile
    time similarly the runtime component in this case would be an executable program.


    # Deployment Diagram – Physical Architecture


    The deployment diagram captures information about the infrastructure characteristics.
    Naming specific machines, vendors, or routers may not be essential, as these decisions
    change so quickly. Do indicate a vendor/machine-agnostic way the resources you
    expect to be deployed in order to support the architecture namely CPUs, RAM, network
    requirements, disk configuration, and so on and then provide concrete examples
    of a specific vendor/machine combination that satisfies your theoretical capacity
    prediction. Although the resources deemed necessary will vary from one scenario
    to the next, the fundamental resources themselves will not. These are as follows:


    +   - CPUs (number of cores, clock speed)


    +   - RAM (quantity in GB)


    +   - Network (minimum interface speed)


    +   - Storage (disk/SAN configuration)


    Deployment diagram puts it altogether and captures the configuration of the runtime
    elements of the application. This diagram is obviously most useful when an application
    is complete and ready to be deployed. Depicts the nodes i.e., a JEE server, a
    database server it accesses, and the user workstation used to access the JEE application.'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'Deployment diagrams show the physical configurations of software and hardware.
    The deployment diagram complements the component diagram. It shows the configuration
    of runtime processing elements such as servers and other hardware and the software
    components, processes, and objects that they comprise. Software component instances
    represent runtime manifestations of classes. Components that do not runtime entities
    do not appear on these diagrams they are shown on component diagrams. Deployment
    diagram is a graphical representation of nodes connected by communication links
    or associations. Nodes may contain component instances, which indicate that the
    component resides and runs on the node. The deployment diagram can be used to
    show which components run on which nodes. The migration of components from node
    to node or objects from component to component may also be represented.


    # Sequence Diagram – Use Cases to Sequence Diagrams


    Sequence diagram describes how groups of objects collaborate in some behavior
    over time. It records the behavior of a single use case. It displays objects and
    the messages passed among these objects in the use case. A design can have lots
    of methods in different classes. This makes it difficult to determine the overall
    sequence of behavior. This diagram is simple and logical, so as to make the sequence
    and flow of control obvious.


    The sequence diagram shows the explicit series of interactions as they flow through
    the system to address the desired objective or result. The sequence diagram is
    especially useful in systems with time-dependent'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'functionality (such as real-time applications) and for complex scenarios where
    time dependencies are critical. It has two aspects namely Time and Various objects
    participating in a sequence of events required for a purpose.


    Usually the sequence of events to which the objects of the system subject is important
    in real-time applications, the time axis is an important measurement. This view
    identifies the roles of the objects in your system through the sequence of states
    they traverse to accomplish the goal. This view is an event driven perspective
    of the system. The relationships among the roles are not shown. Class and object
    diagrams present such static views. Sequence and interaction diagrams are dynamic.
    They describe how objects collaborate or interact. A sequence diagram is an interaction
    diagram that details the functionality and messages (requests and responses) and
    the timing. The time progresses as you move down the page. The objects involved
    in the operation are listed from left to right according to when they take part
    in the message sequence. The sequence diagram can have a clarifying note, text
    inside a dog-eared rectangle. Notes can be put into any kind of UML diagram.


    Sequence diagrams are models of business processes that represent the different
    interactions between actors and objects in the system. Each process has a process
    owner and goals (such as cycle time, defect rate, and cost) consists of a set
    of business activities (in sequence and/or in parallel).


    Sequence or collaboration diagram should be covered for each specified use case.
    Do not roll one or more cases together into a single diagram to save time. Sequence
    diagrams should be clear and broadly map to the complexity'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'of the use case. The classes and components you created in the class and component
    diagram should be represented, along with the calls between them necessary to
    implement the use case being documented.


    # Design Decisions


    This section provides highlights on the various design decisions an architect
    has to make while building the enterprise Java solutions. This section covers
    all the critical areas including, transaction, security, frameworks, hardware
    sizing, deployment models and scaling of the applications.


    # Java EE Frameworks for Rescue


    The common practice in J2EE 1.3 and J2EE 1.4 was indeed to supplement the J2EE
    stack with quite a lot of additional frameworks.


    Starting from Java EE 5 and now certainly with Java EE 6 & 7 you don''t need additional
    frameworks as JEE provides reference implementations for all the specs. Everything
    core Spring container provided to J2EE can now be done with the lightweight EJB3.1
    and CDI component models, ORM support is provided by JPA which is often implemented
    by Hibernate. The MVC web framework is part of the standard stack via JSF.


    Of course individuals may still prefer the Spring and Struts programming APIs,
    but with Java EE 6 there is no pressing need to use them. Or put differently,
    it''s no longer absolutely needed to complement Java EE unless if there aren’t'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'corresponding reference implementation available from Oracle.


    RedHat Seam does provide some nice (portable) extensions to Java EE and JSF was
    actually built to be used with extension and third party component libraries.
    Such a library is however not really a ''framework'', but just gives you additional
    widgets to use on your pages and not the same as replacing JSF with Struts or
    GWT.


    | Seam Beans | Java EE | JSF |

    |---|---|---|

    | SE Spans | JDK 1.4 | JSF 1.2 | JSF 1.2 |

    | SE Spans | JDK 1.5 | JSF 1.4 | JSF 1.3 |

    | Data | JDK 1.6 | JSF 1.5 | JSF 1.1 |

    | Non Chart | EJB 3.2 | Spring FWF | EJB 4.1 |

    | Business Logic | | Struts | Struts Action |

    | Data Access | JPA 2.0, 2.1 | Hibernate | Oracle JDBC |

    | Legging | | Apache Hibernate | Jakarta Faces/


    Figure 2: Java EE Framework Comparison


    # N-Tier or No-Tier


    N-Tier Systems if well architected and designed can help achieve all non-functional
    service levels requirements of the system. Due to a highly distributed model,
    manageability may suffer a little in N-Tier systems, but since all systems are
    highly modular, the issue is fairly easy to address. It is also notable that Architects
    have to sometimes compromise a little on one service level requirement, to achieve
    the desired effect on another. For example Performance and Security show an inverse
    proportional relationship.


    Consists of:'
  merge: -1
  pgno: 26
- img_proc: true
  md: '+   • Client Tier: The tier with which the end user interacts. Clients can
    be ‘thin clients’ as in the case of Browser based applications or fat clients
    as in the case of client Java applications.


    +   • Web Tier: Decouples the client tier from the Business tier. Java Servlets
    and JSPs reside in this tier. Servlets act as Controllers; they translate incoming
    requests, and dispatch them to components that can invoke the business events
    in the Business Tier. JSP combine static templates with dynamic data to create
    dynamic output that the client tier uses for presentation to the user.


    +   • Business / Application Logic Tier: Generally implemented using Enterprise
    Java Beans (EJB) that act as business process objects and business domain objects.
    EJB containers provide various services such as Object Distribution, Persistence,
    Transaction, Resource Management, and Security and so on.


    +   • Enterprise Information System Integration Tier: EIS Integration tier interfaces
    between the Business (and sometimes Web tier) objects and Enterprise Information
    Systems. Example, Data Access Objects (DAO) decouples Enterprise beans (typically
    Session Beans or BMP Entity Beans) with Enterprise Data.


    +   • Enterprise Information System Tier: This represents all the Enterprise data.
    This could be in many forms including Relational Databases, XML Databases, and
    ERP Systems and so on.


    # EJB Container Model'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'The EJB Container sits between an EJB Server and EJBs. An EJB Server can have
    one or more EJB Containers and each container can manage one or more components.
    The EJB Container manages the EJBHome and EJBObject implementations. Via these
    objects, the container decorates Enterprise Bean classes and provides various
    services such as:


    +   * Life cycle management

    * Naming

    * Object Distribution

    * Persistence

    * Security

    * Transactions

    * Concurrency


    The EJB Container also does resource management through Instance Pooling and swapping
    (in the case of Stateless Session Beans) and Passivation / Activation, in the
    case of Stateful Session Beans and Entity Beans.


    # Enterprise Java Bean Vs No Beans


    To accommodate a growing number of users, you may need to distribute an application''s
    components across multiple machines. The enterprise beans of an application can
    not only run on different machines, but also the location will remain transparent
    to the clients. Transactions are required to ensure'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'data integrity. Enterprise beans support transactions, the mechanisms that
    manage the concurrent access of shared objects. The application will have a variety
    of clients. With just a few lines of code, remote clients can locate enterprise
    beans. These clients can be thin, various, and numerous. Scalable applications
    can be building using EJBs.


    EJB 3.0 has been split into two parts: the EJB spec and the JPA spec. EJBs are
    now known as entities in JEE 5 and later and are POJOs. JPA (Java Persistence
    API) is as the name suggests the persistence part of the API. This is commonly
    used in libraries like EclipseLink, Hibernate and Toplink. Hibernate is the most
    popular and predates JPA but the differences aren''t so large. JPA is an ORM (object-relational
    mapper) for projecting an object model onto a relational database.


    # EJB 3 Improvements


    +   * Simplified process of developing ej reduces significantly overhead.


    +   * Using Java Language annotations as configuration improves developer’s productivity.


    +   * Specification of programmatic defaults, including for metadata, reducing
    the need for the developer to specify common, expected behaviors and requirements
    on the EJB container.


    +   * Encapsulation of environmental dependencies and JNDI access through the
    use of annotations, dependency injection mechanisms, and simple lookup mechanisms.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '+   • Simplification of the enterprise bean types.


    +   • EJB support inheritance and polymorphism.


    +   • Light-weight CRUD operations with JPA EnityManager API.


    +   • Enhanced query JPA capabilities.


    +   • Life cycle callback methods can be defined in ejb itself or in a bean listener
    class.


    +   • Interceptor facility listeners for session beans and message-driven beans.
    An interceptor method may be defined on the bean class or on an interceptor class
    associated with the bean.


    +   • It is possible to use both CMP and JPA in one application


    # Bean Managed Vs Container Managed Transaction


    The Java Platform EE platform supports two transaction-management paradigms: declarative
    transaction demarcation and programmatic transaction demarcation. Declarative
    transaction management refers to a non-programmatic demarcation of transaction
    boundaries, achieved by specifying within the deployment descriptor for the various
    methods of the container-managed EJB component. This is a flexible approach that
    facilitates changes in the application’s transactional characteristics without
    modifying any code. Container-managed transaction demarcation must be used by
    entity EJB components.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'In bean-managed transaction demarcation, the EJB bean uses UserTransaction.
    Only session beans can choose to use bean-managed transactions. In container-managed
    transaction demarcation, the EJB container is responsible for transaction demarcation.
    Moreover, you should use container-managed transaction demarcation because it
    is less prone to error, and you should let the container handle transaction demarcation
    automatically. It frees the component provider from writing transaction demarcation
    code in the component. It is easier to group enterprise beans to perform a certain
    task with specific transaction behavior. The application assembler can customize
    the transaction attributes in the deployment descriptor without modifying the
    code.


    However, programmatic (procedural) access control is sometimes necessary to satisfy
    fine-grained or application-specific conditions.


    # Bean Managed Vs Container Managed Security


    To simplify the development process for the enterprise bean provider, the implementation
    of the security infrastructure is left to the EJB container provider and the task
    of defining security policies is left to the bean deployer. By avoiding putting
    hard-coded security policies inside bean code, EJB applications gain flexibility
    when configuring and reconfiguring security policies for complex enterprise applications.
    Applications also gain portability across different EJB servers that may use different
    security mechanisms. EJB framework specifies flexibility with regard to security
    management, allowing it to be declarative (container-managed) or programmatic
    (bean-managed).'
