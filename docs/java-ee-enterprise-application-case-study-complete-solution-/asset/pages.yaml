- img_proc: true
  md: 'Extensive support for XML is a core component of Java EE. Support for both
    document-based and stream-based parsing of XML documents forms the foundation
    of XML support. Additional APIs provide XML registry service, remote procedure
    call invocation via XML, and XML-based messaging support.


    Web services, which rely heavily on XML, provide support for describing, registering,
    finding, and invoking object services over the Web. Java EE provides support for
    publishing and accessing Java EE components as web services.


    Transaction support is required in order to ensure data integrity for distributed
    database systems. This allows complex, multiple-step updates to databases to be
    treated as a single step with provisions to make the entire process committed
    upon success or completely undone by rolling back on a failure. Java EE provides
    intrinsic support for distributed database transactions.


    Java EE provides configurable security to ensure that sensitive systems are afforded
    appropriate protection. Security is provided in the form of authentication and
    authorization.'
