  md: '# Appendix IV: Sizing and Capacity Planning


    Benchmark your code on hardware similar to what you''ll be using in production,
    identify any bottlenecks, then determine how much of a workload your current hardware
    can handle, and/or how much hardware horsepower you need to handle your target
    workload.


    A brief overview of the process:


    +   - Create User Scenarios

    - Add monitoring capability

    - Add User Load

    - Analyze results

    - Remediate

    - Rinse & Repeat


    # Step I: Create User Scenarios


    Set up an environment to test against. This should be a fairly close your production
    hardware if possible, otherwise you will be left extrapolating your data. Set
    up your servers, accounts, websites, bandwidth, etc. Even if you do this in VMs
    that''s OK just as long as you''re prepared to scale your results.


    # Step II: Add Monitoring Capability'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'You''ll need metrics to monitor e.g how many requests get through to the web
    servers, and how many requests can squeeze through per second before users start
    getting a response time of over two seconds. You will have to monitor RAM, CPU
    and disk usage to make sure that the load balancer can handle the connections.
    might need to review web server log files, start performance counters, or rely
    on the reporting ability of your stress test tool. Aspects required to be monitored:


    +   * CPU usage

    * RAM usage

    * Disk usage

    * Disk latency

    * Network utilization


    You might also choose to look at SQL deadlocks, seek times, etc depending on what
    you''re specifically testing.


    # Step III: Add User Load


    Simulate a test load. There are plenty of tools that can do this, with configurable
    options:


    +   * JMeter (Web)

    * Apache Benchmark (Web)

    * Grinder (Web)'
  merge: -1
  pgno: 129
- img_proc: true
  md: '+   • httpperf (Web)

    • WCAT (Web)

    • Visual Studio Load Test (Web)

    • SQLIO (SQL Server)


    Choose a number and let''s say you''re going to see how the system responds with
    hits a minute. It doesn''t matter what number you choose because you''re going
    to repeat this step many times, adjusting that number up or down to see how the
    system responds.


    Ideally, you should distribute these 10,000 requests over multiple load testing
    clients/nodes so that a single client does not become a bottleneck of requests.
    For example, JMeter''s Remote Testing provides a central interface from which
    to launch several clients from a controlling JMeter machine. Press the magic Go
    button and watch your web servers melt down and crash.


    # Step IV: Analyze Results


    So, now you need to go back to your metrics you collected in step 2. You see that
    with 10,000 concurrent connections, your high availability proxy box is barely
    breaking a sweat, but the response time with two web servers is a touch over five
    seconds. Remember, your response time is aiming for two seconds. So, we need to
    make refinements to the configurations.


    # Step V: Remediate'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'Now, you need to speed up your website by more than twice. So you know that
    you need to either scale up, or scale out. To scale up, get bigger web servers,
    more RAM, faster disks. To scale out, get more servers.


    Use your metrics from step 2, and testing, to make this decision. For example,
    if you saw that the disk latency was massive during the testing, you know you
    need to scale up and get faster hard drives. If you saw that the processor was
    sitting at 100% during the test, perhaps you need to scale out to add additional
    web servers to reduce the pressure on the existing servers. There''s no generic
    right or wrong answer, there''s only what''s right for you. Scaling up, and if
    that doesn''t work, scale out instead. Or not, it''s up to you and some thinking
    outside the box. Let''s say we''re going to scale out. So I decide to clone my
    two web servers (they''re VMs) and now I have four web servers.


    # Step VI: Rinse & Repeat


    Start again from Step 3. If you find that things aren''t going as you expected
    (for example, we doubled the web servers, but the response times are still more
    than two seconds), then look into other bottlenecks. For example, you doubled
    the web servers, but still have a crappy database server. Or you cloned more VMs,
    but because they''re on the same physical host, you only achieved higher contention
    for the server''s resources. You can then use this procedure to test other parts
    of the system. Instead of hitting the load balancer, try hitting the web server
    directly, or the SQL server using an SQL benchmarking tool.'
