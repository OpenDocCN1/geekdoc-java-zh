  md: '# Best Practices – Java EE Applications


    To provide some simple guidance for entering this world, I have compiled this
    best-of-the-best list of what I feel are the most important and significant best
    practices for Java EE. In order to avoid omitting critical best practices list
    instead is an essential top best practices for Java EE application.


    # Web Tier


    # Leverage MVC


    Clean separate business logic (Java beans and EJB components) from controller
    logic (servlets/Struts actions) from presentation (JSP, XML/XSLT). Good layering
    can cover a multitude of sins.


    This practice is so central to the successful adoption of Java EE that there is
    no competition for the #1 slot. Model-View-Controller (MVC) is fundamental to
    design a good Java EE application. It is simply the division of labor of your
    programs into the following parts:


    Those responsible for business logic (the Model – often implemented using Enterprise
    JavaBeans or plain old Java objects). Those responsible for presentation of the
    user interface (the View). Those responsible for application navigation (the Controller
    -- usually implemented with Java servlets or associated classes like Struts controllers).


    There are a number of problems that can emerge from not following basic MVC architecture.
    The most problems occur'
  merge: -1
  pgno: 88
- img_proc: true
  md: 'from putting too much into the View portion of the architecture. Practices
    like using JSP tag libraries to perform database access, or performing application
    flow control within a JSP are relatively common in small-scale applications, but
    these can cause issues in later development as JSPs become progressively more
    difficult to maintain and debug.


    Likewise, we often see migration of View layer constructs into business logic.
    For instance, a common problem is to push XML XML parsing technologies used in
    the construction of views into the business layer. The business layer should operate
    on business objects and not on a particular data representation tied to the view.


    However, just having the proper components does not make your application properly
    layered. It is quite common to find applications that have three of servlets,
    JSPs, and EJB components, where the majority of the business logic is done in
    the servlet layer, or where application navigation is handled in the JSP. You
    must be rigorous about code review and refactoring to ensure that business logic
    is handled in the Model layer only, that application navigation is solely the
    province of the Controller layer, and that your Views are simply concerned with
    rendering model objects into appropriate HTML and Javascript.


    Just a few years ago, user interface developers for Web applications could choose
    from servlets and JSPs, struts, and perhaps XML/XSL transformation. Since then,
    Tiles and Faces have become popular, and now AJAX is gaining a strong following.
    It would be a shame to have to redevelop an'
  merge: -1
  pgno: 89
- img_proc: true
  md: 'application''s core business logic every time the preferred user interface
    technology changes.


    # Prefer JSFs as your first choice of presentation technology


    Using JSF, one will get automatic binding of data to visual components, mapping,
    and validation of input data and saving of state between requests. Using JSP -
    you have to implement it manually. JSF also supports Ajax interaction with the
    server.


    If you are developing an application that requires a standard behavior, such as
    data entry, editing and display - that JSF is the best bet. If you need an online
    application with fast response, navigation within a page on the client side, such
    as Gmail or twitter - you can spend a lot of time translating the client-side
    logic components in the JSF. In this case, you better use the JSP, as a source
    of data and JavaScript library to display data.


    # Store only as much state as you require


    Enable session persistence.


    HttpSession are great for storing information about application state. Unfortunately,
    developers often lose sight of the intent of the HttpSession -- to maintain temporary
    user state. It''s not an arbitrary data cache. Many systems put enormous amounts
    of data -- megabytes -- in each user''s session. Well, if there are 1000 logged-in
    users, each with a 1 MB HTTP session, that''s one gigabyte or more of memory in
    use just for sessions. Keep those HTTP sessions small and if you don''t your application''s
    performance will suffer. Good'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'rule of thumb is something under 2K-4K. This isn''t a hard rule. 8K is still
    okay, but obviously slower than 2K.


    One common problem is in using HttpSession information that can be easily recreated,
    if necessary. Since the sessions are persisted, this is a very expensive decision
    forcing unnecessary serialization and writing of the data. Instead, use an in
    memory hash table to cache the data and just keep a key to the data in the session.
    This enables the data to be recreated should the user fail over to another application
    server.


    Enable session persistence, if you don''t enable session persistence, should a
    server is stopped for any reason (a server failure or ordinary maintenance); any
    user that is currently on that application server will lose their session. That
    makes for a very unpleasant experience. They have to log in again and redo whatever
    they were working on. If instead, session persistence is enabled, AS will automatically
    move the user (and their session) to another application server, transparently.
    They won''t even know it happened. This works so well, that we''ve actually seen
    production systems that crashes regularly provide adequate service.


    # Business Tier


    Always use session facades whenever you use EJB components


    Use local EJBs when architecturally appropriate.


    Using a session facade is one of the best-established best practices for the use
    of EJBs. In fact, the general practice is'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'widely advocated for any distributed technology, including CORBA, EJB, and
    DCOM. Basically, the lower the distribution "cross-section" of your application,
    the less time will be wasted in overhead caused by multiple, repeated network
    hops for small pieces of data. The way to accomplish this is to create very large-grained
    "facade" objects that wrap logical subsystems and can accomplish useful business
    functions in a single method. Not only will this reduce network overhead, but
    within EJBs, it critically reduces the number of database calls by creating a
    single transaction context for the entire business function. This is actually
    one of the core principles of Service Oriented Architecture (SOA).


    EJB specification, provide performance optimization for co-located EJBs. Local
    interfaces must be explicitly invoked by your application, requiring code changes
    and preventing the ability to later distribute the EJB without application changes.
    If you are certain the EJB call will always be local, take advantage of the optimization
    of local EJBs. However, the implementation of the session facade itself, typically
    a stateless session bean, should be designed for remote interfaces. This way,
    the EJB itself can be used remotely by other clients without major breakage to
    existing business logic.


    For performance optimization, a local interface can be added to the session facade.
    This takes advantage of the fact that most of the time, in Web applications at
    least; your EJB client and the EJB will be co-located within the same JVM. Alternatively,
    Java EE application server optimizations, such as WebSphere "No Local Copies,"
    can be used if the session facade is invoked locally by using the'
  merge: -1
  pgno: 92
- img_proc: true
  md: 'remote interface. However, you must be aware that these alternatives change
    the semantics of the interaction from pass-by-value to pass-by-reference. This
    can lead to subtle errors in your code. It is best to use local EJBs, since the
    behavior is controllable on a bean by bean basis, rather than affecting the entire
    application server.


    # Use stateless session beans instead of stateful session beans


    This makes your system more amenable to failover. Use the HttpSession to store
    user-specific state.


    A stateful session bean is exactly the same, architecturally, as a CORBA object
    a single object instance, tied to a single server, which is dependent upon server
    for its life. If the server goes down, the object values are lost, and any clients
    of that bean are out of luck.


    Java EE application servers providing for stateful session bean failover can work
    around some issues, but stateful solutions are not as scalable as stateless ones.
    For example, in Application Server, requests for stateless session beans are load-balanced
    across all of the members of a cluster where a stateless session bean has been
    deployed. In contrast, application servers cannot load-balance requests to stateless
    beans. This means load may be spread disproportionately across the servers in
    your cluster. In addition, the use of stateful session beans pushes state to your
    application server, which is undesirable. Stateful session beans increase system
    complexity and complicate failure scenarios. One of the key principles of robust
    distributed systems is the use of stateless behavior whenever possible.'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'A stateless session bean approach is chosen for most applications. Any user-specific
    state necessary for processing either be passed in as an argument to the EJB methods
    (and stored outside the EJB through a mechanism like the HttpSession), or be retrieved
    as part of the EJB transaction from a persistent store (for instance, through
    the use of Entity beans). Where appropriate, this information can be cached in
    memory, but beware of the potential challenges that surround keeping the cache
    consistent in a distributed environment. Caching works best for read-only data.



    In general, you should make sure that you plan for scalability from day one. Examine
    all the assumptions in your design and see if they still hold if your application
    will run on more than one server. This rule applies not only in application code
    in the cases outlined above, but also to situations like MBeans and other administrative
    interfaces.


    # Use container-managed transactions.


    Leverage two-phase commit transactions work in Java EE and rely on them rather
    than developing your own transaction management. The container will almost always
    be better at transaction optimization.


    Container-managed transactions (CMTs) provide two key advantages that are nearly
    impossible to obtain without container support: composable units of work, and
    robust transactional behavior.


    If your application code explicitly begins and ends transactions (perhaps using
    javax.jts.UserTransaction, or even native resource transactions), future requirements
    to compose'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'modules, perhaps as part of a refactoring, often requires changing the transaction
    code. For example, if module A begins a database transaction, updates the database
    and then commits the transaction and module B does the same, consider what happens
    when you try to use both from module C. Module C, which is performing what is
    a single logical action, is actually causing two independent transactions to occur.
    If module B were to fail during an operation, module A''s work is still committed.
    This is not the desired behavior. If, instead module A and module B both used
    CMTs, module C can also start a CMT (typically implicitly via the deployment descriptor)
    and the work in modules A and B will be implicitly part of the same unit of work
    without any need for complex rework.


    If your application needs to access multiple resources as part of the same operation,
    you need two-phase commit transactions. For example, if a message is removed from
    a JMS queue and then a record is updated in a database based on that message,
    it is important that either both operations occur -- or neither occurs. If the
    message was removed from the queue and then the system failed without updating
    the database, this system is inconsistent. Serious customer and business implications
    result from inconsistent states.


    We occasionally see client applications trying to implement their own solutions.
    Perhaps the application code will try to "undo" the queue operation if the database
    fails. We don''t recommend this. The implementation is much more complex than
    you initially think and there are many corner cases (imagine what happens if the
    application crashes in the middle of this). Instead, use two-phase commit transactions.
    If you use CMT and access to two-phase commit capable'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'resources (like JMS and most databases) in a single CMT Application Server
    will take care of the dirty work. It will make sure that the transaction is entirely
    done or entirely not, including failure cases such as a system crash, database
    crash, whatever. The implementation maintains transactional state in transaction
    logs. We can''t emphasize enough the need to rely on CMT transactions if the application
    accesses multiple resources. If the resources you are accessing provide for two-phase
    commit, then of course you have no choice but to use a more complex approach but
    you should do everything as possible within your power to avoid this situation.


    # Take advantage of application server features requiring no code modification


    With features such as Application Server caching and the Prepared Statement cache,
    the performance gains are substantial and the overhead is minimal.


    Best practice above states a clear case as to why you should be very prudent in
    applying application-server-specific features that modify your code. It makes
    portability difficult and may make version migration challenging as well. However,
    there are a suite of application-server specific features, in Application Server,
    that you can and should take full advantage of precisely because they do not modify
    your code. Your code should be written to the specification, but if you know about
    these features and how to properly use them you can take advantage of significant
    gains.


    For one example of this, in WebSphere Application Server, you should turn on dynamic
    caching and use servlet caching.'
