  md: '# Preface


    The motivation to write this book comes from facts that there a gamut of frameworks
    and technologies today to build a custom enterprise applications using Java frameworks.
    Which options should I go with and what are the choices that I need to make. Do
    I need to procure multiple frameworks or Java EE (5 and above) provides comprehensive
    capabilities to build an enterprise application. Understanding this and the pros
    and cons of the several JEEEE technologies how they fit into the Java enterprise
    application is the subject of this book. This book also addresses the NFRs and
    explains how they will be addressed in the solution. This title provides a step
    by step approach and best practices to help architects and SME evangelize the
    solution which cover various views/diagrams including design decision, assumptions,
    and risk and mitigation actions.


    There are no reference artifacts in today that covers the entire process from
    requirements to solutioning for an enterprise grade Java Application. These references
    focus on describing the frameworks and its capability but none provides an end-2-end
    view and process of how the solution can be evangelized including addressing NFRs.
    This critical areas covered are transaction, security, frameworks, hardware sizing,
    deployment models and scaling of the applications. Most of the books and references
    will provide theoretical approach giving only limited guidance which is not adequate
    for real world scenarios or enterprise scale applications. The book is a good
    reference for understanding how the UML notations and various models are leveraged
    by SME, designers and architects to document enterprise applications.'
  merge: -1
