  md: "# Adding comments\n\nWhen programming in any language, it is good practice\
    \ to add comments to program code to explain each particular section. This makes\
    \ the code more easily understood by others, and by yourself, when revisiting\
    \ a piece of code after a period of absence.\n\nIn Java programming, comments\
    \ can be added across multiple lines with /* and */ comment identifiers, or on\
    \ a single line after a // comment identifier. Anything appearing between /* and\
    \ */ or on a line after //, is completely ignored by the javac compiler.\n\nWhen\
    \ comments have been added to the Constants.java program, described opposite,\
    \ the source code might look like this:\n\n```\n/*\nA program to demonstrate constant\
    \ variables.\"\n```\n\n```\nclass Constants {\n    public static void main(String\
    \ args[]) {\n        // Comment score values.\n        final int TOUCHDOWN = 6;\n\
