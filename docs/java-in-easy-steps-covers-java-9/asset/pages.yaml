  md: "# Generating events\n\nComponents need to generate events that the EventListener\
    \ interfaces can recognize if they are to be useful. Having added the appropriate\
    \ EventListener to the program, as described opposite, an event generator must\
    \ be added to the component.\n\nFor example, in order to have the program respond\
    \ to a button click, the ActionListener interface is added to the program and\
    \ the button's addActionListener() method must be called, specifying the this\
    \ keyword as its argument. This makes the button generate an event when it gets\
    \ clicked, which can be recognized by the ActionListener interface.\n\nStatements\
    \ creating a button that generates events look like this:\n\n```\nJButton btn\
    \ = new JButton(\"Click Me\");\nbtn.addActionListener( );\n```\n\nWhen a user\
    \ clicks a button that generates an event, the ActionListener interface recognizes\
    \ the event and seeks an event-handler method within the program to execute a\
    \ response.\n\nEach EventListener interface has an associated event-handler method\
    \ that is called when an event is recognized. For example, when a button is clicked,\
    \ the ActionListener interface calls an associated object named actionPerformed()\
    \ and passes an ActionEvent as its argument.\n\nAn ActionEvent object contains\
    \ information about the event and the source component from where it originated.\
    \ Most usefully, it has a getSource() method that identifies the object that generated\
    \ the event. This can be used to create an appropriate response for that component.\n\
    \nAn event-handler method to create a response for a specific button click could\
    \ look like this:\n\n```\npublic void actionPerformed(ActionEvent event )\n{\n\
    \    if ( event.getSource() == btn )\n    {\n        Statements to be executed\
    \ for this button click event\n    }\n}\n```"
