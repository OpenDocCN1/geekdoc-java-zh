  md: "# Writing a first Java program\n\nAll Java programs start as text files that\
    \ are later used to create \"class\" files, which are the actual runnable programs.\
    \ This means that Java programs can be written in any plain text editor, such\
    \ as the Windows Notepad.\n\nFollow these steps to create a simple Java program\
    \ that will output the traditional first program greeting:\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_13_0.png)\n\
    \n+   1. Open a text file, like Notepad, and type this code exactly as it is listed\
    \ – to create a class named \"Hello\"\n```java\nclass Hello\n{\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_13_1.png)\n\
    \nJava is a case-sensitive language where \"Hello\" and \"hello\" are distinctly\
    \ different – traditionally, Java program names should always begin with an uppercase\
    \ letter.\n\n+   2. Between the curly brackets of the Hello class, insert this\
    \ code – to create a \"main\" method for the Hello class public static void main\
    \ ( String[] args)\n{\n```\n\n+   3. Between the curly brackets of the main method,\
    \ insert this line of code – stating what the program will do System.out.println(\"\
    Hello World!\");\n```\n\n+   4. Save the file at any convenient location, but\
    \ be sure to name it as Hello.java – the complete program should look like this:\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_13_2.png)\n\n```\nHello.java - Notepad\n\
    File Edit Format View Help\nclass Hello\n{\n    public static void main ( String[]\
    \ args)\n{\n        System.out.println(\"Hello World!\");\n    }\n}\n```\n\nJava\
    \ programs are always saved as their exact program name followed by the \".java\"\
    \ extension."
