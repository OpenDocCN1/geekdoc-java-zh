  md: '# Handling files


    Java contains a package named java.io designed to handle file input and output
    procedures. The package can be made available to a program by including an import
    statement at the very beginning of the java file. This can use the wildcard character
    to mean "all classes" in the statement import java.io.*;


    The java.io package has a class named "File" that can be used to access files
    or complete directories. A File object must first be created using the new keyword
    and specifying the filename, or directory name, as the constructor''s argument.
    For example, the syntax to create a File object named "info.dat" to represent
    a local file like this:


    ```

    File info = new File("info.dat");

    ```


    This file would be located in the same directory as the program, but the argument
    could state the path to a file located elsewhere. Note that the creation of a
    File object does not actually create a file, but merely the means to represent
    a file,


    Once a File object has been created to represent a file, its methods can be called
    to manipulate the file. The most useful File object methods are listed in this
    table, together with a brief description:


    | Method: | Returns: |

    |---|---|n| exists() | true if the file exists – false if it does not |

    | getName() | the filename as a String |

    | length() | number of bytes in the file, as a long type |

    | createNewFile() | true if able to create the new unique file |

    | delete() | true if able to successfully delete the file |

    | renameTo(File) | true if able to successfully rename the file |

    | list() | an array of file or folder names as Strings |


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_117_0.png)


    The filename specified as the constructor argument must be enclosed within quotes.'
