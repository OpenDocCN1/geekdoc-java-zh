  md: '# Examining conditions


    Possibly the all-time favorite operator of the Java programmer is the ? conditional
    operator that makes a powerful statement concisely. Its unusual syntax can seem
    tricky to understand at first, but it is well worth getting to know this useful
    operator.


    The conditional operator first evaluates an expression for a true or false value,
    then returns one of two operands depending on the result of the evaluation. Its
    syntax looks like this:


    ```

    (boolean-expression) ? if-true-return : if-false-return-;

    ```


    Each specified operand alternative allows the program to progress according to
    the Boolean value returned by the tested expression. For instance, the alternatives
    might return a String value:


    ```

    status = ( quit == true) ? "Done!" : "Continuing...\'';

    ```


    In this case, when the quit variable is the conditional operator assigns its value
    of its first operand to the status variable; otherwise, it assigns its second
    operand value instead.


    A shorthand available when coding Java programs allows expressions to omit ==
    true when evaluating a simple Boolean value, so the example above can be written
    simply as:


    ```

    status = ( quit ) ? "Done!" : "Continuing...\'';

    ```


    The conditional operator can return values of any data type and employ any valid
    test expression. For instance, the expression might use the greater than > operator
    to evaluate two numeric values then return a Boolean value depending on the result:


    ```

    busted = ( speed > speedLimit ) ? true : false;

    ```


    Similarly, the conditional operator might employ the inequality != operator to
    evaluate a String value then return a numeric value depending on the result:


    ```

    bodyTemperature = ( scale != = "Celsius") ? 98.6 : 37.0;

    ```


