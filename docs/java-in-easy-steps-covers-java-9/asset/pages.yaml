  md: "# Doing arithmetic\n\nArithmetical operators, listed in the table below, are\
    \ used to create expressions in Java programs that return a single resulting value.\
    \ For example, the expression 4 * 2 returns the value 8.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_27_0.png)\n\
    \nDivision of int values will truncate any fractional part. For example, 11/4\
    \ = 2, whereas division of float values 11/4 = 2.75.\n\n| Operator | Operation\
    \ |\n| --- | --- |\n| + | Addition (and concatenates String values) |\n| - | Subtraction\
    \ |\n| * | Multiplication |\n / | Division |\n| % | Modulus |\n| ++ | Increment\
    \ |\n| -- | Decrement |\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_27_1.png)\n\
    \nThe increment operator ++ and decrement operator -- return the result of modifying\
    \ a single given operand by a value of one. For example, 4++ returns the value\
    \ 5, and 4-- returns the value 3.\n\nAll other arithmetic operators return the\
    \ result of an operation performed on two given operands, and act as you would\
    \ expect. For example, the expression 5 + 2 returns the value 7.\n\nThe modulus\
    \ operator divides the first operand and returns the remainder of the operation.\
    \ For example, the expression 32 % 5 returns 2 – five divides 32 six times, with\
    \ 2 remainder.\n\nThe operation performed by the addition operator depends on\
    \ the type of its given operands. Where both operands are numeric values it will\
    \ return the total sum value of numbers, but where the operands are String values\
    \ it will return a single concatenated String – combining the text in each String\
    \ operand. For example, \"Java\" + \"Arithmetic\" returns \"Java Arithmetic\"\
    .\n\nIncrement and decrement operators are typically used to count the iterations\
    \ in the for loop constructs, introduced on page 50."
