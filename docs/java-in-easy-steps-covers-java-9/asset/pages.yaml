  md: '# Compiling & running programs


    Before a Java program can run, it must first be compiled into a class file by
    the Java compiler. This is located in Java''s bin directory, and is an application
    named javac. The instructions on page 11 describe how to add the bin sub-directory
    to the system path so that javac can be invoked from any system location.


    On Windows use the Windows PowerShell or the other Command Prompt to provide a
    command-line prompt, and on Linux use a Terminal window.


    Follow these steps to compile the program on page 13:


    +   - Open a command-line window, then navigate to the directory where you saved
    the Hello.java source code file


    +   - Type javac followed by a space then the full name of the source code file
    Hello.java and hit the Enter key


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_15_0.png)


    At a prompt type javac and hit Return to reveal the Java compiler options.


    ```

    Java in easy steps

    :\> cd MyJava

    :\MyJava> javac Hello.java

    :\MyJava>

    ```


    If the javac compiler discovers errors in the code it will halt and display a
    helpful report indicating the nature of the error - see page 22 for troubleshooting
    problems.


    If the javac compiler does not find any errors it will create a new file with
    the program name and the .class file extension.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_15_1.png)


    You can also compile the source code from another location if you state the full
    path address to the javac compiler - in this case, C:\MyJava\Hello.java


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_15_2.png)


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_15_3.png)'
