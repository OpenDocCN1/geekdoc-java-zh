  md: '# Summary


    The javax.swing package contains the Java Swing classes that are used to create
    GUI components.


    A window is created as a top-level JFrame container.


    The JFrame constructor should specify the window''s title, size, default close
    operation and visibility.


    A JPanel container displays smaller components in a wrapping line using its default
    FlowLayout layout manager.


    The JButton constructor can specify text and images to be displayed on a push
    button component.


    An ImageIcon object represents an image to use in the program.


    Programs that are to be deployed as a single Java archive (JAR) should use a ClassLoader
    to specify an image source.


    A JLabel object displays non-interactive text and image content.


    Editable text can be displayed in JField and JTextArea fields.


    A JScrollPane object provides scrollbars for a JTextArea field.


    Items for selection can be displayed with JComboBox and JList components.


    A ButtonGroup object logically groups a number of JRadioButton components so only
    one can be selected.


    Specific RGB colors can be represented by the Color class of the java.awt package.


    The java.awt package has a Font class that can be used to create objects representing
    a particular font name, style, and size.


    Multiple JPanel containers can be added to a JFrame container using the Container
    class of the java.awt package to represent the content pane of the JFrame.


    When creating a JPanel object, its argument may optionally specify a layout manager.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_151_0.png)'
