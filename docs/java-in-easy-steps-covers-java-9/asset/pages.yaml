  md: '# Passing multiple arguments


    Multiple arguments can be passed to a program at the command line, following the
    program name and a space. The arguments must be separated by at least one space
    and their values are placed, in order, into the elements of the args[] array.
    Each value can then be addressed by its index number as any other array – args[0]
    for the first argument, args[1] for the second argument, and so on.


    The program can test the length property of the args[] array to ensure the user
    has entered the appropriate number of arguments. When the test fails, the return
    keyword can be used to exit the main method, thereby exiting the program:


