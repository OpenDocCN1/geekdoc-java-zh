  md: "# Doing do-while loops\n\nA variation of the while loop structure, described\
    \ on page 53, employs the do keyword to create a loop with this syntax:\n\n```\n\
    do {\n  statements-to-be-executed-on-each-iteration;\n} while (test-expression);\n\
    ```\n\nLike the for loop and while loop, a do loop repeatedly executes the statements\
    \ until a tested condition is met – then the loop ends and the program proceeds\
    \ to its next task.\n\nUnlike the for loop and while loop, the do test expression\
    \ appears after the block containing the statements to be executed. The test expression\
    \ is evaluated at the end of each iteration of the loop for a Boolean true value.\
    \ When the evaluation returns true the next iteration proceeds but when it returns\
    \ false the loop is immediately terminated. This means that the statements in\
    \ a do loop are always executed at least once.\n\nNote that if the test expression\
    \ returns false when it is first evaluated, the loop statements have been executed\
    \ once.\n\nA while loop can be made to resemble the structure of a for loop, to\
    \ evaluate a counter variable in this test expression, by positioning the counter\
    \ initializer outside the loop structure and its updater within the statement\
    \ block – just as a while loop.\n\nAll for, while, or do loop structures containing\
    \ just one statement to execute may, optionally omit the curly brackets around\
    \ the statement. But, if omitted, you will need to add curly brackets if additional\
    \ statements are added to the loop later.\n\nThe choice of for, while, or do loop\
    \ is largely a matter of personal coding preference and purpose. A for loop structure\
    \ conveniently locates the counter initializer, test expression, and updater in\
    \ the parentheses for the for keyword. A while loop structure can be more concise\
    \ – but you must remember to include an updater in the loop's statements to avoid\
    \ an infinite loop. A do loop simply adds the benefit of executing its statements\
    \ once before evaluating its test expression – demonstrated by the do loop described\
    \ opposite.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_55_0.png)\n\n> Always\
    \ enclose the statements to be executed by a loop within curly brackets – for\
    \ clarity and code maintainability."
