  md: '# Adding push buttons


    The Swing JButton class creates a push-button component that can be added to a
    graphical interface. This lets the user interact with the program by clicking
    on a button to perform an action.


    The JButton object is created with the new keyword, and its constructor takes
    a String specifying text to be displayed on that button.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_137_0.png)


    Images can appear on buttons too. An ImageIcon object must first be created to
    represent the image, specifying the image file name as the argument to its constructor.
    Typically, the image will be located along the program bar as the argument can
    include the path for images outside the local directory.


    Details of how to create event-handler methods to respond to user actions, such
    as a button click, can be found in the next chapter.


    Specify the name of the ImageIcon object as the argument to the JButton constructor
    to display the image on the button, or specify a String and ImageIcon as its arguments
    to display both text and the image.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_137_1.png)


    +   - Edit a copy of Window.java from page 135, changing the class name in the
    declaration, the constructor, and the instance statement from "Window" to "Buttons"


    +   - Before the Buttons() constructor, create two ImageIcon objects

    ImageIcon tick = new ImageIcon("Tick.png");

    ImageIcon cross = new ImageIcon("Cross.png");


    +   - Create three JButton objects to display text, an image, and both text and
    image respectively

    JButton btn = new JButton("Click Me");

    JButton tickBtn = new JButton(tick);

    JButton crossBtn = new JButton("STOP", cross);


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_137_2.png)


    The JPanel object has an add() method – to add components to that panel.


    +   - Inside the Buttons() constructor, insert three statements to the JButton
    components to the JPanel container

    pnl.add(btn);

    pnl.add(tickBtn);

    pnl.add(crossBtn);


    +   - Save the program as Buttons.java then compile and run the program to push
    buttons appear in the window'
