  md: '# Assigning values


    Assignment operators, listed in the table below, are used to assign the result
    of an expression. All except the simple = operator are the shorthand form of a
    longer equivalent expression:


    | Operator | Example | Equivalent |

    |---|---|---||

    | = | a = b | a = b |

    | += | a += b | a = a + b |

    | -= | a -= b | a = a - b |

    | *= | a *= b | a = a * b |

    | /= | a /= b | a = a / b |

    | %= | a %= b | a = a % b |


    It is important to regard the = operator to mean “assign”, rather than “equals”,
    to avoid confusion with the == equality operator.


    In the example a = b, the value stored in the variable named b is assigned to
    the variable named a, so that value becomes the new value stored in a - replacing
    any value it previously contained.


    The += operator is used to add a value to an existing value stored in a variable
    - keeping a “running total”.


    The example a = b calculates the sum total of the values stored in the variables
    a and b, then assigns the resulting total to variable a. A program might contain
    a further assignment a += c that calculates the total stored in variables named
    a and c, then assigns that total to variable a - adding the value of c to the
    value it previously contained.


    All the other assignment operators work in the same way by first performing the
    arithmetical calculation on the two stored values, then assigning the result to
    the first variable – to become its new stored value.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_29_0.png)


    The == equality operator compares values, and is fully explained on page 30.'
