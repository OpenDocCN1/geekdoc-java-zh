  md: '# Summary


    +   * The **if** keyword performs a conditional test to evaluate an expression
    for a Boolean value of **true** or **false**.

    * An **if** statement block can contain one or more statements, which are only
    executed when the test expression returns **true**.

    * The **else** keyword specifies alternative statements to execute when the test
    performed by the **if** keyword returns **false**.

    * Combined **if else** statements enable a program to proceed by the process of
    conditional branching.

    * A **switch** statement can often provide an elegant solution to unwieldy **if
    else** statements by offering **case** options.

    * Each **case** option can be terminated by the **break** keyword so only statements
    associated with that option will be executed.

    * The **default** keyword can specify statements to be executed when all **case**
    options return **false**.

    * A loop repeatedly executes the statements it contains until a tested expression
    returns **false**.

    * The parentheses that follow the **for** keyword specify the loop counter initializer,
    test expression, and counter updater.

    * Statements in a **while** loop and a **do while** loop must change a value used
    in their test expression to avoid an infinite loop.

    * The test expression is evaluated at the start of **for** loops and **while**
    loops – before the first iteration of the loop.

    * The test expression is evaluated at the end of **do while** loops – after the
    first iteration of the loop.

    * A loop iteration can be skipped using the **continue** keyword.

    * A loop can be terminated using the **break** keyword.

    * Nested inner loops can use labels with the **break** and **continue** keywords
    to reference the outer loop.'
