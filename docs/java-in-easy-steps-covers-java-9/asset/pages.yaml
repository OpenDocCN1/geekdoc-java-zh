  md: "# Understanding program scope\n\nA variable that is declared inside a method\
    \ is only accessible from inside that method – its “scope” of accessibility is\
    \ only local to the method in which it is declared. This means that a variable\
    \ of the same name can be declared in another method without conflict.\n\n+  \
    \ 1. Start a new program named “Scope” containing the standard main method\nclass\
    \ Scope\n{\n    public static void main (String[] args) {\n}\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_101_0.png)\n\
    \n+   2. Between the curly brackets of the main method declare and initialize\
    \ a local String variable, then output its value String txt = “This is a local\
    \ variable in the main method” ; System.out.println(txt);\n\n+   3. After the\
    \ main method, before the final curly bracket of the class, add another method\
    \ named “sub\"\npublic static void sub() {\n\n+   4. Between the curly brackets\
    \ of the sub method, declare and initialize a local String variable of the same\
    \ name as the variable in the main method String txt = “This is a local variable\
    \ in the sub method” ; System.out.println(txt);\n\n+   5. Insert a comment to\
    \ the sub method at the end of the main method\nsub();\n\n+   6. Save the program\
    \ as Scope.java then compile and run the program to see the output\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_101_1.png)\n\
    \n```\njava in easy steps\n:\\MyJava> javac Scope.java\nC:\\MyJava> java Scope\n\
    This is a local variable in the main method\nThis is a local variable in the sub\
    \ method\nC:\\MyJava> _\n```\n\nA counter variable declared in a for loop cannot\
    \ be accessed outside the loop – its scope is limited to the for statement block."
