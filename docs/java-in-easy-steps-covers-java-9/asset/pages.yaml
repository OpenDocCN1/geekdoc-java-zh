  md: '# Deploying Android apps


    After successful testing, the Debug version of an app should be changed to a Release
    version before deployment as an Android Application Package (APK). Android requires
    that all APKs must be digitally signed with a certificate, and Android Studio
    allows you to easily generate a signed APK:


    Additional steps are required if you wish to distribute your apps via the Google
    Play Store. You can discover what is needed online at developer.android.com/distribute/tools/launch-checklist.html


    +   1. Click Build, Select Build Variant, then choose the release version option


    +   2. Next, click Build, Generate Signed APK


    +   3. Enter entering keystore details or click New...


    +   4. Choose a location to save the keystore, then enter passwords


    +   5. Select your preferred validity period, then enter certificate information


    +   6. Click OK to create the new keystore


    +   7. Click Next to use the new keystore to generate a signed APK for the app


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_185_0.png)


    A keystore holds one or more public/private key pairs. As the owner of the certificate,
    retain the private key while the Android Studio signing tool attaches the public
    key certificate to the APK. This uniquely associates the APK to you and your corresponding
    private key to ensure that any future updates to the APK come from the original
    developer.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_185_1.png)


