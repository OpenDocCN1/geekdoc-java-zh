  md: "good practice, variables should be named with words or easily recognizable\
    \ abbreviations, describing that variable's purpose. For example, \"button1\"\
    \ or \"btn1\" to describe button number one. Lowercase letters are preferred for\
    \ single-word names, such as \"gear\", and names that consist of multiple words\
    \ should capitalize the first letter of each subsequent word, such as \"gearRatio\"\
    \ – the so-called camelCase naming convention.\n\nOnce a variable has been declared,\
    \ it may be assigned an initial value of the appropriate data type using the equals\
    \ sign = , either in the declaration or later in the program, then its value can\
    \ be referenced at any time using the variable's name.\n\nFollow these steps to\
    \ create a program that declares a variable, which gets initialized in its declaration\
    \ then changed:\n\n+   Start a new program named FirstVariable, containing the\
    \ standard main method FirstVariable\n{\n  public static void main (String[] args)\
    \ {\n}\n\n+   Between the curly brackets of the main method, insert this code\
    \ to create, initialize, and output a variable String message = \"Initial value\"\
    ;nSystem.out.println(message );\n\n+   Add these lines to modify and output the\
    \ variable value message = \"Modified value\";nSystem.out.println(message );\n\
    \n+   Save the program as FirstVariable.java, then compile and run the program\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_18_0.png)\n\nFirstVariable.java\n\n\
    ![](img/ab47fc8e240585a2e70c709b4ee10a72_18_1.png)\n\nIf you encounter problems\
