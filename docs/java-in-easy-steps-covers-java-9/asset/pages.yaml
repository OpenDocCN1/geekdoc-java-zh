  md: '# Adding text fields


    The Swing JTextField creates a single-line text field component that can be added
    to a graphical interface. This can be used to display editable text, and allows
    the user to enter text to interact with the program.


    The JTextField object is created with the new keyword, and its constructor specifies
    default text to be displayed in that field. In this case, the component will be
    sized to accommodate the length of the String. Alternatively, the argument may
    be a numeric value to specify the text field size. The constructor can also take
    two arguments, specifying both default text and the text field size.


    A multiple-line text field can be created with the JTextArea class, whose constructor
    takes numerical arguments specifying its number of lines and its width. Alternatively,
    three arguments can be supplied default text, line number, and width. Text can
    be made to wrap at ends within the field by specifying true to the argument to
    the setLineWrap() method and setWrapStyleWord() of the JTextArea object.


    Where text entered into a JTextArea exceeds its initial size, the component will
    expand to accommodate the text. To make the component fixed size with scrolling
    capability, it can be placed in a JScrollPane container. This is created with
    the new keyword, and takes the name of the JTextArea as its argument.


    Scroll bars, by default, only appear when the field contains text that exceeds
    its initial size – they can be made to appear constantly by specifying a snappy-named
    setVerticalScrollBarPolicy() or setHorizontalScrollBarPolicy() methods of the
    JScrollPane object. For example, to always display a vertical scrollbar use the
    JScrollPane.VERTICAL_SCROLLBAR_ALWAYS constant as the argument.



    ![](img/ab47fc8e240585a2e70c709b4ee10a72_141_0.png)


    Use the JPasswordField class instead of the JTextField class where input characters
    are needed to be not visible.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_141_1.png)


    +   Edit a copy of Window from page 135, changing the class name in the declaration,
    the constructor, and the instance statement from "Window" to "TextFields"


    +   Before the JTextField() constructor, create two JTextField objects

    JTextField txt1 = new JTextField( 38 );

    JTextField txt2 = new JTextField( "Default Text", 38 );'
