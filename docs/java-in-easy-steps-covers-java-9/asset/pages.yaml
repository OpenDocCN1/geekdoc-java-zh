    0.99999999999999.


    +   - A String is zero or more characters enclosed in quote marks.


    +   - The `length()` method returns the size of its `String`, much like the `length`
    property of an array.


    +   - The `concat()` method of a `String` appends another `String` value.


    +   - The `equals()` method of a `String` only returns `true` when two `String`
    values have identical characters, in the same order.


    +   - Character case of a `String` can be changed using its `toUpperCase()` method
    and `toLowerCase()` method.


    +   - String values can be compared using the `startsWith()` and `endsWith()`
    methods of a `String`.


    +   - A substring can be sought in a `String` using its `indexOf()` and `substring()`
    methods.


    +   - The `isEmpty()` method only returns `true` when the `String` contains absolutely
    nothing.


