  md: "# Looping for\n\nA loop is a block of code that repeatedly executes the statements\
    \ it contains until a tested condition is met – then the loop ends and the program\
    \ proceeds on its next task.\n\nThe most frequently-used loop structure in Java\
    \ programming employs the for keyword and has this syntax:\n\n```\nfor ( initializer\
    \ ; test-expression ; updater )\n{\n    statements-to-be-executed-on-each-iteration;\
    \ \n}\n```\n\nThe parentheses after the for keyword must contain three controls\
    \ that establish the performance of the loop:\n\n+   - Initializer – assigns an\
    \ initial value to a counter variable, which will keep count of the number of\
    \ iterations made by this loop. The variable for this purpose may be declared\
    \ here, and it traditionally a \"trivial\" integer variable named i.\n\n+   -\
    \ Test expression – evaluated at the start of each iteration of the loop for the\
    \ Boolean true value. When the evaluation proceeds but when it returns false the\
    \ loop is immediately terminated, without completing that iteration.\n\n+   -\
    \ Updater – changes the current value of the counter variable, started by the\
    \ initializer, keeping the running total of the number of iterations made by this\
    \ loop. Typically, this will use i++ for counting, or i-- for counting down.\n\
    \nThe updater is often referred to as the \"incrementer\" as it often increments,\
    \ rather than decrements, the counter variable.\n\nThe code executed on each iteration\
    \ of the loop can be a single statement, a statement block, or even another \"\
    nested\" loop.\n\nEvery loop must, at some point, enable the test expression to\
    \ return false – otherwise, an infinite loop is created that will relentlessly\
    \ execute its statements. Commonly, the test expression will evaluate the current\
    \ value of the counter variable to perform a specified number of iterations. For\
    \ example, with a counter initialized at one and incremented by one on each iteration,\
    \ a test expression of i < 11 becomes false after 10 iterations – so that loop\
    \ will execute its statements 10 times before the loop ends.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_51_0.png)\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_51_1.png)"
