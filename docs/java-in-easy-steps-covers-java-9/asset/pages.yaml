  md: "# Forming multiple methods\n\nPrograms are typically split into separate methods\
    \ in order to create modules of code that each perform tasks, and that can be\
    \ called repeatedly throughout the program as required. Splitting the program\
    \ into multiple methods also makes it easier to track down bugs, as each method\
    \ can be tested individually. Further methods may be declared, inside the curly\
