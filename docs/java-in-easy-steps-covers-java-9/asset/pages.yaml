    \ and time using its now() method. The fields are initialized from the system\
    \ clock for the current locale.\n\nThe value within an individual field can be\
    \ retrieved using an appropriate method of the LocalDateTime object. For example,\
    \ the value of the year field can be retrieved using its getYear() method. Similarly,\
    \ any field can be changed using an appropriate method of the LocalDateTime object\
    \ to specify a replacement value. For example, the value of the year field can\
