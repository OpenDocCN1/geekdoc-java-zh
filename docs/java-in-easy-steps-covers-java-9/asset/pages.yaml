  md: '# Looping through elements


    All types of loop can be used to easily read all values stored inside the elements
    of an array. The loop counter would start with the index number of the first element
    then proceed up to the final index number. The index number of the last element
    in an array will always be one less than the array length – because the index
    starts at zero.


    It is useful to set the array `length` property as the loop''s conditional test
    determining when the loop should end. This means that the loop will continue until
    the counter value exceeds the index number of the array''s final element.


