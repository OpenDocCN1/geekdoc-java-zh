  md: '# Creating variable arrays


    An array is simply a variable that can contain multiple values – unlike a regular
    variable that can only contain a single value.


    The declaration of an array first states its data type, using one of the data
    type keywords, followed by square brackets [] to denote that it will be an array
    variable. Next, the declaration states the array variable name, adhering to the
    normal naming conventions.


    An array can be initialized in its declaration by assigning values of the appropriate
    data type as a comma-delimited list, enclosed within curly brackets. For example,
    the declaration of an integer array initialized with three values might look like
    this:


    ```

    int[] numbersArray = { 1, 2, 3 };

    ```


    The array is created of the length of the assigned list, allowing one “element”
    per value – in this case, an array of three elements.


    Stored values are indexed starting at zero, and each value can be addressed by
    its element index position. The syntax to so requires the array name to be followed
    by square brackets containing the element index. For instance, numbersArray[0]
    would address the first value stored in the example above (1).


    Although the values stored in each element can be changed as simply as those of
    regular variables, the size of an array is determined by its declaration and cannot
    be changed later. Usefully, the total number of elements in an array is stored
    as an integer in the length property of that array. The syntax to access this
    figure takes a period and “length” onto the array name. For example, numbersArray.length
    would return the size of the array in the example above – the integer 3.


    Arrays can also be declared without assigning a list of initial values using the
    new keyword to create an empty “object” of a specified size. The number of required
    empty elements is stated in the assignment within square brackets after the appropriate
    data type. For example, the declaration of an empty integer array with three elements
    might look like this:


    ```

    int[] numbersArray = new int[3];

    ```


    The elements are assigned default values of zero for int and float data types,
    null for String data types, \0 for char data types, and false for boolean data
    types.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_65_0.png)


    Remember that array starts at zero. This means that index[2] addresses the third
    element in the array, not its second element.'
