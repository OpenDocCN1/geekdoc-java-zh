  md: '# Summary


    +   The implements keyword can be used in a class declaration to add one or more
    EventListener interfaces.


    +   A component''s addActionListener() method takes this keyword as its argument
    – to make that component generate an ActionEvent when it is activated.


    +   The ActionListener interface passes a generated ActionEvent as the argument
    to its actionPerformedPerformed() event-handler, which can respond to a push button
    click by the user.


    +   The getSource() method of an ActionEvent can be used to identify the originating
    component that generated the event.


    +   An ItemListener passes a generated ItemEvent as the argument to its itemStateChanged()
    event-handler, which can respond to an item selection by the user.


    +   The getItemSelect() method of an ItemEvent can be used to identify the component
    that generated the event.


    +   A KeyListener interface passes a generated KeyEvent as the argument to three
    required event-handler methods, which can respond to a key press and reveal that
    key''s character.


    +   A MouseListener passes a generated MouseEvent as the argument to five required
    event-handler methods, which can respond to mouse actions made by the user.


    +   A MouseListener interface passes a generated MouseEvent as the argument to
    two required event-handlers, which can respond to mouse movement.


    +   The showMessageDialog() method of the JOptionPane class creates a dialog displaying
    a message to the user, and its inputDialog() and showConfirmationDialog() methods
    can be used to request user input.


    +   Audio resources can be represented by the AudioClip class of the java.applet
    package, and played using its play() method.'
