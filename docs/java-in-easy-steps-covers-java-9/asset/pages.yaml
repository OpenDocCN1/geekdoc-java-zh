  md: '# Comparing values


    Comparison operators, listed in the table below, are used to compare two values
    in an expression and return a single Boolean value of true or false – describing
    the result of comparison.


    | Operator | Comparison |

    | == | Equality |

    | != | Inequality |

    | > | Greater than |

    | >= | Greater than, or equal to |

    | < | Less than |

    | <= | Less than, or equal to |


    The == equality operator compares two operands, and will return true if both are
    exactly equal in value. If both are the same number they are equal, or if both
    are String values containing the characters in the same order they are equal.
    Boolean operands that are both true, or that are both false.


    Conversely, the != inequality operator returns true if two operands are not equal
    – applying the same rules as the equality operator.


    Equality and inequality operators are useful in testing the state of two variables
    to perform “conditional branching” of a program – proceeding in different directions
    according to the condition.


    The > “greater than” operator compares two operands, and will return true if the
    first is greater in value than the second.


    The < “less than” operator makes the same comparison, but returns true if the
    first is less in value than the second.


    Adding the = assignment operator after the > “greater than” operator, or after
    the < “less than” operator, makes it also return true when the two operands are
    exactly equal in value.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_31_0.png)'
