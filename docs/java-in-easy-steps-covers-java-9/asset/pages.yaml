  md: '# Responding to mouse events


    Swing components can recognize user mouse actions with the MouseListener interface,
    which will pass the MouseEvent event to these five event-handler methods:


    | Event-handler | Description |

    |--- | --- |

    | mousePressed(MouseEvent ) | Button is pressed |

    | mouseReleased(MouseEvent ) | Button is released |

    | mouseClicked(MouseEvent ) | Button has been released |

    | mouseEntered(MouseEvent ) | Mouse moves on |

    | mouseExited(MouseEvent ) | Mouse moves off |


    Mouse movements can be recognized by the MouseMotionListener interface, which
    passes MouseEvent to two event-handlers:


    | Event-handler | Description: |

    |--- | --- |

    | mouseMoved(MouseEvent ) | Mouse is moved |

    | mouseDragged(MouseEvent ) | Mouse is dragged |


    When a program implements the MouseListener or MouseMotionListener interface,
    it must declare all its associated event-handler methods — even if it are not
    actually used.


    The MouseEvent object passed by the MouseMotionListener interface has getX() and
    getY() methods, which return the mouse coordinates relative to the component generating
    the event.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_161_0.png)


