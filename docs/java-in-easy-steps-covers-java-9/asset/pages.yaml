  md: '# Adding item selectors


    The Swing JCheckBox creates a checkbox component that can be added to a graphical
    interface. This can be used to allow the user to select or deselect individual
    items in a program. The JCheckBox object is created with the new keyword, and
    its constructor takes a String argument specifying text to be displayed alongside
    checkbox. It can also take a true argument to make the checkbox selected by default.


    A choice of items can be offered by the JComboBox class that creates a drop-down
    list from which the user can select any single item. This object is created with
    the new keyword, and its constructor typically takes the name of a String array
    as its argument. Each element in the array provides an item for selection in the
    drop-down list. Similarly, a choice of items can be offered by the JList class
    that creates a fixed-size list from which the user can select one or more items.
    It is created with the new keyword, and its constructor also takes an array as
    its argument, with each element providing an item for selection. As both JList
    and JComboBox are “Collections” they must specify the specific type they may contain
    when they get created, as <String>.


