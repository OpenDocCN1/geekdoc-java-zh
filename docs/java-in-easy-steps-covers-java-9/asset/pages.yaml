  md: '# Exploring Java pre-tested classes packages


    Java has a vast library of pre-tested packages, which are arranged in modules.
    Those providing functionality that is fundamental to the Java language itself
    are contained in the java.lang package, within the java.base module. These are
    automatically accessible to the Java API (Application Programming Interface).
    This means the properties and methods provided by the java.lang package are readily
    available when creating programs. For example, the mathematic functionality provided
    by the abs() method of the Math class, which is part of the java.lang package,
    in the java.base module.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_81_0.png)


    Modules are a new feature introduced in Java 9 to improve scalability and increase
    performance.


    Package contents are arranged in hierarchical order, allowing any item to be addressed
    using dot notation. For example, the System class contains an out property (field),
    which in turn contains a println() method – so can be addressed as System.out.println().


    The Java documentation provides information about every item available, and it
    is available online at docs.oracle.com/javase/9/docs/api/ or can be downloaded
    for offline reference. The documentation is understandably large, but familiarity
    with it is valuable. A good starting point is the API Overview page containing
    a list of every module in each of three sections, with a detailed description
    of each module:


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_81_1.png)


    +   Start a web browser and open the API Overview page at docs.oracle.com/javase/9/docs/api


    +   See the Modules listed alphabetically in each section – scroll down the page
    to the "Java SE" section and find the java.base module, then click its hyperlink


    You can click on the Frames link to see a multi-pane view of the documentation.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_81_2.png)'
