  md: "# Looping while true\n\nAn alternative loop structure to that of the for loop,\
    \ described on page 51, employs the while keyword and has this syntax:\n\n```\n\
    while ( test-expression )\n{\n  statements-to-be-executed-on-each-iteration;\n\
    }\n```\n\nLike the for loop, a while loop repeatedly executes the statements it\
    \ contains until a tested condition is met - then the loop ends and the program\
    \ proceeds on its next task.\n\nUnlike the for loop, the parentheses after the\
    \ while keyword do not contain an initializer or updater for an iteration counter\
    \ variable. This means that the test expression must evaluate some value that\
    \ gets changed in the loop statements as the loop proceeds – otherwise, an infinite\
    \ loop is created that will relentlessly execute its statements.\n\nThe test expression\
    \ is evaluated at the start of each iteration of the loop for a Boolean true value.\
    \ When the evaluation returns true the iteration proceeds but when it returns\
    \ false the loop is immediately terminated, without completing its.\n\nNote if\
    \ the test expression returns false when it is first evaluated, the loop statements\
    \ are never executed.\n\nA while loop can be made to resemble the structure of\
    \ a for loop, to evaluate a counter variable in its test expression, by creating\
    \ a counter variable outside the loop and changing its value within the statements\
    \ it executes on each iteration. For example, the outer loop in the previous example\
    \ can be recreated as a while loop, like this:\n\n```\nint i = 1;\nwhile (i <\
    \ 4 )\n{\n  System.out.println(\"Outer loop i=\" + i);\n  i++;\n}\n```\n\nThis\
    \ positions the counter initializer externally, before the while loop structure,\
    \ and its updater within the statement block.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_53_0.png)"
