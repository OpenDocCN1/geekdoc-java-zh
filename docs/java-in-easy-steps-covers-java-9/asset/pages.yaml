  md: '# Reacting to keyboard events


    Swing components that allow the user to input text can recognize user key strokes
    with the KeyListener interface, which will pass the KeyEvent to these three event-handler
    methods:


    | Event-handler | Description |

    | --- | --- |

    | keyPressed( KeyEvent ) | Called when a key is pressed |

    | keyTyped( KeyEvent ) | Called after a key is pressed |

    | keyReleased( KeyEvent ) | Called when a key is released |


    When a program implements the KeyListener interface it must declare these three
    methods — even if not all are actually used.


    The KeyEvent object has a getChar() method, which returns the character for that
    key, and a getCode() method, which returns an integer Unicode value representing
    that keycode. Additionally, a getKeyText method takes the key code as its argument
    and returns a description of that key.


