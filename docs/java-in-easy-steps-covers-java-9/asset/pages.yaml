    the constructor, and the instance statement from "Window" to "Mouse". Then, add
    an initial statement to import the functionality of the java.awt.event package
    import java.awt.event.*;


    +   Edit the class declaration to add a MouseMotionListener interface to the program
    class Mouse extends JFrame implements MouseListener , MouseMotionListener'
