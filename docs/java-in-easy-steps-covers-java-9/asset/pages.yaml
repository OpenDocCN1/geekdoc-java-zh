  md: "# Catching exceptions\n\nA program may encounter a runtime \"exception\" error,\
    \ which halts its execution. Often, this will be created by unexpected user input.\
    \ A well-written program should, therefore, attempt to anticipate all possible\
    \ ways the user might cause exceptions at runtime.\n\nCode where exceptions might\
    \ arise be identified and enclosed within a try catch statement block. This allows\
    \ the program to handle exceptions without halting execution and looks like this:\n\
    \n```\ntry {\n  statements where an exception may arise\n} catch(Exception e)\
    \ {\n  statements responding to an exception\n}\n```\n\nThe parentheses following\
    \ the catch keyword specify the class of exception to be caught and assign it\
    \ to the variable \"e\". The top-level Exception catches all exceptions. Responses\
    \ can be provided for specific exceptions, however, using multiple catch statements\
    \ to identify different lower-level exception classes.\n\nThe most common exceptions\
    \ are the NumberFormatException, which arises when the program encounters a value\
    \ that is not of the expected numeric type, and the ArrayIndexOutOfBoundsException,\
    \ which arises when the program attempts to access an array element number that\
    \ is outside the index size. It is helpful to create a separate response for each\
    \ of these exceptions to readily notify the user about the nature of the problem.\n\
    \nAdditionally, a try statement block can be extended with a finally statement\
    \ block, containing code that will always be executed – irrespective of whether\
    \ the program has encountered exceptions.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_77_0.png)\n\
    \nThe e.getMessage() method returns further information about some captured exceptions."
  merge: -1
