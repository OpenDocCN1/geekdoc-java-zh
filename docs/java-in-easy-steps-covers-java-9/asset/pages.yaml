  md: '# Working with bits


    In addition to the regular operators described earlier in this chapter, Java provides
    special operators for binary arithmetic. These are less commonly used than other
    operators, but are briefly discussed here to simply provide an awareness of their
    existence.


    The Java "bitwise" operators can be used with the int integer data type to manipulate
    the bits of the binary representation of a value. This requires an understanding
    of binary numbering, where eight bits in a byte represent decimal values to 255.
    For example, 53 is binary 00110101


    (0 x 128, 0 x 64, 1 x 32, 1 x 16, 0 x 8, 1 x 4, 0 x 2, 1 x 1).


    Binary addition operations are performed like decimal arithmetic:


    | 53 = 00110101 |

    | +7 = 00000111 |

    | +60 = 00111100 |


    The bitwise operators, listed below, allow more specialized operations to be performed
    in binary arithmetic.


    | Operator | Operation | Example | Result: |

    | & | AND | a & b | 1 if both bits are 1 |

    | | | OR | a | b | 1 if either bit is 1 |

    | ^ | XOR | a ^ b | 1 if both bits differ |

    | ~ | NOT | ~a | Inverts the bits |

    | << | Left shift | n << p | Moves n bits p left |

    | >> | Right shift | n >> p | Moves n bits p right |


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_41_0.png)


    Don''t confuse the logical AND operator with the bitwise && operator, or the logical
    OR operator || with the bitwise | operator.


    For example, using the bitwise & operator in binary arithmetic:


    | 53 = 00110101 |

    | &7 = 00000111 |

    | 5 = 00000101 |'
