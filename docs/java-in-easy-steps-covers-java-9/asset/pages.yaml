    +   - The Java documentation provides information about the methods and properties
    in each Java class.


    +   - Java classes that are fundamental to the Java language are contained in
    the `java.lang` package, in the `java.base` module.


    +   - The Math class provides `Math.PI` and `Math.E` constants.


    +   - `Math.pow()` raises a specified power and `Math.sqrt()` returns the square
    root of a specified number.


