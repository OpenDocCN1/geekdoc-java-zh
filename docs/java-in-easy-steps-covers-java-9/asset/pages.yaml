  md: '# Setting precedence


    Complex expressions, which contain multiple operators and operands, can be ambiguous
    unless the order in which the operations should be executed is clear. This lack
    of clarity can easily cause different results to be implied by the same expression.
    For example, consider this complex expression:


    ```

    num = 8 + 4 * 2;

    ```


    Working left to right 8 + 4 = 12, and 12 * 2 = 24, so num = 24. But working to
    right left 2 * 4 = 8, and 8 + 8 = 16, so num = 16.


    The Java programmer can explicitly specify which operation should be executed
    by adding parentheses to which operator has precedence. In this case, (8 + 4)
    * 2 ensures that the addition is performed before the multiplication – so the
    result is 24, not 16. Conversely, 8 * (4 * 2) performs the multiplication first
    – so the result is 16, not 24.


    Where parentheses do not explicitly specify operator precedence Java follows the
    default precedence order listed in the table below, first from the top to last
    at the bottom:


    | Operator | Description |

    | ++ -- | Increment, Decrement, Logical NOT |

    | * / % | Multiplication, Division, Modulus |

    | + - | Addition, Subtraction |

    | > >= | Greater than, Greater or equal to Less than, Less or equal to |

    | == != | Equality, Inequality |

    | && | Logical AND |

    | || | Logical OR |

    | ? : | Conditional |

    | += -= = Assignment |

    | /= %= Assignment |


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_37_0.png)


    Operators of equal precedence are handled in the order they appear in the expression
    – from left to right.'
