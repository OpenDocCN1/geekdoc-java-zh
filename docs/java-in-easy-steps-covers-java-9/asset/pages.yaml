    \ has the same name as the class, and is invoked with the new keyword.\n\nEach\
    \ instance of a class inherits the object’s attributes and behaviors. The principle\
    \ of inheritance is used throughout Java so that programs can use ready-made properties.\n\
    \nTo be more flexible, object class templates can be defined in a file other than\
    \ that containing the program. This means they can be readily used by multiple\
    \ programs.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_109_0.png)\n\n+   Start\
