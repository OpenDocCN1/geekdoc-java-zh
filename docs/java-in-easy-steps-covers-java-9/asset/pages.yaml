  md: '# Summary


    +   - Java programs can be deployed as stand-alone desktop applications running
    on an appropriate version of the JRE.


    +   - Application files can be distributed for execution on other operating systems
    using the appropriate java interpreter.


    +   - Bundling all program files into a single JAR archive file helps resource
    files do not become accidentally isolated.


    +   - Executable JAR applications can be executed from a prompt with the java
    -jar command or by clicking on their file icon.


    +   - Java programs can be readily converted for the Android operating system
    as it includes similar core libraries.


    +   - Android Studio is the official IDE for the development of Android applications.


    +   - APK and JAR archive files are both compressed in ZIP format.


    +   - Each Android app is first created as a project to which the developer adds
    code and resources.


    +   - The most used windows in the Android Studio interface are the Project window
    and the Editor window.


    +   - Functional code can be added to the MainActivity.java file and interface
    components added to the activity_main.xml file.


    +   - An Android app can store images and strings as resources.


    +   - The signature of a button''s onClick event-handler must include a parameter
    for a View class object.


    +   - Interface components can be referenced in code by specifying their identity
    as the argument to findViewById().).


    +   - Android Studio provides AVD emulators for testing and also allows testing
    to be performed on real connected devices.


    +   - The Release version of an Android app must be digitally signed with a public
    key certificate.'
