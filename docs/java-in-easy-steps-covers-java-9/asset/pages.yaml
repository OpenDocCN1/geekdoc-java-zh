  md: '# Listening for events


    A user can interact with a program that provides a graphical user interface (GUI)
    by performing actions with a mouse, keyboard, or other input device. These actions
    cause "events" to occur in the interface, and making a program respond to them
    is known as "event-handling".


    For a program to recognize user events it needs to have one or more Event interfaces
    added from the java.awt.event package. These can be made available to the program
    by adding an initial statement to import java.awt.event."; *


    The EventListener interface can be included in the class declaration using the
    implements keyword. For example, a class declaration to listen for button clicks
    might look like this: class extends JFrame implements ActionListener { }


    The Java documentation describes many EventListener interfaces that can listen
    out for different events, but the most common ones are listed in the table below,
    together with a brief description:


    | EventListener | Description |

    |---|---|

    | ActionListener | Recognizes action events that occur when a push button is pushed
    or released |

    | ItemListener | Recognizes item events that occur when a list item gets selected
    or deselected |

    | KeyListener | Recognizes keyboard events that occur when the user presses or
    releases a key |

    | MouseListener | Recognizes mouse button actions that occur when the user presses
    or releases a mouse button, and when the mouse enters or exits a component |

    | MouseMotionListener | Recognizes motion events that occur when the user moves
    the mouse |


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_153_0.png)


    Multiple EventListeners can be included after the implements keyword as a comma-separated
    list.'
