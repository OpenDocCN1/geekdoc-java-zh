  md: '...cont''d


    The tools to compile and run Java programs are normally operated from a command-line
    prompt and are located in the bin sub-directory of the Java directory. They can
    be made available system-wide by adding their location to the system path:


    +   - On Windows, navigate through Control Panel, System, Advanced System Settings,
    Environment Variables, Advanced tab, then select the system variable "Path". Click
    the Edit button and add the address of Java''s bin sub-directory to the list (e.g
    C:\Java), then click OK to apply the change.

    - On Linux, add the location of Java''s bin sub-directory to the system path by
    editing .bashrc file in your home directory. For instance, add PATH=/usr/java/bin
    then save the file.


    You are now able to test the environment:


    +   Open a command-line prompt, such as Windows PowerShell or Linux Terminal


    +   Type the command java -version then hit the Enter key to see the Java interpreter''s
    version number


    +   Next, type the command javac -version then hit the Enter key to see the Java
    compiler''s version number


    +   Now, type the command jshell -version then hit the Enter key to see the Java
    shell''s version number


    +   Ensure that all version numbers match (9), and you''re ready to begin Java
    programming


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_12_0.png)


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_12_1.png)


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_12_2.png)


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_12_3.png)


    Paths that contain spaces must be enclosed within double quotes and terminated
    by a semicolon on older versions of Windows. For example, with the path "C:\Program
    Files\Java\jdk-9";


    If .bashrc file is not visible in your home directory choose View, Show Hidden
    Files to reveal it.


    The Java shell jshell is a new feature in Java 9. This interactive tool lets you
    quickly test snippets of code, without the need to first compile the code. It
    is used in the next chapter to demonstrate the variety "operators" available in
    Java programming.'
