  md: '# # Summary


    +   - Java is both a programming language and a runtime platform.

    - Java programs are written as plain text files with a `java` file extension.

    - The Java compiler `javac` creates compiled .class program files from original
    `java` source code files.

    - The Java interpreter `java` executes compiled programs using an instance of
    the Java Virtual Machine.

    - The Java VM is available on many operating platforms.

    - Adding Java''s `bin` sub-directory to the system PATH variable allows the `javac`
    compiler to be invoked from anywhere.

    - Java is a case-sensitive language.

    - The standard `main` method is the entry point for Java programs.

    - The `System.out.println()` statement outputs text.

    - A Java program file name must exactly match its class name.

    - Java variables can only be named in accordance with specified naming conventions,
    and must avoid the Java keywords.

    - In Java programming, each statement must be terminated by a semicolon character.

    - The most common Java data types are `String`, `int`, `char`, `float` and `boolean`.

    - `String` values must be enclosed in double quotes; `char` values in single quotes;
    and `float` values must have an "f" suffix.

    - The `final` keyword can be used to create a constant variable.

    - Comments can be added to Java source code between `/*` and `*/`, on one or more
    lines, or after `//` on a single line.

    - Error reports identify compiler and runtime problems.'
