  md: '# Recognizing data types


    The most frequently-used data types in Java variable declarations are listed in
    this table, along with a brief description:


    | Data type | Description | Example |

    |---|---|---|

    | char | A single Unicode character | ''a'' |

    | String | Any number of Unicode characters | ''my String'' |

    | int | An integer number, from -2.14 billion to +2.14 billion | 1000 |

    | float | A floating-point number, with a decimal point | 3.14159265 |

    | boolean | A logical value of either true or false | true |


    Due to the irregularities of floating-point arithmetic the float type should never
    be used for precise values, such as currency – see page 130 for details.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_19_0.png)


    Notice that char data values must be surrounded by single quotes, and String data
    values must always be surrounded by double quotes. Also, remember that float data
    values must always have an "f" suffix to ensure they are treated as a float value.


    In addition to the more common data types above, Java provides these specialized
    data types for use in exacting circumstances:


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_19_1.png)


    | Data type | Description |

    |---|---|

    | byte | Integer number from -128 to +127 |

    | short | Integer number from -32,768 to +32,767 |

    | long | Positive or negative integer exceeding 2.14 billion |

    | double | Extremely long floating-point number |


    All data type keywords begin with a lowercase letter except String – which is
    a special class.


    Specialized data types are useful in advanced Java programs – the examples in
    this book mostly use the common data types described in the top table.'
