  md: '# # Testing the application


    Once an application project has built successfully, it is ready to be tested.
    Testing can be performed on a real Android device, connected to your computer
    via a USB socket, or on an Android Virtual Device (AVD) emulator. AVRDs allow
    you to test the app will perform on a range of devices, but they do use more system
    resources and can be painfully slow. Applications should be tested on at least
    one real device and one tablet:


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_183_0.png)


    Creation of each AVD emulator may require a large system image file to be downloaded.
    You may prefer to test on a real Android device. Also note that accelerated emulators
    will only run if your computer supports hardware virtualization (Intel VT-x or
    AMD SVM).


    +   - Click Run, Run ''app'' (or press the Shift + F10) to open the "Select Deployment
    Target" dialog


