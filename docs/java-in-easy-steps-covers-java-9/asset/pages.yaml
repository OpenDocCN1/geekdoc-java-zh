  md: '# Assessing logic


    Logical operators, listed in the table below, are used to combine multiple expressions
    that each return a Boolean value – into a complex expression that returns a single
    Boolean value.


    | Operator | Operation |

    | && | Logical AND |

    | || | Logical OR |

    | ! | Logical NOT |


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_33_0.png)


    Logical operators are used with operands that have the Boolean values of true
    or false, or values that convert to true or false.


    The logical && AND operator will evaluate two operands and return true only if
    both operands are themselves true. Otherwise, the logical || operator will return
    false. This evaluation is used in conditional branching, where a program will
    only perform a certain action when two tested conditions are both true.


    Unlike the logical && operator that needs two operands to work, the logical ||
    OR operator will evaluate its two operands and return true if either one of the
    operands is true – it will only return false when neither operand is true. This
    is useful in Java programming to perform a certain action when either one of two
    test conditions has been met.


    The logical ! NOT operator is a “unary” operator that is used before a single
    operand. It returns the inverse Boolean value of the given operand – reversing
    true to false, and false to true. It’s useful in Java programs to toggle the value
    of a variable in successive loop iterations with a statement like goState=!goState.
    This ensures that on each pass of the loop the value is changed, like flickering
    a light switch on and off.


    > Hot tip

    The term “Boolean” refers to a system of logical thought developed by the English
    mathematician George Boole (1815–1864).'
