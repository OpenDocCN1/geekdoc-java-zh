  md: '# Adding labels


    The Swing JLabel creates a label component that can be added to a graphical interface.
    This can be used to display non-interactive text or image, or both text and an
    image.


    The JLabel object is created with the new keyword, and its constructor takes a
    String argument specifying text to be displayed on that label, or the name of
    an ImageIcon image to display. It can also take three arguments to specify text,
    image, and horizontal alignment as a JLabel constant value. For example, JLabel("text",
    img, JLabel.CENTER) aligns center.


    Where a JLabel object contains both text and an image, the relative position of
    the text can be determined by specifying a JLabel constant as the argument to
    setVerticalPosition() and setHorizontalPosition() methods of the JLabel object.


    Additionally, a JLabel object can be made to display a ToolTip when the cursor
    hovers over, by specifying a String as the argument to that object''s setToolTipText()
    method.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_139_0.png)


    +   1. Edit a copy of Window.java from page 135, changing the class name in the
    declaration, the constructor, and the instance statement from "Window" to "Labels"


    +   2. Before the Labels() constructor, create an ImageIcon object ImageIcon duke
    = new ImageIcon("Duke.png");


    +   3. Next, create three JLabel objects to display an image, text, and both text
    and an image respectively

    lbl1 = new JLabel(duke);

    lbl2 = new JLabel("Duke is the friendly mascot of Java technology.");

    lbl3 = new JLabel("Duke", duke, JLabel.CENTER);


    +   4. Inside the Labels() constructor, insert this statement to create a ToolTip
    for the first label

    lbl1.setToolTipText("Duke - the Java Mascot");


    +   5. Add these two statements to align the text centrally below the third label

    lbl3.setHorizontalTextPosition(JLabel.CENTER);

    lbl3.setVerticalTextPosition(JLabel.BOTTOM);'
