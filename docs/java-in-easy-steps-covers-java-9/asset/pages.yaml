  md: '# # Installing the JDK


    Select the appropriate Java Development Kit (JDK) package for your system from
    the Oracle® downloads page, and then follow these steps to install Java on your
    computer:


    +   1. Uninstall any previous versions of the JDK and/or Runtime Environment (JRE)
    from your system


    +   2. Start the installation and accept the License Agreement


    +   3. When the “Custom Setup” dialog appears, accept either the suggested location
    or click the Change button to choose your preferred location – such as `C:\Java`
    for Windows systems or `/usr/Java` for Linux systems


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_11_0.png)


    A previous version of the JRE may be installed so your web browser can run Java
    applets. It is best to uninstall this to avoid confusion with the newer version
    in JDK 9.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_11_1.png)


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_11_2.png)


    You can start out by installing just the minimum features to avoid confusion.


    +   4. Ensure that the Public JRE and Development Tools features are selected
    from the list. Optionally, you may deselect the other features as they are not
    required to start programming with this book


    +   5. Click the Next button to install all the necessary Java class libraries
    and tools at the chosen location'
