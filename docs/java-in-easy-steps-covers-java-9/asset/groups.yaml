- md: "\n# Summary\n\n- Splitting programs into multiple methods, which can be called\
    \ upon when required, increases flexibility and makes it easier to track down\
    \ bugs.\n- Overloaded methods have the same name but take different arguments.\n\
    - Variables declared within a method have local scope, but class variables have\
    \ global scope throughout that class.\n- The `static` keyword is used to declare\
    \ class methods and class variables – having global scope throughout that class.\n\
    - The `public` keyword explicitly allows access from any class.\n- A class declaration\
    \ can include the `extends` keyword to nominate a super class from which it will\
    \ inherit.\n- The name and dot notation can be used to explicitly address a particular\
    \ class method or class variable.\n- Real-world objects have attributes and behaviors\
    \ that can be represented in programs by variables and methods.\n- Java objects\
    \ are created as a template class from which instance copies can be made.\n- Each\
    \ class has a constructor method that can be invoked using the `new` keyword to\
    \ create an instance copy of that class.\n- Instances inherit the attributes and\
    \ behaviors of the class from which they are derived.\n- Encapsulation protects\
    \ instance variables and instance methods from manipulation by external classes.\n\
    - The `private` keyword denies access from outside the class where the declaration\
    \ is made.\n- An object's constructor method can be called to initialize variable\
    \ attributes of that object.\n\n# 7 Importing functions\n\nThis chapter demonstrates\
    \ how to import additional program functionality from specialized Java classes.\n\
    \n- 116 Handling files\n- 118 Reading console input\n- 120 Reading files\n- 122\
    \ Writing files\n- 124 Sorting array elements\n- 126 Making array lists\n- 128\
    \ Managing dates\n- 130 Formatting numbers\n- 132 Summary\n\n# Handling files\n\
    \nJava contains a package named java.io designed to handle file input and output\
    \ procedures. The package can be made available to a program by including an import\
    \ statement at the very beginning of the java file. This can use the wildcard\
    \ character to mean \"all classes\" in the statement import java.io.*;\n\nThe\
    \ java.io package has a class named \"File\" that can be used to access files\
    \ or complete directories. A File object must first be created using the new keyword\
    \ and specifying the filename, or directory name, as the constructor's argument.\
    \ For example, the syntax to create a File object named \"info.dat\" to represent\
    \ a local file like this:\n\n```\nFile info = new File(\"info.dat\");\n```\n\n\
    This file would be located in the same directory as the program, but the argument\
    \ could state the path to a file located elsewhere. Note that the creation of\
    \ a File object does not actually create a file, but merely the means to represent\
    \ a file,\n\nOnce a File object has been created to represent a file, its methods\
    \ can be called to manipulate the file. The most useful File object methods are\
    \ listed in this table, together with a brief description:\n\n| Method: | Returns:\
    \ |\n|---|---|\n| exists() | true if the file exists – false if it does not |\n\
    | getName() | the filename as a String |\n| length() | number of bytes in the\
    \ file, as a long type |\n| createNewFile() | true if able to create the new unique\
    \ file |\n| delete() | true if able to successfully delete the file |\n| renameTo(File)\
    \ | true if able to successfully rename the file |\n| list() | an array of file\
    \ or folder names as Strings |\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_117_0.png)\n\
    \nThe filename specified as the constructor argument must be enclosed within quotes.\n\
    \nStart a new program that imports the functionality of all the java.io classes\n\
    import java.io.*;\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_118_0.png)\n\nAdd\
    \ a class named \"ListFiles\" containing the standard main method class ListFiles\n\
    ```java\nclass ListFiles\n{\n    public static void main(String[] args) {\n  \
    \  }\n}\n```\n\nBetween the curly brackets of the main method, insert a statement\
    \ to create a File object for a directory folder named \"data\"\n```java\nFile\
    \ dir = new File(\"data\");\n```\n\nAdd an if statement to output the names of\
    \ all files in that folder, or a message if the folder is empty if (dir.exists())\n\
    ```java\nString[] files = dir.list();\nSystem.out.println(files.length + \" files\
    \ found...\");\nfor (int i = 0; i < files.length; i++) {\n    System.out.println(files[i]);\n\
    }\n} else {\n    System.out.println(\"Folder not found.\");\n}\n```\n\nStart the\
    \ program as ListFiles.java alongside a \"data\" folder containing some files,\
    \ compile and run the program to see the filenames listed as output\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_118_1.png)\n\
    \n# Reading console input\n\nThe java.io package allows a program to read input\
    \ from the command line – interacting with the user. Just as the System.out field\
    \ can send output to the command line, the System.in field can be used to read\
    \ from it with an InputStreamReader object. This reads the input as bytes, which\
    \ converts into integer values.\n\nIn order to read the entire line, the readLine()\
    \ method of a BufferedReader can be used. This method must be called within a\
    \ try statement to catch any IOException.\n\n- Start a new program that imports\
    \ the functionality of all the java.io classes\nimport java.io.*;\n\n- Add a class\
    \ named \"ReadString\" containing the standard main method\nclass ReadString\n\
    {\n    public static void main(String[] args) {\n    }\n}\n\n- Between the curly\
    \ brackets of the main method, insert a statement to output a message prompting\
    \ the user\nSystem.out.print(\"Enter the title of this book: \");\n\n- Create\
    \ an InputStreamReader to read from command line\nInputStreamReader isr = new\
    \ InputStreamReader(System.in);\n\n- Create a BufferedReader object to read input\n\
    BufferedReader buffer = new BufferedReader(isr);\n\n- Declare and initialize an\
    \ empty String variable in which to store\nString input = \"\";\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_19_0.png)\n\
    \n- Add a try catch statement to catch any IOException\ntry {\n  input = buffer.readLine();\n\
    \  buffer.close();\n} catch ( IOException e ) {\n  System.out.println(\"An error\
    \ occurred\");\n}\n\n- Output a message that includes the stored value\nSystem.out.println(\"\
    \\nThanks, you are reading \" + input);\n\n- Save the program as ReadString.java\
    \ then compile and run the program\n\n```\njava easy steps\nC:\\MyJava> javac\
    \ ReadString.java\nC:\\MyJava> java ReadString\nEnter the title of this book:\
    \ Java easy steps\nThanks, you are reading Java easy steps\n```\n\n# Reading files\n\
    \nThe java.io package contains a class named FileReader that is specially designed\
    \ to read text files. This class is a subclass of the InputStreamReader class\
    \ that can be used to read input by converting a byte stream into integers that\
    \ represent Unicode character values.\n\nA FileReader object is created using\
    \ the new keyword, and takes the name of the file to be read as its argument.\
    \ Optionally, the argument can include the full path to a file outside the directory\
    \ where the program is located.\n\nIn order to efficiently read the text file\
    \ line-by-line, the readLine() method of a BufferedReader object can be employed.\
    \ This method must be called within a try catch statement to catch any IOException\
    \ that may arise.\n\nReading all lines in a text file containing multiple lines\
    \ of text is accomplished by making repeated calls to the readLine() method in\
    \ a loop. At the end of the file the call will return a null value, which can\
    \ be used to terminate the loop.\n\n- Open a plain text editor, such as Windows\
    \ Notepad, and write a few lines of text – for example, a famous verse from “The\
    \ Ballad of Reading Gaol” by Oscar Wilde\n\n| File Edit Format View Help |\n|---|---|\n\
    | I never saw a man who looked |\n| With such a wistful eye |\n| Upon that little\
    \ tent of blue |\n| Which prisoners call the sky, |\n| And at every drifting cloud\
    \ that went |\n| With sails of silver by. |\n\n- Save the text file as Oscar.txt\
    \ then start a new program that imports the functionality of all the java.io classes\n\
    import java.io.*;\n\n- Add a class named “FileReader” containing the standard\
    \ main method\n```java\nclass FileReader\n{\n    public static void main(String[]\
    \ args) {\n    }\n}\n```\n"
  mdcn: "\n\n# 总结\n\n- 将程序拆分为多个方法并在需要时调用，可以增加灵活性并使错误追踪更加容易。\n- 载载方法具有相同的名称，但接收不同的参数。\n\
    - 在方法内部声明的变量具有局部作用域，而类变量在整个类中具有全局作用域。\n- `static` 关键字用于声明类方法和类变量——在整个类中具有全局作用域。\n\
    - `public` 关键字显式允许从任何类进行访问。\n- 类声明可以包含 `extends` 关键字，用于指定它将继承的超类。\n- 类名和点符号表示可以显式指定特定的类方法或类变量。\n\
    - 现实世界的对象具有属性和行为，在程序中可以通过变量和方法来表示。\n- Java 对象是通过模板类创建的，可以从其创建实例副本。\n- 每个类都有一个构造方法，可以使用\
    \ `new` 关键字调用它来创建该类的实例副本。\n- 实例继承其所源类的属性和行为。\n- 封装保护实例变量和实例方法免受外部类的操作。\n- `private`\
    \ 关键字拒绝从声明所在的类外部进行访问。\n- 对象的构造方法可以被调用以初始化该对象的变量属性。\n\n# 7 导入函数\n\n本章演示如何从专门的 Java\
    \ 类导入额外的程序功能。\n\n- 116 处理文件\n- 118 读取控制台输入\n- 120 读取文件\n- 122 写入文件\n- 124 排序数组元素\n\
    - 126 创建数组列表\n- 128 管理日期\n- 130 数字格式化\n- 132 总结\n\n# 处理文件\n\nJava 包含一个名为 `java.io`\
    \ 的包，用于处理文件输入输出程序。通过在 java 文件的开头包含 `import` 语句，可以该包对程序可用。在语句 `import java.io.*;`\
    \ 中，可以使用通配符字符表示“所有类”。\n\n`java.io` 包包含一个名为 \"File\" 的类，可用于访问文件或完成目录。必须先使用 `new`\
    \ 关键字创建一个 `File` 对象，并将文件名或目录名作为构造方法的参数。例如，创建一个名为 \"info.dat\" 的 `File` 对象来表示本地文件的语法如下：\n\
    \n```\nFile info = new File(\"info.dat\");\n```\n\n该文件将位于程序相同的目录中，但参数也可以指定位于其他地方的文件路径。注意，创建\
    \ `File` 对象并不会实际创建一个文件，而仅仅是表示文件的手段。\n\n一旦创建了表示文件的 `File` 对象，就可以调用它的方法来操作该文件。最有用的\
    \ `File` 对象方法列如表所示，并附有简要描述：\n\n| 方法: | 返回: |\n|---|---|\n| exists() | 如果文件存在则返回\
    \ true；不存在则返回 false |\n| getName() | 字符串格式的文件名 |\n| length() | 文件中的字节数，类型为 `long`\
    \ |\n| createNewFile() | 如果能够创建新的唯一文件则返回 true |\n| delete() | 如果能够成功删除文件则返回 true\
    \ |\n| renameTo(File) | 如果能够成功重命名命名文件则返回 true |\n| list() | 字符串格式的文件或文件夹名称数组 |\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_117_0.png)\n\n作为构造参数指定的文件名必须放在引号内。\n\
    \n启动一个新程序以导入所有 java.io 类的功能\nimport java.io.*;\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_118_0.png)\n\
    \n添加一个一个名为 \"ListFiles\" 的类，其中包含标准的 main 方法类 ListFiles\n```java\nclass ListFiles\n\
    {\n    public static void main(String[] args) {\n    }\n}\n```\n\n在 main 方法的大括号之间，插入一条语句为名为\
    \ \"data\" 的文件夹创建一个 `File` 对象\n```java\nFile dir = new File(\"data\");\n```\n\n\
    添加一个 `if` 语句来输出该文件夹中所有文件的名称，如果文件夹为空则输出消息 `if (dir.exists())`\n```java\nString[]\
    \ files = dir.list();\nSystem.out.println(files.length + \" files found...\");\n\
    for (int i = 0; i < files.length; i++) {\n    System.out.println(files[i]);\n\
