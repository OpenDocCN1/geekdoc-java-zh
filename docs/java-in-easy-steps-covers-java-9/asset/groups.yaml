    MyJava> java Exceptions TWENTY\nArgument is wrong format.\nProgram ends.\n\nC:\\\
    MyJava> java Exceptions 20\nYou entered: 20\nProgram ends.\n```\n\n# Summary\n\
    \n- Numeric values can be converted to other numeric data types by casting, and\
    \ to the String type using the `toString()` method.\n- A String value can be converted\
    \ to an int value using the Integer.parseInt() method, and to a float using `Float.parseFloat()`.\n\
    - An array is a variable that can contain multiple values, initialized as a list\
    \ within curly brackets in its declaration.\n- An empty array object can be created\
    \ using the `new` keyword.\n- The length property of an array stores an integer,\
    \ which is the number of elements in that array.\n- Each element of an array can\
    \ be addressed by its index number.\n- A program's main method creates a String\
    \ array, traditionally named \"args\", to store command line arguments.\n- The\
    \ first command line argument `args[0]` element is automatically stored in the\
    \ `args` array – as a String data type.\n- Multiple arguments being passed to\
    \ a program from the command line must each be separated by a space.\n- Loops\
    \ are an ideal way to read all the values stored within array elements.\n- Data\
    \ from multiple arrays can be combined to form a new array of totaled data in\
    \ each element.\n- Multi-dimensional arrays can store multiple sets of element\
    \ values, each having their own index dimension.\n- A catch statement is used\
    \ to anticipate and handle runtime exceptions that may arise.\n"
