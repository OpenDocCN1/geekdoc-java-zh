- md: "\n## Producing an object instance\n\nEach class has a built-in “constructor”\
    \ method that can be used to create a new instance of that class. The constructor\
    \ method has the same name as the class, and is invoked with the new keyword.\n\
    \nEach instance of a class inherits the object’s attributes and behaviors. The\
    \ principle of inheritance is used throughout Java so that programs can use ready-made\
    \ properties.\n\nTo be more flexible, object class templates can be defined in\
    \ a file other than that containing the program. This means they can be readily\
    \ used by multiple programs.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_109_0.png)\n\
    \n- Start a new file, repeating the previous example on pages 106-107 class Car\n\
    \n```\n{\n    public final static String color = \"Red\";\n    public final static\
    \ String bodyType = \"Coupe\";\n    public static String accelerate() {\n    \
    \    String motion = \"Accelerating...\";\n        return motion;\n    }\n}\n\
    ```\n\n- Save the file as Car.java\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_109_1.png)\n\
    \n- Start a new program named “FirstInstance” containing the standard method class\
    \ FirstInstance\n\n```\n{\n    public static void main ( String[] args ) {\n \
    \   }\n}\n```\n\nBetween the curly brackets of the main method, insert statements\
    \ to output the value of each attribute of the Car and call its behavior method\n\
    System.out.println(\"Car paint is \" + Car.color);\nSystem.out.println(\"Car style\
    \ is \"+ Car.bodyType );\nSystem.out.println( Car.accelerate() );\n\nNow, add\
    \ a statement to create a Porsche instance of the Car class\nCar Porsche = new\
    \ Car();\n\nAdd statements to output the inherited value of each Porsche attribute\
    \ and call its behavior method\nSystem.out.println(\"Porsche paint is \" + Porsche.color);\n\
    System.out.println(\"Porsche style is \" + Porsche.bodyType);\nSystem.out.println(Porsche.accelerate());\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_110_0.png)\n\nYou cannot address the\
    \ motion variable directly – it is out of scope within the method.\n\nSave the\
    \ program as FirstInstance.java alongside the Car.java template file, then compile\
    \ and run the program to see the output\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_110_1.png)\n\
    \n```\nC:\\MyJava> Java FirstInstance\nCar paint is Red\nCar style is Coupe\n\
    Accelerating...\nPorsche paint is Red\nPorsche style is Coupe\nAccelerating...\n\
    \nC:\\MyJava> _\n```\n\nA virtual class is created for the new Porsche object\
    \ that replicates its original Car class and a \"class method\", which are addressed\
    \ using the class name and dot notation – as these members are globally accessible,\
    \ this is not considered good programming practice.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_110_2.png)\n\
    \nWhilst this example demonstrates how instances of an object inherit properties\
    \ of the original class, it is improved in the next example on pages 110-111 that\
    \ uses non-static members to create \"instance variables\" and an \"instance method\"\
    , which cannot be addressed from outside that class – as these members are not\
    \ globally accessible, this is considered good programming practice.\n\nThe compiler\
    \ automatically finds the Car class in the external .java file -- and creates\
    \ a compiled .class file for it.\n\n## Encapsulating properties\n\nThe private\
    \ keyword can be used when declaring object variables and methods to protect them\
    \ from manipulation by program code. The object should then include public methods\
    \ to retrieve the values and call the methods. This technique neatly encapsulates\
    \ the variables and methods within the object structure. It is demonstrated in\
    \ the following steps that reproduce the previous example – but with encapsulated\
    \ attributes and:\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_111_0.png)\n\n-\
    \ Start a new class named \"Car\"\nclass Car\n{\n\n- Between the curly brackets\
    \ of the class, declare three private String variables to store object attributes\n\
    private String maker;\nprivate String color;\nprivate String bodyType;\n\n- Add\
    \ a private method describing a behavior\nprivate String accelerate()\n{\n   \
    \ String motion = \"Accelerating...\";\n    return motion;\n}\n\n- Add a public\
    \ method to assign passed values to each private variable\npublic void setCar(String\
    \ brand, String paint, String style)\n{\n    maker = brand;\n    color = paint;\n\
    \    bodyType = style;\n}\n\n- Add another public method to retrieve the private\
    \ variables\npublic void getCar()\n{\n    System.out.println(maker + \" paint\
    \ is \" + color);\n    System.out.println(maker + \" style is \" + bodyType);\n\
    \    System.out.println(maker + \" is \" + accelerate());\n}\n\n- After the end\
    \ of the Car class, start another class named \"FirstInstance\" containing the\
    \ standard method\nclass FirstInstance\n{\n    public static void main ( String[]\
    \ args ) {\n}\n\n- With the curly brackets of the main method, insert statements\
    \ to create an instance of the Car class and retrieve the default values\nCar\
    \ Porsche = new Car();\nPorsche.getCar();\n\n- Create another instance, assigning\
    \ and retrieving values\nCar Ferrari = new Car();\nFerrari.setCar(\"Ferrari\"\
    , \"Red\", \"Sport\");\nFerrari.getCar();\n\n- Save the program as FirstInstance.java\
    \ alongside the Car.java template file, then compile and run the program to see\
    \ the output\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_112_0.png)\n\n```\nC:\\\
    MyJava> Java FirstInstance\nCar paint is Red\nCar style is Coupe\nAccelerating...\n\
    Ferrari paint is Red\nFerrari style is Sport\nAccelerating...\n\nC:\\MyJava> _\n\
