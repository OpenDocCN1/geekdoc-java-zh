    # Introduction


    The Java™ programming language was first developed in 1990 by an engineer at Sun
    Microsystems named James Gosling. He was unhappy using the C++ programming language
    so he created a new language he named "Oak", after the oak tree that he could
    see from his office window.


    As the popularity of the Wide Web grew, Sun recognized that Gosling''s language
    could be developed for the internet. Consequently, Sun renamed the language "Java"
    (simply because that name sounded cool) and made it freely available in 1995.
    Developers around the world quickly adopted this exciting new language, and because
    of its modular design, were able to create new features that could be added to
    the core language. The most endearing additional features were retained in subsequent
    releases of Java as it developed into the comprehensive version of today.


    The essence of Java is a library of files called "classes", which each contain
    small pieces of ready-made proven code. Any of these classes can be incorporated
    into a new program, like bricks in a wall, so that only a relatively small amount
    of new code ever needs to be written to complete the program. This saves the programmer
    a vast amount of time, and explains the high popularity of Java programming. Additionally,
    this modular arrangement makes it easier to identify any errors than in a single
    large program.


    Java technology is both a programming language and a platform. In Java programming,
    the source code is first written as human-readable plain text files ending with
    the .java extension. These are compiled into machine-readable .class files by
    the javac compiler. The java interpreter can then execute the program with an
    instance of the Java Virtual Machine (Java VM):


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_9_0.png)


    The New icon pictured above indicates a new or enhanced feature introduced with
    the latest version of Java.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_9_1.png)


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_9_2.png)


    As the Java VM is available on many different operating systems, the same .class
    files are capable of running on Windows, Linux and Mac operating systems – so
    Java programmers theoretically enjoy the cross-platform ability to "write once,
    run anywhere".'
- md: "\nin order to create Java programs, the Java class libraries and the javac\
    \ compiler need to be installed on your computer. In order to run Java programs,\
    \ the Java™ Runtime Environment (JRE) needs to be installed to supply the java\
    \ interpreter. All of these components are contained in a freely available package\
    \ called the Java™ Platform, Standard Edition Development Kit (JDK).\n\nThe Java\
    \ programs in this book use JDK 9, which incorporates both the Development Kit\
    \ and the Runtime Environment, and can be downloaded from the Oracle® website\
    \ at www.oracle.com/technet/java/javase/downloads\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_10_0.png)\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_10_1.png)\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_10_2.png)\n\
    \nThe JDK 9 package is available in versions for 32-bit and 64-bit variants of\
    \ the Linux, Mac, Solaris and Windows platforms – accept the Oracle License Agreement,\
    \ then select the appropriate version for your computer to download the Java Development\
    \ Kit.\n\nThe Oracle download page also features other packages, but only the\
    \ JDK 9 package is required to get started with Java programming.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_10_3.png)\n\
    \n# Java SE Development Kit 9\n\nYou must accept the Oracle Binary Code License\
    \ Agreement for Java SE to download this software. Thank you for accepting the\
    \ Oracle Binary Code License Agreement for Java SE; you may now download and use\
    \ this software.\n\n| Product / File Description | Size | Download |\n| --- |\
    \ --- | --- |\n| Linux | 298.02 MB | jdk-9-linux-x64-bin.rpm |\n| Linux | 330.23\
    \ MB | jdk-9-linux-x64-tar.gz |\n| macOS | 371.64 MB | jdk-9-os_x64-bin.dmg |\n\
    | Windows | 358.59 MB | jdk-9-windows-x64-bin.exe |\n| Solaris SPARC | 207.05\
    \ MB | jdk-9-solaris-sparc.tar.gz |\n\nThere is no truth in the rumor that JAVA\
    \ stands for “Just Another Vague Acronym”.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_10_4.png)\n\
    \n# Installing the JDK\n\nSelect the appropriate Java Development Kit (JDK) package\
    \ for your system from the Oracle® downloads page, and then follow these steps\
    \ to install Java on your computer:\n\n- 1. Uninstall any previous versions of\
    \ the JDK and/or Runtime Environment (JRE) from your system\n- 2. Start the installation\
    \ and accept the License Agreement\n- 3. When the “Custom Setup” dialog appears,\
    \ accept either the suggested location or click the Change button to choose your\
    \ preferred location – such as `C:\\Java` for Windows systems or `/usr/Java` for\
    \ Linux systems\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_11_0.png)\n\nA previous\
    \ version of the JRE may be installed so your web browser can run Java applets.\
    \ It is best to uninstall this to avoid confusion with the newer version in JDK\
    \ 9.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_11_1.png)\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_11_2.png)\n\
    \nYou can start out by installing just the minimum features to avoid confusion.\n\
    \n- 4. Ensure that the Public JRE and Development Tools features are selected\
    \ from the list. Optionally, you may deselect the other features as they are not\
    \ required to start programming with this book\n- 5. Click the Next button to\
    \ install all the necessary Java class libraries and tools at the chosen location\n\
    \nThe tools to compile and run Java programs are normally operated from a command-line\
    \ prompt and are located in the bin-- of the Java directory. They can be made\
    \ available system-wide by adding their location to the system path:\n\n- On Windows,\
    \ navigate through Control Panel, System, Environment Variables, Advanced tab,\
    \ then select \"Path\". Click the Edit button and add the address of Java's bin-directory\
    \ to the list (e.g C:\\Java), then click OK to apply the change.\n- On Linux,\
    \ add the location of Java's bin-directory to the system path by editing .bashrc\
    \ in your home directory. For instance, add PATH=/usr/bin then save the file.\n\
    \nYou are now able to test the environment:\n\n- Open a command-line prompt, such\
    \ as Windows PowerShell or Linux Terminal\n- Type the command java -version then\
    \ hit the Enter key to see the Java interpreter's version number\n- Next, type\
    \ the command javac -version then hit the Enter key to see the Java compiler's\
    \ version number\n- Now, type the command jshell -version then hit the Enter key\
    \ to see the Java shell's version number\n- Ensure that all version numbers match\
    \ (9), and you're ready to begin Java programming\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_12_0.png)\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_12_1.png)\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_12_2.png)\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_12_3.png)\n\nPaths that contain spaces\
    \ must be enclosed within double quotes. For example, with the path \"C:\\Program\
    \ Files\\Java\\jdk-9\".\n\njshell is a new feature in Java 9. This interactive\
    \ tool lets you quickly test snippets of code, without the need to compile the\
    \ code. It is used in the next chapter to demonstrate the variety of operators\
    \ available in Java.\n\n# Writing a first program\n\nAll Java programs start as\
    \ text files that are later used to create class files, which are the actual runnable\
    \ programs. This means that Java programs can be written in any plain text editor,\
    \ such as Notepad.\n\nFollow these steps to create a simple Java program that\
    \ will output the first greeting:\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_13_0.png)\n\
    \n- 1. Open a text file, like Notepad, and type this code exactly as it is listed\
    \ to create a class named \"Hello\"\n```java\nclass Hello\n{\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_13_1.png)\n\
    \nJava is a case-sensitive language where \"Hello\" and \"hello\" are distinctly\
    \ different – traditionally, Java program names should always begin with an uppercase\
    \ letter.\n\n- 2. Between the curly brackets of the Hello class, insert this code\
    \ to create a main method for the Hello class:\n```java\npublic static void main\
    \ (String[] args)\n{\n```\n\n- 3. Between the curly brackets of the main method,\
    \ insert this line of code stating what the program will do:\n```java\nSystem.out.println(\"\
    Hello World!\");\n```\n\n- 4. Save the file at any convenient location, but be\
    \ sure to name it as Hello.java – the complete program should look like this:\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_13_2.png)\n\n```\nHello.java - Notepad\n\
    File Edit Format View Help\nclass Hello\n{\n    public static void main (String[]\
    \ args)\n    {\n        System.out.println(\"Hello World!\");\n    }\n}\n```\n\
    \nJava programs are always saved as their exact program name followed by the \"\
    .java\" extension.\n\nThe separate parts of the program code on the opposite page\
    \ can be examined individually to understand each part more clearly.\n\n# The\
    \ Program Container\n\n```java\nclass Hello { }\n```\n\nThe program name is declared\
    \ following the class keyword, and followed by a pair of curly brackets. All of\
    \ the program code that defines the Hello class will be contained within these\
    \ curly brackets.\n\n# The Main Method\n\n```java\npublic static void main (String[]\
    \ args) {\n```\n\nThis fearsome-looking line is the standard code that is used\
    \ to define the starting point of nearly all Java programs. It will be used in\
    \ many examples throughout this book exactly as it appears above — so it may be\
    \ useful to memorize it.\n\nThe code declares a method named “main” that will\
    \ contain the actual program instructions within its curly brackets.\n\nKeywords\
    \ static void precede the method name how the method might be used, and are explained\
    \ in detail later.\n\nThe code (String args) is useful when passing values to\
    \ the method, and is also fully explained later in this book.\n\n# The Statement\n\
    \n```java\nSystem.out.println(\"Hello World!\");\n```\n\nStatements are actual\
    \ instructions to perform program tasks, and must always end with a semicolon.\
    \ A method may contain many statements inside its curly brackets to form a “statement\
    \ block” defining a series of tasks to perform, but here a single statement instructs\
    \ the program to output a line of text.\n\nTurn to page 14 to discover how to\
    \ compile and run this program.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_14_0.png)\n\
    \nAll stand-alone Java programs must have a main method. Java applets are different,\
    \ and their format is explained later.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_14_1.png)\n\
    \nCreate a “MyJava” directory in which to save all your Java program files.\n"
  mdcn: "\n为了创建 Java 程序，你的计算机上需要安装 Java 类库和 `javac` 编译器。为了运行 Java 程序，需要安装 Java™ 运行时环境（JRE）以提供\
    \ java 解释器。所有组件都包含在一个免费提供的软件包中，称为 Java™ 标准版开发工具包（JDK）。\n\n本书中的 Java 程序使用 JDK 9，它包含了开发工具包和运行时环境，可以从\
    \ Oracle® 网站 www.oracle.com/technet/java/javase/downloads 下载。\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_10_0.png)\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_10_1.png)\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_10_2.png)\n\
    \nJDK 9 软件包提供了适用于 Linux、Mac、Solaris 和 Windows 平台的 32 位和 64 位变体——接受 Oracle 许可协议，然后选择适用于你计算机的相应版本下载\
    \ Java 开发工具包。\n\nOracle 下载页面还提供其他软件包，但开始 Java 编程只需要 JDK 9 软件包。\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_10_3.png)\n\
    \n# Java SE 开发工具包 9\n\n你必须接受 Java SE 的 Oracle 二进制代码许可协议才能下载此软件。感谢接受 Java SE 的\
    \ Oracle 二进制代码许可协议；你现在可以下载并使用此软件。\n\n| 产品 / 文件描述 | 大 | 下载 |\n| --- | --- | ---\
    \ |\n| Linux | 298.02 MB | jdk-9-linux-x64-bin.rpm |\n| Linux | 330.23 MB | jdk-9-linux-x64-tar.gz\
    \ |\n| macOS | 371.64 MB | jdk-9-os_x64-bin.dmg |\n| Windows | 358.59 MB | jdk-9-windows-x64-bin.exe\
    \ |\n| Solaris SPARC | 207.05 MB | jdk-9-solaris-sparc.tar.gz |\n\n关于 JAVA 代表“另一个模糊的缩写”（Just\
    \ Another Vague Acronym）的传言并非事实。\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_10_4.png)\n\
    \n# 安装 JDK\n\n从 Oracle® 下载页面选择适用于你系统的 Java 开发工具包（JDK）软件包，然后按照以下步骤在你的计算机上安装 Java：\n\
    \n- 1. 从系统中卸载任何之前的 JDK 和/或运行时环境（JRE）\n- 2. 开始安装并接受许可协议\n- 3. 当“自定义设置”（Custom Setup）对话框出现时，接受建议的位置或点击“更改”（Change）按钮选择你喜欢的位置——例如\
    \ Windows 系统的 `C:\\Java` 或 Linux 系统的 `/usr/Java`\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_11_0.png)\n\
    \n系统中可能安装了旧版本的 JRE，以便你的浏览器可以运行 Java Applet。最好卸载它，以避免与 JDK 9 中的新版本产生冲突。\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_11_1.png)\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_11_2.png)\n\n你可以通过只安装最小功能来开始，以避免混乱。\n\
    \n- 4. 确保列表中选择了“Public JRE”（公共 JRE）和“Development Tools”（开发工具）。你可以取消选择其他功能，因为使用本书编程时不需要它们\n\
    - 5. 点击“下一步”（Next）按钮在指定位置安装必要的 Java 类库和工具\n\n编译和运行 Java 程序的工具通常从命令行操作，位于 Java\
    \ 目录的 bin 中。可以通过将它们位置添加到系统路径来实现全局可用：\n\n- 在 Windows 上，通过控制面板、系统、环境变量、高级选项卡选择“Path”。点击“编辑”按钮并将\
    \ Java 的 bin 目录添加到列表（例如 C:\\Java），然后点击确定。\n- 在 Linux 上，通过编辑主目录下的 .bashrc 将 Java\
    \ 的 bin 目录位置添加到系统路径。例如，添加 PATH=/usr/bin。\n\n你现在可以测试环境了：\n\n- 打开命令行，例如 Windows\
    \ PowerShell 或 Linux Terminal\n- 输入 `java -version` 并按回车查看 Java 解释器的版本号\n- 接下来输入\
    \ `javac -version` 并按回车查看 Java 编译器的版本号\n- 现在输入 `jshell -version` 并按回车查看 Java Shell\
    \ 的版本号\n- 确保所有版本号匹配（9），你已准备好开始 Java 编程\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_12_0.png)\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_12_1.png)\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_12_2.png)\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_12_3.png)\n\n包含空格的路径必须在双引号内。例如，路径 \"\
    C:\\Program Files\\Java\\jdk\"。\n\njshell 是 Java 9 的新功能。这个交互式工具允许你快速测试代码片段，而无需编译。它将在下一章用于演示\
    \ Java 中可用的运算符。\n\n# 编写第一个程序\n\n所有 Java 程序都从文本文件开始，随后用于创建类文件，即实际运行的程序。这意味着 Java\
    \ 程序可以在任何文本编辑器（如记事本）中编写。\n\n按照以下步骤创建一个输出第一个问候信息的简单 Java 程序：\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_13_0.png)\n\
    \n- 1. 打开文本文件（如记事本），完全按照列出的代码输入创建一个名为 \"Hello\" 的类\n```java\nclass Hello\n{\n\
    ```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_13_1.png)\n\nJava 是一种区分大小敏感的语言，“Hello\"\
    \ 和 \"hello\" 是完全不同的——传统上，Java 程序名应该始终以大写字母开头。\n\n- 2. 在 Hello 类的大括号之间插入此代码，为\
    \ Hello 类创建一个 main 方法：\n```java\npublic static void main (String args)\n{\n```\n\
    \n- 3. 在 main 方法的大括号之间插入此行代码，说明程序将执行：\n```java\nSystem.out.println(\"Hello World!\"\
    );\n```\n\n- 4. 在任何方便的位置保存文件，但确保将其命名为 Hello.java 完整的程序看起来应该是这样的：\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_13_2.png)\n\
    \n```\nHello.java - 记事本\n文件 编辑 格式 视图 帮助\nclass Hello\n{\n    public static void\
    \ main (String args)\n    {\n        System.out.println(\"Hello World!\");\n \
    \   }\n}\n```\n\nJava 程序始终以其精确的程序名加上 \".java\" 扩展名保存。\n\n相反页上程序代码的不同部分可以单独检查，以更清楚地理解每个部分。\n\
    \n# 程序容器\n\n```java\nclass Hello { }\n```\n\n程序名紧接 class 关键字之后声明，并跟着一对大括号。定义 Hello\
    \ 类的所有程序代码将包含这些大括号内。\n\n# Main 方法\n\n```java\npublic static void main (String\
    \ args) {\n```\n\n这行看起来很吓人的代码是定义几乎所有 Java 程序起点的标准代码。它将在本书的许多示例中以如上面所示的形式出现——因此记住它可能是很有用的。\n\
    \n该代码声明了一个名为 “main” 的方法，其大括号内包含实际的程序指令。\n\n关键字 static void 位于方法名前之前，说明了可能用法，稍后会详细解释。\n\
    \n代码 (String args) 在向方法传递值时有用，书中随后也会进行完全解释。\n\n# 语句\n\n```java\nSystem.out.println(\"\
