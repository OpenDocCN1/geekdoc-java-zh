    # Distributing programs


    The Lotto program opens a new window of the specified size containing the Swing
    interface components. Each time the user clicks the push button, its event-handler
    displays six new random numbers in the range 1-59 within the text field component:


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_171_0.png)


    With all other examples in this book, the example Lotto program has been compiled
    for Java 9 and can be distributed for execution on other computers where the Java
    9 Runtime Environment is present - regardless of their-operating system. For example,
    Lotto.class and Lotto.png files have been copied to the desktop of a computer
    running the Linux operating system with the Java 9 runtime installed. The Lotto
    program can, therefore, be executed by the java interpreter in the same way as
    the originating Windows system.


    The java source code file need not be included when distributing a program - only
    .class and resource files are needed.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_171_1.png)


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_171_2.png)'
  - '[PAGE 172]


    There is, however, a danger in distributing Java programs this way as the program
    will fail to execute if resource files become unavailable – in this case, removing
    Lotto.jpg produces this error:


    ```

    $ mike@Desktop-PC:~/Desktop

    $ mike@Desktop-PC:~$ java Lotto

    Exception in thread "main" java.lang.NullPointerException

    at java.desktop/

    at java.swing.ImageIcon.init(<ImageIcon;Java.java:217>

    at Lotto.init(Lotto.java:9)

    at Lotto.main(Lotto.java:61)

    $ mike@Desktop-PC:~/Desktop$

    ```


    The JDK contains a jar utility tool that allows class and resource files to be
    bundled into a single Java Archive (JAR) file. This compresses all programs, using
    the popular ZIP format, into a single file with a jar extension. A JAR file stores
    the program efficiently and helps ensure resource files do not become accidentally
    isolated. The java interpreter fully supports JAR files so Java applications can
    be executed without extracting the individual files. Like the java interpreter
    and javac compiler, the jar tool is located in Java’s bin directory and runs from
    the command line to perform these common jar operations:


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_172_0.png)


    Larger programs may use many resource files whose location can easily be disrupted
    by a user – the solution is to package the program and all its resources into
    a single executable file.


    | Command syntax | Operation |

    |---|---|n| jar cf jar-file input-file/s | Create a JAR file |

    | jar cf jar-file entry-point input-file/s | Create a JAR file with a specified
    entry point in a stand-alone application |

    | jar tf jar-file | View contents of a JAR file |

    | jar uf jar-file | Update contents of JAR file |

    | jar ufm jar-file attribute-file | Update contents of JAR file manifest, adding
    attribute/s |

    | jar xf jar-file | Extract all contents of JAR |

    | jar xf jar-file archived-files | Extract specific files from JAR |


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_172_1.png)


    For larger programs, the wildcard character can be used to archive multiple files
    within the directory – for instance, jar cf Program.*class archives all class
    files in the current directory.'
