    # # Handling button events


    A Swing JButton component that is set to generate an ActionEvent when it gets
    clicked can be recognized by the ActionListener interface, which will pass the
    event to the actionPerformed() event-handler method. The ActionEvent object has
    a getSource() method that identifies the originating component, and a getActionMode()
    method that returns a String. This will be the text label for a button component,
    or the content for a text field component.


    One response to a button might be to disable a component by calling its setEnabled()
    method with a false argument. Conversely, the component can be enabled once by
    specifying a true argument to its setEnabled() method.


