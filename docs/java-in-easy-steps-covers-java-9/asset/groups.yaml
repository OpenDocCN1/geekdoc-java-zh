    ```\n\n# Looping for\n\nA loop is a block of code that repeatedly executes the\
    \ statements it contains until a tested condition is met – then the loop ends\
    \ and the program proceeds on its next task.\n\nThe most frequently-used loop\
    \ structure in Java programming employs the for keyword and has this syntax:\n\
    \n```\nfor ( initializer ; test-expression ; updater )\n{\n    statements-to-be-executed-on-each-iteration;\
    \ \n}\n```\n\nThe parentheses after the for keyword must contain three controls\
    \ that establish the performance of the loop:\n\n- Initializer – assigns an initial\
    \ value to a counter variable, which will keep count of the number of iterations\
    \ made by this loop. The variable for this purpose may be declared here, and it\
    \ traditionally a \"trivial\" integer variable named i.\n\n- Test expression –\
