    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_16_1.png)\n\nThe Hello program runs\
    \ and executes the task defined in the statement within its main method – to output\
    \ \"Hello World!\". Upon completion, focus returns to the prompt once more.\n\n\
    The process of compiling and running a Java program is typically combined in sequential\
