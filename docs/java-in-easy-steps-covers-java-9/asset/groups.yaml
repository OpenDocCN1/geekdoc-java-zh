    \n将程序保存为 `WriteFile.java`，然后编译并运行程序以在程序旁边写入文本文件\n\n```\nC:\\MyJava> javac WriteFile.java\n\
    C:\\MyJava> java WriteFile\nC:\\MyJava>_\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_124_0.png)\n\
    \n你可以调用 BufferedWriter 对象的方法来添加文本——而不是使用 `write()` 方法覆盖文本。\n\n```\nTam.txt Notepad\
