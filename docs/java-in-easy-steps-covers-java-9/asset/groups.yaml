    # Escaping literals


    The numerical and text values in Java programs are known as “literals” – they
    represent nothing but are, literally, what you see.


    Literals are normally detached from the keywords of the Java language, but when
    double quotes, or single quotes, are required within a String value it is necessary
    to indicate that the quote character is to be treated literally to avoid prematurely
    terminating the String. This is easily achieved by immediately prefixing each
    nested quote character with the \ escape operator. For example, including a quote
    within a String variable, like this:


    ```

    String quote = \"Fortune favors the brave.\" said Virgil ;

    ```


    Additionally, the \ escape operator offers a variety of useful escape sequences
    for simple output formatting:


    | Escape: | Description: |

    | --- | --- |

    | \n | Newline |

    | \t | Tab |

    | \b | Backspace |

    | \r | Carriage return |

    | \f | Formfeed |

    | \\ | Backslash |

    | \'' | Single quote mark |

    | \" | Double quote mark |


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_39_0.png)


    The \n newline escape sequence is frequently used within long String values to
    display the output on multiple lines. Similarly, the \t tab escape sequence is
    frequently used to display the output in columns. Using a combination of \n newline
    and \t escape sequences allows the output to be formatted in both rows and columns
    – to resemble a table.'
