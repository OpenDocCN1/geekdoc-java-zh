  - '[PAGE 149]


    # Changing appearance


    The java.awt package (Abstract Window Toolkit) contains "painting" classes that
    can be used to color interface components. These can be made available to a program
    by including the initial statement import java.awt.*;


    Included in the java.awt package is a Color class that has constants representing
    a few basic colors, such as Color.RED. Additionally, instances of the Color class
    can be created using the new keyword to represent custom colors. The constructor
    can take three integer arguments between zero and 255 to represent red, green,
    and blue (RGB) values to form the custom color.


    Each component has a setBackground() method and a setForeground() method that
    take a Color as their argument to paint that component with the specified color.


    Note that the background of JLabel is transparent by default, so it is recommended
    that their setOpacity() method should be called to set the opacity true before
    they are painted.


    Also in the java.awt package is a Font class that can be used to modify the font
    displaying text. A Font object represents a font, and its constructor can take
    three arguments to specify name, style, and size:


    +   * The specified name should be one of the three platform-independent names
    "Serif", "SansSerif" or "Monospaced".


    +   * The specified style should be one of the three constants: Font.PLAIN, Font.BOLD
    or Font.ITALIC


    +   * The specified size should be an integer of the point size.


    Each component has a setFont() method that takes a Font object as its argument
    to paint that component with the specified font.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_149_0.png)


