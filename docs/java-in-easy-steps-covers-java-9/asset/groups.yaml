    Character: \\n\" + event.getKeyChar());\n}\n```\n\nAdd a third event-handler that\
    \ displays the key and key text when the key gets released:\n```java\npublic void\
    \ keyReleased(KeyEvent event)\n{\n    int keyCode = event.getKeyCode();\n    txtArea.append(\"\
