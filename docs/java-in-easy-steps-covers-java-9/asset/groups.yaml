    \ that are initially assigned to them. This is useful when storing a fixed value\
    \ in a program to avoid becoming altered accidentally.\n\nVariables created to\
    \ store fixed values in this way are known as “constants”, and it is convention\
    \ to name constants with uppercase characters – to distinguish them from regular\
    \ variables. Programs that attempt to change a constant value will not compile,\
    \ and the javac compiler will generate an error message.\n\nFollow these steps\
    \ to create a Java program featuring constants:\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_21_0.png)\n\
    \n+   1 Start a new program named “Constants” containing the standard method\n\
    ```java\nclass Constants {\n    public static void main (String[] args) {\n}\n\
    ```\n\n+   2 Between the curly brackets of the main method, insert this code to\
    \ create and initialize three integer constants\nfinal int TOUCHDOWN = 6;\nfinal\
    \ int CONVERSION = 1;\nfinal int FIELDGO = 3;\n\n+   3 Now, declare four integer\
    \ variables\ntd, pat, fg, total;\n\n+   4 Initialize the regular variables – using\
    \ multiples of the constant values\ntd = 4 * TOUCHDOWN;\npat = 3 * CONVERSION;\n\
