    # Adding radio buttons


    The Swing JButton class creates a radio button component

    that be added to a graphical interface. This can be used to

    allow the user to select an item from a group of radio buttons.


    The JRadioButton object is created with the `new` keyword, and its

    constructor takes a String argument specifying which text to be displayed

    alongside that radio button. It can also take a second `true`

    argument to make a radio button be selected by default.


    A ButtonGroup object logically groups a number of radio buttons

    so that only one in that group can be selected at any

    time. Each radio button is added to the ButtonGroup object by

    specifying its name as the argument to the group''s `add()` method.


