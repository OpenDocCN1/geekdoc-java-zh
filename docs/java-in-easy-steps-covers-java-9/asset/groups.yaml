    # Creating Android projects


    The Android operating system, prevalent on handheld devices, includes a set of
    core libraries that provide most of the functionality of those in the Java programming
    language. This means that Java programs can be readily converted for Android.


    Android app development is best undertaken using the Android Studio Integrated
    Development Environment (IDE). This provides a unified environment where you can
    develop apps for all Android devices, and provides extensive testing tools. Completed
    apps are distributed as an Android Application Package (APK) file, which is similar
    to a Java archive (JAR) file. This compresses all program files, using the popular
    ZIP format, into a single file with an .apk extension. Each app is first created
    in Android Studio as a “project”, to which the developer adds code and resources:


    - Launch Android Studio, then choose to Start a new Android Studio project in
    the “Welcome” options – to open the “New Project” dialog

    - Enter an Application name (for example, “Lotto”) and a Company Domain, then
    choose your preferred Project location at where to save the project on your computer


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_175_0.png)


    Android Studio is available free from developer.android.com/studio This version
    2.3.3 – instructions may vary for other versions. Android Studio is a sizable
    download of around 1.9GB, and may require additional downloads to complete setup.
    Check the system requirements to ensure your computer can run Android Studio before
    downloading.


    The Package name is the automatically assigned unique identifier for the app,
    comprised of com.domain.appname


    - Click Next to open the “Target Android Devices” dialog

    - Select the device type and platform level (for example, “Phone and Tablet” running
    “Ice Cream Sandwich”)


    # ...cont''d


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_176_0.png)

    ![](img/ab47fc8e240585a2e70c709b4ee10a72_176_1.png)


    Choose API 15 if you would like the app to run on 100% of devices active on the
    Google Play Store.


    - 5 Click Next to open the “Add an Activity to Mobile” dialog, and simply select
    the Empty Activity option

    - 6 Click Next to open the “Customize the Activity” dialog


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_176_2.png)

    ![](img/ab47fc8e240585a2e70c709b4ee10a72_176_3.png)


    You can change the suggested names here, but be sure to leave the Generate Layout
    File and Backwards Compatibility boxes checked.


    - 7 Click Finish to accept the suggested configuration – Android Studio will now
    generate several files and folders for the new project (this can take a while)
    then eventually open the IDE interface


    # Exploring project files


    The Android IDE provides a Project window that displays an expandable tree of
    all files and folders within the project. You can click any arrow in the Project
    window to expand a folder, and double-click any file in the Project window to
    open it in the tabbed editor.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_177_0.png)


    Despite its initial appearance of complexity, only two files need modification
    by the developer to create a customized application:


    - MainActivity.java - the Java file that loads controls into the app interface
    and can contain event-handler code to respond to user actions within the app interface.

    - activity_main.xml - the XML file that defines each control to appear in the
    app interface and their layout.


    Selecting the activity_main.xml file in the Project window presents it in the
    Editor window in one of two possible views - visually in Design view or programmatically
    in Text view. There are tabs at the bottom of the window to switch between views.


    # cont''d


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_178_0.png)


    Design view provides a Palette of controls that can be dragged onto a graphical
    representation of the app, a Component Tree to select any added control, and a
    Properties window in which to modify the appearance of a selected control.


    Text view provides a "code-behind" version of the layout that describes each aspect
    of added controls using XML attributes.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_178_1.png)


    Controls can be added to the app interface either visually in Design view or programmatically
    in Text view.


    # Adding resources & controls


    ### Image Resources


    To begin customizing the Android Studio empty app for the Lotto program, the image
    can first be added as a “resource”:


    - 1 Right-click on the Lotto.png image, and choose Copy

    - 2 Next, right-click on the app>res>drawable folder and choose Paste – to see
    a “Copy” dialog appear

    - 3 Rename the file to lowercase lotto.png

    - 4 Click OK


    to see the file now appear in the drawable folder


    ### Interface Controls


    The Lotto app will require three interface controls aligned above the other in
    a vertical layout. An ImageView control is required for the logo, a TextView control
    is required for the output, and a Button control is required for user interaction:


    - 1 Open the activity_main.xml file in the Editor’s Text view

    - 2 Insert this ImageView control element immediately before the default TextView
    element


    ```xml

    <ImageView

    android:layout_width="match_parent"

    android:layout_height="wrap_content"

    android:srcCompat="@drawable/lotto"

    android:id="@id/imageView"

    android:layout_constraintTop_topOf="parent" />

    ```


    The attributes in this element fit to the width of the layout container, and position
    the control at the top of the container. The image resource is defined as the
    content source, and the element is given an id for reference by other elements.


    # Edit the existing TextView element to look like this


    ```xml

    <TextView

    android:layout_width="match_parent"

    android:layout_height="wrap_content"

    android:id="@id/textView"

    android:height="60dp"

    android:textSize="36sp"

    android:gravity="center"

    android:layout_constraintTop_bottomOf="parent" />

    ```


    > Hot tip: The android.id attribute in each element specifies a unique name by
    which element can be referenced.


    # Insert this element right after the TextView


    ```xml

    <Button

    android:layout_width="match_parent"

    android:layout_height="wrap_content"

    android:id="@id/button"

    android:textSize="24sp"

    android:onClick="lotto"

    android:text="GET MY NUMBERS"

    android:layout_constraintTop_bottomOf="@id/textView" />

    ```


    > Hot tip: The onClick attribute specifies the name of event-handler to be called.


    # String Resources


    The strings we use to describe the image content and to specify the button text
    should be converted to a string resource:


    - Click within the “Lotto Logo” string assignment to give it focus, then press
    Alt+Enter to get a QuickFix dialog


    ```xml

    android:contentDescription="@string/lotto_logo" />

    ```


    - Choose Extract string, then provide a resource name in the “Extract Resource”
    dialog that appears

    - Click OK to close the dialog, and see the assigned string replaced by a reference
    to the string resource


    ```xml

    android:contentDescription="@string/lotto_logo" />

    ```


    - Repeat this for the “GET MY NUMBERS” string


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_180_0.png)


    # Inserting Java code


    After adding resources and controls on page 179, the app interface should now
    resemble that of the Lotto. application:


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_181_0.png)


    If the controls do not look like this screenshot, you should return to page 199
    and carefully check each element''s attributes.


    Functionality can next be added to the app by inserting an event-handler into
    the MainActivity.java file that will respond to the button''s onClick event when
    the user pushes the button. This event automatically passes one argument to the
    event-handler, which is an identifying reference to the control that has been
    clicked. Consequently, the event-handler signature must accommodate the argument
    by including a parameter for the View class — the base of all widgets. The method
    must also have a void return type:


    - Insert this event-handler signature into the MainActivity class, immediately
    after its onCreate() method block: `public void lotto(View view) { }`


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_181_1.png)


    ### MainActivity java


    Identity controls can be referenced in code by specifying their identity as the
