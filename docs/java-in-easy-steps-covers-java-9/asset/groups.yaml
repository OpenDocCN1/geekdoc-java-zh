    \ ==、不相等 !=、大于 > 或小于 < 值的真假。\n- 赋值运算符 = 可以与大于 > 或小于 < 运算符结合，当条件为真时返回 true。\n-\
    \ 逻辑运算符 && 和 || 运算符通过评估两个操作数来返回 true 或 false 的布尔值。\n- 逻辑运算符 ! 返回单个操作数的取反布尔值。\n\
    - 条件运算符 ? : 运算符会评估一个给定的布尔表达式，并根据其结果返回两个操作数之一。\n- 评估布尔表达式为真 值的表达式可以可选地省略 true。\n\
    - 反斜杠转义符 \\ 可用于 String 内部的引号字符以防止语法错误。\n- 转义序列 \\n 和 \\t 提供简单的输出格式化。\n- 位运算符在特殊情况下执行二进制算术运算时非常有用。\n\
    \n# 3 语句\n\n本章演示了用于在 Java 程序创建分支的各种关键字。\n\n- 44 使用 if 分支\n- 46 分支替代方案\n- 48 Switching\
    \ 分支\n- 50 for 循环\n- 52 使用 while true 循环\n- 54 执行 do-while 循环\n- 56 跳出循环\n- 58\
    \ 返回控制权\n- 60 摘要\n\n## 使用 if 分支\n\n**if** 关键字执行条件测试以评估表达式的布尔值。跟随表达式的语句仅在评估结果为\
    \ **true** 时才会执行，否则程序将继续执行随后的代码——即下一个“分支”。if 语句的语法如下：\n\n```\nif ( test-expression\
    \ ) code-to-be-executed-when-true ;\n```\n\n如果将要执行的代码封装在花括号内形成“语句块”，则要执行的代码可以包含多个语句：\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_45_0.png)\n\n- 创建一个名为 \"If\" 的新程序，包含标准的\
    \ main 方法\n```java\npublic static void main (String[] args) {\n}\n```\n\n- 在 main\
    \ 方法的花括号之间，这个简单的条件测试当一个值大于另一个值时执行单个语句：\n```java\nif ( 5 > 1 ) System.out.println(\"\
    Five is greater than one.\");\n```\n\n- 添加第二个条件测试，当一个值小于另一个值时执行整个语句块：\n```java\n\
    if ( 2 < 4 )\n{\n    System.out.println(\"Two is less than four.\");\n    System.out.println(\"\
    Test succeeded.\");\n}\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_45_1.png)\n\
    \n表达式可以使用 **true** 和 **false** 关键字。测试表达式 (**2 < 4**) 是 (**2 < 4 == true**) 的简写。\n\
    \n- 将程序保存为 If.java，然后编译并运行程序查看所有执行的语句——在这种情况下，两个测试都评估为 **true**：\n\n```\nC:\\\
    MyJava> javac If.java\nC:\\MyJava> java If\nFive is greater than one.\nTwo is\
    \ less than four.\nTest succeeded.\nC:\\MyJava>\n```\n\n条件测试还可以评估一个复杂的表达式来测试多个条件的布尔值。括号包围每个测试条件以确立优先级——因此它们会先被评估。布尔\
    \ && AND 运算符确保只有当两个条件都为真时，复杂表达式才会返回 true：\n\n```\nif ( ( test-condition1 ) &&\
    \ ( test-condition2 ) execute-this-code ;\n```\n\n布尔 || OR 运算符确保只有当其中一个条件为真时，复杂表达式才会返回\
    \ true：\n\n```\nif ( test-condition1 ) || ( test-condition2 ) execute-this-code\
    \ ;\n```\n\n这些者的组合可以形成更复杂的表达式：\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_46_0.png)\n\
    \n- 在 if.java 的 main 方法内部，插入此行来声明并初始化整数变量：\n```java\nint num = 8;\n```\n\n- 添加第三个条件测试，当\
    \ num 变量的值在指定范围内或恰好等于指定值时执行语句：\n```java\nif (( num > 5 ) && ( num < 10 )) || (\
    \ num == 12 ))\n{\n    System.out.println(\"Number is 6-9 inclusive, or 12\");\n\
    }\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_46_1.png)\n\n- 重新编译程序并运行一次查看执行的语句：\n\
    \n```\nJava in easy steps\nC:\\MyJava> javac If.java\nC:\\MyJava> java If\nFive\
    \ is greater than one.\nTwo is less than four.\nTest succeeded.\nNumber is 6-9\
    \ inclusive, or 12\nC:\\MyJava>\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_46_2.png)\n\
    \n复杂表达式使用 == 运算符来指定匹配，而不是赋值运算符。\n\n- 修改赋值给 num 变量的值使其处于指定范围 6-9 内。重新编译程序并再次运行查看复杂表达式后的语句未执行。\n\
    \n## 分支替代方案\n\nelse 关键字与 if 关键字结合使用，创建根据测试表达式评估结果供程序遵循的替代分支。在最简单的形式中，当测试失败时指定一个替代语句：\n\
    \n```\nif ( test-expression )\n    code-to-be-executed-when-true;\nelse\n    code-to-be-executed-when-false;\n\
    ```\n\n每个替代分支可以是单个语句，也可以是封装在花括号内的多个语句块。可以构造更强大的 if else 语句对每个替代分支进行测试表达式。这些使用嵌套的\
    \ if 语句来指定进一步的测试。当程序发现为真的表达式时，执行与该测试相关的语句并退出 else 语句，不再探索其他分支：\n\n- 创建一个名为 \"\
    Else\" 的新程序，包含标准的 main 方法\n```java\npublic class Else {\n    public static void\
    \ main (String[] args) {\n    }\n}\n```\n\n- 在 main 方法内部，插入此行来声明并初始化整数变量：\n```java\n\
    int hrs = 11;\n```\n\n- 插入此简单的条件测试，当 hrs 变量的值低于 13 时执行单个语句：\n```java\nif ( hrs\
    \ < 13 )\n{\n    System.out.println(\"Good morning: \" + hrs);\n}\n```\n\n- 将程序保存为\
    \ Else.java，然后编译并运行程序查看执行的语句：\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_47_0.png)\n\
    ![](img/ab47fc8e240585a2e70c709b4ee10a72_47_1.png)\n\n```\nJava in easy steps\n\
    C:\\MyJava> javac Else.java\nC:\\MyJava> java Else\nGood morning: 11\n```\n\n\
    - 修改赋值给 hrs 变量的值为 15，然后在 if 语句之后直接添加此替代分支：\n```java\nelse if ( hrs < 18)\n{\n\
    \    System.out.println(\"Good afternoon: \" + hrs);\n}\n```\n\n- 保存更改，重新编译并再次运行程序查看执行的替代语句：\n\
    \n```\nJava in easy steps\nC:\\MyJava> javac Else.java\nC:\\MyJava> java Else\n\
    Good afternoon: 15\n```\n\n有时希望提供一个最终的 else 分支（不嵌套 if 语句），以便在没有测试表达式为真时执行“默认”语句：\n\
    \n修改赋值给 hrs 变量的值为 21，然后在 if else 语句的末尾添加此分支：\n\n```java\nelse System.out.println(\"\
    Good evening: \" + hrs);\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_48_0.png)\n\
    \n条件分支是计算机程序运行的基本过程。\n\n保存更改，重新编译并再次运行程序查看只执行了默认语句：\n\n```\nJava in easy steps\n\
    C:\\MyJava> javac Else.java\nC:\\MyJava> java Else\nGood evening: 21\nC:\\MyJava>\n\
    ```\n\n## Switching 分支\n\n长长的 if else 语句为程序提供了许多可遵循的条件分支，可能会变得混乱。当测试表达式重复评估相同的变量值时，switch\
    \ 语句通常提供了一个更优雅的解决方案。\n\n典型 switch 语句的语法如下：\n\n```\nswitch ( test-variable ) {\n\
    \  case value1 : code-to-be-executed-when-true; break;\n  case value2 : code-to-be-executed-when-true;\
    \ break;\n  case value3 : code-to-be-executed-when-true; break;\n  default : code-to-be-executed-when-false;\n\
    }\n```\n\nswitch 语句的工作方式很独特。赋值变量会在多个 case 选项中寻找其值。与匹配值相关的语句将被执行。\n\nswitch 语句可选地包含一个使用\
    \ default 关键字的最终选项，以便在没有 case 选项匹配指定的值时执行语句。\n\n每个选项以 case 关键字和匹配值开始。随后跟着一个冒号以及匹配时要执行的语句（如果有的话）。\n\
    \n重要的是，与每个 case 选项关联的语句或语句块必须由 break 关键字终止。否则，程序将继续执行匹配选项之后的其他 case 语句。有时，希望指定一组执行相同语句的\
    \ case 选项。例如，对于每三个选项的块执行一个语句：\n\n```\nswitch ( test-variable ) {\n  case value1\
    \ : case value2 : case value3 :\n    code-A-to-be-executed-when-true; break;\n\
    \  case value4 : case value5 : case value6 :\n    code-B-to-be-executed-when-true;\
    \ break;\n}\n```\n\n缺失 break 关键字并不是语法错误——确保 switch 块中存在所有预期的 break 以避免意外结果。\n\n\
    ![](img/ab47fc8e240585a2e70c709b4ee10a72_49_0.png)\n\n"
