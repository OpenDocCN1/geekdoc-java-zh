    # 总结\n\n`javax.swing` 包包含了用于创建 GUI 组件的 Java Swing 类。\n\n窗口作为一个顶层 `JFrame` 容器创建。\n\
    \n`JFrame` 构造函数应该指定窗口的标题、大小、默认关闭操作和可见性。\n\n`JPanel` 容器使用其默认的 `FlowLayout` 布局管理器在换行中显示较小的组件。\n\
    \n`JButton` 构造函数可以指定要在推入按钮组件上显示的文本和图像。\n\n`ImageIcon` 对象表示程序中使用的图像。\n\n要作为单个 Java\
    \ 归档 (JAR) 部署的程序应该使用 `ClassLoader` 指定图像源。\n\n`JLabel` 对象显示非交互式文本和图像内容。\n\n可编辑文本可以显示在\
    \ `JField` 和 `JTextArea` 字段中。\n\n`JScrollPane` 对象为 `JTextArea` 字段提供滚动条。\n\n可以通过\
    \ `JComboBox` 和 `JList` 组件显示选择项。\n\n`ButtonGroup` 对象在逻辑上对多个 `JRadioButton` 组件分组，使得只能选择其中一个。\n\
    \n特定的 RGB 颜色可以通过 `java.awt` 包中的 `Color` 类来表示。\n\n`java.awt` 包有一个 `Font` 类，可以用于创建表示特定字体名称、样式和大小的对象。\n\
    \n可以使用 `java.awt` 包中的 `Container` 类将多个 `JPanel` 容器添加到 `JFrame` 容器中，以表示 `JFrame`\
    \ 的内容面板。\n\n在创建 `JPanel` 对象时，其参数可以可选地指定布局管理器。\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_151_0.png)\n\
    \n# 9 识别事件\n\n本章演示如何创建 Java 程序事件处理程序，以响应用户界面操作。\n\n- 152 监听事件\n- 153 生成事件\n- 154\
    \ 处理按钮事件\n- 156 处理项目事件\n- 158 响应键盘事件\n- 160 响应鼠标事件\n- 162 发布消息\n- 164 请求输入\n-\
    \ 166 总结\n\n# 监听事件\n\n用户可以通过执行鼠标、键盘或其他输入设备的操作来与提供图形用户界面 (GUI) 的程序进行交互。这些操作会导致“事件”的发生，而对它们做出响应被称为“事件处理”。\n\
    \n程序为了识别用户事件需要从 `java.awt.event` 包中添加一个或多个事件接口。这些接口可以供类可用。\n\n类可以包含多个事件接口。例如，最常见的下表所示：\n\
    \n| 事件监听器 | 描述 |\n| :--- | :--- |\n| ActionListener | 识别按下按钮时发生的动作事件 |\n| ItemListener\
    \ | 识别项目选中或取消选择时发生的项目事件 |\n| KeyListener | 识别按下键时发生的键盘事件 |\n| MouseListener |\
    \ 识别鼠标进入或退出时的鼠标事件 |\n| MouseMotionListener | 识别鼠标移动时发生的运动事件 |\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_153_0.png)\n\
    \n# 生成事件\n\n组件需要生成事件才有用。例如，创建生成事件按钮的语句所示：\n\n```\nJButton btn = new JButton(\"\
    Click Me\");\nbtn.addActionListener( );\n```\n\n当用户点击按钮时，`ActionListener` 识别事件并将\
    \ `ActionEvent` 传递给 `actionPerformed()` 方法。`ActionEvent` 对象包含有关事件源的信息。为特定按钮创建响应的事件处理方法可能如下：\n\
    \n```java\npublic void actionPerformed(ActionEvent event )\n{\n    if ( event.getSource()\
    \ == btn )\n    {\n        // 点击此按钮时执行的语句\n    }\n}\n```\n\n# 处理按钮事件\n\n设置为在点击时生成\
    \ `ActionEvent` 的 Swing `JButton` 组件可以被 `ActionListener` 接口识别，该接口会将事件传递给 `actionPerformed()`\
    \ 方法。`ActionEvent` 对象有一个 `getSource()` 方法来标识组件，并有一个 `getActionMode()` 方法返回字符串。这将是按钮组件的文本标签，或者是文本字段组件的内容。\n\
    \n按钮的一种响应可能是通过调用 `setEnabled()` 方法并传递 `false` 参数来禁用组件。相反，可以通过向其 `setEnabled()`\
    \ 方法指定 `true` 参数来启用组件。\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_155_0.png)\n\
    \n"
