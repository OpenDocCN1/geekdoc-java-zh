    # 1 入门欢迎来到兴奋的 Java 编程世界。本章将展示如何创建和执行简单的 Java 程序，并演示了如何在程序中存储数据。


    - 简介 8

    - 安装 JDK 10

    - 编写第一个 Java 程序 12

    - 编译并运行程序 14

    - 创建变量 16

