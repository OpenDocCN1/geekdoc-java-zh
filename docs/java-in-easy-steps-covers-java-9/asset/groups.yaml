    \ as output the first four characters of each title\n```java\nfor (int i = 0;\
    \ i < books.length; i++)\n{\n  System.out.print(books[i].substring(0, 4) + \"\
    \ | \");\n}\n```\n\nInsert a statement in the for loop block to count the titles\
    \ found with a specified ending\n```java\nif (books[i].endsWith(\"in easy steps\"\
    )) counter1++;\n```\n\nInsert a statement in the for loop block to count the titles\
    \ found with a specified beginning\n```java\nif (books[i].startsWith(\"Java\"\
    )) counter2++;\n```\n\nInsert a statement in the for loop block to count the titles\
    \ found not containing a specified substring\n```java\nif (books[i].indexOf(\"\
    easy\") == -1) counter3++;\n```\n\nAt the end of the main method, add these statements\
    \ to output the results of each search\n```java\nSystem.out.println(\"Found \"\
    \ + counter1 + \" titles from this series\");\nSystem.out.println(\"Found \" +\
    \ counter2 + \" Java title\");\nSystem.out.println(\"Found \" + counter3 + \"\
    \ other titles\");\n```\n\nSave the program as StringSearch.java then compile\
    \ and run the program to see the output\n\n```\nJava in easy steps\nC:\\MyJava>\
    \ javac StringSearch.java\nC:\\MyJava> java StringSearch\nFound XML | SQL | CSS\
