    # Formatting numbers


    Java contains a package named java.text that provides useful classes for formatting
    numbers and currency. The package can be made available to a program by including
    an import statement at the very beginning of the java file. This can use the wildcard
    character to mean "all classes" in the statement import java.text.*;. Alternatively,
    specific classes can be imported by name.


    The java.text package has a class named "Number", which has methods that can be
    used to format numerical values for output – adding group separators, currency
    signs, and percentage signs.


    The method used to create a new NumberFormat object determines its formatting
    type – getCurrencyInstance() for currency signs, and getPercentage() for percentage
    signs. Formatting is applied by specifying the numerical value to be formatted
    as the argument to the format() method of the NumberFormat object.


    The java.time package has a DateTimeFormatter class that can be used to format
    java.time dates and times. A DateTimeFormatter object contains a formatter pattern
    that is specified as a string argument to its ofPattern() method. The formatter
    comprises letters, defined in the Java documentation, and your choice of separators.
    "M/d/y" specifies the month, day, and year, separated by slashes. The format is
    applied by specifying the formatter as the argument to the format() method of
    a java.time date and time object.


