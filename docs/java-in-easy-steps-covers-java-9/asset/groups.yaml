    # # Summary


    +   - Numeric values can be converted to other numeric data types by casting,
    and to the String type using the `toString()` method.


    +   - A String value can be converted to an int value using the Integer.parseInt()
    method, and to a float using `Float.parseFloat()`.


    +   - An array is a variable that can contain multiple values, initialized as
    a list within curly brackets in its declaration.


    +   - An empty array object can be created using the `new` keyword.


    +   - The length property of an array stores an integer, which is the number of
    elements in that array.


    +   - Each element of an array can be addressed by its index number.


    +   - A program''s main method creates a String array, traditionally named "args",
    to store command line arguments.


    +   - The first command line argument `args[0]` element is automatically stored
    in the `args` array – as a String data type.


    +   - Multiple arguments being passed to a program from the command line must
    each be separated by a space.


    +   - Loops are an ideal way to read all the values stored within array elements.


    +   - Data from multiple arrays can be combined to form a new array of totaled
    data in each element.


    +   - Multi-dimensional arrays can store multiple sets of element values, each
    having their own index dimension.


    +   - A catch statement is used to anticipate and handle runtime exceptions that
    may arise.


    +   - The Exception class catches all exception errors, including NumberFormatException
    and ArrayIndexOutOfBoundsException.


    +   - A catch statement can be extended with a finally statement block, containing
    code that will always be executed.'
