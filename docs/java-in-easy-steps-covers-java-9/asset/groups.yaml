    # Requesting input


    The Swing JOptionPane can request information from the user by opening a dialog
    box with its showConfirmationDialog() method, requesting a decision, or with its
    showInputDialog() method, requesting user input.


    Both methods can take four arguments:


    - Parent object – typically referenced by the this keyword

    - Request String to be displayed

    - Dialog title String


