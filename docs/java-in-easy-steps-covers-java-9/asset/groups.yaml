- md: "\n# Comparing strings\n\nThe String class within the java.lang package provides\
    \ the useful equals() method that was introduced on page 66 to evaluate a command\
    \ line argument in the args[0] element. This can also be used to compare any two\
    \ String values by tackling the method name onto the first String variable using\
    \ dot notation, and specifying the String to be compared as its argument. For\
    \ example, the syntax to compare txt2 to txt1 is equals(txt2). When both String\
    \ values have identical characters, in the same order, the method returns true\
    \ – otherwise it returns false.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_91_0.png)\n\
    \nBe sure to observe correct capitalization using a capital “C” in the toUpperCase\
    \ and toLowerCase methods.\n\nString values that use different letter case, such\
    \ as “Java” and “JAVA”, are not considered equal because the ASCII code value\
    \ of the characters differ. For instance, the value of uppercase “A” is 65, whereas\
    \ lowercase “a” is 97.\n\nTo compare an input String value, where the letter case\
    \ entered by the user is uncertain, against a String value in the program it is\
    \ often useful to transform the input into a particular case. For this purpose,\
    \ the String class provides a toUpperCase() method and a toLowerCase() method.\
    \ When String is specified as the argument, the method returns the transformed\
    \ String.\n\nA typical example might force a user-input password String to lowercase\
    \ before comparing it to the correct password stored in all lowercase in a String\
    \ variable within the program. This would allow the user to enter their password\
    \ in uppercase, lowercase, or a mixture of both cases where case-insensitive passwords\
    \ are permissible.\n\nDot notation allows methods to be tacked onto other methods\
    \ so their operations can be performed in sequence. This means that toLowerCase().equals()\
    \ can be used to transform a String value to lowercase and then compare that lowercase\
