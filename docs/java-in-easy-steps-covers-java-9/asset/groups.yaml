    \ and long the thunder bellowed\nThat night a child might understand\nThe devil\
    \ had business on his hand.\n```\n\n# 排序数组元素\n\nJava 包含一个 `java.util` 包，它提供了处理数据集合的实用工具。通过在\
    \ java 文件的最开头包含 `import` 语句，可以让程序可以使用该包。在 `import java.util.*;` 语句中使用通配符字符表示“所有类”。\n\
    \n`java.util` 包中有一个名为 \"Arrays\" 的类，它拥有可以用于操作数组的方法。可以通过导入 `java.util` 包中的所有类使该功能对程序可用，或者在程序只需要单个类时，`import`\
    \ 语句可以导入该特定类。例如，程序可以使用 `java.util.Arrays` 导入 `Arrays` 类。\n\n- 启动一个新程序并导入所有 java.util\
    \ 类的功能：`import java.util.*;`\n\n- 添加一个名为 \"Sort\" 的类，包含标准主方法的类：\n```java\n{\n\
    \    public static void main ( String[] args ) {\n    }\n}\n```\n\n- 1. 启动一个新程序并导入所有\
    \ java.util 类的功能：`import java.util.*;`\n\n- 2. 添加一个名为 \"Sort\" 的类，包含标准主方法：\n![](img/ab47fc8e240585a2e70c709b4ee10a72_125_0.png)\n\
    \n`java.util` 包中有一个名为 \"Arrays\" 的类，它拥有可以用于操作数组的方法。可以通过导入 `java.util` 包中的所有类使该功能对程序可用，或者在程序只需要单个类时，`import`\
    \ 语句可以导入该特定类。例如，程序可以使用 `java.util.Arrays` 导入 `Arrays` 类。\n\n`Arrays` 类有一个 `sort()`\
    \ 方法可以按字母和数字顺序重新排列元素。\n\n- 在主方法的大括号之间，声明并初始化一个 String 数组用于存储文本：\nString[] names\
    \ = {\"Dave\", \"Andy\"};\n\n- 添加一个循环将文本文件内容读取到变量并输出每行文本：\n```java\nfor (int i\
    \ = 0; i < names.length; i++) {\n    System.out.println(names[i]);\n}\n```\n\n\
    记住在不再需要时关闭 BufferedReader 对象\nbuffer.close();\n\n将程序保存为 `Sort.java`，然后编译并运行程序以查看输出\n\
    \n```\nC:\\MyJava> javac Sort.java\nC:\\MyJava> java Sort\nString Array:\nDave\n\
    Andy\nInteger Array:\n200\n300\n100\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_126_0.png)\n\
    \n# 数组列表\n\n`java.util` 包包含一个名为 `ArrayList` 的类，它以有序（可调整大小）的序列存储数据。可以通过导入特定类使其程序可用。列表可以包含重复元素，并可以通过指定元素索引来操作存储值的方法。例如，列表的\
    \ `get(0)` 将检索存储第一个元素，`remove(1)` 将删除第二个元素。\n\nArrayList 简单使用 `new` 关键字创建，但与其他集合一样，语句必须指定它可能包含的泛型类型。通常，列表包含\
    \ `String`，因此 `ArrayList` 必须带有 `<String>` 后缀。\n\n作为集合，`ArrayList` 拥有一个 `forEach()`\
    \ 方法，可以遍历列表中的每个元素。这使得遍历列表包含的所有项变得简单。\n\n通过将 表达式作为 `forEach()` 方法的参数，可以方便地引用每个存储的列表项。表达式只是简短的匿名（未命名）方法，可以在要执行的地方指定。\n\
    \n```\n( argument ) -> { statement/s }\n```\n\n参数的数据类型可以显式声明，也可以从上下文中推断出来 -(String\
    \ x) 并简化为 (x)。此外，如果 表达式语句块只包含一条语句，可以省略大括号。\n\n通过列表的 `forEach()`，迭代中的当前元素可以作为参数传递给表达式，然后通过其语句在输出中显示\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_127_1.png)\n\n你可以通过调用 `size()` 方法发现列表当前有多少个元素。\n\
    \nLambda表达式是在 Java 8 中引入的以实现简洁的方法。\n\n"
