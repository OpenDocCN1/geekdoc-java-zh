    ## 2 Performing operations


    This chapter demonstrates the various operators that are used to create expressions
    in favor programs.


    - 26 Doing arithmetic

    - 28 Assigning values

    - 30 Comparing values

    - 32 Assessing logic

    - 34 Examining conditions

    - 36 Setting precedence

    - 38 Escaping literals

    - 40 Working with bits

    - 42 Summary


    ## Doing arithmetic


    Arithmetical operators, listed in the table below, are used to create expressions
    in Java programs that return a single resulting value. For example, the expression
    4 * 2 returns the value 8.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_27_0.png)


    Division of int values will truncate any fractional part. For example, 11/4 =
    2, whereas division of float values 11/4 = 2.75.


    | Operator | Operation |

    | --- | --- |

    | + | Addition (and concatenates String values) |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division |

    | % | Modulus |

    | ++ | Increment |

    | -- | Decrement |


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_27_1.png)


    The increment operator ++ and decrement operator -- return the result of modifying
    a single given operand by a value of one. For example, 4++ returns the value 5,
    and 4-- returns the value 3.


    All other arithmetic operators return the result of an operation performed on
    two given operands, and act as you would expect. For example, the expression 5
    + 2 returns the value 7.


    The modulus operator divides the first operand and returns the remainder of the
    operation. For example, the expression 32 % 5 returns 2 – five divides 32 six
    times, with 2 remainder.


    The operation performed by the addition operator depends on the type of its given
    operands. Where both operands are numeric values it will return the total sum
    value of numbers, but where the operands are String values it will return a single
    concatenated String – combining the text in each String operand. For example,
    "Java" + "Arithmetic" returns "Java Arithmetic".


    Increment and decrement operators are typically used to count the iterations in
    the for loop constructs, introduced on page 50.


    Follow these steps to explore the Java arithmetic operators in the Java shell:


    - Open a command-line prompt window, then type jshell and hit the Enter key to
    launch the Java shell


    - Next, enter statements to initialize three variables `int num = 100; int factor
    = 20; int sum = 0;`


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_28_0.png)


    Java must be installed on your system path to launch the Java shell from any prompt
    - see Installing on page 11 and Troubleshooting on page 22 for details.


    ```

    C:\MyJava jshell

    shell int num = 100; int factor = 20; int sum = 0;

    num => 100

    factor => 20

    sum => 0

    shell =>

    ```


    - Next, separately enter statements to perform addition and subtraction operations,
    displaying each result

    sum = num + factor;

    sum = num - factor;


    ```

    Java in easy steps

    shell sum = num + factor;

    sum => 120

    shell sum = num - factor;

    sum => 80

    ```


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_28_1.png)


    - Now, separately enter statements to perform multiplication and division operations,
    displaying each result

    sum = num * factor;

    sum = num / factor;


    The Java shell jshell is a new feature in Java 9. Optionally, the semicolon may
    be omitted at the end of single statements entered into the shell but these are
    required when writing Java programs for compilation. Semicolons are included in
    the shell examples in this chapter to aid code consistency.


    ```

    Java in easy steps

    shell sum = num * factor;

    sum => 2000

    shell sum = num / factor;

    sum => 5

    ```


    ## Assigning values


    Assignment operators, listed in the table below, are used to assign the result
    of an expression. All except the simple = operator are the shorthand form of a
    longer equivalent expression:


    | Operator | Example | Equivalent |

    |---|---|---||

    | = | a = b | a = b |

    | += | a += b | a = a + b |

    | -= | a -= b | a = a - b |

    | *= | a *= b | a = a * b |

    | /= | a /= b | a = a / b |

    | %= | a %= b | a = a % b |


    It is important to regard the = operator to mean “assign”, rather than “equals”,
    to avoid confusion with the == equality operator.


    In the example a = b, the value stored in the variable named b is assigned to
    the variable named a, so that value becomes the new value stored in a - replacing
    any value it previously contained.


    The += operator is used to add a value to an existing value stored in a variable
    - keeping a “running total”.


    The example a = b calculates the sum total of the values stored in the variables
    a and b, then assigns the resulting total to variable a. A program might contain
    a further assignment a += c that calculates the total stored in variables named
    a and c, then assigns that total to variable a - adding the value of c to the
    value it previously contained.


    All the other assignment operators work in the same way by first performing the
    arithmetical calculation on the two stored values, then assigning the result to
    the first variable – to become its new stored value.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_29_0.png)


    The == equality operator compares values, and is fully explained on page 30.


    Follow these steps to explore the Java assignment operators in the Java shell:


    - Open a command-line prompt window, then type jshell and hit the Enter key to
    launch the Java shell


    - Next, enter statements to initialize two String variables `String txt = "Super
    "; String lang = "Java";`


    - Now, separately enter statements to add and assign, displaying each result txt
    += lang;


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_30_0.png)


    The new shell feature, introduced in Java 9, creates the result.


    ```

    C:\MyJava jshell

    shell String txt = "Super "; String lang = "Java";

    txt => "Super "

    lang => "Java"

    shell txt += lang;

    txt => "Super Java"

    ```


    - Enter, enter statements to initialize two variables `sum = 10; int num = 20;`


    - Separately enter statements to add and assign int value, displaying each result
    sum += num; sum;


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_30_1.png)


    ```

    jshell sum = 10; int num = 20;

    sum => 10

    num => 20

    shell sum += num;

    sum => 30

    shell sum;

    sum => 30

    ```


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_30_2.png)


    Assignment of the wrong data type to a variable will cause an error.


    ## Comparing values


    Comparison operators, listed in the table below, are used to compare two values
    in an expression and return a single Boolean value of true or false – describing
    the result of comparison.


    | Operator | Comparison |

    | --- | --- |

    | == | Equality |

    | != | Inequality |

    | > | Greater than |

    | >= | Greater than, or equal to |

    | < | Less than |

    | <= | Less than, or equal to |


    The == equality operator compares two operands, and will return true if both are
    exactly equal in value. If both are the same number they are equal, or if both
    are String values containing the characters in the same order they are equal.
    Boolean operands that are both true, or that are both false.


