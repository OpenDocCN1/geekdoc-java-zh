    \ 24.75f;`\n`int num2 = 25;`\n\n- 输出较大的值\n`System.out.println(\"Most is \" + Math.max(num1,\
    \ num2));`\n\n- 输出较小的值\n`System.out.println(\"Least is \" + Math.min(num1, num2));`\n\
    \n- 将程序保存为 Compare.java，然后编译并运行程序查看输出\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_86_0.png)\n\
    \n```\nC:\\MyJava> javac Compare.java\nC:\\MyJava> java Compare\nMost is 25.0\n\
    Least is 24.75\nC:\\MyJava> _\n```\n\n## 生成随机数\n\njava.lang 包中的 `Math` 类通过其 `Math.random()`\
    \ 方法提供了生成随机数的能力，该方法返回 0.0 到 0.999 之间的双精度随机数。乘以随机数可以指定更宽的范围。例如，乘以 10 将创建一个 0.0\
    \ 到 9.999 范围内的随机数。现在使用 `Math.ceil()` 对随机数进行舍入，将确保它落在 1-10 的范围内。\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_87_0.png)\n\
    \n- 创建一个名为 \"Random\" 的程序，其中包含标准的 main 方法 Random\n```java\nclass Random {\n  \
    \  public static void main (String[] args) {\n}\n```\n在 main 方法内部，将一个随机数赋值给 float\
    \ 变量 `float random = (float) Math.random();` `System.out.println(\"Random number:\
    \ \" + random);`\n\n- 将随机数的乘积赋值给第二个 float 变量，并输出其值 `float multiplied = random\
    \ * 10;` `System.out.println(\"Multiplied number: \" + multiplied);`\n\n- 将乘后的随机数的舍整整数赋值给\
    \ int 变量，并输出其值 `int randomInt = (int) Math.ceil(multiplied);` `System.out.println(\"\
    Random Integer: \" + randomInt);`\n\n将程序保存为 Random.java，然后编译并运行程序查看输出\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_87_1.png)\n\
    \n相反描述的 Lottery 程序将此示例中的三个步骤合并到一个语句中。\n\n```\nJava in easy steps\nC:\\MyJava>\
    \ javac Random.java\nC:\\MyJava> java Random\nRandom number: 0.11486274\nMultiplied\
    \ number: 1.1486274\nRandom Integer: 2\nC:\\MyJava> _\n```\n\njava.lang 包中的 `Math`\
    \ 类提供了两个方法来比较两个数值。`Math.max()` 方法（注意：此处原文似乎不完整）\n\n- 创建一个名为 \"Lottery\" 的程序，其中包含标准的\
    \ main 方法 Lottery\n```java\nclass Lottery {\n    public static void main (String[]\
    \ args) {\n}\n```\n![](img/ab47fc8e240585a2e70c709b4ee10a72_88_0.png)\n\n- 在 main\
    \ 方法内部，创建一个 int 数组 `int[] nums = new int[60];`\n- 赋值值 `int r = (int)(Math.random()\
    \ * 60);`\n- 输出值 `System.out.println(nums[r]);`\n- 将程序保存为 Lottery.java，然后编译并运行程序查看输出\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_88_1.png)\n\n## 管理字符串\n\n在 Java 编程中，String\
    \ 是包含在引号内的字符集合。因此，这些是有效的字符串：\n\n```java\nString txt1 = \"My First\";\n```\n\n\
    ```java\nString txt2 = \"\";\n```\n\n```java\nString txt3 = \"2\";\n```\n\n```java\n\
    String txt4 = \"null\";\n```\n\n空引号 txt2 将变量初始化为空字符串。null 关键字通常表示值的缺失，但在引号内它仅仅是一个字符串。\n\
    \nString 类是 java.lang 的一部分，并提供了 `length()` 方法，该方法返回 String 的大小，就像数组长度一样。每个 String\
    \ 都是 String 类的实例。\n\njava.lang 包中的 String 类还提供了 + 拼接运算符的替代方案。其 `concat()` 方法需要一个参数，指定要附加的第二个字符串。在使用时，通过点符号将其附加到第一个字符串的变量名上。例如，使用\
    \ `txt1.concat( txt2 )` 附加 txt2。\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_89_0.png)\n\
    \nArray.length 是一个属性，但 String.length() 是一个方法——所以它必须带有尾括号。\n\n创建一个名为 \"StringLength\"\
    \ 的程序\n\n```java\nclass StringLength {\n    public static void main (String[]\
    \ args) {\n}\n}\n```\n![](img/ab47fc8e240585a2e70c709b4ee10a72_90_0.png)\n\n-\
    \ 在 main 方法内部，创建并初始化两个 String 变量\n`String lang = \"Java\";`\n`String series =\
    \ \" in easy steps\";`\n\n- 添加另一个 String 变量并赋值另外两个 String 变量的拼接值\n`String title\
    \ = lang.concat( series );`\n\n- 输出引号内的拼接字符串，连同它的大小\n`System.out.print(\"\\\"\"\
    \ + title + \"\\\" \");`\n`System.out.println(title.length() + \" characters\"\
    );`\n\n将程序保存为 StringLength.java，然后编译并运行程序查看输出\n\n```\njava in easy steps\nC:\\\
    MyJava> javac StringLength.java\nC:\\MyJava> java StringLength\n\"Java in easy\
    \ steps\" has 18 characters\nC:\\MyJava> _\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_90_1.png)\n\
    \n空格是 String 的一部分，因此包含在字符计数中——但引号不包含在内。\n\n"
