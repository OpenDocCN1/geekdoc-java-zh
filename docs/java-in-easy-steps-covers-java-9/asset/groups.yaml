    \ Hello program being compiled and run in combined steps on a Linux system:\n\n\
    ![](img/ab47fc8e240585a2e70c709b4ee10a72_16_2.png)\n\n## Creating a variable\n\
    \nIn Java programming, a \"variable\" is simply a useful container in which a\
    \ value may be stored for subsequent use by the program. The stored value may\
    \ be changed (vary) as the program executes its instructions – hence the term\
    \ \"variable\".\n\nA variable is created by writing a variable \"declaration\"\
    \ in the program, specifying the type of data that variable may contain and a\
    \ given name for that variable. For example, the String data type can be specified\
    \ to allow a variable named \"message\" to contain regular text with this declaration:\n\
    \n```\nString message ;\n```\n\nVariable names are chosen by the programmer but\
    \ must adhere to naming conventions. The variable name may only begin with a letter,\
    \ dollar sign $, or the underscore character _, and subsequently have only digits,\
    \ dollar signs, or underscore characters. Names are case-sensitive, so \"var\"\
    \ and \"Var\" are distinctly different names, and spaces are not allowed in names.\n\
    \nVariable names should also avoid the Java keywords listed in the table below,\
    \ as these have special meaning in the Java language.\n\n| abstract | default\
    \ | goto | package | synchronized |\n| --- | --- | --- | --- | --- |\n| assert\
    \ | do | if | private | this |\n| boolean | double | implements | protected |\
    \ throw |\n| break | else | import | public | throws |\n| byte | enum | instanceof\
    \ | return | transient |\n| case | extends | int | short | true |\n| catch | false\
    \ | interface | static | try |\n| char | final | long | strictfp | void |\n| class\
    \ | finally | native | String | volatile |\n| const | float | new | super | while\
    \ |\n| continue | for | null | switch |\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_17_0.png)\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_17_1.png)\n\nEach variable declaration\
    \ must be terminated with a semicolon character – like all other statements.\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_17_2.png)\n\nStrictly speaking, some\
    \ words in this table are not actually keywords – true, false, and null are all\
    \ literals; String is a special class name, const and goto are reserved words\
    \ (currently unused). These are included in the table because they must also be\
    \ avoided when naming variables.\n\ngood practice, variables should be named with\
    \ words or easily recognizable abbreviations, describing that variable's purpose.\
    \ For example, \"button1\" or \"btn1\" to describe button number one. Lowercase\
    \ letters are preferred for single-word names, such as \"gear\", and names that\
    \ consist of multiple words should capitalize the first letter of each subsequent\
    \ word, such as \"gearRatio\" – the so-called camelCase naming convention.\n\n\
    Once a variable has been declared, it may be assigned a value. Follow these steps\
    \ to create a program that declares a variable:\n\n- Start a new program named\
    \ FirstVariable, containing the standard method\n  public static void main (String[]\
    \ args) {\n- Between the curly brackets of main method, insert this code to create,\
    \ initialize and output\n  String message = \"Initial value\";\n  System.out.println(message);\n\
    - Add these lines to modify and output the variable\n  message = \"Modified value\"\
    ;\n  System.out.println(message);\n- Save the program as FirstVariable, then compile\
    \ and run\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_18_0.png)\n\nFirstVariable\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_18_1.png)\n\nIf you encounter problems\
    \ compiling or running the program, you can get help from Troubleshooting problems\
    \ on page 22.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_18_2.png)\n\n## Recognizing\
    \ data types\n\nThe most frequently-used data types in Java declarations are listed\
    \ in this table, along with a brief description:\n\n| Data type | Description\
    \ | Example |\n|---|---|---|\n| char | A single Unicode character | 'a' |\n| String\
    \ | Any number of Unicode characters | 'message' |\n| int | An integer number,\
    \ from -2.14 billion to +2.14 billion | 1000 |\n| float | A floating-point number,\
    \ with a decimal point | 3.1415265 |\n| boolean | A logical value of either true\
    \ or false | true |\n\nDue to the irregularities of floating-point arithmetic\
    \ the float type should never be used for precise values, such as currency – see\
    \ page 130 for details.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_19_0.png)\n\
    \nNotice that char data values must be surrounded by single quotes, and String\
    \ data values must always be surrounded by double quotes. Also, remember that\
    \ float data values must always have an \"f\" suffix to ensure they are treated\
    \ as a float value.\n\nIn addition to the more common data types above, Java provides\
    \ these specialized data types for use in exacting circumstances:\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_19_1.png)\n\
    \n| Data type | Description |\n|---|---|\n| byte | Integer number from -128 to\
    \ +127 |\n| short | Integer number from -32,768 to +32,767 |\n| long | Positive\
    \ or negative integer exceeding 2.14 billion |\n| double | Extremely long floating-point\
    \ number |\n\nAll data type keywords begin with a lowercase letter except String\
    \ – which is a special class.\n\nSpecialized data types are useful in advanced\
    \ Java programs – the examples in this book mostly use the common data types described\
    \ in the top table.\n"
  mdcn: '


    ## 编译与运行程序


    在 Java 程序运行之前，它必须首先由 Java 编译器编译成类文件。该编译器位于 Java 的 `bin` 目录中，是一个名为 `javac` 的应用程序。第
    11 页的说明描述了如何将 `bin` 子目录添加到系统路径中，以便可以在任何系统位置调用 `javac`。


    在 Windows 上，使用 Windows PowerShell 或其他命令提示符（Command Prompt）提供命令行界面；在 Linux 上，使用终端（Terminal）窗口。


    按照以下步骤编译第13 页程序：


    - 打开命令行窗口，然后导航到保存 `Hello.java` 源码文件的目录

    - 输入 `javac` 后加一个空格，然后输入源码文件的全名 `Hello.java` 并按回车键


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_15_0.png)


    在提示符处输入 `javac` 并按回车，即可显示 Java 编译器的选项。


    ```

    Java in easy steps

    :\> cd MyJava

    :\MyJava> javac Hello.java

    :\MyJava>

    ```


    如果 `javac` 编译器在代码中发现错误，它将停止并显示一个指示错误性质的有用报告——参见第 22 页的故障排除。


    如果 `javac` 编译器没有发现任何错误，它将创建一个以程序命名并带有 `.class` 后缀的新文件。


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_15_1.png)


    如果你为 `javac` 编译器指定完整路径地址，也可以从另一个位置编译源码——在这种情况下，为 `C:\MyJava\Hello.java`


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_15_2.png)


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_15_3.png)


    ...续上


    当 Java 编译器完成编译后，命令行窗口的焦点返回提示提示符，没有任何确认消息——程序已准备好运行。


    Java 程序解释器是一个名为 `java` 的应用程序，位于 Java `bin` 子目录中——与 `javac` 编译器并列。由于该目录之前已在第11
    页添加到系统路径，因此可以在任何位置调用 `java` 解释器。


    按照对面页描述的步骤运行已编译的程序：


    - 打开命令行程序窗口，然后导航到 `Hello.class` 程序文件所在的目录

    - 在提示符处，输入 `java` 后加一个空格，然后输入程序名 `Hello` 并按回车键


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_16_0.png)


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_16_1.png)


    `Hello` 程序运行并执行其 `main` 方法中语句内定义的任务——输出 "Hello World!"。完成后，焦点再次返回到提示符。


    编译和运行 Java 程序的过程通常按顺序步骤结合在一起，且与平台无关。下方的截图说明了在 Linux 系统上组合步骤编译并运行 `Hello` 程序：


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_16_2.png)


    ## 创建变量


    在 Java 编程中，“变量”简单来说是一个实用的容器，其中存储一个值供程序后续使用。当程序执行其指令时，存储的值可能会发生变化（vary）——因此被称为“变量”（variable）。


    变量是通过在程序中编写变量“声明”来创建的，该声明指定了变量可能包含的数据类型以及该变量给定的名称。例如，可以指定 `String` 数据类型以允许名为 "message"
    的变量包含普通文本，其声明如下：


    ```

    String message ;

    ```


    变量名由程序员选择，但必须遵守命名规范。变量名只能以字母、美元符号 `$` 或下划线字符 `_` 开始，随后只能包含数字、美元符号或下划线字符。名称对大小写敏感，因此
    "var" 和 "Var" 是完全不同的名称，且名称中不允许空格。


    变量名还应避免下表列出的 Java 关键字，因为这些在 Java 语言具有特殊含义。


    | abstract | default | goto | package | synchronized |

    | --- | --- | --- | --- | --- |

    | assert | do | if | private | this |

    | boolean | double | implements | protected | throw |

    | break | else | import | public | throws |

    | byte | enum | instanceof | return | transient |

    | case | extends | int | short | true |

    | catch | false | interface | static | try |

    | char | final | long | strictfp | void |

    | class | finally | native | String | volatile |

    | const | float | new | super | while |

    | continue | for | null | switch |


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_17_0.png)


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_17_1.png)


    每个变量声明必须以分号结束，在这种情况下，C:\MyJava\Hello.java


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_17_2.png)


    如果 `javac` 编译器在代码中发现错误，它将停止并显示一个指示错误性质的有用报告——参见第 22 页的故障排除。


    如果 `javac` 编译器没有发现任何错误，它将创建一个以程序命名并带有 `.class` 后缀的新文件。


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_15_1.png)


    如果你为 `javac` 编译器指定完整路径地址，也可以从另一个位置编译源码——在这种情况下，C:\MyJava\Hello.java


