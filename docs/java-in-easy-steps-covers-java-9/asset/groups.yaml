    \n...cont'd\n\nBetween the curly brackets of the main method, insert statements\
    \ to output a number with group separators\nNumber nf = NumberFormat.getNumberInstance();\n\
    System.out.println(\"\\nNumber: \" + nf.format(123456789) );\n\nAdd statements\
    \ to output a number with a currency sign\nNumberFormat cf = NumberFormat.getCurrencyInstance();\n\
    System.out.println(\"\\nCurrency: \" + cf.format(1234.50) );\n\nAdd statements\
    \ to output a number with a percent sign\nNumberFormat pf = NumberFormat.getPercentInstance();\n\
    System.out.println(\"\\nPercent: \" + pf.format(0.75f) );\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_132_0.png)\n\
    \nA statement can address a class that has not been imported by using its full\
    \ package address - as seen here in the statement creating a LocalDateTime object.\n\
    \nAdd a statement creating a current LocalDateTime object\njava.time.LocalDateTime\
