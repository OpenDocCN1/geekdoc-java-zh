    \ Delta\n\nItem: Alpha\nItem: Bravo\nItem: Charlie\n\nC:\\MyJava> \n```\n\n# Managing\
    \ dates\n\nThe java.time package contains a class named LocalDateTime with useful\
    \ methods to extract specific fields from a LocalDateTime object that describe\
    \ a particular point in time. These can be made available to a program by importing\
    \ the specific class with import java.time.LocalDateTime; or by importing all\
    \ classes in this package using the wildcard with import java.time.*;\n\nA new\
    \ LocalDateTime object can be created with fields describing the current date\
    \ and time using its now() method. The fields are initialized from the system\
    \ clock for the current locale.\n\nThe value within an individual field can be\
    \ retrieved using an appropriate method of the LocalDateTime object. For example,\
    \ the value of the year field can be retrieved using its getYear() method. Similarly,\
    \ any field can be changed using an appropriate method of the LocalDateTime object\
    \ to specify a replacement value. For example, the value of the year field can\
    \ be changed by specifying a new year value as an argument to its withYear() method.\n\
    \n- Start a new program that imports the functionality of all methods in the java.time.LocalDateTime\
    \ class import java.time.LocalDateTime;\n\n- Add a class named “DateTime” containing\
    \ the standard main method class DateTime {\n public static void main ( String\
    \ [] args ) {\n }\n\n- Between the curly brackets of the main, insert a statement\
    \ to create a current LocalDateTime object date = LocalDateTime.now();\n\n- Output\
    \ the current date and time details System.out.println(\"\\nit now \" + date);\n\
    \n- Increment the year, and output the revised date and time date = date.withYear(\
    \ 2019 );\nSystem.out.println(\"\\nDate is now \" + date);\n\n# cont'd\n\nOutput\
    \ individual LocalDateTime fields of the revised date String fields = \"\\nYear:\"\
    \ + \"\\t\" + date.getYear();\n\nfields += \"\\nMonth:\" + \"\\t\" + date.getMonth();\n\
    \nfields += \"\\nMonthNumber:\" + \"\\t\" + date.getMonthValue();\n\nfields +=\
    \ \"\\nDay:\" + \"\\t\" + date.getDayOfWeek();\n\nfields += \"\\nDayNumber:\"\
    \ + \"\\t\" + date.getDayOfMonth();\n\nfields += \"\\nDay Number Of Year:\" +\
    \ \"\\t\" + date.getDayOfYear();\n\nfields += \"\\nHour(0-23):\" + \"\\t\" + date.getHour();\n\
    fields += \"\\nMinute:\" + \"\\t\" + date.getMinute();\n\nfields += \"\\nSecond:\"\
    \ + \"\\t\" + date.getSeconds();\n\nSystem.out.println(fields );\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_130_0.png)\n\
    \nConcatenating a String like this means the program makes one call to println()\
    \ to output field – this is more efficient than calling println() many times to\
    \ output individual field. Save the program as LocalDateTime.java then compile\
    \ and run the program to see the output\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_130_1.png)\n\
    \n```\nJava easy steps:\nC:\\MyJava> javac LocalDateTime.java\nC:\\MyJava> java\
    \ LocalDateTime\nDate is now 2017-09-22T15:55:13.35836200\nYear: 2019\nMonth:\
    \ SEPTEMBER\nDay: SUNDAY\nDay: 22\nNumber Of Year: 265\nHour(0-23): 15\nMinute:\
    \ 5\nSecond: 13\nC:\\MyJava>\n```\n![](img/ab47fc8e240585a2e70c709b4ee10a72_130_2.png)\n\
    \nYou can alternatively use the ZonedDateTime class instead of LocalDateTime if\
    \ you also require a time zone.\n\n# Formatting numbers\n\nJava contains a package\
    \ named java.text that provides useful classes for formatting numbers and currency.\
    \ The package can be made available to a program by including an import statement\
    \ at the very beginning of the file. This can use the wildcard character to mean\
    \ \"all classes\" in the statement import java.text.*; Alternatively, specific\
    \ classes can be imported by name.\n\nThe java.text package has a class named\
    \ \"NumberFormat\", which has methods that can be used to format numerical values\
    \ for output – adding group separators, currency signs, and percentage signs.\
    \ The method used to create a new NumberFormat object determines its formatting\
    \ type – getCurrencyInstance() for currency signs, and getPercentInstance() for\
    \ percentage signs. Formatting is applied by specifying the numerical value to\
    \ be formatted as the argument to the format() method of the NumberFormat object.\n\
    \nThe java.time package has a DateTimeFormatter class that can be used to format\
    \ java.time dates and times. A DateTimeFormatter object contains a formatter pattern\
    \ that is specified as string argument to its ofPattern() method. The formatter\
    \ comprises letters, defined in the Java documentation, and your choice of separators.\
    \ \"M/d/y\" specifies the month, day, and year, separated by slashes. The format\
    \ is applied by specifying the formatter as the argument to the format() method\
    \ of a java.time date and time object.\n\n- 1. Start a new program that imports\
    \ the functionality of all methods of the NumberFormat class in the java.text\
    \ package and all methods of the DateTimeFormatter class in the java.time.format\
    \ package\nimport java.text.NumberFormat;\nimport java.time.format.DateTimeFormatter;\n\
    \n- 2. Add a class named \"Formats\" containing the standard main method class\
    \ Formats {\n\npublic static void main ( String [] args) {\n}\n}\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_131_0.png)\n\
    \nThe java.time.format package was introduced in Java 8 to make it easier to specify\
