    MyJava> javac Multi.java\nC:\\MyJava> java Multi\nThis is a local variable in\
    \ the Multi class\nThis is a global variable of the Data class\nThis is a global\
    \ method of the Data class\nC:\\MyJava> _\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_104_2.png)\n\
    \nThe public keyword allows access from any other class, but default access only\
    \ allows access from classes in the same package.\n\n# Extending an existing class\n\
    \nA class can inherit the features of another class using the extends keyword\
    \ in the class declaration to specify the name of the class from which it should\
    \ inherit. For example, the declaration class Extra extends Base inherits from\
    \ the Base class.\n\nThe inheriting class is described as the \"sub\" class, and\
    \ the class from which it inherits is described as the \"super\" class. In the\
    \ example declaration above, the Base is the super class and the Extra class is\
    \ the sub class.\n\nMethods and variables created in a super class can generally\
    \ be treated as if they existed in the sub class provided they have not been declared\
    \ with the private keyword, which denies access from outside.\n\nA method in a\
    \ sub class will override a method that exists in its super class unless their\
    \ arguments differ. The method in the super class may be explicitly addressed\
    \ using its class name and dot. For example, SuperClass.run().\n\nIt should be\
    \ noted that a catch statement in a method within a super class does not catch\
    \ exceptions that occur in a sub class - the calling statement must be enclosed\
    \ within its own catch statement to catch those exceptions.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_105_0.png)\n\
    \n- Start a new class named \"SuperClass\"\n```java\nclass SuperClass { }\n```\n\
    \n- Between the curly brackets of the class, add a method that outputs an identifying\
    \ String\n```java\npublic static void hello()\n{\n    System.out.println(\"Hello\
    \ from the Super Class\");\n}\n```\n\n- Add a second method that attempts to output\
    \ a passed argument, save the file as SuperClass.java\n```java\npublic static\
    \ void echo(String arg)\ntry{\n    System.out.println(\"You entered: \" + arg);\n\
    }catch(Exception e) {\n    System.out.println(\"Argument required\");\n}\n```\n\
    \n...cont'd\n\nStart a new program named \"SubClass\" that extends the SuperClass\n\
    ```java\nclass SubClass extends SuperClass\n{\n    public static void main ( String[]\
    \ args ) {\n}\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_106_0.png)\n\n\
    After the main method, add a method that outputs an identifying String, overriding\
    \ the inherited method of the same name\n```java\npublic static void hello()\n\
    {\n    System.out.println(\"Hello from the Sub Class \");\n}\n```\n\nBetween the\
    \ curly brackets of the main method, insert a call to the overriding method and\
    \ then call the method of the same name in the super class\n```java\nhello();\n\
    SuperClass.hello();\n```\n\nAdd a call to the other inherited method echo(args[0]);\n\
    \nSave the program as SubClass.java then compile and run the program without a\
    \ command argument\n\n```\njava in easy steps.\nC:\\MyJava> javac SubClass.java\n\
    C:\\MyJava> java SubClass\nHello from the Sub Class\nHello from the Super Class\n\
    Exception in thread \"main\" java.lang.ArrayIndexOutOfBoundsException: 0\n   \
    \ at SubClass.main(SubClass.java:7)\nC:\\MyJava> _\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_106_1.png)\n\
    \nYou can find more information about catching exceptions on page 76.\n\nEdit\
    \ SubClass.java to enclose the method in Step 7, to place it within its own catch\
    \ statement to catch exceptions, recompile and re-run the program to see the problem\
    \ resolved\n\n# Creating an object class\n\nReal-world objects are all around\
    \ us, and they each have attributes and behaviors that we can describe:\n\n- Attributes\
    \ describe the features that an object has\n- Behaviors describe actions that\
    \ an object can perform\n\nFor example, a car might be described with attributes\
    \ of \"red\" and \"coupe\", along with an \"acceler\" behavior.\n\nThese features\
    \ could be represented in Java programming with a Car class containing variable\
    \ properties of color and bodyType, along with an accelerate() method.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_107_0.png)\n\
    \nJava is said to be an Object Oriented Programming (OOP) language because it\
    \ makes extensive use of object attributes and behaviors to perform program tasks.\n\
    \nObjects are created in Java by defining a class as a template from which different\
    \ copies, or \"instances\", can be made.\n\nEach instance of the class can be\
    \ customized by assigning attribute values and behaviors to describe that object.\n\
    \nThe Car class is created as a class template in the steps described – with the\
    \ default attributes and behavior above. An instance of the Car class is created\
    \ in the steps described on page 109, inheriting the same default attributes and\
    \ behavior.\n\n...cont'd\n\nStart a new template class named \"Car\"\n```java\n\
    class Car\n{\n}\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_108_0.png)\n\n\
    FirstObject.java\n\nBetween the curly brackets of the Car class, declare and initialize\
    \ two global String constants describing attributes\n```java\npublic final static\
    \ String color = \"Red\"\npublic final static String bodyType = \"Coupe\";\n```\n\
    \nAdd a global method describing a behavior\n```java\npublic static String accelerate()\n\
    {\n  String motion = \"Accelerating...\"\n  return motion;\n}\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_108_1.png)\n\
    \nThe static keyword declares class variables and class methods - in this case,\
    \ as members of the Car class.\n\nAfter the Car class, start a new program class\
    \ named \"FirstObject\" containing the standard main method\n```java\npublic static\
    \ void main (String[] args) {\n}\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_108_2.png)\n\
    \nBetween the curly brackets of the main method, insert statements to output the\
    \ value of each Car attribute and call its behavior method\n```java\nSystem.out.println(\"\
    Paint is \" + Car.color);\nSystem.out.println(\"Style is \" + Car.bodyType);\n\
    System.out.println(Car.accelerate());\n```\n\nObject classes are normally created\
    \ before the program class containing the main method.\n\nSave the program as\
    \ FirstObject.java then compile and run the program to see the output\n\n```\n\
    java in easy steps.\nC:\\MyJava> javac FirstObject.java\nC:\\MyJava> java FirstObject\n\
    Paint is Red\nStyle is Coupe\nAccelerating...\n```\n"
  mdcn: "\n\n# 创建多个类\n\n就像程序可以有多个方法一样，大型程序可能由几个类组成——每个类都提供特定的功能。这种模块化的格式通常比将整个程序写在单个类中要好，因为它使得调试变得更简单，并提供了更好的灵活性。\n\
    \n在声明中出现的 `public` 关键字是一个“访问修饰符”，它决定了某个项对其他类的可见性。它可以在类声明中使用，以显式确保该类对任何其他类都可见。如果省略它，默认的访问控制级别允许从其他本地类访问。然而，`public`\
    \ 关键字必须与程序的 main 方法一起使用，以便该方法对编译器可见。\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_103_0.png)\n\
    \n- 启动一个名为 \"Multi\" 的新程序，包含标准的 main 方法 – 照常包含 `public` 关键字\n\n```java\nclass\
