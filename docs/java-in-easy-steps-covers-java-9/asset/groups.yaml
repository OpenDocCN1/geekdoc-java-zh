    \ example, the syntax dailyRecord.length returns a 52 - the size of the first\
    \ dimension. To access the size of the second dimension, the syntax dailyRecord[0].length\
    \ returns the value of seven.\n\n| | [0] | [1] |\n|---|---|-|\n| [0] | 1 | 4 |\n\
