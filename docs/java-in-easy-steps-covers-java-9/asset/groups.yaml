    Incorrect password.\") }`\n\n- Save the program as StringComparison.java then\
    \ compile and run the program with various arguments\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_92_0.png)\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_92_1.png)\n\n```\nC:\\MyJava> javac\
    \ StringComparison.java\nC:\\MyJava> java StringComparison\nPassword required.\n\
    C:\\MyJava> java StringComparison BIMBO\nIncorrect password.\nC:\\MyJava> java\
    \ StringComparison BINGO\nPassword accepted.\nC:\\MyJava> _\n```\n\n# Searching\
    \ strings\n\nThe String class within the java.lang package provides startsWith()\
    \ and endsWith() methods to compare portions of a String value. These are especially\
    \ useful to compare a number of String values and select those with common beginnings\
    \ or common endings. When the String section matches the specified argument, the\
    \ method returns true – otherwise, it returns false.\n\nA portion of a String\
    \ value can be copied by stating the position number of the first character to\
    \ be copied as the argument to the substring() method. This will return a substring\
    \ of the original String value, starting at the specified start position and ending\
    \ at the end of the original String.\n\nOptionally, the substring() method can\
    \ take a second argument to specify the position number of the final character\
    \ to be copied. This will return a substring of the original String value, starting\
    \ at the specified start position and ending at the specified position.\n\nA String\
    \ value can be searched to find a character or substring specified as the argument\
    \ to its indexOf() method. Usually, it returns the numeric position of the first\
    \ occurrence of the matched character or substring within the searched String\
    \ value. Where no match is found, the method returns the negative integer value\
