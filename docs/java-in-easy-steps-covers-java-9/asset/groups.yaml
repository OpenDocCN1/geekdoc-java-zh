  - '[PAGE 127]


    # Making array lists


    The java.util package contains a class named ArrayList stores data in an ordered
    "Collection" (resizable sequence) of list elements. This can be made available
    to a program by importing the specific class with import java.util.ArrayList;
    A list may contain duplicate elements, and an ArrayList object useful methods
    that allow manipulation of stored values by specifying their element index number.
    For example, the list''s method get(0) will retrieve the value stored in the first
    element remove(1) will remove the second list element.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_127_0.png)


    Element values can be modified by specifying the index number and new value to
    the list''s set() method. Elements can be added to the list at a particular position
    by specifying the index number and value as arguments to the list''s add(i) method.
    The list expands to accommodate additional elements by moving the element values
    along the index.


    An ArrayList is simply created using the new keyword but, like other Collections,
    the statement must specify which generic type of item list it may contain. Typically,
    a list may contain String items, so ArrayList must have a <String> suffix.


    Collections, as ArrayList, have a forEach() method that iterates over each element
    in the list. This makes it easy to loop through all items contained in the list.


    Each stored list item can be conveniently referenced in turn by specifying a lambda
    expression as the argument to the forEach() method. Lambda expressions are simply
    short, anonymous (unnamed) methods that can be specified in the location they
    are to be executed. They begin with parentheses, to contain any arguments, then
    have a-> character sequence followed by the statement block, with this syntax:


    ```

    ( argument ) -> { statement/s }

    ```


    The data type of arguments can be explicitly declared, or it can be inferred from
    the context -(String x) and can be simply (x). Additionally, the curly brackets
    can be omitted if the lambda expression statement block contains only one statement.


    With a list''s forEach() value of the current element in the iteration can be
    passed to the lambda expression as its argument, then displayed in output by its
    statement.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_127_1.png)


    You can discover how many elements a list currently has by calling its size()
    method.


    Lambda expressions were introduced in Java 8 to enable succinct methods.'
