    The Lotto program begins with import statements to make Swing components and the
    ActionListener interface available.


    # Components


    The program comprises a single panel component containing a label component to
    display an image, a text field component to display output, and a button component
    for user interaction.


    # Constructor


    The Lotto() constructor builds a Simple Swing interface that loads the panel into
    a window frame measuring 260 x 210.


    # Event-handler


    The button''s event-handler method executes an algorithm to select a sequence
    of six unique random numbers in the range of 1-59 for display in the text field
    component.


