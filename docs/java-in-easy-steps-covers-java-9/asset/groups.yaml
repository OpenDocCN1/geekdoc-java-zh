    the text can be determined by specifying a JLabel constant as the argument to
    setVerticalPosition() and setHorizontalPosition() methods of the JLabel object.


    Additionally, a JLabel object can be made to display a ToolTip when the cursor
    hovers over, by specifying a String as the argument to that object''s setToolTipText()
    method.


