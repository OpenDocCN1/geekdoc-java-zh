    \ the standard main method\n```java\npublic static void main ( String[] args )\
    \ {\n\n}\n```\n\nInside the main method, declare and initialize an integer variable\
    \ named num\n```java\nint num = 100;\n```\n\nStart a do while loop to display\
    \ the num variable's current value while it is below 10\n```java\n{\n    System.out.println(\"\
