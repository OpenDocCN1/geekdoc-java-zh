    \ javac and hit Return to reveal the Java compiler options.\n\n```\nJava in easy\
    \ steps\n:\\> cd MyJava\n:\\MyJava> javac Hello.java\n:\\MyJava>\n```\n\nIf the\
    \ javac compiler discovers errors in the code it will halt and display a helpful\
