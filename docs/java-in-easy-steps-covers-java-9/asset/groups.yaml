    \ JAR 文件时需要 jar 文件扩展名。\n\n```bash\nmike@Desktop-PC:~/Desktop\nmike@Desktop-PC:~/Desktop\
    \ java -jar Lotto.jar\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_174_1.png)\n\
    \n或者，双击或右键点击 Lotto.jar 文件图标，并选择用“打开方式”与 Java 运行时打开\n\n你想如何打开此文件？\n保持此应用\n\n将 JRE\
