    \n```\nnum = 8 + 4 * 2;\n```\n\nWorking left to right 8 + 4 = 12, and 12 * 2 =\
    \ 24, so num = 24. But working to right left 2 * 4 = 8, and 8 + 8 = 16, so num\
    \ = 16.\n\nThe Java programmer can explicitly specify which operation should be\
    \ executed by adding parentheses to which operator has precedence. In this case,\
    \ (8 + 4) * 2 ensures that the addition is performed before the multiplication\
    \ – so the result is 24, not 16. Conversely, 8 * (4 * 2) performs the multiplication\
    \ first – so the result is 16, not 24.\n\nWhere parentheses do not explicitly\
