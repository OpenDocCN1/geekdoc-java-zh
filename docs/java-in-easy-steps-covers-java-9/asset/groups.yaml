    The parentheses require the number as its first argument and the power by which
    it is to be raised as its second argument. The Math.sqrt() method returns the
    square root of the number specified as its sole argument. Both methods return
    a double type.


    +   Start a new program named "Power" containing the standard main method class
    Power

    {

    public static void main (String[] args) {

    }


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_84_0.png)


    +   Inside the main method, declare and initialize an int variable from a passed
    command line argument int num = Integer.parseInt(args[0]);


    +   Perform mathematical calculations, casting the results into more int variables
    int square = (int) Math.pow(num, 2);

    int cube = (int) Math.pow(num, 3);

    int sqrt = (int) Math.sqrt(num);


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_84_1.png)


    +   Output the results of the calculations System.out.println(num + " squared
    is " + square);

    System.out.println(num + " cubed is " + cube);

    System.out.println("Square root of " + num + " is " + sqrt);


    Both these examples could be improved by adding try catch statement blocks to
    anticipate user errors - see page 76 for details.


    +   Save the program as Power.java then compile and run the program to see the
    output


    ```

    Java in easy steps

    :\MyJava> javac Power.java


    :\MyJava> java Power 9

    9 squared is 81

    9 cubed is 729

    Square root of 9 is 3

    C:\MyJava> _

    ```'
- md: "\n## Rounding numbers\n\nThe Math class within the java.lang package provides\
    \ three methods to round floating-point numbers to the nearest integer. Simplest\
    \ of these is the Math.round() method that rounds a number stated as its argument\
    \ up, or down, to the closest integer.\n\nThe Math.floor() method rounds down\
    \ to the closest integer below, and Math.ceil() rounds up to the closest integer.\n\
    \nWhile the Math.round() method returns an int data type, both Math.floor() and\
    \ Math.ceil() methods return a double data type.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_85_0.png)\n\
    \n- 1 Start a new program named “Round” containing the standard main method Round\n\
    ```java\nclass Round {\n    public static void main (String[] args) {\n    }\n\
    }\n```\n\n- 2 Inside the main method, declare and initialize a float variable\n\
    `float num = 7.25f;`\n\n- 3 Output the rounded float value as an int value\n`System.out.println(num+\"\
    \ rounded is \"+Math.round(num)+\");\");`\n\n- 4 Output the rounded float value\
    \ as double values\n`System.out.println(num+\" floored is \"+Math.floor(num)+\"\
    );\");`\n`System.out.println(num+\" ceiling is \"+Math.ceil(num)+\");\");`\n\n\
    ![](img/ab47fc8e240585a2e70c709b4ee10a72_85_1.png)\n\nBy default, Math.round()\
    \ will round up – so 7.5 rounded up to 8.\n\n- 5 Save the program as Round.java\
    \ then compile and run the program to see the output\n\n```\nC:\\MyJava> javac\
    \ Round.java\nC:\\MyJava> java Round\n7.25 rounded is 7\n7.25 floored is 7.0\n\
    7.25 ceiling is 8.0\nC:\\MyJava>_\n```\n\nThe Math within the java.lang package\
    \ provides two methods to compare two numerical values. Math.max() method and\
    \ the Math.min() method each require two numbers to be stated as their arguments.\
    \ Math.max() will return the greater number and Math.min() will return the smaller\
    \ number.\n\nThe numbers to be compared can be of any numerical data type, but\
    \ the result will be returned as a double data type.\n\n- Start a new program\
    \ named “Compare” containing the standard main method\n```java\nclass Compare\
    \ {\n    public static void main (String[] args) {\n    }\n}\n```\n\n- Inside\
    \ the main method, declare and initialize a float variable and an int variable\n\
    `float num1 = 24.75f;`\n`int num2 = 25;`\n\n- Output the greater value\n`System.out.println(\"\
    Most is \" + Math.max(num1, num2));`\n\n- Output the lesser value\n`System.out.println(\"\
    Least is \" + Math.min(num1, num2));`\n\n- Save the program as Compare.java then\
    \ compile and run the program to see the output\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_86_0.png)\n\
    \n```\nC:\\MyJava> javac Compare.java\nC:\\MyJava> java Compare\nMost is 25.0\n\
    Least is 24.75\nC:\\MyJava> _\n```\n\n## Generating random numbers\n\nThe Math\
    \ class within the java.lang package provides the ability to generate random numbers\
    \ with its Math.random() method, which returns a double precision random number\
    \ between 0.0 and 0.999. Multiplying the random number will specify a wider range.\
    \ For example, multiplying by 10 will create a random number in the range of 0.0\
    \ to 9.999. Now rounding the random number with Math.ceil() will ensure it falls\
    \ within the range of 1-10 inclusive.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_87_0.png)\n\
    \n- Start a new program named \"Random\" containing the standard main method Random\n\
    ```java\nclass Random {\n    public static void main (String[] args) {\n}\n```\n\
    Inside the main method, assign a random number to a float variable, `float random\
    \ = (float) Math.random();` `System.out.println(\"Random number: \" + random);`\n\
    \n- Assign a multiplication of the random number to a second float variable, and\
    \ output its value `float multiplied = random * 10;` `System.out.println(\"Multiplied\
    \ number: \" + multiplied);`\n\n- Assign a rounded integer of the multiplied random\
    \ number to an int variable, and output its value `int randomInt = (int) Math.ceil(multiplied);`\
    \ `System.out.println(\"Random Integer: \" + randomInt);`\n\nSave the program\
    \ as Random.java then compile and run the program to see the output\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_87_1.png)\n\
    \nThe Lottery program described opposite combines all three steps from this example\
    \ into a single statement.\n\n```\nJava in easy steps\nC:\\MyJava> javac Random.java\n\
    C:\\MyJava> java Random\nRandom number: 0.11486274\nMultiplied number: 1.1486274\n\
    Random Integer: 2\nC:\\MyJava> _\n```\n\n## ...cont'd\n\nThe Math within the java.lang\
    \ package provides two methods to compare two numerical values. ... (Note: This\
    \ section seems to repeat or transition content).\n\n- Start a new program named\
    \ \"Lottery\" containing the standard main method Lottery\n```java\nclass Lottery\
    \ {\n    public static void main (String[] args) {\n}\n```\n![](img/ab47fc8e240585a2e70c709b4ee10a72_88_0.png)\n\
    \n- Inside the main method, create an int array `int[] nums = new int[60];`\n\
    - Shuffle the values `int r = (int)(Math.random() * 60);`\n- Output the values\
    \ `System.out.println(nums[r]);`\n- Save the program as Lottery.java then compile\
    \ and run the program to see the output\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_88_1.png)\n\
    \n## Managing strings\n\nIn Java programming, a String is a collection of characters\
    \ enclosed within quotation marks. So, these are valid strings:\n\n```java\nString\
    \ txt1 = \"My First\";\n```\n\n```java\nString txt2 = \"\";\n```\n\n```java\n\
    String txt3 = \"2\";\n```\n\n```java\nString txt4 = \"null\";\n```\n\nThe empty\
    \ quotes txt2 initialize the variable as an empty String. The null keyword, which\
    \ normally represents the absence of any value, is simply a String when enclosed\
    \ within quotes.\n\nThe String class is part of java.lang and also provides a\
    \ length() method that will return the size of a String, much like the length\
    \ of an array. Each String is an instance of the String class.\n\nThe String class\
    \ within the java.lang package also provides an alternative to the + concatenation\
    \ operator for joining String. Its concat() method requires a single argument\
    \ specifying the second String to be appended. In use it is tacked onto the variable\
    \ name of the first String using dot notation. For example, append txt2 onto txt1\
    \ using txt1.concat( txt2 ).\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_89_0.png)\n\
    \nArray.length is a property but String.length() is a method – so it must have\
    \ trailing parentheses.\n\nStart a new program named \"StringLength\"\n```java\n\
    class StringLength {\n    public static void main (String[] args) {\n}\n}\n```\n\
    ![](img/ab47fc8e240585a2e70c709b4ee10a72_90_0.png)\n\n- Inside the main method,\
    \ create and initialize two String variables\n`String lang = \"Java\";`\n`String\
    \ series = \" in easy steps\";`\n\n- Add another String variable and assign the\
    \ concatenated value of the other two String variables\n`String title = lang.concat(\
    \ series );`\n\n- Output the concatenated String within quotation marks, together\
    \ with its size\n`System.out.print(\"\\\"\" + title + \"\\\" \");`\n`System.out.println(title.length()\
    \ + \" characters\");`\n\nSave the program as StringLength.java then compile and\
    \ run the program to see the output\n\n```\njava in easy steps\nC:\\MyJava> javac\
    \ StringLength.java\nC:\\MyJava> java StringLength\n\"Java in easy steps\" has\
    \ 18 characters\nC:\\MyJava> _\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_90_1.png)\n\
    \nSpaces are part of the String so they are included in the character count -\
    \ but the quotation marks are not included.\n"
  mdcn: "\n\n## 数字的舍入\n\njava.lang 包中的 `Math` 类提供了三种方法将浮点数舍入到最近的整数。其中最简单的是 `Math.round()`\
    \ 方法，它将作为参数的数字向上或向下舍入到最近的整数。\n\n`Math.floor()` 方法向下舍入到下方的最近整数，而 `Math.ceil()`\
    \ 方法则向上舍入到最近整数。\n\n虽然 `Math.round()` 方法返回 `int` 数据类型，但 `Math.floor()` 和 `Math.ceil()`\
    \ 方法都返回 `double` 数据类型。\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_85_0.png)\n\
    \n- 1 创建一个名为“Round”的新程序，其中包含标准的 main 方法 Round\n```java\nclass Round {\n    public\
    \ static void main (String[] args) {\n    }\n}\n```\n\n- 2 在 main 方法内部，声明并初始化一个\
    \ float 变量\n`float num = 7.25f;`\n\n- 3 将舍入后的 float 值作为 int 值输出\n`System.out.println(num+\"\
    \ rounded is \"+Math.round(num)+\");\");`\n\n- 4 将舍入后的 float 值作为 double 值输出\n\
    `System.out.println(num+\" floored is \"+Math.floor(num)+\");\");`\n`System.out.println(num+\"\
    \ ceiling is \"+Math.ceil(num)+\");\");`\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_85_1.png)\n\
    \n默认情况下，`Math.round()` 会向上舍入——所以 7.5 舍入后为 8。\n\n- 5 将程序保存为 Round.java，然后编译并运行程序查看输出\n\
    \n```\nC:\\MyJava> javac Round.java\nC:\\MyJava> java Round\n7.25 rounded is 7\n\
    7.25 floored is 7.0\n7.25 ceiling is 8.0\nC:\\MyJava>_\n```\n\njava.lang 包中的 `Math`\
    \ 类提供了两个方法来比较两个数值。`Math.max()` 方法和 `Math.min()` 方法各需要两个数字作为其参数。`Math.max()` 将返回较大的数字，而\
    \ `Math.min()` 将返回较小的数字。\n\n比较的数字可以是任意数值数据类型，但结果将以 `double` 数据类型返回。\n\n- 创建一个名为“Compare”的新程序，其中包含标准的\
    \ main 方法\n```java\nclass Compare {\n    public static void main (String[] args)\
