    \nArrays can be created to store multiple sets of element values, each having\
    \ their own index dimension. Individual values are addressed in a multi-dimensional\
    \ array using the appropriate index numbers of each dimension. For example, num[1][3].\n\
    \nA two-dimensional array might be used to record an integer value for each day\
    \ of a business year, organized by week. This requires an array of 52 elements\
    \ (one per week) which will have an array of seven elements (one per day). Its\
    \ declaration looks like this:\n\n```java\nint[][] dailyRecord = new int[52][7];\n\
    ```\n\n\"This array of arrays\" provide an element for each business day. Values\
    \ are assigned to a multi-dimensional array by stating the appropriate index numbers\
    \ of each dimension. With the example above, for instance, a value can be assigned\
    \ to the first day of the sixth week like this:\n\n```java\ndailyRecord[5][0]\
    \ = 5000 ;\n```\n\nEach array has its length property that can be accessed by\
    \ specifying the dimension required. For the example, the syntax dailyRecord.length\
    \ returns a 52 - the size of the first dimension. To access the size of the second\
    \ dimension, the syntax dailyRecord[0].length returns the value of seven.\n\n\
    | | [0] | [1] |\n|---|---|---||\n| [0] | 1 | 4 |\n| [1] | 2 | 5 |\n| [2] | 3 |\
    \ 6 |\n\nTwo-dimensional arrays are often used to store grid coordinates, where\
