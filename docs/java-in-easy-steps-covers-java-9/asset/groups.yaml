- md: "\n# Summary\n\n- The **if** keyword performs a conditional test to evaluate\
    \ an expression for a Boolean value of **true** or **false**.\n- An **if** statement\
    \ block can contain one or more statements, which are only executed when the test\
    \ expression returns **true**.\n- The **else** keyword specifies alternative statements\
    \ to execute when the test performed by the **if** keyword returns **false**.\n\
    - Combined **if else** statements enable a program to proceed by the process of\
    \ conditional branching.\n- A **switch** statement can often provide an elegant\
    \ solution to unwieldy **if else** statements by offering **case** options.\n\
    - Each **case** option can be terminated by the **break** keyword so only statements\
    \ associated with that option will be executed.\n- The **default** keyword can\
    \ specify statements to be executed when all **case** options return **false**.\n\
    - A loop repeatedly executes the statements it contains until a tested expression\
    \ returns **false**.\n- The parentheses that follow the **for** keyword specify\
    \ the loop counter initializer, test expression, and counter updater.\n- Statements\
    \ in a **while** loop and a **do while** loop must change a value used in their\
    \ test expression to avoid an infinite loop.\n- The test expression is evaluated\
    \ at the start of **for** loops and **while** loops – before the first iteration\
    \ of the loop.\n- The test expression is evaluated at the end of **do while**\
    \ loops – after the first iteration of the loop.\n- A loop iteration can be skipped\
    \ using the **continue** keyword.\n- A loop can be terminated using the **break**\
    \ keyword.\n- Nested inner loops can use labels with the **break** and **continue**\
    \ keywords to reference the outer loop.\n\n# 4 Directing values\n\nThis chapter\
    \ demonstrates how to direct data values using various java programming constructs\n\
    \n- 62 Casting type values\n- 64 Creating variable arrays\n- 66 Passing an argument\n\
    - 68 Passing multiple arguments\n- 70 Looping through elements\n- 72 Changing\
    \ element values\n- 74 Adding array dimensions\n- 76 Catching exceptions\n- 78\
    \ Summary\n\n# Casting type values\n\nHandling values in Java programming requires\
    \ correct data type to be closely observed to avoid compiler errors. For example,\
    \ sending a float type value to a method that requires an int type value will\
    \ produce a compiler error. This means it is often necessary to convert a value\
    \ to another data type before it can be processed.\n\nNumeric values can be easily\
    \ \"cast\" (converted) into another data type using this syntax:\n\n```\n(data-type\
    \ ) value\n```\n\nSome loss of precision will occur when casting float pointing\
    \ values into an int data type, as the number will be truncated at the decimal\
    \ point. For example, casting a float value of 9.9 into an int variable produces\
    \ an integer value of nine.\n\nInterestingly, character values of the char data\
    \ type can automatically be used as int values because each have a unique integer\
    \ representation. This is their numeric code value in the ASCII character set,\
    \ which is supported by Java. The uppercase letter A, for instance, has the code\
    \ of 65.\n\nNumeric values can be converted to the String data type using the\
    \ toString() method of that value's data class. This takes the numeric value as\
    \ its argument, within the parentheses. For example, convert an int num variable\
    \ to a String with Integer.toString(num). Similarly, convert a float num variable\
    \ to a String with Float.toString(num). In practice, this is not always required\
    \ because Java automatically concatenates variables to a String if one of the\
    \ variables is a String value.\n\nMore frequently, you will want to convert a\
