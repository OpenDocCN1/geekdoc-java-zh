    \ archive (JAR) should use a ClassLoader to specify an image source.\n\nA JLabel\
    \ object displays non-interactive text and image content.\n\nEditable text can\
    \ be displayed in JField and JTextArea fields.\n\nA JScrollPane object provides\
    \ scrollbars for a JTextArea field.\n\nItems for selection can be displayed with\
    \ JComboBox and JList components.\n\nA ButtonGroup object logically groups a number\
    \ of JRadioButton components so only one can be selected.\n\nSpecific RGB colors\
