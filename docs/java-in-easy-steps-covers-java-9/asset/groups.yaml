    # Managing strings


    In Java programming, a String is zero or more characters enclosed within quotation
    marks. So, these are all valid String values:


    ```

    String txt1 = "My First String" ;

    ```


    ```

    String txt2 = "" ;

    ```


    ```

    String txt3 = "2" ;

    ```


    ```

    String txt4 = "null" ;

    ```


    The empty quotes of txt2 initialize the variable as an empty String value. The
    numeric value assigned to txt3 is a String representation of the number. The Java
    null keyword, which normally represents the absence of any value, is simply a
    String literal when it is enclosed within quotes.


    Essentially, a String is a collection of characters; each character containing
    its own data – just like elements in a defined array. It is, therefore, logical
    to regard a String as an array of characters and apply array characteristics when
    dealing with String values.


    The String class is part of the fundamental java.lang package and also provides
    a length() method that will return the size of a String, much like the length
    property of an array. Each String variable is created as an "instance" of the
    String class so its methods can be used by tacking their name onto the variable
    name using dot notation. For example, the syntax to return the size of a String
    variable named txt is txt.length().


    The String class within the java.lang package also provides an alternative to
    the + concatenation operator for joining String values. Its concat() method requires
    a single argument specifying the second String to be appended. In use it is tacked
    onto the variable name of the first String using dot notation. For example, append
    txt2 onto txt1 using txt1.concat( txt2 ).


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_89_0.png)


    Array.length is a property but String.length() is a method – so it must have trailing
    parentheses.'
