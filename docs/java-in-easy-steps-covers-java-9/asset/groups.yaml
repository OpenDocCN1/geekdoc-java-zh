    # Preface


    The creation of this book has provided me, Mike McGrath, a welcome opportunity
    to update my previous books on Java programming with the latest techniques. All
    examples I have given in this book demonstrate Java features supported by current
    compilers on both Windows and Linux operating systems, and the book''s screenshots
    illustrate the actual results produced by compiling and executing the code, or
    by implementing code snippets in the Java shell.


    # Conventions in this book


    In order to clarify the code listed in the steps given in each example, I have
    adopted certain colorization conventions. Components of the Java language itself
    are colored blue; programmer-specified names are red; and string values are black;
    and comments are grey, like this:


    ```java

    // Store then output a string value.

    String message = "Welcome to Java programming!";

    System.out.println(message);

    ```


    Additionally, in order to identify each source code file described in the steps,
    a colored icon and file name appears in the margin alongside the steps, like these:


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_7_0.png)


    # Grabbing the source code


    For convenience, I have placed source code files from the examples featured in
    this book into a single ZIP archive. You can obtain the complete archive by following
    these easy steps:


    - Browse to www.easysteps.com then navigate to Free Resources and choose the Downloads
    section

    - Find Java in easy steps, 6th Edition in the list, then click on the hyperlink
    entitled All Code Examples to download the archive

    - Now, extract the archive contents to any convenient location on your computer


    I hope you enjoy discovering the programming possibilities of Java and have as
    much fun with it as I did in writing this book.


    Mike McGrath


    # 1 Getting started


    Welcome to the exciting world of Java programming. This chapter shows how to create
    and execute simple Java programs, and demonstrates how to store data within programs.


    - Introduction 8

    - Installing the JDK 10

    - Writing a first Java program 12

    - Compiling & running programs 14

    - Creating a variable 16

    - Recognizing data types 18

    - Creating constants 20

    - Adding comments 21

    - Troubleshooting problems 22

    - Summary 24


    # Introduction


    The Java™ programming language was first developed in 1990 by an engineer at Sun
    Microsystems named James Gosling. He was unhappy using the C++ programming language
    so he created a new language he named "Oak", after the oak tree that he could
    see from his office window.


    As the popularity of the Wide Web grew, Sun recognized that Gosling''s language
    could be developed for the internet. Consequently, Sun renamed the language "Java"
    (simply because that name sounded cool) and made it freely available in 1995.
    Developers around the world quickly adopted this exciting new language, and because
    of its modular design, were able to create new features that could be added to
    the core. The most endearing additional features were retained in subsequent releases
    of Java as it developed into the comprehensive version of today.


    The essence of Java is a library of files called "classes", which each contain
    small pieces of ready-made code. Any of these classes can be incorporated into
    a new program, like bricks in a wall, so that only a relatively small amount of
    new code ever needs to be written to complete the program. This saves the programmer
    a vast amount of time, and explains the high popularity of Java programming. Additionally,
    this modular arrangement makes it easier to identify any errors than in a single
    large program.


    Java technology is both a programming language and a platform. In Java programming,
    the source code is first written as human-readable plain text files ending with
    the .java extension. These are compiled into machine-readable .class files by
    the javac compiler. The java interpreter can then execute the program with an
    instance of the Java Virtual Machine (Java VM):


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_9_0.png)


    The icon pictured above indicates a new or enhanced feature introduced with the
    latest version of Java.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_9_1.png)


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_9_2.png)


    As the Java VM is available on many different operating systems, the same .class
    files are capable of running on Windows, Linux and Mac operating systems – so
    Java programmers theoretically enjoy the cross-platform ability to "write once,
    run anywhere".

