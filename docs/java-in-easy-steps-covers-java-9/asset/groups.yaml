- md: "\n# Summary\n\n- One or more import statements can be included at the start\
    \ of a program to make the functionality of other classes available.\n- An import\
    \ statement can import all classes in a package with a wildcard character, or\
    \ individual classes by name.\n- The java.io package has classes that are designed\
    \ to handle input and output procedures.\n- A File object can be used to access\
    \ files and directories.\n- The InputStreamReader object decodes bytes into characters,\
    \ and the BufferedReader reads its decoded characters.\n- A FileReader object\
    \ can be used to decode text bytes into characters for reading by a BufferedReader\
    \ object.\n- A FileWriter object and BufferedWriter object can create and update\
    \ text files.\n- The java.util package contains utilities for handling collections\
    \ of data, such as array manipulation with its Arrays class.\n- The java.util\
    \ package also contains an ArrayList class that has methods to easily manipulate\
    \ sequenced list items.\n- ArrayList object is a Collection that must specify\
    \ the generic type of item that list may contain, such as <String>.\n- A lambda\
    \ expression is an anonymous method that can be specified where it is to be executed.\n\
    - The java.time package contains a LocalDateTime class that provides fields for\
    \ date and time components.\n- The java.text package contains a NumberFormat class\
    \ that can format numbers and currency.\n- The java.time.format package contains\
    \ a DateTimeFormatter class that can specify patterns to format dates and times.\n\
    \n# 8 Building interfaces\n\nThis chapter demonstrates how to use Java Swing components\
    \ to create a graphical program interface.\n\n- 134 Creating a window\n- 136 Adding\
    \ push buttons\n- 138 Adding labels\n- 140 Adding text fields\n- 142 Adding item\
    \ selectors\n- 144 Adding radio buttons\n- 146 Arranging components\n- 148 Changing\
    \ appearance\n- 150 Summary\n\n## Creating a window\n\nPrograms can provide a\
    \ graphical user interface (GUI) using the Swing components of the Java library.\
    \ The java.swing package contains classes to create a variety of components using\
    \ the style of the native operating system. These can be made available to a program\
    \ by including the initial statement import javax.swing.*;\n\nA class must be\
    \ created to represent the GUI to which components can be added to the interface.\
    \ This is easily achieved by declaring it a subclass of Swing's JFrame class using\
    \ the extends keyword -- thereby inheriting attributes and behaviors that allow\
    \ the user to move, resize, and close the window.\n\nRemember the letter x in\
    \ java.swing by thinking of JAVA extra.\n\nThe class constructor should include\
    \ statements to set these minimum requirements:\n\n- The title of the window –\
    \ specified as a String argument to the inherited super() method of the JFrame\
    \ class.\n- The size of the window – specified as width and height in pixels as\
    \ arguments to its getSize() method.\n- What to do when the user closes the window\
    \ – specified as a constant argument to its setCloseOperation() method.\n- Display\
    \ the window – specified as a Boolean argument to its setVisible() method.\n\n\
    Additionally, the constructor can add a JPanel container to the window, in which\
    \ smaller components can be added, using the inherited add() method of the JFrame\
    \ class.\n\nBy default, a JPanel container employs a FlowLayout layout manager\
    \ that lays out components in left-to-right lines, wrapping at the right edge\
    \ of the window.\n\nThe steps describe how to create a basic window containing\
    \ a JPanel container with a FlowLayout layout manager. This window is featured\
