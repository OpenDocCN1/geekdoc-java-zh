  - "[PAGE 105]\n\n# Extending an existing class\n\nA class can inherit the features\
    \ of another class using the extends keyword in the class declaration to specify\
    \ the name of the class from which it should inherit. For example, the declaration\
    \ class Extra extends Base inherits from the Base class.\n\nThe inheriting class\
    \ is described as the \"sub\" class, and the class from which it inherits is described\
    \ as the \"super\" class. In the example declaration above, the Base is the super\
    \ class and the Extra class is the sub class.\n\nMethods and variables created\
    \ in a super class can generally be treated as if they existed in the sub class\
    \ provided they have not been declared with the private keyword, which denies\
    \ access from outside the original class.\n\nA method in a sub class will override\
    \ a method that exists in its super class unless their arguments differ. The method\
    \ in the super class may be explicitly addressed using its class name and dot\
    \ notation. For example, SuperClass.run().\n\nIt should be noted that a catch\
    \ statement in a method within a super class does not catch exceptions that occur\
    \ in a sub class - the calling statement must be enclosed within its own catch\
    \ statement to catch those exceptions.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_105_0.png)\n\
    \n+   - Start a new class named \"SuperClass\" class SuperClass { }\n\n+   - Between\
