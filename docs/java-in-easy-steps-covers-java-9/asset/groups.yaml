    \ package has a Font class that can be used to create objects representing a particular\
    \ font name, style, and size.\n\nMultiple JPanel containers can be added to a\
    \ JFrame container using the Container class of the java.awt package to represent\
    \ the content pane of the JFrame.\n\nWhen creating a JPanel object, its argument\
    \ may optionally specify a layout manager.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_151_0.png)\n\
    \n# 9 Recognizing events\n\nThis chapter demonstrates how to create Java program\
    \ event-handlers that respond to user interface actions.\n\n- 152 Listening for\
    \ events\n- 153 Generating events\n- 154 Handling button events\n- 156 Handling\
    \ item events\n- 158 Reacting to keyboard events\n- 160 Responding to mouse events\n\
    - 162 Announcing messages\n- 164 Requesting input\n- 166 Summary\n\n# Listening\
    \ for events\n\nA user can interact with a program that provides a graphical user\
    \ interface (GUI) by performing actions with a mouse, keyboard, or other input\
    \ device. These actions cause \"events\" to occur in the interface, and making\
    \ a program respond to them is known as \"event-handling\".\n\nFor a program to\
    \ recognize user events it needs to have one or more Event interfaces added from\
    \ the java.awt.event package. These can be made available to the class declaration.\n\
    \nMultiple Event interfaces can be included in the class. For example, the most\
    \ common ones are listed in the table below:\n\n| EventListener | Description\
    \ |\n| :--- | :--- |\n| ActionListener | Recognizes action events that occur when\
    \ a button is pushed |\n| ItemListener | Recognizes item events that occur when\
    \ an item is selected or deselected |\n| KeyListener | Recognizes keyboard events\
    \ that occur when a key is pressed |\n| MouseListener | Recognizes mouse events\
    \ that occur when a mouse enters or exits |\n| MouseMotionListener | Recognizes\
    \ motion events that occur when the mouse moves |\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_153_0.png)\n\
    \n# Generating events\n\nComponents need to generate events to be useful. For\
    \ example, the statements creating a button that generates events look like this:\n\
    \n```\nJButton btn = new JButton(\"Click Me\");\nbtn.addActionListener( );\n```\n\
    \nWhen a user clicks a button, the ActionListener interface recognizes the event\
    \ and passes an ActionEvent to the actionPerformed() method. The ActionEvent object\
    \ contains information about the event and the source. An event-handler method\
    \ to create a response for a specific button could look like this:\n\n```java\n\
    public void actionPerformed(ActionEvent event )\n{\n    if ( event.getSource()\
    \ == btn )\n    {\n        // Statements to be executed for this button click\n\
    \    }\n}\n```\n\n# Handling button events\n\nA Swing JButton component that is\
    \ set to generate an ActionEvent when it clicked can be recognized by the ActionListener\
    \ interface, which will pass the event to the actionPerformed() method. The ActionEvent\
    \ object has a getSource() method that identifies the component, and a getActionMode()\
    \ method that returns a String. This will be the text label for a button component,\
    \ or the content for a text field component.\n\nOne response to a button might\
    \ be to disable a component by calling its setEnabled() method with a false argument.\
    \ Conversely, the component can be enabled by specifying a true argument to its\
    \ setEnabled() method.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_155_0.png)\n"
