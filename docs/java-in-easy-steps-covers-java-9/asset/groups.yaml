    # Creating a variable


    In Java programming, a "variable" is simply a useful container in which a value
    may be stored for subsequent use by the program. The stored value may be changed
    (vary) as the program executes its instructions – hence the term "variable".


    A variable is created by writing a variable "declaration" in the program, specifying
    the type of data that variable may contain and a given name for that variable.
    For example, the String data type can be specified to allow a variable named "message"
    to contain regular text with this declaration:


    ```

    String message ;

    ```


    Variable names are chosen by the programmer but must adhere to naming conventions.
    The variable name may only begin with a letter, dollar sign $, or the underscore
    character _, and subsequently have only digits, dollar signs, or underscore characters.
    Names are case-sensitive, so "var" and "Var" are distinctly different names, and
    spaces are not allowed in names.


    Variable names should also avoid the Java keywords listed in the table below,
    as these have special meaning in the Java language.


    | abstract | default | goto | package | synchronized |

    | --- | --- | --- | --- | --- |

    | assert | do | if | private | this |

    | boolean | double | implements | protected | throw |

    | break | else | import | public | throws |

    | byte | enum | instanceof | return | transient |

    | case | extends | int | short | true |

    | catch | false | interface | static | try |

    | char | final | long | strictfp | void |

    | class | finally | native | String | volatile |

    | const | float | new | super | while |

    | continue | for | null | switch |


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_17_0.png)


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_17_1.png)


    Each variable declaration must be terminated with a semicolon character – like
    all other statements.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_17_2.png)


    Strictly speaking, some words in this table are not actually keywords – true,
    false, and null are all literals; String is a special class name, const and goto
    are reserved words (currently unused). These are included in the table because
    they must also be avoided when naming variables.'
