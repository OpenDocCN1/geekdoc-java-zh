    ```\n\nJDK 包含一个 jar 工具，允许类文件和资源文件打包。它使用流行的 ZIP 格式将所有程序压缩成一个具有 jar 扩展名的文件。JAR 文件有效地存储程序并帮助资源文件实现隔离。java\
    \ 解释器完全支持 JAR 文件，因此无需提取即可执行 Java 应用程序。像 java 解释器和 javac 编译器一样，jar 工具位于 Java 的\
    \ bin 目录，并从命令行执行这些常用操作：\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_172_0.png)\n\
