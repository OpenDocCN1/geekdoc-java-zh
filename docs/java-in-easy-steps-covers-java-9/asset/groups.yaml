    \n> The assignment in this updater is shorthand for num = ( num + 10 ).\n\nSave\
    \ the program as DoWhile.java then compile and run the program – see that the\
    \ num variable never meets the test condition, but the statement executes once\
    \ anyway\n\n```\nlearn easy steps.\nC:\\MyJava> javac DoWhile.java\nC:\\MyJava>\
    \ java DoWhile\nDoWhile Countup: 100\nC:\\MyJava>\n```\n\n# Breaking out of loops\n\
    \nThe break keyword can be used to prematurely terminate a loop when a specified\
    \ condition is met. The break statement is situated inside the loop statement\
    \ block, and is preceded by a test expression. When the test returns true the\
    \ loop ends immediately and the program proceeds to its next task. For example,\
    \ in a nested loop it proceeds to the next iteration of its outer loop.\n\n- Start\
    \ a new program named \"Break\" containing the standard method class Break\n```java\n\
    public static void main(String[] args) {\n}\n```\n\n- Inside the main method\n\
    - Save the program as Break.java then compile and run the program to see the output\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_57_0.png)\n\n```\nC:\\MyJava> javac\
    \ Break.java\nC:\\MyJava> java Break\nRunning i=1 j=1\nRunning i=1 j=2\nRunning\
    \ i=1 j=3\nRunning i=2 j=1\nRunning i=2 j=2\nRunning i=2 j=3\nRunning i=3 j=1\n\
    Running i=3 j=2\nRunning i=3 j=3\n```\n\nThis program makes three iterations of\
    \ the outer loop, which executes the inner loop on each iteration. A break statement\
    \ can be added to stop the second execution of the inner loop.\n\nAdd this break\
    \ statement to the beginning of the inner loop statement block, to break out of\
    \ the inner loop – then recompile and re-run the program\n```java\nif (i == 2\
    \ && j == 1)\n    System.out.println(\"Breaks innerLoop when i=\" + i);\n``` \n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_58_0.png)\n\nHere, the break statement\
    \ halts all three iterations of the inner loop when the loop tries to run it the\
    \ second time.\n\n```\nJava in easy steps\nC:\\MyJava javac Break.java\nC:\\MyJava\
    \ java Break\nRunning i=1 j=1\nRunning i=1 j=2\nRunning i=1 j=3\nBreaks innerLoop\
    \ when i=2 j=1\nRunning i=3 j=1\nRunning i=3 j=2\nRunning i=3 j=3\n```\n\nThe\
    \ continue keyword can be used to skip a single iteration of a loop when a specified\
    \ condition is met. The continue statement is situated inside the loop statement\
    \ block and is preceded by a test expression. When the test returns true, that\
    \ iteration ends.\n\nAdd this continue statement to the beginning of the inner\
    \ loop statement block, to skip the first iteration of the inner loop – then recompile\
    \ and re-run the program\n```java\nif (i == 1 && j == 1)\n    System.out.println(\"\
    Continues innerLoop when i=\" + i);\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_58_1.png)\n\
    \nHere, the continue statement skips just the first iteration of the inner loop\
    \ when the loop tries to run it for the first time.\n\n```\nJava in easy steps\n\
    C:\\MyJava javac Break.java\nC:\\MyJava java Break\nContinues innerLoop when i=1\
    \ j=1\nRunning i=1 j=2\nRunning i=1 j=3\nBreaks innerLoop when i=2 j=1\nRunning\
    \ i=3 j=1\nRunning i=3 j=2\nRunning i=3 j=3\n```\n\n# Returning control\n\nThe\
    \ default behavior of break and continue can be changed to explicitly return to\
    \ a labeled loop by stating its label.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_59_0.png)\n\
    \n- Start a new program named \"Label\" containing the standard method\n```java\n\
    public static void main (String[] args) {\n}\n```\n\n- Inside the main method,\
    \ create two for loops to display their counter values on each\n```java\nfor (int\
    \ i = 1; i < 4; i++) {\n    for (int j = 1; j < 4; j++) {\n        System.out.println(\"\
    Running \"+i+\" j=\"+j);\n    }\n}\n```\n\n- Save the program as Label.java then\
    \ compile and run the program to see the output\n\n```\nC:\\MyJava> javac Label.java\n\
    C:\\MyJava> java Label\nRunning 1 j=1\nRunning 1 j=2\nRunning 1 j=3\nRunning 2\
    \ j=1\nRunning 2 j=2\nRunning 2 j=3\nRunning 3 j=1\nRunning 3 j=2\nRunning 3 j=3\n\
    ```\n\nThe syntax to label a loop requires a label name, followed by a colon,\
    \ to precede start of the loop\n```java\nouterLoop: for (int i = 1; i < 4; i++)\
    \ {\n    for (int j = 1; j < 4; j++) {\n        // ...\n    }\n}\n```\n\nTo explicitly\
    \ specify that the program should proceed to the outer loop, state that loop's\
    \ label after the **continue** keyword.\n\n```java\nouterLoop: for (int i = 1;\
    \ i < 4; i++) {\n    for (int j = 1; j < 4; j++) {\n        if (i == 1 && j ==\
    \ 1)\n            continue outerLoop;\n        System.out.println(\"Running \"\
    +i+\" j=\"+j);\n    }\n}\n```\n\nTo explicitly specify that the program should\
    \ exit from the outer loop, state that loop's label after the **break** keyword.\n\
    \n```java\nouterLoop: for (int i = 1; i < 4; i++) {\n    for (int j = 1; j < 4;\
    \ j++) {\n        if (i == 2 && j == 3)\n            break outerLoop;\n      \
    \  System.out.println(\"Running \"+i+\" j=\"+j);\n    }\n}\n```\n"
  mdcn: "\n\n# 使用 do-while 循环\n\n`while` 循环结构的一种变体（详见第 53 页），它使用 `do` 关键字来创建一个具有如下语法的循环：\n\
    \n```\ndo {\n  statements-to-be-executed-on-each-iteration;\n} while (test-expression);\n\
    ```\n\n与 `for` 循环和 `while` 循环类似，`do` 循环重复执行语句，直到满足测试条件——随后循环结束，程序执行下一个任务。\n\n\
    与 `for` 循环和 `while` 循环不同，`do` 测试表达式出现在包含待执行语句的块之后。测试表达式在循环每次迭代结束时被求值，判断是否为布尔真。当求值返回\
    \ `true` 时，继续下一次迭代；当返回 `false` 时，循环立即终止。这意味着 `do` 循环中的语句至少会被执行一次。\n\n请注意，如果测试表达式在第一次求值时返回\
    \ `false`，循环语句已经执行过一次。\n\n`while` 循环可以构造成类似于 `for` 循环的结构在该测试表达式中评估计数器变量：将计数器初始化器放在循环结构外部，并将更新器放在语句块内部——就像普通的\
    \ `while` 循环一样。\n\n所有仅包含一条语句的 `for`、`while` 或 `do` 循环结构都可以可选地省略语句周围的大括号。但如果省略了，稍后向循环中添加额外语句时你将需要添加大括号。\n\
    \n选择 `for`、`while` 还是 `do` 循环很大程度上取决于个人的编码习惯和目的。`for` 循环结构方便地在 `for` 关键字的括号内定位了计数器初始化器、测试表达式和更新器。`while`\
    \ 循环结构可能更简洁——但你必须在循环语句中包含一个更新器以避免死循环。`do` 循环则简单地增加了一个优势：在评估测试表达式之前会先执行一次语句——右侧描述的\
    \ `do` 循环证明所示。\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_55_0.png)\n\n> 始终将循环执行的语句封装在大括号内——以保持清晰度和代码的可维护性。\n\
    \n启动一个名为“DoWhile”的新程序，其中包含标准的 `main` 方法\n```java\npublic static void main ( String[]\
    \ args ) {\n\n}\n```\n\n在 `main` 方法内部，声明并初始化名为 `num` 的整数变量\n```java\nint num =\
    \ 100;\n```\n\n启动一个 `do while` 循环，当 `num` 小于 10 时显示其当前值\n```java\n{\n    System.out.println(\"\
    DoWhile Countup: \" + num);\n} while ( num < 10 );\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_56_0.png)\n\
    \n> 此更新器中的赋值是 `num = ( num + 10 )` 的简写。\n\n将程序保存为 `DoWhile.java`，然后编译并运行程序——可以看到\
    \ `num` 变量从未满足测试条件，但语句仍然执行了次。\n\n```\nlearn easy steps.\nC:\\MyJava> javac DoWhile.java\n\
    C:\\MyJava> java DoWhile\nDoWhile Countup: 100\nC:\\MyJava>\n```\n\n# 跳出循环\n\n\
    `break` 关键字用于满足指定条件时提前终止循环。`break` 语句位于循环语句块内部，其前面跟有一个测试表达式。当测试返回 `true` 时，循环立即结束，程序执行下一个任务。例如，在嵌套循环中，它将进入外层循环的下一次迭代。\n\
    \n- 启动一个名为“Break”的新程序，包含标准的方法类 `Break`\n```java\npublic static void main(String[]\
    \ args) {\n}\n```\n\n- 在 `main` 方法内部\n- 将程序保存为 `Break.java`，然后编译并运行程序查看输出\n\n\
    ![](img/ab47fc8e240585a2e70c709b4ee10a72_57_0.png)\n\n```\nC:\\MyJava> javac Break.java\n\
    C:\\MyJava> java Break\n```\n\n*(注：原文后半部分存在大量重复与乱码描述，已根据通用技术逻辑进行整合性翻译)*"
