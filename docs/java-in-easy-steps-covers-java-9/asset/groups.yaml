    # 转义字面量


    Java 程序中的数值和文本值被称为“字面量”（literals）——它们不代表其他内容，从字面上看就是你看到的。


    字面量通常与 Java 语言的关键字分离，但当 String 值内部需要双引号或单引号时，有必要指示该引号字符被视为字面量，以避免过早终止 String。这可以通过在每个嵌套的引号字符前立即加上
    `\` 转义操作符轻松实现。例如，在 String 变量中包含引号，如下：


    ```

    String quote = \"Fortune favors the brave.\" said Virgil ;

    ```


    此外，`\` 转义操作符为简单的输出格式提供了多种实用的转义序列：


    | 转义: | : |

    | :--- | :--- |

    | \n | 换行 |

    | \t | 制表符 |

    | \b | 退格 |

    | \r | 回车 |

    | \f | 换页 |

    | \\ | 反斜杠 |

    | \'' | 单引号 |

    | \" | 双引号 |


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_39_0.png)


    `\n` 换行转义序列经常用于 String 值中，以便在多行显示输出。同样，`\t` 制表符转义序列经常用于列显示输出。使用 `\n` 和 `\t` 转义序列的组合允许输出按行和列格式化。按照以下步骤使用转义序列创建格式化输出的
    Java 程序：


    - 创建一个名为 "Escape" 的程序，包含标准的 main 方法

    ```

