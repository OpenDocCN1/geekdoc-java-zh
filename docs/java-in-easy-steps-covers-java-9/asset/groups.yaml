    # Summary


    +   - Splitting programs into multiple methods, which can be called upon when
    required, increases flexibility and makes it easier to track down bugs.


    +   - Overloaded methods have the same name but take different arguments.


    +   - Variables declared within a method have local scope, but class variables
    have global scope throughout that class.


    +   - The `static` keyword is used to declare class methods and class variables
    – having global scope throughout that class.


    +   - The `public` keyword explicitly allows access from any class.


    +   - A class declaration can include the `extends` keyword to nominate a super
    class from which it will inherit.


    +   - The name and dot notation can be used to explicitly address a particular
    class method or class variable.


    +   - Real-world objects have attributes and behaviors that can be represented
    in programs by variables and methods.


    +   - Java objects are created as a template class from which instance copies
    can be made.


    +   - Each class has a constructor method that can be invoked using the `new`
    keyword to create an instance copy of that class.


    +   - Instances inherit the attributes and behaviors of the class from which they
    are derived.


    +   - Encapsulation protects instance variables and instance methods from manipulation
    by external classes.


    +   - The `private` keyword denies access from outside the class where the declaration
    is made.


    +   - An object''s constructor method can be called to initialize variable attributes
    of that object.'
