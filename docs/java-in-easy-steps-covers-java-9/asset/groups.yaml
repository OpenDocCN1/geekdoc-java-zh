    \ e) { \n    System.out.println(\"Integer argument required.\"); \n}\n```\n\n\
    - 4 Add a catch statement to handle the exception that arises when the program\
    \ is run with a non-integer argument\n```java\ncatch(NumberFormatException e)\
    \ {\n    System.out.println(\"Argument is wrong format.\");\n}\n```\n\n- 5 Add\
