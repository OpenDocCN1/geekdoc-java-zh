    # Summary


    +   * One or more import statements can be included at the start of a program
    to make the functionality of other classes available.


    +   * An import statement can import all classes in a package with a wildcard
    character, or individual classes by name.


    +   * The java.io package has classes that are designed to handle input and output
    procedures.


    +   * A File object can be used to access files and directories.


    +   * The InputStreamReader object decodes bytes into characters, and the BufferedReader
    reads its decoded characters.


    +   * A FileReader object can be used to decode text bytes into characters for
    reading by a BufferedReader object.


    +   * A FileWriter object and BufferedWriter object can create and update text
    files.


    +   * The java.util package contains utilities for handling collections of data,
    such as array manipulation with its Arrays class.


    +   * The java.util package also contains an ArrayList class that has methods
    to easily manipulate sequenced list items.


    +   * ArrayList object is a Collection that must specify the generic type of item
    that list may contain, such as <String>.


    +   * A lambda expression is an anonymous method that can be specified where it
    is to be executed.


    +   * The java.time package contains a LocalDateTime class that provides fields
    for date and time components.


    +   * The java.text package contains a NumberFormat class that can format numbers
    and currency.


    +   * The java.time.format package contains a DateTimeFormatter class that can
    specify patterns to format dates and times.'
