    # Announcing messages


    The Swing JOptionPane class is designed to create a standard dialog box centered
    on its parent window. Its showDialog() method displays a message to the user providing
    information, warning, or error description.


    The showDialog() method can take four arguments:


    - Parent object – typically referenced by the this keyword

    - Message String to be displayed

    - Dialog title String


    One of the JOptionPane constants:

    - INFORMATION_MESSAGE

    - WARNING_MESSAGE or ERROR_MESSAGE


    The dialog box will display an appropriate icon according to which JOptionPane
    constant is specified.


