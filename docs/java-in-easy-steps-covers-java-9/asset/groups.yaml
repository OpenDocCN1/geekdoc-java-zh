  - '[PAGE 167]


    # Summary


    +   The implements keyword can be used in a class declaration to add one or more
    EventListener interfaces.


    +   A component''s addActionListener() method takes this keyword as its argument
    – to make that component generate an ActionEvent when it is activated.


    +   The ActionListener interface passes a generated ActionEvent as the argument
    to its actionPerformedPerformed() event-handler, which can respond to a push button
    click by the user.


    +   The getSource() method of an ActionEvent can be used to identify the originating
    component that generated the event.


    +   An ItemListener passes a generated ItemEvent as the argument to its itemStateChanged()
    event-handler, which can respond to an item selection by the user.


    +   The getItemSelect() method of an ItemEvent can be used to identify the component
    that generated the event.


    +   A KeyListener interface passes a generated KeyEvent as the argument to three
    required event-handler methods, which can respond to a key press and reveal that
    key''s character.


    +   A MouseListener passes a generated MouseEvent as the argument to five required
    event-handler methods, which can respond to mouse actions made by the user.


    +   A MouseListener interface passes a generated MouseEvent as the argument to
    two required event-handlers, which can respond to mouse movement.


    +   The showMessageDialog() method of the JOptionPane class creates a dialog displaying
    a message to the user, and its inputDialog() and showConfirmationDialog() methods
    can be used to request user input.


    +   Audio resources can be represented by the AudioClip class of the java.applet
    package, and played using its play() method.'
- md: "\n# 10 Deploying programs\n\nThis chapter demonstrates how to deploy Java programs\
    \ - both as Java archives (JAR) and Android application packages (APK).\n\n- 168\
    \ Producing an application\n- 170 Distributing programs\n- 172 Building Java archives\n\
    - 173 Deploying applications\n- 174 Creating Android projects\n- 176 Exploring\
    \ project files\n- 178 Adding resources & controls\n- 180 Inserting Java code\n\
    - 182 Testing the application\n- 184 Deploying Android apps\n- 186 Summary\n\n\
    # Producing an application\n\nJava applications for both desktop and handheld\
    \ devices can be created from common code – like the Lotto.java program below:\n\
    \n```java\nimport javax.swing.*;\nimport java.awt.event.*;\n```\n\n```\npublic\
    \ class Lotto extends JFrame implements ActionListener {\n    ClassLoader ldr\
    \ = this.getClass().getClassLoader();\n    java.net.URL iconURL = ldr.getResource(\"\
    Lotto.png\");\n    ImageIcon icon = new ImageIcon(iconURL);\n    JLabel img =\
    \ new JLabel(icon);\n    JTextField txt = new JTextField(\"\", 18);\n    JButton\
    \ btn = new JButton(\"Get My Lucky Numbers\");\n    JPanel pnl = new JPanel();\n\
    ```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_169_0.png)\n\nLotto.java\n\nComponents\
    \ →\n\n```java\npublic Lotto() {\n    super(\"Lotto App\"); setSize(260, 210);\n\
    \    setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n    pnl.add(img); pnl.add(btn);\n\
    \    btn.addActionListener(this); add(pnl); setVisible(true);\n}\n```\n\nEvent-handler\
    \ →\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_169_1.png)\n\nThe algorithm in\
    \ this event-handler shuffles integers 1-59 in an array, then assigns those integers\
    \ in the first six elements to a string.\n\nEntry-point →\n\n```java\npublic static\
    \ void main (String[] args) {\n    Lotto lotto = new Lotto();\n}\n```\n\nThe Lotto\
    \ program begins with import statements to make Swing components and the ActionListener\
    \ interface available.\n\n# Components\n\nThe program comprises a single panel\
    \ component containing a label component to display an image, a text field component\
    \ to display output, and a button component for user interaction.\n\n# Constructor\n\
    \nThe Lotto() constructor builds a Simple Swing interface that loads the panel\
    \ into a window frame measuring 260 x 210.\n\n# Event-handler\n\nThe button's\
    \ event-handler method executes an algorithm to select a sequence of six unique\
    \ random numbers in the range of 1-59 for display in the text field component.\n\
    \n# Entry-point\n\nThe main() method creates an instance of the app, and calls\
    \ upon() to seek the image file resource Lotto.png in the same directory as the\
    \ program file. The files must be arranged in this way before attempting to compile\
    \ the program.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_170_0.png)\n\nLotto.png\
    \ – Checkered areas are transparent\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_170_1.png)\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_170_2.png)\n\n> Hot tip\n> The Lotto\
    \ program is used throughout this chapter to create apps for desktop and handheld\
    \ devices.\n\nObserving the required file arrangement, the javac compiler can\
    \ be employed in the usual way to create a Lotto.class file, then the java interpreter\
    \ can be employed to execute the program:\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_170_3.png)\n\
    \n```bash\nC:\\MyJava> javac Lotto.java\nC:\\MyJava> java Lotto\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_170_4.png)\n\
    \n# Distributing programs\n\nThe Lotto program opens a new window of the specified\
    \ size containing the Swing interface components. Each time the user clicks the\
    \ push button, its event-handler displays six new random numbers in the range\
    \ 1-59 within the text field component:\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_171_0.png)\n\
    \nWith all other examples in this book, the example Lotto program has been compiled\
    \ for Java 9 and can be distributed for execution on other computers where the\
    \ Java 9 Runtime Environment is present - regardless of their operating system.\
    \ For example, Lotto.class and Lotto.png files have been copied to the desktop\
    \ of a computer running the Linux operating system with the Java 9 runtime installed.\
    \ The Lotto program can, therefore, be executed by the java interpreter in the\
    \ same way as the originating Windows system.\n\nThe java source code file need\
    \ not be included when distributing a program - only .class and resource files\
    \ are needed.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_171_1.png)\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_171_2.png)\n\
    \nThere is, however, a danger in distributing programs this way as the program\
    \ will fail to execute if resource files become unavailable – in this case, removing\
    \ Lotto.class produces this error:\n\n```bash\n$ mike@Desktop-PC:~/Desktop\n$\
    \ mike@Desktop-PC:~$ Lotto\nException in thread \"main\" java.lang.NullPointerException\n\
    \  at java.swing.ImageIcon.init(Lotto.java)\n  at Lotto.init(Lotto.java)\n  at\
    \ Lotto.main(Lotto.java)\n$ mike@Desktop-PC:~/Desktop\n```\n\nThe JDK contains\
    \ a jar utility that allows class and resource files to be bundled into a single\
    \ Archive (JAR) file. This compresses all programs, using the popular ZIP format,\
    \ into a single file with jar extension. A JAR file stores the program efficiently\
    \ and helps resource files not become isolated. The java interpreter fully supports\
    \ JAR files so Java applications can be executed without extracting the individual\
    \ files. Like the java interpreter and javac compiler, the jar tool is located\
    \ in Java’s bin directory and runs from the command line to perform these common\
    \ operations:\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_172_0.png)\n\nLarger\
    \ programs may use many resource files whose location can easily be disrupted\
    \ by a user – the solution is to package the program and all its resources into\
    \ a single executable file.\n\n| Command syntax | Operation |\n| :--- | :--- |\n\
    | jar cf jar-file input-files | Create a JAR file |\n| jar cf jar-file entry-point\
    \ input-files | Create a JAR file with a specified entry point in a standalone\
    \ application |\n| jar tf jar-file | View contents of a JAR file |\n| jar uf jar-file\
    \ | Update contents of JAR file |\n| jar ufm jar-file attribute-file | Update\
    \ contents of JAR manifest, adding attributes |\n| jar xf jar-file | Extract all\
    \ contents of JAR |\n| jar xf jar-file archived-files | Extract specific files\
    \ from JAR |\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_172_1.png)\n\nFor larger\
    \ programs, the wildcard character can be used to archive multiple files within\
    \ the directory – for instance, jar cf.* archives all class files in the current\
    \ directory.\n\n# Building Java archives\n\nFollow these steps to create a JAR\
    \ file for the Lotto program described at the start of this chapter:\n\n1. Open\
    \ a command-line/terminal window, then navigate to the directory where the Lotto\
    \ program files are located - Lotto.class and Lotto.png\n2. Enter jar cfe Lotto.jar\
    \ Lotto.class Lotto.png, then hit the Enter key to create a Lotto archive\n3.\
    \ Next, enter jar tf Lotto.jar to see all contents of the JAR\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_173_0.png)\n\
    \n```bash\nC:\\MyJava> jar cfe Lotto.jar Lotto.class Lotto.png\nC:\\MyJava> jar\
    \ tf Lotto.jar\nMETA-INF/\nMETA-INF/MANIFEST.MF\nLotto.class\nLotto.png\nC:\\\
    MyJava>\n```\n\nNotice that the jar tool automatically creates a META-INF directory\
    \ alongside the archived files. This contains a text-based manifest file named\
    \ MANIFEST.MF that you can examine:\n\n4. Now, enter jar x Lotto.jar META-INF\
    \ to extract a copy of the META-INF directory\n5. Finally, enter type META-INF/MANIFEST.MF\
    \ to see the text contained within the archive manifest\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_173_1.png)\n\
    \n```bash\nC:\\MyJava> jar xf Lotto.jar META-INF\nC:\\MyJava> type META-INF/MANIFEST.MF\n\
    Manifest-Version: 1.0\nCreated-By: 9 (Oracle Corporation)\nMain-Class: Lotto\n\
    C:\\MyJava>\n```\n\nThe JAR manifest can be modified for advanced purposes, such\
    \ as the addition of permissions to use system resources.\n\n# Deploying applications\n\
    \nJava JAR files are executable on any system on which the appropriate version\
    \ of the Java Runtime is installed:\n\nAt the command line, navigate to the directory\
    \ where the Lotto.jar file is located, type java -jar Lotto.jar and hit the Enter\
    \ key to run the Lotto application\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_174_0.png)\n\
    \nThe jar file extension is required when executing JAR files from a prompt.\n\
    \n```bash\nmike@Desktop-PC:~/Desktop\nmike@Desktop-PC:~/Desktop java -jar Lotto.jar\n\
    ```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_174_1.png)\n\nAlternatively, double-click\
    \ or right-click the Lotto.jar file icon, and choose to “Open With” with the Java\
    \ Runtime\n\nHow do you want to open this file?\nKeep this app\n\nSet the JRE\
    \ as the default JAR file handler on your system for permanent double-click execution.\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_174_2.png)\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_174_3.png)\n"
  mdcn: "\n\n# 10 部署程序\n\n本章演示了如何部署 Java 程序 —— 包括 Java 归档 (JAR) 和 Android 应用程序包 (APK)。\n\
    \n- 168 创建应用程序\n- 170 分发程序\n- 172 构建 Java 归档\n- 173 部署应用程序\n- 174 创建 Android 项目\n\
    - 176 探索项目文件\n- 178 添加资源与控件\n- 180 插入 Java 代码\n- 182 测试应用程序\n- 184 部署 Android\
    \  应用\n- 186 总结\n\n# 创建应用程序\n\n用于桌面设备和手持设备的 Java 应用程序可以使用通用代码创建 —— 例如下方的 Lotto.java\
    \ 程序：\n\n```java\nimport javax.swing.*;\nimport java.awt.event.*;\n```\n\n```java\n\
    public class Lotto extends JFrame implements ActionListener {\n    ClassLoader\
    \ ldr = this.getClass().getClassLoader();\n    java.net.URL iconURL = ldr.getResource(\"\
    Lotto.png\");\n    ImageIcon icon = new ImageIcon(iconURL);\n    JLabel img =\
    \ new JLabel(icon);\n    JTextField txt = new JTextField(\"\", 18);\n    JButton\
    \ btn = new JButton(\"Get My Lucky Numbers\");\n    JPanel pnl = new JPanel();\n\
    ```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_169_0.png)\n\nLotto.java\n\n组件\
    \ →\n\n```java\npublic Lotto() {\n    super(\"Lotto App\"); setSize(260, 210);\n\
    \    setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n    pnl.add(img); pnl.add(btn);\n\
    \    btn.addActionListener(this); add(pnl); setVisible(true);\n}\n```\n\n事件处理器\
    \ →\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_169_1.png)\n\n该事件处理器中的算法会洗牌数组中\
    \ 1-59 的整数，然后将前前六个整数赋值给一个字符串。\n\n入口点 →\n\n```java\npublic static void main (String[]\
    \ args) {\n    Lotto lotto = new Lotto();\n}\n```\n\nLotto 程序以 import 语句开始，使 Swing\
    \ 组件和 ActionListener 接口可用。\n\n# 组件\n\n程序由一个面板组件组成，其中包含一个显示图像的标签组件、一个显示输出的文本字段组件和一个用于用户交互的按钮组件。\n\
    \n# 构造函数\n\nLotto() 构造函数构建了一个 Swing Swing ，将面板加载到尺寸为 260 x 210 的窗口框中。\n\n# 事件处理器\n\
    \n按钮的事件处理器方法执行一种算法，在 1-59 范围内选择六个唯一的随机数，显示在文本字段组件中。\n\n# 入口点\n\nmain() 方法创建应用程序的实例，并调用\
    \ seek() 在程序文件相同的目录下查找图像文件资源 Lotto.png。在尝试编译程序之前，必须按照这种方式安排文件。\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_170_0.png)\n\
    \nLotto.png – 格子区域为透明\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_170_1.png)\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_170_2.png)\n\n> 小贴士\n> Lotto 程序在本章中被用于为桌面和手持设备创建应用。\n\
