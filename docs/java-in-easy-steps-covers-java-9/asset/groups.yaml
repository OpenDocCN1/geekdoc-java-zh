    ## 识别数据类型


    Java 中最常用的数据类型列在表中，并带有简要描述：


    | 数据类型 | 描述 | 示例 |

    |---|---|---|

    | char | 单个 Unicode 字符 | ''a'' |

    | String | 任意数量的 Unicode 字符 | ''message'' |

    | int | 整数从 -2.14 亿到 +2.14 亿 | 1000 |

    | float | 带有小数点的浮点数 | 3.1415265 |

