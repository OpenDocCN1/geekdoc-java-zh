  - "[PAGE 49]\n\n# Switching branches\n\nLengthy if else statements, which offer\
    \ many conditional branches for a program to pursue, can become unruly. Where\
    \ the test expressions repeatedly evaluate the same variable value, a more elegant\
    \ solution is often provided by a switch statement.\n\nThe syntax of a typical\
    \ switch statement looks like this:\n\n```\nswitch ( test-variable ) {\n  case\
    \ value1 : code-to-be-executed-when-true; break;\n  case value2 : code-to-be-executed-when-true;\
    \ break;\n  case value3 : code-to-be-executed-when-true; break;\n  default : code-to-be-executed-when-false;\n\
    }\n```\n\nThe switch statement works in an unusual way. Its assigned variable\
    \ seeks to match its assigned value from among a number of case options. Statements\
    \ associated with the option whose values match are executed.\n\nOptionally, a\
    \ switch statement can include a final option using the default keyword to specify\
    \ statements to execute when no case options match the value assigned to the specified\
    \ variable.\n\nEach option begins with the case keyword and a value to match.\
    \ This is followed by a b : colon character and the statements, if any, to be\
    \ executed when the match is made.\n\nIt is important to recognize that the statement,\
    \ or statement block, associated with each case option must be terminated by the\
    \ break keyword. Otherwise, the program will continue to execute the statements\
    \ of other case after the matched option. Sometimes, it is desirable to specify\
    \ a number of case options that should each execute the same statements if. For\
    \ example, one statement for each block of three options like this:\n\n```\nswitch\
    \ ( test-variable ) {\n  case value1 : case value2 : case value3 :\n    code-A-to-be-executed-when-true;\
    \ break;\n  case value4 : case value5 : case value6 :\n    code-B-to-be-executed-when-true;\
    \ break;\n}\n```\n\nMissing break keywords are not syntax errors – ensure that\
    \ all intended breaks are present in switch blocks to avoid unexpected results.\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_49_0.png)"
