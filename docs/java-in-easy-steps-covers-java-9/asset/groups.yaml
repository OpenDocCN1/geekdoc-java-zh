    # Creating a window


    Programs can provide a graphical user interface (GUI) using the Swing components
    of the Java library. The java.swing package contains classes to create a variety
    of components using the style of the native operating system. These can be made
    available to a program by including the initial statement import javax.swing.*;


    A class must be created to represent the GUI to which components can be added
    to the interface. This is easily achieved by declaring it a subclass of Swing''s
    JFrame class using the extends keyword -- thereby inheriting attributes and behaviors
    that allow the user to move, resize, and close the window.


    Remember the letter x in java.swing by thinking of JAVA extra.


    The class constructor should include statements to set these minimum requirements:


    +   - The title of the window – specified as a String argument to the inherited
    super() method of the JFrame class.


    +   - The size of the window – specified as width and height in pixels as arguments
    to its getSize() method.


    +   - What to do when the user closes the window – specified as a constant argument
    to its setCloseOperation() method.


    +   - Display the window – specified as a Boolean argument to its setVisible()
    method.


    Additionally, the constructor can add a JPanel container to the window, in which
    smaller components can be added, using the inherited add() method of the JFrame
    class.


    By default, a JPanel container employs a FlowLayout layout manager that lays out
    components in left-to-right lines, wrapping at the right edge of the window.


    The steps describe how to create a basic window containing a JPanel container
    with a FlowLayout layout manager. This window is featured in subsequent examples
    in this book that demonstrate how to add various components to the JPanel container.


    Layout managers are described in more detail on page 148.


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_135_0.png)


