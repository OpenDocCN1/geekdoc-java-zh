    This can be used to display non-interactive text or image, or both text and an
    image.


    The JLabel object is created with the new keyword, and its constructor takes a
    String argument specifying text to be displayed on that label, or the name of
    an ImageIcon image to display. It can also take three arguments to specify text,
    image, and horizontal alignment as a JLabel constant value. For example, JLabel("text",
    img, JLabel.CENTER) aligns center.


