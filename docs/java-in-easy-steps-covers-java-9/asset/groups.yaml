  - "[PAGE 103]\n\n# Forming multiple classes\n\nIn the same way that a program may\
    \ have multiple methods, larger programs may consist of several classes – where\
    \ each class provides specific functionality. This modular format is generally\
    \ preferable to writing the entire program in a single class as it makes debugging\
    \ easier and provides better flexibility.\n\nThe public keyword that appears in\
    \ declarations is an \"access modifier\" that determines how visible an item will\
    \ be to other classes. It can be used in the class declaration to explicitly ensure\
    \ that class will be visible to any other class. If it is omitted, the default\
    \ access control level allows access from other local classes. The public keyword\
    \ must always be used with the program's main method, however, so that method\
    \ will be visible to the compiler.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_103_0.png)\n\
