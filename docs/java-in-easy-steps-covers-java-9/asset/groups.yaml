- md: "\n# Forming multiple classes\n\nIn the same way that a program may have multiple\
    \ methods, larger programs may consist of several classes – where each class provides\
    \ specific functionality. This modular format is generally preferable to writing\
    \ the entire program in a single class as it makes debugging easier and provides\
    \ better flexibility.\n\nThe public keyword that appears in declarations is an\
    \ \"access modifier\" that determines how visible an item will be to other classes.\
    \ It can be used in the class declaration to explicitly ensure that class will\
    \ be visible to any other class. If it is omitted, the default access control\
    \ level allows access from other local classes. The public keyword must always\
    \ be used with the program's main method, however, so that method will be visible\
    \ to the compiler.\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_103_0.png)\n\n\
    - Start a new program named \"Multi\" containing the standard main method – including\
    \ the public keyword as usual\n\n```java\nclass Multi {\n    public static void\
    \ main ( String[] args ) {\n}\n```\n\n- Between the curly brackets of the main\
    \ method, declare and initialize a String variable, then output its contents String\
    \ msg = \"This is a local variable in the Multi class\"; System.out.println( msg\
    \ );\n\n- Output the contents of a class String variable named \"txt\" from a\
    \ class named \"Data\" System.out.println(Data.txt);\n\n- Call a method named\
    \ \"greeting\" from the Data class Data.greeting();\n\n- Call a method named \"\
    line\" from a class named \"Draw\" Draw.line();\n\n- Save the program as Multi.java\n\
    \n![](img/ab47fc8e240585a2e70c709b4ee10a72_103_1.png)\n\nThe compiler will automatically\
    \ find classes in adjacent external .java files – and create compiled .class files\
    \ for each.\n\n...cont'd\n\n- 7 Start a new file creating the Data class\n```java\n\
    class Data\n{\n}\n```\n\n![](img/ab47fc8e240585a2e70c709b4ee10a72_104_0.png)\n\
    \n- 8 Declare and initialize a public class variable constant\npublic final static\
    \ String txt =\n  \"This is a global variable in the Data class\";\n\n- 9 Add\
    \ a public \"greeting\" class method\n```java\npublic static void greeting()\n\
    {\n  System.out.print(\"This is a global method \");\n  System.out.println(\"\
    of the Data class \");\n}\n```\n\n- 10 Save the file as Data.java in the same\
