    \ where the first character is at position zero – just like arrays whose elements\
    \ are indexed starting at zero. The first character in a String can be addressed\
    \ as charAt(0), the second character as charAt(1), and so on.\n\nAs character\
    \ indexing begins at zero, the final character in a String will always have an\
    \ index number that is one less than the total number of characters in the String.\
    \ This means that the final character in any String has the index number equivalent\
    \ to length() - 1. The final character in a String named \"str\", therefore, be\
    \ as str.charAt(str.length() - 1).\n\nAll occurrences of a particular character\
    \ in a String can be replaced by another character using its replace() method.\
