    # 简介


    Java™ 编程语言最早由 Sun Microsystems 的一名名为 James Gosling 的工程师于 1990 年开发。他不喜欢使用 C++ 编程语言，因此创建了一种新语言并命名为“Oak”（橡树），自他办公室窗外看到的橡树。


    随着广域网的普及，Sun 意识到 Gosling 的语言可以针对互联网开发。因此，Sun 将该语言重新命名为“Java”（仅仅因为这个名字听起来很酷），并于
    1995 年免费提供。全球开发者迅速采用了这种兴奋的新语言，并且由于其模块化设计，能够创建可以添加到内核的新功能。最受欢迎的额外功能都保留在了 Java 的后续版本中。


    Java 的本质是一个被称为“类”的文件库，每个类包含一小段现成的代码。这些类都可以整合到新程序中，就像墙砖一样，只需要编写相对少的新代码即可完成程序。这为程序员节省了大量时间，解释了
    Java 编程如此受欢迎。


    Java 技术既是一种编程语言也是一种平台。在 Java 编程中，源代码首先被编写为人类可读的文本文件，扩展名为 .java。这些文件由 javac 编译器编译成机器可读的
    .class 文件。java 解释器可以通过 Java 虚拟机 (Java VM) 的实例执行程序：


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_9_0.png)


    图中所示图标表示最新 Java 版本引入的新功能或增强功能。


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_9_1.png)


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_9_2.png)


    由于 Java VM 适用于许多不同的操作系统，因此相同的 .class 文件能够在 Windows、Linux 和 Mac 操作系统上运行——因此 Java
    程序员理论上享有“一次编写，随运行”的跨平台能力。


