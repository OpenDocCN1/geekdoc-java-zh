    # Examining conditions


    Possibly the all-time favorite operator of the Java programmer is the ? conditional
    operator that makes a powerful statement concisely. Its unusual syntax can seem
    tricky to understand at first, but it is well worth getting to know this useful
    operator.


    The conditional operator first evaluates an expression for a true or false value,
    then returns one of two operands depending on the result of the evaluation. Its
    syntax looks like this:


    ```

    (boolean-expression) ? if-true-return : if-false-return;

    ```


    Each specified operand alternative allows the program to progress according to
    the Boolean value returned by the tested expression. For instance, the conditional
    operator returns the first operand if the expression is true, and the second operand
    if it is false.


    The conditional operator can be used to replace a simple if-else statement. For
    example:


    ```java

    int a = 5;

    int b = 10;

    int max = (a > b) ? a : b;

    ```


    The conditional operator can also be nested to handle multiple conditions. For
    instance:


    ```java

    int result = (a > b) ? a : (b > c) ? b : c;

    ```


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_35_0.png)


