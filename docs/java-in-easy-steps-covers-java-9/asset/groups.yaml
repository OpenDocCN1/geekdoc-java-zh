    # 评估逻辑


    下表列出的逻辑运算符用于将多个返回布尔值的表达式组合成一个返回单一布尔值的复杂表达式。


    | 运算符 | 操作 |

    | :--- | :--- |

    | && | 逻辑与 |

    | || | 逻辑或 |

    | ! | 逻辑非 |


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_33_0.png)


    逻辑运算符用于具有 true 或 false 布尔值的操作数，或者可以转换为 true 或 false 的值。


    逻辑 `&&` 与运算符评估两个操作数，只有当两个操作数本身为真时才返回 true。否则，逻辑 `||` 运算符将返回 false。这种评估用于条件分支，当两个测试条件都为真时，程序才会执行特定操作。


    与需要两个操作数的 `&&` 运算符不同，逻辑 `||` 或运算符会评估它的两个操作数，如果其中一个为真则返回 true——只有当两个操作数都不真时才会返回
    false。这在 Java 编程中非常有用，可以在两个测试条件之一满足时执行特定操作。


    逻辑 `!` 非运算符是一个“一元”运算符，用于单个操作数之前。它返回给定操作数的反转布尔值——将 true 变为 false，将 false 变为 true。在
    Java 程序中，它可以使用类似于 `goState=!goState` 的语句在连续的循环迭代中切换变量的值。这确保了循环的每次运行时值都会改变，就像闪烁灯开关一样。


    > 小贴士

    “Boolean”（布尔）一词指的是由英国数学家乔治·布尔（1815–1864）开发的逻辑思维系统。


    续上


    按照以下步骤在 Java shell 中探索逻辑运算符：


    - 打开命令行窗口，然后输入 `jshell` 并按 Enter 键启动 Java shell。


    - 接下来，输入语句初始化两个 `boolean` 变量 `boolean yes = true ; boolean no = false ;`


    - 输入语句测试两个条件是否都为真 `boolean result = ( yes && yes ) ; result = ( yes && no )`


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_34_0.png)


    Java 9 引入的新 Java shell 功能也称为“REPL!”——即读取（Read）、评估（Evaluate）、打印（Print）、循环（Loop）的缩写，描述了这种交互式工具。


    ```

    C:\MyJava> jshell

    shell boolean yes = true ; boolean no = false;

    yes => true

    no => false


    shell boolean result = ( yes && yes );

    result => true


    shell result = ( yes && no );

    result => false

    ```


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_34_1.png)


    - 输入语句测试两个条件中是否有一个真 `boolean result = ( yes || yes ) ; result = ( yes || no )
    ; result = ( no || no ) ;` 注意 `false && false` 返回 false 而不是 true，这证明了“错失落不能成没错”。


    - 输入语句显示原始值和反转值 `boolean result = yes ; result = !yes ;`


    ```

    jshell boolean result = ( yes || yes );

    result => true

    shell result = ( yes || no );

    result => true

    shell result = ( no || no );

    result => false

    shell result = yes ; result = !yes;

    result => true

    result => false

    ```


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_34_2.png)


    `!` 非运算符返回的值是存储值的反转——存储值保持不变。


    # 检查条件


    Java 程序员最喜爱的运算符可能是 `?` 条件运算符，它简洁地实现了语句。它的语法初看起来可能很难理解，但了解这个运算符非常有价值。条件运算符首先评估表达式的真假值，然后根据评估结果返回两个操作数之一。它的语法如下：


    ```

    (布尔表达式) ? 如果真返回 : 如果假返回;

    ```


    每个指定的备选操作允许程序根据测试表达式返回的布尔值进行进展。例如，如果表达式为真，条件运算符返回第一个操作数；如果为假，返回第二个。条件运算符可以替换简单的
    `if-else` 语句。例如：


    ```java

    int a = 5;

    int b = 10;

    int max = (a > b) ? a : b;

    ```


    条件运算符还可以嵌套以处理多个条件。例如：


    ```java

    int result = (a > b) ? a : (b > c) ? b : c;

    ```


    ![](img/ab47fc8e240585a2e70c709b4ee10a72_35_0.png)


