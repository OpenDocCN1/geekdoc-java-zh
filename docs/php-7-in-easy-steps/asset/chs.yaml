  \ 1 :\ncase 2 : echo ‘Less than 3’ ; break ;\ncase 3 : echo ‘Exactly 3’ ; break\
  \ ;\ndefault : echo ‘Greater than 3 or less than zero’ ;\n}\n```\n\n![image](img/Image00006.jpg)\n\
  \n`default` 语句不需要出现在 `switch` 块的末尾，但将其放在那里是有逻辑的，因为那里不需要 `break` 语句。\n\n![image](img/Image00029.jpg)\n\
  \nswitch.php\n\n![image](img/Image00067.jpg) 在 PHP 标签之间，使用初始化两个整数和字符变量语句开始脚本：\n\n\
  ```php\n<?php\n$number = 2 ; $letter = ‘B’ ;\n```\n\n![image](img/Image00068.jpg)\
  \ 接下来，添加一个 `switch` 语句来匹配整数值：\n\n```php\nswitch ( $number )\n{\ncase 1 : echo ‘Number\
  \ is One<br>’ ; break ;\ncase 2 : echo ‘Number is Two<br>’ ; break ;\ncase 3 : echo\
  \ ‘Number is Three<br>’ ; break ;\ndefault : echo ‘Number is Unrecognized<br>’ ;\n\
  }\n```\n\n![image](img/Image00069.jpg) 现在，添加一个 `switch` 语句来匹配字符值：\n\n```php\nswitch\
  \ ( $letter )\n{\ncase ‘A’ : echo ‘Letter is A<br>’ ; break ;\ncase ‘B’ : echo ‘Letter\
  \ is B<br>’ ; break ;\ncase ‘C’ : echo ‘Letter is C<br>’ ; break ;\ndefault : echo\
  \ ‘Letter is Unrecognized<br>’ ;\n}\n```\n\n![image](img/Image00070.jpg) 最后，添加一个语句，当测试表达式被判断为\
  \ `TRUE` 或 `FALSE` 时输出结果：\n\n```php\nif ( 4 > 8 )\n{\n echo ‘4 is greater than 8\
  \ <br>’ ;\n}\nelse\n{\n echo ‘4 is less than 8 <br> ;\n}\n```\n\n## 循环\n\n循环是一段重复执行的代码。循环的每次完整执行称为一次“迭代”。有四种类型的循环：\n\
  \n- `for` 循环 – 执行指定次数的迭代\n- `while` 循环 – 仅在开始时的测试为真时执行迭代\n- `do while` 循环 – 仅在结束时的测试为真时执行迭代\n\
  - `foreach` 循环 – 执行迭代以遍历数组的每个元素\n\n### for 循环\n\n`for` 循环用于你预先知道循环应该运行多少次。它具有如下语法：\n\
  \n```php\nfor ( initializer ; test-expression ; updater )\n{\nstatement-to-execute\n\
  }\n```\n\n初始化器用于为计数器（迭代次数）设置起始值。为此目的使用一个整数变量，传统命名为 `i`。\n\n在循环的每次迭代中，都会评估 `test-expression`，只要该表达式为\
  \ `TRUE`，该迭代就会继续。当 `test-expression` 变为 `FALSE` 时，循环立即结束而不再次执行语句。更新器可以是增加器，也可以是递减循环中的减少器。\n\
  \n循环可以嵌套，在一个内部嵌套另一个，以便在外部循环的每次迭代中完整执行一次内部循环。\n\n```php\nfor ( $i = 1; $i < 4; $i++\
  \ )\n{\n    echo “<dt>Outer loop iteration $i ” ;\n    # 在此处插入嵌套循环\n}\n```\n\n###\
  \ while 循环\n\n`while` 循环用于你不一定知道循环应该运行多少次。它具有如下语法：\n\n```php\nwhile (test-expression)\n\
  {\nstatement-to-execute\n}\n```\n\n`test-expression` 在循环开始时评估，只有当该表达式为 `TRUE` 时迭代才会继续。\n\
  \n### do while 循环\n\n`do while` 循环与 `while` 循环相似，但测试是在循环结束进行的。它具有如下语法：\n\n```php\n\
  do\n{\nstatement-to-execute\n} while (test-expression);\n```\n\n### foreach 循环\n\
  \n`foreach` 循环用于遍历数组的每个元素。它具有如下语法：\n\n```php\nforeach ($array as $value)\n{\nstatement-to-execute\n\
  }\n```\n\n\n\n\n\n`while` 循环是上一个示例中 `for` 循环的替代方案。`while` 循环同样需要一个初始化器、测试表达式和一个更新器，但它们不像\
  \ `for` 循环那样在一个对括号内被整齐地列出。相反，初始化器必须出现在循环块开始之前，而测试表达式必须出现在 `while` 关键字后的括号内，随后紧跟一个包含更新器和每次迭代时要执行的语句的大括号。\n\
  \n```\ninitializer\nwhile ( test-expression )\n{\n    statement/s-to-be-executed\
  \ ;\n    updater ;\n}\n```\n![image](img/Image00019.jpg)\n\n确保循环结构中的测试表达式在某个时刻会变为\
  \ `FALSE`，以避免创建永不结束的无限循环。\n\n`do while` 循环通过将 `do` 关键字置于循环块之前并将 `while` 语句移动到循环块之后，提供了上述语法的一种细微的变体：\n\
  \n```\ninitializer\ndo {\n    statement/s-to-be-executed ;\n    updater ;\n}\nwhile\
  \ ( test-expression ) ;\n```\n\n`while` 循环和 `do while` 循环都会继续迭代，直到发现测试表达式为 `FALSE`，此时循环将退出。因此，循环体中包含会在某个时刻更改测试表达式评估结果的代码是非常关重要的——否则将创建一个导致系统锁定的无限循环。`while`\
  \ 循环和 `do while` 循环之间的显著区别是，如果测试表达式在第一次评估时为 `FALSE`，则 `while` 循环不会执行任何迭代。相比之下，`do\
  \ while` 循环始终至少执行一次迭代，因为它的语句是在进行评估之前执行的。如果这是所需要的，那么 `do while` 循环显然是最佳选择，否则在 `for`\
  \ 循环和 `while` 循环之间的选择很大程度上取决于个人喜好。一条经验建议是 `for` 循环最适合执行特定次数的迭代，而 `while` 循环最适合迭代到满足某个条件为止。循环是配合数组使用的完美搭档，因为每次迭代都可以轻松地读取或写入连续的数组元素。\n\
  \n![image](img/Image00005.jpg)\n\n你将在本书的后后部分发现如何使用 PHP `while` 循环从 MySQL 数据库中检索记录。\n\
  \n![image](img/Image00029.jpg)\n\nwhileloop.php\n\n![image](img/Image00067.jpg)\
  \ 在 PHP 标签之间，使用创建一个数组的语句开始脚本\n\n```php\n<?php\n$numbers = array( 10 , 20 , 30 )\
  \ ;\n```\n![image](img/Image00068.jpg) 接下来，添加一个 `while` 循环来输出每个数组元素的值\n\n```php\n\
  echo '<dt>While Loop : ’ ;\n$i = 0 ;\nwhile ( $i < 3 )\n{\n    echo “<dd>Element\
  \ $i = $numbers[$i] ” ;\n    $i ++ ;\n}\n```\n![image](img/Image00069.jpg) 现在，添加一个\
  \ `do while` 循环来输出每个数组元素的值\n\n```php\necho '<dt>Do While Loop : ’ ;\n$i = 0 ;\n\
  do\n{\n    echo “<dd>Element $i = $numbers[$i] ” ;\n    $i ++ ;\n}\nwhile ( $i <\
  \ 3 ) ;\n?>\n```\n![image](img/Image00070.jpg) 将文档保存在 Web 服务器的 `/htdocs` 目录下并命名为\
  \ `whileloop.php`，然后通过 HTTP 打开页面，查看数组元素值如何相同地显示\n\n![image](img/Image00079.jpg)\n\
  \n![image](img/Image00006.jpg)\n\n将此测试表达式中的值改为零——在两个循环中都变为 `while ( $i = 0 )`——以看到只执行了\
  \ `do while` 循环的第一次迭代。\n\n### 跳出循环\n\n`break` 关键字可以在满足指定条件时提前终止循环。`break` 语句位于循环语句块内部，前面有一个测试表达式。当测试返回\
  \ `TRUE` 时，循环立即结束，程序继续执行下一个任务。例如，在嵌套内部循环中，它将进入外层循环的下一次迭代。\n\n![image](img/Image00029.jpg)\n\
  \nbreakcontinue.php\n\n![image](img/Image00067.jpg) 在 PHP 标签之间，使用一个执行三次迭代的 `for`\
  \ 循环开始脚本\n\n```php\n<?php\nfor ( $i = 1 ; $i < 4 ; $i ++ )\n{\n    # 在此处插入的嵌套循环（步骤\
  \ 2）。\n}\n```\n![image](img/Image00068.jpg) 接下来，插入一个同样执行三次迭代的嵌套 `for` 循环\n\n```php\n\
  for ( $j = 1 ; $j < 4 ; $j ++ )\n{\n    # 在此处插入的语句（步骤 5 & 6）。\n}\n?>\n```\n![image](img/Image00069.jpg)\
  \ 现在，插入一条语句在每次迭代时输出两个循环计数器的值\n\n```php\necho “Running i = $i and j = $j <br>” ;\n\
  ```\n![image](img/Image00070.jpg) 将文档保存在 Web 服务器的 `/htdocs` 目录下并命名为 `breakcontinue.php`，然后通过\
  \ HTTP 打开页面，查看两个循环计数器的值如何显示\n\n![image](img/Image00080.jpg)\n\n![image](img/Image00072.jpg)\
  \ 接下来，在循环块之前插入此 `break` 语句以退出循环——保存文档并查看更改\n\n```php\nif ( $i == 2 && $j == 1 )\n\
  {\n    echo “Breaks inner loop when i = 2 and j = 1” ;\n    break ;\n}\n```\n![image](img/Image00081.jpg)\n\
  \n![image](img/Image00006.jpg) 这里的 `break` 语句在外层循环尝试执行第二次时就停止。`continue` 关键字可以在满足指定条件时跳过循环的单次迭代。`continue`\
  \ 语句位于循环语句块内部，前面有一个测试表达式。当测试返回 `TRUE` 时，循环立即结束。\n\n![image](img/Image00082.jpg)\
  \ 现在，在循环块之前插入此 `continue` 语句以退出循环——保存文档并查看更改\n\n```php\nif ( $i == 2 && $j == 1\
  \ )\n{\n    echo “Continues inner loop when i = 2 and j = 1” ;\n    continue ;\n\
  }\n```\n![image](img/Image00083.jpg)\n\n![image](img/Image00006.jpg) 这里的 `continue`\
  \ 语句在外层循环尝试执行第一次时就跳过。\n\n### 总结\n\n- `if` 关键字执行基础条件测试，评估表达式的 `TRUE` 或 `FALSE` 值\n\
  - 大括号内的语句仅在评估结果为 `TRUE` 时执行\n- 多个表达式可以使用逻辑运算符 `&&` 进行测试，也可以通过嵌套多个 `if` 条件测试\n- `else`\
  \ 关键字指定当 `if` 语句评估为 `FALSE` 时执行的语句\n- `elseif` 关键字用于附加在 `TRUE` 时评估的备用表达式\n- 多个 `if-elseif-else`\
  \ 语句可以通过 `switch` 语句更有效地执行\n- `case` 关键字用于指定 `switch` 语句块中要匹配的值\n- 每个 `case` 语句必须以\
  \ `break` 关键字语句结束，以便 `switch` 在找到匹配时退出\n- `default` 语句指定在任何 `case` 语句未发现匹配时执行的代码\n\
  - 循环是脚本中的一段代码，它会自动重复直到测试表达式变为 `FALSE`\n- PHP 循环结构有 `for`、`while`、`do while` 和 `foreach`\n\
  - `for` 循环结构指定了初始化器、测试表达式和一个增加（或递减）计数器的更新器\n- 更新器必须包含在 `while` 循环和 `do while` 循环的语句中\n\
  - 与 `while` 循环不同，`do while` 循环始终至少执行一次\n- `break` 关键字可以在满足指定条件时提前终止循环\n- `continue`\
  \ 关键字可以在满足指定条件时跳过循环的单次迭代\n\n### 使用函数\n\n\n\n\n\n*本章演示如何在函数中创建可重用的代码块。*\n\n## 定义函数\n\
  \nPHP 提供了许多内置函数，可以在脚本中通过名称调用这些函数来执行预定义的操作，例如此处描述的数组排序函数。此外，你也可以创建自己的自定义函数，在被调用时执行特定的操作。这可以方便地将\
  \ PHP 脚本模块化为易于理解和维护的代码段。\n\n![image](img/Image00084.jpg)\n\n你的自定义函数名可以包含字母、数字和下划线的任意组合，但必须以字母或下划线开头。不所当然，为了避免冲突，名称不能与现有的内置函数名重复，例如，你不能创建一个名为\
  \ “sort” 的自定义函数。\n\n与 PHP 变量不同，函数名是不区分大小写的，因此 `cube()`、`Cube()` 和 `CUBE()` 都可以引用同一个函数。尽管如此，建议你始终使用与函数定义中相同的大小写。\n\
  \n在 PHP 脚本中，创建函数定义非常简单：在 `function` 关键字后写出其名称，然后跟着括号和花括号，花括号内包含每次调用函数时要执行的语句：\n\n\
  ```php\nfunction function_name ( )\n{\n    statement-to-be-executed ;\n    statement-to-be-executed\
  \ ;\n    statement-to-be-executed ;\n}\n```\n\n![image](img/Image00006.jpg)\n\n\
  PHP 变量名区分大小写，但 PHP 函数名不区分。\n\nPHP 脚本可以通过 `function_name()` 通过名称调用定义的函数，并在需要时执行其包含的语句。虽然解释器从上到下运行脚本，但函数调用出现在函数定义之前。然而，这不是良好的编程习惯，因此你应该在调用函数之前定义它们。\n\
  \n函数可以包含任何有效的 PHP 脚本代码，甚至可以包含另一个函数定义。在这种情况下，在外部函数被调用之前，内部函数将不存在。\n\n![image](img/Image00029.jpg)\n\
  \nfunction.php\n\n![image](img/Image00085.jpg)  以一个定义函数的语句开始 PHP 脚本\n\n```php\n\
  <?php\nfunction greet ()\n{\n    echo ‘Hello User!<br> ;\n}\n```\n\n![image](img/Image00086.jpg)\
  \  接下来，添加一条语句调用上一步定义的函数，使其执行其语句\n\n```php\ngreet () ;\n```\n\n![image](img/Image00087.jpg)\
  \  现在，定义另一个包含一个内部函数定义和另一个后继语句的函数\n\n```php\nfunction outer ()\n{\n    function inner\
  \ ()\n    {\n        echo ‘Inner function called.<br> ;\n    }\n    echo ‘Inner\
  \ function created.<br> ;\n}\n```\n\n![image](img/Image00088.jpg)  最后，添加语句调用上一步定义的每一个函数\n\
  \n```php\nouter () ;\ninner () ;\n?>\n```\n\n![image](img/Image00089.jpg)  将文档保存到\
  \ Web 服务器的 `/htdocs` 目录中并命名为 `function.php`，然后通过 HTTP 打开页面查看每个函数调用的输出\n\n![image](img/Image00090.jpg)\n\
  \n![image](img/Image00005.jpg)\n\n删除对外部函数的调用，以便在脚本尝试调用内部函数时，看到未定义函数的错误。\n\n## 传递参数\n\
  \n数据可以作为“参数”传递给函数，就像你向某些内置 PHP 函数传递参数一样。例如，`sort()` 函数将要排序的数组作为其参数。函数可以带有任意数量的参数创建，但在调用时，必须为每个参数提供数据以避免错误。\n\
  \n![image](img/Image00006.jpg)\n\n参数必须在函数声明中指定，格式为逗号分隔的列表，而调用者传递的参数值也应为逗号分隔的列表。\n\
  \n一个接收参数的函数通过在函数名后的括号内包含逗号分隔的“参数”列表来定义，如下：\n\n```php\nfunction function_name ( $arg_1\
  \ , $arg_2 , $arg_3 )\n{\n    statement-to-be-executed ;\n    statement-to-be-executed\
  \ ;\n    statement-to-be-executed ;\n}\n```\n\n参数名必须遵循 PHP 变量所需的相同命名规范，并且理想情况下应该具有意义，以表示将传递的数据性质。参数数据必须在调用时按正确的顺序传递，然后供该函数内部的语句使用。\n\
  \n可选，函数定义可以通过在参数名称之前包含类型描述来指定从调用者处传递的数据类型。有效的类型描述包括 `int`、`float`、`string`、`bool`、`callable`\
  \ 和 `array`。当指定类型时，尝试传递错误数据类型的调用会导致错误。\n\n![image](img/Image00003.jpg)\n\n重要的是，默认情况下参数数据是“按值”（by\
  \ value）传递的。这意味着如果函数指定了一个变量，只有数据的副本会被传递给函数。当按值传递时，修改参数不会影响变量中的原始数据。\n\n如果你想让函数修改函数调用中指定的变量存储的数据，你必须“按引用”（by\
  \ reference）传递。这允许函数直接在原始数据上进行操作。要确保参数始终按引用传递，你只需要在函数定义中的参数名称前前缀一个 `&` 符号。\n\n![image](img/Image00029.jpg)\n\
  \narguments.php\n\n![image](img/Image00085.jpg)  以一个初始化两个相同整数变量的语句开始 PHP 脚本\n\n\
  ```php\n<?php\n$a = $b = 5 ;\n```\n\n![image](img/Image00086.jpg)  接下来，定义一个接受两个整数参数的函数——一个按值传递，另一个按引用传递\n\
  \n```php\nfunction modify ( int $val , int & $ref )\n{\n    // 要插入的语句。\n}\n```\n\
  \n![image](img/Image00087.jpg)  现在，插入语句输出传递的值，然后增加这些值并显示修改后的值\n\n```php\necho “Passed\
  \ values : $val , $ref <br>” ;\n$val ++ ;\n$ref ++ ;\necho “Incremented values :\
  \ $val , $ref <hr>” ;\n```\n\n![image](img/Image00088.jpg)  在函数块之后添加一条语句调用函数，并将变量值作为参数\n\
  \n```php\nmodify ( $a , $b ) ;\n```\n\n![image](img/Image00089.jpg)  最后，添加一条语句显示存储在每个变量中的值\n\
  \n```php\necho “Stored values : $a , $b ” ;\n?>\n```\n\n## 可变参数\n\n在函数定义中可以通过赋值参数名称可选地指定默认参数值，如下：\n\
  \n```php\nfunction function_name ( $arg_1 , $arg_2 = “Default String” )\n{\n   \
  \ statement-to-be-executed ;\n    statement-to-be-executed ;\n    statement-to-be-executed\
  \ ;\n}\n```\n\n\n\n\n\n这允许在调用函数时指定一个或两个参数值。如果只指定了一个参数，它将赋值给第一个参数，而第二个参数将使用默认值。在为参数指定了默认值的情况下，它们必须仅出现在未指定默认值的参数之后（即其右侧）的参数列表中。否则，不符合正确总参数数量的调用将导致错误。\n\
  \n![image](img/Image00019.jpg)\n\n如果指定了多个默认值，目前没有办法在函数调用中跳过某个参数，以便为特定参数分配参数值。\n\n\
  如果你需要创建一个可以接受未知数量参数的函数，PHP 拥有一个特殊的 `...` “散列（splat）”运算符用于此目的。它可以像这样用在函数定义中：\n\n\
  ```php\nfunction function_name ( ...$args )\n{\n    statement-to-be-executed ;\n\
  \    statement-to-be-executed ;\n    statement-to-be-executed ;\n}\n```\n\n当在函数定义中使用\
  \ `...` 散列运算符作为参数名的前缀时，可以将多个参数传递给该参数以创建一个数组。该数组可以像任何其他数组一样被遍历，从而操作传入的参数值。\n\n此外，`...`\
  \ 散列运算符可以用于“解包”函数调用中指定的数组，将其元素值作为单独参数传递，如下所示：\n\n```php\nfunction function_name\
  \ ( $arg_1 , $arg_2 , $arg_3 )\n{\n    echo $arg_1 + $arg_2 + $arg_3 ;\n}\n\n$arr\
  \ = [ 1 , 2 , 3 ] ;\nfunction_name ( ...$arr ) # 输出 6\n```\n\n![image](img/Image00005.jpg)\n\
  \n`...` 散列运算符有时也被称为“分发（scatter）”运算符。\n\n![image](img/Image00029.jpg)\n\nparameters.php\n\
  \n![image](img/Image00085.jpg) 通过定义一个为其其两个参数提供默认字符串值的函数来开始一个 PHP 脚本\n\n```php\n\
  <?php\nfunction drink ( string $tmp = ‘hot’ , string $flavor = ‘tea’ )\n{\n    //\
  \ 在此处插入语句。\n}\n```\n\n![image](img/Image00086.jpg) 接下来，插入一条语句来显示其默认值或传入的参数值\n\n\
  ```php\necho “Drinking $tmp $flavor .<br>” ;\n```\n\n![image](img/Image00087.jpg)\
  \ 在函数块之后，添加可选传递字符串参数的函数调用\n\n```php\ndrink () ; drink ( ‘iced’ ) ; drink ( ‘cold’\
  \ , ‘lemonade’ ) ;\n```\n\n![image](img/Image00088.jpg) 现在，定义一个可以接受多个整数参数并显示其总值的函数\n\
  \n```php\nfunction add ( int ... $numbers )\n{\n    $total = 0 ;\n    foreach( $numbers\
  \ as $num ) { $total + = $num ; }\n    echo “<hr>Total : $total ” ;\n}\n```\n\n\
  ![image](img/Image00089.jpg) 最后，在函数块之后添加一条语句来调用上一步的函数并传递三个值\n\n```php\nadd ( 1 ,\
  \ 2 , 3 ) ;\n?>\n```\n\n![image](img/Image00091.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录并为\
  \ `parameters.php`，然后通过 HTTP 打开页面查看参数和默认值\n\n![image](img/Image00093.jpg)\n\n![image](img/Image00005.jpg)\n\
  \n你可以在使用 `...` 散列运算符的接受多个参数的参数之前，指定常规的位置参数。只有数量多于位置元素的参数才会被添加到最后一个参数的数组中。\n\n###\
  \ 识别作用域\n\n在创建自定义函数时，理解变量的可访问性如何受变量“作用域”的限制是非常重要的：\n\n- 在函数外部创建的变量具有“全局”（global）作用域，但通常从任何函数块内部访问\n\
  - 在函数内部创建的变量具有“局部”（local）作用域，因此只能在该特定的函数块内部访问\n\n由于在函数内部创建的变量无法从其他地方访问，它的名称可以与函数块外部的变量或另一个函数块内的变量名称重名而不会产生冲突。这允许全局变量包含一个与同名局部变量不同的值。\n\
  \n![image](img/Image00019.jpg)\n\nPHP 中的全局变量不像 C 等其他编程语言（在那些语言中，全局变量对函数可用）。在 PHP\
  \ 中，只有在首先在函数块内部使用 `global` 关键字显式声明，全局变量才能在函数中使用。\n\n如果你想在函数内部使用全局变量，必须先包含带有 `global`\
  \ 关键字的语句来声明该变量名指向全局变量，如下：\n\n```php\nglobal variable-name ;\n```\n\n通过在函数内部创建的变量的声明之前加上\
  \ `global` 关键字，可以更改其作用域使其在全局范围内可用——但这是一种糟糕的做法，应该避免。\n\n函数语句可以调用其他函数来执行它们的语句，也可以调用自己来执行递归。与循环一样，递归函数必须更改测试条件的状态，否则它将永远永远持续下去。这可能是一个计数器值，它作为参数从初始函数调用传递进来，然后在随后的递归调用中不断递增，直到它超过测试中指定的值。或者，可以声明一个静态局部变量来存储递增值，如下所示：\n\
  \n```php\nstatic variable-name ;\n```\n\n与在离开函数时会丢失值的其他局部变量不同，静态变量会保留其值。这意味着静态变量的更新值在每次函数调用时都会被保留。递归函数可能会引用递增的全局变量值，直到它超过测试中指定的数值。\n\
  \n![image](img/Image00029.jpg)\n\nparameters.php\n\n![image](img/Image00085.jpg)\
  \ 通过初始化全局变量并显示变量值开始一个 PHP 脚本\n\n```php\n<?php\n$number = 1 ; echo “Global number\
  \ : $number <br>” ;\n```\n\n![image](img/Image00086.jpg) 接下来，定义并调用一个初始化局部变量并显示该值的函数\
  \ `show_local()`\n\n```php\nfunction show_local ()\n{\n    $number = 100 ; echo\
  \ “Local number : $number <hr>” ;\n}\n\nshow_local () ;\n```\n\n![image](img/Image00087.jpg)\
  \ 现在，定义并调用一个每次递增全局变量和静态变量的递归函数\n\n```php\nfunction recur ()\n{\n    global $number\
  \ ;\n    static $letter = ‘A’ ;\n    if( $number < 14 )\n    {\n        echo $number\
  \ : $letter | “ ;\n        $number ++ ; $letter ++ ; recur () ;\n    }\n}\n\nrecur\
  \ () ;\n```\n\n![image](img/Image00088.jpg) 最后，在函数块之后添加一条语句来显示修改后的全局变量\n\n```php\n\
  echo “<hr>Global number : $number ” ;\n?>\n```\n\n![image](img/Image00089.jpg) 将文档保存到\
  \ Web 服务器的 `/htdocs` 目录并为 `scope.php`，然后通过 HTTP 打开页面查看全局和局部变量的值\n\n![image](img/Image00094.jpg)\n\
  \n![image](img/Image00006.jpg)\n\n如果你从此函数中移除 `static` 关键字，`$letter` 变量每次调用函数时将简单地包含\
  \ ‘A’。\n\n![image](img/Image00005.jpg)\n\nPHP 还有一个特殊的 `$GLOBALS` 数组，可以通过其名称引用全局变量的值。在这个示例中，你也可以改为使用\
  \ `$GLOBALS['number']` 来获取该值。\n\n### 返回值\n\n自定义 PHP 函数可以通过添加使用 `return` 关键字的语句向调用者返回一个值，如下：\n\
  \n```php\nfunction function_name ( )\n{\n    statement-to-be-executed ;\n    statement-to-be-executed\
  \ ;\n    return value ;\n}\n```\n\n`return` 语句是可选的，如果省略，函数将默认向调用者返回 `NULL` 值。\n\n\
  函数只能向调用者返回一个项目，因此它们不能返回多个值。然而，你可以将多个值赋值给数组的元素，并让函数返回单个数组给调用者，然后解包这些值。\n\n\n\n\n\n\
  `return` 语句可以包含一个待求值的表达式，以便其单一结果被返回给调用者。例如：\n\n```php\nfunction square( int $number\
  \ )\n{\n    return $number * $number ;\n}\n\necho square( 3 ) ;      # 输出 9\n```\n\
  \n为了确保函数只返回预期数据类型的值，函数声明可以可选地指定返回类型描述，例如 `int`、`float`、`string`、`bool` 或 `array`，如下：\n\
  \n```php\nfunction *function_name ( ) : int\n{\n    statement-to-be-executed ;\n\
  \    statement-to-be-executed ;\n    return value ;\n}\n```\n\n当指定了返回数据类型时，尝试向调用者返回错误数据类型的函数将导致错误。\n\
  \n![image](img/Image00003.jpg)\n\n指定返回数据类型的能力是 PHP 7 的一项新功能。\n\n![image](img/Image00029.jpg)\n\
  \nreturn.php\n\n![image](img/Image00085.jpg) 通过定义一个必须只返回数据数组的函数开始编写 PHP 脚本\n\n```php\n\
  <?php\nfunction supply () : array\n{\n    // 在此处插入语句。\n}\n```\n\n![image](img/Image00086.jpg)\
  \ 接下来，插入一条语句返回一个包含四个混合值的数组\n\n```php\nreturn array ( 75 , 3.142 , ‘Super PHP’ ,\
  \ True ) ;\n```\n\n![image](img/Image00087.jpg) 函数之后，添加一条调用该函数并将返回的数组值赋值给变量的语句\n\
  \n```php\n$array = supply () ;\n```\n\n![image](img/Image00088.jpg) 最后，添加循环来显示函数返回的每一个值\n\
  \n```php\nforeach( $array as $data )\n{\n    echo “Element Value : $data <br>”\n\
  }\n\n?>\n```\n\n![image](img/Image00089.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `return.php`，然后通过\
  \ HTTP 打开页面以查看返回的值\n\n![image](img/Image00095.jpg)\n\n![image](img/Image00006.jpg)\n\
  \n在 PHP 中，布尔值 `TRUE` 在数值上表示为 1。\n\n### 回调\n\nPHP 允许你创建在函数定义中没有指定名称的“匿名”函数。与其他函数一样，如果指定了参数，这些函数可以接受参数，并且在调用时可以选择返回一个值。与作为代码构造的其他函数定义不同，匿名函数定义是一个表达式。这意味着每个匿名函数定义都必须以分号结束，如下：\n\
  \n```php\nfunction ( )\n{\n    statement-to-be-executed ;\n    statement-to-be-executed\
  \ ;\n    return value ;\n} ;\n```\n\n![image](img/Image00019.jpg)\n\n不要忘记在每个匿名函数定义后添加一个终止分号\
  \ `;`。\n\n单从本身来看，匿名函数的作用很小，因为没有名称，它无法被调用，但它可以在其他方面很有用：\n\n-   赋值给变量后，匿名函数可以使用变量名进行调用\n\
  -   作为可调用参数传递给另一个函数，匿名函数可以稍后作为“回调”调用\n-   从函数返回，匿名函数在“闭包”中保留对返回函数变量的访问权限\n\n通过将匿名函数赋值给变量，你实际上是给函数起了一个名字，并可以像调用其他函数一样使用变量名来调用它并传递参数。同样，当你将匿名函数传递给另一个函数时，可以像调用其他函数一样使用参数名对其进行回调并传递参数。PHP\
  \ 的 `use` 关键字和 `&` 符号前缀允许匿名函数引用返回函数中的局部变量。\n\n![image](img/Image00029.jpg)\n\ncallback.php\n\
  \n![image](img/Image00085.jpg) 通过给变量赋值一个接受单个参数的匿名函数开始编写 PHP 脚本\n\n```php\n<?php\n\
  $hello = function ( $user ) { echo “Hello $user !<br>” } ; ;\n```\n\n![image](img/Image00086.jpg)\
  \ 接下来，添加一条调用匿名函数并传递单个参数的语句\n\n```php\n$hello ( ‘Mike’ ) ;\n```\n\n![image](img/Image00087.jpg)\
  \ 现在，定义一个接受单个可调用参数的普通函数，并调用该函数传递一个字符串\n\n```php\nfunction greet ( callable $anon\
  \ )\n{\n    $anon ( ‘Carole Anne’ ) ;\n}\n```\n\n![image](img/Image00088.jpg) 添加一条语句调用上一步定义的函数，传递第一步中赋值给变量的匿名函数\n\
  \n```php\ngreet( $hello ) ;\n```\n\n![image](img/Image00089.jpg) 接下来，定义另一个普通函数，它有一个局部变量并返回一个引用该局部变量值的匿名函数\n\
  \n```php\nfunction meet () : callable\n{\n    $time = ‘morning’ ;\n    return function(\
  \ $name ) use( & $time )\n    { return “Good $time , $name !” } ;\n}\n```\n\n![image](img/Image00091.jpg)\
  \ 将上一步定义的函数赋值给变量\n\n```php\n$meeting = meet () ;\necho $meeting ( ‘Susan’ ) ;\n\n\
  ?>\n```\n\n![image](img/Image00096.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `callback.php`，然后通过\
  \ HTTP 打开页面以查看从匿名函数返回的值\n\n![image](img/Image00097.jpg)\n\n![image](img/Image00006.jpg)\
  \ 记得包含 `&` 符号前缀以创建变量的引用。\n\n![image](img/Image00005.jpg) 注意最后的函数调用获取了作用域中的 ‘morning’\
  \ 字符串。\n\n**总结**\n\n-   自定义函数允许将 PHP 脚本模块化为更容易理解和维护的代码段\n-   函数名必须以字母或下划线开头，且不区分大小写\n\
  -   函数通过在 `function` 关键字后写出名称、圆括号和包含语句的大括号定义\n-   接受参数的函数通过在括号内包含逗号分隔的参数列表定义\n-\
  \   可选，函数定义可以通过在参数名称之前包含数据类型来指定调用者传递的数据类型\n-   参数数据通常按值传递，但如果参数名称赋予 `&`，则可以按引用传递\n\
  -   可以通过给参数赋值在函数定义中指定默认参数值\n-   当参数名称赋予 `...` 扩展运算符时，可以将多个参数传递给该参数以创建一个数组\n-   函数外部创建的变量具有全局作用域，但在函数块内部无法访问除非包含使用\
  \ `global` 的声明\n-   函数内部创建的变量具有局部作用域，因此仅在函数块内部可访问\n-   局部变量在程序离开函数范围时丢失值，但 `static`\
  \ 变量会保留其值\n-   `return` 关键字向调用者返回单个项目，函数定义可以可选地指定返回数据类型\n-   匿名函数定义没有指定名称但是一个表达式，因此必须以\
  \ `;` 结束\n-   `use` 关键字和 `&` 符号前缀允许匿名函数引用返回函数中的局部变量\n\n**处理字符串**\n\n*本章演示了在 PHP\
  \ 脚本中处理文本字符串的各种方法。*\n\n- 比较字符\n- 搜索文本\n- 提取字符串\n- 更改大小写\n- 格式化字符串\n- 处理日期\n- 编码实体\n\
  - 总结\n\n**比较字符**\n\n\n\n\nPHP 提供了许多内置函数可以对两个文本字符串进行比较。简单的 `strcmp()` 函数接受两个字符串参数进行比较，并根据结果返回三个整数值之一。当字符串完全匹配时，`strcmp()`\
  \ 将返回 0。当第一个字符串参数大于第二个参数时，`strcmp()` 返回 1，但当第一个字符串参数小于第二个参数时，`strcmp()` 将返回 -1。\n\
  \n![image](img/Image00019.jpg)\n\n严格来说，`strcmp()` 返回的值将是一个正整数、0 或负整数——但通常的值为 1,0\
  \ 或 -1。\n\n[/content] (此处衔接)\n`strncmp()` 函数的工作方式与 `strcmp()` 类似，但它接受第三个整数参数，用于指定从字符串开始比较的字符数。\n\
  \n`strcmp()` 和 `strncmp()` 函数在比较字符串时对大写字母和小写字母的重视程度不同。如果你倾向于忽略大小写，可以使用替代的辅助函数 `strcasecmp()`\
  \ 和 `strncasecmp()`。\n\n为了理解这四个比较函数的结果，了解比较实际上是如何进行的是很有用的。每个字符都有一个标准的数值“ASCII”值，其中小写字母\
  \ a-z 的范围是 97-122，大写字母 A-Z 的范围是 65-90。通过比较每个范围内的第一个值，我们看到“a”（97） 大于“A”（65）。将这些作为参数传递给\
  \ `strcmp()` 函数，因此会返回 1，因为第一个参数大于第二个。相反，如果你指定“A”（65）作为第一个参数，将“a”（97）作为第二个参数，那么 `strcmp()`\
  \ 函数将返回 -1，因为第一个参数小于第二个。在字符串比较中，每个字符都按顺序比较，以确保包含不同顺序相同字符的字符串不会被错误地视为相等。例如，比较“ABC”和“BAC”，第一个字符“A”（65）\
  \ 小于第一个字符“B”（66），因此 `strcmp()` 函数将返回 -1，因为第一个参数小于第二个。\n\n![image](img/Image00005.jpg)\n\
  \nASCII 是美国信息交换标准（American Standard Code for Information Exchange）的缩写，它规定了通用字符编码方案。\n\
  \n通过将字符作为 PHP `ord()` 函数的参数，可以找到任何字符的 ASCII 值；通过将其作为 PHP `strlen()` 函数的参数，可以找到字符串的长度。\n\
  \n![image](img/Image00029.jpg)\n\ncharacters.php\n\n![image](img/Image00098.jpg)\
  \  使用语句开始 PHP 脚本，初始化四个带有字符串值的变量\n\n```php\n<?php\n$str1 = ‘PHP In Easy Steps’ ;\n\
  $str2 = ‘PHP In Easy Steps’ ;\n$str3 = ‘PHP Easy Steps’ ;\n$str4 = ‘php in easy\
  \ steps’ ;\n```\n\n![image](img/Image00099.jpg)  接下来，添加语句来比较字符串\n\n```php\necho\
  \ “’$str1’ versus ‘$str2’ : “ .strcmp( $str1 , $str2 ). ’<br>’ ;\necho “’$str1’\
  \ versus ‘$str3’ : “ .strcmp( $str1 , $str3 ). ’<br>’ ;\necho “’$str1’ versus ‘$str4’\
  \ : “ .strcmp( $str1 , $str4 ). ’<hr>’ ;\n```\n\n![image](img/Image00100.jpg)  现在，添加一个语句用于不区分大小写的比较\n\
  \n```php\necho ‘Comparison Ignoring Case :<br> ;\necho “’$str1’ versus ‘$str4’ :\
  \ “ .strcasecmp( $str1 , $str4 ) ;\n```\n\n![image](img/Image00101.jpg)  最后，添加一个循环来计数并显示第一个字符串的总\
  \ ASCII 代码值\n\n```php\n$total = 0 ;\nfor ( $i = 0 ; $i < strlen( $str1 ) ; $i ++\
  \ )\n{\n    $total += ord( $str1 [ $i ] ) ;\n}\necho “<hr>ASCII Total $str1 : $total\
  \ ” ;\n?>\n```\n\n![image](img/Image00102.jpg)  将文档保存到你 Web 服务器的 `/htdocs` 目录并命名为\
  \ `characters.php`，然后通过 HTTP 打开页面以查看字符串比较\n\n![image](img/Image00103.jpg)\n\n![image](img/Image00006.jpg)\n\
  \n字符顺序是相关的，因为两个顺序不同的字符串的 ASCII 总和可能相等，但这些字符串本身并不会匹配。\n\n### 搜索文本\n\nPHP 提供了许多内置函数来搜索字符串以找到指定的子字符串或单个字符。简单的\
  \ `strpos()` 函数接受两个参数，指定要搜索的字符串和要查找的子字符串。它将从字符串开始顺序搜索以找到匹配。当找到匹配项时，搜索停止，`strpos()`\
  \ 返回一个整数，该整数是字符串中第一个匹配项开始的字符索引位置。如果没有找到匹配项，`strpos()` 返回 `FALSE`。\n\n`strrpos()`\
  \ 函数的工作方式与 `strpos()` 类似，但它返回最后一个匹配项开始的索引位置。\n\n`strstr()` 函数接受两个参数，指定要搜索的字符串和要查找的子字符串。它将从字符串开始顺序搜索以找到匹配。当找到匹配项时，搜索停止，`strstr()`\
  \ 返回从匹配项开始的剩余字符串。如果没有找到匹配项，`strstr()` 返回 `NULL`。\n\n![image](img/Image00019.jpg)\n\
