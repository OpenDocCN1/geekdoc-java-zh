- "# PHP 7：简易上手指南\n\n\n\n![](img/Image00235.jpg)\n![](img/Image00235.jpg)\n\n\n![image](img/Image00000.jpg)\n\
  \nIn easy steps 是 In Easy Steps Limited 的品牌\n\n16 Hamilton Terrace . Holly Walk\
  \ . Leamington Spa\n\nWarwickshire . United Kingdom . CV32 4LY\n\n[www.ineasysteps.com](http://www.ineasysteps.com)\n\
  \n\n\n\n\n# 1\n## 入门\n欢迎来到 PHP 交互式 Web 的精彩世界。本章将演示如何使用 Web 服务器和 PHP 引擎创建一个动态开发环境。\n\
  \n* 介绍 PHP\n* 安装 Abyss 服务器\n* 安装 PHP 引擎\n* 集成 Abyss 和 PHP\n* 嵌入 PHP 脚本代码\n* 按规则脚本\n\
  * 总结\n\n## 介绍 PHP\n最吸引人的现代网站通过动态响应当前状况（用户名、时间、最新博客、购物车内容等）提供定制的用户体验。许多动态网站都是使用 PHP\
  \ 创建的。\n\n### 什么是 PHP？\nPHP 是一种广泛使用的通用脚本语言，特别适用于 Web 开发并可以嵌入 HTML 中。它由程序员 Rasmus\
  \ Lerdorf 创建，最初是用于维护他网站的一组脚本，并于 1995 年 6 月 8 日发布为“个人首页工具（PHP Tools）1.0 版本”。\n\n\
  ![](img/Image00001.jpg)\n\n这是 PHP 项目的官方标志——PHP 的官方在线可以在 [php.net](http://www.php.net)\
  \ 获取。\n\n这些工具在 1997 年的 2 版本中得到了扩展，并在次年的 3 版本中名称更改变为递归缩写“PHP: 超文本预处理器”。2000 年随着 PHP4\
  \ 的发布，通过 Zend 引擎虚拟机的驱动，性能、可靠性和扩展性得到了提高。\n\n随后，PHP5 于 2004 年发布，由新的 Zend II 引擎驱动，并由\
  \ PHP 组作为免费软件制作。计划在整个 PHP 中引入原生 Unicode 支持的实验性版本 PHP6 被放弃了。目前的版本 PHP7 于 2015 年发布，由最新的\
  \ Zend 3 引擎驱动，提供了更高的性能。今天，PHP 已安装在超过 2000 万网站和 100 万台 Web 服务器上。\n\n\n\n\n- PHP 代码被包含在特殊的起始和结束处理标签中，这些标签允许你在“PHP\
  \ 模式”中进出出，从而在 HTML 文档中实现指令。\n- PHP 代码在服务器上（“服务器端”）执行，这与在浏览器中（“客户端”）执行的 JavaScript\
  \ 代码不同。客户端接收的是脚本运行的结果，而不知道底层代码是什么。最近，服务器端已被称为“云端”。![Image0003.jpg]\n\n上图所示的图标出现在书中，表示\
  \ PHP 7 版本中引入的新功能。\n\n# 理解云端\n\n每当用户请求在浏览器中查看网页时，浏览器会向 Web 服务器请求该页面并通过 `HTTP` 协议接收页面。如果网页包含\
  \ PHP 脚本，Web 服务器在向 Web 浏览器发送响应之前，会先调用 `PHP engine`：\n![Image0004.jpg]\n![Image0005.jpg]\n\
  \n`HTTP`（超文本传输协议）是通用的通信标准，允许任何连接到任何服务器的计算机访问 Web 上的文件。接下来的页面将描述如何通过在您自己的计算机上安装以下服务器端技术来创建交互式网站：\n\
  \n## Web Server – Abyss Web Server X1 Personal Edition\n\n## PHP Engine – PHP 7.0.4\n\
  ![Image0006.jpg]\n\n书中的示例是用这些软件版本创建的，但可能需要或其他版本进行修改。\n\n# 安装 Abyss\n\nAbyss 是一款适用于\
  \ Windows、Mac OS 和 Linux 操作系统的免费紧凑 Web 服务器，可以在 `aprelium.com` 下载。尽管占用空间很，但 Abyss\
  \ 支持许多强大功能，包括使用服务器端脚本生成动态内容——因此它是 PHP 的理想伴侣。![Image0007.jpg]\n\n关于 Abyss Web Server\
  \ 安装的进一步指导请访问 `aprelium.com/abyssws/start.html`。\n\n# 安装引擎\n\n可以在自己的计算机上安装 Abyss\
  \ Web Server，为交互式网站开发提供环境：\n![Image0008.jpg]\n\n从 `aprelium.com/abyssws/download.php`\
  \ 下载适用于系统的 Abyss X1 Web 服务器安装包：\n![Image0009.jpg]\n![Image0010.jpg]\n\n运行安装程序并同意\
  \ (`Agree`) 许可条款，然后选择 Abyss Web Server 组件并点击 `Next`：\n![Image0011.jpg]\n![Image0006.jpg]\n\
  \nWindows 版 Abyss 安装包是一个名为 `abws1.exe` 的可执行文件，运行它来安装 Web 服务器。\n![Image0012.jpg]\n\
  \n接受建议的路径 `C:\\Abyss Web Server`，然后选择“Install as a Service”（作为服务安装）：\n![Image0013.jpg]\n\
  \n安装过程完成后，系统的默认浏览器将打开，显示 Abyss 控制台。\n![Image0014.jpg]\n\n选择您偏好的语言，然后为以后访问 Abyss\
  \ Console 输入名称和密码：\n![Image0015.jpg]\n\n现在使用选择的名称和密码登录，查看 Abyss 状态是否为“Running”（运行）：\n\
  ![Image0016.jpg]\n![Image0017.jpg]\n\n在浏览器地址栏中输入 `http://localhost` 然后按 `Enter`\
  \ —— 查看默认的 Abyss “Welcome”页面：\n![Image0018.jpg]\n![Image0019.jpg]\n\n如果您选择“Manual\
  \ startup”（手动启动）选项，Abyss 图标将不会出现在系统托盘中，以便于启动/停止控制和访问服务器。相反，可以通过浏览器访问 `http://localhost:9999`\
  \ 或通过数字地址 `http://127.0.0.1:9999` 控制台（`localhost` 是 IP 地址 `127.0.0.1` 的别名）。![Image0005.jpg]\n\
  \n在 Abyss 控制台中，点击“Configure”按钮然后点击 General 图标，查看默认的 `HTTP Port` 为 80，且默认的 Documents\
  \ Path（您的网页所在处）为 `/htdocs`。\n\n## 安装 PHP 引擎\n\nPHP 解释器引擎在网页内实现 PHP 脚本，适用于 Windows、Mac\
  \ OS 和 Linux 操作系统，可在 `php.net` 免费下载：\n![Image0001.jpg]\n\n关于安装 PHP 的进一步指导请访问 `php.net/manual/en/install.php`。\n\
  \n此外，从 `aprelium.com` 可以获得适用于 Windows 版 Abyss Web Server 的预配置包，推荐用于简单快速安装：\n![Image0008.jpg]\n\
  \n从 `aprelium.com/downloads` 下载适用于系统的 PHP 安装包：\n![Image0010.jpg]\n\n运行下载的可执行文件以启动安装向导，然后点击\
  \ `Next` 按钮开始：\n![Image0020.jpg]\n\n接下来，接受许可条款，然后点击 `Next` 按钮继续安装：\n![Image0021.jpg]\n\
  ![Image0019.jpg]\n\n如果您是从 `php.net` 为 Windows  Abyss 安装 PHP，请务必选择一个 `VC14 Thread\
  \ Safe` 版本——因为它们需要的 Windows 依赖项较少。接受建议的目标文件夹 `C:\\Program Files (X86)\\PHP7`，然后点击\
  \ `Install` 按钮：\n![Image0022.jpg]\n![Image0015.jpg]\n\n最后，安装完成后，点击 `Finish` 按钮关闭安装向导：\n\
  ![Image0023.jpg]\n![Image00005.jpg]\n\n在配置 Abyss Web Server 以集成 PHP 时，需要 PHP 安装位置。\n\
  ![Image0006.jpg]\n\n在安装 PHP 之后，在配置以识别它们之前，Web 服务器还无法执行 PHP 脚本。\n\n\n\n只有当 Web 服务器使用\
  \ HTTP 协议提供文档时，PHP 引擎才能解释文档。你不能直接在浏览器中打开 PHP 文件。请始终使用位置 `http://localhost/` 来运行本书中的示例。\n\
  \nAbyss Web 服务器现在应该已经运行在你的系统上，并已正确配置为识别具有 `.php` 文件扩展名的文档应由 PHP 引擎解释。现在可以通过创建一个简单的\
  \ PHP 脚本供 Abyss 为你的 浏览器提供服务来测试配置：\n\n![image](img/Image00029.jpg)\n\n`phpinfo.php`\n\
  \n![image](img/Image00008.jpg) 打开一个纯文本编辑器并准确输入下面的脚本\n\n```php\n<?php phpinfo() ;\
  \ ?>\n```\n\n![image](img/Image00010.jpg) 将脚本保存为 `phpinfo.php` 到 Abyss 文档路径目录中，通常位于\
  \ `C:\\Abyss Web Server\\htdocs`\n\n![image](img/Image00012.jpg) 在网页浏览器的地址栏中准确输入位置\
  \ `http://localhost/phpinfo.php`，查看 Abyss 提供一个包含你的 PHP 版本信息的网页\n\n![image](img/Image00030.jpg)\n\
  \n![image](img/Image00019.jpg)\n\nPHP 脚本是区分大小写的，因此你必须使用小写字母复制列出的脚本。\n\n### 嵌入 PHP\
  \ 脚本代码\n\nPHP 脚本可以嵌入 HTML 文档中——这意味着 PHP 和 HTML 代码可以共存在于同一个文件中。所有嵌入的 PHP 代码必须包含在\
  \ `<?php` 和 `?>` 标签内，以便 PHP 引擎能够轻松识别并进行解释。通常，PHP 代码会将内容写入 HTML 文档的 body 部分，然后将其发送到网页浏览器：\n\
  \n![image](img/Image00029.jpg)\n\n`hello.php`\n\n![image](img/Image00008.jpg) 启动一个纯文本编辑器并创建此带有空\
  \ body 部分的有效 HTML5 文档\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en\">\n<head>\n\
  <meta charset=\"UTF-8\">\n<title> PHP 入门</title>\n</head>\n<body>\n\n</body>\n</html>\n\
  ```\n\n![image](img/Image00010.jpg) 在 body 部分插入标签以包含 PHP 代码\n\n```php\n<?php\n\n\
  ?>\n```\n\n![image](img/Image00012.jpg) 现在，在 PHP 标签之间插入一条描述性注释和一行向 body 部分写入内容的代码\n\
  \n```php\n# 写入传统的问候。\necho '<h1>Hello World!</h1>' ;\n```\n\n![image](img/Image00031.jpg)\n\
  \n![image](img/Image00005.jpg)\n\n注意，描述性注释被包含在 PHP 标签之间，仅用于信息提示。\n\n![image](img/Image00014.jpg)\
  \ 将文档编码设置为 UTF-8 格式，然后将其保存为 Abyss 服务器 `/htdocs` 文件夹中的 `hello.php`\n\n![image](img/Image00032.jpg)\n\
  \n![image](img/Image00015.jpg) 接下来，在网页浏览器的地址栏中输入位置 `http://localhost/hello.php`，查看\
  \ Abyss 提供一个包含嵌入 PHP 代码写入内容的网页\n\n![image](img/Image00033.jpg)\n\n![image](img/Image00017.jpg)\
  \ 现在，使用你网页浏览器的**查看源代码**功能查看 PHP 是否已将内容写入 body 部分，包括 HTML `<h1></h1>` 标题标签\n\n![image](img/Image00034.jpg)\n\
  \nPHP 脚本也可以以相同的方式嵌入较早版本的 HTML 中。本书中的其他示例演示了嵌入 PHP 脚本，但没有重复列出 HTML 代码。\n\n![image](img/Image00019.jpg)\n\
  \nWindows 记事本会自动向文件添加隐藏的“字节顺序标记”（BOM）签名，而其他编辑器（此处所示 Code Writer）允许省略此签名。Code Writer\
  \ 是从 Windows Store 提供的免费文本和代码编辑器。\n\n![image](img/Image00006.jpg)\n\n注意，PHP 的 `echo`\
  \ 指令会字面上地写入包含在对 `' '` 单引号内的全部内容。\n\n### 遵循规则编写\n\n#### 标签规则\n\n当 PHP 引擎从 Web 服务器接收到输入时，它会从上到下读取输入，这个过程被称为“解析”。在解析过程中，PHP\
  \ 引擎（又称解析器）寻找起始和结束的 `<?php` 和 `?>` 标签，并理解标签之间的内容是它必须解释的脚本代码。`<?php` 和 `?>` 标签之外的所有内容都会被完全忽略，这允许\
  \ PHP 文件拥有混合内容，并允许 PHP 代码像这样嵌入到 HTML 中：\n\n```html\n<p> 被 PHP 忽略并由浏览器显示</p>\n<?php\
  \ echo '将被解析的脚本代码' ; ?>\n<p> 同样被 PHP 忽略并由浏览器显示</p>\n```\n\n因此为了使其正常工作，当嵌入 HTML 文件时，将所有的\
  \ PHP 脚本代码都包含在起始和结束的 `<?php` 和 `?>` 标签之间是非常重要的。\n\n![image](img/Image00005.jpg)\n\
  \n通常你嵌入的 PHP 代码总会在脚本周围有起始和结束的 `<?php` 标签。\n\n这条规则的唯一例外是 PHP 脚本写在纯 PHP 文件中，该文件只包含代码。在这种情况下，最好省略结束的\
  \ `?>` 标签，如下：\n\n```php\n<?php echo '打印这个优先' ;\necho '打印这个最后';\n```\n\n当 PHP 脚本写在纯\
  \ PHP 文件中时，可以省略结束的 `?>` 标签。PHP 脚本可以使用短标签 `<?=` 和 `?>` 来向 HTML 文档写入单个字符串：\n\n<?=\
  \ 'Hello!' ;` 等同于 `<?php echo 'Hello!' ; ?>`\n\n高级 PHP 脚本也可以在满足条件时插入文本，如下：\n\n```php\n\
  <?php if ( $expression == true ) : ?>\n如果表达式为真插入此文本。\n<?php else : ?>\n否则插入此文本。\n\
  <?php endif ; ?>\n```\n\n![image](img/Image00006.jpg)\n\n条件测试将在书中后面详细介绍。\n\n####\
  \ 语句规则\n\nPHP 语言中的每个语句都必须以 `;` 分号结束，就像英语语言中的每个句子必须以 `.` 句号结束一样。分号被解析器识别为结束它必须必须指令。所以包含两个语句的\
  \ PHP 代码如下：\n\n```php\n<?php echo '第一个语句' ; echo '第二个语句'; ?>\n```\n\nPHP 代码块的结束标签\
  \ `?>` 自动意味着分号，因此你可以省略结束 PHP 块最后一个语句的分号，如下：\n\n```php\n<?php echo '第一个语句' ; echo\
  \ '第二个语句' ?>\n```\n\n![image](img/Image00005.jpg)\n\n如果你愿意，终止 PHP 块的最后一个语句也没有害。\n\
  \n#### 注释规则\n\n为你的 PHP 脚本代码添加注释通常是值得的，以便他人理解，或者在你以后回顾代码时理解。所有的空白和注释都被 PHP 解析器完全忽略，因此你可以尽可能添加注释，而对性能产生任何不利影响。\n\
  \n单行注释可以用 `#` 号字符开始，或者也可以用 `//` 双斜序列开始。\n\n多行（块）注释必须包含在 `/*` 和 `*/` 字符序列之间，如 C 编程语言所示：\n\
  \n```php\n<?php\necho '第一个语句' // 单行注释。\n/* 这是包含两行注释的多行注释。 */\necho '第二个语句' ;\necho\
  \ '最后一个语句' ; # 另一个单行注释。\n?>\n```\n\n![image](img/Image00005.jpg)\n\n`//` 单行注释样式也用于\
  \ C++ 编程，而 `#` 单行注释样式也用于 Unix/Linux BASH 脚本。\n\n### 总结\n\n- PHP 是一种语言特别适用于 Web 开发，因为它可以嵌入\
  \ HTML 中\n- PHP 代码在云端服务器端执行，这与在浏览器客户端执行的 JavaScript 代码不同\n- 当网页包含 PHP 脚本时，Web 服务器将首先调用\
  \ PHP 引擎处理代码，然后将响应发送到网页浏览器\n- 通过在自己的电脑上安装 Web 服务器和 PHP 引擎可以创建开发环境\n\n\n\n\n* `http://localhost`\
  \ URL 是 `http://127.0.0.1` 数值 IP 地址的别名\n* 访问 Abyss Web 服务器控制台需要您的用户名和密码，地址为 `http://localhost:9999`\n\
  * 建议使用预配置的 Abyss Web 服务器软件包来快速简单安装 PHP 引擎\n* 必须配置 Web 服务器以识别脚本，通过设置 `Interface`（接口）、`Interpreter`（解释器）和\
  \ `Associated Extension`（关联扩展）参数将它们重定向到 PHP 引擎\n* PHP 代码指令 `phpinfo()` 可用于生成包含 PHP\
  \ 版本信息的网页\n* 包含 PHP 脚本的文档最好使用流行的 UTF-8 字符格式进行编码\n* PHP `echo` 指令会字面地写入后续引号包含的文本内容\n\
  * 所有嵌入的 PHP 代码必须封装在 `<?php` 和 `?>` 标签内，以便 PHP 引擎识别\n* PHP 语言中的每个语句都必须以 `;` 分号结束\n\
  * 单行注释可以以 `#` 哈希字符或 `//` 双斜杠序列开始\n* 多行块注释必须封装在 `/***` 和 `***/**` 字符序列之间\n\n# 存储值\n\
  \n本章演示了可以存储数据的各种 PHP 容器。\n\n* 创建变量\n* 字符串引用\n* 生成数组\n* 数组排序\n* 描述维度\n* 检查类型\n* 定义常量\n\
  * 探索超全局变量\n* 总结\n\n## 创建变量\n\n“变量”是 PHP 脚本中一个命名的容器，用于存储数据值。存储的值可以使用变量名进行引用，并随着脚本的执行而更改（变化）。脚本作者可以为变量选择任何名称，只要它遵循以下三个命名规范：\n\
  \n* 名称必须以 `$` 美元符号开头——例如 `$name`\n* 名称可以包含字母、数字和下划线字符，但不能包含空格——例如 `$subtotal_1`\n\
  * `$` 符号后的第一个字符必须是字母或下划线字符——不能是数字\n\n![image](img/Image00035.jpg)\n\n注意 PHP 中的变量名是区分大小写的，因此\
  \ `$name`、`$Name` 和 `$NAME` 是三个独立的变量。\n\n![image](img/Image00019.jpg)\n\n在 PHP 中\
  \ `$this` 是一个特殊变量，因此你不能使用 ‘this’ 作为变量名。\n\nPHP 变量是“弱类型”的，这意味着它们包含任何类型的数据，与某些语言中的“强类型”变量不同，后者在创建变量时必须指定数据类型。因此，PHP\
  \ 变量可以很方便地包含一个整数、浮点数、文本字符串、`TRUE` 或 `FALSE` 的布尔值、一个对象或一个 `NULL` 空值。\n\n![image](img/Image00006.jpg)\n\
  \n在整个脚本范围内访问的变量必须具有唯一的名称。关于“变量作用域”，请参阅此处。\n\n在 PHP 脚本中只需声明变量名称即可创建变量。然后可以使用 `=`\
  \ 赋值运算符指定其值来赋予初始值（初始化）。该语句以及 PHP 中的所有其他语句都必须像这样以分号结尾：\n\n```\n$body_temp = 98.6\
  \ ;\n```\n\n然后可以通过引用变量名来显示变量中包含的值，如下所示：\n\n```\necho $body_temp ;\n```\n\n有用的是，可以通过将字符串和变量名封装在双引号中，将变量的值作为混合字符串的一部分显示：\n\
  \n```php\necho “Body temperature is $body_temp degrees Fahrenheit” ;\n```\n\n![image](img/Image00019.jpg)\n\
  \n不要混淆双引号和单引号的作用。记住，PHP 只对封装在双引号内的混合字符串进行变量替换。\n\n双引号确保 PHP 将评估整个字符串并将命名的变量替换为它们存储的值。如果字符串被封装在单引号中，此功能将不起！\n\
  \n![image](img/Image00029.jpg)\n\nvariable.php\n\n![image](img/Image00036.jpg) 创建一个有效的\
  \ HTML 文档，如此处列出的那样的，然后在 body 部分插入 PHP 标签\n\n```php\n<?php\n# 在此处要插入的语句。\n?>\n```\n\
  \n![image](img/Image00037.jpg) 现在，在 PHP 标签之间插入一条语句来创建并初始化变量\n\n```php\n$body_temp\
  \ = 98.6 ;\n```\n\n![image](img/Image00038.jpg) 接下来，插入一条语句单独显示变量值\n\n```php\necho\
  \ $body_temp ;\n```\n\n![image](img/Image00039.jpg) 然后，插入一条语句显示在混合字符串中替换的变量值——赋值在双引号中\n\
  \n```php\necho “<p>Body temperature is $body_temp degrees Fahrenheit “ ;\n```\n\n\
  ![image](img/Image0040.jpg) 插入一条语句为变量赋值新值\n\n```php\n$body_temp = 37.0 ;\n```\n\n\
  ![image](img/Image0041.jpg) 最后，插入一条语句在混合字符串中显示变量值\n\n```php\necho “($body_temp degrees\
  \ Celsius )” ;\n```\n\n![image](img/Image0042.jpg) 将文档保存为 `htdocs` 目录下的 `variable.php`，然后通过\
  \ HTTP 查看显示的变量值\n\n![image](img/Image0043.jpg)\n\n文本“字符串”可以像数值值一样存储在变量中，但必须用引号封装字符串。单引号和双引号都可以用于此目的，但必须使用相同类型的引号来表示开始和结束。例如，这些语句进行了字符串赋值：\n\
  \n```php\n$song_title = “Summertime Blues”\n```\n\n```php\n$song_title = ‘Summertime\
  \ Blues’\n```\n\n当你想存储一个包含引号的文本字符串时，可以在它们前面加上 `\\` 斜杠字符来“转义”包含的引号，或者在字符串中使用另一种引号。例如，这些语句赋值了包含引号的字符串：\n\
  \n```php\n$song_title = “the \\”Summertime\\” aria by Gerswin” ;\n```\n\n```php\n\
  $song_title = ‘the “Summertime” aria by Gerswin’ ;\n```\n\n第二种技术（在字符串中使用双引号）更易读，并且在书中是推荐的。\n\
  \n![image](img/Image00006.jpg)\n\n变量名不能包含空格——但下划线字符常被代替。\n\n通过将混合字符串封装在双引号中，可以将字符串值作为混合字符串的一部分显示，如下：\n\
  \n```php\necho “Many regard $song_title as a popular classic” ;\n```\n\n双引号确保 PHP\
  \ 将评估混合字符串并将命名的变量替换为它们存储的值。如果字符串被封装在单引号中，此功能将不起！\n\n字符串值可以使用 `.` 连接运算符连接（“拼接”）成单个字符串，如下：\n\
  \n```php\n$hi = ‘Hello’ ;\n```\n\n```php\n$bye = ‘Goodbye’ ;\n```\n\n```php\n$song_title\
  \ = $hi . $bye ; # ‘HelloGoodbye’\n```\n\n此外，在连接字符串时可以当地插入空格和标点，因此上面的标题赋值可以修改为包含逗号和空格：\n\
  \n```php\n$song_title = $hi . ‘, ‘ . $bye ; # ‘Hello, Goodbye’\n```\n\n\n\n\n\n\
  # 在此处插入语句。\n\n```php\n<?php\n```\n\n![image](img/Image00037.jpg)  现在，在 PHP 标签之间插入一个语句来创建并初始化两个变量\n\
  \n```php\n$phrase = ‘The truth is rarely pure’ ;\n$author = ‘Oscar Wilde’ ;\n```\n\
  \n![image](img/Image00038.jpg)  接下来，插入一个语句单独显示变量值\n\n```php\necho $phrase ;\n```\n\
