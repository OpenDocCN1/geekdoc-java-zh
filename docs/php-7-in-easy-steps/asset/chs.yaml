  \n### 处理提交\n\n本章到目前为止的示例都使用了两个文档——一个用于显示 HTML 表单，另一个用于处理表单提交。然而，此过程可以通过单个文档完成，使用一种简单的技术来判断应该显示表单还是处理表单。\n\
  \n使用超全局变量 `$_REQUEST_METHOD` 来判断表单是通过 `POST` 还是 `GET` 提交的，从而显示或处理表单。如果表单是通过 `POST`\
  \ 提交，脚本将处理数据并再次显示表单，通常是通过覆盖 `$_POST` 数组来实现，该数组随后将用于验证。\n\n![image](img/Image00029.jpg)\n\
  \nsingle.php\n\n![image](img/Image00036.jpg) 创建一个包含 PHP 脚本的 HTML 文档，该脚本检查请求\n\n\
  ```php\n<?php\nif ( $_SERVER['REQUEST_METHOD'] != 'POST' )\n{\n  # 显示表单\n}\nelse\n\
  {\n  # 处理提交\n}\n?>\n```\n\n![image](img/Image00037.jpg) 现在，使用 `echo` 插入语句显示表单\n\n\
  ```php\necho ‘\n<form action=” single.php ” method=” POST ”>\n...\n?>\n```\n（注意：action\
  \ 属性应指向 `single.php` 文件）\n)\n\n![image](img/Image00038.jpg) 接下来，当表单为 `POST` 时插入一个语句处理提交\n\
  \n```php\nif ( !empty ( $_POST['comment'] ) )\n{\n  $comment = $_POST['comment']\
  \ ;\n  echo “Comment : $comment “ ;\n}\nelse\n{\n  $comment = NULL ; echo ‘You must\
  \ enter a comment’ ;\n}\n```\n\n![image](img/Image00040.jpg) 最后，插入一个语句再次显示表单，并保留提交的数据\n\
  \n```php\n<input type=”text” name=” comment ” value=” <?php if ( isset($_POST['comment']))\
  \ ) echo $_POST['comment'] ; ?> ”>\n```\n（注意：value 属性应使用在 `input` 或 `textarea` 标签内）\n\
  \n\n\n\n\n```html\n<input type=”text” name=” email ” value=” <?php if ( isset( $_POST[\
  \ ‘email’ ] ) ) echo $_POST[ ‘email’ ] ; ?> ”></p>\n<p><input type=”submit”></p>\n\
  </form>\n```\n\n![image](img/Image00037.jpg) 现在，添加一个 PHP 脚本来处理表单提交\n\n```php\n<?php\n\
  if ( $_SERVER[ ‘REQUEST_METHOD’ ] == ‘POST’ )\n{\n// 在此处插入语句（步骤 3-5）。\n}\n?>\n```\n\
  \n![image](img/Image00038.jpg) 接下来，在 PHP 脚本块中插入一个语句创建一个用于错误消息的数组\n\n```php\n$errors\
  \ = array() ;\n```\n\n![image](img/Image00005.jpg) 本示例使用 `$_SERVER[ ‘PHP_SELF’ ]`\
  \ 来确保脚本在重命名后仍然能够工作。\n\n![image](img/Image00006.jpg) `if` 语句通过检查请求方法是否为 `POST` 来测试表单是否已提交，而不是用于显示空表单的\
  \ `GET` 方法。\n\n![image](img/Image00039.jpg) 然后，插入语句使用提交的值初始化变量，或将遗漏项添加到错误数组中\n\n\
  ```php\nif ( empty( $_POST[ ‘name’ ] ) ) { $errors[] = ‘name’ ; }\nelse { $name\
  \ = trim( $_POST[ ‘name’ ] ) ; }\nif ( empty( $_POST[ ‘email’ ] ) ) { $errors[]\
  \ = ‘email’ ; }\nelse { $email = trim( $_POST[ ‘email’ ] ) ; }\n```\n\n![image](img/Image00040.jpg)\
  \ 现在，插入语句写入错误消息或确认表单提交成功\n\n```php\nif( !empty( $errors ) )\n{ echo ‘Error! Please\
  \ enter your ‘ ;\nforeach ( $errors as $msg ) { echo “ - $msg “ ; } }\nelse { echo\
  \ “Success! Thanks $name “ ; }\n```\n\n![image](img/Image00041.jpg) 将文档保存到你 Web\
  \ 服务器的 `/htdocs` 目录中并命名为 `sticky.php`，然后通过 HTTP 打开并提交表单，以查看保留的值和响应消息。\n\n![image](img/Image00170.jpg)\n\
  \n![image](img/Image00171.jpg)\n\n![image](img/Image00005.jpg) 像这里所示使用 `trim()`\
  \ 函数是一个良好的习惯，可以移除提交字段值中的任何前后的空格。\n\n### 上传文件\n\n如果 `<form>` 标签包含设置为“multipart/formdata”的\
  \ `enctype` 属性，PHP 全局变量 `$_FILES` 可以轻松地从 HTML 表单 `POST` 文件上传。提交时，会创建一个 `$_FILES`\
  \ 关联数组，其键包括文件名 `name`、生成的临时名称（`tmp_name`）和文件大小 `size`。文件名和大小可以用于验证。然后可以将临时文件名连同原始文件名传递给\
  \ `move_uploaded_file()` 函数以上传文件：\n\n![image](img/Image00029.jpg)\n\nupload.php\n\
  \n![image](img/Image00036.jpg) 创建一个包含持久化表单的 HTML 文档，其中包含一个名为“image”的文件类型输入\n\n```html\n\
  <form action=” <?php $_SERVER[ ‘PHP_SELF’ ] ?>”\nmethod=”POST” enctype = “multipart/formdata”\
  \ >\n选择要上传的图片：\n<input type=”file” name=” image ” >\n<input type=”submit” value=”Upload\
  \ Image”> </form>\n```\n\n![image](img/Image00037.jpg) 现在添加一个 PHP 脚本来处理表单提交\n\n\
  ```php\n<?php\nif ( $_SERVER[ ‘REQUEST_METHOD’ ] == ‘POST’ )\n{\n// 在此处插入语句（步骤 3-7）。\n\
  }\n?>\n```\n\n![image](img/Image00038.jpg) 接下来，插入语句使用用户选择的文件信息来初始化三个变量\n\n```php\n\
  $name = $_FILES[ ‘ image ’ ][ ‘name’ ] ;\n$temp = $_FILES[ ‘ image ’ ][ ‘tmp_name’\
  \ ] ;\n$size = $_FILES[ ‘ image ’ ][ ‘size’ ] ;\n```\n\n![image](img/Image00039.jpg)\
  \ 现在，插入语句通过测试文件扩展名来确保选的文件是所需的文件类型，否则退出\n\n```php\n$ext = pathinfo( $name , PATHINFO_EXTENSION\
  \ ) ;\n$ext = strtolower( $ext ) ;\nif( $ext != ‘png’ && $ext != ‘jpg’ && $ext !=\
  \ ‘gif’ )\n{ echo ‘Format must be PNG, JPG, or GIF’ ; exit() ; }\n```\n\n![image](img/Image00040.jpg)\
  \ 插入一个语句确保选的文件是所需的文件大小，否则退出\n\n```php\nif( $size > 512000 )\n{ echo ‘File size must\
  \ not exceed 500Kb’ ; exit() ; }\n```\n\n![image](img/Image00019.jpg) PHP 配置必须允许文件上传，此示例才能工作。PHP\
  \ 目录下的配置文件 `php.ini` 必须包含行 `file_uploads = On`。\n\n![image](img/Image00005.jpg)\
  \ `pathinfo()` 函数提供了扩展名。\n\n![image](img/Image00041.jpg) 插入一个语句，通过测试文件扩展名来确保选的文件是所需的文件类型，否则退出\
  \ `file_exists($name)`。\n\n```php\nif( file_exists($name) )\n{\n    // 文件存在\n}\n\
  ```\n\n![image](img/Image00042.jpg) 最后，尝试确保选的文件是所需的文件大小，否则退出 `move_uploaded_file($temp,\
  \ $name)`。\n\n\n\n\n\n\n```css\np#err_msg { color : #F00 ; font-weight : bold ;\
  \ }\n```\n\n![image](img/Image00040.jpg) 将样式表保存到你创建的 `/includes` 文件夹中，与 HTML 头部和页脚文件放在。\n\
  \n![image](img/Image00041.jpg) 最后，创建一个 PHP 脚本，设置网页标题并用头部和页脚内容包裹表单。\n\n```php\n<?php\n\
  $page_title = ‘PHP Include’ ;\ninclude ( ‘includes/header.html’ ) ;\necho ‘<form\
  \ action=” include.php ” method=” POST ”>\n<p>Name: <input type=”text” name=” name\
  \ ”> </p>\n<p>Email: <input type=”text” name=” email ” ></p>\n<p><input type=”submit”></p></form>’\
  \ ;\ninclude ( ‘includes/footer.html’ ) ;\n?>\n```\n\n![image](img/Image00029.jpg)\n\
  \n`include.php`\n\n![image](img/Image00042.jpg) 将 PHP 脚本保存到你 Web 服务器的 `/htdocs`\
  \ 目录下并命名为 `include.php`，然后通过 HTTP 打开查看设置的页面标题和被静态内容包裹的表单。\n\n![image](img/Image00176.jpg)\n\
  \n![image](img/Image00005.jpg)\n\n你可以使用浏览器的“查看源代码”功能查看整个内容已有效整合到单个网页中。\n\n### 附加链接数据\n\
  \nPHP 预定义的“超全局”变量，例如存储页面请求方法的 `$_SERVER` 数组变量，以及在用户退出前存储网站跨页面用户数据的 `$_SESSION` 数组变量，在任何脚本的所有作用域内都是可用的。\n\
  \n![image](img/Image00005.jpg)\n\n`$_SESSION` 超全局变量将用于在第 10 章中存储用户详情。\n\n当 HTML\
  \ 表单使用 `POST` 方法提交数据时，`$_POST` 数组将提交的表单值存储在同名的数组元素中。因此，可以使用 `$_POST['city']` 访问名为“city”的提交字段的值。\n\
  \n同样地，当使用 `GET` 方法提交数据时，`$_GET` 数组将提交的值存储在命名的数组元素中。因此，可以使用 `$_GET['id']` 访问名为“id”的提交数据。这通常用于通过在\
  \ HTML 超链接锚点的 URL 后附加 name=value 对来向脚本提交数据，如下：\n\n```html\n<a href=”www.example.com/script.php?id=1”>\n\
  ```\n\n由超链接指定的接收数据的脚本随后可以使用传递的值来确定响应：\n\n![image](img/Image00029.jpg)\n\n`link.php`\n\
  \n![image](img/Image00036.jpg) 创建一个包含 PHP 脚本的 HTML 文档，该脚本在 `$_GET` 数组中寻找名为“id”的元素。\n\
  \n```php\n<?php\nif ( isset ( $_GET['id'] ) )\n{\n# 在此处插入处理语句（步骤 2-3）。\n}\n```\n\
  \n![image](img/Image00037.jpg) 接下来，插入一个处理语句，将传递的值赋值给同名的 PHP 变量。\n\n```php\n$id =\
  \ $_GET['id'] ;\n```\n\n![image](img/Image00038.jpg) 现在，插入一个处理语句，根据传递的值输出适当的响应。\n\
  \n```php\nswitch( $id )\n{\ncase 1 : echo ‘Cow selected<hr>’ ; break ;\ncase 2 :\
  \ echo ‘Dog selected<hr>’ ; break ;\ncase 3 : echo ‘Goat selected<hr>’ ; break ;\n\
  }\n```\n\n![image](img/Image00039.jpg) 最后，添加语句显示带有附加值的超链接。\n\n```php\necho ‘<h1>Select\
  \ a buddy</h1>’ ;\necho ‘ <p><a href=”link.php? id=1 ”>Cow</a> |’ ;\necho ‘ <a href=”link.php?\
  \ id=2 ”>Dog</a> | ‘ ;\necho ‘ <a href=”link.php? id=3 ”>Goat</a></p>’ ;\n?>\n```\n\
  \n![image](img/Image00040.jpg) 将 PHP 脚本保存到你 Web 服务器的 `/htdocs` 目录下命名为 `link.php`，然后通过\
  \ HTTP 打开并点击链接查看传递值的响应。\n\n![image](img/Image00177.jpg)\n\n![image](img/Image00178.jpg)\n\
  \n![image](img/Image00019.jpg)\n\nPHP 还提供了一个 `$_REQUEST` 超全局变量，它包含 `$_POST` 和 `$_GET`\
  \ 数组的所有内容。这意味着可以使用 `$_REQUEST['city']` 访问 `$_POST['city']`，但应该避免这样做。请始终始终根据提交类型使用特定的数组。\n\
  \n![image](img/Image00006.jpg)\n\n注意传递的 name=value 对在浏览器的地址栏中可见。\n\n### 总结\n\n-\
