  ![image](img/Image00005.jpg)\n\n### 总结\n\n- 网上有许多 Web 服务可用，它们提供了可以有效地整合到你的网页中的免费数据。\n\
  - 大多数 Web 服务提供以 XML（eXtensible Markup Language）格式提供的数据。这种格式设计为人类可读和机器可读，且不依赖于任何平台。例如，Java\
  \ 程序可以通过互联网发送 XML 数据，反之亦然。\n- XML 看起来非常像 HTML，但你可以定义自己的元素名称。XML 标签可能包含属性，重要的是每个元素都有开始和结束标签，这样\
  \ XML 文档才是“格式良好的”（well-formed）。\n- 所有 XML 文档必须以 XML 类型声明开头——就像此处所示所示。\n\n![image](img/Image00214.jpg)\n\
  \n![image](img/Image00215.jpg)\n\ncatalog.xml\n\n\n\n\n\nPHP 提供了一个名为“SimpleXML”的\
  \ XML 解析器，它可以将 XML 文档加载到内存中作为层级树结构。`simplexml_load_file()` 函数需要 XML 文件的名称和路径，以将文档转换为包含\
  \ `SimpleXMLElement` 对象的数据结构。然后可以使用 `var_dump()` 函数来遍历该数据结构。\n\n![image](img/Image00029.jpg)\n\
  \ncatalog.php\n\n![image](img/Image00085.jpg)  用一个语句开始 PHP 脚本，设置页面标题并保留文本格式\n\n\
  ```php\n<?php\necho ‘<title>PHP SimpleXML</title><pre> ;\n```\n\n![image](img/Image00086.jpg)\
  \  接下来，添加一个语句来加载 XML 数据或退出\n\n```php\n$xml = simplexml_load_file( ‘catalog.xml’\
  \ )\nor die( ‘Unable to load data!’ ) ;\n```\n\n![image](img/Image00087.jpg)  现在，显示所有的\
  \ SimpleXMLElement 对象\n\n```php\nvar_dump( $xml ) ;\n```\n\n![image](img/Image00088.jpg)\
  \  将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `catalog.php`，与 `catalog.xml` 文件放在一起，然后通过 HTTP\
  \ 打开该页面以查看 SimpleXMLElement 对象\n\n![image](img/Image00216.jpg)\n\n![image](img/Image00005.jpg)\n\
  \n注意，此数据结构描述了一个名为“book”的数组，它有五个数组元素——对应五个 XML `<book>` 元素。\n\n![image](img/Image00006.jpg)\n\
  \nXML 的无处不在使其成为跨互联网传输数据的理想选择。\n\n## 获取节点\n\nSimpleXML 对象包含的数据结构描述了外部和内部 XML 元素之间的父子关系。数据结构中的每个成员被称为“节点”（node）。顶层节点是\
  \ SimpleXML 对象本身的直接子后代，因此可以使用对象名、`->` 对象操作符和子节点名称来引用。例如，`$object->child`。子节点的子（孙子节点）可以通过进一步添加一个\
  \ `->` 对象操作符和孙子节点名称来引用，例如 `$object->child->grandchild`，每一代都以此类推：\n\n![image](img/Image00029.jpg)\n\
  \nnodes.php\n\n![image](img/Image00085.jpg)  用一个语句开始 PHP 脚本，设置页面标题\n\n```php\n<?php\n\
  echo ‘<title>PHP SimpleXML</title>’ ;\n```\n\n![image](img/Image00086.jpg)  添加一个语句来加载\
  \ XML 数据或退出\n\n```php\n$xml = simplexml_load_file( ‘catalog.xml’ )\nor die( ‘Unable\
  \ to load data!’ ) ;\n```\n\n![image](img/Image00087.jpg)  接下来，获取作为第一个“book”元素子节点的“title”元素的内容\n\
  \n```php\necho ‘First book : ‘ .\n$xml -> book[0] -> title . ’ in easy steps<br>\
  \ ;\n```\n\n![image](img/Image00088.jpg)  现在，获取作为第一个“book”元素子节点的“category”元素的内容\n\
  \n```php\necho ‘Language category : ‘ . $xml -> book[0] -> category ;\n```\n\n![image](img/Image00089.jpg)\
  \  将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `nodes.php`，与 `catalog.xml` 文件放在一起，然后通过 HTTP\
  \ 打开该页面以查看节点内容\n\n![image](img/Image00217.jpg)\n\n![image](img/Image00005.jpg)\n\
  \n由于在同一层级上有五个“book”节点，在例例中它们被创建为一个数组。因此，每个节点都可以使用其节点名称和数组索引号单独进行引用。\n\n## 遍历节点\n\
  \nSimpleXML 对象提供了方法来处理包含在其数据结构中的数据。有用的是，它的 `children()` 方法返回所有子节点，并用于遍历节点以检索每个节点的内容：\n\
  \n![image](img/Image00029.jpg)\n\nnodes-loop.php\n\n![image](img/Image00085.jpg)\
  \  用一个语句开始 PHP 脚本，设置页面标题\n\n```php\n<?php\necho ‘<title>PHP SimpleXML</title>’ ;\n\
  ```\n\n![image](img/Image00086.jpg)  添加一个语句来加载 XML 数据或退出\n\n```php\n$xml = simplexml_load_file(\
  \ ‘catalog.xml’ )\nor die( ‘Unable to load data!’ ) ;\n```\n\n![image](img/Image00087.jpg)\
  \  接下来，初始化迭代计数器为零\n\n```php\n$counter = 0 ;\n```\n\n![image](img/Image00088.jpg)\
  \  现在，添加一个循环来增加计数器并显示所有“title”和“category”子节点的内容\n\n```php\nforeach( $xml ->children()\
  \ as $book )\n{\n    $counter ++ ;\n    echo ‘Book ‘ . $counter . ’ : ‘ ;\n    echo\
  \ $book -> title . ’ in easy steps [’ . $book -> category . ’]<hr> ;\n}\n```\n\n\
  ![image](img/Image00089.jpg)  将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `nodes-loop.php`，与\
  \ `catalog.xml` 文件放在一起，然后通过 HTTP 打开该页面以查看节点内容\n\n![image](img/Image00216.jpg)\n\n\
  ![image](img/Image00005.jpg)\n\n## 获取属性\n\n`SimpleXMLElement` 内部的值可以通过在节点名称后加上引号内的属性名来引用。例如，`$object['feature']`。\n\
  \n![image](img/Image00029.jpg)\n\nattribs.php\n\n![image](img/Image00085.jpg)  用一个语句开始\
  \ PHP 脚本，设置页面标题\n\n```php\n<?php\necho ‘<title>PHP SimpleXML</title> ;\n```\n\n\
  ![image](img/Image00086.jpg)  添加一个语句来加载 XML 数据或退出\n\n```php\n$xml = simplexml_load_file(\
  \ ‘catalog.xml’ )\nor die( ‘Unable to load data!’ ) ;\n```\n\n![image](img/Image00087.jpg)\
  \  接下来，获取作为第一个“book”元素子节点的“title”元素的内容\n\n```php\necho ‘First book : ‘ .\n$xml ->\
  \ book[0] -> title . ’ in easy steps<br> ;\n```\n\n![image](img/Image00088.jpg)\
  \  现在，获取作为第一个“book”元素子节点的“category”元素的内容\n\n```php\necho ‘Cover : ‘ .\n$xml -> book[0]\
  \ -> title['cover'] . ’> ;\n```\n\n![image](img/Image00089.jpg)  使用上一步获取的值来显示图片\n\
  \n![image](img/Image00216.jpg)\n\n![image](img/Image00006.jpg)\n\n注意这里的每个属性都是 `images/`\
  \ 目录下的图片文件名。\n\n## 遍历属性\n\nSimpleXML 对象的 `children()` 方法可以再次用于遍历节点并在每次迭代中获取节点的值：\n\
  \n![image](img/Image00029.jpg)\n\nattribs-loop.php\n\n![image](img/Image00085.jpg)\
  \  用一个语句开始 PHP 脚本，设置页面标题\n\n```php\n<?php\necho ‘<title>PHP SimpleXML</title> ;\n\
  ```\n\n![image](img/Image00086.jpg)  添加一个语句来加载 XML 数据或退出\n\n```php\n$xml = simplexml_load_file(\
  \ ‘catalog.xml’ )\nor die( ‘Unable to load data!’ ) ;\n```\n\n![image](img/Image00087.jpg)\
  \  接下来，初始化迭代计数器为零\n\n```php\n$counter = 0 ;\n```\n\n![image](img/Image00088.jpg)\
  \  现在，添加一个循环来增加计数器并显示其值，然后在每次迭代中获取一个属性值以显示图片\n\n```php\nforeach( $xml ->children()\
  \ as $book )\n{\n    $counter ++ ;\n    echo ‘ ‘ . $counter . ‘: ‘ ;\n    echo ‘<img\
  \ src=” . $book -> title['cover'] . ’>’ ;\n}\n```\n\n![image](img/Image00089.jpg)\
  \  将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `attribs-loop.php`，与 `catalog.xml` 文件放在一起，然后通过\
  \ HTTP 打开该页面以查看每次迭代中显示的计数器和图片\n\n![image](img/Image00220.jpg)\n\n![image](img/Image00005.jpg)\n\
  \n**包含订阅**\n\nSimpleXMLElement 对象还提供了一个 `attributes()` 方法，可以返回元素内所有属性名称和值的关联数组。例如，`$obj->child->attributes()`。\n\
  \n\n\n\n正如前几页所述，通过 PHP 脚本访问 XML 文档中数据的能力，我们可以轻松地整合来自外部源的数据。许多 Web 服务以免费提供的 RSS（富内容摘要/简单聚合）馈的形式提供。在互联网上搜索“rss\
  \ feed directory”可以找到许多对免费馈源进行分类的网站。RSS 馈以 XML 格式提供定期更新的数据。\n\n![image](img/Image00221.jpg)\n\
  \n你可以在 **[rssboard.org](http://www.rssboard.org)** 了解更多关于 RSS 的信息，并将任何 RSS 馈的 URL\
  \ 输入到他们的验证器中查看其 XML 元素。\n\nYahoo! 开发者网络 (YDN) 在 **[real.developer.yahoo.com/rss](http://real.developer.yahoo.com/rss)**\
  \ 提供了许多带有有用免费 RSS 馈。\n\n使用它们的唯一要求是你必须在显示这些内容的网页上包含对 Yahoo! 的属性。\n\nYahoo! 提供的免费\
  \ RSS 馈之一提供了定期更新的描述娱乐新闻项目的内容，可以在 **[`news.yahoo.com/rss/entertainment`](http://news.yahoo.com/rss/entertainment)**\
  \ 找到。\n\n这些内容以 XML 文件的形式传递到浏览器，浏览器可以通过在外部元素上添加按钮来显示，你可以点击这些按钮来展开 (+) 或收叠 (-) 嵌套元素。\n\
  \nRSS 是 XML 的一种方言，其中所有文档都必须具有一个包含 `<channel>` 元素的顶层 `<rss>` 元素。数据被封装在内部元素中：\n\n\
  ![image](img/Image00222.jpg)\n\n![image](img/Image00223.jpg)\n\n这里高亮的标签可以用于获取最感兴趣的数据。所示折叠状态的\
  \ item 标签也包含描述每个项目的 title、description、link 和“pubDate”元素。\n\n![image](img/Image00029.jpg)\n\
  \n### rss.php\n\n![image](img/Image00085.jpg) 开始编写一个 PHP 脚本，使用一个语句从 RSS 馈中加载 XML\
  \ 数据或退出\n\n```php\n<?php\n$url = ‘http://rss.news.yahoo.com/rss/entertainment’ ;\n\
  $xml = simplexml_load_file( $url ) or die( ‘Unable to load data!’ ) ;\n```\n\n![image](img/Image00086.jpg)\
  \ 接下来，添加一个语句加载页面页头文件\n\n```php\ninclude( ‘includes/rss-header.html’ ) ;\n```\n\n\
  ![image](img/Image00087.jpg) 现在，显示每个新闻项目，然后是页面页脚\n\n```php\nforeach ( $xml -> channel\
  \ -> item as $item ) {\n    echo ‘<a href=”’ . $item -> link . ’”>’ . $item -> title\
  \ . ’</a>’ ;\n    echo ‘<br><small>’ . $item -> pubDate . ’</small><br>’ ;\n   \
  \ echo $item -> description . ‘<hr>’ ; \n}\ninclude( ‘includes/rss-footer.html’\
  \ ) ;\n```\n\n![image](img/Image00088.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `rss.php`，然后通过\
  \ HTTP 打开页面以查看新闻\n\n![image](img/Image00224.jpg)\n\n![image](img/Image00006.jpg)\n\
  \nYahoo! RSS 馈的使用条款要求你必须页面上显示属性说明。\n\n### 设置参数\n\n某些 Web 服务提供静态 URL（例如上一个示例中的 Yahoo!\
  \ RSS 馈），它仅交付由内容供应商预先定义的 XML 数据。其他 Web 服务提供更灵活的 API（应用程序接口），允许你在 URL 请求中指定参数，以决定你将接收的数据及其格式。\n\
  \n![image](img/Image00225.jpg)\n\n在 [**openweathermap.org**](http://www.openweathermap.org)\
  \ 发现更多关于 OpenWeatherMap 的信息并注册获取你自己的 ID 密钥。\n\nOpenWeatherMap 有一个免费的当前天气数据 API，可以在\
  \ **[`api.openweathermap.org/data/2.5/weather`](http://api.openweathermap.org/data/2.5/weather)**\
  \ 找到。\n\n当前天气数据 API 允许你以多种形式请求天气数据。该 API 提供的参数包括：\n\n- `q` = 城市（或城市名、国家代码）\n- `units`\
  \ = 公制（摄氏度）、英制（华氏度）或标准（开尔文，默认）温度单位\n- `mode` = xml、html 或 json（默认）格式\n- `appid`\
  \ = 必需的授权密钥，在 OpenWeatherMap 注册后免费提供\n\n参数和所需的 `=` 值在 `?` 之后附加到 OpenWeatherMap URL\
  \ 后，并用 `&` 分隔。\n\n来自 OpenWeatherMap 的响应可以作为 XML 文件交付，可以使用 PHP 的 `asXml()` 函数指定文件名，将其写入\
  \ Web 服务器的 `/htdocs` 文件夹。可以在浏览器中检查它以发现所获取的数据性质、XML 元素名称、属性名称和结构：\n\n![image](img/Image00029.jpg)\n\
  \n### params.php\n\n![image](img/Image00085.jpg) 开始编写 PHP 脚本，为四个变量分配字符串值，这些变量将用于设置响应参数\n\
  \n```php\n<?php\n$city = ‘New York’ ;\n$units = ‘imperial’ ;\n$mode = ‘xml’ ;\n\
  $id = ‘28df3c64f387cf55026e0de3fb8beaa4’ ;\n```\n\n![image](img/Image00086.jpg)\
  \ 接下来，添加一个语句使用参数值构建请求字符串\n\n```php\n$request = ‘http://api.openweathermap.org/data/2.5/weather?’\
  \ .\n‘q=’ . $city . ’&units=’ . $units . ’&mode=’ . $mode . ’&APPID=’ . $id ;\n\
  ```\n\n![image](img/Image00087.jpg) 现在，添加一个语句使用参数加载 XML 数据或退出\n\n```php\n$xml =\
  \ simplexml_load_file( $request ) or die( ‘Unable to load data!’ ) ;\n```\n\n![image](img/Image0025)\
  \ 当收到响应时，尝试将内容作为 XML 文件写入 Web 服务器的 `/htdocs` 目录\n\n```php\ntry {\n    $xml->asXml(\
  \ ‘params.xml’ );\n    // step 5.\n} catch( Exception $e ) {\n    echo ‘Error :\
  \ ‘ . $e->getMessage() ;\n}\n```\n\n![image](img/Image0089.jpg) 语句将浏览器重定向到新创建的 XML\
  \ 文档\n\n```php\nheader( ‘Location: params.xml’ ) ;\n```\n\n![image](img/Image0226.jpg)\
  \ 响应将包含天气数据。\n\n![image](img/Image0027.jpg) 这里高亮的数据是感兴趣的。\n\n### 选择组件\n\n在上一页检查来自\
  \ OpenWeatherMap 的响应后，可以将选组件动态整合到 PHP 应用中：\n\n![image](img/Image0029.jpg)\n\n###\
  \ weather.php\n\n![image](img/Image0085.jpg) 通过加载页头文件开始编写 PHP 脚本\n\n```php\n<?php\n\
  include( ‘includes/weather-header.html’ ;\n```\n\n![image](img/Image0086.jpg) 接下来，添加一个条件判断查看页面是否通过表单提交\n\
  \n```php\nif( $_SERVER['REQUEST_METHOD'] == ‘POST’ ) {\n    // steps 3-6.\n}\n```\n\
  \n![image](img/Image0087.jpg) 在条件判断块内，为四个变量分配字符串值\n\n```php\n$city = ( empty( $_POST['city']\
  \ ) ) ? ”New York”: $_POST['city'] ;\n$units = ‘imperial’ ;\n$mode = ‘xml’ ;\n$id\
  \ = ‘28df3c64f387cf55026e0de3fb8beaa4’ ;\n```\n\n![image](img/Image0088.jpg) \n\n\
  ![image](img/Image0091.jpg) 最后，插入语句输出获取的数据\n\n```php\n$icon = ‘ http://openweathermap.org/img/w/’\
  \ .\n$xml->weather['icon'] .’.png’ ;\necho ‘<h1>Today in ‘ . $xml->city['name']\
  \ .\n’ it\\’s <img src=’ . $icon . ’></h1>’ ;\necho ‘<<ul>><li>Temperature : ‘ .\
  \ $xml->temperature['value'] ;\n```\n\n\n\n\n```php\necho ‘&deg; ‘ . $xml->temperature[\
  \ ‘unit’ ] ;\necho ‘<li>Wind : ‘ . $xml->wind->speed[ ‘name’ ] ;\necho ‘<li>Humidity\
  \ : ‘ . $xml->humidity[‘value’] . ’&#37;</ul> ;\n```\n\n![image](img/Image00005.jpg)\n\
  \n注意，如果在没有用户输入的情况下提交表单，将分配一个默认城市值。\n\n![image](img/Image00005.jpg)\n\n`icon` 属性的值是一个\
  \ PNG 文件的名称。当与路径和 `.png` 文件扩展名拼接时，它将提供合适的天气图像。\n\n![image](img/Image00096.jpg) 在测试块之后，添加语句来创建一个表单\n\
  \n```php\necho ‘<form method=”POST ” action=”weather.php ”>’ ;\necho ‘<fieldset><legend>Enter\
  \ City Name</legend>’ ;\necho ‘ <input type=”text” name=”city” ;\necho ‘<input type=”submit”\
  \ name=”submission” value = ”Get Weather”>’ ;\necho ‘</fieldset></form>’ ;\n```\n\
  \n![image](img/Image00228.jpg) 最后，在脚本中加载页面页脚文件，以表示此应用所用技术的图标\n\n```php\ninclude(\
  \ ‘includes/weather-footer.html’ ) ;\n```\n\n![image](img/Image00229.jpg) 将 PHP\
  \ 脚本保存到 Web 服务器的 `/htdocs` 目录下并为 `weather.php`，然后通过 HTTP 打开页面并提交表单，查看默认纽约位置的天气。输入另一个城市名称并重新提交，以查看相应的天气报告\n\
  \n![image](img/Image00230.jpg)\n\n![image](img/Image00231.jpg)\n\n![image](img/Image00006.jpg)\n\
  \n`action` 属性指定相同的脚本文件名，以使表单保持刷新（sticky）。\n\n### 总结\n\n- 每个 XML 元素必须有起始标签和结束标签，并正确嵌套以确保良好的格式\n\
  - PHP 有一个名为 `SimpleXML` 的 XML 解析器，它可以将 XML 文档加载到内存中形成分级树结构\n- `simplexml_load_file()`\
  \ 函数创建一个 `SimpleXMLElement` 对象的数据结构\n- `SimpleXML` 对象的数据结构描述了外部和内部 XML 元素之间的父子关系\n\
  - `SimpleXML` 数据结构的每个成员都是一个节点\n- 顶层节点是 `SimpleXML` 对象本身的直接子后代\n- 使用 `->` 对象运算符引用节点来寻位分级树结构中的每一层\n\
  - `children()` 方法返回所有子节点，并用于遍历树节点以检索每个节点的内容\n- 可以通过在节点名称后的括号内用引号写出属性名称来引用属性\n- RSS\
  \ 馈以 XML 格式提供定期更新的数据\n- RSS 是 XML 的一种方言，所有文档必须包含一个顶层 `<rss>` 元素，其中包含一个 `<channel>`\
  \ 元素\n- Web 服务（Web Services）可能提供静态 URL 或 API，允许你在 URL 请求中指定参数\n- 参数值通过 `=` 字符指定，并在\
  \ `?` 之后附加到 URL 后，并用 `&` 分隔\n- `SimpleXML` 对象可以使用 `asXml()` 函数写入服务器上的 XML 文件\n-\
  \ \n- `SimpleXML` 对象的选定组件可以动态集成到 PHP 应用中\n\n![image](img/Image00232.jpg)\n\n![image](img/Image00233.jpg)\n\
  \n![image](img/Image00234.jpg)\n\n"
