  \n本章演示了各种 PHP 控制结构，这些结构决定了脚本将如何执行。\n\n- 寻求真相\n- 提供备选方案\n- 切换分支\n- 执行循环\n- 在真时循环\n\
  - 跳出循环\n- 总结\n\n## 寻求真相\n\n`if` 关键字用于执行基础条件测试，评估给定表达式的 `TRUE` 或 `FALSE` 布尔值。评估后大括号内的语句仅在表达式判断为\
  \ `TRUE` 时才会执行。当表达式判断为 `FALSE` 时，PHP 解析器将直接移动到脚本的下一部分。\n\n![image](img/Image00005.jpg)\n\
  \n`if` 结构是 PHP 中最重要的特性之一，在大多数其他编程语言也是如此。\n\n`if` 条件测试语句的语法如下：\n\n```php\nif ( test-expression\
  \ ) { statement-to-execute-when-true ; }\n```\n\n当测试为 `TRUE` 时，可能有多个要执行的语句，但每个语句都必须以分号结束：\n\
  \n```php\nif ( test-expression )\n{\n    statement-to-execute-when-true;\n    statement-to-execute-when-true;\n\
  \    statement-to-execute-when-true;\n}\n```\n\n可以使用逻辑运算符 `&&` 或 `and` 来测试多个表达式，以确保只有当两个表达式都判断为\
  \ `TRUE` 时才会执行后续语句，如下所示：\n\n```php\nif ( ( test-expression ) && ( test-expression\
  \ ) )\n{\n    statement-to-execute-when-true;\n    statement-to-execute-when-true;\n\
  \    statement-to-execute-when-true;\n}\n```\n\n![image](img/Image00005.jpg)\n\n\
  当要执行的代码只是单个语句时，可以省略省略大括号，但你可能为了一致性而于始终包含大括号。\n\n或者，可以嵌套 `if` 条件测试语句来测试多个表达式，使得只有在所有测试都判断为\
  \ `TRUE` 时才会执行语句，如下所示：\n\n```php\nif ( test-expression )\n{\n    if ( test-expression\
  \ )\n    {\n        statement-to-execute-when-true;\n        statement-to-execute-when-true;\n\
  \        statement-to-execute-when-true;\n    }\n}\n```\n\n可以创建多个 `if` 条件测试语句，为脚本提供备选执行路径。\n\
  \n![image](img/Image00029.jpg)\n\nif.php\n\n![image](img/Image00067.jpg) 在 PHP 标签之间，用一个初始化整数变量的语句开始脚本\n\
  \n```php\n<?php\n$num = 8 ;\n```\n\n![image](img/Image00068.jpg) 接下来，添加语句，当数值大小的条件测试判断为\
  \ `TRUE` 时输出结果\n\n```php\nif ( $num > 5 ) { echo \"$num exceeds 5<br>\"; ; }\nif\
  \ ( $num <= 5 ) { echo \" $num is below 6<br>\"; ; }\n```\n\n![image](img/Image00069.jpg)\
  \ 现在，添加语句，当奇偶性的条件测试判断为 `TRUE` 时输出结果\n\n```php\nif ( $num % 2 == 0 ) { echo \"$num\
  \ is Even<br>\"; ; }\nif ( $num % 2 != 0 ) { echo \"$num is Odd<br>\"; ; }\n```\n\
  \n![image](img/Image00070.jpg) 在 PHP 标签之间，用一个仅在测试表达式为 `TRUE` 时输出结果的语句开始脚本\n\n```php\n\
  <?php\n$num = 8 ;\n```\n\n![image](img/Image00071.jpg) 修改变量，只有在测试表达式为 `TRUE` 时从浏览器保存结果\n\
  \n```php\n$num = 3 ;\n```\n\n![image](img/Image00072.jpg) 接下来，添加一个仅在测试表达式判断为 `TRUE`\
  \ 时输出结果的语句\n\n```php\nif ( 4 > 2 ) { echo '<p>Yes, 4 is greater than 2 <br>'; ;\
  \ }\n```\n\n```\n\n## 提供备选方案\n\n通常最好通过附加 `else` 语句来扩展 `if` 语句，指定在表达式判断为 `FALSE`\
  \ 时执行的大括号内的语句：\n\n```php\nif ( test-expression )\n{\n    statement-to-execute-when-true;\n\
  }\nelse\n{\n    statement-to-execute-when-false;\n}\n```\n\n![image](img/Image00074.jpg)\n\
  \n也可以通过添加 `elseif` 语句在条件测试中评估替代表达式，指定在备选方案判断为 `TRUE` 时执行的大括号内的语句：\n\n```php\nif\
  \ ( test-expression )\n{\n    statement-to-execute-when-true;\n}\nelseif ( test-expression\
  \ )\n{\n    statement-to-execute-when-true;\n}\nelse\n{\n    statement-to-execute-when-false;\n\
  }\n```\n\n这种基础编程技术根据评估结果为脚本提供不同的执行方向，被称为“条件分支”。\n\n![image](img/Image00005.jpg)\n\
  \n`elseif` 关键字也可以写成两个独立的单词：`else if`。\n\n![image](img/Image00019.jpg)\n\n你可能会遇到使用\
  \ `:` 而不是大括号的 PHP 脚本。这不被推荐，因为 `if` 和 `else if` 只有在使用大括号时才被认为完全相同。\n\n![image](img/Image00029.jpg)\n\
  \nelse.php\n\n![image](img/Image00067.jpg) 在 PHP 标签之间，用一个仅在测试表达式为 `TRUE` 时输出结果的语句开始脚本\n\
  \n```php\n<?php\nif ( 4 > 2 ) { echo '<p>Yes, 4 is greater than 2 <br>'; ; }\n```\n\
  \n```\n\n![image](img/Image00068.jpg) 接下来，添加一个仅当两个测试表达式都判断为 `TRUE` 时输出结果的语句\n\n\
  ```php\nif ( ( 4 > 2 ) && ( 8 > 4 ) )\n```\n\n\n\n\n\n```php\n{ echo ‘4 is greater\
  \ than 2 AND 8 is greater than 4<br>’ ; }\n```\n\n![image](img/Image00069.jpg) 现在，添加一个语句，当测试表达式被判断为\
  \ `TRUE` 或 `FALSE` 时输出结果：\n\n```php\nif ( 4 > 8 )\n{\n echo ‘4 is greater than 8\
  \ <br>’ ;\n}\nelse\n{\n echo ‘4 is less than 8 <br>’ ;\n}\n```\n\n![image](img/Image00070.jpg)\
  \ 最后，添加一个语句，当两个测试表达式之一被判断为 `TRUE` 或当两个测试表达式都被判断为 `FALSE` 时输出结果：\n\n```php\nif (\
  \ 4 > 8 )\n{\n echo ‘This test is True </p>’ ;\n}\nelseif ( 8 > 4 )\n{\n echo ‘Alternative\
  \ test is True </p>’ ;\n}\nelse\n{\n echo ‘Both tests are False </p>’ ;\n}\n?>\n\
  ```\n\n![image](img/Image00072.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `else.php`，然后通过\
  \ HTTP 打开页面查看条件分支的显示结果。\n\n![image](img/Image00075.jpg)\n\n![image](img/Image00006.jpg)\n\
  \n你可以嵌套条件 `if` 测试（在一个内部嵌套另一个），使得内部块中的语句只有在两个测试都被判断为 `TRUE`时才会执行。\n\n## 切换分支\n\n\
  当测试表达式仅评估一个条件时，通过多个 `if-elseif-else` 语句执行的条件分支通常可以通过 `switch` 语句更高效地完成。\n\n`switch`\
  \ 语句的工作很特殊。它接受一个给定的值作为参数参数，然后从多个 `case` 语句中匹配该值。找到匹配项时执行的代码包含在每个 `case` 语句中。\n\n\
  重要的是每个 `case` 语句都应该以 `break` 关键字语句结束，这样 `switch` 语句在找到匹配项后就会退出，而不会继续寻找其他匹配项——除非这是刻意的要求。\n\
  \n可选地，`case` 语句列表后面可以跟一个单一的 `default` 语句，用于指定在任何 `case` 语句中都没有找到匹配项时执行的代码。因此，switch\
  \ 语句的语法通常如下所示：\n\n```php\nswitch ( test-value )\n{\ncase match-value : statements-to-execute-when-matched\
  \ ; break ;\ncase match-value : statements-to-execute-when-matched ; break ;\ncase\
  \ match-value : statements-to-execute-when-matched ; break ;\ndefault : statements-to-execute-when-no-match-found\
  \ ;\n}\n```\n\n![image](img/Image00005.jpg)\n\n包含一个 `default` 语句总是好主意——即使它只是在 `switch`\
  \ 语句失败时输出一条错误消息。\n\n一个 `switch` 语句可以有很多 `case` 语句，但它的两个 `case` 语句不能尝试匹配相同的值。\n\n\
  当多个 `match-values` 需要执行相同的语句时，仅最后的 `case` 语句需要包含要执行的语句和退出 `switch` 语句块的 `break`\
  \ 语句。例如，为匹配值为 0、1 和 2 输出相同的消息：\n\n```php\nswitch ( $number )\n{\ncase 0 :\ncase\
  \ 1 :\ncase 2 : echo ‘Less than 3’ ; break ;\ncase 3 : echo ‘Exactly 3’ ; break\
  \ ;\ndefault : echo ‘Greater than 3 or less than zero’ ;\n}\n```\n\n![image](img/Image00006.jpg)\n\
  \n`default` 语句不需要出现在 `switch` 块的末尾，但将其放在那里是有逻辑的，因为那里不需要 `break` 语句。\n\n![image](img/Image00029.jpg)\n\
  \nswitch.php\n\n![image](img/Image00067.jpg) 在 PHP 标签之间，使用初始化两个整数和字符变量变量语句开始脚本：\n\
  \n```php\n<?php\n$number = 2 ; $letter = ‘B’ ;\n```\n\n![image](img/Image00068.jpg)\
  \ 接下来，添加一个 `switch` 语句来匹配整数值：\n\n```php\nswitch ( $number )\n{\ncase 1 : echo ‘Number\
  \ is One<br>’ ; break ;\ncase 2 : echo ‘Number is Two<br>’ ; break ;\ncase 3 : echo\
  \ ‘Number is Three<br>’ ; break ;\ndefault : echo ‘Number is Unrecognized<br>’ ;\n\
  }\n```\n\n![image](img/Image00069.jpg) 现在，添加一个 `switch` 语句来匹配字符值：\n\n```php\nswitch\
