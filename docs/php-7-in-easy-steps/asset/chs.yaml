  \  现在，添加一个语句关闭数据库连接\n\n```php\nmysqli_close( $dbc ) ;\n```\n\n![image](img/Image00070.jpg)\
  \  添加一个最终语句包含页脚\n\n```php\ninclude ( ‘includes/footer.html’ ) ;\n\n?>\n```\n\n![image](img/Image00072.jpg)\
  \  将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `create_forum.php`，然后通过 HTTP 打开页面以创建论坛表\n\n\
  ![image](img/Image00202.jpg)\n\n![image](img/Image00005.jpg)\n\n`VARCHAR` 数据类型指定字符长度，而\
  \ `TEXT` 数据类型可以容纳多达 65,535 个字符。\n\n![image](img/Image00005.jpg)\n\n`mysqli_query()`\
  \ 函数执行 SQL 查询，而 `mysqli_error()` 函数会在发生时提供报告。\n\n\n\n\n\n$page_title = ‘PHP Process\
  \ Error’ ;\n\n![image](img/Image00068.jpg) 接下来，添加一条语句来包含页眉\n\n```php\ninclude (\
  \ ‘includes/header.html’ ) ;\n```\n\n![image](img/Image00069.jpg) 现在，添加一个退出函数，在验证失败时显示通知和返回帖子页的链接\n\
  \n```php\nfunction fail( $str )\n{\n    echo “<p>Please enter a $str .</p>” ;\n\
  \    echo ‘<p><a href=”post.php”>Post Message</a>’ ;\n    include ( ‘includes/footer.html’\
  \ ) ;\n    exit() ;\n}\n```\n\n![image](img/Image00070.jpg) 添加测试以确保表单已提交\n\n```php\n\
  if( isset( $_POST[ ‘message’ ] )\n{\n    // 在此处插入语句（第 5 步）。\n    // 在此处插入语句（第 6\
  \ 步）。\n    // 在此处插入语句（第 7 步）。\n}\n```\n\n![image](img/Image00006.jpg)\n\n此脚本由 `post.php`\
  \ 中的表单提名，用于处理提交的用户数据消息。然而，表单并不是“粘性”的——这意味着如果用户必须返回表单以完成空输入字段，任何输入的字段数据将不会被保留。\n\n\
  ![image](img/Image00072.jpg) 添加测试以确保用户已填写所有表单字段\n\n```php\nif ( !empty( trim( $_POST[\
  \ ‘first_name’ ] ) ) )\n{ $first_name = addslashes( $_POST[ ‘first_name’ ] ) ; }\n\
  else { fail( ‘First Name’ ) ; }\n\nif ( !empty( trim( $_POST[ ‘last_name’ ] ) )\
  \ )\n{ $last_name = addslashes( $_POST[ ‘last_name’ ] ) ; }\nelse { fail( ‘Last\
  \ Name’ ) ; }\n\nif ( !empty( trim( $_POST[ ‘subject’ ] ) ) )\n{ $subject = addslashes(\
  \ $_POST[ ‘subject’ ] ) ; }\nelse { fail( ‘Subject’ ) ; }\n\nif ( !empty( trim(\
  \ $_POST[ ‘message’ ] ) ) )\n{ $message = addslashes( $_POST[ ‘message’ ] ) ) ;\
  \ }\nelse { fail( ‘Message’ ) ; }\n```\n\n![image](img/Image00082.jpg) 当验证成功时，打开数据库连接\n\
  \n```php\nrequire ( ‘../connect_db.php’ ) ;\n```\n\n![image](img/Image00203.jpg)\
  \ 现在，插入语句将提交的 HTML 表单字段值插入到 MySQL “forum”数据库表中\n\n```php\n$sql = “INSERT INTO forum\n\
  ( first_name, last_name, subject, message, post_date )\nVALUES\n(‘ $first_name ’,\
  \ ‘ $last_name ’,’ $subject ’, ‘ $message ’, NOW() )” ;\n$result = mysqli_query\
  \ ( $dbc , $sql ) ;\n```\n\n![image](img/Image00204.jpg) 最后，插入一条语句来报告错误，或在成功后将浏览器重定向到论坛页面\n\
  \n```php\nif ( mysqli_affected_rows( $dbc ) != 1 )\n{\n    echo ‘<p>Error</p’ .mysqli_error(\
  \ $dbc ) ;\n    mysqli_close( $dbc ) ;\n}\nelse\n{\n    mysqli_close( $dbc ) ;\n\
  \    header( ‘Location: forum.php ’ ) ;\n}\n```\n\n![image](img/Image00205.jpg)\
  \ 将此脚本保存在 Web 服务器的 `/htdocs` 目录下并名为 `process.php`，然后提交一个没有任何字段内容的表单，以查看脚本显示错误消息。\n\
  \n![image](img/Image00019.jpg)\n\n注意这里使用了 PHP 的 `addslashes()` 函数来转义单引号和引号。\n\n\
  ![image](img/Image00005.jpg)\n\n`NOW()` 是 MySQL 函数，返回返回当前时间戳的 datetime 值。\n\n![image](img/Image00005.jpg)\n\
  \n如果此脚本发现空表单字段，它将提供自己的错误消息；如果数据无法添加到数据库表中，它将提供 MySQL 错误消息。\n\n### 确认成功\n\n现在是测试留言板流程的时间，以确保验证执行正常，并且发布的消息出现在论坛页面上：\n\
