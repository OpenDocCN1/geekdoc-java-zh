  \ 保留数据\n\n用户输入的数据经常跨多个页面需要。用户数据可以方便地存储在客户端机器的“cookie”文件中，这样用户就不必重复输入相同的数据。PHP `setcookie()`\
  \ 函数通过指定三个参数轻松创建 cookie：\n\n本章演示如何使用 cookie 保留数据。\n\n```php\nsetcookie(name , value\
  \ , expiry-time) ;\n```\n\n![image](img/Image00005.jpg)\n\n当 HTML 表单使用 `POST` 方法提交到服务器时，其字段会自动分配给特殊的\
  \ PHP `$_POST` 全局变量。可以使用内置的 `isset()` 函数检查提交字段是否存在。当确认字段确实存在时，其名称和值可以存储在 cookie\
  \ 中。这可能用于存储跨网站使用的用户名和密码：\n\n![image](img/Image00174.jpg)\n\n`cookie_form.html`\n\
  \n![image](img/Image00054.jpg) 创建一个 HTML 文档并将此单添加到主体部分，指定提交方法和 PHP 提交处理脚本。\n\n```html\n\
  <form name=”entry” method=” POST ”\naction=” cookie_set.php ”>\n<fieldset>\n<legend>\
  \ Enter Only Alpha Characters </legend> Name : <input type=\"\"text” name=” user\
  \ ” >\nPassword : <input type=\"\"password” name=” pass ” >\n<br><br><input type=\"\
  \"submit” value=”Log In ” >\n</fieldset>\n</form>\n```\n\n![image](img/Image00055.jpg)\
  \ 将文档保存到你 Web 服务器的 `/htdocs` 目录下命名为 `cookie_form.html`，然后通过 HTTP 打开查看表单。\n\n![image](img/Image00179.jpg)\n\
  \n![image](img/Image00019.jpg)\n\n### 提交数据\n\nPHP 还提供了一个 `$_REQUEST` 超全局变量，它包含 `$_POST`\
  \ 和 `$_GET` 数组的所有内容。这意味着可以使用 `$_REQUEST['city']` 访问 `$_POST['city']`，但应该避免这样做。始终根据提交类型使用特定的数组。\n\
  \n![image](img/Image00006.jpg)\n\n注意传递的 name=value 对在浏览器的地址栏中可见。\n\n### 总结\n\n-\
