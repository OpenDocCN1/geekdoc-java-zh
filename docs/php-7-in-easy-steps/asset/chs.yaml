  \n```php\n$rover -> setValues();\n```\n\n![image](img/Image00126.jpg)  添加调用每个获取方法的语句以检索已赋值的值，这些值是指定的默认值\n\
  \n```php\necho ‘<hr>Rover: ‘ . $rover -> getAge().’yrs’;\necho $rover -> getWeight().’lbs\
  \ ’ . $rover -> getColor();\n```\n\n![image](img/Image00127.jpg)  添加第三次调用普通输出方法\n\
  \n```php\n$rover -> bark();\n```\n\n![image](img/Image00128.jpg)  将文档保存到网络服务器的 `/htdocs`\
  \ 目录并为 `initializer.php`，然后通过 HTTP 访问页面查看组合初始化方法设置的输出\n\n![image](img/Image00129.jpg)\n\
  \n![image](img/Image00130.jpg)\n\n![image](img/Image00006.jpg) 你在此处仍然调用初始化方法，在不传递任何参数的情况下为类变量分配默认值。\n\
  \n## 使用构造函数\n\n类变量成员可以通过特殊的“构造函数”方法进行初始化，该方法每当创建类的实例时就会被调用。构造方法始终始终命名为 `__construct()`，并可以接受参数来设置类变量的初始值。\n\
  \n![image](img/Image00131.jpg)\n\n构造方法有一个配套的“析构”（destructor）方法——它每当类的实例被销毁时就会被调用。析构方法始终命名为\
  \ `__destruct()`。构造方法和析构方法没有返回值并且会被自动调用——它们不能被显式调用，因此它们的声明不需要访问修饰符\n\n初始化类变量的值在创建对象的语句中传递给构造方法，紧跟对象名称之后：\n\
  \n![image](img/Image00029.jpg)\n\n`constructor.php`\n\n![image](img/Image00114.jpg)\
  \  将上一个示例“initializer.php”的副本重命名为新程序“constructor.php”\n\n![image](img/Image00115.jpg)\
  \  在 `Dog` 类声明中，将 `setValues` 方法替换为此构造函数\n\n```php\nfunction __construct(int $yrs\
  \ = 2, int $lbs = 8, string $fur = ‘black’) {\n    $this->age = $yrs;\n    $this->weight\
  \ = $lbs;\n    $this->color = $fur;\n}\n```\n\n![image](img/Image00116.jpg)  现在添加一个简单的析构方法\n\
  \n```php\nfunction __destruct() { \n    echo ‘<hr>Object Destroyed.’ \n}\n```\n\n\
  ![image](img/Image00117.jpg)  在 `Dog` 类声明后，编辑创建“fido”对象的语句\n\n```php\n$fido = new\
  \ Dog(3, 15, ‘brown’);\n```\n\n![image](img/Image00118.jpg)  同样，编辑创建“pooch”对象的语句\n\
  \n```php\n$pooch = new Dog(4, 18, ‘gray’);\n```\n\n![image](img/Image00005.jpg)\
  \  `Dog` 类的定义也被称为“派生”。\n\n```php\nclass Dog extends Polygon { }\n```\n\n![image](img/Image00119.jpg)\
  \  编辑创建“rover”对象的语句\n\n```php\n$rover = new Dog();\n```\n\n![image](img/Image00021.jpg)\
  \  删除调用 `setValues` 方法的语句\n\n```php\n// 相关的 setValues 调用已删除\n```\n\n## 继承属性\n\n\
  PHP 类可以被创建一个全新的类，如之前的示例所示，也可以从现有类中“派生”。重要的是，派生类会继承它所派生的父类（基类）的成员——除了它自身的成员。\n\n\
  ![image](img/Image00133.jpg)\n\n从基类继承成员的能力允许创建共享某些公共属性的派生类，这些属性已在基类中定义。例如，“多边形”基类可以定义所有多边形通用的宽度和高度属性。“矩形”和“三角形”类可以从\
  \ `Polygon` 类派生出来——继承宽度和高度属性，加上它们定义独特特征的成员。\n\n![image](img/Image00134.jpg)\n\n\
  继承的优点非常强大，是面向对象编程（OOP）的第二个原则。\n\n派生类声明在其类名后添加 `extends` 关键字，随后是它所派生的类名：\n\n```php\n\
  class Rectangle extends Polygon { }\n```\n\n\n\n\n\n```php\n<?php\n\nclass Polygon\n\
  {\n    private $width , $height ;\n    function construct( int $w = 4 , int $h =\
  \ 5 )\n    {\n        $this-> width = $w ;\n        $this-> height = $h ;\n    }\n\
  \    public function getWidth () { return $this-> width ; }\n    public function\
  \ getHeight () { return $this-> height ; }\n}\n```\n![image](img/Image00115.jpg)\
  \ 在 `Polygon` 类之后，声明一个派自 `Polygon` 类的 `Rectangle` 类，并添加一个独特的方法\n\n```php\nclass\
  \ Rectangle extends Polygon\n{\n    public function area ()\n    {\n        return\
  \ ( $this-> getWidth () * $this-> getHeight () ) ;\n    }\n}\n```\n\n![image](img/Image00116.jpg)\
  \ 在 `Rectangle` 类之后，声明一个派自 `Polygon` 类的 `Triangle` 类，并添加一个独特的方法\n\n```php\nclass\
  \ Triangle extends Polygon\n{\n    public function area ()\n    {\n        return\
  \ ( $this-> getWidth () * $this-> getHeight () / 2 ) ;\n    }\n}\n```\n\n![image](img/Image00117.jpg)\
  \ 在 `Triangle` 类之后，添加两条语句使用默认值创建每个派生类的实例\n\n```php\n$rect = new Rectangle () ;\n\
  $trio = new Triangle () ;\n```\n\n![image](img/Image00118.jpg) 最后，添加两个语句来输出每个派生类的独特方法所返回的值\n\
  \n```php\necho ‘Rectangle Area : ‘ . $rect -> area (). ’<hr>’ ;\necho ‘Triangle\
  \ Area : ‘ . $trio -> area () ;\n?>\n```\n\n![image](img/Image00119.jpg) 将文档保存到\
  \ Web 服务器的 `/htdocs` 目录并命名为 `inheritance.php`，然后通过 HTTP 访问页面以查看继承成员的输出\n\n![image](img/Image00135.jpg)\n\
  \n![image](img/Image00019.jpg)\n\n不要混淆类实例和派生类——实例是类的拷贝，而派生类是一个继承其所自基类属性的新类。\n\n\
  ![image](img/Image00006.jpg)\n\n在 PHP 中，派生类始终依赖于单一基类——不支持多重继承。\n\n## 拥抱多态\n\n面向对象编程\
  \ (OOP) 的三个基石是封装、继承和多态。在之前的页面中，我们已经看到了数据如何封装在 PHP `class` 中，以及派生类如何继承其基类的属性，因此我们现在可以探索最后一个的基石原则：多态。\n\
  \n![image](img/Image00136.jpg)\n\n“多态”一词（源自希腊语，意为“多种形式”）描述了根据上下文赋予实体不同意义或目的的能力。例如，在现实世界中，每个人都知道如何使用按钮（实体）——你只需对其施加压力。然而，该按钮的功能取决于连接到它的东西（上下文），但结果不会影响该按钮的使用方式。\n\
  \n在面向对象编程的世界中，多态允许类在共享公共接口的同时具有不同的功能。接口不需要知道它正在使用哪个类，因为它们就像现实世界的按钮一样，都以相同的方式使用，但可以产生不同的上下文结果。以此这样拥抱多态让程序员能够创建可以交换的对象，并根据需求而不是条件测试来选择它们。\n\
  \nPHP 接口类似于类，但使用 `interface` 关键字声明，并且只能包含方法定义，而不包含任何要执行的方法语句，如下所示：\n\n```php\ninterface\
  \ InterfaceName\n{\n    // 此处只进行方法定义。\n}\n```\n\n![image](img/Image00006.jpg)\n\n\
  接口声明中的方法定义也可以指定参数。\n\n实现接口的每个类必须实现其定义的所有方法，并指定要执行的语句。通过在声明中包含 `implements` 关键字和接口名称将类与接口关联，如下所示：\n\
  \n```php\nclass ClassName implements InterfaceName\n{\n    // 方法实现在这里。\n}\n```\n\
  \n可以通过添加一个接口和单个函数来修改之前的示例以拥抱多态。\n\n![image](img/Image00029.jpg)\n\npolymorphism.php\n\
  \n![image](img/Image00114.jpg) 将上一个示例的拷贝“inheritance.php”重命名为新程序“polymorphism.php”\n\
  \n![image](img/Image00115.jpg) 声明名为“Shape”的接口，它包含 Rectangle 和 Triangle 类中已实现的方法定义\n\
  \n```php\ninterface Shape { public function area () ; }\n```\n\n![image](img/Image00116.jpg)\
  \ 编辑 Rectangle 和 Triangle 类声明的第一行——将它们与接口关联\n\n```php\nclass Rectangle extends Polygon\
  \ implements Shape\nclass Triangle extends Polygon implements Shape\n```\n\n![image](img/Image00117.jpg)\
  \ 在类块之后，添加一个接受 Shape 类型参数并调用其定义方法的函数\n\n```php\nfunction getArea ( Shape $shape\
  \ )\n{ return $shape -> area () ; }\n```\n\n![image](img/Image00118.jpg) 修改创建每个派生类实例的两个语句——传递参数值\n\
  \n```php\n$rect = new Rectangle ( 8 , 10 ) ;\n$trio = new Triangle ( 8 , 10 ) ;\n\
  ```\n\n```php\necho ‘Rectangle Area : ‘ . $rect -> area (). ’<hr>’ ;\necho ‘Triangle\
  \ Area : ‘ . $trio -> area () ;\n```\n\n\n\n\n## 追加文本\n# 处理错误\n## 捕获异常\n### 总结\n\
  \n## 读取文件\n\n读取和写入位于 Web 服务器上的文件对于记录信息和提供页面内容非常有用。为了处理文件，必须先使用 PHP 的 `fopen()` 函数创建一个“文件流”（filestream）对象。这需要两个参数：指定文件的名称或路径以及文件“模式”。文件模式决定了要执行的操作性质，并将文件指针放置在文件内合适的位置：\n\
  \n| 文件模式： | 操作： |\n| :--- | :--- |\n| r | 打开已存在的文件进行读取 文件指针从文件开头开始 |\n| w | 丢弃现有文件的所有内容，如果不存在则创建一个新文件\
  \ 文件指针从文件开头开始 |\n| a | 打开已存在的文件并保留所有内容 文件指针从文件末尾开始 |\n| r+ | 打开文件进行读取或写入 文件指针从文件开头开始\
  \ |\n| w+ | 打开文件进行写入或读取 丢弃现有文件的所有内容，如果不存在则创建一个新文件 文件指针从文件开头开始 |\n| a+ | 打开文件进行读取或写入并保留所有内容\
  \ 文件指针从文件末尾开始 |\n\n![image](img/Image00019.jpg)\n\n当作为 `fopen()` 函数的参数提供时，文件模式指定符必须出现在引号内。\n\
  \n良好的习惯始终使用 `die()` 函数提供一个备选方案，以防创建文件流尝试失败。\n\n![image](img/Image00005.jpg)\n\n\
  作为 `die()` 函数的参数指定一个解释性消息。\n\n当文件流成功创建后，可以通过指定文件流和字节大小作为 `fread()` 函数的参数来读取文件。如果要读取整个文件，使用\
  \ `filesize()` 函数来指定要读取的文件字节大小会非常方便。\n\n在完成任何文件操作后，必须通过指定其作为 `fclose()` 函数的参数来销毁文件流。\n\
  \n![image](img/Image00138.jpg)\n\n![image](img/Image00029.jpg)\n\nread.php\n\n![image](img/Image00008.jpg)\
  \ 启动一个 PHP 脚本，其语句尝试打开一个纯文本文件进行读取，或者在失败时退出脚本\n\n```php\n<?php\n$filestream = fopen(\
  \ ‘manifesto.txt’ , ‘r’ )\nor die( ‘Unable to open file!’ ) ;\n```\n\n![image](img/Image00010.jpg)\
  \ 接下来，添加一条在成功后读取文本文件并显示其全部语句\n\n```php\necho fread( $filestream , filesize( ‘manifesto.txt’\
  \ ) ) ;\n```\n\n![image](img/Image00012.jpg) 现在，记住关闭文件流\n\n```php\nfclose( $filestream\
  \ ) ;\n```\n\n![image](img/Image00014.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录下并命名为 `read.php`，同时与要读取的纯文本放在一起，然后通过\
  \ HTTP 打开页面以在浏览器窗口中显示文本内容。\n\n![image](img/Image00139.jpg)\n\n![image](img/Image00006.jpg)\n\
  \n与 HTML 文档中的 PHP 块不同，纯 PHP 脚本不需要结束标签 `?>`。\n\n![image](img/Image00006.jpg)\n\n\
  注意这里的输出没有保持行尾——但上方的示例保持了。\n\n## 读取行\n\n一旦创建了“文件流”对象，就可以通过指定文件流作为 PHP `fgets()` 函数的参数来逐行读取其内容。要读取每一行，可以在循环中反复调用此函数。`feof()`\
  \ 函数可以判断何时到达文件末尾并结束循环：\n\n![image](img/Image00140.jpg)\n\n![image](img/Image00006.jpg)\n\
  \n当到达文件末尾时，`feof()` 函数返回 true。\n\n![image](img/Image00029.jpg)\n\nreadlines.php\n\
  \n![image](img/Image00008.jpg) 启动一个 PHP 脚本，其语句尝试打开一个纯文本文件进行读取，或者在失败时退出脚本\n\n```php\n\
  <?php\n$filestream = fopen( ‘manifesto.txt’ , ‘r’ )\nor die( ‘Unable to open file!’\
  \ ) ;\n```\n\n![image](img/Image00010.jpg) 接下来，添加一个循环在成功后逐行读取文本文件并显示其全部内容\n\n```php\n\
  while( !feof( $filestream ) )\n{ echo fgets( $filestream ). ’<br>’ ; }\n```\n\n\
  ![image](img/Image00012.jpg) 现在，记住关闭文件流\n\n```php\nfclose( $filestream ) ;\n```\n\
  \n![image](img/Image00014.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录下并命名为 `readlines.php`，同时与要读取的纯文本放在一起，然后通过\
  \ HTTP 打开页面以查看文本文件。\n\n![image](img/Image0011.jpg)\n\n## 读取字符\n\n一旦创建了“文件流”对象，就可以通过指定文件流作为\
  \ PHP `fgets()` 函数的参数来逐行读取其内容。要读取每一行，此函数可以在循环中反复调用。`feof()` 函数可以判断何时到达文件末尾并结束循环：\n\
  \n或者，一旦“文件流”对象创建后，就可以通过指定文件流作为 `fgetc()` 函数的参数来逐字符读取其内容。要读取每个字符，此函数可以在循环中反复调用。\n\
  \nreadchars.php\n\n![image](img/Image00008.jpg) 启动一个 PHP 脚本，其语句尝试打开一个纯文本文件进行读取，或者在失败时退出脚本\n\
  \n```php\n<?php\n$filestream = fopen( ‘title.txt’ , ‘r’ )\nor die( ‘Unable to open\
  \ file!’ ) ;\n```\n\n![image](img/Image00010.jpg) 接下来，添加一个循环在成功后逐字符读取文本文件并显示其全部内容\n\
  \n```php\nwhile( $char = fgetc( $filestream ) )\n{ echo $char ; }\n```\n\n![image](img/Image00012.jpg)\
  \ 现在，记住关闭文件流\n\n```php\nfclose( $filestream ) ;\n```\n\n![image](img/Image00014.jpg)\
  \ 将文档保存到 Web 服务器的 `/htdocs` 目录下并命名为 `readchars.php`，同时与要读取的文本文件放在一起，然后通过 HTTP 打开。\n\
  \n## 写入文件\n\n一旦创建了写入模式的“文件流”对象，就可以创建一个文本文件。通过指定文件流和文件名到 `fwrite()` 函数可以将文本写入文件。为了格式化文本，还可以写入不可打印字符来创建换行和制表：\n\
  \n| 字符 | 说明 |\n| :--- | :--- |\n| \\n | 换行 |\n| \\r | 回到行首 |\n| \\t | 制表移动到下一个制表位\
  \ |\n\n![image](img/Image00019.jpg)\n\n包含不可打印字符的字符串必须封装在双引号内，以便 PHP 解释它们。\n\nwrite.php\n\
  \n![image](img/Image00008.jpg) 启动一个 PHP 脚本，其语句分配包含用于格式化的不可打印字符的文本\n\n```php\n<?php\n\
  $poem = “\\r\\n\\tI never saw a man who looked” ;\n$ .= “\\r\\n\\tWith such a wistful\
  \ eye” ;\n$ .= “\\r\\n\\tUpon that little tent of blue” ;\n$ .= “\\r\\n\\tWhich\
  \ prisoners call the sky” ;\n```\n\n![image](img/Image00010.jpg) 接下来，为要写入的文件指定名称\n\
  \n```php\n$filename = ‘poem.txt’ ;\n```\n\n![image](img/Image00012.jpg) 尝试用于写入的纯文本文件，或者在失败时退出脚本\n\
  \n```php\n$filestream = fopen( $filename , ‘w’ )\nor die( ‘Unable to open file!’\
  \ ) ;\n```\n\n![image](img/Image00014.jpg) 写入文件并显示总共写入了字节数确认\n\n```php\n$num = fwrite(\
  \ $filestream , $poem ) ;\nif( $num )\n{\n    echo “ $num bytes written to $filename\
  \ ” ;\n}\n```\n\n![image](img/Image00015.jpg) 现在，记住关闭文件流\n\n```php\nfclose( $filestream\
  \ ) ;\n```\n\n\n\n\n\n![image](img/Image00017.jpg) 将文档在你的 Web 服务器的 `/htdocs` 目录中保存为\
  \ `write.php`，然后通过 HTTP 访问页面以查看文本文件已写入的确认。\n\n![image](img/Image00144.jpg)\n\n![image](img/Image00026.jpg)\
  \ 使用文件资源管理器进入你的 Web 服务器的 `/htdocs` 目录，查看 PHP 脚本创建的文件。\n\n![image](img/Image00145.jpg)\n\
  \n![image](img/Image00027.jpg) 打开文件查看 PHP 脚本写入的文本。\n\n![image](img/Image00146.jpg)\n\
  \n![image](img/Image00005.jpg)\n\n你可以反复运行此示例，每次它都会擦除内容然后重新写入。\n\n## 追加文本\n\n一旦创建了指定了追加模式的“文件流”（filestream）对象，就可以打开文本文件并在末尾添加文本。可以通过向\
  \ PHP 的 `fwrite()` 函数指定文件流和文件名来向文件中追加文本。该过程与写入文件相同，不同在于在将文本写入文件之前，文件指针将置于现有内容的末尾：\n\
  \n![image](img/Image00029.jpg)\n\nappend.php\n\n![image](img/Image00008.jpg) 开始一个\
  \ PHP 脚本，赋值一段语句，包括用于格式化的非打印字符。\n\n```php\n<?php\n$info = “\\r\\n\\r\\n\\tThe Ballad\
  \ of Reading Gaol” ;\n$info .= “\\r\\n\\t\\t\\tOscar Wilde 1898” ;\n```\n\n![image](img/Image00010.jpg)\
  \ 接下来，为要写入的文件命名。\n\n```php\n$filename = ‘poem.txt’ ;\n```\n\n![image](img/Image00012.jpg)\
  \ 尝试以追加模式打开纯文本文件，如果失败则退出脚本。\n\n```php\n$filestream = fopen( $filename , ‘a’ ) or\
  \ die( ‘Unable to open file!’ ) ;\n```\n\n![image](img/Image00014.jpg) 写入文本并显示总共追加字节数的确认。\n\
  \n```php\n$num = fwrite( $filestream , $info ) ;\nif( $num )\n{\n    echo “ $num\
  \ bytes appended to $filename ” ;\n}\n```\n\n![image](img/Image00015.jpg) 现在，记得关闭文件流。\n\
  \n```php\nfclose( $filestream ) ;\n```\n\n![image](img/Image00017.jpg) 将文档在你的 Web\
  \ 服务器的 `/htdocs` 目录中保存为 `append.php`，然后通过 HTTP 访问页面以查看文本已追加到文件的确认。\n\n![image](img/Image00147.jpg)\n\
  \n![image](img/Image00006.jpg) 记住非打印字符必须包含在双引号中以便解释。\n\n![image](img/Image00026.jpg)\
  \ 进入你的 Web 服务器的 `/htdocs` 目录并打开文件查看 PHP 脚本追加的文本。\n\n![image](img/Image00148.jpg)\n\
  \n## 覆盖文本\n\n重要的是要认识到，当你以写入模式写入现有文件时，它将覆盖任何现有内容：\n\n![image](img/Image00029.jpg)\n\
  \noverwrite.php\n\n![image](img/Image00008.jpg) 通过尝试以写入模式打开现有文本文件来开始 PHP 脚本，如果失败则退出脚本。\n\
  \n```php\n<?php\n$filestream = fopen( ‘poem.txt’ , ‘w’ ) or die( ‘Unable to open\
  \ file!’ ) ;\n```\n\n![image](img/Image00010.jpg) 成功后，向文件写入新文本。\n\n```php\nfwrite(\
  \ $filestream , ‘Overwritten!’ ) ;\n```\n\n![image](img/Image00012.jpg) 现在，记得关闭文件流。\n\
  \n```php\nfclose( $filestream ) ;\n```\n\n![image](img/Image00014.jpg) 将文档在你的 Web\
  \ 服务器的 `/htdocs` 目录中保存为 `overwrite.php`，然后通过 HTTP 访问页面并重新打开文本文件查看其内容已被覆盖。\n\n![image](img/Image00149.jpg)\n\
  \n![image](img/Image00019.jpg) 写入文件时要小心，因为很容易不小心覆盖。\n\n## 错误处理\n\n你可以预测可能的错误，并在错误发生时使用\
  \ `die()` 函数或 `exit()` 函数终止正在运行的脚本。如果没有这种应急措施，默认 PHP 错误处理器在发生错误时会提供一个有用但不好看的消息。例如，使用\
  \ `fopen( ‘nonsuch.txt’ , ‘r’ )` 打开一个不存在的文件：\n\n![image](img/Image00150.jpg)\n\n\
  ![image](img/Image00005.jpg) `die()` 和 `exit()` 函数在 PHP 中执行相同的操作，但它们的术语可能具有不同的吸引力。对于某些人来说，检测到错误时使用\
  \ `die()` 似乎更合适，而在其他场景下 `exit()` 可能看起来更合适。\n\n在错误发生时终止脚本并不总是如愿愿，但你可以创建一个自定义错误处理器，以提供比默认\
  \ PHP 错误处理器更用户友的消息。自定义错误处理器只是具有以下语法的函数：\n\n```php\nfunction error_handler( $level,\
  \ $message, $file, $line, $context ) {\n    switch($level) {\n        case 2: $str\
  \ = ‘Warning!’ ; break;\n        case 8: $str = ‘Notice!’ ; break;\n        default:\
  \ $str = ‘Error!’ ; break;\n    }\n    echo \"<b>$str</b>: $message in line $line\"\
  ;\n}\n```\n\n基础错误级别列在本表中：\n\n| Level | Constant | Description |\n| :--- | :--- |\
  \ :--- |\n| 2 | E_WARNING | 非致命 |\n| 8 | E_NOTICE | 非致命 |\n| 256 | E_ERROR | 致命\
  \ |\n| 512 | E_USER_WARNING | 用户生成 |\n\n当发生错误时会调用自定义错误处理器，或者可以使用以下方式显式调用：\n\n```php\n\
  set_error_handler( ‘error_handler’ );\n```\n\n![image](img/Image00010.jpg) 接下来，为要写入的文件命名并访问一个未初始化的变量：\n\
  \n```php\n<?php\n$info = “\\r\\n\\r\\n\\tThe Ballad of Reading Gaol” ;\n$info .=\
  \ “\\r\\n\\t\\t\\tOscar Wilde 1898” ;\n$filename = ‘poem.txt’ ;\n$filestream = fopen(\
  \ $filename , ‘a’ ) or die( ‘Unable to open file!’ ) ;\n$num = fwrite( $filestream\
  \ , $info ) ;\nif( $num )\n{\n    echo “ $num bytes appended to $filename ” ;\n\
  }\nfclose( $filestream ) ;\n```\n\n![image](img/Image00015.jpg) 显式触发自定义错误处理器：\n\n\
  ```php\n$number = 2;\nif(number >= 1 )\n{\n    trigger_error( ‘Value of number must\
  \ be 1 or less’, $number );\n}\n```\n\n![image](img/Image00017.jpg) 将文档在你的 Web 服务器的\
  \ `/htdocs` 目录中保存为 `append.php`，然后通过 HTTP 访问页面以查看文本已追加到文件的确认。\n\n![image](img/Image00147.jpg)\n\
  \n![image](img/Image00006.jpg) 注意在报告每个错误后脚本继续运行。\n\n## 捕获异常\n\n我们可以在特定错误发生时选择脚本如何继续。这种错误情况被称为“异常”。当异常发生时，它被称为“抛出”，而处理异常的代码被称为它的“捕获”。如果异常未被捕获，PHP\
  \ 将其视为致命错误并发布一条不好看的“未捕获异常”消息，如下：\n\n![image](img/Image00152.jpg)\n\n每个 **try** 块必须有一个关联的\
  \ **catch** 块，否则将发生致命的未捕获异常。\n\n处理异常的关键是在 **try** 代码块中尝试执行操作以预测错误，并在关联的 **catch**\
  \ 代码块中确定脚本如何继续。捕获块接收一个 **Exception** 类对象，该对象具有 `getMessage()`、`getFile()` 和 `getLine()`\
  \ 方法。\n\n**Exception** 类的实例可以使用 `new` 关键字创建，并可以使用 `throw` 关键字显式抛出。\n\n自定义异常处理器也可以创建为\
  \ **Exception** 类的派生类，以提供自己的自定义方法：\n\n```php\nclass MyException extends Exception\
  \ {\n    public function customMethod() {\n        // custom logic\n    }\n}\n\n\
  try {\n    throw new MyException(\"Something went wrong”);\n} catch (MyException\
  \ $e) {\n    echo $e->getMessage();\n}\n```\n\n\n\n\n\n![image](img/Image00008.jpg)\
  \  通过定义一个在条件测试失败时抛出异常的函数来编写 PHP 脚本\n\n```php\n<?php\nfunction check_size( $num )\n\
  {\n    if( $num < 10 )\n    { \n        throw new Exception( “Number : $num<br>Value\
  \ must exceed 10” ) ; \n    }\n}\n```\n\n![image](img/Image00010.jpg)  预测特定错误并报告异常\n\
  \n```php\ntry { check_size( 5 ) ; }\ncatch( Exception $e )\n{\n    echo ‘<b>Size\
  \ Exception!</b><br>’. $e->getMessage() .’<hr> ;    \n}\n```\n\n![image](img/Image00012.jpg)\
  \  接下来，创建一个自定义异常处理器类\n\n```php\nclass CustomException extends Exception\n{\n   \
  \ public function get_details ()\n    {\n        $details = ‘ File : ‘ . $this ->\
  \ getFile ().\n        ‘<br>Line : ‘ . $this -> getLine ().\n        ‘<br>’ . $this\
  \ -> getMessage () ;\n        return $details ;\n    }\n}\n```\n\n![image](img/Image00014.jpg)\
  \  现在，添加另一个在条件测试失败时抛出异常的函数\n\n```php\nfunction check_parity ( $num )\n{\n    if(\
  \ $num % 2 !== 0 )\n    {\n        throw new CustomException ( “Number : $num <br>Value\
  \ must be even” ) ;\n    }\n}\n```\n\n![image](img/Image00015.jpg)  最后，预测特定错误并报告异常\n\
  \n```php\ntry { check_parity ( 5 ) ; }\ncatch( CustomException $e )\n{\n    echo\
  \ ‘<b>Parity Exception!</b><br>’ . $e -> get_details (). ’<hr>’ ;    \n}\n```\n\n\
  ![image](img/Image00017.jpg)  将文档保存到 Web 服务器的 `/htdocs` 目录下并为 `exception.php`，然后通过\
  \ HTTP 打开页面以查看被捕获的异常和相应的消息详情\n\n![image](img/Image00153.jpg)\n\n![image](img/Image00006.jpg)\n\
  \n关于派生类和继承的更多信息，请参考此处。\n\n![image](img/Image00005.jpg)\n\n`try` 块可以包含多个 `throw`\
  \ 语句以预测多种错误情况，并可以跟随多个 `catch` 块来处理这些异常。\n\n### 总结\n\n- `fopen()` 函数用于创建文件流对象，需要两个参数来指定文件名和文件模式\n\
  - 当尝试创建文件流失败时，使用 `die()` 函数提供替代方案是一个良好的做法\n- `fread()` 函数用于读取使用 `r` 模式创建的文件流，`filesize()`\
  \ 函数可以指定文件的字节大小\n- 在完成任何文件操作后，必须通过调用 `fclose()` 函数销毁文件流\n- `fgets()` 函数可以逐行读取文件，`feof()`\
  \ 函数可以识别文件末尾\n- `fgetc()` 函数可以逐字符读取文件，并在文件末尾返回 false\n- 可以通过向 `fwrite()` 函数中指定文件流和文件名作为参数来将文本写入文件\n\
  - `fwrite()` 函数在使用 `w` 模式时会覆盖现有文本，但在使用 `a` 模式时将追加文本\n- 可以将函数名作为 `set_error_handler()`\
  \ 函数的参数，将其指定为自定义错误处理器\n- 错误处理器函数在发生错误时被调用，也可以显式地使用 `trigger_error()` 函数调用\n- 当发生特定错误情况时，会抛出异常\n\
  - 如果异常未被捕获，PHP 将其视为致命错误并发布 `Uncaught Exception`（未捕获的异常）消息\n- `try` 代码块用于预测特定错误，其相关的\
  \ `catch` 块用于确定当错误发生时脚本应如何继续\n- `Exception` 类对象拥有 `getMessage()`、`getFile()` 和 `getLine()`\
  \ 方法，可以获取异常详情\n- 自定义异常处理器可以作为 `Exception` 类的派生类，以提供自定义异常方法\n\n# 生成表单\n\n*本章演示了如何使用\
  \ PHP 脚本处理 HTML 表单数据。*\n\n- 执行操作\n- 检查设置的值\n- 验证表单数据\n- 过滤数据\n- 发送隐藏数据\n- 处理提交\n\
  - 制作持久化表单\n- 上传文件\n- 包围表单\n- 追加数据\n\n## 执行操作\n\n处理来自 HTML 表单的数据。表单提交方法可以是“GET”或“POST”。**GET**\
  \ 方法将 name=value 对添加到 URL 中，但主要用于请求信息——例如检索数据库记录。**POST** 方法可以提交更多数据，并且更安全，因为数据没有添加到\
  \ URL 中，且主要用于执行操作——例如更新数据库记录。因此，书中的大多数示例首选使用 **POST** 方法。\n\n通过 POST 提交的数据在全局变量\
  \ `$_POST` 中可用。例如，如果表单有 `name=\"email\"` 的输入，可以使用 `$_POST['email']` 访问。HTML `<form>`\
  \ 标签的 `action` 属性指定处理数据的脚本，`method` 属性指定如何发送数据。例如：\n\n```html\n<form action=\"script.php\"\
  \ method=\"POST\">\n    ...\n</form>\n```\n\n通过 GET 提交的数据在全局变量 `$_GET` 中可用。例如，如果表单有\
  \ `name=\"id\"` 的输入，可以使用 `$_GET['id']` 获取。\n\n```php\n$id = $_GET['id'];\n```\n\n\
