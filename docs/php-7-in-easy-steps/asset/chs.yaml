  \ $result” ;`\n\n![image](img/Image00059.jpg) 最后，将文档保存到网络服务器的 `/htdocs` 目录并命名为 `comparison.php`，然后通过\
  \ HTTP 打开页面以查看显示的的结果\n\n### 逻辑运算符\n\n| 运算符 | 名称 | 描述 |\n| :--- | :--- | :--- |\n\
  | `and` | `&&` | 如果两个操作数都真则返回 TRUE |\n| `or` | `||` | 如果至少有一个操作数为真则返回 TRUE |\n|\
  \ `xor` | `xor` | 如果仅其中一个操作数为真则返回 TRUE |\n| `not` | `!` | 反转操作数的逻辑状态 |\n\n\n\n\n\
  \n```php\necho “Yes OR No returns $result <br>” ;\n$result = ( $yes || $yes ) ?\
  \ ‘TRUE’ : ‘FALSE’ ;\necho “Yes OR Yes returns $result <hr>” ;\n$result = ( ! $yes\
  \ ) ? ‘TRUE’ : ‘FALSE’ ;\necho “NOT Yes returns $result <br>” ;\n```\n![image](img/Image00058.jpg)\
  \ 将文档保存在网络服务器的 `/htdocs` 目录下并命名为 `logic.php`，然后通过 HTTP 打开页面以显示结果。\n\n![image](img/Image00064.jpg)\n\
  \n![image](img/Image00005.jpg)\n\nPHP 还有一个 `XOR`（异或 `OR`）运算符，它可以同时执行与 `AND NOT`\
  \ 等效的评估。\n\n![image](img/Image00006.jpg)\n\n注意 `FALSE && FALSE` 的评估返回 `FALSE` ——\
  \ 这可能是在演示“两个错不等于对”这句谚语。\n\n## 比较位\n\n一个字节由八位组成，每个位可以包含一个 `1` 或 `0` 来存储二进制数，代表从 0\
  \ 到 255 的十进制值。只有当位包含 `1` 时，该位才会贡献一个十进制分量。组件从右到左从“最低有效位”（LSB）到“最高位”（MSB）命名。下方位模式中的二进制数代表十进制的\
  \ 50。\n\n![image](img/Image00006.jpg)\n\n许多 PHP 程序员从不使用位运算符，但了解它们是什么以及如何使用是有用的。\n\
  \n| 位 No. | 8 MSB | 7 | 6 | 5 | 4 | 3 | 2 | 1 LSB |\n| :--- | :--- | :--- | :---\
  \ | :--- | :--- | :--- | :--- | :--- |\n| 十进制 | 128 | 64 | 32 | 16 | 8 | 4 | 2 |\
  \ 1 |\n| 二进制 | 0 | 0 | 1 | 1 | 0 | 0 | 1 | 0 |\n\n可以使用“位”运算符来操作字节的各个部分。位运算符允许对整数内的特定位进行评估和操作。\n\
  \n| 运算符 | 名称 | 二进制数操作 |\n| :--- | :--- | :--- |\n| `\\|` | OR | 如果两个比较的位中有一个为 `1`，则对应的位返回\
  \ `1`。示例：`1010 \\| 0101 = 1111` |\n| `&` | AND | 如果两个比较的位中都为 `1`，则对应的位返回 `1`。示例：`1010\
  \ & 1100 = 1000` |\n| `~` | NOT | 如果两个比较的位都不为 `1`，则对应的位返回 `1`。示例：`1010 ~ 0011 =\
  \ 0100` |\n| `^` | XOR | 如果两个比较的位中只有一个为 `1`，则对应的位返回 `1`。示例：`1010 ^ 0100 = 1110`\
  \ |\n| `<<` | 左移 | 将每个 `1` 的位向左移动指定的位数。示例：`0010 << 2 = 1000` |\n| `>>` | 右移 | 将每个\
  \ `1` 的位向右移动指定的位数。示例：`1000 >> 2 = 0010` |\n\n![image](img/Image00005.jpg)\n\n字节的半部分被称为“半字节”（nibble，4\
  \ 位）。表中示例中的二进制数描述了存储在半字节中的值。\n\n除非为资源有限的设备编程，否则很少需要使用位运算符，但它们非常有用。例如，`^`（异或）运算符允许在不需要第三变量的情况下交换两个变量的值：\n\
  \n![image](img/Image00029.jpg)\n\nbitwise.php\n\n![image](img/Image00054.jpg) 创建一个有效的\
  \ HTML 文档，如这里 所列的那样，然后在 body 部分插入 PHP 标签\n\n```php\n<?php\n## 在此处插入要插入的语句。\n?>\n\
  ```\n\n![image](img/Image00055.jpg) 现在，在 PHP 标签之间插入语句来创建并初始化两个整数值的变量\n\n```php\n\
  $x = 5 ; $y = 10 ;\n```\n\n![image](img/Image00056.jpg) 接下来，添加一个语句显示赋值的值\n\n```php\n\
  echo “X : $x , Y : $y <br>” ;\n```\n\n![image](img/Image00057.jpg) 插入三个异或语句通过二进制位操作交换变量值\n\
  \n```php\n$x = $x ^ $y ; /* 1010 ^ 0101 = 1111 (十进制 15) */\n$y = $x ^ $y ; /* 1111\
  \ ^ 0101 = 1010 (十进制 10) */\n$x = $x ^ $y ; /* 1111 ^ 1010 = 0101 (十进制 5) */\n```\n\
  \n![image](img/Image00058.jpg) 最后，添加一个语句来显示赋值的值\n\n```php\necho “X : $x , Y : $y\
