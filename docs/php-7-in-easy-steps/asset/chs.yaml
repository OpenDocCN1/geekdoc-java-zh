  \ 和 `strncasecmp()`。\n\n为了理解这四个比较函数的结果，了解比较实际上是如何进行的是很有用的。每个字符都有一个标准的数值“ASCII”值，其中小写字母\
  \ a-z 的范围是 97-122，大写字母 A-Z 的范围是 65-90。通过比较每个范围内的第一个值，我们看到“a”（97） 大于“A”（65）。将这些作为参数传递给\
  \ `strcmp()` 函数，因此会返回 1，因为第一个参数大于第二个。相反，如果你指定“A”（65）作为第一个参数，将“a”（97）作为第二个参数，那么 `strcmp()`\
  \ 函数将返回 -1，因为第一个参数小于第二个。在字符串比较中，每个字符都按顺序比较，以确保包含不同顺序相同字符的字符串不会被错误地视为相等。例如，比较“ABC”和“BAC”，第一个字符“A”（65）\
