  \ `NULL`\n\n```php\n<?php\nif ( !empty ( $_POST[‘quantity’] ) )\n{\n    $quantity\
  \ = $_POST[‘quantity’] ;\n    # 在此处插入格式验证（第 4 步）。\n}\nelse\n{ \n    $quantity =\
  \ NULL ; \n    echo ‘You must enter a quantity<br>’ \n}\n\n### 过滤数据\n\n为了方便验证用户输入，PHP\
  \ 提供了 `filter_var()` 函数，可以同时用于验证和“过滤”输入。该函数需要两个参数：指定要过滤的变量以及使用的过滤器常量名：\n\n| **过滤器常量:**\
  \ | **约定:** |\n| :--- | :--- |\n| `FILTER_VALIDATE_BOOLEAN` | 布尔值 |\n| `FILTER_VALIDATE_EMAIL`\
  \ | 邮箱地址格式 |\n| `FILTER_VALIDATE_FLOAT` | 浮点数 |\n| `FILTER_VALIDATE_INT` | 整数 |\n\
  | `FILTER_VALIDATE_IP` | IP 地址格式 |\n| `FILTER_VALIDATE_MAC` | MAC 地址格式 |\n| `FILTER_VALIDATE_REGEXP`\
  \ | 正则表达式格式 |\n| `FILTER_VALIDATE_URL` | URL 格式 |\n| `FILTER_SANITIZE_EMAIL` | 移除无效字符\
  \ |\n| `FILTER_SANITIZE_ENCODED` | URL 编码字符串 |\n| `FILTER_SANITIZE_MAGIC_QUOTES`\
  \ | 反斜符转义字符 |\n| `FILTER_SANITIZE_NUMBER_FLOAT` | 移除所有非数字 |\n| `FILTER_SANITIZE_NUMBER_INT`\
  \ | 移除所有非数字 |\n| `FILTER_SANITIZE_SPECIAL_CHARS` | HTML 转义字符 |\n| `FILTER_SANITIZE_STRING`\
  \ | 移除 HTML 标签 |\n| `FILTER_SANITIZE_URL` | 移除无效字符 |\n| `FILTER_CALLBACK` | 调用自定义过滤器函数\
  \ |\n\n过滤器在验证成功时返回 `TRUE`，否则将返回 `FALSE`。某些过滤器允许指定进一步的选项。例如，可以为 `FILTER_VALIDATE_INT`\
  \ 指定数字范围。\n\n\n\n\n\n![image](img/Image00038.jpg) 现在，添加一个函数来验证参数是否为格式正确的电子邮件地址：\n\
  \n```php\nfunction validate( $email )\n{\n  if ( filter_var( $email , FILTER_VALIDATE_EMAIL\
  \ ) )\n  { echo( “<hr> $email IS a valid email address” ) ; }\n  else\n  { echo(\
  \ “<hr> $email IS NOT a valid email address” ); }\n}\n```\n\n![image](img/Image00039.jpg)\
  \ 创建一个包含非法空格的电子邮件地址并尝试验证，然后对该地址进行清理并再次尝试验证\n\n```php\n<?php\n$email = ‘mike @example.com’\
  \ ;\nvalidate( $email ) ;\n$email = filter_var( $email , FILTER_SANITIZE_EMAIL )\
  \ ;\nvalidate( $email ) ;\n?>\n```\n\n![image](img/Image00040.jpg) 将文档保存到 Web 服务器的\
  \ `/htdocs` 目录中并命名为 `filter.php`，然后通过 HTTP 打开它以查看过滤结果\n\n![image](img/Image00163.jpg)\n\
  \n![image](img/Image00019.jpg)\n\n用户提交输入可能会破坏你的网页，因此应该始终对其进行验证。\n\n### 发送隐藏数据\n\n\
  除了用户输入到 HTML 表单输入字段中的数据外，PHP 生成的数据可以使用 HTML 隐藏表单字段进行提交。与普通输入字段一样，这些字段也会向表单处理脚本发送\
  \ `name=value` 对，但这里的值是由 PHP 提供的，而不是用户。\n\n通常，使用隐藏表单字段提交的数据可能包括用户的登录名称和提交的时间戳：\n\
