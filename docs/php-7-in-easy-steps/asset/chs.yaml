  \n![image](img/Image00005.jpg)\n\n你可以使用 `count()` 函数来获取数组中的元素数量。例如：`$num = count(\
  \ $array ) ;`\n\n![image](img/Image00006.jpg)\n\n在键重要的情况下，请使用 `sort()` 或 `rsort()`\
  \ 函数。\n\n## 描述维度\n\n数组元素的编号更准确的说法是“数组索引”（array index），因为元素编号从零开始，所以有时被称为“基于零的索引”。使用单个索引创建的数组是一维数组，其元素出现在单行中：\n\
  \n| 元素内容 | A | B | C | D | E |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 索引数字\
  \ | [0] | [1] | [2] | [3] | [4] |\n\n![image](img/Image00048.jpg)\n\n数组也可以有多个索引以表示多个维度。使用两个索引创建的数组是二维数组，其元素出现在多行中：\n\
  \n| 第一个索引 | [0] | A | B | C | D | E |\n| :--- | :--- | :--- | :--- | :--- | :---\
  \ | :--- |\n| | [1] | F | G | H | I | J |\n| 第二索引 | | [0] | [1] | [2] | [3] | [4]\
  \ |\n\n在多维数组中，通过指定每个索引的数字来引用每个元素包含的值。例如，上述二维数组中 `[1][2]` 元素包含字母 H。\n\n二维数组用于存储网格信息，例如\
  \ XY 坐标。创建一个具有三个索引的三维数组可以存储 XYZ 坐标。\n\n在 PHP 中创建多维数组只需需创建一个外部数组，其元素本身也是数组。按照惯例，你可以可选地为每个元素指定键名——在这种情况下用于表示每个内部数组。然后可以使用键名和内部索引数字来引用单个值：\n\
  \n`$matrix['Letter'][0]`\n\n![image](img/Image00019.jpg)\n\n具有两个以上索引的多维数组可能会产生难以阅读的源代码，并导致错误。\n\
  \n然而，当将使用引号键的数组变量包含在字符串中时，始终用大括号括起来：\n\n```php\necho “Element value is {$matrix['Letter'][0]}\
  \ ” ;\n```\n\n可以使用 `foreach` 循环遍历数组，从而访问多维数组中的所有内部数组。然后可以使用嵌套的 `foreach` 循环逐个引用每个元素。\n\
  \n![image](img/Image00029.jpg)\n\nmatrix.php\n\n![image](img/Image00036.jpg) 创建一个像此处\
  \ 列出的那样的有效 HTML 文档，然后在 body 部分插入 PHP 标签\n\n```php\n<?php\n## 在此处插入要插入的语句。\n?>\n\
  ```\n\n![image](img/Image00037.jpg) 现在，在 PHP 标签之间插入语句，以创建并初始化两个普通变量数组以及一个带键名的二维数组\n\
  \n```php\n$letters = array( ‘A’ , ‘B’ , ‘C’ ) ;\n$numbers = array( 1 , 2 , 3 ) ;\n\
  $matrix =\narray( ‘Letter’ => $letters , ‘Number’ => $numbers ) ;\n```\n\n![image](img/Image00038.jpg)\
  \ 下一步，插入语句来显示单个存储的值\n\n```php\necho “<p>Start : {$matrix['Letter'][0]} </p>” ;\n\
  ```\n\n![image](img/Image00039.jpg) 最后，插入语句将所有元素中的键和值作为两个无序列表显示\n\n```php\nforeach(\
  \ $matrix as $array => $list )\n{\n    echo ‘<ul>’ ;\n    foreach( $list as $key\
  \ => $value )\n    { echo “<li> $array [ $key ] = $value ” ; }\n    echo ‘</ul>’\
  \ ;\n}\n```\n\n![image](img/Image00040.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录下并命名为 `sort.php`，然后通过\
  \ HTTP 打开页面以查看排序后的数组值显示\n\n\n\n\nPHP 文件流资源的创建和使用将在第 8 章中进行详尽的演示。\n\n![image](img/Image00005.jpg)\n\
  \n布尔值常量 `TRUE` 和 `FALSE` 不区分大小写，因此也可以写成 `true` 和 `false`。\n\n### 定义常量\n\n脚本中永远不会改变的固定数据值应该存储在\
  \ PHP“常量”中，而不是变量中。常量是一个命名的容器，可以在其中存储数值或字符串值，并可以使用常量名称进行引用。\n\n与变量不同，常量不能包含 `TRUE`\
  \ 或 `FALSE` 的布尔值，不能表示对象，也不能是 `NULL` 空值。此外，常量不会随着脚本的执行而发生改变。这保护了常量值不被意外修改，是一种良好的编程习惯。\n\
  \n![image](img/Image00005.jpg)\n\n在创建变量时，请务必考虑其值是否会发生变化——如果不会，你应该创建一个常量而不是变量。例如：`define(\
  \ ‘PI’ , 3.14 ) ;`。\n\n常量的命名遵循与变量相同的命名规范，但传统上使用大写字母作为常量名——以便与变量名区分。常量使用 `define()`\
  \ 函数创建，用于指定常量的名称和它将包含的值，如下：\n\n`define( ‘NAME’ , value ) ;`\n\n最重要的是，常量名不以 $ 符号开头，因此它们不能包含在混合字符串中进行显示——因为\
  \ PHP 无法区分常量名和普通的大写字符串。例如考虑这些语句：\n\n`define( ‘USER’ , ‘Mike’ ) ;`\n\n`echo “Hello\
  \ USER”`\n\n...这里的输出是 `Hello USER`，而不是预期的 `Hello Mike`。\n\n为了在输出字符串中包含常量值，必须单独引用它并使用\
  \ PHP 的 `.` 拼接运算符将其“连接”到字符串，如下：\n\n`echo ‘Hello ‘ . USER ;`\n\n...这里的输出现在是预期的 `Hello\
  \ Mike`。\n\n数组常量（所有元素都包含固定数据值的数组）也可以使用 `define()` 函数创建，如下：\n\n`define( ‘WEEKDAYS’\
  \ , [ ‘Mon’, ‘Tue’ , ‘Wed’ , ‘Thu’ , ‘Fri’ ] ) ;`\n\n![image](img/Image00003.jpg)\n\
  \n使用 `define()` 函数创建常量数组的能力是 PHP 7 引入的新功能。\n\n脚本作者定义的常量可以像 PHP 内置的预定义常量一样被使用，例如描述版本和服务器操作系统的\
  \ `PHP_VERSION` 和 `PHP_OS`。\n\n![image](img/Image00029.jpg)\n\nconstant.php\n\n\
