  `\n\n\n\n通过向 `substr()` 函数传递字符串以及子字符串在字符串中的索引位置作为参数，可以从字符串中提取子字符串。可选的第三个参数可以指定子字符串的长度。你可以使用\
  \ `substr_replace()` 函数来替换子字符串，该函数需要指定字符串、子字符串、索引位置和长度参数。可以使用 `substr_count()` 函数找到子字符串在字符串中总次数：\n\
  \n![image](img/Image00029.jpg)\n\nsubstring.php\n\n![image](img/Image00098.jpg)\
  \  开始一个 PHP 脚本，使用语句初始化一个带有字符串值的变量\n\n```php\n<?php\n$str = ‘SQL in easy steps features\
  \ SQL queries’ ;\necho “’ $str ’<br>’SQL’ Count: “ .substr_count( $str , ‘SQL’ )\
  \ ;\n```\n\n![image](img/Image00099.jpg)  接下来，添加语句提取两个子字符串\n\n```php\necho ‘<hr>Index\
  \ 27 : ‘ .substr( $str , 27 ) ;\necho ‘<hr>Index 4 Length 13 : ‘ .substr( $str ,\
  \ 4 , 13 ) ;\n```\n\n![image](img/Image00100.jpg)  现在，添加一个语句初始化一个字符串字符串变量\n\n```php\n\
  $sub = ‘PHP & MySQL’ ;\n```\n\n![image](img/Image00101.jpg)  最后，添加语句用新字符串值替换子字符串，并显示修改后的字符串\n\
  \n```php\n$str = substr_replace( $str , $sub , 0 , 3 ) ;\necho “<hr>’ $str ’” ;\n\
  ?>\n```\n\n![image](img/Image00102.jpg)  将文档保存到网络浏览器的 `/htdocs` 目录中并命名为 `substring.php`，然后通过\
  \ HTTP 打开页面以查看提取的子字符串和修改后的字符串\n\n![image](img/Image00105.jpg)\n\n![image](img/Image00006.jpg)\n\
  \n`substr_replace()` 中的长度参数指定了要替换的子字符串的长度。在这个示例中，它是 `3` —— 用来用更长的字符串替换三个字符‘SQL’。\n\
  \n### 修改大小写\n\nPHP 提供了许多函数来轻松地修改指定字符串参数的大小写。`strtolower()` 函数将所有字符转换为小写，而 `strtoupper()`\
  \ 将它们全部转换为大写。此外，`ucfirst()` 函数仅将字符串的第一个字符转换为大写，而 `ucword()` 函数将字符串中每个单词的第一个字母转换为大写：\n\
  \n![image](img/Image00029.jpg)\n\ncase.php\n\n![image](img/Image00098.jpg)  开始一个\
  \ PHP 脚本，使用语句初始化一个字符串变量并显示其值\n\n```php\n<?php\n$str = “C++ Programming in easy steps”\
  \ ;\necho “Original String : ‘ $str ’ <hr>” ;\n```\n\n![image](img/Image00099.jpg)\
  \  接下来，添加语句显示小写版本\n\n```php\n$ver = strtolower( $str ) ;\necho “Lowercase String\
  \ : ‘ $ver ’ <br>” ;\n```\n\n![image](img/Image00100.jpg)  现在，添加语句显示大写版本\n\n```php\n\
  $ver = strtoupper( $str ) ;\necho “Uppercase String : ‘ $ver ’ <hr>” ;\n```\n\n\
  ![image](img/Image00101.jpg)  最后，添加语句显示首字母大写版本和单词首字母大写版本\n\n```php\n$ver = ucfirst(\
  \ strtolower( $str ) ) ;\necho “Uppercase First String Character : ‘ $ver ’ <br>”\
  \ ;\necho ‘Uppercase First Word Character : ‘ .ucwords( $ver ) ;\n?>\n```\n\n![image](img/Image00102.jpg)\
  \  将文档保存到网络服务器的 `/htdocs` 目录中并命名为 `case.php`，然后通过 HTTP 打开页面以查看原始字符串修改的版本\n\n![image](img/Image00106.jpg)\n\
  \n![image](img/Image00019.jpg)\n\n`ucfirst()` 函数只更改字符串的第一个字符。除非先用 `strtolower()`\
  \ 函数将其转换为小写，否则其他大写字符将保持不变，此处所示。\n\n### 字符串格式化\n\nPHP 提供了许多内置函数来方便格式化字符串。简单的 `strrev()`\
  \ 函数接受单个字符串参数，并以字符反转顺序返回该字符串，因此它是从后往前读取的。\n\n`strrpt()` 函数接受两个参数：指定一个字符串以及该字符串在返回的字符串中应重复的总次数整数。\n\
  \n`strpad()` 函数接受三个参数：指定一个字符串、它将返回的字符字符串的总长度，以及一个用于填充原始字符串与指定返回长度之间差异的字符或子字符串模式。默认情况下，填充将添加到原始字符串的末尾，但也可以通过使用第四个参数特殊的\
  \ `STR_PAD_LEFT` 标志将其添加到开头。\n\n`trim()` 函数可以接受单个字符串参数，并返回一个字符串，其中原始字符串开头和结尾的所有空白字符（空格、换行符、制表符）都被删除。可选的第二个参数可以指定从原始字符串开头和结尾删除的字符或模式，以代替默认的空白。同样，如果你只想从开头删除字符，则使用\
  \ `ltrim()`，如果从结尾删除，则使用 `rtrim()`。\n\n![image](img/Image00005.jpg)\n\n`implode()`\
  \ 和 `explode()` 函数可以将数组转换为字符串，将字符串转换为数组。例如，`explode()` 可以使用分隔符将字符串分割成部分。`strtok()`\
  \ 函数也可以用于分割字符串，但它会记住自己的位置，因此随后的调用只需指定分隔符，直到找不到更多分隔符。你必须在每次调用 `strtok()` 时都指定分隔符，以便它继续向字符串的下一个部分。\n\
  \n![image](img/Image00029.jpg)\n\nformat.php\n\n![image](img/Image00098.jpg)  开始一个\
  \ PHP 脚本，使用语句初始化一个字符串变量并显示其值\n\n```php\n<?php\n$str = “| String Fun |’ ; echo “Original\
  \ String : $str ” ;\n```\n\n![image](img/Image00099.jpg)  接下来，添加语句显示原始字符串的反转、重复和修剪后的版本\n\
  \n```php\necho ‘<hr>Reversed String : ‘ .strrev( $str ) ;\necho ‘<hr>Repeated String\
  \ : ’ .str_repeat( $str , 3 ) ;\necho ‘<hr>Trimmed String : ‘ .trim( $str , ‘’ )\
  \ ;\n```\n\n![image](img/Image00100.jpg)  现在，添加语句显示 30 个字符版本的字符串，并在开头用星号填充\n\n```php\n\
  $pad = str_pad( $str , 30 , ‘*’ , STR_PAD_LEFT ) ;\necho “<hr>Padded String : $pad\
  \ ” ;\n```\n\n![image](img/Image00101.jpg)  最后，添加语句按空格分割字符串，并用省略号显示每个部分\n\n```php\n\
  echo ‘<hr>Split String : ‘ ;\n$token = strtok( $str , ‘’ );\nwhile ( $token )\n\
  {\necho “ $token ... “ ; $token = strtok( ‘’ ) ;\n}\n?>\n```\n\n![image](img/Image00102.jpg)\
  \  将文档保存到网络服务器的 `/htdocs` 目录中并命名为 `format.php`，然后通过 HTTP 打开页面以查看字符串格式化的字符串\n\n![image](img/Image00107.jpg)\n\
  \n![image](img/Image00006.jpg)\n\n`date()` 函数调用时会返回日期字符串，但需要一个字符串参数来指定日期字符串的格式。该格式字符串可以由一系列用于日期的字母选项组成。例如，`date(\
  \ ‘n/j/y’ )` 可能返回“4/22/16”。常用选项列在下方，并附有简要描述：\n\n| **选项:** | **描述:** | **示例:** |\n\
  | :--- | :--- | :--- |\n| **Y** | 四位数的年份 | 2014 |\n| **y** | 两位数的年份 | 14 |\n| **n**\
  \ | 一位或两位数的月份 | 7 |\n| **m** | 两位数的月份 | 07 |\n\n\n\n\n\n| Key | 说明 | 示例 |\n| :---\
  \ | :--- | :--- |\n| **F** | 月份全称 | February |\n| **M** | 三字母的月份 | Feb |\n| **j**\
  \ | 一位或两位数字的日期 | 4 |\n| **d** | 两位数字的日期 | 04 |\n| **l** | 星期全称 | Monday |\n| **D**\
  \ | 三字母的星期 | Mon |\n| **S** | 两位字母的序数后缀 | th |\n| **H** | 24 小时制的小时 | 14 |\n| **i**\
  \ | 分钟 | 45 |\n| **s** | 秒 | 30 |\n| **a** | 上午或下午 | am |\n\n![image](img/Image00019.jpg)\n\
  \n星期全称的选项是一个小写的“L”。\n\n![image](img/Image00005.jpg)\n\n你可以在 PHP 在线线手册 `[php.net/manual](http://www.php.net/manual)`\
  \ 中发现更多 `date()` 函数选项。\n\n默认情况下，时区被设置为协调世界时 (UTC)，但你可以通过向 `date_default_timezone_set()`\
  \ 函数传递参数来设置你自己的时区，并使用 `date_default_timezone_get()` 查看当前设置的时区。\n\n你还可以使用智能的 `strtotime()`\
  \ 函数创建自己的时间戳。该函数可以接受一个日期字符串参数，并返回一个时间戳，该时间戳可以作为第二个参数提供 `date()` 函数。`strtotime()`\
  \ 的参数可以是普通文本日期，例如“July 4, 2017”。此外，你还可以指定如“yesterday”、“+3months”或“next Wednesday”之类的参数，`strtotime()`\
  \ 函数将尝试解析并返回一个适当的时间戳。\n\n![image](img/Image00029.jpg)\n\ndate.php\n\n![image](img/Image00098.jpg)\
  \ 编写一个 PHP 脚本，使用语句显示当前日期、星期、时间和当前默认时区\n\n```php\n<?php\necho ‘Date : ‘ .date( ‘jS\
  \ F Y’ ). ’<br>’ ;\necho ‘Day : ‘ .date( ‘l’ ). ’<br>’ ;\necho ‘Time : ‘ .date(\
  \ ‘h:i:s a’ ). ’<br>’ ;\necho ‘Timezone : ‘ .date_default_timezone_get(). ’<hr>’\
  \ ;\n```\n\n![image](img/Image00099.jpg) 接下来，添加语句更改默认时区并显示确认，然后显示那里的当前时间\n\n```php\n\
  date_default_timezone_set( ‘America/New_York’ ) ;\necho ‘Timezone now : ‘ .date_default_timezone_get()\
  \ ;\necho ‘<br>Time now : ‘ .date( ‘h:i:s a’ ). ’<hr>’ ;\n```\n\n![image](img/Image00100.jpg)\
  \ 现在，添加语句为明天创建一个时间戳，然后显示它的星期名称和日期\n\n```php\n$d = strtotime( ‘tomorrow’ ) ;\necho\
  \ ‘Tomorrow : ‘ .date( ‘l, jS F Y’ , $d ). ’<br>’ ;\n```\n\n![image](img/Image00101.jpg)\
  \ 最后，添加语句为一个难忘的日期创建一个时间戳，然后显示它的月份和日期数字\n\n```php\n$d = strtotime( ‘July 11, 1994’\
  \ ) ;\necho ‘David’s Birthday : ‘ .date( ‘F jS’ , $d ) ;\n?>\n```\n\n![image](img/Image00102.jpg)\
  \ 将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `date.php`，然后通过 HTTP 打开页面以查看由选项格式化的日期字符串。\n\n\
  ![image](img/Image00108.jpg)\n\n![image](img/Image00005.jpg)\n\n注意，你可以在格式字符串中包含如\
  \ `:` 和 `/` 等分隔符。\n\n![image](img/Image00006.jpg)\n\n某些国家偏于 M/D/ Y 的日期顺序，而另一些国家偏于\
  \ D/M/ Y，因此你可以选择你喜欢的日期格式选项。\n\n### 实体编码\n\n有两个 PHP 函数可编码 HTML 代码，使得所有具有特殊意义的字符或不寻字符都被“实体”等价项替换。`htmlentities()`\
  \ 函数编码以下所有字符，每个字符都有对应的实体：\n\n![image](img/Image00109.jpg)\n\n![image](img/Image00005.jpg)\n\
  \n调用带有常量参数 `HTML_ENTITIES` 或 `HTML_SPECIALCHARS` 的 PHP 函数 `get_html_translation_table()`，可以返回所有表示字符的数组。\n\
  \n除非你担心非英语字符，否则通常建议使用替代的 `htmlspecialchars()` 函数仅编码具有特殊 HTML 意义的字符：\n\n* `&` 符号\
  \ – 变为 `&amp;`\n* `“` 双引号 – 变为 `&quot;`\n* `‘` 单引号 – 变为 `&#039;`\n* `<` 小于 – 变为\
  \ `&lt;`\n* `>` 大于 – 变为 `&gt;`\n\n使用 PHP 编码 HTML 代码的一个良好理由是防止恶意 JavaScript 代码被 浏览器意外执行。将\
  \ HTML 标签编码为实体可以确保 `<script>` 标签不会识别，因此其 JavaScript 代码内容将不会执行：\n\n![image](img/Image00029.jpg)\n\
  \ndate.php\n\n![image](img/Image00098.jpg)\n\n```php\n<?php\n$html = “<script>alert('XSS');</script>”;\n\
  echo htmlentities($html);\n?>\n```\n\n### 总结\n\n* `date()` 函数需要一个字符串参数，该参数指定了确定返回日期字符串格式的选项。\n\
  * 默认情况下，PHP 日期时区设置为 UTC。\n* `date_default_timezone_set()` 函数可指定 UTC 默认时区的备选方案。\n\
  * `strtotime()` 函数将尝试为其收到的任何日期或时间参数返回一个适当的时间戳。\n* `htmlentities()` 函数将编码所有具有实体的字符串字符。\n\
  * `htmlspecialchars()` 函数将仅编码具有特殊 HTML 意义的字符，以避免被浏览器识别。\n\n\n\n\n\n类（class）是一种可以在单个实体中同时包含变量和函数的数据结构。这些统称为该类的“成员”（members）——变量被称为类的“属性”（properties），而函数被称为类的“方法”（methods）。\n\
  \n![image](img/Image00113.jpg)\n\n从类外部访问类成员的行为由类声明中的“访问修饰符”（access specifiers）控制。通常，这些修饰符会拒绝对类变量的访问，但允许访问可以从这些变量中存储和检索数据的方法。这种“数据隐藏”技术确保了存储的数据安全地封装在类变量成员内部，是面向对象编程（OOP）的第一条原则。\n\
  \n类声明以 `class` 关键字开始，后面跟着一个空格，然后是程序员指定的名称——遵循通常 PHP 命名规范，但以大写字母开头。接下来是类属性声明，然后是类方法声明。这些类似于普通的变量和函数声明，但每个声明都应该以访问修饰符开头。类声明的语法如下：\n\
  \n```\nclass ClassName\n{\n    access-specifier $var1, $var2, $var3;\n    access-specifier\
  \ functionName1($arg1, $arg2, $arg3)\n    {\n        statements-to-execute;\n  \
  \  }\n}\n```\n\n![image](img/Image00005.jpg)\n\n按照习惯，类名以大写字母开头，对象名以小写字母开头。\n\n访问修饰符可以是\
  \ `public``private` 或 `protected` 关键字之一，用于指定列出成员的访问权限：\n\n* `public` 成员可以在类可见的任何地方被访问\n\
  * `private` 成员仅对定义它的同一类中的其他成员可访问\n* `protected` 成员仅对同一类的其他成员以及该类派生类的成员可访问\n\n![image](img/Image00005.jpg)\n\
  \n派生类将在本章稍后部分介绍——请参见此处。\n\n任何现实世界中的对象都可以通过它的属性和动作来定义。例如，狗有年龄、体重和颜色等属性，以及它可以执行的如叫等动作。PHP\
  \ 中的类机制提供了一种在脚本中创建虚拟狗对象的方法，其中类属性可以代表它的属性，类方法可以代表它的动作：\n\n```php\nclass Dog\n{\n\
  \    private $age;\n    private $weight;\n    private $color;\n    public function\
  \ bark() { echo ‘WOOF!’ ; }\n    // 在此处添加向属性中存储数据的方法。\n    // 在此处添加从属性中检索数据的方法。\n\
  }\n```\n\n![image](img/Image00006.jpg)\n\n虽然 PHP 脚本类不能完美模拟真实世界的对象，但目标是将所有相关的属性和动作封装为类属性和方法。\n\
  \n重要的是，类声明只定义了一个数据结构——为了创建一个对象，你必须声明该数据结构的一个“实例”（instance）。这通过使用 `new` 关键字将类的副本赋值给变量来实现，如下：\n\
  \n```php\n$fido = new Dog(); // 创建一个名为“fido”的实例\n// 属于程序员定义的\n// “Dog”数据结构。\n```\n\
  \n实例对象是原始类数据结构的工作副本，因此保留了它的所有特性。由于上面示例中的方法已声明为 `public`，因此它在类声明外的脚本中是可见的。这意味着可以使用特殊的\
  \ `->` 对象操作符调用实例拷贝的方法，如下：\n\n```php\n$fido->bark(); // 输出 WOOF!\n```\n\n`->` 对象操作符可以用于引用任何可见的类成员，但上面示例中的变量属性已声明为\
  \ `private`，因此被封装在对象内部且无法直接访问。PHP 编程中的封装原则描述了在类成员中将数据和功能组合在一起——这些在这个 `Dog` 类中就是年龄、体重、颜色属性和\
  \ bark 动作。\n\n![image](img/Image00019.jpg)\n\n注意，在创建实例对象的语句中，必须在类名后添加括号。\n\n###\
  \ 创建对象\n\n为了从类的私有成员中分配和检索数据，必须向类中添加特殊的 `public` 访问方法。这些是用于分配数据的“setter”（设置器）方法，以及用于检索数据的“getter”（获取器）方法。访问方法通常以它们所处理的变量命名，首字母大大写，并分别以“set”或“get”作为前缀。例如，处理\
  \ `age` 变量的访问方法可以命名为 `setAge()` 和 `getAge()`。\n\nsetter 和 getter 方法可以使用特殊的 `$this`\
  \ “伪变量”引用同一类的成员，随后跟上 `->` 对象操作符和属性名。例如，使用 `$this->age` 来引用年龄属性：\n\n![image](img/Image00029.jpg)\n\
  \nobject.php\n\n![image](img/Image00114.jpg)  用语句开始 PHP 脚本声明一个名为“Dog”的类\n\n```php\n\
  <?php\nclass Dog\n{\n    // 在此处插入成员（步骤 2-5）。\n}\n```\n\n![image](img/Image00115.jpg)\
  \  在 Dog 类的括号之间，声明三个私有成员\n\n```php\nprivate $age;\nprivate $weight;\nprivate $color;\n\
  ```\n\n![image](img/Image00016.jpg)  在私有变量之后，添加一个公共方法以便在调用时输出字符串\n\n```php\npublic\
  \ function bark() { echo ‘WOOF! <br>’ ; }\n```\n\n![image](img/Image00117.jpg) \
  \ 为每个私有变量添加 setter 方法以分配值\n\n```php\npublic function setAge(int $yrs) {\n    $this->age\
  \ = $yrs;\n}\npublic function setWeight(int $lbs) {\n    $this->weight = $lbs;\n\
  }\npublic function setColor(string $fur) {\n    $this->color = $fur;\n}\n```\n\n\
  ![image](img/Image00118.jpg)  在类声明中，注意所有方法都是公共的，所有变量都是私有的。这种“公共接口，私有数据”的概念是一个核心。添加\
  \ getter 方法从每个私有变量中检索值\n\n```php\npublic function getAge() {\n    return $this->age;\n\
  }\npublic function getWeight() {\n    return $this->weight;\n}\npublic function\
  \ getColor() {\n    return $this->color;\n}\n```\n\n![image](img/Image00119.jpg)\
  \  在 Dog 类之后，声明一个名为“fido”的 Dog 类实例\n\n```php\n$fido = new Dog();\n```\n\n![image](img/Image00120.jpg)\n\
  \nFido\n\n![image](img/Image00121.jpg)  通过调用每个 setter 方法分配数据\n\n```php\n$fido->setAge(3);\n\
  $fido->setWeight(15);\n$fido->setColor('brown');\n```\n\n![image](img/Image00122.jpg)\
  \  通过调用每个 getter 方法检索分配的值\n\n```php\necho ‘Fido is a ‘ . $fido->getColor() . ‘ dog\
  \ <br>’;\necho ‘Fido is ‘ . $fido->getAge() . ‘ years old <br>’;\necho ‘Fido weighs\
  \ ‘ . $fido->getWeight() . ‘ pounds<br>’;\n```\n\n![image](img/Image00123.jpg) \
  \ 现在，添加对普通方法的调用\n\n```php\n$fido->bark();\n?>\n```\n\n![image](img/Image00124.jpg)\
  \  将文档保存到 Web 服务器的 `/htdocs` 目录并为 `object.php`，然后通过 HTTP 打开页面查看类属性和方法的调输出\n\n![image](img/Image00125.jpg)\n\
  \n![image](img/Image00003.jpg)\n\nPHP 7 的新功能是还可以创建具有简单功能且没有的“匿名类”。例如，`$util = new\
  \ class { public function log($s) { echo $s ; } } ;`，可以通过 `$util->log( ‘Data’ )`\
  \ 进行调用。\n\n![image](img/Image00005.jpg)\n\n随着新功能的引入，**object.php** 脚本将在接下来的几页中进行修改。\n\
  \n### 初始成员\n\n程序可以通过声明类的多个实例来轻松地创建多个对象，并且通过向其 setter 方法分配单独值，每个对象都可以拥有独特的属性。\n\n\
  \n\n\n通常将设置方法（setter methods）合并到一个接受每个私有变量参数的单一方法会更方便。这意味着在程序中可以使用一个语句完成所有赋值，但该方法将包含多个语句。\n\
  \n可选地，每个参数可以为传递的每个参数指定允许的数据类型，还可以有用地为每个参数指定默认值：\n\n![image](img/Image00029.jpg)\n\
  \n`initializer.php`\n\n![image](img/Image00114.jpg)  将上一个示例“object.php”的副本重命名为新程序“initializer.php”\n\
  \n![image](img/Image00115.jpg)  在 `Dog` 类声明中，将三个设置方法替换为单一的组合设置方法，并指定参数的数据类型和默认值\n\
  \n```php\npublic function setValues(int $yrs = 2, int $lbs = 8, string $fur = ‘black’)\
  \ {\n    // 在此处插入语句。\n}\n```\n\n![image](img/Image00116.jpg)  在方法定义块中，插入三条语句，将传递参数的值赋值给类变量\n\
  \n```php\n$this->age = $yrs;\n$this->weight = $lbs;\n$this->color = $fur;\n```\n\
  \n![image](img/Image00117.jpg)  在修改类定义后，将对三个设置方法的替换替换为组合设置方法的单一调用——传递三个参数\n\n```php\n\
  $fido -> setValues(3, 15, ‘brown’);\n```\n\n![image](img/Image00118.jpg)  声明 `Dog`\
  \ 类的第二个实例，名为“pooch”\n\n```php\n$pooch = new Dog();\n```\n\n![image](img/Image00119.jpg)\
