  \ 脚本，其 `method` 属性指定数据如何发送到脚本。\n\n\n\n\n将密码存储在 cookie 中并不是最安全的方法，但此处仅用于演示如何使用 cookie\
  \ 存储数据。\n\n### 设置 cookie\n\n在接收到表单提交后，PHP 脚本可以检查字段是否存在，并可能对其关联的值进行验证。例如，可以使用 `ctype_alnum()`\
  \ 函数简单地确认值是否只包含字母和数字。\n\n通过验证后，可以使用 `setcookie()` 函数存储提交的字段名称和值。此外，可以使用 `md5()`\
  \ 函数对密码值进行哈希转换。成功完成后，脚本可以使用 `header()` 函数将浏览器重定向到另一个页面，指定该页面的 URL：\n\n![image](img/Image00029.jpg)\n\
  \ncookie_set.php\n\n![image](img/Image00054.jpg) 开始一个 PHP 脚本，使用一个函数来处理失败的验证尝试\n\n\
  ```php\n<?php\n\nfunction reject ( $entry )\n{\necho “Invalid $entry <br>” ;\necho\
  \ ‘Please <a href=” cookie_form.html ”>Log In</a> ;\nexit() ;\n}\n```\n\n![image](img/Image00055.jpg)\
  \ 接下来添加一个条件测试块，为有效数据设置两个 cookie，或调用函数处理失败的尝试\n\n```php\nif( isset( $_POST[ ‘user’\
  \ ] ) )\n{\n$user = trim( $_POST[ ‘user’ ] ) ;\nif( !ctype_alnum( $user ) ) { reject(\
  \ ‘User Name’ ) ; }\nif( isset( $_POST[ ‘pass’ ] ) )\n{\n$pass = trim( $_POST[ ‘pass’\
  \ ] ) ;\nif( !ctype_alnum( $pass ) ) { reject( ‘Password’ ) ; }\nelse\n{\nsetcookie(\
  \ ‘user’ , $user , time()+ 3600 ) ;\nsetcookie( ‘pass’ , md5( $pass ) , time()+\
  \ 3600 ) ;\nheader( ‘Location: cookie_get.php ’ ) ;\n}\n}\n}\nelse { header( ‘Location:\
  \ cookie_form.html ’ ) ; }\n?>\n```\n\n![image](img/Image00056.jpg) 将文档保存到 Web 服务器的\
  \ `/htdocs` 目录并命名为 `cookie_set.php`，然后查看如何检索存储的 cookie 数据\n\n![image](img/Image00006.jpg)\n\
  \n`ctype_alnum()` 函数仅在其参数包含字母和数字时才返回 true。\n\n![image](img/Image00005.jpg)\n\n注意这里如何使用\
  \ `time()` 函数获取当前时间，然后增加一小时（秒），以便将 cookie 的过期时间设置为一小时后。\n\n![image](img/Image00005.jpg)\n\
  \n如果直接打开脚本的 URL，最后的 `else` 语句将重定向到 HTML 表单页面。\n\n### 获取 cookie\n\n一旦设置了 cookie，它们会被自动分配给特殊的\
  \ PHP `$_COOKIE` 全局数组变量。脚本可以使用 PHP 内置的 `isset()` 函数检查单个 cookie 是否存在，以寻找指定名称的 cookie。当确认\
  \ cookie 确实存在时，可以将其值很有用地赋值给普通脚本变量。这可能用于检索存储的用户名以便在页面上输出。如果请求的 cookie 不存在，脚本可以为用户提供替代方案：\n\
  \n![image](img/Image00029.jpg)\n\ncookie_get.php\n\n![image](img/Image00054.jpg)\
  \ 开始一个 PHP 脚本，通过测试查找 cookie 并在成功后检索数据输出\n\n```php\n<?php\n\nif( isset( $_COOKIE[\
  \ ‘user’ ] ) )\n{\n$user = $_COOKIE[ ‘user’ ] ;\necho “<h1>Welcome $user !</h1><hr>”\
  \ ;\necho ‘<a href=” cookie_data.php ”>View Cookie</a>’ ;\n}\n```\n\n![image](img/Image00055.jpg)\
  \ 接下来，为 cookie 不存在的情况添加替代输出\n\n```php\nelse\n{\necho ‘Please <a href=” cookie_form.html\
  \ ”>Log In</a>’\n}\n?>\n```\n\n![image](img/Image00056.jpg) 将文档保存到 Web 服务器的 `/htdocs`\
  \ 目录并命名为 `cookie_get.php`\n\n![image](img/Image00057.jpg) 现在通过 HTTP 打开 HTML 表单 `cookie_form.html`（此处\
  \ 创建）并点击提交按钮，查看登录尝试未通过验证，因此没有设置任何 cookie\n\n![image](img/Image00180.jpg)\n\n![image](img/Image00058.jpg)\
  \ 点击超链接返回 HTML 表单并输入有效的用户名，然后点击提交按钮，再次查看登录尝试未通过验证\n\n![image](img/Image00181.jpg)\n\
  \n![image](img/Image00061.jpg) 再次返回 HTML 表单，输入有效的用户名和密码，查看验证成功\n\n![image](img/Image00182.jpg)\n\
  \n![image](img/Image00183.jpg)\n\n![image](img/Image00184.jpg)\n\n![image](img/Image00185.jpg)\
  \ 再次返回 HTML 表单，输入有效的用户名和密码，查看验证成功——使用 `cookie_data.php` 查看所有数据\n\n![image](img/Image00055.jpg)\
  \ `$_COOKIE` 全局数组变量存储了与 cookie 相关的键和值。\n\n### 查看 cookie 数据\n\n一旦设置了 cookie，它们会被自动分配给特殊的\
  \ PHP `$_COOKIE` 全局数组变量。脚本可以使用 PHP 内置的 `isset()` 函数检查单个 cookie 是否存在，以寻找指定名称的 cookie。当确认\
  \ cookie 确实存在时，可以将其值很有用地赋值给普通脚本变量。这可能用于检索存储的用户名以便在页面上输出。如果请求的 cookie 不存在，脚本可以为用户提供替代方案：\n\
  \n```php\n<?php\nif( count($_COOKIE) > 0 )\n{\nforeach($_COOKIE as $key => $value)\n\
  {\necho \"<dt>$key</dt>\";\necho \"<dd>$value</dd>\";\n}\necho \"</dl>\";\n}\nelse\n\
  {\necho \"No cookies found.\";\n}\n?>\n```\n\n`$_COOKIE` 全局数组存储了与 cookie 相关的键和值。你也可以使用\
  \ `var_dump()` 查看所有数据。\n\n\n\n\n<form name = ”entry” method = ” POST ” action =\
  \ ” session_set.php ”>\n<fieldset>\n<legend>用户名：仅限字母 </legend>\n用户名： <input type=”text”\
  \ name=” user ” >\n密码： <input type=”password” name=” pass ” >\n<p> 密码：仅限 A-Z a-z\
  \ 0-9 . _ (至少 8 个字符) </p> <input type=”submit” value=”登录”>\n</fieldset>\n</form>\n\
  \n![image](img/Image00055.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录，并命名为 `session_form.html`，然后通过\
  \ HTTP 打开页面以查看表单。\n\n![image](img/Image00190.jpg)\n\n![image](img/Image00019.jpg)\n\
  \n只有在页面顶部调用了 `session_start()` 函数，PHP 脚本才能访问会话变量。\n\n### 设置 Session\n\n接收到表单提交后，PHP\
  \ 脚本可以检查字段是否存在，并可能对其关联的值进行验证。例如，可以使用 `ctype_alpha()` 函数确认它们仅包含字母，可以使用 `preg_match()`\
  \ 函数确认值是否匹配指定模式。一旦验证通过，可以将提交的字段名称和值赋值给 `$_SESSION` 全局数组变量的元素。成功完成后，脚本可以使用 `header()`\
  \ 函数指定该页面的 URL，将浏览器重定向到下一个页面：\n\n![image](img/Image00029.jpg)\n\nsession_set.php\n\
  \n![image](img/Image00054.jpg) 添加初始 PHP 脚本使会话可用\n\n```php\n<?php session_start();\
  \ ?>\n```\n\n![image](img/Image00055.jpg) 开始一个处理验证失败尝试的 PHP 脚本\n\n```php\n<?php\n\
  function reject ( $entry )\n{\necho “无效的 $entry <br>” ;\necho ‘请 <a=” session_form.html\
  \ ”>登录</a>’ ;\nexit() ;\n}\n```\n\n![image](img/Image00056.jpg) 添加条件测试块以为有效数据设置两个\
  \ cookie，或调用函数处理失败的尝试\n\n```php\nif( isset( $_POST[ ‘user’ ] ) )\n{\n$user = trim(\
  \ $_POST[ ‘user’ ] ) ;\nif( !ctype_alpha( $user ) ) { reject( ‘用户名’ ) ; }\nif( isset(\
  \ $_POST[ ‘pass’ ] ) )\n{\n$pass = trim( $_POST[ ‘pass’ ] ) ;\nif( !preg_match(\
  \ ‘/^[A-Za-z0-9._]{8,}$/’ , $pass ) )\n{ reject( ‘密码’ ) ; }\nelse\n{\n$_SESSION[\
  \ ‘user’ ] = $user ;\n$_SESSION[ ‘pass’ ] = $pass ;\nheader( ‘Location: session_get.php\
  \ ’ ) ;\n}\n}\n} else { header( ‘Location: session_form.html ’ ) ; }\n?>\n```\n\n\
  ![image](img/Image00057.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录，并命名为 `session_set.php`，然后查看如何检索数据。\n\
  \n![image](img/Image00006.jpg)\n\n`ctype_alpha()` 函数仅在其参数包含字母时才返回 true。\n\n![image](img/Image00005.jpg)\n\
  \n`preg_match()` 函数接受一个正则表达式和一个字符串参数。正则表达式超出了本书的范范围，但你可以精确地复制此示例，以允许表单上描述的许可密码模式。在此示例中，密码未加密，以便在稍后演示用户密码符合指定要求。\n\
  \n### 获取 Session\n\n在调用 `session_start()` 函数后，可以从特殊的 `$_SESSION` 全局数组变量访问会话数据。PHP\
  \ `isset()` 函数可以查找指定名称的元素。当确认该元素存在时，可以将它的值方便地赋值给普通脚本变量。这可以用于检索存储的用户名并在页面上输出。如果找不到的元素，脚本可以为用户提供替代方案：\n\
  \n![image](img/Image00029.jpg)\n\nsession_get.php\n\n![image](img/Image00054.jpg)\
  \ 添加初始 PHP 脚本使会话可用\n\n```php\n<?php session_start() ; ?>\n```\n\n![image](img/Image00055.jpg)\
  \ 现在，开始一个 PHP 脚本来查找会话变量并在成功后检索数据输出，或者在会话变量不存在时提供替代方案\n\n```php\nif( isset( $_SESSION[\
  \ ‘user’ ] ) )\n{\n$user = $_SESSION[ ‘user’ ] ;\necho “<h1>欢迎 $user !</h1><hr>”\
  \ ;\necho ‘<a=” session_data.php ”>查看会话</a>’ ;\n}\nelse\n{ echo ‘请 <a=” session_form.html\
  \ ”>登录</a>’ ; }\n?>\n```\n\n![image](img/Image00057.jpg) 将文档保存到 Web 服务器的 `/htdocs`\
  \ 目录，并命名为 `session_set.php`，然后查看如何检索数据（注：此处再次提到了 session_set.php，但上下文暗示是 session_get.php）。\n\
  \n\n\n\n\n![image](img/Image0019.jpg) 使用浏览器中的 ![image](img/Image00198.jpg) 刷新按钮重新加载此页面以查看备用的“请登录”内容\n\
  \n![image](img/Image00005.jpg)\n\n注意密码符合允许的模式。\n\n### 总结\n\n- PHP `set_cookie()`\
  \ 函数可将用户数据存储在客户端机器，以便在网站的各个页面之间使用\n- `set_cookie()` 函数至少应提供三个参数，以指定名称、值和过期时间\n-\
  \ 通过 `POST` 方法提交的 HTML 表单会自动将字段数据分配给 PHP `$_POST` 全局数组变量\n- `isset()` 函数可以在 `$_POST`\
  \ 全局数组中查找指定 HTML 字段名的元素\n- `ctype_alnum()` 函数可用于确认一个值是否仅包含字母和数字数据以进行验证\n- 使用 `md5()`\
  \ 函数对密码值进行哈希转换以进行加密\n- PHP `header()` 函数可以指定 `Location:URL` 来重定向浏览器\n- 一旦设置了 cookie，它们会自动分配给特殊的\
  \ PHP `$_COOKIE` 全局数组变量\n- 用户数据可以存储在服务器的 PHP `$_SESSION` 全局数组变量中，作为 cookie 存储的替代方案\n\
  - 要使用 session，每个 PHP 页面必须在任何 HTML 标签之前的顶部调用 `session_start()` 函数\n- 提交到 `$_POST`\
  \ 全局数组的 HTML 字段数据可以分配给 `$_SESSION` 全局变量数组元素\n- `ctype_alpha()` 函数可用于确认一个值仅包含字母数据以进行验证\n\
  - `preg_match()` 函数可用于确认一个值是否匹配指定的模式以进行验证\n- 每个 session 都有唯一的 session ID 数字，可以使用\
  \ PHP `session_id()` 函数查看\n- 使用 `unset()` 函数可以移除 session 变量，可以使用 `session_destroy()`\
  \ 函数终止 session\n- 使用 `var_dump()` 函数并遍历 `$_COOKIE` 或 `$_SESSION` 数组可以查看存储的内容\n\n\
  11\n\n## 连接数据库\n\n*本章演示了如何使用 PHP 和 MySQL 数据库建立一个简单的用户论坛。*\n\n- 建立连接\n- 创建论坛\n- 提供页面\n\
  - 提供表单\n- 处理消息\n- 确认成功\n- 总结\n\n### 建立连接\n\n可以从标准的 PHP 脚本尝试连接 MySQL 数据库。脚本定义了一个名为\
  \ `dbc`（数据库连接）的变量，其值赋值为调用内置 `mysqli_connect()` 函数的返回值。该调用需要四个参数来指定主机服务器、MySQL 用户名和密码以及要连接的数据库。调用成功时，`mysqli_connect()`\
  \ 函数返回一个代表与 MySQL 服务器连接的“对象”。脚本如下：\n\n```php\n<?php\n$dbc = mysqli_connect('host',\
  \ 'user', 'password', 'database')\nOR die (mysqli_connect_error());\nmysqli_set_charset($dbc,\
  \ 'utf-8');\n```\n\n![image](img/Image00029.jpg)\n\nconnect_db.php\n\n![image](img/Image00199.jpg)\n\
  \nMySQL 社区版可以在 [mysql.com/downloads/mysql](http://www.mysql.com/downloads/mysql)\
  \ 免费获取\n\n`mysqli_connect()` 调用成功返回的对象非常重要，因为它被用作与其他 MySQL 服务器通信的其他 PHP 函数的参数。例如，在上面的脚本中，它必须作为调用\
  \ `mysqli_set_charset()` 的第一个参数来标识连接。\n\n![image](img/Image00005.jpg)\n\n本章假设 MySQL\
  \ 数据库服务器已为本地服务器上的用户安装并配置，并且具有使用名为“website_db”数据库的完全权限。更多说明和示例可以在我们的系列丛书 [PHP & MySQL\
  \ in easy steps](http://ineasysteps.com/products-page/all_books/php-mysql-in-easy-steps/)\
  \ 中找到。\n\n当连接脚本调用失败时，脚本将跳转到调用 `die()` 函数的备用分支。这等同于调用 `exit()` 立即终止脚本。可选的是 `die()`\
  \ 函数接受一个字符串参数并在脚本停止时打印。在这种情况下，字符串消息由 `mysqli_connect_error()` 函数返回，描述了连接尝试失败的原因。\n\
  \n由于连接脚本包含敏感的用户详细信息，它不能放置在 Web 服务器 `/htdocs` 目录下的其他 PHP 脚本旁边。`connect_db.php` 脚本应该位于\
  \ `/htdocs` 的父目录中，在那里无法被直接访问，但可以通过 `require` 语句纳入其他 PHP 脚本中，例如：\n\n```php\n<?php\n\
  require ('connect_db.php');\nif ($dbc) {\n    echo 'Connection successful';\n}\n\
  ?>\n```\n\n### 创建论坛\n\n用户消息可以通过 PHP 脚本存储在 MySQL 数据库表中，因此随后可以检索它们并在论坛页面中显示。通常，一个包含消息的数据库表可能会存储帖子\
  \ ID、用户的名和姓、主题、消息本身以及发布日期：\n\n| 字段名 | 内容类型 | 示例 |\n| :--- | :--- | :--- |\n| post_id\
  \ | 数字 | 123 |\n| first_name | 文本 | Mike |\n| last_name | 文本 | McGrath |\n| subject\
  \ | 文本 | Ice Cream |\n| message | 文本 | Delicious on a hot day. |\n| post_date |\
  \ 日期/时间 | 2016-07-24 12:30:00 |\n\n![image](img/Image0019.jpg)\n\nMySQL 数据库表只能由\
  \ MySQL root 用户或被授予完全访问权限的另一个 MySQL 用户创建。\n\n这种设计的数据库表可以使用结构化查询语言 (SQL) 创建。该数据库表的设计仅要求为存储文本的列指定\
  \ SQL `VARCHAR` 或 `TEXT` 数据类型。帖子 ID 应该是正 SQL 整数 `INT` 值，表通过 `AUTO_INCREMENT` 自动分配，而发布时间戳应存储为\
  \ SQL `DATETIME` 值。向数据库表发布消息时需要所有项目，因此每个列都必须具有 SQL `NOT NULL` 规则。\n\n![image](img/Image00005.jpg)\n\
  \n用于以名为“forum”的 MySQL 数据库生成此设计的 SQL 查询命令可以在 MySQL 命令行客户端的提示符处发布，也可以通过在浏览器中运行 PHP\
  \ 脚本发布。\n\n![image](img/Image00029.jpg)\n\ncreate_forum.php\n\n\n\n\n\n![image](img/Image0006.jpg)\
  \  通过一个语句开始 PHP 脚本，使用上一页中描述的标准连接脚本连接数据库\n\n```php\n<?php\n\nrequire( ‘..\\ connect_db.php\
  \ ’ ) ;\n```\n\n![image](img/Image00068.jpg)  接下来，将表设计的 SQL 规范赋值给变量\n\n```php\n\
  $sql = ‘CREATE TABLE IF NOT EXISTS forum ( ‘ .\n‘post_id INT UNSIGNED NOT NULL AUTO_INCREMENT\
  \ ,’ .\n‘first_name VARCHAR(20) NOT NULL ,’ .\n‘last_name VARCHAR(40) NOT NULL ,’\
  \ .\n‘subject VARCHAR(60) NOT NULL ,’ .\n‘message TEXT NOT NULL ,’ .\n‘post_date\
  \ DATETIME NOT NULL ,’ .\n‘PRIMARY KEY ( post_id ) ) ‘ ;\n```\n\n![image](img/Image00069.jpg)\
  \  现在，添加测试来报告表是否创建成功，或者在失败时描述错误\n\n```php\nif( mysqli_query( $dbc , $sql ) === TRUE\
  \ )\n{\necho ‘Table “forum” created successfully’ ;\n}\nelse\n{\necho ‘Error creating\
  \ table : ‘ .mysqli_error( $dbc ) ;\n}\n```\n\n![image](img/Image00070.jpg)  记住在完成后关闭数据库连接\n\
  \n```php\nmysqli_close( $dbc ) ;\n```\n\n![image](img/Image00072.jpg)  将文档保存到 Web\
  \ 服务器的 `/htdocs` 目录并命名为 `create_forum.php`，然后通过 HTTP 打开页面以创建论坛表\n\n![image](img/Image00202.jpg)\n\
  \n![image](img/Image00005.jpg)\n\n`VARCHAR` 数据类型指定字符长度，而 `TEXT` 数据类型可以容纳多达 65,535\
  \ 个字符。\n\n![image](img/Image00005.jpg)\n\n`mysqli_query()` 函数执行 SQL 查询，而 `mysqli_error()`\
  \ 函数会在发生时提供报告。\n\n## 提供页面\n\n可以创建一个论坛页面，用于显示从上一页创建的 MySQL ‘forum’ 表中检索的之前发布的消息。论坛消息可以显示在页眉和页脚之间，并带有一个指向另一个页面的超链接，用户可以在该页面发布新的论坛消息。如果论坛数据库中没有之前发布的内容，脚本可以简单地提示当前没有消息。\n\
  \nPHP `mysqli_query()` 函数可以进行 SQL 查询以检索表内容，而 `mysqli_num_rows()` 函数可以发现结果中有多少表行。当结果中找到表行时，可以使用\
  \ `mysqli_fetch_array()` 函数通过指定结果和 `MYSQLI_ASSOC` 常量作为参数来获取行和每列数据的关联数组：\n\n![image](img/Image00029.jpg)\n\
  \nforum.php\n\n![image](img/Image00067.jpg)  通过一个语句开始 PHP 脚本设置页面标题\n\n```php\n<?php\n\
  \n$page_title = ‘PHP Forum’ ;\n```\n\n![image](img/Image00068.jpg)  接下来，添加一个语句包含页眉\n\
  \n```php\ninclude ( ‘includes/header.html’ ) ;\n```\n\n![image](img/Image00069.jpg)\
  \  添加一个语句打开数据库连接\n\n```php\nrequire ( ‘..\\connect_db.php’ ) ;\n```\n\n![image](img/Image00070.jpg)\
  \  从数据库表中检索所有消息并将其赋值给变量\n\n```php\n$sql = ‘SELECT * FROM forum’ ;\n$result = mysqli_query(\
  \ $dbc , $sql ) ;\n```\n\n![image](img/Image00072.jpg)  测试数据库表是否为空并显示适当的提示注释\n\n\
  ```php\nif ( mysqli_num_rows( $result ) > 0 )\n{\n// 在此处插入语句（步骤 6）。\n}\nelse\n{\n\
  echo ‘<p>There are currently no messages.</p>’ ;\n}\n```\n\n![image](img/Image00006.jpg)\n\
  \n列作为关联数组返回，其中行名是该列中每个值的键。\n\n![image](img/Image00082.jpg)  接下来，插入语句，如果找到了从数据库表中检索出的所有消息，则编写一个显示这些消息的表\n\
  \n```php\necho ‘<table><tr><th>Posted By</th>\n<th>Subject</th><th id=”msg”>Message</th></tr>’\
  \ ;\nwhile ( $row = mysqli_fetch_array( $result , MYSQLI_ASSOC ) )\n{\necho ‘<tr><td>’\
  \ .\n$row[ ‘first_name’ ] . ’ ‘ .\n$row[ ‘last_name’ ] . ‘<br>’ .\n$row[ ‘post_date’\
  \ ] . ’</td><td>’ .\n$row[ ‘subject’ ] . ‘</td><td>’ .\n$row[ ‘message’ ] . ‘</td></tr>’\
  \ ;\n}\necho ‘</table>’ ;\n```\n\n![image](img/Image00203.jpg)  在测试块之后，添加一个语句创建一个指向“发布消息”页面的超链接\n\
  \n```php\necho ‘<p><a href=” post.php ”>Post Message</a></p>’ ;\n```\n\n![image](img/Image00204.jpg)\
  \  现在，添加一个语句关闭数据库连接\n\n```php\nmysqli_close( $dbc ) ;\n```\n\n![image](img/Image00070.jpg)\
  \  添加一个最终语句包含页脚\n\n```php\ninclude ( ‘includes/footer.html’ ) ;\n```\n\n![image](img/Image00072.jpg)\
  \  将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `create_forum.php`，然后通过 HTTP 打开页面以创建论坛表\n\n\
  ![image](img/Image00202.jpg)\n\n![image](img/Image00005.jpg)\n\n`VARCHAR` 数据类型指定字符长度，而\
  \ `TEXT` 数据类型可以容纳多达 65,535 个字符。\n\n![image](img/Image00005.jpg)\n\n`mysqli_query()`\
  \ 函数执行 SQL 查询，而 `mysqli_error()` 函数会在发生时提供报告。\n\n## 处理消息\n\n可以创建一个论坛页面，用于显示从上一页创建的\
  \ MySQL ‘forum’ 表中检索的之前发布的消息。论坛消息可以显示在页眉和页脚之间，并带有一个指向另一个页面的超链接，用户可以在该页面发布新的论坛消息。如果论坛数据库中没有之前发布的内容，脚本可以简单地提示当前没有消息。\n\
