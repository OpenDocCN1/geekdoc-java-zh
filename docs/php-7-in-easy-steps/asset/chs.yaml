  \  return $details ;\n    }\n}\n```\n\n![image](img/Image00014.jpg)  现在，添加另一个在条件测试失败时抛出异常的函数\n\
  \n```php\nfunction check_parity ( $num )\n{\n    if( $num % 2 !== 0 )\n    {\n \
  \       throw new CustomException ( “Number : $num <br>Value must be even” ) ;\n\
  \    }\n}\n```\n\n![image](img/Image00015.jpg)  最后，预测特定错误并报告异常\n\n```php\ntry {\
  \ check_parity ( 5 ) ; }\ncatch( CustomException $e )\n{\n    echo ‘<b>Parity Exception!</b><br>’\
  \ . $e -> get_details (). ’<hr>’ ;    \n}\n```\n\n![image](img/Image00017.jpg) \
  \ 将文档保存到 Web 服务器的 `/htdocs` 目录下并为 `exception.php`，然后通过 HTTP 打开页面以查看被捕获的异常和相应的消息详情\n\
  \n![image](img/Image00153.jpg)\n\n![image](img/Image00006.jpg)\n\n关于派生类和继承的更多信息，请参考此处。\n\
  \n![image](img/Image00005.jpg)\n\n`try` 块可以包含多个 `throw` 语句以预测多种错误情况，并可以跟随多个 `catch`\
  \ 块来处理这些异常。\n\n### 总结\n\n- `fopen()` 函数用于创建文件流对象，需要两个参数来指定文件名和文件模式\n- 当尝试创建文件流失败时，使用\
  \ `die()` 函数提供替代方案是一个良好的做法\n- `fread()` 函数用于读取使用 `r` 模式创建的文件流，`filesize()` 函数可以指定文件的字节大小\n\
  - 在完成任何文件操作后，必须通过调用 `fclose()` 函数销毁文件流\n- `fgets()` 函数可以逐行读取文件，`feof()` 函数可以识别文件末尾\n\
  - `fgetc()` 函数可以逐字符读取文件，并在文件末尾返回 false\n- 可以通过向 `fwrite()` 函数中指定文件流和文件名作为参数来将文本写入文件\n\
  - `fwrite()` 函数在使用 `w` 模式时会覆盖现有文本，但在使用 `a` 模式时将追加文本\n- 可以将函数名作为 `set_error_handler()`\
  \ 函数的参数，将其指定为自定义错误处理器\n- 错误处理器函数在发生错误时被调用，也可以显式地使用 `trigger_error()` 函数调用\n- 当发生特定错误情况时，会抛出异常\n\
  - 如果异常未被捕获，PHP 将其视为致命错误并发布 `Uncaught Exception`（未捕获的异常）消息\n- `try` 代码块用于预测特定错误，其相关的\
  \ `catch` 块用于确定当错误发生时脚本应如何继续\n- `Exception` 类对象拥有 `getMessage()`、`getFile()` 和 `getLine()`\
  \ 方法，可以获取异常详情\n- 自定义异常处理器可以作为 `Exception` 类的派生类，以提供自定义异常方法\n\n# 生成表单\n\n*本章演示了如何使用\
  \ PHP 脚本处理 HTML 表单数据。*\n\n- 执行操作\n- 检查设置的值\n- 验证表单数据\n- 过滤数据\n- 发送隐藏数据\n- 处理提交\n\
  - 制作持久化表单\n- 上传文件\n- 包围表单\n- 追加数据\n\n## 执行操作\n\n处理来自 HTML 表单的数据。表单提交方法可以是“GET”或“POST”。**GET**\
  \ 方法将 name=value 对添加到 URL 中，但主要用于请求信息——例如检索数据库记录。**POST** 方法可以提交更多数据，并且更安全，因为数据没有添加到\
  \ URL 中，且主要用于执行操作——例如更新数据库记录。因此，书中的大多数示例首选使用 **POST** 方法。\n\n通过 POST 提交的数据在全局变量\
  \ `$_POST` 中可用。例如，如果表单有 `name=\"email\"` 的输入，可以使用 `$_POST['email']` 访问。HTML `<form>`\
  \ 标签的 `action` 属性指定处理数据的脚本，`method` 属性指定如何发送数据。例如：\n\n```html\n<form action=\"script.php\"\
  \ method=\"POST\">\n    ...\n</form>\n```\n\n通过 GET 提交的数据在全局变量 `$_GET` 中可用。例如，如果表单有\
  \ `name=\"id\"` 的输入，可以使用 `$_GET['id']` 获取。\n\n```php\n$id = $_GET['id'];\n```\n\n\
  ## 检查设置的值\n\n（此处继续...)\n\n\n\nPHP 可以使用内置的 `isset()` 函数轻松确保用户已向提交的 HTML 表单字段中输入了数据。该函数接受变量名作为参数，并仅当该变量值不为\
  \ `NULL` 时返回 `TRUE` —— 因此确保该变量已“设置”了某些值。除非用户输入了值，否则空表单字段将为 `NULL`。\n\n可以使用 `isset()`\
  \ 函数进行条件测试，指示哪些表单字段留空，或者在字段已填写的情况下提供一个响应页面：\n\n![image](img/Image00029.jpg)\n\n\
  isset.php\n\n![image](img/Image00036.jpg)  创建一个包含三个单选按钮的 HTML 文档，提供一个数据提交的字段\n\n\
  ```html\n<form action=” isset_handler.php ” method=” POST ”>\n<fieldset>\n<legend>PHP\
  \ 是什么种语言？</legend>\nScripting<input type=”radio” name=” definition ” value=” Scripting\
  \ ”> <br>\nMarkup<input type=”radio” name=” definition ” value=” Markup ”> <br>\n\
  Programming<input type=”radio” name=” definition ” value=” Programming ”>\n</fieldset><p><input\
  \ type=”submit” ></p>\n</form>\n```\n\n![image](img/Image00037.jpg)  现在，将文档保存到 Web\
  \ 服务器的 `/htdocs` 目录下并为 `isset.php`\n\n![image](img/Image00029.jpg)\n\nisset_handler.php\n\
  \n![image](img/Image00038.jpg)  接下来，创建一个包含 PHP 脚本的 HTML 文档，用提交的值初始化变量 —— 如果没有提交值则初始化为\
  \ `NULL`\n\n```php\n<?php\nif ( isset( $_POST[‘definition’] ) )\n{\n    $definition\
  \ = $_POST[‘definition’] ;\n}\nelse\n{\n    $definition = NULL ;\n}\n# 在此处插入响应语句（第\
  \ 4 步）。\n?>\n```\n\n![image](img/Image00039.jpg)  最后，插入语句根据变量的值输出适当的响应\n\n```php\n\
  if ( $definition != NULL )\n{\n    if ( $definition != ‘Scripting’ )\n    { echo\
  \ “ $definition is Incorrect” ; }\n    else\n    { echo “ $definition is Correct”\
  \ ; }\n}\nelse\n{ echo ‘You must select one answer’ ; }\n?>\n```\n\n![image](img/Image00040.jpg)\
  \  将文档保存到 Web 服务器的 `/htdocs` 目录下并为 `isset_handler.php`，然后通过 HTTP 打开 `isset.php`\
