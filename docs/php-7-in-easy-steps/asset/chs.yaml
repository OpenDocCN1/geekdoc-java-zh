  \n### 探索超级全局\n\nPHP 提供了几个预定义变量，它们在脚本的任何地方都是全局可用的。这些变量被称为“超级全局”，在此简要描述：\n\n*   `$GLOBALS`\
  \ – 一个关联数组，包含根据上下文在脚本全局作用范围内定义的所有变量的引用。变量名是此关联数组的键。例如：\n\n```php\nforeach( $GLOBALS\
  \ as $key => $var) echo “• $key “\n```\n\n![image](img/Image00052.jpg)\n\n*   `$_SERVER`\
  \ – 包含标头、路径和脚本位置等信息的数组，由 Web 服务器任意提供\n*   `$_GET` – 通过 URL 参数传递给脚本的变量关联数组\n*   `$_POST`\
  \ – 传递给脚本的变量关联数组\n*   `$_FILES` – 上传项目的关联数组\n*   `$_COOKIE` – 通过 HTTP 传递的 Cookie\
  \ 关联数组\n*   `$_SESSION` – 每个脚本可用的变量关联数组\n*   `$_REQUEST` – 默认包含 `$_GET`、`$_POST`\
  \ 和 `$_COOKIE` 的关联数组\n*   `$_ENV` – 环境变量的关联数组\n\n`$_FILES` 超级全局在示例此地中使用。\n\n`$_POST`\
  \ 超级全局在示例此地中使用。\n\n`$_COOKIE` 超级全局在示例此地中使用。\n\n`$_SESSION` 超级全局在示例此地中使用。\n\nHTTP\
  \ **GET** 方法在示例此地中使用。\n\n**总结**\n\n\n\n\n\n- 变量是一个命名的容器，用于存储可以更改的数据。\n- 存储在变量中的值可以通过该变量名引用。\n\
  - 变量名必须以 `$` 符号开头，可以包含字母、数字和下划线字符，且 `$` 之后的第一个字符必须是字母或下划线。\n- 变量可以存储整数、浮点数、文本字符串、布尔值、对象或\
  \ `NULL` 值。\n- 变量使用 `=` 赋值运算符进行初始化，为该变量分配一个初始值。\n- 通过仅将字符串和变量名括在双引号中，可以将变量的值作为混合字符串的一部分显示。\n\
  - 字符串可以使用单引号或双引号括起来，内部的引号可以使用反斜杠进行转义。\n- 使用 `.` 拼接运算符可以将字符串值连接成一个单一字符串。\n- 数组变量可以在顺序的数组元素中存储多个数据项，这些元素默认从零开始编号。\n\
  - 可选择为每个数组元素指定键名（key）。\n- 可以使用 `foreach` 循环遍历数组中的每个元素。\n- `implode()` 和 `explode()`\
  \ 函数通过添加或移除指定的分隔符在字符串和数组之间转换。\n- 数组可以根据值或键按字母数字顺序排序。\n- 多维数组简单来说就是元素值本身也是数组的数组。\n\
  - 可以使用 `gettype()` 和 `var_dump()` 函数检查数据类型。\n- 常量是一个命名的容器，用于存储固定的整数、浮点数或文本字符串。\n\
  - 常量名不带 `$` 前缀，且全大大写。\n- 常量使用 `define()` 函数进行初始化。\n- 超全局变量在脚本的任何地方始终全局可用。\n\n##\
  \ 执行操作\n\n本章演示了用于算术、比较和逻辑评估的各种 PHP 运算符。\n\n### 算术\n\nPHP 脚本中常用的算术运算符列如下表所示，以及它们执行的操作：\n\
  \n| 运算符 | 操作 |\n| :--- | :--- |\n| `+` | 加法 |\n| `-` | 减法 |\n| `*` | 乘法 |\n| `/`\
  \ | 除法 |\n| `%` | 取模 |\n| `**` | 幂 |\n\n与运算符一起形成表达式的数字被称为“操作数”——在表达式 `2 + 3` 中，数字\
  \ `2` 和 `3` 就是操作数。\n\n加、减、乘、除运算符的作用正如你所预期的那样。然而，当使用多个一个运算符时，必须注意对表达式进行分组以提高清晰度：\n\
  \n```php\na = b * c - d % e / f ; # 这不清晰。\na = ( b * c ) - ( ( d % e ) / f ) ; #\
  \ 这更清晰。\n```\n\n使用括号分组表达式以指定求值优先级——最内层的组先求值。\n\n`%` 取模运算符将第一个数字除以第二个数字返回操作的余数。这对于判断一个数字是奇数还是偶数很有用。\n\
  \n`**` 幂运算符给出第一个操作数相对于第二个操作数幂的结果。\n\n```php\na ** b # a 升到 b 次幂的结果\n```\n\n通过将算术运算符与\
  \ `=` 赋值运算符结合，可以创建非常有用的简写表达式。例如：\n\n```php\na += b ; # 等于 a = ( a + b ) ;\na -=\
  \ b ; # 等于 a = ( a - b ) ;\na *= b ; # 等于 a = ( a * b ) ;\na /= b ; # 等于 a = ( a\
  \ / b ) ;\n```\n\n示例 `arithmetic.php`：\n\n```php\n<?php\n# 在此处插入语句。\n$a = 5 ;\n\
  $b = 2 ;\n\n$result = $a + $b ; echo \"Addition : $result <br>\";\n$result = $a\
  \ - $b ; echo \"Subtraction : $result <br>\";\n$result = $a * $b ; echo \"Multiplication\
  \ : $result <br>\";\n$result = $a / $b ; echo \"Division : $result <br>\";\n$result\
  \ = $a % $b ; echo \"Modulus : $result <br>\";\n$result = $a ** $b ; echo \"Exponentiation\
  \ : $result <br>\";\n?>\n```\n\n### 比较\n\nPHP 中用于比较两个值的常用运算符如下表所示：\n\n| 运算符 | 比较测试\
  \ |\n| :--- | :--- |\n| `==` | 相等 |\n| `===` | 相同 |\n| `!==` | 不相同 |\n| `!=` | 不等于\
  \ |\n| `<>` | 不等于 |\n| `>` | 大于 |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于\
  \ |\n| `<=>` | 飞船运算符 |\n\n`==` 相等运算符比较两个操作数，如果两者在数值上相等，则返回布尔 `TRUE` 结果，否则返回 `FALSE`。字符和字符串也通过它们的\
  \ ASCII 值进行数值比较。相反，`!=` 不等于运算符在两个操作数不相等时返回 `TRUE`，否则返回 `FALSE`。\n\n`>` “大于”运算符比较两个操作数，如果第一个的值大于第二个，则返回\
  \ `TRUE`；或者如果它的值等于或小于第二个，则返回 `FALSE`。`<` “小于”运算符进行相同的比较，但如果第一个操作数的值小于第二个，则返回 `TRUE`，否则返回\
  \ `FALSE`。在 `>` 或 `<` 运算符后添加 `=` 运算符，可以使其在在两个操作数完全相等时也返回 `TRUE`。\n\n`<=>` 飞船运算符当第一个操作数大于第二个时返回整数值\
  \ `1`，当第一个操作数小于第二个时返回 `-1`，当操作数相等时返回 `0`。\n\n\n\n\n\n![image](img/Image00055.jpg)\
  \ 现在，在 PHP 标签之间插入语句以创建并初始化五个变量\n\n`$zero = 0 ; $nil = 0 ; $one = 1 ; $upr = ‘A’\
  \ ; $lwr = ‘a’ ;`\n\n![image](img/Image00056.jpg) 接下来，插入语句显示相等性比较\n\n`echo “0 ==\
  \ 0 : “ ; var_dump( $zero == $nil ) ;`\n`echo “<br>0 == 1 : “ ; var_dump( $zero\
  \ == $one ) ;`\n`echo “<br>A == a : “ ; var_dump( $upr == $lwr ) ;`\n`echo “<br>A\
  \ != a : “ ; var_dump( $upr == $lwr ) ;`\n\n![image](img/Image00057.jpg) 插入语句显示比较评估结果\n\
  \n`echo “<hr>1 > 0 : “ ; var_dump( $one > $nil ) ;`\n`echo “<br>0 >= 0 : “ ; var_dump(\
  \ $zero >= $nil ) ;`\n`echo “<br>1 <= 0 : “ ; var_dump( $one <= $nil ) ;`\n`echo\
  \ “<hr>1 <=> 0 : “ ; var_dump( $one <=> $nil ) ;`\n`echo “<br>1 <=> 1 : “ ; var_dump(\
  \ $one <=> $one ) ;`\n`echo “<br>0 <=> 1 : “ ; var_dump( $nil <=> $one ) ;`\n\n\
  ![image](img/Image00058.jpg) 将文档保存到网络服务器的 `/htdocs` 目录并命名为 `comparison.php`，然后通过\
  \ HTTP 打开页面以查看显示的结果\n\n![image](img/Image00060.jpg)\n\n![image](img/Image00005.jpg)\n\
  \n大写字母 `A` 的 ASCII 码值为 65，小写字母 `a` 为 97 —— 因此它们在这里比较返回 `FALSE`。\n\n![image](img/Image00005.jpg)\n\
  \n在 PHP 语言中，布尔值 `TRUE` 在数值上表示为 1。\n\n### 检查条件\n\n### 条件运算符\n\n条件运算符 `?:` 也称为“三元”运算符，因为它包含三个组件。该运算符首先评估一个表达式以得到一个\
  \ `TRUE` 或 `FALSE` 布尔值，然后根据评估结果返回两个指定结果之一。条件运算符的语法如下：\n\n`( test-expression ) ?\
  \ result-if-true : result-if-false ;`\n\n条件运算符可以用于评估给定的数字是否为 1 或多个，以确保输出中关于单数和复数项的语法正确。这避免了诸如“There\
  \ is 5”这样尴尬的表达：\n\n`$verb = ( $number == 1 ) ? ‘is’ : ‘are ‘;`\n`echo “There $verb\
  \ $number” ;`\n\n在这种情况下，当变量 `$number` 的值为 1 时，`is` 结果将赋值给变量 `$verb`，否则将赋值 `are`\
  \ 结果。\n\n![image](img/Image00019.jpg)\n\n不要在单条语句中使用超过一个 `?:` 条件运算符，因为结果可能是不可预测的。\n\
  \n条件运算符还可以通过检查数字除以 2 后是否有余数，来评估给定的数字是奇数还是偶数（奇偶性），然后分配相应的字符串结果：\n\n`$parity = ( $number\
  \ % 2 == 0 ) ? ‘Odd’ : ‘Even’ ;`\n`echo “$number is $parity” ;`\n\n在这种情况下，当取模运算返回值为\
  \ 1 时，`Odd` 结果将赋值给变量 `$parity`，否则将赋值 `Even` 结果。\n\n### 空值合并运算符\n\nPHP 有一个特殊的 `NULL`\
  \ 值，它是一个内置常量，表示一个没有任何值的变量 —— 甚至不是 0。未赋值的变量将会被评估为 `NULL`。命名简练的 `??` “空值合并”运算符可以从左到右遍历多个操作数，并返回第一个非\
  \ `NULL` 操作数的值。如果没有任何操作数具有值（且不是 `NULL`），则空值合并运算符本身将返回 `NULL` 结果。\n\n![image](img/Image00003.jpg)\n\
  \n`??` 空值合并运算符是 PHP 7 的新功能。\n\n![image](img/Image00029.jpg)\n\ncondition.php\n\n\
  ![image](img/Image00054.jpg) 创建一个有效的 HTML 文档，如此处 列出的那样，然后在正文部分插入 PHP 标签\n\n```php\n\
