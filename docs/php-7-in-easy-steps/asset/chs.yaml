  \n[content]\nPHP 提供了许多内置函数可以对两个文本字符串进行比较。简单的 `strcmp()` 函数接受两个字符串参数进行比较，并根据结果返回三个整数值之一。当字符串完全匹配时，`strcmp()`\
  \ 将返回 0。当第一个字符串参数大于第二个参数时，`strcmp()` 返回 1，但当第一个字符串参数小于第二个参数时，`strcmp()` 将返回 -1。\n\
  \n![image](img/Image00019.jpg)\n\n严格来说，`strcmp()` 返回的值将是一个正整数、0 或负整数——但通常的值为 1,0\
  \ 或 -1。\n\n`strncmp()` 函数的工作方式与 `strcmp()` 类似，但它接受第三个整数参数，用于指定从字符串开始比较的字符数。\n\n\
