    引用名为“days”的数组变量中的第一个元素存储的值。同样，`$days[1]` 引用存储在第二个元素的值，以此此类推。可以通过创建多个向连续元素赋值的语句来创建变量数组，或者通过使用单个
    PHP `array()` 函数语句来填充元素：


    ```php

