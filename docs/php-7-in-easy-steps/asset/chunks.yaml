  trans: "\n正如前几页所述，通过 PHP 脚本访问 XML 文档中数据的能力，我们可以轻松地整合来自外部源的数据。许多 Web 服务以免费提供的 RSS（富内容摘要/简单聚合）馈的形式提供。在互联网上搜索“rss\
    \ feed directory”可以找到许多对免费馈源进行分类的网站。RSS 馈以 XML 格式提供定期更新的数据。\n\n![image](img/Image00221.jpg)\n\
    \n你可以在 **[rssboard.org](http://www.rssboard.org)** 了解更多关于 RSS 的信息，并将任何 RSS 馈的\
    \ URL 输入到他们的验证器中查看其 XML 元素。\n\nYahoo! 开发者网络 (YDN) 在 **[real.developer.yahoo.com/rss](http://real.developer.yahoo.com/rss)**\
    \ 提供了许多带有有用免费 RSS 馈。\n\n使用它们的唯一要求是你必须在显示这些内容的网页上包含对 Yahoo! 的属性。\n\nYahoo! 提供的免费\
    \ RSS 馈之一提供了定期更新的描述娱乐新闻项目的内容，可以在 **[`news.yahoo.com/rss/entertainment`](http://news.yahoo.com/rss/entertainment)**\
    \ 找到。\n\n这些内容以 XML 文件的形式传递到浏览器，浏览器可以通过在外部元素上添加按钮来显示，你可以点击这些按钮来展开 (+) 或收叠 (-) 嵌套元素。\n\
    \nRSS 是 XML 的一种方言，其中所有文档都必须具有一个包含 `<channel>` 元素的顶层 `<rss>` 元素。数据被封装在内部元素中：\n\n\
    ![image](img/Image00222.jpg)\n\n![image](img/Image00223.jpg)\n\n这里高亮的标签可以用于获取最感兴趣的数据。所示折叠状态的\
    \ item 标签也包含描述每个项目的 title、description、link 和“pubDate”元素。\n\n![image](img/Image00029.jpg)\n\
    \n### rss.php\n\n![image](img/Image00085.jpg) 开始编写一个 PHP 脚本，使用一个语句从 RSS 馈中加载 XML\
    \ 数据或退出\n\n```php\n<?php\n$url = ‘http://rss.news.yahoo.com/rss/entertainment’\
    \ ;\n$xml = simplexml_load_file( $url ) or die( ‘Unable to load data!’ ) ;\n```\n\
    \n![image](img/Image00086.jpg) 接下来，添加一个语句加载页面页头文件\n\n```php\ninclude( ‘includes/rss-header.html’\
    \ ) ;\n```\n\n![image](img/Image00087.jpg) 现在，显示每个新闻项目，然后是页面页脚\n\n```php\nforeach\
    \ ( $xml -> channel -> item as $item ) {\n    echo ‘<a href=”’ . $item -> link\
    \ . ’”>’ . $item -> title . ’</a>’ ;\n    echo ‘<br><small>’ . $item -> pubDate\
    \ . ’</small><br>’ ;\n    echo $item -> description . ‘<hr>’ ; \n}\ninclude( ‘includes/rss-footer.html’\
    \ ) ;\n```\n\n![image](img/Image00088.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `rss.php`，然后通过\
    \ HTTP 打开页面以查看新闻\n\n![image](img/Image00224.jpg)\n\n![image](img/Image00006.jpg)\n\
    \nYahoo! RSS 馈的使用条款要求你必须页面上显示属性说明。\n\n### 设置参数\n\n某些 Web 服务提供静态 URL（例如上一个示例中的\
    \ Yahoo! RSS 馈），它仅交付由内容供应商预先定义的 XML 数据。其他 Web 服务提供更灵活的 API（应用程序接口），允许你在 URL 请求中指定参数，以决定你将接收的数据及其格式。\n\
    \n![image](img/Image00225.jpg)\n\n在 [**openweathermap.org**](http://www.openweathermap.org)\
    \ 发现更多关于 OpenWeatherMap 的信息并注册获取你自己的 ID 密钥。\n\nOpenWeatherMap 有一个免费的当前天气数据 API，可以在\
    \ **[`api.openweathermap.org/data/2.5/weather`](http://api.openweathermap.org/data/2.5/weather)**\
    \ 找到。\n\n当前天气数据 API 允许你以多种形式请求天气数据。该 API 提供的参数包括：\n\n- `q` = 城市（或城市名、国家代码）\n-\
    \ `units` = 公制（摄氏度）、英制（华氏度）或标准（开尔文，默认）温度单位\n- `mode` = xml、html 或 json（默认）格式\n\
    - `appid` = 必需的授权密钥，在 OpenWeatherMap 注册后免费提供\n\n参数和所需的 `=` 值在 `?` 之后附加到 OpenWeatherMap\
    \ URL 后，并用 `&` 分隔。\n\n来自 OpenWeatherMap 的响应可以作为 XML 文件交付，可以使用 PHP 的 `asXml()`\
    \ 函数指定文件名，将其写入 Web 服务器的 `/htdocs` 文件夹。可以在浏览器中检查它以发现所获取的数据性质、XML 元素名称、属性名称和结构：\n\
    \n![image](img/Image00029.jpg)\n\n### params.php\n\n![image](img/Image00085.jpg)\
    \ 开始编写 PHP 脚本，为四个变量分配字符串值，这些变量将用于设置响应参数\n\n```php\n<?php\n$city = ‘New York’ ;\n\
    $units = ‘imperial’ ;\n$mode = ‘xml’ ;\n$id = ‘28df3c64f387cf55026e0de3fb8beaa4’\
    \ ;\n```\n\n![image](img/Image00086.jpg) 接下来，添加一个语句使用参数值构建请求字符串\n\n```php\n$request\
    \ = ‘http://api.openweathermap.org/data/2.5/weather?’ .\n‘q=’ . $city . ’&units=’\
    \ . $units . ’&mode=’ . $mode . ’&APPID=’ . $id ;\n```\n\n![image](img/Image00087.jpg)\
    \ 现在，添加一个语句使用参数加载 XML 数据或退出\n\n```php\n$xml = simplexml_load_file( $request )\
    \ or die( ‘Unable to load data!’ ) ;\n```\n\n![image](img/Image0025) 当收到响应时，尝试将内容作为\
    \ XML 文件写入 Web 服务器的 `/htdocs` 目录\n\n```php\ntry {\n    $xml->asXml( ‘params.xml’\
    \ );\n    // step 5.\n} catch( Exception $e ) {\n    echo ‘Error : ‘ . $e->getMessage()\
    \ ;\n}\n```\n\n![image](img/Image0089.jpg) 语句将浏览器重定向到新创建的 XML 文档\n\n```php\nheader(\
    \ ‘Location: params.xml’ ) ;\n```\n\n![image](img/Image0226.jpg) 响应将包含天气数据。\n\n\
    ![image](img/Image0027.jpg) 这里高亮的数据是感兴趣的。\n\n### 选择组件\n\n在上一页检查来自 OpenWeatherMap\
    \ 的响应后，可以将选组件动态整合到 PHP 应用中：\n\n![image](img/Image0029.jpg)\n\n### weather.php\n\
    \n![image](img/Image0085.jpg) 通过加载页头文件开始编写 PHP 脚本\n\n```php\n<?php\ninclude( ‘includes/weather-header.html’\
    \ ;\n```\n\n![image](img/Image0086.jpg) 接下来，添加一个条件判断查看页面是否通过表单提交\n\n```php\nif(\
    \ $_SERVER['REQUEST_METHOD'] == ‘POST’ ) {\n    // steps 3-6.\n}\n```\n\n![image](img/Image0087.jpg)\
    \ 在条件判断块内，为四个变量分配字符串值\n\n```php\n$city = ( empty( $_POST['city'] ) ) ? ”New York”:\
    \ $_POST['city'] ;\n$units = ‘imperial’ ;\n$mode = ‘xml’ ;\n$id = ‘28df3c64f387cf55026e0de3fb8beaa4’\
    \ ;\n```\n\n![image](img/Image0088.jpg) \n\n![image](img/Image0091.jpg) 最后，插入语句输出获取的数据\n\
    \n```php\n$icon = ‘ http://openweathermap.org/img/w/’ .\n$xml->weather['icon']\
    \ .’.png’ ;\necho ‘<h1>Today in ‘ . $xml->city['name'] .\n’ it\\’s <img src=’\
    \ . $icon . ’></h1>’ ;\necho ‘<<ul>><li>Temperature : ‘ . $xml->temperature['value']\
    \ ;\n```\n"
