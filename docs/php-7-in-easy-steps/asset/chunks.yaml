    and initialize two variables with integer values


    **$x = 5 ; $y = 10 ;**


    ![image](Image00056.jpg)  Next, add a statement to display the assigned values


    **echo “X : $x , Y : $y <br>” ;**


    ![image](Image00057.jpg)  Insert three XOR statements to exchange the variable
