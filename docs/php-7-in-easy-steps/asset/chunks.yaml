  trans: "\nPHP 可以使用内置的 `isset()` 函数轻松确保用户已向提交的 HTML 表单字段中输入了数据。该函数接受变量名作为参数，并仅当该变量值不为\
    \ `NULL` 时返回 `TRUE` —— 因此确保该变量已“设置”了某些值。除非用户输入了值，否则空表单字段将为 `NULL`。\n\n可以使用 `isset()`\
    \ 函数进行条件测试，指示哪些表单字段留空，或者在字段已填写的情况下提供一个响应页面：\n\n![image](img/Image00029.jpg)\n\n\
    isset.php\n\n![image](img/Image00036.jpg)  创建一个包含三个单选按钮的 HTML 文档，提供一个数据提交的字段\n\
    \n```html\n<form action=” isset_handler.php ” method=” POST ”>\n<fieldset>\n<legend>PHP\
    \ 是什么种语言？</legend>\nScripting<input type=”radio” name=” definition ” value=” Scripting\
    \ ”> <br>\nMarkup<input type=”radio” name=” definition ” value=” Markup ”> <br>\n\
    Programming<input type=”radio” name=” definition ” value=” Programming ”>\n</fieldset><p><input\
    \ type=”submit” ></p>\n</form>\n```\n\n![image](img/Image00037.jpg)  现在，将文档保存到\
    \ Web 服务器的 `/htdocs` 目录下并为 `isset.php`\n\n![image](img/Image00029.jpg)\n\nisset_handler.php\n\
    \n![image](img/Image00038.jpg)  接下来，创建一个包含 PHP 脚本的 HTML 文档，用提交的值初始化变量 —— 如果没有提交值则初始化为\
    \ `NULL`\n\n```php\n<?php\nif ( isset( $_POST[‘definition’] ) )\n{\n    $definition\
    \ = $_POST[‘definition’] ;\n}\nelse\n{\n    $definition = NULL ;\n}\n# 在此处插入响应语句（第\
    \ 4 步）。\n?>\n```\n\n![image](img/Image00039.jpg)  最后，插入语句根据变量的值输出适当的响应\n\n```php\n\
    if ( $definition != NULL )\n{\n    if ( $definition != ‘Scripting’ )\n    { echo\
    \ “ $definition is Incorrect” ; }\n    else\n    { echo “ $definition is Correct”\
    \ ; }\n}\nelse\n{ echo ‘You must select one answer’ ; }\n?>\n```\n\n![image](img/Image00040.jpg)\
    \  将文档保存到 Web 服务器的 `/htdocs` 目录下并为 `isset_handler.php`，然后通过 HTTP 打开 `isset.php`\
    \ 并提交表单以查看响应\n\n![image](img/Image00156.jpg)\n\n![image](img/Image00157.jpg)\n\
    \n![image](img/Image00158.jpg)\n\n![image](img/Image00159.jpg)\n\n![image](img/Image00005.jpg)\n\
    \n在技术上，测试条件是否不为 `TRUE` 比测试是否为 `TRUE` 更高效 —— 因为需要评估的可能性更少。\n\n### 验证表单数据\n\n由于用户可能会无意提交空字段或格式错误的表单，因此您的\
    \ PHP 脚本确保必需字段已填写且提交的数据有效至关重要。\n\n为了确保用户在文本字段中输入了内容，PHP 提供了 `empty()` 函数，它接受变长参数，如果其值为空字符串、零、`NULL`\
    \ 或 `FALSE`，则返回 `TRUE`。\n\n为了确保用户以数字格式输入数据，PHP 提供了 `is_numeric()` 函数，它接受变长参数，并仅当其值为数字时才返回\
    \ `TRUE`。\n\n可以使用 PHP 的 `preg_match()` 函数执行更特定的数据验证，该函数接受一个“正则表达式”参数和一个用于查找模式的变长参数。通常，这用于确保电子邮件地址符合预期格式：\n\
    \n![image](img/Image00029.jpg)\n\nvalid.php\n\n![image](img/Image00036.jpg)  创建一个包含两个文本字段的\
    \ HTML 文档，用于数据提交\n\n```html\n<form action=” valid_handler.php ” method=” POST\
    \ ”>\n<fieldset>\n<legend>输入数量和邮箱地址</legend>\n<p>Quantity : <input type=”text”\
    \ name=” quantity ”></p>\n<p>Email Address : <input type=”text” name=” email ”></p>\n\
    </fieldset><p><input type=”submit” ></p>\n</form>\n```\n\n![image](img/Image00037.jpg)\
    \  现在，将文档保存到 Web 服务器的 `/htdocs` 目录下并为 `valid.php`\n\n![image](img/Image00029.jpg)\n\
    \nvalid_handler.php\n\n![image](img/Image00038.jpg)  接下来，创建一个包含 PHP 脚本的 HTML 文档，用提交的值初始化变量\
    \ —— 如果没有提交值则初始化为 `NULL`\n\n```php\n<?php\nif ( !empty ( $_POST[‘quantity’] )\
    \ )\n{\n    $quantity = $_POST[‘quantity’] ;\n    # 在此处插入格式验证（第 4 步）。\n}\nelse\n\
    { \n    $quantity = NULL ; \n    echo ‘You must enter a quantity<br>’ \n}\n```（等待，让我重新对齐代码块）\n\
    # 在此处插入格式验证（第 4 步）。\n\n```php\nif ( !empty ( $_POST[‘quantity’] ) )\n{\n    $quantity\
    \ = $_POST[‘quantity’] ;\n    # 在此处插入格式验证（第 4 步）。\n}\nelse\n{ \n    $quantity\
    \ = NULL ; \n    echo ‘You must enter a quantity<br>’ \n}\n```\n\n（注：此处原文中包含大量重复的草稿说明，译文已根据要求提取核心逻辑进行翻译）\n\
    \n在技术上，测试条件是否不为 `TRUE` 比测试是否为 `TRUE` 更高效 —— 因为需要评估的可能性更少。\n\n### 验证表单数据\n\n由于用户可能会无意提交空字段或格式错误的表单，因此您的\
    \ PHP 脚本确保必需字段已填写且提交的数据有效至关重要。\n\n为了确保用户在文本字段中输入了内容，PHP 提供了 `empty()` 函数，它接受变长参数，如果其值为空字符串、零、`NULL`\
    \ 或 `FALSE`，则返回 `TRUE`。\n\n为了确保用户以数字格式输入数据，PHP 提供了 `is_numeric()` 函数，它接受变长参数，并仅当其值为数字时才返回\
    \ `TRUE`。\n\n可以使用 PHP 的 `preg_match()` 函数执行更特定的数据验证，该函数接受一个“正则表达式”参数和一个用于查找模式的变长参数。通常，这用于确保电子邮件地址符合预期格式：\n\
    \n![image](img/Image00029.jpg)\n\nvalid.php\n\n![image](img/Image00036.jpg)  创建一个包含两个文本字段的\
    \ HTML 文档，用于数据提交\n\n```html\n<form action=” valid_handler.php ” method=” POST\
    \ ”>\n<fieldset>\n<legend>输入数量和邮箱地址</legend>\n<p>Quantity : <input type=”text”\
    \ name=” quantity ”></p>\n<p>Email Address : <input type=”text” name=” email ”></p>\n\
    </fieldset><p><input type=”submit” ></p>\n</form>\n```\n\n![image](img/Image00037.jpg)\
    \  现在，将文档保存到 Web 服务器的 `/htdocs` 目录下并为 `valid.php`\n\n![image](img/Image00029.jpg)\n\
    \nvalid_handler.php\n\n![image](img/Image00038.jpg)  接下来，创建一个包含 PHP 脚本的 HTML 文档，用提交的值初始化变量\
    \ —— 如果没有提交值则初始化为 `NULL`\n\n```php\n<?php\nif ( !empty ( $_POST[‘quantity’] )\
    \ )\n{\n    $quantity = $_POST[‘quantity’] ;\n    # 在此处插入格式验证（第 4 步）。\n}\nelse\n\
    { \n    $quantity = NULL ; \n    echo ‘You must enter a quantity<br>’ \n}\n\n\
    ### 过滤数据\n\n为了方便验证用户输入，PHP 提供了 `filter_var()` 函数，可以同时用于验证和“过滤”输入。该函数需要两个参数：指定要过滤的变量以及使用的过滤器常量名：\n\
    \n| **过滤器常量:** | **约定:** |\n| :--- | :--- |\n| `FILTER_VALIDATE_BOOLEAN` | 布尔值\
    \ |\n| `FILTER_VALIDATE_EMAIL` | 邮箱地址格式 |\n| `FILTER_VALIDATE_FLOAT` | 浮点数 |\n\
    | `FILTER_VALIDATE_INT` | 整数 |\n| `FILTER_VALIDATE_IP` | IP 地址格式 |\n| `FILTER_VALIDATE_MAC`\
    \ | MAC 地址格式 |\n| `FILTER_VALIDATE_REGEXP` | 正则表达式格式 |\n| `FILTER_VALIDATE_URL`\
    \ | URL 格式 |\n| `FILTER_SANITIZE_EMAIL` | 移除无效字符 |\n| `FILTER_SANITIZE_ENCODED`\
    \ | URL 编码字符串 |\n| `FILTER_SANITIZE_MAGIC_QUOTES` | 反斜符转义字符 |\n| `FILTER_SANITIZE_NUMBER_FLOAT`\
    \ | 移除所有非数字 |\n| `FILTER_SANITIZE_NUMBER_INT` | 移除所有非数字 |\n| `FILTER_SANITIZE_SPECIAL_CHARS`\
    \ | HTML 转义字符 |\n| `FILTER_SANITIZE_STRING` | 移除 HTML 标签 |\n| `FILTER_SANITIZE_URL`\
    \ | 移除无效字符 |\n| `FILTER_CALLBACK` | 调用自定义过滤器函数 |\n\n过滤器在验证成功时返回 `TRUE`，否则将返回 `FALSE`。某些过滤器允许指定进一步的选项。例如，可以为\
    \ `FILTER_VALIDATE_INT` 指定数字范围。\n\n"
- fmt: "\n![image](Image00038.jpg) Now, add a function to validate a parameter as\
    \ being a correctly formatted email address\n\n```php\nfunction validate( $email\
    \ )\n{\n  if ( filter_var( $email , FILTER_VALIDATE_EMAIL ) )\n  { echo( “<hr>\
    \ $email IS a valid email address” ) ; }\n  else\n  { echo( “<hr> $email IS NOT\
    \ a valid email address” ); }\n}\n```\n\n![image](Image00039.jpg) Create an email\
    \ address containing an illegal space and attempt validation, then sanitize the\
    \ email address and attempt validation once more\n\n```php\n<?php\n$email = ‘mike\
    \ @example.com’ ;\nvalidate( $email ) ;\n$email = filter_var( $email , FILTER_SANITIZE_EMAIL\
    \ ) ;\nvalidate( $email ) ;\n?>\n```\n\n![image](Image00040.jpg) Save the document\
    \ in your web server’s `/htdocs` directory as `filter.php` then open it via HTTP\
    \ to see filtration\n\n![image](Image00163.jpg)\n\n![image](Image00019.jpg)\n\n\
    Submitted user input can break your webpage so should always be validated.\n\n\
    ### Sending hidden data\n\nIn addition to data entered by the user into HTML form\
    \ input fields, data generated by PHP can be submitted using HTML hidden form\
    \ fields. Like regular input fields these also send a name=value pair to the form\
    \ handler script, but here the value is supplied by PHP, not by the user.\n\n\
    Typically, data submitted using hidden form fields might include the login name\
    \ of the user and a timestamp of the submission:\n\n![image](Image00029.jpg)\n\
    \nhidden.php\n\n![image](Image00036.jpg) Create an HTML document containing a\
    \ PHP script to define the timezone and initialize two variables\n\n```php\n<?php\n\
    date_default_timezone_set( ‘UTC’ ) ;\n$time = date( ‘ H:i , F j ‘ ) ;\n$user =\
    \ ‘Mike’ ;\n```\n\n![image](Image00037.jpg) Now, add a statement to write a complete\
    \ form containing a regular input field and two hidden fields, whose values are\
    \ set by the variables\n\n```php\necho ‘\n<form action=” hidden_handler.php ”\
