- fmt: "\n- PHP code is enclosed in special start and end processing tags that allow\
    \ you to jump into and out of “PHP mode”, to implement instructions within an\
    \ HTML document.\n- PHP code is executed on the server (“server-side”), unlike\
    \ JavaScript code that is executed in the browser (“client-side”). The client\
    \ receives the results of running the script without knowing what the underlying\
    \ code was. Recently, server-side has become to be known as “The Cloud”.![Image0003.jpg]\n\
