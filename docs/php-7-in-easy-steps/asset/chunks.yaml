    \ text file character-by-character upon success and display its entire contents\n\
    \n```php\nwhile( $char = fgetc( $filestream ) )\n{ echo $char ; }\n```\n\n![image](Image00012.jpg)\
    \ Now, remember to close the file stream\n\n```php\nfclose( $filestream ) ;\n\
    ```\n\n![image](Image00014.jpg) Save the document in your web server’s `/htdocs`\
