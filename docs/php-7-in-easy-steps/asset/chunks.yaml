    ![image](Image00061.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **bitwise.php**  then open the page via HTTP to see the XOR bitwise magic


    ![image](Image00065.jpg)


    ![image](Image00019.jpg)


    Do not confuse bitwise operators with logical operators. Bitwise operators compare
    binary numbers, whereas logical operators evaluate Boolean values.


    **Changing values**


    The PHP ++ increment operator and -- decrement operator alter the given number
    by one and return the resulting new value. These are most often used to count
    iterations in a loop. The increment operator increases the value by one and the
    decrement operator decreases the value by one. Each of these operators may appear
    either before or after the variable containing the number to be changed – to different
    effect! When either of these operators are placed before the variable (“prefixed”),
    they change the value by one then return the modified value, but when they are
    placed after the variable (“postfixed”) they return the current value, then change
    the value by one:


    ![image](Image00029.jpg)


    change.php


    ![image](Image00054.jpg)  Create a valid HTML document, like the one listed [here](#text00003.html_sec5)
    , then insert PHP tags into the body section


    **<?php**


    **# Statements to be inserted here.**


    **?>**


    ![image](Image00055.jpg)  Now, insert between the PHP tags statements to create
    and initialize four variables with the same integer value


    **$a = $b = $c = $d = 5 ;**


    ![image](Image00056.jpg)  Next, add statements to change each of the values by
    one and display the new integers


    **echo “++A : “ . ++ $a . “<br>--B : “ . -- $b . ”<hr>“ ;**


    **echo “C++ : “ . $c ++ . “[now C : “ . $c . ”]<br>“ ;**


    **echo “D-- : “ . $d -- . “[now D : “ . $d . ”]<br>“ ;**


    ![image](Image00057.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **change.php**  then open the page via HTTP to see the results


