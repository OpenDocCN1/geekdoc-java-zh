    **Storing values**


    *This chapter demonstrates the various PHP containers in which data can be stored.*


    [**Creating variables**](#text00004.html_sec8)


    [**Quoting strings**](#text00004.html_sec9)


    [**Producing arrays**](#text00004.html_sec10)


    [**Sorting arrays**](#text00004.html_sec11)


