- fmt: '

    Documents can only be interpreted by the PHP engine if served up by the web server
    using the HTTP protocol. You cannot simply open a PHP file in your browser directly.
    Always use the location `http://localhost/` to serve the examples in this book.


    The Abyss Web Server should now be running on your system, correctly configured
    to recognize that documents having the `.php` file extension should be interpreted
    by the PHP engine. Configuration can now be tested by creating a simple PHP script
    for service to your web browser by Abyss:


    ![image](Image00029.jpg)


    `phpinfo.php`


    ![image](Image00008.jpg) Open a plain text editor and exactly type the script
    below


    ```

    <?php phpinfo() ; ?>

    ```


    ![image](Image00010.jpg) Save the script as `phpinfo.php` in the Abyss document
    path directory, typically at `C:\Abyss Web Server\htdocs`


    ![image](Image00012.jpg) Exactly enter the location `http://localhost/phpinfo.php`
    into your web browser’s address field to see Abyss serve up a web page containing
    your PHP version information


    ![image](Image00030.jpg)


    ![image](Image00019.jpg)


    PHP scripts are case-sensitive so you must copy the listed script using lowercase
    characters only.


    ### Embedding PHP script code


    PHP script may be embedded within HTML documents – meaning PHP and HTML code can
    both happily co-exist in the same file. All embedded PHP code must be contained
    within `<?php` and `?>` tags so it can be readily recognized by the PHP engine
    for interpretation. Typically the PHP code will write content into the body section
    of the HTML document, which is then sent to the web browser:


    ![image](Image00029.jpg)


    `hello.php`


    ![image](Image00008.jpg) Launch a plain text editor and create this valid barebones
    HTML5 document with an empty body section


    ```html

    <!DOCTYPE HTML>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <title> Getting Started In PHP</title>

    </head>

    <body>


    </body>

    </html>

    ```


    ![image](Image00010.jpg) Insert tags into the body section to contain PHP code


    ```php

    <?php


    ?>

    ```


    ![image](Image00012.jpg) Now, insert between the PHP tags a descriptive comment
    and a line of code to write content into the body section


    ```php

    # Write the traditional greeting.

    echo ''<h1>Hello World!</h1>'' ;

    ```


    ![image](Image00031.jpg)


    ![image](Image00005.jpg)


    Notice that the descriptive comment is enclosed between the PHP tags for information
    purposes only.


    ![image](Image00014.jpg) Set the document encoding to UTF-8 format then save it
    as `hello.php` in the Abyss server’s `/htdocs` folder


    ![image](Image00032.jpg)


    ![image](Image00015.jpg) Next, enter the location `http://localhost/hello.php`
    into your web browser’s address field to see Abyss serve up a web page containing
    content written by embedded PHP code


    ![image](Image00033.jpg)


    ![image](Image00017.jpg) Now, use your web browser’s **View Source** facility
    to see that PHP has written the content into the body section, including the HTML
    `<h1></h1>` heading tags


    ![image](Image00034.jpg)


    PHP script can be embedded in earlier versions of HTML in just the same way. Other
    examples in this book demonstrate embedded PHP script but do not repeatedly list
    the HTML code.


    ![image](Image00019.jpg)


    Windows’ Notepad automatically adds a hidden “Byte Order Mark” (BOM) signature
    to the file, while other editors (such as Code Writer shown here) allow this to
    be omitted. Code Writer is a free text and code editor available from the Windows
    Store.


    ![image](Image00006.jpg)


    Note that the PHP `echo` instruction literally writes the entire content contained
    within the pair of `'' ''` single quote marks.


    ### Scripting by the rules


    #### Tag rules


    When the PHP engine receives input from the web server it reads the input, from
    top to bottom, in a process called “parsing”. During the parsing process, the
    PHP engine (a.k.a. parser) looks for the opening and closing `<?php` and `?>`
    tags and understands that the content between those tags is script code that it
    must interpret. Everything outside the `<?php` and `?>` tags is completely ignored,
    which allows PHP files to have mixed content and allows PHP code to be embedded
    within HTML like this:


    ```html

    <p> Ignored by PHP and displayed by the browser</p>

    <?php echo ''Script code that will be parsed'' ; ?>

    <p> Also ignored by PHP and displayed by the browser</p>

    ```


    In order for this to work properly it is therefore important that all your PHP
    script code must be enclosed between opening and closing `<?php` and `?>` tags,
    when embedded in an HTML file.


    ![image](Image00005.jpg)


    Typically your embedded PHP code will always have opening and closing `<?php`
    and `?>` tags around script.


    The only exception to this rule is when PHP script is written in a pure PHP file,
    which contains only code. In this case it is preferable to omit the closing `?>`
    tag like this:


    ```php

    <?php echo ''Print this First'' ;

    echo ''Print this Last'' ;

    ```


    Where your PHP script code intends only to insert a single string of text into
    an HTML document, you may optionally use the PHP short echo `<?=` and `?>` tags:


    `<?= ''Hello!'' ; ?>` is equivalent to `<?php echo ''Hello!'' ; ?>`


    Advanced PHP script code can also insert text only when a tested condition is
    met, like this:


    ```php

    <?php if ( $expression == true ) : ?>

    Insert this text only if the expression is true.

    <?php else : ?>

    Otherwise insert this text.

    <?php endif ; ?>

    ```


    ![image](Image00006.jpg)


    Conditional testing is fully explained and demonstrated later in this book, in
    [Chapter 3](#text00005.html).


    #### Statement rules


    Each statement within the PHP language must be terminated by a `;` semicolon character
    – just as each sentence in the English language must be terminated by a `.` period
    character. The semicolon is recognized by the parser as marking the end of an
    individual instruction that it must interpret. So a PHP code containing two statements
    could look like:


    ```php

    <?php echo ''First statement'' ; echo ''Second statement'' ; ?>

    ```


    The closing `?>` tag of a block of PHP code automatically implies a semicolon,
    however, so you can optionally omit the semicolon terminating the last statement
    of a PHP block, like this:


    ```php

    <?php echo ''First statement'' ; echo ''Second statement'' ?>

    ```


    ![image](Image00005.jpg)


    It does no harm to terminate the last statement of a PHP block if you wish to
    do so.


    #### Comment rules


    It is often worthwhile adding comments to your PHP script code so it can be easily
    understood by others, or by yourself when revisiting your code. All whitespace
    and comments are completely ignored by the PHP parser so you can add as many comments
    as you like, without any adverse effect on performance.


    Single-line comments may begin with a `#` hash character, or alternatively they
    may begin with a `//` double-slash sequence.


    Multi-line (block) comments must be enclosed within `/*` and `*/` character sequences,
    as used in the C programming language:


    ```php

    <?php

    echo ''First statement'' // A single-line comment.

    /* This is a multi-line comment

    containing two lines of comment. */

    echo ''Second statement'' ;

    echo ''Final statement'' ; # Another single-line comment.

    ?>

    ```


    ![image](Image00005.jpg)


    The `//` single-line comment style is also used in C++ programming and the `#`
    single-line comment style is also used in Unix/Linux BASH shell scripting.


    ### Summary


    - PHP is a scripting language that is especially suited for web development as
    it can be embedded in HTML

    - PHP code is executed server-side on The Cloud, unlike JavaScript code that is
    executed client-side in the browser

    - Where a web page contains PHP script, the web server will first call upon the
    PHP engine to process the code before sending the response to the web browser

    - A local development environment can be created by installing a web server and
    the PHP engine on your own computer

