    ```


    或者...


    ```php

    $days = array( ‘Monday’ , ‘Tuesday’ , ‘Wednesday’ ) ;

    ```


    这两者都会创建一个数组，其中每个元素中存储的值可以使用其索引号进行引用，例如 `$days[0]` 。


    ![image](img/Image00045.jpg)


