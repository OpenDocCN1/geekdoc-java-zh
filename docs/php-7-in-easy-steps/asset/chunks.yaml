    \ ‘manifesto.txt’ , ‘r’ )\nor die( ‘Unable to open file!’ ) ;\n```\n\n![image](Image00010.jpg)\
    \ Next, add a loop to read the text file line-by-line upon success and display\
    \ its entire contents\n\n```php\nwhile( !feof( $filestream ) )\n{ echo fgets(\
    \ $filestream ). ’<br>’ ; }\n```\n\n![image](Image00012.jpg) Now, remember to\
    \ close the file stream\n\n```php\nfclose( $filestream ) ;\n```\n\n![image](Image00014.jpg)\
    \ Save the document in your web server’s `/htdocs` directory as `readlines.php`,\
    \ alongside the plain text file to be read, then open the page via HTTP to see\
    \ the text file.\n\n![image](Image0011.jpg)\n\n## Reading characters\n\nOnce a\
    \ “filestream” object is created, its contents can be read one line at a time\
    \ by specifying the filestream as an argument to the PHP `fgets()` function. To\
    \ read every line this function can be called repeatedly in a loop. The `feof()`\
    \ function can determine when the end of the file is reached and can end the loop:\n\
    \nOnce a “filestream” object is created, its contents can be read one character\
    \ at a time by specifying the filestream as an argument to the PHP `fgetc()` function.\
    \ To read every line this function can be called repeatedly in a loop. The `fgetc()`\
    \ function returns false when there are no more characters to get from the.\n\n\
    readchars.php\n\n![image](Image00008.jpg) Begin a PHP script with statements that\
    \ attempt to open a plain text file for reading, or exit the script upon failure\n\
    \n```php\n<?php\n$filestream = fopen( ‘title.txt’ , ‘r’ )\nor die( ‘Unable to\
