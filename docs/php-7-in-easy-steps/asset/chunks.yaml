    e **lse { fail( ‘Last Name’ ) ; }**


    i **f ( !empty( trim( $_POST[ ‘subject’ ] ) ) )**


    **{ $subject = addslashes( $_POST[ ‘subject’ ] ) ; }**


    e **lse { fail( ‘Subject’ ) ; }**


    i **f ( !empty( trim( $_POST[ ‘message’ ] ) ) )**


    **{ $message = addslashes( $_POST[ ‘message’ ] ) ; }**


    e **lse { fail( ‘Message’ ) ; }**


    ![image](Image00082.jpg)  When validation succeeds, open the database connection


    **require ( ‘../connect_db.php’ ) ;**


    ![image](Image00203.jpg)  Now, insert statements to add the submitted HTML form
    field values into the MySQL “forum” database table


    **$sql = “INSERT INTO forum**


    **( first_name, last_name, subject, message, post_date )**


    **VALUES**


    **(‘ $first_name ’, ‘ $last_name ’,’ $subject ’, ‘ $message ’, NOW() )” ;**


    **$result = mysqli_query ( $dbc , $sql ) ;**


    ![image](Image00204.jpg)  Finally, insert a statement to report a failure error
    or relocate the browser to the forum page on success


    **if ( mysqli_affected_rows( $dbc ) != 1 )**


    **{**


    **echo ‘<p>Error</p>’ .mysqli_error( $dbc ) ;**


    **mysqli_close( $dbc ) ;**


    **}**


    **else**


    {


    **mysqli_close( $dbc ) ;**


    **header( ‘Location: forum.php ’ ) ;**


    **}**


    ![image](Image00205.jpg)  Save this script in your web server’s  **/htdocs**  directory
    as  **process.php**  , then submit the form without entries in all fields to see
    the script display error messages


    ![image](Image00019.jpg)


    Notice that the PHP **addslashes()** function is used here to escape apostrophes
    and quotes.


    ![image](Image00005.jpg)


    **NOW()** is a MySQL function, which returns a datetime value that is the current
    timestamp.


    ![image](Image00005.jpg)


    This script supplies its own error messages if it finds empty form fields, or
    a MySQL error message if the data cannot be added to the database table.


    **Confirming success**


    It’s now time to test the message board process to ensure that validation performs
    correctly, and posted messages appear on the Forum page:


    ![image](Image00067.jpg)  Open the Post Message page, then complete all fields
    and submit the form to see the message appear on the forum


    ![image](Image00210.jpg)


    ![image](Image00211.jpg)


    ![image](Image00006.jpg)


    The “Posted By” details are retrieved from the first_name, last_name, and post_date
    columns of the MySQL “forum” database table.


    ![image](Image00068.jpg)  Next, return to the Post Message page then attempt to
    post a message with no Subject entry to see an error


    ![image](Image00212.jpg)


    ![image](Image00069.jpg)  Return to the Post Message page and post more messages
    as different users to see them get added to the forum


    ![image](Image00213.jpg)


    ![image](Image00005.jpg)


    You can stop the MySQL Server service and post a message to see the MySQL error
    report.


    ![image](Image00005.jpg)


    New forum messages are added to the bottom of the table here but the order could
    be reversed by adding a **SORT** clause to the SQL query.


    **Summary**


    • A PHP script can connect to a MySQL database using the **mysqli_connect()**
    function to specify the host server, username, user password, and database name
    as its arguments


    • The **mysqli_connect()** function returns a database connection object, which
    can be supplied as the argument to other functions, such as the **mysqli_set_charset()**
    function


    • The **die()** function is equivalent to calling the **exit()** function to terminate
    the script


    • The **mysqli_connect_error()** function returns an error message if a connection
    attempt fails, and can be specified as the argument to the **die()** function,
    to be called as the script halts


    • It is recommended to place a connection script outside the regular **/htdocs**
    directory for security and incorporate it into other scripts, when needed, using
    a **require** statement


    • The **mysqli_ping()** function can verify connection to a specified database,
    then information can be retrieved using **mysqli_get_server_info()** and **mysqli_get_host_info()**


    • The **mysqli_query()** function attempts to execute a SQL query on a specified
    database object and the **mysqli_error()** function can be used to describe the
    cause of a failed attempt


    • Database connections should always be closed when they are no longer required
    by calling the **mysqli_close()** function


    • When a database query succeeds, the **mysqli_num_rows()** function can reveal
    the total number of rows retrieved


    • The **mysqli_fetch_array()** function can create an associative array of rows
    and data from a successful query result


    • The PHP **empty()** function can be used to test a posted HTML form field to
    discover if it is empty


    • A row of data can be added to a MySQL database table, using the **mysqli_query()**
    function, then a confirmation test can be made using the **mysqli_affected_rows()**
    function


    • The browser can be relocated to a new page using the **header()** function to
    specify a **‘Location:URL’** argument


    12


    **Adding Web Services**


    *This chapter demonstrates how to incorporate XML data into PHP scripts.*


    [**Loading data**](#text00014.html_sec89)


    [**Getting nodes**](#text00014.html_sec90)


    [**Getting attributes**](#text00014.html_sec91)


    [**Including feeds**](#text00014.html_sec92)


    [**Setting parameters**](#text00014.html_sec93)


    [**Selecting components**](#text00014.html_sec94)


    [**Summary**](#text00014.html_sec95)


    **Loading data**


    There are many “Web Services” available online, which provide free data that can
    usefully be incorporated in your own web pages. Typical examples might supply
    live stock prices, the latest news stories, or current weather conditions.


    Most Web Services offer to supply data in the XML (eXtensible Markup Language)
    file format. This is designed to be both human-readable and machine-readable and
    is not reliant upon any single platform. For example, a Java program can send
    XML data over the internet to a .NET application, and vice versa.


    XML looks very much like HTML, but with XML you make up your own element names.
    The element tags surround content and may include attributes, as with HTML. It
    is important that each element has both opening and closing tags, and that elements
    are correctly nested for the XML document to be “well-formed”.


    ![image](Image00019.jpg)


    All XML documents must begin with an XML file type declaration – like the one
    shown here on line one.


    ![image](Image00214.jpg)


    ![image](Image00215.jpg)


    catalog.xml


    ![image](Image00005.jpg)


    The **catalog.xml** file shown here will be used in the next few examples to demonstrate
    how to load XML data and how to access element values or attribute values.'
