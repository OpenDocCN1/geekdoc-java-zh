    You can discover more `date()` function options in the PHP manual online at `[php.net/manual](http://www.php.net/manual)`.


    By default, the timezone is set to the Universal Time Clock (UTC) but you can
    set it to your own timezone by specifying it as an argument to the `date_default_timezone_set()`
    function, and see the currently set timezone with `date_default_timezone_get()`.


    You may also create your own timestamp using the intelligent `strtotime()` function.
    This can accept a date string argument and return a timestamp that can be supplied
    as an optional second argument to the `date()` function. The argument specified
    to `strtotime()` can be a regular text date, such as “July 4, 2017”. Additionally,
    you can specify an argument such as “yesterday”, “+3months” or “next Wednesday”
    and the `strtotime()` function will try to figure it out and return an appropriate
    timestamp.


    ![image](Image00029.jpg)


    date.php


    ![image](Image00098.jpg) Begin a PHP script with statements to display the current
    date, day, time and current default timezone


    ```php

    <?php

    echo ‘Date : ‘ .date( ‘jS F Y’ ). ’<br>’ ;

    echo ‘Day : ‘ .date( ‘l’ ). ’<br>’ ;

    echo ‘Time : ‘ .date( ‘h:i:s a’ ). ’<br>’ ;

    echo ‘Timezone : ‘ .date_default_timezone_get(). ’<hr>’ ;

    ```


    ![image](Image00099.jpg) Next, add statements to change the default timezone and
    display a confirmation, then show the current time there


    ```php

    date_default_timezone_set( ‘America/New_York’ ) ;

    echo ‘Timezone now : ‘ .date_default_timezone_get() ;

    echo ‘<br>Time now : ‘ .date( ‘h:i:s a’ ). ’<hr>’ ;

    ```


    ![image](Image00100.jpg) Now, add statements to create a timestamp for the next
    day, then display its day name and date


    ```php

    $d = strtotime( ‘tomorrow’ ) ;

    echo ‘Tomorrow : ‘ .date( ‘l, jS F Y’ , $d ). ’<br>’ ;

    ```


    ![image](Image00101.jpg) Finally, add statements to create a timestamp for a memorable
    date, then display its month and day number


    ```php

    $d = strtotime( ‘July 11, 1994’ ) ;

    echo ‘David’s Birthday : ‘ .date( ‘F jS’ , $d ) ;

    ?>

    ```


    ![image](Image00102.jpg) Save the document in your web server’s `/htdocs` directory
    as `date.php` then open the page via HTTP to see the date strings formatted by
    the options.


    ![image](Image00108.jpg)


    ![image](Image00005.jpg)


    Notice that you can include separator characters such as `:` and `/` in the format
    string.


    ![image](Image00006.jpg)


    Some countries prefer date order of M/D/ Y while others prefer D/M/ Y so you can
    choose your preferred date format options.


    ### Encoding entities


    There are two PHP functions available to encode HTML code, so that all characters
    of special significance or unusual characters are replaced by “entity” equivalents.
    The `htmlentities()` function encodes all characters below, which each have an
    entity equivalent:


    ![image](Image00109.jpg)


    ![image](Image00005.jpg)


    Call the PHP function `get_html_translation_table()` with the constant argument
    of `HTML_ENTITIES` or `HTML_SPECIALCHARS` to return an array of all represented
    characters.


    Unless you are concerned about non-English language characters, it is generally
    preferable to use the alternative `htmlspecialchars()` function to encode only
    characters of special HTML significance:


    * `&` ampersand – becomes `&amp;`

    * `“` double quote – becomes `&quot;`

    * `‘` single quote – becomes `&#039;`

    * `<` less than – becomes `&lt;`

    * `>` greater than – becomes `&gt;`


    One good reason to encode HTML snippets with PHP is to prevent malicious JavaScript
    code being executed unintentionally by the web browser. Encoding HTML tags into
    entities ensures that the `<script>` tag will not be recognized, so its JavaScript
    code contents will not be executed:


    ![image](Image00029.jpg)


    date.php


    ![image](Image00098.jpg)


    ```php

    <?php

    $html = “<script>alert(''XSS'');</script>”;

    echo htmlentities($html);

    ?>

    ```


    ### Summary


    * The `date()` function requires a string argument that specifies options to determine
    the format of its returned date string.

    * By default the PHP date timezone is set to UTC.

    * The `date_default_timezone_set()` function can be used to specify an alternative
    to the UTC default timezone.

    * The `strtotime()` function will attempt to return an appropriate timestamp for
    whatever date or time argument it receives.

    * The `htmlentities()` function will encode all string characters for which there
    is an entity.

    * The `htmlspecialchars()` function will encode only characters of special HTML
    significance to avoid recognition by a browser.

