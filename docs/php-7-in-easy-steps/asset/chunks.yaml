    \ matches a specified pattern for validation\n- Each session has a unique session\
    \ ID number, which can be seen using the PHP `session_id()` function\n- Session\
    \ variables can be removed using the `unset()` function and a session can be terminated\
    \ using the `session_destroy()` function\n- Stored content can be viewed using\
    \ the `var_dump()` function and by looping through the `$_COOKIE` or `$_SESSION`\
    \ arrays\n\n11\n\n## Connecting databases\n\n*This chapter demonstrates how to\
    \ establish a simple user forum with PHP and a MySQL database.*\n\n- [Making a\
    \ connection](#text00013.html_sec82)\n- [Creating a forum](#text00013.html_sec83)\n\
    - [Providing the page](#text00013.html_sec84)\n- [Supplying a form](#text00013.html_sec85)\n\
    - [Processing messages](#text00013.html_sec86)\n- [Confirming success](#text00013.html_sec87)\n\
    - [Summary](#text00013.html_sec88)\n\n### Making a connection\n\nConnection to\
    \ a MySQL database can be attempted from a standard PHP script. The script defines\
    \ a variable named `dbc` (database connection) that gets assigned the value returned\
    \ by calling a built-in `mysqli_connect()` function. This call requires four arguments\
    \ to specify the host server, the MySQL username and password, and the database\
    \ to connect. When the call succeeds, the `mysqli_connect()` function returns\
    \ an “object” that represents the connection to the MySQL Server. The script looks\
    \ like this:\n\n```php\n<?php\n$dbc = mysqli_connect('host', 'user', 'password',\
    \ 'database')\nOR die (mysqli_connect_error());\nmysqli_set_charset($dbc, 'utf-8');\n\
    ```\n\n![image](Image00029.jpg)\n\nconnect_db.php\n\n![image](Image00199.jpg)\n\
    \nThe MySQL Community Edition is available free at [mysql.com/downloads/mysql](http://www.mysql.com/downloads/mysql)\n\
    \nThe object returned by a successful call to `mysqli_connect()` is very important\
    \ as it is used as an argument in other PHP function calls that communicate with\
    \ the MySQL Server. For example, in the above script it must be used as the first\
    \ argument in the call to the `mysqli_set_charset()` function to identify the\
    \ connection.\n\n![image](Image00005.jpg)\n\nThis chapter assumes the MySQL database\
    \ server is installed and configured for a user on the localhost server, with\
    \ full privileges to use a database named “website_db”. Further instruction and\
    \ examples can be found in our companion book in this series [PHP & MySQL in easy\
    \ steps](http://ineasysteps.com/products-page/all_books/php-mysql-in-easy-steps/).\n\
    \nWhen the call to `mysqli_connect()` function fails, the script branches to an\
    \ alternative that calls the `die()` function. This is equivalent to calling `exit()`\
    \ to immediately terminate the script. Optionally the `die()` function can accept\
