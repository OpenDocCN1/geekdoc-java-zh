    只有当 Web 服务器使用 HTTP 协议提供文档时，PHP 引擎才能解释文档。你不能直接在浏览器中打开 PHP 文件。请始终使用位置 `http://localhost/`
    来运行本书中的示例。


    Abyss Web 服务器现在应该已经运行在你的系统上，并已正确配置为识别具有 `.php` 文件扩展名的文档应由 PHP 引擎解释。现在可以通过创建一个简单的
    PHP 脚本供 Abyss 为你的 浏览器提供服务来测试配置：


    ![image](img/Image00029.jpg)


    `phpinfo.php`


    ![image](img/Image00008.jpg) 打开一个纯文本编辑器并准确输入下面的脚本


    ```php

    <?php phpinfo() ; ?>

    ```


    ![image](img/Image00010.jpg) 将脚本保存为 `phpinfo.php` 到 Abyss 文档路径目录中，通常位于 `C:\Abyss
    Web Server\htdocs`


    ![image](img/Image00012.jpg) 在网页浏览器的地址栏中准确输入位置 `http://localhost/phpinfo.php`，查看
    Abyss 提供一个包含你的 PHP 版本信息的网页


    ![image](img/Image00030.jpg)


    ![image](img/Image00019.jpg)


    PHP 脚本是区分大小写的，因此你必须使用小写字母复制列出的脚本。


    ### 嵌入 PHP 脚本代码


    PHP 脚本可以嵌入 HTML 文档中——这意味着 PHP 和 HTML 代码可以共存在于同一个文件中。所有嵌入的 PHP 代码必须包含在 `<?php`
    和 `?>` 标签内，以便 PHP 引擎能够轻松识别并进行解释。通常，PHP 代码会将内容写入 HTML 文档的 body 部分，然后将其发送到网页浏览器：


    ![image](img/Image00029.jpg)


    `hello.php`


    ![image](img/Image00008.jpg) 启动一个纯文本编辑器并创建此带有空 body 部分的有效 HTML5 文档


    ```html

    <!DOCTYPE HTML>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <title> PHP 入门</title>

    </head>

    <body>


    </body>

    </html>

    ```


    ![image](img/Image00010.jpg) 在 body 部分插入标签以包含 PHP 代码


    ```php

    <?php


    ?>

    ```


    ![image](img/Image00012.jpg) 现在，在 PHP 标签之间插入一条描述性注释和一行向 body 部分写入内容的代码


    ```php

    # 写入传统的问候。

    echo ''<h1>Hello World!</h1>'' ;

    ```


    ![image](img/Image00031.jpg)


    ![image](img/Image00005.jpg)


    注意，描述性注释被包含在 PHP 标签之间，仅用于信息提示。


    ![image](img/Image00014.jpg) 将文档编码设置为 UTF-8 格式，然后将其保存为 Abyss 服务器 `/htdocs` 文件夹中的
    `hello.php`


    ![image](img/Image00032.jpg)


    ![image](img/Image00015.jpg) 接下来，在网页浏览器的地址栏中输入位置 `http://localhost/hello.php`，查看
    Abyss 提供一个包含嵌入 PHP 代码写入内容的网页


    ![image](img/Image00033.jpg)


    ![image](img/Image00017.jpg) 现在，使用你网页浏览器的**查看源代码**功能查看 PHP 是否已将内容写入 body 部分，包括
    HTML `<h1></h1>` 标题标签


    ![image](img/Image00034.jpg)


    PHP 脚本也可以以相同的方式嵌入较早版本的 HTML 中。本书中的其他示例演示了嵌入 PHP 脚本，但没有重复列出 HTML 代码。


    ![image](img/Image00019.jpg)


    Windows 记事本会自动向文件添加隐藏的“字节顺序标记”（BOM）签名，而其他编辑器（此处所示 Code Writer）允许省略此签名。Code Writer
    是从 Windows Store 提供的免费文本和代码编辑器。


    ![image](img/Image00006.jpg)


    注意，PHP 的 `echo` 指令会字面上地写入包含在对 `'' ''` 单引号内的全部内容。


    ### 遵循规则编写


    #### 标签规则


    当 PHP 引擎从 Web 服务器接收到输入时，它会从上到下读取输入，这个过程被称为“解析”。在解析过程中，PHP 引擎（又称解析器）寻找起始和结束的 `<?php`
    和 `?>` 标签，并理解标签之间的内容是它必须解释的脚本代码。`<?php` 和 `?>` 标签之外的所有内容都会被完全忽略，这允许 PHP 文件拥有混合内容，并允许
    PHP 代码像这样嵌入到 HTML 中：


    ```html

    <p> 被 PHP 忽略并由浏览器显示</p>

    <?php echo ''将被解析的脚本代码'' ; ?>

    <p> 同样被 PHP 忽略并由浏览器显示</p>

    ```


    因此为了使其正常工作，当嵌入 HTML 文件时，将所有的 PHP 脚本代码都包含在起始和结束的 `<?php` 和 `?>` 标签之间是非常重要的。


    ![image](img/Image00005.jpg)


    通常你嵌入的 PHP 代码总会在脚本周围有起始和结束的 `<?php` 标签。


    这条规则的唯一例外是 PHP 脚本写在纯 PHP 文件中，该文件只包含代码。在这种情况下，最好省略结束的 `?>` 标签，如下：


    ```php

    <?php echo ''打印这个优先'' ;

    echo ''打印这个最后'';

    ```


    当 PHP 脚本写在纯 PHP 文件中时，可以省略结束的 `?>` 标签。PHP 脚本可以使用短标签 `<?=` 和 `?>` 来向 HTML 文档写入单个字符串：


    <?= ''Hello!'' ;` 等同于 `<?php echo ''Hello!'' ; ?>`


    高级 PHP 脚本也可以在满足条件时插入文本，如下：


    ```php

    <?php if ( $expression == true ) : ?>

    如果表达式为真插入此文本。

    <?php else : ?>

    否则插入此文本。

    <?php endif ; ?>

    ```


    ![image](img/Image00006.jpg)


    条件测试将在书中后面详细介绍。


    #### 语句规则


    PHP 语言中的每个语句都必须以 `;` 分号结束，就像英语语言中的每个句子必须以 `.` 句号结束一样。分号被解析器识别为结束它必须必须指令。所以包含两个语句的
    PHP 代码如下：


    ```php

    <?php echo ''第一个语句'' ; echo ''第二个语句''; ?>

    ```


    PHP 代码块的结束标签 `?>` 自动意味着分号，因此你可以省略结束 PHP 块最后一个语句的分号，如下：


    ```php

    <?php echo ''第一个语句'' ; echo ''第二个语句'' ?>

    ```


    ![image](img/Image00005.jpg)


    如果你愿意，终止 PHP 块的最后一个语句也没有害。


    #### 注释规则


    为你的 PHP 脚本代码添加注释通常是值得的，以便他人理解，或者在你以后回顾代码时理解。所有的空白和注释都被 PHP 解析器完全忽略，因此你可以尽可能添加注释，而对性能产生任何不利影响。


    单行注释可以用 `#` 号字符开始，或者也可以用 `//` 双斜序列开始。


    多行（块）注释必须包含在 `/*` 和 `*/` 字符序列之间，如 C 编程语言所示：


    ```php

    <?php

    echo ''第一个语句'' // 单行注释。

    /* 这是包含两行注释的多行注释。 */

    echo ''第二个语句'' ;

    echo ''最后一个语句'' ; # 另一个单行注释。

    ?>

    ```


    ![image](img/Image00005.jpg)


    `//` 单行注释样式也用于 C++ 编程，而 `#` 单行注释样式也用于 Unix/Linux BASH 脚本。


    ### 总结


    - PHP 是一种语言特别适用于 Web 开发，因为它可以嵌入 HTML 中

    - PHP 代码在云端服务器端执行，这与在浏览器客户端执行的 JavaScript 代码不同

    - 当网页包含 PHP 脚本时，Web 服务器将首先调用 PHP 引擎处理代码，然后将响应发送到网页浏览器

    - 通过在自己的电脑上安装 Web 服务器和 PHP 引擎可以创建开发环境

    '
