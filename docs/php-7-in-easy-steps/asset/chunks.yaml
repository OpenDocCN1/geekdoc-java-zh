- fmt: "\nPHP provides an XML parser called “SimpleXML” that can load an XML document\
    \ into memory as a hierarchical tree structure. The `simplexml_load_file()` function\
    \ requires the XML file name and path to transform the document into a data structure\
    \ comprising `SimpleXMLElement` objects. The data structure can then be explored\
    \ using the `var_dump()` function.\n\n![image](Image00029.jpg)\n\ncatalog.php\n\
    \n![image](Image00085.jpg)  Begin a PHP script with a statement to set a page\
    \ title and to preserve text formatting\n\n```php\n<?php\necho ‘<title>PHP SimpleXML</title><pre>\
    \ ;\n```\n\n![image](Image00086.jpg)  Next, add a statement to load the XML data\
    \ or quit\n\n```php\n$xml = simplexml_load_file( ‘catalog.xml’ )\nor die( ‘Unable\
    \ to load data!’ ) ;\n```\n\n![image](Image00087.jpg)  Now, display all the SimpleXMLElement\
    \ objects\n\n```php\nvar_dump( $xml ) ;\n```\n\n![image](Image00088.jpg)  Save\
    \ the document in your web server’s `/htdocs` directory as `catalog.php`, alongside\
    \ the `catalog.xml` file, then open the page via HTTP to see the SimpleXMLElement\
    \ objects\n\n![image](Image00216.jpg)\n\n![image](Image00005.jpg)\n\nNotice that\
    \ this data structure depicts an array named “book” that has five array elements\
    \ – corresponding to the five XML `<book>` elements.\n\n![image](Image00006.jpg)\n\
    \nThe ubiquitous nature of XML makes it ideal to transport data across the internet.\n\
    \n## Getting nodes\n\nThe data structure contained in a SimpleXML object describes\
    \ a parent-child relationship between outer and inner XML elements. Each member\
    \ of the data structure is known as a “node”. The top-level nodes are direct child\
    \ descendants of the SimpleXML object itself, so can be referenced using the object\
    \ name, `->` object operator, and child node name. For example, `$object->child`.\
    \ A child of the child node (grandchild) can be referenced by adding a further\
    \ `->` object operator, and the grandchild node name, such as `$object->child->grandchild`\
    \ and so on for each further generation:\n\n![image](Image00029.jpg)\n\nnodes.php\n\
    \n![image](Image00085.jpg)  Begin a PHP script with a statement to set a page\
    \ title\n\n```php\n<?php\necho ‘<title>PHP SimpleXML</title>’ ;\n```\n\n![image](Image00086.jpg)\
    \  Add a statement to load the XML data or quit\n\n```php\n$xml = simplexml_load_file(\
    \ ‘catalog.xml’ )\nor die( ‘Unable to load data!’ ) ;\n```\n\n![image](Image00087.jpg)\
    \  Next, retrieve the content of the “title” element that is a child of the first\
    \ “book” element\n\n```php\necho ‘First book : ‘ .\n$xml -> book[0] -> title .\
    \ ’ in easy steps<br>’ ;\n```\n\n![image](Image00088.jpg)  Now, retrieve the content\
    \ of the “category” element that is a child of the first “book” element\n\n```php\n\
    echo ‘Language category : ‘ . $xml -> book[0] -> category ;\n```\n\n![image](Image00089.jpg)\
    \  Save the document in your web server’s `/htdocs` directory as `nodes.php`,\
    \ alongside the `catalog.xml` file, then open the page via HTTP to see the node\
    \ content\n\n![image](Image00217.jpg)\n\n![image](Image00005.jpg)\n\nAs there\
    \ are five “book” nodes on the same hierarchical level, in this example they are\
    \ created as an array. Each node can therefore be individually referenced using\
    \ its node name and array index number.\n\n## Looping through nodes\n\nThe SimpleXML\
    \ object provides methods to work with the data contained within its data structure.\
    \ Usefully, its `children()` method returns all child nodes and can be used to\
    \ loop through the nodes to retrieve each node’s content:\n\n![image](Image00029.jpg)\n\
    \nnodes-loop.php\n\n![image](Image00085.jpg)  Begin a PHP script with a statement\
    \ to set a page title\n\n```php\n<?php\necho ‘<title>PHP SimpleXML</title>’ ;\n\
    ```\n\n![image](Image00086.jpg)  Add a statement to load the XML data or quit\n\
    \n```php\n$xml = simplexml_load_file( ‘catalog.xml’ )\nor die( ‘Unable to load\
    \ data!’ ) ;\n```\n\n![image](Image00087.jpg)  Next, initialize an iteration counter\
    \ at zero\n\n```php\n$counter = 0 ;\n```\n\n![image](Image00088.jpg)  Now, add\
    \ a loop to increment the counter and to display all “title” and “category” child\
    \ node content\n\n```php\nforeach( $xml ->children() as $book )\n{\n    $counter\
    \ ++ ;\n    echo ‘Book ‘ . $counter . ’ : ‘ ;\n    echo $book -> title . ’ in\
    \ easy steps [’ . $book -> category . ’]<hr>’ ;\n}\n```\n\n![image](Image00089.jpg)\
    \  Save the document in your web server’s `/htdocs` directory as `nodes-loop.php`,\
    \ alongside the `catalog.xml` file, then open the page via HTTP to see the node\
    \ content\n\n![image](Image00216.jpg)\n\n![image](Image00005.jpg)\n\n## Getting\
    \ attributes\n\nValues contained within a `SimpleXMLElement` can be referenced\
    \ by stating the attribute name, within quotes, following the node name. For example,\
    \ `$object->child['feature']`.\n\n![image](Image00029.jpg)\n\nattribs.php\n\n\
    ![image](Image00085.jpg)  Begin a PHP script with a statement to set a page title\n\
    \n```php\n<?php\necho ‘<title>PHP SimpleXML</title>’ ;\n```\n\n![image](Image00086.jpg)\
    \  Add a statement to load the XML data or quit\n\n```php\n$xml = simplexml_load_file(\
    \ ‘catalog.xml’ )\nor die( ‘Unable to load data!’ ) ;\n```\n\n![image](Image00087.jpg)\
    \  Next, retrieve the content of the “title” element that is a child of the first\
    \ “book” element\n\n```php\necho ‘First book : ‘ .\n$xml -> book[0] -> title .\
    \ ’ in easy steps<br>’ ;\n```\n\n![image](Image00088.jpg)  Now, retrieve the content\
    \ of the “category” element that is a child of the first “book” element\n\n```php\n\
    echo ‘Cover : ‘ .\n$xml -> book[0] -> title['cover'] . ’>’ ;\n```\n\n![image](Image00089.jpg)\
    \  Use the value retrieved in the previous step to display an image\n\n![image](Image00216.jpg)\n\
    \n![image](Image00006.jpg)\n\nNotice that each attribute value here is the path\
    \ and filename to an image in a directory `/images/`.\n\n## Looping through attributes\n\
    \nThe SimpleXML object `children()` method can once again be used to loop through\
    \ nodes and retrieve the value of a particular node on each iteration:\n\n![image](Image00029.jpg)\n\
    \nattribs-loop.php\n\n![image](Image00085.jpg)  Begin a PHP script with a statement\
    \ to set a page title\n\n```php\n<?php\necho ‘<title>PHP SimpleXML</title>’ ;\n\
    ```\n\n![image](Image00086.jpg)  Add a statement to load the XML data or quit\n\
    \n```php\n$xml = simplexml_load_file( ‘catalog.xml’ )\nor die( ‘Unable to load\
    \ data!’ ) ;\n```\n\n![image](Image00087.jpg)  Next, initialize an iteration counter\
    \ at zero\n\n```php\n$counter = 0 ;\n```\n\n![image](Image00088.jpg)  Now, add\
    \ a loop to increment the counter and to display its value, then retrieve an attribute\
    \ value on each iteration to display an image\n\n```php\nforeach( $xml ->children()\
    \ as $book )\n{\n    $counter ++ ;\n    echo ‘ ‘ . $counter . ‘: ‘ ;\n    echo\
    \ ‘<img src=” . $book -> title['cover'] . ’>’’ ;\n}\n```\n\n![image](Image00089.jpg)\
    \  Save the document in your web server’s `/htdocs` directory as `attribs-loop.php`,\
    \ alongside the `catalog.xml` file, then open the page via HTTP to see the counter\
    \ and image displayed on each iteration of the loop\n\n![image](Image00220.jpg)\n\
    \n![image](Image00005.jpg)\n\nA SimpleXMLElement object also provides an `attributes()`\
    \ method that returns an associative array of all attribute names and values within\
    \ an element. For example, `$obj->child->attributes()`.\n\n**Including feeds**\n"
