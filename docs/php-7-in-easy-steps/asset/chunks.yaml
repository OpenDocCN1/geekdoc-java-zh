    *This chapter demonstrates how to read and write files with PHP and how to deal
    with errors in scripts.*


    [**Reading files**](#text00010.html_sec54)


    [**Reading lines**](#text00010.html_sec55)


    [**Reading characters**](#text00010.html_sec56)


