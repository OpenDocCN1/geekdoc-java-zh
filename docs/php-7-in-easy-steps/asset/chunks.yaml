    # 1

    ## 入门

    欢迎来到 PHP 交互式 Web 的精彩世界。本章将演示如何使用 Web 服务器和 PHP 引擎创建一个动态开发环境。


    * 介绍 PHP

    * 安装 Abyss 服务器

    * 安装 PHP 引擎

    * 集成 Abyss 和 PHP

    * 嵌入 PHP 脚本代码

    * 按规则脚本

    * 总结


    ## 介绍 PHP

    最吸引人的现代网站通过动态响应当前状况（用户名、时间、最新博客、购物车内容等）提供定制的用户体验。许多动态网站都是使用 PHP 创建的。


    ### 什么是 PHP？

    PHP 是一种广泛使用的通用脚本语言，特别适用于 Web 开发并可以嵌入 HTML 中。它由程序员 Rasmus Lerdorf 创建，最初是用于维护他网站的一组脚本，并于
    1995 年 6 月 8 日发布为“个人首页工具（PHP Tools）1.0 版本”。


    ![](img/Image00001.jpg)


    这是 PHP 项目的官方标志——PHP 的官方在线可以在 [php.net](http://www.php.net) 获取。


    这些工具在 1997 年的 2 版本中得到了扩展，并在次年的 3 版本中名称更改变为递归缩写“PHP: 超文本预处理器”。2000 年随着 PHP4 的发布，通过
    Zend 引擎虚拟机的驱动，性能、可靠性和扩展性得到了提高。


    随后，PHP5 于 2004 年发布，由新的 Zend II 引擎驱动，并由 PHP 组作为免费软件制作。计划在整个 PHP 中引入原生 Unicode 支持的实验性版本
    PHP6 被放弃了。目前的版本 PHP7 于 2015 年发布，由最新的 Zend 3 引擎驱动，提供了更高的性能。今天，PHP 已安装在超过 2000 万网站和
    100 万台 Web 服务器上。


