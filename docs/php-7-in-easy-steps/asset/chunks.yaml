  trans: "\n\n*本章演示如何在函数中创建可重用的代码块。*\n\n## 定义函数\n\nPHP 提供了许多内置函数，可以在脚本中通过名称调用这些函数来执行预定义的操作，例如此处描述的数组排序函数。此外，你也可以创建自己的自定义函数，在被调用时执行特定的操作。这可以方便地将\
    \ PHP 脚本模块化为易于理解和维护的代码段。\n\n![image](img/Image00084.jpg)\n\n你的自定义函数名可以包含字母、数字和下划线的任意组合，但必须以字母或下划线开头。不所当然，为了避免冲突，名称不能与现有的内置函数名重复，例如，你不能创建一个名为\
    \ “sort” 的自定义函数。\n\n与 PHP 变量不同，函数名是不区分大小写的，因此 `cube()`、`Cube()` 和 `CUBE()` 都可以引用同一个函数。尽管如此，建议你始终使用与函数定义中相同的大小写。\n\
    \n在 PHP 脚本中，创建函数定义非常简单：在 `function` 关键字后写出其名称，然后跟着括号和花括号，花括号内包含每次调用函数时要执行的语句：\n\
    \n```php\nfunction function_name ( )\n{\n    statement-to-be-executed ;\n    statement-to-be-executed\
    \ ;\n    statement-to-be-executed ;\n}\n```\n\n![image](img/Image00006.jpg)\n\n\
    PHP 变量名区分大小写，但 PHP 函数名不区分。\n\nPHP 脚本可以通过 `function_name()` 通过名称调用定义的函数，并在需要时执行其包含的语句。虽然解释器从上到下运行脚本，但函数调用出现在函数定义之前。然而，这不是良好的编程习惯，因此你应该在调用函数之前定义它们。\n\
    \n函数可以包含任何有效的 PHP 脚本代码，甚至可以包含另一个函数定义。在这种情况下，在外部函数被调用之前，内部函数将不存在。\n\n![image](img/Image00029.jpg)\n\
    \nfunction.php\n\n![image](img/Image00085.jpg)  以一个定义函数的语句开始 PHP 脚本\n\n```php\n\
    <?php\nfunction greet ()\n{\n    echo ‘Hello User!<br> ;\n}\n```\n\n![image](img/Image00086.jpg)\
    \  接下来，添加一条语句调用上一步定义的函数，使其执行其语句\n\n```php\ngreet () ;\n```\n\n![image](img/Image00087.jpg)\
    \  现在，定义另一个包含一个内部函数定义和另一个后继语句的函数\n\n```php\nfunction outer ()\n{\n    function\
    \ inner ()\n    {\n        echo ‘Inner function called.<br> ;\n    }\n    echo\
    \ ‘Inner function created.<br> ;\n}\n```\n\n![image](img/Image00088.jpg)  最后，添加语句调用上一步定义的每一个函数\n\
    \n```php\nouter () ;\ninner () ;\n?>\n```\n\n![image](img/Image00089.jpg)  将文档保存到\
    \ Web 服务器的 `/htdocs` 目录中并命名为 `function.php`，然后通过 HTTP 打开页面查看每个函数调用的输出\n\n![image](img/Image00090.jpg)\n\
    \n![image](img/Image00005.jpg)\n\n删除对外部函数的调用，以便在脚本尝试调用内部函数时，看到未定义函数的错误。\n\n##\
    \ 传递参数\n\n数据可以作为“参数”传递给函数，就像你向某些内置 PHP 函数传递参数一样。例如，`sort()` 函数将要排序的数组作为其参数。函数可以带有任意数量的参数创建，但在调用时，必须为每个参数提供数据以避免错误。\n\
    \n![image](img/Image00006.jpg)\n\n参数必须在函数声明中指定，格式为逗号分隔的列表，而调用者传递的参数值也应为逗号分隔的列表。\n\
    \n一个接收参数的函数通过在函数名后的括号内包含逗号分隔的“参数”列表来定义，如下：\n\n```php\nfunction function_name (\
    \ $arg_1 , $arg_2 , $arg_3 )\n{\n    statement-to-be-executed ;\n    statement-to-be-executed\
    \ ;\n    statement-to-be-executed ;\n}\n```\n\n参数名必须遵循 PHP 变量所需的相同命名规范，并且理想情况下应该具有意义，以表示将传递的数据性质。参数数据必须在调用时按正确的顺序传递，然后供该函数内部的语句使用。\n\
    \n可选，函数定义可以通过在参数名称之前包含类型描述来指定从调用者处传递的数据类型。有效的类型描述包括 `int`、`float`、`string`、`bool`、`callable`\
    \ 和 `array`。当指定类型时，尝试传递错误数据类型的调用会导致错误。\n\n![image](img/Image00003.jpg)\n\n重要的是，默认情况下参数数据是“按值”（by\
    \ value）传递的。这意味着如果函数指定了一个变量，只有数据的副本会被传递给函数。当按值传递时，修改参数不会影响变量中的原始数据。\n\n如果你想让函数修改函数调用中指定的变量存储的数据，你必须“按引用”（by\
    \ reference）传递。这允许函数直接在原始数据上进行操作。要确保参数始终按引用传递，你只需要在函数定义中的参数名称前前缀一个 `&` 符号。\n\n\
    ![image](img/Image00029.jpg)\n\narguments.php\n\n![image](img/Image00085.jpg)\
    \  以一个初始化两个相同整数变量的语句开始 PHP 脚本\n\n```php\n<?php\n$a = $b = 5 ;\n```\n\n![image](img/Image00086.jpg)\
    \  接下来，定义一个接受两个整数参数的函数——一个按值传递，另一个按引用传递\n\n```php\nfunction modify ( int $val\
    \ , int & $ref )\n{\n    // 要插入的语句。\n}\n```\n\n![image](img/Image00087.jpg)  现在，插入语句输出传递的值，然后增加这些值并显示修改后的值\n\
    \n```php\necho “Passed values : $val , $ref <br>” ;\n$val ++ ;\n$ref ++ ;\necho\
    \ “Incremented values : $val , $ref <hr>” ;\n```\n\n![image](img/Image00088.jpg)\
    \  在函数块之后添加一条语句调用函数，并将变量值作为参数\n\n```php\nmodify ( $a , $b ) ;\n```\n\n![image](img/Image00089.jpg)\
    \  最后，添加一条语句显示存储在每个变量中的值\n\n```php\necho “Stored values : $a , $b ” ;\n?>\n```\n\
    \n## 可变参数\n\n在函数定义中可以通过赋值参数名称可选地指定默认参数值，如下：\n\n```php\nfunction function_name\
    \ ( $arg_1 , $arg_2 = “Default String” )\n{\n    statement-to-be-executed ;\n\
    \    statement-to-be-executed ;\n    statement-to-be-executed ;\n}\n```\n\n"
- fmt: "\nThis allows a function call to be made that specifies either one or two\
    \ argument values. If only one argument is specified, it is assigned to the first\
    \ parameter and the default value is used by the second parameter. Where default\
    \ values are specified for parameters, they must only appear in the parameter\
    \ list following (to the right of) parameters that have no specified default value.\
    \ Otherwise, a call without the correct total number of arguments would cause\
    \ an error.\n\n![image](Image00019.jpg)\n\nIf multiple default values are specified\
    \ there is currently no way to skip a parameter in a function call, to assign\
    \ an argument value to a particular parameter.\n\nIf you need to create a function\
    \ that will accept an unknown number of arguments, PHP has a special `...` “splat”\
    \ operator for that purpose. This can be used in a function definition like this:\n\
    \n```php\nfunction function_name ( ...$args )\n{\n    statement-to-be-executed\
    \ ;\n    statement-to-be-executed ;\n    statement-to-be-executed ;\n}\n```\n\n\
    When the `...` splat operator is used to prefix a parameter name in a function\
    \ definition, multiple arguments can be passed to that parameter to create an\
    \ array. The array can be traversed like any other array to manipulate the passed\
    \ in argument values.\n\nAdditionally, the `...` splat operator can be used to\
    \ “unpack” an array specified in a function call to pass its element values as\
    \ individual arguments like this:\n\n```php\nfunction function_name ( $arg_1 ,\
    \ $arg_2 , $arg_3 )\n{\n    echo $arg_1 + $arg_2 + $arg_3 ;\n}\n\n$arr = [ 1 ,\
    \ 2 , 3 ] ;\nfunction_name ( ...$arr ) # Outputs 6\n```\n\n![image](Image00005.jpg)\n\
    \nThe `...` splat operator is also sometimes known as the “scatter” operator.\n\
    \n![image](Image00029.jpg)\n\nparameters.php\n\n![image](Image00085.jpg) Begin\
    \ a PHP script by defining a function that provides default string values to its\
    \ two parameters\n\n```php\n<?php\nfunction drink ( string $tmp = ‘hot’ , string\
    \ $flavor = ‘tea’ )\n{\n    // Statement to be inserted here.\n}\n```\n\n![image](Image00086.jpg)\
    \ Next, insert a statement to display its default values or passed in argument\
    \ values\n\n```php\necho “Drinking $tmp $flavor .<br>” ;\n```\n\n![image](Image00087.jpg)\
    \ After the function block, add function calls that optionally pass string arguments\n\
    \n```php\ndrink () ; drink ( ‘iced’ ) ; drink ( ‘cold’ , ‘lemonade’ ) ;\n```\n\
    \n![image](Image00088.jpg) Now, define a function that can accept multiple integer\
    \ arguments and display their total value\n\n```php\nfunction add ( int ... $numbers\
    \ )\n{\n    $total = 0 ;\n    foreach( $numbers as $num ) { $total + = $num ;\
    \ }\n    echo “<hr>Total : $total ” ;\n}\n```\n\n![image](Image00089.jpg) Finally,\
    \ after the function block add a statement to call the function in the previous\
    \ step and pass three values\n\n```php\nadd ( 1 , 2 , 3 ) ;\n?>\n```\n\n![image](Image00091.jpg)\
    \ Save the document in your web server’s `/htdocs` directory as `parameters.php`\
    \ then open the page via HTTP to see the argument and default values\n\n![image](Image00093.jpg)\n\
    \n![image](Image00005.jpg)\n\nYou can specify regular positional parameters before\
    \ a parameter that accepts multiple arguments with the `...` splat operator. Only\
    \ arguments that outnumber the positional elements will be added to the array\
    \ of the final parameter.\n\n### Recognizing scope\n\nWhen creating custom functions\
    \ it is important to understand how variable accessibility is limited by the variable’s\
    \ “scope”:\n\n- Variables created outside a function have “global” scope, but\
    \ are not normally accessible from within any function block\n- Variables created\
    \ inside a function have “local” scope so are only accessible from within that\
    \ particular function block\n\nAs a variable created within a function is not\
    \ accessible from elsewhere, its name may duplicate the name of a variable outside\
    \ a function block, or within another function block, without conflict. This allows\
    \ a global variable to contain a different value to a local variable of the same\
    \ name.\n\n![image](Image00019.jpg)\n\nGlobal variables in PHP are not like those\
    \ in other programming languages such as C, where they are automatically available\
    \ to functions. In PHP, global variables can only be used in functions if first\
    \ explicitly declared inside the function block using the `global` keyword.\n\n\
    If you wish to use a global variable inside a function, you must first include\
    \ a statement with the `global` keyword to declare that the variable name refers\
    \ to a global variable, like this:\n\n```php\nglobal variable-name ;\n```\n\n\
    The scope of a variable created within a function can be altered to make it available\
    \ globally by preceding its declaration with the `global` keyword – but this is\
    \ bad practice and should be avoided.\n\nFunction statements can call other functions\
    \ to execute their statements and can also call themselves to execute recursively.\
    \ As with loops, a recursive function must alter the state of a tested condition\
    \ so it will not continue forever. This might be a counter value that gets passed\
    \ in as an argument from an initial function call, then gets incremented on successive\
    \ recursive calls until it exceeds a value specified in a test. Alternatively,\
    \ a static local variable could be declared to store an incrementing value like\
    \ this:\n\n```php\nstatic variable-name ;\n```\n\nUnlike other local variables,\
    \ which lose their value when the program scope leaves the function, static variables\
    \ retain their value. This means that the updated value of an incremented value\
    \ stored in a static local variable is recognized on each function call.\n\nA\
    \ recursive function might otherwise reference a global variable counter value\
    \ that gets incremented on successive recursive calls, until it exceeds a value\
    \ specified in a test.\n\n![image](Image00029.jpg)\n\nscope.php\n\n![image](Image00085.jpg)\
    \ Begin a PHP script by initializing a global variable with an integer and displaying\
    \ the variable value\n\n```php\n<?php\n$number = 1 ; echo “Global number : $number\
    \ <br>” ;\n```\n\n![image](Image00086.jpg) Next, define and call a function that\
    \ initializes a like- named local variable and displays that variable value `show_local()`\n\
    \n```php\nfunction show_local ()\n{\n    $number = 100 ; echo “Local number :\
    \ $number <hr>” ;\n}\n\nshow_local () ;\n```\n\n![image](Image00087.jpg) Now,\
    \ define and call a recursive function that increments the global variable and\
    \ a static variable on each call\n\n```php\nfunction recur ()\n{\n    global $number\
    \ ;\n    static $letter = ‘A’ ;\n    if( $number < 14 )\n    {\n        echo “\
    \ $number : $letter | “ ;\n        $number ++ ; $letter ++ ; recur () ;\n    }\n\
    }\n\nrecur () ;\n```\n\n![image](Image00088.jpg) Finally, after the function block\
    \ add a statement to display the modified global variable\n\n```php\necho “<hr>Global\
    \ number : $number ” ;\n?>\n```\n\n![image](Image00089.jpg) Save the document\
    \ in your web server’s `/htdocs` directory as `scope.php` then open the page via\
    \ HTTP to see the global and local variable values\n\n![image](Image00094.jpg)\n\
    \n![image](Image00006.jpg)\n\nIf you remove the `static` keyword from this function\
    \ the `$letter` variable will simply contain ‘A’ each time the function is called.\n\
    \n![image](Image00005.jpg)\n\nPHP also has a special `$GLOBALS` array in which\
    \ the value of a global variable can be referenced by its name. In this example\
    \ you could alternatively use `$GLOBALS['number']` to get the value.\n\n### Returning\
    \ values\n\nA custom PHP function can return a value to the caller by adding a\
    \ statement using the `return` keyword, like this:\n\n```php\nfunction function_name\
    \ ( )\n{\n    statement-to-be-executed ;\n    statement-to-be-executed ;\n   \
    \ return value ;\n}\n```\n\nThe `return` statement is optional and if omitted,\
    \ functions will return a `NULL` value to the caller by default.\n\nFunctions\
    \ can only return a single item to the caller, so they cannot return multiple\
    \ values. You can, however, assign multiple values to elements of an array and\
    \ have a function return the single array to the caller, then unpack the values.\n"
  raw: 'This allows a function call to be made that specifies either one or two argument
    values. If only one argument is specified, it is assigned to the first parameter
    and the default value is used by the second parameter. Where default values are
    specified for parameters, they must only appear in the parameter list following
    (to the right of) parameters that have no specified default value. Otherwise,
    a call without the correct total number of arguments would cause an error.


    ![image](Image00019.jpg)


    If multiple default values are specified there is currently no way to skip a parameter
    in a function call, to assign an argument value to a particular parameter.


    If you need to create a function that will accept an unknown number of arguments,
    PHP has a special **...** “splat” operator for that purpose. This can be used
    in a function definition like this:


    **function *function_name* ( ...$*args* )**


    **{**


    ***statement-to-be-executed ;


    statement-to-be-executed ;


    statement-to-be-executed ;***


    **}**


    When the **...** splat operator is used to prefix a parameter name in a function
    definition, multiple arguments can be passed to that parameter to create an array.
    The array can be traversed like any other array to manipulate the passed in argument
    values.


    Additionally, the **...** splat operator can be used to “unpack” an array specified
    in a function call to pass its element values as individual arguments like this:


    **function *function_name* ( $*arg_1* , $*arg_2* , $*arg_3* )**


    **{**


    **echo $*arg_1* + $*arg_2* + $*arg_3* ;**


    **}**


    **$arr = [ 1 , 2 , 3 ] ;**


    ***function_name* ( ...$arr ) ;         # Outputs 6**


    ![image](Image00005.jpg)


    The **...** splat operator is also sometimes known as the “scatter” operator.


    ![image](Image00029.jpg)


    parameters.php


    ![image](Image00085.jpg)  Begin a PHP script by defining a function that provides
    default string values to its two parameters


    **<?php**


    **function drink ( string $tmp = ‘hot’ , string $flavor = ‘tea’ )**


    **{**


    **// Statement to be inserted here.**


    **}**


    ![image](Image00086.jpg)  Next, insert a statement to display its default values
    or passed in argument values


    **echo “Drinking $tmp $flavor .<br>” ;**


    ![image](Image00087.jpg)  After the function block, add function calls that optionally
    pass string arguments


    **drink () ; drink ( ‘iced’ ) ; drink ( ‘cold’ , ‘lemonade’ ) ;**


    ![image](Image00088.jpg)  Now, define a function that can accept multiple integer
    arguments and display their total value


    **function add ( int ... $numbers )**


    **{**


    **$total = 0 ;**


    **foreach( $numbers as $num ) { $total + = $num ; }**


    **echo “<hr>Total : $total ” ;**


    **}**


    ![image](Image00089.jpg)  Finally, after the function block add a statement to
    call the function in the previous step and pass three values


    **add ( 1 , 2 , 3 ) ;**


    **?>**


    ![image](Image00091.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **parameters.php**  then open the page via HTTP to see the argument and default
    values


    ![image](Image00093.jpg)


    ![image](Image00005.jpg)


    You can specify regular positional parameters before a parameter that accepts
    multiple arguments with the **...** splat operator. Only arguments that outnumber
    the positional elements will be added to the array of the final parameter.


    **Recognizing scope**


    When creating custom functions it is important to understand how variable accessibility
    is limited by the variable’s “scope”:


    • Variables created outside a function have “global” scope, but are not normally
    accessible from within any function block


    • Variables created inside a function have “local” scope so are only accessible
    from within that particular function block


    As a variable created within a function is not accessible from elsewhere, its
    name may duplicate the name of a variable outside a function block, or within
    another function block, without conflict. This allows a global variable to contain
    a different value to a local variable of the same name.


    ![image](Image00019.jpg)


    Global variables in PHP are not like those in other programming languages such
    as C, where they are automatically available to functions. In PHP, global variables
    can only be used in functions if first explicitly declared inside the function
    block using the **global** keyword.


    If you wish to use a global variable inside a function, you must first include
    a statement with the **global** keyword to declare that the variable name refers
    to a global variable, like this:


    **global *variable-name* ;**


    The scope of a variable created within a function can be altered to make it available
    globally by preceding its declaration with the **global** keyword – but this is
    bad practice and should be avoided.


    Function statements can call other functions to execute their statements and can
    also call themselves to execute recursively. As with loops, a recursive function
    must alter the state of a tested condition so it will not continue forever. This
    might be a counter value that gets passed in as an argument from an initial function
    call, then gets incremented on successive recursive calls until it exceeds a value
    specified in a test. Alternatively, a static local variable could be declared
    to store an incrementing value like this:


    **static *variable-name* ;**


    Unlike other local variables, which lose their value when the program scope leaves
    the function, static variables retain their value. This means that the updated
    value of an incremented value stored in a static local variable is recognized
    on each function call.


    A recursive function might otherwise reference a global variable counter value
    that gets incremented on successive recursive calls, until it exceeds a value
    specified in a test.


    ![image](Image00029.jpg)


    scope.php


    ![image](Image00085.jpg)  Begin a PHP script by initializing a global variable
    with an integer and displaying the variable value


    **<?php**


    **$number = 1 ; echo “Global number : $number <br>” ;**


    ![image](Image00086.jpg)  Next, define and call a function that initializes a
    like- named local variable and displays that variable value **function show_local
    ()**


    **{**


    **$number = 100 ; echo “Local number : $number <hr>” ;**


    **}**


    **show_local () ;**


    ![image](Image00087.jpg)  Now, define and call a recursive function that increments
    the global variable and a static variable on each call


    **function recur ()**


    **{**


    **global $number ;        static $letter = ‘A’ ;**


    **if( $number < 14 )**


    **{**


    **echo “ $number : $letter | “ ;**


    **$number ++ ; $letter ++ ; recur () ;**


    **}**


    **}**


    **recur () ;**


    ![image](Image00088.jpg)  Finally, after the function block add a statement to
    display the modified global variable value


    **echo “<hr>Global number : $number ” ;**


    **?>**


    ![image](Image00089.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **scope.php**  then open the page via HTTP to see the global and local variable
    values


    ![image](Image00094.jpg)


    ![image](Image00006.jpg)


    If you remove the **static** keyword from this function the **$letter** variable
    will simply contain ‘A’ each time the function is called.


    ![image](Image00005.jpg)


    PHP also has a special **$GLOBALS** array in which the value of a global variable
    can be referenced by its name. In this example you could alternatively use **$GLOBALS[‘number’]**
    to get the value.


    **Returning values**


    A custom PHP function can return a value to the caller by adding a statement using
    the **return** keyword, like this:


    **function *function_name* ( )**


    **{**


    ***statement-to-be-executed ;


    statement-to-be-executed ;*


    return *value ;***


    **}**


    The **return** statement is optional and if omitted, functions will return a **NULL**
    value to the caller by default.


    Functions can only return a single item to the caller, so they cannot return multiple
    values. You can, however, assign multiple values to elements of an array and have
    a function return the single array to the caller, then unpack the values.'
