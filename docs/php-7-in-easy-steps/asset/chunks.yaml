    ![image](Image00225.jpg)


    Discover more about OpenWeatherMap at [**openweathermap.org**](http://www.openweathermap.org)
    and sign up to receive your own ID key.


    OpenWeatherMap has a free Current Weather Data API that can be found at **[http://api.openweathermap.org/data/2.5/weather](http://api.openweathermap.org/data/2.5/weather)**


    The Current Weather Data API allows you to request weather data in many forms.
    The parameters provided by this API include:


    • **q** = city name (or city name, country code)


    • **units** = metric (celsius), imperial (fahrenheit), or standard (kelvin, the
    default) temperature scale


    • **mode** = xml, html, or json (the default) format


    • **appid** = required authorization key, supplied free upon registration at OpenWeatherMap


    The parameters and required **=** values are appended to the OpenWeatherMap URL
    after a **?** and are separated by **&** .


    The response from OpenWeatherMap can be delivered as an XML file that may be written
    into the web server’s **/htdocs** folder using the PHP **asXml()** function to
    specify a filename. This can be examined in the web browser to discover the nature
    of the data retrieved, the XML element names, attribute names and structure:


    ![image](Image00029.jpg)


    params.php


    ![image](Image00085.jpg)  Begin a PHP script by assigning string values to four
    variables, which will be used to set response parameters


    **<?php**


    **$city = ‘New York’ ;**


    **$units = ‘imperial’ ;**


    **$mode = ‘xml’ ;**


    **$id = ‘28df3c64f387cf55026e0de3fb8beaa4’ ;**


    ![image](Image00086.jpg)  Next, add a statement to build a request string using
    specified parameter values


    **$request =**


    **‘http://api.openweathermap.org/data/2.5/weather?’ .**


    **‘q=’ . $city . ’&units=’ . $units . ’&mode=’ . $mode . ’&APPID=’ . $id ;**


    ![image](Image00087.jpg)  Now, add a statement to load XML data using the request
    string parameters, or quit


    **$xml = simplexml_load_file( $request )**


    **or die( ‘Unable to load data!’ ) ;**


    ![image](Image00215.jpg)


    params.xml


    ![image](Image00088.jpg)  When a response is received, attempt to write the content
    as an XML file in the web server’s  **/htdocs**  directory


    **try**


    **{**


    **$xml ->asXml( ‘params.xml’ ) ;**


    **// Statement to be inserted here (step 5).**


    **}**


    **catch( Exception $e )**


    **{**


    **echo ‘Error : ‘ . $e ->getMessage() ;**


    **}**


    ![image](Image00089.jpg)  Insert a statement to relocate the browser to view the
    newly created XML document


    **header( ‘Location: params.xml’ ) ;**


    ![image](Image00091.jpg)  Save the PHP script in your web server’s  **/htdocs**  directory
    as  **params.php**  then open the page via HTTP to examine the XML content of
    the retrieved response


    ![image](Image00226.jpg)


    ![image](Image00006.jpg)


    The response will only contain weather data for prevailing conditions.


    ![image](Image00227.jpg)


    The data highlighted here is that of most interest. It can be retrieved using
