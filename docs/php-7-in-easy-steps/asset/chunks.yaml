    Validation could be extended. For example, it may also allow underscore characters
    and might specify a minimum permissible password length.


    **Viewing cookie data**


    The special PHP **$_COOKIE** global array variable stores cookie names and values
    in an associative array of keys and values. Stored content can be viewed by looping
    through the array to see all names and values, or using the PHP **var_dump()**
    function:


    ![image](Image00029.jpg)


    cookie_data.php


    ![image](Image00054.jpg)  Begin a PHP script with a test to find if any cookies
    are set and retrieve all stored names and values upon success


    **<?php**


    **if( count( $_COOKIE ) > 0 )**


    **{**


    **echo ‘<dl> ‘ ;**


    **foreach( $_COOKIE as $key => $value )**


    **{**


    **echo “<dt>Key: $key ” ;**


    **echo “<dd>Value: $value ” ;**


    **}**


    **echo ‘</dl><hr>’ ;**


    **var_dump( $_COOKIE ) ;**


    **}**


    ![image](Image00055.jpg)  Next, add alternative output for when cookies are absent


    **e** l**se**


    **{**


    **echo ‘Please <a href=” cookie_form.html ”>Log In</a>’ ;**


    **}**


    **?>**


    ![image](Image00056.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **cookie_data.php**


    ![image](Image00057.jpg)  Now, open the HTML form  **cookie_form.html**  ([here](#text00012.html_cookie)
    ) via HTTP and enter valid login data, then follow the link on  **cookie_get.php**  ([here](#text00012.html_cookiep)
    ) to see cookie data


    ![image](Image00185.jpg)


    ![image](Image00005.jpg)


    You can call the **setcookie( )** function at any time to create a new cookie
    or overwrite an existing cookie.


    ![image](Image00186.jpg)


    ![image](Image00058.jpg)  Open the **Settings** menu in your web browser and clear
    existing cookies that are stored on your system


    ![image](Image00061.jpg)  Now, use the ![image](Image00187.jpg) Refresh button
    in your browser to reload this page and see the alternative content – confirming
    that the cookie data has been removed


    ![image](Image00188.jpg)


    ![image](Image00189.jpg)


    ![image](Image00005.jpg)


    The PHP manual describes the removal of a cookie by setting its value to empty
    and its expiration date to the past. For example, **setcookie(** **$_COOKIE[ ‘user’
    ] , ‘‘ , time()-3600 )** . Additionally, the **unset()** function can be used
    to destroy a specified variable.


    **Submitting session data**


    User data can be stored in cookies on the client computer only if the user chooses
    to allow cookies onto their system. Many users prefer to disallow cookies, however,
    to avoid tracking – but PHP provides a better alternative. With PHP, user data
    can be stored on the server using the special **$_SESSION** global array variable.
    In order for PHP sessions to work, each PHP page must call the built-in **session_start()**
    function at the top of the page – before any HTML tags! HTML form submissions
    to the server via the **POST** method assigns field data to the special PHP **$_POST**
    global array variable, and individual submission fields can be sought using the
    built-in PHP **isset()** function. When this confirms the field is present, its
    name and value can be stored in a session variable. This might be used to store
    a username and password details for use across a website, as an alternative to
    cookie storage:


    ![image](Image00174.jpg)


    session_form.html


