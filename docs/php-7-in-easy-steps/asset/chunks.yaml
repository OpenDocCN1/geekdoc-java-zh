    Storing passwords in cookies is not the most secure method but is used here merely
    to demonstrate how to use cookies to store data.


    ### Setting cookies


    Upon receiving a form submission, a PHP script can check for the presence of fields
    and might perform validation of their associated values. For example, the `ctype_alnum()`
    function could be used to simply confirm that the values only contain alphanumeric
    data.


    Once validated, the `setcookie()` function can store the submitted fields’ names
    and values. Additionally a hash conversion could be made of password values using
    the `md5()` function. On successful completion, the script can then relocate the
    browser to another page using the `header()` function to specify that page’s URL:


    ![image](Image00029.jpg)


    cookie_set.php


    ![image](Image00054.jpg) Begin a PHP script with a function to handle failed validation
    attempts


    ```php

    <?php


    function reject ( $entry )

    {

    echo “Invalid $entry <br>” ;

    echo ‘Please <a href=” cookie_form.html ”>Log In</a> ;

    exit() ;

    }

    ```


    ![image](Image00055.jpg) Next, add a conditional test block to set two cookies
    for valid data, or call the function to handle failed attempts


    ```php

    if( isset( $_POST[ ‘user’ ] ) )

    {

    $user = trim( $_POST[ ‘user’ ] ) ;

    if( !ctype_alnum( $user ) ) { reject( ‘User Name’ ) ; }

    if( isset( $_POST[ ‘pass’ ] ) )

    {

    $pass = trim( $_POST[ ‘pass’ ] ) ;

    if( !ctype_alnum( $pass ) ) { reject( ‘Password’ ) ; }

    else

    {

    setcookie( ‘user’ , $user , time()+ 3600 ) ;

    setcookie( ‘pass’ , md5( $pass ) , time()+ 3600 ) ;

    header( ‘Location: cookie_get.php ’ ) ;

    }

    }

    }

    else { header( ‘Location: cookie_form.html ’ ) ; }

    ?>

    ```


    ![image](Image00056.jpg) Save the document in your web server’s `/htdocs` directory
    as `cookie_set.php` then see overleaf how to retrieve the stored cookie data


    ![image](Image00006.jpg)


    The `ctype_alnum()` function returns true only if its argument contains alphanumeric
    characters.


    ![image](Image00005.jpg)


    Notice how the `time()` function is used here to get the current time, then one
    hour is added (in seconds) to set the cookie expiration time one hour ahead.


    ![image](Image00005.jpg)


    The final `else` statement will relocate to the HTML form page if the script URL
    is opened directly.


    ### Getting cookies


    Once cookies are set, they are automatically assigned to the special PHP `$_COOKIE`
    global array variable. A script can check for the presence of an individual cookie
    using the built-in PHP `isset()` function to seek a cookie of a specified name.
    When this confirms the cookie is indeed present, its value can usefully assigned
    to a regular script variable. This might be used to retrieve a stored username
    for output on a page. Where a sought cookie is absent, the script can offer an
    alternative to the user:


    ![image](Image00029.jpg)


    cookie_get.php


    ![image](Image00054.jpg) Begin a PHP script with a test to find a cookie and retrieve
    data for output upon success


    ```php

    <?php


    if( isset( $_COOKIE[ ‘user’ ] ) )

    {

    $user = $_COOKIE[ ‘user’ ] ;

    echo “<h1>Welcome $user !</h1><hr>” ;

    echo ‘<a href=” cookie_data.php ”>View Cookie</a>’ ;

    }

    ```


    ![image](Image00055.jpg) Next, add alternative output for when the cookie is absent


    ```php

    else

    {

    echo ‘Please <a href=” cookie_form.html ”>Log In</a>’ ;

    }

    ?>

    ```


    ![image](Image00056.jpg) Save the document in your web server’s `/htdocs` directory
    as `cookie_get.php`


    ![image](Image00057.jpg) Now open the HTML form `cookie_form.html` (created [here](#text00012.html_cookie)
    ) via HTTP and push the submit button to see the login attempt fail validation,
    so no cookies are set


    ![image](Image00180.jpg)


    ![image](Image00058.jpg) Click the hyperlink to return to the HTML form and enter
    a valid username, then push the submit button to see the login attempt fail validation
    again


    ![image](Image00181.jpg)


    ![image](Image00061.jpg) Return to the HTML form once more and enter a valid username
    and password to see validation succeed


    ![image](Image00182.jpg)


    ![image](Image00183.jpg)


    ![image](Image00184.jpg)


    ![image](Image00185.jpg) Return to the HTML form once more and enter a valid username
    and password to see validation succeed – use the `cookie_data.php` to see all
    data


    ![image](Image00055.jpg) The `$_COOKIE` global array variable stores cookie-related
    keys and values.


    ### Viewing cookie data


    Once cookies are set, they are automatically assigned to the special PHP `$_COOKIE`
    global array variable. A script can check for the presence of an individual cookie
    using the built-in PHP `isset()` function to seek a cookie of a specified name.
    When this confirms the cookie is indeed present, its value can usefully assigned
    to a regular script variable. This might be used to retrieve a stored username
    for output on a page. Where a sought cookie is absent, the script can offer an
    alternative to the user:


    ```php

    <?php

    if( count($_COOKIE) > 0 )

    {

    foreach($_COOKIE as $key => $value)

    {

    echo "<dt>$key</dt>";

    echo "<dd>$value</dd>";

    }

    echo "</dl>";

    }

    else

    {

    echo "No cookies found.";

    }

    ?>

    ```


    The `$_COOKIE` global array stores cookie-related keys and values. You can also
    use `var_dump()` to see all data.


    ### Submitting session data


    User data can be stored in cookies on the client computer only if the user chooses
    to allow cookies onto their system. Many users prefer to disallow cookies, however,
    to avoid tracking – but PHP provides a better alternative. With PHP, user data
    can be stored on the server using the special `$_SESSION` global array variable.
    In order for PHP sessions to work, each PHP page must call the built-in `session_start()`
    function at the top of the page – before any HTML tags! HTML form submissions
    to the server via the **POST** method assigns field data to the special PHP `$_POST`
    global array variable, and individual submission fields can be sought using the
    built-in PHP `isset()` function. When this confirms the field is present, its
    name and value can be stored in a session variable. This might be used to store
    a username and password details for use across a website, as an alternative to
    cookie storage.

