    \ ;\n}\n```\n\n![image](img/Image00069.jpg) 现在，添加一个 `switch` 语句来匹配字符值：\n\n```php\n\
    switch ( $letter )\n{\ncase ‘A’ : echo ‘Letter is A<br>’ ; break ;\ncase ‘B’ :\
    \ echo ‘Letter is B<br>’ ; break ;\ncase ‘C’ : echo ‘Letter is C<br>’ ; break\
    \ ;\ndefault : echo ‘Letter is Unrecognized<br>’ ;\n}\n```\n\n![image](img/Image00070.jpg)\
    \ 最后，添加一个语句，当测试表达式被判断为 `TRUE` 或 `FALSE` 时输出结果：\n\n```php\nif ( 4 > 8 )\n{\n echo\
    \ ‘4 is greater than 8 <br>’ ;\n}\nelse\n{\n echo ‘4 is less than 8 <br>’ ;\n\
    }\n```\n\n![image](img/Image00070.jpg) 最后，添加一个语句，当两个测试表达式之一被判断为 `TRUE` 或当两个测试表达式都被判断为\
    \ `FALSE` 时：\n\n```php\nif ( 4 > 8 )\n{\n echo ‘This test is True </p>’ ;\n}\n\
    elseif ( 8 > 4 )\n{\n echo ‘Alternative test is True </p>’ ;\n}\nelse\n{\n echo\
    \ ‘Both tests are False </p>’ ;\n}\n?>\n```\n\n![image](img/Image00072.jpg) 将文档保存到\
    \ Web 服务器的 `/htdocs` 目录并命名为 `else.php`，然后通过 HTTP 打开页面查看条件分支的显示结果。\n\n![image](img/Image00075.jpg)\n\
    \n![image](img/Image00006.jpg) 你可以嵌套条件 `if` 测试（在一个内部嵌套另一个），使得内部块中的语句只有在两个测试都被判断为\
    \ `TRUE` 时才会执行。\n\n## 切换分支\n\n当测试表达式仅评估一个条件时，通过多个 `if-elseif-else` 语句执行的条件分支通常可以通过\
    \ `switch` 语句更高效地完成。\n\n`switch` 语句的工作方式特殊。它接受一个给定的值作为参数参数，然后从多个 `case` 语句中匹配该值。找到匹配项时执行的代码包含在每个\
    \ `case` 语句中。\n\n重要的是每个 `case` 语句都应该以 `break` 关键字语句结束，这样 `switch` 语句在找到匹配项后就会退出，而不会继续寻找其他匹配项——除非这是刻意的要求。\n\
    \n可选地，`case` 语句列表后面可以跟一个单一的 `default` 语句，用于指定在任何 `case` 语句中都没有找到匹配项时执行的代码。因此，switch\
    \ 语句的语法通常如下：\n\n```php\nswitch ( test-value )\n{\ncase match-value : statements-to-execute-when-matched\
    \ ; break ;\ncase match-value : statements-to-execute-when-matched ; break ;\n\
    case match-value : statements-to-execute-when-matched ; break ;\ndefault : statements-to-execute-when-no-match-found\
    \ ;\n}\n```\n\n![image](img/Image00005.jpg)\n\n包含一个 `default` 语句总是好主意——即使它只是在\
    \ `switch` 语句失败时输出一条错误消息。\n\n一个 `switch` 语句可以有很多 `case` 语句，但它的两个 `case` 语句不能尝试匹配相同的值。\n\
    \n当多个 `match-values` 需要执行相同的语句时，仅最后的 `case` 语句需要包含要执行的语句和退出 `switch` 语句块的 `break`\
    \ 语句。例如，为匹配值为 0、1 和 2 输出相同的消息：\n\n```php\nswitch ( $number )\n{\ncase 0 :\ncase\
    \ 1 :\ncase 2 : echo ‘Less than 3’ ; break ;\ncase 3 : echo ‘Exactly 3’ ; break\
    \ ;\ndefault : echo ‘Greater than 3 or less than zero’ ;\n}\n```\n\n![image](img/Image00006.jpg)\n\
    \n`default` 语句不需要出现在 `switch` 块的末尾，但将其放在那里是有逻辑的，因为那里不需要 `break` 语句。\n\n![image](img/Image00029.jpg)\n\
    \nswitch.php\n\n![image](img/Image00067.jpg) 在 PHP 标签之间，使用初始化两个整数和字符变量语句开始脚本：\n\
    \n```php\n<?php\n$number = 2 ; $letter = ‘B’ ;\n```\n\n![image](img/Image00068.jpg)\
    \ 接下来，添加一个 `switch` 语句来匹配整数值：\n\n```php\nswitch ( $number )\n{\ncase 1 : echo\
    \ ‘Number is One<br>’ ; break ;\ncase 2 : echo ‘Number is Two<br>’ ; break ;\n\
    case 3 : echo ‘Number is Three<br>’ ; break ;\ndefault : echo ‘Number is Unrecognized<br>’\
    \ ;\n}\n```\n\n![image](img/Image00069.jpg) 现在，添加一个 `switch` 语句来匹配字符值：\n\n```php\n\
    switch ( $letter )\n{\ncase ‘A’ : echo ‘Letter is A<br>’ ; break ;\ncase ‘B’ :\
    \ echo ‘Letter is B<br>’ ; break ;\ncase ‘C’ : echo ‘Letter is C<br>’ ; break\
    \ ;\ndefault : echo ‘Letter is Unrecognized<br>’ ;\n}\n```\n\n![image](img/Image00070.jpg)\
    \ 最后，添加一个语句，当测试表达式被判断为 `TRUE` 或 `FALSE` 时输出结果：\n\n```php\nif ( 4 > 8 )\n{\n echo\
    \ ‘4 is greater than 8 <br>’ ;\n}\nelse\n{\n echo ‘4 is less than 8 <br> ;\n}\n\
    ```\n\n## 循环\n\n循环是一段重复执行的代码。循环的每次完整执行称为一次“迭代”。有四种类型的循环：\n\n- `for` 循环 – 执行指定次数的迭代\n\
    - `while` 循环 – 仅在开始时的测试为真时执行迭代\n- `do while` 循环 – 仅在结束时的测试为真时执行迭代\n- `foreach`\
    \ 循环 – 执行迭代以遍历数组的每个元素\n\n### for 循环\n\n`for` 循环用于你预先知道循环应该运行多少次。它具有如下语法：\n\n```php\n\
    for ( initializer ; test-expression ; updater )\n{\nstatement-to-execute\n}\n\
    ```\n\n初始化器用于为计数器（迭代次数）设置起始值。为此目的使用一个整数变量，传统命名为 `i`。\n\n在循环的每次迭代中，都会评估 `test-expression`，只要该表达式为\
    \ `TRUE`，该迭代就会继续。当 `test-expression` 变为 `FALSE` 时，循环立即结束而不再次执行语句。更新器可以是增加器，也可以是递减循环中的减少器。\n\
    \n循环可以嵌套，在一个内部嵌套另一个，以便在外部循环的每次迭代中完整执行一次内部循环。\n\n```php\nfor ( $i = 1; $i < 4;\
    \ $i++ )\n{\n    echo “<dt>Outer loop iteration $i ” ;\n    # 在此处插入嵌套循环\n}\n```\n\
    \n### while 循环\n\n`while` 循环用于你不一定知道循环应该运行多少次。它具有如下语法：\n\n```php\nwhile (test-expression)\n\
    {\nstatement-to-execute\n}\n```\n\n`test-expression` 在循环开始时评估，只有当该表达式为 `TRUE`\
    \ 时迭代才会继续。\n\n### do while 循环\n\n`do while` 循环与 `while` 循环相似，但测试是在循环结束进行的。它具有如下语法：\n\
    \n```php\ndo\n{\nstatement-to-execute\n} while (test-expression);\n```\n\n###\
    \ foreach 循环\n\n`foreach` 循环用于遍历数组的每个元素。它具有如下语法：\n\n```php\nforeach ($array as\
    \ $value)\n{\nstatement-to-execute\n}\n```\n\n"
- fmt: "\nA `while` loop is an alternative to the `for` loop described in the previous\
    \ example. The `while` loop also requires an initializer, test-expression, and\
    \ an updater, but these are not neatly listed within a single pair of parentheses\
    \ as they are in a `for` loop. Instead the initializer must appear before the\
    \ start of the loop block, and the test-expression must appear within parentheses\
    \ after the `while` keyword, followed by braces containing both an updater and\
    \ the statements to be executed on each iteration.\n\n```\ninitializer\nwhile\
    \ ( test-expression )\n{\n    statement/s-to-be-executed ;\n    updater ;\n}\n\
    ```\n![image](Image00019.jpg)\n\nEnsure that the test expression in a loop structure\
    \ will at some point become `FALSE` to avoid creating an infinite loop that never\
    \ ends.\n\nA `do while` loop provides a subtle variation on the syntax above by\
    \ placing the `do` keyword before the loop block and moving the `while` statement\
    \ to after the loop block:\n\n```\ninitializer\ndo {\n    statement/s-to-be-executed\
    \ ;\n    updater ;\n}\nwhile ( test-expression ) ;\n```\n\nBoth `while` loops\
    \ and `do while` loops will proceed to make iterations until the test-expression\
    \ is found to be `FALSE` , at which point the loop will exit. It is therefore\
    \ essential that the loop body contains code that will, at some point, change\
    \ the result of the test-expression evaluation – otherwise an infinite loop is\
    \ created which will lock the system. The significant difference between a `while`\
    \ loop and a `do while` loop is that a `while` loop will not make a single iteration\
    \ if the test-expression is `FALSE` on its first evaluation. In contrast, a `do\
    \ while` loop will always make at least one iteration because its statements are\
    \ executed before the evaluation is made. If this is desirable a `do while` loop\
    \ is obviously the best choice, otherwise the choice between a `for` loop and\
    \ a `while` loop is largely a matter of personal preference. One rule of thumb\
    \ suggests that a `for` loop is best used to perform a specific number of iterations,\
    \ whereas a `while` loop is best used to iterate until a certain condition is\
    \ met. Loops are the perfect partner to use with arrays as each iteration can\
    \ effortlessly read or write into successive array elements.\n\n![image](Image00005.jpg)\n\
    \nYou will discover later in this book how a PHP `while` loop is used to retrieve\
    \ records from a MySQL database.\n\n![image](Image00029.jpg)\n\nwhileloop.php\n\
    \n![image](Image00067.jpg) Between PHP tags, begin a script with a statement to\
    \ create an array\n\n```php\n<?php\n$numbers = array( 10 , 20 , 30 ) ;\n```\n\
    ![image](Image00068.jpg) Next, add a `while` loop to output the value of each\
    \ array element\n\n```php\necho '<dt>While Loop : ’ ;\n$i = 0 ;\nwhile ( $i <\
    \ 3 )\n{\n    echo “<dd>Element $i = $numbers[$i] ” ;\n    $i ++ ;\n}\n```\n![image](Image00069.jpg)\
    \ Now, add a `do while` loop to output the value of each array element\n\n```php\n\
    echo '<dt>Do While Loop : ’ ;\n$i = 0 ;\ndo\n{\n    echo “<dd>Element $i = $numbers[$i]\
    \ ” ;\n    $i ++ ;\n}\nwhile ( $i < 3 ) ;\n?>\n```\n![image](Image00070.jpg) Save\
    \ the document in your web server’s `/htdocs` directory as `whileloop.php` then\
    \ open the page via HTTP to see the array element values get identically displayed\n\
    \n![image](Image00079.jpg)\n\n![image](Image00006.jpg)\n\nChange the value in\
    \ this test expression to zero – so `while ( $i = 0 )` in both loops – to see\
    \ only the first iteration of the `do while` loop get executed.\n\n### Breaking\
    \ from loops\n\nThe `break` keyword can be used to prematurely terminate a loop\
    \ when a specified condition is met. The `break` statement is situated inside\
    \ the loop statement block and is preceded by a test expression. When the test\
    \ returns `TRUE`, the loop ends immediately and the program proceeds on to the\
    \ next task. For example, in a nested inner loop it proceeds to the next iteration\
    \ of the outer loop.\n\n![image](Image00029.jpg)\n\nbreakcontinue.php\n\n![image](Image00067.jpg)\
    \ Between PHP tags, begin a script with a `for` loop that performs three iterations\n\
    \n```php\n<?php\nfor ( $i = 1 ; $i < 4 ; $i ++ )\n{\n    # Nested loop to be inserted\
    \ here (step 2).\n}\n```\n![image](Image00068.jpg) Next, insert a nested `for`\
    \ loop that also performs three iterations\n\n```php\nfor ( $j = 1 ; $j < 4 ;\
    \ $j ++ )\n{\n    # Statements to be inserted here (steps 5 & 6).\n}\n?>\n```\n\
    ![image](Image00069.jpg) Now, insert a statement that outputs the value of both\
    \ loop counters on each iteration\n\n```php\necho “Running i = $i and j = $j <br>”\
    \ ;\n```\n![image](Image00070.jpg) Save the document in your web server’s `/htdocs`\
    \ directory as `breakcontinue.php` then open the page via HTTP to see both loop\
    \ counter values get displayed\n\n![image](Image00080.jpg)\n\n![image](Image00072.jpg)\
    \ Next, insert this `break` statement at the very beginning of the inner loop\
    \ block, to break out of the inner loop – then save the document and view the\
    \ change\n\n```php\nif ( $i == 2 && $j == 1 )\n{\n    echo “Breaks inner loop\
    \ when i = $i and j = $j <br>” ;\n    break ;\n}\n```\n![image](Image00081.jpg)\n\
    \n![image](Image00006.jpg)\n\nHere, the `break` statement halts all three iterations\
    \ of the inner loop when the outer loop tries to run it the second time.\n\nThe\
    \ `continue` keyword can be used to skip a single iteration of a loop when a specified\
    \ condition is met. The `continue` statement is situated inside the loop statement\
    \ block and is preceded by a test expression. When the test returns `TRUE`, the\
    \ loop ends immediately.\n\n![image](Image00082.jpg) Now, insert this `continue`\
    \ statement at the very beginning of the inner loop block, to break out of the\
    \ inner loop – then save the document and view the change\n\n```php\nif ( $i ==\
    \ 2 && $j == 1 )\n{\n    echo “Continues inner loop when i = $i and j = $j <br>”\
    \ ;\n    continue ;\n}\n```\n![image](Image00083.jpg)\n\n![image](Image00006.jpg)\n\
    \nHere, the `continue` statement just skips the first iteration of the inner loop\
    \ when the outer loop tries to run it the first time.\n\n### Summary\n\n- The\
    \ `if` keyword performs the basic conditional test that evaluates an expression\
    \ for a Boolean value of `TRUE` or `FALSE`\n- Statements within braces following\
    \ the evaluation will only be executed when `TRUE`\n- Multiple expressions can\
    \ be tested using the logical `&&` operator, or by nesting multiple `if` conditional\
    \ tests\n- The `else` keyword specifies statements to be executed when the expression\
    \ evaluated by the `if` statement is found `FALSE`\n- The `elseif` keyword is\
    \ used to append an alternative expression to be evaluated and statements to be\
    \ executed when `TRUE`\n- Multiple `if-elseif-else` statements can often be performed\
    \ more efficiently by a `switch` statement\n- The `case` keyword is used to specify\
    \ a value to be matched in a `switch` statement block\n- Each `case` statement\
    \ must end with a `break` keyword statement so the `switch` will exit when a match\
    \ found\n- A `default` statement specifies code to be executed in the event that\
    \ no matches are found within any `case` statements\n- A loop is a piece of code\
    \ in a script that automatically repeats until a test expression becomes `FALSE`\n\
    - The PHP loop structures are `for`, `while`, `do while` and `foreach`\n- A `for`\
    \ loop structure specifies an initializer, a test expression and an updater that\
    \ increments (or decrements) a counter\n- An updater must always be included in\
    \ the statement block of a `while` loop and a `do while` loop\n- Unlike a `while`\
    \ loop, a `do while` loop will always execute its statements at least once\n-\
    \ The `break` keyword can be used to prematurely terminate a loop when a specified\
    \ condition is met\n- The `continue` keyword can be used to skip a single iteration\
    \ of a loop when a specified condition is met\n\n### Employing functions\n"
