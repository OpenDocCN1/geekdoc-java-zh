    ![image](Image00058.jpg) Save the document in your web server’s `/htdocs` directory\
    \ as `logic.php` then open the page via HTTP to see the results get displayed\n\
    \n![image](Image00064.jpg)\n\n![image](Image00005.jpg)\n\nPHP also has an `XOR`\
    \ (exclusive `OR` ) operator that performs the equivalent evaluation of `AND NOT`\
    \ together.\n\n![image](Image00006.jpg)\n\nNotice that evaluation of `FALSE &&\
    \ FALSE` returns `FALSE` – maybe demonstrating the anecdote “two wrongs don’t\
    \ make a right”.\n\n## Comparing bits\n\nA byte comprises eight bits that can\
    \ each contain a `1` or a `0` to store a binary number, representing decimal values\
    \ from 0 to 255. Each bit contributes a decimal component only when that bit contains\
    \ a `1`. Components are designated right-to-left from the “Least Significant Bit”\
    \ (LSB) to the “Most Significant Bit” (MSB). The binary number in the bit pattern\
    \ below represents decimal 50.\n\n![image](Image00006.jpg)\n\nMany PHP programmers\
    \ never use bitwise operators, but it is useful to understand what they are and\
    \ how they may be used.\n\n| Bit No. | 8 MSB | 7 | 6 | 5 | 4 | 3 | 2 | 1 LSB |\n\
    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| Decimal |\
    \ 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |\n| Binary | 0 | 0 | 1 | 1 | 0 | 0 | 1 |\
    \ 0 |\n\nIt is possible to manipulate individual parts of a byte using “bitwise”\
    \ operators. Bitwise operators allow evaluation and manipulation of specific bits\
    \ within an integer.\n\n| Operator | Name | Binary number operation |\n| :---\
    \ | :--- | :--- |\n| `\\|` | OR | Return a `1` in each bit where either of two\
    \ compared bits is a `1` Example: `1010 \\| 0101 = 1111` |\n| `&` | AND | Return\
    \ a `1` in each bit where both of two compared bits is a `1` Example: `1010 &\
    \ 1100 = 1000` |\n| `~` | NOT | Return a `1` in each bit where neither of two\
    \ compared bits is a `1` Example: `1010 ~ 0011 = 0100` |\n| `^` | XOR | Return\
    \ a `1` in each bit where only one of two compared bits is a `1` Example: `1010\
    \ ^ 0100 = 1110` |\n| `<<` | Shift left | Move each bit that is a `1` a specified\
    \ number of bits to the left Example: `0010 << 2 = 1000` |\n| `>>` | Shift right\
    \ | Move each bit that is a `1` a specified number of bits to the right Example:\
    \ `1000 >> 2 = 0010` |\n\n![image](Image00005.jpg)\n\nEach half of a byte is known\
    \ as a “nibble” (4 bits). The binary numbers in the examples in the table describe\
    \ values stored in a nibble.\n\nUnless programming for a device with limited resources,\
    \ there is seldom a need to utilize bitwise operators, but they can be useful.\
    \ For instance, the `^` (eXclusive OR) operator lets you exchange values between\
    \ two variables without the need for a third variable:\n\n![image](Image00029.jpg)\n\
    \nbitwise.php\n\n![image](Image00054.jpg) Create a valid HTML document, like the\
    \ one listed [here](#text00003.html_sec5) , then insert PHP tags into the body\
    \ section\n\n```php\n<?php\n# Statements to be inserted here.\n?>\n```\n\n![image](Image00055.jpg)\
    \ Now, insert between the PHP tags statements to create and initialize two variables\
    \ with integer values\n\n```php\n$x = 5 ; $y = 10 ;\n```\n\n![image](Image00056.jpg)\
    \ Next, add a statement to display the assigned values\n\n```php\necho “X : $x\
    \ , Y : $y <br>” ;\n```\n\n![image](Image00057.jpg) Insert three XOR statements\
    \ to exchange the variable values by binary bit manipulation\n\n```php\n$x = $x\
    \ ^ $y ; /* 1010 ^ 0101 = 1111 (decimal 15) */\n$y = $x ^ $y ; /* 1111 ^ 0101\
