    ```php

    echo ‘&deg; ‘ . $xml->temperature[ ‘unit’ ] ;

    echo ‘<li>Wind : ‘ . $xml->wind->speed[ ‘name’ ] ;

    echo ‘<li>Humidity : ‘ . $xml->humidity[‘value’] . ’&#37;</ul>’ ;

    ```


    ![image](Image00005.jpg)


    Notice that a default city value is assigned in case the form is submitted without
    user input.


    ![image](Image00005.jpg)


    The value of the `icon` attribute is the name of a PNG image file. When concatenated
    to the path and `.png` file extension, it provides an appropriate weather image.


    ![image](Image00096.jpg) After the test block, add statements to create a form


    ```php

    echo ‘<form method=”POST ” action=”weather.php ”>’ ;

    echo ‘<fieldset><legend>Enter City Name</legend>’ ;

    echo ‘ <input type=”text” name=”city”’ ;

    echo ‘<input type=”submit” name=”submission” value = ”Get Weather”>’ ;

    echo ‘</fieldset></form>’ ;

    ```


    ![image](Image00228.jpg) Finally, in the script, load a page footer file to display
    icons denoting the technologies employed by this app


    ```php

    include( ‘includes/weather-footer.html’ ) ;

    ```


    ![image](Image00229.jpg) Save the PHP script in your web server’s `/htdocs` directory
    as `weather.php` then open the page via HTTP and submit the form to see weather
    for the default New York location. Enter another city name and re-submit to see
    that weather report


    ![image](Image00230.jpg)


    ![image](Image00231.jpg)


    ![image](Image00006.jpg)


    The `action` attribute specifies this same script filename to make the form sticky.


    ## Summary


    - XML elements must each have an opening and closing tag and be correctly nested
    to be well-formed

    - PHP has an XML parser called `SimpleXML` that can load an XML document into
    memory as a hierarchical tree structure

    - The `simplexml_load_file()` function creates a data structure of `SimpleXMLElement`
    objects

    - The data structure of a `SimpleXML` object describes a parent-child relationship
    between outer and inner XML elements

    - Each member of a `SimpleXML` data structure is a node

    - Top-level nodes are direct child descendants of the `SimpleXML` object itself

    - Nodes can be referenced using the `->` object operator to address each generation
    of the hierarchical tree structure

    - The `children()` method returns all child nodes and can be used to loop through
    tree nodes to retrieve each node’s content

    - Attributes can be referenced by stating the attribute name, within quotes, between
    brackets following the node name

    - RSS feeds deliver regularly updated data in XML format

    - RSS is a dialect of XML in which all documents must have a top-level `<rss>`
    element containing a `<channel>` element

    - Web Services may provide a static URL or an API that allows you to specify parameters
    in the URL request

    - Parameter values are specified by an `=` character and are appended to a URL
    after a `?` and are separated by `&`

    - A `SimpleXML` object can be written as an XML file on the server using the `asXml()`
    function

    - Selected components of a `SimpleXML` object can be dynamically incorporated
    into a PHP application


    ![image](Image00232.jpg)


    ![image](Image00233.jpg)


    ![image](Image00234.jpg)

