  trans: "\n\nPHP 提供了一个名为“SimpleXML”的 XML 解析器，它可以将 XML 文档加载到内存中作为层级树结构。`simplexml_load_file()`\
    \ 函数需要 XML 文件的名称和路径，以将文档转换为包含 `SimpleXMLElement` 对象的数据结构。然后可以使用 `var_dump()` 函数来遍历该数据结构。\n\
    \n![image](img/Image00029.jpg)\n\ncatalog.php\n\n![image](img/Image00085.jpg)\
    \  用一个语句开始 PHP 脚本，设置页面标题并保留文本格式\n\n```php\n<?php\necho ‘<title>PHP SimpleXML</title><pre>\
    \ ;\n```\n\n![image](img/Image00086.jpg)  接下来，添加一个语句来加载 XML 数据或退出\n\n```php\n\
    $xml = simplexml_load_file( ‘catalog.xml’ )\nor die( ‘Unable to load data!’ )\
    \ ;\n```\n\n![image](img/Image00087.jpg)  现在，显示所有的 SimpleXMLElement 对象\n\n```php\n\
    var_dump( $xml ) ;\n```\n\n![image](img/Image00088.jpg)  将文档保存到 Web 服务器的 `/htdocs`\
    \ 目录并命名为 `catalog.php`，与 `catalog.xml` 文件放在一起，然后通过 HTTP 打开该页面以查看 SimpleXMLElement\
    \ 对象\n\n![image](img/Image00216.jpg)\n\n![image](img/Image00005.jpg)\n\n注意，此数据结构描述了一个名为“book”的数组，它有五个数组元素——对应五个\
    \ XML `<book>` 元素。\n\n![image](img/Image00006.jpg)\n\nXML 的无处不在使其成为跨互联网传输数据的理想选择。\n\
    \n## 获取节点\n\nSimpleXML 对象包含的数据结构描述了外部和内部 XML 元素之间的父子关系。数据结构中的每个成员被称为“节点”（node）。顶层节点是\
    \ SimpleXML 对象本身的直接子后代，因此可以使用对象名、`->` 对象操作符和子节点名称来引用。例如，`$object->child`。子节点的子（孙子节点）可以通过进一步添加一个\
    \ `->` 对象操作符和孙子节点名称来引用，例如 `$object->child->grandchild`，每一代都以此类推：\n\n![image](img/Image00029.jpg)\n\
    \nnodes.php\n\n![image](img/Image00085.jpg)  用一个语句开始 PHP 脚本，设置页面标题\n\n```php\n\
    <?php\necho ‘<title>PHP SimpleXML</title>’ ;\n```\n\n![image](img/Image00086.jpg)\
    \  添加一个语句来加载 XML 数据或退出\n\n```php\n$xml = simplexml_load_file( ‘catalog.xml’ )\n\
    or die( ‘Unable to load data!’ ) ;\n```\n\n![image](img/Image00087.jpg)  接下来，获取作为第一个“book”元素子节点的“title”元素的内容\n\
    \n```php\necho ‘First book : ‘ .\n$xml -> book[0] -> title . ’ in easy steps<br>\
    \ ;\n```\n\n![image](img/Image00088.jpg)  现在，获取作为第一个“book”元素子节点的“category”元素的内容\n\
    \n```php\necho ‘Language category : ‘ . $xml -> book[0] -> category ;\n```\n\n\
    ![image](img/Image00089.jpg)  将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `nodes.php`，与 `catalog.xml`\
    \ 文件放在一起，然后通过 HTTP 打开该页面以查看节点内容\n\n![image](img/Image00217.jpg)\n\n![image](img/Image00005.jpg)\n\
    \n由于在同一层级上有五个“book”节点，在例例中它们被创建为一个数组。因此，每个节点都可以使用其节点名称和数组索引号单独进行引用。\n\n## 遍历节点\n\
    \nSimpleXML 对象提供了方法来处理包含在其数据结构中的数据。有用的是，它的 `children()` 方法返回所有子节点，并用于遍历节点以检索每个节点的内容：\n\
    \n![image](img/Image00029.jpg)\n\nnodes-loop.php\n\n![image](img/Image00085.jpg)\
    \  用一个语句开始 PHP 脚本，设置页面标题\n\n```php\n<?php\necho ‘<title>PHP SimpleXML</title>’\
    \ ;\n```\n\n![image](img/Image00086.jpg)  添加一个语句来加载 XML 数据或退出\n\n```php\n$xml\
    \ = simplexml_load_file( ‘catalog.xml’ )\nor die( ‘Unable to load data!’ ) ;\n\
    ```\n\n![image](img/Image00087.jpg)  接下来，初始化迭代计数器为零\n\n```php\n$counter = 0 ;\n\
    ```\n\n![image](img/Image00088.jpg)  现在，添加一个循环来增加计数器并显示所有“title”和“category”子节点的内容\n\
    \n```php\nforeach( $xml ->children() as $book )\n{\n    $counter ++ ;\n    echo\
    \ ‘Book ‘ . $counter . ’ : ‘ ;\n    echo $book -> title . ’ in easy steps [’ .\
    \ $book -> category . ’]<hr> ;\n}\n```\n\n![image](img/Image00089.jpg)  将文档保存到\
    \ Web 服务器的 `/htdocs` 目录并命名为 `nodes-loop.php`，与 `catalog.xml` 文件放在一起，然后通过 HTTP\
    \ 打开该页面以查看节点内容\n\n![image](img/Image00216.jpg)\n\n![image](img/Image00005.jpg)\n\
    \n## 获取属性\n\n`SimpleXMLElement` 内部的值可以通过在节点名称后加上引号内的属性名来引用。例如，`$object['feature']`。\n\
    \n![image](img/Image00029.jpg)\n\nattribs.php\n\n![image](img/Image00085.jpg)\
    \  用一个语句开始 PHP 脚本，设置页面标题\n\n```php\n<?php\necho ‘<title>PHP SimpleXML</title>\
    \ ;\n```\n\n![image](img/Image00086.jpg)  添加一个语句来加载 XML 数据或退出\n\n```php\n$xml\
    \ = simplexml_load_file( ‘catalog.xml’ )\nor die( ‘Unable to load data!’ ) ;\n\
    ```\n\n![image](img/Image00087.jpg)  接下来，获取作为第一个“book”元素子节点的“title”元素的内容\n\n```php\n\
    echo ‘First book : ‘ .\n$xml -> book[0] -> title . ’ in easy steps<br> ;\n```\n\
    \n![image](img/Image00088.jpg)  现在，获取作为第一个“book”元素子节点的“category”元素的内容\n\n```php\n\
    echo ‘Cover : ‘ .\n$xml -> book[0] -> title['cover'] . ’> ;\n```\n\n![image](img/Image00089.jpg)\
    \  使用上一步获取的值来显示图片\n\n![image](img/Image00216.jpg)\n\n![image](img/Image00006.jpg)\n\
    \n注意这里的每个属性都是 `images/` 目录下的图片文件名。\n\n## 遍历属性\n\nSimpleXML 对象的 `children()` 方法可以再次用于遍历节点并在每次迭代中获取节点的值：\n\
    \n![image](img/Image00029.jpg)\n\nattribs-loop.php\n\n![image](img/Image00085.jpg)\
    \  用一个语句开始 PHP 脚本，设置页面标题\n\n```php\n<?php\necho ‘<title>PHP SimpleXML</title>\
    \ ;\n```\n\n![image](img/Image00086.jpg)  添加一个语句来加载 XML 数据或退出\n\n```php\n$xml\
    \ = simplexml_load_file( ‘catalog.xml’ )\nor die( ‘Unable to load data!’ ) ;\n\
    ```\n\n![image](img/Image00087.jpg)  接下来，初始化迭代计数器为零\n\n```php\n$counter = 0 ;\n\
    ```\n\n![image](img/Image00088.jpg)  现在，添加一个循环来增加计数器并显示其值，然后在每次迭代中获取一个属性值以显示图片\n\
    \n```php\nforeach( $xml ->children() as $book )\n{\n    $counter ++ ;\n    echo\
    \ ‘ ‘ . $counter . ‘: ‘ ;\n    echo ‘<img src=” . $book -> title['cover'] . ’>’\
    \ ;\n}\n```\n\n![image](img/Image00089.jpg)  将文档保存到 Web 服务器的 `/htdocs` 目录并命名为\
    \ `attribs-loop.php`，与 `catalog.xml` 文件放在一起，然后通过 HTTP 打开该页面以查看每次迭代中显示的计数器和图片\n\
    \n![image](img/Image00220.jpg)\n\n![image](img/Image00005.jpg)\n\n**包含订阅**\n\n\
    SimpleXMLElement 对象还提供了一个 `attributes()` 方法，可以返回元素内所有属性名称和值的关联数组。例如，`$obj->child->attributes()`。\n\
    \n"
- fmt: "\nWith the ability to access data from XML documents within PHP scripts, as\
    \ described on the previous pages, we can easily incorporate data from external\
    \ sources. Many Web Services are offered as freely available RSS (Rich Site Summary/Really\
    \ Simple Syndication) feeds. An online search for “rss feed directory” will provide\
    \ a number of websites where links to free feeds are categorized. RSS feeds deliver\
    \ regularly updated data in XML format.\n\n![image](Image00221.jpg)\n\nYou can\
    \ discover more about RSS online at **[rssboard.org](http://www.rssboard.org)**\
    \ and can enter the URL of any RSS feed into their validator to see its XML elements.\n\
    \nThe Yahoo! Developer Network (YDN) offer lots of free RSS feeds with helpful\
    \ information at **[real.developer.yahoo.com/rss](http://real.developer.yahoo.com/rss)**.\n\
    \nThe only requirement for their use is that you must include an attribution to\
    \ Yahoo! on the web page where they are displayed.\n\nOne of the free RSS feeds\
    \ offered by Yahoo! provides regularly updated content describing entertainment\
    \ news items, and can be found at **[http://news.yahoo.com/rss/entertainment](http://news.yahoo.com/rss/entertainment)**.\n\
    \nThis is delivered to the web browser as an XML file and can be displayed by\
    \ the browser with buttons added to the outer elements, which you can click to\
    \ expand (+) or collapse (-) nested elements.\n\nRSS is a dialect of XML in which\
    \ all documents must have a top-level `<rss>` element containing a `<channel>`\
    \ element. Data is enclosed within inner elements:\n\n![image](Image00222.jpg)\n\
    \n![image](Image00223.jpg)\n\nThe tags highlighted here can be used to retrieve\
    \ the data of most interest. The item tags shown collapsed each also contain title,\
    \ description, link and “pubDate” elements describing each item.\n\n![image](Image00029.jpg)\n\
    \n### rss.php\n\n![image](Image00085.jpg) Begin a PHP script with a statement\
    \ to load XML data from the RSS feed or quit\n\n```php\n<?php\n$url = ‘http://rss.news.yahoo.com/rss/entertainment’\
    \ ;\n$xml = simplexml_load_file( $url ) or die( ‘Unable to load data!’ ) ;\n```\n\
    \n![image](Image00086.jpg) Next, add a statement to load a page header file\n\n\
    ```php\ninclude( ‘includes/rss-header.html’ ) ;\n```\n\n![image](Image00087.jpg)\
    \ Now, display each news item, then a page footer\n\n```php\nforeach ( $xml ->\
    \ channel -> item as $item ) {\n    echo ‘<a href=”’ . $item -> link . ’”>’ .\
    \ $item -> title . ’</a>’ ;\n    echo ‘<br><small>’ . $item -> pubDate . ’</small><br>’\
    \ ;\n    echo $item -> description . ‘<hr>’ ; \n}\ninclude( ‘includes/rss-footer.html’\
    \ ) ;\n```\n\n![image](Image00088.jpg) Save the document in your web server’s\
    \ `/htdocs` directory as `rss.php` then open the page via HTTP to see the news\n\
    \n![image](Image00224.jpg)\n\n![image](Image00006.jpg)\n\nThe terms of use for\
    \ Yahoo! RSS feeds require you to display an attribution on your page.\n\n###\
    \ Setting parameters\n\nSome Web Services provide a static URL, like the Yahoo!\
    \ RSS feed in the previous example, that simply delivers XML data pre-determined\
    \ by the content supplier. Other Web Services provide a more flexible API (Application\
    \ Programming Interface) that allows you to specify parameters in the URL request\
    \ to determine what data you will receive, and in which format.\n\n![image](Image00225.jpg)\n\
    \nDiscover more about OpenWeatherMap at [**openweathermap.org**](http://www.openweathermap.org)\
    \ and sign up to receive your own ID key.\n\nOpenWeatherMap has a free Current\
    \ Weather Data API that can be found at **[http://api.openweathermap.org/data/2.5/weather](http://api.openweathermap.org/data/2.5/weather)**.\n\
    \nThe Current Weather Data API allows you to request weather data in many forms.\
    \ The parameters provided by this API include:\n\n- `q` = city name (or city name,\
    \ country code)\n- `units` = metric (celsius), imperial (fahrenheit), or standard\
    \ (kelvin, the default) temperature scale\n- `mode` = xml, html, or json (the\
    \ default) format\n- `appid` = required authorization key, supplied free upon\
    \ registration at OpenWeatherMap\n\nThe parameters and required `=` values are\
    \ appended to the OpenWeatherMap URL after a `?` and are separated by `&` .\n\n\
    The response from OpenWeatherMap can be delivered as an XML file that may be written\
    \ into the web server’s `/htdocs` folder using the PHP `asXml()` function to specify\
    \ a filename. This can be examined in the web browser to discover the nature of\
    \ the data retrieved, the XML element names, attribute names and structure:\n\n\
    ![image](Image00029.jpg)\n\n### params.php\n\n![image](Image00085.jpg) Begin a\
    \ PHP script by assigning string values to four variables, which will be used\
    \ to set response parameters\n\n```php\n<?php\n$city = ‘New York’ ;\n$units =\
    \ ‘imperial’ ;\n$mode = ‘xml’ ;\n$id = ‘28df3c64f387cf55026e0de3fb8beaa4’ ;\n\
    ```\n\n![image](Image00086.jpg) Next, add a statement to build a request string\
    \ using parameter values\n\n```php\n$request = ‘http://api.openweathermap.org/data/2.5/weather?’\
    \ .\n‘q=’ . $city . ’&units=’ . $units . ’&mode=’ . $mode . ’&APPID=’ . $id ;\n\
    ```\n\n![image](Image00087.jpg) Now, add a statement to load XML data using the\
    \ parameters, or quit\n\n```php\n$xml = simplexml_load_file( $request ) or die(\
    \ ‘Unable to load data!’ ) ;\n```\n\n![image](Image00215) When a response is received,\
    \ attempt to write the content as an XML file in the web server’s `/htdocs` directory\n\
    \n```php\ntry {\n    $xml->asXml( ‘params.xml’ );\n    // step 5.\n} catch( Exception\
    \ $e ) {\n    echo ‘Error : ‘ . $e->getMessage() ;\n}\n```\n\n![image](Image0089.jpg)\
    \ Insert a statement to relocate the browser to the newly created XML document\n\
    \n```php\nheader( ‘Location: params.xml’ ) ;\n```\n\n![image](Image00226.jpg)\
    \ The response will only contain weather data.\n\n![image](Image0027.jpg) The\
    \ data highlighted here is of most interest.\n\n### Selecting components\n\nHaving\
    \ examined the response data from OpenWeatherMap on the previous page, selected\
    \ components can be dynamically incorporated into a PHP App:\n\n![image](Image0029.jpg)\n\
    \n### weather.php\n\n![image](Image0085.jpg) Begin a PHP script by loading a page\
    \ header file\n\n```php\n<?php\ninclude( ‘includes/weather-header.html’ ;\n```\n\
    \n![image](Image0086.jpg) Next, add a conditional test to see if the page has\
    \ been opened by form submission\n\n```php\nif( $_SERVER['REQUEST_METHOD'] ==\
    \ ‘POST’ ) {\n    // steps 3-6.\n}\n```\n\n![image](Image0087.jpg) Inside the\
    \ conditional test block, assign parameter string values to four variables\n\n\
    ```php\n$city = ( empty( $_POST['city'] ) ) ? ”New York” : $_POST['city'] ;\n\
    $units = ‘imperial’ ;\n$mode = ‘xml’ ;\n$id = ‘28df3c64f387cf55026e0de3fb8beaa4’\
    \ ;\n```\n\n![image](Image0088.jpg) Next, inside the conditional test block, insert\
    \ a statement to build a request string using parameter values\n\n```php\n$request\
    \ = ‘http://api.openweathermap.org/data/2.5/weather?’ .\n‘q=’ . $city . ’&units=’\
    \ . $units . ’&mode=’ . $mode . ’&APPID=’ . $id ;\n```\n\n![image](Image0089.jpg)\
    \ Now, inside the conditional test block, insert a statement to load XML data\
    \ using the parameters, or quit\n\n```php\n$xml = simplexml_load_file( $request\
    \ ) or die( ‘Unable to load data!’ ) ;\n```\n\n![image](Image0091.jpg) Finally,\
    \ insert statements to output retrieved data\n\n```php\n$icon = ‘ http://openweathermap.org/img/w/’\
    \ .\n$xml->weather['icon'] . ’.png’ ;\necho ‘<h1>Today in ‘ . $xml->city['name']\
    \ .\n’ it\\’s <img src=’ . $icon . ’></h1>’ ;\necho ‘<ul><li>Temperature : ‘ .\
    \ $xml->temperature['value'] ;\n```\n"
