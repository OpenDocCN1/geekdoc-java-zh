    \ can be made of a password value using the `md5()` function for encryption\n\
    - The PHP `header()` function can specify a `Location:URL` to relocate the browser\n\
    - Once cookies are set, they are automatically assigned to the special PHP `$_COOKIE`\
    \ global array variable\n- User data can be stored on the server in the PHP `$_SESSION`\
    \ global array variable as an alternative to cookie storage\n- To use sessions,\
    \ each PHP page must call the `session_start()` function at the top of the page\
    \ before any HTML tags\n- HTML field data submitted to the `$_POST` global array\
    \ can be assigned to a `$_SESSION` global variable array element\n- The `ctype_alpha()`\
    \ function can be used to confirm a value only contains alphabetic letter data\
