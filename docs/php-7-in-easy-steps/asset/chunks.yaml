    The creation and use of PHP filestream resources are demonstrated fully in [Chapter
    8](#text00010.html).


    ![image](Image00005.jpg)


    The Boolean constants `TRUE` and `FALSE` are not case-sensitive, so may be written
    as `true` and `false`.


    ### Defining constants


    Fixed data values that will never change in a script should be stored in a PHP
    “constant”, rather than in a variable. A constant is a named container in which
    numeric or string values can be stored and can be referenced using the constant’s
    name.


    Unlike a variable, a constant cannot contain Boolean values of `TRUE` or `FALSE`,
    nor represent an object, nor a `NULL` empty value. Additionally, a constant cannot
    be changed as the script proceeds. This safeguards the constant value from accidental
    alteration and is good programming practice.


    ![image](Image00005.jpg)


    When creating a variable, always consider whether its value will ever change –
    if it will not you should create a constant instead. For example, `define( ‘PI’
    , 3.14 ) ;`.


    Constant names are subject to the same naming conventions as variables, but it
    is traditional to use uppercase characters for constant names – to easily distinguish
    them from variable names. Constants are created using a `define()` function to
    specify the constant’s name and the value it will contain, like this:


    `define( ‘NAME’ , value ) ;`


    Most significantly, constant names are not prefixed by a $ dollar sign, so they
    cannot be included in mixed strings for display – as PHP cannot distinguish a
    constant name from a regular capitalized string. Consider these statements for
    example:


    `define( ‘USER’ , ‘Mike’ ) ;`


    `echo “Hello USER”`


    ...the output here is `Hello USER`, not `Hello Mike` as desired.


    In order to include a constant’s value in an output string it must be referenced
    separately and “concatenated” to the string with the PHP . concatenation operator,
    like this:


    `echo ‘Hello ‘ . USER ;`


    ...the output here is now `Hello Mike` as desired.


    Array constants, in which all elements contain fixed data values, can also be
    created using the `define()` function like this:


    `define( ‘WEEKDAYS’ , [ ‘Mon’, ‘Tue’ , ‘Wed’ , ‘Thu’ , ‘Fri’ ] ) ;`


    ![image](Image00003.jpg)


    The ability to create constant arrays with the `define()` function is new in PHP
    7.


    Constants defined by the script author can be used just like the predefined constants
    that are built into PHP, such as `PHP_VERSION` and `PHP_OS` that describe the
    version and server operating system.


    ![image](Image00029.jpg)


    constant.php


    ![image](Image00036.jpg)  Create a valid HTML document, like the one listed [here](#text00003.html_sec5)
    , then insert PHP tags into the body section


    ```php

    <?php

    # Statements to be inserted here.

    ?>

    ```


    ![image](Image00037.jpg)  Now, insert between the PHP tags a statement to create
    and initialize a constant


    `define( ‘USER’ , ‘Mike’ ) ;`


    ![image](Image00038.jpg)  Add a statement to create and initialize an array constant


    `define( ‘PETS’ , [ ‘Kitten’ , ‘Puppy’ , ‘Hamster’ ] ) ;`


    ![image](Image00039.jpg)  Next, insert a statement to display two constant values
    in a concatenated string


    `echo ‘<p>Hello ‘ . USER . ‘ how is your ‘ . PETS[1] . ‘?</p>’ ;`


    ![image](Image00040.jpg)  Insert a statement to display the predefined constant
    value of the PHP version in a concatenated string


    `echo ‘<p>You are using PHP version ‘ . PHP_VERSION ;`


    ![image](Image00041.jpg)  Finally, insert a statement to display the predefined
    constant value of the host operating system in a string


    `echo ‘ running on ‘ . PHP_OS . ‘</p>’ ;`


    ![image](Image00042.jpg)  Save the document in your web server’s `/htdocs` directory
    as `constant.php` then open the page via HTTP to see the results get displayed


    ![image](Image00051.jpg)


    ![image](Image00019.jpg)


    You cannot include constants in mixed strings, or change their value, or begin
    their name with a dollar sign.


    ![image](Image00006.jpg)


    You should always use uppercase for constant names to easily differentiate them
    from variables in your code.


    ### Exploring superglobals


    PHP provides several pre-defined variables that are always globally available
    anywhere within any script. These are aptly known as “superglobals” and are described
    briefly here:


    *   `$GLOBALS` – an associative array containing references to all variables which
    are currently defined in the global scope of the script, according to context.
    The variable names are the keys of this associative array. For example:


    ```php

    foreach( $GLOBALS as $key => $var) echo “• $key “

    ```


    ![image](Image00052.jpg)


    *   `$_SERVER` – an array containing information such as headers, paths and script
    locations, that is arbitrarily provided by the web server

    *   `$_GET` – an associative array of variables passed to the script by appended
    URL parameters

    *   `$_POST` – an associative array of variables passed to the script

    *   `$_FILES` – an associative array of uploaded items

    *   `$_COOKIE` – an associative array of cookies passed via HTTP

    *   `$_SESSION` – an associative array of variables available to each script own*   `$_REQUEST`
    – an associative array that default contains `$_GET`, `$_POST` and `$_COOKIE`

    *   `$_ENV` – an associative array of environment variables


    The `$_FILES` superglobal is used by the example [here](#text00011.html).


    The `$_POST` superglobal is used by the example [here](#text00011.html).


    The `$_COOKIE` superglobal is used by the example [here](#text00012.html).


    The `$_SESSION` superglobal is used by the example [here](#text00012.html).


    The HTTP **GET** method is used by the example [here](#text00014.html).


    **Summary**

