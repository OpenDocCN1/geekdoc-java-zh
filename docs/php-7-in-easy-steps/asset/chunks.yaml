    **$counter = 0 ;**


    ![image](Image00088.jpg)  Now, add a loop to increment the counter and to display
    all “title” and “category” child node content


    **foreach( $xml ->children() as $book )**


    **{**


    **$counter ++ ;**


    **echo ‘Book ‘ . $counter . ’ : ‘ ;**


    **echo $book -> title .**


    **’ in easy steps [’ . $book -> category . ’]<hr>’ ;**


    **}**


    ![image](Image00089.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **nodes-loop.php**  , alongside the  **catalog.xml**  file, then open the
    page via HTTP to see all node content


    ![image](Image00218.jpg)


    ![image](Image00005.jpg)


    Nested **foreach** loops can be used to traverse child nodes of each descendant
    generation.


    **Getting attributes**


    Values contained within attributes of a SimpleXMLElement object can be referenced
    by stating the attribute name, within quotes, between brackets following the node
    name. For example, **$object->child[ ‘feature’ ]** accesses the value within an
    attribute named “feature” of a top-level “child” element:


    ![image](Image00029.jpg)


    attribs.php


    ![image](Image00085.jpg)  Begin a PHP script with a statement to set a page title


    **<?php**


    **echo ‘<title>PHP SimpleXML</title>’ ;**


    ![image](Image00086.jpg)  Add a statement to load the XML data or quit


    **$xml = simplexml_load_file( ‘catalog.xml’ )**


    **or die( ‘Unable to load data!’ ) ;**


    ![image](Image00087.jpg)  Next, retrieve the content of the “title” element that
    is a child of the first “book” element


    **echo ‘First book : ‘ .**


    **$xml -> book[0] -> title . ’ in easy steps<br>’ ;**


    ![image](Image00088.jpg)  Now, display the value of the “cover” attribute of the
    “title” element, that is a child of the first “book” element


    **echo ‘Cover : ‘ . $xml -> book[0] -> title[‘cover’] . ’<br>’ ;**


    ![image](Image00089.jpg)  Use the value retrieved in the previous step to display
    a cover image for the first “book” element


    **echo ‘<img src=”’ . $xml -> book[0] -> title[‘cover’] . ’”>’ ;**


    ![image](Image00091.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **nodes.php**  , alongside the  **catalog.xml**  file, then open the page
    via HTTP to see the attribute value and image


    ![image](Image00219.jpg)


    ![image](Image00006.jpg)


    Notice that each attribute value here is the path and filename to an image in
    a directory at **/htdocs/images** .


    **Looping through attributes**


    The SimpleXML object **children()** method can once again be used to loop through
    nodes and retrieve the value in a specified attribute of a particular node on
    each iteration:


    ![image](Image00029.jpg)


    attribs-loop.php


    ![image](Image00085.jpg)  Begin a PHP script with a statement to set a page title


    **<?php**


    **echo ‘<title>PHP SimpleXML</title>’ ;**


    ![image](Image00086.jpg)  Add a statement to load the XML data or quit


    **$xml = simplexml_load_file( ‘catalog.xml’ )**


    **or die( ‘Unable to load data!’ ) ;**


    ![image](Image00087.jpg)  Next, initialize an iteration counter at zero


    **$counter = 0 ;**


    ![image](Image00088.jpg)  Now, add a loop to increment the counter and to display
    its value, then retrieve an attribute value on each iteration to display an image


    **foreach( $xml ->children() as $book )**


    **{**


    **$counter ++ ;**


    **echo ‘ ‘ . $counter . ’: ‘ ;**


    **echo ‘<img src=”’ . $book -> title[‘cover’] . ’”>’ ;**


    **}**


    ![image](Image00089.jpg)  Save the document in your web server’s **/htdocs** directory
    as  **attribs-loop.php**  , alongside the  **catalog.xml**  file, then open the
    page via HTTP to see the counter and image displayed on each iteration of the
    loop


    ![image](Image00220.jpg)


    ![image](Image00005.jpg)


    A SimpleXMLElement object also provides an **attributes()** method that returns
    an associative array of all attribute names and values within an element. For
    example, **$obj->child->attributes()**


    **Including feeds**'
