  trans: "\n\n`while` 循环是上一个示例中 `for` 循环的替代方案。`while` 循环同样需要一个初始化器、测试表达式和一个更新器，但它们不像\
    \ `for` 循环那样在一个对括号内被整齐地列出。相反，初始化器必须出现在循环块开始之前，而测试表达式必须出现在 `while` 关键字后的括号内，随后紧跟一个包含更新器和每次迭代时要执行的语句的大括号。\n\
    \n```\ninitializer\nwhile ( test-expression )\n{\n    statement/s-to-be-executed\
    \ ;\n    updater ;\n}\n```\n![image](img/Image00019.jpg)\n\n确保循环结构中的测试表达式在某个时刻会变为\
    \ `FALSE`，以避免创建永不结束的无限循环。\n\n`do while` 循环通过将 `do` 关键字置于循环块之前并将 `while` 语句移动到循环块之后，提供了上述语法的一种细微的变体：\n\
    \n```\ninitializer\ndo {\n    statement/s-to-be-executed ;\n    updater ;\n}\n\
    while ( test-expression ) ;\n```\n\n`while` 循环和 `do while` 循环都会继续迭代，直到发现测试表达式为\
    \ `FALSE`，此时循环将退出。因此，循环体中包含会在某个时刻更改测试表达式评估结果的代码是非常关重要的——否则将创建一个导致系统锁定的无限循环。`while`\
    \ 循环和 `do while` 循环之间的显著区别是，如果测试表达式在第一次评估时为 `FALSE`，则 `while` 循环不会执行任何迭代。相比之下，`do\
    \ while` 循环始终至少执行一次迭代，因为它的语句是在进行评估之前执行的。如果这是所需要的，那么 `do while` 循环显然是最佳选择，否则在 `for`\
    \ 循环和 `while` 循环之间的选择很大程度上取决于个人喜好。一条经验建议是 `for` 循环最适合执行特定次数的迭代，而 `while` 循环最适合迭代到满足某个条件为止。循环是配合数组使用的完美搭档，因为每次迭代都可以轻松地读取或写入连续的数组元素。\n\
    \n![image](img/Image00005.jpg)\n\n你将在本书的后后部分发现如何使用 PHP `while` 循环从 MySQL 数据库中检索记录。\n\
    \n![image](img/Image00029.jpg)\n\nwhileloop.php\n\n![image](img/Image00067.jpg)\
    \ 在 PHP 标签之间，使用创建一个数组的语句开始脚本\n\n```php\n<?php\n$numbers = array( 10 , 20 , 30\
    \ ) ;\n```\n![image](img/Image00068.jpg) 接下来，添加一个 `while` 循环来输出每个数组元素的值\n\n```php\n\
    echo '<dt>While Loop : ’ ;\n$i = 0 ;\nwhile ( $i < 3 )\n{\n    echo “<dd>Element\
    \ $i = $numbers[$i] ” ;\n    $i ++ ;\n}\n```\n![image](img/Image00069.jpg) 现在，添加一个\
    \ `do while` 循环来输出每个数组元素的值\n\n```php\necho '<dt>Do While Loop : ’ ;\n$i = 0 ;\n\
    do\n{\n    echo “<dd>Element $i = $numbers[$i] ” ;\n    $i ++ ;\n}\nwhile ( $i\
    \ < 3 ) ;\n?>\n```\n![image](img/Image00070.jpg) 将文档保存在 Web 服务器的 `/htdocs` 目录下并命名为\
    \ `whileloop.php`，然后通过 HTTP 打开页面，查看数组元素值如何相同地显示\n\n![image](img/Image00079.jpg)\n\
    \n![image](img/Image00006.jpg)\n\n将此测试表达式中的值改为零——在两个循环中都变为 `while ( $i = 0 )`——以看到只执行了\
    \ `do while` 循环的第一次迭代。\n\n### 跳出循环\n\n`break` 关键字可以在满足指定条件时提前终止循环。`break` 语句位于循环语句块内部，前面有一个测试表达式。当测试返回\
    \ `TRUE` 时，循环立即结束，程序继续执行下一个任务。例如，在嵌套内部循环中，它将进入外层循环的下一次迭代。\n\n![image](img/Image00029.jpg)\n\
    \nbreakcontinue.php\n\n![image](img/Image00067.jpg) 在 PHP 标签之间，使用一个执行三次迭代的 `for`\
    \ 循环开始脚本\n\n```php\n<?php\nfor ( $i = 1 ; $i < 4 ; $i ++ )\n{\n    # 在此处插入的嵌套循环（步骤\
    \ 2）。\n}\n```\n![image](img/Image00068.jpg) 接下来，插入一个同样执行三次迭代的嵌套 `for` 循环\n\n```php\n\
    for ( $j = 1 ; $j < 4 ; $j ++ )\n{\n    # 在此处插入的语句（步骤 5 & 6）。\n}\n?>\n```\n![image](img/Image00069.jpg)\
    \ 现在，插入一条语句在每次迭代时输出两个循环计数器的值\n\n```php\necho “Running i = $i and j = $j <br>”\
    \ ;\n```\n![image](img/Image00070.jpg) 将文档保存在 Web 服务器的 `/htdocs` 目录下并命名为 `breakcontinue.php`，然后通过\
    \ HTTP 打开页面，查看两个循环计数器的值如何显示\n\n![image](img/Image00080.jpg)\n\n![image](img/Image00072.jpg)\
    \ 接下来，在循环块之前插入此 `break` 语句以退出循环——保存文档并查看更改\n\n```php\nif ( $i == 2 && $j == 1\
    \ )\n{\n    echo “Breaks inner loop when i = 2 and j = 1” ;\n    break ;\n}\n\
    ```\n![image](img/Image00081.jpg)\n\n![image](img/Image00006.jpg) 这里的 `break`\
    \ 语句在外层循环尝试执行第二次时就停止。`continue` 关键字可以在满足指定条件时跳过循环的单次迭代。`continue` 语句位于循环语句块内部，前面有一个测试表达式。当测试返回\
    \ `TRUE` 时，循环立即结束。\n\n![image](img/Image00082.jpg) 现在，在循环块之前插入此 `continue` 语句以退出循环——保存文档并查看更改\n\
    \n```php\nif ( $i == 2 && $j == 1 )\n{\n    echo “Continues inner loop when i\
    \ = 2 and j = 1” ;\n    continue ;\n}\n```\n![image](img/Image00083.jpg)\n\n![image](img/Image00006.jpg)\
    \ 这里的 `continue` 语句在外层循环尝试执行第一次时就跳过。\n\n### 总结\n\n- `if` 关键字执行基础条件测试，评估表达式的 `TRUE`\
    \ 或 `FALSE` 值\n- 大括号内的语句仅在评估结果为 `TRUE` 时执行\n- 多个表达式可以使用逻辑运算符 `&&` 进行测试，也可以通过嵌套多个\
    \ `if` 条件测试\n- `else` 关键字指定当 `if` 语句评估为 `FALSE` 时执行的语句\n- `elseif` 关键字用于附加在 `TRUE`\
    \ 时评估的备用表达式\n- 多个 `if-elseif-else` 语句可以通过 `switch` 语句更有效地执行\n- `case` 关键字用于指定\
    \ `switch` 语句块中要匹配的值\n- 每个 `case` 语句必须以 `break` 关键字语句结束，以便 `switch` 在找到匹配时退出\n\
    - `default` 语句指定在任何 `case` 语句未发现匹配时执行的代码\n- 循环是脚本中的一段代码，它会自动重复直到测试表达式变为 `FALSE`\n\
    - PHP 循环结构有 `for`、`while`、`do while` 和 `foreach`\n- `for` 循环结构指定了初始化器、测试表达式和一个增加（或递减）计数器的更新器\n\
    - 更新器必须包含在 `while` 循环和 `do while` 循环的语句中\n- 与 `while` 循环不同，`do while` 循环始终至少执行一次\n\
    - `break` 关键字可以在满足指定条件时提前终止循环\n- `continue` 关键字可以在满足指定条件时跳过循环的单次迭代\n\n### 使用函数\n\
    \n"
- fmt: "\n*This chapter demonstrates how to create re-usable blocks of code in functions.*\n\
    \n## Defining functions\n\nPHP provides many built-in functions that can be called\
    \ by name in your scripts to execute pre-defined actions, such as the array sorting\
    \ functions described [here](#text00004.html_sec11). Additionally, you may create\
    \ your own custom functions to execute specified actions when called. This usefully\
    \ allows PHP scripts to be modularized into sections of code that are easier to\
    \ understand and maintain.\n\n![image](Image00084.jpg)\n\nYour custom function\
    \ names may contain any combination of letters, numbers and the underscore character,\
    \ but must begin with a letter or an underscore. Understandably, to avoid conflict\
    \ the name may not duplicate an existing built-in function name, so for example\
    \ you may not create a custom function named “sort`.\n\nUnlike PHP variables,\
    \ function names are case-insensitive so `cube()`, `Cube()`, and `CUBE()` can\
    \ all reference the same function. Nonetheless,- it is recommended you always\
    \ use the same case as that used to name the function in the function definition.\n\
    \nA function definition is created in a PHP script simply by stating its name\
    \ after the `function` keyword, followed by parentheses and curly brackets (braces)\
    \ containing the statements to be executed each time that function gets called:\n\
    \n```php\nfunction function_name ( )\n{\n    statement-to-be-executed ;\n    statement-to-be-executed\
    \ ;\n    statement-to-be-executed ;\n}\n```\n\n![image](Image00006.jpg)\n\nPHP\
    \ variable names are case-sensitive, but PHP function names are not.\n\nA PHP\
    \ script can then call upon a defined function by name using `function_name()`\
    \ to execute the statements it contains whenever required. Although the interpreter\
    \ runs the script from top to bottom, a function call can appear before the function\
    \ definition. This is not good programming practice, however, so you should define\
    \ functions before they are called.\n\nFunctions may contain any valid PHP script\
    \ code and may even contain a further function definition. In that case, the inner\
    \ function will not exist until the outer function has been called.\n\n![image](Image00029.jpg)\n\
    \nfunction.php\n\n![image](Image00085.jpg)  Begin a PHP script with a statement\
    \ to define a function\n\n```php\n<?php\nfunction greet ()\n{\n    echo ‘Hello\
    \ User!<br> ;\n}\n```\n\n![image](Image00086.jpg)  Next, add a statement to call\
    \ the function defined in the previous step, to have it execute its statement\n\
    \n```php\ngreet () ;\n```\n\n![image](Image00087.jpg)  Now, define another function\
    \ that contains an inner function definition and a further statement\n\n```php\n\
    function outer ()\n{\n    function inner ()\n    {\n        echo ‘Inner function\
    \ called.<br> ;\n    }\n    echo ‘Inner function created.<br> ;\n}\n```\n\n![image](Image00088.jpg)\
    \  Finally, add statements to call each of the functions defined in the previous\
    \ step\n\n```php\nouter () ;\ninner () ;\n?>\n```\n\n![image](Image00089.jpg)\
    \  Save the document in your web server’s `/htdocs` directory as `function.php`\
    \ then open the page via HTTP to see the output from each function call\n\n![image](Image00090.jpg)\n\
    \n![image](Image00005.jpg)\n\nRemove the call to the outer function to see an\
    \ undefined function error when the script attempts to call the inner function.\n\
    \n## Passing arguments\n\nData can be passed to functions as “arguments” in the\
    \ same way you can pass arguments to some built-in PHP functions. For example,\
    \ the `sort()` function takes the array to be sorted as its argument. Functions\
    \ can be created with any number of arguments but when called, data must be supplied\
    \ for each argument to avoid an error.\n\n![image](Image00006.jpg)\n\nParameters\
    \ must be specified in the function declaration as a comma-separated list, and\
    \ argument values passed by the caller as a comma-separated list.\n\nA function\
    \ accepting arguments is defined by including a comma-separated list of “parameters”\
    \ within the parentheses after the function name, like this:\n\n```php\nfunction\
    \ function_name ( $arg_1 , $arg_2 , $arg_3 )\n{\n    statement-to-be-executed\
    \ ;\n    statement-to-be-executed ;\n    statement-to-be-executed ;\n}\n```\n\n\
    Parameter names must adhere to the same naming conventions required for PHP variables\
    \ and should ideally be meaningful, to represent the nature of the data they will\
    \ be passed. The argument data must be passed by the call in the correct order\
    \ and can then be used by the statements within that function.\n\nOptionally,\
    \ the function definition can specify the type of data to be passed from the caller\
    \ by including a type description before the parameter name. Valid type descriptions\
    \ include `int`, `float`, `string`, `bool`, `callable` and `array`. When types\
    \ are specified, a call that attempts to pass incorrect data type will result\
    \ in error.\n\n![image](Image00003.jpg)\n\nIt is important to recognize that by\
    \ default, argument data is passed “by value”. This means that if a function call\
    \ specifies a variable, only a copy of the data gets passed to the function. Modifying\
    \ the argument will not affect the original data in the variable when it is passed\
    \ by value.\n\nIf you want a function to modify data stored in a variable, specified\
    \ in a function call, you must pass it “by reference”. This allows the function\
    \ to operate directly on the original data. To ensure that an argument is always\
    \ passed by reference, you need simply prefix an `&` ampersand before the parameter\
    \ name in the function definition.\n\n![image](Image00029.jpg)\n\narguments.php\n\
    \n![image](Image00085.jpg)  Begin a PHP script with a statement to initialize\
    \ two variables with the same integer value\n\n```php\n<?php\n$a = $b = 5 ;\n\
    ```\n\n![image](Image00086.jpg)  Next, define a function that accepts two integer\
    \ arguments – one by value and the other by reference\n\n```php\nfunction modify\
    \ ( int $val , int & $ref )\n{\n    // Statements to be inserted.\n}\n```\n\n\
    ![image](Image00087.jpg)  Now, insert statements to output the passed values,\
    \ then increment those values and display the modified values\n\n```php\necho\
    \ “Passed values : $val , $ref <br>” ;\n$val ++ ;\n$ref ++ ;\necho “Incremented\
    \ values : $val , $ref <hr>” ;\n```\n\n![image](Image00088.jpg)  After the function\
    \ block add a statement to call the function, passing the variable values as arguments\n\
    \n```php\nmodify ( $a , $b ) ;\n```\n\n![image](Image00089.jpg)  Finally, add\
    \ a statement to display the values now stored in each variable\n\n```php\necho\
    \ “Stored values : $a , $b ” ;\n?>\n```\n\n## Varying parameters\n\nDefault argument\
    \ values can optionally be specified in a function definition by assignment to\
    \ the parameter name, like this:\n\n```php\nfunction function_name ( $arg_1 ,\
    \ $arg_2 = “Default String” )\n{\n    statement-to-be-executed ;\n    statement-to-be-executed\
    \ ;\n    statement-to-be-executed ;\n}\n```\n"
