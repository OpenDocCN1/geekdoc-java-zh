    \    function construct( int $w = 4 , int $h = 5 )\n    {\n        $this-> width\
    \ = $w ;\n        $this-> height = $h ;\n    }\n    public function getWidth ()\
    \ { return $this-> width ; }\n    public function getHeight () { return $this->\
    \ height ; }\n}\n```\n![image](img/Image00115.jpg) 在 `Polygon` 类之后，声明一个派自 `Polygon`\
    \ 类的 `Rectangle` 类，并添加一个独特的方法\n\n```php\nclass Rectangle extends Polygon\n{\n\
    \    public function area ()\n    {\n        return ( $this-> getWidth () * $this->\
    \ getHeight () ) ;\n    }\n}\n```\n\n![image](img/Image00116.jpg) 在 `Rectangle`\
    \ 类之后，声明一个派自 `Polygon` 类的 `Triangle` 类，并添加一个独特的方法\n\n```php\nclass Triangle extends\
    \ Polygon\n{\n    public function area ()\n    {\n        return ( $this-> getWidth\
    \ () * $this-> getHeight () / 2 ) ;\n    }\n}\n```\n\n![image](img/Image00117.jpg)\
    \ 在 `Triangle` 类之后，添加两条语句使用默认值创建每个派生类的实例\n\n```php\n$rect = new Rectangle () ;\n\
    $trio = new Triangle () ;\n```\n\n![image](img/Image00118.jpg) 最后，添加两个语句来输出每个派生类的独特方法所返回的值\n\
    \n```php\necho ‘Rectangle Area : ‘ . $rect -> area (). ’<hr>’ ;\necho ‘Triangle\
    \ Area : ‘ . $trio -> area () ;\n?>\n```\n\n![image](img/Image00119.jpg) 将文档保存到\
    \ Web 服务器的 `/htdocs` 目录并命名为 `inheritance.php`，然后通过 HTTP 访问页面以查看继承成员的输出\n\n![image](img/Image00135.jpg)\n\
    \n![image](img/Image00019.jpg)\n\n不要混淆类实例和派生类——实例是类的拷贝，而派生类是一个继承其所自基类属性的新类。\n\n\
    ![image](img/Image00006.jpg)\n\n在 PHP 中，派生类始终依赖于单一基类——不支持多重继承。\n\n## 拥抱多态\n\n\
    面向对象编程 (OOP) 的三个基石是封装、继承和多态。在之前的页面中，我们已经看到了数据如何封装在 PHP `class` 中，以及派生类如何继承其基类的属性，因此我们现在可以探索最后一个的基石原则：多态。\n\
    \n![image](img/Image00136.jpg)\n\n“多态”一词（源自希腊语，意为“多种形式”）描述了根据上下文赋予实体不同意义或目的的能力。例如，在现实世界中，每个人都知道如何使用按钮（实体）——你只需对其施加压力。然而，该按钮的功能取决于连接到它的东西（上下文），但结果不会影响该按钮的使用方式。\n\
    \n在面向对象编程的世界中，多态允许类在共享公共接口的同时具有不同的功能。接口不需要知道它正在使用哪个类，因为它们就像现实世界的按钮一样，都以相同的方式使用，但可以产生不同的上下文结果。以此这样拥抱多态让程序员能够创建可以交换的对象，并根据需求而不是条件测试来选择它们。\n\
    \nPHP 接口类似于类，但使用 `interface` 关键字声明，并且只能包含方法定义，而不包含任何要执行的方法语句，如下所示：\n\n```php\n\
    interface InterfaceName\n{\n    // 此处只进行方法定义。\n}\n```\n\n![image](img/Image00006.jpg)\n\
    \n接口声明中的方法定义也可以指定参数。\n\n实现接口的每个类必须实现其定义的所有方法，并指定要执行的语句。通过在声明中包含 `implements` 关键字和接口名称将类与接口关联，如下所示：\n\
    \n```php\nclass ClassName implements InterfaceName\n{\n    // 方法实现在这里。\n}\n```\n\
    \n可以通过添加一个接口和单个函数来修改之前的示例以拥抱多态。\n\n![image](img/Image00029.jpg)\n\npolymorphism.php\n\
    \n![image](img/Image00114.jpg) 将上一个示例的拷贝“inheritance.php”重命名为新程序“polymorphism.php”\n\
    \n![image](img/Image00115.jpg) 声明名为“Shape”的接口，它包含 Rectangle 和 Triangle 类中已实现的方法定义\n\
    \n```php\ninterface Shape { public function area () ; }\n```\n\n![image](img/Image00116.jpg)\
    \ 编辑 Rectangle 和 Triangle 类声明的第一行——将它们与接口关联\n\n```php\nclass Rectangle extends\
    \ Polygon implements Shape\nclass Triangle extends Polygon implements Shape\n\
    ```\n\n![image](img/Image00117.jpg) 在类块之后，添加一个接受 Shape 类型参数并调用其定义方法的函数\n\n```php\n\
    function getArea ( Shape $shape )\n{ return $shape -> area () ; }\n```\n\n![image](img/Image00118.jpg)\
    \ 修改创建每个派生类实例的两个语句——传递参数值\n\n```php\n$rect = new Rectangle ( 8 , 10 ) ;\n$trio\
    \ = new Triangle ( 8 , 10 ) ;\n```\n\n```php\necho ‘Rectangle Area : ‘ . $rect\
    \ -> area (). ’<hr>’ ;\necho ‘Triangle Area : ‘ . $trio -> area () ;\n```\n"
- fmt: "\n# [Appending text](#text00010.html_sec58)\n# [Handling errors](#text00010.html_sec59)\n\
    # [Catching exceptions](#text00010.html_sec60)\n# [Summary](#text00010.html_sec61)\n\
    \n## Reading files\n\nThe ability to read and write files located on the web server\
    \ is useful to log information and to provide page content. In order to process\
    \ files, a “filestream” object must first be created using the PHP `fopen()` function.\
    \ This requires two arguments to specify the name or path of the file and a file\
    \ “mode”. The file mode determines the nature of the operation to be performed\
    \ and places the file pointer at a suitable position within the file:\n\n| File\
    \ mode: | Operation: |\n| :--- | :--- |\n| r | Open an existing file to read File\
    \ pointer starts at the beginning of the file |\n| w | Discard all contents of\
    \ an existing file or create a new file if none exists File pointer starts at\
    \ the beginning of the file |\n| a | Open an existing file and preserve all contents\
    \ File pointer starts at the end of the file |\n| r+ | Open a file to read from\
    \ or write to File pointer starts at the beginning of the file |\n| w+ | Open\
    \ a file to write to or read from Discard all contents of an existing file or\
    \ create a new file if none exists File pointer starts at the beginning of the\
    \ file |\n| a+ | Open a file to read from or write to and preserve all contents\
    \ File pointer starts at the end of the file |\n\n![image](Image00019.jpg)\n\n\
    The file mode specifier must appear within quote marks when supplied as an argument\
    \ to the `fopen()` function.\n\nIt is good practice to always provide an alternative\
    \ with the `die()` function in case the attempt to create a filestream fails.\n\
    \n![image](Image00005.jpg)\n\nSpecify an explanatory message as an argument to\
    \ the `die()` function.\n\nWhen a filestream is created successfully, the file\
    \ can be read by specifying the filestream and byte size as arguments to the `fread()`\
    \ function. If the whole file is to be read it is convenient to use the `filesize()`\
    \ function to specify the byte size of the file to be read.\n\nUpon completion\
    \ of any file operation, the filestream must be destroyed by specifying it as\
    \ an argument to the `fclose()` function.\n\n![image](Image00138.jpg)\n\n![image](Image00029.jpg)\n\
    \nread.php\n\n![image](Image00008.jpg) Begin a PHP script with statements that\
    \ attempt to open a plain text file for reading, or exit the script upon failure\n\
    \n```php\n<?php\n$filestream = fopen( ‘manifesto.txt’ , ‘r’ )\nor die( ‘Unable\
    \ to open file!’ ) ;\n```\n\n![image](Image00010.jpg) Next, add a statement to\
    \ read the text file upon success and display its entire contents\n\n```php\n\
    echo fread( $filestream , filesize( ‘manifesto.txt’ ) ) ;\n```\n\n![image](Image00012.jpg)\
    \ Now, remember to close the file stream\n\n```php\nfclose( $filestream ) ;\n\
    ```\n\n![image](Image00014.jpg) Save the document in your web server’s `/htdocs`\
    \ directory as `read.php`, alongside the plain text file to be read, then open\
    \ the page via HTTP to see the text file contents displayed in the browser window.\n\
    \n![image](Image00139.jpg)\n\n![image](Image00006.jpg)\n\nUnlike a PHP block within\
    \ an HTML document, a purely PHP script needs no closing `?>` tag.\n\n![image](Image00006.jpg)\n\
    \nNotice that the output here does not maintain line endings – but the example\
    \ overleaf does.\n\n## Reading lines\n\nOnce a “filestream” object is created,\
    \ its contents can be read one line at a time by specifying the filestream as\
    \ an argument to the PHP `fgets()` function. To read every line this function\
    \ can be called repeatedly in a loop. The `feof()` function can determine when\
    \ the end of the file is reached and can end the loop:\n\n![image](Image00140.jpg)\n\
    \n![image](Image00006.jpg)\n\nThe `feof()` function returns true when the end\
    \ of the file is reached.\n\n![image](Image00029.jpg)\n\nreadlines.php\n\n![image](Image00008.jpg)\
    \ Begin a PHP script with statements that attempt to open a plain text file for\
