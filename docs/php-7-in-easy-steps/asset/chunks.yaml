    , then insert PHP tags into the body section


    **<?php**


    **# Statements to be inserted here.**


    **?>**


    ![image](Image00037.jpg)  Now, insert between the PHP tags a statement to create
    and initialize a variable array with key names and values


    **$cars = array( ‘Dodge’ => ‘Viper’ , ‘Chevrolet’ => ‘Camaro’ , ‘Ford’ => ‘Mustang’
    ) ;**'
