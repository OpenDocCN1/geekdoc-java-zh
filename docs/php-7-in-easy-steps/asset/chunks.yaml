    \n![image](img/Image00103.jpg)\n\n![image](img/Image00006.jpg)\n\n字符顺序是相关的，因为两个顺序不同的字符串的\
    \ ASCII 总和可能相等，但这些字符串本身并不会匹配。\n\n### 搜索文本\n\nPHP 提供了许多内置函数来搜索字符串以找到指定的子字符串或单个字符。简单的\
    \ `strpos()` 函数接受两个参数，指定要搜索的字符串和要查找的子字符串。它将从字符串开始顺序搜索以找到匹配。当找到匹配项时，搜索停止，`strpos()`\
    \ 返回一个整数，该整数是字符串中第一个匹配项开始的字符索引位置。如果没有找到匹配项，`strpos()` 返回 `FALSE`。\n\n`strrpos()`\
    \ 函数的工作方式与 `strpos()` 类似，但它返回最后一个匹配项开始的索引位置。\n\n`strstr()` 函数接受两个参数，指定要搜索的字符串和要查找的子字符串。它将从字符串开始顺序搜索以找到匹配。当找到匹配项时，搜索停止，`strstr()`\
    \ 返回从匹配项开始的剩余字符串。如果没有找到匹配项，`strstr()` 返回 `NULL`。\n\n![image](img/Image00019.jpg)\n\
    \n注意 `strrpos()` 是 `strpos()` 的反向函数，用于反向搜索。\n\n`strrpos()` 函数的工作方式与 `strpos()`\
    \ 类似，但它返回最后一个匹配项开始的索引位置。\n\n`strrpos()` 函数接受两个参数，指定要搜索的字符串和要查找的子字符串。它将从字符串结束顺序搜索以找到匹配。当找到匹配项时，搜索停止，`strrpos()`\
    \ 返回从最后一个匹配项开始的剩余字符串。如果没有找到匹配项，`strrpos()` 返回 `NULL`。\n\n同样，如果大小写很重要，你可以使用辅助函数\
    \ `stristr()` 来不区分大小写。\n\n`strchr()` 函数接受两个参数，指定要搜索的字符串和要查找的单个字符。它将从字符串开始顺序搜索以找到匹配。当找到匹配项时，搜索停止，`strchr()`\
    \ 返回从匹配项开始的剩余字符串。如果没有找到匹配项，`strchr()` 返回 `NULL`。\n\n![image](img/Image00019.jpg)\n\
    \n`strrchr()` 是 `strchr()` 的反向函数，用于反向搜索。\n\n`strrchr()` 函数的工作方式与 `strchr()` 类似，但它返回最后一个匹配项开始的索引位置。\n\
    \n`strrchr()` 函数接受两个参数，指定要搜索的字符串和要查找的单个字符。它将从字符串结束顺序搜索以找到匹配。当找到匹配项时，搜索停止，`strrchr()`\
    \ 返回从最后一个匹配项开始的剩余字符串。如果没有找到匹配项，`strrchr()` 返回 `NULL`。\n\n![image](img/Image00029.jpg)\n\
    \nsearch.php\n\n![image](img/Image00098.jpg)  使用语句开始 PHP 脚本，初始化一个字符串值变量并报告其长度\n\
    \n```php\n<?php\n$str = ‘Most Users usually find PHP useful.’ ;\necho “’ $str\
    \ ’<br>String Length : .strlen( $str ) ;\n```\n\n![image](img/Image00099.jpg)\
    \  接下来，添加语句正反搜索字符串，并报告给定子字符串的位置\n\n```php\necho “<br>First ‘us’ found at : “ .strpos(\
    \ $str , ‘us’ ) ;\necho “<br>Final ‘us’ found at : “ .strrpos( $str , ‘us’ ) ;\n\
    ```\n\n![image](img/Image00100.jpg)  现在，添加语句以区分敏感和不区分大小写的方式搜索字符串，并返回子字符串匹配后的剩余字符串\n\
    \n```php\necho “<hr>Substring from first ‘us’ : “ .strstr( $str , ‘us’ ) ;\necho\
    \ “<br>Substring from first ‘us’ case insensitive : ”\n.stristr( $str , ‘us’ )\
    \ ;\n```\n\n![image](img/Image00101.jpg)  最后，添加语句以正向和反向的方式搜索字符串，并返回字符匹配后的剩余字符串\n\
    \n```php\necho “<hr>Characters from first ‘u’ : “ .strchr( $str , ‘u’ ) ;\necho\
    \ “<br>Characters from final ‘u’ : “ .strrchr( $str , ‘u’ ) ;\n?>\n```\n[/content]\
