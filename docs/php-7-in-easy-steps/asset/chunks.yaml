    ```php

    if( isset( $_SESSION[ ‘user’ ] ) )

    {

    $user = $_SESSION[ ‘user’ ] ;

    echo “<h1>欢迎 $user !</h1><hr>” ;

    echo ‘<a=” session_data.php ”>查看会话</a>’ ;

    }

    else

    { echo ‘请 <a=” session_form.html ”>登录</a>’ ; }

    ?>

    ```


    ![image](img/Image00057.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录，并命名为 `session_set.php`，然后查看如何检索数据（注：此处再次提到了
    session_set.php，但上下文暗示是 session_get.php）。


