    ### 设置 Session


    接收到表单提交后，PHP 脚本可以检查字段是否存在，并可能对其关联的值进行验证。例如，可以使用 `ctype_alpha()` 函数确认它们仅包含字母，可以使用
    `preg_match()` 函数确认值是否匹配指定模式。一旦验证通过，可以将提交的字段名称和值赋值给 `$_SESSION` 全局数组变量的元素。成功完成后，脚本可以使用
