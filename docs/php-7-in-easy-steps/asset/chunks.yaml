    ### 保留数据


    用户输入的数据经常跨多个页面需要。用户数据可以方便地存储在客户端机器的“cookie”文件中，这样用户就不必重复输入相同的数据。PHP `setcookie()`
    函数通过指定三个参数轻松创建 cookie：


    本章演示如何使用 cookie 保留数据。


    ```php

    setcookie(name , value , expiry-time) ;

    ```


    ![image](img/Image00005.jpg)


    当 HTML 表单使用 `POST` 方法提交到服务器时，其字段会自动分配给特殊的 PHP `$_POST` 全局变量。可以使用内置的 `isset()`
    函数检查提交字段是否存在。当确认字段确实存在时，其名称和值可以存储在 cookie 中。这可能用于存储跨网站使用的用户名和密码：


