    **Summary**


    • The PHP built-in string comparison functions **strcmp()** , **strncmp()** ,
    **strcasecmp()** and **strncasecmp()** each typically return a result of 1 (greater),
    0 (equal) or -1 (less)


    • String comparisons are based on the numerical ASCII value of each character,
    compared in sequence to account for order


    • The ASCII value of any character can be found using **ord()**


    • The length of any string can be found using **strlen()**


    • The numerical index position of a substring within a searched string can be
    found using **strpos()** and **strrpos()** functions


    • The search functions **strstr()** , **stristr()** , **strchr()** and **strrchr()**
    each return the remainder of a searched string on success


    • The substring functions **substr()** , **substr_replace()** and **substr_count()**
    can extract, replace or count occurrences


    • The characters in a string can be reversed using **strrev()** , or the string
    can be repeated using **strrpt()**


    • Padding characters can be added to a string using **strpad()** and characters
    can be removed using **trim()** , **ltrim()** or **rtrim()**


    • A string can be split into individual parts by specifying a delimiter to the
    **strtok()** function


    • The **date()** function requires a string argument that specifies options to
    determine the format of its returned date string


    • By default the PHP date timezone is set to UTC


    • The **date_default_timezone_set()** function can be used to specify an alternative
    to the UTC default timezone


    • The **strtotime()** function will attempt to return an appropriate timestamp
    for whatever date or time argument it receives


    • The **htmlentities()** function will encode all string characters for which
    there is an equivalent entity


    • The **htmlspecialchars()** function will encode only characters of special HTML
    significance to avoid recognition by a browser


