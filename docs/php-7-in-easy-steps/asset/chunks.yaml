    **Defining functions**


    PHP provides many built-in functions that can be called by name in your scripts
    to execute pre-defined actions, such as the array sorting functions described
    [here](#text00004.html_sec11) . Additionally, you may create your own custom functions
    to execute specified actions when called. This usefully allows PHP scripts to
    be modularized into sections of code that are easier to understand and maintain.


    ![image](Image00084.jpg)


    Your custom function names may contain any combination of letters, numbers and
    the underscore character, but must begin with a letter or an underscore. Understandably,
    to avoid conflict the name may not duplicate an existing built-in function name,
    so for example you may not create a custom function named “sort”.


    Unlike PHP variables, function names are case-insensitive so **cube()** , **Cube()**
    and **CUBE()** can all reference the same function. Nonetheless,- it is recommended
    you always use the same case as that used to name the function in the function
    definition.


    A function definition is created in a PHP script simply by stating its name after
    the **function** keyword, followed by parentheses and curly brackets (braces)
    containing the statements to be executed each time that function gets called:


    **function *function_name* ( )**


    **{**


    ***statement-to-be-executed ;


    statement-to-be-executed ;


    statement-to-be-executed ;***


    **}**


    ![image](Image00006.jpg)


    PHP variable names are case-sensitive, but PHP function names are not.


    A PHP script can then call upon a defined function by name using ***function_name*
    ( );** to execute the statements it contains whenever required. Although the interpreter
    runs the script from top to bottom, a function call can appear before the function
    definition. This is not good programming practice, however, so you should define
    functions before they are called.


    Functions may contain any valid PHP script code and may even contain a further
    function definition. In that case, the inner function will not exist until the
    outer function has been called.


    ![image](Image00029.jpg)


    function.php


    ![image](Image00085.jpg)  Begin a PHP script with a statement to define a function


    **<?php**


    **function greet ()**


    **{**


    **echo ‘Hello User!<br>’ ;**


    **}**


    ![image](Image00086.jpg)  Next, add a statement to call the function defined in
    the previous step, to have it execute its statement


    **greet () ;**


    ![image](Image00087.jpg)  Now, define another function that contains an inner
    function definition and a further statement


    **function outer ()**


    **{**


    **function inner ()**


    **{**


    **echo ‘Inner function called.<br>’ ;**


    **}**


    **echo ‘Inner function created.<br>’ ;**


    **}**


    ![image](Image00088.jpg)  Finally, add statements to call each of the functions
    defined in the previous step


    **outer () ;**


    **inner () ;**


    **?>**


    ![image](Image00089.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **function.php**  then open the page via HTTP to see the output from each
    function call


    ![image](Image00090.jpg)


    ![image](Image00005.jpg)


    Remove the call to the outer function to see an undefined function error when
    the script attempts to call the inner function.


    **Passing arguments**


    Data can be passed to functions as “arguments” in the same way you can pass arguments
    to some built-in PHP functions. For example, the **sort()** function takes the
    array to be sorted as its argument. Functions can be created with any number of
    arguments but when called, data must be supplied for each argument to avoid an
    error.


    ![image](Image00006.jpg)


    Parameters must be specified in the function declaration as a comma-separated
    list, and argument values passed by the caller as a comma-separated list.


    A function accepting arguments is defined by including a comma-separated list
    of “parameters” within the parentheses after the function name, like this:


    **function *function_name* ( $*arg_1* , $*arg_2* , $*arg_3* )**


    **{**


    ***statement-to-be-executed ;


    statement-to-be-executed ;


    statement-to-be-executed ;***


    **}**


    Parameter names must adhere to the same naming conventions required for PHP variables
    and should ideally be meaningful, to represent the nature of the data they will
    be passed. The argument data must be passed by the call in the correct order and
    can then be used by the statements within that function.


    Optionally, the function definition can specify the type of data to be passed
    from the caller by including a type description before the parameter name. Valid
    type descriptions include **int** , **float** , **string** , **bool** , **callable**
    and **array** . When types are specified, a call that attempts to pass an incorrect
    data type to the function will result in an error.


    ![image](Image00003.jpg)


    The ability to specify argument data types is a new feature in PHP 7.


    It is important to recognize that by default, argument data is passed “by value”.
    This means that if a function call specifies a variable name, only a copy of the
    data within that variable gets passed to the function. Modifying the argument
    will not affect the original data stored in the variable when it is passed by
    value.


    If you want a function to modify data stored in a variable, specified in a function
    call, you must pass it “by reference”. This allows the function to operate directly
    on the original data. Modifying the argument will affect the original data in
    the variable when it is passed by reference. To ensure that an argument is always
    passed to a function by reference, you need simply prefix an **&** ampersand before
    the parameter name in the function definition.


