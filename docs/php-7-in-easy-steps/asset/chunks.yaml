    **Testing conditions**


    *This chapter demonstrates the various PHP control structures that determine how
    a script will proceed.*


    [**Seeking truth**](#text00006.html_sec25)


    [**Providing alternatives**](#text00006.html_sec26)


    [**Switching branches**](#text00006.html_sec27)


    [**Performing loops**](#text00006.html_sec28)


    [**Looping while true**](#text00006.html_sec29)


    [**Breaking from loops**](#text00006.html_sec30)


    [**Summary**](#text00006.html_sec31)


    **Seeking truth**


    The **if** keyword is used to perform the basic conditional test that evaluates
    a given expression for a Boolean value of **TRUE** or **FALSE** . Statements within
    braces following the evaluation will only be executed when the expression is found
    to be **TRUE** . When the expression is found to be **FALSE** , the PHP parser
    simply moves on to the next part of the script.


    ![image](Image00005.jpg)


    The **if** construct is one of the most important features in PHP, and in most
    other programming languages.


    The syntax of an **if** conditional test statement looks like this:


    **if ( *test-expression* ) { *statement-to-execute-when-true ;* }**


    There may be multiple statements to be executed when the test is **TRUE** but
    each statement must be terminated by a semi-colon:


    **if ( *test-expression* )**


    **{**


    ***statement-to-execute-when-true ;


    statement-to-execute-when-true ;


    statement-to-execute-when-true ;***


    **}**


    Multiple expressions can be tested using the logical **&&** or **and** operator
    to ensure that following statements will only be executed when both expressions
    are found to be **TRUE** , like this:


    **if ( ( *test-expression* ) && ( *test-expression* ) )**


    **{**


    ***statement-to-execute-when-true ;


    statement-to-execute-when-true ;


    statement-to-execute-when-true ;***


    **}**


    ![image](Image00005.jpg)


    When the code to be executed is just a single statement, the braces may optionally
    be omitted, but you may prefer to always include the braces for consistency.


    Alternatively, **if** conditional test statements can be nested to test multiple
    expressions so that statements will only be executed when all tests are found
    to be **TRUE** , like this:


    **if ( *test-expression* )**


    **{**


    **if ( *test-expression* )**


    **{**


    ***statement-to-execute-when-true ;


    statement-to-execute-when-true ;


    statement-to-execute-when-true ;***


    **}**


    **}**


    Multiple **if** conditional test statements can be made to provide alternatives
    for the script to follow.


    ![image](Image00029.jpg)


    if.php


    ![image](Image00067.jpg)  Between PHP tags, begin a script with a statement that
    initializes an integer variable


    **<?php**


    **$num = 8 ;**


    ![image](Image00068.jpg)  Next, add statements that output a result when a conditional
    test of numerical size is found to be  **TRUE**


    **if ( $num > 5 ) { echo “$num exceeds 5<br>” ; }**


    **if ( $num <= 5 ) { echo “ $num is below 6<br>” ; }**


    ![image](Image00069.jpg)  Now, add statements that output a result when a conditional
    test of parity is found to be  **TRUE**


    **if ( $num % 2 == 0 ) { echo “ $num is Even<br>” ; }**


    **if ( $num % 2 != 0 ) { echo “ $num is Odd<br>” ; }**


    **?>**


    ![image](Image00070.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **if.php**  then open the page via HTTP to see the results from successful
    tests get displayed


    ![image](Image00071.jpg)


    ![image](Image00072.jpg)  Edit the integer variable then save the modified script
    and refresh the browser to see the results from other successful tests get displayed


    **$num = 3 ;**


    ![image](Image00073.jpg)


    ![image](Image00006.jpg)


    When the tested condition is **FALSE** , the PHP parser ignores its statement
    block and simply moves on.


    **Providing alternatives**


    It is often preferable to extend an **if** statement by appending an **else**
    statement, specifying statements within braces to be executed when the expressions
    evaluated by the **if** statement are found to be **FALSE** , with this syntax:


    **if ( *test-expression* )**


    **{**


    ***statement-to-execute-when-true ;


    statement-to-execute-when-true ;


    statement-to-execute-when-true ;***


    **}**


    **else**


    **{**


    ***statement-to-execute-when-false ;


    statement-to-execute-when-false ;


    statement-to-execute-when-false ;***


    **}**


    ![image](Image00074.jpg)


    Alternative expressions may also be evaluated in a conditional test by adding
    an **elseif** statement, specifying statements within braces to be executed when
    the alternative expression is found to be **TRUE** . An **else** statement can
    be appended here too, to specify statements within braces to be executed when
    the expressions evaluated by the **if** and **elseif** statements are found to
    be **FALSE** , with this syntax:


    **if ( *test-expression* )**


    **{**


    ***statement-to-execute-when-true ;


    statement-to-execute-when-true ;


    statement-to-execute-when-true ;***


    **}**


    **elseif ( *test-expression* )**


    **{**


    ***statement-to-execute-when-true ;


    statement-to-execute-when-true ;


    statement-to-execute-when-true ;***


    **}**


    **else**


    **{**


    ***statement-to-execute-when-false ;


    statement-to-execute-when-false ;


    statement-to-execute-when-false ;***


    **}**


    This is a fundamental programming technique that offers the script different directions
    in which to proceed, depending on the result of the evaluations, and is known
    as “conditional branching”.


    ![image](Image00005.jpg)


    The **elseif** keyword can also be written as two separate words: **else if**
    .


    ![image](Image00019.jpg)


    You may come across some PHP scripts that use a **:** colon character rather than
    curly brackets. This is not recommended as **if** and **else if** will only be
    considered exactly the same when using curly brackets.


    ![image](Image00029.jpg)


    else.php


    ![image](Image00067.jpg)  Between PHP tags, begin a script with a statement that
    outputs a result only when a tested expression is  **TRUE**


    **<?php**


    **if ( 4 > 2 ) { echo ‘<p>Yes, 4 is greater than 2 <br>’ ; }**


    ![image](Image00068.jpg)  Next, add a statement that outputs a result only when
    two tested expressions are both found to be  **TRUE**


    **if ( ( 4 > 2 ) && ( 8 > 4 ) )**'
