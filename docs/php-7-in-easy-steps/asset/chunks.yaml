  trans: "\n\n这允许在调用函数时指定一个或两个参数值。如果只指定了一个参数，它将赋值给第一个参数，而第二个参数将使用默认值。在为参数指定了默认值的情况下，它们必须仅出现在未指定默认值的参数之后（即其右侧）的参数列表中。否则，不符合正确总参数数量的调用将导致错误。\n\
    \n![image](img/Image00019.jpg)\n\n如果指定了多个默认值，目前没有办法在函数调用中跳过某个参数，以便为特定参数分配参数值。\n\
    \n如果你需要创建一个可以接受未知数量参数的函数，PHP 拥有一个特殊的 `...` “散列（splat）”运算符用于此目的。它可以像这样用在函数定义中：\n\
    \n```php\nfunction function_name ( ...$args )\n{\n    statement-to-be-executed\
    \ ;\n    statement-to-be-executed ;\n    statement-to-be-executed ;\n}\n```\n\n\
    当在函数定义中使用 `...` 散列运算符作为参数名的前缀时，可以将多个参数传递给该参数以创建一个数组。该数组可以像任何其他数组一样被遍历，从而操作传入的参数值。\n\
    \n此外，`...` 散列运算符可以用于“解包”函数调用中指定的数组，将其元素值作为单独参数传递，如下所示：\n\n```php\nfunction function_name\
    \ ( $arg_1 , $arg_2 , $arg_3 )\n{\n    echo $arg_1 + $arg_2 + $arg_3 ;\n}\n\n\
    $arr = [ 1 , 2 , 3 ] ;\nfunction_name ( ...$arr ) # 输出 6\n```\n\n![image](img/Image00005.jpg)\n\
    \n`...` 散列运算符有时也被称为“分发（scatter）”运算符。\n\n![image](img/Image00029.jpg)\n\nparameters.php\n\
    \n![image](img/Image00085.jpg) 通过定义一个为其其两个参数提供默认字符串值的函数来开始一个 PHP 脚本\n\n```php\n\
    <?php\nfunction drink ( string $tmp = ‘hot’ , string $flavor = ‘tea’ )\n{\n  \
    \  // 在此处插入语句。\n}\n```\n\n![image](img/Image00086.jpg) 接下来，插入一条语句来显示其默认值或传入的参数值\n\
    \n```php\necho “Drinking $tmp $flavor .<br>” ;\n```\n\n![image](img/Image00087.jpg)\
    \ 在函数块之后，添加可选传递字符串参数的函数调用\n\n```php\ndrink () ; drink ( ‘iced’ ) ; drink ( ‘cold’\
    \ , ‘lemonade’ ) ;\n```\n\n![image](img/Image00088.jpg) 现在，定义一个可以接受多个整数参数并显示其总值的函数\n\
    \n```php\nfunction add ( int ... $numbers )\n{\n    $total = 0 ;\n    foreach(\
    \ $numbers as $num ) { $total + = $num ; }\n    echo “<hr>Total : $total ” ;\n\
    }\n```\n\n![image](img/Image00089.jpg) 最后，在函数块之后添加一条语句来调用上一步的函数并传递三个值\n\n```php\n\
    add ( 1 , 2 , 3 ) ;\n?>\n```\n\n![image](img/Image00091.jpg) 将文档保存到 Web 服务器的 `/htdocs`\
    \ 目录并为 `parameters.php`，然后通过 HTTP 打开页面查看参数和默认值\n\n![image](img/Image00093.jpg)\n\
    \n![image](img/Image00005.jpg)\n\n你可以在使用 `...` 散列运算符的接受多个参数的参数之前，指定常规的位置参数。只有数量多于位置元素的参数才会被添加到最后一个参数的数组中。\n\
    \n### 识别作用域\n\n在创建自定义函数时，理解变量的可访问性如何受变量“作用域”的限制是非常重要的：\n\n- 在函数外部创建的变量具有“全局”（global）作用域，但通常从任何函数块内部访问\n\
    - 在函数内部创建的变量具有“局部”（local）作用域，因此只能在该特定的函数块内部访问\n\n由于在函数内部创建的变量无法从其他地方访问，它的名称可以与函数块外部的变量或另一个函数块内的变量名称重名而不会产生冲突。这允许全局变量包含一个与同名局部变量不同的值。\n\
    \n![image](img/Image00019.jpg)\n\nPHP 中的全局变量不像 C 等其他编程语言（在那些语言中，全局变量对函数可用）。在 PHP\
    \ 中，只有在首先在函数块内部使用 `global` 关键字显式声明，全局变量才能在函数中使用。\n\n如果你想在函数内部使用全局变量，必须先包含带有 `global`\
    \ 关键字的语句来声明该变量名指向全局变量，如下：\n\n```php\nglobal variable-name ;\n```\n\n通过在函数内部创建的变量的声明之前加上\
    \ `global` 关键字，可以更改其作用域使其在全局范围内可用——但这是一种糟糕的做法，应该避免。\n\n函数语句可以调用其他函数来执行它们的语句，也可以调用自己来执行递归。与循环一样，递归函数必须更改测试条件的状态，否则它将永远永远持续下去。这可能是一个计数器值，它作为参数从初始函数调用传递进来，然后在随后的递归调用中不断递增，直到它超过测试中指定的值。或者，可以声明一个静态局部变量来存储递增值，如下所示：\n\
    \n```php\nstatic variable-name ;\n```\n\n与在离开函数时会丢失值的其他局部变量不同，静态变量会保留其值。这意味着静态变量的更新值在每次函数调用时都会被保留。递归函数可能会引用递增的全局变量值，直到它超过测试中指定的数值。\n\
    \n![image](img/Image00029.jpg)\n\nparameters.php\n\n![image](img/Image00085.jpg)\
    \ 通过初始化全局变量并显示变量值开始一个 PHP 脚本\n\n```php\n<?php\n$number = 1 ; echo “Global number\
    \ : $number <br>” ;\n```\n\n![image](img/Image00086.jpg) 接下来，定义并调用一个初始化局部变量并显示该值的函数\
    \ `show_local()`\n\n```php\nfunction show_local ()\n{\n    $number = 100 ; echo\
    \ “Local number : $number <hr>” ;\n}\n\nshow_local () ;\n```\n\n![image](img/Image00087.jpg)\
    \ 现在，定义并调用一个每次递增全局变量和静态变量的递归函数\n\n```php\nfunction recur ()\n{\n    global $number\
    \ ;\n    static $letter = ‘A’ ;\n    if( $number < 14 )\n    {\n        echo $number\
    \ : $letter | “ ;\n        $number ++ ; $letter ++ ; recur () ;\n    }\n}\n\n\
    recur () ;\n```\n\n![image](img/Image00088.jpg) 最后，在函数块之后添加一条语句来显示修改后的全局变量\n\n\
    ```php\necho “<hr>Global number : $number ” ;\n?>\n```\n\n![image](img/Image00089.jpg)\
    \ 将文档保存到 Web 服务器的 `/htdocs` 目录并为 `scope.php`，然后通过 HTTP 打开页面查看全局和局部变量的值\n\n![image](img/Image00094.jpg)\n\
    \n![image](img/Image00006.jpg)\n\n如果你从此函数中移除 `static` 关键字，`$letter` 变量每次调用函数时将简单地包含\
    \ ‘A’。\n\n![image](img/Image00005.jpg)\n\nPHP 还有一个特殊的 `$GLOBALS` 数组，可以通过其名称引用全局变量的值。在这个示例中，你也可以改为使用\
    \ `$GLOBALS['number']` 来获取该值。\n\n### 返回值\n\n自定义 PHP 函数可以通过添加使用 `return` 关键字的语句向调用者返回一个值，如下：\n\
    \n```php\nfunction function_name ( )\n{\n    statement-to-be-executed ;\n    statement-to-be-executed\
    \ ;\n    return value ;\n}\n```\n\n`return` 语句是可选的，如果省略，函数将默认向调用者返回 `NULL` 值。\n\
    \n函数只能向调用者返回一个项目，因此它们不能返回多个值。然而，你可以将多个值赋值给数组的元素，并让函数返回单个数组给调用者，然后解包这些值。\n\n"
- fmt: "\nA `return` statement can include an expression to be evaluated so its single\
    \ result will be returned to the caller. For example:\n\n```php\nfunction square(\
    \ int $number )\n{\n    return $number * $number ;\n}\n\necho square( 3 ) ;  \
    \    # Outputs 9\n```\n\nTo ensure a function will only return a value of a desired\
    \ data type, the function declaration can, optionally, specify the return type\
    \ description such as `int`, `float`, `string`, `bool` or `array`, like this:\n\
    \n```php\nfunction *function_name ( ) : int\n{\n    statement-to-be-executed ;\n\
    \    statement-to-be-executed ;\n    return value ;\n}\n```\n\nWhen a return data\
    \ type is specified, a function that attempts to return an incorrect data type\
    \ to the caller will result in an error.\n\n![image](Image00003.jpg)\n\nThe ability\
    \ to specify a return data type is a new feature in PHP 7.\n\n![image](Image00029.jpg)\n\
    \nreturn.php\n\n![image](Image00085.jpg) Begin a PHP script by defining a function\
    \ that must only return an array of data\n\n```php\n<?php\nfunction supply ()\
    \ : array\n{\n    // Statement to be inserted here.\n}\n```\n\n![image](Image00086.jpg)\
    \ Next, insert a statement to return an array of four mixed values\n\n```php\n\
    return array ( 75 , 3.142 , ‘Super PHP’ , True ) ;\n```\n\n![image](Image00087.jpg)\
    \ After the function, add a statement that calls the function and assigns the\
    \ returned array values to a variable\n\n```php\n$array = supply () ;\n```\n\n\
    ![image](Image00088.jpg) Finally, add a loop to display each of the values returned\
    \ from the function\n\n```php\nforeach( $array as $data )\n{\n    echo “Element\
    \ Value : $data <br>”\n}\n\n?>\n```\n\n![image](Image00089.jpg) Save the document\
    \ in your web server’s `/htdocs` directory as `return.php` then open the page\
    \ via HTTP to see the returned values\n\n![image](Image00095.jpg)\n\n![image](Image00006.jpg)\n\
    \nIn PHP the Boolean `TRUE` value is represented numerically as 1.\n\n### Calling\
    \ back\n\nPHP allows you to create “anonymous” functions that have no name specified\
    \ in the function definition. Like other functions, these can accept arguments\
    \ if parameters are specified and they can optionally return a value when called.\
    \ Unlike other function definitions, which are code constructs, an anonymous function\
    \ definition is an expression. This means that each anonymous function definition\
    \ must be terminated by a semicolon, like this:\n\n```php\nfunction ( )\n{\n \
    \   statement-to-be-executed ;\n    statement-to-be-executed ;\n    return value\
    \ ;\n} ;\n```\n\n![image](Image00019.jpg)\n\nDon’t forget to add a terminating\
    \ `;` semicolon after each anonymous function definition.\n\nOn its own an anonymous\
    \ function is of little use as, without a name, it cannot be called, but it can\
    \ be useful in other ways:\n\n- Assigned to a variable, an anonymous function\
    \ can be called using the variable name\n- Passed as a callable argument to another\
    \ function, an anonymous function can be called later as a “callback”\n- Returned\
    \ from a function, an anonymous function retains access to the returning function’s\
    \ variables in “closure”\n\nBy assigning an anonymous function to a variable you\
    \ do, in effect, give the function a name and can call it and pass it arguments\
    \ as you would any other function – using the variable name. Similarly, when you\
    \ pass an anonymous function to another function it can be called back and passed\
    \ arguments as you would any other function – using the parameter name. The PHP\
    \ `use` keyword and `&` ampersand prefix allows an anonymous function to reference\
    \ a local variable in the returning function.\n\n![image](Image00029.jpg)\n\n\
    callback.php\n\n![image](Image00085.jpg) Begin a PHP script by assigning to a\
    \ variable an anonymous function that accepts a single argument\n\n```php\n<?php\n\
    $hello = function ( $user ) { echo “Hello $user !<br>” } ; ;\n```\n\n![image](Image00086.jpg)\
    \ Next, add a statement that calls the anonymous function and passes a single\
    \ argument\n\n```php\n$hello ( ‘Mike’ ) ;\n```\n\n![image](Image00087.jpg) Now,\
    \ define a regular function that accepts a single callable argument and calls\
    \ that function passing a string\n\n```php\nfunction greet ( callable $anon )\n\
    {\n    $anon ( ‘Carole Anne’ ) ;\n}\n```\n\n![image](Image00088.jpg) Add a statement\
    \ to call the function, defined in the previous step, passing the anonymous function\
    \ that was assigned to a variable in the first step\n\n```php\ngreet( $hello )\
    \ ;\n```\n\n![image](Image00089.jpg) Next, define another regular function, which\
    \ has one local variable and returns an anonymous function that references the\
    \ local variable value\n\n```php\nfunction meet () : callable\n{\n    $time =\
    \ ‘morning’ ;\n    return function( $name ) use( & $time )\n    { return “Good\
    \ $time , $name !” } ;\n}\n```\n\n![image](Image00091.jpg) Assign to a variable\
    \ the function defined in the previous step\n\n```php\n$meeting = meet () ;\n\
    echo $meeting ( ‘Susan’ ) ;\n\n?>\n```\n\n![image](Image00096.jpg) Save the document\
    \ in your web server’s `/htdocs` directory as `callback.php` then open the page\
    \ via HTTP to see the returned values from anonymous functions\n\n![image](Image00097.jpg)\n\
    \n![image](Image00006.jpg) Remember to include the `&` ampersand prefix to create\
    \ a reference to the variable.\n\n![image](Image00005.jpg) (Wait, checking image\
    \ order) Notice that the final function call gets the ‘morning’ string from the\
    \ parent scope.\n\n**Summary**\n\n- Custom functions allow PHP scripts to be modularized\
    \ into sections of code that are easier to understand and maintain\n- Function\
    \ names must begin with a letter or underscore character and are not case-sensitive\n\
    - A function is defined by stating its name after the `function` keyword, then\
    \ parentheses and braces containing statements\n- A function accepting arguments\
    \ is defined by including a comma-separated list of parameters within the parentheses\n\
    - Optionally, a function definition can specify the type of data to be passed\
    \ from the caller by including a data type before the parameter name\n- Argument\
    \ data is normally passed by value but can be passed by reference if the parameter\
    \ name is given `&`\n- Default argument values can optionally be specified in\
    \ a function definition by assignment to the parameter name\n- When a parameter\
    \ name is given `...` splat operator, multiple arguments can be passed to that\
    \ parameter to create an array\n- Variables created outside a function have global\
    \ scope, but are not accessible from within a function block unless it includes\
    \ a declaration using the `global`\n- Variables created inside a function have\
    \ local scope so are only accessible from within that function block\n- Local\
    \ variables lose their value when the program scope leaves the function, but `static`\
    \ variables retain their value\n- The `return` keyword returns a single item to\
    \ the caller and the function definition can optionally specify the return data\
    \ type\n- An anonymous function definition does not specify a name but is an expression\
    \ so must end with a `;`\n- The `use` keyword and `&` ampersand prefix allow an\
    \ anonymous function to reference a local variable in the returning function\n\
    \n**Manipulating strings**\n\n*This chapter demonstrates various ways to manipulate\
    \ text strings in PHP scripts.*\n\n- Comparing characters\n- Searching text\n\
    - Extracting substrings\n- Changing case\n- Formatting strings\n- Making dates\n\
    - Encoding entities\n- Summary\n\n**Comparing characters**\n"
  raw: 'A **return** statement can include an expression to be evaluated so its single
    result will be returned to the caller. For example:


    **function square( int $number )**


    **{**


    **return $number * $number ;**


    **}**


    **echo square( 3 ) ;         # Outputs 9**


    To ensure a function will only return a value of a desired data type, the function
    declaration can, optionally, specify the return type description such as **int**
    , **float** , **string** , **bool** or **array** , like this:


    **function *function_name* ( ) : int**


    **{**


    ***statement-to-be-executed ;


    statement-to-be-executed ;*


    return *value ;***


    **}**


    When a return data type is specified, a function that attempts to return an incorrect
    data type to the caller will result in an error.


    ![image](Image00003.jpg)


    The ability to specify a return data type is a new feature in PHP 7.


    ![image](Image00029.jpg)


    return.php


    ![image](Image00085.jpg)  Begin a PHP script by defining a function that must
    only return an array of data


    **<?php**


    **function supply () : array**


    **{**


    **// Statement to be inserted here.**


    **}**


    ![image](Image00086.jpg)  Next, insert a statement to return an array of four
    mixed values


    **return array ( 75 , 3.142 , ‘Super PHP’ , True ) ;**


    ![image](Image00087.jpg)  After the function, add a statement that calls the function
    and assigns the returned array values to a variable


    **$array = supply () ;**


    ![image](Image00088.jpg)  Finally, add a loop to display each of the values returned
    from the function


    **foreach( $array as $data )**


    **{**


    **echo “Element Value : $data <br>” ;**


    **}**


    **?>**


    ![image](Image00089.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **return.php**  then open the page via HTTP to see the returned values


    ![image](Image00095.jpg)


    ![image](Image00006.jpg)


    In PHP the Boolean **TRUE** value is represented numerically as 1.


    **Calling back**


    PHP allows you to create “anonymous” functions that have no name specified in
    the function definition. Like other functions, these can accept arguments if parameters
    are specified and they can optionally return a value when called. Unlike other
    function definitions, which are code constructs, an anonymous function definition
    is an expression. This means that each anonymous function definition must be terminated
    by a semicolon, like this:


    **function ( )**


    **{**


    ***statement-to-be-executed ;


    statement-to-be-executed ;*


    return *value ;***


    **} ;**


    ![image](Image00019.jpg)


    Don’t forget to add a terminating **;** semicolon after each anonymous function
    definition.


    On its own an anonymous function is of little use as, without a name, it cannot
    be called, but it can be useful in other ways:


    • Assigned to a variable, an anonymous function can be called using the variable
    name


    • Passed as a callable argument to another function, an anonymous function can
    be called later as a “callback”


    • Returned from a function, an anonymous function retains access to the returning
    function’s variables in “closure”


    By assigning an anonymous function to a variable you do, in effect, give the function
    a name and can call it and pass it arguments as you would any other function –
    using the variable name. Similarly, when you pass an anonymous function to another
    function it can be called back and passed arguments as you would any other function
    – using the parameter name. The PHP **use** keyword and **&** ampersand prefix
    allows an anonymous function to reference a local variable in the returning function.


    ![image](Image00029.jpg)


    callback.php


    ![image](Image00085.jpg)  Begin a PHP script by assigning to a variable an anonymous
    function that accepts a single argument


    **<?php**


    **$hello = function ( $user ) { echo “Hello $user !<br>” ; } ;**


    ![image](Image00086.jpg)  Next, add a statement that calls the anonymous function
    and passes a single argument


    **$hello ( ‘Mike’ ) ;**


    ![image](Image00087.jpg)  Now, define a regular function that accepts a single
    callable argument and calls that function passing a string


    **function greet ( callable $anon )**


    **{**


    **$anon ( ‘Carole Anne’ ) ;**


    **}**


    ![image](Image00088.jpg)  Add a statement to call the function, defined in the
    previous step, passing the anonymous function that was assigned to a variable
    in the first step


    **greet( $hello ) ;**


    ![image](Image00089.jpg)  Next, define another regular function, which has one
    local variable and returns an anonymous function that references the local variable
    value


    **function meet () : callable**


    **{**


    **$time = ‘morning’ ;**


    **return function( $name ) use( & $time )**


    **{ return “Good $time , $name !” ; } ;**


    **}**


    ![image](Image00091.jpg)  Assign to a variable the function defined in the previous
    step then call that function, passing a string argument


    **$meeting = meet () ;**


    **echo $meeting ( ‘Susan’ ) ;**


    **?>**


    ![image](Image00096.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **callback.php**  then open the page via HTTP to see the returned values from
    anonymous functions


    ![image](Image00097.jpg)


    ![image](Image00006.jpg)


    Remember to include the & ampersand prefix to create a reference to the variable
    value.


    ![image](Image00005.jpg)


    Notice that the final function call gets the ‘morning’ string from the parent
    scope.


    **Summary**


    • Custom functions allow PHP scripts to be modularized into sections of code that
    are easier to understand and maintain


    • Function names must begin with a letter or underscore character and are not
    case-sensitive


    • A function is defined by stating its name after the **function** keyword, then
    parentheses and braces containing statements


    • A function accepting arguments is defined by including a comma-separated list
    of parameters within the parentheses


    • Optionally, a function definition can specify the type of data to be passed
    from the caller by including a data type description before the parameter name


    • Argument data is normally passed by value but can be passed by reference if
    the parameter name is given an **&** prefix


    • Default argument values can optionally be specified in a function definition
    by assignment to the parameter name


    • When a parameter name is given a **...** splat operator prefix, multiple arguments
    can be passed to that parameter to create an array


    • Variables created outside a function have global scope, but are not accessible
    from within a function block unless it includes a declaration using the **global**
    keyword


    • Variables created inside a function have local scope so are only accessible
    from within that particular function block


    • Local variables lose their value when the program scope leaves the function,
    but **static** variables retain their value


    • The **return** keyword returns a single item to the caller and the function
    definition can optionally specify the return data type


    • An anonymous function definition does not specify a name but is an expression
    so must end with a **;** semicolon


    • The **use** keyword and **&** ampersand prefix allow an anonymous function to
    reference a local variable in the returning function


    6


    **Manipulating strings**


    *This chapter demonstrates various ways to manipulate text strings in PHP scripts.*


    [**Comparing characters**](#text00008.html_sec39)


    [**Searching text**](#text00008.html_sec40)


    [**Extracting substrings**](#text00008.html_sec41)


    [**Changing case**](#text00008.html_sec42)


    [**Formatting strings**](#text00008.html_sec43)


    [**Making dates**](#text00008.html_sec44)


    [**Encoding entities**](#text00008.html_sec45)


    [**Summary**](#text00008.html_sec46)


