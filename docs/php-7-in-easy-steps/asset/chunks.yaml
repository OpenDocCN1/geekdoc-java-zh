    \ `strcmp()` 函数，因此会返回 1，因为第一个参数大于第二个。相反，如果你指定“A”（65）作为第一个参数，将“a”（97）作为第二个参数，那么\
    \ `strcmp()` 函数将返回 -1，因为第一个参数小于第二个。在字符串比较中，每个字符都按顺序比较，以确保包含不同顺序相同字符的字符串不会被错误地视为相等。例如，比较“ABC”和“BAC”，第一个字符“A”（65）\
