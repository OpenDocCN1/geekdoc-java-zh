    **Assessing logic**


    The logical operators most commonly used in PHP scripts are listed in the table
    below:


    | **Operator:** |  | **Operation:** |


    | **and** | **&&** | Logical AND |


    | **or** | **&#124;&#124;** | Logical OR |


    | **xor** |  | Logical eXclusive OR |


    | **!** |  | Logical NOT |


    ![image](Image00005.jpg)


    The **&&** operator is an alternative form of the **and** operator. Similarly,
    the **||** operator is an alternative form of the **or** operator.


    The logical operators are used with operands that have the Boolean values of **TRUE**
    or **FALSE** , or an expression that can convert to **TRUE** or **FALSE** .


    The **and** operator will evaluate two operands and return **TRUE** , only if
    both operands are themselves **TRUE** . Otherwise the **and** operator will return
    **FALSE** . This is used in conditional branching where the direction of a PHP
    script is determined by testing two conditions. If both conditions are satisfied
    the script will go in a certain direction, otherwise it will take a different
    direction.


    ![image](Image00005.jpg)


    The term “Boolean” refers to a system of logical thought developed by the English
    mathematician George Boole (1815-1864).


    ![image](Image00063.jpg)


    Unlike the **and** operator that needs both operands to be **TRUE** the **or**
    operator will evaluate two operands and return **TRUE** if either one of the operands
    is itself **TRUE** . If neither operand is **TRUE** then the **or** operator will
    return **FALSE** . This is useful to perform an action if either one of two test
    conditions has been met.


    The **xor** operator will evaluate two operands and only return **TRUE** if either
    one of the operands is itself **TRUE** – but not both. If neither operand is **TRUE**
    , or if both operands are **TRUE** , the **xor** operator will return **FALSE**
    .


    The **!** logical NOT operator is a “unary” operator – that is used before a single
    operand. It returns the inverse value of the given operand, so if the variable
    **$var** is a **TRUE** value then **! $var** would return a **FALSE** value. The
    **!** operator is useful to toggle the value of a variable in a loop with a statement
    like $ **var = ! $var** . On each iteration the value is reversed, like flicking
    a switch on and off.


