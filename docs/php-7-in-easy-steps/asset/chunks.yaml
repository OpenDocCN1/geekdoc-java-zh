    ## 理解优先级


    PHP 优先级决定了表达式的分组。例如，表达式 `1 + 5 * 3` 结果为 16，因为 `*` 运算符的优先级高于 `+` 运算符。括号可以指定优先级，例如
    `(1 + 5) * 3` 结果为 18。相同优先级的结合性决定了表达式的分组。下表列出了按优先级排序的运算符，优先级位于顶部。


    | 运算符 | 结合性 |

    | :--- | :--- |

    | `**` | Right |

    | `++` | Right |

    | `!` | Right |

    | `.*` | Left |

    | `+` | Left |

    | `<<` | Left |

    | `>>` | Left |

    | `<` | Left |

    | `!=` | Left |

    | `==` | Left |

    | `<=` | Left |

    | `>=` | Left |

    | `&` | Left |

    | `^` | Left |

    | `|` | Left |

    | `&&` | Left |

    | `||` | Left |

    | `??` | Right |

    | `=` | Left |

    | `+=` | Left |

    | `-=` | Left |

    | `*=` | Left |

    | `/=` | Left |

    | `%=` | Left |

    | `<<=` | Left |

    | `>>=` | Left |

    | `&=` | Left |

    | `^=` | Left |

    | `|=` | Left |

    | `??=` | Left |


    ![image](img/Image00019.jpg) 注意逻辑运算符的变体形式优先级不同。这会导致表达式 `$bool = true and false`
    产生意外结果，而 `$bool = true && false` 则不同。尝试使用 `var_dump($bool)` 查看差异。


