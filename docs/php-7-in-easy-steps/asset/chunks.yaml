  trans: "\n\n![image](img/Image00038.jpg) 现在，添加一个函数来验证参数是否为格式正确的电子邮件地址：\n\n```php\n\
    function validate( $email )\n{\n  if ( filter_var( $email , FILTER_VALIDATE_EMAIL\
    \ ) )\n  { echo( “<hr> $email IS a valid email address” ) ; }\n  else\n  { echo(\
    \ “<hr> $email IS NOT a valid email address” ); }\n}\n```\n\n![image](img/Image00039.jpg)\
    \ 创建一个包含非法空格的电子邮件地址并尝试验证，然后对该地址进行清理并再次尝试验证\n\n```php\n<?php\n$email = ‘mike @example.com’\
    \ ;\nvalidate( $email ) ;\n$email = filter_var( $email , FILTER_SANITIZE_EMAIL\
    \ ) ;\nvalidate( $email ) ;\n?>\n```\n\n![image](img/Image00040.jpg) 将文档保存到 Web\
    \ 服务器的 `/htdocs` 目录中并命名为 `filter.php`，然后通过 HTTP 打开它以查看过滤结果\n\n![image](img/Image00163.jpg)\n\
    \n![image](img/Image00019.jpg)\n\n用户提交输入可能会破坏你的网页，因此应该始终对其进行验证。\n\n### 发送隐藏数据\n\
    \n除了用户输入到 HTML 表单输入字段中的数据外，PHP 生成的数据可以使用 HTML 隐藏表单字段进行提交。与普通输入字段一样，这些字段也会向表单处理脚本发送\
    \ `name=value` 对，但这里的值是由 PHP 提供的，而不是用户。\n\n通常，使用隐藏表单字段提交的数据可能包括用户的登录名称和提交的时间戳：\n\
    \n![image](img/Image00029.jpg)\n\nhidden.php\n\n![image](img/Image00036.jpg) 创建一个包含\
    \ PHP 脚本的 HTML 文档以定义时区并初始化两个变量\n\n```php\n<?php\ndate_default_timezone_set( ‘UTC’\
    \ ) ;\n$time = date( ‘ H:i , F j ‘ ) ;\n$user = ‘Mike’ ;\n```\n\n![image](img/Image00037.jpg)\
    \ 现在，添加一个语句来编写一个完整的表单，包含一个普通输入字段和两个隐藏字段，其值由变量设置\n\n```php\necho ‘\n<form action=”\
    \ hidden_handler.php ” method=” POST ”>\n<fieldset>\n<legend>Send us your comments</legend>\n\
    <textarea rows=”5” cols=”20” name=” comment ”>\n</textarea>\n<input type=”hidden”\
    \ name=” user ” value=” ‘. $user .’ “>\n<input type=”hidden” name=” time ” value=”\
    \ ‘. $time .’ “>\n</fieldset><p><input type=”submit” ></p></form> ' ;\n?>\n```\n\
    \n![image](img/Image00038.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录中并命名为 `hidden.php`\n\
    \n![image](img/Image00019.jpg)\n\n此示例中的时间戳是在表单创建时创建，而不是在表单提交时创建。\n\n![image](img/Image00029.jpg)\n\
    \nhidden_handler.php\n\n![image](img/Image00039.jpg) 接下来，创建一个包含 PHP 脚本的 HTML 文档，用提交的值初始化变量——如果没有提交值，则初始化为\
    \ `NULL`\n\n```php\n<?php\nif ( !empty ( $_POST[‘comment’] ) )\n{\n  $comment\
    \ = $_POST[‘comment’] ;\n}\nelse\n{\n  $comment = NULL ; echo ‘You must enter\
    \ a comment’ ;\n}\n```\n\n![image](img/Image00040.jpg) 现在，如果隐藏表单字段值已设置，则添加语句初始化两个变量\n\
    \n```php\n$time = ( !isset ( $_POST[‘time’] ) ) ? NULL : $_POST[‘time’] ;\n$user\
    \ = ( !isset ( $_POST[‘user’] ) ) ? NULL : $_POST[‘user’] ;\n```\n\n![image](img/Image00041.jpg)\
    \ 最后，添加一个语句来输出有效的提交数据\n\n```php\nif ( ( $comment != NULL ) && ( $time != NULL\
    \ ) && ( $user != NULL ) )\n{ echo “<p>Comment received : \\” $comment \\”<br>\
    \ From $user at $time </p>” ; }\n?>\n```\n\n![image](img/Image00042.jpg) 将文档保存到\
    \ Web 服务器的 `/htdocs` 目录中并命名为 `hidden_handler.php`，然后通过 HTTP 打开 `hidden.php` 并提交表单以查看响应\n\
    \n![image](img/Image00164.jpg)\n\n![image](img/Image00165.jpg)\n\n![image](img/Image00005.jpg)\n\
    \n注意这里使用了三元运算符 `? :` 代替了更长的 `if else` 语句。\n\n![image](img/Image00006.jpg)\n\n\
    你可以通过在引号前加反斜杠来转义它们，从而在输出中包含引号——此处所示。\n\n### 处理提交\n\n本章到目前为止的示例都使用了两个文档——一个用于显示\
    \ HTML 表单，另一个用于处理表单提交。然而，此过程可以通过单个文档完成，使用一种简单的技术来判断应该显示表单还是处理表单。\n\n使用超全局变量 `$_REQUEST_METHOD`\
    \ 来判断表单是通过 `POST` 还是 `GET` 提交的，从而显示或处理表单。如果表单是通过 `POST` 提交，脚本将处理数据并再次显示表单，通常是通过覆盖\
    \ `$_POST` 数组来实现，该数组随后将用于验证。\n\n![image](img/Image00029.jpg)\n\nsingle.php\n\n\
    ![image](img/Image00036.jpg) 创建一个包含 PHP 脚本的 HTML 文档，该脚本检查请求\n\n```php\n<?php\n\
    if ( $_SERVER['REQUEST_METHOD'] != 'POST' )\n{\n  # 显示表单\n}\nelse\n{\n  # 处理提交\n\
    }\n?>\n```\n\n![image](img/Image00037.jpg) 现在，使用 `echo` 插入语句显示表单\n\n```php\necho\
    \ ‘\n<form action=” single.php ” method=” POST ”>\n...\n?>\n```\n（注意：action 属性应指向\
    \ `single.php` 文件）\n)\n\n![image](img/Image00038.jpg) 接下来，当表单为 `POST` 时插入一个语句处理提交\n\
    \n```php\nif ( !empty ( $_POST['comment'] ) )\n{\n  $comment = $_POST['comment']\
    \ ;\n  echo “Comment : $comment “ ;\n}\nelse\n{\n  $comment = NULL ; echo ‘You\
    \ must enter a comment’ ;\n}\n```\n\n![image](img/Image00040.jpg) 最后，插入一个语句再次显示表单，并保留提交的数据\n\
    \n```php\n<input type=”text” name=” comment ” value=” <?php if ( isset($_POST['comment']))\
    \ ) echo $_POST['comment'] ; ?> ”>\n```\n（注意：value 属性应使用在 `input` 或 `textarea`\
    \ 标签内）\n\n"
- fmt: "\n```html\n<input type=”text” name=” email ” value=” <?php if ( isset( $_POST[\
    \ ‘email’ ] ) ) echo $_POST[ ‘email’ ] ; ?> ”></p>\n<p><input type=”submit”></p>\n\
    </form>\n```\n\n![image](Image00037.jpg) Now, add a PHP script to handle the form\
    \ submission\n\n```php\n<?php\nif ( $_SERVER[ ‘REQUEST_METHOD’ ] == ‘POST’ )\n\
    {\n// Statements to be inserted here (steps 3-5).\n}\n?>\n```\n\n![image](Image00038.jpg)\
    \ Next, insert into the PHP script block a statement to create an array for error\
    \ messages\n\n```php\n$errors = array() ;\n```\n\n![image](Image00005.jpg) `$_SERVER[\
    \ ‘PHP_SELF’ ]` is used by this example to ensure the script will still work if\
    \ renamed.\n\n![image](Image00006.jpg) The `if` statement tests that the form\
    \ has been submitted by checking the request method is `POST`, not the `GET` method\
    \ that is used to display the empty form.\n\n![image](Image00039.jpg) Then, insert\
    \ statements to initialize variables with submitted values, or add to the errors\
    \ array for omissions\n\n```php\nif ( empty( $_POST[ ‘name’ ] ) ) { $errors[]\
    \ = ‘name’ ; }\nelse { $name = trim( $_POST[ ‘name’ ] ) ; }\nif ( empty( $_POST[\
    \ ‘email’ ] ) ) { $errors[] = ‘email’ ; }\nelse { $email = trim( $_POST[ ‘email’\
    \ ] ) ; }\n```\n\n![image](Image00040.jpg) Now, insert statements to write error\
    \ messages or confirm successful form submission\n\n```php\nif( !empty( $errors\
    \ ) )\n{ echo ‘Error! Please enter your ‘ ;\nforeach ( $errors as $msg ) { echo\
    \ “ - $msg “ ; } }\nelse { echo “Success! Thanks $name “ ; }\n```\n\n![image](Image00041.jpg)\
    \ Save the document in your web server’s `/htdocs` directory as `sticky.php` then\
    \ open it via HTTP and submit the form to see the retained values and response\
    \ messages.\n\n![image](Image00170.jpg)\n\n![image](Image00171.jpg)\n\n![image](Image00005.jpg)\
    \ It is good practice to use the `trim()` function, as seen here, to remove any\
    \ leading and trailing spaces from the submitted field value.\n\n### Uploading\
    \ files\n\nThe PHP `$_FILES` superglobal variable makes it simple to `POST` file\
    \ uploads from an HTML form if the `<form>` tag includes an `enctype` attribute\
    \ set to “multipart/formdata”. When submitted, a `$_FILES` associative array is\
    \ created with keys that include the file `name`, a generated temporary name (`tmp_name`),\
    \ and the file `size`. The file name and size can be used for validation. The\
    \ temporary filename can then be specified to the `move_uploaded_file()` function\
    \ along with the original filename to upload the file:\n\n![image](Image00029.jpg)\n\
    \nupload.php\n\n![image](Image00036.jpg) Create an HTML document containing a\
    \ sticky form with a file type input named “image”\n\n```html\n<form action=”\
    \ <?php $_SERVER[ ‘PHP_SELF’ ] ?>”\nmethod=”POST” enctype = “multipart/formdata”\
    \ >\nSelect an image to upload :\n<input type=”file” name=” image ” >\n<input\
    \ type=”submit” value=”Upload Image”> </form>\n```\n\n![image](Image00037.jpg)\
    \ Now add a PHP script to handle the form submission\n\n```php\n<?php\nif ( $_SERVER[\
    \ ‘REQUEST_METHOD’ ] == ‘POST’ )\n{\n// Statements to be inserted here (steps\
    \ 3-7).\n}\n?>\n```\n\n![image](Image00038.jpg) Next, insert statements to initialize\
    \ three variables with information about the file selected by the user\n\n```php\n\
    $name = $_FILES[ ‘ image ’ ][ ‘name’ ] ;\n$temp = $_FILES[ ‘ image ’ ][ ‘tmp_name’\
    \ ] ;\n$size = $_FILES[ ‘ image ’ ][ ‘size’ ] ;\n```\n\n![image](Image00039.jpg)\
    \ Now, insert statements to ensure the selected file is of a desired file type\
    \ by testing the file extension, or quit\n\n```php\n$ext = pathinfo( $name , PATHINFO_EXTENSION\
    \ ) ;\n$ext = strtolower( $ext ) ;\nif( $ext != ‘png’ && $ext != ‘jpg’ && $ext\
    \ != ‘gif’ )\n{ echo ‘Format must be PNG, JPG, or GIF’ ; exit() ; }\n```\n\n![image](Image00040.jpg)\
    \ Insert a statement to ensure the selected file is of a desired file size, or\
    \ quit\n\n```php\nif( $size > 512000 )\n{ echo ‘File size must not exceed 500Kb’\
    \ ; exit() ; }\n```\n\n![image](Image00019.jpg) The PHP configuration must permit\
    \ file uploads for this example to work. The configuration file `php.ini`, within\
    \ the PHP directory, must contain a line `file_uploads = On`.\n\n![image](Image0005.jpg)\
    \ `pathinfo()` function provides the extension.\n\n![image](Image00041.jpg) Insert\
    \ a statement to ensure the selected file is of a desired file type by testing\
