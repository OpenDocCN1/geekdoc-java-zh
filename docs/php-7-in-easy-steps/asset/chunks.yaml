    # 1

    ## Getting started

    Welcome to the exciting world of the interactive web with PHP. This chapter demonstrates
    how to create a dynamic development environment with a web server and the PHP
    engine.


    * [Introducing PHP](#text00003.html_sec1)

    * [Installing the Abyss server](#text00003.html_sec2)

    * [Installing the PHP engine](#text00003.html_sec3)

    * [Integrating Abyss and PHP](#text00003.html_sec4)

    * [Embedding PHP script code](#text00003.html_sec5)

    * [Scripting by the rules](#text00003.html_sec6)

    * [Summary](#text00003.html_sec7)


    ## Introducing PHP

    The most appealing modern websites provide a customized user experience by dynamically
    responding to some current condition – user name, time of day, latest blog, shopping
    cart contents, etc. Many of these dynamic websites are created using PHP.


    ### What is PHP?

    PHP is a widely-used general purpose scripting language that is especially suited
    for web development and can be embedded into HTML. It was created by programmer
    Rasmus Lerdorf, as a set of scripts to maintain his website that he released as
    “Personal Home Page Tools (PHP Tools) version 1.0” on June 8, 1995.


    ![](Image00001.jpg)


    This is the official logo of the PHP project – the official online home of PHP
    can be found at [php.net](http://www.php.net)


    The tools were extended in the version 2 release of 1997, and the name changed
    to become a recursive acronym “PHP: Hypertext Preprocessor” in version 3 the following
    year. Performance, reliability and extensibility was improved in 2000 with the
    release of PHP4, which was powered by the Zend engine virtual machine.


    Subsequently, PHP5 was released in 2004 powered by the new Zend II engine and
    produced as free software by the PHP group. A planned experimental version PHP6,
    that intended to introduce native Unicode support throughout PHP was abandoned.
    The current version PHP7 was released in 2015, and is powered by the latest Zend
    3 engine that offers improved performance. Today PHP is installed on over 20 million
    websites and 1 million web servers.


    ![](Image00002.jpg)


    This is the “elePHPant” – the mascot of the PHP project, designed by Vincent Pontier.


    **Why is PHP popular?**


    * PHP is extremely simple for a newcomer, but offers many advanced features for
    a professional programmer.

