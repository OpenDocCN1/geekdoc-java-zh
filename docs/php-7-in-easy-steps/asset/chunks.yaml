    ![image](Image00054.jpg)  Add an initial PHP script to make sessions available


    **<?php session_start(); ?>**


    ![image](Image00055.jpg)  Begin a PHP script to handle failed validation attempts


    **<?php**


    **function reject ( $entry )**


    **{**


    **echo “Invalid $entry <br>” ;**


    **echo ‘Please <a href=” session_form.html ”>Log In</a>’ ;**


    **exit() ;**


    **}**


    ![image](Image00056.jpg)  Add a conditional test block to set two cookies for
    valid data, or call the function to handle failed attempts


    **if( isset( $_POST[ ‘user’ ] ) )**


    **{**


    **$user = trim( $_POST[ ‘user’ ] ) ;**


    **if( !ctype_alpha( $user ) ) { reject( ‘User Name’ ) ; }**


    **if( isset( $_POST[ ‘pass’ ] ) )**


    **{**


    **$pass = trim( $_POST[ ‘pass’ ] ) ;**


    **if( !preg_match( ‘/^[A-Za-z0-9._]{8,}$/’ , $pass ) )**


    **{ reject( ‘Password’ ) ; }**


    **else**


    **{**


    **$_SESSION[ ‘user’ ] = $user ;**


    **$_SESSION[ ‘pass’ ] = $pass ;**


    **header( ‘Location: session_get.php ’ ) ;**


    **}**


    **}**


    **} else { header( ‘Location: session_form.html ’ ) ; }**


    **?>**


    ![image](Image00057.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **session_set.php**  then see overleaf how to retrieve data


    ![image](Image00006.jpg)


    The **ctype_alpha()** function returns true only if its argument contains letters.


    ![image](Image00005.jpg)


    The **preg_match()** function accepts a regular expression and a string argument.
    Regular expressions are beyond the remit of this book but you can precisely copy
    this example to allow the permissible password pattern described on the form.
    The password is left unencrypted in this example, to demonstrate later that the
    user password meets the specified requirements.


    **Getting sessions**


    Session data is accessible from the special **$_SESSION** global array variable
    after a call is made to the **session_start()** function. The PHP **isset()**
    function can seek an element of a specified name. When this confirms the element
    is present, its value can usefully be assigned to a regular script variable. This
    might be used to retrieve a stored username for output on a page. Where a sought
    element is absent, the script can offer an alternative to the user:


    ![image](Image00029.jpg)


    session_get.php


    ![image](Image00054.jpg)  Add an initial PHP script to make sessions available


    **<?php session_start() ; ?>**


    ![image](Image00055.jpg)  Now, begin a PHP script to find a session variable and
    retrieve data for output upon success, or provide an alternative for when the
    session variable is absent


    **<?php**


    **if( isset( $_SESSION[ ‘user’ ] ) )**


    **{**


    **$user = $_SESSION[ ‘user’ ] ;**


    **echo “<h1>Welcome $user !</h1><hr>” ;**


    **echo ‘<a href=” session_data.php ”>View Session</a>’ ;**


    **}**


    **else**


    **{ echo ‘Please <a href=” session_form.html ”>Log In</a>’ ; }**


    **?>**


    ![image](Image00056.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **session_get.php**


    ![image](Image00057.jpg)  Now, open the HTML form  **session_form.html**  (created
    [here](#text00012.html_session) ) via HTTP and push the submit button to see the
    login attempt fail validation


    ![image](Image00191.jpg)


    ![image](Image00058.jpg)  Return to the HTML form and submit a valid username,
    to see the login attempt fail validation again


    ![image](Image00192.jpg)


    ![image](Image00061.jpg)  Return to the HTML form once more and enter a valid
    username and password to see validation succeed


    ![image](Image00193.jpg)


    ![image](Image00194.jpg)


    ![image](Image00184.jpg)  See overleaf how to view data stored in session variables,
    using the  **session_data.php**  target of the link seen above


    ![image](Image00006.jpg)


    You can also return to the HTML form and enter a password below the minimum length
    or containing invalid characters to see validation fail again.


    ![image](Image00005.jpg)


    Notice that the user in this example has added leading spaces before their name,
    but that’s okay – these will be removed by the **trim()** function used in the
    **session_set.php** script.


    **Viewing session data**


    The special PHP **$_SESSION** global array variable stores names and values in
    an associative array of keys and values. Stored content can be viewed by looping
    through the array to see all names and values, or using the PHP **var_dump()**
    function. Additionally, each session has a unique session ID number, which can
    be seen using the PHP **session_id()** function.


    ![image](Image00006.jpg)


    The uniqueness of each session allows variables to exist without conflict.


    Set session variables can be removed by specifying their element name to the PHP
    **unset()** function, and a session can be completely terminated by calling the
    **session_destroy()** function:


    ![image](Image00029.jpg)


    session_data.php


    ![image](Image00054.jpg)  Add an initial PHP script to make sessions available


    **<?php session_start(); ?>**


    ![image](Image00055.jpg)  Now, begin a PHP script to remove session variables,
    terminate a session, and confirm termination


    **<?php**


    **function kill_session()**


    **{**


    **unset( $_SESSION[ ‘user’ ] ) ;


    unset( $_SESSION[ ‘pass’ ] ) ;


    session_destroy() ;**


    **echo ‘<hr>Session Destroyed<br>’ ;


    echo ‘Session ID : ‘ .session_id(). ’<br>’ ;


    var_dump( $_SESSION ) ;**


    **}**


    ![image](Image00056.jpg)  Now, add a test to find if any session variables are
    set and retrieve all stored names and values


    **if( count( $_SESSION ) > 0 )**


    **{**


    **echo ‘<dl> ‘ ;**


    **foreach( $_SESSION as $key => $value )**


    **{**


    **echo “<dt>Key: $key ” ; echo “<dd>Value: $value ” ;**


    **}**


    **echo ‘</dl><hr>’ ;**


    **// Statements to be inserted here (step 4).**


    **}**


    ![image](Image00057.jpg)  Insert statements to display the session ID and array,
    then call the function to terminate the session


    **echo ‘Session ID : ‘ .session_id(). ’<br>’ ;**


    **var_dump( $_SESSION ) ;**


    **kill_session() ;**


    ![image](Image00005.jpg)


    You can assign a new value to a session variable at any time to overwrite an existing
    stored value.


    ![image](Image00058.jpg)  Add alternative output for when a session is absent


    **e** l**se**


    **{ echo ‘Please <a href=” session_form.html ”>Log In</a>’ ; }**


    **?>**


    ![image](Image00061.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **session_data.php**


    ![image](Image00184.jpg)  Now, open the HTML form  **session_form.html**  ([here](#text00012.html_session)
    ) via HTTP and enter valid login data, then follow the link on  **session_get.php**  ([here](#text00012.html_sess)
    ) to see session data


    ![image](Image00195.jpg)


    ![image](Image00196.jpg)'
