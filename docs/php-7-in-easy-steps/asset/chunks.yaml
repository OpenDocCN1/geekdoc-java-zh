    **Embracing polymorphism**


    The three cornerstones of Object Oriented Programming (OOP) are encapsulation,
    inheritance, and polymorphism. On the previous pages we have seen how data can
    be encapsulated within a PHP class, and how derived classes inherit the properties
    of their base class, so we can now explore the final cornerstone principle of
    polymorphism.


    ![image](Image00136.jpg)


    The term “polymorphism” (from Greek, meaning “many forms”) describes the ability
    to assign a different meaning or purpose to an entity according to its context.
    For example, in the real world everyone knows how to use a push button (entity)
    – you simply apply pressure to it. What that button does, however, depends on
    what is connected to it (context), but the result does not affect how that button
    is used.


    In the world of Object Oriented Programming, polymorphism allows classes to have
    different functionality while sharing a common interface. The interface does not
    need to know which class it is using because they are, like the real world button,
    all used the same way, but can produce different contextual results. Embracing
    polymorphism in this way enables the programmer to create interchangeable objects
    that can be selected according to requirement, rather than by conditional tests.


    A PHP interface is similar to a class but is declared using the **interface**
    keyword and can only contain method definitions, not any method statements to
    be executed, like this:


    **interface *InterfaceName***


    **{**


    **// Method definitions only go here.**


    **}**


    ![image](Image00006.jpg)


    Method definitions in a interface declaration may also specify parameters.


    Each class that implements an interface must implement all the methods it defines
    by specifying their statements to be executed. A class is attached to an interface
    by including the **implements** keyword and interface name in its declaration,
    like this:


    **class *ClassName* implements *InterfaceName***


    **{**


    **// Method implementations go here.**


    **}**


    The previous example can be modified to embrace polymorphism by adding an interface
    and a single function.


    ![image](Image00029.jpg)


    polymorphism.php


    ![image](Image00114.jpg)  Rename a copy of the previous example “inheritance.php”
    as a new program “polymorphism.php”


    ![image](Image00115.jpg)  Declare an interface named “Shape”, which contains a
    definition for the methods already implemented in the Rectangle and Triangle classes


    **interface Shape { public function area () ; }**


    ![image](Image00116.jpg)  Edit the first line of the Rectangle and Triangle class
    declarations – to associate them with the interface


    **class Rectangle extends Polygon implements Shape**


    **class Triangle extends Polygon implements Shape**


    ![image](Image00117.jpg)  After the class blocks, add a function that accepts
    an argument of the Shape type and calls its defined method


    **function getArea ( Shape $shape )**


    **{ return $shape -> area () ; }**


    ![image](Image00118.jpg)  Edit the two statements creating an instance of each
    derived class – to pass in argument values


    **$rect = new Rectangle ( 8 , 10 ) ;**


    **$trio = new Triangle ( 8 , 10 ) ;**


    ![image](Image00119.jpg)  Finally, edit the two statements to output the value
    returned by the unique method of each derived class, by calling each method via
    the interface


    **echo ‘Rectangle Area : ‘ . getArea ( $rect ). ’<hr>’ ;**


    **echo ‘Triangle Area : ‘ . getArea ( $trio ) ;**


    ![image](Image00121.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **polymorphism.php**  then open the page via HTTP to see the output via a
    polymorphic interface


    ![image](Image00137.jpg)


    ![image](Image00005.jpg)


    What’s going on here?


    Each call to the new **getArea()** function passes an instance object as an argument.


    The **getArea()** function calls the **area()** method defined in the interface.


    The output is returned from the implementation of the **area()** method of the
    associated instance.


    **Summary**


    • A PHP class is a data structure that can contain both variables and functions
    in a single entity


    • Classes are declared using the **class** keyword and can contain member variable
    properties and member function methods


    • Access to class members from outside the class is controlled by the **public**
    , **private** or **protected** access specifier keywords


    • Variable properties are encapsulated by declaring them **private** so their
    values can only be accessed by **public** methods


    • In order to create an object you must declare an instance of a **class** data
    structure using the **new** keyword


    • The special **->** object operator can be used to reference any visible class
    member


    • Setter and getter methods can reference a member of the same class using the
    **$this** pseudo-variable


    • A single setter method can assign multiple argument values, or default values,
    to initialize multiple variable properties


    • The __ **construct()** constructor method is called when a class is created
    and can be used to initialize variable properties


    • The __ **destruct()** destructor method is called when a class is destroyed
    and can be used to execute final statements


    • PHP has functions to interrogate classes, listing methods with **get_class_methods()**
    and variables with **get_class_vars()**


    • The three cornerstones of Object Oriented Programming are encapsulation, inheritance,
    and polymorphism


    • A derived class declaration will include the **extends** keyword to specify
    a base class from which to inherit members


    • An interface is declared using the **interface** keyword and the declaration
    may contain only method definitions


    • A class is attached to an interface by including the **implements** keyword
    and interface name in its declaration


    8


