  trans: "\n\n类（class）是一种可以在单个实体中同时包含变量和函数的数据结构。这些统称为该类的“成员”（members）——变量被称为类的“属性”（properties），而函数被称为类的“方法”（methods）。\n\
    \n![image](img/Image00113.jpg)\n\n从类外部访问类成员的行为由类声明中的“访问修饰符”（access specifiers）控制。通常，这些修饰符会拒绝对类变量的访问，但允许访问可以从这些变量中存储和检索数据的方法。这种“数据隐藏”技术确保了存储的数据安全地封装在类变量成员内部，是面向对象编程（OOP）的第一条原则。\n\
    \n类声明以 `class` 关键字开始，后面跟着一个空格，然后是程序员指定的名称——遵循通常 PHP 命名规范，但以大写字母开头。接下来是类属性声明，然后是类方法声明。这些类似于普通的变量和函数声明，但每个声明都应该以访问修饰符开头。类声明的语法如下：\n\
    \n```\nclass ClassName\n{\n    access-specifier $var1, $var2, $var3;\n    access-specifier\
    \ functionName1($arg1, $arg2, $arg3)\n    {\n        statements-to-execute;\n\
    \    }\n}\n```\n\n![image](img/Image00005.jpg)\n\n按照习惯，类名以大写字母开头，对象名以小写字母开头。\n\
    \n访问修饰符可以是 `public``private` 或 `protected` 关键字之一，用于指定列出成员的访问权限：\n\n* `public`\
    \ 成员可以在类可见的任何地方被访问\n* `private` 成员仅对定义它的同一类中的其他成员可访问\n* `protected` 成员仅对同一类的其他成员以及该类派生类的成员可访问\n\
    \n![image](img/Image00005.jpg)\n\n派生类将在本章稍后部分介绍——请参见此处。\n\n任何现实世界中的对象都可以通过它的属性和动作来定义。例如，狗有年龄、体重和颜色等属性，以及它可以执行的如叫等动作。PHP\
    \ 中的类机制提供了一种在脚本中创建虚拟狗对象的方法，其中类属性可以代表它的属性，类方法可以代表它的动作：\n\n```php\nclass Dog\n{\n\
    \    private $age;\n    private $weight;\n    private $color;\n    public function\
    \ bark() { echo ‘WOOF!’ ; }\n    // 在此处添加向属性中存储数据的方法。\n    // 在此处添加从属性中检索数据的方法。\n\
    }\n```\n\n![image](img/Image00006.jpg)\n\n虽然 PHP 脚本类不能完美模拟真实世界的对象，但目标是将所有相关的属性和动作封装为类属性和方法。\n\
    \n重要的是，类声明只定义了一个数据结构——为了创建一个对象，你必须声明该数据结构的一个“实例”（instance）。这通过使用 `new` 关键字将类的副本赋值给变量来实现，如下：\n\
    \n```php\n$fido = new Dog(); // 创建一个名为“fido”的实例\n// 属于程序员定义的\n// “Dog”数据结构。\n\
    ```\n\n实例对象是原始类数据结构的工作副本，因此保留了它的所有特性。由于上面示例中的方法已声明为 `public`，因此它在类声明外的脚本中是可见的。这意味着可以使用特殊的\
    \ `->` 对象操作符调用实例拷贝的方法，如下：\n\n```php\n$fido->bark(); // 输出 WOOF!\n```\n\n`->` 对象操作符可以用于引用任何可见的类成员，但上面示例中的变量属性已声明为\
    \ `private`，因此被封装在对象内部且无法直接访问。PHP 编程中的封装原则描述了在类成员中将数据和功能组合在一起——这些在这个 `Dog` 类中就是年龄、体重、颜色属性和\
    \ bark 动作。\n\n![image](img/Image00019.jpg)\n\n注意，在创建实例对象的语句中，必须在类名后添加括号。\n\n###\
    \ 创建对象\n\n为了从类的私有成员中分配和检索数据，必须向类中添加特殊的 `public` 访问方法。这些是用于分配数据的“setter”（设置器）方法，以及用于检索数据的“getter”（获取器）方法。访问方法通常以它们所处理的变量命名，首字母大大写，并分别以“set”或“get”作为前缀。例如，处理\
    \ `age` 变量的访问方法可以命名为 `setAge()` 和 `getAge()`。\n\nsetter 和 getter 方法可以使用特殊的 `$this`\
    \ “伪变量”引用同一类的成员，随后跟上 `->` 对象操作符和属性名。例如，使用 `$this->age` 来引用年龄属性：\n\n![image](img/Image00029.jpg)\n\
    \nobject.php\n\n![image](img/Image00114.jpg)  用语句开始 PHP 脚本声明一个名为“Dog”的类\n\n```php\n\
    <?php\nclass Dog\n{\n    // 在此处插入成员（步骤 2-5）。\n}\n```\n\n![image](img/Image00115.jpg)\
    \  在 Dog 类的括号之间，声明三个私有成员\n\n```php\nprivate $age;\nprivate $weight;\nprivate $color;\n\
    ```\n\n![image](img/Image00016.jpg)  在私有变量之后，添加一个公共方法以便在调用时输出字符串\n\n```php\npublic\
    \ function bark() { echo ‘WOOF! <br>’ ; }\n```\n\n![image](img/Image00117.jpg)\
    \  为每个私有变量添加 setter 方法以分配值\n\n```php\npublic function setAge(int $yrs) {\n   \
    \ $this->age = $yrs;\n}\npublic function setWeight(int $lbs) {\n    $this->weight\
    \ = $lbs;\n}\npublic function setColor(string $fur) {\n    $this->color = $fur;\n\
    }\n```\n\n![image](img/Image00118.jpg)  在类声明中，注意所有方法都是公共的，所有变量都是私有的。这种“公共接口，私有数据”的概念是一个核心。添加\
    \ getter 方法从每个私有变量中检索值\n\n```php\npublic function getAge() {\n    return $this->age;\n\
    }\npublic function getWeight() {\n    return $this->weight;\n}\npublic function\
    \ getColor() {\n    return $this->color;\n}\n```\n\n![image](img/Image00119.jpg)\
    \  在 Dog 类之后，声明一个名为“fido”的 Dog 类实例\n\n```php\n$fido = new Dog();\n```\n\n![image](img/Image00120.jpg)\n\
    \nFido\n\n![image](img/Image00121.jpg)  通过调用每个 setter 方法分配数据\n\n```php\n$fido->setAge(3);\n\
    $fido->setWeight(15);\n$fido->setColor('brown');\n```\n\n![image](img/Image00122.jpg)\
    \  通过调用每个 getter 方法检索分配的值\n\n```php\necho ‘Fido is a ‘ . $fido->getColor() . ‘\
    \ dog <br>’;\necho ‘Fido is ‘ . $fido->getAge() . ‘ years old <br>’;\necho ‘Fido\
    \ weighs ‘ . $fido->getWeight() . ‘ pounds<br>’;\n```\n\n![image](img/Image00123.jpg)\
    \  现在，添加对普通方法的调用\n\n```php\n$fido->bark();\n?>\n```\n\n![image](img/Image00124.jpg)\
    \  将文档保存到 Web 服务器的 `/htdocs` 目录并为 `object.php`，然后通过 HTTP 打开页面查看类属性和方法的调输出\n\n\
    ![image](img/Image00125.jpg)\n\n![image](img/Image00003.jpg)\n\nPHP 7 的新功能是还可以创建具有简单功能且没有的“匿名类”。例如，`$util\
    \ = new class { public function log($s) { echo $s ; } } ;`，可以通过 `$util->log( ‘Data’\
    \ )` 进行调用。\n\n![image](img/Image00005.jpg)\n\n随着新功能的引入，**object.php** 脚本将在接下来的几页中进行修改。\n\
    \n### 初始成员\n\n程序可以通过声明类的多个实例来轻松地创建多个对象，并且通过向其 setter 方法分配单独值，每个对象都可以拥有独特的属性。\n\
    \n"
- fmt: "\nIt is often convenient to combine the setter methods into a single method\
    \ that accepts arguments for each private variable. This means that all values\
    \ can be assigned with a single statement in the program, but the method will\
    \ contain multiple statements.\n\nOptionally, each parameter can specify a permissible\
    \ data type for each argument being passed, and may also usefully specify default\
    \ values to each parameter:\n\n![image](Image00029.jpg)\n\n`initializer.php`\n\
    \n![image](Image00114.jpg)  Rename a copy of the previous example “object.php”\
    \ as a new program “initializer.php”\n\n![image](Image00115.jpg)  In the `Dog`\
    \ class declaration, replace the three setter methods with a single combined setter\
    \ method that specifies the argument data types and default values\n\n```php\n\
    public function setValues(int $yrs = 2, int $lbs = 8, string $fur = ‘black’) {\n\
    \    // Statements to be inserted here.\n}\n```\n\n![image](Image00116.jpg)  In\
    \ the method definition block, insert three statements to assign values from passed\
    \ arguments to class variables\n\n```php\n$this->age = $yrs;\n$this->weight =\
    \ $lbs;\n$this->color = $fur;\n```\n\n![image](Image00117.jpg)  After the modified\
    \ class definition, replace the calls to the three setter methods by a single\
    \ call to the combined setter method – passing three arguments\n\n```php\n$fido\
    \ -> setValues(3, 15, ‘brown’);\n```\n\n![image](Image00118.jpg)  Declare a second\
    \ instance of the `Dog` class named “pooch”\n\n```php\n$pooch = new Dog();\n```\n\
    \n![image](Image00119.jpg)  Add a second call to the combined setter method –\
    \ passing three arguments for the new object\n\n```php\n$pooch -> setValues(4,\
    \ 18, ‘gray’);\n```\n\n![image](Image00005.jpg)\n\nTry passing an incorrect data\
    \ type to the initializer method to see a type error occur.\n\n![image](Image00121.jpg)\
    \  Add statements calling each getter method to retrieve the assigned values\n\
    \n```php\necho ‘<hr>Pooch: ‘ . $pooch -> getAge().’yrs’;\necho $pooch -> getWeight().’lbs\
    \ ’ . $pooch -> getColor();\n```\n\n![image](Image00122.jpg)  Add a second call\
    \ to the regular output method\n\n```php\n$pooch -> bark();\n```\n\n![image](Image00123.jpg)\
    \  Now, declare a third instance of the `Dog` class named “rover”\n\n```php\n\
    $rover = new Dog();\n```\n\n![image](Image00124.jpg)  Add a third call to the\
    \ combined setter method – this time passing no arguments for the new object\n\
    \n```php\n$rover -> setValues();\n```\n\n![image](Image00126.jpg)  Add statements\
    \ calling each getter method to retrieve the assigned values, which are specified\
    \ default values\n\n```php\necho ‘<hr>Rover: ‘ . $rover -> getAge().’yrs’;\necho\
    \ $rover -> getWeight().’lbs ’ . $rover -> getColor();\n```\n\n![image](Image00127.jpg)\
    \  Add a third call to the regular output method\n\n```php\n$rover -> bark();\n\
    ```\n\n![image](Image00128.jpg)  Save the document in your web server’s `/htdocs`\
    \ directory as `initializer.php` then open the page via HTTP to see the output\
    \ set by the combined initializer method\n\n![image](Image00129.jpg)\n\n![image](Image00130.jpg)\n\
    \n![image](Image00006.jpg) You must still call the initializer method here, to\
    \ assign the default values to the class variables passing no arguments.\n\n##\
    \ Using constructors\n\nClass variable members can be initialized by a special\
    \ “constructor” method that is called whenever an instance of the class is created.\
    \ The constructor method is always named `__construct()` and can accept arguments\
    \ to set the initial value of class variables.\n\n![image](Image00131.jpg)\n\n\
    A constructor method has a companion “destructor” method – that is called whenever\
    \ an instance of the class is destroyed. The destructor method is always named\
    \ `__destruct()`. Constructor and destructor methods have no return value and\
    \ are called automatically – they cannot be called explicitly, and consequently\
    \ their declarations need no access specifier\n\nValues to initialize class variables\
    \ are passed to the constructor method in the statement creating an object, following\
    \ the object name:\n\n![image](Image00029.jpg)\n\n`constructor.php`\n\n![image](Image00114.jpg)\
    \  Rename a copy of the previous example “initializer.php” as a new program “constructor.php”\n\
    \n![image](Image00115.jpg)  In the `Dog` class declaration, replace the `setValues`\
    \ method with this constructor\n\n```php\nfunction __construct(int $yrs = 2, int\
    \ $lbs = 8, string $fur = ‘black’) {\n    $this->age = $yrs;\n    $this->weight\
    \ = $lbs;\n    $this->color = $fur;\n}\n```\n\n![image](Image00116.jpg)  Now,\
    \ add a simple destructor\n\n```php\nfunction __destruct() { \n    echo ‘<hr>Object\
    \ Destroyed.’ \n}\n```\n\n![image](Image00117.jpg)  After the `Dog` class declaration,\
    \ edit the statement creating the “fido” object – to pass values to its constructor\
    \ method, in order to initialize properties\n\n```php\n$fido = new Dog(3, 15,\
    \ ‘brown’);\n```\n\n![image](Image00118.jpg)  Similarly, edit the statement creating\
    \ the “pooch” object – to pass values to the constructor method\n\n```php\n$pooch\
    \ = new Dog(4, 18, ‘gray’);\n```\n\n![image](Image00005.jpg) The definition of\
    \ a class method is also known as the method “implementation”.\n\n![image](Image00119.jpg)\
    \  Also edit the statement creating the “rover” object – to use default values\
    \ of the constructor method\n\n```php\n$rover = new Dog();\n```\n\n![image](Image00121.jpg)\
    \  Delete the statements calling the `setValues` method of all objects – the constructor\
    \ now replaces that method\n\n![image](Image00006.jpg) Although the initial values\
    \ of the variable members are set by the constructor, setter methods can be added\
    \ to subsequently change the values – and those new values can be retrieved by\
    \ the getter methods.\n\nPHP provides several functions to interrogate classes\
    \ such as `class_exists($class)`, `method_exists($class, $method)`, and `property_exists($class,\
    \ $property)` that return `TRUE` on success. You can also get a list of class\
    \ members with `get_class_vars($class)` and `get_class_methods($class)` to see\
    \ only “visible” members:\n\n![image](Image00122.jpg)  Add statements to display\
    \ the total number of accessible variables in the `Dog` class\n\n```php\n$items\
    \ = get_class_vars('Dog’);\necho ‘<br>Dog variables : ‘ .count($items);\n```\n\
    \n![image](Image00123.jpg)  Add statements to display the names of accessible\
    \ methods in the `Dog` class\n\n```php\necho ‘<br>Dog methods :’;\n$items = get_class_methods('Dog’);\n\
    foreach($items as $item) { echo “ $item , ” ; }\n```\n\n![image](Image00124.jpg)\
    \  Save the document in your web server’s `/htdocs` directory as `constructor.php`\
    \ then open the page via HTTP to see the output set by the constructor\n\n![image](Image00132.jpg)\n\
    \n![image](Image00005.jpg) The number of visible variables is zero. Temporarily\
    \ change their access specifier to public and see it become 3 – encapsulation\
    \ in action.\n\n## Inheriting properties\n\nA PHP class can be created as a brand\
    \ new class, like those in previous examples, or can be “derived” from an existing\
    \ class. Importantly, a derived class inherits members of the parent (base) class\
    \ from which it is derived – in addition to its own members.\n\n![image](Image00133.jpg)\n\
    \nThe ability to inherit members from a base class allows derived classes to be\
    \ created that share certain common properties, which have been defined in the\
    \ base class. For example, a “Polygon” base class may define width and height\
    \ properties that are common to all polygons. Classes of “Rectangle” and “Triangle”\
    \ could be derived from the `Polygon` class – inheriting width and height properties,\
    \ in addition to their own members defining their unique features.\n\n![image](Image00134.jpg)\n\
    \nThe virtue of inheritance is extremely powerful and is the second principle\
    \ of Object Oriented Programming (OOP).\n\nA derived class declaration adds the\
    \ `extends` keyword after its class name, followed by the name of class from which\
    \ it derives:\n\n![image](Image00029.jpg)\n\n`inheritance.php`\n\n![image](Image00114.jpg)\
    \  Begin a PHP script by declaring a base class named “Polygon”, which has two\
    \ private variables initialized by the constructor, and has two public getter\
    \ methods\n"
