  \ };\n\nString [] resultArray = { \"one\" , \"two\" , \"three\" };\n\n//Check that\
  \ two objects are equal\nassertEquals ( str1 , str2 );\n\n//Check that a condition\
  \ is true\nassertTrue ( val1 < val2 );\n\n//Check that a condition is false\nassertFalse\
