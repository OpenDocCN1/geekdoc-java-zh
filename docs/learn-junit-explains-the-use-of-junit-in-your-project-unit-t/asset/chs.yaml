- "# 学习 JUnit：解释如何在 Java 项目单元测试中使用 JUnit\n\n\n\n![](img/Image00004.jpg)\n\n我想将本书献给使用它的学生们。祝愿你们未来职业成功，希望你们永停止学习。\n\
  \n# 目录\n\n- 概述\n- 环境搭建\n- 测试框架\n- 基础用法\n- API\n- 编写测试用例\n- 使用断言\n- 执行步骤\n- 执行测试\n\
  - 测试套件\n- 忽略测试\n- 时间测试\n- 异常测试\n- 参数化测试\n- 集成 ANT 插件\n- 集成 Eclipse 插件\n- 扩展\n\n\
  # 概述\n\n测试是检查应用程序功能以确保其运行符合要求的过程。单元测试出现在开发人员层面；它是对单一实体（类或方法）的测试。单元测试在帮助软件公司向客户交付优质产品方面起着至关重要的作用。\n\
  \n单元测试有两种完成方式——手动测试和自动化测试。\n\n| 手动测试 | 自动化测试 |\n| :--- | :--- |\n| 在没有任何工具支持的情况下手动执行测试用例被称为手动测试。\
  \ | 借助工具支持并使用自动化工具执行测试用例被称为自动化测试。 |\n| **耗时且枯燥** —— 因为测试用例是由人工执行的，所以速度非常慢且枯燥。 |\
  \ **快速** —— 自动化运行测试用例的速度远快人工。 |\n| **巨大的人力投入** —— 由于测试用例需要手动执行，手动测试需要更多的测试人员。 |\
  \ **较的人力投入** —— 使用自动化工具执行测试用例，因此自动化测试需要的测试人员较少。 |\n| **可靠性较低** —— 手动测试的可靠性较低，因为它必须考虑到人为错误。\
  \ | **更可靠** —— 自动化测试是精确且可靠的。 |\n| **不可编程** —— 无法通过编程来编写复杂的测试以获取隐藏信息。 | **可编程的**\
  \ —— 测试人员可以编写复杂的测试来引出隐藏信息。 |\n\n## 什么是 JUnit？\n\nJUnit 是一个用于 Java 编程语言的单元测试框架。它在测试驱动开发中起着至关重要的作用，是一系列统称为\
  \ xUnit 的单元测试框架。\n\nJUnit 提倡“先测试后编码”的思想，强调为一段可以测试的代码设置测试数据，先进行测试然后再进行实现。这种方法类似于“测一点，写一点，再测，再写一点”。它提高了程序员的生产力和程序代码的稳定性，从而减少了程序员的压力和花费在调试的时间。\n\
  \n## JUnit 的特性\n\n- JUnit 是一个开源框架，用于编写和运行测试。\n- 提供注解（annotations）来识别测试方法。\n- 提供断言（assertions）来测试预期结果。\n\
  - 提供测试运行器（test runners）来运行测试。\n- JUnit 测试允许你更快地编写代码，从而提高质量。\n- JUnit 优雅地简单。它不复杂且耗费时间更短。\n\
  - JUnit 测试可以自动运行，它们会检查自己的结果并提供即时反馈。不需要手动梳阅测试结果报告。\n- JUnit 测试可以组织成测试套件，其中包含测试用例甚至其他测试套件。\n\
  - JUnit 在条中显示测试进度，如果测试运行顺利，条显示为绿色，当测试失败时变为红色。\n\n## 什么是单元测试用例？\n\n单元测试用例是代码的一部分，用于确保另一部分代码（方法）按预期工作。为了快速获得所需结果，需要一个测试框架。JUnit\
  \ 是 Java 编程语言的完美单元测试框架。\n\n正式书面的单元测试用例的特点是具有已知输入和预期输出，这些在测试执行之前就已经计算出来。必须定义已知输入和预期输出。\n\
  \n# 环境搭建\n\n## 本地搭建\n\nJUnit 是一个 Java 框架。\n\n### 系统要求\n\n- JDK: 1.5 或以上。\n- 内存：无要求。\n\
  - 磁盘空间：无要求。\n\n### 第 1 步：验证 Java\n\n首先，打开控制台验证 Java。\n\n| OS | 任务 | 命令 |\n| :---\
  \ | :--- | :--- |\n| Windows | 打开控制台 | `java -version` |\n| Linux | 打开终端 | `java\
  \ -version` |\n| Mac | 打开终端 | `java -version` |\n\n检查系统的输出：\n\n| OS | 输出 |\n| :---\
  \ | :--- |\n| Windows | 1.8_xx (Java 运行时) |\n| Linux | 1.8_xx (Java 运行时) |\n| Mac\
  \ | 1.8_xx (Java 运行时) |\n\n如果你的系统中没有安装 Java，请先下载 Java 开发工具包（SDK）。\n\n### 第 2 步：设置\
  \ JAVA 环境\n\n将 `JAVA_HOME` 环境变量指向 Java 安装的基础目录。\n\n| OS | 输出 |\n| :--- | :--- |\n\
  | Windows | 将 `JAVA_HOME` 设置为 `C:\\Program Files\\Java\\jdk1.8_xx` |\n| Linux |\
  \ `export JAVA_HOME=/usr/local/` |\n| Mac | `export JAVA_HOME=/Library/Java` |\n\
  \n将 Java 编译器位置添加到系统 `Path` 中。\n\n| OS | 输出 |\n| :--- | :--- |\n| Windows | 将 `C:\\\
  Program Files\\Java\\jdk1.8_xx\\bin` 添加到 `Path` 变量末尾。 |\n| Linux | `export PATH=$PATH:$JAVA_HOME/bin/`\
  \ |\n| Mac | 不需要 |\n\n### 第 3 步：下载 JUnit 包\n\n从 `http://www.junit.org` 下载最新版本的 JUnit\
  \ 包。在编写本教程时，我们下载了 `junit4.12.jar` 并将其拷贝到 `C:\\JUnit` 文件夹。\n\n| OS |文件名 |\n| :---\
  \ | :--- |\n| Windows | `junit4.12.jar` |\n\n### 第 4 步：设置 JUnit 环境\n\n将 `JUNIT_HOME`\
  \ 环境变量指向存储 JUNIT 包的基础目录。假设我们已将 `junit4.12.jar` 存储在 `JUNIT` 文件夹。\n\n| OS | 输出 |\n\
  | :--- | :--- |\n| Windows | 将 `JUNIT_HOME` 设置为 `C:\\JUnit` |\n| Linux | `export\
  \ JUNIT_HOME=/usr/local/JUNIT` |\n| Mac | `export JUNIT_HOME=/Library/JUNIT` |\n\
  \n### 第 5 步：设置 CLASSPATH 变量\n\n将 `CLASSPATH` 环境变量指向 JUNIT 包的位置。\n\n| 序号 | OS 与描述\
  \ |\n| :--- | :--- |\n| 1 | Windows 将环境变量 `CLASSPATH` 设置为 `%CLASSPATH%;%JUNIT_HOME%\\\
  junit4.12.jar;.;` |\n\n\n\n\n\n| 2 | `export CLASSPATH = $CLASSPATH:$JUNIT_HOME/junit4.12.jar:.`\
  \ |\n| 3 | `export CLASSPATH = $CLASSPATH:$JUNIT_HOME/junit4.12.jar:.` |\n\n## 第\
  \ 6 步：测试 JUnit 设置\n\n在 `C:\\>JUNIT_WORKSPACE` 中创建一个名为 `TestJunit` 的 java 类文件\n\n\
  ```java\nimport org . junit . Test ;\n\nimport static org . junit . Assert . assertEquals\
  \ ;\n\npublic class TestJunit {\n    @Test\n    public void testAdd () {\n     \
  \   String str = \"Junit is working fine\" ;\n        assertEquals ( \"Junit is\
  \ working fine\" , str );\n    }\n}\n```\n\n在 `C:\\>JUNIT_WORKSPACE` 中创建一个名为 `TestRunner`\
  \ 的 java 类文件以执行测试用例。\n\n```java\nimport org . junit . runner . JUnitCore ;\nimport\
  \ org . junit . runner . Result ;\nimport org . junit . runner . notification .\
  \ Failure ;\n\npublic class TestRunner {\n    public static void main ( String []\
  \ args ) {\n        Result result = JUnitCore . runClasses ( TestJunit . class );\n\
  \        for ( Failure failure : result . getFailures ()) {\n            System\
  \ . out . println ( failure . toString ());\n        }\n        System . out . println\
  \ ( result . wasSuccessful ());\n    }\n}\n```\n\n## 第 7 步：验证结果\n\n使用 `javac` 编译器按照如下方式编译类\
  \ ＝\n\n`C:\\JUNIT_WORKSPACE>javac TestJunit.java TestRunner.java`\n\n现在运行 Test Runner\
  \ 查看结果，如下所示 ：\n\n`C:\\JUNIT_WORKSPACE>java TestRunner`\n\n验证输出。\n\ntrue\n\n# 测试框架\n\
  \nJUnit 是一种 `回归测试框架`，供开发人员用于在 Java 中实现单元测试，加速编程速度并提高代码质量。JUnit 框架可以轻松地集成到以下任一工具中\
  \ ：\n\n* Eclipse\n* Ant\n* Maven\n\n## JUnit 测试框架的特性\n\nJUnit 测试框架提供了以下重要特性 ：\n\n\
  * 测试固件 (Fixtures)\n* 测试套件 (Test suites)\n* 测试运行器 (Test runners)\n* JUnit 类\n\n###\
  \ 测试固件 (Fixtures)\n\n`Fixtures` 是一组对象的固定状态，作为运行测试的基准。测试固件的目的是确保有一个已知且固定的环境来运行测试，以便结果是可重复的。它包括\
  \ ＝\n\n* `setUp()` 方法，它在每次测试调用之前运行。\n* `tearDown()` 方法，它在每个测试方法之后运行。\n\n让我们检查一个示例\
  \ ＝\n\n```java\nimport junit . framework ..*;\n\npublic class JavaTest extends TestCase\
  \ {\n    protected int value1 , value2 ;\n    // 给值赋值\n    protected void setUp\
  \ (){\n        value1 = 3 ;\n        value2 = 3 ;\n    }\n    // 两个值之和的测试方法\n  \
  \  public void testAdd (){\n        double result = value1 + value2 ;\n        assertTrue\
  \ ( result == 6 );\n    }\n}\n```\n\n## 测试套件 (Test Suites)\n\n测试套件将几个单元测试用例打包并一起运行。在\
  \ JUnit 中，`@RunWith` 和 `@Suite` 注解都用于运行套件测试。下面是一个使用 `TestJunit1` & `TestJunit2`\
  \ 测试类的示例。\n\n```java\nimport org . junit . runner . RunWith ;\nimport org . junit\
  \ . runners . Suite ;\n\n//JUnit 套件测试\n@RunWith ( Suite . class )\n@Suite . SuiteClasses\
  \ ({\n    TestJunit1 . class , TestJunit2 . class\n})\npublic class JunitTestSuite\
  \ {\n}\n```\n\n```java\nimport org . junit . Test ;\nimport org . junit . Ignore\
  \ ;\nimport static org . junit . Assert . assertEquals ;\n\npublic class TestJunit1\
  \ {\n    String message = \"Robert\" ;\n    MessageUtil messageUtil = new MessageUtil\
  \ ( message );\n    @Test\n    public void testAdd () {\n        // 示例内容\n    }\n\
  }\n```\n\n*(注：由于原文示例中部分代码不完整或存在截断，此处翻译仅根据逻辑翻译了描述部分)*\n\n\n\n\n\n```java\nfor (Failure\
  \ failure : result.getFailures()) {\n    System.out.println(failure.toString());\n\
  }\nSystem.out.println(result.wasSuccessful());\n}\n```\n\n现在运行测试运行器（Test Runner），它将运行在\
  \ TestCase 类中定义的测试用例。\n\n```bash\nC:\\JUNIT_WORKSPACE>java TestRunner\n```\n\n验证输出结果。\n\
  \n```\nHello World\ntestPrintMessage(TestJunit): expected:<[New Wor]d> but was:<[Hello\
  \ Worl]d>\nfalse\n```\n\n# API\n\nJUnit 中最重要的包是 `junit.framework`，它包含了所有的核心类。其中一些重要的类如下\
  \ −\n\n| 序号 | 类名 | 功能 |\n| :--- | :--- | :--- |\n| 1 | Assert | 一组断言方法。 |\n| 2 |\
  \ TestCase | 测试用例定义了运行多个测试的测试固件（fixture）。 |\n| 3 | TestResult | TestResult 收集执行测试用例的结果。\
  \ |\n| 4 | TestSuite | TestSuite 是测试的组合。 |\n\n## Assert 类\n\n以下是 `org.junit.Assert`\
  \ 类的声明 −\n\n```java\npublic class Assert extends java.lang.Object\n```\n\n该类提供了一组用于编写测试的断言方法。系统仅记录失败的断言。Assert\
  \ 类的一些重要方法如下 −\n\n| 序号 | 方法与描述 |\n| :--- | :--- |\n| 1 | `void assertEquals(boolean\
  \ expected, boolean actual)` 检查两个基本数据类型/对象是否相等。 |\n| 2 | `void assertFalse(boolean\
  \ condition)` 检查条件是否为假。 |\n| 3 | `void assertNotNull(Object object)` 检查对象是否不为空。\
  \ |\n| 4 | `void assertNull(Object object)` 检查对象是否为空。 |\n| 5 | `void assertTrue(boolean\
  \ condition)` 检查条件是否为真。 |\n| 6 | `void fail()` 在不带消息的情况下导致测试失败。 |\n\n让我们在示例中使用上面提到的一些方法。在\
  \ `C:\\>JUNIT_WORKSPACE` 中创建一个名为 `TestJunit1.java` 的 java 类文件。\n\n```java\nimport\
  \ org.junit.Test;\nimport static org.junit.Assert.*;\n\npublic class TestJunit1\
  \ {\n    @Test\n    public void testAdd() {\n        //测试数据\n        int num = 5;\n\
  \        String temp = null;\n        String str = \"Junit is working fine\";\n\
  \        //检查相等性\n        assertEquals(\"Junit is working fine\", str);\n      \
  \  //检查为假条件\n        assertFalse(num > 6);\n        //检查非空值\n        assertNotNull(temp);\n\
  \    }\n}\n```\n\n接下来，在 `C:\\>JUNIT_WORKSPACE` 中创建一个名为 `TestRunner1.java` 的 java\
  \ 类文件，以执行测试用例。\n\n```java\nimport org.junit.runner.JUnitCore;\nimport org.junit.runner.Result;\n\
  import org.junit.runner.notification.Failure;\n\npublic class TestRunner1 {\n  \
  \  public static void main(String[] args) {\n        Result result = JUnitCore.runClasses(TestJunit1.class);\n\
  \        for (Failure failure : result.getFailures()) {\n            System.out.println(failure.toString());\n\
  \        }\n        System.out.println(result.wasSuccessful());\n    }\n}\n```\n\
  \n使用 `javac` 编译测试用例和 Test Runner 类。\n\n```bash\nC:\\JUNIT_WORKSPACE>javac TestJunit1.java\
  \ TestRunner1.java\n```\n\n现在运行测试运行器，它将运行在 TestCase 类中定义的测试用例。\n\n```bash\nC:\\\
  JUNIT_WORKSPACE>java TestRunner1\n```\n\n验证输出结果。\n\n```\ntrue\n```\n\n## TestCase\
  \ 类\n\n以下是 `org.junit.TestCase` 类的声明 −\n\n```java\npublic abstract class TestCase\
  \ extends Assert implements Test\n```\n\n测试用例定义了运行多个测试的测试固件。`TestCase` 类的一些重要方法如下\
  \ −\n\n| 序号 | 方法与描述 |\n| :--- | :--- |\n| 1 | `int countTestCases()` 统计由 `run(TestResult\
  \ result)` 执行的测试用例数量。 |\n| 2 | `TestResult createResult()` 创建默认的 `TestResult` 对象。\
  \ |\n| 3 | `String getName()` 获取 `TestCase` 的名称。 |\n| 4 | `TestResult run()` 运行此测试的便利方法，使用默认的\
  \ `TestResult` 对象收集结果。 |\n| 5 | `void run(TestResult result)` 运行测试用例并将结果收集在 `TestResult`\
  \ 中。 |\n| 6 | `void setName(String name)` 设置 `TestCase` 的名称。 |\n| 7 | `void setUp()`\
  \ 设置固件，例如打开网络连接。 |\n| 8 | `void tearDown()` 拆卸固件，例如关闭网络连接。 |\n| 9 | `String toString()`\
  \ 返回测试用例的字符串表示形式。 |\n\n让我们在示例中使用上面提到的一些方法。在 `C:\\>JUNIT_WORKSPACE` 中创建一个名为 `TestJunit2.java`\
  \ 的 java 类文件。\n\n```java\nimport junit.framework.TestCase;\nimport org.junit.Before;\n\
  import org.junit.Test;\n\npublic class TestJunit2 extends TestCase {\n    protected\
  \ double fValue1;\n    protected double fValue2;\n\n    @Before\n    public void\
  \ setUp() {\n        fValue1 = 2.0;\n        fValue2 = 3.0;\n    }\n\n    @Test\n\
  \    public void testAdd() {\n        //统计测试用例数量\n        String name = \"testAdd\"\
  ;\n        System.out.println(\"Test Name = \" + name);\n        //设置名称\n      \
  \  setName(\"testAdd\");\n        String newName = getName();\n        System.out.println(\"\
  Updated Case Name = \" + newName);\n    }\n\n    //关闭连接\n    public void tearDown()\
  \ {\n        //tearDown 逻辑\n    }\n}\n```\n\n接下来，在 `C:\\>JUNIT_WORKSPACE` 中创建一个名为\
  \ `TestRunner2.java` 的 java 类来执行测试用例。\n\n```java\nimport org.junit.runner.JUnitCore;\n\
  import org.junit.runner.Result;\nimport org.junit.runner.notification.Failure;\n\
  \npublic class TestRunner2 {\n    public static void main(String[] args) {\n   \
  \     Result result = JUnitCore.runClasses(TestJunit2.class);\n        for (Failure\
  \ failure : result.getFailures()) {\n            System.out.println(failure.toString());\n\
  \        }\n        System.out.println(result.wasSuccessful());\n    }\n}\n```\n\
  \n## TestResult 类\n\n以下是 `org.junit.TestResult` 类的声明 −\n\n```java\npublic class\
  \ TestResult extends Object\n```\n\nTestResult 收集执行测试用例的结果。它是收集模式的实例。测试框架区分失败（failures）和错误（errors）。失败是预期的且通过断言检查。错误是非预期的问题，例如\
  \ `ArrayIndexOutOfBoundsException`。\n\n| 序号 | 方法与描述 |\n| :--- | :--- |\n| 1 | `void\
  \ addError(Test test, Throwable t)` 将错误添加到列表中。 |\n| 2 | `void addFailure(Test test,\
  \ AssertionFailedError t)` 将失败添加到列表中。 |\n| 3 | `void endTest(Test test)` 通知结果测试已完成。\
  \ |\n| 4 | `int errorCount()` 获取错误的数量。 |\n| 5 | `Enumeration<TestFailure> errors()`\
  \ 返回错误的枚举器。 |\n| 6 | `int failureCount()` 获取失败的数量。 |\n| 7 | `void run(TestCase test)`\
  \ 运行一个 `TestCase`。 |\n| 8 | `int runCount()` 获取运行的测试数量。 |\n| 9 | `void startTest(Test\
  \ test)` 通知结果测试将开始。 |\n| 10 | `void stop()` 标记测试运行应该停止。 |\n\n在 `C:\\>JUNIT_WORKSPACE`\
  \ 中创建一个名为 `TestJunit3.java` 的 java 类文件。\n\n```java\nimport org.junit.Test;\nimport\
  \ junit.framework.AssertionFailedError;\nimport junit.framework.TestResult;\n\n\
  public class TestJunit3 extends TestResult {\n    // 添加错误\n    public synchronized\
  \ void addError(Test test, Throwable t) {\n        super.addError((junit.framework.Test)\
  \ test, t);\n    }\n\n    // 添加失败\n    public synchronized void addFailure(Test\
  \ test, AssertionFailedError t) {\n        super.addFailure((junit.framework.Test)\
  \ test, t);\n    }\n\n    @Test\n    public void testAdd() {\n        //添加任何测试\n\
  \    }\n\n    // 标记测试运行应该停止。\n    public synchronized void stop() {\n        //在此处停止测试\n\
  \    }\n}\n```\n\n\n\n\n\n```java\nimport org . junit . runner . JUnitCore ;\nimport\
  \ org . junit . runner . Result ;\nimport org . junit . runner . notification .\
  \ Failure ;\n\npublic class TestRunner3 {\n    public static void main ( String\
  \ [] args ) {\n        Result result = JUnitCore . runClasses ( TestJunit3 . class\
  \ );\n        for ( Failure failure : result . getFailures ()) {\n            System\
  \ . out . println ( failure . toString ());\n        }\n        System . out . println\
  \ ( result . wasSuccessful ());\n    }\n}\n```\n\n使用 `javac` 编译测试用例和 Test Runner\
  \ 类。\n\n```bash\nC:\\JUNIT_WORKSPACE>javac TestJunit3.java TestRunner3.java\n```\n\
  \n现在运行 Test Runner，它将运行在提供的 Test Case 类中定义的测试用例。\n\n```bash\nC:\\JUNIT_WORKSPACE>java\
  \ TestRunner3\n```\n\n验证输出。\n\n`true`\n\n## TestSuite 类\n\n以下是 `org.junit.TestSuite`\
  \ 类的声明：\n\n```java\npublic class TestSuite extends Object implements Test\n```\n\
  \n`TestSuite` 是测试的组合（Composite）。它运行一组测试用例。`TestSuite` 类的一些重要方法如下 −\n\n| 序号 | 方法与描述\
  \ |\n| :--- | :--- |\n| 1 | `void addTest(Test test)`向测试套件（suite）中添加一个测试。 |\n| 2\
  \ | `void addTestSuite(Class<? extends TestCase> testClass)`将给定类中的测试添加到套件中。 |\n\
  | 3 | `int countTestCases()`计算此测试将运行的测试用例数量。 |\n| 4 | `String getName()`返回套件名称。\
  \ |\n| 5 | `void run(TestResult result)`运行测试并将它们的结果收集在 TestResult 中。 |\n| 6 | `void\
  \ setName(String name)`设置套件名称。 |\n| 7 | `Test testAt(int index)`返回指定索引处的测试。 |\n\
  | 8 | `int testCount()`返回此套件中测试的数量。 |\n| 9 | `static Test warning(String message)`返回一个会失败并记录警告消息的测试。\
