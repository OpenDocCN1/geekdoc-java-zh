  \ actual)`检查两个基本类型/对象是否相等。 |\n| 2 | `void assertTrue(boolean condition)`检查条件是否为真。\
  \ |\n| 3 | `void assertFalse(boolean condition)`检查条件是否为假。 |\n| 4 | `void assertNotNull(Object\
  \ object)`检查对象不为空。 |\n| 5 | `void assertNull(Object object)`检查对象是否为空。 |\n| 6 | `void\
  \ assertSame(object1, object2)``assertSame()` 方法测试两个引用是否指向同一个对象。 |\n| 7 | `void\
  \ assertNotSame(object1, object2)``assertNotSame()` 方法测试两个引用是否指向不同的对象。 |\n| 8 |\
  \ `void assertArrayEquals(expectedArray, resultArray)``assertArrayEquals()` 方法将测试两个数组是否相等。\
  \ |\n\n让我们在示例中使用上述某些方法。在 `C:\\>JUNIT_WORKSPACE` 中创建一个名为 `TestAssertions.java` 的\
