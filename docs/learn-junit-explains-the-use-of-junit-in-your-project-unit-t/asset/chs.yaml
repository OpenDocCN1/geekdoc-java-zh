  ```\n\n验证输出。\n\ntrue\n\n# 注解 (Annotation)\n\n注解类似于你可以添加到代码中的元标记，并应用于方法或类。JUnit 中的这些注解提供了关于测试方法的以下信息\
  \ −\n\n- 哪些方法将在测试方法运行之前和之后运行。\n- 哪些方法将在所有方法之前和之后运行，以及。\n- 哪些方法或类在执行期间将被忽略。\n\n下表提供了\
  \ JUnit 中注解的列表及其含义 −\n\n| 序号 | 注解与描述 |\n| :--- | :--- |\n| 1 | @Test | @Test 注解告诉\
  \ JUnit 映射其所附加的 public void 方法可以作为测试用例运行。 |\n| 2 | @Before | 某些测试在运行之前需要创建相似的实例。在\
  \ public void 方法上添加 @Before 会导致该方法在每个 Test 方法运行之前运行。 |\n| 3 | @After | 如果你在 Before\
  \ 方法中分配了外部资源，你需要在测试运行后释放它们。在 public void 方法上添加 @After 会导致该方法在 Test 方法运行后运行。 |\n\
  | 4 | @BeforeClass | 在 public static void 方法上添加 @BeforeClass 会导致它在类中的任何测试方法运行之前运行一次。\
  \ |\n| 5 | @AfterClass | 这将在所有测试完成后执行该方法。它可以用于执行清理工作。 |\n| 6 | @Ignore | @Ignore\
  \ 注解用于忽略测试，该测试将不会执行。 |\n\n在 `C:\\>JUNIT_WORKSPACE` 中创建一个名为 `JunitAnnotation.java`\
  \ 的 Java 类文件来测试注解。\n\n```java\nimport org . junit . After ;\n\nimport org . junit\
  \ . AfterClass ;\n\nimport org . junit . Before ;\n\nimport org . junit . BeforeClass\
  \ ;\n\nimport org . junit . Ignore ;\n\nimport org . junit . Test ;\n\npublic class\
  \ JunitAnnotation {\n\n//在类前执行\n@BeforeClass\npublic static void beforeClass ()\
  \ {\nSystem . out . println ( \"in before class\" );\n}\n\n//在类后执行\n@AfterClass\n\
  public static void afterClass () {\nSystem . out . println ( \"in after class\"\
  \ );\n}\n\n//在测试前执行\n@Before\npublic void before () {\nSystem . out . println (\
  \ \"in before\" )}\n}\n\n//在测试后执行\n@After\npublic void after () {\nSystem . out\
  \ . println ( \"in after\" )}\n}\n\n//测试用例\n@Test\npublic void test () {\nSystem\
  \ . out . println ( \"in test\" )}\n}\n\n//忽略测试用例，将不会执行\n@Ignore\npublic void ignoreTest\
  \ () {\nSystem . out . println ( \"in ignore test\" )}\n}\n\n}\n```\n\n接下来，在 `C:\\\
  >JUNIT_WORKSPACE` 中创建一个名为 `TestRunner.java` 的 Java 类文件来执行注解。\n\n```java\nimport\
