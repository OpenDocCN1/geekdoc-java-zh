  \n现在运行测试运行类，它将运行在提供的测试用例类中定义的测试用例。\n\n`C:\\JUNIT_WORKSPACE>java TestRunner`\n\n\
  验证输出。\nInside testPrintMessage()\nRobert\nInside testSalutationMessage()\nHi Robert\n\
  true\n\n# Ignore 测试\n\n有时在运行测试用例时我们的代码还没有准备好，导致测试用例失败。`@Ignore` 注解有助于这种情况。\n\n-\
  \ 标记了 `@Ignore` 的测试方法将不会执行。\n 如果 如果测试类标记了 `@Ignore`，则它的测试方法都不会执行。\n\n现在让我们来看看 `@Ignore`\
  \ 的作用。\n\n## 创建类\n\n在 `C:\\>JUNIT_WORKSPACE` 中创建一个待测试的 java 类，例如 `MessageUtil.java`。\n\
  （代码同上）\n\n## 创建测试用例类\n\n- 在 `C:\\>JUNIT_WORKSPACE` 中创建一个 java 测试类，例如 `TestJunit.java`。\n\
  - 在你的测试类中添加一个测试方法 `testPrintMessage()` 或 `testSalutationMessage()`。\n- 为方法 `testPrintMessage()`\
  \ 添加一个 `@Ignore`。\n\n在 `C:\\>JUNIT_WORKSPACE` 中创建一个名为 `TestJunit.java` 的 java 类文件。\n\
  \n```java\nimport org . junit . Test ;\nimport org . junit . Ignore ;\nimport static\
  \ org . junit . Assert . assertEquals ;\n\npublic class TestJunit {\n    String\
  \ message = \"Robert\" ;      \n    MessageUtil messageUtil = new MessageUtil (\
  \ message );\n    @Ignore\n    @Test\n    public void testPrintMessage () {    \
  \  \n        System . out . println ( \"Inside testPrintMessage()\" );\n       \
  \ assertEquals ( message , messageUtil . printMessage ());\n    }\n\n    @Test\n\
  \    public void testSalutationMessage () {\n        System . out . println ( \"\
  Inside testSalutationMessage()\" );\n        message = \"Hi!\" + \"Robert\" ;\n\
  \        assertEquals ( message , messageUtil . salutationMessage ());\n    }\n\
  }\n```\n\n\n\n\n\n# 参数化测试\n\nJUnit 提供了一种使用不同数据多次运行相同测试的方法。这是通过 `@Parameterized`\
  \ 注解和数据源实现的。\n\n## 创建类\n\n创建一个要进行测试的 Java 类，例如在 `C:\\>JUNIT_WORKSPACE` 中创建 `MessageUtil.java`。\n\
  \n添加一个处理消息的方法。\n\n```java\n/*\n* 此类在控制台上处理给定的消息。\n*/\npublic class MessageUtil {\n\
  \    private String message;\n\n    //构造函数\n    //@param message 要打印的消息\n    public\
  \ MessageUtil (String message){\n        this.message = message;\n    }\n\n    //\
  \ 处理消息\n    public void processMessage(String input){\n        System.out.println(\"\
  Processing: \" + input);\n    }\n}\n```\n\n## 创建测试用例类\n\n创建一个 Java 测试类，例如 `TestJunit.java`。使用\
  \ `@Parameterized` 为测试提供多个输入。\n\n在 `C:\\>JUNIT_WORKSPACE` 中创建一个名为 `TestJunit.java`\
  \ 的 Java 类文件。\n\n```java\nimport org.junit.Test;\nimport org.junit.Parameterized;\n\
  import static org.junit.Assert.assertEquals;\n\n@Parameterized(name = \"{0}\")\n\
  public class TestJunit {\n    private String input;\n    private String expected;\n\
  \n    public TestJunit(String input, String expected) {\n        this.input = input;\n\
  \        this.expected = expected;\n    }\n\n    @Test\n    public void testProcessMessage()\
  \ {\n        MessageUtil messageUtil = new MessageUtil(input);\n        // 为了演示，我们检查逻辑\n\
  \        assertEquals(expected, input);\n    }\n\n    @Parameters\n    public static\
  \ Object[] data() {\n        return new Object[][] {\n            {\"Robert\", \"\
  Robert\"},\n            {\"Hi!\", \"Hi!\"},\n            {\"JUnit\", \"JUnit\"}\n\
  \        };\n    }\n}\n```\n\n## 创建测试运行器类\n\n在 `C:\\>JUNIT_WORKSPACE` 中创建一个名为 `TestRunner.java`\
  \ 的 Java 类来执行测试用例。\n\n```java\nimport org.junit.runner.JUnitCore;\nimport org.junit.runner.Result;\n\
  import org.junit.runner.notification.Failure;\n\npublic class TestRunner {\n   \
  \ public static void main(String[] args) {\n        Result result = JUnitCore.runClasses(TestJunit.class);\n\
  \        for (Failure failure : result.getFailures()) {\n            System.out.println(failure.toString());\n\
  \        }\n        System.out.println(result.wasSuccessful());\n    }\n}\n```\n\
  \n使用 `javac` 编译 `MessageUtil`、`TestJunit` 和 `TestRunner` 类。\n\n`C:\\JUNIT_WORKSPACE>javac\
  \ MessageUtil.java TestJunit.java TestRunner.java`\n\n现在运行 Test Runner，它将使用提供的数据运行测试用例。\n\
  \n`C:\\JUNIT_WORKSPACE>java TestRunner`\n\n验证输出结果。所有参数化测试均已执行。\n\ntrue\n\n\n\n\n\
  \nJUnit 4 引入了一个名为 `parameterized tests`（参数化测试）的新功能。参数化测试允许开发者使用不同的值多次运行测试。创建参数化测试需要遵循以下五个步骤。\n\
  \n*   使用 `@RunWith(Parameterized.class)` 注解测试类。\n*   创建一个带有 `@Parameters` 注解的公共静态方法，该方法返回一个\
  \ `Objects` 的 `Collection`（以 `Array` 形式）作为测试数据集。\n*   创建一个公共构造函数，接收等同于测试数据某一个“行”的参数。\n\
  *   为测试数据的每一“列”创建一个实例变量。\n*   使用实例变量作为测试数据源创建你的测试用例。\n\n测试用例将为每行数据调用一次。让我们来看看参数化测试的实际运行情况。\n\
  \n## 创建一个类\n\n创建一个要测试的 java 类，例如在 `C:\\>JUNIT_WORKSPACE` 中创建 `PrimeNumberChecker.java`。\n\
  \n```java\npublic class PrimeNumberChecker {\n    public Boolean validate ( final\
  \ Integer primeNumber ) {\n        for ( int i = 2 ; i < ( primeNumber / 2 ); i\
  \ ++) {\n            if ( primeNumber % i == 0 ) {\n                return false\
  \ ;\n            }\n        }\n        return true ;\n    }\n}\n```\n\n## 创建参数化测试用例类\n\
  \n创建一个 java 测试类，例如 `PrimeNumberCheckerTest.java`。在 `C:\\>JUNIT_WORKSPACE` 中创建一个名为\
  \ `PrimeNumberCheckerTest.java` 的 java 类文件。\n\n```java\nimport java . util . Arrays\
  \ ;\nimport java . util . Collection ;\nimport org . junit . Test ;\nimport org\
  \ . junit . Before ;\nimport org . junit . runners . Parameterized ;\nimport org\
  \ . junit . runners . Parameterized . Parameters ;\nimport org . junit . runner\
  \ . RunWith ;\nimport static org . junit . Assert . assertEquals ;\n\n@RunWith (\
  \ Parameterized . class )\npublic class PrimeNumberCheckerTest {\n    private Integer\
  \ inputNumber ;\n    private Boolean expectedResult ;\n    private PrimeNumberChecker\
  \ primeNumberChecker ;\n\n    @Before\n    public void initialize () {\n       \
  \ primeNumberChecker = new PrimeNumberChecker ();\n    }\n\n    // 每个参数都应该作为参数放在这里\n\
  \    // 每当运行器触发时，它将传递\n    // 我们在 primeNumbers() 方法中定义的参数\n    public PrimeNumberCheckerTest\
  \ ( Integer inputNumber , Boolean expectedResult ) {\n        this . inputNumber\
  \ = inputNumber ;\n        this . expectedResult = expectedResult ;\n    }\n\n \
  \   @Parameterized . Parameters\n    public static Collection primeNumbers () {\n\
  \        return Arrays . asList ( new Object [][] {\n            { 2 , true },\n\
  \            { 6 , false },\n            { 19 , true },\n            { 22 , false\
  \ },\n            { 23 , true }\n        });\n    }\n\n    // 此测试将运行 5 次，因为我们定义了\
  \ 5 个参数\n    @Test\n    public void testPrimeNumberChecker () {\n        System\
  \ . out . println ( \"Parameterized Number is : \" + inputNumber );\n        assertEquals\
  \ ( expectedResult ,\n        primeNumberChecker . validate ( inputNumber ));\n\
  \    }\n}\n```\n\n## 创建测试运行类\n\n在 `C:\\>JUNIT_WORKSPACE` 中创建一个名为 `TestRunner.java`\
  \ 的 java 类来执行测试用例。\n\n```java\nimport org . junit . runner . JUnitCore ;\nimport\
  \ org . junit . runner . Result ;\nimport org . junit . runner . notification .\
  \ Failure ;\n\npublic class TestRunner {\n    public static void main ( String []\
  \ args ) {\n        Result result = JUnitCore . runClasses ( PrimeNumberCheckerTest\
  \ . class );\n        for ( Failure failure : result . getFailures ()) {\n     \
  \       System . out . println ( failure . toString ());\n        }\n        System\
  \ . out . println ( result . wasSuccessful ());\n    }\n}\n```\n\n使用 `javac` 编译\
  \ `PrimeNumberChecker`、`PrimeNumberCheckerTest` 和 `TestRunner` 类。\n\n```bash\nC:\\\
  JUNIT_WORKSPACE>javac PrimeNumberChecker.java PrimeNumberCheckerTest.java\n```\n\
  \n`TestRunner.java`\n\n现在运行测试运行器，它将运行提供的测试用例类中定义的测试用例。\n\n```bash\nC:\\JUNIT_WORKSPACE>java\
  \ TestRunner\n```\n\n验证输出。\n\n```\nParameterized Number is : 2\nParameterized Number\
  \ is : 6\nParameterized Number is : 19\nParameterized Number is : 22\nParameterized\
  \ Number is : 23\ntrue\n```\n\n# 使用 ANT 插件\n\n我们将通过示例演示如何使用 ANT 运行 JUnit。请按照下面的步骤操作。\n\
  \n## 步骤 1：下载 Apache Ant\n\n根据你正在使用的操作系统下载 `Apache Ant`。\n\n| OS | 归包名称 |\n| :---\
