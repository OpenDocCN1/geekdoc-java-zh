  \n# 扩展：\n\n*   Cactus\n*   JWebUnit\n*   XMLUnit\n\n## Cactus\n\nCactus 是一个用于服务器端代码的简单测试框架（Servlets,\
  \ EJBs, Tag Libs, Filters）。其目的是降低编写测试的成本。它扩展了 JUnit。\n\nCactus 生态系统由几个组件组成：\n\n\
  *   **Cactus Framework** 是 Cactus 的核心。它是提供测试的引擎。\n*   **Cactus Integration Modules**\
  \ 是前端，提供了简单的方法（Ant, Eclipse 插件）。\n\n以下代码演示了如何使用 Cactus：\n\n```java\nimport org .\
  \ apache . cactus.*;\nimport junit . framework ..\n\npublic class TestServlet extends\
  \ TestCase {\n    // 初始化要测试的类\n    SampleServlet servlet = new SampleServlet ();\n\
  \    @Test\n    public void testServlet () {\n        // 在 session 中设置变量\n     \
  \   session . setAttribute ( \"name\" , \"value\" );\n        // 调用要测试的方法，传递 HttpServletRequest\
  \ 对象（例如）\n        String result = servlet . doSomething ( request );\n        //\
  \ 验证测试是否成功\n        assertEquals ( \"something\" , result );\n        assertEquals\
  \ ( \"otherValue\" , session . getAttribute ( \"otherName\" ));\n    }\n}\n```\n\
  \n## JWebUnit\n\nJWebUnit 是一个基于 Java 的 Web 应用测试框架。它封装了 HtmlUnit 和 Selenium 等测试框架。\n\
  \nJWebUnit 提供了一个高级 Java API 来导航 Web 应用，并结合一组断言。这包括链接导航、表单输入和提交、表格内容验证以及其他典型的 Web\
  \ 应用功能。\n\n简单的导航方法和现成的断言比仅使用 JUnit 或 HtmlUnit 能更快创建测试。如果你想从 HtmlUnit 切换到其他插件（如即将推出的\
  \ Selenium），无需重写测试。\n\n这是一个示例代码：\n\n```java\nimport junit . framework . TestCase\
  \ ;\nimport net . sourceforge . jwebunit . WebTester ;\n\npublic class ExampleWebTestCase\
  \ extends TestCase {\n    private WebTester tester ;\n    public ExampleWebTestCase\
  \ ( String name ) {\n        super ( name );\n        tester = new WebTester ();\n\
  \    }\n    // 设置基础 URL\n    public void setUp () throws Exception {\n        getTestContext\
  \ (). setBaseUrl ( \"http://myserver:8080/myapp\" );\n    }\n    // 测试基础信息\n   \
  \ @Test\n    public void testInfoPage () {\n        beginAt ( \"/info.html\" );\n\
  \    }\n}\n```\n\n## XMLUnit\n\nXMLUnit 提供单一的 JUnit 扩展类 `XMLTestCase` 以及一组辅助类，允许对以下内容进行断言：\n\
  \n*   两个 XML 段之间的差异（通过 `Diff` 和 `DetailedDiff` 类）。\n*   XML 的有效性（通过 `Validator`\
  \ 类）。\n*   使用 XSLT 转换 XML 的结果（通过 `Transform` 类）。\n\n\n\n\n\n- 对 XML 片段进行 XPath 表达式的评估（通过实现\
  \ `XpathEngine` 接口的类）。\n- 通过 DOM 遍历暴露的 XML 片段中的单个节点（通过 `NodeTest` 类）。\n\n让我们假设有两个想要比较的\
  \ XML 片段，并断言它们是相等的。我们可以编写如下的简单测试类 −\n\n```java\nimport org . custommonkey . xmlunit\
  \ . XMLTestCase ;\n\npublic class MyXMLTestCase extends XMLTestCase {\n    // 此测试方法比较两个\
  \ XML 片段\n    @Test\n    public void testForXMLEquality () throws Exception {\n\
  \        String myControlXML = \"<msg><uuid>0x00435A8C</uuid></msg>\" ;\n      \
  \  String myTestXML = \"<msg><localId>2376</localId></msg>\" ;\n        assertXMLEqual\
  \ ( \"Comparing test xml to control xml\" , myControlXML , myTestXML );\n    }\n\
  }\n```\n\n## MockObject\n\n在单元测试中，模拟对象（mock objects）可以模拟复杂的真实（非 mock）对象的行为，因此当真实对象无法或难以集成到单元测试中时，它们非常有用。\n\
  \n使用模拟对象进行测试的通用编码风格如下如下：\n\n- 创建模拟对象的实例。\n- 在模拟对象中设置状态和期望。\n- 使用模拟对象作为参数调用领域代码。\n\
  - 验证模拟对象的一致性。\n\n下面是一个使用 Jmock 使用 MockObject 的示例。\n\n```java\nimport org . jmock\
  \ . Mockery ;\nimport org . jmock . Expectations ;\n\nclass PubTest extends TestCase\
  \ {\n    Mockery context = new Mockery ();\n    public void testSubReceivesMessage\
  \ () {\n        // set up\n        final Sub sub = context . mock ( Sub . class\
  \ );\n        Pub pub = new Pub ();\n        pub . add ( sub );\n        final String\
  \ message = \"message\" ;\n        // expectations\n        context . checking (\
  \ new Expectations () {\n            oneOf ( sub ). receive ( message );\n     \
  \   });\n        // execute\n        pub . publish ( message );\n        // verify\n\
  \        context . assertIsSatisfied ();\n    }\n}\n```\n\n"
