- fmt: "\n- The evaluation of an XPath expression on a piece of XML (via classes implementing\
    \ the `XpathEngine` interface).\n- Individual nodes in a piece of XML that are\
    \ exposed by DOM Traversal (via `NodeTest` class).\n\nLet us assume we have two\
    \ pieces of XML that we wish to compare and assert that they are equal. We could\
    \ write a simple test class like this −\n\n```java\nimport org . custommonkey\
    \ . xmlunit . XMLTestCase ;\n\npublic class MyXMLTestCase extends XMLTestCase\
    \ {\n    // this test method compare two pieces of the XML\n    @Test\n    public\
    \ void testForXMLEquality () throws Exception {\n        String myControlXML =\
    \ \"<msg><uuid>0x00435A8C</uuid></msg>\" ;\n        String myTestXML = \"<msg><localId>2376</localId></msg>\"\
    \ ;\n        assertXMLEqual ( \"Comparing test xml to control xml\" , myControlXML\
    \ , myTestXML );\n    }\n}\n```\n\n## MockObject\n\nIn a unit test, mock objects\
    \ can simulate the behavior of complex, real (non-mock) objects and are therefore\
    \ useful when a real object is impractical or impossible to incorporate into a\
    \ unit test.\n\nThe common coding style for testing with mock objects is −\n\n\
    - Create instances of mock objects.\n- Set state and expectations in the mock\
    \ objects.\n- Invoke domain code with mock objects as parameters.\n- Verify consistency\
    \ in the mock objects.\n\nGiven below is an example of MockObject using Jmock.\n\
    \n```java\nimport org . jmock . Mockery ;\nimport org . jmock . Expectations ;\n\
    \nclass PubTest extends TestCase {\n    Mockery context = new Mockery ();\n  \
    \  public void testSubReceivesMessage () {\n        // set up\n        final Sub\
    \ sub = context . mock ( Sub . class );\n        Pub pub = new Pub ();\n     \
    \   pub . add ( sub );\n        final String message = \"message\" ;\n       \
    \ // expectations\n        context . checking ( new Expectations () {\n      \
    \      oneOf ( sub ). receive ( message );\n        });\n        // execute\n\
    \        pub . publish ( message );\n        // verify\n        context . assertIsSatisfied\
    \ ();\n    }\n}\n```\n"
