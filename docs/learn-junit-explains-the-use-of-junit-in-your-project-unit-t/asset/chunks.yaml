    \ XML 片段中的单个节点（通过 `NodeTest` 类）。\n\n让我们假设有两个想要比较的 XML 片段，并断言它们是相等的。我们可以编写如下的简单测试类\
    \ −\n\n```java\nimport org . custommonkey . xmlunit . XMLTestCase ;\n\npublic\
    \ class MyXMLTestCase extends XMLTestCase {\n    // 此测试方法比较两个 XML 片段\n    @Test\n\
    \    public void testForXMLEquality () throws Exception {\n        String myControlXML\
    \ = \"<msg><uuid>0x00435A8C</uuid></msg>\" ;\n        String myTestXML = \"<msg><localId>2376</localId></msg>\"\
    \ ;\n        assertXMLEqual ( \"Comparing test xml to control xml\" , myControlXML\
    \ , myTestXML );\n    }\n}\n```\n\n## MockObject\n\n在单元测试中，模拟对象（mock objects）可以模拟复杂的真实（非\
    \ mock）对象的行为，因此当真实对象无法或难以集成到单元测试中时，它们非常有用。\n\n使用模拟对象进行测试的通用编码风格如下如下：\n\n- 创建模拟对象的实例。\n\
    - 在模拟对象中设置状态和期望。\n- 使用模拟对象作为参数调用领域代码。\n- 验证模拟对象的一致性。\n\n下面是一个使用 Jmock 使用 MockObject\
    \ 的示例。\n\n```java\nimport org . jmock . Mockery ;\nimport org . jmock . Expectations\
    \ ;\n\nclass PubTest extends TestCase {\n    Mockery context = new Mockery ();\n\
    \    public void testSubReceivesMessage () {\n        // set up\n        final\
    \ Sub sub = context . mock ( Sub . class );\n        Pub pub = new Pub ();\n \
    \       pub . add ( sub );\n        final String message = \"message\" ;\n   \
    \     // expectations\n        context . checking ( new Expectations () {\n  \
    \          oneOf ( sub ). receive ( message );\n        });\n        // execute\n\
    \        pub . publish ( message );\n        // verify\n        context . assertIsSatisfied\
    \ ();\n    }\n}\n```\n\n"
