    # Plug with Eclipse


    To set up JUnit with eclipse, follow the steps given below.


    ## Step 1: Download JUnit Archive


    Download a JUnit jar based on the operating system you have on your system.


    | OS | Archive Name |


    | Windows | junit4.10.jar |


    | Linux | junit4.10.jar |


    | Mac | junit4.10.jar |


    Assume you have copied the above JAR file onto the folder C:\>JUnit.


    ## Step 2: Set Eclipse Environment


    Open eclipse → right click on project and click on property > Build Path > Configure
    Build Path and add the junit-4.10.jar in the libraries using the button Add External
    Jar.


    ![Image](Image00000.jpg)


    We assume that your Eclipse has inbuilt JUnit plugin. If it is not available in
    C:\>eclipse\plugins directory, then you can download it from **JUnit Plugin**
    . Unzip the downloaded zip file in the plugin folder of the Eclipse. Finally restart
    Eclipse.


    Now your Eclipse is ready for the development of JUnit test cases.


    ## Step 3: Verify JUnit installation in Eclipse


    Create a project **TestJunit**  in Eclipse at any location. Then create a class **MessageUtil**
     to test in the project.


    /*


    * This class prints the given message on console.


    */


    public class MessageUtil {


    private String message ;


    //Constructor


    //@param message to be printed


    public MessageUtil ( String message ){


    this . message = message ;


    }


    // prints the message


    public String printMessage (){


    System . out . println ( message );


    return message ;


    }


    }


    Create a test class **TestJunit**  in the project.


    import org . junit . Test ;


    import static org . junit . Assert . assertEquals ;


    public class TestJunit {


    String message = "Hello World" ;       


    MessageUtil messageUtil = new MessageUtil ( message );


    @Test


    public void testPrintMessage () {       


    assertEquals ( message , messageUtil . printMessage ());


    }


    }


    Following should be the project structure −


    ![Image](Image00001.jpg)


    Finally, right click the program and run as JUnit to verify the output of the
    program.


    ![Image](Image00002.jpg)


    Verify the result.


    ![Image](Image00003.jpg)


    # Extensions


    Following are the JUnit extensions −


    *   Cactus


    *   JWebUnit


    *   XMLUnit


    *   MockObject


    ## Cactus


    Cactus is a simple test framework for unit testing server-side java code (Servlets,
    EJBs, Tag Libs, Filters). The intent of Cactus is to lower the cost of writing
    tests for server-side code. It uses JUnit and extends it. Cactus implements an
    in-container strategy that executes the tests inside a container.


    Cactus ecosystem is made of several components −


    *   **Cactus Framework**  is the heart of Cactus. It is the engine that provides
    the API to write Cactus tests.


    *   **Cactus Integration Modules**  are front-ends and frameworks that provide
    easy ways of using the Cactus Framework (Ant scripts, Eclipse plugin, and Maven
    plugin).


    The following code demonstrates how Cactus can be used.


    import org . apache . cactus .*;


    import junit . framework .*;


    public class TestSampleServlet extends ServletTestCase {


    @Test


    public void testServlet () {


    // Initialize class to test


    SampleServlet servlet = new SampleServlet ();


    // Set a variable in session as the doSomething()


    // method that we are testing


    session . setAttribute ( "name" , "value" );


    // Call the method to test, passing an


    // HttpServletRequest object (for example)


    String result = servlet . doSomething ( request );


    // Perform verification that test was successful


    assertEquals ( "something" , result );


    assertEquals ( "otherValue" , session . getAttribute ( "otherName" ));


    }


    }


    ## JWebUnit


    JWebUnit is a Java-based testing framework for web applications. It wraps existing
    testing frameworks such as HtmlUnit and Selenium with a unified, simple testing
    interface to test the correctness of your web applications.


    JWebUnit provides a high-level Java API for navigating a web application combined
    with a set of assertions to verify the application''s correctness. This includes
    navigation via links, form entry and submission, validation of table contents,
    and other typical business web application features.


    The simple navigation methods and ready-to-use assertions allow for more rapid
    test creation than using only JUnit or HtmlUnit. And if you want to switch from
    HtmlUnit to other plugins such as Selenium (available soon), there is no need
    to rewrite your tests.


    Here is a sample code.


    import junit . framework . TestCase ;


    import net . sourceforge . jwebunit . WebTester ;


    public class ExampleWebTestCase extends TestCase {


    private WebTester tester ;


    public ExampleWebTestCase ( String name ) {


    super ( name );


    tester = new WebTester ();


    }


    //set base url


    public void setUp () throws Exception {


    getTestContext (). setBaseUrl ( "http://myserver:8080/myapp" );


    }


    // test base info


    @Test


    public void testInfoPage () {


    beginAt ( "/info.html" );


    }


    }


    ## XMLUnit


    XMLUnit provides a single JUnit extension class, XMLTestCase, and a set of supporting
    classes that allow assertions to be made about −


    *   The differences between two pieces of XML (via Diff and DetailedDiff classes).


    *   The validity of a piece of XML (via Validator class).


    *   The outcome of transforming a piece of XML using XSLT (via Transform class).'
