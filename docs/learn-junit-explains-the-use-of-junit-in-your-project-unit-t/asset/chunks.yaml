  trans: "\n\nJUnit 4 引入了一个名为 `parameterized tests`（参数化测试）的新功能。参数化测试允许开发者使用不同的值多次运行测试。创建参数化测试需要遵循以下五个步骤。\n\
    \n*   使用 `@RunWith(Parameterized.class)` 注解测试类。\n*   创建一个带有 `@Parameters` 注解的公共静态方法，该方法返回一个\
    \ `Objects` 的 `Collection`（以 `Array` 形式）作为测试数据集。\n*   创建一个公共构造函数，接收等同于测试数据某一个“行”的参数。\n\
    *   为测试数据的每一“列”创建一个实例变量。\n*   使用实例变量作为测试数据源创建你的测试用例。\n\n测试用例将为每行数据调用一次。让我们来看看参数化测试的实际运行情况。\n\
    \n## 创建一个类\n\n创建一个要测试的 java 类，例如在 `C:\\>JUNIT_WORKSPACE` 中创建 `PrimeNumberChecker.java`。\n\
    \n```java\npublic class PrimeNumberChecker {\n    public Boolean validate ( final\
    \ Integer primeNumber ) {\n        for ( int i = 2 ; i < ( primeNumber / 2 );\
    \ i ++) {\n            if ( primeNumber % i == 0 ) {\n                return false\
    \ ;\n            }\n        }\n        return true ;\n    }\n}\n```\n\n## 创建参数化测试用例类\n\
    \n创建一个 java 测试类，例如 `PrimeNumberCheckerTest.java`。在 `C:\\>JUNIT_WORKSPACE` 中创建一个名为\
    \ `PrimeNumberCheckerTest.java` 的 java 类文件。\n\n```java\nimport java . util . Arrays\
    \ ;\nimport java . util . Collection ;\nimport org . junit . Test ;\nimport org\
    \ . junit . Before ;\nimport org . junit . runners . Parameterized ;\nimport org\
    \ . junit . runners . Parameterized . Parameters ;\nimport org . junit . runner\
    \ . RunWith ;\nimport static org . junit . Assert . assertEquals ;\n\n@RunWith\
    \ ( Parameterized . class )\npublic class PrimeNumberCheckerTest {\n    private\
    \ Integer inputNumber ;\n    private Boolean expectedResult ;\n    private PrimeNumberChecker\
    \ primeNumberChecker ;\n\n    @Before\n    public void initialize () {\n     \
    \   primeNumberChecker = new PrimeNumberChecker ();\n    }\n\n    // 每个参数都应该作为参数放在这里\n\
    \    // 每当运行器触发时，它将传递\n    // 我们在 primeNumbers() 方法中定义的参数\n    public PrimeNumberCheckerTest\
    \ ( Integer inputNumber , Boolean expectedResult ) {\n        this . inputNumber\
    \ = inputNumber ;\n        this . expectedResult = expectedResult ;\n    }\n\n\
    \    @Parameterized . Parameters\n    public static Collection primeNumbers ()\
    \ {\n        return Arrays . asList ( new Object [][] {\n            { 2 , true\
    \ },\n            { 6 , false },\n            { 19 , true },\n            { 22\
    \ , false },\n            { 23 , true }\n        });\n    }\n\n    // 此测试将运行 5\
    \ 次，因为我们定义了 5 个参数\n    @Test\n    public void testPrimeNumberChecker () {\n  \
    \      System . out . println ( \"Parameterized Number is : \" + inputNumber );\n\
    \        assertEquals ( expectedResult ,\n        primeNumberChecker . validate\
    \ ( inputNumber ));\n    }\n}\n```\n\n## 创建测试运行类\n\n在 `C:\\>JUNIT_WORKSPACE` 中创建一个名为\
    \ `TestRunner.java` 的 java 类来执行测试用例。\n\n```java\nimport org . junit . runner .\
    \ JUnitCore ;\nimport org . junit . runner . Result ;\nimport org . junit . runner\
    \ . notification . Failure ;\n\npublic class TestRunner {\n    public static void\
    \ main ( String [] args ) {\n        Result result = JUnitCore . runClasses (\
    \ PrimeNumberCheckerTest . class );\n        for ( Failure failure : result .\
    \ getFailures ()) {\n            System . out . println ( failure . toString ());\n\
    \        }\n        System . out . println ( result . wasSuccessful ());\n   \
    \ }\n}\n```\n\n使用 `javac` 编译 `PrimeNumberChecker`、`PrimeNumberCheckerTest` 和 `TestRunner`\
    \ 类。\n\n```bash\nC:\\JUNIT_WORKSPACE>javac PrimeNumberChecker.java PrimeNumberCheckerTest.java\n\
    ```\n\n`TestRunner.java`\n\n现在运行测试运行器，它将运行提供的测试用例类中定义的测试用例。\n\n```bash\nC:\\JUNIT_WORKSPACE>java\
    \ TestRunner\n```\n\n验证输出。\n\n```\nParameterized Number is : 2\nParameterized\
    \ Number is : 6\nParameterized Number is : 19\nParameterized Number is : 22\n\
    Parameterized Number is : 23\ntrue\n```\n\n# 使用 ANT 插件\n\n我们将通过示例演示如何使用 ANT 运行\
    \ JUnit。请按照下面的步骤操作。\n\n## 步骤 1：下载 Apache Ant\n\n根据你正在使用的操作系统下载 `Apache Ant`。\n\
    \n| OS | 归包名称 |\n| :--- | :--- |\n| Windows | apache-ant-1.8.4-bin.zip |\n| Linux\
    \ | apache-ant-1.8.4-bin.tar.gz |\n| Mac | apache-ant-1.8.4-bin.tar.gz |\n\n##\
    \ 步骤 2：设置 Ant 环境\n\n将环境变量 `ANT_HOME` 指向基础目录位置，即 Ant 库存储在你的机器上的位置。我们假设 Ant 库存储在\
    \ `apache-ant-1.8.4` 文件夹中。\n\n| 序号 | OS 及描述 |\n| :--- | :--- |\n| 1 | Windows:将环境变量\
    \ `ANT_HOME` 设置为 `C:\\Program Files\\Apache Software Foundation\\apache-ant-1.8.4`\
    \ |\n| 2 | Linux:export ANT_HOME = /usr/local/apache-ant-1.8.4 |\n| 3 | Mac:export\
    \ ANT_HOME = /usr/local/apache-ant-1.8.4 |\n\n将 Ant 编译器位置添加到系统路径如下：\n\n| OS |\
    \ 输出 |\n| :--- | :--- |\n| Windows | `%ANT_HOME%\\bin` |\n| Linux | `PATH=$ANT_HOME/bin`\
    \ |\n| Mac | `PATH=$ANT_HOME/bin` |\n\n## 步骤 3：下载 JUnit\n\n下载适合你操作系统的 JUnit 包。\n\
    \n| OS | 归包名称 |\n| :--- | :--- |\n| Windows | junit-4.1.jar |\n| Linux | junit-4.1.jar\
    \ |\n| Mac | junit-4.1.jar |\n\n## 步骤 4：创建项目结构\n\n*   在 `C:\\>JUNIT_WORKSPACE`\
    \ 中创建 `test` 文件夹。\n*   在 `C:\\>JUNIT_WORKSPACE` 中创建 `src` 文件夹。\n*   在 `C:\\>JUNIT_WORKSPACE`\
    \ 中创建 `lib` 文件夹。\n*   将 `junit-4.1.jar` 复制到 `lib` 文件夹。\n*   将 `PrimeNumberChecker.java`\
    \ 复制到 `src` 文件夹。\n*   将 `PrimeNumberCheckerTest.java` 复制到 `src` 文件夹。\n*   在 `C:\\\
    >JUNIT_WORKSPACE` 中创建一个名为 `build.xml` 的文件。\n\n## 创建 build.xml\n\n我们将使用 Ant 中的\
    \ `<junit>` 任务来执行我们的测试用例。\n\n```xml\n<project name=\"JunitTest\" default=\"test\"\
    \ basedir=\".\">\n    <property name=\"testdir\" location=\"test\" />\n    <property\
    \ name=\"srcdir\" location=\"src\" />\n    <property name=\"full-compile\" value=\"\
    true\" />\n\n    <path id=\"classpath.base\" />\n    <path id=\"classpath.test\"\
    >\n        <pathelement location=\"lib/junit-4.1.jar\" />\n        <pathelement\
    \ location=\"${testdir}\" />\n        <pathelement location=\"${srcdir}\" />\n\
    \        <path refid=\"classpath.base\" />\n    </path>\n\n    <target name=\"\
    clean\">\n        <delete verbose=\"${full-compile}\">\n            <fileset dir=\"\
    ${testdir}\" includes=\"**/*.class\" />\n        </delete>\n    </target>\n\n\
    \    <target name=\"compile\" depends=\"clean\">\n        <javac srcdir=\"${srcdir}\"\
    \ destdir=\"${testdir}\" verbose=\"${full-compile}\">\n            <classpath\
    \ refid=\"classpath.test\" />\n        </javac>\n    </target>\n\n    <target\
    \ name=\"test\" depends=\"compile\">\n        <junit>\n            <classpath\
    \ refid=\"classpath.test\" />\n            <formatter type=\"brief\" usefile=\"\
    false\" />\n            <test name=\"TestMessageUtil\" />\n        </junit>\n\
    \    </target>\n</project>\n```\n\n"
