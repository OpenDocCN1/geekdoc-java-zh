    # API


    The most important package in JUnit is **junit.framework** , which contains all
    the core classes. Some of the important classes are as follows −


    | Sr.No. | Class Name | Functionality |


    | 1 | Assert | A set of assert methods. |


    | 2 | TestCase | A test case defines the fixture to run multiple tests. |


    | 3 | TestResult | A TestResult collects the results of executing a test case.
    |


    | 4 | TestSuite | A TestSuite is a composite of tests. |


    ## Assert Class


    Following is the declaration for **org.junit.Assert**  class −


    public class Assert extends java.lang.Object


    This class provides a set of assertion methods useful for writing tests. Only
    failed assertions are recorded. Some of the important methods of Assert class
    are as follows −


    | Sr.No. | Methods & Description |


    | 1 | void assertEquals(boolean expected, boolean actual)Checks that two primitives/objects
    are equal. |


    | 2 | void assertFalse(boolean condition)Checks that a condition is false. |


    | 3 | void assertNotNull(Object object)Checks that an object isn''t null. |


    | 4 | void assertNull(Object object)Checks that an object is null. |


    | 5 | void assertTrue(boolean condition)Checks that a condition is true. |


    | 6 | void fail()Fails a test with no message. |


    Let''s use some of the above-mentioned methods in an example. Create a java class
    file named TestJunit1.java in **C:\>JUNIT_WORKSPACE** .


    import org . junit . Test ;


    import static org . junit . Assert .*;


    public class TestJunit1 {


    @Test


    public void testAdd () {


    //test data


    int num = 5 ;


    String temp = null ;


    String str = "Junit is working fine" ;


    //check for equality


    assertEquals ( "Junit is working fine" , str );


    //check for false condition


    assertFalse ( num > 6 );


    //check for not null value


    assertNotNull ( temp );


    }


    }


