    \ with Eclipse\n\nTo set up JUnit with eclipse, follow the steps given below.\n\
    \n## Step 1: Download JUnit Archive\n\nDownload a JUnit jar based on the operating\
    \ system you have on your system.\n\n| OS | Archive Name |\n| :--- | :--- |\n\
    | Windows | `junit4.10.jar` |\n| Linux | `junit4.10.jar` |\n| Mac | `junit4.10.jar`\
    \ |\n\nAssume you have copied the above JAR file onto the folder `C:\\>JUnit`.\n\
    \n## Step 2: Set Eclipse Environment\n\nOpen eclipse → right click on project\
    \ and click on `property` > `Build Path` > `Configure Build Path` and add the\
    \ `junit-4.10.jar` in the libraries using the button `Add External Jar`.\n\n![Image](Image00000.jpg)\n\
    \nWe assume that your Eclipse has inbuilt JUnit plugin. If it is not available\
    \ in `C:\\>eclipse\\plugins` directory, then you can download it from **JUnit\
    \ Plugin**. Unzip the downloaded zip file in the plugin folder of the Eclipse.\
    \ Finally restart Eclipse.\n\nNow your Eclipse is ready for the development of\
    \ JUnit test cases.\n\n## Step 3: Verify JUnit installation in Eclipse\n\nCreate\
    \ a project `TestJunit` in Eclipse at any location. Then create a class `MessageUtil`\
    \ to test in the project.\n\n```java\n/*\n* This class prints the given message\
    \ on console.\n*/\npublic class MessageUtil {\n    private String message ;\n\
    \    //Constructor\n    //@param message to be printed\n    public MessageUtil\
    \ ( String message ){\n        this . message = message ;\n    }\n    // prints\
    \ the message\n    public String printMessage (){\n        System . out . println\
    \ ( message );\n        return message ;\n    }\n}\n```\n\nCreate a test class\
    \ `TestJunit` in the project.\n\n```java\nimport org . junit . Test ;\nimport\
    \ static org . junit . Assert . assertEquals ;\n\npublic class TestJunit {\n \
    \   String message = \"Hello World\" ; \n    MessageUtil messageUtil = new MessageUtil(message);\n\
    \n    @Test\n    public void testPrintMessage () {\n        assertEquals ( message\
    \ , messageUtil . printMessage ());\n    }\n}\n```\n\nFollowing the project structure:\n\
    \n![Image](Image00001.jpg)\n\nFinally, right click the program and run as JUnit.\n\
    \n![Image](Image00002.jpg)\n\nVerify the output.\n\n![Image](Image00003.jpg)\n\
    \n# Extensions\n\nFollowing are the extensions:\n\n*   Cactus\n*   JWebUnit\n\
    *   XMLUnit\n*   MockObject\n\n## Cactus\n\nCactus is a simple test framework\
    \ for unit testing server-side code (Servlets, EJBs, Tag Libs, Filters). The intent\
    \ of Cactus is to lower the cost of writing tests for server-side. It uses JUnit\
    \ and extends it.\n\nCactus ecosystem is made of several components:\n\n*   **Cactus\
    \ Framework** is the heart of Cactus. It is the engine that provides the API to\
    \ write tests.\n*   **Cactus Integration Modules** are front-ends and frameworks\
    \ that provide easy ways of using the Cactus (Ant scripts, Eclipse plugin, Maven\
    \ plugin).\n\nThe following code demonstrates how Cactus can be used:\n\n```java\n\
    import org . apache . cactus.*;\nimport junit . framework ..*;\n\npublic class\
    \ TestSampleServlet extends TestCase {\n    @Test\n    public void testServlet\
    \ () {\n        // Initialize class to test\n        SampleServlet servlet = new\
    \ SampleServlet ();\n        // Set a variable in session as the doSomething()\n\
    \        // method that we are testing\n        session . setAttribute ( \"name\"\
    \ , \"value\" );\n        // Call the method to test, passing an\n        // HttpServletRequest\
    \ object (for example)\n        String result = servlet . doSomething ( request\
    \ );\n        // Perform verification that test was successful\n        assertEquals\
    \ ( \"something\" , result );\n        assertEquals ( \"otherValue\" , session\
    \ . getAttribute ( \"otherName\" ));\n    }\n}\n```\n\n## JWebUnit\n\nJWebUnit\
    \ is a Java-based testing framework for web applications. It wraps existing testing\
    \ frameworks such as HtmlUnit and Selenium with a unified, simple testing interface\
    \ to test the correctness of your web applications.\n\nJWebUnit provides a high-level\
    \ Java API for navigating a web application combined with a set of assertions\
    \ to verify the application's correctness. This includes navigation via links,\
    \ form entry and submission, validation of table contents, and other typical business\
    \ web application features.\n\nThe simple navigation methods and ready-to-use\
    \ assertions allow for more rapid test creation than using only JUnit or HtmlUnit.\
    \ And if you want to switch from HtmlUnit to other plugins such as Selenium (available\
    \ soon), there is no need to rewrite your tests.\n\nHere is a sample code:\n\n\
    ```java\nimport junit . framework . TestCase ;\nimport net . sourceforge . jwebunit\
    \ . WebTester ;\n\npublic class ExampleWebTestCase extends TestCase {\n    private\
    \ WebTester tester ;\n    public ExampleWebTestCase ( String name ) {\n      \
    \  super ( name );\n        tester = new WebTester ();\n    }\n    //set base\
    \ url\n    public void setUp () throws Exception {\n        getTestContext ().\
    \ setBaseUrl ( \"http://myserver:8080/myapp\" );\n    }\n    // test base info\n\
    \    @Test\n    public void testInfoPage () {\n        beginAt ( \"/info.html\"\
    \ );\n    }\n}\n```\n\n## XMLUnit\n\nXMLUnit provides a single JUnit extension\
    \ class, `XMLTestCase`, and a set of supporting classes that allow assertions\
    \ to be made about:\n\n*   The differences between two pieces of XML (via `Diff`\
    \ and `DetailedDiff` classes).\n*   The validity of a piece of XML (via `Validator`\
    \ class).\n*   The outcome of transforming a piece of XML using XSLT (via `Transform`\
    \ class).\n"
