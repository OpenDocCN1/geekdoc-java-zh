  trans: "\n\n# 参数化测试\n\nJUnit 提供了一种使用不同数据多次运行相同测试的方法。这是通过 `@Parameterized` 注解和数据源实现的。\n\
    \n## 创建类\n\n创建一个要进行测试的 Java 类，例如在 `C:\\>JUNIT_WORKSPACE` 中创建 `MessageUtil.java`。\n\
    \n添加一个处理消息的方法。\n\n```java\n/*\n* 此类在控制台上处理给定的消息。\n*/\npublic class MessageUtil\
    \ {\n    private String message;\n\n    //构造函数\n    //@param message 要打印的消息\n\
    \    public MessageUtil (String message){\n        this.message = message;\n \
    \   }\n\n    // 处理消息\n    public void processMessage(String input){\n        System.out.println(\"\
    Processing: \" + input);\n    }\n}\n```\n\n## 创建测试用例类\n\n创建一个 Java 测试类，例如 `TestJunit.java`。使用\
    \ `@Parameterized` 为测试提供多个输入。\n\n在 `C:\\>JUNIT_WORKSPACE` 中创建一个名为 `TestJunit.java`\
    \ 的 Java 类文件。\n\n```java\nimport org.junit.Test;\nimport org.junit.Parameterized;\n\
    import static org.junit.Assert.assertEquals;\n\n@Parameterized(name = \"{0}\"\
    )\npublic class TestJunit {\n    private String input;\n    private String expected;\n\
    \n    public TestJunit(String input, String expected) {\n        this.input =\
    \ input;\n        this.expected = expected;\n    }\n\n    @Test\n    public void\
    \ testProcessMessage() {\n        MessageUtil messageUtil = new MessageUtil(input);\n\
    \        // 为了演示，我们检查逻辑\n        assertEquals(expected, input);\n    }\n\n   \
    \ @Parameters\n    public static Object[] data() {\n        return new Object[][]\
    \ {\n            {\"Robert\", \"Robert\"},\n            {\"Hi!\", \"Hi!\"},\n\
    \            {\"JUnit\", \"JUnit\"}\n        };\n    }\n}\n```\n\n## 创建测试运行器类\n\
    \n在 `C:\\>JUNIT_WORKSPACE` 中创建一个名为 `TestRunner.java` 的 Java 类来执行测试用例。\n\n```java\n\
    import org.junit.runner.JUnitCore;\nimport org.junit.runner.Result;\nimport org.junit.runner.notification.Failure;\n\
    \npublic class TestRunner {\n    public static void main(String[] args) {\n  \
    \      Result result = JUnitCore.runClasses(TestJunit.class);\n        for (Failure\
    \ failure : result.getFailures()) {\n            System.out.println(failure.toString());\n\
    \        }\n        System.out.println(result.wasSuccessful());\n    }\n}\n```\n\
    \n使用 `javac` 编译 `MessageUtil`、`TestJunit` 和 `TestRunner` 类。\n\n`C:\\JUNIT_WORKSPACE>javac\
    \ MessageUtil.java TestJunit.java TestRunner.java`\n\n现在运行 Test Runner，它将使用提供的数据运行测试用例。\n\
    \n`C:\\JUNIT_WORKSPACE>java TestRunner`\n\n验证输出结果。所有参数化测试均已执行。\n\ntrue\n\n"
- fmt: "\nJUnit 4 has introduced a new feature called `parameterized tests`. Parameterized\
    \ tests allow a developer to run the same test over and over again using different\
    \ values. There are five steps that you need to follow to create a parameterized\
    \ test.\n\n* Annotate test class with `@RunWith(Parameterized.class)`.\n* Create\
    \ a public static method annotated with `@Parameters` that returns a `Collection`\
    \ of `Objects` (as `Array`) as test data set.\n* Create a public constructor that\
    \ takes in what is equivalent to one \"row\" of test data.\n* Create an instance\
    \ variable for each \"column\" of test data.\n* Create your test case(s) using\
    \ the instance variables as the source of the test data.\n\nThe test case will\
    \ be invoked once for each row of data. Let us see parameterized tests in action.\n\
    \n## Create a Class\n\nCreate a java class to be tested, say `PrimeNumberChecker.java`\
    \ in `C:\\>JUNIT_WORKSPACE`.\n\n```java\npublic class PrimeNumberChecker {\n \
    \   public Boolean validate ( final Integer primeNumber ) {\n        for ( int\
    \ i = 2 ; i < ( primeNumber / 2 ); i ++) {\n            if ( primeNumber % i ==\
    \ 0 ) {\n                return false ;\n            }\n        }\n        return\
    \ true ;\n    }\n}\n```\n\n## Create Parameterized Test Case Class\n\nCreate a\
    \ java test class, say `PrimeNumberCheckerTest.java`. Create a java class file\
    \ named `PrimeNumberCheckerTest.java` in `C:\\>JUNIT_WORKSPACE`.\n\n```java\n\
    import java . util . Arrays ;\nimport java . util . Collection ;\nimport org .\
    \ junit . Test ;\nimport org . junit . Before ;\nimport org . junit . runners\
    \ . Parameterized ;\nimport org . junit . runners . Parameterized . Parameters\
    \ ;\nimport org . junit . runner . RunWith ;\nimport static org . junit . Assert\
    \ . assertEquals ;\n\n@RunWith ( Parameterized . class )\npublic class PrimeNumberCheckerTest\
    \ {\n    private Integer inputNumber ;\n    private Boolean expectedResult ;\n\
    \    private PrimeNumberChecker primeNumberChecker ;\n\n    @Before\n    public\
    \ void initialize () {\n        primeNumberChecker = new PrimeNumberChecker ();\n\
    \    }\n\n    // Each parameter should be placed as an argument here\n    // Every\
    \ time runner triggers, it will pass the arguments\n    // from parameters we\
    \ defined in primeNumbers() method\n    public PrimeNumberCheckerTest ( Integer\
    \ inputNumber , Boolean expectedResult ) {\n        this . inputNumber = inputNumber\
    \ ;\n        this . expectedResult = expectedResult ;\n    }\n\n    @Parameterized\
    \ . Parameters\n    public static Collection primeNumbers () {\n        return\
    \ Arrays . asList ( new Object [][] {\n            { 2 , true },\n           \
    \ { 6 , false },\n            { 19 , true },\n            { 22 , false },\n  \
    \          { 23 , true }\n        });\n    }\n\n    // This test will run 4 times\
    \ since we have 5 parameters defined\n    @Test\n    public void testPrimeNumberChecker\
    \ () {\n        System . out . println ( \"Parameterized Number is : \" + inputNumber\
    \ );\n        assertEquals ( expectedResult ,\n        primeNumberChecker . validate\
    \ ( inputNumber ));\n    }\n}\n```\n\n## Create Test Runner Class\n\nCreate a\
    \ java class file named `TestRunner.java` in `C:\\>JUNIT_WORKSPACE` to execute\
    \ test case(s).\n\n```java\nimport org . junit . runner . JUnitCore ;\nimport\
    \ org . junit . runner . Result ;\nimport org . junit . runner . notification\
    \ . Failure ;\n\npublic class TestRunner {\n    public static void main ( String\
    \ [] args ) {\n        Result result = JUnitCore . runClasses ( PrimeNumberCheckerTest\
    \ . class );\n        for ( Failure failure : result . getFailures ()) {\n   \
    \         System . out . println ( failure . toString ());\n        }\n      \
    \  System . out . println ( result . wasSuccessful ());\n    }\n}\n```\n\nCompile\
    \ the `PrimeNumberChecker`, `PrimeNumberCheckerTest` and `TestRunner` classes\
    \ using `javac`.\n\n```bash\nC:\\JUNIT_WORKSPACE>javac PrimeNumberChecker.java\
    \ PrimeNumberCheckerTest.java\n```\n\n`TestRunner.java`\n\nNow run the Test Runner,\
    \ which will run the test cases defined in the provided Test Case class.\n\n```bash\n\
    C:\\JUNIT_WORKSPACE>java TestRunner\n```\n\nVerify the output.\n\n```\nParameterized\
    \ Number is : 2\nParameterized Number is : 6\nParameterized Number is : 19\nParameterized\
    \ Number is : 22\nParameterized Number is : 23\ntrue\n```\n\n# Plug with ANT\n\
    \nWe will have an example to demonstrate how to run JUnit using ANT. Follow the\
    \ steps given below.\n\n## Step 1: Download Apache Ant\n\nDownload `Apache Ant`\
    \ based on the operating system you are working on.\n\n| OS | Archive Name |\n\
    | :--- | :--- |\n| Windows | apache-ant-1.8.4-bin.zip |\n| Linux | apache-ant-1.8.4-bin.tar.gz\
    \ |\n| Mac | apache-ant-1.8.4-bin.tar.gz |\n\n## Step 2: Set Ant Environment\n\
    \nSet the `ANT_HOME` environment variable to point to the base directory location,\
    \ where the ANT libraries are stored on your machine. Let us assume the Ant libraries\
    \ are stored in the folder `apache-ant-1.8.4`.\n\n| Sr.No. | OS & Description\
    \ |\n| :--- | :--- |\n| 1 | Windows:Set the environment variable `ANT_HOME` to\
    \ `C:\\Program Files\\Apache Software Foundation\\apache-ant-1.8.4` |\n| 2 | Linux:export\
    \ ANT_HOME = /usr/local/apache-ant-1.8.4` |\n| 3 | Mac:export ANT_HOME = /Library/apache-ant-1.8.4`\
    \ |\n\nAppend Ant compiler location to the System Path as follows −:\n\n| OS |\
    \ Output |\n| :--- | :--- |\n| Windows | `%ANT_HOME%\\bin` |\n| Linux | `PATH=$PATH:$ANT_HOME/bin`\
    \ |\n| Mac | `PATH=$PATH:$ANT_HOME/bin` |\n\n## Step 3: Download JUnit\n\nDownload\
    \ JUnit Archive that suits your operating system.\n\n| OS | Archive Name |\n|\
    \ :--- | :--- |\n| Windows | junit-4.12.jar |\n| Linux | junit-4.12.jar |\n| Mac\
    \ | junit-4.12.jar |\n\n## Step 4: Create Project Structure\n\n*   Create a folder\
    \ `test` in `C:\\>JUNIT_WORKSPACE`.\n*   Create a folder `src` in `C:\\>JUNIT_WORKSPACE`.\n\
    *   Create a folder `lib` in `C:\\>JUNIT_WORKSPACE`.\n*   Copy `junit-4.12.jar`\
    \ into the `lib` folder.\n*   Copy `PrimeNumberChecker.java` into the `src` folder.\n\
    *   Copy `PrimeNumberCheckerTest.java` into the `src` folder.\n*   Create a file\
    \ named `build.xml` in `C:\\>JUNIT_WORKSPACE`.\n\n## Create ANT Build.xml\n\n\
    We'll be using `<junit>` task in Ant to execute our test cases.\n\n```xml\n<project\
    \ name=\"JunitTest\" default=\"test\" basedir=\".\">\n    <property name=\"testdir\"\
    \ location=\"test\" />\n    <property name=\"srcdir\" location=\"src\" />\n  \
    \  <property name=\"full-compile\" value=\"true\" />\n\n    <path id=\"classpath.base\"\
    \ />\n    <path id=\"classpath.test\">\n        <pathelement location=\"lib/junit-4.12.jar\"\
    \ />\n        <pathelement location=\"${testdir}\" />\n        <pathelement location=\"\
    ${srcdir}\" />\n        <path refid=\"classpath.base\" />\n    </path>\n\n   \
    \ <target name=\"clean\">\n        <delete verbose=\"${full-compile}\">\n    \
    \        <fileset dir=\"${testdir}\" includes=\"**/*.class\" />\n        </delete>\n\
    \    </target>\n\n    <target name=\"compile\" depends=\"clean\">\n        <javac\
    \ srcdir=\"${srcdir}\" destdir=\"${testdir}\" verbose=\"${full-compile}\">\n \
    \           <classpath refid=\"classpath.test\" />\n        </javac>\n    </target>\n\
    \n    <target name=\"test\" depends=\"compile\">\n        <junit>\n          \
    \  <classpath refid=\"classpath.test\" />\n            <formatter type=\"brief\"\
    \ usefile=\"false\" />\n            <test name=\"TestMessageUtil\" />\n      \
    \  </junit>\n    </target>\n</project>\n```\n\nRun the following Ant command.\n\
    \n```bash\nC:\\JUNIT_WORKSPACE\\TestJunitWithAnt>ant\n```\n"
