    # THE WATERFALL MODEL


    # 2.2 ANALYSIS


    When the task formulation is in place, and you agree with the customer, that the
    task should be solved in accordance with the agreed schedule and price, the actual
    system development starts. The first step is to complete an analysis for the purpose


    +   1. to clarify all ambiguities regarding the content of the task formulation

    2. to determine if there are any risks and other significant uncertainties

    3. to determine there are external references and partners

    4. to draw up a final requirement specification

    5. to update the schedule, including the requirements for resource consumption


    # 2.2.1 AMBIGUITIES


    The task formulation describes the overall, but not the details. This will be
    done as part of the analysis. Therefore, there will typically be a number of questions
    and interpretation back, and things that are not written in the task formulation.
    Everything must be covered before we can address the development of the program.
    It can only be done in cooperation with the customer, but also further along in
    the process it may be necessary to contact the customer to clarify matters regarding
    the requirements for the task. The analysis is a process extending over time when
    there is frequent contact between the customer and the developers.


    ’The task of clarifying the ambiguities is the actual analysis work and it is
    here that the developers inform themselves about the task to be solved. The developers
    are experts in software development, but they do not necessarily have knowledge
    in the field where the program should be used and the solution of many tasks require
    that developers gain understanding and about how the program should be used, including
    the organization where the program must be used. Finally, it may happen that the
    solution of the task requires products and tools that the developers do not have
    knowledge of, and if so, it is also a knowledge to be obtained. The analysis is
    thus also a phase for knowledge gathering.


