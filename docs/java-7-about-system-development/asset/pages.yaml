  md: '![](img/5a18da81f445a74ebda77e0208d33638_91_0.png)


    Use cases are drawn as ellipses with a short text telling what the use case is
    about. A use case is an operation (a user''s interaction) with the program within
    a short period of time that can be perceived as a single session. For example
    an actor can perform a search in the library and have as a result a number of
    titles that matches the criteria. Similarly, a user can view details about a book
    and possibly borrow it.


    Actors are drawn with a symbol to illustere a user and with a name below. In this
    case, there are four actors, which are all persons, but the actors do not have
    to be a person, may, for example also be a hardware device or another program.
    If so, you sometimes draw an actor as follows:


    ```

    <<actor>>

    Devicename```

    ```'
