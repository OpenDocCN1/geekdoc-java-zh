  md: '# JAVA 7: ABOUT SYSTEM DEVELOPMENT


    Here are the final three attributes booleans indicating whether an object can
    be thought

    as as an X, Y and Z.


    # CREATE THE DATABASE


    After you have modeled a database by the above procedure and has drawn up a normalized

    relational model, the model should be converted into a database. The model shows
    which

    tables must be, the attributes that are primary keys and the foreign keys, and
    I would assume

    that the finished model is the following:


    | Zipcodes |

    |---|---|

    | Zipcode | Town |


    | Titles |

    |---|---|

    | Ttitid | Title |


    | User |

    |---|---|---|---|---||

    | UserId | Email | Firstname | Lastname | Address | Zipcode |


    | Ttitid | Ttitid | Role |

    |---|---|---|


    | Borrow |

    |---|---|---|

    | UserId | Bookid | Date |


    | Book |

    |---|---|---|---|---|---|---|---||

    | Bookid | Ibn13 | Ibn13 | Title | Edition | Year | Pages | Number | Catid |

    | Text | Pubid |


    | Category |

    |---|---|

    | Catid | Name |


    | Written |

    |---|---|

    | Aut | Autid |


    | Author |

    |---|---|---|---|

    | Aut | Firstname | Lastname | Text |


    | Publisher |

    |---|---|

    | Pubid | Name |


    Back there are a few things that need to be addressed, primarily concerning each
    attribute.


    First, there is the data types, where for each attribute you must select a data
    type. It requires

    knowledge of the problem area and which values the individual fields should contain.

    in particular, you must consider the attributes for text fields, where you must
    specify a size.

    Moreover, you must consider what constraints to be defined for the individual
    data fields,

    and this is particularly


    +   1. surrogate keys

    2. where the fields may contain NULL

    3. possible default values

    4. cascading for foreign keys


