  md: '# JAVA 7: ABOUT SYSTEM DEVELOPMENT


    The aim of third normal form is to eliminate redundancy, which means that the
    same information is recorded at multiple places. Forexample category name must
    not be stored for any books, but to save it in its own table, a book must have
    a reference (foreign key) to the name. When redundancy is unfortunate it is because
    stored the same information in several places, it can mean unnecessary space consumption,
    but the main reason is that it becomes more difficult to maintain the database,
    as it may mean that an information has to be changed in several places. If, for
    example, imagine that you want to change the name of a category (perhaps spells
    wrong), then it would mean if the name was not in its own table that it would
    be necessary to change all books for that category while the database on the third
    normal form only needs to change at one place.


    # OTHER DATABASE IMPROVEMENTS


    If you look at the normalization process, it will typically entails more tables
    in the database, and it is in principle nothing wrong with it but may mean in
    requests to databases are required with many JOIN operations that are actually
    complex to perform by the database management system. One can say that a fully
    normalized database meets maintaining the database, and thus its integrity, but
    not necessarily satisfies queries. Therefore, we speak about denormalisation when
    goes the other way and turn tables together, even if it means that the database
    then contains redundancy. The reason for denormalization can be databases, which
    is rarely updated and you want to optimize for the sake of queries.


    If you have a database normalized to third normal form you have in principle a
    good database design, but there are other considerations to make. For example
    are NULL values a problem - especially for JOIN operations. If you have an attribute
    that is typically NULL, you should consider moving it to his own table. If you,
    as an example, the relation Author has an attribute Text, which is a description
    of an author. One must assume that this attribute will typically be NULL, because
    you''ll rarely describe an author. You can then move it out to its own relation
    with the primary key of the table Author as key. The new relation has two attributes,
    where Autid is primary key and foreign key to the table Author.


    ![](img/5a18da81f445a74ebda77e0208d33638_127_0.png)'
  merge: -1
