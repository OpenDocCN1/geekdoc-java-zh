  md: '# JAVA 7: ABOUT SYSTEM DEVELOPMENT


    The interaction between an actor and a use case is shown with an arrow (sometimes
    just a non-oriented line). In this case, the arrows each time goes from the actor
    to the use case, but it need not be the case and such may be the application that
    sends a message to a hardware device.


    In particular, it is allowed that an actor inherits another actor, and it simply
    means that the actor who inherits everything (the same use cases) that the actor
    who is inherited can plus any other use cases. In the diagram above it is illustrated
    by the fact that the actor Staf inherits Student. An important consequence of
    inheritance is that it can make the diagram simpler (few above) and thus more
    useful to read.


    Sometimes you also choose (few above) to draw a rectangle around all use cases,
    whereas everything inside the rectangle is perceived as the system, while the
    actors are outside and are external.


