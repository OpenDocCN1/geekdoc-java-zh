  md: '# THE WATERFALL MODEL


    Over time we have developed a variety of system development methods, all of which
    have had the object of providing guidelines on how, in practice, to develop a
    program from start to finish. The methods practical importance to system development
    has been variable, probably because it is difficult to develop a method that is
    general enough to accommodate the many systems to be developed, but a little because
    the methods have often been static and easily becomes methods for the methods
    own sake. Therefore, it is typical in practice, to use elements of several methods
    so as give some guidelines to suit the tasks you now work on, but for, everything
    that is said and written concerning system development methods, will not be. It
    says only that it is not so easy to find the right method, and that is it hardly;
    but there are a number of good principles that are worth following, and that is
    what this book talks about.


    However, there are some assets that are repeated in all system development methods:


    +   - Analysis, which examines and determines what it is for a task to be solved,
    and thus formulate the requirements for the finished program.

    - Design, where you decides the task should be solved.

    - Programming, where the product itself is written.

    - Test, which examines the finished program as it works.


    Even for the development of small programs you must go through these activities,
    the content clearly varies depending on the size of the task. So far, I will therefore
    use a method, which consists of six stages or phases:


    +   1. Task formulation

    2. Analysis

    3. Design

    4. Programming

    5. Test

    6. Delivery'
