  md: '# JAVA 7: ABOUT SYSTEM DEVELOPMENT


    # 5.3.5 DESIGN OF THE DAL LAYER


    The DAL layer must define classes to database operations. There must be a class
    for each adapter in the model layer, and basically the classes will consist of
    static methods. Since the program is database heavy, a significant portion of
    the code would be placed in this layer.


    A problem to be solved is to store the username and password to the database server,
    when these values are not hard coded. The values should be stored in a configuration
    file that administrators can be configured.


    # 5.3.6 DESIGN OF THE CONTROLLER LAYER


    In general, there will be a controller class for each dialog box. Although controller
    classes in principle are simple, they will contain some code as they need to validate
    the user input. It typical controller classes sends data to the model, if they
    can validate the data correctly.


    It is also the controller layer that sends mail to users when an administrator
    has to recall books. Java has the necessary classes to send mails.


    # 5.3.7 REMARK TO THE DESIGN


    The result of the design is


    +   1. The above report

    2. a CSV file containing Danish zip codes

    3. a SQL script Library.sql that creates the database

    4. a SQL script Books.sql that creates three books in the database

    5. a NetBeans project with the result of the design


    # 5.4 PROGRAMMING


    The phase requires that the database is created, and the script that creates the
    three books is performed.


    I will divide the programming in four steps (iterations).


    +   1. The book list

    2. Maintenance of books

    3. User administration

    4. Borrowing and returning


    The first iteration is relating to the MainView which should shows a list of all
    books in the database. The iteration also defines the overall look and feel.'
