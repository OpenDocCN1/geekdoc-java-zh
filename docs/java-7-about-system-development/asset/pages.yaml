  md: '# JAVA 7: ABOUT SYSTEM DEVELOPMENT


    # FOREWORD


    # FOREWORD


    This book is the seventh in a series of books on software development. The programming
    language is Java, and the language and its syntax and semantic fills obviously
    much, but the books have also largely focus on the process and how to develop
    good and robust applications. This book focuses is primarily on system development
    and method while programming plays only a minor role, and the book does not address
    anything new with respect to Java. The book does not directly focus on a specific
    system development method, but addresses a number of principles which are general
    and can be applied in all system development projects and may be useful guidelines
    for developing applications in practice. The aim is to set up a framework in which,
    for at least development of small programs, can be useful to both progress during
    the development and quality of the finished product. In addition to principles
    of system development, the book has an appendix that provides a short introduction
    to UML and an appendix that briefly treats the design of databases. The book assumes
    knowledge of programming and Java and the development of applications that use
    databases corresponding to the content of the first books in this series.


    As the title says this series of books deals with software development, and the
    goal is to teach the reader how to develop applications in Java. It can be learned
    by reading about the subject and by studying complete programs, but most importantly
    by yourself to do it and write your own programs from scratch. Therefore, an important
    part of the books is exercises and problems, where the reader has to write programs
    that correspond to the substance treated in the books. All books in the series
    is built around the same skeleton and will consist of examples and exercises that
    are placed in the text where they belong naturally. The difference between exercises
    and problems is that the exercises largely deals with repetitions of the substance
    that is presented in the text, and furthermore it is relatively accurately described
    what to do. Problems are in turn loosely described, and are a little bigger and
    are rarely any clear best solution. These are books to be read from start to finish,
    but the many code examples, including exercises and problems plays a central role,
    and it is important that the reader in detail studying the code to the many examples
    also solves the exercises and problems or possibly just studying the recommended
    solutions.'
