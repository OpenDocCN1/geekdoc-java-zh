  md: '# JAVA 7: ABOUT SYSTEM DEVELOPMENT


    Finally, there is the naming of both tables and attributes. In principle, it is
    clear from the mapping, but often I will in the model for technical reasons, choose
    short names, but for the sake of SQL it often be sensible with a little more attention
    to names. Some recommends the following practices


    +   1. select relatively short but telling names to tables

    2. use as name for a relational table (many-many) the names of the two tables
    referenced separated by an underscore

    3. use the table name (in singular) followed by an underscore as a prefix for
    all attributes

    4. use as name for a foreign key the name of the primary of the table referenced


    It can lead to quite long names, but it ensures the uniqueness of the names in
    the SQL expression, and thus expression is easier to read, so the principle can
    be reasonable.


    Finally is shown a script that creates the database to the library from the above
    design and naming conventions:


    ```

    use palibrary;


    drop table if exists books_authors;

    drop table if exists books_users;

    drop table if exists books;

    drop table if exists publishers;

    drop table if exists categories;

    drop table if exists authors;

    drop table if exists users;

    drop table if exists titles;

    drop table if exists zipcodes;

    ```


    ```

    create table publishers (

    publisher_id int auto_increment not null, # surrogate key for a publisher

    publisher_name varchar(50) not null, # the publisher''s name

    primary key (publisher_id)

    );

    ```


    ```

    create table categories (

    category_id int auto_increment not null, # surrogate key for a category

    category_name varchar(50) not null, # the category''s name

    primary key (category_id)

    );

    ```'
