  md: '![](img/5a18da81f445a74ebda77e0208d33638_36_0.png)


    The above is a common sight on MVC, which seeks decoupling of the elements using
    interfaces. Another question is, in turn, where and how the individual parts/components
    are created. That is, how the individual objects are instantiated and that is
    to a large extent determined by the current development tools. It will be illustrated
    with the following example of a GUI program.


    Another question is what the individual layers concretely contains in the form
    of classes and other types. In general, the view layer may contain a class for
    each window, and there will be, in principle, also be a corresponding controller.
    Moreover, in all three layers there will be other classes and defining interfaces.
    There may also be several layers, and often there will be a layer below the model
    layer, which has the task to map the object-oriented model to for a database.
    This layer is often called a data access layer. For large applications, it may
    also be a possibility to create an overview to subdivide the individual layers,
    so they consist of several packages.


    MVC exists as mentioned in several variants and is a highly used design pattern,
    because it is sufficiently flexible. This may mean that some of the types and
    maybe even layers are not found in a concrete solution. There is nothing wrong
    with that, and you should not, of course complicate a solution needless because
    a pattern prescribes it.'
