  md: '# JAVA 7: ABOUT SYSTEM DEVELOPMENT


    # 2.2.5 THE SCHEDULE


    I mentioned above under the task formulation that you also has to draw up a schedule
    and an estimate of the resources that the task requires. It is actually something
    of a dilemma in system development. During the drafting of the task formulation
    the development department simply lacks the necessary knowledge to prepare an
    estimate of resources. Conversely, the customer needs to know what the solution
    will cost.


    The problem can be solved by letting the estimate from the task formulation be
    an overall estimate. Does it seem reasonable, the customer and the development
    department can agree to carry out an analysis, and only then, when you have sufficient
    knowledge and uncovered all risk factors, you can conduct a detailed scheduling
    with its estimate of resource consumption. Only then can you make the final price
    calculation and possible sign a contract on the overall system development project.


    The question is of course who should pay if the result of the analysis, is that
    the project should not be implemented – for example because it becomes too expensive.
    For large IT projects, it is common that the customers pay for the implementation
    of an analysis probably just for a part of the overall system. Maybe the customer
    even a third party to carry out the analysis, and in this way can the task based
    on a detailed specification of the requirements put out to tender. In any case,
    it means that the final decision for the development of the system can be postponed
    until after the analysis. This strategy keeps return not to smaller tasks. After
    the development of the task formulation and after some general estimates – and
    of course a good deal of experience – the development department has come up with
    a price of the task. It sounds risky, and it is that too, but nevertheless true.
    It is a dilemma, and there is no doubt that the source of unfortunate IT projects
    must be applied here since the customer in his eagerness to get the job done with
    the least cost, a product of poor quality, and when the development department
    in fear of not getting the job providing a low offer, so that in the end may be
    sacrificing quality.


    Where the price is set at one time or another, then after the analysis, it is
    typically necessary to adjust both the time schedule and resource consumption
    – perhaps only for internal use – an adjustment that may result in the need to
    bring project more resources as in system development is the same as man hours.'
