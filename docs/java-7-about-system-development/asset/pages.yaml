    # 2.2.4 REQUIREMENTS SPECIFICATION


    In a way, the requirements specification is the core of the analysis as a determination
    of the total requirements for the finished program. If you have a good requirements
    specification, both parties – the customer and the development department – agree
    on what it is for a task to be solved. Many have had an opinion about the shape
    of the requirements specification and a template has also the advantage that it
    is easier to get it all, but in the book the requirements specification will simply
    be a document without any formality, lists the requirements for the finished program.


    The document is, however, important for it is the agreement, and it is the document
    which must be taken forward in the event of a disagreement between customer and
    development department, on what the task and what needs to be with and possibly
    not. You could say that the more care taken with making the requirements specification,
    the greater the chance there will be no need for it, and the finished program
    is delivered to everyone''s satisfaction.


    The requirements specification may also contain other documents, and I would especially
    point to prototypes. One of the tasks that must be clarified in connection with
    the development of a program, are the requirements for the user interface, and
    for GUI applications, web applications there are often large demands on the development
    of the user interface. The best way to document these requirements is the development
    of a prototype that can be best explained as a program that does not do anything
    but showing the design of the program’s windows. It is far easier to the customer
    to relate to a prototype than descriptions and drawings, and with modern tools
    it is easy for the developers to develop good prototypes. The work is not wasted,
    as it often includes something that still need to be developed at a later date.


    The requirements specification is typically made at the end of the analysis, and
    the foundation is the task formulation and the results of the analysis work with
    clarification of doubts.'
