    be.


    As an alternative, you can create a relation for each derived class, which then
    must contain all attributes from the base class, including the primary key and
    attributes from the derived class:


    | Key | a1 | a2 | a3 | x1 | x2 | x3 |

    |---|---|---|---|---|---|---|

    | Key | a1 | a2 | a3 | y1 | y2 | y3 |

    | Key | a1 | a2 | a3 | z1 | z2 | z3 |'
