  md: '# JAVA 7: ABOUT SYSTEM DEVELOPMENT


    A domain model will consist of at least conceptual classes and associations between
    these classes but not necessarily multiplicities, and often you do not give the
    associations names. If you like, you can also choose to assign attributes to classes
    as shown below, which may help to explain what a conceptual class means, but it
    will just complicate the diagram without adding extra documentation. However there
    is no sharp distinction between what are classes and what are the attributes,
    and applying classes with attributes, you also get the chance to show that you
    found all the main concepts.


    ![](img/5a18da81f445a74ebda77e0208d33638_90_0.png)


    # USE CASE DIAGRAM


    A case diagram is used to model the environments interaction with the program
    and is also an example of a diagram which is used during the analysis. Here, it
    is used typically for illustrating user interaction with the system. There are
    two concepts in the diagram. One is an actor that indicates an entity that program
    interacts with. It will often be a person, but it may also be a hardware device
    or another system. The second element is a use case that is the name of a job
    that the program must perform. The following is a use case diagram for the library
    system.


