  md: '# APPENDIX A


    I have repeatedly mentioned UML as diagrams that can be used in system development.
    I am not a great supporter of UML, but must admits that the diagrams also has
    there uses. Therefore, this appendix provides an overview of the main rules and
    diagram syntax.


    As described above, you means that in the analysis and primarily in design has
    to build a model of a program, for example, which classes the program should consist
    of. To that you can use diagrams that can illustrate the program''s architecture
    and key components, and the advantage is partly that you can work visually with
    the program''s structure, where with you a diagram can draw a model that otherwise
    have to be explained with many words, and the model depends on the programming
    language''s many details.


    My earlier suggested that I am not so great of the diagrams, because they are
    difficult to draw (it takes a long time), and they are time-consuming to maintain,
    if the design changes during the development process. Another problem is that
    the diagrams must have value, and they must be understood by everyone and it is
    necessary to know the rules, and these rules tend to be complex and difficult
    to learn. The first problem can be solved by using specific case tools that support
    the development of such UML diagrams, while the second problem is merely a matter
    of learning the diagram''s syntax.


    UML stands for Unified Modeling Language and is the diagramming intended to models
    software in system development. UML defines various types of diagrams, which are
    aimed at both analysis and design, and in the following I will briefly describe
    the most important of these diagrams and including the most basic drawing rules.
    The idea is that diagrams you can draw a model of a program including the most
    important algorithms, and whatever I have said above, there is certain good uses.
    If you are participating in a project to develop a software solution, then UML
    is excellent to support the process where you jointly by on a blackboard are modeling
    a system using UML diagrams. Here find modeling diagrams more important than documentation
    of the final solution. However, one must also not here underestimate the value
    – especially for creating an overview, but very detailed diagrams, I find rarely
    valuable and I do not feel that the value is commensurate with the resources it
    takes to produce them.


    In short, I find diagrams useful as part of the system development process and
    as a documentation to provide an overview of a large and complex system.'
