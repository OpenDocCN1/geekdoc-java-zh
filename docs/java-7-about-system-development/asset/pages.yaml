  md: '# 5 LIBRARY


    As a final example, I will write a program that can maintain a simple library
    of books, for example on an educational institution. In addition to being able
    to manage the library''s content the program must also be able to manage borrows
    for example to students and staff. It is, therefore, a typical database application.
    The aim is to test the waterfall method and the MVC pattern with an example that
    is a typical office application with a graphical user interface.


    # 5.1 TASK FORMULATION


    The task is to develop a program for managing a library of books at an educational
    institution, when books can be borrowed to the institution''s staff and students.
    The program should partly be able to manage the library''s holdings of books,
    including the registration of new books, and also manage borrowed books and especially
    recall. Since the books are typically textbooks for teaching/research, and where
    you only need small lookups, the application must offer search facilities, where
    you can also see who, where appropriate, have borrowed a specific book.


    The maintenance of the library''s contents is performed by an employee who has
    responsibility for registering new books and delete discontinued titles. Moreover,
    it is also the librarian''s responsible to send reminders to borrowers who have
    not returned books.


    All on the institution can, in principle, borrow a book, and book borrowing is
    a self-service, where a person when borrows books may register himself as a borrower
    of the borrowed books. The library operation is thus based largely on trust.


    # 5.1.1 REMARK TO THE TASK FORMULATION


    The task formulation is nothing but a short description of the task. There are
    many details to be clarified, but it is part of the analysis.


    The results of the phase are alone this document, and a project folder named library.
    Preliminary the folder contains only a subdirectory doc for this document.


    # 5.2 ANALYSIS


    The program is an ordinary PC application running on a machine located in the
    library such that borrowers can registering information about a borrow and return
    books. All who are created as a user, can borrow books, and the principle is that
    if a book leaves the library, it must be registered as borrowed and to whom, and
    when the book later is brought back to the library, the borrower must record the
    book as returned.'
