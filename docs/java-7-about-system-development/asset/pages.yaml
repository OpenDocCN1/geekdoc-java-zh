  md: '# JAVA 7: ABOUT SYSTEM DEVELOPMENT APPENDIX A


    Between the domain model classes, there may be associations that are drawn as
    straight lines and possible also with a name, as shown above. An association expressing
    one or another connection or relationship between the model''s classes. For example
    there is an association between Book and Publisher corresponding to a book is
    published by a publishing house. For associations may be attached multiplicities,
    and as indicates the association Published that a publisher may be associated
    with 0 or more books, while a book is associated with exactly one publisher. You
    can use the following multiplicities:


    +   * 0 or more

    * 1..* 1 or more

    * 1..n 1 to n

    * n exactly n

    * k,m,n exactly k, m or n


