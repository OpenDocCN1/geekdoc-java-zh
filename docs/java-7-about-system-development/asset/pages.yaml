  md: '# JAVA 7: ABOUT SYSTEM DEVELOPMENT


    It is a very simple method, and for larger projects, the method is not comprehensive
    enough or appropriate, for smaller programs it works very well, as mentioned,
    all the six activities are parts of all system development methods. In the literature,
    the method is known as the waterfall method, since the idea is to start to define
    the requirements (analysis), then outlines a solution (design), after which the
    solution is programmed. Finally the finished program is tested (and errors are
    corrected if necessary) before you are ready to take the program in use. In connection
    with the development of today''s complex IT solutions, it is a narrow vision of
    system development, but on this later.


    In the rest of this book, I will describe the method''s activities and what you
    should do in each of the six activities. I will not describe specific tools such
    as diagrams and the like, and it''s actually something that I only to a limited
    extent in practice. However, such development tools also have their entitlements,
    and in the books Appendix A, I have given a description of some tools.


    # 2.1 THE TASK FORMULATION


    When writing a computer program, you have to start to describe what the task is,
    and what it is for a program to write. There is a person, a company or an organization
    (in the folowing called the customer) that has an idea for a program that they
    want developed. It can be anything from a few scattered thoughts, the result of
    a meeting or perhaps the result of a survey, but before the job can be transferred
    to a development team, the task must be presented. It may be verbal or in a document
    or report, but in any case the first thing is to write a document that describe
    the task short and concisely. The task formulation can be prepared by the customer
    or the development department, but typically it will be done in collaboration
    over a shorter period.


    There are no particular requirements for neither the process or form. For big
    jobs, the work can be comprehensive and take time as there must be several meetings,
    collected information etc., and we often talk of a preliminary analysis. The result
    can be a report, where the task is described in general terms, and how important
    success criteria are established. For smaller tasks, it may suffice with a single
    meeting, and the task formulation is perhaps no more than a single sheet of paper.
    In any case, the result of the task formulation is the first step towards the
    goal.'
