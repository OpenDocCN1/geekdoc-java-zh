  md: "# JAVA 7: ABOUT SYSTEM DEVELOPMENT\n\n```\n* @return true, if the user's password\
    \ is changed\n*/\npublic boolean changePassword(String email, String passwd)\n\
    {\n    throw new UnsupportedOperationException();\n}\n```\n\nAs seen in this class,\
    \ the encryption of the users password happens in the model layer. The principle\
    \ is as follows. When creating a new user, you choose a password, which of course\
    \ is just a string. For this password it is calculated a message digest, which\
    \ is just a bit pattern calculated using a hash algorithm. This bit pattern is\
    \ converted to a hexadecimal string and is stored in the database along with the\
    \ other user data. When you again want to read the user’s data (for example at\
    \ logon), you must re-enter the password, calculate a message digest and check\
    \ if it the one stored in the database. The principle is to use a calculation\
    \ algorithm that is strong enough so that no one is capable of the encrypted value\
    \ in the database to determine or guess the user’s password. Java has built-in\
    \ classes for that sort of calculation which is considered to be sufficiently\
    \ strong.\n\n![](img/5a18da81f445a74ebda77e0208d33638_59_0.png)\n\nDownload free\
