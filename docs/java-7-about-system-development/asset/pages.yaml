    Parameters for both the database and the mail server is hard coded, what obviously
    does not hold. These values should be moved to a configuration file. It''s called
    library.config and is preliminary in my home directory and have the following
    form:


    ```

    dbhost:***

    dbport:***

    dbata:***

    duser:***

    dcode:***

    mlhost:***

    mlport:***

    luser:***

    mlcode:***

    ```


    *** should be replaced of current values. The meaning is as follows:


    +   - dbhost is the name of the database server

    - dbport is the port, that the database server use

    - dbbata is the name of database

    - dbuser is the name of the database user

    - dbcode is the password for the database server

    - mlhost is the name of the mail server (smtp server)

    - mlport is the port, that the mail server use

    - mluser is the mail server''s email address

    - mlcode is the password for the database server


    The project has been expanded with a class Servers in the package library.util.
    The class is programmed as a singleton, the private constructor reads the above
