  mdcn: '


    这些角色用于下文实现的用户访问权限。


    用户维护（Maintenance of users）的实现增加了几个新类型。`library.views.tables` 包扩展了两个类：


    - UserTable，它是 JTable 的数据模型，用于显示所有用户的概览。

    - BorrowTable，同样的方式，它是上方所示 JTable 的数据模型，并应用于书籍；目前用户类尚未完成，且表格显示的对象也尚未定义。


    在 `library.views.listeners` 中添加了一个名为 `UserListener` 的接口，它定义了两个方法，用于表示用户被创建、修改或删除。该接口由
    `UserView` 实现。


    在 `library.ctrls` 中为 `UserView` 添加了一个控制器类。该类名为 `UserController`。


    最后添加了两个类：


    - UsersView，用于显示所有用户的概览。

    - UserView，用于编辑用户。


    通过以下步骤完成以测试该功能：


    - 1. 创建三个用户

    - 2. 关闭窗口

    - 3. 再次打开窗口

    - 4. 修改这三个用户中的每一个

    - 5. 关闭窗口

    - 6. 再次打开窗口

    - 7. 删除这三个用户

    - 8. 创建一个管理员（Admin）用户

    - 9. 创建一个员工（Staff）用户

    - 10. 创建一个学生（Student）用户


    程序首次运行时，原则上没有用户和标题。决定必须始终存在一个用户角色为 0 的超级用户，并拥有管理员（Administrator）权限。当程序启动时，它会检查此用户和标题是否存在，如果不存在，程序将自动打开一个对话框，让你创建这个超级用户以及管理员标题。该类和该超级用户都必须被删除或更改。


    ## JAVA 7：关于系统开发


    `UserData`、`Users` 和 `UserController` 类已更新。此外，`library.views` 包添加了以下类：


    - AdminView，与 `View` 几乎相同的对话框，但你无法选择标题和角色。

    - SuperView，用于输入超级用户密码的简单对话框。


    此外，还添加了一个名为 `LogonListener` 的接口并由 `MainView` 实现。它定义了一个方法，当你输入正确密码时由 `SuperView`
    调用。


    在本次迭代中，实现了用户访问权限。它包括：


    - 1. 在 `library.models` 中添加了 `CurrentUser` 类。该类实现为单例并代表当前用户。程序启动后没有用户——即没有用户登录。

    - 2. 添加了一个新控制器，名为 `LogonController`，作为下方对话框的控制器。

    - 3. 在 `logon` 中添加了 `DialogView` 类。该类可以在 `library.views` 中找到。

    - 4. 添加了名为 `PasswordController` 的额外控制器，作为后续对话框的控制器。

    - 5. 在 `library.views` 中又添加了一个视图。该对话框名为 `PasswordView`，供当前用户更改密码。

    - 6. 最后在 `library.views` 中添加了对话框类 `DetailView`，当学生在概览中双击某本书时，该对话框会打开。结果是，具有学生访问权限的用户只能查看书籍详情，而不能更改数据。学生可以借用书籍，但这将在下一次迭代中首先实现。


    我还修改了 `MainView` 类，使得更多菜单项变为可用，但根据用户访问权限只能访问特定的菜单项。同样地，对话框也会发生更改，但根据当前用户，某些按钮将处于禁用状态。


    上述结果测试如下：


    - 1. 当程序打开时，应该只能访问带有所有书籍概览的 `MainView`（用户应该能够应用过滤器）和常规（General）菜单

    - 2. 以学生身份登录——现在应该还可以访问“用户”（Users）菜单

    - 3. 双击书籍以测试 `DetailsView` 对话框

    - 4. 修改当前用户的密码


