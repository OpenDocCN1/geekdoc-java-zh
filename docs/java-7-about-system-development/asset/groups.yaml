    something to do with attributes. I find the ER diagram particularly useful, especially
    in collaboration with others to model a database, especially I think it''s a great
    tool if you are more and have a blackboard available. Conversely, the class diagram
    is easier to draw, and a large ER diagram can quickly become confusing. Therefore,
    I often use in the initial modeling of an ER diagram without attributes that shows
