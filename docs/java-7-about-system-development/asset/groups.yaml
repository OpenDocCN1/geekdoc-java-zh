    Beans 项目，在实践中，参考其他系统开发方法，会有几个项目。在分析期间，可能就有例如实验或原型的项目。同样，我通常会用 Beans 项目来记录设计，这个项目将在编程阶段继续工作，但我将对它的副本（或更准确地说是创建一个项目的副本）继续工作。由于我是进行迭代工作，我将从上一次迭代的项目副本开始每次迭代，然后项目文件夹将包含许多
    NetBeans 项目。


    这种项目管理方法极其简单，只不过是一个管理项目文档和版本的简单程序，但对于小型项目，尤其是单人项目，这种程序运行良好。必须强调的是，对于有许多团队成员的大型项目，你必须做得更好。在这里必须使用
    IT 工具，包括管理不同版本的文档。


    ## 2.3 设计


    下一个活动被称为设计，简而言之，你可以说分析关注项目应该做什么，而设计处理程序如何被编写。这意味着设计转移了系统开发的重心，分析工作负责确定需求并收集信息，而设计处理如何构建产品。设计阶段不应该编写程序，但设计与编程之间的界限并不严格，因此设计也可以包含编程决策。


    # JAVA 7：关于系统开发


    ## 瀑布模型


    IT 系统的设计与其他产品或建筑设计非常相似。如果你在盖房子，你就会开始画图纸，显示房间的位置和大小，窗户和门应该在哪里等。如果不是，结果可能是一个随机的房子，你可能会面临门放得无法打开或者房间没有门的情况。房子的质量需要规划和模型。IT
    系统也是如此。如果你在考虑不同解决方案时没有进行良好的设计，你得到的程序可能解决了任务，但程序结构是随机的，且未来将无法维护。设计的目标正是确保符合程序质量的决策。


    与分析相反，设计很大程度上取决于任务，同样难以为设计阶段的实施建立标准，但以下是典型的活动：


    - 整体程序架构设计。

    - 模型层类设计。

    - 程序存储库设计。

    - 算法设计。

    - 用户界面设计。


    但也可能需要进行实验来测试解决方案和技术。


    ## 2.3.1 架构


    应用程序可能由许多类组成，轻松达到100多个。在这种情况下，跟踪所有类的含义可能很难，因此人们选择将相同概念的类组织在模块中。在这种背景下，我们说的是应用程序架构，人们通常目标是模块化架构。没有明确的最佳架构，但经验表明具有图形用户界面的程序可以基于三层架构：


    | 视图 |

    | 控制器 |

    | 模型 |


