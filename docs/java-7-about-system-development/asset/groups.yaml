    \ along with the other user data. When you again want to read the user’s data\
    \ (for example at logon), you must re-enter the password, calculate a message\
    \ digest and check if it the one stored in the database. The principle is to use\
    \ a calculation algorithm that is strong enough so that no one is capable of the\
    \ encrypted value in the database to determine or guess the user’s password. Java\
    \ has built-in classes for that sort of calculation which is considered to be\
