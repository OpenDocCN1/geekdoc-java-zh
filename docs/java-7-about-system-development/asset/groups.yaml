    ## 2.2.5 进度安排


    我在上面的任务定型中提到过，你还必须制定一份进度表以及该任务所需的资源估算。这在系统开发中实际上是一个两难境地。在起草任务定型期间，开发部门简单地缺乏准备资源估算所需的必要知识。相反，客户需要知道解决方案的成本是多少。


    这个问题可以通过让任务定型中的估算成为一个总体估算来解决。这看起来是合合理的：客户和开发部门可以同意进行分析，只有在你们拥有了足够的知识并揭示了所有风险因素后，你就可以根据资源消耗的估算进行详细的进度安排。只有在此之后，你才能进行最终的价格计算，并可能对整个系统开发项目签署合同。


    问题自然是，如果分析结果显示项目不应该实施，由谁付钱——例如因为成本太高了。对于大型 IT 项目，客户通常支付分析实施的费用，这可能只是针对整个系统的一部分。也许客户甚至会委托第三方来进行分析，这样就可以根据详细的需求说明书发布任务进行招标。无论如何，这意味着系统的开发的最终决策可以推迟到分析之后。这种策略将风险保持在较小的任务中。在完成任务定型并在经过一些性估算后——当然还有大量的经验——开发部门得出了一个任务的价格。这听起来很有风险，事实如此，但它是真实的。这是一个两难境地，毫无疑问，不幸
    IT 项目的源头就在此：因为客户渴望以最低成本完成工作，导致产品质量差；而开发部门因为担心得不到工作而提供低报价，导致最终可能牺牲质量。


    当价格在某个时候被设定后，那么在分析之后，通常需要同时调整时间表和资源消耗——可能仅供内部使用——这种调整可能导致需要为项目引入更多资源，因为在系统开发中资源等同于工时。


    # JAVA 7：关于系统开发


    ## 瀑布模型


    ## 2.2.6 分析文档


    与系统开发的其他阶段一样，分析结果以分析报告的形式记录。我已经提到过需求规格书和时间表是该文档的关键部分，但其他工作也必须记录，这些记录将主要由会议摘要和分析期间收集的文档组成。这种记录有两个原因：


    - 第一，文档应作为系统开发项目其余部分的基础。

    - 第二，文档将用于程序的未来维护。


    文档不会自动产生，为了将其写下来可能需要大量工作。这也是为什么系统开发方法受到批评的原因之一，也是开发部门未能通过编写文档来节省工作的原因。然而，也有同样多的例子显示文档的缺失。这时你必须编写必要的内容，绝不要为了写文档而写文档——它必须具有价值。在书中仅有一个项目仅仅是为了准备文档，我认为这是有用的。


