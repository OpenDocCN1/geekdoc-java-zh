    ## THE WATERFALL MODEL


    There are special IT tools to help manage and maintain this documentation and
    in general help manage the entire project. I will not mention such tools for now,
    but then, I will mention what I do in practice. If I have to write a program (implementing
    a system) I start as mentioned in task formulation to create a folder for the
    entire project – hereafter called the project folder. Here I create subfolders
    according to the magnitude of the task, but always the documentation in the form
    of the task formulation, the requirements specification, other project reports
    and more. There may also be a subfolder of meeting summaries, a subfolder to other
    material, etc. The project folder will also contain Beans projects, and in practice
    by reference to other system development methods, there will be several. Already
    during the analysis there could be projects for example experiments or prototypes.
    In the same way I typically document the designed with a Beans project, a project
    which I will continue to work on in the programming phase, but that I will continue
    to work on a copy (or more accurately create a copy of the project). As I work
    iteratively, I will start each iteration with a copy of my project from the previous
    iteration, and the project folder will then contain many NetBeans projects.


    The approach to the administration of a project is extremely simple and not much
    more than a simple procedure for managing a project''s documents and versions,
    but for small projects and especially one-man projects the procedure is working
    well. It is important to emphasize that for large projects with many team members
    you have to do it better. Here it is necessary to use IT tools, including to manage
    different versions of documents.


    ## 2.3 DESIGN


    The next activity is called design, and short, you can say that the analysis is
    concerned with what the project should be able to do, while the design deals with
    how the program should be written. This means that the design shift the focus
    in system development, where the analysis work to determine the requirements and
    collect information while the design tackles how to construct the product. It
    is not supposed to write the program in the design phase, but that the gap between
    design and programming is not sharp, so that the design can also include programming
    decisions.


