    ## JAVA 7: ABOUT SYSTEM DEVELOPMENT


    ## THE WATERFALL MODEL


    ## 2.2 ANALYSIS


    When the task formulation is in place, and you agree with the customer, that the
    task should be solved in accordance with the agreed schedule and price, the actual
    system development starts. The first step is to complete an analysis for the purpose:


    - 1. to clarify all ambiguities regarding the content of the task formulation

    - 2. to determine if there are any risks and other significant uncertainties

    - 3. to determine there are external references and partners

    - 4. to draw up a final requirement specification

    - 5. to update the schedule, including the requirements for resource consumption


    ### 2.2.1 AMBIGUITIES


