    # NORMALIZATION


    We see that a relational model is on first form if it consists of relations which
    has no attributes, and if all relations have a primary key. If you have completed
    the above mapping, it will automatically be satisfied, and the above model is
    on first form. You can also think of it in that way, that you can create a database
    from a relational model that is on first form.


    A relational model is on second form if it is on first form and if for any relation
    applies that it does not contain attributes, which is determined by a part of
    the primary key. The fact that a relation is not on second form that it contains
    information on more concepts, and therefore should be divided into two relations
    where the attributes determined by a part of the primary key, are moved into a
    new relation together with the controlling part of the primary key, and it is
    a primary key in the new relation. In the original, the controlling part of the
    primary key is a foreign key to the new relation. If a relationship does not have
    a composite primary key, it is per definition on second form. In the current example,
