    # JAVA 7：关于系统开发


    最后，我想提到，状态图可以由多个状态图组成。如果你有一个巨大的状态图，它将变得难以管理，此时你可以像下面一样显示内部状态机：


    ![](img/5a18da81f445a74ebda77e0208d33638_113_0.png)


    上述内容并非对 UML 的完整描述，但它能向你展示什么是 UML 及其用途，以及一些存在的图类型和主要的绘图规则。有很多工具可以用于绘制不同的 UML 图，在应用
    UML 时，应该对这些工具感兴趣并花时间学习它们是如何工作的，否则绘图的工作量可能会非常庞大。作为一个例子，我可以提到 *Dia* 这个程序。


    ![](img/5a18da81f445a74ebda77e0208d33638_113_1.png)


    # 附录 B


    在本附录中，我将简要介绍数据库设计。在设计程序时，需要确定哪些数据必须存储在数据库中，而问题在于应该如何设计数据库以及需要包含哪些表。这并没有明确的答案，但有一些非常精确的建议可以遵循，而这也是本附录的主题。


    # ER 图


    第一步是绘制 ER 图（实体联系图）。实际上，你可以使用类图来代替，它提供了相同的机会，但 ER 图是直接为关系型数据库设计设计的，也是我在实践中经常使用的一种图。ER
    图使用了三种符号：


    ![](img/5a18da81f445a74ebda77e0208d33638_114_0.png)


    当一个实体描述什么是表的候选者时，实体的角色类似于类图中的类。属性（attribute）是实体的属性，因此对应于类中的变量，它是数据库表中列的候选者。最后，关系（relation）是实体之间的关系，因此对应类图中的关系。例如，图中展示了图书馆数据库的
    ER 图：


    ![](img/5a18da81f445a74ebda77e0208d33638_114_1.png)


    有四个实体，分别是书籍（Book）、作者（Author）、出版商（Publisher）和用户（User）。你可以像寻找模型层中的类一样找到这些实体，当然，这没有明确的解决方案。这可能并不重要，因为如果你找到了正确的属性，那么以下规则几乎位于相同的表中。最好的办法是思考需要保存哪些数据，并将它们组织在相应的实体中。


    如果你考虑书籍（Book）实体有 9 个属性，这里有一个类别（Category）的示例作为复合属性的例子，它由 `Categoryid` 和 `Categoryname`
    组成，分别表示类别的标识和类别名称。此外，所有其他属性也应该被记录，以确保它们的用途是明确无误的。这些属性是已经进行的分析的结果，在分析中，你已经确定了要存储在数据库中的元素。


    作者（Author）实体有两个属性，其中一个是复合属性。该实体定义了关于作者的信息，分析证明了该实体应该拥有这些属性。


    书籍（Book）和作者（Author）两个实体之间是多对多的关系，两端都显示为 **。该关系表示一本书可能与多个作者相关，对应于该书可能有多个作者。同样，一个作者可能与多本书相关，因为一个作者可能写过好本书。


    出版商（Publisher）实体代表出版商，只有一个属性，即出版商名称。这里书籍（Book）和出版商（Publisher）之间存在关系，但是一对多的关系。在书籍（Book）实体处有一个
    *，表示一个出版商可能出版过多本书，而出版商端的基数数量是 1。这表示一本书必须恰好有一个出版商。


    最后，用户（User）有 7 个属性，其中两个是复合的。Email 属性带有下划线，这意味着它可以用作主键。也就是说，假设它是主键。这些属性是已经进行的分析的结果，在分析中，你已经确定了要存储在数据库中的元素。

    '
