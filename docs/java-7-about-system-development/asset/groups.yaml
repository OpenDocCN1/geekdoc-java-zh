    specific variant addresses is what each layer should contain and how the communication
    between the layers should be.


    The layers are a draw for a modular program architecture, but there may be multiple
    layers, and each layer can – and will be – divided into modules across.


    In the final example I will show how the pattern can be applied in practice.


