    # APPENDIX A


    I have repeatedly mentioned UML as diagrams that can be used in system development.
    I am not a great supporter of UML, but must admit that the diagrams also have
    their uses. Therefore, this appendix provides an overview of the main rules and
    diagram syntax.


    As described above, you mean that in the analysis and primarily in design has
    to build a model of a program, for example, which classes the program should consist
    of. To that you can use diagrams that can illustrate the program''s architecture
    and key components, and the advantage is partly that you can work visually with
    the program''s structure, where with you a diagram can draw a model that otherwise
    have to be explained with many words, and the model depends on the programming
    language''s many details.


    My earlier suggested that I am not so great of the diagrams, because they are
    difficult to draw (it takes a long time), and they are time-consuming to maintain,
    if the design changes during the development process. Another problem is that
    the diagrams must have value, and they must be understood by everyone and it is
    necessary to know the rules, and these rules tend to be complex and difficult
    to learn. The first problem can be solved by using specific case tools that support
    the development of such UML diagrams, while the second problem is merely a matter
    of learning the diagram''s syntax.


    UML stands for Unified Modeling Language and is the diagramming intended to model
    software in system development. UML defines various types of diagrams, which are
    aimed at both analysis and design, and in the following I will briefly describe
    the most important of these diagrams and including the most basic drawing rules.
    The idea is that diagrams you can draw a model of a program including the most
    important algorithms, and whatever I have said above, there is certain good uses.
    If you are participating in a project to develop a software solution, then UML
    is excellent to support the process where you jointly by on a blackboard are modeling
    a system using UML diagrams. Here find modeling diagrams more important than documentation
    of the final solution. However, one must also not here underestimate the value
    – especially for creating an overview, but very detailed diagrams, I find rarely
    valuable and I do not feel that the value is commensurate with the resources it
    takes to produce them.


    In short, I find diagrams useful as part of the system development process and
    as a documentation to provide an overview of a large and complex system.


    # JAVA 7: ABOUT SYSTEM DEVELOPMENT


    In this appendix, I will as mentioned introduce UML. There are many rules and
    not all are mentioned, but the emphasis is on the rules – diagrams which I find
    most useful. The diagrams are all drawn using LibreOffice Draw, and most examples
    are taken from the project in this book and the development of a library program
    and will partly illustrate the basically drawing rules, and also where and how
    diagrams can be used.


    # DOMAIN MODEL


    I will start with a domain model, which is a diagram during the analysis can be
    used to illustrate the main concepts that are part of a software solution. The
    diagram consists of conceptual classes that are drawn as rectangles, as well as
    associations between these classes. Below is a domain model for the library program:


    ![](img/5a18da81f445a74ebda77e0208d33638_88_0.png)


    The diagram shows the key concepts for this program. It’s a simple diagram, but
    it can be useful at a preliminary stage in the analysis to provide an overview
    of the key concepts in the upcoming program’s problem area. In this case there
    is shown 6 key concepts, but it is by no means which concepts to be there, and
    in this case there could be more. However, you should avoid making the diagram
    to detailed and keep focused on the main concepts. It is important to note that
    the classes in the domain model is not the same as software classes. The domain
    model will be an inspiration for the classes that the program should consist of,
    and many classes from a domain model will subsequently also at the design you
    could recover as software classes, but not necessarily all. When you draw a domain
    model you must stay focused on the conceptual concepts and not thinking in software
    engineering.


    # JAVA 7: ABOUT SYSTEM DEVELOPMENT APPENDIX A


    Between the domain model classes, there may be associations that are drawn as
    straight lines and possible also with a name, as shown above. An association expressing
    one or another connection or relationship between the model''s classes. For example
    there is an association between Book and Publisher corresponding to a book is
    published by a publishing house. For associations may be attached multiplicities,
    and as indicates the association Published that a publisher may be associated
    with 0 or more books, while a book is associated with exactly one publisher. You
    can use the following multiplicities:


    - * 0 or more

    - 1..* 1 or more

    - 1..n 1 to n

    - n exactly n

    - k,m,n exactly k, m or n


    ![](img/5a18da81f445a74ebda77e0208d33638_89_0.png)


    # JAVA 7: ABOUT SYSTEM DEVELOPMENT


    A domain model will consist of at least conceptual classes and associations between
    these classes but not necessarily multiplicities, and often you do not give the
    associations names. If you like, you can also choose to assign attributes to classes
    as shown below, which may help to explain what a conceptual class means, but it
    will just complicate the diagram without adding extra documentation. However there
    is no sharp distinction between what are classes and what are the attributes,
    and applying classes with attributes, you also get the chance to show that you
    found all the main concepts.


    ![](img/5a18da81f445a74ebda77e0208d33638_90_0.png)


    # USE CASE DIAGRAM


    A case diagram is used to model the environments interaction with the program
    and is also an example of a diagram which is used during the analysis. Here, it
    is used typically for illustrating user interaction with the system. There are
    two concepts in the diagram. One is an actor that indicates an entity that program
    interacts with. It will often be a person, but it may also be a hardware device.
    The second element is a use case that is the name of a job that the program must
    perform. The following is a use case diagram for the library.


    Download free eBooks at bookoon.com


    ![](img/5a18da81f445a74ebda77e0208d33638_91_0.png)


    Use cases are drawn as ellipses with a short text telling what the use case is
    about. A use case is an operation (a user''s interaction) within a short period.
    For example an actor can perform a search in the library and have as result number
    of titles. Similarly, a user can view details about a book and possibly borrow
    it.


    Actors are drawn with a symbol to illustrate a user and with a name below. In
    this case there are four actors, which are all persons, but the actors do not
    have to be a person. If so, you sometimes draw an actor as follows:


    <<actor

    Device


    # JAVA 7: ABOUT SYSTEM DEVELOPMENT


    The interaction between an actor and a use case is shown with an arrow (sometimes
    just a non-oriented line). In this case, the arrows each time goes from the actor
    to the use case, but it need not be the case and such may be the application that
    sends a message to a hardware device.


    In particular, it is allowed that an actor inherits another actor, and it simply
    means that the actor who inherits everything (the same use cases) that the actor
    who is inherited can plus any other use cases. In the diagram above it is illustrated
    by the fact that the actor Staf inherits Student. An important consequence of
    inheritance is that it can make the diagram simpler and thus more useful to read.


    Sometimes you also choose to draw a rectangle around all use cases, whereas everything
    inside the rectangle is perceived as the system, while the actors are outside
    and are external.


