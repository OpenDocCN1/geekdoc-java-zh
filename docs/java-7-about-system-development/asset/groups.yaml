    在领域模型类之间可能存在关联，它们被画成直线，并且可能带有名称，如上所示。关联表示模型类之间的某种连接或关系。例如，“书（Book）”与“出版社（Publisher）”之间存在关联，对应于“一本书由一家出版社出版”。关联可以附加重系数，正如关联“出版（Published）”所示，一个出版社可以关联
    0 本或多本书，而一本书恰好关联一个出版社。你可以使用以下重系数：


    - * 0 个或或多个

    - 1..* 1 个或多个

    - 1..n 1 到 n

    - n 恰好 n

    - k,m,n 恰好 k, m 或 n


