    ## 状态机 (STATE MACHINES)


    状态图或状态机是一种建模对象的图，对象可能处于不同的状态，并由于可能发生的事件改变状态。一个经典的例子是运行中的进程。当你启动程序时，操作系统将创建一个表示运行应用程序的进程，进程从新状态开始。此后，进程的生命周期可以如下图所示建模，其中椭圆表示状态，箭头表示转换。


    ![](img/5a18da81f445a74ebda77e0208d33638_111_0.png)


    # JAVA 7：系统开发介绍


    当进程处于`new`状态时，它可以切换到另外两个状态之一：就绪（ready），意味着进程准备好在 CPU 上运行（当时间到达时）；就绪挂起（ready suspended），意味着进程已就绪但尚未执行（例如作为稍后运行的服务或批作业）。如果进程处于就绪挂起，它可以切换到就绪模式（当就绪时间发生时）。就绪队列中的就绪进程可以再次挂起（如果进程实例执行了
    `sleep()`）或切换到阻塞（blocked），意味着它正在等待资源（通常是 IO 操作，如磁盘上的块）。最后，可能是进程已完成（程序结束），进程随后将切换到终止（terminated）状态，在移除之前删除所有分配的资源。当等待资源的阻塞进程准备好继续时（例如磁盘控制器信号磁盘操作已完成），则进程返回就绪状态。阻塞进程也可以切换到阻塞挂起（例如交换操作），从这里它可以切切回阻塞或就绪挂起。


    状态机特别适用于像上面那样周期性改变状态的对象生命周期建模，实际上有很多这种情况。因此，它是一种非常有用的图，图通常如上面所示绘制，但它也有扩展。例如，当对象切换到特定状态时执行特定状态的操作，或者当从该状态改变时，你甚至可以指定由于特定事件进入状态执行的操作：


    | 状态 |

    | 进入时: action1 |

    | 事件时: action2 |

