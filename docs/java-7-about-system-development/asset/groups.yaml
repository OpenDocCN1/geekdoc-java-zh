    作为最后一个示例，我将编写一个可以维护简单书籍库的程序，例如针对某教育机构。除了管理图书馆的内容外，程序还必须能够管理借阅情况，例如针对学生和员工。因此，这是一个典型的数据库应用程序。其目标是通过一个带有图形用户界面的典型办公应用程序示例来测试瀑布模型和
    MVC 模式。


    # 5.1 任务定义


    任务是开发一个用于管理教育机构书籍库的程序，书籍可以借给该机构的员工和学生。程序应该部分能够管理图书馆的藏书籍（包括新书的注册），并管理借出的书籍，特别是催还。由于书籍通常是教学/研究的教材，且你只需要小范围查询，因此应用程序必须提供搜索功能，你还可以在其中查看在适当谁借阅了某本特定的书。


