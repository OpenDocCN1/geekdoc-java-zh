    # JAVA 7：关于系统开发


    如果我们再次考虑类模型的第一版本，你可以看到 Publisher（出版者）、Category（类别）和 Author（作者）都有 get 和 set 方法，因此似乎该类缺少了一些变量。然而，事实并非如此（在设计阶段并非如此），因为它们对应于类之间的关系。


    如果你考虑上述类模型，它们通常需要额外的文档，其中至少有必要记录方法，而 UML 也有关于如何进行操作的语法。然而，我更倾向于用纯文本来记录方法，简要解释每个方法的含义——可能也包括变量。


    如果有多个类，这些类之间就会存在关系，通常情况下可以是：


    - 1. 关联 (association)

    - 2. 聚合 (aggregation)

    - 3. 组合 (composition)

    - 4. 继承 (inheritance)


    这些关系通过类图来展示，下面显示了图书馆程序模型层的类图。让我立即说明一下，该图的画法并不正确，因为选择关系的类型是为了展示语法。如果你看 User 和 Book
    这两个类，图中显示了这两个类之间的关系。它被画成一个从 User 到 Book 的箭头，并列出了一个多重性，表示 User 可能与多个 Book 对象相关。这是一个关联的示例，表示一种松散的关系，这种关系不一定在程序的整个生命周期内都存在。在这种情况下，表示
    User 借用了一本书的关系，当用户在某时还了书时，该关系就消失了。因此，它被显示为关联。多重性显示为 * 意味着一个用户可以借更多的书。这意味着该关系必须在
    User 类中实现为类型为 Book 的对象列表列表。


    # JAVA 7：关于系统开发


    ![](img/5a18da81f445a74ebda77e0208d33638_100_0.png)


    Book 类和 Publisher 类之间也存在关系，因为根据多重性显示，一个 Book 对象恰好关联于一个 Publisher。该关系在 Book 类中实现为一个类型为
    `Publisher` 的实例变量。该关系被显示为聚合（Aggregation），意味着两个对象之间的固定连接。书籍不会更换出版者，人们可以把聚合理解为它所指的是书籍所包含的内容。然而，聚合的对象可以有自己的生命，即使聚合消失了它也可以存在，并且它可以被聚合到多个
    Book 对象中。聚合反映了比关联更强的关系。


    同样，Category 类与 Book 是聚合关系，但这通过多重性可能表示书籍并不一定有一个类别，但如果有的话，该类别就不会改变。


    图中还显示了 Book 和 Author 之间的关系，当多重性为 * 时，它必须在 Book 类中实现为一个包含 Author 对象的列表。该关系也被设计为聚合，但它是一种更强的聚合，被称为组合（composition）。区别在于，作者再次被视为书籍的一部分，具有更强的连接，即如果一个
    Book 对象被删除，属于它的 Author 对象也必须被删除。也就是说，作者对象不能拥有自己的生命，而这是不正确的。原则上，作者可能写过几本书书，因此可能与多个
    Book 对象关联。我上面将该关系设为组合，仅仅是为了展示语法。


    JAVA 7：关于系统开发


