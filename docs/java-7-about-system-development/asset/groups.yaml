    ![](img/5a18da81f445a74ebda77e0208d33638_130_0.png)


    where there of course does not need to be three derived classes, and where each
    class can have both fewer and more attributes. I will show 4 options for mapping
    this structure of a relational model.


    One possibility is to create a relation for each of the four classes (entities):


    | Key | a1 | a2 | a3 |

    |---|---|---|---|

    | Key | z1 | z2 | z3 |

    | Key | y1 | y2 | y3 |

    | Key | x1 | x2 | x3 |


    ![](img/5a18da81f445a74ebda77e0208d33638_130_1.png)


    That is to create a relation with the base class attributes and its primary key.
    There are also created a relation for each of the derived classes, wherein each
    relation contains the derived class attributes and the key from the base class.
    The primary key of the relations for the derived classes is the primary key from
    the base class, and it is also a foreign key to the base class. You can say that
    it is a general method that can be used regardless of how the specialization may
    be.


    As an alternative, you can create a relation for each derived class, which then
    must contain all attributes from the base class, including the primary key and
    attributes from the derived class:


    | Key | a1 | a2 | a3 | x1 | x2 | x3 |

    |---|---|---|---|---|---|---|

    | Key | a1 | a2 | a3 | y1 | y2 | y3 |

    | Key | a1 | a2 | a3 | z1 | z2 | z3 |'
  - '[PAGE 131]


    # JAVA 7: ABOUT SYSTEM DEVELOPMENT


    This solution is only interesting if an object is always an X, Y or Z, but can
    not be a base object. The solution is thus of interest in the situation where
    the base is an abstract class.


    As another example, it is a mapping where all the attributes together in a single
    relation:


    | Key | a1 | a2 | a3 | x1 | x2 | x3 | y1 | y2 | y3 | z1 | z2 | z3 | t |


    This solution requires an additional attribute – referred herein as t for type
    which indicates the type of object in question. It is a design that has the disadvantage
    that it leads to many NULL values (where, for example it is a X object, all the
    y and z attributes must be NULL and the solution therefore has greatest, if the
    derived classes have few attributes.


    When designing databases it quite happens that an object can be several things,
    for example both an X, Y and Z. If you have such a design, consider the following
    mapping, which is a variant of the above:


    | Key | a1 | a2 | a3 | x1 | x2 | x3 | y1 | y2 | y3 | z1 | z2 | z3 | t1 | t2 |
    t3 |


