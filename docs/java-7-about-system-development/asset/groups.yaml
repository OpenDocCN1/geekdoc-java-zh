    # JAVA 7: ABOUT SYSTEM DEVELOPMENT MVC


    In the figure, are both the model, view and controller defined by an interface.
    It is not certain that it will be the case in practice, but the objective is that
    in this way you can better replace a layer laer (for example the program''s view)
    without affect the other layers. The dotted lines illustrates that the model can
    send notifications to the other layers. Listeners are typically the program''s
    view, but it can also be the controller.


    The idea is the following:


    +   - When there are an occurrence of an event in the application''s view, because
    the user is doing something, the view will delegate the treatment to the controller
    (call a method on the controller), which then decides what to do.

    - The view can always read the model''s state using the methods defined by an
    interface that the model implements.

    - The controller knows the view so it can be notified to update the interface.

    - The controller also knows the model so that the controller can update the model.

    - The model knows neither the controller nor the view, but it implements the observer
    pattern such the view (and possibly the controller) may be registered as observers
    and receive notifications when the model''s state is changed.


