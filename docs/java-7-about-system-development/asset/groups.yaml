    ## STATE MACHINES


    A state diagram or a state machine is a diagram that models an object, which may
    be in different states, and where the object can change state due to various events
    that may occur. A classic example is a process for a running program. When you
    start a program, the operating system will create a process that represents the
    running application, and the process starts its life in a new state. After this
    the process'' life can be modeled in a diagram, as shown below, where the ellipses
    represent states and the arrows represent transitions.


    ![](img/5a18da81f445a74ebda77e0208d33638_111_0.png)


    # JAVA 7: ABOUT SYSTEM DEVELOPMENT


    When a process is in the state new it can switch to one of two other states: ready,
    which means the process is ready to run on the CPU (when it has time) or ready-suspended,
    which means the process is ready but not yet performed (for example it is started
    as a service or batch job that should run at a later time). If a process is ready
    suspended it can switch to ready mode (when the operating system sees the time
    for it to be ready occurs). A process is ready (is in the ready queue), can again
    be ready suspended, but it can also switch to running, which means that the operating
    system selects (dispatches) for the CPU. A running process can switch state by
    four events. Firstly, there may be a timeout if it has used CPU in the permitted
    period. The process then becomes ready again. It can also be ready suspended (if
    the process instance executes a sleep()) or can switch to blocked, which means
    it is waiting for a resource (typically an IO operation such as a block on the
    disk). Finally, it may be that the process is completed (the program is finished),
    and the process will then change to a terminated state where all allocated resources
    are removed before it is removed. When a blocked process waiting for a resource
    is ready to proceed (for example the disk controller signals that disk operation
    is performed), then the process goes back to ready. A blocked process can also
    switch to blocked suspended (for example of a swap), and from here it can either
    switch back to blocked or ready suspended.


    A state machine is particularly suited to modeling the life cycle of objects in
    the same way as above that periodically changes states, and there are actually
    many of that kinds of situations in practice. Therefore, it is a useful diagram,
    and the diagram is typically drawn as shown above, but there are extensions. For
    you example for a state specific actions to be performed when the object switches
    to that state, or when the object changes from the state, and you can even specify
    actions to perform if the state is due to a specific event:


    | State |

    | On entry: action1 |

    | On event: action2 |

    | On exit: action3 |


    Of an object can change state from a certain state to the same state:


    ![](img/5a18da81f445a74ebda77e0208d33638_112_0.png)

