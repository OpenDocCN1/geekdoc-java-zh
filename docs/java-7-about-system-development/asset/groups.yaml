    - 删除书籍

    - 借阅书籍

    - 还书


    这种情况在多处地方也适用。问题在于于，用例的数量很容易变得非常庞大，导致相应的图表变得混乱。如果你必须做到绝对准确，通常需要绘制更多的用例图。有时一个用例会包含另一个用例，我们可以像展示的那样将其图中图中：


