    `Comparable<HighScore>` 接口，而当类没有实现 `compareTo()` 方法时，它必须是抽象的。你应该注意在类图中如何显示接口，以及虚线箭头如何表示一个类实现了该接口。还要注意箭头被显示为一个空三角形，这通常意味着继承。


