    # 4 MVC


    Above at the design I have talked about Model View Controller as a pattern for
    the architecture of a GUI program. It is a three-layer architecture, and in the
    following I will briefly elaborate the architecture, as I will use it in the following
    example.


    Model View Controller – short MVC – is one of the most talked about design patterns
    as a pattern that recommends how to design a program with a graphical user interface.
    MVC is a very interesting pattern, because the pattern is concerned with a frequently
    occurring problem, and it is a pattern that is available in several forms, in
    particular different types of applications require variations of the pattern,
    but also because the development tools often introduce their own variations.


    There are three elements in MVC:


    +   1. Model representing the program''s data and thus the program''s state, and
    it is also the model, which implements the essential parts of the program logic.
    What the model do is hidden from both the controller and view, but the model defines
    (often via an interface) methods such that the controller and the view can read
    and modify the model''s state, and the model can send notifications to observers
    concerning changes in the state. Typically, the view layer may be observer, but
    also the controller layer may be observer for the model.

    2. View representing the model and displays the model''s state by means of components
    in a graphical user interface. The program will use many different components
    (for example panels, buttons, input fields, etc.), and it''s the view layer''s
    responsibility to ensure that these components reflect the model''s state.

    3. The controller processes the user''s input and determine what impact it should
    have for either program or view.


    In my use of MVC the main program will typically create the view object, which
    then has the responsibility to establish the controller and the model and send
    the model as a reference to the controller (possibly also a reference to the view
    itself). The result is that the controller knows the model (and possibly also
    the view, when appropriate, typically through an interface), while the view knows
    both the controller and the model. To get loose couplings between the elements
    both the view, controller and model are often defined by an interface and MVC
    can be outlined shown below.'
