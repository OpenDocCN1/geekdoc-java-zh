    ## JAVA 7: ABOUT SYSTEM DEVELOPMENT


    Now it is not as bad as suggested above, and luckily as it such, the vast majority
    of IT projects are carried out to the satisfaction of both users and developers,
    and here it is important to remember, that it is the projects that derail, you
    hear about. Fortunately, there are and will be developed many excellent programs,
    effective system development requires techniques and methods. It is important
    to work systematically to get everything to work. It is what the following book
