    # JAVA 7: ABOUT SYSTEM DEVELOPMENT


    ## THE WATERFALL MODEL


    The result of the test phase will typically be a todo-list, which lists the errors
    and discrepancies found. With this list available, the programmers may correct
    the errors and omissions, and then the program must be tested again to ensure
    that the corrections have not introduced new errors. This process continues until
    the test results in an empty todo-list, and then the program is ready for use.


    The test phase is a follow-up to the tests as during the programming, and for
    the phase to make sense, it is crucial that the testing effort during programming
    is done carefully and accurately. It is important that the program be transferred
    to the testing phase is of such a quality that it is worth testing. Actually,
    it is not unusual for a program to leave the programming phase with too many errors,
    and the result is that the test work has to be stopped immediately, and the program
    is returned to the programming team called unusable. If this happens, you have
    only succeeded in having the people who need to test the program have used their
    time to no avail, and the programmers cannot do much other than to address the
    errors without knowing much about what to look for. So there is reason to once
    again emphasize the importance of the test, which takes place as part of the program
    development.


    ![](img/5a18da81f445a74ebda77e0208d33638_29_0.png)


    ## 2.6 DELIVERY


    The final phase will really take the program in use and hand it over to future
    users. It is difficult to precisely mention the content of this phase, so instead
    I will give some examples of tasks that the phase may include:


    - Development of an install program or script.

    - Upload a program to an App Store.

    - Hosting a program or service on a web server.

    - Create a database that the program can connect to.

    - Create users, possibly with varying rights.

    - Customizing the configuration files to applicable safety policies.

    - Conversion of existing data to a new format.

    - Training of future users.

    - Evaluation of the project in order to gain experience.


    There may be mentioned more tasks, but the above should suffice to suggest that
    much can be done after the program is written and tested.


    ## 3 A SYSTEM DEVELOPMENT METHOD


    In this book, I have mentioned the so-called waterfall model, which is a method
    to system development, and I will in chapter 5 with an example show how the method
    can be used to develop a small program. I have described the waterfall model as
    a system development method consisting of 6 phases, and there are other descriptions
    of the method, some of which are simpler and more extensive, but common to them
    that they describe the system development as a course:


    analysis – design – programming – test


    These are four key activities in any system development method, but in many contexts,
    particularly in the development of larger IT solutions, it is a simplistic view
    on system development. First, experience shows that it is unrealistic from the
    start to establish the final requirements specification and then develop a design
    for the program. It is necessary to work iteratively and develop a part of the
    program that can be tested by the future users before proceeding with other parts
    towards the finished program. This means that you work with analysis, design,
    programming and test as to return and continue with additional analysis activities
    and so on. Second, the system often – at least for larger solutions – includes
    many other activities and so on. Finally, the programs to be developed are so
    different that a method like the waterfall model is too limited to accommodate
    the development of all kinds of programs. Thus, it is too simple to carry out
    a system development using a number of phases carried out in a particular order.
    There is a need for more flexible methods that can be adapted to the given task
    and situation – something that I will look at later in the other books.


    The waterfall model, however, has its uses and benefits, and here I would mention:


    - The model is simple – there is not much to learn.

    - The method describes and applies the basic activities in the system development.

    - The method is better than nothing.


    ## JAVA 7: ABOUT SYSTEM DEVELOPMENT


    The conclusion is that the waterfall model is very applicable for the development
    of small programs that have many uncertainties and the model is used in the next
    books, but with the important addition that it is adapted by my way to the development
    of a program.


    As mentioned, I will later look at other system development methods, and I also
    mentioned that these methods'' practical success is somewhat variable and ranges
