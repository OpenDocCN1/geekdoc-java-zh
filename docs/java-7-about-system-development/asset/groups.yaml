    # INTRODUCTION


    System development is the name of the process to develop a program from start
    to finish, and thus from the idea or task is presented, to the program is written,
    tested and put into operation by the future users. In practice, a system development
    is implemented as a project that is characterized by a longer period, and the
    task is typically solved by a project group that do all the work. Both the schedule
    and the size of the project group is obviously determined by the task''s scope
    so the time horizon can be from a few days to several years in extreme cases,
    while the project can be anything from a single person to many, but to talk about
    a system development project, it will often be a project that will be performed
    over several weeks and perhaps even months, and which involves several people.


    Large system development projects is characterized by many uncertainties which
    also means that one often hears about IT solutions, which do not end up with the
    desired result or maybe even running completely wrong. There are several reasons,
    but in my opinion are the two essential:


    +   - That is difficult (probably impossible) from the start to define all the
    requirements, as you continuously during the development process gain greater
    insight and understanding of the task to be solved, and along with it there are
    creating new wishes and requirements for the finished system. It is thus impossible
    from start to estimate the resources that the project requires.

    - You will not recognize the cost, and the development organization, to get the
    job, deliberately underestimates. The result is that the resources used by that
    task is not present, which in turn means that the finished product will be of
    poor quality and, at worst, useless.


    You hear sometimes argued that IT solutions are so complex that it is impossible
    to develop programs that do not contain errors. However, it is not an acceptable
    explanation. It is true that IT systems are complex, but IT systems are not the
    only complex thing that are developed in this world, and the demand for finished
    software solutions must be, that they meet the customer''s requirements and works
    without error.'
