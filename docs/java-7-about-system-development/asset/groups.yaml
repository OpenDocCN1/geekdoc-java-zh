    In general, there will be a controller class for each dialog box. Although controller
    classes in principle are simple, they will contain some code as they need to validate
    the user input. It typical controller classes sends data to the model, if they
    can validate the data correctly.


    It is also the controller layer that sends mail to users when an administrator
    has to recall books. Java has the necessary classes to send mails.


