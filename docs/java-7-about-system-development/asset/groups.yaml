    # JAVA 7: ABOUT SYSTEM DEVELOPMENT


    # 5.3.3 ARCHITECTURE


    The program is written starting from MVC, and uses basically a 4-tier architecture:


    ![](img/5a18da81f445a74ebda77e0208d33638_54_0.png)


    The main() method creates MainView, which then directly or indirectly instantiates
    other program objects. A window creates essentially a controller, but for very
    simple windows where there is no particular data processing the windows directly
    methods in the model layer. A controller must perform an essential task to be
    included. As a start, I have created a NetBeans project called Library, which
    preliminary are define the following packages


    ![](img/5a18da81f445a74ebda77e0208d33638_54_1.png)


    The model layer (see below), defines an object oriented abstraction over the database.
    The database operations are not implemented in the model layer, but are implemented
    in a layer under the model layer (Data Access Layer), which only the model layer
    knows. The aim is to keep everything regarding the database hidden from the rest
    of the program and to create an overview, and in order to facilitate maintenance.
    The disadvantage is that as the model layer must include very thin classes that
    act as adapters for the dal classes.'
