    ## JAVA 7：关于系统开发


    现在情况并不像上面暗示的那样糟糕，幸运的是，绝大多数 IT 项目的执行都让用户和开发者感到满意。这里重要的一点是，你听到的通常是那些出轨的项目。幸运的是，已经且未来还会开发出许多优秀的程序，但有效的系统开发需要特定的技术和方法。系统化地工作以确保一切运行正常至关重要。这正本书所的主题。


    除了程序必须运行正确外，它们还必须是可以维护的——至少对于那些需要大量资源开发的大型程序，而且程序通常需要使用多年。在这些期间，随着新需求的出现，程序往往需要进行修改，或者你可能希望它以不同的方式运行。为了实现这一点，重要的是程序从开始编写时就采用某种方式，以便后期——可能不是由最初开发程序的人员——能够对其进行修改和扩展，而不会导致程序的大部分内容必须重写。这取决于应用程序的实现方式及其质量。因此，程序质量在系统开发中起着重要作用，不仅是为了未来的维护考虑量，还因为程序必须是有效的；如果一个程序运行缓慢，通常与程序的实现方式有关。最后可以提到，程序应该是健壮的，这样它们就不会因为使用不当而失败，而健壮性也是程序质量的一部分。


    所有这些都强调了任何程序的开发——无论多小——使用经过验证的技术和方法进行系统化工作至关重要。利用和借鉴他人的经验也同样重要。结论是，系统开发远不止是巧妙的想法和编程。


    本书是系统开发的介绍，但与之前的书籍不同，这里没有练习题。书中描述了一些程序开发准则，并以一个按照这些原则开发的程序示例作为结束。


    ## 瀑布模型


    随着时间的推移，我们开发出了多种系统开发方法，它们的目标都是提供关于如何在实践中从头到尾开发一个程序的指南。这些方法对系统开发的实际重要性各不相同，可能是因为很难开发出一种足够通用、以容纳许多待开发系统的方法，也可能是因为这些方法往往是静态的，并且很容易变成为了方法而存在的方法。因此，在实践中，典型的做法是使用几种方法的元素，以便为你目前从事的任务提供一些指南；但对于关于系统开发方法的所有言论和记录的内容，情况并不适用于此。它只是说明找到正确的方法并不容易，而且几乎无法做到；但有许多值得遵循的良好原则，这正是本书要讨论的内容。


    然而，所有系统开发方法都重复包含一些要素：


    - **分析**：检查并确定要解决的任务是什么，从而为完成的程序制定需求。

    - **设计**：决定应该如何解决该任务。

    - **编程**：编写产品本身。

    - **测试**：在完成的程序运行时对其进行检查。


    即使是对于小型程序的开发，你也必须经历这些活动，其内容显然取决于任务的大小。到目前为止，我将使用一种由六个阶段或步骤组成的方法：


    1.  1. 任务制定

    2.  分析

    3.  设计

    4.  编程

    5.  测试

    6.  交付


    ## JAVA 7：关于系统开发


    这是一种非常简单的方法，对于较大的项目，该方法不够全面或合适；对于较小的程序，它的效果非常好，正如前面提到的，所有六项活动都是所有系统开发方法的一部分。在文献中，这种方法被称为瀑布模型，因为其思想是先定义需求（分析），然后勾勒解决方案（设计），之后对解决方案进行编程。最后，在准备好使用程序之前，对完成的程序进行测试（并在必要时修正错误）。结合今天复杂的
    IT 解决方案的开发，这是一种系统开发的狭隘视角，但这一点我们稍后讨论。


    在书的其余部分，我将描述该方法的活动以及你在六项活动中的每项中应该做什么。我不会描述如图表之类的特定工具，实际上我在实践中也只在有限的范围内涉及这些。然而，此类开发工具也有其存在的价值，在书的附录
    A 中，我给出了一些的描述。


    ### 2.1 任务制定


    在编写计算机程序时，你必须开始描述任务是什么，以及编写程序的目的是什么。有一个个人、公司或组织（下文称为客户），他们对想要开发的程序有一个想法。这可以是任何内容，从几个零散的想法、会议的结果，到可能是调查的结果，但在任务交付给开发团队之前，必须提交任务。它可以是口头的，也可以是文档或报告形式，但无论如何，第一要务是写一份简短简洁地描述任务的文档。任务制定可以由客户或开发部门准备，但通常是在较短的时间内协作完成的。


    对于过程或形式没有特殊要求。对于大任务，工作可以是详尽的且耗时的，因为必须有多次会议、收集信息等，我们经常谈论初步分析。结果可以是一份报告，用一般性术语描述任务，以及如何建立成功标准。对于较小的任务，可能一次会议就足够了，任务制定可能不超过一张纸。无论如何，任务制定的结果都是迈目标的第一步。


    ## JAVA 7：关于系统开发


    ## 瀑布模型


    通常情况下，任务制定不应太详尽，而只需对要解决的任务给出简要描述。详细的需求是在分析阶段首次确定的。其形式是文档，但描述可以附带材料。首先，在编写任务描述时，你在这里可能会遇到与要制作程序相关的其他文档，从而获得系统开发所需的知识。在适当的情况下，这些文档也必须被存档。


    '
