    must often be modified as new demands occur, or there is something you want to
    work in a different way. For to be possible, it is important that the program
    from the start is written in a way so it later – probably by someone else than
    the persons who originally developed the program – be modified and expanded without
    the changes means, that large parts of the program has to be rewritten. Whether
    or not depends on how the application is made and its quality. Therefore play
    program quality a major role in system development, not only in the interests
    of future maintenance, but also because the programs must be effective, and if
    a program works slowly, it always has to do with how the program is a made, and
    finally may be mentioned that programs should be robust, so they do not fail because
    of improper use, and also the robustness is part of the program''s quality.


    All that should emphasize the development of any program – however small – it
    is important to work systematically using proven techniques and methods. It is
    important to use and exploit other people''s experience. The conclusion is that
    system development is much more than clever ideas and programming.


    This book is an introduction to system development, but unlike the previous books
    there are no exercises. The book describes some guidelines for the development
    of a program and ends with an example of the development of a program along these
    lines.


    ## THE WATERFALL MODEL


    Over time we have developed a variety of system development methods, all of which
    have had the object of providing guidelines on how, in practice, to develop a
    program from start to finish. The methods practical importance to system development
    has been variable, probably because it is difficult to develop a method that is
    general enough to accommodate the many systems to be developed, but a little because
    the methods have often been static and easily becomes methods for the methods
    own sake. Therefore, it is typical in practice, to use elements of several methods
    so as give some guidelines to suit the tasks you now work on, but for, everything
    that is said and written concerning system development methods, will not be. It
    says only that it is not so easy to find the right method, and that is it hardly;
    but there are a number of good principles that are worth following, and that is
    what this book talks about.


    However, there are some assets that are repeated in all system development methods:


    - Analysis, which examines and determines what it is for a task to be solved,
    and thus formulate the requirements for the finished program.

    - Design, where you decides the task should be solved.

    - Programming, where the product itself is written.

    - Test, which examines the finished program as it works.


    Even for the development of small programs you must go through these activities,
    the content clearly varies depending on the size of the task. So far, I will therefore
    use a method, which consists of six stages or phases:


    1. 1. Task formulation

    2. Analysis

    3. Design

    4. Programming

    5. Test

    6. Delivery


    ## JAVA 7: ABOUT SYSTEM DEVELOPMENT


    It is a very simple method, and for larger projects, the method is not comprehensive
    enough or appropriate, for smaller programs it works very well, as mentioned,
    all the six activities are parts of all system development methods. In the literature,
    the method is known as the waterfall method, since the idea is to start to define
    the requirements (analysis), then outlines a solution (design), after which the
    solution is programmed. Finally the finished program is tested (and errors are
    corrected if necessary) before you are ready to take the program in use. In connection
    with the development of today''s complex IT solutions, it is a narrow vision of
    system development, but on this later.


    In the rest of this book, I will describe the method''s activities and what you
    should do in each of the six activities. I will not describe specific tools such
    as diagrams and the like, and it''s actually something that I only to a limited
    extent in practice. However, such development tools also have their entitlements,
    and in the books Appendix A, I have given a description of some tools.


    ### 2.1 THE TASK FORMULATION


    When writing a computer program, you have to start to describe what the task is,
    and what it is for a program to write. There is a person, a company or an organization
    (in the folowing called the customer) that has an idea for a program that they
    want developed. It can be anything from a few scattered thoughts, the result of
    a meeting or perhaps the result of a survey, but before the job can be transferred
    to a development team, the task must be presented. It may be verbal or in a document
    or report, but in any case the first thing is to write a document that describe
    the task short and concisely. The task formulation can be prepared by the customer
    or the development department, but typically it will be done in collaboration
    over a shorter period.


    There are no particular requirements for neither the process or form. For big
    jobs, the work can be comprehensive and take time as there must be several meetings,
    collected information etc., and we often talk of a preliminary analysis. The result
    can be a report, where the task is described in general terms, and how important
    success criteria are established. For smaller tasks, it may suffice with a single
    meeting, and the task formulation is perhaps no more than a single sheet of paper.
    In any case, the result of the task formulation is the first step towards the
    goal.


    ## JAVA 7: ABOUT SYSTEM DEVELOPMENT


    ## THE WATERFALL MODEL


    In general, the task formulation should not be too detail, but it should only
    give a brief description of the task to be solved. The detailed requirements are
    established first during the analysis. The form is a document, but there may be
    attached material to the description. Firstly, when writing the description of
    the task you already here can encounter other documentation that demonstrates
    important issues relating the program to be made, and thus knowledge which is
    necessary for the system development. Where appropriate, this documentation must
    also be stored. For larger projects, it may also be, that you have to document
    the actual writing process, for example meeting notes and the like, such that
    on completion of the work you has a whole report for the task formulation. Finally,
    the task formulation and especially the process of its creation is used for estimating
    the task both in terms of time schedule and resources, and in practice will to
    the task formulation be attached both a time schedule and a estimate of costs
    to complete the task.


    The task formulation must therefore tell the developers what it is for a task
    that should be addressed and tell the customer when the task can be done, and
    what it cost.


    Seen from the developers, the result of the activity is a project directory with
    a subdirectory for the task formulation, which partly includes the document with
    the project description and all other documents gathered or prepared and concerning
    the task.


