    ## 瀑布模型


    测试阶段的结果通常是一个待办事项列表（todo-list），列出了发现的错误和差异。有了这个列表，程序员可以修正错误和遗漏，然后必须对程序进行再次测试，以确保修正没有引入新的错误。这个过程一直持续，直到测试结果得到空的待办事项列表，然后程序就可以投入使用了。


    测试阶段是编程期间测试的后续，为了使该阶段具有意义，在编程期间的测试工作必须仔细准确，这一点至关重要。传递到测试阶段的程序质量必须达到值得测试的水平，这一点很重要。实际上，程序在结束编程阶段时带有过多的错误并不罕见，结果是测试工作必须立即停止，程序返回给编程团队并被视为不可用。如果发生这种情况，你只是成功地让那些需要测试程序的人白费了时间，而程序员在并不知道该找什么的情况下，除了处理错误之外没什么也做不了。因此，有理由再次强调作为程序开发一部分的测试重要性。


    ![](img/5a18da81f445a74ebda77e0208d33638_29_0.png)


    ## 2.6 交付


    最终阶段将真正把程序投入使用并交给未来的用户。很难精确地提到这一阶段的内容，因此我将提供该阶段可能包含的一些任务示例：


    - 开发安装程序或脚本。

    - 将程序上传到应用商店（App Store）。

    - 在网络服务器上托管程序或服务。

    - 创建程序可以连接的数据库。

    - 创建用户，可能具有不同的权限。

    - 根据相应的安全策略对配置文件进行自定义。

    - 将现有数据转换为新格式。

    - 对未来的用户进行培训。

    - 评估项目以获得经验。


    可能还会提到更多任务，但上述内容足以说明在程序编写和测试之后还可以做很多工作。


    ## 3 一种系统开发方法


    在本书中，我提到了所谓的瀑布模型，这是一种系统开发方法，我将在第 5 章通过一个示例展示如何使用该方法开发一个小型程序。我将瀑布模型描述为一种由 6 个阶段组成的系统开发方法，关于该方法还有其他描述，其中一些更简单、更广泛，但它们的共同点是将系统开发描述为一条课程：


    分析 – 设计 – 编程 – 测试


    这些是任何系统开发方法中的四个关键活动，但在许多背景下，特别是在开发大型 IT 解决方案时，这只是系统开发的一种简化观点。首先，经验表明，从一开始就建立最终需求规范然后为程序开发设计是不现实的。必须进行迭代工作，在继续开发其他部分以完成程序之前，开发一个可以供未来用户测试的程序部分。这意味着你可以在分析、设计、编程和测试之间工作，以便返回并继续额外的分析活动等。其次，系统通常——至少对于较大的解决方案而言——还包含许多其他活动等。最后，要开发的程序是得如此不同，以至于像瀑布模型这样的方法过于局限，无法适应各种类型程序的开发。因此，使用按照特定顺序执行的若干阶段来进行系统开发就太简单了。需要更灵活的方法来能够适应给定的任务和情况——这是我将在以后其他书中探讨的内容。


    然而，瀑布模型也有它自己的用途和优点，在这里我提一下：


    - 模型很简单——没有太多需要学习的。

    - 该方法描述并应用了系统开发中的基本活动。

    - 该方法比没有要好。


    ## JAVA 7: 关于系统开发


    结论是，瀑布模型非常适用于具有许多不确定性的小型程序的开发，该模型将在接下来的书中中使用，但有一个重要的补充，即它通过我的方法适配到程序开发中。


    正如前面提到的，我稍后将查看其他系统开发方法，我也提到过这些方法的实际成功程度具有某种变数，范围从不使用方法开发程序，到基于经验和当前任务开发部门自己的系统开发方法（这些方法受到特定理论方法的启示）。尽管系统理论和方法多年来已作为
    IT 教育的一部分而建立，但这些方法在实践中并不总是被应用，在我看来是出于两个原因：


    - 这些方法被认为是资源的浪费。

    - 这些方法需要过多的文档。


    ![](img/5a18da81f445a74ebda77e0208d33638_32_0.png)


    ## JAVA 7: 关于系统开发 一种系统开发方法


    这些就是导致实践中不使用替代程序的原因吗？它们都是错误的，但人们应该寻求限制文档的系统方法（可靠性）。


    上述内容并不是真正的系统开发方法，而是你可以遵循以开发程序的某些指南。它不是一种系统开发方法，因为没有关于做什么的精确指南，但与应用开发相比，其目标是它可以变成那样的东西。本书的内容通过以下示例，从而制定了应用开发的最佳实践。结果是，我将系统开发项目视为一个由六个活动组成的过程：


    ![](img/5a18da81f445a74ebda77e0208d33638_33_0.png)


    ## 4 MVC


    在上面的设计中，我提到过模型视图控制器（Model View Controller）作为 GUI 程序架构的模式。它是一个三层架构，下面我简要阐述该架构，因为我将在后面的示例中使用它。


    Model View Controller – 简称 MVC – 是最受讨论的设计模式之一，作为推荐如何设计具有用户界面程序的模式。MVC 是一个非常有趣的模式，因为该模式关注一个经常出现的问题，而且这种模式以多种形式存在，特别是不同类型的应用程序需要该模式的变体，而且因为开发工具通常也会引入自己的变体。


    MVC 中有三个元素：


    - 1. 模型（Model）代表程序的数据以及程序的状态，它也是实现程序逻辑核心部分的模型。模型所做的对控制器和视图都是隐藏的，但模型定义了（通常通过接口）方法，使得控制器和视图可以读取和修改模型的状态，并且模型可以就状态更改向观察者发送通知。通常，视图层可以是观察者，但控制器层也可以是模型的观察者。

    - 2. 视图（View）代表模型，并通过图形用户界面中的组件显示模型的状态。程序将使用许多不同的组件（例如面板、按钮、输入字段等），而视图层有责任确保这些组件反映模型的状态。

    - 3. 控制器（Controller）处理用户输入，并确定这些输入对程序或视图应该产生什么影响。


    在我对 MVC 的使用中，主程序通常会创建视图对象，然后由该对象负责建立控制器和模型，并将模型作为引用发送给控制器（可能还把视图自身的引用也发送给它）。结果是，控制器知道模型（在适当的情况下也可能知道视图，通常通过接口），而视图既知道控制器也知道模型。为了在元素之间实现松耦合，视图、控制器和模型通常由接口定义，MVC
    的概括如下所示。


