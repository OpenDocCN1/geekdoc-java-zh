    ## JAVA 7: ABOUT SYSTEM DEVELOPMENT


    ## 2.3.7 DESIGN PRINCIPLES


    The design includes a program''s architecture and classes, and there are established
    many principles of what in this context is a good design, and I will mention two,
    which are usually called coupling and cohesion, addressing both the program''s
    architecture and classes.


    One must strive that the program''s classes have low couplings. Two classes are
    coupled if they use the properties of each other. That is, if one of the classes
    calls a method on the other class, say that the classes are coupled – the class
    that calls a method is coupled to the other class, that it knows the other class.
    In particular, be aware that if a class creates an object of another class, there
    is a coupling through the constructor. When couplings are bad, it is because it
    makes more difficult to maintain the code. If a class has a method that others
    use, you cannot just change it, without matters the other classes.


    Now it is not that you can avoid couplings. A program obviously cannot consist
    of isolated classes that have nothing to do with each other. The idea of a class
    is precisely that the class offers services others need, but you want as low couplings
    as possible. It is difficult to say what it is, but you can be aware of the following:


    - Couplings must always be done via properties (get and set-methods) or other
    methods, but never via variables. This is achieved by making a class''s variables
    private, and so it is up to the class programmer to define the properties and
    methods that are necessary for the class to make its services available.

    - All properties and methods that represent internal services and that services
    should not be used by other classes, must be defined private – and exceptionally
    protected.

    - You should program to an interface. Classes characteristics (services) should
    be defined by interfaces that the classes can implement. An object that uses a
    class, has only the knowledge of what are defined in the interface, but not how
    properties are implemented.

    - You must avoid couplings both ways. That is, where a class using a service of
    a second class and the second class uses a service of the first class. Where applicable,
    it means that both must know each other, resulting in a very strong dependency
    between application''s classes.

    - One should be aware that inheritance is a strong coupling. If the base class
    has protected properties they cannot be changed without influencing the derived
    classes. This does not mean that you should avoid inheritance, but simply to be
    aware of what it means for coupling.


    ## JAVA 7: ABOUT SYSTEM DEVELOPMENT


    ## THE WATERFALL MODEL


    Just as one wishes a program has weak couplings, one would like the program''s
    classes and modules have high cohesion. A class has high cohesion if it concerns
    a specific thing within the program''s problem area. A class should not be a collection
    of methods that have nothing to do with each other. Sometimes one may think of
    it in that way, that a class representing customers and products has low cohesion.
    It has overall characteristics of the two things, and so it must be divided into
    two classes (or modules) that are hard to understand, and in turn means that it
    becomes more difficult to maintain the code. You can note the following:


    - High cohesion leads to many classes, but it is generally not a problem.

    - If a class implements many interfaces, points in the direction of low cohesion.

    - If a class is composed exclusively of static methods, it must be methods that
    relate to the same subject.

    - A package must include classes that relate to the same subject. Otherwise the
    classes must be divided into multiple packages.


    Both coupling and cohesion are general design principles that you must constantly
    keep in mind when designing an application''s architecture and classes. Cohesion
    is rarely a major problem, but you should focus on couplings and constantly strive
    for weak couplings as possible.


