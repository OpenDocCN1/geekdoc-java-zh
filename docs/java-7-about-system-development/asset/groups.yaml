    We see that a relational model is on first normal form if it consists of relations
    which has no multivalued attributes, and if all relations have a primary key.
    If you have completed the above mapping, it will automatically be satisfied, and
    the above model is on first normal form. You can also think of it in that way,
    that you can create a database from a relational model that is on first normal
    form.


    A relational model is on second normal form if it is on first normal form and
    if for any relation applies that it does not contain attributes, which is determined
    by a part of a composite primary key. The fact that a relation is not on second
    normal form that it contains information on more concepts, and therefore should
    be divided into two relations where the attributes are determined by a part of
    the primary key, are moved into a new relation together with the controlling part
    of the primary key, and it is a primary key in the new relation. In the original,
    the controlling part of the primary key is a foreign key to the new relation.
    If a relationship does not have a composite primary key, it is per definition
