    ## JAVA 7: ABOUT SYSTEM DEVELOPMENT


    ### 2.3.2 CLASSES


    Modern programs are built from classes. A running program consists of objects
    that work together to perform the task which the program must solve. These objects
    are defined in terms of state and behavior, and you do that with classes, where
    a class defines or describes a particular kind of object. Perhaps the most important
    design activity is to find and define these classes, so they have the right properties.
    An object can be as an element of a program, a component that you can do with
    anything, and what you mainly doing during programming is to use the classes used
    to create the program''s objects. A true and fortunate choice of classes has great
    influence on the quality of the finished program.


    A program consists of many classes, and the classes that you primarily work at
    design time, the model classes, which are classes defines the essential data that
    the program should work with. This means that many classes first are defined later
    in the programming phase.


    A different question is how to find the classes that the program should consist
    of, and there are several guidelines on what what you can do, but no matter what,
    there are no instructions that necessarily give a good result. The classes have
    to model the application''s problem area — and that one — must reflect what the
    program should consist of and work on, but it is important to remember that you
    are talking about model classes and classes describing data. Design of classes
    is based largely on experience, and although through books system development
    there are many recommendations for selecting classes the best way is to study
    other people''s examples as the examples in these books and thus get inspiration
    from finished programs and the classes which they composed.


    I will mention a single recommendation that you sometimes can see used to determine
    an application''s classes. Based on the task formulation and the requirements
    specification you can highlight all nouns, and then make a list of these nouns.
    They are candidates for classes. Subsequently, you review the list and use it
    as inspiration for the classes that the program should consist of. Not all nouns
    represent a class. First, several nouns can describe the same concept, and secondly,
    some of the nouns instead describe the properties (variables) of the program''s
    classes, and finally there will be names that do not relate to the program''s
    problem area and therefore are not candidates for classes. It''s a simple process,
    and it obviously cannot stand alone and requires many considerations for the candidates
    that have been found, but until you become practiced, the method is better than
    nothing.


