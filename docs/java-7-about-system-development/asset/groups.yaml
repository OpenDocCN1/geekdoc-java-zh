    # JAVA 7：关于系统开发


    # 前言


    # 前言


    本书是软件开发系列书籍中的第七本。编程语言是 Java，该语言及其语法和语义显然占据了大量内容，但这些书籍也很大程度上关注过程以及如何开发良好且健壮的应用程序。本书主要关注系统开发和方法，而编程只占次要位置，且书中没有在
    Java 方面介绍任何新内容。本书没有直接关注特定的系统开发方法，而是探讨了一些通用原则，这些原则可以应用于所有系统开发项目，并作为实践中开发应用程序的有用指南。其目标是建立一个框架，至少对于小型程序的开发，该框架对开发进度和最终成品的质量都有帮助。除了系统开发原则外，书中还包含一个附录，提供了
    UML 的简要介绍，另一个附录简要处理了数据库设计。本书假设读者具备编程和 Java 知识，并有使用数据库开发应用程序的能力（对应本系列前几本书的内容）。


    如标题所示，系列书籍涉及软件开发，目标是教读者如何用 Java 开发应用程序。可以通过阅读相关主题和学习完整程序来掌握，但最重要的是亲自动手并从零开始编写自己的程序。因此，书籍的一个重要部分是练习和亲自动手并从零开始编写自己的程序。（此处由于原文大量重复，已按要求去重处理）。


