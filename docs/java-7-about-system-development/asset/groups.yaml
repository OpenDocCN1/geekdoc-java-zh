    ## SEQUENCE DIAGRAM


    A sequence diagram is an interaction diagram, which shows how the objects interact
    with each other. The diagram shows several objects drawn horizontally next to
    each other, and for each object we are drawing a line, showing the object''s lifeline.
    Sequence diagrams are suitable to show how the objects are sending messages to
