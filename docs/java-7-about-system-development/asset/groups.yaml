    # JAVA 7: ABOUT SYSTEM DEVELOPMENT


    If we again consider the first version of the class model, you can see that there
    are get and set methods for Publisher, Category and Author, and thus as if the
    class is missing some variables. It is, however, not the case (not here at design
    time) as they correspond to the relationships between classes.


    If you consider the above class models, they will usually require additional documentation,
    where it as minimum is necessary to document the methods, and UML also has syntax
    on how to do that. I prefer, however, to document the methods with plain text
    that briefly explain the meaning of each method – and possible also variables.


    If there are multiple classes, there will be relationships between these classes
    and, in general it can be


    - 1. association

    - 2 aggregation

    - 3 composition

    - 4 inheritance


    These relationships are illustrated by a class diagram, and below shows a class
    diagram for the model layer in the library program. Let me immediately say that
    the diagram is not drawn correctly, since the types of relationships are chosen
    to show the syntax. If you look at the classes User and Book, there is shown a
    relationship between the classes. It was drawn as an arrow from User to Book,
    and lists a multiplicity indicating that a User may be related to more Book objects.
    It is an example of an association which indicate a loose relationship, such that
    it does not necessarily exist in all the program''s lifetime. In this case, indicate
    the relationship, that a User has borrowed a book, and when the user at time having
    the book back the relationship disappears. Therefore, it is shown as an association.
    That the multiplicity is shown as * means that a user can borrow more books. This
    means that the relationship must be implemented as a list of objects of the type
    Book in the class User.


    # JAVA 7: ABOUT SYSTEM DEVELOPMENT


    ![](img/5a18da81f445a74ebda77e0208d33638_100_0.png)


    There is also a relationship between the class Book and the class Publisher, because
    of the multiplicity that there is associated exactly one Publisher to a Book object.
    The relationship is implemented as an instance variable of type Publisher in the
    class Book. The relationship is shown as an Aggregation, meaning a fixed connection
    between the two objects. A book does not change publisher, and one can perceive
    an aggregation in the way that it refers to something that the book consist of.
    The aggregated object can, however, have its own life and can exist even if the
    aggregation disappears and the object can be aggregated to multiple Book objects.
    An aggregation reflects a stronger relationship than an association.


    Similarly, the class Category is aggregated with the Book, but this may indicate
    with the multiplicity that a book does not necessarily have a category, but if
    it has, the category does not change.


    The diagram also shows a relationship between Book and Author, and when the multiplicity
    is *, it must be implemented as a list with Author objects in the class Book.
    The relationship is also designed as an aggregation, but it is a stronger aggregation,
    which is called a composition. The difference is that the authors are again seen
    as part of the book, with a stronger connection, that if a Book object is deleted
    then the Author objects that are part of it must be deleted. That is, the author
    objects cannot have their own lives, which is not correct. An author in principle
    have written several books and thus be associated with multiple Book objects.
    When I above have the relationship as a composition, it is only to show the syntax.


