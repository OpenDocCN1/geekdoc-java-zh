    What remains is to implement the search function. The function displays a window
    as shown below, where you can enter/select the search criteria. When you click
    Search, the books that match are displayed in the table to the right, and if you
    double-click on a line in the table either DetailView or the BookView depending
    on which user you are.


    In principle, it is simple to implement the function, and the only complex is
    writing the SQL expression to be applied to a concrete search. This is based on
    search criteria in the class BookData and the criteria are prepared in class Books.
    The dialog is implemented by means of classes: SearchView (in library.views) and
    SearchTable (in library.views table). To test the function, you cannot do other
    than to perform multiple searches. It is difficult to test the function adequately
    in this place, because the data may be too small.


    ![](img/5a18da81f445a74ebda77e0208d33638_81_0.png)


    # JAVA 7: ABOUT SYSTEM DEVELOPMENT


    Finally, there is added another feature to the menu Administrator for maintenance
    of the super user.


    Parameters for both the database and the mail server is hard coded, what obviously
    does not hold. These values should be moved to a configuration file. It''s called
    library.config and is preliminary in my home directory and have the following
    form:


    ```

    dbhost:***

    dbport:***

    dbata:***

    dbuser:***

    dbcode:***

    mlhost:***

    mlport:***

    mluser:***

    mlcode:***

    ```


    *** should be replaced of current values. The meaning is as follows:


    - dbhost is the name of the database server

    - dbport is the port, that the database server use

    - dbata is the name of database

    - dbuser is the name of the database user

    - dbcode is the password for the database server

    - mlhost is the name of the mail server (smtp server)

    - mlport is the port, that the mail server use

    - mluser is the mail server''s email address

    - mlcode is the password for the database server


    The project has been expanded with a class Servers in the package library.util.
    The class is programmed as a singleton, the private constructor reads the above
    configuration file, and the class has methods that return a connection to each
    of the two servers. Next, the two classes Db and Mail are modified when the specific
    server information is given and so they use class Servers.


    When the configuration file not necessarily should be located in my home directory
    (for example in /etc/opt), added the following statement to main():


    ```

    if (args != null && args.length > 0) library.util.Servers.setPath(args[0]);

    ```


    This means that you by a parameter can specify where the configuration file can
    be found.


    # JAVA 7: ABOUT SYSTEM DEVELOPMENT


    Test of this change is simple:


    - 1. create a configuration file and place it in your home directory

    - 2. test if the program can run

    - 3. move the configuration file to another directory

    - 4. start the program from a terminal and specify the configuration file as a
    parameter

    - 5. test if the program still run

    - 6. test where appropriate to send a mail for a recall


    # 5.4.5 A LAST ITERATION


    Now, the program is finished in principle. Although there still is not talking
    about a large program, it consists nevertheless of 84 types in the form of interfaces
    and classes. No matter how careful you have been in the program development, there
    is a large chanche that some of the code is improper, there is code repetitions
    and something that could be written in a better way. It is therefore worthwhile
    to complete the development of a program with a code review, where you also should
    comment the code (to the extent it is not already done) and remove inconveniences
    (of course direct errors). It is a big work, not the world’s most interesting
    work, but the work is certainly well spent. Especially should you pay attention
    to variables or methods that are not used, and that kind should be removed.


    ![](img/5a18da81f445a74ebda77e0208d33638_83_0.png)


    # JAVA 7: ABOUT SYSTEM DEVELOPMENT


    With regard to the code repetition, they should be within reasonable limits removed
    because it may be important for the maine going forward, but you have balance
    the benefit and one should not remove code repetitions, if the price is that you
    up with a code, which no other can figure out. That code is robust and easy to
    understand is one of the most important quality parameters, and you must be very
    careful, that code optimization is not at the expense of safe and readable code.


    The code review starts, like the other iterations to create a copy of the project,
    and I created a copy named Library5.


    As a result of the code review, I have among other things, changed the class BookData.
    I have improved the class by optimizing the SQL SELECT statements, which JOIN
    more tables. The result is that a part of the work in this is moved to the database
    server that is inherently more efficient. Moreover, I have reviewed all classes
    for the user interface again, where I made typical cleanup and controlled that
    tests are correct.


    When developing a program as the user interface, there will be many classes and
    for example dialog boxes that are very similar. Here is natural to copy your code
    and then modify it. It is of course nothing wrong with that, but you should be
    aware it is one of the very major sources of errors.


    # 5.5 TEST


    The program has been tested as follows:


    - 1. all borrows are deleted (the function Recall)

    - 2. all books which makes no sense

    - 3. all authors that are not relevant

    - 4. all categories that are not relevant

    - 5. all publishers that are not relevant

    - 6. all users (but not the super user)

    - 7. all titles (but not Administrator)


    Then I closed the program and manually used MySQL Workbench to delete the super
    user and the Administrator and ensure that the title, user, and borrow are empty.


    # JAVA 7: ABOUT SYSTEM DEVELOPMENT


    The I have:


    - 1. started the program and created the super user

    - 2. logged in as super user

    - 3. created three users (with real adresses) that has different user roles (Admin,
    Staf, Student) and related appropriate titles.

    - 4. logged in as Staf

    - 5. created 20 (real) books that more books are created party for latter to be
    updated, and so that the function is performed in multiple sessions

    - 6. logged in as Staf and borrowed 5 books, where 2 books are the same books
    borrowed to the Student user (some books must have several copies)

    - 7. logged in as Admin and borrowed 5 books, where one book is the same book
    borrowed to the Student, and one book is the same book borrowed both to the Student
    and the Staf user.

    - 8. tested everything regarding borrowing look right

    - 9. performed recall of all the borrowed books


    When this test is performed properly back to test the program with many books
    and many users. This test can only be performed with the customer and in the right
    environment. This means that the customer must provide correct data, both books
    and users. This data may, for example, take the form of a CSV file, and you can
    then write a small program, which from this file can update the database. Then
    you can perform the above test again, so you are sure that the test is performed
    satisfactorily when the database has a large data volume.


    # 5.6 DELIVERY


    The last phase is to prepare the program for delivery. It takes an icon and the
    development of an installation script. The necessary files are assembled in a
    directory with the following content:

