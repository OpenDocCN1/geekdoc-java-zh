    我反复提到 UML 是可以用于系统开发的图表。虽然我不是 UML 的坚定支持者，但必须承认这些图表也有其用处。因此，本附录提供了主要规则和图表语法的概述。


    如上所述，这意味着在分析（主要是在设计阶段）必须构建一个程序的模型，例如该程序应该由哪些类组成。为此，你可以使用图表来展示程序的架构和关键组件，其优势在于你可以直观地处理程序的结构，在某些情况下，图表可以画出原本需要用许多文字来解释的模型，而该模型依赖于编程语言的许多细节。


    我之前建议过我并不怎么喜欢这些图表，因为它们很难画（需要很长时间），而且如果如果在开发过程中设计发生了变化，维护它们又非常耗时。另一个问题是图表必须具有价值，并且被所有人理解，且需要了解规则，而这些规则往往复杂且难以学习。第一个问题可以通过支持开发此类
    UML 图表的特定用例工具来解决，而第二个问题仅仅是学习图表语法的问题。


    UML 代表统一建模语言（Unified Modeling Language），是一种用于系统开发中软件建模的绘图。UML 定义了多种类型的图表，旨在分析和设计，下面我将简要描述这些最重要的图表，以及最基础的绘图规则。其理念是，你可以画出一个包含最重要算法在内的程序模型，正如我上面所说的，它确实有很好的用途。如果你正在参与一个开发软件解决方案的项目，那么
    UML 非常适合支持这种过程，即你们在黑板上共同使用 UML 图表进行建模。在这里，建模图表比最终解决方案的文档更重要。然而，人们不能低估其价值——特别是对于创建一个概述，至于非常详细的图表，我发现它们很少有价值，我觉得其价值与其产生它们所消耗的资源不成正比。


    简而言之，我认为图表作为系统开发过程的一部分以及作为提供大型复杂系统概述的文档是有用的。


