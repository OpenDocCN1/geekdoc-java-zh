    ## JAVA 7: ABOUT SYSTEM DEVELOPMENT


    ## THE WATERFALL MODEL


    or an architecture that is a variant thereof. Here you define the model as classes
    that models the program’s data, so you have an object-oriented representation
    of the data that the program should work with. The view layer contains everything
    regarding the user interface in the form of windows. In between these two layers
    you have a controller layer receiving input and converts it into commands for
    the model.


    There is nothing magical in this architecture, but experience has shown [it is]
    to be advantageous to gather everything regarding the user interface in a separate
    layer, and everything has to do with your program’s data in a model layer. Between
    these two layers are classes that will tie it all together. The architecture is
    often called the MVC for Model View Controller, and it is an example of a design
    pattern. It comes in several flavors, and the reason is partly due to the development
    tools and the types of applications as example GUI applications, web applications,
    apps for phones and more. The questions that a specific variant addresses is what
    each layer should contain and how the communication between the layers should
    be.


    The layers are a draw for a modular program architecture, but there may be multiple
    layers, and each layer can – and will be – divided into modules across.


    In the final example I will show how the pattern can be applied in practice.


