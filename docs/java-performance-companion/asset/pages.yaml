  md: '# 142 Chapter 4 ■ The Serviceability Agent


    All the found addresses bring up the byte array object at 0xe7a4ea38 in the Object
    Inspector, which means the object at 0xe7a4ea38 is the closest valid object just
    before these locations. If we look carefully, these locations actually go beyond
    the limits of the byte array object, which should have ended at 0xe7a4eaa48, and
    from address 0xe7a4ea48 the next object should have started. See the raw contents
