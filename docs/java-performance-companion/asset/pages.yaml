- pgno: 83
  md: '# # The Serviceability Agent


    Debugging and troubleshooting tools play an important role in the development
    of well-performing Java applications. There are many tools available to debug
    applications at the Java level, but very few are available for troubleshooting
    problems in Java applications at the JVM level. This chapter talks in detail about
    a powerful set of debugging tools called the Serviceability Agent (SA) that can
    help in debugging Java applications at the Java as well as the JVM level. The
    SA has the ability to debug live Java processes as well as core files, also called
    dump files.


    In this chapter, we will take a look at what the Serviceability Agent is, and
    where we get it, and what we can do with its set of tools.


    For building high-performance Java applications, it is a must that those applications
    be free from various problems that an application can encounter. Those problems
    could be application hangs, memory leaks, unexpected application behavior, and
    crashes. The Serviceability Agent''s set of tools can greatly help in troubleshooting
    and nailing those problems, resulting in stable, reliable, scalable, and efficient
    Java applications.


    The Serviceability Agent is very useful in debugging core files or dump files.
    As we all know, core or crash dump files contain the complete state of a program
    at a specific time such as the state of memory, processor registers, stack information,
    and other processor and operating system flag information. The Serviceability
    Agent has the capability to read the core files of the Java HotSpot Virtual Machine
    (HotSpot VM) and present the details from it in a human-readable format.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# What Is the Serviceability Agent?


    The HotSpot Serviceability Agent is a hidden treasure present in the JDK that
    few people know about. It is a set of Java APIs and tools that can be used to
    debug Java processes and core files (aka crash dumps on Windows). The SA can examine
    Java processes or core files, which makes it suitable for debugging Java programs
    as well as the HotSpot VM. It is a snapshot debugger that lets us look at the
    state of a frozen Java process or a core file. When the SA is attached to a Java
    process, it stops the process at that point so we can explore the Java heap, examine
    internal data structures of the HotSpot VM, and look at the loaded classes, compiled
    code of methods, and so on. The process resumes after the SA is detached from
    it.


    As mentioned before, the SA is a snapshot debugger, which means that it works
    with the snapshot of a process, unlike the usual debuggers that provide the facility
    to step through a running program.


    Note that the SA runs in a separate process from the target process and executes
    no code in the target process. However, the target process is halted while the
    SA observes it.


    # Why Do We Need the SA?


    Why use the SA when we have native debugging tools like dbx, gdb, WinDbg, and
    many others available on all the platforms?


    First, the SA is a Java-based platform-independent tool, so it can be used to
    debug Java processes/cores on all the platforms where Java is supported. Additionally,
    debugging a Java process or the Java HotSpot Virtual Machine with native debuggers
    is very limiting as they can help examine the native process state but not the
    Java or the JVM state of the process. For example, if we need to view the objects
    in the Java heap, native debuggers would show us the raw hex numbers, whereas
    the SA has the ability to interpret these hex numbers and present the object view.
    The SA has the knowledge about the Java heap, its boundaries, objects in the Java
    heap, loaded classes, thread objects, and internal data structures of the Java
    HotSpot Virtual Machine. Empowered with this knowledge, the SA makes it very easy
    for us to examine the Java/JVM-level details of the Java process or core.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# SA Components


    The SA consists mostly of Java classes, but it also contains a small amount of
    native code to read raw bits from the processes and the core files:


    +   - On Solaris, SA uses libproc to read bits from a process or a core file.

    - On Linux, SA uses a mix of /proc and ptrace (mostly the latter) to read bits
    from a process. For core files, SA parses Executable and Linkable Format (ELF)
    files directly.

    - On Windows, SA uses the Windows Debugger interface (dbgeng.dll library) to read
    the raw bits from the processes and core files.


    # SA Binaries in the JDK


    There are two binaries present in the JDK that make up the SA. These binaries
    are shipped with the JDK:


    +   - sa-jdi.jar

    - sawindbg.dll on Windows, libsaproc.so on Solaris/Linux


    SA components are built as part of the standard build of the HotSpot repository.
    The native code component of SA is placed in libsaproc.so or sawindbg.dll, and
    the Java classes are placed in sa-jdi.jar.


    The binary sa-jdi.jar provides the SA Java APIs and also includes useful debugging
    tools implemented using these APIs. It also includes an implementation of the
    Java Debug Interface (JDI), which allows JDI clients to read-only debugging on
    core files and hung processes.


    # JDK Versions with Complete SA Binaries


    SA binaries are shipped with the following JDK releases:


    +   - JDK 7, and later releases on all platforms

    - JDK 6u17+ on Solaris and Linux

    - JDK 6u31+ on Windows'
  merge: -1
