  md: '# 48 Chapter 3 Garbage First Garbage Collector Performance Tuning


    [Termination (ms): Min: 0.0, Avg: 0.0, Max: 0.0, Diff: 0.0, Sum: 0.1]


    If any (or all) worker threads are getting caught up somewhere, it will show up
    in long termination times and may indicate a work-stealing or load-balancing issue.


    # Parallel Activity Outside of GC


    Termination marks the end of parallel activities for worker threads during the
    evacuation/collection pause. The next line in the log snippet, tagged GC Worker
    Other, is time spent in the parallel phase but not in any of the “usual” parallel
    activities described so far. Though attributed to “GC time,” it could easily be
    occupied by something outside the GC that happens to occur during the parallel
    phase of the GC pause. GC threads are stopped during this period. We have seen
    GC Worker Other times high when there is an increase in compile work during JVM
    activities as a result of ill-considered collector options. If you observe long
    times, investigate non-GC activities.


    > [GC Worker Other (ms): Min: 0.0, Avg: 0.1, Max: 0.1, Diff: 0.1, Sum: 0.4]


    # Summarizing All Parallel Activities


    The last line of the parallel phase, tagged GC Worker Total, is the sum of the
    “usual” and “unusual” GC worker threads times:


    ```

    [GC Worker Total (ms): Min: 51.9, Avg: 52.1, Max: 52.1, Diff: 0.1,

    Sum: 416.0]

    ```


    # Start of All Serial Activities


    After the parallel phase is complete, the serial phase begins with the lines tagged
    Code Root Fixup, Code card, and Clear CT. During these times, the main GC thread
    updates code roots with the new location of evacuated objects and also purges
    the GC root set table. The Clear CT phase (which is carried out in parallel with
    the help of worker threads) clears the card table marks, as mentioned in Chapter
    2, when scanning RSets;1 GC marks a corresponding entry in the global table to
    avoid scanning that card. This mark is cleared during the Clear CT phase of the
    pause.'
