- pgno: 27
  md: 'If the initial and maximum heap sizes are far apart or if the heap size is
    very large, it is possible to have many regions more than 2000 regions. Similarly,
    a small heap size may end up with many fewer than 2000 regions.


    Each region has an associated set (a collection of the locations that, shortened
    to RSet). The total RSet size is limited but noticeable, the number of regions
    has a direct effect on HotSpot''s memory footprint. The total size of the RSets
    heavily depends on application behavior. At the low end, RSet overhead is around
    1 percent and at the high 20 percent of the heap size.


    A particular region is used for only one purpose at a time, but when the region
    is included in a collection, it will be completely evacuated and released as an
    available region.


    There are several types of regions in G1. Available regions are currently unused.
    Eden regions constitute the generation eden space, and survivor regions constitute
    the young survivor space. The set of all eden and survivor regions together is
    the young generation. The number of eden or survivor regions can change from one
    GC to the next, using young, mixed, or full GCs. Old generation regions comprise
    most of the old generation. Finally, humongous regions are considered to be part
    of the old generation and contain objects whose size is 50 percent or more of
    a region. Until JDK 8u40, humongous regions were collected as part of a young
    collection. In JDK 8u40 there is more detail on humongous regions later in this
    chapter.


    The fact that a region can be used for any purpose means that there is no need
    to partition the heap into contiguous young and old generation spaces. Instead,
    G1 heuristics estimate how many regions the young generation can consist of and
    still be within a GC pause target. As the application starts allocating, G1 chooses
    an available region, designates it as an eden region, and starts handing out memory
    chunks to Java threads. Once the region is full, another unused region is designated
    an eden region. The process continues until the maximum number of regions is reached,
    at which point a young GC is initiated.


    During a young GC, all regions, eden and survivor, are collected. All live objects
    in these regions are evacuated to either a new survivor region or to an old generation
    region. Available regions are tagged as survivor or old generation regions as
    needed when the current evacuation region becomes full.


    When the occupancy of the old generation space, a GC, exceeds the initial heap
    occupancy threshold, G1 initiates an old generation collection. The occupancy
    threshold is controlled by the command-line option -XX:InitiatingHeapOccupancyPercent,
    which defaults to 45 percent of the Java heap.


    G1 can reclaim old generation regions early when the marking phase shows that
    they contain no live objects. Such regions are added to the available region set.
    Old regions containing live objects are scheduled to be included in a future mixed
    collection.'
