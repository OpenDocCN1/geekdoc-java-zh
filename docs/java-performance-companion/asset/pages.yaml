  md: '# Some Other Tools


    Some very handy, small utilities are bundled with the SA. These tools can be attached
    to a process, to a core file, or to a remote debugger. Let''s take a look at how
    we can use them and what useful information they provide.


    # FinalizerInfo


    This tool prints details on the finalizable objects in the target VM:


    ```

    java -classpath %JAVA_HOME%\lib\sa-jdi.jar

    sun.hotspot.tools.FinalizerInfo 5684

    attaching to process ID 5684, please wait...

    Debugger attached successfully.

    Client compiler detected.

    JVM version is 24.0-b56

    Number of objects pending for finalization: 0

    ```


    # HeapDumper


    This tool can dump the Java heap to a file in the hprof format:


    ```

    java -classpath %JAVA_HOME%\lib\sa-jdi.jar

    sun.hotspot.tools.HeapDumper 5684

    attaching to process ID 5684, please wait...

    Debugger attached successfully.

    Client compiler detected.

    JVM version is 24.0-b56

    Dumping heap to heap.bin ...

    Heap dump file created

    ```


    # PermStat


    This tool prints the statistics of the permanent generation of the attached process
    or the core file:


    ```

