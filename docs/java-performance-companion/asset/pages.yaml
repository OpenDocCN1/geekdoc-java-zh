    # Object Aging and the Old Generation


    As covered briefly in the previous section, “A Young Collection Pause,” during
    every young collection, G1 maintains the age field per object. The current total
    number of young collections that any particular object survives is the “age” of
    that object. The GC maintains the age information, along with the total size of
    the objects that have been promoted into age, in a table called the “age table.”
    Based on the age, the survivor size, the survivor fill capacity (determined by
    the -XX:TargetSurvivorRatio(default = 50)), and the -XX:MaxTenuringThreshold(default
    = 15), the JVM adaptively sets a threshold for all surviving objects. Once the
    objects cross this threshold, they get promoted/tenured into the old generation
    regions. When these tenured objects die in the old generation, their space can
    be freed by a mixed collection, or during clean (but only if the entire region
    is reclaimed), or as a last resort, during a full garbage collection.


    # Humongous Regions


    For the GC, the unit of collection is a region. Hence, the heap region size (-XX:GHeapRegionSize)
    is an important parameter since it determines what size objects fit into a region.
    The heap region size also determines what objects are characterized as “humongous.”
    Humongous objects are very large objects that span 50 percent or more of a G1
    GC region. Such an object doesn''t follow the usual allocation path and instead
    gets allocated directly out of the old generation in regions marked as humongous
    regions.


