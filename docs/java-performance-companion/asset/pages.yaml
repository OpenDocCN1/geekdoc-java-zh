    the virtual address space, since the young and old generations are separate consecutive
    chunks of memory.


    # Garbage First (G1) GC


    The G1 garbage collector addresses many of the shortcomings of Parallel, Serial,
    and CMS GC by taking a somewhat different approach. G1 divides the heap into a
    set of regions. Most GC operations can then be performed a region at a time rather
    than the entire Java heap or an entire generation.


    In G1, the young generation is just a set of regions, which means that it is not
    required to be a consecutive chunk of memory. Similarly, the old generation is
    also just a set of regions. At JVM launch time which regions should be part of
    the old or young generation. In fact, the normal operational state for G1 is that
    over time the virtual memory mapped to G1 regions moves back and between the generations.
    A G1 region may be designated as young and later, after a young generation collection,
    becomes available for elsewhere since young generation regions are completely
    evacuated to unused regions.


    In the remainder of this chapter, the available region is used to identify regions
    that are unused and unavailable for use by G1. An available region can be used
    or designated as a young or old generation region. It is possible that after a
    young generation collection, a young generation region can at some future time
    be used as an old generation region. Likewise, after collection of an old generation
    region, it becomes an available region that can at some future time be used as
    a young generation region.


    G1 young collections are parallel stop-the-world collectors. As mentioned earlier,
    parallel stop-the-world pauses all Java application threads while the garbage
    collector executes, and the GC is spread across multiple threads. With the other
    HotSpot garbage collectors, when a young generation collection occurs, the young
    generation is collected.


    Old generation G1 collections are quite different from those of the other HotSpot
    collectors. G1 old generation do not require the entire old generation to be collected
    in order to free space in the old generation. Instead, only a subset of the old
    generation regions may be collected at any time. In addition, this subset of old
    generation regions is collected in conjunction with a young collection.


    > Tip

    nThe term to describe the collection of a subset of old generation regions in
    conjunction with a young collection is mixed GC. Hence, a mixed GC is a GC event
    in which all young generation regions are collected in addition to a subset of
    old generation regions. In other words, a mixed GC is a mix of young and old generation
    regions that are being collected.'
