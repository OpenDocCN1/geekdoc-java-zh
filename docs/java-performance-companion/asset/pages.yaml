- pgno: 17
  md: '# Garbage First Overview


    This chapter is an introduction to the Garbage First (or G1) garbage collector
    (GC) along with a historical perspective on the garbage collectors in the Java
    HotSpot Virtual Machine (VM), hereafter called just HotSpot, and the reasoning
    behind G1''s inclusion in HotSpot. The reader is assumed to be familiar with basic
    garbage collection concepts such as young generation, old generation, and compaction.
    Chapter 3, “JVM Overview,” of the book Java™ Performance [1] is a good source
    for learning about these concepts.


    Serial GC was the first collector introduced in HotSpot in 1999 as part of Java
    Development Kit (JDK) 1.3.1. The Parallel and Concurrent Mark Sweep collectors
    were introduced in 2002 as part of JDK 1.4.2. These three roughly correspond to
    the three most important GC cases: “minimize memory footprint, “maximize application
    throughput,” and “minimize GC-related pause times.” One might ask, “Why do we
    need new collector such as G1?” Before answering, let''s clarify some terminology
    that is often used when comparing and contrasting garbage collectors. We''ll move
    on to a brief overview of the four HotSpot garbage collectors, including G1, and
    identify how G1 differs from the others.


    # Terminology


    In this section, we define the terms parallel, stop-the-world, and concurrent.
    The term parallel means a multithreaded garbage collection operation. When a GC
    event activity is described as parallel, multiple threads are used to perform
    it. When a garbage'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'collector is described as parallel, it uses multiple threads to perform garbage
    collection.

    In the case of the HotSpot garbage collectors, almost all multithreaded GC operations
    are handled by internal Java VM (JVM) threads. One exception to this is the G1
    garbage collector, in which some background GC work can be taken on by the application
    threads. For more detail see Chapter 2, "Garbage First Garbage Collector in Depth,"
    and Chapter 3, "Garbage First Garbage Collector Performance Tuning."


    The stop-the-world means that all Java application threads are stopped during
    a GC event. A stop-the-world garbage collector is one that stops all Java application
    threads when it performs a garbage collection. A GC phase or event may be described
    as stop-the-world, which means during that particular GC phase or event all Java
    application threads are stopped.


    The concurrent means that garbage activity is occurring at the same time as the
    Java application is executing. A concurrent GC phase or event means that the GC
    phase or event executes may be described by any one or a combination of these
    three terms. For example, a parallel concurrent collector is multithreaded (the
    parallel part) and executes at the same time as the application (the concurrent
    part).


    # Parallel GC


    Parallel GC is a stop-the-world collector, which means that when a GC occurs,
    it stops all application threads and performs the GC work using multiple threads.
    The GC work can be done very efficiently without any interruptions. This is normally
    the best way to minimize the total time spent doing GC relative to application
    work. However, individual pauses of the Java application induced by GC can be
    fairly long.


    Both the young and old generation collections in Parallel GC are parallel and
    stop-the-world. Old generation collections perform compaction. Compaction moves
    objects together to eliminate wasted space between them, leading to an optimal
    heap layout. However, compaction may take a considerable amount of time, which
    is generally a function of the size of the Java heap and the number and size of
    live objects in the old generation.


    At the time Parallel GC was introduced in HotSpot, only the young generation used
    a parallel stop-the-world collector. Old generation collections used a single-threaded
    stop-the-world collector. When Parallel GC was first introduced, the HotSpot command-line
    option that enabled Parallel GC in this configuration was -XX:+ParallelGC.


    At the time when Parallel GC was introduced, the most common use case for servers
    required throughput optimization, and Parallel GC became the default collector
    for the HotSpot Server VM. Additionally, the size of most Java heaps tended to
    be between 512MB and 2GB, which keeps Parallel GC pause times'
  merge: -1
  img_proc: true
- pgno: 19
  md: "# Parallel GC\n\nrelatively low, even for single-threaded stop-the-world collections.\
    \ Also at the time, latency requirements tended to be more relaxed than they are.\
    \ Common for Web applications to tolerate GC-induced latencies in excess of one\
    \ second, and as much as three to five seconds.\n\nAs Java heaps sizes the number\
    \ and size of live objects in old generation grew, the time to collect the old\
    \ generation became longer and longer. At the same time, hardware advances made\
    \ more hardware threads available. As a result, Parallel GC was enhanced by using\
    \ a multithreaded old collector to be used by a multithreaded young collector.\
    \ This enhanced Parallel GC reduced the time required to collect and compact the\
    \ heap.\n\nThe enhanced Parallel GC was delivered in a Java 6 update release.\
    \ It was enabled by a new command-line option called -XX:+UseParallelGC. When\
    \ -XX:+UseParallelGC is enabled, parallel young collection is also enabled. This\
    \ is what we think of today as Parallel GC in HotSpot, multithreaded stop-the-world\
    \ young generation collector combined with a multithreaded stop-the-world old\
    \ generation collector.\n\n> In Java 7 update release 4 (also referred to Java\
    \ 7u4, or JDK 7u4), -XX:+UseParallelGC was the default GC and the normal mode\
    \ of operations for Parallel GC. As of Java 7u4, specifying -XX:+UseParallelGC\
    \ also enables -XX:-UseParallelGC, and likewise specifying -XX:+UseParallelGC\n\
    \nParallel GC is a good choice in the following cases:\n\n+   1. Application throughput\
    \ requirements are much more important than latency requirements.\nA batch processing\
    \ is a good example since it is noninteractive. When you start a batch execution,\
    \ you expect it to run to completion as fast as possible.\n2. If worst-case application\
    \ latency requirements can be met, Parallel GC will offer the best throughput.\
    \ Worst-case latency requirements include both worst-case pause times, and also\
    \ how frequently the pauses occur. For example, an application may have a latency\
    \ requirement of “pauses” that exceed 500ms shall not occur more than once every\
    \ two hours, and all pauses shall not exceed three seconds.\n interactive application\
    \ with a sufficiently small live data size that a Parallel GC’s full GC event\
    \ is able to meet or beat worst-case GC-induced latency requirements for the application\
    \ is a good example that fits this use. However, since the amount of live data\
    \ to be highly correlated with the size of the Java heap, the types of applications\
    \ falling into this category are limited."
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 4 Chapter 1 Garbage First Overview


    ![](img/b3ae442318f4d873d1d076953179a125_20_0.png)


    **Figure 1.1** How Java application threads are interrupted by GC threads when
    Parallel GC is used


    Parallel GC works well for applications that meet these requirements. For applications
    that do not meet these requirements, pause times can become excessively long,
    since a full GC must mark the entire Java heap and also compact the old generation
    space. As a result, pause times tend to increase with increased Java heap sizes.


    Figure 1.1 illustrates how application threads (gray arrows) are stopped and the
    GC threads (black arrows) take over to do the garbage collection work. In this
    diagram there are eight GC threads and eight Java application threads, although
    in most applications the number of application threads usually exceeds the number
    of GC threads, especially in cases where some application threads may be idle.
    When a GC occurs, all application threads are stopped, and multiple GC threads
    execute GC.


    # Serial GC


    Serial GC is very similar to Parallel GC except that it does all its work in a
    single thread. The single-threaded approach allows for a less complex GC implementation
    and requires few external runtime data structures. The memory footprint is lowest
    of all HotSpot collectors. The challenges with Serial GC are similar to those
    for Parallel GC. Pause times can be long, and grow more or less linearly with
    the heap size and amount of live data. In addition, with Serial GC the GC pauses
    are more pronounced, since the GC work is done in a single thread.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '![](img/b3ae442318f4d873d1d076953179a125_21_0.png)


    Because of the low memory footprint, Serial GC is the default on the Java HotSpot
    Client VM. It also addresses the requirements for many embedded use cases. GC
    can be explicitly specified as the GC to use with the -XX:+UseSerialGC HotSpot
    command-line option.


    Figure 1.2 illustrates how Java application threads (gray arrows) are stopped
    and a single GC thread (black arrow) takes over to do the garbage collection work
    on a machine running eight Java application threads. Because it is single-threaded,
    Serial GC in most cases will take longer to execute a GC than Parallel GC since
    Parallel GC can spread out the GC work to multiple threads.


    # Concurrent Mark Sweep (CMS) GC


    CMS GC was developed in response to an increasing number of applications that
    demand a GC with lower worst-case pause times than Serial or Parallel GC and where
    it is acceptable to sacrifice some application throughput to eliminate or greatly
    reduce the number of lengthy GC pauses.


    In CMS GC, young garbage collections are similar to those of Parallel GC. They
    are parallel stop-the-world, meaning all Java application threads are paused during
    young garbage collections and the garbage collection work is performed by multiple
    threads. Note that you can configure CMS GC with a single-threaded generation
    collector, but this option has been deprecated in Java 8 and is removed in Java
    9.


    The major difference between Parallel GC and CMS GC is the old generation collection.
    For CMS GC, the old generation collections attempt to avoid long pauses in'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'application threads. To achieve this, the CMS old collector does most of its
    work concurrently with application execution, except for a few relatively short
    GC pauses. CMS is often referred to as mostly concurrent, since there are phases
    of old generation collection that pause application threads. Examples are the
    initial-mark and remark phases. In CMS''s initial implementation, both the initial-mark
    and remark phases were single-threaded, but they have since been enhanced to multithreaded.
    HotSpot command-line options to support multithreaded initial and remark phases
    are -XX:+CMSParallelInitialMark and -XX:+CMSParallelRemarkEnabled. These are automatically
    enabled by default when CMS is enabled by the -XX:+UseSweepGC command-line option.


    It is possible, and quite likely, for a young generation collection to occur when
    an old generation collection is taking place. When this happens, the old generation
    collection is interrupted by the latter''s collection. The default young generation
    collector for CMS GC is commonly referred to as ParNew.


    Figure 1.3 shows how application threads (gray arrows) are stopped by the young
    GCs (black arrows) and for the CMS initial-mark and remark phases, and old generation
    GC stop-the-world phases (also black arrows). An old generation collection in
    GC begins with a stop-the-world initial-mark phase. Once initial mark completes,
    the concurrent marking phase begins where the Java application threads are allowed
    to execute concurrently with the CMS marking threads. In Figure 1.3, the concurrent
    marking threads are the first two longer bars, one on top of the other below the
    "Marking/Pre-cleaning" label. Once concurrent marking completes, the concurrent
    pre-cleaning is executed by the CMS threads, as shown by the two shorter bars
    under the "Marking/Pre-cleaning" label. Note that if there are enough available
    hardware threads, CMS thread overhead will not have much effect on the performance
    of Java application threads. However, if the hardware threads are saturated or
    highly utilized, CMS will compete for CPU cycles with Java application threads.
    Once concurrent pre-cleaning completes, the stop-the-world remark phase begins.
    The remark phase objects that have been missed after the initial mark and concurrent
    marking and concurrent pre-cleaning execute. After the remark phase completes,
    concurrent sweeping begins, which frees all dead object space.


    One of the challenges with CMS GC is tuning that the concurrent work can run out
    of available Java heap space. Hence, one tricky part about CMS is to find the
    right time to start the concurrent work. A common consequence of the concurrent
    approach is that CMS normally requires on the order of 10 to 20 percent more Java
    heap space than Parallel GC to handle the same application. That is part of the
    price paid for shorter GC pauses.'
