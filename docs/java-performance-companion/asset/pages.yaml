  md: "# 132\n\n# Chapter 4 · The Serviceability Agent\n\n![](img/b3ae442318f4d873d1d076953179a125_148_0.png)\n\
    \nFigure 4.47 Deadlock Detection\n\nTo get more details on these monitors, we\
    \ can use the Monitor Cache Dump utility. See Figure 4.48.\n\nSometimes, it is\
    \ interesting to look at the state of the threads. We can do this by inspecting\
    \ the thread object in the Oop Inspector utility. Let's take a look at the Thread-0\
    \ and Thread-1 objects in the Oop Inspector. Double-clicking on these threads\
    \ in the Java Threads panel will bring up the Oop Inspector windows for these\
    \ thread objects. Figure 4.49 shows the Oop Inspector for Thread-0, and Figure\
    \ 4.50 shows the Oop Inspector window for Thread-1.\n\nIn these two snapshots,\
    \ both have the thread status of 1025. Let's look at the code in Java HotSpot\
    \ VM that computes the thread state of the Java thread from its threadStatus field:\n\
    \n```\npublic static Thread toThreadState(int threadStatus) {\n    if ((threadStatus\
    \ & JVMT_THREAD_STATE_RUNNABLE) != 0) {\n        return RUNNABLE;\n    } else\
    \ if ((threadStatus &\n        JVTI_THREAD_STATE_BLOCKED_ON_MONITOR_ENTER) !=\
    \ 0) {\n        return BLOCKED;\n    }\n\nprivate final static int\nJVTI_THREAD_STATE_BLOCKED_ON_MONITOR_ENTER\
    \ = 0x0400;\n```"
