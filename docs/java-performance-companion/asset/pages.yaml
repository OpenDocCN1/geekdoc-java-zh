    \ Deadlock Detection tool, we can easily nail down the Java-level deadlocks in\
    \ applications.\n\n# ## Postmortem Analysis of a HotSpot VM Crash\n\nSA can help\
    \ in diagnosing JVM crashes with its capability to do postmortem analysis of core\
    \ files produced with these crashes. I have a simple program that uses JNI. It\
    \ writes to a byte array beyond its size limit, which results in overwriting and\
    \ corrupting the object that follows it in the Java heap. This causes the program\
    \ to crash when the garbage collector tries to scan the corrupted Java heap.\n\
    \n# ## Test Program\n\nHere is the test program that has the Java classes TestCrash\
    \ and Object1. Object1 has a native method (nativeMethod()) which is implemented\
    \ in C code in the file test.c. The TestCrash creates Object1 instances and then\
    \ calls nativeMethod() on one of these Object1 instances.\n\n```\nimport java.util.ArrayList;\n\
    \npublic class TestCrash {\n    static {\n        System.loadLibrary(\"test\"\
    );\n    }\n\n    ArrayList a2 = new ArrayList();\n    ArrayList a3 = new ArrayList();\n\
    \n    public static void main(String[] args) {\n        TestCrash t = new TestCrash();\n\
    \        t.method1();\n    }\n\n    void method1() {\n        /* Fill the heap\
    \ with ArrayLists */\n        ArrayList a1 = new ArrayList();\n        for (int\
    \ i=0; i<10000; i++) {\n            Object1 obj = new Object1();\n           \
    \ a1.add(obj);\n        }\n\n        /* corrupt an object with native method */\n\
    \        ((Object1)a1.get(i)).nativeMethod();\n\n        /* Invoke garbage collection\
    \ */\n        for (int p=0; p<10; p++) {\n            System.gc();\n        }\n\
    \    }\n```"
