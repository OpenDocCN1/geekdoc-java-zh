    # Troubleshooting Problems Using the SA


    In the previous sections we looked at the SA and is how it works. In this section
    we will talk a bit about the real-world problems of Java applications and then
    see in detail how SA can help us get to the root of these issues.


    A Java application can face multiple problems: sluggishness, high memory consumption,
    unexpected behavior of the program, and even crashes. SA tools can greatly help
    in figuring out the root of these and also help improve the performance of applications.


    # Diagnosing OutOfMemoryError


    java.lang.OutOfMemoryError is thrown when there is insufficient space to allocate
    new objects in the Java heap or in the permanent generation metaspace. (Please
    note that in JDK 8, permanent generation space has been removed in favor of the
    metaspace.) At that point, the garbage collector cannot make any more space available
    and the heap cannot be expanded further.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'The possible reasons for this error could be that the footprint of the application
    is large and cannot be accommodated in the specified Java heap, or there is a
    memory leak in the application.


    Here is a Java program that throws java.lang.OutOfMemoryError in the Java heap
    space:


    ```

    D:\tests\java MemoryError

    Exception in thread "main" java.lang.OutOfMemoryError: Java heap space

    at java.util.Vector.<init>(Vector.java:131)

    at java.util.Vector.<init>(Vector.java:144)

    at java.util.Vector.<init>(Vector.java:153)

    at Employee.<init>(MemoryError.java:42)

    at MemoryError.main(MemoryError.java:14)

    ```


    There are many ways to approach this problem:


    +   - Collect the heap dump from the process using jmap utility, the JConsole
    utility, or using the -XX:+HeapDumpOutOfMemoryError JVM option, and then analyze
    the heap dump using jhat or VisualVM.

    - Collect the heap histogram from the running process using the SA tools.

    - Collect the core or crash dump file at the occurrence of OutOfMemoryError using
    the -XX:OutOfMemoryError option, and then obtain the heap histogram from that
    core/crash dump file using the SA tools.


    Since our program does not run for long and does not give us enough to attach
    any tool to the running process, we run the process with -XX:OutOfMemoryError
    to produce a crash dump file when the OutOfMemoryError occurs. We are running
    this program on a Windows machine.


    ```

