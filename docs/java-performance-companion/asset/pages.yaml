- pgno: 9
  md: '# Preface


    Welcome to the Java® Performance Companion. This book offers companion material
    to Java™ Performance [1], which was first published in September 2011. Although
    the additional topics covered in this book are not as broad as the material in
    Java™ Performance, they go into enormous detail. The topics covered in this book
    are the G1 garbage collector, also known as the Garbage First garbage collector,
    and the Java HotSpot VM Serviceability Agent. There is also an appendix that covers
    additional HotSpot VM command-line options of interest that were not included
    in the Java™ Performance appendix on HotSpot VM command-line options.


    If you are currently using Java 8, have interest in migrating to Java 8, or have
    plans using Java 9, you will likely be either evaluating G1 or already using it.
    Hence, the information in this book will be useful to you. If interest in diagnosing
    unexpected HotSpot VM failures, or in learning more about the details of a modern
    Java Virtual Machine, this book''s content on the HotSpot VM Serviceability Agent
    should be of value to you. The HotSpot VM Serviceability Agent is the tool of
    choice for not only HotSpot VM developers but also the Oracle support engineers
    whose daily job involves diagnosing and troubleshooting unexpected HotSpot VM
    behavior.


    This book begins with an overview of the G1 garbage collector by offering some
    context around why G1 was implemented and included in HotSpot VM as a GC. It goes
    on to offer an overview of how the G1 garbage collector works. This chapter is
    followed by two additional chapters on G1. The first is an in-depth description
    of the internals of G1. If you already have a good understanding of how the G1
    garbage'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'collector works, and either have a need to further fine-tune G1 or want to
    know more about its inner workings, this chapter would be a great place to start.
    The third chapter on G1 is all about fine-tuning G1 for your application. One
    of the main design points for G1 was to simplify the tuning required to realize
    good performance. For instance, the major inputs into G1 are the initial and maximum
    heap size it can use, and a maximum GC pause time you are willing to tolerate.
    From there G1 will attempt to adapt to these inputs while it executes your application.
    In circumstances where you would like to achieve better performance, or you would
    like to do some additional tuning on G1, this chapter has the information you
    are looking for.


    The remaining chapter is dedicated to the HotSpot VM Serviceability Agent. This
    chapter provides an in-depth description of instructions for how to use the Servability
    Agent. If you have interest in learning about the internals of the HotSpot VM,
    or how to troubleshoot and diagnose unexpected HotSpot VM issues, this is a good
    chapter for you. In this chapter you will learn how to use the HotSpot VM Serviceability
    Agent to observe and analyze HotSpot VM behavior in a variety of ways through
    examples and illustrations.


    Last, there is an appendix that includes HotSpot VM command-line options that
    were not included in Java Performance''s appendix on HotSpot VM command-line options.
    Many of the HotSpot VM command-line options found in the appendix are related
    to G1. And, rather than merely listing these options with only a description,
    an attempt is made to also mention when it is appropriate to use them.


    # References


    +   [1] Charlie Hunt and B John. Java™ Performance. Addison-Wesley, Upper Saddle
    River, NJ, 2012. ISBN 978-0-13-714252-1.


