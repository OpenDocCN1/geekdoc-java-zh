- pgno: 33
  md: '# The Young Generation


    # Tip


    “GC efficiency” actually refers to the ratio of the space to be reclaimed versus
    the estimated cost to collect the region. Due to the lack of a better term, in
    this book we refer to the sorting of the heap regions in order to identify candidate
    regions as calculating the “GC efficiency.” The reason for using the same terminology
    is that GC efficiency evaluates the benefit of collecting a region with respect
    to the cost of collecting it. And the “efficiency” that we are referring to is
    solely dependent on liveliness accounting and hence is just the cost of collecting
    a region. For example, an old region whose collection is less time-consuming than
    other more expensive old regions is considered to be an “efficient” region. The
    most efficient regions would be the first ones in the sorted array of regions.


    At the end of a collection cycle, the regions that were part of the collection
    set or CSet (refer to the section “Collection Sets and Their Importance” later
    in this chapter for more information) are guaranteed to be free and returned to
    the free list. Let’s talk about these concepts in more detail.


    # The Young Generation


    G1 GC is a generational GC comprising the young generation and the old generation.
    Most allocations, with a few exceptions such as objects too large to fit in the
    allocating thread’s allocation buffer (also known as a TLAB) but smaller than
    would be considered “humongous”, and of course the “humongous” objects themselves
    (see the section “Humongous Regions” for more information), by any particular
    thread will land in that thread’s TLAB. A TLAB enables faster allocations since
    the owning thread is able to allocate in a lock-free manner. These TLABs are from
    G1 regions that become part of the young generation. Unless explicitly specified
    on the command line, the current young generation size is calculated on the initial
    and maximum generation size bounds (as of JDK defaults are 5 percent of the total
    Java heap for initial young generation size (-XX:G1NewSizePercent) and 60 percent
    of the total Java heap for maximum young generation size (-XX:G1MaxSizePercent)
    and the pause time of the allocation (-XX:MaxCPauseMillis).


    # Tip


    G1 GC will select the default of 200ms if -XX:MaxCPauseMillis is not set on the
    command line. If the user sets -Xmn or related young generation sizing command-line
    options such as -XX:NewRatio, G1 GC may not be able to adjust the young generation
    size based on the pause time goal, and the pause time target could become a moot
    option.'
