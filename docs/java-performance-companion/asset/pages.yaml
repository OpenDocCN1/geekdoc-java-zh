    # Serviceability Agent Debugging Modes


    There are three ways in which the HSDB can attach to the target HotSpot VM:


    +   - Attach to a local HotSpot process

    - Attach to a core file

    - Attach to a remote debug server


    # Attach to a HotSpot Process


    HSDB provides a facility to attach to a running Java process. Click File >Attach
    to HotSpot process and it brings up a dialog box that asks for the ID of the process
    to which we want to attach the SA, as shown in Figure 4.2.


    After typing the process ID, click OK and SA gets attached to the process. The
    process is paused at this point and remains paused as long as SA is attached to
    it. Recall SA is a snapshot debugger and provides a snapshot view of the process
    at the point in time it is attached to the process. Figure 4.3 shows the HSDB
    main window after the SA gets attached to the process.


    After analyzing the process, when we detach SA from the process, the process resumes
    its execution normally. The action of detaching the SA from the process is shown
    in Figure 4.4.'
