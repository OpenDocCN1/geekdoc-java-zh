  md: '# Concurrent Mark Sweep (CMS) GC


    ![](img/b3ae442318f4d873d1d076953179a125_23_0.png)


    **Figure 1.3** How Java application threads are impacted by the GC threads when
    CMS is used


    Another challenge with CMS GC is how it deals with fragmentation in the old generation.
    Fragmentation occurs when the free space between objects in the old generation
    becomes small or nonexistent that an object being promoted from the young generation
    cannot fit into an available hole. The CMS concurrent collection cycle does not
    perform compaction, not even incremental or partial compaction. A failure to find
    available hole causes CMS to fall back to a full collection using Serial GC, typically
    resulting in a lengthy pause. Another unfortunate challenge associated with fragmentation
    in CMS is that it is unpredictable. Some applications may never experience a full
    GC resulting from old generation fragmentation while others experience it regularly.


    Tuning CMS GC can help postpone fragmentation, as can application modifications
    such as avoiding large object allocations. Tuning can a nontrivial task and requires
    expertise. Making changes to the application to avoid fragmentation may also be
    challenging.


    # Summary of the Collectors


    All of the collectors described far have some common issues. One is that the old
    generation collectors must scan the entire old generation for most of their operations
    such as marking, sweeping, and compacting. This means the work scales more or
    less linearly with the Java heap size. Another is that it'
