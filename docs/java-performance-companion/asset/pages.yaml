    object types, and the amount of time to process them also dominates reference
    processing time. Corrective actions include the following:


    +   1. Verify that -XX:+ParallelRefProcEnabled is enabled. If it is not, enable
    it and observe whether it reduces pause time enough to reach your pause goal.


    +   2. If -XX:+ParallelRefProcEnabled is enabled, tell the application developers
    that you are observing a very high reference reclamation rate and that they consider
    refactoring the application to reduce the number of weak references being used.


    Object reference type to watch for and being careful of is the soft reference.
    If PrintReferenceGC log output suggests that a large number of soft references
    are being processed, you may also be frequent old generation collection cycles,
    which consist of concurrent cycles by a sequence of GCs. If you see a large number
    of soft references being processed and GC events occurring frequently, or heap
    occupancy constantly stays near the maximum heap size, tune the aggressiveness
    with which soft references are reclaimed using XX:SoftLRUPolicyMSPerMB. It defaults
    to a value of 1000, which is in milliseconds.


    The default setting of -XX:SoftLRUPolicyMSPerMB=1000 means that a soft reference
    will be cleared and made eligible for reclamation if the time it last accessed
    is greater than 1000ms the amount of free space in the Java heap, to illustrate
    with an example, suppose -XX:SoftLRUPolicyMSPerMB=1000 and the amount of free
    space is 1GB, that is, 1024MB. Any reference that has not been accessed since
    1024 * 1000 = 1,024,000ms, or slightly over 17 minutes, is enough to be cleared
    and reclaimed by the HotSpot garbage collector.


    The effect of setting a lower value for -XX:SoftLRUPolicyMSPerMB is to provoke
    more aggressive clearing and reclamation of soft references, which leads to lower
    heap occupancy after GC events, or conversely, setting -XX:SoftLRUPolicyMSPerMB
    causes less aggressive soft reference clearing and reclamation, which leads to
    more live data and higher occupancy. Tuning -XX:SoftLRUPolicyMSPerMB may not actually
    lead to lower reference processing times and in fact increase them.


    The primary reason to use -XX:SoftLRUPolicyMSPerMB is to reduce the frequency
    of old generation collection events by reducing the amount of data in the heap.
    We recommend against the use of soft references as a means for implementing memory-sensitive
    object caches in Java applications doing so will increase the amount of live data
    and result in additional GC overheads. See the sidebar "Using Soft References"
    for more detail.'
