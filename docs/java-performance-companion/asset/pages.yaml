  md: '# Avoiding Evacuation Failures


    > Tip

    Increasing the G1MixedGCLiveThresholdPercent value means that it will take longer
    to evacuate old regions, which means mixed collection pauses will also be longer.


    # Avoiding Evacuation Failures


    In the “Concurrent Marking Phase Tunables” section, we discussed a couple of ways
    to avoid evacuation failures. Here are a few more important tuning parameters:


    +   - Heap size. Make sure that you can accommodate all the static and transient
    live data and your short- and medium-lived live data in your Java heap. Apart
    from the accommodation of live data, additional Java heap space, or headroom,
    should be available in order for GC to operate efficiently. The more available
    headroom, the higher the possible throughput and/or the lower latency.

    - Over-specify your JVM command-line options! The defaults works for you. Get
    a baseline with your initial and maximum heap settings and a desired time goal.
    If you already know that the default threshold is not helping, adding your tuned
    threshold on the command line for the baseline run. So, your base command would
    look something like this:

    -Xms2g -Xmx4g -XX:MaxGCPMillis=100

    -Xms2g -Xmx4g -XX:MaxGCPauseOccupPercent=55


    If your application has large humongous objects, make sure that your marking threshold
    is low enough to accommodate them. Also, make sure that the long-lived objects
    that you define “humongous” are treated as such by G1. You can ensure this by
    setting -XX:G1HeapRegionSize to a value that guarantees objects greater than or
    to 50 percent of the region size are treated as humongous. As mentioned in Chapter
    2, the default value is calculated based on your initial and maximum heap sizes
    and can range from 1 to 32MB.

    Here is one snippet used using -XX:+PrintAdaptiveSizePolicy:


    91.890; [1Ergonomics (Concurrent Cycles) request current cycle initiation, reason:
    occupancy higher than threshold, occupancy: 483393536 bytes, allocation request:
