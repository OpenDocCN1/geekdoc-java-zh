- pgno: 30
  md: '# Heap Sizing


    The Java heap size in G1 is always a multiple of the region size. Except for that
    limitation, G1 can grow and shrink the heap size dynamically between -Xms and
    -Xmx just as the other HotSpot GCs do.


    G1 may increase the heap size for several reasons:


    +   1. An increase in size size can occur based on heap size calculations during
    a full GC.

    2. When a young or mid GC occurs, G1 calculates the time spent to perform the
    GC compared to the time spent executing the Java application. If too much time
    is spent in GC according to the command-line setting -XX:GCTimeRatio, the Java
    heap size is increased. The idea behind growing the Java heap size in this situation
    is to allow GCs to happen less frequently so that the time spent in GC compared
    to the time time spent executing the application is reduced.


    The default value for -XX:GCTimeRatio in G1 is 9. All HotSpot garbage collectors
    default to a value of 99. The larger the value for GCTimeRatio, the more aggressive
    the increase in Java heap size. The other HotSpot collectors are more aggressive
    in their decision to increase Java heap size and by default are targeted to spend
    less time in GC relative to the time spent executing the application.


    +   3. If an object allocation fails, even after having done a GC, rather than
    immediately falling back to doing a full GC, G1 will attempt to increase the heap
    size to satisfy the object allocation.


    +   4. If a humongous object allocation fails to find enough consecutive regions
    to allocate, G1 will try to expand the Java heap to obtain more available regions
    rather than doing a full GC.


    +   5. When a GC requests a new region into to evacuate objects, G1 will prefer
    to increase the size of the Java heap to obtain a new region rather than failing
    the GC and falling back to a full GC in an attempt to find an available region.


    # References


    +   [1] Charlie Hunt and Ben John. Java™ Performance. Addison-Wesley, Upper Saddle
    River, NJ, 2012. ISBN 978-0-13-714252-1.


    +   [2] "Code Tools: jol." OpenJDK, circa 2014. http://openjdk.java.net/projects/code-tools/jol/.'
