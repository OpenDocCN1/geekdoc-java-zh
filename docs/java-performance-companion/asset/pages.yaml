    # ## How to Install the SA-Plugin in VisualVM


    VisualVM plugins are available at the VisualVM Plugins Center. The latest VisualVM
    Plugins Center is at http://visual.java.net/pluginscenters.html. To install the
    SA-Plugin in VisualVM, click Tools > Plugins. This will bring up the Plugins dialog
    box. Click on the Available Plugins tab, select SA-Plugin from the list, and then
    Install. This will install the SA-Plugin in your VisualVM installation.


    # ## How to Use the SA-Plugin


    Let''s take a look how we can use the SA-Plugin to explore a running process or
    a core file.


    To explore a live process with SA-Plugin, run the process with a JDK that is shipped
    along with the binaries. Open this process in VisualVM. When SA-Plugin is installed
    in VisualVM, it appears in the Application view when the process is opened in
    VisualVM. Now, click Attach to Process in the SAPlugin tab; this will attach SA
    to the running process, and the process will be paused at that in time. Now we
    can explore the snapshot of the process. We can look at its Java threads, inspect
    the Java objects, look at the bytecodes/compiled code of methods, and so on.'
