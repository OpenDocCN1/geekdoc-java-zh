  md: '# 92 Chapter 4 The Serviceagability Agent


    ![](img/b3ae442318f4d873d1d076953179a125_108_0.png)


    Figure 4.25 Find Pointer


    # Find Pointer


    This tool can help find where a particular address lies in the Java process address
    space. This is particularly useful when we are dealing with JVM crashes and when
    to know the details of the memory address being accessed when the JVM crashed.
    For instance, where in the JVM does the address reside? Is the address at a location
    in the Java heap, in the eden space, or the old generation space? Figure 4.25
    shows an example of an address that has been entered and the resulting information
    about the address that is displayed.


    # Find Address in Heap


    This tool reports all the locations where a particular value is located in the
    Java heap. This is very useful when we want to find all the addresses from where
    an object is referenced in the Java heap.


    This utility greatly helps in dealing garbage-collector-related issues, such as
    in the case of a GC crash where an object was collected prematurely and the JVM
    crashes while accessing the memory location of that object. By transitively tracking
    the references pointing to that object, we can get clues as why the object did
    not get marked as live by the garbage collector and was collected prematurely.


    Figure 4.26 shows an example address entered and the resulting output.


    # Find Value in Code Cache


    This tool shows all the locations from where a given is being accessed in the
    cache of compiled methods. This helps in troubleshooting just-in-time (JIT) compiler-related
    problems. An example is shown in Figure 4.27.'
  merge: -1
  img_proc: true
