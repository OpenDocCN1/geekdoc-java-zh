    We can see that this Java code maintains records of employees along with their
    address details. The employee records are added to two collection objects: to
    a hash map and to a vector. Vector employeesList and hash map employeeMap hold
    references to the Employee and Address instances and thus prevent them from getting
    collected by the garbage collector. Therefore, these instances keep increasing
    in number in the Java heap.


    This test program demonstrates a mistake that is commonly made in real applications.
    Often, applications inadvertently maintain multiple caches and'
