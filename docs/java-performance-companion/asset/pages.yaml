    the Object Inspector tool.


    To inspect a Java object, we need to provide the object''s address in the Java
    heap, this tool shows the internal fields of the object as in Figure 4.17.


    Object Inspector can also show the VM internal C++ structures that are described
    by the VMStructs database in the target VM. See Figure 4.18.'
