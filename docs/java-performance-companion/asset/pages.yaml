- pgno: 50
  md: '# Stages of Concurrent Marking


    The marking task chunks are carried out mostly concurrently. A few tasks are completed
    during short stop-the-world pauses. Let''s now talk about the significance of
    these tasks.


    # Initial Mark


    During initial mark, the mutator threads are stopped in order to facilitate the
    marking of all the objects in the Java heap that are directly reachable by the
    roots (also root objects).


    > Root objects are objects that are reachable from outside of the Java heap; native
    stack objects and JNI (Java Native Interface) local or global objects are some
    examples.


    Since the mutator threads are stopped, the initial-marking stage is a stop-the-world
    phase. Also, since young collection also traces roots and is stop-the-world, it''s
    convenient (and time efficient) to carry out marking at the same time as a regular
    young collection. This is also known as "piggybacking." During the initial-mark
    pause, the NTAMS value for each region is set to the current top of the region
    (see Figure 2.5). This is done iteratively until all the regions of the heap are
    processed.


    # Root Region Scanning


    The root region scanning stage must complete before the next garbage collection
    pause since all objects that are referenced from the survivor regions need to
    be identified and marked before the entire heap can be scanned for live objects.


    # Concurrent Marking


    The concurrent marking stage is concurrent and multithreaded. The command-line
    option to set the number of concurrent threads to be used is -XX:ConcGCThreads.
    By default, G1 GC sets the total number of threads to one-fourth of the parallel'
  merge: -1
  img_proc: true
- pgno: 51
  md: "# Stages Concurrent Marking 35\n\nGC threads (-XX:ParallelGCThreads). The parallel\
    \ GC threads are calculated by the JVM at the start of the VM. The concurrent\
    \ threads scan a region at time and use the \"finger\" pointer optimization to\
    \ claim that region. This \"finger\" pointer optimization is similar to CMS’s\
    \ \"finger\" optimization and can be studied in [2].\n\nAs mentioned in the RSets\
    \ and Their Importance, G1 GC also employs a pre-write barrier to perform actions\
    \ required by the SATB concurrent marking algorithm. As an application mutates\
    \ its object graph, objects that were reachable at the start of marking and were\
    \ a snapshot of marking may be overwritten before they are discovered and traced\
    \ by a marking thread. The SATB marking guarantees that the mutator thread log\
    \ the previous value of the pointer that needs to be modified, in an SATB queue/buffer.\
    \ This is called the \"concurrent marking/SATB pre-write barrier\" since the barrier\
    \ is executed before the update. The pre-write barrier enables the recording of\
    \ the previous value of the object reference field so that concurrent marking\
    \ can mark through the object whose value is overwritten.\n\nThe pseudo-code of\
    \ the pre-write barrier for an assignment of form x.f = y is as follows:\n\n```\n\
    if (marking_is_active) {\n  pre_val := x.f;\n  if (pre_val != NULL) {\n    satb_enqueue(pre_val);\n\
    \  }\n}\n```\n\nThe marking_is_active condition is a simple check of a thread-local\
    \ flag that is set to true at the start of marking, during the initial-pause.\
    \ Guarding the pre-barrier code with this reduces the overhead of executing the\
    \ remainder of the barrier when marking is not active. Since the flag is thread-local\
    \ and its value may be loaded multiple times, it is likely that any individual\
    \ will have it in cache, reducing the overhead of the barrier.\n\nThe satb_enqueue(pre)\
    \ first tries to enqueue the previous value in a thread-local buffer, referred\
    \ to as an SATB buffer. The initial size of an SATB buffer is 256 entries, and\
    \ each application thread has an SATB buffer. If there is no room to place the\
    \ pre_val in buffer, the JVM runtime is called; the thread’s SATB buffer is retired\
    \ and placed on a global list of SATB buffers, a new SATB buffer is allocated\
    \ for the thread, and the pre_val is recorded. It is the job of the concurrent\
    \ marking threads to check and process the buffers at intervals to ensure the\
    \ marking of the logged objects.\n\nThe filled SATB buffers are processed (during\
    \ the marking stage) from the global list by iterating through each buffer and\
    \ marking each recorded object by"
