- pgno: 58
  md: '# External Root Regions


    External root region scanning (Ext Root Scanning) is one of the first parallel
    tasks. During this phase the external (off-heap) roots such as the JVM''s system
    dictionary, VM data structures, JNI thread handles, hardware registers, global
    variables, and thread stack roots are scanned to find out any point into the current
    pause''s collection set (CSet).


    ```

    [Ext Root Scanning (ms): Min: 0.1, Avg: 0.2, Max: 0.2, Diff: 0.1, Sum: 1.2]

    ```


    Here again, we look for Diff >> 0 and major variance in Max, Min, or Avg.


    > Tip

    The variance (Diff) is shown for all the timed activities that make up the parallel
    phase. A high variance usually means that the work is not balanced across the
    parallel threads for that particular activity. This knowledge is an analysis starting
    point, and ideally a deeper dive will identify the potential cause, which may
    require refactoring the Java application.


    Another thing to watch out for is whether a worker thread is caught in dealing
    with a single root. We have seen issues where the system dictionary, which is
    treated as a single root, ends up holding a worker thread when there is a large
    number of loaded classes. When a worker thread is late for “termination” (explained
    later in this section), it is also considered held up.


    # Remember Sets and Processed Buffers


    ```

    [Update RS (ms): Min: 12.8, Avg: 13.0, Max: 13.2, Diff: 0.4, Sum: 103.6]

    Processed Buffers: Min: 15, Avg: 16.0, Max: 17, Diff: 2, Sum: 128]

    ```


    As explained in Chapter 2, “Garbage First Collection in Depth,” G1 GC uses remembered
    sets (RSets) to help maintain and track references into G1 regions that “own”
    those RSets. The concurrent refinement threads, as discussed in Chapter 2, are
    tasked with scanning the log buffers and updating RSets for the regions with dirty
    cards. In order to supplement the work carried out by the concurrent refinement
    threads, any remainder buffers that were logged but not processed by the refinement
    threads are handled during the parallel phase of the collection pause and processed
    by the worker threads. These buffers are referred to as Processed Buffers in the
    log snippet.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# The Stages of a Young Collection


    In order to limit the time spent updating RSets, G1 sets a target time as a percentage
    of the pause time goal (-XX:MaxGCMillis). The target time defaults to 10 percent
    of the pause time goal. Any evacuation pause should spend most of its copying
    live objects, and 10 percent of the pause time goal is considered a reasonable
    amount of time to spend updating RSets. After looking at the logs you realize
    that spending 10 percent of pause time goal in updating RSets is undesirable,
    you can change the percentage by updating the -XX:G1UpdatingPausePercent command-line
    option to reflect your desired value. It is important to remember, however, that
    if the number of updated log buffers does not change, decrease in RSet update
    time during the collection pause will result in fewer buffers being processed
    during that pause. This will push the log buffer work onto the concurrent refinement
    threads and will result in increased work and sharing of resources with the Java
    application mutator threads. Also worst case, if the concurrent refinement threads
    cannot keep up with the log buffer update rate, the Java application mutators
    must step in and help with the processing—a scenario avoided!


    > Tip

    as discussed in Chapter 2, there is a command-line option called -XX:G1RefinementThreads.
    By default it is set to the same value as -XX:ParallelGCThreads, which means that
    any change in XX:ParallelGCThreads will change the -XX:G1ConcRefinementThreads
    value as well.


    Before collecting regions in the current CSet, the RSets for the CSet must be
    scanned for references in the CSet regions. As discussed in Chapter 2, a popular
    object in a region or popular region itself can lead to its RSet being- from a
    sparse PRT (per-region table) to a fine-grained PRT or even a coarsened bitmap,
    and thus scanning an RSet will require more time. In such a scenario, you will
    see an increase in the Scan time shown here since the scan times depend on the
    coarseness gradient of the RSet data structures:


    ```

    [Scan RS (ms): Min: 13.4, Avg: 13.6, Max: 13.7, Diff: 0.3, Sum: 109.0]

    ```


    Another parallel task related to RSets is root scanning, during which the code
    root is scanned to find references into the current CSet:


    ```

    [Code Root Scanning (ms): Min: 0.0, Avg: 0.0, Max: 0.0, Parallel: 0.0543862, Sum:
    0.1]

    ```'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'In earlier versions of HotSpot, the entire code cache was treated as a single
    root and was claimed and processed by a single worker thread. A large and full
    or nearly code cache would hold up that worker thread and lead to an increase
    in the total pause time. With the introduction of code root scanning as a separate
    parallel activity, the work of scanning the nmethods is reduced to just scanning
    the RSets for references from the compiled code. Hence for a particular region
    in the CSet, only if the RSet for that region has strong code roots is the corresponding
    nmethod scanned.


    > Tip

    Developers often refer to the dynamically compiled code for a Java method by the
    term of anethod. An method is not to be confused with a native method, which refers
    to a JNI method. Nmethods include auxiliary information such as constant pools
    in addition to generated code.


    > Tip

    To reduce nmethod scanning times, only the RSets of the regions in the CSet are
    scanned for references introduced by the compiler, rather than the “usual” references
    that are introduced by the Java application mutator threads.


    # Summarizing Remembered Sets


    The option -XX:+GSummarizeRSetStats is used to provide a window into the total
    number of RSet coarsening (fine-grained or coarsened bitmap) to help determine
    if concurrent refinement changes are able to handle the updated buffers and to
    gather more information on nmethods. This option summarizes RSet statistics every
    nth GC pause, where n is set by -XX:+GSummarizeRSetStatsPeriod=n.


    ```

    -XX:+GSummarizeRSetStats is a diagnostic option and must be enabled by adding
    -XX:+UnlockDiagnosticVMOptions to the command line, for example,

    JAVA_OPTS="-XX:+UseGC -XX:+UnlockDiagnosticVMOptions -XX:+PrintGCDetails -XX:+GSummarizeRSetStats
    -XX:+GSummarizeRSetPeriod=1 -Xloggc:jdk84_h2.log".

    ```'
  merge: -1
  img_proc: true
