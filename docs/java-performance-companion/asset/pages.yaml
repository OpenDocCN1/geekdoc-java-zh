    # Reference Processing Tuning


    The first thing to do is enable multithreaded reference processing using -XX:+ParallelRefProcEnabled,
    because HotSpot defaults to single-threaded reference processing. This default
    exists to minimize memory footprint and to make CPU cycles available to other
    applications. Enabling this option will burn more CPU during reference processing,
    but the elapsed, or wall clock, time to complete reference processing will go
    down.


    If reference processing time remains larger than 10 percent of young or mixed
    GC pause times after adding -XX:+ParallelRefProcEnabled, or G1''s remark phase
    is spending much time in reference processing, the next step is to determine which
    reference object type or set of reference object types G1 is spending most of
    its time at each GC: -XX:+PrintReferenceGC will report statistics on each reference
    object type at each GC:


