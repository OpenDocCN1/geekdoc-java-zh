- pgno: 53
  md: '# Evacuation Failures and Full Collection


    the previous marking bitmap becomes the new one (which will be used as the current
    marking bitmap during the next cycle). Similarly, PTAMS and NTAMS swap roles as
    well. Three major contributions of the cleanup pause are identifying completely
    free regions, sorting the heap regions to identify efficient old regions for mixed
    garbage collection, and RSet scrubbing. Current heuristics rank the regions by
    liveness (the regions that have a lot of live objects are expensive to collect,
    since copying is an expensive operation) and remembered set size (again, large
    remembered sets are expensive to collect due to the regions'' popularity—the concept
    of popularity was discussed in the “Sets and Importance” section). The goal is
    to collect/evacuate the candidate regions that are deemed less expensive (fewer
    live objects and less popular) first.


    An advantage of identifying the live objects in each region is that on encountering
    a completely free region with no live objects, its remembered set can be cleared
    and the region can be immediately reclaimed and returned to the list of free regions
    instead of being placed in the GC-efficient (the concept of GC efficiency was
    discussed in “Garbage Collection in G1” section) sorted array and having to wait
    for a reclamation (mixed) garbage collection pause. RSet scrubbing also helps
    detect stale references. So, for example, if marking finds that all the objects
    on a particular card are dead, the entry is purged from the “owning” RSet.


    Sometimes G1 GC is unable to find a free region to copy live objects from a young
    region or when trying to copy live objects during evacuation from an old region.
    Such a failure is reported as a to-space exhausted failure in the GC logs, and
    the duration of the failure is shown further down in the log as the Evacuation
    Failure time (331.5ms) in the following example:


    ```

    111.912: [GC pause (young 0.6773162 secs]

    <S0>

    [Evacuation Failure: 331.5 ms

    ```


    There are other times when a humongous allocation may not be able to find contiguous
    regions in the old generation. At such times, the G1 GC will attempt to increase
    its usage of the Java heap. If the expansion of the Java heap space is unsuccessful,
    G1 GC triggers its fail-safe mechanism and falls back to a serial (single-threaded)
    full collection.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'During a full collection, a single thread operates over the entire heap and
    does mark, sweep, and compaction of all the regions (expensive or otherwise) constituting
    the generations. After completion of the collection, the resultant heap now consists
    of purely live objects, and all the generations have been fully compacted.


    > **Tip**nPrior to JDK 8u40, unloading of classes was possible only at a full
    collection.


    The single-threaded nature of the serial full collection and the fact that the
    collection spans the entire heap can make this a very expensive collection, especially
    if the heap size is fairly large. Hence, it is highly recommended that a nontrivial
    tuning exercise be done in such cases where full collections are a frequent occurrence.


    > **Tip**nFor more information on how to get rid of evacuation failures, please
    refer to Chapter 3.


    # # References


    +   [1] Charlie Hunt and Binu John. *Java™ Performance*. Addison-Wesley, Upper
    Saddle River, NJ, 2012. ISBN 978-0-13-714252-1.


    [2] Tony Printezis and David Detlefs. “A Generational Mostly-Concurrent Garbage
    Collector.” *Proceedings of the 2nd International Symposium on Memory Management*.
    ACM, New York, 2000, pp. 143–54. ISBN 1-5813-263-8.


    [3] Urs Hölze. “A Fast Write Barrier for Garbage Collectors.” Presented at the
    OOPSLA93 Garbage Collection Workshop, Washington, DC, October 1993.


    [4] Darko Stefanovic, Matthew Hertz, Stephen M. Blackburn, Kathryn S McKinley,
    and J. Eliot B. Moss, “Older-First Garbage Collection in Practice: Evaluation
    in a Java Virtual Machine.” *Proceedings of the 2002 Workshop on Memory System
    Performance*. ACM, New York, 2002, pp. 25–36.


    [5] Taiichi Yuasa. “Real-Time Garbage Collection on General Purpose Machines.”
    *Journal of Systems and Software*, Volume 11, Issue 3, March 1990, pp. 181–98.
    Elsevier Science, Inc., New York.'
