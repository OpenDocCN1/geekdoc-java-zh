    \n![](img/b3ae442318f4d873d1d076953179a125_93_1.png)\n\n## 第 4 章 ■ 服务性代理\n\n在连接到\
    \ core 文件后，HSDB 提供了与处理活动进程时相同的工具集来探索 core 文件。\n\n### 连接到调试服务器\n\n当无法在 SA 所在的同一台机器上对进程或\
    \ core 文件进行调试时，此功能对于远程调试非常有用。通过此功能，我们可以在存在进程/core 文件的远程机器上运行调试服务器，然后将 SA 工具连接到远程运行的调试服务器。我们需要在远程机器上执行以下步骤来启动调试服务器：\n\
    \n- 在类路径中使用 `sa-jdi.jar` 启动 RMI 注册表：\n\n```\n$JAVA_HOME/bin/rmireistry -Xbootclasspath/p:${JAVA_HOME}/lib/sa-jdi.jar\n\
    ```\n\n此命令创建并启动了一个远程对象注册表。可以指定启动该注册表的端口号。如果没有指定端口号，注册表将在端口 1099 上启动。\n\n- 在远程机器上启动调试服务器，并指定要调试的进程或\
    \ core 文件：\n\n```\n${JAVA_HOME}/bin/java -classpath ${JAVA_HOME}/lib/sa-jdi.jar\n\
    sun.jvm.hotspot.DebugServer <pid> [uniqueID]\n```\n\n或者\n\n```\n${JAVA_HOME}/bin/java\
    \ -classpath ${JAVA_HOME}/lib/sa-jdi.jar\nsun.jvm.hotspot.DebugServer\n<产生 core\
    \ 文件的 java 可执行文件路径><要调试的 corefile 路径> [uniqueID]\n```\n\nuniqueID 是一个可选字符串。如果我们想在同一台机器上同时运行多个调试服务器，我们必须为每个调试服务器指定不同的\
    \ uniqueID。如果 RMI 注册表尚未启动，调试服务器将在默认端口 1099 启动 RMI 注册表。\n\n现在，让我们在 Solaris SPARC\
    \ 机器上启动一个 Java 进程，为其附加调试服务器，然后从 Windows 机器连接到该调试服务器。\n\n- 启动 Java 进程：\n\n```\n\
    myserver% java TestClass & \n27813\n```\n\n2. 启动 rmireistry 和调试服务器：\n\n```\nmyserver%\
    \ rmireistry -Xbootclasspath/p:$JAVA_HOME/lib/sa-jdi.jar\n```\n\n3. 启动调试服务器，传递\
    \ HotSpot 进程 ID 和我们想要分配给此调试的唯一名称：\n\n```\nmyserver% $JAVA_HOME/bin/java -cp $JAVA_HOME/lib/sa-jdi.jar\
    \ -Djava.rmi.server.codebase=$JAVA_HOME/lib/sa-jdi.jar sun.jvm.hotspot.DebugServer\
    \ 27813\nAttaching to process 27813 and starting RMI services,\nwait...\nDebugger\
    \ attached and RMI services started.\n```\n\n从 Windows 机器，我们现在可以使用 [uniqueID@hostname]\
    \ 格式的唯一标识符和主机名连接到此特定的调试服务器，如图 4.7 所示。一旦输入了唯一 ID 和主机名并点击 OK 按钮，SA 将显示一个状态窗口，说明正在尝试连接到调试服务器，如图\
    \ 4.8 所示。\n\nHSDB 连接到调试服务器后，我们可以使用 Tools 菜单下的所有可用工具来调试进程，就像在本地机器上运行一样。\n\n![](img/b3ae442318f4d873d1d076953179a125_95.png)\n\
    \n图 4.7 连接到调试服务器\n\n## 第 4 章 · 服务性代理\n\n![](img/b3ae442318f4d873d1d076953179a125_96.png)\n\
    \n### HSDB 工具\n\nHSDB 提供了许多工具帮助我们探索进程或 core 文件。当连接到 Java 进程或 core 文件时，出现的窗口是显示目标线程的\
    \ Threads 面板。图 4.9 显示了进程中的 Java 线程。\n\n![](img/b3ae442318f4d873d1d076953179a125_99.png)\n\
    \n### 服务性代理调试工具\n\n此面板左侧有一些有趣的图标，用于显示所选线程：\n\n字体 检查线程（Inspect Thread）：此图标会显示所选线程的，如图\
    \ 4.8。\n- 栈内存（Stack Memory）：这显示所选线程的栈信息，如图 4.11。\n\n![](img/b3ae442318f4d873d1d076953179a125_97.png)\n\
    \n图 4.10 检查\n\n## 第 4 章 ■ 服务性代理\n\n![](img/b3ae442318f4d873d1d076953179a125_98.png)\n\
    \n图 4.1 栈内存\n\n- 显示 Java 栈跟踪（Show Java Stack Trace）：这显示 Java 栈跟踪中的方法名和地址是超链接，点击这些链接可以在窗口底部显示详情。\n\
    - 显示线程信息（Show Thread Information）：这显示所选线程的详细信息，如图 4.13。\n- 查找崩溃（Find Crashes）：Threads\
    \ 面板上的最后一个图标搜索任何线程是否崩溃，如果有，则显示关于崩溃的详情。\n\n现在让我们快速查看 Tools 菜单下的可用工具，如图 4.14 所示。\n\
    \n![](img/b3ae442318f4d873d1d076953179a125_99.png)\n\n图 4.12 Java 栈跟踪\n\n![](img/b3ae442318f4d873d1d076953179a125_100.png)\n\
    \n图 4.13 线程信息\n\n## 第 4 章 · 服务性代理\n\n![](img/b3ae442318f4d873d1d076953179a125_101.png)\n\
    \n图 4.14 HSDB 工具\n\n这些工具某些对于调试 Java 级问题很有帮助，另一些对于排除 JVM 级问题非常有用。\n\n### 类浏览器（Class\
    \ Browser）\n\n通过类浏览器（见图 4.15），我们可以看到目标 VM 加载的所有类。它允许我们对所有或某些特定的加载错误进行转储。当我们无法访问应用程序源代码，只有\
    \ core dump 文件并需要调查某些加载类的问题时，此工具非常有用。例如，如果某个加载类的行为不符合预期，我们可以转储该类，查看其代码并尝试解决问题。或者可能是加载的类太多，通过类浏览器我们可以查看这些类，看看是否有不必要的类也被加载了，或者这些类是否按预期被卸载。\n\
    \n### 死锁检测\n\n此功能帮助我们检测线程之间的 Java 级死锁。如果目标 VM 中的线程之间存在 Java 级死锁，此工具将打印参与死锁的线程信息以及它们正在等待获取的监视。图\
    \ 4.16 显示了一个未发现死锁的示例。\n\n"
