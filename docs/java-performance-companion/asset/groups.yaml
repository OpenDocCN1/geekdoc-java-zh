    # A Mixed Collection Pause


    As more and more objects get promoted into the old regions or when humongous objects
    get allocated into the humongous regions, the occupancy of the old generation
    and hence the total occupied Java heap increases. In order to avoid running out
    of heap space, the JVM process needs to initiate a garbage collection that not
    only covers regions in the young generation but also adds some old regions to
    the mix. Refer to the previous section on humongous regions here to read about
    the special handling (allocation and reclamation) of humongous objects.


    In order to identify old regions with the most garbage, G1 GC initiates a concurrent
    marking cycle, which helps with marking and eventually identifying all live objects
    and also calculating the liveness factor per region. There needs to be a delicate
    balance between the rate of allocations and promoting the triggering of this marking
    cycle such that the JVM process doesnt run out of Java heap space. Hence, an occupancy
    threshold is set at the start of the JVM process. As this of writing and through
    just JDK 8u45 this threshold is not adaptive and can be set by the command-line
    option -XX: InitiatingHeapOccupancyPercent (which I very fondly call IHOP).


    In G1, the IHOP threshold defaults to 45 percent of the total Java heap. It is
    important to note that this heap occupancy percentage applies to the entire java
    heap, unlike the occupancy command-line option used with CMS GC where it applies
    only to the old generation. In G1 GC, there is no physically separate old generation—there
    is a single pool of free regions that can be allocated as eden, survivor, or humongous.
    Also, the number of regions that are allocated, for say the eden, can vary over
    time. Hence having an old generation percentage didn''t really make sense.


    # Trivia


    I used to write e-mails to G1 GC dev engineers and also to G1 GC users about the
    marking threshold and would always have to refer to it full as InitiatingHeapOccupancyPercent
    since there is another difference (than the one mentioned in the preceding tip)
    between CMS and G1’s marking threshold—it’s the option name! CMS’s marking threshold
    is called CMSInitiatingOccupancyFraction, and as you can see there is no “percent”
    in the option name. So to avoid any confusion, I would always have to specify
    the full option name for G1, and soon I developed a form of endearment for this
    and started calling it IHOP.'
  - '[PAGE 39]


    # A Mixed Collection Pause


    When the old generation occupancy reaches (exceeds) the IHOP threshold, a concurrent
    marking cycle is initiated. Toward the end of marking, G1 GC calculates the amount
    of live objects per old region. Also, during the cleanup stage, G1 GC counts the
    old regions based on "GC efficiency." Now a mixed collection can happen! During
    a mixed collection pause, G1 GC not only collects all of regions in the young
    generation but also collects a few candidate old regions that the old garbage
    were reclaimed.


    # Tip


    An important point to keep in mind when comparing CMS and G1 logs is the multistaged
    concurrent cycle in G1 has fewer stages than the multistaged concurrent cycle
    in CMS.


    A single mixed collection is similar to a young collection pause and achieves
    compaction of the live objects by copying. The only difference is that during
    a mixed collection, the collection set also incorporates a few old regions. Depending
    on a few parameters (as discussed later in this chapter), there could be more
    than one mixed collection pause. This is called a "mixed collection cycle." A
    cycle can happen only after the marking/IHOP threshold is crossed and after the
    collection of a concurrent marking cycle.


    There are two important parameters that determine the total number of mixed collections
    in a mixed collection cycle: -XX:G1MixedGCCountTarget -XX:G1HeapWastePercent.

    XX:G1MixedGCCountTarget, which defaults to 8 (JDK 8u45), is the mixed GC count
    target option which is set as a physical limit on the number of mixed collections
    that will happen after the marking cycle is complete. G1 GC divides the total
    number of candidate old regions available for collection by the count target number
    and sets that as the minimum number of old regions to be collected per mixed collection
    pause. This can be represented as an equation as:


    Minimum CSet per mixed collection pause = Total number of candidate old regions
    identified per mixed collection cycle/G1MixedGCCountTarget


    -XX:G1HeapWastePercent, which defaults to 5 percent (JDK 8u45) of the total Java
    heap, is an important parameter that controls the number of old regions to be
    collected during a mixed collection cycle. For every mixed collection pause, G1
    GC identifies the amount of reclaimable heap based on the dead object space that
    can be reclaimed. As soon as G1 GC reaches this heap waste percentage, G1 GC stops
    the initiation of a mixed collection pause, thus culminating the mixed collection
    cycle. Setting the heap waste percentage basically helps with limiting the amount
    of heap that you are willing to waste to speed up the mixed collection cycle.'
