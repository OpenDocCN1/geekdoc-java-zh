  mdcn: '


    ## -XX:PrintStringDeduplicationStatistics


    启用打印字符串去重（String deduplication）统计信息。默认值为禁用。


    当你想要知道启用去重是否能显著节省 Java 堆中字符串对象占用的空间时，此命令行选项非常有用。因此，启用此命令行选项可以提供数据，以证明是否有必要启用 -XX:UseStringDeduplication。


    另请参阅 -XX:UseStringDeduplication 和 -XX:StringDeduplicationAgeThreshold。


    ## -XX:+GUseAdaptiveIHOP


    这是在 JDK 9 及更高版本中提供的新命令行选项。它能够根据命令行选项 `InitiatingHeapOccupancyPercent`（初始堆占用百分比）的初始值，充分调整初始堆占用阈值。其意图是让
    G1 适应标记阈值的行为，通过尽早触发标记周期而不耗尽老年代空间，从而提高吞吐量。


    `GUseAdaptiveIHOP` 启机制使用命令行选项 `InitiatingHeapOccupancyPercent` 的值作为标记周期的初始值，直到对应用行为有了充分的观察。随后，它会调整到一个更优的占用百分比来启动标记周期。


    当 `GUseAdaptiveIHOP` 禁用时（通过命令行选项显式指定 `-XX:-GUseAdaptiveIHOP`），G1 将始终使用 `InitiatingHeapOccupancyPercent`
    的值作为启动标记周期的占用率。`GUseAdaptiveIHOP` 在 JDK 9 引入时默认已启用。


    另请参阅 -XX:InitiatingHeapOccupancyPercent。


    ## -XX:MaxGCPMillis


    此命令行选项设置以毫秒为单位的暂停目标，默认值为 200。请注意，这是一个目标，而不是 G1 永远无法超过的硬性最大时间。


    G1 尝试调整新生代的大小，以确保其可以在 `-XX:MaxGCPMillis` 设置的目标内完成收集。在使用 G1 时，配合使用 `-Xms` 和 `-Xmx`
    对 Java 堆进行调优，此命令行选项是预期会被使用的。即使从 Parallel GC 或 CMS GC 迁移到 G1，这三个命令行选项也是使用 G1 建议的起点。


    ## -XX:MinHeapFreeRatio


    设置堆中允许空闲内存的值。默认值为 40。该值实际上是一个百分比，而不是比例。遗憾的是，命令行名称中包含了“ratio”（比例）一词。


    Java HotSpot VM 使用 `-XX:MinHeapFreeRatio` 设置的值来帮助决定何时扩展堆。此决策是在 GC 期间做的，可以描述为：如果
    Java 堆的空闲比例小于 `-XX:MinHeapFreeRatio` 百比，G1 将尝试扩展 Java 堆以满足 `-XX:MinHeapFreeRatio`
    设置的值。


    显然，为了让 Java 堆扩展，必须为 `-Xms`（初始 Java 堆大小）和 `-Xmx`（最大 Java 堆大小）设置不同的值。如果 `-Xms` 和
    `-Xmx` 设置为相同的值，Java HotSpot VM 将不会扩展或缩小 Java 堆。


    ## -XX:MaxHeapFreeRatio


    设置堆中允许空闲内存的值。默认值为70。与 `-XX:MinHeapFreeRatio` 类似，该值实际上是一个百分比，而不是比例。同样，与 `-XX:MinHeapFreeRatio`
    类似，遗憾的是命令行名称中包含了“ratio”（比例）一词。


    Java HotSpot VM 使用 `-XX:MaxHeapFreeRatio` 设置的值来决定何时缩小 Java 堆。此决策是在 GC 期间做的，可以描述为：如果
    Java 堆的空闲比例大于 `-XX:MaxHeapFreeRatio` 百比，G1 将尝试缩小 Java 堆以满足 `-XX:MaxHeapFreeRatio`
    设置的值。


    与 `-XX:MinHeapFreeRatio` 情况一样，为了让 Java 堆缩小，必须为 `-Xms`（初始 Java 堆大小）和 `-Xmx`（最大
    Java 堆大小）设置不同的值。如果 `-Xms` 和 `-Xmx` 设置为相同的值，Java HotSpot VM 将不会扩展或缩小 Java 堆。


    ## -XX:+PrintAdaptiveSizePolicy


    开启关于堆大小变化的日志记录。这些信息对于理解 G1 的人体工程启发式决策（也适用于 Parallel GC）非常有用。


    在调优 G1 时使用 `-XX:+PrintAdaptiveSizePolicy` 的描述见第 3 章“垃圾优先 收集器调优”。


    ## -XX:+ResizePLAB


    设置 GC 用于提升对象的线程分配缓冲区（PLAB） 应该动态调整大小，还是保持静态大小。默认值为 true。


    ## 附录 感关的其他 HotSpot VM 命令行选项


    已证明 G1 中 PLAB 的动态调整大小会导致某些性能问题。对于某些应用程序，禁用线程本地提升缓冲区的调整大小可以通过缩短 G1 GC 暂停时间来提高性能。


    ## -XX:+ResizeTLAB


    设置 Java 应用线程用于 Java 对象分配的线程本地分配缓冲区（TLAB） 应该动态调整大小，还是具有静态固定大小。默认值为 true。


    在大多数情况下，TLAB 调整大小通过通过减少分配路径上的竞争来提高性能。与 PLAB 大小调整相反，通常不会看到为了性能而关闭此选项。因此，对于几乎所有应用程序，最好启用此命令行选项（即其默认设置）。


    ## -XX:+ClassUnloadingWithConcurrentMark


    在 G1 并发周期期间开启卸载。默认值为 true。


    通常情况下，卸载不可达类是有益的，即 -XX:ClassUnloadingWithConcurrentMark。


    ## -XX:+ClassUnloading


    开启类卸载。默认值为 true。


    如果禁用此选项，即 -XX:-ClassUnloadingWithConcurrentMark。


    ## -XX:+UnlockDiagnosticOptions


    设置是否允许诊断选项。默认值为 false。


    与 `-XX:+UnlockExperimentalOptions` 类似，某些命令行选项被标记为“diagnostic”。这些选项可以在 Java HotSpot
    命令行选项列表中通过使用 `-XX:+PrintFinal` 查看。


    ## -XX:+UnlockExperimentalOptions


    设置是否允许实验性选项。默认值为 false。


    与 `-XX:+UnlockDiagnosticOptions` 类似，某些命令行选项被标记为“experimental”。这些选项可以在 Java HotSpot
    命令行选项列表中通过使用 `-XX:+PrintFinal` 查看。


    '
