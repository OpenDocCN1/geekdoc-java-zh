    The concurrent marking tasks can take a long time if the application''s live object
    graph is long and often be interrupted by young collection pauses. The concurrent
    marking cycle must be complete before a mixed collection can start and is immediately
    followed by a young collection that calculates the thresholds required to trigger
    a mixed collection on the next pause, as shown in Figure 3.1. The figure shows
    an initial-mark pause (which, as mentioned, piggybacks on a young collection).
    There could be more than one young collection when the concurrent phase is under
    (only one pause is shown in the figure). The final mark (also known as remark)
    completes the marking, and a small cleanup pause helps with the cleanup tasks
    as described in Chapter 2. There is a young evacuation pause right after the cleanup
    pause which helps prepare for the mixed collection cycle. The four pauses after
    this young collection are the mixed collection evacuation pauses that successfully
    collect all the garbage out of the target CSet regions.


