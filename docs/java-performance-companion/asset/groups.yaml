    The effect of setting a lower value for -XX:SoftLRUPolicyMSPerMB is to provoke
    more aggressive clearing and reclamation of soft references, which leads to lower
    heap occupancy after GC events, or conversely, setting -XX:SoftLRUPolicyMSPerMB
    causes less aggressive soft reference clearing and reclamation, which leads to
    more live data and higher occupancy. Tuning -XX:SoftLRUPolicyMSPerMB may not actually
    lead to lower reference processing times and in fact increase them.


    The primary reason to use -XX:SoftLRUPolicyMSPerMB is to reduce the frequency
    of old generation collection events by reducing the amount of data in the heap.
    We recommend against the use of soft references as a means for implementing memory-sensitive
    object caches in Java applications doing so will increase the amount of live data
    and result in additional GC overheads. See the sidebar "Using Soft References"
    for more detail.'
