    # Garbage First Overview


    This chapter is an introduction to the Garbage First (or G1) garbage collector
    (GC) along with a historical perspective on the garbage collectors in the Java
    HotSpot Virtual Machine (VM), hereafter called just HotSpot, and the reasoning
    behind G1''s inclusion in HotSpot. The reader is assumed to be familiar with basic
    garbage collection concepts such as young generation, old generation, and compaction.
    Chapter 3, “JVM Overview,” of the book Java™ Performance [1] is a good source
    for learning about these concepts.


    Serial GC was the first collector introduced in HotSpot in 1999 as part of Java
    Development Kit (JDK) 1.3.1. The Parallel and Concurrent Mark Sweep collectors
    were introduced in 2002 as part of JDK 1.4.2. These three roughly correspond to
    the three most important GC cases: “minimize memory footprint, “maximize application
    throughput,” and “minimize GC-related pause times.” One might ask, “Why do we
    need new collector such as G1?” Before answering, let''s clarify some terminology
    that is often used when comparing and contrasting garbage collectors. We''ll move
    on to a brief overview of the four HotSpot garbage collectors, including G1, and
    identify how G1 differs from the others.


    # Terminology


    In this section, we define the terms parallel, stop-the-world, and concurrent.
    The term parallel means a multithreaded garbage collection operation. When a GC
    event activity is described as parallel, multiple threads are used to perform
    it. When a garbage'
  - '[PAGE 18]


    collector is described as parallel, it uses multiple threads to perform garbage
    collection.

    In the case of the HotSpot garbage collectors, almost all multithreaded GC operations
    are handled by internal Java VM (JVM) threads. One exception to this is the G1
    garbage collector, in which some background GC work can be taken on by the application
    threads. For more detail see Chapter 2, "Garbage First Garbage Collector in Depth,"
    and Chapter 3, "Garbage First Garbage Collector Performance Tuning."


    The stop-the-world means that all Java application threads are stopped during
    a GC event. A stop-the-world garbage collector is one that stops all Java application
    threads when it performs a garbage collection. A GC phase or event may be described
    as stop-the-world, which means during that particular GC phase or event all Java
    application threads are stopped.


    The concurrent means that garbage activity is occurring at the same time as the
    Java application is executing. A concurrent GC phase or event means that the GC
    phase or event executes may be described by any one or a combination of these
    three terms. For example, a parallel concurrent collector is multithreaded (the
    parallel part) and executes at the same time as the application (the concurrent
    part).


    # Parallel GC


    Parallel GC is a stop-the-world collector, which means that when a GC occurs,
    it stops all application threads and performs the GC work using multiple threads.
    The GC work can be done very efficiently without any interruptions. This is normally
    the best way to minimize the total time spent doing GC relative to application
    work. However, individual pauses of the Java application induced by GC can be
    fairly long.


    Both the young and old generation collections in Parallel GC are parallel and
    stop-the-world. Old generation collections perform compaction. Compaction moves
    objects together to eliminate wasted space between them, leading to an optimal
    heap layout. However, compaction may take a considerable amount of time, which
    is generally a function of the size of the Java heap and the number and size of
    live objects in the old generation.


    At the time Parallel GC was introduced in HotSpot, only the young generation used
    a parallel stop-the-world collector. Old generation collections used a single-threaded
    stop-the-world collector. When Parallel GC was first introduced, the HotSpot command-line
    option that enabled Parallel GC in this configuration was -XX:+ParallelGC.


    At the time when Parallel GC was introduced, the most common use case for servers
    required throughput optimization, and Parallel GC became the default collector
    for the HotSpot Server VM. Additionally, the size of most Java heaps tended to
    be between 512MB and 2GB, which keeps Parallel GC pause times'
  - "[PAGE 19]\n\n# Parallel GC\n\nrelatively low, even for single-threaded stop-the-world\
    \ collections. Also at the time, latency requirements tended to be more relaxed\
    \ than they are. Common for Web applications to tolerate GC-induced latencies\
    \ in excess of one second, and as much as three to five seconds.\n\nAs Java heaps\
    \ sizes the number and size of live objects in old generation grew, the time to\
    \ collect the old generation became longer and longer. At the same time, hardware\
    \ advances made more hardware threads available. As a result, Parallel GC was\
    \ enhanced by using a multithreaded old collector to be used by a multithreaded\
    \ young collector. This enhanced Parallel GC reduced the time required to collect\
    \ and compact the heap.\n\nThe enhanced Parallel GC was delivered in a Java 6\
    \ update release. It was enabled by a new command-line option called -XX:+UseParallelGC.\
    \ When -XX:+UseParallelGC is enabled, parallel young collection is also enabled.\
    \ This is what we think of today as Parallel GC in HotSpot, multithreaded stop-the-world\
    \ young generation collector combined with a multithreaded stop-the-world old\
    \ generation collector.\n\n> In Java 7 update release 4 (also referred to Java\
    \ 7u4, or JDK 7u4), -XX:+UseParallelGC was the default GC and the normal mode\
    \ of operations for Parallel GC. As of Java 7u4, specifying -XX:+UseParallelGC\
    \ also enables -XX:-UseParallelGC, and likewise specifying -XX:+UseParallelGC\n\
    \nParallel GC is a good choice in the following cases:\n\n+   1. Application throughput\
    \ requirements are much more important than latency requirements.\nA batch processing\
    \ is a good example since it is noninteractive. When you start a batch execution,\
    \ you expect it to run to completion as fast as possible.\n2. If worst-case application\
    \ latency requirements can be met, Parallel GC will offer the best throughput.\
    \ Worst-case latency requirements include both worst-case pause times, and also\
    \ how frequently the pauses occur. For example, an application may have a latency\
    \ requirement of “pauses” that exceed 500ms shall not occur more than once every\
    \ two hours, and all pauses shall not exceed three seconds.\n interactive application\
    \ with a sufficiently small live data size that a Parallel GC’s full GC event\
    \ is able to meet or beat worst-case GC-induced latency requirements for the application\
    \ is a good example that fits this use. However, since the amount of live data\
    \ to be highly correlated with the size of the Java heap, the types of applications\
    \ falling into this category are limited."
