  - '[PAGE 85]


    # SA Components


    The SA consists mostly of Java classes, but it also contains a small amount of
    native code to read raw bits from the processes and the core files:


    +   - On Solaris, SA uses libproc to read bits from a process or a core file.

    - On Linux, SA uses a mix of /proc and ptrace (mostly the latter) to read bits
    from a process. For core files, SA parses Executable and Linkable Format (ELF)
    files directly.

    - On Windows, SA uses the Windows Debugger interface (dbgeng.dll library) to read
    the raw bits from the processes and core files.


    # SA Binaries in the JDK


    There are two binaries present in the JDK that make up the SA. These binaries
    are shipped with the JDK:


    +   - sa-jdi.jar

    - sawindbg.dll on Windows, libsaproc.so on Solaris/Linux


    SA components are built as part of the standard build of the HotSpot repository.
    The native code component of SA is placed in libsaproc.so or sawindbg.dll, and
    the Java classes are placed in sa-jdi.jar.


    The binary sa-jdi.jar provides the SA Java APIs and also includes useful debugging
    tools implemented using these APIs. It also includes an implementation of the
    Java Debug Interface (JDI), which allows JDI clients to read-only debugging on
    core files and hung processes.


    # JDK Versions with Complete SA Binaries


    SA binaries are shipped with the following JDK releases:


    +   - JDK 7, and later releases on all platforms

    - JDK 6u17+ on Solaris and Linux

    - JDK 6u31+ on Windows'
  - "[PAGE 86]\n\nPrior to these versions, the SA was not shipped with the JDK on\
    \ Windows, and only a subset of SA classes was shipped with JDKs on Solaris and\
    \ Linux. The JDK versions listed made the complete set of SA classes available\
    \ on all of these platforms.\n\n# How the SA Understands HotSpot VM Data Structures\n\
    \nThere is a file src/class/vm/runtime/vmStructs.cpp in the HotSpot source base\
    \ that defines a VMStructs class that contains declarations of each HotSpot class\
    \ and its fields, as well as the declarations of the processor-dependent items\
    \ such as registers, sizeof types, and so on. The SA understands the Java objects\
    \ and HotSpot data structures with the help of the declarations in this file.\n\
    \nAs an example, in the file src/share/vm/oop/cpCacheOop.hpp we have the following:\n\
    \n```\n: constantPoolCacheOopDesc: public arrayOopDesc {\n  friend class VMStructs;\n\
    \  private:\n    // the corresponding constant pool\n    constantPoolOop_constant_pool;\n\
    };\n```\n\nIn vmStructs.cpp, the _constant_pool field is declared as\n\n```\n\
    nonstatic_field(constantPoolCacheOopDesc, _constant_pool,\nconstantPoolOop);\n\
    ```\n\nFrom the _constant_pool field in the file vmStructs.cpp, the SA knows there\
    \ is a class named constantPoolCacheOopDesc that has a field with the name _constant_pool\
    \ of type constantPoolOop in the Java HotSpot VM.\n\n# HotSpot Data Structure\
    \ Definitions\n\nThere are a couple of noteworthy definitions to explain here.\
    \ A constant pool is a table of structures representing various numeric and string\
    \ constants, and interface names, field names, and other constants that are referred\
    \ to within the class and its subclasses, and an oop (ordinary object pointer)\
    \ is a memory address pointing to an instance of an internal HotSpot data structure\
    \ that represents a Java object."
  - '[PAGE 87]


    # SA Version Matching


    Note that VMStructs is declared as a friend class. Most of the classes in HotSpot
    declare VMStructs to be a friend so that the private fields of that class can
    be accessed in VMStructs.


    During the HotSpot build, vmStructs.cpp is compiled into vmStructs.o, which is
    included in the shared library libjvm.so or jvm.dll. VMStructs data contains all
    the data that the SA needs to read the HotSpot data representations. At runtime,
    the SA can read this data from the target VM.


    The structure and field names declared in vmStructs.cpp are used by the corresponding
    Java code in the SA. Thus, if a field name in VMStructs.cpp is deleted or renamed,
    the corresponding Java code that accesses that field also needs to be modified.
    If declarations in VMStructs and the Java code in SA are not in sync, the SA will
    fail when it tries to examine a process/core file.


    # SA Version Matching


    As we saw in the previous section, the Java code in SA is a mirror of the C++
    code in HotSpot. If some data structures or algorithms are changed, added, or
    removed in HotSpot, the same changes have to be made in the SA Java code. Due
    to this tight coupling between the SA Java code and the HotSpot implementation,
    an instance can reliably debug only the VM that was built from the same repository
    as that of the SA instance. In order to detect the version mismatch between the
    SA and the HotSpot, we place a file name sa.properties into sa-ji.jar during the
    HotSpot build process. This file contains an SA version property, for example:


    ```

    sun.jvm.hotspot.runtime.VM.saBuildVersion=24.0-b56

    ```


    At runtime, SA reads this property, compares it with the version of the target
    HotSpot VM and throws a VersionMismatchException if the versions do not match.
    This check can be disabled by running the SA tools with the following system property:


    ```

    -Dsun.jvm.hotspot.runtime.VM.disableVersionCheck

    ```


    With this option, SA does not complain if its version does not match the version
    of the target VM and attempts to attach to it. This option is useful if you want
    to attach the SA to a non-matching version of the target HotSpot VM.'
  - '[PAGE 88]


    # The Serviceability Agent debugging Debugging Tools


    There are two main SA Debugger tools that are implemented using the Serviceability
    Agent APIs: HotSpot Debugger (HSDB) and Command-Line HotSpot Debugger (CLHSDB).
    HSDB is the top-level GUI program offering many visual utilities in helping debugging
    the HotSpot VM. CLHSDB is the command-line variant of HSDB. When debugging remote
    dumps, it is easier to work with the command-line HSDB than with the GUI HSDB
    tool.


    # HSDB


    HotSpot Debugger is the main GUI. It facilitates examining a Java process, core
    file, and a remote Java process. Let''s see how we can launch and use it on a
    Windows machine.


    First, let''s set the JAVA_HOME environment variable to define the folder where
    the JDK that we want to use is installed so that we can use this variable wherever
    we need to access files/folders in that JDK:


    ```

    set JAVA_HOME=d:\Java\740

    ```


    On Windows, the PATH environment variable should contain the location of the JVM
    binary used by the target process/core and also the folder where Microsoft Debugging
    Tools for Windows is installed on the machine, for example:


    ```

    set PATH=%JAVA_HOME%\bin;server:d:\windbg;%PATH%

    ```


    Now we can launch HSDB using the following command:


    ```

    %JAVA_HOME%\bin\java -classpath%JAVA_HOME%\lib\sa-jdi.jar sun.jvm.hotspot.HSDB

    ```


    On Solaris and Linux, we just need to set JAVA_HOME to point to the installed
    JDK and then launch the tool in the following:


    ```

    JAVA_HOME/bin/java -classpath $JAVA_HOME/lib/sa-jdi.jar sun.jvm.hotspot.HSDB

    ```


    These launch commands bring up the HSDB GUI tool as shown in Figure 4.1.'
  - "[PAGE 89]\n\n# The Serviceability Agent Debugging Tools\n\n![](img/b3ae442318f4d873d1d076953179a125_89_0.png)\n\
    \nBeginning with JDK 9, there are two different ways to launch HSDB. For instance,\
    \ there is an example of how to launch the SA with JDK 9:\n\n```\nset PATH=d:\\\
    Java\\jdk9-b102\\bin;%PATH%\njava sun.jvm.hotspot.HSDB\n```\n\nThis brings up\
    \ HSDB.\nJDK 9 also contains a jhsdb executable in JDK 9's bin directory that\
    \ can be used to launch various SA tools. For example:\n\n```\nset PATH=d:\\Java\\\
    jdk9-b102\\bin;%PATH%\njhsdb.exe\njhsdb                command line debugger\n\
    \                              ui debugger\njjstack --help        to get more\
    \ information\njjmap --help          to get more information\njjinfo --help  \
    \        to get more information\n```\n\njhsdb.exe with no arguments offers help\
    \ by showing additional arguments that can be passed to jhsdb to launch various\
    \ SA tools. For example:\n\n```\njhsdb hsdb\n```\n\nThis brings up the HSDB GUI\
    \ debugger."
  - '[PAGE 90]


    The following will start the command-line debugger:


    ```

    jhsdb.exe clhsdb

    jhsdb>

    ```


    And the following shows how to start the jstack tool with additional options that
    can be passed to the jstack tool:


    ```

    jhsdb.exe jstack

    --locks      to print java.util.concurrent locks

    --mixed      to print both java and native frames (mixed mode)

    --exe        executable image name

    --core       path to coredump

    --pid        pid of process to attach

    ```


    # Serviceability Agent Debugging Modes


    There are three ways in which the HSDB can attach to the target HotSpot VM:


    +   - Attach to a local HotSpot process

    - Attach to a core file

    - Attach to a remote debug server


    # Attach to a HotSpot Process


    HSDB provides a facility to attach to a running Java process. Click File >Attach
    to HotSpot process and it brings up a dialog box that asks for the ID of the process
    to which we want to attach the SA, as shown in Figure 4.2.


    After typing the process ID, click OK and SA gets attached to the process. The
    process is paused at this point and remains paused as long as SA is attached to
    it. Recall SA is a snapshot debugger and provides a snapshot view of the process
    at the point in time it is attached to the process. Figure 4.3 shows the HSDB
    main window after the SA gets attached to the process.


    After analyzing the process, when we detach SA from the process, the process resumes
    its execution normally. The action of detaching the SA from the process is shown
    in Figure 4.4.'
