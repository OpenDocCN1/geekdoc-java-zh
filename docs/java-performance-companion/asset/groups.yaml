    # 161

    # 附录


    ## 感兴趣的额外 HotSpot VM 命令行选项


    本附录列出了对于 G1 GC 的使用或调优可能感兴趣的 HotSpot VM 命令行选项。它还包含了一些未包含或未记录的命令行选项。对于列出的每个命令行选项，都有关于该选项作用的描述，以及在何时适当考虑使用它。使用命令行选项的通用建议是，首先应该有一个使用该选项的理由，而不仅仅是因为别人用过它，或者在某篇博客文章中看到有人使用了它。您应该在使用命令行选项运行
    Java 应用程序时收集性能数据，作为支持使用该选项的依据。


    HotSpot VM 命令行选项有两种形式。首先，有些是本质上是布尔值的命令行选项，通过在命令行名称前加上 "+" 或 "-" 字符来开启或关闭，例如 -XX:+PrintSizePolicy，它使用了
    "+" 字符来启用 PrintSizePolicy。同样，-XX:-PrintSizePolicy 则关闭该选项。


    第二种形式的 HotSpot VM 命令行选项接受数值或一组特定的关键字。本附录不包含任何后者的命令行选项。接受数值的前者形式不使用 "+" 或 "-" 字符。例如，-XX:ConcGCThreads=6
    是一个期望数值的命令行选项。


    本文中提及的给定 HotSpot VM 选项的默认值基于 JDK 8 的默认值。因此，在某些情况下，选项的默认值可能与本文所述的不符。默认值的更改通常是因为有关该选项的其他信息。


    ### -XX:+UseG1GC


    启用 G1 垃圾器。要在 Java 7 和 Java 8 中使用 G1，必须通过此命令行选项显式启用。截至本文编写，计划在 Java 9 中引入 G1，尽管可能会回归
    Parallel GC。


    ### -XX:ConcGCThreads


    设置 GC 在与 Java 应用程序并发运行时使用的线程数。默认情况下，这大约是停止 Java 线程执行 GC 时线程数的四分之一。-XX:ConcGCThreads
    可以减少 GC 线程与 Java 资源的竞争，从而提高性能。并发线程过少可能会导致并发周期回收内存的速度不够。


    ### -XX:G1HeapRegionSize


    设置 G1 堆区域的大小。默认情况下这约为堆大小的 1/2000。可能的区域大小有 1M、2M、4M、8M、16M 和 32M。


    大于区域大小的对象需要 G1 特别管理。增加区域大小允许大对象通过普通分配路径分配，如果此类大对象很常见，可能会提高性能。然而，较大的区域意味着 G1 在进行工程学决策时（例如决定分代的大小）的灵活性会降低。


    ### -XX:G1HeapWastePercent


    控制 G1 不回收的允许空闲内存量。此值的默认值为 5%。


    G1 将收集所有区域，直到任何区域释放的内存都少于 -XX:G1HeapWastePercent 为止。特别是在大堆上，使用较低的值可能是有意义的。'
