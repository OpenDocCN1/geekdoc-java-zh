    通过复制实现紧凑，并具有并行的多阶段并发标记，这有助于将标记（mark）、重标记（remark）和清理（cleanup）停顿减少到最低。


    随着 G1 GC 的引入，HotSpot JVM 从传统的连续代际布局，转变为现在由不连续的堆区域组成的代际。对于一个活跃的 Java 堆，特定的区域可以是
    Eden 区、存活区（survivor）或老年代的一部分，也可以是一个巨型区域（humongous），甚至仅仅是一个空闲区域。这些区域的倍数形成了一个“逻辑”代际，以匹配以前
    HotSpot 垃圾回收器中代际空间的传统概念。


    ## G1 中的垃圾回收


    G1 GC 在收集停顿期间回收其大部分的堆区域。唯一的例外是多阶段并发标记周期中的清理（cleanup）阶段。在清理阶段中，如果 G1 GC 遇到完全填充垃圾的区域，它可以立即回收这些区域并将其返回空闲区域列表；因此，释放这些区域不需要等待下一次垃圾回收停顿。


    G1 GC 有三种主要的垃圾回收周期：年轻代回收周期（young collection）、多阶段并发标记周期和混合回收周期（mixed collection
    cycle）。此外，有一种单线程（截至本文编写时）回退停顿称为“全量”垃圾回收停顿，这是 G1 GC 在发生区域移动失败（evacuation failures）时的安全保障机制。


    > 提示

    > 移动失败也称为提升失败（promotion failure）、目标空间耗尽（to-space exhaustion）或目标溢出（to-overflow）。这种失败通常发生在没有可用空间来提升对象时。当面对这种情况时，所有的
    Java HotSpot GC 都会尝试扩展它们的堆内存。如果堆已经达到最大值，GC 将尝试回收已成功复制对象的区域并更新它们的引用。对于 G1 GC，那些无法在原地复制的对象，所有
    GC 都将对它们的引用进行自转发（self-forwarded）。这些自转发引用会在垃圾回收周期结束时被移除。


    在年轻代回收期间，G1 GC 会暂停应用程序线程，将对象从年轻代区域移动到存活区域，或将其提升到老年代区域或两者兼顾。在混合回收中，G1 GC 额外将存活对象从最（缺乏更好的术语）“高效”的老年代区域移动到空闲区域，这些区域将成为老年代的一部分。


    ## 年轻代


    > 提示

    > “GC 效率”实际上是指待回收空间与收集该区域的预估成本之间的比例。由于缺乏更好的术语，在本书中，我们将通过对堆区域进行排序以识别候选区域的过程称为计算“GC
    效率”。使用相同术语的原因是，GC 效率评估了收集一个区域的收益相对于其收集成本的大小。而我们所指的“效率”完全取决于存活情况计数，因此仅仅是收集一个区域的成本。例如，一个老年代区域的收集时间比其他更昂贵的老年代区域短，则被认为是“高效”区域。效率最高的区域将是排序后区域数组中的第一个。


    在收集周期结束时，属于收集集（Collection Sets，简称 CSet，更多信息请参阅本章稍后的“收集集及其重要性”章节）的区域被保证是空闲的并返回空闲列表。让我们详细讨论这些概念。


    G1 GC 是一种分代的 GC GC，由年轻代和老年代组成。大多数分配都会落在该线程的 TLAB 中，极少数例外，例如对象大到无法放入分配线程的分配缓冲区（也称为
    TLAB），但又小于被认为“巨型”，当然还有“巨型”对象本身（更多信息请参阅“巨型区域”章节）。TLAB 允许更快的分配，因为拥有线程能够以无锁的方式进行分配。这些
    TLAB 来自于成为年轻代一部分的 G1 区域。除非在命令行上显式指定，否则当前的年轻代大小是根据初始和最大代大小边界计算的（JDK 默认值为：初始年轻代大小为总
    Java 堆的 5% (`-XX:G1NewSizePercent`) 最大年轻代大小为总 Java 堆的 60% (`-XX:G1MaxSizePercent`)
    以及分配停顿时间 (`-XX:MaxCPauseMillis`)）。


    > 提示

    > 如果命令行上没有设置 -XX:MaxCPauseMillis，G1 GC 将默认选择为 200ms。如果用户设置了 -Xmn 或相关的年轻代选项（如 -XX:NewRatio），G1
    GC 可能无法根据停顿时间目标调整年轻代大小，停顿时间目标可能会变得无效。


    ## 第 2 章 · 深度解析垃圾回收器


    根据 Java 应用程序的分配速率，新区域被添加到年轻代中，直到达到所需尺寸。堆区域的大小在 JVM 启动时确定。堆区域的大小必须是 2 的幂，范围从 1MB
    到 32MB 不等。JVM 的目标是大约 2048 个区域并据此设置堆区域大小（堆大小 = 堆大小/2048）。堆区域的大小在 1MB 到 32MB 之间调整，以适应堆大小的设置。如果堆已经达到最大值，GC
    将尝试回收已成功复制对象的区域并更新其引用。对于 G1 GC，年轻代的大小是根据堆区域的调整来设置。


    ### 年轻代回收


    在年轻代回收期间，G1 GC 暂停应用程序线程，将对象从年轻代区域移动到存活区域，或将其提升到老年代区域或两者兼顾。在混合回收期间，G1 GC 移动存活对象从
    Eden 区到存活区，或者提升到老年代区域。


    ## G1 垃圾回收指标


    | 指标 | 值 |

    | :--- | :--- |

    | 移动停顿（年轻代） | 15.894 ms |

    | 并行时间 | 9.8 ms |

    | 根修复 | 0.1 ms |

    | 清理 | 0.0 ms |

    | CT | 0.2 ms |

    | 其他 | 4.9 ms |

    | Eden | 695.0M -> 104.0M |

    | 存活区 | 10.0M -> 13.0M |

    | 堆 | 748.5M (1176.0M) -> 57.0M (1760.0M) |

    | 时间 | user=0.08s, sys=0.0s, real=0.01s |


    年轻代的新尺寸通过将 Eden 加上存活区的大小计算得出（例如：1043M+13M=1056M）。


    ## 对象年龄与老年代


    正如在前节“年轻代回收停顿”中简述过的，在每次年轻代回收期间，G1 为每个对象维护年龄。特定对象经历的年轻代回收总数就是该对象的“年龄”。GC 在一个名为“年龄表”的表中维护年龄信息，以及已提升到年龄的对象的总大小。根据年龄、存活区大小、存活填充容量（由
    -XX:TargetSurvivorRatio 决定，默认值为50）以及 -XX:MaxTenuringThreshold（值为15），JVM 自适应地设置一个阈值。一旦对象超过此阈值，它们就会提升/老化到老年代区域。当这些老化对象在老年代死亡时，它们的空间可以通过混合回收释放，或者在清理期间释放（但仅当整个区域被回收时），或者作为最后手段通过全量垃圾回收释放。


    ## 巨型区域


    对于 GC 来说，收集的单位是区域。因此，堆区域的大小 (-XX:GHeapRegionSize）是一个重要参数，因为它决定了什么尺寸的对象放入区域。堆区域的大小还决定了哪些对象被定义为“巨型”。巨型对象是跨越
    G1 GC 区域 50% 或更多的大对象。这种对象不遵循通常的分配路径，而是直接分配在标记为巨型区域的老年代中。


