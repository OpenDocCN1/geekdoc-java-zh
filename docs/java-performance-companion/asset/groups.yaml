    \ 直接解析可执行和可链接格式（ELF）文件。\n- 在 Windows 上，SA 使用 Windows 调试器接口（`dbgeng.dll` 库）从进程和核心文件中读取原始位。\n\
    \n# JDK 中的 SA 二进制文件\n\nJDK 中存在两个组成 SA 的二进制文件。这些二进制文件随 JDK 一起发布：\n\n- sa-jdi.jar\n\
    - Windows上的 `sawindbg.dll`，Solaris/Linux 下 `libsaproc.so`\n\nSA 组件作为 HotSpot 仓库标准构建的一部分进行构建。SA\
    \ 的原生代码组件放置在 `libsaproc.so` 或 `sawindbg.dll` 中，Java 类放置在 `sa-jdi.jar` 中。\n\n二进制文件\
    \ `sa-jdi.jar`  SA 的 Java API，并包含了使用这些 API 实现的实用调试工具。它还包含 Java 调试接口（JDI）的实现，允许\
    \ JDI 客户端对核心文件和挂起的进程进行只读调试。\n\n# 带有完整 SA 二进制文件的 JDK 版本\n\nSA 二进制文件随以下 JDK 版本发布：\n\
    \n- 所有平台上的 JDK 7 及后续版本\n- Solaris 和 Linux 上的 JDK 6u17+\n- Windows 上的 JDK 6u31+\n\
    \n在这些版本之前，Windows 上的 JDK 并不附带 SA，且 Solaris 和 Linux 上的 JDK 仅附带部分 SA 类。列出的 JDK 版本在所有这些平台上都提供了完整的\
    \ SA 类集。\n\n# SA 如何理解 HotSpot VM 数据结构\n\nHotSpot 源码库中有一个文件 `src/class/vm/runtime/vmStructs.cpp`，该文件定义了一个\
    \ `VMStructs` 类，该类包含了每个 HotSpot 类及其字段的声明，以及与处理器相关的相关的项（如寄存器、`sizeof` 类型等）的声明。SA\
    \ 借助该文件中的声明来理解 Java 对象和 HotSpot 数据结构。\n\n例如，在文件 `src/share/vm/oop/cpCacheOop.hpp`\
    \ 中，我们看到如下：\n\n```cpp\n: constantPoolCacheOopDesc: public arrayOopDesc {\n  friend\
    \ class VMStructs;\n  private:\n    // 对应的常量池\n    constantPoolOop_constant_pool;\n\
    };\n```\n\n在 `vmStructs.cpp` 中，`_constant_pool` 字段声明为：\n\n```cpp\nnonstatic_field(constantPoolCacheOopDesc,\
    \ _constant_pool, constantPoolOop);\n```\n\n通过 `vmStructs.cpp` 文件中的 `_constant_pool`\
    \ 字段，SA 知道 Java HotSpot VM 中有一个名为 `constantPoolCacheOopDesc` 的类，该类有一个名为 `_constant_pool`\
    \ 类型为 `constantPoolOop` 的字段。\n\n# HotSpot 数据结构定义\n\n这里有两个值得注意的定义。常量池是一个结构表，表示各种数值和字符串常量、接口名称、字段名称以及在类及其子类中引用的其他常量；而\
    \ `oop`（普通对象指针）是一个指向内部 HotSpot 数据结构实例的内存地址，该实例代表一个 Java 对象。\n\n# SA 版本匹配\n\n注意\
    \ `VMStructs` 被声明为友元类（friend class）。HotSpot 中的大多数类都声明 `VMStructs` 为友元，以便在 `VMStructs`\
    \ 中访问该类的私有字段。\n\n在 HotSpot 构建质期间，`vmStructs.cpp` 被编译为 `vmStructs.o`，并被包含在共享库 `libjvm.so`\
    \ 或 `jvm.dll` 中。`VMStructs` 数据包含了 SA 读取 HotSpot 表示所需的所有数据。在运行时，SA 可以从目标 VM 读取这些数据。\n\
    \n`vmStructs.cpp` 中声明的结构和字段名被 SA 中对应的 Java 代码使用。因此，如果 `vmStructs.cpp` 中的字段名被删除或重命名，访问该字段的相应\
    \ Java 代码也需要修改。如果 `VMStructs` 中的声明与 SA 中的 Java 代码不同步，SA 在尝试检查进程/核心文件时将失败。\n\n\
    # SA 版本匹配\n\n正如我们在上一节看到的，SA 中的 Java 代码是 HotSpot 中 C++ 代码的镜像。如果 HotSpot 中的某些数据结构或算法发生了更改、添加或删除，则必须在\
    \ SA Java 代码中进行相同的更改。由于 SA Java 代码与 HotSpot 实现之间存在紧密耦合，实例只能可靠地调试从与该 SA 实例相同的仓库中构建的\
    \ VM。为了检测 SA 与 HotSpot 之间的版本不匹配，我们在 HotSpot 构建过程中将名为 `sa.properties` 的文件放入 `sa-jdi.jar`\
    \ 中。该文件包含一个 SA 版本属性，例如：\n\n```\nsun.jvm.hotspot.runtime.VM.saBuildVersion=24.0-b56\n\
    ```\n\n在运行时，SA 读取此属性，并与目标 HotSpot VM 的版本进行比较，如果版本不匹配，则抛出 `VersionMismatchException`。可以通过在运行\
    \ SA 工具时使用以下系统属性禁用此检查：\n\n```\n-Dsun.jvm.hotspot.runtime.VM.disableVersionCheck\n\
    ```\n\n使用此选项，如果 SA 的版本与目标 HotSpot 版本不匹配，SA 将不会报错。\n\n# 可维护性代理（Serviceability Agent）调试工具\n\
    \n可维护性代理有两个主要工具：HSDB（图形）和 CLHSDB（命令行）。HSDB 提供图形化界面，而 CLHSDB 是命令行版本。\n\n**DB 提供了挂载到运行\
    \ Java 进程的功能。从开始，HSDB 有三种方式挂载到目标 HotSpot VM：\n\n- 挂载到本地 HotSpot 进程\n- 挂载到核心文件\n\
    - 挂载到远程调试服务器\n\n# 挂载到 HotSpot 进程\n\nHSDB 提供了挂载到运行 Java 进程的功能。点击 File > Attach\
    \ to HotSpot process 会弹出一个对话框，要求输入挂载 SA 的进程 ID，如图 4.2 所示。\n\n输入进程 ID 后，点击 OK，SA\
    \ 就会挂载到该进程。此时进程会被暂停，只要 SA 仍挂载在其上，进程就会保持暂停。请记住，SA 是一个快照调试器，它提供挂载时间点的进程快照视图。图 4.3\
    \ 显示了 SA 挂载到进程后 HSDB 的主窗口。\n\n分析进程后，当我们从进程中卸载 SA 时，进程将恢复执行。从进程中卸载 SA 的操作如图 4.4\
    \ 所示。\n\n"
