    ### 计算反向指针 (Compute Reverse Pointers)


    此实用程序计算从 GC 根节点到达该对象的引用路径——即保持该对象在 Java 堆中存活的引用路径。一旦计算出反向指针，Object Inspector 窗口中对应对象的
    <<Reverse pointers>> 字段就会显示该对象可达的反向指针，如图 4.22 所示。


