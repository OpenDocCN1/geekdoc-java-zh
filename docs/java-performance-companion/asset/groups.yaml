    # 第 2 章 · 深度解析 Garbage First Collector


    因此，每个混合回收周期中的混合回收次数可以通过每次混合回收暂停的最小年代集合（CSet）数量以及堆百分比来控制。


    ## 集合（Collection Sets）及其重要性


    在任何垃圾回收暂停期间，CSet 中的所有区域都会被释放。CSet 是在垃圾回收暂停期间目标为待回收的区域集合。这些候选区域中的所有活跃对象都将在回收期间被迁移，并且这些区域将返回空闲区域列表。在回收期间，CSet
    仅包含用于回收的年轻代区域。另一方面，混合回收不仅会将所有年轻代区域加入其 CSet，还会根据其 GC 效率加入一些老年代的候选区域。


    有两个重要的参数有助于选择混合回收的候选年代区域：

    - -XX:GMixedGCLiveThresholdPercent

    - -XX:OldCSetThresholdPercent.

    - -XX:GMixedGCLiveThresholdPercent，默认值为 G1 区域的 85%（JDK 8u5），它是一个存活阈值和一个设定限制，用于从混合回收的
    CSet 中排除最昂贵的老年代区域。G1 GC 设置了一个限制，任何低于此存活阈值的老年代区域都会包含在 CSet 中。

    - -XX:OldCSetThresholdPercent，默认值为总 Java 堆的 10%（JDK 8u45），设定了每次混合回收暂停期间可以回收的老年代区域的最大限制。该阈值取决于
    JVM 进程可用的总 Java 堆，并以总 Java 堆百分比的形式表示。第3 章将涵盖几个示例来突出这些阈值的功能。


    ## 记忆集（Remembered Sets）及其重要性


    分代收集器根据对象的年龄将堆划分为不同的区域。堆中的这些不同区域被称为年代。分代收集器可以将大部分回收精力集中在最近分配的对象上，因为它预计会更早地发现它们中的大多数对象。堆中的这些年代可以独立地进行回收。独立回收有助于降低响应时间，因为
    GC 不需要扫描整个堆，而且（例如在拷贝式分代收集器的情况下）较旧的长寿对象不需要来回复制，从而减少了复制和引用更新的开销。


    为了方便进行独立回收，许多垃圾收集器为它们的区域维护 RSet。RSet 是一种数据结构，有助于维护和跟踪进入其自身收集单元（在 G1 中为区域）的引用，消除了扫描整个堆以获取此类信息的需求。当
    GC 执行停顿（stop-the-world）收集（年轻或混合）时，它会扫描其 CSet 中包含的区域的 RSet。一旦区域内的活跃对象移动，它们的入引用就会被更新。


    对于 GC，在任何年轻或混合回收期间，年轻代都会被整体回收，不需要跟踪对象位于年轻代的引用。这减少了 RSet 的开销。因此，GC 只需要在以下两种场景下维护
    RSet：


    - 老年代到年轻代的引用——GC 维护从老年代区域指向年轻代区域的指针。年轻代被认为“拥有”该 RSet，因此该区域被认为是 RSet “所有”区域。

    - 老年代到老年代的引用——在这里，来自老年代不同区域的指针将维护在“所有”老年代区域的 RSet 中。


    在图 2.3 中，我们可以看到一个年轻区域（Region x）和两个老年代区域（Region y 和 Region z）。Region z 有一个入引用。该引用记录在
    Region x 的 RSet 中。我们还观察到 Region z 有两个入引用，一个来自 Region x，另一个来自 Region y。Region z
    的 RSet 只需要记录来自 Region y 的入引用，不需要记住来自 Region x 的引用，如之前所述，年轻代总是被整体回收的。最后，对于 Region
    y，我们看到一个来自 Region x 的入引用，该引用没有记录在 Region z 的 RSet 中，因为 Region x 是一个年轻区域。


    如图 2.3 所示，每个区域只有一个 RSet。根据应用程序的不同，某个特定区域（以及其 RSet）可能是“热门”的，以至于在同一区域内甚至同一位置上可能会发生更新。这在
    Java 应用中并不罕见。


    GC 有其处理热点需求的方法；通过改变 RSet 的密度来实现。RSet 的密度遵循三个粒度级别：稀疏（sparse）、精细（fine）和粗粒（coarse）。对于热门区域，RSet
    将粗化以容纳来自其他区域的指针。这将反映在区域的 RSet 扫描时间上。（有关 RSet 扫描时间的更多细节请参阅第 3 章。）每个粒度级别都有一个针对特定区域的区域表（PRT）抽象容器。


