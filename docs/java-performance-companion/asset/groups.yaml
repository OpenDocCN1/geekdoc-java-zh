  mdcn: "\n\n# 第 4 章 可用性代理 (Serviceability Agent)\n\n| 系统属性 | 备注 | 适用平台 |\n| :---\
    \ | :--- | :--- |\n| sun.jvm.hotspot.loadLibrary.DEBUG | 启用在 Windows 平台上打印关于原生库加载的调试信息\
    \ | Windows |\n| sun.jvm.hotspot.tools.jcore.filter | 指定想要从目标虚拟机（VM）中转储（dump）的类名\
    \ | 所有 |\n| sun.jvm.hotspot.tools.jcore.PackageFilter.pkgList | 指定一个用逗号分隔的包列表，我们将从目标\
    \ VM 中转储这些包中的类 | 所有 |\n| sun.jvm.hotspot.tools.jcore.outputDir | 指定从目标 VM 转储类文件的输出目录\
    \ | 所有 |\n\n## 可用性代理的环境变量\n\n可以通过设置环境变量来定义 SA 工具的运行时行为。详见表 4.3。\n\n| 环境变量 | 备注\
    \ | 适用平台 |\n| :--- | :--- | :--- |\n| SA_ALTROOT | 在调试器宿主机上打开传输的转储文件时，设置 SA 查找共享库的目录位置\
    \ | Solaris 和 Linux |\n| LIBSPROC_DEBUG | 启用将 SA 原生库 libsaproc.so 的调试信息打印到标准错误。Solaris\
    \ 上的 SA 使用 libproc.so 库。该库也通过环境变量 LIBSPROC_DEBUG 打印调试信息。设置 LIBSPROC_DEBUG 也会设置该变量。\
    \ | Solaris 和 Linux |\n| SA_IGNORE_THREAD | 打开传输的转储文件时，如果由于此环境变量中的库不匹配导致出现 `libthread_db_relative`\
    \ 错误。使用此项后，SA 将忽略 libthread_db 错误并成功打开转储文件，但无法获取任何与线程相关的信息 | Solaris 和 Linux |\n\
    \n## JDI 实现\n\nSA 二进制文件 `sa-jdi.jar` 包含了 Java 调试接口 (JDI) 的实现，使得任何 JDI 客户端（例如 JDB）能够通过该实现提供的\
    \ JDI 连接器附加到转储文件以及 Java 进程。\n\n由这些连接器的 `attach()` 方法返回的 VM 对象是只读的。这意味着 VM 对象不能被修改。因此，使用这些连接器的\
    \ JDI  客户端不应调用任何定义为抛出 `VMCannotBeModifiedException` 的 JDI 方法。\n\n## SA 核心附加连接器\
    \ (SA Core Attaching Connector)\n\n该连接器可供调试应用程序调试转储文件。它允许在同一个转储文件上进行多个调试会话。它通过名称\
    \ `sun.jvm.hotspot.jdi.SACoreAttachingConnector` 唯一标识，用法如下：\n\n```\n$JAVA_HOME/bin/jdb\n\
    -Xbootclasspath/a:$JAVA_HOME/lib/sa-jdi.jar:$JAVA_HOME/lib/tools.jar\n-connect\
    \ sun.jvm.hotspot.jdi.SACoreAttachingConnector:core=\n$(CORE_FILE),javaExecutable=$(EXE_FILE)\n\
    ```\n\n## SAPID 附加连接器 (SAPID Attaching Connector)\n\n该连接器可供调试应用程序调试进程。需要调试的进程无需以调试模式启动（即无需使用\
    \ `-agentlib:jdwp=-Xdwp`），且允许进程挂起。使用此连接器，调试器将获得进程的只读视图，附加进程后获得的 VM 对象无法被修改。\n\n\
    当连接器附加时，进程会被挂起，当连接器断开时会恢复。多个 SAPID 附加连接器不能同时附加到同一个进程。该连接器通过名称 `sun.jvm.hotspot.jdi.SAPIDAttachingConnector`\
    \ 唯一标识。\n\n调试器可以使用以下方式连接并调试进程：\n\n```\n$JAVA_HOME/bin/jdb\n-Xbootclasspath/a:$JAVA_HOME/lib/sa-jdi.jar:$JAVA_HOME/lib/tools.jar\n\
    -connect sun.jvm.hotspot.jdi.SAPIDAttachingConnector:pid=2402\n```\n\n## SA 调试服务器附加连接器\
    \ (SA Debug Server Attaching Connector)\n\n该连接器可供调试应用程序调试运行调试器机器之外的机器上的进程或转储文件。该连接器使用远程方法调用\
    \ (RMI) 与运行在远程机器上的调试服务器通信。在调用该连接器的 `attach()` 方法之前，必须在远程机器上启动调试服务器并告知要调试的进程或转储文件。在远程机器上需要执行以下操作：\n\
    \n- 启动包含 `sa-jdi.jar` 的 RMI 注册表：\n```\n${JAVA_HOME}/bin/rmiregistry -Xbootclasspath:${JAVA_HOME}/lib/sa-jdi.jar\n\
    ```\n此命令创建并启动一个远程对象注册。可以指定一个可选端口号作为注册启动端口。如果没有指定端口号，注册将在端口 99 上启动。\n\n- 在远程机器上启动调试服务器，指定要调试的进程或转储文件：\n\
    ```\n${JAVA_HOME}/bin/java -classpath ${JAVA_HOME}/lib/sa-jdi.jar sun.jvm.hotspot.jdi.DebugServer\
    \ <pid> <uniqueID>\n```\n或\n```\n${JAVA_HOME}/bin/java -classpath ${JAVA_HOME}/lib/sa-jdi.jar\
    \ sun.jvm.hotspot.jdi.DebugServer <产生转储文件的 java 可执行文件路径> <要调试的转储文件路径> <uniqueID>\n\
    ```\n如果注册表尚未运行，SA 调试服务器将在端口 99 启动 RMI 注册。这两个步骤的替代方案是使用 JDK 自带的工具在远程机器上启动 RMI 注册和调试服务器。如果在同一台机器上同时运行多个调试服务器，每个服务器必须具有不同的\
    \ `uniqueID` 字符串。\n\n## 扩展可用性工具\n\n可用性代理 API 提供了 `sun.jvm.hotspot.tools.Tool`\
    \ 类，可以通过扩展它编写 way工具。这是一个扩展 `sun.jvm.hotspot.tools.Tool` 类的简单示例，它可以打印目标 VM 的系统属性。该工具是\
    \ `sa-jdi.jar` 文件的一部分：\n\n```java\npackage sun.jvm.hotspot.tools;\n\nimport java.io.PrintStream;\n\
    import java.util.*;\nimport sun.jvm.hotspot.runtime.*;\n\npublic class SysPropsDumper\
    \ extends Tool {\n\n    public void run() {\n        Properties sysProps = VM.getProperties();\n\
    \        PrintStream out = System.out;\n        if (sysProps != null) {\n    \
    \        Enumeration keys = sysProps.keys();\n            while (keys.hasMoreElements())\
    \ {\n                Object key = keys.next();\n                out.print(key\
    \ + \"=\");\n                out.println(sysProps.get(key));\n            }\n\
    \        } else {\n            out.println(\"System Properties not available!\"\
    );\n        }\n    }\n\n    public static void main(String[] args) {\n       \
    \ SysPropsDumper pd = new SysPropsDumper();\n        pd.start();\n    }\n}\n```\n\
    \n编写我们的工具需要扩展 `Tool` 类并实现 `run()` 方法。在前面的示例中，我们通过 `Tool` 类获取系统属性并将其打印到标准输出。\n\n"
