    Parallel GC 对于满足这些要求的应用程序效果良好。对于不满足这些要求的应用程序，停顿时间可能会非常长，因为全 GC 必须标记整个 Java 堆并压缩老年代。因此，停顿时间随着
    Java 堆的增大而增加。


    图 1.1 展示了应用程序线程（灰色箭头）如何停止，GC 线程（黑色箭头）如何接管执行垃圾回收工作。图中有 8 个 GC 线程和 8 个 Java 应用程序线程，尽管在大多数应用程序中应用程序线程的数量超过
    GC 线程，特别是某些应用程序线程可能空闲的情况下。当发生 GC 时，所有应用程序线程都会停止，多个 GC 线程执行 GC。


    # Serial GC (串口 GC)


    Serial GC 与 Parallel GC 非常相似，只是它在单线程中完成所有工作。单线程方法允许不复杂的 GC 实现，并且所需的外部运行时数据结构很少。内存占用是所有
    HotSpot 回收器中最低的。Serial GC 的挑战与 Parallel GC 。停顿时间可能很长，并与堆的大小和存活数据量呈线性增长。此外，对于 Serial
    GC，GC 停顿更加明显，因为 GC 工作是在单线程中完成的。


