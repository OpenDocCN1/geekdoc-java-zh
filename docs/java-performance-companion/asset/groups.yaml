    \n`satb_enqueue(pre)` 首先尝试将旧值入入线程本地缓冲区（称为 SATB 缓冲区）中。SATB 缓冲器的初始大小为 256 条目，每个应用程序线程都有\
    \ SATB 缓冲区。如果没有空间在缓冲区中放置 `pre_val`，则会调用 JVM 运行时；线程的 SATB 缓冲区会被弃用并放入全局 SATB 缓冲区列表，为该线程分配一个新的\
    \ SATB 缓冲区，并记录 `pre_val`。并发标记线程的职责是定期检查并处理这些缓冲区，以确保已记录的对象被标记。\n\n填满的 SATB 缓冲区（在标记阶段）通过遍历全局列表进行处理，遍历每个缓冲区，并通过标记位图中的对应位位标记每个记录的对象（如果该对象位于指纹下方，则将对象推入本地标记栈）。标记会遍历标记位图中某个区域的已设置位位，追踪已标记对象的字段引用，在标记位图中设置更多位位，并在需要时推送对象。\n\
    \n存活数据计数是顺便通过标记操作完成的。因此，每当一个对象被标记时，它也会被计数（即它的字节被加到区域的总数中）。只有 NTAMS 之下的对象会被标记和计数。在该阶段结束时，会清除下一个标记位图，以便在下一次标记周期开始时就绪。这是与变异线程并发完成的。\n\
    \n> 提示\n> JDK 8u40 引入了一个新的命令行选项 -XX:+UseConcurrentMarking，它允许在并发标记时进行卸类。\n\n##\
    \ 重标记\n\n重标记阶段（remark）是并发标记结束后的。在重标记期间，G1 GC 遍历任何未访问的对象。在停停世界期间，G1 GC 触发其故障安全机制并退回到单线程的全量收集。在\
    \ 8u40 之前，重标记阶段是停停世界的，以安全地完成数据计数。为了减少在此暂停中花费的时间，使用了并行线程来处理 SATB 缓冲区。\n\n> 提示\n\
    > 任何大量使用引用（弱引用、软引用、虚引用）的应用程序可能会看到引用处理。我们将在第 3 章介绍更多。\n\n## 清理\n\n在清理暂停期间，两个标记位图交换角色：下一个位图变为上一个（由于当前标记周期已完成并具有标记信息），而上一个位图变为新的（将在下次循环作为当前标记位图）。同样，PTAMS\
    \ 和 NTAMS 也会交换角色。清理暂停的三大贡献是识别完全空区域、排序堆以识别用于混合收集的旧区域以及 RSet 清理。当前启发算法根据存活情况对区域进行排序（存活对象的区域收集成本很高，因为复制是一项昂的操作）以及记忆集大小（再次，大型记忆集由于区域的流行度收集成本很高——流行度概念在Sets及其重要性”部分讨论过）。目标是首先收集被认为成本较低（存活对象较少且流行度较低）的候选区域。\n\
    \n识别每个区域存活对象的优点是，当遇到存活对象的完全空区域时，可以清除其记忆集并立即回收该区域，返回空区域列表，而不是将其放入 GC 高效（在“G1 中的垃圾收集”部分讨论过）排序数组并等待回收（混合）垃圾收集暂停。RSet\
    \ 清理有助于检测过期引用。例如，如果标记发现特定卡上的所有对象都是死的，则从“所有”RSet 中移除。\n\n## 复制失败与全量收集\n\n有时 G1\
    \ GC 无法找到空区域来复制来自年轻代的存活对象，或者在尝试复制来自老年代的对象时。这种失败在日志中被报告为空间耗尽（to-space exhausted）失败，失败持续时间在日志下方显示为复制失败时间（331.5ms），如下例：\n\
    \n```\n111.912: [GC pause (young 0.6773162 secs]\n<S0>\n[Ev\n```\n\n在其他时间，巨型分配（humongous\
    \ allocation）可能无法在老年代中找到连续区域。在这种情况下，G1 GC 会尝试增加 Java 堆的使用。如果 Java 堆空间的扩展失败，G1\
    \ GC 将触发其故障安全机制并退回到单线程的全量收集。\n\n"
