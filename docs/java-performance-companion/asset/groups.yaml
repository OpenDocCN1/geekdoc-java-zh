    # Evacuation and Reclamation


    Now that G1 knows its CSet for the current collection pause, it can move on to
    the most expensive part of a pause: the evacuation of live objects from the CSet
    regions and reclamation of the newly freed space. Ideally, the objectƝ object
    copy times are the biggest contributor to the pause. Live objects that must be
    evacuated are copied to thread-local GC allocation buffers (GCLABS) allocated
    in target regions. Worker thread competes to install a forwarding pointer to the
    newly allocated copy of the old object image. With the help of work stealing [2],
    a single “winner” thread helps copying and scanning the object. Work stealing
    also provides load balancing between the worker threads.


    ```

    [Object Copy (ms): Min: 25.1, Avg: 25.2, Max: 25.2, Diff: 0.1, Sum: 201.5]

    ```


    > Tip

    G1 GC uses the copy times as weighted averages to predict the time it takes to
    copy a single region. Users can adjust the young generation size if the prediction
    logic fails to keep up with the desired time goal.


    # Termination


    After completing the tasks just described, each worker thread offers termination
    if its work queue is empty. A thread requesting termination checks the other threads’s
    queues to attempt work stealing. If no work is available, it terminates. Termination
    tags the time each worker thread spends in this termination protocol. A GC worker
    thread that gets caught in a single root scan can be late to complete all the
    tasks in its queue and eventually be late for termination.'
