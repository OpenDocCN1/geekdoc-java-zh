    # 垃圾优先 (G1) GC


    与 CMS GC 类似，G1 有一种安全机制（fail-safe），在老年代空间耗尽等情况下对整个老年代进行收集和压缩。


    G1 的老年代收集（不考虑安全机制类型的收集）由一系列阶段组成，其中某些阶段是并行停顿（stop-the-world），另一些是并行并发（parallel-current）。也就是说，某些阶段是多线程并停止所有应用线程，而另一些阶段则是多线程并与应用线程同时执行。第
    2 章和第 3 章提供了关于这些阶段的更多详细信息。


    当 Java 堆占用率超过阈值时，G1 会启动老年代收集。需要注意的是，G1 中的堆占用率阈值衡量的是老年代相对于整个 Java 堆的占用比例。熟悉 CMS
    的读者会记得，CMS 是使用仅应用于老年代空间的占用阈值来启动老年代收集的。在 G1 中，一旦达到或超过堆占用率阈值，就会调度执行一个并行停世界的初始标记阶段（initial-mark）。


    初始标记阶段与下一次 GC 同时执行。一旦初始标记阶段完成，将启动一个并发多线程标记阶段，用于标记老年代中的所有存活对象。当并发标记阶段完成后，会调度一个并行停世界的重新标记阶段（remark），用于标记任何由于应用线程与标记阶段并发执行而可能遗漏的对象。在重新标记阶段结束时，G1
    拥有了老年代区域的完整标记信息。如果恰好某些老年代区域没有任何存活对象，它们可以在并发周期的下一个阶段——清理阶段（cleanup phase）中无需任何额外的
    GC 工作即可被回收。


    同样，在重新标记阶段结束时，G1 可以识别出一组待收集的最优老年代。


    # 提示


    在垃圾收集期间收集的区域集合被称为收集集（CSet）。


    包含 CSet 中的区域是基于可以释放多少空间以及 G1 GC 停顿时间决定的。确定 CSet 后，G1 会调度一次 GC，在接下来的几次年轻代 GC 中收集
    CSet 中的区域。也就是说，在接下来的几次年轻代 GC 中，除了年轻代外，部分老年代也会被收集。这就是之前提到的混合 GC（mixed GC）种的垃圾收集。


    在 G1 中，每个被垃圾收集的区域（无论其是在老年代还是年轻代），其存活对象都会被迁移到可用的区域。一旦存活对象被迁移，被收集的年轻代和/或老年代区域将变为可用区域。


    将存活对象从老年代迁移到可用区域的一个具有吸引力的结果是：被迁移的对象在虚拟地址空间中最终相邻。对象之间没有碎片化的空空间。G1 实际上对老年代执行了部分压缩。请记住，CMS、Parallel
    和 Serial GC 都需要通过 Full GC 来压缩老年代，而压缩会清除整个老年代。


    # 第 1 章 垃圾优先概述


    由于 G1 是按区域执行 GC 操作的，因此适用于大型 Java 堆。尽管 Java 堆可能很大，但 GC 的工作量可以被限制在较小的区域集合内。


    G1 停顿时间最大的贡献者是年轻代收集和混合收集，因此 G1 的设计目标之一是允许用户设置 GC 停顿目标。G1 试图通过 Java 堆的自适应大小调整来满足指定的停顿时间。它会根据停顿目标自动调整年轻代的大小和整个
    Java 堆的大小。停顿目标越低，年轻代就越小，总大小越大，使得老年代相对变大。


    G1 的设计目标是通过设置最大 Java 堆大小并指定 GC 目标来限制所需的调优。否则，G1 设计为使用启发式算法进行自我动态调优。在编写本文时，G1 中的启发式算法是
    HotSpot GC 开发最活跃的领域。此外，截至本文，G1 在某些情况下可能需要额外的调优，但构建良好启发式算法的要素已经具备且前景良好。关于如何调优 G1
    的建议，请参见第 3 章。


    总结来说，G1 通过将堆划分为区域，在大堆场景下比其他垃圾回收器具有更好的扩展性。G1 借助部分压缩处理 Java 堆碎片，并以多线程方式完成所有工作。


    在编写时，G1 主要针对具有合理低停顿的大型堆用例，以及那些正在使用 CMS GC 的应用程序。目前计划将 G1 也用于吞吐量用例，但对于寻求高吞吐量且能忍较长
    GC 停顿的应用，Parallel GC 目前


    # G1 设计


    如前所述，G1 将 Java 堆划分为多个区域（regions）。区域的大小取决于堆的大小，但必须是 2 的幂，且至少为 1MB，最多为 32MB。因此，可能的区域大小为
    1、2、4、8、16 和 32MB。所有区域的大小相同，且它们的大小在 JVM 运行期间不会改变。区域大小的计算基于初始堆大小和最大 Java 堆大小的平均值，使得平均堆大小对应大约
    2000 个区域。例如，对于使用 -Xmx16g -Xms16g 命令行选项的 16GB Java 堆，G1 将选择 16GB/2000=8MB 的区域大小。


    如果初始堆和最大堆大小相差很大，或者堆的大小非常大，可能会有多于 2000 个区域。同样，堆的大小最终可能少于 2000 个区域。


    每个区域都有一个关联的集合（称为 RSet）。RSet 的大小是有限的但是明显的，区域的数量对 HotSpot 的内存占用有直接影响。在低端，RSet 开销约为
    1%，在高端占堆大小的 20%。


    一个特定的区域一次只用于一种用途，但当该区域包含在收集中时，它将被完全迁移并释放为可用区域。


    G1 中有几种类型的区域。可用区域是未使用的。Eden 区域构成了 Eden 空间，Survivor 区域构成了 Survivor 空间。所有 Eden 和
    Survivor 区域的集合就是年轻代。Eden 或 Survivor 区域的数量可以在每次 GC 之间变化（使用年轻、混合或 Full GC）。老年代区域占大部分。最后，巨型区域（humongous
    regions）被视为老年代的一部分，包含大小占区域 50% 或以上的对象。在 8u40 之前，巨型区域是在年轻代收集中回收的。8u40 在本章后续有更多关于巨型区域的细节。


    区域可以用途意味着不需要将堆划分为连续的年轻代和老年代空间。相反，G1 启发式算法估计年轻代可以包含多少区域而仍能满足停顿目标。随着应用程序开始分配，G1
    选择一个可用区域，将其标记为 Eden 区域，并向 Java 线程分配内存块。当区域填满后，另一个空用区域被标记为 Eden 区域。该过程持续到达到最大区域数，此时将触发年轻代
    GC。


    在年轻代 GC期间，所有的 Eden 和 Survivor 区域都会收集。这些区域中的所有存活对象都会迁移到新的 Survivor 区域或老年代区域。当当前的迁移区域填满时，根据需要将其标记为
    Survivor 或老年代区域。


    当老年代空间的占用率超过初始堆占用阈值时，G1 会启动老年代收集。该阈值由命令行选项 -XX:InitiatingHeapOccupancyPercent
    控制，默认值为 Java 堆的 45%。


    当标记阶段显示某些老年代区域没有任何存活对象时，G1 可以早期回收这些区域。此类区域会被添加到可用区域集中。包含存活对象的老年代区域将被调度在未来的混合收集中处理。


