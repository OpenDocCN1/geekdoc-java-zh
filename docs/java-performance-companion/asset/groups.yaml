    # 76 Chapter 4 · The Serviceability Agent


    ![](img/b3ae442318f4d873d1d076953179a125_92_0.png)


    # Attach to HotSpot Core Files


    SA is a very useful tool for postmortem analysis. With SA, it is possible to attach
    to HotSpot “core” files, also known as crash dump files on the Windows platform.
    A core or crash dump file is a binary file that consists of the state of a running
    program at a specific time. Core files may be generated due to process crashes,
    or they can be dumped from a running application for offline debugging. More details
    on core/crash dump files are covered in the section “Core Dump or Crash Dump Files”
    later in the chapter.


    > Tip

    Note that the HotSpot core/crash dump file can be very large depending on the
    amount of state information it contains the time of core/crash dump file generation.
    You may have to configure the operating system to generate large core files and
    also ensure that the file system where the file is generated has sufficient space.


    To open a core file with the SA, launch HSDB and click File > Open HotSpot file
    as shown in Figure 4.5. Then, enter the path to the core and the path to the Java
    executable as shown in Figure 4.6.'
