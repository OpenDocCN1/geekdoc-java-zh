    ### 堆参数 (Heap Parameters)


    堆参数工具显示了 Java 堆各个区域的边界。它有助于找到特定地址位于堆的哪个区域。示例见图 4.32。


    ### 系统属性 (System Properties)


    我们可以使用系统属性工具获取目标 VM 使用的系统属性。示例见图 4.33。


    ### 命令行标志 (Command Line Flags)


    该实用程序显示了所有命令行 -XX JVM 选项的值。示例见图 4.34。


    ## CLHSDB


    Command-Line HotSpot Debugger（命令行 HotSpot 调试器）是 HSDB 的命令行版本。启动 CLHSDB，我们需要设置与启动
