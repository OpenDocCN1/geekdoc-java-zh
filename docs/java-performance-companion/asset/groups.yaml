    2 章中描述的清理任务。清理暂停之后是一个年轻代晋散暂停，用于为混合收集周期做准备。该年轻代回收后的四个停顿是混合收集晋散暂停，它们能够成功地从目标 CSet
    区域中收集所有垃圾。


    | 年轻代回收 | 重标记 |

