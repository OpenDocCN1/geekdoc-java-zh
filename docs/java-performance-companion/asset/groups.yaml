    我们还可以通过 Inspector 窗口中可用的 Compute Liveness（计算存活）和 Show Liveness（显示存活）按钮，在另一个窗口中查看对象的存活路径。详见图
    4.23。


    ### 通过查询查找对象 (Find Object by Query)


    该工具提供了基于 SQL 的查询语言，用于从 Java 堆中查询 Java 对象；例如，要查找 Java 堆中所有的线程对象，可以执行如下查询：


    ```

    select t from java.lang.Thread t

