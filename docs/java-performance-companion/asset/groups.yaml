    # 第 3 章 - Garbage First 垃圾回收器性能调优


    由于一个大对象分配请求导致堆占用超过了标记阈值，系统正在请求一个并发周期。该请求的大小为 2,097,168 字节，远大于 G1 在 JVM 启动时设置的
    1MB G1 堆区域大小。


    - - 是由于幸存区（survivor regions）空间无法容纳晋升的对象导致的复制失败。当你观察到这种情况发生时，尝试增加 `-XX:G1ReservePercent`。预留百分比为预留空间创建一个虚假天花板，以适应晋升模式的变化。默认值为总
    Java 堆的 10%，并被 G1 限制为总 Java 堆的 50%，因为更多的比例会导致大量的空间浪费。


    # 引用处理 (Reference Processing)


    垃圾回收必须以不同于其他 Java 对象的方式处理 Java 引用对象——幻引用、软引用弱引用。引用对象比非引用对象需要更多工作才能回收。


    在本节中，你将学习如何识别 G1 垃圾回收暂停期间执行引用处理所需的时间是否会对你的应用程序产生影响，以及如何调优 G1 以减少这种开销，并提供隔离哪种引用对象类型引起最大开销的提示。根据应用程序及其时间要求，可能需要重构应用程序源码以减少引用处理开销。


    > 提示：每种引用对象的 Java 平台标准版 (Java SE) API 文档 (http://docs.oracle.com/java/8/docs/api)
    以及 java.lang.ref 包中幻引用、软引用和弱引用的 API 都是理解每种引用对象行为以及如何以及何时被回收的良好来源。


    # 观察引用处理


    垃圾回收引用对象涉及几个主要活动：发现引用对象、将其推入 JVM 队列以及从队列中取出。当使用 `-XX:+PrintGCDetails` 使用 G1 时，队列引用对象的时间与处理它们的时间分开报告。这两个时间出现在年轻代
    GC 和混合 GC 日志的 Other 部分：


    ```

    [Other: 9.9 ms]

    [Choose Cset: 0.0 ms]

    [Ref Proc: 8.2 ms]

    [Ref Enq: 0.3 ms]

    [Redirty Cards: 0.7 ms]

    [Humongous Reclaim: 0.0 ms]

    [Free Cset: 0.5 ms]

    ```


    Ref Proc 是处理引用对象的时间，Ref Enq 是队列引用对象的时间。如示例，Ref Enq 的时间与 Ref Proc 的时间一样长。事实上，我们还没有看到过
    Ref Enq 持续更高的应用程序。如果发生这种情况，意味着处理引用的工作相对于其入队时间非常小，这对于大多数引用对象类型是不可能的。G1 在并发周期的 remark
    阶段也会报告处理活动。使用 `-XX:+PrintGCDetails`，来自 remark 的日志输出将包含引用处理时间：


    ```

    [GC Finalizing Marking, 0.000722 secs][GC ref-proc, 0.0129203 secs]

    [Unloading, 0.016048 secs, 0.0308670 secs]

    ```


    -XX:+PrintReferenceGC 报告每个引用对象的详细信息，对于隔离回收器花费时间最多的特定引用对象类型非常有用。


    ```

    [GC Finalizing Marking, 0.000322 secs][GC ref-proc [SoftReference, 2 refs, 0.0052296
    secs][WeakReference, 3264308 refs, 0.0524238 secs]

    [FinalReference, 215 refs, 0.0028225 secs][PhantomReference, 1787 refs, 0.0050046
    secs][JNI Weak Reference, 0.0007776 secs, 0.0932150 secs]

    [Unloading, 0.0060031 secs, 0.2210401 secs]

    ```


    注意 G1 是唯一通过 -XX:+PrintGCDetails 报告处理时间的 HotSpot GC。然而


    作为一个通用指南，PrintGCDetails 输出中的 Ref 时间超过 G1 年代或混合 GC 总暂停时间的 10%，则需要调优垃圾回收器的引用处理。对于
    G1 remark 事件，通常会看到更大比例的处理时间，因为并发周期的 remark 阶段处理了老代回收期间发现的大部分引用对象。如果 G1 remark
    的持续时间超过你的暂停时间，且大部分时间花费在引用处理上，如下一节所述。


    # 引用处理调优


    首先要做的是使用 `-XX:+ParallelRefEnabled` 启用多线程引用处理，因为 HotSpot 默认使用单线程引用处理。这种默认是为了最小化内存占用并将
    CPU 周期留给其他应用程序。启用此选项会在引用处理期间消耗更多 CPU，但引用处理的时间将会减少。


    如果 G1 remark 的持续时间超过你的暂停时间，且大部分时间花费在引用处理上（如下一节所述），下一步是确定 G1 花费时间最多的哪种引用对象类型。使用
