    # Garbage First Garbage Collector Performance Tuning


    Performance engineering deals with the nonfunctional performance requirements
    of a system or its software and ensures that the design requirements are met in
    the product implementation. Thus it goes hand-in-hand with systems or software
    engineering.


    In this chapter, we will discuss performance tuning in detail, concentrating on
    the newest garbage collector in Java HotSpot VM: Garbage First, or G1. We will
    skip young generation tuning advice already provided in Java™ Performance [1],
    particularly Chapter 7, "Tuning the JVM, Step by Step." Readers are encouraged
    to read that chapter and also the previous chapters in this book.


    # The Stages of a Young Collection


    A G1 young collection has serial and parallel phases. The pause is serial in the
    sense that several tasks can be carried out only after other tasks are completed
    during a stop-the-world pause. The parallel phases employ multiple GC threads
    that have their own work queues and perform work stealing from other threads''
    work queues when their queue tasks are completed.


    > > **Tip**nThe stages of the young collection pause can be multithreaded and
    use the value of -XX:ParallelGCThreads to determine the GC worker thread count.'
