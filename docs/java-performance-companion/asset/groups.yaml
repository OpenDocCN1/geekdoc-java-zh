    ## 并发标记阶段可调参数


    对于 G1 来说，可调的参数 `-XX:InitiatingHeapOccupancyPercent=n`（此处 n 默认为总 Java 堆大小的 45%，并考虑了老年代的占用情况，包括老年代区域和大对象区域）有助于决定何时启动并发标记周期。


    > 提示：CMS GC 启动标记周期是相对于其老年代大小的，而 G1 的 InitiatingHeapOccupancyPercent 是相对于整个 Java
    堆大小的。


    并发标记周期始于初始标记暂停，该暂停与年轻代回收（young collection）同时发生（即“寄载”在年轻代回收中）。该暂停标记了收集周期的开始，随后是其他并发和并行任务，包括根节点扫描、并发标记和存活统计、最终标记以及清理。图
    3.1 显示了并发标记周期中的所有停顿：初始标记（initial mark）、重标记（remark）和清理（cleanup）。要了解更多关于并发标记周期的信息，请参考第
    2 章。


    ```

    277.559: [GC pause (G1 Evacuation Pause) (young) (initial-mark), 0.0960289 secs]

    ```


    如果应用程序的活跃对象图很大，并发标记任务可能会花费长时间，并且经常被年轻代回收暂停中断。并发标记周期必须在混合收集（mixed collection）开始之前完成，并紧接着是一个年轻代回收，该回收会计算下次暂停时触发混合收集所需的阈值，如图
