    The concurrent marking cycle starts with an initial marking pause which happens
    at the same time as (aka, is "piggybacked onto") a young collection. This pause
    marks the beginning of the collection cycle and is followed by other concurrent
    and parallel tasks for root generation scanning, concurrent marking and liveness
    accounting, final mark, and cleanup. Figure 3.1 shows all the pauses in a concurrent
    marking cycle: initial mark, remark, and cleanup. To learn more about the concurrent
    marking cycle refer to Chapter 2.


