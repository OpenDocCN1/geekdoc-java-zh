    ```


    myserver 20 % Is classes

    ./.. TestClass.class java/ sun/


    As we can see, the ClassDump utility has dumped the classes loaded in the classes/folder.
    Similarly, this tool can attach to a remote debug server and dump the classes
    loaded in the target VM.


    # DumpJFR


    DumpJFR is an SA-based tool that can be used to extract Java Flight Recorder (JFR)
    information from the core files and HotSpot processes.


    Java Flight Recorder and Mission Control tools are shipped with the JDK since
    JDK 7u40. As we know, the Java Flight Recorder is a tool for collecting diagnostic
    and profiling data about a running Java application. It is integrated into the
    JVM and its usage causes no performance overhead. Java Mission Control can be
    used to analyze the data collected by the Java Flight Recorder.


    DumpJFR provides the capability to extract the JFR data from the core files of
    crashes, or hung Java processes, which otherwise is not possible to access them.
    This tool is shipped with the JDK since JDK 8u60.


    DumpJFR tool sources are present under hotspot/src/closed/agent/in the repository.
    During the build process of HotSpot sources, DumpJFR files get included into sa-jdi.jar
    when the closed part of the HotSpot repository gets built.


    Please note that Java Flight Recorder and Mission Control, and hence this tool,
    require a commercial license for use in production.


    This is how we can attach DumpJFR to a live process and dump the JFR into a recording
    file:


    ```

    java -cp $JAVA_HOME/lib/sa-jdi.jar sun.jvm.hotspot.tools.DumpJFR <pid>

    ```'
