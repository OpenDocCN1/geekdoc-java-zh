    # Serviceability Agent Plugin for VisualVM


    Before we delve into the details on the Serviceability Agent Plugin for JavaVM
    (VisualVM), let''s talk briefly about VisualVM.


    VisualVM is a tool for troubleshooting, monitoring, and observing Java applications.
    It is positioned as an all-in-one monitoring and troubleshooting tool for Java
    applications. Many of the standalone tools shipped with the JDK such as jstack,
    jmap, and so on are also available in VisualVM. Starting with JDK 6u27, VisualVM
    is also shipped with the JDK and can be launched using the command jvisualvm.
    Figure 4.36 shows an example of what VisualVM looks like when it has been launched.


    One great thing about VisualVM is that it is possible to extend it using plugins.
    One can write plugins for VisualVM using its APIs and develop plugins for others
    to use. The plugins can then be made available in the VisualVM Plugins Center.


    Serviceability Agent Plugin for VisualVM is a VisualVM plugin that brings key
    features of SA to SAVM. This plugin provides the ability to look at the VM representation
    of Java objects in the heap, Java threads in the application, and compiled/interpreted
    code of methods and find references for a given address in the Java heap, all
    from within the VisualVM GUI.


    ![](img/b3ae442318f4d873d1d076953179a125_134_0.png)


    Figure 4.36 Java VisualVM


    ## How to Install the SA-Plugin in VisualVM


    VisualVM plugins are available at the VisualVM Plugins Center. The latest VisualVM
    Plugins Center is at http://visual.java.net/pluginscenters.html. To install the
    SA-Plugin in VisualVM, click Tools > Plugins. This will bring up the Plugins dialog
    box. Click on the Available Plugins tab, select SA-Plugin from the list, and then
    Install. This will install the SA-Plugin in your VisualVM installation.


    ## How to Use the SA-Plugin


    Let''s take a look how we can use the SA-Plugin to explore a running process or
    a core file.


    To explore a live process with SA-Plugin, run the process with a JDK that is shipped
    along with the binaries. Open this process in VisualVM. When SA-Plugin is installed
    in VisualVM, it appears in the Application view when the process is opened in
    VisualVM. Now, click Attach to Process in the SAPlugin tab; this will attach SA
    to the running process, and the process will be paused at that in time. Now we
    can explore the snapshot of the process. We can look at its Java threads, inspect
    the Java objects, look at the bytecodes/compiled code of methods, and so on.


    After we are done, we can detach the process from the SA by clicking the Detach
    Process button. The process will resume.


    Opening and diagnosing core files is similar to exploring processes with SA-Plugin.
    First we need to open the core file in VisualVM and then attach to that from the
    SA Plugin view. As in the case of a process, we can explore objects in the Java
    heap, look at thread objects, search for values in the Java heap, and look at
    the compiled code of methods from the core file. SA-Plugin''s capability of exploring
    the core files helps a great deal in the postmortem of dead processes.


