    a region. Until JDK 8u40, humongous regions were collected as part of a young
    collection. In JDK 8u40 there is more detail on humongous regions later in this
    chapter.


    The fact that a region can be used for any purpose means that there is no need
    to partition the heap into contiguous young and old generation spaces. Instead,
    G1 heuristics estimate how many regions the young generation can consist of and
    still be within a GC pause target. As the application starts allocating, G1 chooses
    an available region, designates it as an eden region, and starts handing out memory
    chunks to Java threads. Once the region is full, another unused region is designated
    an eden region. The process continues until the maximum number of regions is reached,
    at which point a young GC is initiated.


    During a young GC, all regions, eden and survivor, are collected. All live objects
    in these regions are evacuated to either a new survivor region or to an old generation
    region. Available regions are tagged as survivor or old generation regions as
    needed when the current evacuation region becomes full.


