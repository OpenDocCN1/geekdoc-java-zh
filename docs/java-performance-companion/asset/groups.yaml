    # 年代集合的阶段


    为了限制更新 RSets 所花费的时间，G1 设置了一个目标时间，作为暂停时间目标的百分比（-XX:MaxGCMillis）。该目标时间默认为暂停时间目标的
    10%。任何逃逸暂停（evacuation pause）都应该将大部分时间花在拷贝生存对象上，而暂停时间目标的 10% 被认为是花费更新 RSets 的合理时间。在查看日志后，如果你发现更新
    RSets 花费暂停时间目标的 10%是不理想的，你可以通过更新 -XX:G1UpdatingPausePercent 命令行选项来更改百分比以反映你所需的值。然而，重要的是，如果更新的日志缓冲区数量没有变化，那么在集合期间
    RSet 更新时间的缩短将导致在该暂停期间处理的缓冲区更少。这将日志缓冲区的工作推给并发完善线程（concurrent refinement threads），导致工作量以及与
    Java 应用程序变器线程（mutator threads）的资源共享增加。此外，最坏的情况下，如果并发完善线程跟不上日志缓冲区的更新速率，Java 应用程序变器线程必须介入帮助处理——这种情况是应该避免的场景！


    > 提示

    如第 2 节所述，有一个名为 -XX:G1RefinementThreads 的命令行选项。默认情况下，它设置为与 -XX:ParallelGCThreads
    相同的值，这意味着 XX:ParallelGCThreads 的任何更改都会改变 -XX:G1ConcRefinementThreads 的值。


    在收集当前 CSet 中的区域之前，必须扫描 CSet 的 RSets 以查找其对 CSet 区域的引用。如第 2 节所述，一个区域中的热门对象或该区域本身的热门程度可能会导致其
    RSet 从稀疏的 PRT（每区域表）变为细粒度的 PRT 甚至是粗粒度的位图（coarsened bitmap），从而使得扫描 RSet 需要更多时间。在这种情况下，你将看到此处显示的
    Scan 时间增加，因为扫描时间取决于 RSet 数据结构的粗粒度梯度：


    ```

    [Scan RS (ms): Min: 13.4, Avg: 13.6, Max: 13.7, Diff: 0.3, Sum: 109.0]

    ```


    另一个与 RSets 相关的并行任务是根扫描（root scanning），在此期间会扫描代码根以找到指向当前 CSet 的引用：


    ```

    [Code Root Scanning (ms): Min: 0.0, Avg: 0.0, Max: 0.0, Parallel: 0.0543862, Sum:
    0.1]

    ```


    在 HotSpot 的早期版本中，整个代码缓存被视为单个根，并由单个工作线程获取和处理。大型且完整或接近满的代码缓存会阻塞该工作线程，并导致总暂停时间增加。随着代码根扫描作为独立的并行活动引入，扫描
    nmethods 的工作减少为仅扫描来自编译后代码引用的 RSets。因此，对于 CSet 中的特定区域，只有当该区域的 RSet 具有强代码根时，才会扫描对应的
    nmethod。


    > 提示

    开发者通常用 nmethod 一术语来指代 Java 方法的动态编译代码。不要将 nmethod 与原生方法（native method）混淆，后者指的是
    JNI 方法。nmethods 除了生成的代码外，还包括常量池等辅助信息。


    > 提示

    为了缩短 nmethod 扫描时间，仅扫描 CSet 中区域的 RSets 以查找编译器引入的引用，而不是由 Java 应用程序变器线程引入的“通常”引用。


    # 记忆集（Remembered Sets）总结


    选项 -XX:+GSummarizeRSetStats 用于提供 RSet 粗粒化（细粒度或粗粒度位图）总数的窗口，帮助判断并发完善更改能够处理更新的缓冲区，并收集有关
    nmethods 的更多信息。该选项每 n 次 GC 暂停总结一次 RSet 统计信息，n 由 -XX:+SummarizeRSetPeriod 设置。


    ```

