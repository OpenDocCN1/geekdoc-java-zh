    \ array = {1, 2, 3};\n    native void nativeMethod();\n}\n```\n\n这里是测试用例的原生部分，使用\
    \ JNI 实现了 `nativeMethod()` 方法。源代码存放在名为 `test.cpp` 的文件中，符合 JNI 源文件文件命名规范。\n\n```cpp\n\
