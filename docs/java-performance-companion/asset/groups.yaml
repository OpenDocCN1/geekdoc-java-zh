    GC 阶段或事件可以被描述为全停世界，意味着在该特定的 GC 阶段或事件期间，所有 Java 应用程序线程都停止了。


    并发意味着垃圾回收活动与 Java 应用程序执行的同时发生。并发 GC 阶段或事件意味着可以用这三个术语中的任何一个或组合来描述该 GC 阶段或事件。例如，并行并发回收器是多线程的（并行部分），并且与应用程序同时执行的（并发部分）。


