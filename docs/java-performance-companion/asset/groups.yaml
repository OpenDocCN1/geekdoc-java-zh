    \ = 0x0400;\n```\n\n## 使用 SA 排除故障问题\n\n![](img/b3ae442318f4d873d1d076953179a125_149_0.png)\n\
    \n图 4.48 监控缓存转储\n\n## 134 第 4 章 · 可性代理 (The Serviceability Agent)\n\n![](img/b3ae442318f4d873d1d076953179a125_150_0.png)\n\
    \n图 4.49 Oop Inspector—Thread-0\n\n## 使用 SA 排除故障问题\n\n![](img/b3ae442318f4d873d1d076953179a125_151_0.png)\n\
    \n图 4.50 Oop Inspector—Thread-1\n\n该计算在 `threadStatus` 为 1025 时会返回线程状态为 `BLOCKED`。这意味着两个线程都处于\
    \ `BLOCKED` 阻塞状态。\n\n因此，使用死锁检测工具，我们可以轻松定位应用程序中的 Java 级死锁。\n\n## HotSpot VM 崩溃的事后分析\n\
    \nSA 能够通过对这些崩溃产生的核心文件（core files）进行事后分析，来帮助诊断 JVM 崩溃。我有一个使用 JNI 的简单程序。它向一个超出大小限制的字节数组写入数据，这会导致覆盖并损坏\
