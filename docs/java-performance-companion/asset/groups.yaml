    With the introduction of G1 GC, HotSpot JVM moved from the conventional layout
    where the generations are continuous to generations that are now composed of noncontiguous
    heap regions. For, an active Java heap, a particular region could be a part of
    either eden or survivor or old generation, or it could be a humongous region or
    even just a free region. Multiples of these regions form a “logical” generation
    to match conventional wisdom from previous HotSpot garbage collectors’ idea of
    generational spaces.


    # Garbage Collection in G1


    G1 GC reclaims most of its heap regions during collection pauses. The only exception
    to this is the cleanup stage of the multistaged concurrent marking cycle. During
    the cleanup stage, if G1 GC encounters purely garbage-filled regions, it can immediately
    reclaim those regions and return them to a list of free regions; thus, freeing
    those regions do not have to wait for the next garbage collection pause.


    G1 GC has three main types of garbage collection cycles: a young collection cycle,
    a multistage concurrent marking cycle, and a mixed collection cycle. There is
    also a single-threaded (as of this writing) fallback pause called a “full” garbage
    collection pause, which is the fail-safe mechanism for G1 GC in case the GC experiences
    evacuation failures.


    > Tip

    an evacuation failure is also known as a promotion failure or to-space exhaustion
    or to-overflow. The failure usually happens when there is no free space to promote
    objects. When faced with such a scenario, all Java HotSpot GCs try to expand their
    heaps. If the heap is already at its maximum, the GC tries to reclaim the regions
    where objects were successfully copied and update their references. For G1 GC,
    the objects that could not be copied in place. All GCs will then have their references
    self-forwarded. These self-forwarded references are removed at the end of the
    garbage collection cycle.


    During a young collection, G1 GC pauses the application threads to move objects
    from the young regions into survivor regions or promote them into old regions
    or both. For a mixed collection, G1 GC additionally moves live objects from the
    most (for lack a better term) “efficient” old regions into free region(s), which
    become part of the old generation.'
