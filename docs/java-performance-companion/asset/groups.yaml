    # 序言


    欢迎 Java® 性能。本书旨在帮助你理解、调优和优化 Java虚拟机 (JVM)。无论你是开发人员、系统管理员还是性能工程师，本书都为你提供构建和维护高性能
    Java 应用程序所需的工具和知识。


    本书的目的是让你对 JVM 如何工作有深入的理解，并了解如何利用其特性实现最大性能。我们将从垃圾回收的基础知识开始，然后进入更高级的主题，如调优、内存管理和性能分析。


    我们还将涵盖特定功能，如服务性代理以及其他用于调试和分析的工具。这些工具对于故障排除和充分利用 JVM 的威力至关重要。


    我们希望本书成为你精通 Java 性能道路上的宝贵资源。


