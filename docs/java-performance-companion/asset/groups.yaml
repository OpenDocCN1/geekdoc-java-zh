    # 使用软引用 (Soft References)


    遗憾的是，JavaDoc (http://docs.oracle.com/javase/8/docs/api/index.html?java/lang/SoftReference.html)
    建议使用软引用来实现内存敏感型对象缓存。这往往会误导用户，让他们认为 JVM 可以管理对象缓存的大小并移除条目——即释放空间——而这取决于垃圾回收器的决定或需要。此外，`-XX:SoftLRUPolicyPerMB`
    的存在也表明，使用软引用作为对象缓存会导致高占用率，从而引发频繁的 GC 事件，在某些情况下甚至会导致内存溢出错误（OOM）。


    为了说明为什么对象缓存的软引用往往会导致意料之外且不受愿的行为，让我们先观察 `-XX:SoftLRUPolicyPerMB`，它控制垃圾回收器保留多少引用。在丢弃软引用之前，对于堆中发现的每兆字节估算内存，并可能确定其中有多少是可达的（或已死亡的），`-XX:SoftLRUPolicyPerMB`
    的值是以毫秒为单位的窗口，决定了自应用程序访问特定软引用以来经过了多久，以决定在当前执行的垃圾回收中是否保留该引用。


    如果你回过来思考这意味着，应用程序运行得越快，你访问未来软引用的频率就越高。例如，假设一个应用程序每秒执行 10,000 次事务。该应用程序每秒处理的软引用将是之前的
    100 倍。分配和晋升速率也大约 100 倍。应用程序执行得越快，垃圾回收器的压力就越大。


    请记住，用于估算“保留哪些软引用”时间窗口的空闲兆字节数，是根据如果所有软引用都被清除并回收后将释放多少空间来计算的。然而，垃圾回收器无法得知软引用将额外保留多少内存。它只能估算保留多少个软引用，而不知道实际上会保留多少内存。


    此外，保留的软引用数量越多（例如在对象缓存中），在垃圾回收结束时剩余的实际空闲内存就越少。GC 可用空间越少，在给定的分配或晋升速率下，垃圾回收器运行得就越频繁。例如，在空闲内存较少时，垃圾回收器的运行频率会更高，且每个单位应用程序工作所完成的工作也会相应增加。


    这意味着软引用在应用程序工作很少或没有工作时是有用的，因为软引用的开销随应用程序运行速率呈平方级增长。你可以控制该平方项前的常数系数，但这是你唯一拥有的控制。这就是为什么
    GC 调优指南建议将该常数系数设置为 `-XX:SoftLRUPolicyPerMB=0`。


    请记住，没有任何 Java 或 JVM 规范规定了上述常数系数的默认值。对于在相同 Java 堆大小和相同负载下运行的相同 Java 应用程序，不同的垃圾回收器实现可能会清除和回收不同数量的软引用。这意味着，如果你使用软引用进行内存敏感型对象缓存，对象缓存的大小可能会在垃圾回收器之间变化，不仅在不同的
    JVM 供应商之间，在同一个 JVM 内的不同垃圾回收器之间也是如此。你可能会在 HotSpot CMS、Parallel 和 G1 GC 之间观察到不同的
    GC 行为，例如活跃数据或堆占用、GC 次数、频率以及持续时间的差异；IBM 的 J9 或 Azure 的 Zing 等 JVM 在软引用回收方面的表现也可能不同。这限制了使用引用的
    Java 应用程序的移植性，因为它在不同垃圾回收器之间切换时行为会发生变化，或者至少需要对常数系数进行 JVM 调优（这可能是非易事的），以实现可的应用程序行为。


    # 参考文献


    - [1] Charlie Hunt and Binu John. Java™ Performance. Addison-Wesley, Upper Saddle
    River, NJ, 2012. ISBN 978-0-13-714252-1.

    - [2] Nirmar S. Arora, Robert D. Blumofe, and C. Greg Plaxton. “Thread Scheduling
    for Multiprogrammed Multiprocessors.” Proceedings of the Tenth Annual ACM Symposium
    on Parallel Algorithms and Architectures. ACM, New York, 1998, pp. 119–29. ISBN
    0-89791-989-0.


    '
