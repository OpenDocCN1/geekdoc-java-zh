    Collector.” *Proceedings of the 2nd International Symposium on Memory Management*.
    ACM, New York, 2000, pp. 143–54. ISBN 978-1-58-263-8.

    - [3] Urs Hölze. “A Fast Write Barrier for Garbage Collectors.” Presented at OOPS93
