  mdcn: "\n\n## 132\n\n## 第 4 章 · 可性代理 (The Serviceability Agent)\n\n![](img/b3ae442318f4d873d1d076953179a125_148_0.png)\n\
    \n图 4.47 死锁检测\n\n要获取关于这些监控器的详情，我们可以使用监控缓存转储（Monitor Cache Dump）工具。参见图 4.48。\n\n\
    有时，查看线程的状态是非常有趣的。我们可以通过检查 Oop Inspector 工具中的线程对象来实现。让我们观察 Oop Inspector 中的 Thread-0\
    \ 和 Thread-1 对象。在 Java Threads 面板中双击这些线程，将打开对应这些线程对象的 Oop Inspector 窗口。图 4.49\
    \ 显示了 Thread-0 的 Oop Inspector，图 4.50 显示了 Thread-1 的 Oop Inspector 窗口。\n\n在这两个快照中，两者的线程状态均为\
    \ 1025。让我们看看 Java HotSpot VM 中的代码，它是如何根据 `threadStatus` 字段计算 Java 线程状态的：\n\n```java\n\
