    # Remembered Sets and Their Importance


    that region is stored in a bitmap. There is a maximum limit to the fine-grained
    PRT, and when it is exceeded, a bit (called the “coarse-grained bit”) is set in
    the coarse-grained bitmap. Once the coarse-grained bit is set, the corresponding
    entry in the fine-grained PRT is deleted. The coarse-grained bitmap is simply
    a bitmap with one bit per region that a set bit means the corresponding region
    might contain a reference to the owning region. So the entire region associated
    with the set bit must be scanned to find the reference. Here a remembered set
    coarsened to a coarse-grained bitmap is the slowest to scan for the garbage collector.
