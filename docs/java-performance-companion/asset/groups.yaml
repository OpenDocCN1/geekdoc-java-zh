    Java 堆的大小倾向于在 512MB 到 2GB 之间，这使得 Parallel GC 的停顿时间保持在较低水平。随着 Java 堆的大小以及老年代中存活对象的数量和大小的增加，让
    GC 的停顿时间变得增长。由于使用了多线程，Parallel GC 减少了停顿时间。


    Parallel GC 在 Java 6 更新中交付，通过使用 -XX:+ParallelGC 启用。它是多线程的全停世界。当 -XX:+ParallelGC
