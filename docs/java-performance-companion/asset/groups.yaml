  - "[PAGE 147]\n\n# Diagnosing a Java-Level Deadlock\n\nLet's look at a small Java\
    \ program that gets locked up in a deadlock soon after the start of its execution:\n\
    \n```\npublic class DeadlockTest extends Thread {\n    public static Object lock1\
    \ = new Object();\n    public static Object lock2 = new Object();\n    private\
    \ int index[];\n    public static void main(String[] a) {\n        Thread t1 =\
    \ new Thread0();\n        Thread t2 = new Thread1();\n        t1.start();\n  \
    \      t2.start();\n    }\n\n    private static class Thread0 extends Thread {\n\
    \        public void run() {\n            synchronized (lock1) {\n           \
    \     System.out.println(\"Thread 0: Holding lock 1...\");\n                try\
    \ { Thread.sleep(10); }\n                catch (InterruptedException e) {\n  \
    \                  System.out.println(\"Thread 0: Waiting for lock 2...\");\n\
    \                    synchronized (lock2) {\n                        System.out.println(\"\
    Thread 0: Holding lock 1 & 2...\");\n                    }\n                }\n\
    \            }\n                }\\        }\n\n    private static Thread Thread1\
    \ extends Thread {\n        public void run() {\nsynchronizedsynchronized (lock2\
    \ {\\ {\n                System.out.println(\"Thread 1: Holding lock 2...\");\n\
    \                try { Thread.sleep(10); }\n                catch (InterruptedException\
    \ e) {\n                    System.out.println(\"Thread 1: Waiting for lock 1...\"\
    );\n                    synchronized (lock1) {\n                        System.out.println(\"\
    Thread 1: Holding lock 2 & 1...\");\n                    }\n                }\n\
    \            }\n        }\n    }\n```\n\nWe start the execution of this program\
    \ and let it run for some time. The program enters deadlock soon after. Then we\
    \ attach HSDB to the hung process. HSDB has a utility called Deadlock Detection\
    \ that is available under the Tools. Upon launching the Deadlock Detection tool,\
    \ we get the message window shown in Figure 4.47.\n\nThis shows that the program\
    \ has one Java-level deadlock involving threads—Thread-0 and Thread-1. Thread-0\
    \ is waiting to lock Monitor 0x00ef2aac, which is held by Thread-1, and Thread-1\
    \ is waiting to lock Monitor 0x00ef0f8c, which is already held by Thread-0; hence\
    \ the deadlock."
