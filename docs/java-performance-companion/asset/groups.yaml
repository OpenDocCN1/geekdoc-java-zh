    ### 内存查看器 (Memory Viewer)


    内存查看器以十六进制格式显示给定内存的内容。详见图 4.28。


    ### 监视 (Monitor)


    此实用程序显示了给定对象的监视情况。这对于排查同步问题非常有用。


    ### 代码查看器 (Code Viewer)


    代码查看器（见图 4.30）显示了 JIT 编译后的字节码。这有助于解决某些特定的崩溃问题。通过查看汇编代码，可以找到问题的根源。


