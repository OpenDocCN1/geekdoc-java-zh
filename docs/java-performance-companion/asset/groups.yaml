  - '[PAGE 129]


    # JDI Implementation


    The SA binary sa-jdi.jar also has an implementation of the Java Debug Interface
    (JDI) that makes it possible for any JDI client (e.g., JDB) to attach to the core
    files and also Java processes using the JDI Connectors provided by this implementation.


    The VM object returned by the attach() method of these connectors is read-only.
    This means that the VM object cannot be modified. So, JDI clients using these
    connectors should not call any JDI methods that are defined to throw a VMCannotBeModifiedException.


    # SA Core Attaching Connector


    This connector can be used by a debugger application to debug a core file. It
    allows multiple debugging sessions on the same core file. It is uniquely identified
    by the name sun.jvm.hotspot.jdi.SACoreAttachingConnector and can be used as in
    the following:


    ```

    $JAVA_HOME/bin/jdb

    -Xbootclasspath/a:$JAVA_HOME/lib/sa-jdi.jar:$JAVA_HOME/lib/tools.jar

    -connect sun.jvm.hotspot.jdi.SACoreAttachingConnector:core=

    $(CORE_FILE),javaExecutable=$(EXE_FILE)

    ```


    # SAPID Attaching Connector


    This connector can be used by a debugger application to debug a process. The process
    to be debug needed not have been started in the debug mode (i.e., with -agentlib:jdwp=-Xdwp),
    and it is permissible for the process to hang. Using this connector, the debugger
    gets a read-only view of the process, and the VM object obtained after attaching
    the process cannot be modified.


    The process is suspended when this connector attaches and is resumed when the
    connector detaches. More than one SAPID Attaching Connector cannot attach to a
    single process simultaneously. This connector is uniquely identified by the name
    sun.jvm.hotspot.jdi.SAPIDAttachingConnector.


    Debuggers can use this connector as in the following to connect and debug a process:


    ```

    $JAVA_HOME/bin/jdb

    -Xbootclasspath/a:$JAVA_HOME/lib/sa-jdi.jar:$JAVA_HOME/lib/tools.jar

    -connect sun.jvm.hotspot.jdi.SAPIDAttachingConnector:pid=2402

    ```'
  - '[PAGE 130]


    # SA Debug Server Attaching Connector


    This connector can be used by a debugger application to debug a process or core
    file on a machine other than the machine on which the debugger is running. This
    connector uses Remote Method Invocation (RMI) to communicate with a debugger server
    running on the remote machine. Before the attach() method on this connector is
    called, the debugger server must be started on the remote machine and tell what
    process or core file is to be debugged. The following needs to be done on the
    remote machine:


    +   Start the RMI registry with sa-jdi.jar in the classpath


    ```

    ${JAVA_HOME}/bin/rmiregistry

    -JXbootclasspath:${JAVA_HOME}/lib/sa-jdi.jar

    ```


    This command creates and starts a remote object registry. An optional port number
    may be specified as the port number at which the registry should be started. If
    no optional port number is specified, the registry is started on port 1099.


    +   Start the debug server on the remote machine, specifying the process or core
    file to be debugged:


    ```

    ${JAVA_HOME}/bin/java -classpath ${JAVA_HOME}/lib/sa-jdi.jar

    sun.jvm.hotspot.jdi.SebugServer <pid> [uniqueID]

    ```


    or


    ```

    ${JAVA_HOME}/bin/java -classpath ${JAVA_HOME}/lib/sa-jdi.jar

    sun.jvm.hotspot.jdi.SebugServer

    <path to the java executable that produced the core file>

    <pathname of the core file to debug> [uniqueID]

    ```


    SA Debug Server starts the RMI registry at port 1099 if the registry is not already
    running.

    an alternative to these two steps is to use the jsebug utility that is shipped
    with the JDK to start the RMI registry and the debug server on the remote machine.

    uniqueID is an optional string. If more than one debug server is to run at the
    same time on the same machine, each must have a different uniqueID string.'
