    <java> <core>

    ```


    DumpJFR 工具会将 JFR 数据导出到当前工作目录下的名为 recording.jfr 的文件中。该记录文件可以使用 Java Mission Control
    进行分析。


    ## JSDB


    JavaScript Debugger（JavaScript 调试器）为 SA  JavaScript 接口。它是一个基于 Mozilla Rhino JavaScript
    引擎的命令行 JavaScript 调试器。


    ```

    java -classpath %JAVA_HOME%\lib\sa-jdi.jar sun.jvm.hotspot.sql1.JSDB 5684

    Attaching to process ID 5684, please wait...

    Debugger attached successfully.

    Client compiler detected.

    JVM version is 24.0-bdb

    jsdb>

    ```


    关于此更多细节可以在开源 HotSpot 仓库中的 `hotspot/agent/doc/jsdb.html` 文件中找到。


    ## 核心转储或崩溃文件 (Core Dump or Crash Files)


    我们一直在讨论 Unix 系统上的核心文件（core files）和 Windows 系统上的崩溃转储文件（crash dump files）。以下是对这些转储文件的简要介绍。


    核心文件或崩溃转储文件是一个二进制文件，由运行程序在特定时刻的状态组成。核心文件通常在程序意外终止时创建，原因是违反了操作系统或硬件的保护机制。操作系统会杀死该程序并创建一个核心文件，程序员后续可以使用该文件来查明出了什么问题。它包含了程序崩溃时所处状态的详细描述。


    也可以从运行中的（非崩溃的）程序创建创建核心/崩溃转储文件。在 Solaris/Linux 上，有一个名为 `gcore` 的工具，可以将运行中或挂起的进程状态转储到文件中。在
    Windows 上，我们可以使用 WinDbg、userdump 或 AdPlus 来收集崩溃转储文件。


    每当难以调试运行中的进程时，核心转储文件对于诊断和调试 Java 程序中的问题非常有用。


    ## 调试传输的核心文件


    有时，核心文件是在一个系统（核心主机）上创建的，而我们需要在另一个系统（调试器主机）上对其进行调试。原生调试器（dbx, gdb）以及 SA 并不总是能成功打开传输的核心文件，其原因是产生核心文件的系统与我们尝试调试的系统之间的内核和共享库不匹配。调试器可能会由于以下两种类型库的
    {匹配而遇到问题：


    - 程序在核心主机上使用的共享库可能与调试器主机上的共享库不同。因此，我们需要让来自核心主机的原始库在调试器系统上可用。

    - 调试器使用系统库（例如 `/usr/lib`、`/lib64` 等目录下的库）来理解系统上运行时链接器和线程库的实现细节。为了成功加载核心文件，我们还需要从核心主机获取系统库，并让它们在调试器主机上可用。


    如果核心文件是崩溃产生的，并且生成了对应的 `hs_err` 文件，我们可以从 `hs_err` 日志文件中获取进程加载的共享库（系统和程序）的列表。


    ## SA 的共享库问题


    当使用 SA 处理传输的核心文件时，我们可能会遇到与 `rtl_db` 或 `libthread_db` 不匹配相关的错误，或者 SA 可能会抛出目标进程缺少
    HotSpot 符号的错误。例如，在下面的例子中，我们正尝试在 Linux/x64 上打开一个从另一个 Linux/x64 系统传输的核心文件：


    ```

    $bash-3.2 $JAVA_HOME/bin/java -classpath $JAVA_HOME/lib/sa-di.jar

    sun.vm.hotspot.CLHSDB JAVA_HOME/bin/java/core.16963

    Opening core file, please wait...

    Unable to open core file

    core.1693:

    Doesn''t appear to be a HotSpot VM (could not find symbol "gHotSpotVMTypes" in
    remote process)

    sun.vm.hotspot.Debugger.ExceptionHandler: Doesn''t appear to be a HotSpot VM

    (could not find symbol "gHotSpotVMTypes" in remote process)

    at sun.vm.hotspot.HotSpotAgent.setupVM(HotSpotAgent.java:405)

    at sun.vm.hotspot.HotSpotAgent.go(HotSpotAgent.java:314)

    at sun.vm.hotspot.HotSpotAgent.attach(HotSpotAgent.java:173)

    at sun.vm.hotspot.CLHSDB.attachDebugger(CLHSDB.java:188)

    at sun.vm.hotspot.CLHSDB.run(CLHSDB.java:55)

    hsdb> Input closed.

    SA is not able to open this transported core file.

    ```


    ## 消除共享库问题


    那么，我们如何解决在使用 SA 打开传输的核心文件时遇到的库问题呢？以下是我们可以采取的消除这些问题的措施：


    1. 将程序使用的所有库从核心主机拷贝到调试器主机，例如拷贝到 `/space/corelibs/`。注意，库可以直接拷贝到 `/space/corelibs/`，也可以拷贝到
    `/space/corelibs/` 下的完整路径。例如，来自核心主机的 `/local/java/lib/bin/server/libjvm.so` 可以直接拷贝到
    `/space/corelibs/` 也可以拷贝到 `/space/corelibs/local/java/lib/bin/server/`。同样，来自核心主机的
    `/usr/lib/libthread.so` 可以拷贝到 `/space/corelibs/` 或 `/space/corelibs/usr/lib/`。如果核心文件是崩溃产生的，并且生成了
    `hs_err` 文件，我们可以从 `hs_err` 日志文件中的“Dynamic Libraries”部分获取进程加载的系统和程序库列表。

    2. 然后，设置环境变量 `SA_ALTROOT` 指向调试器主机上对应的目录，即设置 `SA_ALTROOT=/space/corelibs/`。对于我们之前尝试打开的核心文件：


    ```

    -bash-3.2 $JAVA_HOME/bin/java -classpath $JAVA_HOME/lib/sa-di.jar

    sun.vm.hotspot.CLHSDB JAVA_HOME/bin/java/core.16963

    Opening core file, please wait...

    hsdb

    ```


    通过 `SA_ALTROOT`，SA 会从 `/space/corelibs/` 获取所需的库，从而成功打开核心文件。


