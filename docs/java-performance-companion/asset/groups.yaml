    ```


    在这里，我们再次寻找 Diff >> 0 以及 Max、Min 或 Avg 的显著差异。


    > Tip

    > 差异（Diff）显示了组成并行阶段的所有计时活动。高差异通常意味着工作在工作线程之间没有平衡。这一知识是分析的起点，理想情况下，更深入的调查将识别潜在原因，这可能需要重构
    Java 。


    另一个需要注意的是工作线程是否被困于处理单个根。我们遇到过这样的问题：当加载的类很多时，被视为单个根的系统字典最终会占用一个工作线程。当工作线程延迟“结束”（termination，在本节稍后解释）时，它会被认为被阻塞了。


    # Remember Sets and Processed Buffers


    ```

    [Update RS (ms): Min: 12.8, Avg: 13.0, Max: 13.2, Diff: 0.4, Sum: 103.6]

    Processed Buffers: Min: 15, Avg: 16.0, Max: 17, Diff: 2, Sum: 128]

    ```


    正如第 2 章“深度解析 First 垃圾收集”所述，G1 GC 使用记忆集（RSets）来帮助维护和跟踪进入拥有相应 RS 的 G1 区域的引用。正如第
    2 章讨论，并发清理线程的任务扫描日志缓冲区并更新脏卡区域的 RS。为了补充并发清理线程执行的工作，任何已记录但未被清理线程处理的缓冲区将在收集停顿的并行阶段处理并由工作线程处理。这些缓冲区在日志片段中被称为
    Processed Buffers。


