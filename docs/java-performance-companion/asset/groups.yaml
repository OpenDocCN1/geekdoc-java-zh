    # Using Soft References


    It is unfortunate that the soft references JavaDoc (http://docs.oracle.com/javase/8/docs/api/index.html?java/lang/SoftReference.html)
    recommends their for implementing memory-sensitive object caches. This often misleads
    users into thinking that the JVM can manage the size of the object cache and remove
    entries—that is, free space—as the garbage collector decides or needs. Plus, the
    existence of -XX:SoftLRUPolicyPerMB suggests that the use of soft references for
    an object cache leads to high occupancy, which in turn causes frequent GC events,
    and in some cases leads to out-of-memory errors.


    To illustrate why soft references for object caches tends to result in unexpected
    and undesirable behavior, let''s begin looking at -XX:SoftLRUPolicyPerMB, which
    controls how many references are kept alive by the garbage collector. For every
    megabyte of estimated memory found in the heap before getting the rid of soft
    references, and potentially figuring out how much is reachable (or is dead), the
    -XX:SoftLRUPolicyPerMB value in milliseconds window of how long it has been since
    the application accessed a given reference''s soft yes/no for keeping it alive
    in a currently executing garbage collection.


    If you step back and think what this means, the faster an application runs, the
    more frequently you can access soft references to be. For example, say an application
    is executing 10,000 transactions per second. That application is 100 times more
    soft references per second than it was. The allocation and promotion rates are
    also roughly 100 times greater. The faster the application executes, the harder
    it makes the garbage collector.


    Keep in mind that the amount of free megabytes used to estimate the "which soft
    references to keep" time window is computed on how much space will be free if
    all soft references were to be cleared and reclaimed. However, the garbage collector
    has no way of knowing how much additional memory will be kept alive by a soft
    reference. It can only make an estimate of how many soft references keep alive
    without knowing how much memory will actually retain.


    Also, the larger the number of soft references are kept alive, say in an object
    cache, the less actual free memory will remain at the end of a garbage collection.
    The less the amount of space available for a GC, the more frequently the garbage
    collector will run for a given allocation or promotion rate. For example, at times
    less free memory, the garbage collector will run times more frequently and will
    do approximately times more work per unit of application work.


    What this is that soft references are useful when an application is little or
    no work, because the overhead of soft reference use grows at square of the rate
    of application. You can control the constant multiplier ahead of square, but that
    is the only control you have. This is which GC tuning guides suggests setting
    this constant multiplier to using -XX:SoftLRUPolicyPerMB=0.


    Keep in mind there is no Java or JVM specification that specifies a default value
    for the constant multiplier just described. A garbage collector implementation
    can clear and reclaim a differing number of soft references for the same Java
    application executing with the same'
