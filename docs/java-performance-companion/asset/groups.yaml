    # Core Dump or Crash Files


    We have been talking about the core files on Unix systems and the crash dump files
    on Windows systems. This is a quick briefing on what these dump files are.


    A core or crash dump file is a binary file that consists of the state of the running
    program at a specific time. A core file is generally created when a program terminates
    unexpectedly, due to a violation of the operating system''s or hardware''s protection
    mechanisms. The operating system kills the program and creates a core file that
    programmers can later use to figure out what went wrong. It contains a detailed
    description of the state that the program was in when it died.


    It is also possible to create a core/crash dump file from a running (non-crashing)
    program. On Solaris/Linux, there is a tool called gcore that can dump the state
    of a running or hung process into a file. On Windows, we can use WinDbg, userdump,
    or AdPlus to collect the crash dump files.


    Core dump files are very useful for diagnosing and debugging problems in Java
    programs whenever it is difficult to debug the live processes.'
  - '[PAGE 125]


    # Debugging Transported Core Files


    Sometimes a core file is created on one system (core host) and we need to debug
    it on some other system (debugger host). Native debuggers (dbx, gdb) as well as
    the SA are not always able to open the transported core files successfully, the
    reason being a mismatch in the kernel and shared libraries between the system
    where the core was produced and the one where we are trying to debug it. Debuggers
    may face problems due to the mismatch of the following two types of libraries:


    +   - The shared libraries used by the program on the core host may not be the
    same as those on the debugger host. So we need to make the original libraries
    from the core host available on the debugger system.

    - Debuggers use the system libraries (e.g., libraries in /usr/lib,/lib64, etc.)
    to understand the implementation details of the runtime linker and the threads
    library on the system. To load the core files successfully we also need to get
    the system libraries from the core host and make them available on the debugger
    host.


    If the core file was produced with a crash and a crash hs_err file was also generated,
    we can get the list of the shared libraries (system and program) loaded by the
    process from the hs_err log file.


    # Shared Library Problems with the SA


    When using SA with transported core files, we may get errors related to rtl_db
    or libthread_db mismatch, or SA may throw errors that HotSpot symbol is missing
    in the target process. For example, in the following we are trying to open a core
    file on a Linux/x64 machine transported from another Linux/x64 system:


    ```

    $bash-3.2 $JAVA_HOME/bin/java -classpath $JAVA_HOME/lib/sa-di.jar

    sun.vm.hotspot.CLHSDB JAVA_HOME/bin/java/core.16963

    Opening core file, please wait...

    Unable to open core file

    core.1693:

    Doesn''t appear to be a HotSpot VM (could not find symbol "gHotSpotVMTypes" in
    remote process)

    sun.vm.hotspot.Debugger.ExceptionHandler: Doesn''t appear to be a HotSpot VM

    (could not find symbol "gHotSpotVMTypes" in remote process)

    at sun.vm.hotspot.HotSpotAgent.setupVM(HotSpotAgent.java:405)

    at sun.vm.hotspot.HotSpotAgent.go(HotSpotAgent.java:314)

    at sun.vm.hotspot.HotSpotAgent.attach(HotSpotAgent.java:173)

    at sun.vm.hotspot.CLHSDB.attachDebugger(CLHSDB.java:188)

    at sun.vm.hotspot.CLHSDB.run(CLHSDB.java:55)

    at sun.vm.hotspot.CLHSDB.main(CLHSDB.java:35)

    hsdb> Input stream closed.

    ```


    SA is not able to open this transported core file.'
