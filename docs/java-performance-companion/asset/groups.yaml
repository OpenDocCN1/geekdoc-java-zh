    \ variable LIBSPROC_DEBUG. Setting LIBSPROC_DEBUG also sets the LIBSPROC_DEBUG\
    \ variable. | Solaris and Linux |\n| SA_IGNORE_THREAD | When opening transported\
    \ core files, if we are getting libthread_db_relative failures due to mismatch\
    \ of libraries in this environment variable. With this, SA ignores libthread_db\
    \ failure and can open the core files successfully, but we will not get any thread-related\
    \ information. | Solaris and Linux |\n\n## JDI Implementation\n\nThe SA binary\
    \ sa-jdi.jar also has an implementation of the Java Debug Interface (JDI) that\
    \ makes it possible for any JDI client (e.g., JDB) to attach to the core files\
    \ and also Java processes using the JDI Connectors provided by this implementation.\n\
    \nThe VM object returned by the attach() method of these connectors is read-only.\
    \ This means that the VM object cannot be modified. So, JDI clients using these\
    \ connectors should not call any JDI methods that are defined to throw a VMCannotBeModifiedException.\n\
    \n## SA Core Attaching Connector\n\nThis connector can be used by a debugger application\
    \ to debug a core file. It allows multiple debugging sessions on the same core\
    \ file. It is uniquely identified by the name sun.jvm.hotspot.jdi.SACoreAttachingConnector\
    \ and can be used as in the following:\n\n```\n$JAVA_HOME/bin/jdb\n-Xbootclasspath/a:$JAVA_HOME/lib/sa-jdi.jar:$JAVA_HOME/lib/tools.jar\n\
    -connect sun.jvm.hotspot.jdi.SACoreAttachingConnector:core=\n$(CORE_FILE),javaExecutable=$(EXE_FILE)\n\
    ```\n\n## SAPID Attaching Connector\n\nThis connector can be used by a debugger\
    \ application to debug a process. The process to be debug needed not have been\
    \ started in the debug mode (i.e., with -agentlib:jdwp=-Xdwp), and it is permissible\
    \ for the process to hang. Using this connector, the debugger gets a read-only\
    \ view of the process, and the VM object obtained after attaching the process\
    \ cannot be modified.\n\nThe process is suspended when this connector attaches\
    \ and is resumed when the connector detaches. More than one SAPID Attaching Connector\
    \ cannot attach to a single process simultaneously. This connector is uniquely\
    \ identified by the name sun.jvm.hotspot.jdi.SAPIDAttachingConnector.\n\nDebuggers\
    \ can use this connector as in the following to connect and debug a process:\n\
    \n```\n$JAVA_HOME/bin/jdb\n-Xbootclasspath/a:$JAVA_HOME/lib/sa-jdi.jar:$JAVA_HOME/lib/tools.jar\n\
    -connect sun.jvm.hotspot.jdi.SAPIDAttachingConnector:pid=2402\n```\n\n## SA Debug\
    \ Server Attaching Connector\n\nThis connector can be used by a debugger application\
    \ to debug a process or core file on a machine other than the machine on which\
    \ the debugger is running. This connector uses Remote Method Invocation (RMI)\
    \ to communicate with a debugger server running on the remote machine. Before\
    \ the attach() method on this connector is called, the debugger server must be\
    \ started on the remote machine and tell what process or core file is to be debugged.\
    \ The following needs to be done on the remote machine:\n\n- Start the RMI registry\
    \ with sa-jdi.jar in the classpath\n```\n${JAVA_HOME}/bin/rmiregistry -Xbootclasspath:${JAVA_HOME}/lib/sa-jdi.jar\n\
    ```\nThis command creates and starts a remote object registry. An optional port\
    \ number may be specified as the port at which the registry should be started.\
    \ If no port number is specified, the registry is started on port 99.\n\n- Start\
    \ the debug server on the remote machine, specifying the process or core file\
    \ to be debugged:\n```\n${JAVA_HOME}/bin/java -classpath ${JAVA_HOME}/lib/sa-jdi.jar\
    \ sun.jvm.hotspot.jdi.DebugServer <pid> <uniqueID>\n```\nor\n```\n${JAVA_HOME}/bin/java\
    \ -classpath ${JAVA_HOME}/lib/sa-jdi.jar sun.jvm.hotspot.jdi.DebugServer <path\
    \ to the java executable that produced the core file> <pathname of core file to\
    \ debug> <uniqueID>\n```\nSA Debug Server starts the RMI registry at port 99 if\
    \ the registry is not already running. An alternative to these two steps is to\
    \ use the utility shipped with the JDK to start the RMI registry and the debug\
    \ server on the remote machine. If more than one debug server is to run at the\
    \ same time on the same machine, each must have a different uniqueID string.\n\
    \n## Extending Serviceability Tools\n\nThe Serviceability Agent APIs provide a\
    \ class sun.jvm.hotspot.tools.Tool which can be extended to write own tools. Here\
    \ is a simple tool extending the sun.jvm.hotspot.tools.Tool class that prints\
    \ the system properties of the target VM. This tool is part of the sa-jdi.jar\
    \ file:\n\n```java\npackage sun.jvm.hotspot.tools;\n\nimport java.io.PrintStream;\n\
    import java.util.*;\nimport sun.jvm.hotspot.runtime.*;\n\npublic class SysPropsDumper\
    \ extends Tool {\n\n    public void run() {\n        Properties sysProps = VM.getProperties();\n\
    \        PrintStream out = System.out;\n        if (sysProps != null) {\n    \
    \        Enumeration keys = sysProps.keys();\n            while (keys.hasMoreElements())\
    \ {\n                Object key = keys.nextElement();\n                out.print(key\
    \ + \"=\" \");\n                out.println(sysProps.get(key));\n            }\n\
    \        } else {\n            out.println(\"System Properties not available!\"\
    );\n        }\n    }\n\n    public static void main(String[] args) {\n       \
    \ SysPropsDumper pd = new SysPropsDumper();\n        pd.start(args);\n       \
    \ pd.stop();\n    }\n}\n```\n\nTo write our tool, we need to extend it from the\
    \ Tool class and implement the run() method. In the preceding example, using the\
    \ VM class we obtain the system properties and then print those properties to\
    \ the standard output. Let's compile and run this tool against a running process\
    \ and see what the output looks like:\n\n```\nD:\\>javac -classpath %JAVA_HOME%\\\
    lib\\sa-jdi.jar sun/jvm/hotspot/tools/SysPropsDumper.java\nD:\\>java -classpath\
    \ %JAVA_HOME%\\lib\\sa-jdi.jar sun.jvm.hotspot.tools.SysPropsDumper 5880\n```\n\
