    There are several types of regions in G1. Available regions are currently unused.
    Eden regions constitute the generation eden space, and survivor regions constitute
    the young survivor space. The set of all eden and survivor regions together is
    the young generation. The number of eden or survivor regions can change from one
    GC to the next, using young, mixed, or full GCs. Old generation regions comprise
    most of the old generation. Finally, humongous regions are considered to be part
