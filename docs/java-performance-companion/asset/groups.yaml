    # -XX:G1MixedGCCountTarget


    Sets the target value for many mixed GCs should be performed after a concurrent
    cycle. The default value is 8.

    Old regions normally take a longer to collect than young regions. Allowing more
    mixed GCs after a concurrent cycle allows G1 to spread out the reclamation of
    the old regions over more collections. Increasing -XX:G1MixedGCCountTarget also
    means that it will take longer until a new concurrent cycle is started. If GC
    pauses times are not used, it may help to increase -XX:G1MixedGCCountTarget.


    # -XX:+G1PrintLivenessInfo


    This is a diagnostic VM option, and as it needs to be enabled with -XX:+UnlockDiagnosticVMOptions.
    When enabled, it will print liveness information for each region on the heap.
    The information includes usage, the size of the remembered set, and "GC efficiency",
    which is a measure of how valuable it is to collect this region. The information
    is logged after a marking cycle has completed and also after the regions have
    been sorted for inclusion in the collection set.

    The information logged by -XX:+G1PrintLivenessInfo can be useful when trying to
    understand the heap usage and identify issues with remembered sets. Since it logs
    one line for each region in the heap, this can be hard to manage for large heaps.


    # -XX:G1ReservePercent


    To reduce the risk of getting a promotion failure, G1 reserves some memory for
    promotions. This memory will not be used for the young generation. By default
    G1 keeps 10 percent of the heap reserved for this purpose.

    On a large heap with a live set, 10 percent of the heap may be too much to reserve.
    Reducing this value can leave more memory for the young generation and lead to
    longer times between GCs, which normally increases throughput performance.


    # -XX:+G1SummarizeRStats


    This is a diagnostic VM option, and as it needs to be enabled with -XX:+UnlockDiagnosticVMOptions.
    When enabled, it will print a detailed summary about the remembered sets when
    the VM exits. In combination with -XX:G1SummarizeRStatsPeriod this summary can
    be printed periodically instead of just at VM exit.

    If remembered set issues are suspected, this can be a useful tool to analyze them.'
