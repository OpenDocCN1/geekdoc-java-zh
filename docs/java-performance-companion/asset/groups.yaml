    ## 并发清理线程与屏障


    先进的 RSet 结构伴随着其自身的维护成本，表现为写屏障（writer barriers）和并发“清理”线程。


    屏障是原生代码片段，当受托管运行时执行某些语句时就会执行。屏障在垃圾回收算法中的应用已为人知，执行屏障代码的成本也是由于原生指令路径长度的增加而确定的。


    OpenJDK HotSpot 的 Parallel Old 和 CMS GC 使用写屏障，该屏障在 HotSpot JVM 执行对象写入操作时执行：


    ```

    object.field = some_other_object;

    ```


    屏障通过更新一种类似卡表（card-table）的结构 [2] 来跟踪跨代引用。卡表在 Minor垃圾回收（minor GC）期间被扫描。写屏障算法基于 Urs
    Hölle 的快速写屏障 [3]，它将屏障开销降低到编译后代码中的两条额外指令。


    G1 GC 采用了写前屏障（pre-write）和写后屏障（post-write）。前者在实际应用赋值之前执行，并在并发标记部分介绍；而后者在赋值后执行，并在此处进一步描述。


    每当引用更新时，G1 GC 都会触发写屏障。例如，考虑此伪代码中的更新：


    ```

    object.field = some_other_object;

    ```


    此赋值将触发屏障代码。由于屏障是在对任何引用写入后触发的，因此它被称为“写后”屏障。写屏障序列


    ## 记忆集及其重要性


    序列可能会变得非常昂贵，应用程序的吞吐量会随屏障代码复杂性的增加比例下降；因此，G1 GC 只需执行最少的工作来确定引用更新是否为跨区域更新，因为跨区域引用更新需要记录在所属区域的
    RSet 中。对于 G1 GC 而言，屏障代码包含了一种在“实践中的老年代垃圾回收” [4] 中简要讨论的过滤技术，该技术涉及一个简单的检查，当更新位于同一区域时，该检查值为零。伪代码说明了
    G1 GC 的写屏障：


    ```

    (&object.field XOR &some_other_object) >> RegionSize

    ```


    每当发生跨区域更新时，G1 GC 都会将相应的卡放入名为“日志缓冲区”（log buffer）或“脏卡队列”（dirty card queue）的缓冲区。在我们的更新示例中，包含对象的卡记录在日志缓冲区中。


    ## 提示


    并发清理线程是专门用于维护记忆集的线程，它们通过扫描已填充日志缓冲区中的记录卡，并更新这些区域的记忆集来完成任务。清理线程的最大数量由 -XX:G1ConcRefinementThreads
    决定。从 JDK 8u45 开始，-XX:G1ConcRefinementThreads 未在命令行设置，而是通过工程化手段设置为与 -XX:ParallelGCThreads
    相同。


    一旦日志缓冲区达到容量，它就会被退役并分配一个新的日志缓冲区。随后卡的入队将填充此新缓冲区。退役的缓冲区被放在全局列表中。一旦清理线程在全局列表中找到项，它们就开始并发处理这些退役缓冲区。退役缓冲区被放置后，清理线程开始并发处理这些缓冲区。清理线程始终是活跃的，G1
    GC 以分层方式处理退役缓冲区。通过标记 -XX:G1RefinementGreen, -XX:G1RefinementYellow, -XX:G1RefinementRed
    为缓冲区设置阈值。当清理线程跟不上填充缓冲区的速度时，执行线程会参与帮助。在这种情况下，新位将替换旧位，以处理填充的日志缓冲区。


