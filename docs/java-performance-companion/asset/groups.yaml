    requirements. A batch processing is a good example since it is noninteractive.
    When you start a batch execution, you expect it to run as fast as possible.

    - 2. If worst-case latency requirements can be met, Parallel GC will offer the
    best throughput. Worst-case latency requirements include both worst-case pause
    times, and how frequently the occur. For example, an application may have a latency
    requirement of “pauses” that exceed 500ms shall not occur more than once every
    two hours, and all pauses shall not exceed three seconds. interactive application
    with a sufficiently small live data size that meet GC-induced latency requirements
    is a good example that fits this. However, since the amount of live data is highly
    correlated with the size of the heap, the types of applications falling into this
    category are limited.


    # 4 Chapter 1 Garbage First Overview


    ![](img/b3ae442318f4d873d1d076953179a125_20_0.png)


    **Figure 1.1** How application threads are interrupted by GC threads when Parallel
    GC is used


    Parallel GC works well for applications that meet these requirements. For applications
    that do not meet these requirements, pause times can become excessively long,
    since a full GC must mark the entire Java heap and also compact the old generation.
    As a result, pause times tend to increase with increased Java heap sizes.


    Figure 1.1 illustrates how application threads (gray arrows) are stopped and the
    GC threads (black arrows) take over to do the garbage collection work. In this
    diagram there are eight GC threads and eight Java application threads, although
    in most applications the number of application threads usually exceeds the number
    of GC threads, especially in cases where some application threads may be idle.
    When a GC occurs, all application threads are stopped, and multiple GC threads
    execute GC.


    # Serial GC


    Serial GC is very similar to Parallel GC except that it does all its work in a
    single thread. The single-threaded approach allows for a less complex GC implementation
    and requires few external runtime data structures. The memory footprint is lowest
    of all HotSpot collectors. The challenges with Serial GC are similar to those
    for Parallel GC. Pause times can be long, and grow more or less linearly with
    the heap size and amount of live data. In addition, with Serial GC the GC pauses
    are more pronounced, since the GC work is done in a single thread.

