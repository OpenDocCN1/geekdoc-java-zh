    # 术语


    在本节中，我们定义了并行（parallel）、全停世界（stop-the-world）和并发（concurrent）这三个术语。“并行”意味着多线程的垃圾回收操作。当一个
    GC 事件被描述为并行时，意味着使用多个线程来执行它。当一个垃圾回收器被描述为并行时，意味着它使用多个线程来执行垃圾回收。


