    GC Worker Start 和 GC Worker End 分别标记了并行阶段的开始和结束时间戳。GC Start 的最小值是第一个工作线程启动的时间；同样，GC
    Worker 的最大值是最后一个工作线程完成所有任务的时间。这些行还包含毫秒的 Avg 和 Diff 值。在这些行中需要关注的是：


