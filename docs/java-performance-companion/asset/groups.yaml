    This attaches DumpJFR to a core file to extract the Java Flight Recorder information:


    ```

    java -cp $JAVA_HOME/lib/sa-jdi.jar sun.jvm.hotspot.DumpJFR

    <java> <core>

    ```


    The DumpJFR tool dumps the JFR data to a file called recording.jfr in the current
    working folder. This recording file can be analyzed using Java Mission Control.


    ## JSDB


    JavaScript Debugger provides a JavaScript interface to the SA. It is a command-line
    JavaScript Debugger based on Mozilla''s Rhino JavaScript Engine.


    ```

    java -classpath %JAVA_HOME%\lib\sa-jdi.jar sun.jvm.hotspot.sql1.JSDB 5684

    Attaching to process ID 5684, please wait...

    Debugger attached successfully.

    Client compiler detected.

    JVM version is 24.0-bdb

    jsdb>

    ```


    More details on this can be found in the open-source HotSpot repository in the
    file hotspot/agent/doc/jsdb.html.


    ## Core Dump or Crash Files


    We have been talking about the core files on Unix systems and the crash dump files
    on Windows systems. This is a quick briefing on what these dump files are.


    A core or crash dump file is a binary file that consists of the state of the running
    program at a specific time. A core file is generally created when a program terminates
    unexpectedly, due to a violation of the operating system''s or hardware''s protection
    mechanisms. The operating system kills the program and creates a core file that
    programmers can later use to figure out what went wrong. It contains a detailed
    description of the state that the program was in when it died.


    It is also possible to create a core/crash dump file from a running (non-crashing)
    program. On Solaris/Linux, there is a tool called gcore that can dump the state
    of a running or hung process into a file. On Windows, we can use WinDbg, userdump,
    or AdPlus to collect the crash dump files.


    Core dump files are very useful for diagnosing and debugging problems in Java
    programs whenever it is difficult to debug the live processes.


    ## Debugging Transported Core Files


    Sometimes a core file is created on one system (core host) and we need to debug
    it on some other system (debugger host). Native debuggers (dbx, gdb) as well as
    the SA are not always able to open the transported core files successfully, the
    reason being a mismatch in the kernel and shared libraries between the system
    where the core was produced and the one where we are trying to debug it. Debuggers
    may face problems due to the mismatch of the following two types of libraries:


    - The shared libraries used by the program on the core host may not be the same
    as those on the debugger host. So we need to make the original libraries from
    the core host available on the debugger system.

    - Debuggers use the system libraries (e.g., libraries in /usr/lib,/lib64, etc.)
    to understand the implementation details of the runtime linker and the threads
    library on the system. To load the core files successfully we also need to get
    the system libraries from the core host and make them available on the debugger
    host.


    If the core file was produced with a crash and a crash hs_err file was also generated,
    we can get the list of the shared libraries (system and program) loaded by the
    process from the hs_err log file.


    ## Shared Library Problems with the SA


    When using SA with transported core files, we may get errors related to rtl_db
    or libthread_db mismatch, or SA may throw errors that HotSpot symbol is missing
    in the target process. For example, in the following we are trying to open a core
    file on a Linux/x64 machine transported from another Linux/x64 system:


    ```

    $bash-3.2 $JAVA_HOME/bin/java -classpath $JAVA_HOME/lib/sa-di.jar

    sun.vm.hotspot.CLHSDB JAVA_HOME/bin/java/core.16963

    Opening core file, please wait...

    Unable to open core file

    core.1693:

    Doesn''t appear to be a HotSpot VM (could not find symbol "gHotSpotVMTypes" in
    remote process)

    sun.vm.hotspot.Debugger.ExceptionHandler: Doesn''t appear to be a HotSpot VM

    (could not find symbol "gHotSpotVMTypes" in remote process)

    at sun.vm.hotspot.HotSpotAgent.setupVM(HotSpotAgent.java:405)

    at sun.vm.hotspot.HotSpotAgent.go(HotSpotAgent.java:314)

    at sun.vm.hotspot.HotSpotAgent.attach(HotSpotAgent.java:173)

    at sun.vm.hotspot.CLHSDB.attachDebugger(CLHSDB.java:188)

    at sun.vm.hotspot.CLHSDB.run(CLHSDB.java:55)

    hsdb> Input closed.

    SA is not able to open this transported core file.


    ## Eliminate Shared Library Problems


    So, how do we share library problems encountered when opening transported core
    files with the SA? Here is what we can do to eliminate these:


    1. Copy all the libraries used by the program from the core host to the debugger
    host, say, to /space/corelibs/ Note that the libraries can be copied directly
    under /space/corelibs/ or to a full path under /space/corelibs/. For example,
    /local/java/lib/bin/server/libjvm.so from the core host can be copied directly
    under /space/corelibs/ and under /space/corelibs/local/java/lib/bin/server/. Similarly,
    /usr/lib/libthread.so from the core host can also be copied either to /space/corelibs/
    or to /space/corelibs/usr/lib/ on the debugger host. The list of required library
    files can be obtained from the hs_err file under "Dynamic Libraries" or by using
    the native debuggers as gdb, dbx, and WinDbg.

    2. Then set the SA environment variable SA_ALTROOT to the folder containing shared
    libraries on the debugger host, that is, set SA_ALTROOT=/space/corelibs/.


    Now, for the core file.16963 we tried to open in the previous section, copied
    all the required libraries from the core host to the system we want to open the
    core with SA and set the environment variable SA_ALTROOT:


    ```

    -bash-3.2 export SA_ALTROOT=/space/corelibs/

    -bash-3.2 $JAVA_HOME/bin/java -classpath $JAVA_HOME/lib/sa-jdi.jar sun.jvm.hotspot.CLHSDB
    $JAVA_HOME/bin/java.core.16963

    Opening core file, please wait...

    hsdb

    Heap Parameters:

    ParallelHeap [PSYoungGen [ eden = 0x00000000dea0000,0x00000000dea0000,0x0000000faa8000],
    from = 0x0000000faa8000,0x0000000fb64975], to = 0x0000000fd540000,0x0000000fd540000,0x00000001000000]
    ] PSOldGen [ 0x0000000bfe160000,0x0000000bfe12010,0x000000dea0000] ] PSPermGen
    [ 0x00000000bac0000,0x00000000bc0942c,0x00000000bc200000] ]

    hsdb

    ```


    With SA_ALTROOT, SA picks up the required libraries from /space/corelibs/ and
    thus can open the core file successfully.


    ## System Properties for the Serviceability Agent


    There are some system properties that can be used to define the runtime behavior
    of the SA tools. These are shown in Table 4.2.


    Table 4.2 Serviceability Agent System Properties


    | System Property | Remarks | Applicable Platforms |

    | :--- | :--- | :--- |

    | sun.jvm.runtime.disableVersionCheck | Disable the version check of the SA tools
    against the HotSpot version being analyzed. | All |

    | sun.jvm.hotspot.debugger.useProcDebugger (Applicable only in JDK 6 and its updates)
    | Tell SA to use the /proc interface for reading bits from core. The other interface
    uses dbx as back end to attach to process/core and read data. This property is
    applicable only to SA in JDK 6 and is not present in JDK 7. ProcDebugger is the
    default | Solaris |

    | sun.jvm.hotspot.debugger.useWindDebugger (Applicable only in JDK 6 and its updates)
    | Tell SA to use the Windows Debug Engine (dbg.dll) interface for reading bits
    from processes and dump files. This interface works only for live processes and
    talks to the Windows Debug Server (FwDbgSvr) over a socket to implement attach/detach
    and read bits from process memory. This property is applicable only to SA in JDK
    6 and is not present in JDK 7. WinDbgDebugger is the default native interface
    in | Windows |

    | sun.jvm.hotspot.debugger.imgPath | Set the path where SA on Windows should look
    for .exe and .dll files. | Windows |

    | sun.jvm.hotspot.debugger.windbg.symbolPath | Set the path where SA on Windows
    should look for .pdb and .db symbol files. | Windows |

    | sun.jvm.hotspot.debugger.windbg.disableNativeLookup | Specify if SA on Windows
    should parse the DLL symbol table in the Java code or use WinDbg’s native lookup
    facility. By default, SA uses native lookup so that it can take advantage of .pdb
    files, if available. | Windows |

