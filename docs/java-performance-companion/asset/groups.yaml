    # Chapter 3 - Garbage First Garbage Collector Performance Tuning


    A concurrent cycle is being requested since the heap occupancy crossed the marking
    threshold due to a humongous allocation request. The request was for 2,097,168
    bytes, which is far larger than the 1MB G1 heap region size set by G1 at JVM start-up.


    - - are times when evacuation failures are caused by not having enough space in
    the survivor regions for newly promoted objects. When you observe this happening,
    try increasing -XX:G1ReservePercent. The reserve percent creates a false ceiling
    for the reserved space to accommodate any variation in promotion patterns. The
    default value is 10 percent of the total Java heap and is limited by G1 to 50
    percent of the total Java heap since more would amount to a very large amount
    of wasted space.


    # Reference Processing


    Garbage collection must treat Java reference objects—phantom references, soft
    references, and weak references—differently from other Java objects. Reference
    objects require more work to collect than non-reference objects.


    In this section, you will learn how to identify if the time required to perform
    reference processing during a G1 garbage collection pause is an issue for your
    application and how to tune G1 to reduce this overhead, with tips for isolating
    which reference object type is inducing the most overhead. Depending on the application
    and its time requirements, refactoring the application’s source code may be required
    to reduce reference processing overhead.


    > Tip Java Platform, Standard Edition (Java SE) API documentation for each of
    the reference object types (http://docs.oracle.com/java/8/docs/api) and the java.lang.ref
    package APIs for phantom reference, soft reference, and weak reference are both
    good sources for understanding how each reference object type behaves and how
    and when they are garbage collected.


    # Observing Reference Processing


    There are several major activities associated with garbage collecting reference
    objects: discovering the reference objects, pushing them onto the JVM’s reference
    queue, and pulling them off the reference queue. When using G1 with -XX:+PrintGCDetails,
    the time spent queuing reference objects is reported separately from the time
    spent processing them. The two times are reported in the Other section of the
    log on both young and mixed GCs:


    ```

    [Other: 9.9 ms]

    [Choose Cset: 0.0 ms]

    [Ref Proc: 8.2 ms]

    [Ref Enq: 0.3 ms]

    [Redirty Cards: 0.7 ms]

    [Humongous Reclaim: 0.0 ms]

    [Free Cset: 0.5 ms]

    ```


    Ref Proc is the time processing reference objects, and Ref Enq is the time spent
    queuing reference objects. As the example suggests, the time spent in Ref Enq
    is as long as the time spent in Ref Proc. In fact, we have yet to see an application
    that consistently has higher Ref Enq times. If it happens, it means the amount
    of effort required to process a reference is very small relative to its enqueuing
    time, which is unlikely for most reference object types.


    G1 also reports processing activity during the remark phase when G1''s concurrent
    cycle. Using -XX:+PrintGCDetails, the log output from remark will include reference
    processing time:


    ```

    [GC remark Finalizing Marking, 0.000722 secs][GC ref-proc, 0.0129203 secs]

    [Unloading, 0.0160048 secs, 0.0308670 secs]

    ```


    -XX:+PrintReferenceGC reports details for each reference object type at collection
    and is very useful for isolating a specific reference object type that the collector
    is spending the most time processing.


    ```

    [GC Finalizing Marking, 0.000322 secs][GC ref-proc [SoftReference, 2 refs, 0.0052296
    secs][WeakReference, 3264308 refs, 0.0524238 secs]

    [FinalReference, 215 refs, 0.0028225 secs][PhantomReference, 1787 refs, 0.0050046
    secs][JNI Weak Reference, 0.0007776 secs, 0.0932150 secs]

    [Unloading, 0.0060031 secs, 0.2210401 secs]

    ```


    Note that G1 is the only HotSpot GC that reports processing times with -XX:+PrintGCDetails.
    However


    As a general guideline, Ref times in PrintGCDetails output that are more than
    10 percent of the total GC pause for a G1 young or mixed GC cause to tune the
    garbage collector''s reference processing. For G1 remark events it is common to
    see a larger percentage of time spent in reference processing since the remark
    phase of the concurrent cycle is when the bulk of reference objects discovered
    during an old generation collection cycle are processed. If the elapsed time for
    the G1 remark exceeds your pause time and a majority of time is spent in reference
    processing, as described in the next section.


