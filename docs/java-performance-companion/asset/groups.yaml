  - '[PAGE 165]


    sense since Parallel GC is the throughput GC in contrast to G1, which is intended
    to be a more balanced throughput, latency, and memory footprint type GC.


    # -XX:+HeapDumpBeforeGC


    When this command-option is enabled, an hprof file is created just prior to a
    full GC starting. The hprof file is created in the directory where the HotSpot
    VM is launched.


    Comparing the contents of the Java heap before and after a full GC using this
    command-line option in conjunction with -XX:+HeapDumpFullGC can give a good indication
    of memory leaks and other issues.


    # -XX:+HeapDumpAfterFullGC


    When this command-option is enabled, an hprof file is created right after the
    full GC has completed.


    Comparing the contents of the Java heap before and after a full GC using this
    command-line option with -XX:+HeapDumpFullGC can give a good indication of memory
    leaks and other issues.


    # -XX:InitiatingHeapOccupancyPercent


    Sets the value for when a concurrent GC in G1 should be started. The default value
    is 45. In other words, a GC measures the occupancy of the old generation space
    and compares it to the current heap size. If the occupancy of the old generation
    space reaches or exceeds theatingHeapOccupancyPercent, then a G1 concurrent cycle
    is initiated by scheduling an initial-mark operation to begin on the next GC.
    The G1 concurrent cycle is the means by which G1 collects the old generation space.
    A concurrent cycle begins with an initial-mark operation, which can be observed
    in the GC logs with the -XX:+PrintGC


    Details command-line option.


    If full GCs are occurring due to the old generation running out of available space,
    lowering this value will initiate a concurrent cycle earlier before exhausting
    available space.


    If no GCs are occurring and it is desirable to increase throughput, it may help
    to increase this value to get fewer concurrent cycles. G1 concurrent cycles require
    CPU cycles to execute and therefore may steal CPU cycles from application threads.
    Hence, G1 concurrent cycles can reduce peak throughput. However, it is generally
    better to err with G1 concurrent cycles too early rather than too late. If G1
    concurrent cycles are too late, the consequence is likely to be frequent GCs,
    which of course introduces undesirable lengthy GC pauses.\u00


    See -XX:+G1UseAdaptiveIHOP.


    # -XX:+UseStringDeduplication


    Enables the deduplication of Java Strings. This command-line option and feature
    was introduced in JDK 8u20. String deduplication is disabled by default.'
  - '[PAGE 166]


    When enabled, this option deduplicates Strings by looking at the String''s underlying
    character array. When a String contains a sequence of characters equal to another
    String''s sequence of characters, such as string1.equals(string2) evaluates to
    true, the String objects are updated to share the same underlying character array.
    The result is the freeing of space required by the duplicate character array having
    the same sequence of characters. It should be noted that the String objects are
    not actually deduplicated; rather their underlying character arrays are deduplicated.


    This feature is implemented only with the G1 garbage collector. While enabling
    this command-line option is allowed by the non-G1 HotSpot collectors—Parallel
    GC, CMS GC, and Serial GC—no String deduplication is performed when enabled.


    An object is considered a deduplication candidate if any of the following statements
    are true:


    +   - The object is an instance of java.lang.String.

    - The object being evacuated from a young heap region.

    - The object is being evacuated from a young/survivor heap region and the object''s
    age is equal to the deduplication age threshold, or the object is being evacuated
    to an old heap region and the object''s age is less than the deduplication age
    threshold. See -XX:StringDeduplicationAgeThreshold for additional information
    on the deduplication age threshold.


    Interned Strings are dealt differently from noninterned Strings. Interned Strings
    are explicitly deduplicated just before being inserted into the internal HotSpot
    VM''s StringTable to avoid countering HotSpot JIT compiler optimizations done
    on literals.

    See -XX:StringDeduplicationAgeThreshold and -XX:+PrintStringDeduplicationStatistics.


    # -XX:StringDeduplicationAgeThreshold


    Sets the String age threshold when a String object is considered a candidate for
    deduplication. The default value is 3.

    More specifically, a String becomes a candidate for deduplication once a String
    object has been promoted to a G1 old region, or its age is higher than the deduplication
    age threshold. Once a String has a candidate for deduplication, or has been deduplicated,
    it will never become a candidate again. This approach avoids making the same object
    more than once.

    Also see -XX:+UseStringDeduplication and -XX:+PrintStringDeduplicationStatistics.'
