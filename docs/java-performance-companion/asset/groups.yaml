    Object reference type to watch for and being careful of is the soft reference.
    If PrintReferenceGC log output suggests that a large number of soft references
    are being processed, you may also be frequent old generation collection cycles,
    which consist of concurrent cycles by a sequence of GCs. If you see a large number
    of soft references being processed and GC events occurring frequently, or heap
    occupancy constantly stays near the maximum heap size, tune the aggressiveness
    with which soft references are reclaimed using XX:SoftLRUPolicyMSPerMB. It defaults
    to a value of 1000, which is in milliseconds.


    The default setting of -XX:SoftLRUPolicyMSPerMB=1000 means that a soft reference
    will be cleared and made eligible for reclamation if the time it last accessed
