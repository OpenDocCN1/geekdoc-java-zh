    # External Root Regions


    外部根区域扫描（Ext Root Scanning）是第一个并行任务之一。在此阶段，会扫描外部（堆外）根，例如 JVM 数据结构、JNI 线程句柄、硬件寄存器、全局变量和线程栈根，以查找当前停顿收集集（CSet）。


    ```

