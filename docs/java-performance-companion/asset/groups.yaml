    # Structured Object Query Language—SOQL


    This tool provides a shell-like command-line interface for executing SOQL queries.

    QL is an SQL-like language that can be used to query the Java heap:


    ```

    java -classpath $JAVA_HOME\lib\sa-jdi.jar

    sun.jvm.hotspot.tools.soql.SOQL 5684

    Attaching to process ID 5684, please wait...

    Debugger attached successfully.

    Client compiler detected.

    JVM version is 24.0-b56

    sql> select mirror(t) from java.lang.Thread t

    > go

    Thread[main,5]

    Thread[Signal Dispatcher,9,system]

    Thread[Attach Listener,5,system]

    Thread[C1 CompilerThread0,9,system]

    Thread[Service Thread,9,system]

    ```


    jhat also provides an interface to use this language. Good documentation on the
    jhat tool can also be accessed from here: https://blogs.oracle.com/poonam/entry/object_query_language_help.


    # ClassDump


    Using this tool, we can dump the loaded classes from the target VM. It is possible
    to dump to a single class or multiple classes from the selected packages. A few
    properties are available that can be set to specify the name of the class that
    we want to dump or the list of packages from which we want to dump the classes.
    These are listed in Table 4.1.


    Table 4.1 ClassDump Properties


    | System Property | Remarks |

    | - | - |

    | -Dsun.jvm.hotspot.tools.jcore.filter=<name of class> | Set the name of the class
    to be dumped |

    | -Dsun.jvm.hotspot.tools.jcore.packageNameFilter.pkgList=<list of packages> |
    Specify a comma-separated list of packages whose classes we want to dump |

    | -Dsun.jvm.hotspot.tools.jcore.outputDir=<output directory> | Set the output
    directory where the classes should be dumped |'
