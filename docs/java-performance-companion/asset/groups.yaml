    # Appendix


    ## Additional HotSpot VM Command-Line Options of Interest


    This appendix contains a listing of HotSpot VM command-line options that may be
    of interest for use or tuning of G1 GC. It also contains some command-line options
    that were not included or documented. For each command-line option listed, there
    is a description of what the command-line option does, and also when it is appropriate
    to consider using it. The general recommendation for using command-line options
    is to first have a justification for using the command-line option simply because
    it may have been used by someone else, or read in a blog post that someone used
    it. You should collect performance data while running your Java application using
    the command-line option as the means for justifying the use.


    HotSpot VM command-line option takes one of two forms. First, there are command-line
    options that are boolean in nature, they are toggled on or off with a "+" or "-"
    character ahead of the command-line name, for example, -XX:+PrintSizePolicy, which
    uses a "+" character, toggles on, and enables the command-line option called PrintSizePolicy.
    Likewise, the -XX:-PrintSizePolicy command-line option toggles off, or disables
    the command-line option PrintSizePolicy.


    The second form of HotSpot VM command-line option takes a numerical value, or
    a list of specific keywords. This appendix does not include any command-line options
    of the latter kind. The former kind that take a numerical value do not use the
    "+" or "-" character ahead of the command-line name. For instance, -XX:ConcGCThreads
    is a command-line option that expects a numeric value as -XX:ConcGCThreads=6.


    The default values for a given HotSpot VM option mentioned in this appendix are
    based on the option''s default value in JDK 8u. As a result, there may be some
    cases where a command-line option has a different default value from what is mentioned
    in this appendix. Changes in default values usually occur due to additional information
    about the behavior of the command-line option at an alternative value.


    ### -XX:+UseG1GC


    Enables the G1 garbage collector. To use G1 in both Java 7 and Java 8 releases,
    it must be explicitly enabled using this command-line option. As of this writing,
    there are plans to make G1 GC for Java 9, though there is a possibility of reverting
    back to Parallel GC for Java 9''s release.


    ### -XX:ConcGCThreads


    Sets the number of threads that the GC should use when doing concurrently with
    the Java application. By default this is roughly one-fourth of the number of threads
    used to perform GC when the Java threads are stopped. -XX:ConcGCThreads can lead
    to higher throughput performance since fewer GC threads compete with the Java
    application for CPU usage. Too few concurrent threads may cause the concurrent
    cycle to not fast enough to reclaim memory.


    ### -XX:G1HeapRegionSize


    Sets the size of the heap regions for G1. By default this is about 1/2000 of the
    heap size. Possible region sizes are 1M, 2M, 4M, 8M, 16M, and 32M.


    Objects that are larger than the region size need to be managed specially by G1.
    Increasing the region size allows larger objects to be allocated with the normal
    allocation path, which may help performance if such large objects are common.
    However, larger regions means that G1 has less flexibility when it comes to making
    ergonomic decisions, as such, for example, deciding on the size of the generation.


    ### -XX:G1HeapWastePercent


    Controls the acceptable amount of free memory that G1 will not collect. By default
    this value is 5 percent.


    G1 will collect all regions until any regions would only free up -XX:G1HeapWastePercent
    of memory. Especially on large heaps it can make sense to use a lower value.

