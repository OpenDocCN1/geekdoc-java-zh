    # Chapter 2 · Garbage First Collector in Depth


    Thus the number of mixed collections per mixed collection cycle can be controlled
    by the minimum generation CSet per mixed collection pause count and the heap percentage.


    # Collection Sets and Their Importance


    During any garbage collection pause all the regions in the CSet are freed. A CSet
    is a set of regions that are targeted for reclamation during a garbage collection
    pause. All live objects in these candidate regions will be evacuated during a
    collection, and the regions will be returned to a list of free regions. During
    a collection, the CSet can contain only young regions for collection. A mixed
    collection, on the other hand, will not only add all the young regions but also
    some old candidate regions (based on their GC efficiency) to its CSet.


    There are two important parameters that help with the selection of candidate old
    regions for mixed collection: -XX:GMixedGCLiveThresholdPercent -XX:OldCSetThresholdPercent.

    - XX:GMixedGCLiveThresholdPercent, which defaults to 85 percent (JDK 8u5) of a
    G1 region, is a liveness threshold and a set limit to exclude the most expensive
    of old regions from the CSet of mixed collections. G1 GC sets a limit such that
    any old region that falls below this liveness threshold is included in the CSet

    -XX:OldCSetThresholdPercent, which defaults to 10 percent (JDK 8u45) of the total
    Java heap, sets the maximum limit on the number of old regions that can be collected
    per mixed collection pause. The threshold is dependent on the total Java heap
    available to the JVM process and is expressed as a percentage of the total Java
    heap. Chapter 3 covers a few examples to highlight the functioning of these thresholds.


    # Remembered Sets and Their Importance


    A generational collector segregates different areas in the heap according to the
    age of those objects. These different areas in the heap are referred to as the
    generations. The generational collector then can concentrate most of its collection
    effort on the most recently allocated objects because it expects to find most
    of them sooner rather than later. These generations in the heap can be collected
    independently. The independent collection helps lower the response times the GC
    doesn''t have to scan the entire heap, and also (e.g., in the case of copying
    generational collectors) older long-lived objects don''t have to be copied back
    and forth, thus reducing the copying and reference updating overhead.'
  - '[PAGE 41]


    # Remembered Sets and Their Importance


    In order to facilitate the independence of collections, many garbage collectors
    maintain RSets for their regions. An RSet is a data structure that helps maintain
    and track references into its own unit of collection (which in G GC''s case is
    a region), eliminating the need to scan the entire heap for such information.
    When G GC executes a stop-the-world collection (young or mixed), it scans through
    the RSets of regions contained in its CSet. Once the live objects in the region
    are moved, their incoming references are updated.


    With G GC, during any young or mixed collection, the young generation is collected
    in its entirety, eliminating the need to track references whose object resides
    in the young generation. This reduces the RSet overhead. Thus, G GC just needs
    to maintain the RSets in the following two scenarios:


    +   * Old-to-young references—G GC maintains pointers from regions in the old
    generation into the young generation region. The young generation is said to "own"
    the RSet and hence the region is said to be an RSet "owning" region.

    * Old-to-old references—Here pointers from different regions in the old generation
    will be maintained in the RSet of the "owning" old generation region.


    In Figure 2.3, we can see one young region (Region x) and two old regions (Region
    y and Region z). having an incoming reference from Region z. This reference is
    noted in the RSet for Region x. We also observe that Region z has two incoming
    references, one from Region x and another from Region y. The RSet for Region z
    needs to note only the incoming reference from Region y and doesn''t have to remember
    the reference from Region x, as explained earlier, young generation is always
    collected in its entirety. Finally, for Region y, we see an incoming reference
    from Region x, which is not noted in the RSet for Region z since Region x is a
    young region.


    As shown in Figure 2.3, there is only one RSet per region. Depending on the application,
    it could be that a particular region (and thus its RSet) be “popular” such that
    there could be updates in the same region or even to the same location. This is
    not uncommon in Java applications.


    G GC has its way of handling demands of popularity; it is by changing the density
    of RSets. The density of RSets follows three levels of granularity, sparse, fine,
    and coarse. For a popular region, the RSet would be coarsened to accommodate the
    pointers from various other regions. This will be reflected in the RSet scanning
    time for regions. (Refer Chapter 3 for more details on RSet scanning times.) Each
    of the granular levels has a per-region-table (PRT) abstract housing for any particular
    region.


    Since G GC regions are internally divided into chunks, at the G1 GC region the
    lowest granularity achievable is a 512-byte chunk called a “card” (refer to Figure
    2.4). A global card table maintains all the cards.'
