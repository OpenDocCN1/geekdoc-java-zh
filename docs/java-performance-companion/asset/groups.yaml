    # Chapter 4 · The Serviceability Agent


    ![](img/b3ae442318f4d873d1d076953179a125_100_0.png)


    Figure 4.14 HSDB Tools


    Some of these tools are helpful in debugging the Java-level issues, and some are
    very useful in troubleshooting the JVM-level problems.


    # Class Browser


    With the Class Browser (see the example in Figure 4.15), we can see all the classes
    loaded by the target VM. It also allows us to dump the classes for all or some
    selective classes loaded errors. This tool is very useful when we do not have
    access to the source code of the application and just have the core dump file
    and need to investigate some issue with the loaded classes. For example, if some
    loaded class is not behaving as expected, we can dump that class, look at its
    code, and try to figure out the problem. Or perhaps there are too many loaded
    classes and with the Class Browser we can look through the classes and see if
    some unneeded classes are also getting loaded or whether the classes are getting
    unloaded as expected.


    # Deadlock Detection


    This feature helps us detect the Java-level deadlock among the threads. If a Java-level
    deadlock exists among the threads in the target VM, this tool prints information
    about the threads involved in the deadlock and also the monitors they are waiting
    to acquire. Figure 4.16 shows an example where no deadlocks were found.'
