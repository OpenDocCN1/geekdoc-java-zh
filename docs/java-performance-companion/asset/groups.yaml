  - '[PAGE 167]


    # -XX:PrintStringDeduplicationStatistics


    Enables the printing of String deduplication statistics. The default value is
    disabled.


    This command-line option can be very helpful when you want to know if enabling
    deduplication will result in a significant savings in the amount of space in use
    by String objects in the Java heap. Hence, enabling this command-line option provides
    data that justifica whether there may be value in enabling -XX:UseStringDeduplication.


    Also see -XX:UseStringDeduplication and -XX:StringDeduplicationAgeThreshold.


    # -XX:+GUseAdaptiveIHOP


    This is a new command-line option available in JDK 9 and later. It adequately
    adjusts the initiating heap occupancy threshold from the initial value of the
    command-line option InitiatingHeapOccupancyPercent. The intent is to let G1 adapt
    the marking threshold to behavior as to increase throughput by triggering the
    marking cycle as early as possible yet without old generation space.


    The mechanism enabled by GUseAdaptiveIHOP uses the value of the command-line option
    InitiatingHeapOccupancyPercent as an initial value for the marking cycles until
    sufficient observations about the application behavior have been made. It then
    adequately adjusts to a more optimal occupancy percent at to start the marking
    cycle.


    When GUseAdaptiveIHOP is disabled (when -XX:-GUseAdaptiveIHOP is explicitly specified
    as a command-line option), G1 will always use the InitiatingHeapOccupancyPercent
    value as the occupancy at to start the marking cycle. GUseAdaptiveIHOP, as this
    writing, will be enabled by default with its introduction in JDK 9.


    Also see -XX:InitiatingHeapOccupancyPercent.


    # -XX:MaxGCPMillis


    This command-line option sets the pause goal in milliseconds the default value
    is 200. Note that this is a goal, not a hard maximum time that G1 can never exceed.


    G1 attempts to size the young generation to make sure that it can be collected
    within the goal set by -XX:MaxGCPMillis. When G1 is in use, this command-line
    option, with sizing the Java heap with -Xms and -Xmx, is the command-line option
    that is expected to be used. These three command-line options are also the suggested
    starting point when using G1, even when migrating from Parallel GC or CMS GC to
    G1.'
  - '[PAGE 168]


    # -XX:MinHeapFreeRatio


    Sets the value for how much memory is allowed to be free on the heap. The default
    value is 40. The value is actually a percentage, not a ratio. It is unfortunate
    that the command-line name includes the term ratio.


    The Java HotSpot VM uses the value set by -XX:MinHeapFreeRatio to help determine
    when to grow the heap. This decision is made during a GC and can be described
    thus: if less than -XX:MinHeapFreeRatio percent of the Java heap is free, G1 will
    attempt to grow the Java heap to meet the value set as -XX:MinHeapFreeRatio.


    Obviously, in order for the Java heap to grow, the values set for -Xms, the initial
    Java heap size, and -Xmx, the maximum Java heap size, must be set to different
    values. If -Xms and -Xmx are set to the same value, the Java HotSpot VM will not
    grow or shrink the Java heap.


    # -XX:MaxHeapFreeRatio


    Sets the value for how much memory is allowed to be free on the heap. The default
    value is 70. Similarly to -XX:MinHeapFreeRatio, the value is actually a percentage,
    not a ratio. Again, similarly to -XX:MinHeapFreeRatio, it is unfortunate that
    the command-line name includes the term ratio.


    The Java HotSpot VM uses the value set by -XX:MaxHeapFreeRatio to determine when
    to shrink the Java heap. This decision is made during a GC and can be described
    thus: if more than -XX:MaxHeapFreeRatio percent of the Java heap is free, G1 will
    attempt to shrink the Java heap to meet the value set as -XX:MaxHeapFreeRatio.


    Also as is the case with -XX:MinHeapFreeRatio, in order for the Java heap size
    to shrink, the values set for -Xms, the initial Java heap size, and -Xmx, the
    maximum Java heap size, must be set to different values. If -Xms and -Xmx are
    set to the same value, the Java HotSpot VM will not grow or shrink the Java heap.


    # -XX:+PrintAdaptiveSizePolicy


    Turns on logging of about heap size changes. This information can be very useful
    in understanding the ergonomic heuristic decisions by G1 (also applicable to Parallel
    GC).


    Use of -XX:+PrintAdaptiveSizePolicy in tuning G1 is described in Chapter 3, "Garbage
    First Collector Tuning."


    # -XX:+ResizePLAB


    Sets whether the thread-allocation buffers that the GC uses for promoting objects
    should be resized dynamically or just have a static size. The default value is
    true.'
  - '[PAGE 169]


    # Appendix Additional HotSpot VM Command-Line Options of Interest


    The dynamic resizing of the PLABS in G1 has been shown to cause some performance
    issues. For some applications, disabling the resizing of thread-local promotion
    buffers can improve performance by reducing the duration the G1 GC pauses.


    # - XX:+ResizeTLAB


    Sets whether the thread-local allocation buffers that the Java application threads
    use for Java object allocations should be resized dynamically or have a static
    fixed size. The default is true.


    In most cases the TLAB resizing improves performance by reducing contention in
    the allocation path. Contrary to the PLAB sizing, it is not common to see that
    turning this off for performance. Hence, for almost all applications, it is best
    to leave this command-option enabled, which is its default.


    # - XX:+ClassUnloadingWithConcurrentMark


    Turns class unloading during G1 concurrent cycles, the concurrent collection of
    old generation. The default is true.


    Normally it is beneficial to be able to unload unreachable classes during G1 current
    cycles rather than to rely on GCs to do so. The unloading of classes during G1
    concurrent cycles can sometimes increase G1 remark pause times are higher than
    can be tolerated to met GC pause goal times, and few classes are expected to be
    unreachable, it may be beneficial to disable this option, that is, -XX:-ClassUnloadingWithConcurrentMark.


    # - XX:+ClassUnloading


    Turns class unloading on and off. The default value is true, meaning the HotSpot
    VM will unload unreachable classes. If this command-option is disabled—that is,
    -XX:-ClassUnloading—the HotSpot VM will not unload unreachable classes, ever,
    not as part of all GCs.


    # - XX:+UnlockDiagnosticOptions


    Sets flag tagged as diagnostic options should be allowed or not. The default is
    false.


    There are some command-line options that are tagged as "diagnostic". These can
    be seen in a list of Java HotSpot VM command-line options using the -XX:+PrintFlags
    in conjunction with -XX:+UnlockDiagnosticOptions.\Diagnostic" options have a field
    {diagnostic} command type listed in the -XX:+Flags output. Examples of diagnostic
    HotSpot VM command-line options include -XX:+PrintRegionLivenessInfo, which details
    liveness information for each G1 region on each GC, and -XX:+LogCompilation, which
    produces information about optimization decisions the Java HotSpot VM''s JIT compiler
    has made.'
  - '[PAGE 170]


    # 154 Appendix Additional HotSpot VM Command-Line Options of Interest


    Diagnostic options tend to introduce additional overhead to normal execution and
    are generally used to investigate or diagnose unexpected behavior of the Java
    HotSpot VM or the execution it is courting.


    -XX:+UnlockExperimentalVMOptionsnSets whatever flags tagged as experimental options
    should be allowed or not. The default is false.


    Similar to -XX:+UnlockDiagnosticVMOptions, there are some command-line options
    that are tagged as "experimental".These can be seen in a list of Java HotSpot
    command-line options using the -XX:+PrintFlagsFinal in conjunction with -XX:+UnlockExperimentalVMOptions.
    "Experimental" options have a field (experimental) command-line option type listed
    in the -XX:+PrintFlagsFinal output.


    It is important to note that experimental command-line options are not part of
    the supported Java SE product—but are available for experimentingwith additional
    capabilities that may be worth exploring for some user cases.


    Some experimental command-line options may be performance related features but
    may not have undergone full scrutiny or rigorous quality assurance testing. They
    may offer performance benefits in some use cases.


    An example of an experimental command-line option is -XX:G1NewSizePercent, which
    controls the minimum size of G1 to reduce the young generation to the Java heap
    size. It defaults to 5. In others, the minimum size G1 can adaptively young generation
    is 5% of the Java heap size. For some cases where very low GC pause times are
    desired, one could experiment in a non-production environment setting a lower
    -XX:G1NewSizePercent to 1 or 2, yet realizing if more than one experimental option
    is so no official support.


    To use an experimental option, the -XX:+UnlockExperimentalVMOptions must be specified
    in conjunction with the experimental command-line option. For example, if you
    use the -XX:G1NewSizePercent=2 command-line option, you would specify both -XX:+UnlockExperimentalVMOptions
    -XX:G1NewSizePercent=2. The -XX:+UnlockExperimentalVMOptions only needs be specified
    if more than one experimental option is desired.


    # -XX:+UnlockCommercialFeatures


    Sets whether Oracle-specific features require a license to be enabled. The default
    is false.


    There are some capabilities or features developed by Oracle that are available
    only via the Java runtime distributed by Oracle and are not included in OpenJDK.
    An example of an Oracle commercial feature is Java Flight Recorder, which is part
    of Oracle’s monitoring and management tool called Java Mission Control. Java Flight
    Recorder is a profiling and event collection framework that can collect and show
    within Java Mission Control low-level information how the application and JVM
    are behaving.'
