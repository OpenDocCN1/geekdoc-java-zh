    # Chapter 2 · Garbage First Collector in Depth


    Based on the Java application''s object allocation rate, new regions are added
    to the young generation as needed until the desired generation size is met. The
    heap region size is determined at the launch of the JVM. The heap region size
    has to be a power of 2 and can range from 1MB to 32MB. The JVM shoots for approximately
    2048 regions and sets the heap region size accordingly (Heap size = Heap/2048).
    The heap region size is aligned and adjusted to fall within the 1MB to 32MB power
    of 2 bounds. The adaptive selection of heap region can be overwritten on the command
    line by setting it with -XX:GHeapRegionSize=n. Chapter 3, "Garbage First Collector
    Performance Tuning," includes more information on when to override the JVM''s
    adaptive sizing.


    # A Young Collection Pause


    The young generation consists of G1 GC regions designated as eden regions and
    G1 GC regions designated as survivor regions. A young collection is triggered
    when the JVM fails to allocate out of the eden region, that is, the eden is completely
    filled. The GC steps into free space. The first young collection will move all
    the objects from the eden regions into the survivor regions. This is known as
    "copy to survivor." From then on, any young collection will promote the objects
    from the entire young generation (i.e., eden and survivor regions) into new regions
    that are now the new survivor regions. The young collections will also occasionally
    promote a few objects out of the old generation when they survive a predetermined
    promotion threshold. This is called "aging" the live objects. The promotion of
    the live objects from the young generation into the old generation is called "tenuring"
    the objects, and consequently the age threshold is called the "tenuring threshold."
    Promotion of objects into the survivor regions or into the old generation happens
    in the promoting GC thread''s local allocation buffer (also known as Promotion
    Lab, or PLAB for short). There is a per-GC-thread PLAB for survivor regions and
    for the old generation.


    During every young collection pause, G1 calculates the amount of expansion or
    contraction to the current young generation size (i.e., G1 decides to either add
    or remove free regions) based on the total time it took to perform the current
    collection; the size of the remembered sets or RSets (more on this in the section
    "Remembered Sets and Their Importance" later in this chapter); the current, the
    maximum, and the minimum young generation capacity; and the pause time target.
    Thus the young generation is resized at the end of a collection pause. The previous
    and next sizes of the young generation can be observed and calculated by looking
    at the output of -XX:+PrintDetails. Let''s look at an example. (Note that this
