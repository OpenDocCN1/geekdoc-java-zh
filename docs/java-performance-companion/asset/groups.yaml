    在图 2.2 中，巨型对象 1 跨越了两个连续区域。第一个连续区域标记为“StartsHumongous（开始巨型）”，后续的连续区域标记为“ContinuesHumongous（继续巨型）”。图
    2.2 还展示了，巨型对象 2 跨越了三个连续的堆区域，而巨型对象 3 仅跨越了一个区域。


    这些巨型对象的过去表明，此类对象的分配很常见，且对象本身是长寿的。另一个需要记住的点是，巨型区域必须是连续的（如图 2.2 所示）。因此，移动它们是有意义的，因为这样做没有收益（没有空间回收），而且由于大内存拷贝的开销并不小，这非常昂贵。因此，为了避免在年轻代垃圾收集期间复制这些巨型对象的费用，认为直接从老年代（old
    generation）分配巨型对象会更好。近年来，许多事务型应用程序可能拥有寿命不算太长的巨型对象。因此，人们正通过各种努力来优化巨型对象的分配和回收。


    ![](img/b3ae442318f4d873d1d076953179a125_37_0.png)

    ![](img/b3ae442318f4d873d1d076953179a125_37_1.png)

    ![](img/b3ae442318f4d873d1d076953179a125_37_2.png)


    # 图 2.2 映射到巨型区域的不同巨型对象


    之前提到，巨型对象遵循独立且经常被调用的路径。这意味着巨型对象的分配路径没有利用任何针对分配或晋优优化的年轻代 TLABs 和 PLABs，因为对新分配对象进行清零成本是巨大的，并且可能会抵消任何分配路径的收益。处理巨型对象时的另一个值得注意的区别在于巨型区域的收集。在
    JDK 8u40 之前，如果任何巨型区域完全完全空闲，它只能在并发收集周期的清理阶段（cleanup phase）才被收集。为了优化短命巨型对象的收集，JDK
    8u40 做出了一项重大的变化：如果确定巨型区域没有入站引用，则它们可以在年轻代收集期间被回收并返回到空闲区域列表中。全垃圾回收停顿（full garbage
    pause）也会收集完全空闲的巨型区域。


    > 这里需要强调一个重要的潜在问题或混淆点。假设当前的 G1 区域大小为 2MB。假设一个字节数组的长度按 1MB 对齐。该字节数组仍被视为一个巨型对象，并需要以这种方式分配，因为
    1MB 的数组长度不包含数组对象头部的大小。


    # 混合收集停顿 (A Mixed Collection Pause)


    随着越来越多的对象被提升到老年代区域，或者当巨型对象被分配到巨型区域时，老年代的占用率以及 Java 堆的总占用量随之增加。为了避免耗尽堆空间，JVM 进程需要启动垃圾收集，这种收集不仅涵盖年轻代区域，还将一些老年代区域纳入其中。参考此处关于巨型区域的上一章节以阅读有关巨型对象的特殊处理（分配和回收）。


    为了识别垃圾最多的老年代区域，G1 GC 会启动并发标记周期，这有助于标记并最终识别所有存活对象，并计算每个区域的存活因子（liveness factor）。在分配速率、晋优速率与触发此标记周期之间需要一种微妙的平衡，以确保
    JVM 进程不会耗尽 Java 堆空间。因此，在 JVM 进程启动时设置了一个占用阈值。截至编写时以及通过最近的 JDK 8u45，该阈值不是自适应的，可以通过命令行选项
    `-XX:InitiatingHeapOccupancyPercent`（我非常亲切地称之为 IHOP）来设置。


    在 G1 中，IHOP 阈值默认为总 Java 堆的 45%。注意的是，这个堆占用百分比适用于整个 Java 堆，而与 CMS GC 使用的占用命令行选项不同，后者仅适用于老年代。在
    G1 GC 中，没有物理上独立的老年代——它有一个单一的空闲区域池，可以分配为 Eden、幸存者（survivor）或巨型。此外，分配的区域数量（例如 Eden）会随时间变化。因此，设置一个老年代百分比并没有真正意义。


    # 知识 (Trivia)


    我以前经常给 G1 GC 开发工程师以及 G1 GC 用户写关于标记阈值的邮件，并且总是得引用它的全称 `InitiatingHeapOccupancyPercent`，因为
    CMS 和 G1 的标记阈值之间还有另一个区别（不同于前面的提示中提到的）——就是选项名称！CMS 的标记阈值被称为 `CMSInitiatingOccupancyFraction`，如你所见，选项名称中没有“percent”。因此，为了避免任何混淆，我总是要指定全名，很快我对它产生了一个昵称，并称之为
    IHOP。


    # 混合收集停顿 (A Mixed Collection Pause)


    当老年代占用率达到（超过）IHOP 阈值时，会启动一个并发标记周期。在标记结束时，G1 GC 计算每个区域的存活对象数量。此外，在清理阶段，G1 GC 根据“GC
    效率”计算老年代区域。现在混合收集可以发生了！在混合收集停顿期间，G1 GC 不仅收集年轻代的所有区域，还会收集一些已回收的老年代区域。


    # 提示 (Tip)


    比较 CMS 和 G1 时需要记住的一点是，G1 的多阶段并发周期比 CMS 的多阶段并发周期少。


    单混合收集类似于年轻代停顿，通过拷贝来实现存活对象的压缩。唯一的区别是在混合收集期间，收集集包含了一些老年代区域。根据某些参数（在本章稍后讨论），可能会多次混合收集。这被称为“混合收集周期”。周期只有在跨越标记/IHOP
    阈值并在完成并发标记周期后才会发生。


    决定混合收集周期中混合收集总数的两个重要参数是：`-XX:G1MixedGCCountTarget` 和 `-XX:G1HeapWastePercent`。


    `G1MixedGCCountTarget` 默认 8（JDK 8u45），它是混合 计数目标选项，被设置为标记周期完成后发生混合收集次数的物理限制。G1
    GC 将可收集的候选区域总数除以计数目标数，并将其设置为每次混合收集停顿期间收集的老年代区域的最小值。这可以用公式表示：


    每次混合收集的最小 CSet = 每个混合收集周期识别出的候选区域总数 / G1MixedGCCountTarget


    `-XX:G1HeapWastePercent` 默认为总 Java 堆的 5%（JDK 8u45），是一个控制混合收集周期期间收集老年代区域数量的重要参数。在每次混合收集停顿期间，G1
    GC 根据可以回收的死亡对象空间识别可回收堆的数量。一旦 G1 GC 达到这个堆浪费比例，G1 GC 就会停止启动混合收集停顿，从而结束混合收集周期。设置堆浪费比例基本上有助于限制为了加速混合收集周期而愿意浪费的堆空间。


    '
