    CMS GC 的开发是为了响应日益增长的应用程序，这些应用程序需要具有比串行或并行 GC 更低最坏情况停顿时间的 GC，并且可以接受牺牲一些应用程序吞吐量来消除或大幅减少长时间
    GC 停顿次数。


    在 CMS GC 中，年轻代垃圾回收与并行 GC 类似。它们是并行的停顿世界（stop-the-world），意味着在年轻代垃圾回收期间，所有 Java 应用线程都会暂停，垃圾回收工作由多个线程执行。注意，你可以用单线程代垃圾收集器配置
    CMS GC，但该选项在 Java 8 中已弃用并在 Java 9 中被移除。


    并行 GC 和 CMS GC 的主要区别在于老年代收集。对于 CMS GC，老年代收集尝试避免应用线程的长时间停顿。为了实现这一点，CMS 老年代收集器的大部分工作与应用程序执行并发进行，除了少数较短的
    GC 停顿。CMS 通常被称为“大部分并发”，因为老年代收集的某些阶段会暂停应用线程，例如初始标记（initial-mark）和重新标记（remark）阶段。在
    CMS 的初始实现中，初始标记和重新标记阶段都是单线程的，但之后已增强为多线程。支持多线程标记和重新标记阶段的 HotSpot 命令行选项是 -XX:+CMSParallelInitialMark
    和 -XX:+CMSParallelRemarkEnabled。当通过 -XX:+UseSweepGC 命令行选项启用 CMS 时，这些选项会被默认启用。


    在进行老年代收集时，极有可能且很有可能发生年轻代收集。当这种情况发生时，老年代收集会被后者的收集中断。CMS GC 的默认年轻代收集器通常称为 ParNew。


    图 1.3 显示了应用线程（灰色箭头）如何被年轻代 GC（黑色箭头）、CMS 初始标记和重新标记阶段，以及老年代 GC 停顿世界阶段（同样为黑色箭头）所停止。GC
    中的老年代收集始于停顿世界的初始标记阶段。一旦初始标记完成，便开始并发标记阶段，此时 Java 应用线程被允许与 CMS 标记线程并发执行。在图 1.3 中，并发标记线程是前两个较长的条形，位于“Marking/Pre-cleaning（标记/预清理）”标签下方，一个在另一个上方。一旦并发标记完成，CMS
    线程将执行并发预清理（concurrent pre-cleaning），如“Marking/Pre-cleaning”标签下的两个较短条形所示。注意，如果有足够的可用硬件线程，CMS
    线程开销对 Java 应用线程的性能影响不大。然而，如果硬件线程饱和或利用率极高，CMS 将与 Java 应用线程争夺 CPU 周期。一旦并发预清理完成，进入停顿世界的重新标记（remark）阶段。重新标记阶段会处理初始标记、并发标记和并发预清理后遗漏的对象。重新标记阶段完成后，开始并发清除（concurrent
    sweeping），释放所有死亡对象空间。


    CMS GC 的挑战之一是调优，并发工作可能会耗尽可用的 Java 堆空间。因此，CMS 的棘手部分在于找到启动并发工作的正确时机。并发方法的常见结果是，CMS
    处理相同应用程序通常比并行 GC 多需要 10 到 20% 的 Java 堆空间。这是为了获得更短 GC 停顿而付出的代价。


    ## 并发标记清除 (CMS) GC


    ![](img/b3ae442318f4d873d1d076953179a125_23_0.png)


    **图 1.3** 使用 CMS 时 Java 应用线程受 GC 线程的影响


    CMS GC 的另一个挑战是如何处理老年代的碎片化。当老年代对象之间的空闲空间变得很小或不存在，导致年轻代提升的对象无法放入可用空隙时，就会产生碎片。CMS
    并发收集周期不执行压缩，甚至不执行增量或部分压缩。无法找到可用空隙会导致 CMS 回退到使用 Serial GC 进行全收集，这通常会导致长时间的停顿。与
    CMS 碎片化相关的另一个不幸挑战是它是不可预测的。某些应用程序可能永远不会遇到因老年代碎片化导致的全 GC，而另一些应用程序则会经常遇到。


    调优 CMS GC 有助于推迟碎片化的产生，修改应用程序（如避免分配大对象）也是如此。调优可能是一项艰巨的任务，需要专业知识。修改应用程序以避免碎片化也可能具有挑战性。


    ## 收集器总结


    到目前描述的所有收集器都有一些共同问题。之一是老年代收集器在大多数操作（如标记、清除和压缩）中必须扫描整个老年代。这意味着工作量与 Java 堆的大小成乎线性的缩放。另一个是必须预先决定年轻代和老年代在虚拟地址空间中的位置，因为年轻代和老年代是两个连续的内存块。


    ## Garbage First (G1) GC


    G1 垃圾收集器通过一种相当不同的方法解决了并行、串行和 CMS GC 的许多缺点。G1 将堆划分为一组区域（regions）。随后可以一次对一个区域执行大多数
    GC 操作，而不是针对整个 Java 堆或整个代。


    在 G1 中，年轻代只是一组区域，这意味着它不需要是连续的内存块。同样，老年代也只是一组区域。在 JVM 启动时，确定哪些区域属于老年代或年轻代。事实上，G1
    的正常运行状态是随着时间推移，映射到 G1 区域的虚拟内会在代之间移动。一个 G1 区域可能被指定为年轻代，随后在一次年轻代收集后，它可以变为可供其他区域，因为年轻代区域会被完全迁移到未使用的区域。


    在本章的剩余部分，“可用区域（available region）”用于识别未使用且 G1 无法使用的区域。可用区域可以被使用或被指定为年轻代或老年代区域。在年轻代收集后，一个年轻代区域在未来的某个时间可以用作老年代区域。同样，在收集老年代区域后，它变成一个可用区域，可以在未来的某个时间用作年轻代区域。


    G1 年代收集是并行停顿世界收集器。正如前所述，并行停顿世界在垃圾收集器执行时暂停所有 Java 应用线程，并且 GC 分散在多个线程中。


    G1 老年代收集与其它 HotSpot 收集器截然不同。G1 老年代不需要收集整个老年代来释放老年代空间。相反，在任何时候都可以收集老年代的一个子集。此外，这部分老年代区域是与年轻代收集一起进行的。


    > 提示

    > 描述与年轻代收集一起收集老年代子集的术语是混合 GC（mixed GC）。因此，混合 GC 是在收集所有年轻代区域之外，还收集部分老年代区域的 GC 事件。换句话之，混合
    GC 是正在收集的年轻代和老年代区域的混合。


    '
