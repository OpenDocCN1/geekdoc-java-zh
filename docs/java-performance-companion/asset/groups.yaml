    # Garbage First 概述


    本章将介绍 Garbage First（简称 G1）垃圾回收器（GC），并回顾了 Java HotSpot 虚拟机（VM，以下简称 HotSpot）中垃圾回收器的历史发展，以及
    G1 被引入 HotSpot 的原因。假设读者熟悉基本的垃圾回收概念，如年轻代（young generation）、老年代（old generation）和压缩（compaction）。Java™
    Performance [1] 一书的第 3 章“JVM 概述”是学习这些概念的好来源。


    Serial GC（串口 GC）是 1999 年作为 Java 开发包（JDK）1.3.1 的一部分引入 HotSpot 的第一个回收器。并行 GC（Parallel
    GC）和并发标记清除（Concurrent Mark Sweep）回收器于 2002 年作为 JDK 1.4.2 的一部分引入。这三者大致对应三个最重要的
    GC 场景：“最小化内存占用”、“最大化应用程序吞吐量”以及“最小化 GC 相关的停顿时间”。人们可能会问：“为什么我们需要像 G1 这样的新回收器呢？”在回答之前，让我们先澄清一些在比较和对比垃圾回收器时常用的术语。我们将简要概述四种
