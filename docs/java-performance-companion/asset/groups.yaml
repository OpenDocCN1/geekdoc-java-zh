    # The Stages of a Young Collection


    In order to limit the time spent updating RSets, G1 sets a target time as a percentage
    of the pause time goal (-XX:MaxGCMillis). The target time defaults to 10 percent
    of the pause time goal. Any evacuation pause should spend most of its copying
    live objects, and 10 percent of the pause time goal is considered a reasonable
    amount of time to spend updating RSets. After looking at the logs you realize
    that spending 10 percent of pause time goal in updating RSets is undesirable,
    you can change the percentage by updating the -XX:G1UpdatingPausePercent command-line
    option to reflect your desired value. It is important to remember, however, that
    if the number of updated log buffers does not change, decrease in RSet update
    time during the collection pause will result in fewer buffers being processed
    during that pause. This will push the log buffer work onto the concurrent refinement
    threads and will result in increased work and sharing of resources with the Java
    application mutator threads. Also worst case, if the concurrent refinement threads
    cannot keep up with the log buffer update rate, the Java application mutators
    must step in and help with the processing—a scenario avoided!


    > Tip

    as discussed in Chapter 2, there is a command-line option called -XX:G1RefinementThreads.
    By default it is set to the same value as -XX:ParallelGCThreads, which means that
    any change in XX:ParallelGCThreads will change the -XX:G1ConcRefinementThreads
