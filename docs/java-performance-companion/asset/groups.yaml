    ### 对象直方图


    通过直方图工具（示例见图 4.19），我们可以获取 Java 堆中存在的对象的直方图。这有助于诊断 Java 程序中的内存泄漏或与内存溢出（out-of-memory）相关的问题。


    ## 88 第 4 章 可用性代理


    该工具具有显示特定类实例的功能。点击右上角的搜索图标，会弹出一个窗口，显示所选类的所有实例。详见图 4.20。


    我们可以从实例列表中选择任意实例，并获取该对象的存活路径（liveness path），即该对象可达且被垃圾回收器认为存活的路径，如图 4.21 所示。


