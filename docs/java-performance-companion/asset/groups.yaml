    “choosing” as such all the young regions automatically become a part of the young
    CSet. The “choosing” occurs for a mixed collection pause and becomes an important
    factor for understanding how to “tame” your mixed collections. We will discuss
    choosing the CSet in detail later in this chapter.


    Reference processing and enqueuing are for soft, weak, phantom, and JNI references.
    We discuss this and more in the section titled “Reference Processing Tuning.

    The act of reference enqueuing may require updating the RSets. Hence, the updates
    need to be logged and their associated cards need to be marked as dirty.


    ## Chapter 3 Garbage First Garbage Collector Performance Tuning


    The time spent redirty the cards is shown as the Redirty time (0.2 ms in the preceding
    example).


    Humongous Reclaim is new in JDK 8u40. If a humongous object is found to be unreachable
    by looking at all references from the root set or young generation regions and
    by making sure that there are no references to the humongous object in the RSet,
    object can be reclaimed during the evacuation pause. (See Chapter 2 for detailed
    descriptions of humongous regions and humongous objects.)


    The remainder of the Other time is spent in fixing JNI handles and similar work.
    The collective time in Other should be very small, and most time hog should have
    a reasonable explanation. As an example, you could see higher times in Free Cset
    if your Cset per use is very large. Ref Proc and Ref Enq could show higher depending
    on how many references are used in your application. Similar reasoning can be
    applied to Humongous Reclaim times, if you have many short-lived humongous objects.


    ## Young Generation Tunables


    As covered in Java™ Performance [1], Chapter 7, "Tuning the JVM, Step by Step,"
    there are some tunables that can help with tuning the young generation itself.
    G1 has great tuning potential. There are initial and default values that help
    G1 heuristics, and in order to be able to tune G1 GC, to understand these defaults
    and their effect on the heuristics. Options such as -XX:MaxPauseMillis (pause
    goal; defaults to 200 ms), -XX:G1SizePolicy (initial generation size expressed
    as a percentage of the total heap; defaults to 5 percent), -XX:G1NewSizePercent
    (maximum generation growth limit expressed as a percentage of the total heap;
    to 60 percent) grow or shrink the young generation based on the initial and upper
    bounds, the pause goal, and the weighted average of previous times. If there is
    a good understanding of the workload and if there is a perceived benefit from
    circumventing the adaptive resizing (for example, if you see that the predicted
    time drastically from the actual observed), you can adjust the defaults. The side
    effect is that you are forgetting adaptive resizing for more predictable limits.
    Another thing to keep in mind is that the new limits are applicable only to the
    one application that you are tuning and will not carry forward to any other/different
    applications that may have similar pause requirements since most applications
    exhibit different behaviors based on their allocation rates, promotion rates,
    and transient live data sets, sizes, and life spans.


