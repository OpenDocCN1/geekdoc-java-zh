    *Journal of Systems and Software*, Volume 11, Issue 3, March 1990, pp. 181–98.
    Elsevier Science, Inc., New York.


    # Garbage Collector Tuning


    性能工程处理系统的非功能性需求，并确保在产品实现中满足这些需求。因此，它与系统或软件工程紧密相连。在本章中，我们将讨论 Java HotSpot VM 中最新的垃圾收集器——G1
    的性能调优。读者被鼓励阅读 Java™ Performance [1]，第 7 章“Tuning the JVM”，以及本书的后续章节。


    # The Stages of a Young Collection


    G1 年代收集具有串行和并行阶段。串行阶段意味着某些任务只能在停顿（stop-the-world）收集期间执行。并行阶段采用多个 GC 线程，并从其他线程的任务队列中进行工作窃取（work
    stealing）。


    > **Tip**：年轻代收集的阶段可以是多线程的，并可以使用 `-XX:ParallelThreads` 的值来确定 GC 工作线程的数量。


