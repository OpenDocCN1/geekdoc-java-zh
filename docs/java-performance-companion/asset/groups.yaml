    # About the Authors


    **Charlie Hunt** (Chicago, IL) is currently a JVM Engineer at Oracle leading a
    variety of Java SE and HotSpot VM projects whose primary focus is reducing memory
    footprint while maintaining throughput and latency. He is also the lead author
    of Java™ Performance (Addison-Wesley, 2012). He is a regular presenter at the
    Java Conference at other well-known conferences, including QCon, Velocity, GoTo,
    and Dreamforce. Where he has been recognized as a Java Rock Star. He has also
    been a speaker in several different conferences. Prior to leading a variety of
    Java SE and HotSpot VM projects for Oracle, Charlie worked in several different
    performance positions, including Performance Engineering Architect at Salesforce.com
    and HotSpot VM Performance Architect at Oracle and Sun Microsystems. He wrote
    his first Java application in 1998, joined Sun Microsystems in 1999 as Senior
    Java Architect, and has a passion for Java and JVM performance ever since.


    **Monica Beckwith** is an Independent Consultant optimizing customer applications
    for server-class systems running the Java Virtual Machine. Her past experiences
    include working with Oracle, Sun Microsystems, and AMD. Monica has worked with
    Java HotSpot VM optimizing the JIT compiler, the generated code, the JVM heuristics,
    and garbage collection and collectors. She is a regular speaker at various conferences
    and has several published articles on topics including garbage collection, the
    Java memory model, and others. Monica led Oracle''s Garbage First Garbage Collector
    team, and was named a JavaOne Rock Star.'
  - '[PAGE 16]


    **Poonam Parhar** (Santa Clara, CA) is currently a JVM Engineer at Oracle where
    her primary responsibility is to resolve customer-escalated problems against JRockit
    and HotSpot VMs. She loves debugging and troubleshooting problems and is always
    focused on improving the serviceability and supportability of the HotSpot VM.
