    This chapter aims at providing in-depth knowledge on the principles supporting
    HotSpot''s latest garbage collector: the Garbage First garbage collector (referred
    to as G1 GC for short). These principles were highlighted in Chapter 1, “Garbage
    First Overview.”


    At various points during the narration, concepts like the collection cycles, internal
    structures, and algorithms will be introduced, followed by comprehensive details.
    The aim is to document the details without overloading the uninitiated.


    To gain the most from the chapter, the reader is expected to be familiar with
    basic garbage collection concepts and generally how garbage collection works in
    the Java HotSpot JVM. These concepts and terms include generational garbage collection,
    the Java heap, young generation space, old generation space, eden space, survivor
    space, parallel garbage collection, stop-the-world garbage collection, concurrent
    garbage collection, incremental garbage collection, marking, and compaction. Chapter
    1 covers some of these concepts and terms. A good source for additional details
    is the “HotSpot VM Garbage Collectors” section in Chapter 3, “JVM Overview,” of
    Java™ Performance [1].


