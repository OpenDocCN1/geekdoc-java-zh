    GC 上的总时间的最佳方法。然而，由 GC 引起的 Java 应用程序个别单次停顿（pauses）可能会非常长。


    Parallel GC 中的年轻代和老年代收集都是并行的且全停世界的。老年代收集执行压缩。压缩将对象移动在一起以消除它们之间的浪费空间，从而实现最优的堆布局。然而，压缩可能花费大量时间，这通常取决于
