    application executing with the same size Java heap with the same load. This means
    that if you are using soft references for memory-sensitive object cache, the size
    of object cache may vary between garbage collectors, not only between different
    JVM vendors, but also from one garbage collector to another within the same JVM.
    You may observe different GC behavior such as a difference in live data or heap
    occupancy, number of GCs, the frequency at which they occur, and the duration
    by moving between HotSpot CMS, Parallel, and G1 GCs, JVMs such as IBM''s J9 or
    Azure''s Zing may also behave differently with respect to soft reference reclamation.
    This puts limitations on the portability of a Java application using soft references
    since it will behave moving from one garbage collector to another, or at least
    require JVM tuning of the constant multiplier, which may be nontrivial, in order
    to achieve acceptable application behavior.


    # References


    - [1] Charlie Hunt and Binu John. Java™ Performance. Addison-Wesley, Upper Saddle
    River, NJ, 2012. ISBN 978-0-13-714252-1.

    - [2] Nirmar S. Arora, Robert D. Blumofe, and C. Greg Plaxton. “Thread Scheduling
    for Multiprogrammed Multiprocessors.” Proceedings of the Tenth Annual ACM Symposium
    on Parallel Algorithms and Architectures. ACM, New York, 1998, pp. 119–29. ISBN
    0-89791-989-0.

    '
