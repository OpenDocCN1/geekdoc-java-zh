    # 巨型对象 (Humongous Objects)


    G1 对大对象的分配特殊特殊，即 G1 所说的“巨型对象（humongous objects）”。正如前面提到的，巨型对象是指大小至少达到区域（region）大小
    50% 的对象。该大小包含了 Java 对象头部。头部的大小在 32 位和 64 位 HotSpot VM 之间有所不同。在特定的 HotSpot VM 中，特定对象的头部大小可以通过
    Java Layout 工具（也称为 JOL）获取。截至目前，可以在互联网上找到 Java Layout 工具 [2]。


    当发生巨型对象分配时，G1 会定位一组连续的区域，其内存总和足以容纳该巨型对象。第一个区域被标记为“巨型起始区域（humongous start）”，其他区域被标记为“巨型后续区域（humongous
    continues）”。如果没有连续的可用区域，G1 将执行全 GC 来回收 Java 堆。


