    ### 查找指针 (Find Pointer)


    此工具可以帮助找到从 GC 根节点到达特定对象的引用路径，这在处理 JVM 崩溃问题时非常有用。例如，该地址位于 Java 堆的哪个位置？是在新生区（Eden）还是老年代区？图
    4.25 展示了这一点。


    ### 在堆中查找地址 (Find Address in Heap)


    该工具报告了 Java 堆中的所有值。这对于我们需要知道对象在堆中的具体位置时非常有用。通过追踪指向该对象的引用，可以了解为什么该对象没有被垃圾回收回收。


    ### 在代码缓存中查找值 (Find Value in Code)


    该工具显示了代码缓存中的所有 JIT 编译方法。这对于排查 JIT 编译相关问题非常有用。图 4.27 展示了一个示例。


