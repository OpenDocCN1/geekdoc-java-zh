    - Java Persistence API (JPA): JPA is a Java programming interface that describes\
    \ the management of relational data in applications. It provides a framework for\
    \ object-relational mapping and supports ORM tools like Hibernate.\n- Java Message\
    \ Service (JMS): JMS is a messaging standard that allows Java EE applications\
    \ to create, send, receive, and read messages asynchronously. It is crucial for\
    \ building decoupled, distributed systems.\n- Java Naming and Directory Interface\
    \ (JNDI): JNDI provides a naming and directory service for Java applications.\
    \ It allows Java clients to discover and look up data and resources using a directory-based\
    \ interface.\n- JavaMail API: JavaMail API provides a platform-independent and\
    \ protocol-independent framework to build mail and messaging applications. It\
    \ allows sending, receiving, and manipulating email messages.\n- Security in Java\
    \ EE: Java EE provides a comprehensive security model, including features like\
    \ authentication, authorization, and secure communication. It supports role-based\
    \ access control and integration with external security systems.\n- Web Services:\
    \ Java EE supports the development of web services using technologies like JAX-RS\
    \ (for RESTful services) and JAX-WS (for SOAP-based services). These technologies\
    \ enable interoperability and communication between different systems.\n- Contexts\
    \ and Dependency Injection (CDI): CDI is a specification that defines a set of\
    \ services for the Java EE platform to enable the development of decoupled, modular,\
    \ and scalable applications. It provides a powerful set of features for managing\
    \ beans and their lifecycle.\n\nJakarta EE Application Development:\n\n- Project\
    \ Setup: Jakarta EE projects are typically built using tools like Maven or Gradle.\
    \ Jakarta EE projects can be created using Jakarta EE-compliant application servers\
    \ like WildFly, Payara, or Apache TomEE.\n- Web Applications: Web applications\
    \ in Jakarta EE are built using Servlets, JSP, and other web-related technologies.\
    \ They are deployed as WAR (Web Application Archive) files to Jakarta EE-compliant\
    \ servers.\n- Enterprise Applications: Enterprise applications leverage EJBs for\
    \ building scalable and distributed components. These applications are typically\
    \ packaged as EAR (Enterprise Archive) files and deployed to Jakarta EE servers.\n\
    - Persistence: Jakarta EE applications often use JPA for handling database interactions.\
    \ JPA allows developers to work with relational databases using Java objects,\
    \ providing a higher-level abstraction.\n- Messaging: JMS is used for building\
    \ messaging solutions in Jakarta EE. It enables the creation of asynchronous,\
    \ loosely coupled systems that can handle large-scale communication.\n- Security\
    \ Integration: Jakarta EE provides a standardized approach to security, including\
    \ authentication and authorization. Security configurations are typically defined\
    \ in deployment descriptors or using annotations.\n- Dependency Injection: CDI\
    \ is widely used for managing dependencies in Jakarta EE applications. It simplifies\
    \ bean management, promotes loose coupling, and supports the development of modular\
    \ and maintainable code.\n- Testing: Jakarta EE applications can be tested using\
    \ frameworks like JUnit. Additionally, Jakarta EE servers often provide tools\
    \ for testing and deploying applications in different environments.\n- Jakarta\
    \ EE Versions: Jakarta EE has evolved over the years, with versions transitioning\
    \ from Java EE to Jakarta EE after the move to the Eclipse Foundation. Each version\
    \ introduces new features, improvements, and specifications to meet the demands\
    \ of modern enterprise application development.\n\nJakarta EE provides a robust\
    \ platform for building enterprise-grade applications. Its specifications and\
    \ components cover a wide range of features, from web applications to distributed\
    \ systems and messaging. Jakarta EE's portability and compatibility with various\
    \ application servers make it a suitable choice for large-scale enterprise development.\n\
    \n# 40. Transaction Management (JTA)\n\nJava Transaction API (JTA) is a specification\
    \ that defines a set of interfaces and protocols for managing distributed transactions\
    \ in Java applications. JTA is part of the larger Java EE (now Jakarta EE) platform\
    \ and provides a standard way for coordinating transactions across multiple resources,\
    \ such as databases, message queues, and other enterprise components.\n\nLet's\
    \ explore the key concepts and components of JTA and transaction management:\n\
    \nTransaction Basics: A transaction is a sequence of one or more operations that\
    \ must be executed as a single, indivisible unit of work. Transactions ensure\
    \ data consistency and integrity in a system.\n\nTransactions follow the ACID\
    \ properties:\n\n- Atomicity: Transactions are atomic, meaning they either complete\
    \ successfully, or none of their changes are applied.\n- Consistency: Transactions\
    \ bring the system from one consistent state to another.\n- Isolation: Transactions\
    \ appear to be executed in isolation from each other, even though they may be\
    \ executed concurrently.\n- Durability: Once a transaction is committed, its changes\
    \ are permanent and survive system failures.\n\nJTA Components: JTA involves several\
    \ key components and concepts:\n\n- Transaction Manager: The Transaction Manager\
    \ (TM) is responsible for coordinating and managing transactions. It ensures that\
    \ transactions follow the ACID properties.\n- UserTransaction Interface: The UserTransaction\
    \ interface allows application code to demarcate transaction boundaries explicitly.\
    \ Developers use begin(), commit(), and rollback() methods to control transactions.\n\
    - Transactional Resources: Transactional resources are the resources (databases,\
    \ message queues, etc.) that participate in a transaction. They must implement\
    \ the XA protocol for distributed transactions.\n- Transaction Coordinator: The\
    \ Transaction Coordinator is responsible for coordinating transactions involving\
    \ multiple resources. It interacts with the Transaction Manager and ensures that\
    \ all resources either commit or rollback in a coordinated manner.\n\nTransaction\
    \ Lifecycle: The typical lifecycle of a transaction involves the following steps:\n\
    \n- Begin: The transaction begins with a call to UserTransaction.begin() or through\
    \ declarative annotations in EJB or Spring.\n- Work: Application code executes\
    \ various operations within the transaction, involving one or more transactional\
    \ resources.\n- Commit or Rollback:\n    - Commit: If all operations within the\
    \ transaction succeed, a call to UserTransaction.commit() is made, and changes\
    \ become permanent.\n    - Rollback: If an error occurs or the application decides\
    \ to abort the transaction, a call to UserTransaction.rollback() is made, and\
    \ changes are discarded.\n\nDeclarative Transaction Management:\n\n- EJB (Enterprise\
    \ JavaBeans): In EJB, transaction management can be declaratively specified using\
    \ annotations (@TransactionAttribute) on methods. EJB containers automatically\
    \ handle transaction demarcation.\n- Spring Framework: In Spring, transaction\
    \ management can be handled declaratively using annotations (@Transactional).\
    \ Spring provides integration with JTA and local transactions, allowing developers\
    \ to focus on business logic.\n\nJTA and Distributed Transactions:\n\n- XA Protocol:\
    \ For distributed transactions involving multiple resources (databases, JMS, etc.),\
    \ the XA protocol is used. XA ensures that each resource manager (database, message\
    \ queue, etc.) can participate in a two-phase commit protocol.\n- Two-Phase Commit\
    \ (2PC): In the two-phase commit protocol, the coordinator (Transaction Manager)\
    \ asks each resource manager to prepare for commit. If all resource managers are\
    \ prepared, the coordinator instructs them to commit. If any resource manager\
    \ cannot commit, all resource managers are instructed to roll back.\n- Isolation\
    \ Levels: JTA supports different isolation levels for transactions, such as READ_UNCOMMITTED,\
    \ READ_COMMITTED, REPEATABLE_READ, and SERIALIZABLE. These levels determine the\
    \ degree to which one transaction is isolated from the effects of other concurrently\
    \ executing transactions.\n"
  mdcn: "\n\n# 39. 使用 Java EE 进行企业级开发\n\nJava EE（企业版），现在被称为 Jakarta EE，是一套规范，它在 Java\
    \ SE（标准版）的基础上进行了扩展，包含了针对分布式计算和 Web 服务等企业级功能的规范。Jakarta EE 为开发大规模、可扩展且安全的企业级应用提供了一个平台。\n\
    \n让我们探索使用 Jakarta EE 进行企业级应用开发的关键组件和概念：\n\n核心概念：\n\n-   Servlets：Servlets 是扩展了\
    \ Web 服务器功能的 Java 组件。它们处理 HTTP 请求和响应，是 Java EE Web 应用程序的基础部分。\n-   JavaServer\
    \ Pages (JSP)：JSP 是一种用于开发具有动态内容网页的技术。它允许在 HTML 页面中嵌入 Java 代码，便于创建动态 Web 应用程序。\n\
    -   Enterprise JavaBeans (EJB)：EJB 是一种服务端组件架构，用于构建可扩展的、分布式且支持事务的企业级应用。它包括会话豆（session\
    \ beans）、实体豆（entity beans）和消息驱动豆（message-driven beans）。\n-   Java Persistence\
    \ API (JPA)：JPA 是一个 Java 编程接口，用于描述应用程序中关系型数据的管理。它提供了一个对象关系映射（ORM）的框架，并支持 Hibernate\
    \ 等 ORM 工具。\n-   Java Message Service (JMS)：JMS 是一种消息标准，允许 Java EE 应用程序异步创建、发送、接收和读取消息。它对于构建解耦的分布式系统至关重要。\n\
    -   Java Naming and Directory Interface (JNDI)：JNDI 为 Java 应用程序提供命名目录服务。它允许 Java\
    \ 客户端使用基于目录的接口发现并查找数据及资源。\n-   JavaMail API：JavaMail API 提供了一个平台无关且协议无关的框架，用于构建邮件和消息应用程序。它允许发送、接收和处理电子邮件消息。\n\
    -   Java EE 中的安全性：Java EE 提供了一个全面的安全模型，包括身份验证、授权和安全通信等功能。它支持基于角色的访问控制并能与外部安全系统集成。\n\
    -   Web 服务：Java EE 支持使用 JAX-RS（用于 RESTful 服务）和 JAX-WS（用于基于 SOAP的服务）等技术开发 Web 服务。这些技术实现了不同系统之间的互操作性和通信。\n\
    -   Contexts and Dependency Injection (CDI)：CDI 是一项规范，它为 Java EE 平台定义了一系列服务，以便开发解耦、模块化且可扩展的应用程序。它为管理豆\
    \ 及其生命周期提供了一套强大的功能。\n\nJakarta EE 应用开发：\n\n-   项目设置：Jakarta EE 项目通常使用 Maven 或\
    \ Gradle 等工具构建。可以使用符合 Jakarta EE 规范的应用程序服务器（如 WildFly、Payara 或 Apache TomEE）创建项目。\n\
    -   Web 应用程序：Jakarta EE 中的 Web 应用程序使用 Servlets、JSP 和其他 Web 相关技术构建。它们被部署为 WAR（Web\
    \ 归档）文件到符合 Jakarta EE 规范的服务器。\n-   企业级应用：企业级应用利用 EJBs 构建可扩展的分布式组件。这些应用通常封装为 EAR（企业归档）文件并部署到\
    \ Jakarta EE 服务器上。\n-   持久化：Jakarta EE 应用通常使用 JPA 处理数据库交互。JPA 允许开发者使用 Java 对象与关系型数据库交互，提供了更高层次的抽象。\n\
    -   消息传递：JMS 用于在 Jakarta EE 中构建消息解决方案。它能够创建异步的、松耦合的系统，从而处理大规模的通信。\n-   安全性集成：Jakarta\
    \ EE 提供了标准化的安全方法，包括身份验证和授权。安全配置通常在部署描述符中定义或使用注解。\n-   依赖注入：CDI 广泛用于管理 Jakarta\
    \ EE 应用中的依赖关系。它简化了豆的管理，促进了松耦合，并支持模块化和可维护代码的。\n-   测试：可以使用 JUnit 等框架对 Jakarta EE\
    \ 应用进行测试。此外，Jakarta EE 服务器通常提供在不同环境中测试和部署应用程序的工具。\n-   Jakarta EE 版本：Jakarta EE\
    \ 在多年年来经历了演变，在迁移到 Eclipse 基金后，版本从 Java EE 转换为 Jakarta EE。每个版本都引入了新功能、改进和规范，以满足现代企业应用开发的需求。\n\
    \nJakarta EE 为构建企业级应用提供了一个健壮的平台。它的规范和组件涵盖了从 Web 应用到分布式系统及消息传递的广泛功能。Jakarta EE\
    \ 的移植性和与各种应用程序服务器的兼容使其成为大规模企业开发的理想选择。\n\n# 40. 事务管理 (JTA)\n\nJava Transaction\
    \ API (JTA) 是一项规范，它定义了一用于管理 Java 应用程序中分布式事务的接口和协议。JTA 是大型 Java EE（现为 Jakarta EE）平台的一部分，提供了一种标准方法来协调多个资源（如数据库、消息队列和其他企业组件）之间的事务。\n\
    \n让我们探索 JTA 和事务管理的关键概念和组件：\n\n事务基础：事务是一次或多次操作的序列，必须作为一个单一、不可分割的工作单元执行。事务确保了系统数据的一致性和完整性。\n\
    \n事务遵循 ACID 特性：\n\n-   原子性 (Atomicity)：事务是原子性的，这意味着它们要么成功完成，要么没有任何更改被生效。\n-  \
    \ 一致性 (Consistency)：事务使系统从一个一致状态转变为另一个一致状态。\n-   隔离性 (Isolation)：事务看起来是相互隔离执行的，尽管它们可能是并发执行的。\n\
    -   持久性 (Durability)：一旦事务提交，其更改就是永久的，并在系统故障后生存。\n\nJTA 组件：JTA 涉及几个关键组件和概念：\n\n\
    -   事务管理器 (Transaction Manager)：事务管理器（TM）负责协调和管理事务。它确保事务遵循 ACID 特性。\n-   UserTransaction\
    \ 接口：UserTransaction 接口允许应用程序代码显式地划分事务边界。开发者使用 `begin()`、`commit()` 和 `rollback()`\
    \ 方法来控制事务。\n-   事务资源 (Transactional Resources)：事务资源是参与事务的资源（数据库、消息队列等）。它们必须实现用于分布式事务的\
    \ XA 协议。\n-   事务协调器 (Transaction Coordinator)：事务协调器负责协调涉及多个资源的事务。它与事务管理器交互，并确保所有资源以协调的方式提交或回滚。\n\
    \n事务生命周期：事务的典型生命周期涉及以下步骤：\n\n-   开始 (Begin)：事务通过调用 `UserTransaction.begin()` 或通过\
    \ EJB 或 Spring 中的声明式注解开始。\n-   执行 (Work)：应用程序代码在事务内执行各种操作，涉及一个或多个事务资源。\n-   提交或回滚\
    \ (Commit or Rollback)：\n    -   提交：如果事务内的所有操作都成功，则调用 `UserTransaction.commit()`，更改变为永久。\n\
    \    -   回滚：如果发生错误或应用程序决定中止事务，则调用 `UserTransaction.rollback()`，更改被丢弃。\n\n声明式事务管理：\n\
    \n-   EJB (Enterprise JavaBeans)：在 EJB 中，可以使用方法上的注解（@TransactionAttribute）来声明式地指定事务管理。EJB\
    \ 容器会自动处理事务划分。\n-   Spring Framework：在 Spring 中，可以使用注解（@Transactional）声明式地处理事务管理。Spring\
    \ 提供了与 JTA 和本地事务的集成，允许开发者专注于业务逻辑。\n\nJTA 与分布式事务：\n\n-   XA 协议：对于涉及多个资源（数据库、JMS\
    \ 等）的分布式事务，使用 XA 协议。XA 确保每个资源管理器（数据库、消息队列等）都能参与两阶段提交协议。\n-   两阶段提交 (2PC)：在两阶段提交协议中，协调器（事务管理器）询问每个资源管理器准备提交。如果所有资源管理器就绪，协调器指示它们提交。如果任何资源管理器无法提交，则指示所有资源管理器回滚。\n\
    -   隔离级别 (Isolation Levels)：JTA 支持事务的不同隔离级别，例如 READ_UNCOMMITTED、READ_COMMITTED、REPEATABLE_READ\
    \ 和 SERIALIZABLE。这些级别决定了一个事务与其他并发执行事务的影响相互隔离的程度。\n\n"
