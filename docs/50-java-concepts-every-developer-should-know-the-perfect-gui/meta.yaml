    \ 访问 Swagger UI。\n\nSpring 提供了一套完整的工具用于构建 RESTful API、使用 Spring Data JPA 处理数据、使用\
    \ Spring Security 安全应用程序以及使用 Swagger 编写 API 文档。\n\nSpring Boot 简化了这些组件的设置和配置，允许开发者专注于构建功能丰富且可扩展的\
    \ API。\n\n# 38. Spring 中的依赖注入\n\n依赖注入（DI）是 Spring Framework 中的一个基本概念，促进了代码的松耦合和模块化。在\
    \ Spring 中，依赖注入通过控制反转（IoC）容器实现，该容器负责管理依赖的创建并注入 bean 中。\n\n让我们探索 Spring 中的依赖注入：\n\
    \n- 1. 理解依赖：在软件应用程序中，依赖是类执行其功能所需的对象。Spring 并不是在类内部创建依赖，而是促进从外部源注入这些依赖。\n\n- 2.\
    \ Spring 中依赖注入的类型：Spring 支持两种主要的依赖注入类型：\n\n构造注入：通过类的构造函数注入依赖。\n\n```java\npublic\
    \ class MyClass {\n    private MyDependency myDependency;\n\n    // 构造注入\n   \
    \ public MyClass(MyDependency myDependency) {\n        this.myDependency = myDependency;\n\
    \    }\n\n    // 使用 myDependency 的类方法\n}\n```\n\nSetter注入：通过 setter 方法注入依赖。\n\n\
    ```java\npublic class MyClass {\n    private MyDependency myDependency;\n\n  \
    \  // Setter 注入\n    public void setMyDependency(MyDependency myDependency) {\n\
    \        this.myDependency = myDependency;\n    }\n\n    // 使用 myDependency 的类方法\n\
    }\n```\n\n使用注解进行依赖注入：Spring 提供注解来简化依赖注入。\n\n@Autowired：通过构造函数、setter 方法或字段自动将依赖注入类中。\n\
    \n```java\npublic class MyClass {\n    private MyDependency myDependency;\n\n\
    \    // 构造注入\n    @Autowired\n    public MyClass(MyDependency myDependency) {\n\
    \        this.myDependency = myDependency;\n    }\n\n    // 使用 myDependency 的类方法\n\
    }\n```\n\n@Qualifier：与 @Autowired 配合使用，当存在多个相同类型的 bean 时指定要注入哪个 bean。\n\n```java\n\
    public class MyClass {\n    private MyDependency myDependency;\n\n    // 构造注入\n\
    \    @Autowired\n    public MyClass(@Qualifier(\"specificBean\") MyDependency\
    \ myDependency) {\n        this.myDependency = myDependency;\n    }\n\n    //\
    \ 使用 myDependency 的类方法\n}\n```\n\n依赖注入的 XML 配置：除了注解外，Spring 还允许通过 XML 配置进行依赖注入。\n\
    \nXML 中的构造注入：\n\n```xml\n<bean id=\"myClass\" class=\"com.example.MyClass\">\n\
    \    <constructor-arg ref=\"myDependency\"/>\n</bean>\n<bean id=\"myDependency\"\
    \ class=\"com.example.MyDependency\"/>\n```\n\nXML 中的 Setter注入：\n\n```xml\n<bean\
    \ id=\"myClass\" class=\"com.example.MyClass\">\n  <property name=\"myDependency\"\
    \ ref=\"myDependency\"/>\n</bean>\n<bean id=\"myDependency\" class=\"com.example.MyDependency\"\
    />\n```\n\n组件扫描：Spring 使用组件扫描自动检测并注册 bean。标记了 @Component、@Service、@Repository\
    \ 或 @Controller 的类被自动视为 bean。\n\n使用 @Component 的示例：\n\n```java\n@Component\npublic\
    \ class MyDependency {\n  // 类定义\n}\n```\n\n在集合在使用 @Autowired：@Autowired 可以与集合一起使用以注入特定类型的所有\
    \ bean。\n\n```java\npublic class MyClass {\n  private List<MyDependency> myDependencies;\n\
    \n  // 带有 List 的构造注入\n  @Autowired\n  public MyClass(List<MyDependency> myDependencies)\
    \ {\n    this.myDependencies = myDependencies;\n  }\n\n  // 使用 myDependencies\
    \ 的类方法\n}\n```\n\n依赖注入的优势：\n\n- 松耦合：类与依赖之间不是紧耦合的。\n- 测试：更容易进行单元测试，因为依赖可以被地 mock\
    \ 或替换。\n- 可复用性：依赖可以在应用程序的不同部分复用。\n\n依赖注入是 Spring Framework 的核心概念，提升了 Java 应用程序的模块化、可维护性和可测试性。无论使用注解、XML\
    \ 配置还是组件扫描，Spring 均提供了实现依赖注入的各种机制。\n\n"
