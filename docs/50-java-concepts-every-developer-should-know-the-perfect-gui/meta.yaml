- md: "\n```java\n@Test\npublic void testSomething() {\n\n    MyDependency mockDependency\
    \ = mock(MyDependency.class);\n\n    MyService service = new MyService(mockDependency);\n\
    \    service.doSomething();\n\n    verify(mockDependency).someMethod();\n}\n```\n\
    \nArgument Matchers: Use argument matchers to verify method calls with specific\
    \ arguments.\n\n```java\nimport static org.mockito.Mockito.*;\n\npublic class\
    \ MyServiceTest {\n    @Test\n    public void testSomething() {\n\n        MyDependency\
    \ mockDependency = mock(MyDependency.class);\n        when(mockDependency.add(anyInt(),\
    \ anyInt())).thenReturn(10);\n\n        MyService service = new MyService(mockDependency);\n\
    \        int result = service.doSomethingWithArgs(2, 3);\n\n        assertEquals(10,\
    \ result);\n        verify(mockDependency).add(eq(2), eq(3));\n    }\n}\n```\n\
    \nJUnit and Mockito are powerful tools for writing and simplifying tests in Java.\
    \ JUnit helps structure and execute tests, while Mockito aids in creating mock\
    \ objects and verifying interactions. Proper testing ensures the reliability and\
    \ correctness of your Java applications.\n\n## 36. Dependency Management with\
    \ Maven or Gradle\n\nDependency management is a crucial aspect of Java development,\
    \ and tools like Maven and Gradle simplify the process of managing dependencies,\
    \ building projects, and handling various aspects of the project lifecycle.\n\n\
    ### Maven:\n\n- 1. Setup: Include a pom.xml file in your project, where you define\
    \ project information and dependencies.\n\n```xml\n<project>\n  <modelVersion>4.0.0</modelVersion>\n\
    \  <groupId>com.example</groupId>\n  <artifactId>my-project</artifactId>\n  <version>1.0.0</version>\n\
    \n  <dependencies>\n    <!-- Add dependencies here -->\n  </dependencies>\n</project>\n\
    ```\n\nAdding Dependencies: Declare dependencies by adding <dependency> elements\
    \ inside the <dependencies> section.\n\n```xml\n<dependencies>\n  <dependency>\n\
    \    <groupId>group-id</groupId>\n    <artifactId>artifact-id</artifactId>\n \
    \   <version>1.0.0</version>\n  </dependency>\n</dependencies>\n```\n\nBuild Lifecycle:\
    \ Maven defines a set of build phases (e.g., compile, test, package) that are\
    \ executed sequentially.\n\n```bash\nmvn clean # Cleans the project\nmvn compile\
    \ # Compiles the source code\nmvn test # Runs tests\nmvn package # Packages the\
    \ compiled code into a JAR or other format\n```\n\nPlugins: Maven plugins extend\
    \ its functionality. The maven-compiler-plugin compiles Java code, and the sureffire-plugin\
    \ runs tests.\n\n```xml\n<build>\n  <plugins>\n    <plugin>\n      <groupId>org.apache.maven.plugins</groupId>\n\
    \      <artifactId>maven-compiler-plugin</artifactId>\n      <version>3.8.1</version>\n\
    \      <configuration>\n        <source>1.8</source>\n        <target>1.8</target>\n\
    \      </configuration>\n    </plugin>\n    <plugin>\n      <groupId>org.apache.maven.plugins</groupId>\n\
    \      <artifactId>maven-surefire-plugin</artifactId>\n      <version>3.0.0-M5</version>\n\
    \    </plugin>\n  </plugins>\n</build>\n```\n\nRunning Tests: Maven automatically\
    \ runs tests during the test phase.\n\n```bash\nmvn test\n```\n\n### Gradle:\n\
    \n- 1. Setup: Include a build.gradle file in your project\n\n```gradle\nplugins\
    \ {\n  id 'java'\n}\n\ngroup 'com.example'\nversion '1.0.0'\n\nrepositories {\n\
    \  mavenCentral()\n}\n```\n\nAdding Dependencies: Declare dependencies using the\
    \ dependencies block.\n\n```gradle\ndependencies {\n    implementation 'group-id:artifact-id:1.0.0'\n\
    }\n```\n\n### Build Lifecycle:\n\nGradle uses a declarative syntax and defines\
    \ tasks for each build phase.\n\n- ./gradlew clean # Cleans the project\n- ./gradlew\
    \ compile # Compiles the source code\n- ./gradlew test # Runs tests\n- ./gradlew\
    \ build # Builds the project\n\nPlugins: Gradle plugins can be applied to extend\
    \ functionality. The java plugin is applied by default for Java projects.\n\n\
    ```gradle\nplugins {\n    id 'java'\n}\n```\n\nRunning Tests: Gradle automatically\
    \ runs tests during the test task.\n\n```bash\n./gradlew test\n```\n\n### Additional\
    \ Features:\n\n- a. Dependency Scopes: Both Maven and Gradle support different\
