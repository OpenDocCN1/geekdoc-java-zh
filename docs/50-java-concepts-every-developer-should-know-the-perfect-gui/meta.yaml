- md: "\n## 20. Reference Types and Primitive Types\n\nIn Java, data types can be\
    \ broadly classified into two categories: primitive types and reference types.\
    \ Let's explore the differences between them:\n\nPrimitive Types: Primitive types\
    \ represent simple, single values and are the basic building blocks of data in\
    \ Java. They are predefined by the language and have reserved keywords. The primitive\
    \ types in Java are:\n\n### Integer Types:\n- byte: 8-bit signed integer\n- short:\
    \ 16-bit signed integer\n- int: 32-bit signed integer\n- long: 64-bit signed integer\n\
    \n### Floating-Point Types:\n- float: 32-bit floating-point\n- double: 64-bit\
    \ floating-point\n\n### Character Type:\n- char: 16-bit Unicode character\n\n\
    ### Boolean Type:\n- boolean: Represents true or false values\n\nPrimitive types\
    \ hold the actual values, and operations on them are typically faster than reference\
    \ types.\n\nExample of primitive types:\n\n```\nint age = 25;\ndouble salary =\
    \ 55000.50;\nchar grade = 'A';\nboolean isActive = true;\n```\n\nReference Types:\
    \ Reference types represent objects in Java and are more complex than primitive\
    \ types. They include classes, interfaces, arrays, and enums. Reference types\
    \ hold references (memory addresses) to the actual objects, which are allocated\
    \ on the heap.\n\nCommon reference types in Java:\n\nClasses and Objects: Instances\
    \ of classes created using the new keyword.\n\n```\nString text = new String(\"\
    Hello, Java!\");\n```\n\nArrays: Collections of elements of the same type.\n\n\
    ```\nint[] numbers = {1, 2, 3, 4, 5};\n```\n\nInterfaces: Used for defining abstract\
    \ types and achieving abstraction.\n\n```\nList<String> names = new ArrayList<>();\n\
    ```\n\nEnums: A special type used for defining a set of constants.\n\n```java\n\
    enum Day {\nSUNDAY,\nMONDAY,\nTUESDAY,\nWEDNESDAY,\nTHURSDAY,\nFRIDAY,\nSATURDAY,\n\
    }\n```\n\nReference types require more memory and involve indirection through\
    \ references. Operations on reference types may involve method calls or accessing\
    \ fields.\n\n### Key Differences:\n\nStorage:\n- Primitive types store the actual\
    \ values.\n- Reference types store references to objects in memory.\n\nMemory\
    \ Location:\n- Primitive types are stored on the stack.\n- Reference types (objects)\
    \ are stored on the heap, and references to them are stored on the stack.\n\n\
    ### Default Values:\nPrimitive types have default values (e.g., 0 for numeric\
    \ types, false for boolean).\n\nReference types have a default value of null.\n\
    \n### Operations:\n- Operations on primitive types are generally faster.\n- Operations\
    \ on reference types involve indirection and may include method calls.\n\nUnderstanding\
    \ the differences between primitive types and reference types is crucial for effective\
    \ Java programming. Developers need to choose the appropriate type based on the\
    \ requirements and characteristics of the data.\n\n## 21. Annotations and Reflection\n\
    \nAnnotations are a form of metadata added to Java code to convey information\
    \ about the code to the compiler, tools, or runtime. Annotations start with the\
    \ @ symbol and can be attached to various program elements such as classes, methods,\
    \ fields, and more. Java provides built-in annotations, and developers can also\
    \ create custom annotations.\n\n### Built-in Annotations:\n\n@Override: Indicates\
    \ that a method in a subclass is intended to override a method in its superclass.\n\
    \n```java\n@Override\npublic void methodName() {\n    // Override the method\n\
    }\n```\n\n@Deprecated: Marks a program element as deprecated, suggesting that\
    \ it should no longer be used.\n\n```java\n@Deprecated\npublic void oldMethod()\
    \ {\n    // Old method implementation\n}\n```\n\n@SuppressWarnings: Suppresses\
    \ specific compiler warnings.\n\n```java\n@SuppressWarnings(\"unchecked\")\npublic\
    \ void methodName() {\n    // Suppress unchecked warning\n}\n```\n\n### Custom\
    \ Annotations:\n```java\nimport java.lang.annotation.*;\n\n@Retention(RetentionPolicy.RUNTIME)\n\
    @Target(ElementType.METHOD)\npublic @interface MyAnnotation {\n    String value()\
    \ default \"Default Value\";\n    int count() default 1;\n}\n```\n\n@Retention:\
    \ Specifies when the annotation is retained, e.g., during source code parsing,\
    \ during compilation, or at runtime.\n\n@Target: Specifies where the annotation\
    \ can be applied, e.g., to methods, fields, or classes.\n\n### Reflection in Java:\
    \ Reflection is a feature in Java that allows you to inspect and interact with\
    \ classes, methods, fields, and other components of a program dynamically at runtime.\
    \ The java.lang.reflect package provides classes and interfaces for reflection.\n\
    \nExample:\n\n```java\nimport java.lang.reflect.Method;\n\npublic class ReflectionExample\
    \ {\n    public static void main(String[] args) throws NoSuchMethodException {\n\
    \        MyClass obj = new MyClass();\n\n        // Get the class of the object\n\
    \        Class<?> myClass = obj.getClass();\n\n        // Get the declared methods\
    \ of the class\n        Method[] methods = myClass.getDeclaredMethods();\n\n \
    \       // Print the names of the methods\n        for (Method method : methods)\
    \ {\n            System.out.println(\"Method Name: \" + method.getName());\n \
    \       }\n\n        // Invoke a method dynamically\n        try {\n         \
    \   Method myMethod = myClass.getDeclaredMethod(\"myMethod\");\n            myMethod.invoke(obj);\n\
    \        } catch (Exception e) {\n            e.printStackTrace();\n        }\n\
    \    }\n}\n\nclass MyClass {\n    public void myMethod() {\n        System.out.println(\"\
    Hello from myMethod!\");\n    }\n}\n```\n\nIn this example, reflection is used\
    \ to inspect the methods of the MyClass and invoke the myMethod dynamically at\
    \ runtime.\n\nWhile reflection can be powerful, it should be used judiciously\
    \ due to its potential impact on performance and type safety. It is commonly used\
    \ in scenarios such as frameworks, libraries, and testing tools.\n\n## 22. File\
    \ and Directory Handling (java.nio)\n\nJava's java.nio package provides a modern\
    \ and more flexible API for file and directory handling compared to the older\
    \ java.io package. It includes the Path, Paths, and Files classes for working\
    \ with file systems. Let's explore some basic file and directory operations using\
    \ java.nio.\n\n### Creating a File:\n\n```java\nimport java.io.IOException;\n\
    import java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\n\
    \npublic class FileHandlingExample {\n    public static void main(String[] args)\
    \ {\n        // Define the file path\n        Path filePath = Paths.get(\"example.txt\"\
    );\n\n        // Create a file\n        try {\n            Files.createFile(filePath);\n\
    \            System.out.println(\"File created: \" + filePath);\n        } catch\
    \ (IOException e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\
    \n### Writing to a File:\n\n```java\nimport java.io.IOException;\nimport java.nio.file.Files;\n\
    import java.nio.file.Path;\nimport java.nio.file.Paths;\nimport java.util.List;\n\
    \npublic class FileHandlingExample {\n    public static void main(String[] args)\
    \ {\n        // Define the file path\n        Path filePath = Paths.get(\"example.txt\"\
    );\n\n        // Write content to the file\n        try {\n            String\
    \ content = \"Hello, Java NIO\";\n            Files.write(filePath, content.getBytes());\n\
    \            System.out.println(\"Content written to the file.\");\n        }\
    \ catch (IOException e) {\n            e.printStackTrace();\n        }\n    }\n\
    }\n```\n\n### Reading from a File:\n\n```java\nimport java.io.IOException;\nimport\
    \ java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\n\
    import java.util.List;\n\npublic class FileHandlingExample {\n    public static\
    \ void main(String[] args) {\n        // Define the file path\n        Path filePath\
    \ = Paths.get(\"example.txt\");\n\n        // Read content from the file\n   \
    \     try {\n            List<String> lines = Files.readAllLines(filePath);\n\
    \            System.out.println(\"Content read from the file:\");\n          \
    \  for (String line : lines) {\n                System.out.println(line);\n  \
    \          }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n### Creating a Directory:\n\n```java\nimport java.io.IOException;\n\
    import java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\n\
    \npublic class DirectoryHandlingExample {\n    public static void main(String[]\
    \ args) {\n        // Define the directory path\n        Path directoryPath =\
    \ Paths.get(\"myDirectory\");\n\n        // Create a directory\n        try {\n\
    \            Files.createDirectory(directoryPath);\n            System.out.println(\"\
    Directory created: \" + directoryPath);\n        } catch (IOException e) {\n \
    \           e.printStackTrace();\n        }\n    }\n}\n```\n\n### Listing Files\
    \ in a Directory:\n```java\nimport java.io.IOException;\nimport java.nio.file.DirectoryStream;\n\
    ```\n"
  mdcn: "\n\n## 20. 引用类型与基本类型\n\n在 Java 中，数据类型可以粗略分为两类：基本类型（primitive types）和引用类型（reference\
    \ types）。让我们探索它们之间的区别：\n\n基本类型：基本类型表示简单的、单一的值，是 Java 中数据的构建构建块。它们由语言预定义，并有保留的关键字。Java\
    \ 中的基本类型有：\n\n### 整数类型：\n- byte: 8 位有符号整数\n- short: 16 位有符号整数\n- int: 32 位有符号整数\n\
    - long: 64 位有符号整数\n\n### 浮点数类型：\n- float: 32 位浮点数\n- double: 64 位浮点数\n\n### 字符类型：\n\
    - char: 16 位 Unicode 字符\n\n### 布尔类型：\n- boolean: 代表真（true）或假（false）\n\n基本类型持有实际的值，对其进行的操作通常比引用类型快快。\n\
    \n基本类型的示例：\n\n```\nint age = 25;\ndouble salary = 55000.50;\nchar grade = 'A';\n\
    boolean isActive = true;\n```\n\n引用类型：引用类型表示 Java 中的对象，比基本类型更复杂。它们包括类、接口、数组和枚举。引用类型持有指向实际对象的引用（内存地址），而这些对象分配在堆（heap）上。\n\
    \nJava 中常见的引用类型：\n\n类和对象：使用 `new` 关键字创建的类实例。\n\n```\nString text = new String(\"\
    Hello, Java!\");\n```\n\n数组：相同类型元素的集合。\n\n```\nint[] numbers = {1, 2, 3, 4, 5};\n\
    ```\n\n接口：用于定义抽象类型并实现抽象。\n\n```java\nList<String> names = new ArrayList<>();\n\
    ```\n\n枚举：用于定义常量集的特殊类型。\n\n```java\nenum Day {\nSUNDAY,\nMONDAY,\nTUESDAY,\nWEDNESDAY,\n\
    THURSDAY,\nFRIDAY,\nSATURDAY,\n}\n```\n\n引用类型需要更多内存，并涉及通过引用的间接访问。对引用类型的操作可能涉及方法调用或访问字段。\n\
    \n### 主要区别：\n\n存储：\n- 基本类型存储实际的值。\n- 引用类型存储内存中对对象的引用。\n\n内存位置：\n- 基本类型存储在栈（stack）上。\n\
    - 引用类型（对象）存储在堆（heap）上，对它们的引用存储在栈上。\n\n### 默认值：\n基本类型有默认值（例如数值类型为 0，布尔类型为 false）。\n\
    \n引用类型的默认值为 `null`。\n\n### 操作：\n- 对基本类型的操作通常更快。\n- 对引用类型的操作涉及间接，并可能包含方法调用。\n\n\
    理解基本类型和引用类型之间的区别对于有效的 Java 编程至关重要。开发者需要根据数据的和特征选择合适的类型。\n\n## 21. 注解与反射\n\n注解是添加到\
    \ Java 代码中的一种元数据，用于向编译器、工具或运行时传递有关代码的信息。注解以 `@` 符号开头，可以附加到各种程序元素，如类、方法、字段等。Java\
    \ 提供了内置注解，开发者也可以创建自定义注解。\n\n### 内置注解：\n\n@Override: 表示子类中的方法意在覆盖父类中的方法。\n\n```java\n\
    @Override\npublic void methodName() {\n    // Override the method\n}\n```\n\n\
    @Deprecated: 将程序元素标记为已过时，建议不再使用它。\n\n```java\n@Deprecated\npublic void oldMethod()\
    \ {\n    // Old method implementation\n}\n```\n\n@SuppressWarnings: 抑制特定的编译器警告。\n\
    \n```java\n@SuppressWarnings(\"unchecked\")\npublic void methodName() {\n    //\
    \ Suppress unchecked warning\n}\n```\n\n### 自定义注解：\n```java\nimport java.lang.annotation.*;\n\
    \n@Retention(RetentionPolicy.RUNTIME)\n@Target(ElementType.METHOD)\npublic @interface\
    \ MyAnnotation {\n    String value() default \"Default Value\";\n    int count()\
    \ default 1;\n}\n```\n\n@Retention: 指定注解在何时被保留，例如，在源码解析期间、编译期间或运行时。\n\n@Target:\
    \ 指定注解可以应用到何处，例如方法、字段或类。\n\n### Java 反射：反射是 Java 中的一种特性，允许你在运行时动态地检查和与程序的类、方法、字段和其他组件进行交互。`java.lang.reflect`\
    \ 包提供了用于反射的类和接口。\n\n示例：\n\n```java\nimport java.lang.reflect.Method;\n\npublic\
    \ class ReflectionExample {\n    public static void main(String[] args) throws\
    \ NoSuchMethodException {\n        MyClass obj = new MyClass();\n\n        //\
    \ 获取对象的类\n        Class<?> myClass = obj.getClass();\n\n        // 获取类的声明方法\n\
    \        Method[] methods = myClass.getDeclaredMethods();\n\n        // 打印方法的名称\n\
    \        for (Method method : methods) {\n            System.out.println(\"Method\
    \ Name: \" + method.getName());\n        }\n\n        // 动态调用方法\n        try {\n\
    \            Method myMethod = myClass.getDeclaredMethod(\"myMethod\");\n    \
    \        myMethod.invoke(obj);\n        } catch (Exception e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n\nclass MyClass {\n    public void myMethod() {\n      \
    \  System.out.println(\"Hello from myMethod!\");\n    }\n}\n```\n\n在例例中，反射被用于检查\
    \ `MyClass` 的方法并在运行时动态调用 `myMethod`。\n\n虽然反射非常强大，但由于其对性能和类型安全的潜在影响，应该谨慎使用。它通常用于框架、库和测试工具等场景中。\n\
    \n## 22. 文件和目录处理 (java.nio)\n\n与旧的 `java.io` 包相比，Java 的 `java.nio` 包为文件和目录处理提供了现代且更灵活的\
    \ API。它包含了 `Path`、`Paths` 和 `Files` 类用于处理文件系统。让我们使用 `java.nio` 探索一些基础的文件目录操作。\n\
    \n### 创建文件：\n\n```java\nimport java.io.IOException;\nimport java.nio.file.Files;\n\
    import java.nio.file.Path;\nimport java.nio.file.Paths;\n\npublic class FileHandlingExample\
    \ {\n    public static void main(String[] args) {\n        // 定义文件路径\n       \
    \ Path filePath = Paths.get(\"example.txt\");\n\n        // 创建文件\n        try\
    \ {\n            Files.createFile(filePath);\n            System.out.println(\"\
    File created: \" + filePath);\n        } catch (IOException e) {\n           \
    \ e.printStackTrace();\n        }\n    }\n}\n```\n\n### 写入文件：\n\n```java\nimport\
    \ java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\n\
    import java.nio.file.Paths;\nimport java.util.List;\n\npublic class FileHandlingExample\
    \ {\n    public static void main(String[] args) {\n        // 定义文件路径\n       \
    \ Path filePath = Paths.get(\"example.txt\");\n\n        // 向文件写入内容\n        try\
    \ {\n            String content = \"Hello, Java NIO\";\n            Files.write(filePath,\
    \ content.getBytes());\n            System.out.println(\"Content written to the\
    \ file.\");\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n### 从文件读取：\n\n```java\nimport java.io.IOException;\n\
    import java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\n\
    import java.util.List;\n\npublic class FileHandlingExample {\n    public static\
    \ void main(String[] args) {\n        // 定义文件路径\n        Path filePath = Paths.get(\"\
    example.txt\");\n\n        // 从文件读取内容\n        try {\n            List<String>\
    \ lines = Files.readAllLines(filePath);\n            System.out.println(\"Content\
    \ read from the file:\");\n            for (String line : lines) {\n         \
    \       System.out.println(line);\n            }\n        } catch (IOException\
    \ e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n### 创建目录：\n\
    \n```java\nimport java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\n\
    import java.nio.file.Paths;\n\npublic class DirectoryHandlingExample {\n    public\
    \ static void main(String[] args) {\n        // 定义目录路径\n        Path directoryPath\
    \ = Paths.get(\"myDirectory\");\n\n        // 创建目录\n        try {\n          \
    \  Files.createDirectory(directoryPath);\n            System.out.println(\"Directory\
    \ created: \" + directoryPath);\n        } catch (IOException e) {\n         \
    \   e.printStackTrace();\n        }\n    }\n}\n```\n\n### 列出目录中的文件：\n```java\n\
    import java.io.IOException;\nimport java.nio.file.DirectoryStream;\n```\n\n"
