  md: '# 44 .XML and JSON Handling


    DOM (Document Object Model):


    Parsing XML: Java provides the javax.xml.parsers package for parsing XML using
    the DOM approach.


    Example:


    ```

    DocumentBuilderFactory factory = DocumentBuilderFactory.newInstance();

    DocumentBuilder builder = factory.newDocumentBuilder();

    Document document = builder.parse(new File("example.xml"));

    ```


    Working with XML Document: Once parsed, you can traverse, modify, and manipulate
    the XML document using DOM APIs.


    Element root = document.getDocumentElement();


    NodeList nodeList = root.getElementsByTagName("elementName");


    SAX (Simple API for XML): Event-Based Parsing: SAX is an event-driven approach
    where the parser notifies the application of XML elements as it encounters them.


    Example:


    ```

    SAXParserFactory factory = SAXParserFactory.newInstance();

    SAXParser saxParser = factory.newSAXParser();

    saxParser.parse(new File("example.xml"), new MyHandler());

    ```


    Implementing SAX Handler: You need to implement the org.xml.sax.helpers.DefaultHandler
    class and override methods to handle events.'
