- md: "\n```java\nimport java.nio.file.FileVisitOption;\nimport java.nio.file.FileVisitResult;\n\
    import java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\n\
    import java.io.IOException;\n\npublic class DirectoryHandlingExample {\n    public\
    \ static void main(String[] args) {\n        // Define the directory path\n  \
    \      Path directoryPath = Paths.get(\"myDirectory\");\n\n        // List files\
    \ in the directory\n        try (DirectoryStream<Path> stream = Files.newDirectoryStream(directoryPath))\
    \ {\n            System.out.println(\"Files in the directory:\");\n          \
    \  for (Path file : stream) {\n                System.out.println(file.getFileName());\n\
    \            }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\nThese examples cover basic file and directory operations\
    \ using the java.nio package. The Path interface provides a platform-independent\
    \ representation of file paths, and the Files class contains static utility methods\
    \ for common file operations.\n\n# 23. Networking and Communication\n\nJava provides\
    \ extensive libraries for networking and communication, allowing developers to\
    \ create client-server applications, work with sockets, and handle network protocols.\
    \ Let's explore some basic concepts and examples in Java networking.\n\n### Server-Side\
    \ Socket:\n\n```java\nimport java.io.IOException;\nimport java.net.ServerSocket;\n\
    import java.net.Socket;\n\npublic class ServerExample {\n    public static void\
    \ main(String[] args) {\n        int portNumber = 8080;\n\n        try (ServerSocket\
    \ serverSocket = new ServerSocket(portNumber)) {\n            System.out.println(\"\
    Server listening on port \" + portNumber);\n\n            while (true) {\n   \
    \             // Accept incoming client connections\n                Socket clientSocket\
    \ = serverSocket.accept();\n                System.out.println(\n            \
    \        \"Client connected: \" + clientSocket.getInetAddress()\n            \
    \    );\n                // Handle client communication in a separate thread\n\
    \                new Thread(new ClientHandler(clientSocket)).start();\n      \
    \      }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n### Client-Side Socket:\n\n```java\nimport java.io.BufferedReader;\n\
    import java.io.IOException;\nimport java.io.InputStreamReader;\nimport java.io.PrintWriter;\n\
    import java.net.Socket;\n\npublic class ClientExample {\n\n    public static void\
    \ main(String[] args) {\n        String serverAddress = \"localhost\";\n     \
    \   int portNumber = 8080;\n\n        try (\n            Socket socket = new Socket(serverAddress,\
    \ portNumber);\n            PrintWriter out = new PrintWriter(socket.getOutputStream(),\
    \ true);\n            BufferedReader in = new BufferedReader(\n              new\
    \ InputStreamReader(socket.getInputStream()))\n        ) {\n            // Send\
    \ a message to the server\n            out.println(\"Hello, Server!\");\n\n  \
    \          // Receive the server's response\n            String response = in.readLine();\n\
    \            System.out.println(\"Server response: \" + response);\n        }\
    \ catch (IOException e) {\n            e.printStackTrace();\n        }\n    }\n\
    }\n```\n\n### Handling Client Communication in a Separate Thread:\n\n```java\n\
    import java.io.BufferedReader;\nimport java.io.IOException;\nimport java.io.InputStreamReader;\n\
    import java.io.PrintWriter;\nimport java.net.Socket;\n\npublic class ClientHandler\
    \ implements Runnable {\n    private final Socket clientSocket;\n\n    public\
    \ ClientHandler(Socket clientSocket) {\n        this.clientSocket = clientSocket;\n\
    \    }\n\n    @Override\n    public void run() {\n        try {\n            PrintWriter\
    \ out = new PrintWriter(clientSocket.getOutputStream(), true);\n            BufferedReader\
    \ in = new BufferedReader(\n                new InputStreamReader(clientSocket.getInputStream())\n\
    \            );\n            // Receive message from the client\n            String\
    \ clientMessage = in.readLine();\n            System.out.println(\"Received from\
    \ client: \" + clientMessage);\n\n            // Send a response back to the client\n\
    \            out.println(\"Message received!\");\n        } catch (IOException\
    \ e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\nThese examples\
    \ demonstrate a simple client-server communication using sockets in Java. The\
    \ server listens on a specific port, and when a client connects, it creates a\
    \ new thread to handle the communication with that client. The client connects\
    \ to the server, sends a message, and receives a response.\n\nJava's networking\
    \ capabilities extend beyond basic sockets to include features for working with\
    \ protocols such as HTTP, creating web services, and more.\n\n# 24. Functional\
    \ Programming with Java 8\n(Lambda Expressions, Streams)\n\nJava 8 introduced\
    \ significant features for functional programming, including lambda expressions\
    \ and streams. These features enhance code readability, conciseness, and support\
    \ functional programming paradigms.\n\n### Lambda Expressions:\n\nLambda expressions\
    \ enable the concise representation of anonymous functions (functional interfaces)\
    \ in Java. They provide a clear and expressive way to represent behavior as data.\n\
    \nHere's a simple example:\n\n```java\n// Traditional approach without lambda\n\
    Runnable runnable1 = new Runnable() {\n    @Override\n    public void run() {\n\
    \        System.out.println(\"Hello, world!\");\n    }\n}\n```\n\n```java\n//\
    \ Using lambda expression\nRunnable runnable2 = () -> System.out.println(\"Hello,\
    \ world!\");\n```\n\n```java\n// Running the runnables\nrunnable1.run();\nrunnable2.run();\n\
    ```\n\nLambda expressions are particularly useful when working with functional\
    \ interfaces (interfaces with single abstract method). For example, the Comparator\
    \ interface:\n\n```java\nList<String> names = Arrays.asList(\"Alice\", \"Bob\"\
    , \"Charlie\", \"David\");\n```\n\n```java\n// Sorting using anonymous class\n\
    Collections.sort(names, new Comparator<String>() { {\n    @Override\n    public\
    \ int compare(String s1, String s2) {\n        return s1.length() - s2.length();\n\
    \    }\n});\n```\n\n```java\n// Sorting using lambda expression\nCollections.sort(names,\
    \ (s1, s2) -> s1.length() - s2.length());\n```\n\n### Streams: Streams provide\
    \ a powerful and declarative way to process collections of data in a functional\
    \ style. Streams enable you to express complex data manipulations using a sequence\
    \ of high-level operations. Here's an example of using streams to filter, map,\
    \ and collect data:\n\n```java\nList<String> words = Arrays.asList(\"apple\",\
    \ \"banana\", \"orange\", \"grape\", \"watermelon\");\n```\n\n```java\n// Using\
    \ stream to filter, map, and collect\nList<String> result = words.stream()\n \
    \   .filter(s -> s.length() > 5)\n    .map(String::toUpperCase)\n    .collect(Collectors.toList());\n\
    \nSystem.out.println(result); // Output: [ORANGE, WATERMELON]\n```\n\nStreams\
    \ support parallel processing, which can lead to significant performance improvements\
    \ when working with large datasets.\n\n### Functional Interfaces:\n\nJava 8 introduced\
    \ functional interfaces, which are interfaces with a single abstract method. Examples\
    \ include Runnable, Comparator, and many others. Functional interfaces are the\
    \ foundation for lambda expressions.\n\n```java\n@FunctionalInterface\ninterface\
    \ MyFunction {\n    void myMethod();\n}\n```\n\n```java\n// Using a lambda expression\
    \ to implement MyFunction\nMyFunction myFunction = () -> System.out.println(\"\
    Hello, functional!\");\n\nmyFunction.myMethod();\n```\n\nJava 8's features for\
    \ functional programming—lambda expressions and streams—have transformed the way\
    \ developers write code in Java. They provide concise syntax, enable better abstraction,\
    \ and improve the expressiveness of the language. As a result, Java has become\
    \ more competitive in the functional programming space.\n"
  mdcn: "\n\n```java\nimport java.nio.file.FileVisitOption;\nimport java.nio.file.FileVisitResult;\n\
    import java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\n\
    import java.io.IOException;\n\npublic class DirectoryHandlingExample {\n    public\
    \ static void main(String[] args) {\n        // 定义目录路径\n        Path directoryPath\
    \ = Paths.get(\"myDirectory\");\n\n        // 列出目录中的文件\n        try (DirectoryStream<Path>\
    \ stream = Files.newDirectoryStream(directoryPath)) {\n            System.out.println(\"\
    Files in the directory:\");\n            for (Path file : stream) {\n        \
    \        System.out.println(file.getFileName());\n            }\n        } catch\
    \ (IOException e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\
    \n这些示例涵盖了使用 `java.nio` 包进行基础文件和目录操作。`Path` 接口提供了文件路径的平台无关表示，而 `Files` 类包含了用于常用文件操作的静态实用方法。\n\
    \n# 23. 网络与通信\n\nJava 为网络和通信提供了丰富的库，允许开发者创建客户端-服务器应用程序、处理套接字操作以及处理网络协议。让我们探索 Java\
    \ 网络中的一些基本概念和示例。\n\n### 服务端 Socket：\n\n```java\nimport java.io.IOException;\n\
    import java.net.ServerSocket;\nimport java.net.Socket;\n\npublic class ServerExample\
    \ {\n    public static void main(String[] args) {\n        int portNumber = 8080;\n\
    \n        try (ServerSocket serverSocket = new ServerSocket(portNumber)) {\n \
    \           System.out.println(\"Server listening on port \" + portNumber);\n\n\
    \            while (true) {\n                // 接收传入的客户端连接\n                Socket\
    \ clientSocket = serverSocket.accept();\n                System.out.println(\n\
    \                    \"Client connected: \" + clientSocket.getInetAddress()\n\
    \                );\n                // 在独立线程中处理客户端通信\n                new Thread(new\
    \ ClientHandler(clientSocket)).start();\n            }\n        } catch (IOException\
    \ e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n### 客户端\
    \ Socket：\n\n```java\nimport java.io.BufferedReader;\nimport java.io.IOException;\n\
    import java.io.InputStreamReader;\nimport java.io.PrintWriter;\nimport java.net.Socket;\n\
    \npublic class ClientExample {\n\n    public static void main(String[] args) {\n\
    \        String serverAddress = \"localhost\";\n        int portNumber = 8080;\n\
    \n        try (\n            Socket socket = new Socket(serverAddress, portNumber);\n\
    \            PrintWriter out = new PrintWriter(socket.getOutputStream(), true);\n\
    \            BufferedReader in = new BufferedReader(\n              new InputStreamReader(socket.getInputStream()))\n\
    \        ) {\n            // 向服务器发送消息\n            out.println(\"Hello, Server!\"\
    );\n\n            // 接收服务器的响应\n            String response = in.readLine();\n\
    \            System.out.println(\"Server response: \" + response);\n        }\
    \ catch (IOException e) {\n            e.printStackTrace();\n        }\n    }\n\
    }\n```\n\n### 在独立线程中处理客户端通信：\n\n```java\nimport java.io.BufferedReader;\nimport\
    \ java.io.IOException;\nimport java.io.InputStreamReader;\nimport java.io.PrintWriter;\n\
    import java.net.Socket;\n\npublic class ClientHandler implements Runnable {\n\
    \    private final Socket clientSocket;\n\n    public ClientHandler(Socket clientSocket)\
    \ {\n        this.clientSocket = clientSocket;\n    }\n\n    @Override\n    public\
    \ void run() {\n        try {\n            PrintWriter out = new PrintWriter(clientSocket.getOutputStream(),\
    \ true);\n            BufferedReader in = new BufferedReader(\n              \
    \  new InputStreamReader(clientSocket.getInputStream())\n            );\n    \
    \        // 接收来自客户端的消息\n            String clientMessage = in.readLine();\n  \
    \          System.out.println(\"Received from client: \" + clientMessage);\n\n\
    \            // 向客户端返回响应\n            out.println(\"Message received!\");\n  \
    \      } catch (IOException e) {\n            e.printStackTrace();\n        }\n\
    \    }\n}\n```\n\n这些示例演示了使用 Java 套接字进行简单的客户端-服务器通信。服务器在特定端口上监听，当客户端连接时，它会创建一个新线程来处理与该客户端的通信。客户端连接到服务器，发送消息并接收响应。\n\
    \nJava 的网络能力不仅限于基础套接字，还包括处理 HTTP 等协议的功能、创建 Web 服务等内容。\n\n# 24. Java 8 中的函数式编程\n\
    （Lambda 表达式、流）\n\nJava 8 引入了函数式编程的重要特性，包括 Lambda 表达式和流（Streams）。这些特性增强了代码的可读性和简洁性，并支持函数式编程范式。\n\
    \n### Lambda 表达式：\n\nLambda 表达式允许在 Java 中简洁地表示匿名函数（函数式接口）。它们提供了一种清晰且丰富的方式将行为表示为数据。\n\
    \n这是一个简单的示例：\n\n```java\n// 不使用 lambda 的传统方法\nRunnable runnable1 = new Runnable()\
    \ {\n    @Override\n    public void run() {\n        System.out.println(\"Hello,\
    \ world!\");\n    }\n}\n```\n\n```java\n// 使用 lambda 表达式\nRunnable runnable2 =\
    \ () -> System.out.println(\"Hello, world!\");\n```\n\n```java\n// 运行 runnable\n\
    runnable1.run();\nrunnable2.run();\n```\n\nLambda 表达式在处理函数式接口（带有单个抽象方法的接口）时特别有用。例如\
    \ `Comparator` 接口：\n\n```java\nList<String> names = Arrays.asList(\"Alice\", \"\
    Bob\", \"Charlie\", \"David\");\n```\n\n```java\n// 使用匿名类排序\nCollections.sort(names,\
    \ new Comparator<String>() {\n    @Override\n    public int compare(String s1,\
    \ String s2) {\n        return s1.length() - s2.length();\n    }\n});\n```\n\n\
    ```java\n// 使用 lambda 表达式排序\nCollections.sort(names, (s1, s2) -> s1.length() -\
    \ s2.length());\n```\n\n### 流（Streams）：流提供了一种强大且声明式的方式以函数式风格处理集合。流允许你使用一系列高级操作来表达复杂的数据处理。这是一个使用流进行过滤、映射和收集数据的示例：\n\
    \n```java\nList<String> words = Arrays.asList(\"apple\", \"banana\", \"orange\"\
    , \"grape\", \"watermelon\");\n```\n\n```java\n// 使用流进行过滤、映射和收集\nList<String>\
    \ result = words.stream()\n    .filter(s -> s.length() > 5)\n    .map(String::toUpperCase)\n\
    \    .collect(Collectors.toList());\n\nSystem.out.println(result); // 输出: [ORANGE,\
    \ WATERMELON]\n```\n\n流支持并行处理，在处理大数据集时可以带来显著的性能提升。\n\n### 函数式接口：\n\nJava 8 引入了函数式接口，即带有单个抽象方法的接口。示例包括\
    \ `Runnable`、`Comparator` 等许多其他。函数式接口是 Lambda 表达式的的基础。\n\n```java\n@FunctionalInterface\n\
    interface MyFunction {\n    void myMethod();\n}\n```\n\n```java\n// 使用 lambda\
    \ 表达式实现 MyFunction\nMyFunction myFunction = () -> System.out.println(\"Hello,\
    \ functional!\");\n\nmyFunction.myMethod();\n```\n\nJava 8 的函数式编程特性——Lambda 表达式和流——改变了开发者编写\
    \ Java 代码的方式。它们提供了简洁的语法，实现了更好的抽象，并提升了语言的表达力。结果是，Java 在函数式编程领域变得更具竞争力。\n\n"
