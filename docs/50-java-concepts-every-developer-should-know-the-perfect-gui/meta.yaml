    \npublic class Deeplearning4jExample {\n    public static void main(String[] args)\
    \ throws Exception {\n        int batchSize = 64;\n        int numEpochs = 1;\n\
    \n        // 加载 MNIST 数据集\n        MnistDataSetIterator mnistTrain = new MnistDataSetIterator(batchSize,\
