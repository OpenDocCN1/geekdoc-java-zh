    \      } else {\n            return ResponseEntity.notFound().build();\n     \
    \   }\n    }\n}\n```\n\n### security with Spring Security: Spring Security provides\
    \ a robust and customizable authentication and access control framework.\n\n1.\
    \ Security Configuration: Configure security settings using @EnableWebSecurity\
    \ and extending SecurityConfigurerAdapter.\n\n```java\nimport org.springframework.context.annotation.Bean;\n\
    import org.springframework.security.config.annotation.web.EnableWebSecurity;\n\
    import org.springframework.security.config.annotation.web.SecurityConfigurerAdapter;\n\
    import org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder;\nimport\
    \ org.springframework.security.crypto.password.PasswordEncoder;\n\n@EnableWebSecurity\n\
    public class SecurityConfig extends SecurityConfigurerAdapter {\n    @Override\n\
    \    protected void configure(HttpSecurity http) throws Exception {\n        http.authorizeRequests()\n\
    \            .antMatchers(\"/api/public/**\").permitAll()\n            .anyRequest().authenticated()\n\
    \        .and()\n        .formLogin()\n            .loginPage(\"/login\")\n  \
    \          .permitAll()\n        .and()\n        .logout()\n        .permitAll();\n\
    \    }\n\n    @Bean\n    public PasswordEncoder passwordEncoder() {\n        return\
    \ new BCryptPasswordEncoder();\n    }\n}\n```\n\n### User Authentication: Authenticate\
    \ users using UserDetailsService and provide password encoding.\n\n```java\nimport\
    \ org.springframework.security.core.userdetails.User;\nimport org.springframework.security.core.userdetails.UserDetails;\n\
    import org.springframework.security.core.userdetails.UserDetailsService;\nimport\
    \ org.springframework.security.core.userdetails.UsernameNotFoundException;\n```\n\
    \n```java\n@Service\npublic class UserServiceImpl implements UserDetailsService\
    \ {\n    @Autowired\n    private UserRepository userRepository;\n\n    @Override\n\
    \    public UserDetails loadByUsername(String username) throws UsernameNotFoundException\
    \ {\n        com.example.model.User user = userRepository.findByUsername(username);\n\
    \        if (user == null) {\n            throw new UsernameNotFoundException(\"\
    User not found\");\n        }\n\n        return User.builder()\n            .username(user.getUsername())\n\
    \            .password(user.getPassword())\n            .roles(\"USER\")\n   \
    \         .build();\n    }\n}\n```\n\n### Swagger for API Documentation: Swagger\
    \ is a tool that simplifies API development, testing, and documentation.\n\n-\
    \ 1. Swagger Configuration: Configure Swagger using @EnableSwagger2 and @EnableSwagger2WebMvc.\n\
    \n```java\nimport springfox.documentation.swagger2.annotations.EnableSwagger2;\n\
    \n@Configuration\n@EnableSwagger2\npublic class SwaggerConfig {\n    @Bean\n \
    \   public Docket api() {\n        return new Docket(DocumentationType.SWAGGER_2)\n\
    \            .select()\n            .apis(RequestHandlerSelectors.basePackage(\"\
    com.example.controller\"))\n            .paths(PathSelectors.any())\n        \
    \    .build();\n    }\n}\n```\n\nAccess Swagger UI: Access the Swagger UI at http://localhost:8080/swagger-ui.html\n\
    \nSpring provides a comprehensive set of tools for building RESTful APIs, handling\
    \ data with Spring Data JPA, securing applications with Spring Security, and documenting\
    \ APIs with Swagger.\n\nThe Spring Boot framework simplifies the setup and configuration\
    \ of these components, allowing developers to focus on building feature-rich and\
    \ scalable APIs.\n\n# 38. Dependency Injection in Spring\n\nDependency Injection\
    \ (DI) is a fundamental concept in the Spring Framework that promotes loose coupling\
    \ and modularization of code. In Spring, DI is achieved through the Inversion\
    \ of Control (IoC) container, which manages the creation and injection of dependencies\
    \ into beans.\n\nLet's explore Dependency Injection in Spring:\n\n- 1. Understanding\
    \ Dependencies: In a software application, dependencies are objects that a class\
    \ needs to perform its functions. Instead of creating the dependencies within\
    \ the class, Spring promotes the injection of these dependencies from external\
    \ sources.\n\n- 2. Types of Dependency Injection in Spring: Spring supports two\
    \ main types of Dependency Injection:\n\nConstructor Injection: Dependencies are\
    \ injected through the constructor of the class.\n\n```java\npublic class MyClass\
    \ {\n    private MyDependency myDependency;\n\n    // Constructor Injection\n\
    \    public MyClass(MyDependency myDependency) {\n        this.myDependency =\
    \ myDependency;\n    }\n\n    // Class methods using myDependency\n}\n```\n\n\
    Setter Injection: Dependencies are injected through setter methods.\n\n```java\n\
    public class MyClass {\n    private MyDependency myDependency;\n\n    // Setter\
    \ Injection\n    public void setMyDependency(MyDependency myDependency) {\n  \
    \      this.myDependency = myDependency;\n    }\n\n    // Class methods using\
    \ myDependency\n}\n```\n\nUsing Annotations for Dependency Injection: Spring provides\
    \ annotations to simplify dependency injection.\n\n@Autowired: Automatically injects\
    \ dependencies into the class, either through the constructor, a setter method,\
    \ or a field.\n\n```java\npublic class MyClass {\n    private MyDependency myDependency;\n\
    \n    // Constructor Injection\n    @Autowired\n    public MyClass(MyDependency\
    \ myDependency) {\n        this.myDependency = myDependency;\n    }\n\n    //\
    \ Class methods using myDependency\n}\n```\n\n@Qualifier: Used in conjunction\
    \ with @Autowired to specify which bean to inject when multiple beans of the same\
    \ type exist.\n\n```java\npublic class MyClass {\n    private MyDependency myDependency;\n\
    \n    // Constructor Injection\n    @Autowired\n    public MyClass(@Qualifier(\"\
    specificBean\") MyDependency myDependency) {\n        this.myDependency = myDependency;\n\
    \    }\n\n    // Class methods using myDependency\n}\n```\n\nXML Configuration\
    \ for Dependency Injection: In addition to annotations, Spring allows dependency\
    \ injection through XML configuration.\n\nConstructor Injection in XML:\n\n```xml\n\
    <bean id=\"myClass\" class=\"com.example.MyClass\">\n    <constructor-arg ref=\"\
    myDependency\"/>\n</bean>\n<bean id=\"myDependency\" class=\"com.example.MyDependency\"\
    />\n```\n\nSetter Injection in XML:\n\n```xml\n<bean id=\"myClass\" class=\"com.example.MyClass\"\
    >\n  <property name=\"myDependency\" ref=\"myDependency\"/>\n</bean>\n<bean id=\"\
    myDependency\" class=\"com.example.MyDependency\"/>\n```\n\nComponent Scanning:\
    \ Spring can automatically detect and register beans using component scanning.\
    \ Classes annotated with @Component, @Service, @Repository, or @Controller are\
    \ automatically considered as beans.\n\nExample using @Component:\n\n```java\n\
    @Component\npublic class MyDependency {\n  // Class definition\n}\n```\n\nUsing\
    \ @Autowired with Collections: @Autowired can be used with collections to inject\
    \ all beans of a certain type.\n\n```java\npublic class MyClass {\n  private List<MyDependency>\
    \ myDependencies;\n\n  // Constructor Injection with List\n  @Autowired\n  public\
    \ MyClass(List<MyDependency> myDependencies) {\n    this.myDependencies = myDependencies;\n\
    \  }\n\n  // Class methods using myDependencies\n}\n```\n\nAdvantages of Dependency\
    \ Injection:\n\n- Loose Coupling: Classes are not tightly coupled with dependencies.\n\
    - Testing: Easier unit testing as dependencies can be easily mocked or substituted.\n\
    - Reusability: Dependencies can be reused in different parts of the application.\n\
    \nDependency Injection is a core concept in the Spring Framework, promoting modularity,\
    \ maintainability, and testability in Java applications. Whether using annotations,\
    \ XML configuration, or component scanning, Spring provides various mechanisms\
    \ to achieve Dependency Injection.\n"
