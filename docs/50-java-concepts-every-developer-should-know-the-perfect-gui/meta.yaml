  md: '# 20. Reference Types and Primitive Types


    In Java, data types can be broadly classified into two categories: primitive types
    and reference types. Let''s explore the differences between them:


    Primitive Types: Primitive types represent simple, single values and are the basic
    building blocks of data in Java. They are predefined by the language and have
    reserved keywords. The primitive types in Java are:


    Integer Types:


    +   - byte: 8-bit signed integer

    - short: 16-bit signed integer

    - int: 32-bit signed integer

    - long: 64-bit signed integer


    Floating-Point Types:


    +   - float: 32-bit floating-point

    - double: 64-bit floating-point


    Character Type:


    +   - char: 16-bit Unicode character'
