    # 25. JDBC and Database Handling


    JDBC is a Java API that provides a standard interface for connecting to relational
    databases and executing SQL queries. It enables Java applications to interact
    with databases, perform CRUD (Create, Read, Update, Delete) operations, and manage
    database transactions.


    Basic Steps in JDBC:


    Load the JDBC Driver: JDBC drivers are platform-specific implementations that
    enable Java applications to communicate with a particular database. Load the appropriate
    driver using Class.forName().


    ```

    Class.forName("com.mysql.cj.jdbc.Driver");

    ```


    Establish a Connection: Use DriverManager.getConnection() to establish a connection
    to the database.


    ```

    String url = "jdbc:mysql://localhost:3306/mydatabase";

    String username = "user";

    String password = "password";

    Connection connection = DriverManager.getConnection(url, username, password);

    ```


    Create a Statement: Create a Statement or PreparedStatement object for executing
    SQL queries.


    ```

    Statement statement = connection.createStatement();

    ```'
- md: "\nExecute SQL Queries: Use the executeQuery() method to execute SELECT queries.\n\
    \n```java\nResultSet resultSet = statement.executeQuery(\"SELECT * FROM employees\"\
    );\n```\n\nUse executeUpdate() for INSERT, UPDATE, DELETE queries.\n\n```java\n\
    int rowsAffected = statement.executeUpdate(\"INSERT INTO employees (name, age)\
    \ VALUES ('John Doe', 30)\");\n```\n\nProcess the Results: Process the ResultSet\
    \ to retrieve data from SELECT queries.\n\n```java\nwhile (resultSet.next()) {\n\
    \  String name = resultSet.getString(\"name\");\n  int age = resultSet.getInt(\"\
    age\");\n  System.out.println(\"Name: \" + name + \", Age: \" + age);\n}\n```\n\
    \nClose Resources: Close the ResultSet, Statement, and Connection to release resources.\n\
    \n```java\nresultSet.close();\nstatement.close();\nconnection.close();\n```\n\n\
    Example of JDBC:\n\n```java\nimport java.sql.Connection;\nimport java.sql.DriverManager;\n\
    import java.sql.ResultSet;\nimport java.sql.SQLException;\nimport java.sql.Statement;\n\
    \npublic class JdbcExample {\n\n    public static void main(String[] args) {\n\
    \        String url = \"jdbc:mysql://localhost:3306/mydatabase\";\n        String\
    \ username = \"user\";\n        String password = \"password\";\n\n        try\
    \ {\n            Connection connection = DriverManager.getConnection(\n      \
    \          url,\n                username,\n                password\n       \
    \     );\n            Statement statement = connection.createStatement();\n  \
    \          // SELECT query\n            ResultSet resultSet = statement.executeQuery(\"\
    SELECT * FROM employees\");\n\n            // Process the results\n          \
    \  while (resultSet.next()) {\n                String name = resultSet.getString(\"\
    name\");\n                int age = resultSet.getInt(\"age\");\n             \
    \   System.out.println(\"Name: \" + name + \", Age: \" + age);\n            }\n\
    \n            // INSERT query\n            int rowsAffected = statement.executeUpdate(\n\
    \                \"INSERT INTO employees (name, age) VALUES ('John Doe', 30)\"\
    \n            );\n            System.out.println(rowsAffected + \" rows(s) affected.\"\
    );\n        } catch (SQLException e) {\n            e.printStackTrace();\n   \
    \     }\n    }\n}\n```\n\n# Transaction Management:\n\n```java\ntry (Connection\
    \ connection = DriverManager.getConnection(url, username, password);\n     Statement\
    \ statement = connection.createStatement()) {\n\n    // Start transaction\n  \
    \  connection.setAutoCommit(false);\n\n    // Perform multiple SQL operations\n\
    \    statement.executeUpdate(\"UPDATE employees SET salary = salary + 1000 WHERE\
    \ age < 30\");\n    statement.executeUpdate(\"UPDATE employees SET salary = salary\
    \ - 500 WHERE age >= 30\");\n\n    // Commit the transaction\n    connection.commit();\n\
    } catch (SQLException e) {\n  // Rollback the transaction in case of an exception\n\
    \  connection.rollback();\n  e.printStackTrace();\n}\n```\n\nThis example demonstrates\
    \ a simple JDBC program connecting to a MySQL database, executing SELECT and INSERT\
    \ queries, and managing transactions. JDBC provides a powerful and standardized\
    \ way to interact with databases in Java applications.\n\n# 26. Web Development\
    \ Frameworks (Servlets, JSP)\n\nServlets and JavaServer Pages (JSP) are fundamental\
    \ components of Java-based web development. They provide a server-side approach\
    \ for creating dynamic web applications. Let's explore Servlets and JSP, their\
    \ roles, and how they work together.\n\nServlets are Java classes that extend\
    \ the functionality of web servers to process requests and generate dynamic responses.\
    \ They handle HTTP requests, process business logic, and produce HTML or other\
    \ types of responses. Servlets are part of the Java EE (Enterprise Edition) platform,\
    \ now known as Jakarta EE.\n\nKey Concepts:\n\n- Servlet Lifecycle: Servlets go\
    \ through a lifecycle involving initialization, handling requests, and destruction.\
    \ Key methods include init(), service(), and destroy().\n- Handling Requests:\
    \ Servlets receive and process requests from clients (usually web browsers). They\
    \ extract information from the request (parameters, headers) and generate a response.\n\
    - Generating Responses: Servlets dynamically generate responses, typically HTML,\
    \ by interacting with databases, performing business logic, or utilizing other\
    \ resources.\n- URL Mapping: Servlets are mapped to specific URLs using deployment\
    \ descriptors (web.xml) or annotations (@WebServlet). This defines which servlet\
    \ handles requests for a particular URL pattern.\n\nExample Servlet:\n\n```java\n\
    import java.io.IOException;\nimport javax.servlet.ServletException;\nimport javax.servlet.annotation.WebServlet;\n\
    import javax.servlet.http.HttpServlet;\nimport javax.servlet.http.HttpServletRequest;\n\
    import javax.servlet.http.HttpServletResponse;\n\n@WebServlet(\"/hello\")\npublic\
    \ class HelloServlet extends HttpServlet {\n    protected void doGet(HttpServletRequest\
    \ request, HttpServletResponse response)\n        throws ServletException, IOException\
    \ {\n        response.getWriter().println(\"Hello, Servlet!\");\n    }\n}\n```\n\
    \nJavaServer Pages JSP: JSP is a technology that simplifies the development of\
    \ web applications by allowing the embedding of Java code directly into HTML pages.\
    \ JSP pages are compiled into servlets by the servlet container during runtime.\n\
    \nKey Concepts:\n\n- Mixing Java with HTML: JSP allows developers to embed Java\
    \ code within HTML pages, making it easy to create dynamic content. Java code\
    \ is enclosed in <% %> tags.\n- Implicit Objects: JSP provides a set of implicit\
    \ objects (e.g., request, response, session) that represent various aspects of\
    \ the HTTP request and response.\n- Tag Libraries: JSP uses custom tag libraries,\
    \ such as JSTL (JavaServer Pages Standard Tag Library), to encapsulate common\
    \ functionalities and simplify page development.\n- Expression Language (EL):\
    \ EL allows the easy retrieval and manipulation of data within JSP pages. It simplifies\
    \ the embedding of dynamic data into HTML.\n\nExample JSP:\n\n```jsp\n<% page\
    \ language=\"java\" contentType=\"text/html; charset=UTF-8\" pageEncoding=\"UTF-8\"\
    %>\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>My JSP Page</title>\n\
    </head>\n<body>\n<h2>Hello, <% request.getParameter(\"name\") %>!</h2>\n</body>\n\
    </html>\n```\n\nServlets and JSP Together: Servlets and JSP often work together\
    \ in web applications. Servlets handle business logic, process requests, and dispatch\
    \ control to JSP pages for generateing HTML content. This separation of concerns\
    \ follows the Model-View-Controller (MVC) architecture.\n\n# Servlet Dispatching\
    \ to JSP:\n\n```java\n@WebServlet(\"/greet\")\npublic class GreetingsServlet extends\
    \ HttpServlet {\n\n    protected void doGet(HttpServletRequest request, HttpServletResponse\
    \ response)\n        throws ServletException, IOException {\n        // Perform\
    \ business logic\n        String username = request.getParameter(\"name\");\n\n\
    \        // Set data in request attribute\n        request.setAttribute(\"username\"\
    , username);\n\n        // Dispatch control to JSP for rendering\n        RequestDispatcher\
    \ dispatcher = request.getRequestDispatcher(\"/greet.jsp\");\n        dispatcher.forward(request,\
    \ response);\n    }\n}\n```\n\nIn the above example, the servlet processes a request,\
    \ sets data in the request attribute, and then forwards control to the JSP page\
    \ for rendering.\n\nServlets and JSP form the backbone of Java web development,\
    \ providing a robust and scalable approach for building dynamic web applications.\
    \ Modern Java web development has shifted towards using frameworks like Spring\
    \ MVC, but understanding the basics of Servlets and JSP remains essential.\n\n\
    # 27. RESTful API Handling (JAX-RS)\n\nJava API for RESTful Web Services (JAX-RS)\
    \ is a set of APIs that simplifies the development of RESTful web services in\
    \ Java. It is part of the Java EE (Enterprise Edition) platform, now known as\
    \ Jakarta EE. JAX-RS provides annotations for mapping Java methods to HTTP methods,\
    \ handling request and response formats, and more.\n\nKey Concepts in JAX-RS:\n\
    \n- Resource Classes: Resource classes in JAX-RS are Java classes annotated with\
    \ @Path to define the URI path at which the resource is hosted.\n\n```java\nimport\
    \ javax.ws.rs.GET;\nimport javax.ws.rs.Path;\n\n@Path(\"/hello\")\npublic class\
    \ HelloResource {\n    @GET\n    public String sayHello() {\n        return \"\
    Hello, JAX-RS!\";\n    }\n}\n```\n\n- HTTP Methods: JAX-RS uses annotations like\
    \ @GET, @POST, @PUT, and @DELETE to map Java methods to corresponding HTTP methods.\n"
