    \    KeyGenerator keyGenerator = KeyGenerator.getInstance(\"AES\");\n        keyGenerator.init(128);\
    \ // 128-bit key size\n        SecretKey secretKey = keyGenerator.generateKey();\n\
    \n        String plaintext = \"Hello, Encryption!\";\n        byte[] ciphertext\
