    \ iteration: 1\n    // While loop iteration: 2\n```\n\n此 while 循环只要条件 (count <\
    \ 3) 为真就会运行。它在每次迭代中打印迭代计数并增加 `count`。\n\n### do-while 循环：\n与 while 循环类似，但在检查条件之前，它至少会执行一次代码块。\n\
    \n```java\npublic class doWhileLoopExample {\n  public static void main(String[]\
    \ args) {\n    int doWhileCount = 0;\n\n    // do-while loop\n    do {\n     \
    \ System.out.println(\"Do-While loop iteration: \" + doWhileCount);\n      doWhileCount++;\n\
    \    } while (doWhileCount < 3);\n  }\n}\n\n// Do-While loop iteration: 0\n//\
    \ Do-While loop iteration: 1\n// Do-While loop iteration: 2\n```\n\ndo-while 循环与\
    \ while 循环相似，但它保证在检查条件之前至少执行一次代码块。\n\n# 4. Java 中的方法和类：\n\n在 Java 中，方法和类是基础的构建块，有助于代码的组织、重用和可维护性。方法是执行特定任务的代码块，而类是创建对象的蓝图。\n\
    \n让我们探索一个简单的示例：\n\n```java\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        // 创建一个 Calculator 类的对象\n        Calculator myCalculator =\
    \ new Calculator();\n\n        // 调用 Calculator 类的方法\n        int sum = myCalculator.add(10,\
    \ 5);\n        int difference = myCalculator.subtract(20, 8);\n\n        // 显示结果\n\
    \        System.out.println(\"Sum: \" + sum);\n        System.out.println(\"Difference:\
    \ \" + difference);\n    }\n}\n\n// Calculator 的类定义\nclass Calculator {\n    //\
    \ 相加两个数字的方法\n    int add(int a, int b) {\n        return a + b;\n    }\n\n   \
    \ // 减去两个数字的方法\n    int subtract(int a, int b) {\n        return a - b;\n    }\n\
    }\n}\n// Sum: 15\n// Difference: 12\n```\n\n在这个示例中，我们有一个包含 `main` 方法的 `Main` 类。该方法创建了\
    \ `Calculator` 类的对象，调用它的 `add` 和 `subtract` 方法，并将结果打印到控制台。\n\n定义在 `Main` 下方的 `Calculator`\
    \ 类封装了加减法的功能。`add` 和 `subtract` 方法执行相应的操作。\n\n# 5. 继承与多态\n\n继承和多态是面向对象编程（包括 Java）的核心概念。\n\
    \n继承允许一个类（子类或派生类）从另一个类（父类或基类）继承属性和行为。这促进了代码的重用和层次类结构的创建。\n\n例如：\n\n```java\n//\
    \ 父类\nclass Animal {\n    void makeSound() {\n        System.out.println(\"Some\
    \ sound\");\n    }\n}\n\n// 继承 Animal 的子类\nclass Dog extends Animal {\n    void\
    \ makeSound() {\n        System.out.println(\"Woof!\");\n    }\n}\n```\n\n在这个示例中，`Dog`\
    \ 类继承自 `Animal` 类。它可以访问 `Animal` 类的 `makeSound` 方法并用自己的实现对其进行重写。\n\n多态的意思是“多种形式”，允许不同类的对象被视为同一个公共父类的对象。这通常通过方法重写和方法重载来实现。\n\
    \n例如：\n\n```java\n// 父类\nclass Shape {\n\n    void draw() {\n    System.out.println(\"\
    Drawing a shape\");\n    }\n}\n\n// 重写 draw 方法的子类\nclass Circle extends Shape\
    \ {\n\n    void draw() {\n        System.out.println(\"Drawing a circle\");\n\
    \    }\n}\n\nclass Square extends Shape {\n\n    void draw() {\n        System.out.println(\"\
    Drawing a square\");\n    }\n}\n```\n\n在这种情况下，`Circle` 和 `Square` 类都扩展了 `Shape`\
    \ 类，并用它们特定的实现重写了它的 `draw` 方法。\n\n多态还包括方法重载，即在同一个类中，多个方法具有相同名称但不同的参数。\n\n```java\n\
    class Calculator {\n\n    int add(int a, int b) {\n        return a + b;\n   \
    \ }\n\n    double add(double a, double b) {\n        return a + b;\n    }\n}\n\
    ```\n\n在这里，`add` 方法被重载以同时接受整数和双精度参数。\n\n这些示例演示了继承和多态在 Java 中如何工作，允许代码重用并使对象能够被视为其父类的实例。\n\
    \n# 6. 接口与抽象类\n\n接口和抽象类是面向对象编程的基础概念，在 Java 中通常用于实现抽象、标准化类结构并支持多继承。\n\n接口：接口为一组类定义了遵守的合同。它包含方法签名但没有方法体，本质上是声明了应该实现什么，而不指定如何实现。在\
    \ Java 中，一个类可以实现一个或多个接口。\n\n例如：\n\n```java\n// 接口\ninterface Animal {\n    void\
    \ sound();\n    void move();\n}\n\n// 实现 Animal 接口的类\nclass Dog implements Animal\
    \ {\n\n    public void sound() {\n        System.out.println(\"Woof!\");\n   \
    \ }\n\n    public void move() {\n        System.out.println(\"Running on four\
    \ legs\");\n    }\n}\n}\n```\n\n在这个示例中，`Animal` 接口声明了 `sound` 和 `move` 方法，而 `Dog`\
    \ 类根据其特定行为实现了这些方法。\n\n抽象类：抽象类是无法无法实例化的类，它可以既包含带有实现的普通方法，也包含必须由子类实现的的抽象方法（没有方法体的方法）。在\
    \ Java 中，一个类只能扩展一个抽象类。\n\n例如：\n\n```java\n// 抽象类\nabstract class Shape {\n\n \
    \   abstract void draw();\n\n    void display() {\n        System.out.println(\"\
    Displaying shape\");\n    }\n}\n\n// 扩展 Shape 抽象类的具体类\nclass Circle extends Shape\
    \ {\n\n    void draw() {\n        System.out.println(\"Drawing a circle\");\n\
    \    }\n}\n}\n```\n\n在这个示例中，`Shape` 类是抽象的，并包含一个必须由子类 `Circle` 实现的抽象方法。它还有一个具体方法\
    \ `display`，该方法被子类继承。\n\n接口和抽象类对于实现抽象以及定义共同行为都至关重要，是 Java 面向对象编程范式的要素组成部分。\n\n"
