    \ 用于打开文件读取。\n- 写入文件：我们使用 `BufferedWriter` 向文件写入内容。`FileWriter` 用于打开文件写入。\n\n请确保将文件路径（\"\
    example.txt\" 和 \"output.txt\"）替换为要读取或写入的文件的实际路径。\n\n# 16. 对象序列化与反序列化\n\n对象序列化是将对象转换为字节流的过程，而反序列化是从字节流重构对象的过程。Java\
    \ 提供了 `java.io.Serializable` 接口来实现此目的。让我们探索如何序列化和反序列化对象：\n\n### 示例：\n\n```java\n\
    import java.io.FileOutputStream;\nimport java.io.IOException;\nimport java.io.ObjectOutputStream;\n\
