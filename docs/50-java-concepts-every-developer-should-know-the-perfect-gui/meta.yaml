    \ I/O 和文件处理\n\nJava 为输入/输出 (I/O) 操作和文件处理提供了丰富的类和方法。让我们使用 `java.io` 探索从文件读取和写入文件的基本示例：\n\
    \n### 从文件中读取：\n\n```java\nimport java.io.BufferedReader;\nimport java.io.FileReader;\n\
