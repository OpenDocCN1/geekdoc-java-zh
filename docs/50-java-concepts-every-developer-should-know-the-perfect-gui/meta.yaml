    \ object representing the current date and time. Note that many methods in java.util.Date\
    \ are deprecated, and it's recommended to use the modern java.time API.\n\njava.time\
    \ (Modern): We use the LocalDate and LocalDateTime classes to represent dates\
    \ and times. The DateTimeFormatter class is used for formatting and parsing dates.\
    \ This modern API provides better functionality and is thread-safe.\n\n# 15. I/O\
    \ and File Handling\n\nJava provides a rich set of classes and methods for input/output\
    \ (I/O) operations and file handling. Let's explore basic examples for reading\
    \ from and writing to files using java.io:\n\n### Reading from a File:\n\n```java\n\
    import java.io.BufferedReader;\nimport java.io.FileReader;\nimport java.io.IOException;\n\
    \npublic class FileReaderExample {\n\n    public static void main(String[] args)\
    \ {\n        // Specify the path of the file to read\n        String filePath\
    \ = \"example.txt\";\n\n        // Using try-with-resources to automatically close\
    \ the BufferedReader\n        try (BufferedReader reader = new BufferedReader(new\
    \ FileReader(filePath))) {\n            String line;\n            // Read each\
    \ line from the file\n            while ((line = reader.readLine()) != null) {\n\
    \                System.out.println(line);\n            }\n        } catch (IOException\
    \ e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n### Writing\
    \ to a File:\n\n```java\nimport java.io.BufferedWriter;\nimport java.io.FileWriter;\n\
    import java.io.IOException;\n\npublic class FileWriterExample {\n    public static\
    \ void main(String[] args) {\n        // Specify the path of the file to write\n\
    \        String filePath = \"output.txt\";\n\n        // Using try-with-resources\
    \ to automatically close the BufferedWriter\n        try (BufferedWriter writer\
    \ = new BufferedWriter(new FileWriter(filePath))) {\n            // Writing content\
    \ to the file\n            writer.write(\"Hello, Java I/O!\");\n            writer.newLine();\
    \ // Adding a newline character\n            writer.write(\"This is a new line.\"\
    );\n\n            System.out.println(\"Data written to the file.\");\n       \
    \ } catch (IOException e) {\n            e.printStackTrace();\n        }\n   \
    \ }\n}\n```\n\nIn these examples:\n\n- Reading from a File: We use a BufferedReader\
    \ to read lines from a file. The FileReader is used to open the file for reading.\n\
    - Writing to a File: We use a BufferedWriter to write content to a file. The FileWriter\
    \ is used to open the file for writing.\n\nMake sure to replace the file paths\
    \ (\"example.txt\" and \"output.txt\") with the actual paths of the files you\
    \ want to read from or write to.\n\n# 16. Object Serialization and Deserialization\n\
    \nObject serialization is the process of converting an object into a byte stream,\
    \ and deserialization is the process of reconstructing an object from a byte stream.\
    \ Java provides the java.io.Serializable interface for this purpose. Let's explore\
    \ how to serialize and deserialize objects:\n\n### Example:\n\n```java\nimport\
    \ java.io.FileOutputStream;\nimport java.io.IOException;\nimport java.io.ObjectOutputStream;\n\
    import java.io.Serializable;\n\n// A Serializable class\nclass Person implements\
    \ Serializable {\n\n    private static final long serialVersionUID = 1L;\n\n \
    \   private String name;\n    private int age;\n\n    public Person(String name,\
    \ int age) {\n        this.name = name;\n        this.age = age;\n    }\n\n  \
    \  @Override\n    public String toString() {\n        return \"Person {name=\"\
    \ + name + \", age=\" + age + \"}\";\n    }\n}\n```\n\n```java\npublic class SerializationExample\
    \ {\n    public static void main(String[] args) {\n        // Create a Person\
    \ object\n        Person person = new Person(\"John\", 25);\n\n        // Serialization\n\
    \        try (ObjectOutputStream oos = new ObjectOutputStream(\n             \
    \   new FileOutputStream(\"person.ser\")\n            )) {\n            oos.writeObject(person);\n\
    \            System.out.println(\"Object has been serialized.\");\n        } catch\
    \ (IOException e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\
    \n### Deserialization Example:\n\n```java\nimport java.io.FileInputStream;\nimport\
    \ java.io.IOException;\nimport java.io.ObjectInputStream;\n\npublic class DeserializationExample\
    \ {\n    public static void main(String[] args) {\n        // Deserialization\n\
    \        try (ObjectInputStream ois = new ObjectInputStream(\n            new\
    \ FileInputStream(\"person.ser\")\n        )) {\n            // Read the object\
    \ from the file and cast it to Person\n            Person person = (Person) ois.readObject();\n\
    \            System.out.println(\"Object has been deserialized.\");\n        \
    \    System.out.println(\"Deserialized Person: \" + person);\n        } catch\
    \ (IOException | ClassNotFoundException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\nIn these examples:\n\n- The Person class implements\
    \ the Serializable interface.\n- In the serialization example, a Person object\
    \ is serialized and written to a file named \"person.ser\".\n- In the deserialization\
    \ example, the object is read from the file, and the original Person object is\
    \ reconstructed.\n\nMake sure to handle exceptions appropriately in a production\
    \ environment. Also, replace the file path (\"person.ser\") with the actual path\
    \ where you want to store the serialized object.\n"
