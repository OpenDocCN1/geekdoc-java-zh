    # 20. Reference Types and Primitive Types


    In Java, data types can be broadly classified into two categories: primitive types
    and reference types. Let''s explore the differences between them:


    Primitive Types: Primitive types represent simple, single values and are the basic
    building blocks of data in Java. They are predefined by the language and have
    reserved keywords. The primitive types in Java are:


    Integer Types:


    +   - byte: 8-bit signed integer

    - short: 16-bit signed integer

    - int: 32-bit signed integer

    - long: 64-bit signed integer


    Floating-Point Types:


    +   - float: 32-bit floating-point

    - double: 64-bit floating-point


    Character Type:


    +   - char: 16-bit Unicode character'
  - '[PAGE 86]


    Boolean Type:


    boolean: Represents true or false values


    Primitive types hold the actual values, and operations on them are typically faster
    than reference types.


    Example of primitive types:


    ```

    int age = 25;

    double salary = 55000.50;

    char grade = ''A'';

    boolean isActive = true;

    ```


    Reference Types: Reference types represent objects in Java and are more complex
    than primitive types. They include classes, interfaces, arrays, and enums. Reference
    types hold references (memory addresses) to the actual objects, which are allocated
    on the heap.


    Common reference types in Java:


    Classes and Objects : Instances of classes created using the new keyword.


    ```

    String text = new String("Hello, Java!");

    ```


    Arrays: Collections of elements of the same type.


    ```

    int[] numbers = {1, 2, 3, 4, 5};

    ```


    Interfaces: Used for defining abstract types and achieving abstraction.'
  - '[PAGE 87]


    ```

    List<String> names = new ArrayList<>();

    ```


    Enums: A special type used for defining a set of constants.


    ```

    enum Day {

    SUNDAY,

    MONDAY,

    TUESDAY,

    WEDNESDAY,

    THURSDAY,

    FRIDAY,

    SATURDAY,

    }

    ```


    Reference types require more memory and involve indirection through references.
    Operations on reference types may involve method calls or accessing fields.


    Key Differences:


    Storage :


    +   - Primitive types store the actual values.

    - Reference types store references to objects in memory.


    Memory Location:


    +   - Primitive types are stored on the stack.'
