    \ Rollback the transaction in case of an exception\n  connection.rollback();\n\
    \  e.printStackTrace();\n}\n```\n\n此示例演示了一个连接到 MySQL 数据库的简单 JDBC 程序，它执行 SELECT\
    \ 和 INSERT 查询并管理事务。JDBC 为 Java 与数据库交互提供了一种强大且标准的方式。\n\n# 26. Web 开发框架 (Servlets,\
    \ JSP)\n\nServlets 和 JavaServer Pages (JSP) 是基于 Java 的 Web 开发的基础组件。它们为创建动态 Web\
    \ 提供了服务端的方法。让我们探索 Servlets 和 JSP 及其作用以及它们如何协同工作。\n\nServlets 是 Java 类，通过扩展 Web\
    \ 服务器的功能来处理请求并生成动态响应。它们处理 HTTP 请求、处理业务逻辑，并产生 HTML 或其他类型的响应。Servlets 是 Java EE（企业版）平台的一部分，现在称为\
    \ Jakarta EE。\n\n核心概念：\n\n- Servlet 生命周期周期：Servlets 经历一个初始化、处理请求和销毁的生命周期。关键方法包括\
    \ `init()`、`service()` 和 `destroy()`。\n- 处理请求：Servlets 接收并处理来自客户端（通常是 浏览器）的请求。它们从请求中提取信息（参数、标头）并生成响应。\n\
    - 生成响应：Servlets 通过与数据库交互、执行业务逻辑或利用其他资源来动态生成响应（通常是 HTML）。\n- URL 映射：使用部署描述符 (web.xml)\
    \ 或注解 (@WebServlet) 将 Servlets 映射到特定的 URL。这定义了哪个 servlet 处理特定 URL 模式的请求。\n\nServlet\
    \ 示例：\n\n```java\nimport java.io.IOException;\nimport javax.servlet.ServletException;\n\
    import javax.servlet.annotation.WebServlet;\nimport javax.servlet.http.HttpServlet;\n\
    import javax.servlet.http.HttpServletRequest;\nimport javax.servlet.http.HttpServletResponse;\n\
    \n@WebServlet(\"/hello\")\npublic class HelloServlet extends HttpServlet {\n \
    \   protected void doGet(HttpServletRequest request, HttpServletResponse response)\n\
    \        throws ServletException, IOException {\n        response.getWriter().println(\"\
    Hello, Servlet!\");\n    }\n}\n```\n\nJavaServer Pages JSP：JSP 是一种允许直接在 HTML 页面中嵌入\
    \ Java 代码以简化 Web 应用开发的技术。JSP 页面在运行时由 servlet 容器编译为 servlet。\n\n核心概念：\n\n- Java\
    \ 与 HTML 混合：JSP 允许开发者在 HTML 页面中嵌入 Java 代码，从而轻松创建动态内容。Java 代码封装在 `< %>` 标签中。\n\
    - 隐式对象：JSP 提供了一组隐式对象（例如 request、response、session），代表 HTTP 请求和响应的不同方面。\n- 标签库：JSP\
    \ 使用自定义标签库，例如 JSTL（JavaServer Pages 标准标签库），来封装常用功能并简化页面开发。\n- 表达式语言 (EL)：EL 允许在\
    \ JSP 页面中轻松地检索和操作数据。它简化了将动态数据嵌入 HTML 的过程。\n\nJSP 示例：\n\n```jsp\n<% page language=\"\
    java\" contentType=\"text/html; charset=UTF-8\" pageEncoding=\"UTF-8\"%>\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>My JSP Page</title>\n\
    </head>\n<body>\n<h2>Hello, <% request.getParameter(\"name\") %>!</h2>\n</body>\n\
    </html>\n```\n\nServlets 与 JSP 协同工作：Servlets 和 JSP 通常在 Web 应用中协同工作。Servlets 处理业务逻辑、处理请求并将控制调度到\
    \ JSP 页面以生成 HTML 内容。这种关注点分离遵循模型-视图-控制器 (MVC)架构。\n\n# Servlet 调度到 JSP：\n\n```java\n\
    @WebServlet(\"/greet\")\npublic class GreetingsServlet extends HttpServlet {\n\
    \n    protected void doGet(HttpServletRequest request, HttpServletResponse response)\n\
    \        throws ServletException, IOException {\n        // 执行业务逻辑\n        String\
    \ username = request.getParameter(\"name\");\n\n        // 在请求属性中设置数据\n      \
    \  request.setAttribute(\"username\", username);\n\n        // 将控制分发到 JSP 进行渲染\n\
    \        RequestDispatcher dispatcher = request.getRequestDispatcher(\"/greet.jsp\"\
    );\n        dispatcher.forward(request, response);\n    }\n}\n```\n\n在上面的示例中，servlet\
    \ 处理请求，在请求属性中设置数据，然后将控制权转发到 JSP 页面进行渲染。\n\nServlets 和 JSP 成了 Java Web 开发骨骨，为构建动态\
    \ Web 应用提供了稳健且可扩展的方法。现代 Java Web 开发已转向使用 Spring MVC 等框架，但理解 Servlets 和 JSP 的基础仍然至关重要。\n\
    \n# 27. RESTful API 处理 (JAX-RS)\n\nJava API for RESTful Web Services (JAX-RS)\
    \ 是一组简化 Java 中开发 RESTful Web 服务的 API。它是 Java EE（企业版）平台的一部分，现在称为 Jakarta EE。JAX-RS\
    \ 提供了注解，用于将 Java 方法映射到 HTTP 方法、处理请求和响应格式等。\n\nJAX-RS 核心概念：\n\n- 资源类：JAX-RS 中的资源类是带有\
    \ @Path 注解的 Java 类，用于定义托管资源的 URI 路径。\n\n```java\nimport javax.ws.rs.GET;\nimport\
    \ javax.ws.rs.Path;\n\n@Path(\"/hello\")\npublic class HelloResource {\n    @GET\n\
    \    public String sayHello() {\n        return \"Hello, JAX-RS!\";\n    }\n}\n\
    ```\n\n- HTTP 方法：JAX-RS 使用类似 @GET、@POST、@PUT 和 @DELETE 的注解将 Java 方法映射到对应的 HTTP\
    \ 方法。\n\n"
