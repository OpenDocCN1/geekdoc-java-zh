- img_proc: true
  md: "catch Blocks: The catch block(s) handle exceptions that might occur within\
    \ the corresponding try block.\n\nIn this example, we have two catch blocks:\n\
    \n```\ncatch (ArithmeticException e) {\n    // Catching a specific type of exception\
    \ (ArithmeticException)\n    System.out.println(\"Error: Division by zero is not\
    \ allowed.\");\n} catch (Exception e) {\n    // Catching a more general exception\
    \ (Exception)\n    System.out.println(\"An error occurred: \" + e.getMessage());\n\
    }\n```\n\nThe first catch block catches a specific type of exception (ArithmeticException)\
    \ that occurs if the user enters 0 for division.\n\nThe second catch block catches\
    \ a more general exception (Exception) and provides a message with the exception's\
    \ information.\n\nfinally Block: The finally block contains code that will always\
    \ be executed, whether an exception occurs or not. It's typically used for cleanup\
    \ tasks:\n\n```\nfinally {\n    // Code in the finally block will always run.\n\
    \    System.out.println(\"Finally block: This will always run.\");\n}\n\nClose\
    \ resources (e.g., Scanner) in the finally block\n```"
