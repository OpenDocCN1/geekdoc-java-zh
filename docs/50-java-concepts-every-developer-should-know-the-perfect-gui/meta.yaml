    \  data.setClassIndex(data.numAttributes() - 1);\n\n        // 构建并评估决策树\n    \
    \    J48 tree = new J48();\n        tree.buildClassifier(data);\n        System.out.println(tree);\n\
    \    }\n}\n```\n\nDeeplearning4j：Deeplearning4j (DL4J) 是一个用于 Java 和 Scala 的深度学习库。它设计用于与\
    \ Apache Hadoop 和 Apache Spark 等分布式计算框架配合。\n\n主要特性：\n\n- 深度神经网络：DL4J 支持深度神经网络的，包括卷积神经网络\
    \ (CNN)、循环神经网络 (RNN) 等。\n\n- 并行处理：该库针对并行处理进行了优化，可以利用多核 CPU 和 GPU。\n\n- 与其他库的集成：DL4J\
    \ 可以与 TensorFlow 和 Keras 等其他流行的深度学习库集成。\n\n示例代码：\n\n```java\nimport org.deeplearning4j.datasets.iterator.impl.MnistDataSetIterator;\n\
