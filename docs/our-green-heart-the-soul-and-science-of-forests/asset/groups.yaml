    We all feel this connection from birth. Our communion with trees is written plain
    as day on the face of any child let loose in the forest. But articulating the
    fullness of this relationship, the many ways our souls, spirits and lives depend
    on trees, is no mean feat. It requires scientific and spiritual knowledge, studied
    and lived experience, and a willingness to listen—particularly to the trees. It
    is a life’s work. It has been mine.


    That work, and by extension this book, began with the deaths of my parents when
    I was a young child. With no one from my father’s aristocratic English family
    wishing to claim me, could have ended my life in an Irish Magdalene laundry. Instead,
    it gave me a great gift. Splitting my time between Cork, where I excelled in school
    and read everything I could in the book-lined house of my mother’s brother, my
    uncle Patrick, and the valley of Lisheens, where my great-aunt Nellie and the
    rest of an old generation of subsistence farmers taught me the ancient Druidic
    knowledge of the Celtic culture, I received an education that was wholly unique.
    I learned the Brehon laws of the Celts, the distillation of three thousand years
    of wisdom,'
  - '[PAGE 10]


    and I taught the uses of medicinal herbs that have since found their way into
    today’s cutting-edge medicines. At school, I turned out to have a photographic
    memory for equations and chemical formulae. I studied botany, physics and medical
    biochemistry. I earned a master’s and a PhD. I led research projects, but ultimately
    fled academia to find my own experimental farm.


    In short, I have learned to speak the chemical and spiritual languages of nature.
    I am still learning.


    When I left Ireland for North America and postgraduate work, the elders of Lisheens
    told me a kind of going-away party. A local woman known for her ability to see
    the future was invited. She was asked to look into mine. She told me I would go
    to the “New World” and share the gift of my Druidic education, that I would teach
    people about the value of nature and their connection to it, and help humanity
    cast off its greedy, destructive ways. I have tried all my life to live up to
    prophecy, and in spirit I have shared my knowledge and brought my abilities to
    bear wherever I thought I could do good. I have contributed to the protection
    and preservation of forests on six continents. I have written many articles and
    books, have given countless interviews, and I am the centrepoint of a documentary
    on forests, among many other projects. And, crucially, I have never stopped my
    scientific work, my-on-ground observation and experimentation. This book is a
    continuation of life’s project, another effort to share what I’ve learned and
    encourage others to pick up the threads, to take on the work.


    As I write this, I am approaching my eighty birthday. I am not a person who thinks
    much about age, but I suppose there is some cause for reflection and appraisal
    at this milestone. As I look around—my life, my farm, our world—I see so many
    fundamental questions about trees, forests and our living planet still waiting
    to be answered. How do trees defy physics and run water uphill? How does petiole
    move a leaf to track the sun? How does a tree make judgments about the future?
    Could oak leaves hold the secret to free, renewable energy?'
- md: '

    I also see so many fascinating examples of the forests’ vital role on the living
    planet: trees’ powers to battle cancers and depression in humans; the controlled
    dosages of medicine they deliver to forest bathers; the ways forests see the oceans
    with metals necessary for the foundations of marine food chains; the ways they
    speak in chemistry and infrasound. And finally, I see, in climate change, the
    greatest challenge humanity has ever faced.


    This book is a reminder of all trees do for us. It is a reminder of their central
    role in the healthy functioning of this planet and everything—everything—that
    lives upon it. It is a reminder of the destruction we have wrought on the forests
    through our greed and thoughtlessness, and the consequences of that destruction.
    And it is a reminder that the only way out of this mess we have made is to protect
    the forests and plant new ones.


    Our Green Heart is not about the past. It is about the work still to be done.
    It is about the solutions still to be found in trees and plants. It is about a
    concrete plan to end the climate crisis.


    This book is about hope. This book is about tomorrow.


    Its pages hold a different vision, one of co-operation and compassion, one that
    offers a fresh green horizon for us all.


    ![](img/9a73bd94214c184b1606db8dbb911966_12_0.png)


    # The Red and Green Kingdoms


    To understand who you are, you must know your history. This is your story, your
    entry into the Eden of the living world, but it is also the story of life as we
    understand it. Like that life, it is both unique and shared.


    Out of the thunderous silence of space, a rocky planet emerged dressed for life.
    At first, waves of infantile infrasound, generated by molecular movements, with
    a seed of symmetry, then danced together their peaks and troughs. In time, these
    seeds of knowledge stretched into strings, and with the blessing of a rose, those
    strings then shaped themselves into a spiral form, the one we know as DNA. Its
    end-on view held the design of a rose under the mirror of X-ray diffraction analysis.
    Creation and conservation of matter demanded a mirror image made as a sister to
    the first spiral. One became two in the glory of “all is one, all is unity,” everything
    arising from zero.


    The binomial counting for life—the 1+1 that gives rise to all of life’s incredible
    beauty—had begun, a mathematics sacred and unseen by most. Filled with the language
    of knowledge, the spiral reached the sun and divided into two entities. The first
    was the plant kingdom. It waited and waited, awash with green. Later came the
    animal kingdom, dominated by red. The two were each greedy for fuel. In the name
    of survival, they decided to share, dependent on one another as equal partners.


    The fuel they divided—essential for the survival of life—is oxygen. Oxygen is
    the most abundant element of our planet, making up as much as 46.6 percent of
    Earth’s crust. So, in terms of plentifulness, the choice was a safe one. In addition,
    there is a chemical simplicity and plasticity to oxygen because it is a diatomic
    gas, made up of molecules that themselves consist of only two atoms. This is perfect
    for nature’s uses, as the two atoms are equal in ability and can also function
    independently, if necessary. As a result, oxygen is used and reused in the atmosphere
    and the soil, through the bodies of all plants and animals, in the oceans, lakes
    and waterways, and, more slowly, in the chemical action of the soil over time.


    On a normal day, oxygen drives the engine of life. The gas enters the lungs of
    every animal on Earth and exits as carbon dioxide. This exhaled waste gas is then
    up for grabs in the atmosphere, and the plants come up to the plate. Size, or
    biomass, matters in the plant kingdom: one blade of grass needs much less carbon
    dioxide to fuel the business of living than a mature tree. A tree, any tree, is
    fully equipped to efficiently handle oxygen and carbon dioxide; a forest even
    more so. Oxygen and carbon dioxide are mobile, constantly on the move, into and
    out of the forest community. But it is becoming increasingly clear that humans
    don''t yet understand all the ways forests are essential to a living planet. Our
    understanding of the bigger picture is still in progress and will continue to
    be so for some time yet.


    A common law of chemistry underlies both the plant and animal kingdoms'' use of
    oxygen as a fuel. It is called the oxidation-reduction reaction, where oxygen
    is swapped from one state to another. Fire needs oxygen to burn. The same thing
    happens in the human body. Oxygen is needed to break down foods like carbohydrates,
    proteins and fats to release their carbon dioxide, which is then exhaled. Like
    a lit burner or a house fire, this is combustion, and oxygen is necessary for
    the process of combustion to take place.


    Both kingdoms of life, the green and the red, arrived at the same winning post
    of success despite taking different routes. The plant''s spiral string of DNA
    produces a flat macromolecule called chlorophyll, the green molecule. Meanwhile,
    the mammal''s deoxyribonucleic acid produces a different flat macromolecule, a
    red one, called hemoglobin. The only difference between them is two molecules
    Base elements: chlorophyll is designed to produce oxygen from atmospheric carbon
    dioxide and hemoglobin''s job is to grab that. They are almost identical molecules,
    one in plants and the other in animals, all with the vital task: to keep oxygen
    cycling and recycling throughout the planet, and to maintain this movement into
    and out of the web of life on a timed schedule—from seconds to minutes, from centuries
    to millennia, always under the dictates of the circadian rhythms of nature.


    Chlorophyll and hemoglobin have something else in common: they both contain a
    metal atom. In the plants'' case, it is magnesium; in the animals'' case, it is
    iron. These two metals are at the center of the molecules, where the oxygen is
    captured or released. This is the heart of the cycle, the chemical exchange that
    sustains life on Earth. The plants take in the carbon dioxide and release oxygen,
    while the animals take in the oxygen and release carbon dioxide. It is a perfect,
    continuous dance of atoms fueled by the energy of the sun. The photons hitting
    the chlorophyll provide the energy to split the water molecules, releasing the
    oxygen that we breathe. The hemoglobin in our blood carries that same oxygen to
    every cell in our bodies. This is the fundamental link between the green and the
    red kingdoms.


    ![](img/9a73bd94214c184b1606db8dbb911966_16_0.png)


    # When the Land Breaks Its Silence


    From the land all children are born, on the land we live, and into the land each
    of us must return when we die. The land is holy and should be venerated. It holds
    the voice of creation. Sometimes it speaks, breaking the silence of its wonder.
    When it does, those who are close to it, who breathe its perfumes, listen. They
    know the land is the very best of teachers.


    Each summer when I was a girl, I was sent to live with my great-aunt Nellie and
    her son, Pat, on their farm in the valley of Lisheen in southern Ireland. They
    were subsistence farmers, living off the land just as people had in the valley
    for hundreds of years. With them, I first witnessed a deep reverence for the land
    with my own eyes.


    Pat, my cousin, was a grown man, hardened by the labour of caring for the animals,
    of sowing, reaping and harvesting without the aid of internal combustion. He would
    walk to the top of the Droim—a word that denotes not only a human''s or an animal''s
    back but a field with the shape of a back, from which binding spells were in ancient
    times. Pat would stand there alone. He would stare at the hills, holding his arms
    out to embrace the fullness of the landscape, drinking into his soul. After a
    time, he would turn one step to the Caha Mountains, which stretched across the
    horizon to the north of the farm. The range spoke to him like a mother, a voice
    of enveloping care.


    Filled with confidence in the land''s protection, Pat would then begin a recitation.
    Like telling the beads of a massive rosary, he directed his attention to each
    peak in turn and spoke its name: Snoc buí, then Dchas, then Doughhill, and finally
    Séithe, with its cape of mist lifting into the sky. His naming of this rosary
    came from his ferocious love of the land. It was an acknowledgement of the purity,
    perfection and beauty in front of him.

