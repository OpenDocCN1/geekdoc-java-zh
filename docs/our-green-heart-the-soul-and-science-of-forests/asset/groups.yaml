    botanical world, the longer, more refined bores are always found in virgin forests;
    such trees are the first to be cut down because their wood is free of knots and
    of high quality. On top of the bole, the canopy of leaves, flowers and fruit rests
    in the sun. Anchored in the ground by the roots, the bole can move under the pressure
    of the wind, and so can the canopy. Dispersal mechanisms vary across species,
    from free release glands to specialized organs for sterile storage of the phytomedicines,
    but the movement caused by the wind generally creates enough torque on the body
    of the tree to release the aerosols.


    Medicinal aerosols are manufactured in one part of the tree and then stored in
    the glands. Within a family of tree species, the glandular organs are all similar.
    For instance, a tree of eastern North America called the white cedar, *Thuja occidentalis*,
    carries its glands at the tips of its fruits. They can be seen with the naked
    eye. The tiny gland is circular and filled with midsummer with a yellow liquid.
    These are applicator fronds, developed to disperse the aerosol by touch and sometimes
    times. The glands are also finely tuned to temperature. On a hot, sunny day, the
    thujic acid they release into the air will regulate blood pressure, improving
    the circulation of all mammals.


    Then there are the aerosols produced in the orange family, Rutaceae, that function
    on the same principle as a land mine. Under pressure, the fruit and flowers release
    the aromatic aerosols as small explosions. Again, these glands can easily be seen
    on the rough surface skin of an orange, looking like tiny balsams embedded in
    the epidermis. The pressure of peeling sparks explosions that coat the fingers
    with the essence of the fruit in colour and smell.


    There is a great, and somewhat unexpected, advantage to taking medicines in these
    ways and the others that forest bathing bestows. It is dosage. The trees produce
    a bounty of medicines, but the body only picks what it needs. A small body will
    pick up a small amount of medicine from the forest atmosphere; a big person will
    receive a large amount. The collaboration results in a dosage precisely tailored
    to the last epithelial cell of the human body. It is the medicine you need and
    nothing more.


    As our understanding of trees and their ecosystems grows, the specific benefits
    of forest bathing being uncovered are truly staggering. Because of forest bathing,
    there is increasing public interest in pines, perhaps because they are among the
    trees most easily identified. The Pinaceae family consists of around ninety-five
    species in the northern hemisphere, with many more varieties and hybrids. Pines
    are found everywhere from sea level to the timberline, and they all produce a
    vast quota of aerosols, principally alpha and beta pinenes. Pinene aerosols are
    protector molecules for the human body, saviour for many people with a propensity
    for cancer and aids to anyone exposed to environmental pollutants.


    The key to pinene aerosols is that they are fat-soluble, and prefer sebaceous
    oil, a fatty lubricant secreted by sebaceous glands and present on human skin
    and hair. Pinene, once it has landed on the body, dissolves in this oil, is absorbed
    and races for the brain and all the wiring connected to it. Finally, it ends up
    in the bloodstream.


    Dr. Qing Li, a professor at Nippon Medical School and a global expert on forest
    medicines, has conducted a series of clinical studies on the impact of pinene.
    Dr. Li found that when people are exposed to fresh aerosols released from pine
    trees, the influx of pinene begins a complex series of changes in blood proteins,
    especially around the neutrophils. These changes increase the production of T-cells,
    the agents of the immune system that attack foreign particles. A single fifteen-minute
    visit to a mature tree or forest is enough to cause this change. The T-cells remain
    on high alert for transgressors for around thirty days. The process can be repeated
    from mid-spring to full summer and into the fall, until the trees go into their
    period of winter dormancy.


    Human males have a friend in the forest in any member of the Taxodiaceae family,
    the redwoods. These evergreen species release a highly volatile aerosol called
    taxodione, which carries strong anti-tumor action for men, especially for the
    urogenital area. A morning coffee taken under the loving branches of a redwood
    will bear dividends for a healthy future. There is one caveat, though: the gentleman
    should shed as much of his clothing as legally permissible so his skin may receive
    this abundance directly. Following this arboreal bath, he should avoid showering
    for a day or two.


    Another form of forest bathing is very important for anyone suffering from loneliness,
    anxiety or depression, particularly adolescents, whose metabolic rate is higher
    than adults''. The willow family, Salicaceae, with three hundred species spread
    across the northern hemisphere, offers a holistic treatment for depression. For
    North America, *Salix nigra*, the black willow, is best, and for Asia, *S. babylonica*,
    the weeping willow, is the prime time. Look for such trees near running water,
    a stream or river.


    A mature willow in full canopy produces a cascade of chemistry, by the presence
    of moist soil or running water. The full library of salicylates it releases, around
    thirty biochemicals, become more active aerobic medicines when hydrated. These
    chemicals include analgesics, antiinflammatories, anti-rheumatics, antibiotics
    and anti-fungal agents, bound together by a chelating agent called salicylohydroxy
    acid. A fixative called salicylaldehyde sticks the aerosols to the skin. This
    forest bathing exercise should last half an hour on a warm, sunny day, with the
    bather seated and lazing near the trees, which reduce blood plasma levels of transcortin.
    Again, bare as much as possible and allow the salicin aerosols to dry on the skin
