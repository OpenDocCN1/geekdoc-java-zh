    具有极大的意义。仅切罗基人的药典就使用了这种树的药用来缓解疼痛、治疗病毒，并利用其树皮浸液增强长骨韧性的非凡能力，以防止在各种运动中受伤。通过对这些草原上的坚果树进行野外园艺管理，他们能够收获坚果，为饮食提供最高质量的一等蛋白质，将鹿肉的蛋白质含量增加了一倍。


    今天，王果（kingnut）可以重新引入北美作为农业辅助。如果将其种在树篱中，树木可以保护农田免受阳光过量紫外线的照射。树的根部会将深层土壤的矿物质财富循环回土壤表层。王果能让周围的土壤生态系统对昆虫而言更加稳定。授粉者可以获得充足的食物和用于保护的树脂。一些昆虫和少数鸟类将树脂作为抗生素和抗真菌的“墙纸”，在发育过程中保护后，这是一种防止疾病的打扫方式。鸟类在树木旁繁衍，它们在树冠中理羽毛时摄入维生素
    D 用于产卵。王果的大叶子可以清除空气中的颗粒污染，包括同位性放射性减少，而它们的阴影保护了两栖动物免受遗传损伤。


    这些从北美景观中被随意移除的树，能够使任何农业经营的植物蛋白翻倍。制作坚果奶、坚果奶油、奶酪和坚果豆腐可以成为农业社区的一个新产业。此外，印度南部阿南塔普尔地区最近的研究表明，像王果这样将木本多年植物与农作物一起生长的旧模式，可以增加34%的大气二氧化碳吸收。


    造福自然的造福农场。造福农场的造福人类。王果是一份礼物。我们只需要接受它。


    ![](img/9a73bd94214c184b1606db8dbb911966_52_0.png)


    # 喂养海洋，滋润土地


    我曾负责过水，那是我在利申（Lisheens）山谷小时候的时候。Nellie 和 Pat 的农场没有室内管道。由于饮水、烹饪、洗涤和各种日常任务都需要水，每天早餐后，我都会手各提一桶水去水井。


    我去水的路程是快乐的。我走在潮湿的小径（bótharín）上，穿过紫藤花隧道，红花在我的头上方悬挂。我身处一个充满神奇植物的仙境。


    回到农场的路程就完全不同了。水很重。桶手勒着我的手掌，隆起粉红色的疼痛垫。我不得不停下很多次用裙子揉手并变换握姿。将双臂举过头顶只能获得片刻的缓解。每当我再次举起水桶时，它们感觉越来越重。


    正是这些每日的旅行让我学会了水的价值。从那以后，我视水为理所当然。这使得我在家里做的每项任务中都变成了一个吝水者，而这恰恰是应该。


    我也发现水在科学上非常迷人。它是一个如此简单的分子，而这种极度的简单使其作为自然界的桥梁化学物质变得如此重要。水由两个氢原子和一个氧原子组成。这使其成为已知最通用的溶剂，对于地球上所有的动植物生命都至关重要。在某些岩石中甚至以水合形式存在。水具有以三种状态——液态、固体和气态存在的神奇能力，似乎两个氢原子相对于较大的氧原子所形成的角度赋予了水分子堆叠的能力。


    清洁、可饮的水对于这个星球上的生命至关重要，而森林为全球社区管理着这一珍贵资源；树木是地球地球水循环的关键。这一事实如此明显，却往往被忽视。水是如此普通，以许多国家将其视为商品。直到它变得稀缺。只有当水源枯竭时，人们才会真正怀念它。地球上的每一棵树、每一个森林社区都是水分的重要调节器，将水从大气循环到陆地，并不断重置海洋的盐平衡。


    爱尔兰当然是一个岛屿，海岸线很长。当我不在提水时——事实上，当我完成家务或完全摆脱家务时——我喜欢画画这些粗糙、崎岖的海岸。在大学期间，当我坐在南海岸靠近巴利利基（Ballylickey）的地方画画时，我注意到每一个溪流与潮汐汇合处海洋植物的变化。在淡水和咸水的混合中，充满了生物多样性的交响乐。海藻充满了色彩和紫色——从深褐色到红色，再到石苔（*Porphyra
    gardneri*）那种近乎透明的浅黄色，它们由单层细胞薄片组成，悬挂在黑岩上的每个开放空间。我的眼前有一片海洋花园，盐分悬挂在周围空气中，宛如光环。


    海水本身就是一种神奇的药物。它是 DNA 向陆地漫长旅程的起点，对于每种形式的海洋生命（动植物）来说都是安全且健康的。作为一种简单的溶液，海水是一种缓冲液。它的化学可塑性保护生物免受伤害。它是一种局部抗炎药。自古以来，盐水就被用于灌海。前往海洋一直被视为一种“治疗”——一种重建健康不良和焦虑者体的方法。凯尔特传说特别推荐在潮汐沙滩上赤脚行走，随后用墨墨藻（*Fucus
    vesiculosus*）敷肢。墨藻中的可用碘含量对甲状腺有益，使该腺体功能处于最佳状态。医学上仍在使用海水，作为一种等渗溶液来缓解脱水。

