    water handles cut into my palms, raising pink pads of pain. I had to stop many
    times to rub my hands against my frock and change my grip. Stretching my arms
    above me only gave me a moment of relief. Every time I lifted the buckets again,
    they felt heavier and heavier.


    Those daily trips were how I came to value water. I’ve taken it for granted since.
    This has made me a miser with water in every task I undertake around my home,
    and that is exactly as it should be.


    I find water scientifically fascinating as well. It is such a simple molecule,
    and its very simplicity makes it so important as a bridging chemical in nature.
    Water consists of two atoms of hydrogen and one of oxygen. This makes it the most
    universal solvent known, essential to life for all the flora and fauna of the
    planet. It’s even found in hydrated form in some rocks. Water has the amazing
    ability to exist in three states of being—liquid, solid and gas—and it appears
    that the angle set by the two atoms of hydrogen against the larger oxygen atom
    gives the water molecule stacking abilities.


    Clean, potable water is vital to life on this planet, and forests manage this
    precious resource for the entire global community; trees are the'
  - '[PAGE 54]


    keys to the hydrological cycle of the living Earth. This fact is so obvious that
    it is very often ignored. Water is so common that many nations treat it like a
    commodity. That is, until it becomes scarce. It is only truly missed when the
    waters run dry. Each tree and every forest community across the planet is a powerful
    modulator of moisture, recycling water from the atmosphere into the land and constantly
    resetting the saline balance of the seas.


    Ireland is an island, of course, and the shoreline is extensive. When I wasn''t
    hauling water—in fact, when I was finished or freed from my chores entirely—loved
    to paint these rough, rugged shorelines. It was in university, sitting with my
    brush near a place called Ballylickey on the south coast, that I noticed the change
    in marine plants in every single place where a stream met the tide. In the mixing
    of fresh and salt water, there was a cacophony of biodiversity. The seaweeds exploded
    with colour and purple—to deep brown to red into the pale, almost translucent
    yellow of the sea lettuce, *Porphyra gardneri*, composed of sheets one cell thick,
    that hung from every open space on the black rocks. There was a marine garden
    in front of my eyes, and the salts hung in the air around them like a halo.


    Salt water itself is a miraculous medicine. It is the cauldron from which DNA
    began its long journey to land, and it remains safe and health-giving for every
    form of ocean life, both plant and animal. As a simple solution, salt water is
    a buffer. Its chemical plasticity shields creatures from damage. It is a topical
    anti-inflammatory. Since ancient times, brine has been used to irrigate oceans.
    Travelling to the ocean has long been considered a “cure”—a means to rebuild the
    constitution of those suffering from ill health and anxiety. Simply walking barefoot
    on the sand in the incoming tide was especially recommended by Celtic folklore,
    followed by a limb with bladderwrack, *Fucus vesiculosus*. Bladderwrack''s available
    iodine content is beneficial to the thyroid, making this gland function to its
    optimum. Salt water is still used in medicine, as an isotonic solution to raise
    blood volume and combat dehydration, among other things.'
  - '[PAGE 55]


    Towards the end of my final year of undergraduate studies, I noticed the university’s
    specimen collection was badly in need of care and attention. The specimens were
    weary from overhandling and needed to be replaced. They also needed to be reclassified,
    dated and geo-positioned to their habitats on the coastline. The task was too
    big for me to take on alone, so I obtained permission for the school’s religious
    members to join me for a weekend of botanical collecting. These were nuns and
    priests whose activities were somewhat restricted by their various orders.


    The weekend was memorable. The Atlantic Ocean waters raced up the beach until
    they met a line of pebbles, broke into foam embellished with chips of the red
    fronds Rhodophyta and the flotams and jetsam that makes for swooping seabirds.
    Spent, the foam swept into the sand before the waters collected themselves for
    another dash at the bigger, blackened rocks. At the outcrop on the Cork coastline
    which we stood, three or four kilometres from Kerry, a series of freshwater streams
    dashed into the Atlantic, suspending its noise for the brief moment of meeting.
    The roar of life was tremendous around us and seemed to play a melody with the
    rocks. The water was mobile with fish. We were all mesmerized, standing in this
    place of life where the streams joined with the sea in a handshake of knowledge.


    When the nuns’ black veils lifted in the wind, they chased in circles trying to
    keep their headgear on, screaming with delight. The flapping of the fabric attracted
    the birds, who seemed to mimic these black-clad figures with soaring gestures.
    The nuns ran wild, for a time from the convent bell. Other students caught this
    joy, and even the priests smiles. The specimen jars were soon filled and their
    solid black caps sealed. We’d managed to collect all the marine specimens I was
    looking for in that one bountiful place.


    The next time I stood by the roar of multiple freshwater streams meeting the ocean
    was Ise Bay, Honshu, Japan. A half century had passed, and instead of the nuns
    and priests, a tall man stood on a pebble'
