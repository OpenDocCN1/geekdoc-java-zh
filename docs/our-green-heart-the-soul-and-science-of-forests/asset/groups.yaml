    Soon, a hefty block of wood was produced by a teacher and I was invited to sit
    down. The fire was smoking, but I enjoyed the smell; it made a change from the
    sanitized corridors of academia. The apron auditorium around the fire was the
    children''s habitat, not the adults''. It was perfectly plain to me that I was
    the children''s guest and they were in charge. They looked after me, too. Each
    child had a task. They provided and cooked their own lunch in this forest school.
    After a fireside conference, bannock appeared from the griddle, shortly followed
    by a plate. They kept their eyes on the bannock as I balanced it on the proffered
    plate on my knees. I lifted the bannock to my mouth and took my first bite. The
    children turned into statues, awaiting my reaction. I swallowed and then I smiled.


    One boy stepped onto a higher branch of the apron. He balanced there carefully,
    his hands behind his back. His face was serious. The words burst out of his mouth.
    “We made the bannock for you!” he said. “What I mean to say is that we are happy
    you come to see our school. We made them for you and there are lots more. Lots!”
    His classmates moved towards him. They all stood together, fortified by one another
    and by their skill in entertaining their guest.


    I brought something home with that day. Little forest school taught leadership,
    honesty and co-operation, along with a deep respect for nature. The combination
    is unique and vital. If the hedge schools, the scoil ghearr, of Ireland could
    produce presidents and prime ministers, these forest schools can open a path to
    a better future for us all. Education can be monetized or it can be treasured;
    understanding can be hoarded and patented or it can be shared and felt. A child’s
    smile can hold more depth of knowledge than any university, anywhere.


