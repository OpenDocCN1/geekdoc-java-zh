    # Dúchas


    I heard a lot about nature as a young girl in the valley of Lisheens. After the
    deaths of my parents, when my time was split between my uncle Patrick’s home in
    Cork and my great-aunt Nellie’s farm, and the elder members of the Lisheens community
    began to take a particular interest in my education, teaching me the ancient knowledge
    and the Brehon laws that governed human interactions with one another and with
    nature, learning became one of my chief summer endeavours. The Brehon laws took
    a dim view of anybody foolish enough to defy the law of nature, and I heard plenty
    about nature in that context. But I also heard the word itself constantly—or at
    least its Irish equivalent, Dúchas.


    There was a simple reason for that: one of the mountains in the Caha range, which
    defined the horizon north of the valley, had been christened Dúchas back in the
    time when Ireland was the land of saints and scholars and still called Éire. I
    looked at the mountain called Dúchas every day that I lived in Lisheens. It changed
    with the seasons and the sun. Its nobility seemed to hang over the valley, asking
    for admiration. Very often, as I stood on a fence rail or stopped in my tracks
    on the cow path to enjoy the view, I was joined by others who shared the quiet
    wonder I felt at the beauty that was ours to behold.


    Under Brehon laws, Dúchas held additional meanings beyond the physical manifestations
    of mountains, fields, flowers, grass, animals and trees. The word also meant a
    person’s natural inheritance. This concept was painted with a broad stroke, meaning
    that every person carried a hereditary claim to nature, a birthright. This communal
    ownership forged a traditional connection between each person and the lands, and
    even the sky. The connection was intended to protect nature itself. At Great-Aunt
    Nellie’s kitchen table, I heard over and over a proverb of warning I still use
    today:'
  - '[PAGE 90]


    “Briseann dúchas tri shúile chait.” It literally means “Nature seen in the eyes
    of the cat,” but the warning it conveys is deep wilderness, if it’s abused, can
    come back and bite you. You need to work with nature or risk nature taking its
    revenge on you.


    Somewhere in its long history, nature produced a brainchild. The child was green
    in colour and took over 400 million years to perfect. The child collected sunshine
    and made a forest. Gradually, these primary forests spread across the world. They
    carried the green grandeur of possibility in every breath inhaled and in every
    inch of earth occupied. They were called “virgin forests” because the taut skin
    of their enormous trunks never felt the wound of an axe. Though they laid a claim
    on the particular niche they occupied, there are now few primary virgin forests
    remaining on planet Earth. If they are not replaced soon, the human family as
    a whole can expect only on its horizon.


    The genius of forests is based on carbon. In one form or another, carbon flows
    through every forest system on our planet, north to south and east to west, movement
    operating on a timeline that works in seconds, if there is a fire, and in millennia,
    climatic times are stable. A tree is born with carbon, lives by carbon and, and
    when it dies, goes back to ashes and dust, deferring to carbon.


    The trees of a forest are not simple creatures. They have their likes and dislikes.
    Some love a sweet limestone soil. Others hanker for acidic earth and run growth
    to its limits in soils with the pH as bushel of bitter lemons. Usually, the acid
    lovers come from very ancient lines, like the madrones. They grimly hang on what
    they know and what will nudge them away from their familial hunting ground of
    jarringly low pH. These outliers are also medicinal trees. Most are to be found
    near the sea or ocean. They gravitated into these dangerous zones because their
    forest companions have been vanquished by human hand. There are the high flyers,
    the bristlecone pines whose seeds release rarefied mountain air, and the driftwood
    trees, who splash in saline conditions, like the bald cypress. These trees should
    be man’s best friend, because they hold a solution to prostate cancers. They produce
    a unique atmospheric aerosol called'
  - '[PAGE 91]


    taxodione, which has a strong anti-tumour effect. The health of a man forest

    bathing in the presence of any of the the Taxodiaceae family benefits greatly.


    A native forest is a special place, anywhere on the planet. It is special because
    it is the centre of a unique form of plant democracy. Each species within a forest
    is a member of a family of trees with different traits. These are evident above
    ground in the architecture of the tree and its canopy, and in features as particular
    as the leaf scar, its fingerprint. These families all live together. Combined,
    their virtues make a whole that is beneficial to the human family and to all living
    systems. They co-operate in many known and unknown ways.


    Underground, a forest is even more of an enigma. Beneath the soil, all business
    is conducted in darkness, and this causes problems for science. Still, we know
    there are many players as the trees of a forest interface with almost all of creation
    using the pattern language of DNA and RNA. Though the apical meristems at the
    tip of each root, with their protective sheaths, are not fully understood, are
    the exquisite boundaries of chemical exchange. The roots act like an invading
    army in the soil, working for the benefit of the tree, and sometimes for the entire
    forest. The army produces allelocmicals that sweep deeply into the soil in plumes
    of active biochemistry. Their effect is seen around the tree and can even deliver
    a killing action that extends in a thirty-metre radius from the trunk. Nut trees
    are especially effective in this regard, needing to protect their capacity to
    produce a crop. Many aspects of the tree’s health depend on what is happening
    underground, where there is a constant ebb and flow of antivirals, antibiotics,
    antifungals, anti-inflammatories and anti-cancer biochemicals. This action originates
    in the brain of the tree, a command centre science has to locate.


    Native forests, then, are webs of unfathomable complexity, each one unique to
    its geography and among environments on the earth. They are far from fully understood
    and cannot possibly be re-created, and yet humans have hacked and razed them with
    abandon. I remember one day in Lisheens, helping my cousin Pat cut peat for fuel,
    when our tools struck something solid in the bog. After excavating it, we found
    ourselves staring'
