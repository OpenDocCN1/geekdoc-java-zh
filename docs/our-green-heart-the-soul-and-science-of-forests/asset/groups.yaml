    The Risks of Taking Nature’s Place


    The management of planet Earth has been an ongoing process for more than 4.5 billion
    years. For nearly all of that span, nature has been the conductor. In the warm
    oceans where life was born, the simplest algae, managing photosynthesis with their
    primitive thylakoid instruction, needed time to grow and change. There were no
    trees then. The forests only existed as a dream somewhere far down the road of
    evolution. But across the ages, the thylakoid membrane evolved into the welcomed
    spiral of the DNA helix, and then into the doubled form, a molecular mirror image
    that completed the coil. The exquisite genius of that design, untold tale and
    animal species have sprung, and nature alone has guided their success and failure,
    growth and death—at least until our present age.


