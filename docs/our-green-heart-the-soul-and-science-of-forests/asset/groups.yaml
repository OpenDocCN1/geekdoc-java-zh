    from a person, it could go back into the body of that same person without rejection.


    That was plenty to wrap my head around at the time, but later in my career I had
    another idea: What if the machinery within a cell was taken out and I was able
    to keep it working? I chose to experiment with a cell called erythrocyte—a red
    blood cell—from spent blood stored by the Canadian Red Cross. Despite doughnut
    shape, an erythrocyte swims about in the bloodstream, blessing organs with oxygen.
    The lungs, the heart, the circulatory system and pretty everything in between
    benefits. In sterile conditions, I extracted the cellular machinery from these
    red blood cells, creating an artificial blood that was not-typing and worked beautifully,
    in vivo, in the body, no matter what person''s blood type. It was a universal
    receiver and donor, a panacea for the sick. Today it is used in tissue transplants,
    and in cancer and cardiac research.


    Later still, another idea came along. After I''d published Arboretum America,
    a milestone of my research, I found a rare tree in Texas I''d long searching for.
    This tree was a thick-leafed version of the wafer ash, Ptelea trifoliata, used
    as a medical synergist by the Indigenous Peoples of North America and considered
    a sacred tree of the First Nations. I had then successfully grow this tree from
    the seeds I''d collected, and it had become the star of my North American medicine
    walk.


    One day, on my knees, with my trowel, planting bulbs around the tree, a thought
    flashed through my head. The trees of my arboretum are all rare. Some of them
    are endangered. While I was around, they were safe, but what would happen when
    I was gone? Something had to be done to both safeguard and propagate them; they
    are all heritage species and deserved to be saved, somehow. Then I thought, “A
    tree, any tree, could be cloned. It could start as a cell and run hard and become
    adult.” Since all trees lend themselves to cloning, I could launch a genome project
    to save all the species of the global forest.


    As a scientist, I have tried to face down the brutality of climate change and
    the monstrous effects it will have on all creatures. I have focused my efforts
    primarily on the forests because the trees speak for all of nature.'
  - '[PAGE 162]


    They are some top and the bottom of the pyramid of life, and if they are destroyed
    by earthquakes, wind, drought, excess radiation or direct human action, we are
    back to square one. To save the living planet, to save the human race, we have
    to save the trees. And so the larger question that lain under so much of my work
    has been this one: *Can I save the global forests?* If saying yes to something
    fantastic—the possibility of regrowing lost and threatened forest species from
    single surviving cells—might allow me to answer yes to that underlying and overarching
    question, then I will jump in wholeheartedly.


    I have dealt with the ideas of plant cloning throughout my career and have had
    some successes—including one that terrified the postmaster in Merrickville, the
    town nearest my farm. I keep an ongoing bucket list of perennial plants I want
    to work with. (I keep similar lists for rare and important trees, shrubs, medicinal
    plants and food crops.) On my perennial list for some time was a peculiar peony,
    black with a chocolate fragrance. I''d searched the whole world of botany and
    found there was just one of these peonies remaining, in the botanical garden in
    Oxford. I managed to persuade the Oxford botanists to share it with me by sending
    cell samples through the mail. The green children arrived in test tubes, about
    ten of them shipped to me sitting in an ordinary open-wire test tube rack. The
    cells inside were gathering seed on top of agar-agar, and the entire mess was
    stuck together with plastic tape, metres and metres of it. The green dots seemed
    to wink at the postmaster as he used one long index finger to push my experimental
    Oxford babies across his counter in my direction. It was clear to me that the
    experience of touching the perimeters of science was too much for him. These peony
    plants, grown from the samples that made the postmaster so apprehensive, now produce
    multiple black blooms with a delicate chocolate perfume in my garden.


    Can something similar be done to save the species of the global forests? I still
    believe that "mission impossible," as I''ve come to jokingly refer to it, is possible.


    There are three ways to attack this problem. The first is with herbar. A herbarium
    is a collection of dried plant specimens, including leaves, fruit,'
  - '[PAGE 163]


    seeds and some bark. The specimens can be air-dried by mounting them on paper,
    and then categorized by both common and Latin names, Latin being the universal
    language of botany. Also necessary to note the name of the collector and the date
    the specimen was collected, along with its geo-position. The room that contains
    the collection must be temperature- and humidity-controlled.


    As times go by, and improvements are made in DNA identification, herbaria prove
    to be of great value for a country. Species that have gone extinct or found their
    way onto the endangered list can still hold viable DNA. The extraction of DNA
    is similar for both the plant and animal kingdoms. The instruction package for
    building any mature tree is contained in its DNA.


    The second way to save the forests of the world is through somatic cloning. We''ve
    considerably improved upon this form of vegetative reproduction over the last
    few decades. Trees have this trick their sleeves for millions of years, I suspect
    as learned behaviour from past traumas and climatic catastrophes. In an average
    spring and summer, most people who go for a walk in the woods will see somatic
    cloning in action. An elm, *Ulmus americana*, a poplar, *Populus*, or a wild plum,
    *Prunus*, might have been cut down or blown over in a storm. These trees, and
    many others, have extremely viable roots. In a matter of weeks, a young tree will
    be found within fifteen metres of the downed mother tree. This is a somatic clone,
    the product of a method of multiplication that has nothing to do with the usual
    sexual interaction of sperm and ova. The cells of a somatic clone have the full
    complement of double chromosomes, the diploid number. Therefore, with careful
    handling, any part of a tree can be taken and cloned as if it were a seed. The
    cloned seedling can then be allowed to grow and become an identical tree to the
    mother plant.


    The third method to save the forests is perhaps the most interesting, at least
    from a scientific point of view. Here the target is the sexual life of the tree.
    The sperm and ova are isolated from the reproductive organs. Stored haploid cells,
    which are sexual cells with just one imprint of DNA, await cross-fertilization.
    When the male and female come together'
  - '[PAGE 164]


    compatibility, the seed is born. The seed is diploid, containing the elements
    to create the body of a tree. But embedded along with the DNA is a travel factor,
    folded proteins and polymeric sugars that are included within the seed as a sort
    of safety net of emergency rations. They are also dehydrated; losing the water
    increases the survival skills of these little specks of sexuality, because a seed’s
    destiny is to travel in time as well as space. Some seeds, like dates, may endure
    a spectacular length of time before they germinate. Others, like the pawpaw, Asimina
    triloba, require a little smear of nose grease—the finest and purest film of grease—from
    a human or raccoon to do the trick.


    Because haploid sexual cells can weather the storm of life and time, they can
    also be saved for the future in a special way. This is principally because they
    are dehydrated. The haploid cells can be stored at temperatures of minus 40°C.
    They can be stored indefinitely in this cryogenic form using liquid nitrogen.
    In other words, the haploid cells of the entire global forest can sit in a freezer
    the size of a kitchen table to await a better future as a super forest, a global
    one.


    Every country can maintain the DNA of its forests as a safety net. The science
    of cloning is maturing, and maybe somewhere in the future such a project may be
    easier to carry out. At the present time, cloning the global forest is a genome
    project of prime importance for us all.'
