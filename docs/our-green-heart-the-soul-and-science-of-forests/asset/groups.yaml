    # The Ancient and the Subatomic


    When I was a little girl still living with my family in England, my mother brought
    me to an Irish wake. A distant cousin of hers had died. We travelled via the Innisfallen,
    the ferry that ran across to Ireland, and landed in the valley of Lishens for
    the celebrations. Death and the afterlife are important to the Celt. We were bound
    by blood.


    The small whitewashed house and its accompanying cow barn had settled into the
    side of a hill centuries ago, becoming one with it. The cousin was a bachelor
    and had lived alone in the house with his trove of Greek and Latin books. Now,
    the dirt floor and the whitewashed walls of the farmhouse were crowded with the
    family he''d left behind.


    I remember the moment the bag of rags walked in the door. He commanded the room.
    Even the corpse shifted. This man, his clothes heaped upon a pile of blanket scraps,
    carried electricity with him. He was the seancha, the storyteller, the custodian
    of ancient lore; his job passed down his family’s line. The seanchaí wandered
    from place to place in the months from fall’s harvest to spring’s planting, sharing
    stories. Every farmhouse in the area kept a bed for him and people greeted his
    arrival with a meal and rapt attention. He had travelled on foot to the wake,
    coming from far away to honour the dead.


    He began to speak about the Ollúna, the master poets and historians of ancient
    times, gazing out the window at the hill behind the house. He seemed to go into
    a trance. He spoke then about bilocation, the ability to be in two places at once.
    He reported to all present an incident in the valley where somebody he knew and
    trusted was seen in Lishens and in Gougan at the same time. The concept itself
    was fantastic, the very thought of seeming to deny all that was secure in science.
    But it never left my head, all'
