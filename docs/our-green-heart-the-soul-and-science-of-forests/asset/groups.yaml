    # Forest Soil


    Trees make soil, and forests make a whole lot of it, the good loamy soil upon
    which all our lives depend. Soil is found everywhere from the tropics almost to
    the poles, but the magic of soil-making is a slow process, a gradual building
    and decomposing of layer upon layer of forest debris that can take up to a thousand
    years per centimetre depending on the trees’ health and ability to grow. Soil
    holds a mirror to the distant past. A handful of soil is a handful of ancient
    forest. It is the first fruit of the ancient, tree-world, and its making was a
    labour of love. Soil is the first life-support system of the planet. It is also
    an enigma to science.


    Soil is difficult to study because the characters within it are so numerous and
    interconnected. Soil is a living entity, bustling with microscopic life forms
    each caring for its own little territory. Thirty grams of soil may contain 1,000,000
    bacteria of just one type, as well as 100,000 yeast cells and 50,000 fragments
    of fungal hyphae. Some of that bacteria, the thinned Cyanophyta, work with the
    thick-skinned yeasts to give soil the plasticity that allows it to move around
    roots. The cryptogam fungi, with their hyphal probes, slowly move and motor in
    the soil, making contact for barter and exchange. They are changelings. In their
    diploid state, their mycelia hunt for food. When sated, they switch sexes, transitioning
    from auality into full-bore sexual beings. Then, and only then, do they enter
    the daylight as a mushroom. The bacteria, viruses and bacteriophages—the good,
    the bad and the indifferent—enjoy a microscopic life that can change its nature
    in a breath if the chemistry of the soil changes with the weather vane. Rain can
    push oxygen out of the soil in a hurry and create hypoxia.


    But there is always hope for a better tomorrow. Taken together, tiny heroes work
    around mites and millipedes, insects and worms to convert nitrogen and phosphorus
    together with other micro-elements into forms that can be used by their overlords,
    the trees and plants above ground. There is a harmony of healthy organisms working
    in the soil to produce the bread that goes into the basket of life.


    The jewel in the crown for soil is a bulky and extraordinary molecule called humic
    acid. As I wrote in an earlier chapter, fulvic and humic acid play a vital role
    in seeding the oceans with iron. It now appears that this acid is part of an entire
    family of macromolecules. Huge by molecular standards, these structures come from
    the decomposition of organic matter that has died and returned to the soil. As
    decay from former forests, they are found in coal and peat. All go by the common
    name of allomelanin.


    The word melanin no doubt rings a bell, as these compounds are responsible for
    the pigmentation of the feathers, fur and skin you see all around you on a daily
    basis. Melanins are composed of polymeric structures that can shape-shape. They
    look like branching necklaces of beads and can be contained or spread out. They
    are slightly soluble in water, which makes them swell and appear pudgy. Their
    absorption is a great gift; melanins are the water keepers of the living soil.
    These huge beasts of compounds also act as tannins for seeds, being natural growth
    hormones.


    Melanins feed photons into the soil, your skin and every pigment around. They
    trap photons from the sun and free this energy into the natural world in ways
    that are not really understood. The photons force themselves into the phenolic
    ring structure of the melanins and disturb the valency balance. This energy is
    bled off as py electrons into places like the trunks of oak trees, making them
    able to withstand a stronger sun.


    Soil is a treasure, and so like many of the gifts forest give us, we understand
    little about it and the many things it does for us. Years ago, a friend of mine
    was dying of cancer. His illness hung on my shoulders as a great weight because,
    as a medical biochemist, I felt that I should come up with some way to help him.
    Shortly after he''d told me his diagnosis, I was invited to visit a forest on
    the east coast of Canada. The forest was a

