  mdcn: '

    对于某个人来说，这种细胞可以回到同一个人的身体内而不会产生排斥。


    在当时，这已经足够让我费脑了，但在职业生涯的后期，我产生了另一个想法：如果将细胞内的机制提取出来，并让它继续工作会怎样？我选择实验一种名为红细胞（erythrocyte）的细胞——来自加拿大红十字会储存的旧血。尽管红细胞呈甜甜圈形状，但它们在血液中游泳，为器官提供氧气。肺、心脏、循环系统以及其间的几乎一切都从中获益。在无菌条件下，我从这些红细胞中提取出细胞机制，创造出一种不分型的人造血。无论病人的血型如何，这种血在体内体内运行得非常完美。它是一种通用的受体和供体，是治疗病人的万能药。今天，它被用于组织移植，以及癌症和心脏研究。


    后来，另一个想法又出现了。在出版了作为研究里程碑的《美国植物园》（*Arboretum America*后，我在德克萨斯州发现了一棵寻找已久的稀有树。这种树是三叶翘（*Ptelea
    trifoliata*）的阔叶品种，被北美原住民用作医学协同剂，并被第一第一民族（First Nations）视为神树。那时，我已成功从收集的种子中培育出这种树，它已成为我北美医学漫步之旅的明星。


    一天，我正跪在地上，手里拿着铁铲，在树周围种植球茎，一个念头闪过我的脑海。我植物园里的树都是稀有的。其中一些还是濒危物种。只要我在，它们就是安全的，但当我离开后会发生什么呢？必须采取行动来保护并繁衍它们；它们都是遗传物种，应该以某种方式被拯救。接着我想：“一棵树，任何一树，都可以克隆。它可以从一个细胞开始，努力生长并长成。”由于所有的树木都适合克隆，我可以启动一个基因组计划来拯救全球森林的所有物种。


    作为一名科学家，我一直试图面对气候变化的残酷以及它对所有生物将产生的巨大影响。我主要将精力集中在森林上，因为树木代表了整个自然界。


    它们是生命金字塔的顶端和底部，如果它们被地震、风暴、干旱、过度辐射或直接的人类活动破坏，我们就回到了原点。为了拯救这个地球星球，为了拯救人类，我们必须拯救树木。因此，隐藏在我许多工作之下的大问题就是：*我能拯救全球森林吗？*如果对一个奇幻的想法说是——即从单个存活细胞重新生长出丢失和受威胁的森林物种的可能性——可以让我对那个基础且首要的问题回答“可以”，那么我将全心地投入。


    在我的职业生涯中，我一直在处理植物克隆的想法，并取得了一些成功——其中一次甚至让位于米里克维尔（Merrickville，离我农场最近的小镇）的邮局感到恐惧。我一直在记录一份想要研究的多年生植物清单（我也为稀有且重要的树、灌木、药用植物和农作物列了类似的清单）。在一段时间以来，我的多年生清单上有一株奇特的牡丹，它是黑色的，带有巧力的香气。我搜遍了整个植物学界，发现牛津植物园里只下一株这样的牡丹。我设法通过邮寄发送细胞样本，说服了牛津的植物学家与我分享。这些“绿色孩子”装在试管里到达，大约十个被放在一个普通的开放式试管架上寄给我。管内的细胞在琼脂上聚集形成种子，整团乱象用胶带粘在一起，用了好几米长。当邮局长用一根长手指将我的实验性“牛津宝宝”过柜台推向我这边时，那些绿点似乎在对他眨眼。对我来说，这种触摸科学边缘的经历对他来说太难以承受了。这些由让邮局长如此焦虑的样本生长出来的牡丹植物，现在于我的花园里开出了多朵带有精致巧克力香气的的黑色花朵。


    是否可以做类似的事情来拯救全球森林的物种？我仍然相信，我戏称的“不可能的任务”是可能的。


    解决这个问题有三种方法。第一种是利用植物本馆（herbarium）。植物本馆是干燥植物标品的收集，包括叶子、果实、种子和一些树皮。标本可以通过装裱在纸上风干，然后根据普通名称和拉丁学名进行分类，拉丁语是植物学的通用语言。此外，还需要记录采集者的姓名、标本采集日期以及地理位置。存放这些收藏的房间必须控制温度和湿度。


    随着时间的推移和DNA鉴定技术的改进，植物本馆证明对一个国家具有巨大的价值。已经灭绝或进入濒危名单的物种仍然含有活性的DNA。植物界和动物界的DNA提取是类似的。构建任何成熟树木的指令包都包含在其DNA中。


    拯救世界森林的第二种方法是通过体细胞克隆（somatic cloning）。在过去的几十年里，我们大大改进这种无性繁殖的形式。我怀疑树木拥有这种隐藏了数百万年的本领，也许是从过去的创伤和气候灾难中习得的行为。在普通的春夏，大多数在森林里散步的人都会看到体细胞克隆的发挥作用。一棵美国榆（*Ulmus
    americana*）、一棵杨（*Populus*）或一棵野梅（*Prunus*）可能在风暴中被砍或吹倒。这些树以及许多其他树具有非常有生命力的根系。在几周内，在倒下的树的几米范围内就会发现一棵幼树。这就是体细胞克隆，一种不需要精子和卵子相互作用的方法的产物。体细胞克隆具有完整的双倍染色体，即二倍体数。因此，通过精心的处理，树的任何部分都可以像种子一样提取并克隆。克隆的小苗然后可以生长成母植物完全相同的树。


    拯救森林的第三种方法从科学角度来看可能是有趣的。这里的目标是树木的性生活。精子和卵子从生殖器官中分离。储存的单倍体细胞（只有一个DNA拷贝的性细胞）等待受精。当雄性能性结合时，种子就诞生了。种子是二倍体的，包含了形成树体的元素。但在DNA中嵌入的是一种旅行因子、折叠蛋白和聚糖，作为应急安全网包含在种子中。它们也是脱水的；失去水分增加了这些微小性点的生存能力，因为种子的命运不仅是空间旅行，还有时间。有些种子，如枣，可以在很长时间后发芽。另一些种子，如泡杨（*Asimina
    triloba*），则需要人类或浣熊的一抹油脂才能起作用。


    由于单倍体性细胞能够抵御生命时间的风暴，它们也可以以特殊方式保存在未来。这主要是因为它们是脱水的。单倍体性细胞可以在零下40摄氏度的温度下利用液氮以这种低温形式无限储存。换句话说，整个全球森林的单倍体细胞可以放在一个餐桌大小的冰箱里，等待作为超级森林、全球性森林的更好未来。


    每个国家都可以维护其森林的DNA作为一种安全网。克隆技术正在成熟，也许在未来某处这样的计划更容易实施。目前，克隆全球森林对我们所有人来说都是至关重要的基因组计划。

