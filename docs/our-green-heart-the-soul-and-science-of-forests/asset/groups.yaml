    One bright afternoon, Nellie sat me down to learn about Irish moss, Chondrus crispus.
    Holding a tangle of the red moss in her hands, she explained that it was a medicine
    that held a cure for tuberculosis, what we then called consumption. I was surprised
    to hear that it was a seaweed that grew on the shore, particularly on the rocky
    west coast, which she collected at low tide. The waters of the Atlantic carried
    a warm current from the American continent, she explained, and this warm water
    was an essential ingredient for the growth of this moss.


    Chondrus crispus was collected in open willow baskets. It was taken and boiled
    in water to extract a jelly that was then prepared as a kind of custard. This
    was a medicine given daily to people suffering from consumption. Those sickened
    by the disease slept for days without waking. Their lungs bled, and the blood
    came up with constant coughing. She told me that the jelly from Irish moss was
    the best medicine for this condition, an anti-inflammatory that helps the immune
    system.


    A few years later, enrolled at University College Cork and having dutiful paid
