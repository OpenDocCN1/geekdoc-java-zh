    # When the Land Breaks Its Silence


    From the land all children are born, on the land we live, and into the land each
    of us must return when we die. The land is holy and should be venerated. It holds
    the voice of creation. Sometimes it speaks, breaking the silence of its own wonder.
    When it does, those who are close to it, who breathe its perfumes, listen. They
    know the land is the very best of teachers and holds out the hand of wisdom.


    Each summer when I was a girl, I was sent to live with my great-aunt Nellie and
    her son, Pat, on their farm in the valley of Lisheen in southern Ireland. They
    were subsistence farmers, living off the land just as people had in the valley
    for hundreds of years. With them, I first witnessed a deep reverence for the land
    with my own eyes.


    Pat, my cousin, was a grown man, hardened by the labour of caring for the animals,
    of sowing, reaping and harvesting without the aid of internal combustion. He would
    walk to the top of the Droim—a word that denotes not only a human''s or an animal''s
    back but a field with the shape of a back, from which binding spells were in ancient
    times. Pat would stand there alone. He would stare at the hills, holding his arms
    out to embrace the fullness of the landscape, drinking into his soul. After a
    time, he would turn one step to the Caha Mountains, which stretched across the
    horizon to the north of the farm. The range spoke to him like a mother, a voice
    of enveloping care.


