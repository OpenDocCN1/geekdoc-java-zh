    DIANA BERESFORD-KROEGER, a world-recognized scientist in the fields of medical
    biochemistry, botany and medicine, has spent a lifetime interpreting science for
    the general public. In 2023, Dr. Beresford-Kroeger received the University College
    Cork Distinguished Alumni Award and the Royal Canadian Geographical Society Kamookak
    Medal. She is the author of a number of best-selling books on nature. Arboretum
    America: A Philosophy of the Forest won the Arbor Day Foundation for an exemplary
    educational work on trees and forests. In 2020, she received the Sigurd F. Olson
    Nature Writing Award for her autobiographical To Speak for the Trees. She is the
    author and presenter of the feature documentary Call of the Forest, which is based
    on her book The Global Forest. Beresford-Kroeger continues her research and writing
    in her private arboretum in Ontario, Canada.


