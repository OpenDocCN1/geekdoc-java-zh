    down at a huge piece of bog oak. The find itself, this dark mass of wood hidden
    in the earth, was not unusual, Pat told me. Similar pieces often popped up when
    people in the valley cut turf. What struck me, though, was that such a gargantuan
    tree once existed in a landscape that was now treeless everywhere I looked. Where
    had the forests that held these giants gone?


    Within a few days I began walking, keeping my botanical eyes fully open with every
    step. Every place I noticed a turf reek outside a farmhouse, I asked. The entire
    countryside, up to the tops of the hills, nearly to the tops of the mountains,
    was carpeted with turf, and I soon found out what Pat had told me was true. Gnarled
    branches and butts of oak were uncovered in sufficient numbers for carved bog
    oak, in its dark, polished splendour, to be an item people wanted to acquire and
    use.


    The pattern language of the ancient forest, though, was the knowledge of the community
    of forest members—the ground-layer plants, like the insects; the understory of
    smaller trees with their climbers; and the dominant canopy—had gone. Only one
    plant, a biennial, remained from the greatest forests of Ireland. It was to be
    seeing a faithful hitchitch in the hedges and ditches around the tiny fields.
    This plant was the foxglove, Digitalis purpurea. They still raise their spires
    of spotted flowers to dance in June with the fairy folk of these ancient fields.
    A survivor stripped of its community.


    Apart from the odd mistake—the few places that have somehow skirted human greed,
    like areas in the boreal forest system and in some mountain regions—the reality
    I witnessed in the valley of Lishees has played out all the world. In the past
    fifty years, the face of the forest has changed. If viewed from the air via drone,
    plane or helicopter, forests presented a checkered appearance. This is why they
    have been destroyed, of course, but also of the way they are “managed.” Some areas
    are clear-cut and present tree butts to the eye. Others are partially cut over.
    On the east coast of Canada, a different strategy is employed: As you drive the
    roads and highways, it seems as if you are surrounded by untouched forest. In
    reality, you’re passing a screen of trees, maybe thirty to sixty metres deep,
    that have been left to line the road. Everything behind this screen is cut. On
    the other side of it, disastrous conditions stretch as far as the eye can see.


    Even when forests are replanted after they have been logged, they look very different
    from the native mixed forests that once occupied these sites. From country to
    country, bandwagon thinking has influenced what is planted. The choice is invariably
    evergreen as evergreens are more convenient to plant. I think evergreens are also
    chosen because the small seedling looks like a tree; in its earliest months and
    years, it is easier to imagine it growing into a bigger tree. Further supporting
    this practice is a fallacy out there government circles, and even among some academics,
    that deciduous trees take a long time to grow. My experiments show that this is
    not true. An evergreen tree takes off immediately, but a deciduous tree, once
    its canopy spreads and enlarges its green volume, can catch up and overtake it.


    The plantation forests that exist all over the world look alike. From above, the
    entire area looks as if the trees have received a crewcut. They get the nod from
    departments of the environment, big industry and even many conservation groups,
    but these crewcut forests play a cruel trick. Over time, the public—and especially
    children, whose young eyes have never seen a mature, mixed forest—come to view
    the plantation forest growing on their doorstep as a real forest, a native one.


    The crewcut forests also hide another natural disaster I first became aware of
    around forty years ago. The land next to our farm was being planted with trees.
    A group of young men, all in their twenties, were the planters. For some reason
    known only to their employers and God, they were using a nerve poison around the
    young pine trees. They were neither breathing masks, goggles nor gloves. At one
    point, they came to my door for some water and told me what poisons they were
    using to “get rid of ants.” I asked them if they were married and if they planned
    to have children. When they answered in the affirmative, I told them, “Don’t plan
    to have healthy children.” They were horrified.


    The practice, I came to learn, was no outlier. These clear-cut regions of once-forested
    land are very often sprayed with a rainstorm of toxins. These can be herbicides,
    pesticides, pre-emergent killers, control chemicals and sometimes nerve toxins
    to kill off insects. Plants, like humans, carry regulatory hormones. Some are
    fat-soluble while others are water-soluble. To do their work, these designer toxins
    hit the highways of water in the soil that are so important to a living planet.
    Eventually they reach the rivers, lakes and oceans, and inevitably this weapon
    of molecular warfare ends up in the places of least resistance, like the North
    and South poles. And they land in the breast milk of everything from whales to
    the pinnacle predators on land.


    “Managed” forests lead to poisoned monoculture plantations. Those poisons stay
    in nature to wreak havoc with biodiversity. Conversely, the biodiversity within
    the trees of a native forest gives rise to further biodiversity in plant life,
    which gives rise to biodiversity in underground fungi. This in turn increases
    the biodiversity of insect life, which leads to an increase of healthy mammals
    and especially birds, who patrol the trees, keeping them safe from disease and
    infection. This is how a native forest can look after itself anywhere on the planet.
    The blueprint is in the DNA. It is flexible and it is the real genius behind all
    life forms on this planet, an algorithm based on simplicity.


