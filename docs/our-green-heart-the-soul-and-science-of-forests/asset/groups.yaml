    # Our Cosmic Umbrella


    I had a secret garden in Lisheens. It was on a high shoulder of the valley, up
    behind the farmhouse—a climb to get there, in other words. The garden was a small
    field surrounded by a gorse hedge that contained my weeping stone, a boulder twice
    the size of our farmhouse table, against whose flank I leaned when I was feeling
    low. In happier moments on a summer''s afternoon, I would stretch out on the green
    grass and shamrocks to think, the buzz of my elders'' Gaelic words of instruction
    alive in my head: everything in the world was connected in a form of unity, a
    cé.


    I would turn my head and look through stalks of grasses, this new point of skewing
    their proportions. Between these green columns, now appearing tree trunk-sized,
    a gouache of aquamarine shimmered out to the horizon of Bantry Bay. Turning my
    head to the heavens, I looked up and felt the sky was mine alone, my inheritance.
    Clouds the brilliant white of untouched snow floated over me. They changed shape
    in elegant drifts, casting fragile shadows on my still body. In my imagination,
    fed well with lines of poetry at Nellie''s haunt, I rode their white haunches.
    I could touch the face of the sun with my finger and, later, to summon the liquid
    lace of the moon, which would rise from the curve of the Caha range, bright with
    reflection.


    In these blissful moments, I often thought of the cosmic light pouring down on
    me. But even though I daydreamed of travelling there, I gave little to not thought
    to the light the planet threw back into the black of space. “Earth shine” is the
    sunlight reflected off the planet, some of it to the moon and back again. In space,
    all solid objects are mirrors that reflect light.


    Planet Earth is unique among these mirrors, at least as far as we know, because
    it is a living “solid object.” Each cell of every plant on land and in the sea
    carries the rule book for photosynthesis, the recipe for exchanging'
  - '[PAGE 114]


    sunlight for oxygen and carbon. This game of capture and release is played by
    the simplest organelle in the oceans and the most complex flowering trees. When
    trees learned to live in a community of others, they earned the benefit of an
    increased ability to cope with the stresses and strains of life. Native forests
    could lay claim to new and sometimes seemingly inhospitable territory, customizing
    themselves to find the perfect niche in each habitat.


    The mangrove forests teetering on the shores of the planet endure exposures to
    saline waters and soils that would kill another tree. To accomplish this feat,
    the mangroves produced pneumatophores, aerial roots capable of breathing like
    lungs. Another adaptation, the nodal distribution of aerial roots, allow tree
    species in the Andean cloud forest to maintain vertical villages of green, said
    to be home to the Curupira, a mythical creature with backwards-facing feet who
    protects the plants and animals from human incursion. The kauri pines of New Zealand
    grow together to guard the forest floor, making a pathway for the flightless kiwi
    bird. In Africa, the baobabs, Adansonia, are felled along with their water and
    medicines. Then there is the boreal forest system of the north, whose lean diet
    produced the capercaillie, the game bird of the Druids, whose ancient name came
    from capall, horse, and coil, forest. In England today, they are working to bring
    this black rascal back. The blue cedar, Cedrus, of the Atlas Mountains are also
    being extirpated, though they are the wardens of water for North Africa and the
    Mediterranean. China has still not woken up to the fact that the dawn redwood,
    Metasequoia glyptostrobides, is an iconic species, the First Lady of the Planet,
    and she down comes.


    Among untold, and maybe uncountable, other benefits, the extraordinary biodiversity
    of the planet''s forests acts like a mirror in a very strange way. On an average
    day, our planet reflects about 30 percent of the sunshine it receives back into
    space. This reflectance is known as the earth''s surface albedo; maintaining it
    near its current level is a necessity for comfortable existence. Forests play
    a vital role in the albedo effect.'
