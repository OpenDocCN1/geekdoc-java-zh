    beach waiting for me and my film crew. He was Professor Katsuhiko Matsunaga, Japan’s
    top marine chemist, and I was interviewing him for The Call of the Forest. Professor
    Matsunaga and his research team had spent forty years trying to identify the vital
    link between the land and the sea that is so important to marine life. Ultimately,
    they had found something astonishing.


    All Cyanophyta, the bacteria formerly known as blue-green algae, need iron to
    reproduce and divide; the metal plays an important role in marine photosynthesis
    through chloroplasts or plant-type ferredoxins, the molecules that enable electron
    capture and transfer in these tiny plants. In addition, when the sun dips below
    the horizon, iron takes the sun’s place as a catalyst for the manufacture of proteins
    in Cyanophyta—proteins on which its reproduction depends. Overall, the steady
    multiplication of waterborne marine plant species represents the food foundation
    of the oceans.


    The land is rich in iron and the sea is poor in it. What Matsunaga discovered
    was that an acid from the land, fulvic acid, acted like a cage and carried iron
    into the sea. Fulvic acid—and its sister molecule, humic acid—is a chelating agent.
    Both molecules grab iron salts from the red richness of the land and demand them
    to the sea.


    Trees and forests produce massive quantities of these two acids. As autumn arrives,
    it reconfigures the deciduous trees. First, their leaves change colour, the familiar
    greens turning to reds, yellows and oranges, even going a misty purple or mauve,
    the valuable chlorophyll is packed away into the trees’ vascular rays and root
    systems for storage during the winter months. The trees produce a molecular scissors
    called abscisic acid, which causes the leaves to fall to the ground and produces
    the familiar leaf scar that remains on the twig. Conifers do not escape abscisic
    acid, but evergreens are more frugal with their canopies. For the most part, an
    evergreen needle hangs for seven years. Sometimes, if the weather is excessively
    dry, a shower of orange needles will fall around the tree. There are also the
    deciduous conifers, like the larches, Larix, of the north, that lose their leaves
    every fall.


    As the forest floor gains its carpet of leaves, abscisic acid has another task.
    Winter rain and snow dissolve the acid into the leaf litter, and in the months
    that follow, as those leaves are broken down, they become skeletons. A web of
    lignin is all that remains, sometimes drawing the exact outline of the leaf. In
    time, this is too reduced. This process creates huge polymers in the forest soil—the
    fulvic and humic acids. Dissolved by rainwater, they set sail for a bigger horizon,
    gathering a load of iron salts on the way. Freshwater streams and rivers carry
    them to the oceans, where they deliver their precious cargo.


    It is this influx that results in the riot of biodiversity I witnessed at the
    place where I painted and frolicked with nunts. At these meeting points, giant
    columns of microscopic Cyanophyta wait for iron, their vital nutrient. These columns
    hold poetry in their naming. They are Chroococcales, Camaesiphonales, Pleurocapsales,
    Nostocales and Stigonematales. The iron jump-starts their protein-building enzymes
    to feed the fish, to feed the mammals, to feed all life.


    Professor Matsunaga told me of a very old saying in Japan: “To eat a fish, you
    must plant a tree.” The great oceans need food. The web of life is even more connected
    than anybody ever suspected. Japanese fishermen now planting trees along once-denuded
    coastlines to feed the fish of the future.


    ![](img/9a73bd94214c184b1606db8dbb911966_58_0.png)


    # An Entanglement of Oaks


    As we stare down the climate crisis, attempting to come to grips with its current
    and future impacts, biodiversity brings blessings to buffer our world. Trees have
    their own history. They have already lived through ages of crisis on Earth, and
    they have developed strategies and solutions to cope. Many families of trees acted
    as pioneers in the past, and they can do so again, since the memory of past climate
    events is maintained as a living library of lessons within their physical structures.
    Hopefully, the trees'' epigenetics will guide their growth into a more stable
    situation, but this remains to be seen.


    Maintaining existing biodiversity, particularly in native forests, is so vital
    because not all trees are equal in their ability to survive change. The story
    of any adventurous species—by this mean trees or forests that venture into and
    then survive in unfamiliar and unforgiving environments—is a formidable one. Their
    success is the result of tailoring their genome to fit into a particular habitat.
    The DNA algorithm eventually learns to modify its behaviour to suit the complexities
    of the landscape. This can take millennia, but it often results in something new
    being added to life’s tool kit for survival. Dry areas, for example, smile on
    the white Leguminosae family—like the Gleditsia or honey locust, Acacia shrubs
    and trees, and the yellow-blossomed Sophora chrysophyllum—and conifers have also
    picked up tricks to deploy in parched conditions. Desertification changes the
    cuticular windows on leaves to produce blue-green trees. In addition to this,
    the trees produce specialized beards on their mouth parts, or stoma, to conserve
    water.


    Biodiversity is also linked to aromatic molecular diversity. Generally speaking,
    different tree species within the same family show a similar pattern of biochemicals.
    However, the species of trees on the margins of life show different titres of
    these chemicals, often present in unusual amounts and concentrations. These differences,
    in turn, affect the internal workings of the tree, right down to the growing tips
    of the roots. These areas need the darkness of the underground to operate. The
    asexual hyphae of fungal mycelia listen to these chemical notes and change sex.
    Cyanophyta in the soil can do the same thing. Viruses and bacteria may come along
    for the ride, and the bacteriophages blast apart to search for useful fragments
    of DNA, which are fitted and patched to make a new whole.


    The real genius of trees, though—one that has gone under the radar of science—is
    not to be found in any specific adaptation, but in the way adaptations in a forest
    mesh. Each tree of a forest holds a unique set of genes, much like each individual
    member of the human family. So, a native forest with its full range of biodiversity
    is able to generate even more change and adaptation. No two species are exactly
    alike; nature and nurture see to that. Biodiversity enhances nurture in nature;
    a mother will recognize her saplings and protect them with an underground plume
    of chemistry, strengthening them so more will survive. There seems to be a chemical
    conversation of identity between blood relatives, even if that blood is green.
    Biodiversity enhances a tree’s or a forest’s survival in ways science is just
    beginning to see.


    The oaks of the northern hemisphere, all six hundred species of them, seem to
    be the leading path to climate change. A mature oak has an enormous ability to
    sequester carbon dioxide out of the atmosphere, and it is this adaptation that
    has turned the tree into a warrior to fight climate change. The tree manufactures
    twin biochemicals, quercetin and quercetin, that course through the entire canopy.
    When photons hit the canopy, they displace electrons from the chlorophyll in a
    one-on-one ratio. The spare electrons produced from these collisions are captured
    by the quercetin and quercetin, and slowed, becoming pye electrons that are funnelled
    into photosynthesis. This action is called quantum lifting. In the green hands
    of nature, the small and very small acts of photons and electrons count because
    of their high volume during the sunshine hours of the day. The same principle
    governs a hive of bees. It''s not the single worker bee that is important, but
    the hive''s two to three pounds of bees, which come together to complete the tasks
    that keep the hive operational. It could be, then, in the leaves of every oak
    some of the most pertinent answers to the question of free energy are staring
    us in the face. I have long been interested in material physics and energy storage.
    About fifty years ago, I modified an electron microscope to focus the electron
    beam for bombardment. I chose plant species I knew were high in molecular aromatic
    compounds, like the oak with its twin biochemicals. The beam converted their pye
    electrons into light energy, and I called that afterglow effect cathodoluminescence.
    I could repeat the results faithfully, and I published a paper on the discovery,
    for which I received an award. My work was important, and still is, because it
    showed that photons and electrons are interchangeable; both bundles of energy
