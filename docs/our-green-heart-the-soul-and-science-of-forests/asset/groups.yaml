  - '[PAGE 22]


    # The Star of Nature


    Sometimes in the spring of 2010, I received a casual invitation to join a bunch
    of women for lunch. The spot was the National Arts Club on Gramercy Park in New
    York. I was also asked to speak, but it was impressed on me that my remarks need
    be nothing fancy: “Oh, just a few minutes will do. It is all informal. You can
    do it before coffee and dessert if you like.”


    As it turned out, I was joining a group of women scientists for that lunch, including
    professors from the top-tier universities in the United States. A lot of them
    were there already when I arrived, and they kept coming. Extra chairs were ordered
    and squeezed into place around the round tables.


    After the soup was served, a woman rose to my left. She was welldressed and armed
    for combat. I could feel the electricity in the air as she stepped to the stage.
    With the grace of a ballerina, the female scientist drew down a screen. I noticed
    her nails were perfectly manicured. As she began to speak, a slide was projected
    onto the screen, replete with numbers and pie charts and enough graphs to strangle
    a giraffe. She clicked to a second slide, then another another, one after the
    other in a cascade of colour. She was extremely impressive. Her knowledge of her
    subject was so smooth and well presented with a calm like a curtain fall over
    the listeners. I guessed that she ran her lab with the same kind of ease and polish.


    As instructed, I had prepared nothing. I looked around for an escape, but there
    was none. I would look like a fool—indeed, I was a fool—so I stood up excused
    myself, hoping to step away and collect my thoughts. I walked, with as much dignity
    as I could muster, out of the dining room, down the magnificent gleaming staircase
    and out into the expensive dust of the streets of Manhattan. I looked around,
    hoping to stumble upon a miracle,'
  - '[PAGE 23]


    and I saw a tree, one of many lining the street, each in its own tall, black,
    wrought-iron cage of respectability. I breathed a sigh of relief. The trees were
    Tilia cordata, the small-leafed linden. I was alone on the street, and guiltily
    reached up and plucked a lime-green leaf, just in its expansion stage. As I stared
    at my green friend, suddenly, and seemingly from nowhere, a young man appeared
    in front of me, tall, blond and handsome.


    Where did he come from? I asked myself, a bit frightened by his sudden appearance.
    But the young man smiled at me, completely at ease. He watched me study the perfect
    leaf, his mid-vein taut. I laid it in the centre of my open hand and looked at
    it some more, then gently closed my fingers around it in such a way that the leaf
    would not be crushed.


    The young man leaned towards me, and with another smile on his lips and in his
    eyes, he said, "I see you have a tree star." I looked down at my hand, then up
    at him. He was gone. I was surprised, even a bit shocked, and looked up and down
    Gramerc Park, but there was no sign he had ever been there.


    By the time I re-entered the dining room, it was my turn to speak. I walked towards
    the stage with the leaf concealed in my hand, my arm in the air. I announced to
    my audience, "I have something in my hand. It is living. It is breathing. It has
    cells, and in that cellular tissue it has RNA and DNA. Can anyone guess what I
    have?


    The audience shrank away from me a little bit, but a few called out their guesses.
    "A mouse?" "A frog?" "A beetle?"


    I opened my hand to reveal the leaf, I proceeded to lecture on the quantum reality
    of photosynthesis and the dance of short wavelength light required to operate
    its universal system—all from the altar of a simple leaf.


    Some women at the edge of the audience began to cry. Many people who were there
    that day still remember what I said. People do not expect the extraordinary to
    stride out of the ordinary. Neither do I. The young man was right. I had a real
    star of nature, a tree star, in my hand.'
- md: '

    A leaf is a perfect case of intelligent design in nature. Every leaf from every
    plant is a living thing complete with its own DNA. In a basic sense, it is a solar
    platform with a mobile arm. This green thing tracks the sun from morning to dusk,
    anywhere and everywhere on planet Earth. It is a guided tracking machine that
    functions in the air. It exists underwater, though marine forests carry a different
    design, one meant to handle the resistance of water. They are also stacked vertically
    in their habitats to receive maximum sunshine.


    Leaves come in all shapes and sizes. They can vary from a needle whose sharp point
    can penetrate the skin, to the ovular, spade-shaped, handprinted and multi-lobed
    abundance of obovate and spatulate, trifoliate and palmate. In general, the shape
    is dictated by the genome of the family into which a tree fits. The more complex
    leaves belong to some of the most interesting species on the planet. Sometimes
    a translocation, or rearrangement, of DNA takes place and all of a sudden, often
    to the surprise of science, there is a new kid on the block. The new tree or plant
    is called a sport.


    The blade of the leaf is held in position by a slender called a petiole. These
    parts can be very short, the leaf seeming to spring directly from the stalk, in
    which case it is called sessile. They can also be very long. The petiole controls
    the movement of the blade, or lamina, of the leaf. This movement probably has
    a basis in the physics of osmotic pressure, but it is not conclusively known how
    it happens. This is just one of the many fundamental, essential facets of tree
    and forest life that remain mysteries to science.


    There is one family of trees found across the world whose petioles have an unusual
    work habit. This family is the willow, Salicaceae, whose genus, Populus, is remarkable.
    These trees, numbering about thirty species, are nature’s green windmills. The
    mass of the blade of the leaf matches the length of the petiole in such a way
    that even the smallest change in air pressure is expressed in movement. This incredible
    motility is captured in the name of the tree, *Populus tremuloides*, the quaking
    or trembling aspen, which rings the bell of any change across the world.


    Even though children have played with leaves since the beginning of time, very
    little is known about the eco-function of a simple leaf. A leaf is a lung. On
    its own, a very small lung, to be sure. However, if the entire canopy of a deciduous
    tree were removed and all the leaves placed by side, the bigger vision would come
    into view. This collective is the full breathing and exchange apparatus of a tree.
    The surface area is huge, thought to cover many acres. Forests, in turn, magnify
    and multiply the scale. They are staggeringly massive instruments of carbon capture.


    Human breathing is strictly regulated by the deep centers, or limbic regions,
    of the brain. Trees and forests are similarly regulated, but in their case the
    process is a little more complicated. Because of shade, the canopy doesn''t sing
    from the same song sheet; areas in full sunlight respond to exchange better than
    those in the shade. This design is called distributed emergent computation, a
    gene-derived binomial function of command and obey found in trees, in forests,
    and also in the human immune system. The mathematical principle underlying this
    exchange in trees is called cellular automata, which is a form of intelligence
    that in human beings is confined to the brain. Nobody knows how it happens in
    trees, much less in forests. Like the movement of a leaf blade tracking the sun
    across the dome of the sky, it remains a mystery, even though our lives depend
    on it as we breathe through every minute of every day.


    The star of nature is the leaf, simple and staggering complex, a mystery any one
    of us can pluck and cup in our palm. The smiling young man in the street hit the
    nail on the head. Thank you, stranger, for your graceful words.


    ![](img/9a73bd94214c184b1606db8dbb911966_26_0.png)


    # The Ancient and the Subatomic


    When I was a little girl still living with my family in England, my mother brought
    me to an Irish wake. A distant cousin of hers had died. We travelled via the Innisfallen,
    the ferry that ran across to Ireland, and landed in the valley of Lishens for
    the celebrations. Death and the afterlife are important to the Celt. We were bound
    by blood.


    The small whitewashed house and its accompanying cow barn had settled into the
    side of a hill centuries ago, becoming one with it. The cousin was a bachelor
    and had lived alone in the house with his trove of Greek and Latin books. Now,
    the dirt floor and the whitewashed walls of the farmhouse were crowded with the
    family he''d left behind.


    I remember the moment the bag of rags walked in the door. He commanded the room.
    Even the corpse shifted. This man, his clothes heaped upon a pile of blanket scraps,
    carried electricity with him. He was the seancha, the storyteller, the custodian
    of ancient lore; his job passed down his family’s line. The seanchaí wandered
    from place to place in the months from fall’s harvest to spring’s planting, sharing
    stories. Every farmhouse in the area kept a bed for him and people greeted his
    arrival with a meal and rapt attention. He had travelled on foot to the wake,
    coming from far away to honour the dead.


    He began to speak about the Ollúna, the master poets and historians of ancient
    times, gazing out the window at the hill behind the house. He seemed to go into
    a trance. He spoke then about bilocation, the ability to be in two places at once.
    He reported to all present an incident in the valley where somebody he knew and
    trusted was seen in Lishens and in Gougan at the same time. The concept itself
    was fantastic, the very thought of seeming to deny all that was secure in science.
    But it never left my head, all through my education in universities across the
    world. Once it has been born, an idea will live on.


    In mid-career, Albert Einstein began to grumble about electrons. He called their
    behaviour “weird” and shook his head at their antics. Electrons, of course, already
    been described in physics—elementary particles that carry a negative charge. Each
    of Earth’s elements is blessed with a cloud of electrons. Their number may change,
    but their behaviour was believed to be constant and predictable. That is, until
    one day a few years ago, in a lab in Berkeley and subsequently in other labs,
    a single electron managed to be in two places at once. All the time measurements
    in these experiments were judged to be correct, despite the fact that the feat
    seemed to be impossible. These scientists performed the act of bilocation. One
    little electron jumped the great barrier of entrenched belief and had to rest
    in the imagination. Though it wouldn’t have surprised the seanchaí, the discovery
    was new and novel to science. Once it sank in, other scientists began to look
    at another elementary particle, one that the entire planet was very familiar with
    it, especially its trees: the photon.


    In a manner of speaking, the photon is sunlight. It is a quantum of electromagnetic
    radiation that comes from the sun’s energy field. And, again to the surprise of
    science, a photon, any photon, can perform the magical act of bilocation, though
    over distances greater than those measured in electrons. (These photon experiments
    were done recently, but the discovery has drawn surprisingly little excitement
    and attention.)


    When Einstein was resident at Princeton University, from the mid-1930s to the
    mid-1950s, he was fascinated by the physics of sunshine. He hit a dilemma while
    investigating his behaviour, though. In his measurements of the wavelengths of
    light, he found they travel in two ways: in a straight line he called a vector,
    and in waves whose lengths are very short, somewhat like the rhythmic arrival
    of ocean waves at the seashore. Though he solved the problems of the straight-line
    vector, how and why these sine waves remained out of reach. What purpose did they
    have in nature?

