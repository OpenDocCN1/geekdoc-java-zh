    Twenty years later, while living and working as a scientist in Canada, I received
    a call one afternoon. A group of people on the Pacific west coast, on the Mainland
    somewhere north of Vancouver Island, wanted to do a little bit of geoengineering.
    They had persuaded a few local First Nations to join their ranks, others were
    firmly against the project. They wanted my blessing too, but I refused their invitation
    on the basis that there is no such thing as a little bit of geoengineering.


    Their aim was to increase the salmon run and to improve the west coast fisheries
    by seeding a stretch of coastal waters with iron filings. Seeding the ocean with
    iron, as I spelled out in the earlier chapter that addresses humic and fulvic
    acids, the Cyanophyta did live and grow in their long columns of microscopic,
    interactive life. These mostly unicellular creatures are the foundation of the
    ocean food chain. Give them the iron they need to reproduce, a metal scarce in
    a marine environment, and you provide a boost to the entire food chain, which
    ultimately benefits an apex species like salmon. Hey, if the forests can do it,
    maybe humans too!


    About six months later, I heard that the iron filings experiment had gone wrong.
    While the filings were distributed on the surface of the ocean, the Cyanophyta
    did respond by producing an algal bloom. Algae, too, fight for life and need oxygen.
    As a result of that battle to breathe, the oceanic ecosystem became hypoxic. An
    unsuspecting fish or mammal or other migrating marine entering these oxygen-starved
    waters ran into a blank wall of anoxia. A fish kill resulted. The excess of algae
    delivered death to the marine world. As well as using the oxygen, many blooms
    also produce toxic aerosols of very simple killer compounds. The experimental
    area became a giant grave, both above and below water.


    We don''t learn. Today there is to be the cure for climate change by the Harvard
    scientists involved in it; one of its donors is Bill Gates. The idea is to inject
    the upper stratosphere with a very fine dusting of calcium carbonate so that the
    carbon molecule can act as an aerosol capable of reflecting sunlight back into
    space. It is hoped the dust bath will create a reflective shield against sunlight—an
    umbrella something like the one forests provide.


    This project began with a test flight going by the name of the Stratospheric Controlled
    Perturbation Experiment, or SCoPEx. In 2021, the first balloon went up in northern
    Sweden, above the Arctic Circle at the Esrange Space Center in Kiruna. It was
    a feeler. Following the balloon trial, a massive injection of calcium carbonate
    is planned in a colossal effort to stop climate change in its tracks. The flaw
    in this experiment is that, for it to function as a shield, calcium carbonate
    will have to be released into the stratosphere indefinitely. Also, as that dust
    inevitably drifts down and hits the oceans, the carbonate will turn into carbonic
    acid, with the possibility of grave consequences to sea life.


    The objections to this operation come in words of warning such as “a moral hazard”
    and “termination shock.” Would the Brehon laws judge these experimenters?


    ![](img/9a73bd94214c184b1606db8dbb911966_129_0.png)


    # The Boreal Spring


    Plant aerosols are new to modern medicine and to science; I was the first person
    to publish tree aerosols, in 2000, in my book Arboretum America: A Philosophy
    of the Forest. They are not, however, new to nature. This chemistry has always
    been present in the plant world, a unique means of communication in which the
    speaker is a plant, and the speech produced is a biochemical sheet of molecules.
    Each molecular form has a meaning attached to it, provoking a response from its
    receivers, be they pollinator, fly, ant, mammal, fish, or another plant or tree—an
    entire forest ecosystem, if the call is loud enough, urgent enough.


    An aerosol is a balloon in miniature, a carbon mainframe that can carry other
    attachments, some big, small. These are molecules constructed by nature to respond
    to the flow dynamics of the atmosphere, one form of nature’s public transport
    system. To understand how they work, picture a child''s birthday balloon. Tethered
    to the child''s hand or wrist, the balloon floats over the child''s head, restricted
    by its string until it is blown away by the wind, or go in a moment of carelessness
    or curiosity. On release, there are always a few seconds when the balloon seems
    to hang there. Looking up at the colourful object, you wonder if it will ever
    take off. Then something happens and it goes. This “something” is the physics
    of flow, a phenomenon called “lift” in the aeronautical world. The action of lift
    depends on the design of the object, the force behind it and the current wind-speed
    properties of the atmosphere. The balloon takes off, floating up and through the
    air. All of a sudden flush of momentum carries the balloon sideways and out of
    sight.


    Plant aerosol molecules are invisible to the naked eye—too small to be seen—but
    then so are the sound waves of speech. The human voice can be measured by vocal
    wavelengths. Similarly, aerosols can now be tracked by displacement in cloud chamber
    experiments and identified or identified by gas chromatography.


    As these molecules are studied in greater depth, they have begun to reveal their
    diversity. Some aerosols are tiny, others have a symmetry of shape to save energy,
    many more are bulky by molecular standards. These last need to be staged like
    rockets, losing weight to increase the momentum at liftoff, to become airborne.
    Still others carry the molecular form of a bullet. The remainder float and dangle
    like kites, with the same ingenious saillike designs allowing them to float in
    moving air. These molecular kites come in two mirrored varieties; one design spins
    the kite to the left and the other to the right. As I explore more detail in the
    next chapter on forest bathing, the left-handed rotation is a better medicine,
    somehow a superior match for human health. The reasons for this are unknown.


    The aerosol language opens new windows into the workings of nature. All flying
    pollinators rely on aerosol messages from plants. The flower sends out this call
    from its female hub, usually in the form of a perfume, though one that may or
    not be identifiable by the human nose. A pollinator will have no trouble recognizing
    it, however, and will hurry to the source. Meanwhile, the flower will already
    switched on a series of guiding lights. One will show in polarized light, visible
    only to insects, while the other is a colour cascade of ultraviolet light. These
    brilliant systems act as a guide for the insects, first to geo-position the field
    and then track the pollen source. The results rest on your plates, food for thought
    and fork.


    Perhaps the greatest of the plant world''s chemical clarion calls, however, are
    the vernal language of the boreal forest system, the planet''s signal for spring.
    The boreal encircles the globe like a hat band or crown, a unique northern forest
    system spanning continents and islands and peninsulas. The boreal is the workhorse
    of the planet, maintaining the oxygenation of the atmosphere. It sits on a huge
    mass of frozen carbon. This carbon is ancient, frozen in the permafrost in the
    form of phenols, and has also been found in the seabed of the Arctic Ocean, as
    well as in rivers and lakes. The great lockdown of Arctic carbon amounts to approximately
    three times the present carbon in atmosphere. (The permafrost alone locks in twice
    the carbon in the atmosphere.) This sleeping carbon bomb is harmless so long as
    it stays cold, a condition that keeps reaction rates at an absolute minimum. But
    heat, ever more present in a changing climate, wakes up the phenols, which then
    break into massive amounts of carbon dioxide. Though the amounts are difficult
    to calculate, the carbon stored under fresh water will only increase this release
    as it warms up.


    The boreal forest system, then, is the ecological shield of our living, breathing
    world. Its dominant deciduous trees reach into the heart of the frozen north.
    They are the members of the willow family, Salicaceae. Of this tribe, the poplar,
    Populus balsamifera, is the most important. In the harshest growing conditions
    on Earth, they thrive and grow into colossal trees. These trees together manufacture
    and release a substantial plume of bioactive aerosols, which becomes a lifeline
    of vastly important medicine for the planet. This invisible shield protects all
    mammals and also acts as an initiator of spring activity.


    The winter canopy of the poplar is remarkable. Its growing tips bulge winter protection.
    The tenderest internal growth is wrapped in a bandage of furry brown bract tissue
    that is sealed with oleoresins and resistant to cold and ice. As the spring reaches
    the north, the growing tips are the first part of the tree’s canopy to receive
    heat. The oleoresin glue that holds the leaves and bracts in place is temperature
    sensitive. As the brown tips warm up, this glue sublimes to form fragrant aerosols
    and releases the apical tip, which begins growing by means of an internal clock
    of complex enzymes called dihydroconalones. Because the boreal grows in a wide
    green band around the top of the planet, the poplars all open together as the
