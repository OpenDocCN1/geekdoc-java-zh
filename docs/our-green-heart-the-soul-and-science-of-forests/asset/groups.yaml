    # The Bioplan


    Warnings of the problems of climate change first came to my ears while I was a
    student at University College Cork. Back then, winter kept me in the city and
    at the university, while summers brought me to the land, and Nellie and Pat''s
    farm. Having guided me for so long in the ancient ways of the Celtic culture,
    the valley elders began to turn to me for answers to certain situations after
    I began my university studies. The farmers taught me what they knew of the land
    and our relationship to it, but now things were changing. The seasons, the weather,
    the plants and the animals were not behaving as they had for millennia, so the
    farmers came to me for advice. They expected to know what was happening. They
    were sure I would have the answers.


    The signs of change were numerous, they told me. First of all, the salmon run
    was down; the fish had simply begun to disappear. The pattern of the clouds had
    changed. The blacksmith was shoeing and trimming the horses'' hooves earlier in
    the season. Some varieties of apples and cherries were not producing as expected.
    The farmers frowned deepening on their faces, and then they carried on with the
    list. The August winds were stronger, coming off the Atlantic together with rains
    that hammered the heavy-headed grains to the ground, ruining the oats and barley.
    These injured crops were difficult to thresh, and yields had come down. The farmers
    were very worried. The memory of the Great Famine was still alive around their
    turf fires.


    I began to understand that these were not isolated events that could be written
    off as outliers. There was a threat out on the horizon. I took to the library,
    my knowledge of biochemistry under one arm and of physics under the other, like
    a hen with two chicks. I studied the empirical formula of the photosynthetic reaction,
    a picture started to emerge in my'
  - '[PAGE 153]


    mind about the natural world. I examined the reaction formula inside out and upside
    down, and suddenly the picture snapped into focus. Could such a thing be possible?
    The books around me seemed to answer, “Yes.”


    One book, in particular, was a very short volume called Aids to Botany by H.J.
    Bonham. I''d used it for a tutorial I was doing with a family friend, a medical
    student who was having problems passing his biology exams. I picked it out of
    the library because Bonham had managed to reduce the biological world to simplicity.
    This little book had big ideas, and I still have it on my shelves.


    It was Aids to Botany that really helped me to realize that too much of the forest
    was coming down and the planet was heating up. The worries the farmers had discussed
    with me in Lisheen were all traceable to this bigger problem of sequestration—the
    increasing amplification of the greenhouse effect—in some way, shape or form.
    We were all in trouble, big time.


    After that day in the library, forests and trees held an even stronger fascination
    for me. Forests were the answer to the farmers'' questions and to the existential
    threat we all faced. They were the means through which we could entice the carbon
    out of the atmosphere and back down into the land. I had to learn more and more—everything
    science could teach me about the trees; everything the trees could teach me about.


    Forests hold a form of divinity. They are the Holy Orders of our solar system.
    All trees capture carbon and release oxygen. They conserve and power the blueprint
    of life. The cathedral of the forest connects to human consciousness with a healing
    wound. The language of a tree speaks to the primitive in humans to form a molecular
    marriage of identity. This union of people and trees is ancient; we are woven
    together in an invisible living tapestry. This is the basic connecting element
    of life, all life, on this founding planet, our home.


    When I was a young child in England and Ireland, the words of eighteenth-century
    Anglo-Irish philosopher Edmund Burke held a special currency in our household.
    There was a reverence to him and to how he conducted his life as a politician
    and everyman philosopher. Though I'
  - '[PAGE 154]


    was not always able to follow the discussion, it was clear to me that Burke carried
    a moral compass in his heart. Occasionally one of his ideas, overheard from my
    parents’ conversation, would cause my little ears to prick up. In particular,
    I have always liked Burke''s famous line: “Nobody made a greater mistake than
    he who did nothing when he could only do a little.”


    My solution to climate change, which I call the Bioplan, is based on the idea
    that every one of us on this Earth can do a little in the face of the coming global
    catastrophe. I have seen many people discouraged by the scope of the problem of
    climate change—sometimes pushed into complete apathy, inaction and depression.
    But each one of us can contribute something tangible to the living world, by offering
    another human being a word of encouragement, or a smile and a shoulder to lean
    on, or planting an acorn, or picking up a shovel and using it to plant one tree
    or a thousand. Before looking at such action, though, I''d like to take one more
    look at what we''re against.


    The facts are for all of us. The forest has come down all over the world. Too
    many trees have hit the ground and turned into product. This has been done by
    human hands, and along with the excessive release of carbon into the atmosphere,
    it has resulted in a warming planet, untold species loss, widespread food insecurity,
    and the partial or complete destruction of each and every natural habitat on Earth.
    In future, it will bring even more pain to bear. If unchecked, it will threaten
    the continued existence of the human species and life as we know it.


    It is understandable that the challenge of halting and reversing the climate crisis
    can seem overwhelming. But we made this problem. While recognition should bring
    humanity shame, it should also inspire hope: we can undo what we''ve done.


    First and foremost, we must protect what is left of the ancient virgin forest,
    the remaining trees that these forests are libraries of knowledge. Some of these
    super-species are thousands of years old. The rings tracking their growth over
    so many springs and summers are a record of the challenges of the trees’ past.
    Each genome of'
- md: '

    every ancient tree is unique and carries a chemistry and biochemistry of survival.
    This translates into a greater ability to withstand the ecological impacts of
    climate change, and it also gifts us with a pharmacopoeia of medicines for both
    the trees’ survival and our own—neuro-medicines, cardiotonics, anti-cancer compounds
    and synergists so sleek in their action they are the new wonder drugs of modern
    medicine.


    Second, each of us must do our “little” bit to reduce the carbon dioxide and methane
    in the atmosphere. We must plant trees, one per person year for the next six years.
    These newly planted trees must be protected and cared for; watered when dry, mulched
    to benefit their roots. They must be protected from mechanical damage. Six years
    of growth will produce decent-sized trees. Aiming for this, mass planting will
    have its thirst quenched by carbon gas. Planting a new international forest of
    approximately 50 billion trees, all species local to their geographical area,
    will edge the amount of atmospheric carbon down from present levels of 410 to
    412 parts per million into the high 300s and then, slowly, back into the moderate
    mid-300s. The reversal will be small to begin, with a slow rate of decrease is
    better than none. As the trees grow, their canopies, trunks and underground systems
    will contribute more and more carbon sequestration, and the rate of decrease will
    multiply. This will be the good news we all want to hear—that we are successfully
    stalling the actions of climate change.


    City and mini-urban forests are possible everywhere, and they offer benefits beyond
    carbon sequestration. The trees groom the polluted air, cleaning it and making
    it sweeter. These new plantings will be standard trees, not the grafted specimens
    as if they are annals by condo boards and business-improvement associations. Large
    canopies that shade streets and city centres will provide essential cooling for
    the future. The arboreal shadows cast and the greenery displaced by such trees
    also reduce anxiety in the young and the old. I believe they are the urban anchors
    for the landscape of memory we form in childhood, which becomes the backdrop of
    our later dreams and desires, us mental stability for all our lives. These trees
    send a message of peace to reduce crime, and their aerosols of relaxation aid
    in the reduction of asthma, stress and blood pressure.


    In the countryside of the Western world, where once-dainty farmers'' fields have
    gone oceanic in size, renewing the hedgerows and forested fences will once again
    guard the soil from erosion, and harbour boundaries of wildflowers and berries
    to maintain the birds and bees. Farmers and hedgerows feed the future, replacing
    the industrial farms and hedge funds that feed only famine.


    Third comes education. The urban populations of the world need to be reminded
    that forests were in everyone''s past. People must go outdoors and meet the trees
    standing in nearby forests and parks. They must also go to the library and examine
    a guidebook about trees. Remember, the trees each person plants and protects be
    local native species. Learn how to collect seeds from them. Learn the tricks of
    germination and growth. Children are fascinated by these processes, so work to
    introduce these ideas into your local schools. Write letters to these institutions
    and the bastions of higher learning. Ask for help. Go to a farmer or a gardener
    for such help and they will be your friends.


    When in doubt about what to plant, look to the oaks. A fine beginning in the fight
    against climate change lies with the Quercus of the Fagaceae family. From some
    six hundred species of deciduous and evergreen oaks across the world, there are
    one or two oaks native to practically every country—some countries have many more.
    Regardless of type, oaks carry many advantages as a first species to be planted
    in the global Bioplan.


    Unlike many other species, oak trees will tolerate lime, provided the soil is
    deep and rich. They produce acorns, for sale in markets around the world, meaning
    they are also anti-famine trees. Acorns can be ground into flour, roasted peanuts
    or just simply baked, though some species need the addition of potash or potassium
    hydroxide to leach out the bitterness of tannins.


    The anatomy of the oak is important too. As the tree ages, the horizontal branches
    extend towards the ground, where they take root and spawn secondary canopies into
    the open edge of the drip line. This means mature oaks need much more ground than
    other trees, but their considerable canopies make them extremely stable in a windstorm,
    and their horizontal pattern of growth further buttresses their branches. This
    will be even more important to withstand the newly hydrated atmosphere of climate
    change, which will bring more violent ice storms and very wet snow loads, from
    large and heavy snowflakes. The oak''s roots, too, can withstand flooding because
    of their size and extensive anchoring in the subsoil. Oaks are also extraordinarily
    drought-tolerant. A well-grown tree can be expected to live approximately a thousand
    years.


    So, how do you plant an acorn?


    First, you during midsummer, start looking for healthy, mature oaks wherever you
    live. Keep an eye on the tree and visit it as often as you can. Take note of the
    first mature acorns that land on the ground around the tree, but ignore them,
    because the first acorns to fall are often ones that have been aborted because
    of disease. Ignore, too, green acorns, which cannot be expected to grow because
    they''re not ripe. An acorn is ripe when it is brown, or sometimes black; an oak''s
    acorns will ripen from August to December in the northern hemisphere.


    Prior to planting, which you can also do from August to December (as long as the
    ground isn''t frozen), remove the cup. The cup scar on a healthy acorn should
    be lemon-coloured. Any that have been attacked by weevils or otherwise damaged
    will not grow. If you want to double-check, such ducks float while their more
    sound, heavier counterparts will sink to the bottom of a bucket of water.


    Place the healthy acorn on its side and cover it with a quarter inch of soil.
    Like grains of wheat, acorns have no endosperm. Instead, the tree direct its food
    into two baby leaves, called cotyledons. After planting, it takes three to five
    weeks for the acorn to send up a good green shoot. At the same time, an equally
    strong root plunges down into the soil. The tree also needed the sun to become
    a proper carrot. These saplings and our children will go in hand into the future.


    ![](9a73bd94214c184b160db8db911966_159_0.png)


    In the early 1970s, I accepted a fellowship to the University of Connecticut to
    study the effects of radiation on biological systems. My work there was fascinating
    in itself. But like my cat, Boots, I pray to a severe strain of curiosity. So
    I kept a keen eye on the comings and goings in the labs near mine and stuck my
    nose in whenever something happened. At one point that the team in the lab next
    door managed to pluck a single cell from a carrot, Daucus carota, and pop it onto
    the surface of a “soil” medium of agar-agar. Originally hailing from the ocean
    as mucilage, agar-agar still carries electrolytes from its origins. The little
    orange spot of the single carrot cell expanded, and eventually grew into a full
    carrot. The research team did not know it at the time, but their work represented
    the humble origins of stem cell research in the plant world.


    What this little bit of research revealed to me was that a plant cell containing
    DNA has all the tools to replicate itself. In the lab, the cells will multiply
    when they have fed the right range of electrolytes, or macro- micro-elements,
    which act as catalysts to growth. The carrot cell also needed the sun to become
    a proper carrot, because it had the photosynthetic apparatus in place. A carrot
    cell will always be a carrot cell, but given the right conditions, it can also
    become a mature, orange-red vegetable sitting on your dinner plate.


    When I put on my medical biochemistry hat in the wake of this discovery, I realized
    something very simple: if a scientist can turn a Daucus cell into a carrot, then
    a kidney cell or a skin cell, or a tooth cell, could also be turned into the body
    part it was harvested from. The agar-agar could be substituted with Ringer’s solution,
    a liquid containing lots of electrolytes, to initiate and fuel the growth of mammalian
