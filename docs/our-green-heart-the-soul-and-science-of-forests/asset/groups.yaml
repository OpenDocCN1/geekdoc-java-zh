    # # The Hundred-Acre Mistake


    Thirty-odd years ago, about a decade after settling on our farm, my husband, Christian,
    and I bought a bit of mistake. It was about a hundred acres of land bordering
    our farm, and we bought it for two reasons: privacy and isolation.


    Once, the land had been two sheep farms. There were also some remnants of another
    smallholding, but that may have been just my imagination. In any case, there were
    two root cellars and a small splash of green in the ruins where there had once
    been some, blades of grass and a fine crop of weeds. This was the favourite nesting
    and resting ground of a small herd of white-tailed deer.


    Where there deer, there are men. Where there are, there are hounds. Where the
    two-legged join forces with the four-legged, there are guns. Some locals, and
    others not so local, considered this piece of land we''d bought to be their killing
    ground. In the dark days of November, during hunting season, a pack of hounds
    flushed out any kind of life form on my farm and the property across the road.
    Having performed their duty, many of the dogs were abandoned after the hunt, and
    I was left to feed and water these creatures and attend to their frozen penises
    with antibiotics.


    One November morning, a wounded deer came to my door. It was a doe, suffering
    terribly. She had been shot in the belly and she was winding her intestines around
    one front leg, like a spool of cotton, as she walked. The creature was in absolute
    agony. She came up the steps at our front door and stayed there to get my attention.
    I felt as though I could hear her ask, “You’re trained as a surgeon. Can you fix
    me up?” I looked at the intestines and said, “No, I’m so, so sorry. To my eternal
    sorrow, I can’t!” I will never forget this incident and the horror of it.'
