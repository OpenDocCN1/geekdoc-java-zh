    they quiver in the slightest murmur of a breeze. This action is described in many
    languages across the world. My mother would also have laughed with friends and
    family over the unique Celtic word, cnámhseala. Used when the rising of the wind
    off the sea through the movement of aspen leaves, the word describes an old woman
    stirring and rattling about in her bones. The aspen tree carries a canopy of egg-shaped
    leaves that are more transparent and thinner than the leaves of other deciduous
    trees. Each silken leaf hangs by a petiole that is longer and more delicately
    designed than the leaf stems of other trees. The overall design gives rise to
    that early and vigorous movement in the slightest of winds. The tree was the weather
    vane of the Celtic and Chinese civilizations. In the modern world, the aspen’s
    leaf design could be copied as a new kind of green windmill. Designs in nature
    are already tried and true, carrying perfection.


    I did not learn the Ogham alphabet, the first written language of Europe, until
    after my mother’s death, but among the many surprises it gave me was one about
    the tree she so dearly loved. In the Ogham script, hammered into my mother a child
    as it was hammered into me, the aspen is the letter E. It is Eabha, or Eve. Not
    just my mother’s tree, but a tree for all mothers, for all women—holding immense
    strength in its apparent fragility, holding the knowledge and ability to carry
    us into the future, holding the blueprint for life.'
