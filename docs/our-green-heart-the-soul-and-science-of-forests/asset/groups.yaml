    # Forest Mast


    Mast is the old word for food that dates back to the earliest years of the human
    family, found in Sanskrit and in Old Gaelic as meas. Mast comes from the countryside.
    It is a gift of nature. And sometimes, only sometimes, when the pressure points
    are perfect, nature produces an extra-fruitful year, so that all creatures in
    the web of life obtain an excess of food. This is called a mast year.


    That such year is upon us is first noticed in the forest. In a mast year, trees
    of all arboreal families hear the call. Each tree grows a larger canopy of leaves
    to fulfill the promise of the harvest ahead. Then the entire forest, as a community
    of care, produces seeds, nuts, nutlets and acorns in excess. It is a crop representing
    a large expense of time and energy, and its gift is a boon to every living thing
    in the forest and beyond.


    The seeds are filled with the riches of first-class plant proteins, carbohydrates,
    essential fats, and the phytochemicals that are precursors to vitamins and plant
    hormones. Minerals are also present within the seed''s testa, or outer coat, as
