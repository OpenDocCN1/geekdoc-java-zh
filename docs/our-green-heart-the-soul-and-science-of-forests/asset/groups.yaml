    base of buildings that are constantly wet. It is possible, then, to take a specimen
    of Chlorella and place it next to one from a tree in a Petri dish. If you do,
    the two seem to be so different it is almost impossible to believe the tree came
    from the green, microscopic speck beside it.


    Trees have form. They are smart. They behave like computers and seem to have some
    kind of brain. It is possible a tree''s brain is like a skin of cambium tissue
    that entirely encloses it. There are hormones in trees that are structured like
    human hormones. Trees produce antimicrobials called phytoalexins to fight infection.
    Trees listen. Trees produce infrasound. Trees conduct the business of their lives
    on a quantum level, confounding the most fundamental principles of physics. They
    are staggeringly complex, while Chlorella, to put it mildly, are not. How, then,
    did the one emerge from the other?


    The lectures I prepared and delivered on behalf of Dr. Roberts covered much of
    the answer to that question. But they were missing a crucial piece, one that remains
    missing to this day. In my second year of university, I heard my professor say
    something that left me breathless: “Forensic botanists and archaeologists are
    looking for the connecting proto trees between the ferns and the conifers.” Basically,
    what he was saying was that the species that bridged the gap between the 400-foot
    tree ferns and the ancient trees were still unknown. The origin of the trees''
    complexity was an unfinished puzzle.


    I hit the library immediately, determined to find that missing link amongst the
    leather-bound volumes that lined the shelves towering over my head. I went back
    to Victorian times, every time, Tom, Dick and Harry with money in their pocket
    went plant hunting across the world...Nothing!


    Well, maybe nothing. I did come across the weird and the wonderful. One memorable
    tree was found inside an extinct volcano in southern Angola and near Walvis Bay
    in Namibia. The Welwitsch mirabilis of the lonely Welwitschiaceae family looks
    like a very large cabbage that has been in a nasty fight. From a distance, it
    could easily be mistaken for a heap of rubbish in the Namibian desert even But
    such candidates did not tempt me to believe they held any meaningful clues to
    their ancestry. Perhaps, today or tomorrow, some wandering botanist will pick
    up a piece of a fossilized tree from a long-forgotten forest and find the final
    answer.


    Trees set the stage for the advent of the human family. Forests brought the atmosphere
    of the planet into a balance that could sustain human life. Of the trillion trees
    on planet Earth, many have not been fully identified. Botanists gueststimate that
    around 9,200 species are as yet undiscovered—most existing in hot spots of global
    biodiversity—a number they believe they may have underestimated by as much as
    14 percent. There are only 73,300 families of trees on Earth. How could we have
    been so careless with what is so important to us all, I don''t understand, but
    the answers are still out there, waiting for a new set of eyes.


    ![](img/9a73bd94214c184b1606db8dbb911966_70_0.png)


    # The Wrong Trees in the Wrong Places


    Around the time Queen Victoria came to the throne in 1837, a pastime came into
    fashion. As the aristocracy had already benefited from the bounty of slavery,
    earning fortunes off the misery of others without lifting a finger, they also
    became adept at weaning. Young men yawned their way through Eton and Oxford’s
    Balliol College. Still yawning after graduation, they were fit for only one career,
    as far away as possible from the country estate—sent to Britain’s colonies to
    become remittance men. On their travels in their new climes, to ward off all yawning
    boredom, they collected plants, sending the best of their sampling back home.


    Trees from China and Japan came into high fashion. English estates were overrun
    with camellias, rhododendrons, Cryptomerias, and cedars from the Atlas Mountains
    and Lebanon. The search extended to Australia, and eucalyptus went home in bulk.
    Then the dainty trees from Chile, the monkey puzzle, Araucaria araucana, and climbing
    gazanias carefully housed in vast glass conservatories. Finally, the flood of
    expats hits North America, dragging redwoods—Sequoia sempervirens, the bigger
    better—back to the larger estates. The bluebloods stood for their portraits next
    to trophy trees wearing cavalry thrills, filled with the afterglow of the hunt.


    When the settlers in turn became wealthy, the flow of trees became reciprocal.
    They began importing the Scotch pines, Pinus sylvestris, from their home turf
    and planting them all over North America, from garden to ditch and back again.
    With industry and international trade revving up, plant nurseries began shipping
    trees back to fill in holes in the landscape.


    These exported trees, mostly pines, came largely from the west coast of Canada,
    where they enjoyed an excellent reputation with the Indigenous Peoples. The shore
    or lodgepole pine, Pinus contorta, was planted by the millions around Irish lakes
    and estuaries. Then the Sitka spruce, Picea sitchensis, was similarly sown, an
    effort fuelled by the belief that what was good the seashore of western Canada
    would also be good for Ireland. Eventually, Irish children assumed they were witnessing
    their own native forests growing around them.


    The native species these transplants replaced were the trees, or sacred trees,
    that represented the medicine, health and wealth of the Celtic culture. As the
    forests were wiped out, the ancient wisdom attached to them went too, along with
    the Gaelic language. Today, fewer than a handful can recite the alphabet of trees
    called the Ogham script, still visible carved into stones in Ireland.

