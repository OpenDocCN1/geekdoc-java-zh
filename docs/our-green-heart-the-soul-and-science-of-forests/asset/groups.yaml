    fix is vast, and it cannot be sped up or subverted. Science has never understood
    or fully described the pattern language of a native virgin forest anywhere in
    the global garden. Therefore, such a community is impossible to replace exactly
    as it is. We have to wait for something new, while never fully grasping all we’ve
    lost.


    It is a certainty that we depend on forests that are not, as yet, understood;
    in this book I sketch the outlines of several still-mysterious interdependencies.
    Native forests show many remarkable'
  - '[PAGE 44]


    similarities to the human condition, and this mirroring can provide valuable hints—occasionally
    crystalline glimpses—at the ways these ecosystems affect human health. A fascinating
    example is endogenous fungi, which are a corollary to the human microbiome. As
    I mentioned in an earlier chapter, these fungi live within the internal matrix
    of the tree,['' in the roots, trunk and leaves in the same way the human digestive
    system is home to bacteria. In both cases, an enzyme conversation takes place—in
    the tree and in the gut—in order to convert the incoming traffic of food into
    usable constituent parts. Life itself depends on harmony of the bee and the small.


    Less is known about the forests'' relationships to fungi than about the bacteria
    of the human microbiome, but these fungi are nevertheless used to produce complex
    modern medicines that hold the destiny of the human family in one. One example
    would be the extracts of the hawthorn, *Crataegus*. Cardiotonics, such as Curtacrac,
    *Crataegus-Kreussler and Esberic*, open up the left ascending coronary artery
    of the heart. Another of these forest medicines is a sugar called xylitol from
    the birch, *Betula*, which easily early childhood earache. It is sold as a chewing
    gum. It seems that the older the forest, the greater the treasury of medicine.
    This comes from opportunity and design.


    Birds, mammals, wind, water, temperature, and the acidity or alkalinity of the
    soil and atmosphere can all open doors to spores, basidpores or the more complex
    ascospores—balls of genetic material similar to seeds. Consequently, many fungi
    travel up the xylem and down the phloem plumbing of a tree at any given time.
    Strangely, the number seems to be constant for each specific species of tree.
    In, in case of the pine family, *Pinaceae*, there are sixty-four species of fungi
    hiding in the tree''s belly. The oak, *Quercus*, of the *Fagaceae* family, hosts
    a mere fourteen.


    Endogenous fungi are not always pleasant visitors. Sometimes they concoct their
    own chamber of horrors, fulminating biochemical war on their host. This too is
    of interest to science because such toxins can come in handy to treat and kill
    cancer cells. A known anti-cancer drug called'
  - '[PAGE 45]


    paclitaxel (sold under the brand name Taxol) was isolated from fungal-infected
    hazelnut, Corylus, trees.


    The discovery of the hidden habitats of these fungi is also quite recent. They
    add considerable knowledge to new disciplines in medicine, of course, and physics
    is currently exploring their finer action. These associations also express themselves
    biochemically, in the release of aerosols. Science studies aerosols by means of
    cloud chambers, one molecule at a time. In forests, labile molecules (which I
    discuss in more detail later) are dispersed in the airways and outwards into the
    greater atmosphere, becoming the ecological shield of a living world.


    When death comes to a tree in the forest, life changes for the fostered fungi
    living inside it. The spreading fingers of hyphal threads come to a halt as a
    whisper passes throughout the fungal body, called the mycelium. A crisis takes
    place. The genetic order immediately changes, and the asexual hyphae emerge from
    the ground or as a visible bract on the tree. From the body of the mushroom, spores
    are released that can travel on animals or birds, or on the wind. Dispersed by
    the millions and trillions, some will find a niche in a young tree, and the cycle
    of life begins again.


    Anyone who gathers their own firewood for winter can read the colours in the logs
    they''ve split and identify endogenous fungi. Once the wood has been cut and air-dried
    in store lengths, and then split further and stacked, an infinity of colours appears
    on the opened vertical cuts—though sometimes the wood needs to be left in the
    sun before the colours appear. Then, overnight, a rainbow of deep reds, pinks,
    purples, blues, yellows and luminescent greens arises from the rough surface as
    if by magic. The slashes and shades are like a painting by Pollock or Riopelle,
    nature''s originals on the adventure of creation.


    Then, sometimes, in the warm, humid days of autumn, the wood seems to grow together.
    Each log clings on its neighbour, attached by something elastic that forms a matrix.
    These are the digestive juices of the composting bacteria in action. Carbon is
    their king. They leave nothing behind except itself.'
