    # My Mother’s Tree


    Every time my mother and I passed a trembling aspen, Populus tremuloides, she
    would cry out in delight. “Look there! No, over there, Disie! In the hedge—it’s
    an aspen,” she would say, pointing and nodding in the direction of the tree, which,
    when I followed her gaze, was always a humble, anemic specimen looking as if it
    needed a blood transfusion. “Isn’t it beautiful?” she would ask, her voice full
    of wonder.


    The trembling aspen is definitely not beautiful, not to my eyes at least. But
    something of my mother’s passion had rubbed off me. Over the course of my career,
    I’ve always paid attention to the tree, and as I have come to understand it more
    deeply, I have discovered that it is really remarkable.


    P. tremuloides is a survivor. To fully appreciate its tenacity and genius, though,
    a person would need X-ray vision. The roots of the aspen clones underground, showing
    only the odd “finger” to those above—a slick white piece of root coming up for
    air. In a season or two, it produces a shoot. Before you know it, a gaggle of
    aspen trees stands around the first.


    In my orchard, I have a single row of experimental Hog peas that I have produced
    by crossing. They are able to begin growing in the coldest spring, a frost resistance
    valuable in a changing climate because the tree can bring its crop of fruit to
    maturity early. However, I suspect that my experimental ground has an underlayer
    of aspen, waiting to get the better of me. I have seen its first white fingers,
    here and there.


    The trembling aspen’s preferred method of reproduction is asexual; every single
    cell of each individual group of clones is identical. The tree can reproduce itself,
    over and over again, and the genome is always the same. As it is in most human
    cells, the DNA of each aspen cell is diploid, containing two identical sets of
    chromosomes, which means you can'
