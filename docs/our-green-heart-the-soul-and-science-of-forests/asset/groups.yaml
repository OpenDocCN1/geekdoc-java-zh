    加州红杉（Sequoia sempervirens）和巨型红杉（Sequoiadendron giganteum）曾是这道加州天然防火墙的支柱。树木是浓缩的水柱，这些巨树拥有坚硬、纤维状、深沟纹且鳞片状的脊部，内部由活细胞形成的形成层皮层，它们不仅能蓄水（从地面并从海雾中吸收水分），还能抵御火灾。这些树保护了加州免受火焰侵害近近四千年，直到它们开始倒下。


    全球范围内，这种疯狂的状况持续至今。森林被砍伐，树木被移到另一个地方，完全没有考虑这对两个地区居住的人、植物和动物的后果。幸运的是，树木给了人类大家这份最持久、最乐观的礼物：种子。通过在所属的地方种植正确类型且具有正确遗传来源的种子，可以修复原生森林。当我们错误的地方种错了树时，我们就像是在希望并祈祷一头驴能赢得肯塔基德比马赛。它不会的——无论现在还是将来。


    ![](img/9a73bd94214c184b1606db8dbb911966_75_0.png)


    ## 我们仍然不理解的


    我有一个研究花园，那是我进行植物学实验和观察的地方，我在那里研究植物的各种隐藏性状。我还有一个自己的植物园，根据定义，这是一个为了科学和教育目的而栽培和生长树木、灌木和草本植物的地方。植物园通常隶属于大学或政府机构。不幸的是，这些乐趣在现代已经失去了风味，并变得过时了。我将研究花园和植物园都留在我位于安大略省的家中，可以说，它们是独立的，仅归我所有。


    我的植物园就像诺亚的方舟。我正尝试在重重困难和资金匮乏的情况下，维护并保护树木中一些最有价值的遗传特性。我使用某些标准，并遵循严格的议程。我实行隔离措施。一切都是从种子从头（de
    novo）生长的，即使是最大、最高的树木也是如此，以确保没有植物带着土壤进入花园区域。没有任何接穗材料能通过我的大门。接穗可能是隐藏的破口，携带病毒或细菌，当树受到压力时它们就会显现。我只寻找稀有和濒危物种。有时我想，它们也在寻找我。


    一旦我得到了我的目标（目前，我正在寻找最接近 *Carya tomentosa*，即假壳核桃或山核桃木，它曾原产于加拿大东部南部，用于保存食物），我就开始工作。我将种子放入试验区。随着季节的更替，我注视并观察。我寻找那些能让成年树安全跨越并超越气候变化问题的特征——例如抗霜性、抗旱性，以及对极端温度的耐受力。所有幼树在它们能承受的极限上表现出差异。


    最后，由我决定谁生谁死。我选择优中之优者，让他们延续作为树木的事业——为世界提供可以赖的植物蛋白、强度、阴凉以及大自然的通用食物。这是我实地工作的核心焦点，但在寻找这些力量和适应能力的迹象，以及阅读其他专注的植物学观察者的著作时，更多的发现浮出水面。同样重要的是，其他问题也之而来。森林给科学带来了许多谜团。它们是巨大的、协作的生命体，充满了不可见的相互关系，并以远超我们的时间尺度在运行。科学家可以看到并记录他们眼前的事物，但那些看不见的事物呢？自然界是复杂的。有一系列永无止境的问题仍待解答——其中之一是在大气二氧化碳水平达到灾难性程度之前，如何与之达成和谐。我相信自然掌握着这个问题的答案。


    树干的多样性及其树皮覆盖的差异是显而易见的。树皮表面的粉末状周皮则并不明显，尽管它至关重要。周皮就像是由树皮的上皮细胞形成的干燥皮肤，它有时会像滑石粉一样变成粉末。然后，在冬天，它像一个反射器，防止一种被称为“西南损伤”的树皮冬季损伤，因为那是树干下西南部树皮产生的裂纹。周皮可能会因为地衣的存在而增强，或者——（等等，这里的
    OCR 乱码了，让我仔细重新处理）。

    '
