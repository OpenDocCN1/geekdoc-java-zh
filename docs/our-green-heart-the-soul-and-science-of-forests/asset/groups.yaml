    # Forest Bathing


    Step into an ancient forest and go slowly. The experience will engulf you, body,
    mind and soul. The feeling is unique, down to the tingling in your fingertips.
    It''s as if you''ve been compressed as a human being, telescoped into your own
    mortal coil, where the big and the small meet. Stand still. Stand tall. And feel
    the exchange of consciousness in this place, a lifeline of connection, beyond
    language.


    All five senses are stimulated when you stand in a forest. The process of silent
    immersion increases the level of cortisol in the bloodstream, which in turn switches
    the senses into a state of high alertness. The initial strangeness of the feeling
    is followed by the overwhelming sensation of being alive, being surrounded by
    life. The combined effect is an energized calm, an inner stillness charged with
    meaning.


    Focus on each sense in turn, starting with sight. Your visual cortex registers
    an ordered disorder in the branches overhead. Nature’s masterpiece painted in
    green, a pastoral passage to the sky, swamps every sightline.


    Hearing comes into play, with the fragile sweep of leaves in the canopies. There
    are no echoes in this verdant palace; sounds are muted and absorbed, clotted by
    the suberin within the trees—a substance that is an attenuator, pulling out sound
    of the air. Suddenly, a songbird calls from the timber nave. The air holds all
    the notes in place, hoarding like treasure. After this song, the stillness returns,
    threaded with silence. Then slowly, slowly, the web of infrasound, or “silent”
    sound, with its log, loping waves, reaches you, perceived with the chest rather
    than the ears. You breathe deeply, clutching it before it has gone.


    As you begin to walk, smell rises with each footstep. It swirls up from the dark
    melanin in the skin of the forest floor. Breaking loose from their underground
    home, the odors pierce the air with the rich fruitiness of sweetened decay. The
    smell is so heavy you feel as though you could brush it with the tips of your
    fingers. It smells good enough to eat.


    That''s what tastes ride on the forest air, lush with lactones, travelling the
    wet passages of the mouth and nose, crowding the epiglottis, pressing on oral
    glands to express digestive juices. You enjoy the full taste of the trees, before
    swallowing it whole, a forest tisane, broken down by stomach acids, that travels
    throughout the body. There is a mix ‘n’ match in the bloodstream as the forest
    changes the biochemical action of the body.


    You touch. Maybe you pick a stick, leaf, nut or pine cone. Bacteria are exchanged
    in an instinctive greeting from the wild. Touch is the universal language of love,
    a silent binding. Hold you the pine cone or walnut for a time, slide it into your
    pocket, where later you will use it as a worry piece. Or a child is the one to
    touch, picking up such a treasure and adding it to their collection. Medicine
    that protects life is, always been there. The pressure of a child''s fingers releases
    the elagic acid from the husk of the walnut and early childhood cancer is held
    at bay.


    Forest bathing has been a medical practice since ancient times. The great civilization
    of the Celts, which at its peak extended to the middle of Asia, had its own prescription
    for forest bathing codified in the Brehon laws, which provided the forest with
    more protection than any law does today. The Celts knew their primary pharmacopoeia
    was the forest. The Indigenous Peoples of North America maintain a sacred form
    of forest bathing through their Sweat Lodges, ceremonies of complexity where nature
    is revered. Indeed, practices of forest bathing can be found in almost all cultures
    across the world.


    Today, the Japanese lead the way. One of the centres of forest bathing, or shinrin-yoku,
    is Mount Kurama, north of Kyoto. On the mountain''s verdant shoulders, the native
    forest exposes its extraordinary biodiversity for the population to enjoy. As
    soon as children can walk, they join the crowds walking in the forests, alongside
    their parents and grandparents, whose continued agility is a testament to the
    benefits of the practice.


    The forest bath itself begins with a temperature-sensitive plume of aerosols,
    primarily released by trees. These medicinal molecules then travel the airways
    of the forest. Though the heavier molecules originate higher up in the canopy,
    the lightweights sometimes begin as low as the forest floor, moving around the
    trunk with ease and up into the branches. Downward pressure from the atmosphere
    confines the more labile, which then reflux into the arb canopy again and again.
    Aerosols are released from the trees in an anhydrous form, meaning they contain
    no water; they become hydrated by morning moisture, easing their entry into the
    human body. Many trees also produce an additional biochemical, a fixative that
    acts on the newly released aerosol, gluing it to the skin of the bather. (Think
    of the fixatives commonly used in the perfume industry to make scents last longer.)


    From a medical and biochemical point of view, something strange happens in this
    exchange between the trees and the human body. The forest vapour holds two forms
    of the same medicine; nobody yet knows there are two. Each of these forms is the
    exact image of the other, with one vital difference: as light passes through them,
    one form will rotate the beam to the right—what an organic chemist calls dextrorotation—and
    its twin form will rotate light to the left, a levorotation.


    The human body is a finicky thing, and the levorotatory medicine turns out to
    be the optimal choice for healing. This left-handed molecule seems to fit the
    jigsaw patterns of the pathways of the human body in a more efficient manner.
    Much to the chagrin of the corporate pharmaceutical world, the levorotatory molecules
    are difficult and very expensive to manufacture in a laboratory. On the other
    hand, the trees of the global forest continue to supply these medicines into the
    atmosphere for free.


    All trees take a somewhat similar form, that of a lollipop, a botanical architecture
    that enables the plant to act as an applicator for medicine. The trunk, or bole,
    extends the canopy up into the air, allowing for atmospheric exchange. The reason
    why mature trees are so tall is that their business of gas exchange happens above
    and around the crown. In the

