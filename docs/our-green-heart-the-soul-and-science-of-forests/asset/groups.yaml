    经常潮湿的建筑基座。那么，可以取一个小藻的样本，将其放在培养皿中，与一棵树的样本放在一起。如果你真的这样做，两者看起来如此不同，以至于几乎无法相信那棵树是来自旁边那个绿色的微小颗粒。


    树木有形态。它们是智能的。它们的行为像计算机，似乎拥有某种大脑。树木的大脑可能是一层完全包裹它的形成层组织皮。树木中激素的结构与人类激素相似。树木产生称为植物抗毒素的抗微生物物质来对抗感染。树木在倾听。树木产生次声波。树木在量子水平上进行着生命的活动，困扰了最基本的物理原理。它们复杂得令人惊叹，而小藻，说得委婉，并不复杂。那么，一个是如何从另一个演化而来的？


    我代表罗伯茨博士准备并发表的讲座涵盖了该问题的大部分答案。但它们缺少了关键的一部分，而这一部分至今仍然缺失。在大学二年级时，我听教授说了一句令我屏息的话：“法医植物学家和考古学家正在寻找蕨类植物和针叶树之间的连接性原始树木。”基本上，他的意思是，跨越400英尺树蕨与古树之间鸿沟的物种仍然未知。树木复杂性的起源是一个未完成的谜题。


    我立即冲向图书馆，决心在那些排列在我头顶上方书架上的皮装书中找到那个缺失的环节。我每次都回到维多利亚时代，汤姆、迪克和哈里兜里揣着钱在世界各地寻找植物……一无获！


    好吧，也许并非无获。我确实遇到过奇异而奇妙的事物。一种令人记忆的树是在安哥拉南部的一个灭绝火山内以及纳米比比亚的沃尔维斯湾附近发现的。孤独的卷兰万寿植物（Welwitsch
    mirabilis）看起来像一棵经历过激烈战斗的大大白菜。从远处看，它很容易被误认为是纳米比亚沙漠中的一堆垃圾。但这些候选者并没有让我相信它们拥有关于祖先的任何重要线索。也许在今天或明天，某位流浪植物学家会从一片被遗忘的森林中捡起一块化石树木，并找到最终的答案。


    树木为人类家族的出现搭建好了舞台。森林将行星的大气带入能够维持人类生命的平衡状态。地球上数万亿树木中，有许多尚未被完全鉴定。植物学家估计，约有9,200种物种尚未被发现——大多数存在于全球生物多样性热点——他们认为自己可能低估了高达14%。地球上只有73,300种树科。我不理解，我们怎么能对我们所有人如此重要的东西如此如此疏忽，但答案仍在那里，等待着新的发现。


    ![](img/9a73bd94214c184b1606db8dbb911966_70_0.png)


    # 错地方的错树


    在维多利亚女王于1837年登位前后，一种爱好开始流行。由于由于贵族阶层已经从奴隶制的丰饶中获益，不费吹灰之力就从他人的痛苦中赚取财富，他们也变得擅长教养。年轻人在伊顿学校和牛津大学的巴利奥学院打着哈欠度过学业。毕业后依然打着哈欠的他们只适合一种职业，尽可能远离乡村庄园——被派往英国的殖民地成为汇款员。在他们新气候地区的旅行中，为了抵御所有的无聊和哈欠，他们收集植物，将最好的样本寄回国内。


    来自中国和日本的树木变得非常时尚。英国的庄园遍满了茶花、杜鹃、日本杉以及来自亚特拉斯山脉和黎巴嫩的雪松。搜索延伸到澳大利亚，桉树大批运回。然后是来自智利的纤细树木——猴果松（*Araucaria
    araucana*）和爬地黄菊被精细地安置在巨大的玻璃温室里。最后，移民浪潮席卷北美，将巨大的红杉（*Sequoia sempervirens*，越大越好）带回更大的庄园。这些贵族们站在装饰着骑兵战利品的战利品树旁拍摄肖像，那里充满了满了狩猎后的余晖。


    当定居者们也变得富有时，树木的流动变成了双向的。他们开始从家乡进口欧洲松（*Pinus sylvestris*），并将其种在整个北美，从花园到水沟，再往复。随着工业和国际贸易的加速，植物苗场开始运输树木以填补景观中的空白。


    这些出口树木（主要是松树）大部分来自加拿大西岸，那里在当地人中享有极盛誉。海岸松（或扭叶松，*Pinus contorta*）在爱尔兰的湖泊和河口周围种了数百万株。然后西云杉（*Picea
    sitchensis*）也同样播种，这种努力源于一种信念：加拿大西岸好的东西对爱尔兰也会好。最终，爱尔兰的孩子们认为他们正在目睹自己的原生森林在周围生长。


    这些移植物所取代的本土物种是“比树”，或圣树，它们代表了凯尔特文化的医药、健康和财富。随着森林的消失，附着在上面的古代智慧也随之消失了，同样的盖尔语也是。今天，只有少数人能背诵被称为奥姆字母（Ogham
    script）的树木字母，这些字母在刻在爱尔兰的石头上依然可见。

