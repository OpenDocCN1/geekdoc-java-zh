    mile. The community of a forest, any forest anywhere, has a will of its. Somewhere
    in the genetic pool of knowledge deep within a tree, there is an understanding
    of future weather patterns. The accuracy of this understanding is a life-or-death
    matter for a tree and, consequently, for a forest ecosystem. It provides the base
    of information from which the tree must decide when and where to expend its most
    precious resources, trees make judiciously, even ruthlessly when necessary. Under
    stress, trees produce more pollen; if the getting really tough, they use a biochemical
    axe, aborting seeds, leaves and even branches.


