    In mid-career, Albert Einstein began to grumble about electrons. He called their
    behaviour “weird” and shook his head at their antics. Electrons, of course, already
    been described in physics—elementary particles that carry a negative charge. Each
    of Earth’s elements is blessed with a cloud of electrons. Their number may change,
    but their behaviour was believed to be constant and predictable. That is, until
    one day a few years ago, in a lab in Berkeley and subsequently in other labs,
    a single electron managed to be in two places at once. All the time measurements
    in these experiments were judged to be correct, despite the fact that the feat
    seemed to be impossible. These scientists performed the act of bilocation. One
    little electron jumped the great barrier of entrenched belief and had to rest
    in the imagination. Though it wouldn’t have surprised the seenchaí, the discovery
    was new and novel to science. Once it sank in, other scientists began to look
    at another elementary particle, one that the entire planet was very familiar with
    it, especially its trees: the photon.


    In a manner of speaking, the photon is sunlight. It is a quantum of electromagnetic
    radiation that comes from the sun’s energy field. And, again to the surprise of
    science, a photon, any photon, can perform the magical act of bilocation, though
    over distances greater than those measured in electrons. (These photon experiments
    were done recently, but the discovery has drawn surprisingly little excitement
    and attention.)


    When Einstein was resident at Princeton University, from the mid-1930s to the
    mid-1950s, he was fascinated by the physics of sunshine. He hit a dilemma while
    investigating his behaviour, though. In his measurements of the wavelengths of
    light, he found they travel in two ways: in a straight line he called a vector,
    and in waves whose lengths are very short, somewhat like the rhythmic arrival
    of ocean waves at the seashore. Though he solved the problems of the straight-line
    vector, how and why these sine waves remained out of reach. What purpose did they
    have in nature?'
