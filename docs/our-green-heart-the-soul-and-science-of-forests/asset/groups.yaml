    Cultures aren’t the only thing that such a relocation of tree species threatens
    and destroys. This has become clearer and clearer with the advent and acceleration
    of climate change. Native trees are bespoke for their own habitats, customized
    to fit perfectly, like a piece in a jigsaw puzzle. Their DNA is flexible, able
    to deal with changes in local conditions, like the odd drought or row of wet years.
    The trees hammer along in life, taking the inanimate rock under its roots and
    making something of it to feed itself. Its helpers in this effort are bespoke
    too, wispy mycelium communities that remain anonymous underground.


    Temperature is the master in the world of organic chemistry. It runs and ruins
    the biochemical world. The global thermostat for mammals lies somewhere between
    minus 30°C and 40°C. Some living creatures survive at higher or lower temperatures,
    but they are rare. Trees have their limits to. A temperature above 40°C will change
    the biochemical functioning within a tree and, consequently, in a forest. Like
    humans, trees can lose so much water by evaporation from their surface layers
    that they die from thirst. As global temperatures rise, the wrong trees in the
    wrong places can exacerbate these volatile situations and produce dire consequences.


    As an example, take California. For some reason, settlers in that state admired
    the whole tribe of eucalyptus and planted them in place of native'
