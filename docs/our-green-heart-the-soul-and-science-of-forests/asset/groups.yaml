    # 液态光


    Solas 是爱尔兰语中代表“光”的。对于过去和现在的凯尔特文化来说，这是一个具有重大意义的词，代表着光、明亮、照明和生命本身，是一个带有神性色彩的词。在古代，Solas
    用万字形表示，并被锤造成金质饰品供世人欣赏。


    我记得某个下午在利斯希恩（Lisheen）和邻居站在外面。由于整个山谷社区都决定分担教我凯尔特古代知识的责任，夏天只要我能从家务中抽身，我就会把时间花在任何需要教我的人身上。跑步者（通常是个男孩）会带着邀请函来到内莉（Nellie）的门口，我会和当天的老师一起喝茶或散步。当这位老师布满皱纹的脸掠过风景时，目光停留在那些散落在德鲁特文物的刻石表面，这些器物仿佛从内部散发光。“Solas,
    cailin，”我记得其中一人这样说道——“光，孩子，”用英语翻译道，“所有的能量有一天都将来自太阳。记住我的话。那是先知（fáidhe）告诉我们的。”Fáidhe
    意为先知。


    即使我不确切知道那是什么意思，也没有忘记那个预言的危险：光令我着迷。在那个时间和地方，作为一个对光感兴趣的女性学者，等同于在煤油灯的光下学习物理。我把这盏微小的光源带到床上，放在头附近的石窗台上，这样我就可以阅读从科克大学学院约翰·J·麦亨利（John
    J. McHenry）教授课程中做的笔记。有太多要学了。阳光很奇异。它有很多欺骗科学家的能力，甚至是今天的科学家。但尽管有许多谜团，阳光也拥有一个丰富的特征：它是免费的。阳光穿过大气层，提供自然所需的所有能量。


    大气中的碳以二氧化碳气体的形式存在，这些碳可以被回收为石油产品。将碳原子以可用形式结合在一起只需要能量，这种能量可以从太阳免费获得，通过聚焦阳光的光子。聚焦光子可以产生极其强烈的热量，至于可以从头重造分子——足以将碳重新配对结合。这种碳燃料产生的能量是碳中性的；大气中的碳可以被反复捕获，在自然的碳循环中和谐地管理，赋予我们减少和控制全球温度的能力。


    幸运的是，煤油等碳烃是非常简单的分子，十个到十六个碳原子像雏菊链一样连接在一起，形成一个分子项链。这种燃料的成分已经在空中，等待被使用。第一次由这种燃料驱动的飞行——航空业称之为“可持续航空燃料”或
    SAF——发生在 2008 年 10 月。欧盟于 2023 年 10 月通过的《欧盟混合指令》明确排除了任何用于人类和动物食物的作物 SAF，将 SAF 的研究明确指向太阳。


    可持续碳烃燃料的制造提供了人类如此渴望的能量，同时将碳从大气中封存，而碳正是导致温度升高并引发气候危机的首要原因。这种形式的大气封存将有助于全球森林再生，而它们最擅长的就是让二氧化碳保持在微妙的平衡中。


    目前，自然需要一切能得到的的帮助。我们可以在大碳循环安全网内燃烧的生物燃料很可能是答案之一。所有能量都来自太阳。


    ![](img/9a73bd94214c184b1606db8dbb911966_119_0.png)


