    # Céile


    I was given a piece of advice by a neighbour a long time ago, though at first
    I did not realize how important it was. It was the early 1980s, and I had just
    left academia, finally driven out by the sexism and harassment, the petty bullying
    and backstabbing I’d had to endure my entire career. Freedom from that world,
    its institutions and gatekeepers, I had dived into my own research, conducted
    on the property by my husband, Christian, and I had purchased in the mid-1970s
    and on which we had built a house—the place where we still live.


    I was also a new mother. When I was invited to this neighbour’s house for tea,
    I brought along my baby daughter, Erika. I stepped into my host’s warm kitchen.
    A smell of freshly baked muffins rode the damp air. I sat down on a wooden chair.
    She took my child in her arms, and for the first time in months I relaxed. Apart
    from Christian, I had no family support in Canada, despite the fact that my ancestral
    name of Beresford is plastered throughout the country from stem to stem. Because
