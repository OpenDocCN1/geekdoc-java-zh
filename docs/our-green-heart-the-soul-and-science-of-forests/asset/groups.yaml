    characters. Then my neighbour became serious. Between us was the unspoken understanding
    that we were both educated women. In a rural community, in fact in any community,
    intellectual attainment in a woman can bring its own problems; misogyny is never
    very far away. We were both pioneers of sorts, and she offered me some pure pioneer
    advice.


    “You have to settle down,” she said. “It’s like a chicken coop. We are all of
    the same flock. Somehow, we must keep the peace. The flock needs to roost down
    together for the night, and the morning will come. That is how we will survive!”


    She was telling me to keep my education under wraps because it could set me apart
    in this new country I was in, and cause problems. She was also telling me that,
    educated or not, all people are equal on this planet and we need one another to
    survive.


    In the summers I''d spent on Nellie and Pat''s farm as a girl, there was a shift
    happening in the valley of Lishees, and indeed all over Ireland. The introduction
    of tractors and chemical fertilizers changed the way the younger generations viewed
    the land and their relationship to it. They wanted higher yields and more cash
    for their work, or they''d leave for jobs in the city or abroad. Their appreciation
    for the ancient wisdom that had guided their people''s interactions with each
    other and with nature for thousands of years was also changed—badly damaged, even
    non-existent. At the same time, the keepers of ancient wisdom were getting older
    and dying, and the knowledge was in danger of being lost. Nellie and her neighbours
    gathered together and decided that what they knew could be passed to me. I was
    made a Breton whard, a student of the ancient laws and learning of the Celts,
    taught by the whole community. It was among the greatest gifts of my life.


    My instruction involved around the Old Irish word céile. This word carried many
    meanings. It could be used for a husband, wife, companion, an opponent in battle,
    but it also spoke to something grounded in the experience of existence. For the
    ancient Celtic culture, céile was based on the observation of how an individual’s
    existence related to the next person in time and how these relationships connected
    to the universe'
