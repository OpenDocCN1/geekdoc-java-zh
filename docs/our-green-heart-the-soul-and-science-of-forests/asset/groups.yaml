    整体而言。这种统一的形式被称为 céile，而它的行为被称为 *ag táhú céile*。最直接的翻译是“彼此结合”。


    古老的爱尔兰智慧在音乐、诗歌、冥想、孤独、与他人共处、祈祷和歌唱中发现了 céile。céile 既是灵感和想象力的源泉，也是结果，在无论是简陋的房屋还是城堡的任何聚会所需的开场白中显而易见。凯尔特世界的每个人都有自己的“专长”，无论是诗歌、音乐还是歌曲。他们被期望在任何庆祝或集体活动中加入
    céile 的氛围中，通过共同的情感和理解，将个体存在系成一个更大、更强大的整体。


    我仍然在范围内宗教机构的祈祷中看到 céile 的运作。许多圣书中的教义被吟诵着；智慧与爱的弦紧紧贴心心。此类行动具有治愈作用。它们通过降低血液中肾上腺皮质激素水平促进健康，减少衰老对身体整体的影响。


    凯尔特文明走遍世界。它扎根的一个地方是非洲，céile 在柏柏尔文化中也有对应词。将文化联系在一起的精神和情感胶水被称为 asabiya 和 asabiyyah。这种强烈的凝聚感将文化在书文字的美感与对称中结合在一起，成为一种供所有人欣赏的奇迹。


    中国也没有逃脱流浪之情。思想传播得比风更快，并拥有自己的生命。在孔子和五论时代，文化连接是为人知的。居住在中国中部黄河沿岸的古代商或殷人是在基督出生一千年前居住的。这些人与凯尔特人一样，在金属加工和陶器艺术上表现出高超的技术水平。最重要的是，他们创造了文字语言，汉字是现代汉字的直接祖先。凯尔特
    Ogham 字母的脆弱图案与这些汉字有某些相似之处。这两种文化隔着半个地球，但对艺术及其将我们团结在一起的力量有着敏锐的欣赏，通过共同的理解和经验帮助我们变得更强大。


    在今天这种破坏的气氛围中，必须重新获得思想的统一。世界各地的人必须学会欣赏他们自身生物多样性的奇迹，并将其作为修补破碎灵魂的良药。他们必须能够运用 *cèle*，然后是
    *asabiyya*，最后是 *Wu lun*。孩子们自然能做到这一点。难道我们必须从年幼者的智慧中学习吗？


    ![](img/9a73bd94214c184b1606db8dbb911966_88_0.png)


    # Dúchas (根源)


    在 Lisheens 山谷当女孩时，我听到很多关于自然的话。父母去世后，当我的时间在科科克（Cork）舅舅 Patrick 的家里和舅姑妈 Nellie 的农场之间分配时，由于
    Lisheens 社区的长辈们开始对我的教育产生特别兴趣，教我古代知识以及管理人与人、人与自然的布雷洪法（Brehon laws），学习成为我夏天主要的努力方向之一。布雷洪法看不起任何愚蠢到违背自然法则的人，在这种背景下，我听了许多关于自然的话。但也不断听到这个词本身——至少是它的爱尔兰语对应词，Dúchas。


    这有一个简单的原因：Caha 山脉中的其中一座山定义了山谷北部的地平线，在爱尔兰还是圣人和学者之土地且被称为 Éire 的时代，它被命名为 Dúchas。在我在
    Lisheens 生活期间，我每天看着那座被称为 Dúchas 的山。它随着季节和太阳而变化。它的高贵似乎悬挂在山谷上方，请求仰慕。很多时候，当我站在栅栏杆上或在牛径上停下脚步欣赏风景时，会有其他人加入我，分享我对这种我们所拥有的美所感到的宁静奇叹。


    在布雷洪法下，Dúchas 在山脉、田野、花草、动物和树木的物理表现之外还有额外的含义。这个词也意味着一个人的自然继承。这个概念被粗线条勾勒，意味着每个人对自然都有继承性的主张，一种出生权利。这种集体所有权在每个人与土地、甚至甚至是天空之间建立了一种传统的联系。这种联系旨在保护自然本身。在舅姑妈
    Nellie 的厨房桌旁，我反复听到一句我至今仍在使用的警告性谚语：


    “Briseann dúchas tri shúile chait.” 它的字面意思是“从猫眼中看到的自然”，但它传达的警告是：深邃的荒野如果被滥用，会反过来咬你。你需要与自然合作，否则就会面临自然对你进行报复的风险。


    在漫长的历史某处，自然产生了一个脑力。这个孩子是绿色的，花费了 4 亿年才完善。这个孩子收集阳光并创造了一片森林。逐渐，这些原始森林遍布了世界。它们在每一次呼吸和占据的每一寸土地上都承载着可能性的绿色宏伟。它们被称为“处女林”，因为它们巨大的树干上紧绷的皮肤从未感受过斧头的伤口。尽管它们对自己所占据的特定生态位拥有权利，但现在地球上剩下的原始森林寥寥无几。如果它们尽快被取代，整个人类家族在地平线上只能预见到毁灭。


    森林的天才基于碳。以某种形式，碳流经了我们星球上的每一个森林系统，从北向南，从东向西……（此处原文存在大量重复句，已按要求精简翻译并保持逻辑）。

