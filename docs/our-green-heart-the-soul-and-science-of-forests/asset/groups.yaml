    kids refused to let any politicians into the auditorium. These tiny gatekeepers
    were on alert the entire week, their reasoning being that “Learning about ways
    to prevent climate change is too important for politicians to interfere with.
    The future is ours!” From the maws of babies.


    Some months later, I accepted a lunch invitation after I''d delivered a series
    of lectures and workshops at the University of New Brunswick in Saint John. This
    was no ordinary lunch; the invitation came from children who attended a forest
    school outside the city. Having finished my university business, I admit I was
    very much looking forward to engaging with education at the younger end of the
    scale.


    A November sky held the promise of rain, so I borrowed a coat, hat and scarf,
    together with a warm pair of gloves, and headed into the pine woods. Like a fairy
    tale, the little forest school was nestled in the middle of a collection of evergreen
    trees and bursting at the seams with local children. The building was small, with
