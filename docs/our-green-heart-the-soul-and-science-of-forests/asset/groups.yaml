    海边等待我和我的电影团队。他是松永光彦（Katsuhiko Matsunaga）教授，日本顶尖的海洋化学家，我正为《森林的呼唤》对他进行采访。松永教授及其团队花费了四十时间，试图识别陆地与海洋之间对海洋生命至关重要的纽带。最终，他们发现了一些惊人的东西。


    所有的蓝藻（Cyanophyta，以前被称为蓝绿藻的细菌）在繁殖和分裂都需要铁；这种金属通过叶绿体或植物型铁氧还蛋白在海洋光合作用中起着重要作用，这些分子使这些微小植物能够捕获和传递电子。此外，当太阳落在地线以下时，铁取代了太阳成为蓝藻制造蛋白质的催化剂——其繁殖依赖于这些蛋白质。总的来说，水生海洋植物种的稳定繁殖代表了海洋食物的基础。


    陆地富铁，而海洋贫缺铁。松永发现，一种来自陆地的酸——富酸，像一个笼子一样将铁带入海洋。富酸——以及它的姐妹分子腐殖酸——是一种螯剂。这两种分子从陆地肥沃的红色土壤中抓取铁盐，并将它们引入海洋。


    树木和森林产生大量的这两种酸。随着秋天的到来，落叶树发生了重构。首先，它们的叶子变色，熟悉的绿色变成红色、黄色和橙色，甚至变成雾紫色或紫色，珍贵的叶绿素被储存在树木的维射线和根系中，以便在冬季储存。树木产生一种称为脱落酸的分子剪刀，导致叶子掉落在地面，并在枝条上留下熟悉的叶痕。针叶树并不能逃脱脱落酸，但常绿树对树冠更为节约。在大多数情况下，一片常绿针叶悬挂七年。有时，如果天气异常干燥，树周围会落下如橙色的针叶。也有落叶针叶树，如北方的落叶松（*Larix*），每年秋天都会落叶。


    当森林地面铺满叶子地毯时，脱落酸有了另一个任务。冬雨雪将这种酸溶解在落叶中，在随后的几个月里，随着这些叶子被分解，它们变成了骨架。剩下的只有木质素织的网络，有时甚至勾勒出叶子的精确轮廓。久而久之，这些会被还原。这一过程在森林土壤中产生了巨大的聚合物——富酸和腐殖酸。它们被雨水溶解，向着广阔的地平线出发，在途中收集大量的铁盐。淡水溪和河流将它们带入海洋，在那里交付它们珍贵的货物。


    正是这种流入导致了我在绘画和与猴子嬉戏的地方目睹了生物多样性的盛宴。在这些交汇点，巨大的微型蓝藻柱等待着铁，它们至关重要的营养。这些柱状体的命名充满了诗意。它们是球藻目（Chroococcales）、丝藻藻目（Camaesiphonales）、毛藻目（Pleurocapsales）、念藻目（Nostocales）和结藻目（Stigonematales）。铁启动了它们的蛋白质构建酶，以滋养鱼、滋养哺乳、滋养所有生命。


    松永教授告诉我日本的一句古老谚语：“想吃鱼，就得种树。”大洋需要食物。生命之网比任何人想象的都要更加紧密。日本渔民现在沿着曾经荒芜的海岸线种植树，以喂养未来的鱼。


    ![](img/9a73bd94214c184b1606db8dbb911966_58_0.png)


    # 橡树的纠缠


    当我们直视气候危机，试图应对其现状和未来的影响时，生物多样性为我们的世界提供了缓冲的福祉。树木有自己的历史。它们已经经历过地球上的多个危机时代，并发展出了应对的策略和解决方案。许多树种在过去曾充当先锋，它们现在可以再次这样做，因为过去气候事件的记忆作为一个活生生的教训库，保存在它们的物理结构中。希望树木的表观遗传学将引导它们向更稳定的状态生长，但这仍有待观察。


    维持现有的生物多样性，特别是在原生森林中，至关重要，因为并不是所有树在适应变化的能力都是平等的。任何冒险物种的故事——这里指的是那些进入并生存于未知且严酷环境的树木或森林——都是非常了不起的。它们的成功是调整基因组以适应特定栖息地的结果。DNA算法最终学会了修改其行为以适应景观的复杂性。这可能需要数千年，但它通常会为生命的生存工具箱增加新的事物。例如，干旱地区对白豆科植物——如刺槐（*Gleditsia*）、金合树灌木和树，以及黄花槐（*Sophora
    chrysophyllum*）青青睐，针叶树也学会了在干旱条件下应用的技巧。沙漠化改变了叶片上的皮孔，产生了蓝绿树。此外，树木在它们的口部或气孔处产生特殊的胡须，以保持水分。


    生物多样性还与芳香分子的多样性有关。通常来说，同科的不同树种表现出相似的化学物质模式。然而，处于生命边缘的树种显示出这些化学物质的不同含量，通常以异常的数量和浓度存在。这些差异反过来影响树木的内部运作，一直直到根部的生长点。这些区域需要地下的黑暗来运作。真菌丝体的无性菌丝体听着这些化学音符并改变性别。土壤中的蓝藻也可以做同样的事。病毒和细菌可能随之加入，噬菌体分解以寻找有用的DNA片段。

