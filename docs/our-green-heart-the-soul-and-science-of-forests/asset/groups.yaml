    So, how do you plant an acorn?


    First, you during midsummer, start looking for healthy, mature oaks wherever you
    live. Keep an eye on the tree and visit it as often as you can. Take note of the
    first mature acorns that land on the ground around the tree, but ignore them,
    because the first acorns to fall are often ones that have been aborted because
    of disease. Ignore, too, green acorns, which cannot be expected to grow because
    they''re not ripe. An acorn is ripe when it is brown, or sometimes black; an oak''s
    acorns will ripen from August to December in the northern hemisphere.


    Prior to planting, which you can also do from August to December (as long as the
    ground isn''t frozen), remove the cup. The cup scar on a healthy acorn should
    be lemon-coloured. Any that have been attacked by weevils or otherwise damaged
    will not grow. If you want to double-check, such ducks float while their more
    sound, heavier counterparts will sink to the bottom of a bucket of water.


    Place the healthy acorn on its side then cover it with a quarter to half inch
