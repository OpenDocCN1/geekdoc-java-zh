    die from it. Rachel Carson worried about it, and wrote about it too, warning the
    world in her 1962 book Silent Spring. A brave act in.


    For today''s farmers, planting seeds that carry a low germination rate can be
    disastrous. A second seeding is always a costly business. Where seasons are short,
