    ## The Hundred-Acre Mistake


    Thirty-odd years ago, about a decade after settling on our farm, my husband, Christian,
    and I bought a bit of mistake. It was about a hundred acres of land bordering
    our farm, and we bought it for two reasons: privacy and isolation.


    Once, the land had been two sheep farms. There were also some remnants of another
    smallholding, but that may have been just my imagination. In any case, there were
    two root cellars and a small splash of green in the ruins where there had once
    been some, blades of grass and a fine crop of weeds. This was the favourite nesting
    and resting ground of a small herd of white-tailed deer.


    Where there are deer, there are men. Where there are, there are hounds. Where
    the two-legged join forces with the four-legged, there are guns. Some locals,
    and others not so local, considered this piece of land we''d bought to be their
    killing ground. In the dark days of November, during hunting season, a pack of
    hounds flushed out any kind of life form on my farm and.


    One November morning, a wounded deer came to my door. It was a doe, suffering
    terribly. She had been shot in the belly and she walked up the steps. I felt as
    though I could hear her ask, “You’re trained as a surgeon. Can you fix me up?”
    To my eternal sorrow, I will never forget this incident and the horror of it.


    I walked north of my farm to find the men who had injured her. I was frightened,
    feeling my own life fluttering like a bird in my hands at the thought of confronting
    these men with guns, but I was so angry. When I came upon them, I demanded they
    budge. They thought it was a laughing matter. “A little Irish woman, worried about
    a single deer,” they sneered. “There must be something wrong with her.” Finally,
    I found an elderly neighbour willing to help. He grimly loaded his gun. The deer’s
    agony was over.


    By that, the men had gathered at my gate, where they stood watching and sniggering,
    unwilling to help but unable to keep away. I went indoors and got a bell, a book
    and a candle. During my Brehon wardship, I had been trained to counter evil. I
    walked out to the gate and began the ancient incantations of a drochrath—a curse
    of misfortune in old Gaelic. The bell was glass. I rang it. When its crystal sound
    died away, there was a great silence that landed like a shroud. To my surprise,
    a dense mist enveloped us all. It clung to our clothes and seemed to hold time
    in its clutches. “This farm, this land under our feet, is holy,” I said in Gaelic.
    “Here, in this place of memory, the ancestors slept lightly.” The men heard the
    ancient tongue. Though they did not understand the words, they got the intention
    behind them.


