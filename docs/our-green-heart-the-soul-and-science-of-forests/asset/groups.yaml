    如今只剩下扭曲的树干，曾经这些树曾像士兵一样直插星空。


    这些森林树木以及许多其他植物的消失，也影响了注入海洋的溪流、河流和河口，严重减少了最终沿海水的腐殖酸和黄酸流。这些巨型分子是森林林果（mast）最后的馈赠，是铁的跨洲载体——铁是让藻类分裂的关键金属。从这些不明显的森林食物中，海洋的丰饶爆发了。即使是巨大的鲸鱼也从中受益，无论是由于直接释放到它们产卵地的生命线，还是分布在整个海洋的养分。


    “林果”可能是食物的古语，但它也是当今地球星球生命的秘密钥匙，未来亦如此。维持每一个生物的设计一直都在这里。这只是一个睁开双眼去观察和感知的问题。


    ![](img/9a73bd94214c184b1606db8dbb911966_36_0.png)


    ## 森林学校


    在爱尔兰当孩子时，我对“教育”这个词非常敏感。根据说话人的不同，它有着不同的含义，这凸显了塑造我年幼身份的两种文化之间的巨大差异。在我家族的英国裔一方中，教育似乎是为了面子。我的父亲在我出生时就把我送入一所寄宿学校，以便我被训练成一个完美的妻子和我们血脉财富的化身。对他和他那些贵族同类来说，教育是一种外在的事物，是地位的标记和防御者。另一方面，我母亲的爱尔兰家族则在知识本身中看到了财富。他们珍视知识，并追求教育来完善自己并维持周围的世界。尽管他们拒绝说英语，但他们的拉丁语和希腊语随着古爱尔兰语从口中流而跳舞；在我看来，他们的每一次呼吸似乎都源自《布雷洪法》（Brehon
    laws）——凯尔特文化的古代智慧。我的老师强调深度倾听的必要性。对于那些学会真正聆听的人来说，他们说的话包含了层层含义。他们会指向一个时代，一个 *cluas*。“*Cá
    bhfuil chil do chluasa?*——你的耳朵在哪里？”——这始终是留心言语之下含义的信号。


    在位于科克和凯里之间的谢希山脉，有一个名为高根巴拉的山谷，中心有一座圣湖。那里坐落着一座 *crannóg*，一种古老的湖上居所，是一种为了保护居民而建造的人造堡垒。高根巴拉的
    *crannog* 很小。它包括一座圣芬纳布的小拜堂和一些建成蜂窝状的石屋，它们建于基督出生后不久——可能更早。修士们在这座岛屿的讲台上祈祷。这些修士是该地区教育的核心，这种教育在英国占据者颁布《惩罚法》（Penal
    Laws）的几个世纪以前，就从我那位于基尔尼罗斯斯城堡的学者家族开始了。那些旨在根除凯尔特文化的残暴法律持续了五百年，直到1916年的复复活节起义才结束。


    从我还只是个蹒跚学童起，我母亲就坚持每年带我前往高根巴拉朝圣，并回到我们的祖祖地——罗斯斯城堡。我们会停在 *crannóg* 旁，我惊叹于自己的凉鞋重叠了修士们的足迹。但在那个祈祷和学习的地方，我还看到了其他东西。那是湖泊上方高处的一个山脊。有时这个山脊清晰可见，有时则被灰色的雾气遮挡。在《惩罚法》让爱尔兰人教孩子成为违法的五百年里，山脊边缘存在着一种秘密的树篱学校，*scoil
    ghearr*。世代孩子聚集在那里。大和小孩子在峡谷灌丛的掩护下爬到山顶。他们坐成一圈。每天都会更换哨兵。这几个孩子必须趴着，张开他们的 *cluas*（耳朵）来学习。


    老师可能是当地的男女或神父，他们处于危险之中。他们小心而恐惧地来到教室。他们给孩子们提供长达五个小时的教学，涵盖数学、被禁止的爱尔兰语、诗歌、天文学和历史。一天结束时，老师们（尤其是神父）会躲在附近的房子里，直到能够安全回家，他们随时准备逃入被称为“神父洞”（priest
    holes）的秘密通道。如果被抓住，分享知识（*colas*）的惩罚是可怕的。一想起这些，我的手臂就会起鸡皮疙瘩。*eolai*（专家或老师）会被绞决、剖腹分肢。英国人会等到肉体停止抽动。然后才宣布死亡。有时，知识的代价是极其巨大的。


    我们每年的朝圣，结合我母亲关于树篱学校和那些不可思议的老师的故事，以及对我祖先为了保留最终传给我的古老知识所付出的努力的理解，留下了深刻的印象。作为加拿大的成年人，我对“*教育”一词依然敏感。它向公众展示了许多面孔，就像我小时候一样，但对知识的管理和分享仍然是文明的安全网。我尽所能地提供帮助，因为我很幸运，首先是《布雷洪法》的庇护，其次是在失去父母后住在叔叔帕特里克家里度过学校。他是一个对书籍有着奇异痴迷的人，我沉浸在书书中，包括他大量的初版收藏；这些书籍成为我信赖的伙伴，并为持续到大学的关系奠定了基础，在大学，医学院里的书籍似乎通过它们的重量，尤其是触感在对我说话。

