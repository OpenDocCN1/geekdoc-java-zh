    迪娜·贝雷斯福德-克罗格（DIANA BERESFORD-KROEGER）是一位在医学生物化学、植物学和医学领域公认的科学家，她终生都在为大众解读科学。2023年，贝雷斯福德-克罗格博士获得了科克大学学院卓越校友奖和加拿大皇家地理学会
    Kamookak 奖。她是多本自然类畅销书的作者，《美国植物园：森林哲学》被植树日基金会授予关于树木和森林的典范教育著作。2020年，她凭借自传《为树发声》（To
    Speak for the Trees）获得了西格德·F·奥森自然写作奖。她是专题片《森林之唤》（Call of the Forest）的作者和讲述者，该片基于她的著作《全球森林》。贝雷斯福德-克罗格在加拿大安大略省的私人植物园里继续她的研究和写作。


