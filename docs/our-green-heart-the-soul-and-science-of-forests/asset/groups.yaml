    叶子是自然界智能设计的完美案例。每种植物的每一片叶子都是拥有独立 DNA 的生命体。从基本意义上说，它是一个带有移动手臂的太阳能平台。这个绿色物体从清晨到黄昏，在地球的任何角落追踪太阳。它是一台在空中运行的引导追踪机器。它也存在于水下，尽管海洋森林采用了不同的设计，旨在应对水的阻力。它们在栖息地中还垂直堆叠，以获得最大的光照。


    叶子的形状和大小各异。它们可以从尖锐足以刺破皮肤的针形，到卵圆形、铲形、手掌形，以及具有许多裂片的倒卵形、匙形形、三叶形和掌形。总的来说，形状是由树木所属科的基因组决定的。越复杂的叶子往往属于星球上一些最有趣的物种。有时，DNA
    会发生易位或重组，突然之间（通常令科学界感到惊讶），某个领域内出现了一个“新成员”。这种新的树木或植物被称为“变体”（sport）。


    叶片由纤细的叶柄固定位置。这些部分可能非常短，使叶子看起来直接从茎上长出，这种情况被称为“无柄叶”。叶柄也可以非常长。叶柄控制着叶片（或叶肉）的运动。这种运动可能基于渗透压力的物理学，但目前尚不清楚它是如何发生的。这只是树木和森林生命中许多基本且核心的、科学界仍未解之谜之一。


    世界上发现了一类树木，它们的叶柄有一种不寻常习惯。这一类植物是柳科（Salicaceae），其中的杨属（*Populus*）非常独特。这些树大约有三十个物种，是自然界的绿色风车。叶片的质量与叶柄的长度恰好匹配，以至于气压的任何微小变化都能体现在运动。这种不可思议的活动性体现在树的名字中——*Populus
    tremuloides*，即颤抖杨（quaking or trembling aspen），它响彻世界上任何变化的警钟。


    尽管孩子们自古以来就一直玩叶叶子，但人们对一片简单叶子的生态功能知之甚少。叶子是一部肺。单看它，无疑是一部很小的肺。然而，如果剥掉整棵落叶树的冠层并将所有叶子放在一起，更宏大的视野就会展现在眼前。这个整体是树木完整的呼吸和交换装置。其表面积巨大，据认为覆盖了许多英亩。森林反过来放大了并倍增加了这种规模。它们是惊人的巨大碳捕仪器。


    人类的呼吸受到大脑深层中心（或边缘系统）的严格调节。树木和森林也有类似的调节，但在它们身上，过程要复杂得多。由于阴影的存在，冠层并不遵循同一份曲谱；光照充足的区域对交换的优于阴影区域。这种设计被称为“分布式涌现计算”，是一种源自基因的、命令与服从的二元函数，存在于树木、森林，以及人类的免疫系统中。树木中这种交换的数学原理被称为“细胞自动机”，这是一种智能形式，在人类身上局限于大脑。没有人知道它在树木中是如何发生的，更不用说在森林中了。就像叶片跨越天空追踪太阳的运动一样，这仍然是一个谜团，尽管我们每天的每一分钟的呼吸都依赖于此。


    大自然之星是叶子，既简单又复杂得惊人，是一个我们每一个人都可以摘下并握在掌心的谜。街上那个微笑的年轻人一针见血。谢谢你，陌生人，感谢你优雅的话。


    ![](img/9a73bd94214c184b1606db8dbb911966_26_0.png)


    # 古老与亚原子


    当我还是一个和家人住在英国的小女孩时，我的母亲带我去参加一个爱尔兰的葬礼。她的一个远表亲去世了。我们乘坐 Innisfallen 号渡轮跨越爱尔兰，落在 Lishens
    山谷参加庆祝活动。死亡和后世对凯尔特人来说非常重要。我们血脉相连。


    那座粉刷的小房子和附带的牛棚在数百年前就已嵌入山腰，与山融为一体。那位表亲是单身，独自住在房子里，收藏了大量的希腊语和拉丁语书籍。现在，农场的泥地板和粉白的墙壁挤满了他留下的家人。


    我记得那袋破布进门的那一刻。他掌控了整个房间。甚至连尸体都移动了一下。这个男人，衣服堆在一堆毯子碎片上，身上散发着电流。他是 seanchaí，故事讲述者，古老知识的守护者；他的工作世代传。seanchaí
    在秋季收获到春季播种的几个月里四处流浪，分享故事。该地区的每个农场都为他留一张床，人们用食物和全神贯注迎接他的到来。他是步行来参加婚礼的，从远方来纪念死者。


    他开始谈论 Ollúna，古代的大型诗人和历史学家，望向窗外房子背后的山。他似乎进入了恍神状态。接着他谈到了“分身”，即同时出现在两个地方的能力。他向现场所有人报告了山谷里的一起事件：他认识并信任的人被看到同时出现在
    Lishens 和 Gougan。这个概念本身是不可思议的，这种念头似乎否定了科学中所有确定的事物。但我在世界各地大学求学期间，这个念头从未离开过我的脑海。一个想法一旦诞生，就会延续下去。


    在职业生涯中期，阿尔伯特·爱因斯坦开始抱怨电子。他称它们的行为很“怪异”，并对它们的举动摇头。电子，当然，已经在物理学中被描述过——带有负电荷的基本粒子。地球上的每种元素都幸运地拥有一云电子。它们数量可能会改变，但它们的行为被认为是恒定且可预测的。直到几年前的一天，在伯克利的一个实验室以及随后的其他实验室里，单个电子设法地同时出现在两个地方。这些实验中的所有时间测量都被判断是正确的，尽管这一壮迹看起来是不可能的。这些科学家执行了“分身”的行为。一个微小的电子跨越了根深蒂固信念的巨大障碍，必须停留在想象中。虽然这不会让
    seanchaí 感到惊讶，但这一发现对科学来说是新颖且奇特的。一旦被接受，其他科学家开始观察另一种基本粒子，一种整个星球都非常熟悉的粒子，尤其是对于它们的树木：光子。


    从某种意义上说，光子就是阳光。它是来自太阳能量场的电磁辐射量子。而且，再次令科学界惊讶的是，光子，任何光子，都能执行神奇的分身动作，尽管其距离大于电子测量的距离。（这些光子实验是最近完成的，但这一发现引起的关注和兴奋异常之。）


    爱因斯坦在普林斯顿大学居住期间（20 世纪 30 年代中期到 50 年代中期），对阳光的物理学着迷。然而在研究它的行为时，他遇到了困境。在测量光波长时，发现它们以两种方式传播：一种是直线称为直线，另一种是波长很短的波，就像海浪有节奏地拍岸。尽管他解决了直线向量的问题，但这些正弦波如何以及为何仍然无法触及。它们在自然界中有什么意义？


