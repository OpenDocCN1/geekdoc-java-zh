    room with its lofty ceiling was lined with big books in leather, which smiled
    down at me as I took my place by the window. I felt I''d been loose in heaven.


    There my detective work began. I put on trial all that I had been taught about
    Ireland''s natural pharmacopoeia. Could the wisdom Nellie and others had shared
    with me, my ancient inheritance, be confirmed by scientific fact? I felt I was
    working at a great jigsaw puzzle, truly the cipher of life, and the feeling of
    this gave me both energy and enthusiasm. But, I was ashamed to admit, I was also
    skeptical. I wasn''t immune to the movement towards the modern world. The seashore,
    to my mind, was not a place to collect medicine. It was where you swam and fished,
    and it had nothing whatsoever do with curing disease. Nonetheless, I pulled down
