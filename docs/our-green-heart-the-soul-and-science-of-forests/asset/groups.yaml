    # Liquid Light


    Solas is the Irish word for light. It''s a word of great significance to Celtic
    culture both past and present, a word that means light, brightness, illumination
    and life itself, a word factored in the divine. In ancient times, Solas was represented
    by a swastika form, which was hammered into golden ornaments for the public eye.


    I remember standing outside with a neighbor one afternoon in Lisheen. Since the
    whole community of the valley had decided to share the duty of instructing me
    in the ancient knowledge of the Celts, whenever I could be spared from my chores
    those summers, I spent my time with whoever had to teach to me. A runner, usually
    a young boy, would be sent to Nellie''s door with an invitation, and I would join
    that day''s teacher for a cup of tea or a walk. As this instructor''s wrinkled
    face swept the landscape, eyes lingering on the carved stone surfaces of the Druidic
    artifacts that littered to light them from within. “Solas, cailin,” I remember
    one of them saying——Light, child,” in English. “All energy will one day come from
    the sun. Mark my words. That is what the fáidhe tell us.” Fáidhe meaning the prophets.


    Even if I didn''t know exactly what that meant, there was no danger of my forgetting
    the prediction: light fascinated me. To be a female scholar interested in light
    in that time and place was to study physics by the glow of a kerosene lamp. This
    small source of illumination I took to bed with me and set on the stone ledge
    near my head, so I could read the notes I made from Professor John J. McHenry''s
    class at University College Cork. There was so much to learn. Sunlight is strange.
    It has many abilities to fool the scientist, even those of today. But despite
    its many mysteries, sunlight also holds one bountiful characteristic: it is free.
    Sunshine ploughs through the atmosphere and provides all the energy needed by
    nature.


    Carbon in the atmosphere exists as the gas called carbon dioxide, and that carbon
    can be recycled into a petroleum product. All that is needed to join the carbon
    atoms together in a usable form is energy, which can come free from the sun, through
    focusing the photons of sunlight. Focusing photons can create a heat so intense
    it can remake a molecule from scratch—more than enough to pair-bond the carbon
    back together. The energy such a carbon fuel produces carbon neutral; the atmospheric
    carbon can be recaptured over over again, managed harmoniously in nature''s carbon
    cycle, giving us the ability to reduce and control global temperatures.


    Luckily, hydrocarbons such as kerosene are very simple molecules, ten sixteen
    carbon atoms joined together like a daisy chain to make a molecular necklace.
    The ingredients for this fuel are already in the sky, waiting to be used. The
    first flight powered by such a fuel—the aviation industry calls "sustainable aviation
    fuel," or SAF—happened in October 2008. The European Union''s EU Blending Mandate,
    enacted in October 2023, specifically excludes any SAF from crops used for human
    and animal foods, directing the research on SAF clearly towards the sun.


    The making of sustainable hydrocarbon fuel deis provides the energy humanity so
    desires, while also sequestering carbon out of the atmosphere, where it is the
    leading cause of the temperature increases causing our climate crisis. This form
    of atmospheric sequestration will help global forests to regenerate and what do
    they do best, is to hold carbon dioxide in a fine balance.


    At the moment, nature needs all the help it can get. Biocustible fuels that we
    can burn within the safety net of the great carbon cycle may well be one answer.
    All energy comes from the sun.


