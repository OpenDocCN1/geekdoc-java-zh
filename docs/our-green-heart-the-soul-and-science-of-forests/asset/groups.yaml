    Medicinal aerosols are manufactured in one part of the tree and then stored in
    the glands. Within a family of tree species, the glandular organs are all similar.
    For instance, a tree of eastern North America called the white cedar, Thuja occidentalis,
    carries its glands at the tips of its fruits. They can be seen with the naked
    eye. The tiny gland is circular and filled with midsummer with a yellow liquid.
    These are applicator fronds, developed to disperse the aerosol by touch and sometimes
    times. The glands are also finely tuned to temperature. On a hot, sunny day, the
    thujic acid they release into the air will regulate blood pressure, improving
    the circulation of all mammals.


    Then there are the aerosols produced in the orange family, Rutaceae, that function
    on the same principle as a land mine. Under pressure, the fruit and flowers release
    the aromatic aerosols as small explosions. Again, these glands can easily be seen
    on the rough surface skin of an orange, looking like tiny balsams embedded in
    the epidermis. The pressure of peeling sparks explosions that coat the fingers
