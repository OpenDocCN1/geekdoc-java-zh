    conditions. Luckily, the genus of Quercus, of the Fagaceae, or beech, has spread
    itself comfortably across the entire hemisphere, still represented in most northern
    forest systems and valued for its merits of biodiversity alone. They also remain
    a most important hardwood. The most sacred tree of the Celts—dair in the Ogham
    script—oaks have shape-changed from deciduous to coniferous in habitats with lower
    autumn and winter temperatures, to evergreen when growing nearer the heat of the
    tropics. They have also developed botanical “sunglasses” to cope with the glare
    from brilliant sunlight. These glasses'
  - '[PAGE 61]


    are worn on the upper surface of the leaf, a cuticular layer with all the transparency
    of silica glass. The layer is a resin, and this resinous pane allows the sun to
    penetrate without injury to the internal organelles of the leaf. In tropical regions,
    the adaptation is taken even further. The trees use another cuticle of resin on
    the underside of the leaf as a deflector to protect the circulation of the leaf
    from reflected and refracted light. These reflectors help with water loss also.


    Oaks have learned to live and stay healthy under the maximum ultraviolet radiation
    from the sun, and it is this adaptation that has turned the tree into a warrior
    to fight climate change. The tree manufactures twin biochemicals, quercetin and
    quercetin, that course through the entire canopy of the tree. When photons hit
    the canopy, they displace electrons from the chlorophyll in a one-on-one ratio.
    The spare electrons produced from these collisions are captured by the quercetin
    and quercetin, and slowed, becoming pye electrons that are funnelled into photosynthesis.
    This action is called quantum lifting. In the green hands of nature, the small
    and very small acts of photons and electrons count because of their high volume
    during the sunshine hours of the day. The same principle governs a hive of bees.
    It''s not the single worker bee that is important, but the hive''s two to three
    pounds of bees, which come together to complete the tasks that keep the hive operational.
    It is the volume counts.


    It could be, then, in the leaves of every oak some of the most pertinent answers
    to the question of free energy are staring us in the face. I have long been interested
    in material physics and energy storage. About fifty years ago, I modified an electron
    microscope to focus the electron beam for bombardment. I chose plant species I
    knew were high in molecular aromatic compounds, like the oak with its twin biochemicals.
    The beam converted their pye electrons into light energy, and I called that afterglow
    effect cathodoluminescence. I could repeat the results faithfully, and I published
    a paper on the discovery, for which I received an award. My work was important,
    and still is, because it showed that photons and electrons are interchangeable;
    both bundles of energy that can be used in the same way. In the early stages of
    quantum computing, researchers'
