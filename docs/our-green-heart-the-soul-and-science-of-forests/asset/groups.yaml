    # 致谢


    我想要那些让这本书成为可能的人流表示感谢。那股河流从爱尔兰的利申（Lisheens）山谷开始，流向科克的圣Alo禄学院的修女们。这些人将我推向了注定的命运，尽管当时我并不知道。我那时太年轻了。


    我那位强大的编辑安·柯林斯（Anne Collins），用笑声作为媒介追求完美。我敢提到加了咖啡冲水的浓茶，然后是巧克力，以及我们裹着皮草抵御深冬的寒意吗？文字大师埃文·罗塞尔（Evan
    Rosser）在零下度的天气里透过敞开的窗户倾听，为忙工作的作家和编辑提供敏锐的建议。斯图特·伯恩斯坦（Stuart Bernstein），我卓越的代理人也是我的朋友，他开启了出版界的大门。非常感谢。


    琳和南西·沃特曼（Lynn and Nancy Wortman）为我的文字处理支持，通过交谈清洗我的文字。他们的友谊温暖了我的心。


    此外，我很感谢莉莎·贾格（Lisa Jager）的艺术。她将一个想法化作天堂般的美景。约翰·斯维特（John Sweet）用他的大脑肌肉带着眼睛在页面上扫视寻找错误。没有人是完美的。


    然后，我必须感谢我亲爱的艾莉卡（Erika）和特伦斯（Terence），他们对我所做事业的爱和信任给了启发。我的丈夫克里斯蒂安（Christian）是我的大脑。他的支持从未消减，表现为坐在我们芬德莱奥场（Findlay
    Oval）的木炉旁，膝上放着猫：这是理解的三位一体。我是幸运的。


