    Forest bathing is for the animal kingdom also. When the family of monocotyledons—fresh
    green grass—is in full, either under the sun or in the rain, the forest provides
    a sanctuary for all living creatures. The trees are the guardians of the wild,
    providing shelter and the very breath of the forest.


    Medicines are key to both the future of human health and its ancient past. What
    a gift.


