  md: '# # The Risks of Taking Nature’s Place


    The management of planet Earth has been an ongoing process for more than 4.5 billion
    years. For nearly all of that vast span, nature has been Earth’s conductor. In
    the warm oceans where life was born, the simplest algae, managing photosynthesis
    with their primitive thylakoid instruction, needed time to grow and change. There
    were no trees then. The forests only existed as a dream somewhere far down the
    rocky road of evolution. But across the ages, the thylakoid membrane evolved into
    the welcomed spiral of the DNA helix, and then into the doubled form, a molecular
    mirror image that completed the coil. The exquisite genius of that design, untold
    tale and animal species have sprung, and nature alone has guided their success
    and failure, growth and death—at least until our present age.


    We are now living through a geological epoch that more and more people are calling
    the Anthropocene, where the actions of a single species, our own, have the power
    to reshape life on Earth. Nature has been pushed from the conductor’s podium and
    humankind has taken the baton. As it turns out, people do not make good conductors,
    because greed so often clouds clarity of thought. Primed with ignorance, our greed
    has changed Earth’s atmosphere and made it a dumping ground for all kinds of toxic
    waste, a mixture of gases and an increasing amount of particulate mostly generated
    by war and industry. The major gas in this mix is, of course, an alarming amount
    of carbon dioxide, which only increases in volume day and night, an acceleration
    exacerbated by the loss of the trees. The mainstays, the global forests, have
    almost gone. They were the great oxygenators of the atmosphere, the lungs of life.
    They were the great conveyor belts of atmospheric carbon dioxide, converting this
    gas into lignin, the wood sugars that provide the structural support for most
    plants, and the gift of oxygen. Without them, this process—the engine of the great'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'carbon cycle—collapses, and the volume of CO2 in the atmosphere climbs towards
    the point of no return, when every breathing creature except some sections of
    the plant kingdom will perish. Ironically, the plants will be saved by their own
    simplicity, the ability of many species to regress into the past, to tap into
    the strategies through which they created our atmosphere in the first place.


    The war is on. There are two sides—Homo sapiens and carbon dioxide—though humanity’s
    true test is in fact its lesser nature. Carbon dioxide has flooded the atmosphere
    before, millennia ago, and made it toxic. The plants carry echoes of this disaster
    built into their DNA, and the lower orders like the algae, the liverworts and
    mosses, and the ferns will greet its re-emergence with glee. The conifers are
    on the fence. But I’m willing to bet that they will join their coeur cousins for
    many reasons of adaptability.


    The weapons this conflict could unleash are terrifying. Bacteria and viruses,
    slime moulds and RNA myoviruses, like influenza and measles, are all small and
    mostly deadly if given the chance. Bacteriophages, too, holding potential in a
    changing climate. Originally discovered in 1915, these micro-creatures were thought
    to exist only in sea water. Then they were found in soil, and then everywhere
    else. We now know them to be the most numerous creatures on Earth. Bacteriophages
    pinch DNA from one creature and add it to another, turning viruses and bacteria
    into new creatures with different genomes. Their abilities are a tool kit for
    new medicines.


    Further increases of carbon dioxide in the atmosphere—massive quantities of which
    are released, along with methane, from bogs and freshwater benthic areas of wilderness
    being strip-mined for minerals like lithium—will us reach a point at which our
    planet is no longer to support animal life. The impacts of too much carbon in
    the atmosphere will soon be seen in utero. Gestation will take longer because
    atmospheric oxygen is being diluted with carbon dioxide. This new mix will enter
    the mother’s circulatory system, then cross the placenta into the amniotic fluid
    in which the baby is suspended in its protective sac. All aspects of the'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'baby’s growth into a healthy individual involve chemistry that is based on
    oxidation-reduction. This is the biochemistry of all living creatures. The reduction
    in oxygen reaching the fetus will increase the time it needs to mature to the
    point where it will have a chance at breathing for itself.


    For the adult population, a higher titre of carbon dioxide-laden gas is an unwanted
    toxin that interferes with respiration. Doughnut-shaped red blood cells are the
    courier system of the entire body, carrying active oxygenated ingredients from
    the pump of the heart out into the tiny peripheral circulation under the skin.
    They also act in reverse, carrying carbon dioxide to the lungs to be expelled.
    All food entering the body is spun down to carbon dioxide, even the complex fats;
    red blood cells visibly change to a deeper colour as they mop up carbon dioxide
    from digested food. In a healthy body, a fine balance is maintained between what
    goes into the body, what gets used and what comes out again. An excess of atmospheric
    carbon dioxide in the air we breathe disrupts this balance, converting the hemoglobin
    in red blood cells into methemoglobin and sometimes carboxymoglobin, molecules
    that will not pick oxygen in the blood. First they become useless and then, if
    they increase in the blood, they become toxins. This is why all surgeries across
    the world monitor carbon dioxide levels in patients under the knife.


    Climate change is real, whether or not world leaders acknowledge its existence.
    Its consequences are affecting, and will continue to affect, the entire human
    population of the planet, rich and poor, young and old, regardless of race, religion
    and nationality. We all breathe the same atmosphere. Universities and institutions
    across the globe are packed with people who have some degree of understanding
    of the threat we face. But many remain silent, perhaps out of worry for their
    pensions. Panels meet again and again. Experts wring their hands, then break for
    lunch or dinner.


    But make no mistake. The war is coming for you, and your carbon offensive will
    stop your heart.'
