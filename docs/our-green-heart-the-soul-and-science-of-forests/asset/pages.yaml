  md: '# Forest School


    As a child in Ireland, I was sensitive to the word education. It had different
    meanings depending on who spoke it, which underscored the vast differences between
    the two cultures that formed my young identity. The English side of my family,
    education seemed to be for show. My father registered me in a boarding school
    at birth, so that I could be trained to be the perfect wife and embodiment of
    the wealth of our bloodline. Education was, to him and his aristocratic ilk, an
    outward-facing thing, a marker and defender of status. On the other hand, my mother’s
    Irish family saw wealth in knowledge itself. They treasured it and pursued education
    to improve themselves and to sustain the world around them. Though they refused
    to speak English, their Latin and Greek danced with the ancient Irish as it sprang
    from their lips, and to my eyes it seemed that every breath they took flowed from
    the Brehon laws—the ancient wisdom of the Celtic culture. My teachers stressed
    the need to listen deeply. The words they spoke held layers of meaning for those
    who learned to truly hear. They would point to an era, an cluas. “Cá bhfuil chil
    do chluasa?”— Where are your ears?—was always the signal to mind what was being
    said underneath the words.


    In the Shehy Mountains between Cork and Kerry, there is a valley called Gougan
    Barra, with a holy lake at its heart. It holds a crannóg, an ancient lake dwelling,
    an artificial fortress made to protect the inhabitants. The crannog in Gougan
    is small. It includes an oratory, St. Finnabb’s, and some stone dwellings, built
    as beehives, just after the birth of Christ—possibly long before. Monks prayed
    from the rostrum of this island. These monks were the focal point of the area’s
    education, which began with my family of scholars at the Castle of Ross in Killney
    centuries before the'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'Penal Laws were enacted by the English occupiers. Those brutal laws, meant
    to eradicate Celtic culture, lasted for five hundred years, only ending with the
    Easter Rising of 1916.


    Beginning when I was little more than a toddler, my mother insisted on bringing
    me on an annual pilgrimage to Gougan Barra and our ancestral seat, the Castle
    of Ross. We would stop at the *crannóg*, and I would marvel as my sandals retraced
    the steps of the monks. But I was also shown something else in this place of prayer
    and learning. It was the crest of a hill high above the lake. Sometimes this crest
    was visible and other times hidden by a grey veil of mist. For those five hundred
    years during which the Penal Laws made it illegal for the Irish to teach their
    children, a secret hedge school, *scoil ghearr*, existed under the lip of the
    crest. Generations of children gathered there. The big and the small climbed under
    the cover of the gorge bushes until they reached the peak. They sat in a circle.
    Every day the lookouts were changed. These few children had to learn, lying with
    their *cluas*, ears, open.


    The teacher, who could be a local man or woman or a priest, was always in danger.
    They came to the class carefully and fearfully. They gave the children a good
    five hours’ worth of tutelage in subjects such as math, the forbidden Irish language,
    poetry, astronomy and history. At the end of the day, the teachers, especially
    the priests, were hidden nearby houses until they could safely make their way
    home, always ready to bolt for the secret passages called “priest holes.” Should
    they be caught, the penalty for sharing knowledge, *colas*, was fearful. Thinking
    of it raises goosebumps on my arms. The *eolai*, the expert or teacher, would
    be hanged, drawn and quartered. The English waited until the flesh stopped twitching.
    Then only when death was pronounced. Sometimes knowledge comes at a terrible price.


    Our annual pilgrimages, combined with my mother’s stories of the hedge schools
    and their impossibly brave teachers and an understanding of what it took for my
    ancestors to preserve the ancient knowledge that was eventually passed down to
    me, made a deep impression. As an adult in Canada, I am still sensitive to the
    word *education*. It shows many faces to'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'the public, as it did when I was a child, but the stewardship and sharing of
    knowledge remains the safety net of civilization. I help when I can because I
    have been lucky, first with my Brehon wardship, and second with spending the school
    year after I was orphaned living in my uncle Patrick’s house. He was a man with
    a wonderful mania for books and I swam in them, including his vast collection
    of first editions; they became my trusted companions and laid the foundation for
    relationships that continued into university, where the books in the medical library
    seemed to speak to me by weight and especially by feel, and far beyond.


    We may not be hiding in the gorse and running from the English, but education
    can still be a sensitive and sometimes dangerous thing. Incredible, my life was
    once threatened over providing a little more French to the local English-speaking
    children here in Canada, a country with two official languages, English and French.
    Volunteering for children’s hour in the village library, I read all not in French
    but in five other languages. The kids sat and enjoyed the novelty of the different
    range of sounds in the spectrum of language. But I got a very cold shoulder from
    the parents. Not one of them thanked me—and maybe it was one of them who took
    things a little further and threatened me. But the children did thank me, by one.


    It did not surprise me then that the children were open to new and unfamiliar
    knowledge—they always are. I once caused a riot in a school after taking a class
    into the woods to experience what I told them was a dinosaur garden. We walked
    a trail packed with ancient treasures of the botanical park. When I mentioned
    that the mosses we encountered were once the size of trees, it fired the imaginations
    of the children. They went back to the school and told the other classes about
    the “bush lady.” The result was a sit-in strike that lasted until the entire student
    body was taken on the dinosaur walk.


    Another time, working through the Imagination foundation in Fort Worth, Texas,
    I delivered a series of talks about climate change to all the city’s children.
    I put the lecture schedule into the children’s hands, valuing their opinions about
    what I had planned for them. The result was that'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'kids refused to let any politicians into the auditorium. These tiny gatekeepers
    were on alert the entire week, their reasoning being that “Learning about ways
    to prevent climate change is too important for politicians to interfere with.
    The future is ours!” From the maws of babies.


    Some months later, I accepted a lunch invitation after I''d delivered a series
