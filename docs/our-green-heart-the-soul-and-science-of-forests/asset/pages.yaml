  md: '# The Bioplan


    Warnings of the problems of climate change first came to my ears while I was a
    student at University College Cork. Back then, winter kept me in the city and
    at the university, while summers brought me to the land, and Nellie and Pat''s
    farm. Having guided me for so long in the ancient ways of the Celtic culture,
    the valley elders began to turn to me for answers to certain situations after
    I began my university studies. The farmers taught me what they knew of the land
    and our relationship to it, but now things were changing. The seasons, the weather,
    the plants and the animals were not behaving as they had for millennia, so the
    farmers came to me for advice. They expected to know what was happening. They
    were sure I would have the answers.


    The signs of change were numerous, they told me. First of all, the salmon run
    was down; the fish had simply begun to disappear. The pattern of the clouds had
    changed. The blacksmith was shoeing and trimming the horses'' hooves earlier in
    the season. Some varieties of apples and cherries were not producing as expected.
    The farmers frowned deepening on their faces, and then they carried on with the
    list. The August winds were stronger, coming off the Atlantic together with rains
    that hammered the heavy-headed grains to the ground, ruining the oats and barley.
    These injured crops were difficult to thresh, and yields had come down. The farmers
    were very worried. The memory of the Great Famine was still alive around their
    turf fires.


    I began to understand that these were not isolated events that could be written
    off as outliers. There was a threat out on the horizon. I took to the library,
    my knowledge of biochemistry under one arm and of physics under the other, like
    a hen with two chicks. I studied the empirical formula of the photosynthetic reaction,
    a picture started to emerge in my'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'mind about the natural world. I examined the reaction formula inside out and
    upside down, and suddenly the picture snapped into focus. Could such a thing be
    possible? The books around me seemed to answer, “Yes.”


    One book, in particular, was a very short volume called Aids to Botany by H.J.
    Bonham. I''d used it for a tutorial I was doing with a family friend, a medical
    student who was having problems passing his biology exams. I picked it out of
    the library because Bonham had managed to reduce the biological world to simplicity.
    This little book had big ideas, and I still have it on my shelves.


    It was Aids to Botany that really helped me to realize that too much of the forest
    was coming down and the planet was heating up. The worries the farmers had discussed
    with me in Lisheen were all traceable to this bigger problem of sequestration—the
    increasing amplification of the greenhouse effect—in some way, shape or form.
    We were all in trouble, big time.


    After that day in the library, forests and trees held an even stronger fascination
    for me. Forests were the answer to the farmers'' questions and to the existential
    threat we all faced. They were the means through which we could entice the carbon
    out of the atmosphere and back down into the land. I had to learn more and more—everything
    science could teach me about the trees; everything the trees could teach me about.


    Forests hold a form of divinity. They are the Holy Orders of our solar system.
    All trees capture carbon and release oxygen. They conserve and power the blueprint
    of life. The cathedral of the forest connects to human consciousness with a healing
    wound. The language of a tree speaks to the primitive in humans to form a molecular
    marriage of identity. This union of people and trees is ancient; we are woven
    together in an invisible living tapestry. This is the basic connecting element
    of life, all life, on this founding planet, our home.


    When I was a young child in England and Ireland, the words of eighteenth-century
    Anglo-Irish philosopher Edmund Burke held a special currency in our household.
    There was a reverence to him and to how he conducted his life as a politician
    and everyman philosopher. Though I'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'was not always able to follow the discussion, it was clear to me that Burke
    carried a moral compass in his heart. Occasionally one of his ideas, overheard
    from my parents’ conversation, would cause my little ears to prick up. In particular,
    I have always liked Burke''s famous line: “Nobody made a greater mistake than
    he who did nothing when he could only do a little.”


    My solution to climate change, which I call the Bioplan, is based on the idea
    that every one of us on this Earth can do a little in the face of the coming global
    catastrophe. I have seen many people discouraged by the scope of the problem of
    climate change—sometimes pushed into complete apathy, inaction and depression.
    But each one of us can contribute something tangible to the living world, by offering
    another human being a word of encouragement, or a smile and a shoulder to lean
    on, or planting an acorn, or picking up a shovel and using it to plant one tree
    or a thousand. Before looking at such action, though, I''d like to take one more
    look at what we''re against.


    The facts are for all of us. The forest has come down all over the world. Too
    many trees have hit the ground and turned into product. This has been done by
    human hands, and along with the excessive release of carbon into the atmosphere,
    it has resulted in a warming planet, untold species loss, widespread food insecurity,
    and the partial or complete destruction of each and every natural habitat on Earth.
    In future, it will bring even more pain to bear. If unchecked, it will threaten
    the continued existence of the human species and life as we know it.


    It is understandable that the challenge of halting and reversing the climate crisis
    can seem overwhelming. But we made this problem. While recognition should bring
    humanity shame, it should also inspire hope: we can undo what we''ve done.


    First and foremost, we must protect what is left of the ancient virgin forest,
    the remaining trees that these forests are libraries of knowledge. Some of these
    super-species are thousands of years old. The rings tracking their growth over
    so many springs and summers are a record of the challenges of the trees’ past.
    Each genome of'
  merge: -1
