  md: '# Our Cosmic Umbrella


    I had a secret garden in Lisheens. It was on a high shoulder of the valley, up
    behind the farmhouse—a climb to get there, in other words. The garden was a small
    field surrounded by a gorse hedge that contained my weeping stone, a boulder twice
    the size of our farmhouse table, against whose flank I leaned when I was feeling
    low. In happier moments on a summer''s afternoon, I would stretch out on the green
    grass and shamrocks to think, the buzz of my elders'' Gaelic words of instruction
    alive in my head: everything in the world was connected in a form of unity, a
    cé.


    I would turn my head and look through stalks of grasses, this new point of skewing
    their proportions. Between these green columns, now appearing tree trunk-sized,
    a gouache of aquamarine shimmered out to the horizon of Bantry Bay. Turning my
    head to the heavens, I looked up and felt the sky was mine alone, my inheritance.
    Clouds the brilliant white of untouched snow floated over me. They changed shape
    in elegant drifts, casting fragile shadows on my still body. In my imagination,
    fed well with lines of poetry at Nellie''s haunt, I rode their white haunches.
    I could touch the face of the sun with my finger and, later, to summon the liquid
    lace of the moon, which would rise from the curve of the Caha range, bright with
    reflection.


    In these blissful moments, I often thought of the cosmic light pouring down on
    me. But even though I daydreamed of travelling there, I gave little to not thought
    to the light the planet threw back into the black of space. “Earth shine” is the
    sunlight reflected off the planet, some of it to the moon and back again. In space,
    all solid objects are mirrors that reflect light.


    Planet Earth is unique among these mirrors, at least as far as we know, because
    it is a living “solid object.” Each cell of every plant on land and in the sea
    carries the rule book for photosynthesis, the recipe for exchanging'
