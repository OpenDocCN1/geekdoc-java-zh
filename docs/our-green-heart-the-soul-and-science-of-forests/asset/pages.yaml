    ∞


    Let me describe these magnificent anti-famine nut trees. They like to have bur
    oak, Quercus macrocarpa, as companions for life. The kingnut can grow in a wide
    range of soils, from dry and sandy to river bottom. A nearby spring or standing
    pool of water will not deter them.


    The tree is shorter than its sibling shadbark, Carya ovata. The kingnut is also
    stouter, with much heavier branches. The leaves are bigger and provide a better
    shade, and the tree wears winter dress of rachises, the dry petioles of the previous
    year''s growth. This crowd the branches and hide the leaf scars. The kingnut can
    also hybridize with the pecan, Carya illinoensis, to make much bigger and better
    nutmets.


    Once upon a time, in the not-so-distant past, the food of the Juglandaceae family
    fed North America. Thriving on this bounty was the American Mound Builder culture
    of the great savannah, rolling plains of meadows interspersed with food-bearing
    trees. This culture''s creative and scientific abilities surpassed the efforts
    of any European culture of that time, and it successfully fed its people on forest
    food.


    The nut trees soaked the sun, just like grass-fed beef, and spilled the three
    essential fatty acids into food that was twinned with health in body and mind.
    The kingnut was central to this food chain, an American giant of primary food
    production. People called it an anti-famine tree because these trees matured and
    grew, famine did not. Because of its solar exposure, the kingnut produces a canopy
    that mops up so much sun it is able to convert that food into a bounty of nuts
    and medicines. (Without exception, these trees do not do well in the shade.) It
    is a medicinal tree of'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'great importance. The pharmacopoeia of the Cherokee people alone employed the
    medicine of the tree for pain relief, viral remedies and the extraordinary ability
    of a bark infusion to improve the suppleness of long bones to prevent injury in
    various sports. By the wilderness gardening of these nut trees of the savannah,
    they were able to harvest nuts to deliver the highest quality of first-class protein
    into their diet, doubling the protein from the venison.


    Today, the kingnut could be reintroduced as an aid to agriculture in North America.
    If it is planted in hedgerows, the tree will shade the fields from excessive ultraviolet
    exposure from the sun. The tree’s roots will recycle the subsoil mineral wealth
    back to the surface layer of the soil. Kingnuts make the ecology of the soil around
    them more stable for insect life. Pollinators can tap abundant supplies of food
    and resins for protection. Some insects and a few birds use the resins as antibiotic
    and antifungal wallpaper to protect their offspring as they develop, a form of
    housekeeping that keeps diseases at bay. Birds multiply in the tree’s presence,
    ingesting the vitamin D for egg production while preening in the canopy. The kingnut’s
    large leaves sweep the air of particulate pollution, including isotopic radioactive
    reductions, and their shade protects amphibians from genetic damage.


    These trees, so carelessly removed from the North American landscape, are capable
    of doubling the plant-based protein of any farming operation. Making nut milks,
    nut creams, cheeses and nut tofu can be a new industry for the farming community.
    In addition, recent research from the Anantapur district of southern India has
    shown that the old style of growing woody perennials, like the kingnut, alongside
    agricultural crops can increase carbon dioxide sequestration from the atmosphere
    by 34 percent.


    What benefits nature, benefits farms. What benefits farms, benefits humanity.
    The kingnut is a gift. We have only to accept it.'
