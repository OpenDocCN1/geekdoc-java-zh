  md: '# Dúchas


    I heard a lot about nature as a young girl in the valley of Lisheens. After the
    deaths of my parents, when my time was split between my uncle Patrick’s home in
    Cork and my great-aunt Nellie’s farm, and the elder members of the Lisheens community
    began to take a particular interest in my education, teaching me the ancient knowledge
    and the Brehon laws that governed human interactions with one another and with
    nature, learning became one of my chief summer endeavours. The Brehon laws took
    a dim view of anybody foolish enough to defy the law of nature, and I heard plenty
    about nature in that context. But I also heard the word itself constantly—or at
    least its Irish equivalent, Dúchas.


    There was a simple reason for that: one of the mountains in the Caha range, which
    defined the horizon north of the valley, had been christened Dúchas back in the
    time when Ireland was the land of saints and scholars and still called Éire. I
    looked at the mountain called Dúchas every day that I lived in Lisheens. It changed
    with the seasons and the sun. Its nobility seemed to hang over the valley, asking
    for admiration. Very often, as I stood on a fence rail or stopped in my tracks
    on the cow path to enjoy the view, I was joined by others who shared the quiet
    wonder I felt at the beauty that was ours to behold.


    Under Brehon laws, Dúchas held additional meanings beyond the physical manifestations
    of mountains, fields, flowers, grass, animals and trees. The word also meant a
    person’s natural inheritance. This concept was painted with a broad stroke, meaning
    that every person carried a hereditary claim to nature, a birthright. This communal
    ownership forged a traditional connection between each person and the lands, and
    even the sky. The connection was intended to protect nature itself. At Great-Aunt
    Nellie’s kitchen table, I heard over and over a proverb of warning I still use
    today:'
  merge: -1
  pgno: 89
- img_proc: true
  md: '“Briseann dúchas tri shúile chait.” It literally means “Nature seen in the
    eyes of the cat,” but the warning it conveys is deep wilderness, if it’s abused,
    can come back and bite you. You need to work with nature or risk nature taking
    its revenge on you.


    Somewhere in its long history, nature produced a brainchild. The child was green
    in colour and took over 400 million years to perfect. The child collected sunshine
    and made a forest. Gradually, these primary forests spread across the world. They
    carried the green grandeur of possibility in every breath inhaled and in every
    inch of earth occupied. They were called “virgin forests” because the taut skin
    of their enormous trunks never felt the wound of an axe. Though they laid a claim
    on the particular niche they occupied, there are now few primary virgin forests
    remaining on planet Earth. If they are not replaced soon, the human family as
    a whole can expect only on its horizon.


    The genius of forests is based on carbon. In one form or another, carbon flows
    through every forest system on our planet, north to south and east to west, movement
    operating on a timeline that works in seconds, if there is a fire, and in millennia,
    climatic times are stable. A tree is born with carbon, lives by carbon and, and
    when it dies, goes back to ashes and dust, deferring to carbon.


    The trees of a forest are not simple creatures. They have their likes and dislikes.
    Some love a sweet limestone soil. Others hanker for acidic earth and run growth
    to its limits in soils with the pH as bushel of bitter lemons. Usually, the acid
    lovers come from very ancient lines, like the madrones. They grimly hang on what
    they know and what will nudge them away from their familial hunting ground of
    jarringly low pH. These outliers are also medicinal trees. Most are to be found
    near the sea or ocean. They gravitated into these dangerous zones because their
    forest companions have been vanquished by human hand. There are the high flyers,
    the bristlecone pines whose seeds release rarefied mountain air, and the driftwood
    trees, who splash in saline conditions, like the bald cypress. These trees should
    be man’s best friend, because they hold a solution to prostate cancers. They produce
    a unique atmospheric aerosol called'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'taxodione, which has a strong anti-tumour effect. The health of a man forest

    bathing in the presence of any of the the Taxodiaceae family benefits greatly.


    A native forest is a special place, anywhere on the planet. It is special because
    it is the centre of a unique form of plant democracy. Each species within a forest
    is a member of a family of trees with different traits. These are evident above
    ground in the architecture of the tree and its canopy, and in features as particular
    as the leaf scar, its fingerprint. These families all live together. Combined,
    their virtues make a whole that is beneficial to the human family and to all living
    systems. They co-operate in many known and unknown ways.


    Underground, a forest is even more of an enigma. Beneath the soil, all business
    is conducted in darkness, and this causes problems for science. Still, we know
    there are many players as the trees of a forest interface with almost all of creation
    using the pattern language of DNA and RNA. Though the apical meristems at the
    tip of each root, with their protective sheaths, are not fully understood, are
    the exquisite boundaries of chemical exchange. The roots act like an invading
    army in the soil, working for the benefit of the tree, and sometimes for the entire
    forest. The army produces allelocmicals that sweep deeply into the soil in plumes
    of active biochemistry. Their effect is seen around the tree and can even deliver
    a killing action that extends in a thirty-metre radius from the trunk. Nut trees
    are especially effective in this regard, needing to protect their capacity to
    produce a crop. Many aspects of the tree’s health depend on what is happening
    underground, where there is a constant ebb and flow of antivirals, antibiotics,
    antifungals, anti-inflammatories and anti-cancer biochemicals. This action originates
    in the brain of the tree, a command centre science has to locate.


    Native forests, then, are webs of unfathomable complexity, each one unique to
    its geography and among environments on the earth. They are far from fully understood
    and cannot possibly be re-created, and yet humans have hacked and razed them with
    abandon. I remember one day in Lisheens, helping my cousin Pat cut peat for fuel,
    when our tools struck something solid in the bog. After excavating it, we found
    ourselves staring'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'down at a huge piece of bog oak. The find itself, this dark mass of wood hidden
    in the earth, was not unusual, Pat told me. Similar pieces often popped up when
    people in the valley cut turf. What struck me, though, was that such a gargantuan
    tree once existed in a landscape that was now treeless everywhere I looked. Where
    had the forests that held these giants gone?


    Within a few days I began walking, keeping my botanical eyes fully open with every
    step. Every place I noticed a turf reek outside a farmhouse, I asked. The entire
    countryside, up to the tops of the hills, nearly to the tops of the mountains,
    was carpeted with turf, and I soon found out what Pat had told me was true. Gnarled
    branches and butts of oak were uncovered in sufficient numbers for carved bog
    oak, in its dark, polished splendour, to be an item people wanted to acquire and
    use.


    The pattern language of the ancient forest, though, was the knowledge of the community
    of forest members—the ground-layer plants, like the insects; the understory of
    smaller trees with their climbers; and the dominant canopy—had gone. Only one
    plant, a biennial, remained from the greatest forests of Ireland. It was to be
    seeing a faithful hopsitch in the hedges and ditches around the tiny fields. This
    plant was the foxglove, Digitalis purpurea. They still raise their spires of spotted
    flowers to dance in June with the fairy folk of these ancient fields. A survivor
    stripped of its community.


    Apart from the odd mistake—the few places that have somehow skirted human greed,
    like areas in the boreal forest system and in some mountain regions—the reality
    I witnessed in the valley of Lishees has played out all the world. In the past
    fifty years, the face of the forest has changed. If viewed from the air via drone,
    plane or helicopter, forests presented a checkered appearance. This is why they
    have been destroyed, of course, but also of the way they are “managed.” Some areas
    are clear-cut and present tree butts to the eye. Others are partially cut over.
    On the east coast of Canada, a different strategy is employed: As you drive the
    roads and highways, it seems as if you are surrounded by untouched forest. In
    reality, you’re passing a screen of trees,'
  merge: -1
  pgno: 92
- img_proc: true
  md: 'maybe thirty to sixty metres deep, that have been left to line the road. Everything
    behind this screen is cut. On the other side of it, disastrous conditions stretch
    as far as the eye can see.


    Even when forests are replanted after they have been logged, they look very different
    from the native mixed forests that once occupied these sites. From country to
    country, bandwagon thinking has influenced what is planted. The choice is invariably
    evergreen as evergreens are more convenient to plant. I think evergreens are also
    chosen because the small seedling looks like a tree; in its earliest months and
    years, it is easier to imagine it growing into a bigger tree. Further supporting
    this practice is a fallacy out there government circles, and even among some academics,
    that deciduous trees take a long time to grow. My experiments show that this is
    not true. An evergreen tree takes off immediately, but a deciduous tree, once
    its canopy spreads and enlarges its green volume, can catch up and overtake it.


    The plantation forests that exist all over the world look alike. From above, the
    entire area looks as if the trees have received a crewcut. They get the nod from
    departments of the environment, big industry and even many conservation groups,
    but these crewcut forests play a cruel trick. Over time, the public—and especially
    children, whose young eyes have never seen a mature, mixed forest—come to view
    the plantation forest growing on their doorstep as a real forest, a native one.


    The crewcut forests also hide another natural disaster I first became aware of
    around forty years ago. The land next to our farm was being planted with trees.
    A group of young men, all in their twenties, were the planters. For some reason
    known only to their employers and God, they were using a nerve poison around the
    young pine trees. They were neither breathing masks, goggles nor gloves. At one
    point, they came to my door for some water and told me what poisons they were
    using to “get rid of ants.” I asked them if they were married and if they planned
    to have children. When they answered in the affirmative, I told them, “Don’t plan
    to have healthy children.” They were horrified.'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'The practice, I came to learn, was no outlier. These clear-cut regions of once-forested
    land are very often sprayed with a rainstorm of toxins. These can be herbicides,
    pesticides, pre-emergent killers, control chemicals and sometimes nerve toxins
    to kill off insects. Plants, like humans, carry regulatory hormones. Some are
    fat-soluble while others are water-soluble. To do their work, these designer toxins
    hit the highways of water in the soil that are so important to a living planet.
    Eventually they reach the rivers, lakes and oceans, and inevitably this weapon
    of molecular warfare ends up in the places of least resistance, like the North
    and South poles. And they land in the breast milk of everything from whales to
    the pinnacle predators on land.


    “Managed” forests lead to poisoned monoculture plantations. Those poisons stay
    in nature to wreak havoc with biodiversity. Conversely, the biodiversity within
    the trees of a native forest gives rise to further biodiversity in plant life,
    which gives rise to biodiversity in underground fungi. This in turn increases
    the biodiversity of insect life, which leads to an increase of healthy mammals
    and especially birds, who patrol the trees, keeping them safe from disease and
    infection. This is how a native forest can look after itself anywhere on the planet.
    The blueprint is in the DNA. It is flexible and it is the real genius behind all
    life forms on this planet, an algorithm based on simplicity.'
