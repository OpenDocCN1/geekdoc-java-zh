    Around the base of a mature tree, there is often some mounding of the soil. These
    elevations are always of interest to forensic ecologists because the past lies
    within them. The mound around a mature-to-ancient tree is circular and evens out
    to a flat plain at the drip line, the ring where water falling from the outermost
    edge of the canopy hits the ground. These mounds contain humic and fulvic acids
    deposited over time from the leaves of the growing canopy. These are molecules
