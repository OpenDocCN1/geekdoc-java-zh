  md: '# My Mother’s Tree


    Every time my mother and I passed a trembling aspen, Populus tremuloides, she
    would cry out in delight. “Look there! No, over there, Disie! In the hedge—it’s
    an aspen,” she would say, pointing and nodding in the direction of the tree, which,
    when I followed her gaze, was always a humble, anemic specimen looking as if it
    needed a blood transfusion. “Isn’t it beautiful?” she would ask, her voice full
    of wonder.


    The trembling aspen is definitely not beautiful, not to my eyes at least. But
    something of my mother’s passion had rubbed off me. Over the course of my career,
    I’ve always paid attention to the tree, and as I have come to understand it more
    deeply, I have discovered that it is really remarkable.


    P. tremuloides is a survivor. To fully appreciate its tenacity and genius, though,
    a person would need X-ray vision. The roots of the aspen clones underground, showing
    only the odd “finger” to those above—a slick white piece of root coming up for
    air. In a season or two, it produces a shoot. Before you know it, a gaggle of
    aspen trees stands around the first.


    In my orchard, I have a single row of experimental Hog peas that I have produced
    by crossing. They are able to begin growing in the coldest spring, a frost resistance
    valuable in a changing climate because the tree can bring its crop of fruit to
    maturity early. However, I suspect that my experimental ground has an underlayer
    of aspen, waiting to get the better of me. I have seen its first white fingers,
    here and there.


    The trembling aspen’s preferred method of reproduction is asexual; every single
    cell of each individual group of clones is identical. The tree can reproduce itself,
    over and over again, and the genome is always the same. As it is in most human
    cells, the DNA of each aspen cell is diploid, containing two identical sets of
    chromosomes, which means you can'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'produce a tree from a single cell. Just a handful of scientists across the
    world are studying this strange behaviour, despite the incredible scale it can
    achieve. According to work by the late John Laird Farrar, a leading Canadian forester
    and one of the first to write about such clonal colonies, the largest grouping
    of clonal aspen occupies up to two hundred acres. It has been motoring along for
    over 1.6 million years, since the Pleistocene era, well before the ice melted
    on Earth. With a tincture of imagination and the backing of some governmental
    aid, the trembling aspen could help save what remains of the global forest.


    It happens that forest cloning isn''t the species'' only fascinating feature.
    The tree also has unusual plumbing, the kind of interior that can manage water
    transportation from root to tip with great ease. Key to this transportation is
    the blessing of extra-long tracheades. Tracheids are tubular cells connected in
    one long string that begins at the root tip and ends at the apical cells of the
    tip-top of the canopy. This length of trachea is called xylem tissue, and it is
    the plant organ responsible for the conduction of water in the tree. It also acts
    as a skeleton, keeping the tree upright and pointing towards the sun. Inside each
    tubular cell is pitted in exactly the same pattern, away from the vertical at
    an odd angle; the depth of the pit, too, is always the same. (All trees within
    a given family have the same pit pattern, one feature used in botany as a means
    of identification.)


    Though it has caused me many sleepless nights—I’ve stayed up for hours thinking
    about transpiration—the aspen''s tracheids have another useful trait for humanity.
    Clonal tracheids are the trait in pulp and paper companies need to make paper
    products. The aspen can be cloned to harvest its long xylem tissue. Not only would
    this spare the mature and ancient trees of virgin forests, which are still coming
    down to make paper, but each tree would also bring added value for the forest
    industry and work to those presently laid off by empty paper mills. Growing cloned
    aspen, caring for them and harvesting them, would supply further work in the fields
    of agriculture and agroforestry.


    The little trembling aspen carries a fail intriguing card up its sleeve, of movement.
    In fact, all the trees of this family do the same thing—'
  merge: -1
  pgno: 121
- img_proc: true
  md: 'they quiver in the slightest murmur of a breeze. This action is described in
    many languages across the world. My mother would also have laughed with friends
    and family over the unique Celtic word, cnámhseala. Used when the rising of the
    wind off the sea through the movement of aspen leaves, the word describes an old
    woman stirring and rattling about in her bones. The aspen tree carries a canopy
    of egg-shaped leaves that are more transparent and thinner than the leaves of
    other deciduous trees. Each silken leaf hangs by a petiole that is longer and
    more delicately designed than the leaf stems of other trees. The overall design
    gives rise to that early and vigorous movement in the slightest of winds. The
    tree was the weather vane of the Celtic and Chinese civilizations. In the modern
    world, the aspen’s leaf design could be copied as a new kind of green windmill.
    Designs in nature are already tried and true, carrying perfection.


    I did not learn the Ogham alphabet, the first written language of Europe, until
    after my mother’s death, but among the many surprises it gave me was one about
    the tree she so dearly loved. In the Ogham script, hammered into my mother a child
    as it was hammered into me, the aspen is the letter E. It is Eabha, or Eve. Not
    just my mother’s tree, but a tree for all mothers, for all women—holding immense
    strength in its apparent fragility, holding the knowledge and ability to carry
    us into the future, holding the blueprint for life.'
