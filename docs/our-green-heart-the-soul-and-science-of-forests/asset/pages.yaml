  md: 'Even though children have played with leaves since the beginning of time, very
    little is known about the eco-function of a simple leaf. A leaf is a lung. On
    its own, a very small lung, to be sure. However, if the entire canopy of a deciduous
    tree were removed and all the leaves placed by side, the bigger vision would come
    into view. This collective is the full breathing and exchange apparatus of a tree.
    The surface area is huge, thought to cover many acres. Forests, in turn, magnify
    and multiply the scale. They are staggeringly massive instruments of carbon capture.


    Human breathing is strictly regulated by the deep centers, or limbic regions,
    of the brain. Trees and forests are similarly regulated, but in their case the
    process is a little more complicated. Because of shade, the canopy doesn''t sing
    from the same song sheet; areas in full sunlight respond to exchange better than
    those in the shade. This design is called distributed emergent computation, a
    gene-derived binomial function of command and obey found in trees, in forests,
    and also in the human immune system. The mathematical principle underlying this
    exchange in trees is called cellular automata, which is a form of intelligence
    that in human beings is confined to the brain. Nobody knows how it happens in
    trees, much less in forests. Like the movement of a leaf blade tracking the sun
    across the dome of the sky, it remains a mystery, even though our lives depend
    on it as we breathe through every minute of every day.


    The star of nature is the leaf, simple and staggering complex, a mystery any one
    of us can pluck and cup in our palm. The smiling young man in the street hit the
    nail on the head. Thank you, stranger, for your graceful words.'
