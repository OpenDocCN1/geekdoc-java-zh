  md: '# The Boreal Spring


    Plant aerosols are new to modern medicine and to science; I was the first person
    to publish tree aerosols, in 2000, in my book Arboretum America: A Philosophy
    of the Forest. They are not, however, new to nature. This chemistry has always
    been present in the plant world, a unique means of communication in which the
    speaker is a plant, and the speech produced is a biochemical sheet of molecules.
    Each molecular form has a meaning attached to it, provoking a response from its
    receivers, be they pollinator, fly, ant, mammal, fish, or another plant or tree—an
    entire forest ecosystem, if the call is loud enough, urgent enough.


    An aerosol is a balloon in miniature, a carbon mainframe that can carry other
    attachments, some big, small. These are molecules constructed by nature to respond
    to the flow dynamics of the atmosphere, one form of nature’s public transport
    system. To understand how they work, picture a child''s birthday balloon. Tethered
    to the child''s hand or wrist, the balloon floats over the child''s head, restricted
    by its string until it is blown away by the wind, or go in a moment of carelessness
    or curiosity. On release, there are always a few seconds when the balloon seems
    to hang there. Looking up at the colourful object, you wonder if it will ever
    take off. Then something happens and it goes. This “something” is the physics
    of flow, a phenomenon called “lift” in the aeronautical world. The action of lift
    depends on the design of the object, the force behind it and the current wind-speed
    properties of the atmosphere. The balloon takes off, floating up and through the
    air. All of a sudden flush of momentum carries the balloon sideways and out of
    sight.


    Plant aerosol molecules are invisible to the naked eye—too small to be seen—but
    then so are the sound waves of speech. The human voice can be measured by vocal
    wavelengths. Similarly, aerosols can now be tracked by'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'displacement in cloud chamber experiments and characterized or identified by
    gas chromatography.


    As these molecules are studied in greater depth, they have begun to reveal their
    diversity. Some aerosols are tiny, others have a symmetry of shape to save energy,
    many more are bulky by molecular standards. These last need to be staged like
    rockets, losing weight to increase the momentum at liftoff, to become airborne.
    Still others carry the molecular form of a bullet. The remainder float and dangle
    like kites, with the same ingenious saillike designs allowing them to float in
    moving air. These molecular kites come in two mirrored varieties; one design spins
    the kite to the left and the other to the right. As I explore more detail in the
    next chapter on forest bathing, the left-handed rotation is a better medicine,
    somehow a superior match for human health. The reasons for this are unknown.


    The aerosol language opens new windows into the workings of nature. All flying
    pollinators rely on aerosol messages from plants. The flower sends out this call
    from its female hub, usually in the form of a perfume, though one that may or
    not be identifiable by the human nose. A pollinator will have no trouble recognizing
    it, however, and will hurry to the source. Meanwhile, the flower will already
    switched on a series of guiding lights. One will show in polarized light, visible
    only to insects, while the other is a colour cascade of ultraviolet light. These
    brilliant systems act as a guide for the insects, first to geo-position the field
    and then track the pollen source. The results rest on your plates, food for thought
    and fork.


    Perhaps the greatest of the plant world''s chemical clarion calls, however, are
    the vernal language of the boreal forest system, the planet''s signal for spring.
    The boreal encircles the globe like a hat band or crown, a unique northern forest
    system spanning continents and islands and peninsulas. The boreal is the workhorse
    of the planet, maintaining the oxygenation of the atmosphere.


    It also sits on a huge mass of frozen carbon. This carbon is ancient. It sleeps,
    frozen in the permafrost in the form of phenols, and has also recently been found
    the seabed of the Arctic Ocean, especially closer'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'to land, as well as in rivers and lakes. The great frigid lockdown of northern
    and Arctic carbon amounts to approximately three times the present tonnage of
    carbon in the atmosphere. (The permafrost alone locks in twice the carbon currently
    shelved in the global atmosphere.) This sleeping carbon bomb is harmless so long
    as it stays cold, a condition that keeps reaction rates at an absolute minimum.
    But heat, ever more present in a changing climate, wakes up the phenols, which
    then break into massive amounts of carbon dioxide. Though the amounts are difficult
    to calculate, the bentic carbon stored under fresh water will only increase this
    release as it warms up.


    The boreal forest system, then, is the ecological shield of our living, breathing
    world. Its dominant deciduous trees reach into the heart of the frozen north.
    They are the members of the willow family, Salicaceae. Of this tribe, the poplar,
    Populus balsamifera, is the most important. Over time, these trees have modified
    their genome to survive in their frozen habitat. In the harshest growing conditions
    on Earth, they thrive and grow into colossal trees. These trees together manufacture
    and release a substantial plume of bioactive medicinal aerosols, which becomes
    a lifeline of vastly important medicine for the planet. This invisible shield
    protects all mammals and also acts as an initiator of spring activity.


    The winter canopy of the poplar is remarkable. Its growing tips bulge winter protection.
    The tenderest internal growth is wrapped in a bandage of furry brown bract tissue
    that is sealed with oleoresins and resistant to cold and ice. As the spring reaches
    the north, the growing tips are the first part of the tree’s canopy to receive
    heat. The oleoresin glue that holds the leaves and bracts in place is temperature
    sensitive. As the brown tips warm up, this glue sublimes to form fragrant aerosols
    and releases the apical tip, which begins growing by means of an internal clock
    of complex enzymes called dihydroconalones. The enormous spring flush of aromatic
    aerosols ends in a global plume of airborne medicine. Because the boreal grows
    in a wide green band around the top of the planet, the poplars all open together
    as the angle of the incident rays of sunshine increases. The aerosols derived
    from the chemical'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'complexity of the oleoresins are released into the warming atmosphere, and
    travel south as the warming increases. Warm air, being light, travels rapidly,
    criss-crossing the rising currents. These these are designed for air travel, built
    like bullets of prostaglandins and salicins. Forms of both compounds can also
    fly as labile aerosols, increasing the aerosol mass in the air vectors.


    The biochemical synergy within the subliming oleoresin compounds is powerful.
    These northern aerosols put the freshness into spring and a skip into the step
    of lovers. They target many aspects of the human body. They stimulate smooth muscles,
    in the gut and other internal organs that are not under voluntary control, and
    they dilate the small arteries that feed blood to the surface of the body. They
    open the lungs to refine breathing. They lower blood pressure and inhibit the
    excess secretion of hydrochloric acid in the stomach. They improve the flow dynamics
    of red blood cells, meaning the labour of birthing is easier and inflammatory
    reactions are reduced. These aerosols also bring nasal vasoconstriction, which
    makes it more difficult for airborne viruses like colds, flus and other viral
    populations to enter respiratory pathways.


    The fingers of the forests touch the atmosphere and dip into the human heart to
    keep it pumping. The song of the forest signals spring and health for the whole
    world. The forest system of the boreal, seen by so few people, has a profound
    effect on individual health. The plume of oleoresin aerosols will take physics
    a long time to examine in cloud chambers. Medicine will take as long to forge
    new protective biochemicals from the boreal. But the ancient wisdom of nature
    is ready to teach us that we are all connected in a web of life.'
