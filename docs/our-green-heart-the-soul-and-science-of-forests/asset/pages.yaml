  md: '# An Entanglement of Oaks


    As we stare down the climate crisis, attempting to come to grips with its current
    and future impacts, biodiversity brings blessings to buffer our world. Trees have
    their own history. They have already lived through ages of crisis on Earth, and
    they have developed strategies and solutions to cope. Many families of trees acted
    as pioneers in the past, and they can do so again, since the memory of past climate
    events is maintained as a living library of lessons within their physical structures.
    Hopefully, the trees'' epigenetics will guide their growth into a more stable
    situation, but this remains to be seen.


    Maintaining existing biodiversity, particularly in native forests, is so vital
    because not all trees are equal in their ability to survive change. The story
    of any adventurous species—by this mean trees or forests that venture into and
    then survive in unfamiliar and unforgiving environments—is a formidable one. Their
    success is the result of tailoring their genome to fit into a particular habitat.
    The DNA algorithm eventually learns to modify its behaviour to suit the complexities
    of the landscape. This can take millennia, but it often results in something new
    being added to life’s tool kit for survival. Dry areas, for example, smile on
    the white Leguminosae family—like the Gleditsia or honey locust, Acacia shrubs
    and trees, and the yellow-blossomed Sophora chrysophyllum—and conifers have also
    picked up tricks to deploy in parched conditions. Desertification changes the
    cuticular windows on leaves to produce blue-green trees. In addition to this,
    the trees produce specialized beards on their mouth parts, or stoma, to conserve
    water.


    Biodiversity is also linked to aromatic molecular diversity. Generally speaking,
    different tree species within the same family show a similar pattern of biochemicals.
    However, the species of trees on the margins of life'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'show different titres of these chemicals, often present in unusual amounts
    and concentrations. These differences, in turn, affect the internal workings of
    the tree, right down to the growing tips of the roots. These areas need the darkness
    of the underground to operate. The asexual hyphae of fungal mycelia listen to
    these chemical notes and change sex. Cyanophyta in the soil can do the same thing.
    Viruses and bacteria may come along for the ride, and the bacteriophages blast
    apart to search for useful fragments of DNA, which are fitted and patched to make
    a new whole.


    The real genius of trees, though—one that has gone under the radar of science—is
    not to be found in any specific adaptation, but in the way adaptations in a forest
    mesh. Each tree of a forest holds a unique set of genes, much like each individual
    member of the human family. So, a native forest with its full range of biodiversity
    is able to generate even more change and adaptation. No two species are exactly
    alike; nature and nurture see to that. Biodiversity enhances nurture in nature;
    a mother will recognize her saplings and protect them with an underground plume
    of chemistry, strengthening them so more will survive. There seems to be a chemical
    conversation of identity between blood relatives, even if that blood is green.
    Biodiversity enhances a tree’s or a forest’s survival in ways science is just
    beginning to see.


    The oaks of the northern hemisphere, all six hundred species of them, seem to
    be the leading path to stop climate change. A mature oak has an enormous ability
    to sequester carbon dioxide out of the atmosphere, even under the severest growing
    conditions. Luckily, the genus of Quercus, of the Fagaceae, or beech, has spread
    itself comfortably across the entire hemisphere, still represented in most northern
    forest systems and valued for its merits of biodiversity alone. They also remain
    a most important hardwood. The most sacred tree of the Celts—dair in the Ogham
    script—oaks have shape-changed from deciduous to coniferous in habitats with lower
    autumn and winter temperatures, to evergreen when growing nearer the heat of the
    tropics. They have also developed botanical “sunglasses” to cope with the glare
    from brilliant sunlight. These glasses'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'are worn on the upper surface of the leaf, a cuticular layer with all the transparency
    of silica glass. The layer is a resin, and this resinous pane allows the sun to
    penetrate without injury to the internal organelles of the leaf. In tropical regions,
    the adaptation is taken even further. The trees use another cuticle of resin on
    the underside of the leaf as a deflector to protect the circulation of the leaf
    from reflected and refracted light. These reflectors help with water loss also.


    Oaks have learned to live and stay healthy under the maximum ultraviolet radiation
    from the sun, and it is this adaptation that has turned the tree into a warrior
    to fight climate change. The tree manufactures twin biochemicals, quercetin and
    quercetin, that course through the entire canopy of the tree. When photons hit
    the canopy, they displace electrons from the chlorophyll in a one-on-one ratio.
    The spare electrons produced from these collisions are captured by the quercetin
    and quercetin, and slowed, becoming pye electrons that are funnelled into photosynthesis.
    This action is called quantum lifting. In the green hands of nature, the small
    and very small acts of photons and electrons count because of their high volume
    during the sunshine hours of the day. The same principle governs a hive of bees.
    It''s not the single worker bee that is important, but the hive''s two to three
    pounds of bees, which come together to complete the tasks that keep the hive operational.
    It is the volume counts.


    It could be, then, in the leaves of every oak some of the most pertinent answers
    to the question of free energy are staring us in the face. I have long been interested
    in material physics and energy storage. About fifty years ago, I modified an electron
    microscope to focus the electron beam for bombardment. I chose plant species I
    knew were high in molecular aromatic compounds, like the oak with its twin biochemicals.
    The beam converted their pye electrons into light energy, and I called that afterglow
    effect cathodoluminescence. I could repeat the results faithfully, and I published
    a paper on the discovery, for which I received an award. My work was important,
    and still is, because it showed that photons and electrons are interchangeable;
    both bundles of energy that can be used in the same way. In the early stages of
    quantum computing, researchers'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'focused on the movement of electrons. Now they are realizing that photons can
    be used to make quantum computers too, having been shown to exhibit entanglement—that
    ability to be in two places at once. This ability is extremely important for energy
    flow and capture, and trees are masters at this game.


    Answers from nature can stare us in the face and we never see them. We need to
    learn to pay attention to what''s standing in front of us.'
