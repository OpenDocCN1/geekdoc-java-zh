- img_proc: true
  md: 'as a whole. This form of unity is called céile, and the action of it ag táhú
    céile. The most direct translation is “binding to each other.”


    Ancient Irish wisdom recognized céile in music and poetry, meditation, solitude,
    silence with another person, prayer and song. Céile was both a source and a result
    of inspiration and imagination, evident in the spoken word of entry required at
    any gathering, whether in a humble house or a castle. Everybody in the Celtic
    world had their “piece,” either poetry, music or song. They were expected to add
    it to the feeling of céile in any celebration or collective, helping to bind individual
    existences into a larger, stronger whole through shared emotion and understanding.


    I still see céile in action in the prayers of religious institutions throughout
    the world. Teachings from many holy books are chanted; the strings of wisdom and
    love are held near to the heart. Such actions are healing. They promote health
    by reducing the titre of adrenocorticotropic hormone in the blood, reducing the
    effect of aging on the body as a whole.


    The Celtic civilization made its way across the world. One place it set down roots
    was North Africa, and céile has appelgänger in Berber culture. The spiritual and
    emotional glue that holds cultures together is called asabiya and asabiyyah. It
    is the intense feeling of togetherness that binds a culture in the beauty and
    symmetry of the written word as a wonder for all to behold.


    China, too, did not escape wanderlust. Ideas travel faster than the wind and hold
    lives of their own. Cultural connection was known in the time of Confucius and
    Wu lun. The ancient Shang or Yin people who settled along the Yellow River in
    north-central China did so a millennium before the birth of Christ. These people,
    like the Celts, showed great technical skills in the arts of metalwork and pottery.
    Above all, they created a written language, their characters the direct ancestors
    of modern Chinese characters. The fragile pattern of the Celtic Ogham script shows
    some similarity to these Chinese characters. Both cultures, half world apart,
    enjoyed an acute appreciation for art and its power to bring us together, help
    us grow stronger through shared understanding and experience.'
