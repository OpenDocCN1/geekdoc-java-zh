  md: '# What We Still Don’t Understand


    I have a research garden, a place where I conduct botanical experiments and make
    observations, and where I investigate plants for their various hidden traits.
    I also have my own arboretum, by definition a place where trees, shrubs and herbaceous
    plants are cultivated and grown for scientific and educational purposes. Arbreta
    are usually attached to a university or government endeavour. Unfortunately, such
    delights have lost their flavour in modern times and have gone out of fashion.
    I keep both my research garden and my arboretum at my home in Ontario, unattached,
    as it were, save to me.


    My arboretum is something like Noah’s ark. I am attempting, against all odds and
    with very little money, to maintain and protect some of the most valuable genetic
    traits in trees. There are certain criteria I use, and strict protocols I follow.
    I practise quarantine. Everything is, de novo, grown from seed, even the biggest,
    tallest trees, so that no plants come into the area of the garden with soil attached.
    No grafted material passes my gates. Grafts can be hidden breaches, holding viruses
    or bacteria that show their face when the tree is stressed. I look only for rare
    and endangered species. Sometimes I think they, too, look for me.


    Once I obtain my quarry (at the moment, I am after the most nearly specimen of
    Carya toomentosa, the mockernut or butternut hickory, once native to the southern
    parts of eastern Canada and used to preserve food), I set to work. I place the
    seeds into a trial area. As the seasons take their toll, I watch and observe.
    I look for characteristics that will carry the adult tree safely into and beyond
    the problems of climate change—such as frost and drought resistance, and a tolerance
    for extreme temperatures. All seedling seedling trees show variations in the limits
    of what they can endure.'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'In the end, I decide who lives and dies. I choose the best of the best to carry
    on the business of being a tree that the world can depend on for primary plant
    protein, strength, shade, and universal foods for nature. This is the central
    focus of my fieldwork, but in looking for these signs of strength and adaptability,
    and in reading the work of other dedicated botanical observers, more discoveries
    come to light. And, just as importantly, so do other questions. Forests present
    many mysteries to science. They are huge, co-operative living things, full of
    invisible interrelationships, and operating on a time scale far beyond our. Scientists
    can see and record what is right in front of their eyes, but what about all that
    isn''t? The natural world is complex. There is a never-ending stream of important
    questions that still need to be answered—one of which is how to strike a harmony
    with atmospheric carbon dioxide before the level of this gas goes catastrophic.
    I believe that nature holds the solution to this question.


    The diversity of tree trunks and the differences in their dressings of bark are
    obvious. By the powdered periderm on the surface of the bark is not obvious at
    all, even though it is vital. Periderm is like a dry skin formed from the epithelial
    cells of the bark, which sometimes becomes powdered, like talc. Then, in the winter,
    it acts as a reflector, preventing a kind of winter damage to the bark called
    “southwest injury” because it is cracking of the bark on the lower southwest part
    of the trunk. Periderm may be enhanced by the presence of lichens, mosses, land-adapted
    algae or even shade-loving plants, if the tree is old. Also, scientists have rarely
    studied the lenticels slabs in the bark that allow gas exchanges into and out
    of the trunk.


    There are also species, like the cone-bearing redwoods, the giant Sequoia sempervrens,
    whose canopies remain guesswork because the trees are too tall to study. Across
    the ocean, in Australia, is another giant, the tallest flowering tree in the world,
    Eucalyptus regans, also called the mountain ash eucalyptus. At maturity, this
    product of Tasmanian soil can stand over thirty-three storeys high—over a hundred
    metres. These trees are'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'being before we''ve been able to study them and understand how they function,
    even though they are the largest green machines on the planet.


    We also need to study how seeds are protected in nature. Much of that protection
    comes from a process called dispersal. Each family of trees on the planet uses
    its own means of dispersal. These unique patterns shed a strong light on the genius
    of each species'' design, which is concealed within the seed. In other words,
    the strategies a tree develops for distributing its genome offer valuable insights
    into the family as a whole. Many of the monotone tree species, such as the Abies,
    or fir, specialize in enabling aerodynamic lift. The seed has a sail attachment
    that is matched to the mass of the endosperm, enabling it to fly very long distances,
    even over chains of mountains. Then there are the plumb-line seeds, like the Tilia,
    or basswood. The sweetness of these seeds is an entitement to rodents to gather
    them for food. The seeds of nut-bearing trees take it a step further; their three
    fatty acids enhance the memory of the birds that eat them, the reward for the
    tree being that the birds remember to come back to that tree for another year''s
    harvest. There are seeds that require either smoke or fire to grow. To break their
    dormancy, the seeds of the Magnolia acuminata, the cucumber tree, require eddies
    in waterways, with a flash of nitrogen from thunderstorms.


    Most seeds carry a dormancy factor, the proteins of their endosperm supply literally
    coiled and folded into resting states that wait for a particular signal. These
    signals are a form of divination, an assurance strong that the seed bets its future
    on that message. They are not properly understood in science and have not been
    studied in great depth. Sometimes a tree senses a looming problem and aborts its
    seeds for the sake of its own health and well-being. Other times, as in a year,
    an entire forest will bet in the other direction and, suddenly, produce a great
    waterfall of high-quality seeds. In my forest, the Acer saccharum, or sugar maple,
    seems to produce a mast year once in forty years. Sometimes my nut trees, especially,
    greet the spring with lots of potential, both male and female catkins busy with
    flying pollinators. An excellent crop sets, something happens and the young nuts
    before they ripen, carpeting'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'the ground. In a matter of a few weeks, the answer is there in the form of
    an early frost or a deadly drought. We don''t know how trees come to any of these
    judgments about the future.


    Mast or no, forests and hedgerrows feed the hordes of nature. Migratory birds
    and insects depend on the products of the forest for survival and reproduction.
    Seeds are just one source of food. The pollen and nectar from flowers are others,
    and they are relatively well understood. But then there are extras that haven''t
    been much studied, which exude a sweet carbohydrate from openings in leaves or
    bark. This nectar is an endurance food necessary for insects and migratory butterflies.
    Trees also produce a huge range of resins, many of which may up the antibiotic
    and fungicidal wallpaper in the brood chambers of pollinating insects, including
    honeybees. These resins are not yet well understood chemically, though some work
    is presently done on them.


    Butterflies seem to rest on leaves and to groom the cuticular layer for a multitude
    of metals. They also groom animal feces for the purpose. Metals are the cornerstone
    of colour, and colour is essential for a butterfly''s safety and sexuality, like
    a colour-coding system for protection. When a butterfly''s colours and patterns
    strongly mimic a predator''s, that predator turns away from it, saving the day
    for the butterfly. Also, the stronger the quality of the colour of a butterfly''s
    wings, the greater its sexual ability. "Flash" in a butterfly is rewarded.


    Beyond energy and nutrients, forests also supply shelter. The mammals that make
    their home in the forest have little protection across the world. A man in China
    with an excess of yuan in his wallet seems to feel the last horn of the white
    rhino should be his. This is the same cavalier attitude with which people treat
    the last forests of Abies religiosa, the sacred oyamel in Mexico that monarch
    butterflies need for resting and ingest metals. We need to learn to respect our
    fellow creatures'' right to protection and a home; many valued species will go
    extinct, and soon. It is a problem of ethics and international law, especially
    for marine life.


    A forest is a parade of species united into a community. Biodiversity of sexuality
    is itself a safety net for life. The unanswered questions here are'
