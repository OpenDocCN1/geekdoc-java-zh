  md: '# The Magic of the Kingnut


    I have a scientific interest in the walnut, or *Juglandaceae* family, and in particular
    the hickories. This genus, *Carya*, consists of a small pool of twenty to twenty-five
    species worldwide. These are monoecious trees mostly native to North and South
    America, though a small few are also found in Asia and Europe.


    The walnut has had an intense relationship with the terroir of the Americas for
    a long, long time. The solar exposure on the two continents is very strong. Evidence
    of this photonic abundance is seen in the crop of nuts these trees produce every
    year; every aspect of the walnut''s comfortable ride in the sun is unique to these
    trees. The leaves are pinnate. The trunk is rough and thick. In the spring, all
    the roots'' growing tips, or apical meristems, are large, hairy and orange-pink.
    The rule of thumb for theing of these trees? The larger the meristem, the bigger
    the nut.


    For quite some time, one member of this family has been on the inventory of rare
    trees I''m determined to foster. It is the kingnut, *Carya lacinosa*, also known
    as the shellbark hickory. It holds its genetics in the arboretum on my farm in
    Ontario, but I want to expand this genome by adding similar from different forests
    native to Canada. This has turned out to be a more difficult task than I initially
    envisioned; these trees have been cut to near-total extirpation in Ontario due
    to development along the Great Lakes.


    I look for the kingnut regularly in my travels. It is an easy tree to spot, even
    at a great distance, because the bark curls. A mature kingnut is a feast for the
    eyes; long plates of its bark repelled by its cambium and curl into six-foot lengths.
    It is as if the tree is shaking from its own skin. In fact, the curl is a clever
    twist and not just a strong aesthetic'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'statement. It makes the bole difficult to climb, protecting the tree’s canopy
    from such grazing animals as porcupines.


    When, in November 2019, I was asked to help save a five-acre plot of mature forest
    for a children’s forest school near Windsor, I talked to the local rangers, who
    thought might have come across some unusual hickories growing in the area. I was
    hoping they might have spotted the mighty kingnut. But they shook their heads
    and told me, “The tree has gone.” The developers had been busy all day. Still,
    I asked the rangers to keep looking in case, someday, they came across a kingnut
    in a forest. That wild tree would be one of the last of the species in Canada.


    One bright morning the following fall, I received a small box that had been sent
    express by one of the rangers. I opened it, and my delight five kingnuts beamed
    up at me from the protection of their light-brown winter overcoats. They had the
    ridges, with a sharp beak at the apex of the nut itself. They were somewhat flattened,
    so that they seemed to have four distinct sizes. I knew that if I cracked one
    and took a nibble, the nutmeat inside the buff-coloured shell would taste sweet
    on the tongue. They were a bit small—the parent tree was obviously suffering from
    a lack of water and diminished soil—but they were kingnuts. I held five hard-nosed
    babies in my hand.


    The next task before me was to persuade these unique nuts to grow. This can take
    a long time, much patience, and more scientific ingenuity than anyone might imagine.
    Each nut is a seed, an embryo, wrapped in a protective shell. The embryo is like
    a biochemical rocket, but it requires the perfect conditions to ignite. When the
    nut dehisced from the parent tree, it is expecting all kinds of trouble, which
    it avoids by remaining dormant. The flesh of the seed goes into a deep, timed
    hibernation, primarily to get through the winter months.


    The challenge of breaking this dormancy is not significant if there are lots of
    C. lacinosa in the forest; with nuts readily available, one or two mistakes really
    don’t matter. But if you are holding only five nuts in the palm of your hand and
    you know well there is a high possibility these are the last of their kind, that
    is another matter entirely. You are dealing'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'with a living species that cannot speak give you instructions for its survival,
    and there is no margin for error.


    The five nuts in my possession were made even more important by the fact they
    came from the most northern point of the terroir, or present ecosystem, of C.
    laciniosa on the North American continent. The syncopation with the solar system
    in a northern nut makes the tree easier to grow, because there is less physiological
    stress on it. In addition, when crossed with a southern tree, a northern species
    produces a better hybrid, with more genetic vigour. This hybrid vigour gives it
    a greater ability to withstand disease and remain healthy in the eye of the coming
    storm of climate change.


    The biochemistry and plant physiology of deep hibernation is poorly understood
    in science. The flesh of any nut is a true embryo of the future tree. Squashed
    inside the testa, the protein, sugars, essential fatty acids and mineral micro-elements
    are the food stores of survival. The proteins are stacked and bent to fit into
    a small space—think of folding lawn chairs. The sugars are conjoined into a polymeric
    form. The necklace of essential fats is threaded throughout. And minerals are
    most probably chelated to, and by, the high-molecular-weight proteins. (Chelation
    is a process in which metal is added to a large molecule as a transport train.)
    There are also protective medicinal compounds in the husk. Anyway, all this biochemistry
    must be unbuttoned before a germination roll can any hope of being answered.


    My five kingnutts went into a large flowerpot. I planted them about five centimetres
    in deep dark, sterile potting soil. They were kept in partial shade, and treated
    to a daytime temperature of 30°C and a nighttime temperature of 20°C. They were
    lightly watered. This process went on for two years. Eventually, I assumed my
    charges had decayed and died, so one spring morning, in a state of scientific
    depression, I planted them out in the vegetable garden. I could not think of any
    other trick to play on them to break dormancy. I marked the site and got on my
    life, expectations nearly non-existent.


    In late June, I saw something that absolutely astonished me. The kingnutts had
    broken open; the testa had split and the integument membrane'
