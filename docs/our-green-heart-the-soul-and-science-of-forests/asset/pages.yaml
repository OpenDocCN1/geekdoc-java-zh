    In the countryside of the Western world, where once-dainty farmers'' fields have
    gone oceanic in size, renewing the hedgerows and forested fences will once again
    guard the soil from erosion, and harbour boundaries of wildflowers and berries
    to maintain the birds and bees. Farmers and hedgerows feed the future, replacing
    the industrial farms and hedge funds that feed only famine.


    Third comes education. The urban populations of the world need to be reminded
    that forests were in everyone''s past. People must go outdoors and meet the trees
    standing in nearby forests and parks. They must also go to the library and examine
    a guidebook about trees. Remember, the trees each person plants and protects be
    local native species. Learn how to collect seeds from them. Learn the tricks of
    germination and growth. Children are fascinated by these processes, so work to
    introduce these ideas into your local schools. Write letters to these institutions
    and the bastions of higher learning. Ask for help. Go to a farmer or a gardener
    for such help and they will be your friends.


    When in doubt about what to plant, look to the oaks. A fine beginning in the fight
    against climate change lies with the Quercus of the Fagaceae family. From some
    six hundred species of deciduous and evergreen oaks across the world, there are
    one or two oaks native to practically every country—some countries have many more.
    Regardless of type, oaks carry many advantages as a first species to be planted
    in the global Bioplan.


    Unlike many other species, oak trees will tolerate lime, provided the soil is
    deep and rich. They produce acorns, for sale in markets around the world, meaning
    they are also anti-famine trees. Acorns can be ground into flour, roasted peanuts
    or just simply baked, though some species need the addition of potash or potassium
    hydroxide to leach out the bitterness of tannins.


    The anatomy of the oak is important too. As the tree ages, the horizontal branches
    extend towards the ground, where they take root and spawn secondary canopies into
    the open edge of the drip line. This means mature'
