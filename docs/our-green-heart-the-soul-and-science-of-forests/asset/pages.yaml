  md: '# The Star of Nature


    Sometimes in the spring of 2010, I received a casual invitation to join a bunch
    of women for lunch. The spot was the National Arts Club on Gramercy Park in New
    York. I was also asked to speak, but it was impressed on me that my remarks need
    be nothing fancy: “Oh, just a few minutes will do. It is all informal. You can
    do it before coffee and dessert if you like.”


    As it turned out, I was joining a group of women scientists for that lunch, including
    professors from the top-tier universities in the United States. A lot of them
    were there already when I arrived, and they kept coming. Extra chairs were ordered
    and squeezed into place around the round tables.


    After the soup was served, a woman rose to my left. She was welldressed and armed
    for combat. I could feel the electricity in the air as she stepped to the stage.
    With the grace of a ballerina, the female scientist drew down a screen. I noticed
    her nails were perfectly manicured. As she began to speak, a slide was projected
    onto the screen, replete with numbers and pie charts and enough graphs to strangle
    a giraffe. She clicked to a second slide, then another another, one after the
    other in a cascade of colour. She was extremely impressive. Her knowledge of her
    subject was so smooth and well presented with a calm like a curtain fall over
    the listeners. I guessed that she ran her lab with the same kind of ease and polish.


    As instructed, I had prepared nothing. I looked around for an escape, but there
    was none. I would look like a fool—indeed, I was a fool—so I stood up excused
    myself, hoping to step away and collect my thoughts. I walked, with as much dignity
    as I could muster, out of the dining room, down the magnificent gleaming staircase
    and out into the expensive dust of the streets of Manhattan. I looked around,
    hoping to stumble upon a miracle,'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'and I saw a tree, one of many lining the street, each in its own tall, black,
    wrought-iron cage of respectability. I breathed a sigh of relief. The trees were
    Tilia cordata, the small-leafed linden. I was alone on the street, and guiltily
    reached up and plucked a lime-green leaf, just in its expansion stage. As I stared
    at my green friend, suddenly, and seemingly from nowhere, a young man appeared
    in front of me, tall, blond and handsome.


    Where did he come from? I asked myself, a bit frightened by his sudden appearance.
    But the young man smiled at me, completely at ease. He watched me study the perfect
    leaf, his mid-vein taut. I laid it in the centre of my open hand and looked at
    it some more, then gently closed my fingers around it in such a way that the leaf
    would not be crushed.


    The young man leaned towards me, and with another smile on his lips and in his
    eyes, he said, "I see you have a tree star." I looked down at my hand, then up
    at him. He was gone. I was surprised, even a bit shocked, and looked up and down
    Gramerc Park, but there was no sign he had ever been there.


    By the time I re-entered the dining room, it was my turn to speak. I walked towards
    the stage with the leaf concealed in my hand, my arm in the air. I announced to
    my audience, "I have something in my hand. It is living. It is breathing. It has
    cells, and in that cellular tissue it has RNA and DNA. Can anyone guess what I
    have?


    The audience shrank away from me a little bit, but a few called out their guesses.
    "A mouse?" "A frog?" "A beetle?"


    I opened my hand to reveal the leaf, I proceeded to lecture on the quantum reality
    of photosynthesis and the dance of short wavelength light required to operate
    its universal system—all from the altar of a simple leaf.


    Some women at the edge of the audience began to cry. Many people who were there
    that day still remember what I said. People do not expect the extraordinary to
    stride out of the ordinary. Neither do I. The young man was right. I had a real
    star of nature, a tree star, in my hand.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'A leaf is a perfect case of intelligent design in nature. Every leaf from every
    plant is a living thing complete with its own DNA. In a basic sense, it is a solar
    platform with a mobile arm. This green thing tracks the sun from morning to dusk,
    anywhere and everywhere on planet Earth. It is a guided tracking machine that
    functions in the air. It exists underwater, though marine forests carry a different
    design, one meant to handle the resistance of water. They are also stacked vertically
    in their habitats to receive maximum sunshine.


    Leaves come in all shapes and sizes. They can vary from a needle whose sharp point
    can penetrate the skin, to the ovular, spade-shaped, handprinted and multi-lobed
    abundance of obovate and spatulate, trifoliate and palmate. In general, the shape
    is dictated by the genome of the family into which a tree fits. The more complex
    leaves belong to some of the most interesting species on the planet. Sometimes
    a translocation, or rearrangement, of DNA takes place and all of a sudden, often
    to the surprise of science, there is a new kid on the block. The new tree or plant
    is called a sport.


    The blade of the leaf is held in position by a slender called a petiole. These
    parts can be very short, the leaf seeming to spring directly from the stalk, in
    which case it is called sessile. They can also be very long. The petiole controls
    the movement of the blade, or lamina, of the leaf. This movement probably has
    a basis in the physics of osmotic pressure, but it is not conclusively known how
    it happens. This is just one of the many fundamental, essential facets of tree
    and forest life that remain mysteries to science.


    There is one family of trees found across the world whose petioles have an unusual
    work habit. This family is the willow, Salicaceae, whose genus, Populus, is remarkable.
    These trees, numbering about thirty species, are nature’s green windmills. The
    mass of the blade of the leaf matches the length of the petiole in such a way
    that even the smallest change in air pressure is expressed in movement. This incredible
    motility is captured in the name of the tree, *Populus tremuloides*, the quaking
    or trembling aspen, which rings the bell of any change across the world.'
