  md: 'We don’t yet understand many seemingly fundamental processes in these ecosystems.
    Even observable phenomena remain mysteries when it comes to their sources or internal
    mechanics. Phototropism, a plant’s ability to reorient towards a light source,
    tracking the sun across the sky, can be described in the language of chemistry
    and biochemistry and biochemical interactions not yet clearly understood that
    operate in conjunction with the sun. The upward movement of aerosols from the
    canopy can be witnessed in the hint of evening light at the end of a very sunny,
    humid day as a blue haze veiling the horizon. But the physics of this movement,
    which parallels flight and lift on a molecular level, are not understood. Nighttime
    brings about changes in forests where the trees go into their respiration mode
    of breathing, just like their animal counterparts. The transpired carbon dioxide
    hits the atmosphere from the trees in the forest and joins forces. This act induces
    movement by osmosis in leaf petioles, leaves and flowers, shutting them down for
    rest. The enigma of a forest in nighttime remains a mystery to science.


    Most fascinating of all, though, is transpiration—the complete understanding of
    which would earn a Nobel Prize. All trees can run a bead of water in their xylem
    plumbing uphill, against the law of gravity. This act seems to defy physics, yet
    trees do it every day, carrying water sometimes as high as a forty-story building—and
    maybe higher if one factors in the length of the root system—and science cannot
    explain how. The solution to this problem haunts me. I am stung by the fact that
    I cannot find an answer. Transpiration is as important as the global supply of
    potable water, because transpiration is the key to the clean water. Pulling water
    up from their roots, the trees act as molecular filters. By the time the water
    is released into the atmosphere as vapour from the leaf pores, it is pure H2O,
    without any pollutants in it. In other words, all trees function as purification
    units for water. In the laboratory, especially in an organic chemistry laboratory,
    double-distilled water is the only form used in reactions. In my case, it was
    the only form I used to elucidate biochemical pathways. If the still stopped,
    I stopped. The trees produce water of a similar purity to double-distilled water
    all over the world, every single day.'
