  md: '# When the Land Breaks Its Silence


    From the land all children are born, on the land we live, and into the land each
    of us must return when we die. The land is holy and should be venerated. It holds
    the voice of creation. Sometimes it speaks, breaking the silence of its own wonder.
    When it does, those who are close to it, who breathe its perfumes, listen. They
    know the land is the very best of teachers and holds out the hand of wisdom.


    Each summer when I was a girl, I was sent to live with my great-aunt Nellie and
    her son, Pat, on their farm in the valley of Lisheen in southern Ireland. They
    were subsistence farmers, living off the land just as people had in the valley
    for hundreds of years. With them, I first witnessed a deep reverence for the land
    with my own eyes.


    Pat, my cousin, was a grown man, hardened by the labour of caring for the animals,
    of sowing, reaping and harvesting without the aid of internal combustion. He would
    walk to the top of the Droim—a word that denotes not only a human''s or an animal''s
    back but a field with the shape of a back, from which binding spells were in ancient
    times. Pat would stand there alone. He would stare at the hills, holding his arms
    out to embrace the fullness of the landscape, drinking into his soul. After a
    time, he would turn one step to the Caha Mountains, which stretched across the
    horizon to the north of the farm. The range spoke to him like a mother, a voice
    of enveloping care.


    Filled with confidence in the land''s protection, Pat would then begin a recitation.
    Like telling the beads of a massive rosary, he directed his attention to each
    peak in turn and spoke its name: Snoc buí, then Dchas, then Doughhill, and finally
    Séithe, with its cape of mist lifting into the sky. His naming of this rosary
    came from his ferocious love of the land. It was an acknowledgement of the purity,
    perfection and beauty in front of his'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'eyes. It was also an expression of his breathless wonder that such beauty was
    his to behold.


    Pat''s singsong of words was in Old Irish, spoken and repeated as a blessing since
    before the time of Christ. It connected with a memory held deep in the land, under
    its green apron of fields and the rushing water and azure sky. That memory came
    alive as he spoke and listened, and it fed him with dreams for tomorrow. Sated,
    Pat would turn slowly and follow the bótharin towards home. That path had been
    made by his milking cows, with their ringleader, Strawberry, at the head. It started
    at the crest of the Droim and wandered through the grasses and wildflowers, then
    along a holly lane past the slate well. As the lane met the farm buildings, the
    blood-red bells of the fuchsia hedges gave onto the cow stalls, the turf reeks
    and the stables, and called Pat back to the business of the day.


    As I grew a little older, I began to make my own pilgrimage to commune with the
    mountains. I walked the bóarin to the entrance gate. I stood on the lowest rail,
    fixing my sandals into place, hung on my hands and began to swing. The gate swept
    back and forth, rattling with rust, as I craned to look at the landscape. Slowly,
    a silence filled my mind, tended by something deep within me. There wasn''t another
    person in sight, but I did not feel alone. I was in the company of something powerful
    that held me closely in a cradle of hope.


    I, too, named the mountains. Then I added the names of the fields, which stood
    like friends behind my back, in rhyming order. The long Inch field was by my side,
    keeping a secret in its ground: a hive of dark honeybees who fed the wildflowers
    of the hayfield. I watched those bees come and go, rising purposefully above the
    acidic chrome-yellow and needleled foliage of the gorse. The purple heather floated
    over the hills like a crowning halo. I watched and waited. Then I went down to
    the farmhouse kitchen, happy and content.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'Nellie was a younger sister to my grandfather on my mother’s side. She was
    said to have one of the most beautiful women in the south of Ireland in her youth.
    In my eyes, her beauty multiplied with her silver hair, held in place by a tortoiseshell.
    She wore a long skirt and petticoats, all handwoven and driven by simplicity.
    Her linen blouse underscored the smoothness of her skin. Wrinkles did not set
    on her face. They did not dare.


    My parents’ romance had been tumultuous. My father was descended from English
    aristocrats, while my mother’s noble Irish lineage stretched back generations.
    Nellie had the courage to welcome me into her home, ignoring my Béarla ceart,
    or King’s English. Every word that came out of my mouth confirmed that I was a
    Sasanach, a breach in the family, an English-speaking child, but she never treated
    the anglo parts of my identity as an offense.


    When I saw her for the first time in front of the ash tree, she took my breath
    away. The giant tree stood over most of the buildings on the farm and acted as
    a sundial of shade. In the afternoons, Nellie would tidy herself up for a visit.
    Then she would go to the sacred tree, which carries many names. The European ash
    is known in Latin as Fraxinus excelselsior. In Old Irish, it is known as nom and
    the letter N in the ancient Ogham alphabet of the Celtic civilization, the sacred,
    tree-based script that formed Europe’s first written language.


    Nellie would stand face to face with the tree. Both the visitor and the visited
    always stood stood-still and seemed to gather a web of silence around them. It
    was not an ordinary silence, but a form called tost in Irish. This is the word
    for a dead or breathless silence of the kind obtained only by deep meditation.
    In this tost, the two still seemed to communicate, a silent ripple passing from
    woman to tree and back again. It was as if they shared secrets so profound only
    silence could carry their special intimacy, like a long-married couple sitting
    together in close comfort without saying a single word—a silence that also carries
    an understanding of itself. This is the connection we all crave in our lives.
    Nellie had at her fingertips. This was clear to me, even as a young child.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'Nellie did not attend church. She excused herself from such prayers. She was
    suspended in her beliefs between the ancient world and the “new.” She could see
    that the people around her were leaving behind the best of themselves, writing
    off wisdom built over thousands of years as valueless, and she did not like what
    she knew was coming down the road for the human family. So she walked me out to
    the hedges and the sides of the road, where the camomile flowers grew. She told
    me that chickens needed camomile to keep them healthy. She crushed the leaves
    and the little white daisy flowers and allowed me to smell the pungent scent the
    crushing produced.


    She took me by the hand and led me through the landscape, introducing me to the
    wonders hidden even in a blade of grass. She told me quietly that sometimes the
    landscape breaks its silence and speaks to those who are willing to listen. She
    led me to the wisdom of the land. She set me free.'
  merge: -1
