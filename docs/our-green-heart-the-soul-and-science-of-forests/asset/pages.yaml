  pgno: 29
- img_proc: true
  md: 'it can get any grip at all. And yet, today, we continue to destroy this incredible
    gift blindly, understanding so little of what we abolish and what we unleash.
    The endgame is now the bitter pill of a climate crisis, a pill we must all swallow
    whole, with no sweetness to wash it down.


    Much of the molecular machinery of forests has been removed; more trees are being
    cut as you read this. The carbon with its fast-action pairbonding is now left
    with only one place to go, and that is into the heavens. The sky is becoming dark
    with it. And as with all things in chemistry, the higher the temperature, the
    greater the reaction rate. The phenomenon of heat is biting at our heels. We must
    stop this monster in its tracks. We may not understand the process and solutions
    in all their complexity, but the trees and forests do. We must replant them. We
    must stop the cutting. Today.'
