  md: '# The Sound and Silence of Forests


    It now appears that, in addition to the language of chemistry, trees also speak
    in sound waves. The voice a forest produces, which can be heavy, even angry, as
    its trees sway horizontally in a high wind, is called “silent” sound, though it
    is silent only in the sense that it is too low for the human ear to collect and
    register it as a signal. Others can receive it—other creatures, other instruments,
    those who have learned to listen or who have not yet forgotten how to hear it.
    Very young children, still damp from the womb, can perceive tree sound. People
    who are particularly sensitive and creative, especially as they grow into adulthood,
    feel the signal in their upper chest. Music, opera for instance, can accentuate
    this phenomenon and move a person to tears.


    All sound has a wavelength. The rise and fall of the wave—its frequency—is dependent
    on the energy at its source, and the possible variance is immense. Every day,
    we are awash with sounds, but since the human ear can only pick up frequencies
    between, roughly, twenty hertz on the low end and twenty kilohertz on the high,
    some we hear and others do not. When physically disturbed, a hive of bees or wasps
    can produce a collective sound at such a pitch that most mammals flee to safety.
    Trees, on the other hand, prefer a sound spectrum of around twenty hertz and lower.
    Though these silent sounds, or infround, are inaudible to us, they are still soothing
    and have a repetitive lullaby effect on the brain of calming and care.


    Trees produce infrasound because of their unique internal design and external
    anatomy. They are nature’s strung instrument. The strings are the long threads
    of super-strong xylem tissue that run the length of the tree from top to bottom,
    as described in the My Mother’s Tree chapter. Each string is composed of a series
    of elongated, hollow cells, attached one to the'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'next like household plumbing. Given that the xylem tissue below ground would
    rival the visible parts of any tree for length were it to be teased straight,
    these strings can stretch, all told and on a good guess, up to and maybe beyond
    250 metres.


    The round walls of these internal threads are pitted. I noted this feature in
    an earlier passage on transpiration, remarking on the role pith play in a tree''s
    ability to move water uphill. They have another purpose, though, one that is better
    known to science. These pith, each the exact shape and size of the one ahead of
    it and the one behind it, allow for the movement and flexibility of the entire
    tree. They give the upper portion of the tree articulation in situ, allowing the
    bole to sway and the branches to bend with snow, wind and rain.


    As I''ve mentioned, deciduous or evergreen flowering tree always holds the shape
    of a child''s lollipop on a grand scale—trunk canopy. In young trees, the canopy
    is small and growing; in ancient trees, it is massive. Very often this canopy
    is composed of many crowns that act as one. Such a multiple canopy in an ancient
    tree produces a pitch of sound favoured by many species of songbirds. These birds,
    in turn, produce a mating song as pure as a bell, increasing their fertility to
    a broader mate selection. The better the song, the finer fledlings.


    The infround of a tree is initiated by wind. The canopy is caught and moves while
    the body of the trunk is stationary. The xylem strings are plucked, playing their
    homing sounds for safety, nesting, nurture and care throughout the forest. Some
    of these trees are markers for the birds, bats and other mammals of the woodland.
    The sound waves of infrasound travel great distances because of their low frequency.
    They amble the countryside with ease, though we have no idea what they communicate.
    We know that elephants carry out long-distance conversations with one another
    at around fourteen hertz, warning of dangers from afar. The listening animal receives
    the message as waves of resonance, leaning its large head and trunk in the direction
    of the sound. Very often an elephant will raise one leg off the ground, leaving
    the remaining three in place, which seems to allow it to concentrate better on
    the signal.'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'We don’t know why trees speak, but we do some idea how they listen. At the
    ends of a growing tree’s roots and shoots, there are always apical meristems.
    These are the buds and root tips that carry on and direct the business of growing
    on which the tree depends to remain alive and well. The apical meristem is a biochemical
    hub that is flooded with plant hormones. These green hormones are in similar structure
    to the human kind. One group stands out, because it stands alone—a family of sixty
    hormones known as the gibberellins. This family hangs on a frame known as the
    gibberellane skeleton, containing a nucleus called gibbane.


    The gibbane is a hearing aid for a tree. It is also the hormone that regulates
    the season’s growth—the progress later registered for posterity in the tree’s
    annual rings. The framework of the gibbane is a catch system for infrasound like
    a microphone; the tree is able to listen because it has a molecular hearing system.


    As a scientist, I have always been interested in such communication. I first became
    fascinated when, as a teenager, I observed my great-aunt Nellie communicating
    with the giant ash tree shaded their farmhouse. For my master’s thesis, I decided
    to test communication in trees myself, studying the beech trees on the campus
    grounds.


    It was early spring—probably February, because the growing tips of the beech had
    not yet expanded. I proceeded to get some fine-pointed syringes and make up different
    solutions containing various gibberellins I''d selected from the sixty or so of
    these growth-promoting and growth-regulating hormones that are active in trees.


    I injected the meristems just when the bark of the branch changes into the growing
    green of the leaf stem. I got some strange results. Both the injections and, on
    separate occasions, the action of me talking softly to the trees in the spirit
    of my great-aunt caused elongation of the apical meristem—in a single word, growth.
    Then I looked at the basic framework of the gibberellins themselves and found
    that the molecules had simple skeletons that looked to me like basic receptors
    for sound—the simple microphones I’ve mentioned.'
  merge: -1
  pgno: 149
- img_proc: true
  md: As vital as the role sound and infrasound play in a forest may be, theoretical
    and otherwise, there is also a need for silence—actual silence. All sound changes
    character in ancient forests. It is dampened, possibly by lichens, and the collenchchyma,
    sclerenchyma and suberin in the trees. These silences somehow register to the
    human ear as having a hush of great depth to them. They hold a form of stillness
    unique in the natural world. For those creatures who need it—I count myself one
    of them—this currency of sound has almost gone.
