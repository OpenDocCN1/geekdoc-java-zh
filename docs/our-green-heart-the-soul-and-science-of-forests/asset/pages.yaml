- img_proc: true
  md: 'holds one bountiful characteristic: it is free. Sunshine ploughs through the
    atmosphere and provides all the energy needed by nature.


    Carbon in the atmosphere exists as the gas called carbon dioxide, and that carbon
    can be recycled into a petroleum product. All that is needed to join the carbon
    atoms together in a usable form is energy, which can come free from the sun, through
    focusing the photons of sunlight. Focusing photons can create a heat so intense
    it can remake a molecule from scratch—more than enough to pair-bond the carbon
    back together. The energy such a carbon fuel produces carbon neutral; the atmospheric
    carbon can be recaptured over over again, managed harmoniously in nature''s carbon
    cycle, giving us the ability to reduce and control global temperatures.


    Luckily, hydrocarbons such as kerosene are very simple molecules, ten sixteen
    carbon atoms joined together like a daisy chain to make a molecular necklace.
    The ingredients for this fuel are already in the sky, waiting to be used. The
    first flight powered by such a fuel—the aviation industry calls "sustainable aviation
    fuel," or SAF—happened in October 2008. The European Union''s EU Blending Mandate,
    enacted in October 2023, specifically excludes any SAF from crops used for human
    and animal foods, directing the research on SAF clearly towards the sun.


    The making of sustainable hydrocarbon fuel deis provides the energy humanity so
    desires, while also sequestering carbon out of the atmosphere, where it is the
    leading cause of the temperature increases causing our climate crisis. This form
    of atmospheric sequestration will help global forests to regenerate and what do
    they do best, is to hold carbon dioxide in a fine balance.


    At the moment, nature needs all the help it can get. Biocustible fuels that we
    can burn within the safety net of the great carbon cycle may well be one answer.
    All energy comes from the sun.'
