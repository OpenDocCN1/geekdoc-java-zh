    # Acknowledgements


    I wish to thank the river of people who made this book possible. That river began
    in the valley of Lisheens in Ireland and flowed on to the nuns of St. Aloysius
    College in Cork. These people pushed me into my place of destiny, though at the
    time I didn''t know it. I was too young.


    My powerful editor, Anne Collins, uses the medium of laughter to reach perfection.
    Dare I mention strong tea with chasers of coffee, then chocolate, and huddling
    in our fur wraps against the chill of late winter. Evan Rosser, wordsmith, listened
    through a window drawn open in minus-zero weather to offer perceptive advice to
    writer and editor at work. Stuart Bernstein, my remarkable agent and, also, my
    friend, opens all doors in the world of publishing. Many thanks to you.


    Lynn and Nancy Wortman provided my word processing, washing my words with talk.
    Their friendship warmed my heart.


    Also, I am grateful for the art of Lisa Jager. She melted an idea into a beauty
    like paradise. John Sweet used the muscle of his brain to brawl his eye across
    the page for errors. Nobody is perfect.


    Then I must thank my darlings, Erika and Terence, who inspire me with their love
    and belief in what I do. My husband, Christian, is my brainbox. His support never
    fades, expressed in silence sitting by our Findlay Oval wood stove with cat on
    lap: a trinity of understanding. I have been lucky.'
