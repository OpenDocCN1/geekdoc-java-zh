  md: '# Communion


    Under a chestnut sky, the forest forgets the day...The ebbing sun fires fingers
    of light, the silence crackles...The trees sweep up the tide of time, a brush
    of breath moves a leaf to sigh, missing a moss with tilted sword, the canopies
    taut with loss...The pines preened and proud, the sounds of silence, a snake fern
    holds up its green joust, sex from the forest floor, anticipation with a filigree
    finery...Reflections in the coils of bittersweet berries now match the orange
    moon...Firefly trembles, flashing the silence out of night. The forest moves,
    a whip-poor-will finds a voice, resonating echoes, an owl awakes.


    This, is your world,

    naked as night.


    ![](img/9a73bd94214c184b1606db8dbb911966_8_0.png)


    ![](img/9a73bd94214c184b1606db8dbb911966_8_1.png)'
