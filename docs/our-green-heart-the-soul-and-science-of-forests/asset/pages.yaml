- img_proc: true
  md: 'Broadly speaking, a tree is an applicator unit. The trunk serves as an elevator
    to raise the hungry canopy into the sky. There, at the point of interface between
    the atmosphere and the leaf’s cuticle, an exchange takes place. The tree’s mouth
    parts, or stoma, are aspiration units, like lungs, and open to sequester carbon
    dioxide. The tree then divides the gas, keeping the carbon for food and delivering
    the oxygen into the atmosphere, along with a host of medicinal molecules and particulate
    matter. In the spring and early summer, this airborne matrix includes micron-sized
    pollen grains and fungal spores. On hot and humid days, methylated aerosols are
    also released, like balloons, from many other parts of the plant kingdom.


    As they rise, these masses of mostly invisible molecules bind with atmospheric
    moisture to build larger atomic forms, seeding rain and weather patterns across
    the globe. Clouds, like the summer clouds of my childhood, get down to the business
    of floating and become shade-makers, a low-altitude cover. In these clouds, the
    molecular aerosols from the forests act like tiny reflectors, scattering sunshine
    back into space. All in all, the forests and their companion biodiversity manufacture
    a molecular shade for the planet, just like an umbrella.


    In recent years, with the forests coming down, more and more of this umbrella
