  md: 'discovered that Nellie''s Irish moss had a Latin name. I found the entry for
    Chondrus crispus, and there it was, a red plant that looked like a head of lettuce
    gone wrong. I pulled books from the biochemistry section, and soon a mountain
    was piled around me, leather-bound and threatening an avalanche. It thrilled me
    to find myself hidden by books.


    That day I had an epiphany, a revelation that has lasted all my life. Chondrus
    crispus, a plant used by Druidic physicians in their sweat houses, contains hydrophilic
    colloidal binders that stabilize and potentiate other medicines. These colloids
    also have an antibiotic action, and today are sometimes used to treat stomach
    cancer. Chemistry allowed me to understand all the plant gives us.


    In time, I have come to the understanding that chemistry is the cipher of the
    trees and forests. The chemicals and biochemicals they produce in the great heights
    of the canopy regulate our living world. They are the source of most of our more
    complex medicines—anti-cancer, antiviral and inflammatory compounds, and pain
    relievers. The language trees speak is one of offering, care, empathy and mutual
    aid. For me, it took that teetering stack of books to unlock it, but I heard and
    felt it long before, and I know the language of chemistry is only one way to speak
    to the trees. In ancient times we listened to their messages, and they guided
    many of our actions. Answers to today''s problems require those same ears.'
