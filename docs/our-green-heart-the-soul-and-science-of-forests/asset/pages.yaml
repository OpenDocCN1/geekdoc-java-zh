- img_proc: true
  md: 'But with native forests coming down all over the globe, a serious genetic erosion
    is also occurring: forests are losing their biodiversity. This is happening due
    to ignorance, greed, war and simple carelessness. The mother trees of ancient
    pedigree are almost gone. Such trees carry a genetic flexibility from past generations
    into a growing forest. This injection of germ plasm into the gene pool is essential
    if are to combat climate change. The germ plasm from ancient trees has seen and
    endured variations of temperatures in the past. Their epigenetics hold a memory
    of stress. A mixture of very old trees with very young trees is healthy for any
    forest anywhere. The grandparent plasm can inject the grandchild with the knowledge
    necessary to survive.


    Time is running out to accomplish the task of saving these grandparent trees.
    The northern forests have lost so much already. Of the Ulmaceae family, the rock
    or cork elm, *Ulmus thomasii*, went first, followed by the beautiful, weeping
    American elm, *U. americana*. In Eastern Canada, few massive American *arborvitaata*,
    *Thuja occidentalis*, are still seen. The last greats of *T. plicata*, the sister
    tree called the western cedar, are under attack on Vancouver Island. The custard
    apple of the Annonaceae family and the pawpaw, or *Asimina triloba*, have vanished
    from the wild in southern Ontario. Of the Oleaceaceae family, the black ash, *Fraxinus
    nigra*, went first, followed by the white ash, *F. americana*, and far too little
    notice is paid to the loss of the profoundly blue ash, *F. quadrangulata*.


    Only a handful of hitchy pine, *Pinus rigida*, remain on the shores of the St.
    Lawrence River. This member of the Pinaceae family is a giant in the medicinal
    world as a source of antiviral medicine. Also in Canada, there are the two lost
    ladies of the Magnoliaceae family: the beautiful *Magnolia acuminata*, the cucumber
    tree, whose numbers are larger in one garden in Ireland than in all of Canada,
    and *Liriodendron tulipipera*, the tulip tree, which was so useful to the Huron
    people. All the oaks, the *Fagaceae* family, show the botanical world how badly
    they have beaten, especially the white oak, *Quercus alba*, which is down to retrograde
    species'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'with crooked trunks, where once upon a time these trees stood up to the stars
    like soldiers.


    The loss of these forest trees, and many, many others, also affects the streams,
    rivers and estuaries feeding into oceans, severely reducing the plumes of humic
    and fulvic acid that end up in coastal waters. These giant molecules are the last
    bonus of the forest mast, transcontinental carriers of iron, the vital metal that
    allows algae to divide. From this less obvious forest food, oceanic mast explodes.
    Even the great whales benefit, whether from a lifeline released directly into
    their calving grounds or from one dispersed across the oceans.


    Mast might be the old word for food, but it is also the secret key to life on
    this planet today, as it will be tomorrow. The design for sustaining every creature
    has always been here. It is just a question of opening both eyes to look and see.'
