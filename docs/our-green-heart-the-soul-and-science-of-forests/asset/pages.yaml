  pgno: 32
- img_proc: true
  md: 'Any native forest holds evergreen, deciduous evergreen and fully deciduous
    tree species. This tapestry of varying greens produces a cooling shade system
    in daylight. Under the towering and spreading canopies of ancient trees, the youngest
    can dance with their virgin leaves protected from the harshest ultraviolet rays
    of the sun. These killer UV rays have been amplified by the greenhouse effect
    of rising temperatures. The understorey tree species, in many older forests holding
    on to a great age, are protected. Through this sub-layer, nimble vines begin the
    uphill battle to reach the sun. If successful, these climbers also bear seeds
    in descending cascades, sometimes reaching down to the living forest floor, which
    holds many secrets in its earthbound folds.


    The ferns have been the companions of trees since ancient times. They, in turn,
    allow the mosses, club mosses, liverworts and ground lichens to survive. Living
    deeper still, the fungi make a home in the soil and sometimes within the trees
    themselves. These invisible, endogenous fungi are from the higher orders of theogogams
    and the masterminds of many medicines of the forest. They mix with the life forms
    in the forest floor, which foams with underground activity. The diversity of the
    upper stores is always a reflection of what is underfoot.


    Biodiversity blooms in a mast year. In the spring, the male and female reproductive
    centres kick in full tilt. Some trees are monoecious, meaning they possess both
    male and female organs; others dioecious, meaning separate male and female trees
    exist. The sexual hijinks in a forest beggar belief, are teasers. Some are from
    the female members, filled with sugars from the female glands where the ova lie
    in wait. Others, in which proteins are stacked, waiting for release at germination,
    are more sour. These sour-tasting treats of protein-filled pollen are the bodybuilders
    of the diet of many insects and birds. At all points in the passage of spring,
    though, the pollinating insects are fed, from butterflies to bees. These small
    forest rangers are always on standby to enact pollination. Some travel as far
    as sixteen kilometres from the focal point of the forest to partake.'
