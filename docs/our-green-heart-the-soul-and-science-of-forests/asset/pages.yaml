  md: '# The Red and Green Kingdoms


    To understand who you are, you must know your history. This is your story, your
    entry into the Eden of the living world, but it is also the story of life as we
    understand it. Like that life, it is both unique and shared.


    Out of the thunderous silence of space, a rocky planet emerged dressed for life.
    At first, waves of infantile infrasound, generated by molecular movements, with
    a seed of symmetry, then danced together their peaks and troughs. In time, these
    seeds of knowledge stretched into strings, and with the blessing of a rose, those
    strings then shaped themselves into a spiral form, the one we know as DNA. Its
    end-on view held the design of a rose under the mirror of X-ray diffraction analysis.
    Creation and conservation of matter demanded a mirror image made as a sister to
    the first spiral. One became two in the glory of “all is one, all is unity,”everything
    arising from zero.


    The binomial counting for life—the 1+1 that gives rise to all of life’s incredible
    beauty—had begun, a mathematics sacred and unseen by most. Filled with the language
    of knowledge, the spiral reached the sun and divided into two entities. The first
    was the plant kingdom. It waited and waited, awash with green. Later came the
    animal kingdom, dominated by red. The two were each greedy for fuel. In the name
    of survival, they decided to share, dependent on one another as equal partners.


    The fuel they divided—essential for the survival of life—is oxygen. Oxygen is
    the most abundant element of our planet, making up as much as 46.6 percent of
    Earth’s crust. So, in terms of plentifulness, the choice was a safe one. In addition,
    there is a chemical simplicity and plasticity to oxygen because it is a diatomic
    gas, made up of molecules that themselves consist of only two atoms. This is perfect
    for nature’s uses, as the two atoms are equal in ability and can also function
    independently, if necessary. As a'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'result, oxygen is used and reused in the atmosphere and the soil, through the
    bodies of all plants and animals, in the oceans, lakes and waterways, and, more
    slowly, in the chemical action of the soil over time.


    On a normal day, oxygen drives the engine of life. The gas enters the lungs of
    every animal on Earth and exits as carbon dioxide. This exhaled waste gas is then
    up for grabs in the atmosphere, and the plants come up to the plate. Size, or
    biomass, matters in the plant kingdom: one blade of grass needs much less carbon
    dioxide to fuel the business of living than a mature tree. A tree, any tree, is
    fully equipped to efficiently handle oxygen and carbon dioxide; a forest even
    more so. Oxygen and carbon dioxide are mobile, constantly on the move, into and
    out of the forest community. But it is becoming increasingly clear that humans
    don''t yet understand all the ways forests are essential to a living planet. Our
    understanding of the bigger picture is still in progress and will continue to
    be so for some time yet.


    A common law of chemistry underlies both the plant and animal kingdoms'' use of
    oxygen as a fuel. It is called the oxidation-reduction reaction, where oxygen
    is swapped from one state to another. Fire needs oxygen to burn. The same thing
    happens in the human body. Oxygen is needed to break down foods like carbohydrates,
    proteins and fats to release their carbon dioxide, which is then exhaled. Like
    a lit burner or a house fire, this is combustion, and oxygen is necessary for
    the process of combustion to take place.


    Both kingdoms of life, the green and the red, arrived at the same winning post
    of success despite taking different routes. The plant''s spiral string of DNA
    produces a flat macromolecule called chlorophyll, the green molecule. Meanwhile,
    the mammal''s deoxyribonucleic acid produces a different flat macromolecule, a
    red one, called hemoglobin. The only difference between them is two molecules
    Base elements: chlorophyll is designed to produce oxygen from atmospheric carbon
    dioxide and hemoglobin''s job is to grab that. They are almost identical molecules,
    one in plants and the other in animals, all with the vital task: to keep oxygen
    cycling and recycling throughout the planet, and to maintain this movement into
    and out of the web of life on a timed schedule'
  merge: -1
  pgno: 14
- img_proc: true
  md: '—from seconds to minutes, from centuries to millennia, always under the dictates
    of the circadian rhythms of nature.


    Chlorophyll and hemoglobin have something else in common, which is remarkable
    to the world of science. They each labour under the restraint of a second law,
    called quantum mechanics. Both these smart molecules dangle an atom of metal at
    their sweet spot like bait in a trap. In the plants'' case, it is magnesium; in
    the animals'' case it is iron. These two metals are unusual in the same way: they
    can afford to lose one electron in a quantum jump. This tiny subatomic action
    has a colossal effect on life. If not for that quantum jump, neither hemoglobin
    nor chlorophyll would work.


    The simplicity of this “small is beautiful” jump is extraordinary. The ingredients
    for life are a planet, a sun and a moon. Time has harnessed Earth’s elements into
    biochemical building blocks of the two basic kinds, the green and the red. The
    green molecules of the plant kingdom feed off the sun. The sunlight gets trapped
    in an exchange of photons for electrons. The flood of electrons is steered into
    plant food, which is eaten by fauna, including humans. Then, through respiration,
    the exhaled carbon dioxide is grabbed by the trees and the quantum cycle begins
    again, powering the entire planet, and its red and green kingdoms.'
