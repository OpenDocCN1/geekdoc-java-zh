  md: '# The Consuming Madness of Scientists


    Science, like the stock market, suffers from bandwagon thinking, with

    everybody wanting to get in on exciting new prospects. Though the roots of

    geoengineering trace back to the 1970s, in the face of our escalating climate

    crisis geoengineering has been shined up and brought into vogue—in some

    circles rechristened “climate engineering.“”


    Geoengineering can be defined as the usually large-scale alteration of

    one or more of the planet''s ecosystems to fix a pressing problem. Mediating

    the climate crisis is today''s biggest problem. Geoengineering

    enormous, the path to fame already delineated, and as a result the battle

    standard of the geoengineer has been hoisted from the ivory towers of many

    of the most prestigious universities across the world.


    Scientists have responsibilities to the public who fund them. Whatever

    path we take, whatever disciplines and questions catch our attention and

    spark our imagination, we are meant to be truth-seekers. We have not

    typically taken an oath of “do no harm,” as in medicine; but as truth-tellers

    it seems crucial that scientists behave honestly. In all the sciences,

    honesty and independence allied with critical thinking should be the

    guiding stars.


    To my mind, the geoengineers have lost their fix on these stars, using

    the climate crisis as their excuse. Many of them believe in their own genius

    to the point where they seem to pulsate with self-confidence. Such ego-

    driven people exist in academia, just as they do in politics and any other

    arena that trades in authority, prestige and influence. My good friend, the

    late Harvard professor E.O. Wilson, hit the nail on the head, in one of

    his many graduation addresses, he described the present time as full of

    people with Stone Age emotions working in medieval institutions and

    thinking and acting from a belief in their own godlike prowess.'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'Geoengineers want to fix climate change quickly so that we can continue our
    rape and plunder of nature with the fewest interruptions possible. They believe
    they can accomplish their interventions despite science''s continued inability
    to grasp fundamental aspects of the ecosystems with which they plan to tinker.
    This is like knocking out the foundations of a building without understanding
    the building''s design and with no plan to share the supporting walls that hold
    up the roof. It is madness dressed up as logic.


    The arrogance of geoengineering was clear to me before the term was coined, since
    I was a Brehon ward in the valley of Lisheens in my early teens. Back then, I
    was taught an ancient triad poem in the Irish language, passed down orally through
    the millennia since a time before the birth of Christ. The poem was both a puzzle
    and a warning. Translated, it begins, “A hound outlives three rails / A horse
    outlives three hounds,” and it ends with, “An old ridge in the ground outlives
    few trees / Three times the time that the sign of a ridge will be seen in the
    ground will be as long as from the beginning to the end of the world.” When I
    first heard the poem, I was, like all children, terrified of the implications
    for the future. This was true for all life, and even for the planet we call home;
    that ridge of stone, from the beginning, had a foreseeable end. These words of
    poetry, meant for my young ears, caused me to have waking nightmares. As an orphan,
    I understood the meaning of death. I did not want the people or the animals or
    the plants to suffer death. I was told to remember the meaning. I didn''t need
    to be told. The power of that poem, and of its other message—that what we have
    is finite, and because it is, we need to care for every aspect of it—was quite
    enough for it to last lifetime.


    My lessons in Lisheens were instructions for the future. The knowledge that was
    shared with me, my inheritance, was distilled from the oral culture of the past,
    the collected wisdom and learning about nature and the nature of humankind that
    was assembled by the Brehon laws. My grandfather, Daniel O''Donoghue, was a Breitheamh,
    a Brehon judge, whose opinions were known across Ireland for their scholarship.
    These laws were—'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'Magna Carta. The latter, product of the British Empire, is based on precedent,
    on ownership, whereas the Brehon laws are based on long observation of what serves
    nature and humans both.


    In Ireland today, constitutional lawyers are scrutinizing sections of Brehon laws
    that can be recycled to protect the natural world. Similar hope is rising in New
    Zealand, in Canada and in Ecuador, where forests and rivers have been given legal
    rights and status as persons. Such laws protect nature for the well-being of the
    entire population and not for the few with greed in their eyes.


    Under the Brehon laws, geoengineering would be prohibited because of the requirement
    of reparation. The scientists who initiate such projects would be held morally
    and financially responsible for all losses and damages incurred by their actions.
    The potential for damage in a geoengineering project, either within or outside
    a country''s borders, cannot be calculated prior to the event. It could be immense.
    It already has been.


    When I was six or seven years old, I was taken by the rough hand of my great-uncle
    Denny. It was a crisp day in early summer, when the grass and shamrocks were alight
    with green fire. Together, we climbed to the top of the hill behind the farmhouse.
    The meigililt, the standing stone, stood erect as it had always done, careless
    of the millennia of time''s passage. This spot gave us a bird''s-eye view of the
    wide and breathing valley below us. Denny a cuípeíner, a bone-setter, but on that
    day a larger injury concerned him. He pointed out to the field of one of our neighbours,
    where the first superphosphate fertilizer was being applied to the land. Before
    our eyes, the field turned from green to white. “That,” Denny began dryly, “is
    the first rate of nature. The land is being forced beyond its capacity. Remember
    this, leanbh! Do not forget this day. You will need to remember this for the future.”
    I did. And I do. The people of Lisheen hung on the old idea of the land and its
    ability to be productive, expressed with an old word in Irish, cológ, or collop.
    It means the area of land that can sustain the grazing of milking cows, sheep,
    pigs or horses. Any use that pushed the land beyond its capacity was to be avoided.
    Denny knew what superphosphate fertilizers would do.'
