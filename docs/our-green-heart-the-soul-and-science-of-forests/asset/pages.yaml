- img_proc: true
  md: 'The forest bath itself begins with a temperature-sensitive plume of aerosols,
    primarily released by trees. These medicinal molecules then travel the architectural
    airways of the forest. Though the heavier molecules originate higher up in the
    canopy, the lightweights sometimes begin as low as the forest floor, moving around
    the trunk with ease and up into the branches. Downward pressure from the atmosphere
    confines the more labile medicines, which then reflux into the arboreal canopy
    of the tree again and again.


    Aerosols are released from the trees in an anhydrous form, meaning they contain
    no water; they become hydrated by morning moisture, easing their entry into the
    human body as medicine. Many trees also produce an additional biochemical, a fixative
    that acts on the newly released medicinal aerosol, gluing it to the skin of the
    bather. (Think of the fixatives commonly used in the perfume industry to make
    scents last longer.)


    From a medical and biochemical point of view, something strange happens in this
    exchange between the trees and the human body. The forest vapour holds two forms
    of the same medicine; nobody yet knows why there are two. Each of these forms
    is the exact image of the other, with one vital difference: as light passes through
    them, one form will rotate the beam to the right—what an organic chemist calls
    dextrorotation—and its twin form will rotate light to the left, a levorotation.


    The human body is a finicky thing, and the levorotatory medicine turns out to
    be the optimal choice for healing. This left-handed molecule seems to fit the
    jigsaw patterns of the pathways of the human body in a more efficient manner.
    Much to the chagrin of the corporate pharmaceutical world, the levorotatory molecules
    are difficult and very expensive to manufacture in a laboratory. On the other
    hand, the trees of the global forest continue to supply these medicines into the
    atmosphere for free.


    All trees take a somewhat similar form, that of a lollipop, a botanical architecture
    that enables the plant to act as an applicator for medicine. The trunk, or bole,
    extends the canopy up into the air, allowing for atmospheric exchange. The reason
    why mature trees are so tall is that their business of gas exchange happens above
    and around the crown. In the'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'botanical world, the longer, more refined bores are always found in virgin
    forests; such trees are the first to be cut down because their wood is free of
    knots and of high quality. On top of the bole, the canopy of leaves, flowers and
    fruit rests in the sun. Anchored in the ground by the roots, the bole can move
    under the pressure of the wind, and so can the canopy. Dispersal mechanisms vary
    across species, from free release glands to specialized organs for sterile storage
    of the phytomedicines, but the movement caused by the wind generally creates enough
    torque on the body of the tree to release the aerosols.


    Medicinal aerosols are manufactured in one part of the tree and then stored in
    the glands. Within a family of tree species, the glandular organs are all similar.
    For instance, a tree of eastern North America called the white cedar, Thuja occidentalis,
    carries its glands at the tips of its fruits. They can be seen with the naked
    eye. The tiny gland is circular and filled with midsummer with a yellow liquid.
    These are applicator fronds, developed to disperse the aerosol by touch and sometimes
    times. The glands are also finely tuned to temperature. On a hot, sunny day, the
    thujic acid they release into the air will regulate blood pressure, improving
    the circulation of all mammals.


    Then there are the aerosols produced in the orange family, Rutaceae, that function
    on the same principle as a land mine. Under pressure, the fruit and flowers release
    the aromatic aerosols as small explosions. Again, these glands can easily be seen
    on the rough surface skin of an orange, looking like tiny balsams embedded in
    the epidermis. The pressure of peeling sparks explosions that coat the fingers
    with the essence of the fruit in colour and smell.


    There is a great, and somewhat unexpected, advantage to taking medicines in these
    ways and the others that forest bathing bestows. It is dosage. The trees produce
    a bounty of medicines, but the body only picks what it needs. A small body will
    pick up a small amount of medicine from the forest atmosphere; a big person will
    receive a large amount. The collaboration results in a dosage precisely tailored
    to the last epithelial cell of the human body. It is the medicine you need and
    nothing more.'
