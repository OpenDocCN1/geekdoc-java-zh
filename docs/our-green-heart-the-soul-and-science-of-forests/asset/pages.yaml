  md: '# Sacred Forests


    There are two great loves in my life, poetry and peace. Poetry opened my eyes
    to the power of language when I was still sitting on my mother’s lap. At four
    and five, I begged her to read Shakespeare sonnets to me. She was willing, even
    though she thought I was too young. I can’t say I understood them, but I loved
    the sound of the language. I went on to soak in the poetry of the Irish language
    and countryside, and the old way of greeting a household by speaking the “words
    of the bard” at the door before entering—any bard would do.


    Books of poetry line my shelves to this day, sitting below those on botany and
    biochemistry. Poetry has explosive power and longevity. Ideas can go dormant in
    books, like seeds. Behind the spine, a whole world lies in wait to kindle a young
    mind. A poem can bring you anywhere; it opens the portals of your mind and allows
    you to fly across the world. Poetry can empower imagination and creativity in
    all branches of science—even mathematics does not escape. Verse is the red blood
    of music and the drama of the stage. I am lucky that, as a child, my was laced
    up by poetry.


    Peace is something else again for me. I learned about peace when I was a Breton
    in the valley of Lishens. The evenings gathered everybody into the kitchen around
    a turf fire that still held on to the last pip of light. The lone window was dark,
    and shadows crept along the floor like a big black cat.


    The waltz of the chairs began in a flurry, their legs scraping across the earthen
    floor. They seemed startled to leave the comfort of the kitchen table, whose pine
    surface was clean and scrubbed, the household’s only holy picture positioned prominently
    on it. Visitors were always around. They knew the circuit and were glad of it.
    The settle-bed, the leaba shuiochain of the travelling man, was always occupied.
    When the moon and stars came'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'out to play with the silhouettes of the night, my cousin Pat’s fist went into
    the right-hand pocket of his tweed trousers.


    Pat’s hand was worn free of any trace of childhood’s dream. His skin was rough
    and seamed, replete with the kind of beauty that only comes with age. He had never
    had to cut his nails, because they were worn down by work, filed day by day and
    finger by finger. The hand could not, now, be straight and flat. As he drew the
    claw that had once been a hand from his pocket, a rattle was heard, as if the
    rosary beads were protesting his clumsy clutch. It was a loving clasp that drew
    the rosary out slowly in a string of hope that he then played from palm to palm
    with familiarity and comfort. It opening music, carrying the resonance of past
    prayers. Gently, he put the rosary to his lips. He closed eyes that were usually
    full of hen. He placed a kiss on the silence of his beads. And then all heads
    bent down, one after the other, to pray.


    Everyone knelt on the floor, leaning their elbows on the flat seats of their chairs.
    Silence gathered, and more silence, and then the speaker was named, the one who
    lead the chant. The Rosary began, the first entry prayers and the five units of
    ten Hail Marys. Breathing slowed. Prayer entered deeply into each body. Minds
    joined forces. The joy of unity swept through the room. The worries of the day
    melted away. A lightness descended and closed the spaces between the prayers,
    joining them together. The symphony of voices rose in a waterfall of sounds, Irish
    and Old Irish, with the tonal beauty of the words, blending and mixing with English,
    all the speakers with the same intent.


    Prayers for peace at home, and peace in the world. In that dark kitchen, with
    the faintest glimmer of red still showing inside the dying fire, twenty people
    prayed for peace, their beads held close to their lowered faces. The song of these
    souls went into the dark night, carried by the hope that came from working the
    land and feeling all the small gratitudes for its fruits and strengths. The wish
    for peace was born from the centre of each beating heart. The prayer grew wings
    as the wish took flight. It rose above the grey ash of the turf fire and its last
    centre of heat. It took'
  merge: -1
  pgno: 167
- img_proc: true
  md: 'strength from the silence as it ascended the huge fieldstone chimney and entered
    the darkness of the night.


    The wish for peace opened up like a flower as it hit the night air and gained
    power. It went east and west. The tidal currents of Bantry Bay forced it north
    and south. The wish moved around the planet in a split second and changed the
    world forever. A wish is an idea. An idea can never be stopped. It has a life
    of its own. It can pour out and escape from behind bars. It can affect the rich
    and the poor in equal measure. It comes from the wellspring of the human heart.
    That night, like all nights in Lisheens, a portion of the wish stayed in my own
    young heart.


    I heard a similar wish of peace just once again in my life. This time I was in
    Japan. I was sitting on a garden bench waiting for my friend, Dr. Akira Miyawaki,
    a botanist and a champion of native forests who has since died. He arrived a little
    late, wearing a big, hurried smile. He plumped himself down next to me and took
    my hand in his. He looked into my eyes and said, “Now I am no longer alone.” I
    knew that he was speaking for the forests. We would plant them and we would care
    for them. We ended that day by going to the biggest Shinto shrine in Tokyo and
    kneeling in prayer.


    In the silence of the shrine, I was sure we would succeed. I still am, because
    the global forest represents peace and love to all nations. It represents the
    first gift of life at birth, that single new breath. A beginning.'
