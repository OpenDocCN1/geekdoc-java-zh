- img_proc: true
  md: 'oaks need much more ground than other trees, but their considerable canopies
    make them extremely stable in a windstorm, and their horizontal pattern of growth
    further buttresses their branches. This will be even more important to withstand
    the newly hydrated atmosphere of climate change, which will bring more violent
    ice storms and very wet snow loads, from large and heavy snowflakes. The oak''s
    roots, too, can withstand flooding because of their size and extensive anchoring
    in the subsoil. Oaks are also extraordinarily drought-tolerant. A well-grown tree
    can be expected to live approximately a thousand years.


    So, how do you plant an acorn?


    First, you during midsummer, start looking for healthy, mature oaks wherever you
    live. Keep an eye on the tree and visit it as often as you can. Take note of the
    first mature acorns that land on the ground around the tree, but ignore them,
    because the first acorns to fall are often ones that have been aborted because
    of disease. Ignore, too, green acorns, which cannot be expected to grow because
    they''re not ripe. An acorn is ripe when it is brown, or sometimes black; an oak''s
    acorns will ripen from August to December in the northern hemisphere.


    Prior to planting, which you can also do from August to December (as long as the
    ground isn''t frozen), remove the cup. The cup scar on a healthy acorn should
    be lemon-coloured. Any that have been attacked by weevils or otherwise damaged
    will not grow. If you want to double-check, such ducks float while their more
    sound, heavier counterparts will sink to the bottom of a bucket of water.


    Place the healthy acorn on its side then cover it with a quarter to half inch
    of soil. Add a pinch of baking soda to de-scent the acorn, which protects it from
    predation by hungry squirrels. Mark the spot and cover it with a mulch of grass,
    straw or wood chips. Even layers of newspapers will do, or you can place rocks
    around the planting hole, leaving room for the tree to grow; you''re simply looking
    for anything that will help hold moisture in the soil.


    Like grains of wheat, acorns have no endosperm. Instead, the tree decided to direct
    its food services into two baby leaves, called cotyledons.'
