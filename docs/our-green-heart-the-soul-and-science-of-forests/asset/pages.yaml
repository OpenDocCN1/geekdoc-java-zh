  md: '# Liquid Light


    Solas is the Irish word for light. It''s a word of great significance to Celtic
    culture both past and present, a word that means light, brightness, illumination
    and life itself, a word factored in the divine. In ancient times, Solas was represented
    by a swastika form, which was hammered into golden ornaments for the public eye.


    I remember standing outside with a neighbour one afternoon in Lisheen. Since the
    whole community of the valley had decided to share the duty of instructing me
    in the ancient knowledge of the Celts, whenever I could be spared from my chores
    those summers, I spent my time with whoever had to teach to me. A runner, usually
    a young boy, would be sent to Nellie''s door with an invitation, and I would join
    that day''s teacher for a cup of tea or a walk. As this instructor''s wrinkled
    face swept the landscape, eyes lingering on the carved stone surfaces of the Druidic
    artifacts that littered to light them from within. “Solas, cailin,” I remember
    one of them saying——Light, child,” in English. “All energy will one day come from
    the sun. Mark my words. That is what the fáidhe tell us.” Fáidhe meaning the prophets.


    Even if I didn''t know exactly what that meant, there was no danger of my forgetting
    the prediction: light fascinated me. To be a female scholar interested in light
    in that time and place was to study physics by the glow of a kerosene lamp. This
    small source of illumination I took to bed with me and set on the stone ledge
    near my head, so I could read the notes I made from Professor John J. McHenry''s
    class at University College Cork. There was so much to learn. Sunlight is strange.
    It has many abilities to fool the scientist, even those of today. But despite
    its many mysteries, sunlight also'
