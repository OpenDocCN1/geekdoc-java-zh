  pgno: 49
- img_proc: true
  md: 'had torn in the same way with each one. White endosperm exposed itself to me,
    but instead of one per nut, there were two. The seeds had twinned. I had never
    seen this before. I didn''t even know this twinning in nut trees was possible
    until I saw it with my own eyes. Carefully, I gathered up each kingnut and gave
