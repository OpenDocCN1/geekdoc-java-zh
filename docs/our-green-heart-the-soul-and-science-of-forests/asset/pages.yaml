  md: 'Mind you, not having found a conclusive answer to transpiration—this potential
    Nobel Prize—does not mean I lack ideas. I tested one in my kitchen sink. I had
    a small plastic bag, some dish soap and warm running water, kept at approximately
    body temperature. I squeezed some dish soap into the dry bag, then I added some
    water. The water seemed to defy gravity and run uphill in the bag. Soap, in the
    form of phytochemicals called glycosides, exists in all plants. The glycosides
    have two phases—active and inactive. The water seemed to spur the active phase
    on, to build what is known as surface tension, a quantum force that can be strong
    enough to resist gravity. The position of the vascular piths in the innards of
    a tree may well assist the water to move uphill. In any case, both the plant’s
    glycosides and the pith may help help produce the uphill drag. And maybe this
    is how water runs uphill sometimes, and not only in trees. I will keep working
    on this plant enigma. Promise.


    Beyond my kitchen, there are scientists working on this problem in most of the
    premier universities across the world. They too are still at a complete loss as
    to how to explain this phenomenon.


    All of which leads to an even greater mystery: How can we possibly justify the
    destruction of forest ecosystems when we understand so little of what is being
    lost, and of the consequences that may result?'
