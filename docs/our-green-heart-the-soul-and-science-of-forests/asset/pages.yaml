- img_proc: true
  md: 'There is a delicious irony in that failure, because the Princeton campus is
    glutted with trees, all well-bred and well-fed. No doubt Einstein, who loved the
    music of nature, leaned against one of their trunks many times and looked towards
    the heavens in thought. Above his head, in the green of the canopy, each little
    leaf was solving the problem he could not, setting the stage for a quantum performance
    with sunlight.


    The electron and the photon are the lifeline of a living tree, of living forests.
    At a subatomic level, sunlight lands on a leaf and penetrates down to the green
    tissue. This is the mesophyll layer, consisting of sacs of green chlorophyll called
    chloroplasts. Each chlorophyll molecule acts as a molecular machine. It has a
    shape similar to a mattress, with an atom of magnesium sitting dead centre, waiting
    for a photon. The magnesium has a cloud of electrons around it. One photon comes
    charging in and displaces one electron. There is just enough energy generated
    by this atomic takeover for a molecule of carbon dioxide to be split into two
    parts, oxygen and carbon. The atom of oxygen is free to join another of its kind
    to form a stable molecule of gas, which then meters and mixes with Earth’s atmosphere.
    The carbon is grabbed by the tree and turned into wood. This barter system of
    elementary energy feeds the entire planet in a carbon banking system known as
    the great carbon cycle.


    Nature conducts this system with the frugality and fastidiousness of an expert
    accountant. The forest collects carbon to build up its capital, and there is no
    shortage of sources. There is the familiar reaping and sowing of carbon in living
    systems, but also a store in the Earth’s crust and a cosmic abundance in space.
    Sometimes an excess of carbon accumulates throughout the ages. This is carefully
    baked for the future, principally as a benthic layer beneath the waterways, permafrost
    and oceans. In many parts of the globe, this vault of carbon changes over time
    under the pulse of pressure, re-formed and remade because of the atomic structure
    of carbon’s stable pair-binding. In time, coal, graphite and even diamonds are
    born.


    These are the processes unique to trees that make our air breathable, our planet
    livable. They are orchestrated on scales simultaneously global and subatomic by
    an innate intelligence that once barely grasps—when'
