    was no ordinary lunch; the invitation came from children who attended a forest
    school outside the city. Having finished my university business, I admit I was
    very much looking forward to engaging with education at the younger end of the
    scale.


    A November sky held the promise of rain, so I borrowed a coat, hat and scarf,
    together with a warm pair of gloves, and headed into the pine woods. Like a fairy
    tale, the little forest school was nestled in the middle of a collection of evergreen
    trees and bursting at the seams with local children. The building was small, with
    an apron of branches in front of the door. Riding the apron like a swarm of ladybugs,
    a troop of four- and five-yearolds in constant movement. Their blur of swirling
    colours formed a ring around a small open fire.


    I was new in their landscape, the children watched me. And I, of course, kept
    an eye on them. As they continued their play, I was struck by the generosity with
    which they treated one another. The feeling seemed to flow like water from one
    to another, down to the youngest child. There was no crying here in this woodland
    setting. Most of the children seemed to be carrying something—a stick, a branch
    or a handful of pine cones. Their fingers and faces were a bright pink. Then an
    unusual thing hit me: the noise of laughter sheer joy shared and tossed among
    them. So often these days suburban streets seem empty of children playing on their
    own or with other children.


    This crowd of ladybugs was a confident bunch. They looked out for one another
    with a deep respect that was also full of compassion and interest. These are human
    skills that can last a lifetime. These kids had already figured out how to share,
    to co-operate and explore their environment with a form of critical thinking about
    what was safe and what was'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'dangerous. They were learning from the best of teachers, which is the natural
    world in all its bounty.


    Soon, a hefty block of wood was produced by a teacher and I was invited to sit
    down. The fire was smoking, but I enjoyed the smell; it made a change from the
    sanitized corridors of academia. The apron auditorium around the fire was the
    children''s habitat, not the adults''. It was perfectly plain to me that I was
    the children''s guest and they were in charge. They looked after me, too. Each
    child had a task. They provided and cooked their own lunch in this forest school.
    After a fireside conference, bannock appeared from the griddle, shortly followed
    by a plate. They kept their eyes on the bannock as I balanced it on the proffered
    plate on my knees. I lifted the bannock to my mouth and took my first bite. The
    children turned into statues, awaiting my reaction. I swallowed and then I smiled.


    One boy stepped onto a higher branch of the apron. He balanced there carefully,
    his hands behind his back. His face was serious. The words burst out of his mouth.
    “We made the bannock for you!” he said. “What I mean to say is that we are happy
    you come to see our school. We made them for you and there are lots more. Lots!”
    His classmates moved towards him. They all stood together, fortified by one another
    and by their skill in entertaining their guest.


    I brought something home with that day. Little forest school taught leadership,
    honesty and co-operation, along with a deep respect for nature. The combination
    is unique and vital. If the hedge schools, the scoil ghearr, of Ireland could
    produce presidents and prime ministers, these forest schools can open a path to
    a better future for us all. Education can be monetized or it can be treasured;
    understanding can be hoarded and patented or it can be shared and felt. A child’s
    smile can hold more depth of knowledge than any university, anywhere.'
