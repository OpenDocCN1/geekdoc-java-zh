  md: '# Lessons in Botany


    When I was a young student at University College Cork, my botany professor, Dr.
    Ollie Roberts, suffered some health issues. In 1962, as I prepared to enter the
    final year of my undergraduate studies, he was advised by his doctors to take
    a break from his research and teaching to rest. At the time, botany was not a
    well-regarded discipline. For students in the faculty of science, it was at the
    bottom of the pe order. Maybe, then, Dr. Roberts was short on options as he cast
    about for someone to take over his responsibilities. Whatever the reason, he explained,
    and he was in a flap. He hadn''t yet found someone to deliver his lectures. Given
    that I was his honours student, I by any chance, be up to the task?


    I agreed, course, without giving much thought to the strangeness of the situation.
    Thus began my final year as an undergraduate, with me in the paradoxical position
    of being both student and teacher. Everybody survived the end, and in the words
    of the poet Pablo Neruda, through the process of teaching I was given “a new set
    of eyes.”


    As the opening day of classes approached, I energetically added to Dr. Roberts''s
    lectures. I decided to cover new topics I thought would be important for the coming
    years. Climate change was one of them. At the time, it was called “weather changes,”
    and mostly spoken of by the farming community, the people who were and most intimately
    at the receiving end of the climate crisis. The changes in the fields, the animals
    and the blackboard of the sky did not add up to them, and in Lisheyns''d begun
    to express these misgivings to me. Trees, I knew, marked the patterns in the climate
    as well as anything else on Earth, so I decided to add the story of the evolution
    of trees, through their fossil remains, to my lectures.'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'Trees have stood their ground for 400 million years and counting, but like
    all life on Earth, their story traces back to the oceans. The origins of the trees’
    reproductive processes begin in the saltwater fertilization of marine species—where
    oogonia, the female sex organs of certain algal and fungal species, and antheridia,
    the male organs, combine to form swimming, mobile gametes. These primitives founded
    the underwater forests and meadows of the oceans. They are the oxygenators of
    the oceans. And their reproductive strategies were passed to the ferns, who took
    a version of their own onto land, where they multiplied, grew and evolved.


    Though today ferns and the silica-armoured equiset are retrograde species (with
    the exception of New Zealand’s tree ferns, Dicksonia antarctica), their ancestors
    dominated the landscape, growing to heights of hundreds of feet. The undersides
    of their great leaves carefully sheltered the plants’ nurseries, spore-producing
    structures called sporangia. These spore chambers were further protected from
    injury by a plant wrap of tissue, which like a green womb, called an indium. The
    ferns lived in and loved the atmosphere of ancient Earth, filled with carbon dioxide,
    air so toxic it would kill most mammals within minutes. And then, somewhere in
    the distant past of millions of years ago, a mutation occurred in a monstrous
    400-foot fern that opened the pathway towards the shape, form and sexuality we
    see today in our global forests.


    The evergreen trees came first, reaching up into a higher region of the atmosphere
    to catch the sun and fuel their binomial name to plant perfection. They too probably
    grew to more than 400 feet from ground level, using their massive trunks as a
    mainstay to anchor themselves in place, but nobody is sure of that. The juvenile
    canopies could compete with and master the rule of dichotomy—one into two, two
    into four, four into eight—the mathematical formula for any species’ success into
    the present time. Canopies expanded in a circular fashion to exploit the sun,
    and sometimes a bough dropped (or even a third) to make a formidable evergreen
    frontier of expansion into the atmosphere. Multiple canopies are a hallmark of'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'ancient, virgin forests rarely seen today. Only a few such truly colossal trees
    remain.


    The massive canopies carried by ancient trees combined to form impressive forests
    that maintained the darkness on their floors. The search for the sun in those
    shaded realms provided the dividends for change, spurring biodiversity. Each leaf
    of every tree of the forest developed a specialized petiole, a place of attachment
    for the lamina, or surface, of the leaf. This gave the leaves motility, the ability
    to move and track the sun. Some trees took this even further, folding or going
    into a closed position in the absence of sunlight, using the axis of the midrib
    or central vein. This ability is found in the trees of the Leguminosas family,
    which close the lamina into a fold when darkness starts to fall.


    I remember being at Harvard University a number of years ago, chatting with a
    student who had just received her post-graduate degree. She studied a very strange
    tree called Gleditia triacanthus, the honey locust of the Leguminosas family.
    This was the tree that the US president Franklin Roosevelt had planted to counteract
    the droughts, dust storms and erosion of the Dirty Therties. It was also hybridized
    to maximize the sugar in the tree''s long brown pods, and the pods, with their
    high sugar content, were fermented to create a high-grade ethanol to run farm
    equipment. During our conversation I asked the student if she''d used a darkness
    control in her experiments. She stared at me. I told her I had honey locust in
    my arboretum and I noticed a rare phenoremen in the tree. The midrib of each leaf
    acts like an envelope and motors both the left and right sides of the leaf surface
    from sunset until morning light. This was the reason the tree was so useful as
    a soil protector in times of drought. By folding its leaves sheut, it was able
    to conserve water for its daytime business of photosynthesis.


    As the tectonic plates shuffled Earth’s land mass into continents over millions
    of years, the ancient forests survived somehow. They continued to faithfully farm
    the sun. Slowly, as the forest grew and matured into the “Pastures of Heaven,”
    to borrow Steinbeck’s title, the trees pumped oxygen from their green chlorophyll
    machines into the atmosphere to sweeten it for'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'life. They also overcame the excessive moisture produced from an overheated
    planet whose temperatures caused the evaporation of oceanic and other water surfaces.
    In short, ancient forests had to endure the full charge of “the greenhouse effect,”
    surviving the very climatic conditions humanity seems so intense on reproducing,
    at such great risk to all life.


    As the centuries slipped into millennia and the millennia piled high with age,
    life fell into the lap of the forest. Oxygen increased and atmospheric dioxide
    went down—the-saw of climate. Each tree of every global forest fulfilled its task.
    Over time, some developed root systems that spread to the canopy’s drip line.
    Others, like the walnut, dug deeper into the soil, exploring it with a taproot
    system. Many went went into underground hibernation in a cloned form, like the
    Populus, waiting like yeast in the resting state, to weather the storm. Willows,
    aspens and poplars are usually the first settlers after a disaster.


    Along with this filling the lungs of the planet with air came the jubilation of
    biodiversity, the fail-safe of life itself. All hands on deck was the silent motto
    of the plant kingdom, a green pasture that stretched from the tops of mountains
    into the depths of the great oceans. I think back on those lectures I gave in
    the place of my professor, and the history they covered, I am struck by the possibility
    that science has missed something important—namely, that the planet, our home,
    contains a knowledge of self, and that it supports, a march towards unity, which
    is one definition of the Divine. The Celts summarized this idea as an Ceolta na
    Cruinne, an ancient saying, or seanfocal, which means the music or mathematics
    of the universe. This seanfocal was designed to be passed down through the millennia
    to the present time, for us to ponder and to remember.


    I am also struck by a renewed feeling of urgency around something science has
    certainly missed. There is a mystery in botany nobody has solved, though it’s
    central to the evolutionary question of where trees come from. The unicellular
    algae called Chlorella, rigged out for survival in the oceans, are the ancestors
    of trees. Chlorella are still today wherever there is water—on streets and in
    streams, lakes and rivers, even around the'
  merge: -1
  pgno: 67
- img_proc: true
  md: 'base of buildings that are constantly wet. It is possible, then, to take a
    specimen of Chlorella and place it next to one from a tree in a Petri dish. If
    you do, the two seem to be so different it is almost impossible to believe the
    tree came from the green, microscopic speck beside it.


    Trees have form. They are smart. They behave like computers and seem to have some
    kind of brain. It is possible a tree''s brain is like a skin of cambium tissue
    that entirely encloses it. There are hormones in trees that are structured like
    human hormones. Trees produce antimicrobials called phytoalexins to fight infection.
    Trees listen. Trees produce infrasound. Trees conduct the business of their lives
    on a quantum level, confounding the most fundamental principles of physics. They
    are staggeringly complex, while Chlorella, to put it mildly, are not. How, then,
    did the one emerge from the other?


    The lectures I prepared and delivered on behalf of Dr. Roberts covered much of
    the answer to that question. But they were missing a crucial piece, one that remains
    missing to this day. In my second year of university, I heard my professor say
    something that left me breathless: “Forensic botanists and archaeologists are
    looking for the connecting proto trees between the ferns and the conifers.” Basically,
    what he was saying was that the species that bridged the gap between the 400-foot
    tree ferns and the ancient trees were still unknown. The origin of the trees''
    complexity was an unfinished puzzle.


    I hit the library immediately, determined to find that missing link amongst the
    leather-bound volumes that lined the shelves towering over my head. I went back
    to Victorian times, every time, Tom, Dick and Harry with money in their pocket
    went plant hunting across the world...Nothing!


    Well, maybe nothing. I did come across the weird and the wonderful. One memorable
    tree was found inside an extinct volcano in southern Angola and near Walvis Bay
    in Namibia. The Welwitsch mirabilis of the lonely Welwitschiaceae family looks
    like a very large cabbage that has been in a nasty fight. From a distance, it
    could easily be mistaken for a heap of rubbish in the Namibian desert. But such
    candidates did not tempt me to believe they held any meaningful'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'clues to their ancestry. Perhaps, today or tomorrow, some wandering botanist
    will pick up a piece of a fossilized tree from a long-forgotten forest and find
    the final answer.


    Trees set the stage for the advent of the human family. Forests brought the atmosphere
    of the planet into a balance that could sustain human life. Of the trillion trees
    on planet Earth, many have not been fully identified. Botanists guessstimate that
    around 9,200 species are as yet undiscovered—most existing in hot spots of global
    biodiversity—a number they believe they may have underestimated by as much as
    14 percent. There are only 73,300 families of trees on Earth. How could we have
    been so careless with what is so important to us all, I don''t understand, but
    the answers are still out there, waiting for a new set of eyes.'
