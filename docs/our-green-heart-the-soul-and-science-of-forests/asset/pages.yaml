  md: '# The Language of Trees


    Trees are my first memory. Night after night as a young child of four or five,
    and long before I had ever seen a film, the bright wall next to my bed became
    a screen as the shadows from trees outside my window played across the wallpaper.


    Some nights, these shadow canopies stretched and dipped in gentle, soothing movements.
    Other nights, when the wind accompanied the tide up the estuary, they reached
    grotesely, tore and tangled, them melted into a catastrophe of movement that seemed
    to strike at my very heart. Even then I knew they were talking to me, telling
    me something of themselves in a language I did not understand. This sense of the
    trees straining to communicate, with an effort that was heroic to my young eyes,
    has followed me for my entire life.


    In the morning sunshine, the shadows became real trees again. The charcoal colours
    of the night resolved themselves into a solid green. The canopies of the bay laurels,
    Laurus nobilis, growing on the terrace outside my window shook their leathery,
    dull-green leaves with reigned-restraint like thoroughbred horses. These trees
    were all mature, growing in a giant circle, once providing a turning space for
    the horse-drawn carriages that delivered Georgian ladies to the ample, curved
    front steps of their homes.


    When the sun shone through the tall, double-hung windows onto the floor, it was
    time to gather my dolls and visit the comfort of those trees. A sweet aroma rose
    from the darkened trees and gathered around me in my play world, this ring of
    life in which I felt safe. One by one, I placed my dolls against the trunks. The
    bay laurels seemed quietly satisfied to join in my games and never said a single
    puff of a windy me about the previous night’s shadowy shadowy lurching. On some
    damp days, the aroma under'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'the trees was overpowering. It flooded the air and seemed to pick up scents
    from the rich, dark soil.


    One lazy day, I decided that, like the shadow movements in the night, the daytime
    cipher of silence and sent its own message or code. I wanted to speak to the trees
    in their language, to understand what they were trying to tell me in their own
    green, leafy way. I had just learned to read in a kind of mental blitz. As I studied
    my favourite book for bedtime, a collection of nursery rhymes, the poem that began
    with "Ride a horse to Banbury Cross" suddenly became real for me. One second I
    not not understand the markings on thick cardboard page, the next I did. The words
    were built out of an alphabet that carried the code for speech.


    Everything must work like this, I thought. I have only to crack the codes. I first
    buried myself with the neighbour''s cat. He seemed silent, except for the purrs,
    but must also have his own cipher. For months I pulled the heavy orange cat onto
    my lap, sometimes luring indoors with my affections, other times sitting with
    him on the cold entrance steps next to the doorway boot pull. I listened for the
    changes in his rattling purr. I asked him questions, tiring the inquiries carefully,
    he seemed comfortable and content. I can report that the orange never spoke to
    me; not a single word came from under his whiskered nose. I had failed to find
    my cipher and went back to my dolls.


    My next attempt at code breaking was an accident. A lot happened in my young life.
    By the time I was fourteen, I''d lost both my parents. My mother was killed in
    a car wreck. My father, from whom we were estranged, passed under circumstances
    that remain unknown to me. Left in Cork, Ireland, in the case of a bachelor uncle,
    my mother''s brother Patrick, I retreated into myself, living in my mind. But
    slowly, my uncle''s books and his lively conversation, and the summers I spent
    in Lisheen learning the ancient knowledge and close-kept wisdom of the Celtic
    civilization, brought me back to the world—or helped me to find a new place in
    it. All this time, the cipher for life remained a puzzle I could not solve, but
    one that never fully left my thoughts. I looked for keys, for snatches of understanding,
    wherever I could. When my teachers in Lisheen,'
  merge: -1
