  md: '# The Wrong Trees in the Wrong Places


    Around the time Queen Victoria came to the throne in 1837, a pastime came into
    fashion. As the aristocracy had already benefited from the bounty of slavery,
    earning fortunes off the misery of others without lifting a finger, they also
    became adept at weaning. Young men yawned their way through Eton and Oxford’s
    Balliol College. Still yawning after graduation, they were fit for only one career,
    as far away as possible from the country estate—sent to Britain’s colonies to
    become remittance men. On their travels in their new climes, to ward off all yawning
    boredom, they collected plants, sending the best of their sampling back home.


    Trees from China and Japan came into high fashion. English estates were overrun
    with camellias, rhododendrons, Cryptomerias, and cedars from the Atlas Mountains
    and Lebanon. The search extended to Australia, and eucalyptus went home in bulk.
    Then the dainty trees from Chile, the monkey puzzle, Araucaria araucana, and climbing
    gazanias carefully housed in vast glass conservatories. Finally, the flood of
    expats hits North America, dragging redwoods—Sequoia sempervirens, the bigger
    better—back to the larger estates. The bluebloods stood for their portraits next
    to trophy trees wearing cavalry thrills, filled with the afterglow of the hunt.


    When the settlers in turn became wealthy, the flow of trees became reciprocal.
    They began importing the Scotch pines, Pinus sylvestris, from their home turf
    and planting them all over North America, from garden to ditch and back again.
    With industry and international trade revving up, plant nurseries began shipping
    trees back to fill in holes in the landscape.


    These exported trees, mostly pines, came largely from the west coast of Canada,
    where they enjoyed an excellent reputation with the Indigenous'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'Peoples. The shore or lodgepole pine, Pinus contorta, was planted by the millions
    around Irish lakes and estuaries. Then the Sitka spruce, Picea sitchensis, was
    similarly sown, an effort fuelled by the belief that what was good the seashore
    of western Canada would also be good for Ireland. Eventually, Irish children assumed
    they were witnessing their own native forests growing around them.


    The native species these transplants replaced were the bile, or sacred trees,
    that represented the medicine, health and wealth of the Celtic culture. As the
    forests were wiped out, the ancient wisdom attached to them went too, along with
    the Gaelic language. Today, fewer than a handful can recite the alphabet of trees
    called the Ogham script, still visible carved into stones in Ireland. This script
    was the forerunner of the famous Book of Kells.


    Cultures aren’t the only thing that such a relocation of tree species threatens
    and destroys. This has become clearer and clearer with the advent and acceleration
    of climate change. Native trees are bespoke for their own habitats, customized
    to fit perfectly, like a piece in a jigsaw puzzle. Their DNA is flexible, able
    to deal with changes in local conditions, like the odd drought or row of wet years.
    The trees hammer along in life, taking the inanimate rock under its roots and
    making something of it to feed itself. Its helpers in this effort are bespoke
    too, wispy mycelium communities that remain anonymous underground.


    Temperature is the master in the world of organic chemistry. It runs and ruins
    the biochemical world. The global thermostat for mammals lies somewhere between
    minus 30°C and 40°C. Some living creatures survive at higher or lower temperatures,
    but they are rare. Trees have their limits to. A temperature above 40°C will change
    the biochemical functioning within a tree and, consequently, in a forest. Like
    humans, trees can lose so much water by evaporation from their surface layers
    that they die from thirst. As global temperatures rise, the wrong trees in the
    wrong places can exacerbate these volatile situations and produce dire consequences.


    As an example, take California. For some reason, settlers in that state admired
    the whole tribe of eucalyptus and planted them in place of native'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'species. Like the seven hundred or other members of the family, the botanical
    giant Eucalyptus globulus, the blue gum, produces an oil primarily composed of
    eucalyptus. It is a box of matches. When the properties of eucalyptus are tested
    in a closed cup, it is found to have a flashpoint of just 48°C. These temperatures
    are achieved in drought-ridden California, where the soil itself, stripped of
    many of its native trees, acts as a heat reflector. In another of the adaptations
    through which the eucalyptus mastered the Australian climate millennia ago, the
    tree developed a deciduous bark, full of volatile oil and heat-sensitive resins.
    As the bark is shed, it creates a matting of fragments near and surrounding the
    tree, like dandelion. In a fire, an old or decaying tree or eucalyptus acts like
    a cluster bomb, sending sheets of flame across the countryside. This blanket of
    fire resonates with reflected heat, which in turn amplifies the burn, increasing
    its temperature until all is in ashes. The people of California now live with
    this horror on their doorsteps.


    The scale and intensity are new, but the burning itself isn''t. The native ecosystem
    of California has seen a cycle of fire from the beginning. Nature, as it does,
    managed over time to deal with this problem. Many of the treasury of trees native
    to the California seaside are fire-resistant. The Monterey pine, Pinus radiata,
    comes to mind. It is one of the world''s most valuable pines. This tree has modified
    its seed-bearing cones to withstand fire. The cones remain a perfectly viable
    seed crop, waiting for the heat of fire to open them. The seeds are protected
    by cone scales that are very thick, raised and rounded. This tree lives in harmony
    with the Monterey cypress, Cypress macrocarpa, the Gower cypress, C. goveniana,
    and the coast live oak, Quercus agrifolia, whose acorns are an important flour
    for the Native populations, eating as a health bread.


    These trees, now rarely seen outside Ireland, New Zealand, Australia, Chile and
    South Africa, were once part of a green firewall that tracked the long line of
    California’s coastal region and stretched up into the highlands, something like
    Africa’s “great wall,” which is being planted to reverse the desertification threatening
    the Sahel. The monster red,'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'Sequoia sempervirens, and the giant sequoia, Sequoiadendron giganteum, were
    once the pillars of this Californian firewall. Trees are condensing columns of
    water, and giant trees with tough, fibrous, deeply furrowed, scaly ridges, furnished
    with an inner cambial bark of living cells, not only hold water, drawing it up
    from the ground and in from the sea mists, but also repel fire. These trees protected
    California from the flames for nearly four thousand years, until they began to
    come down.


    All over the globe, this crazy situation continues to this day. Forests are removed
    and trees are transplanted in another place without any thought to the consequences
    for the people, plants and animals living in both areas. Luckily, trees have given
    the human family that most perennial and optimistic of gifts: the seed. Native
    forests can be repaired by planting the right kind of seed with the right genetic
    provenance in the place where it belongs. When we plant the wrong tree in the
    wrong place, we are hoping and praying for a donkey to win the Kentucky Derby.
    It won’t—now or ever.'
