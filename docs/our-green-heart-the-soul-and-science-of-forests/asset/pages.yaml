  md: 'nitrogen and phosphorus together with other micro-elements into forms that
    can be used by their overlords, the trees and plants above ground. There is a
    harmony of healthy organisms working in the soil to produce the bread that goes
    into the basket of life.


    The jewel in the crown for soil is a bulky and extraordinary molecule called humic
    acid. As I wrote in an earlier chapter, fulvic and humic acid play a vital role
    in seeding the oceans with iron. It now appears that this acid is part of an entire
    family of macromolecules. Huge by molecular standards, these structures come from
    the decomposition of organic matter that has died and returned to the soil. As
    decay from former forests, they are found in coal and peat. All go by the common
    name of allomelanin.


    The word melanin no doubt rings a bell, as these compounds are responsible for
    the pigmentation of the feathers, fur and skin you see all around you on a daily
    basis. Melanins are composed of polymeric structures that can shape-shape. They
    look like branching necklaces of beads and can be contained or spread out. They
    are slightly soluble in water, which makes them swell and appear pudgy. Their
    absorption is a great gift; melanins are the water keepers of the living soil.
    These huge beasts of compounds also act as tannins for seeds, being natural growth
    hormones.


    Melanins feed photons into the soil, your skin and every pigment around. They
    trap photons from the sun and free this energy into the natural world in ways
    that are not really understood. The photons force themselves into the phenolic
    ring structure of the melanins and disturb the valency balance. This energy is
    bled off as py electrons into places like the trunks of oak trees, making them
    able to withstand a stronger sun. This in turn allows the tree to produce a greater
    canopy and, thus, a greater crop of leaves for soil-making.


    Soil is a treasure, and so like many of the gifts forest give us, we understand
    little about it and the many things it does for us. Years ago, a friend of mine
