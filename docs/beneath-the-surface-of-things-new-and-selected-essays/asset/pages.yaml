    What this means for you is very simple. There are tens of thousands of teachers
    out there in every corner of the world that you did not even know you had.


    You can sail with Polynesian wayfinders, navigators who can sense the presence
    of distant atolls beyond the visible horizon simply by watching the reverberation
    of waves across the hull of your vessels.


    You can follow the Tendai monks in Japan, who as part of their initiation run
    seventeen hours at a stretch every day for seven years, wearing five pairs of
    sandals a day.


    You can join a caravan of blue-rooted Tuareg in the searing sands of the Sahara
    or hunt narwhal with the Inuit in the light of the midnight sun. You can sit by
    the side of a bodhishisattva in a Tibetan cave or study medicine at the foot of
