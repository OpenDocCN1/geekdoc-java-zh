    # WHY ANTHROPOLOGY BOAS MATTERS


    **2012**, both *Kiplinger* and *Forbes* ranked anthropology as the least valuable
    undergraduate major, unleashing a small wave of indignation as many outside the
    field rushed to defend the study of culture as ideal preparation for any life
    or career in an interconnected and globalized world. The response from professional
    anthropologists, confronted by both an existential challenge and public humiliation,
    was earnest but largely ineffective, for the voice of the discipline had been
    muted by a generation of self-absorption, tempered by a disregard for popular
    engagement that borders on contempt.


    Ruth Benedict, acolyte of the great Franz Boas and in 1947 president of the American
    Anthropological Association (AAA), said that the very purpose of anthropology
    was to make the world safe for human differences.


    Today, such activism seems passé as a pith helmet. In the immediate aftermath
    of 9/11, the AAA met in Washington, D.C. Four thousand anthropologists were in
    the nation''s capital in the wake of the biggest story of culture they or the
    country would ever encounter. The entire gathering earned but a mention in the
    *Washington Post*, a few lines in the gossip section essentially noting that the
    nutcases were back in town. It was hard to know who was more remiss, the government
    for failing to listen to the one profession that could have'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'answered the question Why do they hate us? or the profession itself for failing
    to bring its considerable insights to the attention of the nation.


    Perhaps fittingly it took an outsider to remind anthropologists why anthropology
    matters. Charles King, professor of international affairs at Georgetown University,
    begins his remarkable book The Reinvention of Humanity by asking us to envision
    the world as it existed in the minds of our grandparents. Race, he notes, was
    accepted as a given, a biological fact, with lineages dividing white from Black
    back through primordial time. Differences in customs and beliefs reflected differences
    in intelligence and destiny, with every culture finding its rung on an evolutionary
    ladder rising from the savage to the barbarian to the civilized of the Strand
    in London, with technological wizardry, the great achievement of the West, the
    sole measure of progress and success.


    Sexual and behavioral characteristics were presumed to be fixed. Whites were smart
    and industrious, Blacks physically strong but lazy, and some people were barely
    distinguishable from animals; late as 1902, it was debated in parliament in Australia
    whether Aboriginal people were human beings. Politics was the domain of men, charity
    work and the home the realm of women. Women’s suffrage in America only came in
    1920. Immigrants were seen as a threat, even by those who had themselves just
