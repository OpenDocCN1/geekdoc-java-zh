  pgno: 209
- img_proc: true
  md: 'expectations and behaviors essential to survival in the forest. There is no
    separation between nature and culture. Without the forest and the rivers, humans
    would perish. But without people, the natural world would have no order or meaning.
    All would be chaos.


    Maintaining the flow of generative energy, fomenting reciprocity among all forms
    of life, is the duty of the shaman, who is neither priest nor physician; he is
    a diplomat in constant dialogue with the spirit realm, with all the responsibilities
    of a nuclear engineer who must, if necessary, enter the heart of the reactor and
