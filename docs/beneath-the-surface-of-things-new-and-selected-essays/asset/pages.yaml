    # ON THE SACRED


    AS A BOY I PRAYED EVERY NIGHT, hands together, elbows perched on the sill of a
    bedroom window open to the winter air, eyes wide to the stars sparkling through
    the branches of the giant elm trees that in those years still in in neighborhoods
    of old Quebec. I conversed with a God whose presence could be felt and whose spiritual
    authority and omnipotence I accepted as an act of faith.


    My parents, broken by the war, rarely saw the inside of a church. So, from the
    age of six, I diligently set off every Sunday on my own and continued to do without
    for five years. I still have the gold pin with the silver cross that rewarded
    my attendance record. Like a pilgrim at the gates of a great cathedral, I didn''t
    attend service to worship the building; I went to there in the presence of God.
    For a long time, he was always to be found. But, as the years went by and I learned
    more and more about the world, there came a day when I simply failed to show.
    I never again entered a church as a Christian believer.


    When, years later, I returned to that small community as an adult, what astonished
    me most was how small my universe had been and how intimately I had known it.
    Every blade of grass resonated with a story. Shadows marked the ground where trees
    had fallen in my absence. Innovations and new construction I took as as personal'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'insults, violations of something sacred that lay at the confluence of landscape
    and memory.


    What I felt so powerfully in that moment was not nostalgia but rather a connection
    to the actual force that for all those years had propelled my spiritual yearning,
    a numinous energy that, thanks to my friend Shefa Siegel, I now recognize as being
    the essence of the sacred, the invisible presence that the French philosopher
    Henry described as the imagina, a suprensory dimension that transcends religion,
    a space of intuition and revelation impossible to describe yet accessible to those
    in every culture who perceive the world, as Corbin wrote, “through the eyes of
    the heart.”


    My longings as a child, I realized, at least not in a formal sense; I’d been looking
    for a path that embraced the mystic among the multitudes, the promise of all people
    in all places through all time who had found peace and comfort in their pursuit
    of the divine. I came to see God as the product of our desires. Our spirit and
    imagination transform an edifice of stone into a sacred space. A shrine is sanctified
    by the legacy of all those who come before, with their hopes, fears, promises,
    and prayers.


    Relics, icons, chalices, and crosses—all simple objects crafted from wood, silver,
    and bone—take on spiritual resonance only over time, like old tools worn from
    decades of human touch. Sacrifice means to make sacred, and if as anthropology
    suggests, that the sacred can never be divorced from human agency. We dream the
    sacred into being. Ritual is the ground from which it springs. The sacred becomes
    manifest through the enactment of rituals that summon the spirit and give to the
    divine.


    In Haiti, the waterfall at Saut d’Eau is the home of Damballah Wedo, the serpent
    god, repository of spiritual wisdom and the source of the falling waters. When
    the first rains fell, a rainbow, Ayida Wedo, was reflected. Damballah fell in
    love with Ayida, and their love entwined them in a cosmic helix from which all
    creation was fertilized. Every summer, over three days in July, as many as fifteen
    thousand pilgrims, all devotees of the Lwa, the spirits of the Vodoun'
