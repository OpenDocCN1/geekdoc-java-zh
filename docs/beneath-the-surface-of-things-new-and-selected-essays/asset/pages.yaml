    Political movements are built upon the possibility of change, possibilities brought
    into by new ways of thinking. Before any of these struggles could flourish, something
    fundamental, some flash of insight, to challenge and, in time, shatter the intellectual
    foundations that supported archaic beliefs irrelevant to our lives today as the
    notions of nineteenth-century clerg, certain that the Earth was six thousand years
    old.


    The catalyst, as Charles King reminds us, was the wisdom and scientific genius
    of Franz Boas and a small band of courageous scholars—Margaret Mead, Alfred Kroeber,
    Elsie Clews Parsons, Melville Herskovits, Edward Sapir, Robert Lowie, Ruth Benedict,
    Zora Neale Hurst, and many others—contrarians all, who came into his orbit, destined
