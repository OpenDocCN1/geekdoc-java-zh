  md: 'Pandemics and plagues have a way of shifting the course of history, and not
    always in a manner immediately evident to the survivors. In the fourteenth century,
    the Black Death killed close to half of Europe''s population. A scarcity of labor
    led to increased wages. Rising expectations culminated in the Peasants'' Revolt
    of 1381, an inflection point that marked the beginning of the end of the feudal
    order that had dominated medieval Europe for a thousand years.


    The COVID pandemic will be remembered as such a moment in history, a seminal event
    whose significance will unfold only in the wake of the crisis. It will mark this
    era as much as the 1914 assassination of Archduke Ferdinand, the stock market
    crash of 1929, and the 1933 ascent of Adolf Hitler became benchmarks of the last
    century, all harbingers of greater and more consequential outcomes.


    COVID''s historic significance lies not in what it implies for our daily lives.
    Change, after all, is the constant of culture. All people in all places at all
    times are always dancing with new possibilities for life. As companies eliminate
    or downsize central offices, as employees work from home, restaurants close, shopping
    malls shutter, streaming brings entertainment and sporting events into the home,
    and airline travel becomes ever more difficult and miserable, people will adapt,
    as we''ve always done. Fluidity of memory and a capacity to forget is the most
    haunting trait of our species. As history confirms, it allows us to come to terms
