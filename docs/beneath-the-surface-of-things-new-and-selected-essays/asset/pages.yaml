    Although some may have read the piece as an indictment, I wrote it as an intervention.
    If a family member is in trouble, the first act is to hold up a mirror to them
    see how far they have fallen, which is the beginning of the path to rehabilitation
    and recovery. The essay attracted a global readership, I''d like to think, not
