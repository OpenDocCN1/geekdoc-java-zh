- img_proc: true
  md: 'A professor of anthropology at UCLA, Johannes had lived and worked among the
    Winikina Warao in the Orinoco delta of Venezuela for more than forty years. As
    a graduate student, I would fly from Boston to Los Angeles just for the chance
    to spend a weekend with him at his cabin in the San Gabriel Mountains, as his
    mind ranged across the entire field of anthropology, sessions that invariably
    left me mentally exhausted but intellectually on fire. He was a gifted teacher,
    with a way of distilling the grandest notions in a phrase.

    “Anthropology,” he would say, “reveals what lies beneath the surface of things.”
    It calls not for the elimination of judgment, only its suspension, so that the
    judgments we are all ethically obliged to make as human beings may be informed
    ones. At its best, the anthropological lens allows us to see, and perhaps seek,
    the wisdom in the middle way, a perspective of promise and hope that all of the
    essays in this collection aspire to convey.'
