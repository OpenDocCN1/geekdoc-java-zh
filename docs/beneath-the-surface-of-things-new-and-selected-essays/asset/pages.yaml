    the white eigent of the rain, they become the ancestors, relieving their mythic
    journeys, enlightening all the sacred sites, transcending every form, becoming
    as if a single pulse of pure energy flowing through all of creation.


    Each of these stories, these cultural accounts, is rooted in place, the product
    of a particular way of thinking, a unique vision of life itself. But they all
    express a common impulse: a fundamental human desire to engage not death but life
    as it is, the invisible forces that lie all around us, the realm of the imaginal
    in the here and now. Death, of course, is the great mystery, the edge beyond life
    as we know it ends and wonder begins. How a culture comes to terms with the inescapable
    separation that death implies determines its religious worldview. Stripped to
    the bone, most religious longings and traditions come come down to a simple desire
    to wrestle with eternity and come out on top. The pursuit and embrace of the sacred,
    by contrast, has nothing to do with death; it is all about life.


    The sacred is eternal, reaching far into the past, shining as a beacon to the
    future. It is everywhere and nowhere. What is sacred can never be diluted or compromised,
    co-opted or copied, commodified or made sordid through commerce and greed. Sensed
    if never seen, elusive and mysterious by its very nature, the sacred'
