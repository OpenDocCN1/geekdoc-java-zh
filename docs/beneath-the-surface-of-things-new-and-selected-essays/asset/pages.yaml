    Events over these last months have surely challenged such complacency, raising
    any number of disturbing questions, many of which are explored in a brilliant
    and widely heralded book by the Harvard historian Jill Lepore. In These Truths:
    A History of the United States, she calls for a wrenching re-examination of the
    very idea of America. As surely as Dorothy’s dog, Toto, reveals the true identity
