    THE ENGLISH COME LATE to the Americas. The Spaniards founded St. Augustine in
    1565, Santa Fe in 1607. The French reached the island of Montreal in 1534 and
    1608 were building a fortress to dominate the St. Lawrence River at Quebec. Sir
    Walter Raleigh sent an expedition to the outer banks of North Carolina only in
    1585. The following spring, Sir Francis Drake, with three hundred Africans in
    chains, arrived to resupply the fledgling settlement, only to find everyone desperate
    to leave. To make room on his ship, he was obliged to dump unwanted cargo into
    the sea. Also left behind in the sand were the pathogens that would conquer a
    continent. When John Winthrop, founder of the Massachusetts Bay Colony, arrived
    but a generation later, he noted with pleasure that smallpox had swept away the
    Native people, a sure sign of divine intervention that allowed him to occupy an
    empty land as rightfully as Abraham had displaced the Sodomites.


    Winthrop and his Puritans were spiritual outliers, cut from the same cloth as
    many washed ashore in those early years, members of sects that England denied
    and persecuted, zealots who came to America in search of freedom so that they
    might practice, without interference, their own forms of religious intolerance.
    Their was a dream of Zion. The inconvenient presence of people native to the land
    was resolved by disease, which ultimately killed 90 percent of the Indigenous
    population. Those who survived were erased from history, as colonists invoked
    Aristotle to argue that those who did not own the land in any manner recognizable
    to an Englishman were by nature slaves. Terra nullius—land belonging to nobody—was
