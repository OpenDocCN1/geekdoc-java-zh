    or that a Jewish friend might find solace in the Buddhist dharma, or that a person
    born with a male body could self-identify as a woman, then you are a child of
    anthropology.


    If you recognize that marriage need exclusively imply a man and a woman, that
    single mothers can be good mothers, and that two men or two women can raise good
