    was free of polemics, unburdened by ideology, and written with real concern and
    empathy for a nation that had made my own life disappoint your heart, as Cory
    Booker writes, then you don''t lose her enough.


    Several of the other essays in the collection are published here for the first
    time: “The Promised Land,” “Beyond Climate Fear and Trepidation,” “A Message to
    a Daughter,” and “Mother India.” Others have previously appeared in various publications.
    “The Art of Exploring” first ran in the Financial Times (September 2, 2020); “Why
    Anthropology Matters” in Scientific American (February 1, 2021); “This Is America”
    in the Literary Review of Canada (July–August 2021); “The Divine Leaf of Immortality”
    on Alexander (2021); “A New World for Indigenous” in the Globe and Mail (March
    25, 2023); “The Crowning of Everest” appeared in 2021 as the introduction to the
    Summit, 1921 to 1953. “From the Sacred” was originally written for Sacred, a large-format
    illustrated book published by Insight Insights in 2022. “War and Remembrance”
    appeared in the commemorative anthology In Flanders Fields: 100 Years; Writing
    on War, Loss and Remembrance, published by Knopf Canada in 2015.


    I most assuredly did not write these essays with a book in mind. Eclectic would
    be too generous a term for such seemingly random selection of topics and themes.
    But as I worked through the idea with Nancy Flight, my editor and good friend
    at Greystone, she discerned a consistent point of view that brought to mind something
    that one of my great mentors, the late Johannes Wilbert, once told me.'
