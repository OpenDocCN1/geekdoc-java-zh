    # THE PROMISED LAND


    FOR ALL ITS HISTORY, Jerusalem has been a spiritual locus of the world, the place
    where God resides. All three of the Abrahamic religions—Judaism, Christianity,
    and Islam—consider it a holy city. Some of the most sacred sites of all three
    religions are found in Jerusalem, and all three share and claim a single site,
    the Temple Mount, the axis mundi of the universe.


    Jerusalem has been the ancestral and spiritual home of the Jewish people since
    the tenth century BCE. Three times a day, for thousands of years, Jewish prayers
    from around the world have been directed toward the city and the Temple Mount,
    whence they are said to ascend to heaven. The Talmud says: "If someone is praying
    outside the Land of Israel, he should direct his heart in the direction of Israel.
    When praying within Israel, direct the heart toward the Temple." Those in Jerusalem
    should direct their hearts to the Temple.


    Jewish reverence for the city and the Temple Mount is rooted in biblical history.
    It was on this height of land that Abraham spoke to God and came close to sacrificing
    his son Isaac, before forging a covenant with God that secured the eternal life
    of the Jewish people. From here Jacob dreamed of the ladder ascending to heaven.
    When Solomon, son of David, completed the First Temple in 950 BCE, he beseeched
    God to heed the prayers of Jews and non-Jews alike,'
