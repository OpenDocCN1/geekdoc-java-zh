    # A MESSAGE TO A DAUGHTER


    LET ME TELL YOU A STORY that begins on a ridge in Borneo, close to dusk with thunder
    over the valley and the forest alive with the electrifying roar of black cicadas.
    I was sitting by a fire with an old friend, Asik Nyelit, headman of the Ubong
    River Penan, one of the last nomadic peoples of Southeast Asia.


    The rains, which had pounded the forest all afternoon, had stopped, and the light
    of a partial moon filtered through the branches of the canopy. Earlier in the
    day, Asik had killed a barking deer. Its head roasted in the coals.


    At one point, Asik looked up from the fire, took notice of the moon, and quietly
    asked me if it was true that people had actually journeyed there, only to return
    with baskets of dirt. If that was all they had found, why had they bothered to
    go?


    Asik''s question provoked the timeless answer. The true purpose of the space journeys,
    or at least their most profound and lasting consequence, lay not in wealth secured
    but a vision realized, a shift in perspective that would change our lives forever.


    The seminal moment came on Christmas Eve, 1968, when Apollo 8 emerged from the
    dark side of the moon to see rising over its surface not a sunrise but the Earth
    itself ascendant, a small and fragile planet, floating in the velvet void of space.
    This image more than any amount of scientific data showed us that our planet is
    a'
