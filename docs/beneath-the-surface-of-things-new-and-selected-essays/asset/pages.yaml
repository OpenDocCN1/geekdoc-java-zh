  md: 'essence of the mountain returns to the villages to bring fertility to the fields,
    well-being to the families, health to the animals. Pilgrimage through sacred geography,
    homage to the gods, becomes a collective prayer for the cultural survival of the
    entire pan-Andean world.


    When the first humans reached the shores of Australia, they went walking, establishing
    in time more than thousand clan territories, independent homelands all bound together
    by the Songlines, tracks followed by the primordial ancestors, who, in the time
    of the Rainbow Serpent, sang the world into being. Aboriginal people today trace
    the Songlines and chant the stories of the first dawning, they enter the Dreamtime,
    which is neither a dream nor a measure of the passage of time. It is the very
    realm of the ancestors, a parallel universe where the ordinary laws of time, space,
    and motion do not apply, where past, future, and present merge into one.


    To walk the Songlines is to become part of the ongoing creation of the world,
    a place that both exists and is still being formed. Aboriginal people are not
    necessarily attached to the earth, they are essential to its existence. Without
    the land, they would die. Without the people, the earth would wither. Should the
    rituals stop, the voices fail silent, all would be lost. Everything on earth is
    held together by the Songlines, just as everything is subordinate to the Dreaming,
    which is constant but ever-changing. Every landmark is wedded to a memory of its
    origins and always in the process of being born. Every animal and object resonates
    with the pulse of an ancient event, while still being dreamed into being. The
    land is encoded with everything that has ever been, everything that will ever
    be, in every dimension of reality. The world is perfect, though being reimagined
    and renewed. To walk the land and honor the Songlines is to engage in a constant
    act of affirmation, an endless dance of creation.


    The most profound cultural insight of the Barasana and Makuna, whose lives unfold
    in the forests of the Colombian Amazon, is the realization that plants and animals
    are but people in another dimension of reality. Mythology infuses land and life
    with meaning. Ritual reinforces the norms that drive social behavior, encoding'
