    was on average six inches taller than that of enlisted men, simply because of
    nutrition. As for the blind, deaf, and dumb, the cripples, morons, mongólicos,
    and the mad, they were best locked away, lobotomized, and even killed to remove
    them from the gene pool.


    The superiority of the white man was accepted with such assurance that the Oxford
    English Dictionary in 1911 had de no entries for racism or colonialism. As recently
    as 1965, Carleton Coon completed a set of two books, The Origin of Races and The
    Living Races of Man, in which he advanced the theory that the political and technological
    dominance of Europeans was a natural consequence'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'of their evolved genetic superiority. He even asserted that “racial intermixture
    can upset the genetic as well as the social equilibrium of a group.” Coon, at
    the time of his retirement in 1963, was a respected professor and curator at the
    University of Pennsylvania. Interracial marriage remained illegal across much
