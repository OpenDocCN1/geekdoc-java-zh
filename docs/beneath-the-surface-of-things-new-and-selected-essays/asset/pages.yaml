  md: 'Their America was all about settlement and always had been—settlement and slavery.
    Natives captured in war were sold in bondage to Caribbean plantations, including
    the nine-year-old son of Metacom, the great Wampanoag sahem who was drawn and
    quartered in Plymouth in 1676, his head mounted on a pike. Africans in shackles,
    crammed into holds slippery with blood and vomit, and great stores of indigo,
    tobacco, hides, and sugar to yield molasses and rum; these were the products of
    the Atlantic trade, a triangle of exchange that propelled the growth of all the
    colonies. There was no north and south. Half the wealth of New England was derived
    from sugar grown on West Indian plantations worked by the enslaved.


    In Virginia, liberty and slavery came into the world as siblings, born in the
    same year, 1619, as landowners met in a legislative body, the House of Burgesses,
    and the first Africans ashore in chains at Point Comfort. The Puritans of Massachusetts,
    the Dutch of New York, the Quakers of Pennsylvania all exploited slave labor.
    In the early years of the eighteenth century, half the households of New York
    possessed slaves; by 1776, they were fully a quarter of the population. The original
    wall for Wall Street was built by the enslaved to enclose the site of slave auctions.
    The city itself is named for the Duke of York, the future king and founder of
    the Company of Royal Adventurers, an innocent name for an enterprise that carried
    three thousand Africans a year to Barbados and Jamaica, each branded on the breast
    with the initials D.Y. In 1738 in Philadelphia, Benjamin Franklin published one
    of the first books against the evils of the trade; at the time, he was himself
    the owner of three slaves, Joseph, a boy, and Peter and Jemima, husband and wife.


