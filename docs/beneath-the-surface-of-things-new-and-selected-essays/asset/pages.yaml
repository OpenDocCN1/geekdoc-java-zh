    Widely acknowledged as the father of American cultural anthropology, Franz Boas
    was the first scholar to explore in a truly open and neutral manner how social
    perceptions are formed, and how members of distinct societies become conditioned
    to see and interpret the world. What, he asked, was the nature of knowing? Who
    decided what was to be known? How do seemingly random beliefs and convictions
    converge into this thing called *culture*, a term that he was the first to promote
    as an organizing principle, a useful point of intellectual departure.


    Far ahead of his time, Boas recognized that every distinct social community, every
    cluster of people distinguished by language or adaptive inclination, was a unique
    facet of the human legacy and its promise. Each was a product of its own history.
    None existed in an absolute sense; every culture was a model of reality. We create
    our social realms, Boas would say, determine what we define as common sense, universal
    truths, the appropriate rules and codes of behavior. Beauty reality does lie in
    the eye of the beholder. Manners do not make the man; people invent the manners.
    Race is a cultural construct, derived from nothing but born in the realm of ideas.


    Critically, none of this implied an extreme relativism, as if human behavior must
    be accepted simply because it exists. Boas never called for the elimination of
    judgment, only for its suspension so that the very judgments we are ethically
    and morally obliged to make as human beings be informed ones. Even as he graced
    the cover of *Time* magazine in 1936, a German Jew in exile from a homeland already
    dripping in blood, Boas railed against the cruel conceits and stupidity of scientific
    racism. Inspired by his time among the Inuit on Baffin Island, and later among
    the Kwakwaka''wakw in the salmon forests of the Pacific Northwest, he informed
    all who'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'would listen the other peoples of the world were not failed attempts to be
    them, failed attempts to be modern. Every culture was a unique expression of the
    human imagination and heart. Each was a unique answer to a fundamental question:
    What does it mean to be human and alive? When asked that question, humanity responds
    in seven thousand different languages, voices that collectively comprise our repertoire
    for dealing with all the challenges that will confront us as a species.


    Boas would not live to see his insights and intuitions confirmed by hard science,
    let alone define the zeitgeist of a new global culture. But, eighty years on,
    studies of the human genome have indeed revealed the genetic endowment of humanity
    to be a single continuum. Race truly is a fiction. We are all cut from the same
    genetic cloth, all descendants of common ancestors, including those who walked
    out of Africa 65,000 years ago, embarking on a journey that over 40,000 years,
    a mere 2,500 generations, carried the human spirit to every corner of the habitable
    world.


    But here is the important idea. If we are all cut from the fabric of life, then
    by definition we share the same mental acuity, the same raw genius. Whether this
    intellectual potential is exercised through technological innovation or through
    the untangling of complex threads of memory inherent in a myth is simply a matter
    of choice and orientation, adaptive insights and cultural emphasis. There is no
    hierarchy of progress in the history of culture, no evolutionary ladder to success.


    Boas and his students were right. The brilliance of scientific research, the revelations
    of modern genetics, has affirmed in an astonishing way both unity of humanity
    and the essential wisdom of cultural relativism. Every culture really does have
    something to say; each deserves to be heard, as none has a monopoly on the route
    to the divine.


    As a scholar, Boas ranks with Einstein, Darwin, and Freud as one of the four intellectual
    pillars of modernity. His core idea, distilled in the notion of cultural relativism,
    was a radical departure, as unique in its way was as Einstein''s theory of relativity
    in the discipline of physics. Everything Boas proposed ran against orthodoxy.
    It was a'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'shattering of the European mind, the sociological equivalent of the splitting
    of the atom. And though his research took him to esoteric realms of myth and shamanism,
    symbolism and the spirit, he remained grounded in the politics of racial and economic
