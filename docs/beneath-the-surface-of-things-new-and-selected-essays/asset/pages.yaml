  md: '# A NEW WORD FOR INDIGENOUS


    THERE ARE WORDS THAT, through overuse, lose their power and authority, causing
    the eyes to glaze over. *Sustainability* is surely enough. *Indigenous* may be
    another.


    As both a construct and a category, the term *Indigenous* first gained wide acceptance
    in the 1970s, elevated by anthropologists no longer comfortable with the language
    of their discipline. Referring to living peoples and cultures as *Indigenous*
    was certainly a step up from *primitive* and *savage*, words that appeared without
    shame in the early ethnographic literature.


    For those whom the concept conceived embraced it as an essential part of their
    identity. The designation is today universally accepted, having been codified
    by national and international bodies, most notably in the 2007 Nations Declaration
    on the Rights of Indigenous Peoples, which recognizes Indigenous as those “having
    a historical continuity with pre-colonial societies that developed on their territories”
    and who consider themselves distinct from the “societies now prevailing on those
    territories.”


    *Indigenous*, by this definition, embraces the myriad of cultures that have a
    shared history of subjugation and subservience and whose traditional homelands
    are today encompassed by the web of boundaries that mark the arbitrary limits
    of nation-states forged for the most part from the wreckage of nineteenth-century
    colonialism.'
