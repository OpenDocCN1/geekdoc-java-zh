    The colonial experience in New France was very different. There, in a northern
    land with more lakes than people, where winter dictated the mood mercantile zeal
    drove an economy based on a fashion statement, the beaver hat. For its first 240
    years, what would become Canada was not a settler society; it became such only
    in the mid-nineteenth century. The early French and later Scots were by no means
    kind to Indigenous communities, but they never set out to slaughter them. Alliances
    with First Nations were essential to a trade that was, from the start, dependent
    on their knowledge and skills. As John Ralston Saul has written, the fur traders
    did not murder the Indians; they married them and in doing so moved up in the
    world.


    To the south, the Spaniards had even less interest in settlement. Their imperial
    regime was based on extraction, plunder possible by the wealth of the vanished,
    the stolen treasures of a continent. The Crown deliberately mired its colonies
    in ignorance, if only to better exert control. Books and newspapers of any Spanish
    origins were banned. No colonial subject could possess a printing press. By law,
    no man born in the colonies could own a mine or a vineyard, grow tobacco or olive
    trees, plant grapes or sell goods in the street, or trade in gold, silver, copper,
    pearls, or emeralds, in leather, sugar, cotton, or wool, in basic foods such as
    potatoes and tomatoes. None could travel without permission.


    Such oppression implied torment for the poor, degradation and dishonor for the
    rich, all guaranteeing that in time the people would come together as a single
    revolutionary force, as they did in 1812 under Simón Bolívar, forged an army from
    runaway slaves, landed gentry, and landless peasants. Miscegenation was the norm.
    As early as 1775, free Blacks outnumbered the enslaved throughout the Spanish
    possessions. Tradition dictated that the wealthy, with an eye to God, liberate
    their slaves in their wills. Complete emancipation came in 1826, a decade after
    Bolívar had freed his own slaves, something Washington did only at his death;
    Jefferson and Madison never did it it at all.'
