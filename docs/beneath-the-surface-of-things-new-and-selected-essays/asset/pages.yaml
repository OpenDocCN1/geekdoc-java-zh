  md: 'With power in all these new nations invariably consolidated in the hands of
    political elites, backed by militaries serving at the behest of the state, there
    is every reason for ethnic groups under threat to rally around a shared identity.
    As both a legal designation, and a political declaration, the term *Indigenous*
    emerged as an essential expression of solidarity, eminently worthy of support
    and respect.


    Still, the word is problematic. For one, it implies that some of us are, and others
    are not, indigenous to the planet, which is both incorrect and the wrong message
    to send to our children. Nurturing a spirit of peace, displaying fidelity to land
    and water, and embracing with conviction the obligations of stewardship ought
    surely to be aspirations, indeed imperatives, for all people and all human societies.
    As the poet Gay Snyder wrote, “We must all become Native Americans, whatever our
    ethnic background, if there’s to be any hope for ecological and cultural vitality
    on our shared Turtle Island.” Snyder did not have in mind cultural appropriation;
    he was talking about the urgent need to change the way that we humans inhabit
    this planet.


    There is another issue. The great majority of the world''s seven thousand languages—some
    6,500 or more—are spoken by those deemed by academic convention to be Indigenous.
    To wrap the lion''s share of the world''s cultural diversity in a single category,
    slapping upon it one word as a convenient label, suggests a uniformity to culture
    that ethnicity vehemently denies.


    Every culture is the product of its own history. The Nenets reindeer herders of
    Siberia, the Barasana living in the forests of the Colombian Amazon, and the Dogon
    dwelling in the cliffs of the Bandiagara escarpment in Mali have no in common
    culturally that the French, Russians, and Chinese do. Associating the former as
    *Indigenous peoples* is as arbitrary and ultimately meaningless as subsuming the
    latter into a coveted category of *industrial peoples*.


    That such a bucket approach to culture also serves to reinforce a tired colonial
    stereotype largely unnoticed, oddly enough, even among those most earnest in their
    efforts to decolonize our thinking. To suggest that only some cultures are Indigenous
    implies, as noted, that there is another cohort of humanity that is something
    else.'
