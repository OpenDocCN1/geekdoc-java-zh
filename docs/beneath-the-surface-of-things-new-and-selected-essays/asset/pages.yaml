    # THIS IS AMERICA


    ONE OF THE JOYS of living in Washington, D.C., was the promise of spring days
    with the cherry blossoms in bloom and friends arriving from out of town, all of
    them keen to experience the great monuments and sweeping vistas of the nation’s
    capital. Even the most jaded among them—modern architects, for example, dismissed
    the entire city as a neoclassical park—could not mask their emotions when standing
    in the historic shadow of Martin Luther King Jr., pausing on the stone steps that
    overlook the still waters of the Reflecting Pool, or staring at a black granite
    wall, polished to a mirror finish, as aging vets and heartbroken mothers reached
    to touch the names of brothers and loved ones lost in the jungles of Vietnam.
    I took both pride and care in gently curating our outings, knowing from experience
    how much visitors could take, both physically and emotionally.


    We began always with Maya Lin’s dark masterpiece and then, passing over Korea,
    much as history has done, made our way to the Lincoln Memorial. On one wall, etched
    in limestone, is the Gettysburg Address—the English language compressed to perfection.
    Equally inspired is the president’s First Inaugural Address, written for a nation
    torn by secession but not yet at war. Invoking“the mystic chords of memory,” Abraham
    Lincoln beseeched all Americans, north and south, to take time and reach'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'for the “better angels of our nature.” That the country ignored his plea is
    etched in sorrow upon his face, carved in marble, in a massive sculpture that
    sits steady in repose, gazing half the length of the National Mall to the Washington
    Monument, which dominates the ceremonial heart of the capital. The axis mundi
    of democracy, it is the tallest stone structure in the world, dwarfing any obelisk
    conceived by the pharaohs of Egypt.

    The monument stands on the heights of a broad, grassy knoll, surrounded at the
    base by a circle of flags that represent the fifty states of the union, its pyramidal
    capstone seeming to soar into the heavens. No building in Washington is allowed
    to be taller. Though built to honor the first president, it visually recalls the
    trials of the sixteenth, martred and murdered in the wake of a national crisis
    that brought construction to a halt for twenty years. A distinct break in coloration—lighter,
    darker above—marks where work stopped and was later resumed, as if the entire
    nation in the prelude had indelibly stained by the blood of fratricidal water.

    Across the Potomac River, some distance away, a hill rises to the mansion portico
    where Robert E. Lee once paced, lost in thought as he struggled to decide whether
    to command the Union army, at Lincoln’s request, or to serve the Confederate cause.
    History recalls his torment: loyal to the nation, yet incapable of betraying his
    beloved state of Virginia. Lee’s rebel forces would fight the Union for five years,
    in battles that left tens of thousands of dead. Many would be buried on land confiscated
    from Lee and his family, the only sanction to be for a man whose choice of sedition
    was singularly responsible for prolonging a war that brought misery to millions.

    After Lincoln and all his sorrows, we would stroll around the Tidal Basin to reach
    the steps of the Jefferson Memorial, perhaps the most moving of all the monuments,
    both in design and in the power of its message. Just to stand in the cool shade
    of its soaring vault, with Thomas Jefferson’s words inscribed on white marble,
    is to rekind a childlike faith in the great experiment that began a century before
    the agonies of civil war.

    ched in the frieze below the dome is the perfect distillation of the Enlightenment:
    “I have sworn upon the altar of God eternal hostility'
  merge: -1
