    of air, water, wind and soil. This revelation, only made possible by the brilliance
    of science, sparked a paradigm shift that people will be speaking about for the
    rest of history.


    Almost immediately, we began to think in new ways. Just imagine. Fifty years ago,
    simply getting people to stop throwing garbage out of a car window was a great
    environmental victory. No one spoke of the biosphere or biodiversity; now these
    terms are part of the vocabulary of schoolchildren.


    Like a great wave of hope, this energy of illumination spread everywhere. So many
    positive things have happened in the intervening years. In little more than a
    generation, women have gone from the kitchen to the boardroom, gay men and women
    from the closet to the altar, African Americans from the back door and the woodshed
    to the White House. What''s not to love about a country and a world capable of
    such scientific genius, such cultural capacity for change and renewal?


    But let me share one other revelation of science. It''s the moon shot of your
    generation. It, too, will be remembered in a thousand years. Nothing in our lifetimes
    has done more to liberate humanity from the parochial tyrannies that have haunted
    us since the birth of memory.


    This, too, came about at the end of a long voyage of discovery, a journey into
