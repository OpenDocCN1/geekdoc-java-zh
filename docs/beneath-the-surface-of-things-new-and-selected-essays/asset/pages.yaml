  md: 'the place of ethnographic expeditions. Writing was a way of making sense of
    the whirlwind of solitude that had become our lives.


    The essays in this new collection, written for the most part during the months
    of the pandemic lockdown, cover a great deal of ground, from war and race to mountains,
    plants, climate, exploration, the promise of youth, and the essence of the sacred.
    They are linked less by theme than by circumstance. They all come about the unhurried
    months when one had traveled incessantly was obliged to stay still, even when
    events flared on all sides in a world that never stops moving.


    One of the notable contributions in the collection, “The Unraveling of America,”
    exemplifies the serendipitous, even accidental, manner by which so many of these
    essays come about. Early in the pandemic, invited by several editors and publications
    to write about the crisis, I hesitated, uncertain that I had anything to contribute.
    Then one summer evening late in July, as I paddled a kayak around an island, it
    struck me that the pandemic was less a story of medicine and public health than
    one of history and culture.


    Over the next two days, I wrote seven thousand words, which went unsolicited to
    an old friend, Jann Wenner, founder of Rolling Stone. Jann shared the piece with
    his son Gus, who passed it on to his editorial team. After some clever reworking,
    it was posted on the Rolling website on August 6, 2020. Within weeks, it had attracted
    five million readers and generated 362 million social media impressions. Media
    interest in the story was sustained over many weeks, with interview requests coming
    in from twenty-three countries and from outlets across the political spectrum.
    In a bizarre juxtaposition, I spoke with Hari Sreenivasan of PBS on one day and
    on the next an interview with Steve Bannon in his War Room the morning before
    his notorious arrest.


    Written in the heat of the moment, the essay got some things right and some things
    wrong. The re-election of Donald Trump a distinct possibility, the plight of America
    at the time looked especially grim. Canada, by contrast, appeared that summer
    to be escaping the worst of the pandemic, which it most assuredly did not, though
    its performance was consistently better than that of its neighbor.'
