    Or you can pursue completely different avenues of adventure and discovery in science,
    the arts, social justice, engineering, medicine, the military, or the clergy.
    No generation has so many options or shown such promise.


    All these grand sentiments aside, you may be wondering how of this will help you
    get from where you are to where you want to be. You know you have options. What
    you don''t know is what you want, which path to follow, what career to pursue.
    You excelled in university only after four years with little sense of what your
