    # Encounter with the Other: From Mimetic Rivalry to Communion


    In previous section, I discussed how the major dynamics of the memory of founders
    and founding moment, as well as their memorialization at the sacred site of Sendangano,
    have been governed by the widening principle of communion and continuity. Thus
    the identity of the community is largely formed in the framework of fostering
    diverse forms of communion and interconnection, including with Dutch benefactors.
    However in this story is the question of otherness that manifests itself in different
    forms, but mainly through the categories of “other religion, particularly the
    Janarist religion and Islam.


    In the story of Sendangano, this complex question of alterity has two major dimensions.
    The first dimension lies in the fact that the Marian ghetto replaces a Janarist
    shrine. As noted earlier, the statue of Our Lady of Lourdes at Sendangano was
    intentionally placed at the site of the baptism of the Javaese in 1904. However,
    this site was used to be the abode of two ancestor-guardian spirits, Den Baguse
    Samijo and his mother, Dewi Llantamsari, and was visited by local population,
    both “pagan” and Muslim. In the distant past it had been used by Buddhist monks
    as a resting place on their way and to the Borobudur temple.³⁷ For this reason,


