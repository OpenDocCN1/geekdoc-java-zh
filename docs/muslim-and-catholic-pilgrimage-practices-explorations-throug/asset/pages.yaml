    Javanese sacred shrines as well (see Map 3).^{51}


    Different as they are in terms of their religio-cultural orientations and sensibilities,
    these two types of wandering pilgrims would often meet with each other. The santri-type
    would also visit some sacred places that are more Javanese than Islamic, for example
    the petilasans (Ar. maqām) of legendary Hindu-Javanese figures. Simple Javanese
    pilgrims with just basic knowledge of Islam would also learn a lot from those
    more textually learned (Jv. santri) friends in some shrines. This informal and
    spontaneous encounters of master-disciple relationship occur very frequently in
    shrines in Java. In general, these groups tend to have an inclusive view of sacredness
    with regard to the shrines of other. At least some of them would pay visits to
    the shrines of other religious traditions, as Javanese indigenous shrines, Hindu-Buddhist
    temples, Catholic Marian shrines, Chinese temples, and so forth.^{52} These visits
    would be short and stem from mere curiosity, due to their hunger for looking and
    being in the sacred precincts, which can also lead to a deeper relationship. These
    wandering pilgrims often hitherto unrecognized sacred sites and initiate a new
    tradition of pilgrimage to these sites.


    In this respect, it is remarkable to see how these wandering pilgrims come to
    recognize the sacredness of hitherto unknown sites. In case of the santri-type
    pilgrims, it is still true that despite their typically deeper knowledge of Java-Islamic
    history, they do not base their recognition on history understood as an objective
    account of past events. Rather, as I argued in Chapter 1 on the Javanese notion
    of history, they rely on the experience of being connected to spiritual presence,
    something that they feel in the recess of their heart (Jv. rasa).


