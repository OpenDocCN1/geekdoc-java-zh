  md: '# Notes on Spelling, Transliteration, and Sources


    In dealing with the variations in Javanese, Indonesian, and Dutch spelling, I
    decide to maintain the original spelling in the respective sources for words in
    quotations. For Javanese toponyms and words not in quotations, I use the Indonesian
    system especially with regard to the letter “o” (spelling it as “a”), except for
    certain names that have been widely known in Javanese system as Sendangano (rather
    than Sandals). Also, with regard to Javanese proper names, I opt for the one that
    has been more widely used in this scholarship, such as Tembayat (not Bayat), Kalijaga
    (not Kalijogo), Walisongo (not Walanga), Yogyakarta (not Jogakarta), and Soegijaprana
    (not Sugiyaprana). For Javanese words in general, I employ the simplest transliteration
    system, doing away with diacritical marks (such as è and é), except for very few
    cases of proper names.


    In cases when Javanese words derived from Arabic are used, I provide the Arabic
    root to make the semantic field clearer for readers with knowledge of Arabic.
    The same principle applies to Javanese words derived from Sanskrit, mostly in
    the context of Javanese Hinduism and Buddhism.


    For Indonesian words not in quotations, I use the most recent spelling rule, that
    is, the EYD system (Ejaan Yang Disempurnakan). For the transliteration of Arabic
    words, I employ the spelling of the original text that in some cases can be different
    from the present Dutch spelling system.


    The names of persons interviewed in this study are pseudonyms, except for the
    names of well-known figures. However, all names of places, including the places
    from which these persons come, are real and true. All translations from Javanese,
    Indonesian, Dutch, and French sources are mine, unless otherwise noted.'
