    So this chapter is endeavor to delve deeper into the dynamics of pilgrimage tradition
    in the three Catholic shrines used by pilgrims in the context of Javanese religious
    and or cultural sensitivities. My analysis here will focus on five salient categories
    of the pilgrimage experience that also define the five main sections of the chapter.
    These categories include: (1) devotion as connectedness; (2) peacefulness as fundamental
    blessing; (3) the tangibility of sacramental blessings; (4) communion with self
    and others, and (5) the question of the pilgrims of other religious traditions.


    In the first section my analysis begins with the category of devotion, understood
    not as a merely sentimental religious habit but as personal connectedness and
    communion with the Divine in all his manifestations. I will draw devotion as the
    foundational framework of pilgrimage that underlines the personal motivation,
    and wider inner processes, as well as the outcomes of pilgrimage. In this respect,
    I argue that pilgrimage is a habit of the heart that contributes to the formation
    of the pilgrims'' identity. This framework also helps us understand the ongoing
    creation of wider milieu through the development of new shrines in the old ones.
    In the second section, I continue with the discussion of the desired “outcome”
    (blessings) of pilgrimage, centered on the experience of peacefulness as the most
    common, fundamental, inclusive, and transforming form of pilgrimage blessing.
    I will explore the relig-cultural specifics of the ways in which Javanese pilgrims
    come to experience peacefulness at the shrine and beyond. The third section deals
    with another aspect of the blessings of pilgrimage, that is, its tangibility.
    In this section I will examine the sacramental character of pilgrimage blessings.
    Often viewed as a distinctive category of Catholic theology, sacramentality or
    sacramental vision basically points to the presence of God in concrete realities.
    It draws our attention to the visibility, tangibility, and mediatedness of the
    invisible grace, God’s self-communication. In pilgrimage, sacramentality is intimately
    connected to the idea of memory through things associated with the pilgrimage
    journey and shrines, such as holy water, architecture, statuary, souvenirs, and
    so forth. While this section deals more with the spirituality of “things” connected
    to pilgrimage and sacred space, four of this chapter deals with the communal aspect
    of this experience of grace, a dynamic that course involves an engagement with
    self as well. For pilgrimage often serves as a privileged moment for the unveiling
    of one’s spiritual self that becomes a foundation for a stronger communal sense
    among pilgrims. Then, in the last section, I will take up a rather crucial aspect
    of this community, that is, the experience of pilgrims from other religious traditions,
    mostly Muslims. I will examine briefly how the pilgrimage helps the Javanese Catholic
    pilgrims deal with the question of alterity, more specifically the presence of
    pilgrims of other traditions as well as the darker episode in the history of the
    relationship between the original Catholic mission and the surrounding Muslim
    community.'
