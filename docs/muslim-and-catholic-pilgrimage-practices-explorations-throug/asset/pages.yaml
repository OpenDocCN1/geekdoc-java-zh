    Muhammad wearing a crown in Hindu-Buddhist style reminiscent of the Majapahit
    count: it has the figures of mythical eagles (Jv. garuda) facing forward and backward,
    with teeth of precious jewels, gems for eyes and tongues of water jewels.52


    King Brawijaya V and the Idea of Hindu and Islamic Continuity


    In the previous section, my analysis was focused on the establishment of Kalijaga’s
    image as the originator and embodiment of Javano-Islamic identity, especially
    in south central Java. This Javanese identity is, in turn, anchored in the notion
    of spiritual and cultural continuity. The Hindu-Javanese kingdom of Majapahit
    was subsequently constructed and imagined as the epitome of Javanese culture,
    it was crucial that Mataram—and the whole idea of Javanese identity that this
    was supposed to carry forward—be related intimately to Majapahit. In this regard,
    somebody other than Kalijaga is needed. For, while Muslim Javanese saint excel,
    his genealogical location—by virtue of being a king himself, or genealogically
    linked to a king—could not put him in the unquestionable line of royal continuity
    and supernatural power between Majapahit and Mataram.


    In the Javanese tradition, this principle of continuity is secured through the
    figure of Brawijaya V, since he was undoubtedly the progenitor of subsequent monarchs.
    I will show later in this chapter that all the Islamic shrines under consideration,
    as well as many others in south central Java, are connected to Brawijaya V in
    genealogical terms, a principle that ensures the continuity of supernatural beliefs
    and power through his genealogy and descendants.53


    However, the relationship between Brawijaya V and later Javano-Islamic identity
    goes beyond mere genealogy. In the Javanese cultural memory, he is also imagined
    and remembered as an anointed saint whose power and saintly achievement becomes
    much more significant precisely because it explains the nature of the highly critical
    moment of the transition from the Hindu-Javanese period to the new Javano-Islamic
    one. What is considered particularly important in this memory is not his accomplishment
    as a Javanese monarch, but rather the nature of the end of his life. A Javanese
    epic of history and prophecy, the Babad Java Tingkir mentioned a few times earlier,
    describes the last moment of Brawijaya’s life in the Old Indic framework of moksha
    thus: “Vanished from


