  md: '# Muslim and Catholic Pilgrimage Practices


    In this phenomenon, one sees a very interesting dynamic of mimesis in pilgrimage
    culture. For the distant shrine is closer to home through the creation of its
    replica, mimesis and remembrance. Interestingly, this dynamic does not strip pilgrimage
    of its basic characteristic as a journey. For the journey is now more inwardly
    conceived, a process of becoming nearer to God and self, almost on a daily basis,
    rather than a physical travel. The sense of personal commitment to Mary, in the
    case of Marian grotto, is also strengthened. The devotees feel more personally
    attached to the shrine without losing their habitual desire to visit away sites
    from time (including the mother shrine) as well.


    This phenomenon of proximity between shrine and home is striking. In a sense,
    the shrine becomes home by proximity or the home becomes a shrine by extension.
    Brought from a distant place, the shrine is now part of the devotee’s intimate
    home. To a certain degree, this dynamic blurs the boundaries between private and
    public space. This is a sacred space of the family. But this privatization does
    not last long, for the “private” shrine can typically develop into public and
    ecclesiastical site through the blessing of the bishop as its fame spreads around.
    Thus, in this sense, the shrine transforms the private space of home into a public
    or communal space of devotion.


    # Peacefulness as Foundational Blessing of Pilgrimage


    In the experience of pilgrims, the quality and depth of devotion is closely related
    to the experience of being in touch with an overwhelming peacefulness during pilgrimage.
    To a large degree, this experience of peacefulness constitutes the most foundational
    blessing of pilgrimage since it gives pilgrims the most solid foundation for appreciating
    more specific blessings. Connecting pilgrims to a deeper sense of purpose and
    meaning, it has the power to help them reintegrate their lives on a more solid
    foundation and assists them in their dealing with smaller questions or problems.


    Seeking peacefulness at the shrine is the most common direct motives for making
    a pilgrimage. Course many of these pilgrims have many troubles and crises in life
    that contribute to their motivation for the pilgrimage. Even if their pilgrimage
    does not result in a “magical” solution to these problems, pilgrims normally experience
    a profound peace at the shrine that enduring effects beyond that particular moment.
    This peacefulness is clearly the result of a profound experience of being in more
    intense communion with God. At the same time, the make-up of this peacefulness
    may also involve the right constellation of elements that participate in this
    moment of communion.


