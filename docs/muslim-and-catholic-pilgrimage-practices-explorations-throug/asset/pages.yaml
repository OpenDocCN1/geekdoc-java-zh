    past that includes forms of oneness makes this religio-cultural identity formation
    richer and complex at the same time. That is why it raises the issue of continuous
    discernment on the part of the pilgrims and their communities with regard to creating
    ways of interpreting the extremely rich complex (not to say, ambiguous) aspects
