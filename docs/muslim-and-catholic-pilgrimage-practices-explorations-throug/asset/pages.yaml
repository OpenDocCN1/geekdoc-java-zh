    For pilgrims, the ascetic aspect of the pilgrimage might be understood more as
    a necessary means for a specific goal, such as to obtain a special divine favor
    or supernatural power. However, there is another longstanding group of Javanese-Muslim
    pilgrims who cultivate this ascetic pilgrimage as a long period of spiritual education.
    Indeed, shrines in Java continue to be a privileged space where deep and sustained
    spiritual experience and formation can naturally and spontaneously happen more
    frequently. I have previously mentioned the distinction between pilgrims of devotion
    and soul-searching/ascetic pilgrims. It is the latter who consciously cultivate
    this practice of pilgrimage as an extended period of soul-searching and spiritual
    education, practicing rather intense asceticism and spiritual exercises. Their
    numbers might be smaller compared to the more numerous pilgrims of devotion. But
    it is obvious that these pilgrims and their mode of doing pilgrimage form a very
    significant part of the pilgrimage in Java. Furthermore, based on the mode and
    duration of their pilgrimage, one can differentiate between “soul-searching pilgrims”
    and “ascetic-wandering pilgrims.” The former are pilgrims who spend a longer period
    of time (days or weeks) at a certain shrine for an intensified period of spiritual
    practice. They tend to have more specific goals, typically in response to a personal
    situation, and not normally move from one shrine to the next in a long journey
    away from home. The ascetic-wandering pilgrims, on the other hand, travel a great
    distance over a much longer period of time (months or years), staying in shrines
    and doing a series of ascetic and spiritual practices along the way, as part of
    a more comprehensive spiritual pursuit.


    Furthermore, among these two categories of pilgrims, one also finds two different
    styles of religious-cultural orientation along the continuum of the Javanese-Islamic
    mystical synthesis, namely the santri-type who follows more normative Islam and
    the Javanese type who combines normative Islamic practices with Javanese traditions
    (or versa). In what follows I will provide a brief survey of the world of their
    experiences. Since in many ways they overlap in terms of spiritual practices and
    experience, I will emphasize the heightened sense of spiritual experience in both,
    but will also pay attention to the significant differences.


