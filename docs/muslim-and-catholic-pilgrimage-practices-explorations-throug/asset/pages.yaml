  md: '# Masjid Demak (Demark Mosque): the oldest congregational mosque on Java; founded
    by the walis (sixteenth century).


    Muhammadiyah: the largest reformist Muslim organization in Indonesia; founded
    in 1912 in Yogyakarta by Achmad Dahlan.


    Nahdlatul Ulama (the NU): the biggest traditionalist Muslim organization in Indonesia,
    founded in 1926. The NU has a large network of *pesantren*, and it is associated
    traditionally with the practice of traditional Islam as mysticism, saint veneration,
    pilgrimage culture, and so forth.


    Nyekar (Jv.); pious and respectful visit to the tombs of ancestors that includes
    putting the flowers on the graves.


    Sunan Pandarang (sixteenth century): a prominent Javanese Muslim saint in central
    Java; one of the prominent students of Sunan Kalijaga; buried in the Tombayat
    area.


    Henri Maclaine Pont (1884–1971): Dutch Catholic architect, pioneer of indigenous
    architecture in the East Indies; also involved in the archeological excavations
    of Java’s Hindu-Buddhist sites.


    Panembahan Senapati (r. 1582–1601): founder of the Mataram dynasty.


    Pesantren: being one of the central pillars of Islamic Java (especially among
    traditionalist Muslims in the Nahdlatul Ulama organization), the pesantren are
    Islamic schools that also become, in many cases, centers of mystical learning
    and practice, associated with local and international orders (*Tariqah*).


    Prajnaparamita: a goddess associated with wisdom in Buddhism; taken up as an Image
    of Mary at the Sacred heart shrine and parish in Garanjun.


    Johannes Prenenthaler (1885–1946): Austrian-born Jesuit missionary who worked
    in the Sendangsono for many years (1921–36; 1942–48), whose initiative and leadership
    the Marian grotto of Sendangsono came into being in 1929.


    Rasa (S.): the inner or spiritual realm in the human constitution, as well as
    the means to touch with this; the deepest spiritual experience or knowledge could
    not be acquired or explained through discursive reasoning or concepts; also related
    to the Islamic concept of *sirr*, the most subtle and hidden recess in the heart
    where God and the soul are intimately in contact.


    Father Sananjaya (d. 1948): a Javanese priest slain by an Indonesian militia group
    in the mission town of Muntilan during a conflict between the Dutch and Indonesian
    forces in the period following the independence of Indonesia in 1948; popularly
    considered as a “martyr” of the faith by Javanese Catholics in central Java.


    Raden Santri (Pangeran Singasari): a Javanese Muslim saint of the Mataram dynasty
    (seventeenth century): the brother of Panembahan Senapati), buried in the shrine
    of Gunungpiring, Muntilan.


    Barnabas Sarikrama (1874–1940): a Javanese Catholic catechist, the right hand
    man of Father van Lith in the formation of the newly baptized Catholics in the
    Sendangsono area, south central Java.'
  merge: -1
