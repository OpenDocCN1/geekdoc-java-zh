    level, this search for peacefulness makes the “self” overwhelmingly evident. I
    have argued that this feature is intimately related to the general notion of devotion
    in pilgrimage as deeper and dynamic connected to God and His spiritual journey
    of saints. This devotion is highly personal and it develops over time. It is also
    intergenerational in the way it gets passed from generation to generation. That
    is why I argue that devotion and the search for true peace and wellbeing should
    be taken as a more fundamental factor in the pilgrimage understood in its experiential
    and contextual complexities, rather than short-term quests for some worldly boon.


