  md: '# Identity as Memory


    Thus, in the framework of the traditional Christian hermeneutic of martyrdom,
    Sanjaya''s violent death did not represent a loss but rather a new addition to
    the quite rich tapestry of the community''s founders and paradigmatic figures.
    To the local community, this adds the Catholic notion of communio sanctorum (communion
    of God and the Holy, including the saints) much more real.


    In this framework of the communio sanctorum, the principle of communion is at
    work, by which the community tries to keep alive the memory of their paradigmatic
    figures through pilgrimage to those and other means of reappropriating the legacies
    of these figures. Communio sanctorum is a complex and rich framework for fecundating
    the life of faith of the community by making connections to different interrelated
    sets of sacred realities, among others, the grace of God through these paradigmatic
    figures and events.97 It is in this that the Mausoleum of Muntilan plays a crucial
    role for the Javanese-Catholic community. As mentioned, it houses many tombs of
    these paradigmatic figures, especially Father Van Lith. Before the addition of
    Father Sanjaya, the tomb of Father Lith had become an important site of pilgrimage.
    Only three years after Van Lith''s demise, one of his former students wrote a
    highly personal account of the intercessory role of this mission.98 The process
    of designing a hybrid Javanese-Catholic style celebration also involved the participation
    of non-Christian and even non-Javanese young people.99 On the occasion of the
    centennial celebration of Van Lith''s birth in 1963, thus people gathered around
    his guise.100


    In recent years the memorialization of the legacy of the founders in Muntilan
    on an ecclesiastical level for gravestone for van Lith (I. Museum Misi Muntilan),
    whose vision is precisely returning to the foundational sources (resourcing),
    in the sense of retrieving the spirit of the founders, communing with them in
    various possible ways. Highly crucial among the initiatives of the Muntilan Museum
    of Museum is its attempt to embrace oneness, including the Muslim people and their
    tradition, for instance by incorporating the Islamic musical performance (J. terbangan
