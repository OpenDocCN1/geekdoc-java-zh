    # Spatial, Artistic, and Architectural Traces of the Other


    As examined in Chapter 1, it is in the framework of negotiating a complex Javano-Islamic
    identity that the practice of pilgrimage in central Java in the present finds
    its framework of meaning. In this framework, traces of the past are not carefully
    kept alive, through pilgrimage tradition to sites, when they are available, but
    they are also sought after, or “invented,” when they are not readily available.


    In this regard, the Javanese penchant for finding “traces” of the sacred past
    as well as forms of oneness contained in it, is illustrated well in the role of
    the *petasan* (derived from Jv. tilax, trace). These are particular places normally
    associated with the particular deal of important historical or mythical figures
    in certain location, perhaps corresponding to the more general notion of *maqām*,
    understood as a place where paradigmatic figures have stayed or passed, in the
    Islamic tradition. The shrine of Mawlana Maghibri (Map 3) is a good example of
    a *petasan* that has become a major pilgrimage site. However, for the most part,
    *petans* in Java are very simple, seemingly having nothing to offer to sight-hungry
    pilgrims, even evoking more absence than presence. As Chambert-Loir shows, in
    some cases these *petasan* may materialize a sacred place; in others it may be
    the reason to reveal a mythical figure.³ By visiting these unassuming places,
    Javanese pilgrims (not only Muslims) seek to commune with a sense of sacred and
    potent presence, however did it appear to be. The Javanese have a special term
    to designate this kind of pilgrimage as a reenactment of history. It is called
    *walking in the footsteps” of paradigmatic figures). In this regard, the parallelism
    between this Javanese practice and Michel de Certeau’s understanding of historiography
    as “a treatment for absence” is striking.


