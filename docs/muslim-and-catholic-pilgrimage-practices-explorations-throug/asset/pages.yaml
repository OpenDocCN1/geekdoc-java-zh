    # The Trace of the Other in the Javano-Catholic Identity


    In the luminous clarity of Revelation and through prayer and work, the science
    of the Orient and the art of the Orient merge to form a new culture, rich in living
    forces, which will assure to the gifted Javanese people an honorable place among
    the peoples of the world.


    Josef Schmutzer (1882–1946)¹


    In the 1930s the Dutch missionary journal, St. Claverbond, often featured a curious
    image that depicted differences among Christianity, Islam, Hinduism, and Buddhism
    in terms of architectural symbolisms. This image had a Western style church (with
    the words “Lumen Gentium” and a shining cross placed on top of it) flanked by
    a Javanese style mosque (with the word “Mohammed” written on top) on the left
    and a Hindu-Buddhist temple (with the word “Boeddha” placed on top) on the right.¹
    This image normally be used as the main illustration and imaginative framework
    for articles written by Jesuit missionaries about other religions in Java.


    Against the background of this evocative image, one could pose the following question:
    what happens when Catholic edits, the material-symbolic manifestation of the “Lumen
    Gentium,” are built in the style of the Hindu-Buddhist temple or the Islamic mosque,
    as has occurred in south central Java since the earliest Catholic mission in the
    area? On a certain level, then not only does the neat deviation between the three
    seemed to lie at the heart of the St. Claverbond symbolism disappear, but the
    Church itself as “the light of nations” (L. lumen gentium) seems to be paradoxically
    invisible due to the unfamiliar appearance that it takes. Indeed, what appears
    to be dominant on the visual surface of things is the face and trace of the religious
    other. In the eyes of the other, though, the Church becomes rather familiar.


    Upon deeper examination, as I shall suggest below, a rather complex constellation
    of diverse intentions and elements was at in this process of realizing what I
    call “Javano-Catholic” identity in architectural forms. Genuine respect, humility,
    and a desire for closeness with the other existed together with a hidden agenda
    of moderate triumphalism, something that was not unusual in the


