  md: '# Muslim and Catholic Pilgrimage Practices


    While following the methodological assumptions of the new comparative theology
    proposed by Francis Clooney, James Fredericks, and others—such as the importance
    of doing comparison on a focused, limited aspect of religious traditions with
    a view to acquiring theological insights for the enrichment of the comparist''s
    understanding of his or her home tradition—this book is rather different in terms
    of its material, since it focuses on a religious practice rather than a religious
    text. Furthermore, this practice is located in a very particular socio-religious
    context in which certain dynamics of comparative engagement among religious communities
    have already happened. Here the concerns that I attempt to address quite obviously
    fall under the new directions that Clooney observes in younger comparists: “doctrinal
    theology remains important, but lived religion and cultural exchange is more central
    to their work than mine.",58


    To a certain degree, this book is also an attempt to join the contemporary discourse
    on the question of identity formation is becoming more of a problem in the global
    world of today. One of the reasons why this comparative study takes the case of
    Java is that the Indonesian society at large has been struggling precisely to
    understand the relationship between forging a robust identity and taking into
    account the presence of the other.59 In regard, this book offers a theological-phenomenological
    analysis of pilgrimage as a privileged—in the sense of rich, authentic, integral,
    and long lasting—milieu of religious-cultural identity formation. In south Java,
    the creativity, authenticity and sustainability of the hybrid religious-cultural
    identities formed in the pilgrimage practices become especially significant today
    given the context of “struggle for the soul of Islam” in this area between centuries-old
    Javano-Islamic tradition and a smaller recent strand of militantly exclusivist
    Wahhabism.60


    # Organization of the Book


    This book is divided into three parts. The first two deal with the distinctive
    pilgrimage practices among Javanese Muslims (Part I) and Javanese Catholics (Part
    II) in south central Java. These two parts set forth the necessary data and contexts
    for the comparative analysis in Part III.


