    In what follows, my historical analysis of these dynamics at the Ganjuran shrine
    will be focused on three elements. Preceded by a brief account of the historical
    context of identity formation of the Javanese-Catholic community in the 1920s
    and 1930s, I will examine the community’s discourse against the other, namely,
    the argument that presented the Ganjuran shrine as a living proof of the Catholic
    appreciation of the Javanese culture, arguably one of the most crucial manifestations
    of the Catholic mission in colonial Java. Then, I will discuss the role of the
    founders of the shrine, the Schmutzer family, in the formation of the identity
    of the community in the socio-political realm, as well as the field of inculturation
    of the Catholic faith in Javanese culture.


    The immediate context of the birth of the Ganjuran shrine is the first or three
    tumultuous decades of the early decades of the twentieth century. As I have noted
    briefly at the beginning of this chapter, during this period the Javanese society
    and the whole Indies were experiencing deep fissures, not in terms of differing
    religions but also conflicting political and economic ideologies. Particularly
    crucial for my discussion here is the ideological enmity between the socialist/communist
    groups and their enemies (Islamic, Christian, and nationalist groups) that came
    to much more pronounced in the 1920s.


    It was in this context of sectarian political struggle that the Ganjuran factory,
    owned by a religiously and socially progressive Catholic family (the Schmutzers),
    was presented as an example of the goodness of Catholicism by the Javanese-Catholic
    intellectuals and community which was under severe attack due to its connection
    with the Dutch industrialists. In the socio-economic realm, the Javanese Catholic
    community was often accused of being the lapdog of Dutch capitalists.58 Thus,
    against the backdrop of rampant capitalist exploitation of the Javanese populace
    by the sugar factories in Java in the late nineteenth century and early decades
