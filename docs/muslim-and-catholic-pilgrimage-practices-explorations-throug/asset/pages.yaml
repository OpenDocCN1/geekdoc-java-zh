    is rather obvious. In my view, Kalijaga''s ascetic practices could also be thoroughly
    understood within traditional Sufi contexts of conversion.\25 In this regard,
    what is more important that this type of Sufi conversion presents Kalijaga as
    a truly Javanese wali, a religious virtuoso whose ascetic purification of self
