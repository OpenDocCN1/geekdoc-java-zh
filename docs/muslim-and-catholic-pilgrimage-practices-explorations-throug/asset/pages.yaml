  md: '# Identity as Memory


    group of Javanese by Father van Lith in 1904.$^19 Historically speaking, this
    baptism was not really the first among the Javanese, but it was considered to
    be singularly foundational because it saved the Java mission from utter failure
    during its most crucial juncture and thus marked the real beginning of the Javanese
    Catholic community in central Java.


    In words that have also become legendary in the history of the community, Father
    van Lith described the providential event as:


    The visit of the people from Kalibawang was for me an unexpected and inexplicable
    event. I visited lots of places, treading of missionary path, but to no avail.
    But look, in a region with I have never had anything to do, arose suddenly for
    our religion. This was a sign of providence that the Java mission would continue
    to exist. And in of itself, the conversion of this small group was of little meaning
    for the enormous mission work among the inhabitants of Java. It was very important,
    because now I can continue my already matured plans for the schools in Muntilan.$^{20}$


    Here, one sees how van Lith connects the Sendangsano event with the other foundational
    moment in the history of Javano-Catholic community in south Java, namely, the
    establishment of the mission school, the Xavier College, at Muntilan. As mentioned
    before, the alumni of this school would become the first intellectuals of the
    Javano-Catholic community and play a crucial role in their subsequent involvement
    in the larger Javanese and Indonesian society. In the mind of van Lith, the event
    of Sendangsano was intimately and architecturally related to Muntilan.


    Historically, the Sendangsano baptism was a miracle needed to confirm the validity
    of the particular missionary method of Father van Lith. What the 2004 centenary
    celebration primarily shows is the continued significance of this event in the
    present identity of the local Catholic community. As this community understands
    it, the event has provided a solid theological foundation for raison d’être. For
    the miracle of baptism was taken as a clear sign of divine confirmation and protection
    of the community’s existence and future. “spectacular” growth is a living testament
    to this foundational assurance.$^{21}$ In a proper theological framework, the
    event marked the moment of the descent of the gift of “faith,” the most defining
    aspect of the identity of the community.


