    communities. Naturally, such a treatment of the experience of the pilgrims involves
    a good amount of complexity, in the sense of richness and plurality of the experience.
    However, it is still possible to look for a certain degree of shared experience,
    illustrated by personal accounts of pilgrims I interviewed interviewed.


    Employing two rather broad categories that in their interconnections to each other
    helpfully put some structures to the vast and complex experiential world of the
    pilgrims. The first category has something to do with the complex motivation of
    the pilgrims, captured by the notions of devotion, needs, and blessings. The second
    comprises the various spiritual lessons and personal growth, in tandem with the
    rather intense practice of asceticism and purification. Roughly, these two categories
    correspond to the general types of pilgrimage: (1) pilgrims of devotion, and (2)
