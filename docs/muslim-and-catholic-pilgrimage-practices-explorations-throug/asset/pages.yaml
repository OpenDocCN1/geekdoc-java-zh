    # Pilgrimage as Devotion and Spiritual Quest for Peace and Wellbeing


    As illustrated in Chapters 3 and 6, the desire to achieve integral wellbeing and
    peacefulness is among the most motivational frameworks for both Muslim and Catholic
    pilgrims. I have shown the category of tentrem—the Javanese understanding of peacefulness
    in its most fundamental and comprehensive sense—is also understood as the true
    blessings of God by Javanese Muslim pilgrims (Chapter 3).

    This phenomenon is, in my view, highly revealing in terms of the Javanese spiritual
    sensibility, expressing a deepest longing for the full flourishing of life marked
    by depth, balance, and integration. It is in this larger framework of searching
    for the true meaning of life that Muslim pilgrims at the Tebantai shrine make
    the distinction between worldly and ambiguous boon (J. perolehan) and the true
    blessings of God (J. berkah). Crisis-ridden pilgrims, both Muslim and Catholic,
    for true peace might take a more arduous path. Many of them would stay for a longer
    period in the shrine, or do so repeatedly, through a rigorous intense of self-questioning
    and soul-searching in the larger context of their relationship to God that they
    are able to come to terms with the particular “problematic” aspects of their own
    lives. Among ascetic wandering pilgrims, this search for peace takes the form
    of an even longer and more arduous journey, moving from one shrine to the next
    during a more extended period of time (Chapter 3). In this highly personal context
    of pilgrimage, peace could not be achieved without purification of the heart.


    Among Javanese Catholic pilgrims, this framework of peacefulness is also remarkable,
    serving as the framework for understanding other specific blessings of pilgrimage.
    Even young pilgrims, the search for peace is quite striking. In this regard, it
    is also crucial to see how the Javanese spiritual method of attaining deep peace
    (the ning-nang-nung philosophy) is appropriated by Javanese


