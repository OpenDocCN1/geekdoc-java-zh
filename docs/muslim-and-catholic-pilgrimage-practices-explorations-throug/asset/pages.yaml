    On the Catholic side, this area houses the most fundamental and important Catholic
    shrines in Java. Furthermore, in this area Muslim and Catholic shrines share spatial
    and cultural proximity to another, forming a more intense and concentrated milieu
    of devotion. Even within the wider context of Java, this area has rare concentration
    of important shrines, not only Muslim and Catholic, but also Hindu, Buddhist,
