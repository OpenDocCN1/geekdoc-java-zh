  md: '# Glossary


    Adab al-ziyāra (Ar.): Islamic ritual etiquette to be followed during pious Islamic
    visitation

    to tombs.


    Sultan Agung (r. 1624–45): the greatest monarch of the Mataram dynasty, often

    portrayed as a Sufi-type of Muslim.


    Bahad: sacred historical account or chronicles produced in Javanese courts.


    Berkah (Jy; ar baraka): God’s blessings obtained through various means and in

    various forms.


    Bhima (Dewaruci): a central figure in the Mahabharata epic; in Java, his mystical

    journey becomes a symbol for Kalijaga''s initiation to sainthood.


    Brijawaya V (ca. late fifteenth–sixteenth century): the last monarch of the

    Javanadu-Hindo Majahit kingdom in East Java.


    Mbah Dalhar (d. 1959): a prominent descendant of a Mataram king, buried in

    the Gunungpring shrine; a descendant of Amkurat

    iii (1734), he was mainly associated with the Darussalam boarding

    school (pesantren) near Ngunggunit, Multilan.


    Garebeg (Sekaten): large public festivals held annually in the courts of Yogyakarta

    and Surakarta for the celebrations of major Islamic feasts; an important part

    of court culture, elements of garebegs are featured in the pilgrimage culture
    in

    various Muslim and Catholic shrines.


    Sunan Kalijaga (late fifteenth–sixteenth century): a Javanese Muslim saint, most

    popular in central Java where he is considered a personification of

    Javano-Islamic identity.


    Kraton: court of the sultans with all its power, prestige, and distinctive religio-

    tultural traditions. In central Java, the kraton culture is associated with

    t Javano-Muslim Sultanates of Yogyakarta and Surakarta.


    Laku: purifying practices of prayer, meditation, and asceticism, associated with

    t practice of pilgrimage (se tirakat).


    Franciscus van Lith (1863–1926): Dutch Jesuit missionary, founder of the

    Catholic mission in central Java.


    Majapahit (1294–1478): the last Hindu kingdom on Java


    Mataram: a Javanese-Muslim dynasty; founded in the late sixteenth century by

    Panembahan Senapati in central Java, it claims a lineage to Majapahit; this

    dasty is now represented mainly by the courts of Yogyakarta and Surakarta.'
