    # Communion with Saints as Ancestors


    As the preceding chapters (Parts I and II) have all made clear, keeping the memory
    of the community’s founders as ancestors has served as a larger context for the
    pilgrimage tradition in both Muslim and Catholic communities in south central
    Java. In fact it is one of the most salient and important similarities between
    the two. Along this line, what I have attempted to show is as well the shared
    nexus between culture and religion. As examined in Chapter 1, Javanese culture
    considers the sacred past as having a real authority and bearing over the present,
    and the ancestors belong to this category of sacred and authoritative past. In
    this framework, one can understand the importance of memory and history among
    the Javanese as fundamentally a category of presence and communion. History is
    by no means a matter of collective nostalgia of the past, but rather communal
    habit of keeping the memory of the sacred past alive, celebrating the presence
    and connection with this sacred past—which includes paradig figures, ancestors,
    and founders as founding events—in various festivals, rituals, communal graves,
    grave visitation, and so forth.


    A crucial element in this framework is the inclusivity of the category of ancestors.
    In general, the Javanese understand their ancestors not individually, but rather
    as an inclusive company of paradigmatic figures. In this framework, the idea of
