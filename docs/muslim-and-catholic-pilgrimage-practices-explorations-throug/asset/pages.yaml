    # The Spread of Devotion: Creation of Daughter Shrines


    In the context of pilgrimage culture among Catholics in south central Java, devotion
    as connectedness has a special characteristic of mimesis and memorialization that
    becomes evident in phenomenon of building a new grotto or shrine as a “daughter
    shrine” of the older one. As a tangible memorialization of love and devotion,
    expectation of miracles would not normally be part of its motivation. Often times,
    as I will illustrate below, miraculous events can serve as a catalyst for building
    new shrines.


    Among Javanese Catholics, this penchant for building new shrines has begun early
    in their identity formation, sparked off the foundation of the Sendangsono grotto
    in 1929. In 1935, for example, the Swara-Tamu wrote on the significance of erecting
    a Marian grotto:


    > The grotto would be a token of our love and devoted reverence to our Lady, our
    Mother and Queen, our Protector. It is through the building of the grotto that
    we may express our love and devotion to our Mother, as well


