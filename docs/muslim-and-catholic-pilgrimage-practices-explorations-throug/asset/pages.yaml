  md: 'can become more explicit and deeper when pilgrims visit the shrine of the other,
    or when pilgrims of one faith encounters pilgrims of other faiths in their own
    shrines.


    In this dynamic, then, the role of comparative theology is precisely to bring
    these common expressions, understanding, and experience into the realm of proper
    theological reflection. In this particular case, comparative theology is at its
    core an enterprise of retrieval and systematization that owes its life to more
    than one theological tradition. However, as I argue and contend it should have
    a constructive aspect as well, that is, in a very limited sense) identifying new
    theological meanings that the reality of these commonalities and multilevel encounters
    might point to. Working from a Catholic perspective, I can identify the comparative
    enrichment of the Catholic theology of communio sanctorum (“communion with God
    and the Holy”) as a theologically constructive framework that these commonalities
    point to.9. However, due to the limited space in this book, I will not fetch this
    out in a full-fledged comparative theological construction of the Catholic theology
    of communio sanctorum. This kind of work should naturally follow this present
    book.10 At this point, it suffices to say that this comparative theological construction
    should be based on the already existing dynamics of common understanding—cultural,
    spiritual and theological—and experience. Hopefully, this theological grounding,
    once it becomes more widespread, could help the communities understand each other
    on a spiritual and theological level, as well as socio-cultural level, thus creating
    a deeper mutual understanding that would prevent the sense of rivalry that could
    still happen in this type of communal interactions under certain circumstances
    as the case in the Holy Lands and others have tested.


    Lastly, and in connection once more that with the problem of rivalry and tensions,
    let me emphasize that Muslim and Catholic Catholic pilgrimage practices in south
    Java have served as a privileged milieu in which the pilgrims and their respective
    local communities continue to negotiate the religious-cultural identity in ways
    that are creative, authentic, and historically sustainable. This process is creative
    because it opens up new avenues for the growth of self-understanding, on both
    the individual and communal levels. It is authentic despite occasional ambiguities;
    pilgrimage typically helps strengthen their religious identity from within, in
    terms of the personal dimension of their lives and in the context of their religious
    traditions. For this process of identity formation in the context of pilgrimage
    occurs to such a degree that this often creative and hybrid identity becomes a
    historical embodiment of the wider framework of their religious tradition, in
    this case, Catholic Christianity or Islam. This identity formation is also historically


