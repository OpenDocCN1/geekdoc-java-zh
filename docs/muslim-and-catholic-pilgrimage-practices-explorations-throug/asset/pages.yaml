    \nHape Kerkeling¹\n\nI roam the lands east and west; to many a wanderer and hermit\
    \ was I a companion.\nI saw every strange and marvelous wonder, and experienced\
    \ terror in comfort\\and misery.\nI have come to be buried beneath the earth;\
    \ I hope that my Lord will be\nmy companion.\n\n‘Ali ibn Abī Bakr al-Harawī (d.\
    \ 1215)²\n\nPilgrimage is indeed a very ancient practice. And it continues to\
    \ be done in\ncountless ways in which the various facets of human life intersect\
    \ with one\nanother. Pilgrimage is also an extremely rich and complex practice\
    \ that involves a deep\nreligious and spiritual search for God and exists alongside\
    \ the more mundane\nneed for the therapeutic effects of travels and tourism, and\
    \ where a strictly pious\nactivity for obtaining God’s blessings intersects with\
    \ a complex framework of\ncultural or ethnic identity formation. A great many\
    \ Christian and Muslim saints\nmystics have been among its most ardent participants\
    \ and\npromoters, such as Ignatius Loyola and Ibn al-‘Arabi. For al-Harawī (d.\
    \ 1215),\nan Muslim pilgrim whose words I quoted above, pilgrimage was an\nextremely\
