    The tirakat or laku is deeply embedded in the Javanese culture, practiced by paradigmatic
    figures in the past such as kings, paradigmatic ancestors and saints, to gain
    spiritual or supernatural power that often translated to political power as well.
    In general, the traditional Javanese believe that true spiritual power only comes
    through self-restraint in all things, not only food, drink, or sleep, but also
    various forms of self-interest (Jv pamrih). Thus, in respect, the practice of
    tirakat (or tapa-brata) is essential for the spiritual formation of all. In the
