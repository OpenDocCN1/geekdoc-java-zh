    petwatersari), they would take this holy water in a bottle and place it on the
    terrace of the shrine. They then light the candles in the candle boxes on the
    edges of the terrace. Many may spend some time of silent prayers in the courtyard
    of the shrine before ascending to the terrace (Figure 4.2). During busy hours,
    they have to form a line by sitting reverently to go to the inner sanctum where
    a Hindu-Javanese image of the Sacred Heart of Jesus is enthroned. There in the
    inner sanctum, either kneeling or sitting cross-legged, they would pray earnest.


    When I asked a group of university students who seemed to why they wanted to go
    to the inner sanctum, they unanimously replied: “We do not feel spiritually satisfied
