    As previously mentioned, the founder of the grotto and its community is Fr Johannes
    Prehnterer (1885–1946), arguably the most outstanding Jesuit missionary in the
    area in the post Van Lith era. Born to a simple family of farmers in Tyrol, Austria,
    he entered the Order of the French Province in 1904 and was initially destined
    to work as a missionary among Muslims in Syria or the Near East. He knew Arabic
    and worked in Beirut for three years (1914–18), but could no longer stay in the
    Middle East in the wake of World War I. His affair with the Java mission began
    with an article on this mission that he read in Vienna. Captivated by the story
    of this mission, he asked the Jesuit general superior for transfer to the Dutch
    Province. Arriving in Java in 1920, he eventually worked for many years in the
    parish of Bara, near Sendalong, while also teaching Arabic to young Jesuit seminarians
    in Yogyakarta. However, Prehnterer did not seem to show a keen interest in things
    Islamic during his sojourn in Java, despite mastery of Arabic language and three
    years of experience in the Middle East.²⁸


    Together with Barnabas Sikrama, Father Prehnterer was not only instrumental in
    building the Sendalong shrine in 1929, but he put a very personal stamp on it.
    He unashedly pleaded with his Dutch benefactors to give funds and sundry items
    in his missionary work. His concerns over his destitute flock struck by the economic
    hardship of the great depression in 1930s include: securing their prayers, staple
    food, water supply and medicines, helping out with their debt, fighting against
    the colonial regulation on opium use, and overseeing their spiritual wellbeing.
    Unlike van Lith, he was certainly no deep thinker or progressive missionary-theologian,
    but his work was remarkable until his total immersion in the reality of his people.²⁹


    Father Prehnterer was remembered fondly by the local Javanese Catholic community
    as their saintly father. The memory of his persona was made very clear in 2002
    as the parish had celebrated their seventy-fifth anniversary.³⁰ The community
    remembered him as a hardworking missionary, a man of prayer, totally dedicated
    to the divine cause, and completely abandoning his own worldly interest for the
