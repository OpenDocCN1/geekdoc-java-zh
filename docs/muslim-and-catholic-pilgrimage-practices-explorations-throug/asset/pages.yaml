    pilgrims desire to visit shrines for this therapy of place, combining religious
    and recreation purposes.^24


    Many pilgrims seek this experience of peacefulness in terms of being at home at
    the shrine. The shrine becomes a “home” because it is the place where one is at
    peace with it with a deeper sense of identity. It is at this moment the pilgrims
    regain self-confidence and self-identification, coming to a deeper sense of their
    identity in relation to God. This peacefulness (J. ventrem) stems from the personal
    realization of being connected to the larger framework of life. This connection
    is especially crucial to pilgrims whose lives have been plagued by disorientations
    and confusions. And peacefulness is probably more obviously appearing to many
    urban pilgrims who live in cramped housing with a hectic life-style and demanding
    performance.^25


