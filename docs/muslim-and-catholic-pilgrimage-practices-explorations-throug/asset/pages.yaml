  md: '# Muslim Self and Hindu-Javanese Other


    Although the hybrid ziyāra rituals are so prevalent in the Tembayat shrine, there
    is no fixed ritual for pilgrims in this shrine. In fact, one finds other types
    of pilgrims who do not follow the hybrid Javano-Islamic ritual etiquette, and
    instead would stick to the more standardized Islamic ritual of tomb visitation
    (Ar. adab al-ziāra), that is, with minimal influence from local culture. When
    they come in, the leader would lead the standardized prayers for shrine visitation
    (mostly in Arabic) that are used in other shrines throughout Java. The basic structures
    of this could be found in the popular pilgrimage guidebook. In terms of prayers,
    it typically consists of: the *tahlīl* prayer (the recitation of the formula “no
    god but God”) and other short prayer formulas like the *tasbīḥ* (for the glory
    of God), the recitation of Qur‘anic chapters, typically the 36th chapter, the
    *Sūra Yā Sīn*, or the 12th chapter, the *Sūra al-Ikhlās*, or the last Verse (*Ayat
    al-kursī*) from the second chapter of the Qur‘an; the prayer (prayer for blessings
    on the Prophet Muhammad); the *tawassul* (the intercessory invocations of prophets,
    saints and other righteous persons). These kinds of pilgrims would also perform
    other prayers together inside the inner chamber of the mausoleum. Some of them
    would also start the visit by praying the *salāt* in the old mosque in the shrine.
    The plurality of pilgrims at the shrine, the case of Chinese pilgrims is very
    interesting. Since Sunan Pandarang was a prince-regent of Semarang, many Chinese
    from this city would pay a visit to Tembayat for homage and blessings. They consider
    him their ancestor whose intercession is particularly potent due to his former
    position. Of course, the great majority of them are not Muslims, so they would
    follow their own way of doing the rituals, mostly in the form of a Buddhist or
    Confucian ritual that is common among the Chinese in Java.

    In the context of my argument in this book, it is important to see that this standardized
    Islamic ritual etiquette of tomb visitation is in fact a combination of prayers
    and intercessions (*tawassul*) to God and His spiritual company, particularly
    the prophets and saints, and prayers for the dead. In this framework, the invocations
    of the prophets and saints are always done in the framework of prayer to God.
    The underlying logic of work is that of a prayerful remembrance of the prophets
    and saints in the form of offering prayers and blessings to them. In this respect,
    visiting to the dead is conceived as no different from visiting living persons.
    The pilgrims greet the dead, both the pious and the ordinary, in direct speech
    because the dead are present or aware of their visits. It is for the same reason
    that pilgrims have to bring a gift (of prayers) as a sign of love, respect, and
