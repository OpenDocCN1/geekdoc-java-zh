    Thus the Babads keep the memory of a community, not primarily by being read well
    but by being “participated in” through rituals, pilgrimage, festivals, and so
    forth. It is in this framework of history as memory of and communion with the
    sacred past that I discuss the “historicity” of the shrines under study.


    # Sainthood, Kingship, and the Formation of Javano-Islamic Identity


    Javanese historical identity in its south Javanese conception revolves around
    two earlier poles. The focus is Majapahit (1294–1478), the greatest and last Hindu-Javanese
    kingdom in East Java, where religio-cultural achievement came to be imagined as
    the most refined representation of the Javanese classical civilization. This modern
    recreating of Majapahit also formed the backbone of the politics of culture in
    the context of the construction of a Pan-Indonesian national identity under President
    Suharto of the New Order (1966–1968). In this cultural imagination of national
    identity, Majapahit signifies a founding moment of national unity long before
    the colonial era.¹¹⁹ The second locus of identity in central Java is the kingdom
    of Mataram, a polity considered the true Islamic successor to Majapahit that truly
    reconciling the Islamic and Javanese elements into a “mystic synthesis” of Islam.
    After the split of Mataram in 1755, the royal houses of Yogyakarta and Surakarta
    are the major representatives of this religio-cultural legacy of Mataram. Here,
    in talking about “mystic synthesis,” I follow obviously avoids the pejoratively
    inadequate term “syncretism.” As Rickles points out, this synthesis is anchored
    in the acceptance of Islam as primary identity in a way that also incorporates
    older Javanese spiritual forces. Of course, some tension and ambiguity are inherent
    in such a complex and ongoing synthesis. In general, the mystical Islam at the
    Javanese courts has accommodated and documented much of Java’s pre-Islamic high
    culture. In this framework, the classical texts of Java such as Dewa Rji, Arjunawijaya,
    Ramayana, and others are considered deeply Islamic, with the tutelary god of the
    Southern Sea is often depicted as behaving in the framework of Islam, such as
    the Javanese to recite the Qur ‘an and pray to God in the battle against the Western
    infidels.¹⁰


    Furthermore, in the framework of Javanese discourse of history in general as well
    as in the context of the Islamic shrines under consideration here, the complex
    historical dynamic of relationship between these two pillars or poles


