    community and the Sendasang grotto. He was a Javanese man named Barnabas Sarikrama
    (1874–1920). He was the first catechist in the area, the right hand of Father
    Van Lith in the formation of the newly baptized Catholics in Kalibawang. The second
    is the aforementioned Father Johannes Prennethaler (1885–1946), an Austrian born
    Jesuit missionary who worked in the area for over 15 years, under whose initiative
    and leadership the grotto came into being.


    Within only a few years after its foundation in 1929, this shrine quickly became
    the major pilgrimage site among Catholics in Java, both European and Javanese.
    During its early phase (ca. 1930s) pilgrimage to this site was also known for
    its asceticism, due to the arduous journey, which pilgrims had to undertake, on
    foot, through the rough terrain of the Menore hills that could be relatively nightmare
    during the rainy season. Furthermore, the shrine has also become a popular site
    for communal and ecclesiastical events at the local diocese. During these events,
    an important message was normally being noted, that is: “Don’t come to Sendasang
    to ask for miracle, but rather focus your attention on your relationship with
    Mary!” More however, the deeper and wider spiritual nature of the grotto is emphasized
    against the popular proclivity to enter a place of magic.


    The grotto has undeniably become a privileged milieu vested with a vast range
    of symbolism and deep meanings. This is why the centenary celebration of the foundational
    baptism centered on the shrine. The spirit of the whole celebration was intimately
    connected with the shrine, such as emphasizing the symbolic messages of holy water
    of the grotto, of pilgrimage to the site, the role of Mary as an Exemplar of Christian
    life, as well as the role of the shrine and its pilgrimage tradition in light
    of contemporary concerns for the preservation of local culture, environment, and
    interfaith dialogue. Thus, pilgrimage to Sendasang is clearly understood as an
    act of communicating with the sacred past, the founding moment of the whole community,
    not for the sake of communal nostalgia, but rather for a better understanding
    of its identity in the contemporary society. This way pilgrimage is practiced
    as the moment of the community’s returning to its spiritual source (resourcement).


