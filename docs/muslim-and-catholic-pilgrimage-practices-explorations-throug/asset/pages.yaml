  md: '# 192 Muslim and Catholic Pilgrimage Practices


    affect and theological understanding.³ In this respect, dance (quoted above) is
    particularly insightful. In a way, this is a highly particular example of my argument
    on the property of pilgrimage as a remarkably fruitful metaphor for comparative
    theology that I have made elsewhere.⁴


    In the context of the new comparative theology, this double reading and visiting
    is intentionally embraced as a milieu for a cross-fertilization by which a comparative
    theology deeply rooted in one becomes a theology indebted to one or other theories
    as well.³ As an experiment in comparative theology, this book is aimed at bringing
    together the Jano-Muslim (Part I) and Jano-Catholic (Part II) pilgrimage practices,
    understood as a particular mode of piety and devotion on the larger framework
    of the Catholic and Islamic traditions.


    So, in what follows I will pursue a properly comparative act, namely, identifying
    the similarities—and to a lesser degree,between the Muslim and Catholic traditions
    of pilgrimage as it is practised in south Java. These similarities constitute
    the major ways in which the Islamic and Catholic pilgrimage traditions in south
    Java coalesce, and illuminate each other. One can see that two pilgrimage traditions
    have been involved in an agile dance together. Through these similarities the
    various forms and structures of interplays between these two traditions are represented.
    My analysis will be focused on identifying the shared religious, cultural, and
    theological structures and logic of these pilgrimage traditions, including their
    role in the identity formation of the respective community, as well as the contents,
    such as the religious experience of the pilgrims.⁶


    To serve this purpose, this chapter is divided into five sections. I will begin
    by making some observation on the existence and role of a shared spiritual milieu
    and a culture of devotion in south Java (1), as well as the particular role of
    the Javanese culture as the common bond (2) in these dynamics of life and beings.
    I consider this reality of shared life as foundational because it serves the cultural
    and existential context and basis for the different forms of intersections between
    Muslim and Catholic pilgrimage practices. By the same dynamic, I will show how
    the two communities have come to embrace similar frameworks in appropriating the
    Janese culture into their religious sensibility and traditions. I will then discuss
    three major points of similarity between the two pilgrimage traditions, namely,
    the role of saints and paradigmatic figures as ancestors (3), and the deeply sacramental
    worldview that lies at the heart of these pilgrimage traditions (5).


