    and public servant, Josef also was interested in various aspects of Catholic theology,
    mission, arts, and so forth. His younger brother, Julius Schmutzer (1884–1954),
    was the one who ran the sugar plantation in Ganjuran also being involved in various
    ways with the Jesuit mission in central Java, especially in the realm of social
    and charity works.


    In particular, Josef Schmutzer is remembered for his visionary views on the question
    of colonialism and the rights of the natives. Drawing insights from Thomas Aquinas,
    he defended the natural inclination and the rights of the people to organize themselves
    in the pursuit of common good. He saw the identity of the people as something
    primordial and important—based on the natural love for attachment to homeland—than
    government and state. Thus, he argued, duties to the homeland should take precedence
    over duties to the (colonial) government and state. Government was only a means
    for the common good and it should be changed in accordance with the choice of
    the people, by force, if necessary. On the contrary, when a colonial government
    fulfilled its duties to the native people, it could be justified, but only until
    the people themselves became ready to have their own government (D. zelfbestuur).
    In the late 1920s, Josef Schmutzer expressed his belief that the necessary maturity
    had been reached to decide on their own needs through the exercise of modern self-governance.
    This also was the vision that the first first intellectuals came to embrace.


