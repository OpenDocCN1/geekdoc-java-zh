  md: '# Ashgate Studies in Pilgrimage


    Series Editors:


    Simon Coleman, University of Toronto, Canada

    Dee Dyas, University of York, UK

    John Eade, University of Roehampton, UK and University College London,

    Jas’ Elsner, University of Oxford and University of Chicago


    Once relatively neglected, pilgrimage has become an increasingly prominent topic
    of study over the last few decades. Its study is inevitably inter-disciplinary,
    and extends across a growing range of scholarly fields, including religion, anthropology,
    geography, history, literary studies, art history, archaeology, sociology, heritage
    and tourism studies. This process shows no sign of abiding – indeed, it looks
    set to continue to expand.


    This series seeks to place itself at the forefront of these conversations. Covering
    new work from both established and emerging scholars it encompasses themes as
    diverse as pilgrimage within national and post-national frames, pilgrimage-writing,
    materialities of pilgrimage, digi-pilgrimage and secular pilgrimage.


    Also in the series


    Pilgrimage, Politics and Place-Making in Eastern Europe


    Crossing the Borders

    Edited by John Eade and Mario Katić'
