    It is in this complex framework of relationship that most Javanese pilgrims would
    understand their more mundane intentions. For many pilgrims, their relationships
    with God and the saints develop around the dynamics of devotion and supplications.
    In this respect, the basic is not so much about the granting of their prayers,
    but rather the dynamics and effects of such a communication, basically an unveiling
    of self, in the continuum of one’s relationship and devotion to God and His saints.
    This is the larger context of spiritual growth that particular pilgrimage finds.
    In general this dynamic is true for all of pilgrims. In Java, quite a few pilgrims
    would be drawn, initially to visit shrines during their legendary power. However,
    once a relationship of devotion is established, fulfillment gradually ceases to
    be the sole aim of the pilgrimage. It is precisely because these other features
    of true devotion come to the surface, or because the pilgrims would understand
    the true meanings of the supplications and their fulfillments on a different level,
    perhaps in a more existential and integral framework of their complex lives, as
    I will illustrate.


    This process often includes a deeper realization of the necessary growth of the
    pilgrims’ understanding of life. In this framework, even in the case when mundane
    supplications seem to show devotion by going to the shrines over and again as
    part of the larger process of understanding the complexities of their lives in
    relation with God and His saints. In this dynamic, pilgrimage is personally revelatory
    insofar as it serves as the milieu through which the hitherto hidden aspects of
    the pilgrims’ lives are unveiled by the grace of God.


