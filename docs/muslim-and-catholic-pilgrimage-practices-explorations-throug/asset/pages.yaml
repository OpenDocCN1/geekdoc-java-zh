    What all of the four previous sections of this chapter have demonstrated, among
    others, is that pilgrimage among Catholics in south central Java makes a rich
    tapestry of personal and communal devotion. It is indeed alive and thriving, attracting
    more and more pilgrims from all walks of life. Thus one can understand why the
    practice of pilgrimage could well serve as an important milieu for the identity
    formation of the pilgrims and their communities. In follows I discuss how a particular
    question of alterity occurs in the pilgrimage practice at these shrines, such
    as Catholic pilgrims regard the religious “other” at the shrine and how the pilgrims
    of other traditions experience their own pilgrages at Catholic shrines.


    The first thing to note here is that for Javanese Catholics today, pilgrimage
    tends to be understood simply as their identity and practice as Catholics, not
    in comparison with or opposition to other Christians. It is extremely rare that
    Catholics in Java would be motivated by religious debate about the veneration
    of saints or Marian devotion with local Protestants or Muslims.⁴⁹ They would do
    it because it is the habit of devotion that has an essential part of what makes
    them truly Catholic. This is why there would be something missing and regretful
    when they failed to do that periodically, especially during the Marian months
    of May and October. This way, pilgrimage is intimately connected to religious
    identity, although not always in a conscious manner. Here, the logic is not so
    that they come to terms specifically with their Catholic identity during pilgrimage,
    but rather it is their Catholic identity—built through this habit of devotion
    from generation to generation and personal participation in that tradition—that
    leads them to the pilgrimage.


