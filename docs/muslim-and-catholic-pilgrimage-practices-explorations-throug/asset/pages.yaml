  md: '# Muslim and Catholic Pilgrimage Practices


    various ways to the two royal houses of Yogyakarta as the contemporary successors
    of Mataram. Especially during, and under the influence of the colonial era, these
    two courts have come to be identified as the pivots of “Javaneness” and its most
    refined religio-cultural achievement (Jv. adiluhung). This designation of Yogyakarta
    and Surakarta as the center of Javanese culture was historically conditioned by
    colonial discourse on what constituted “Javanese culture,” a discourse that involving
    others of Islam.¹10


    For Javanese pilgrims, this particular spatial and historical location and a web
    of connections that come with it are considered crucial for the religocultural
    identity and role of these shrines. In what follows, I will delineate major elements
    that contribute to the identity formation of these shrines in terms of their connectedness
    to the whole history of the realm or the community of south Javanese people. I
    will begin with the notion of history in Javanese thinking in general before moving
    more specifically to how this notion affects the identity and role of the shrines
    for the self-understanding of the pilgrims themselves.


    Among Javanese pilgrims, history is generally understood as a collective memory
    that defines their identity, rather than functional and objective events of the
    distant past. The past is always connected in terms of sacred events and paradigmatic
    fairly. And history is practiced as a longing for connection and communion with
    the sacred past that continues to have profound implications for the present as
    well as the future of the community. There is an obvious search for some sort
    of contemporaneity with the past, where the vividness of these events can be more
    refreshed. In this framework, the acts of writing and reading history constitute
    a sacred activity capable of eliciting supernatural blessing, precisely because
    history connects the readers and writers with the power of the Invisible.¹¹ By
    extension, pilgrimage to historical sites is an act of making connection to a
    sacred history through its traces. The connection between pilgrimage and history
    in Javanese worldview is also illustrated by the fact that both share the same
    semantic field when pilgrimage is called “surajah,” while history is called “sejarah.”
    Both words are derived from the same Arabic root of shajara that means “to happen”
    or “to break out,” signifying history as events. The derived noun of this verbal
    root is shajara, which means “tree,” signifying genealogical connections.¹¹²


