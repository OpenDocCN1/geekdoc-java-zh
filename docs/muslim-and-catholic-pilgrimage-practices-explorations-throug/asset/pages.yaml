  md: '# Concluding Remarks


    As this chapter has shown, the three shrines under study now have become historically
    significant due to their crucial role in the process of the negotiation of the
    Javano Catholic community’s identity. The Sendangsono grotto represented the beginning
    stages where the tension between the particularity and universality of “Catholic”
    identity was taken up for the first time in the form of a material-ic monument,
    a Marian shrine. This shrine was meant as a sign of the particularity of a Catholic
    identity as well as a sign of the universal mission of the Church among the people
    of Java. Naturally the focus of the community was largely invariant. In this ongoing
    dynamic, the Sacred Heart shrine at Ganjuran is a manifestation of the community’s
    decision to call upon the universalization of its mission. Framed in the language
    of Catholic piety and the integral practice of Christian charity as well as the
    inculturation of Christian faith, the shrine’s mission was from the start understood
    as deeply outward outlook, that is, to be a vehicle of God’s blessings for all,
    as the Javanese Catholic community tries to negotiate its proper place and role
    in the wider Javanese society and beyond. In this dynamic, the Mausoleum of Muntilan
    commemorates both the idea of foundation (with the grave of van Lith) and martyrdom
    of Father Sananjaya can be seen as the monument of the struggle of the community
    to maintain its creative fidelity to the mission.


    As this chapter also makes clear, the history of these three shrines is the story
    of how the Javano-Catholic community has made sense of the tensions and ambiguities
    that were involved in the foundation of the shrines, as well as the history of
    the community. In this regard, the community has employed a hermeneutic principle
    that is based on the spirit of communing with founders, founding moment, and the
    benefactors. I have attempted to illustrate how the spirit of communion and the
    surrounding community has become widened in today’s practice and vision of the
    shrines and Otherness is perceived differently now. While Father Preinthaler,
    the missionary, was taken aback by every move of the Muslim other, the Javano-Catholic
    community of today looks forward to having the presence and participation of their
    Muslim neighbors and others, not only in the shrines, but also in the larger dynamics
    of their community. In this very process, they come to the fuller scope of the
    inclusiveness of Divine grace, the grace of the Sacred Heart of Jesus that flows
    through Mary, the saints, and their own local pious ancestors such as Father van
    Lith and Father Sananjaya.'
