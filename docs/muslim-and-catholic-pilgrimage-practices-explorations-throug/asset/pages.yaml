    # The Expressions of Hybrid Religious Arts at Ganjuran


    As concrete illustrations of Schmutzer''s experiments in Christian indigenous
    arts, I examine two of the most iconic and theologically insightful examples from
    his collections, namely the image of the Sacred Heart or Christ the King (Figure
    5.1), and the image of Madonna with Child (Figure 5.2).


    The design of the Sacred Heart in Ganjuran is definitely a hybrid Javano-Christian
    work of art. Clothed in a Hindu-Javanese royal robe, Christ is seated on his throne;
    left hand holds the chest, opening it up while his right hand points to this image.
    The luminous image of the Sacred Heart is encircled by a crown of light. In Schmutzer''s
    conception, this luminous crown of love is a symbolism of how a meditation of
    the love of Christ should be elevated to the contemplation of the Uncreated Love,
    the Holy Spirit, through which the Father and the Son love each other as well
    as humanity. Without the image of the Sacred Heart in the breast, this statue
    might only eclipse the aura of a Hindu-Java king in all his glory and power. Obviously
    Schmutzer attempted to present a different image of kingship, one that is based
    solely on love. This design has been sculpted and the statues are now housed in
    the inner sanctum of the temple-shrine and the parish church (Figure 4.2).


    The second sample is the design of Madonna with Child (Figure 5.2). Employing
    the template of Prajnapararita (or Lakshmi), Mary is represented as a queen, clothed
    in classical royal robe with a shawl and long corsage, holding the Child on her
