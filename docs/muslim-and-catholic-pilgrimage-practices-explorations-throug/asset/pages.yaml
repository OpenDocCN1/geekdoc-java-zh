    There are principal ways in which the category of respecting and keeping memory
    of the saint-ancestors has continued to play a crucial role in the pilgrimage
    traditions among both Muslims and Catholics in central Java. On the Islamic side,
    it is to be mentioned that respectful devotion (Jy. bekti) to the dead ancestors
    is an important part of the traditional Muslim piety in Java—represented largely,
    but not exclusively, by the traditional Nahdlatul Ulama—through the tradition
    of the tahlil prayers and as the ritual communal meal (Jy. kenduri).¹⁵ This explains
    the prevalence of these rituals in Muslim shrines such as the grave of Tebayat
    when the buried saint, Sunan Pandanaran, is considered the founding ancestor (Jy.
    pundhen) of the local community (Chapter 3). Many Javanese Muslim pilgrims to
    this understand their pilgrimage as a respectful visit to their ancestor (Jy.
    nyekar, sowan). Such a visit combines the traditional Javanese etiquette of tomb
    visitation—such as a certain kind of flowers on the gravestone and holding a ritual
    meal—with the Islamic etiquette of visiting sacred tombs that includes specific
    prayers and vows related to the saint.


    In this regard, it is important to see the larger relationship between the tahlil
    prayers for the dead and the spirit of the ritual communal meal. Among traditionalist
    Muslims in Java, the tahlil prayer is considered as a special prayer for the dead
    and is basically consists of chanting of sūran of the Qur’an and some dhikr formulas,
    especially the formula “There is no god but God” (Ā. lā ilhā Allā). It typically
    begins with the opening chapter of the Qur’an (Ā. al-Fātiṭha) and closes with
    the declaration of the intention (Ā. du ā). It is crucial to note that this prayer
    is directed not only for certain dead members of the host family, but rather for
    all the (Muslim) dead and ancestors. In most cases, this tahlil is part of the
    communal meal (Jy. slametan) where food is shared after being blessed. In fact,
    this Islamic ritual-communal meal is also popularly calledahlilan, and the sharing
    of food is also considered a sharing of God’s blessings.¹⁶ Muslims consider the
    food to be shared as voluntary alms (Ā. sadaqa), as a means of fostering brotherhood
    and solidarity.¹⁷


