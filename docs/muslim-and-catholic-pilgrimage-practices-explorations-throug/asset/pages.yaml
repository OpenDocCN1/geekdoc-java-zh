    What these political entities and paradigmatic figures represent is actually a
    complex and long negotiation of what came to be a widespread cultural synthesis
    between Javanese and Islam, or the formation of the hybrid Javano-Islamic identity.
    In this regard, the figures of Brawijaya V and Sunan Kalijaga symbolically ensure
    the continuity and authenticity of Javano-Islamic identity, as opposed to any
    fissure or disruptive break between the old and the new. While Mataram rightfully
    claims to be able to trace its genealogical lineage to the Hindu Majapahit, its
    identity is secured by the crucial rule of Sunan Kalijaga as its spiritual protector.
    This is so because King Brawijaya could not have been imagined as having a direct
    involvement in the founding of Mataram qua Javano-Islamic polity. The Muslim identity
    of this last Hindu-Java monarch is a matter of contention in Javanese discourse,
    the nature of his conversion to Islam was not without ambiguities, I will discuss
    later. however, Brawijaya V was a remarkable figure in this chain of sacred power
    in Javanese successes of royal dynasties. Kalijaga is the personification of continuity
    due to his identity as a Javanese figure belonging to the circle of Majapahit
    court and a prominent Muslim saint at the same time. This twofold identity explains
    his ubiquity and role in sacred history is perhaps without parallel. The text
    Tanah Jawa records Kalijaga''s legendary role, while his memory is preserved in
    the Javanese sacred geography through countless sacred places (Jv. petilasan)
    associated with him throughout Java, Bali, and Lombok.


