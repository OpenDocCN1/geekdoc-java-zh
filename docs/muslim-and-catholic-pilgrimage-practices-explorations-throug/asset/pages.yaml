  md: '# Chapter 4

    Identity as Memory: Sacred Space and the Formation of Javano-Catholic Identity


    This grotto is not only a source for the great joy of Catholics, but also a very
    beautiful and suitable advertisement for those who are not Catholic yet; for the
    Virgin would be the missionary there.


    J.B. Prennthaler, S.J. (1928)¹


    This chapter explores the relationship between the history of the three Catholic
    shrines under study and the identity formation of the local Javanese Catholic
    community. From the outset, it has to be noted that the Javanese Catholic community
    in south central Java came into being through a very complex and rather dramatic
    process of formation which they engage different challenges. The setting of this
    formation was also crucial, namely, the first three or four decades of the twentieth-century
    Java. During this time Dutch colonialism was on the way out, but in the eyes of
    the Java, Christianity was from the very start associated with the menacing power
    of colonialism and the West. Consequently, the greatest challenge faced by the
    nascent Javanese Catholic community had to do with this double alterity: being
    a Christian meant following foreign religion brought to Java by a menacing colonial
    power with its anti-Islamic agenda.²


    # A Brief History of Javano-Catholic Community


    In its initial phase (1920s-30s), this challenge was faced with a sense of determination,
    even confrontation, as indicated in the Swara-Tama, the mouthpiece of the first
    generation of Javanese Catholic intellectuals and leaders.


    > ¹ Letter of Father Prennthaler, March 24, 1928 in Brieven van Pater J.B. Prennthaler
    aan Pater Directeur van de St. Claverbord 1922–1937 (hence Brieven), p. 65.

    ² Cf. Steenbrink, Catholics in Indonesia, vol. 2, p. 406. As illustration of the
    foreignness of Christianity, the new Catholic converts in the town of Ambarawa
    were accused of abandoning the faith of the Javanese, arguing vehemently that
    the Europeans were meant to be Christians, while Divine Providence had decreed
    that Javanese followed the Prophet Muhammad. See J.A.C. Schots, S.J., “Eerelingenen
    te Ambarawa!” St. Claverbord (1923): p. 292; Jos Gitsels, S.J., “N Eenzaamam Afsterveren,”
    St. Claverbord (1923): p. 271–4.'
