  md: 'The prevalence of the principle of continuity, rather than conflict, might
    also help explain the relative absence of demonization of the Egypt (Muslim) other
    in Sendangogo, compared to other contexts as medieval Egypt or present day Sri
    Lanka.44 In the history of the encounter between Christianity and Islam in Java,
    the demonization of the other has very rarely conceived in terms of the fight
    between God and the demons belonging to the false religion. Even if there are
    some Muslims who regard Christians as "infidels," these Christians are not imagined
    in terms of demons and vice versa. Although he called the cult of ancestral spirit
    "paganism," Fr. Prenthaler never considered the Muslims as inspired by demons.


    The second dimension of the way in which the religious other was reckoned with
    the Catholic sect at the foundation of this grotto stems from its "missionary"
    nature as its founder conceived of it. The grotto was expected to serve as a beacon
    of self-identity, endowed not with a dominant agenda marking the existence of
    a self against the backdrop of the other, but also of turning and converting this
    other to the self. In the vision of Fr. Prenthaler, the Sendasang grotto was not
    only conceived as a sign of a great joy and gratitude of the Javanese Catholics,
    but more importantly, as a proper advertisement (D. pasgende reclame) for the
    non-Catholic population, as the quote at the beginning of this chapter makes it
    clear. He declared with conviction: "Our Lady would be the missionary among these
    people."45 In the mind of Prenthaler, the missionary, this was of course meant
    in the plain sense that Mary would not only subdue local ancestral spirits but
    also convert the local Muslim and Javanist population. His hope was that this
    grotto, the Lourdes vvan Java, would eventually become a major pilgrimage site,
    the first in the land of the "heathens" (D. heidenen).46


    This was how Fr. Prenthaler conceived this shrine as a sign of the existence of
    a Catholic sect over the other. During his lifetime, the grotto did indeed attract
