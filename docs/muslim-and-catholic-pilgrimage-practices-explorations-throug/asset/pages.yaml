    Maclaine’s points were perfectly in line with the spirit of deeper and more comprehensive
    “unification” between the East and the West, between the natives and the colonialists,
    which was opposed by the Javanese Catholic community. However, this hybrid architecture
    movement as an appropriation of indigenous culture was of course still within
    the limits of colonialism. For one could argue that a crude colonial dominance
    in the realm of material culture was replaced by a kind of colonial ennoblement
    of the native culture.


    As the following section will show, the language of ennoblement was also used
    by Catholics in the Indies to talk about inculturation of the faith. However,
    from the dynamics of Catholic theology of inculturation, the emphasis would normally
    be placed on the truly “catholic” and incarnational dimension of the other. Here,
    ennoblement becomes spiritual revival. And this process also amounts to the complex
    dynamics of “Christianization” of indigenous culture and “indigenization”. In
    what follows I will delve a bit deeper into the logic, theological and otherwise,
    of this two-dimensional process of Christianization and indigenization by exploring
    the vision of Josef Schmutzer, the founder of the Ganjuran shrine.


