    by the idea of history is not a factual account of the past, but rather the sacred
    moment of finding itself and the memory of the founders and ancestors.¹⁴ In this
    respect, connection to the past becomes more crucial to the self-understanding
    of the community; for it is the moment of founding and the role of founders that
    laid out the historical accounts of the identity “babad,” a Javanese word means
    clearing the forest for new settlement, the beginning of a community. Thus, writing
    history that babad is an attempt to foster a connection with that founding moment
    and the paradigmatic founders of the community. So, in the Javanese culture where
    communication and communion with the dead and ancestors is essential for the identity
    and continuity of the community, history is practiced as memorialization, both
    at personal and communal levels.¹⁵


    That is why more important is the deeper connection and participation.¹⁶ The Babads,
    the written accounts of Javanese sacred history, as well as other writings, are
