  md: '# Introduction


    graces would be bestowed upon the highest saints: they will participate more fully
    in the walāya of God by partaking more intimately in God’s glory as light.


    All these features of Islamic sainthood have given rise to the highly complex
    and multifaceted person, socio-communal and cosmic roles of Muslim saints or walis.
    Muslim saints have an initiating or guiding function as well as cosmic role, while
    they may also become founders and pious ancestors of local communities. Again,
    the theological ground for all these roles is their special participation in God’s
    own walāya. Thus, the saints are not acting on their own.


    # Recent Studies of Pilgrimage and the Approach of this Book


    Due to its universality across religious traditions and cultures, as well as its
    contemporary rise in popularity, pilgrimage has been taken up as a subject of
    study in various academic disciplines, such as history, anthropology, sociology,
    cultural studies, religious studies, as well as theology. On the side of Christian
    and Islamic traditions, pilgrimage tends to focus on certain regions or historical
    periods.⁵⁵ In this respect, some studies have dealt with the question of religious
    identity and touched the inclusive nature of shared shrines or on the interaction
    between pilgrims of different faiths.⁵⁶ Of studies of this kind should serve as
    a reminder that the case of south Java is not unique in terms of the beneficial
    encounters between Muslims, Christians, and other peoples of different faiths
    traditions in the framework of pilgrimage practice. This book is a modest endeavor
    to the challenge of doing a full-fledged and comparative study of different pilgrimage
    practices that have been existing in the primacy of each other over a long historical
    continuum.


