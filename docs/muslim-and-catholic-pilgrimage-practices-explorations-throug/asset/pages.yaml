- img_proc: true
  md: 'Josef Schmutzer (1882–1946) and Julius Schmutzer (1884–1954): two prominent
    brothers of the Schmutzer family, the founders of the Sacred Shrine in Ganjuran,
    Yogyakarta. Josef was also a pioneer of Javano-Catholic arts; while Julius is
    remembered especially for his service in the Catholic mission''s social welfare
    program for the Javanese natives.


    Slamet (Jv., from Ar. salāma): Javanese holistic notion of well-being that is
    personal, communal and cosmic (see tentrem).


    Slametan (Jv.): the pan-Javanese ritual communal meal offered to God, the prophets,
    saints and ancestors, for thanksgiving (or for the wellbeing of the community).


    Tentrem (Jv.): profound, true and integral peace.


    Tiratak: vigil, or pilgrimage as an intentional and intensive period of purification
    involving a series of ascetic practices such as fasting, prolonged meditation
    and so forth at the shrines (see laku).


    Wali (Ar. walī, pl. awliyā’): friend of God or saints in Islam.


    Wayang (Jv.): popular shadow theatre performance in Java, taking up the stories
    from the Mahabharata and the Ramayana epics and combining them with Islamic themes.


    Wilāya/Walāya (Ar.): Islamic conception of “sainthood,” emphasizing spiritual
    proximity or intimate friendship with God that also results in the bestow of authority.


    Ziarah (Jv.; Ar. ziyāraara): pious visit to shrines or tombs.'
