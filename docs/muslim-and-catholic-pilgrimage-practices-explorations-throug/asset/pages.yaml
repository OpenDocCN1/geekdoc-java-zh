    \ an intimate understanding of the profound meanings of existence—as\n said, “I\
    \ saw every strange and marvelous wonder, and experienced terror in\ncomfort and\
    \ misery”—and put him in an intimate relationship with God. It is\remarkable that\
    \ al-Harawī’s pilgrimage itineraries included many Christian and\nJewish sites,\
    \ while he counted his companions a number of Christian\nmonks as well. And, while\
    \ understanding himself as a “non-religious” person,\nt German comedian Hape Kerkeling\
    \ himself conceived his life-changing\npilgrimage along the traditional Christian\
    \ route to Santiago de Compostela\nin terms of searching for God and self.\n\n\
