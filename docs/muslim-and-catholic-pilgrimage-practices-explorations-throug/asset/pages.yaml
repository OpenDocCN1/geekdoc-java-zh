  md: '# Muslim and Catholic Pilgrimage Practices


    However, he never entertainains any doubt regarding his Islamic identity. Speaking
    as an adept in knowledge of Javanese mysticism, he understands the ultimate goal
    of pilgrimage in seeking Kyai Slamet (''integral wellbeing'') and Nyai Tentrem
    (''true peace''), two concepts that serve the existential homeostasis and the
    sense of profound personal and cosmic harmony Javanese mysticism always strives
    to achieve.¹⁴⁸


    As I argued, these two individuals exemplify two kinds of itinerant pilgrims,
    as well as the possible forms of intersections between the two. The first category,
    the santri sect, consists of teachers and former students (J. santri) of Java''s
    network of Islamic religious boarding schools (J. pesantren), as well as other
    people who are connected in one way or another to this network and come to adopt
    its style of Islamic observance. They embark on the long journey of pilgrimage
    in the quest for growth in spirituality and knowledge (Ar. ''ilm) in the footsteps
    of their teachers. Many of religious teachers actually grow some of their students
    to lead a life of itinerant pilgrims during a specific period of time each year.
    In some cases, this practice of ascetic pilgrimage occurs in the larger context
    of seeking Islamic knowledge from the right masters, something that requires these
    students to move frequently from one religious school to the next⁹ Many of these
    students continue this practice of wandering long after their formal graduation.


    The second type is what I have called Javanist-Muslim wandering pilgrims.¹⁰ Exploring
    their particular identity as Javanese Muslims, they cultivate some Javanese religious-cultural
    practices alongside the Islamic instance. Of course, the degree of their regularity
    in practicing the normative Islamic shari'' such as the canonical prayers (Ar.
    salat) and Ramadan fasting verses vary greatly from person to person. They are
    more naturally inclined toward the mystical side of Islam. Most of them are not
    associated with the Javanist mystical brotherhoods


    > ⁴⁸ Kyai and Nyai are titles of high respect for male and female respectively.
    Normally designated for persons of high religious and social status, these terms
    would also be used for things believed to possess supernatural power, such as
    sacred heirlooms. Then by designating wellbeing as Kyai Slamet and true peace
    as Nyai Tentrem, Mr. Kasio holds them as sanctified pilgrims of true peace as
    the Javanese understand it.


    > ⁴⁹ This practice is deeply rooted in the Javanese tradition of satriya lelana
    and santri (wandering prince or religious student), exemplified by the famous
    Muslim prince, Dipanagara (1785–1855).


    > ⁵⁰ Here I follow Woodward (Islam in Java, p. 2F), noted by Geertz that this
    type of pilgrimage does not belong to Geertz'' typologies of santri (orthodox
    Muslims), priayi (the nobility influenced largely by Hindu-Javanese traditions),
    or abangan (village inmates). While highly influenced by Javanese tradition, they
    do not come from noble families and are far being animists or “heterodox”. They
    clearly identify themselves as Javanese Muslims, emphasizing the Javanese way
    of being Muslims, more in the style of Ricklefs calls “mystical synthesis of Islam
    and Javanese tradition” (see his Mystic Synthesis).'
