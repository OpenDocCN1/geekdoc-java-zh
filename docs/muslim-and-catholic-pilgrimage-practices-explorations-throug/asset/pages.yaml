    is an account of the mystical journey of the Mahabharata hero, Bhima, that sought
    enlightenment. And, more importantly, it forms the backbone of the standard Javanese
    framework of the mystical union of God and the self. In the story, Bhima’s quest
    for enlightenment is spoken of symbolically as his quest for the water of life
    (Jw. tirta perwitasari) that took him to the heights of the mountains and the
    depths of the seas before finding out that he had to find it in the core of his
    very being. Here, it is also insightful to note that an important part of the
    extra Qur’ic legends of al-khadir is his search for water of life.^29 Describing
    the final phase of Bhima’s quest for enlightenment in the Javanese mystical text
