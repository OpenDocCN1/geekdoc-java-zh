  md: 'Learning from van Lith, the Javano-Catholic intellectuals and their community
    understood the complex principle of communion as a guide for their identity formation,
    in the cultural, political, and religious realms, giving rise to forms of hybridity.
    However, ambiguities and tensions exist in this historical process. In the rest
    of this chapter I will explore the ways in which these tensions, ambiguities,
    and limits of the Javano-Catholic identity formation have been dealt with and
    made fruitful by the community itself, especially in history of the building of
    the three shrines under study, the Sendangsono Marian grotto (1929), the Sacred
    Heart Shrine at Ganjuran (1930) and the Mausoleum in Muntilan.


    In this regard, the statement of Father Prenthaler (1885–1946), a prominent Jesuit
    missionary in the post-van Lith era and the founder of the Marian grotto of Sendangsono,
    quoted above is instructive. For he understood the significance of the grotto
    precisely in terms of the spiritual and material dimension of the Catholic identity
    formation of the community, especially *vis-à-vis* the religious other. For him,
    the grotto was not only a source of joy for the community but also a beautiful
    and useful advertisement for non-Cathics in the surrounding area due to the role
    of the Virgin as the missionary. However, it is clear that this conception is
    not without its ambiguities and tensions. For it raises different questions: what
    does it mean for the Virgin to be the missionary? Does it mean that Mary would
    exactly accomplish her role as the missionary? Does it mean that Mary would draw
    these people into the Church through baptism, or also through some other ways
    that are simply beyond our immediate understanding? When non-Catholic pilgrims
    are drawn to the grotto and come tovere Mary in their own way without formal conversion
    to Catholicism, does it mean that Mary''s role as the missionary fails? Or, does
    this show a different aspect of Mary''s role as the Mother of all nations (Luke
    1:48)$^{216}$ And, and what are the roles of the Catholics themselves in this
    dynamic?


    Obviously, this set of questions can only be answered by exploring the ways in
    which the Javano-Catholic community itself has been grappling with them since
    its foundation. In this regard, once again, the three shrines can be taken as
    crucial historical and material expressions of the tensions and ambiguities embedded
    in the identity making this community. I will illustrate further the major ways
    in which the three shrines work in terms of the community''s self-understanding
    in the present. This hermeneutic process of returning to the founding sources
    (*resourcement*) is a crucial part of the negotiation of communal identity that
    makes possible the communion with the religious other. I will identify how this
    process of reinterpretation provides some directions to the potentialities, tensions,
    and ambiguities inherent in the story of the shrines.


