    In its Tantric framework, mandala is a plan of both macrocosm and microcosm and
    functions to bring the two together. It consists of a spatial or mental map of
    constellation of divities in the sacred space, with a governing body in the center
    that should become the identity of the practitioner during the meditation or ritual.¹¹
    Thus it is an integrative power. The mandala practice also has a deeply personal
    element in the human body (microcosm) can be imagined as a mandala, a constellation
    of diverse elements and realities that need to be integrated.


    Furthermore, it is crucial to note that one of the underlying principles in the
    practice of mandala is the reality of structural correlations and parallels among
    all things and in particular the universe, the mandala, and the human body.¹²
    There is rich and integral sense of communion embedded in the conception and practice
    of mandala, that is, communion with the Divine and true self, paradigmatic figures
    or teachers, fellow human beings, as well as with the entire cosmic reality. The
    interconnectedness of the ritual, spatial, and meditative elements of the mandala
    practice is also noteworthy.³ These features constitute major aspects in the pilgrimage
    tradition in Catholic and Muslim contexts in central Java.


    In the next chapter, I will explore the rich and inclusive meaning of the mandala
    symbolism through an analysis of the pilgrims. This is because at the Gajuran
    shrine, the whole gamut of meanings of the mandala symbolism only becomes clearly
