  md: '# Introduction


    Guided by the method of the new comparative theology, I attempt to offer a comparative
    phenomenological overview of the Javanese Muslim and Catholic pilgrimage traditions
    in south central Java, focusing on the major ways in which one can make sense
    of their deeper shared features and intimate encounters, as well as certain particularities
    (to a lesser degree) that exist between these two traditions. The principal category
    of communion with God, the self, and the other will serve as a guiding hermeneutic
    principle for this comparative study.


    # Case Study of Pilgrimage in South Central Java


    As has mentioned, this book focuses on the particular context of the practices
    of pilgrimage among the Muslim and Catholic communities in south central Java,
    Indonesia (Maps 1–3). This area is historically crucial in the construction of
    J identity, particularly in terms of its long and distinctive engagement with
    both the Hindu-Buddhist heritage and later Islamic elements. This area roughly
    covers the Javanese principalities (D. Vorstenland) during the Dutch colonial
    era, now represented by the sultates of Yogyakarta and Surakarta that descended
    from the Javano-Islamic kingdom of Mataram that was founded in the late sixteenth
    century. In the early history of the Republic of Indonesia (1940s), Yogyakarta
    and its sultan (Sri Sultan Hamengkubuwono IX) played a significant role. This
    was a major supporter of the independence movement against the Dutch colonial
    policy and the city served as Indonesia’s capital from 1946 to 1949, an extremely
    crucial time when the newly declared independence against all odds. Based on this
    history and its cultural legacy, Yogyakarta was the recent controversy over the
    special status of Yogyakarta, this historical fact was employed by its supporters
    as one of the legitimate reasons for the special status of this royal city.


    The distinctive cultural identity of Yogyakarta within Indonesia has a long history.
    During the New Order regime (1966–98), as part of the central government’s project
    to construct a distinctively “Indonesian” identity, Yogyakarta was imagined as
    a national symbol of unity in diversity, the so-called Pancasila tourism. On this
    point, Heidi Dahles writes:


    > 5 The New Order regime under the late President Suharto had with a political
    upheaval against the abusive communist rebellion in 1965. In the realm of national
    identity formation, this regime’s project was to firmly root the Indonesian identity
    in the principle of unity in plurality of its ethnicities, local cultures, religions
    and so forth, as expressed in the state philosophy of Pancasila consisting of
    five principles: belief in one supreme God, just and civilized humanitarian, nationalism
    based on the unity of Indonesia, representative democracy through consensus, and
    social justice for all. The cultural maxim of the regime was that the Indonesian
    culture is the sum total of all its ethnic and local cultures. That regime ended
    in 1998 following political chaos triggered by the worsening of the Southeast
    Asian economic crisis.'
