    # Concluding Remarks


    I have attempted to show in this chapter the rich and complex picture of Javano-Islamic
    pilgrimage tradition in south central Java in terms of arts, architecture and
    ritual. Particular emphasis has been given to the significance of these features
    of the pilgrimage tradition in the process of the religio-cultural identity formation
    of the Javano-Muslim communities, with the other, done always in extremely complex
    ways, is also at work in the material and ritual culture of the shrines and the
    pilgrimage tradition among Javanese Muslims in south central Java. To a large
    degree, this principle is considered to be one of the most distinctive legitimacies
    of the local saints like Kalijaga, Pandanarang and others. The result is the formation
    of a hybrid Javano-Islamic identity marked by an overwhelming respect for the
    richness of the Javanese culture and the desire to appropriate the goodness of
    this culture into the practice of Islam. In south central Java, this religio-cultural
    process has been supported and smoothed out by the Javano-Islamic courts of Yogyakarta
    and Surakarta, as well by the traditional Muslim organization (the Nahdlatul Ulama).


    This religio-cultural synthesis is unique in terms of its contents and particularities.
    It is about the particular encounters between Islam and the Javanese culture,
    itself a synthesis of different religio-cultural traditions such as spirituality,
    Hinduism, Buddhism, and so forth. This framework explains the presence of some
    distinctive ritual, artistic, and architectural features native to Java. For instance,
