    of pilgrimage have come together to form a relig-cultural common field of practice
    under the influence or in the larger context of the Javanese culture. In my view,
    this common practice and its logic could be called “the third pilgrimage tradition.”⁸
    What I mean by this common field is the kind of religio-cultural practice whose
    very logic, structures, and contents, if pursued further, lends themselves to
    a vast array of comparative theological reflections. For, due to the existence
    of this “third pilgrimage tradition,” Islam and Christianity as distinctive religious
    traditions do not obliterate each other. In the context of this book, my argument
    is that this sort of comparative theological logic has already been found in the
    dynamics of common understanding and practice among Muslim and Catholic pilgrims,
    especially in terms of the understanding of sacred history with its spatial, architectural
    and ritual expressions of religiosity, as well as the structure and contents of
    pilgrimage as a spiritual experience. This dynamic toward forming a “third pilgrimage
    tradition”


    > ⁷ Susan Ashbrook-Harvey, “Locating the Sensing Body: Perception and Religious
    Identity in Late Antiquity,” ed. David Brakke et al. (eds), Religion and the Self
    in Antiquity (Bloomington, 2005), pp. 140–62.


    > ⁸ By stating this, I am aware of the complexities surrounding the question of
    the “originality” of each of the parties here (“Javaneness,” “Islam,” and “Catholicism”).
    As I have stated, all the parties get transformed in the process of encounters,
    so is even harder to pinpoint the original starting point of each before the encounter.
    But, on the other hand, it is also clear that Islam brings its distinctive (and
    more universal) concepts to the table, so does Catholicism. Thus, one of can talk
    about the birth of a new reality out of these encounters.'
