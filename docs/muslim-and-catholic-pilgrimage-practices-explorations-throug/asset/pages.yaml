  md: '# A Double Visiting


    dynamism toward hanung and dungun (Chapter 6). These Javanese words are normally
    employed to explain the last part of the philosophy (the nung part). The semantic
    field of these Javanese words includes magnanimity, generosity, loving-kindness,
    balance, open-mindedness, forgiveness, freedom from fanaticism and extremism,
    and so forth.27 In the Javanese concept of dungun, there is a dynamic of knowing
    the existential state of the self in relation to the whole reality. Thus it involves
    the process of coming deeper with one''s true self, the true nature of reality
    and acting accordingly. At the end of the day, one would obtain a spiritual mastery
    over the self (jv. wenang, being in control of one''s self) that amounts to true
    wisdom.28 As noted earlier, this very dynamic is pivotal in the Javanese understanding
    of pilgrimage as laku and tirakat. This is why, for instance, the custodian of
    the Tembayat shrine remarks that life without laku, including ziarah, will be
    very hard; for it is extremely difficult to achieve the state of peace and surrender
    (jv. tremend, sumeleh) without this practice.29


    As have tried to demonstrate, the dynamic of devotion both Muslim and Catholic
    pilgrims leads to more fundamental and lasting peacefulness, a deeper sense of
    intention with the whole reality, God, the self, and the other. Furthermore, true
    peacefulness is manifested in the dynamism toward an act of loving surrender to
    God. The Javanese word for this stage is sumleh, as opposed to the rather fatalistic
    sense of pasrah. In the experience of many pilgrims, the movement from resigning
    to a difficult reality or crisis in life (jv. pasrah) to comprehensive surrender
    to God (jv. sumeleh) is never easy and it takes arduous path. However, as many
    pilgrims would testify, it is this process—namely, realizing the crisis, struggling
    to understand its major factors and directions, finding the deeper meanings and
    educational purposes of the crisis through an act of faith in the providential
    care of God—that forms the core of spiritual renewal. Again, one can say that
    the peak of the process is the attainment of the spiritual virtue of sumleh, surrendering
    one''s self to God. This virtue is dearly related to the Javanese ideal of serenity,
    as well as Islamic spirituality''s notion of the culminating spiritual state of
    the soul at peace with God (Ar. fas-muta''inna, Qur’ān 89: 27). In Serat Cabolèk,
    a Javano-Islamic mystical treatise from the eighteenth century, this idea is described
    in terms of a profound experience of peace that occurs when the seeker, the Mahabhatta
    hero Bhima enters the womb of Dewaru, the spiritual figure that represents both
    his master and his true self. The text says: “Bima''s heart is now peaceful and
    tranquil, in complete surrender, no longer troubled by anything.\”30


