    in Jombang, East Java, which has become a major pilgrimage site.40 As happens
    throughout the Islamic world, sacred tombs do not normally require the sanction
    from the institution to become public. At this initial stage the pilgrimage largely
    depends on the stature and spiritual presence of the saints being buried, as well
    as their networks of families, former students, and so forth. This is of course
    rather different from the Catholic case in which a shrine typically requires some
    form of local ecclesiastical approval to become a public space of veneration and
    worship.


    # Concluding Remarks


