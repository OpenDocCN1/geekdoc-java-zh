    # Pilgrimage as a Habit of the Heart


    In the framework of devotion understood as a loving relationship that grows over
    time, pilgrimage becomes a habit. It is not an isolated activity because it has
    become a crucial part of the religious sensibility of the pilgrims in the continuum
    of their life journeys. Here pilgrimage becomes a particular religious act that
    is filled with a sense of personal memory and history. This is because what happened
    in the previous pilgrimage will affect the next (or vice versa), and deepens one’s
    perception of the meaning of these past pilgrages. Often the sense that the next
    pilgrimage carries the memory of the previous ones deepens the process of spiritual
    growth or purification occurs precisely when this series of pilgrimage is viewed
    as a longer unit.


    There is a close relationship between pilgrimage as a habit of the heart (memory)
    and a journey of purification. This point is crucial among Javanese across religious
    backgrounds, pilgrimage is always understood in its organic relationship with
    its ascetic and purifying aspects. As noted, the Javanese understand *tirakat*
    and *laku*, two terms that point to the extended and intensive practice of asceticism
    and spiritual purification, both outward and inward. Many pilgrims feel the outward
    hardship of the journey has helped them feel inwardly closer to God and Mary.
    “J. luwah rukemes,” a pilgrim exclaimed, trying to explain the logic of this purifying
    asceticism in pilgrimage.¹¹


    Furthermore, the quality of gratitude and devotion often goes in hand with the
    hardship of the journey. A Javanese middle-aged man told me that he could not
