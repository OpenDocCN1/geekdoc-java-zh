  md: '# Chapter 7

    A Double Visiting: Comparative Insights

    on Muslim and Catholic Pilgrimage

    Practices in Java


    If we read the texts together, our reading has to take on the characteristics
    of

    an agile dance, as the texts are made to defer to one another, each read for a
    moment

    before the other steps again into the foreground.


    Francis X. Clooney, *Beyond Compare*


    This chapter is entitled “a double visiting” for two reasons. Firstly, it is reflective

    of the essence as well as the method of my comparative theological framework in

    this book, in which I move back and forth between my own tradition of Catholic

    Christianity and the tradition I visit, Islam. In line with the nature of the
    new

    comparative theology as a theological learning process done through a real

    of the religious other, this dynamic of double visiting turns into a real religious

    pgrimage to God and His saints where on levels I learn more about God,

    my own self, and my religious tradition, from the richness of the Muslim tradition

    as it is found in the pilgrimage process in Java. My pilgrimage as a movement
    of

    d visiting has provided me with these dynamics of multi-layered learning

    through what is familiar (identity) and what is other (alterity), as well the
    deeper

    connections between the two.


    Secondly, since this book is conceived as a very modest experiment in the new

    comparative theology, I intentionally use the term “double visiting” also as a
    way

    to situate this book within the discourse of this discipline of new comparative

    theology as proposed by Francis Clooney, James Fredericks, and others.¹ I find
    this

    comparative theological framework highly appropriate to shed light on the major

    dynamics of the Catholic and Muslim pilgrimage traditions precisely because of

    it attentiveness to the properly religious and theological dimensions of the subject

    matter. It strives to illuminate the theological dimensions of one’s home tradition

    through comparative journey to other religious tradition(s). In this process,
    the

    comparativist-cum-pilgrim pays and multiple visits to the religious

    world of the other and returns home more refreshed in terms of spiritual


    +   ¹ Francis Clooney, *Beyond Compare*, pp. 26–7.

    ² See especially Francis Clooney, *Comparative Theology* (2010) and *Beyond Compare*

    (2009); Fredericks, Buddhists and Christians (2004).'
