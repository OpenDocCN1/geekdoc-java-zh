  md: '# The Self and Other in Javano-Islamic Rituals and Festivals


    As noted previously, the Muslim pilgrimage tradition in south central Java has
    been known for its bolder and richly elaborate Javanese character, compared to
    its counterparts in East and West Java. This characteristic is displayed mainly
    in the local pilgrimage rituals. In this section, I will illustrate how the complex
    dynamic of inclusive identity, involving Javanese and Islamic elements, occurs
    in the rituals and festivals of the shrines under study, by focusing on: (a) the
    ritual etiquette of making pilgrimage; (b) the role of the ritual communal (Jv.
    slametan) as the meeting point between veneration of saints and memory of ancestors;
    (c) the influence of the distinctive Javanese court culture of imperial festivals
    (Jv. garebeg) and its concomitant veneration of sacred heirlooms (Jv. pusaka)
    in the major festivals of shrines.


    # Javano-Islamic Etiquette of Pilgrimage and Shrine Festivals


    At the shrines of Tembayat and Mawlana Maghrib, a great number of Javanese pilgrims
    would continually follow a largely Javanese ritual etiquette of tomb visitation
    combined with more standardized Islamic ritual etiquette (Ar. Adab al-ziyāra).
    Typically, after climbing the hundreds of steps to the top of the Jabalkit hill
    near the grave of Sunan Tembayat is located, pilgrims take off their shoes to
    enter the compound; then would the abution in the area next to the old Javanese
    mosque to the prayer (Ar. salāt). Many would change their clothes, and some would
    go to the old mosque to pray. All pilgrims would then proceed to the registration
    desk where the custodian of the outer area (Jv. juru kunci jaba) records their
    data, typically their name, address, intention of the visit, and the amount of
    donation. This custodian would not typically don the traditional Javanese outfit.
    As I will show below, it is the inner area custodians (Jv. kiri gero) who have
    to put on the traditional Javanese clothing. Apparently, this distinction has
    much to do with the ritual function and perception of sacredness. For the rites
    that the inner area custodians perform in the area close to the sacred tomb of
    the saint, and thus requires more respectful etiquette that is outwardly expressed
    in the various element of the rituals including a variety of Javanese cultural
    elements (more on this below). It is very interesting that this respect for God
    and his saint clothing is symbolically represented, among others, by the donning
    of Javanese traditional clothing. After recording their visits, pilgrims have
    the choice to either use the service of the inner area custodian of the shrine,
    or to proceed to the mausoleum of the saint through various gates on their own.
    Many ordinary Javanese pilgrims to this shrine would opt for the former. The incorporation
    of local Javanese culture into this ritual etiquette is striking. It makes use
    of the Javanese language and other culturally symbolic gestures'
