    as a powerful memory and reiteration of their religious vocation. For many pious
    Javanese Catholics would still pray for the gift of priestly and religious vocations
    for their children, and family pilgrimage also serves as a milieu in this kind
    of prayer occurs. During their formation, many young seminarians and nuns would
    also continue to do this pilgrimage. Cf. Wisnapranata, Kenangan, Kenangan, pp.
