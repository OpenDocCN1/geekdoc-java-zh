  md: 'By his fellow students, Lith was fondly remembered as an accomplished priest
    and well as their most beloved spiritual father. This was largely due to his self-sacrificing
    love for the Javanese. Always portrayed as a man of total detachment from worldly
    and self-pursuits, and Lith is also remembered as a white Catholic missionary
    whose life was devoted to fulfilling a lofty mission (Jv. pakaryan luhur), not
    only for the Javanese Catholics but also for the whole Indies.12 His former students
    lived closely with him for some years in the mission school at Muntian were moved
    by the quality of his personality: socially likable, humble, and entirely dedicated
    to the cause.13


    Indeed, about Lith''s long sojourn in central Java—from 1896 to 1926 with just
    few years of absence—was marked by a personal and professional immersion into
    the Javanese world. He was an active member of the Java Institut where he shared
    concerns for reviving the Javanese culture of the classical age, understood as
    relatively developing of Islam, with prominent members of Javanese elite and Dutch
    Orientalists.14 He also contributed a few articles to the scholarly discourse
    on the Hindu-Buddhist element of the Javanese culture.15 Lith''s membership in
    the Java Institut and his scholarly contribution might be arguably seen as an
    evidence of his Orientalist tendency, something that was not without its unambiguous
    ramifications on the question of Islam.


    > 12 Despite his apparent preference for the Javanese, Lith''s concerns beyond
    the confines of Java. His friendship with Haji Agus Salim, a prominent Muslim
    figure of the Sarekat Islam, was due to their common concerns for the welfare
    of Indonesians in general. Sukarno, a prominent nationalist activist who would
    eventually become the first Indonesian president, quoted Lith''s views in his
    defense speech during his 1929 trial and considered Lith as a true saint due to
    his preferential love for cause of the natives. We see von Klingen, “Power,” pp.
    55–6.


    > 13 ST, August 24, 1934.

