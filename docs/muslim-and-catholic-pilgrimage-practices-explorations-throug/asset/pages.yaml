  md: '# Muslim and Catholic Pilgrimage Practices


    In contemporary Java, pilgrimage is highly popular across religious boundaries,
    although this book focuses mainly on the Muslim and Catholic contexts. Among Javanese
    Muslims, pilgrimage has attracted the whole gamut of persons, from monarchs to
    Sufi mystics and countless persons seeking the blessings (Ar baraka) of God and
    his righteous Friends (Aw awliyā). Hundreds of thousands of pilgrims flock to
    the famous Nine Saints (J. Wali Songo) pilgrimage sites in Java annually. Compared
    to the Muslims, Catholics are newcomers in Java (from late nineteenth and early
    twentieth centuries), but local pilgrimage culture quickly deep root Javanese
    Catholics during their formative years.


    This wider pilgrimage culture in Java has resulted in the proliferation of countless
    pilgrimage sites. Over time the tradition of pilgrimage becomes more complex.
    Among others, it intersects with the whole process of identity formation for the
    religious communities in interaction with local realities and with one another.
    In the context of Java, the relationship between pilgrimage and Javanese identity
    formation is quite crucial. In fact, the Javanese text Ser Centini (nineteenth
    century) imagines the collective identity of “Java” in terms of journeying to
    all of its sacred and potent places of all kinds, while being attentive to local
    customs, natural wonders, and so forth. In this text, journeying corresponds to
    the various stages in the personal growth of the human person. This encyclopedic
    on the collective understanding of “Java” argues that pilgrimage is crucial both
    in terms of personal and collective identity formation.


    Taking into account the richness and complexity of the pilgrimage tradition mentioned
    above, this book is a comparative phenomenological and theological discourse on
    Catholic and Muslim traditions of pilgrimage to tombs and shrines (J. ziarah,
    Ar. ziyāra) in south central Java. My basic argument runs follows. In the Muslim
    and Christian traditions, pilgrimage is a rich and complex religious practice
    that fosters diverse kinds of communion with God and His company of saints and
    paradigmatic figures, including founders and ancestors of the community. Precisely
    due to its richness and complexity a spiritual and religio-cultural practice driven
    by the deeper dynamics of communion also becomes a crucial practice in which a
    distinctive religious identity is forged and negotiated in fruitful ways, among
    others through the process of engaging various forms of oneness including religious
    traditions and cultures, in the context of a long historical continuum that is
    also marked by tensions and ambiguities.


    > Cf. George Quinn, “Local Pilgrimage in Java and Madura: Why is it booming?”
    IIAS Newsletter, 35 (2004): p. 16; also Mark Woodward, Java, Indonesia and Islam
    (New York, 2010), p. 6 and passim.


    > See Nelly van Dorn-Harder and Kees de Jong, “The Pilgrimage to Tombayat: Tradition
    and Revival in Indonesian الإسلام.” The Muslim World, 91 (2001): pp. 325–54.'
