  md: '# Muslim and Catholic Pilgrimage Practices


    during this period.³ Always accused of being sympathetic to the Dutch, the Swara-Tama
    continued to be critical and combative in its debate with other native media.⁴
    This might indeed be shocking, especially when one sees it from today''s vantage
    point. But the historical context was very conducive for this kind of confrontational
    style of identity formation. For this was the age in the Netherlands East Indies,
    a tumultuous period in which the identity formations of various ethnic or religious
    groups (the Javanese, Chinese, Arabs, the Muslims, and so forth) were first negotiated
    in the context of their own group as well as over against each other.⁵


    One of the most defining challenges faced by the first Javanese Catholic community
    was the tension between cultural hybridity and religious purity. They were aware
    of the necessity of cultural hybridity: they wanted to stay Javanese and to be
    open to Western cultures as well. However, in the realm of religion, they initially
    seemed that this was not negotiable, and wanted to live out the “purity of Catholic
    religion.” Then the community adopted creative strategies of making sense of their
    Javaneness and Catholicism. In the words of Soegijaprana, the most articulate
    among the first group of Javanese intellectuals, the principle of this hybrid
    vision is formulated as follows: “We become Javanese Catholics, not Catholic Java.”
    (J. Djawi Kathaelik Sanolik Djawi).⁷ Thus, there is also a sense of inevitability
    hybridity that they negotiated from both Catholicism, and Javanese culture. They
    opted for Catholic element as the main framework in this hybrid identity. In the
    process, the first generation of Javanese Catholic intellectuals were proud of
    the nimblessness, versatility, and inclusivity of their “catholic” tradition (“cathicity”)
    in appropriating the Javanese culture and people. They believed


