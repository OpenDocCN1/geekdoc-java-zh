  md: '# MUSLIM AND CATHOLIC PILGRIMAGE PRACTICES


    Exploring the distinctive nature and role of local pilgrimage traditions among
    Muslims and Catholics, *Muslim and Catholic Pilgrimage Practices* draws particularly
    on south central Java, Indonesia. In this area, the hybrid Muslim pilgrimage culture
    is shaped by traditional Islam, the Javanese-Islamic sultanates, and the Javanese
    culture with its strong Hindu-Buddhist heritage. This region is also home to a
    vibrant Catholic community whose identity formation has occurred in a way that
    involves complex engagements with Islam as well as Javanese culture in which these
    complex engagements have been taking place between Islam, Catholicism, and Javanese
    culture. In this respect, local pilgrimage tradition presents itself as a rich
    milieu in which these complex engagements have been taking place between Islam,
    Catholicism, and Javanese culture.


    Employing a comparative theological and phenomenological analysis, this book reveals
    the deeper religio-cultural and theological import of pilgrimage practice in the
    identity formation and interaction among Muslims and Catholics in south central
    Java. In a wider context, it also sheds light on the larger dynamics of the complex
    encounter between Islam, Christianity, and local cultures.'
