  md: '# The Richness of Pilgrimage Experience


    In the experience of the pilgrims, the antidote to pure transaction is the cultivation
    of pure intention. As expressed in the etiquette of the Muslim ziyāra, right intention
    (Ar. niyyāt) is an essential part of this friendship and devotion. Interestingly,
    the purification of intention can happen in the repetition of pilgrimage to the
    same shrine, since unanswered prayers or prayers might be signaled by flawed intentions.
    It is also in this framework that a transformation of the motivation of the pilgrims
    could occur. Many pilgrims expressed how they came to know their true need only
    as a result of their long struggle to purify their hearts and intentions, a process
    of spiritual transformation or growth that could be triggered by a series of outward
    rejection of requests by God and the saints.


    Moreover, there is another aspect in the dynamic of supplication that is crucial
    for my discussion here, namely supplication as an expression (unveiling) of self
    in the context of intimate conversation. As I have illustrated in the context
    of the Tombatay shrine, some pilgrims would do this unveiling through specific
    rituals: the ritual where the pilgrims perform their intention to God and the
    shrine through the custodian, as well as personal prayers (Ar. du‘ā’). However,
    certain type of pilgrims (the next section) would continue this unveiling of self
    through intimate prayerful conversations (Ar. munājāt) at the shrine. For many
    pilgrims, it is this unveiling of self that helps visitors most, putting them
    in a lasting and deeper relationship with God, the saint and his shrine. It is
    also the place where the path of spiritual renewal often begins.


    In the experience of so many pilgrims in Islamic Java, Indeed, shrines turn into
    an intimate space where pilgrims converse not only with God and the saints but
    also with one another. It is rather surprising that during pilgrimage, “strangers”
    could coincide, albeit greatly, aspects of their most personal lives to one another.
    The dynamic of this rather intimate conversation seems to revolve around reality
    and trust. Typically, it starts with mundane conversations and then it takes only
    a person to open up to turn them into interpersonal communication and connection.
    For other pilgrims, this unveiling of self signals a humble plea for help, to
    which they would respond not by giving direct advice, but rather by narrating
    their own life stories as an expression of connection and solidarity. That is,
    precisely at the time when they feel so helpless and overwhelmed by all sorts
    of life problems, a middle-aged woman pilgrim at the Mawlana Maghribi shrine explains
    the spirit behind this: “Being a pilgrim is to share with other pilgrim, because
    all have problems and sharing them could ease us out!” This interpersonal unveiling
    of self results in a sense of mutual solidarity among pilgrims. In the presence
    of the friends of God (Ar. awliyā‘), strangers become friends quite literally.
    This friendship might or might not continue beyond the shrine, but what is more
    lasting is the experience of friendship itself. At this moment of friendship,
    communion with God and His saints means communion with one another.'
