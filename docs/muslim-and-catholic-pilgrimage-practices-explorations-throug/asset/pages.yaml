  md: '# The Richness of Pilgrimage Experience


    Let me illustrate this crucial point by the story of a middle-aged woman pilgrim
    that I encountered at the shrine of Gunungpring. This woman has been coming to
    this shrine since she was a small girl. She has continued to come here, more in
    earnest when her daughter had a mental breakdown recently. Obviously the fact
    that her daughter''s recovery is nowhere in sight did not prevent her from coming
    to the shrine. On the day I met her, she paid a visit to the saint because her
    daughter would be transferred, probably, to a mental hospital. When I asked her
    about the fact that her request has not been granted by the saint, she bluntly
    stated that she has been equal asking for some. She has lost everything in the
    pursuit of her daughter''s recovery, the money she originally saved for the hajj
    pilgrimage to Mecca. Furthermore, her daughter''s son, who was also her only grandchild,
    had it on her lap due to the maltreatment and neglect from her neighbors. On top
    of this, she has suffered considerably from social stigma. Her neighbors accused
    her of neglecting her daughter and her grandchild. However, despite her protest
    to God, she said she could not help coming to this shrine because she has put
    her daughter in the protection of the saint. She has been committed to the saint
    and the saint has been part of the life of her daughter who herself was a devotee
    of the saint before the breakdown. She confided to me, sobbing, that the situation
    is so bad now, but she was resolute in keeping her faith in God and his blessing
    through Raden Santri, one of the Javanese saints buried here and her beloved saint.
    She believed that if her daughter would healed, it would be at the hands of Raden
    Santri, by his superior sanctity over other saints.


    In other words, the very dynamics of her pilgrimage over the years, this woman
    has learned to understand better the various aspects of faith in God and the virtues
    of fidelity to trust in the saint. The intergenerational aspect of this devotion
    to God and the saints is also present in practice. She also learned how to place
    her personal needs in the larger framework of devotion.


    All these stories of pilgrims, within their limitations, show that devotion is
    very personal and highly complex. It also develops over time in the context of
    the personal growth of the pilgrims themselves. In many ways, a particular visit
    or pilgrimage is connected to the present and future visits, as well as the larger
    development of the pilgrims'' understanding of their connection with God and the
    saints. In most cases, devotion is not about relationship of equal friendship.
    It is a loving devotion of course. However, Javanese Muslim pilgrims continue
    to display a sense of being dependent on the saints in their journey of drawing
    near to their protectorship. In my view, it is in the framework of the real complex
    dynamics of proximity, friendship, and protectorship—covered by the Islamic term
    for sainthood, walāya—that one should understand, as the pilgrims themselves do,
    the “transactional” character of pilgrimage.¹³


    ¹³ Interview, April 20, 2009. In this sense, contemporary Muslim pilgrims are
    unlike their Christian counterparts in Roman late antiquity, as Peter Brown has
    argued in his work The Cult of the Saints.'
