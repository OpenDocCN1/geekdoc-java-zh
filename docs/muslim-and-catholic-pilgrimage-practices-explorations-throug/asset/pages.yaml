    Within the larger context of Java or Indonesia, central Java is quite unique due
    to the significant presence of Catholic Christianity and its distinctive dynamics
    of encounters with the Javanese culture and Islam. The presence of Catholics in
    this area dates back to the earliest period of the Catholic mission under the
    Dutch Jesuit missions in the late nineteenth and early twentieth centuries.


    Before dealing with the particular significance of central Java in the history
    of the Dutch Jesuit mission in Java, a general overview of the Protestant and
    Catholic missions in what is now the Indonesian archipelago is in order. Historically
    the Catholic presence among native Indonesians dates back to Francis Xavier in
    the sixteenth century, with the formation of small Catholic communities in the
    Moluccas. In the period after Francis Xavier, Portuguese missionaries also worked
    in other islands of Indonesia. However, with the arrival of Dutch colonialism
    in the seventeenth century, the progress of Catholic missions in the Moluccas
    was practically halted, while the other islands that were still under the Portuguese
    continued to grow until the second half of the eighteenth century. The island
    of Flores, where Catholicism still constitutes the majority religion now, remained
    until 1859. In Protestant Protestant began in a very modest way, mostly in the
    outer islands of the archipelago, starting circa the seventeenth century. Since
    the second half of the seventeenth century, Protestant missions became more intensive
    in many parts of Indonesia, with the exception of Java, with the active role of
    various missionary societies, while Catholics were being discriminated against
    during most of this period, both in the Netherlands and the Indies. This discrimination
    was only lifted in 1808, allowing some Jesuit priests to work for the European
    Catholics in the Indies. However, the Jesuit mission among native Javanese only
    started in 1859.


