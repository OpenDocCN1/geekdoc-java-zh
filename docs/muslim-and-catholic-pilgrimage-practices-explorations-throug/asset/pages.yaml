    Hindu-Buddhist archeological remnants of Java. His personal admiration and love
    of this culture was remarkable, lamenting the fact that the Javanese people had
    forgotten the meanings and significance of their great monuments of the past,
    due to the coming of Islam.^25 Then aligning his artistic and cultural interest
    with that of a small number of Javanese people who became the “promoters of modern
    Javanese art with classical inspiration,” Schmutzer was glad to see that there
    arose a generation with a nationalist sentiment who appreciated more and more
    the great works of the past.


    However Schmutzer rightly noticed that the nascent Javanese Catholic community
    did not seem to be part of this movement at first. During their formative years,
    their religious artistic taste was largely shaped by foreign religious arts of
    low quality.^26 A fascination with the high culture of the Hindu-Buddhist heritage
    was not really part of the first Javanese Catholic community at the very beginning.
    But then, partly due to the influence of such great figures like van Lith, Schmutzer,
    and Maclaine Pont, they come to see that heritage as part of their identity. As
    mentioned, Schmutzer’s argument for an indigenous Christian as his experiments
