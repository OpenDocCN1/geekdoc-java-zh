    # Pilgrimage and Saint Vacation in Christianity and Islam


    Even to casual observers, the contemporary popularity of the tradition of making
    pilgrimage to local shrines and sacred tombs among Catholics and Muslims is self-evident.
    However this widespread practice has quite a dramatic and contentious history
    in both traditions. On the Christian side, it is true that the metaphor of pilgrimage
    has been a favorite collective image for the Church since the earliest time—the
    Church and the Christians as pilgrims on earth the journey to God. However, when
    it comes to the question of real pilgrimage to sacred places, the picture is quite
    complete. For the property of the practice of pilgrimage was hotly debated in
    early Christianity. The Christian debate on the property of pilgrimage in late
    antiquity resolved the tension between local sites of pilgrimage on the one hand
    and Jerusalem on the other; as well around the dilemma of journeying an inner
    and spiritual space. Among others, the main concern also touched the theological
    question of a divine presence in the defined spatial locus over the scriptural
    ideal of “Jerusalem on high” (Galatians 4:26) and “worship as spirit, spiritually”
    (John 4:24).


    In general, fruitful tensions were preserved between the spiritual and spatial
    frameworks of understanding God’s presence. It was quite apparent that pilgrimage,
    either to Jerusalem or to local shrines, did not only quickly become a religious
    practice with some valid theological grounds in the first centuries of Christianity,


