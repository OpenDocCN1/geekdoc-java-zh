  md: '# The Trace of the Other in the Javano-Catholic Identity 161


    incorporate the other into the spatial, architectural, and ritual dimensions of
    these shrines.


    The community seems to be resolute in this negotiation in an ever-widening hermeneutic
    of openness and inclusion of the other. In this regard, one can identify the major
    elements of this hermeneutic by referring to the vision of Josef Schmutzer at
    the beginning of this chapter. Schmutzer understood the purpose of this vision
    as the creation of a new hybrid Javano-Catholic culture that would be thriving
    and rich, something that would serve as a special contribution of the Javanese
    Catholics to the world. He anchored this concept in the basic framework of the
    clarity of Christian Revelation guided by the Holy Spirit, whom he understood
    as Love.


    For him, however, this vision would only be fruitful if realized through the means
    of prayers and works, through the spirit of cooperation and hybridity between
    the science of the Occident and the art of the Orient. In connection with this
    point, my discussion has shown that the level of interfaith cooperation has recently
    been increasing at the three shrines. Mention of prayer is also insightful, because
    it becomes the deepest arena in which the revelatory power of this hybrid culture
    of the shrine can be experienced.


    Thus, through the wider and deeper application of the hermeneutic principle of
    communion, the traces of the other—especially in architecture and ritual of the
    shrines—would not be dead traces, but rather a sign of a living embrace that needs
    to be extended continuously. Within this framework, taking this trace seriously
    marks the birth of a new and vibrant culture that Schmutzer envisioned. As the
    contemporary developments in the three shrines have shown, this new culture is
    marked more and more by cooperation in works, hybridity in arts where Christianity
    and Javaneseness meet in a new artistic synthesis, openness in rituals, as well
    as solidarity, generosity, and a wider other-orientedness in prayers. These are
    among various ways in which the Javano-Catholic community has been trying to understand
    the meanings of their Catholicism—or what Schmutzer called the framework of “the
    luminous clarity of Revelation”—and they have come to illustrate the largely creative
    formation of their identity vis-à-vis the other amid the particularities of contemporary
    Javanese society in south central Java.'
