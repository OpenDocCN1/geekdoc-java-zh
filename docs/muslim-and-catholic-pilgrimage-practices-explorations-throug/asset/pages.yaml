    # The Sacred Heart Shrine in Ganjuran: A Community Being Sent


    It has become clear that the initial phase of the history of the Javanese Catholic
    community in south central Java was marked by tensions as it wobbled between security
    and insecurity, deep faith and self-doubt, how well as communion and exclusion.
    In what follows I will illustrate how the community comes to these tensions in
    a different spirit in the context of the Sacred Heart shrine in Ganjuran, where
    the identity of the community was negotiated within the larger and more integral
    context of a Catholic existence anchored in structural charity and inculturation.
    As also happened at the Sendangsono grotto, the current communal discernment of
    the community has significantly broadened the underlying principle of community.


    In terms of history and its role in the identity formation of the Javano-Catholic
    community, the Sacred Heart Shrine at Ganjuran—located some miles to the southwest
    of Yogyakarta, a few miles from the southern coast where some Javanese and Muslim
    sacred sites are found (see Map 3)—is intimately connected to the Sendangsono
    grotto. Consecrated on February 11, 1930, the feast day of Our Lady of Lourdes,
    the shrine was expected to be like Lourdes: that is, to be blessed with miracles.55
    The shrine acquired an integral pilgrimage site since its foundation, although
    it experienced a period of decline before becoming popular from the late 1990s
    until the present.56 Conceived and built by the Schmutzer family in their estate,
    the shrine acquired an ecclesiastical significance once as a monument or memorialization
    of the “apostolic” moment of the identity formation of the community: that is,
    when the whole community was being sent out on a mission to the larger society,
    after being founded, to speak, at Sendangsono. At the dedication ceremony of the
    shrine, the whole realm of Java and the Dutch Indies were also consecrated to
    the protection of the Sacred Heart of Jesus. The concerns went beyond the narrow
    confines of the Javano-Catholic community in Java or the Catholic Church in the
    Indies, but rather to the whole “nation” (I. Nusantara).


    Given this foundational spirit, the shrine was meant to be a sign of the maturity
    of the Javanese Catholic community, its coming of age, marked by the greater sense
    of responsibility for the much wider society. This foundational spirit is of course
    subject to the same complex process of communal discernment that


