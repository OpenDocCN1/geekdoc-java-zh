    represented by two major figures: (1) King Brawijaya V, the last monarch of the
    Hindu Majapahit; and (2) Sunan Kalijaga, without doubt the most revered and influential
    Muslim saint (Jw. wali, Ar. wali) in south central Java and the spiritual protector
