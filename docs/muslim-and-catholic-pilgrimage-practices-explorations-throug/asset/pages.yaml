  md: '# # Conclusion

    Going Home and Setting Off Again


    The world changed, as he returned to the one he knew.

    Serat Cabolëk¹


    In every pilgrimage the return journey is no less important than the preparation,
    the journey to the shrine, and the actual time spent there. For pilgrims return
    to their ubiquitous and ordinary life with a certain degree of newness. In the
    words of the *Serat Cabolëk* quoted above, one can say that pilgrims return to
    a changed world, even though its familiarity might still be overwhelming. In the
    same spirit and to conclude this book, I am going to identify some of the most
    crucial insights of this study.


    As I see, there are five most important comparative insights that can be drawn
    from this study. The first has to do with the crucial and complex role played
    by pilgrimage and the larger tradition of saint veneration in the formation of
    the distinctive and hybrid identity of the Muslim and Catholic communities in
    south Java. As I have shown in both Muslim and Catholic cases, these hybrid identities
    become distinctive in their richness, with the potential to contribute to their
    larger traditions of Islam and Catholic Christianity. Perhaps more importantly,
    these identities constitute robust and authentic religious traditions that not
    only have survived the storms of changing times, but have also resulted in quite
    remarkable and dynamic religious communities. For, in both cases, this hybrid
    identity is marked by creativity and inclusivity that stems to a large extent
    from its rootedness in the common local Javanese culture that continues to enable
    both to interact fruitfully on many different levels, and it serves as a crucial
    comparative fruit of this study. For as in the Introduction, the nature, property,
    and role of pilgrimage (shrine visitation) or saint veneration in general in both
    Christian and Muslim traditions was disputed in historical periods of the past,
    and is still in circles in both traditions. So, although these practices are grounded
    in theology and continue to inspire robust theological reflections, they are not
    traditionally associated with areas in which theological reflection occurs in
    each religious tradition. Against this background, this book shows how pilgrimage
    traditions turn out to be crucial in the actual identity formation of the Muslim
