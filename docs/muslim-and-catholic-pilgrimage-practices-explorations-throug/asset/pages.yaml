  md: '# Introduction


    this local identity is either truly lacking or undeserving recognized. Madjid
    (d. 2005), one of the most influential Muslim scholars that Indonesia has ever
    compared, the role of Islam in Indonesia and india this way: "In the Hindu India,
    Islam is a glorious past (showing its deep cultural influence), while in the Muslim
    Indonesia, Islam only has a future (since it did not influence the local culture
    in the past)."^12


    This sentiment should be understood within the background of a cultural vision
    that took the Majapahit kingdom (1294–1478) the Hindu and Buddhist cultures as
    the real backbone of Java and Indonesia''s glorious past. In this regard, the
    New Order did not really initiate the glorification of the Hindu-Javanese culture
    and policy in the make-up of modern Indonesian state and national identity. This
    tendency had been firmly in place since the colonial era among the earliest generation
    of Dutch orientalists who fell in love, personally and professionally, with the
    cultural legacy of Pre-Islamic classical Java.^13 Many Dutch Jesuit missionaries
    who worked in central java, including Father Franciscus van Lith (1863–1926),
    adopted this colonial view. To a large extent, the fact that Islam was "other"
    and that there was a significant degree of incompatibility between the Hindu-Javanese
    legacy and Islamic tradition were indeed part of the colonialist mode of scholarship
    of this period.


    In light of this background, I will show that Islam has actually played an important
    role in the religio-cultural shaping of the local Muslim communities in Indonesia,
    more particularly in Java. An authentic vision of Islam is preserved and expressed
    in the pilgrimage tradition in south central java, in a highly creative and complex
    religio-cultural framework that includes genuine appropriation of the older Hindu-Javanese
    religio-cultural legacy well.^14 In this regard, this book explores the role of
    Java as a complex positive force that has been deeply influenced by Islam and
    other religio-cultural traditions. Certainly, the Javanese culture in its complexity
    has served as a common bond among diverse religious groups in south central java.


    What is also distinctive about south central java is that this role became stronger
    and more pervasive due to the support of the courts of Yogyakarta and Surakarta
    as the contemporary heirs to the legacy of the Javano-Islamic kingdom of Mataram.
    It is in this religio-cultural setting that a rich and diverse tradition of pilgrimage
    flourishes officially under the patronage of one of these courts, or both. In
    recent years, the unifying force of Javanese culture and its specific relation
    to the pilgrimage traditions has become more apparent in many forms and levels.
    On the popular


