  md: '# Muslim and Catholic Pilgrimage Practices


    Representing the common history, revolutionary spirit, national pride, and the
    defeat of the colonial power, Yogyakarta had been designed as an obligatory place
    to visit for Indonesians to experience both “Indonesianness” and “Javaneness”
    and for foreign tourists to be lectured about national identity. It is argued
    that Yogyakarta had been created as the centre of “Pancasila tourism.” A visit
    to Yogyakarta, particularly for domestic tourists, elements of a national pilgrimage,
    with an emphasis on cultural continuity.⁶


    In general, Yogyakarta and Surakarta’s distinctiveness always lies in the realm
    of culture and cultural imagination, both in the specific context of what comes
    to be understood “Javanese” and the more general notion of “Indonesia.” Since
    the colonial era, Yogyakarta and Surakarta have been identified as the repositories
    of the most authentic and highest of Javanese cultural traditions⁷With regard
    to Surakarta, John Pember observed: “For many New Order Java, it is a city of
    origins, signing of the past in place, a privileged locus for much that is recalled
    as ‘Javanese.’⁸ Indeed the courts of Yogyakarta and Surakarta understand themselves
    as religious-cultural entities in many ways, particularly in the manner in which
    the Islamic dimension is integrated within Java’s older legacies, such as Javanese
    Hinduism and indigenous religious systems, manifested among others in the distinctive
    ritual, art and cultural style of the court (J. kraton)⁹


    For the most part, local residents of Yogyakarta and Surakarta share this view,
    identifying the sultan’s palace as the center of the preservation of the Javanese
    tradition and culture⁰ The recent controversy on the status of Yogyakarta within
    the Republic of Indonesia has only highlighted this strong sense of distinctive
    identity among the people of Yogyakarta. For them, the central government’s attempt
    to “democratize” Yogyakarta by removing the Sultan from the ex officio governor
    of the province without election was an insult to the time-honored cultural and
    political identity of Yogyakarta.¹¹ In response, Yogakarta mounted an organized
    response that finally succeeded in securing the special status of its region in
    2012.


    This distinctly hybrid self-understanding, however, begs the question of hegemony,
    particularly with regard to the nature and exact role of Islam in it. There is
    a certain sentiment among Indonesian Muslims that the Islamic to


