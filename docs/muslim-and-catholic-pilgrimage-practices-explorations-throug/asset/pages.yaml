    of *moksa*. It may be recalled that the moksas of last Hindu-Buddhist kings of
    Java have been used by certain Javanese texts as to assert the unbroken continuity
    through dying dynasties and the uncommon ones. This is because in this framework
    of *moksa* these kings did not die in the violent battle against Muslim forces,
    but rather they disappeared and attained a spiritual height. Thus the idea of
    *moksa* evades the problem of radical and violent change, something that is culturally
    troubling for Javanese.


    This principle of continuity, however, takes on another different form in Javanese
    account of Brawijaya, namely, through certain kind of conversion, understood not
    as a radical break with the past, but rather as a deeper reconciliation and continuity.
    The accounts of Brawijaya V’s conversion to Islam are known in Java, and very
    interestingly and quite intentionally are put next to the narratives of his *moksa*.
    As Rinks has put out, the Javanese seem to see this conversion as continuity on
