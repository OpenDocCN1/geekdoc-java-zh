    especially the Hindu part and the largely Muslim present. So, Chapter 5 will discuss
    the principal ways in which this complex hermeneutics of identity is operative
    in the spatial, architectural, and ritual dimensions of the shrines under study.


    Following this line of thought, Chapter 6 is another to delve deeper into the
    dynamics of pilgrimage practice in the three Catholic shrines under study, as
    experienced by pilgrims themselves in the context of their Javanese religious
    and cultural sensitivities. This chapter seeks to show how the whole idea of hybrid
    identity formation and the overarching desire for communion is concretely experienced
    and negotiated by pilgrims and their communities. Thus it shows why and how pilgrimage
    culture, with all its complexities and richness, continues to be a spiritually
    and religiously rewarding practice, and how it continues to have a religio-cultural
    significance as a supportive milieu for forging a deeper, inclusive, and lasting
    identity.


    In Part III (Chapter 7), I delve into an explicitly comparative analysis of the
    data presented in Parts I and II, employing the method of the new comparative
    theory. The main objective of this chapter is to identify what I consider the
    most significant similarities and a few observable differences found in the two
    pilgrimage traditions. These key similarities include: (1) the role of saints
    and spiritual renewal; and (3) the deeply sacramental worldview that lies at the
    heart of these pilgrimage traditions. These insights suggest a major theological
    argument of this book on the widening dynamic of communion with God that is at
    stake in the two pilgrimage traditions, a dynamic that in many different ways
    has been strengthened by and expressed through Javanese culture, a common religious-cultural
    bond between the two. This comparison is already “theological” precisely because
    it shows how the underlying sacramental dynamic of fostering an ever deeper and
    wider communion with God—itself a reality with serious theological import—is deeply
    shared by Islamic and Catholic pilgrimage traditions as they are practiced in
    south central Java.'
