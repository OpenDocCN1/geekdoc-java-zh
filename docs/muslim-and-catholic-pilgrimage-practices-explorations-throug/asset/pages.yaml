    Kalijaga''s genealogical credential came from the fact that he was born Raden
    Rahmat, a prominent Muslim saint who married Kalijaga''s aunt. Kalijaga may learned
    Islam at home, but his transformation to a Muslim wali was probably the most spectacular
    and legendary in Java. Under the tutelage of Sun Bonang, another prominent member
    of the legendary Nine Saints of Java, he underwent a dramatic spiritual awakening,
    to be in touch with the Real. Not only did he abandon his former roles as a privileged
    member of an aristocratic family and then as a Robin Hood-like wayside robber,
    he embarked on the cultivation of his new self by going through an ascetic practice
    of long meditation on the bank of a river. In some versions, his meditation is
    believed to have taken some years, so much by the time he returned to him, vegetation
    had grown around his body. The film Kalijaga (1984) seems to emphasize the dramatic
    conflicts of this future saint with the wealthy family as well as his Buddha-like
    journey to enlightenment and compassion for the poor. In comparing Kalijaga to
    his Moroccan counterpart, Clifford Geertz argues that Kalijaga became a Muslim
    through an inner change of heart brought on by the same sort of yoga-like spiritual
    discipline that was the core religious act of the Indic tradition from which he
    came; his redemption, if that is what should be called, was a self-produced inner
    state, a willed mood.\*24


