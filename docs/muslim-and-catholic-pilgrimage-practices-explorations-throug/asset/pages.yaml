    # Concluding Remarks


    By way of conclusion, three points need to be noted. First, among Javanese

    Muslim pilgrims in south central Java pilgrimage is a rich and complex mode of

    reliosity and piety that is both personal and communal, religious and cultural.
    It

    is motivated by spiritual devotion and love, but it also includes a very real
    search

    for blessings and blessedness that in turn involves a profound process of

    self-transformation and understanding. Pilgrimage is a space where a sheer

    desire for all human fulfillment is often transformed into a much more

    exelong journey of self-discovery and spiritual growth. To a large extent,

    the dynamics of pilgrimage are governed by the Islamic idea of walāya, in the

    sense of proximity to God and His saints as participating in the authority

    of God and His spiritual community. Javanese Muslim pilgrims treat the saints
    as

    belong to the category of revered ancestors or founders, spiritual intercessors

    and protectors, paradigmatic examples. For the most part, these saints also

    have having authority and continuous presence. So, for forth. In practising asceticism

    and purification in the understanding of pilgrimage as laku and tirakat, pilgrims

    become closer to God and their true selves.


    Secondly, I have shown how pilgrims experience and the Javano-

    Islamic aspect of pilgrimage. This hybrid aspect is not practiced or experienced

    in all the way and to the same degree, given the diverse religious-cultural

    orientations of the pilgrims and the corresponding modes of doing

    pilgrimage. Rather, what one sees in these diverse types of pilgrims is the

    remarkable richness of pilgrimage experience itself. Pilgrimage tradition appeals

    to wide variety of people for many reasons. Crucial in these diverse

    experiences are the ways in which Javanese culture get appropriately

    naturally and intentionally, such as the cultivation of rasa and the search for

    true peace and wellbeing (Jv. tentrem and slamet).


