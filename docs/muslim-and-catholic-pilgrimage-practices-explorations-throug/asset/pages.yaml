  md: '# Introduction


    The basic structure of Parts I and II revolves around how the overarching idea
    of communion with God and His company of saints is manifested in pilgrimage, which
    includes the central identity questions of self and other, is manifested in three
    major realms: namely, (1) the history of each shrine and its saint; and (2) the
    spatial, ritual, artistic, and architectural features of the shrines; and (3)
    the experience of the pilgrims and their local communities.


    Within Part I, Chapter 1 addresses the understanding and practice of sacred history
    among Javanese Muslims, focusing on the notion of history as communion and continuity
    with the past that includes paradigmatic figures and saints. This is the notion
    of history as a sacred past to be kept alive in the present. This sacred history
    is not a fixed narrative and legacy of the past, since what is more important
    is the communal task of continual reconnection with it, which includes the presence
    of the other (the pre-Islamic legacy). It is chiefly through the act of making
    pilgrims to the shrines of the paradigmatic figures of the past out this notion
    of history as memory. In this dynamic, the figures of local shrines represent
    living memories of the embodiments of the Javano-Islamic identity formation. Based
    on this notion of sacred history, this chapter also explores the historical particularities
    of the three Muslim shrines and their saints.


    As Chapter 2 will show, this general pattern of hybrid identity formation is manifested
    in many ways which the shrines and the local Javanese-Muslim communities deal
    with the traces of the earlier or in rituals, arts, and architectures. This hybrid
    is considered to be one of the most enduring and distinctive legacies of the local
    Javanese Muslim saints such as Sunan Kalijaga, Sunan Pandanarang, and others,
    whose role are “religio-cultural brokers” ensured the Islamic authenticity of
    this complex synthesis. This chapter will examine some of the particularities
    and creative dimensions of this religio-cultural synthesis.


    Chapter 3 deals with the experiential world of the Javanese Muslim pilgrims, that
    is, in many ways which pilgrims enter into an experience of intimate communion
    with devotion to God and His Friends, obtaining divine forms of blessing, while
    also forming a deeper contact with their selves as well as other pilgrims from
    different backgrounds. Special attention will be given to the distinctive intersections
    between Javanese culture and the wider Islamic tradition, as manifested in the
    various ways which pilgrims actually experience aspects of pilgrimage.


    Part II shares the basic structure of Part I. Chapter 4 discusses the historical
    formation of a Javanese-Catholic hybrid identity by exploring the ways in which
    the Javanese Catholic pilgrims and their community have understood history as
    a foundational and sacred past, a past that still has an overwhelming authority
    over the present and invites deeper reconnection and re-interpretation. Paradigmatic
    in this part are the founders and founding events of the community, represented
    and commemorated in the three Catholic shrines and the pilgrimage traditions to
    them.


    As occurs in the Javano-Islamic context, pilgrimage practice among Javanese Catholics
    has also served as a milieu where their hybrid identity is negotiated'
