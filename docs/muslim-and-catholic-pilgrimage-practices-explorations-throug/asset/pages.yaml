    # Muslim Saints as Religious Guarantors and Cultural Brokers


    In the previous section I have discussed that the inclusivity and hybridity of
    the shrine rituals in south central Java are a remarkable participatory element
    of constituting and affirming Javano-Islamic identity. The first part of this
    chapter has also shown Kalijaga and other wali are seen to be the propagator of
    this Islamic inclusivity in the adoption of local Javanese cultures, arts and
    festivals. The continuation of the *garebeg* festivals is also attributed to their
    spirit and initiative. Indeed, this is probably the most public aspect of the
    Javano-Islamic identity.


    The power of this particular framework of identity seems to lie in its ability
    to create room for diverse understandings and practices. Thus pilgrims who feel
    more as a Muslim than a Javanese would still be able to fully present at the shrines,
    largely due to the fact that the interpretation of the symbols of the rituals
    is not monolithic; and thus participation always allows for many different interpretation
    and meanings.⁶² In this regard, Javano-Muslim shrines in south central Java continue
    to be sites where different ways of engagement with the notion of sainthood, rituals,
    histories, and other features are not only allowed but also welcome and celebrated.
