    # The Three Muslim Shrines and Their Saints


    # Sunan Pandanarang and the Shrine of Tembayat


    This principle of spiritual and religio-cultural continuity between the old Javanese
    Hindu-Buddhist heritage and the new Islamic tradition is pivotal in the story
    of Sunan Pandanarang, the saint buried in the shrine of Tembayat. The Javanese
    account of his legendary ascent to sainthood involves the two of continuity mentioned
    previously, namely the Muslim saint Sunan Kalijaga and the last Javanese king
    Brawijaya V.


    By all accounts, it can be established that Sunan Pandanarang was the disciple
    of Kalijaga. Totally immersed in his worldly pursuit the governor of Semarang,
    an important port city on the northern coast of central Java, Pandanarang was
    made to realize the nature of reality (J. sunyata jati murti) by Kalijaga''s display
    of lofty spiritual feats and utter detachment from wealth and mundane power. However,
    the Serabat Bab Tembayat, a Javanese text about this, also links him to the Hindu
    Majapahit royal lineage through its last, Brawijaya V.61 In this genealogical
    account, Pandanarang is believed to be actually other than Brawijaya V himself
    or at least his descendant. And it was Kalijaga who brought him to Islam and initiated
    him, in a way that displays a deeply Javanese spiritual framework, in


