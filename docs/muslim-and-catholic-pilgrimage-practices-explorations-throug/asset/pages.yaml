    However, over against the danger of losing sight of the meaning of the particularity
    of each reality in this sacramental worldview, Roberto Goizueta argues:


    Implicit in the definition of sacrament is the presupposition that the concrete,
    particular object or entity embodies the universal reality is in fact historically
    concrete and particular. Consequently, an indispensable prerequisite of any sacramental
    relationship with a particular entity, i.e., a relationship with the supernatural
    Absolute is revealed, is that one affirms both the particularity and the historical
    correctness of that particular entity.35


    In terms of sacramental vision, one sees an overwhelming similarity between Javanese
    Muslim and Catholic pilgrimage. For, while the more spiritual or inner meaning
    or blessing of pilgrimage as a journey of self through purification becomes more
    and more crucial for pilgrims in the continuum of their spiritual journey, this
    overarching spiritual framework also translates into a myriad of more tangible
    ways in which communion with God is concret experienced, and reflected in the
    pilgrim''s life. It is this distinctive of pilgrimage that renders it appealing
    to pilgrims, serving as a rich and integral framework for their religious formation.


    So, in what follows I will reiterate the tangible ways of communion with God,
    self, and others, that happen in the Muslim and Catholic pilgrimage traditions
    and experience. In this respect, the structure of my presentation of this contemplative
    theological study is actually governed by the breadth of the sacramental vision
    as a vision of communion. This is why the structure of this book on the dynamics
    of communion with God in pilgrimage revolves around three major elements, namely
    history (1); sacred space, arts, architecture, and rituals (2); and the experiential
    world of pilgrims (3). Since I have just discussed the third element in the preceding
    section, the rest of this section will be devoted to the discussion on how a sacramental
    logic works in the context of the first two elements.


