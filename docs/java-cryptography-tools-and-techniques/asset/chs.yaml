  \  */\n    public AuditPath generateAuditPath(byte[] value)\n    {\n        LeafNode\
  \ leafNode = createLeafNode(Arrays.clone(value));\n\n        if (root == null)\n\
  \        {\n            return null;\n        }\n        else\n        {\n     \
  \       List pathElements = new ArrayList();\n\n            boolean found = buildAuditPath(pathElements,\
  \ root, leafNode);\n\n            if (found)\n            {\n                return\
  \ new AuditPath(root.hash, pathElements);\n            }\n\n            return null;\n\
  \        }\n    }\n\n    private LeafNode createLeafNode(byte[] nodeValue)\n   \
  \ {\n        // 使用零前缀是为了确保我们使用的计算方法与\n        // 节点不同。详情请参见 RFC 6962 的第 2.1 节。\n\
  \        return new LeafNode(hash((byte)0x00, nodeValue), nodeValue);\n    }\n\n\
  \    private boolean buildAuditPath(\n        List<AuditPath.Element> proof, Node\
  \ treeNode, LeafNode newNode)\n    {\n        if (newNode.isGreaterThan(treeNode))\n\
  \        {\n            if (treeNode instanceof BranchNode)\n            {\n   \
  \             BranchNode branch = (BranchNode)treeNode;\n\n                if (buildAuditPath(proof,\
  \ branch.right, newNode)) // 找到\n                {\n                    proof.add(new\
  \ AuditPath.Element(true, getHash(branch.left)));\n\n                    return\
  \ true;\n                }\n            }\n\n            return false;\n       \
  \ }\n        else\n        {\n            if (treeNode instanceof BranchNode)\n\
  \            {\n                BranchNode branch = (BranchNode)treeNode;\n\n  \
