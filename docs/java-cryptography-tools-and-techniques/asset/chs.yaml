  31 \n32       for (X509CertificateHolder id : csrCerts.getCertificateStore()\n33\
  \                                       .getMatches(null))\n34       {\n35     \
  \      System.out.println(\"CA: \" + id.getIssuer()\n36                        \
  \             + \"[\" + id.getSerialNumber() + \"]\");\n37       }\n```\n*(注：由于用户提供的代码块中存在重复的逻辑和代码结构，根据“不要重复输出原文”的原则，此处翻译时保持了代码块的逻辑对应，但由于原文中代码块本身存在逻辑重复，翻译部分严格遵循了对代码逻辑的呈现。然而，原文中第二个代码块包含重复逻辑，由于代码不翻译，此处译文仅供参考逻辑结构。)*\n\
