  \      EnrollmentResponse enrollmentResponse = estService.simpleEnroll(\n      \
  \                                                    isReenroll, certReq, auth);\n\
  \n      // 注册操作可以被服务器延迟。\n      while (!enrollmentResponse.isCompleted())\n    \
  \  {\n          Thread.sleep(Math.max(\n              1000,\n              enrollmentResponse.getNotBefore()\
  \ - System.currentTimeMillis()));\n          enrollmentResponse = estService.simpleEnroll(isReenroll,\
  \ certReq, auth);\n      }\n\n      return enrollmentResponse.getStore();\n  }\n\
  ```\n\n构建服务器与之前类似，我们随后构建一个 `PKCS#10` 证书请求，为服务器提供我们的公钥，以便其为我们创建证书。由于我们正在尝试获取证书，服务器期望我们提供某种程度的身份验证，因此我们构造了一个\
  \ `ESTAuth` 对象，使用 HTTP-Auth（通过 TLS）来向服务器识别自己的身份。\n\n下一步是执行注册并获取响应。EST 还支持证书的重新签发，因此在这种情况下，由于是我们的第一次，我们调用\
  \ `simpleEnroll()` 方法并将重注册设为 `false`，然后等待响应。EST 服务器有权告诉客户端稍后再回来，所以在尝试从服务器响应中提取证书之前，我们调用\
  \ `isCompleted()` 以确保我们确实收到了证书。如果 `isCompleted()` 返回 `false`，响应将包含一个告诉我们可以重试的时间，最好的建议是睡眠到那个时候然后重试。假设一切顺利且我们获得了完成的响应，`EnrollmentResponse`\
  \ 然后将包含一个或多个供我们使用的证书，其中实体实体是与我们的证书请求相关联的那个。\n\n使用 EST 演示服务器运行这段代码也相当简单。假设你继续使用之前用于获取信任锚点和列出属性的代码片段，以下示例代码将执行注册请求并打印有关返回证书的一些细节：\n\
  \n```java\n ECGenParameterSpec ecGenSpec = new ECGenParameterSpec(\"P-384\");\n\
  \      KeyPairGenerator kpg = KeyPairGenerator.getInstance(\"ECDSA\", \"BC\");\n\
  \      kpg.initialize(ecGenSpec, new SecureRandom());\n\n      KeyPair kp = kpg.generateKeyPair();\n\
  \n      Store<X509CertificateHolder> certs = estEnroll(\n                      \
  \                        trustAnchors,\n                                       \
  \       \"testrfc7030.com\", 8443,\n                                           \
  \   \"estuser\", \"estpwd\".toCharArray(),\n                                   \
  \           kp);\n      for (X509CertificateHolder cert : certs.getMatches(null))\n\
  \      {\n          System.out.println(\"Issuer : : + cert.getIssuer()\n       \
  \                                   + \"[\" + cert.getSerialNumber() + \"]\");\n\
  \          System.out.println(\"Subject: \" + cert.getSubject());\n      }\n```\n\
  \n### 使用 POP 获取证书\n\n使用 POP EST 获取证书也支持使用所有权证明（proof-of-possession，简称 POP）。不过这有一点不同之处，协议需要访问\
  \ TLS `tls-unique` 通道绑定类型。该通道绑定定义在 `RFC 5929` [109] 中，但目前尚未由 JSSE API 暴露。EST 包提供了一个\
  \ `ChannelBindingProvider` 接口，可以使用服务构建器添加。在编写时，只有 JSSE 支持此项，因此以下代码提供了一个适用于 JSSE\
  \ 的 `ChannelBindingProvider` 实现。\n\n```java\n/**\n * BouncyCastle 特定的通道绑定提供程序，允许访问\n\
  \ * 如 tls-unique 等内容\n */\npublic class BCJsseChannelBindingProvider\n    implements\
  \ ChannelBindingProvider\n{\n    public boolean canAccessChannelBinding(Socket sock)\n\
  \    {\n        return sock instanceof BCSSLocket;\n    }\n\n    public byte[] getChannelBinding(Socket\
  \ sock, String binding)\n    {\n        BCSSLConnection bcon = ((BCSSLocket)sock).getConnection();\n\
  \        if (bcon != null)\n        {\n            return bcon.getChannelBinding(binding);\n\
  \        }\n        return null;\n    }\n}\n```\n\n使用 `BCJsseChannelBindingProvider`\
  \ 和 `ESTService` 类上的 `simpleEnrollPoP()` 方法的示例用法如下所示：\n\n```java\n estBldr.withChannelBindingProvider(new\
  \ BCJsseChannelBindingProvider());\n\n        ESTService estService = estBldr.build();\n\
  \n        enrollmentResponse = estService.simpleEnrollPoP(\n                   \
  \             reEnroll, pkcs10Builder, contentSigner, auth);\n```\n\n注意在这种情况下我们需要向注册方法传递证书请求构建器，而不是预构建的证书请求。这样\
  \ POP 所需的属性就可以在与服务器连接后添加到请求中，因为只有那时信息才可用。\n\n### 证书管理协议\n\n证书管理协议（CMP）目前基于 `RFC\
  \ 4210` [87]。它提供了一种基于 ASN.1 的协议，用于 X509 证书和证书请求的管理与分发。与 CMS 一样，额外的 RFC 提供了适用于新算法的更新。\n\
  \n```asn1\nPKIMessage ::= SEQUENCE {\n     header           PKIHeader,\n     body\
  \             PKIBody,\n     protection   [0] PKIProtection OPTIONAL,\n     extraCerts\
  \   [1] SEQUENCE SIZE (1..MAX) OF CMPCertificate\n                      OPTIONAL\n\
  }\n```\n\n其中 `CMPCertificate ::= Certificate`，与 X509 使用的结构相同。\n\n\n\n\n`header`\
  \ 结构用于包含请求或响应的事务、地址和其他信息。顾顾名，`body` 包含了消息所携带的实际信息，其中 `PKIBody` 结构被分配了一个特定的类型代码。最后一个字段\
  \ `extraCerts` 用于存储可能对消息接收者有用的额外证书，例如 CA 可能会发送额外的证书，以便允许形成其在消息正文中刚刚签发的端实体证书的证书验证路径。\n\
  \n`protection` 字段所指的 `PKIProtection` 类型实际上是一个 `BIT STRING`。它是一个计算值，无论是 MAC 还是签名，都是通过对以下结构的\
  \ DER 编码计算得：\n\n```\nProtectedPart ::= SEQUENCE {\n    header    PKIHeader,\n  \
  \  body      PKIBody\n}\n```\n\n所使用的保护算法的详细信息显示在构成消息开头的 `PKIHeader` 结构中。\n\n接下面的方法展示了如何使用\
  \ Bouncy Castle API 创建简单的 CMP 消息，该消息携带一个证书请求，并使用 MAC 保护和认证。\n\n```\n 1     /**\n\
  \ 2      * 创建一个受 MAC 保护的 CMP ProtectedPKIMessage，其中包含一个 CRMF 证书请求。\n 3      *\n\
  \ 4      *\n 5      * @param sender 证书请求的发送者。\n 6      * @param recipient 目标 CA\
  \ 地址。\n 7      * @param certReqMsg 实际的 CRMF 证书请求。\n 8      * @param password 要使用的密码。\n\
  \ 9      * @return 一个 ProtectedPKIMessage\n10      */\n 11     public static ProtectedPKIMessage\
  \ generateMacProtectedMessage(\n 12         X500Name sender, X500Name recipient,\n\
  \ 13         byte[] senderNonce,\n 14         CertificateRequestMessage certReqMsg,\n\
  \ 15         char[] password)\n 16         throws CMPException, OperatorCreationException\n\
  \ 17     {\n 18         MacCalculator pbCalculator = new JcePBMac1CalculatorBuilder(\n\
  \ 19                       \"HmacSHA256\", 256).setProvider(\"BC\").build(password);\n\
  \ 20 \n 21         return new ProtectedPKIMessageBuilder(\n 22                 \
  \    new GeneralName(sender), new GeneralName(recipient))\n 23                 \
  \            .setMessageTime(new Date())\n 24                             .setSenderNonce(senderNonce)\n\
  \ 25                             .setBody(new PKIBody(\n 26                    \
  \             PKIBody.TYPE_INIT_REQ,\n 27                                 new CertReqMessages(\n\
  \ 28                                         certReqMsg.toASN1Structure())))\n 29\
  \                             .build(pbCalculator);\n 30     }\n```\n\n你会注意到，用于\
  \ MAC 计算器的算法与我们早些在 CRMF 中使用的方案不同。虽然这显示可以适应不同的 MAC 算法，但此情况也展示了一种更符合 FIPS 标准的算法，它基于\
  \ RFC 8018 [129]，该标准描述了最初为人知的 PKCS #5 PBKDF2。在这种情况下，通常不需要对 CRMF 消息应用 MAC，因为 CMP\
  \ MAC 结构同时涵盖了 CRMF 消息和 CMP 消息的头部信息。\n\n虽然 `generateMacProtectedMessage()` 消息的主文相当简洁，但传递给方法的参数数量表明需要进行一些准备。\n\
  \n下面的代码展示了构建必要部分所需的准备工作：\n\n```\n ECGenParameterSpec ecGenSpec = new ECGenParameterSpec(\"\
  P-384\");\n        KeyPairGenerator kpg = KeyPairGenerator.getInstance(\"ECDSA\"\
  , \"BC\");\n        kpg.initialize(ecGenSpec, random);\n        KeyPair kp = kpg.generateKeyPair();\n\
  \n        BigInteger certReqId = BigInteger.valueOf(System.currentTimeMillis());\n\
  \n        byte[] senderNonce = new byte[16];\n\n        random.nextBytes(senderNonce);\n\
  \n        CertificateRequestMessage certReqMsg = new CertificateRequestMessage(\n\
  \                CRMFUtils.generateRequestWithPOPSig(\n                        kp,\
  \ new X500Principal(\"CN=CMP Test Client\"),\n                        \"SHA256withECDSA\"\
  , certReqId));\n\n        // 创建封装 CRMF 证书请求的 CMP 消息。\n        X500Name sender =\
  \ new X500Name(\"CN=Certificate Requester\");\n        X500Name recipient = new\
  \ X500Name(\"CN=Certificate Issuer\");\n\n        ProtectedPKIMessage pkiMessage\
  \ = generateMacProtectedMessage(\n            sender, recipient, senderNonce, certReqMsg,\
  \ \"secret\".toCharArray());\n```\n\n我们生成了一个密钥对，并为接收者选择了一个事务 ID 和随机数（nonce）包含回复中。接下来，我们使用\
  \ CRMF API 为我们的公钥生成 `CertificationRequestMessage`。然后，我们使用这些加上我们的共享密钥，使用 CMP 方法生成受保护的\
  \ PKI 消息。一个小说明：为了简洁起见，`CertificateRequestMessage` 是根据我们之前看到的 CRMF 方法返回的编码构建的。显而易见，“在现实生活中”你不会这样双重处理消息。除此之外，该代码片段代表了最少所需。\n\
  \n自然，由于在请求中包含了 MAC，接收者将需要验证 MAC 以确认我们的消息是有效的。接下来的简单代码片段展示了接收者将如何验证 MAC：\n\n```\n\
  \ PBEMacCalculatorProvider macProvider =\n            new JcePBMac1CalculatorProviderBuilder().setProvider(\"\
  BC\").build();\n\n        System.out.println(\"message verified: \"\n          \
  \  + pkiMessage.verify(macProvider, \"secret\".toCharArray()));\n```\n\n虽然只有几行，但该代码片段展示了\
  \ MAC 创建与验证之间的区别。对于验证，我们需要构建一个适用于消息的 `MacCalculatorProvider`。该提供者随后与密钥一起传递给 `verify()`\
  \ 方法，该类内部构造一个 `MacCalculator`，并用于计算 MAC。假设之前的代码片段都已实现，上面的最后片段应该输出\n\n```\nmessage\
  \ verified: true\n```\n\n表示从消息重构 MAC 成功。\n\n### 总结\n\n在本章中我们查看了创建证书请求的标准协议——PKCS\
  \ #10 和 CRMF，同时也查看了 CMC、EST 和 CMP 等协议，这些协议通常用于向证书颁发机构（CA）通信证书请求。\n\nCA 通常期望某种形式的所有证明（POP），以证明请求证书的方确实拥有私钥。我们还看到用户能够通过共享密钥向\
  \ CA 进行身份验证，这样 CA 就能确信自己正在与已知的人进行通信。\n\n\n\nPGP 消息以记录流的形式表示。与我们在 CMS 中看到的不同，这些记录在流中通常表现为独立的实体，例如，封装的签名数据由一组记录组成，分别构成了签名头、数据和最终的签名记录。这与你在\
  \ CMS 中看到的有然不同，在 CMS 中所有这些信息都被封装在一个单一的结构中。\n\nOpenPGP 类可以在以“bcpg”开头的 Bouncy Castle\
  \ 分发包中找到。\n\n## 字面数据记录 (Literal Data Record)\n\nOpenPGP 消息的核心记录类型是 `Literal Data`（字面数据）记录。OpenPGP\
  \ 中的压缩和加密都适用于 OpenPGP 记录，而 `Literal Data` 记录用于包含你想要压缩或加密的实际数据。同样，对于封装的签名，我们会看到一个\
  \ `Literal Data` 记录用于标记被签名消息数据在 OpenPGP 流中出现的位置。\n\n`Literal Data` 记录在 `RFC 4880`\
  \ 的第 5.9 节中描述。在 Bouncy Castle API 中，它们使用 `PGPLiteralDataGenerator` 创建，你通过调用 `PGPLiteralData`\
  \ 类上的一个 `open()` 方法来逐个创建。在 OpenPGP 中，字面数据有三种类型：ASCII 文本 (`PGPLiteralData.TEXT`)、二进制\
  \ (`PGPLiteralData.BINARY`) 和 UTF-8 (`PGPLiteralData.UTF8`)。`Literal Data` 记录还包含一个文件名，如果不需要文件名，则可以使用特殊字符串“_CONSOLE”\
  \ (`PGPLiteralData.CONSOLE`) 代替。\n\n## 生成装甲输出 (Armored Output)\n\nOpenPGP 有一种 ASCII\
  \ 装甲格式（armored format），它与 PEM 非常相似。它是 Base 64 编码的，但在每个记录的末尾包含一个校验和。用于生成装甲输出的类是 `org.bouncycastle.bcpg`\
  \ 包中的 `ArmoredOutputStream` 类。同包中的 `ArmoredInputStream` 类提供了解析机制。\n\n有消息类型：用于密钥的“PGP\
  \ PUBLIC KEY BLOCK”和“PGP PRIVATE KEY BLOCK”，用于离线签名的“PGP SIGNATURE”，以及一种通用类型——“PGP\
  \ MESSAGE”，这有点是一个统称。还有一个特殊情况“PGP SIGNED MESSAGE”，我们将在稍后讨论明文签名时查看它。\n\n下面的代码片段从单个\
  \ Literal Data 记录生成装甲输出。\n\n```\n 1       byte[] msg = Strings.toByteArray(\"Hello,\
  \ world!\");\n 2 \n3       ByteArrayOutputStream bOut = new ByteArrayOutputStream();\n\
  \ 4       ArmoredOutputStream aOut = new ArmoredOutputStream(bOut);\n 5 \n6    \
  \   PGPLiteralDataGenerator lGen = new PGPLiteralDataGenerator();\n 7 \n8      \
  \ OutputStream lOut = lGen.open(aOut, PGPLiteralData.TEXT,\n 9                 \
  \          PGPLiteralData.CONSOLE, msg.length, new Date());\n10 \n11       lOut.write(msg);\n\
  12       lOut.close();\n13 \n14       aOut.close();\n15 \n16       System.out.println(Strings.fromByteArray(bOut.toByteArray()));\n\
  ```\n\n如果你运行该代码，你应该看到以下内容：\n\n```\n-----BEGIN PGP MESSAGE-----\nVersion: BCPG v1.63\n\
  \nyxt0CF9DT05TT0xFXX9ONEhlbGxvLCB3b3JsZCE=\n=sJgV\n-----END PGP MESSAGE-----\n```\n\
  \n你可以看到消息块最后一行上的校验和。它是一个 24 位的 CRC，因此适用于检测基本的传输错误，但从加密完整性的角度来看它是没用的。校验和的存在为 `ArmoredOutputStream`\
  \ 的实现带来了一个有趣的问题，正如警告框所示，这意味着流类上的 `close()` 方法不能关闭底层流，因为调用 `close()` 步骤必须用作生成校验和的触发器。\n\
  \n## 生成密钥环 (Key Rings)\n\nPGP 将密钥和证书存储在密钥环（key rings）中。在最简单的情况下（我们很快就会看到这种情况），密钥环简单来说就是一个主密钥（始终是签名密钥）和一个用于加密的子密钥。\n\
  \n下面的代码生成了一个带有 DSA 主密钥和 RSA 子密钥的基本密钥环，返回私钥和公钥密钥环组件的编码。现在读一遍代码，起初看起来可能有点复杂，但实际的“工作部分”是第\
  \ 15 到 25 行。\n\n```\n 1   /**\n 2    * 使用 DSA 签名密钥和 RSA 加密密钥生成私钥/公钥密钥环。\n 3    *\n\
  \ 4    *\n 5    * @param identity 与密钥关联的身份标识。\n 6    * @param passphrase 用于加密私钥的口密码。\n\
  \ 7    * @return 包含私钥和公钥密钥环编码的 byte[][] \n 8    *              分别对应。\n 9    */\n\
  10   public static byte[][] generateKeyRings(String identity, char[] passphrase)\n\
  11       throws GeneralSecurityException, PGPException, IOException\n12   {\n13\
  \       KeyPair dsaKp = DsaUtils.generateDSAKeyPair();\n14       KeyPair rsaKp =\
  \ RsaUtils.generateRSAKeyPair();\n15       PGPKeyPair dsaKeyPair = new JcaPGPKeyPair(\n\
  16                                       PGPPublicKey.DSA, dsaKp, new Date());\n\
  17       PGPKeyPair rsaKeyPair = new JcaPGPKeyPair(\n18                        \
  \               PGPPublicKey.RSA_ENCRYPT, rsaKp, new Date());\n19       \n\n20 \
  \      PDigestCalculator sha1Calc = new JcaDigestCalculatorBuilder()\n21       \
  \                                    .setProvider(\"SHA1\")\n22                \
  \                           .build();\n23       \n24       PGPKeyRingGenerator keyRingGen\
  \ = new PGPKeyRingGenerator(\n25                PGPSignature.POSITIVE_CERTIFICATION,\
  \ dsaKeyPair, identity, sha1Calc,\n26                null, null,\n27           \
  \     new JcaPSignerBuilder(dsaKeyPair.getPublicKey().getAlgorithm(),\n28      \
  \                 HashAlgorithmTags.SHA384),\n29                new JcePBEScretKeyEncryptorBuilder(\n\
  30                           PGPEncryptedData.AES_256, sha1Calc)\n31           \
  \            .setProvider(\"BC\").build(passphrase));\n32       keyRingGen.addSubKey(rsaKeyPair);\n\
  33 \n34       // 创建私钥环的编码\n35       ByteArrayOutputStream secretOut = new ByteArrayOutputStream();\n\
  36       keyRingGen.generateSecretKeyRing().encode(secretOut);\n37       secretOut.close();\n\
  38 \n39       // 创建公钥环的编码\n40       ByteArrayOutputStream publicOut = new ByteArrayOutputStream();\n\
  41       keyRingGen.generatePublicKeyRing().encode(publicOut);\n42       publicOut.close();\n\
  43 \n44       return new byte [][]{secretOut.toByteArray(), publicOut.toByteArray()};\n\
  45   }\n```\n\n一个重要的点在第 17 行，在 `PGPKeyRingGenerator` 构造中指定了 PGP 签名类型。你会注意到这是 `PGPSignature.POSITIVE_CERTIFICATION`。查看一眼\
  \ `RFC 4880` 第 5.2.1 节，积极认证意味着密钥持有者对身份声明进行了实质性的验证。积极认证用于将身份绑定到主密钥。公钥也经过内部认证，那里使用的签名类型是\
  \ `PGPSignature.SUBKEY_BINDING`。这两个 PGP 签名共同提供了类似于 X.509 为 DSA 主密钥和 RSA 加密子密钥提供的保护。\n\
  \n关于密钥环公钥和私钥组件结构的更多信息，可以在 `RFC 4880` 的第 5.5.2 节和 5.5.3 节中找到。\n\n注意从版本 2.1 开始，GPG\
  \ 默认使用新的密钥文件格式，即密钥箱文件格式 (.kbx)。我们稍后在本章的后续部分也会查看这种格式。\n\n### 向现有密钥环中添加子密钥\n\n有时你可能想要更新现有密钥环上的加密密钥，通常是通过添加新的子密钥并保留旧密钥。`PGPKeyRingGenerator`\
  \ 类也有一个构造函数，允许它接收一个现有的 `PGPSecretKeyRing` 并用它生成新的 `PGPSecretKeyRing` 和 `PGPPublicKeyRing`\
  \ 对象。\n\n添加新子密钥的示例方法如下：\n\n\n\n\n\n```java\n 1   /**\n 2    * 根据原始私钥环和一个新的\n 3 \
  \   * 子密钥生成私钥环/公钥环。\n 4    *\n 5    * @param original 用于创建新密钥环的原始私钥环。\n 6    * @param\
  \ passphrase 用于加密/解密私密钥的密码短。\n 7    * @param subKey 要添加的公/私钥子密钥对。\n 8    * @return\
  \ 返回一个 byte[][]，分别包含私钥环和公钥环的编码。\n 9    *                  。\n10    */\n11   public\
  \ static byte[][] addSubKey(PGPSecretKeyRing original, char[] passphrase, PGP\\\n\
  12 KeyPair subKey)\n13       throws PGPException, IOException\n14   {\n15      \
  \ PGPDigestCalculator sha1Calc = new JcaPGPDigestCalculatorProviderBuilder()\n16\
  \                                           .build()\n17                       \
  \                    .get(HashAlgorithmTags.SHA1);\n18 \n19       PBESecretKeyDecryptor\
  \ keyDecryptor = new JcePBESecretKeyDecryptorBuilder().bui\\\n20               \
  \                                                ld(passphrase);\n21       PBESecretKeyEncryptor\
  \ keyEncryptor = new JcePBESecretKeyEncryptorBuilder(\n22                      \
  \             PGPEncryptedData.AES_256, sha1Calc)\n23                          \
  \     .setProvider(\"BC\").build(passphrase);\n24 \n25       PGPKeyRingGenerator\
  \ keyRingGen =\n26           new PGPKeyRingGenerator(\n27                original,\
  \ keyDecryptor, sha1Calc,\n28                new JcaPGPContentSignerBuilder(\n29\
  \                       original.getPublicKey().getAlgorithm(),\n30            \
  \           HashAlgorithmTags.SHA384),\n31                keyEncryptor);\n32 \n\
  33       keyRingGen.addSubKey(subKey);\n34 \n35       // 创建私钥环的编码\n36       ByteArrayOutputStream\
  \ secretOut = new ByteArrayOutputStream();\n37       keyRingGen.generateSecretKeyRing().encode(secretOut);\n\
  38       secretOut.close();\n39 \n40       // 创建公钥环的编码\n41       ByteArrayOutputStream\
  \ publicOut = new ByteArrayOutputStream();\n42       keyRingGen.generatePublicKeyRing().encode(publicOut);\n\
  43       publicOut.close();\n44 \n45       return new byte [][]{secretOut.toByteArray(),\
  \ publicOut.toByteArray()};\n46   }\n```\n\n在上述方法中，添加子密钥时没有指定要使用哪些哈希/未哈希的签名子包。在这种情况下，签名子包将从主密钥上的主签名继承。此外`addSubKey(subKey)`\
  \ 还有一个重载方法，在需要时，它允许显式地指定哈希和未哈希的签名子包。\n\n### 封装签名消息\n\n与 CMS 类似，PGP 同时支持封装签名消息和分离式签名。我们先来看下封装签名。正如我们之前提到的，你可以从代码的构建方式中看出，一个\
  \ PGP 封装签名消息是由一系列数据包组成的，而不是像 CMS 那样的单一结构。\n\n![基础封装签名的记录格式。](img/chapter13----PGPSig.png)\n\
  \n基础封装签名的记录格式。\n\n从图中可以看出，一个基础封装签名由三条记录组成：签名头（![A](img/leanpub_equation_649.png)），然后是实际签名（![C](img/leanpub_equation_650.png)）。当签名嵌套时，(!![A](img/leanpub_equation_651.png),\
  \ ![C](img/leanpub_equation_652.png))对需要对应，因此，如果有两个签名 ![{C_1}](img/leanpub_equation_653.png)\
  \ 和 ![{C_2}](img/leanpub_equation_654.png)，记录的安排方式应：![{A_2}](img/leanpub_equation_655.png),\
  \ ![{A_1}](img/leanpub_equation_656.png), ![B](img/leanpub_equation_657.png), ![{C_1}](img/leanpub_equation_658.png),\
  \ ![{C_2}](img/leanpub_equation_659.png)。\n\n这里是一个示例方法，用于创建一个封装签名消息并返回结果记录的编码。请先查看它，然后我们再进行进一步讨论。\n\
  \n```java\n 1   /**\n 2    * 根据传入的签名密钥和数据\n 3    * 创建一个 PGP 签名消息。\n 4    *\n 5 \
  \   * @param signingAlg 要使用的签名算法。\n 6    * @param signingKey 用于签名的 PGP 私钥。\n 7 \
  \   * @param data 要签名的消息数据。\n 8    * @return 签名消息的编码。\n 9    */\n10   public static\
  \ byte[] createSignedMessage(\n11       int signingAlg, PGPPrivateKey signingKey,\
  \ byte[] data)\n12       throws PGPException, IOException\n13   {\n14       ByteArrayOutputStream\
  \ bOut = new ByteArrayOutputStream();\n15 \n16       // 创建一个用于写入签名的流。\n17      \
  \ BCPGOutputStream bcOut = new BCPGOutputStream(bOut);\n18 \n19       // 设置签名生成器\n\
  20       PGPSignatureGenerator sGen =\n21           new JcaPGPContentSignerBuilder(signingAlg,\
  \ PGPUtil.SHA384)\n22                   .setProvider(\"BC\"));\n23 \n24       sGen.init(PGPSignature.BINARY_DOCUMENT,\
  \ signingKey);\n25 \n26       // 输出签名头\n27       // false false 表示我们没有在生成嵌套签名。\n\
  28       sGen.generateOnePass(false).encode(bcOut);\n29 \n30       // 创建字面数据记录\n\
  31       PGiteralDataGenerator lGen = new PGiteralDataGenerator();\n32 \n33    \
  \   OutputStream lOut = lGen.open(bcOut, PGiteralData.BINARY, PGiteralData.CONSOLE,\
  \ data.length, new Date());\n34       for (int i = 0; i != data.length; i++)\n35\
  \       {\n36           lOut.write(data[i]);\n37           sGen.update(data[i]);\n\
  38       }\n39 \n40       // 完成字面数据构造\n41       lOut.close();\n42 \n43       //\
  \ 输出实际签名\n44       sGen.generate().encode(bcOut);\n45 \n46       // 关闭流。\n47   \
  \    bcOut.close();\n48 \n49       return bOut.toByteArray();\n50   }\n```\n\n观察设置签名生成的代码，你可以发现它遵循与\
  \ CMS 流式 API 相似的模式。操作符是不同的，因为 OpenPGP 并没有像 ASN.1 AlgorithmIdentifier 那样的结构，但如果你像处理\
  \ CMS 和 S/MIME 那样将相同的原理应用于 PGP 操作符，一切都会正常工作。\n\n值得注意的是，OpenPGP 将签名与特定类型关联。在示例中，该类型是\
  \ `PGPSignature.BINARY_DOCUMENT`，因为我们正在对二进制字面数据记录进行签名。你可以在 RFC 4880 第 5.2.1 节找到\
  \ OpenPGP 使用的不同签名和证书类型。证书与文档签名不同，仅与密钥关联。\n\n验证消息涉及几个步骤。验证时最需要注意的一点是，由于字面数据记录独立于签名头和脚部，因此有必要手动将字面数据记录的内容输入签名验证器。\n\
  \n这里给出的示例还利用了为了验证签名而恢复消息的需求，将被签名的数据写入流，以防调用者也希望查看实际的消息数据。请查看以下代码。\n\n\n\n\n\n```java\n\
  \  /**\n   * 在 bOut 中恢复原始消息，如果签名验证通过则返回 true。\n   * \n   * @param verifyingKey 用于验证消息的\
  \ PGP 公钥。\n   * @param pgpSignedData PGP 签名的消息数据。\n   * @param msgStream 用于写入恢复出的消息的流。\n\
  \   * @return 如果签名消息验证通过，则返回 true，否则返回 false。\n   */\n  public static boolean verifySignedMessage(\n\
  \      PGPPublicKey verifyingKey, byte[] pgpSignedData, OutputStream msgStream)\n\
  \      throws PGPException, IOException\n  {\n      // 为 PGP 协议流创建一个解析器\n      JcaPGPObjectFactory\
  \ pgpFact = new JcaPGPObjectFactory(pgpSignedData);\n\n      // 读取签名头并设置验证\n   \
  \   PGPOnePassSignatureList onePassList\n                               = (PGPOnePassSignatureList)pgpFact.nextObject();\n\
  \      PGPOnePassSignature ops = onePassList.get(0);\n\n      ops.init(\n      \
  \    new JcaPGPContentVerifierBuilderProvider().setProvider(\"BC\"),\n         \
  \ verifyingKey);\n\n      // 打开包含消息的字面数据记录\n      PGPLiteralData literalData = (PGPLiteralData)pgpFact.nextObject();\n\
  \      InputStream dIn = literalData.getInputStream();\n\n      // 读取消息数据\n    \
  \  int ch;\n      while ((ch = dIn.read()) >= 0)\n      {\n          ops.update((byte)ch);\n\
  \          msgStream.write(ch);\n      }\n\n      dIn.close();\n\n      // 读取并验证签名\n\
  \      PGPSignatureList sigList = (PGPSignatureList)pgpFact.nextObject();\n    \
  \  PGPSignature sig = sigList.get(0);\n\n      return ops.verify(sig);\n  }\n```\n\
  \n你会注意到，上述使用的方法——即仅创建一个 `PGPObjectFactory` 然后通过解析来处理数据——被广泛用于处理各种 PGP 消息。请注意，在“现实生活中”中，如果签名失败，你不希望将恢复出的消息数据返回给用户，尽管你可能希望将恢复的消息放在某个安全的地方进行分析。另外一点需要注意的是，我们选择找到找到第一个签名作为验证的匹配项。虽然在这个示例案例中是正确的，但通常情况下并非如此。在我们查看分离签名（detached\
  \ signatures）时，我们将查看更具通用性的签名处理方法。最后，解析流时通常需要使用 `PGPObjectFactory`，因为你有时无法完全确定接下来会发生什么，所以指定替代方案是比较好的。数据开始处可能会有一个\
  \ PGP 标记，这需要被跳过，或者字面数据也可能被封装在压缩数据中。由于这些考虑，如果你正在处理来自多个源的数据，在编写处理代码时，对 PGP 流中可能到达的包类型具有一定的适应性通常是一个好主意。\n\
  \n我们可以使用以下代码片段将这两个方法结合起来，它创建一个消息以及必要的密钥，以便能够创建和验证签名消息，并在验证成功时打印消息数据。\n\n```java\n\
  \  byte[] message = Strings.toByteArray(\"Hello, world!\");\n  KeyPair dsaKp = DsaUtils.generateDSAKeyPair();\n\
  \  PGPKeyPair dsaKeyPair = new JcaPGPKeyPair(PGPPublicKey.DSA, dsaKp, new Date());\n\
  \n  byte[] signedMessage = createSignedMessage(\n      PublicKeyAlgorithmTags.DSA,\
  \ dsaKeyPair.getPrivateKey(), message);\n\n  ByteArrayOutputStream recStream = new\
  \ ByteArrayOutputStream();\n\n  if (verifySignedMessage(dsaKeyPair.getPublicKey(),\
  \ signedMessage, recStream))\n  {\n      System.out.println(Strings.fromByteArray(recStream.toByteArray()));\n\
  \  }\n```\n\n运行带有提供方法的代码片段应该产生：\n\n```\nHello, world!\n```\n\n这表明消息解析正确，签名通过验证，且封装的消息也被成功恢复了。\n\
  \n### 分离签名 (Detached Signatures)\n\nPGP 中的分离签名代表的内容与我们在 S/MIME 的多部分签名数据中看到的分离签名大致相同。以下方法使用传入的字节数组作为待签名数据，为二进制数据生成一个分离签名。\n\
  \n```java\n  /**\n   * 为二进制数据生成分离签名。\n   *\n   * @param signingAlg 要使用的签名算法。\n \
  \  * @param signingKey 要使用的签名密钥。\n   * @param data 要签名的数据。\n   * @return 经过编码的 PGP\
  \ 分离签名。\n   */\n  public static byte[] createDetachedSignature(\n      int signingAlg,\
  \ PGPPrivateKey signingKey, byte[] data)\n      throws PGPException, IOException\n\
  \  {\n      PGPSignatureGenerator sGen = new PGPSignatureGenerator(\n          new\
  \ JcaPGPSignerBuilder(signingAlg, PGPUtil.SHA384)\n              .setProvider(\"\
  BC\"));\n\n      sGen.init(PGPSignature.BINARY_DOCUMENT, signingKey);\n\n      sGen.update(data);\n\
  \n      PGPSignature pgpSig = sGen.generate();\n\n      return pgpSig.getEncoded();\n\
  \  }\n```\n\n由于签名不包含数据，你可以看到不需要诸如 `generatePassVersion()` 之的操作，因为不需要任何头部信息。此外，由于签名与被签名的数据是分离的，验证还需要提供原始数据作为验证过程的一部分。以下是验证方法：\n\
  \n```java\n  /**\n   * 验证二进制数据的分离签名。\n   *\n   * @param verifyingKey 用于验证签名的公钥。\n\
  \   * @param pgpSignature 为数据生成的签名。\n   * @param data 被签名的数据。\n   * @return 如果签名验证通过，则返回\
  \ true，否则返回 false。\n   */\n  public static boolean verifyDetachedSignature(\n  \
  \    PGPPublicKey verifyingKey, byte pgpSignature, byte[] data)\n      throws PGPException,\
  \ IOException\n  {\n      JcaPGPObjectFactory pgpFact = new JcaPGPObjectFactory(pgpSignature);\n\
  \n      PGPSignatureList sigList = (PGPSignatureList)pgpFact.nextObject();\n\n \
  \     PGPSignature sig = null;\n      for (PGPSignature s: sigList)\n      {\n \
  \         if (s.getKeyID() == verifyingKey.getKeyID())\n          {\n          \
  \    sig = s;\n              break;\n          }\n      }\n\n      if (sig == null)\n\
  \      {\n          throw new IllegalStateException(\"未找到密钥签名\");\n      }\n\n \
  \     sig.init(\n          new JcaPGPContentVerifierBuilderProvider().setProvider(\"\
  BC\"),\n          verifyingKey);\n\n      sig.update(data);\n\n      return sig.verify();\n\
  \  }\n```\n\n在这种情况下，匹配验证密钥的签名步骤（跨第 17 到 25 行）比之前复杂，但在通常情况下是正确的，因为只有当签名列表中的签名与提供的验证密钥的密钥\
  \ ID 匹配时，才会被选中。\n\n可以使用以下代码片段来尝试这两个示例方法。\n\n```java\n  byte[] message = Strings.toByteArray(\"\
  Hello, world!\");\n  KeyPair dsaKp = DsaUtils.generateDSAKeyPair();\n  PGPKeyPair\
  \ dsaKeyPair = new JcaPGPKeyPair(PGPPublicKey.DSA, dsaKp, new Date());\n\n  byte[]\
  \ signature = createDetachedSignature(\n      PublicKeyAlgorithmTags.DSA, dsaKeyPair.getPrivateKey(),\
  \ message);\n\n  if (verifyDetachedSignature(dsaKeyPair.getPublicKey(), signature,\
  \ message))\n  {\n      System.out.println(\"signature verified\");\n  }\n  else\n\
  \  {\n      System.out.println(\"signature failed\");\n  }\n```\n\n假设没有发生任何错误，执行代码应该产生以下输出：\n\
  \n```\nsignature verified\n```\n\n\n\n\n表示已创建正确的签名，并且验证密钥已成功匹配到签名创建方法创建的签名列表中的签名。\n\
  \n### 文本数据签名\n\nPGP 也支持对文本数据进行签名。在这种情况下，无论是否封装，要求都是文本数据必须经过规范化（canonicalized）——在此例中，这意味着签名中的行结束符始终被计算为`\"\
  \\r\\n\"`，而不是平台可能使用的原生行结束符。我们在这里查看封装签名的生成（生成分离版本可以通过遵循上一节中对封装代码所做的更改来实现，但是针对文本签名）。值得注意的是，这里的规范化定义与用于明文签名（cleartext\
  \ signatures）的规范化定义并不相同。我们将在下一节中介绍明文签名。\n\n以下方法创建了一个文本类型的签名。\n\n```\n 1   /**\n\
  \ 2    * 根据传入的签名密钥和数据创建一个 PGP 签名文本消息。\n 3    *\n 4    * @param signingAlg 要使用的签名算法。\n\
  \ 5    * @param signingKey 用于签签名的 PGP 私钥。\n 6    * @param data 待签名的消息数据。\n 7   \
  \ * @return 签名消息的编码。\n 9    */\n10   public static byte[] createSignedMessage(\n\
  \ 11       int signingAlg, PGPPrivateKey signingKey, byte[] data)\n 12       throws\
  \ PGPException, IOException\n 13   {\n 14       ByteArrayOutputStream bOut = new\
  \ ByteArrayOutputStream();\n 15 \n 16       // 创建一个写入签名的流。\n 17       BCPGOutputStream\
  \ bcOut = new BCPGOutputStream(bOut);\n 18 \n 19       // 设置签名生成器\n 20       PGPSignatureGenerator\
  \ sGen =\n 21           new PGPSignatureGenerator(\n 22               new JcaPGPContentSignerBuilder(signingAlg,\
  \ PGPUtil.SHA384)\n 23                   .setProvider(\"BC\"));\n 24 \n 25     \
  \  sGen.init(PGPSignature.CANONICAL_TEXT_DOCUMENT, signingKey);\n 26 \n 27     \
  \  // 输出签名头\n 28       // false 表示我们没有生成嵌套签名。\n 29       sGen.generateOnePassVersion(false).encode(bcOut);\n\
  \ 31 \n 32       // 创建字面数据记录（Literal Data record）\n 33       PGPLiteralDataGenerator\
  \ lGen = new PGPLiteralDataGenerator();\n 34 \n 35       OutputStream lOut = lGen.open(bcOut,\n\
  \ 36           PGPLiteralData.TEXT, PGPLiteralData.CONSOLE, data.length, new Date());\n\
  \ 37 \n 38       for (int i = 0; i != data.length; i++)\n 39       {\n 40      \
  \     lOut.write(data[i]);\n 41           sGen.update(data[i]);\n 42       }\n 43\
  \ \n 44       // 完成字面数据构造\n 45       lOut.close();\n 46 \n 47       // 输出实际签名\n\
  \ 48       sGen.generate().encode(bcOut);\n 49 \n 50       // 关闭流。\n 51       bcOut.close();\n\
  \ 52 \n 53       return bOut.toByteArray();\n 54   }\n```\n\n你可以看到它与二进制签名版本相比仅在两处不同：一处是第\
  \ 25 行设置签名类型，另一处是第 35 行设置字面数据类型。常量`PGPLiteralData.TEXT` 翻译为值为‘t’的类型代码，这通常仅意味着 ASCII\
  \ 文本。PGP 还为字面数据提供了一个类型为‘u’的类型代码，由`PGPLiteralData.UTF8` 表示。\n\n你可能会想知道数据的规范化是在哪里处理的，因为在代码中似乎没有被显式处理。对于`CANONICAL_TEXT_DOCUMENT`\
  \ 签名，`PGPSignatureGenerator` 类和`PGPSignature` 类都从内部处理了规范化。\n\n验证消息的方法与之前相同。由于规范化将在内部处理，我们可以利用之前在查看验证封装二进制签名时所定义的`verifySignedMessage()`方法。\n\
  \n作为用法示例，以下代码段创建了消息和必要的密钥，以便使用`verifySignedMessage()` 创建并验证签名消息，并在验证成功时打印消息数据。\n\
  \n```\n // 平台无关的文本消息生成器\n      ByteArrayOutputStream bOut = new ByteArrayOutputStream();\n\
  \      BufferedWriter bWrt = new BufferedWriter(new OutputStreamWriter(bOut));\n\
  \      bWrt.write(\"Hello, world!\");\n      bWrt.newLine();\n      bWrt.close();\n\
  \n      byte[] message = bOut.toByteArray();\n\n      KeyPair dsaKp = DsaUtils.generateDSAKeyPair();\n\
  \      PGPKeyPair dsaKeyPair = new JcaPGPKeyPair(PGPPublicKey.DSA, dsaKp, new Date());\n\
  \n      byte[] signedMessage = createSignedMessage(\n          PublicKeyAlgorithmTags.DSA,\
  \ dsaKeyPair.getPrivateKey(), message);\n\n      ByteArrayOutputStream recStream\
  \ = new ByteArrayOutputStream();\n\n      if (verifySignedMessage(dsaKeyPair.getPublicKey(),\
  \ signedMessage, recStream))\n      {\n          System.out.print(Strings.fromByteArray(recStream.toByteArray()));\n\
  \      }\n```\n\n使用提供的方法运行该代码段也应该产生：\n\n```\nHello, world!\n```\n\n这意味着消息流解析正确，签名通过验证，且封装的消息也成功恢复。\n\
  \n### 明文签名\n\n明文签名在 RFC 4880 的第 7 节中有介绍。它们背后的想法是提供一种类似于我们在 S/IME 中看到的签名多部分（signed\
  \ multipart）机制——即在不需要任何软件解析的情况下即可读取的签名消息。尽管对该概念持有保留意见，但有很多基于 PGP 的应用程序生成或期望使用明文签名。\n\
  \n#### 创建明文签名\n\n与签名文本数据一样，为了产生可以被验证的明文签名，也需要规范化。在这种情况下，规范化过程比以前更复杂，因为消息包含了装护（armoring），所以行首的破折号必须转义，装护之前的最后一个行结束符需要在签名计算中被忽略，且行尾的空格也应该被忽略。\n\
  \n幸运的是，这些内容大部分可以透明地处理，并由用于生成明文签名的`ArmoredOutputStream` 类支持。然而，识别哪些内容放入签名对象仍然需要用户的参与，因此需要一些代码来为这些签名提供必要的底层支持，特别是当在处理过程中不能更改行结束符的消息时。\n\
  \n以下工具代码允许在输出中保留行结束符，同时处理规范化并忽略待签名数据每行末尾的空白。\n\n\n\n\n\n```java\n  1 // 如果 b 是空白字符，则返回\
  \ true。\n  static boolean isWhiteSpace(\n      byte b)\n  {\n      return b == '\\\
  r' || b == '\\n' || b == '\\t' || b == ' ';\n  }\n\n  // 注意：根据 RFC 4880 第 7.1 节，计算签名时\n\
  \  // 需要移除每行末尾的空白字符。\n  static int getLengthWithoutWhiteSpace(\n      byte[] line)\n\
  \  {\n      int end = line.length - 1;\n\n      while (end >= 0 && isWhiteSpace(line[end]))\n\
  \      {\n          end--;\n      }\n\n      return end + 1;\n  }\n\n  // 将行的头部字节添加到签名生成器中，\n\
  \  //并将整行写入输出流。\n  private static void processLine(\n      PGPSignatureGenerator\
  \ sGen, OutputStream aOut, byte[] line)\n      throws IOException\n  {\n      //\
  \ 移除尾尾空白。\n      int length = getLengthWithoutWhiteSpace(line);\n      if (length\
  \ > 0)\n      {\n          sGen.update(line, 0, length);\n      }\n\n      aOut.write(line,\
  \ 0, line.length);\n  }\n\n  // 读取一行输入，处理各种换行符。\n  private static byte[] readInputLine(\n\
  \      InputStream fIn)\n      throws IOException\n  {\n      ByteArrayOutputStream\
  \ bOut = new ByteArrayOutputStream();\n\n      int ch;\n\n      while ((ch = fIn.read())\
  \ >= 0)\n      {\n          bOut.write(ch);\n          if (ch == '\\r')\n      \
  \    {\n              fIn.mark(1);\n              if ((ch = fIn.read()) == '\\n')\n\
  \              {\n                  bOut.write(ch);\n              }\n         \
  \     else\n              {\n                  fIn.reset();\n              }\n \
  \             return bOut.toByteArray();\n          }\n          else if (ch ==\
  \ '\\n')\n          {\n              return bOut.toByteArray();\n          }\n \
  \     }\n\n      return null;\n  }\n```\n\n如你所见，保留换行符确实增加了一些复杂度。你可以考虑你的 PGP 明文签名应用是否需要如此通用。如果你的应用并不需要，它将简化代码。\n\
  \n借助于上面定义的 `readInputLine()` 和 `processLine()` 方法，一个根据给定的私钥、摘要算法和某些输入数据生成明文签名的方法示例可能如下：\n\
  \n```java\n  1 /**\n  2  * 从传入输入流创建明文签名文档。\n  3  *\n  4  * @param pgpPrivKey 用于签名的私钥。\n\
  \  5  * @param digest 用于创建签名的摘要算法。\n  6  * @param msgIn 中要包含并签名的输入。\n  7  * @param\
  \ clrOut 用于写入明文签名文档的输出流。\n  8  */\n  9  public static void createCleartextSignature(\n\
  \  10      PGPPrivateKey pgpPrivKey, int digest, InputStream msgIn, OutputStream\
  \ clrOut)\n  11      throws PGPException, IOException\n  12  {\n  13      BufferedInputStream\
  \ mIn = new BufferedInputStream(msgIn);\n\n  15      // 设置签名生成器。\n  16      int\
  \ keyAlgorithm = pgpPrivKey.getPublicKeyPacket().getAlgorithm();\n  17      PGPSignatureGenerator\
  \ sGen = new PGPSignatureGenerator(\n  18          new JcaPGPContentSignerBuilder(keyAlgorithm,\
  \ digest).setProvider(\"BC\"));\n\n  20      sGen.init(PGPSignature.CANONICAL_TEXT_DOCUMENT,\
  \ pgpPrivKey);\n\n  22      // 创建明文文档。\n  23      ArmoredOutputStream aOut = new\
  \ ArmoredOutputStream(clrOut);\n\n  25      aOut.beginClearText(digest);\n\n  27\
  \      //\n  28      // 注意，文件中最后一个 \\n/\\r/\\r\\n 会被忽略\n  29      //\n  30     \
  \ byte[] line = readInputLine(mIn);\n\n  32      processLine(sGen, aOut, line);\n\
  \n  34      while ((line = readInputLine(mIn)) != null)\n  36      {\n  36     \
  \     sGen.update((byte)'\\r');\n  37          sGen.update((byte)'\\n');\n\n  39\
  \          processLine(sGen, aOut, line);\n  40      }\n\n  42      // 结束明文数据\n\
  \  43      aOut.endClearText();\n  44      // 输出签名\n  45      sGen.generate();\n\
  \  46  }\n```\n```\n\n\n\n\n\n```java\n 1   /**\n 2    * 验证传入的明文签名文档，如果成功则返回 true\
  \ 和数据的\n 3    * 副本，否则返回 false。\n 4    *\n 5    * @param publicKey 用于验证签名的公钥。\n 6\
  \    * @param in 包含明文签名文档的输入流。\n 7    * @param msgOut 用于保存签名数据的输出流。\n 8    * @return\
  \ 如果文档通过验证，则返回 true，否则返回 false。\n 9    */\n10   public static boolean verifyCleartextSignature(\n\
  11       PGPPublicKey publicKey, InputStream in, OutputStream msgOut)\n12      \
  \ throws IOException, PGPException\n13   {\n14       ArmoredInputStream aIn = new\
  \ ArmoredInputStream(in);\n15 \n16       // 保存一份文本的副本以供验证\n17       ByteArrayOutputStream\
  \ bOut = new ByteArrayOutputStream();\n18 \n19       int ch;\n20       while ((ch\
  \ = aIn.read()) > 0 && aIn.isClearText())\n21       {\n22           bOut.write(ch);\n\
  23       }\n24 \n25       //\n26       // 加载 \"PGP SIGNATURE\" 块中的签名记录。\n27    \
  \   //\n28       JcaPGPObjectFactory pgpFact = new JcaPGPObjectFactory(aIn);\n29\
  \       PGPSignatureList p3 = (PGPSignatureList)pgpFact.nextObject();\n30      \
  \ PGPSignature sig = p3.get(0);\n31 \n32       if (publicKey.getKeyID() != sig.getKeyID())\n\
  33       {\n34           throw new PGPException(\"文档中的公钥不用于签名\");\n35       }\n\
  36 \n37       sig.init(\n38          new JcaPGPContentVerifierBuilderProvider().setProvider(\"\
  BC\"), publicKey);\n39 \n40       //\n41       // 读取输入，确保我们忽略了最后一个换行符。\n42     \
  \  //\n43       InputStream sigIn = new ByteArrayInputStream(bOut.toByteArray());\n\
  44 \n45       processInput(sig, sigIn);\n46 \n47       if (sig.verify())\n48   \
  \    {\n49           msgOut.write(bOut.toByteArray());\n50           msgOut.flush();\n\
  51 \n52           return true;\n53       }\n54 \n55       return false;\n56   }\n\
  ```\n\n你可以在第 32 行看到签名中的密钥 ID 会与提供的公钥进行校验。为了示例的简单起见，我们假设已经知道该密钥，因为只有当你解析了与明文签名文档相关的签名块时，才能确定使用了哪个密钥来生成签名。如你所见，签名中存储了密钥\
  \ ID，因此对该方法的简单修改是传递一个适当授权的公钥表。\n\n除了需要公钥之外，使用 `verifyCleartextSignature()` 实际上只需要一个\
  \ `OutputStream` 来存储签名数据。下面的代码片段演示了如何使用 `verifyCleartextSignature()` 方法：\n\n```java\n\
  \ ByteArrayOutputStream msgOut = new ByteArrayOutputStream();\n\n      if (verifyCleartextSignature(\n\
  \              dsaKeyPair.getPublicKey(),\n              new ByteArrayInputStream(sigOut.toByteArray()),\n\
  \              msgOut))\n      {\n          System.out.println(Strings.fromByteArray(msgOut.toByteArray()));\n\
  \      }\n      else\n      {\n          System.out.println(\"消息验证失败\");\n     \
  \ }\n```\n\n假设一切进展顺利，如果你将它与之前的文档创建片段一起运行，你应该会看到以下输出。\n\n```\nHello, world!\n```\n\
  \n当然，在“现实世界”中，事情可能并不计划进行。假设公钥是正确的且其他一切看起来都是正确的，可能仅仅是因为你正在处理一个遗留应用程序。在这种情况下，值得检查发送端和你的应用程序对所使用的规范一化方法是否达成一致（假设公钥与签名匹配且其他一切看起来正常）。虽然\
  \ RFC 4880 记录了应该采取的标准方法，但遗留应用程序生成签名时，末尾空格或换行符有时会被包含在签名中，这并不罕见。有时需要进行微调才能使其正常工作。\n\
  \n### 公钥加密\n\n使用 PGP 的公钥加密遵循通常模式：为对称算法生成会话密钥，然后使用会话密钥加密数据，并使用接收者的公钥加密会话密钥。随后将加密的会话密钥和加密数据发送给接收者，然后使用接收者的私钥恢复原始明文。\n\
  \n这里有一个执行公钥加密的方法。请阅读一遍，然后我们将逐步进行分析。\n\n```java\n 1   /**\n 2    * 使用 AES-256 会话密钥和传入的\n\
  \ 3    * 公钥创建一个加密数据数据块。\n 4    *\n 5    * @param encryptionKey 要使用的公钥。\n 6    *\
  \ @param data 要加密的数据。\n 7    * @return 加密数据的 PGP 二进制编码版本。\n 8    */\n 9   public\
  \ static byte[] createEncryptedData(\n10       PGPPublicKey encryptionKey,\n11 \
  \      byte[] data)\n12       throws PGPException, IOException\n13   {\n14     \
  \  PGPEncryptedDataGenerator encGen = new PGPEncryptedDataGenerator(\n15       \
  \    JceDataEncryptorBuilder(SymmetricKeyTags.AES_256)\n16               .setIntegrityPacket(true)\n\
  17               .setRandom(new SecureRandom()).setProvider(\"BC\"));\n18 \n19 \
  \      encGen.addMethod(\n20           new JcePublicKeyEncryptionGenerator(encryptionKey)\n\
  21               .setProvider(\"BC\"));\n22 \n23       ByteArrayOutputStream encOut\
  \ = new ByteArrayOutputStream();\n24 \n25       // 创建无限长度加密流\n26       OutputStream\
  \ cOut = encGen.open(encOut, new byte[4096]);\n27 \n28       // 写入字面数据\n29     \
  \  PGPLiteralDataGenerator lData = new PGPLiteralDataGenerator();\n30       OutputStream\
  \ pOut = lData.open(cOut, PGPLiteralData.BINARY,\n31           CONSOLE, data.length,\
  \ new Date());\n32       pOut.write(data);\n33       pOut.close();\n34 \n35    \
  \   // 完成加密\n36       cOut.close();\n37 \n38       return encOut.toByteArray();\n\
  39   }\n```\n\n该代码遵循几个简单的步骤：设置 `PGPEncryptedDataGenerator`，包括添加用于加密会话密钥的方法。接下来写入数据，最后完成。\n\
  \n`PGPEncryptedDataGenerator` 的设置涵盖了第 14 到 21 行。第一部分（从 14 到 17 行）指定了用于加密我们要处理数据的对称密钥算法，并指定了使用完整性包。完整性包在\
  \ RFC 4880 的第 5.13 节中有详细讨论，但简短描述是指定 true 会在加密数据流末尾添加一个 SHA-1 哈希值。通常情况下，如果可以，你会希望使用完整性包，特别是当数据没有被签名时。\n\
  \n`PGPEncryptedDataGenerator` 设置的第二部分是第 19 到 21 行——对 `addMethod()` 函数的调用。你可能认为这看起来与\
  \ CMS 中看到的添加的接收者信息非常相似，你的想法是。\n\n\n\n\n实际加密数据的步骤位于第 26 行到第 37 行之间。调用 `encGen.open()`\
  \ 用于初始化一个流，该流将加密我们写入它的任何数据 - 在情况下，它接收一个大小为 `4096`(22) 的缓冲区，用于确定无限长度加密流的内部块大小。在第\
  \ 29 行到 34 行，由于我们关注的是 PGP 协议，我们构建了一个字面数据对象（literal data object），并将数据写入其中。最后在第 37\
  \ 行，通过关闭所有内容结束结束，并返回加密数据消息的编码。\n\n解密结果数据遵循我们在 `CMSEncryptedData` 中看到的相同模式。识别与你想要使用的密钥匹配的接收者，然后读取数据，或者在这种情况下，读取封装数据的\
  \ `Literal Data` 结构。\n\n以下代码提供了一个如何使用接收者私钥从 PGP 加密数据恢复明文的示例。\n\n```java\n 1   /**\n\
  \ 2    * 从传入的 PGP 加密数据编码中提取明文数据。\n 3    * 程序假设传入的私钥与编码中的第一个 \n 4    * 加密数据对象匹配。\n\
  \ 5    *\n 6    *\n 7    * @param privateKey 用于解密会话密钥的私钥。\n 8    * @param pgpEncryptedData\
  \ PGP 加密数据的编码。\n 9    * @return 返回一个包含解密后数据的字节数组。\n10    */\n 11   public static\
  \ byte[] extractPlainTextData(\n 12       PGPPrivateKey privateKey,\n 13       byte[]\
  \ pgpEncryptedData)\n 14       throws PGPException, IOException\n 15   {\n 16  \
  \     PGPObjectFactory pgpFact = new JcaPGPObjectFactory(pgpEncryptedData);\n 17\
  \ \n 18       PGPEncryptedDataList encList = (PGPEncryptedDataList)pgpFact.nextObject();\n\
  \ 19 \n 20       // 寻找匹配的公钥加密数据包。\n 21       PGPPublicKeyEncryptedData encData =\
  \ null;\n 22       for (PGPEncryptedData pgpEnc: encList)\n 23       {\n 24    \
  \       PGPPublicKeyEncryptedData pkEnc\n 25               = (PGPPublicKeyEncryptedData)pgpEnc;\n\
  \ 26           if (pkEnc.getKeyID() == privateKey.getKeyID())\n 27           {\n\
  \ 28               encData = pkEnc;\n 29               break;\n 30           }\n\
  \ 31       }\n 32 \n 33       if (encData == null)\n 34       {\n 35           throw\
  \ new IllegalStateException(\"未找到匹配的加密数据\");\n 36       }\n 37 \n 38       // 构建解密器工厂\n\
  \ 39       PublicKeyDataDecryptorFactory dataDecryptorFactory =\n 40           new\
  \ JcePublicKeyDataDecryptorFactoryBuilder()\n 41               .setProvider(\"BC\"\
  )\n 42               .build(privateKey);\n 43 \n 44       InputStream clear = encData.getDataStream(dataDecryptorFactory);\n\
  \ 45       byte[] literalData = Streams.readAll(clear);\n 46       clear.close();\n\
  \ 47 \n 48       // 检查解密是否正常\n 49       if (encData.verify())\n 50       {\n 51\
  \           // 解析字面数据\n 52           PGPObjectFactory litFact = new JcaPGPObjectFactory(literalData);\n\
  \ 53           PGPLiteralData litData = (PGPLiteralData)litFact.nextObject();\n\
  \ 54           byte[] data = Streams.readAll(litData.getInputStream());\n 55   \
  \        return data;\n 56       }\n 57       throw new IllegalStateException(\"\
  完整性检查失败\");\n 58   }\n```\n\n与签名一样，我们使用 PGP 密钥 ID 来匹配持有封装会话密钥的加密块与我们拥有的私钥。注意迭代循环有一个类型为\
  \ `PGPEncryptedData` 的循环变量。我们在这里不能使用 `PGPPublicKeyEncryptedData`，因为还有一种用于基于 PBE\
  \ 密钥的类型，我们将在下一节中查看。\n\n`extractPlainTextData()` 的第 49 行是检查检查完整性包以确认加密数据未被篡改的地方。一旦我们确认没有明显的篡改，就可以安全地解析\
  \ `LiteralData` 结构并将封装的数据返回给用户。如果 `encData.verify()` 语句返回 `false`，我们就知道出了问题并抛出异常。请记住，由于\
  \ Bouncy Castle PGP API 是流式 API，且完整性包位于流的末尾，因此 `encData.verify()` 方法只能在加密数据被完全处理后才能调用。如果你过早调用\
  \ `verify()`，该方法将在内部为为你读取流，如果你计划自己处理数据，这可能不是你想要的结果！\n\n如果你正在处理可能没有完整性保护包的 PGP 加密数据，可以调用布尔方法\
  \ `PGPEncryptedData.isIntegrityProtected()` 来告知你检查是否可行。如果你对未完整性保护的加密数据调用 `PGPEncryptedData.verify()`，API\
  \ 将假设最坏的情况并抛出异常。\n\n### 使用 Elgamal 公钥\n\nPGP 支持多种公钥算法。最旧的算法是 RSA 和 Elgamal，它们都使用\
  \ PKCS#1 编码来封装对称密钥(22)。以下代码片段展示了如何使用 Elgamal。\n\n```\n byte[] msg = Strings.toByteArray(\"\
  Hello, world!\");\n\n      KeyPairGenerator kpGen = KeyPairGenerator.getInstance(\"\
  DH\");\n      kpGen.initialize(2048);\n\n      KeyPair kp = kpGen.generateKeyPair();\n\
  \n      PGPKeyPair elgKp = new JcaPGPKeyPair(PGPPublicKey.ELGAMAL,CRYPT, kp, new\
  \ Date());\n\n      byte[] encData = createEncryptedData(elgKp.getPublicKey(), msg);\n\
  \n      byte[] decData = extractPlainTextData(elgKp.getPrivateKey(), encData);\n\
  ```\n\n### 使用 ECDH 公钥\n\n虽然 RFC 4880 没有谈论椭曲线加密，但更新后的 RFC 6637 (6) 提供了使用椭曲线的公钥加密。如你预期的，这是基于\
  \ Diffie-Hellman 的，但与 CMS 不同，它不需要特殊的接收者，PGP 协议允许。支持 EC 的新代码片段。\n\n```java\n byte[]\
  \ msg = Strings.toByteArray(\"Hello, world!\");\n\n      KeyPairGenerator kpGen\
  \ = KeyPairGenerator.getInstance(\"EC\", \"BC\");\n      kpGen.initialize(new ECParameterSpec(\"\
  P-256\"));\n\n      KeyPair kp = kpGen.generateKeyPair();\n\n      PGPKeyPair ecdhKp\
  \ = new JcaPGPKeyPair(PGPPublicKey.ECDH, kp, new Date());\n\n      byte[] encData\
  \ = createEncryptedData(ecdhKp.getPublicKey(), msg);\n\n      byte[] decData = extractPlainTextData(ecdhKp.getPrivateKey(),\
  \ encData);\n\n      System.out.println(Strings.fromByteArray(decData));\n```\n\n\
  你可以看到，唯一的改变在于 `KeyPairGenerator` 的创建以及加密步骤中指定的算法。如果你想在上述方法中使用 RSA，只需将“DH” 替换为“RSA”，并使用\
  \ `PublicKey.RSA_CRYPT` 代替 `PGPPublicKey.ELGAMAL_CRYPT`。输出如下：\n\n```\nHello, world!\n\
  ```\n\n### 关于公钥加密的最后说明\n\n只有一个 `PGPEncryptedData` 对象的公钥加密消息实际上很少见。通常有两个密钥，因为发送者经常也会加密消息以便以后解密。\n\
  \n### PBE 加密\n\nPGP 还通过使用与公钥加密不同的加密对象支持基于密码的加密。Bouncy Castle 通过 `JcePBEKeyMethodGenerator`\
  \ 支持 PBE 方法，它在构造函数中接收密码，并在内部完成封装会话密钥的工作。\n\n\n\n以下方法展示了 `JcePBEKeyEncryptionMethodGenerator`\
  \ 的用法。在阅读代码时你会注意到，虽然字面数据的处理方式不同，但只有添加到 `PGPEncryptedDataGenerator` 中的方法与我们之前看到的公钥方法示例有所不同。建立所使用的数据加密器和会话密钥的代码是相同的。代码代码：\n\
  \n```java\n/**\n   * 使用基于 PBE 的密钥封装的 AES-256 密钥创建一个加密数据点点（data blob）。\n   *\n  \
  \ * @param passwd 用于生成基于 PBE 密钥的密码。\n   * @param data 要加密的数据。\n   * @return 加密数据的\
  \ PGP 二进制编码版本。\n   */\n  public static byte[] createPBEEncryptedData(\n      char[]\
  \ passwd,\n      byte[] data)\n      throws PGPException, IOException\n  {\n   \
  \   // 创建包含明文的封包。\n      ByteArrayOutputStream bOut = new ByteArrayOutputStream();\n\
  \n      PGPLiteralDataGenerator lData = new PGPLiteralDataGenerator();\n      OutputStream\
  \ pOut = lData.open(\n          bOut, PGPLiteralData.BINARY, PGPLiteralData.CONSOLE,\n\
  \          data.length, new Date());\n      pOut.write(data);\n      pOut.close();\n\
  \n      byte[] plainText = bOut.toByteArray();\n\n      // 设置生成器\n      PGPEncryptedDataGenerator\
  \ encGen = new PGPEncryptedDataGenerator(\n          new JcePGPDataEncryptorBuilder(SymmetricKeyAlgorithmTags.AES_256)\n\
  \              .setWithIntegrityPacket(true)\n              .setSecureRandom(new\
  \ SecureRandom())\n              .setProvider(\"BC\"));\n      encGen.addMethod(\n\
  \          new JcePBEKeyEncryptionMethodGenerator(passwd).setProvider(\"BC\"));\n\
  \n      // 加密步骤。\n      ByteArrayOutputStream encOut = new ByteArrayOutputStream();\n\
  \n      OutputStream cOut = encGen.open(encOut, plainText.length);\n      cOut.write(plainText);\n\
  \      cOut.close();\n\n      return encOut.toByteArray();\n  }\n```\n\n注意，传入 `JcePBEKeyEncryptionMethodGenerator`\
  \ 的唯一内容是密码，在这种情况下，这意味着密码将使用基于 `SHA-1` 的算法转换为密钥。也可以通过向构造函数传递一个 `PGPDigestCalculator`\
  \ 来指定用于转换密码的算法。\n\n字面数据处理上的区别是为了展示如何创建一个固定长度的加密对象，而不是我们之前使用的无限长度对象。预计算明文允许我们使用 `open()`\
  \ 方法，该方法接收的是长度而非缓冲区（buffer）。当然，我们本也可以使用无限长度版本的 `open()` 方法。同样，在之前的公钥示例中，我们也可以使用定义长度的方法。\n\
  \n在提取代码案例中，我们需要识别 `PGPEncryptedData` 的一个不同子类，即基于 PBE 的数据类型——`PGPPBEEncryptedData`。该类型没有关联的\
  \ ID，因此如果你需要在同一段代码中处理公钥加密数据和 PBE 加密数据，将需要依赖 `instanceof` 来区分它们。\n\n以下是处理基于 PBE 的解密代码。\n\
  \n```java\n/**\n   * 从传入的 PGP 加密数据编码中提取明文数据。\n   * 该程序假设密码与编码中的第一个加密数据对象匹配。\n  \
  \ *\n   * @param passwd 用于生成基于 PBE 密钥的密码。\n   * @param pgpEncryptedData PGP 加密数据的编码。\n\
  \   * @return 包含解密数据的字节数组。\n   */\n  public static byte[] extractPlainTextPBEData(\n\
  \      char[] passwd,\n      byte[] pgpEncryptedData)\n      throws PGPException,\
  \ IOException\n  {\n      PGPEncryptedDataList encList = new PGPEncryptedDataList(pgpEncryptedData);\n\
  \n      // 假设 PBE 加密数据在第一个。\n      PGPPBEEncryptedData encData = (PGPPBEEncryptedData)encList.get(0);\n\
  \      PBEDataDecryptorFactory dataDecryptorFactory =\n          new JcePBEDataDecryptorFactoryBuilder()\n\
  \              .setProvider(\"BC\")\n              .build(passwd);\n\n      InputStream\
  \ clear = encData.getDataStream(dataDecryptorFactory);\n      byte[] literalData\
  \ = Streams.readAll(clear);\n      clear.close();\n\n      // 检查解密是否正常\n      if\
  \ (encData.verify())\n      {\n          PGPLiteralData litData = new PGPLiteralData(literalData);\n\
  \          return Streams.readAll(litData.getInputStream());\n      }\n      throw\
  \ new IllegalStateException(\"modification failed\");\n  }\n```\n\n注意，我们假设 `PGPPBEEncryptedData`\
  \ 对象是 `PGPEncryptedDataList` 中的第一个。`JcePBEDataDecryptorBuilder` 在构造时可以传递摘要计算器，以便仅对指定的\
  \ provider 用于加密。\n\n以下示例代码将测试 PBE 加密器和解密器。\n\n```java\nbyte[] msg = Strings.toByteArray(\"\
  Hello, PBE world!\");\nchar[] password = \"secret\".toCharArray();\n\nbyte[] encData\
  \ = createPBEEncryptedData(password, msg);\n\nbyte[] decData = extractPlainTextPBEData(password,\
  \ encData);\n\nSystem.out.println(Strings.fromByteArray(decData));\n```\n\n运行后应产生以下输出：\n\
  \n```\nHello, PBE world!\n```\n\n### Keybox 文件\n\nKeybox 文件是在 GnuPG 2.1 中引入的，主要为了解决在\
  \ `pubring.gpg` 中存储大量公钥时出现的性能问题。在使用 Keybox 文件的地方，你会发现是 `pubring.kbx` 文件而不是旧式的 `pubring.gpg`。\n\
  \n#### Keybox Blob\n\nKeybox 文件将公钥数据作为一系列带有关联元数据的块（blob）存储。正是元数据允许了更快的解析。对于我们的用途，最有趣的\
  \ blob 通常包含两种格式的公钥数据：作为 X.509 证书的公钥数据或原始 PGP 编码格式的公钥数据。有 4 种 blob 类型：Empty blob、First\
  \ blob、Open-PGP blob 和 X.509 blob。Empty blob 是预期的无数据 blob。First blob 是 Keybox 文件中的第一个\
  \ blob，包含头和版本信息。Open-PGP blob 包含一个 PGP 编码公钥环及其相关的元数据，而 X.509 blob 包含一个 X.509 公钥证书及其相关的元数据。在\
  \ Bouncy Castle API 中，后两者分别由 `CertificateBlob` 和 `PublicKeyRingBlob` 表示，并共享共同基类\
  \ `KeyBlob`，该基类提供了相应 blob 中元数据的访问方法。\n\n#### 加载 Keybox 文件\n\n你可以将 Keybox 文件视为 blob\
  \ 列表，一个从该文件加载所有密钥数据的示例方法如下：\n\n\n\n\n\n```java\n 1   /**\n 2* 加载 KeyBox 文件中所有的密钥环和证书。\n\
  \    *\n    * @param keyBox 要加载的 KeyBox。\n    * @return 在密钥 框中找到的 PGP 公钥环和 X.509\
  \ 证书的\n    *         列表。\n     */\n   public static List<Object> loadKeyBoxKeys(KeyBox\
  \ keyBox)\n       throws Exception\n   {\n       List<Object> publicObjects = new\
  \ ArrayList<Object>();\n\n       for (KeyBlob keyBlob : keyBox.getKeyBlobs())\n\
  \       {\n           switch (keyBlob.getType())\n           {\n           case\
  \ X509_BLOB:\n               {\n               byte[] certData = ((CertificateBlob)keyBlob).getEncodedCertificate();\n\
  \               CertificateFactory factory = CertificateFactory.getInstance(\"X509\"\
  );\n               publicObjects.add(factory.generateCertificate(\n            \
  \                                   new ByteArrayInputStream(certData)));\n    \
  \           }\n               break;\n           case OPEN_PGP_BLOB:\n         \
  \      publicObjects.add(((PublicKeyRingBlob)keyBlob).getPGPPublicKeyRing());\n\
  \               break;\n           default:\n               throw new IllegalStateException(\n\
  \                             \"Unexpected blob type: \" + keyBlob.getType());\n\
  \           }\n       }\n\n       return publicObjects;\n   }\n```\n\n创建实际的 `KeyBox`\
  \ 对象是通过构建器（builder）完成的 - 因为解析公钥信息需要使用加密服务，你可能希望指定一个特定的提供者。在向构建器指定提供者后，你可以通过如下提供字节编码（或\
  \ `InputStream`）来生成 `KeyBox`：\n\n```\n KeyBox kbx = new JcaKeyBoxBuilder().setProvider(\"\
  BC\").build(kbxData);\n```\n\n其中 `kbxData` 是包含密钥框编码的 `byte[]` 或 `InputStream`。\n\
  \n一旦完成上述操作，你就可以像这样将密钥块作为对象列表进行检索了：\n\n```\n List<Object> kbxObjs = loadKeyBoxKeys(kbx);\n\
  ```\n\n请记住，如果你正在编写解析 `.kbx` 文件的代码，如果需要，你可以跳过某些 blob 而不对其进行完全解析。因此，如果你需要处理大量的 blob，通过跳过流并利用每个\
  \ `KeyBlob` 上的元数据来选择正确的 blob 然后再扫描数据，将会要快得多。\n\n### 使用 S 表达式处理私钥\n\n除了使用 `.kbx`\
  \ 文件外，GnuPG 还引入了使用 S 表达式来存储私钥，作为旧版 `secring.gpg` 文件中使用 PGP 编码的替代方案。顾名，S 表达式是 Lisp\
  \ S 表达式的变体，最初由 Ron Rivest 和 Butler Lampson 等人在麻理工学院（MIT）在 20 世纪 90 年代后期提出的密钥编码 [9]。该格式的细节见《Libgcrypt\
  \ 参考手册》的第 6.2 节 [10]，并在 `keyformat.txt` 文件中还有一些额外信息 [11]。\n\n一个简单的总结是，S 表达式编码密钥中的值字段遵循以下编码格式：`length:value_bytes`。结构可以通过在左、右括号中包含字段的连接来构建。长度字段是\
  \ ascii 格式（例如，字符串 `ecc` 被编码为 `3:ecc`），但 `value_bytes` 可以是二进制数据，因此使用 S 表达式语法编码的 PGP\
  \ 密钥在文本编辑器中无法完全可读，特别是在加密的情况下。\n\nBouncy Castle 现在提供了一个用于读取这些文件的解析器 `SExprParser`。该类在构造时需要一个\
  \ `PGPDigestCalculatorProviderBuilder`，因为某些密钥在写入 S 表达式时包含了密钥的消息摘要（message digest）。其使用方法非常简单，因为每个文件只能包含一个密钥。以下是调用解析器的示例：\n\
  \n```\n PGPSecretKey secretKey = new SExprParser(\n          new JcaPGPDigestCalculatorProviderBuilder().build()).parseSecretKey(\n\
  \                      inputStream,\n                      new JcePBEProtectionRemoverFactory(\"\
  test\".toCharArray()),\n                      new JcaKeyFingerprintCalculator());\n\
  ```\n\n某些方法参数的需要是显而易见的，`inputStream` 是一个包含加密私钥的流，而在构建 `PGPSecretKey` 对象时，需要 `JcaFingerPrintCalculator`\
  \ 来计算密钥的指纹。新类 `JcePBEProtectionRemoverFactory` 是必需的，因为与旧的 PGP 私钥编码不同，S 表达式通常将 PGP\
  \ 私钥存储为加密 blob，因此需要密码来解密 PGP 私钥。通常这意味着 PGP 私钥携带的 `PGPPrivateKey` 可以被提取出来，而无需使用 `PBESecretKeyDecryptor`，因此可以传递\
  \ `null`，如下所示：\n\n```\n PGPPrivateKey privateKey = secretKey.extractPrivateKey(null);\n\
  ```\n\n### 总结\n\n在本章中，我们检查了另一种在互联网上广泛使用的加密协议 - OpenPGP。\n\n我们看到 OpenPGP 在许多方面与……相似，我们看到\
  \ GnuPG 的最新进展为引入 `.kbx` 文件格式提供了一些范围。\n\n## 第 14 章：传输层安全 (Transport Layer Security)\n\
  \n## 引言\n\n本章是关于如何使用 Bouncy Castle TLS API 和 JSSE 提供者的指南。JSSE 提供者遵循与 JCA 类似的模型。TLS\
  \ API 了一种了一种使用协议的底层机制，这比 JSSE 提供的更灵活，但对开发者的知识要求更高。该提供者构建在 TLS API 之上。\n\n### 安装\n\
  \nbctls jar 可以安装在 JRE/JDK 的 `jre/lib/ext` 中，或者在许多情况下，安装在运行程序的通用类路径上。如果你将 bctls jar\
  \ 安装在类路径上，请注意，取决于应用程序其他地方加载 JSSE 提供元素元素，系统类加载器可能无法使用 bctls jar 中的类而产生异常。\n\n####\
  \ 安装 BCJSSE 提供者到 JRE\n\n一旦安装了 bctls jar，如果应用程序全局需要，可能需要安装 `BouncyCastleJsseProvider`\
  \ 类。可以通过静态方式在 JVM 中安装提供者，将其添加到 JRE/JDK `jre/lib/security` 目录下的 `java.security` 文件中。提供者也可以在执行期间添加。如果你希望在执行期间全局地添加提供者，可以在代码中添加以下导入：\n\
  \n```\nimport java.security.Security\nimport org.bouncycastle.jsse.provider.BouncyCastleJsseProvider\n\
  ```\n\n然后插入行：\n\n```\nSecurity.addProvider(new BouncyCastleJsseProvider());\n```\n\
  \n随后可以通过引用 `BCJSSE` 名称来使用该提供者，例如：\n\n```\nSSLContext clientContext = SSLContext.getInstance(\"\
  TLS\", \"BCJSSE\");\n```\n\n或者，如果你不想全局安装提供者，而是在本地使用，可以将提供者传递给你正在创建实例的 JSSE 类的 `getInstance()`\
  \ 方法。例如：\n\n```\nSSLContext clientContext = \n\tSSLContext.getInstance(\"TLS\",\
  \ new BouncyCastleJsseProvider());\n```\n\n#### 在 FIPS 模式下配置 BCJSSE 提供者\n\n\n\n\n\
  \n`BCJSSE` 提供者具有 `FIPS` 模式，该模式限制提供者仅使用符合 `FIPS` 标准的 TLS 客户端或服务器设置中提供的密码套件和参数。`FIPS`\
  \ 模式通过向 `BouncyCastleJsseProvider` 类的构造函数传递字符串 `\"fips:<provider>\"` 来指定，可以在运行时通过\
  \ `JVM` 的 `java.security` 文件设置。`<provider>` 的可用值包括 `\"default\"`，表示将根据 `JVM` 的提供者优先级列表使用提供者。可以使用提供者名称，例如\
  \ `\"BC\"`，或者如果你在使用 Bouncy Castle FIPS 提供者，则可以使用 `\"BCFIPS\"`。当使用特定的提供者名称时，执行加密操作时，`BCJSSE`\
  \ 提供者仅接受来自该提供者的算法。\n\n例如，如果我们想使用 `BCFIPS` 提供者，并使用设置为 `FIPS` 模式的 `BCJSSE` 提供者，而不是仅仅在\
  \ `JVM` 的 `java.security` 文件的 `security.provider` 部分中包含以下内容：\n\n```\nsecurity.provider.1=org.bouncycastle.jcajce.provider.BouncyCastleFipsProvider\n\
  security.provider.2=org.bouncycastle.jsse.provider.BouncyCastleJsseProvider\nsecurity.provider.3=sun.security.provider.Sun\n\
  ```\n\n相反，最少安装还需要在第二行末尾包含 `\"fips:BCFIPS\"` 声明：\n\n```\nsecurity.provider.2=org...provider.BouncyCastleJsseProvider\
  \ fips:BCFIPS\n```\n\n在运行时，可以使用以下实现类似的配置：\n\n```\nSecurity.addProvider(new BouncyCastleJsseProvider(\"\
  fips:BCFIPS\"));\n```\n\n### BCJSSE 和 JSSE 提供者之间的其他差异\n\n`BCJSSE` 提供者产生的 `TrustManager`\
  \ 对象将忽略传递到其工厂的任何 `KeyStores` 中的私钥。只有 `KeyStore` 中的简单证书条目会被用于创建 `TrustManager`。`BCJSSE`\
  \ 在非 `FIPS` 模式下也支持 `ChaCha20` 和 `Poly1305`。`BCFIPS` 提供者从 `1.0.2` 版本开始支持该密码套件。\n\n\
  后续有一份安全属性列表，对于普通的 `JSSE`，如果属性不存在，它们通常被视为未设置。由于 `BCJSSE` 运行在各种 `JVMs` 上，如果 `BCJSSE`\
  \ 处理的属性未设置，它通常会根据最新 `JVM` 中使用的内容提供默认设置。\n\n### 约定\n\n#### `getDefault()` 的使用\n\n\
  如 `SSLSocketFactory.getDefault()` 等方法只有在 `BCJSSE` 提供者优先或替换了普通的 `JRE` `JSSE` 提供者时，才会返回后者的类。\n\
  \n#### 实例名称\n\n核心 `KeyManagerFactory` 的实例名称为 `\"X.509\"`，别名为 `\"X509\"` 和 `\"PKIX\"\
  `。核心 `TrustManagerFactory` 的实例名称为 `\"PKIX\"`，别名为 `\"X.509\"` 和 `\"X509\"`。`SSLContext`\
  \ 实例适用于 `\"TLSv1\"`、`\"TLSv1.1\"` 和 `\"TLSv1.2\"`。在每情况下，实例名称代表支持的最低 TLS 版本，并且也支持更高版本。`SSLContext`\
  \ 实例名称 `\"TLS\"` 和 `\"DEFAULT\"` 提供对 `\"TLSv1.2\"` 的支持。\n\n### 准备工作 - 简单协议\n\nTLS\
  \ 显然不是目的本身。总是假设在其上有内容正在通信。以下类提供了一个简单的协议，我们的示例可以使用该协议，其中消息以 `'!'` 字符结束。\n\n```java\n\
  \ 1 /**\n2  * 用于执行的简单协议。\n3  */\n4 public class Protocol\n5 {\n6     private static\
  \ Logger LOG = Logger.getLogger(Protocol.class.getName());\n7 \n8     /**\n9   \
  \   * 执行 '!' 协议 - 客户端侧。\n10      */\n11     static void doClientSide(\n12      \
  \   Socket cSock)\n13         throws IOException\n14     {\n15         OutputStream\
  \ out = cSock.getOutputStream();\n16         InputStream in = cSock.getInputStream();\n\
  17         out.write(Strings.toByteArray(\"world\"));\n18         out.write('!');\n\
  19         int ch = 0;\n20         while ((ch = in.read()) != '!')\n21         {\n\
  22             System.out.print((char)ch);\n23         }\n24         System.out.println((char)ch);\n\
  25     }\n26 \n27     /**\n28      * 执行 '!' 协议 - 服务端侧。\n29      */\n30     static\
  \ void doServerSide(\n31         Socket sSock)\n32         throws IOException\n\
  33     {\n34         LOG.log(Level.INFO, \"session started.\");\n35         InputStream\
  \ in = sSock.getInputStream();\n36         OutputStream out = sSock.getOutputStream();\n\
  37         out.write(Strings.toByteArray(\"Hello, \"));\n38         int ch = 0;\n\
  39         while ((ch = in.read()) != '!')\n40         {\n41             out.write(ch);\n\
  42         }\n43         out.write('!');\n44         sSock.close();\n45        \
  \ LOG.log(Level.INFO, \"session closed.\");\n46 }\n47 }\n```\n\n你可以看到该协议是双向的，客户端连接并发送消息，然后读取服务器发送的内容并将其打印到标准输出。在初始消息后，服务器方法回显它收到的内容，直到收到\
  \ `'!'`，然后发送自己的终止 `'!'`。客户端方法发送消息的半部分，然后读取回显内容直到也收到 `'!'` 并退出。这足以证明连接已经发生。\n\n###\
  \ 基础 TLS 服务器\n\n基础服务器只需要一个 `KeyManager` 来标识身份。实际的 `KeyManager` 然后通过 `KeyManagerFactory`\
  \ 创建，该工厂使用服务器的密钥库和密钥库密码初始化。\n\n```java\n public static final int PORT_NO = 9090;\n\
  \  public static final char[] ID_STORE_PASSWORD = \"passwd\".toCharArray();\n```\n\
  \n```java\n /**\n   * 创建一个包含单个自签名证书密钥的密钥库。\n   *\n   * @return 包含单个自签名证书密钥的密钥库。\n\
  \   */\n  public static KeyStore createIdentityKeyStore()\n      throws Exception\n\
  \  {\n      PrivateCredential cred = createSelfSignedCredentials();\n\n      KeyStore\
  \ store = KeyStore.getInstance(\"JKS\");\n\n      store.load(null, null);\n\n  \
  \    store.setKeyEntry(\"identity\", cred.getPrivateKey(), ID_STORE_PASSWORD,\n\
  \                                  new Certificate[]{cred.getCertificate()});\n\n\
  \      return store;\n  }\n```\n\n注意：在这种情况下，我们假设 `BC` 和 `BCJSSE` 提供者刚刚被添加到提供者列表中\
  \ - 没有尝试替换普通的 `JSSE` 提供者，因此 `SSLSocketFactory.getDefault()` 仍然指向普通的 `JSSE` 提供者。\n\
  \n\n\n\n\n```java\n /**\n  * 基础 TLS 服务端 - 使用 '!' 协议。\n   */\npublic class BasicTLSServer\n\
  {\n    private static Logger LOG = Logger.getLogger(BasicTLSServer.class.getName());\n\
  \n    private final CountDownLatch readyLatch = new CountDownLatch(1);\n\n    private\
  \ final KeyStore serverStore;\n    private final char[] passwd;\n\n    /**\n   \
  \  * 基础服务器构造函数。\n     *\n     * @param serverStore 服务器的公钥/私钥。\n     * @param passwd\
  \ 用于解锁 serverStore 中私钥的密码。\n     */\n    BasicTLSServer(KeyStore serverStore, char[]\
  \ passwd)\n    {\n        this.serverStore = serverStore;\n        this.passwd =\
  \ passwd;\n    }\n\n    /**\n     * 建立服务端 TLS 连接的任务。\n     */\n    public void start()\n\
  \        throws InterruptedException\n    {\n        new Thread(new ServerTask()).start();\n\
  \n        readyLatch.await();\n    }\n\n    /**\n     * 建立服务端 TLS 连接的任务任务。\n   \
  \  */\n    private class ServerTask\n        implements Runnable\n    {\n      \
  \  public void run()\n        {\n            try\n            {\n              \
  \  SSLContext sslContext = SSLContext.getInstance(\"TLS\", \"BCJSSE\");\n\n    \
  \            KeyManagerFactory keyMgrFact = KeyManagerFactory.getInstance(\n   \
  \                 \"PKIX\", \"BCJSSE\");\n                keyMgrFact.init(serverStore,\
  \ passwd);\n\n                sslContext.init(keyMgrFact.getKeyManagers(), null,\
  \ null);\n\n                SSLServerSocketFactory fact = sslContext.getServerSocketFactory();\n\
  \                SSLServerSocket sSock =\n                    (SSLServerSocket)fact.createServerSocket(PORT_NO);\n\
  \n                readyLatch.countDown();\n\n                SSLSocket sslSock =\
  \ (SSLSocket)sSock.accept();\n\n                Protocol.doServerSide(sslSock);\n\
  \            }\n            catch (Exception e)\n            {\n               \
  \ LOG.log(Level.SEVERE, \"server: \" + e.getMessage(), e);\n            }\n    \
  \    }\n    }\n}\n```\n\n你会注意到服务端在它的 `start()` 方法中使用了一个 `CountDownLatch`。这样做的原因是服务器需要在准备好接受连接之前，向\
  \ `start()` 的调用者信号其启动过程已完成。值得记住这个技巧——否则，编写依赖多线程来模拟客户端和服务器的测试将变得非常困难。\n\n### 基础 TLS\
  \ 客户端\n\n对于基础客户端，唯一的要求是它有某种识别服务器的方法。这是通过提供一个 `TrustManager` 来验证传入的凭据来实现。`TrustManager`\
  \ 是使用 `TrustManagerFactory` 创建的，该工厂已使用包含证书的密钥库初始化，这些证书用于验证服务器将提供的证书路径。在我们的案例中，我们可以如下所示从服务器密钥库创建一个合适的密钥库：\n\
  \n```java\n  /**\n   * 创建一个适用于信任存储的密钥库，仅包含与传入的\n   * 据 store 中每个别名相关的证书。\n   *\n\
  \   * @param credentialStore 包含公钥/私钥凭据的密钥库。\n   * @return 仅包含证书的密钥库。\n   */\n  public\
  \ static KeyStore createTrustStore(KeyStore credentialStore)\n      throws Exception\n\
  \  {\n      KeyStore store = KeyStore.getInstance(\"JKS\");\n\n      store.load(null,\
  \ null);\n\n      for (Enumeration<String> en = credentialStore.aliases(); en.hasMoreElements();)\n\
  \      {\n          String alias = en.nextElement();\n\n          store.setCertificateEntry(alias,\
  \ credentialStore.getCertificate(alias));\n      }\n\n      return store;\n  }\n\
  ```\n\n现在我们已经有了信任存储，需要创建一个客户端来配合使用。以下代码实现了一个 `Runnable`，它提供了一个 TLS 客户端，可以与服务端实现的\
  \ ‘!’ 协议工作。\n\n```java\n /**\n  * 基础 TLS 客户端 - 使用 '!' 协议。\n  */\npublic class BasicTLSClient\n\
  \    implements Runnable\n{\n    private static Logger LOG = Logger.getLogger(BasicTLSClient.class.getName());\n\
  \n    private final KeyStore trustStore;\n\n    /**\n     * 基础客户端构造函数。\n     *\n\
  \     * @param trustStore 我们愿意从服务器信任的证书。\n     */\n    public BasicTLSClient(KeyStore\
  \ trustStore)\n    {\n        this.trustStore = trustStore;\n    }\n\n    /**\n\
  \     * 建立服务端 TLS 连接的任务。\n     */\n    public void run()\n    {\n        try\n \
  \       {\n            SSLContext sslContext = SSLContext.getInstance(\"TLS\", \"\
  BCJSSE\");\n\n            TrustManagerFactory trustMgrFact = KeyManagerFactory.getInstance(\n\
  \                \"PKIX\", \"BCJSSE\");\n            trustMgrFact.init(trustStore);\n\
  \n            sslContext.init(null, trustMgrFact.getTrustManagers(), null);\n\n\
  \            SSLSocketFactory fact = sslContext.getSocketFactory();\n          \
  \  SSLSocket cSock = (SSLSocket)fact.createSocket(\"localhost\", PORT_NO);\n\n \
  \           Protocol.doClientSide(cSock);\n        }\n        catch (Exception e)\n\
  \        {\n            LOG.log(Level.SEVERE, \"client: \" + e.getMessage(), e);\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n```java\n /**\n * 带有客户端认证的 TLS 服务器 - 使用 '!'\
  \ 协议。\n */\npublic class TLSServerWithClientAuth\n{\n    private static Logger LOG\
  \ = Logger.getLogger(BasicTLSServer.class.getName());\n\n    private final CountDownLatch\
  \ readyLatch = new CountDownLatch(1);\n\n    private final KeyStore serverStore;\n\
  \    private final char[] passwd;\n    private final KeyStore trustStore;\n\n  \
  \  /**\n     * 基础服务器构造函数。\n     *\n     * @param serverStore 服务器的公钥/私钥。\n     *\
  \ @param passwd 解锁 serverStore 中私钥的密码。\n     * @param trustStore 用于验证任何提交证书的信任库。\n\
  \     */\n    public TLSServerWithClientAuth(\n        KeyStore serverStore, char[]\
  \ passwd, KeyStore trustStore)\n    {\n        this.serverStore = serverStore;\n\
  \        this.passwd = passwd;\n        this.trustStore = trustStore;\n    }\n\n\
  \    /**\n     * 启动服务器线程.\n     */\n    public void start()\n        throws InterruptedException\n\
  \    {\n        new Thread(new ServerTask()).start();\n\n        readyLatch.await();\n\
  \    }\n\n    /**\n     * 建立 TLS 连接服务器端的任务。\n     */\n    private class ServerTask\n\
  \        implements Runnable\n    {\n        public void run()\n        {\n    \
  \        try\n            {\n                SSLContext sslContext = SSLContext.getInstance(\"\
  TLS\", \"BCJSSE\");\n\n                KeyManagerFactory keyMgrFact =\n        \
  \                        KeyManagerFactory.getInstance(\"PKIX\", \"BCJSSE\");\n\
  \                keyMgrFact.init(serverStore, passwd);\n\n                TrustManagerFactory\
  \ trustMgrFact =\n                                TrustManagerFactory.getInstance(\"\
  PKIX\", \"BCJSSE\");\n                trustMgrFact.init(trustStore);\n\n       \
  \         sslContext.init(\n                    keyMgrFact.getKeyManagers(),\n \
  \                   trustMgrFact.getTrustManagers(), null);\n\n                //\
  \ 创建服务器套接并强制客户端认证。\n                SSLServerSocketFactory fact = sslContext.getServerSocketFactory();\n\
  \                SSLServerSocket sSock =\n                    (SSLServerSocket)fact.createServerSocket(PORT_NO);\n\
  \                sSock.setNeedClientAuth(true);\n\n                readyLatch.countDown();\n\
  \n                SSLSocket sslSock = (SSLSocket)sSock.accept();\n\n           \
  \     Protocol.doServerSide(sslSock);\n            }\n            catch (Exception\
  \ e)\n            {\n                LOG.log(Level.SEVERE, \"server: \" + e.getMessage(),\
  \ e);\n            }\n        }\n    }\n}\n```\n\n请注意，在这种情况下，我们调用了带有参数 `true` 的\
  \ `SSLServerSocket.setNeedClientAuth()`，这意味着服务器只会接受能够自身认证的客户端连接。\n\n### 带有客户端认证的\
  \ TLS 客户端\n\n正如服务器需要引入 `TrustManager` 来允许其识别客户端一样，客户端也需要向其 `SSLContext` 中添加 `KeyManager`\
  \ 以允许客户端向服务器标识自身。\n\n接下来的代码示例展示了一个能够向服务器认证的简单客户端。请注意，标识客户端证书路径的信任锚点也必须提供给为服务器创建的\
  \ `TrustManager`。\n\n```java\n /**\n * 带有客户端认证的 TLS 客户端 - 使用 '!' 协议。\n */\npublic\
  \ class TLSClientWithClientAuth\n    implements Runnable\n{\n    private static\
  \ Logger LOG = Logger.getLogger(BasicTLSClient.class.getName());\n\n    private\
  \ final KeyStore trustStore;\n    private final KeyStore clientStore;\n    private\
  \ final char[] passwd;\n\n    /**\n     * 带有认证的基础基础客户端。\n     *\n     * @param trustStore\
  \ 我们愿意从服务器信任的证书。\n     * @param clientStore 客户端的公钥/私钥。\n     * @param passwd 解锁\
  \ clientStore 中私钥的密码。\n     */\n    public TLSClientWithClientAuth(\n        KeyStore\
  \ trustStore, KeyStore clientStore, char[] passwd)\n    {\n        this.trustStore\
  \ = trustStore;\n        this.clientStore = clientStore;\n        this.passwd =\
  \ passwd;\n    }\n\n    /**\n     * 建立带有认证的 TLS 客户端的任务。\n     */\n    public void\
  \ run()\n    {\n        try\n        {\n            SSLContext sslContext = SSLContext.getInstance(\"\
  TLS\", \"BCJSSE\");\n\n            KeyManagerFactory keyMgrFact =\n            \
  \                KeyManagerFactory.getInstance(\"PKIX\", \"BCJSSE\");\n        \
  \    keyMgrFact.init(clientStore, passwd);\n\n            TrustManagerFactory trustMgrFact\
  \ =\n                            TrustManagerFactory.getInstance(\"PKIX\", \"BCJSSE\"\
  );\n            trustMgrFact.init(trustStore);\n\n            sslContext.init(\n\
  \                keyMgrFact.getKeyManagers(),\n                trustMgrFact.getTrustManagers(),\
  \ null);\n\n            SSLSocketFactory fact = sslContext.getSocketFactory();\n\
  \            SSLSocket cSock = (SSLSocket)fact.createSocket(\"localhost\", PORT_NO);\n\
  \n            Protocol.doClientSide(cSock);\n        }\n        catch (Exception\
  \ e)\n        {\n            LOG.log(Level.SEVERE, \"client: \" + e.getMessage(),\
  \ e);\n        }\n    }\n}\n```\n\n如示例所示，从客户端的角度来看，只需提供 `KeyManager` 就足够了。不需要为此进行额外的设置。\n\
  \n### 重新查看 TrustManagers\n\n在许多情况下，示例中服务器处理客户端验证的方式是不够的。通常客户端证书会分配在 CA 下，并且 CA 可能需要定期撤销某些证书。\n\
  \n为了让开发者对客户端验证有更多控制权，`TrustManagerFactory.init()` 方法也可以接受 `ManagerFactoryParameters`\
  \ 的实现。`ManagerFactoryParameters` 的实现实现之一是 `CertPathTrustParameters`，它允许提供一个 `PKIXParameters`\
  \ 对象，该对象将用于对信任管理器检查的任何提交证书进行路径验证。对于我们之前看到的带有客户端认证的简单服务器示例，通过以下片段替换 `TrustManagerFactory`\
  \ 的创建代码可以获得相同的结果：\n\n```java\n TrustManagerFactory trustMgrFact =\n            \
  \                  TrustManagerFactory.getInstance(\"PKIX\", \"BCJSSE\");\n\n  \
  \            PKIXParameters pkixParameters = new PKIXParameters(trustStore);\n\n\
  \              trustMgrFact.init(new CertPathTrustManagerParameters(pkixParameters));\n\
  ```\n\n内部，`PKIXParameters` 对象会将 `trustStore` 转换为一组信任锚点。在简单的示例中，我们不需要做更多，因为场景是围绕自签名证书构建的。在更通用的情况下，你可能还需要用\
  \ CA 证书初始化 `PKIXParameters` 对象，并可选地使用 CRL 或 `PKIXCertPathChecker` 来管理撤销。\n\n###\
  \ 属性\n\n属性 配置 JSSE 配置不断进化，因此属性列表经常更新。在编写期间此处是当前的列表，但值得查看 bouncycastle.org 网站上最新版本的“Java\
  \ (D)TLS API and JSSE Provider User Guide”中的附录 A 和附录 B。\n\n#### 安全属性\n\n某些常规 JVM\
  \ 安全属性也被 BCJSSE 提供使用。\n\n以下是目前支持的：\n\n**keystore.type**: 默认密钥库类型（通过 `java.security.KeyStore.getDefaultType()`）。\n\
  \n\n\n\n\n`keystore.type.compat`: 控制 JKS 和 PKCS12 密钥库类型的兼容模式。\n\n`jdk.certpath.disabledAlgorithms`:\
  \ 证书路径 (CertPath) 处理的算法限制。\n\n`jdk.tls.disabledAlgorithms`: TLS 处理的算法限制。\n\n`ssl.KeyManagerFactory.algorithm`:\
  \ 默认的密钥管理器工厂算法（通过 `javax.net.ssl.KeyManagerFactory.getDefaultAlgorithm()` 获取）。\n\
  \n`ssl.TrustManagerFactory.algorithm`: 默认的信任管理器工厂算法（通过 `javax.net.ssl.TrustManagerFactory.getDefaultAlgorithm()`\
  \ 获取）。\n\n### 标准系统属性\n\nBCJSSE 提供程序目前使用以下标准系统属性：\n\n`com.sun.net.ssl.checkRevocation`:\
  \ 用于 PKIX 信任管理器创建默认 PKIX 参数时启用吊销检查。\n\n`com.sun.net.ssl.requireCloseNotify`: 是否要求在连接关闭之前发送\
  \ `close_notify` 警告告报，这在 TLS 中有所规定但并不总是被正确实现。BCJSSE 使用默认值“true”。\n\n`java.home`:\
  \ Java 安装目录。\n\n`javax.net.ssl.keyStore`: 存储端点私钥的密钥库文件名称。用于在内部创建 `KeyManager`。\n\
  \n`javax.net.ssl.keyStorePassword`: 访问存储端点私钥的密钥库文件的密码。\n\n`javax.net.ssl.keyStoreType`:\
  \ 存储端点私钥的密钥库文件类型。\n\n`javax.net.ssl.keyStoreProvider`: 为 `javax.net.ssl.keyStore`\
  \ 属性指定的密钥库提供实现支持的程序名称。\n\n`javax.net.ssl.sessionCacheSize`: 配置会话上下文“sessionCacheSize”\
  \ 属性的默认值；参见 `SSLSessionContext.setSessionCachSize(int)`。\n\n`javax.net.ssl.trustStore`:\
  \ 存储验证通信端点信任锚点的密钥库文件名称。用于在内部创建 `TrustManager`。\n\n`javax.net.ssl.trustStorePassword`:\
  \ 访问存储信任锚点的密钥库文件的密码。\n\n`javax.net.ssl.trustStoreType`: 存储信任锚点的密钥库文件类型。\n\n`javax.net.ssl.trustStoreProvider`:\
  \ 为 `javax.net.ssl.trustStore` 属性指定的密钥库提供实现支持的程序名称。\n\n`jdk.tls.allowLegacyMasterSecret`:\
  \ 是否允许未协商 `extended_master_secret` 扩展的连接。\n\n`jdk.tls.allowLegacyResumption`: 是否允许原始连接未协商\
  \ `extended_master_secret` 扩展的会话恢复。\n\n`jdk.tls.client.cipherSuites`: 以逗号分隔的列表形式指定\
  \ TLS 客户端默认启用的加密套件。\n\n`jdk.tls.client.enableCAExtension`: 如果设置为“true”，则启用 `certificate_authorities`\
  \ 扩展，这是 TLS 1.3 引入的可选的 `ClientHello` 扩展。\n\n`jdk.tls.client.enableStatusRequestExtension`:\
  \ 根据 RFC 6066 的 `status_request` 扩展启用“OCSP 封装”。\n\n`jdk.tls.client.protocols`: 欲要启用特定的\
  \ TLS 协议，请在引号内以逗号分隔的列表形式指定它们，并将禁用所有其他支持的协议。例如，如果此属性值为“TLSv1,TLSv1.1”，则默认协议设置仅适用于\
  \ TLSv1 和 TLSv1.1，没有其他可用协议。\n\n`jdk.tls.client.SignatureSchemes`: 包含逗号分隔的支持签名方案名称列表，指定了客户端侧可能用于\
  \ TLS 连接的签名方案。\n\n`jdk.tls.ephemeralDHKeySize`: 设置此值以自定义临时 DH 密钥的大小（位为单位）。该值默认为\
  \ 2048，最小为 1024。\n\n`jdk.tls.maxCertificateChainLength`: 指定 TLS 握手中允许证书链的最大长度。\n\
  \n`jdk.tls.maxHandshakeMessageSize`: 指定 TLS 握手中握手消息的最大大小（字节为单位）。\n\n`jdk.tls.namedGroups`:\
  \ 定义已启用曲线和/或有限域组集合，按偏好顺序排序。格式为逗号分隔的组名列表，例如“secp256r1, secp384r1, secp521r1”。完整的组名列表请参阅\
  \ RFC 4492 \\cite{RFC4492}、RFC 7919 [127] 和/或 IANA 的 TLS 支持组注册表。\n\n`jdk.tls.server.cipherSuites`:\
  \ 以逗号分隔的列表形式指定 TLS 服务器默认启用的加密套件。\n\n`jdk.tls.server.enableCAExtension`: 如果设置为“true”，则启用\
  \ `certificate_authorities` 扩展，这是 TLS 1.3 引入的可选 `CertificateRequest` 扩展。\n\n`jdk.tls.server.protocols`:\
  \ 欲要启用特定的 TLS 服务器协议，请在引号内以逗号分隔的列表形式指定它们，并将禁用所有其他支持的协议。例如，如果此属性值为“TLSv1,TLSv1.1”，则默认协议设置仅适用于\
  \ TLSv1 和 TLSv1.1，没有其他可用协议。\n\n`jdk.tls.server.SignatureSchemes`: 包含逗号分隔的支持签名方案名称列表，指定了客户端可能用于\
  \ TLS 连接的签名方案。\n\n`jdk.tls.trustName`: 可用于在需要时开启查找。注意：启用查找可能会受到 MITM 攻击。\n\n`jdk.tls.useExtendedMasterSecret`:\
  \ 如果设置为“false”，则禁用扩展主密钥的协商。\n\n`jsse.enableFFDHE`: 如果设置为“false”，则禁用 RFC 7919 中定义的\
  \ FFDHE 机制。\n\n`jsse.enableSNIExtension`: 如果设置为“true”，启用服务器名称指示 (SNI) 扩展。\n\n`sun.security.ssl.allowLegacyHelloMessages`:\
  \ 如果设置为“true”，允许未实现 RFC 5746 安全重新协商的连接。\n\n### BCJSSE 特定属性\n\n以下属性是 BCJSSE 特有的：\n\
  \n`org.bouncycastle.jsse.client.dh.minimumPrimeBits`: 整数属性，默认 2048，可以在 1024 到 16384\
  \ 之间配置。\n\n`org.bouncycastle.jsse.client.dh.unrestrictedGroups`: 布尔属性，默认 false，如果被设置为“true”，则将接受任何符合大小要求（即\
  \ `minimumPrimeBits`）的 DH 组。\n\n`org.bouncycastle.jsse.client.enableSessionResumption`:\
  \ 控制 TLS 客户端是否启用自动会话恢复（如果支持）。\n\n`org.bouncycastle.jsse.client.enableTrustedKeysExtension`:\
  \ 控制 TLS 客户端是否启用 RFC 6066 中的 `trusted_ca_keys` 扩展。\n\n`org.bouncycastle.jsse.config`:\
  \ 向 JSSE 提供程序传递配置字符串的另一种方法。设置为“default”以正常方式运行，否则可以使用其他配置，例如“fips:BCFIPS”。\n\n`org.bouncycastle.jsse.fips.allowRSAKeyExchange`:\
  \ 布尔属性，默认 true，如果设置为“true”，则允许在 IPS 模式下使用基于 RSA 密钥交换的加密套件。注意：当 SP 800-131A 弃 TLS\
  \ 中的 RSA 密钥交换生效时，此属性的默认值将变为“false”。\n\n`org.bouncycastle.jsse.ec.disableChar2`:\
  \ 布尔属性，默认 false，如果被设置为“true”，将禁用 TLS 握手和密钥交换中使用任何特征 2（或 F2m）曲线。\n\n`org.bouncycastle.jsse.keyManager.checkEKU`:\
  \ 控制 BCJSSE 密钥管理器在向 TLS 对端提交凭据集时是否检查适当的扩展密钥用途 (EKU)。注意，无效 EKU 的证书可能会被对方拒绝。\n\n`org.bouncycastle.jsse.server.enableSessionResumption`:\
  \ 控制 TLS 服务器是否启用自动会话恢复（如果支持）。\n\n\n\n\n\n`org.bouncycastle.jsse.server.enableTrustedCAKeysExtension`:\
  \ 控制 TLS 服务器是否启用来自 RFC 6066 的 `trusted_ca_keys` 扩展。\n\n`org.bouncycastle.jsse.trustManager.checkEKU`:\
  \ 控制 BCJSSE 信任管理器检查给定证书链是否受信任时，是否检查适当的扩展密钥用法（Extended Key Usage）扩展。\n\n## BC JSSE\
  \ 扩展\n\n遵循 TLS 协议对任何人来说都是一项巨大的挑战，因此 Bouncy Castle JSSE 提供程序提供了若干扩展，以填补旧版本 JSSE 的空白，并提供了当前版本中一些尚未完全进入公共\
  \ API 的功能。\n\n### 恢复 TLS 唯一 ID\n\nBC JSSE 返回的 `SSLSocket` 对象，这些对象实现了 `org.bouncycastle.jsse.BCSSLSocket`\
  \ 接口。`BCSSLSocket` 定义如下：\n\n```\n 1 /**\n 2  * 一个 BCJSSE 特有的接口，用于在\n 3  * javax.net.ssl.SSLSocket\
  \ 实现上暴露扩展功能。\n 4  */\n 5 public interface BCSSLSocket\n 6 {\n 7     BCExtendedSSLSession\
  \ getBCHandshakeSession();\n 8 \n 9     /**\n10      * 返回扩展 SSL 连接数据的访问器。此方法将在 \n\
  11      * 有需要时启动初始握手，然后阻塞直到\n12      * 握手建立。如果在初始握手期间发生错误，\n13      * 此方法将返回 null。\n\
  14      *\n15      * @return 一个 BCSSLConnection 实例。\n16      */\n 17     BCSSLConnection\
  \ getConnection();\n 18 \n19     /**\n20      * 返回一个带有反映当前配置的 \n21      * 属性的 BCSSLParameters。\n\
  \ 22      * @return 当前的 BCSSLParameters 参数\n23      */\n 24     BCSSLParameters\
  \ getParameters();\n 25 \n 26     /**\n 27      * 当未使用包含其作为参数的 SocketFactory \n\
  28      * 方法时，允许显式设置 'host' 字符串。\n29      *\n30      * 必须在尝试连接套接字之前调用此方法\n31   \
  \   * 才能生效。\n32      *\n33      *\n34      * @param host 要连接的服务器主机名，或\n35      *\
  \             null 表示回环地址。\n36      */\n 37     void setHost(String host);\n 38\
  \ \n 39     /**\n40      * 根据 {@link BCSSLParameters} 中的属性设置参数。\n41      *\n42 \
  \     * 注意，任何设置为 null 的属性都将被忽略，这 \n43      * 将保持相应的设置不变。\n44      *\n45      *\n\
  4 46      * @param parameters 要设置的 {@link BCSSLParameters 参数}\n47      */\n 48 \
  \    void setParameters(BCSSLParameters parameters);\n 49 }\n```\n\n其中 `org.bouncycastle.jsse.BCSSLConnection`\
  \ 定义为：\n\n```\n 1 /**\n 2  * 一个 BCJSSE 特有的接口，用于访问扩展的连接特定\n 3  * 功能。\n 4  */\n 5\
  \ public interface BCSSLConnection\n 6 {\n 7     /**\n 8      * 返回为此连接协商的应用协议，如果没有协商\n\
  \ 9      * 则返回空字符串。详情请参见 https://tools.ietf.org/html/rfc7301\n10      *\n11    \
  \  *\n12      * @return 协商的应用协议，或一个空 {@code String}。\n13      */\n 14     String\
  \ getApplicationProtocol();\n 15 \n 16     /**\n 17      * \n18      * 为此连接请求 TLS\
  \ 通道绑定（Channel Bindings）。详情\n19      * 请参见 https://tools.ietf.org/html/rfc5929。\n\
  20      *\n21      *\n22      * @param channelBinding 一个 IANA 注册的“通道绑定唯一前缀”，\n23\
  \      *                  TLS 有效，例如 \"tls-unique\" 或 \"tls-server-end-point\"。\n\
  24      * @return 通道绑定数据的 byte[] 拷贝，如果该\n25      *     绑定对此连接不可用则返回 null。\n26  \
  \    */\n 27     byte[] getChannelBinding(String channelBinding);\n 28 \n 29   \
  \  /**\n 30      * 返回此连接使用的 SSL 会话\n 31      * @return BCExtendedSSLSession。\n 32\
  \      */\n 33     BCExtendedSSLSession getSession();\n 34 }\n```\n\n`channelBinding`\
  \ 字符串代表一个在 IANAs（IANA）注册的“通道绑定唯一前缀”，该前缀被列为 TLS 有效，例如：“tls-unique”。你可以按照下例示例，利用这些\
  \ BC JSSE 特有的接口创建一个函数，以获取诸如“tls-unique”之类的通道绑定。\n\n```java\npublic byte[] getTlsUnique(Socket\
  \ sock)\n{\n    BCSSLConnection bcon = ((BCSSLSocket)sock).getConnection();\n  \
  \  if (bcon != null)\n    {\n        return bcon.getChannelBinding(\"tls-unique\"\
  );\n    }\n    return null;\n}\n```\n\n### 端点识别 (Endpoint Identification)\n\n端点识别在\
  \ bctls 1.0.7 中引入，其方式尽可能地与 SunJSSE 保持兼容。遗憾的是，当使用 `HttpsURLConnection` 时，SunJSSE\
  \ 使用了一些“魔法手段”（反射和/或内部 API）来告诉套接字用于连接的“主机名”，我们无法使用这种方法，因为它是内部的。为了让端点识别正常工作，需要使用两种变通方法：\n\
  \n1. 将系统属性 `jdk.tls.trustNameService` 设置为“true”。但是，请注意此说明：“如果应用程序对 SSL/TLS 连接中的原始\
  \ IP 地址进行反向解析并遇到端点识别问题，可以使用 jdk.tls.trustNameService。注意，如果域名服务不可信，启用反向解析可能会受到攻击。”\n\
  \n2. 第二种（推荐的）替代方案是在 `HttpsURLConnection` 上设置自定义的 `SSLSocketFactory`，然后拦截套接字创建并在套接字上手动设置\
  \ SNI `host_name`。请参见下例代码。这是人们在想要调整加密套件时使用的通用模式。\n\n```\n 1 // 代码块\n 2 {\n3    \
  \ SSLContext sslContext = ...;\n4     final URL serverURL = ...;\n5     HttpsURLConnection\
  \ conn = (HttpsURLConnection)serverURL.openConnection();\n6 \n7     conn.setSSLSocketFactory(new\
  \ CustomSSocketFactory(\n8 \t\t\t\t\tsslContext.getSocketFactory())\n9     {\n10\
  \         @Override\n11         protected Socket configureSocket(Socket s)\n12 \
  \        {\n13             if (s instanceof SSLSocket)\n14                 {\n15\
  \                     SSLSocket ssl = (SSLSocket)s;\n16 \n17                 SNIHostName\
  \ sniHostName = getSNIHostName(serverURL);\n18                 if (null != sniHostName)\n\
  19                     {\n20                         SSLParameters sslParameters\
  \ = new SSLParameters();\n21 \n22                         sslParameters.setServerNames(\n\
  23                                 Collections.<SNIServerName>singletonList(sniHostName));\n\
  24                         ssl.setSSLParameters(sslParameters);\n25            \
  \         }\n26             }\n27             return s;\n28         }\n29     });30\
  \ }\n31 \n32 private SNIHostName getSNIHostName(URL url)\n33 {\n34     String host\
  \ = url.getHost();\n35     if (null != host && host.indexOf('.') > 0\n36       \
  \      && !org.bouncycastle.util.IPAddress.isValid(host))\n37     {\n38        \
  \ try\n39         {\n40             return new SNIHostName(host);\n41         }\n\
  42         catch (RuntimeException e)\n43         {\n44 \t\t// ignore – return null\n\
  45         }\n46     }\n47     return null;\n48 }\n```\n\n## 使用低级 (D)TLS API\n\n\
  \n\n\nBCJSSE 提供者通过位于 `org.bouncycastle.tls` 包中的低级 (D)TLS API 来实现 TLS。可以直接使用此 API\
  \ 而无需通过 JSSE 标准 API。它的设计初衷是让程序员具有极大的灵活性，可以修改或扩展实现的各个方面面。这可能意味着简单的配置选项，如密码套件、版本、椭圆曲线，或者更复杂的更改，如添加对新\
  \ TLS 扩展的支持。对于大多数用户来说，通过 BCJSSE 提供者使用 Bouncy Castle 的 TLS 功能是最佳选择，特别是在与第三方应用程序协作时，这些应用程序通常是基于\
  \ JSSE 标准 API 开发的。然而，可能存在某些 JSSE 未暴露必要功能的用例，例如你需要使用 DTLS，或者由于其他原因 JSSE 不适用。在某些情况下，可以使用\
  \ BC 特有的扩展来涵盖该用例，但也有可能完全弃用 JSSE。建议对 TLS 规范（如 `RFC 5246` 及其他相关的 `RFCs` 中描述）有一定了解。如果你计划走这条路，参考\
  \ TLS 测试套件的源代码作为示例用法，并研究 BCJSSE 提供者本身如何使用该 API 可能会很有帮助。\n\n## TlsCrypto\n\n低级 (D)TLS\
  \ API 将所有加密操作委托给 `TlsCrypto` API，该 API 位于 `org.bouncycastle.tls.crypto` 包。该 API\
  \ 的使用是通过 `TlsCrypto` 接口的实例；单个实例可以在多个连接之间共享。例如，BCJSSE 提供者为每个 `SSLContext` 使用单个实例。在标准的\
  \ TLS 分发版中提供了 2 个现有的 `TlsCrypto` 实现：\n\n- `org.bouncycastle.tls.crypto.impl.bc.BcTlsCrypto`\n\
  - `org.bouncycastle.tls.crypto.impl.jcajce.JcaTlsCrypto`\n\n其他选项是编写完全全新的实现，或者更现实是对这些实现之一进行子类以微调其行为。只需记住\
  \ `TlsCrypto` 对象应该是可共享的。\n\n### BcTlsCrypto\n\n`BcTlsCrypto` 依赖轻量级 BC 加密 API 实现加密原语。`BcTlsCrypto`\
  \ 不在 BCFIPS TLS jar 中。\n\n### JcaTlsCrypto\n\n`JcaTlsCrypto` 通过 Java 加密体系 (JCA)\
  \ 将操作委托给任何安装的加密提供者。虽然我们预计这通常会与“BC”或“BCFIPS”提供者一起使用，但并非强制。然而，请注意，TLS API 可用的密码套件集受可用提供者的能力。\n\
  \n## 低级 TLS API\n\n低级 TLS API 是 BCJSSE 提供者构建的基础，因此使用 BCJSSE 提供者可以完成的任何操作在低级 TLS\
  \ API 中也可以完成。\n\n### 简单 TLS 客户端大纲\n\n简单 TLS 客户端的示例代码：\n\n```\n// 用于支持客户端功能的 TlsCrypto\n\
  TlsCrypto crypto = new BcTlsCrypto(new SecureRandom());\n…\nInetAddress address\
  \ = InetAddress.getByName(\"www.example.com\");\nint port = 443;\nSocket s = new\
  \ Socket(address, port);\nTlsClient client = new DefaultTlsClient(crypto) {\n //\
  \ 在此处 必须实现 TlsClient.getAuthentication()\n};\nTlsClientProtocol protocol = new TlsClientProtocol(\n\
  \ s.getInputStream(), s.getOutputStream());\n// 执行 TLS 握手\nprotocol.connect(client);\n\
  // 读写 protocol.getInputStream(), protocol.getOutputStream()\n…\nprotocol.close();\n\
  ```\n\n`DefaultTlsClient` 提供了一组合理的默认密码套件，类似于典型的 Web 浏览器支持的内容。其他选项包括在在使用预共享密钥时使用\
  \ `PSKTlsClient`，或者在使用安全远程密码协议 (SRP) 进行身份验证时使用 `SRPTlsClient`。请注意，在使用此代码之前，必须提供\
  \ `TlsClient.getAuthentication()` 的实现（见上方的代码注释）。该实现应返回 `TlsAuthentication` 接口的实例，并且该实例\
  \ 必须在 `TlsAuthentication.notifyServerCertificate` 中执行证书验证。这可以是简单的检查服务器证书是否与预期的完全一致，也可以按照\
  \ `RFC 5280` 指定进行全路径验证，或者是两者之间的某种，但至关重要的是，生成的 TLS 连接的安全性取决于这一步。如果你希望客户端向服务器进行身份验证，还需要实现\
  \ `TlsAuthentication.getClientCredentials`。\n\n### 简单 TLS 服务器大纲\n\n根据所需的功能范围，编写\
  \ TLS 服务器可能比编写 TLS 客户端复杂得多。尽管顶层代码应该非常相似：\n\n```\n// 用于支持服务器功能的 TlsCrypto\nTlsCrypto\
  \ crypto = new BcTlsCrypto(new SecureRandom());\n…\nint port = 443;\nServerSocket\
  \ ss = new ServerSocket(port);\nSocket s = ss.accept();\n…\nTlsServer server = new\
  \ DefaultTlsServer(crypto) {\n // 在此处重写例如 TlsServer.getRSASignerCredentials() 或\n\
  \ // 类似的方法，取决于你想使用的凭据。\n};\nTlsServerProtocol protocol = new TlsServerProtocol(\n\
  \ s.getInputStream(), s.getOutputStream());\n// 执行 TLS 握手\nprotocol.accept(server);\n\
  // 读写 protocol.getInputStream(), protocol.getOutputStream()\n…\nprotocol.close();\n\
  ```\n\n`PKSTlsServer` 或 `SRPTlsServer` 是此处的其他选项，与客户端类似。在这里，在进行任何操作之前，必须解决服务器将使用的凭据问题（见代码注释）。支持客户端认证需要重写\
  \ `TlsServer.getCertificateRequest()` 和 `TlsServer.notifyClientCertificate`，后者在考虑客户端之前必须执行证书验证。如果需要，也可以对\
  \ `TlsClientProtocol` 或 `TlsServerProtocol` 进行子类化。\n\n## DTLS\n\nDTLS 客户端和服务器使用与\
  \ TLS 不同的协议类和传输层，但 `TlsClient` 和 `TlsServer` 实现通常可以正常工作。存在某些异常，例如 DTLS 不支持基于流的密码套件如\
  \ RC4。客户端代码差异示例：\n\n```\nDatagramSocket socket = new DatagramSocket();\nsocket.connect(InetAddress.getByName(\"\
  www.example.com\"), 5556);\nint mtu = 1500;\nDatagramTransport transport = new UDPTransport(socket,\
  \ mtu);\nTlsClient client = ...;\nDTLSClientProtocol protocol = new DTLSClientProtocol();\n\
  DTLSTransport dtls = protocol.connect(client, transport);\n// 读写 dtls 方法\ndtls.close();\n\
  ```\n\n服务器再次非常：\n\n```\nDatagramTransport transport = ...;\nTlsServer server = ...;\n\
  DTLSServerProtocol protocol = new DTLSServerProtocol();\nDTLSTransport dtls = protocol.accept(server,\
  \ transport);\ndtls.close();\n```\n\n### 低级 TLS API 重写\n\n使用低级 TLS 类通常需要扩展基类，然后重写父类的方法以提供所需的功能。以下是一些更有实用的重写。\n\
  \n注意：在许多你需要通过重写基类之一的方法来向操作添加某些内容的情况下，通常最好确保通过 `super` 调用基类中的方法。\n\n#### 基于 TLSPeer\
  \ 的有用重写\n\n`TLSPeer` 类是低级 API 中 TLS 客户端和服务器的基础。\n\n##### 握手 - notifyHandshakeBeginning(),\
  \ notifyHandshakeComplete()\n\n`notifyHandshakeBeginning()` 和 `notifyHandshakeComplete()`\
  \ 提供捕捉握手开始和完成的能力。`notifyHandshakeComplete()` 方法只有在握手成功完成后才会被调用。在出现警告（alert）的情况下，你需要重写\
  \ `notifyAlertRaised()` 和 `notifyAlertReceived()` 方法。\n\n\n\n\n\n# Alerts - notifyAlertRaised(),\
  \ notifyAlertReceived()\n\n`notifyAlertRaised()` 和 `notifyAlertReceived()` 方法提供了监听在\
  \ TLS 协议执行过程中本地或远程产生的告报（alerts）的能力。当本地产生告报时，将调用 `notifyAlertRaised()`。当从远程节点接收告报时，将调用\
  \ `notifyAlertReceived()`。\n\n## 基于 TLSClient 的实用重写\n\n`TLSClient` 是 `TLSPeer` 的客户端扩展。通常的基础实现类是\
  \ `DefaultTLSClient`，但也有一些额外的可用重写方法。\n\n## 会话信息 - notifySessionID()\n\n`notifySessionID()`\
  \ 方法被调用用于通知客户端 `ServerHello` 中发送的会话 ID。会话 ID 以 `byte[]` 形式传入。\n\n## 会话恢复 - getSessionToResume(),\
  \ notifySessionToResume()\n\n通常，此方法将返回 `null`，表示应该使用新会话。非空返回值可表示客户端想要恢复的会话。假设一切工作已就绪可以实现恢复，该会话将传递给\
  \ `notifySessionToResume()` 方法并表示成功。如果无法恢复会话，则将带有 `null` 调用 `notifySessionToResume()`，并将新的会话\
  \ ID 传递给 `notifySessionID()` 方法。\n\n## 基于 TLSServer 的实用重写\n\n`TLSServer` 是 `TLSPeer`\
  \ 的服务器扩展。通常的基础实现类是 `DefaultTLSServer`，但也一些额外的可用的重写方法。\n\n## 会话信息 - notifySession()\n\
  \n在服务器对象上调用 `notifySession()` 方法，用于传入所有会话信息以及防止会话被恢复的能力。所需的数据通过一个实现 `TlsSession`\
  \ 接口的对象传入。`TlsSession` 接口包含返回会话参数、会话 ID 以及会话是否可恢复的方法。该接口还提供了一个 `invalidate()` 方法，可用于防止会话被恢复。\n\
  \n# 专家协议：PSK 和 SRP\n\n低级 API 对 PSK 和 SRP 均有某些支持。目前在 JSSE 级别还没有支持——这在未来可能会发生变化，但目前看来，所需的工作量似乎超过了人们直接使用低级\
  \ API 所面临的工作量。\n\n## TLS-PSK - 传输层安全预共享密钥\n\n在 TLS 中使用预共享密钥由 RFC 4279 涵盖 [89]。低级\
  \ TLS API 支持通过 `PSKTlsClient` 类实现 TLS-PSK。你可以通过扩展 `PSKTlsClient` 类并至少重写 `getAuthentication()`\
  \ 方法来实现 TLS-PSK 客户端。`PSKTlsClient` 类在其构造函数中获取 TLS-PSK 身份信息，实现 `TlsPSKIdentity` 的对象也可用于传入\
  \ TLS-PSK 身份信息。\n\nTLS-PSK 服务器支持由 `PSKTlsServer` 类提供，实现者需要重写 `getRSASignerCredentials()`并在构造服务器对象时提供\
  \ `TlsPSKIdentityManager` 的实现。\n\n## TLS-SRP - 传输层安全安全远程密码\n\n使用安全远程密码（SRP）协议进行\
  \ TLS 认证（即 TLS-SRP）记录在 RFC 5054 中 [94]。Bouncy Castle 通过 `SRPTlsClient` 类提供 TLS-SRP\
  \ 支持。要实现 SRP-TLS 客户端，你需要扩展 `SRPTlsClient` 类并至少重写 `getAuthentication()` 方法以提供对协议的支持。与\
  \ TLS-PSK 类似，`SRPTlsClient` 在构造函数中获取身份信息，`TlsSRPIdentity` 提供了任何携带身份的对象都需要遵循的基础接口。\n\
  \nTLS-SRP 服务器支持由 `SRPTlsServer` 类提供。在这种情况下，重要的方法是 `getDSASignerCredentials()` 和\
  \ `getRSASignerCredentials()`——其中一个需要被重写，以便服务器提供凭据。服务器类在构造服务器对象时还需要 `TlsSRPIdentityManager`\
  \ 的实现。低级 API 还提供了 `SimulatedTlsSRPIdentityManager`，允许服务器通过提供 RFC 5054 第 2.5.1.3\
  \ 节算法的实现来模拟“未知”身份的存在。使用此类类将允许服务器隐藏用户名没有验证器的事实。\n\n### 总结\n\nBouncy Castle API 提供了\
  \ JSSE 提供程序和低级 API，以支持 TLS、DTLS 以及某些协议的变体（如 PSK 和 SRP）。对于 PSK 和 SRP 等专家级变体，你需要使用低级\
  \ API。\n\n出于调试目的，TLS API 提供了对 Java 日志（Java Logging）的支持。BCJSSE 提供程序也可以使用许多与 JSSE\
  \ 提供程序相同的系统属性，但请注意，BCJSSE 提供程序针对最新的 JVM 有许多属性的默认值，而普通的 JSSE 提供程序会将未定义的属性简单视为未设置且没有默认值。\n\
  \n## 第 15 章：未来\n\n本章尝试提供密码学当前发展的窗口，以及它们如何开始影响 Bouncy Castle API 的方向。该领域最大的活动是围绕后量子算法——这些算法涵盖了密钥交换、签名和密钥传输等广泛的应用领域。这一发展之所以引起关注的原因之一是，许多此类算法并非“常态”——我们看到了只有一方拥有私钥的状态算法和密钥交换机制。这些差异可能会导致新协议的引入，并改变我们解决问题的方法。\n\
  \n## 安装 Bouncy Castle 量子提供程序\n\nBouncy Castle 量子提供程序（BCPQC）从 Java 1.5 开始包含在 BC 包（以\
  \ `bcprov` 开头）中。即使 BC 在类路径中，它不会自动安装，因此需要静态或在运行时安装。\n\n目前还没有与 BCFIPS 提供程序等效的选择，尽管某些\
  \ BCFIPS 工具使用了量子算法。\n\n### 静态安装\n\n静态安装提供程序取决于你处理的是否为 Java 1.9 之前的 JVM。\n\n对于 Java\
  \ 1.5 到 1.8，你可以通过向 `$JAVA_HOME/jre/lib/security/java.security` 文件中的列表插入类名来添加提供程序。提供程序列表格式为\
  \ `security.provider.n` 的项，其中 n 是提供程序的优先级，1 表示最高优先级。在这种情况下添加 Bouncy Castle 量子提供程序需要添加如下行：\n\
  \n```\nsecurity.provider.N=org.bouncycastle.pqc.jcajce.provider.BouncyCastlePQCProvider\n\
  ```\n\n其中 N 代表你希望 BCPQC 提供程序具有的优先级。如果没有将 BCPQC 提供程序添加到列表末尾，确保调整其他提供程序的值。添加该项后，确保提供程序位于类路径上，最好放在\
  \ `$JAVA_HOME/jre/lib/ext` 目录，以便它始终能由 JCA 信任的类加载器加载。\n\n对于 Java 1.9 及更高版本，列表位于 `$JAVA_HOME/conf/security`。目前\
  \ BC 提供程序不支持 jar 包的 `META-INF/service` 功能，因此需要像以前一样通过使用完整类名添加到提供程序列表中。\n\nJava 1.9\
  \ 不再支持 `$JAVA_HOME/jre/lib/ext`。在 Java 1.9 的情况下，你只需要确保 BCPQC 包含在类路径中。\n\n\n\n\n\n\
  在运行时使用提供者（provider）有两种方法。\n\n第一方法是使用 `java.security.Security` - 对于 BCPQC 提供者，其写法如下：\n\
  \n```java\njava.security.Security.addProvider(\n             new org.bouncycastle.pqc.jcajce.provider.BouncyCastlePQCProvider());\n\
  ```\n\n执行完上述语句后，`JVM` 中的状态几乎等同于静态安装提供者的情况。可以使用提供者的名称通过 `getInstance()` 方法访问签名等服务。\n\
  \n使用第二种方法，则是将提供者对象传递到所请求的服务中，例如，为了使用 `BCPQC` 提供者创建一个 `XMSS` 签名，你可以写：\n\n```java\n\
  Signature sig = Signature.getInstance(\"XMSS\", new BouncyCastlePQCProvider());\n\
  ```\n\n## 有状态签名算法\n\n我们处理的大多数签名算法都是无状态的。也就是说，一旦执行了签名操作，一切都与签名操作之前一样，可以再次使用相同的私钥得到相同的结果。\n\
  \n有状态签名算法在这方面有所不同 - 每生成一个签名，私钥都会被修改。这是因为有状态的方案是基于一次签名方案（one-time signature schemes），而有状态签名方案提供的多次签名方案实际上是通过一组一次性私钥创建签名来工作的，所有这些签名都可以通过同一个公钥进行验证。\n\
  \n在某些方面，有状态签名方案实际上是一种优势，因为私钥的寿命是有限的。使用有状态方案迫使人们更换密钥，并在开发初期妥善处理与加密和安全相关的“硬性”问题，而不是通常的“先部署，后恐慌”的过程。我们在这里查看的算法还包括签名中的签名索引。这使得很容易判断你已经发出了多少个签名，即使你无法直接访问私钥。\n\
  \n尽管如此，有状态签名方案带来了一些我们以前没有遇到过的新问题。考虑到这些新问题很重要，特别是当你需要持久化私钥时。\n\n### 起源\n\n有状态签名算法的起源可以追溯到基于哈希的签名算法早期工作，这些工作源于\
  \ 1979 年 Leslie Lamport [12] 和 Robert Winternitz [13] 的工作。详细查看这些方案中的一种是值得的，因为它有助于解释这些方案实际上是如何工作的，以及为什么有必要确保密钥中的状态不被重用。\n\
  \n### 基础 Winternitz 一次签名\n\nWinternitz 方案很有意义，因为它既代表了基于哈希的签名生成器，其变体（W-OTS+）也被用于\
  \ `XMSS` 以及 `SPHINCS+`（NIST 后量子加密决赛者之一）等算法中。该方案的描述和实现也相对简单。查看下面的图，你将看到它是如何使用 `SHA-256`\
  \ 作为消息摘要对单个字节进行签名的。\n\n![使用 W-OTS 对单个字节签名的过程](img/chapter15----W-OTS.png)\n\n使用\
  \ W-OTS 对单个字节签名的过程\n\n从图中可以看到，我们得到了 64 字节的签名，因为我们还基于被签名字节的补码计算了校验和。虽然前 32 字节的值为我们提供了一个可以验证的数值签名，但再次对该值进行哈希也是轻而的，在没有额外信息的情况下，我们会接受前\
  \ 32 字节作为 ![(M + 1)](img/leanpub_equation_660.png) 的签名。为了避免这种情况，我们依赖 ![M](img/leanpub_equation_661.png)\
  \ 的补码，如在 ![(w - 1 - M)](img/leanpub_equation_662.png) 中用于校验和。这意味着任何试图将 ![(M + 1)](img/leanpub_equation_663.png)\
  \ 呈现为有效的伪造者将面临计算 ![SHA-256(w - 1 - (M + 1))](img/leanpub_equation_664.png) 的问题，而这是\
  \ ![SHA-256(w - 1 - M)](img/leanpub_equation_665.png) 的原像 - 如果所使用的摘要函数足够好，这是极其困难的，甚至是不可能的。\n\
  \n遗憾的是，保护原像（pre-images）的需求意味着我们只能使用一次 W-OTS 私钥 - 如果不遵循这条规则，并且有人欺骗我们签名字节‘0x00’和字节‘0xFF’，他们他们就能伪造任何值的签名。\n\
  \n在更通用的意义上实现该方案是相当直接的。Winternitz 方案依赖于参数 ![w](img/leanpub_equation_666.png) 来决定私钥的每个部分可以处理多少位\
  \ - ![w](img/leanpub_equation_667.png) 代表 2^bits。为了简单起见，我们仅使用以下设置参数：\n\n```java\n\
  \  private static final String DIGEST = \"SHA-256\";\n  private static final int\
  \ DIGEST_SIZE = 32;\n\n  private static final int W = 256;\n  // CHK_SIZE = floor(log2(DIGEST_SIZE\
  \ * (W - 1))/log2(W)) + 1\n  private static final int CHK_SIZE = 2;\n  private static\
  \ final int KEY_ELEMENTS = W / 8;\n```\n\n我说简单是因为 ![w](img/leanpub_equation_668.png)\
  \ 为 256 意味着我们可以基于字节进行所有操作。不过你可以将 ![w](img/leanpub_equation_669.png) 增加到更高的 2 的幂，例如\
  \ 65536 将允许按 2 字节处理消息，并减半签名大小以及公钥和私钥的大小。\n\n校验和大小被设置为 2 字节，因为我们可以如下描述我们想要的计算：\n\n\
  ```java\n  /**\n   * 计算补码校验和，以防止基于增加 msg 值的伪造行为。\n   *\n   * @param msg 要计算校验和的消息。\n\
  \   * @return 字节数组形式的校验和。\n   */\n  private static byte[] calcCheckSum(byte[] msg)\n\
  \  {\n      // 计算 msg 校验和\n      int checkSum = 0;\n      for (int i = 0; i < msg.length;\
  \ i++ )\n      {\n          checkSum += W - 1 - (msg[i] & 0xff);\n      }\n    \
  \  // 注意：这取决于 CHK_SIZE\n      return Pack.shortToBigEndian((short)checkSum);\n \
  \ }\n```\n\n我们可以将其作为 2 字节校验和返回，因为 ![32*(w-1)](img/leanpub_equation_670.png) 是校验和可能的最大值。使用消息的完整补码也可以，但它会使签名大小翻倍\
  \ - 较小的计算同样有效，因为它为伪造者制造了相同的问题。任何伪造签名只能通过增加我们正在签名的消息哈希中的某个字节来计算，伪造者无法在特定索引处使用较小的字节值，因为他们无法恢复哈希的原像。增加字节值将导致校验和中至少一个字节的减少，因此潜在的伪造者再次陷入了麻烦。\n\
  \n此时，计算一次性密钥对只需创建一个代表私钥的秘密数组，然后执行所需次数的哈希操作来创建公钥。\n\n\n\n\n\n```java\n   /**\n  \
  \  * Generate a W-OTS key pair.\n    *\n    * @param random 用于密钥生成的随机性数源。\n    *\
  \ @return 一个形式为 {publicKey, privateKey} 的数组。\n    */\n   private static byte[][]\
  \ computeWotsKeyPair(SecureRandom random)\n       throws GeneralSecurityException\n\
  \  {\n      MessageDigest digest = MessageDigest.getInstance(DIGEST);\n\n      //\
  \ create a 32 * 256 bit private key\n      byte[] privateKey = new byte[KEY_ELEMENTS\
  \ * DIGEST_SIZE];\n\n      random.nextBytes(privateKey);\n\n      byte[] publicKey\
  \ = new byte[privateKey.length];\n      System.arraycopy(privateKey, 0, publicKey,\
  \ 0, publicKey.length);\n      for (int i = 0; i != KEY_ELEMENTS; i++)\n      {\n\
  \          for (int j = 0; j != W; j++)\n          {\n              digest.update(publicKey,\
  \ i * DIGEST_SIZE, DIGEST_SIZE);\n              digest.digest(publicKey, i * DIGEST_SIZE,\
  \ DIGEST_SIZE);\n          }\n      }\n\n      return new byte[][]{publicKey, privateKey};\n\
  \  }\n```\n\n从这里你可以看到，将 `![w](img/leanpub_equation_671.png)` 增加到 65536 意味着虽然公钥计算次数会减少，但剩余的计算创建公钥时将花费\
  \ 256 倍的时间。这是一个巨大的跃！\n\n计算签名：我们首先对消息进行哈希，将校验和附加到结果中，然后对每个字节执行哈希计算。下面的方法展示了如何实现这一点。\n\
  \n```java\n   /**\n    * 根据消息摘要和私钥计算签名。\n    *\n    * @param privateKey 要使用的 W-OTS\
  \ 私钥。\n    * @param message 要签名的消息。\n    * @return 计算出的签名。\n    */\n   private static\
  \ byte[] computeWotsSignature(byte[] privateKey, byte[] message)\n       throws\
  \ GeneralSecurityException\n  {\n      MessageDigest digest = MessageDigest.getInstance(DIGEST);\n\
  \n      byte[] msgDigest = digest.digest(message);\n      byte[] checkMsg = Arrays.concatenate(msgDigest,\
  \ calcCheckSum(msgDigest));\n\n      byte[] signature = new byte[privateKey.length];\n\
  \      System.arraycopy(privateKey, 0, signature, 0, signature.length);\n      for\
  \ (int i = 0; i != KEY_ELEMENTS; i++)\n      {\n          for (int j = 0; j <= (checkMsg[i]\
  \ & 0xff); j++)\n          {\n              digest.update(signature, i * DIGEST_SIZE,\
  \ DIGEST_SIZE);\n              digest.digest(signature, i * DIGEST_SIZE, DIGEST_SIZE);\n\
  \          }\n      }\n\n      return signature;\n  }\n```\n\n从代码中可以看出，如果 `![w](img/leanpub_equation_672.png)`\
  \ 同样增加，那么适用于密钥生成的问题也会适用于签名生成。\n\n验证签名还需要对消息进行哈希，然后根据消息哈希值正向迭代签名中的哈希值。假设一切正确，这样做应该会产生与公钥相同的值。\n\
  \n```java\n   /**\n    * 验证传入的 W-OTS 签名。\n    *\n    * @param publicKey 用于验证签名的\
  \ W-OTS 公钥。\n    * @param signature 要验证的签名。\n    * @param message 签名应该验证的消息。\n \
  \   * @return 如果消息通过则返回 true，否则返回 false。\n    */\n   private static boolean isVerifiedWotsSignature(\n\
  \       byte[] publicKey, byte[] signature, byte[] message)\n       throws GeneralSecurityException\n\
  \  {\n      MessageDigest digest = MessageDigest.getInstance(DIGEST);\n\n      byte[]\
  \ msgDigest = digest.digest(message);\n\n      byte[] calcPubKey = new byte[publicKey.length];\n\
  \      byte[] checkMsg = Arrays.concatenate(msgDigest, calcCheckSum(msgDigest));\n\
  \n      System.arraycopy(signature, 0, calcPubKey, 0, calcPubKey.length);\n    \
  \  for (int i = 0; i != KEY_ELEMENTS; i++)\n      {\n          for (int j = (checkMsg[i]\
  \ & 0xff); j != W - 1; j++)\n          {\n              digest.update(calcPubKey,\
  \ i * DIGEST_SIZE, DIGEST_SIZE);\n              digest.digest(calcPubKey, i * DIGEST_SIZE,\
  \ DIGEST_SIZE);\n          }\n      }\n\n      // calcPubKey 现在应该等于 publicKey\n\
  \      return Arrays.equals(calcPubKey, publicKey);\n  }\n```\n再次你可以注意到增加 `![w](img/leanpub_equation_673.png)`\
  \ 也会导致尺寸的变化。你可以使用以下代码将这些方法整合在一起：\n\n```java\n byte[] msg = Strings.toByteArray(\"\
  Hello, world!\");\n      byte[][] wotsKp = computeWotsKeyPair(newRandom());\n\n\
  \      byte[] signature = computeWotsSignature(wotsKp[1], msg);\n\n      System.out.println(\"\
  verifies: \"\n          + isVerifiedWotsSignature(wotsKp[0], signature, msg));\n\
  ```\n\n运行该示例应该产生如下：\n\n```\nverifies: true\n```\n\n你会发现增加 `![w](img/leanpub_equation_674.png)`\
  \ 也会增加时间。\n\n#### 进阶多签名 - XMSS 和 LMS\n我们可以通过在组合中引入索引（或计数器），并在 HMAC 或其他伪随机函数中使用该索引，利用像\
  \ W-OTS 算法作为生成多个签名的基础。这仍然允许我们利用恢复原像的困难来保持算法的“抗量子性”，但你也可以看到，虽然索引的引入允许我们重用秘密值，但重用状态将导致能够恢复可能用于伪造的原像。\n\
  \n\n\n\nLeighton-Micali 签名 (LMS) 以及基于 LMS 的分层签名系统 (HSS) 已在 `RFC 8554` [132] 中定义。关于这些签名的额外标准工作也已通过。`RFC\
  \ 8708` [133] 现在为 CMS 和 X.509 公钥编码提供指导，而 `RFC 8778` [134] 则用于构建基于紧凑二进制对象表示 (CBOR)\
  \ 的消息。\n\n该方案基于哈希树的使用，最初以美国专利 `5,432,852` 的形式获得专利，该专利现已过期。\n\n### 使用 LMS 的工作流\n\n\
  在多次尝试让有状态的签名算法变得更易用、更安全（包括尝试为有状态签名提供特殊的 `StateAwareSignature` 接口）之后，我们得到了线程安全的私钥，这些私钥会在每次签名操作时自动轮换索引，并且我们所称的“密钥分片\
  \ (key-shards)”。\n\n密钥分片代表短时间私钥，占据 LMS 私钥密钥空间的一部分。对于 LMS 和 HSS，密钥分片是通过使用 `LMSPrivateKey`\
  \ 接口上的 `extractKeyShard()` 方法创建的。\n\n以下是 `LMSPrivateKey` 接口的定义：\n\n```\n 1 /**\n\
  \ 2  * LMS 私钥的基础接口\n 3  */\n 4 public interface LMSPrivateKey\n 5     extends LMSKey,\
  \ PrivateKey\n 6 {\n 7     /**\n 8      * 返回下一次签名的索引。\n 9      *\n10      * @return\
  \ 下一次签名的索引号。\n11      */\n12     long getIndex();\n13 \n14     /**\n15      * 返回私钥剩余的使用次数。\n\
  16      *\n17      * @return 密钥在耗尽前可以使用的次数。\n18      */\n19     long getUsagesRemaining();\n\
  20 \n21     /**\n22      * 返回一个代表密钥空间分片的密钥，该分片可以被\n23      * 使用 `usageCount` 次。\n\
  24      * <p>\n25      * 注意：这将为当前密钥使用范围 [index...index + usageCount)。\n26      *\
  \ \n27      * </p>\n28      * @param usageCount 密钥应该拥有的使用次数。\n29      * @return\
  \ 一个基于当前密钥的、可以使用 `usageCount` 次的密钥。\n30      */\n31     LMSPrivateKey extractKeyShard(int\
  \ usageCount);\n32 }\n```\n\n请注意，该接口允许您检索私钥的剩余使用次数，以及在证书生成时将使用的下一个索引。我们稍后将看到索引使用的具体示例。\n\
  \n下面的示例代码提供了一个生成 LMS 密钥对的函数。\n\n```\n 1   /**\n 2    * 生成一个基于 SHA-256、树高为 5 的 LMS\
  \ 密钥对。\n 3    *\n 4    * @return 一个 LMS KeyPair\n 5    */\n 6   public static KeyPair\
  \ generateLMSKeyPair()\n 7       throws GeneralSecurityException\n 8   {\n 9   \
  \    KeyPairGenerator kpg = KeyPairGenerator.getInstance(\"LMS\", \"BCPQC\");\n\
  10 \n11       kpg.initialize(new LMSKeyGenParameterSpec(\n12                   \
  \            LMSigParameters.lms_sha256_n32_h5,\n13                            \
  \   LMOtsParameters.sha256_n32_w1));\n14 \n15       return kpg.generateKeyPair();\n\
  16   }\n```\n\n请注意，在 LMS 密钥对生成的情况下，使用的哈希函数定义是树的属性。\n\n在下面的代码中，我们看到如何对数据签名并验证生成的签名。\n\
  \n```\n 1 /**\n 2  * 使用 SHA-512 作为树摘要的 LMS 基础示例。\n 3  */\n 4 public class LMSExample\n\
  \ 5 {\n 6     public static void main(String[] args)\n 7         throws GeneralSecurityException\n\
  \ 8     {\n 9         Security.addProvider(new BouncyCastlePQCProvider());\n10 \
  \        \n11         byte[] msg = Strings.toByteArray(\"hello, world!\");\n12 \n\
  13         KeyPair kp = generateLMSKeyPair();\n14 \n15         Signature lmsSig\
  \ = Signature.getInstance(\"LMS\", \"BCPQC\");\n16 \n17         lmsSig.initSign(kp.getPrivate());\n\
  18 \n19         lmsSig.update(msg, 0, msg.length);\n20 \n21         byte[] s = lmsSig.sign();\n\
  22 \n23         lmsSig.initVerify(kp.getPublic());\n24 \n25         lmsSig.update(msg,\
  \ 0, msg.length);\n26 \n27         System.err.println(\"LMS verified: \" + lmsSig.verify(s));\n\
  28     }\n29 }\n```\n\n### 使用 LMS 生成证书\n\n下面的代码按照 `RFC 8708` [133] 的概述，使用 LMS 生成一个\
  \ X.509 证书。在此情况下，我们修改了生成证书的方式，因为 `getIndex()` 被用序列号。这里是示例代码：\n\n```\n 1 /**\n 2\
  \  * 使用 SHA-512 作为树摘要的 LMS 基础示例。\n 3  */\n 4 public class LMSExample\n 5 {\n 6 \
  \    public static void main(String[] args)\n 7         throws GeneralSecurityException\n\
  \ 8     {\n 9         Security.addProvider(new BouncyCastlePQCProvider());\n10 \
  \        \n11         byte[] msg = Strings.toByteArray(\"hello, world!\");\n12 \n\
  13         KeyPair kp = generateLMSKeyPair();\n14 \n15         Signature lmsSig\
  \ = Signature.getInstance(\"LMS\", \"BCPQC\");\n16 \n17         lmsSig.initSign(kp.getPrivate());\n\
  18 \n19         lmsSig.update(msg, 0, msg.length);\n20 \n21         byte[] s = lmsSig.sign();\n\
  22 \n23         lmsSig.initVerify(kp.getPublic());\n24 \n25         lmsSig.update(msg,\
  \ 0, msg.length);\n26 \n27         System.err.println(\"LMS verified: \" + lmsSig.verify(s));\n\
  28     }\n29 }\n```\n\n### 使用 LMS 生成证书\n\n下面的代码按照 `RFC 8708` [133] 的概述，使用 LMS 生成一个\
  \ X.509 证书。在此情况下，我们修改了生成证书的方式，因为 `getIndex()` 被用序列号。这里是示例代码：\n\n```\n 1 /**\n 2\
  \  * 使用 SHA-512 作为树摘要的 LMS 基础示例。\n 3  */\n 4 public class LMSExample\n 5 {\n 6 \
  \    public static void main(String[] args)\n 7         throws GeneralSecurityException\n\
  \ 8     {\n 9         Security.addProvider(new BouncyCastlePQCProvider());\n10 \
  \        \n11         byte[] msg = Strings.toByteArray(\"hello, world!\");\n12 \n\
  13         KeyPair kp = generateLMSKeyPair();\n14 \n15         Signature lmsSig\
  \ = Signature.getInstance(\"LMS\", \"BCPQC\");\n16 \n17         lmsSig.initSign(kp.getPrivate());\n\
  18 \n19         lmsSig.update(msg, 0, msg.length);\n20 \n21         byte[] s = lmsSig.sign();\n\
  22 \n23         lmsSig.initVerify(kp.getPublic());\n24 \n25         lmsSig.update(msg,\
  \ 0, msg.length);\n26 \n27         System.err.println(\"LMS verified: \" + lmsSig.verify(s));\n\
  28     }\n29 }\n```\n*(注：由于原文中存在重复的段落，译文已根据逻辑进行了去重处理，确保内容连贯)*\n\n```\n 1 /**\n 2\
  \  * 使用 SHA-512 作为树摘要的 LMS 基础示例。\n 3  */\n 4 public class LMSExample\n 5 {\n 6 \
  \    /**\n 7      * 使用 LMS 私钥签名的证书\n 8      * 9      * @param privKey 使用的私钥\n10\
  \      * @param issuer 签发者名称\n11      * @param pubKey 关联的公钥\n12      * @param subject\
  \ 证书主体名称\n13      * @return X509 证书持有者\n14      */\n15     public static X509CertificateHolder\
  \ createLMSCertificate(\n16         LMSPrivateKey privKey, X500Name issuer,\n17\
  \         PublicKey pubKey, X500Name subject)\n18         throws OperatorException\n\
  19     {\n20         X509v1Builder certBldr = new JcaX509v1Builder(\n21        \
  \                             issuer,\n22                                     BigInteger.valueOf(privKey.getIndex())),\n\
  23                                     calculateDate(0),\n24                   \
  \                  subject,\n25                                     pubKey);\n26\
  \                                 \n27         ContentSigner signer = new JcaSignerBuilder(\"\
  LMS\")\n28                                 .setProvider(\"BCPQC\").build(privKey);\n\
  29 \n30         return certBldr.build(signer);\n31     }\n32 \n33     public static\
  \ void main(String[] args)\n34         throws Exception\n35     {\n36         Security.addProvider(new\
  \ BouncyCastlePQCProvider());\n37         \n38         X500Name name = new X500Name(\"\
  CN=LMS Demo Root\");\n39 \n40         KeyPair kp = generateLMSKeyPair();\n41   \
  \      LMSPrivateKey privKey = (LMSPrivateKey)kp.getPrivate();\n42 \n43        \
  \ // 我们放弃索引为 0 的签名 - RFC 5280 要求\n44         // 证书序列号大于 0。\n45         privKey.extractKeyShard(1);\n\
  46 \n47         X509CertificateHolder certHldr = createLMSCertificate(448      \
  \       privKey, name, kp.getPublic(), name);\n49 \n50         System.out.println(\"\
  key index: \" + privKey.getIndex());\n51         System.out.println(\"serial no:\
  \ \" + certHldr.getSerialNumber());\n52         System.out.println(\"sig index:\
  \ \" +\n53                        + getLMSSignatureIndex(certHldr.getSignature()));\n\
  54         System.out.println(\"verifies : \" + certHldr.isSignatureValid(\n55 \
  \            new JcaContentVerifierBuilder()\n56                 .setProvider(\"\
  BCPQC\").build(kp.getPublic())));\n57     }\n58 }\n```\n\n你会注意到在 52/53 行签名的索引被打印出来。执行此操作的代码简单，因为索引是签名的前\
  \ 4 个字节。这里是函数定义：\n\n```\n1   /**\n2    * 返回创建 LMS 签名时使用的索引。\n3    *\n4    * @return\
  \ 编码签名中使用的索引。\n5    */\n6   public static long getLMSSignatureIndex(byte[] lmsSig)\n\
  7   {\n8       return Pack.bigEndianToInt(lmsSig, 0) & 0xFFFFFFFFL;\n9   }\n```\n\
  \n\n\n\n签名中索引值（index number）的存在也提供了其他路径来判断某些情况是否出错以及索引是否以某种方式被重用。在我们观察的示例中，我们公开跟踪索引值，因为它也被用于证书的序列号。即使你使用了\
  \ `HSM`，对这些保持警惕也永远无坏处。\n\n当然，取决于你遵循的是哪种证书配置（certificate profile），可能会存在陷阱。某些配置要求证书序列号使用随机位生成器生成。如果你正在处理此类问题，请为\
  \ `CA` 分配一个随机种子，然后使用 `HMAC` 或 `XOF` 结合 `seed` 和 `key index` 作为输入来为证书生成序列号。虽然这创建了一个原始的\
  \ `DRBG`（确定性随机生成器），使得输出是不可预测且不可逆的，但这意味着你永远不会两次获得相同的序列号——除非你给函数提供了相同的输入，这将表明序列号被第二次使用。\n\
  \n如果你运行该示例且一切顺利，你应该能看到以下输出：\n\n```\nkey index: 2\nserial no: 1\nsig index: 1\nverifies\
  \ : true\n```\n\n显示存储在签名中的签名索引与作为证书序列号使用的索引相同。\n\n### HSS\n\n分层签名系统（`HSS`）提供了一种增加单个公钥可验证签名数量的方法，代价是增加了签名的大小和私钥的大小。本质上，创建了一个树的层次结构，但叶节点树用于对实际数据签名，而父树用于对叶节点树的公钥签名。\n\
  \n![HSS 的多树方法意味着树的低层根节点可以根据需要计算。](img/chapter15----HSS.png)\n\nHSS 的多树方法意味着树的低层根节点可以根据需要计算。\n\
  \n从表面上看，从 API 的角度来看，这意味着用法上的唯一区别是密钥对的生成，因为需要指定额外的子树。以下示例代码提供了生成 HSS 密钥对的函数，它使用了\
  \ 2 层树，深度均为 5，总深度为 10：\n\n```\n 1   /**\n 2    * 基于 SHA-256 生成树高为 10 的 HSS 密钥对。\n\
  \ 3    *\n 4    * @return 一个 HSS KeyPair\n 5    */\n 6   public static KeyPair generateHSSKeyPair()\n\
  \ 7       throws GeneralSecurityException\n 8   {\n 9       KeyPairGenerator kpg\
  \ = KeyPairGenerator.getInstance(\"LMS\", \"BCPQC\");\n10 \n11       kpg.initialize(new\
  \ LMSHSSKeyGenParameterSpec(\n12           new LMSKeyGenParameterSpec(LMSigParameters.lms_sha256_n32_h5,\n\
  13                                           LMOtsParameters.sha256_n32_w1),\n14\
  \           new LMSKeyGenParameterSpec(LMSigParameters.lms_sha256_n32_h5,\n15  \
  \                                         LMOtsParameters.sha256_n32_w1)));\n16\
  \ \n17       return kpg.generateKeyPair();\n18   }\n```\n\n这种方法的趣味性之处在于，如果你尝试这种方法并观察公钥编码的大小，你会发现该编码的大小与单层\
  \ LMS 密钥的大小相同。原因之前已经暗示过，即在于 `2` 级 HSS 密钥签名实际上是使用 HSS 公钥签名的子树公钥的编码，然后是由子树单次使用私钥生成的签名编码。因此，验证\
  \ HSS 签名所需的所有子树信息都包含在编码中，唯一缺失的信息是组成 HSS 层次结构的基树的公钥。\n\n无论如何，这意味着你会发现自己可以像之前应用基础\
  \ LMS 密钥一样应用 HSS 密钥。甚至不需要更改签名算法的名称。\n\n### XMSS\n\n`XMSS` 描述于 `RFC 8391` “XMSS:\
  \ 扩展 Merkle Signature 方案” [131]，该标准于 2018 年 5 月定型。\n\n`XMSS` 像 `LMS` 一样基于哈希，但使用了\
  \ `WOTS+` 原始（Winternitz 一次签名的扩展）。`WOTS+` 原始是一种通过取输入消息和单次使用的私钥来计算签名，并产生形成签名的哈希链的操作。在这种情况下，私钥是一组随机字节字符串，公钥也表示为针对构成私钥的随机字节字符串计算的哈希链。与我们之前看到的方案不同（之前的方案验证通常使用公钥和数据进行与签名匹配的计算），`WOTS+`\
  \ 签名的计算方式使得验证使用签名和数据来计算另一个哈希链，如果签名和数据确实相互相关并与原始私钥相关，该链将与构成公钥的哈希链对应。\n\n`XMSS` 有两种变体；第一种是基础\
  \ `XMSS`，它在单树哈希上运行；第二种是 `XMSS^MT`，它在若干层高度减小的 `XMSS` 树上运行。与 `XMSS` 配置相比，`XMSS^MT`\
  \ 配置允许更快的密钥生成（指数级）和更短的签名时间（线性）。另一方面，`XMSS^MT` 密钥对生成的签名大小上将线性增长。选择哪种方案取决于你希望什么样的权衡。\n\
  \n在 `XMSS` 的限制方面，私钥的使用次数限制为 `2^h`，其中 `h` 是树的高度。`XMSS^MT` 同时使用高度 `h` 和层数 `d` 进行配置，每层由高度为\
  \ `h / d` 的 XMSS 树组成（`d` 必须能整除 `h`）。顶层有一棵 XMSS 树，而底层有 `2^{(h - (h / d)}}` 棵树。底层之树用于签名下一层，底层的树用于签名实际消息，同样提供了\
  \ `2^h` 可能的签名。\n\n以下示例代码提供了一个生成 XMSS 密钥对的函数，其中 `h` 设置为 10。用于构建公钥和任何生成签名的哈希函数将 SHA-512。\n\
  \n```\n 1   /**\n 2    * 基于 SHA-512 生成树高为 10 的 XMSS 密钥对。\n 3    *\n 4    * @return\
  \ 一个 XMSS KeyPair\n 5    */\n 6   public static KeyPair generateXMSSKeyPair()\n\
  \ 7       throws GeneralSecurityException\n 8   {\n 9       KeyPairGenerator kpg\
  \ = KeyPairGenerator.getInstance(\"XMSS\", \"BCPQC\");\n10 \n11       kpg.initialize(XMSSParameterSpec.SHA2_10_512);\n\
  12 \n13       return kpg.generateKeyPair();\n14   }\n```\n\n注意，在 XMSS 密钥对生成的情况下，使用的哈希函数定义是树的属性。\n\
  \n在下面的代码中，我们看到如何对实际数据进行签名并验证生成的签名。\n\n\n\n\n\n```java\n /**\n  * 使用 SHA-512 作为树摘要的\
  \ XMSS 基础示例。\n  */\n public class XMSSExample\n {\n    public static void main(String[]\
  \ args)\n        throws GeneralSecurityException\n    {\n        byte[] msg = Strings.toByteArray(\"\
  hello, world!\");\n\n        KeyPair kp = generateXMSSKeyPair();\n\n        Signature\
  \ xmssSig = Signature.getInstance(\"XMSS\", \"BCPQC\");\n\n        xmssSig.initSign(kp.getPrivate());\n\
  \n        xmssSig.update(msg, 0, msg.length);\n\n        byte[] s = xmssSig.sign();\n\
  \n        xmssSig.initVerify(kp.getPublic());\n\n        xmssSig.update(msg, 0,\
  \ msg.length);\n\n        System.err.println(\"XMSS verified: \" + xmssSig.verify(s));\n\
  \    }\n}\n```\n\n你也可以看到算法描述为“XMSS”，在这种情况下，消息将直接哈希到签名中，预哈希（pre-hashing）按照通常的 JCA\
  \ 指定，例如“SHA512withXMSS”，其中用于计算消息哈希的摘要名称指定在签名算法的开头。Bouncy Castle 目前将预哈希摘要限制为构建哈希树时使用的摘要。虽然你可以指定一个与密钥生成时不同的摘要来计算形成\
  \ XMSS 算法签名消息的数据摘要，但使用相同的摘要更好。除了安全级别可能存在差异外，如果允许不同的算法，可能会出现一些异常情况。如果你还对摘要进行参数化，某些可能会认为不同的参数化可能适合他们的用途——SHA-256\
  \ 并不是产生 256 位摘要的唯一方法。\n\n假设一切运行正常，你应该会得到以下输出：\n\n```\nXMSS verified: true\n```\n\
  \n如果你想尝试在密钥对生成时调整树的高度，你会发现这确实会影响示例运行的时间。为 XMSS 或 `XMSS^MT` 的私钥设置一个合理的寿命也有助于系统性能。\n\
  \n## 使用 XMSS 的工作流\n\n与 LMS 类似，XMSS 私钥支持 `extractKeyShard()` 方法，并且有一个与私钥相关联的剩余使用次数计数，该计数最终会减到零。如果你尝试下一个示例，你将看到当密钥的使用计数为零时会发生什么。\n\
  \n```java\n /**\n  * XMSS 私钥使用次数耗尽的示例及影响。\n  */\n public class XMSSExceptionExample\n\
  \ {\n    public static void main(String[] args)\n        throws GeneralSecurityException\n\
  \    {\n        byte[] msg = Strings.toByteArray(\"hello, world!\");\n\n       \
  \ KeyPair kp = generateXMSSKeyPair();\n        XMSSPrivateKey privKey = (XMSSPrivateKey)kp.getPrivate();\n\
  \n        Signature xmssSig = Signature.getInstance(\"XMSS\", \"BCPQC\");\n\n  \
  \      // 这使用 extractKeyShard() 获取单次使用的密钥。\n        XMSSPrivateKey sigKey = privKey.extractKeyShard(1);\n\
  \        // 取消此行的注释以使示例完整\n//        sigKey = privKey.extractKeyShard(2);\n\n  \
  \      xmssSig.initSign(sigKey);\n\n        xmssSig.update(msg, 0, msg.length);\n\
  \n        byte[] s1 = xmssSig.sign();\n\n        // 这里的 0 值告诉我们该密钥无法再次使用。\n    \
  \    System.out.println(\"xmssSig usages remaining:\n                          \
  \           + sigKey.getUsagesRemaining());\n\n        xmssSig.update(msg, 0, msg.length);\n\
  \n        // 只有当调用 extractKeyShard() 时参数大于 1，此行才会起作用。\n        byte[] s2 = xmssSig.sign();\n\
  \n    }\n}\n```\n\n按照目前的实现运行示例将产生带有以下消息的异常：\n\n```\nException in thread \"main\"\
  \ java.security.SignatureException: no usages of private key remaining\n```\n\n\
  如果你移除第 19 行的注释字符（这将重新初始化密钥使其具有 2 次使用机会而不是现有的 1 次），你会发现示例将运行结束而不抛出异常，并产生使用计数消息。\n\
  \n## 使用 XMSS 生成证书\n\n以下代码按照 [73] 所示使用 XMSS 生成 X.509 证书。与 LMS 示例一样，此示例使用 `privKey.getIndex()`\
  \ 作为证书序列号的源。\n\n```java\n /**\n  * 构建基于 XMSS 的证书示例 - 此例中为自签名。\n  */\n public class\
  \ XMSSCertExample\n {\n    /**\n     * 创建由 XMSS 密钥签名的 X.509 证书，索引即序列号。\n     * @param\
  \ privKey 要使用的 XMSS 密钥。\n     * @param issuer 证书的颁发者。\n     * @param pubKey 证书中的公钥。\n\
  \     * @param subject 与公钥关联的名称。\n     * @return 一个 X509 证书持有者。\n     */\n     public\
  \ static X509CertificateHolder createXMSSCertificate(\n         XMSSPrivateKey privKey,\
  \ X500Name issuer,\n         PublicKey pubKey, X500Name subject)\n         throws\
  \ Exception\n    {\n        X509v1CertificateBuilder certBldr = new JcaX509v1CertificateBuilder(issuer,\n\
  \                                         BigInteger.valueOf(privKey.getIndex()));\n\
  \n        ContentSigner signer = new JcaSignerBuilder(\"XMSS\")\n              \
  \                   .setProvider(\"BCPQC\").build(privKey);\n\n        return certBldr.build(signer);\n\
  \    }\n\n    public static void main(String[] args)\n        throws Exception\n\
  \    {\n        X500Name name = new X500Name(\"CN=XMSS Demo Certificate\");\n\n\
  \        KeyPair kp = generateXMSSKeyPair();\n        XMSSPrivateKey privKey = (XMSSPrivateKey)kp.getPrivate();\n\
  \n        // 我们丢弃索引为 0 的签名 - RFC 5280 要求\n        // 序列号大于 0。\n        privKey.extractKeyShard(1);\n\
  \n        X509CertificateHolder certHldr = createXMSSCertificate(\n            \
  \                                 privKey, name, kp.getPublic(), name);\n\n    \
  \    System.out.println(\"key index: \" + privKey.getIndex());\n        System.out.println(\"\
  serial no: \" + certHldr.getSerialNumber());\n        System.out.println(\"sig index:\
  \ \"\n                        + getXMSSSignatureIndex(certHldr.getSignature()));\n\
  \        System.out.println(\"verifies : \" + certHldr.isSignatureValid(\n     \
  \       new JcaContentVerifierProviderBuilder()\n                .setProvider(\"\
  BCPQC\").build(kp.getPublic())));\n    }\n}\n```\n\n与 LMS 类似，索引数字是签名的前 4 个字节。以下是\
  \ `getXMSSSignatureIndex()` 方法的定义：\n\n```\n/**\n  * 返回创建 XMSS 签名时使用的索引。\n  *\n \
  \ * @return 编码签名的索引。\n  */\n  public static long getXMSSSignatureIndex(byte[] xmssSig)\n\
  \  {\n      return Pack.bigEndianToInt(xmssSig, 0) & 0xFFFFFFFFL;\n  }\n```\n\n\
  如果你运行示例且一切顺利，你将看到以下输出：\n\n```\nkey index: 2\nserial no: 1\nsig index: 1\nverifies\
  \ : true\n```\n\n这表明存储在签名中的签名索引与证书的序列号相同。\n\n\n\n\n我们在这里的示例中重点关注了 `XMSS`。`XMSS^MT`\
  \ 的用法基本上相同，只是将算法名称“XMSS”替换为“XMSSMT”。唯一的区别在于 `KeyPairGenerator` 的使用上，它需要使用 `XMSSMTParameterSpec`，该规范包含了高度\
  \ ![h](img/leanpub_equation_685.png) 和层数 ![d](img/leanpub_equation_686.png)。以下代码片段显示了如何创建一个\
  \ `XMSS^MT` 密钥对，其签名限制与我们之前生成的 `XMSS` 密钥对相同的 ![2^{20}](img/leanpub_equation_687.png)：\n\
  \n```\nKeyPairGenerator kpg = KeyPairGenerator.getInstance(\"XMSSMT\", \"BCPQC\"\
  );\n\n        kpg.initialize(new XMSSMTParameterSpec(20, 2, XMSSMTParameterSpec.SHA512));\n\
  \n        KeyPair kp = kpg.generateKeyPair();\n```\n\n`XMSSMTParameterSpec` 的第二个参数是层数，因此此示例将生成一个适用于\
  \ 2 层 `XMSS` 树的密钥对，每层的高度为 ![20 / 2](img/leanpub_equation_688.png)。这是标准参数集之一，也可以写为\
  \ `XMSSMTParameterSpec.XMSSMT_SHA2_20d2_512`。\n\n### 无状态签名算法\n\n正如“一次性签名”这一术语所暗示的（至少在这种情况下），你不想两次使用同一个私钥进行签名，因为这会削弱应用私钥的方案的整体安全性。这里可能出现的问题从简单到都有，例如对消息进行签名，但在更新的密钥持久化之前服务器崩溃了；或者某人从备份恢复系统时，没有意识到他们也在“回滚”私钥。取决于你的具体操作，这些问题通常都是可以管理的，例如通过在每次服务器启动时生成新密钥对等技术，或者定期持久化，并在生成任何发布签名之前跳过固定数量的密钥（假设在“从备份中恢复”事件时产生新密钥对）。\n\
  \n### 无状态哈希签名算法\n\n对于基于哈希的签名算法，Oded Goldreich [5] 提出了一种消除状态问题的方法，即在私钥中使用树的随机分支，并在分支重用风险变得不可接受的高时，通过停止使用私钥来让安全性“优雅地”降低。这种方法是基于\
  \ NIST PQC 决赛选手 SPHINCS+ [14] 构建的。\n\n### 查看 SPHINCS+\n\nSPHINCS+ 带我们回到了更熟悉的领域。该算法是无状态的，这意味着私钥不会随着生成的每个签名而改变。SPHINCS+\
  \ 通过将超大树上的一次性签名机制与“多次”签名机制相结合，并随机选择分支来实现此点的。\n\n在写本文时，SPHINCS+ 已被选为待标准化的决赛选手。标准化过程可能会减少目前提供的参数集数量，并可能添加一些适用于想要生成少量签名的用户的新参数集。SPHINCS+\
  \ 可以生成的最大签名数量为 ![2^{64}](img/leanpub_equation_689.png)，这是一个很大的数字。不过，这个最大值会影响密钥和签名的大小，SPHINCS+\
  \ 的关注领域之一是代码签名，因此人们在讨论是否总是需要如此大的范围——假设每月更新一次固件，1200 次签名可以让你使用 100 年，再乘以 100 倍以防意外，你离\
  \ ![2⁶⁴](img/leanpub_equation_690.png) 仍然很远。\n\n无论如何，重点在于虽然标准化后 SPHINCS+ 的示例示例感觉不太可能改变，但现实是这些参数及其用法很可能在\
  \ 2024 年年中尚未定论。\n\n以下方法将根据传入的参数规范生成 SPHINCS+ 密钥对。\n\n```\n/**\n * 生成一个 SPHINCS+\
  \ 密钥对。\n * \n * @param sphincsPlusParameterSpec 要使用的 SPHINCS+ 参数集。\n * @return 一个\
  \ SPHINCS+ 密钥对。\n */\npublic static KeyPair generateSPHINCSPlusKeyPair(\n    SPHINCSPlusParameterSpec\
  \ sphincsPlusParameterSpec)\n    throws GeneralSecurityException\n{\n    KeyPairGenerator\
  \ kpg = KeyPairGenerator.getInstance(\"SPHINCSPlus\", \"BCPQC\");\n    kpg.initialize(sphincsPlusParameterSpec,\
  \ new SecureRandom());\n\n    return kpg.generateKeyPair();\n}\n```\n\n一旦我们有了密钥对，就可以使用私钥进行签名生成。下面的方法允许对简单消息进行签名。\n\
  \n```\n/**\n * 使用传入的 SPHINCS+ 私钥和输入数据生成编码的 SPHINCS+ 签名。\n *\n * @param spxPrivate\
  \ 用于生成签名的私钥。\n * @param input 要签名的输入。\n * @return 编码的签名。\n */\npublic static byte[]\
  \ generateSPHINCSPlusSignature(\n    PrivateKey spxPrivate, byte[] input)\n    throws\
  \ GeneralSecurityException\n{\n    Signature signature = Signature.getInstance(\"\
  SPHINCSPlus\", \"BCPQC\");\n\n    signature.initSign(spxPrivate);\n    signature.update(input);\n\
  \    return signature.sign();\n}\n```\n等等，原文的代码块顺序不对或碎片化方式不同。我将按照提供的源结构重新对齐并应用格式规则。\n\
  \n```\n/**\n * @param spxPublic 签名创建者的公钥。\n * @param input 应该签名的输入。\n * @param encSignature\
  \ 编码的签名。\n * @return 如果签名通过验证则为 true，否则为 false。\n */\npublic static boolean verifySPHINCSPlusSignature(\n\
  \    PublicKey spxPublic, byte[] input, byte[] encSignature)\n    throws GeneralSecurityException\n\
  {\n    Signature signature = Signature.getInstance(\"SPHINCSPlus\", \"BCPQC\");\n\
  \n    signature.initVerify(spxPublic);\n    signature.update(input);\n\n    return\
  \ signature.verify(encSignature);\n}\n```\n从上面可以看出，它比我们看到的任何签名算法都不复杂。处理或担心状态问题已经过去了。最后，我们有一个简单方法来使用相应的公钥验证生成的签名。\n\
  \n### 基于格的签名算法\n\n目前签名类别中选定的另外两种算法是 CRYSTALS-Dilithium [19]（通常称为 Dilithium）和 Falcon\
  \ [18]。这些算法像 SPHINCS+ 一样都是无状态的，并且具有具名的参数。你可以在 `org.bouncycastle.pqc.jcajce.spec.DilithiumParameterSpec`\
  \ 中找到 Dilithium 的可用参数，在 `org.bouncycastle.pqc.jcajce.spec.FalconParameterSpec` 中找到\
  \ Falcon 的可用参数。\n\n\n\n\n`org.bouncycastle.pqc.jcajce.spec.FalconParameterSpec`。再次记住，这些算法尚未成为官方标准，但\
  \ Bouncy Castle 目前实现的内容将让你对它的未来的发展方向有一个良好的直观认识。\n\n由于两种算法的用法仅在参数选择上有所不同，我们在这里只看一个使用\
  \ Dilithium 的示例。对于 Falcon，你只需要将“Dilithium”替换为“Falcon”，并使用预定义的 `FalconParameterSpec`\
  \ 类之一即可。\n\n以下方法将根据给传入的参数规范（spec）生成一个 Dilithium 密钥对。\n\n```\n 1   /**\n 2    * 生成一个\
  \ Dilithium 密钥对。\n 3    * \n 4    * @param dilithiumPlusParameterSpec 要使用的 Dilithium\
  \ 参数集。\n 5    * @return 一个 Dilithium 密钥对。\n 6    */\n 7   public static KeyPair\
  \ generateDilithiumKeyPair(\n 8       DilithiumParameterSpec dilithiumPlusParameterSpec)\n\
  \ 9       throws GeneralSecurityException\n10   {\n11       KeyPairGenerator kpg\
  \ = KeyPairGenerator.getInstance(\"Dilithium\", \"BCPQC\");\n12       kpg.initialize(dilithiumPlusParameterSpec,\
  \ new SecureRandom());\n13 \n14       return kpg.generateKeyPair();\n15   }\n```\n\
  \n一旦我们有了密钥对，就可以使用私钥进行签名生成。下面的方法允许对简单的消息进行签名。\n\n```\n 1   /**\n 2    * 使用传入的 Dilithium\
  \ 私钥和输入数据生成编码的 Dilithium \n 3    * 签名。\n 4    *\n 5    * @param dilPrivate 用于生成签名的私钥。\n\
  \ 6    * @param input 要被签名的输入数据。\n 7    * @return 编码的签名。\n 8    */\n 9   public\
  \ static byte[] generateDilithiumSignature(\n10       PrivateKey dilPrivate, byte[]\
  \ input)\n11       throws GeneralSecurityException\n12   {\n13       Signature signature\
  \ = Signature.getInstance(\"Dilithium\", \"BCPQC\");\n14 \n15       signature.initSign(dilPrivate);\n\
  16 \n17       signature.update(input);\n18 \n19       return signature.sign();\n\
  20   }\n```\n\n最后，我们有一个简单的方法，用于使用私钥对应的公钥来验证生成的 Dilithium 签名。\n\n```\n 1   /**\n\
  \ 2    * 如果传入的 Dilithium 签名通过传入的 Dilithium \n 3    * 公钥和输入通过验证，则返回 true。\n 4   \
  \ *\n 5    * @param dilPublic 签名创建者的公钥。\n 6    * @param input 原本应该被签名的输入数据。\n 7\
  \    * @param encSignature 编码的签名。\n 8    * @return 如果签名通过验证，则返回 true，否则返回 false。\n\
  \ 9    */\n10   public static boolean verifyDilithiumSignature(\n11       PublicKey\
  \ dilPublic, byte[] input, byte[] encSignature)\n12       throws GeneralSecurityException\n\
  13   {\n14       Signature signature = Signature.getInstance(\"Dilithium\", \"BCPQC\"\
  );\n15 \n16       signature.initVerify(dilPublic);\n17 \n18       signature.update(input);\n\
  19 \n20       return signature.verify(encSignature);\n21   }\n```\n\nDilithium 参数现在都是命名的（至少目前是这样），因此将上述方法用于生成签名只需提供我们想要使用的命名参数规范，我们就可以利用之前描述的方法，如下所示示例代码所示：\n\
  \n```\n KeyPair dilKp = generateDilithiumKeyPair(\n                            \
  \      DilithiumParameterSpec.dilithium2);\n\n      byte[] dilithiumSignature =\
  \ generateDilithiumSignature(\n                      dilKp.getPrivate(), Strings.toByteArray(\"\
  hello, world!\"));\n\n      System.out.println(\"Dilithiun verified: \" + verifyDilithiumSignature(\n\
  \          dilKp.getPublic(), Strings.toByteArray(\"hello, world!\"),\n        \
  \                                        dilithiumSignature));\n```\n\n运行示例代码应该产生以下输出：\n\
  \n```\nDilithium verified: true\n```\n\n这表明签名验证正确。\n\n### 密钥封装机制 (Key Encapsulation\
  \ Mechanisms)\n\nBouncy Castle 以两种方式支持密钥封装机制 (KEM)。一种是作为其他密钥的传输机制，通过 `Cipher` 类及其密钥封装（key\
  \ wrapping）功能实现。另一种是作为种子生成机制，由 KEM 生成的种子密钥可以直接使用。后者通过 `KeyGenerator` 类实现。这两种方法都可用于此处列出的所有\
  \ KEM 算法。\n\n#### Classic McEliece\n\nClassic McEliece [16] 现在已移动到 NIST 密钥封装机制算法竞赛的第\
  \ 4 轮。除了可能是 PQC 竞赛中研究最充分的算法之一外，由于其历史久远（追溯到 1970 年代），它也受到关注，因为该算法的第 3 版本也已被德国 BSI\
  \ 接受 [15]$。\n\nClassic McEliece 的密钥对生成允许使用命名参数类型生成密钥，这些类型代表 128 位、192 位和 256 位安全性。总共有\
  \ 10 组命名参数集，其强度如下表所示：\n\n| 参数集 | 安全性 (位) | 密钥大小 (字节) | 密文 (字节) |\n| --- | --- |\
  \ --- |\n| mceliece3864 | 128 | 261 | 128 |\n| mceliece4096 | 128 | 273 | 128 |\n\
  | mceliece4608 | 192 | 330 | 192 |\n| mceliece5293 | 192 | 346 | 192 |\n| mceliece6960\
  \ | 192 | 438 | 192 |\n| mceliece8192 | 192 | 468 | 192 |\n| mceliece6688 | 256\
  \ | 564 | 256 |\n| mceliece10368 | 256 | 672 | 256 |\n| mceliece12960 | 256 | 679\
  \ | 256 |\n| mceliece16384 | 256 | 801 | 256 |\n\nClassic McEliece 在 BC 提供程序中通过算法名称“CMCE”引用。在我们可以对该算法进行任何操作之前，首先需要生成一对。可以通过使用以下提供的参数规范来实现：\n\
  \n```\n 1   /**\n 2    * 生成一个密钥对。\n * 3    *\n 4    * @param cmceParameters 要使用的\
  \ CMCE 参数集。\n 5    * @return 一个 Classic McEliece 密钥对。\n 6    */\n 7   public static\
  \ KeyPair cmceGenerateKeyPair(CMCEParameterSpec cmceParameters)\n 8       throws\
  \ GeneralSecurityException\n 9   {\n10       KeyPairGenerator kpg = KeyPairGenerator.getInstance(\"\
  CMCE\", \"BCPQC\");\n11       kpg.initialize(cmceParameters, new SecureRandom());\n\
  12 \n13       return kpg.generateKeyPair();\n14   }\n```\n\n`CMCEParameterSpec`\
  \ 包含了所有 10 个参数集。除了可以使用 `CMCEParameterSpec` 外，CMCE `KeyPairGenerator` 还可以接受 Java\
  \ 11 添加到 Java 安全 API 的 `NamedParameterSpec` 类。\n\n对于 Classic McEliece，我们将查看通过 `Cipher`\
  \ 类使用 KEM，在这种情况下，内部生成的密钥将用于生成一个对称封装密钥，用于加密被封装的密钥。这两个密文随后会被拼接并发送。正如如下为发起者编写的示例所示，拼接将在内部发生，并返回单个字节数组。\n\
  \n```java\n1public static byte[] cmceGeneratePartyU(PublicKey vPubKey, SecretKey\
  \ secKey)\n2       throws GeneralSecurityException\n3   {\n4       Cipher cipher\
  \ = Cipher.getInstance(\"CMCE\", \"BCPQC\");\n5 \n6       cipher.init(Cipher.WRAP_MODE,\
  \ vPubKey, new SecureRandom());\n7 \n8       return cipher.wrap(secKey);\n9   }\n\
  ```\n\n在我们生成了加密密钥和封装密钥的密文后，我们将密文传递给接收者，他们反向操作，解密密钥，生成封装密钥，最后解封装被封装的密钥并将其返回。所有这些工作也都是在\
  \ `Cipher` 内部完成，这意味着解封装代码可以写如下：\n\n\n\n\n\n```\n public static SecretKey cmceGeneratePartyV(\n\
  \      PrivateKey vPriv, byte[] encapsulation, String keyAlgorithm)\n      throws\
  \ GeneralSecurityException\n  {\n      Cipher cipher = Cipher.getInstance(\"CMCE\"\
  , \"BCPQC\");\n\n      cipher.init(Cipher.UNWRAP_MODE, vPriv);\n\n      return (SecretKey)cipher.unwrap(\n\
  \                      encapsulation, keyAlgorithm, Cipher.SECRET_KEY);\n  }\n```\n\
  \n最后，这是一个完整流程的示例，展示了 Classic McEliece 密钥对的生成以及 128 位 AES 密钥的封装与解封装。\n\n```\n KeyPair\
  \ kp = cmceGenerateKeyPair(CMCEParameterSpec.mceliece348864);\n      SecretKey aesKey1\
  \ = new SecretKeySpec(\n                  Hex.decode(\"000102030405060708090a0b0c0d0e0f\"\
  ), \"AES\");\n\n      byte[] encKey = cmceGeneratePartyU(kp.getPublic(), aesKey1);\n\
  \n      SecretKey aesKey2 = cmceGeneratePartyV(kp.getPrivate(), encKey, \"AES\"\
  );\n\n      System.out.println(\"keys match: \"\n          + Arrays.areEqual(aesKey1.getEncoded(),\
  \ aesKey2.getEncoded()));\n```\n\n并且，假设没有出现错误，运行上述代码段应该产生：\n\n```\nkeys match: true\n\
  ```\n\n表明 AES 密钥已通过密文正确传输。\n\n示例中使用的参数集 `mceliece348864` 具有 128 位的安全强度，并产生 1024\
  \ 位的密文。由 `cmceGeneratePartyU` 返回的组合密文总长度为 1216 位——其中 1024 位用于加密的密钥，192 位用于封装的密钥。正如你可能意识到的，正是\
  \ Classic McEliece 关联的短密文以及其健壮性是它受关注的原因。如果你切换到更安全的参数集（例如 `mceliece6960119`）并封装一个\
  \ 256 位 AES 密钥，你会发现总密文的大小仅增加到 2128 位，仅略大于 2048 位，但提供了比 2048 位 RSA 更高的安全级别（后者目前估计的安全性仅为\
  \ 112 位）。\n\n我们现在将看一个如何结合 KEM 使用 `KeyGenerator` 类的示例。Classic McEliece 也支持此操作，但出于兴趣考虑，我们将看一个使用\
  \ FrodoKEM 的示例。\n\n### FrodoKEM\n\nFrodoKEM [17] 最初是 NIST 密钥封装机制备选候选算法之一。它也值得关注，因为该算法的第\
  \ 3 版本已被德国的 BSI 接受 [15]，所以虽然它在 NIST 流程中被淘汰了，但可能仍有生命力。该算法有两个版本，区别在于与密钥对关联的公矩阵的生成方式——一种使用\
  \ `AES` 原语，另一种则基于 `SHAKE`。\n\n`FrodoKEM` 的密钥对生成允许生成代表 128 位、192 位和 256 位安全性的命名参数类型的密钥，分别产生公钥大小为\
  \ 96、152 和 200 字节的密钥。考虑到这两个版本，这组成了六组可以用于生成密钥对的参数集。如下示例所示，生成密钥对只需传入相应的参数集。\n\n```\n\
  \ public static KeyPair frodoGenerateKeyPair(FrodoParameterSpec frodoParameters)\n\
  \      throws GeneralSecurityException\n  {\n      KeyPairGenerator kpg = KeyGenerator.getInstance(\"\
  Frodo\", \"BCPQC\");\n      kpg.initialize(frodoParameters, new SecureRandom());\n\
  \      return kpg.generateKeyPair();\n  }\n```\n\nFrodoKEM 的 `KeyPairGenerator`\
  \ 还可以接受添加到 Java Security 中的 `NamedParameterSpec` 类。虽然 FrodoKEM 也支持我们在 Classic McEliece\
  \ 中看到的机制，但在本示例中，我们将查看一个使用 KEM 操作的密钥交换发起者，其中由 KEM 生成的密钥将用于其他用途。由于我们想要直接访问 KEM 生成的密钥，我们使用\
  \ `KeyGenerator` 类和 `KEMGenerateSpec`，后者接收接收者的公钥并使用 KEM 生成封装和密钥，并将其以实现 `SecretKeyWithEncapsulation`\
  \ 的对象形式返回给我们。\n\n```\n public static SecretKeyWithEncapsulation frodoGeneratePartyU(PublicKey\
  \ vPubKey)\n      throws GeneralSecurityException\n  {\n      KeyGenerator keyGen\
  \ = KeyGenerator.getInstance(\"Frodo\", \"BCPQC\");\n      keyGen.init(new KEMGenerateSpec(vPubKey,\
  \ \"AES\"), new SecureRandom());\n      return (SecretKeyWithEncapsulation)keyGen.generateKey();\n\
  \  }\n```\n\n`SecretKeyWithEncapsulation` 上的 `getEncoded()` 方法返回封装生成的密钥。`SecretKeyWithEncapsulation`\
  \ 类还有一个 `getEncapsulation()` 方法，返回用于发送给接收者的种子加密结果。`SecretKeyWithEncapsulation` 还实现了\
  \ `Destroyable`，因此在不再需要时可以擦除对象的内容。在接收方，我们仍然使用 `KeyGenerator` 类，但这次使用了 `KEMExtractSpec`，它使用接收者的私钥和从发起者处收到的封装。\n\
  \n```\n public static SecretKeyWithEncapsulation frodoGeneratePartyV(PrivateKey\
  \ vPriv, byte[] encapsulation)\n      throws GeneralSecurityException\n  {\n   \
  \   KeyGenerator keyGen = KeyGenerator.getInstance(\"Frodo\", \"BCPQC\");\n    \
  \  keyGen.init(new KEMExtractSpec(vPriv, encapsulation, \"AES\"), new SecureRandom());\n\
  \      return (SecretKeyWithEncapsulation)keyGen.generateKey();\n  }\n```\n\n正如你所见，为了一致性，该方法再次返回\
  \ `SecretKeyWithEncapsulation`。我们可以将这些方法结合在一起，提供一个使用 FrodoKEM 进行密钥交换的短示例。如果你想自己尝试，可以使用以下：\n\
  \n```\n KeyPair kp = frodoGenerateKeyPair(FrodoParameterSpec.frodokem64);\n\n  \
  \    SecretKeyWithEncapsulation secEnc1 = frodoGeneratePartyU(kp.getPublic());\n\
  \n      SecretKeyWithEncapsulation secEnc2 = frodoGeneratePartyV(kp.getPrivate(),\
  \ secEnc1.getEncapsulation());\n\n      System.out.println(\"secrets match: \"\n\
  \          + Arrays.areEqual(secEnc1.getEncoded(), secEnc2.getEncoded()));\n```\n\
  \n假设一切顺利，你应该看到：\n\n```\nsecrets match: true\n```\n\n表明封装已成功生成并解密。如果你想从该密钥生成一个密钥，而不仅仅是加密“随机数据”（即另一个密钥或私钥），正如我们之前在\
  \ Classic McEliece 中看到的密钥传输机制那样，该密钥非常适合作为 KDF 或类似 SHAKE 的 XOF 的输入。我们稍后在讨论混合加密时会看到相关的示例。修改示例以尝试不同的参数也是值得的。在\
  \ Bouncy Castle 中，你会发现密钥的大小随参数安全级别的改变而改变，位强度反映了参数的安全强度。\n\n### CRYSTALS-Kyber\n\n\
  我们在这个类别中看到的最后一个算法是 CRYSTALS-Kyber [20]，它是 CRYSTALS-Dilithium 的 KEM 相关算法。与 Dilithium\
  \ 一样，CRYALS-Kyber 通常被称为 Kyber。\n\nKyber 也被选中标准化。在写作期间，它是唯一被中的 PQC KEM 算法。目前正在进行第四轮讨论，因此预计很快会有更多算法加入列表。与后量子签名算法一样，请注意“选中”并不等同于“标准化”，因此算法参数可能会发生一些变化。\n\
  \n\n\n\n如如下例所示，除了 Kyber 的参数规范选择和密钥对名称生成外，其过程与 FrodoKEM 的流程几乎相同：\n\n```\n1   public\
  \ static KeyPair kyberGenerateKeyPair(KyberParameterSpec kyberParameters)\n2   \
  \    throws GeneralSecurityException\n3   {\n4       KeyPairGenerator kpg = KeyPairGenerator.getInstance(\"\
  Kyber\", \"BCPQC\");\n5       kpg.initialize(kyberParameters, new SecureRandom());\n\
  6 \n7       return kpg.generateKeyPair();\n8   }\n```\n\nKyber 也可以配合 `Cipher` 类使用，但在这种情况下，我们将限制为使用\
  \ `KeyGenerator`。我们这样做是因为在我们在本章节稍后讨论的混合加密时，将会用到 `PartyU` 和 `PartyV` 方法。\n\n这里是 Kyber\
  \ 的 `PartyU`（即发起者）方法。与之前一样，该方法使用 `Kyber` 公钥和 `SecureRandom` 来生成共享密钥以及一个从公钥和共享密钥值派生的封装（encapsulation）。\n\
  \n```\n1   public static SecretKeyWithEncapsulation kyberGeneratePartyU(PublicKey\
  \ vPubKey)\n2       throws GeneralSecurityException\n3   {\n4       KeyGenerator\
  \ keyGen = KeyGenerator.getInstance(\"Kyber\", \"BCPQC\");\n5 \n6       keyGen.init(new\
  \ KEMGenerateSpec(vPubKey, \"AES\"), new SecureRandom());\n7 \n8       return (SecretKeyWithEncapsulation)keyGen.generateKey();\n\
  9   }\n```\n\n接下来是 `PartyV`（即响应者/接收者）方法。\n\n```\n 1   public static SecretKeyWithEncapsulation\
  \ kyberGeneratePartyV(\n 2       PrivateKey vPriv, byte[] encapsulation)\n 3   \
  \    throws GeneralSecurityException\n 4   {\n 5       KeyGenerator keyGen = KeyGenerator.getInstance(\"\
  Kyber\", \"BCPQC\");\n 6 \n 7       keyGen.init(new KEMExtractSpec(vPriv, encapsulation,\
  \ \"AES\"));\n 8 \n 9       return (SecretKeyWithEncapsulation)keyGen.generateKey();\n\
  10   }\n```\n\n与 FrodoKEM 示例一样，我们使用 `Kyber` 私钥恢复由发起者生成的共享密钥。\n\n最后，这里是一个使用 Kyber\
  \ 进行密钥种子交换的简化示例——你可能已经意识到，它与 FrodoKEM 几乎相同。如果你想自己尝试，请尝试运行以下代码：\n\n```\n KeyPair\
  \ kp = kyberGenerateKeyPair(KyberParameterSpec.Kyber1024);\n\n      SecretKeyWithEncapsulation\
  \ secEnc1 = kyberGeneratePartyU(kp.getPublic());\n\n      SecretKeyWithEncapsulation\
  \ secEnc2 = kyberGeneratePartyV(\n                          kp.getPrivate(), secEnc1.getEncapsulation());\n\
  \n      System.out.println(\"secrets match: \"\n          + Arrays.areEqual(secEnc1.getEncoded(),\
  \ secEnc2.getEncoded()));\n```\n\n如果派生和解封装过程运行正常，当你运行代码片段时，你应该看到：\n\n```\nsecrets\
  \ match: true\n```\n\n这表明双方再次能够派生出相同的密钥。\n\n### 混合加密\n\n虽然新算法的出现意味着帮助已经在路上了，但另一个备受关注的想法是混合加密领域，在该领域中，使用后量子算法（PQC）来对现有加密方案进行量子加固。对于希望获得消息长期保护的情况，这非常有用，因为现在增加一些量子硬性被认为可以消除日后进行重新加密的需求。\n\
  \n为了让你了解其工作原理，值得重新回顾 EC 密钥协商，因为该机制非常适合并行使用额外的算法。随着 NIST SP 800-56C Rev. 2 [31] 的发布，现在还有两种认可的、认证合规的机制用于添加外部\
  \ PQC 算法，这在现在尤为重要，因为我们可能等到 2024 年才能看到认证的 KEM 算法。我们将首先查看使用 `OtherInfo` 结构和 NIST SP\
  \ 800-56C 的方法。\n\n#### 使用 OtherInfo 的混合加密 - 设置\n\n为了提供一个混合加密的现成示例，我们将提供一个简单的类来生成\
  \ EC 密钥对，作为混合方案的基础。\n\n```\n 1   public class KasParty\n 2   {\n 3       protected\
  \ final KeyPair kp;\n 4 \n 5       KasParty(SecureRandom random)\n 6           throws\
  \ GeneralSecurityException\n 7       {\n 8           KeyPairGenerator kpGen = KeyPairGenerator.getInstance(\"\
  EC\", \"BC\");\n 9 \n10           kpGen.initialize(new ECGenParameterSpec(\"P-256\"\
  ), random);\n11 \n12           this.kp = kpGen.generateKeyPair();\n13       }\n\
  \ 14 \n15       public PublicKey getPublic()\n 16       {\n 17           return\
  \ kp.getPublic();\n 18       }\n19   }\n```\n\n在这种情况下我们将使用 `Kyber` PQC 加密算法，尽管其他算法（如\
  \ `FrodoKEM`）也可以。\n\n生成器需要两个扩展类而不是一个，来实现 U 和 V 双方之间协商的双方。其原因是发起者侧（或 U 方）将产生公钥，而响应者侧（或\
  \ V 方）将产生包含封装密钥值的封装，而 U 方必须提取该值。\n\n我们将查看 U 端。\n\n#### 使用 OtherInfo 的混合加密 - U 端\n\
  \n以下代码实现了协商的 U 端。\n\n```\n1   public class PartyU\n 2   extends KasParty\n 3   {\n\
  \ 4       PQCOtherInfoGenerator.PartyU infoGenerator;\n 5 \n6       PartyU(SecureRandom\
  \ random, byte[] uInfo, byte[] vInfo)\n 7           throws GeneralSecurityException\n\
  \ 8       {\n 9           super(random);\n10 \n11           infoGenerator = new\
  \ PQCOtherInfoGenerator.PartyU(\n12               KyberParameters.kyber512,\n13\
  \               newAlgorithmIdentifier(NISTObjectIdentifiers.id_sha256),\n14   \
  \            uInfo, vInfo, random);\n15       }\n 16 \n17       /**\n18        *\
  \ 返回用于 NewHope 协商的启动者阶段 1 值。\n19        * @return 基于 New 钥的字节数组。\n20        */\n\
  21       public byte[] doStage1()\n22       {\n23           return infoGenerator.getSuppPrivPartA();\n\
  24       }\n 25 \n26       /**\n27        * 根据 V 方的响应返回 KDF 生成的协商值。\n28        *\n\
  29        * @param otherKey V 方的 EC 密钥。\n30        * @param partBInfo V 方的 NewHope\
  \ 响应。\n31        * @return 协商的 KDF 生成密钥。\n32        */\n33       public byte[] doAgreement(PublicKey\
  \ otherKey, byte[] partBInfo)\n34           throws GeneralSecurityException, IOException\n\
  35       {\n36           KeyAgreement agreement = KeyAgreement.getInstance(\n37\
  \                                       \"ECCDHwithSHA256KDF\", \"BC\");\n38 \n\
  39           agreement.init(kp.getPrivate(),\n40               new UserKeyingMaterialSpec(\n\
  41                       infoGenerator.generate(partBInfo).getEncoded()));\n42 \n\
  43           agreement.doPhase(otherKey, true);\n44 \n45           return agreement.generateSecret();\n\
  46       }\n47   }\n```\n\n你可以看到此此的核心区别在于使用了 `PQCOtherInfoGenerator` 类——在本例中为 `PartyU`\
  \ 分支。`PQCOtherInfoGenerator.PartyU` 类用于在交换期间提供传递给 V 方的额外“阶段 1”值。`infoGenerator`\
  \ 对象还用于处理 V 方的响应，以生成包含在 KDF 中的用户密钥材料，从而产生最终的协商值。\n\n#### 使用 OtherInfo 的混合加密 - V\
  \ 端\n\n这里是实现 V 端协商的代码。\n\n\n\n\n```java\n 1   public class PartyV\n 2       extends\
  \ KasParty\n 3   {\n 4       PQCOtherInfoGenerator.PartyV infoGenerator;\n 5 \n\
  \ 6       PartyV(SecureRandom random, byte[] uInfo, byte[] vInfo)\n 7          \
  \ throws GeneralSecurityException\n 8       {\n 9           super(random);\n10 \n\
  11           infoGenerator = new PQCOtherInfoGenerator.PartyV(\n12             \
  \  KyberParameters.kyber512,\n13               new AlgorithmIdentifier(NISTObjectIdentifiers.id_sha256),\n\
  14               uInfo, vInfo, random);\n15       }\n16 \n17       /**\n18     \
  \   * 返回基于 NewHope 的对 U 初始值的响应。\n19        *\n20        * @param partAInfo 基于 NewHope\
  \ 的已约定响应。\n21        * @return 传递给 U 的响应值。\n22        */\n23       public byte[]\
  \ doStage2(byte[] partAInfo)\n24       {\n25           return infoGenerator.getSuppPrivInfoPartB(partAInfo);\n\
  26       }\n27 \n28       /**\n29        * 返回基于 U 公钥的 KDF 生成的约定值。\n30        *\n\
  31        * @param otherKey U 方的 EC 密钥。\n32        * @return 从约定中通过 KDF 生成的密钥。\n\
  33        */\n34       public byte[] doAgreement(PublicKey otherKey)\n35       \
  \    throws GeneralSecurityException, IOException\n36       {\n37           KeyAgreement\
  \ agreement = KeyAgreement.getInstance(\n38                                    \
  \           \"ECCDHwithSHA256KDF\", \"BC\");\n39 \n40           agreement.init(kp.getPrivate(),\
  \ new UserKeyingMaterialSpec(\n41                                   infoGenerator.generate().getEncoded()));\n\
  42 \n43           agreement.doPhase(otherKey, true);\n44 \n45           return agreement.generateSecret();\n\
  46       }\n   }\n```\n\n正如你可能已经预料到的样，该类还使用了一个 `infoGenerator` 对象。这次是从 `PQCtherInfoGenerator.PartyV`\
  \ 创建的。你会注意到这种情况的不同之处，`infoGenerator` 对象需要来自 U 方通过其 `doStage1()` 方法提供的输入，以便通过 `doStage2()`\
  \ 方法提供阶段 2 响应。同样，`infoGenerator` 对象也用于生成用户密钥材料规范（user keying material spec），并包含在\
  \ KDF 中以生成最终的约定值。在这种情况下，没有内容传递给 `infoGenerator`，因为 U 方阶段 1 数据的处理是在 `doStage2()`\
  \ 方法中完成的。\n\n### 使用 OtherInfo 的混合加密 - 整合在一起\n\n这是一个两个类结合使用进行约定的示例，其中包含了对 `PQCOtherInfoGenerator`的使用。\n\
  \n```java\n SecureRandom random = new SecureRandom();\n\n      byte[] partyUId =\
  \ Strings.toByteArray(\"PartyU\");\n      byte[] partyVId = Strings.toByteArray(\"\
  PartyV\");\n\n      PartyU partyU = new PartyU(random, partyUId, partyVId);\n\n\
  \      PartyV partyV = new PartyV(random, partyUId, partyVId);\n\n      System.out.println(Hex.toHexString(\n\
  \          partyU.doAgreement(partyV.getPublic(),\n                      partyV.doStage2(partyU.doStage1()))));\n\
  \      System.out.println(Hex.toHexString(\n          partyV.doAgreement(partyU.getPublic())));\n\
  ```\n\n为了简洁起见，该示例有些过于简化——在这种情况下，你会预期阶段 1 和阶段 2 的值在约定过程中通过网络进行交换。这意味着，如果你想进行单次约定（one\
  \ pass agreement），它只能从 V 到 U，因为 U 除了其公钥外，还需要预先发布其阶段数据。尽管如此，额外的努力应该使攻击密钥约定变得困难得多，因为混合到生成共享密钥的\
  \ KDF 中的信息部分将包含使用 `Kyber`（在本例中）计算出的约定值。\n\n从代码中可以看出，示例仅以十六进制字符串的形式打印共享密钥。由于该算法使用了随机种子，你可能看不到我们这里呈现的输出值。你应该会看到长度相似的输出，并且由两行相同的行组成。我们最近的运行产生了：\n\
  \n```\ncd40dc777d3ce109f84660132ebeb52268c2a5aaa2b17a232c397b6d3b33e94c\ncd40dc777d3ce109f84660132ebeb52268c2a5aaa2b17a232c397b6d3b33e94c\n\
  ```\n\n表明 U 方约定的结果与 V 方约定的结果相同。虽然你会看到不同的值，但你应该看到两行都具有与我们所操作相同的不同值。\n\n## 混合加密 -\
  \ 发生了什么\n\n能够用标准的相同的术语来描述这个过程是有用的。在这种情况下，我们实际上是在利用 NIST 文档 `SP 800-56A` 中定义的字段。\n\
  \n（注：原文此处存在大量重复段落，已根据要求去重处理）\n\n\n\n\n```java\n   /**\n    * Generate an agreed\
  \ AES key value of 256 bits in length\n    * using both UKM and a T value.\n   \
  \ *\n    * @param aPriv Party A's private key.\n    * @param bPub Party B's public\
  \ key.\n    * @param tValue T value to create Z || T.\n    * @param keyMaterial\
  \ user keying material to mix with Z || T.\n    * @return the generated AES key\
  \ (256 bits).\n    */\n   public static SecretKey ecGenerateHybridAESKey(\n    \
  \   PrivateKey aPriv, PublicKey bPub, byte[] tValue, byte[] keyMaterial)\n     \
  \  throws GeneralSecurityException\n   {\n       KeyAgreement agreement =\n    \
  \       KeyAgreement.getInstance(\"ECCDHwithSHA256KDF\", \"BC\");\n\n       agreement.init(aPriv,\
  \ new HybridValueParameterSpec(\n               tValue, new UserKeyingMaterialSpec(keyMaterial)));\n\
  \n       agreement.doPhase(bPub, true);\n\n       return agreement.generateSecret(\"\
  AES\");\n   }\n```\n\n如你所见，`HybridValueParameterSpec` 仅仅是一个包装类，内部 Bouncy Castle\
  \ KAS 实现会获取 ![T](img/leanpub_equation_697.png) 值，然后剥离 `HybridValueParameterSpec`，将内部的算法参数规范传递给实现内部的\
  \ KDF 生成器。\n\n计算 ![T](img/leanpub_equation_698.png) 仍然需要使用另一种机制，无论是 KAS 还是 KEM。下面的示例代码展示了结合\
  \ CRYSTALS-Kyber KEM 算法使用 `HybridValueParameterSpec`。\n\n```java\n // PartyU\n \
  \     KeyPair ecKpU = EcUtils.generateECKeyPair(\"P-256\");\n\n      // PartyV,\
  \ 在此情况下也有 PQC 密钥对。\n      KeyPair ecKpV = EcUtils.generateECKeyPair(\"P-256\");\n\
  \      KeyPair qKpV = KyberKEMExample.kyberGenerateKeyPair(\n                  \
  \       KyberParameterSpec.kyber512);\n\n      // 用户密钥材料 - 共享。\n      byte[] ukm\
  \ = Hex.decode(\"030f136fa7fef90d185655ed1c6d46bacdb820\");\n\n      SecretKeyWithEncapsulation\
  \ secEncU = KyberKEMExample.kyberGeneratePartyU(\n                             \
  \                               qKpV.getPublic());\n\n      SecretKey secKeyU =\
  \ ecGenerateHybridAESKey(\n            ecKpU.getPrivate(), ecKpV.getPublic(), secEncU.getEncoded(),\
  \ ukm);\n\n      SecretKeyWithEncapsulation secEncV = KyberKEMExample.kyberGeneratePartyV(\n\
  \                               qKpV.getPrivate(), secEncU.getEncapsulation());\n\
  \n      SecretKey secKeyV = ecGenerateHybridAESKey(\n          ecKpV.getPrivate(),\
  \ ecKpU.getPublic(), secEncV.getEncoded(), ukm);\n\n      System.out.println(\"\
  U and V Shared Key equal: \" +\n              Arrays.areEqual(secKeyU.getEncoded(),\
  \ secKeyV.getEncoded()));\n```\n\n虽然在这种情况下，接收者 ![V](img/leanpub_equation_699.png)\
  \ 是拥有 PQC 密钥对的人，但这种机制运行的唯一要求是至少有一个有一个可使用的 PQC 公钥。请记住，这意味着协议中可能存在额外的密钥交换，而且 PQC 公钥的尺寸通常比我们习惯的要大一些。例如，如果你在使用\
  \ Classic McEliece 寻找 256 位安全性，虽然密文相当小，但公钥大小超过了 1MB！这需要仔细思考。\n\n### 总结\n\n由于量子计算机的发展，公钥加密的重大更新正向我们走。遗憾的是，即使你是一个“量子怀疑论者”，认为自己很快不会看到量子计算机，但现实是针对\
  \ RSA 和 EC 等算法的经典攻击也在改进。\n\n为了应对这一变化，NIST 一直在举办后量子密码学（PQC）竞赛，以产生能够防御基于量子计算机攻击的新算法。该竞赛将于\
  \ 2024 年开始产生实际标准。在此期间，对于签名，有两种量子安全签名算法——LMS 和 XMSS，现在就可以使用（需谨慎使用，因为它们也是有状态的）。竞赛还产生了一些实用的\
  \ KEM（密钥封装机制）算法，它们现在可以用于短期加密协议，例如那些使用混合密码学的协议。虽然目前发布的无状态签名算法和 KEM 仍在演进中，但已发布的算法如果你想尝试\
  \ PQC 密码学将提供了一个非常好的入门。\n\n是的，书到这里结束了，但这个话题绝非结束。毫无疑问，未来会有更多的算法和见解。感谢阅读，祝我们所有人好运！\n\
  \n## 附录 A：ASN.1 和 Bouncy Castle\n\n大多数涉及密码学的标准都使用 ASN.1（抽象语法表示法），它主要是一种用于描述对象如何编码以传输的语言。算法参数、密钥、签名、已签名和加密的消息，你能想到的都有！很有可能会有一个\
  \ ASN.1。\n\n### 基础 ASN.1 语法\n\n幸运的是，我们需要处理的 ASN.1 语法部分相对简单，真正的乐趣在于使用编码规则。我们在这里来看一下基本元素。\n\
  \n#### 注释语法\n\nASN.1 有两种不同的注释样式：一种用于块注释，由 `/*` 和 `*/` 隔开；另一种是用于单行注释，以 `--` 开始并结束。\n\
  \n与 Java 不同，块注释是可以嵌套的，但由于块语法也是 ASN.1 较新引入的特性，你经常会看到使用多行单行注释来替代本该使用块注释的地方。\n\n\n\n\
  \n\nASN.1 对象标识符（OID）的引入是为了构建一个全局唯一的命名空间。OID 由一组由点（‘.’）分隔的数字列表组成，理解其工作原理最好的方式是：OID\
  \ 的结构遵循一条路径（通常称为“弧”，arc），穿过一个由 3 个主分支扩展的树。对于这 3 个主分支下的任何组织，都存在进一步扩展该树，这允许任何组织或个人分配一个\
  \ OID，然后他们可以对其进行扩展，以便为算法、数据类型和算法参数等内容提供唯一标识符，并可以与他人共享。\n\n三个主分支根据组织最初在 ISO/ITU-IT\
  \ 世界中的所属位置进行分配：数字 `0` 分配给 `ITU-T`，数字 `1` 分配给 `ISO`，数字 `2` 分配给 ISO/ITU-T 联合组织。之后的编号系统是任意的，取决于前一个\
  \ OID 所有者的分配，该 OID 代表了新 OID 所分配的分支。\n\n例如，NIST 使用 SHA3-512 的 ECDSA 的 NIST OID 为\
  \ `2.16.840.1.101.3.4.3.12`，其长格式描述如下：\n\n```\n{ joint-iso-itu-t(2) country(16) us(840)\
  \ organization(1) gov(101) csor(3)\n                      nistAlgorithms(4) sigAlgs(3)\
  \ id-ecdsa-with-sha3-512(12) }\n```\n\n这意味着 NIST 的计算机安全对象注册中心（CSOR）在联合 ISO/ITU-T\
  \ (2) 美国国家 (16) 政府 (101) 组织分支下下被分配了一个 OID。随后，CSOR 为 NIST 算法 (4) 分配了进一步的分支，并带有签名算法\
  \ (3) 的子分支。最后，我们得到了实际签名算法类型带 SHA3-512 的 ECDSA (12)。\n\n通常情况下，如果某个特定算法已经分配了 OID，最佳实践是始终使用已分配的那个。偶尔，由于分支是基于组织而非算法的，你会发现有时某个算法会与多个\
  \ OID 关联。由于这可能会导致处理过程中出现意外故障，因此值得记住这一点。\n\n## 模块结构\n\nASN.1 模块的基本结构如下：\n\n```\n\
  module_name { object_identifier }\nDEFINITIONS tagging TAGS ::=\nBEGIN\nEXPORTS\
  \ export_list ;\nIMPORTS import_list ;\n\nbody\n\nEND\n```\n\n其中，`module_name` 和\
  \ `object_identifier` 用于标识正在定义的模块，其预期是指定的 OID 是唯一的。`tagging` 字段定义了模块中使用的标记类型。`body`\
  \ 部分包含模块中定义的结构局部定义。\n\n例如，RFC 5280 (PKIX) 中 A.1 定义定义的模块开始于：\n\n```\nPKIX1Explicit88\
  \ { iso(1) identified-organization(3) dod(6) internet(1)\n  security(5) mechanisms(5)\
  \ pkix(7) id-mod(0) id-pkix1-explicit(18) }\n\nDEFINITIONS EXPLICIT TAGS ::=\n\n\
  BEGIN\n\n-- EXPORTS ALL --\n\n-- IMPORTS NONE --\n```\n\n因此，模块名为 `PKIX1Explict88`，其唯一标识符为\
  \ `1.3.6.1.5.5.7.0.18`。\n\n标记字段为 `EXPLICIT`，默认情况下，模块中的任何标记项都是 `EXPLICIT` 标记，除非另有说明。另一种是\
  \ `IMPLICIT`，我们稍后会看到这二者之间的区别。\n\n在这种情况下，缺少了 `EXPORTS` 关键字（它在注释中），这意味着模块中的任何内容都可以导出到另一个模块。如果你看到发现\
  \ `export_list` 缺失（即头部只有 `EXPORTS ;`），则无法从该模块中导出任何内容。\n\n`IMPORTS` 关键字也缺失了，正如注释所示，这意味着不需要任何导入，因此你可能需要处理的所有内容已经描述在模块中了。如果你继续查看\
  \ RFC 5280 后续部分 A.2 中的模块 `PKIXImplicit88`，你会看到一个导入语句的示例：\n\n```\nIMPORTS\n     \
  \ id-pe, id-kp, id-qt-unotice, id-qt-cps,\n      -- 如果支持 \"new\" 类型，则删除下行 --\n \
  \     BMPString, UTF8String,  -- 结束 \"new\" 类型 --\n      ORAddress, Name, RelativeDistinguishedName,\n\
  \      CertificateSerialNumber, Attribute, DirectoryString\n      FROM PKIX1Explicit88\
  \ { iso(1) identified-organization(3)\n            dod(6) internet(1) security(5)\
  \ mechanisms(5) pkix(7)\n            id-mod(0) id-pkix1-explicit(18) };\n```\n\n\
  在这种情况下，`PKIXImplicit88` 模块正在从单个模块 `PKIXExplicit88` 模块中导入一个定义列表，该模块也定义在 RFC 5280\
  \ 中。\n\n## 类型\n\nASN.1 类型属于以下三类之一：简单类型、字符串类型和结构化类型。字符串类型进一步分为两类。结构化类型表示容器类型和无序集。这些都定义在\
  \ `org.bouncycastle` 中。\n\n### 简单类型\n\nASN.1 中的简单类型包括\n\n`BOOLEAN` 表示真或假值。由 `ASN1Boolean`\
  \ 表示，带有 `ASN1Boolean.TRUE` 和 `ASN1Boolean.FALSE` 两个常量。\n\n`ENUMERATED` 是 `INTEGER`\
  \ 的特殊情况，传统上是一个限制集。由 `ASN1Enumerated` 表示。\n\n`INTEGER` 可表示任意大小的整数。注意：这意味着它们是有符号的且只有一种编码（补码）。INTEGER\
  \ 由 `ASN1Integer` 表示。\n\n`NULL` 一个显式空值。不要将其与 Java 的 `null` 混淆，Java 的 `null` 更接近\
  \ ASN.1 的缺失概念，即不存在编码。NULL 有一个真实的编码来表示它。由 `ASN1Null` 和旧版的 `DERNull.INSTANCE` 表示。\n\
  \n`OBJECT IDENTIFIER` 我们在对象标识符章节介绍过这种类型。它由 `ASN1ObjectIdentifier` 表示。\n\n`UTCTime`\
  \ 用于定义两位年份的“协调世界时间”。通常两位年份被解释为 1950 年到 2049 年，但显然某些系统使用不同的窗口，因此检查并进行转换是值得的。UTCTime\
  \ 的最低分辨率是秒。UTCTime 由 `ASN1UTCTime` 和 `DERUTCTime` 表示。\n\n`GeneralizedTime` 具有四季年份，可以表示任意精度的秒。UTCTime\
  \ 由 `ASN1GeneralizedTime` 和 `DERGeneralizedTime` 表示。\n\n大多数原始类型只有一种编码方式，因此无论你使用\
  \ DER 还是更宽松的 BER，它们总是以相同的方式编码。这两个例外是 UTCTime 和 GeneralizedTime。这两种原始类型都将时间编码为 ASCII\
  \ 字符串。如果你始终尝试对这些类型遵循 DER，Bouncy Castle 通常是这么做的的，因为在可能包含签名的数据中对原始类型进行编码非常简单，如果签名验证者没有正确地强制执行编码，在验证时可能会出现意外故障。\n\
  \n## 字符串类型\n\n字符串类型再次分为两类：位字符串类型和字符字符串类型。\n\n### 位字符串类型\n\n有两种位字符串类型：\n\n```\nBIT\
  \ STRING\n```\n\n\n\n\n\n# 位字符串 (BIT STRING)\nBIT STRING 允许存储任意长度的位串。它们被编码为两个部分：第一部分是填充位数，随后是组成实际位串的字节串（octets）。在\
  \ DER 编码中，填充位应全部为零。BIT STRING 由 `ASN1BitString` 和 `DERBitString` 表示。\n\n# 字节字符串\
  \ (OCTET STRING)\nOCTET STRING 允许存储任意长度的字节串（对于更现代的读者来说，就是一个字节数组）。OCTET STRING 由\
  \ `ASN1OctetString`、`BEROctetString` 和 `DEROctetString` 表示。还有用于处理 BER OCTET STRING\
  \ 的流式类 - `BEROctetStringGenerator` 和 `BEROctetStringParser`。\n\n## 字符串类型 (Character\
  \ String Types)\nASN.1 支持多种字符串类型，其中某些类型可能会让本书更“资深”的读者产生怀旧之泪（也许是想起某些恐怖记忆而尖叫）。这些字符串类型中的某些代表了已经废弃的字符集，因此你很少甚至永远看不到它们（`VideotexString`\
  \ 和 `Teletex` 是这两个最好的例子），而其他如 `PrintableString`、`IA5String`、`BMPString` 和 `UTF8String`\
  \ 可能是常用的。与位字符串类型一样，所有这些类型允许存储任意长度的字符串，但在 Bouncy Castle 的工作中，我们只发现过需要 DER 和直接长度编码的情况。\n\
  \n字符串类型的完整列表及其代表的含义如下：\n\n### BMPString\nBMPString 由 `DERBMPString` 类表示。它的名称源自“基本多语言平面”（Basic\
  \ Multilingual Plane）——这是一个包含所有与“生存语言”相关的字符的结构。该字符集由 ISO 10646 表示，与 Unicode 表示的字符集相同。\n\
  \n### GeneralString (通用字符串)\nGeneralString 由 `DERGeneralString` 类表示。它可以包含 ISO 2375\
  \ 描述的国际编码字符集注册表中描述的任何字符，包括控制字符。\n\n### GraphicString (图形字符串)\nGraphicString 由 `DERGraphicString`\
  \ 类表示。这种字符串类型派自与 GeneralString 字符集，但不包含控制字符。只允许打印字符。\n\n### IA5String\nIA5String\
  \ 由来自“国际字母 5”（International Alphabet 5）的字符组成，这是一个旧的 ITU-T 建议。如今它们被认为涵盖了整个 ASCII\
  \ 字符集。该类型由 `DERIA5String` 表示。\n\n### NumericString (数字字符串)\nNumericString 包含数字 0\
  \ 到 9 和空格字符。它由 `DERNumericString` 表示。\n\n### PrintableString (打印字符串)\nPrintableString\
  \ 由 `DERPrintableString` 表示。PrintableString 的字符集取自 ASCII 的子集：字母“A”到“Z”、“a”到“z”、“0”到“9”，以及额外的字符“\
  \ ”、“旧”、““(、`)”、`+`、`-`、`.`、`:`、`=`、`?`、`/` 和 `,`。\n\n### TeletexString\n最初名为 `DERT61String`\
  \ 并其表示。它可能很难正确解释，因为它虽然是一个 8 位字符类型，但支持通过使用 ASCII `ESC`（转义字符）开头的字符序列来更改字符集。\n\n###\
  \ UniversalString (通用字符串)\nUniversalString 由 `DERUniversalString` 表示。这种字符串类型是为了国际化而添加的，但在情况下使用了\
  \ 32 位的字符大小。默认情况下，Bouncy Castle 将这些字符串转换为显示字符编码的 HEX 字符串。\n\n### UTF8String\nUTF8String\
  \ 代表编码“通用转换格式，8 位”（Universal Transformation Format, 8 bit），是全范围国际化的推荐字符串类型。它由 `DERUTF8String`\
  \ 表示，现在被广泛使用。\n\n### VideotexString (视频文字字符串)\n顾如其名，VideotexString 设计用于视频文字系统，并适应可以使用控制代码构建简单图像的\
  \ 8 位字符。\n\n### VisibleString (可见字符串)\nVisibleString 由 `DERVisibleString` 表示。这种类型最初旨在包含来自\
  \ ISO 646 的字符，但从 1994 年以来，它被解释为包含不带控制字符的纯 ASCII。\n\n## 容器类型 (Container Types)\n\
  ASN.1 有两种容器类型 - `SET` 和 `SEQUENCE`。这些类型在 BC ASN.1 API 中通过顶层次的 `ASN1Set` 和 `ASN1Sequence`\
  \ 类支持。\n\n`ASN1Set` 和 `ASN1Sequence` 类都是抽象的，并具有暗示特定编码风格的实现类。ASN.1 `SEQUENCE` 结构是有序的，因此编码风格的选择不会影响编码中元素的顺序。另一方面，ASN.1\
  \ `SET` 结构无序的，但为了满足 DER 的要求，它们按照编码的数值对元素进行排序输出（该值通过对元素进行编码，然后在添加足够的尾零以使每个编码长度相同之后转换为无符号整数计算）。\n\
  \n## CHOICE 类型 (The CHOICE Type)\nCHOICE 是一种特殊类型，指示 ASN.1 字段或变量将是一组可能的 ASN.1 类型或结构中的一种。在\
  \ Java 中没有真正的对应物，但如果你将其视为 C 或 Pascal 中的联合体（union），那么就很接近了。\n\nBouncy Castle 提供了一个标记接口\
  \ `ASN1Choice`，它可以实现在表示选择类型的 ASN.1 对象上。在可能的情况下应该使用此标记接口，因为它有助于提醒 Bouncy Castle 编码器对\
  \ `CHOICE` 强制执行正确的编码规则（下文将有更多介绍）。\n\n## 编码规则 (Encoding Rules)\nASN.1 支持多种不同的编码方式，从精心设计的、无歧义且尺寸最小的二进制格式到使用\
  \ XML 的通用编码。从我们 Bouncy Castle 目前的工作来看，有三组编码规则最为相关：基本编码规则 (BER)、区分编码规则 (DER) 以及较小的规范编码规则\
  \ (CER)。\n\n### 基本编码规则 (Basic Encoding Rules)\nASN.1 编码系统的核心围绕基本编码规则 (BER) 构建。BER\
  \ 编码遵循标记-长度-值（TLV）约定。它使用 `tag` 标识类型，随后给出内容长度的值，然后是相应长度的字节串描述内容。DER 和 CER 都是 BER\
  \ 的子集。\n\nBER 编码提供了三种编码 ASN.1 结构或原始的方法：\n\n#### 原始确定长度\n在这种情况下，整个原始在单个块中描述 - 类型标记后面的长度和数据告诉了你关于编码结构中大小和数据的所有信息。\n\
  \n#### 构造确定长度\n构造确定长度既用于表示包含多个原始（可能也是构造的）的 ASN.1 结构，也用于表示由一系列确定长度原始编码聚合成的原始。对于其中一种情况，你只有通过读取组成构造编码的所有原始编码，才能确定数据的真实大小以及组成它的字节串。\n\
  \n#### 构造不定长度\n构造不定长度的编码也由其他编码组成 - 这些编码本身可能是不定长度的。它通过长度字节 0x80 进行指示，并由两个值为 0x00\
  \ 的字节组成的内容结束标记终止。\n\n### 标记 (Tagging)\n作为 TLV 格式，BER 有有一套用于常用原始和结构类型的标准预定义标签。BER\
  \ 还允许在对 `SEQUENCE` 等容器类型的定义可能产生歧义的情况下定义你自己的标签值。\n\n不过，定义自己的标签值还有一些转折。\n\n\n\n\n\
  第一个转折在于，ASN.1 对象可以被标记为 `EXPLICIT`（显式），这意味着你的标记值和对象的原始标记值都包含在编码中；或者 ASN.1 对象可以被标记为\
  \ `IMPLICIT`（隐式），这意味着你的标记值在编码中替换了对象的原始标记值。当然，由于原始标记值丢失了，你可能会问，如果你不知道原始标记值是什么，而且手头没有文档告诉你它本应该是什么，你该如何正确解释编码？遗憾的是，你无法判断。这在结构化类型中尤为重要，因为一个显式标记的原始类型生成的编码，与一个包含单个原始类型的隐式标记\
  \ `SET` 或 `SEQUENCE` 所生成的编码是相同的。\n\nBouncy Castle ASN.1 库中的所有标准 API 类型都支持静态的 `getInstance()`\
  \ 方法，该方法接收一个 `ASN1TaggedObject` 和一个指示隐式或显式标记的 `boolean` 值。由于 `IMPLICIT` 和结构化类型之间存在歧义，在解析类型为\
  \ `ASN1TaggedObject` 的对象时使用这些方法非常重要，并确保针对所使用的标记类型使用了正确的 `boolean` 值。\n\n第二个转折在于当\
  \ ASN.1 对象是 `CHOICE` 时。对于 `CHOICE` 类型，你无法承受丢失任何与 `CHOICE` 值相关的标记，因为它是你判断 `CHOICE`\
  \ 值真正代表什么的的唯一线索。\n\nBouncy Castle 提供了一个标记接口 `ASN1Choice`，该接口可以实现在 ASN.1 对象上，以提醒\
  \ Bouncy Castle 编码器执行正确的编码规则。我们建议在定义表示 ASN.1 `CHOICE` 的对象时使用它。\n\n## 区分编码规则 (Distinguished\
  \ Encoding Rules)\n\n由于提供了结构化原始类型、无序集合等规定，给定的 ASN.1 结构可能有几种编码方式。区分编码规则（DER）旨在确保相同的\
  \ ASN.1 数据始终产生相同的编码。\n\n这对于签名或经过 MAC（消息认证码）处理的数据尤为重要，因为验证签名 ASN.1 数据的能力依赖于验证方能够准确地重构被签名数据的编码。\n\
  \n为了确保这一点始终成立，`DER` 在 `BER` 的基础上增加了以下限制：\n\n- 仅允许确定长度编码。\n- 只有结构化类型 `SEQUENCE`、`SET`、隐式标记的\
  \ `SEQUENCE` 或 `SET` 以及显式标记的对象可以使用构造的确定长度。\n- 长度编码必须始终以最少字节数进行编码（不允许有前导零）。\n- 设置为\
  \ `DEFAULT` 值的字段不包含在编码中。\n- `SET` 中包含的对象在编码前会根据调整后的编码值进行排序（必要时将补零以使所有编码长度相同）。\n\n\
  注意：最后两项限制也适用于 `CER`。\n\n## 字节编码规则 (Octet Encoding Rules)\n\n2014 年，引入了一套新的编码规则，这些规则现在开始产生影响，主要是在那些认为最终编码大小很重要的标准中。这套新规则——字节编码规则（OER）定义在\
  \ `X.696` 中，其规则与 `BER` 和 `DER` 并行工作。基础规则是基础字节编码规则（`BOER`），而与 `DER` 等效的规则是规范化字节编码规则（`COER`）。所有的\
  \ `OER` 类型都是字节对齐的，但并非所有类型都包含长度标记，因为当 ASN.1 类型定义已经提供了确定长度的能力时，长度标记会被省略。\n\n`OER`\
  \ 扩展了 ASN.1 类型列表，包括不同位长度的固定长度无符号整数（`UInt`）以及固定长度的有符号整数（`Int`）。字符串类型也可以是固定长度，例如 `OCTET\
  \ STRING` 类型可以是固定长度，在这种情况下 `OCTET STRING` 直接编码为其值字节；或者它们可以是变长的，在这种情况下在开头包含标准的长度标记。最后，当\
  \ `SEQUENCE` 包含可选项目时，序列开头编码的是存在性位图（presence bitmap）而不是长度，用于标记哪些可选字段是存在的。\n\nBouncy\
  \ Castle 目前不支持 `OER`，但请关注这里，我们确信它就会到来！\n\n## 其他编码规则\n\n除了“最近”引入的 `OER` 规则外，ASN.1\
  \ 还有其他可用的编码规则。在这工作中最可能遇到的是规范化编码规则（`CER`），它也是 `BER` 的子集，但它对不定长度编码中组件的大小施了限制。通常情况下，意识到\
  \ `CER` 是值得的，因为它让你对人们可能实施的限制限制有一个良好的了解。在 ASN.1 中，实际上在 Java 中，技术上可以构造一个由长度为 $2^{31}$\
  \ 字节的字符串组成的有效不定长度构造 `OCTET STRING`——尽管你可能很难找到能解析这种产物的人。\n\n最后两种编码（编写本文时）是打包编码规则（`PER`）和\
  \ XML 编码规则（`XER`）。如果你对这些更多信息感兴趣，请参见相关标准 `X.961` 和 `X.963`。\n\n## 基础指南\n\n在面向对象的语言中使用像\
  \ ASN.1 这样的协议层时，困难之一在于，有时不清楚何时处理 ASN.1 结构是安全的，例如作为对象 `org.bouncycastle.asn1.x509.AlgorithmIdentifier`\
  \ 处理，还是作为其原始组合中的结构 `SEQUENCE` 处理。强制转换（Casting）在这种情况下并不好用——如果以意外的方式使用方法，很容易导致 `ClassCastException`。\n\
  \n在 Bouncy Castle 中，这个问题通过使用静态 `getInstance()` 方法来解决。例如，`AlgorithmIdentifier.getInstance()`\
  \ 可以接收 `AlgorithmIdentifier` 对象或表示 `AlgorithmIdentifier` 的 `ASN1Sequence` 对象，并始终返回\
  \ `AlgorithmIdentifier`，如果传入了空值则返回 `null`。同样，`ASN1Sequence.getInstance()` 可以接收 `AlgorithmIdentifier`\
  \ 对象或 `ASN1Sequence` 对象，并始终返回 `ASN1Sequence`，如果传入了空值则返回 `null`。\n\n## 定义你自己的对象\n\
  \n通常，如果你正在定义一个基于 ASN.1 的对象，你应该定义一个继承自 `org.bouncycastle.asn1.ASN1Object` 的类。这将提供\
  \ `equals()` 和 `hashCode()` 定义，并要求在你的扩展类中定义 `toASN1Primitive()` 方法。之后，如果你想遵循现有模式（我们强烈建议），你应该定义一个静态\
  \ `getInstance()` 方法，该方法能够接收类类型、`toASN1Primitive()` 返回的内容或 `null`。一旦你完成了这些，类的其余部分几乎是自动生成的——构造函数将根据组成对象的类型产生。\n\
  \n接下来的示例代码提供了一个用于以下 ASN.1 结构的类定义：\n\n```\nSimpleStructure ::= SEQUENCE {\n    version\
  \ INTEGER DEFAULT 0,\n    created GeneralizedTime,\n    data OCTET STRING,\n   \
  \ comment [0] UTF8String OPTIONAL\n}\n```\n\n该类完整的完整的，了两页纸。请先查看代码，然后阅读随后的注释。\n\n\
  \n\n\n```java\n  /**\n  * SimpleStructure 的实现 - 一个 ASN.1 对象示例（标记为\n  * IMPLICIT）。\n\
  \  * <pre>\n  *     SimpleStructure ::= SEQUENCE {\n  *         version INTEGER\
  \ DEFAULT 0,\n  *         created GeneralizedTime,\n  *         data OCTET STRING,\n\
  \  *         comment [0] UTF8String OPTIONAL\n  *     }\n  * </pre>\n  */\n public\
  \ class SimpleStructure\n    extends ASN1Object\n{\n    private final BigInteger\
  \ version;\n    private final Date created;\n    private final byte[] data;\n\n\
  \    private String comment;\n\n    /**\n     * 将传入的对象转换或强制转换为 SimpleStructure。\n\
  \     *\n     * @param obj 感感兴趣的对象。\n     * @return 一个 SimpleStructure \n     */\n\
  \    public static SimpleStructure getInstance(\n        Object  obj)\n    {\n \
  \       if (obj instanceof SimpleStructure)\n        {\n            return (SimpleStructure)obj;\n\
  \        }\n        else if (obj != null)\n        {\n            return new SimpleStructure(ASN1Sequence.getInstance(obj));\n\
  \        }\n\n        return null;\n    }\n\n    /**\n     * 创建一个带有默认版本的结构。\n  \
  \   *\n     * @param created 创建日期。\n     * @param data 要包含的编码数据。\n     */\n    public\
  \ SimpleStructure(Date created, byte[] data)\n    {\n        this(0, created, data,\
  \ null);\n    }\n\n    /**\n     * 创建一个带有默认版本和可选注释的结构。\n     *\n     * @param created\
  \ 创建日期。\n     * @param data 要包含的编码数据。\n     * @param comment 要使用的注释。\n     */\n\
  \    public SimpleStructure(Date created, byte[] data, String comment)\n    {\n\
  \        this(0, created, data, comment);\n    }\n\n    /**\n     * 创建一个带有特定版本和可选注释的结构。\n\
  \     *\n     * @param version 要使用的版本号。\n     * @param created 创建日期。\n     * @param\
  \ data 要包含的编码数据。\n     * @param comment 要使用的注释。\n     */\n    public SimpleStructure(int\
  \ version, Date created,\n                           byte[] data, String comment)\n\
  \    {\n        this.version = BigInteger.valueOf(version);\n        this.created\
  \ = new Date(created.getTime());\n        this.data = Arrays.clone(data);\n\n  \
  \      if (comment != null)\n        {\n            this.comment = comment;\n  \
  \      }\n        else\n        {\n            this.comment = null;\n        }\n\
  \    }\n\n    // 注意：序列的私有构造函数 - 我们希望用户养成\n    // 使用 getInstance() 的习惯。这样安全！\n  \
  \  private SimpleStructure(ASN1Sequence seq)\n    {\n        int index = 0;\n\n\
  \        if (seq.getObjectAt(0) instanceof ASN1Integer)\n        {\n           \
  \ this.version = ASN1Integer.getInstance(\n                                  seq.getObjectAt(0)).getValue();\n\
  \            index++;\n        }\n        else\n        {\n            this.version\
  \ = BigInteger.ZERO;\n        }\n\n        try\n        {\n            this.created\
  \ = ASN1GeneralizedTime.getInstance(\n                                 seq.getObjectAt(index++)).getDate();\n\
  \        }\n        catch (ParseException e)\n        {\n            throw new IllegalArgumentException(\n\
  \                \"解析 created 异常：\" + e.getMessage(), e);\n        }\n\n       \
  \ this.data = Arrays.clone(\n            ASN1OctetString.getInstance(seq.getObjectAt(index++)).getOctets());\n\
  \n        for (int i = index; i != seq.size(); i++)\n        {\n            ASN1TaggedObject\
  \ t = ASN1TaggedObject.getInstance(\n                               seq.getObjectAt(index++));\n\
  \            if (t.getTag() == 0)\n            {\n                this.comment =\
  \ UTF8String.getInstance(t).getString();\n            }\n        }\n    }\n\n  \
  \  public BigInteger getVersion() {\n        return version;\n    }\n\n    public\
  \ Date getCreated() {\n        return created;\n    }\n\n    public byte[] getData()\
  \ {\n        return data;\n    }\n\n    public String getComment() {\n        return\
  \ comment;\n    }\n\n    /**\n     * 生成该对象的 DER 表示形式。\n     * @return 一个 ASN1Primitive\n\
  \     */\n    @Override\n    public ASN1Primitive toASN1Primitive()\n    {\n   \
  \     ASN1PrintableVector v = new ASN1PrintableVector();\n        if (!version.equals(BigInteger.ZERO))\
  \ {\n            v.add(new DERInteger(version));\n        }\n        v.add(new DERGeneralizedTime(created));\n\
  \        v.add(new DEROctetString(data));\n        if (comment != null) {\n    \
  \        v.add(new DERTaggedObject(false, 0, new DERUTF8String(comment)));\n   \
  \     }\n        return new DERSequence(v);\n    }\n}\n```\n\n可以看出，`SimpleStructure`\
  \ 遵循标准模式。它扩展了 `ASN1Object`，提供了一个 `getInstance()` 方法，并且考虑了 DER 规则（只有当版本不是默认值时才进行编码）。`getInstance()`\
  \ 方法能够将其大部分工作外包给 `ASN1Sequence.getInstance()`，而接收 `ASN1Sequence` 的构造函数被标记为私有，因此任何使用它的尝试都必须通过\
  \ `getInstance()`。\n\n另一点注意的是，该类是不可变的。这里需要注意的是，与几乎所有的 ASN.1 对象不同，`ASN1OctetString`\
  \ 不是不可变的——这主要是出于（唉）性能考虑。这就是为什么对 `getOctets()` 方法返回的 `byte[]` 调用了 `Arrays.clone()`\
  \ 方法的原因。\n\n## 附录：Bouncy Castle Kotlin API\n\n我们经常被问是否有方法可以使用 Bouncy Castle 来编写脚本，或者至少是接近对应的东西。Bouncy\
  \ Castle Kotlin API 利用了 Kotlin 的领域特定语言 (DSL) 能力，提供了生成证书和证书请求等内容的支持，并为 `java.io.OutputStreamWriter`\
  \ 提供额外的方法来生成 PEM 文件。\n\n### 关于包的说明\n\n虽然使用 `org.bouncycastle` 很有吸引力，但为了不进一步污染互联网，我们最终使用\
  \ `org.bouncycastle.kcrypto` 作为 Kotlin 特有加密类的父包，并使用 `org.bouncycastle.kutil` 作为通用工具类的父包。\n\
  \nKotlin API 可以在 [`github.com/bcgit/bc-kotlin`](https://github.com/bcgit/bc-kotlin)\
  \ 获取。我们在这里查看两个“经典”的用法示例，但发行版中也包含一个示例 目录，其中展示了其他用例。\n\n### 生成 PKCS#10 证书请求\n\n以下\
  \ Kotlin DSL 创建了一个 RSA 密钥对，并据此生成了一个 PKCS#10 证书请求。请求中使用的签名等同于 JCA 在你请求“SHA256withRSA”时提供的签名。在末尾，脚本将私钥和\
  \ PKCS#10 请求都写为 PEM 文件。\n\n\n\n\n\n```kotlin\nfun main() {\n    using(new BouncyCastleProvider())\n\
  \n    var kp = signingKeyPair {\n        rsa {\n            keySize = 2048\n   \
  \     }\n    }\n\n    val name = x500Name {\n        rdn(BCStyle.C, \"AU\")\n  \
  \      rdn(BCStyle.O, \"The Legion of the Bouncy Castle\")\n        rdn(BCStyle.L,\
  \ \"Melbourne\")\n        rdn(BCStyle.CN, \"Eric H. Echidna\")\n        rdn(BCStyle.EmailAddress,\
  \ \"feedback-crypto@bouncycastle.org\")\n    }\n\n    val extensions = extensions\
  \ {\n        critical(extension {\n            extOid = Extension.keyUsage\n   \
  \         extValue = KeyUsage(KeyUsage.keyCertSign or KeyUsage.cRLSign)\n      \
  \  })\n    }\n\n    var pkcs10 = pkcs10Request {\n        subject = name\n     \
  \   subjectKey = kp.verificationKey\n        attributes = attributes {\n       \
  \       attribute {\n                  attrType = PKCSObjectIdentifiers.pkcs_9_at_extensionRequest\n\
  \                  attrValue = extensions\n              }\n        }\n        signature\
  \ {\n            PKCS1v1dot5 with sha256 using kp.signingKey\n        }\n    }\n\
  \n    OutputStreamWriter(System.out).writePEMObject(kp.signingKey)\n\n    OutputStreamWriter(System.out).writePEMObject(pkcs10)\n\
  }\n```\n\n注意证书请求中 `attributes` 块的使用。虽然该块是可选的，但在上面的示例中，我们使用它来请求 CA 在其颁发的证书中包含 `KeyUsage`\
  \ 扩展。你可以在第 12 章找到更多关于 `PKCS#10` 请求的细节。\n\n关于该脚本的另一个有趣点是，签名算法不是通过字符串指定的。Kotlin API\
  \ 尝试充分利用 Kotlin 语言特性以确保所有内容在编译时通过检查。结果是，如果你需要禁用某种算法并确保已经禁用，你只需要移除 BC Kotlin API\
  \ 对该算法的定义，任何使用该禁用算法的脚本都将无法编译。\n\n## 生成证书\n\n```kotlin\nfun main() {\n    using(new\
  \ BouncyCastleProvider())\n\n    var expDate = Date(System.currentTimeMillis() +\
  \ 365L * 24 * 60 * 60 * 1000)\n\n    var caKp = signingKeyPair {\n        rsa {\n\
  \            keySize = 2048\n        }\n    }\n\n    val caName = x500Name {\n \
  \       rdn(BCStyle.C, \"AU\")\n        rdn(BCStyle.O, \"The Legion of the Bouncy\
  \ Castle\")\n        rdn(BCStyle.L, \"Melbourne\")\n        rdn(BCStyle.CN, \"Eric's\
  \ CA\")\n    }\n\n    var caExtensions = extensions {\n        critical(extension\
  \ {\n            extOid = Extension.basicConstraints\n            extValue = BasicConstraints(true)\n\
  \        })\n        critical(extension {\n            extOid = Extension.keyUsage\n\
  \            extValue = KeyUsage(KeyUsage.cRLSign or KeyUsage.keyCertSign)\n   \
  \     })\n        critical(subjectKeyIdentifierExtension {\n            subjectKey\
  \ = caKp.verificationKey\n        })\n    }\n\n    var caCert = certificate {\n\
  \        issuer = caName\n\n        serialNumber = BigInteger.valueOf(1)\n\n   \
  \     notAfter = expDate\n        subject = caName\n        subjectPublicKey = caKp.verificationKey\n\
  \n        extensions = caExtensions\n\n        signature {\n            PKCS1v1dot5\
  \ with sha256 using caKp.signingKey\n        }\n    }\n\n    OutputStreamWriter(System.out).writePEMObject(caKp.signingKey)\n\
  \n    OutputStreamWriter(System.out).writePEMObject(caCert)\n}\n```\n\n与 `PKCS#10`\
  \ 示例一样，目标证书将使用 `SHA256withRSA` 进行签名。在差异方面，证书设置中的字段显然不同，但 API 的用感仍然是一样的。\n\n当然，你可能想用密码加密新的私钥。`OutputStreamWriter`\
  \ 的 `writePEMObject()` 重写方法可以识别 PEM 编码的一范围对象。因此，另一种保存私钥的方法（显然考虑到密码，这并不是最好的方法）如下：\n\
  \n```kotlin\n    var encCaKey = encryptedPrivateKey {\n        privateKey = caKp.signingKey\n\
  \        encryption {\n            AES using scrypt {\n                saltLength\
  \ = 16\n                cost = 16384\n                blockSize = 8\n          \
  \      parallelization = 1\n                keySize = 256\n            } with \"\
  Test\".toCharArray()\n        }\n    }\n    OutputStreamWriter(System.out).writePEMObject(encCaKey)\n\
  ```\n\n这段代码片段将使用 `AES` 密钥加密私钥，并使用 `scrypt` 算法从密码派生密钥。结果是你应该得到一个带有 PEM 头的 blob：\n\
  \n```\nBEGIN ENCRYPTED PRIVATE KEY-----\n```\n\n而不是之前通用 RSA 密钥的格式：\n\n```\nBEGIN\
  \ RSA PRIVATE KEY-----\n```\n\n这些示例仅涉及了使用 Kotlin API 可以进行的一些操作。如果你好奇还能做什么，不要忘记查看\
