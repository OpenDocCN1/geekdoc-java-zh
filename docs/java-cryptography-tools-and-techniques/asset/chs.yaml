  bS: 837028bb0ccdaf1cf9a390b1f84bf916999ba4760d4297124ca991a1e616b676\naS: 914bb9b3d677c4ce87e5f671a88c85c0615228c6f7d6fbfdee89092f69609128\n\
  bS: 837028bb0ccdaf1cf9a390b1f84bf916999ba4760d4297124ca991a1e616b676\n\n\n\n关键材料通常会根据每次调用而有所不同，它通过使用\
  \ Bouncy Castle 特有的 `AlgorithmParameterSpec` 来管理，即 `org.bouncycastle.jcajce.spec.UserKeyingMaterialSpec`\
  \ 类。该类的名称源于 RFC 5652 [10] 中用于加密消息语法 (CMS) 密钥约约接收者的参数名称。\n\n`UserKeyingMaterialSpec`\
  \ 仅接收一个字节数组作为内容。\n\n```\n 1   /**\n 2    * 生成一个长度为 256 位的约定 AES 密钥值。\n 3    *\n\
  \ 4    * @param aPriv Party A 的私钥。\n 5    * @param bPub Party B 的公钥。\n 6    * @return\
  \ 生成的 AES 密钥 (256 bits)。\n 7    */\n 8   public static SecretKey generateAESKey(\n\
  \ 9       PrivateKey aPriv, PublicKey bPub, byte[] keyMaterial)\n10       throws\
  \ GeneralSecurityException\n11   {\n12       KeyAgreement agreement = KeyAgreement.getInstance(\"\
  DHwithSHA256KDF\", \"BC\");\n13 \n14       agreement.init(aPriv, new UserKeyingMaterialSpec(keyMaterial));\n\
  15 \n16       agreement.doPhase(bPub, true);\n17 \n18       return agreement.generateSecret(\"\
  AES\");\n19   }\n```\n\n如何格式化用于构建 `UserKeyingMaterialSpec` 的字节数组由你决定。例如，NIST SP\
  \ 800-56A [29] 和 NIST SP 800-56B [30] 都对如何构建用户密钥材料提供了详细建议，你也可以利用 Bouncy Castle 包含的\
  \ `DEROtherInfo` 类。\n\n下一个示例使用了我们新的 `generateAESKey()` 方法，通过 KDF 结合额外的密钥材料。为了对比，它仍然使用了与之前相同的方法从共享密钥生成字节数组。\n\
  \n```\n 1 /**\n 2  * 基础 Diffie-Hellman 示例，展示了如何使用 KeyAgreement 类\n 3  * 通过额外的密钥材料生成字节数组和密钥密钥。\n\
  \ 4  * <b>注意</b>b>：此示例正在生成常量密钥，除非你确实打算这样做，否则\n 5  * 不要在实际生活中中使用此密钥生成代码！\n 6  */\n\
  \ 7 public class UKMDHExample\n8 {\n 9     // 使用 A 和 B 密钥对生成并打印共享密钥。\n10     private\
  \ static byte[] generateSecretValue(KeyPair aKp, KeyPair bKp)\n11         throws\
  \ GeneralSecurityException\n12     {\n13         byte[] aValue = generateSecret(aKp.getPrivate(),\
  \ bKp.getPublic());\n14         byte[] bValue = generateSecret(bKp.getPrivate(),\
  \ aKp.getPublic());\n15 \n16         System.out.println(\"aS: \" + Hex.toHexString(aValue));\n\
  17         System.out.println(\"bS: \" + Hex.toHexString(bValue));\n18 \n19    \
  \     return aValue;\n20     }\n21 \n22     // 使用 A 和 B 密钥对生成并打印 AES 密钥。\n23   \
  \  // 注意：这次我们引入了一些字节的密钥材料。\n24     private static SecretKey generateAESKeyValue(KeyPair\
  \ aKp, KeyPair bKp)\n25         throws GeneralSecurityException\n26     {\n27  \
  \       byte[] keyMaterial = Strings.toByteArray(\"For an AES key\");\n28 \n29 \
  \        SecretKey aKey = generateAESKey(\n30             aKp.getPrivate(), bKp.getPublic(),\
  \ keyMaterial);\n31         SecretKey bKey = generateAESKey(\n32             bKp.getPrivate(),\
  \ aKp.getPublic(), keyMaterial);\n33 \n34         System.out.println(\"aK: \" +\
  \ Hex.toHexString(aKey.getEncoded()));\n35         System.out.println(\"bK: \" +\
  \ Hex.toHexString(bKey.getEncoded()));\n36 \n37         return aKey;\n38     }\n\
  39 \n40     public static void main(String[] args)\n41         throws Exception\n\
  42     {\n43         // 设置用于密钥对生成的参数规范\n44         insecureUtilsInit();\n45 \n46\
  \         //为 A 部分和 B 部分生成密钥对\n47         KeyPair aKp = insecureGenerateDHKeyPair();\n\
  48         KeyPair bKp = insecureGenerateDHKeyPair();\n49 \n50         // 密钥约生成生成共享密钥\n\
  51         byte[] retGenSec = generateSecretValue(aKp, bKp);\n52         // 密钥约生成生成\
  \ AES 密钥\n53         SecretKey retAESKey = generateAESKeyValue(aKp, bKp);\n54 \n\
  55         // 比较两个返回值。\n56         System.err.println(Arrays.areEqual(retGenSec,\
  \ retAESKey.getEncoded()));\n57     }\n58 }\n```\n\n尝试运行该示例，你应该能看到它产生以下输出：\n\n```\n\
  aS: 8412f73f3e704cdf\n```\n\n\n\n\n### 使用 KeyAgreement 类\n\n接下来要查看的是如何使用 `KeyAgreement`\
  \ 类利用统一 Diffie-Hellman（Unified Diffie-Hellman）模型。在该协议中，临时密钥被视为协商的参数。在 Bouncy Castle\
  \ 中，这些额外密钥和密钥通过 `DHUParameterSpec` 进行配置，该类可以在 `org.bouncycastle.jcajce.spec` 包中找到。\n\
  \n下面的 Java 方法展示了使用统一 Diffie-Hellman 模型和基于 SHA-256 的 X9.63 KDF 生成基本 AES 密钥所需的代码。\n\
  \n```java\n 1   /**\n 2    * 使用 Unified Diffie-Hellman 模型生成长度为 256 位的约定的 AES 密钥值\n\
  \ 3    *\n 4    *\n 5    * @param aPriv Party A 的私钥。\n 6    * @param aPubEph Party\
  \ A 的临时公钥。\n 7    * @param aPrivEph Party A 的临时私钥。\n 8    * @param bPub Party B\
  \ 的公钥。\n 9    * @param bPubEph Party B 的临时公钥。\n 10    * @return 生成的 AES 密钥 (256\
  \ 位)。\n 11    */\n 12   public static SecretKey dhuGenerateAESKey(\n 13       PrivateKey\
  \ aPriv, PublicKey aPubEph, PrivateKey aPrivEph,\n 14       PublicKey bPub, PublicKey\
  \ bPubEph, byte[] keyMaterial)\n 15       throws GeneralSecurityException\n 16 \
  \  {\n 17       KeyAgreement agreement =\n 18           KeyAgreement.getInstance(\"\
  DHUwithSHA256KDF\", \"BC\");\n 19 \n 20       agreement.init(aPriv,\n 21       \
  \    new DHUParameterSpec(aPubEph, aPrivEph, bPubEph, keyMaterial));\n 22 \n 23\
  \       agreement.doPhase(bPub, true);\n 24 \n 25       return agreement.generateSecret(\"\
  AES\");\n 26   }\n```\n\n如你所见，统一模型通过将算法名称以“DHU”而不是简单的“DH”来指定。\n\n以下示例展示了如何使用 `dhuGenerateAESKey()`\
  \ 方法在两个双方之间生成共享的 AES 密钥。\n\n```java\n 1 /**\n 2  * 基础统一 Diffie-Hellman 示例，展示了协议中每个双方使用两个密钥对\n\
  \ 3  *，其中一组被视为临时的。\n 4  */\n 5 public class UnifiedDHExample\n 6 {\n 7     public\
  \ static void main(String[] args)\n 8         throws Exception\n 9     {\n 10  \
  \       // 为方 A 和方 B 生成密钥对\n 11         KeyPair aKpS = generateDHKeyPair();\n 12\
  \         KeyPair aKpE = generateDHKeyPair();    // A 的临时密钥对\n 13         KeyPair\
  \ bKpS = generateDHKeyPair();\n 14         KeyPair bKpE = generateDHKeyPair(); \
  \   // B 的临时密钥对\n 15 \n 16         // 密钥协商生成 AES 密钥\n 17         byte[] keyMaterial\
  \ = Strings.toByteArray(\"For an AES key\");\n 18 \n 19         SecretKey aKey =\
  \ dhuGenerateAESKey(\n 20             aKpS.getPrivate(),\n 21             aKpE.getPublic(),\
  \ aKpE.getPrivate(),\n 22             bKpS.getPublic(), bKpE.getPublic(), keyMaterial);\n\
  \ 23         SecretKey bKey = dhuGenerateAESKey(\n 24             bKpS.getPrivate(),\n\
  \ 25             bKpE.getPublic(), bKpE.getPrivate(),\n 26             aKpS.getPublic(),\
  \ aKpE.getPublic(), keyMaterial);\n 27 \n 28         // 比较两个返回值。\n 29         System.out.println(\n\
  \ 30             Arrays.areEqual(aKey.getEncoded(), bKey.getEncoded()));\n 31  \
  \   }\n 32 }\n```\n\n在这种情况下，由于使用了随机密钥，我们判断其正常运行的最好标志是最后的密钥比较。假设一切顺利，该示例将产生以下结果，表明两个密钥计算出的值相同：\n\
  \n```\ntrue\n```\n\n通过查看示例你可以发现，任何一方的静态密钥对也可以用于协议中，以弥补缺少一组临时密钥对的情况。这意味着作为替代的静态密钥也将被传递并作为\
  \ `dhuGenerateAESKey()` 方法的配置参数使用。这就是我们之前提到的单次协议。\n\n#### MQV\n\nMQV 是另一种同样利用临时密钥对的密钥协商协议。它以其发明者\
  \ Alfred Menezes、Minghua Qu 和 Scott Vanstone 的姓氏命名，该协议首次在 1995 年的论文《Some New Key\
  \ Agreement Protocols Providing Mutual Implicit Authentication》[4] 中描述。MQV 与统一模型的不同在于，它还结合了基于双方静态私钥的“隐式签名”。这意味着任何对协议进行中间人攻击的尝试都会失败，因为会被检测到。这种“隐式签名”意味着\
  \ MQV 在开箱即用性方面比统一模型提供了更强的验证基础。\n\n\n\n\n\n```java\n  /**\n   * 使用 MQV 生成一个长度为 256\
  \ 位的约定的 AES 密钥。\n   *\n   * @param aPriv A 方的私钥。\n   * @param aPubEph A 方的临时公钥。\n\
  \   * @param aPrivEph A 方的临时私钥。\n   * @param bPub B 方的公钥。\n   * @param bPubEph B\
  \ 方的临时公钥。\n   * @return 生成的 AES 密钥 (256 位)。\n   */\n  public static SecretKey mqvGenerateAESKey(\n\
  \      PrivateKey aPriv, PublicKey aPubEph, PrivateKey aPrivEph,\n      PublicKey\
  \ bPub, PublicKey bPubEph, byte[] keyMaterial)\n      throws GeneralSecurityException\n\
  \  {\n      KeyAgreement agreement =\n          KeyAgreement.getInstance(\"MQVwithSHA256KDF\"\
  , \"BC\");\n\n      agreement.init(aPriv,\n          new MQVParameterSpec(aPubEph,\
  \ aPrivEph, bPubEph, keyMaterial));\n\n      agreement.doPhase(bPub, true);\n\n\
  \      return agreement.generateSecret(\"AES\");\n  }\n```\n\n将示例放入简单的用例中，我们得到如下代码：\n\
  \n```java\n/**\n * 基础 Diffie-Hellman MQV 示例，展示了协议中每个方使用两对密钥，\n * 其中一组被视为临时密钥。\n\
  \ */\npublic class MQVDHExample\n{\n    public static void main(String[] args)\n\
  \        throws Exception\n    {\n        // 为 A 方和 B 方生成密钥对\n        KeyPair aKpS\
  \ = generateDHKeyPair();\n        KeyPair aKpE = generateDHKeyPair();    // A 的临时密钥对\n\
  \        KeyPair bKpS = generateDHKeyPair();\n        KeyPair bKpE = generateDHKeyPair();\
  \    // B 的临时密钥对\n\n        // 密钥协商生成 AES 密钥\n        byte[] keyMaterial = Strings.toByteArray(\"\
  For an AES key\");\n\n        SecretKey aKey = mqvGenerateAESKey(\n            aKpS.getPrivate(),\n\
  \            aKpE.getPublic(), aKpE.getPrivate(),\n            bKpS.getPublic(),\
  \ bKpE.getPublic(), keyMaterial);\n        SecretKey bKey = mqvGenerateAESKey(\n\
  \            bKpS.getPrivate(),\n            bKpE.getPublic(), bKpE.getPrivate(),\n\
  \            aKpS.getPublic(), aKpE.getPublic(), keyMaterial);\n\n        // 比较两个返回值。\n\
  \        System.out.println(\n            Arrays.areEqual(aKey.getEncoded(), bKey.getEncoded()));\n\
  \    }\n}\n```\n\n运行该示例应产生以下输出，表明两个密钥计算出的值相同：\n\n```\ntrue\n```\n\n希望你也能看到示例中的任何一个临时密钥如何被替换为同方的静态密钥，从而产生单次通过版本的\
  \ MQV 协议。\n\n### 椭圆曲线 Diffie-Hellman\n\n我们目前为止关于 Diffie-Hellman 的大部分内容同样适用于使用椭圆曲线密码学\
  \ (ECC) 执行该协议。椭圆曲线 (EC) 提供了类似的性能优势，但在同等安全水平下密钥尺寸小得多。\n\n虽然现在某些标准中有了针对 EC 密钥协商的特定参数集，但通常情况下，EC\
  \ Diffie-Hellman 可以使用 ECDSA 相同的 EC 参数集生成的密钥来执行。在后续章节的示例代码中，我们假设你有权访问第 6 章中为 ECDSA\
  \ 定义的密钥对生成方法。\n\n### 基础密钥协商\n\n假设阶因子 1，EC 的基本步骤如下：\n\n1. ![A](img/leanpub_equation_574.png)\
  \ 将其公钥 ![W_a](img/leanpub_equation_575.png) 发给 ![B](img/leanpub_equation_576.png)\n\
  \n2. ![B](img/leanpub_equation_577.png) 将其公钥 ![W_b](img/leanpub_equation_578.png)\
  \ 发给 ![A](img/leanpub_equation_579.png)\n\n3. ![A](img/leanpub_equation_580.png)\
  \ 计算 `(x, y) = d_aW_b`。如果 `((x, y)](images/leanpub_equation_582.png)` 位于 `\\infty](images/leanpub_equation_583.png)`\
  \ 则返回无效\n\n4. ![B](img/leanpub_equation_584.png) 计算 `(x, y) = d_bW_a`。如果 `((x, y)](images/leanpub_equation_586.png)`\
  \ 位于 `\\infty](images/leanpub_equation_587.png)`则返回无效\n\n5. ![A](img/leanpub_equation_588.png)\
  \ 返回 `x](images/leanpub_equation_589.png)` \n\n6. ![B](img/leanpub_equation_590.png)\
  \ 返回 `x](images/leanpub_equation_591.png)`\n\n这个直接过程中的唯一陷阱在于，所涉及的阶因子并不总是 1。如果不考虑阶因子，人员可能会使用特殊构造的公钥，从而导致对方密钥的某些泄露。为了防止这种情况，接收公钥的方需要确保其被强制进入曲线的子群中。处理这种阶因子的方法有两种。第一种（NIST\
  \ 推荐）是直接乘以阶因子，因此步骤 4 和 5 替换为：\n\n1. ![A](img/leanpub_equation_592.png) 计算 `(x, y)\
  \ = d_aW_b`。如果 `((x, y)](images/leanpub_equation_594.png)` 位于 `\\infty](images/leanpub_equation_595.png)`则返回无效\n\
  \n2. ![B](img/leanpub_equation_596.png) 计算 `(x, y) = d_bW_a`。如果 `((x, y)](images/leanpub_equation_598.png)`\
  \ 位于 `\\infty](images/leanpub_equation_599.png)`则返回无效\n\n第二方法是乘以阶因子，然后乘以其逆。在这种情况下，步骤\
  \ 4 和 5 需要扩展为下面的步骤：\n\n1. 设置 `l = h^{-1} \\mod N](images/leanpub_equation_600.png)\n\
  \n2. ![A](img/leanpub_equation_601.png) 计算 `P_b = hW_b](images/leanpub_equation_602.png)\n\
  \n3. ![B](img/leanpub_equation_603.png) 计算 `P_a = hW_a](images/leanpub_equation_604.png)\n\
  \n4. ![A](img/leanpub_equation_605.png) 计算 `(x, y) = (d_al)P_b`。如果 `((x, y)](images/leanpub_equation_607.png)`\
  \ 位于 `\\infty](images/leanpub_equation_608.png)`则返回无效\n\n5. ![B](img/leanpub_equation_609.png)\
  \ 计算 `(x, y) = (d_bl)P_a`。如果 `((x, y)](images/leanpub_equation_611.png)` 位于 `\\\
  infty](images/leanpub_equation_612.png)`则返回无效\n\n其中 `N](images/leanpub_equation_613.png)`\
  \ 是与所使用的 EC 参数集相关的曲线的阶。\n\n\n\n\n```java\n 1   /**\n 2    * 生成长度为 256 位的约定的 AES\
  \ 密钥值。\n 3    *\n 4    * @param aPriv A 方的私钥。\n 5    * @param bPub B 方的公钥。\n 6 \
  \   * @param keyMaterial 与密钥混合的用户密钥材料。\n 7    * @return 生成 AES 密钥 (256 位)。\n 8 \
  \   */\n 9   public static SecretKey ecGenerateAESKey(\n10       PrivateKey aPriv,\
  \ PublicKey bPub, byte[] keyMaterial)\n11       throws GeneralSecurityException\n\
  12   {\n13       KeyAgreement agreement =\n14           KeyAgreement.getInstance(\"\
  ECCDHwithSHA256KDF\", \"BC\");\n15 \n16       agreement.init(aPriv, new UserKeyingMaterialSpec(keyMaterial));\n\
  17 \n18       agreement.doPhase(bPub, true);\n19 \n20       return agreement.generateSecret(\"\
  AES\");\n21   }\n```\n\n这是一个简单的示例，展示了双方之间如何使用 `ecGenerateAESKey()` 方法生成共享的 AES 密钥：\n\
  \n```java\n 1 public class ECCDHExample\n 2 {\n 3     public static void main(String[]\
  \ args)\n 4         throws Exception\n 5     {\n 6         //为 A 和 B 方生成密钥对\n 7\
  \         KeyPair aKp = generateECKeyPair();\n 8         KeyPair bKp = generateECKeyPair();\n\
  \ 9 \n10         // 密钥协商生成共享密钥\n11         byte[] keyMaterial = Strings.toByteArray(\"\
  For an AES key\");\n12 \n13         SecretKey aKey = ecGenerateAESKey(\n14     \
  \        aKp.getPrivate(), bKp.getPublic(), keyMaterial);\n15         SecretKey\
  \ bKey = ecGenerateAESKey(\n16             bKp.getPrivate(), aKp.getPublic(), keyMaterial);\n\
  17 \n18         // 比较两个返回值。\n19         System.out.println(\n20             Arrays.areEqual(aKey.getEncoded(),\
  \ bKey.getEncoded()));\n21     }\n 22 }\n```\n\n你可以看到，这种模式与我们在有限域上 Diffie-Hellman\
  \ 中看到的完全相同。唯一的区别在于密钥的生成方式。根据现有的惯例，运行此示例应该显示生成的两个密钥是相同的，并产生以下输出：\n\n```\ntrue\n```\n\
  \n### 添加临时密钥\n\n基于椭圆曲线的协商也支持统一模型（Unified Model）和 MQV。这两种方法都记录在 NIST SP 800-56A [29]\
  \ 中。此外基于椭圆曲线的 MQV 也在 RFC 5753 [105] 中定义用于 CMS。\n\n需要注意的是，执行 ECMQV 的某些方法目前受专利保护，如\
  \ RFC 5753 相关的 IPR 披露 [70] 所示。\n\n### ECDH - 统一模型\n\n在 ECC 下，统一模型遵循我们之前看到的相同过程。从\
  \ A 方的角度来看，该过程遵循以下步骤：\n\n1. ![A](img/leanpub_equation_615.png) 向 ![B](img/leanpub_equation_617.png)\
  \ 发送他们的公钥 ![(W_sa, W_ea)](img/leanpub_equation_616.png)\n\n2. ![B](img/leanpub_equation_618.png)\
  \ 向 ![A](img/leanpub_equation_620.png) 发送他们的公钥 ![(W_sb, W_eb)](img/leanpub_equation_619.png)\n\
  \n3. ![A](img/leanpub_equation_621.png) 计算 ![(x_s, y_s) = d_saW_sb](img/leanpub_equation_622.png)。如果\
  \ ![((x_s, y_s)](img/leanpub_equation_623.png) 位于 ![\\infty)](img/leanpub_equation_624.png)\
  \ 则返回无效。\n\n4. ![A](img/leanpub_equation_625.png) 计算 ![(x_e, y_e) = d_eaW_eb](img/leanpub_equation_626.png)。如果\
  \ ![((x_e, y_e)](img/leanpub_equation_627.png) 位于 ![\\infty)](img/leanpub_equation_628.png)\
  \ 则返回无效。\n\n5. ![A](img/leanpub_equation_629.png) 返回 ![x_e \\parallel x_s](img/leanpub_equation_630.png)\n\
  \n在 NIST SP 80-56A 中，上述过程被调整为包含与我们之前相同的因子的乘法。也可以通过*清除*因子来达到相同的效果。\n\n下面的示例方法展示了在统一模型下使用因子\
  \ ECDH 的情况，假设传入了完整的密钥。与之前的统一模型示例一样，它的密钥派生也是基于 SHA-256 的 X9.63 KDF。\n\n```java\n\
  \ 1   /**\n 2    * 使用 EC 统一 Diffie-Hellman 模型生成长度为 256 位的约定的 AES 密钥值。\n 3    *\n\
  \ 4    * @param aPriv A 方的私钥。\n 5    * @param aPubEph A 方的临时公钥。\n 6    * @param\
  \ aPrivEph A 方的临时私钥。\n 7    * @param bPub B 方的公钥。\n 8    * @param bPubEph B 方的临时公钥。\n\
  \ 10   * @return 生成的 AES 密钥 (256 位)。\n 11   */\n 12   public static SecretKey ecGenerateAESKey(\n\
  13       PrivateKey aPriv, PublicKey aPubEph, PrivateKey aPrivEph,\n14       PublicKey\
  \ bPub, byte[] keyMaterial)\n15       throws GeneralSecurityException\n16   {\n\
  17       KeyAgreement agreement =\n18           KeyAgreement.getInstance(\"ECCDHwithSHA256KDF\"\
  , \"BC\");\n19 \n20       agreement.init(aPriv, new UserKeyingMaterialSpec(keyMaterial));\n\
  21 \n22       agreement.doPhase(bPub, true);\n23 \n24       return agreement.generateSecret(\"\
  AES\");\n25   }\n```\n\n\n\n密钥确认（Key Confirmation）在 NIST SP 800-56A [29] 第 5.9 节中描述。它提供了另一种引入或加强与密钥协商机制配合使用的身份验证机制。。基本技术并不难理解——用于生成共享密钥的\
  \ `KDF` 也用于生成共享的 MAC 密钥。通过将 `KDF` 生成的派生密钥材料分为两部分来实现：\n\n![Mac \\parallel SecretKey\
  \ = DerivedKeyMaterial](img/leanpub_equation_647.png)\n\nNIST SP 800-56A 第 5.9.1\
  \ 至 5.9.3 节对哪些数据适合包含在 MAC 处理的数据中进行了详细讨论。可能的数据包括诸如公钥、参与者的身份标识符（IDs）和/或之前约定的秘密值（secret）。我们不会在此处重复完整的讨论，但有两点值得注意。第一，所选\
  \ MAC 的强度在位安全强度上，至少应与预期生成的共享密钥的强度相当。第二，正如你所预期的那样，MAC 密钥在使用后应立即丢弃，不应用于任何其他用途。\n\n\
  目前，只有 BCFIPS API 直接支持密钥确认。在 `org.bouncycastle.crypto.util` 中提供了一个 `ByteMacData`\
  \ 类，以防你想遵循 NIST SP 800-56A 中使用的 MAC 数据构造。在使用密钥确认时，`KeyAgreement` 类返回一个 `AgreedKeyWithMacKey`，该对象提供了同时访问派生的共享密钥和\
  \ MAC 密钥的方法。\n\n### 生成 AgreedKeyWithMacKey\n\nBCFIPS API 通过扩展传递给 `KeyAgreement.generateSecret()`\
  \ 的算法字符串中允许的语法，支持从 `KeyAgreement` 类返回两个密钥。基本语法遵循以下格式：\n\n“`macAlgorithm[macKeySizeInBits]/cipherAlgorithm[cipherKeySizeInBits]`”\n\
  \n以下方法按照我们之前看过的的方法，生成一个 256 位的 AES 密钥。在这种情况下，`generateSecret()` 方法传递了一个内容为“HmacSHA512[256]/AES[256]”的字符串，因此该方法返回的不是简单的\
  \ `SecretKey`，而是返回一个 `AgreedKeyWithMacKey`，其中包含一个长度为 256 位的 SHA-512 HMAC 密钥。\n\n\
  ```\n 1   /**\n 2    * 使用 ECMQV 生成一个 256 位的约定 AES 密钥以及关联的 \n 3    * 256 位 SHA-512\
  \ MAC 密钥。\n 4    * \n 5    * @param aPriv A 方的私钥。\n 6    * @param aPubEph A 方的临时公钥。\n\
  \ 7    * @param aPrivEph A 方的临时私钥。\n 8    * @param bPub B 方的公钥。\n 9    * @param\
  \ bPubEph B 方的临时公钥。\n10    * @return 包含两个密钥的 AgreedKeyWithMacKey。\n11    */\n12\
  \   public static AgreedKeyWithMacKey keyConfGenerateAESKey(\n11      PrivateKey\
  \ aPriv, PublicKey aPubEph, PrivateKey aPrivEph,\n14      PublicKey bPub, PublicKey\
  \ bPubEph, byte[] keyMaterial)\n15      throws GeneralSecurityException\n16   {\n\
  17       KeyAgreement agreement =\n18           KeyAgreement.getInstance(\"ECMQVwithSHA256KDF\"\
  , \"BCFIPS\");\n19 \n20       agreement.init(aPriv,\n21           new MQVParameterSpec(aPubEph,\
  \ aPrivEph, bPubEph, keyMaterial));\n22 \n23       agreement.doPhase(bPub, true);\n\
  24 \n25       return (AgreedKeyWithMacKey)\n26                   agreement.generateSecret(\"\
  HmacSHA512[256]/AES[256]\");\n27   }\n```\n\n两个密钥的顺序反映了它们从派生密钥材料中提取的顺序。派生密钥材料的前\
  \ 256 位被用作 HMAC 密钥源，接下来的 256 位派生密钥材料被用于 AES 密钥。\n\n### 计算 MAC\n\n一旦返回 `AgreedKeyWithMacKey`，我们应该在继续后续之前检查\
  \ MAC。在 FIPS 环境中，我们还应该在使用 MAC 密钥后立即将其擦除。MAC 密钥实现了 `ZeroizableSecretKey` 接口以实现这一点。\n\
  \n以下方法将验证为 SHA-512 HMAC 计算的 MAC，即我们在生成方法中指定的相同 MAC 算法。你可以看到第 19 行对 `zeroize()` 方法的调用。\n\
  \n```\n 1   /**\n 2    * 为传入的 MAC 数据计算 MAC 标签值。\n 3    * 注意：我们在返回标签值之前会将 MAC 密钥置零。\n\
  \ 4    * \n 5    * @param macKey 用于初始化 MAC 的密钥。\n 6    * @param macData 用于计算 MAC\
  \ 标签的数据。\n 7    * @return MAC 标签值\n 8    */\n 9   public static byte[] calculateMAC(\n\
  10      ZeroizableSecretKey macKey, byte[] macData)\n11      throws GeneralSecurityException\n\
  12   {\n13      Mac mac = Mac.getInstance(\"HmacSHA512\", \"BCFIPS\");\n14 \n15\
  \      mac.init(macKey);\n16 \n17      byte[] tag = mac.doFinal(macData);\n18 \n\
  19      macKey.zeroize();\n20 \n21      return tag;\n22  }\n```\n\n正如你所料，一旦 MAC\
  \ 密钥被擦除，它就不再使用了。\n\n### 整合\n\n以下示例展示了使用 `ByteMacData` 类使用 `KeyAgreement` 和 MAC 方法。\n\
  \n```java\n1 /**\n2  * 显示使用 KeyAgreement 和临时\n3  * 的密钥对示例。\n4  */\n5 public class\
  \ KeyConfExample {\n6     public static void main(String[] args)\n7         throws\
  \ Exception {\n8         // 为 A 方和 B 方生成密钥对\n9         byte[] keyMaterial = Strings.toByteArray(\"\
  AES key\");\n10        // A 方。\n11        AgreedKeyWithMacKey aKey = keyConfGenerateAESKey(\n\
  12             aPriv, aPubEph, aPrivEph,\n13             bPub, bPubEph, keyMaterial);\n\
  14 \n15        // B 方。\n16        AgreedKeyWithMacKey bKey = keyConfGenerateAESKey(\n\
  17             bPriv, bPubEph, bPrivEph,\n18             aPub, aPubEph, keyMaterial);\n\
  19        );\n20 \n21        // builder 设置\n22        ByteMacData byteMacData =\
  \ new ByteMacData.Builder(\n23                ByteMacData.Type.BILATERALU, // 常量\n\
  24                Strings.toByteArray(\"Party A\"), // A 方 ID\n25              \
  \  Strings.toByteArray(\"Party B\"), // B 方 ID\n26                aPubEph.getPublic().getEncoded(),\
  \ // 临时数据 A\n27                bPubEph.getPublic().getEncoded()) // 临时数据 B\n28 \
  \           .withText(Strings.toByteArray(\"hello, world!\")) // 可选\n29        \
  \    .build();\n30 \n31        // 为 MAC 构建输入\n32        byte[] aTag = calculateMAC(aKey.getMacKey(),\
  \ byteMacData.getMacData());\n33        byte[] bTag = calculateMAC(bKey.getMacKey(),\
  \ byteMacData.getMacData());\n34 \n35        // 比较两个返回值。\n36        System.err.println(\"\
  keys equal: \"\n37            + Arrays.areEqual(aKey.getEncoded(), bKey.getEncoded()));\n\
  38        System.err.println(\"tags equal: \"\n39            + Arrays.areEqual(aTag,\
  \ bTag));\n40    }\n41 }\n```\n\n构建器设置符合 NIST SP 800-56A 第 5.9.1 至 5.9.3 节的讨论。你也将那里找到诸如\
  \ `BILATERALU` 等常量的定义。从根本上说，常量被用作区分符，以帮助在不同情况计算 MAC 标签值时避免意外冲突。如果一切顺利，在示例结束时，你将获得相同的约定密钥和\
  \ MAC 标签值，并应该看到以下输出：\n\n```\nkeys equal: true\ntags equal: true\n```\n\n\n\n如果你尝试更改几个输入值，你会发现其实不需要费太大精力就能检测到协议协商中的失败或干扰。\n\
  \n### 总结\n\n在本章中，我们研究了如何使用公钥加密来传输密钥、执行密钥协商以及交换密钥。这涵盖了算法选择的广泛范围，包括每种协议的 `Elliptic\
  \ Curve`（椭圆曲线）、`Diffie-Hellman` 以及它们的派生变。本章还涵盖了许多协议的扩展，以提高它们的可靠性。\n\n我们查看了使用如 `RSA-OAEP`、`ElGamal-OAEP`\
  \ 和 `RSA-KEM` 等算法进行密钥封装和解封装的各种选项，并为每个算法提供了实例示例。\n\n对于密钥协商和密钥交换，`Diffie-Hellman`\
  \ 在 `NIST` 中非常重要，因此我们在本章中使用了这些算法演示了完整的示例。\n\n最后，我们还查看了使用瞬态密钥（ephemeral keys）对密钥协商协议的一系列改进。本章涵盖了两种主要方法：`Unified\
  \ Model`（统一模型）和 `MQV`。此外，`NIST SP 800-56A` 中定义的密钥确认协议为加强密钥协商机制提供了额外选项。\n\n## 第 8\
  \ 章：X.509 证书与属性证书\n\n虽然公钥算法解决了与安全传输密钥或为人们提供验证其数字签名的机制相关的“数值”问题，但现实情况是，一组数字看起来看起来非常相似，因此需要一种方法将实体与特定的公钥关联起来。\n\
  \n将公钥与身份关联并断言该关联有效性的常用方法之一是使用 `X.509` [57] 证书结构。`X.509 Certificates` 用于将密钥与身份关联。该身份是证书的主体（subject）。另一个身份是证书的签名者，他也被视为认证颁发机构（CA），也称为证书颁发者，它也存储在证书中，以便（如果可能的话）追溯证书的来源。\n\
  \n在本章中，我们将研究公钥证书是如何创建的，以及在创建后如何将额外的属性与它们关联起来。在处理这个问题时，我们首先需要查看证书最初是如何与身份关联的。\n\n\
  ### X.500 区分名称 (Distinguished Name)\n\n证书身份的基本单位是 `X.500` 区分名称。`X.500` 中的主要 `ASN.1`\
  \ 结构是 `Name`，我们将看到它被用于填充 `X.509` 证书中的身份字段，并提供在扩展和其他字段中表示身份的方法。\n\n```\n Name ::=\
  \ CHOICE {\n                RDNSequence }\n\n  RDNSequence ::= SEQUENCE OF RelativeDistinguishedName\n\
  \n  RelativeDistinguishedName ::= SET SIZE (1..MAX) OF AttributeTypeAndValue\n\n\
  \  AttributeTypeAndValue ::= SEQUENCE {\n                               type  OBJECT\
  \ IDENTIFIER,\n                               value ANY }\n```\n\n在 `Bouncy Castle`\
  \ 中，`X.500` 名称由 `X500Name` 类表示，该类定义在 `org.bouncycastle.asn1.x500` 层次结构下。你可能会奇怪，为什么整个包层次结构要专门用于这样一个简单的结构。现实情况是，虽然结构简单，但它的用途和应用非常多样——以至于正如\
  \ Peter Gutmann 出色的《X.509 风格指南》[69] 所指出的，你甚至可以轻松包含一段显示某人玩猫的 MPEG 电影！\n\n目前 `X500`\
  \ 包层次结构由两个包组成：核心 `x500` 包和子包 `x500.style`。核心包包含 `X500Name` 类以及 `X500NameBuilder`\
  \ 类，以及代表构成 `Name` 的 `SEQUENCE` 项的组件类：`RDN` 代表相对区分名称 (RelativeDistinguishedName)，`AttributeTypeAndValue`\
  \ 代表属性类型和值 (AttributeTypeAndValue) 结构。`style` 包包含了模板类，提供了配置 `X500Name` 对象以符合不同标准的方法。当你发现自己正尝试符合某个区分名称的规范（profile\
  \ for Distinguished Names），而 `BC` 类并不完全适用时，可以扩展样式类，或者复制并编辑这些类，以产生合适的内容。\n\n`JCA`\
  \ 依赖 `X500Principal` 来支持 `X.500` 名称结构。与 `BC` 的 `X500Name` 类不同，`X500Principal` 只能从字符串或字节编码创建——没有构建器类。因此，即使你限制自己使用\
  \ `X500Principal`，有时使用 `X500NameBuilder` 来构造名称，然后使用 `X500Name.getEncoded()` 从字节编码创建新的\
  \ `X500Principal` 可能会更好，如下所示：\n\n```\nX500NameBuilder x500Bldr = new X500NameBuilder();\n\
  \nx500Bldr.addRDN(BCStyle.CN, \"Example X.500 Name\");\n\nX500Principal x500Principal\
  \ = new X500Principal(x500Bldr.build().getEncoded())\n```\n\n这特别适用于向单个 `RDN` 添加多个\
  \ `ATVs` 的情况。\n\n你可以通过使用 `X500Name` 的 `getInstance()` 方法将 `X500Principal` 转换为 `X500Name`：\n\
  \n```\nX500Name x500Name = X500Name.getInstance(x500Principal.getEncoded())\n```\n\
  \n在向单个 `RDN` 添加多个 `ATVs` 的情况下，尽量避免使用字符串表示，如果必须使用，请谨慎使用。`X500Name` 和 `X500Principal`\
  \ 类都支持字符串的转换，但结果取决于这些类如何解释输入。我们现在来看其中的一些问题。\n\n### X.500 遇到字符串\n\n在使用 X500 名称时注意到的第一个问题是有多种方法生成其字符串表示。其中之一是使用\
  \ `ASN.1 OBJECT IDENTIFIER` (`OIDs`) 的简写来表示属性类型（例如，“CN”实际上是 OID “2.5.4.3”的简写）。第二个问题是构成\
  \ `Name` 的 `SEQUENCE` 实际上有两种排序方式，取决于使用哪种约定。第一种 ISO 约定按照顺序转换，因此字符串表示 RDN 的部分是第一个\
  \ RDN，依此类推。第二种 IETF 和 `RFC 4519` [92] 使用的约定通过反序转换，因此字符串表示 RDN 的部分实际上是序列中的最后一个 RDN。\n\
  \n如何选择？如今 IETF 排序可能是最常见的，尽管如此，如果你正在生成或处理字符串格式的 X500 名称，检查工作所在的规范是否选择了特定的排序可能会避免未来的尴尬。\n\
  \n在 `Bouncy Castle` 的情况下，默认排序是 ISO 排序。`JCA` 的 `X500Principal` 类遵循 IETF 排序。\n\nBouncy\
  \ Castle 的 `X500Name` 类允许定义本地样式，因此，你可以使用以下方法指定使用 `RFC 4519` 中的方法将 `X500Name` 转换为字符串：\n\
  \n```\n   /**\n   * 将 X500Name 转换为 IETF 样式。\n   */\n  public static X500Name toIETFName(X500Name\
  \ name)\n  {\n      return X500Name.getInstance(RFC4519Style.INSTANCE, name);\n\
  \  }\n```\n\n\n\n\nBouncy Castle 的 `X500Name` 类默认使用这种方法。JCA 的 `X500Principal` 类会将待比较的名称转换为规范字符串表示，然后在内部进行比较。\n\
  \n### 公钥证书\n\n与 X.500 一样，X.509 本身在提供功能方面非常慷慨，因此人们通常会采用特定的配置（profile）来创建和评估证书。对于互联网而言，最流行的是\
  \ RFC-5280 [101]。虽然不同的配置在解释方式可能有所不同，但格式始终是 X 509 中描述的。\n\n### Certificate 和 TBSCertificate\n\
  \n在我们开始查看证书的之前之前，快速查看涉及的 ASN.1 结构，以了解 API 底层到底发生了什么。虽然在这个世界上，很少东西能让开发者像面对 ASN.1\
  \ 模块那样感到畏惧，但理解这些概念是值得的，因为如果你对“盒子内部”到底发生了什么有所了解，那么调试出错的情况就会变得容易得多。\n\n下方的 ASN.1 片段提供了\
  \ X.509 证书的核心定义。如果你需要，可以在附录 A 的讨论中找到关于其含义的更多详细信息。\n\n```\nCertificate  ::=  SEQUENCE\
  \  {\n     tbsCertificate       TBSCertificate,\n     signatureAlgorithm   AlgorithmIdentifier,\n\
  \     signature            BIT STRING  }\n\nTBSCertificate  ::=  SEQUENCE  {\n \
  \    version         [0]  Version DEFAULT v1,\n     serialNumber         CertificateSerialNumber,\n\
  \     signature            AlgorithmIdentifier,\n     issuer               Name,\n\
  \     validity             Validity,\n     subject              Name,\n     subjectPublicKeyInfo\
  \ SubjectPublicKeyInfo,\n     issuerUniqueID  [1]  IMPLICIT UniqueIdentifier OPTIONAL,\n\
  \                          -- If present, version MUST be v2 or v3\n     subjectUniqueID\
  \ [2]  IMPLICIT UniqueIdentifier OPTIONAL,\n                          -- If present,\
  \ version MUST be v2 or v3\n     extensions      [3]  Extensions OPTIONAL\n    \
  \                      -- If present, version MUST be v3 --  }\n\nVersion  ::= \
  \ INTEGER  {  v1(0), v2(1), v3(2)  }\n\nCertificateSerialNumber  ::=  INTEGER\n\n\
  Validity ::= SEQUENCE {\n     notBefore      Time,\n     notAfter       Time  }\n\
  \nTime ::= CHOICE {\n     utcTime        UTCTime,\n     generalTime    GeneralizedTime\
  \ }\n\nUniqueIdentifier  ::=  BIT STRING\n\nSubjectPublicKeyInfo  ::=  SEQUENCE\
  \  {\n     algorithm            AlgorithmIdentifier,\n     subjectPublicKey    \
  \ BIT STRING  }\n\nExtensions  ::=  SEQUENCE SIZE (1..MAX) OF Extension\n\nExtension\
  \  ::=  SEQUENCE  {\n     extnID      OBJECT IDENTIFIER,\n     critical    BOOLEAN\
  \ DEFAULT FALSE,\n     extnValue   OCTET STRING\n                 -- contains the\
  \ DER encoding of an ASN.1 value\n                 -- corresponding to the extension\
  \ type identified\n                 -- by extnID\n     }\n```\n\n首先也是最重要的一点是 `TBSCertificate`\
  \ 结构包含了证书的主体，包括公钥（编码在 `SubjectPublicKeyInfo` 中）。第二点是存储在 `Certificate` 中的签名是基于 `TBSCertificate`\
  \ 的 DER 编码计算的（在此情况下，`TBS` 实际上代表“To Be Signed”，即待签名）。使用 DER（区分编码规则）在这里非常重要，这意味着在计算签名哈希值时，证书的评估结果始终保持一致。\n\
  \n第二个需要注意的是有效期，证书的颁发是为了在特定时期内有效。这一决定由 CA（颁发机构）做出，并反映了多种考虑，包括签名算法的强度、证书主体（`subject`）最初应该持有证书多长时间，以及公钥的强度以及它或其关联私钥可能的使用次数。\n\
  \n最后是版本。极少看到 `v2` 证书——`issuerUniqueID` 和 `subjectUniqueID` 是为了 `v2` 添加的，事实证明这也许是那些最好留在图纸上的主意之一。通常情况下你只会遇到\
  \ `v1` 和 `v3` 证书，如果你看到 `v1` 证书，它通常是自签名的并用信任锚点。版本 `v3` 的证书通常带有扩展，在日常使用中，我们最经常处理这类证书，例如验证文档或时间戳，或加密密钥。我们将在后面详细查看证书中常见的扩展。\n\
  \n如你所见，`TBSCertificate` 还包含了我们需要身份信息，既可以帮助我们识别颁发者主体（`subject`），以及序列号，以便我们判断该证书来自我们正在查看的颁发者。除了有用之外，这使得颁发者撤销证书成为可能，我们将在本章稍后讨论这一主题。\n\
  \n### 创建基础公钥证书\n\n在我们查看生成证书之前，定义几个实用方法会很有用。其中一个提供合适的日期：\n\n```\n 1   /**\n 2   \
  \ * 计算一个以秒为单位日期（适用于 PKIX 配置 - RFC 5280）\n 3    *\n 4    * @param hoursInFuture 现在之后的小时数，可以为负数。\n\
  \ 5    * @return 设置为现在 + (hoursInFuture * 60 * 60) 秒的 Date\n 6    */\n 7   public\
  \ static Date calculateDate(int hoursInFuture)\n 8   {\n 9        long secs = System.currentTimeMillis()\
  \ / 1000;\n10 \n11        return new Date((secs + (hoursInFuture * 60 * 60)) * 1000);\n\
  12   }\n```\n\n另一个是为提供序列号：\n\n```\n 1   private static long serialNumberBase = System.currentTimeMillis();\n\
  \ 2 \n 3   /**\n 4    * 使用单调递增的值计算序列号。\n 5    *\n 6    * @return 表示序列中下一个序列号的 BigInteger。\n\
  \ 7    */\n 8   public static synchronized BigInteger calculateSerialNumber()\n\
  \ 9   {\n10       return BigInteger.valueOf(serialNumberBase++);\n11   }\n```\n\n\
  你将看到 Bouncy Castle 的 API 会生成 `X509CertificateHolder` 类。这些类的优点是独立于提供者的，因为它们仅仅作为证书的载体。在我们查看如何构建基础证书之后，我们将查看如何将\
  \ `X509CertificateHolder` 转换为 Java 的 `X509Certificate` 对象之一。\n\n以下示例显示了如何生成自签名的版本\
  \ 1 证书。版本 1 证书仍然被广泛使用，但仅作为信任锚点，否则无法限制其用途。当我们查看带有扩展的证书时，将看到限制证书用途的示例。\n\n\n\n\n\n\
  ```java\n  /**\n   * 构建一个示例自签名 V1 证书，作为信任锚点或\n   * 根证书。\n   *\n   * @param keyPair\
  \ 用于签名和提供公钥的密钥对。\n   * @param sigAlg 用于签名证书的签名算法。\n   * @return 包含 V1 证书的 X509CertificateHolder。\n\
  \   */\n  public static X509CertificateHolder createTrustAnchor(\n          KeyPair\
  \ keyPair, String sigAlg)\n          throws OperatorCreationException\n  {\n   \
  \   X500NameBuilder x500NameBld = new X500NameBuilder(BCStyle.INSTANCE)\n      \
  \        .addRDN(BCStyle.C, \"AU\")\n              .addRDN(BCStyle.ST, \"Victoria\"\
  )\n              .addRDN(BCStyle.L, \"Melbourne\")\n              .addRDN(BCStyle.O,\
  \ \"The Legion of the Bouncy Castle\")\n              .addRDN(BCStyle.CN, \"Demo\
  \ Root Certificate\");\n\n      X500Name name = x500NameBld.build();\n\n      X509v1CertificateBuilder\
  \ certBldr = new JcaX509v1CertificateBuilder(\n                                \
  \                  name,\n                                                  calculateSerialNumber(),\n\
  \                                                  calculateDate(0),\n         \
  \                                         calculateDate(24 * 31),\n            \
  \                                      name,\n                                 \
  \                 keyPair.getPublic());\n\n      ContentSigner signer = new JcaContentSignerBuilder(sigAlg)\n\
  \                               .setProvider(\"BC\").build(keyPair.getPrivate());\n\
  \n      return certBldr.build(signer);\n  }\n```\n\n在第 14 到 19 行中，我们可以看到使用 `X500NameBuilder`\
  \ 来创建一个 `X.500` 名称，以提供与证书关联的身份详细信息。证书的内容在第 23 到 29 行进行构建，并使用传入方法的私钥和签名算法名称创建一个签名者。\n\
  \n由于该证书是自签名的，因此证书体中的主体（subject）和颁发者（issuer）被设置为同一个名称。如果你收到了其中一个，你真的得听信出示者的话。\n\n\
  要调用该方法，我们只需要决定使用哪种公钥算法以及使用哪种签名算法来签署证书。在下面的代码段中，我们可以看到如何调用该方法创建一个使用 `ECDSA` 通过 `SHA-256`\
  \ 签名的自签名证书。\n\n```java\nKeyPairGenerator kpGen = KeyPairGenerator.getInstance(\"\
  EC\", \"BC\");\nKeyPair trustKp = kpGen.generateKeyPair();\n\nX509CertificateHolder\
  \ trustCert =\n                          createTrustAnchor(trustKp, \"SHA256withECDSA\"\
  );\n```\n\n### 将 X509CertificateHolder 转换为 X509Certificate\n\n提供了 `org.bouncycastle.cert.jcajce.JcaX509CertificateConverter`\
  \ 类用于将 `X509CertificateHolder` 对象转换为普通的 JCA `X509Certificate` 对象。\n\n`JcaX509CertificateConverter`\
  \ 类可以根据 JVM 中当前的提供者优先级来生成证书，或者你可以指定一个特定的提供者。在示例中，我们通过使用其名称指定了 Bouncy Castle 提供者。\n\
  \n```java\nX509CertificateHolder certHldr = ...\n\nX509Certificate cert = new JcaX509CertificateConverter()\n\
  \                                                   .setProvider(\"BC\")\n     \
  \                                              .getCertificate(certHldr);\n```\n\
  \n要反向转换，只需将 `X509Certificate` 的编码传递给 `X509CertificateHolder`，或者将 `X509Certificate`\
  \ 传递给 `JcaX509CertificateHolder`，它会为你完成编码步骤。\n\n```java\nX509Certificate cert =\
  \ ...\nX509CertificateHolder certHldr = new JcaX509CertificateHolder(cert);\n```\n\
  \n正如我们接下来看到的，你也可以使用 `CertificateFactory` 类来转换 `X509CertificateHolder`。\n\n### CertificateFactory\
  \ 类\n\n`java.security.cert` 包中的 `CertificateFactory` 类也可以用于将 `X509CertificateHolder`\
  \ 或其他形式的 `X.509` 证书转换为 Java 的 `X509Certificate` 对象之一。我们将在下一章中看到该类的进一步用法，因为 `CertificateFactory`\
  \ 也用于证书撤销列表 (`CRLs`)、以及证书路径的构建与验证。\n\n`CertificateFactory` 类同样是基于提供者的，需要使用 `getInstance()`\
  \ 方法来实例化。它有两个与生成公钥证书相关的方法：`generateCertificate()` 和 `generateCertificates()`。这些方法可以用于读取各种编码的证书（通常包括\
  \ `PEM` 和 `BER/DER`），然后生成单个证书（`generateCertificate()` 的情况）或证书集合（`generateCertificates()`\
  \ 的情况）。\n\n`X509CertificateHolder` 的 `getEncoded()` 方法会生成封装在类类中的 `X.509` 证书的 BER\
  \ 编码。你可以使用该方法以如下方式为 `generateCertificate()` 提供输入：\n\n```java\n  /**\n   * 使用 CertificateFactory\
  \ 将 X509CertificateHolder 转换为 X509Certificate 的简单方法。\n   */\n  public static X509Certificate\
  \ convertX509CertificateHolder(\n                                      X509CertificateHolder\
  \ certHolder)\n          throws GeneralSecurityException, IOException {\n      CertificateFactory\
  \ cFact = CertificateFactory.getInstance(\"X.509\", \"BC\");\n\n      return (X509Certificate)cFact.generateCertificate(\n\
  \                          new ByteArrayInputStream(certHolder.getEncoded()));\n\
  \  }\n```\n\n### 创建带有扩展的 CA 证书\n\nX.509 版本 3 主要创新是引入了证书扩展。在继续之前，最好先回顾一下扩展是如何使用 ASN.1\
  \ 结构定义的。\n\n```asn\nExtension ::= SEQUENCE {\n    extnID      OBJECT IDENTIFIER,\n\
  \    critical    BOOLEAN DEFAULT FALSE,\n    extnValue   OCTET STRING -- 包含对应 extnID\
  \ 标识的扩展类型的 ASN.1 值的编码\n}\n```\n\nOBJECT IDENTIFIER `extnID` 用于标识 `extnValue` 的内容，`critical`\
  \ 用于指示 CA 是否认为此扩展重要到需要任何想要使用该证书的人都理解它，然后 `extnValue` 是一个 `OCTET STRING`，持有扩展值的实际\
  \ DER 编码。注意，由于 `critical` 的默认值为 `false`，如果它为 `false`，则在扩展结构进行 DER 编码时该值将不存在。\n\n\
  扩展提供了两个好处：它们允许添加关于证书主体的额外信息，例如它可能可能被认知的其他名称；它们还使得 CA 能够对证书的用途放置某些限制。在我们稍后查看证书请求（CertificationRequests）时，这是一个重要的点：虽然可以请求添加扩展，但证书中添加哪些扩展是由签名证书的\
  \ CA 决定的。\n\n这也允许 CA 安全地创建其他 CA 来代表它们行动。不能用于 CA 的证书终止了从路径顶部信任锚点领先证书链（或证书路径）。终止链的证书被称为端实体证书（end-entity\
  \ certificate）。端实体证书通常与特定服务、组织或个人的身份直接绑定。\n\n当 `X509CertificateHolder` 以对象形式呈现扩展项时，如果你正在使用\
  \ JCA\n\n\n\n\n对于 `X509Certificate`，要么有一个与该扩展相关的特定方法，要么你需要使用 `X509Certificate.getExtensionValue()`\
  \ 来获取扩展值。请注意，返回的扩展值将是包含扩展值的 DER 编码 `OCTET STRING`，而不是扩展值本身。你可以使用以下方法解开扩展值，并获取代表该扩展值的内容字节：\n\
  \n```java\n/**\n * 从 JCA X509Certificate 中提取扩展的 DER 编码值字节。\n *\n * @param cert 感兴趣的证书。\n\
  \ * @param extensionOID 与感兴趣的扩展相关的 OID。\n * @return 扩展内部的 DER 编码，如果缺少扩展，则返回 null。\n\
  \ */\npublic static byte[] extractExtensionValue(\n        X509Certificate cert,\n\
  \        ASN1ObjectIdentifier extensionOID)\n{\n    byte[] octString = cert.getExtensionValue(extensionOID.getId());\n\
  \n    if (octString == null)\n    {\n        return null;\n    }\n\n    return ASN1OctetString.getInstance(octString).getOctets();\n\
  }\n```\n\n其中 `extensionOID` 是与该扩展相关的 `OBJECT IDENTIFIER`。\n\n考虑以下示例，它创建了一个可以用于签署其他证书的中间证书。该方法使用了\
  \ `JcaX509ExtensionUtils` 类并创建了多个扩展，以提供关于发行者的额外信息、证书公钥的通用标识符，以及签署该证书的 CA 期望该证书用途的细节。\n\
  \n```java\n/**\n * 构建一个可以作为 CA 证书的示例 V3 中间证书。\n *\n * @param signerCert 带有公钥的证书，该公钥以后将用于验证此证书的签名。\n\
  \ * @param signerKey 用于在证书中签名的私钥。\n * @param sigAlg 用于签名证书的签名算法。\n * @param certKey\
  \ 要安装在证书中的公钥。\n * @param followingCACerts\n * @return 包含 V3 证书的 X509CertificateHolder。\n\
  \ */\npublic static X509CertificateHolder createIntermediateCertificate(\n     \
  \   X509CertificateHolder signerCert, PrivateKey signerKey,\n        String sigAlg,\
  \ PublicKey certKey, int followingCACerts)\n        throws CertIOException, GeneralSecurityException,\n\
  \               OperatorCreationException\n{\n    X500NameBuilder x500NameBld =\
  \ new X500NameBuilder(BCStyle.INSTANCE)\n            .addRDN(BCStyle.C, \"AU\")\n\
  \            .addRDN(BCStyle.ST, \"Victoria\")\n            .addRDN(BCStyle.L, \"\
  Melbourne\")\n            .addRDN(BCStyle.O, \"The Legion of the Bouncy Castle\"\
  )\n            .addRDN(BCStyle.CN, \"Demo Intermediate Certificate\");\n\n    X500Name\
  \ subject = x500NameBld.build();\n\n    X509v3CertificateBuilder certBldr = new\
  \ JcaX509v3CertificateBuilder(\n            signerCert.getSubject(),\n         \
  \   calculateSerialNumber(),\n            calculateDate(0),\n            calculateDate(24\
  \ * 31),\n            subject,\n            certKey);\n\n    JcaX509ExtensionUtils\
  \ extUtils = new JcaX509ExtensionUtils();\n\n    certBldr.addExtension(Extension.authorityKeyIdentifier,\n\
  \            false, extUtils.createAuthorityKeyIdentifier(signerCert))\n       \
  \     .addExtension(Extension.subjectKeyIdentifier,\n                    false,\
  \ extUtils.createSubjectKeyIdentifier(certKey))\n            .addExtension(Extension.basicConstraints,\n\
  \                    true, new BasicConstraints(followingCACerts))\n           \
  \ .addExtension(Extension.keyUsage,\n                    true, new KeyUsage(\n \
  \                                           KeyUsage.digitalSignature\n        \
  \                                  | KeyUsage.keyCertSign\n                    \
  \                      | KeyUsage.cRLSign));\n\n    ContentSigner signer = new JcaContentSignerBuilder(sigAlg)\n\
  \            .setProvider(\"BC\").build(signerKey);\n\n    return certBldr.build(signer);\n\
  }\n```\n\n给定信任锚点 `trustAnchorKey` 的 `PrivateKey` 及其关联证书 `trustCert`，我们可以调用上述方法创建一个如下单级\
  \ CA 证书：\n\n```java\nKeyPairGenerator kpGen = KeyPairGenerator.getInstance(\"EC\"\
  , \"BC\");\nKeyPair caKp = kpGen.generateKeyPair();\n\nX509CertificateHolder caCert\
  \ =\n        createIntermediateCertificate(trustCert,\n                trustAnchorKey,\n\
  \                \"SHA256withECDSA\", caKp.getPublic(), 0);\n```\n\n注意调用时传递了 0 作为\
  \ `followingCACerts`。我们将在查看 `BasicConstraints` 时看到它的含义。\n\n#### 常见扩展\n\n在了解了所添加的扩展后，值得花一点时间理解它们的实际含义。这里涵盖的扩展应仅作为指南，如果你需要解释它们，应该检查\
  \ RFC 5280 的相关章节。\n\n##### 基本约束 (Basic Constraints)\n\n`basicConstraints` 扩展由常量\
  \ `Extension.basicConstraints` 标识，其 OID 值为 `2.5.29.19` (`id-ce-basicConstraints`)。它的\
  \ ASN.1 定义如下：\n\n```asn\nBasicConstraints ::= SEQUENCE {\n    cA               \
  \ BOOLEAN DEFAULT FALSE,\n    pathLenConstraint INTEGER (0..MAX) OPTIONAL }\n```\n\
  \n例如，如果 `BasicConstraints` 扩展中的 `cA` 为 `TRUE` 且 `pathLenConstraint` 为 `0`，那么从扩展的角度来看，该证书允许签署其他证书，但被签署的证书不能用于签署其他证书并延长链。\n\
  \n在第一个示例中，`BasicConstraints` 扩展通过以下行添加：\n\n```java\n.addExtension(Extension.basicConstraints,\n\
  \             true, new BasicConstraints(followingCACerts))\n```\n\n由于以 `followingCACerts`\
  \ 变量的形式提供了 `pathLenConstraint`，这告诉我们该证书是作为 CA 发行的，前提是后续不能超过 `followingCACerts` 个\
  \ CA，值为 0 意味着只有实体证书可以随其后。\n\n使用 `X509CertificateHolder` 类恢复 `BasicConstraints` 时可以使用：\n\
  \n```java\nBasicConstraints basicConstraints = BasicConstraints.fromExtensions(\n\
  \                                                  certHldr.getExtensions());\n\
  ```\n\n来获取对象。\n\n在 Java 的 `X509Certificate` 类中，提供了方法 `X509Certificate.getBasicConstraints()`，它返回一个\
  \ `int`。该 `int` 值代表 `pathLenConstraint`，除非 `cA` 为 `FALSE`，此时 `getBasicConstraints()`\
  \ 返回 `-1`。\n\n##### 机构密钥标识 (Authority Key Identifier)\n\n`authorityKeyIdentifier`\
  \ 扩展由常量 `Extension.authorityKeyIdentifier` 标识，其 OID 值为 `2.5.29.35` (`id-ce-authorityKeyIdentifier`)。它的\
  \ ASN.1 定义如下：\n\n```asn\nAuthorityKeyIdentifier ::= SEQUENCE {\n    keyIdentifier\
  \ [0] KeyIdentifier OPTIONAL,\n    authorityCertIssuer [1] GeneralNames OPTIONAL,\n\
  \    authorityCertSerialNumber [2] CertificateSerialNumber OPTIONAL }\n\nKeyIdentifier\
  \ ::= OCTET STRING\n```\n\n\n\n\n此扩展的目的是识别用于验证证书签名的公钥，或者换句话说，是验证证书上的签名，该签名将证书上的公钥与证书的主体（subject）以及任何相关的扩展绑定在一起。因此，如果你愿意接受此扩展所识别的公钥具有权威性，那么你接受存储在证书中关联属性的公钥也是有效的，这是合逻辑的。另一方面，如果你无法理解此扩展或无法验证证书的签署者，那么接受证书中的任何内容更多是出于盲目信任，而不是基于对所用签名算法有效性的考量。\n\
  \n### AuthorityKeyIdentifier（权威机构密钥标识符）\n\n使用 `X509CertificateHolder` 类恢复 `AuthorityKeyIdentifier`\
  \ 时，可以使用以下代码：\n\n```\nAuthorityKeyIdentifier authorityKeyIdentifier = \n       \
  \         AuthorityKeyIdentifier.fromExtensions(certHldr.getExtensions());\n```\n\
  \n来获取该对象。\n\n在 Java 的 `X509Certificate` 类中，没有直接以对象形式检索 `AuthorityKeyIdentifier`\
  \ 方法。如果你想从这些内容创建一个 `AuthorityKeyIdentifier` 对象，可以利用我们之前定义的 `extractExtensionValue`\
  \ 方法，如下所示：\n\n```\nX509Certificate cert = ...\n\nAuthorityKeyIdentifier authorityKeyIdentifier\
  \ =\n     AuthorityKeyIdentifier.getInstance(\n                 extractExtensionValue(cert,\
  \ Extension.authorityKeyIdentifier));\n```\n\n### Subject Key Identifier（主体密钥标识符）\n\
  \n`subjectKeyIdentifier` 扩展由常量 `Extension.subjectKeyIdentifer` 标识，其 OID 值为“2.5.29.14”\
  \ (id-ce-subjectKeyIdentifier)。它的 ASN.1 定义如下：\n\n```\nSubjectKeyIdentifier ::= KeyIdentifier\n\
  ```\n\n`subjectKeyIdentifier` 仅仅是一个字节串，用于为证书中包含的公钥提供标识符。例如，如果你正在寻找某个特定证书的颁发证书，且该证书的\
  \ `AuthorityKeyIdentifier` 设置了 `keyIdentifier` 字段，你预期会在颁发证书的 `SubjectKeyIdentifier`\
  \ 扩展中找到存储在 `keyIdentifier` 中的值。RFC 5280 第 4.2.1.2 节提供了计算密钥标识符值的两种常用方法。\n\n使用 `X509CertificateHolder`\
  \ 类恢复 `SubjectKeyIdentifier` 时，可以使用以下代码：\n\n```\nSubjectKeyIdentifier subjectKeyIdentifier\
  \ = SubjectKeyIdentifier.fromExtensions(\n                                     \
  \                certHldr.getExtensions());\n```\n\n来获取该对象。\n\n在 Java 的 `X509Certificate`\
  \ 类中，没有直接以对象形式检索 `SubjectKeyIdentifier` 方法。如果你想从这些内容创建一个 `SubjectKeyIdentifier`\
  \ 对象，可以利用我们之前定义的 `extractExtensionValue` 方法，如下所示：\n\n```\nX509Certificate cert =\
  \ ...\n\nSubjectKeyIdentifier subjectKeyIdentifier =\n     SubjectKeyIdentifier.getInstance(\n\
  \                 extractExtensionValue(cert, Extension.subjectKeyIdentifier));\n\
  ```\n\n### Subject Alternative Name（主体备用名称）\n\n`subjectAltName` 扩展由常量 `Extension.subjectAlternativeName`\
  \ 标识，其 OID 值为“2.5.29.17” (id-ce-subjectAltName)。它的 ASN.1 定义如下：\n\n```\nSubjectAltName\
  \ ::= GeneralNames\n\nGeneralNames ::= SEQUENCE SIZE (1..MAX) OF GeneralName\n```\n\
  \n`subjectAltName` 用于存储与证书关联的备用（或别名）主体名称。如果你想将电子邮件地址与证书关联，严格来说，这是放置它的最佳位置。\n\n使用\
  \ `X509CertificateHolder` 类恢复 `subjectAltName` 扩展的 `GeneralNames` 对象，可以使用以下代码：\n\
  \n```\nGeneralNames subjectAltName = GeneralNames.fromExtensions(\n            \
  \       certHldr.getExtensions(), Extension.subjectAlternativeName);\n```\n\n来获取该对象。\n\
  \n在 Java 的 `X509Certificate` 类中，提供了 `X509Certificate.getSubjectAlternativeNames()`\
  \ 方法，它返回一个不可变的 `List` 对象集合，代表在该扩展中可以找到的各种对象。每个 `List` 有两个元素，第一个是与 `GeneralName`\
  \ 关联的标签，第二个元素是 `GeneralName` 值的解释，无论是 `String` 还是 DER 编码的字节数组。取决于你计划如何处理这些内容，直接使用我们之前使用的\
  \ `extractExtensionValue()` 方法创建一个 `GeneralNames` 对象可能会更简单一些。\n\n### Issuer Alternative\
  \ Name（颁发者备用名称）\n\n`issuerAltName` 扩展由常量 `Extension.issuerAlternativeName` 标识，其\
  \ OID 值为“2.5.29.18” (id-ce-issuerAltName)。它的 ASN.1 定义如下：\n\n```\nIssuerAltName ::=\
  \ GeneralNames\n```\n\n与 `subjectAltName` 类似，`issuerAltName` 用于存储与证书颁发者关联的备用名称。与\
  \ `subjectAltName` 扩展不同，此扩展不能替代 `TBSCertificate` 结构中 `issuer` 字段的内容。使用 `X509CertificateHolder`\
  \ 类恢复 `issuerAltName` 扩展的 `GeneralNames` 对象，可以使用以下代码：\n\n```\nGeneralNames issuerAltName\
  \ = GeneralNames.fromExtensions(\n                     certHldr.getExtensions(),\
  \ Extension.issuerAlternativeName);\n```\n\n来获取该对象。\n\n在 Java 的 `X509Certificate`\
  \ 类中，此扩展的处理方式与 `SubjectAltName` 扩展相同，提供了 `X509Certificate.getIssuerAlternativeNames()`\
  \ 方法，它返回一个不可变的 `List` 对象集合，描述扩展中找到的各种对象。对于 `SubjectAltName` 扩展，你可能发现直接将此扩展作为 `GeneralNames`\
  \ 对象处理更好。\n\n### Distribution Point（CRL 分布点）\n\nCRL 分布扩展提供了获取 CRL 信息的方法。该扩展应该是非关键的，并由\
  \ OID 值“2.5.29.31” (id-ce-CRLDistributionPoints) 标识。\n\n该扩展的语法在 RFC 5280 中描述如下：\n\
  \n```\nid-ce-CRLDistributionPoints OBJECT IDENTIFIER ::= { id-ce 31 }\n\nCRLDistributionPoints\
  \ ::= SEQUENCE SIZE (1..MAX) OF DistributionPoint\n\nDistributionPoint ::= SEQUENCE\
  \ {\n    distributionPoint       [0]     DistributionPointName OPTIONAL,\n    reasons\
  \                 [1]     ReasonFlags OPTIONAL,\n    cRLIssuer               [2]\
  \     GeneralNames OPTIONAL }\n\nDistributionPointName ::= CHOICE {\n    fullName\
  \                [0]     GeneralNames,\n    nameRelativeToCRLIssuer [1]     RelativeDistinguishedName\
  \ }\n\nReasonFlags ::= BIT STRING {\n    unused                  (0),\n    keyCompromise\
  \           (1),\n    cACompromise            (2),\n    affiliationChanged     \
  \ (3),\n    superseded              (4),\n    cessationOfOperation    (5),\n   \
  \ certificateHold         (6),\n    privilegeWithdrawn      (7),\n    aACompromise\
  \            (8) }\n```\n\n`CRLDistributionPoints` 结构在 BC 库中由 `CRLDistPoint` 类表示。你可以使用以下代码从\
  \ `X509CertificateHolder` 恢复 CRL 分布扩展值：\n\n```\nCRLDistPoint crlDistPoints =\n \
  \                   CRLDistPoint.getInstance(\n                        certHldr.getExtensions().getExtension(\n\
  \                            Extension.cRLDistributionPoints).getParsedValue());\n\
  ```\n\n\n\n\n如你所见，该扩展可以包含关于何时获取 CRL（证书吊销列表的信息，以及 CRL 将涵盖的原因。`RFC 5280` 中对该扩展有非常详尽的讨论，我们在此不再重复，但我们将指出以下一点：在盲目处理此扩展时需要格外谨慎——接受一个跳转到任意\
  \ URL 的指令并可能下载一个未知大小的巨型文件，这绝不是可以轻率对待的事情。对于任何面向互联网的业务，你确实希望以某种方式对此过程进行抽象，这样你就可以免受收到的所有证书可能并非善意的这一事实的影响。\n\
  \n### 密钥用法 (Key Usage)\n\n`keyUsage` 扩展由常量 `Extension.keyUsage` 标识，其 OID 值为“2.5.29.15”\
  \ (`id-ce-keyUsage`)。它的 ASN.1 定义如下：\n\n```\nKeyUsage ::= BIT STRING {\n    digitalSignature\
  \      (0),\n    nonRepudiation        (1),\n    keyEncipherment       (2),\n  \
  \  dataEncipherment      (3),\n    keyAgreement          (4),\n    keyCertSign \
  \          (5),\n    cRLSign               (6),\n    encipherOnly          (7),\n\
  \    decipherOnly          (8) }\n```\n\n`keyUsage` 扩展是限制证书中密钥用途最通用的方法。哪些位必须设置或不能设置，很大程度上取决于证书所使用的配置文件（profile）及其用途。例如，用于客户端本地\
  \ SSL 的证书可能只设置了 `digitalSignature` 位，因为证书中的公钥应仅用于签名验证操作。`RFC 5280` 第 `4.2.1.3` 节讨论了各种可能性，并对其他对\
  \ `keyUsage` 存有特定解释的 RFC 给出了一些线索。\n\n要使用 `X509CertificateHolder` 类恢复 `KeyUsage`，你可以使用：\n\
  \n```\nKeyUsage keyUsage = KeyUsage.fromExtensions(certHldr.getExtensions());\n\
  ```\n\n来获取该对象。\n\nJava 的 `X509Certificate` 类为此扩展提供了特定的处理方法，即特定方法 `X509Certificate.getKeyUsage()`，该方法返回一个布尔数组，表示\
  \ `KeyUsage` 位字符串中的每一位。请注意，在这种情况下，布尔值的顺序反映了它们在 ASN.1 定义中的编号，而不是位在 `BIT STRING` 中设置的实际顺序。\n\
  \n### 扩展密钥用法 (Extended Key Usage)\n\n`extKeyUsage` 扩展由常量 `Extension.extendedKeyUsage`\
  \ 标识，其 OID 值为“2.5.29.37” (`id-ce-extKeyUsage`)。它的 ASN.1 定义如下：\n\n```\nExtKeyUsageSyntax\
  \ ::= SEQUENCE SIZE (1..MAX) OF KeyPurposeId\nKeyPurposeId ::= OBJECT IDENTIFIER\n\
  ```\n\n如果存在此扩展，则该证书旨在仅用于其所列出的用途之一，除非在 `ExtKeyUsageSyntax` 序列中包含了特殊的 `KeyPurposeId`\
  \ `anyExtendedKeyUsage`。在弧线 `id-kp` (“1.3.6.1.5.5.7.3”）上分配了一系列密钥用途 ID。\n\n通常，此扩展与实体证书（end\
  \ entity certificates）配合使用，以比密钥用法扩展允许更严格的方式将证书锁定在特定用途上。例如，用于验证时间戳的证书必须包含 `ExtendedKeyUsage`\
  \ `id-kp-timeStamping`，其定义为：\n\n```\n id-kp-timeStamping OBJECT IDENTIFIER ::= {iso(1)\n\
  \                     identified-organization(3) dod(6)\n                     internet(1)\
  \ security(5) mechanisms(5) pkix(7)\n                     kp (3) timestamping (8)}\n\
  ```\n\n表明该证书公钥只能用于验证时间戳。在这种情况下，`ExtendedKeyUsage` 扩展还应该被标记为关键的（critical），且 `ExtendedKeyUsage`\
  \ 扩展的存在显然比仅在 `KeyUsage` 扩展中设置 `digitalSignature` 位具有更强的约束。\n\n要使用 `X509CertificateHolder`\
  \ 类恢复 `ExtendedKeyUsage`，你可以使用：\n\n```\nExtendedKeyUsage extKeyUsage = ExtendedKeyUsage.fromExtensions(\n\
  \                                                     certHldr.getExtensions());\n\
  ```\n\n在 Java `X509Certificate` 类中，此扩展也由特定方法 `X509Certificate.getExtendedKeyUsage()`\
  \ 表示，该方法返回一个字符串列表，表示扩展中已设置的 OBJECT IDENTIFIER 值。\n\n另请注意，如果你需要使用 `anyExtendedKeyUsage`（例如，因为你正在开发的应用程序需要它），则该扩展不应被标记为关键。\n\
  \n### 创建实体证书 (Creating End-Entity Certificates)\n\n正如我们之前提到的，实体证书代表证书链的末端。如果你想要一个关联到特定用户或特定用户活动的证书，通常将是一个与他们关联的实体证书。\n\
  \n下面的示例创建了一个授权用于验证数字签名的实体证书。请注意，示例包含一个 `BasicConstraints` 扩展，但这次扩展的值不是带路径长度的创建的，而是带有布尔值\
  \ `false`。\n\n```\n /**\n   * 创建一个用于验证数字签名的通用实体证书。\n   * \n   * @param signerCert\
  \ 带有公钥的证书，该公钥稍后将用于\n   *                   验证此证书的签名。\n   * @param signerKey 用于生成签名的私钥\n\
  \   * @param sigAlg 用于签名证书的签名算法。\n   * @param certKey 安装在证书中的公钥。\n   * @return 包含\
  \ V3 的 X509CertificateHolder。\n   */\n  public static X509CertificateHolder createEndEntity(\n\
  \          X509CertificateHolder signerCert, PrivateKey signerKey,\n          String\
  \ sigAlg, PublicKey certKey)\n          throws CertIOException, GeneralSecurityException,\n\
  \                 OperatorCreationException\n  {\n      X500NameBuilder x500NameBld\
  \ = new X500NameBuilder(BCStyle.INSTANCE)\n              .addRDN(BCStyle.C, \"AU\"\
  )\n              .addRDN(BCStyle.ST, \"Victoria\")\n              .addRDN(BCStyle.L,\
  \ \"Melbourne\")\n              .addRDN(BCStyle.O, \"The Legion of Bouncy Castle\"\
  )\n              .addRDN(BCStyle.CN, \"Demo End-Entity Certificate\");\n\n     \
  \ X500Name subject = x500NameBld.build();\n\n      X509v3CertificateBuilder   certBldr\
  \ = new JcaX509v3CertificateBuilder(\n              signerCert.getSubject(),\n \
  \             calculateSerialNumber(),\n              calculateDate(0),\n      \
  \        calculateDate(24 * 31),\n              subject,\n              certKey);\n\
  \n      JcaX509ExtensionUtils extUtils = new JcaX509ExtensionUtils();\n\n      certBldr.addExtension(Extension.authorityKeyIdentifier,\n\
  \              false, extUtils.createAuthorityKeyIdentifier(signerCert))\n     \
  \         .addExtension(Extension.subjectKeyIdentifier,\n              false, extUtils.createSubjectKeyIdentifier(certKey))\n\
  \              .addExtension(Extension.basicConstraints,\n                     \
  \ true, new BasicConstraints(false))\n              .addExtension(Extension.keyUsage,\n\
  \                      true, new KeyUsage(KeyUsage.digitalSignature));\n\n     \
  \ ContentSigner signer = new JcaContentSignerBuilder(sigAlg)\n                 \
  \                    .setProvider(\"BC\").build(signerKey);\n\n      return certBldr.build(signer);\n\
  \  }\n```\n\n请注意，在这种情况下 `BasicConstraints` 的构造函数只是传递了布尔值 `false`。这是为了指示该证书不能作为 CA\
  \ 证书，尽管它可能用于验证签名。如果我们收到由上述示例所示配置的证书签名的证书，我们应该直接拒绝它，因为很明显签名证书在创建时从未打算让证书路径变得更长。\n\
  \n#### 使用扩展密钥用法 (Using ExtendedKeyUsage)\n\n\n\n在第二个示例中，我们正在创建一个包含 `ExtendedKeyUsage`\
  \ 扩展的实体实体证书。正如我们之前从 ASN.1 定义中看到的，`ExtendedKeyUsage` 被定义为一个或多个 `KeyPurposeIds`，其中\
  \ `KeyPurposeId` 是一个 `OBJECT IDENTIFIER`（对象标识符）。`RFC 5280` 目前为 `KeyPurposeId` 如下定义：\n\
  \n```\nanyExtendedKeyUsage OBJECT IDENTIFIER ::= { id-ce-extKeyUsage 0 }\n\nid-pkix\
  \  OBJECT IDENTIFIER  ::=\n           { iso(1) identified-organization(3) dod(6)\
  \ internet(1)\n                   security(5) mechanisms(5) pkix(7) }\n\nid-kp OBJECT\
  \ IDENTIFIER ::= { id-pkix 3 }\n\nid-kp-serverAuth             OBJECT IDENTIFIER\
  \ ::= { id-kp 1 }\n\nid-kp-clientAuth             OBJECT IDENTIFIER ::= { id-kp\
  \ 2 }\n\nid-kp-codeSigning            OBJECT IDENTIFIER ::= { id-kp 3 }\n\nid-kp-emailProtection\
  \        OBJECT IDENTIFIER ::= { id-kp 4 }\n\nid-kp-timeStamping           OBJECT\
  \ IDENTIFIER ::= { id-kp 8 }\n\nid-kp-OCSPSigning            OBJECT IDENTIFIER ::=\
  \ { id-kp 9 }\n```\n\n你也会发现 `RFC 5280` 之外也存在 `KeyPurposeIds`，甚至可能会在你正在处理的应用程序中发现具有特定含义的私有定义。\n\
  \n以下示例创建了一个包含 `ExtendedKeyUsage` 扩展的实体实体证书。\n\n```\n 1   /**\n 2    * 创建一个特殊用途的实体证书，该证书与特定的\n\
  \ 3    * 密钥用途相关。\n 4    * \n 5    * @param signerCert 带有公钥的证书，该公钥稍将用于\n 6      \
  \                  验证此证书的签名。\n 7    * @param signerKey 用于生成证书签名的私钥。\n 8    *   \
  \               certificate。\n 9    * @param sigAlg 用于签名证书的签名算法。\n10    * @param\
  \ certKey 要安装在证书中的公钥。\n11    * @param keyPurpose 与此证书公钥关联的特定 KeyPurposeId。\n12 \
  \   *                   certificate.\n13    * @return 一个包含 V3 证书的 X509CertificateHolder。\n\
  14    */\n15   public static X509CertificateHolder createSpecialPurposeEndEntity(\n\
  16           X509CertificateHolder signerCert, PrivateKey signerKey,\n17       \
  \    String sigAlg, PublicKey certKey, KeyPurposeId keyPurpose)\n18           throws\
  \ OperatorCreationException, CertIOException,\n19                  GeneralSecurityException\n\
  20   {\n21       X500NameBuilder x500NameBld = new X500NameBuilder(BCStyle.INSTANCE)\n\
  22               .addRDN(BCStyle.C, \"AU\")\n23               .addRDN(BCStyle.ST,\
  \ \"Victoria\")\n24               .addRDN(BCStyle.L, \"Melbourne\")\n25        \
  \       .addRDN(BCStyle.O, \"The Legion of the Bouncy Castle\")\n26            \
  \   .addRDN(BCStyle.CN, \"Demo End-Entity Certificate\");\n26 \n28       X500Name\
  \ subject = x500NameBld.build();\n29 \n30       X509v3CertificateBuilder   certBldr\
  \ = new JcaX509v3CertificateBuilder(\n31               signerCert.getSubject(),\n\
  32               calculateSerialNumber(),\n33               calculateDate(0),\n\
  34               calculateDate(24 * 31),\n35               subject,\n36        \
  \       certKey);\n37 \n38       JcaX509ExtensionUtils extUtils = new JcaX509ExtensionUtils();\n\
  39 \n40       certBldr.addExtension(Extension.authorityKeyIdentifier,\n41      \
  \         false, extUtils.createAuthorityKeyIdentifier(signerCert))\n42        \
  \       .addExtension(Extension.subjectKeyIdentifier,\n43                      \
  \ false, extUtils.createSubjectKeyIdentifier(certKey))\n44               .addExtension(Extension.basicConstraints,\n\
  45                       true, new BasicConstraints(false))\n46               .addExtension(Extension.extendedKeyUsage,\n\
  47                             true, new ExtendedKeyUsage(keyPurpose));\n48 \n49\
  \       ContentSigner signer = new JcaContentSignerBuilder(sigAlg)\n50         \
  \                             .setProvider(\"BC\").build(signerKey);\n51 \n52  \
  \     return certBldr.build(signer);\n53   }\n```\n\n如我们所示，该证书通过提供的 `BasicConstraints`\
  \ 扩展被定义为实体证书，并且包含了 `ExtendedKeyUsage` 扩展。\n\n给定 CA 的私钥 `caPrivKey` 及其关联证书 `caCert`，我们可以如下调用上述方法创建一个专门用于签名时间戳的证书：\n\
  \n```\n1       KeyPairGenerator kpGen = KeyPairGenerator.getInstance(\"EC\", \"\
  BC\");\n2       KeyPair specEEKp = kpGen.generateKeyPair();\n3 \n\n4       X509CertificateHolder\
  \ specEECert =\n5               createSpecialPurposeEndEntity(caCert, caPrivKey,\n\
  6                                              \"SHA256withECDSA\",\n7         \
  \                                     specEEKp.getPublic(),\n8                 \
  \                             KeyPurposeId.id_kp_timeStamping);\n```\n\n注意，示例中将\
  \ `ExtendedKeyUsage` 扩展的关键性（critical）设置了 `true`。如果上面的代码片段使用 `KeyPurposeId.anyExtendedKeyUsage`\
  \ 作为密钥用途，则该值需要设置为 `false`。\n\n### 属性证书 (Attribute Certificates)\n\nX509 属性证书最常见的配置描述在\
  \ `RFC 5755` 中。它们与我们之前看到的证书的区别在于它们没有附加公钥。相反，它们允许将组组成、角色、安全许可等属性与实体（可能是公钥证书）关联。在这里，可以将属性证书比作签证，而将原始公钥证书比作护照。\n\
  \n属性证书的这种特性使其非常有用，与其每个人都有自己的 CA 来发行 X509 证书，各个小组可以发布与现有身份关联的属性证书。此外，授予某人短期访问权限是可能的，访问过期时不会影响公钥证书。\n\
  \n属性证书的结构如下：\n\n```\nAttributeCertificate ::= SEQUENCE {\n  acinfo             \
  \  AttributeCertificateInfo,\n  signatureAlgorithm   AlgorithmIdentifier,\n  signatureValue\
  \       BIT STRING\n}\n\nAttributeCertificateInfo ::= SEQUENCE {\n  version    \
  \             AttCertVersion, -- version is v2\n  holder                  Holder,\n\
  \  issuer                  AttCertIssuer,\n  signature               AlgorithmIdentifier,\n\
  \  serialNumber            CertificateSerialNumber,\n  attrCertValidityPeriod  AttCertValidityPeriod,\n\
  \  attributes              SEQUENCE OF Attribute,\n  issuerUniqueID          UniqueIdentifier\
  \ OPTIONAL,\n  extensions              Extensions OPTIONAL\n}\n\nAttCertVersion\
  \ ::= INTEGER { v2(1) }\n\nAttCertValidityPeriod  ::= SEQUENCE {\n  notBeforeTime\
  \  GeneralizedTime,\n  notAfterTime   GeneralizedTime\n}\n```\n\n通过查看其在 `RFC 5755`\
  \ 中的定义，你可以看到 `Holder` 结构允许使用公钥证书以外的内容。\n\n\n\n\n\n```\nHolder ::= SEQUENCE {\n \
  \ baseCertificateID   [0] IssuerSerial OPTIONAL,\n      -- 持有公钥证书的\n      -- 发布者和序列号\n\
  \  entityName          [1] GeneralNames OPTIONAL,\n      -- 申请者的名称或角色\n  objectDigestInfo\
  \    [2] ObjectDigestInfo OPTIONAL\n      -- 用于直接验证持有者，\n      -- 例如，一个可执行文件\n}\n\
  \nObjectDigestInfo ::= SEQUENCE {\n  digestedObjectType  ENUMERATED {\n    publicKey\
  \            (0),\n    publicKeyCert        (1),\n    otherObjectTypes     (2) },\n\
  \  -- otherObjectTypes 不得\n  -- 在此配置中未使用\n  otherObjectTypeID   OBJECT IDENTIFIER\
  \ OPTIONAL,\n  digestAlgorithm     AlgorithmIdentifier,\n  objectDigest        BIT\
  \ STRING\n}\n```\n\n值得注意的是，标准允许定义三种匹配持有者的方法，你可以从 `ObjectDigestInfo` 结构可以看出，它既可以用于公钥证书，也可以用于其他对象。最初，预计该结构会为\
  \ `Holder` 结构的解释器提供额外的灵活性，但事实证明这种灵活性也为歧义创造了机会。为了消除混淆风险，RFC 5755 规定 `Holder` 序列中**只能存在一个**\
  \ 选项。\n\n`AttCertIssuer` 结构在设计时也考虑了灵活性。查看 RFC 5755 提供的定义也可以发现，与 `Holder` 一样，出于该\
  \ RFC 的目的，在结构中填充定义良好的字段子集会更好。\n\n```\nAttCertIssuer ::= CHOICE {\n  v1Form   GeneralNames,\
  \  -- 不得在此配置\n                          -- 中中使用\n  v2Form   [0] V2Form     -- 仅限\
  \ v2\n}\n\nV2Form ::= SEQUENCE {\n  issuerName            GeneralNames  OPTIONAL,\n\
  \  baseCertificateID     [0] IssuerSerial  OPTIONAL,\n  objectDigestInfo      [1]\
  \ ObjectDigestInfo  OPTIONAL\n    -- issuerName 必须在此配置中出现\n    -- baseCertificateID\
  \ 和 objectDigestInfo 不得\n    -- 在此配置中出现\n}\n\nIssuerSerial  ::=  SEQUENCE {\n  issuer\
  \         GeneralNames,\n  serial         CertificateSerialNumber,\n  issuerUID\
  \      UniqueIdentifier OPTIONAL\n}\n```\n\n由于 `UniqueIdentifier` 在 RFC 5280 提供的\
  \ X.509 配置中已弃用，你不太会在 `IssuerSerial` 结构中看到填充该值。\n\n我们将查看属性证书结构中的最后一个元素：`Attribute`\
  \ 结构，它构成了证书所携带的属性序列。\n\n```\nAttribute ::= SEQUENCE {\n  type      AttributeType,\n\
  \  values    SET OF AttributeValue\n    -- 至少需要一个值\n}\n\nAttributeType ::= OBJECT\
  \ IDENTIFIER\n\nAttributeValue ::= ANY DEFINED BY AttributeType\n```\n\n如你所示，Attribute\
  \ 结构在它可以包含的内容方面非常通用。\n\n### 构建属性证书\n\n以下示例展示了如何使用 RFC 5755 中定义的 `RoleSyntax` 构建一个简单的属性证书，该证书仅包含一个用户角色的\
  \ URI。\n\n```\n 1   public static X509AttributeCertificateHolder createAttributeCertificate(\n\
  \ 2           X509CertificateHolder issuerCert, PrivateKey issuerKey, String sigAlg,\n\
  \ 3           X509CertificateHolder holderCert, String holderRoleUri)\n 4      \
  \     throws OperatorCreationException\n 5   {\n 6       X509v2AttributeCertificateBuilder\
  \ acBldr =\n 7               new X509v2AttributeCertificateBuilder(\n 8        \
  \             new AttributeCertificateHolder(holderCert),\n 9                  \
  \   new AttCertIssuer(issuerCert.getSubject()),\n10                     calculateSerialNumber(),\n\
  11                     calculateDate(0),\n12                     calculateDate(24\
  \ * 7));\n13 \n14       GeneralName roleName = new GeneralName(\n 15           \
  \             GeneralName.uniformResourceIdentifier, holderRoleUri);\n16 \n17  \
  \     acBldr.addAttribute(\n 18                X509AttributeIdentifiers.id_at_role,\
  \ new RoleSyntax(roleName));\n19 \n20       ContentSigner signer = new JcaContentSigner(sigAlg)\n\
  \ 21               setProvider(\"BC\").build(issuerKey);\n 22       \n23       return\
  \ acBldr.build();\n24   }\n```\n\n构建器的模式与证书类似，唯一的区别在于证书要携带的属性的构建和分配。在实践中，属性甚至可能包含私有的\
  \ OID 以及私有的 ASN.1 结构。\n\n调用示例方法如下：\n\n```\n X509AttributeCertificateHolder attrCert\
  \ =\n              createAttributeCertificate(issuerCert,\n                    \
  \  issuerKey,\n                      \"SHA256withECDSA\", holderCert, \"id://DAU123456789\"\
  );\n```\n\n我们只需要确保签名算法适用于密钥以及我们尝试构建的属性证书。\n\n### 总结\n\n在本章中，我们查看了安全和认证通信的基础构建块之一：X.509\
  \ 证书。\n\n我们介绍了如何使用 X.509 结构附加公钥和身份，以及如何创建证书链。\n\n最后，本章考虑了如何将属性证书与现有公钥证书结合。\n\n##\
  \ 第章：证书吊销与路径\n\n有时发布者需要撤回对证书的签名。这一过程称为证书吊销，既有静态也有在线的方法支持此。\n\n此外，持有证书的方可能会将其用于不应使用的地方。为了防止这种情况，已经有了标准的算法来进行证书验证。这些算法可以检查用于签发实体证书的所有证书的来源，并确认实体证书“符合用途”。\n\
  \n我们将首先查看“改变主意”的过程。\n\n### 证书吊销列表 (CRLs)\n\n在理想的世界中，证书一旦签发，将一直有效到过期日期。然而，情况并非总是如此，因此存在一种机制用于确定发布者是否改变了对特定证书有效性的判断。\n\
  \n证书吊销列表，简称 `CRLs`，是最初提出的解决方案，用于证书发布者能够让用户了解已发布证书的状态。与证书一样，CRL 的定义在 RFC 5280 中，顶层结构\
  \ `CertificateList` 定义如下：\n\n```\nCertificateList  ::=  SEQUENCE  {\n      tbsCertList\
  \          TBSCertList,\n      signatureAlgorithm   AlgorithmIdentifier,\n     \
  \ signatureValue       BIT STRING  }\n\n TBSCertList  ::=  SEQUENCE  {\n      version\
  \                 Version OPTIONAL,\n                                   -- 如果存在，必须为\
  \ v2\n      signatureAlgorithm               AlgorithmIdentifier,\n      issuer\
  \                  Name,\n      thisUpdate              Time,\n      nextUpdate\
  \              Time OPTIONAL,\n      revokedCertificates     SEQUENCE OF SEQUENCE\
  \  {\n           userCertificate         CertificateSerialNumber,\n           revocationDate\
  \          Time,\n           crlEntryExtensions      Extensions OPTIONAL\n     \
  \                               -- 如果存在，必须为 v2\n                               \
  \ }  OPTIONAL,\n      crlExtensions           [0]  EXPLICIT Extensions OPTIONAL\n\
  \                                    -- 如果存在，必须为 v2\n                          \
  \      }\n```\n\n\n\n\n从结构上可以看出，其意图是 CRL 的权威性源于签署它们的人。它包含了一些颁发者详情、一个撤销列表、关于 CRL\
  \ 发行时间的详细信息（`thisUpdate`）、可能需要请求更新的时间（`nextUpdate`）以及一些扩展。\n\n### 常见 CRL 扩展\n\n\
  与证书一样，CRL 也可以具有扩展，用于传递有关如何解释 CRL 的额外信息。接下来的列表并不是详尽的，仅应作为指南。如果你需要深入理解这些扩展，最好确保你已经阅读了\
  \ RFC 5280 的相关章节 [101]。\n\n### 权威密钥标识符 (Authority Key Identifier)\n\n权威密钥标识符扩展提供了一种识别用于验证\
  \ CRL 签名的公钥的方法。符合 RFC 5280 [101] 的 CRL 颁发者 get 包含权威密钥标识符扩展。\n\n该扩展的语法与证书对应的扩展相同。\n\
  \n### 颁发者别名 (Issuer Alternative Name)\n\n颁发者别名扩展是一个非关键扩展，允许将额外的身份与 CRL 关联。该扩展的语法与证书对应的扩展相同。\n\
  \n### CRL 号 (CRL Number)\n\nCRL 号也是非关键的，用于提供一个指示此 CRL 是否取代了另一个 CRL 的唯一标识符。符合 RFC\
  \ 5280 [101] 的 CRL 颁发者被要求包含 CRL 号扩展。\n\nCRL 号扩展由常量 `Extension.basicConstraints`\
  \ 标识，其 OID 值为“2.5.29.20”，并由单个整数组成。实际定义看起来如下：\n\n```\nid-ce-cRLNumber OBJECT IDENTIFIER\
  \ ::= { id-ce 20 }\n\nCRLNumber ::= INTEGER (0..MAX)\n```\n\n合规的 CRL 颁发者应该在每次发布新\
  \ CRL 时增加 `CRLNumber` 的值，这样编号更高的 CRL 总是代表 CRL 更新的修订版本。需要注意的是，当 CRL 是增量 CRL（delta\
  \ CRL）时，`CRLNumber` 值必须与其所对应的 CRL 共享相同的编号序列。\n\n### 增量 CRL 指示器 (Delta CRL Indicator)\n\
  \n增量 CRL 指示器显示该 CRL 应被视为较早 CRL 的更改列表，其理念是：如果将增量 CRL 和早的完整 CRL 结合，结果将代表在增量 CRL 发行时应有的完整\
  \ CRL。\n\n增量 CRL 指示器的 OID 值为“2.5.29.27”，该扩展具有以下语法：\n\n```\nid-ce-deltaCRLIndicator\
  \ OBJECT IDENTIFIER ::= { id-ce 27 }\n\nBaseCRLNumber ::= CRLNumber\n```\n\n其中 `BaseCRLNumber`\
  \ 是增量 CRL 所显示更改的那个较早完整 CRL 的 CRL 号。\n\n增量 CRL 指示器应被标记为关键扩展。\n\n### 常见 CRL 条目扩展\n\
  \n从 `TBSCertList` 的定义中可以看出，`revokedCertificates` 字段也留有可选扩展的空间。RFC 5280 目前为 CRL 条目定义了三个扩展。需要注意的是，在\
  \ RFC 5280 之前也存在 `HoldInstructionCode`（OID 值为“2.5.29.23”），但它已被移除。\n\n### CRL 撤销原因\
  \ (CRLReason)\n\n`CRLReason` 扩展的 OID 值为“2.5.29.21”，该扩展具有以下语法：\n\n```\nid-ce-cRLReasons\
  \ OBJECT IDENTIFIER ::= { id-ce 21 }\n\n-- reasonCode ::= { CRLReason }\n\nCRLReason\
  \ ::= ENUMERATED {\n    unspecified             (0),\n    keyCompromise        \
  \   (1),\n    cACompromise            (2),\n    affiliationChanged      (3),\n \
  \   superseded              (4),\n    cessationOfOperation    (5),\n    certificateHold\
  \         (6),\n         -- value 7 is not used\n    removeFromCRL           (8),\n\
  \    privilegeWithdrawn      (9),\n    aACompromise           (10) }\n```\n\n如名称所示，`CRLReason`\
  \ 扩展指示证书最初进入 CRL 的原因。如果不存在 `CRLReason` 扩展，你应该假设原因代码为 0，即 `unspecified`。RFC 5280\
  \ 还规定，如果原因是 `unspecified`，则不应包含该扩展，只有在需要指示其他原因时才使用它。\n\n### 无效日期 (InvalidityDate)\n\
  \n`InvalidityDate` 扩展用于提供一个确切日期，已知或怀疑证书在该日期变为无效。该扩展使得当实际失效时间早于撤销日期时，不再需要回溯填写 CRL\
  \ 条目日期。RFC 5280 建议在任何此类信息可用的情况下都包含此扩展。\n\n`InvalidityDate` 扩展的 OID 值为“2.5.29.24”，该扩展具有以下语法：\n\
  \n```\nid-ce-invalidityDate OBJECT IDENTIFIER ::= { id-ce 24 }\n\nInvalidityDate\
  \ ::=  GeneralizedTime\n```\n\n关于 `GeneralizedTime` 如何构建的细节可以在附录 A：“ASN.1 and Bouncy\
  \ Castle”。\n\n### 证书颁发者 (CertificateIssuer)\n\n`CertificateIssuer` 扩展用于指示证书的真实颁发者是谁。不过，当你发现它时，情况有点不同。RFC\
  \ 5280 第 5.3.3 节规定，当不存在此扩展时，证书颁发者默认为之前的颁发者。换句话说，一旦出现 `CertificateIssuer`，每个 CRL\
  \ 条目都应被认为与新的颁发者关联。\n\n`CertificateIssuer` 扩展的 OID 值为“2.5.29.29”，该扩展具有以下语法：\n\n```\n\
  id-ce-certificateIssuer OBJECT IDENTIFIER ::= { id-ce 29 }\n\nCertificateIssuer\
  \ ::=     GeneralNames\n\n考虑到解释 CRL 的影响，RFC 5280 规定在使用时必须标记为关键。\n\n## 创建新 CRL\n\n\
  以下代码创建一个包含单个撤销的 CRL。\n\n```\n/**\n创建一个包含单个撤销的 CRL。\n   * @param caKey 签署 CRL 的私钥。\n\
  \   * @param sigAlg 用于签署 CRL 的签名算法。\n   * @param caCert 与签署 CRL 的密钥相关的证书。\n   *\
  \ @param certToRevoke 要撤销的证书。\n   * @return 代表 CA 撤销列表的 X509CRLHolder。\n   */\n\
  \   public X509CRLHolder createCRL(\n           PrivateKey caKey,\n           String\
  \ sigAlg,\n           X509CertificateHolder caCert,\n           X509CertificateHolder\
  \ certToRevoke)\n           throws IOException, GeneralSecurityException, OperatorCreationException\n\
  \   {\n       X509v2CRLBuilder crlGen = new X509v2CRLBuilder(caCert.getSubject(),\n\
  \                                           new Date(0));\n       crlGen.setNextUpdate(calculateDate(24\
  \ * 7));\n\n       // 添加撤销\n       ExtensionsGenerator extGen = new ExtensionsGenerator();\n\
  \n       CRLReason crlReason = CRLReason.lookup(CRLReason.privilegeWithdrawn);\n\
  \n       extGen.addExtension(Extension.reasonCode, false, crlReason);\n\n      \
  \ crlGen.addCRLEntry(certToRevoke.getSerialNumber(),\n                         \
  \                  new Date(), extGen.generate());\n\n       // 为 CRL 添加扩展\n   \
  \    JcaX509ExtensionUtils extUtils = new JcaX509ExtensionUtils();\n\n       crlGen.addExtension(Extension.authorityKeyIdentifier,\
  \ false,\n               extUtils.createAuthorityKeyIdentifier(caCert));\n\n   \
  \    ContentSigner signer = new JcaContentSignerBuilder(sigAlg)\n              \
  \                     .setProvider(\"BC\").build(caKey);\n\n       return crlGen.build(signer);\n\
  \   }\n```\n\n我们的第一步是为 CRL 创建构建器，即 `X509v2CRLBuilder` 类，在这种情况下调用了 `setNextUpdate()`\
  \ 方法。\n\n### 将 X509CRLHolder 转换为 X509CRL\n\n\n\n\n`org.bouncycastle.cert.jcajce.JcaX509CRLConverter`\
  \ 类用于将 `X509CRLHolder` 对象转换为标准的 JCA `X509CRL` 对象。`JcaX509CRLConverter` 类可以根据 JVM\
  \ 中当前的提供者优先级生成 `X509CRL`，你也可以指定特定的提供者。在示例中，我们通过名称指定了 Bouncy Castle 提供者。\n\n```\n\
  X509CRLHolder crlHldr = ...\n\nX509CRL crl = new JcaX509CRLConverter()\n       \
  \                               .setProvider(\"BC\")\n                         \
  \             .getCRL(crlHldr);\n```\n\n若要反转换，只需将 `X509CRL` 的编码传递给 `X509CRLHolder`，或者将\
  \ `X509CRL` 传递给 `JcaX509CRLHolder`，后者将为你完成编码步骤。\n\n```\nX509CRL crl = ...\nX509CRLHolder\
  \ crlHldr = new JcaX509CRLHolder(crl);\n```\n\n`CertificateFactory` 类有两个与生成公钥证书相关的方法：`generateCRL()`\
  \ 和 `generateCRLs()`。这些方法可以用于读取各种编码的证书（通常包括 PEM 和 BER/DER），然后生成单个证书（在 `generateCRL()`\
  \ 情况下）或证书集合（在 `generateCRLs()` 情况下）。\n\n`X509CertificateHolder` 的 `getEncoded()`\
  \ 方法生成封装在该类中的 X.509 证书的 BER 编码。你可以如下方式使用该方法为 `CertificateFactory` 的 `generateCertificate()`\
  \ 方法提供输入：\n\n```\n 1   /**\n 2    * 使用 java.security.cert.CertificateFactory 类将\
  \ X509CRLHolder 转换为 X509CRL 的简单方法。\n 4    */\n 5   public static X509CRL convertX509CRLHolder(\n\
  \ 6                                            X509CertificateHolder crlHolder)\n\
  \ 7           throws GeneralSecurityException, IOException\n 8   {\n 9       CertificateFactory\
  \ cFact = CertificateFactory.getInstance(\"X.509\", \"BC\");\n10 \n11       return\
  \ (X509CRL)cFact.generateCRL(\n12                                          new ByteArrayInputStream(\n\
  13                                                  crlHolder.getEncoded()));\n\
  14   }\n```\n\n### 创建更新的 CRL\n\n你可能已经意识到，CRL 会随着时间的推移而变得越来越。如果没有 API 的帮助，创建一个更新的\
  \ CRL 可能会非常痛苦下面的示例展示了如何获取现有的 CRL 并对其进行更新。\n\n```\n 1   /**\n 2    * 从之前的 CRL 创建更新的\
  \ CRL 并添加新的撤销项。\n 3    *\n 4    * @param caKey 签名 CRL 的私钥。\n 5    * @param sigAlg\
  \ 用于签名 CRL 的签名算法。\n 6    * @param caCert 与用于签名 CRL 的密钥相关的证书。\n 7    * @param previousCaCRL\
  \ 此 CA 之前的 CRL。\n 8    * @param certToRevoke 要撤销的证书。\n 9    * @return 表示该 CA 更新后撤销列表的\
  \ X509CRLHolder。\n11    */\n 12   public X509CRLHolder updateCRL(\n 13         \
  \  PrivateKey caKey,\n 14           String sigAlg,\n 15           X509CertificateHolder\
  \ caCert,\n 16           X509CRLHolder previousCaCRL,\n 17           X509CertificateHolder\
  \ certToRevoke)\n 18           throws IOException, GeneralSecurityException, OperatorCreationException\n\
  \ 19   {\n20       X509v2CRLBuilder crlGen = new X509v2CRLBuilder(caCert.getIssuer(),\n\
  21               calculateDate(0));\n22 \n23       crlGen.setNextUpdate(calculateDate(24\
  \ * 7));\n24 \n25       // 添加新的撤销项\n26       ExtensionsGenerator extGen = new ExtensionsGenerator();\n\
  27 \n28       CRLReason crlReason = CRLReason.lookup(CRLReason.privilegeWithdrawn);\n\
  29 \n30       extGen.addExtension(Extension.reasonCode, false, crlReason);\n31 \n\
  32       crlGen.addCRLEntry(certToRevoke.getSerialNumber(),\n33            new Date(),\
  \ extGen.generate());\n34 \n35       // 添加之前的撤销项\n36       crlGen.addCRL(previousCaCRL);\n\
  37 \n38       // 将扩展项添加到 CRL\n39       JcaX509ExtensionUtils extUtils = new JcaX509ExtensionUtils();\n\
  40 \n41       crlGen.addExtension(Extension.authorityKeyIdentifier, false,\n42 \
  \              extUtils.createAuthorityKeyIdentifier(caCert));\n43 \n44       ContentSigner\
  \ signer = new JcaContentSignerBuilder(sigAlg)\n45                             \
  \      .setProvider(\"BC\").build(caKey);\n46 \n47       return crlGen.build(signer);\n\
  48   }\n```\n\n你可以看到这与从头创建 CRL 非常相似，唯一的区别是这一行代码：\n```\ncrlGen.addCRL(previousCaCRL);\n\
  ```\n\n\n\n\n\n```\nRequest ::=     SEQUENCE {\n    reqCert                    CertID,\n\
  \    singleRequestExtensions    [0] EXPLICIT Extensions\n                      \
  \                 { {re-ocsp-service-locator,\n                                \
  \              ...}} OPTIONAL }\n\nCertID ::= SEQUENCE {\n    hashAlgorithm    \
  \        AlgorithmIdentifier\n                                 {DIGEST-ALGORITHM,\
  \ {...}},\n    issuerNameHash     OCTET STRING, -- Hash of issuer's DN\n    issuerKeyHash\
  \      OCTET STRING, -- Hash of issuer's public key\n    serialNumber       CertificateSerialNumber\
  \ }\n```\n\nBC API 使用 `Req` 类来表示 `Request` 序列，并使用 `CertificateID` 来表示 `CertID`。`Req`\
  \ 类正如你预期的那样工作，尽管你通常不会直接创建它，因为你会使用 `OCSPReqBuilder` 来构建一个完整的请求对象，而构建器会为你完成创建工作。\n\
  \n另一方面，`CertificateID` 需要一些操作，因为它需要能够计算哈希值。SHA-1 仍被广泛用于此目的，除非另有说明，否则创建一个 `CertificateID`\
  \ 来检查检查由颁发者证书 `issuerCert` 签发的序列号为 `serialNumber` 的证书状态，看起来如下：\n\n```\nDigestCalculatorProvider\
  \ digCalcProv =\n    new JcaDigestCalculatorProviderBuilder().setProvider(\"BC\"\
  ).build();\n\nCertificateID   id = new CertificateID(\n    digCalcProv.get(CertificateID.HASH_SHA1),\
  \ issuerCert, serialNumber);\n```\n\n其中传递给 `CertificateID` 构造函数的 `DigestCalculator`\
  \ 如所示，是用于 SHA-1 的。\n\n请求信息的载体结构是 `OCSPRequest`，在 BC API 中由 `OCSPReq` 类表示。如果需要，OCSPRequest\
  \ 可以被签名，因此其 ASN.1 定义遵循与我们在证书中看到的类似模式。\n\n完整 `OCSPRequest` 的 ASN.1 定义如下：\n\n```\n\
  OCSPRequest     ::=     SEQUENCE {\n    tbsRequest                  TBSRequest,\n\
  \    optionalSignature   [0]     EXPLICIT Signature OPTIONAL }\n\nTBSRequest   \
  \   ::=     SEQUENCE {\n    version             [0] EXPLICIT Version DEFAULT v1,\n\
  \    requestorName       [1] EXPLICIT GeneralName OPTIONAL,\n    requestList   \
  \          SEQUENCE OF Request,\n    requestExtensions   [2] EXPLICIT Extensions\
  \ {{re-ocsp-nonce |\n                     re-ocsp-response, ...,\n             \
  \        re-ocsp-preferred-signature-algorithms}} OPTIONAL }\n\nSignature      \
  \ ::=     SEQUENCE {\n    signatureAlgorithm   AlgorithmIdentifier\n           \
  \                  { SIGNATURE-ALGORITHM, {...}},\n    signature            BIT\
  \ STRING,\n    certs            [0] EXPLICIT SEQUENCE OF Certificate OPTIONAL }\n\
  \nVersion  ::=  INTEGER  {  v1(0) }\n```\n\n你唯一可能直接创建 BC `OCSPReq` 对象的时刻是作为响应者，此时你从某人发送给你的编码\
  \ `OCSPRequest` 结构中创建它。在客户端，你可以使用 `OCSPReqBuilder` 类构建 `OCSPReq`。\n\n### 响应\n\n\
  响应者用 `OCSPResponse` 结构进行回复。在 Bouncy Castle OCSP API 中，`OCSPResponse` 结构由 `OCSPResp`\
  \ 类表示。其 ASN.1 描述如下：\n\n```\nOCSPResponse ::= SEQUENCE {\n  responseStatus      \
  \   OCSPResponseStatus,\n  responseBytes          [0] EXPLICIT ResponseBytes OPTIONAL\
  \ }\n\nOCSPResponseStatus ::= ENUMERATED {\n   successful            (0),  -- 响应具有有效确认\n\
  \   malformedRequest      (1),  -- 非法确认请求\n   internalError         (2),  -- 颁发者内部错误\n\
  \   tryLater              (3),  -- 稍后重试\n                               -- (4) 未使用\n\
  \   sigRequired           (5),  -- 必须签名请求\n   unauthorized          (6)   -- 请求未授权\n\
  }\n```\n\n上述结构需要注意的重要点是，响应状态并没有说明你所查询的任何证书的有效性！你需要进一步深入挖掘以获取相关信息。\n\n如你所见，该结构的设计考虑了灵活性，`ResponseBytes`\
  \ 结构遵循了你在许多 ASN.1 结构中看到的模式，其中包含一个 `OBJECT IDENTIFIER` 以允许识别其承载的负载——在这种情况下，嵌入在 `OCTET\
  \ STRING` 中。\n\n```\nResponseBytes ::= SEQUENCE {\n   responseType            OBJECT\
  \ IDENTIFIER,\n   response                OCTET STRING }\n```\n\nRFC 6960 定义的标准响应是\
  \ `BasicOCSPResponse`，它由一个名为 `id-pkix-ocsp-basic` 的对象标识符定义，值为 `{ id-pkix-ocsp 1\
  \ }`。\n\n```\nBasicOCSPResponse ::= SEQUENCE {\n  tbsResponseData          ResponseData,\n\
  \  signatureAlgorithm       AlgorithmIdentifier,\n  signature                BIT\
  \ STRING,\n  certs                [0] EXPLICIT SEQUENCE OF Certificate OPTIONAL\
  \ }\n\nResponseData ::= SEQUENCE {\n   version             [0] EXPLICIT Version\
  \ DEFAULT v1,\n   responderID             ResponderID,\n   producedAt          \
  \    GeneralizedTime,\n   responses               SEQUENCE OF SingleResponse,\n\
  \   responseExtensions  [1] EXPLICIT Extensions OPTIONAL }\n```\n\n你可以通过调用 `getResponseObject()`\
  \ 方法访问 `OCSPResp` 对象中的负载。如果内部结构标识自身携带了与 `id-pkix-ocsp-basic` 关联的 `OCTET STRING`，则\
  \ `getResponseObject()` 将创建一个 `BasicOCSPResp`。\n\n在 Bouncy Castle OCSP API 中，`OCSPResponse`\
  \ 结构由 `OCSPResp` 类表示。`BasicOCSPResp` 允许你通过 `getResponseObject()` 方法获取 `BasicOCSPResp`\
  \ 对象。\n\n如你所见，`BasicOCSPResponse` 允许签名，由于 `responses` 字段是一个 `SEQUENCE`，它可以携带一组要包含在单个响应中的响应。还有一个\
  \ `certs` 字段，可以用于携带帮助验证与 `BasicOCSPResponse` 相关签名的证书。\n\n`SingleResp` 类作为 `SingleResponse`\
  \ 结构的封装。`SingleResponse` 结构的语法如下：\n\n```\nSingleResponse ::= SEQUENCE {\n   certID\
  \                  CertID,\n   certStatus              CertStatus,\n   thisUpdate\
  \              GeneralizedTime,\n   nextUpdate          [0] EXPLICIT GeneralizedTime\
  \ OPTIONAL,\n   singleExtensions    [1] EXPLICIT Extensions OPTIONAL }\n```\n\n\
  如你所见，这有点像单个证书的“微型 CRL”。`SingleResp` 对象上的 `getCertStatus()` 方法返回的 `certStatus` 字段是实际证书状态，它会告诉证书是良好的（用\
  \ null 表示）还是存在问题。`nextUpdate` 字段通过 `getNextUpdate()` 方法访问，并在 OCSP 响应需要缓存时（因此用于 OCSP\
  \ 装）可以使用。注意：由于 `nextUpdate` 是可选的，它可能不存在，此时 `getNextUpdate()` 方法将返回 null。\n\n通常你只会在客户端直接构建\
  \ `OCSPResp`，此时你正在转换一个编码响应。在响应者中，你通常使用 `OCSPRespBuilder` 构建 `OCSPResp`。\n\n### 扩展\n\
  \n查看 ASN.1，OCSP 请求和响应都可以携带扩展。RFC 6960 中列出了若干种扩展，但这里详细介绍了最常见的两种。\n\n#### Nonce\n\n\
  \n\n\n\n`nonce` 扩展用于将响应与请求匹配，并防止重放攻击^(16)。正如该扩展的名称所示，`nonce` 扩展的值应该是客户端在合理期限内仅使用一次的内容。其\
  \ ASN.1 定义和标记如下：\n\n```\nid-pkix-ocsp-nonce     OBJECT IDENTIFIER ::= { id-pkix-ocsp\
  \ 2 }\n\nNonce ::= OCTET STRING\n```\n\n由于该值被指定为 `OCTET STRING`，因此它可以是客户端希望使用的任何符合“重用风险”标准的的内容。使用时，客户端会将该扩展添加到请求中，然后由响应者在响应中将其原样返回。\n\
  \n## 可接受的响应类型\n\n除了 `BasicOCSPResponse` 之外，OCSP 允许允许多种响应类型。当响应者能够响应多种响应类型时，客户端限制响应者可能选择的响应类型是一个明智的主意。\n\
  \n实现这一点的扩展是 `AcceptableResponses` 扩展，其定义和标记如下：\n\n```\nid-pkix-ocsp-response  OBJECT\
  \ IDENTIFIER ::= { id-pkix-ocsp 4 }\n\nAcceptableResponses ::= SEQUENCE OF OBJECT\
  \ IDENTIFIER\n```\n\nRFC 6960 规定响应者必须能够提供包含 `BasicOCSPResponse` 的响应。如果你需要告诉响应者你的客户端只能处理\
  \ `BasicOCSPResponse`，你可以按照如下创建扩展：\n\n```\nExtension ext =\n    new Extension(OCSPObjectIdentifiers.id_pkix_ocsp_response,\
  \ true,\n       new DERSequence(OCSPObjectIdentifiers.id_pkix_ocsp_basic).getEncoded());\n\
  ```\n\n然后使用 `OCSPReqBuilder` 类将其添加到你的请求中，我们将在下文中介绍该类。\n\n## OCSP Stapling：解决 OCSP\
  \ 的问题\n\n在查看 Bouncy Castle API 如何支持 OCSP 之前，值得注意的是，虽然 OCSP 解决了大部分关于使用 CRL 的问题，但它也带来了一些自己的问题。提供\
  \ OCSP 响应者并签发大量高级证书的 CA 将面临大量的请求；此外，还会创建一个“侧信道”，因为执行 OCSP 检查的连接端会向签发证书的 CA 广播它正在与该证书的持有方通信。对于像\
  \ TLS 这样的协议来说，这可能是一个特别严重的问题，因为客户端浏览器会发现自己正在向 CA 广播其流量习惯——这可能不是所有人认为积极的特性。\n\n![OCSP\
  \ Stapling - 服务器发送短寿命 OCSP 响应以及其证书](img/chapter9----OCSPStapling.png)\n\nOCSP Stapling\
  \ - 服务器发送短寿命 OCSP 响应以及其证书\n\n这个问题可以通过名为 OCSP stapling（OCSP 封字）的程序来解决，在这一概念起源的 TLS\
  \ 中，它被称为多证书状态请求扩展，并在 RFC 6961 [116] 中描述。在这种情况下，TLS 服务器收集 OCSP 响应并将其与其证书路径一起发送。客户端随后验证\
  \ OCSP 响应上的签名（必须由证书签发者签名），然后就可以确认证书是有效的——至少在 OCSP 响应的有效期范围内。\n\nOCSP stapling 的原理是服务器负责收集响应，因此客户端的身份得到了保护。此外，虽然\
  \ OCSP 响应的寿命很短，但它们不是一次性的，因此服务器可以重用响应直到需要新的响应——从而减轻 CA OCSP 响应者的负载。如果你在自己设计的系统中使用\
  \ OCSP，你可能需要考虑这一点。\n\n## 生成 OCSP 请求\n\n此示例展示了一个生成 OCSP 请求的方法，用于查询签发者为 `issuerCert`\
  \ 序列号为 `serialNumber` 的证书的有效性。该请求还生成包含一个 nonce 扩展。\n\n```\n 1   /**\n 2    * 生成一个关于证书\
  \ serialNumber 的 OCSP 请求，\n 3    * 由 issuerCert 表示，并包含一个 nonce 扩展。\n 4    *\n 5\
  \    * @param issuerCert 我们想要检查的证书的签发者证书。\n 6    * @param serialNumber 我们想要检查的证书的序列号。\n\
  \ 7    * @return 一个 OCSP 请求。\n 8    */\n 9   public static OCSPReq generateOCSPRequest(\n\
  10                   X509CertificateHolder issuerCert, BigInteger serialNumber)\n\
  11       throws OCSPException, OperatorCreationException\n12   {\n13       DigestCalculatorProvider\
  \ digCalcProv =\n14           new JcaDigestCalculatorProviderBuilder().setProvider(\"\
  BC\").build();\n15 \n16       // 生成我们正在查找的证书的 ID\n17       CertificateID   id =\
  \ new CertificateID(\n18           digCalcProv.get(CertificateID.HASH_SHA1), issuerCert,\
  \ serialNumber);\n19 \n20       // 带有 nonce 的基础请求\n21       OCSPReqBuilder bldr\
  \ = new OCSPReqBuilder();\n22 \n23       bldr.addRequest(id);\n24 \n25       //\
  \ 创建 nonce 扩展的细节 - 仅供示例！\n26       BigInteger nonce = BigInteger.valueOf(System.currentTimeMillis());\n\
  27 \n28       bldr.setRequestExtensions(new Extensions(\n29           new Extension(OCSPObjectIdentifiers.id_pkix_ocsp_nonce,\n\
  30                        true, new DEROctetString(nonce.toByteArray()))));\n31\
  \ \n32       return bldr.build();\n33   }\n```\n\n代码遵循三个步骤：首先构建 `CertificateID`，以便我们在请求中包含要检查的证书的正确信息。接下来，我们创建一个\
  \ `OCSPReqBuilder` 并将 `CertificateID` 添加其中。最后，我们向构建器添加 nonce 扩展，然后生成完成请求。\n\n##\
  \ 生成 OCSP 响应\n\n组合一个 OCSP 响应需要使用 `BasicOCSPRespBuilder` 和 `OCSPRespBuilder` 类。我们需要这两个构建器，因为\
  \ OCSP 允许在 `OCSPResponse` 中包含 `BasicOCSPResponse` 以外的响应类型。\n\n接下来的示例方法编写目的是允许根据最后一个参数——`revokedSerialNumber`\
  \ 为传递给它的证书生成通过或失败的响应。\n\n\n\n\n\n```java\n   /**\n    * 根据单个撤吊的证书生成 OCSP 响应。\n \
  \   *\n    * @param request 我们被要求检查的 OCSP 请求。\n    * @param responderKey 响应者的签名密钥。\n\
  \    * @param pubKey 响应者的公钥。\n    * @param revokedSerialNumber 我们视作已撤销的序列号。\n  \
  \  * @return 一个 OCSP 响应。\n    */\n   public static OCSPResp generateOCSPResponse(\n\
  \       OCSPReq request,\n       PrivateKey responderKey, SubjectPublicKeyInfo pubKey,\n\
  \       BigInteger revokedSerialNumber)\n       throws OCSPException, OperatorCreationException\n\
  \   {\n       DigestCalculatorProvider digCalcProv =\n           new JcaDigestCalculatorProviderBuilder().setProvider(\"\
  BC\").build();\n\n      BasicOCSPRespBuilder basicRespBldr = new BasicOCSPRespBuilder(\n\
  \                                    pubKey,\n                                 \
  \   digCalcProv.get(CertificateID.HASH_SHA1));\n\n      Extension ext = request.getExtension(\n\
  \                                 OCSPObjectIdentifiers.id_pkix_ocsp_nonce);\n\n\
  \      if (ext != null)\n      {\n          basicRespBldr.setResponseExtensions(new\
  \ Extensions(ext));\n      }\n\n      Req[] requests = request.getRequestList();\n\
  \n      for (int i = 0; i != requests.length; i++)\n      {\n          CertificateID\
  \ certID = requests[i].getCertID();\n\n          // 这通常会更通用得多！\n          if (certID.getSerialNumber().equals(revokedSerialNumber))\n\
  \          {\n               basicRespBldr.addResponse(certID,\n               \
  \    new RevokedStatus(new Date(), CRLReason.privilegeWithdrawn));\n           }\n\
  \          else\n           {\n               basicRespBldr.addResponse(certID,\
  \ CertificateStatus.GOOD);\n           }\n      }\n\n      ContentSigner signer\
  \ = new JcaContentSigner(\"SHA256WithECDSA\")\n                                \
  \       .setProvider(\"BC\").build(responderKey);\n\n      BasicOCSPResp basicResp\
  \ = basicRespBldr.build(signer, null, new Date());\n\n      OCSPRespBuilder respBldr\
  \ = new OCSPRespBuilder();\n\n      return respBldr.build(OCSPRespBuilder.SUCCESSFUL,\
  \ basicResp);\n   }\n```\n\n通过代码可以看到，我们需要先设置 `BasicOCSPRespBuilder`，如果请求中存在 nonce，则将其添加。处理步骤是检查请求中的任何\
  \ `CertificateID` 对象是否与我们给出的撤销序列号匹配。接下来，我们构建并签名 `BasicOCSPResp`（我们假设客户端知道如何验证证书链）。最后创建一个\
  \ `OCSPResp` 对象，由于我们能够完整处理请求，指示成功状态。\n\n### 将请求生成器与响应结合\n\n接两个代码示例是一个通用的状态报告器，用于说明你可能如何解释响应。在下面的代码片段中，我们使用之前定义的\
  \ `generateOCSPRequest()` 生成请求，然后使用上一节定义的 `generateOCSPResponse()` 方法处理结果。\n\n```java\n\
  \   /**\n    * 使用 OCSP 请求和响应检查证书是否为撤销序列号。\n    * @param caPrivKey 签发者私钥。\n    *\
  \ @param caCert 签发者证书。\n    * @param revokedSerialNumber 响应者视为撤销的序列号。\n    * @param\
  \ certToCheck 要生成 OCSP 请求的证书。\n    * @return 用于 certToCheck 的状态消息。\n    */\n   public\
  \ static String getStatusMessage(\n       PrivateKey caPrivKey, X509CertificateHolder\
  \ caCert,\n             BigInteger revokedSerialNumber, X509CertificateHolder certToCheck)\n\
  \       throws Exception\n   {\n       OCSPReq request = generateOCSPRequest(\n\
  \                                       caCert, certToCheck.getSerialNumber());\n\
  \n       OCSPResp response = generateOCSPResponse(\n           request,\n      \
  \     caPrivKey, caCert.SubjectPublicKeyInfo(),\n           revokedSerialNumber);\n\
  \       \n       BasicOCSPResp basicResponse =\n                           (BasicOCSPResp)response.getResponseObject();\n\
  \n       ContentVerifierProvider verifier =\n             new JcaContentVerifierBuilder()\n\
  \                   .setProvider(\"BC\").build(caCert.SubjectPublicKeyInfo());\n\
  \n       // 验证响应\n       if (basicResponse.isSignatureValid(verifier))\n       {\n\
  \           SingleResp[] responses = basicResponse.getResponses();\n\n         \
  \  Extension reqExt = request.getExtension(\n                               OCSPObjectIdentifiers.id_pkix_ocsp_nonce);\n\
  \           byte[] reqNonce = reqExt.getEncoded();\n           Extension respExt\
  \ = basicResponse.getExtension(\n                               OCSPObjectIdentifiers.id_pkix_ocsp_nonce);\n\
  \           // 如果 nonce 存在则进行验证\n           if (respExt != null\n              \
  \ && Arrays.equals(reqNonce, respExt.getEncoded()))\n           {\n            \
  \   String message = \"\";\n               for (int i = 0; i != responses.length;\
  \ i++)\n               {\n                   message += \" certificate number \"\
  \n                       + responses[i].getCertID().getSerialNumber();\n       \
  \            if (responses[i].getCertStatus()\n                       == CertificateStatus.GOOD)\n\
  \                       {\n                           return message + \" status:\
  \ good\";\n                       }\n                       else\n             \
  \          {\n                           return message + \" status: revoked\";\n\
  \                       }\n               }\n               return message;\n  \
  \         }\n           else\n           {\n               return \"response nonce\
  \ failed to validate\";\n           }\n       }\n       else\n       {\n       \
  \    return \"response failed to verify\";\n       }\n   }\n```\n\n此代码片段仅执行一些初始设置以创建\
  \ `getStatusMessage()` 方法所需的密钥和证书，然后调用了它。\n\n```java\n   public static void main(\n\
  \       String[] args)\n       throws Exception\n   {\n       KeyPairGenerator kpGen\
  \ = KeyPairGenerator.getInstance(\"EC\", \"BC\");\n\n       KeyPair caKp = kpGen.generateKeyPair();\n\
  \n       X509CertificateHolder caCert = createTrustAnchor(caKp, \"SHA256WithECDSA\"\
  );\n\n       KeyPair certKp = kpGen.generateKeyPair();\n\n       X509CertificateHolder\
  \ certOfInterest = createIntermediateCertificate(\n                            \
  \           caCert,\n                                       caKp.getPrivate(),\"\
  SHA256WithECDSA\",\n                                       certKp.getPublic(), 0);\n\
  \n       System.out.println(\n           getStatusMessage(\n               caKp.getPrivate(),\
  \ caCert,\n               certOfInterest.getSerialNumber().add(BigInteger.ONE),\n\
  \               certOfInterest));\n   }\n```\n\n如果你按原运行 `main()`，你应该得到证书的序列号，后面跟着“status:\
  \ good”。你也可以将 `certOfInterest.getSerialNumber().add(BigInteger.ONE)` 修改为 `certOfInterest.getSerialNumber()`，从而让\
  \ `getStatusMessage()` 返回“status: revoked”。\n\n注意，虽然示例集中于 API 中最通用的 OCSP 类，但在 `org.bouncycastle.ocsp.jcajce`\
  \ 中还有 JCA 特有的 OCSP 类，如 `JcaCertificateID`、`JcaBasicOCSPRespBuilder` 和 `JcaRespID`，它们允许使用\
  \ `PublicKey` 和 `X509Certificate` 类。\n\n\n\n\n当我们谈论证书路径（certificate path）时，我们指的是为了从某个特定的信任锚点（trust\
  \ anchor，即我们直接信任的证书）到我们尝试验证的证书（通常是终端实体证书）而涉及的证书。这条路径实际上是一系列较短路径的集合，代表了完整证书路径从信任锚点不断延伸的各个子集。有时，证书路径也被称为证书链（certificate\
  \ chain）。\n\n我们已经触及了证书有效性的两个方面：证书是否由我们信任的证书颁发机构签名，以及我们是否确定该机构没有通过颁发 `CRL` 来撤销其签名。除了信任锚点（通常是自签名的）外，路径中的所有证书都需要满足这些标准。我们需要检查的另一点是，从信任锚点开始，路径上签发证书的每一个人，是否都意图让他们签发的特定证书按照该证书目前使用的方式被使用。\n\
  \n例如，我们已经看到 `Basic Constraints`（基本约束）扩展可以用于判断证书是否可以作为 `CA` 证书使用，或者是一个终端实体证书并代表路径的终点。现在想象，你面对的是一个证书路径，其中终端实体证书由一个证书签名，而该证书的\
  \ `Basic Constraints` 扩展并未断言签名证书是 `CA` 证书。在这种情况下，路径显然是无效的，因为签署我们所看到的终端实体证书的颁发者在签署该签名证书时，并没有考虑到将其用于签署其他证书。\n\
  \n除了上述示例外，路径验证可能极其复杂，或者至少看起来极其复杂。路径验证最常用的算法是 `RFC 5280` [101] 中介绍的 IETF 算法，但重要的是记住，政府和企业都对\
  \ `RFC` 中给出的算法指定了不同的变体。这些变体被称为配置方案（profiles），在开始为特定组织验证证书之前，确保你意识到自己正在针对哪种配置进行验证至关重要。\n\
  \n## JCA 中的证书路径验证\n\nJava 拥有自己的用于验证证书路径的 API，即 `CertPath` API。这涉及到几个通过 `getInstance()`\
  \ 方法创建的类，因为它们的内部实现可能会随提供者（provider）的不同而异。还有一些用于配置证书路径分析器的参数类，以及用于携带分析结果的类和用于携带证书路径本身的类。\n\
  \n### CertPath API\n\n以下所有类都封装在 `java.security.cert` 包中。我们将在示例中展示如何使用这些类，但以下内容可以让你对阅读代码时看到的内容有一个大致的了解。\n\
  \n#### CertPath\n`CertPath` 是证书链或路径的载体类。该类的对象是通过 `CertificateFactory.generateCertPath()`\
  \ 方法之一创建的，而不是直接创建的。\n\n#### CertStore\n`CertStore` 是证书和 `CRLs` 的通用存储区。它们通过 `CertStore.getInstance()`\
  \ 创建，并要求作为 `getInstance()` 方法一部分 `CertStoreParameters` 对象。\n\n#### CertStoreParameters\n\
  `CertStoreParameters` 有两个子类：`CollectionCertStoreParameters` 和 `LDAPCertStoreParameters`。这些类的存在是为了让\
  \ `CertStores`能够获取证书和 `CRLs`。如果你想实现底层的 `CertStore`，也可以指定自己的类。\n\n#### CertSelector\n\
  `CertSelector` 是一个提供证书匹配机制的通用接口。当你需要这些选择之一时，通常会使用 `X509CertSelector` 类。\n\n####\
  \ CertPathBuilder\n`CertPathBuilder` 是用于构建已验证证书路径的支持类。这些也是基于提供者的，并使用 `getInstance()`\
  \ 工厂模式。\n\n#### CertPathValidator\n`CertPathValidator` 是用于验证现有证书路径的支持类。`CertPathValidator`\
  \ 也是基于提供者的，并使用 `getInstance()` 工厂模式创建。\n\n#### CRLSelector\n`CRLSelector` 是一个提供\
  \ `CRLs` 匹配机制的通用接口。通常在你需要这些之一时使用它。\n\n#### PKIXParameters\n`PKIXParameters` 是将配置传递给证书路径验证器或通过其子类\
  \ `PKIXBuilderParameters` 传递给证书路径构建器的主要类。\n\n#### PKIXBuilderParameters\n`PKIXBuilderParameters`\
  \ 是 `PKIXParameters`类的扩展。该类允许定义允许的最大路径长度，并提供关于你希望验证或构建路径的终端实体证书的详细信息。\n\n#### PKIXCertPathValidatorResult\n\
  如果证书路径验证失败，你将遇到异常。在验证通过的情况下，结果将以 `PKIXCertPathValidatorResult` 返回。\n\n#### PKIXCertPathChecker\n\
  `PKIXCertPathChecker` 类提供了自定义证书路径验证的方法，允许开发者引入自己的检查项。\n\n#### PKIXRevocationChecker\n\
  `PKIXRevocationChecker` 类是 `PKIXCertPathChecker` 的扩展类，于 Java 8 中出现。该类为自定义 `CRLs`\
  \ 和 `OCSP` 的使用提供了超出通常允许范围的支持。\n\n#### TrustAnchor\n`TrustAnchor` 提供了一种机制，为证书路径构建器或验证器提供公钥或包含该公钥的证书，你愿意直接信任该证书以形成证书路径的基础。\n\
  \n#### X509CertSelector\n`X509CertSelector` 是一个可变的类，可以配置为匹配特定的证书。在证书路径构建器类中，它被用于指定代表终端实体的证书。\n\
  \n#### X509CRLSelector\n`X509CRLSelector` 也是一个可变的类，可以配置为匹配特定的 `CRLs`。\n\n### 基础示例\n\
  \n下面的示例展示了使用 Java `CertPath` API 对基于信任锚点、终端实体证书上方有一个 CA 证书的简单证书路径进行验证的过程。\n\n\n\n\
  \n\n```java\n/**\n * 使用 CertPathValidator 验证证书路径的基本示例。\n */\npublic class JcaCertPathExample\n\
  {\n    public static void main(String[] args)\n        throws Exception\n    {\n\
  \        //\n        // 设置我们的示例数据\n        //\n        KeyPairGenerator kpGen =\
  \ KeyPairGenerator.getInstance(\"EC\", \"BC\");\n        JcaX509CertificateConverter\
  \ certConverter =\n                           new JcaX509CertificateConverter().setProvider(\"\
  BC\");\n        JcaX509CRLConverter crlConverter =\n                           \
  \         new JcaX509CRLConverter().setProvider(\"BC\");\n\n        KeyPair trustKp\
  \ = kpGen.generateKeyPair();\n\n        X509CertificateHolder trustHldr =\n    \
  \                       createTrustAnchor(trustKp, \"SHA256withECDSA\");\n     \
  \   X509Certificate trustCert = certConverter.getCertificate(trustHldr);\n\n   \
  \     KeyPair caKp = kpGen.generateKeyPair();\n\n        X509CertificateHolder caHldr\
  \ = createIntermediateCertificate(\n                                         trustHldr,\n\
  \                                         trustKp.getPrivate(),\n              \
  \                           \"SHA256withECDSA\", caKp.getPublic(), 0);\n       \
  \ X509Certificate caCert = certConverter.getCertificate(caHldr);\n\n        KeyPair\
  \ eeKp = kpGen.generateKeyPair();\n\n        X509Certificate eeCert = certConverter.getCertificate(\n\
  \            createEndEntity(\n                caHldr, caKp.getPrivate(), \"SHA256withECDSA\"\
  , eeKp.getPublic()));\n\n        X509CRL trustCRL = crlConverter.getCRL(\n     \
  \       createEmptyCRL(trustKp.getPrivate(), \"SHA256withECDSA\", trustHldr));\n\
  \        X509CRL caCRL = crlConverter.getCRL(\n            createEmptyCRL(caKp.getPrivate(),\
  \ \"SHA256withECDSA\", caHldr));\n\n        //\n        // 创建我们的示例证书路径\n       \
  \ //\n        CertificateFactory certFact = CertificateFactory.getInstance(\n  \
  \                                              \"X.509\", \"BC\");\n\n        List<X509Certificate>\
  \ chain = new ArrayList<X509Certificate>();\n\n        chain.add(caCert);\n    \
  \    chain.add(eeCert);\n\n        CertPath certPath = certFact.generateCertPath(chain);\n\
  \n        //\n        // 构建包含我们证书集的 CertStore。\n        //\n        List certStoreList\
  \ = new ArrayList();\n\n        certStoreList.add(trustCRL);\n        certStoreList.add(caCert);\n\
  \        certStoreList.add(caCRL);\n        certStoreList.add(eeCert);\n\n     \
  \   CertStoreParameters params =\n            new CollectionCertStoreParameters(certStoreList);\n\
  \n        CertStore certStore = CertStore.getInstance(\"Collection\", params, \"\
  BC\");\n\n        //\n        // 创建有效信任锚点的集合\n        //\n        Set<TrustAnchor>\
  \ trust = new HashSet<TrustAnchor>();\n        trust.add(new TrustAnchor(trustCert,\
  \ null));\n\n        //\n        // 设置路径验证的参数\n        //\n        PKIXParameters\
  \ param = new PKIXParameters(trust);\n\n        X509CertSelector certSelector =\
  \ new X509CertSelector();\n        certSelector.setCertificate(eeCert);\n\n    \
  \    param.setTargetCertConstraints(certSelector);\n        param.addCertStore(certStore);\n\
  \        param.setRevocationEnabled(true);\n\n        try\n        {\n         \
  \   //\n            // 创建验证器并执行验证。\n            //\n            CertPathValidator\
  \ validator =\n                                CertPathValidator.getInstance(\"\
  PKIX\", \"BC\");\n\n            PKIXCertPathValidatorResult result =\n         \
  \       (PKIXCertPathValidatorResult)validator.validate(certPath, param);\n\n  \
  \          System.out.println(\"validated: \" + result.getPublicKey());\n      \
  \  }\n        catch (CertPathValidatorException e)\n        {\n            System.out.println(\"\
  validation failed: index (\"\n                + e.getIndex() + \"), reason \\\"\"\
  \ + e.getMessage() + \"\\\"\");\n        }\n    }\n}\n```\n\n### 自定义证书验证\n\n`PKIXPathChecker`\
  \ 类提供了在验证过程中引入您自己的处理逻辑的能力。这些类需要在配置时添加，并通过 `PKIXParameters.addCertStore()` 方法添加到验证过程中。\n\
  \n您可能出于以下几个原因想要使用此类。例如，您可能正在处理一个引入了自定义关键扩展的验证配置（profile），在这种情况下您将需要基于 `PKIXPathChecker`\
  \ 的实现以确保这些扩展得到正确处理。或者，您可能正在使用依赖 CRL 进行吊销检查的路径验证器，而您希望以不同的方式处理吊销，例如使用 OCSP。\n\n###\
  \ PKIXPathChecker 类\n\n`PKIXPathChecker` 是一个抽象类，它包含四个需要由子类实现的方法。需要注意的是，提交给检查器的证书顺序是由路径验证器的编写者决定的。执行向前检查（forward\
  \ checking）的验证器从实体证书（end-entity）开始，沿证书链向上直到信任锚点（trust anchor）。反向检查（reverse checking）则简单地按照相反方向提交证书，实体证书是最后一个提交的\n\
  \n需要实现的四个方法是：\n\n`init()`\n\n顾如其名`init()` 方法初始化检查器的状态。它的唯一布尔参数指示检查器是为正向检查（`true`）还是反向检查（`false`）进行初始化。\n\
  \n`isForwardCheckingSupported()`\n\n如果支持正向检查，此方法应返回 `true`。注意：JCA 期望所有的检查器都支持反向处理。\n\
  \n`getSupportedExtensions()`\n\n`getSupportedExtensions()` 应返回一个包含 `String` 对象的\
  \ OID 集合，代表该检查器处理的特定扩展。如果检查器的用途除了处理扩展之外，则它应返回 `null`。\n\n`check()`\n\n`check()`\
  \ 方法是执行工作的地方。它接受两个参数：一个代表要检查的证书，另一个代表验证器无法处理的关键 OID 集合。这些 OID 存储在 `String` 类型的 `Set`\
  \ 中，且该 `Set` 是可变的，其思路是您应该从中移除任何检查器已处理过的 OID，从而向调用该检查器的验证器信号这些扩展已处理。\n\n下面的示例展示了一个基于\
  \ `PKIXPathChecker` 的简单 OCSP 检查器。在 Java 1.8 之前，以及对于支持旧版本 JVM 的提供程序，这是支持“自定义”OCSP\
  \ 实现的唯一方法。\n\n\n\n\n\n```\n /**\n * 一个基础路径检查器，对单个 CA 进行 OCSP 检查\n */\n public class\
  \ OCSPPathChecker\n    extends PKIXCertPathChecker\n{\n    private KeyPair     \
  \    responderPair;\n    private X509Certificate caCert;\n    private BigInteger\
  \      revokedSerialNumber;\n\n    public OCSPPathChecker(\n        KeyPair    \
  \     responderPair,\n        X509Certificate caCert,\n        BigInteger      revokedSerialNumber)\n\
  \    {\n        this.responderPair = responderPair;\n        this.caCert = caCert;\n\
  \        this.revokedSerialNumber = revokedSerialNumber;\n    }\n\n    public void\
  \ init(boolean forwardChecking)\n        throws CertPathValidatorException\n   \
  \ {\n        // ignore\n    }\n\n    public boolean isForwardCheckingSupported()\n\
  \    {\n        return true;\n    }\n\n    public Set getSupportedExtensions()\n\
  \    {\n        return null;\n    }\n\n    public void check(Certificate cert, Collection\
  \ extensions)\n        throws CertPathValidatorException\n    {\n        try\n \
  \       {\n            X509CertificateHolder issuerCert =\n                    \
  \                 new JcaX509CertificateHolder(caCert);\n            X509CertificateHolder\
  \ certToCheck =\n                        new JcaX509CertificateHolder((X509Certificate)cert);\n\
  \n            if (certToCheck.getIssuer().equals(issuerCert.getSubject()))\n   \
  \         {\n                String message = OCSPProcessingExample.getStatusMessage(\n\
  \                    responderPair.getPrivate(),\n                    issuerCert,\n\
  \                    revokedSerialNumber, certToCheck);\n\n                if (message.endsWith(\"\
  good\"))\n                {\n                    System.out.println(message);\n\
  \                }\n                else\n                {\n                  \
  \  throw new CertPathValidatorException(message);\n                }\n         \
  \   }\n        }\n        catch (Exception e)\n        {\n            throw new\
  \ CertPathValidatorException(\n                           \"exception verifying\
  \ certificate: \" + e, e);\n        }\n    }\n}\n```\n\n请注意 `isForwardChecking()`\
  \ 方法返回 `true`，且 `getSupportedExtensions()` 返回 `null`。在 `OCSPPatchChecker` 的情况下，该检查器对证书呈现的顺序是不敏感的，但因为它被用于撤销检查，它不处理任何扩展，因此\
  \ `getSupportedExtensions()` 返回 `null`，并且传递给 `match()` 方法的 `extensions` `Set` 不发生任何变化。\n\
  \n在下面的示例中，我们将 `OCSPPatchChecker` 应用于路径验证。你可以看到路径检查器是如何被添加到 `PKIXParameters` 对象中的。请注意，调用\
  \ `PKIXParameters.setRevocationEnabled()` 时传入的参数为 `false`，否则路径验证器将期望能够为信任根锚和 CA\
  \ 证书找到 CRL。\n\n```\n /**\n * 使用 PKIXCertPathChecker 进行证书路径验证的基础示例，\n * 其中该检查器被用于检查撤销状态。\n\
  \ */\n public class JcaCertPathWithCheckerExample\n{\n    public static void main(\n\
  \        String[] args)\n        throws Exception\n    {\n        KeyPairGenerator\
  \ kpGen = KeyPairGenerator.getInstance(\"EC\", \"BC\");\n        JcaX509CertificateConverter\
  \ certConverter =\n                           new JcaX509CertificateConverter().setProvider(\"\
  BC\");\n\n        KeyPair trustKp = kpGen.generateKeyPair();\n\n        X509CertificateHolder\
  \ trustHldr =\n                           createTrustAnchor(trustKp, \"SHA256withECDSA\"\
  );\n        X509Certificate trustCert = certConverter.getCertificate(trustHldr);\n\
  \n        KeyPair caKp = kpGen.generateKeyPair();\n\n        X509CertificateHolder\
  \ caHldr = createIntermediateCertificate(\n                                    \
  \     trustHldr,\n                                         trustKp.getPrivate(),\n\
  \                                         \"SHA256withECDSA\", caKp.getPublic(),\
  \ 0);\n        X509Certificate caCert = certConverter.getCertificate(caHldr);\n\n\
  \        KeyPair eeKp = kpGen.generateKeyPair();\n\n        X509Certificate eeCert\
  \ = certConverter.getCertificate(\n            createEndEntity(\n              \
  \  caHldr, caKp.getPrivate(), \"SHA256withECDSA\", eeKp.getPublic()));\n\n     \
  \   List certStoreList = new ArrayList();\n\n        certStoreList.add(caCert);\n\
  \        certStoreList.add(eeCert);\n\n        CertStoreParameters params =\n  \
  \          new CollectionCertStoreParameters(certStoreList);\n        CertStore\
  \ certStore = CertStore.getInstance(\"Collection\", params, \"BC\");\n\n       \
  \ Set<TrustAnchor> trust = new HashSet<>();\n        trust.add(new TrustAnchor(trustCert,\
  \ null));\n        PKIXParameters param = new PKIXParameters(trust);\n        X509CertSelector\
  \ certSelector = new X509CertSelector();\n        certSelector.setCertificate(eeCert);\n\
  \        param.setTargetConstraints(certSelector);\n        param.addCertStore(certStore);\n\
  \        param.setRevocationEnabled(false);\n        param.addCertPathChecker(\n\
  \            new OCSPPathChecker(caKp, caCert));\n        CertPathValidator validator\
  \ = CertPathValidator.getInstance(\"PKIX\", \"BC\");\n        CertificateFactory\
  \ certFact = CertificateFactory.getInstance(\n                               \"\
  X.509\", \"BC\");\n        List<X509Certificate> chain = new ArrayList<X509Certificate>();\n\
  \n        chain.add(caCert);\n        chain.add(eeCert);\n\n        CertPath certPath\
  \ = certFact.generateCertPath(chain);\n\n        try\n        {\n            PKIXPathValidatorResult\
  \ result =\n                (PKIXPathValidatorResult)validator.validate(certPath,\
  \ param);\n\n            System.out.println(\"validated: \" + result.getPublicKey());\n\
  \        }\n        catch (CertPathValidatorException e)\n        {\n          \
  \  System.out.println(\"validation failed: index (\"\n                + e.getIndex()\
  \ + \"), reason \\\"\" + e.getMessage() + \"\\\"\");\n        }\n    }\n}\n```\n\
  \n\n\n\n\n`CertPathBuilder` 非常有用。许多协议会允许证书与签名数据或加密数据一起发送，而这些证书通常包含在 ASN.1 集合（Sets）中，集合是无序的。集合的创建者还可能包含一些与当前任务不直接相关的额外证书和\
  \ CRL（证书吊销列表）。你可能会发现自己持有一个需要验证的签名，或者持有一个端实体证书，并怀疑该证书是否真的是你应该用于加密会话密钥的那个证书，并且有一堆“随机”的证书可以从中确定答案。在这种情况下，你需要使用\
  \ `CertPathBuilder`。\n\n`CertPathBuilder` 的基本方法体现在 `PKIXBuilderParameters` 类的构造函数中，该构造函数接收信任锚点（trust\
  \ anchors）以及一个作为端实体目标约束的 `CertSelector`。一旦在 `PKIXBuilderParameters` 对象中配置了其他设置，`CertPathBuilder`\
  \ 的工作就是找到一个匹配目标约束的端实体，并构建一条通往受接受的信任锚点的有效路径。\n\n这里是 `CertPathBuilder` 的用法示例。如你所见，除了使用\
  \ `PKIXBuilderParameters` 之外，发生的情况与你在 `CertPathValidator` 中看到的非常相似。\n\n```java\n\
  \ 1 /**\n 2  * 使用 PKIXCertPathChecker 进行证书路径验证的基本示例，\n3  * 其中 checker 用于检查吊销状态。\n\
  4  */\n 5 public class JcaCertPathWithCheckerExample\n6 {\n 7     public static\
  \ void main(\n 8         String[] args)\n 9         throws Exception\n10     {\n\
  11         KeyPairGenerator kpGen = KeyPairGenerator.getInstance(\"EC\", \"BC\"\
  );\n12         JcaX509CertificateConverter certConverter =\n13                 \
  \           new JcaX509CertificateConverter().setProvider(\"BC\");\n14 \n15    \
  \     KeyPair trustKp = kpGen.generateKeyPair();\n16 \n17         X509CertificateHolder\
  \ trustHldr =\n18                            createTrustAnchor(trustKp, \"SHA256withECDSA\"\
  );\n19         X509Certificate trustCert = certConverter.getCertificate(trustHldr);\n\
  20 \n21         KeyPair caKp = kpGen.generateKeyPair();\n22 \n23         X509CertificateHolder\
  \ caHldr = createIntermediateCertificate(\n24                                  \
  \       trustHldr,\n25                                         trustKp.getPrivate(),\n\
  26                                         \"SHA256withECDSA\", caKp.getPublic(),\
  \ 0);\n27         X509Certificate caCert = certConverter.getCertificate(caHldr);\n\
  28 \n29         KeyPair eeKp = kpGen.generateKeyPair();\n30 \n31         X509Certificate\
  \ eeCert = certConverter.getCertificate(\n32             createEndEntity(\n33  \
  \               caHldr, caKp.getPrivate(), \"SHA256withECDSA\", eeKp.getPublic()));\n\
  34 \n35         List certStoreList = new ArrayList();\n36 \n37         certStoreList.add(caCert);\n\
  38         certStoreList.add(eeCert);\n39 \n40         CertStoreParameters params\
  \ =\n41             new CollectionCertStoreParameters(certStoreList);\n42 \n43 \
  \        CertStore certStore = CertStore.getInstance(\"Collection\", params, \"\
  BC\");\n44 \n45         Set<TrustAnchor> trust = new HashSet<TrustAnchor>();\n46\
  \         trust.add(new TrustAnchor(trustCert, null));\n47 \n48         CertPathValidator\
  \ validator =\n49                             CertPathValidator.getInstance(\"PKIX\"\
  , \"BC\");\n50 \n51         PKIXParameters param = new PKIXParameters(trust);\n\
  52 \n53         X509CertSelector certSelector = new X509CertSelector();\n54    \
  \     certSelector.setCertificate(eeCert);\n55 \n56         param.setTargetCertConstraints(certSelector);\n\
  57         param.addCertStore(certStore);\n58         param.setRevocationEnabled(false);\n\
  59         param.addCertPathChecker(\n60             new OCSPPathChecker(trustKp,\
  \ trustCert,\n61                                 caCert.getSerialNumber().add(BigInteger.ONE)));\n\
  61         param.addCertPathChecker(\n63             new OCSPPathChecker(caKp, caCert,\n\
  64                                 eeCert.getSerialNumber().add(BigInteger.ONE)));\n\
  65 \n66         CertificateFactory certFact = CertificateFactory.getInstance(\n\
  67                                                \"X.509\", \"BC\");\n68 \n69 \
  \        List<X509Certificate> chain = new ArrayList<X509Certificate>();\n70 \n\
  71         chain.add(caCert);\n72         chain.add(eeCert);\n73 \n74         CertPath\
  \ certPath = certFact.generateCertPath(chain);\n75 \n76         try\n77        \
  \ {\n78             PKIXCertPathValidatorResult result =\n79                 (PKIXCertPathValidatorResult)validator.validate(certPath,\
  \ param);\n80 \n81             System.out.println(\"validated: \" + result.getPublicKey());\n\
  82         }\n83         catch (CertPathValidatorException e)\n84         {\n85\
  \             System.out.println(\"validation failed: index (\"\n86            \
  \     + e.getIndex() + \"), reason \\\"\" + e.getMessage() + \"\\\"\");\n87    \
  \     }\n88     }\n89 }\n```\n\n如果你运行该示例，你应该发现路径已正确构建，并将输出从端实体回溯到信任锚点的证书如下（为了宽度裁剪）：\n\
  \n```text\nCN=Demo End-Entity Certificate, O=The Legion of Bouncy Castle, L...\n\
  CN=Demo Intermediate Certificate, O=The Legion of Bouncy Castle, L...\nCN=Demo Root\
  \ Certificate, O=The Legion of Bouncy Castle, L...\n```\n\n在配置 `CertPathBuilder`\
  \ 时，注意目标约束的选择。你可以通过使用\n\n```java\n```\n\n让构建器查找特定的证书，而不是像示例中那样依赖发行者和序列号。错误的约束可能会导致返回错误的证书路径，而模糊的约束将抛出异常。\n\
  \n### 总结\n\n在本章中，我们继续对第 7 章中的证书进行调查，并在此情况下讨论了当我们希望使某个证书失效时该怎么办，以及如何确保所需的任何证书都能追溯到我们信任的对象。\n\
  \n为了失效证书，我们研究了证书吊销列表（CRL）及其属性和扩展。这涵盖了使用 `X509v2Builder` 创建 CRL，以及在未来任何时候对其进行更新。处理证书失效的次要方法是使用在线证书状态协议（OCSP），并使用了\
  \ `OCSPReqBuilder` 创建请求的示例。\n\n最后，本章涵盖了如何检查证书路径的有效性，通过验证从信任锚点到端实体证书的链是否有效。使用 `CertPathValidator`\
  \ 的这种方法展示了完全验证证书所需的步骤。\n\n## 第 10 章：密钥和证书存储\n\nJCA 提供了一个通用的密钥库类，允许以文件形式存储密钥，有时也可以作为硬件密钥的前端。在本章中，我们只查看文件存储类型。Java\
  \ 原生支持 3 种不同的密钥库类型，Bouncy Castle 又增加了几个。Java 和 Bouncy Castle 中的某些原始密钥库类型现在被认为过时，因为它们无法跟上安全需求的变化。这也影响了\
  \ Java keytool 的用法——在旧的密钥库类型中，证书等内容通常以明文形式存储，因此可以在不提供密码的情况下对密钥库进行某些处理。现在情况不再如此。\n\
  \n### 示例的设置\n\n\n\n\n在我们开始查看密钥库（keystore）类型之前，最好要有一些可以存储在其中的内容。在这种情况下，这需要一个私钥以及一个与公钥关联的证书。标准的\
  \ Java VM 已经有一个类来将它们链接在一起了，即 `X500PrivateCredential`，它是在 `Java 1.5` 中添加的。我们在这里创建了自己的版本，因为该类在不同\
  \ Java 配置中的普及程度并没有你想象中那么广泛（例如，在编写本文时，Android 还缺少该类）。以下是一个私钥及其关联证书的简单载体类的定义。\n\n\
  ```\n 1 /**\n 2  * 私钥及其相应公钥证书的载体类。\n 3  * <p>\n 4  * 标准 Java API 也有 javax.security.auth.x500.X500PrivateCredential，\n\
  \ 5  * 该类是它的基础替代品。BC PKIX API 中还有一个稍微更\n 6  * 通用的类 - org.bouncycastle.pkix.PKIXIdentity。\n\
  \ 7  * </p>\n 8  */\n 9 public class PrivateCredential\n10 {\n11     private final\
  \ X509Certificate certificate;\n12     private final PrivateKey privateKey;\n13\
  \ \n14     /**\n15      * 基础构造函数。\n16      *\n17      * @param certificate 与 privateKey\
  \ 匹配的公钥证书。\n18      * @param privateKey 与 certificate 参数匹配的私钥。\n19      */\n 20\
  \     public PrivateCredential(X509Certificate certificate, PrivateKey privateKey)\n\
  21     {\n22         this.certificate = certificate;\n23         this.privateKey\
  \ = privateKey;\n24     }\n25 \n26     public PrivateKey getPrivateKey()\n27   \
  \  {\n28         return privateKey;\n29     }\n30 \n31     public X509Certificate\
  \ getCertificate()\n32     {\n33         return certificate;\n34     }\n35 }\n```\n\
  \n定义了载体类后，我们将使用以下方法来生成私钥以及关联的自签名证书。\n\n```\n 1   /**\n 2    * 创建一个带有关联自签名证书的私钥，\n\
  \ 3    * 并将其封装在 X500PrivateCredential 中返回。\n 4    *\n 5    * 注意：我们使用了第 6 章 EcDsaUtils\
  \ 中的 generateECKeyPair() \n 6    * 以及第 8 章 JcaX509Certificate 中的 createTrustAnchor()。\n\
  \ 7    *\n 8    * @return 包含密钥及其证书的 X500PrivateCredential。\n 9    */\n 10   public\
  \ static PrivateCredential createSelfSignedCredentials()\n 11       throws GeneralSecurityException,\
  \ OperatorCreationException\n 12   {\n13       JcaX509CertificateConverter certConverter\
  \ =\n14                          new JcaX509CertificateConverter().setProvider(\"\
  BC\");\n15 \n16       KeyPair selfSignedKp = generateECKeyPair();\n18 \n19     \
  \  X509CertificateHolder selfSignedHldr =\n19                          createTrustAnchor(selfSignedKp,\
  \ \"SHA256withECDSA\");\n21 \n22       X509Certificate selfSignedCert = certConverter.getCertificate(selfSignedHldr);\n\
  23 \n24       return new PrivateCredential(selfSignedCert, selfSignedKp.getPrivate());\n\
  25   }\n```\n\n我们将利用 `createSelfSignedCredentials()` 方法来提供密钥和证书测试数据，以便存储在我们将查看的各种密钥库中。\n\
  \n### 早期密钥库类型：JKS, JCEKS, BKS 和 UBER\n\nJKS、JCEKS、BKS 和 UBER 格式都是由 JCA 或 Bouncy\
  \ Castle 提供的早期格式（对于 JKS 和 JCEKS 是 JCA，对于 BKS 和 UBER 则是 Bouncy Castle）。它们现在开始不再用于存储私钥/秘密密钥，部分原因是因为现在有了更安全的格式可用。JKS\
  \ 和 BKS 密钥库仍常用于公钥证书。\n\nJKS 格式是 JCA 的原始密钥库格式。该格式提供了某种程度的防篡改保护，并且私钥使用了基于 `SHA-1`\
  \ 的专用流密码进行加密。密钥库无法存储秘密密钥（secret keys）。JKS 密钥库文件通常具有 `.jks` 扩展（如果有的话）。在不知道密钥库密码的情况下，可以使用\
  \ `key tool` 查看 JKS 密钥库的大部分内容，尽管在没有密码的情况下无法恢复私钥。\n\nJCEKS 格式随 JCE 引入的。这种存储格式也可以存储秘密密钥，在这种情况下，使用\
  \ Triple-DES 来保护私钥和秘密密钥。JCEKS 密钥库文件通常具有 `.jceks` 扩展。同样，在不知道密钥库密码的情况下，可以使用 `key tool`\
  \ 查看 JCEKS 密钥库的大部分内容，尽管在没有密码的情况下无法恢复受保护的秘密密钥或私钥。\n\nBKS 格式类似于 JCEKS 的格式。在不知道密钥库密码的情况下，可以使用\
  \ `key tool` 查看 BKS 密钥库的大部分内容，尽管在没有密码的情况下无法恢复私钥。BKS 也可以存储秘密密钥和私钥，并使用 Triple-DES\
  \ 保护它们。BKS 中使用 `PKCS#12` 的 `PBKDF` 将密码转换为密钥。\n\nUBER 格式基于 BKS，但与 BKS 不同，它将密钥库存储为加密的二进制大对象（blob），使用\
  \ Twofish 加密算法进行保护。这意味着在没有密码的情况下，无法使用 Java 的 `keytool` 访问密钥库。\n\n下面的示例代码展示了如何生成一个带有单个私钥和自签名证书的基础\
  \ JKS 密钥库。\n\n```\n 1 /**\n 2  * 使用 JKS 存储单个私钥和自签名\n 3  * 证书的示例示例。\n 4  */\n 5 public\
  \ class JKSExample\n6 {\n 7     public static void main(String[] args)\n 8     \
  \    throws Exception\n 9     {\n10         PrivateCredential cred = createSelfSignedCredentials();\n\
  11 \n12         KeyStore store = KeyStore.getInstance(\"JKS\");\n13 \n14       \
  \  store.load(null, null);\n15 \n16         store.setKeyEntry(\"key\", cred.getPrivateKey(),\
  \ \"keyPass\".toCharArray(),\n17             new Certificate[] { cred.getCertificate()\
  \ });\n18 \n19         FileOutputStream fOut = new FileOutputStream(\"basic.jks\"\
  );\n20 \n21         store.store(fOut, \"storePass\".toCharArray());\n22 \n23   \
  \      fOut.close();\n24     }\n25 }\n```\n\n注意 `store.load(null, null);` 执行了初始化密钥库的任务。\n\
  \n如果你运行该示例，它将创建一个名为 `basic.jks` 的 JKS 格式文件。我们将在下一节中使用该文件查看 `keytool` 的命令。\n\n###\
  \ keytool 命令\n\n`keytool` 是一个用于命令行处理密钥库的 Java 工具。它默认处理 JKS 密钥库，因此对于基础查看或显示现有密钥库，你只需要使用\
  \ `-list` 选项，并提供密钥库的位置 `-keystore` 以及存储密码 `-storepass`。如果没有作为参数传递存储密码，`keytool`\
  \ 命令会提示输入。\n\n#### 查看密钥库\n\n假设你想使用 `keytool` 查看上一节创建的 JKS 密钥库，可以这样使用：\n\n```\nkeytool\
  \ -list -keystore basic.jks -storepass storePass\n```\n\n运行此命令应该显示类似下方的输出：\n\n```\n\
  Keystore type: jks\nKeystore provider: SUN\n\n您的密钥库包含 1 个条目\n\nkey, <dd/mm/yyyy>,\
  \ PrivateKeyEntry,\nCertificate fingerprint (SHA1): <一个 SHA-1 指纹>\n```\n\n其中 `<dd/mm/yyyy>`\
  \ 是条目创建时的日期（日/月/年格式）。\n\n指纹看起来像这样：\n\n```\nED:44:9F:92:5B:DA:C8:DD:34:9A:7A:A5:B3:8D:04:D7:CE:6B:69:27\n\
  ```\n\n尽管你可能会预期数字是不同的，因为 SHA-1 指纹的想法是提供一个可以唯一标识证书的 20 字节值。在较新的 JVM 中，你还会发现指纹已升级为\
  \ SHA-256，在这种情况下它将包含 32 个十六进制值，描述显示为：\n\n```\nCertificate fingerprint (SHA-256):\
  \ ...\n```\n\n\n\n\n\n要查看在不在命令行或通过 `Enter keystore password` 提示时不输入密码时会发生什么，请尝试以下操作：在提示输入密码时，不要输入任何密码字符，直接按\
  \ `<enter>` 键即可。\n\n```\nkeytool -list -keystore basic.jks\n```\n\n如果你在密码提示处直接按下\
  \ `<enter>`，你应该会看到类似下面的内容：\n\n```\n*****************  WARNING WARNING WARNING  *****************\n\
  * 您的密钥库中存储信息的完整性  *\n* 尚未经过验证！为了验证其完整性，*\n* 您必须提供您的密钥库密码。                  *\n*****************\
  \  WARNING WARNING WARNING  *****************\n\nKeystore type: jks\nKeystore provider:\
  \ SUN\n\nYour keystore contains 1 entry\n\nkey, <dd/mm/yyyy>, PrivateKeyEntry,\n\
  Certificate fingerprint (SHA1): <a SHA-1 fingerprint>\n```\n\n``` \n\n## 生成密钥对\n\
  \n你也可以使用 `keytool` 从命令行创建一个带有初始密钥对的密钥库。例如，尝试运行：\n\n```\nkeytool -genkey -alias key\
  \ -keyalg RSA -keystore rsa.jks -keysize 2048\n```\n\n由于命令行中没有传递密码，命令将提示你输入密码。在生成密钥对后，它还会提示输入与自签名证书关联的\
  \ X.500 DN 元素，该证书将包含公钥，而公钥将与私钥一同存储。\n\n你可以通过对生成的密钥库运行 list 命令来查看结果：\n\n```\nkeytool\
  \ -list -keystore rsa.jks\n```\n\n 假设你正在使用 Java 9 之前的 JVM，你将看到类似下面的内容，显示了我们为别名 `key`\
  \ 生成的私钥条目：\n\n```\nEnter keystore password:\nKeystore type: jks\nKeystore provider:\
  \ SUN\n\nYour keystore contains 1 entry\n\nkey, <dd/mm/yyyy>, PrivateKeyEntry,\n\
  Certificate fingerprint (SHA1): <a SHA-1 fingerprint>\n```\n\n随着 Java 9 的发布，JVM\
  \ 维护者转而使用 PKCS12 作为默认文件格式，而不是 JKS。我们将在本章的后续部分进一步介绍 PKCS12，但如果你使用 Java 9 或更高版本运行\
  \ list 命令，你将看到类似下面的内容：\n\n```\nEnter keystore password:\nKeystore type: PKCS12\n\
  Keystore provider: SUN\n\nYour keystore contains 1 entry\n\nkey, <dd mmm yyyy>,\
  \ PrivateKeyEntry,\nCertificate fingerprint (SHA-256): <a SHA-256 fingerprint>\n\
  ```\n\n这表示密钥库是 PKCS12 类型，并且显示的创建日期月份使用的是短名称形式而非数字。\n\n## 生成证书请求\n\n在生成带有自签名证书的密钥后，我们通常希望从证书机构（CA）获取一个证书来替换我们的自签名证书。\n\
  \n```\nkeytool -certreq -alias key -file csr.txt -keystore rsa.jks\n```\n\n`csr.txt`\
  \ 文件在某种意义上是人类可读的。如果你查看它，会发现在包含 `-----BEGIN NEW CERTIFICATE REQUEST-----` 行和以 `-----END\
  \ NEW CERTIFICATE REQUEST-----` 结尾的行之间有一个 base64 编码块。我们将在第 12 章详细查看这些内容，但这里的快速摘要是：你在文件中看到的内容实际上是\
  \ DER 编码 PKCS#10 证书请求的 base64 编码。它包含了两个值得注意点：你之前生成的公钥，以及你想要与之关联的 X.500 名称。这两个点都使用与公钥关联的私钥生成的签名进行了完整性保护。\n\
  \n## 导入从证书机构收到的证书\n\n一旦你将证书请求发送给证书机构（CA），你将收到另一个包含 CA 签名的实际证书的文件。你需要将此加载到密钥库中以替换你的自签名证书。这通常是一个两步骤的过程：你需要导入\
  \ CA 的信任锚点（trust anchor），然后导入 CA 的响应，通过对创建密钥时使用的相同别名进行导入，将其与你生成的密钥关联。\n\n在下面的示例中，我们考虑了实现这一点的方法：CA\
  \ 在名为 `ca-trustanchor.pem` 的文件中发送了它的信任锚点，并将我们证书请求的响应放在名为 `ca-response.pem` 的文件中。\n\
  \n我们的第一步是将信任锚点作为信任证书导入密钥库。我们的操作如下：\n\n```\nkeytool -import -alias ca-name -keystore\
  \ rsa.jks -file ca-trustanchor.pem\n```\n\n其中 `ca-name` 是我们为该 CA 选择的别名，`ca-trustanchor.pem`\
  \ 是信任锚点证书。`keytool` 命令将打印有关信任锚点证书的一些细节，并请求确认以信任它。假设一切顺利，你应该回答 `yes` 以确认该证书应被信任。\n\
  \n接下来我们导入响应，但这次导入使用的是我们生成原始密钥时使用的别名 - `key`。\n\n```\nkeytool -import -alias key\
  \ -keystore rsa.jks -file ca-response.pem\n```\n\n当执行此导入时，最初为我们的密钥生成的自签名证书将被丢弃，`ca-response.pem`\
  \ 中的 CA 响应证书将取而代之。此时，对于任何其他依赖你所使用的 CA 的人来说，你应该\n\n### PKCS12 存储类型\n\nPKCS12 store\
  \ 的名称、格式源自“PKCS #12: Personal Information Exchange”。最初 PKCS #12 是一个 RSA 控制的标准，但现在由\
  \ IETF 管理，最新版本为 RFC 7292。\n\n使用 Bouncy Castle 提供程序创建 PKCS12 文件的过程与 JKS 相似，不同之处在于密钥没有密码。在示例中你可以看到密钥被设置为\
  \ `null`：\n\n```\n/**\n * 使用 JKS 存储单个私钥和自签名\n * 证书的基本示例。\n */\npublic class PKCS12Example\
  \ {\n    public static void main(String[] args)\n        throws Exception\n    {\n\
  \        PrivateCredential cred = createSelfSignedCredentials();\n\n        KeyStore\
  \ store = KeyStore.getInstance(\"PKCS12\", \"BC\");\n\n        store.load(null,\
  \ null);\n\n        store.setKeyEntry(\"key\", cred.getPrivateKey(), null,\n   \
  \         new Certificate[] { cred.getCertificate() });\n\n        FileOutputStream\
  \ fOut = new FileOutputStream(\"basic.12\");\n\n        store.store(fOut, \"storePass\"\
  .toCharArray());\n\n        fOut.close();\n    }\n}\n```\n\n没有密钥密码是因为传统的 PKCS12\
  \ 是为个人数据设计的，因此只需要保护密钥库的密码。Bouncy Castle 遵循这种模式，大多数实现也是如此。\n\n你可以使用 `keytool` 命令列出创建密钥库，尽管在早期的\
  \ JVM 上你需要使用 `-storetype` 选项指定密钥库类型，例如：\n\n```\nkeytool -list -keystore basic.12\
  \ -storetype PKCS12\n```\n\n### BCFKS/BCSFKS 密钥库类型\n\nBCFKS 密钥库类型的出现是因为我们的首次 FIPS\
  \ 认证。用户面临的问题涉及将密钥存储在磁盘上，但要确保文件格式完全符合 FIPS 标准。这当然包括使用 PBKDF2 进行密码转换，并能够支持为密钥库中的密钥设置不同的密码。PKCS\
  \ #12 作为最接近的方案被排除，因为很少有实现支持不同的密钥和密钥库密码，而且普通的 PBE 算法也不符合 FIPS 标准。\n\n考虑到这一点，下面的示例创建了一个\
  \ BCFKS 密钥库。\n\n\n\n\n\n```\n /**\n * 使用 BCFKS 存储单个私钥和自签名\n * 证书的基本示例。\n */\npublic\
  \ class BCFKSExample\n{\n    public static void main(String[] args)\n        throws\
  \ Exception\n    {\n        PrivateCredential cred = createSelfSignedCredentials();\n\
  \n        KeyStore store = KeyStore.getInstance(\"BCFKS\", \"BC\");\n\n        store.load(null,\
  \ null);\n\n        store.setKeyEntry(\"key\", cred.getPrivateKey(), \"keyPass\"\
  .toCharArray(),\n            new Certificate[] { cred.getCertificate() });\n\n \
  \       FileOutputStream fOut = new FileOutputStream(\"basic.fks\");\n\n       \
  \ store.store(fOut, \"storePass\".toCharArray());\n\n        fOut.close();\n   \
  \ }\n}\n```\n\n创建的角度来看，`BCFKS`密钥库的功能与 `JKS` 密钥库非常相似。请注意，`BCFKS` 格式虽然允许为密钥关联单独密码，但它在方法上与\
  \ `PKCS#12` 类似，即它假设一旦进程解锁了密钥，就可以再次使用它，也就是说密钥密码只会被检查一次。如果你正在运行一个想要保证每个线程隔离的应用程序，请使用下面详细介绍的\
  \ `IBCFKS` 变体。`IBCFKS` 是 `BCFKS` 密钥库的不可变封装，因此磁盘上的存储格式相同，但加载时的行为不同。\n\n### 定制化 BCFKS\n\
  \n由于 `BCFKS` 格式完全由其数据文件中存储的算法标识符驱动，因此可以在格式中引入不同的算法。\n\n#### 使用 Scrypt\n\n引入的第一个自定义是引入使用\
  \ `scrypt` 算法的能力。`scrypt` 算法为 `FIPS` 方案 `PBKDF2` 提供了一个内存困难的封装。我们最初在第 5 章中查看过 `scrypt`。在接下来的示例中，我们将看到如何使用\
  \ `ScryptConfig` 来初始化 `BCFKS` 密钥库，以便使用基于 `scrypt` 的 `PBKDF2` 保护密钥库。\n\n```java\n\
  \ /**\n * 使用 BCFKS 存储单个私钥和自签名\n * 证书的示例，使用 scrypt 进行密钥库保护。\n */\npublic class BCFKSwithScryptExample\n\
  {\n    public static void main(String[] args)\n        throws Exception\n    {\n\
  \        PrivateCredential cred = createSelfSignedCredentials();\n\n        // 指定\
  \ scrypt 参数\n        PBKDFConfig config = new ScryptConfig.Builder(1024, 8, 1)\n\
  \                                                         .withSaltLength(20).build();\n\
  \n        KeyStore store = KeyStore.getInstance(\"BCFKS\", \"BC\");\n\n        //\
  \ 使用 scrypt 初始化空存储库\n        store.load(new BCFKSLoadStoreParameter.Builder()\n\
  \                                         .withStorePBKDFConfig(config)\n      \
  \                                   .build());\n\n        store.setKeyEntry(\"key\"\
  , cred.getPrivateKey(), \"keyPass\".toCharArray(),\n                           \
  \          new Certificate[] { cred.getCertificate() });\n\n        FileOutputStream\
  \ fOut = new FileOutputStream(\"scrypt.fks\");\n\n        store.store(fOut, \"storePass\"\
  .toCharArray());\n\n        fOut.close();\n    }\n}\n```\n\n正如我们在第 5 章所看到的，`scrypt`\
  \ 的思想不仅是为了引入密码哈希和加盐来保护密码，它还引入了内存困难性——这意味着它消耗大量内存，以防止哈希过程很容易适配于如改装的图形加速器或专用硬件的加速。\n\
  \n#### 使用 IBCFKS\n\n`IBCFKS` 密钥库设计用于在不同线程之间共享。它是普通 `BCFKS` 密钥库的不可变封装，该库始终需要密码来解锁密钥。如果你已经有一个不想更改的\
  \ `BCFKS` 密钥库，可以使用 `IBCFKS` 来防止应用程序线程在加载后更改密钥库。例如：\n\n```\nKeyStore store = KeyStore.getInstance(\"\
  IBCFKS\", \"BC\");\nFileInputStream fIn = new FileInputStream(\"basic.fks\");\n\n\
  store.load(fIn, \"storePass\".toCharArray());\n```\n\n可以被用于加载我们在上一个示例中创建的 `BCFKS`\
  \ 密钥库。\n\n### 使用 keytool 转换密钥库\n\n有时你会发现自己拥有某种格式的密钥库，而你需要完全不同格式的密钥库。你可以使用 `keytool`\
  \ 的 `-importstore` 操作来执行这种转换。下面的示例展示了如何将 `JKS` 格式的文件转换为 `BCFKS` 文件：\n\n```\nkeytool\
  \ -importkeystore -srckeystore rsa.jks \\\n                -destkeystore rsa.bcfks\
  \ -deststoretype BCFKS\n```\n\n此示例中对源密钥库没有规范，因为我们使用的是 `JKS` 密钥库（默认）。如果源密钥库是其他类型，你需要使用\
  \ `-srcstoretype` 来指定源密钥库的类型。\n\n关于密钥库转换有一个警告。在大多数情况下，如果密钥库仅包含私钥及其关联证书，转换应该总是顺畅的。并不是所有的密钥库类型都支持存储对称密钥，因此如果源密钥库中存在对称密钥，转换时可能会出现问题。在这种情况下，你可能需要将原始密钥库拆分，以便你拥有\n\
  \n### 总结\n\n在本章中，我们检查了现在已过时的密钥历史格式。我们研究了现代 FIPS 兼容密钥库的属性以及如何在软件中使用。\n\n本章主要使用 `keytool`，因为虽然密钥和证书存储可以通过\
  \ BouncyCastle API 完成，但大多数密钥库的操作是通过命令行完成的。\n\n最后，我们涵盖了密钥库的格式转换，同样使用了 `keytool`。请注意，如果密钥库中有对称密钥，转换可能无法正常工作\n\
  \n## 第 11 章：加密消息语法、S/MIME 和 TSP\n\n在本章中，我们将查看使用我们目前所学的加密原语的高级消息协议。我们将从加密消息语法（Cryptographic\
  \ Message Syntax）开始，它是其他消息格式的起点，例如安全 MIME (S/MIME) 和时间戳协议 (TSP)。在发布方面，处理这些消息类型的\
  \ API 主要出现在以 `bcpix` 为头的 jar 中，唯一的例外是基于 JavaMail 的 S/MIME API，它出现在以 `bcmail` 开头的\
  \ jar 中。\n\n### 加密消息语法\n\n加密消息语法最初在 `PKCS#7` 中描述，由于原因，它通常被称为 `PKCS#7` 或缩写 `CMS`。在原始形式中，它提供了消息的签名、加密和基于\
  \ MAC 的认证机制。之后情况发生了变化，标准的持续开发已由 IETF 接管，最新版本的 CMS 描述在 `RFC 5652` 中。CMS 的编码基于 `ASN.1`，除了作为签名或\
  \ MAC 算法输入的结构外，CMS 结构被定义为使用 `BER` 编码规则。`BER` 的意味着 CMS 结构通常使用不定长度编码构建，并且能够处理比处理它的可用内存更大的消息数据。\n\
  \nCMS 结构都封装在一个基础结构中，即 `ContentInfo` 结构。在 `RFC 5652` 中，`ContentInfo` 结构及其字段定义如下：\n\
  \n```\nContentInfo ::= SEQUENCE {\n    contentType ContentType,\n    content [0]\
  \ EXPLICIT ANY DEFINED BY contentType }\n\nContentType ::= OBJECT IDENTIFIER\n```\n\
  \n\n\n\n从本质上说，该结构提供了为特定结构标记对象标识符所需的全部。甚至为 `ContentInfo` 结构本身也有一个对象标识符：\n\n```\n\
  id-ct-contentInfo OBJECT IDENTIFIER ::= { iso(1) member-body(2)\n         us(840)\
  \ rsadsi(113549) pkcs(1) pkcs9(9) smime(16) ct(1) 6 }\n```\n\n对于交换压缩、加密、签名或经过身份验证的消息，我们需要执行的大多数任务都定义了相应的标识符和结构。Bouncy\
  \ Castle API 包含了与这些结构大部分功能等同的高级 API，以及可以用于处理构成结构的原始数据的 ASN.1 类（ASN.1 classes）。由于某些\
  \ CMS 结构可能非常大，API 支持内存模型和流式模型来创建和解析 CMS 结构。\n\nCMS API 的包名为 `org.bouncycastle.cms`。我们将从最简单的结构开始，该结构仅用于包含通用数据。\n\
  \n### 数据内容 (Data Content)\n\n数据内容类型由对象标识符 `id-data` 标识，其定义如下：\n\n```\nid-data OBJECT\
  \ IDENTIFIER ::= { iso(1) member-body(2)\n         us(840) rsadsi(113549) pkcs(1)\
  \ pkcs7(7) 1 }\n```\n\n严格来说，`id-data` 可用于指示任何结构，因此它可以应用于特定应用程序的内容。尽管如此，`id-data`\
  \ 的 `contentType` 通常为 `OCTET STRING`，内容中存在的任何额外结构都编码在组成 `contentType` 的字节流中。\n\n\
  Bouncy Castle 有两个处理内存数据的接口，以及一个支持流式数据的类。这些接口还提供了处理常见情况的默认实现。\n\n对于内存使用，基本接口是 `CMSProcessable`，它与数据类型无关，仅由两个方法组成：一个需要实现以将数据写入输出流，另一个用于将内容作为\
  \ `Object` 返回。还 fact 扩展接口 `CMSTypeData`，它在需要时允许数据类型为 `id-data` 以外的类型，并包含一个额外方法 `getContentType()`，它返回表示内容类型的\
  \ `ASN1ObjectIdentifier`。默认实现由 `CMSProcessableByteArray` 和 `CMSProcessableFile`\
  \ 提供，它们分别提供处理字节编码数据或文件的支持。这两个默认实现都拥有构造函数，允许在需要 `getContentType()` 返回除表示 `id-data`\
  \ 的 `ASN1ObjectIdentifier` 之外的内容时指定您自己的内容类型。\n\n## 签名数据内容 (SignedData Content)\n\
  \n`SignedData` 内容通过存在 `signed-data` 内容类型被指定在 `ContentInfo` 内部，其定义如下：\n\n```\nid-signedData\
  \ OBJECT IDENTIFIER ::= { iso(1) member-body(2)\n               us(840) rsadsi(113549)\
  \ pkcs(1) pkcs7(7) 2 }\n```\n\n尽管名称 `SignedData` 暗示了如此，但 `SignedData` 并不一定包含被签名的数据，它可能只包含与签名相关的信息。当它不包含数据时（这是\
  \ S/MIME 中的常见情况），称 `SignedData` 与数据是分离的（detached）或外部的（external）。当 `SignedData` 结构不是分离的时，该结构还包含了被签名的数据，并描述为封装的（encapsulated）`SignedData`。\n\
  \n![使用两个签名者创建分离的 SignedData - 通常签名者详情是私钥和证书](img/chapter11----DetachedSignedData.png)\n\
  \n使用两个签名者创建分离的 SignedData - 通常签名者详情是私钥和证书\n\n`SignedData` 结构具有以下 ASN.1 定义：\n\n```\n\
  SignedData ::= SEQUENCE {\n    version CMSVersion,\n    digestAlgorithms DigestAlgorithmIdentifiers,\n\
  \    encapContentInfo EncapsulatedContentInfo,\n    certificates [0] IMPLICIT CertificateSet\
  \ OPTIONAL,\n    crls [1] IMPLICIT RevocationInfoChoices OPTIONAL,\n    signerInfos\
  \ SignerInfos }\n\nDigestAlgorithmIdentifiers ::= SET OF DigestAlgorithmIdentifier\n\
  \nSignerInfos ::= SET OF SignerInfo\n```\n\n版本号可以是 1, 3, 4 或 5。按照测试顺序，版本号为：\n\n\
  - 如果 `SignedData` 包含“其他”证书和/或“其他”CRL（“其他”指的是 X.509 格式以外的证书/CRL），则为 5；\n- 如果存在版本\
  \ 2 属性证书，则为 4；\n- 如果存在版本 1 属性证书、版本 3 `SignerInfo` 以及/或存在类型不为 `id-data` 的封装内容，则为\
  \ 3。\n- 如果上述均不适用，则为 1。\n\n当 `SignedData` 结构也包含被签名的数据时，数据存储在 `encapContentInfo` 字段中。`EncapsulatedContentInfo`\
  \ 的结构与 `ContentInfo` 。事实上，在 PKCS#7 的原始规范中，`encapContentInfo` 字段的类型为 `ContentInfo`。在\
  \ ASN.1 中，`EncapsulatedContentInfo` 定义如下：\n\n```\nEncapsulatedContentInfo ::= SEQUENCE\
  \ {\n    eContentType ContentType,\n    eContent [0] EXPLICIT OCTET STRING OPTIONAL\
  \ }\n```\n\n将 `eContent` 明确定义为字节字符串是 PKCS#7 和 CMS 区别。如果你需要处理任何遗留系统或数据，这一点值得——`eContent`\
  \ 可能不是 `OCTET STRING` 类型，而是使用了原始的 `ContentInfo` 结构。当 `SignedData` 用于分离或外部签名时，`eContent`\
  \ 字段缺失。\n\n如名称所示，`digestAlgorithms` 字段包含了作为 `SignedData` 中存储签名基础的消息摘要的 `AlgorithmIdentifiers`。`certificates`\
  \ 和 `crls` 字段如果存在，包含了证书和证书吊销列表。并不是所有这些内容都与存储数据中的签名相关，尽管通常对于每个 `SignerInfo` 至少有一个可以验证签名的证书。尽管\
  \ `SignedData` 的生成器没有义务这样做，RFC 5652 允许 `certificates` 和 `crls` 字段中的信息不完整甚至无关。\n\n\
  实际签名位于 `SignerInfo` 对象中，这些集合出现在 `SignedData` 结构中。注意它是一个集合，类似于 ASN.1 `SET`，在 ASN.1\
  \ 中 `SET` 类型是无序的。如果有多个签名者，你不能依赖它们的顺序。\n\n我们可以通过查看实际的 `SignerInfo` 结构看到如何处理这个问题：\n\
  \n```\nSignerInfo ::= SEQUENCE {\n    version CMSVersion,\n    sid SignerIdentifier,\n\
  \    digestAlgorithm DigestAlgorithmIdentifier,\n    signedAttrs [0] IMPLICIT SignedAttributes\
  \ OPTIONAL,\n    signatureAlgorithm SignatureAlgorithmIdentifier,\n    signature\
  \ SignatureValue,\n    unsignedAttrs [1] IMPLICIT UnsignedAttributes OPTIONAL }\n\
  ```\n\n`sid` 字段为我们提供了一种方法，将拥有的签名与可能拥有的签名者详情进行匹配。`sid` 字段确实是为 X.509 证书或公钥设计的，其定义如下：\n\
  \n```\nSignerIdentifier ::= CHOICE {\n     issuerAndSerialNumber IssuerAndSerialNumber,\n\
  \     subjectKeyIdentifier [0] SubjectKeyIdentifier }\n```\n\n\n\n\n`IssuerAndSerialNumber`\
  \ 是一个包含证书颁发者 `X.500` 名称以及该颁发者签署的证书序列号的序列，该证书包含了验证签名所需的公钥。如果该字段包含的是 `subjectKeyIdentifier`\
  \ 而不是上述内容，则它是一个可以作为公钥索引的八字节字符串。我们在查看 `X.509` 证书扩展时也曾见过 `SubjectKeyIdentifier` 类型，且公钥证书通常也会将\
  \ `subjectKeyIdentifier` 作为扩展包含其中，这可以用于将 `SignerInfo` 中的签名与验证该签名所需的证书进行匹配。所使用的 `sid`\
  \ 类型会影响存储在结构体开处的版本号。如果 `SignerIdentifier` 选择的是 `IssuerAndSerialNumber`，则版本号为 `1`；当\
  \ `SignerIdentifier` 为 `SubjectKeyIdentifier` 时，版本号为 `3`。\n\n`SignatureValue` 仅仅是\
  \ `OCTET STRING`，它包含了实际签名，所使用的算法细节体现在 `signatureAlgorithm` 中。`signatureAlgorithm`\
  \ 等同于我们已经过的普通 `AlgorithmIdentifier` 类型。\n\n最后两个值得了解的字段是 `signedAttrs` 和 `unsignedAttrs`。它们具有相同的基础定义，定义如下：\n\
  \n``````\nSignedAttributes ::= SET SIZE (1..MAX) OF Attribute\n\nUnsignedAttributes\
  \ ::= SET SIZE (1..MAX) OF Attribute\n\nAttribute ::= SEQUENCE {\n    attrType OBJECT\
  \ IDENTIFIER,\n    attrValues SET OF AttributeValue }\n```\n\n在 `RFC 5652` 使用的旧版\
  \ ASN.1 中，`AttributeValue` 被定义为 `ANY`。当 `signedAttrs` 存在时，签名是对组成该字段的集合的 `DER` 编码计算的，`signedAttrs`\
  \ 中将有一个属性包含与签名相关的任何数据（无论是封装的还是外部的）的哈希。如果 `signedAttrs` 不存在，则签名仅与签名关联的数据计算。`unsignedAttrs`\
  \ 字段提供了一种在签名原始生成后引入要与签名存储的数据的方法，例如计数签名和时间戳就会出现在未签名属性中。\n\n### 处理 SignedData 内容\n\
  \n在开始查看用于 `CMS SignedData` 的 Bouncy Castle API 之前，我们需要承认，创建这些结构至少需要一个签名密钥和一个用于验证签名的公钥证书。\n\
  \n为了简化示例，我们假设待签名消息以及私钥和签名证书已使用以下代码构建完成：\n\n``````\n byte[] msg = Strings.toByteArray(\"\
  Hello, world!\");\n\n      KeyPair selfSignedKp = generateECKeyPair();\n      X509CertificateHolder\
  \ selfSignedCert =\n          createTrustAnchor(selfSignedKp, \"SHA256withECDSA\"\
  );\n```\n\n注意，在在此设置中，证书是自签名的。在现实世界，如果签名方无法亲自向你提供公钥证书，你通常会预期证书是一个实体（end-entity）。\n\
  \n### 使用内存模型\n\n`CMSSignedDataGenerator` 是创建 `SignedData` 的基础。处理 `SignedData` 有两种模型：一种是内存模型，假设数据可以很容易加载到内存中；另一种是基于流的，稍微难使用，因为你必须意识到自己所处的位置。我们将首先查看内存模型。\n\
  \n内存模型涉及四个步骤：\n\n1. 我们为所需的算法使用 `ContentSigner`。\n2. 我们为所需的摘要创建一个 `DigestCalculatorProvider`。\n\
  3. 我们使用 `ContentSigner` 和证书创建一个 `SignerInfoGenerator`。\n4. 我们将 `SignerInfoGenerator`\
  \ 添加到 `SignedDataGenerator` 中。\n\n以下示例展示了这在实践中是如何运作的：\n\n``````\n/**\n * 创建 SignedData\
  \ 结构。\n * @param signingKey 要生成的密钥。\n * @param signingCert 要验证的证书。\n * @param msg\
  \ 原始数据\n * @param encapsulate 如果数据应该被封装，则为 true。\n * @return 一个创建的 CMSSignedData。\n\
  \ */\npublic static CMSSignedData createSignedData(\n    PrivateKey signingKey,\
  \ X509CertificateHolder signingCert,\n    byte[] msg, boolean encapsulate)\n   \
  \ throws CMSException, OperatorCreationException\n{\n    ContentSigner contentSigner\
  \ =\n        new JcaContentSignerBuilder(\"SHA256withECDSA\")\n            .setProvider(\"\
  BC\")\n            .build(signingKey);\n\n    DigestCalculatorProvider digestCalcProvider\
  \ =\n        new JcaDigestCalculatorBuilder().setProvider(\"BC\").build();\n\n \
  \   SignerInfoGenerator signerInfoGenerator =\n        new SignerInfoGeneratorBuilder(digestCalcProvider)\n\
  \            .build(contentSigner, signingCert);\n\n    CMSSignedDataGenerator gen\
  \ = new CMSSignedDataGenerator();\n\n    gen.addSignerInfoGenerator(signerInfoGenerator);\n\
  \n    Store<X509CertificateHolder> certs =\n        new CollectionStore<>(Collections.singletonList(signingCert));\n\
  \n    gen.addCertificates(certs);\n\n    CMSProcessable typedMsg = new CMSProcessableByteArray(msg);\n\
  \n    return gen.generate(typedMsg, encapsulate);\n}\n```\n\n虽然这种方法看起来有些繁琐，但这种方法的原因是允许混合使用\
  \ `ContentSigner` 和 `DigestCalculatorProvider` 对象。`ContentSigner` 和 `DigestCalculatorProvider`\
  \ 都是接口，因此混合使用的意味着只需要符合接口的实现类即可与 `SignerInfoGenerator` 使用。如果涉及硬件加密适配器（如 HSM），这种能力就变得至关重要。HSM\
  \ 通常仅具备签名能力，并且甚至可能不支持全面的 JCA 风格 API。\n\n在最简单的情况下，如果 `ContentSigner` 和 `DigestCalculatorProvider`\
  \ 都从同一个提供者创建，可以使用以下代码通过 `JcaSimpleSignerInfoGeneratorBuilder` 创建 `SignerInfoGenerator`，将上述前三个步骤合并为一个步骤：\n\
  \n``````\n SignerInfoGenerator signerInfoGenerator =\n    new JcaSimpleSignerInfoGeneratorBuilder()\n\
  \        .setProvider(\"BC\")\n        .build(\"SHA256withECDSA\", signingKey, signingCert);\n\
  ```\n\n`JcaSimpleSignerInfoGeneratorBuilder` 仍然会创建 `ContentSigner` 和 `DigestCalculatorProvider`，但它是内部使用配置的提供者，或者在没有通过\
  \ `setProvider` 方法指定特定提供者的情况下，使用 JVM 安全提供者优先级配置的适当提供者。\n\n\n\n\n我们定义的 `createSignedData()`\
  \ 方法允许我们创建一个 `SignedData` 结构，该结构可以封装被签名的数据，也可以作为离线式签名（detached signature）。\n\n要创建一个包含封装数据的\
  \ `SignedData` 结构，我们可以使用之前所示的示例参数如下调用该方法：\n\n```\n CMSSignedData encapSigned = createSignedData(selfSignedKp.getPrivate(),\n\
  \                                              selfSignedCert, msg, true);\n```\n\
  \n从 Bouncy Castle 的角度来看，验证 `CMSSignedData` 对象中持有的结构也涉及三个步骤：\n\n- 我们向对象提供作为 `SignedData`\
  \ 结构中签名源的原始数据。\n- 我们找到与我们拥有的签名证书相关的 `SignerInformation` 实例。\n- 我们使用 `SignerInformationVerifier`\
  \ 使用签名证书对 `SignerInformation` 对象上的签名进行测试。\n\n`SignerInformation` 类等同于 CMS 中定义的 `SignerInfo`\
  \ 结构，它是 `CMSSignedDataGenerator` 通过使用提供的 `SignerInfoGenerator` 对象在内部生成的。我们可以通过使用\
  \ `SignerInfo` 中 `sid` 字段中 `SignerIdentifier` 包含的信息将证书与其关联的 `SignerInfo` 对象匹配。`SignerInformation.getSID()`\
  \ 提供 `SignerIdentifier`，并用于搜索 `CMSSignedData.getCertificates()` 返回的 `Store`。\n\n\
  在我们所看的情况下，该结构既包含了验证所需的证书，也包含了数据，我们可以使用以下方法验证 `CMSSignedData`：\n\n```\n 1   /**\n\
  \ 2    * 验证传入的 CMS SignedData 编码，假设为封装数据。\n 3    *\n 4    * @param encodedSignedData\
  \ SignedData 的 BER 编码\n 5    */\n 6   public static void verifySignedEncapsulated(byte[]\
  \ encodedSignedData)\n 7       throws CMSException, CertificateException, OperatorCreationException\n\
  \ 8   {\n 9       CMSSignedData signedData = new CMSSignedData(encodedSignedData);\n\
  10       SignerInformationStore signers = signedData.getSignerInfos();\n11     \
  \  Store certs = signedData.getCertificates();\n12 \n13       for (SignerInformation\
  \ signerInfo : signers)\n14       {\n15           Collection<X509CertificateHolder>\
  \ certCollection =\n16                                      certs.getMatches(signerInfo.getSID());\n\
  17           X509CertificateHolder cert = certCollection.iterator().next();\n18\
  \ \n19           System.out.println(\"sig verified: \" +\n20               signerInfo.verify(\n\
  21                       new JcaSimpleSignerInfoVerifierBuilder()\n22          \
  \                         .setProvider(\"BC\").build(cert)));\n23       }\n24  \
  \ }\n```\n\n除了 `SignerInformation` 类外，我们看到的另一个类是 `JcaSimpleSignerInfoVerifierBuilder`，它提供了与\
  \ `JcaSimpleSignerInfoGeneratorBuilder` 类类似的辅助。在需要更多灵活性的情况下，也可以通过 `SignerInformationVerifier`\
  \ 类使用手动方法。\n\n由于 `SignedData` 是完全自包含的，我们可以通过传递 `SignedData` 的编码来调用 `verify` 方法：\n\
  \n```\n verifySignedEncapsulated(encapSigned.getEncoded());\n```\n\n此时一个自然的问题是“为什么不总是这样做？”封装的\
  \ `SignedData` 的问题在于数据隐藏在对象的 ASN.1 编码中。我们仍然可以通过以下操作访问它：\n\n```\n CMSTypedData cmsData\
  \ = encapSigned.getSignedContent();\n      ByteArrayOutputStream bOut = new ByteArrayOutputStream();\n\
  \n      cmsData.write(bOut);\n\n      System.out.println(Strings.fromByteArray(bOut.toByteArray()));\n\
  ```\n\n但在某些情况下，不封装被签名的数据，而是将与签名数据关联的签名作为离线式签名维护是很有用的。当我们在本章后续部分查看 S/MIME 时，将看到这种实际操作的示例。\n\
  \n除了不将签名数据封装在 `SignedData` 结构中，生成离线式签名与生成封装式签名基本相同。我们的 `createSignedData()` 方法已经具有创建离线式签名的能力，我们只需要为封装参数传递\
  \ `false`，并如下所示执行新的 `createSignedData()` 调用：\n\n```\n CMSSignedData detachSigned\
  \ = createSignedData(selfSignedKp.getPrivate(),\n                              \
  \               selfSignedCert, msg, false);\n```\n\n变化的是验证签名所需的内容——在这种情况下，我们不能再假设拥有数据，必须单独传递它。这为我们提供了执行验证步骤的略有不同的方法：\n\
  \n```\n 1   /**\n 2    * 验证传入的 CMS SignedData 编码，假设为离线式\n 3    * 签名，其中 msg 代表被签名的原始数据。\n\
  \ 4    *\n 5    * @param encodedSignedData SignedData 的 BER 编码\n 6    * @param msg\
  \ 用于在 SignedData 中创建 SignerInfo 的数据\n 7    */\n 8   public static void verifySignedDetached(byte[]\
  \ encodedSignedData, byte[] msg)\n 9       throws CMSException, CertificateException,\
  \ OperatorCreationException\n10   {\n11       CMSSignedData signedData = new CMSSignedData(\n\
  12                         new CMSProcessableByteArray(msg), encodedSignedData);\n\
  13 \n14       SignerInformationStore signers = signedData.getSignerInfos();\n15\
  \       Store<X509CertificateHolder> certs = signedData.getCertificates();\n16 \n\
  17       for (SignerInformation signerInfo : signers)\n18       {\n19          \
  \ Collection<X509CertificateHolder> certCollection\n20                         \
  \           = certs.getMatches(signerInfo.getSID());\n21           X509CertificateHolder\
  \ cert = certCollection.iterator().next();\n22 \n23           System.out.println(\"\
  sig verified: \" +\n24               signerInfo.verify(\n25                    \
  \   new JcaSimpleSignerInfoVerifierBuilder()\n26                               \
  \    .setProvider(\"BC\").build(cert)));\n27       }\n28   }\n```\n\n唯一的区别在于 `CMSSignedData`\
  \ 对象的构造方式。在调用方面，该方法只需要原始数据 (msg) 以及 SignedData 结构的编码。使用我们已经定义的示例参数，我们将如下所示调用方法：\n\
  \n```\n verifySignedDetached(detachSigned.getEncoded(), msg);\n```\n\n##### 使用流式模型处理\n\
  \nPKCS#7 的原始理念之一是可以在 `SignedData` 结构中对任意大小的对象进行签名封装。Bouncy Castle API 通过提供额外的流式类也支持这一点：用于以流式方式生成\
  \ SignedData 结构的 `CMSSignedDataStreamGenerator`，以及用于以流式方式读取 SignedData 结构的 `SignedDataParser`。\n\
  \n首先查看生成。当使用流式模型创建 SignedData 结构时，我们仍然需要像以前一样传递证书和 SignerInfo 生成器。用法的变化在于写入要封装的数据。当我们准备好写入数据时，调用\
  \ `CMSSignedDataStreamGenerator` 的 `open()` 方法，并传递我们想要写入 SignedData 结构的目标流。在调用 `open()`\
  \ 时，生成器将写入结构的导言，然后将写入 `open()` 返回流的数据继续写入 `SignedData` 结构中 `encapContentInfo` 字段分配的区域。一旦对\
  \ `open()` 返回的流调用了 `close()`，尾言（由证书/CRL 和 SignerInfos 组成）将被写入目标流，结构随之关闭。\n\n以下示例使用流式方式创建一个\
  \ SignedData 结构，并使用了与之前的签名数据示例中相同的示例参数。\n\n\n\n\n\n```java\n/**\n * 使用流 API 创建 创建\
  \ SignedData 结构。\n *\n * @param signingKey 用于生成签名的密钥。\n * @param signingCert 用于验证\
  \ signingKey 签名的证书。\n * @param msg 原始消息数据\n * @return 包含已创建 SignedData 的 CMSSignedData。\n\
  \ */\npublic static byte[] createSignedDataStreaming(\n    PrivateKey signingKey,\
  \ X509CertificateHolder signingCert, byte[] msg)\n    throws CMSException, OperatorCreationException,\
  \ IOException\n{\n    SignerInfoGenerator signerInfoGenerator =\n              \
  \  new JcaSimpleSignerInfoGeneratorBuilder()\n                    .setProvider(\"\
  BC\")\n                    .build(\"SHA256withECDSA\", signingKey, signingCert);\n\
  \n    CMSSignedDataStreamGenerator gen = new CMSSignedDataStreamGenerator();\n\n\
  \    gen.addSignerInfoGenerator(signerInfoGenerator);\n\n    Store<X509CertificateHolder>\
  \ certs =\n        new CollectionStore<X509CertificateHolder>(\n               \
  \         Collections.singletonList(signingCert));\n\n    gen.addCertificates(certs);\n\
  \n    ByteArrayOutputStream bOut = new ByteArrayOutputStream();\n\n    OutputStream\
  \ sOut = gen.open(bOut, true);\n\n    sOut.write(msg);\n\n    sOut.close();\n\n\
  \    return bOut.toByteArray();\n}\n```\n\n\n\n\n如果我们处理的是无法处理 CMS 算法保护属性的遗留服务，我们可能会移除\
  \ CMS 算法保护属性。我们希望不需要这样做，但示例引入的另一个内容是 `DefaultSignedAttributeTableGenerator`。如果你正在自定义签名属性（signed\
  \ attributes），此类将为你生成所有标准属性。在用法方面，你可以扩展它，或者像示例代码中那样在内部使用它。通常你需要所有的标准属性，而你添加的内容取决于将如何处理你生成的\
  \ `SignedData` 结构的程序。\n\n你可以使用类似的过程来添加未签名属性（unsigned attributes）。默认情况下，未签名属性是空的，因此它们没有默认生成器。未签名属性用于诸如会签名（counter\
  \ signatures）等（我们将在接下来介绍这一点）以及使用时间戳协议（TSP）生成的时间戳（我们将在章节后续部分进一步介绍）。\n\n### 添加会签名\n\
  \n除了能够对数据生成签名外，CMS 还允许生成可以作为现有签名者签名的会签名的签名。在 Bouncy Castle API 中实现此操作需要几个步骤。首先，我们需要将用于会签名者的\
  \ `SignerInfoGenerator` 对象添加到 `CMSSignedDataGenerator` 中，然后调用\n\n`CMSSignedDataGenerator.generateCounterSigners()`\
  \ 并传入代表我们想要会签名的签名者的 `SignerInformation` 对象。最后，在生成会签名者后，将它们添加到我们刚刚会签名的 `SignerInformation`\
  \ 对象中以便稍后检索。\n\n下面的示例方法显示了如何添加单个会签名，我们假设它始终与我们想要会签名的 `CMSSignedData` 关联的第一个 `SignerInformation`。\n\
  \n```\n 1   /**\n 2    * 更新 SignerInfo 以包含一个会签名。生成的\n 3    * CMSSignedData 也将包含会签名者的证书。\n\
  \ 4    *\n 5    * @param original 带有要会签名的 SignerInfo 的 SignedData。\n 6    * @param\
  \ counterSignKey 用于会签名的密钥。\n 7    * @param counterSignCert 与 counterSignKey 关联的证书。\n\
  \ 8    * @ @return 一个带有会签名的更新后的 SignedData。\n 9    */\n10   public static CMSSignedData\
  \ addCounterSignature(\n 11       CMSSignedData original,\n 12       PrivateKey\
  \ counterSignKey, X509CertificateHolder counterSignCert)\n 13       throws CMSException,\
  \ OperatorCreationException\n 14   {\n 15       SignerInfoGenerator signerInfoGenerator\
  \ =\n 16           new JcaSimpleSignerInfoGeneratorBuilder()\n 17              \
  \ .setProvider(\"BC\")\n 18               .build(\"SHA256withECDSA\", counterSignKey,\
  \ counterSignCert);\n 19 \n 20       CMSSignedDataGenerator gen = new CMSSignedDataGenerator();\n\
  \ 21 \n 22       gen.addSignerInfoGenerator(signerInfoGenerator);\n 23 \n 24   \
  \    SignerInformationStore signers = original.getSignerInfos();\n 25       SignerInformation\
  \ signerInfo = signers.iterator().next();\n 26 \n 27       signerInfo = SignerInformation.addCounterSigners(\n\
  \ 28                           signerInfo, gen.generateCounterSigners(signerInfo));\n\
  \ 29 \n 30       Collection originalCerts = original.getCertificates().getMatches(null);\n\
  \ 31 \n 32       Set totalCerts = new HashSet();\n 33 \n 34       totalCerts.addAll(originalCerts);\n\
  \ 35       totalCerts.add(counterSignCert);\n 36 \n 37       CMSSignedData counterSigned\
  \ = CMSSignedData.replaceSigners(\n 38                                   original,\
  \ new SignerInformationStore(signerInfo));\n 39 \n 40       counterSigned = CMSSignedData.replaceCertificatesAndCRLs(\n\
  \ 41                    counterSigned, new CollectionStore(totalCerts), null, null);\n\
  \ 42 \n 43       return counterSigned;\n 44   }\n```\n\n你可以通过查看 `generateCounterSigners()`\
  \ 的返回值看到不同的会签名生成与普通 CMS SignedData 生成的不同之处 - 它返回一个 `SignerInformation` 对象的存储器。即使对与封装数据相关的签名者进行会签名，会签名也是在原始签名者的签名上生成的，并且只有在原始签名者的语境下查看时才有意义。\n\
  \n会签名可以像普通签名一样进行验证，通过调用包含它的 `SignerInformation` 对象上的 `verify()` 方法。Bouncy Castle\
  \ 在 `CMSSignedData` 类上还有一个实例方法 `verifySignatures()`，你可以用它来验证包括会签名在内的所有 `SignerInfo`\
  \ 结构。要使用它你需要提供 `SignerInformationVerifierProvider` 接口的实现。你将在下面的代码中看到如何实现：\n\n```\n\
  \ 1   /**\n 2    * 验证 SignedData 结构中的所有 SignerInfos，包括任何\n 3    * 会签名。\n 4    *\n\
  \ 5    * @param signedData SignedData 结构的 BER 编码。\n 6    */\n 7   public static\
  \ void verifyAllSigners(CMSSignedData signedData)\n 8       throws CMSException\n\
  \ 9   {\n10       final Store<X509CertificateHolder> certs = signedData.getCertificates();\n\
  \ 11 \n 12       System.out.println(\"signers verified: \" + signedData.verifySignatures(\n\
  \ 13           new SignerInformationVerifierProvider()\n 14           {\n 15   \
  \            SignerVerifier get(SignerId signerId)\n 16                   throws\
  \ OperatorCreationException\n 17               {\n 18                   try\n 19\
  \                   {\n 20                       X509CertificateHolder cert = (X509CertificateHolder)certs\n\
  \ 21                                       .getMatches(signerId).iterator().next();\n\
  \ 22                       \n 23                       return new JcaSimpleSignerVerifierBuilder()\n\
  \ 24                                                 .setProvider(\"BC\").build(cert);\n\
  \ 25                   }\n 26                   catch (CertificateException e)\n\
  \ 27                   {\n 28                       throw new OperatorCreationException(\n\
  \ 29                                \"verifier provider failed: \" + e.getMessage(),\
  \ e);\n 30                   }\n 31               }\n 32           }));\n 33   }\n\
  ```\n\n你可以看到 `SignerInformationVerifierProvider` 接口有一个 `get()` 方法，它接受签名者标识作为参数并期望返回\
  \ `SignerInformationVerifier`。在我们的示例中，我们知道所有的证书都在提供的 `CMSSignedData` 对象中，因此我们可以围绕现有的证书创建验证器。正如我们之前警告过的，实际操作可能比这复杂。\n\
  \n接下面的代码片段是为了填补关于会签名者来源以及如何一起调用这两个方法的空白。你可以将其视为之前用于创建 `encapSigned` 对象的示例代码的延续。\n\
  \n```\n KeyPair counterKp = generateECKeyPair();\n      X509CertificateHolder counterCert\
  \ =\n          createTrustAnchor(counterKp, \"SHA256withECDSA\");\n\n      CMSSignedData\
  \ counterSigned = addCounterSignature(encapSigned,\n                           \
  \               counterKp.getPrivate(), counterCert);\n\n      verifyAllSigners(counterSigned);\n\
  ```\n\n你可以看到，用于会签名的凭据没有任何异常。在这种情况下，区别仅仅在于它们应用的方式 - 应用于 `SignerInfo` 而不是原始签名的数据。\n\
  \n### 处理签名属性编码不当的问题\n\n\n\n\n\n偶尔你你会看到看似正确的 `SignerInfo` 对象验证失败。假设所涉及的 `SignedData`\
  \ 结构的创建者在其他方面都做得正确，这种失败的常见原因是他们忘记了对计算由签名者证书验证的签名时使用的签名属性进行 DER 编码。在这种情况下，DER 编码是非常重要的，因为属性位于一个\
  \ `SET` 中，这是一个无序类型，因此为了让 DER 编码始终产生相同的编码，在生成编码之前必须对构成属性的 `SET` 进行排序。\n\n理想情况下，任何犯这种错误的人都会修复它，但有时这是不可行的，因此\
  \ Bouncy Castle API 允许创建一个自定义的 `SignerInformation` 类，允许对签名属性使用普通的定长编码。\n\n你可以按照以下方式操作：\n\
  \n```java\n 1 /**\n 2  * 重写 SignerInformation 以停止在签名评估期间对签名属性进行 DER 排序\n 3  *\n\
  \ 4  */\n 5 public class SignerInfoUsingDefLength\n 6     extends SignerInformation\n\
  \ 7  \n\n 8     protected SignerInfoUsingDefLength(SignerInformation baseInfo)\n\
  \ 9     {\n110         super(baseInfo);\n 11     }\n 12 \n 13     /**\n 14     \
  \ * 重写以允许按 SignerInfo 中的原始形式返回编码后的属性\n 15      *\n 16      *\n 17      * @return\
  \ 作为定长编码的签名属性。\n 18      * @throws IOException 当发生编码错误时。\n 19      */\n 20     public\
  \ byte[] getEncodedSignedAttributes()\n 21         throws IOException\n 22     {\n\
  \ 23         return signedAttributeSet.getEncoded(ASN1Encoding.DL);\n 24     }\n\
  \ 25 }\n```\n\n不过，`ASN1Encoding.DL` 的使用并不是你应该经常接受的——DER 的初衷是提供一种可用于验证签名的唯一可能编码。`SET`\
  \ 的定长编码没有说明元素的顺序，这种额外的灵活性可能会被想要更改 `SignerInfo` 中签名含义的人所利用。\n\n### EnvelopedData\
  \ 内容\n\nEnvelopedData 用于承载加密信息。EnvelopedData 也包含在 `ContentInfo` 内部，其存在通过 enveloped-data\
  \ 内容类型表示：\n\n```asn\nid-envelopedData OBJECT IDENTIFIER ::= { iso(1) member-body(2)\n\
  \                us(840) rsadsi(113549) pkcs(1) pkcs7(7) 3 }\n```\n\nEnvelopedData\
  \ 总是封装了已加密的数据，并具有以下 ASN.1 结构：\n\n```asn\nEnvelopedData ::= SEQUENCE {\n    version\
  \ CMSVersion,\n    originatorInfo [0] IMPLICIT OriginatorInfo OPTIONAL,\n    recipientInfos\
  \ RecipientInfos,\n    encryptedContentInfo EncryptedContentInfo,\n    unprotectedAttrs\
  \ [1] IMPLICIT UnprotectedAttributes OPTIONAL }\n```\n\n与 `SignedData` 一样，版本号根据\
  \ `EnvelopedData` 的内容变化。如果 `originatorInfo` 字段包含“其他”证书或“其他”CRL（这里的“其他”指非 X.509 格式），则版本号为\
  \ 4。如果 `originatorInfo` 字段包含版本 2 属性证书或密码或存在“其他”接收者，则版本号为 3。如果 `originatorInfo` 缺失且\
  \ `unprotectedAttrs` 缺失且所有 `recipientInfos` 的成员都是版本 0，则版本号为 0。假设上述情况都不适用，则版本号为 2。\n\
  \n`originatorInfo`（如果存在）和 `recipientInfos` 字段带有有关 `EnvelopedData` 发送者及其预期接收者的信息。这些字段具有以下\
  \ ASN.1 类型定义：\n\n```asn\nOriginatorInfo ::= SEQUENCE {\n    certs [0] IMPLICIT CertificateSet\
  \ OPTIONAL,\n    crls [1] IMPLICIT RevocationInfoChoices OPTIONAL }\n\nRecipientInfos\
  \ ::= SET SIZE (1..MAX) OF RecipientInfo\n```\n\n`OriginatorInfo` 包含可选字段，其定义与我们之前在\
  \ `SignedData` 中看到的相同。假设你是 `EnvelopedData` 的预期接收者之一，理想情况下，如果存在，`OriginatorInfo`\
  \ 结构将包含足够的信息，使你能够向原始发送者发送加密回复。RFC 5652 确实允许 `originatorInfo` 字段中存储的信息是不完整的或与实际发送者无关的。\n\
  \n`RecipientInfos` 正如定义所示，是能够解密信封数据的接收者使用的细节集。`RecipientInfo` 类型是一个 `CHOICE`，具有以下定义：\n\
  \n```asn\nRecipientInfo ::= CHOICE {\n    ktri KeyTransRecipientInfo,\n    kari\
  \ [1] KeyAgreeRecipientInfo,\n    kekri [2] KEKRecipientInfo,\n    pwri [3] PasswordRecipientInfo,\n\
  \    ori [4] OtherRecipientInfo }\n```\n\n我们稍后将进一步查看一些不同的 `RecipientInfo` 选项，但现在最有用的一点是，每个选项都预期包含一个\
  \ `EncryptedKey` 类型，该类型编码并封装用于加密信封数据的对称密钥，其使用的算法应该适用于 `RecipientInfo` 针对的接收者。`EncryptedKey`\
  \ 类型仅仅是一个字节数组，并具有以下定义：\n\n```asn\nEncryptedKey ::= OCTET STRING\n```\n\n除了加密密钥，每个\
  \ `RecipientInfo` 结构内部通常还有一个接收者标识符（RID）。这允许接收者识别应该使用哪一个 `RecipientInfo` 来解密密钥，从而恢复被加密的数据。\n\
  \n`encryptedContentInfo` 字段包含了尝试保护的数据。其类型具有以下 ASN.1 定义：\n\n```asn\nEncryptedContentInfo\
  \ ::= SEQUENCE {\n    contentType ContentType,\n    contentEncryptionAlgorithm ContentEncryptionIdentifier,\n\
  \    encryptedContent [0] IMPLICIT EncryptedContent OPTIONAL }\n\nEncryptedContent\
  \ ::= OCTET STRING\n```\n\n你可以看到该类型非常基础。它包含了足够的信息，允许接收者获取 `RecipientInfo` 中的加密密钥，解密它，然后使用\
  \ `contentEncryptionAlgorithm`（最终是一个普通的 `AlgorithmIdentifier`）创建一个可用于恢复数据的密器。\n\n\
  ![EnvelopedData - 数据密钥在内部生成并被接收者封装](img/chapter11----EnvelopedData.png)\n\nEnvelopedData\
  \ - 数据密钥在内部生成并被接收者封装\n\n最后，`EnvelopedData` 有一个 `unprotectedAttrs` 字段，用于与受保护的数据关联附加属性。该字段使用了\
  \ `SignedData` 相同的 `Attribute` 类型，并具有以下 ASN.1 定义：\n\n```asn\nUnprotectedAttributes\
  \ ::= SET SIZE (1..MAX) OF Attribute\n```\n\n#### 处理 EnvelopedData 内容\n\n现在我们将查看使用\
  \ CMS API 创建并处理 EnvelopedData。为了简单起见，每个部分的代码都假设以下内容已经定义：\n\n```java\n JcaX509CertificateConverter\
  \ converter =\n          new JcaX509CertificateConverter().setProvider(\"BC\");\n\
  \n      byte[] msg = Strings.toByteArray(\"Hello, world!\");\n\n      CMSEnvelopedDataGenerator\
  \ envGen = new CMSEnvelopedDataGenerator();\n```\n\n我们使用 `CMSEnvelopedDataGenerator`\
  \ 是因为我们将首先使用内存模型进行生成和解析。Bouncy Castle API 中的 EnvelopedData 支持也包括流式模型。接收者生成在内存和流式模型中都是相同的，因此虽然不同模型在生成和解析\
  \ EnvelopedData 方面存在差异，但接收者的生成和使用本质上是相同的。在我们回顾了所有可用接收者类型后，我们将查看流式模型。\n\n对于内存模型，假设已添加了一些\
  \ `RecipientInfo` 生成器，`CMSEnvelopedDataGenerator` 对象在调用 `generate()` 方法时会返回一个 `CMSEnvelopedData`\
  \ 对象。\n\n\n\n\n\n```\nCMSEnvelopedData envData = envGen.generate(\n          new\
  \ CMSProcessableByteArray(msg),\n          new JceCMSContentEncryptorBuilder(CMSAlgorithm.AES256_CBC)\n\
  \              .setProvider(\"BC\")\n              .build());\n```\n\n随后我们可以通过调用\
  \ `CMSEnvelopedData` 对象的 `getEncoded()` 方法来恢复 `enveloped-data` 结构的 BER 编码，如下所示：\n\
  \n```\nCMSEnvelopedData envData = envGen.generate(\n          new CMSProcessableByteArray(msg),\n\
  \          new JceCMSContentEncryptorBuilder(CMSAlgorithm.AES256_CBC)\n        \
  \      .setProvider(\"BC\")\n              .build());\n```\n\n现在我们将查看一些支持的接收者类型。\n\
  \n## ktri - KeyTransRecipientInfo 的选择\n\n当 `RecipientInfo` 基于密钥传输传输机制（例如在使用 `RSA`\
  \ 等算法时使用的机制）时，会选择 `ktri` 值。\n\n它具有简单的 ASN.1 结构，反映了它本质上是使用对称密钥进行密钥封装（key wrap），而不仅仅是对称密钥。从下面可以看到，它允许使用两种方法来识别接收者（Recipient），这就像我们在\
  \ `SignerInfo` 中看到的那样。\n\n```\nKeyTransRecipientInfo ::= SEQUENCE {\n    version\
  \ CMSVersion,  -- 始终设置为 0 或 2\n    rid RecipientIdentifier,\n    keyEncryptionAlgorithm\
  \ KeyEncryptionAlgorithmIdentifier,\n    encryptedKey EncryptedKey }\n\nRecipientIdentifier\
  \ ::= CHOICE {\n    issuerAndSerialNumber IssuerAndSerialNumber,\n    subjectKeyIdentifier\
  \ [0] SubjectKeyIdentifier }\n```\n\n在 `RecipientIdentifier` 为 `IssuerAndSerialNumber`\
  \ 的情况下，`version` 字段被设置为 0，否则设置为 2。\n\n以下方法展示了如何使用 `OAEP` 作为对称密钥封装的编码机制，基于 `RSA`\
  \ 添加一个接收者。\n\n```\n 1   /**\n 2    * 向传入的 enveloped-data 生成器中添加一个 KeyTransRecipientInfo。\n\
  \ 3    *\n 4    * @param envGen 要添加 KeyTransRecipientInfo 的生成器。\n 5    * @param\
  \ encryptionCert 目标接收者的公钥证书。\n 6    */\n 7   public static void addKeyTransRecipient(\n\
  \ 8           CMSEnvelopedGenerator envGen,\n 9           X509Certificate encryptionCert)\n\
  10   throws GeneralSecurityException\n11   {\n 12       JcaAlgorithmParametersConverter\
  \ paramsConverter =\n 13                                           new JcaAlgorithmParametersConverter();\n\
  \ 14 \n 15       AlgorithmIdentifier oaepParams = paramsConverter.getAlgorithmIdentifier(\n\
  \ 16           PKCSObjectIdentifiers.id_RSAES_OAEP,\n 17           new OAEPParameterSpec(\"\
  SHA-256\",\n 18               \"MGF1\", new MGF1ParameterSpec(\"SHA-256\"),\n 19\
  \               PSource.PSpecified.DEFAULT));\n 20 \n 21       envGen.addRecipientInfoGenerator(\n\
  \ 22           new JceKeyTransRecipientInfoGenerator(\n 23               encryptionCert,\
  \ oaepParams).setProvider(\"BC\"));\n 24   }\n```\n\n该示例引入了 `JcaAlgorithmParametersConverter`，这是一个转换\
  \ `AlgorithmParameters` 对象或 `AlgorithmParametersSpec` 对象的工具类。\n\n使用 `RecipientInformation`\
  \ 来恢复被封装的密钥密钥。\n\n正如我们在创建 `RecipientInfo` 时使用证书为接收者提供标识符一样，我们也可以使用证书创建一个 `JceKeyTransRecipientId`，它可以用于查找与我们的证书关联的\
  \ `KeyRecipientInfo`。在 Bouncy Castle API 中，这些对象是 `RecipientInformation` 类型，假设我们为该证书找到了一个，就可以调用\
  \ `RecipientInformation.getContent()` 方法并传递一个使用我们私钥创建的 `Recipient`。随后，`RecipientInformation`\
  \ 对象内部使用我们的 `Recipient` 对象来恢复包含在其 `KeyTransRecipientInfo` 结构中的封装密钥密钥，并解密封装在 `CMSEnvelopedData`\
  \ 对象中的加密数据。\n\n以下代码行展示了一个简单的示例，应用 `extractUsingKeyTransRecipient()` 方法从我们生成的 EnvelopedData\
  \ 结构的 BER 编码中恢复并打印测试消息。\n\n```\nbyte[] keyTransRecovered = extractUsingKeyTransRecipient(\n\
  \      envEnc, recipientRsaKp.getPrivate(), recipientRsaCert);\n\nSystem.err.println(Strings.fromByteArray(keyTransRecovered));\n\
  ```\n\n假设你使用的是之前提供的测试消息并且正确添加了 `KeyTransRecipientInfo`，如果你运行上述代码，你应该会在控制台上看到字符串：\n\
  \n```\nHello, world!\n```\n\n输出到控制台。\n\n## kari - KeyAgreeRecipientInfo 的选择\n\n\n\
  \n\n当 `RecipientInfo` 基于密钥协商机制时（例如在 ways `Diffie-Hellman`、`MQV` 或 `Unified Diffie-Hellman`\
  \ 等算法时使用的），会选择 `kari` 值。\n\n以下方法展示了如何基于 EC 因子 Diffie-Hellman 添加一个接收者，其中约定的密钥为 256\
  \ 位的 AES 封装密钥：\n\n```\n 1   /**\n 2    * 向传入的 enveloped-data 生成器添加一个 KeyAgreeRecipientInfo。\n\
  \ 3    *\n 4    * @param envGen the generator to add the KeyAgreeRecipientInfo to.\n\
  \ 5    * @param initiatorKey the private key for the enveloped-data originator.\n\
  \ 6    * @param initiatorCert the public key certificate for the originator.\n 7\
  \    * @param recipientCert the public key certificate for the targeted recipient.\n\
  \ 8    */\n 9   public static void addKeyAgreeRecipient(\n10       CMSEnvelopedGenerator\
  \ envGen,\n11       PrivateKey initiatorKey, X509Certificate initiatorCert,\n12\
  \       X509Certificate recipientCert)\n13   throws GeneralSecurityException\n14\
  \   {\n15       envGen.addRecipientInfoGenerator(\n16           new JceKeyAgreeRecipientInfoGenerator(\n\
  17               CMSAlgorithm.ECCDH_SHA384KDF,\n18               initiatorKey,\n\
  19               initiatorCert.getPublicKey(),\n20               CMSAlgorithm.AES256_WRAP)\n\
  21               .addRecipient(recipientCert).setProvider(\"BC\"));\n22   }\n```\n\
  \n密钥协商案例与我们之前看到的密钥传输案例之间有两个主要区别。第一个是需要提供 `RecipientInfo` 创建者的公钥，且协商过程产生一个约定的值，而不是直接加密数据块。第二个是由于我们产生的是约定的值，还需要指定一个对称封装算法，以便使用该约定值来封装用于加密被封装数据的密钥。这种对约定值的二级使用值得赞赏，因为这意味着密钥协商接收者也可以出现在带有任何其他接收者的消息中。对于加密数据而言，每个人都需要恢复相同的密钥，只是用于封装密钥的机制不同。\n\
  \n我们可以从用于定义 `KeyAgreeRecipientInfo` 结构的 ASN.1 内容中看到这些差异是如何体现：\n\n```\nKeyAgreeRecipientInfo\
  \ ::= SEQUENCE {\n    version CMSVersion,  -- always set to 3\n    originator [0]\
  \ EXPLICIT OriginatorIdentifierOrKey,\n    ukm [1] EXPLICIT UserKeyingMaterial OPTIONAL,\n\
  \    keyEncryptionAlgorithm KeyEncryptionAlgorithmIdentifier,\n    recipientEncryptedKeys\
  \ RecipientEncryptedKeys }\n\nOriginatorIdentifierOrKey ::= CHOICE {\n    issuerAndSerialNumber\
  \ IssuerAndSerialNumber,\n    subjectKeyIdentifier [0] SubjectKeyIdentifier,\n \
  \   originatorKey [1] OriginatorPublicKey }\n\nOriginatorPublicKey ::= SEQUENCE\
  \ {\n    algorithm AlgorithmIdentifier,\n    publicKey BIT STRING }\n\nRecipientEncryptedKeys\
  \ ::= SEQUENCE OF RecipientEncryptedKey\n\nRecipientEncryptedKey ::= SEQUENCE {\n\
  \    rid KeyAgreeRecipientIdentifier,\n    encryptedKey EncryptedKey }\n\nKeyAgreeRecipientIdentifier\
  \ ::= CHOICE {\n    issuerAndSerialNumber IssuerAndSerialNumber,\n    rKeyId [0]\
  \ IMPLICIT RecipientKeyIdentifier }\n\nRecipientKeyIdentifier ::= SEQUENCE {\n \
  \   subjectKeyIdentifier SubjectKeyIdentifier,\n    date GeneralizedTime OPTIONAL,\n\
  \    other OtherKeyAttribute OPTIONAL }\n```\n\n`originator` 字段是一个 `CHOICE` 类型，这为接收者提供了几种恢复其所需的发送者公钥的方法，同时通过使用\
  \ `OriginatorPublicKey` 选择允许消息的实际发送者保持匿名。`ukm` 字段提供的数据可以确保在在使用静态密钥时，同一两个双方之间的任何两次密钥协商都不会生成相同的封装密钥。`keyEncryptionAlgorithm`\
  \ 字段描述了用于创建加密密钥的封装算法。最后，你可能会注意到 `KeyAgreeRecipientInfo` 中可以包含多个接收者密钥。Bouncy Castle\
  \ API 支持这一点，这也是为什么在 `JceKeyAgreeRecipientInfoGenerator` 中使用 `addRecipient()` 方法来传递接收者详情，而不是通过构造函数完成的原因。\n\
  \n在我们目前的示例中，我们只考虑一个接收者，因此以下代码片段就足够使用 `addKeyAgreeRecipient()` 方法了：\n\n```\n KeyPair\
  \ originatorEcKp = generateECKeyPair();\n      X509Certificate originatorEcCert\
  \ = converter.getCertificate(\n          createTrustAnchor(originatorEcKp, \"SHA256withECDSA\"\
  ));\n\n      KeyPair recipientEcKp = generateECKeyPair();\n      X509Certificate\
  \ recipientEcCert = converter.getCertificate(\n          createTrustAnchor(recipientEcKp,\
  \ \"SHA256withECDSA\"));\n\n      addKeyAgreeRecipient(envGen,\n               originatorEcKp.getPrivate(),\
  \ originatorEcCert, recipientEcCert);\n```\n\n如你看到的示例调用代码，与密钥传输的示例代码不同，它必须生成两个密钥对和两个证书，因为消息发送者的密钥对详情至关重要。这从两个角度考虑：一方面是发起者需要计算初始共享密钥，并由此计算出用于保护数据加密密钥的封装密钥；另一方面是接收者本身，因为他们需要发送者的公钥与自己的私钥结合，以进行自己的共享值计算。\n\
  \n另一方面，接收者用于恢复原始数据传递的参数与你在密钥传输案例中看到的相同：\n\n```\n /**\n   * 使用接收者参数从 EnvelopedData\n\
  \   * 结构中提取加密的原始数据。\n   *\n   * @param encvelopedData BER 编码的 EnvelopedData。\n \
  \  * @param recipientKey 接收者私钥（用于协商）。\n   * @param recipientCert 接收者对应的证书。\n   *\
  \ @return 封装的原始数据数组。\n   */\n  public static byte[] extractUsingKeyRecipient(\n\
  \      byte[] encEnvelopedData,\n      PrivateKey recipientKey, X509Certificate\
  \ recipientCert)\n  throws CMSException\n  {\n      CMSEnvelopedData envelopedData\
  \ = CMSEnvelopedData(encEnvelopedData);\n      RecipientInformationStore recipients\
  \ = envelopedData.getRecipientInfos();\n      RecipientId rid = new JceAgreeRecipientId(recipientCert);\n\
  \      RecipientInformation recipient = recipients.get(rid);\n\n      return recipient.getContent(\n\
  \          new JceAgreeEnvelopedRecipient(recipientKey).setProvider(\"BC\"));\n\
  \  }\n```\n\n大部分代码相同，只是使用了不同的 `RecipientId`（`JceAgreeRecipientId`）以及不同的接收者类型（`JceAgreeEnvelopedRecipient`）。\n\
  \n```\n byte[] keyAgreeRecovered = extractUsingKeyRecipient(\n          envEnc,\
  \ recipientEcKp.getPrivate(), recipientEcCert);\n\n      System.err.println(Strings.fromByteArray(keyAgreeRecovered));\n\
  ```\n\n假设你使用的是之前的测试消息并正确添加了 `KeyAgreeRecipientInfo`，运行上述代码你应该看到字符串：\n\n```\nHello,\
  \ world!\n```\n\n你也可以尝试将此示例与之前的密钥传输示例相结合，你会发现这两种机制可以很方便地在同一个 `EnvelopedData` 结构中使用。\n\
  \n### kekri - KEKRecipientInfo 选择\n\n当 `RecipientInfo` 基于对称密钥加密密钥（KEK）机制（例如 AES\
  \ KWP）时，会选择 `kekri` 值。\n\nKEK 接收使用以下 ASN.1 定义：\n\n```\nKEKRecipientInfo ::= SEQUENCE\
  \ {\n    version CMSVersion,  -- always set to 4\n    kekid KEKIdentifier,\n   \
  \ keyEncryptionAlgorithm KeyEncryptionAlgorithmIdentifier,\n    encryptedKey EncryptedKey\
  \ }\n\nKEKIdentifier ::= SEQUENCE {\n    keyIdentifier OCTET STRING,\n    date GeneralizedTime\
  \ OPTIONAL,\n    other OtherKeyAttribute OPTIONAL }\n```\n\n\n\n此 `RecipientInfo`\
  \ 比密钥协商版本要简单得多，并且与 `KeyTransRecipientInfo` 的定义方式有更多共同点——这并不意外，因为 `KEK` 只是一个对称封装操作，而不是非对称操作。通常，`KEKIdentifier`\
  \ 仅由一个 `OCTET STRING` 组成，我们在后文的方法中添加 `KEK` 接收者也是这种这种。`RFC 5652` 出于操作性考虑，建议不要使用 `OtherKeyAttribute`。\n\
  \n以下是一个添加 KEK 接收者生成器的方法：\n\n```\n 1   /**\n 2    * 将 KEKRecipientInfo 添加到传入的封装数据（enveloped-data）生成器中。\n\
  \ 3    *\n 4    * @param envGen 要添加 KEKRecipientInfo 的生成器。\n 5    * @param keyID\
  \ 用于匹配接收者的存储 keyID。\n 6    * @param wrappingKey 与 keyID 对应的封装密钥。\n 7    */\n 8 \
  \  public static void addKEKRecipient(\n 9       CMSEnvelopedGenerator envGen,\n\
  10       byte[] keyID, SecretKey wrappingKey)\n11   {\n12       envGen.addRecipientInfoGenerator(\n\
  13           new JceKEKRecipientInfoGenerator(keyID, wrappingKey)\n14          \
  \     .setProvider(\"BC\"));\n15   }\n```\n\n为了使用该方法，我们需要代码来提供密钥标识符以及我们希望用于封装的对称密钥。`RecipientInfo`\
  \ 生成器将选择一个适用于传入对称密钥的标准密钥封装算法。例如在在用例中：\n\n```\n byte[] keyID = Strings.toByteArray(\"\
  KeyID\");\n      SecretKey wrappingKey = new SecretKeySpec(\n                  \
  \    Hex.decode(\"000102030405060708090a0b0c0d0e0f\"), \"AES\");\n      addKEKRecipient(envGen,\
  \ keyID, wrappingKey);\n```\n\n密钥封装算法将是 `AES KW`。\n\n由于 `EnvelopedData` 中的 `RecipientInfo`\
  \ 带有密钥标识符，提取原始数据只需要提供正确的密钥标识符以定位正确的 `RecipientInfo`，并提供正确的对称密钥来执行检索原始数据所需的解封装（key\
  \ unwrap）操作。\n\n以下提供了一个使用 `KEK` 密钥及其密钥标识符提取提取的示例。查看代码你会发现，虽然它没有使用公钥/私钥，但该方法仍然遵循我们为其他接收者类型建立的模式。\n\
  \n```\n /**\n   * 使用匹配传入参数的接收者，从 EnvelopedData\n   * 结构中提取加密的原始数据。\n   *\n   * @param\
  \ encEnvelopedData BER 编码的 EnvelopedData 结构。\n   * @param keyID 匹配接收者的 keyID。\n\
  \   * @param wrappingKey 与 keyID 对应的封装密钥。\n   * @return 封装为 byte[] 的原始数据。\n   */\n\
  \  public static byte[] extractUsingKEKRecipient(\n      byte[] encEnvelopedData,\n\
  \      byte[] keyID, SecretKey wrappingKey)\n      throws CMSException\n  {\n  \
  \    CMSEnvelopedData envelopedData = new CMSEnvelopedData(encEnvelopedData);\n\
  \      RecipientInformationStore recipients = envelopedData.getRecipientInfos();\n\
  \      RecipientId rid = new KEKRecipientId(keyID);\n      RecipientInformation\
  \ recipient = recipients.get(rid);\n\n      return recipient.getContent(\n     \
  \     new JceKEKEnvelopedRecipient(wrappingKey)\n              .setProvider(\"BC\"\
  ));\n  }\n```\n\n最后的片段仅展示了如何调用提取方法。\n\n```\n byte[] kekRecovered = extractUsingKEKRecipient(envEnc,\
  \ keyID, wrappingKey);\n\n      System.err.println(Strings.fromByteArray(kekRecovered));\n\
  ```\n\n运行时，它应该再次显示“Hello, world!”消息。\n\n本节的示例代码也可以与之前的示例结合，你会发现我们到为止讨论的所有接收者类型都可以组合在单个消息中。\n\
  \n### pwri - 密码 RecipientInfo 的选择\n\n当 `RecipientInfo` 基于 PBE（密码保护加密）的密钥封装机制时，会选择\
  \ `pwri` 值。\n\n此 `RecipientInfo` 与用于 `KEK` 的那个区别在于，它携带的是密钥派生算法而不是密钥标识符。`PasswordRecipientInfo`\
  \ 的 `ASN.1` 定义如下：\n\n```\nPasswordRecipientInfo ::= SEQUENCE {\n    version CMSVersion,\
  \   -- 始终设置为 0\n    keyDerivationAlgorithm [0] KeyDerivationAlgorithmIdentifier\
  \ OPTIONAL,\n    keyEncryptionAlgorithm KeyEncryptionAlgorithmIdentifier,\n    encryptedKey\
  \ EncryptedKey }\n```\n\n以下方法展示了如何向生成器添加基于密码的 RecipientInfo：\n\n```\n 1   /**\n\
  \ 2    * 将 PasswordRecipientInfo 添加到传入的封装数据（enveloped-data）生成器中。\n 3    *\n 4  \
  \  * @param envGen 要添加 PasswordRecipientInfo 的生成器。\n 5    * @param passwd 用作 PBE\
  \ 密钥基础的密码。\n 6    * @param salt 用于生成 PBE 密钥的盐值（salt）。\n 7    * @param iterationCount\
  \ 用于生成 PBE 密钥的迭代次数。\n 8    */\n 9   public static void addPasswordRecipient(\n10\
  \       CMSEnvelopedGenerator envGen,\n11       char[] passwd,\n12       byte[]\
  \ salt,\n13       int iterationCount)\n14   {\n15       envGen.addRecipientInfoGenerator(\n\
  16           new JceRecipientInfoGenerator(CMSAlgorithm.AES256_CBC, passwd)\n17\
  \               .setProvider(\"BC\")\n18               .setPasswordScheme(PasswordRecipient.PKCS5_SCHEME_UTF8)\n\
  19               .setPRF(PasswordRecipient.HmacSHA8)\n20               .setSaltAndIterationCount(salt,\
  \ iterationCount));\n21   }\n```\n\n使用的 PBE 方案最初在 `RFC 3211` 中推荐，也称为 `PBKDF2`。从\
  \ `ASN.1` 和示例可以看出，接收者可以用来识别以选择处理的接收者的标识符是 `pwri`。这个问题并不意味着在单个 EnvelopedData 消息中不能有多个基于\
  \ PBE 的 RecipientInfo，但意味着检查接收者的唯一方法是解密存储在 `RecipientInfo` 结构中的密钥。\n\n你可以使用以下代码调用\
  \ `addPasswordRecipient()` 方法：\n\n```\n char[] passwd = \"password\".toCharArray();\n\
  \n      addPasswordRecipient(envGen, passwd, Strings.toByteArray(\"Salt\"), 2048);\n\
  ```\n\n\n\n\n```\n byte[] passwordRecovered = extractUsingPasswordRecipient(envEnc,\
  \ passwd);\n\n      System.err.println(Strings.fromByteArray(passwordRecovered));\n\
  ```\n\n和之前一样，假设使用相同的样本数据，如果一切顺利，你将看到“Hello, world!”。\n\n### 使用流式模型\n\n对于非常大的数据块\
  \ `EnvelopedData`，例如 `SignedData`，也可以流式模型进行创建和处理。如果你计划使用流式模型，则需要使用 `CMSEnvelopedStreamGenerator`\
  \ 类，可以通过以下方式创建它：\n\n```\n CMSEnvelopedDataStreamGenerator envStreamGen =\n     \
  \                                    new CMSEnvelopedDataStreamGenerator();\n```\n\
  \n向 `CMSEnvelopedStreamGenerator` 添加接收者生成器与向 `CMSEnvelopedDataGenerator` 添加相同，这两个类都继承自\
  \ `CMSEnvelopedGenerator`，你可能已经注意到 `CMSEnvelopedGenerator` 是所有添加接收者方法中使用的类。由于事实是如此，虽然我们下面只查看\
  \ `KeyTransRecipientInfo` 的用法，但相同的规则也适用于我们看过的其他 `RecipientInfo` 类型。\n\n如你在下面的代码片段所示，`addKeyTransRecipient()`\
  \ 方法的使用方式与之前相同，但待加密数据添加到 `EnvelopedData` 结构的方式不同。\n\n```\n 1       addKeyTransRecipient(envStreamGen,\
  \ recipientRsaCert);\n 2 \n 3       ByteArrayOutputStream bOut = new ByteArrayOutputStream();\n\
  \ 4       OutputStream out = envStreamGen.open(\n 5           bOut,\n 6        \
  \   new JceCMSContentEncryptorBuilder(CMSAlgorithm.AES256_CBC)\n 7             \
  \  .setProvider(\"BC\")\n 8               .build());\n 9 \n10       out.write(msg);\n\
  11 \n12       out.close();\n13 \n14       envEnc = bOut.toByteArray();\n```\n\n\
  在添加数据方面，关键代码是调用 `envStream.open()`。传递给 `open()` 方法的 `OutputStream` 最终是 `EnvelopedData`\
  \ 结构编码的地方。在示例中，我们使用了 `ByteArrayOutputStream`，因此我们可以在片段末尾通过调用 `bOut.toByteArray()`\
  \ 获取 `EnvelopedData` 的编码。\n\n注意：我们只在调用 `out.close()` 之后调用 `bOut.toByteArray()` ——\
  \ 关闭 `open()` 返回的 `OutputStream` 可确保 `EnvelopedData` 编码被正确结束。\n\n提取方法看起来与我们之前看到的使用\
  \ `KeyTransInfo` 接收者时提取加密数据的等效方法非常相似。我们使用 `CMSEnvelopedDataParser` 而不是内存中的 `CMSEnvelopedData`\
  \ 对象来读取 `EnvelopedData`，如下：\n\n```\n 1   /**\n 2    * 从 EnvelopedData 结构中提取加密的原始数据\n\
  \ 3    * 使用与传入参数匹配的接收者以及\n 4    * CMS 流式模型。\n 5    *\n 6    * @param encEnvelopedData\
  \ BER 编码的 EnvelopedData 结构。\n 7    * @param privateKey 接收者私钥（用于密钥传输）。\n 8    * @param\
  \ encryptionCert 接收者对应的公钥证书。\n 9    * @return 封装为 byte[] 的原始数据。\n10    */\n11  \
  \ public static CMSTypedStream streamExtractUsingKeyTransRecipient(\n12       byte[]\
  \ encEnvelopedData,\n13       PrivateKey privateKey, X509Certificate encryptionCert)\n\
  14       throws CMSException, IOException\n15   {\n16       CMSEnvelopedDataParser\
  \ envelopedData\n17                                = new CMSEnvelopedDataParser(encEnvelopedData);\n\
  18       RecipientInformationStore recipients = envelopedData.getRecipientInfos();\n\
  19       RecipientInformation recipient = recipients.get(\n20                  \
  \                 new JceKeyTransRecipientId(encryptionCert));\n21 \n22       if\
  \ (recipient != null)\n23       {\n24           return recipient.getContentStream(\n\
  25                   new JceKeyTransEnvelopedRecipient(privateKey)\n26         \
  \              .setProvider(\"BC\"));\n27       }\n28 \n29       throw new IllegalArgumentException(\"\
  recipient for certificate not found\");\n30   }\n```\n\n虽然我们在示例方法中使用了 `getContentStream()`\
  \ 方法，但实际上我们也可以像之前那样使用 `getContent()`。在这种情况下，我们没有这样做是为了保留处理包含比 JVM 内存能容纳的更多数据的结构所需的条件。使用\
  \ `getContentStream()` 确实改变了我们习惯的方法返回类型，并且如果我们要成功生成“Hello, world!”字符串，就需要以稍微不同的方式进行处理。使用\
  \ `getContentStream()` 时需要以下代码：\n\n```\n CMSTypedStream cmsContent = streamExtractUsingKeyTransRecipient(\n\
  \          envEnc, recipientRsaKp.getPrivate(), recipientRsaCert);\n\n      System.err.println(Strings.fromByteArray(\n\
  \                             Streams.readAll(cmsContent.getContentStream())));\n\
  ```\n\n注意，如果我们继续使用 `getContent()`，`RecipientInformation` 对象将执行与我们在上面代码片段中相同的操作。还要注意，在流式模型中，由于\
  \ `unprotectedAttrs` 字段位于加密内容之后，如果你使用流式模型，则需要完全读取内容或预先排空流。\n\n### S/MIME\n\nSecure\
  \ MIME（或 S/MIME）提供了安全发送 MIME 数据的方法，并考虑了在不同 MIME 类型之间可能发生的传输问题。Bouncy Castle 中用于\
  \ S/MIME 的当前 API 基于 RFC5751，该标准描述了 S/MIME 3.2 版本并于 2010 年发布。S/MIME 最常用于创建签名和/或加密邮件，你很有可能已经在收件箱中见过\
  \ S/MIME 创建的消息了。S/MIME 的密码学部分基于加密消息语法（Cryptographic Message Syntax），即我们刚刚查看的协议。\n\
  \nBouncy Castle 现在有两个处理 S/MIME 的 API：一个是利用 JavaMail 的原始 API，另一个是较新的 API，它可以直接解析\
  \ MIME 文件而不需要 JavaMail。这两个 API 都有其用处，因此我们将查看各自的示例。如果你打算使用 JavaMail 版本（位于 Bouncy\
  \ 分发包中的 `bcmail-*` jar 文件），熟悉 JavaMail 也会有帮助。虽然你可以在不熟悉 JavaMail 的情况下让示例运行，但对 JavaMail\
  \ API 的知识将使你能够更有效地应用和修改这里的示例。\n\n#### S/MIME 签名消息\n\nS/MIME 中的签名消息有两种格式。`multipart/signed`\
  \ 消息是 S/MIME 签名最常用的格式。消息由两部分组成：第一部分是签名内容，第二部分是分离签名，它提供了 `SignerInfo` 结构，用于验证第一部分数据的完整性。\n\
  \nS/MIME 也支持封装的签名数据，它出现在单个正文部分。这种格式很少使用，因为它导致无法读取签名数据。封装消息的 MIME 类型为 `application/pkcs7-signature`（在某些情况下为\
  \ `application/x-pkcs7-signature`），以 CMS 的原始标准 PKCS#7 命名。如果你遇到这种消息，你会发现消息只是一个 ASN.1\
  \ 块，通常使用 Base64 编码，以避免在可能无法处理的邮件网关上传输二进制数据时出现问题。\n\n\n\n\n虽然 Bouncy Castle API 支持这两种签名消息类型，但在这里我们只查看最常见的\
  \ `multipart/signed`。这是一个值得关注的内容，因为它通常需要对文本数据进行规范化（canonicalization），无论是用于创建签名还是验证签名。我们之所以说通常，是因为普通的\
  \ S/MIME 由于默认传输编码是 7 位而需要规范化，但 AS2 等标准的默认传输编码是二进制，因此并不总是需要规范化。\n\n规范化过程因媒体类型而异，大多数情况下只有一种形式，但如果你处理的是特殊的媒体类型，最好检查是否应用了规范化过程。对于我们的目的而言，最需要注意的是主要媒体类型为\
  \ `text` 的实体。对于像 `text/plain` 类型的数据，文件中的行尾必须全部是 `\\r\\n` 格式，且使用的字符集应该是 IANA“字符集”文档中列出的标准\
  \ IANA 字符之一 [52]。\n\n除了规范化之外，某些邮件网关仍然会对 MIME 消息进行其他奇怪且意料之外的操作。如果你发现签名在明明看起来可以工作的情况下却不断失败（例如，你已经考虑了规范化），其他需要寻找的“趣味”点包括删除行末最后一个非空字符与行尾字符之间的空白符，以及用同一特殊字符的不同编码来替换特殊字符——这可能发生在字符集对同一字符支持多种编码的情况下。在这样的情况下，你会发现你可能需要自己拟定一些规范化规则。\n\
  \n在开始示例之前，我们需要设置一些密钥和一条示例消息。\n\n以下是我们的示例消息的定义：\n\n```\nbyte[] bodyPart = Strings.toByteArray(\n\
  \             \"Content-Type: text/plain; name=null; charset=us-ascii\\r\\n\" +\n\
  \                 \"Content-Transfer-Encoding: 7bit\\r\\n\" +\n                \
  \ \"Content-Disposition: inline; filename=test.txt\\r\\n\" +\n                 \"\
  \\r\\n\" +\n                 \"Hello, world!\\r\\n\");\n```\n\n该消息已经是规范化格式，全处使用\
  \ `\\r\\n` 作为行尾。\n\n意不意外的是，由于我们从根本上是在做 CMS，密钥和证书的设置与之前完全相同：\n\n```\nKeyPair selfSignedKp\
  \ = generateECKeyPair();\n      X509CertificateHolder selfSignedCert =\n       \
  \   createTrustAnchor(selfSignedKp, \"SHA256withECDSA\");\n```\n\n最后，我们将添加的另一部分代码与\
  \ S/MIME 的另一个功能有关——S/MIME 能力（S/MIME capabilities）。这是一个可以包含在与签名数据分离签名相关的 SignerInfo\
  \ 属性中的额外属性。\n\n与 S/MIME 能力属性相关的 ASN.1 定义如下：\n\n```\nsmimeCapabilities OBJECT IDENTIFIER\
  \ ::= {iso(1) member-body(2)\n           us(840) rsadsi(113549) pkcs(1) pkcs-9(9)\
  \ 15}\n\n   SMIMECapability ::= SEQUENCE {\n      capabilityID OBJECT IDENTIFIER,\n\
  \      parameters ANY DEFINED BY capabilityID OPTIONAL }\n\n   SMIMECapabilities\
  \ ::= SEQUENCE OF SMIMECapability\n```\n\n如你所见，属性值只是一个 `SMIMECapability` 序列。Bouncy\
  \ Castle API 提供了 `SMIMECapabilityVector` 和 `SMIMECapability` 类来简化能力的生成和处理。在这种情况下，我们可以像所示编写一个简单的方法来添加一些能力：\n\
  \n```\n /**\n   * 基础方法，为任何响应我们消息的人提供一些 S/MIME 能力属性。\n   *\n   * @return 带有额外属性的\
  \ AttributeTable。\n   */\n  public static AttributeTable generateSMIMECapabilities()\n\
  \  {\n      ASN1EncodableVector signedAttrs = new ASN1EncodableVector();\n\n   \
  \   SMIMECapabilityVector caps = new SMIMECapabilityVector();\n      caps.addCapability(SMIMECapability.aES128_CBC);\n\
  \      caps.addCapability(SMIMECapability.aES192_CBC);\n      caps.addCapability(SMIMECapability.aES256_CBC);\n\
  \      caps.addCapability(SMIMECapability.preferSignedData);\n\n      signedAttrs.add(new\
  \ SMIMECapabilitiesAttribute(caps));\n\n      return new AttributeTable(signedAttrs);\n\
  \  }\n```\n\n这些能力用于告诉消息的接收者我们在希望他们如何响应我们方面的偏好。在上面的示例代码中，我们信号表明处理使用 AES CBC 模式加密的各种密钥大小的消息，并且我们也倾向于在响应中使用签名消息。你将在示例中看到，此方法返回的\
  \ `AttributeTable` 被添加到我们的 `SignerInfoGeneratorBuilder` 中，以便 S/MIME 能力的额外属性被包含在作为签名过程中生成的\
  \ SignerInfo 结构中。\n\n现在我们有了一些测试数据和一个带有证书的密钥可以使用，现在可以尝试生成一些 `multipart/signed` 文档了。我们将首先查看新的非\
  \ JavaMail API。\n\n### 使用 PKIX S/MIME API 使用 Multipart/signed\n\nPKIX S/MIME API\
  \ 是构建在 CMS 流式 API 之上的流式 API。\n\n使用 PKIX S/MIME API 创建 `multipart/signed` 是分两个部分的：第一部分是配置一个适用于写入内容的\
  \ `SMIMignedWriter.Builder`，第二部分是使用 `SMIMignedWriter` 生成签名数据和分离签名。\n\n请看以下创建 multipart/signed\
  \ 的示例代码：\n\n```\n   /**\n   * 为主体部分创建 multipart/signed。\n   *\n   * @param signingKey\
  \ 用于签名的私钥。\n   * @param signingCert 与签名关联的公钥证书。\n   * @param message 代表待签名主体部分的字节数组。\n\
  \   * @return 包含 multipart/signed 的字节数组。\n   */\n  public static byte[] createSignedMultipart(\n\
  \      PrivateKey signingKey,\n      X509CertificateHolder signingCert,\n      byte[]\
  \ message)\n      throws OperatorCreationException, CMSException, IOException\n\
  \   {\n      ByteArrayOutputStream bOut = new ByteArrayOutputStream();\n      SMIMESignedWriter.Builder\
  \ sigBldr = new SMIMESignedWriter.Builder();\n\n      sigBldr.addCertificate(signingCert);\n\
  \n      sigBldr.addSignerInfo(\n          new JcaSignerInfoGeneratorBuilder()\n\
  \                    .setProvider(\"BC\")\n                    .setSignedAttributeGenerator(generateSMIMECapabilities())\n\
  \                    .build(\"SHA256withECDSA\", signingKey, signingCert));\n\n\
  \      SMIMESignedWriter sigWrt = sigBldr.build(bOut);\n\n      OutputStream out\
  \ = sigWrt.getContentStream();\n\n      out.write(message);\n\n      out.close();\n\
  \n      return bOut.toByteArray();\n   }\n```\n\n\n\n\n这是一个示例验证器。它会解析 `multipart/signed`\
  \ 消息，当遇到包含内容的部分时，将签名部分的内容写入传入的流中；当遇到分离的签名（detached signature）部分时，检查之前找到的数据签名状态。\n\
  \n```\n 1   /**\n 2    * 验证与 signerCert 关联的 signerInfo，在此过程中将内容写入\n 3    * contentStream。\n\
  \ 4    *\n 5    * @param multiPart 包含待检查的签名 multipart 的输入流。\n 6    * @param signerCert\
  \ 与私钥关联的证书，该私钥对内容进行了签名。\n 7    * @param contentStream @param contentStream 接收签名内容的输出流。\n\
  \ 9    * @return 如果签名 multipart 通过 signerCert 验证则返回 true，否则返回 false。\n10    */\n\
  11   public static boolean verifySignedMultipart(\n12       InputStream multiPart,\n\
  13       X509CertificateHolder signerCert,\n14       OutputStream contentStream)\n\
  15       throws IOException\n16   {\n17       AtomicBoolean isVerified = new AtomicBoolean(false);\n\
  18 \n19       MimeParserProvider provider = new SMimeParserProvider(\"7bit\",\n\
  20                                             new BcDigestCalculatorProvider());\n\
  21 \n22       MimeParser parser = provider.createParser(multiPart);\n23 \n24   \
  \    parser.parse(new SMimeParserListener()\n25       {\n26           public void\
  \ content(\n27               MimeParserContext parserContext,\n28              \
  \ Headers headers,\n29               InputStream inputStream)\n30              \
  \ throws IOException\n31           {\n32               byte[] content = Streams.readAll(inputStream);\n\
  33 \n34               contentStream.write(content);\n35           }\n36 \n37   \
  \        public void signedData(\n38               MimeParserContext parserContext,\n\
  39               Headers headers,\n40               Store certificates, Store CRLs,\
  \ Store attributeCertificates,\n41               SignerInformationStore signers)\n\
  42               throws CMSException\n43           {\n44               SignerInformation\
  \ signerInfo = signers.get(\n45                   new SignerId(\n46            \
  \               signerCert.getIssuer(), signerCert.getSerialNumber()));\n46 \n47\
  \               try\n48               {\n49                   isVerified.set(signerInfo.verify(\n\
  50                       new JcaSimpleSignerInfoVerifierBuilder()\n51          \
  \                    .setProvider(\"BC\").build(signerCert)));\n52             \
  \  }\n53               catch (Exception e)\n54               {\n55             \
  \      throw new CMSException(\n56                       \"unable to process signerInfo:\
  \ \" + e.getMessage(), e);\n57               }\n58           }\n59       });\n60\
  \ \n61       return isVerified.get();\n62   }\n```\n\n在此请注意，在这种情况下，`SignedData`\
  \ 结构在传递给 `signedData()` 方法之前已经过解构。与之前不同，之前我们是从完整的 `CMS` SignedData 结构开始，并且手动处理其组件。另一个区别是，我们已经有了签名证书，因此只需找到与使用证书创建的\
  \ `SignerId` 匹配的 `SignerInfo` 即可。\n\n这段最后的示例代码展示了如何使用我们之前定义的示例主体部分，以及之前生成的私钥和证书，来运行这两个方法。\n\
  \n```\n byte[] data = createSignedMultipart(\n                       selfSignedKp.getPrivate(),\
  \ selfSignedCert, bodyPart);\n\n      ByteArrayOutputStream contentStream = new\
  \ ByteArrayOutputStream();\n\n      System.out.println(\"verified: \"+ verifySignedMultipart(\n\
  \                     new ByteArrayInputStream(data), selfSignedCert, contentStream));\n\
  \      System.out.println(Strings.fromByteArray(contentStream.toByteArray()));\n\
  ```\n\n假设一切顺利，代码应该产生以下输出：\n\n```\nverified: true\nHello, world!\n```\n\n这表明签名已成功验证，且\
  \ `text/plain` 主体部分的内容也成功恢复。\n\n### 使用 Mail S/MIME API 使用 Multipart/signed\n\nMail\
  \ S/MIME API 同样遵循流模型，但在这种情况下，解析是由 JavaMail API 处理的，“单元”消息类型是 `MimeBodyPart` 类。\n\
  \n以下是一个基于 Mail S/MIME API 创建 multipart/signed 的示例方法。\n\n```\n 1   /**\n 2    * 为消息中的主体部分创建\
  \ multipart/signed。\n 3    *\n 4    * @param signingKey 用于生成签名的私钥。\n 5    * @param\
  \ signingCert 与签名密钥关联的公钥证书。\n 6    * @param message 要签名的主体部分。\n 7    * @return 类型为\
  \ multipart/signed MIME 对象的 MimeMultipart。\n 8    */\n 9   public static MimeMultipart\
  \ createSignedMultipart(\n10       PrivateKey signingKey,\n11       X509CertificateHolder\
  \ signingCert,\n12       MimeBodyPart message)\n13       throws OperatorCreationException,\
  \ SMIMEException\n14   {\n15       List<X509CertificateHolder> certList = new ArrayList<>();\n\
  16       certList.add(signingCert);\n17       Store<X509CertificateHolder> certs\
  \ = new CollectionStore<>(certList);\n18 \n19       SMIMESignedGenerator gen = new\
  \ SMIMESignedGenerator();\n20       gen.addSignerInfoGenerator(\n21           new\
  \ JcaSimpleSignerInfoGeneratorBuilder()\n22               .setProvider(\"BC\")\n\
  23               .setAlgorithm(\"SHA256withECDSA\")\n24               .setAttributes(null)\n\
  25               .build(signingKey, signingCert));\n26       gen.addCertificates(certs);\n\
  27       return gen.generate(message);\n28   }\n```\n\n你可以看到，它看起来与之前的差不多。对于验证情况，解决方案与我们之前看到的\
  \ S/IME 示例非常相似，很大程度上是因为 JavaMail 处理主体部分的方式。以下方法将验证 `MimeMultipart`。\n\n```\n 1 \
  \  /**\n 2    * 验证包含 multipart/signed 的 MimeMultipart。\n 3    *\n 4    * @param\
  \ signedMessage multipart/signed。\n 5    * @param signerCert signedMessage 签名者之一的证书。\n\
  \ 6    * @return 如果 multipart/signed 通过 signerCert 验证则返回 true，否则返回 false。\n 7  \
  \  */\n 8   public static boolean verifySignedMultipart(\n 9       MimeMultipart\
  \ signedMessage,\n10      X509CertificateHolder signerCert)\n11      throws GeneralSecurityException,\
  \ OperatorCreationException,\n12               CMSException, MessagingException\n\
  13   {\n14       SMIMESigned signedData = new SMIMESigned(signedMessage);\n15 \n\
  16       SignerInformationStore signers = signedData.getSignerInfos();\n17 \n18\
  \       SignerInformation signer = signers.get(\n19           new SignerId(signerCert.getIssuer(),\n\
  20                            signerCert.getSerialNumber()));\n21 \n22       return\
  \ signer.verify(new JcaSimpleSignerInfoVerifierBuilder()\n23                   \
  \           .setProvider(\"BC\").build(signerCert));\n24   }\n```\n\n以下示例代码，允许你将这两个方法结合起来：\n\
  \n```\n MimeMultipart signedMM = createSignedMultipart(selfSignedKp.getPrivate(),\n\
  \          selfSignedCert, new MimeBodyPart(new ByteArrayInputStream(bodyPart)));\n\
  \n      System.out.println(\"verified: \"+ verifySignedMultipart(\n            \
  \         signedMM, selfSignedCert));\n      System.out.println(signedMM.getBodyPart(0).getContent());\n\
  ```\n\n\n\n\n同时也显示 `signerCert` 的 `SignerInfo` 验证正确，且已签名主体部分的内容已恢复。\n\n## S/MIME\
  \ 封装消息 (Enveloped Messages)\n\nS/MIME 封装消息始终将消息作为封装数据传输，并具有 MIME 类型为 `application/pkcs7-mime`\
  \ 或较旧的 `application/x-pkcs7-mime`。S/MIME 消息本身的内容只是一个持有 `CMS EnvelopedData` 结构的 `ContentInfo`\
  \ 编码。\n\nS/MIME 封装消息可以使用任何 CMS 封装接收者类型。为了简洁起见，我们在这里只看一个示例，但如果你查看 CMS 章节中列出的针对不同接收者的指令，你会发现对\
  \ S/MIME 封装接收者也可以同样的操作。\n\n### 使用 PKIX S/MIME API 创建封装消息\n\n使用 PKIX S/MIME API 创建\
  \ S/MIME 封装消息与创建签名消息类似。第一步是配置 `SMIMEEnvelopedWriter.Builder`，指定能够解密消息的接收者；第二步是使用该构建器创建一个\
  \ `SMIMEEnvelopedWriter`，然后通过向其输入内容来输出 S/MIME 封装消息。\n\n以下示例方法展示了如何使用 RSA OAEP 进行密钥传输、AES-256\
  \ CBC 模式进行消息加密来创建 S/MIME 封装消息。\n\n```\n 1   /**\n 2    * 为消息中的主体部分创建 application/pkcs7-mime。\n\
  \ 3    *\n 4    * @param encryptionCert 与预期接收者相关的公钥证书。\n 5    * @param message 代表要加密主体部分的\
  \ byte[]。\n 6    * @return 包含 application/pkcs7-mime MIME 对象的 byte[]。\n 8    */\n\
  \ 9   public static byte[] createEnveloped(\n10       X509Certificate encryptionCert,\n\
  11       byte[] message)\n12       throws GeneralSecurityException, CMSException,\
  \ IOException\n13   {\n14       ByteArrayOutputStream bOut = new ByteArrayOutputStream();\n\
  15       SMIMEEnvelopedWriter.Builder envBldr = new SMIMEEnvelopedWriter.Builder();\n\
  16 \n17       JcaAlgorithmParametersConverter paramsConverter =\n18            \
  \                               new JcaAlgorithmParametersConverter();\n19 \n20\
  \       AlgorithmIdentifier oaepParams = paramsConverter.getAlgorithmIdentifier(\n\
  21           PKCSObjectIdentifiers.id_RSAES_OAEP,\n22           new OAEPParameterSpec(\"\
  SHA-256\",\n23               \"MGF1\", new MGF1ParameterSpec(\"SHA-256\"),\n24 \
  \              PSource.PSpecified.DEFAULT));\n25 \n26       envBldr.addRecipientInfoGenerator(\n\
  27           new JceKeyTransRecipientInfoGenerator(\n28               encryptionCert,\
  \ oaepParams).setProvider(\"BC\"));\n29 \n30       SMIMEEnvelopedWriter sigWrt =\
  \ envBldr.build(bOut,\n31                   new JceCMSContentEncryptorBuilder(CMSAlgorithm.AES256_CBC)\n\
  32                       .setProvider(\"BC\")\n33                       .build());\n\
  34 \n35       OutputStream out = sigWrt.getContentStream();\n35 \n37       out.write(message);\n\
  38 \n39       out.close();\n41 \n41       return bOut.toByteArray();\n42   }\n```\n\
  \n如果你回看 CMS 中的示例（位于“ktri - the KeyTransRecipientInfo Choice”章节中），你会发现接收者生成器的设置是完全相同的。\n\
  \n消息的解密遵循我们在签名验证中看到的监听器模型。我们为消息设置一个解析器，并提供一个监听器，当遇到我们正在寻找的 MIME 类型时会被调用。在封装数据的情况下，回调还会为我们提供消息的发送者信息和接收者。我们使用这些信息来提取数据。\n\
  \n以下示例方法展示了在假设相应接收者到位的情况下，如何从 S/MIME 封装消息中恢复正文。\n\n```\n 1   /**\n 2    * 解密 application/pkcs7-mime\
  \ 消息中的加密内容，在处理过程中将\n 3    * 内容写入 contentStream。\n 4    *\n 5    * @param encryptedPart\
  \ 包含待检查封装部分的输入流。\n 6    * @param recipientCert 与私钥相关的证书，该内容是为该私钥\n 7    *      \
  \                加密的。\n 8    * @param recipientKey 用于解密内容的私钥。\n 9    * @param contentStream\
  \ 用于接收解密内容的输出流。\n10    */\n 11   public static void decryptEnveloped(\n12      \
  \ InputStream encryptedPart,\n13       X509Certificate recipientCert,\n14      \
  \ PrivateKey recipientKey,\n15       OutputStream contentStream)\n16       throws\
  \ IOException\n17   {\n18       MimeParserProvider provider = new SMimeParserProvider(\"\
  7bit\",\n19                                              new BcDigestCalculatorProvider());\n\
  20 \n21       MimeParser parser = provider.createParser(encryptedPart);\n22 \n23\
  \       parser.parse(new SMimeParserListener()\n24       {\n25           public\
  \ void envelopedData(\n26               MimeParserContext parserContext,\n27   \
  \            Headers headers,\n28               OriginatorInformation originator,\n\
  29               RecipientStore recipients)\n30               throws IOException\n\
  31           {\n32               RecipientInformation recipInfo = recipients.get(\n\
  33                           new JceKeyTransRecipient(recipientKey));\n34      \
  \         byte[] content = recipInfo.getContent();\n35               contentStream.write(content);\n\
  36           }\n37       });\n38   }\n```\n\n\n\n\n```\n 1   /**\n 2    * 从消息中的主体部分创建\
  \ application/pkcs7-mime。\n 3    *\n 4    * @param encryptionCert 与预期接收者相关的公钥证书。\n\
  \ 5    *                       intended recipient.\n 6    * @param message 表示要加密的主体部分的\
  \ byte[] 数组。\n 7    * @return 一个包含 application/pkcs7-mime MIME 对象的 MimeBodyPart。\n\
  \ 8    */\n 9   public static MimeBodyPart createEnveloped(\n10       X509Certificate\
  \ encryptionCert,\n11       MimeBodyPart message)\n12       throws GeneralSecurityException,\
  \ CMSException, SMIMEException\n13   {\n14       SMIMEEnvelopedGenerator envGen\
  \ = new SMIMEEnvelopedGenerator();\n15 \n16       JcaAlgorithmParametersConverter\
  \ paramsConverter =\n17                                       new JcaAlgorithmParametersConverter();\n\
  18 \n19       AlgorithmIdentifier oaepParams = paramsConverter.getAlgorithmIdentifier(\n\
  20           PKCSObjectIdentifiers.id_RSAES_OAEP,\n21           new OAEPParameterSpec(\"\
  SHA-256\",\n22               \"MGF1\", new MGF1ParameterSpec(\"SHA-256\"),\n23 \
  \              PSource.PSpecified.DEFAULT));\n24 \n25       envGen.addRecipientInfoGenerator(\n\
  26           new JceKeyTransRecipientInfoGenerator(\n27               encryptionCert,\
  \ oaepParams).setProvider(\"BC\"));\n28 \n29       return envGen.generate(message,\n\
  30                   new JceCMSContentEncryptorBuilder(CMSAlgorithm.AES256_CBC)\n\
  31                       .setProvider(\"BC\")\n32                       .build());\n\
  33   }\n```\n\n唯一的实质区别在于 `generate()` 方法，它接收 `message`（明文源对象），然后在内部将加密后的内容馈到 `MimeBodyPart`\
  \ 对象中，使得封装数据（Enveloped Data）可以供 JavaMail API 的其他部分使用。\n\n类似的工作模式也适用于 BC Mail API\
  \ 解密 S/MIME 封装消息，如下例示例方法所示。\n\n```\n 1   /**\n 2    * 从封装消息中提取 MIME 主体部分。\n 3  \
  \  *\n 4    * @param encryptedMessage 封装消息。\n 5    * @param recipientCert 与接收者密钥相关的证书。\n\
  \ 6    * @param recipientKey 用于恢复主体部分的私钥。\n 7    */\n 8   public static MimeBodyPart\
  \ decryptEnveloped(\n 9       MimeBodyPart encryptedMessage,\n10       X509Certificate\
  \ recipientCert,\n11       PrivateKey recipientKey)\n12       throws\n13       CMSException,\
  \ MessagingException, SMIMEException\n14   {\n15       SMIMEEnveloped envData =\
  \ new SMIMEEnveloped(encryptedMessage);\n16 \n17       RecipientInformationStore\
  \ recipients = envData.getRecipientInfos();\n18 \n19       RecipientInformation\
  \ recipient = recipients.get(\n20           new JceKeyTransRecipientId(recipientCert));\n\
  21 \n22       return SMIMEUtil.toMimeBodyPart(recipient.getContent(\n23        \
  \   new JceKeyTransEnvelopedRecipient(recipientKey).setProvider(\"BC\")));\n23 \
  \  }\n```\n\n注意，需要使用工具方法 `SMIMEUtil.toMimeBodyPart()`，因为 `RecipientInformation`\
  \ 类没有对 JavaMail 的直接支持。如果你只是感兴趣获取内容而不而不为 JavaMail 重新封装数据，则可以避免该调用。\n\n这种情况下的设置与 PKIX\
  \ S/MIME API 相同。当然，区别在于方法的调用，因为 JavaMail API 并不直接处理流（streams），而是要求你使用 JavaMail 预定义的类型来呈现\
  \ MIME 对象。\n\n你可以从以下调用方法的代码中看到这一点——我们需要将 `bodyPart` 封装在 `MimeBodyPart` 对象中以进行处理。\n\
  \n```\n MimeBodyPart signedMM = createEnveloped(\n          selfSignedCert, new\
  \ MimeBodyPart(new ByteArrayInputStream(bodyPart)));\n\n      BodyPart decPart =\
  \ decryptEnveloped(\n                            signedMM, selfSignedCert, selfSignedKp.getPrivate());\n\
  \n      System.out.println(decPart.getContent());\n```\n\n在示例案例中，我们做的另一个变化是使用 `getContent()`\
  \ 方法获取加密主体部分的内容以便输出。在这种情况下，当运行代码时，你将看到以下输出：\n\n```\nHello, world!\n```\n\n这表明加密的主体部分及其内容已成功恢复。\n\
  \n### 使用 JavaMail 的注意事项\n\n我们发现以下操作给人们引起了足够的问题，值得特别提及。\n\n#### 处理“multipart/mixed”内容\n\
  \n一个常见的困惑来源是如何处理 multipart/mixed 数据。在这种情况下，必须在将 multipart 内容传递给 S/MIME API 之前，将其封装在单个\
  \ `MimeBodyPart` 中。\n\n### 时间戳协议 (Time-Stamp Protocol)\n\n时间戳协议 (TSP) 最初定义在 RFC\
  \ 3161 [8] 中，随后在 RFC 5816 [107] 中进行了更新，允许使用 SHA-1 以外的消息摘要。其背后的基本概念是时间戳权威（TSA）发布加密安全的时间戳，以响应包含某些文档的时间戳请求。\n\
  \n#### 时间戳请求 (Time-Stamp Requests)\n\n时间戳请求由 3161 定义。`TimeStampReq` 的 ASN.1 定义如下：\n\
  \n```\nTimeStampReq ::= SEQUENCE  {\n    version               INTEGER  { v1(1)\
  \ },\n    messageImprint        MessageImprint,\n    reqPolicy             TSAPolicyId\
  \              OPTIONAL,\n    nonce                 INTEGER                  OPTIONAL,\n\
  \    certReq               BOOLEAN                  DEFAULT FALSE,\n    extensions\
  \            [0] IMPLICIT Extensions  OPTIONAL\n  }\n\nMessageImprint ::= SEQUENCE\
  \  {\n    hashAlgorithm         AlgorithmIdentifier,\n    hashedMessage        \
  \ OCTET STRING  }\n\nTSAPolicyId ::= OBJECT\n```\n\n你可以看到 `TimeStampReq` 的简单版本只包含版本号和\
  \ MessageIm。。示例方法使用 SHA-256（基于 5816）创建一个基础的时间戳请求：\n\n```\n 1   /**\n 2    * 为传入的\
  \ SHA-256 哈希创建一个简单的 TSP 请求。\n 3    *\n 4    * @param data 我们想要时间戳的数据。\n 5    * @return\
  \ 结果时间戳请求的 DER 编码。\n 6    */\n 7   public static byte[] createTspRequest(byte[]\
  \ data)\n 8       throws IOException, NoSuchAlgorithmException\n 9   {\n10     \
  \  MessageDigest digest = MessageDigest.getInstance(\"SHA-256\");\n11 \n12     \
  \  TimeStampRequestGenerator reqGen = new TimeStampRequestGenerator();\n13 \n14\
  \       return reqGen.generate(TSPAlgorithms.SHA256,\n15                       \
  \        digest.digest(data)).getEncoded();\n16   }\n```\n\n所有可选字段都用于为时间戳请求者提供额外信息。`reqPolicy`\
  \ 字段用于请求 TSA 发布配置了特定策略的时间戳响应；`nonce` 允许请求者匹配响应与特定的请求而不必担心重复^(19)；`certReq` 字段请求服务器包含其签名证书（可能还有其他证书）；最后，`extensions`\
  \ 字段可以添加扩展（如果已定义）。另一个需要注意的是，当扩展被标记为关键且服务器无法解释它时，服务器将拒绝请求。\n\n以下示例方法允许设置 `nonce`\
  \ 和 `certReq` 字段。\n\n\n\n\n\n```java\n   /**\n    * 为传入的 SHA-256 哈希值创建一个 TSP 请求，该请求\n\
  \    * 包含一个 nonce，并且可能包含证书请求。\n    *\n    * @param data 我们想要时间戳的数据。\n    * @param\
  \ nonce 与此请求关联的随机数。\n    * @param requestTsaCert 如果为 true，权威机构应返回其证书的\n    *   \
  \                    副本。\n    * @return 生成的 TSP 请求的 DER 编码。\n    */\n   public static\
  \ byte[] createNoncedTspRequest(\n       byte[] data, BigInteger nonce, boolean\
  \ requestTsaCert)\n       throws IOException, NoSuchAlgorithmException\n   {\n \
  \      TimeStampRequestGenerator reqGen = new TimeStampRequestGenerator();\n\n \
  \      reqGen.setCertReq(requestTsaCert);\n\n       MessageDigest digest = MessageDigest.getInstance(\"\
  SHA-256\");\n\n       return reqGen.generate(\n                TSPAlgorithms.SHA256,\
  \ digest.digest(data), nonce).getEncoded();\n   }\n```\n\n如你所见，`nonce` 是 `generate`\
  \ 请求中的一个额外参数，因为 `nonce` 值应该只使用一次。\n\n### 时间戳协议响应\n\n生成 TSP 响应的最低要求是 TSA 的私钥、一个序列号以及用于显示\
  \ TSA 在何种策略下创建 TSP 令牌的策略标识符。这通常是服务器特定的，并在服务器所有者控制的 OID 分支下颁发。策略 `oid` 通常会与实际文档关联，该文档详细说明了\
  \ TSP 服务器将如何处理特定的时间戳请求。`RFC 3628` [84] 为 TSP 服务器的基线时间戳策略提供了要求。正如我们之前看到的，时间戳请求可能还会在\
  \ `reqPolicy` 字段中包含请求提供时间戳时遵循的策略的信息。\n\n时间戳响应具有以下 ASN.1 定义：\n\n```\nTimeStampResp\
  \ ::= SEQUENCE  {\n    status                  PKIStatusInfo,\n    timeStampToken\
  \          TimeStampToken     OPTIONAL  }\n```\n\n响应的第一部分 `status` 字段指示请求的成功或失败。第二部分\
  \ `timeStampToken` 仅在请求成功时设置。\n\n`PKIStatusInfo` 也是一个序列，并包含一些可选字段，如果请求被服务器拒绝，可以设置这些字段。\n\
  \n```\n PKIStatusInfo ::= SEQUENCE {\n      status        PKIStatus,\n      statusString\
  \  PKIFreeText     OPTIONAL,\n      failInfo      PKIFailureInfo  OPTIONAL  }\n\
  ```\n\n`PKIFreeText` 仅仅是 `UTF8String` 的 `SEQUENCE`。\n\n`PKIStatus` 定义为 `INTEGER`，具有\
  \ 6 个可能的值。这些可能值及其相关含义为：\n\n- 1 - granted (允许)\n- 2 - grantedWithMods (允许并修改)\n-\
  \ 3 - rejection (拒绝)\n- 4 - waiting (等待)\n- 5 - revocationWarning (撤销警告)\n- 6 -\
  \ revocation (撤销)\n\n当 `timeStampToken` 字段未设置时（`status` 不是 1 或 2 的情况），`failInfo`\
  \ 字段将持有请求被拒绝的确定信息。与 `PKIStatus` 不同，`PKIFailureInfo` 实际上是一个 `BIT STRING` 而不是 `INTEGER`，具有以下\
  \ ASN.1 定义：\n\n```\nPKIFailureInfo ::= BIT STRING {\n    badAlg               (0),\n\
  \    badRequest           (2),\n    badDataFormat        (5),\n    timeNotAvailable\
  \    (14),\n    unacceptedPolicy    (15),\n    unacceptedExtension (16),\n    addInfoNotAvailable\
  \ (17),\n    systemFailure       (25) }\n```\n\n不同 `BIT STRING` 值的含义在 `RFC 3161`\
  \ 中给出如下：\n\n- `badAlg`: `messageImprint` 包含一个未识别或不支持的 `AlgorithmIdentifier`（算法标识符）；\n\
  - `badRequest`: 请求不受允许或不支持；\n- `badDataFormat`: 请求以错误的格式提交；\n- `timeNotAvailable`:\
  \ TSA 的时间源不可用；\n- `unacceptedPolicy`: 提请求的 TSA 策略不受 TSA 支持；\n- `unacceptedExtension`:\
  \ 请求中的扩展（通常是关键性扩展）不受 TSA 支持；\n- `addInfoNotAvailable`:任何关于时间戳的额外信息的请求都无法理解，或者该信息不可用；\n\
  - `systemFailure`: 由于 TSA 系统故障，无法处理请求。\n\n当请求消息的 `CertReq` 字段设置为 true 时，符合标准的 TSA\
  \ 必须至少提供一个可以验证时间戳签名的证书。也可能存在其他证书。当 `CertReq` 字段未设置时，符合标准的 TSA 不会在响应中包含任何证书。\n\n\
  当请求成功时，响应的 `timeStampToken` 字段被设置。`TimeStampToken` 结构实际上是一个类型为 `id-signedData` 的\
  \ `CMS ContentInfo` 字段。响应中的实际时间戳信息以封装数据的形式出现在 `ContentInfo` 中 `SignedData` 的 `eContent`\
  \ 中。包含时间戳信息的结构是 `TSTInfo` 结构，它在 `eContent` 中的存在通过将 `eContentType` 设置为 `id-ct-TSTInfo`\
  \ 来，定义如下：\n\n```\nid-ct-TSTInfo  OBJECT IDENTIFIER ::= {\n iso(1) member-body(2)\
  \ us(840) rsadsi(113549) pkcs(1) pkcs-9(9) smime(16) ct(1) 4\n}\n```\n\n`TSTInfo`\
  \ 结构以及它所使用的时间戳的额外结构由以下 ASN.1 定义描述：\n\n```\nTSTInfo ::= SEQUENCE  {\n    version\
  \                      INTEGER  { v1(1) },\n    policy                       TSAPolicyId,\n\
  \    messageImprint               MessageImprint,\n    serialNumber            \
  \     INTEGER,\n    accuracy                     Accuracy                 OPTIONAL,\n\
  \    ordering                     BOOLEAN             DEFAULT FALSE,\n    nonce\
  \                        INTEGER                  OPTIONAL,\n    tsa           \
  \               [0] GeneralName          OPTIONAL,\n    extensions             \
  \      [1] IMPLICIT Extensions  OPTIONAL   }\n\nAccuracy ::= SEQUENCE {\n      \
  \          seconds        INTEGER           OPTIONAL,\n                millis  \
  \   [0] INTEGER  (1..999) OPTIONAL,\n                micros     [1] INTEGER  (1..999)\
  \ OPTIONAL  }\n```\n\n正如你预期的那样，`messageImprint` 字段以及如果请求中存在相同的 `nonce` 字段，在响应的 `TSTInfo`\
  \ 结构必须回显请求中对应字段的内容。`serialNumber` 代表由服务器颁发的 `INTEGER`，它对于响应是唯一的。\n\n时间戳响应必须包含秒，尽管它们可能包含更详细的内容，并且始终以\
  \ UTC 时间表示。当 `accuracy` 字段被设置时，可以使用它来计算时间戳所代表的时间范围的上限（通过向 `genTime` 加上 `accuracy`）和下限（通过从\
  \ `genTime` 减去 `accuracy`）。`Accuracy` 结构中任何缺失的字段应被视为零。\n\n在 Bouncy Castle 中，创建 `TSTInfo`\
  \ 结构的大部分工作都在 API 完成，因此响应生成主要关注提供签名者和请求参数。以下示例方法提供了一个时间戳响应生成器的示例，它可以处理使用我们看过的请求生成方法构建的请求。\n\
  \n\n\n\n\n```java\n  /**\n   * 为传入的字节编码 TSP 请求创建 TSP 响应。\n   *\n   * @param tsaSigningKey\
  \  TSA 签名密钥。\n   * @param tsaSigningCert TSA 验证证书的副本。\n   * @param serialNumber\
  \   响应序列号\n   * @param tsaPolicy      时间戳\n   * @param encRequest     TSP 请求的字节编码。\n\
  \   */\n  public static byte[] createTspResponse(\n      PrivateKey tsaSigningKey,\
  \ X509Certificate tsaSigningCert,\n      BigInteger serialNumber, ASN1ObjectIdentifier\
  \ tsaPolicy, byte[] encRequest)\n      throws TSPException, OperatorCreationException,\n\
  \      GeneralSecurityException, IOException\n  {\n      AlgorithmIdentifier digestAlgorithm\
  \ =\n          new AlgorithmIdentifier(NISTObjectIdentifiers.id_sha256);\n     \
  \ DigestCalculatorProvider digProvider =\n          new JcaDigestCalculatorProviderBuilder().setProvider(\"\
  BC\").build();\n\n      TimeStampRequest tspRequest = new TimeStampRequest(encRequest);\n\
  \n      SignerInfoGenerator tsaSigner = new JcaSimpleSignerInfoGeneratorBuilder()\n\
  \          .build(\"SHA256withECDSA\", tsaSigningKey, tsaSigningCert);\n      TimeStampTokenGenerator\
  \ tsTokenGen = new TimeStampTokenGenerator(\n          tsaSigner, digProvider.get(digestAlgorithm),\
  \ tsaPolicy);\n\n      // 客户端请求签名证书的副本\n      if (tspRequest.getCertReq())\n   \
  \   {\n          tsTokenGen.addCertificates(\n              new JcaCertStore(Collections.singleton(tsaSigningCert)));\n\
  \      }\n\n      TimeStampResponseGenerator tsRespGen = new TimeStampResponseGenerator(\n\
  \          tsTokenGen, TSPAlgorithms.ALLOWED);\n\n      return tsRespGen.generate(tspRequest,\
  \ serialNumber, new Date()).getEncoded();\n  }\n```\n\n在示例代码中你会注意到，虽然我们通过调用 `getCertReq()`\
  \ 方法显式地检查并处理了请求中的 `CertReq` 字段，但并没有提到 nonce（随机数），），尽管我们的 `createNoncedTspRequest()`\
  \ 方法会在其生成的请求中提供一个 nonce。这是因为由于对 nonce 有定义的规则，nonce 是在 `TimeStampResponseGenerator`\
  \ 类 `generate()` 方法内部构建 `TimeStampToken` 的最终构建过程中被处理的。\n\n以下方法验证时间戳响应，成功时返回 true，否则抛出异常。\n\
  \n```java\n  /**\n   * 验证传入的响应是否可以通过 TSA 证书验证，并确保与\n   * encRequest 中编码的时间戳请求匹配。\n\
  \   *\n   * @param encResponse 时间戳响应的 ASN.1 二进制编码。\n   * @param tsaCertificate 生成响应的\
  \ TSA 证书。\n   * @param encRequest 原始请求的 ASN.1 二进制编码。\n   * @return 如果响应可以验证则返回 true，验证失败则抛出异常。\n\
  \   */\n  public static boolean verifyTspResponse(\n      byte[] encResponse,\n\
  \      X509Certificate tsaCertificate,\n      byte[] encRequest)\n      throws IOException,\
  \ TSPException, OperatorCreationException\n  {\n      TimeStampResponse tspResp\
  \ = new TimeStampResponse(encResponse);\n\n      // 响应/请求验证会在出现问题时抛出异常\n      tspResp.validate(new\
  \ TimeStampRequest(encRequest));\n\n      TimeStampToken tsToken = tspResp.getTimeStampToken();\n\
  \n      // 令牌签名验证会在出现问题时抛出异常\n      tsToken.validate(new JcaSimpleSignerInfoVerifierBuilder()\n\
  \          .setProvider(\"BC\")\n          .build(tsaCertificate));\n\n      return\
  \ true;\n  }\n```\n\n`validate` 方法非常短，因为 `TSP` API 检查了 `RFC 3161` 规定的标准以确保时间戳响应被正确创建。从开发者的角度来看，这只是组装验证签名所需的\
  \ `SignerInformationVerifier` 对象的问题。请注意，`RFC 3161` 规定的标准之一：用于验证 TSP 请求的证书必须包含 `ExtendedKeyUsage`\
  \ 扩展，该扩展被标记为关键（critical），并断言 `id-kp-timeStamping` 为唯一的密钥用途。\n\n现在只需查看一个完整的用法示例。我们将在下一节中进行介绍。\n\
  \n### 时间戳的应用：CAdES-T\n\n最初，`RFC 3126` “长期电子签名格式”提供了多种将时间戳的使用整合到文档签名中的方法。`RFC 5126`\
  \ “CMS 高级电子签名 (CAdES)”在此基础上进一步扩展，提供了一种结合 `CMS` 指定长寿命数字签名的方法。\n\n此过程的第一步是创建 TSP 请求。以下方法展示了如何使用我们已的方法创建\
  \ TSP 请求：\n\n```java\n  /**\n   * 为 SignedData 结构中的 SignerInfo 创建 TSP 请求。\n   *\n\
  \   * @param nonce 与请求一起使用的 nonce。\n   * @param encSignedData SignedData 结构的编码。\n\
  \   * @return 一个 TSP 请求。\n   */\n  public static byte[] createSignerInfoTspRequest(\n\
  \      BigInteger nonce,\n      byte[] encSignedData)\n      throws GeneralSecurityException,\n\
  \             CMSException, IOException\n  {\n      CMSSignedData signedData = new\
  \ CMSSignedData(encSignedData);\n      SignerInformation signer = signedData.getSignerInfos().iterator().next();\n\
  \n      return createNoncedTspRequest(signer.getSignature(), nonce, true);\n  }\n\
  ```\n\n注意，该 TSP 请求是使用从表示 `SignedData` 结构的 `CMSSignedData` 对象获取的 `SignerInformation`\
  \ 对象存储的签名内容创建的。\n\n一旦 TSP 请求被处理并返回响应，该过程的下一步是创建一个 CMS 属性结构，然后将其添加到原始请求签名的 CMS SignerInfo\
  \ 结构的未签名属性中。\n\n以下方法展示了如何为 SignerInfo 结构创建正确的 CMS 属性：\n\n```java\n  /**\n   * 为携带\
  \ TSP 响应创建 CMS 属性。\n   *\n   * @param tspResponse 来自我们要引用的时间戳机构的响应。\n   * @return\
  \ 适用于 TSP 响应的属性。\n   */\n  public static Attribute createTspAttribute(byte[] tspResponse)\n\
  \      throws TSPException, IOException\n  {\n      TimeStampResponse response =\
  \ new TimeStampResponse(tspResponse);\n      TimeStampToken timestampToken = response.getTimeStampToken();\n\
  \n      return new Attribute(PKCSObjectIdentifiers.id_aa_signatureTimeStampToken,\n\
  \                          new DERSet(timestampToken.toCMSSignedData().toASN1Structure()));\n\
  \  }\n```\n\n此示例方法展示了如何整合所有内容，产生一个 CMS SignedData ，其第一个 SignerInfo 结构已通过编辑在其中包含了一个时间戳。\n\
  \n\n\n\n```java\n   /**\n    * 将 encSignedData 代表的 CMS SignedData 中的 SignerInformation\n\
  \    * 替换为带有时间戳的版本。\n    *\n    * @param encSignedData 要时间戳的 SignedData 编码。\n  \
  \  * @param nonce 用于 TSP 请求的随机数（nonce）。\n    * @param tsaSigningKey 时间戳机构密钥。\n \
  \   * @param tsaSigningCert 时间戳机构证书。\n    * @param serialNumber 时间戳响应的序列号。\n   \
  \ * @param tsaPolicyOID 时间戳机构工作的策略 OID。\n    * @return 带有时间戳的新版本 encSignedData 的编码。\n\
  \    */\n   public static byte[] createTimeStampedSignedData(\n      byte[] encSignedData,\n\
  \      BigInteger nonce,\n      PrivateKey tsaSigningKey, X509Certificate tsaSigningCert,\n\
  \      BigInteger serialNumber, ASN1ObjectIdentifier tsaPolicyOID)\n      throws\
  \ OperatorCreationException,\n             GeneralSecurityException,\n         \
  \    CMSException, TSPException, IOException\n   {\n      CMSSignedData signedData\
  \ = new CMSSignedData(encSignedData);\n      SignerInformation signer = signedData.getSignerInfos().iterator().next();\n\
  \n      byte[] tspReq = createSignerInfoTspRequest(nonce, encSignedData);\n\n  \
  \    byte[] tspResp = createTspResponse(tsaSigningKey, tsaSigningCert,\n       \
  \                                   serialNumber, tsaPolicyOID, tspReq);\n\n   \
  \   // 响应\n      verifyTspResponse(tspResp, tsaSigningCert, tspReq);\n\n      //\
  \ 设置包含 TSP 属性的属性表。\n      ASN1EncodableVector timestampVector = new ASN1EncodableVector();\n\
  \n      timestampVector.add(createTspAttribute(tspResp));\n\n      AttributeTable\
  \ at = new AttributeTable(timestampVector);\n\n      // 创建替换的签名者\n      signer =\
  \ SignerInformation.replaceUnsignedAttributes(signer, at);\n\n      // 创建替换的 SignerStore\n\
  \      SignerInformationStore newSignerStore = new SignerInformationStore(signer);\n\
  \n      // 替换 signed data 对象中的签名者\n      return CMSSignedData.replaceSigners(signedData,\
  \ newSignerStore).getEncoded();\n   }\n```\n\n在创建了带有时间戳的 `SignerInfo` 结构后，我们现在来看在日后验证该时间戳的过程。这需要从\
  \ `SignerInfo` 结构未签名属性中的相应属性中重新构建 `TimeStampToken`。\n\n```java\n   /**\n    * 验证传入的\
  \ CMS SignedData 上的时间戳令牌属性。\n    * 注意：在这种情况下，我们使用的是与 SignedData 关联的\n    * TimeStampToken\
  \ 中存储证书。\n    *\n    * @param cmsSignedData 我们想要检查的 CMS SignedData 编码。\n    * @return\
  \ 如果验证通过返回 true，否则抛出异常。\n    */\n   public static boolean verifyTimeStampedSigner(byte[]\
  \ cmsSignedData)\n       throws CMSException,\n              IOException, TSPException,\n\
  \              CertificateException, OperatorCreationException\n   {\n      CMSSignedData\
  \ signedData = new CMSSignedData(cmsSignedData);\n      SignerInformation signer\
  \ = signedData.getSignerInfos().iterator().next();\n\n      TimeStampToken tspToken\
  \ = new TimeStampToken(\n          ContentInfo.getInstance(\n              signer.getUnsignedAttributes()\n\
  \                  .get(PKCSObjectIdentifiers.id_aa_signatureTimeStampToken)\n \
  \                     .getAttributeValues()[0]));\n\n      Collection certCollection\
  \ = tspToken.getCertificates()\n                                      .getMatches(tspToken.getSID());\n\
  \      Iterator certIt = certCollection.iterator();\n      X509CertificateHolder\
  \ cert = (X509CertificateHolder)certIt.next();\n\n      // 如果验证失败，此方法将抛出异常。\n  \
  \    tspToken.validate(new JcaSimpleSignerInfoVerifierBuilder()\n              \
  \                    .setProvider(\"BC\").build(cert));\n\n      return true;\n\
  \   }\n```\n\n注意，你并不总是能够依赖 `TimeStampToken` 包含验证证书。自然地，你会希望确保验证证书也是有效的。自动从表面上接受这些内容并不是一个好主意。\n\
  \n这段最后的示例代码展示了如何将上述所有内容整合在一起，并从我们之前查看过的 CMS 方法创建的结构生成带有时间戳的 SignedData 结构。\n\n```java\n\
  \      byte[] msg = Strings.toByteArray(\"Hello, world!\");\n\n      KeyPair selfSignedKp\
  \ = generateECKeyPair();\n      X509CertificateHolder selfSignedCert =\n       \
  \   createTrustAnchor(selfSignedKp, \"SHA256withECDSA\");\n\n      CMSSignedData\
  \ encapSigned = createSignedData(selfSignedKp.getPrivate(),\n          selfSignedCert,\
  \ msg, true);\n\n      ... (省略重复代码块) ...\n```\n\n\n\n\n## 第 12 章：证书请求与证书管理\n\n正如我们已经看到的，CA\
  \ 并不是凭空生成证书的——证书生成通常是为了响应证书请求而进行的。证书请求通常是远程的，因此它们也能保护用户的私钥，免受任何被证明是恶意的或在某些方面疏忽的\
  \ CA 的滥用。\n\n尽管如此，虽然证书请求意图显而易见，但其中应该包含什么并不十分明确，因此已经提出了许多协议用于向 CA 发送消息以生成证书。在本章中，我们将查看证书请求消息是如何组合的，以及它们被用于哪些协议。这有助于帮助我们理解客户端和\
  \ CA 在处理证书请求并将证书从 CA 返回给客户端时需要经历的请求/响应周期。\n\n## PKCS #10 证书请求\n\nPKCS #10 的命名源于原始的\
  \ RSA 标准。PKCS #10 证书请求的当前定义现在由 `RFC 2986` [78] 描述，其关联 MIME 类型的描述在 `RFC 5967` [110]\
  \ 中。\n\n在 Bouncy Castle 中，你可以使用 `org.bouncycastle.pkcs` 包中的 `PKCS10CertificationRequestBuilder`\
  \ 和 `PKCS10CertificationRequest` 类来创建和处理 PKCS #10 证书请求，也可以使用扩展自它们的类，如 `JcaPKCS10CertificationRequestBuilder`\
  \ 和 `JcaPKCS10CertificationRequest`。与 PKIX API 中的其他情况一样，以“Jca”开头的类感知 JCA 类型（例如 `PublicKey`），并可以根据需要配置\
  \ JCA 者。\n\n在最基础的层，PKCS #10 请求仅仅是对一个结构进行签名，该结构包含了你希望与证书请求中的公钥关联的主体名称（subject name）。RFC\
  \ 2986 在 ASN.1 中对该结构的描述如下：\n\n```\n CertificationRequestInfo ::= SEQUENCE {\n  \
  \      version       INTEGER { v1(0) } (v1,...),\n        subject       Name,\n\
  \        subjectPKInfo SubjectPublicKeyInfo{{ PKInfoAlgorithms }},\n        attributes\
  \    [0] Attributes{{ CRIAttributes }}\n   }\n\n   CertificationRequest ::= SEQUENCE\
  \ {\n        certificationRequestInfo CertificationRequestInfo,\n        signatureAlgorithm\
  \ AlgorithmIdentifier{{ SignatureAlgorithms }},\n        signature          BIT\
  \ STRING\n   }\n```\n\n`SubjectPublicKeyInfo` 和 `Attributes` 同样提供了定义，但这些结构与我们在第\
  \ 8 章中已经遇到的证书和属性证书的结构是相同的。从 ASN.1 可以看出，CertificationRequest 结构的组合方式本质上与用于构建 ASN.1\
  \ Certificate 结构的方法是相同的。\n\nPKCS #10 请求上的签名会被 CA 接受，因为它提供了所有权证明（POP），以证明证书请求来自获得授权请求与主体名称关联的人员。POP\
  \ 是通过使用与请求中公钥关联的私钥生成签名来提供的——从而确定该请求是由已知晓私钥的人创建的。这意味着 PKCS #10 请求与 `RFC 4211` [88]\
  \ 中定义的不同，它只能用于可以用来生成签名的密钥。这同时也意味着如果公钥旨在用于加密（在 FIPS 语文中），则需要对提供者进行配置，以允许用于签署证书请求的双重用途。\n\
  \n你可以从下面的代码片段中看到如何在 JCA 下构建基础证书请求的示例：\n\n```\n 1   /**\n 2    * 创建一个基础 PKCS#10 请求。\n\
  \ 3    *\n 4    * @param keyPair 证书请求所属的密钥对。\n 5    * @param sigAlg 用于签署 PKCS#10\
  \ 请求的签名算法。\n 6    * @return 承载 PKCS#10 请求的对象。\n 7    * @throws OperatorCreationException\
  \ 如果私钥与所选签名算法\n 8    * 不匹配则抛出异常。\n 9    */\n10   public static PKCS10CertificationRequest\
  \ createPKCS10(\n11           KeyPair keyPair, String sigAlg)\n12           throws\
  \ OperatorCreationException\n13   {\n14       X500NameBuilder x500NameBld = new\
  \ X500NameBuilder(BCStyle.INSTANCE)\n15               .addRDN(BCStyle.C, \"AU\"\
  )\n16               .addRDN(BCStyle.ST, \"Victoria\")\n17               .addRDN(BCStyle.L,\
  \ \"Melbourne\")\n18               .addRDN(BCStyle.O, \"The Legion of the Bouncy\
  \ Castle\");\n19 \n20       X500Name subject = x500NameBld.build();\n21 \n22   \
  \    PKCS10CertificationRequestBuilder requestBuilder\n23               = new JcaPKCS10CertificationRequestBuilder(\n\
  24                                           subject, keyPair.getPublic());\n25\
  \ \n26       ContentSigner signer = new JcaContentSignerBuilder(sigAlg)\n27    \
  \                           .setProvider(\"BC\").build(keyPair.getPrivate());\n\
  28 \n29       return requestBuilder.build(signer);\n30   }\n```\n\n在 CA 侧，你需要能够验证请求上的证书。以下方法在\
  \ JCA 下实现了此操作：\n\n```\n 1   /**\n 2    * 使用公钥检查 PKCS#10 签名的简单\n 3    * 方法。\n 4 \
  \   *\n 5    * @param request PKCS10 请求的编码。\n 6    * @return 如果公钥验证签名则返回 true，否则返回\
  \ false。\n 7    * @throws OperatorCreationException 如果公钥不适用。\n 8    * @throws PKCSException\
  \ 如果无法处理 PKCS#10 请求。\n 9    */\n10   public static boolean isValidPKCS10(\n11  \
  \         byte[] request)\n12       throws OperatorCreationException, PKCSException,\n\
  13              GeneralSecurityException, IOException\n14   {\n15       JcaPKCS10CertificationRequest\
  \ jcaRequest =\n16                   new JcaPKCS10CertificationRequest(request).setProvider(\"\
  BC\");\n17       PublicKey key = jcaRequest.getPublicKey();\n18 \n19       ContentVerifierProvider\
  \ verifierProvider =\n20                                      new JcaVerifierProviderBuilder()\n\
  21                                          .setProvider(\"BC\").build(key);\n22\
  \ \n23       return jcaRequest.isSignatureValid(verifierProvider);\n24   }\n```\n\
  \n可以看出这是一个三步骤的过程：首先从请求中提取密钥，在这种情况下是通过编码创建并配置 `JcaPKCS10CertificationRequest` 并调用其\
  \ `getPublicKey()` 方法。其次，使用公钥通过 `JcaVerifierProviderBuilder` 类使用 Bouncy 提供者创建一个通用验证者提供者。最后，将内容验证提供者传递给\
  \ `isSignatureValid()` 方法，在此处它将在方法内部产生一个可用于验证使用签名算法制作签名的验证者。\n\n### 包含扩展请求\n\nPKCS\
  \ #10 还允许证书请求包含特定扩展的请求，私钥持有者希望将其包含在证书中。这些扩展中最常见的是 `RFC 5280` [101] 中定义的，并在 Bouncy\
  \ Castle 中通过 `Extension.subjectAltName` 字段表示。扩展请求使用 PKCS #9 扩展请求属性 OID 添加，该 OID\
  \ 由 `PKCSObjectIdentifiers.pkcs_9_at_extensionrequest` 表示，值为 `1.2.840.113549.1.9.14`。\n\
  \n示例展示了如何使用 `pkcs_9_at_extensionrequest` OID 添加 `subjectAlternativeName` 扩展，以提供与\
  \ CSR 主体关联的电子邮件地址。\n\n\n\n\n\n```java\n   /**\n    * 创建一个 PKCS#10 请求，包含一个扩展请求，详细说明了\n\
  \    * CA 应该在 subjectAltName 扩展中包含的电子邮件地址。\n    *\n    * @param keyPair 证书请求所属的密钥对。\n\
  \    * @param sigAlg 用于对 PKCS#10 请求签名的算法。\n    * @return 载有 PKCS#10 请求的对象。\n   \
  \ * @throws OperatorCreationException 当私钥与所选的签名算法不匹配时抛出。\n    * @throws IOException\
  \ 发生 ASN.1 编码错误时。\n    */\n   public static PKCS10CertificationRequest createPKCS10WithExtensions(\n\
  \           KeyPair keyPair, String sigAlg)\n           throws OperatorCreationException,\
  \ IOException\n   {\n       X500NameBuilder x500NameBld = new X500NameBuilder(BCStyle.INSTANCE)\n\
  \               .addRDN(BCStyle.C, \"AU\")\n               .addRDN(BCStyle.ST, \"\
  Victoria\")\n               .addRDN(BCStyle.L, \"Melbourne\")\n               .addRDN(BCStyle.O,\
  \ \"The Legion of the Bouncy Castle\");\n\n       X500Name subject = x500NameBld.build();\n\
  \n       PKCS10CertificationRequestBuilder requestBuilder\n               = new\
  \ JcaPKCS10CertificationRequestBuilder(\n                                      \
  \     subject, keyPair.getPublic());\n\n       ExtensionsGenerator extGen = new\
  \ ExtensionsGenerator();\n\n       extGen.addExtension(Extension.subjectAlternativeName,\
  \ false,\n               new GeneralNames(\n                       new GeneralName(\n\
  \                               GeneralName.rfc822Name,\n                      \
  \         \"feedback-crypto@bouncycastle.org\")));\n\n       Extensions extensions\
  \ = extGen.generate();\n\n       requestBuilder.addAttribute(\n               PKCSObjectIdentifiers.pkcs_9_at_extensionRequest,\
  \ extensions);\n\n       ContentSigner signer = new JcaContentSignerBuilder(sigAlg)\n\
  \                               .setProvider(\"BC\").build(keyPair.getPrivate());\n\
  \n       return requestBuilder.build(signer);\n   }\n```\n\n正如从 `ExtensionsGenerator`\
  \ 类的使用所示，可以轻松地添加多种扩展。值得注意的是，虽然可以使用 `pkcs_9_at_extensionRequest` 向 CSR 中添加扩展，但 CA\
  \ 并没有义务添加它们。相反，如果你正在编写一个 CA 并且愿意处理扩展请求属性，你应该检查正在请求的是哪些扩展，以确保没有意外的内容混入你颁发的任何一个证书中。\n\
  \n## 用于 PKCS #10 的 BCFIPS Provider 配置\n\n由于在大多数情况下这是个坏主意，FIPS 140-2 不允许使用双用途密钥。其基本准则是：你可以根据自己的意愿进行加密或签名，但请（大部分）不要对同一个密钥同时进行这两者。这里的“大部分”是指在\
  \ SP 800-56B Rev 1 第 6.1 节以及 SP 800-57 Pt1 Rev 4 第 8.1.5.1.1.2 节中允许允许的一个例外。该例外是：允许将加密密钥用于一次签名，用于生成证书请求，以便为该加密密钥颁发证书。\n\
  \nBouncy Castle FIPS provider 通常会直接阻止 RSA 密钥的这种用法，但提供了一个系统属性用于为了 SP 800-56B Rev\
  \ 1 中描述的目的启用 RSA 密钥的双用途。该系统属性名为 `org.bouncycastle.rsa.allow_multi_use`，如果你将其设置为\
  \ `true`，则用于 RSA 加密密钥的 PKCS #10 将按要求工作。\n\n## 证书请求消息格式\n\nPKCS #10 的缺点之一是，它的设计使用的算法仅能用于签名。唯一的所有权证明（proof-of-possession）步骤是验证\
  \ PKCS #10 请求上的签名有效性。通常，验证步骤是为了证明公钥所有者签署了请求，因此他们必须拥有私钥。RFC 4211 定义了证书请求消息格式 (CRMF)，该协议通过提供备用机制来处理这一局限性，这些机制可以处理仅用于加密和密钥约定的密钥，同时也支持用于签名生成和验证的密钥。CRMF\
  \ 将证书颁发视为两个实体——注册机构（RA）和证书颁发机构（CA）之间的协调，其中 RA 验证请求已获得授权，而 CA 颁发实际证书。显然，这两个实体可以是同一个“实体”，但值得注意的是，这并不是强制要求的。\n\
  \nCRMF 的核心结构是 `CertReqMsg`，它是一个三部分结构，并具有以下 ASN.1 定义：\n\n```\n CertReqMsg ::= SEQUENCE\
  \ {\n      certReq   CertRequest,\n      popo       ProofOfPossession,\n      regInfo\
  \   SEQUENCE(1..MAX) of AttributeTypeValue\n }\n```\n\n`certReq` 字段由一个结构定义，包含了你可能考虑的各种可能性：\n\
  \n```\n CertRequest ::= SEQUENCE {\n      certReqId     INTEGER,        -- 用于匹配请求和响应的\
  \ ID\n      certTemplate  CertTemplate, -- 将颁发的字段\n      controls      Controls\
  \ OPTIONAL }\n\n   CertTemplate ::= SEQUENCE {\n      version      [0] Version \
  \              OPTIONAL,\n      serialNumber [1] INTEGER               OPTIONAL,\n\
  \      signingAlg   [2] AlgorithmIdentifier   OPTIONAL,\n      issuer       [3]\
  \ Name                  OPTIONAL,\n      validity     [4] OptionalValidity     \
  \ OPTIONAL,\n      subject      [5] Name                  OPTIONAL,\n      publicKey\
  \    [6] SubjectPublicKeyInfo  OPTIONAL,\n      issuerUID    [7] UniqueIdentifier\
  \      OPTIONAL,\n      subjectUID   [8] UniqueIdentifier      OPTIONAL,\n     \
  \ extensions   [9] Extensions            OPTIONAL }\n\n   OptionalValidity ::= SEQUENCE\
  \ {\n      notBefore  [0] Time OPTIONAL,\n      notAfter   [1] Time OPTIONAL } --至少必须存在一个\n\
  \n   Time ::= CHOICE {\n      utcTime        UTCTime,\n      generalTime    GeneralizedTime\
  \ }\n```\n\n`certReqId` 仅仅是请求者包含的整数，以便在请求被处理时识别来自 CA 的返回响应。`CertTemplate` 中的字段基本上意味着我们在第\
  \ 8 节查看 X.509 证书结构时所想象的那样。这里应该指出，其中某些字段受到限制，这些限制由 RFC 4211 ，因此如果你计划对 CRMF 进行大量深入工作，下载一份\
  \ RFC 副本也是值得的。\n\n虽然我们也熟悉第 8 节中的 `AttributeTypeValue`，但 `controls` 字段是一个需要更多解释，我们将在后文中看到它的用法示例。CRMF\
  \ 允许请求者发送 RA 注册令牌、认证信息、发布请求、请求者私钥的存档信息、由新请求更新的证书详情，以及 CA 在发送加密响应时应该使用的协议。所有这些项目都可以在\
  \ `controls` 字段中指定。\n\n`popo` 字段是识别其他形式所有权证明的地方。它是一个 ASN.1 CHOICE 项，具有以下选项：\n\n\
  ```\n ProofOfPossession ::= CHOICE {\n       raVerified        [0] NULL,\n     \
  \  signature         [1] POPOSigningKey,\n       keyEncipherment   [2] POPOPrivKey,\n\
  \       keyAgreement      [3] POPOPrivKey }\n```\n\n\n\n\n`raVerified` 选择用于 RA（注册机构）已确认\
  \ CA（证书颁发机构）公钥所有权的情况。签名选择提供了一个序列，其中包含一个对请求部分进行计算的签名，以类似于 PKCS #10 的方法满足所有权证明（proof-of-possession）的要求。`keyEncipherment`\
  \ 选择提供了一种方法，指定如何处理为仅加密密钥颁发的证书。最后，`keyAgreement` 选择提供了一种方法，指定如何处理为仅用于密钥协商的密钥颁发的证书。\n\
  \n#### 基于签名的所有权证明（Signature-Based PoP）\n\n我们将看到的第一个示例是使用最接近 PKCS #10 的方法生成简单的请求，即用于签名密钥的证书请求。\n\
  \n```java\n 1   /**\n 2    * 生成带有 POP 的 CRMF 证书请求的基本示例，\n 3    * 用于如 DSA 的签名算法或来自如\
  \ RSA 的算法用于签名生成的 \n 4    * 密钥对。\n 5    *\n 6    * @param kp 我们正在请求其公钥的密钥对。\n 7 \
  \   * @param subject 要与证书关联的主体主体。\n 8    * @param algorithm 要使用的签名算法名称。\n 9    *\
  \ @param certReqID 此证书请求的身份（针对客户端）。\n10    */\n 11   public static byte[] generateRequestWithPOPSig(\n\
  12       KeyPair kp, X500Principal subject, String algorithm, BigInteger certReqID)\n\
  13       throws CRMFException, IOException, OperatorCreationException\n14   {\n\
  \ 15       JcaCertificateRequestMessageBuilder certReqBuild\n 16           = new\
  \ JcaCertificateRequestMessageBuilder(certReqID);\n 17 \n 18       certReqBuild\n\
  \ 19           .setPublicKey(kp.getPublic())\n 20           .setSubject(subject)\n\
  \ 21           .setProofOfPossessionSigningKeySigner(\n 22               new JcaContentSignerBuilder(algorithm)\n\
  \ 23                   .setProvider(\"BC\")\n 24                   .build(kp.getPrivate()));\n\
  \ 25 \n 26       return certReqBuild.build().getEncoded();\n 27   }\n```\n\n如代码所示，与请求请求的公钥相关的私钥被用于生成包含在请求中的签名组件，以验证所有权证明。\n\
  \n对于基于签名的所有权证明，CRMF 还允许我们在 RA/CA 和请求者之间共享一个密钥，然后将其作为请求证书的依据。如果我们使用这种方法，我们会在请求中排除主体（subject），我们的方法将如下：\n\
  \n```java\n 1   /**\n 2    * 生成带有 POP 的 CRMF 证书请求的身份验证示例，\n 3    * 用于签名算法。在这种情况下，CA\
  \ 将通过 MAC 验证 \n 4    * 验证主体。\n 5    *\n 6    * @param kp 我们正在请求其公钥的密钥对。\n 7    *\
  \ @param certReqID 此证书请求的身份（针对客户端）。\n 8    * @param algorithm 要使用的签名算法名称。\n 9  \
  \  * @param reqPassword 此此请求的授权密码。\n10    */\n 11   public static byte[] generateRequestWithPOPSig(\n\
  12       KeyPair kp, String algorithm, BigInteger certReqID, char[] reqPassword)\n\
  13       throws CRMFException, IOException, OperatorCreationException\n14   {\n\
  \ 15       JcaCertificateRequestMessageBuilder certReqBuild\n 16           = new\
  \ JcaCertificateRequestMessageBuilder(certReqID);\n 17 \n 18       certReqBuild\n\
  \ 19           .setPublicKey(kp.getPublic())\n 20           .setAuthInfoPKMAC(\n\
  \ 21               new PKMACBuilder(\n 22                   new JcePKMACValuesCalculator()),\n\
  \ 23               reqPassword)\n 24           .setProofOfPossessionSigningKeySigner(\n\
  \ 25               new JcaContentSignerBuilder(algorithm)\n 26                 \
  \  .setProvider(\"BC\")\n 27                   .build(kp.getPrivate()));\n 28 \n\
  \ 29       return certReqBuild.build().getEncoded();\n 30   }\n```\n\n这里使用的 MAC\
  \ 为 CA/RA 提供了验证我们的请求并匹配相应主体 ID 的手段，并与任何可能其他其他保持一致。\n\n#### 基于加密的所有权证明（Encryption-Based\
  \ PoP）\n\n对于仅加密密钥，基于私钥签名生成所有权证明并非总是可选的。CRMF 考虑了这一点，在那种情况下，基础请求如下：\n\n```java\n 1\
  \   /**\n 2    * 生成带有 POP 的 CRMF 证书请求的基本示例，\n 3    * 用于如 ElGamal 的仅加密算法。\n 4   \
  \ *\n 5    * @param kp 我们正在请求其公钥的密钥对。\n 6    * @param subject 要与证书关联的主体主体。\n 7 \
  \   * @param certReqID 此证书请求的身份（针对客户端）。\n 8    */\n 9   public static byte[] generateRequestWithPOPEnc(\n\
  10       KeyPair kp, X500Principal subject, BigInteger certReqID)\n11       throws\
  \ CRMFException, IOException\n12   {\n 13       JcaCertificateRequestMessageBuilder\
  \ certReqBuild\n 14           = new JcaCertificateRequestMessageBuilder(certReqID);\n\
  \ 15 \n 16       certReqBuild\n 17           .setPublicKey(kp.getPublic())\n 18\
  \           .setSubject(subject)\n 19           .setProofOfPossessionSubsequentMessage(SubsequentMessage.encrCert);\n\
  \ 20 \n 21       return certReqBuild.build().getEncoded();\n 22   }\n```\n\n在这种情况下，关键是调用\
  \ `certReqBuild.setProofOfPossessionSubsequentMessage()`。`SubsequentMessage.encrCert`\
  \ 指定 CA/RA 应以加密包（通常是 EnvelopedData）返回证书，请求者通过解密包并恢复证书来证明所有权。该调用的默认版本仅作为加密密钥的所有权证明。\n\
  \n#### 基于密钥协商的所有权证明（Key Agreement-Based PoP）\n\n对于密钥协商，如果 CA 支持使用 EnvelopedData，也可以使用加密所有权证明的方法。以下示例指定应加密加密返回证书。\n\
  \n```java\n 1   /**\n 2    * 生成带有 POP 的 CRMF 证书请求的基本示例，\n 3    * 用于密钥协商公钥。\n 4 \
  \   *\n 5    * @param kp 我们正在请求其公钥的密钥对。\n 6    * @param subject 要与证书关联的主体主体。\n 7\
  \    * @param certReqID 此证书请求的身份（针对客户端）。\n 8    */\n 9   public static byte[] generateRequestWithPOPAgree(\n\
  10       KeyPair kp, X500Principal subject, BigInteger certReqID)\n11       throws\
  \ CRMFException, IOException\n12   {\n 13       JcaCertificateRequestMessageBuilder\
  \ certReqBuild\n 14           = new JcaCertificateRequestMessageBuilder(certReqID);\n\
  \ 15 \n 16       certReqBuild\n 17           .setPublicKey(kp.getPublic())\n 18\
  \           .setSubject(subject)\n 19           .setProofOfPossessionSubsequentMessage(\n\
  \ 20               ProofOfPossession.TYPE_KEY_AGREMENT, SubsequentMessage.encrCert);\n\
  \ 21 \n 22       return certReqBuild.build().getEncoded();\n 23   }\n```\n\n此调用与上一个调用的区别是将所有权证明类型设置为\
  \ `TYPE_KEY_AGREMENT`。对于密钥协商密钥，还有另一种形式的所有权证明，并在 RFC 4211 第 4.3 节中描述，该节引用了 RFC 2875\
  \ 第 3 节描述的技术 [77]。目前该技术高度依赖 SHA-1，因此尽管它被列为服务器支持的强制性，但在可用情况下最好使用基于 EnvelopedData\
  \ 的方法。\n\n\n\n基于 CMS 的证书管理 (CMC) 的细节最初于 2008 年在 `RFC 5272` [98]、`RFC 5273` [99]\
  \ 和 `RFC 5274` [100] 中描述，并在 2011 年由 `RFC 6402` 更新。该协议非常有趣，因为它被用于支持 `RFC 7030` -\
  \ 基于安全传输的注册 (EST) [120]，我们将在接下来查看它。\n\n### 基于安全传输的注册 (EST)\n\n正如名称所示，`RFC 7030`\
  \ [120] 中描述的安全传输注册是一个设计为在 TLS 上进行的注册过程。\n\n### 示例设置\n\n由于我们利用了 TLS，设置实际上只需要我们获取适用于\
