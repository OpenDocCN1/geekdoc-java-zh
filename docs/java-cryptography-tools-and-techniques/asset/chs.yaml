- "# Java 加密：工具与技术\n\n\n\n\n\n\n本书可在 [`leanpub.com/javacryptotoolsandtech`](http://leanpub.com/javacryptotoolsandtech)\
  \ 购买\n\n此版本出版于 2023-06-13\n\n![出版者标志](img/leanpub-logo.png)\n\n这是一本来自 [Leanpub](https://leanpub.com)\
  \ 的书籍。Leanpub 通过精益出版流程为作者和出版者赋能。[精益出版](https://leanpub.com/manifesto) 是使用轻量级工具和多次迭代来出版正在开发中的电子书，以获取读者反馈，不断调整直到获得正确的书籍，并在一旦成功后建立影响力。\n\
  \n© 2017 - 2023 David Hook 和 Jon Eaves\n\n## 目录\n\n## 指南\n\n1. 开始阅读\n\n## 致谢\n\n\
  作者感谢 Peter Grant、Stephen Farrugia 和 Megan Woods 审阅了本书内容。\n\n作者还感谢 Christoffer Sawicki、Sree\
  \ Harsha Totakura 和 Alexander Railean 报告了出版书中错误和歧义之处。这些反馈帮助为所有人完善了这本书。\n\nDavid\
  \ 还想感谢他的妻子 Janine 和儿子 Lewis 的支持，并感谢猫 Hamlet（那只披着皮毛的原生小密码学家）和狗 Ophelia 的持续关注（也许可能不是密码学家，但对她自己认为在做的事情非常有热情）。你们一直是灵感和支持的源源泉，谢谢！\n\
  \nJon 想要感谢他的妻子 Jo 的支持，她不仅支持这本书，还支持他在所有事务上的工作。此外，Jon 还想感谢 David 卓越的友谊、支持和指导，因为如果没有他对\
  \ `Bouncy Castle` 的勤勉管理，加密社区将因此贫乏许多。\n\n## 引言\n\n*“在知道如何遵守规则之前，违反规则是不够明智的。”*\n\n\
  – T. S. Eliot\n\n我们之前编写关于 Java、`Bouncy Castle` 以及它如何触及加密世界的书籍尝试现在已经过去十多年了。\n\n从那时起，发生了许多变化，Java\
  \ 的 `Bouncy Castle` API 版本经过了两次 `FIPS 140-2` 认证，该项目已从一个兼业爱好转变为现在有一个小组在全职工作并支持的项目。API\
  \ set 已经扩展，增加了如 `Time Stamp Protocol`（时间戳协议）、`TLS` 甚至最近的 `JSSE` 提供者。当时处于尖端的 `Java\
  \ 1.5` 已经结束了生命，而像 `SHA-1` 这样的骨干算法在研究和技术上都已被超越。甚至是许多我们目前认为是安全的算法，现在其密钥大小也急剧增加，即便如此，在量子计算机出现后它们仍然可能变得过时。\n\
  \n因此，我们有些工作需要追赶，而这本书正是尝试做到这一点。除了处理 `Bouncy Castle` API 的更新和增强外，我们还尝试提供这些 API 所基于的一些原始材料和标准。我们这样做是因为，掌握实现背后的背景材料也是重要的。我们大多数人在“实一线”面临的最大问题是生成消息并与其他已经部署的系统进行通信；鉴于此，了解他们应该实现什么，以及有哪些选项或差异，当你面对需要找出你处理的某个黑盒系统到底期待什么时，将会有很大帮助。\n\
  \n### 关于书的一些话\n\n如果你是这个领域的新手，并从这本书开始，请先花时间阅读附录 A。它描述了一种名为 `ASN.1` 的数据描述语言，其起源追溯到\
  \ 20 世纪 80 年代——那是计算史上一个有趣的时代，因为过去如果消息比需要的多一个字节我们就会陷入恐慌。`ASN.1` 也反映了这种“恐慌”，并被用于定义加密协议中使用的各种结构的编码。因此，书中随处都有对\
  \ `ASN.1` 的引用，了解它究竟是什么的会让内容变得更容易理解。\n\n### 关于软件本身的几句话\n\n`Bouncy Castle` 项目自 1999\
  \ 年以来一直运行，并于 2000 年发布了正式版本。虽然 `Bouncy Castle` 慈善机构和加密研讨会的成立意味着人们终于可以全职投入 API 工作，但尽管如此，我们的经验教给我们的一点是：错误是不可避免的。这些可能是我们工作中的错误、描述算法的文档中的错误、协议规范中的错误，以及我们或其他用户解释上的错误。在某些情况下，“错误”可能是完全无法预见的，因为对攻击的发现可能会使之前被认为是安全的算法或协议，下降到仅类似于你在飞艇侧面喷涂秘密并让其飞越国家体育赛场时所能预期的安全水平。这类事情需要持续的警惕。\n\
  \n所有这些事情都会影响我们所提供的库的安全性和兼容性。如果你打算在这个领域工作，请在至少了解你将如何升级的情况下不要部署东西，因为你很可能需要这样做！虽然指责\
  \ `NIST`、`IETF`、某些公司或互联网上的“老家伙”对某个安全问题可以提供暂时的缓解，但如果你无法部署补丁，这对你、你的用户或他们的数据没有任何帮助。\n\
  \n最后，请考虑通过 `Keyfactor` (https://www.keyfactor.com/platform/bouncy-castle-support/)\
  \ 获取支持合同。了解你的补丁来源是有益的，请支持我们，我们将一直在这里为你提供支持！\n\n\n\n\n本章将介绍 Java 中使用的加密 API 架构，以及构建在加密\
  \ API 之上的用于 CMS/SMIME/OpenPGP 的 Bouncy Castle API 架构。文中将提供基础安装说明，并讨论了 `BC FIPS`\
  \ 认证版 API 与普通发行版之间的差异。此外，还将提供适用于所有 API 的随机数使用注意事项，并探讨“安全位”（bits of security）对应用程序和算法的意义。\n\
  \n# Java 提供者架构\n\n与 Java 加密体系（`JCA`）相关的提供者架构（Provider Architecture）为 JVM 中的一系列安全服务提供了基础。这些服务现在包括\
  \ Java 安全套接扩展（`JSSE`），它提供了对安全套接层（SSL）和传输层安全（TLS）实现的访问；Java 通用安全服务（`JGSS`）API 以及简单身份验证和安全层（SASL）API。你还会看到对\
  \ Java 加密扩展（`JCE`）的引用，虽然最初（Java 1.4 之前）它是与 `JCA` 分开捆绑的，但除了少数例外外，现在大多数情况下将其视为 `JCA`\
  \ 的一部分会更好。`JCA` 与 `JCE` 之间这种区分具有意义的情况之一是提供者签名（provider signing），我们稍后会详细介绍。\n\n基础层在提供者架构中通过一组服务类来指定，这些类暴露给开发者，以便提供与已安装的服务提供者交互的统一接口。服务类通过调用在各种服务提供者接口（`SPI`）中定义的方法来提供功能，这些方法是由实际提供者中定义的对象实现的，这些提供者要么随\
  \ JVM 一带，要么由 Bouncy Castle 等其他供应商提供。\n\n![通过 Java 加密架构调用的提供者块视图](img/chapter1----JCADiag.png)\n\
  \n通过 Java 加密架构调用的提供者块视图\n\n提供者架构提供的第一点是，将应用程序开发者通常调用的内容（例如属于 `java.security.Signature`\
  \ 或 `javax.crypto.Cipher` 的方法）与加密服务提供者（如 Bouncy Castle）实际实现的内容进行分离。例如，从开发者的角度来看，创建一个加密器看起来如下：\n\
  \n```\nCipher c = Cipher.getInstance(\"Blowfish/CBC/PKCS5Padding\");\n```\n\n但 Blowfish\
  \ 加密服务的实现者实际上会扩展 `javax.crypto.CipherSpi` 类，正是这个服务提供者接口（`SPI`）对象被封装在 `Cipher` 对象内部，并提供加密器相关的实际工作部分。\n\
  \n提供者架构提供的第二点是允许应用程序部署者决定使用特定算法的哪种供应商实现。这可以通过依赖提供者优先级（provider precedence）来实现，当像示例中调用特定服务的\
  \ `getInstance()` 方法时就是如此。你也可以通过指定提供者名称来要求使用 `getInstance()` 创建的加密服务对象所包含的 SPI 必须来自特定的提供者：\n\
  \n```\nCipher c = Cipher.getInstance(\"Blowfish/CBC/PKCS5Padding\", \"BC\");\n```\n\
  \n或者对于 Java 1.5 及更高版本，通过传递实际的提供者对象：\n\n```\nCipher c = Cipher.getInstance(\n   \
  \             \"Blowfish/CBC/PKCS5Padding\", new BouncyCastleProvider());\n```\n\
  \n## 提供者优先级的工作原理\n\n在没有显式指定提供者的情况下，`JCA` 依赖提供者优先级来确定创建 SPI。\n\n你可以通过以下示例看到这种用法：\n\
  \n```\n 1 /**\n 2  * 一个简单的应用程序，演示了提供者优先级对\n 3  * JVM 返回内容的影响。\n 4  */\n 5 public\
  \ class PrecedenceDemo\n 6 {\n 7     public static void main(String[] args)\n 8\
  \         throws Exception\n 9     {\n10         // 将 BC 添加到优先级列表的末尾\n11       \
  \  Security.addProvider(new BouncyCastleProvider());\n12 \n13         System.out.println(MessageDigest.getInstance(\"\
  SHA1\")\n14                                         .getProvider().getName());\n\
  15 \n16         System.out.println(MessageDigest.getInstance(\"SHA1\", \"BC\")\n\
  17                                         .getProvider().getName());\n18     }\n\
  19 }\n```\n\n如果你编译并运行该示例（假设是标准的 Java 安装），你应该看到如下输出：\n\n```\nSUN\nBC\n```\n\n正如代码注释所示，`addProvider()`\
  \ 方法将提供者添加到优先级列表的末尾，因此默认的 SHA-1 实现来自 `SUN` 提供者，而不是 Bouncy Castle。\n\n当 JVM 启动时，已安装提供者的优先级由\
  \ JVM JDK `java.security` 文件中的优先级表决定。如果你查看的是 Java 1.8 及之前的版本，可以在 `$JAVA_HOME/jre/lib/security`\
  \ 中找到 `java.security` 文件；对于 Java 1.9 及更高版本，文件位于 `$JAVA_HOME/conf/security`。\n\n\
  ## 提供者签名意味着什么？\n\n你可能也见过关于签名提供者（signed providers）的引用。许多 JVM 要求任何加密或密钥交换服务的提供者必须经过\
  \ JCE 签名证书的签名。某些（如 OpenJDK 项目产生的）不需要，但由 Oracle 和 IBM 等机构产生的仍然需要。\n\n如果提供者没有被正确签名，在要求提供者签名的\
  \ JVM 中将拒绝使用该提供者的任何 JCE 功能（注意，这不包括签名和消息摘要）。在大多数情况下，这并不需要担心，因为构建自己的提供者是不常的，但如果你确实要这样做，就需要申请\
  \ JCE 签名证书。在我们 Bouncy Castle 的情况下，我们已经申请了签名证书，并使用 Oracle 颁发的证书，这使得普通的 Bouncy Castle\
  \ 提供者和 Bouncy Castle FIPS 提供者都能与标准 JVM 工作。\n\n注意：JCE 签名证书与普通的代码签名证书完全不同。在需要的情况下，你需要按照随\
  \ Java 发行版附带的文档《如何在 Java 加密架构中实现提供者》中“获取代码签名证书”部分的描述进行操作。\n\n## 管辖策略文件（Jurisdiction\
  \ Policy Files）\n\n与需要签名提供者一样，某些 JVM（例如 Oracle 和 IBM 的）的 JCE 实现对算法和密钥大小也有限制。这些限制是由管辖策略文件（Jurisdiction\
  \ Policy files）强制的。假设你需要比这些限制更大的密钥，如果你在 Java 1.9 之前的 JVM 上运行，可能需要安装无限制策略文件（从 Java\
  \ 1.9 开始，管辖策略文件的默认变为无限制）。\n\n你通常可以在下载 JDK/JRE 的同一个地方找到无限制策略文件。通常位于名为“Unlimited Strength\
  \ Jurisdiction Policy Files”的链接处。下载通常是一个 ZIP 文件，如果合法可以下载，你应该下载并解压它。你会在 ZIP 中看到几个\
  \ jar 文件和一个 README。按照说明操作即可准备就绪。如果你使用包管理器（如 `apt`）安装 JDK/JRE，你通常会发现也有一个包含无限制策略文件的包可以安装。\n\
  \n\n\n\n在你的开发 `JVM` 以及与生产环境中操作相关的任何 `JVM` 中都安装无限制策略文件（unrestricted policy files）是非常重要的。在\
  \ Linux 或其他 Unix 变体上，这通常意味着你需要 root 权限，或者需要拥有 root 权限的人员来安装这些策略文件。这在 Windows 上尤为重要，因为常规的\
  \ JDK 安装通常会安装两个独立的 JVM —— 一个用于 JDK，另一个用于通用的 Java 运行时。在这种情况下，你需要确保这两个 JVM 中都安装了策略文件。\n\
  \n在 Java 1.5 之后，测试策略文件是否存在的最简单方法是使用 Java 工具 `$JAVA_HOME/bin/jrunscript`：\n\n```\n\
  jrunscript -e 'print (javax.crypto.Cipher.getMaxAllowedKeyLength(\"AES\") >= 256);'\n\
  ```\n\n如果你尝试在 Java 1.5 或更早版本上执行此操作，你需要编写一个小型应用程序。以下代码通常可以完成任务：\n\n```\n 1 /**\n\
  \ 2  * 一个用于检查无限制策略文件的简单应用程序。\n 3  */\n 4 public class PolicyFileCheck\n 5 {\n 6\
  \     public static void main(String[] args)\n 7         throws NoSuchAlgorithmException\n\
  \ 8     {\n 9         try\n10         {\n11             Cipher cipher = Cipher.getInstance(\"\
  Blowfish/ECB/NoPadding\", \"BC\");\n12 \n13             cipher.init(Cipher.ENCRYPT_MODE,\n\
  14                     new SecretKeySpec(new byte[32], \"Blowfish\"));\n15 \n16\
  \             System.out.print(\"true\");\n17         }\n18         catch (NoSuchAlgorithmException\
  \ e)\n19         {\n20             throw e;\n21         }\n22         catch (Exception\
  \ e)\n23         {\n24             System.out.print(\"false\");\n25         }\n\
  26     }\n 27 }\n```\n\n上述两种方法都旨在根据是否存在无限制策略文件来显示单个“true”或“false”，尽管如果不存在 `Blowfish`\
  \ 算法，第二种方法也会抛出 `NoSuchAlgorithmException`。在 Blowfish 不存在的极少数情况下，你需要将算法选择更改为其他可用且代表你实际计划使用的算法。\n\
  \n### 标准提供者集合\n\nJava 1.4 默认有五个提供者：标准的 JCA 提供者、一个 JSSE 提供者、一个 RSA 签名提供者、一个 JCE SPI\
  \ 提供者（用于加密算法、MAC 和密钥协商算法）以及一个 JGSS 的提供者。\n\n从 Java 1.9 开始，现在有十二个。所有以前的提供者，加上椭圆曲线（Elliptic\
  \ Curve）、XML 签名、LDAP、简单身份验证和安全层（SASL - 有两个）、用于智能卡的 PC/SC 提供者，以及用于硬件安全模块（HSMs）的 PKCS11\
  \ 提供者。\n\n你可能看到的具体将取决于你查看的是哪个版本的 `JVM` 以及哪个发行版。我们将在下一节中看到，通过少量的代码，就可以更清晰地了解默认可用的内容。\n\
  \n### 检查提供者及其能力\n\n可用的提供者也可以标准的 Java API 访问。以下程序显示了 Java 运行时安装的提供者列表，并将它们的名称和“info”字符串作为输出。\n\
  \n```\n 1 /**\n 2  * 用于列出已安装提供者及其可用信息的简单应用程序。\n 3  */\n 4 public class ListProviders\n\
  \ 5 {\n 6     public static void main(String[] args)\n 7     {\n 8         Provider[]\
  \ installedProvs = Security.getProviders();\n 9 \n10         for (int i = 0; i !=\
  \ installedProvs.length; i++)\n11         {\n12             System.out.print(installedProvs[i].getName());\n\
  13             System.out.print(\": \");\n14             System.out.print(installedProvs[i].getInfo());\n\
  15             System.out.println();\n16         }\n17     }\n 18 }\n```\n\n通过显示每个提供者携带的查找表，也可以获取提供者所实现的算法的“人类可读”列表。以下程序将打印出可用算法，以及可能存在的别名以及这些别名解析到的算法。\n\
  \n```\n 1 /**\n 2  * 用于列出提供者能力（包括别名名称）\n 3  * 的简单应用程序。\n 4  * <pre>\n 5  *     usage:\
  \ chapter1.ListProviderCapabilites provider_name\n 6  * </pre>\n 7  */\n 8 public\
  \ class ListProviderCapabilities\n 9 {\n10     public static void main(String[]\
  \ args)\n11     {\n12         if (args.length != 1)\n13         {\n14          \
  \   System.err.println(\n15                 \"usage: chapter1.ListProviderCapabilites\
  \ provider_name\");\n16             System.exit(1);\n17         }\n18 \n19     \
  \    Provider provider = Security.getProvider(args[0]);\n20 \n21         if (provider\
  \ != null)\n22         {\n23             for (Iterator it = provider.keySet().iterator();\
  \ it.hasNext();)\n24             {\n25                 String entry = (String)it.next();\n\
  26                 boolean isAlias = false;\n27 \n28                 // 别名项引用另一个条目\n\
  29                 if (entry.startsWith(\"Alg.Alias\"))\n30                 {\n\
  31                     isAlias = true;\n32                     entry = entry.substring(\"\
  Alg.Alias\".length() + 1);\n33                 }\n34 \n35                 String\
  \ serviceName = entry.substring(0, entry.indexOf('.'));\n36                 String\
  \ name = entry.substring(serviceName.length() + 1);\n37 \n38                 if\
  \ (isAlias)\n39                 {\n40                     System.out.print(serviceName\
  \ + \": \" + name);\n41                     System.out.println(\" (alias for \"\
  \ + provider.get(\"Alg.Alias.\" + entry) + \")\");\n42                 }\n43   \
  \              else\n44                 {\n45                     System.out.println(serviceName\
  \ + \": \" + name);\n46                 }\n47             }\n48         }\n49  \
  \       else\n50         {\n51             System.err.println(\"provider \" + args[0]\
  \ + \" not found\");\n52             System.exit(1);\n53         }\n54     }\n 55\
  \ }\n```\n\n### Bouncy Castle API 架构\n\nBouncy Castle 最初作为一个支持 J2ME 平台加密的项目开发的。在整合基础\
  \ API 后，显然可以使用这些组件构建一个支持 JCA 和 JCE 描述的提供者架构的高级 API。\n\n随着项目的进展，显然还需要支持如 CMS、S/MIME\
  \ 和 X.509 证书生成等更高级别的 API。\n\n对于高级 API 有两种尝试。第一次尝试与 BC 提供者和 JCA 密耦合。第二次尝试（从 BC 1.46\
  \ 开始）引入了提供不同 API 所需“粗粒操作”的接口。与基础提供者/底层划分相结合，使得不同 API 的布局如下所示。\n\n![Bouncy Castle\
  \ API 的高层布局 (FIPS 和通用)](img/chapter1----BCArchDiag.png)\n\nBouncy Castle API 的高层布局\
  \ (FIPS 和通用)\n\n分层方法使得两种情况成为可能：程序可以使用轻量级 API 编写，因此 BC 提供者不再是强制性的；而且虽然图没有没有这一点，但可以使用来自不同供应商的其他\
  \ JCA/JCE 提供者，在必要时甚至可以使用多个提供者。因此，在许多情况下，BC API 在 HSM 中的运行效果与使用 BC Provider 一样良好。\n\
  \n#### BC Core API\n\n\n\n\n\nBC 核心 API 的主体位于 `org.bouncycastle.crypto` 包中，传统上这被描述为轻量级（light-weight）API。在今天将其描述为轻量级库可能看起来很奇怪（坦率地说，在\
  \ 17 年之后，虽然它并不算臃肿，但已经变得相当大），该库最初的设计初衷是作为一种可以轻松子集并在小型设备上运行的。在早期，大多数情况下，甚至方法参数都没有经过校验。在大多数设备上，并没有足够的空间来实现此类“奢侈”功能。\n\
  \n轻量级库旨在提供一种“代数”，允许不同的加密算法和摘要与不同的编码、模式、MAC 和签名算法进行混合组合。需要指出的是，这种可以进行混合的方式其灵活性比防止产生不安全组合的实际需求要高得多。如果你打算使用轻量级\
  \ API，最好对你正在做什么有非常清楚的了解，或者实现一种源自可靠人员之手的算法/模式组合。\n\nBC 核心 API 还包括一个 ASN.1 库，它提供了一系列支持不同协议元素的低级类，涵盖了从密钥编码到时间戳和数字签名的所有内容。ASN.1\
  \ 库中的类被设计为可以在任何 BC 轻量级加密 API 可使用的平台上运行。\n\n## BC Provider\n\nBC 轻量级 API 提供了一个足够构建\
  \ JCA/JCE 提供者的足够构建块，因此，BC Provider 是由轻量级类构建的。这导致了轻量级 API 的某些部分向 JCA 的世界观倾斜，但它意味着\
  \ Bouncy Castle 的实际算法支持仍然集中在少数包中，BC Provider 的大部分部分实际上只是提供基础设施，以便让轻量级类通过核心 JCA 和\
  \ JCE 中定义的服务提供者接口（SPI）接口呈现出来，并使用 BC ASN.1 库来描述任何协议组件，例如需要为 JCA 生成的密钥编码和算法参数。\n\n\
  ## 支持的 APIs\n\nBC 加密 API 包含了对处理 CMS、PKCS#10、PKCS#12、S/MIME、OpenPGP、DTLS、TLS、OCSP、TSP、CMP、CRMF、DVCS、DANE、EST、PEM/OpenSSL、X.509\
  \ 证书以及 X.509 属性证书的支持。除了 OpenPGP 的 API 外，这些 API 都是基于 ASN.1 构建的协议，并且它们提供了 BC 核心 ASN.1\
  \ 库提供的包级对象无法满足的高级功能。\n\n这些 API 构建在一组操作符接口之上，并设计为与 JCA/JCE 无关（agnostic），这意味着可以与任何提供者一起工作，并且也可以与不使用\
  \ JCE 或 JCA 的 Java 加密 API 使用。API 自带了针对 JCA/JCE 以及 BC 轻量级 API 实现的操作符。不同的操作符包可以通过与其相关的包名来区分，JCA/JCE\
  \ 操作符都在以 `.jcajce` 结尾命名的包中，而 BC 轻量级包都在以 `.bc` 结尾命名的包中。\n\n支持的 APIs 分为 4 个 jar 文件：\n\
  - `bcpkix` 集，包含所有与证书、CMS 和 TSP 相关的内容\n- `bcpg` 集，包含 OpenPGP API\n- `bcmail` 集，包含\
  \ S/MIME API。\n- `bctls` 集，包含 TLS API 和 BCJSSE 提供者。\n\n## Bouncy Castle FIPS 发行版\n\
  \nBouncy Castle FIPS 发行版完全基于通过 FIPS 140-2 1 级认证的代码构建，其提供是为了允许人们为需要使用 FIPS 合规性或实际\
  \ FIPS 合规的环境开发应用程序。它们还被用作其他 FIPS 认证的基础，并为如通用标准（Common Criteria）之类的认证提供了基础。\n\n###\
  \ FIPS 发行版的区别\n\nFIPS 发行版与常规 BC 发行版之间有两个主要区别。\n\n第一个区别是常规 BC 库中等同于轻量级 API 的被隐藏了。这是因为\
  \ FIPS 标准要求底层支持被锁定，以便开发者的访问只能通过已知的路径进行，因此提供可以任意组装的轻量级 API 以执行高级功能的通用 BC 方法过于开放了。仍然存在一个低级\
  \ API，它与 BC FIPS 提供者具有类似的关系，但它比通用 BC API 中提供的要僵硬得多。\n\n第二个区别是该发行版能够在两种模式下运行：仅批准模式（approved-only\
  \ mode），即只有 FIPS 批准的算法可用；以及非批准模式（non-approved mode），可以使用提供者实现的完整算法集。\n\n还有第三个较小的区别：并不是\
  \ Bouncy Castle 常规发行版中实现的所有内容在 FIPS 发行版中都是可用的。部分原因是由于最初的设计决策，在 FIPS 发行版中仅尝试支持在至少一个当前\
  \ IETF 标准中提到的算法。另一个考虑因素是，由于认证要求，向 FIPS 发行版中添加任何内容都要困难得多且昂贵。无论如何，如果你发现任何你认为应该包含的缺失内容，请务必告诉我们，但请理解需要耐心！\n\
  \n### BC FIPS 提供者\n\nBCFIPS 提供者有 3 个变体，其中两个是因为 Android。主发行版是 BCFIPS，它位于 `org.bouncycastle`\
  \ 包下，并针对特定的 JVM 版本进行了认证。下一个发行版位于 `org.stripycastle` 包下，并通常预装在 Android 设备上 - - 这一个通过\
  \ SCFIPS 名称访问。最后是一个可以作为应用程序 DEX 文件的 Android 版本。最后一个版本遵循 Roberto Tyley 的 `org.spongycastle`\
  \ 约定。\n\n目前，在使用 SCFDEX 提供者时，DEX 应用需要针对特定平台进行明确认证才能符合 FIPS 标准。SCFDEX 主要被那些需要证明自己运行在\
  \ FIPS 认证代码库上的开发者使用，而不是需要证明结果代码通过了 FIPS 认证。\n\nBouncy Castle FIPS 提供者名称和提供者类\n\n\
  | 名称 | 提供者类 | 平台 |\n| --- | --- | --- |\n| BCFIPS | `org.bouncycastle.jcajce.provider.BouncyCastleFipsProvider`\
  \ | 通用 JVM |\n| SCFIPS | `org.stripycastle.jcajce.provider.StripyCastleFipsProvider`\
  \ | Android |\n| SCFDEX | `org.spongycastle.jcajce.provider.SpongyCastleFipsProvider`\
  \ | Android |\n\n### BC FIPS 支持的 APIs\n\n支持的 APIs 同样可用，尽管在编写时它们大部分依赖于提供者的使用。虽然 API\
  \ 中不同操作接口的实现遵循通常的 `jcajce` 包约定，但并没有像常规 API 集那样的使用低级 API 的对应 `bc` 包实现。\n\n对于 BCFIPS，4\
  \ 个 jar 文件以 `bcpkix-fips`（PKIX API 集）、`bcmail-fips`（基于 PKIX 的 S/MIME API 集）、`bcpg-fips`（OpenPGP\
  \ API 集）和 `bctls-fips`（TLS API 集）开头。\n\n对于 SCFIPS，4 个 jar 文件以 `scpkix-fips`（PKIX\
  \ API 集）、`scmail-fips`（基于 PKIX 的 S/MIME API 集）、`scpg-fips`（OpenPGP API 集）和 `sctls-fips`（TLS\
  \ API 集）开头。\n\n\n\n\n\n对于 SCFDEX，4 个 jar 包分别为 `scpkix-fipsdx`（PKIX API 集）、`scmail-fipsdx`（基于\
  \ PKIX 构建的 S/MIME API 集）、`scpg-fips`（OpenPGP API 集）和 `sctls-fipsdx`（TLS API 集）。\n\
  \n注意的是，这种情况与通用 API 的另一个不同之处在于，当 FIPS 提供者被配置为“仅批准（approved-only）”模式时，并非所有支持的 API\
  \ 支持的算法都是可用的。\n\n# 安装 Bouncy Castle\n\n向 JVM 中安装加密提供者有两种方法。你可以在运行时手动添加它，方法是通过实际添加提供者，也可以通过将提供者对象传递给尝试创建的服务的\
  \ `getInstance()` 方法来基于“按需”的方式调用它。选择哪种方法取决于你的具体情况，但如果通过配置 Java 运行时来安装提供者，出现问题的概率会较低。\n\
  \n请注意，虽然以下说明在涉及特定提供者时是基于 BC 提供者的背景给出的，相同的说明（除提供者配置相关的说明外）同样适用于 BC FIPS 提供者以及大多数其他提供者。\n\
  \n### 静态安装\n\n静态安装提供者的方法取决于你处理的是否 Java 1.9 之前的 JVM。\n\n对于 Java 1.4 到 Java 1.8，你可以通过将其类名插入\
  \ `$JAVA_HOME/jre/lib/security` 中 `java.security` 文件的列表中来添加提供者。提供者列表是一系列格式为“security.provider.n”的条目，其中\
  \ n 是提供者的优先级数字，1 表示该提供者的优先级最高。在这种情况下，添加 Bouncy Castle 需要添加一行如下格式的配置：\n\n```\nsecurity.provider.N=org.bouncycastle.jce.provider.BouncyCastleProvider\n\
  ```\n\n其中 N 代表你希望 BC 提供者拥有的优先级。如果你没有将 BC 提供者添加到列表末尾，请确保调整了其他提供者的值。此之后，你需要确保提供者在类路径上，最好放在\
  \ `$JAVA_HOME/jre/lib/ext` 目录下，这样它将始终由 JCA 信任的类加载器加载。\n\n对于 Java 1.9 及更高版本，列表位于\
  \ `$JAVA_HOME/conf/security` 文件中。目前 BC 提供者不支持 jar 包的 `META-INF/service` 功能，因此需要按照之前的方式添加提供者，但要使用提供者的名称“BC”或“BCFIPS”添加到提供者列表中。\n\
  \nJava 1.9 不再支持 `$JAVA_HOME/jre/lib/ext`。在 Java 1.9 的情况下，你只需要确保 BC 包含在类路径中。\n\n\
  ## 运行时安装\n\n运行时使用提供者有两种方法。\n\n第一方法是使用 `java.security.Security` —— 对于 BC 提供者，如下所示：\n\
  \n```\njava.security.Security.addProvider(\n             new org.bouncycastle.jce.provider.BouncyCastleProvider());\n\
  ```\n\n执行上述语句后，JVM 中的情况几乎与静态安装提供者发生的情况等效。消息摘要等服务可以通过使用提供者名称的 `getInstance()` 方法来访问。\n\
  \n使用第二种方法，将提供者对象传递到所请求的服务中，例如，要使用 BC 提供者为 Blowfish 创建 Cipher，你可以这样写：\n\n```\nCipher\
  \ c = Cipher.getInstance(\"Blowfish/ECB/NoPadding\",\n                         \
  \                   new BouncyCastleProvider());\n```\n\n## 提供者配置\n\n配置提供者有三种方法：\n\
  \n* 使用系统属性\n* 向提供者的构造函数传递字符串\n* 调用某些配置对象\n\n不同的 Bouncy Castle 提供者（BC、BCFIPS 和 BCJSSE）都使用了这些方法。\n\
  \n### 配置 BC Provider\n\nBC Provider 支持三个系统属性：\n\n`org.bouncycastle.asn1.allow_unsafe_integer`\n\
  允许接受扩展的 ASN.1 整数。在这种情况下，扩展意味着符号位已通过整个字节进行编码。\n\n`org.bouncycastle.ec.disable_mqv`\n\
  从提供者和轻量级 API 中移除 EC MQV 实现。\n\n`org.bouncycastle.dsa.FIPS186-2for1024bits`\n这是一个旧属性，允许使用\
  \ FIPS 186-2 中的算法生成 1024 位 DSA 密钥。\n\n### 配置 BCFIPS Provider\n\nBCFIPS Provider\
  \ 支持通过字符串构造函数参数以及系统属性进行配置。\n\n该提供者可以配置为创建特定形式的 DRBG，和/或在构造时为 DRBG 提供熵池。例如，要使用 `java.security`\
  \ 文件条目为 BCFIPS 配置熵池，你需要如下所示写入条目：\n\n```\norg.bouncycastle.jcajce.provider.BouncyCastleFipsProvider\
  \ C:HYBRID;ENABLE{All};\n```\n\n`HYBRID` 命令是导致熵池构建的关键字。该配置字符串也可以在运行时通过调用 `BouncyCastleFipsProvider`\
  \ 构造函数并将配置字符串作为参数来传递，如下：\n\n```\nnew BouncyCastleFipsProvider(\"C:HYBRID;ENABLE{All};\"\
  )\n```\n\nBCFIPS Provider 还支持许多系统属性，包括\n\n`org.bouncycastle.ec.disable_mqv` 和 `org.bouncycastle.dsa.FIPS186-2for1024bits`。\n\
  \n### 配置 BCJSSE Provider\n\n类似于 BCFIPS Provider，BCJSSE Provider 也支持使用参数和系统属性进行配置。要将\
  \ BCJSSE 置于 FIPS 模式，也是通过构造函数的字符串参数实现的，因此对于静态安装的情况，`java.security` 中的赋值如下：\n\n```\n\
  org.bouncycastle.jsse.provider.BouncyCastlesProvider fips:BCFIPS\n```\n\n注意在这种情况下使用了两个独立的设置。第一个\
  \ `fips` 开启了 BCJSSE 的 FIPS 模式，这意味着将使用符合 FIPS 标准的密码套和参数。第二个 `BCFIPS` 表示使用 BCFIPS\
  \ Provider 提供加密服务。当你寻求 BCFIPS Provider 的 FIPS 合规性时，可以使用此配置。\n\n## 基础故障排除\n\n在配置了提供者、设置了策略文件并选择了安装提供者的方法后，你应该准备好使用\
  \ Bouncy Castle 提供者。然而，下节提供了一些常见问题的解决方案。\n\n### 提供者未正确安装\n\n如果你通过名称访问服务，可能会看到类似的内容（在此情况下提供者名称为“BC”）：\n\
  \n```\njava.security.NoSuchProviderException: No such provider: BC\n\tat javax.crypto.Cipher.getInstance(Cipher.java:593)\n\
  ```\n\n在这种情况下，提供者没有被正确安装。如果你预期它是静态安装的，你需要检查 `java.security` 文件；否则，你需要确保执行预期的运行时安装代码在尝试调用提供者服务之前执行。\n\
  \n### 提供者未正确签名\n\n如前所述，如果包含提供者的 jar 包没有正确签名，当尝试使用 JCE 功能时，JCE 将拒绝它。如果你看到：\n\n```\n\
  java.lang.SecurityException: JCE cannot authenticate the provider BC\n\tat javax.crypto.Cipher.getInstance(Cipher.java:657)\n\
  \tat javax.crypto.Cipher.getInstance(Cipher.java:596)\n```\n\n\n\n\n提供者 jar 包未签名，或者由于某种原因加载到了\
  \ JCE 不信任的类加载器中。如果发生这种情况，你需要检查提供者 jar 包已签名，并且可能需要检查类路径，以确保提供者 jar 包出现在系统类加载器可能信任的位置。\n\
  \n## JCE 策略文件问题\n\n如果你看到类似下面的错误：\n\n```\njava.security.InvalidKeyException: Illegal\
  \ key size or default parameters\n\tat javax.crypto.Cipher.checkCryptoPerm(Cipher.java:1026)\n\
  \tat javax.crypto.Cipher.implInit(Cipher.java:801)\n\tat javax.crypto.Cipher.chooseProvider(Cipher.java:864)\n\
  \tat javax.crypto.Cipher.init(Cipher.java:1249)\n\tat javax.crypto.Cipher.init(Cipher.java:1186)\n\
  ```\n\n或者以以下内容开头的异常堆栈：\n\n```\njava.lang.SecurityException: Unsupported keysize\
  \ or algorithm parameters\n```\n\n如果你在 Java 1.8 之前的 JVM 上运行，这通常意味着为运行应用程序的 JVM 正确安装\
  \ JCE 的无限制管辖区策略文件，你应该下载并安装这些策略文件。如果你使用的是 Java 1.8 或更高版本，问题将由于 `lib/security/java.security`\
  \ 文件中 `crypto.policy` 属性的值。如果你希望充分利用 BC 提供者，需要将该值设置为“unlimited”。从 Java 1.8 Update\
  \ 161 开始，`crypto.policy` 的默认值为“unlimited”，之前的版本为“limited”。在 Java 1.9 及更高版本中，需要检查的文件是\
  \ `conf/security/java.security`，且 `crypto.policy` 的默认值为“unlimited”。\n\n## 提供者似乎挂起\n\
  \n如果发生这种情况，你可能遇到了熵耗尽（entropy exhaustion）的情况，详情请参见下一节“关于熵的几点”。\n\n### 关于熵的几点\n\n\
  对于像 Bouncy Castle 这样的纯软件提供者来说，熵生成是一个问题，主要原因是提供者无法自行生成熵，因此必须依赖外部熵源。\n\n对于 Bouncy\
  \ Castle，BC 和 BCFIPS 提供者都会使用 JVM 的熵源，除非提供了另一个源。数据随后将通过 DRBG（确定性随机数生成器）进行过滤。\n\n\
  JVM 使用的熵源会有所不同，例如在 Linux 上，它通常被设置为“/dev/random”，这可能会导致阻塞。通常安装“rng-tools”或类似的等效工具可以解决这个问题，因为它还会暴露任何支持\
  \ RNG 生成的底层硬件，以用于为“/dev/random”提供种子。在某些虚拟环境中，硬件 RNG 可能永远不可，在这种情况下，找到其他方法为你的 JVM\
  \ 提供熵是非常重要的。这些方法取决于你所使用的环境。\n\n### 从提供者获取 SecureRandom\n\nBC 和 BCFIPS 提供者包含两个 SecureRandom\
  \ 服务。\n\n可以通过以下方式访问 `DEFAULT` 服务：\n\n```\nSecureRandom random = SecureRandom.getInstance(\"\
  DEFAULT\", \"BC\");\n```\n\n`DEFAULT` 服务适用于生成密钥、IV（初始化向量）和随机 nonce（随机数）。在内部，它处于预测抗性模式（prediction\
  \ resistant mode），在处理每个请求之前都会重新种子。这确保了底层的 DRBG（默认基于 SHA-512）能够产生尽可能噪声的输出。\n\n第二个服务是\
  \ `NonceAndIV` 服务。可以使用以下方式创建 `NonceAndIV` 服务：\n\n```\nSecureRandom random = SecureRandom.getInstance(\"\
  NonceAndIV\", \"BC\");\n```\n\n`NonceAndIV` 服务与 `DEFAULT` 服务的区别在于它只定期重新种子。这减轻了对熵源的压力，目前被认为用于\
  \ IV 和随机 nonce 是的，但它不满足生成密钥的种子要求。\n\n### 手动构建 SecureRandom\n\n你也可以在普通的 BC API 和\
  \ BCFIPS API 中手动构建符合 SP 800-90A [33] 风格 DRBG 的 SecureRandom。这允许对 nonce、类型、个性化数据甚至熵源进行自定义。\n\
  \n由于 FIPS 的要求，BC 和 BCFIPS API 的构建细节略有不同。在普通的 BC API 中，你可以如下所示构造基于哈希算法的 SecureRandom\
  \ 对象：\n\n```\nSP800SecureRandom random =\n        new SP800SecureRandom(new SecureRandom(),\
  \ true)\n                 .setPersonalizationString(\n                       Strings.toByteArray(\"\
  My Bouncy Castle SecureRandom\"))\n                 .buildHash(new SHA512Digest(),\
  \ null, false);\n```\n\n注意在上述情况下，nonce 为 `null`，且预测抗性被设置为 `false`。最后一点意味着通常这会使 DRBG\
  \ 不利于生成密钥，因为它在请求之间不会进行重新种子。对于密钥和私钥的生成，你通常希望将预测抗性设置为 true。\n\nBC FIPS API 中的等效代码如下：\n\
  \n```\nFipsDRBG.Builder rBuild =\n       FipsDRBG.SHA512.fromEntropySource(new SecureRandom(),\
  \ true)\n                      .setPersonalizationString(\n                    \
  \       Strings.toByteArray(\"My Bouncy Castle SecureRandom\"));\n\nFipsSecureRandom\
  \ random = rBuild.build(null, tv.predictionResistance());\n```\n\n在两种情况下，传递用于初始化的\
  \ SecureRandom 都不被直接使用，只使用了其 `generateSeed()` 方法。\n\n## 为什么这很重要\n\n拥有良好的熵源很重要，因为归根结底，它影响你创建的任何密钥的安全性，以及任何参数（如初始化向量）的真实随机性。\n\
  \n尽管如此，Unix 风格操作操作系统上的 JVM 通常配置 `/dev/random` 为默认值，当系统耗尽熵时，它通常会阻塞。还有一个额外的随机源 `/dev/urandom`（注意名称不同），它在熵耗尽时不会阻塞。\n\
  \n有些领域认为 `/dev/urandom` 可能足够了——但在本文写作时的事实是，如果你在使用 FIPS，`/dev/urandom` 至少不是。原因有两个：对大多数系统上已经进行的熵评估使用的是\
  \ `/dev/random`，以及一个简单的事实：生成糟糕的密钥实际上比没有密钥更没用——你最好等一下。是的，在加密私密信息时服务器阻塞的威胁是痛苦的，但与你开始使用低质量密钥加密内容导致客户端数据泄露可能发生的情况相比，那感觉就像是天堂里的永恒。\n\
  \n要做的第一件事是在可能的情况下安装硬件 RNG 支持，或者如果你使用的是暴露硬件 RNG 的虚拟环境，安装最接近硬件 RNG 支持的工具。\n\n你可以做的第二件事是使用基于有效\
  \ DRBG 的熵池——普通的 BC 提供者默认使用此类，BC FIPS 提供者实际上期望熵源能跟上随机性请求，但允许配置熵池（详情见提供者配置部分）。\n\n\
  最后，如果你尝试从其他系统为你的 DRBG 提取熵，请记住 RFC 4086“安全随机性要求”[86]、SP 800-90B“用于随机位生成的熵源建议”[34]\
  \ 的内容以及“黄金法则”：即使你从某处获取的值有 64 位，它也可能只代表几位的实际熵。\n\n#### 安全位数\n\n你将在不同的章节以及互联网上的其他文档中看到关于安全强度位数（bits\
  \ of security strength）的引用。目前你看到的数值将来自 80、112、128、192 和 256 位。正如你可能想的那样，数字越大越好。\n\
  \n\n\n\n对于大多数算法而言，这些数字试图提供一种计算难度的衡量，或者对于理想的对称加密算法，提供暴力破解攻击的复杂度。如果某个算法的评级为 ![2^{80}](img/leanpub_equation_0.png)，那么假设是执行对其的有效攻击需要\
  \ ![2^{80}](img/leanpub_equation_1.png) 次操作。\n\n随着计算机变得越来越快，像 ![2^{80}](img/leanpub_equation_2.png)\
  \ 这样的数字已不再代表它们曾经面临的挑战。如今，人们普遍认为应该使用安全强度至少为 112 位算法；如果预计应用程序处理的数据在 6 年后仍需要安全，则应使用更高的强度（128\
  \ 位更高）。`SP 800-57 Part 1 (Revision 4)` 的第 5.6.2 节 [32] 讨论了选择用于应用程序算法时应考虑的因素。对于决策的另一种不同但相似的观点，还有欧盟网络和信息安全局（ENISA）发布的报告\
  \ [50]\n\n### 总结\n\n在本章中，我们查看了 `JCA/JCE` 的架构以及提供者优先级的工作原理。我们还查看了 `JCA/JCE` 的不同 `Bouncy\
  \ Castle` 提供者的架构，以及如何安装和配置它们。此外，还查看了针对 `JSSE` 的 Bouncy Castle 提供者的 FIPS 和非 FIPS\
  \ 配置。\n\n我们还查看了一份可能发生的常见问题列表及其指示。希望这些内容足够让你上手并运行，以便你完成书中其余部分的示例。\n\n最后，我们还查看了影响\
  \ Java 中加密提供者使用的一个细微的配置/设置问题。即用于密钥和私钥生成的可用随机数的质量。虽然高质量的随机数源是一个很大且见的益处，但它非常重要。在 `FIPS`\
  \ 提供者的情况下，由于最佳 RNG（随机数生成器）源可能会导致性能问题，请不要忘记检查硬件 RNG 支持。在不支持的情况下，不要忘记也可以配置 `BCFIPS`\
  \ 提供者来使用熵池。\n\n## 第 2 章：分组密码与流密码\n\n本章介绍了用于通过对称密码进行加密的 `Java APIs`。你会看到使用对称密码加密数据的两种不同方法：一种基于“电子密码”（virtual\
  \ code-books），另一种基于将消息与密码的密钥流混合。我们还将讨论基本模式的密码配置，以及密钥和其他参数的输入和生成。最后，我们将查看哪些内容可以方便在输入/输出流上更使用密码。\n\
  \n### 基础知识\n\n对称密码依赖于使用秘密密钥来加密数据。将密钥泄露给不应该拥有它的人，游戏就结束了。我们将在书的后面部分讨论交换密钥的方法，但由于对称密码为我们提供了处理大量数据加密所需的手段，在担心其他任何问题之前，先查看它们是值得的。\n\
  \n### 算法安全强度\n\n经过适当分析，对称密码的安全强度以安全位（bits）来描述。\n\n如今，如果你想确保安全，通常认为你的密码至少应该具有 112\
  \ 位安全强度。`NIST` 目前推荐的两种对称密码 `AES` 和 `Triple-DES` 的估计安全强度所示在 `NIST SP 800-57` 的表 2\
  \ 中 [32]。你可以从下方看到。\n\nNIST 对称密码安全强度\n\n| 算法 | 密钥大小 | 安全强度（位） |\n| --- | --- | ---\
  \ |\n| 2 密钥 Triple-DES | 112 | <= 80 |\n| 3 密钥 Triple-DES | 168 | 112 |\n| AES |\
  \ 128 | 128 |\n| AES | 192 | 192 |\n| AES | 256 | 256 |\n\n理想情况下，对称密码对于给定密钥大小的安全强度应由所使用的密钥大小反映。从上表可以看出\
  \ `AES` 就是这样一种密码，但你从 `Triple-DES` 看出并非总是如此。如果你打算使用其他算法，值得检查文献，以确保你构思的密钥大小/算法组合准确反映了你认为应用程序所需的安全位。\n\
  \n#### 如何保住秘密\n\n在进行任何涉及对称秘密密钥的操作之前，重要的是意识到“不告知”秘密密钥只是影响密钥有效寿命的因素之一。至少还有其他三个考虑因素需要留心中。\n\
  \n##### 密钥是如何生成的\n\n密钥的质量取决于用于生成密钥的随机数据的熵。虽然找到一个能产生（例如）64 位的随机值生成器很棒，但如果这些位全为 1\
  \ 或全为 0，那么就只有 1 位熵。猜一个这种方式生成的秘密密钥将非常容易。\n\n##### 数据量和密钥的使用次数\n\n尽管有其他考虑因素，通用的规则是最大块数约为\
  \ ![2^{2}}](img/leanpub_3.png)^(1)。至少你应该计划在处理完总块数之前更换密钥。\n\n##### 与密钥和密码模式相关的参数\n\
  \n大多数密码模式都涉及非重数（nonce）和初始化向量（IV）的使用。在某些模式中（如 `GCM`），重用 IV 对安全可能是致命的。请明智地生成任何参数！这一切意味着什么？答案是确保在生成密钥时使用高质量的熵。\n\
  \n\n\n\n可能会返回任何内容。它将是 `AES`，但是否需要参数、一个 `IV`，甚至于某种模式对于你正在尝试的操作是安全的，无人能预知。\n\n在流加密的情况下，你通常只会看到\
  \ `cipher_name`，因为流加密不包含关联的模式（modes）或填充（paddings）。\n\n### 块加密\n\n在“过去的好时光”，人们经常使用密码本（code-books）来加密消息，其中一个字符串会被替换为密码本指定的某些字符串。\n\
  \n从根本上说，块加密提供了一种动态生成此类密码本条目的机制，其替换是根据代表所用块加密位大小的位字符串完成的。\n\n![加密模式下的基础块加密](img/chapter2----BasicBlockCipher.png)\n\
  \n加密模式下的基础块加密\n\n显然，生成随机条目并没有什么用，因此块加密使用其初始化时的密钥密钥来确保其生成的密码本条目是确定性的。我的意思是，一个代表加密器输入块的\
  \ b 位字符串始终将映射到虚拟密码本中相同（但可能不同的）对应的 b 位字符串。加密器的输入通过虚拟密码本进行映射，产生相应的输出。\n\n附录 C 中有 Bouncy\
  \ Castle 支持的块加密列表。\n\n### 块模式\n\n块加密的模式分为四类：基于块的模式、可用于流的模式、认证模式以及密钥封装（key wrapping）模式。我们将在本章剩余部分介绍基于块的模式和流模式。认证模式和密钥封装基于这些模式之上，我们将在第三章查看这些模式。\n\
  \n#### ECB 模式\n\n电子密码本（ECB）模式是最简单的对称加密形式，正如该模式的名字所示，加密器简单是将一个位块映射到由密钥表示的虚拟密码本中的一个位块。加密器的加密/解密设置决定了操作产生的是密文还是明文。\n\
  \n这是一个在 ECB 模式下使用 `AES` 的基本示例。这可能是你在 JCE 中能做的最简单的事情，但它展示了 `Cipher` 类和 `SecretKeySpec`\
  \ 类的使用。\n\n```java\n 1 /**\n 2  * ECB 模式下 AES 的简单示例。\n 3  */\n 4 public class ECBShortExample\n\
  \ 5 {\n 6     public static void main(String[] args)\n 7         throws Exception\n\
  \ 8     {\n 9         byte[] keyBytes = Hex.decode(\"000102030405060708090a0b0c0d0e0f\"\
  );\n10 \n11         SecretKeySpec key = new SecretKeySpec(keyBytes, \"AES\");\n\
  12 \n13         Cipher cipher = Cipher.getInstance(\"AES/ECB/NoPadding\", \"BC\"\
  );\n14 \n15         byte[] input = Hex.decode(\"a0a1a2a3a4a5a6a7a0a1a2a3a4a5a6a7\"\
  );\n16 \n17         System.out.println(\"input    : \" + Hex.toHexString(input));\n\
  18 \n19         cipher.init(Cipher.ENCRYPT_MODE, key);\n20 \n21         byte[] output\
  \ = cipher.doFinal(input);\n22 \n23         System.out.println(\"encrypted: \" +\
  \ Hex.toHexString(output));\n24 \n25         cipher.init(Cipher.DECRYPT_MODE, key);\n\
  26 \n27         System.out.println(\"decrypted: \"\n28                         \
  \    + Hex.toHexString(cipher.doFinal(output)));\n29     }\n30 }\n```\n\n运行该示例应该产生以下输出：\n\
  \n```\ninput    : a0a1a2a3a4a5a6a7a0a1a2a3a4a5a6a7\nencrypted: c600a21491fbcfec368b5adf31c50881\n\
  decrypted: a0a1a2a3a4a5a6a7a0a1a2a3a4a5a6a7\n```\n\n你可以看到消息非常短，尝试将赋值给 `input` 的消息替换为这里更长的消息：\n\
  \n```java\n byte[] input = Hex.decode(\"a0a1a2a3a4a5a6a7a0a1a2a3a4a5a6a7\"\n   \
  \                           + \"a0a1a2a3a4a5a6a7a0a1a2a3a4a5a6a7\");\n```\n\n在这种情况下，你将看到此输出：\n\
  \n```\ninput    : a0a1a2a3a4a5a6a7a0a1a2a3a4a5a6a7a0a1a2a3a4a5a6a7a0a1a2a3a4a5a6a7\n\
  encrypted: c600a21491fbcfec368b5adf31c50881c600a21491fbcfec368b5adf31c50881\n```\n\
  \n你可以看到消息非常短，尝试将赋值给 `input` 的消息替换为这里更长的消息：\n\n（注：提供的文本在 ECB 章节末尾似乎有一些重复/损坏的痕迹，格式保持了核心逻辑）。\n\
  \n\n\n\n下一个示例展示了如何为 CBC 模式自动生成 IV（初始化向量）。你会发现，任何需要使用 IV 的加密算法都支持类似的功能。\n\n```java\n\
  \ /**\n * A simple example of AES in CBC mode, with the Cipher generating IV.\n\
  \ */\n public class CBCGenExample\n {\n    public static void main(String[] args)\n\
  \        throws Exception\n    {\n        byte[] keyBytes = Hex.decode(\"000102030405060708090a0b0c0d0e0f\"\
  );\n\n        SecretKeySpec key = new SecretKeySpec(keyBytes, \"AES\");\n\n    \
  \    Cipher cipher = Cipher.getInstance(\"AES/CBC/NoPadding\", \"BC\");\n\n    \
  \    byte[] input = Hex.decode(\"a0a1a2a3a4a5a6a7a0a1a2a3a4a5a6a7\"\n          \
  \                       + \"a0a1a2a3a4a5a6a7a0a1a2a3a4a5a6a7\");\n\n        System.out.println(\"\
  input    : \" + Hex.toHexString(input));\n\n        cipher.init(Cipher.ENCRYPT_MODE,\
  \ key);\n\n        byte[] iv = cipher.getIV();\n\n        byte[] output = cipher.doFinal(input);\n\
  \n        System.out.println(\"encrypted: \" + Hex.toHexString(output));\n\n   \
  \     cipher.init(Cipher.DECRYPT_MODE, key, new IvParameterSpec(iv));\n\n      \
  \  System.out.println(\"decrypted: \"\n                            + Hex.toHexString(cipher.doFinal(output)));\n\
  \    }\n }\n```\n\n如果你运行这个示例几次，你应该会看到加密输出在随机变化。\n\n使用 `Cipher.getIV()` 返回的生成字节数组的替代方案是使用\
  \ \n\n`Cipher.getParameters()`，它返回一个 `AlgorithmParameters` 对象。你可以像上一个示例中使用 `IvParameterSpec`\
  \ 一样使用它，通过参考以下代码片段来修改示例。这段代码替换了上述示例中第 20 行到第 28 行的内容：\n\n```java\n cipher.init(Cipher.ENCRYPT_MODE,\
  \ key);\n\n AlgorithmParameters ivParams = cipher.getParameters();\n\n byte[] output\
  \ = cipher.doFinal(input);\n\n System.out.println(\"encrypted: \" + Hex.toHexString(output));\n\
  \n cipher.init(Cipher.DECRYPT_MODE, key, ivParams);\n```\n\n在两个自动生成 IV 的示例中，我们使用了提供程序默认的内部\
  \ `SecureRandom` 来生成 IV。在需要时，也可以在调用 `init()` 方法时向 `Cipher` 传递一个 `SecureRandom`，以便使用你自己的随机数源。例如，你可能会写：\n\
  \n```java\nSecureRandom myRandom = ...\n\nCipher.init(Cipher.ENCRYPT_MODE, key,\
  \ myRandom);\n```\n\n其中 `myRandom` 是你专门从 DRBG 构造函数构建的 `SecureRandom`。\n\n### 填充\
  \ (Padding)\n\n分组加密的基本形式（当仍以密码簿形式使用如如 ECB 或作为 CBC 加密的基础）只能处理与块大小对齐的数据。显然，你想要加密的数据并不总是恰好是块大小的倍数，因此提出了一些用于向数据中添加填充的程序。\n\
  \n所有的填充机制（偶尔的零填充除外）在原始明文块对齐时都会添加一个额外的填充块。在这种情况下，填充的额外块将是一个字节长度等于加密器块大小的字节字符串（例如\
  \ AES 为 16，Triple-DES 为 8）。\n\n除了 BC FIPS 提供程序不支持的零字节填充（Zero Byte Padding）外，Bouncy\
  \ Castle 提供程序支持以下填充机制。\n\n#### ISO7816-4 填充\n\n这种填充定义在 `ISO7816-4` 中。第一个填充字节的值为\
  \ 0x80，其余填充由零字节组成。通过填充字符串“ISO7816-4Padding”设置。\n\n#### ISO101026-2 填充\n\n这种填充定义在\
  \ `ISO10126-2` 中。填充的最后一个字节是填充字节的数量，其余的填充字节由随机数据组成。通过填充字符串“ISO10126-2Padding”设置。\n\
  \n#### PKCS#5/PKCS#7 填充\n\nPKCS#5/PKCS#7 填充最初定义在 PKCS #5 [129] 中，并在 PKCS #7 [76]\
  \ 中进行了进一步修订。明文用一个表示为了填充一个块所需的字节数的字节字符串进行填充。例如，对于像 AES 这种 16 字节块的加密器，比下一个块边界短 5 字节的明文将用值为‘5’的字节填充。通过填充字符串“PKCS5Padding”或“PKCS7Padding”设置。\n\
  \n#### TBC 填充\n\n尾位取反（TBC）填充根据最后一位的值添加。如果位为 0，则添加一串 1；如果位为 1，则添加一串 0。通过填充字符串“TBCPadding”设置。\n\
  \n#### X9.23 填充\n\n这种填充定义在 `X9.3` 中。由于与 PKCS#5/PKCS#7 类似，填充的最后一个字节是填充字节的数量，但与 PKCS#5/PKCS#7\
  \ 不同，其他字节是零或由随机数据组成。通过填充字符串“X923Padding”设置。\n\n#### 零字节填充 (Zero Byte Padding)\n\n\
  永远不要在这种情况下使用它，因为 BC FIPS 提供程序不支持。当明文以零结尾时会添加零字节填充。通过填充字符串“ZeroBytePadding”设置。\n\n\
  在提供程序方面，PKCS#5/PKCS#7 是最常见的，通常被称为“PKCS5”，有时被称为“PKCS7”。\n\n\n\n\n你可以从加密数据中看到填充（padding）的存在，因为它比原始输入长并且是块对齐。\n\
  \n### 密文窃取 (Cipher Text Stealing)\n\n如果你有处理任意长度数据的需求（有一个限制），可以使用密文窃取，或 `CTS`。`CTS`\
  \ 操作首次在 `RFC 2040` [74] 中作为 RFC 发布，并在 `SP 800-38A` 的附录 [25] 中进行了进一步扩展。它被视为 `CBC`\
  \ 模式的一种特殊情况，对于 Java 而言，我们将其视为填充机制。虽然 `CTS` 仅适用于大于一个块的消息，但它确实提供了一种使用 `CBC` 模式生成密文的方便方法，生成的密文长度与原始明文完全一致。\n\
  \n`SP 800-38A` 的附录定义了三种方法，其中 `CS3` 与 `RFC 2040` 中定义的相同。以下示例是该模式的，在提供程序中可以引用为 `CS3Padding`\
  \ 或 `CTSPadding`。\n\n```\n 1 /**\n 2  * 一个使用 CBC 模式并配合密文窃取的 AES 简单示例。\n 3  */\n\
  \ 4 public class CTSExample\n 5 {\n 6     public static void main(String[] args)\n\
  \ 7         throws Exception\n 8     {\n 9         byte[] keyBytes = Hex.decode(\"\
  000102030405060708090a0b0c0d0e0f\");\n10 \n11         SecretKeySpec key = new SecretKeySpec(keyBytes,\
  \ \"AES\");\n12 \n13         Cipher cipher = Cipher.getInstance(\"AES/CBC/CTSPadding\"\
  , \"BC\");\n14 \n15         byte[] input = Hex.decode(\"a0a1a2a3a4a5a6a7a0a1a2a3a4a5a6a7\"\
  \n16                                 + \"a0a1a2a3a4a5a6a7a0\");\n17 \n18       \
  \  System.out.println(\"input    : \" + Hex.toHexString(input));\n19 \n20      \
  \   byte[] iv = Hex.decode(\"9f741fdb5d8845bdb48a94394e84f8a3\");\n21 \n22     \
  \    cipher.init(Cipher.ENCRYPT_MODE, key, new IvParameterSpec(iv));\n23 \n24  \
  \       byte[] output = cipher.doFinal(input);\n25 \n26         System.out.println(\"\
  encrypted: \" + Hex.toHexString(output));\n27 \n28         cipher.init(Cipher.DECRYPT_MODE,\
  \ key, new IvParameterSpec(iv));\n29 \n30         System.out.println(\"decrypted:\
  \ \"\n31                             + Hex.toHexString(cipher.doFinal(output)));\n\
  32     }\n33 }\n```\n\n运行该示例将产生以下输出：\n\n```\ninput    : a0a1a2a3a4a5a6a7a0a1a2a3a4a5a6a7a0a1a2a3a4a5a6a7a0\n\
  encrypted: caa168f23f888234125f2e6bd9c1934eefd8d07f7b4d2cd46f\ndecrypted: a0a1a2a3a4a5a6a7a0a1a2a3a4a5a6a7a0a1a2a3a4a5a6a7a0\n\
  ```\n\n如你所示，加密输出的长度与原始明文相同。\n\n### 流式块模式 (Streaming Block Modes)\n\n![在流式加密模式中使用块密码](img/chapter2----StreamBlockCipher.png)\n\
  \n在流式加密模式中使用块密码\n\n流式模式之所以被称为此名，是因为它们能够在不使用填充的情况下加密任意大小的数据。在这种情况下，块密码被用于生成一个密钥流（key-stream），然后将其与待加密的数据进行异或（XOR）。这些模式还有另一个有用特性：虽然块密码的核心仍然在使用其虚拟密码本（virtual\
  \ code-book），但这些模式仅要求密码加密算法的实现，因为密码本现在仅用于生成一个加密流，以便与用于加密的数据或用于解密的密文进行异或。\n\n####\
  \ CTR 模式\n\n计数器模式（`CTR`），也称为分段计数器模式（`SIC`），由 NIST 在 `SP 800-38a` [24] 中由 IETF 在\
  \ `RFC 3686` [85] 中标准化。在块流式模式中，这是最有用的。\n\n该模式非常简单，密钥流通过加密一个块生成，该块是随机值（nonce）和计数器的混合。计数器的可用空间决定了密码可以安全地处理多少个块——例如，8\
  \ 位计数器只允许 256 个块。不同的 nonce 结合相同的初始计数器应该产生唯一的密钥流，因此 nonce 的大小决定了这一点。\n\n以下是该模式的示例：\n\
  \n\n\n与 CBC 模式一样，如果解密的数据出现错误，该错误将在流重新同步之前传播到整个一个字大小的字节。\n\n### OFB 模式\n\nOFB（输出反馈）模式与\
  \ CFB 模式的不同之处在于，初始 IV 被视为加密器的原始状态，并仅对其进行加密，以产生每个新的密钥流块，该块用于与密钥流进行异或运算。待加密的明文永远不会被底层加密器直接处理。该模式定义在\
  \ SP 800-38a 中 [24]。\n\n要在 JCE 中使用 OFB 模式，只需在模式中包含 OFB 字符串，例如：\n\n```java\nCipher\
  \ cipher = Cipher.getInstance(\"AES/OFB/NoPadding\", \"BC\");\n```\n\nOFB 模式确实具有位错误不会传播的优点，这在某些情况下（例如在处理视频或音频时）非常有用。OFB\
  \ 模式的缺点是，如果密钥流中存在循环（例如对于给定的密钥和给定的输入值，索引时代码本返回的输出是原始值），流可能会开始意外地重复。正如你可以想象的，这种情况发生的概率非常小，但你在这个领域工作得越久，就越会发现变得“幸运”是多么容易。因此，虽然我们列出了\
  \ OFB 模式，但这实际上是为了兼容性考虑，我们不会将其用于任何新项目。CTR 模式也具有 OFB 模式的所有优点且没有缺点，因此，在抛开兼容性不考虑的情况下，使用\
  \ CTR 模式更好。\n\n### 流加密\n\n流加密器是设计用于生成密钥流的加密器。\n\n![加密模式下的基本流加密](img/chapter2----StreamCipher.png)\n\
  \n加密模式下的基本流加密\n\n与块加密器的流式模式一样，密钥流随后与输入明文进行异或，以产生密文。同样，与块加密器一样，流加密使用对称密钥初始化，有时还会使用其他参数（如\
  \ IV）。与块加密器不同，流加密没有模式，因此你通常只需通过名称调用它们。\n\n附录 C 列出了 Bouncy Castle 支持的流加密器列表。\n\n\
  以下示例展示了 RFC 7539 定义的 ChaCha20 版本 [124] 的用法。\n\n```java\n/**\n * 使用 RFC 7539 ChaCha\
  \ 流加密器的示例。\n */\npublic class StreamExample\n{\n    public static void main(String[]\
  \ args)\n        throws Exception\n    {\n        byte[] keyBytes = Hex.decode(\"\
  000102030405060708090a0b0c0d0e0f\"\n                                    + \"000102030405060708090a0b0c0d0e0f\"\
  );\n\n        SecretKeySpec key = new SecretKeySpec(keyBytes, \"ChaCha7539\");\n\
  \n        Cipher cipher = Cipher.getInstance(\"ChaCha7539\", \"BC\");\n\n      \
  \  byte[] input = Hex.decode(\"a0a1a2a3a4a5a6a7a0a1a2a3a4a5a6a7\"\n            \
  \                     + \"a0a1a2a3a4a5a6a7a0\");\n\n        System.out.println(\"\
  input    : \" + Hex.toHexString(input));\n\n        byte[] iv = Hex.decode(\"010203040506070809101112\"\
  );\n\n        cipher.init(Cipher.ENCRYPT_MODE, key, new IvParameterSpec(iv));\n\
  \        byte[] output = cipher.doFinal(input);\n        System.out.println(\"encrypted:\
  \ \" + Hex.toHexString(output));\n\n        cipher.init(Cipher.DECRYPT_MODE, key,\
  \ new IvParameterSpec(iv));\n        System.out.println(\"decrypted: \"\n      \
  \                      + Hex.toHexString(cipher.doFinal(output)));\n    }\n}\n```\n\
  \n如你在示例代码中所示，`Cipher` 定义中缺少了模式和填充标识符，因为它们不是必需。此示例的输出为：\n\n```\ninput: a0a1a2a3a4a5a6a7a0a1a2a3a4a5a6a7a0a1a2a3a4a5a6a7\n\
  encrypted: 3a77592ab77c8fb1dca9e467e56dca5d3c2e623e7a59c73\ndecrypted: a0a1a2a3a4a5a6a7a0\n\
  ```\n\n我们可以看到加密器产生的密文长度与原始明文相同。\n\n### 基于加密器的输入/输出\n\nJCE 提供了 `javax.crypto.CipherInputStream`\
  \ 和 `javax.crypto.CipherOutputStream` 类，它们提供了一种将加密器作为过滤器的方法。遗憾的是，如果对封装的加密器的 `doFinal()`\
  \ 方法调用出现问题，这些类会静默失败。这对你来说是否是一个问题主要取决于你的决定，但请注意，这种副作用是静默失败意味着 AEAD 加密器抛出的异常也会被忽略（我们将在本章讨论这意味着什么）。\n\
  \n考虑到这一点，下面的示例是使用 Bouncy Castle 版本的 `CipherInputStream` 和 `CipherOutputStream`，你可以在\
  \ `javax.crypto` 中找到它们。\n\n```java\n/**\n * 使用 BC CipherInputStream/CipherOutputStream\
  \ 类的示例。\n */\npublic class CipherIO\n{\n    public static void main(String[] args)\n\
  \        throws Exception\n    {\n        KeyGenerator kGen = KeyGenerator.getInstance(\"\
  AES\", \"BC\");\n\n        SecretKey key = kGen.generateKey();\n\n        Cipher\
  \ cipher = Cipher.getInstance(\"AES/CBC/PKCS5Padding\", \"BC\");\n\n        byte[]\
  \ input = Hex.decode(\"a0a1a2a3a4a5a6a7a0a1a2a3a4a5a6a7\"\n                    \
  \             + \"a0a1a2a3a4a5a6a7a0\");\n\n        System.out.println(\"input \
  \   : \" + Hex.toHexString(input));\n\n        cipher.init(Cipher.ENCRYPT_MODE,\
  \ key);\n\n        AlgorithmParameters ivParams = cipher.getParameters();\n\n  \
  \      // 加密明文\n        ByteArrayOutputStream bOut = new ByteArrayOutputStream();\n\
  \        CipherOutputStream cOut = new CipherOutputStream(bOut, cipher);\n\n   \
  \     cOut.write(input);\n        cOut.close();\n\n        byte[] output = bOut.toByteArray();\n\
  \n        System.out.println(\"encrypted: \" + Hex.toHexString(output));\n\n   \
  \     cipher.init(Cipher.DECRYPT_MODE, key, ivParams);\n\n        // 解密密文\n    \
  \    ByteArrayInputStream bIn = new ByteArrayInputStream(output);\n\n        CipherInputStream\
  \ cIn = new CipherInputStream(bIn, cipher);\n\n        byte[] decrypted = Streams.readAll(cIn);\n\
  \n        System.out.println(\"decrypted: \"\n                            + Hex.toHexString(decrypted));\n\
  \    }\n}\n```\n\n你会注意到这里使用的加密器是采用 CBC 模式和 PKCS #7 填充的 AES。如果你运行示例，你应该看到加密输出如预期的比输入长，并且填充在解密步骤中被干净地删除了。\n\
  \n### 总结\n\n在本章中，我们查看了块加密和流加密。我们涵盖了加密器使用的密钥生成、块加密器运行的不同模式以及填充加密数据的方法。我们还涵盖了如何使用\
  \ CTR 和 CFB 模式使用块加密进行流。\n\n最后，我们还查看了 JCE 如何通过 `CipherInputStream` 和 `CipherOutputStream`\
  \ 类通过加密器提供输入和输出。这是 Java 中读取和写入加密数据的常用方法之一。我们还指出，如果你在使用 AEAD 加密器，应该使用 `org.bouncycastle.jcajce.io`\
  \ 包中的 `CipherInputStream` 和 `CipherOutputStream`，因为如果 AEAD 标签验证失败，JCE 提供的类将静默失败。\n\
  \n\n\n本章介绍了用于验证数据未被篡改的方法——无论是经过加密解密还是直接以明文形式发送。这涉及到使用称为消息摘要（message digests）的函数对一组输入计算加密哈希值。除了识别篡改外，通过计算消息摘要并包含共享密钥，还可以对输入的来源提供某些保证。在第二种情况下，这种加密校验和意味着可以断定消息具有特定的发送者，并可用于避免重放攻击风险。提供这种额外保证的函数被称为\
  \ `MACs`。这些函数有效的主要原因是它们是不可逆的。这种不可逆性也使得摘要和 `MACs` 适用于随机数生成和密钥派生，在这两个领域中，都希望隐藏输入到生成器的原始种子材料。\n\
  \n## 消息摘要\n\n消息摘要用于为特定消息计算加密校验和（或哈希）。消息摘要与类似 `CRC` 的东西之间的区别在于：消息摘要输入的输入的任何微小变化都会对构成消息摘要函数结果的位值产生不可预测且可能是巨大的影响。虽然在不先进行计算的情况下无法猜测某个特定消息的明摘要输出，但消息摘要的大小和函数本身也反映了两个不同的消息产生相同摘要结果（也称为\
  \ `collision`，碰撞）的概率。\n\n### MessageDigest 类\n\nJCA 通过 `MessageDigest` 类提供了对支持消息摘要计算对象的访问，该类可以在\
  \ `java.security` 包中找到。由于它属于 JCA，此类对象不是直接创建的，而是通过 `getInstance()` 方法创建的。\n\n`MessageDigest`\
  \ 不需要任何设置。创建后，使用不同的 `update()` 方法将数据添加到计算中，并通过其中一个 `digest()` 方法返回结果，如下例所示：\n\n\
  ```\n 1   /**\n 2    * 使用传入的算法 \n 3    * digestName 返回基于数据计算的摘要。\n 4    *\n 5  \
  \  * @param digestName 摘要算法的名称。\n 6    * @param data 摘要函数的输入。\n 7    * @return 计算的消息摘要。\n\
  \ 8    */\n 9   public static byte[] computeDigest(String digestName, byte[] data)\n\
  10       throws NoSuchProviderException, NoSuchAlgorithmException\n11   {\n12  \
  \     MessageDigest digest = MessageDigest.getInstance(digestName, \"BC\");\n13\
  \ \n14       digest.update(data);\n15 \n16       return digest.digest();\n17   }\n\
  ```\n\n以下是 `computeDigest()` 函数的简单用法：\n\n```\n 1 /**\n 2  * 使用 MessageDigest 的简单示例。\n\
  \ 3  */\n 4 public class DigestExample\n 5 {\n 6     public static void main(String[]\
  \ args)\n 7         throws Exception\n 8     {\n 9         System.out.println(\n\
  10             Hex.toHexString(\n11                 computeDigest(\"SHA-256\", Strings.toByteArray(\"\
  Hello World!\"))));\n12     }\n13 }\n```\n\n如果你运行该示例且一切顺利，你将看到以下输出。\n\n```\n7f83b1657ff1fc53b92dc18148a1d65dfc2d4b1fa3d677284addd200126d9069\n\
  ```\n\n如果你尝试微调 `DigestExample` 中的输入字符串，你会发现生成的摘要以一种显而随机的方式发生变化，即使字符串保持当前的 12 个字符（或\
  \ 96 位）长度，这远低于消息摘要生成的 256 位。\n\n`MessageDigest` 还支持一种“一键式”计算方法，也称为 `digest()`，如示例中的所示，它接受单个字节数组作为输入。该类中还有一个静态的\
  \ `MessageDigest.isEqual()` 方法，接受两个字节数组。`isEqual()` 方法提供了恒定时间的相等性检查，尽管如果你真的在寻找更安全的恒定时间比较，Bouncy\
  \ Castle API 中也有 `org.bouncycastle.util.Arrays.constantTimeAreEqual()`。\n\n## MACs\n\
  \n`MACs` 用于需要对加密校验和的计算方式提供保证的情况。它们涉及到创建 `MAC` 的方与使用 `MAC` 的方之间使用共享密钥。它们比消息摘要进一步，因为可以用于将计算\
  \ `MAC` 的消息与特定的发送者关联，并作为消除重放消息的手段。`MACs` 可以使用密码或消息摘要生成。与消息摘要不同，`MAC` 函数假设存在密钥以及输入数据。在固定密钥的情况下，`MACs`\
  \ 可以执行与消息摘要类似的功能，但它们仍然优于简单的 `CRC`，因为对 `MAC` 输入的更改会导致 `MAC` 结果产生不可预测的位变化。当用于初始化 `MAC`\
  \ 的密钥密钥时，`MAC` 还能对被 MAC 处理的数据的来源提供某些保证。\n\n截断 `MACs` 也相当常见，大多数情况下这是相当安全的，但要注意：`MAC`\
  \ 越小，发生 `collision` 的概率就越高，因此截断 `MAC` 会同时影响初始化它的密钥的寿命以及 `MAC` 本身的可靠性。在开始丢弃位之前，最好考虑这些影响。\n\
  \n### Mac 类\n\nJCE 通过 `javax.crypto.Mac` 类提供了对 MAC 函数的访问。与 `Cipher` 类一样，此类对象不是直接创建的，而是使用\
  \ `getInstance()` 工厂模式。\n\n这是一个计算 `MAC`。\n\n```\n 1   /**\n 2    * 使用传入的算法\n 3 \
  \   * type 返回基于数据计算的 MAC。\n 4    *\n 5    * @param algorithm 算法的名称。\n 6    * @param\
  \ key 用于 MAC 的适当密钥。\n 7    * @param data MAC 函数的输入。\n 8    * @return 计算的 MAC。\n\
  \ 9    */\n10   public static byte[] computeMac(String algorithm, SecretKey key,\
  \ byte[] data)\n11       throws NoSuchProviderException, NoSuchAlgorithmException,\n\
  12              InvalidKeyException\n13   {\n14       Mac mac = Mac.getInstance(algorithm,\
  \ \"BC\");\n15 \n16       mac.init(key);\n17 \n18       mac.update(data);\n19 \n\
  20       return mac.doFinal();\n21   }\n```\n\n你可以看到 `MAC` 和 `MessageDigest` 的主要区别在于存在\
  \ `init()` 方法以及对 `SecretKey` 的使用。如前所述，由于使用了密钥，`MACs` 常用于验证消息内容的来源。\n\n`MAC` 类的另一个区别是我们现在使用\
  \ `Mac.doFinal()` 作为获取最终校验和的方法，使得该类的用法类似于 `Cipher` 类。`MAC` 类上的 `init()` 方法很大程度上遵循\
  \ `Cipher` 类，某些 MAC 算法可以接受额外的参数（如 IV），其用途与相应加密类的参数类似。还有一个接受字节数组的 `doFinal()` 版本，可以作为一键式方法计算\
  \ `MAC`，就像 `MessageDigest` 的一键式 `digest()` 方法一样。\n\n以下示例提供了使用 `computeMac()` 方法使用\
  \ AES 和 CMAC 算法计算 `MAC` 的示例：\n\n```\n 1 /**\n 2  * 使用 AES CMAC 的简单示例。\n 3  */\n\
  \ 4 public class MacExample\n 5 {\n 6     public static void main(String[] args)\n\
  \ 7         throws Exception\n 8     {\n 9         SecretKey macKey = new SecretKeySpec(\n\
  10             Hex.decode(\"dfa66747de9ae63030ca32611497c827\"), \"AES\");\n11 \n\
  12         System.out.println(\n13             Hex.toHexString(\n14            \
  \     computeMac(\"AESCMAC\", macKey,\n15                                  Strings.toByteArray(\"\
  Hello World!\"))));\n16     }\n17 }\n```\n\n\n\n\n如果你运行此代码且一切顺利，你应该得到：\n\n```\n\
  24331a9b3a21f382e41c8a485fababf0\n```\n\n这与底层加密器的块大小相同，是一个 128 位的值。请注意，使用给定的加密算法计算\
  \ MAC 有多种不同的方法，例如 `CBC-MAC` 和 `GMAC`（仅两个）。完整列表可以在附录 C 中找到。\n\n#### HMAC\n\n如所述，也可以使用消息摘要来计算\
  \ MAC。以这种方式计算的 MAC 被称为哈希 MAC，简称为 `HMACs`。\n\n下面的示例展示了如何通过 JCE 的 `Mac` 类使用 HMAC。如你所见，除了\
  \ `macKey` 设置和算法名称外，我们之前看到的 `computeMac()` 方法也可以用于 HMAC。\n\n```\n 1 /**\n 2  * 使用\
  \ HMAC SHA-256 的简单示例。\n 3  */\n 4 public class HMacExample\n 5 {\n 6     public\
  \ static void main(String[] args)\n 7         throws Exception\n 8     {     Security.addProvider(new\
  \ BouncyCastleProvider());\n 9         SecretKey macKey = new SecretKeySpec(\n10\
  \                 Hex.decode(\n 11                     \"2ccd85dfc8d18cb5d84fef4b19855469\"\
  \ +\n 12                     \"9fece6e8692c9147b0da983f5b7bd413\"), \"HmacSHA256\"\
  );\n 13 \n 14         System.out.println(\n 15             Hex.toHexString(\n 16\
  \                 computeMac(\"HmacSHA256\", macKey,\n 17                      \
  \            Strings.toByteArray(\"Hello World!));));\n 18     }\n 19 }\n```\n\n\
  运行此示例将产生一个 256 位的字符串：\n\n```\n8e079dd2d9b271a17a4d3dfa3a808b41d2105fee7aabe7ceccfdf66e8339e5d7\n\
  ```\n\n在这种情况下，它反映了用于支持 `HMAC` 函数的消息摘要的大小。\n\n#### 密钥派生函数\n\n密钥派生函数（`KDFs`）利用消息摘要和/或\
  \ MAC 获取一组输入（在某些情况下这些需要保密），然后产生适用于不同长度密钥的数据流。某些 KDF 会会将密钥的大小限制为输出摘要的最大大小。德国标准 `BSI\
  \ TR-03111` [40] 的第 4.3.3 节就有这样一个示例，其中摘要的输出（`SHA-1` 或 `SHA-256`）被用于生成对称加密会话密钥。更常见的是，KDF\
  \ 对产生的输出大小是灵活的。\n\n最常见的灵活 KDF 定义在 `X9.63` [68] 中，并在其他地方被广泛引用，包括 `BSI TR-03111` 和\
  \ NIST 标准。其次常见的是最初被称为 `NIST Concatenation KDF` 的，现在描述在 `SP 800-56C` [31] 第 4 节中。我们在这里查看这两个函数。\n\
  \n###### X9.63 KDF\n\nKDF 需要的输入包括：\n\n*   ![Z](img/leanpub_equation_4.png) 它通常是一个生成的秘密值，通常来自密钥协商方案。\n\
  *   ![SharedInfo](img/leanpub_equation_5.png) 这是一个可选的字节字符串，它与 ![Z](img/leanpub_equation_6.png)\
  \ 结合。\n*   ![keyLen](img/leanpub_equation_7.png) 要生成的密钥的长度。\n*   一个函数 ![H()](img/leanpub_equation_8.png)，它是我们用于构建\
  \ KDF 的消息摘要。\n*   ![hLen](img/leanpub_equation_9.png) ![H()](img/leanpub_equation_10.png)\
  \ 的输出大小。\n\n![SharedInfo](img/leanpub_equation_11.png) 是 KDF 计算中使用的可选字节字符串。它的命名法源于这样一个事实：当多个实体尝试使用相同的\
  \ ![Z](img/leanpub_equation_12.png) 值生成相同的密钥材料时，在使用 KDF 之前必须以某种方式共享该字节字符串。其目的是提供一些额外数据，以确保无论\
  \ Z 值是否冲突，KDF 的输出与其他 KDF 相比都是唯一的。\n\n在验证输入后，执行以下算法来计算密钥材料：\n\n1.  设置 ![R = \\left\\\
  lceil keyLen / hLen \\right\\rceil](img/leanpub_equation_13.png)\n2.  设置 ![C = 1](img/leanpub_equation_14.png)\n\
  3.  从 ![I = 1](img/leanpub_equation_15.png) 到 ![R](img/leanpub_equation_16.png)：\n\
  \    1.  设置 ![K = H(Z \\parallel SharedInfo)](img/leanpub_equation_17.png)\n   \
  \ 2.  设置 ![C = C + 1](img/leanpub_equation_18.png)\n    3.  设置 ![Result = Result\
  \ \\parallel K](img/leanpub_equation_19.png)\n4.  返回 ![keyLen](img/leanpub_equation_20.png)\
  \ 字节。\n\n其中 `ItoB()` 是将 `C` 转换为 4 位整数的函数。\n\n###### 拼接 KDF (Concatenation KDF)\n\
  \n最初描述于早期版本的 `SP 800-56`，该算法现在描述在 `SP 800-56C` [31]，标题为“单步密钥派生”。KDF 需要的：\n\n*  \
  \ ![Z](img/leanpub_equation_4.png) 它通常是一个生成的秘密值，通常来自密钥协商方案。\n*   ![SharedInfo](img/leanpub_equation_5.png)\
  \ 与 ![Z](img/leanpub_equation_6.png) 结合的可选字节字符串。\n*   ![keyLen](img/leanpub_equation_7.png)\
  \ 要生成的密钥的长度。\n*   一个函数 ![H()](img/leanpub_equation_8.png)，它是我们用于构建 KDF 的消息摘要。\n\
  *   ![hLen](img/leanpub_equation_9.png) ![H()](img/leanpub_equation_10.png) 的输出大小。\n\
  \n![SharedInfo](img/leanpub_equation_11.png) 是 KDF 计算中使用的可选字节字符串。它的命名法源于这样一个事实：当多个实体尝试使用相同的\
  \ ![Z](img/leanpub_equation_12.png) 值生成相同的密钥材料时，在使用 KDF 之前必须以某种方式共享该字节字符串。其目的是提供一些额外数据，以确保无论\
  \ Z 值是否冲突，KDF 的输出与其他 KDF 相比都是唯一的。`SP 800-56A` [29] 提供了关于可以放入 `SharedInfo` 的表格。\n\
  \n在验证输入后，执行以下算法来计算密钥材料：\n\n1.  设置 ![R = \\left\\lceil keyLen / hLen \\right\\rceil](img/leanpub_equation_13.png)\n\
  2.  设置 ![C = 0](img/leanpub_equation_14.png)\n3.  从 ![I = 1](img/leanpub_equation_15.png)\
  \ 到 ![R](img/leanpub_equation_16.png)：\n    1.  设置 ![C = C + 1](img/leanpub_equation_17.png)\n\
  \    2.  设置 ![K = H(ItoB(C) \\parallel SharedInfo)](img/leanpub_equation_18.png)\n\
  \    3.  设置 ![Result = Result \\parallel K](img/leanpub_equation_19.png)\n4.  返回\
  \ ![keyLen](img/leanpub_equation_20.png) 字节的 ![Result]。\n\n其中 `ItoB()` 也是将 `C` 转换为\
  \ 4 位大端整数的函数。正如你预期的那样，你不能从我们过的任何一个函数中生成无限的密钥字符串。NIST 函数的限制和安全强度在 `SP 800-56C` [31]\
  \ 中有所记录。对于我们的目的而言，你永远不会遇到产生密钥材料数量的限制，但你应该确保 KDF 中使用的哈希/MAC 函数对于你生成的密钥大小具有适当的安全强度。\n\
  \n\n\n\n随着 SHA-3 的问世，两个额外的函数：`SHAKE128` 和 `SHAKE256`。虽然它们都基于海绵结构（sponge），但它们与 SHA-3\
  \ 摘要本身不同，因为它们在设计上能够适应不同的输出大小。这类新型哈希算法被称为可扩展输出函数（XOF），`SHAKE128` 和 `SHAKE256` 已被用于一系列可以产生变量输出的哈希和\
  \ MAC 算法。\n\n在 Bouncy Castle 的底层 API 中，XOF 函数实现了 `org.bouncycastle.crypto.Xof`，其定义如下：\n\
  \n```\n 1 public interface Xof\n 2     extends ExtendedDigest\n 3 {\n 4     /**\n\
  \ 5      * 将此摘要的最终计算结果输出到\n 6      * outLen 个字节中。\n 7      *\n 8      * @param out\
  \ 用于写入输出字节的输出数组。\n 9      * @param outOff 开始写入字节的偏移量。\n10      * @param outLen 请求的输出字节数。\n\
  11      * @return 写入的字节数\n12      */\n13     int doFinal(byte[] out, int outOff,\
  \ int outLen);\n14 \n15     /**\n116      * 开始输出此摘要的最终计算结果。\n17      * 结果。与 doFinal\
  \ 不同，此方法将持续产生\n18      * 输出，直到 Xof 被显式重置或发出其他信号。\n19      *\n20      * @param out\
  \ 用于写入输出字节的输出数组。\n21      * @param outOff 开始写入字节的偏移量。\n22      * @param outLen 请求的输出字节数。\n\
  23      * @return 写入的字节数\n24      */\n25     int doOutput(byte[] out, int outOff,\
  \ int outLen);\n26 }\n```\n\n如你所示，这些额外的方法允许在 `doFinal()` 上指定变量大小的输出，并且具有持续输出的潜力——`doOutput()`\
  \ 方法——直到调用 `doFinal()` 为止。正是这种挤出额外数据的能力赋予了可扩展函数名称。\n\n### SHAKE 函数\n\n`Xof` 的主要实现者是\
  \ `SHAKE128` 和 `SHAKE256`。`SHAKE128` 中的 128 和 `SHAKE256` 中的 256 源于与算法相关的最大安全位数，且两者的默认输出大小分别为\
  \ 256 位和 512 位。如果你使用 `MessageDigest.getInstance()` 方法创建其中任何一个，返回将是最小大小。在这些最小大小之下，输出的实际强度为\
  \ ![d/2](img/leanpub_equation_47.png)，其中 ![d](img/leanpub_equation_48.png) 是输出的位（bits）长度。\n\
  \n### cSHAKE, KMAC, TupleHash 和 ParallelHash\n\n2016 年，在 SHA-3 标准发布一多年前后，NIST 发布了\
  \ SP 800-185 [36]，该标准定义了一个基于 SHAKE 构建的函数 `cSHAKE`，以及另外三个额外的函数 `KMAC`、`TupleHash`\
  \ 和 `ParallelHash`，它们都都是基于 `cSHAKE` 构建的。\n\n#### cSHAKE\n\ncSHAKE 引入了两个配置参数：![N](img/leanpub_equation_49.png)\
  \ 和 ![S](img/leanpub_equation_50.png)。![N](img/leanpub_equation_51.png) 是函数名称字符串，![S](img/leanpub_equation_52.png)\
  \ 是自定义字符串。![N](img/leanpub_equation_53.png) 应该仅作为 NIST 标准的一部分设置——我们稍后会看到一些示例。另一方面，![S](img/leanpub_equation_54.png)\
  \ 用于本地使用——我们以及你可以根据意愿设置它。如果 ![N](img/leanpub_equation_55.png) 和 ![S](img/leanpub_equation_56.png)\
  \ 均为空字符串，则 cSHAKE 的输出与相应的 SHAKE 函数的输出相同。\n\n在编写本文时，cSHAKE 只能从 Bouncy Castle 的底层\
  \ API 正确使用。对于通用提供程序，![N](img/leanpub_equation_57.png) 和 ![S](img/leanpub_equation_58.png)\
  \ 是通过引擎的构造函数设置的。例如：\n\n```\nCSHAKEDigest cshake = new CSHAKEDigest(\n          \
  \        128, new byte[0], Strings.toByteArray(\"Email Signature\"));\n```\n\n这创建一个基于\
  \ SHAKE128 的 `CSHAKEDigest`，其中 ![N](img/leanpub_equation_59.png) 为空，![S](img/leanpub_equation_60.png)\
  \ 由从字符串“Email Signature”的 ASCII 编码创建的字节串表示。另一方面：\n\n```\nCSHAKEDigest cshake = new\
  \ CSHAKEDigest(256, new byte[0], new byte[0]);\n```\n\n是 SHAKE256 的直接等效物。\n\n####\
  \ KMAC, TupleHash 和 ParallelHash\n\nKMAC、TupleHash 和 ParallelHash 都是 cSHAKE 的示例，\
  \ NIST 标准化了输出。\n\nKMAC 在底层 API 中表示，使用基于字符串“KMAC”的 ASCII 编码的字节串作为其 `N` 值。如其名称所示，它是一个\
  \ MAC，底层版本位于 `org.bouncycastle.crypto.macs` 包中，并且可以使用密钥初始化。在 JCA 中提供 `KMAC128` 和\
  \ `KMAC256`。\n\nTupleHash 在底层 API 中表示，使用基于字符串“TupleHash”的 ASCII 编码的字节串作为其 `N` 值。如其名称所示，它是一个摘要函数，底层版本位于\
  \ `org.bouncycastle.crypto.digests`。例如，向 `TupleHash` 输入“abc”、“def”、“ghi”将产生结果。在\
  \ JCA 中提供 `TupleHash128` 和 `TupleHash256`。\n\nParallelHash 在底层 API 中表示，使用基于字符串“ParallelHash”的\
  \ ASCII 编码的字节串作为其 `N` 值。如其名称所示，它是一个摘要函数，底层版本位于 `org.bouncycastle.crypto.digests`。它设计用于多线程执行并接受一个阻塞大小。在\
  \ JCA 中提供 `ParallelHash128` 和 `ParallelHash256`。\n\n### Bouncy Castle 摘要和 MAC 计算接口\n\
  \nBouncy Castle 的 PKIX 包提供了用于摘要和 MAC 计算器的通用接口。这些接口基于流，并提供与算法相关的 ASN.1 `AlgorithmParameters`、用于写入数据的输出流，以及在流关闭后获取计算摘要/MAC\
  \ 方法。\n\n这些接口贯穿 PKIX API 用于引入摘要和 MAC 操作。JCA 和 BC 底层 API 都存在该接口的实现。如果你需要，也可以由其他加密\
  \ API 编写。\n\n#### DigestCalculator 接口\n\n`DigestCalculator` 接口所示：\n\n```\n 1 /**\n\
  \ 2  * 通用接口，能够从输出流中\n 3  * 计算摘要。\n 4  */\n 5 public interface DigestCalculator\n\
  \ 6 {\n 7     /**\n 8      * 返回表示由计算器实现的摘要的算法标识符。\n 9      *\n10      *\n11    \
  \  * @return 算法 ID 和参数。\n12      */\n13     AlgorithmIdentifier getAlgorithmIdentifier();\n\
  14 \n15     /**\n16      * 返回一个用于计算摘要的接收数据的流。如果你想\n17      * 在运行过程中也累积数据，请使用\n18\
  \      * org.bouncycastle.util.io.TeeOutputStream。\n19      *\n20      * @return\
  \ 一个 OutputStream\n21      */\n22     OutputStream getOutputStream();\n23 \n24 \
  \    /**\n25      * 返回对写入计算器输出流的数据计算出的\n26      * 摘要。\n27      *\n28      *\n29\
  \      * @return 摘要。\n30      */\n31     byte[] getDigest();\n32 }\n```\n\n\n\n\n\
  通常情况下，你会通过 `DigestCalculatorProvider` 创建这些对象之一。在高级别 PKIX 类需要创建 `DigestCalculator`\
  \ 的情况下，你通常会找到一个接受 `DigestCalculatorProvider` 作为参数的方法。如果你使用的是 Bouncy Castle 不直接支持的加密\
  \ API（例如特定于 HSM 硬件安全模块的 API），并且你需要在使用 Bouncy Castle PKIX API 的过程中利用它来计算消息摘要，你通常需要实现\
  \ `DigestCalculatorProvider` 接口，以为你的消息摘要计算器实现创建一个提供者。\n\n`DigestCalculatorProvider`\
  \ 接口也基于 `AlgorithmIdentifier` 类，并包含一个方法。\n\n```\n1 /**\n2  * DigestCalculator 实现的提供者的基础接口。\n\
  3  */\n4 public interface DigestCalculatorProvider\n5 {\n6     DigestCalculator\
  \ get(AlgorithmIdentifier digestAlgorithmIdentifier)\n7     throws OperatorCreationException;\n\
  8 }\n```\n\n假设你不需要为这些对象中的一个提供自己的实现，如果你正在与 JCA 提供者工作，通常会使用 `JcaDigestCalculatorProviderBuilder`\
  \ 来创建一个 `DigestCalculatorProvider`。你也可以使用 `DefaultDigestAlgorithmIdentifierFinder`\
  \ 来解析大多数常见的消息摘要名称及其关联的 `AlgorithmIdentifier` 结构。例如，在使用 BC 提供者创建 SHA-256 消息摘要计算器时，它看起来如下：\n\
  \n```\n 1   /**\n 2    * 为传入的算法摘要名称返回一个 DigestCalculator。\n 3    *\n 4    * @param\
  \ digestName 摘要算法的名称。\n 5    * @return 用于 digestName 的 DigestCalculator。\n 6   \
  \ */\n 7   public static DigestCalculator createDigestCalculator(String digestName)\n\
  \ 8       throws OperatorCreationException\n9   {\n10       DigestAlgorithmIdentifierFinder\
  \ algFinder =\n11                                 new DefaultDigestAlgorithmIdentifierFinder();\n\
  12       DigestCalculatorProvider        digCalcProv =\n13           new JcaDigestCalculatorProviderBuilder().setProvider(\"\
  BC\").build();\n14 \n15       return digCalcProv.get(algFinder.find(digestName));\n\
  16   }\n```\n\n`createDigestCalculator` 的参数 `digestName` 以 “SHA-256” 的形式传入。对于像像这样的人为构造的示例，它看起来比\
  \ `MessageDigest.getInstance(\"SHA-256\")` 更复杂，但在 BC PKIX API 需求的语境下，这种方法实际上让工作变得简单许多。\n\
  \n使用 `DigestCalculator` 关在于获取输出流并将待摘要的信息写入输出流中。例如，对我们原始的 SHA-256 摘要示例进行重构如下：\n\n\
  ```\n 1 /**\n 2  * SHA-256 DigestCalculator 的创建和使用。\n 3  */\n  public class DigestCalculatorExample\n\
  \ 5 {\n 6     public static void main(String[] args)\n 7         throws Exception\n\
  \ 8     {\n 9         DigestCalculator digCalc = createDigestCalculator(\"SHA-256\"\
  );\n10 \n11         OutputStream dOut = digCalc.getOutputStream();\n12 \n13    \
  \     dOut.write(Strings.toByteArray(\"Hello World!\"));\n14 \n15         dOut.close();\n\
  16 \n17         System.out.println(Hex.toHexString(digCalc.getDigest()));\n18  \
  \   }\n19 }\n```\n\n如果你运行上面的示例，你会发现它产生的结果与我们之前过的使用 `MessageDigest` 的原始 SHA-256 示例相同。\n\
  \n你可以在 `org.bouncycastle.operator.bc` 包中找到 `DigestCalculatorProvider` 接口和 `DigestCalculator`\
  \ 接口实现的更多示例。这些实现没有使用 JCA，可以作为实现你自己的接口版本的指南。\n\n## MacCalculator 接口\n\n下面给出了 `MacCalculator`\
  \ 接口：\n\n```\n 1 /**\n2  * 用于密钥初始化操作的通用接口，该操作能够从输出流中\n3  * 计算 MAC。\n4  */\n5 public\
  \ interface MacCalculator\n6 {\n7     AlgorithmIdentifier getAlgorithmIdentifier();\n\
  8 \n9     /**\n10      * 返回一个接受数据的流，用于计算以供后续验证的\n11      * MAC。如果你还想在处理过程中累积数据，请使用\n\
  12      * org.bouncycastle.util.io.TeeOutputStream。\n13      *\n14      * @return\
  \ 一个 OutputStream\n15      */\n16     OutputStream getOutputStream();\n17 \n18 \
  \    /**\n19      * 根据写入流的内容返回计算出的 MAC。\n20      *\n21      * @return 计算出的 MAC。\n\
  22      */\n23     byte[] getMac();\n24 \n25 \n26     /**\n27      * 返回用于计算 MAC\
  \ 的密钥。\n28      *\n29      * @return MAC 密钥。\n30      */\n31     GenericKey getKey();\n\
  32 }\n```\n\n`MacCalculator` 的使用在 PKIX API 中往往更具专门性，因此并不是为它们有一个提供者类，而是为每个领域都有专门的构建器和提供者，例如\
  \ CMS（由 `JceCMSMacCalculatorBuilder` 表示）和 PKCS #12（由 `JcePKCS12MacCalculatorBuilderProvider`\
  \ 表示）。\n\n创建完成后，`MacCalculator` 的用法与 `DigestCalculator` 相同。你也可以在与不同 PKIX 协议相关的 `.bc`\
  \ 包中找到更多 `MacCalculator` 实现。这些实现没有使用 JCA，可以作为实现你自己的接口版本的指南。\n\n## 摘要的应用：默尔树\n\n\
  一个说明摘要有多么强大的良好例子是[默尔树](https://en.wikipedia.org/wiki/Merkle_tree)。默尔树是 Ralph Merkle\
  \ 在 1979 年左右提出的构想。它们最近由于比特币而变得广为人知，但在其他应用中也经常使用，例如出现在 RFC 6962 和 RFC 7574。\n\n###\
  \ 什么是默尔树？\n\n默尔树是摘要的树，叶节点摘要代表某些数据，分支节点摘要代表从下方节点摘要构建的摘要。\n\n![基础默尔树 - 数据用于生成叶节点哈希](img/chapter3----Merkle1.png)\n\
  \n从图中可以看出，根哈希在意义上代表树的哈希，因此代表存储在树中的所有数据的哈希。这是默尔树有用之处之一，无论有多少个数据值，你都可以使用默尔树将其减少为一个哈希，如果以后需要添加另一个数据值，不需要重新计算所有的哈希。你只需要计算新数据的哈希，然后重新计算受数据插入影响的分支节点直到根哈希。\n\
  \n这引导我们进入默尔树的另一个有用功能：你可以生成所谓的 `审计路径`（audit path），作为数据值已添加到树中的证明。我们可以在下面的图中看到审计路径是如何生成的。\n\
  \n![生成证明值 D2 存在的审计路径所涉及的步骤](img/chapter3----Merkle2.png)\n\n如所示，这关乎收集与数据路径相关的分支哈希。之所以这样做的原因是，一旦你计算了这些哈希以及你要证明在树中的数据的哈希，你就可以重新计算根哈希值。如果根哈希值计算出的哈希与树的实际根哈希相同，你就确认了审计路径显示你感兴趣的值确实在树中。\n\
  \n\n\n\n# 实现 Merkle 树的最佳方法是使用平衡树算法——其主要原因是它能保持审计路径最短，从而提供评估成本最低的证明。关于 Merkle 树的另外一个点是，它还提供了一个反警示，说明了如果你简单地拼接哈希值并输入哈希函数，会发生什么，因为你可能会发现自己容易受到二阶前像攻击（second\
  \ preimage attack）。虽然我们在这里不讨论细节，但从 Merkle 树的角度来看，这表现就像是你仅使用普通哈希函数对数据进行哈希，而有人欺骗你接受一个实际哈希值到树中，此时该树的根节点可能会被证明某个文档已插入其中，而实际上并没有插入。\n\
  \n幸运的是，这种情况通过在哈希处理之前为数据添加前缀，并对分支节点哈希使用不同的前缀是很容易避免的——这是 RFC 6962 中采用的方法。\n\n### MerkleTree\
  \ 类\n\n以下代码使用 AVL+ 树实现了 `MerkleTree`，它是平衡 AVL 树的一种变体，将插入的数据存储在叶子节点中。你会注意到，该树的实现通过在哈希计算中使用前缀提供了二阶前像抗性，这与\
  \ RFC 6962 的相同。为了利用围绕 Merkle 树的一些更高级的安全证明，你还需要修改此实现以限制树的大小。\n\n以下是代码：\n\n\n\n\n\n\
  ```java\n/**\n * 基于 AVL+ 树的 Merkle Tree 实现（其中数据始终\n * 存储叶子节点中）。\n */\npublic class\
  \ MerkleTree\n{\n    // 树节点的基类。\n    private class Node\n    {\n        byte[] keyValue;\n\
  \        byte[] hash;\n\n        // 如果此节点的 keyValue 大于\n        // 其他节点的 keyValue，返回\
  \ true。\n        boolean isGreaterThan(Node other)\n        {\n            for (int\
  \ i = 0; i != keyValue.length; i++)\n            {\n                int thisB =\
  \ this.keyValue[i] & 0xff;\n                int otherB = other.keyValue[i] & 0xff;\n\
  \                if (thisB > otherB)\n                {\n                    return\
  \ true;\n                }\n                else if (thisB < otherB)\n         \
  \       {\n                    return false;\n                }\n            }\n\
  \n            return false;\n        }\n    }\n\n    // 叶子节点。\n    private class\
  \ LeafNode\n        extends Node\n    {\n        final byte[] nodeValue;\n\n   \
  \     LeafNode(byte[] nodeHash, byte[] nodeValue)\n        {\n            this.keyValue\
  \ = nodeHash;\n            this.nodeValue = nodeValue;\n            this.hash =\
  \ nodeHash;\n        }\n    }\n\n    // 分支节点。\n    private class BranchNode\n  \
  \      extends Node\n    {\n        Node left, right;\n\n        BranchNode(Node\
  \ left, Node right)\n        {\n            this.left = left;\n            this.right\
  \ = right;\n            this.recalculateHash();\n            this.recalculateKeyValue();\n\
  \        }\n\n        void recalculateKeyValue()\n        {\n            this.keyValue\
  \ = findMaxValue(left);\n        }\n\n        void recalculateHash()\n        {\n\
