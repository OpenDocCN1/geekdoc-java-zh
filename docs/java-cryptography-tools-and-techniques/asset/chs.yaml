  \            else\n            {\n                return ((LeafNode)root).keyValue;\n\
  \            }\n        }\n    }\n\n    private final MessageDigest digest;\n  \
  \  private final byte[] emptyHash;\n\n    Node root;\n\n    /**\n     * 构造函数\n \
  \    * @param digest 用于生成树哈希的摘要算法。\n     */\n    public MerkleTree(MessageDigest\
