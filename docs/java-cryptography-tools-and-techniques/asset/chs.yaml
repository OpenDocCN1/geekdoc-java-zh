  \ bKp = keyPairGenB.generateKeyPair();\n48 \n49         // 使用 A 和 B 方的密钥对生成并打印共享密钥。\n\
  50         byte[] aValue = generateSecret(aKp.getPrivate(), bKp.getPublic());\n\
