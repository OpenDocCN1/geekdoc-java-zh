  \n### 12.5.4 区域\n\n在前一节中，你已经了解了如何通过构造由线条和曲线组成的通用路径来指定复杂形状。通过使用足够数量的线条和曲线，基本上可以绘制任何形状。例如，你在屏幕和打印输出看到的字体字符形状是由线条和二次或三次曲线组成的。\n\
  \n有时，通过由区域（如矩形、多边形或椭圆）组合来描述形状更为简单。Java 2D API 支持四种构造区域几何运算，可以将两个区域合并为一个新区域。\n\n\
  * `add`: 合并后的区域包含位于第一个或第二个区域中的所有点。\n* `subtract`: 合并后的区域包含位于第一个区域中但不在第二个区域中的所有点。\n\
  * `intersect`: 合并后的区域包含位于第一个和第二个区域中的所有点。\n* `exclusiveOr`: 合并后的区域包含位于第一个或第二个区域中，但不在两者之中的所有点。\n\
  \n图 12.40 显示了这些操作。\n\n![Figure](img/fig07-10.jpg)图 12.40: 构造区域几何运算\n\n要构造复杂的区域，从默认区域对象开始。\n\
  \n```\nvar a = new Area();\n```\n\n然后，将该区域与任何形状合并。\n\n```\na.add(new Rectangle2D.Double(.\
  \ . .));\na.subtract(path);\n. . .\n```\n\n`Area` 类实现了 `Shape` 接口。你可以使用 `Graphics2D`\
  \ 类的 `draw` 方法绘制区域的边界，或使用 `fill` 方法填充内部。\n\n## `java.awt.geom.Area`\n\n* `void add(Area\
  \ other)`\n* `void subtract(Area other)`\n* `void intersect(Area other)`\n* `void\
  \ exclusiveOr(Area other)`\n  此区域与另一个区域执行构造区域几何运算，并将此区域设置为结果。\n\n### 12.5.5 描边（Strokes）\n\
  \n`Graphics2D` 类的 `draw` 操作使用当前选的描边来绘制形状的边界。默认情况下，描边是 1 像素宽的实线。可以通过调用 `setStroke`\
  \ 方法并提供实现 `Stroke` 接口的类对象来选择不同的描边。Java 2D API 仅定义了一个这样的类，称为 `BasicStroke`。在本节中，我们将查看\
  \ `BasicStroke` 类的功能。\n\n你可以构造任意厚度的描边。例如，以下是绘制宽度为 10 像素线条的方法：\n\n```\ng2.setStroke(new\
  \ BasicStroke(10.0F));\ng2.draw(new Line2D.Double(. . .));\n```\n\n当描边厚度超过 1 像素时，描边的末端可以有不同的样式。图\
  \ 12.41 显示了这些所谓的端点样式（end cap）。你有三种选择：\n\n* 平端点（butt cap）直接在其终点结束描边。\n* 圆形端点（round\
  \ cap）在描边的末端添加一个半圆。\n* 方方形端点（square cap）在描边的末端添加一个半方形。\n\n![Figure](img/fig07-11.jpg)图\
  \ 12.41: 端点样式\n\n当两条描边相遇时，接头样式有三种选择（参见图 12.42）：\n\n* 平接头（bevel join）用一条垂直于角平分线的直线连接描边。\n\
  * 圆形接头（round join）扩展每个描边。\n* 尖接头（miter join）扩展两条描边。从技术上讲，这是角顶点距离除以描边宽度的比值。默认的尖角限制为\
  \ 10 度。你可以在 `BasicStroke` 构造函数中指定这些选择，例如：\n\n```\ng2.setStroke(new BasicStroke(10.0F,\
  \ BasicStroke.CAP_ROUND, BasicStroke.JOIN_ROUND));\ng2.setStroke(new BasicStroke(10.0F,\
  \ BasicStroke.CAP_BUTT, BasicStroke.JOIN_MITER,\n   15.0F /* miter limit */));\n\
  ```\n\n```\n\n如果两条线条以很小的角度汇合，将使用平接头。尖角限制控制这一点。\n\n最后，你可以通过设置模式来创建虚线。在列表 12.16 的程序中，你可以选择一种构成摩斯密码\
  \ SOS 的模式。该模式是一个 `float[]` 数组，包含了“开启”和“闭开”间隔的长度（参见图 12.43）。\n\n![Figure](img/fig07-13.jpg)图\
  \ 12.43: 模式\n\n在构造 `BasicStroke` 时，你可以指定模式和相位（dash phase）。相位指示线条从模式的何位置开始。描边起点之前的该长度段假设应用了该模式。通常，你将此值设置为\
  \ `0`。\n\n```\nfloat[] dashPattern = { 10, 10, 10, 10, 10, 10, 30, 10, 30, . . .\
  \ };\ng2.setStroke(new BasicStroke(10.0F, BasicStroke.CAP_BUTT, BasicStroke.JOIN_MITER,\n\
  \   10.0F /* miter limit */, dashPattern, 0 /* dash phase */));\n```\n\n端点样式应用于模式中*每个虚线*的末端。\n\
  \n列表 12.16 中的程序允许你指定端点样式、接头样式和虚线（参见图 12.44）。\n\n![Figure](img/image_path)图 12.42:\
  \ 接头样式\n\n如果两条线条以非常小的角度汇合，则将使用平接头。尖角限制控制这一点。\n\n\n\n\n该程序与 Listing 12.15 中的程序类似。鼠标监听器记录了你在线段端点的点击操作，而鼠标移动监听器则监控端点的拖拽。一组单选按钮允许用户选择端点样式（cap\
