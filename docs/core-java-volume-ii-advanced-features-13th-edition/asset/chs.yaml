  package composite;\n\nimport java.awt.*;\nimport java.awt.geom.*;\nimport java.awt.image.*;\n\
  import javax.swing.*;\n\n/**\n * 此组件绘制两个形状，通过组合规则进行组合。\n */\nclass CompositeComponent\
