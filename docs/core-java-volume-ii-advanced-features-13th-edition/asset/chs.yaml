  \n# 第 7 章 ▪ 国际化\n\n世界很大，我们希望这个世界上有许多居民对你的软件感兴趣。毕竟，互联网毫不费力地跨越了国家之间的界限。另一方面，当你忽视国际读众时，你实际上是在筑起一道障碍。\n\
  \n正如奥斯卡·王尔德（Oscar Wilde）著名的所言：“如今我们与美国几乎无所不同，除了语言之外。”\n\nJava 编程语言是第一个从底层开始就设计为支持国际化的语言。从一开始，它就具备了有效国际化所需的一个核心特性：对所有字符串都使用\
  \ Unicode。Unicode 的支持使得编写能够处理世界上大多数语言字符串的 Java 程序变得非常简单。\n\n许多程序员认为，使应用程序国际化所需要做的只是支持\
  \ Unicode 并翻译用户界面中的消息。然而，正如本章所示，程序的国际化远不止支持 Unicode 那么简单。日期、时间、货币甚至数字在世界不同地区的格式化方式都不相同。你需要一种简单的方法来为不同的语言配置菜单和按钮名称、消息字符串以及键盘快捷键。\n\
  \n在本章中，你将看到如何编写国际化的 Java 程序，以及如何本地化日期、时间、数字、文本和 GUI。我将向你展示 Java 为编写国际化程序提供的工具。本章以一个完整的示例结束——一个具有英语、德语和中文界面的退休计算器。\n\
  \n## 7.1. 区域 (Locales)\n\n当你看到一个适配国际市场的应用程序时，你注意到的最明显的区别是语言。这种观察对于真正的国际化来说其实有点局限，因为不同国家可能共享一种语言，但你可能仍然需要做一些工作让这两个国家的计算机用户都感到满意。正如奥斯卡·王尔德所说：“如今我们与美国几乎无所不同，除了语言之外。”\n\
  \n### 7.1.1 为什么需要区域？\n\n当你提供程序的国际化版本时，所有的程序消息都需要翻译成本地语言。然而，仅仅翻译用户界面文本是不够的。还有许多更微妙的差异——例如，数字在英语和德语中的格式化完全不同。数字\n\
  \n> 123,456.78\n\n对于德国用户来说，应该显示为\n\n> 123.456,78\n\n——也就是说，小数点和十逗号分隔符的作用反过了。日期的显示也有类似的差异。在美国，日期（某种不合理地）显示为月/日/年。德国使用更符合逻辑的日/月/年顺序，而在中国，习惯是年/月/日。因此，日期\n\
  \n> 3/22/61\n\n对德国用户应该呈现为\n\n> 22.03.1961\n\n当然，如果明确写出月份，语言的差异就显而易见了。英语的\n\n> March\
  \ 22, 1961\n\n在德语中应该呈现为\n\n> 22. März 1961\n\n或者在中文呈现呈现\n\n> 1961 年 3 月 22 日\n\n\
  区域（locale）捕捉了此类本地偏好。每当你展示数字、日期、货币值和其他格式随语言或位置而变化的项目时，你需要使用感知区域的（locale-aware APIs）。\n\
  \n### 7.1.2 指定区域\n\n一个区域由最多五个组件组成：\n\n1. 语言，由两个或三个小写字母指定，例如 `en`（英语）、`de`（德语）或 `zh`（中文）。表\
  \ 7.1 显示了常用代码。\n2. 可选的脚本，由首字母大写的四个字母字母指定，例如 `Latn`（拉丁）、`Cyrl`（西里尔）或 `Hant`（繁体中文）。这非常有用，因为某些语言（如塞尔维亚语）使用拉丁或西里尔字母编写，且某些中文读者偏于繁体字而非简体字。\n\
  3. 可选的国家或地区，由两个大写字母或三个数字指定，例如 `US`（美国）或 `CH`（瑞士）。表 7.2 显示了常用代码。\n4. 可选的变体（variant），指定方言或拼写规则等杂项特征。变体现在很少使用。挪威语曾有一个“尼挪威语”（Nynorsk）变体。\n\
  5. 可选的扩展，描述本地偏好。\n\n区域的规则制定在“最佳实践” BCP 47 ([https://rfc-editor.org/info/bcp47))\
  \ 中。你可以在 [https://www.w3.org/International/language-tags) 找到更易读的摘要。\n\n表 7.1：常用\
  \ ISO 639-1 语言代码\n\n| 语言 | 代码 | 语言 | 代码 |\n| :--- | :--- | :--- | :--- |\n| 中文 |\
  \ `zh` | 意大利语 | `it` |\n| 丹语 | `da` | 日语 | `ja` |\n| 荷兰语 | `nl` | 韩语 | `ko` |\n\
  | 英语 | `en` | 挪威语 | `no` |\n| 法语 | `fr` | 葡萄牙语 | `pt` |\n| 芬兰语 | `fi` | 西班牙语 | `es`\
  \ |\n| 德语 | `de` | 瑞典语 | `sv` |\n| 希语 | `el` | 土耳其语 | `tr` |\n\n表 7.2：常用 ISO 3166-1\
  \ 国家代码\n\n| 国家 | 代码 | 国家 | 代码 |\n| :--- | :--- | :--- | :--- |\n| 奥地利 | `AT` | 日本\
  \ | `JP` |\n| 比利时 | `BE` | 韩国 | `KR` |\n| 加拿大 | `CA` | 荷兰 | `NL` |\n| 中国 | `CN`\
  \ | 挪威 | `NO` |\n| 丹麦 | `DK` | 葡萄牙 | `PT` |\n| 芬兰兰 | `FI` | 西班牙 | `ES` |\n| 德国 |\
  \ `DE` | 瑞典 | `SE` |\n| 英国 | `GB` | 瑞士 | `CH` |\n| 希腊 | `GR` | 台湾 | `TW` |\n| 爱尔兰\
  \ | `IE` | 土耳其 | `TR` |\n| 意大利 | `IT` | 美国 | `US` |\n\n语言和国家代码通过标签（tags）描述——即由区域元素组成的连接字符串，例如\
  \ `en-US`。\n\n在德国，你会使用区域 `de-DE`。瑞士有四种官方语言（德语、法语、意大利语和罗曼什语）。瑞士的德语使用者会想要使用区域 `de-CH`。该区域使用德语规则，但货币值以瑞士法而非欧元表示。\n\
  \n如果你只指定语言，例如 `de`，那么该区域将无法用于货币等特定国家问题。\n\n\n\n\n\n你可以像这样从标签字符串构造一个 `Locale` 对象：\n\
  \n```\nLocale usEnglish = Locale.forLanguageTag(\"en-US\");\n```\n\n在仅指定语言或语言和国家的常见情况下，你可以使用\
  \ `Locale.of` 工厂方法：\n\n```\nLocale german = Locale.of(\"de\");\nLocale swissGerman\
  \ = Locale.of(\"de\", \"CH\");\n```\n\n`toLanguageTag` 方法产生给定给定 locale 的语言标签。例如，`Locale.US.toLanguageTag()`\
  \ 返回字符串 `\"en-US\"`。\n\n为了方便起见，这里为不同国家提供了许多预定义的 locale 对象：\n\n```\nLocale.CANADA\n\
  Locale.CANADA_FRENCH\nLocale.CHINA\nLocale.FRANCE\nLocale.GERMANY\nLocale.ITALY\n\
  Locale.JAPAN\nLocale.KOREA\nLocale.PRC\nLocale.TAIWAN\nLocale.UK\nLocale.US\n```\n\
  \n许多预定义的 locale 仅指定语言而不指定位置：\n\n```\nLocale.CHINESE\nLocale.ENGLISH\nLocale.FRENCH\n\
  Locale.GERMAN\nLocale.ITALIAN\nLocale.JAPANESE\nLocale.KOREAN\nLocale.SIMPLIFIED_CHINESE\n\
  Locale.TRADITIONAL_CHINESE\n```\n\n`Locale.ROOT` 具有语言中性的规则，这对于机器处理的字符串非常有用。\n\n\
  最后，静态方法 `getAvailableLocales` 返回虚拟机已知的所有 locale 数组。而 `availableLocales` 方法则返回一个流。\n\
  \n你可以通过 `Locale.getISOLanguages()` 获取所有语言代码，通过 `Locale.getISOCountries()` 获取所有国家代码。\n\
  \n### 7.1.3. 默认 Locale\n\n`Locale` 类的静态方法 `getDefault` 初始获取本地操作系统存储的默认 locale。你可以通过调用带有不同\
  \ locale 的 `setDefault` 方法来更改默认的 Java locale。\n\n某些操作系统允许用户为显示消息和格式化指定不同的 locale。例如，居住在美国的法语语者可以使用法语菜单，但货币值使用美元显示。\n\
  \n要获取这些偏好，请调用：\n\n```\nLocale displayLocale = Locale.getDefault(Locale.Category.DISPLAY);\n\
  Locale formatLocale = Locale.getDefault(Locale.Category.FORMAT);\n```\n\n在 UNIX\
  \ 中，你可以通过设置环境变量 `LC_NUMERIC`、`LC_MONETARY` 和 `LC_TIME` 为数字、货币和日期指定单独的 locale。Java\
  \ 不会这些设置。\n\n如果你想测试一个仅有语言和国家设置的 locale，可以在启动程序时在命令行提供它们。例如，在这里我们将默认 locale 设置为 `de-CH`：\n\
  \n```\njava -Duser.language=de -Duser.region=CH MyProgram\n```\n\n### 7.1.4. 显示名称\n\
  \n一旦你拥有了 locale，你可以用它做什么呢？事实证明，最初做不了什么。`Locale` 类中唯一有用的方法是那些识别语言和国家代码的方法。最重要的方法是\
  \ `getDisplayName`。它返回一个描述该 locale 的字符串。该字符串不包含晦涩的两个字母代码，而是一种可以呈现给用户的格式，例如：\n\n\
  ```\nGerman (Switzerland)\n```\n\n实际上，这里有一个问题。显示名称是用默认 locale 发布的。这可能并不合适。如果你的用户已经选择了德语作为首语言，你可能希望用德语呈现字符串。你可以通过将德语\
  \ locale 作为参数传递来实现。代码如下：\n\n```\nLocale locale = Locale.of(\"de\", \"CH\");\nSystem.out.println(locale.getDisplayName(Locale.GERMAN));\n\
  ```\n\n打印\n\n```\nDeutsch (Schweiz)\n```\n\n这个示例展示了为什么你需要 `Locale` 对象。你将它们传递给感知\
  \ locale 的方法，这些方法产生的文本将呈现给不同位置的用户。你将在后续章节中看到许多此类示例。\n\n即使是像字符串转换为小写或大写这种平凡的操作，也可能是\
  \ locale 特定的。例如，在土耳其 locale 中，字母 I 的小写是不带点的 ı。试图通过将字符串存储为小写来归一化字符串的程序在土耳其客户那里莫名地失败了，因为\
  \ I 和带点的 i 没有相同的小写版本。始终使用带有 `Locale` 参数的 `toUpperCase` 和 `toLowerCase` 变体是一个好主意。例如，尝试：\n\
  \n```\nString command = \"QUIT\".toLowerCase(Locale.of(\"tr\"));\n// 带有无点的 ı \"\
  quıt\"\n```\n\n当然，在土耳其，`Locale.getDefault()` 返回的就是该 locale，`\"QUIT\".toLowerCase()`\
  \ 不同于 `\"quit\"`。\n\n如果你想将英语字符串归一化为小写，应该向 `toLowerCase` 方法传递一个英语 locale。对于语言中性处理，请使用\
  \ `Locale.ROOT`。\n\n你可以显式设置输入输出操作的 locale：\n\n*   当从 `Scanner` 读取数字时，可以使用 `useLocale`\
  \ 方法设置其 locale。\n*   `String.format` 和 `PrintWriter.printf` 方法具有带有 `Locale` 参数的重载形式。\n\
  \n`java.util.Locale` 1.1\n\n*   `static Locale.of(String language)` 19\n*   `static\
  \ Locale.of(String language, String country)` 19\n    根据给定的语言和国家构造 locale。\n*  \
  \ `static Locale forLanguageTag(String languageTag)` 7\n    构造与给定语言标签对应的 locale。\n\
  *   `static Locale getDefault()`\n    返回默认 locale。\n*   `static void setDefault(Locale\
  \ newLocale)`\n    设置默认 locale。\n*   `String getDisplayName()`\n    返回描述当前 locale\
  \ 的字符串。\n*   `String getDisplayName(Locale inLocale)`\n    返回描述给定 locale 的字符串。\n\
  *   `String getLanguage()`\n    返回语言代码——两个字母 ISO 639 代码。\n*   `String getDisplayLanguage()`\n\
  \    返回当前 locale 的语言名称。\n*   `String getDisplayLanguage(Locale inLocale)`\n    返回给定\
  \ locale 的语言名称。\n*   `String getCountry()`\n    返回国家代码——两个字母 ISO 3166 代码。\n*   `static\
  \ String[] getISOCountries()`\n*   `static Set<String> getISOCountries(IsoCode type)`\
  \ 9\n    获取 2、3 或 4 位的国家代码。type 是常量 `PART1_ALPHA2`、`PART1_ALPHA3` 和 `PART3` 之一。\n\
  *   `String getCountry()`\n    返回当前 locale 的国家。\n*   `String getCountry(Locale inLocale)`\n\
  \    返回给定 locale 的国家。\n*   `String toLanguageTag()` 7\n    返回此 locale 的 IETF BCP\
  \ 47 语言标签——例如 `\"de-CH\"`。\n*   `String toString()`\n    返回 locale 的描述，语言和国家用下划线分隔（例如\
  \ `\"de_CH\"`）。仅用于调试。\n\n## 7.2 数字格式\n\n我已经提到过数字格式化是高度依赖环境的。Java 库提供一组位于 `java.text`\
  \ 包中的格式化对象，用于格式化数值。\n\n### 7.2.1 格式化数值\n\n按照以下步骤对特定 locale 进行格式化：\n\n1.  按照前面的章节获取\
  \ locale 对象。\n2.  使用“工厂方法”获取格式化对象。\n3.  使用格式化对象进行格式化和解析。\n\n工厂方法是 `NumberFormat`\
  \ 类带有 `Locale` 参数的静态方法。有三个工厂方法：`getNumberInstance`、`getCurrencyInstance` 和 `getPercentInstance`。这些方法分别返回可以格式化和解析数字、金额和百分比的对象。例如，这里是如何用德语格式化货币值：\n\
  \n```\nLocale locale = Locale.GERMAN;\nNumberFormat formatter = NumberFormat.getCurrencyInstance(locale);\n\
  double amount = 123456.78;\nString result = formatter.format(amount);\n```\n\n结果是\n\
  \n> 123.456,78 €\n\n注意货币符号是 € 且位于字符串末尾。还要注意小数点和小逗号的反转。\n\n\n\n\nJava 12 增加了一种“紧凑”格式，包含两种样式：短型（123K）和长型（123\
  \ thousand）。以下是获取短型格式的方法：\n\n```\nformatter = NumberFormat.getCompactNumberInstance(locale,\
  \ NumberFormat.Style.SHORT);\n```\n\n相反，要读取按照特定区域语言输入或存储的数字，请使用 `parse` 方法。例如，以下代码解析了用户在文本字段中输入的值。`parse`\
  \ 方法可以处理小数点、逗号，以及其他语言中的数字。\n\n```\nTextField inputField;\n. . .\nNumberFormat formatter\
  \ = NumberFormat.getNumberInstance();\n// 获取默认区域的数字格式化器\nNumber input = formatter.parse(inputField.getText().strip());\n\
  double x = input.doubleValue();\n```\n\n`parse` 的返回类型是抽象类型 `Number`。返回的对象是 `Double`\
  \ 或 `Long` 包装对象，取决于解析出的数字是否为浮点数。如果你不在乎这种区别，可以简单地使用 `Number` 类的 `doubleValue` 方法来获取包装后的数字。\n\
  \n`Number` 类型的对象不会自动拆箱——你不能简单地将 `Number` 对象赋值给原始类型。相反，请使用 `doubleValue` 或 `intValue`\
  \ 方法。\n\n如果数字文本格式不，该方法将抛出 `ParseException`。例如，字符串开头的空格是不允许的。（调用 `strip` 来将其移除）。然而，字符串中数字后的任何字符都会被忽略，因此不会抛出异常。\n\
  \n请注意，由 `getXxxInstance` 工厂方法返回的实例并不是 `NumberFormat` 类型。`NumberFormat` 类型是一个抽象类，实际的格式化器属于它的某一个子类。工厂方法仅知道如何定位属于特定区域语言的对象。\n\
  \n你可以使用静态方法 `getAvailableLocales` 获取当前支持的区域语言列表。该方法返回一个可以获取数字格式化器对象的区域语言数组。\n\n\
  你可以使用 `Scanner` 来读取本地化的整数和浮点数。调用 `useLocale` 方法设置区域语言。\n\n书籍的配套代码包含一个 GUI 程序，让你对数字格式化器进行实验（参见图\
  \ 7.1）。图形顶部的组合框包含所有带有数字格式化器的区域语言。你可以在数字、货币和百分比格式化器之间进行选择。每当你再次选择时，文本字段中的数字就会重新格式化。如果你浏览几个区域，就可以对数字或货币值的多种格式化方式有一个良好的印象。你还可以输入不同的数字并点击\
  \ Parse 按钮来调用 `parse` 方法，它会尝试解析你输入的内容。如果输入解析成功，将将其传递给 `format` 并显示结果。如果解析失败，文本字段中将显示“Parse\
  \ error”消息。\n\n![Figure](img/NumberFormatTest.jpg)图 7.1: `NumberFormatTest` 程序\n\
  \nListing 7.1 显示了数字格式化探索器的文本版本，稍微更容易理解。\n\nListing 7.1 numberFormat/NumberFormatTest2.java\n\
  \n```\npackage numberFormat;\n\nimport java.text.*;\nimport java.util.*;\nimport\
  \ util.*;\n\n/**\n * 此程序演示了在不同区域语言下的数字格式化。\n * @version 2.0 2021-09-22\n * @author\
  \ Cay Horstmann\n */\npublic class NumberFormatTest2\n{\n   public static void main(String[]\
  \ args)\n   {\n      Scanner in = new Scanner(System.in);\n      var locales = (Locale[])\
  \ NumberFormat.getAvailableLocales().clone();\n      Arrays.sort(locales, Comparator.comparing(Locale::getDisplayName));\n\
  \      Locale locale = Choices.choose(in, locales, Locale::getDisplayName);\n\n\
  \      var formatters = new LinkedHashMap<NumberFormat, String>();\n      formatters.put(NumberFormat.getNumberInstance(locale),\
  \ \"Number\");\n      formatters.put(NumberFormat.getCompactNumberInstance(\n  \
  \       locale, NumberFormat.Style.SHORT), \"Compact Short\");\n      formatters.put(NumberFormat.getCompactNumberInstance(\n\
  \         locale, NumberFormat.Style.LONG), \"Compact Long\");\n      formatters.put(NumberFormat.getPercentInstance(locale),\
  \ \"Percent\");\n      formatters.put(NumberFormat.getCurrencyInstance(locale),\
  \ \"Currency\");\n      NumberFormat formatter = Choices.choose(in, formatters);\n\
  \n      String operation = Choices.choose(in, \"Format\", \"Parse\");\n      if\
  \ (operation.equals(\"Format\"))\n      {\n         System.out.print(\"Enter a floating-point\
  \ number to format: \");\n         double number = in.nextDouble();\n         System.out.println(formatter.format(number));\n\
  \      }\n      else\n      {\n         System.out.print(\"Enter a floating-point\
  \ number to parse: \");\n         String text = in.next();\n         try \n    \
  \     {\n            System.out.println(formatter.parse(text));\n         } \n \
  \        catch (ParseException e) \n         {\n            System.out.println(\"\
  ParseException \" + e.getMessage());\n         }\n      }\n   }\n}\n```\n\n`java.text.NumberFormat`\
  \ 1\n\n* `static Locale[] getAvailableLocales()`\n    返回一个 `Locale` 对象数组，其中包含 `NumberFormat`\
  \ 格式化器。\n* `static NumberFormat getNumberInstance()`\n* `static NumberFormat getNumberInstance(Locale\
  \ inLocale)`\n    返回当前区域语言或给定区域语言的格式化器。\n* `static NumberFormat getCurrencyInstance()`\n\
  * `static NumberFormat getCurrencyInstance(Locale inLocale)`\n    返回当前区域语言或给定区域语言的货币格式化器。\n\
  * `static NumberFormat getPercentInstance()`\n* `static NumberFormat getPercentInstance(Locale\
  \ inLocale)`\n    返回当前区域语言或给定区域语言的百分比格式化器。\n* `static NumberFormat getCompactNumberInstance()`\n\
  * `static NumberFormat getCompactNumberInstance(Locale locale, NumberFormat.Style\
  \ formatStyle)`\n    返回当前区域语言和 `SHORT` 样式的紧凑数字格式化器，或给定区域语言和样式（`SHORT` 或 `LONG`）的格式化器。\n\
  * `String format(double number)`\n* `String format(long number)`\n    返回格式化给定浮点数或整数字符串。\n\
  * `Number parse(String source)`\n    解析给定字符串并返回数值。如果输入字符串是浮点数，则返回 `Double`，否则返回\
  \ `Long`。字符串开头必须包含数字；不允许有前空格。数字后面可以跟随其他字符，这些字符会被忽略。如果解析失败，则抛出 `ParseException`。\n\
