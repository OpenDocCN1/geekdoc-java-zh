  \n有许多 C++ 注释解释了 Java 编程语言与 C++ 之间的区别。如果你对 C++ 不感兴趣，可以跳过它们。\n\nJava 自带了一个大型编程库，或者说应用程序接口（API）。当第一次使用\
  \ API 调用时，我会在章节末尾添加简短的摘要描述。这些描述稍微非正式，但希望比官方在线 API 文档中的描述更有信息量。接口的名称使用斜体。类、接口或方法名称后的数字是引入它的\
