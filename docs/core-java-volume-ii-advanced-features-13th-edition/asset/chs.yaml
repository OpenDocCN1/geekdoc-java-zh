  \ Kostaras、Jerzy Krolak、Chris Laffra、Charlie Lai（Apple）、Angelika Langer、Jeff Langr（Langr\
  \ Software Solutions）、Doug Langston、Hang Lau（麦吉大学）、Mark Lawrence、Doug Lea（纽约州立大学奥戈）、Gregory\
