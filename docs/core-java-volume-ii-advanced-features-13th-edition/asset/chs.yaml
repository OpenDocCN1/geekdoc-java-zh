  \ | `IntegerSyntax` |  |  |  |\n| `PagesPerMinuteColor` | `IntegerSyntax` |  | \
  \ |  |\n| `PDLOverride` | `Enum` |  |  |  |\n| `PresentationDirection` | `ATTEMPTED`,\
  \ `NOT_ATTEMPTED`, `TORIGHT_BOTTOM`, `TORIGHT_TOP`, `TOLEFT_BOTTOM`, `TOLEFT_TOP`\
  \ |  |  |  |\n| `RequestingUserName` | `TextSyntax` |  |  |  |\n| `QueuedJobCount`\
  \ | `IntegerSyntax` |  |  |  |\n| `ReferenceUrSupported` | `FILE`, `FTP`, `GOPHER`,\
  \ `HTTP`, `HTTPS`, `NEWS`, `NNTP`, `WAIS` |  |  |  |\n| `Severity` | `ERROR`, `WARNING`\
  \ |  |  |  |\n| `SheetCollate` | `COLLATED`, `UNCOLLATED` | ✓ | ✓ |  |\n| `Sides`\
  \ | `ONE_SIDED`, `DUPLEX` (`TWO_SIDED_LONG_EDGE`), `TUMBLE` (`TWO_SIDED_SHORT_EDGE`)\
  \ | ✓ | ✓ |  |\n\n你可以看到，有很多属性，其中许多属性源自互联网打印协议 1.1 (RFC 2911)。\n\n早期版本的打印 引入了 `JobAttributes`\
  \ 和 `PageAttributes` 类，其目的与本节涵盖的打印属性相似。这些类现在已经过时。\n\n`javax.print.attribute.Attribute`\
  \ 1.4\n\n*   `Class getCategory()`\n    获取此属性的类别。\n\n*   `String getName()`\n  \
  \  获取此属性的。\n\n`javax.print.attribute.AttributeSet` 1.4\n\n*   `boolean add(Attribute\
  \ attr)`\n    将属性添加到集合中。如果集合已有相同类别的属性，则由给定的属性替换。如果集合由于此操作发生了变化，则返回 `true`。\n\n*\
  \   `Attribute get(Class category)`\n    检索给定类别键的属性，如果不存在此类属性，则返回 `null`。\n\n* \
  \  `boolean remove(Attribute attr)`\n\n*   `boolean remove(Class category)`\n  \
  \  从集合中删除给定属性，或给定类别的属性。如果集合由于此操作发生了变化，则返回 `true`。\n\n*   `Attribute[] toArray()`\n\
  \    返回包含集合中所有属性的数组。\n\n`javax.print.PrintService` 1.4\n\n*   `PrintServiceAttributeSet\
  \ getAttributes()`\n    获取此打印服务的属性。\n\n`javax.print.DocPrintJob` 1.4\n\n*   `PrintJobAttributeSet\
  \ getAttributes()`\n    获取此打印作业的属性。\n\n你现在已经结束了这个涵盖高级 Swing 和 AWT 特性的长章节。在最后一章中，我们将转向\
  \ Java 编程的另一个方面：在同一台机器上与不同编程语言的“原生”代码交互。\n\n\n\n\n# 第 13 章 原生方法\n\n虽然在原则上，“100%\
  \ 纯 Java”的方案很完美，但在某些情况下，你可能想要编写（或使用）另一种语言的代码。这种代码通常被称为*原生*代码。\n\n特别是在 Java 早期，许多人认为使用\
  \ `C` 或 `C++` 来加速 Java 应用的关键部分是一个好主意。然而，在实践中，这很少有用。1996 年 JavaOne 大会的一场演讲清楚地说明了这一点。Sun\
  \ Microsystems 密码库的开发者报告说，他们加密函数的纯 Java 平台实现已经绰绰有余。代码确实没有 `C` 实现那么快，但事实证明这并不重要。Java\
  \ 平台的实现速度远快于网络 I/O，而实际上才是真正的瓶颈。\n\n当然，使用原生代码也有缺点。如果你的应用程序的一部分是用另一种语言编写的，你必须为你想要支持的每个平台提供独立的原生库。用\
  \ `C` 或 `C++` 编写的代码无法防止因无效指针使用而导致的内存覆盖。很容易编写出损坏你的程序或感染操作系统的原生方法。\n\n因此，我建议仅在需要时才使用原生代码。特别是，原生代码可能是正确选择的三个原因：\n\
  \n*   你的应用程序需要访问 Java 平台无法访问的系统功能或设备。\n*   你在另一种语言中拥有了大量经过测试和调试的代码，并且你知道如何将其迁移到所有预期的目标平台。\n\
  *   你通过基准测试发现，Java 代码比另一种语言的等效代码慢得多。\n\nJava 平台有一个与原生 `C` 代码交互的 API，称为 Java Native\
  \ Interface（`JNI`）。我们将在本章中讨论 `JNI` 编程。\n\n你也可以使用 `C++` 代替 `C` 来编写原生方法。这有几个优势——类型检查稍微严格，且访问\
  \ `JNI` 函数稍微方便一些。然而，`JNI` 不支持 Java 和 `C++` 类之间的任何映射。\n\n正如你将看到的，在 Java 和原生代码之间提供绑定层涉及某种程度的繁琐。Java\
  \ 17 具有一项预览功能，提供了一个访问“外部”函数和内存的 API，它比 `JNI` 方便得多。在本章的最后，你将领略这个 API。\n\n## 13.1\
  \ 从 Java 程序调用 C 函数\n\n假设你有一个 `C` 函数，它可以执行你喜欢的操作，由于某种原因或其他原因，你不想麻烦在 Java 中重新实现它。为了为了起，我们将从一个打印问候语的简单\
  \ `C` 函数开始。\n\nJava 编程语言使用 `native` 关键字表示原生方法，你显然需要将方法置于类中。结果如 列表 13.1 所示。\n\n`native`\
  \ 关键字提醒编译器该方法将在外部定义。当然，原生方法不包含任何 Java 代码，且方法头后面紧跟着一个终止分号。因此，原生方法的声明看起来与抽象方法的声明相似。\n\
  \n列表 13.1 `helloNative/HelloNative.java`\n\n```\n/**\n *  @version 1.11 2007-10-26\n\
  \ *  @author Cay Horstmann\n */\nclass HelloNative\n{  \n   public static native\
  \ void greeting();\n}\n```\n\n为了保持示例简单，我们在这里没有使用包。\n\n在 particular 示例中，原生方法也被声明为\
  \ `static`。原生方法既可以是静态的，也可以是非静态的。我们将从静态方法开始，因为我们还不想处理参数传递。\n\n你实际上可以编译这个类，但如果你尝试在程序中使用它，虚拟机会告诉它不知道如何找到\
  \ `greeting`——报告 `UnsatisfiedLinkError`。要实现原生代码，请编写一个相应的 `C` 函数。你必须*完全*按照 Java 虚拟机期望的方式来命名该函数。规则如下：\n\
  \n1.  使用完整的 Java 方法名，例如 `HelloNative.greeting`。如果类在包中，在前面加上包名，例如 `com.horstmann.HelloNative.greeting`。\n\
  2.  将每个点替换为下划线，并加上前缀 `Java_`。例如，`Java_HelloNative_greeting` 或 `Java_com_horstmann_HelloNative_greeting`。\n\
  3.  如果类名包含不是 ASCII 字母或数字的字符——即 `'_'`、`'$'` 或代码大于 `\\u007F` 的 Unicode 字符——将其替换为 `_0xxxx`，其中\
  \ `xxxx` 是字符 Unicode 值的四十六进制数字序列。\n\n如果你*重载*了原生方法——也就是说，如果你提供了多个同名的原生方法——你必须附加一个双下划线，后跟编码后的参数类型。（我将在本章稍后描述参数类型的编码。）例如，如果你有一个原生方法\
  \ `greeting` 和另一个原生方法 `greeting(int repeat)`，那么第一个被调用为 `Java_HelloNative_greeting__`，第二个为\
  \ `Java_HelloNative_greeting__I`。\n\n实际上，没有人手动这样做；相反，运行带有 `-h` 标志的 `javac`，并提供应该放置头文件的目录：\n\
  \n```\njavac -h . HelloNative.java\n```\n\n此命令会在当前目录创建一个头文件 `HelloNative.h`，如 列表\
  \ 13.2 所示。\n\n列表 13.2 `helloNative/HelloNative.h`\n\n```\n/* DO NOT EDIT THIS FILE\
  \ - it is generated */\n#include <jni.h>\n/* Header for class HelloNative */\n#ifndef\
  \ Included_HelloNative\n#ifdef __plusplus\nextern \"C\" {\n#endif\n/*\n * Class:\
  \     HelloNative\n * Method:    greeting\n * Signature: ()V\n */\nJNIEXPORT void\
  \ JNICALL Java_HelloNative_greeting\n  (JNIEnv *, jclass);\n\n#ifdef __plusplus\n\
  }\n#endif\n#endif\n```\n\n正如你看到的，此文件包含了 `Java_HelloNative_greeting` 的声明。（`JNIEXPORT`\
  \ 和 `JNICALL` 是取决于编译器的限定符。）\n\n现在，简单地将函数原型复制到源文件中并提供函数的实现代码，如 列表 13.3 所示。\n\n列表\
  \ 13.3 `helloNative/HelloNative.c`\n\n```\n/*\n   @version 1.10 1997-07-01\n   @author\
  \ Cay Horstmann\n*/\n\n#include \"HelloNative.h\"\n#include <stdio.h>\n\nJNIEXPORT\
  \ void JNICALL Java_HelloNative_greeting(JNIEnv* env, jclass cl)\n{\n   printf(\"\
  Hello, Native World!\\n\");\n}\n```\n\n在这个简单的函数中，忽略 `env` 和 `cl` 参数。稍后你会看到它们的使用。\n\
  \n你可以使用 `C++` 代替 `C` 来实现原生方法。然而，你必须将实现原生方法的函数声明为 `extern \"C\"`。（这阻止 C++ 编译器对方法名进行符号修饰。）例如，\n\
  \n```cpp\nextern \"C\"\nJNIEXPORT void JNICALL Java_HelloNative_greeting(JNIEnv*\
  \ env, jclass cl)\n{\n   cout << \"Hello, Native World!\" << endl;\n}\n```\n\n将原生\
  \ `C` 代码编译成动态加载库。细节取决于编译器。\n\n例如，在 Linux 上使用 GNU `C` 编译器，使用这些命令：\n\n```bash\ngcc\
  \ -fPIC -I jdk/include -I jdk/include/linux -shared -o libHelloNative.so HelloNative.c\n\
  ```\n\n在 Windows 下使用 Microsoft 编译器，命令为：\n\n```bash\ncl -I jdk\\include -I jdk\\\
  include\\win32 -LD HelloNative.c -FeHelloNative.dll\n```\n\n在这里，`jdk` 是包含 JDK 的目录。如果你在命令行窗口中使用\
  \ Microsoft 编译器，首先运行类似 `vsvars32.bat` 或 `vcvarsall.bat` 的批处理文件。该批文件设置了编译器所需的路径和环境变量。\n\
  \n\n\n\n\n你也可以使用 [`www.cygwin.com`](https://www.cygwin.com) 提供的免费 `Cygwin` 程序环境。它包含了用于在\
  \ Windows 上进行 UNIX 风格编程的 GNU C 编译器和库。使用 Cygwin，使用命令：\n\n```\ngcc -mno-cygwin -D\
  \ __int64=\"long long\" -I jdk/include/ -I jdk/include/win32 \\\n   -shared -Wl,--add-stdcall-alias\
  \ -o HelloNative.dll HelloNative.c\n```\n\n头文件 `jni_md.h` 包含类型声明：\n\n```\ntypedef\
  \ __int64 jlong;\n```\n\n这是针对 Microsoft 编译器的。如果你使用 GNU 编译器，可能需要编辑该文件，例如：\n\n```c\n\
  #ifdef __GNUC__\n   typedef long long jlong;\n#else\n   typedef __int64 jlong;\n\
  #endif\n```\n\n或者，如示例中的编译器调用所示，使用 `-D __int64=\"long long\"` 进行编译。\n\n最后，在你的程序中添加对\
  \ `System.loadLibrary` 方法的调用。为了确保虚拟机在第一次使用类之前加载库，请使用静态初始化块，如 Listing 13.4 所示。\n\n\
  Figure 13.1 给出了原生代码处理的总结。\n\n![Figure](img/fig12-01.jpg) 图 13.1: 处理原生代码\n\nListing\
  \ 13.4 helloNative/HelloNativeTest.java\n\n```java\n/**\n *  @version 1.11 2007-10-26\n\
  \ *  @author Cay Horstmann\n */\nclass HelloNativeTest\n{  \n   public static void\
  \ main(String[] args)\n   {\n      HelloNative.greeting();\n   }\n\n   static\n\
  \   {  \n      System.loadLibrary(\"HelloNative\");\n   }\n}\n```\n\n编译并运行此程序后，终端窗口将显示消息“Hello,\
  \ Native World!”。\n\n如果你运行 Linux，你必须将当前目录添加到库路径中。可以设置 `LD_LIBRARY_PATH` 环境变量：\n\n\
  ```bash\nexport LD_LIBRARY_PATH=.:$LD_LIBRARY_PATH\n```\n\n或者设置 `java.library.path`\
  \ 系统属性：\n\n```bash\njava -Djava.library.path=. HelloNativeTest\n```\n\n当然，这本身并不特别令人印象深刻。然而，请记住，这条消息是由\
  \ C 的 `printf` 命令生成的，而不是由任何 Java 代码。我们已经迈了跨越这两种语言鸿沟的第一步！\n\n总而言之，按照以下步骤将原生方法链接到\
  \ Java 程序中：\n\n1. 在 Java 类中声明原生方法。\n2. 运行 `javac -h` 以获取带有该方法 C 声明的头文件。\n3. 在 C\
  \ 中实现原生方法。\n4. 将代码放在共享库中。\n5. 在你的 Java 程序中加载该库。\n\n`java.lang.System` 1.0\n\n* \
  \  `void loadLibrary(String libname)`\n    加载具有给定名称的库。该库位于库搜索路径中。定位库的具体方法取决于操作系统。\n\
  \n某些用于原生代码的共享库必须执行某些初始化。你可以将任何初始化代码放入 `JNI_OnLoad` 方法中。同样，当虚拟机（VM）关闭时，如果你提供了，它将调用\
  \ `JNI_OnUnload` 方法。原型如下：\n\n```c\njint JNI_OnLoad(JavaVM* vm, void* reserved);\n\
  void JNI_OnUnload(JavaVM* vm, void* reserved);\n```\n\n`JNI_OnLoad` 方法需要返回它所需的最小虚拟机版本，例如\
  \ `JNI_VERSION_1_2`。\n\n## 13.2 数值参数和返回值\n\n在 C 和 Java 之间传递数字时，你应该理解哪些类型是相互对应的。例如，虽然\
  \ C 确实有名为 `int` 和 `long` 的数据类型，但它们的实现取决于平台。在某些平台上，`int` 是 16 位的量，而在另一些平台上，它是 32\
  \ 位的量。在 Java 平台上，当然，`int` 始终是一个 32 位的整数。由于这个原因，JNI 定义了 `jint`、`jlong` 等类型。\n\nTable\
  \ 13.1 显示了 Java 类型与 C 类型之间的对应。\n\n表 13.1: Java 类型与 C 类型\n\n| Java 编程语言 | C 编程语言\
  \ | 字节 |\n| --- | --- | --- |\n| `boolean` | `jboolean` | 1 |\n| `byte` | `jbyte`\
  \ | 1 |\n| `char` | `jchar` | 2 |\n| `short` | `jshort` | 2 |\n| `int` | `jint`\
  \ | 4 |\n| `long` | `jlong` | 8 |\n| `float` | `jfloat` | 4 |\n| `double` | `jdouble`\
  \ | 8 |\n\n在头文件 `jni.h` 中，这些类型使用 `typedef` 语句声明为目标平台上的对应类型。该头文件还定义了常量 `JNI_FALSE`\
  \ 和 `JNI_TRUE`。\n\n在 Java 5 之前，Java 没有 `printf` 的直接对应物。在以下示例中，我们将假装你停留在 Java 5。Listing\
  \ 13.4 显示了一个使用原生方法的类。\n\nListing 13.4 helloNative/HelloNativeTest.java\n\n```java\n\
  /**\n *  @version 1.11 2007-10-26\n *  @author Cay Horstmann\n */\nclass HelloNativeTest\n\
  {  \n   public static void main(String[] args)\n   {\n      HelloNative.greeting();\n\
  \   }\n\n   static\n   {  \n      System.loadLibrary(\"HelloNative\");\n   }\n}\n\
  ```\n\n## 13.3 字符串参数\n\n接下来，让我们看看如何在原生方法之间传输字符串。字符串在两种语言中非常截然不同：在 Java 中，字符串是 UTF-16\
  \ 代码点的序列，而 C 字符串是空终止符结尾的字节序列。JNI 有两组函数用于操作字符串：一组将 Java 字符串转换为“修改后的 UTF-8”字节序列，另一组将它们转换为\
  \ UTF-16 值的数组——即 `jchar` 数组。（UTF-8、“修改后的 UTF-8”和 UTF-16 格式在 第 2 章 中讨论过。记得 UTF-8\
  \ 和“修改后的 UTF-8”编码保持 ASCII 字符不变，但所有其他字符都被编码为多字节序列。）\n\n标准 UTF-8 编码和“修改后的 UTF-8”编码仅在代码高于\
  \ `0xFFFF` 的字符上不同。在标准 UTF-8 编码中，这些字符被编码为 4 字节序列。在“修改后的”编码中，每个这样的字符首先被编码为 UTF-16\
  \ 编码中的一对“代理项”，然后每个代理项都用 UTF-8 编码，产生总共 6 个字节。这种做法很笨拙，但它是历史性的偶然——当在编写 JVM 规范时，Unicode\
  \ 仍然限制在 16 位。\n\n\n\n\n\n带有 `String` 参数的原生方法实际上接收的是一个名为 `jstring` 的不透明类型值。返回类型为\
  \ `String` 的原生方法必须返回 `jstring` 类型的值。JNI 函数用于读取和构造这些 `jstring` 对象。例如，`NewStringUTF`\
  \ 函数根据包含 ASCII 字符的 `char` 数组（或者更广泛地说是“修改后的 UTF-8”编码的字节序列）创建一个新的 `jstring` 对象。\n\n\
  JNI 函数的调用约定有些奇异。以下是调用 `NewStringUTF` 函数的示例：\n\n```\nJNIEXPORT jstring JNICALL Java_HelloNative_getGreeting(JNIEnv*\
  \ env, jclass cl)\n{\n   jstring jstr;\n   char greeting[] = \"Hello, Native World\\\
  n\";\n   jstr = (*env)->NewStringUTF(env, greeting);\n   return jstr;\n}\n```\n\n\
  除非另有说明，本章中的所有代码均为 C 代码。\n\n所有对 JNI 函数的调用都使用 `env` 指针，它是每个原生方法的第一个参数。`env` 指针是一个指向函数指针列表的指针（参见图\
  \ 13.2）。因此，你必须在每个 JNI 调用前加上 `(*env)->` 来实际解引用函数指针。此外，`env` 是每个 JNI 函数的第一个参数。\n\n\
  ![Figure](img/fig12-02.jpg)图 13.2:`env` 指针\n\n在 C++ 中访问 JNI 函数更为简单。当用 C++ 编译时，`JNIEnv`\
  \ 是一个带有内联成员函数的类，这些函数会为你处理函数指针查找。例如，你可以这样调用 `NewStringUTF` 函数：\n\n```\njstr = env->NewStringUTF(greeting);\n\
  ```\n\n注意，你在调用的参数列表中省略了 `JNIEnv` 指针。\n\n`NewStringUTF` 函数允许你构造一个新的 `jstring`。要读取现有\
  \ `jstring` 对象的内容，请使用 `GetStringUTFChars` 函数。该函数返回一个指向描述字符串的“修改后的 UTF-8”字符的 `const\
  \ jbyte*` 指针。注意，特定的虚拟机可以自由选择这种字符编码作为其内部字符串表示，因此你可能会得到一个指向实际 Java 字符串的字符指针。由于 Java\
  \ 字符串被设计为不可变的，因此认真对待 `const` 关键字并且不要尝试写入该字符数组是非常重要的。另一方面，如果虚拟机使用 UTF-16 或 UTF-32\
  \ 字符作为其内部字符串表示，此函数调用将分配一个新的内存块，并在其中填充“修改后的 UTF-8”等效字符。\n\n虚拟机必须知道你何时结束使用该字符串，以便对其进行垃圾回收（垃圾回收器在单独线程中运行，它可以中断原生方法的执行）。因此，你必须调用\
  \ `ReleaseStringUTFChars` 函数。\n\n或者，你也可以调用 `GetStringRegion` 或 `GetStringUTFRegion`\
  \ 方法提供自己的缓冲区来存放字符串字符。\n\n最后，`GetStringUTFLength` 函数返回字符串的“修改后的 UTF-8”编码所需的字符数。\n\
  \n你可以在 [`docs.oracle.com/javase/8/docs/technotes/guides/jni`](https://docs.oracle.com/javase/8/docs/technotes/guides/jni)\
  \ 找到 JNI API。\n\n### 从 C 代码访问 Java 字符串\n\n*   `jstring NewStringUTF(JNIEnv* env,\
  \ const char bytes[])`\n    从零字节终止的“修改后的 UTF-8”字节序列返回一个新的 Java 字符串对象，如果无法构造字符串则返回\
  \ `NULL`。\n*   `jsize GetStringUTFLength(JNIEnv* env, jstring string)`\n    返回“修改后的\
  \ UTF-8”编码所需的字节数（不计零字节终止符）。\n*   `const jbyte* GetStringUTFChars(JNIEnv* env, jstring\
  \ string, jboolean* isCopy)`\n    返回指向字符串的“修改后的 UTF-8”编码的指针，如果无法构造字符数组则返回 `NULL`。该指针在调用\
  \ `ReleaseStringUTFChars` 之前有效。`isCopy` 指向 `jboolean`，如果制作了副本，则填充 `JNI_TRUE`，否则填充\
  \ `JNI_FALSE`。\n*   `void ReleaseStringUTFChars(JNIEnv* env, jstring string, const\
  \ jbyte bytes[])`\n    通知虚拟机原生代码不再需要通过 `bytes`（由 `GetStringUTFChars` 返回的指针）访问 Java\
  \ 字符串。\n*   `void GetStringRegion(JNIEnv *env, jstring string, jsize start, jsize\
  \ length, jchar *buffer)`\n    将字符串中的序列 UTF-16 双字节复制到大小至少为 2 × `length` 的用户提供的缓冲区中。\n\
  *   `void GetStringUTFRegion(JNIEnv *env, jstring string, jsize start, jsize length,\
  \ jbyte *buffer)`\n    将字符串中的序列“修改后的 UTF-8”字节复制到用户提供的缓冲区中。缓冲区必须足够大以容这些字节。在坏情况下，将复制\
  \ 3 × `length` 字节。\n*   `jstring NewString(JNIEnv* env, const jchar chars[], jsize\
  \ length)`\n    从 Unicode 字符串返回一个新的 Java 字符串对象，如果无法构造字符串则返回 `NULL`。\n*   `jsize\
  \ GetStringLength(JNIEnv* env, jstring string)`\n    返回字符串中的字符数。\n*   `const jchar*\
  \ GetStringChars(JNIEnv* env, jstring string, jboolean* isCopy)`\n    返回指向字符串的 Unicode\
  \ 编码的指针，如果无法构造字符数组则返回 `NULL`。该指针在调用 `ReleaseStringChars` 之前有效。`isCopy` 为 `NULL`\
  \ 或指向一个 `jboolean`，如果制作了副本，则填充 `JNI_TRUE`，否则填充 `JNI_FALSE`。\n*   `void ReleaseStringChars(JNIEnv*\
  \ env, jstring string, const jchar chars[])`\n    通知虚拟机原生代码不再需要通过 `chars`（由 `GetStringChars`\
  \ 返回的指针）访问 Java 字符串。\n\n让我们这些函数用起来，编写一个调用 C 函数 `sprintf` 的类。我们希望像列表 13.8 所示那样调用该函数。\n\
  \n列表 13.8 printf2/Printf2Test.java\n\n```\n/**\n * @version 1.10 1997-07-01\n *\
  \ @author Cay Horstmann\n */\nclass Printf2Test\n{\n   public static void main(String[]\
  \ args)\n   {\n      double price = 44.95;\n      double tax = 7.75;\n      double\
  \ amountDue = price * (1 + tax / 100);\n\n      String s = Printf2.sprint(\"Amount\
  \ due = %8.2f\", amountDue);\n      System.out.println(s);\n   }\n}\n```\n\n列表 13.9\
  \ 显示了带有原生 `sprint` 方法的类。\n\n列表 13.9 printf2/Printf2.java\n\n```\n/**\n * @version\
  \ 1.10 1997-07-01\n * @author Cay Horstmann\n */\nclass Printf2\n{\n   public static\
  \ native String sprint(String format, double x);\n\n   static\n   {\n      System.loadLibrary(\"\
  Printf2\");\n   }\n}\n```\n\n因此，格式化浮点数的 C 函数原型原型为\n\n```\nJNIEXPORT jstring JNICALL\
  \ Java_Printf2_sprint(JNIEnv* env, jclass cl, \n      jstring format, jdouble x)\n\
  ```\n\n列表 13.10 显示了 C 语言的代码。注意调用 `GetStringUTFChars` 来读取格式参数，调用 `NewStringUTF` 来生成返回值，以及调用\
  \ `ReleaseStringUTFChars` 通知虚拟机不再需要对该字符串的访问。\n\n列表 13.10 printf2/Printf2.c\n```\n\
  \n\n\n\n\n```\n/**\n   @version 1.10 1997-07-01\n   @author Cay Horstmann\n*/\n\n\
  #include \"Printf2.h\"\n#include <string.h>\n#include <stdlib.h>\n#include <float.h>\n\
  \n/**\n   @param format 一个包含 printf 格式说明符的字符串\n   (例如 \"%8.2f\"）。子字符串 \"%%\" 被跳过。\n\
  \   @return 指向格式说明符的指针（跳过 '%')），\n   如果没有唯一的格式说明符，则返回 NULL。\n*/\nchar* find_format(const\
  \ char format[])\n{  \n   char* p;\n   char* q;\n\n   p = strchr(format, '%');\n\
  \   while (p != NULL && *(p + 1) == '%') /* 跳过 %% */\n      p = strchr(p + 2, '%');\n\
  \   if (p == NULL) return NULL;\n   /* 现在检查 % 是否是唯一的 */\n   p++;\n   q = strchr(p,\
  \ '%');\n   while (q != NULL && *(q + 1) == '%') /* 跳过 %% */\n      q = strchr(q\
  \ + 2, '%');\n   if (q != NULL) return NULL; /* % 不唯一 */\n   q = p + strspn(p, \"\
  \ -0+#\"); /* 跳过标志 */\n   q += strspn(q, \"0123456789\"); /* 跳过字段宽度 */\n   if (*q\
  \ == '.') { q++; q += strspn(q, \"0123456789\"); }\n      /* 跳过精度 */\n   if (strchr(\"\
  eEfFgG\", *q) == NULL) return NULL;\n      /* 不是浮点数格式 */\n   return p;\n}\n\nJNIEXPORT\
  \ jstring JNICALL Java_Printf2_sprint(JNIEnv* env, jclass cl, \n      jstring format,\
  \ jdouble x)\n{  \n   const char* cformat;\n   char* fmt;\n   jstring ret;\n\n \
  \  cformat = (*env)->GetStringUTFChars(env, format, NULL);\n   fmt = find_format(cformat);\n\
  \   if (fmt == NULL)\n      ret = format;\n   else\n   {  \n      char* cret;\n\
  \      int width = atoi(fmt);\n      if (width == 0) width = DBL_DIG + 10;\n   \
  \   cret = (char*) malloc(strlen(cformat) + width);\n      sprintf(cret, cformat,\
  \ x);\n      ret = (*env)->NewStringUTF(env, cret);\n      free(cret);\n   }\n \
  \  (*env)->ReleaseStringUTFChars(env, format, cformat);\n   return ret;\n}\n```\n\
  \n在这个函数中，我们选择保持错误处理的简单。如果打印浮点数的格式代码不是 `%w.pc` 形式（其中 `c` 是 `e`、`E`、`f`、`g` 或 `G`\
  \ 之一），我们就不对数字进行格式化。稍后我们将展示如何让原生方法抛出异常。\n\n## 13.4. 访问字段\n\n到目前为止的所有原生方法都是带有数字和字符串参数的静态方法。现在我们考虑操作对象的原生方法。作为一项练习，我们将重新实现\
  \ 第 4 章 中引入的 `Employee` 类的原生方法。再次，这通常不是你想要做的事情，但它确实说明了在需要时如何从原生方法访问字段。\n\n### 13.4.1.\
  \ 访问实例字段\n\n为了查看如何从原生方法访问实例字段，我们将重新实现 `raiseSalary` 方法。以下是 Java 代码：\n\n```\npublic\
  \ void raiseSalary(double byPercent)\n{\n   salary *= 1 + byPercent / 100;\n}\n\
  ```\n\n让我们将其重写为原生方法。与之前的原生方法示例不同，此方法不再一个静态方法。运行 `javac -h` 会得到以下原型：\n\n```\nJNIEXPORT\
  \ void JNICALL Java_Employee_raiseSalary(JNIEnv *, jobject, jdouble);\n```\n\n注意第二个参数。它不再是\
  \ `jclass` 类型，而是 `jobject` 类型。事实上，它等同于 `this` 引用。静态方法获取类的引用，而非静态方法获取隐式参数 `this`\
  \ 对象的引用。\n\n现在我们访问隐式参数的 `salary` 字段。在 Java 1.0 的“原始” Java 到 C 绑定中，这是很容易的——程序员可以直接访问实例字段。然而，直接访问要求所有虚拟机都暴露其内部数据布局。出于此原因，JNI\
  \ 要求程序员通过调用特殊的 JNI 函数来获取和设置实例字段的值。\n\n在我们案例中，我们需要使用 `GetDoubleField` 和 `SetDoubleField`\
  \ 函数，因为 `salary` 的类型是 `double`。还有其他函数——`GetIntField/SetIntField`、`GetObjectField/SetObjectField`\
  \ 以及针对其他字段类型的函数。通用语法是：\n\n```\nx = (*env)->GetXxxField(env, this_obj, fieldID);\n\
  (*env)->SetXxxField(env, this_obj, fieldID, x);\n```\n\n在这里，`fieldID` 是特殊类型 `jfieldID`\
  \ 的值，用于标识结构中的字段。`Xxx` 代表字段类型（`Object`、`Boolean` 等）。为了获取 `fieldID`，你必须获取类的引用。`GetObjectClass`\
  \ 函数返回对象的类。例如：\n\n```\njclass = (*env)->GetObjectClass(env, obj);\n```\n\n`FindClass`\
  \ 函数允许你使用字符串指定类名（有趣的是，使用 `/` 而不是点分隔符）。\n\n```\njclass = (*env)->FindClass(env, \"\
  java/lang/String\");\n```\n\n使用 `GetFieldID` 函数来获取字段 ID。这里是获取 `salary` 字段的代码：\n\n\
  ```\njfieldID = (*env)->GetFieldID(env, jclass, \"salary\", \"D\");\n```\n\n`\"\
  D\"` 表示 `double` 类型。你将在下一节学习签名的完整规则。你可能认为访问实例字段是复杂的。Java 的设计者并不希望直接暴露实例字段，因此他们必须提供获取和设置值的方法。让我们把所有部分结合起来。以下代码重新实现了\
  \ `raiseSalary` 方法：\n\n```\nJNIEXPORT void JNICALL Java_Employee_raiseSalary(JNIEnv*\
  \ env, jobject this_obj, \n      jdouble byPercent)\n{\n   /* 获取类 */\n   jclass\
  \ cls = (*env)->GetObjectClass(env, this_obj);\n\n   /* 获取字段 ID */\n   jfieldID\
  \ fid = (*env)->GetFieldID(env, cls, \"salary\", \"D\");\n\n   /* 获取字段值 */\n   jdouble\
  \ salary = (*env)->GetDoubleField(env, this_obj, fid);\n\n   salary *= 1 + byPercent\
  \ / 100;\n\n   /* 设置字段值 */\n   (*env)->SetDoubleField(env, this_obj, fid, salary);\n\
  }\n```\n\n类引用在原生方法返回之前有效。你不能每次执行原生方法时都调用 `GetObjectClass`。如果这不可忍受，你可以通过调用 `NewGlobalRef`\
  \ 来锁定引用：\n\n```\nstatic jclass class_X = 0;\nstatic jfieldID id_a;\n. .\nif (class_X\
  \ == 0)\n{\n   jclass cx = (*env)->GetObjectClass(env, obj);\n   class_X = (*env)->NewGlobalRef(env,\
  \ cx);\n   id_a = (*env)->GetFieldID(env, class_X, \"salary\", \"D\");\n}\n```\n\
  \n现在你可以在后续调用中使用类引用和字段 ID。当你不再使用该类时，务必调用\n\n```\n(*env)->DeleteGlobalRef(env, class_X);\n\
  ```\n\nListing 13.11 显示了测试程序的 Java 代码。`Employee` 类在 Listing 13.12 中。Listing 13.13\
  \ 包含了原生 `raiseSalary` 方法的 C 代码。\n\n\n\n\n\n```java\n/**\n * @version 1.10 1999-11-13\n\
  \ * @author Cay Horstmann\n */\n\npublic class Employee\n{\n   private String name;\n\
  \   private double salary;\n\n   public native void raiseSalary(double byPercent);\n\
  \n   public Employee(String n, double s)\n   {\n      name = n;\n      salary =\
  \ s;\n   }\n\n   public void print()\n   {\n      System.out.println(name + \" \"\
  \ + salary);\n   }\n\n   static\n   {\n      System.loadLibrary(\"Employee\");\n\
  \   }\n}\n```\n\nListing 13.13 `employee/Employee.c`\n\n```c\n/**\n   @version 1.10\
  \ 1999-11-13\n   @author Cay Horstmann\n*/\n\n#include \"Employee.h\"\n\n#include\
  \ <stdio.h>\n\nJNIEXPORT void JNICALL Java_Employee_raiseSalary(\n      JNIEnv*\
  \ env, jobject this_obj, jdouble byPercent)\n{  \n   /* get the class */\n   jclass\
  \ class_Employee = (*env)->GetObjectClass(env, this_obj);\n\n   /* get the field\
  \ ID */\n   jfieldID id_salary = (*env)->GetFieldID(env, class_Employee, \"salary\"\
  , \"D\");\n\n   /* get the field value */\n   jdouble salary = (*env)->GetDoubleField(env,\
  \ this_obj, id_salary);\n\n   salary *= 1 + byPercent / 100;\n\n   /* set the field\
  \ value */\n   (*env)->SetDoubleField(env, this_obj, id_salary, salary);\n}\n```\n\
  \n### 13.4.2 访问静态字段\n\n访问静态字段与访问非静态字段类似。使用 `GetStaticFieldID` 和 `GetStaticXxxField`/`SetStaticXxxField`\
  \ 函数，这些函数的工作与其非静态对应的函数几乎完全相同，但有点不同：\n\n- 由于你没有对象，因此必须使用 `FindClass` 而不是 `GetObjectClass`\
  \ 来获取类引用。\n- 在访问字段时，你必须提供类而不是实例对象。\n\n例如，这里是你可以获取 `System.out` 引用的方法\n\n```c\n/*\
  \ get the class */\njclass class_System = (*env)->FindClass(env, \"java/lang/System\"\
  );\n\n/* get the field ID */\njfieldID id_out = (*env)->GetStaticFieldID(env, class_System,\
  \ \"out\",\n   \"Ljava/io/PrintStream;\");\n\n/* get the field value */\njobject\
  \ obj_out = (*env)->GetStaticObjectField(env, class_System, id_out);\n```\n\n####\
  \ 访问字段\n\n- `jfieldID GetFieldID(JNIEnv *env, jclass cl, const char name[], const\
  \ char fieldSignature[])`\n  返回类中字段的标识符。\n- `Xxx GetXxxField(JNIEnv *env, jobject\
  \ obj, jfieldID id)`\n  返回字段的值。字段类型 `Xxx` 是 `Object`、`Boolean`、`Byte`、`Char`、`Short`、`Int`、`Long`、`Float`\
  \ 或 `Double` 之一。\n- `void SetXxxField(JNIEnv *env, jobject obj, jfieldID id, Xxx\
  \ value)`\n  将字段设置为一个新值。字段类型 `Xxx` 是 `Object`、`Boolean`、`Byte`、`Char`、`Short`、`Int`、`Long`、`Float`\
  \ 或 `Double` 之一。\n- `jfieldID GetStaticFieldID(JNIEnv *env, jclass cl, const char\
  \ name[], const char fieldSignature[])`\n  返回类中静态字段的标识符。\n- `Xxx GetStaticXxxField(JNIEnv\
  \ *env, jclass cl, jfieldID id)`\n  返回静态字段的值。字段类型 `Xxx` 是 `Object`、`Boolean`、`Byte`、`Char`、`Short`、`Int`、`Long`、`Float`\
  \ 或 `Double` 之一。\n- `void SetStaticXxxField(JNIEnv *env, jclass cl, jfieldID id,\
  \ Xxx value)`\n  将静态字段设置为一个新值。字段类型 `Xxx` 是 `Object`、`Boolean`、`Byte`、`Char`、`Short`、`Int`、`Long`、`Float`\
  \ 或 `Double` 之一。\n\n## 13.5 签名编码\n\n为了访问实例字段并调用 Java 编程语言定义的方法，你需要学习数据类型名称和方法签名的“混淆”（mangling）规则。（方法签名描述了方法的参数和返回类型）。以下是编码方案：\n\
  \n| 签名 | 类型 |\n| :--- | :--- |\n| `B` | `byte` |\n| `C` | `char` |\n| `D` | `double`\
  \ |\n| `F` | `float` |\n| `I` | `int` |\n| `J` | `long` |\n| `Lclassname;` | 类类型\
  \ |\n| `S` | `short` |\n| `V` | `void` |\n| `Z` | `boolean` |\n\n要描述数组类型，使用 `[`。例如，一个字符串数组是\n\
  \n```\n[Ljava/lang/String;\n```\n\n一个 `float[][]` 是\n\n```\n[[F\n```\n\n一个 `float[][]`\
  \ 被混淆为\n\n```\n[[F\n```\n\n对于方法，在括号内列出参数，然后是返回类型。例如，接收两个整数并返回整数的方法\n\n```\n(II)I\n\
  ```\n\n`sprint` 方法\n\n```\n(java/String)V\n```\n\n没有任何理由强制程序员使用这种签名方案。原生调用机制的设计者可以很容易地以\
  \ Java 语言风格读取签名，并将其编码为他们喜欢的表示。你可以使用 `javap` 配合 `-s` 参数从类文件生成签名。例如，运行\n\n```\nCompiled\
  \ from \"Employee.java\"\npublic class Employee extends java.Object{\nprivate String\
  \ name;\n  Signature: Ljava/String;\nprivate double salary;\n  Signature: D\npublic\
  \ Employee(String, double);\n  Signature: (LD)V\npublic native void raiseSalary(double);\n\
  \  Signature: (D)V\npublic void print();\n  Signature: ()V\n}\n```\n\n## 13.6 调用方法\n\
  \n当然，Java 函数可以调用 C 函数——这就是原生方法的作用。我们可以过来吗？为什么要这样做？通常原生方法需要向它的对象请求服务。我将首先向你展示如何处理实例方法，然后是静态方法。\n\
  \n#### 13.6.1 实例方法\n\n作为从原生代码调用 Java 方法的示例，让我们增强 `Printf` 类并添加一个类似于 C 函数 `fprintf`\
  \ 的方法。也就是说，它应该能够在任意 `PrintWriter` 对象上打印字符串。这里是该方法在 Java 中的定义：\n\n```java\nclass\
  \ Printf {\n   public native static void fprint(PrintWriter out, String s, double\
  \ x);\n}\n```\n\n我们将首先将要打印的字符串组合成 `String` 对象 `str`，正如已实现的 `sprint` 方法那样。然后，从实现原生方法的\
  \ C 函数中，调用 `PrintWriter` 类的 `print` 方法。\n\n你可以通过使用以下调用从 C 中调用任何 Java 方法\n\n```c\n\
  (*env)->CallXxxMethod(env, implicit argument, methodID, explicit arguments)\n```\n\
  \n将 `Xxx` 替换为 `Void`、`Int`、`Object` 等，取决于方法的返回类型。正如访问对象的字段需要 `fieldID` 一样，调用方法需要方法\
  \ ID。要获取方法 ID，调用 JNI 函数 `GetMethodID` 并提供类、方法名和方法签名。\n\n\n\n\n\n在我们的示例中，我们想要获取 `PrintWriter`\
  \ 类中 `print` 方法的 ID。`PrintWriter` 类有多个名为 `print` 的重载方法。因此，你还必须提供一个字符串，描述你想要使用的特定函数的参数和返回值。例如，我们想要使用\
  \ `void print(java.lang.String)`。正如前一节所述，我们现在必须将该签名“混淆”（mangle）为字符串 `\"(Ljava/lang/String;)V\"\
  `。\n\n以下是执行该方法调用的完整代码：\n\n```c\n/* 获取隐含参数的类 */\nclass_PrintWriter = (*env)->GetObjectClass(env,\
  \ out);\n\n/* 获取方法 ID */\nid_print = (*env)->GetMethodID(env, class_PrintWriter,\
  \ \"print\", \"(Ljava/lang/String;)V\");\n\n/* 调用方法 */\n(*env)->CallVoidMethod(env,\
  \ out, id_print, str);\n```\n\nListing 13.14 显示了用于测试程序的 Java 代码。`Printf3` 类位于 Listing\
  \ 13.15 中。Listing 13.16 包含了原生 `fprint` 方法的 C 代码。\n\n数值型方法 ID 和字段 ID 在概念上类似于反射 API\
  \ 中的 `Method` 和 `Field` 对象。你可以通过以下函数在它们之间转换：\n\n```c\njobject ToReflectedMethod(JNIEnv*\
  \ env, jclass class, jmethodID methodID);\n   // 返回 Method 对象\nmethodID FromReflectedMethod(JNIEnv*\
  \ env, jobject method);\njobject ToReflectedField(JNIEnv* env, jclass class, jfieldID\
  \ fieldID);\n   // 返回 Field 对象\nfieldID FromReflectedField(JNIEnv* env, jobject\
  \ field);\n```\n\n### 13.6.2 静态方法\n\n从原生方法调用静态方法与调用实例方法相似。两点不同在于：\n\n*    使用 `GetStaticMethodID`\
  \ 和 `CallStaticXxxMethod` 函数\n*   调用方法时提供类对象，而不是隐含参数对象\n\n作为此点的示例，让我们从原生方法调用静态方法\n\
  \n```java\nSystem.getProperty(\"java.class.path\")\n```\n\n该调用的返回值是一个提供当前类路径的字符串。\n\
  \n首先，我们必须找到要使用的类。由于我们没有现成的 `System` 类对象，因此我们使用 `FindClass` 而不是 `GetObjectClass`。\n\
  \n```c\njclass class_System = (*env)->FindClass(env, \"java/lang/System\");\n```\n\
  \n接下来，我们需要静态方法 `getProperty` 的 ID。该方法的编码签名是：\n\n```\n\"(Ljava/lang/String;)Ljava/lang/String;\"\
  \n```\n\n因为参数和返回值都是字符串。因此，我们按照如下所示获取方法 ID：\n\n```c\njmethodID id_getProperty = (*env)->GetStaticMethodID(env,\
  \ class_System, \"getProperty\",\n   \"(Ljava/lang/String;)Ljava/lang/String;\"\
  );\n```\n\n最后，我们可以进行调用。注意类对象是被传递给 `CallStaticObjectMethod` 函数的。\n\n```c\njobject\
  \ obj_ret = (*env)->CallStaticObjectMethod(env, class_System, id_getProperty,\n\
  \   (*env)->NewStringUTF(env, \"java.class.path\"));\n```\n\n该方法的返回值类型为 `jobject`。如果我们想将其作为字符串处理，必须将其强制转换为\
  \ `jstring`：\n\n```c\njstring str_ret = (jstring) obj_ret;\n```\n\n在 C 语言中，`jstring`\
  \ 和 `jclass` 以及稍后引入的数组类型在类型上都等同于 `jobject`。因此，上述示例中的强制转换在严格必要的。但在 C++ 中，这些类型被定义为指向“哑类”的指针，这些类具有正确的继承层次。例如，在\
  \ C++ 中将 `jstring` 赋值给 `jobject` 不需要转换是合，但从 `jobject` 赋值给 `jstring` 则需要强制转换。\n\n\
  ### 13.6.3 构造函数\n\n原生方法可以通过调用构造函数创建新的 Java 对象。通过调用 `NewObject` 函数来执行构造函数。\n\n```c\n\
  jobject obj_new = (*env)->NewObject(env, class, methodID, construction arguments);\n\
  ```\n\n你可以通过 `GetMethodID` 函数获取此调用所需的方法 ID，只需将方法名指定为 `\"<init>\"` 并提供构造函数的编码签名（返回类型为\
  \ `void`）。例如，这里是原生方法如何创建一个 `FileOutputStream` 对象的：\n\n```c\nconst char[] fileName\
  \ = \". . .\";\njstring str_fileName = (*env)->NewStringUTF(env, fileName);\njclass\
  \ class_FileOutputStream = (*env)->FindClass(env, \"java/io/FileOutputStream\");\n\
  jmethodID id_FileOutputStream\n   = (*env)->GetMethodID(env, class_FileOutputStream,\
  \ \"<init>\", \"(Ljava/lang/String;)V\");\njobject obj_stream\n   = (*env)->NewObject(env,\
  \ class_FileOutputStream, id_FileOutputStream, str_fileName);\n```\n\n注意，构造函数的签名有一个类型为\
  \ `java.lang.String` 的参数，且返回类型为 `void`。\n\n### 13.6.4 替代调用\n\nJNI 函数的几种变体可以从原生代码调用\
  \ Java 方法。它们不像我们讨论过的那么重要，但有时很有用。\n\n`CallNonvirtualXxxMethod` 函数接收一个隐含参数、一个方法 ID、一个类对象（必须是隐含参数的超类）以及显式参数。该函数调用指定类中的方法版本，跳过了正常的动态分发。\n\
  \n所有调用函数都有带有“A”和“V”后缀的版本，它们分别通过数组或 `va_list`（如 C 头文件 `stdarg.h` 中定义）来接收显式参数。\n\n\
  \n\n\n\n```c\n/**\n   @version 1.10 1997-07-01\n   @author Cay Horstmann\n*/\n\n\
  #include \"Printf3.h\"\n#include <string.h>\n#include <stdlib.h>\n#include <float.h>\n\
  \n/**\n   @param format 一个包含 printf 格式说明符的字符串\n   (例如 \"%8.2f\"）。子字符串 \"%%\" 将跳过。\n\
  \   @return 指向格式说明符的指针（跳过 '%'），\n   如果不存在唯一的格式说明符，则返回 NULL\n*/\nchar* find_format(const\
  \ char format[])\n{  \n   char* p;\n   char* q;\n\n   p = strchr(format, '%');\n\
  \   while (p != NULL && *(p + 1) == '%') /* 跳过 %% */\n      p = strchr(p + 2, '%');\n\
  \   if (p == NULL) return NULL;\n   /* 现在检查 % 是否是唯一的 */\n   p++;\n   q = strchr(p,\
  \ '%');\n   while (q != NULL && *(q + 1) == '%') /* 跳过 %% */\n      q = strchr(q\
  \ + 2, '%');\n   if (q != NULL) return NULL; /* % 不是唯一的 */\n   q = p + strspn(p,\
  \ \" -0+#\"); /* 跳过标志 */\n   q += strspn(q, \"0123456789\"); /* 跳过字段宽度 */\n   if\
  \ (*q == '.') { q++; q += strspn(q, \"0123456789\"); }\n      /* 跳过精度 */\n   if\
  \ (strchr(\"eEfFgG\", *q) == NULL) return NULL;\n      /* 不是浮点数格式 */\n   return\
  \ p;\n}\n\nJNIEXPORT void JNICALL Java_Printf3_fprint(JNIEnv* env, jclass cl, \n\
  \      jobject out, jstring format, jdouble x)\n{  \n   const char* cformat;\n \
  \  char* fmt;\n   jstring str;\n   jclass class_PrintWriter;\n   jmethodID id_print;\n\
  \n   cformat = (*env)->GetStringUTFChars(env, format, NULL);\n   fmt = find_format(cformat);\n\
  \   if (fmt == NULL)\n      str = format;\n   else\n   {  \n      char* cstr;\n\
  \      int width = atoi(fmt);\n      if (width == 0) width = DBL_DIG + 10;\n   \
  \   cstr = (char*) malloc(strlen(cformat) + width);\n      sprintf(cstr, cformat,\
  \ x);\n      str = (*env)->NewStringUTF(env, cstr);\n      free(cstr);\n   }\n \
  \  (*env)->ReleaseStringUTFChars(env, format, cformat);\n\n   /* 现在调用 out.print(str)\
  \ */\n\n   /* 获取类 */\n   class_PrintWriter = (*env)->GetObjectClass(env, out);\n\
  \n   /* 获取方法 ID */\n   id_print = (*env)->GetMethodID(env, class_PrintWriter, \"\
  print\", \"(Ljava/lang/String;)V\");\n\n   /* 调用该方法 */\n   (*env)->CallVoidMethod(env,\
  \ out, id_print, str);\n}\n```\n\n## 执行 Java 方法\n\n* `jmethodID GetMethodID(JNIEnv\
  \ *env, jclass cl, const char name[], const char methodSignature[])`\n\n  返回类中某个方法的标识符。\n\
  \n* `Xxx CallXxxMethod(JNIEnv *env, jobject obj, jmethodID id, args)`\n\n* `Xxx\
  \ CallXxxMethodA(JNIEnv *env, jobject obj, jmethodID id, jvalue args[])`\n\n* `Xxx\
  \ CallXxxMethodV(JNIEnv *env, jobject obj, jmethodID id, va_list args)`\n\n  调用一个方法。返回类型\
  \ `Xxx` 是 `Object`、`Boolean`、`Byte`、`Char`、`Short`、`Int`、`Long`、`Float` 或 `Double`\
  \ 。第一个函数具有可变参数——只需在方法 ID 之后追加方法参数。第二个函数在 `jvalue` 数组中接收方法参数，其中 `jvalue` 是定义的联合体：\n\
  \n    ```\n    typedef union jvalue\n    {\n       jboolean z;\n       jbyte b;\n\
  \       jchar c;\n       jshort s;\n       jint i;\n       jlong j;\n       jfloat\
  \ f;\n       jdouble d;\n       jobject l;\n    } jvalue;\n    ```\n\n  第三个函数在 C\
  \ 头文件 `stdarg.h` 中定义的 `va_list` 中接收方法参数。\n\n* `Xxx CallNonvirtualXxxMethod(JNIEnv\
  \ *env, jobject obj, jclass cl, jmethodID id, args)`\n\n* `Xxx CallNonvirtualXxxMethodA(JNIEnv\
  \ *env, jobject obj, jclass cl, jmethodID id, jvalue args[])`\n\n* `Xxx CallNonvirtualXxxMethodV(JNIEnv\
  \ *env, jobject obj, jclass cl, jmethodID id, va_list args)`\n\n  调用一个方法，绕过动态分发。返回类型\
  \ `Xxx` 是 `Object`、`Boolean`、`Byte`、`Char`、`Short`、`Int`、`Long`、`Float` 或 `Double`\
  \ 。第一个函数具有可变参数。第二个函数在 `jvalue` 数组中接收方法参数。第三个函数在 `va_list` 中接收方法参数。\n\n* `jmethodID\
  \ GetMethodID(JNIEnv *env, jclass cl, const char name[], const char methodSignature[])`\n\
  \n  返回类中某个方法的标识符。\n\n* `Xxx CallXxxMethod(JNIEnv *env, jobject obj, jmethodID id,\
  \ args)`\n\n* `Xxx CallXxxMethodA(JNIEnv *env, jobject obj, jmethodID id, jvalue\
  \ args[])`\n\n* `Xxx CallXxxMethodV(JNIEnv *env, jobject obj, jmethodID id, va_list\
  \ args)`\n\n  调用一个方法，绕过动态分发。返回类型 `Xxx` 是 `Object`、`Boolean`、`Byte`、`Char`、`Short`、`Int`、`Long`、`Float`\
  \ 或 `Double` 。第一个函数具有可变参数。第二个函数在 `jvalue` 数组中接收方法参数。第三个函数在 `va_list` 中接收方法参数。\n\n\
  ## 13.7 访问数组元素\n\n在 C 中，所有数组类型都有对应的 C 类型，如表 13.3 所示。`jarray` 表示通用数组。\n\n表 13.3：数组类型与\
  \ C 类型的对应关系\n\n| Java 类型 | C 类型 | Java 类型 | C 类型 |\n| :--- | :--- | :--- | :---\
  \ |\n| `boolean[]` | `jbooleanArray` | `long[]` | `jlongArray` |\n| `byte[]` | `jbyteArray`\
  \ | `float[]` | `jfloatArray` |\n| `char[]` | `jcharArray` | `double[]` | `jdoubleArray`\
  \ |\n| `int[]` | `intArray` | `Object[]` | `jobjectArray` |\n| `short[]` | `jshortArray`\
  \ | | |\n\n`GetArrayLength` 函数返回数组的长度。\n\n```c\njarray array = ...;\njsize length\
  \ = (*env)->GetArrayLength(env, array);\n```\n\n访问元素取决于数组存储的是对象还是原始值。访问对象数组使用 `GetObjectArrayElement`\
  \ 和 `SetObjectArrayElement` 方法。\n\n```c\njobjectArray array = ...;\nint i, j;\n\
  jobject x = (*env)->GetObjectArrayElement(env, array, i);\n(*env)->SetObjectArrayElement(env,\
  \ array, j, x);\n```\n\n虽然这种方法简单，但显然效率低下；你希望直接访问数组元素，特别是在进行向量和矩阵计算时。\n\n`GetXxxArrayElements`\
  \ 函数返回数组起始元素的 C 指针。与字符串一样，你必须调用相应的 `ReleaseXxxArrayElements` 函数告诉虚拟机你不再需要该指针。这里，类型\
  \ `Xxx` 必须是原始类型——即不是 `Object`。\n\n```c\nintArray array = ...;\njint* elements =\
  \ (*env)->GetIntElements(env, array);\n// 使用 elements\n(*env)->ReleaseIntElements(env,\
  \ array, elements, 0);\n```\n\n通过向 `GetXxxArrayElements` 方法传递 `jboolean` 变量的指针，可以发现数组是否为副本。如果是副本，该变量将填充为\
  \ `JNI_TRUE`。\n\n\n\n\n\n这是一个示例，演示如何将 `double` 类型数组中的所有元素乘以一个常数。我们获取一个指向 Java 数组的\
  \ C 指针 `a`，然后通过 `a[i]` 访问单个元素。\n\n```\njdoubleArray array_a = . . .;\ndouble scaleFactor\
  \ = . . .;\ndouble* a = (*env)->GetDoubleArrayElements(env, array_a, NULL);\nfor\
  \ (i = 0; i < (*env)->GetArrayLength(env, array_a); i++)\n   a[i] = a[i] * scaleFactor;\n\
  (*env)->ReleaseDoubleArrayElements(env, array_a, a, 0);\n```\n\n虚拟机是否真的复制数组取决于它如何分配数组以及如何进行垃圾回收。某些“复制型”垃圾回收器会定期移动对象并更新对象引用。这种策略与将数组“固定”（pinning）到特定位置是不兼容的，因为垃圾器无法更新原生代码中的指针值。\n\
  \n在 Oracle JVM 的实现中，`boolean` 数组被表示为 32 位紧凑数组。`GetBooleanArrayElements` 方法将它们复制到解包的\
  \ `jboolean` 值数组中。\n\n若只需访问大数组的少数元素，请使用 `GetXxxArrayRegion` 和 `SetXxxArrayRegion`\
  \ 方法，这些方法可以将元素范围从 Java 数组复制到 C 数组并返回。\n\n你可以使用 `NewXxxArray` 函数在原生方法中创建新的 Java 数组。要创建一个对象数组，请指定长度、数组元素的类型以及所有条目的初始元素（通常为\
  \ `NULL`）。示例如下所示：\n\n```\njclass class_Employee = (*env)->FindClass(env, \"Employee\"\
  );\njobjectArray array_e = (*env)->NewObjectArray(env, 100, class_Employee, NULL);\n\
  ```\n\n基本类型数组更为简单：只需提供数组的长度即可。\n\n```\njdoubleArray array_d = (*env)->NewDoubleArray(env,\
  \ 100);\n```\n\n随后数组将被填充为零。\n\n以下方法用于处理“直接缓冲区”（direct buffers）：\n\n```\njobject\
  \ NewDirectByteBuffer(JNIEnv* env, void* address, jlong capacity)\nvoid* GetDirectBufferAddress(JNIEnv*\
  \ env, jobject buf)\njlong GetDirectBufferCapacity(JNIEnv* env, jobject buf)\n```\n\
  \n直接缓冲区用于 `java.nio` 包，以支持更高效的输入/输出操作，并尽可能地减少原生数组与 Java 数组之间的数据拷贝。\n\n### 操作 Java\
  \ 数组\n\n*   `jsize GetArrayLength(JNIEnv *env, jarray array)`\n    返回数组中的元素个数。\n\
  \n*   `jobject GetObjectArrayElement(JNIEnv *env, jobjectArray array, jsize index)`\n\
  \    返回数组元素的值。\n\n*   `void SetObjectArrayElement(JNIEnv *env, jobjectArray array,\
  \ jsize index, jobject value)`\n    将数组元素设置为新值。\n\n*   `Xxx* GetXxxArrayElements(JNIEnv\
  \ *env, jarray array, jboolean* isCopy)`\n    产生一个指向 Java 数组元素的 C 指针。字段类型 `Xxx`\
  \ 是 `Boolean`、`Byte`、`Char`、`Short`、`Int`、`Long`、`Float` 或 `Double` 之一。当不再需要该指针时，必须将其传递给\
  \ `ReleaseXxxArrayElements`。`isCopy` 可能是 `NULL` 或指向一个 `jboolean`，如果进行了拷贝，则该值填充为\
  \ `JNI_TRUE`，否则填充为 `JNI_FALSE`。\n\n*   `void ReleaseXxxArrayElements(JNIEnv *env,\
  \ jarray array, Xxx elems[], jint mode)`\n    通知虚拟机通过 `GetXxxArrayElements` 获取的指针不再需要。`mode`\
  \ 是 `0`（在更新数组元素后释放 `elems` 缓冲区）、`JNI_COMMIT`（在更新数组元素后不释放 `elems` 缓冲区）或 `JNI_ABORT`（在不更新数组元素的情况下释放\
  \ `elems` 缓冲区）之一。\n\n*   `void GetXxxArrayRegion(JNIEnv *env, jarray array, jint\
  \ start, jint length, Xxx elems[])`\n    将元素从 Java 数组复制到 C 数组。字段类型 `Xxx` 是 `Boolean`、`Byte`、`Char`、`Short`、`Int`、`Long`、`Float`\
  \ 或 `Double` 之一。\n\n*   `void SetXxxArrayRegion(JNIEnv *env, jarray array, jint\
  \ start, jint length, Xxx elems[])`\n    将元素从 C 数组复制到 Java 数组。字段类型 `Xxx` 是 `Boolean`、`Byte`、`Char`、`Short`、`Int`、`Long`、`Float`\
  \ 或 `Double` 之一。\n\n## 13.8 处理错误\n\n原生方法对 Java 程序存在重大的安全风险。C 运行时系统对数组越界错误、通过错误的指针进行间接访问等没有保护。原生方法的程序员处理所有错误情况以维护\
  \ Java 平台的完整性，这一点尤为重要。特别是当你的原生方法诊断出它无法处理的问题时，应该向 Java 虚拟机报告此问题。\n\n通常情况下，在这种情况下你会抛出一个异常。然而，C\
  \ 没有异常。相反，你必须抛出一个异常。\n\n要抛出 Java 异常，请使用 `Throw` 或使用 `NewObject` 创建对象。例如：\n\n```\n\
  jclass class_EOFException = (*env)->FindClass(env, \"java/io/EOFException\");\n\
  methodID id_EOFException = (*env)->GetMethodID(class_EOFException, \"<init>\", \"\
  ()V\");\njobject obj_exc = (*env)->NewObject(env, class_EOFException, id_EOFException);\n\
  (*env)->Throw(env, obj_exc);\n```\n\n`Throw` 和 `ThrowNew` 只是提交异常；它们不会中断原生方法的控制流。只有当方法返回时，虚拟机才会抛出异常。因此，每次对\
  \ `Throw` 和 `ThrowNew` 的调用都应该紧跟一个 `return` 语句。\n\n如果你在 C++ 中实现原生方法，无法在 C++ 代码中抛出\
  \ Java 异常。在 C++ 绑定中，可以实现 C++ 与 Java 异常之间的转换；但目前尚未这样做。使用 `Throw` 或 `ThrowNew` 来抛出\
  \ Java 异常，并你的原生方法抛出 C++ 异常。通常，原生代码不需要担心 Java 异常。然而，当原生方法调用 Java 方法时，该方法可能会抛出异常。此外，许多\
  \ JNI 函数也会抛出异常。例如，`SetObjectArrayElement` 在索引越界时抛出 `ArrayIndexOutOfBoundsException`，如果存储对象的类不是数组元素类的子类，则抛出\
  \ `ArrayStoreException`。在这些情况下，原生方法应该调用 `ExceptionOccurred` 方法来确定是否已抛出异常。调用\n\n\
  ```\njthrowable obj_exc = (*env)->ExceptionOccurred(env);\n```\n\n如果没有挂起的异常，则返回\
  \ `NULL`，否则返回当前异常对象的引用。如果你只想检查是否抛出了异常，而不获取异常对象的引用，请使用\n\n```\njboolean occurred\
  \ = (*env)->ExceptionCheck(env);\n```\n\n通常，当发生异常时，原生方法应直接返回，以便虚拟机将其传播到 Java 代码。然而，原生方法*可以*分析异常对象以确定它是否可以处理该异常。如果可以，则必须调用函数\n\
  \n```\n(*env)->ExceptionClear(env);\n```\n\n以关闭异常。\n\n\n\n\n最后，为了演示如何在从原生方法调用 Java\
  \ 方法时检查异常，我们逐个字符地将字符串发送到流中，并在每次调用后调用 `ExceptionOccurred`。代码列表 13.17 显示了原生方法的代码，代码列表\
  \ 13.18 显示了包含该原生方法的类定义。注意，当调用 `PrintWriter.print` 发生异常时，原生方法并没有立即终止——它首先释放了 `cstr`\
  \ 缓冲区。当原生方法返回时，虚拟机再次抛出异常。代码列表 13.19 中的测试程序演示了当格式化字符串无效时，原生方法是如何抛出异常的。\n\n### 代码列表\
  \ 13.17 printf4/Printf4.c\n\n```c\n/**\n   @version 1.10 1997-07-01\n   @author\
  \ Cay Horstmann\n*/\n\n#include \"Printf4.h\"\n#include <string.h>\n#include <stdlib.h>\n\
  #include <float.h>\n\n/**\n   @param format 一个包含 printf 格式说明符的字符串\n   (例如 \"%8.2f\"\
  ）。子字符串 \"%%\" 被跳过。\n   @return 指向格式说明符的指针（跳过 '%'），\n   如果没有唯一的格式说明符，则返回 NULL。\n\
  \ */\nchar* find_format(const char format[])\n{  \n   char* p;\n   char* q;\n\n\
  \   p = strchr(format, '%');\n   while (p != NULL && *(p + 1) == '%') /* 跳过 %% */\n\
  \      p = strchr(p + 2, '%');\n   if (p == NULL) return NULL;\n   /* 现在检查 % 是否唯一\
  \ */\n   p++;\n   q = strchr(p, '%');\n   while (q != NULL && *(q + 1) == '%') /*\
  \ 跳过 %% */\n      q = strchr(q + 2, '%');\n   if (q != NULL) return NULL; /* % 不唯一\
  \ */\n   q = p + strspn(p, \" -0+#\"); /* 跳过标志 */\n   q += strspn(q, \"0123456789\"\
  ); /* 跳过字段宽度 */\n   if (*q == '.') { q++; q += strspn(q, \"0123456789\"); }\n  \
  \    /* 跳过精度 */\n   if (strchr(\"eEfFgG\", *q) == NULL) return NULL;\n      /* 不是浮点数格式\
  \ */\n   return p;\n}\n\nJNIEXPORT void JNICALL Java_Printf4_fprint(JNIEnv* env,\
  \ jclass cl, \n   jobject out, jstring format, jdouble x)\n{  \n   const char* cformat;\n\
  \   char* fmt;\n   jclass class_PrintWriter;\n   jmethodID id_print;\n   char* cstr;\n\
  \   int width;\n   int i;\n\n   if (format == NULL)\n   {  \n      (*env)->ThrowNew(env,\n\
  \         (*env)->FindClass(env,\n         \"java/lang/NullPointerException\"),\n\
  \         \"Printf4.fprint: format is null\");\n      return;\n   }\n\n   cformat\
  \ = (*env)->GetStringUTFChars(env, format, NULL);\n   fmt = find_format(cformat);\n\
  \n   if (fmt == NULL)\n   {  \n      (*env)->ThrowNew(env,\n         (*env)->FindClass(env,\n\
  \         \"java/lang/IllegalArgumentException\"),\n         \"Printf4.fprint: format\
  \ is invalid\");\n      return;\n   }\n\n   width = atoi(fmt);\n   if (width ==\
  \ 0) width = DBL_DIG + 10;\n   cstr = (char*)malloc(strlen(cformat) + width);\n\n\
  \   if (cstr == NULL)\n   {  \n      (*env)->ThrowNew(env,\n         (*env)->FindClass(env,\
  \ \"java/lang/OutOfMemoryError\"),\n         \"Printf4.fprint: malloc failed\");\n\
  \      return;\n   }\n\n   sprintf(cstr, cformat, x);\n\n   (*env)->ReleaseStringUTFChars(env,\
