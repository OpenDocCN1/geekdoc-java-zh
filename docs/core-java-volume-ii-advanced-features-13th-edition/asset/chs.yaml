  \ 菜单项中的图标\n\n菜单项与按钮非常相似。事实上，`JMenuItem` 类扩展了 `AbstractButton` 类。就像按钮一样，菜单可以只包含文本标签、仅包含图标，或者两者兼有。你可以通过\
  \ `JMenuItem(String, Icon)` 或 `JMenuItem(Icon)` 构造函数指定图标，也可以使用 `JMenuItem` 类继承自\
  \ `AbstractButton` 类的 `setIcon` 方法来设置。这是一个示例：\n\n```\nvar cutItem = new JMenuItem(\"\
  Cut\", new ImageIcon(\"cut.gif\"));\n```\n\n在 图 11.17 中，你可以看到几个菜单项旁边有图标。默认情况下，菜单项文本放置在图标右侧。如果你希望将文本放置在左侧，请调用\
  \ `JMenuItem` 类继承自 `AbstractButton` 类的 `setHorizontalTextPosition` 方法。例如，调用：\n\n\
  ```\ncutItem.setHorizontalTextPosition(SwingConstants.LEFT);\n```\n\n会将菜单项文本移动到图标左侧。\n\
  \n你也可以为动作添加图标：\n\n```\ncutAction.putValue(Action.SMALL_ICON, new ImageIcon(\"cut.gif\"\
  ));\n```\n\n每当你从动作构造菜单项时，`Action.NAME` 就会变成文本。或者，你可以通过构造函数设置图标：\n\n```\ncutItem\
  \ = new JMenuItem(\"Cut\", new ImageIcon(\"cut.gif\"))\n   {\n      public void\
  \ actionPerformed(ActionEvent event)\n      {\n         // 动作代码写在这里\n         .\
  \ . .\n      }\n```\n\n`javax.swing.JMenuItem` 1.2\n\n*   `JMenuItem(String label)`\n\
  \    使用给定标签构造动作。\n\n`javax.swing.AbstractButton` 1.2\n\n*   `void setTextPosition(int\
  \ pos)`\n    设置文本相对于图标的水平位置。`pos` 为 `SwingConstants.RIGHT` 或 `SwingConstants.LEFT`。\n\
