  \ - width / 2, centerY - height / 2, width, height);\n```\n\n构造直线时，你提供起点和终点，可以是\
  \ `Point2D` 对象也可以是数字对：\n\n```\nvar line = new Line2D.Double(start, end);\n```\n\n\
  或者\n\n```\nvar line = new Line2D.Double(startX, startY, endX, endY);\n```\n\n代码清单\
  \ 10.3 中的程序绘制了一个矩形、包含在矩形内的椭圆、矩形的对角线，以及一个与矩形中心相同的圆。\n\n\n\n你可以用颜色填充闭合形状（如矩形或椭圆）。只需调用\
  \ `fill` 而不是 `draw`：\n\n```\nRectangle2D rect = . . .;\ng2.setPaint(Color.RED);\n\
  g2.fill(rect); // 用红色填充 rect\n```\n\n若要绘制多种颜色，可以选择其中一种颜色，进行绘制或填充，然后选择另一种颜色，再次进行绘制或填充。\n\
  \n`fill` 方法在右侧和下方会比少绘制一个像素。例如，如果你绘制一个 `new Rectangle2D.Double(0, 0, 10, 20)`，则图形包含了\
  \ `x` = 10 和 `y` = 20 的像素。如果填充同一个矩形，这些像素将不会被绘制。\n\n使用 `Color` 类定义颜色。`java.awt.Color`\
  \ 类提供了以下 13 种标准颜色的预定义常量：\n\n```\nBLACK, BLUE, CYAN, DARK_GRAY, GRAY, GREEN, LIGHT_GRAY,\
  \ \nMAGENTA, ORANGE, PINK, RED, WHITE, YELLOW\n```\n\n你可以通过根据红、绿、蓝分量创建 `Color` 对象来指定自定义颜色，每个分量的值在\
  \ `0` 到 255 之间：\n\n```\ng2.setPaint(new Color(0, 128, 128)); // 一种暗的蓝绿色\ng2.drawString(\"\
  Welcome!\", 75, 125);\n```\n\n除了实色，你还可以使用实现 `Paint` 接口的类实例调用 `setPaint`。这可以使用渐变和纹理进行绘制。\n\
  \n要设置组件的背景颜色，请使用 `Component` 类（`JComponent` 的父类）的 `setBackground` 方法。\n\n```\nvar\
  \ component = new MyComponent();\ncomponent.setBackground(Color.PINK);\n```\n\n\
  还有一个 `setForeground` 方法。它指定了用于在组件上绘制的默认颜色。\n\n`java.awt.Color` 1.0\n\n*   `Color(int\
  \ r, int g, int b)`\n    创建一个具有给定的 `0` 到 `255` 之间的红、绿、蓝分量的颜色对象。\n\n`java.awt.Graphics2D`\
  \ 1.2\n\n*   `Paint getPaint()`\n*   `void setPaint(Paint p)`\n    获取或设置此图形上下文的绘制属性。`Color`\
  \ 类实现了 `Paint` 接口。因此，你可以使用此方法将绘制属性设置为实色。\n*   `void fill(Shape s)`\n    用当前的绘制画料填充形状。\n\
