  \ getAverage()`\n*   (`int`|`long`|`double`) `getMax()`\n*   (`int`|`long`|`double`)\
  \ `getMin()`\n    返回收集到的元素的计数、和、平均值、最大值和最小值。\n\n## 1.14. 并行流\n\n流使得并行化批量操作变得简单。该过程大部分是自动的，但你需要遵循几条规则。首先，你必须有一个并行流。你可以通过\
  \ `Collection.parallelStream()` 方法从任何集合获取并行流：\n\n```\nStream<String> parallelWords\
  \ = words.parallelStream();\n```\n\n此外，`parallel` 方法可以将任何顺序流转换为并行流。\n\n```\nStream<String>\
  \ parallelWords = Stream.of(wordArray).parallel();\n```\n\n只要在执行终端操作时流处于并行模式，所有的中间流操作都将被并行化。\n\
  \n当流操作以并行方式运行时，其意图是返回与串行执行时相同的结果。重要的是，这些操作必须是*无状态的*并且可以按任意顺序执行。\n\n这是一个你不能做的示例。假设你想统计短单词的数量：\n\
  \n```\nvar shortWords = new int[12];\nwords.parallelStream().forEach(s -> { if (s.length()\
  \ < 12) shortWords[s.length()]++; });\n// 错误！\nSystem.out.println(Arrays.toString(shortWords));\n\
  ```\n\n这种代码非常糟糕。正如你在第 10 章 中看到的，`forEach` 在多线程中并发运行。这是一种经典的*竞态条件*。如果你多次运行此程序，可能会得到不同的计数结果。\n\
  \n你有责任确保传递给并行流的函数是安全的。为了做到这一点，最好的方法是远离可变状态。正如在 1.9 节 中讨论过的，如果你使用与顺序无关的下游收集器，就可以安全地并行化。在此示例中，按长度对字符串分组并计数：\n\
  \n```\nMap<Integer, Long> shortWordCounts\n   = words.parallelStream()\n      .filter(s\
  \ -> s.length() < 12)\n      .collect(groupingBy(String::length,\n         counting()));\n\
  ```\n\n默认情况下，从有序集合（数组和列表）、范围、生成器和迭代器或通过 `Stream.sorted` 产生的流是*有序的*。结果按照原始元素的顺序累积，并且是可预测的。如果你运行两次相同的操作，将获得完全相同的结果。\n\
  \n排序并不排除高效并行化。例如，在计算 `stream.map(fun)` 时，流可以被分成 `n` 个段，每个段并发处理。然后按顺序重新组合结果。\n\n\
  当放弃排序要求时，某些操作可以更有效地并行化。通过调用 `Stream.unordered` 方法，你表示对顺序不感兴趣。一个可以从中受益的操作是 `Stream.distinct`。在有序流上，`distinct`\
  \ 保留所有相等元素的第一个。这碍了并行化——处理某个段的线程在之前的段处理之前不知道丢弃哪些元素。如果允许保留*任何*唯一元素，所有段都可以并发处理（使用共享集合来跟踪重复）。\n\
  \n你还可以通过放弃排序来加速 `limit` 方法。如果你只需要流中的任意 `n` 个元素而不关心是哪些，请调用：\n\n```\nStream<String>\
  \ sample = words.parallelStream().unordered().limit(n);\n```\n\n\n\n\n```java\n\
  Map<Integer, Long> wordCounts \n   = words.parallelStream()\n      .collect(\n \
  \        groupingByConcurrent(\n            String::length,\n            counting()));\n\
  ```\n\n不要为了加速操作就将所有的流都转换为并行流（parallel streams）。请记住以下这些问题：\n\n- 并行化带有巨大的开销，只有在处理非常大的数据集时才划算。\n\
  - 只有当底层数据源可以被有效拆分成多个部分时，并行化流才有获益。\n- 并行流所使用的线程池可能会被文件 I/O 或网络访问等阻塞操作导致“饥饿”（starved）。\n\
  \n并行流在处理巨大的内存数据集合和计算密集型处理时效果最好。\n\n如果你处理一个大文件的行，并行化流可能会提高性能。`Files.lines` 方法使用内存映射文件来使拆分变得高效。（如果你简单地一次读取一行，那么你就必须在读取文件的后半部分之前先读取前半部分，这样并行化将无法工作。）\n\
  \n如果你需要在并行流中使用随机数，请从 `RandomGenerator.SplittableGenerator.of` 工厂方法获取生成器。\n\n默认情况下，并行流使用\
  \ `ForkJoinPool.commonPool` 返回的全局 fork-join 池。如果你的操作是非阻塞的且你没有与其他任务共享该池，那是没有问题。有一个替换不同\
  \ fork-join 池的技巧：在该池的线程中执行并行流操作：\n\n```java\nForkJoinPool customPool = . . .;\n\
  result = customPool.submit(() ->\n   stream.parallel().map(. . .).collect(. . .)).get();\n\
  ```\n\n或者，异步地执行：\n\n```java\nCompletableFuture.supplyAsync(() ->\n      stream.parallel().map(.\
  \ . .).collect(. . .), customPool)\n   .thenAccept(result -> . . .);\n```\n\n这仅适用于\
  \ fork-join 池，而不适用于任意执行器（executors）。\n\nListing 1.8 中的示例程序演示了如何使用并行流。\n\nListing\
  \ 1.8 parallel/ParallelStreams.java\n\n```java\npackage parallel;\n\nimport static\
  \ java.util.stream.Collectors.*;\n\nimport java.io.*;\nimport java.nio.file.*;\n\
  import java.util.*;\nimport java.util.stream.*;\n\n/**\n * @version 1.02 2019-08-28\n\
  \ * @author Cay Horstmann\n */\npublic class ParallelStreams\n{\n   public static\
  \ void main(String[] args) throws IOException\n   {\n      String contents = Files.readString(Path.of(\"\
  ../gutenberg/alice30.txt\"));\n      List<String> wordList = List.of(contents.split(\"\
  \\\\PL+\"));\n\n      // 下面是很糟糕的代码\n      var shortWords = new int[10];\n      wordList.parallelStream().forEach(s\
  \ -> \n         {\n            if (s.length() < 10) shortWords[s.length()]++;\n\
  \         });\n      System.out.println(Arrays.toString(shortWords));\n\n      //\
  \ 再试一次——结果可能不同（而且错误的）\n      Arrays.fill(shortWords, 0);\n      wordList.parallelStream().forEach(s\
  \ -> \n         {\n            if (s.length() < 10) shortWords[s.length()]++;\n\
  \         });\n      System.out.println(Arrays.toString(shortWords));\n\n      //\
  \ 补救：分组并计数\n      Map<Integer, Long> shortWordCounts = wordList.parallelStream()\n\
  \         .filter(s -> s.length() < 10)\n         .collect(groupingBy(String::length,\
  \ counting()));\n\n      System.out.println(shortWordCounts);\n\n      // 下游顺序不是确定的\n\
  \      Map<Integer, List<String>> result = wordList.parallelStream().collect(\n\
  \         Collectors.groupingByConcurrent(String::length));\n\n      System.out.println(result.get(14));\n\
  \n      result = wordList.parallelStream().collect(\n         Collectors.groupingByConcurrent(String::length));\n\
  \n      System.out.println(result.get(14));\n\n      Map<Integer, Long> wordCounts\
  \ = wordList.parallelStream().collect(\n         groupingByConcurrent(String::length,\
  \ counting()));\n\n      System.out.println(wordCounts);\n   }\n}\n```\n\n`java.util.stream.BaseStream<T,S\
  \ extends BaseStream<T,S>>` 8\n\n- `S parallel()`\n    产生一个与此流具有相同元素的并行流。\n- `S\
  \ unordered()`\n    产生一个与此流具有相同元素的无序流。\n\n`java.util.Collection<E>` 1.2\n\n- `Stream<E>\
  \ parallelStream()` 8\n    产生一个包含此集合中元素的并行流。\n\n在本章中，你已经学习了如何使用流库。下一章将涵盖另一个重要主题：输入输出处理。\n\
  \n# 第 2 章 ▪ 输入与输出\n\n在本章中，我们将介绍用于输入和输出的 Java 应用程序编程接口（APIs）。你将学习如何访问文件和目录，以及如何以二进制和文本格式读写数据。本章还展示了对象序列化机制，它可以让你像存储文本或数值数据一样容易地存储对象。我们以讨论正则表达式来结束本章，尽管它们实际上与输入输出没有关系。我们找不到更好的处理该主题的地方，显然\
  \ Java 也是如此。\n\n## 2.1. 输入/输出\n\n在 Java API 中，一个可以读取字节序列的对象被称为 `input stream`（输入流）。一个可以写入字节序列的对象被称为\
  \ `output stream`（输出流）。这些字节的源和目的地可以是文件，但也可以是网络连接甚至内存。抽象类 `InputStream` 和 `OutputStream`\
  \ 是输入/输出（I/O）类的基础。\n\n对于处理存储的 Unicode 信息（回 Unicode 使用多个字节表示一个字符），有一套独立的类，继承自抽象的\
  \ `Reader` 和 `Writer` 类。这些类的读写操作基于双字节 `char` 值（即 UTF-16 单元），而不是 `byte` 值。\n\n###\
  \ 2.1.1 读写字节\n\n`InputStream` 类有一个抽象方法\n\n该方法读取一个字节并返回读取的字节，如果遇到输入源的末尾则返回 -1。具体输入流类的设计者重写此方法以提供有用的功能。例如，在\
  \ `FileInputStream` 类中，此方法从文件中读取一个字节。`System.in` 是 `InputStream` 子类的定义的对象，允许你从“标准输入”（即控制台或重定向的文件）读取信息。\n\
  \n`InputStream` 有一个非常实用的方法可以读取流的所有字节：\n\n```byte[] bytes = in.readAllBytes();\n\
  ```\n\n还有读取指定数量字节的方法——参见 API 注释。这些方法调用抽象的 `read` 方法，因此子类只需要重写一个方法。\n\n同样，`OutputStream`\
  \ 类定义了抽象方法\n\n```abstract void write(int b)````\n\n它将一个字节写入输出位置。\n\n如果你有一个字节数组，可以一次性写入它们：\n\
  \n```byte[] values = . . .;\nout.write(values);\n```\n\n`transferTo` 方法将所有字节从输入流传输到输出流：\n\
  \n```in.transferTo(out);\n```\n\n所有的 `read` 和 `write` 方法都会*阻塞*（block），直到字节被实际读取或写入。这意味着如果输入流无法立即访问（通常是因为网络连接繁忙），当前线程就会阻塞。这使得其他线程在等待输入流再次可用时有机会执行有用的工作。\n\
  \n\n\n\n\n`available()` 方法允许你检查当前可读取的字节数。这意味着像下面的代码片段不太可能会阻塞：\n\n```java\nint bytesAvailable\
  \ = in.available();\nif (bytesAvailable > 0)\n{\n   var data = new byte[bytesAvailable];\n\
  \   in.read(data);\n}\n```\n\n当你完成对输入/输出流的读取或写入后，调用 `close()` 方法将其关闭。此调用会释放供应有限的操作系统资源。如果应用程序打开了过多的输入输出流而不关闭它们，系统资源可能会耗尽。关闭输出流还会\
  \ `flushes`（刷新）用于输出流的缓冲区：任何临时存放在缓冲区中以便作为较大的数据包发送的字节都会被发送。特别是，如果你不关闭文件，最后一个字节数据包可能永远无法被发送。你也可以使用\
  \ `flush()` 方法手动刷新输出内容。\n\n即使输入/输出流类提供了处理原始 `read` 和 `write` 函数的具体方法，应用程序程序员也极少少使用它们。你感兴趣的数据可能包含数字、字符串和对象，而不是原始字节。\n\
  \n与其处理字节，不如你可以使用构建在基础 `InputStream` 和 `OutputStream` 类之上的许多输入输出类之一。\n\n### `java.io.InputStream`\
  \ 1.0\n\n*   `abstract int read()`\n    读取一个字节的数据并返回所读取的字节；在输入流结束时返回 `-1`。\n*  \
  \ `int read(byte[] b)`\n    读取到字节数组中，并返回实际读取的字节数，或在输入流结束时返回 `-1`；此方法最多读取 `b.length`\
  \ 个字节。\n*   `int read(byte[] b, int off, int len)`\n*   `int readNBytes(byte[] b,\
  \ int off, int len)` 9\n    读取最多 `len` 个字节，如果可以在不阻塞的情况下可用（`read`），否则阻塞直到所有值都已读取（`readNBytes`）。值被置于\
  \ `b` 中，从 `off` 开始。返回实际读取的字节数。\n*   `byte[] readAllBytes()` 9\n    产生一个从此流可以读取的所有字节的数组。\n\
  *   `long transferTo(OutputStream out)` 9\n    将此输入流的所有字节传输到给定的输出流，返回传输的字节数。两个流都不会被关闭。\n\
  *   `long skip(long n)`\n    尝试在输入流中跳过 `n` 个字节，返回实际跳过的字节数（由于某种原因，可能小于 `n`）。\n* \
  \  `long skipNBytes(long n)` 12\n    在输入流中跳过 `n` 个字节，返回实际跳过的字节数（如果遇到输入流的末尾，则可能小于\
  \ `n`）。\n*   `int available()`\n    返回可用字节数，且不阻塞（记住，阻塞意味着当前线程失去了它的机会）。\n*   `void\
  \ close()`\n    关闭输入流。\n*   `void mark(int readlimit)`\n    在输入流的当前位置放置标记（并非所有流都支持此功能）。如果从输入流中读取了超过\
  \ `readlimit` 的字节，则允许流忘记该标记。\n*   `void reset()`\n    返回上一个标记。随后的 `read` 调用将重新读取这些字节。如果没有当前标记，则输入流将不重置。\n\
  *   `boolean markSupported()`\n    如果输入流支持标记，则返回 `true`。\n*   `static InputStream\
  \ nullInputStream()` 11\n    返回一个没有字节的输入流。\n\n### `java.io.OutputStream` 1.0\n\n\
  *   `abstract void write(int n)`\n    写入一个字节的数据。\n*   `void write(byte[] b)`\n*\
  \   `void write(byte[] b, int off, int len)`\n    写入数组 `b` 中所有的字节，或从 `off` 开始的 `len`\
  \ 个字节。\n*   `void close()`\n    刷新并关闭输出流。\n*   `void flush()`\n    刷新输出流——即将任何缓冲区中的数据发送到其目的地。\n\
  *   `static OutputStream nullOutputStream()` 11\n    返回一个丢弃所有字节的输出流。\n\n### 2.1.2.\
  \ 完整的流动物园\n\n与 C 语言通过单一类型 `FILE*` 就能运行良好不同，Java 有一整套超过 60 个 (!) 类和接口，用于输入和输出。\n\n\
  ![Figure](img/fig01-01.jpg)图 2.1: 输入和输出流层级!![Figure](img/fig01-02.jpg)图 2.2: Reader\
  \ 和 Writer 层级\n\n让我们根据使用方式对输入/输出动物园中的动物进行分类。处理字节和字符的类有独立的层级结构。正如你所看到的，`InputStream`\
  \ 和 `OutputStream` 类允许你读取和写入单个字节以及字节数组。这些类形成了 #ch01fig01 所示层级的基础。为了读写字符串和数字，你需要更强大的子类。例如，`DataInputStream`\
  \ 和 `DataOutputStream` 允许你以二进制格式读写所有的 Java 原始类型。最后，还有用于特殊任务的输入输出流；例如，`ZipInputStream`\
  \ 和 `ZipOutputStream` 允许你以 ZIP 格式读写。\n\n另一方面，对于文本`InputStream` 和 `OutputStream`\
  \ 是不够的。为了读写文本，你需要 `Reader` 和 `Writer` 类。`InputStream` 和 `OutputStream` 类允许你读取和写入单个字节以及字节数组。这些类形成了\
  \ #ch01fig01 所示层级的基础。\n\n为了读写字符串和数字，你需要更强大的子类。例如，`DataInputStream` 和 `DataOutputStream`\
  \ 允许你以二进制格式读写所有的 Java 原始类型。最后，还有用于特殊任务的输入输出流；例如，`ZipInputStream` 和 `ZipOutputStream`\
  \ 允许你以 ZIP 格式读写。\n\n\n\n\n\n* `char charAt(int index)`\n  返回指定索引处的代码单元。\n\n* `int\
  \ length()`\n  返回此序列中代码单元的数量。\n\n* `CharSequence subSequence(int startIndex, int\
  \ endIndex)`\n  返回一个 `CharSequence`，它由从索引 `startIndex` 到 `endIndex - 1` 存储的代码单元组成。\n\
  \n* `String toString()`\n  返回由此序列的代码单元构成的字符串。\n\n### 2.1.3 组合输入/输出流\n\n`FileInputStream`\
  \ 和 `FileOutputStream` 提供了附加到文件的输入和输出流。你需要将文件名或文件的完整路径传递给构造函数。例如：\n\n```\nvar fin\
  \ = new FileInputStream(\"employee.dat\");\n```\n\n查找名为 `employee.dat` 的文件。相对路径从工作目录开始。你可以通过调用\
  \ `System.getProperty(\"user.dir\")` 获取此目录，它在虚拟机启动时设置。如果你从命令行启动程序，工作目录就是终端目录。在 IDE\
  \ 中，你可以设置工作目录。\n\n由于 Java 字符串中的反斜杠是转义字符，对于 Windows 风格的路径名，确保使用双反斜杠（例如 `C:\\\\Windows\\\
  \\ini`）。在 Windows 中，你也可以使用正斜线（`C:/Windows/ini`），因为大多数 Windows 文件处理调用会将正斜线解释为文件分隔符。然而，对于可移植的程序，应使用运行程序平台的文件分隔符\
  \ `java.io.File.separator`。\n\n与抽象的 `InputStream` 和 `OutputStream` 类一样，这些类只支持字节级别的读写。也就是说，我们可以从\
  \ `fin` 对象读取字节和字节数组：\n\n```\nbyte b = (byte) fin.read();\n```\n\n正如你在下一节中看到的，如果我们只有一个\
  \ `DataInputStream`，就可以读取数值类型：\n\n```\nDataInputStream din = . . .;\ndouble x =\
  \ din.readDouble();\n```\n\n但 `FileInputStream` 没有读取数值类型的方法，`DataInputStream` 没有从文件获取数据的方法。Java\
  \ 使用了一种巧妙的机制来分离两种职责。某些输入流（例如由 `URL` 类的 `openStream` 方法返回的流）可以从文件和其他位置检索字节。其他输入流（如\
  \ `DataInputStream`）可以将字节组装更有用的数据类型。Java 程序员必须组合两者。例如，为了能够从文件读取数字，首先创建一个 `FileInputStream`，然后将其传递给\
  \ `DataInputStream` 的构造函数：\n\n```\nvar fin = new FileInputStream(\"employee.dat\"\
  );\nvar din = new DataInputStream(fin);\ndouble x = din.readDouble();\n```\n\n如果你再次查看\
  \ #ch01fig1，你可以看到 `FilterInputStream` 和 `FilterOutputStream` 类。这些类的子类用于为处理字节的输入/输出流添加功能。\n\
  \n你可以通过嵌套过滤器添加多个功能。例如，默认情况下输入流是不缓冲的。也就是说，每次调用 `read` 都会请求操作系统提供字节。更高效的方法是请求数据块并存储在缓冲区中。如果你想要对文件使用缓冲以及数据输入方法，请使用以下怪异的构造函数序列：\n\
  \n```\nvar din = new DataInputStream(\n   new BufferedInputStream(\n      new FileInputStream(\"\
  employee.dat\")));\n```\n\n注意我们将 `DataInputStream` 放在构造函数链的**最后**，因为我们想要使用 `DataInputStream`\
  \ 方法，并且我们希望**它们**使用缓冲的 `read` 方法。\n\n有时当你将输入流链在一起时，需要跟踪中间输入流。例如，在读取输入时，你通常需要查看下一个字节以确定是否是你预期的值。Java\
  \ 为此目的提供了 `PushbackInputStream`：\n\n```\nvar pbin = new PushbackInputStream(\n \
  \  new BufferedInputStream(\n      new FileInputStream(\"employee.dat\")));\n```\n\
  \n现在你可以推测性地读取下一个字节：\n\n```\nint b = pbin.read();\n```\n\n如果它不是你想要的，就将其抛回：\n\n```\n\
  if (b != '<') pbin.unread(b);\n```\n\n`unread` 方法实际上并没有改变流读取字节的源。未读取的字节存储在缓冲区中，并由下次\
  \ `read` 操作返回。默认情况下，缓冲区长度为 1，但你可以在 `PushbackInputStream` 构造函数中指定更长的缓冲区。\n\n读取和未读取是适用于回溯输入流的**唯一**方法。如果你想向前查看并读取数字，那么你需要一个回溯输入流和一个数据输入流引用。\n\
  \n```\nvar pbin = new PushbackInputStream(\n   new BufferedInputStream(\n      new\
  \ FileInputStream(\"employee.dat\")));\nvar din = new DataInputStream(pbin);\n```\n\
  \n当然，在其他编程语言的输入/输出库中，缓冲和向前查看等细节会自动被处理——因此在 Java 中诉诸组合流过滤器会有点麻烦。然而，混合和匹配过滤器类以构建有用的输入/输出流的能力确实赋予了你巨大的灵活性。例如，你可以使用以下输入流序列从压缩的\
  \ ZIP 文件中读取数字（参见 #ch01fig4）：\n\n```\nvar zin = new ZipInputStream(new FileInputStream(\"\
  employee.zip\"));\nvar din = new DataInputStream(zin);\n```\n\n![Figure](img/fig01-04.jpg)图\
  \ 2.4：过滤后的输入流序列\n\n### 2.1.4 文本输入与输出\n\n\n\n\n在保存数据时，你可以在二进制格式和文本格式之间选择。例如，如果整数\
  \ `1234` 以二进制格式保存，它被写入为字节序列 `00 00 04 D2`（十六进制表示法）。在文本格式中，它被保存为字符串 `\"1234\"`。虽然二进制\
  \ I/O 速度快且高效，但人类并不易阅读。我们首先讨论文本 I/O，并在第 2.2 节 中介绍二进制 I/O。\n\n在保存文本字符串时，你需要考虑`字符编码`。在\
  \ Java 内部使用的 UTF-16 编码中，字符串 `\"José\"` 被编码为 `00 4A 00 6F 00 73 00 E9`（十六进制）。然而，许多程序期望文本文件使用不同的编码。在互联网上最常用的\
  \ UTF-8 编码中，该字符串将被写为 `4A 6F 73 C3 A9`，前三个字母没有零字节，而 é 字符占用两个字节。\n\n`OutputStreamWriter`\
  \ 类将 Unicode 代码单元的输出流转换为字节流。相反，`InputStreamReader` 类将包含字节（指定某种字符编码中的字符）的输入流转换为产生\
  \ Unicode 代码单元的读取器。\n\n从 Java 18 开始，这些类默认使用 UTF-8 编码。在 Java 18 之前，或者如果你需要支持某种陈旧的编码，请在构造函数中指定编码，例如：\n\
  \n```\nvar in = new InputStreamReader(new FileInputStream(\"data.txt\"), StandardCharsets.UTF_8);\n\
  ```\n\n有关字符编码的更多信息，请参阅第 2.1.8 节。\n\n`Reader` 和 `Writer` 类只有读写单个字符的基本方法。与流一样，你使用子类来处理字符串和数字。\n\
  \n### 2.1.5 如何读取文本输入\n\n处理任意文本最简单的方法是 `Scanner` 类，我们在第一卷中广泛使用了它。你可以从任何输入流构造一个 `Scanner`。\n\
  \n或者，你可以像这样将短文本文件读取到字符串中：\n\n```\nString content = Files.readString(path, charset);\n\
  ```\n\n但如果你想将文件作为行的序列，请调用：\n\n```\nList<String> lines = Files.readAllLines(path,\
  \ charset);\n```\n\n如果文件很大，请作为 `Stream<String>` 惰性处理处理行：\n\n```\ntry (Stream<String>\
  \ lines = Files.lines(path, charset)) \n{\n   . . .\n}\n```\n\n如果流在获取行时发生 `IOException`，该异常将被封装成\
  \ `UncheckedIOException` 并从流操作抛出。这种处理手段是必要的，因为流操作没有声明会抛出任何检查异常。\n\n要从任意输入流读取行，请使用：\n\
  \n```\nInputStream inputStream = . . .;\ntry (var reader = new BufferedReader(new\
  \ InputStreamReader(inputStream, charset)))\n{\n   Stream<String> lines = reader.lines();\n\
  \   . . .\n}\n```\n\n你还可以使用扫描器来读取`标记`——即由分隔符分隔的字符串。默认分隔符是空白字符。你可以将分隔符更改为任何正则表达式。例如，这里是如何配置扫描器使其使用任何非\
  \ Unicode 字母作为分隔符的。\n\n```\nScanner in = . . .;\nin.useDelimiter(\"\\\\PL+\");\n\
  ```\n\n该扫描器现在接受仅由 Unicode 字母组成的标记。\n\n调用 `next` 方法产生下一个标记：\n\n```\nwhile (in.hasNext())\n\
  {\n   String word = in.next();\n   . . .\n}\n```\n\n或者，你可以这样获取所有标记的流：\n\n```\nStream<String>\
  \ words = in.tokens();\n```\n\n在遗留代码中，你可能会发现通过反复调用 `BufferedReader` 的 `readLine`\
  \ 方法来读取行的代码。如今，没有正理由这样做。\n\n### 2.1.6 如何写入文本输出\n\n对于文本输出，请使用 `PrintWriter`。该类拥有以文本格式打印字符串和数字的方法。为了打印到文件，请从文件名构造\
  \ `PrintWriter`：\n\n```\nvar out = new PrintWriter(\"employee.txt\");\n```\n\n奇怪的是，你不能从\
  \ `Path` 构造 `PrintWriter`。\n\n在 Java 18 之前，请确保将字符编码作为第二个参数指定：\n\n```\nvar out =\
  \ new PrintWriter(\"employee.txt\", StandardCharsets.UTF_8);\n```\n\n否则，将使用平台编码，导致你的程序行为依赖于主机操作系统的配置。\n\
  \n要写入 `PrintWriter`，请使用与你在 `System.out` 中相同的 `print`、`println` 和 `printf` 方法。你可以使用这些方法打印数字（`int`、`short`、`long`、`float`、`double`）、字符、`boolean`\
  \ 值、字符串和对象。\n\n例如，考虑这段代码：\n\n```\nString name = \"Harry Hacker\";\ndouble salary\
  \ = 75000;\nout.print(name);\nout.print(' ');\nout.println(salary);\n```\n\n这会将字符\n\
  \n```\nHarry Hacker 75000.0\n```\n\n写入写入器 `out`。随后字符被转换为字节并最终进入文件 `employee.txt`。\n\
  \n\n\n\n如果发生格式化或输出错误，返回 `true`。一旦输出流遇到错误，它就会被污染，所有对 `checkError` 的调用将返回 `true`。\n\
  \n### 2.1.7. 以文本格式保存对象\n\n在本节中，我们将讨论一个示例程序，该程序在文本文件中存储了 `Employee` 记录的数组。每个记录存储在单独的一行中。实例字段之间通过分隔符隔开。使用竖线（\
  \ `|` ）作为分隔符。（冒号（ `:` ）是另一个流行的选择。其中有趣的地方在于，每个人使用的分隔符都不一样。）自然地，我们暂不考虑如果我们保存的字符串中真的出现了\
  \ `|`，会发生什么的问题。\n\n这里是一组示例记录：\n\n```\nHarry Hacker|35500.0|1989-10-01\nCarl Cracker|75000.0|1987-12-15\n\
  Tony Tester|38000.0|1990-03-15\n```\n\n写入记录非常简单。由于我们是写入文本文件，因此我们使用 `PrintWriter`\
  \ 类。我们只需写入所有字段，后面跟着一个 `|`，或者对于最后一个字段写入一个换行符。这项工作在以下方法中完成：\n\n```\npublic static\
  \ void writeEmployee(PrintWriter out, Employee e)\n{\n   out.println(e.getName()\
  \ + \"|\" + e.getSalary() + \"|\" + e.getHireDay());\n}\n```\n\n读取记录时，我们读取一行并分离字段。我们使用\
  \ `Scanner` 读取每一行，然后使用 `String.split` 方法将行拆分成多个 `tokens`。\n\n```\npublic static\
  \ Employee readEmployee(Scanner in)\n{\n   String line = in.nextLine();\n   String[]\
  \ tokens = line.split(\"\\\\|\");\n   String name = tokens[0];\n   double salary\
  \ = Double.parseDouble(tokens[1]);\n   LocalDate hireDate = LocalDate.parse(tokens[2]);\n\
  \   int year = hireDate.getYear();\n   int month = hireDate.getMonthValue();\n \
  \  int day = hireDate.getDayOfMonth();\n   return new Employee(name, salary, year,\
  \ month, day);\n}\n```\n\n`split` 方法的参数是一个描述分隔符的正则表达式。我们将在本章末尾详细讨论正则表达式。恰好，竖线字符在正则表达式中具有特殊含义，因此它需要用\
  \ `\\` 字符进行转义。该字符需要用另一个 `\\` 转义，从而产生 `\\|` 表达式。完整的程序位于列表 2.1 中。静态方法 `writeData(Employee[]\
  \ e, PrintWriter out)` 写入数组长度，然后写入每个记录。静态方法 `readData(Scanner in)` 读取数组长度，然后读取每个记录。\n\
  \n等等，`staticData` 方法 `Employee[] readData(Scanner in)` 先读取数组长度，然后读取每个记录。事实证明这有点复杂：\n\
  \n```\nint n = in.nextInt();\nin.nextLine(); // 消耗换行符\nvar employees = new Employee[n];\n\
  for (int i = 0; i < n; i++)\n{\n   employees[i] = readEmployee(in);\n}\n```\n\n\
  对 `nextInt` 的调用读取了数组长度但没有读取结尾的换行符。我们必须消耗换行符，这样 `readEmployee` 方法在调用 `nextLine` 方法时才能获取下一行输入。列表\
  \ 2.1 `textFile/TextFileTest.java`\n\n```java\npackage textFile;\n\nimport java.io.*;\n\
  import java.time.*;\nimport java.util.*;\n\n/**\n * @version 1.16 2023-08-16\n *\
  \ @author Cay Horstmann\n */\npublic class TextFileTest\n{\n   public static void\
  \ main(String[] args) throws IOException\n   {\n      var staff = new Employee[3];\n\
  \n      staff[0] = new Employee(\"Carl Cracker\", 75000.0, 1987, 12, 15);\n    \
  \  staff[1] = new Employee(\"Harry Hacker\", 50000.0, 1989, 10, 1);\n      staff[2]\
  \ = new Employee(\"Tony Tester\", 40000.0, 1990, 3, 15);\n\n      // 将所有员工记录保存到\
  \ employee.dat 文件\n      try (var out = new PrintWriter(\"employee.dat\"))\n   \
  \   {\n         writeData(staff, out);\n      }\n\n      // 将所有记录检索到一个新数组\n    \
  \  try (var in = new Scanner(new FileInputStream(\"employee.dat\")))\n      {\n\
  \         Employee[] newStaff = readData(in);\n\n         // 打印新读取的员工记录\n      \
  \   for (Employee e : newStaff)\n            System.out.println(e);\n      }\n \
  \  }\n\n   /**\n    * 将数组中的所有员工写入打印器\n    * @param employees 员工数组\n    * @param\
  \ out       一个打印器\n    */\n   private static void writeData(Employee[] employees,\
  \ PrintWriter out) throws IOException\n   {\n      // 写入员工数量\n      out.println(employees.length);\n\
  \n      for (Employee e : employees)\n         writeEmployee(out, e);\n   }\n\n\
  \   /**\n    * 从扫描读取员工数组\n    * @param in 器\n    * @return 员工数组\n    */\n   private\
  \ static Employee[] readData(Scanner in)\n   {\n      // 读取数组长度\n      int n = in.nextInt();\n\
  \      in.nextLine(); // 消耗换行符\n\n      var employees = new Employee[n];\n     \
  \ for (int i = 0; i < n; i++)\n      {\n         employees[i] = readEmployee(in);\n\
  \      }\n      return employees;\n   }\n\n   /**\n    * 将员工数据写入打印器\n    * @param\
  \ out 打印器\n    * @param e 员工\n    */\n   private static void writeEmployee(PrintWriter\
  \ out, Employee e)\n   {\n      out.println(e.getName() + \"|\" + e.getSalary()\
  \ + \"|\" + e.getHireDay());\n   }\n\n   /**\n    * 从扫描器读取员工数据\n    * @param in\
  \ 扫描器\n    * @return 员工\n    */\n   public static Employee readEmployee(Scanner\
  \ in)\n   {\n      String line = in.nextLine();\n      String[] tokens = line.split(\"\
  \\\\|\");\n      String name = tokens[0];\n      double salary = Double.parseDouble(tokens[1]);\n\
  \      LocalDate hireDate = LocalDate.parse(tokens[2]);\n      int year = hireDate.getYear();\n\
  \      int month = hireDate.getMonthValue();\n      int day = hireDate.getDayOfMonth();\n\
  \      return new Employee(name, salary, year, month, day);\n   }\n}\n```\n\n###\
  \ 2.1.8. 编码\n\n每个 Unicode 都是 21 位的整数。最常见的编码是 `UTF-8`，它使用一到四个字节。\n\n表 2.1：UTF-8 编码\n\
  \n| 字符范围 | 编码 |\n| :--- | :--- |\n| `U+0000` 到 `U+007F` | `0xxxxxxx` (`UTF-8` 与\
  \ `ASCII` 兼容) |\n| `U+0080` 到 `U+07FF` | `110xxxxx 10xxxxxx` |\n| `U+0800` 到 `U+FFFF`\
  \ | `1110xxxx 10xxxxxx 10xxxxxx` |\n| `U+10000` 到 `U+10FFFF` | `11110xxx 10xxxxxx\
  \ 10xxxxxx 10xxxxxx` |\n\n表 2.2：UTF-16 编码\n\n| 字符范围 | 编码 |\n| :--- | :--- |\n| `U+0000`\
  \ 到 `U+FFFF` | `0xxxxxxxxx` (16 位) |\n| `U+10000` 到 `U+10FFFF` | `surrogate pair`\
  \ (32 位) |\n\n\n\n\n另一种常见的编码是 UTF-16，它将每个 Unicode 代码点转换为一个或两个 16 位的值（参见表 2.2）。这是\
  \ Java 字符串中使用的编码。实际上，UTF-16 有两种形式，称为“大端”（big-endian）和“小端”（little-endian）。\n\n在大端格式中，高位字节在前：`0x21`\
  \ 随后是 `0x22`。在小端格式中，则相反：`0x22` 随后是 `0x21`。为了指示使用的是哪一种，文件可以以字节序标记 `\\uFEFF` 开始。\n\
  \n某些程序（包括记事本）会在 UTF-8 编码文件的开头添加一个字节序标记。显然，这是没有必要的，因为 UTF-8 中没有字节序问题。但 Unicode 标准允许这样做，甚至建议这样做，这是一个很不错的主意。遗憾的是，Java\
  \ 并没有这样做，在读取 UTF-8 编码文件时，针对此问题的报告被关闭为“不修复”。最好的办法是去掉输入中的任何领先 `\\uFEFF`。\n\n除了 UTF-8\
  \ 编码外，还有部分编码适用于给定的用户字符范围。例如，ISO 8859-1 是单字节编码，包含了西欧语言使用的重音字符。Shift-JIS 是日语字符的变长编码。这些编码中许多仍在在使用。\n\
  \n没有可靠的方法从字节流中自动检测字符编码。有时编码会在其他地方指定。例如，当读取网页时，检查 `Content-Type` 头部。\n\n`StandardCharsets`\
  \ 类具有 `Charset` 类型的静态变量，用于 Java 虚拟机支持的字符编码：\n\n```\nStandardCharsets.UTF_8\nStandardCharsets.UTF_16\n\
  StandardCharsets.UTF_16BE\nStandardCharsets.UTF_16LE\nStandardCharsets.ISO_8859_1\n\
  StandardCharsets.US_ASCII\n```\n\n要获取另一种编码的 `Charset`，使用静态方法 `forName`：\n\n```\n\
  Charset shiftJIS = Charset.forName(\"Shift-JIS\");\n```\n\n静态方法 `Charset.availableCharsets`\
  \ 返回所有可用的 `Charset` 实例，这是一个从规范名称到 `Charset` 对象的映射。例如，你可以将字节数组转换为字符串：\n\n```java\n\
  var str = new String(bytes, StandardCharsets.ISO_8859_1);\n```\n\n许多方法允许你用字符串而不是\
  \ `Charset` 指定字符编码。对于标准的字符编码，使用 `StandardCharsets` 常量，以便在编译时就能发现拼写错误。\n\n在 Java\
  \ 17 之前，调用 `Charset.forName(\"default\")` 会产生 `StandardCharsets.US_ASCII`。这在长期以来都是一个糟糕的主意。现在，该调用会导致\
  \ `UnsupportedCharsetException`。\n\n如果你没有指定字符编码，并且操作需要在字节和字符串之间转换，它将选择一个默认值。对于 `java.nio.file`\
  \ 包中的许多方法，该默认值是 UTF-8。但其他方法在未指定字符编码时使用*默认字符集*，这些包括：\n\n- `java.io` reader 和 writer\
  \ 类的方法\n- `String` 类的 `String(byte[])` 构造函数和 `getBytes` 方法\n- `java.util` 包中的 `Scanner`\
  \ 和 `Formatter`\n- `java.net` 包中的 `URLEncoder` 和 `URLDecoder`\n\n从 Java 18 开始，默认字符集是\
  \ UTF-8。在 Java 18 之前，默认字符集是*原生编码*，由执行 Java 虚拟机的系统决定。在 Linux 和 Mac OS 上，通常是（但不总是）UTF-8。然而，在\
  \ Windows 上，原生编码大多数情况下是 Windows-1252 等旧编码。\n\n在 Java 18 之前，Oracle 的 Java 实现有一个 `file.encoding`\
  \ 系统属性来覆盖平台默认值。这不是一个官方支持的属性，但它仍然被广泛使用。\n\n从 Java 18 开始，该属性已经标准化。你可以在命令行上将 `file.encoding`\
  \ 属性设置为以下值：\n\n- `COMPAT`（从 Java 18 开始）：将默认字符集设置为原生编码，并将 `file.encoding` 系统属性设置为其名称。\n\
  - `UTF-8`：将默认字符集设置为 UTF-8。\n- 其他字符编码（如 `US-ASCII`）：对于某些未指定的旧字符集名称，它可能会将默认字符集设置为指定的。\n\
  \n`file.encoding` 属性必须在命令行上设置。通过 `System.setProperty` 设置不会更新默认字符集。\n\n实际使用的默认字符集由静态方法\
  \ `Charset.defaultCharset` 返回。从 Java 17 开始，系统属性 `native.encoding` 会产生原生编码的名称，无论是否被使用。\n\
  \n当你在 Windows 终端启动 Java 程序时，`System.out` 和 `System.err` 使用的编码源自终端，这可能与默认字符集不同。最好的办法是将终端码页改为\
  \ UTF-8，使用命令：\n\n```\nchcp 65001\n```\n\n或者，从 Java 18 开始，你可以在命令行上设置系统属性：\n\n```\n\
  java -Dfile.encoding=UTF-8\n```\n\n这些属性的命名可能令人困惑。`stdout` 和 `stderr` 是 `PrintStream`\
  \ 的实例，其 `print` 和 `println` 方法将字符转换为字节。要快速查看各种编码的设置，运行：\n\n```\njava -XshowSettings\n\
  ```\n\n查找以 `.encoding` 结尾的属性。最后，系统控制台可以用于读取字符串和密码，其编码与终端匹配。你可以通过 `System.console().charset()`\
  \ 获取它。\n\n`new Scanner(System.in)` 使用默认字符集，这可能与终端不同。如果这不是一个选项，构造扫描器：\n\n```java\n\
  Console console = System.console();\nif (console != null) {\n   var in = new Scanner(console.reader());\n\
  \   // . .\n}\n```\n\n你需要防止没有系统控制台的情况。这在开发环境中运行程序时会发生。\n\n### 2.1.9. 读取字符\n\n如果你读取具有\
  \ JSON 或 XML 等结构化的文件，你将使用由他人编写的解析器。这种解析器通常一次读取一个字符。\n\n在需要编写此类解析器的异常情况下，使用 `BufferedReader`\
  \ 来提高效率。持续调用其 `read` 方法，它返回一个 `char` 值或在输入结束时返回 -1。读取器将输入流的编码转换为 UTF-16。你需要处理 UTF-16\
  \ 编码：\n\n```java\nint ch = reader.read();\nif (ch != -1)\n{\n   int codePoint;\n\
  \   if (Character.isHighSurrogate((char) ch))\n   {\n      int ch2 = reader.read();\n\
  \      if (Character.isLowSurrogate((char) ch2))\n         codePoint = Character.toCodePoint(ch,\
  \ ch2);\n      else\n         throw new MalformedInputException(2);\n   }\n   else\n\
  \      codePoint = ch;\n}\n```\n\n`Character` 类包含许多方法，可以判断特定的代码点是否具有某种属性。例如：\n\n\
  ```\nCharacter.isLetter(codePoint)\n```\n\n\n\n如果 `codePoint` 是某种语言中的字母，则返回 `true`。这里是其他一些分类方法：\n\
  \n```\nisUpperCase\nisLowerCase\nisDigit\nisSpaceChar\nisEmoji\n```\n\n这些方法使用 Unicode\
  \ 标准规则。其他的则引用 Java 语言的规则：\n\n```\nisJavaIdentifierStart\nisJavaIdentifierPart\n\
  isWhitespace\n```\n\n在分析代码点之后，你通常需要将它们存储在字符串中，将其转换回 UTF-16。`StringBuilder` 类的 `appendCodePoint`\
  \ 方法可以将一个代码点转换为一个或两个 `char` 值，并附加到构建器中。\n\n## 2.2 读取和写入二进制数据\n\n文本格式便于测试和调试，因为它是人类可读的，但它的效率不如以二进制格式传输数据。在接下来的章节中，你将学习如何对二进制数据进行输入和输出。\n\
  \n### 2.2.1 `DataInput` 和 `DataOutput` 接口\n\n`DataOutput` 接口定义了以下方法，用于以二进制格式写入数字、字符、`boolean`\
  \ 值或字符串：\n\n```\nwriteChars          writeFloat\nwriteByte           writeDouble\n\
  writeInt            writeChar\nwriteShort          writeBoolean\nwriteLong     \
  \      writeUTF\n```\n\n例如，`writeInt` 无论数字位数多少，始终将整数写入 4 字节的二进制量，而 `writeDouble`\
  \ 始终将 `double` 写入 8 字节的二进制量。生成的输出不是人类可读的，但它为给定类型的每个值使用相同的空间，并且重新读取它比解析文本更快。\n\n\
  在内存中存储整数和浮点数有两种不同的方法，这取决于你使用的处理器。例如，假设你正在处理一个 4 字节的 `int`，例如十进制 1234，或十六进制的 4D2（1234\
  \ = 4 × 256 + 13 × 16 + 2）。该值可以以此方式存储：内存中四个字节中的第一个持有该值的最高有效字节（MSB）：`00 00 04 D2`。这就是所谓的大端字节（big-endian）。或者，我们可以从最低有效字节（LSB）开始：`D2\
  \ 04 00 00`。这理所当然地被称为小端字节（little-endian）。例如，SPARC 使用大端字节；Intel 处理器使用小端字节。这可能会导致问题。当从\
  \ C 或 C++ 文件保存文件时，数据是按照处理器存储的方式精确保存的。这使得将即使是最简单的数据文件移动到另一个平台都具有挑战性。在 Java 中，无论使用什么处理器，所有值都以大端方式写入。这使得\
  \ Java 数据文件具有平台无关性。\n\n`writeUTF` 方法使用修改后的 8 位 Unicode 转换格式写入字符串数据。它不是简单地使用标准的 UTF-8\
  \ 编码，而是先将 Unicode 代码单元序列表示为 UTF-16，然后使用 UTF-8 规则对结果进行编码。这种修改后的编码对于代码高于 `0xFFFF`\
  \ 的字符不同。它用于与在 Unicode 超过 16 位之前构建的虚拟机向后兼容。\n\n由于没有其他人使用这种 UTF-8 的修改版本，你应该只使用 `writeUTF`\
  \ 方法写入用于 Java 虚拟机的字符串——例如，在生成字节码的程序中。其他用途请使用 `writeChars` 方法。\n\n要读回数据，请使用 `DataInput`\
  \ 接口定义的以下方法：\n\n```\nreadInt            readDouble\nreadShort          readChar\n\
  readLong           readBoolean\nreadFloat          readUTF\n```\n\n`DataInputStream`\
  \ 类实现了 `DataInput` 接口。要从文件读取二进制数据，请将 `DataInputStream` 与字节源（如 `FileInputStream`）结合：\n\
  \n```\nvar in = new DataInputStream(new FileInputStream(\"employee.dat\"));\n```\n\
  \n同样，要写入二进制数据，使用实现 `DataOutput` 接口的 `DataOutputStream` 类：\n\n```\nvar out = new\
  \ DataOutputStream(new FileOutputStream(\"employee.dat\"));\n```\n\n### java.io.DataInput\
  \ 1.0\n\n* `boolean readBoolean()`\n* `byte readByte()`\n* `char readChar()`\n*\
  \ `double readDouble()`\n* `float readFloat()`\n* `int readInt()`\n* `long readLong()`\n\
  * `short readShort()`\n读取给定类型的值。\n* `void readFully(byte[] b)`\n将字节读入数组 `b`，阻塞直到读完所有字节。\n\
  * `void readFully(byte[] b, int off, int len)`\n从 `off` 开始将最多 `len` 个字节放入数组 `b`\
  \ 中，阻塞直到读完所有字节。\n* `String readUTF()`\n读取“修改 UTF-8”格式的字符字符串。\n* `int skipBytes(int\
  \ n)`\n跳过 `n` 个字节，阻塞直到跳过所有字节。\n\n### java.io.DataOutput 1.0\n\n* `void writeBoolean(boolean\
  \ b)`\n* `void writeByte(int b)`\n* `void writeChar(int c)`\n* `void writeDouble(double\
  \ d)`\n* `void writeFloat(float f)`\n* `void writeInt(int i)`\n* `void writeLong(long\
  \ l)`\n* `void writeShort(int s)`\n写入给定类型的值。\n* `void writeChars(String s)`\n写入字符。\n\
  * `void writeUTF(String s)`\n以“修改 UTF-8”格式写入字符串。\n\n### 2.2.2 随机访问文件\n\n`RandomAccessFile`\
  \ 类允许你从文件的任何位置读取或写入数据。它实现了 `DataInput` 和 `DataOutput`。要从随机访问文件中读写，请使用我们在上一节中讨论过的\
  \ `readInt/writeInt` 和 `readChar/writeChar` 等方法。\n\n让我们通过一个示例程序，该程序在随机访问文件中存储员工记录。每个记录具有相同的大小。这使得读取任意记录变得简单。假设你想将文件指针定位到第三条记录。只需将文件指针设置为适当的字节位置并开始读取即可。\n\
  \n```\nlong n = 3;\nin.seek((n - 1) * RECORD_SIZE);\nvar e = new Employee();\ne.readData(in);\n\
  ```\n\n如果你想修改记录并将其保存回相同的位置，记住将文件指针设回记录的开头：\n\n```\nin.seek((n - 1) * RECORD_SIZE);\n\
  e.writeData(out);\n```\n\n要确定文件的总字节数，请使用 `length` 方法。总记录数是长度除以每个记录的大小。\n\n```\n\
  long nbytes = in.length(); // 字节数\nint nrecords = (int) (nbytes / RECORD_SIZE);\n\
  ```\n\n整数和浮点值在二进制格式中具有固定大小，但对于字符串我们需要付出更多努力。我们提供了两个辅助方法来读写固定大小的字符串。\n\n`writeFixedString`\
  \ 从字符串开始写入指定数量的代码单元。如果代码单元太少，该方法将使用零值填充字符串。\n\n```java\npublic static void writeFixedString(String\
  \ s, int size, DataOutput out)\n      throws IOException\n{\n   for (int i = 0;\
  \ i < size; i++)\n   {\n      char ch = 0;\n      if (i < s.length()) ch = s.charAt(i);\n\
  \      out.writeChar(ch);\n   }\n}\n```\n\n\n\n\n`readFixedString` 方法从输入流中读取字符，直到消耗了\
  \ `size` 个代码单元，或者遇到一个值为 0 的字符。然后，它会跳过输入字段中剩余的零值。为了提高效率，该方法使用 `StringBuilder` 类来读取字符串。\n\
  \n```\npublic static String readFixedString(int size, DataInput in)\n      throws\
  \ IOException\n{\n   var b = new StringBuilder(size);\n   int i = 0;\n   var done\
  \ = false;\n   while (!done && i < size)\n   {\n      char ch = in.readChar();\n\
  \      i++;\n      if (ch == 0) done = true;\n      else b.append(ch);\n   }\n \
  \  in.skipBytes(2 * (size - i));\n   return b.toString();\n}\n```\n\n我们将 `writeFixedString`\
  \ 和 `readFixedString` 方法放在了 `DataIO` 辅助类中。\n\n要写入固定大小的记录，我们只需以二进制形式写入所有字段即可。\n\n\
  ```\nDataIO.writeFixedString(e.getName(), Employee.NAME_SIZE, out);\nout.writeDouble(e.getSalary());\n\
  LocalDate hireDay = e.getHireDay();\nout.writeInt(hireDay.getYear());\nout.writeInt(hireDay.getMonthValue());\n\
  out.writeInt(hireDay.getDayOfMonth());\n```\n\n读取数据同样简单。\n\n```\nString name = DataIO.readFixedString(Employee.NAME_SIZE,\
  \ in);\ndouble salary = in.readDouble();\nint y = in.readInt();\nint m = in.readInt();\n\
  int d = in.readInt();\n```\n\n让我们计算每条记录的大小。我们将为名称字符串使用 40 个字符。因此，每条记录将包含 100 字节：\n\
  \n*   40 个字符 = 80 字节的名称\n*   1 个 `double` = 8 字节的工资\n*   3 个 `int` = 12 字节的日期\n\n\
  Listing 2.2 throws IOException\n   {\n      var staff = new Employee[3];\n\n   \
  \   staff[0] = new Employee(\"Carl Cracker\", 75000, 1987, 12, 15);\n      staff[1]\
  \ = new Employee(\"Harry Hacker\", 50000, 1989, 10, 1);\n      staff[2] = new Employee(\"\
  Tony Tester\", 40000, 1990, 3, 15);\n\n      try (var out = new DataOutputStream(new\
  \ FileOutputStream(\"employee.dat\")))\n      {\n         // 将所有员工记录保存到文件 employee.dat\n\
  \         for (Employee e : staff)\n            writeData(out, e);\n      }\n\n\
  \      try (var in = new RandomAccessFile(\"employee.dat\", \"r\"))\n      {\n \
  \        // 将所有记录检索到一个新数组\n\n         // 计算数组大小\n         int n = (int) (in.length()\
  \ / RECORD_SIZE);\n         var newStaff = new Employee[n];\n\n         // 按逆序读取员工\n\
  \         for (int i = 0; i < n; i++)\n         {\n            in.seek((n - 1 -\
  \ i) * RECORD_SIZE);\n            newStaff[i] = readData(in);\n         }\n\n  \
  \       // 打印新读取的员工记录\n         for (Employee e : newStaff)\n            System.out.println(e);\n\
  \      }\n   }\n\n   /**\n    * 将员工数据写入数据输出流。\n    * @param out 数据输出流\n    * @param\
  \ e   员工\n     */\n   public static void writeData(DataOutput out, Employee e) throws\
  \ IOException\n   {\n      DataIO.writeFixedString(e.getName(), NAME_SIZE, out);\n\
  \      out.writeDouble(e.getSalary());\n\n      LocalDate hireDay = e.getHireDay();\n\
  \      out.writeInt(hireDay.getYear());\n      out.writeInt(hireDay.getMonthValue());\n\
  \      out.writeInt(hireDay.getDayOfMonth());\n   }\n\n   /**\n    * 从数据输入流读取员工数据。\n\
  \    * @param in 数据输入流\n    * @return 员工\n     */\n   public static Employee readData(DataInput\
  \ in) throws IOException\n   {\n      String name = DataIO.readFixedString(NAME_SIZE,\
  \ in);\n      double salary = in.readDouble();\n      int y = in.readInt();\n  \
  \    int m = in.readInt();\n      int d = in.readInt();\n      return new Employee(name,\
  \ salary, y, m, d);\n   }\n}\n```\n\n`java.io.RandomAccessFile` 1.0\n\n*   `RandomAccessFile(String\
  \ file, String mode)`\n*   `RandomAccessFile(File file, String mode)`\n    打开给文件进行随机访问。`mode`\
  \ 字符串为 `\"r\"` 表示只读模式，`\"rw\"` 表示读写模式，`\"rws\"` 表示每次更新时对数据和元数据进行同步磁盘写入的读写模式，`\"\
  rwd\"` 表示仅对数据进行同步磁盘写入的读写模式。\n*   `long getFilePointer()`\n    返回文件指针当前的位置。\n*  \
  \ `void seek(long pos)`\n    将文件指针设置为距离文件开始 `pos` 字节处的位置。\n*   `long length()`\n\
  \    返回以字节为的文件长度。\n\n### 2.2.3 ZIP 档\n\nZIP 档以（通常是）压缩格式存储一个或多个文件。每个 ZIP 档都有一个头部，包含如每个文件名和所使用的压缩方法等信息。在\
  \ Java 中，你可以使用 `ZipInputStream` 读取 ZIP 档。你需要查看 `ZipInputStream` 来读取 ZIP 档。\n\nZIP\
  \ 档以（通常是）压缩格式存储一个或多个文件。每个 ZIP 档都有一个头部，包含如每个文件名和所使用的压缩方法等信息。在 Java 中，你可以使用 `ZipInputStream`\
  \ 读取 ZIP 档。你需要查看 `ZipInputStream` 来读取 ZIP 档。\n\nZIP 档以（通常是）压缩格式存储一个或多个文件。每个 ZIP\
  \ 档都有一个头部，包含如每个文件名和所使用的压缩方法等信息。在 Java 中，你可以使用 `ZipInputStream` 读取 ZIP 档。你需要查看 `ZipInputStream`\
  \ 来读取 ZIP 档。\n\n要写入 ZIP 档，使用 `ZipOutputStream`。对于你想要放入 ZIP 档的每个条目，创建一个 `ZipEntry`\
  \ 对象。将文件名传递给 `ZipEntry` 构造函数；它设置其他参数如日期。\n\n```\nvar zin = new ZipInputStream(new\
  \ FileInputStream(zipname));\nboolean done = false;\nwhile (!done)\n{\n   ZipEntry\
  \ entry = zin.getNextEntry();\n   if (entry == null) done = true;\n   else\n   {\n\
  \      读取内容\n      zin.closeEntry();\n   }\n}\nzin.close();\n```\n\n```\nvar fout\
  \ = new FileOutputStream(\"test.zip\");\nvar zout = new ZipOutputStream(fout);\n\
  for all files\n{\n   var ze = new ZipEntry(filename);\n   zout.putNextEntry(ze);\n\
  \   向 zout 发数据\n   zout.closeEntry();\n}\nzout.close();\n```\n\nJAR 文件（已在第一卷第 4\
  \ 章 中讨论过）只是带有特殊条目——清单文件的 ZIP 文件。使用 `JarInputStream` 和 `JarOutputStream` 类来读取和写入清单条目。\n\
  \nZIP 输入流是流抽象能力的良好示例。当你读取压缩格式存储的数据时，你不需要担心数据在请求时被解压。此外，ZIP 流的字节源不必是文件——ZIP 数据可以来自网络连接。\n\
  \n2.4.8 节 展示了如何使用 `FileSystem` 类无需特殊 API 访问 ZIP 档。\n\n`java.util.zip.ZipInputStream`\n\
  \n*   `ZipInputStream(InputStream in)`\n    创建一个 `ZipInputStream`，允许你从给定的 `InputStream`\
  \ 胀数据。\n*   `ZipEntry getNextEntry()`\n    返回下一个条目的 `ZipEntry` 对象，如果没有更多条目则返回 `null`。\n\
  *   `void closeEntry()`\n    关闭 ZIP 文件中当前打开的条目。然后可以使用 `getNextEntry()` 读取下一个条目。\n\
