  返回一个过滤器，包含包含与给定数字或日期的比较匹配值的行。比较类型为 `EQUAL`、`NOT_EQUAL`、`AFTER` 或 `BEFORE` 之一。如果给了任何列模型索引，则只搜索这些列；否则，搜索所有列。对于数字过滤器，单元格值的类必须与\
