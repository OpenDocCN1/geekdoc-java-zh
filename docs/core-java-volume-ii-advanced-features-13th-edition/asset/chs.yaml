  \ API 函数很容易的。）\n\n即使只有我们提供的有限子集，你仍然可以：\n\n*   枚举键中存储的所有名称\n*   读取与名称关联的值\n*   设置与名称关联的值\n\
  \n以下是封装注册表键的 Java 类：\n\n```\npublic class Win32RegKey\n{\n   public Win32RegKey(int\
  \ theRoot, String thePath) { . . . }\n   public Enumeration names() { . . . }\n\
  \   public native Object getValue(String name);\n   public native void setValue(String\
  \ name, Object value);\n\n   public static final int HKEY_CLASSES_ROOT = 0×80000000;\n\
  \   public static final int HKEY_CURRENT_USER = 0×80000001;\n   public static final\
  \ int HKEY_LOCAL_MACHINE = 0×80000002;\n   . . .\n}\n```\n\n`names` 方法返回一个包含该键存储的所有名称的枚举对象。你可以使用熟悉的\
  \ `hasMoreElements/nextElement` 方法来获取它们。`getValue` 方法返回一个对象，该对象可以是字符串、`Integer`\
  \ 对象或字节数组。`setValue` 方法的 `value` 参数也必须是这三种类型之一。\n\n### 13.10.3. get 原生方法实现注册表访问函数\n\
  \n我们需要实现三个操作：\n\n*   获取名称的值\n*   设置名称的值\n*   遍历键的名称\n\n在本章中，你已经学习了几乎所有所需的工具，例如 Java\
  \ 字符串、数组与 C 语言数组之间的转换。你还学习了在出现问题时如何抛出 Java 异常。\n\n两个问题使得这些原生方法比之前的示例更复杂。`getValue`\
  \ 和 `setValue` 方法处理 `Object` 类型，该类型可以是 `String`、`Integer` 或 `byte[]` 之一。枚举对象存储了在连续调用\
  \ `hasMoreElements` 和 `nextElement` 之间的状态。\n\n让我们首先看看 `getValue` 方法。该方法（显示在 Listing\
  \ 13.22 中）遵循以下步骤：\n\n1. 打开注册表键。为了读取值，注册表 API 要求键必须打开的。\n2. 查询与名称关联的类型和大小。\n3. 将数据读入缓冲区。\n\
  4. 如果类型为 `REG_SZ`（字符串），调用 `NewStringUTF` 创建一个带有值数据的新字符串。\n5. 如果类型为 `REG_DWORD`（32\
  \ 位整数），则调用 `Integer` 构造函数。\n6. 如果类型为 `REG_BINARY`，调用 `NewByteArray` 创建一个新的字节数组，然后调用\
  \ `SetByteArrayRegion` 将值数据拷贝到字节数组。\n7. 如果类型不是上述任何一种，或者在调用 API 函数时发生错误，则抛出异常并释放到此为止已的所有资源。\n\
  8. 关闭键并返回创建的对象（`String`、`Integer` 或 `byte[]`）。\n\n如你所见，这个示例很好地说明了如何生成不同类型的 Java\
  \ 对象。\n\n在这个原生方法中，处理泛型返回类型并不困难。`jstring`、`jobject` 或 `jarray` 引用只需作为 `jobject` 返回。然而，`setValue`\
  \ 方法接收 `Object` 的引用，必须确定该 `Object` 的精确类型，以便将 `Object` 保存为字符串、整数或字节数组。我们可以通过查询 `value`\
  \ 对象的类、找到 `java.lang.String`、`java.lang.Integer` 和 `byte[]` 的类引用，并与 `IsAssignableFrom`\
  \ 函数进行比较来进行判断。\n\n如果 `class1` 和 `class2` 是两个类引用，则调用：\n\n```\n(*env)->IsAssignableFrom(env,\
  \ class1, class2)\n```\n\n当 `class1` 和 `class2` 是同一个类或 `class1` 是 `class2` 的子类时，返回\
  \ `JNI_TRUE`。在任何情况下，`class1` 对象的引用都可以强制转换为 `class2`。例如，当\n\n```\n(*env)->IsAssignableFrom(env,\
  \ (*env)->GetObjectClass(env, value), \n   (*env)->FindClass(env, \"[B\"))\n```\n\
  \n结果为 `true` 时，我们知道 `value` 是字节数组。\n\n以下是 `setValue` 方法步骤的概述：\n\n1. 以写入方式打开注册表键。\n\
  2. 要写入值的类型。\n3. 如果类型为 `String`，调用 `GetStringUTFChars` 获取字符指针。\n4. 如果类型为 `Integer`，调用\
  \ `intValue` 方法获取包装对象存储的整数。\n5. 如果类型为 `byte[]`，调用 `GetByteArrayElements` 获取字节指针。\n\
  6. 将数据和长度传递给注册表。\n7. 关闭键。\n8. 如果类型为 `String` 或 `byte[]`，释放数据指针。\n\n如你所见，这个示例非常清晰地说明了如何生成不同类型的\
  \ Java 对象。\n\n\n\n\n虽然向该键添加这些名称/值对对可能没有害，但你可能想在运行此程序后使用注册表编辑器将它们删除。\n\n### 列表 13.21\
