  \ 的任何未指定压缩方法的条目设置默认压缩方法；可以是 `DEFLATED` 或 `STORED`。\n\n`java.util.zip.ZipEntry` 1.1\n\
  \n* `ZipEntry(String name)`\n    使用给定名称构造一个 ZIP 条目。\n\n* `long getCrc()`\n    返回此\
  \ `ZipEntry` 的 CRC32 校验和值。\n\n* `String getName()`\n    返回此条目的名称。\n\n* `long getSize()`\n\
  \    返回此条目的未压缩前的大小，如果未压缩大小未知，则返回 `-1`。\n\n* `boolean isDirectory()`\n    如果此条目是目录，则返回\
  \ `true`。\n\n* `void setMethod(int method)`\n    将条目的压缩方法设置为 `DEFLATED` 或 `STORED`。\n\
  \n* `void setSize(long size)`\n    设置此条目的的大小。仅在压缩方法为 `STORED` 时才需要。\n\n* `void setCrc(long\
  \ crc)`\n    设置此条目的 CRC32 校验和。使用 `CRC32` 类计算此校验和。仅在压缩方法为 `STORED` 时才需要。\n\n`java.util.zip.ZipFile`\
  \ 1.1\n\n* `ZipFile(String name)`\n* `ZipFile(File file)`\n* `ZipFile(String name,\
  \ Charset charset)` 1.7\n* `ZipFile(File file, Charset charset)` 1.7\n    根据给定的名称或\
  \ `File` 对象创建一个用于读取文件的 `ZipFile`。如果提供了 `Charset`，则它表示条目名称的编码。否则假设它们被编码为 UTF-8。\n\
  \n* `Enumeration entries()`\n    返回一个 `Enumeration` 对象，用于枚举描述 `ZipFile` 条目的 `ZipEntry`\
  \ 对象。\n\n* `ZipEntry getEntry(String name)`\n    返回与给定名称对应的条目，如果没有此类条目，则返回 `null`。\n\
  \n* `InputStream getInputStream(ZipEntry ze)`\n    返回用于给定条目的 `InputStream`。\n\n\
  * `String getName()`\n    返回此 ZIP 文件的路径。\n\n## 2.3 对象输入输出流与序列化\n\n如果你需要存储相同类型的数据，使用固定长度记录格式是一个很好的选择。然而，你在面向面向程序的程序中创建的对象很少是同一种类型。例如，你可能有一个名为\
  \ `staff` 的数组，它名义上是 `Employee` 记录数组，但其中包含的对象实际上是 `Manager` 等子类的实例。\n\n完全可以设计出一种允许你存储此类多态集合的数据格式——但幸运的是，我们不必这样做。Java\
  \ 语言支持一种非常通用的机制，称为*对象序列化*（object serialization），它使得将任何对象写入输出流并在稍后再次读取成为。（你将在后续章节中看到“序列化”一词的来源。）\n\
  \n### 2.3.1 保存和加载可序列化对象\n\n要保存对象数据，你首先需要打开一个 `ObjectOutputStream` 对象：\n\n```\nvar\
  \ out = new ObjectOutputStream(new FileOutputStream(\"employee.dat\"));\n```\n\n\
  现在，要保存一个对象，只需如下代码段所示使用 `ObjectOutputStream` 类的 `writeObject` 方法即可：\n\n```\nvar harry\
  \ = new Employee(\"Harry Hacker\", 50000, 1989, 10, 1);\nvar boss = new Manager(\"\
  Carl Cracker\", 80000, 1987, 12, 15);\nout.writeObject(harry);\nout.writeObject(boss);\n\
  ```\n\n要回读这些对象，首先获取一个 `ObjectInputStream` 对象：\n\n```\nvar in = new ObjectInputStream(new\
  \ FileInputStream(\"employee.dat\"));\n```\n\n然后，使用 `readObject` 方法按照写入时的相同顺序检索对象：\n\
  \n```\nvar e1 = (Employee) in.readObject();\nvar e2 = (Employee) in.readObject();\n\
  ```\n\n然而，对于任何你想保存到输出流并从对象输入流恢复的类，你都需要做一个更改。该类必须实现 `Serializable` 接口：\n\n```\nclass\
  \ Employee implements Serializable { . . . }\n```\n\n`Serializable` 接口没有方法，因此你不需要以任何方式更改你的类。在这方面，它与我们在第一卷第\
  \ 6 章中讨论过的 `Cloneable` 接口相似。然而，要使一个类可克，你仍然需要重写 `Object` 类的 `clone` 方法。要使一个类可序列化，你不需要做任何其他事情。\n\
  \n你可以使用 `writeInt`/`readInt` 或 `writeDouble`/`readDouble` 等方法写入和读取原始类型值。对于对象，使用\
  \ `writeObject`/`readObject`。\n\n\n\n\n如果一个可序列化类的父类不可序列化，那么它必须有一个可访问的无参数构造函数。考虑这个示例：\n\
  \n```java\nclass Person // 不可序列化\nclass Employee extends Person implements Serializable\n\
  ```\n\n当 `Employee` 对象被反序列化时，它的实例字段是从对象输入流中读取的，但 `Person` 的实例字段将由 `Person` 构造函数设置。\n\
  \nListing 2.3 是一个保存并重新加载 `Employee` 和 `Manager` 对象网络的程序（其中某些对象共享同一个员工作为秘书）。注意，重新加载后，秘书对象是唯一的——当\
  \ `newStaff[1]` 加薪时，该变化会反映在经理的 `secretary` 字段中。\n\nListing 2.3 serial/ObjectStreamTest.java\n\
  \n```java\npackage serial;\n\nimport java.io.*;\n\n/**\n * @version 1.12 2021-09-10\n\
  \ * @author Cay Horstmann\n */\nclass ObjectStreamTest\n{\n   public static void\
  \ main(String[] args) throws IOException, ClassNotFoundException\n   {\n      var\
  \ harry = new Employee(\"Harry Hacker\", 50000, 1989, 10, 1);\n      var carl =\
  \ new Manager(\"Carl Cracker\", 80000, 1987, 12, 15);\n      carl.setSecretary(harry);\n\
  \      var tony = new Manager(\"Tony Tester\", 40000, 1990, 3, 15);\n      tony.setSecretary(harry);\n\
  \n      var staff = new Employee[3];\n\n      staff[0] = carl;\n      staff[1] =\
  \ harry;\n      staff[2] = tony;\n\n      // 将所有员工记录保存到文件 employee.ser\n      try\
  \ (var out = new ObjectOutputStream(new FileOutputStream(\"employee.ser\")))\n \
  \     {\n         out.writeObject(staff);\n      }\n\n      try (var in = new ObjectInputStream(new\
  \ FileInputStream(\"employee.ser\")))\n      {\n         // 将所有记录读取到一个新数组中\n\n \
  \        var newStaff = (Employee[]) in.readObject();\n\n         // 为秘书加薪\n   \
  \      newStaff[1].raiseSalary(10);\n\n         // 打印新读取的员工记录\n         for (Employee\
  \ e : newStaff)\n            System.out.println(e);\n      }\n   }\n}\n```\n\n`java.io.ObjectOutputStream`\
  \ 1.1\n\n*   `ObjectOutputStream(OutputStream out)`\n    创建一个 `ObjectOutputStream`，以便你可以将对象写入指定的\
  \ `OutputStream`。\n\n*   `void writeObject(Object obj)`\n    将指定的对象写入 `ObjectOutputStream`。该方法保存了对象的类、类的签名以及该类及其父类中任何非静态、非瞬态（nontransient）字段的值。\n\
  \n`java.io.ObjectInputStream` 1.1\n\n*   `ObjectInputStream(InputStream in)`\n \
  \   创建一个 `ObjectInputStream`，从指定的 `InputStream` 读取回对象信息。\n\n*   `Object readObject()`\n\
  \    从 `ObjectInputStream` 读取一个对象。特别地，该方法会读取对象的类、类的签名以及该类及其所有父类中非瞬态和非静态字段的值。它执行反序列化，以便可以恢复多个对象引用。\n\
  \n### 2.3.2 理解对象序列化文件格式\n\n对象序列化以特定的文件格式保存对象数据。当然，你可以直接使用 `writeObject/readObject`\
  \ 方法，而不需要知道表示文件中对象的确切字节序列。尽管如此，我们发现发现研究这种数据格式对于深入洞察对象序列化过程非常有帮助。由于细节具有很强的技术性，如果你对实现细节不感兴趣，可以随时跳过这一节。\n\
  \n每个文件都以两个字节的“魔数数字”开头：\n\n```\nAC ED\n```\n\n随后是对象序列化格式的版本号，目前为：\n\n```\n00 05\n\
  ```\n\n（在本节中，我们始终使用十六进制数表示字节。）然后，它包含一系列对象，按照它们被保存的顺序排列。\n\n字符串对象的保存格式为：\n\n*   `74`\n\
  *   两个字节长度\n*   “修改后的 UTF-8”格式的字符\n\n例如，字符串“Harry”被保存为：\n\n```\n74 00 05 Harry\n\
  ```\n\n当对象被保存时，该对象的类也必须被保存。类描述符具有以下格式：\n\n*   `72`\n*   类名的 2 字节长度\n*   类名\n*  \
  \ 8 字节指纹（fingerprint）\n*   1 字节标志\n*   2 字节实例字段描述符计数\n*   实例字段描述符\n*   `78`（结束标记）\n\
  *   父类描述符（无则为 `70`）\n\n指纹是通过以规范方式对类、父类、接口、字段类型和方法签名的描述进行排序，然后对该数据应用安全哈希算法版本 1 (SHA-1)得到的。\n\
  \nSHA-1 给了一块信息一个“指纹”。无论原始数据的大小如何，该指纹始终是一个 20 字节的数据包。它是通过对数据进行一系列巧妙的位操作创建的，这使得信息发生任何变化，指纹都极有可能发生改变。序列化机制仅使用\
  \ SHA-1 代码的前八个字节作为类指纹。\n\n序列化机制仅使用 SHA-1 代码的前八个字节作为类指纹。\n\n序列化机制仅使用 SHA-1 代码的前八个字节作为类指纹。\n\
  \n序列化机制仅使用 SHA-1 代码的前八个字节作为类指纹。\n\n序列化机制仅使用 SHA-1 代码的前八个字节作为类指纹。\n\n类型代码是以下之一：\n\
  \n| 代码 | 描述 |\n| --- | --- |\n| `B` | `byte` |\n| `C` | `char` |\n| `D` | `double`\
  \ |\n| `F` | `float` |\n| `I` | `int` |\n| `J` | `long` |\n| `L` | `object` |\n\
  | `S` | `short` |\n| `Z` | `boolean` |\n| `[` | `array` |\n\n当类型代码为 `L` 时，字段名后面跟着字段类型。类和字段名字符串不以\
  \ `74` 开头，但字段类型是。字段类型对其名称使用了不同的编码——即原生方法使用的格式。\n\n例如，`Employee` 类的 `salary` 字段编码为：\n\
  \n```\nD 00 06 salary\n```\n\n每个实例字段描述符的格式为：\n\n*   1 字节类型代码\n*   字段名的 2 字节长度\n\
  *   字段名\n*   类名（如果字段是对象）\n\n这是示例中 `serial` 包下 `Employee` 类的完整类描述符：\n\n| | |\n| ---\
  \ | --- |\n| `72 00 0F serial.Employee` | |\n| `74 1E C8 E6 C3 F8 B8 77 02` | 指纹和标志\
  \ |\n| `00 03` | 实例字段数量 |\n| `D 00 06 salary` | 字段类型和名称 |\n| `L 00 07 hireDay` |\
  \ 字段类型和名称 |\n| `74 00 10 Ljava/util/Date;` | 字段类名：`java.util.Date` |\n| `L 00 04\
  \ name` | 字段类型和名称 |\n| `74 00 12 Ljava/lang/String;` | 字段类名：`java.lang.String` |\n\
  | `78` | 结束标记 |\n| `70` | 无父类 |\n\n\n\n\n\n这些描述符相当长。如果文件中再次需要 `same` 类描述符，则会使用缩写形式：\n\
  \n*   `71`\n*   4 字节序列号\n\n序列号指向上一个显式的类描述符。我们将在稍后讨论该编号方案。\n\n一个对象的存储方式如下：\n\n* \
  \  `73`\n*   类描述符\n*   对象数据\n\n例如，这里是 `Employee` 对象的实例字段的存储方式：\n\n| 数据 | 描述 |\n\
  | :--- | :--- |\n| ```40 E8 6A 00 00 00 00 00``` | `salary` 字段值：`double` |\n| ```73```\
  \ | `hireDay` 字段值：新对象 |\n| ```71 00 7E 00 08``` | 现有类 `java.util.Date` |\n| ```77\
  \ 08 00 00 00 91 19 97 3D 80 78``` | 外部存储（详情稍后介绍） |\n| ```74 00 0C Harry Hacker```\
  \ | `name` 字段值：`String` |\n\n如你所见，数据文件包含恢复 `Employee` 对象所需的足够信息。（在本例中，我们将 `hireday`\
  \ 存储为 `Date` 而不是 `LocalDate`，因为 `LocalDate` 类的序列化更为复杂。）正如你刚刚看到的，对象流包含了所有序列化对象的类名、父类名和字段名。对于内部类，这些名称中的某些是由编译器生成的，且命名约定可能会在不同的\
  \ Java 实现之间发生变化。如果发生这种情况，反序列化将失败。因此，如果你打算在不同的实现中对内部类进行反序列化，那么序列化它们存在很小的风险。\n\n静态内部类（包括内部枚举和记录）是安全的序列化的。\n\
  \n数组按以下格式保存：\n\n*   `75`\n*   类描述符\n*   4 字节元素个数\n*   元素\n\n类描述符中的数组类名与原生方法中使用的格式相同（与其它类描述符中类名使用的格式略有不同）。在这种格式下，类名以\
  \ `L` 开头并以 `;` 结尾。\n\n例如，一个包含三个 `Employee` 对象的数组起始如下：\n\n| 数据 | 描述 |\n| :--- | :---\
  \ |\n| ```75``` | 数组 |\n| ```72 00 0B [LEmployee;``` | 新类，字符串长度，类名 `Employee[]`\
  \ |\n| ```40 05 D6 7E 3B BB F2 50 02``` | 指纹和标志位 |\n| ```00 00``` | 实例字段个数 |\n|\
  \ ```78``` | 结束标记 |\n| ```70``` | 无父类 |\n| ```00 00 00 03``` | 数组项个数 |\n\n注意，`Employee`\
  \ 对象数组的指纹与 `Employee` 类本身的指纹是不同的。\n\n所有对象（包括数组和字符串）以及所有类描述符在保存到输出文件时都被赋予序列号。这些数字从\
  \ `00 7E 00 00` 开始。\n\n我们已经看到，任何给定类的完整类描述符只出现一次。后续的描述符会引用它。例如，在我们之前的示例中，对 `Date`\
  \ 类的重复引用被编码为：\n\n```\n71 00 7E 00 08\n```\n\n相同的机制也适用于对象。如果写入了对之前保存对象的引用，它将以完全相同的方式保存——即\
  \ `71` 后跟序列号。从上下文中始终清楚某个特定的序列引用是指类描述符还是对象。\n\n某些类（如 `Date` 类）将对象状态存储在不透明的二进制块中，编码为：\n\
  \n*   `77`（短块）或 `7A`（长块）\n*   1 字节或 4 字节块长度\n*   块内容\n*   `78`\n\n最后，空引用被存储为：\n\n\
  ```\n70\n```\n\n这里是上一节中 `ObjectStreamTest` 程序的带注释输出。运行该程序，查看其数据文件 `employee.ser`\
  \ 的十六进制转储，并将其与注释列表进行比较。最重要的行位于输出的末尾。它们显示了对之前保存的对象的引用。\n\n| 数据 | 描述 |\n| :--- | :---\
  \ |\n| ```AC ED 00 05``` | 文件头 |\n| ```75``` | 数组 `staff`（序列号 #1） |\n| ```72 00\
  \ 12 [Lserial.Employee;``` | 新类，字符串长度，类名 `Employee[]`（序列号 #0） |\n| ```40 05 D6 7E\
  \ 3B BB F2 50 02``` | 指纹和标志位 |\n| ```00 00``` | 实例字段个数 |\n| ```78``` | 结束标记 |\n\
  | ```70``` | 无父类 |\n| ```00 00 00 03``` | 数组项个数 |\n| ```73``` | `staff[0]`—新对象（序列号\
  \ #7） |\n| ```72 00 0E serial.Manager``` | 新类，字符串长度，类名 `Manager`（序列号 #2） |\n| ```2F\
  \ FF 1F 1D E8 A9 7D``` | 指纹和标志位 |\n| ```00 01``` | 实例字段个数 |\n| ```71 00 7E 00 08```\
  \ | 现有类 `java.util.Date` |\n| ```73``` | `salary` 字段值：新对象 |\n| ```72 00 0E serial.Manager```\
