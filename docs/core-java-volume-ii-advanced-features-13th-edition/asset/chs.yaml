  \n\n\n-   相同对象的重复出现将存储为对该序列号的引用。\n\n### 2.3.3. Transient Fields（Transient 字段）\n\n\
  某些字段永远不应该被序列化——例如，在对象重构时没有意义的数据库连接。此外，当对象保留了值的缓存时，丢弃缓存并重新计算可能比存储它更好。\n\n要防止某个字段被序列化，请使用\
  \ `transient` 修饰符对其进行标记。如果字段持有不可序列化类的实例，请务必将字段标记为 `transient`。在对象序列化时，瞬态字段会被直接跳过。\n\
  \n### 2.3.4. `readObject` 和 `writeObject` 方法\n\n在少数情况下，你需要调整序列化机制。可序列化类可以通过定义具有以下签名的方法，为默认读写行为添加任何所需的操作：\n\
  \n```\n@Serial private void readObject(ObjectInputStream in)\n      throws IOException,\
  \ ClassNotFoundException;\n@Serial private void writeObject(ObjectOutputStream out)\n\
  \      throws IOException;\n```\n\n此时，对象头将继续照常写入，但字段不再自动序列化。相反，将调用这些方法。\n\n### 注意\
  \ `@Serial` 注解。调整序列化的方法不属于接口。因此，你不能使用 `@Override` 注解来让编译器检查方法声明。`@Serial` 注解旨在为序列化方法启用相同的检查。在\
  \ Java 21 为止，`javac` 编译器不进行此类检查，但未来可能会发生变化。IntelliJ IDE 使用了该注解。\n\n这里是一个典型的自定义示例。`java.awt.geom`\
  \ 包中的某些类（如 `Point2D.Double`）是不可序列化的。现在，假设你想序列化一个存储了 `String` 和 `Point2D.Double`\
  \ 的类 `LabeledPoint`。首先，你需要将 `Point2D.Double` 字段标记为 `transient` 以避免出现 `NotSerializableException`。\n\
  \n```\npublic class LabeledPoint implements Serializable\n{\n   private String label;\n\
  \   private transient Point2D.Double point;\n   . . .\n}\n```\n\n在 `writeObject`\
  \ 方法中，首先通过调用 `defaultWriteObject` 方法写入对象描述符和 `String` 字段 `label`。这是 `ObjectOutputStream`\
  \ 类的一个特殊方法，只能在可序列化类的 `writeObject` 方法内部调用。然后，我们使用标准的 `DataOutput` 调用写入点坐标。\n\n```\n\
  private void writeObject(ObjectOutputStream out) throws IOException\n{\n   out.defaultWriteObject();\n\
  \   out.writeDouble(point.getX());\n   out.writeDouble(point.getY());\n}\n```\n\n\
  在 `readObject` 方法中，我们反转该过程：\n\n```\nprivate void readObject(ObjectInputStream in)\n\
  \      throws IOException, ClassNotFoundException\n{\n   in.defaultReadObject();\n\
  \   double x = in.readDouble();\n   double y = in.readDouble();\n   point = new\
  \ Point2D.Double(x, y);\n}\n```\n\n另一个例子是 `HashSet` 类，它提供了自己的 `readObject` 和 `writeObject`\
  \ 方法。与其保存哈希表的内部结构，`writeObject` 方法仅保存了容量、负载因子、大小和元素。`readObject` 方法读回容量和负载因子，构建一个新表并插入元素。\n\
  \n`readObject` 和 `writeObject` 方法只需要保存和加载它们的数据。它们不关心父类数据或任何其他类信息。\n\n`Date` 类使用了这种方法。它的\
  \ `writeObject` 方法保存了自“纪元”（1970 年 1 月 1 日）以来的毫秒。缓存日历的数据结构没有被保存。因此，序列化的 `Date` 实例由一个不透明的数据块组成。\n\
  \n就像构造函数一样，`readObject` 方法在部分初始的对象上操作。如果你在 `readObject` 内部调用了在子类中重写的非 final 方法，它可能会访问未初始的数据。\n\
  \n如果可序列化类定义了一个字段：\n\n```\n@Serial private static final ObjectStreamField[] serialPersistentFields\n\
  ```\n\n那么序列化将使用这些字段描述符而不是非瞬态非静态字段。还有一个 API 可以在序列化之前设置字段值，或在反序列化之后读取它们。这对于在类演进后保留遗留布局非常有用。例如，`BigDecimal`\
  \ 类使用这种机制以一种不再反映实例字段的格式来序列化其实例。\n\n### 2.3.5. `readExternal` 和 `writeExternal` 方法\n\
  \n与其让序列化机制保存和恢复对象数据，类可以定义自己的机制。例如，你可以加密数据，或使用比序列化格式更高效的格式。\n\n为了做到这一点，类必须实现 `Externalizable`\
  \ 接口。这反过来要求它定义两个方法：\n\n```\npublic void readExternal(ObjectInput in)\n      throws\
  \ IOException, ClassNotFoundException;\npublic void writeExternal(ObjectOutput out)\
  \ throws IOException;\n```\n\n与 `readObject` 和 `writeObject` 方法不同，这些方法完全负责保存和恢复整个对象，包括父类数据。在写入对象时，序列化机制仅在输出流中记录对象的类。在读取外部化对象时，对象输入流会使用无参数构造函数创建一个对象，然后调用\
  \ `readExternal` 方法。\n\n在这个示例中，`LabeledPoint` 类继承自 `Point`，但它接管了该类及其父类的序列化。对象的字段没有存储在标准的序列化格式中。相反，数据被放置在一个不透明的块中。\n\
  \n```\npublic class LabeledPoint extends Point implements Externalizable\n{\n  \
  \ private String label;\n\n   public LabeledPoint() {} // externalizable 类需要\n\n\
  \   public void writeExternal(ObjectOutput out)\n         throws IOException\n \
  \  {\n      out.writeInt((int) getX());\n      out.writeInt((int) getY());\n   \
  \   out.writeUTF(label);\n   }\n\n   public void readExternal(ObjectInput in)\n\
  \         throws IOException, ClassNotFoundException\n   {\n      int x = in.readInt();\n\
  \      int y = in.readInt();\n      setLocation(x, y);\n      label = in.readUTF();\n\
  \   }\n   . . .\n}\n```\n\n`readExternal` 和 `writeExternal` 方法不应该使用 `@Serial` 注解。由于它们定义在\
  \ `Externalizable` 接口中，你可以简单地对它们使用 `@Override`。\n\n与私有的且只能由序列化机制调用的 `readObject`\
  \ 和 `writeObject` 方法不同，`readExternal` 和 `writeExternal` 方法是公共的。特别是 `readExternal`\
  \ 允许修改现有状态。\n\n### 2.3.6. `readResolve` 和 `writeReplace` 方法\n\n我们认为对象只能通过构造函数构造。然而，反序列化的对象并不是构造的。它的字段是从对象流恢复的。\n\
  \n如果构造函数强制执行某些条件，就会有问题。例如，单例对象可能实现为构造函数只能调用一次。另一个例子是，数据库实体可以构造为始终来自受管理的实例池。\n\n\
  你不应该为单例实现自己的机制。如果你需要一个单例，创建一个只有一个实例的枚举类型，该实例按照习惯命名为 `INSTANCE`。\n\n```\npublic enum\
  \ PersonDatabase {\n   INSTANCE;\n\n   public Person findById(int id) { . . . }\n\
  \   . . .\n}\n```\n\n这之所以有效，是因为 `enum` 实例保证被正确地反序列化。\n\n\n\n\n现在，假设你处于一种罕见的情况，想要控制每个反序列化实例的标识。例如，假设一个\
  \ `Person` 类在反序列化时想要从数据库恢复它的实例。这时，你不应该序列化对象本身。相反，应该请求保存一个代理实例。当恢复时，该代理实例会定位并构造所需的对象。你的类需要提供一个返回代理对象的\
  \ `writeReplace` 方法：\n\n```\npublic class Person implements Serializable {\n   private\
  \ int id;\n   // 其他字段\n   . . .\n   @Serial private Object writeReplace() {\n  \
  \    return new PersonProxy(id);\n   }\n}\n```\n\n当一个 `Person` 对象被序列化时，它的没有任何字段都会被保存。相反，会调用\
  \ `writeReplace` 方法，并将其返回值进行序列化后写入流中。\n\n代理类需要实现一个返回 `Person` 实例的 `readResolve`\
  \ 方法：\n\n```java\nclass PersonProxy implements Serializable {\n   private int id;\n\
  \n   public PersonProxy(int id) {\n      this.id = id;\n   }\n\n   @Serial private\
  \ Object readResolve() {\n      return PersonDatabase.INSTANCE.findById(id);\n \
  \  }\n}\n```\n\n当 `readObject` 方法在 `ObjectInputStream` 中找到 `PersonProxy` 时，它会反序列化该代理，调用它的\
  \ `readResolve` 方法并返回结果。\n\n与 `readObject` 和 `writeObject` 方法不同，`readResolve` 和\
  \ `writeReplace` 方法不需要是私有的。\n\n对于枚举（enumerations）和记录（records），序列化不会使用 `readObject`/writeObject`\
  \ 或 `readExternal`/writeExternal` 方法。对于记录（但不对于枚举），将使用 `writeReplace` 方法。\n\n###\
  \ 2.3.7. 版本控制\n\n如果你使用序列化来保存对象，你需要考虑当程序演进时会发生什么。版本 1.1 能读取旧文件吗？仍在使用 1.0 的用户能读取新版本生成的文件吗？显然，如果对象文件能够处理类的演进，将是理想的。\n\
  \n初看之下，这似乎是不可能的。当类定义发生任何变化时，它的 SHA 指纹也会随之改变，而你知道对象输入流将拒绝读取具有不同指纹的对象。然而，类可以指示它与自己的早期版本兼容。要做到这一点，你必须先获取该类早期版本的指纹。使用\
  \ JDK 带的独立程序 `serialver` 来获取此数字。例如，运行\n\n```\nserialver serial.Employee\n```\n\n\
  将打印出\n\n```\nserial.Employee: static final long serialVersionUID = 8367346051156850807L;\n\
  ```\n\n该类的所有后续版本必须将 `serialVersionUID` 常量定义为与原始相同的指纹。\n\n```java\nclass Employee\
  \ implements Serializable // 版本 1.1\n{\n   . . .\n   @Serial public static final\
  \ long serialVersionUID = 8367346051156850807L;\n}\n```\n\n当类中有一个名为 `serialVersionUID`\
  \ 的静态数据成员时，它将不再手动计算指纹，而是使用该值。\n\n一旦该静态数据成员被放置在类内部，序列化系统现在愿意读取该类不同版本的对象。\n\n如果只是类方法发生了变化，那么读取新的对象数据没有问题。然而，如果实例字段发生了变化，你可能会遇到问题。例如，旧文件对象的实例字段可能比程序中的多或少，或者实例字段的类型可能不同。在这种情况下，对象输入流会努力将序列化对象转换为类的当前版本。\n\
  \n对象输入流会将类当前版本的实例字段与序列化对象中的版本实例字段进行比较。当然，对象输入流只考虑非瞬态（nontransient）和非静态实例字段。如果两个字段名称相同但类型不同，对象输入流不会尝试将一种类型转换为另一种——这些对象是不兼容的。如果序列化对象具有当前版本中不存在的实例字段，对象输入流将忽略这些额外数据。如果当前版本具有序列化对象中不存在的实例字段，则新增的字段将被设置为默认值（对象为\
  \ `null`，数字为 0，布尔值为 `false`）。\n\n这里有一个例子。假设我们使用类的原始版本（1.0）在磁盘上保存了一些员工记录。现在，我们通过添加一个名为\
  \ `department` 的实例字段将 `Employee` 类更改到版本 2.0。#ch01fig09](#index_u18_split_000.xhtml_ch01fig09)\
  \ 显示了当使用 2.0 对象的程序读取 1.0 对象时会发生什么。`department` 字段被设置为 `null`。#ch01fig10](#index_u18_split_000.xhtml_ch01fig10)\
  \ 显示了相反的情况：使用 1.0 对象的程序读取一个 2.0 对象。额外的 `department` 字段被忽略了。\n\n![Figure](img/fig01-09.jpg)图\
  \ 2.7: 读取实例字段较少的对象![Figure](img/fig01-10.jpg)图 2.8: 读取实例字段较多的对象\n\n这个过程安全吗？这取决于具体情况。丢弃一个实例字段似乎是无害的——接收方仍然拥有它知道的所有数据。将实例字段设置为\
  \ `null` 可能并不那么安全。许多类努力在构造函数中将所有实例字段初始化为非 `null` 值，以便方法不需要处理 `null` 数据。类设计者负责在 `readObject`\
  \ 方法中实现额外的代码来解决兼容性问题，或者确保方法足够健壮以处理 `null` 数据。\n\n在为类中添加 `serialVersionUID` 字段之前，先问自己为什么要让该类可序列化。如果序列化仅用于短期持久化（例如应用服务器中的分布式方法调用），则无需担心版本控制和\
  \ `serialVersionUID`。如果你扩展了一个恰好可序列化的类，但你从未打算持久化它，情况也是如此。如果 IDE 给你警告，可以更改 IDE 设置关闭它们，或者添加注解\
  \ `@SuppressWarnings(\"serial\")`。这比添加一个可能会忘记更改的 `serialVersionUID` 安全。\n\n枚举和记录忽略\
  \ `serialVersionUID` 字段。枚举的 `serialVersionUID` 始终为 `0L`。你可以声明记录的 `serialVersionUID`，但反序列化不需要匹配。\n\
  \n在本节中，你看到了当读取器的类版本具有对象流中不存在的实例字段会发生什么。在类演进过程中，可能会增加父类。这时，使用新版本的读取器可能会读取一个父类字段未设置的对象流。默认情况下，这些实例字段被设置为零/`null`\
  \ 默认值。这可能会让父类处于不安全的状态。父类可以通过定义初始化方法来防御这种问题：\n\n```java\n@Serial private void readObjectNoData()\
  \ throws ObjectStreamException\n```\n\n该方法应该像无参构造函数一样设置状态，或者抛出 `InvalidObjectException`。它只在读取一个包含缺失父类数据的子类对象流的异常情况下被调用。\n\
  \n### 2.3.8. 使用序列化进行克隆\n\n序列化机制有一个有趣的用途：它提供了一种克隆对象的简单方法，前提是该类是可序列化的。只需将其序列化到输出流中，然后重新读回。结果是现有对象的一个深拷贝新对象。你不需要将其写入文件——可以使用\
  \ `ByteArrayOutputStream` 将数据保存到字节数组中。\n\n\n\n\n如 Listing 2.4 所示，要免费获得 `clone` 方法，只需扩展\
  \ `SerialCloneable` 类即可。\n\n你应当意识到，这种方法虽然很巧妙，但通常通常会比那种显式构造新对象并复制或克隆实例字段的 clone 方法慢得多。\n\
  \nListing 2.4 `serialClone/SerialCloneTest.java`\n\n```\npackage serialClone;\n\n\
  /**\n * @version 1.23 2024-01-12\n * @author Cay Horstmann\n */\n\nimport java.io.*;\n\
  import java.time.*;\n\npublic class SerialCloneTest\n{\n   public static void main(String[]\
  \ args) throws CloneNotSupportedException\n   {\n      var harry = new Employee(\"\
  Harry Hacker\", 35000, 1989, 10, 1);\n      // clone harry\n      var harry2 = (Employee)\
  \ harry.clone();\n\n      // mutate harry\n      harry.raiseSalary(10);\n\n    \
  \  // now harry and the clone are different\n      System.out.println(harry);\n\
  \      System.out.println(harry2);\n   }\n}\n\n/**\n * A class whose clone method\
  \ uses serialization.\n */\nclass SerialCloneable implements Cloneable, Serializable\n\
  {\n   public Object clone() throws CloneNotSupportedException\n   {\n      try\n\
  \      {\n         // save the object to a byte array\n         var bout = new ByteArrayOutputStream();\n\
  \         try (var out = new ObjectOutputStream(bout))\n         {\n           \
  \ out.writeObject(this);\n         }\n\n         // read a clone of the object from\
  \ the byte array\n         var bin = new ByteArrayInputStream(bout.toByteArray());\n\
  \         try (var in = new ObjectInputStream(bin))\n         {            \n  \
  \          return in.readObject();\n         }\n      } \n      catch (IOException\
  \ | ClassNotFoundException e)\n      {\n         var e2 = new CloneNotSupportedException();\n\
  \         e2.initCause(e);\n         throw e2;\n      }\n   }\n}\n\n/**\n * The\
  \ familiar Employee class, redefined to extend the SerialCloneable class.\n */\n\
  class Employee extends SerialCloneable\n{\n   private String name;\n   private double\
  \ salary;\n   private LocalDate hireDay;\n\n   public Employee(String n, double\
  \ s, int year, int month, int day)\n   {\n      name = n;\n      salary = s;\n \
  \     hireDay = LocalDate.of(year, month, day);\n   }\n\n   public String getName()\n\
  \   {\n      return name;\n   }\n\n   public double getSalary()\n   {\n      return\
  \ salary;\n   }\n\n   public LocalDate getHireDay()\n   {\n      return hireDay;\n\
  \   }\n\n   /**\n    * Raises the salary of this employee.\n    * \n    * @param\
  \ byPercent the percentage of the raise\n    */\n   public void raiseSalary(double\
  \ byPercent)\n   {\n      double raise = salary * byPercent / 100;\n      salary\
  \ += raise;\n   }\n\n   public String toString()\n   {\n      return getClass().getName()\
  \ \n         +\"[name=\" + name + \",salary=\" + salary + \",hireDay=\" + hireDay\
  \ + \"]\";\n   }\n}\n```\n\n### 2.3.9 反序列化与安全\n\n在可序列化类的反序列化过程中，对象的创建不会调用该类的任何构造函数。即使该类有无参数构造函数，也不会使用它。字段值是直接从对象输入流的值中设置的。\n\
  \n对于可序列化的 `records`，反序列化会调用规范构造函数（canonical constructor），并将对象输入流中的组件值传递给它。（结果是 records\
  \ 中的循环引用将不会被恢复。）\n\n绕过构造函数是一种安全风险。攻击者可以构造出描述无效对象的字节流，这种对象是永远无法被构造出来的。例如，假设 `Employee`\
  \ 构造函数在带有负薪资调用时会抛出异常。我们可能希望认为这意味着没有任何 `Employee` 对象可以拥有负薪资。但是，正如你在前一节中看到的，检查序列化对象的字节流并修改其中一些内容并不困难。通过这种方式，人们可以构造出一个具有负薪资的员工字节流，然后对其进行反序列化。\n\
  \n可序列化类可以选择实现 `ObjectInputValidation` 接口并定义 `validateObject` 方法，以检查其对象是否被正确反序列化。例如，`Employee`\
  \ 类可以检查薪资是否为负数：\n\n```java\npublic void validateObject() throws InvalidObjectException\n\
  {\n   System.out.println(\"validateObject\");\n   if (salary < 0)\n      throw new\
  \ InvalidObjectException(\"salary < 0\");\n}\n```\n\n遗憾的是，该方法不会被自动调用。要调用它，你必须提供以下方法：\n\
  \n```java\n@Serial private void readObject(ObjectInputStream in)\n      throws IOException,\
  \ ClassNotFoundException\n{\n   in.registerValidation(this, 0);\n   in.defaultReadObject();\n\
  }\n```\n\n随后该对象会被调度进行验证，当该对象及其所有依赖对象都加载完成后，`validateObject` 方法就会被调用。第二个参数允许你指定优先级。优先级更高的验证请求会先执行。\n\
  \n还有其他安全风险。攻击者可以创建消耗足够资源导致虚拟机崩溃的数据结构。更阴险的是，类路径上的任何类都可以被反序列化。黑客们非常擅长拼凑“getget 链”（gadget\
  \ chains），即在各种工具类中的操作序列，最终调用诸如 `Runtime.exec` 并带有他们指定的字符串的方法。\n\n任何通过网络接收不可信源的序列化数据的应用程序都会受到此类攻击的威胁。对于会话数据的示例，服务器应该对数据进行签名，仅反序列化签名有效的数据。\n\
  \n为了加固应用程序防御此类攻击，过滤器可以看到反序列化类的名称以及若干指标（流大小、引用总数、引用引用链）。根据这些数据，可以中止反序列化。\n\n在最简单的情况下，你提供一个描述有效无效类的模式。例如，如果你如下启动我们的示例程序：\n\
  \n```\njava -Djdk.serialFilter='serial.*;java.**;!*' serial.ObjectTest\n```\n\n\
  那么对象将被加载。过滤器允许 `serial` 包中的所有类以及所有以 `java` 开头的类，但不允许其他类。如果你不允许 `java.**` 或至少不允许\
  \ `java.util.Date`，反序列化将失败。\n\n## 2.4 操作文件\n\n你学习了如何从文件读写数据。然而，文件管理不仅仅是读写。`Path`\
  \ 接口和 `Files` 类封装了与用户机器文件系统工作的功能。例如，`Files` 类可以用于删除或重命名文件，或者查询文件的最后修改时间。换句话说，输入输出流类关注文件的内容，而我们在这里讨论的类关注文件在磁盘上的存储。\n\
  \n`Path` 接口和 `Files` 类比追溯到 JDK 1.0 的 `File` 类要方便得多。除非要与旧代码进行交互，否则你不应该使用 `File` 类。\n\
  \n### 2.4.1 路径 (Paths)\n\n\n\n\n`Path` 是目录名称的序列，可选地跟一个文件名。路径的第一个组件可以是`根组件`（root\
  \ component），例如 `/` 或 `C:\\`。允许的根组件取决于文件系统。以根组件开头的路径是**绝对的**（absolute）。否则，它是**相对的**（relative）。例如，在这里我们构造了一个绝对路径和一个相对路径。对于绝对路径，我们假设使用类\
  \ UNIX 的文件系统。\n\n```\nPath absolute = Path.of(\"/home\", \"harry\");\nPath relative\
  \ = Path.of(\"myprog\", \"conf\", \"user.properties\");\n```\n\n静态方法 `Path.of` 接收一个或多个字符串，将其与默认文件系统的路径分隔符连接（类\
  \ UNIX 文件系统使用 `/`，Windows 使用 `\\`）。然后，它会解析结果，如果结果在给定的文件系统中不是有效路径，则会抛出 `InvalidPathException`。结果是一个\
  \ `Path` 对象。\n\n`of` 方法可以获取包含多个组件的单个字符串。例如，你可以这样从配置文件读取路径：\n\n```\nString baseDir\
  \ = props.getProperty(\"base.dir\");\n   // 可能是一个类似于 /opt/myprog 或 c:\\Program Files\\\
  myprog 的字符串\nPath basePath = Path.of(baseDir); // baseDir 包含分隔符是允许的\n```\n\n路径并不对应于实际存在的文件。它只是名称的抽象序列。正如你将在下一节中看到的，当你想要创建一个文件时，首先创建一个路径，然后调用一个方法来创建相应的文件。\n\
  \n组合或 `resolve`（解析）路径是非常常见的。调用 `p.resolve(q)` 按照以下规则返回路径：\n\n* 如果 `q` 是绝对的，则结果为\
  \ `q`。\n* 如果 `q` 没有根节点，则结果通过连接 `p` 和 `q` 获得。\n* 否则，结果取决于文件系统的规则。\n\n例如，假设你的应用程序需要相对于从配置文件读取的给定基目录找到其工作目录，如上一个示例所示。\n\
  \n```\nPath workRelative = Path.of(\"work\");\nPath workPath = basePath.resolve(workRelative);\n\
  ```\n\n`resolve` 方法有一个快捷方式，可以接收字符串而不是路径：\n\n```\nPath workPath = basePath.resolve(\"\
  work\");\n```\n\n`resolve` 方法不会简化结果。例如：\n\n```\nPath.of(\"/usr/bin\").resolve(\"\
  ../local\")\n```\n\n结果是路径 `/usr/bin/../local`。\n\n有一个便利方法 `resolveSibling`，它相对于路径的父路径进行解析，产生一个兄弟路径。例如，如果\
  \ `workPath` 是 `/opt/myapp/work`，调用：\n\n```\nPath tempPath = workPath.resolveSibling(\"\
  temp\");\n```\n\n将创建 `/opt/myapp/temp`。\n\n`resolve` 的反操作是 `relativize`（相对化）。调用\
  \ `p.relativize(r)` 产生路径 `q`，该路径与 `p` 解析后会产生 `r`。例如，将 `/home/harry` 相对于 `/home/fred/input.txt`\
  \ 相对化得到 `../fred/input.txt`。在这里我们假设 `..` 表示文件系统的父目录。\n\n`normalize` 方法移除任何冗余的 `.`\
  \ 和 `..` 组件（或文件系统认为冗余的任何组件）。例如，规范化路径 `/home/harry/../fred/./input.txt` 产生 `/home/fred/input.txt`。\n\
  \n`toAbsolutePath` 方法产生给定路径的绝对路径，从根组件开始，例如 `/home/fred/input.txt` 或 `c:\\Users\\\
  fred\\input.txt`。\n\n`Path` 接口有很多拆分路径的有用方法。此代码示例展示了其中最常用的几个：\n\n```\nPath p = Path.of(\"\
  /home\", \"fred\", \"myprog.properties\");\nPath parent = p.getParent(); // 路径 /home/fred\n\
  Path file = p.getFileName(); // 路径 myprog.properties\nPath root = p.getRoot(); //\
  \ 路径 /\n```\n\n`getFileName` 方法返回给定路径的最后一个组件。如果路径描述的是目录，那么它是目录名称而不是文件名。\n\n正如你在第一卷中看到的，你可以从\
  \ `Path` 对象构造一个 `Scanner`：\n\n```java\nvar in = new Scanner(Path.of(\"/home/fred/input.txt\"\
  ));\n```\n\n偶尔，你可能需要与使用 `File` 类而不是 `Path` 接口的旧 API 交互。`Path` 接口有一个 `toFile` 方法，而\
  \ `File` 类有一个 `toPath` 方法。\n\n`java.nio.file.Path` 7\n\n* `static Path of(String\
  \ first, String... more)` 11\n    通过连接给定的字符串创建路径。\n* `Path resolve(Path other)`\n\
  * `Path resolve(String other)`\n    如果 `other` 是绝对的，返回 `other`；否则返回通过连接 `this` 和\
  \ `other` 获得的路径。\n* `Path resolveSibling(Path other)`\n* `Path resolveSibling(String\
  \ other)`\n    如果 `other` 是绝对的，返回 `other`；否则返回通过连接 `this` 的父路径和 `other` 获得的路径。\n\
  * `Path relativize(Path other)`\n    返回相对路径，该路径与 `this` 解析后产生 `other`。\n* `Path\
  \ normalize()`\n    移除冗余的路径元素。\n* `Path toAbsolutePath()`\n    产生给定路径的绝对路径，从根组件开始。\n\
  * `Path getParent()`\n    返回路径的父路径。\n* `Path getFileName()`\n    返回给定路径的最后一个组件。\n\
  * `Path getRoot()`\n    返回路径的根节点。\n* `Path toFile()`\n    从此路径创建一个 `File`。\n\n`java.io.File`\
  \ 0\n\n* `Path toPath()` 7\n    从此文件创建一个 `Path`。\n\n### 2.4 读取和写入文件\n\n`Files` 类可以处理常见的文件操作。例如，你可以轻松地将文件的整个内容读取字节数组、字符串、行列表或行流：\n\
  \n```\nbyte[] bytes = Files.readAllBytes(path);\nString content = Files.readString(path,\
  \ charset);\nList<String> lines = Files.readAllLines(path, charset);\nStream<String>\
  \ lineStream = Files.lines(path, charset);\n```\n\n相反，对于写入：\n\n```\nFiles.write(path,\
  \ bytes);\nFiles.write(path, content);\nFiles.write(path, lines, charset);\n```\n\
  \n向给定文件追加，使用：\n\n```\nFiles.write(path, content, charset, StandardOpenOption.APPEND);\n\
  ```\n\n调用：\n\n```\nlong pos = Files.mismatch(path1, path2);\n```\n\n产生文件内容不同字节的位置。\n\
  \n获取文件的 MIME 类型（例如 `\"text/html\"` 或 `\"image/png\"`），调用：\n\n```java\nString mimeType\
  \ = Files.probeContentType(path);\n```\n\n具体行为取决于 Java 的实现。每个实现都有一组 `FileTypeDetector`\
  \ 实例，按不指定的顺序进行尝试。每个检测器可能会检查文件扩展名、操作系统特定的元数据或内容的几个字节。\n\n以下方法允许你与使用经典输入输出流或读取器/写入器的\
  \ API 交互：\n\n```\nInputStream in = Files.newInputStream(path);\nOutputStream out\
  \ = Files.newOutputStream(path);\nReader in = Files.newBufferedReader(path, charset);\n\
  Writer out = Files.newBufferedWriter(path, charset);\n```\n\n这些便利方法避免了你处理 `FileInputStream`、`FileOutputStream`、`BufferedReader`\
  \ 或 `BufferedWriter`。\n\n\n\n返回已安装的文件类型检测器对文件内容 MIME 类型的最佳猜测，如果无法确定类型，则返回 `null`。\n\
  \n*   `static InputStream newInputStream(Path path, OpenOption... options)`\n* \
  \  `static OutputStream newOutputStream(Path path, OpenOption... options)`\n*  \
  \ `static BufferedReader newBufferedReader(Path path, Charset charset)`\n*   `static\
  \ BufferedWriter newBufferedWriter(Path path, Charset charset, OpenOption... options)`\n\
  \n打开文件用于读取或写入。\n\n### 2.4.3. 创建文件和目录\n\n要创建一个新目录，调用\n\n```\nFiles.createDirectory(path);\n\
  ```\n\n路径中除最后一个组件以外的所有部分必须已经存在。如果也要创建中间目录，请使用\n\n```\nFiles.createDirectories(path);\n\
  ```\n\n你可以使用以下方法创建一个空文件：\n\n```\nFiles.createFile(path);\n```\n\n如果文件已存在，该调用将抛出异常。存在检查和创建是原子的。如果文件不存在，它将在其他其他人执行相同操作之前被创建。\n\
  \n有一些便利方法，可以在给定位置或系统特定的位置创建临时文件或目录。\n\n```\nPath newPath = Files.createTempFile(dir,\
  \ prefix, suffix);\nPath newPath = Files.createTempFile(prefix, suffix);\nPath newPath\
  \ = Files.createTempDirectory(dir, prefix);\nPath newPath = Files.createTempDirectory(prefix);\n\
  ```\n\n在这里，`dir` 是一个 `Path`，而 `prefix`/`suffix` 是可能是 `null` 的字符串。例如，调用 `Files.createTempFile(null,\
  \ \".txt\")` 可能会返回类似 `/tmp/1234405522364837194.txt` 的路径。\n\n当你创建文件或目录时，可以指定属性，例如所有者或权限。然而，细节取决于文件系统，我们在这里不介绍它们。\n\
