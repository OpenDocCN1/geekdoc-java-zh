  \ I>`\n\n```java\nboolean include(RowFilter.Entry<? extends M,? extends I> entry)\n\
  ```\n\n指定要保留的行；你可以重写此方法。\n\n```java\nstatic <M,I> RowFilter<M,I> numberFilter(RowFilter.ComparisonType\
  \ type, Number number, int... indices)\n```\n\n```java\nstatic <M,I> RowFilter<M,I>\
