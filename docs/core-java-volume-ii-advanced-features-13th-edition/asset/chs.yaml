  \ PostScript 文件。如果你没有在命令行上提供文件名，\n * 输出将将保存到 out.ps。   \n * @version 1.0 2018-06-01\n\
  \ * @author Cay Horstmann\n */\npublic class PrintServiceTest\n{\n   // 在处设置你的图像尺寸\n\
  \   private static int IMAGE_WIDTH = 300;\n   private static int IMAGE_HEIGHT =\
  \ 300;\n\n   public static void draw(Graphics2D g2) \n   {\n      // 在此处编写你的绘制指令\n\
  \      FontRenderContext context = g2.getFontRenderContext();\n      var f = new\
  \ Font(\"Serif\", Font.PLAIN, 72);\n      var clipShape = new GeneralPath();\n\n\
  \      var layout = new TextLayout(\"Hello\", f, context);\n      AffineTransform\
  \ transform = AffineTransform.getTranslateInstance(0, 72);\n      Shape outline\
  \ = layout.getOutline(transform);\n      clipShape.append(outline, false);\n\n \
  \     layout = new TextLayout(\"World\", f, context);\n      transform = AffineTransform.getTranslateInstance(0,\
  \ 144);\n      outline = layout.getOutline(transform);\n      clipShape.append(outline,\
  \ false);\n\n      g2.draw(clipShape);\n      g2.clip(clipShape);\n\n      final\
  \ int NLINES = 50;\n      var p = new Point2D.Double(0, 0);\n      for (int i =\
  \ 0; i < NLINES; i++)\n      {\n         double x = (2 * IMAGE_WIDTH * i) / NLINES;\n\
  \         double y = (2 * IMAGE_HEIGHT * (NLINES - 1 - i)) / NLINES;\n         var\
  \ q = new Point2D.Double(x, y);\n         g2.draw(new Line2D.Double(p, q));\n  \
  \    }     \n   }   \n\n   public static void main(String[] args) throws IOException,\
  \ PrintException\n   {\n      String fileName = args.length > 0 ? args[0] : \"out.ps\"\
