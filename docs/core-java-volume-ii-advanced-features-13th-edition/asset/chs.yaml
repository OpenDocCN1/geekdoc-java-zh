  \n### 12.5.6\\. Paint\n\n当填充形状时，其内部会被*填充*覆盖。使用 `setPaint` 方法将填充样式设置为实现 `Paint` 接口类的对象。Java\
  \ 2D API 提供了三个这样的类：\n\n\n\n\n\n*   `Color` 类实现了 `Paint` 接口。要用实色填充形状，只需调用 `setPaint`\
  \ 并传入一个 `Color` 对象即可，例如：\n\n```\ng2.setPaint(Color.red);\n```\n\n*   `GradientPaint`\
  \ 类通过在两个指定的颜色值之间进行插值来改变颜色（参见图 12.45）。\n\n![Figure](img/fig07-15.jpg)图 12.45: 渐变绘制\n\
  \n*   `TexturePaint` 类通过图像的重复来填充区域（参见图 12.46）。\n\n![Figure](img/fig07-16.jpg)图 12.46:\
  \ 纹理绘制\n\n你可以通过指定两个点以及在这两个点上所需的颜色来构造一个 `GradientPaint` 对象。\n\n```\ng2.setPaint(new\
  \ GradientPaint(p1, Color.RED, p2, Color.YELLOW));\n```\n\n颜色沿着连接两点的直线进行插值。在垂直于该连接线的线线上，颜色保持恒定。超出直线端点的点将赋予该端点的颜色。\n\
  \n或者，如果你在调用 `GradientPaint` 构造函数时将 `cyclic` 参数设置为 `true`：\n\n```\ng2.setPaint(new\
  \ GradientPaint(p1, Color.RED, p2, Color.YELLOW, true));\n```\n\n那么，颜色的变化将循环变化，并在端点之外继续变化。\n\
  \n要构造一个 `TexturePaint` 对象，需要指定一个 `BufferedImage` 和一个 `anchor`（锚点）矩形。\n\n```\ng2.setPaint(new\
  \ TexturePaint(bufferedImage, anchorRectangle));\n```\n\n我将在本章稍后详细讨论图像时再介绍 `BufferedImage`\
  \ 类。获取缓冲图像的最简单方法是读取图像文件：\n\n```\nbufferedImage = ImageIO.read(new File(\"blue-ball.gif\"\
  ));\n```\n\n锚点矩形在 `x` 和 `y` 方向上无限扩展，以平铺整个坐标平面。图像被缩放以适应锚点，然后复制到每个瓦格中。\n\n`java.awt.Graphics2D`\
  \ 1.2\n\n*   `void setPaint(Paint s)`\n\n将此图形上下文的绘制画设置为实现 `Paint` 接口的给定对象。\n\n`java.awt.GradientPaint`\
  \ 1.2\n\n*   `GradientPaint(float x1, float y1, Color color1, float x2, float y2,\
  \ Color color2)`\n*   `GradientPaint(float x1, float y1, Color color1, float x2,\
  \ float y2, Color color2, boolean cyclic)`\n*   `GradientPaint(Point2D p1, Color\
  \ color1, Point2D p2, Color color2)`\n*   `GradientPaint(Point2D p1, Color color1,\
  \ Point2D p2, Color color2, boolean cyclic)`\n\n构造一个渐变绘制对象，用于填充形状，使得起点颜色为 `color1`，终点颜色为\
  \ `color2`，且中间的颜色呈线性插值。在垂直于起点和终点连接线的线线上，颜色保持恒定。默认情况下，渐变绘制不是循环的——也就是说，起点和终点之外点的颜色与起点和终点的颜色相同。如果渐变绘制是循环的，则颜色将继续插值，首先返回到起点颜色，然后在两个方向上无限重复。\n\
  \n`java.awt.TexturePaint` 1.2\n\n*   `TexturePaint(BufferedImage texture, Rectangle2D\
  \ anchor)`\n\n创建一个纹理绘制对象。锚点矩形定义了要绘制空间的平铺方式；它在 `x` 和 `y` 方向上无限重复，纹理图像被缩放以填充每个瓦格。\n\
  \n### 12.5.7. 坐标变换\n\n假设你需要画一个对象，例如汽车。根据制造商的规格，你知道它的高度、轴距和总长度。当然，你可以假设每米有多少个像素，从而计算出所有的像素位置。然而，有一种更简单的方法：你可以请求图形上下文为你完成转换。\n\
  \n```\ng2.scale(pixelsPerMeter, pixelsPerMeter);\ng2.draw(new Line2D.Double(coordinates\
  \ in meters)); // 转换为像素并\n                                                   //\
  \ 绘制 后的线\n```\n\n`Graphics2D` 类的 `scale` 方法将图形上下文的坐标变换设置为缩放变换。该变换将 `user coordinates`（用户指定的单位）转换为\
  \ `device coordinates`（像素）。图 12.47 显示了该变换是如何工作的。\n\n![Figure](img/fig07-17.jpg)图\
  \ 12.47: 用户坐标和设备坐标\n\n坐标变换在实践中非常有用。它们允许你使用方便的坐标值进行工作。图形上下文负责将它们转换为像素的脏活。\n\n有四种基本的变换。\n\
  \n*   缩放（Scaling）：放大或缩小从固定点开始的所有距离\n*   旋转（Rotation）：绕过固定中心旋转所有点\n*   平移（Translation）：按固定量移动所有点\n\
  *   切变（Shear）：固定一条直线并“滑动”平行于该直线的直线\n\n图 12.48 显示了这些变换如何作用于单位正方形。\n\n![Figure](img/fig07-18.jpg)图\
  \ 12.48: 基本变换\n\n`java.awt.Graphics2D` 1.2\n\n`Graphics2D` 类的 `scale`、`rotate`、`translate`\
  \ 和 `shear` 方法将坐标变换设置为其中一种。\n\n你可以组合变换。例如，你可能想要旋转并双倍尺寸；只需提供：\n\n```\ng2.rotate(angle);\n\
  g2.scale(2);\n```\n\n在这种情况下，变换的顺序很重要。例如，考虑以下变换序列：\n\n```\ng2.translate(x, y);\n\
  g2.rotate(a);\ng2.translate(-x, -y);\n```\n\n最后一个变换（先执行）将点 (`x`, `y`) 移动到原点。第二个变换绕原点旋转角度\
  \ `a`。最后一个变换将原点移回 (`x`, `y`)。由于绕非原点旋转是一种常见操作，有一个快捷方法：\n\n```\ng2.rotate(a, x, y);\n\
  ```\n\n![Figure](img/fig07-19.jpg)图 12.49: 组合变换\n\n如果你了解矩阵理论，你可能知道所有的旋转、平移、缩放、切变及其组合都可以由如下形式的矩阵表示：\n\
  \n$\\begin{bmatrix} x_{\\text{new}} \\\\ y_{\\text{new}} \\\\ 1 \\end{bmatrix} =\
  \ \\begin{bmatrix} a & c & e \\\\ b & d & f \\\\ 0 & 0 & 1 \\end{bmatrix} \\cdot\
  \ \\begin{bmatrix} x \\\\ y \\\\ 1 \\end{bmatrix}$\n\n这种变换被称为仿变换。在 Java 2D API 中，`AffineTransform`\
  \ 类描述了这种变换。如果你知道特定变换矩阵的分量，可以直接构造它：\n\n```\nvar t = new AffineTransform(a, b, c,\
  \ d, e, f);\n```\n\n此外，工厂方法 `getRotateInstance`、`getScaleInstance`、`getTranslateInstance`\
  \ 和 `getShearInstance` 构造这些变换类型的矩阵。例如，调用\n\n```\nt = AffineTransform.getScaleInstance(2.0F,\
  \ 0.5F);\n```\n\n返回一个对应于矩阵\n\n$\\begin{bmatrix} 2 & 0 & 0 \\\\ 0 & 0.5 & 0 \\\\\
  \ 0 & 0 & 1 \\end{bmatrix}$ 的变换。\n\n最后，实例方法 `setToRotation`、`setToScale`、`setToTranslation`\
  \ 和 `setToShear` 将变换对象设置为新类型。这里有一个示例：\n\n\n\n\n\n```\nt.setToRotation(angle); //\
  \ 将 t 设置为旋转\n```\n\n你可以将图形上下文的坐标变换设置为一个 `AffineTransform` 对象。\n\n```\ng2.setTransform(t);\
  \ // 替换当前变换\n```\n\n然而，在实践中，你不应该调用 `setTransform` 操作，因为它会替换图形上下文可能具有任何现有变换。例如，用于横向模式打印的图形上下文已经包含了一个\
  \ 90 度的旋转变换。如果你调用 `setTransform`，你就会抹掉该旋转。相反，请调用 `transform` 方法。\n\n```\ng2.transform(t);\
  \ // 将当前变换与 t 组合\n```\n\n它将现有的变换与新的 `AffineTransform` 对象组合。\n\n如果你只想临时应用某种变换，请先获取旧变换，将其与你的新变换组合，最后在完成后恢复旧变换。\n\
  \n```\nAffineTransform oldTransform = g2.getTransform(); // 保存旧变换\ng2.transform(t);\
  \ // 应用临时变换 \n在 g2 上绘制\ng2.setTransform(oldTransform); // 恢复旧变换\n```\n\n### java.awt.geom.AffineTransform\
  \ 1.2\n\n*   `AffineTransform(double a, double b, double c, double d, double e,\
  \ double f)`\n*   `AffineTransform(float a, float b, float c, float d, float e,\
  \ float f)`\n    使用矩阵构造仿变换\n    $\\begin{bmatrix} a & c & e \\\\ b & d & f \\\\\
  \ 0 & 0 & 1 \\end{bmatrix}$\n*   `AffineTransform(double[] m)`\n*   `AffineTransform(float[]\
  \ m)`\n    使用矩阵构造仿变换\n    $\\begin{bmatrix} \\mathtt{\\text{m[0]}} & \\mathtt{\\\
  text{m[2]}} & \\mathtt{\\text{m[4]}} \\\\ \\mathtt{\\text{m[1]}} & \\mathtt{\\text{m[3]}}\
  \ & \\mathtt{\\text{m[5]}} \\\\ 0 & 0 & 1 \\end{bmatrix}$\n*   `static AffineTransform\
  \ getRotateInstance(double a)`\n    围绕原点按角度 `a`（弧度）创建旋转。变换矩阵为\n    $\\begin{bmatrix}\
  \ {\\cos(a)} & {- {\\sin(a)}} & 0 \\\\ {\\sin(a)} & {\\cos(a)} & 0 \\\\ 0 & 0 &\
  \ 1 \\end{bmatrix}$\n    如果 `a` 在 0 和 π / 2 之间，旋转将使正 `x` 轴向正 `y` 轴移动。\n*   `static\
  \ AffineTransform getRotateInstance(double a, double x, double y)`\n    围绕点 `(x,y)`\
  \ 按角度 `a`（弧度）创建旋转。\n*   `static AffineTransform getScaleInstance(double sx, double\
  \ sy)`\n    创建一个缩放变换，将 `x` 轴缩放为 `sx`，将 `y` 轴缩放为 `sy`。变换矩阵为\n    $\\begin{bmatrix}\
  \ {sx} & 0 & 0 \\\\ 0 & {sy} & 0 \\\\ 0 & 0 & 1 \\end{bmatrix}$\n*   `static AffineTransform\
  \ getShearInstance(double shx, double shy)`\n    创建一个剪切变换，将 `x` 轴剪切 `shx`，将 `y`\
  \ 轴剪切 `shy`。变换矩阵为\n    $\\begin{bmatrix} 1 & {shx} & 0 \\\\ {shy} & 1 & 0 \\\\ 0\
  \ & 0 & 1 \\end{bmatrix}$\n*   `static AffineTransform getTranslateInstance(double\
  \ tx, double ty)`\n    创建一个平移，将 `x` 轴移动 `tx`，将 `y` 轴移动 `ty`。变换矩阵为\n    $\\begin{bmatrix}\
  \ 1 & 0 & {tx} \\\\ 0 & 1 & {ty} \\\\ 0 & 0 & 1 \\end{bmatrix}$\n*   `void setToRotation(double\
  \ a)`\n*   `void setToRotation(double a, double x, double y)`\n*   `void setToScale(double\
  \ sx, double sy)`\n*   `void setToShear(double sx, double sy)`\n*   `void setToTranslation(double\
  \ tx, double ty)`\n    将此仿变换设置为带有给定参数的基本变换。请参见 `getXxxInstance` 方法以获取基本变换及其参数的解释。\n\
  \n### java.awt.Graphics2D 1.2\n\n*   `void setTransform(AffineTransform t)`\n  \
  \  将此图形上下文的现有坐标变换替换为 `t`。\n*   `void transform(AffineTransform t)`\n    将此图形上下文的现有坐标变换与\
  \ `t` 组合。\n*   `void rotate(double a)`\n*   `void rotate(double a, double x, double\
  \ y)`\n*   `void scale(double sx, double sy)`\n*   `void shear(double sx, double\
  \ sy)`\n*   `void translate(double tx, double ty)`\n    将此图形上下文的现有坐标变换与带有给定参数的基本变换组合。请参见\
  \ `AffineTransform.getXxxInstance` 方法以获取基本变换及其参数的解释。\n\n### 12.5.8. Clipping\n\n\
  通过在图形文中设置裁剪形状，你可以将所有绘制操作限制在该裁剪形状的内部。\n\n\n\n\n\n*   `float getDescent()`\n    返回此文本布局在基线以上和以下的高度度。\n\
  *   `float getLeading()`\n    返回此文本布局所使用的字体中相邻行之间的距离。\n\n### 12.5.9 透明度与合成\n\n在标准的\
  \ RGB 颜色模型中，每种颜色都通过其红、绿、蓝分量来描述。然而，描述图像中 `transparent`（透明）或部分透明的区域也非常方便。当你将一个图像叠加到现有的图形上时，透明像素完全不会遮挡其下方的像素，而部分透明像素会与它们下方的像素混合。图\
  \ 12.51 展现了在图像上叠加一个半透明矩形的效果。你仍然能看到图像的细节从矩形下方透出来。\n\n![Figure](img/fig07-21.jpg)图\
  \ 12.51：在图像上叠加半透明矩形\n\n在 Java 2D API 中，透明度是通过 `alpha channel`（alpha 通道）描述的。每个像素除了红、绿、蓝颜色分量外，还有一个介于\
  \ 0（完全透明）和 1（完全不透明）之间的 alpha 值。例如，图 12.51 中的矩形是用具有 50% 透明度的淡黄色填充的：\n\n```\nnew Color(0.7F,\
  \ 0.7F, 0.0F, 0.5F);\n```\n\n现在让我们来看看如果叠加两个形状会发生什么。你需要对源像素和目标像素的颜色及 alpha 值进行混合或\
  \ `compose`（合成）。Porter 和 Duff 是计算机图形领域的两位研究人员，他们为这种混合过程制定了 12 种可能的 `composition\
  \ rules`（合成规则）。Java 2D API 实现了所有这些规则。在继续之前，我想指出，这些规则中只有两个具有实际意义。如果你觉得这些规则很深奥或令人困惑，只需使用\
  \ `SRC_OVER` 规则即可。它是 `Graphics2D` 对象的默认规则，并提供最直观的结果。\n\n这里是规则背后的理论。假设你有一个 alpha\
  \ 值为 `a[S]` 的 `source pixel`（源像素）。在图像中已经有一个 alpha 值为 `a[D]` 的 `destination pixel`（目标像素）。你想合成这两个像素。图\
  \ 12.52 中的图表显示了如何设计合成规则。\n\n![Figure](img/fig07-22.jpg)图 12.52：设计合成规则\n\nPorter\
  \ 和 Duff 将 alpha 值视为使用像素颜色的概率。从源的角度来看，有 `a[S]` 的概率想要使用源颜色，有 1 – `a[S]` 的概率表示不在乎。目标也是如此。在合成颜色时，我们假设这些概率是独立的。那么就有如图\
  \ 12.52 所示的四种情况。如果源想要使用源颜色而目标不在乎，那么让源按照它的意愿行似乎是合理的。这就是为什么图表的右上角标记为“S”的原因。该事件的概率为\
  \ `a[S]` · (1 – `a[D]`)。同样，左下角标记为“D”。如果目标和源都想选择自己的颜色，该怎么办？这就是 Porter–Duff 规则派上用场。如果我们认为源更重要，我们也在右下角标记为“S”。该规则被称为\
  \ `SRC_OVER`。在该规则中，你以 `a[S]` 的权重组合源颜色，以 (1 – `a[S]`) · `a[D]` 的权重组合目标颜色。\n\n视觉效果是源和目标的混合，并优先考虑源。特别是，如果\
  \ `a[S]` 为 1，则完全不考虑目标颜色。如果 `a[S]` 为 0，则源像素是完全透明的，目标颜色保持不变。\n\n其他规则取决于你在概率图的方框中放入什么字母。表\
  \ 12.3 和图 12.53 显示了 Java 2D API 支持的所有规则。图图像显示了当 alpha 为 0.75 的矩形源区域与 alpha 为 1.0\
  \ 的椭圆目标区域组合时，这些规则的结果。\n\n表 12.3：Porter–Duff 合成规则\n\n| 规则 | 解释 |\n| --- | --- |\n\
  | `CLEAR` | 源清除目标。 |\n| `SRC` | 源覆盖目标和空像素。 |\n| `DST` | 源不影响目标。 |\n| `SRC_OVER`\
  \ | 源与目标混合并覆盖空像素。 |\n| `DST_OVER` | 源不影响目标并覆盖空像素。 |\n| `SRC_IN` | 源覆盖目标。 |\n| `SRC_OUT`\
  \ | 源清除目标。 |\n| `DST_IN` | 源覆盖目标。 |\n| `DST_OUT` | 源不影响目标。 |\n| `SRC_ATOP` | 源与目标混合。\
  \ |\n| `DST_ATOP` | 源不影响目标。 |\n| `XOR` | 源异或目标。 |\n\n![Figure](img/fig07-23.jpg)图\
  \ 12.53：Porter–Duff 合成规则\n\n正如你看到的，大多数规则并不有用。考虑一种极端情况，`DST_IN` 规则。它完全不考虑源颜色，但使用源的\
  \ alpha 来影响目标。`SRC` 规则是有用的——它强制使用源颜色。\n\n使用 `Graphics2D` 类的 `setComposite` 方法安装实现\
  \ `Composite` 接口的对象。Java 2D API 提供了这样一个类 `AlphaComposite`，它实现了 Porter–Duff 规则。`AlphaComposite`\
  \ 类的工厂方法 `getInstance` 返回一个 `AlphaComposite` 对象。你提供规则和用于源像素的 alpha 值。例如，考虑以下代码：\n\
  \n```\nint rule = AlphaComposite.SRC_OVER;\nfloat alpha = 0.5f;\ng2.setComposite(AlphaComposite.getInstance(rule,\
  \ alpha));\ng2.setPaint(Color.blue);\ng2.fill(rectangle);\n```\n\n然后矩形以 0.5 的透明度填充。由于合成规则是\
  \ `SRC_OVER`，它被透明地叠加在现有图像上。\n\n 列表 12.17 中的程序让你探索这些合成规则。从组合框中选择一个规则并使用滑动块设置 `AlphaComposite`\
  \ 对象的 alpha 值。\n\n此外，程序显示了每个规则的口头描述。注意这些描述是从合成规则图中计算出的。例如，第二行的 `\"DS\"` 代表“与目标混合”。\n\
  \n\n\n\n\nListing 12.17 显示了框架类。组件类位于 Listing 12.18 中。Listing 12.19 中的 `Rule` 类为每种规则提供了简要解释——参见\
  \ Figure 12.54 。当你运行程序时，将 alpha 透明度滑块从左向右移动，观察对组合形状的影响。特别注意，`DST_IN` 和 `DST_OUT`\
  \ 规则之间的唯一区别在于当你更改源透明度时，目标（`!)` 颜色的变化方式。\n\n![Figure](img/fig07-24.jpg)图 12.54：`CompositeTest`\
