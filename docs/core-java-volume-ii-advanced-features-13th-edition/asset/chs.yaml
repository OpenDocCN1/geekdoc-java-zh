  \n## 10.4 事件处理\n\n任何支持 GUI 的操作系统环境都会持续监控按键输入或鼠标点击等事件。这些事件随后会被报告给运行中的程序。然后，每个程序都会决定对这些事件做出什么反应（如果有反应的话）。\n\
  \n### 10.4.1 基本事件处理概念\n\n在 Java AWT 中，`event sources`（事件源，如按钮或滚动条）拥有允许你注册 `event\
  \ listeners`（执行所需响应的对象）的方法。\n\n当事件监听器被通知某个事件时，事件信息会被封装在 `event object`（事件对象）中。在\
  \ Java 中，所有事件对象最终都派自 `java.util.EventObject` 类。当然，每种类型的事件都有相应的子类，例如 `ActionEvent`\
  \ 和 `WindowEvent`。\n\n不同的事件源可以产生不同类型的事件。例如，按钮可以发送 `ActionEvent` 对象，而窗口可以发送 `WindowEvent`\
  \ 对象。\n\n总结一下，这里是 AWT 事件处理工作原理的概述：\n\n* 事件监听器是实现 `listener interface`（监听器接口）的类的实例。\n\
  * 事件源是一个可以注册监听器对象并向它们发送事件对象的。\n* 当事件发生时，事件源向所有注册的监听器发送事件对象。\n* 监听器对象使用事件对象中的信息来确定它们对事件的反应。\n\
  \nFigure 10.12 显示了事件处理类与接口之间的关系。\n\n![Figure](img/08_01.jpg)图 10.12: 事件源与监听器的关系\n\
  \n以下是一个指定监听器的示例：\n\n```\nActionListener listener = . . .;\nvar button = new JButton(\"\
  OK\");\nbutton.addActionListener(listener);\n```\n\n现在，每当按钮发生“动作事件”时，`listener`\
  \ 对象就会被通知。对于按钮来说，正如你预期的那样，动作事件就是按钮点击。\n\n要实现 `ActionListener` 接口，监听器类必须有一个名为 `actionPerformed`\
  \ 的方法，该方法接收一个 `ActionEvent` 对象作为参数。\n\n```\nclass MyListener implements ActionListener\n\
  {\n   . . .\n   public void actionPerformed(ActionEvent event)\n   {\n      // 对按钮点击的响应写在这里\n\
  \      . . .\n   }\n}\n```\n\n每当用户点击按钮时，`JButton` 对象创建一个 `ActionEvent` 对象并调用 `listener.actionPerformed(event)`，传递该事件对象。像按钮这样的事件源可以有多个监听器。在这种情况下，每当用户点击按钮时，按钮都会调用所有监听器的\
  \ `actionPerformed` 方法。\n\nFigure 10.13 显示了事件源、事件监听器和事件对象之间的交互。\n\n![Figure](img/08_02.jpg)图\
  \ 10.13: 事件通知\n\n### 10.4.2 示例：处理按钮点击\n\n为了熟悉事件委托模型，让我们来详细介绍一下响应按钮点击这一简单示例所需的所有细节。在这个示例中，我们将显示一个包含三个按钮的面板（panel）。三个监听器对象被作为动作监听器添加到按钮上。\n\
  \n在这一场景下，用户每当点击面板上的任何一个按钮时，相关的监听器对象都会接收到一个指示按钮点击的 `ActionEvent`。在我们的示例程序中，监听器对象将更改面板的背景颜色。\n\
  \n在向你展示监听按钮点击的程序之前，我需要解释如何创建按钮以及如何将它们添加到面板中。\n\n要创建一个按钮，请在按钮构造函数中指定标签字符串、图标或两者两者。这里有两个示例：\n\
  \n```\nvar yellowButton = new JButton(\"Yellow\");\nvar blueButton = new JButton(new\
  \ ImageIcon(\"blue-ball.gif\"));\n```\n\n调用 `add` 方法将按钮添加到面板中：\n\n```\nvar yellowButton\
  \ = new JButton(\"Yellow\");\nvar blueButton = new JButton(\"Blue\");\nvar redButton\
  \ = new JButton(\"Red\");\n\nbuttonPanel.add(yellowButton);\nbuttonPanel.add(blueButton);\n\
  buttonPanel.add(redButton);\n```\n\nFigure 10.14 显示了结果。\n\n![Figure](img/buttontest1.jpg)图\
  \ 10.14: 填充了按钮的面板\n\n接下来，我们需要添加监听这些按钮的代码。这需要实现 `ActionListener` 接口的类，正如我刚刚提到的，它有一个方法：`actionPerformed`，其签名如下：\n\
  \n```\npublic void actionPerformed(ActionEvent event)\n```\n\n使用 `ActionListener`\
  \ 接口的方法在所有情况下都是相同的：`actionPerformed` 方法（它是 `ActionListener` 中唯一的方法）接收一个 `ActionEvent`\
  \ 类型的对象作为参数。这个事件对象为你提供了关于所发生事件的信息。\n\n当按钮被点击时，我们希望面板的背景颜色变为某种特定的颜色。我们将所需的颜色存储在我们的监听器类中。\n\
  \n```\nclass ColorAction implements ActionListener\n{\n   private Color backgroundColor;\n\
  \n   public ColorAction(Color c)\n   {\n      backgroundColor = c;\n   }\n\n   public\
  \ void actionPerformed(ActionEvent event)\n   {\n      // 设置背景颜色\n      . . .\n\
  \   }\n}\n```\n\n然后我们为每种颜色构造一个对象，并将对象设置为按钮的监听器。\n\n```\nvar yellowAction = new ColorAction(Color.YELLOW);\n\
  var blueAction = new ColorAction(Color.BLUE);\nvar redAction = new ColorAction(Color.RED);\n\
  \nyellowButton.addActionListener(yellowAction);\nblueButton.addActionListener(blueAction);\n\
  redButton.addActionListener(redAction);\n```\n\n例如，如果用户点击标记为“Yellow”的按钮，`yellowAction`\
  \ 对象的 `actionPerformed` 方法就会被调用。它的 `backgroundColor` 实例字段被设置为 `Color.YELLOW`，现在它可以继续设置面板的背景颜色了。\n\
  \n还剩下一个问题。`ColorAction` 对象无法访问 `buttonPanel` 变量。你可以通过两种方式解决这个问题。你可以将面板存储在 `ColorAction`\
  \ 对象中，并在 `ColorAction` 构造函数中设置它。或者更方便地，可以将 `ColorAction` 变成 `ButtonFrame` 类的内部类。这样它的方法就可以自动访问外部面板。\n\
  \nListing 10.6 包含了完整的框架类。每当你点击其中一个按钮时，相应的动作监听器就会更改面板的背景颜色。\n\nListing 10.6 button/ButtonFrame.java\n\
  \n\n\n\n\n```java\npackage button;\n\nimport java.awt.*;\nimport java.awt.event.*;\n\
  import javax.swing.*;\n\n/**\n * 一个带有按钮面板的框架。\n */\npublic class ButtonFrame extends\
  \ JFrame\n{\n   private JPanel buttonPanel;\n   private static final int DEFAULT_WIDTH\
  \ = 300;\n   private static final int DEFAULT_HEIGHT = 200;\n\n   public ButtonFrame()\n\
  \   {      \n      setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\n      // 创建按钮\n  \
  \    var yellowButton = new JButton(\"Yellow\");\n      var blueButton = new JButton(\"\
  Blue\");\n      var redButton = new JButton(\"Red\");\n\n      buttonPanel = new\
  \ JPanel();\n\n      // 将按钮添加到面板\n      buttonPanel.add(yellowButton);\n      buttonPanel.add(blueButton);\n\
  \      buttonPanel.add(redButton);\n\n      // 将面板添加到框架\n      add(buttonPanel);\n\
  \n      // 创建按钮动作\n      var yellowAction = new ColorAction(Color.YELLOW);\n   \
  \   var blueAction = new ColorAction(Color.BLUE);\n      var redAction = new ColorAction(Color.RED);\n\
  \n      // 将动作与按钮关联\n      yellowButton.addActionListener(yellowAction);\n     \
  \ blueButton.addActionListener(blueAction);\n      redButton.addActionListener(redAction);\n\
  \   }\n\n   /**\n    * 设置面板背景颜色的动作监听器。\n    */\n   private class ColorAction implements\
  \ ActionListener\n   {\n      private Color backgroundColor;\n\n      public ColorAction(Color\
  \ c)\n      {\n         backgroundColor = c;\n      }\n\n      public void actionPerformed(ActionEvent\
  \ event)\n      {\n         buttonPanel.setBackground(backgroundColor);\n      }\n\
  \   }\n}\n```\n\n`javax.swing.JButton` 1.2\n\n* `JButton(String label)`\n* `JButton(Icon\
  \ icon)`\n* `JButton(String label, Icon icon)`\n  构造一个按钮。标签字符串可以是纯文本或 HTML；例如，`\"\
  <html><b>Ok</b></html>`。\n\n`java.awt.Container` 1.0\n\n* `Component add(Component\
  \ c)`\n  将组件 `c` 添加到此容器。\n\n### 10.4.3. 简洁地指定监听器\n\n在前面的节中，我们为事件监听器定义了一个类，并构造了该类的三个对象。监听器类拥有多个实例的情况并不常见。最常见的情况是每个监听器执行一个独立的动作。在这种情况下，没有必要单独创建一个类。只需使用\
  \ lambda 表达式即可：\n\n```\nexitButton.addActionListener(event -> System.exit(0));\n\
  ```\n\n现在考虑我们有多个相关动作的情况，例如上一节中的颜色按钮。在这种情况下，实现一个辅助方法：\n\n```java\npublic void makeButton(String\
  \ name, Color backgroundColor)\n{\n   var button = new JButton(name);\n   buttonPanel.add(button);\n\
  \   button.addActionListener(event ->\n      buttonPanel.setBackground(backgroundColor));\n\
  }\n```\n\n注意，lambda 表达式引用了参数变量 `backgroundColor`。\n\n然后我们只需调用\n\n```\nmakeButton(\"\
  yellow\", Color.YELLOW);\nmakeButton(\"blue\", Color.BLUE);\nmakeButton(\"red\"\
  , Color.RED);\n```\n\n在这里，我们构造了三个监听器对象，每个颜色对应一个，而没有显式地定义类。每调用一次辅助方法，它就会创建一个实现 `ActionListener`\
  \ 接口的类的实例。它的 `actionPerformed` 动作引用了 `backgroundColor` 值，而该值实际上存储在监听器对象中。然而，这一切发生时不需要你显式地定义监听器类、实例变量或设置它们的构造函数。\n\
  \n在旧代码中，你经常会看到匿名类的使用：\n\n```\nexitButton.addActionListener(new ActionListener()\n\
  \   {\n      public void actionPerformed(new ActionEvent)\n      {\n         System.exit(0);\n\
  \      }\n   });\n```\n\n当然，这种相当冗长的代码不再需要了。使用 lambda 表达式更加简单清晰。\n\n### 10.4.4. 适配器类\n\
  \n并不是所有事件都像按钮点击那样容易处理。假设你想监控用户何时关闭主框架，以便弹出一个对话框，并仅在用户同意时退出程序。\n\n当用户尝试关闭窗口时，`JFrame`\
  \ 对象是 `WindowEvent` 的源。如果你想捕获该事件，必须有一个适当的监听器对象并将其添加到框架的窗口监听器列表中。\n\n```\nWindowListener\
  \ listener = . . .;\nframe.addWindowListener(listener);\n```\n\n窗口监听器必须是实现 `WindowListener`\
  \ 接口的类的对象。`WindowListener` 接口中实际上有七个方法。框架调用这些方法作为对窗口可能发生的七种不同事件的响应。这些名称是自言易懂的，但在\
  \ Windows 下，“iconified”（图标化）通常被称为“minimized”（最小化）。以下是完整的 `WindowListener` 接口：\n\n\
  ```\npublic interface WindowListener\n{\n   void windowOpened(WindowEvent e);\n\
  \   void windowClosing(WindowEvent e);\n   void windowClosed(WindowEvent e);\n \
  \  void windowIconified(WindowEvent e);\n   void windowDeiconified(WindowEvent e);\n\
  \   void windowActivated(WindowEvent e);\n   void windowDeactivated(WindowEvent\
  \ e);\n}\n```\n\n当然，我们可以定义实现该接口的类，在 `windowClosing` 方法中添加 `System.exit(0)`，并其他六个方法编写空函数。然而，为六个为空的方法编写代码是无意义的工作。为了简化这项任务，每个包含多个方法的\
  \ `WindowListener` 接口都带有一个适配器类。例如，`WindowAdapter` 类拥有七个空方法。以下是我们如何定义一个重写了 `windowClosing`\
  \ 方法的窗口监听器：\n\n```java\nclass Terminator extends WindowAdapter\n{\n   public void\
  \ windowClosing(WindowEvent e)\n   {\n      if (user agrees)\n         System.exit(0);\n\
  \   }\n}\n```\n\n现在你可以注册一个 `Terminator` 类型的对象作为事件监听器：\n\n```\nvar listener = new\
  \ Terminator();\nframe.addWindowListener(listener);\n```\n\n现如今，人们会将 `WindowListener`\
  \ 接口的空方法实现为默认方法。然而，Swing 是在默认方法出现很多年就已经发明的。\n\n`java.awt.event.WindowListener` 1.1\n\
  \n* `windowOpened(WindowEvent e)`\n  在窗口打开后调用。\n* `windowClosing(WindowEvent e)`\n\
  \  当用户向窗口管理器发出关闭窗口命令时调用。注意，只有当调用了 `hide` 或 `dispose` 方法时窗口才会关闭。\n* `windowClosed(WindowEvent\
  \ e)`\n  在窗口关闭后调用。\n* `windowIconified(WindowEvent e)`\n  在窗口图标化后调用。\n* `windowDeiconified(WindowEvent\
  \ e)`\n  在窗口取消图标化后调用。\n* `windowActivated(WindowEvent e)`\n  在窗口激活后调用。只有框架或对话框可以是激活的。通常，窗口管理器会装饰激活窗口——例如通过高亮标题栏。\n\
  * `windowDeactivated(WindowEvent e)`\n  在窗口取消激活后调用。\n\n`java.awt.event.WindowStateListener`\
  \ 1.4\n\n* `windowStateChanged(WindowEvent event)`\n  在窗口被最大化、图标化或恢复到正常大小后调用。\n\n\
  ### 10.4.5. Actions\n\n通过多种方式激活同一个命令是常见的。用户可以通过菜单、按键或工具栏上的按钮来选择某个功能。这在 AWT 事件模型中很容易实现：将所有事件链接到同一个监听器。例如，假设\
  \ `blueAction` 是一个动作监听器，其 `actionPerformed` 方法将背景颜色变为蓝色。你可以将同一个对象作为监听器附加到多个事件源：\n\
  \n\n\n\n\n*   标记为“Blue”（蓝色）的工具栏按钮\n*   标记为“Blue”（蓝色）的菜单项\n*   按键组合 `Ctrl+B`\n\n\
  颜色更改命令现在将以统一的方式处理，无论它是由按钮点击、菜单选择还是按键按下引起的。\n\n`Swing` 程序包提供了一个非常有用的机制来封装命令并将其附加到多个事件源上：`Action`\
  \ 接口。一个 `action` 是一个封装了以下内容的对象：\n\n*   命令的描述（作为文本字符串和可选图标）；以及\n*   执行该命令必需的参数（例如我们示例中请求的颜色）。\n\
  \n`Action` 接口具有以下方法：\n\n```\nvoid actionPerformed(ActionEvent event)\nvoid setEnabled(boolean\
  \ b)\nboolean isEnabled()\nvoid putValue(String key, Object value)\nObject getValue(String\
  \ key)\nvoid addPropertyChangeListener(PropertyChangeListener listener)\nvoid removePropertyChangeListener(PropertyChangeListener\
  \ listener)\n```\n\n第一个方法是 `ActionListener` 接口中熟悉的方法；事实上，`Action` 接口扩展了 `ActionListener`\
  \ 接口。因此，每当需要 `ActionListener` 对象的地方，你都可以使用 `Action` 对象。\n\n接下来两个方法允许你启用或禁用 action，并检查\
  \ action 当前是否已启用。当 action 被附加到菜单或工具栏上且该 action 被禁用时，该选项将变为灰色。\n\n`putValue` 和 `getValue`\
  \ 方法允许你在 action 对象中存储和检索任意的名称/值对。两个重要的预定义字符串，即 `Action.NAME` 和 `Action.SMALL_ICON`，将\
  \ action 名称和图标存储到 action 对象中：\n\n```\naction.putValue(Action.NAME, \"Blue\");\n\
  action.putValue(Action.SMALL_ICON, new ImageIcon(\"blue-ball.gif\"));\n```\n\n表\
  \ 10.1 显示了所有预定义的 action 表名。\n\n表 10.1：预定义的 action 表名\n\n| 名称 (Name) | 值 (Value)\
  \ |\n| --- | --- |\n| `NAME` | action 的名称，显示在按钮和菜单项上。 |\n| `SMALL_ICON` | 用于存储小图标的地方，以便在按钮、菜单项或工具栏中显示。\
  \ |\n| `SHORT_DESCRIPTION` | 图标的短描述，显示在工具提示（tooltip）中。 |\n| `LONG_DESCRIPTION` |\
  \ 图标的详细描述，可能用于在线帮助。没有 Swing 组件使用此值。 |\n| `MNEMONIC_KEY` | 用于在菜单项中显示的助记缩写。 |\n| `ACCELERATOR_KEY`\
  \ | 用于存储快捷键组合的地方。没有 Swing 组件使用此值。 |\n| `ACTION_COMMAND_KEY` | 历史上，曾用于已废弃的 `registerKeyboardAction`\
  \ 方法。 |\n| `DEFAULT` | 潜在的通用的捕获属性。没有 Swing 组件使用此值。 |\n\n如果将 action 对象添加到菜单或工具栏中，其名称和图标将被自动检索并显示在菜单项或工具栏按钮中。`SHORT_DESCRIPTION`\
  \ 值将变为工具提示。\n\n`Action` 接口的最后两个方法允许其他对象（特别是触发该 action 的菜单或工具栏）在 action 对象的属性发生时接收通知。例如，如果一个菜单作为\
  \ action 对象的属性更改监听器，并且该 action 对象随后被禁用，则菜单会被调用并将 action 名称设为灰色。\n\n注意 `Action` 是一个\
  \ `interface`，而不是一个类。任何实现此接口的类必须实现我们刚刚讨论的七个方法。幸运的是，一位心人提供了一个 `AbstractAction` 类，它实现了除\
  \ `actionPerformed` 之外的所有方法。该类负责存储所有的名称/值对并管理属性更改监听器。你只需要扩展 `AbstractAction` 并提供一个\
  \ `actionPerformed` 方法即可。\n\n让我们构建一个可以执行颜色更改命令的 action 对象。我们存储命令的名称、图标和所需的颜色。我们将颜色存储在\
  \ `AbstractAction` 类提供的名称/值对表中。以下是 `ColorAction` 类的代码。构造函数设置了名称/值对，`actionPerformed`\
  \ 方法执行颜色更改动作。\n\n```\npublic class ColorAction extends AbstractAction\n{\n   public\
  \ ColorAction(String name, Icon icon, Color c)\n   {\n      putValue(Action.NAME,\
  \ name);\n      putValue(Action.SMALL_ICON, icon);\n      putValue(\"color\", c);\n\
  \      putValue(Action.SHORT_DESCRIPTION, \"Set panel color to \" + name.toLowerCase());\n\
  \   }\n\n   public void actionPerformed(ActionEvent event)\n   {\n      Color c\
  \ = (Color) getValue(\"color\");\n      buttonPanel.setBackground(c);\n   }\n}\n\
  ```\n\n我们的测试程序创建了该类的三个对象，例如：\n\n```\nvar blueAction = new ColorAction(\"Blue\",\
  \ new ImageIcon(\"blue-ball.gif\"), Color.BLUE);\n```\n\n接下来，将此 action 与按钮关联。这很容易，因为我们可以使用一个接收\
  \ `Action` 对象的 `JButton` 构造函数。\n\n```\nvar blueButton = new JButton(blueAction);\n\
  ```\n\n该构造函数从 action 中读取名称和图标，将短描述设置为工具提示，并将 action 设为监听器。你可以在 图 10.15 中看到图标和工具提示。\n\
  \n正如下一章所示，将相同的 action 添加到菜单同样简单。\n\n![图](img/action.jpg)图 10.15：按钮显示 action 的图标。\n\
  \n最后，我们希望将 action 对象添加到快捷键中，以便在用户输入命令时触发 action。要将 action 与快捷键关联，你首先需要生成 `KeyStroke`\
  \ 对象。这个类封装了按键的描述。要生成 `KeyStroke` 对象，不要调用构造函数，而是使用 `KeyStroke` 的静态 `getKeyStroke`\
  \ 方法。\n\n```\nKeyStroke ctrlB = KeyStroke.getKeyStroke(\"ctrl B\");\n```\n\n为了理解下一步，你需要理解焦点的概念。用户界面有很多按钮、菜单、滚动条和其他组件。当你按下键时，它会被发送给获得\
  \ own 组件。该组件通常（并非总是）会有视觉区分。例如，在 Java 外观中，获得焦点的按钮周围有一个细矩形框。你可以使用 Tab 键在组件之间移动焦点。当你按下空格键时，选中的按钮会被点击。其他键执行不同的操作；例如，箭头键可以移动滚动条。\n\
  \n然而，在我们情况下，我们不希望将快捷键发送给获得 own 组件。否则，每个按钮都必须知道如何处理 Ctrl+Y、Ctrl+B 和 Ctrl+R 键。\n\n\
  \n\n\n\n### 3. 在具有输入焦点的窗口中，查看所有`visible`可见）且`enabled`(可用）的组件，这些组件在 `WHEN_IN_FOCUSED_WINDOW`\
  \ 映射中注册了此按键。赋予这些组件（按照按键注册的顺序）执行相应操作的机会。一旦执行了第一个启用的操作，立即停止处理。\n\n要从组件获取输入映射，请使用 `getInputMap`\
  \ 方法。以下是一个示例：\n\n```\nInputMap imap = panel.getInputMap(JComponent.WHEN_FOCUSED);\n\
  ```\n\n`WHEN_FOCUSED` 条件意味着当当前组件拥有键盘焦点时，会查询此映射。在我们的情况下，这并不是我们想要的映射。拥有输入焦点的是按钮之一，而不是面板。对于插入颜色改变按键，另外两个映射选择中的任何一个都可以。在我们的示例程序中，我们使用了\
  \ `WHEN_ANCESTOR_OF_FOCUSED_COMPONENT`。\n\n`InputMap` 并不直接将 `KeyStroke` 对象映射到 `Action`\
  \ 对象。相反，它映射到任意对象，而由 `ActionMap` 类实现的第二个映射则将对象映射到操作。这使得更容易在来自不同输入映射的按键之间共享相同的操作。\n\
  \n因此，每个组件有三个输入映射和一个操作映射。为了将它们连接起来，你需要为这些操作命名。以下是你可以将按键绑定到操作的方法：\n\n```\nimap.put(KeyStroke.getKeyStroke(\"\
  ctrl Y\"), \"panel.yellow\");\nActionMap amap = panel.getActionMap();\namap.put(\"\
  panel.yellow\", yellowAction);\n```\n\n通常习惯使用字符串 `\"none\"` 作为什么都不做的操作。这可以很容易地禁用一个按键：\n\
  \n```\nimap.put(KeyStroke.getKeyStroke(\"ctrl C\"), \"none\");\n```\n\nJDK 文档建议使用操作名称作为操作的键。我不认为这是一个好主意。操作名称显示在按钮和菜单项上；因此，它可能会根据\
  \ UI 设计师的意愿改变，并被翻译成多种语言。这种不稳定的字符串是查找键的糟糕选择，因此我建议你想出与显示名称无关的操作名称。\n\n总结一下，以下是为响应按钮、菜单项或按键执行相同操作的步骤：\n\
  \n1. 实现一个继承自 `AbstractAction` 类的类。你可能可以使用同一个类处理多个相关的操作。\n2. 构造操作类的对象。\n3. 从操作对象构造按钮或菜单项。构造函数将从操作对象读取标签文本和图标。\n\
  4. 对于可以由按键触发的操作，你必须执行额外的步骤。首先，找到窗口的顶层组件，例如包含所有其他组件的面板。\n5. 然后，获取顶层组件的 `WHEN_ANCESTOR_OF_FOCUSED_COMPONENT`\
  \ 输入映射。为所需的按键创建一个 `KeyStroke` 对象。创建一个操作键对象，例如描述你操作的字符串。将键对（按键，操作键）添加到输入映射中。\n6.\
  \ 最后，获取顶层组件的操作映射。将键对（操作键，操作对象）添加到映射中。\n\n#### `javax.swing.Action` 1.2\n\n* `boolean\
  \ isEnabled()`\n* `void setEnabled(boolean b)`\n  获取或设置此操作的 `enabled` (可用) 属性。\n\
  * `void putValue(String key, Object value)`\n  在操作对象内部放置一个键/值对。键可以是任何字符串，但某些名称具有预定义的含义——参见[表\
  \ 10.1]。\n* `Object getValue(String key)`\n  返回存储的名称/值对的值。\n\n#### `javax.swing.KeyStroke`\
  \ 1.2\n\n* `static KeyStroke getKeyStroke(String description)`\n  从从人类可读的描述（一系列由空格分隔的字符串）构造按键。该描述以零或多个修饰符（`shift`,\
  \ `control`, `ctrl`, `meta`, `alt`, `altGraph`）开头，并以字符串 `typed` 结尾，后跟一个单字符字符串（例如\
  \ `\"typed a\"`），或者是一个可选的事件指定符（`pressed` 或 `released`，其中 `pressed` 为默认），后跟一个键码。键码在带有\
  \ `VK_` 前缀时应对应 `KeyEvent` 常量；例如，`\"INSERT\"` 对应 `KeyEvent.VK_INSERT`。\n\n#### `javax.swing.JComponent`\
  \ 1.2\n\n* `ActionMap getActionMap()` 1.3\n  返回将操作键（可以是任意对象）与 `Action` 对象关联的映射。\n\
  * `InputMap getInputMap(int flag)` 1.3\n  获取将按键映射到操作键的输入映射。`flag` 是[表 10.2] 中的值之一。\n\
  \n### 10.4.6 鼠标事件\n\n如果你只是想让用户点击按钮或菜单，就不需要显式处理鼠标事件。这些鼠标操作由用户界面中的各种组件内部处理。然而，如果你想让用户能够使用鼠标绘图，你需要捕获鼠标移动、点击和拖拽事件。\n\
  \n在本节中，我将向你展示一个简单的编辑器，它允许用户在画布上放置、移动和删除正方形。当用户点击鼠标按钮时，会调用三个方法：鼠标按下时调用 `mousePressed`，鼠标释放时调用\
  \ `mouseReleased`，最后是调用 `mouseClicked`。如果你只对完整的点击感兴趣，可以忽略前两个方法。要区分单击、双击和三击，请使用 `getClickCount()`\
  \ 方法。通过使用 `MouseEvent` 参数上的 `getX` 和 `getY` 方法，可以获取点击时的 x 和 y 坐标。\n\n当用户在现有的正方形内双击时，它会被删除。\n\
  \n```\npublic void mousePressed(MouseEvent event)\n{\n   current = find(event.getPoint());\n\
  \   if (current == null)\n      add(event.Point());\n}\n\npublic void mouseClicked(MouseEvent\
  \ event)\n{\n   current = find(event.Point());\n   if (current != null && event.getClickCount()\
  \ >= 2)\n      remove(current);\n}\n```\n\n当鼠标在窗口上移动时，窗口会接收到大量的鼠标事件。注意存在独立的 `MouseListener`\
  \ 和 `MouseMotionListener` 接口。这样做是为了效率——用户移动鼠标时会产生大量的鼠标事件，只关心点击的监听器不会受到不需要的移动干扰。\n\
  \n我们的测试应用程序捕获移动事件，以便在正方形上方将光标变为另一种形状（十字）。这是通过 `Cursor` 类的 `getPredefinedCursor`\
  \ 方法实现的。[表 10.3] 列出了与此方法使用的常量以及它们在 Windows 下的外。\n\n表 10.3：示例光标形状\n\n| 图标 | 常量 |\
  \ 图标 | 常量 |\n| --- | --- | --- | --- |\n| [Icon] | `DEFAULT_CURSOR` | [Icon] | `NE_RESIZE_CURSOR`\
  \ |\n| [Icon] | `CROSSHAIR_CURSOR` | [Icon] | `E_RESIZE_CURSOR` |\n| [Icon] | `HAND_CURSOR`\
  \ | [Icon] | `SE_RESIZE_CURSOR` |\n| [Icon] | `MOVE_CURSOR` | [Icon] | `S_RESIZE_CURSOR`\
  \ |\n\n\n\n\n\n| ![.jpg](img/351fig05.jpg) | `TEXT_CURSOR` | ![.jpg](img/351fig08.jpg)\
  \ | `SW_RESIZE_CURSOR` |\n| ![.jpg](img/351fig06.jpg) | `WAIT_CURSOR` | ![.jpg](img/351fig09.jpg)\
  \ | `W_RESIZE_CURSOR` |\n| ![.jpg](img/351fig07.jpg) | `N_RESIZE_CURSOR` | ![.jpg](img/351fig10.jpg)\
  \ | `NW_RESIZE_CURSOR` |\n\n这里是我们示例程序中 `MouseMotionListener` 的 `mouseMoved` 方法：\n\
  \n```java\npublic void mouseMoved(MouseEvent event)\n{\n   if (find(event.getPoint())\
  \ == null)\n      setCursor(Cursor.getDefaultCursor());\n   else\n      setCursor(Cursor.getPredefinedCursor(Cursor.CROSSHAIR_CURSOR));\n\
  }\n```\n\n如果用户在鼠标移动时按下鼠标按钮，则会生成 `mouseDragged` 调用而不是 `mouseMoved` 调用。我们的测试应用程序允许用户拖动光标下的正方形。我们只需更新当前正在拖动的矩形，使其居于鼠标位置。然后，我们重绘画布以显示新的鼠标位置。\n\
  \n```java\npublic void mouseDragged(MouseEvent event)\n{\n   if (current != null)\n\
  \   {\n      int x = event.getX();\n      int y = event.getY();\n\n      current.setFrame(x\
  \ - SIDELENGTH / 2, y - SIDELENGTH / 2, SIDELENGTH, SIDELENGTH);\n      repaint();\n\
  \   }\n}\n```\n\n`mouseMoved` 方法只有在鼠标留在组件内部时才会被调用。然而，当鼠标被拖到组件外部时，`mouseDragged`\
  \ 方法仍会被调用。\n\n还有两个鼠标事件方法：`mouseEntered` 和 `mouseExited`。这些方法在鼠标进入或离开组件时被调用。\n\n\
  最后，让我们看看如何监听鼠标事件。鼠标点击通过 `mouseClicked` 方法报告，它是 `MouseListener` 接口的一部分。许多应用程序只对鼠标点击感兴趣而不对鼠标移动；由于鼠标移动事件发生频率频繁，鼠标移动和拖拽事件被定义在一个名为\
  \ `MouseMotionListener` 的独立接口中。\n\n在我们的程序中，对这两种鼠标事件都感兴趣。我们定义了两个内部类：`MouseHandler`\
  \ 和 `MouseMotionHandler`。`MouseHandler` 类继承了 `MouseAdapter` 类，因为它只定义了五个 `MouseListener`\
  \ 方法中的两个。（`MouseAdapter` 类将所有这些方法都定义为空操作方法）。`MouseMotionHandler` 实现了 `MouseMotionListener`\
  \ 并定义了该接口的两个方法。代码列表 10.7 是程序代码。\n\n#### 代码列表 10.7 mouse/MouseComponent.java\n\n\
  ```java\npackage mouse;\n\nimport java.awt.*;\nimport java.awt.event.*;\nimport\
  \ java.awt.geom.*;\nimport java.util.*;\nimport javax.swing.*;\n\npublic class MouseComponent\
  \ extends JComponent\n{\n   private static final int DEFAULT_WIDTH = 300;\n   private\
  \ static final int DEFAULT_HEIGHT = 200;\n\n   private static final int SIDELENGTH\
  \ = 10;\n   private ArrayList<Rectangle2D> squares;\n   private Rectangle2D current;\
  \ // 包含光标的正方形\n\n   public MouseComponent()\n   {\n      squares = new ArrayList<>();\n\
  \      current = null;\n\n      addMouseListener(new MouseHandler());\n      addMouseMotionListener(new\
  \ MouseMotionHandler());\n   }\n\n   public Dimension getPreferredSize() \n   {\n\
  \      return new Dimension(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n   }\n\n   public void\
  \ paintComponent(Graphics g)\n   {\n      Graphics2D g2 = (Graphics2D) g;\n\n  \
  \    // 绘制所有正方形\n      for (Rectangle2D r : squares)\n         g2.draw(r);\n   }\n\
  \n   /**\n    * 包含某个点的第一个正方形。\n    * @param p 点\n    * @return 包含 p 的第一个正方形\n  \
  \ */\n   public Rectangle2D find(Point2D p)\n   {\n      for (Rectangle2D r : squares)\n\
  \      {\n         if (r.contains(p)) return r;\n      }\n      return null;\n \
  \  }\n\n   /**\n    * 向集合中添加正方形。\n    * @param p 正方形的中心\n   */\n   public void add(Point2D\
  \ p)\n   {\n      double x = p.getX();\n      double y = p.getY();\n\n      current\
  \ = new Rectangle2D.Double(x - SIDELENGTH / 2, y - SIDELENGTH / 2,\n         SIDELENGTH,\
  \ SIDELENGTH);\n      squares.add(current);\n      repaint();\n   }\n\n   /**\n\
  \    * 从集合中移除正方形。\n    * @param s 要移除的正方形\n   */\n   public void remove(Rectangle2D\
  \ s)\n   {\n      if (s == null) return;\n      if (s == current) current = null;\n\
  \      squares.remove(s);\n      repaint();\n   }\n\n   private class MouseHandler\
  \ extends MouseAdapter\n   {\n      public void mousePressed(MouseEvent event)\n\
  \      {\n         // 如果光标不在正方形内，则添加新正方形\n         current = find(event.getPoint());\n\
  \         if (current == null) add(event.getPoint());\n      }\n\n      public void\
  \ mouseClicked(MouseEvent event)\n      {\n         // 如果点击，则移除当前正方形\n         current\
  \ = find(event.getPoint());\n         if (current != null && event.getClickCount()\
  \ >= 2) remove(current);\n      }\n   }\n\n   private class MouseMotionHandler implements\
  \ MouseMotionListener\n   {\n      public void mouseMoved(MouseEvent event)\n  \
  \    {\n         // 如果鼠标在矩形内，将鼠标光标设置为十字准星\n\n         if (find(event.getPoint())\
  \ == null) setCursor(Cursor.getDefaultCursor());\n         else setCursor(Cursor.getPredefinedCursor(Cursor.CROSSHAIR_CURSOR));\n\
  \      }\n\n      public void mouseDragged(MouseEvent event)\n      {\n        \
  \ if (current != null)\n         {\n            int x = event.getX();\n        \
  \    int y = event.getY();\n\n            // 拖动当前矩形使其居中于 (x, y)\n            current.setFrame(x\
  \ - SIDELENGTH / 2, y - SIDELENGTH / 2, SIDELENGTH, SIDELENGTH);\n            repaint();\n\
  \         }\n      }\n   }   \n}\n```\n\n`java.awt.event.MouseEvent` 1.1\n\n* `int\
  \ getX()`\n* `int getY()`\n* `Point getPoint()`\n  返回事件发生点的 `x`（水平）和 `y`（垂直）坐标，是从事件源组件左上角测量的。\n\
  * `int getClickCount()`\n  返回与此事件关联的连续鼠标点击次数。（构成“连续”的时间间隔取决于系统。）\n\n`java.awt.Component`\
  \ 1.0\n\n* `public void setCursor(Cursor cursor)` 1.1\n  将光标图像设置为指定的光标。\n\n### 10.4.7\
  \ AWT 事件层级结构\n\n`EventObject` 类有一个子类 `AWTEvent`，它是所有 `AWT` 事件类的父类。图 10.17 显示了 AWT\
  \ 事件的继承图。\n\n![图片](img/08_08.jpg)图 10.17: AWT 事件类的继承图\n\n某些 Swing 组件会生成更多类型的事件对象；这些对象直接继承自\
  \ `EventObject`，而不是 `AWTEvent`。\n\n事件对象封装了事件源向其监听器通信的事件信息。当需要时，你可以分析传递给监听器对象的事件对象，就像我们在按钮示例中使用\
  \ `getSource` 和 `getActionCommand` 方法做的那样。\n\n某些 AWT 事件类对于 Java 程序员来说没有实际用处。例如，AWT\
  \ 会向事件队列中插入 `PaintEvent` 对象，但这些对象不会被传递给监听器。Java 程序员并不监听绘图事件；相反，他们通过重写 `paintComponent`\
  \ 方法来控制重绘。AWT 还会生成许多只有系统程序员需要的事件，用于为意文字语言提供输入系统、自动化测试机器人等。\n\n\n\n\nAWT 在 `low-level`（低级）和\
  \ `semantic`（语义）事件之间做了很有区分。语义事件表达的是用户正在的操作，例如“点击那个按钮”；`ActionEvent` 就是一个语义事件。低级事件是实现这些操作的事件。在点击按钮的情况下，这包括鼠标按下、一系列鼠标移动和鼠标释放（但仅当鼠标释放时位于按钮区域内时才有效）。或者也可能是按键触发，如果用户使用\
  \ `Tab` 键选中按钮然后用空格键激活它，就会发生这种情况。同样，调整滚动条是一个语义事件，但拖动鼠标是一个低级事件。\n\n以下是 `java.awt.event`\
  \ 包中通常用的语义事件类：\n\n* `ActionEvent`（用于按钮点击、菜单选择、选择列表项或在文本字段中输入回车键）\n* `AdjustmentEvent`（用户调整了滚动条）\n\
  * `ItemEvent`（用户从一组复选框或列表项中进行了选择）\n\n常用的有五类低级事件类：\n\n* `KeyEvent`（按键被按下或释放）\n* `MouseEvent`（鼠标按钮被按下、释放、移动或拖动）\n\
  * `MouseWheelEvent`（鼠标轮被旋转）\n* `FocusEvent`（组件获得焦点或失去焦点）\n* `WindowEvent`（窗口状态发生变化）\n\
  \n表 10.4 显示了最重要的 AWT 监听器接口、事件和事件源。\n\n表 10.4：事件处理总结\n\n| 接口 | 方法 | 参数/访问器 | 事件产生于\
  \ |\n| --- | --- | --- | --- |\n| `ActionListener` | `actionPerformed` | `ActionEvent`\
  \ <br>``getActionCommand`<br>``getModifiers` | `AbstractButton`, `JComboBox`, `JTextField`,\
  \ `Timer` |\n| `AdjustmentListener` | `adjustmentValueChanged` | `AdjustmentEvent`\
  \ <br>``getAdjustable`<br>``getAdjustmentType`<br>``getValue` | `JScrollbar` |\n\
  | `ItemListener` | `itemStateChanged` | `ItemEvent` <br>``getItem`<br>``getItemSelectable`<br>``getStateChange`\
  \ | `AbstractButton`, `JComboBox` |\n| `FocusListener` | `focusGained`, `focusLost`\
  \ | `FocusEvent` <br>``isTemporary` | `Component` |\n| `KeyListener` | `keyPressed`,\
  \ `keyReleased`, `keyTyped` | `KeyEvent` <br>``getKeyChar`<br>``getKeyCode`<br>``getKeyModifiersText`<br>``getKeyText`<br>``isActionKey`\
  \ | `Component` |\n| `MouseListener` | `mousePressed`, `mouseReleased`, `mouseEntered`,\
  \ `mouseExited`, `mouseClicked` | `MouseEvent` <br>``getClickCount`<br>``getX`<br>``getY`<br>``getPoint`<br>``translatePoint`\
  \ | `Component` |\n| `MouseMotionListener` | `mouseDragged`, `mouseMoved` | `MouseEvent`\
  \ | `Component` |\n| `MouseWheelListener` | `mouseWheelMoved` | `MouseWheelEvent`\
  \ <br>``getWheelRotation`<br>``getScrollAmount` | `Component` |\n| `WindowListener`\
  \ | `windowClosing`, `windowOpened`, `windowIconified`, `windowDeiconified`, `windowClosed`,\
  \ `windowActivated`, `windowDeactivated` | `WindowEvent` <br>``getWindow` | `Window`\
  \ |\n| `WindowFocusListener` | `windowGainedFocus`, `windowLostFocus` | `WindowEvent`\
  \ <br>``getOppositeWindow` | `Window` |\n| `WindowStateListener` | `windowStateChanged`\
  \ | `WindowEvent` <br>``getOldState`<br>``getNewState` | `Window` |\n\n## 10.5 Preferences\
  \ API\n\n我将通过讨论 `java.util.prefs` API 来结束本章的介绍。在桌面程序中，你通常想要存储用户偏好，例如用户最后处理的文件、上一个窗口位置等。\n\
  \n正如你在第一卷第 9 章 中所示的，`Properties` 类使得加载和保存程序的配置信息变得简单。然而，使用属性文件有以下缺点：\n\n* 某些操作系统没有家目录的概念，这使得很难为配置文件找到一个统一的位置。\n\
  * 配置文件的命名没有标准规范，当用户安装多个 Java 应用时，这增加了名称冲突的概率。\n\n某些操作系统拥有配置信息的中央存储库。最为人知的例子是 Microsoft\
  \ Windows 中的注册表。`Preferences` 类以平台无关的方式提供了这样一个中央存储库。在 Windows 中，`Preferences` 类使用注册表进行存储；而在\
  \ Linux 上，信息则存储在本地文件系统中。当然，对于使用 `Preferences` 程序员来说，存储库的实现是透明的。\n\n`Preferences`\
  \ 存储库具有树形结构，带有如 `/com/mycompany/myapp.` 的节点路径名。与包名一样，只要程序员以反转的域名开头路径，就可以避免名称冲突。事实上，该\
  \ API 的设计者建议配置节点路径与你程序中的包名匹配。\n\n存储库中的每个节点都有一个独立的键值对表。要访问树，从用户根或系统根开始：\n\n```\n\
  Preferences root = Preferences.userRoot();\n```\n\n或者\n\n```\nPreferences root =\
  \ Preferences.systemRoot();\n```\n\n然后访问节点。你可以直接提供节点名：\n\n```\nPreferences node\
  \ = root.node(\"/com/mycompany/myapp\");\n```\n\n一个方便的快捷方法可以获取与类包名相同的节点：\n\n```\n\
  Preferences node = Preferences.userNodeForPackage(obj.getClass());\n```\n\n或者\n\n\
  ```\nPreferences node = Preferences.systemNodeForPackage(obj.getClass());\n```\n\
  \n通常，`obj` 将是 `this` 引用。一旦获取了节点，可以使用以下方法访问信息：\n\n```\nString get(String key, String\
  \ def)\nint getInt(String key, int def)\nlong getLong(String key, long def)\nfloat\
  \ getFloat(String key, float def)\ndouble getDouble(String key, double def)\nboolean\
  \ getBoolean(String key, boolean def)\nbyte[] getByteArray(String key, byte[] def)\n\
  ```\n\n注意读取信息时必须指定默认值，以防存储库数据不可。需要默认值有很多：用户可能从未指定偏好；某些资源限制平台可能没有存储库；移动设备可能临时断开连接。\n\
  \n相反，可以使用 `put` 方法将数据写入存储库，例如：\n\n```\nput(String key, String value)\nputInt(String\
  \ key, int value)\n```\n\n以此类推。\n\n可以使用方法遍历节点中存储的所有键：\n\n```\nString[] keys()\n\
  ```\n\n目前无法找到特定键的值类型。节点名称和键限制为 80 个字符，字符串值限制为 8192 个字符。\n\n中央存储库（如 Windows 注册表）传统上面临两个问题：\n\
  \n* 它们变成了充满了过时信息的“垃圾场”。\n* 配置数据与存储库纠在一起，使得将偏好迁移到新平台变得困难。\n\n`Preferences` 类为第二个问题提供了解决方案。你可以通过以下方法导出子树（或较少使用的单个节点）的偏好：\n\
  \n```\nvoid exportSubtree(OutputStream out)\nvoid exportNode(OutputStream out)\n\
  ```\n\n数据以 XML 格式保存。你可以通过调用方法将其导入到另一个存储库：\n\n```\nvoid importPreferences(InputStream\
  \ in)\n```\n\n这是一个示例文件：\n\n\n\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<!DOCTYPE preferences SYSTEM \"http://java.sun.com/dtd/preferences.dtd\">\n\
  <preferences EXTERNAL_XML_VERSION=\"1.0\">\n   <root type=\"user\">\n      <map/>\n\
  \      <node name=\"com\">\n         <map/>\n         <node name=\"horstmann\">\n\
  \            <map/>\n            <node name=\"corejava\">\n               <map>\n\
  \            <entry key=\"height\" value=\"200.0\"/>\n            <entry key=\"\
  left\" value=\"1027.0\"/>\n            <entry key=\"filename\" value=\"/home/cay/books/cj11/code/v1ch11/raven.html\"\
  />\n            <entry key=\"top\" value=\"380.0\"/>\n            <entry key=\"\
  width\" value=\"300.0\"/>\n               </map>\n            </node>\n        </node>\n\
  \      </node>\n   </root>\n</preferences>\n```\n\n如果你的程序使用了偏好（preferences），你应该给用户提供导出和导入这些偏好的机会，这样他们就可以轻松地将设置从一台计算机迁移到另一台。Listing\
  \ 10.8 中的程序演示了这种技术。程序仅保存了窗口的位置和最后加载的文件。尝试调整窗口大小，然后导出你的偏好，移动窗口，退出并重启应用程序。窗口将与你退出时的一模一样。导入你的偏好后，窗口将恢复到之前的位置。\n\
  \nListing 10.8 `preferences/ImageViewer.java`\n\n```java\npackage preferences;\n\
  \nimport java.awt.EventQueue;\nimport java.awt.event.*;\nimport java.io.*;\nimport\
  \ java.util.prefs.*;\nimport javax.swing.*;\n\n/**\n * 测试偏好设置的程序。该程序记录了\n * 框架的位置、大小和最后选择的文件。\n\
  \ * @version 1.10 2018-04-10\n * @author Cay Horstmann\n */\npublic class ImageViewer\n\
  {\n   public static void main(String[] args)\n   {\n      EventQueue.invokeLater(()\
  \ ->\n         {\n            var frame = new ImageViewerFrame();\n            frame.setTitle(\"\
  ImageViewer\");\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n         });\n   }\n}\n\n/**\n * 一个图像查看器，从用户偏好恢复位置、大小和图像，\n\
  \ * 退出时更新偏好。\n */\nclass ImageViewerFrame extends JFrame\n{\n   private static final\
  \ int DEFAULT_WIDTH = 300;\n   private static final int DEFAULT_HEIGHT = 200;\n\
  \   private String image;\n\n   public ImageViewerFrame()\n   {\n      Preferences\
  \ root = Preferences.userRoot();\n      Preferences node = root.node(\"/com/horstmann/corejava/ImageViewer\"\
  );\n      // 从属性获取位置、大小、标题\n      int left = node.getInt(\"left\", 0);\n      int\
  \ top = node.getInt(\"top\", 0);\n      int width = node.getInt(\"width\", DEFAULT_WIDTH);\n\
  \      int height = node.getInt(\"height\", DEFAULT_HEIGHT);\n      setBounds(left,\
  \ top, width, height);\n      image = node.get(\"image\", null);\n      var label\
  \ = new JLabel();\n      if (image != null) label.setIcon(new ImageIcon(image));\n\
  \n      addWindowListener(new WindowAdapter()\n      {\n         public void windowClosing(WindowEvent\
  \ event)\n         {\n            node.putInt(\"left\", getX());\n            node.putInt(\"\
  top\", getY());\n            node.putInt(\"width\", getWidth());\n            node.putInt(\"\
  height\", getHeight());\n            if (image != null) node.put(\"image\", image);\
  \      \n         }\n      });\n\n      // 使用 label 显示图像\n      add(label);\n\n\
  \      // 设置文件选择器\n      var chooser = new JFileChooser();\n      chooser.setCurrentDirectory(new\
  \ File(\".\"));\n\n      // 设置菜单栏\n      var menuBar = new JMenuBar();\n      setJMenuBar(menuBar);\n\
  \n      var menu = new JMenu(\"File\");\n      menuBar.add(menu);\n\n      var openItem\
  \ = new JMenuItem(\"Open\");\n      menu.add(openItem);\n      openItem.addActionListener(event\
  \ ->\n         {\n            // 显示文件选择对话框\n            int result = chooser.showOpenDialog(null);\n\
  \n            // 如果选择了文件，则将其设为 label 的图标\n            if (result == JFileChooser.APPROVE_OPTION)\n\
  \            {\n               image = chooser.getSelectedFile().getPath();\n  \
  \             label.setIcon(new ImageIcon(image));\n            }\n         });\n\
  \n      var exitItem = new JMenuItem(\"Exit\");\n      menu.add(exitItem);\n   \
  \   exitItem.addActionListener(event -> System.exit(0));\n   }\n}\n```\n\n`java.util.prefs.Preferences`\
  \ 1.4\n\n*   `Preferences userRoot()`\n\n    返回调用程序的用户的根偏好节点。\n\n*   `Preferences\
  \ systemRoot()`\n\n    返回系统范围的根偏好节点。\n\n*   `Preferences node(String path)`\n\n\
  \    返回一个可以通过给定路径从当前节点访问的节点。如果 `path` 是绝对路径（即以 `/` 开头），则该节点从包含此偏好节点的树根开始定位。如果不存在给定路径的节点，则创建它。\n\
  \n*   `Preferences userRoot()`\n\n    返回调用程序的用户的根偏好节点。\n\n*   `Preferences systemRoot()`\n\
  \n    返回系统范围的根偏好节点。\n\n*   `Preferences node(String path)`\n\n    返回一个可以通过给定路径从当前节点访问的节点。如果\
  \ `path` 是绝对路径（即以 `/` 开头），则该节点从包含此偏好节点的树根开始定位。如果不存在给定路径的节点，则创建它。\n\n\n\n\n\n- 它的\
  \ `behavior`（对事件的反应）\n\n即使是像按钮这样看似简单的组件，这些特性之间也表现出某种相当复杂的交互。显而易见，按钮的视觉外观取决于外观（look-and-feel）。`Metal`\
  \ 按钮看起来与 `Windows` 按钮或 `Motif` 按钮不同。此外，外观还取决于按钮的状态；当按钮被按下时，它需要重新绘制以显示出不同的外观。状态取决于按钮接收到的事件。当用户在按钮内部按下鼠标时，按钮就会进入按下状态。\n\
  \n当然，当你程序中使用按钮时，你只是简单地将其看作一个按钮；你不会过多考虑它的内部工作机制和特性。毕竟，那是实现按钮的程序员的工作。然而，实现按钮以及所有其他用户界面组件的程序员有动力对它们进行更深层次的思考，以确保无论生效的是哪种外观，它们都能良好工作。\n\
  \n为了实现这一点，Swing 的设计者转向了一种著名的设计模式：`model-view-controller` (MVC) 模式。这种设计模式告诉我们要提供三个独立的对象：\n\
  \n- `model`（模型），用于存储内容\n- `view`（视图），用于显示内容\n- `controller`（控制器），用于处理用户输入\n\n该模式精确地规定了这三个对象如何交互。模型存储内容且`不包含用户界面`。对于按钮来说，内容非常简单——只是一小组标记位，用于告知按钮当前是按下状态还是弹起状态、激活状态还是非激活状态等。对于文本字段，内容就稍微有趣一点。它是一个持有当前文本的字符串对象。这与内容的视图`不是同一个`（not\
  \ the same)—如果内容大于文本字段，用户只能看到显示出的部分文本（请阅图 11.1）。\n\n![Figure](img/09_02.jpg)图 11.1:\
  \ 文本字段的模型和视图\n\n模型必须实现更改内容和发现内容是什么的方法。例如，文本模型具有在当前文本中添加或删除字符的方法，以及将当前文本作为字符串返回的方法。再次，请记住模型是完全非视觉的。绘制存储在模型中的数据是视图的工作。\n\
  \n“模型”一词或许并不理想，因为我们经常认为模型是抽象概念的表示。汽车和飞机的设计师建立模型来模拟真实的汽车和飞机。但在思考模型-视图-控制器模式时，这种类比真的会误导你。在这一设计模式中，模型存储完整的内容，而视图提供了内容的（完整或不完全的）视觉表示。一个更好的类比可能是为艺术家摆姿的模特。观察模特并创建视图取决于艺术家。根据艺术家的不同，视图可能是一幅正式的肖像、一幅印象派绘画，或一幅肢体奇异扭曲的立体主义图画。\n\
  \n模型-视图-控制器模式的优势之一是一个模型可以拥有多个视图，每个视图显示完整内容的不同部分或方面。例如，HTML 编辑器可以为同一内容提供两个`同时`（simultaneous）的视图：一个所见即所得（WYSIWYG）视图和一个“原始标签”视图（请阅图\
  \ 11.2）。当模型通过其中一个视图的控制器进行更新时，它会通知所有绑定的视图变化。当视图接收到通知时，它们会自动刷新。当然，对于像按钮这样简单的用户界面组件，你不会拥有同一个模型的多个视图。\n\
  \n![Figure](img/09_03.jpg)图 11.2: 同一个模型的两个独立视图\n\n控制器处理用户输入事件，例如鼠标点击和按键触发。它然后决定是否将这些事件翻译为模型或视图的变化。例如，如果用户在文本框中按下字符键，控制器调用模型的“插入字符”命令。然后模型告诉视图更新其自身。视图永远不知道文本为何发生变化。但如果用户按下光标键，控制器可能会告诉视图滚动。滚动视图对底层文本没有影响，因此模型永远不知道该事件的发生。\n\
  \n图 11.3 显示了模型、视图和控制器对象之间的交互。\n\n![Figure](img/09_04.jpg)图 11.3: 模型、视图和控制器对象之间的交互\n\
  \n对于大多数 Swing 组件，模型类实现了一个以 `Model` 结尾的接口；在这种情况下，该接口被称为 `ButtonModel`。实现该接口的类可以定义各种按钮的状态。实际上，按钮并没有那么复杂，Swing\
  \ 库包含一个实现该接口的类，名为 `DefaultButtonModel`。通过查看 `ButtonModel` 接口，可以了解模型所维护的数据类型——请阅表\
  \ 11.1。\n\n表 11.1: ButtonModel 属性\n\n| 属性名 | 值 |\n| --- | --- |\n| actionCommand\
  \ | 与此按钮关联的操作命令字符串 |\n| mnemonic | 按钮的键盘快捷键 |\n| armed | 按钮启用状态时为 true |\n| enabled\
  \ | 按钮可选状态时为 true |\n| pressed | 按钮被按下但鼠标尚未释放时为 true |\n| rollover | 鼠标悬停在按钮上时为\
  \ true |\n| selected | 按钮已切换时为 true（用于复选框和单选按钮） |\n\n每个 `JButton` 对象都存储了一个可以获取的模型。\n\
  \n```\nvar button = new JButton(\"Blue\");\nButtonModel model = button.getModel();\n\
  ```\n\n\n\n\n\n当然，Java 开发环境拥有拖放式的 GUI 构建器。尽管如此，确切了解“底层”发生了什么是非常重要的，因为即使是这些工具中最好的，通常也需要手动微调。\n\
  \n### 11.2.1. 布局管理器\n\n让我们先回顾第 10 章中的程序，该程序使用按钮来更改框架的背景颜色。\n\n按钮被包含在一个 `JPanel`\
  \ 对象中，并由`流式布局管理器`（flow layout manager）管理，这是面板的默认布局管理器。图 11.4 显示了向面板中添加更多按钮时发生的情况。如你所见，当没有空间时，会开启新的一行。\n\
  \n![Figure](img/buttontest2.jpg)图 11.4: 由流式布局管理的六个按钮的面板\n\n此外，即使用户调整框架的大小，按钮也会保持在面板的居位置（参见图\
  \ 11.5）。\n\n![Figure](img/buttontest3.jpg)图 11.5: 更改面板大小会自动重新排列按钮。\n\n通常，`components`（组件）被放在`containers`（容器）内部，`layout\
  \ manager`（布局管理器）决定容器内组件的位置和大小。\n\n按钮、文本字段和其他用户界面元素继承自 `Component` 类。组件可以放在容器中，例如面板。容器本身也可以被放在其他容器中，因此\
  \ `Container` 类继承自 `Component`。图 11.6 显示了 `Component` 的继承层次结构。\n\n![Figure](img/09_08.jpg)图\
  \ 11.6: `Component` 类的继承层次结构\n\n遗憾的是，继承层次结构在两个方面并不完全整洁。首先，顶层窗口（如 `JFrame`）是 `Container`\
  \ 的子类，因此也是 `Component` 的子类，但它们不能被放在其他容器内部。此外，`JComponent` 是 `Container` 的子类而非 `Component`\
  \ 的子类。因此，可以将其他组件添加到 `JButton` 中。（不过，这些组件不会被显示。）\n\n每个容器都有默认的布局管理器，但你始终可以设置自己的。例如，语句：\n\
  \n```\npanel.setLayout(new GridLayout(4, 4));\n```\n\n该语句使用 `GridLayout` 类将组件布局为四行四列。当你向容器中添加组件时，容器的\
  \ `add` 方法会将组件和任何位置方向传递给布局管理器。\n\n`java.awt.Container` 1.0\n\n*   `void setLayout(LayoutManager\
  \ m)`\n    为此容器设置布局管理器。\n\n*   `Component add(Component c)`\n*   `Component add(Component\
  \ c, Object constraints)` 1.1\n    向此容器添加组件并返回该组件的引用。\n\n`java.awt.FlowLayout` 1.0\n\
  \n*   `FlowLayout()`\n*   `FlowLayout(int align)`\n*   `FlowLayout(int align, int\
  \ hgap, int vgap)`\n    构造一个新的 `FlowLayout`。`align` 参数是 `LEFT`、`CENTER` 或 `RIGHT`\
  \ 之一。\n\n### 11.2.2. 边界布局\n\n`border layout manager`（边界布局管理器）是每个 `JFrame` 内容面板的默认布局管理器。与完全控制每个组件位置的流式布局管理器不同，边界布局允许你选择想要放置每个组件的位置。你可以选择将组件放置在内容面板的中心、北、南、东或西（参见图\
  \ 11.7）。\n\n![Figure](img/09_09.jpg)图 11.7: 边界布局\n\n例如：\n\n```\nframe.add(component,\
  \ BorderLayout.SOUTH);\n```\n\n边缘组件首先布局，剩余的可用空间由中心占据。当容器调整大时，边缘组件的尺寸保持不变，但中心组件会改变大小。通过指定\
  \ `BorderLayout` 类的常量 `CENTER`、`NORTH`、`SOUTH`、`EAST` 或 `WEST` 来添加组件。并不是所有位置都需要被占据。如果你不提供任何值，则假设为\
  \ `CENTER`。\n\n`BorderLayout` 常量定义为字符串。例如，`BorderLayout.SOUTH` 定义为字符串 `\"South\"\
  `。这比使用字符串更安全。如果你不小心拼错了一个字符串，例如 `frame.add(component, \"south\")`，编译器不会捕捉该错误。\n\n\
  与流式布局不同，边界布局会扩展所有组件以填充可用空间。（流式布局让每个组件保持其首选尺寸）。当你添加按钮时，这会产生问题：\n\n```\nframe.add(yellowButton,\
  \ BorderLayout.SOUTH); // 不要这样做\n```\n\n图 11.8 显示了使用上述代码段时发生的情况。按钮已经增大到填充了框架的整个南部区域。而且，如果你在南部区域添加另一个按钮，它只会挤掉第一个按钮。\n\
  \n![Figure](img/buttontest4.jpg)图 11.8: 由边界布局管理的按钮\n\n要解决这个问题，请使用额外的面板。例如，查看图 11.9。屏幕底部的三个按钮包含在一个面板中。面板被放入框架的南部区域。\n\
  \n![Figure](img/buttontest5.jpg)图 11.9: 南部的面板\n\n为了实现这种配置，首先创建一个新的 `JPanel`，然后向其添加各个按钮。面板的默认布局是\
  \ `FlowLayout`，这意味着按钮在面板内居中且不会填充整个区域。最后，将面板添加到框架的内容面板中。\n\n```\nvar panel = new\
  \ JPanel();\npanel.add(yellowButton);\npanel.add(blueButton);\npanel.add(redButton);\n\
  frame.add(panel, BorderLayout.SOUTH);\n```\n\n边界布局扩展面板以填充整个南部区域。\n\n`java.awt.BorderLayout`\
  \ 1.0\n\n*   `BorderLayout()`\n*   `BorderLayout(int hgap, int vgap)`\n    构造一个新的\
  \ `BorderLayout`。\n\n### 11.2.3. 网格布局\n\n网格布局像电子表格一样按行和列排列所有组件。所有组件都具有相同的尺寸。图 11.10\
  \ 中的计算器程序使用网格布局来排列计算器按钮。当你调整窗口大小时，按钮会伸，但所有按钮具有相同的尺寸。\n\n![Figure](img/calculator.jpg)图\
  \ 11.10: 计算器\n\n在网格布局对象的构造函数中，你指定所需的行和列。\n\n```\npanel.setLayout(new GridLayout(4,\
  \ 4));\n```\n\n添加组件，从第一行的第一个开始，然后是第一行的第二个，以此此类推。\n\n```\npanel.add(new JButton(\"\
  1\"));\npanel.add(new JButton(\"2\"));\n```\n\n当然，很少有应用程序像计算器界面那样固定。在实践中，小型网格（通常只有一行或一列）可以组织窗口的部分区域。例如，如果你想有一行尺寸相同的按钮，可以将按钮放在由单行网格布局管理的面板中。\n\
  \n`java.awt.GridLayout` 1.0\n\n*   `GridLayout(int rows, int columns)`\n*   `GridLayout(int\
  \ rows, int columns, int hgap, int vgap)`\n    构造一个新的 `GridLayout`。`rows` 和 `columns`\
  \ 中的一个可以为零，表示每行或每列有任意数量的组件。\n\n\n\n\n\n我们终于准备好开始介绍 Swing 用户界面组件了。让我们从允许用户输入和编辑文本的组件开始。你可以使用\
  \ `JTextField` 和 `JTextArea` 组件进行文本输入。文本字段（text field）只能接受一行文本；而文本区域（text area）可以接受多行文本。`JPasswordField`\
  \ 接受一行文本，但不显示具体内容。\n\n这三个类都继承自一个名为 `JTextComponent` 的类。你无法自己构造 `JTextComponent`，因为它是一个抽象类。另一方面，正如\
  \ Java 中常见的情况一样，当你查询 API 文档时，可能会发现你正在寻找的方法实际上在父类 `JTextComponent` 中，而不是派生类。例如，获取或设置文本字段或文本区域文本的方法实际上是在\
  \ `JTextComponent` 中。\n\n`javax.swing.text.JTextComponent` 1.2\n\n*   `String getText()`\n\
  *   `void setText(String text)`\n    获取或设置此文本组件的文本。\n*   `boolean isEditable()`\n\
  *   `void setEditable(boolean b)`\n    获取或设置 `editable` 属性，该属性决定了用户是否可以编辑此文本组件的内容。\n\
  \n### 11.3.1. 文本字段\n\n将文本字段添加到窗口的常用方法是将其添加到面板（panel）或其他容器中——就像添加按钮一样：\n\n```\nvar\
  \ panel = new JPanel();\nvar textField = new JTextField(\"Default input\", 20);\n\
  panel.add(textField);\n```\n\n这段代码添加了一个文本字段，并通过在其中放置字符串 `\"Default input\"` 来初始化它。该构造函数的第二个参数设置了宽度。在这种情况下，宽度为\
  \ 20 个“列”。遗憾的是，“列”是一个相当不精确的测量单位。一列是你用于文本的字体中一个字符的预期宽度。其想法是，如果你预计输入为 *n* 个字符或更少，你应该指定\
  \ *n* 为列宽。在实践中，这种测量方法并不十分理想，为了安全起见，你应该在最大输入长度上增加 1 或 2。此外，请记住列数只是给 AWT 的一个提示，用于提供*首选*尺寸（preferred\
  \ size）。如果布局管理器需要放大或缩小文本字段，它可以调整其大小。你在 `JTextField` 构造函数中设置的列宽并不是用户可以输入的字符数的上限。用户仍然可以输入更长的字符串，但当文本超过字段长度时，输入将会滚动。用户倾向于认为滚动文本字段是恼的，因此你应该将字段尺寸设置得宽裕一些。如果你需要在运行时重置列数，可以使用\
  \ `setColumns` 方法来实现。\n\n在用 `setColumns` 方法更改文本框的大小后，调用周围容器的 `revalidate` 方法。\n\n\
  ```\ntextField.setColumns(10);\npanel.revalidate();\n```\n\n`revalidate` 方法重新计算容器中所有组件的尺寸和布局。在你使用\
  \ `revalidate` 方法之后，布局管理器会调整容器的大小，文本字段改变后的尺寸将是可见的。\n\n`revalidate` 方法属于 `JComponent`\
  \ 类。它不会立即调整组件的大小，而将其标记为需要调整大小。这种方法避免了在多个组件请求调整大小时进行重复计算。然而，如果你想重新计算 `JFrame` 内部的所有组件，你必须必须调用\
  \ `validate` 方法——`JFrame` 并没有扩展 `JComponent`。\n\n通常情况下，用户在文本字段中添加文本（或编辑现有文本）。这些文本字段通常是空白的。要创建一个空白的文本字段，只需不为\
  \ `JTextField` 构造函数提供字符串参数即可：\n\n```\nvar textField = new JTextField(20);\n```\n\
  \n你可以使用上一节提到的父类 `JTextComponent` 中的 `setText` 方法随时更改文本字段的内容。例如：\n\n```\ntextField.setText(\"\
  Hello!\");\n```\n\n而且，正如上一节提到的，你可以通过调用 `getText` 方法来获取用户输入了什么。该方法返回用户输入的准确文本。为了从文本字段的数据去除任何多余的前导和尾随空格，对\
  \ `getText` 的返回值应用 `strip` 方法：\n\n```\nString text = textField.getText().strip();\n\
  ```\n\n要更改用户文本显示的字体，请使用 `setFont` 方法。\n\n`javax.swing.JTextField` 1.2\n\n*   `JTextField(int\
  \ columns)`\n    构造一个具有指定列数的空 `JTextField`。\n*   `JTextField(String text, int columns)`\n\
  \    构造一个具有初始字符串和指定列数的新 `JTextField`。\n*   `int getColumns()`\n*   `void setColumns(int\
  \ columns)`\n    获取或设置此文本字段应该使用的列数。\n\n`javax.swing.JComponent` 1.2\n\n*   `void\
  \ revalidate()`\n    导致组件的位置和尺寸被重新计算。\n*   `void setFont(Font f)`\n    设置此组件的字体。\n\
  \n`java.awt.Component` 1.0\n\n*   `void validate()`\n    重新计算组件的位置和尺寸。如果该组件是容器，则其内部组件的位置和尺寸也会重新计算。\n\
  *   `Font getFont()`\n    获取此组件的字体。\n\n### 11.3.2. 标签与组件标记\n\n标签是持有文本的组件。它们没有装饰（例如，没有边界）。它们也不会响应用户输入。你可以使用标签来标识组件。例如，与按钮不同，文本字段没有标签。要标记组件：\n\
  \n1.  构造一个正确文本的 `JLabel`。\n2.  将其放置在你想要标识的组件附近，以便用户可以看到该标签标识了它。\n\n`JLabel` 的构造函数允许你指定初始文本或图标，以及内容的对齐方式。使用\
  \ `SwingConstants` 中的常量来指定对齐方式。该接口定义了一些常用的常量，如 `LEFT`、`RIGHT` 和 `CENTER`。`JLabel`\
  \ 类是实现此接口的多个类之一。因此，你可以使用 `SwingConstants.RIGHT` 或 `JLabel.RIGHT` 常量指定右对齐标签。\n\n\
  `setText` 和 `setIcon` 方法允许你在运行时设置标签的文本和图标。\n\n你可以在按钮、标签和菜单项中使用纯文本和 HTML。我不建议在按钮中使用\
  \ HTML——它会干扰外观。但在标签中使用 HTML 可以非常有效。只需将标签字符串封装在 `<html>...</html>` 中，如下：\n\n```\n\
  label = new JLabel(\"<html><b>Required</b> entry:</html>\");\n```\n\n注意，带有 HTML\
  \ 标签的第一个组件显示可能需要一些时间，因为必须加载复杂的 HTML 渲染代码。\n\n标签可以像其他组件一样放置在容器中。这意味着你可以使用以前过的技术将标签放置在需要的地方。\n\
  \n`javax.swing.JLabel` 1.2\n\n*   `JLabel(String text)`\n*   `JLabel(Icon icon)`\n\
  *   `JLabel(String text, int align)`\n*   `JLabel(String text, Icon icon, int align)`\n\
  \    构造标签。`align` 参数是 `SwingConstants` 常量之一 `LEFT`（默认值）、`CENTER` 或 `RIGHT`。\n* \
  \  `String getText()`\n*   `void setText(String text)`\n    获取或设置此标签的文本。\n*   `Icon\
  \ getIcon()`\n*   `void setIcon(Icon icon)`\n    获取或设置此标签的图标。\n\n### 11.3.3. 密码字段\n\
  \n\n\n\n\n密码字段是文本字段的一种特殊类型。为了防止好奇的旁者看到你的密码，用户输入的字符实际上不会被显示。相反，每个输入的字符都由一个“回显字符”（echo\
  \ character）表示，例如一个圆点（`•`）。Swing 提供了一个实现此类文本字段的 `JPasswordField` 类。\n\n密码字段是模型-视图-控制器（MVC）架构模式威力的另一个例子。密码字段与普通文本字段使用相同的模型来存储数据，但它的视图（view）已被更改为将所有字符显示为回显字符。\n\
  \n`javax.swing.JPasswordField` 1.2\n\n*   `JPasswordField(String text, int columns)`\n\
  \n    构造一个新的密码字段。\n\n*   `void setEchoChar(char echo)`\n\n    设置此密码字段的回显字符。这是一个建议性的设置；特定的外观（look-and-feel）可能会坚持使用自己的回显字符。值\
  \ `0` 将回显字符重置为默认值。\n\n*   `char[] getPassword()`\n\n    返回此密码字段中包含的文本。为了更高的安全性，你应该在使用后覆盖所返回数组的内容。（密码不会以\
  \ `String` 形式返回，因为字符串将留在虚拟机中直到它被垃圾回收。）\n\n### 11.3.4. 文本区域\n\n有时，你需要收集超过一行的用户输入。如前提到的，你可以使用\
  \ `JTextArea` 组件来实现此目的。当你向程序中放置文本区域组件时，用户可以输入任意行数的文本，并使用 Enter 键将它们分隔。每行都以 `'\\\
  n'` 结束（即使在 Windows 上也是如此）。图 11.11 图 11.11: 文本组件\n\n在 `JTextArea` 组件的构造函数中，指定文本区域的行数和列数。例如\n\
  \n```\ntextArea = new JTextArea(8, 40); // 8 行，每行 40 列\n```\n\n其中 `columns` 参数的作用与之前一样——为了安全起见，你仍然需要添加几列。同样，和之前一样，用户不受行和列数的限制；当用户输入过多时，文本会自动滚动。你还可以使用\
  \ `setColumns` 方法更改列数，并使用 `setRows` 方法更改行数。这些数字仅表示首选大小——布局管理器仍然可以放大或缩小文本区域。\n\n\
  如果文本多于文本区域可以显示的内容，剩余文本将被简单裁剪。你可以通过开启换行来避免长行的截断：\n\n```\ntextArea.setLineWrap(true);\
  \ // 长行换行\n```\n\n这种换行仅是一种视觉效果；文档中的文本不会改变——不会向文本自动插入 `'\\n'` 字符。\n\n### 11.3.5.\
  \ 滚动面板\n\n在 Swing 中，文本区域没有滚动条。如果你需要滚动条，必须将文本区域放置在滚动面板（scroll pane）中。\n\n```\ntextArea\
  \ = new JTextArea(8, 40);\nvar scrollPane = new JScrollPane(textArea);\n```\n\n\
  滚动面板现在管理文本区域的视图。如果文本多于文本区域可以显示的内容，滚动条会自动出现；如果除了文本且剩余文本适合区域，滚动条将再次消失。滚动由滚动面板内部处理——你的程序不需要处理滚动事件。\n\
  \n这是一个适用于任何组件的通用机制，而不仅仅是文本区域。要为组件添加滚动条，请将其放置在滚动面板内部。\n\nListing 11.1 展示了各种文本组件。此程序显示了一个文本字段、一个密码字段和一个带滚动条的文本区域。文本字段和密码字段都带有标签。点击“插入”（Insert）将字段内容插入到文本区域中。\n\
  \n`JTextArea` 组件仅显示纯文本，没有特殊字体或格式。要显示格式化文本（如 HTML），你可以使用第 12 章\n   {\n      var textField\
  \ = new JTextField();\n      var passwordField = new JPasswordField();\n\n     \
  \ var northPanel = new JPanel();\n      northPanel.setLayout(new GridLayout(2, 2));\n\
  \      northPanel.add(new JLabel(\"User name: \", SwingConstants.RIGHT));\n    \
  \  northPanel.add(textField);\n      northPanel.add(new JLabel(\"Password: \", SwingConstants.RIGHT));\n\
  \      northPanel.add(passwordField);\n\n      add(northPanel, BorderLayout.NORTH);\n\
  \n      var textArea = new JTextArea(TEXTAREA_ROWS, TEXTAREA_COLUMNS);\n      var\
  \ scrollPane = new JScrollPane(textArea);\n\n      add(scrollPane, BorderLayout.CENTER);\n\
  \n      // 添加按钮将文本插入文本区域\n\n      var southPanel = new JPanel();\n\n      var insertButton\
  \ = new JButton(\"Insert\");\n      southPanel.add(insertButton);\n      insertButton.addActionListener(event\
  \ ->\n         textArea.append(\"User name: \" + textField.getText() + \" Password:\
  \ \"\n            + new String(passwordField.getPassword()) + \"\\n\"));\n\n   \
  \   add(southPanel, BorderLayout.SOUTH);\n      pack();\n   }\n}\n```\n\n`javax.swing.JTextArea`\
  \ 1.2\n\n*   `JTextArea()`\n\n*   `JTextArea(int rows, int columns)`\n\n*   `JTextArea(String\
  \ text, int rows, int columns)`\n\n    构造一个新的文本区域。\n\n*   `void setColumns(int columns)`\n\
  \n    告诉文本区域首选的列数。\n\n*   `void setRows(int rows)`\n\n    告诉文本区域首选的行数。\n\n*   `void\
  \ append(String newText)`\n\n    将给文本追加到文本区域的末尾。\n\n*   `void setLineWrap(boolean\
  \ wrap)`\n\n    开启或关闭换行。\n\n*   `void setStyleWord(boolean word)`\n\n    如果 `word`\
  \ 为 `true`，长行将在单词处换行。如果为 `false`，则不考虑单词边界进行断行。\n\n*   `void setTabSize(int c)`\n\
  \n    设置每 `c` 列一个制表符。注意制表符不会转换为空格，而是与下一个制表符对齐。\n\n`javax.swing.JScrollPane` 1.2\n\
  \n*   `JScrollPane(Component c)`\n\n    创建一个显示指定内容的滚动面板。当组件大于视图时，会提供滚动条。\n\n## 11.4\
  \ 选择组件\n\n你现在已经知道如何收集文本输入，但在许多情况下，你希望给用户提供有限的选择，而不是让他们在文本组件中输入数据。使用一组按钮或列表可以告诉用户有哪些选择。（这还为你节省了错误检查的麻烦。）在本节中，你将学习如何编写复选框、单选按钮、列表和滑动块。\n\
  \n### 11.4.1. 复选框\n\n如果你只想收集“是”或“否”输入，请使用复选框组件。复选框带有标识它们的标签。用户可以通过点击框内部来勾选，再次点击则取消勾选。当焦点位于复选框时，按下空格键也可以切换勾选状态。\n\
  \n\n\n\n\n图 11.12 显示了一个带有两个复选框的简单程序，一个用于开启或关闭字体的*斜体*属性，另一个用于**粗体**。注意第二个复选框具有焦点，如标签周围的矩形框所示。每当用户点击其中其中一个复选框时，屏幕都会使用新的字体属性进行刷新。\n\
  \n![Figure](img/checkboxtest.jpg)图 11.12：复选框\n\n复选框旁边需要一个标签来标识其用途。在构造函数中提供标签文本：\n\
  \n```\nbold = new JCheckBox(\"Bold\");\n```\n\n使用 `setSelected` 方法来开启或关闭复选框。例如：\n\
  \n```\nbold.setSelected(true);\n```\n\n然后使用 `isSelected` 方法获取每个复选框的当前状态。如果未选中则为\
  \ `false`，已选中则为 `true`。\n\n当用户点击复选框时，会触发一个动作事件。一往一样，你为复选框添加一个动作监听器。在我们的程序中，两个复选框共享同一个动作监听器。\n\
  \n```\nActionListener listener = . . .;\nbold.addActionListener(listener);\nitalic.addActionListener(listener);\n\
  ```\n\n监听器查询 `bold` 和 `italic` 复选框的状态，并将面板的字体设置为正体、粗体、斜体或粗体斜体兼有。\n\n```\nActionListener\
  \ listener = event ->\n   {\n      int mode = 0;\n      if (bold.isSelected()) mode\
  \ += Font.BOLD;\n      if (italic.isSelected()) mode += Font.ITALIC;\n      label.setFont(new\
  \ Font(Font.SERIF, mode, FONTSIZE));\n   };\n```\n\nListing 11.2 是复选框示例的程序列表。\n\n\
  Listing 11.2 checkBox/CheckBoxFrame.java\n\n```\npackage checkBox;\n\nimport java.awt.*;\n\
  import java.awt.event.*;\nimport javax.swing.*;\n\n/**\n * 一个带有示例文本标签和用于选择字体\n *\
  \ 属性复选框的框架。\n */\npublic class CheckBoxFrame extends JFrame\n{\n   private JLabel\
  \ label;\n   private JCheckBox bold;\n   private JCheckBox italic;\n   private static\
  \ final int FONTSIZE = 24;\n\n   public CheckBoxFrame()\n   {\n      // 添加示例文本标签\n\
  \n      label = new JLabel(\"The quick brown fox jumps over the lazy dog.\");\n\
  \      label.setFont(new Font(\"Serif\", Font.BOLD, FONTSIZE));\n      add(label,\
  \ BorderLayout.CENTER);\n\n      // 此监听器根据复选框的状态\n      // 设置标签的字体属性\n\n      ActionListener\
  \ listener = event ->\n         {\n            int mode = 0;\n            if (bold.isSelected())\
  \ mode += Font.BOLD;\n            if (italic.isSelected()) mode += Font.ITALIC;\n\
  \            label.setFont(new Font(\"Serif\", mode, FONTSIZE));\n         };\n\n\
  \      // 添加复选框\n      var buttonPanel = new JPanel();\n\n      bold = new JCheckBox(\"\
  Bold\");\n      bold.addActionListener(listener);\n      bold.setSelected(true);\n\
  \      buttonPanel.add(bold);\n\n      italic = new JCheckBox(\"Italic\");\n   \
  \   italic.addActionListener(listener);\n      buttonPanel.add(italic);\n\n    \
  \  add(buttonPanel, BorderLayout.SOUTH);\n      pack();\n   }\n}\n```\n\n`javax.swing.JCheckBox`\
  \ 1.2\n\n*   `JCheckBox(String label)`\n*   `JCheckBox(String label, Icon icon)`\n\
  \    构造一个初始未选中的复选框。\n\n*   `JCheckBox(String label, boolean state)`\n    构造一个带有给定标签和初始状态的复选框。\n\
  \n*   `boolean isSelected()`\n\n*   `void setSelected(boolean state)`\n    获取或设置复选框的选择状态。\n\
  \n### 11.4.2 单选按钮\n\n在上一个示例中，用户可以选中两个复选框中的一个、两个或一个都不选。在许多情况下，我们希望用户只从几个框中选择一个。当另一个框被选中时，之前的框会自动取消选中状态。这样一组框通常被称为单选按钮组，因为这些按钮的工作方式就像收音机上的电台选择按钮一样。当你按下一个按钮时，之前按下的按钮就会弹出。图\
  \ 11.13 显示了一个典型的示例。我们允许用户从多个选项中选择字体大小——小、中、大或特大——但当然，我们只允许一次选择一种大小。\n\n![Figure](img/radiobuttontest.jpg)图\
  \ 11.13：单选按钮组\n\n在 Swing 中实现单选按钮组非常简单。你为每组按钮构造一个 `ButtonGroup` 类型的对象。然后，你将 `JRadioButton`\
  \ 类型的对象添加到按钮组中。按钮组对象负责在点击新按钮时关闭之前设置的按钮。\n\n```\nvar group = new ButtonGroup();\n\
  \nvar smallButton = new JRadioButton(\"Small\", false);\ngroup.add(smallButton);\n\
  \nvar mediumButton = new JRadioButton(\"Medium\", true);\ngroup.add(mediumButton);\n\
  . . .\n```\n\n构造函数的第二个参数对于在初始时应被选中的按钮为 `true`，对于其他按钮为 `false`。请注意，按钮组只控制按钮的*行为*；如果你想为了布局进行分组，你仍然需要将它们添加到容器（如\
  \ `JPanel`）。如果你再次查看图 11.12，你会注意到单选按钮的外观与复选框不同。图 11.13。复选框是正方形的，选中时包含标记。单选按钮是圆形的，选中时包含一个点。\n\
  \n单选按钮的通知机制与其他按钮相同。当用户点击单选按钮时，该按钮产生一个动作事件。在我们的示例中，我们定义了一个动作监听器将字体大小设置为特定的值：\n\n\
  ```\nActionListener listener = event ->\n   label.setFont(new Font(\"Serif\", Font.PLAIN,\
  \ size));\n```\n\n将此监听器设置与复选框示例进行比较。每个单选按钮获得一个不同的监听器。每个监听器都确切知道它需要做什么——设置字体大小。对于复选框，我们使用了不同的方法：两个复选框共享同一个动作监听器，该监听器通过方法查看两个复选框的状态。\n\
  \n我们在这里也可以采用相同的方法吗？我们可以让单个监听器如下所示计算大小：\n\n```\nif (smallButton.isSelected()) size\
  \ = 8;\nelse if (mediumButton.isSelected()) size = 12;\n. . .\n```\n\n然而，我们倾向于使用单独的动作监听器对象，它们将大小值与按钮结合得更紧密。如果你有一组单选按钮，你知道其中只有一个被选中。如果能够快速找到是哪一个，而不需要查询组中的所有按钮将很好。`ButtonGroup`\
  \ 对象控制所有按钮，如果该对象可以给我们被选中按钮的引用将会方便。事实上，`ButtonGroup` 类有一个 `getSelection` 方法，但该方法并没有返回被选中的单选按钮。相反，它返回一个指向按钮模型的\
  \ `ButtonModel`。遗憾的是，`ButtonModel` 的方法没有非常有用。`ButtonModel` 接口从 `ItemSelectable`\
  \ 接口继承了 `getSelectedObjects` 方法，该方法毫无用处地返回 `null`。`getActionCommand` 方法很有前景，因为单选按钮的“动作命令”是它的文本标签。但其模型的动作命令是\
  \ `null`。只有当你使用 `setActionCommand` 方法显式设置所有单选按钮的动作命令时，模型的动作命令值也会被设置。然后你可以通过 `buttonGroup.getSelection().getActionCommand()`\
  \ 获取当前选中按钮的动作命令。\n\nListing 11.3 是用于单选按钮选择字体大小的完整程序。\n\nListing 11.3 radioButton/RadioButtonFrame.java\n\
  \n\n\n\n\n```java\npackage radioButton;\n\nimport java.awt.*;\nimport java.awt.event.*;\n\
  import javax.swing.*;\n\n/**\n * 一个带有示例文本标签和用于选择字体大小单选按钮的框架。\n */\npublic class\
  \ RadioButtonFrame extends JFrame\n{\n   private JPanel buttonPanel;\n   private\
  \ ButtonGroup group;\nprivateprivate JLabel label;\n   private static final int\
  \ DEFAULT_SIZE = 36;\n\n   public RadioButtonFrame()\n   {      \n      // 添加示例文本标签\n\
  \n      label = new JLabel(\"The quick brown fox jumps over the lazy dog.\");\n\
  \      label.setFont(new Font(\"Serif\", Font.PLAIN, DEFAULT_SIZE));\n      add(label,\
  \ BorderLayout.CENTER);\n\n      // 添加单选按钮\n\n      buttonPanel = new JPanel();\n\
  \      group = new ButtonGroup();\n\n      addRadioButton(\"Small\", 8);\n     \
  \ addRadioButton(\"Medium\", 12);\n      addRadioButton(\"Large\", 18);\n      addRadioButton(\"\
  Extra large\", 36);\n\n      add(buttonPanel, BorderLayout.SOUTH);\n      pack();\n\
  \   }\n\n   /**\n    * 添加一个单选按钮，设置示例文本的字体大小。\n    * @param name 显示在按钮上的字符串\n   \
  \ * @param size 该按钮设置的字体大小\n    */\n   public void addRadioButton(String name, int\
  \ size)\n   {\n      boolean selected = size == DEFAULT_SIZE;\n      var button\
  \ = new JRadioButton(name, selected);\n      group.add(button);\n      buttonPanel.add(button);\n\
  \n      // 此监听器设置标签的字体大小\n\n      ActionListener listener = event -> label.setFont(new\
  \ Font(\"Serif\", Font.PLAIN, size));\n\n      button.addActionListener(listener);\n\
  \   }\n}\n```\n\n`javax.swing.JRadioButton` 1.2\n\n* `JRadioButton(String label,\
  \ Icon icon)`\n    -构造一个初始未选中的单选按钮。\n\n* `JRadioButton(String label, boolean state)`\n\
  \    -构造具有给定标签和初始状态的单选按钮。\n\n`javax.swing.ButtonGroup` 1.2\n\n* `void add(AbstractButton\
  \ b)`\n    -将按钮添加到组中。\n\n* `ButtonModel getSelection()`\n    -返回选中按钮的按钮模型。\n\n`javax.swing.ButtonModel`\
  \ 1.2\n\n* `String getActionCommand()`\n    -返回此按钮模型的动作命令。\n\n`javax.swing.AbstractButton`\
  \ 1.2\n\n* `void setActionCommand(String s)`\n    -设置此按钮及其模型的动作命令。\n\n### 11.4.3.\
  \ 边框 (Borders)\n\n如果你在窗口中有多个单选按钮组，你会希望在视觉上指示哪些按钮是一组。Swing 提供了一组实用的 `borders` 用于此目的。你可以为任何扩展\
  \ `JComponent` 的组件应用边框。最常用的用法是在面板周围放置边框，并在面板中填充其他用户界面元素，如单选按钮。\n\n你可以选择许多边框，但对所有边框都需要遵循相同的步骤。\n\
  \n1. 调用 `BorderFactory` 的静态方法来创建一个边框。你可以从以下样式中选择（参见图 11.14）：\n    * 凹角 (Lowered\
  \ bevel)\n    * 凸斜角 (Raised bevel)\n    * 蚀刻 (Etched)\n    * 线条 (Line)\n    * 磨砂\
  \ (Matte)\n    * 空白 (Empty，仅在组件周围创建一些空白空间)\n    ![Figure](img/bordertest.jpg)图 11.14：边框类型测试\n\
  \n2. 如果你，可以通过将边框传递给 `BorderFactory.createTitledBorder` 为边框添加标题。\n\n3. 如果你真的想彻底一点，可以通过调用\
  \ `BorderFactory.createCompoundBorder` 多个边框。\n\n4. 通过调用 `JComponent` 类的 `setBorder`\
  \ 方法将生成的边框添加到你的组件中。\n\n例如，这里是如何向面板添加带标题的蚀刻边框：\n\n```java\nBorder etched = BorderFactory.createEtchedBorder();\n\
  Border titled = BorderFactory.createTitledBorder(etched, \"A Title\");\npanel.setBorder(titled);\n\
  ```\n\n不同的边框具有设置边框宽度和颜色的不同选项；详情请参见 API 说明。真正的边框爱好者会发现，还有一个 `SoftBevelBorder` 类用于具有圆化角的斜角边框，并且\
  \ `LineBorder` 也可以具有圆角。你只能通过使用类构造函数之一来构造这些边框——它们没有对应的 `BorderFactory` 方法。\n\n`javax.swing.BorderFactory`\
  \ 1.2\n\n* `static Border createLineBorder(Color color)`\n* `static Border createLineBorder(Color\
  \ color, int thickness)`\n    -创建一个简单的线型边框。\n* `static MatteBorder createMatteBorder(int\
  \ top, int left, int bottom, int right, Color color)`\n* `static MatteBorder createMatteBorder(int\
  \ top, int left, int bottom, int right, Icon tileIcon)`\n    -创建一个填充颜色或重复图标的粗边框。\n\
  * `static Border createEmptyBorder()`\n* `static Border createEmptyBorder(int top,\
  \ int left, int bottom, int right)`\n    -创建一个空边框。\n* `static Border createEtchedBorder()`\n\
  * `static Border createEtchedBorder(Color highlight, Color shadow)`\n* `static Border\
  \ createEtchedBorder(int type)`\n* `static Border createEtchedBorder(Color highlight,\
  \ Color shadow)`\n    -创建一个具有 3D 效果的蚀刻边框。`type` 参数为 `EtchedBorder.RAISED`、`EtchedBorder.LOWERED`。\n\
  * `static Border createBevelBorder(int type)`\n* `static Border createBevelBorder(Color\
  \ highlight, Color shadow)`\n    -创建一个凹凸表面的边框。`type` 参数为。\n* `static TitledBorder\
  \ createTitledBorder(String title)`\n* `static TitledBorder createTitledBorder(Border\
  \ border)`\n* `static TitledBorder createTitledBorder(Border border, String title)`\n\
  * `static TitledBorder createTitledBorder(Border border, String title, int justification,\
  \ int position)`\n    -创建一个具有指定属性的标题边框。`justification` 参数为 `TitledBorder` 常量 `LEFT`、`CENTER`、`RIGHT`、`LEADING`、`TRAILING`\
  \ 或 `DEFAULT_JUSTIFICATION`（左），而 `position` 参数为 `ABOVE_TOP`、`TOP`、`BELOW_TOP`、`ABOVE_BOTTOM`、`BOTTOM`、`BELOW_BOTTOM`\
  \ 或 `DEFAULT_POSITION`（顶）。\n* `static TitledBorder createTitledBorder(Border border,\
  \ String title, int justification, int position, Font font)`\n    -创建一个具有指定属性的标题边框。\n\
  * `static CompoundBorder createCompoundBorder(Border outsideBorder, Border insideBorder)`\n\
  \    -组合两个边框为一个边框。\n\n`javax.swing.border.SoftBevelBorder` 1.2\n\n* `SoftBevelBorder(int\
  \ type)`\n* `SoftBevelBorder(Color highlight, Color shadow)`\n    -创建一个具有圆化角的斜角边框。\n\
  \n`javax.swing.border.LineBorder` 1.2\n\n* `public LineBorder(Color color, int thickness,\
  \ boolean roundedCorners)`\n    -使用给定的颜色和厚度创建线边框。如果 `roundedCorners` 为 `true`，边框具有圆角。\n\
  \n`javax.swing.JComponent` 1.2\n\n* `void setBorder(Border border)`\n    -设置此组件的边框。\n\
  \n### 11.4.4. 组合框 (Combo Boxes)\n\n如果你有许多备选方案，单选按钮不是一个好选择，因为它们占据了太多屏幕空间。相反，你可以使用组合框。当用户点击此组件时，选项列表会下拉，然后用户可以从中选择一个（参见图\
  \ 11.15）。\n\n如果下拉列表框被设置为*可编辑*，你就可以像编辑文本字段一样编辑当前选择。正因如此，此组件被称为*组合框*——它结合了文本字段的灵活性和一组预定义的选项。`JComboBox`\
  \ 类提供了组合框组件。\n\n\n\n\n\n从 Java 7 开始，`JComboBox` 类是一个泛型类。例如，`JComboBox<String>` 存储\
  \ `String` 类型的对象，而 `JComboBox<Integer>` 则存储整数。\n\n调用 `setEditable` 方法可以使下拉框变为可编辑状态。请注意，编辑只会影响被选中的项。它不会以任何方式更改选项列表。\n\
  \n你可以通过调用 `getSelectedItem` 方法获取当前选择项，如果下拉框是可编辑的，该项可能已经被编辑过。然而，对于可编辑的下拉框，该项可以是任何类型，这取决于接收用户编辑并将结果转换为对象的编辑器。（有关关于编辑器的讨论，请参阅\
  \ 第 12 章）。如果你的下拉框不是可编辑的，最好调用：\n\n```\ncombo.getItemAt(combo.getSelectedIndex())\n\
  ```\n\n这将为你提供具有正确类型的被选中项。\n\n在示例程序中，用户可以从样式列表（Serif、SansSerif、Monospaced 等）中选择字体样式。用户也可以输入另一种字体。\n\
  \n使用 `addItem` 方法添加选项项。在我们的程序中，`addItem` 只在构造函数中被调用，但你可以随时调用它。\n\n```\nvar faceCombo\
  \ = new JComboBox<String>();\nfaceCombo.addItem(\"Serif\");\nfaceCombo.addItem(\"\
  SansSerif\");\n. . .\n```\n\n此方法将字符串添加到列表的末尾。你可以使用 `insertItemAt` 方法在列表的任何位置添加新项：\n\
  \n```\nfaceCombo.insertItemAt(\"Monospaced\", 0); // 添加到开头\n```\n\n你可以添加任何类型的项——下拉框会调用每个项的\
  \ `toString` 方法来显示它。\n\n如果你需要在运行时删除项，请使用 `removeItem` 或 `removeItemAt` 方法，这取决于你提供的是要删除的项还是它的位置。\n\
  \n```\nfaceCombo.removeItem(\"Monospaced\");\nfaceCombo.removeItemAt(0); // 移除第一项\n\
  ```\n\n`removeAllItems` 方法会一次性移除所有项。\n\n如果你需要向下拉框添加大量项，`addItem` 方法的性能会很差。相反，请构造一个\
  \ `DefaultComboBoxModel`，通过调用 `addElement`  own 填充它，然后调用 `JComboBox` 类的 `setModel`\
  \ 方法。\n\n当用户从下拉框中选择一个项时，下拉框会产生一个动作事件。要确定选择了哪一项，请在事件参数上调用 `getSource` 以获取发送事件的下拉框的引用。然后调用\
  \ `getSelectedItem` 方法检索当前选中的项。你需要将返回的值强制转换为相应的类型，通常是 `String`。\n\n```\nActionListener\
  \ listener = event -> \n   label.setFont(new Font(\n      faceCombo.getItemAt(faceCombo.getSelectedIndex()),\n\
  \      Font.PLAIN,\n      DEFAULT_SIZE));\n```\n\nListing 11.4 显示了完整的程序。\n\nListing\
  \ 11.4 comboBox/ComboBoxFrame.java\n\n```javapackage comboBox;\n\nimport java.awt.BorderLayout;\n\
  import java.awt.Font;\n\nimport javax.swing.JComboBox;\nimport javax.swing.JFrame;\n\
  import javax.swing.JLabel;\nimport javax.swing.JPanel;\n\n/**\n * 一个带有示例文本标签和用于选择字体的下拉框的框架。\n\
  \ */\npublic class ComboBoxFrame extends JFrame\n{\n   private JComboBox<String>\
  \ faceCombo;\n   private JLabel label;\n   private static final int DEFAULT_SIZE\
  \ = 24;\n\n   public ComboBoxFrame()\n   {\n      // 添加示例文本标签\n\n      label = new\
  \ JLabel(\"The quick brown fox jumps over the lazy dog.\");\n      label.setFont(new\
  \ Font(\"Serif\", Font.PLAIN, DEFAULT_SIZE));\n      add(label, BorderLayout.CENTER);\n\
  \n      // 创建一个下拉框并添加字体名称\n\n      faceCombo = new JComboBox<>();\n      faceCombo.addItem(\"\
  Serif\");\n      faceCombo.addItem(\"SansSerif\");\n      faceCombo.addItem(\"Monospaced\"\
  );\n      faceCombo.addItem(\"Dialog\");\n      faceCombo.addItem(\"DialogInput\"\
  );\n\n      // 下拉框监听器将标签字体更改为选中的名称\n\n      faceCombo.addActionListener(event ->\n\
  \         label.setFont(\n            new Font(faceCombo.getItemAt(faceCombo.getSelectedIndex()),\
  \ \n               Font.PLAIN, DEFAULT_SIZE)));\n\n      // 将下拉框添加到框架南部边界的面板中\n\n\
  \      var comboPanel = new JPanel();\n      comboPanel.add(faceCombo, BorderLayout.SOUTH);\n\
  \      pack();\n   }\n}\n```\n\n`javax.swing.JComboBox` 1.2\n\n* `boolean isEditable()`\n\
  * `void setEditable(boolean b)`\n    获取或设置此下拉框的 `editable` 属性。\n* `void addItem(Object\
  \ item)`\n    向项列表添加一个项。\n* `void insertItemAt(Object item, int index)`\n    在给定的索引处向项列表插入一个项。\n\
  * `void removeItem(Object item)`\n    从项列表中移除一个项。\n* `void removeItemAt(int index)`\n\
