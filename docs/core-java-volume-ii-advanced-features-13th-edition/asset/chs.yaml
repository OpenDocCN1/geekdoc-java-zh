  (注意：后续章节将根据上下文描述 JDBC API 方法。)\n\n`java.sql.Connection`\n\n- `PreparedStatement\
  \ prepareStatement(String sql)`\n  返回一个包含编译语句的 `PreparedStatement` 对象。字符串 `sql`\
  \ 包含一个或多个占位符。\n\n`java.sql.PreparedStatement`\n\n- `void setXXX(int n, XXX x)`\n\
  \  (`XXX` 是 int、double、String、Date 等类型)\n将第 `n` 个参数的值设置为 `x`。\n\n- `void clearParameters()`\n\
  \  清除准备语句中的所有当前参数。\n\n- `ResultSet executeQuery()`\n  执行准备查询并返回 `ResultSet` 对象。\n\
  \n- `int executeUpdate()`\n  执行由 `PreparedStatement` 对象表示的准备 SQL `INSERT、UPDATE\
  \ 或 DELETE` 语句。返回受影响的行数，对于 DDL 语句（如 `CREATE TABLE`）返回 `0`。\n\n### 5.5.2 读取和写入 LOB\n\
  \n除了数字、字符串和日期外，许多数据库还可以存储*大对象 (LOB)*，如图像或其他数据。在 SQL 中，二进制大对象被称为 BLOB，字符大对象被称为 CLOB。\n\
  \n取决于应用程序是将大对象存储在数据库中还是文件系统中更好。本节将告诉你当你决定使用数据库来实现该目的时该做什么。\n\n要读取 LOB，执行 `SELECT`\
  \ 语句并在 `ResultSet` 上调用 `getBlob` 或 `getClob` 方法。你将获得 `Blob` 或 `Clob` 类型的对象。要从 `Blob`\
  \ 获取二进制数据，可以调用 `getBinaryStream`。例如，如果你有一个包含书籍封面的表，可以这样检索图像：\n\n```java\nPreparedStatement\
  \ pstat\n   = conn.prepareStatement(\"SELECT Cover FROM BookCovers WHERE ISBN=?\"\
  );\n. . .\npstat.set(1, isbn);\ntry (ResultSet result = pstat.executeQuery())\n\
  {\n   if (result.next())\n   {\n      Blob coverBlob = result.getBlob(1);\n    \
  \  Image coverImage = ImageIO.read(coverBlob.getBinaryStream());\n   }\n}\n```\n\
  \n同样，如果你检索到一个 `Clob` 对象，可以通过调用 `getSubString` 或 `getCharacterStream` 方法获取字符数据。\n\
  \n\n\n\n\n要将 LOB 存入数据库，请在 `Connection` 对象上调用 `createBlob` 或 `createClob`，获取用于 LOB\
  \ 的输出流或写入器，写入数据，并将该对象存储在数据库中。例如，以下是存储图像的方法：\n\n```\nBlob coverBlob = connection.createBlob();\n\
  int offset = 0;\nOutputStream out = coverBlob.setBinaryStream(offset);\nImageIO.write(coverImage,\
  \ \"PNG\", out);\nPreparedStatement pstat = conn.prepareStatement(\"INSERT INTO\
  \ Cover VALUES (?, ?)\");\npstat.set(1, isbn);\npstat.set(2, coverBlob);\npstat.executeUpdate();\n\
  ```\n\n### java.sql.ResultSet 1.1\n\n* `Blob getBlob(int columnIndex)` 1.2\n* `Blob\
  \ getBlob(String columnLabel)` 1.2\n* `Clob getClob(int columnIndex)` 1.2\n* `Clob\
  \ getClob(String columnLabel)` 1.2\n    获取指定列的 BLOB 或 CLOB。\n\n### java.sql.Blob\
  \ 1.2\n\n* `long length()`\n    获取此 BLOB 的长度。\n* `byte[] getBytes(long startPosition,\
  \ long length)`\n    从此 BLOB 的指定范围获取数据。\n* `InputStream getBinaryStream()`\n* `InputStream\
  \ getBinaryStream(long startPosition, long length)`\n    返回一个流，用于从此 BLOB 或指定范围读取数据。\n\
  * `OutputStream setBinaryStream(long startPosition)` 1.4\n    返回一个输出流，用于从给定的位置开始写入此\
  \ BLOB。\n\n### java.sql.Clob 1.4\n\n* `long length()`\n    获取此 CLOB 的字符数。\n* `String\
  \ getSubString(long startPosition, long length)`\n    从此 CLOB 的指定范围获取字符。\n* `Reader\
  \ getCharacterStream()`\n* `Reader getCharacterStream(long startPosition, long length)`\n\
  \    返回一个读取器（而非流），用于从此 CLOB 或指定范围读取字符。\n* `Writer setCharacterStream(long startPosition)`\
  \ 1.4\n    返回一个写入器（而非流），用于从给定的位置开始写入此 CLOB。\n\n### java.sql.Connection 1.1\n\n*\
  \ `Blob createBlob()` 6\n* `Clob createClob()` 6\n    创建一个空的 BLOB 或 CLOB。\n\n###\
  \ 5.5.3. SQL 转义\n\n“转义”语法功能通常被数据库支持，但使用的是特定于数据库的语法变体。JDBC 驱动的职责是将转义语法翻译为特定数据库的语法。\n\
  \n以下功能提供了转义支持支持：\n\n* 日期和时间字面量\n* 调用标量函数\n* 调用存储过程\n* 外连接\n* `LIKE` 子句中的转义字符\n\n\
  日期和时间字面量在数据库之间差异巨大。要嵌入日期或时间字面量，请按下方所示 ISO 8601/RFC 3339 格式之一指定值，其中毫秒是可选的。驱动程序随后将其转换为原生格式。使用\
  \ `d`、`t`、`ts` 分别对应 `DATE`、`TIME` 或 `TIMESTAMP` 值：\n\n```\n{d '2024-01-24'}\n{t\
  \ '23:59:59'}\n{ts '2024-01-24 23:59:59.999'}\n```\n\n`标量函数` 是返回单个值的函数。许多函数在数据库中可用，但名称各异。JDBC\
  \ 规范提供了标准名称并将其翻译为特定数据库的名称。要调用函数，请如下所示嵌入标准函数名和参数：\n\n```\n{fn left(?, 2)}\n```\n\n\
  `外连接` 是一种连接方式，它可以返回一个或两个表中的所有行，即使在另一个表中没有匹配项也是如此。JDBC 规范为外连接提供了标准语法。\n\n### 5.5.4.\
  \ 多重结果\n\n查询可能会返回多个结果集。这在执行存储过程时发生。以下循环遍历了所有结果：\n\n```\nboolean isResult = stat.execute(command);\n\
  boolean done = false;\nwhile (!done)\n{\n   if (isResult)\n   {\n      ResultSet\
  \ result = stat.getResultSet();\n      对 result 进行操作\n   }\n   else\n   {\n    \
  \  int updateCount = stat.getUpdateCount();\n      if (updateCount >= 0)\n     \
  \    对 updateCount 进行操作\n      else\n         done = true;\n   }\n   if (!done)\
  \ isResult = stat.getMoreResults();\n}\n```\n\n### java.sql.Statement 1.1\n\n* `boolean\
  \ getMoreResults()`\n* `boolean getMoreResults(int current)` 6\n    获取此语句的下一个结果。`current`\
  \ 参数是 `CLOSE_CURRENT_RESULT`（默认）、`KEEP_CURRENT_RESULT` 或 `CLOSE_ALL_RESULTS` 之一。如果下一个结果且是结果集，则返回\
  \ `true`。\n\n### 5.5.5. 获取自动生成的键\n\n大多数数据库都支持对表行进行自动编号的机制。遗憾的是，不同厂商之间的机制差异巨大。这些自动数字通常用作主键。虽然\
  \ JDBC 没有提供独立于厂商的键生成解决方案，但它提供了一种高效检索键的方法。当您向表中插入新行并自动生成键时，可以使用以下代码检索它：\n\n```\n\
  stat.executeUpdate(insertStatement, Statement.RETURN_GENERATED_KEYS);\nResultSet\
  \ rs = stat.getGeneratedKeys();\nif (rs.next())\n{\n   int key = rs.getInt(1);\n\
  \   // ...\n}\n```\n\njava.sql.Statement 1.1\n\n* `boolean execute(String statement,\
  \ int autogenerated)` 1.4\n* `int executeUpdate(String statement, int autogenerated)`\
  \ 1.4\n    执行给定的 SQL 语句，如前所述。如果 `autogenerated` 设置为 `Statement.RETURN_GENERATED_KEYS`\
  \ 且语句为 `INSERT` 语句，则第一列包含自动生成的键。\n\n\n\n\n正如你所看到的，`ResultSet` 接口的 `next` 方法会遍历结果集中的行。对于一个只需要分析程序的程序，这足够了。然而，考虑一个显示表格或查询结果的可视化数据显示（例如图\
  \ 5.4）。你通常希望用户能够在结果集中向前向后移动。在 `scrollable`（可滚动）结果集中，你可以向前向后遍历结果集，甚至跳转到任何位置。\n\n\
  此外，一旦用户看到显示的结果集内容，他们可能会想要编辑它。在 `updatable`（可更新）结果集中，你可以通过程序更新条目，从而自动更新数据库。我们将在后续章节中讨论这些功能。\n\
  \n### 5.6.1 可滚动结果集\n\n默认情况下，结果集是不可滚动且不可更新的。要从查询中获取可滚动的结果集，你必须使用方法获取不同的 `Statement`\
  \ 对象：\n\n```\nStatement stat = conn.createStatement(type, concurrency);\n```\n\n\
  对于预编译语句，使用调用：\n\n```\nPreparedStatement pstat = conn.prepareStatement(command, type,\
  \ concurrency);\n```\n\n`type` 和 `concurrency` 的可能值列在表 5.6 中。你有以下选择：\n\n* 你希望结果集是可滚动的吗？如果不是，使用\
  \ `ResultSet.TYPE_FORWARD_ONLY`。\n* 如果结果集是可滚动的，你希望它反映生成它的查询之后发生的数据库更改吗？（在我们的讨论中，假设可滚动结果集使用\
  \ `ResultSet.TYPE_SCROLL_INSENSITIVE` 设置。这假设结果集不会“感知”查询执行后发生的数据库更改。）\n* 你希望能够通过编辑结果集来更新数据库吗？（详情见下一节。）\n\
  \n表 5.6：`ResultSet` 类型和并发性值\n\n| Value | Explanation |\n| --- | --- |\n| `TYPE_FORWARD_ONLY`\
  \ | 结果集不可滚动（默认）。 |\n| `TYPE_SCROLL_INSENSITIVE` | 结果集可滚动的，但对数据库更改不敏感。 |\n| `TYPE_SCROLL_SENSITIVE`\
  \ | 结果集可滚动的，且对数据库更改敏感。 |\n| `CONCUR_READ_ONLY` | 结果集不能用于更新数据库（默认）。 |\n| `CONCUR_UPDATABLE`\
  \ | 结果集可以用于更新数据库。 |\n\n例如，如果你只是想要滚动结果集但不想编辑其数据，可以使用：\n\n```\nStatement stat = conn.createStatement(\n\
  \   ResultSet.TYPE_SCROLL_INSENSITIVE, ResultSet.CONCUR_READ_ONLY);\n```\n\n所有由调用\n\
  \n```\nResultSet rs = stat.executeQuery(query);\n```\n\n返回的结果集现在都是可滚动的。可滚动的结果集有一个\
  \ `cursor`（游标），指示当前位置。\n\n并不是所有的数据库驱动程序都支持可滚动或可更新的结果集。（`DatabaseMetaData` 接口的 `supportsResultSetType`\
  \ 和 `supportsResultSetConcurrency` 方法将告诉你特定驱动程序使用的特定数据库支持哪些类型和并发模式。）即使数据库支持所有结果集模式，特定的查询也可能无法产生你要求的所有属性的结果集。（例如，复杂查询的结果集可能是不可更新的。）在这种情况下，`executeQuery`\
  \ 方法会返回一个能力较弱的 `ResultSet` 并向连接对象添加一个 `SQLWarning`。（(第 5.4.3 节显示了如何检索警告。）或者，你可以使用\
  \ `ResultSet` 接口的 `getType` 和 `getConcurrency` 方法来查找结果集实际上处于什么模式。如果你不检查结果集能力并执行不支持的操作（例如在不可滚滚的结果集上执行\
  \ `previous`），该操作将抛出 `SQLException`。\n\n滚动非常简单。使用\n\n\n\n```\nif (rs.previous())\
  \ . ./;\n```\n\n向后滚动。如果游标位于实际行上，则该方法返回 `true`；如果现在位于第一行之前，则返回 `false`。\n\n你可以通过调用将游标向前或向后移动任意数量的：\n\
  \n```\nrs.relative(n);\n```\n\n如果 `n` 为正数，游标向前移动。如果 `n` 为负数，游标向后移动。如果 `n` 为零，则调用将不起影响。如果你尝试将游标移动到当前行集之外，它将被指向最后一行之后或第一行之前，取决于\
  \ `n` 的正负号。然后，方法返回 `false` 且游标不会移动。如果游标位于实际行上，则方法返回 `true`。\n\n或者，你可以将游标设置为特定的行号：\n\
  \n```\nrs.absolute(n);\n```\n\n要获取当前行号，调用：\n\n```\nint currentRow = rs.getRow();\n\
  ```\n\n结果集中的第一行编号为 `1`。如果返回值为 `0`，则游标当前不在行上——它要么在第一行之前或最后一行之后。\n\n便利方法 `first`、`last`、`beforeFirst`\
  \ 和 `afterLast` 将游标移动到第一个、最后一个、第一个之前或最后一个之后。最后，`isFirst`、`isLast`、`isBeforeFirst`\
  \ 和 `isAfterLast` 方法测试游标是否在这些位置。使用滚动结果集非常简单。缓存数据的工作是由数据库驱动程序在后台完成的。\n\n### 5.6.2\
  \ 可更新结果集\n\n如果你想编辑数据并让更改自动反映在数据库中，创建一个可更新的结果。可更新的结果不需要是可滚动的，但如果你向用户展示数据进行编辑，你通常也允许滚动。要获取可更新的结果集，如下创建语句：\n\
  \n```\nStatement stat = conn.createStatement(\n   ResultSet.TYPE_SCROLL_INSENSITIVE,\
  \ ResultSet.CONCUR_UPDATABLE);\n```\n\n调用 `executeQuery` 返回的结果集现在是可以更新的。\n\n并不是所有查询都返回可更新的结果集。如果你的查询涉及多个表的连接，结果可能不可更新。然而，如果你的查询仅涉及单个表，或者通过主键连接多个表，你应该预期结果是可更新的。调用\
  \ `ResultSet` 接口的 `getConcurrency` 方法可以确定。\n\n例如，假设你想提高某些书籍的价格，但你没有发布 `UPDATE` 语句的简单标准。那么你可以遍历所有的书籍根据任意条件更新价格。\n\
  \n```\nString query = \"SELECT * FROM Books\";\nResultSet rs = stat.executeQuery(query);\n\
  while (rs.next())\n{\n   if (. . .)\n   {\n      double increase = . . .;\n    \
  \  double price = rs.getDouble(\"Price\");\n      rs.updateDouble(\"Price\", price\
  \ + increase);\n      rs.updateRow(); // 更新字段后务必调用 updateRow\n   }\n}\n```\n\n对应所有\
  \ SQL 类型的数据类型都有 `updateXxx` 方法，例如 `updateDouble`、`updateString` 等；指定列名或列号（与 `getXxx`\
  \ 方法相同），以及字段的新值。如果你使用第一个参数为列号的 `updateXxx` 方法，请注意这是结果集中的列号。它可能与数据库中的列号不同。\n\n`updateXxx`\
  \ 方法只更改行值，而不更改数据库。当你完成某行的字段更新后，必须调用 `updateRow` 方法。该方法将当前行中的所有更新发送到数据库。如果你在不调用 `updateRow`\
  \ 的情况下将游标到另一行，该行的更新将从结果集中丢弃，且不会通信到数据库。你也可以调用 `cancelRowUpdates` 方法来取消当前行的更新。\n\n\
  \n\n上一个示例展示了如何修改现有行。如果你想向数据库添加一个新行，首先使用 `moveToInsertRow` 方法将光标移动到一个特殊位置，称为 `insert\
  \ row`（插入行）。然后，通过发出 `updateXxx` 指令在插入行位置构建一个新行。完成后完成后，调用 `insertRow` 方法将新行提交到数据库。完成插入后，调用\
  \ `moveToCurrentRow` 将光标移回到调用 `moveToInsertRow` 之前的位置。以下是一个示例：\n\n```\nrs.moveToInsertRow();\n\
  rs.updateString(\"Title\", title);\nrs.updateString(\"ISBN\", isbn);\nrs.updateString(\"\
  Publisher_Id\", pubid);\nrs.updateDouble(\"Price\", price);\nrs.insertRow();\nrs.moveToCurrentRow();\n\
  ```\n\n请注意，你无法影响新数据添加到结果集或数据库的*具体位置*。\n\n如果你在插入行中没有指定列值，它将被设置为 SQL `NULL`。但是，如果该列具有\
  \ `NOT NULL` 约束，则会抛出异常，且不插入该行。\n\n最后，你可以删除光标所在的行：\n\n```\nrs.deleteRow();\n```\n\
  \n`deleteRow` 方法会立即从结果集和数据库中删除该行。\n\n`ResultSet` 接口的 `updateRow`、`insertRow` 和 `deleteRow`\
  \ 方法为你提供了与执行 `UPDATE`、`INSERT` 和 `DELETE` SQL 语句相同的权力。然而，Java 程序员可能会发现通过结果集操作数据库内容比通过构建\
  \ SQL 语句更自然。\n\n如果你不小心，使用可更新的结果集可能会写出效率极低的代码。执行 `UPDATE` 语句比执行查询并遍历结果在途中更改数据要高效得多。可更新的结果集对于用户可以进行任意更改的交互式程序是有意义的，但对于大多数程序化的更改，SQL\
  \ `UPDATE` 更合适。\n\nJDBC 2 对结果集进行了进一步的增强，例如如果数据已被另一个并发数据库连接所修改，则具有使用最新数据更新结果集的能力。JDBC\
  \ 3 增加了另一项改进，指定了在提交事务时结果集的行为。然而，这些高级功能超出了本介绍章节的范围。更多信息，请参考由 Maydene Fisher、Jon Ellis\
  \ 和 Jonathan Bruce 编写的*JDBC^™ API Tutorial and Reference, Third Edition*（Addison-Wesley,\
  \ 2003）以及 JDBC 规范。\n\n#### java.sql.Connection 1.1\n\n*   `Statement createStatement(int\
  \ type, int concurrency)` 1.2\n*   `PreparedStatement prepareStatement(String command,\
  \ int type, int concurrency)` 1.2\n    创建一个产生给定类型和并发性结果集的语句或预编译语句。`type` 参数为常量 `TYPE_FORWARD_ONLY`、`TYPE_SCROLL_INSENSITIVE`\
  \ 或 `TYPE_SCROLL_SENSITIVE`，`concurrency` 是常量 `CONCUR_READ_ONLY` 或 `CONCUR_UPDATABLE`\
  \ 之一，这些常量都定义在 `ResultSet` 接口中。\n\n#### java.sql.ResultSet 1.1\n\n*   `int getType()`\
  \ 1.2\n    返回此结果集的类型——`TYPE_FORWARD_ONLY`、`TYPE_SCROLL_INSENSITIVE` 或 `TYPE_SCROLL_SENSITIVE`\
  \ 之一。\n*   `int getConcurrency()` 1.2\n    返回此结果集的并发设置——`CONCUR_READ_ONLY` 或 `CONCUR_UPDATABLE`\
  \ 之一。\n*   `boolean previous()` 1.2\n    将光标移动到上一行。如果光标位于某行，则返回 `true`；如果光标位于第一行之前，则返回\
  \ `false`。\n*   `int getRow()` 1.2\n    获取当前行的号。行从 `1` 开始编号。\n*   `boolean absolute(int\
  \ r)` 1.2\n    将光标移动到第 `r` 行。如果光标位于某行，返回 `true`。\n*   `boolean relative(int d)`\
  \ 1.2\n    将光标移动 `d` 行。如果 `d` 为负数，则光标向后移动。如果光标位于某行，返回 `true`。\n*   `boolean first()`\
  \ 1.2\n*   `boolean last()` 1.2\n    将光标移动到第一行或最后一行。如果光标位于某行，返回 `true`。\n*   `void\
  \ beforeFirst()` 1.2\n*   `void afterLast()` 1.2\n    将光标移动到第一行之前或最后一行之后。\n*   `boolean\
  \ isFirst()` 1.2\n*   `boolean isLast()` 1.2\n    测试光标是否在第一行或最后一行。\n*   `boolean\
  \ isBeforeFirst()` 1.2\n*   `boolean isAfterLast()` 1.2\n    测试光标是否在第一行之前或最后一行之后。\n\
  *   `void moveToInsertRow()` 1.2\n    将光标移动到插入行。插入行是一个用于通过 `updateXxx` 和 `insertRow`\
  \ 方法插入新数据的特殊行。\n*   `void moveToCurrentRow()` 1.2\n    将光标从插入行移回到调用 `moveToInsertRow`\
  \ 方法时所所在的行。\n*   `void insertRow()` 1.2\n    将当前行插入数据库。\n*   `void deleteRow()`\
  \ 1.2\n    立即从结果集和数据库中删除该行。\n*   `void updateXxx(String columnName, Object value)`\
  \ 1.2\n    在数据库中更新当前行。\n*   `void updateXxx(int columnIndex, Object value)` 1.2\n\
  \    在数据库中更新当前行。\n*   `void updateRow()` 1.2\n    将当前行提交到数据库。\n*   `void cancelUpdates()`\
  \ 1.2\n    取消更新。\n\n#### java.sql.MetaData 1.1\n\n*   `boolean supportsResultSetType(int\
  \ type)` 1.2\n    如果数据库支持给定类型的结果集，则返回 `true`；`type` 是 `TYPE_FORWARD_ONLY`、`TYPE_SCROLL_INSENSITIVE`\
  \ 或 `TYPE_SCROLL_SENSITIVE` 之一，属于 `ResultSet` 接口。\n*   `boolean supportsResultSetConcurrency(int\
  \ type, int concurrency)` 1.2\n    如果数据库支持给定类型和并发性的结果集，则返回 `true`。\n\n## 5.7 Row\
  \ Sets\n\n可滚动结果集非常强大，但有一个主要的缺点：你需要在整个交互过程中保持数据库连接开启。然而，用户可能会离开电脑很长时间，导致连接被占用。这是不好的。在这种情况下，请使用行集（Row\
  \ Set）。当你需要将查询结果移动到应用程序的另一个层，或到另一个设备（如手机）时，行集也是合适的。你永远不想移动结果集——它的数据结构可能巨大，而且它绑定了数据库连接。\n\
  \n### 5.7.1 构建行集\n\n`javax.sql.rowset` 包提供了以下扩展 `RowSet` 接口的接口：\n\n*   `CachedRowSet`\
  \ 允许离线操作。我们将在节讨论缓存行集。\n*   `WebRowSet` 是可以保存到 XML 文件的缓存行集。该 XML 文件可以移动到 Web 应用程序的另一个层，由另一个\
  \ `WebRowSet` 对象打开。\n*   `FilteredRowSet` 和 `JoinRowSet` 接口支持行集的轻量操作，相当于 `SELECT`\
  \ 和 `JOIN` 操作。这些操作在存储在行集的数据上进行，无需建立数据库连接。\n*   `JdbcRowSet` 是 `ResultSet` 的薄封装。它增加了来自\
  \ `RowSet` 接口的有用方法。\n\n要获取缓存行集，调用：\n\n```\nRowSetFactory factory = RowSetProvider.newFactory();\n\
  CachedRowSet crs = factory.createCachedRowSet();\n```\n\n获取其他行集类型也有类似的方法。\n\n###\
  \ 5.7.2 缓存行集\n\n\n\n\n\n缓存行集（Cached row set）包含了结果集中的所有数据。由于 `CachedRowSet` 是 `ResultSet`\
  \ 接口的子接口，你可以像使用结果集一样完全使用缓存行集。缓存行集提供了一项重要优势：你可以关闭连接并仍然继续使用该行集。正如我们在示例列表 5.4 中的示例程序所示，这极大地简化了交互式应用程序的实现。每个用户命令仅需打开数据库连接、发布查询、将结果放入缓存行集中，然后关闭数据库连接。\n\
  \n甚至可以修改缓存行集中的数据。当然，这些修改不会立即反映到数据库中；你需要显式地发出请求来接受累积的更改。随后，`CachedRowSet` 将重新连接到数据库并发布\
  \ SQL 语句以写入这些累积的更改。\n\n你可以从结果集填充一个 `CachedRowSet`：\n\n```\nResultSet result = .\
  \ . .;\nRowSetFactory factory = RowSetProvider.newFactory();\nCachedRowSet crs =\
  \ factory.createCachedRowSet(); \ncrs.populate(result);\nconn.close(); // 现在可以安全关闭数据库连接了\n\
  ```\n\n或者，你可以让 `CachedRowSet` 对象自动建立连接。设置数据库参数：\n\n```\ncrs.setURL(\"jdbc:derby://localhost:1527/COREJAVA\"\
  );\ncrs.setUsername(\"dbuser\");\ncrs.setPassword(\"secret\");\n```\n\n然后设置查询语句和任何参数：\n\
  \n```\ncrs.setCommand(\"SELECT * FROM Books WHERE Publisher_Id = ?\");\ncrs.setString(1,\
  \ publisherId);\n```\n\n最后，用查询结果填充行集：\n\n```\ncrs.execute();\n```\n\n此调用将建立数据库连接、发布查询、填充行集并断开连接。\n\
  \n如果你的查询结果非常非常大，你可能不想将其全部放入行集中。毕竟，你的用户可能只查看几行。在这种情况下，请指定一个页面大小：\n\n```\nCachedRowSet\
  \ crs = . . .;\ncrs.setCommand(command);\ncrs.setPageSize(20);\n. . .\ncrs.execute();\n\
  ```\n\n现在你只会得到 20 行。若要获取下一批行，请调用：\n\n```\ncrs.nextPage();\n```\n\n你可以使用与结果集相同的方法来检查和修改行集。如果你修改了行集的内容，必须通过调用以下方法将其写回数据库：\n\
  \n```\n\ncrs.acceptChanges(conn);\n```\n\n或\n\n```\ncrs.acceptChanges();\n```\n\n\
  只有当你为行集配置了连接到数据库所需的信息（如 URL、用户名和密码）时，第二个调用才起作用。\n\n在第 5.6.2 节中，你已经看到所有的结果集都是可更新的。同样，包含复杂查询结果的行集将无法将其更改写回数据库。如果你的行集包含来自单个表的数据，那么就是安全的。\n\
  \n如果你是从结果集填充行集的，该行集并不知道要更新的表名。你需要调用 `setTableName` 来设置表名。\n\n如果在你填充行集后，数据库中的数据发生了变化，就会出现另一种复杂性。这显然是出现问题的迹象，可能导致数据不一致。引用实现会检查原始行集值（即编辑前的值）是否与数据库中的当前值相同。如果是，则将其替换为编辑后的值；否则，将抛出\
  \ `SyncProviderException` 且不写入任何更改。其他实现可能会使用其他的同步策略。\n\n### javax.sql.RowSet 1.4\n\
  \n* `String getURL()`\n* `void setURL(String url)`\n  获取或设置数据库 URL。\n* `String getUsername()`\n\
  * `void setUsername(String username)`\n  获取或设置连接数据库的用户名。\n* `String getPassword()`\n\
  * `void setPassword(String password)`\n  获取或设置连接数据库的密码。\n* `String getCommand()`\n\
  * `void setCommand(String command)`\n  获取或设置用于填充此行集的执行执行命令。\n* `void execute()`\n\
  \  通过发布用 `setCommand` 设置的语句来填充此行集。为了让驱动管理器获取连接，必须设置 URL、用户名和密码。\n\n### javax.sql.rowset.CachedRowSet\
  \ 5.0\n\n* `void execute(Connection conn)`\n  通过发布用 `setCommand` 设置的语句来填充此行集。此方法使用给定的连接并关闭。\n\
  * `void populate(ResultSet result)`\n  使用给定结果集的数据填充此缓存行集。\n* `String getTableName()`\n\
  * `void setTableName(String tableName)`\n  获取或设置填充此缓存行集的表名。\n* `int getPageSize()`\n\
  * `void setPageSize(int size)`\n  获取或设置页面大小。\n* `boolean nextPage()`\n* `boolean\
  \ previousPage()`\n  加载下一页或上一页行。如果有下一页或上一页，则返回 `true`。\n* `void acceptChanges()`\n\
  * `void acceptChanges(Connection conn)`\n  重新连接到数据库并写入编辑行集产生的更改。如果由于数据库数据已更改而无法写回，可能会抛出\
  \ `SyncProviderException`。\n\n### javax.sql.rowset.RowSetProvider 7\n\n* `static\
  \ RowSetFactory newFactory()`\n  创建一个行集工厂。\n\n### javax.sql.rowset.RowSetFactory\
  \ 7\n\n* `CachedRowSet createCachedRowSet()`\n* `FilteredRowSet createFilteredRowSet()`\n\
  * `JdbcRowSet createJdbcRowSet()`\n* `JoinRowSet createJoinRowSet()`\n* `WebRowSet\
  \ createWebRowSet()`\n  创建一个指定类型的行集。\n\n## 5.8 元数据（Metadata）\n\n在前面的节中，你学习了如何填充、查询和更新数据库表。然而，\
  \ JDBC 可以提供有关数据库及其结构的额外信息。例如，你可以获取特定数据库的表列表或表的列名和类型。对于实现具有预定义数据库的应用程序来说，这些信息并不有用。毕竟如果你设计了表，你就知道它们的结构。但对于编写通用工具的程序员来说非常有用。\n\
  \n在 SQL 中，描述数据库或其部分的数据被称为元数据（以与数据库存储的实际数据区分来）。你可以获取三种元数据：关于数据库的、关于结果集的以及关于准备语句参数的。\n\
  \n要获取更多数据库信息，从数据库连接请求 `DatabaseMetaData` 类型的对象。\n\n```\nDatabaseMetaData meta =\
  \ conn.getMetaData();\n```\n\n使用此对象获取数据库信息。例如，调用\n\n```\nResultSet mrs = meta.getTables(null,\
  \ null, null, new String[] { \"TABLE\" });\n```\n\n返回一个包含数据库所有表信息的结果集。（该方法的其他参数参见本节末尾的\
  \ API 注。）\n\n结果集的每行包含一个表的信息。第三列是表名。（参见 API 注了解其他列。）以下循环收集了所有表名：\n\n```\nwhile (mrs.next())\n\
  \   tableNames.add(mrs.getString(3));\n```\n\n数据库元数据还有第二个重要用途。数据库非常复杂，SQL 标准为变性留下了大量空间。`DatabaseMetaData`\
  \ 接口中有一百多个方法可以查询数据库，包括具有此类奇特名称的调用：\n\n```\nmeta.supportsCatalogsInPrivilegeDefinitions()\n\
  ```\n\n和\n\n```\nmeta.nullPlusNonNullIsNull()\n```\n\n显然，这些是针对具有特殊需求的高级用户的——特别是那些需要编写可以在多个数据库上运行的高移植性代码的用户。\n\
  \n\n\n\n\n`DatabaseMetaData` 接口提供了有关数据库的数据。第二个元数据接口 `ResultSetMetaData` 报告有关结果集的信息。每当你从查询获得一个结果集时，都可以查询列数以及每列的名称、类型和字段宽度。这是一个典型的循环：\n\
  \n```\nResultSet rs = stat.executeQuery(\"SELECT * FROM \" + tableName);\nResultSetMetaData\
  \ rsmd = rs.getMetaData();\nfor (int i = 1; i <= rsmd.getColumnCount(); i++)\n{\n\
  \   String columnName = rsmd.getColumnLabel(i);\n   int columnWidth = rsmd.getColumnDisplaySize(i);\n\
  \   . . .\n}\n```\n\n如果你有一个预编译语句（prepared statement），可以获取执行该语句时返回的结果集元数据：\n\n```\n\
  PreparedStatement pstat = conn.prepareStatement(. . .);\nResultSetMetaData rsmd\
  \ = pstat.getMetaData();\n```\n\n第三种元数据描述了预编译语句的参数：\n\n```\nParameterMetaData pmd\
  \ = pstat.getParameterMetaData();\nfor (int i = 1; i <= pmd.getParameterCount())\n\
  {\n   System.out.println(pmd.getParameterTypeName(i));\n}\n```\n\nListing 5.4 中的程序使用元数据来让你浏览数据库中的所有表并进行简单的编辑。该程序还说明了缓存行集（cached\
  \ row set）的使用。\n\n配套代码有一个更精的 GUI 版本。顶部的组合框显示数据库中的所有表。选择其中一个，框架中心将填充该表的字段名和第一行的值，如图\
  \ 5.6 所示。点击“Next”（下一个）和“Previous”（上一个）来滚动查看表中的行。你还可以删除一行并编辑 `String` 类型的值。点击“Save”（保存）按钮将更改保存到数据库。\n\
  \n![Figure](img/fig04-08.jpg)图 5.6：`ViewDB` GUI \n\n示例程序向你展示了如何实现处理任意表的工具。许多数据库和\
  \ IDE 都带有更复杂的工具来查看和编辑表。如果你倾向于使用独立程序，可以查看 DBeaver ([`dbeaver.io`](https://dbeaver.io))\
  \ 或 SQuirreL ([`squirrelsql.org`](https://squirrelsql.org))。这些程序可以用于任何 JDBC 数据库。\n\
  \nListing 5.4 view/ViewDB2.java\n\n```java\npackage view;\n\nimport java.io.*;\n\
  import java.nio.file.*;\nimport java.sql.*;\nimport java.util.*;\n\nimport javax.sql.rowset.*;\n\
  \nimport util.*;\n\n/**\n * 此程序使用元数据显示数据库中的任意表。\n * @version 1.0 2023-08-16\n *\
  \ @author Cay Horstmann\n */\npublic class ViewDB2\n{\n   private CachedRowSet crs;\n\
  \   private Scanner console;\n\n   record Column(String label, int width, String\
