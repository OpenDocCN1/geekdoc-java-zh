  \ path)`\n* `static boolean isDirectory(Path path)`\n* `static boolean isSymbolicLink(Path\
  \ path)`\n  检查路径指定的文件具有指定的属性。\n\n* `static long size(Path path)`\n  获取以字节为单位的文件大小。\n\
