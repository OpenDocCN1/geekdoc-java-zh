  \n`java.awt.AlphaComposite`\n\n* `static AlphaComposite getInstance(int rule)`\n\
  \n    构造一个组合。\n\n* `static AlphaComposite getInstance(int rule, float sourceAlpha)`\n\
  \n    构造组合。\n\n## 栅格图像\n\nJava2D API 允许你创建由线条、曲线和区域组成的图形。这是一个“矢量”API，因为你指定的是形状的数学属性。然而，对于由像素组成的图像，你需要处理“栅格”数据。后续章节将介绍如何处理栅格图像。\n\
  \n### 图像读取器和写入器\n\n`javax.imageio` 包包含了对几种常见格式的读写支持，以及一个允许第三方为其他格式添加读取器写入器的框架。GIF、JPEG、PNG、BMP（Windows\
  \ 位图）和 WBMP（无线位图）格式都是支持的。\n\n该库的基础操作非常简单。要加载图像，使用 `ImageIO` 类的静态 `read` 方法：\n\n\
  ```\nFile f = . . .;\nBufferedImage image = ImageIO.read(f);\n```\n\n`ImageIO` 类根据文件类型选择合适的读取器。它可能会参考文件扩展名和文件开头的“魔数”。如果没有找到合适的读取器或读取器无法解码文件内容，`read`\
  \ 方法将返回 `null`。\n\n将图像写入文件同样简单：\n\n```\nFile f = . . .;\nString format = . . .;\n\
  ImageIO.write(image, format, f);\n```\n\n在这里，格式字符串是一个用于标识图像格式的字符串，例如 `\"JPEG\"`\
  \ 或 `\"PNG\"`。`ImageIO` 类会选择合适的写入器并保存文件。\n\n### 获取图像文件类型的读取器和写入器\n\n\n\n\n\n对于超出\
  \ `ImageIO` 类静态 `read` 和 `write` 方法的更高级图像读写操作，你首先需要获取相应的 `ImageReader` 和 `ImageWriter`\
  \ 对象。`ImageIO` 类列出了匹配以下任一项的读取器和写入器：\n\n*   一种图像格式（例如 `\"JPEG\"`）\n*   文件后缀名（例如 `\"\
  jpg\"`）\n*    MIME 类型（例如 `\"image/jpeg\"`）\n\nMIME 是多用途互联网邮件扩展（Multipurpose Internet\
  \ Mail Extensions）标准。MIME 标准定义了如 `image/jpeg` 和 `application/pdf` 等常见数据格式。\n\n例如，你可以通过以下方式获取读取\
  \ JPEG 文件的读取器：\n\n```\nImageReader reader = null;\nIterator<ImageReader> iter =\
  \ ImageIO.getImageReadersByFormatName(\"JPEG\");\nif (iter.hasNext()) reader = iter.next();\n\
  ```\n\n`getImageReadersBySuffix` 和 `getImageReadersByMIMEType` 方法列出了匹配文件扩展名或 MIME\
  \ 类型的读取器。\n\n`ImageIO` 类可能会找到多个都能读取特定图像类型的读取器。在这种情况下，你必须从中选择一个，但并不清楚如何决定哪一个是最好的。要获取有关读取器的更多信息，可以获取其服务提供接口：\n\
  \n```\nImageReaderSpi spi = reader.getOriginatingProvider();\n```\n\n然后你可以获取厂商名称和版本号：\n\
  \n```\nString vendor = spi.getVendor();\nString version = spi.getVersion();\n```\n\
  \n这些信息可能可以帮助你在选项之间做出决定——或者你可能只需向程序用户展示读取器列表并让他们自行选择。目前，我们假设第一个列出的读取器就足够了。\n\n在 Listing\
  \ 12.20 中的示例程序中，我们想要找到所有可用读取器的文件后缀名，以便在文件过滤器中使用它们。使用静态方法 `ImageIO.getReaderFileSuffixes`\
  \ 来此目的：\n\n```\nString[] extensions = ImageIO.getWriterFileSuffixes();\nchooser.setFileFilter(new\
  \ FileNameExtensionFilter(\"Image files\", extensions));\n```\n\n对于保存文件，我们需要付出更多努力。我们希望向用户展示所有支持的图像类型的菜单。遗憾的是，`ImageIO`\
  \ 类的 `getWriterFormatNames` 返回了一个相当奇怪的列表，包含冗余名称，例如\n\n```\njpg, BMP, bmp, JPG, jpeg,\
  \ wbmp, png, JPEG, PNG, WBMP, GIF, gif\n```\n\n这并不是人们想要在菜单中展示的内容。需要的是一个“首选”格式名称列表。我们为此目的提供了一个辅助方法\
  \ `getWriterFormats`（参见 Listing 12.20）。我们查找与每个格式名称关联的第一个写入器。然后询问它的格式名称是什么，希望它会将最流行的格式列在第一个。事实上，对于\
  \ JPEG 写入器，这种情况运行良好——它在其他选项之前列出了 `\"JPEG\"`。（另一方面，PNG 写入器将小写的 `\"png\"` 列在 `\"PNG\"\
  ` 之前。我们希望这种行为在未来的某个时候得到解决。目前，我们强制将小写名称转换为大写。）一旦我们选择了一个首选名称，就会从原始集合删除所有备用名称。继续进行直到处理所有格式名称。\n\
  \n### 12.6.3 使用多幅图像读写文件\n\n某些文件——特别是动态 GIF 文件——包含多幅图像。`ImageIO` 类的 `read` 方法读取单幅图像。要读取多幅图像，请将输入源（例如输入流或文件）转换为\
  \ `ImageInputStream`。\n\n```\nInputStream in = . . .;\nImageInputStream imageIn\
  \ = ImageIO.createImageInputStream(in);\n```\n\n然后，将图像输入流挂载到读取器：\n\n```\nreader.setInput(imageIn,\
  \ true);\n```\n\n第二个参数表示输入处于“仅向前寻”模式。否则，将使用随机访问，通过在读取时缓冲流输入或使用随机文件访问来实现。某些操作需要随机访问。例如，要查找\
  \ GIF 文件中的图像数量，你需要读取整个文件。如果你随后想获取图像，则必须再次读取输入。\n\n这种考虑仅在你从流读取、输入包含多幅图像，且图像格式在在头文件中没有包含你所请求的信息（如图像计数）时才重要。如果你从文件读取，简单地使用：\n\
  \n```\nFile f = . . .;\nImageInputStream imageIn = ImageIO.createImageInputStream(f);\n\
  reader.setInput(imageIn);\n```\n\n一旦你有了读取器，就可以通过调用方法读取输入中的图像：\n\n```\nBufferedImage\
  \ image = reader.read(index);\n```\n\n其中 `index` 是图像索引，从 `0` 开始。\n\n如果输入处于“仅向前寻”模式，你继续读取图像直到\
  \ `read` 方法抛出 `IndexOutOfBoundsException`。否则，你可以调用 `getNumImages` 方法：\n\n```\nint\
  \ n = reader.getNumImages(true);\n```\n\n在这里，参数表示你允许搜索输入以确定图像数量。如果输入处于“仅向前寻”模式，该方法将抛出\
  \ `IllegalStateException`。或者，你可以将“允许搜索”参数设置为 `false`。那么，如果无法通过搜索确定图像数量，`getNumImages`\
  \ 方法将返回 `-1`。\n\n某些文件包含缩略图——用于预览的图像较小版本。你可以通过调用获取缩略图数量：\n\n```\nint count = reader.getNumnails(index);\n\
  ```\n\n然后你获取特定索引的：\n\n```\nBufferedImage thumbnail = reader.getThumbnail(index);\n\
  ```\n\n有时你可能在实际获取图像之前想获取图像尺寸——特别是当图像巨大或来自慢连接时。使用以下调用：\n\n```\nint width = reader.getWidth(index);\n\
  int height = reader.getHeight(index);\n```\n\n来获取给定索引图像的尺寸。\n\n要写入带有多幅图像的文件，你首先需要一个\
  \ `ImageWriter`。`ImageIO` 类可以出能够写入特定格式的写入器：\n\n```\nString format = . . .;\nImageWriter\
  \ writer = null;\nIterator<ImageWriter> iter = ImageIO.getImageritersByFormatName(format);\n\
  if (iter.hasNext()) writer = iter.next();\n```\n\n接下来，将输出流或文件转换为 `ImageOutputStream`\
  \ 并将其挂载到写入器。例如：\n\n```\nFile f = . . .;\nImageOutputStream imageOut = ImageIO.createImageOutputStream(f);\n\
  writer.setOutput(imageOut);\n```\n\n你必须将每幅图像封装成 `IIOImage` 对象。你可以选择提供缩略图列表和图像元数据（如压缩算法和颜色信息）。在本示例中，我们两者都使用\
  \ `null`；更多信息请参见 API 文档。\n\n```\nvar iioImage = new IIOImage(images[i], null, null);\n\
  ```\n\n要写入第一幅图像，使用 `write` 方法：\n\n```\nwriter.write(new IIOImage(images[0], null,\
  \ null));\n```\n\n对于后续图像，使用：\n\n```\nif (writer.canInsertImage(i))\n   writer.writeInsert(i,\
  \ iioImage, null);\n```\n\n第三个参数可以包含一个 `ImageWriteParam` 对象以设置图像写入细节，如分块和压缩；使用 `null`\
  \ 默认值。\n\n并不是所有文件格式都能处理多幅图像。在这种情况下，对于 `i > 0`，`canInsertImage` 方法将返回 `false`，且只保存单幅图像。\n\
  \nListing 12.20 中的程序允许你加载和保存 Java 库提供读取器和写入器的格式的文件。该程序显示多幅图像（参见图 12.55），但不显示缩略图。\n\
  \n![图](img/fig07-27.jpg)图 12.55: 一幅动态 GIF 图像\n\n\n\n\n\n```java\npackage imageIO;\n\
  \nimport java.awt.image.*;\nimport java.io.*;\nimport java.util.*;\n\nimport javax.imageio.*;\n\
  import javax.imageio.stream.*;\nimport javax.swing.*;\nimport javax.swing.filechooser.*;\n\
  \n/**\n * 此框架显示加载的图像。菜单包含加载和保存文件的菜单项。\n */\npublic class ImageIOFrame extends JFrame\n\
  {\n   private static final int DEFAULT_WIDTH = 400;\n   private static final int\
  \ DEFAULT_HEIGHT = 400;\n\n   private static Set<String> writerFormats = getWriterFormats();\n\
  \n   private BufferedImage[] images;\n\n   public ImageIOFrame()\n   {\n      setSize(DEFAULT_WIDTH,\
  \ DEFAULT_HEIGHT);\n\n      var fileMenu = new JMenu(\"File\");\n      var openItem\
