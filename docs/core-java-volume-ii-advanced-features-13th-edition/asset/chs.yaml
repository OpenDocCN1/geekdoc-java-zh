  \ for \" + mimeType);\n   }\n}\n```\n\n### 12.7.5. 打印属性\n\n打印服务 API 包含了一组复杂的接口和类，用于指定各种属性。属性分为四组重要的类别。前两组指定了对打印机的请求。\n\
  \n- 打印请求属性（`Print request attributes`）为打印作业中的所有 `doc` 对象请求特定功能，例如双面打印或纸张尺寸。\n- 文档属性（`Doc\
  \ attributes`）是适用于单个 `doc` 对象的请求属性。\n\n另外两个属性包含关于打印机和作业状态的信息。\n\n- 打印服务属性（`Print\
  \ service attributes`）提供有关打印服务的信息，例如打印机品牌和型号，或打印机当前是否接受作业。\n- 打印作业属性（`Print job\
  \ attributes`）提供有关特定打印作业状态的信息，例如作业是否已经完成。\n\n为了描述各种属性，有一个接口 `Attribute`，它包含多个子接口：\n\
  \n```\nPrintRequestAttribute\nDocAttribute\nPrintServiceAttribute\nPrintJobAttribute\n\
  SupportedValuesAttribute\n```\n\n具体的属性类实现了这些接口中的一个或多个。例如，`Copies` 类对象描述了打印输出的副本数量。该类同时实现了\
  \ `PrintRequestAttribute` 和 `PrintJobAttribute` 接口。显然，一个打印请求可以包含对多份副本的请求。相反，打印作业的属性可能是这些副本中实际打印了多少份。该数字可能会较低，也许是因为打印机的限制。\n\
  \n`SupportedValuesAttribute` 表明属性值反映的不是实际请求或状态，而是服务的能力。例如，`Copies` 类可能描述打印机支持 99\
  \ 副本。\n\n\n\n最后，属性根据它们可以拥有的值进行组织。`Copies` 属性可以有任何整数值。`Copies` 类继承自 `IntegerSyntax`\
  \ 类，该类处理所有整数值类型的属性。`getValue` 方法返回属性的整数值，例如：\n\n```\nint n = copies.getValue();\n\
  ```\n\n这些类\n\n```\nTextSyntax\nDateTimeSyntax\nURISyntax\n```\n\n封装了一个字符串、一个日期和时间值或一个\
  \ URI。\n\n最后，许多属性可以取有限数量的值。例如，`PrintQuality` 属性有三个设置：草稿（draft）、普通（normal）和高质（high）。它们由三个常量表示：\n\
  \n```\nPrintQuality.DRAFT\nPrintQuality.NORMAL\nPrintQuality.HIGH\n```\n\n具有有限数量数量的属性类继承自\
  \ `EnumSyntax` 类，该类提供了许多方便方法，能够以类型安全的方式设置这些枚举。在使用此类属性时，你不需要担心其内部机制。只需将具名值添加到属性集中即可：\n\
  \n```attributes\nattributes.add(PrintQuality.HIGH);\n```\n\n以下是检查属性值的方法：\n\n```\n\
  if (attributes.get(PrintQuality.class) == PrintQuality.HIGH)\n   . . .\n```\n\n\
