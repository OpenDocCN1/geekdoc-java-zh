  \ IIOMetadata)`\n从图像构造 `IIOImage`，以及可选的缩略图和元数据。\n\n### 12.6. 图像操作\n\n假设你有一幅图像并想要改进它的外观。你需要访问图像的单个像素并将其替换为其他像素。或者，你可能想从头计算图像的像素。`BufferedImage`\
  \ 类让你控制图像中的像素，而实现 `BufferedImageOp` 接口类让你转换图像。\n\nJDK 1.0 有了一个完全不同的、更复杂的图像框架，它是按行扫描从数字相机、扫描仪或绘图程序读取图像的。在本节中，我们不会讨论该框架。\n\
  \n要创建一个图像，按照通常的方法构造 `BufferedImage` 对象：\n\n```java\nimage = new BufferedImage(width,\
  \ height, BufferedImage.TYPE_INT_ARGB);\n```\n\n现在，调用 `getRaster` 方法获取 `WritableRaster`\
  \ 类型的对象。你将使用该对象访问并修改图像的像素。\n\n```java\nWritableRaster raster = image.getRaster();\n\
  ```\n\n`setPixel` 方法允许设置单个像素。这里的复杂性在于你不能简单地将像素设置为 `Color` 值。你必须知道 `BufferedImage`\
  \ 如何指定颜色值。这取决于图像的类型。如果你的图像类型为 `TYPE_INT_ARGB`，则每个像素由四个值描述——红、绿、蓝和 Alpha，每个值都在 `0`\
  \ 到 `255` 之间。你必须以整数数组的形式提供它们：\n\n```java\nint[] black = { 0, 0, 0, 255 };\nraster.setPixel(i,\
  \ j, black);\n```\n\n在 Java 2D API 的术语中，这些值被称为像素采样值。还有类型为 `float[]` 和 `double[]`\
  \ 的 `setPixel` 方法。然而，你需要放入这些数组的值不是在 `0.0` 到 `1.0` 之间的归一化颜色值。\n\n```java\nfloat[]\
  \ red = { 1.0F, 0.0F, 0.0F, 1.0F };\nraster.setPixel(i, j, red); // 错误\n```\n\n\
  无论数组类型是什么，你都需要提供 `0` 到 `255` 之间的值。\n\n你可以使用 `setPixels` 方法提供批量像素。指定要设置的矩形的起始位置、宽度和高度。然后，提供一个包含所有像素采样值的数组。例如，如果你的\
  \ `BufferedImage` 类型为 `TYPE_INT_ARGB`，提供第一个像素的红、绿、蓝、Alpha 值，然后第二个像素的红、绿、蓝、Alpha\
  \ 值，以此此类推。\n\n```java\nvar pixels = new int[4 * width * height];\npixels[0] = ...;\
  \ // 第一个像素的红色值\npixels[1] = ...; // 第一个像素的绿色值\npixels[2] = ...; // 第一个像素的蓝色值\npixels[3]\
  \ = ...; // 第一个像素的 Alpha 值\n...\nraster.setPixels(x, y, width, height, pixels);\n\
  ```\n\n相反，要读取像素，使用 `getPixel` 方法。提供一个四个整数数组来存储采样值。\n\n```java\nvar sample = new\
  \ int[4];\nraster.getPixel(x, y, sample);\nvar color = new Color(sample[0], sample[1],\
  \ sample[2], sample[3]);\n```\n\n你可以使用 `getPixels` 方法读取多个像素。\n\n```java\nraster.getPixels(x,\
  \ y, width, height, samples);\n```\n\n如果你使用的是 `TYPE_INT_ARGB` 以上的图像类型，并且知道该类型如何表示像素值，你仍然可以使用\
  \ `getPixel/setPixel`。颜色模型可以转换采样值数组和标准 RGB 模型。如果你需要处理一个未知的图像类型，那么你需要费更多精力。颜色模型并不像你想象的那么标准。RGB\
  \ 值的外观取决于显示设备的特性。结果是相同的 RGB 值在不同设备上看起来很大。色彩联盟 ([`www.color.org`](https://www.color.org))\
  \ 建议所有颜色数据都附带一个 ICC 配置文件，指定颜色如何映射到标准形式。该规范是由国际照明委员会设计的，即 CIE ([`www.cie.co.at`](https://www.cie.co.at))，这是一个负责照明和色彩提供技术指导的国际组织。该规范是将人眼可以感知的任何颜色表示为\
  \ X、Y、Z 坐标的标准方法。（有关更多信息，请参见 John F. Hughes 等人的《Computer Graphics: Principles and\
  \ Practice, Third Edition》第 28 章。）\n\nICC 配置文件是复杂的。一个更简单的建议标准，称为 sRGB ([`www.w3.org/Graphics/Color/sRGB.html`](https://www.w3.org/Graphics/Color/sRGB.html))，规定了\
  \ RGB 值与 1931 CIE 值之间的精确映射，该映射适用于典型的色彩显示器。Java 2D API 在 RGB 和其他颜色空间之间转换时使用该映射。\n\
  \n`getColorModel` 方法返回颜色模型：\n\n```java\nColorModel model = image.getColorModel();\n\
  ```\n\n要找到像素的颜色值，调用 `Raster` 类的 `getDataElements` 方法。该调用返回一个包含颜色模型特定描述的 `Object`。\n\
  \n```java\nObject data = raster.getDataElements(x, y, null);\n```\n\n`getDataElements`\
  \ 方法返回的对象实际上是采样值的数组。你不需要知道这一点就可以处理该对象，但这解释了为什么该方法命名为 `getDataElements`。\n\n颜色模型可以将该对象转换为标准的\
  \ ARGB 值。`getRGB` 方法返回一个 `int` 值，其 Alpha、红、绿、蓝值被封装在四个八位块中。你可以使用 `Color(int argb,\
  \ boolean hasAlpha)` 构造函数从该整数构造 `Color` 值：\n\n\n\n\n\n```\nint argb = model.getRGB(data);\n\
  var color = new Color(argb, true);\n```\n\n要将像素设置为特定颜色，请反向执行这些步骤。`Color` 类的 `getRGB`\
  \ 方法会产生一个包含 alpha、红、绿、蓝分值的 `int` 值。将该值传递给 `ColorModel` 类的 `getDataElements` 方法。返回值是一个包含该颜色模型特定颜色值描述的\
  \ `Object`。将该对象传递给 `WritableRaster` 类的 `setDataElements` 方法。\n\n```\nint argb =\
  \ color.getRGB();\nObject data = model.getDataElements(argb, null);\nraster.setDataElements(x,\
  \ y, data);\n```\n\n为了说明如何使用这些方法从单个像素构建图像，我们遵循了传统，绘制了一个曼德尔博罗集合（Mandelbrot set），如图的图\
  \ 12.56 图 12.56: 曼德尔博罗集合\n\n曼德尔博罗集合的想法是平面上的每个点都与一个数字序列相关。如果该序列是有界的，则给该点上色。如果它“逃向无穷大”，则将其保持透明。\n\
  \n以下是构造最简单的曼德尔博罗集合的方法。对于每个点 (*a*, *b*)，查看从 (*x*, *y*) = (0, 0) 开始迭代的序列：\n\n*x*[new]\
  \ = *x*² – *y*² + *a*\n\n*y*[new] = 2 · *x* · *y* + *b*\n\n结果证明，如果 *x* 或 *y* 任何时候大于\
  \ 2，那么序列就会逃向无穷大。只有对应于导致边界序列的点 (*a*, *b*) 像素会被上色。（数字序列的公式最终源于复数数学；我们直接认为它们是正确的。）\n\
  \n列表 12.21\n   {      \n      BufferedImage image = makeMandelbrot(IMAGE_WIDTH,\
  \ IMAGE_HEIGHT);\n      add(new JLabel(new ImageIcon(image)));\n      pack();\n\
  \   }\n\n   /**\n    * 制作曼德尔博罗图像。\n    * @param width 宽度\n    * @parah height 高\n\
  \    * @return 图像\n    */\n   public BufferedImage makeMandelbrot(int width, int\
  \ height)\n   {\n      var image = new BufferedImage(width, height, BufferedImage.TYPE_INT_ARGB);\n\
  \      WritableRaster raster = image.getRaster();\n      ColorModel model = image.getColorModel();\n\
  \n      Color fractalColor = Color.RED;\n      int argb = fractalColor.getRGB();\n\
  \      Object colorData = model.getDataElements(argb, null);\n\n      for (int i\
  \ = 0; i < width; i++)\n         for (int j = 0; j < height; j++)\n         {\n\
  \            double a = XMIN + i * (XMAX - XMIN) / width;\n            double b\
  \ = YMIN + j * (YMAX - YMIN) / height;\n            if (!escapesToInfinity(a, b))\
  \ raster.setDataElements(i, j, colorData);\n         }\n      return image;\n  \
  \ }\n\n   private boolean escapesToInfinity(double a, double b)\n   {\n      double\
  \ x = 0.0;\n      double y = 0.0;\n      int iterations = 0;\n      while (x <=\
  \ 2 && y <= 2 && iterations < MAX_ITERATIONS)\n      {\n         double xnew = x\
  \ * x - y * y + a;\n         double ynew = 2 * x * y + b;\n         x = xnew;\n\
  \         y = ynew;\n         iterations++;\n      }      \n      return x > 2 ||\
  \ y > 2;\n   }\n}\n```\n\n`java.awt.image.BufferedImage` 1.2\n\n*   `BufferedImage(int\
