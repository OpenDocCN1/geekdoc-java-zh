  \ format, int pageNumber)`\n\n    渲染页面并返回 `PAGE_EXISTS`，或者返回 `NO_SUCH_PAGE`。\n\n\
  `java.awt.print.PrinterJob` 1.2\n\n*   `static PrinterJob getPrinterJob()`\n\n \
  \   返回打印作业对象。\n\n*   `PageFormat defaultPage()`\n\n    返回此打印机的默认页面格式。\n\n*   `boolean\
