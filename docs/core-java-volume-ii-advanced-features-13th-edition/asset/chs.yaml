  \ IOException exc)`\n  在访问目录之前和之后调用。默认实现什么都不做并继续。然而，如果 `exc` 不为空，它将被抛出，导致访问带该异常终止。\n\
  * `static FileVisitResult visitFileFailed(T path, IOException exc)`\n  如果在尝试获取给定文件的信息时抛出了异常，则会被调用。默认实现重新抛出该异常，导致访问带该异常终止。如果你想继续，请重写该方法。\n\
