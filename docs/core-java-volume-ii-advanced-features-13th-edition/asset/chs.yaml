  import java.awt.font.*;\nimport java.awt.geom.*;\nimport java.awt.print.*;\n\n/**\n\
  \ * 一个在多个页面上打印文本字符串的横幅。\n */\npublic class Banner implements Printable\n{\n   private\
  \ String message;\n   private double scale;\n\n   /**\n    * 构造横幅。\n    * @param\
  \ m 消息字符串\n    */\n   public Banner(String m)\n   {\n      message = m;\n   }\n\n\
  \   /**\n    * 获取此部分的页数。\n    * @param g2 绘图上下文\n    * @param pf 页面格式\n    * @return\
  \ 需要的页数\n    */\n   public int getPageCount(Graphics2D g2, PageFormat pf)\n   {\n\
  \      if (message.equals(\"\")) return 0;\n      FontRenderContext context = g2.getFontRenderContext();\n\
  \      var f = new Font(\"Serif\", Font.PLAIN, 72);\n      Rectangle2D bounds =\
  \ f.getStringBounds(message, context);\n      scale = pf.getImageableHeight() /\
  \ bounds.getHeight();\n      double width = scale * bounds.getWidth();\n      int\
  \ pages = (int) Math.ceil(width / pf.getImageableWidth());\n      return pages;\n\
  \   }\n\n   public int print(Graphics g, PageFormat pf, int page) throws PrinterException\n\
  \   {\n      var g2 = (Graphics2D) g;\n      if (page > getPageCount(g2, pf)) return\
  \ Printable.NO_SUCH_PAGE;\n      g2.translate(pf.getImageableX(), pf.getImageableY());\n\
  \n      drawPage(g2, pf, page);\n      return Printable.PAGE_EXISTS;\n   }\n\n \
  \  public void drawPage(Graphics2D g2, PageFormat pf, int page)\n   {\n      if\
  \ (message.equals(\"\")) return;\n      page--; // 考虑封页\n\n      drawCropMarks(g2,\
  \ pf);\n      g2.clip(new Rectangle2D.Double(0, 0, pf.getImageableWidth(), pf.getImageableHeight()));\n\
  \      g2.translate(-page * pf.getImageableWidth(), 0);\n      g2.scale(scale, scale);\n\
  \      FontRenderContext context = g2.getFontRenderContext();\n      var f = new\
  \ Font(\"Serif\", Font.PLAIN, 72);\n      var layout = new TextLayout(message, f,\
  \ context);\n      AffineTransform transform = AffineTransform.getTranslateInstance(0,\
  \ layout.getAscent());\n      Shape outline = layout.getOutline(transform);\n  \
  \    g2.draw(outline);\n   }\n\n   /**\n    * 在页面角处绘制 1/2 英的裁切线。\n    * @param g2\
  \ 绘图上下文\n    * @param pf 页面格式\n    */\n   public void drawCropMarks(Graphics2D g2,\
  \ PageFormat pf)\n   {\n      final double C = 36; // 裁切线长度 = 1/2 英\n      double\
  \ w = pf.getImageableWidth();\n      double h = pf.getImageableHeight();\n     \
  \ g2.draw(new Line2D.Double(0, 0, 0, C));\n      g2.draw(new Line2D.Double(0, 0,\
  \ C, 0));\n      g2.draw(new Line2D.Double(w, 0, w, C));\n      g2.draw(new Line2D.Double(w,\
  \ 0, w - C, 0));\n      g2.draw(new Line2D.Double(0, h, 0, h - C));\n      g2.draw(new\
  \ Line2D.Double(0, h, C, h));\n      g2.draw(new Line2D.Double(w, h, w, h - C));\n\
  \      g2.draw(new Line2D.Double(w, h, w - C, h));\n   }\n}\n\n/**\n * 此类打印一个带有标题的封面。\n\
