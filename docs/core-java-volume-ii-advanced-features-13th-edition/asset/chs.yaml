  \n    返回可用 `Collator` 对象的 `Locale` 数组。\n\n* `static Collator getInstance()`\n\n\
  * `static Collator getInstance(Locale l)`\n\n    返回默认或给定区域的比较器。\n\n* `int compare(String\
  \ a, String b)`\n\n    如果 `a` 在于 `b` 之前则返回负值，如果它们是相同的则返回 0，否则返回正值。\n\n* `boolean\
  \ equals(String a, String b)`\n\n    如果 `a` 和 `b` 是相同的则返回 `true`，否则返回 `false`。\n\
  \n* `void setStrength(int strength)`\n\n* `int getStrength()`\n\n    设置或获取比较器的强度。越强的比较器能区分更多的单词。强度值为\
  \ `Collator.PRIMARY`、`Collator.SECONDARY` 和 `Collator.TERTIARY`。\n\n* `void setDecomposition(int\
  \ decomp)`\n\n* `int getcompositon()`\n\n    设置或获取比较器的分解模式。比较器分解字符串越多，在判断两个字符串是否应该是相同的时就越严格。分解值为\
  \ `Collator.NO_DECOMPOSITION`、`Collator.CANONICAL_DECOMPOSITION` 和 `Collator.FULL_DECOMPOSITION`。\n\
  \n* `CollationKey getCollationKey(String a)`\n\n    返回一个包含字符分解形式的比较键，该形式可与另一个比较键进行快速比较。\n\
  \n\n\n\n\n`java.text.CollationKey` 1.1\n\n*   `int compareTo(CollationKey b)`\n\
  \    如果此键在 `b` 之前，则返回负值；如果它们被认为相同，返回 0；否则返回正值。\n\n`java.text.Normalizer` 6\n\n*\
  \   `static String normalize(CharSequence str, Normalizer.Form form)`\n    返回 `str`\
  \ 的规范化形式。`form` 值为 `NFD`、`NFKD`、`NFC` 或 `NFKC` 之一。\n\n## 7.5 消息格式化\n\nJava 库有一个\
  \ `MessageFormat` 类用于格式化变量文本。它类似于使用 `printf` 方法进行格式化，但支持本地化以及数字和日期的格式。我们将在后续章节中检查该机制。\n\
  \n### 7.5.1 格式化数字和日期\n\n这是一个典型的消息格式：\n\n```\n\"On {2}, a {0} destroyed {1} houses\
  \ and caused {3} of damage.\"\n```\n\n大括号中的数字是实际名称和值的占位符。静态方法 `MessageFormat.format`\n\
  \n允许你为变量替换值。它是一个“可变参数”方法，因此你可以如下所示提供参数：\n\n```\nString msg = MessageFormat.format(\"\
  On {2}, a {0} destroyed {1} houses and caused {3} of damage.\",\n      \"hurricane\"\
  , 99, new GregorianCalendar(1999, 0).getTime());\n```\n\n在这个示例中，占位符 `{0}` 被替换为 `\"\
  hurricane\"`，`{1}` 被替换为 `99`，依此类推。我们示例的结果是字符串\n\n```\nOn 1/99 12:00 AM, a hurricane\
  \ destroyed 99 houses and caused 10000 of damage.\n```\n\n这只是开始，但并不完美。我们不想显示时间“12:00\
  \ AM”，并且希望将损失金额以货币的形式打印。我们实现此的方法是为某些占位符提供可选格式：\n\n```\n\"On {2,date,long}, a {0}\
  \ destroyed {1} houses and caused {3,number,currency} of damage.\"\n```\n\n这段示例代码输出：\n\
  \n```\nOn January 1, 1999, a hurricane destroyed 99 houses and caused $100,000 of\
  \ damage.\n```\n\n通常，占位符索引后面可以跟一个 `type`（类型）和一个 `style`（样式）。用逗号分隔索引、类型和样式。类型可以是任意一种\n\
  \n```\nnumber\ntime\ndate\nchoice\n```\n\n如果类型是 `number`，则样式可以是：\n\n```\ninteger\n\
  currency\npercent\n```\n\n或者可以是 `DecimalFormat` 模式，例如 `$##0`——参见第 7.2.2 节获取可能的格式。\n\
  \n如果类型是 `time` 或 `date`，则样式可以是：\n\n```\nshort\nmedium\nlong\nfull\n```\n\n或者日期格式模式，例如\
  \ `yyyy-MM-dd`。（查看 `SimpleDateFormat` 类的文档以获取可能的格式。）\n\n要在消息格式字符串中包含大括号，请用单引号将其括起来，例如：`\"\
  A {0} is enclosed in '{' and '}'\"`。对于文本，最好使用弯曲的单引号：`\"{0}’s favorite symbols are\
  \ braces\"`。但如果你必须使用直单引号，则需要将其双写：\n\n```\nString template = \"<a href='{0}'>{1}</a>\"\
  ;\n```\n\n静态 `MessageFormat.format` 方法使用当前本地化来格式化值。要使用任意本地化格式化，你需要多花些，因为没有可以使用的“可变参数”方法。你需要将要格式化的值放入\
  \ `Object[]` 数组中，如下：\n\n```\nvar formatter = new MessageFormat(pattern, locale);\n\
  String message = formatter.format(new Object[] { values });\n```\n\n`java.text.MessageFormat`\
  \ 1.1\n\n*   `MessageFormat(String pattern)`\n*   `MessageFormat(String pattern,\
  \ Locale locale)`\n    使用指定的模式和本地化构造消息格式化对象。\n*   `void applyPattern(String pattern)`\n\
  \    将消息格式化对象的模式设置为指定的模式。\n*   `void setLocale(Locale locale)`\n*   `Locale getLocale()`\n\
  \    设置或获取用于消息中占位符的本地化。该本地化*仅*用于你通过调用 `applyPattern` 方法设置的后续模式。\n*   `static String\
  \ format(String pattern, Object... args)`\n    使用 `args[i]` 作为占位符 `{i}` 的输入来格式化模式字符串。\n\
  *   `StringBuffer format(Object args, StringBuffer result, FieldPosition pos)`\n\
  \    格式化此 `MessageFormat` 的模式。`args` 参数必须是一个对象数组。格式化后的字符串追加到 `result` 中并返回 `result`。如果\
  \ `pos` 等于 `new FieldPosition(MessageFormat.Field.ARGUMENT)`，它的 `beginIndex` 和 `endIndex`\
  \ 属性将被设置为替换 `{1}` 占位符的文本的位置。如果你不需要位置信息，请提供 `null`。\n\n`java.text.Format` 1.1\n\n\
  *   `String format(Object obj)`\n    根据此格式器的规则格式化给定对象。此方法调用 `format(obj, new StringBuffer(),\
  \ new FieldPosition(0)).toString()`。\n\n### 7.5.2 Choice 格式\n\n让我们仔细观察上一个节的模式：\n\
  \n```\n\"On {2}, a {0} destroyed {1} houses and caused {3} of damage.\"\n```\n\n\
  choice 格式是一个对序列，每个对包含\n\n*   *下限*\n*   *格式字符串*\n\n下限和格式字符串由 `#` 字符分隔，对之间由 `|` 字符分隔。例如，\n\
  \n```\n{1,choice,0#no houses|1#one house|2#{1} houses}\n```\n\n表 7.10 显示了该格式对于不同\
  \ `{1}` 值的效果。\n\n表 7.10：由 Choice 格式化的字符串\n\n| `{1}` | 结果 | `{1}` | 结果 |\n| --- |\
  \ --- | --- | --- |\n| 0 | `\"no houses\"` | 3 | `\"3 houses\"` |\n| 1 | `\"one\
  \ house\"` | -1 | `\"no houses\"` |\n\n为什么格式字符串中使用两次 `{1}`？当消息格式对 `{1}` 应用 choice\
  \ 格式且值为 `2` 时，choice 格式返回 `\"{1} houses\"`。该字符串随后再次被消息格式化，答案接到结果中。\n\n这个示例表明 choice\
  \ 格式的设计者有点糊。如果你有三个格式字符串，你需要两个限制来分隔它们。通常，你需要的限制比格式字符串的数量*少一个*。正如你在表 7.10 中所示，`MessageFormat`\
  \ 类忽略了第一个限制。\n\n如果该类的设计者意识到限制应该位于选择*之间*，语法将会清晰得多，例如\n\n```\nno houses|1|one house|2|{1}\
  \ houses // 不是实际格式\n```\n\n可以使用 `<` 符号表示如果下限严格小于值则应选择选择。\n\n你也可以使用 ≤ 符号（U+2264）作为\
  \ `#` 的同义词。如果你喜欢，甚至可以使用无限符号（U+221E）为第一个值指定下限为 –∞。\n\n理想情况下，我们希望消息随值变化，因此它读起来像\n\n\
  ```\nno houses\none house\n2\n```\n\n现在让我们转向受性别影响的文章。例如，在德语中，消息将是\n\n```\n\"On {2},\
  \ {0} zerstete {1} Häuser und richtete {3} an.\"\n```\n\n这特别适用于冠词随数量变化的语言。`choice`\
  \ 选项正是为此设计的。\n\n\n\n\n\n```\n-\n      ∞<no houses|0<one house|2\n\n      ≤{1} houses\
  \ \n```\n\n让我们完成自然灾害场景的示例。如果我们把选择字符串放在原始消息字符串中，就会得到以下格式指令：\n\n```java\nString pattern\
  \ = \"\"\"\nOn {2,date,long}, {0} destroyed {1,choice,0#no houses|1#one house|2#{1}houses}\
  \ \\\nand caused {3,number,currency} of damage.\n\"\"\";\n```\n\n或者，使用德语：\n\n```java\n\
  String pattern = \"\"\"\n{0} zerstörte am {2,date,long} {1,choice,0#kein Haus|1#ein\
  \ Haus|2#{1} Häuser} \\\nund richtete einen Schaden von {3,number,currency} an.\n\
  \"\"\";\n```\n\n注意，德语中的词序顺序不同，但你传递给 `format` 方法的对象的数组是**相同**的。格式字符串中占位符的顺序会自动处理词序顺序的变化。\n\
  \n## 7.6 文本边界\n\n`BreakIterator` 类将文本分段为字符、单词、句子或行。其迭代协议并不非常优雅：\n\n```java\nString\
  \ s = \"A man. A plan. Panama!\";\nBreakIterator iter = BreakIterator.getSentenceInstance(locale);\n\
  iter.setText(s);\nint start = iter.first();\nint end = iter.next();\nwhile (end\
  \ != BreakIterator.DONE) {\n   String segment = s.substring(start, end);\n   start\
  \ = end;\n   end = iter.next();\n   System.out.println(segment);\n}\n```\n\n这些静态方法返回四种迭代器：\n\
  \n- `getCharacterInstance` 方法产生一个用于字形字符簇（grapheme clusters）的迭代器——即产生可见字符的 Unicode\
  \ 序列。\n- `getWordInstance` 方法产生一个产生单词或单词分隔符的迭代器。你需要自己判断每个线段的类型。\n- `getSentenceInstance`\
  \ 方法的迭代器将文本划分为句子。\n- `getLineInstance` 迭代器产生行。\n\n每个方法都有一个不带参数的版本（使用默认语言环境）以及一个带有\
  \ `Locale` 参数的版本。\n\n与其使用 `BreakIterator` 迭代字形字符簇，不如使用正则表达式：\n\n```java\nString[]\
  \ clusters = s.split(\"\\\\b{g}\");\n```\n\n## 7.7 文本输入与输出\n\n如你所知，Java 编程语言本身完全基于\
  \ Unicode 的。然而，Windows 和 Mac OS X 仍然支持旧的字符编码，例如西欧国家的 Windows-1252 或 Mac Roman，或者台湾的\
  \ Big5。因此，通过文本与用户通信并不像想象中那样简单。接下来的章节将讨论你可能会遇到的复杂情况。\n\n### 7.7.1 文本文件 全现在，使用 UTF-8\
  \ 保存和加载文本文件是最好的。但你可能需要处理旧文件。如果你知道预期的字符编码，可以在读写文本文件时指定它：\n\n```java\nCharset windows1252\
  \ = Charset.forName(\"Windows-1252\");\nvar out = new PrintWriter(filename, windows1252);\n\
  ```\n\n若要猜测用户偏好的编码，可以使用自执行 Java 虚拟机的“原生编码”。从 Java 18 开始，它的名称是系统属性 `native.encoding`\
  \ 的值。\n\n在 Java 18 之前，原生编码是默认字符集，你可以通过静态方法 `Charset.defaultCharset()` 获取。\n\n###\
  \ 7.7.2 换行符\n\n这不是语言环境的问题，而是平台的问题。在 Windows 上，文本文件在每行末尾使用 `\\r\\n`，而基于 UNIX 的系统只需要一个\
  \ `\\n` 字符。如今，大多数 Windows 程序可以只处理 `\\n`，但旧的程序和控制台可能会给你的用户带来麻烦。\n\n使用 `println` 方法写入的任何行都会被正确终止。唯一的问题是如果你打印了包含\
  \ `\\n` 字符的字符串。它们不会被自动修改为平台的换行符。\n\n与其在字符串中使用 `\\n`，不如使用 `printf` 和 `%n` 格式说明符来产生依赖于平台的换行符。例如，\n\
  \n```java\nout.printf(\"Hello%nWorld%n\");\n```\n\n在 Windows 上产生：\n\n```\nHello\\\
  r\\nWorld\\r\\n\n```\n\n在其他地方产生：\n\n```\nHello\\nWorld\\n\n```\n\n### 7.7.3 控制台\n\
  \n如果你编写了通过 `System.in`/`System.out` 或 `System.console()` 与用户通信的程序，你就必须面对控制台可能使用与默认字符集不同的字符编码的可能性。这在\
  \ Windows 上使用 `cmd` 终端时尤为明显。在美版 Windows 11 中，命令终端仍然使用过时的 `IBM437` 编码，它起源于 1982 年的\
  \ IBM 个人电脑。`Charset.defaultCharset()` 方法将返回 `Windows-1252` 字符集，这非常不同。例如，欧元符号 € 存在于\
  \ `Windows-1252` 中，但在 `IBM437` 中不存在。当你调用\n\n```java\nSystem.out.println(\"100 €\"\
  );\n```\n\n控制台将显示\n\n```\n100 ?\n```\n\n理想情况下，用户应该将控制台切换为：\n\n```\nchcp 6501\n```\n\
  \n从 Java 18 开始，这足够 UTF-8。对于更早的版本，运行编译器：\n\n```\njava -Dfile.encoding=UTF-8 MyProg\n\
  ```\n\n你也可以查看它：\n\n```\nfile.encoding\n```\n\n如果 `System.console()` 不为 `null`，使用：\n\
  \n```java\nnew Scanner(System.console().reader())\n```\n\n### 7.7.4 UTF-8 字节标记\n\
  \n正如前面提到的，尽可能文件使用 UTF-8 是好主。然而，如果你的应用程序必须读取其他程序创建的 UTF-8 文件，就会遇到另一个潜在问题。在文件开头添加字节标记字符\
  \ U+FEFF 是完全允许。在 UTF-16 编码中，每个代码单元是双字节，字节标记告诉读取器文件是大端序还是小端序。UTF-8 是单字节编码，因此不需要指定字节序。但如果文件以\
  \ `0xEF 0xBB 0xBF`（U+FEFF 的 UTF-8 编码）开头，这强烈表明它使用的是 UTF-8。由于这个原因，Unicode 标准鼓励这种做法。任何读取器都应该丢弃初始字节标记。\n\
  \n这里只有一个障碍。Oracle 的 Java 实现固执拒绝遵循 Unicode 标准，理由是潜在的兼容性问题。这意味着你，程序员，必须完成平台不愿做的事。当你向\
  \ `javac` 编译器传递带有字节标记的有效 UTF-8 源文件时，编译将失败并报错“非法字符：\\65279”。\n\n### 7.7.5 源文件的字符编码\n\
  \n你，程序员，需要与 Java 编译器通信——你通过本地系统上的工具这样做。例如，如果你在中文或日文版的 Windows 上，你的 Java 源代码文件可能是用本地字符编码的。这种源文件不是可移植的（只有编译后的类文件是移植的——它们对标识符和字符串使用“修改后的\
  \ UTF-8”编码）。\n\n不可移植的源文件并不是理想的。现在很容易配置文本编辑器和开发环境为源文件使用 UTF-8。从 Java 18 开始，`javac`\
  \ 编译器默认期望 UTF-8 编码的源文件。对于更早的版本，运行编译器：\n\n```\njavac -encoding UTF-8 Myfile.java\n\
  ```\n\n\n\n\n要编译不是 UTF-8 编码的旧源文件，请以相同指定编码。\n\n## 7.8. 资源包 (Resource Bundles)\n\n\
  在对应用程序进行本地化时，你可能会面临海量的消息字符串、按钮标签等，这些内容都需要翻译。为了使这项任务变得可行，你希望在外部位置定义消息字符串，该位置通常称为资源（resource）。执行翻译的人只需简单编辑资源文件，而无需触碰程序的源代码。\n\
  \n在 Java 中，你可以使用属性文件（property files）指定字符串资源，并为其他类型的资源实现类。\n\nJava 技术资源不同于 Windows\
  \ 或 Macintosh 资源。Macintosh 或 Windows 可执行程序将菜单、对话框、图标和消息等资源存储在与程序代码分开的节区域中。资源编辑器可以检查并更新这些资源，而不影响程序代码。\n\
  \n第一卷第 5 章 描述了 JAR 文件资源的概念，其中数据文件、声音和图像可以放置在 JAR 文件中。`Class` 类的 `getResource` 方法可以找到文件、打开它并返回一个指向资源的\
  \ URL。通过将文件放入 JAR 文件中，你将查找文件的工作交给了类加载器——它已经知道如何定位 JAR 文件中的项目。然而，该机制没有本地化支持。\n\n\
  ### 7.8.1. 查找资源包\n\n在对应用程序进行本地化时，你会产生一组资源包。每个包都是一个属性文件或一个描述特定本地化项（如消息、标签等）的类。对于每个包，你必须为你想要支持的所有本地化提供版本。\n\
  \n你需要为这些资源包使用特定的命名规范。例如，特定于德国资源进入文件 `baseName_de_DE`，而由所有德语国家共享的资源进入 `baseName_de`。通常情况下，使用：\n\
  \n```\nbaseName_language_country\n```\n\n用于所有特定国家的资源，以及\n\n```\nbaseName_language\n\
  ```\n\n用于所有特定语言的资源。最后，作为回退，你可以将默认值放在没有任何后缀的文件中。\n\n要加载包，请使用命令\n\n```\nResourceBundle\
  \ currentResources = ResourceBundle.getBundle(baseName, currentLocale);\n```\n\n\
  `getBundle` 方法尝试根据语言和国家加载与当前本地化匹配的包。如果失败，则依次放弃国家和语言。然后对默认本地化应用相同的搜索，最后查询默认包文件。即使该尝试也失败，该方法将抛出\
  \ `MissingResourceException`。\n\n也就是说，`getBundle` 方法尝试加载以下包：\n\n```\nbaseName_currentLocaleLanguage_currentLocaleCountry\n\
  baseName_currentLocaleLanguage\nbaseName_defaultLocaleLanguage_defaultLocaleCountry\
  \ \nbaseName_defaultLocaleLanguage\nbaseName\n```\n\n一旦 `getBundle` 方法定位了一个包（例如\
  \ `baseName_de_DE`），它仍然会继续查找 `baseName_de` 和 `baseName`。如果这些包存在，它们将成为 `baseName_de_DE`\
  \ 包在 `resource hierarchy`（资源层级结构）中的父级（parents）。稍后在查找资源时，如果在当前包中查找未成功，则会搜索父包。也就是说，如果在\
  \ `baseName_de_DE` 中没有找到特定资源，也会查询 `baseName_de` 和 `baseName`。\n\n这显然是一个非常实用的服务——而且手动编写程序会非常繁琐。Java\
  \ 编程语言的资源包机制会自动定位与给定本地化最匹配的项。在现有程序中添加越来越多的本地化是很容易的——你只需要创建额外的资源包即可。\n\n如果一个本地化具有脚本或变体，查找过程将复杂得多。请参见\
  \ `ResourceBundle.Control.getCandidateLocales` 方法的文档以获取细节。\n\n你不需要将应用程序的所有资源放入单个包中。你可以为按钮标签准备一个包，为错误消息准备一个包，等等。\n\
  \n### 7.8.2. 属性文件 (Property Files)\n\n字符串国际化非常简单。你将所有字符串放入属性文件中，例如 `MyProgramStrings.properties`。这只是一个文本文件，每行一个键/值对。一个典型文件看起来如下：\n\
  \n```\ncomputeButton=Rechnen\ncolorName=black\ndefaultPaperSize=210×297\n```\n\n\
  然后按照上一节中描述的方法命名你的属性文件，例如：\n\n```\nMyProgramStrings.properties\nMyProgramStrings_en.properties\n\
  MyProgramStrings_de_DE.properties\n```\n\n你可以简单地加载包：\n\n```\nResourceBundle bundle\
  \ = ResourceBundle.getBundle(\"MyProgramStrings\", locale);\n```\n\n要查找特定字符串，调用\n\
  \n```\nString computeButtonLabel = bundle.getString(\"computeButton\");\n```\n\n\
  属性文件被编码为 UTF-8。\n\n在 Java 9 之前，用于存储属性的文件必须是 ASCII 文件，非 ASCII 字符必须使用 `\\uxxxx` 表示法进行编码。例如，`\"\
  colorName=Grün\"` 必须指定为：\n\n```\ncolorName=Gr\\u00FCn\n```\n\n### 7.8.3. 包类 (Bundle\
  \ Classes)\n\n为了提供不是字符串的资源，请定义继承 `ResourceBundle` 类的类。使用标准命名规范命名你的类，例如：\n\n```\n\
  MyProgramResources.java\nMyProgramResources_en.java\nMyProgramResources_de_DE.java\n\
  ```\n\n使用与相同的 `getBundle` 方法加载类：\n\n```\nResourceBundle bundle = ResourceBundle.getBundle(\"\
  MyProgramResources\", locale);\n```\n\n在搜索包时，如果两个包名称相同，类的优先级高于属性文件。\n\n每个资源包实现一个查找表。你需要为想要本地化的每个设置提供键字符串，并使用该键字符串检索设置。例如：\n\
  \n```\nvar backgroundColor = (Color) bundle.getObject(\"backgroundColor\");\ndouble[]\
  \ paperSize = (double[]) bundle.getObject(\"defaultPaperSize\");\n```\n\n实现资源包类的简单方法是扩展\
  \ `ListResourceBundle` 类。`ListResourceBundle` 允许你将资源放入对象数组，然后为你完成查找。遵循此代码框架：\n\n\
  ```\npublic class baseName_language_country extends ListResourceBundle\n{\n   private\
  \ static final Object[][] contents =\n   {\n      { key1, value2 },\n      { key2,\
  \ value2 },\n      . . .\n   }\n   public Object[][] getContents() { return contents;\
  \ }\n}\n```\n\n例如：\n\n```\npublic class ProgramResources_de extends ListResourceBundle\n\
  {\n   private static final Object[][] contents =\n   {\n      { \"backgroundColor\"\
  , Color.black },\n      { \"defaultPaperSize\", new double[] { 210, 297 } }\n  \
  \ }\n   public Object[][] getContents() { return contents; }\n}  \npublic class\
  \ ProgramResources_en_US extends ListResourceBundle\n{\n   private static final\
  \ Object[][] contents =\n   {\n      { \"backgroundColor\", Color.blue },\n    \
  \  { \"defaultPaperSize\", new double[] { 216, 279 } }\n   }\n   public Object[][]\
  \ getContents() { return contents; }\n}\n```\n\n纸张尺寸以毫米为单位。除了美国和加拿大外，地球上每个人都使用 ISO\
  \ 216 纸张尺寸。更多信息请参见 `https://www.cl.cam.ac.uk/~mgk25/iso-paper.html`。\n\n你的资源包类也可以继承\
  \ `ResourceBundle` 类。你需要实现两个方法来枚举所有键并查找给定键的值：\n\n```\nEnumeration<String> getKeys()\n\
  Object handleGetObject(String key)\n```\n\n`ResourceBundle` 类的 `getObject` 方法会调用你提供的\
  \ `handleGetObject` 方法。\n\n\n\n\n根据给定的名称、指定的语言区域或默认语言区域，加载资源包类及其父类。如果资源包类位于某个包中，则基类名必须包含完整的包名，例如\
  \ `\"intl.ProgramResources\"`。资源包类必须是 `public`（公共的），以便 `getBundle` 方法可以访问它们。\n\n\
  *   `Object getObject(String name)`\n\n    从资源包或其父类中查找对象。\n\n*   `String getString(String\
  \ name)`\n\n    从资源包或其父类中查找对象并将其强制转换为字符串。\n\n*   `String[] getStringArray(String\
  \ name)`\n\n    从资源包或其父类中查找对象并将其强制转换为字符串数组。\n\n*   `Enumeration<String> getKeys()`\n\
  \n    返回一个枚举对象，用于列举此资源包的键。它也会枚举父资源包中的键。\n\n*   `Object handleGetObject(String key)`\n\
  \n    如果你定义了自己的了自己的资源查找机制，则应重写此方法以查找与给定键关联的资源值。\n\n## 7.9. 完整的示例\n\n在本节中，我们将本章的材料应用于退休计算器的本地化。该程序计算你是否为退休储蓄了足够的资金。你输入年龄、每月储蓄金额等（参见图\
  \ 7.4）。\n\n![Figure](img/fig05-04.jpg)图 7.4: 英文退休计算器\n\n文本区域和图表显示每年退休账户的余额。如果数字在你生活的后期变为负数，且图中的条形出现在\
  \ `x` 轴下方，你需要做些什么——例如，存更多的钱、推迟退休年龄、早点去世，或者更年轻一点。\n\n退休计算器支持三种语言区域（英语、德语和中文）。以下是国际化的一些亮点：\n\
  \n*   标签、按钮和消息被翻译成了德语和中文。你可以在 `RetireResources_de` 和 `RetireResources_zh` 类中找到它们。英语作为备用语言——参见\
  \ `RetireResources` 文件。\n\n*   每当语言区域更改时，我们都会重置标签并重新格式文本字段的内容。\n\n*   文本字段以本地格式处理数字、货币金额和百分比。\n\
  \n*   计算字段使用 `MessageFormat`。格式字符串存储在每个语言的资源包中。\n\n*   为了证明这是可行的，我们根据用户选择的语言为条形图使用了不同的颜色。\n\
