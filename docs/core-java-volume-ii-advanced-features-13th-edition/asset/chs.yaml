  \n*   `DayOfWeek getDayOfWeek()`\n\n    获取星期几，返回 `DayOfWeek` 枚举的值。\n\n*   `Month\
  \ getMonth()`\n\n*   `int getMonthValue()`\n\n    以 `Month` 枚举的值或 1 到 12 之间的数字获取月份。\n\
  \n*   `int getYear()`\n\n    获取年份，范围在 –999,999,999 到 999,999,999 之间。\n\n\n\n\n\n\
  * `static TemporalAdjuster previous(DayOfWeek dayOfWeek)`\n* `static TemporalAdjuster\
  \ previousOrSame(DayOfWeek dayOfWeek)`\n  返回一个将日期调整为指定星期几的调整器。\n* `static TemporalAdjuster\
  \ dayOfWeekInMonth(int n, DayOfWeek dayOfWeek)`\n* `static TemporalAdjuster lastInMonth(DayOfWeek\
  \ dayOfWeek)`\n  返回一个将日期调整为月份中第 `n` 个或最后一个指定星期几的调整器。\n* `static TemporalAdjuster\
  \ firstDayOfMonth()`\n* `static TemporalAdjuster firstDayOfNextMonth()`\n* `static\
  \ TemporalAdjuster firstDayOfYear()`\n* `static TemporalAdjuster firstDayOfNextYear()`\n\
  * `static TemporalAdjuster lastDayOfMonth()`\n* `static TemporalAdjuster lastDayOfYear()`\n\
  \  返回一个将日期调整为指定日期或年份的调整器。\n\n## 6.4. Local 时间 (Local Time)\n\n`LocalTime` 表示一天中的某个时间，例如\
  \ 15:30:00。你可以使用 `now` 或 `of` 方法创建实例：\n\n```\nLocalTime rightNow = LocalTime.now();\n\
  LocalTime bedtime = LocalTime.of(22, 30); // or LocalTime.of(22, 30, 0)\n```\n\n\
  API 说明展示了本地时间的常用操作。`plus` 和 `minus` 操作会在 24 小时内循环计算。例如：\n\n```\nLocalTime wakeup\
  \ = bedtime.plusHours(8); // wakeup is 6:30:00\n```\n\n`LocalTime` 不涉及 AM/PM（上午/下午）。这种琐事留给格式化程序即可——参见第\
  \ 6.6 节。\n\n有一个 `LocalDateTime` 类用于表示日期和时间。该类适用于存储固定时区中的时间点——例如，课程或活动的时间安排表。然而，如果你需要进行跨越夏令时的计算，或者需要处理来自不同时区的用户，你应该使用我们将要讨论的\
  \ `ZonedDateTime` 类。\n\n`java.time.LocalTime` 8\n\n* `static LocalTime now()`\n\
  \  获取当前的 `LocalTime`。\n* `static LocalTime of(int hour, int minute)`\n* `static\
  \ LocalTime of(int hour, int minute, int second)`\n* `static LocalTime of(int hour,\
  \ int minute, int second, int nanoOfSecond)`\n  产生一个具有给定小时（0 到 23 之间）、分钟（0 到 59\
  \ 之间）和纳秒（0 到 999,999,999 之间）的本地时间。\n* `LocalTime` (`plus`|`minus`)(`Hours`|`Minutes`|`Seconds`|`Nanos``(long\
  \ number)`\n  通过加减给定的时间单位产生一个 `LocalTime`。\n* `LocalTime plus(TemporalAmount amountToAdd)`\n\
  * `LocalTime minus(TemporalAmount amountToSubtract)`\n  返回一个与此 `LocalTime` 相差给定数量的\
  \ `LocalTime`。\n* `LocalTime with`(`Hour`|`Minute`|`Second`|`Nano``(int value)`\n\
  \  返回一个新的 `LocalTime`，其小时、分、秒或纳秒被更改为给定值。\n* `int getHour()`\n  获取小时（0 到 23 之间）。\n\
  * `int getMinute()`\n* `int getSecond()`\n  获取分钟或秒（0 到 59 之间）。\n* `int getNano()`\n\
  \  获取纳秒（0 到 999,999,999 之间）。\n* `int toSecondOfDay()`\n* `long toNanoOfDay()`\n\
  \  产生自午夜以来的秒或纳秒。\n* `boolean isBefore(LocalTime other)`\n* `boolean isAfter(LocalTime\
  \ other)`\n  如果此日期在给定日期之前或之后，则返回 `true`。\n\n## 6.5. 时区时间 (Zoned Time)\n\n时区可能因为它们完全是人类的产物，比地球不规则旋转引起的复杂性更加混乱。在一个理性的世界里，我们都应该遵循格林维治的时钟，我们中的一些人会在吃我们的……（注：提供的文本包含大量重复/乱码部分；此处遵循提供的核心逻辑流）。\n\
