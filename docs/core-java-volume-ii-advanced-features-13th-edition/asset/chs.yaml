  \ 1.2\n\n* `TreePath getSelectionPath()`\n  获取当前选中节点的路径，或者如果选择了多个节点，则返回第一个被选中节点的路径。如果没有选中节点，则返回\
  \ `null`。\n\n* `Object getLastSelectedPathComponent()`\n  获取代表当前选中节点的节点对象，或者如果选择了多个节点，则返回第一个节点。如果没有选中节点，则返回\
  \ `null`。\n\n* `void makeVisible(TreePath path)`\n  展开路径上的所有节点。\n\n* `void scrollPathToVisible(TreePath\
  \ path)`\n  展开路径上的所有节点，如果树包含在滚动条中，则滚动以确保路径上的最后一个节点可见可见。\n\n### `javax.swing.tree.TreePath`\
  \ 1.2\n\n* `Object getLastPathComponent()`\n  获取此路径上的最后一个对象——即该路径所代表的节点对象。\n\n###\
  \ `javax.swing.tree.TreeNode` 1.2\n\n* `TreeNode getParent()`\n  返回该节点的父节点。\n\n\
  * `TreeNode getChildAt(int index)`\n  查找给定索引处的子节点。该索引必须在 0 到 `getChildCount()` –\
  \ 1 之间。\n\n* `int getChildCount()`\n  返回该节点的子节点数量。\n\n* `Enumeration children()`\n\
  \  返回一个枚举对象，用于遍历该节点的所有子节点。\n\n### `javax.swing.tree.DefaultTreeModel` 1.2\n\n* `void\
  \ insertNodeInto(MutableTreeNode newChild, MutableTreeNode parent, int index)`\n\
  \  在 `index` 处将 `newChild` 插入 `parent` 中。\n\n* `void removeNodeFromParent(MutableTreeNode\
  \ node)`\n  从父节点中移除 `node`。\n\n* `void nodeChanged(TreeNode node)`\n  通知树模型 `node`\
  \ 已更改。\n\n* `void nodesChanged(TreeNode parent, int[] changedIndexes)`\n  通知树模型\
  \ `parent` 具有给定索引的节点已更改。\n\n* `void reload()`\n  重新加载所有节点。\n\n### 12.4.3 节点枚举\n\n\
  有时你需要从根节点开始访问所有节点，并在树中查找节点。`DefaultMutableTreeNode` 类提供了多个遍历节点的便利方法。\n\n`breadthFirstEnumeration`\
  \ 和 `depthFirstEnumeration` 方法返回枚举对象，其 `nextElement` 方法使用广度优先或深度优先遍历访问节点的子节点。图 12.27\
  \ 显示了示例树的遍历情况——节点标签指示了遍历的顺序。\n\n广度优先枚举是最容易可视化的。树按层遍历。首先访问根节点，然后是它的子节点，接着是孙节点，以此类推。\n\
  \n为了可视化深度优先枚举，想象一只被困在树形迷宫中的鼠。它沿着第一条路径冲直到遇到叶子节点。然后，它回溯并转向另一条路径，以此类。计算机科学家也称为*后序遍历*，因为搜索过程在访问父节点之前访问了子节点。`depthFirstEnumeration`\
  \ 方法是 `postOrderEnumeration` 的同义词。为了完整性，还有 `preOrderEnumeration`，这是一种在枚举父节点之前枚举子节点的深度搜索。\n\
  \n以下是典型的使用模式：\n\n```java\nEnumeration breadthFirst = node.breadthFirstEnumeration();\n\
  while (breadthFirst.hasMoreElements())\n   do something with breadthFirst.nextElement();\n\
  ```\n\n最后，相关方法 `pathFromAncestorEnumeration` 寻找从祖先到给定节点的路径，并枚举该路径上的节点。这没什么大——它不断调用\
  \ `getParent` 直到找到祖先，然后反向呈现路径。\n\n在我们的下一个示例程序中，我们将节点枚举应用于实际。该程序显示类的继承树。在框架底部的文本框中输入类名。该类及其所有父类都被添加到树中（参见图\
  \ 12.28）。\n\n\n\n\n\n![Figure](img/fig06-32.jpg)图 12.28: 继承树\n\n在这个示例中，我们利用了树节点的用户对象（user\
  \ objects）可以是任意类型对象的特性。由于我们的节点描述的是类，因此我们在节点中存储了 `Class` 对象。\n\n我们不希望重复添加同一个类对象，因此需要检查该类是否已经存在于树中。以下方法可以在树中查找具有给定用户对象的节点（如果该节点存在的话）：\n\
  \n```\npublic DefaultMutableTreeNode findUserObject(Object obj)\n{\n   Enumeration\
  \ e = root.breadthFirstEnumeration();\n   while (e.hasMoreElements())\n   {\n  \
  \    DefaultMutableTreeNode node = (DefaultMutableTreeNode) e.nextElement();\n \
  \     if (node.getUserObject().equals(obj))\n         return node;\n   }\n   return\
  \ null;\n}\n```\n\n### 12.4.4. 渲染节点\n\n在应用程序中，你通常需要更改树组件绘制节点的方式。最常见的更改无疑为节点和叶子节点选择不同的图标。其他更改可能涉及更改节点标签的字体或在节点处绘制图像。所有这些更改都可以通过向树安装一个新的\
  \ `tree cell renderer`（树单元渲染器）来实现。默认情况下，`JTree` 类使用 `DefaultTreeCellRenderer` 对象绘制每个节点。`DefaultTreeCellRenderer`\
  \ 类自 `JLabel` 类。标签包含了节点图标和节点标签。\n\n单元渲染器并不绘制用于展开和折叠子树的“句柄”（handles）。句柄是外观（look-and-feel）的一部分，建议不要更改它们。\n\
  \n你可以通过三种方式自定义显示：\n\n* 你可以更改 `DefaultTreeCellRenderer` 使用的图标、字体和背景颜色。这些设置适用于树中的所有节点。\n\
  * 你可以安装一个扩展 `DefaultTreeCellRenderer` 类的渲染器，并为每个节点设置不同的图标、字体和背景颜色。\n* 你可以安装一个实现\
  \ `TreeCellRenderer` 接口的渲染器，为每个节点绘制自定义图像。\n\n让我们逐一查看这些可能性。最简单的自定义是构造一个 `DefaultTreeCellRenderer`\
  \ 对象，更改图标并将其安装到树中：\n\n```\nvar renderer = new DefaultTreeCellRenderer();\nrenderer.setLeafIcon(new\
  \ ImageIcon(\"blue-ball.gif\")); // 用于叶子节点\nrenderer.setClosedIcon(new ImageIcon(\"\
  red-ball.gif\")); // 用于折叠节点\nrenderer.setOpenIcon(new ImageIcon(\"yellow-ball.gif\"\
  )); // 用于展开节点\ntree.setCellRenderer(renderer);\n```\n\n你可以在 图 12.28 中看到效果。我们只是使用“球”图标作为占位符——推测你的用户界面设计师会为你提供适用于应用程序的适当图标。\n\
  \n我们不建议你更改整棵树的字体或背景颜色——那实际上是外观（look-and-feel）的工作。\n\n然而，更改树中某些节点的字体以突出显示它们可能是很有用的。如果你仔细查看\
  \ 图 12.28，你会发现 `abstract`（抽象）类被设置为斜体。\n\n要更改单个节点的外观，请安装树单元渲染器。树单元渲染器与我们在在本节之前讨论的列表单元渲染器非常相似。`TreeCellRenderer`\
  \ 接口有一个单元方法：\n\n```\nComponent getTreeCellRendererComponent(JTree tree, Object value,\
  \ boolean selected,\n      boolean expanded, boolean leaf, int row, boolean hasFocus)\n\
  ```\n\n`DefaultTreeCellRenderer` 类的 `getTreeCellRendererComponent` 方法返回 `this`——换句话说，一个标签。（`DefaultTreeCellRenderer`\
  \ 类自 `JLabel` 类）。要自定义组件，请扩展 `DefaultTreeCellRenderer` 类。重写 `getTreeCellRendererComponent`\
  \ 方法如下：\n\n```\nclass MyTreeCellRenderer extends DefaultTreeCellRenderer\n{\n  \
  \ public Component getTreeCellRendererComponent(JTree tree, Object value, boolean\
  \ selected,\n         expanded, boolean leaf, int row, boolean hasFocus)\n   {\n\
  \      Component comp = super.getTreeCellRendererComponent(tree, value, selected,\n\
  \            expanded, leaf, row, hasFocus);\n      DefaultMutableTreeNode node\
  \ = (DefaultMutableTreeNode) value;\n      Font font = node.getUserObject();\n \
  \     comp.setFont(font);\n      return comp;\n   }\n}\n```\n\ngetTreeCellRendererComponent`\
  \ 方法的 `value` 参数是节点对象，*不是*用户对象！如果树使用 `DefaultMutableTreeNode` 节点，需要在上一步获取用户对象。`DefaultTreeCellRenderer`\
  \ 为所有节点使用相同的标签，如果你为特定节点更改了字体，需要在再次调用该方法时恢复为默认值。否则，后续所有节点都将以更改后的字体绘制。图 12.28 显示了\
  \ `abstract` 类被设置为斜体。我们需要保持原始字体并在下次调用时恢复它。\n\n### 12.4.5. 监听树事件\n\n通常情况下，树组件会与其他组件配对。当用户选择树节点时，某些信息会在另一个窗口中显示。示例参见\
  \ 图 12.29。当用户选择一个类时，该类的实例和静态变量将显示在右侧的文本区域中。\n\n要获得这种行为，你需要安装一个 `tree selection listener`树选择监听器）。监听器必须实现\
  \ `TreeSelectionListener` 接口——这是一个具有单一方法的接口：\n\n```\nvoid valueChanged(TreeSelectionEvent\
  \ event)\n```\n\n\n\n\n每当用户选择或取消选择树节点时，都会调用该方法。\n\n按照常规方式向树添加监听器：\n\n```\ntree.addTreeSelectionListener(listener);\n\
  ```\n\n你可以指定是否允许用户选择单个节点、连续的节点范围，或一组任意的、可能不连续的节点集合。`JTree` 类使用 `TreeSelectionModel`\
  \ 来管理节点选择。你需要获取该模型，并将选择状态设置为 `SINGLE_TREE_SELECTION`、`CONTIGUOUS_TREE_SELECTION`\
  \ 或 `DISCONTIGUOUS_TREE_SELECTION` 之一。（不连续选择模式是默认设置。）例如，在我们的类类浏览器中，我们希望只允许选择单个类：\n\
  \n```\nint mode = TreeSelectionModel.SINGLE_TREE_SELECTION;\ntree.getSelectionModel().setSelectionMode(mode);\n\
  ```\n\n除了设置选择模式外，你不需要担心树的选择模型。\n\n用户如何选择多个项目取决于外观和感觉（look-and-feel）。在 Metal 外观风格中，按住\
  \ Ctrl 键并点击某项可以将其添加到选择中，或者如果该项当前已被选中，则将其移除。按住 Shift 键并点击某项可以选择一个项目`range`，从上一个选中的项扩展到新项。\n\
  \n要查找当前选择，请使用 `getSelectionPaths` 方法查询树：\n\n```\nTreePath[] selectedPaths = tree.getSelectionPaths();\n\
  ```\n\n如果你将用户限制为单项选择，可以使用便利方法 `getSelectionPath`，它会返回第一个选中的路径，或者在未选择任何路径时返回 `null`。\n\
  \n`TreeSelectionEvent` 类有一个 `getPaths` 方法，返回一个 `TreePath` 对象的数组，但该数组描述的是*选择变化*，而不是当前的选择状态。\n\
  \nListing 12.10 显示了类树程序的框架类。该程序显示继承层次结构，并自定义了显示以*斜体*表示抽象类。（单元格渲染器请参阅 Listing 12.11）。你可以在框架底部的文本框中输入任何类的名称。按\
  \ Enter 键或点击 Add 按钮将该类及其父类添加到树中。你必须输入完整的包名，例如 `java.util.ArrayList`。\n\n这个程序有点复杂，因为它使用反射来构建类树。这部分工作是在\
  \ `addClass` 方法内部完成的。（细节并不重要。我们在本示例中使用类树是因为继承可以提供源源源的树形结构，而无需费琐的编码。当在你的应用程序中显示树时，你将有自己的层次级数据源。）该方法使用广度优先搜索算法，通过调用我们在上一节中实现的\
  \ `findUserObject` 方法来查找当前类是否已在树中。如果该类不在树中，我们将父类添加到树中，然后将新类节点设置为子节点并使该节点可见。\n\n\
  当你选择一个树节点时，右侧的文本区域将填充所选类的字段。在框架构造函数中，我们将用户限制为单项选择并添加了树选择监听器。当 `valueChanged` 方法被调用时，我们忽略它的事件参数，直接向树询问当前选择路径。一如既往，我们需要获取路径的最后一个节点并查找其用户对象。然后我们调用\
  \ `getFieldDescription` 方法，该方法使用反射来组装包含所选类所有字段的字符串。\n\nListing 12.10 treeRender/ClassTreeFrame.java\n\
  \n\n\n\n```\npackage treeRender;\n\nimport java.awt.*;\nimport java.awt.event.*;\n\
  import java.lang.reflect.*;\nimport java.util.*;\n\nimport javax.swing.*;\nimport\
  \ javax.swing.tree.*;\n\n/**\n * 此框架显示了类树、一个文本字段以及一个“添加”按钮，用于向树中\n * 添加更多类。\n */\n\
  public class ClassTreeFrame extends JFrame\n{\n   private static final int DEFAULT_WIDTH\
  \ = 400;\n   private static final int DEFAULT_HEIGHT = 300;\n\n   private DefaultMutableTreeNode\
  \ root;\n   private DefaultTreeModel model;\n   private JTree tree;\n   private\
  \ JTextField textField;\n   private JTextArea textArea;\n\n   public ClassTreeFrame()\n\
  \   {\n      setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\n      // 类树的根节点是 Object\n\
  \      root = new DefaultMutableTreeNode(java.lang.Object.class);\n      model =\
  \ new DefaultTreeModel(root);\n      tree = new JTree(model);\n\n      //添加当前类以填充树填充一些数据\n\
  \      addClass(getClass());\n\n      // 设置节点图标\n      var renderer = new ClassNameTreeCellRenderer();\n\
  \      renderer.setClosedIcon(new ImageIcon(getClass().getResource(\"red-ball.gif\"\
  )));\n      renderer.setOpenIcon(new ImageIcon(getClass().getResource(\"yellow-ball.gif\"\
  )));\n      renderer.setLeafIcon(new ImageIcon(getClass().getResource(\"blue-ball.gif\"\
  )));\n      tree.setCellRenderer(renderer);\n\n      // 设置选择模式\n      tree.addTreeSelectionListener(event\
  \ ->\n         {\n            // 用户选择了不同的节点--更新描述\n            TreePath path = tree.getSelectionPath();\n\
  \            if (path == null) return;\n            var selectedNode = (DefaultMutableTreeNode)\
  \ path.getLastPathComponent();\n            Class<?> c = (Class<?>) selectedNode.getUserObject();\n\
  \            String description = getFieldDescription(c);\n            textArea.setText(description);\n\
  \         });\n      int mode = TreeSelectionModel.SINGLE_TREE_SELECTION;\n    \
  \  tree.getSelectionModel().setSelectionMode(mode);\n\n      // 此文本区域持有类描述\n   \
  \   textArea = new JTextArea();\n\n      // 添加树和文本区域\n      var panel = new JPanel();\n\
  \      panel.setLayout(new GridLayout(1, 2));\n      panel.add(new JScrollPane(tree));\n\
  \      panel.add(new JScrollPane(textArea));\n\n      add(panel, BorderLayout.CENTER);\n\
  \n      addTextField();\n   }\n\n   /**\n    * 添加文本字段和“添加”按钮以添加新类。\n    */\n   public\
  \ void addTextField()\n   {\n      var panel = new JPanel();\n\n      ActionListener\
  \ addListener = event ->\n         {\n            // 添加文本字段中名称类\n            try\n\
  \            {\n               String text = textField.getText();\n            \
  \   addClass(Class.forName(text)); // 清空文本字段以表示成功\n               textField.setText(\"\
  \");\n            }\n            catch (ClassNotFoundException e)\n            {\n\
  \               JOptionPane.showMessageDialog(null, \"未找到类\");\n            }\n\
  \         };\n\n      // 新类名输入到此文本字段中\n      textField = new JTextField(20);\n \
  \     textField.addActionListener(addListener);\n      panel.add(textField);\n\n\
  \      var addButton = new JButton(\"Add\");\n      addButton.addActionListener(addListener);\n\
  \      panel.add(addButton);\n\n      add(panel, BorderLayout.SOUTH);\n   }\n\n\
  \   /**\n    * 在树中查找对象。\n    * @param obj 要查找的对象\n    * @return 包含该对象的节点，如果对象不在树中则返回\
  \ null\n    */\n   public DefaultMutableTreeNode findUserObject(Object obj)\n  \
  \ {\n      // 查找包含用户对象的节点\n      var e = (Enumeration<TreeNode>) root.breadthFirstEnumeration();\n\
  \      while (e.hasMoreElements())\n      {\n         var node = (DefaultMutableTreeNode)\
  \ e.nextElement();\n         if (node.getUserObject().equals(obj)) return node;\n\
  \      }\n      return null;\n   }\n\n   /**\n    * 添加新类以及任何尚未加入树的父类。\n    * @param\
  \ c 要添加的类\n    * @return 新添加的节点\n    */\n   public DefaultMutableTreeNode addClass(Class<?>\
  \ c)\n   {\n      // 向树中添加新类\n\n      // 跳过非类类型\n      if (c.isInterface() || c.isPrimitive())\
  \ return null;\n\n      // 如果类已经在树中，则返回其节点\n      DefaultMutableTreeNode node =\
  \ findUserObject(c);\n      if (node != null) return node;\n\n      // 类不存在--首先递归添加类的父类\n\
  \n      Class<?> s = c.getSuperclass();\n\n      DefaultMutableTreeNode parent;\n\
  \      if (s == null) parent = root;\n      else parent = addClass(s);\n\n     \
  \ // 将类作为父节点的子节点\n      var newNode = new DefaultMutableTreeNode(c);\n      model.insertNodeInto(newNode,\
  \ parent, parent.getChildCount());\n\n      // 使节点可见\n      var path = new TreePath(model.getPathToRoot(newNode));\n\
  \      tree.makeVisible(path);\n\n      return newNode;\n   }\n\n   /**\n    * 返回类字段的描述。\n\
  \    * @param c 要描述的类\n    * @return 包含所有字段类型和名称的字符串\n    */\n   public static String\
  \ getFieldDescription(Class<?> c)\n   {\n      // 使用反射查找字段\n      var r = new StringBuilder();\n\
  \      Field[] fields = c.getDeclaredFields();\n      for (int i = 0; i < fields.length;\
  \ i++)\n      {\n         Field f = fields[i];\n         if (Modifier.isStatic(f.getModifiers()))\
  \ r.append(\"static \");\n         r.append(f.getType().getName());\n         r.append(\"\
  \ \");\n         r.append(f.getName());\n         r.append(\"\\n\");\n      }\n\
  \      return r.toString();\n   }\n}\n```\n\n列表 12.11 treeRender/ClassNameTreeRenderer.java\n\
  \n```\npackage treeRender;\n\nimport java.awt.*;\nimport java.lang.reflect.*;\n\
  import javax.swing.*;\nimport javax.swing.tree.*;\n\n/**\n * 此类以正体或斜体形式渲染类名。抽象类为斜体。\n\
  \ */\npublic class ClassNameTreeRenderer extends DefaultTreeRenderer\n{\n   private\
  \ Font plainFont = null;\n   private Font italicFont = null;\n\n   public Component\
  \ getTreeRendererComponent(JTree tree, Object value, boolean selected,\n       \
  \  boolean expanded, boolean leaf, int row, boolean hasFocus)\n   {\n      super.getTreeRendererComponent(tree,\
  \ value, selected, expanded, leaf, row, hasFocus);\n      // 获取用户对象\n      var node\
  \ = (DefaultMutableTreeNode) value;\n      Class<?> c = (Class<?>) node.getUserObject();\n\
  \n      // 第一次，从正体字体派生斜体字体\n      if (plainFont == null)\n      {\n         plainFont\
  \ = getFont();\n         // 树单元渲染器有时会被带有空字体的标签调用\n         if (plainFont != null)\
  \ italicFont = plainFont.deriveFont(Font.ITALIC);\n      }\n\n      // 如果类是抽象的，将字体设置为斜体，否则设置为正体\n\
  \      if (Modifier.isAbstract(c.getModifiers())) setFont(italicFont);\n      else\
  \ setFont(plainFont);\n      return this;\n   }\n}\n```\n\n`javax.swing.JTree` 1.2\n\
  \n*   `TreePath getSelectionPath()`\n\n*   `TreePath[] getSelectionPaths()`\n\n\
  \    返回第一个选中的路径，或所有选中节点的路径数组。如果没有选中的路径，两个方法都返回 `null`。\n\n`javax.swing.event.TreeSelectionListener`\
  \ 1.2\n\n*   `void valueChanged(TreeSelectionEvent event)`\n\n    当节点被选择或取消选择时调用。\n\
