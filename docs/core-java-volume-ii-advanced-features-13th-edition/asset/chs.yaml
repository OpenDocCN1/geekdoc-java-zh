  \    返回当前选中的项。\n\n### 11.4.5 滑块 (Sliders)\n\n下拉框允许用户从离散的值集中进行选择。而滑块提供了连续的值——例如，0\
  \ 到 100 之间的任何数字。\n\n构造滑块最常见的方式如下：\n\n```\nvar slider = new JSlider(min, max);\n\
  ```\n\n如果你省略了最小值和最大值，它们将分别初始化为 `0` 和 `100`。如果你想要滑块是垂直的，使用以下构造函数：\n\n```\nvar slider\
  \ = new JSlider(SwingConstants.VERTICAL, min, initialValue);\n```\n\n当用户滑动条时，滑块的值在最小值和最大值之间移动。当值变化时，会向所有监听器发送\
  \ `ChangeEvent`。为了感知变化，调用 `addChangeListener` 方法并安装实现 `ChangeListener` 接口的对象。在回调中获取滑块值：\n\
  \n```\nChangeListener listener = event ->\n   {\n      JSlider slider = (JSlider)\
  \ event.getSource();\n      int value = slider.getValue();\n      . . .\n   };\n\
  ```\n\n可以通过显示刻度来装饰滑块。例如，在示例程序中，第二个滑块使用了以下设置：\n\n```\nslider.setMajorTickSpacing(20);\n\
  slider.setMinorTickSpacing(5);\n```\n\n滑块每 20 个单位有一个大刻，每 5 个单位有一个小刻。单位指的是滑块的值，而不是像素。这些指令仅设置了刻度的单位。要让刻度真正显示出来，请调用：\n\
  \n```\nslider.setPaintTicks(true);\n```\n\n你可以强制滑块吸附到刻度。每当用户在吸附模式下完成拖动时，它会立即移动到最近的刻度。通过以下调用激活此模式：\n\
  \n```\nslider.setSnapToTicks(true);\n```\n\n吸附刻度的并没有你想象的那么好。在滑块真正吸附之前，更改监听器仍然报告不对应刻度的滑块值。点击滑块旁边——这种操作通常会让滑块沿着点击方向移动一点——开启吸附刻度的滑块不会移动到下一个刻度。\n\
  \n可以通过调用以下方法为大刻度显示标签：\n\n```\nslider.setPaintLabels(true);\n```\n\n例如，对于范围从 0 到\
  \ 100 且主刻度间隔为 20 的滑块，刻度标记为 0、20、40、60、80 和 100。\n\n\n\n\n\n你也可以提供其他的刻度标签，例如字符串或图标（参见图\
  \ 11.16）。这个过程稍微有点复杂。你需要填充一个键为 `Integer` 类型、值为 `Component` 类型的哈希表。然后你调用 `setLabelTable`\
  \ 方法。组件会被放置在刻度下方。通常使用 `JLabel` 对象。以下是你可以将刻度标记为 A、B、C、D、E 和 F 的方法：\n\n```\nvar labelTable\
  \ = new Hashtable<Integer, Component>();\nlabelTable.put(0, new JLabel(\"A\"));\n\
  labelTable.put(20, new JLabel(\"B\"));\n. . .\nlabelTable.put(100, new JLabel(\"\
  F\"));\nslider.setLabelTable(labelTable);\n```\n\n代码列表 11.5 也显示了一个使用图标作为刻度标签的滑块。\n\
  \n如果你的刻度或标签没有显示，请双检你是否调用了 `setPaintTicks(true)` 和 `setPaintLabels(true)`。\n\n图 11.16\
  \ 中的第四个滑块没有轨道。要抑制滑块移动的“轨道”，请调用\n\n```\nslider.setPaintTrack(false);\n```\n\n第五个滑块通过调用以下方法反转了其方向：\n\
  \n```\nslider.setInverted(true);\n```\n\n代码列表 11.5 中的示例程序通过一组滑块展示了所有这些视觉效果。每个滑块都安装了更改事件监听器，它会将当前滑块的值放入框架底部的文本字段中。\n\
