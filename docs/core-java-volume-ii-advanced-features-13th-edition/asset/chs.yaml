  \   创建一个 `ZipOutputStream`，你可以用它向指定的 `OutputStream` 写入压缩数据。\n*   `void putNextEntry(ZipEntry\
  \ ze)`\n\n\n\n\n将给定的 `ZipEntry` 中的信息写入输出流，并为数据将流的位置准备就绪。随后可以通过调用 `write()` 方法写入数据。\n\
  \n* `void closeEntry()`\n    关闭 ZIP 文件中当前打开的条目。使用 `putNextEntry` 方法开始下一个条目。\n\n\
  * `void setLevel(int level)`\n    设置后续 `DEFLATED` 条目的默认压缩级别，值为从 `Deflater.NO_COMPRESSION`\
  \ 到 `Deflater.BEST_COMPRESSION` 之间的值。默认值为 `Deflater.DEFAULT_COMPRESSION`。如果级别无效，则抛出\
