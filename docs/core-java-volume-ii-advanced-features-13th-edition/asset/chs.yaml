  package tableCellRender;\n\nimport java.awt.*;\nimport javax.swing.*;\nimport javax.swing.table.*;\n\
  \n/**\n * 此渲染器将颜色值渲染为带有给定颜色的面板。\n */\npublic class ColorTableCellRenderer extends\
  \ JPanel implements TableCellRenderer\n{\n   // 省略了实现\n}\n```\n\n### 列表 12.7 tableCellRender/TableCellEditor.java\n\
  \n```java\npackage tableCellRender;\n\nimport java.awt.*;\nimport java.awt.event.*;\n\
  import java.beans.*;\nimport java.util.*;\nimport javax.swing.*;\nimport javax.swing.table.*;\n\
  \n/**\n * 此编辑器弹出颜色对话框来编辑单元格值。\n */\npublic class ColorTableCellEditor extends AbstractCellEditor\n\
  {\n   private JColor colorChooser;\n   private JDialog dialog;\n   private JPanel\
  \ panel;\n\n   public ColorTableCellEditor()\n   {\n      panel = new JPanel();\n\
  \      // 准备颜色\n      colorChooser = new JColor();\n   }\n\n   public Component\
  \ getTableCellEditor(JTable table, Object value, boolean isSelected, int row, int\
  \ column)\n   {\n      // 获取当前的颜色\n      colorChooser.setColor((Color) value);\n\
  \      return panel;\n   }\n\n   public boolean shouldSelect(EventObject anEvent)\n\
  \   {\n      // 开始编辑\n      dialog.setVisible(true);\n\n      // 调用可以选择\n      return\
  \ true;\n   }\n\n   public void cancelCellEditing()\n   {\n      // 取消编辑--隐藏对话框\n\
  \      dialog.setVisible(false);\n      super.cancelCellEditing();\n   }\n\n   public\
  \ boolean stopCellEditing()\n   {\n      // 完成编辑--隐藏对话框\n      dialog.setVisible(false);\n\
  \      super.stopCellEditing();\n\n      // 调用者可以使用颜色值\n      return true;\n   }\n\
  \n   public Object getCellEditorValue()\n   {\n      return colorChooser.getColor();\n\
  \   }\n}\n```\n\n### API 参考\n\n- `JTable.getDefaultRenderer(Class<?> type)`: 获取指定类型的默认渲染器。\n\
  - `JTable.getDefaultEditor(Class<?> type)`: 获取指定类型的默认编辑器。\n- `TableCellRenderer.getTableCellComponent(JTable\
  \ table, Object value, boolean selected, boolean hasFocus, int row, int column)`:\
  \ 返回一个组件，其 `paint` 方法被调用以渲染单元格。\n- `TableColumn.setCellEditor(TableCellEditor editor)`:\
  \ 设置此列所有单元格的编辑器。\n- `TableColumn.setCellRenderer(TableCellRenderer renderer)`: 设置此列所有单元格的渲染器。\n\
  - `TableColumn.setHeaderRenderer(TableCellRenderer renderer)`: 设置此列表单元格的渲染器。\n-\
  \ `TableColumn.setHeaderValue(Object value)`: 设置此列表头显示的值。\n- `DefaultCellEditor(JComboBox\
  \ comboBox)`: 构建一个呈现组合框以选择单元格值的编辑器。\n- `TableCellEditor.getTableCellEditorComponent(JTable\
  \ table, Object value, boolean selected, int row, column)`: 返回一个组件，其 `paint` 方法渲染单元格。\n\
  - `CellEditor.isCellEditable(EventObject event)`: 如果该事件适用于启动此单元格的编辑过程，则返回 `true`。\n\
  \n\n\n\n*   `boolean shouldSelectCell(EventObject anEvent)`\n    启动编辑过程。如果被编辑的单元格应该被`selected`，则返回\
  \ `true`。通常你希望返回 `true`，但如果你不希望编辑过程改变单元格的选择，可以返回 `false`。\n*   `void cancelCellEditing()`\n\
  \    取消编辑过程。你可以放弃部分编辑。\n*   `boolean stopCellEditing()`\n    停止编辑过程，并意图使用结果。如果编辑后的值处于可检索的正确状态，则返回\
  \ `true`。\n*   `Object getCellEditorValue()`\n    返回编辑结果。\n*   `void addCellEditorListener(CellEditorListener\
  \ l)`\n*   `void removeCellEditorListener(CellEditorListener l)`\n    添加或移除单元格监听器。\n\
  \n## 12.4. 树\n\n每一个处理过分级文件系统的计算机用户都见过过树形显示。当然，目录和文件只是树形结构的众多例子之一。日常生活中存在许多树形结构，例如图\
  \ 12.11 所示的国家、州和城市的层级结构。\n\n![Figure](img/fig06-15.jpg)Figure 12.11: 国家、州和城市的层级结构\n\
  \n作为程序员，我们经常需要显示树形结构。幸运的是，Swing 库有一个 `JTree` 类用于此目的。`JTree` 类（同它的辅助类）负责树的布局以及处理用户展开和折叠节点的请求。在本节中你将学习如何使用\
  \ `JTree` 类。\n\n在继续之前，让我们先确定一些术语（参见图 12.12）。`tree`（树）由`nodes`（节点）组成。每个节点要么是`leaf`（叶节点），要么拥有`child\
  \ nodes`（子节点）。除了根节点外，每个节点只有一个`parent`（父节点）。树只有一个根。有时你有一组树，每个树都有自己的根节点。这样的集合被称为 `forest`（森林）。\n\
  \n![Figure](img/fig06-16.jpg)Figure 12.12: 树的术语\n\n### 12.4.1. 简单树\n\n在第一个示例中，我们将简单地显示一棵包含几个节点的树（参见图\
  \ 12.14）。与其他 Swing 组件一样，你需要提供一个数据模型，由组件为你显示它。要构造一个 `JTree`，请在构造函数中提供树模型：\n\n```\n\
  TreeModel model = ...\nvar tree = new JTree(model);\n```\n\n还有通过元素集合构造树的构造函数：\n\n\
  ```\nJTree(Object[] nodes)\nJTree(Vector<?> nodes)\nJTree(Hashtable<?, ?> nodes)\
  \ // 值变成节点\n```\n\n这些构造函数并不好用。它们仅仅构建了一个树的森林，每个树都只有一个节点。第三个构造函数看起来特别没用，因为节点按照键的哈希值决定的看似随机的顺序出现。\n\
  \n如何获取树模型？你可以通过创建一个实现 `TreeModel` 接口的类来构建你自己的模型。你将在本章稍后的部分看到如何这样做。目前我们将坚持使用 Swing\
  \ 库提供的 `DefaultTreeModel`。要构造一个默认树模型，你必须提供一个根节点。\n\n```\nTreeNode root = ...\nvar\
  \ model = new DefaultTreeModel(root);\n```\n\n`TreeNode` 是另一个接口。用实现该接口的任何类的对象填充默认树模型。目前我们将使用\
  \ Swing 提供的具体节点类——即 `DefaultMutableTreeNode`。该类实现了 `MutableTreeNode` 接口，它是 `TreeNode`\
  \ 的子接口（参见图 12.13）。\n\n![Figure](img/fig06-17.jpg)Figure 12.13: 树类\n\n默认可变树节点持有一个对象——`user\
  \ object`（用户对象）。树渲染所有节点的用户对象。除非你指定渲染器，否则树将显示 `toString` 方法结果的字符串。\n\n在第一个示例中，我们使用字符串作为用户对象。在实践中，你通常用更有表现力的用户对象填充树。例如，在显示目录树时，使用\
  \ `File` 对象作为节点是有意义。\n\n你可以在构造函数中指定用户对象，也可以稍后用 `setUserObject` 方法设置。\n\n```\nvar\
  \ node = new DefaultMutableTreeNode(\"Texas\");\n...\nnode.setUserObject(\"California\"\
  );\n```\n\n接下来，你需要建立节点之间的父子关系。从根节点开始并使用 `add` 方法添加子节点：\n\n```\nvar root = new DefaultMutableTreeNode(\"\
  World\");\nvar country = new DefaultMutableTreeNode(\"USA\");\nroot.add(country);\n\
  var state = new DefaultMutableTreeNode(\"California\");\ncountry.add(state);\n```\n\
  \n图 12.14 展示了树的外观。\n\n![Figure](img/fig06-18.jpg)Figure 12.14: 简单树\n\n以这种方式连接所有节点。然后，用根节点构造一个\
  \ `DefaultTreeModel`。最后，用树模型构造一个 `JTree`。\n\n```\nvar treeModel = ...\nvar tree\
  \ = new JTree(treeModel);\n```\n\n或者，作为快捷方式，你可以直接将根节点传递给 `JTree` 构造函数。树会自动构造一个默认模型：\n\
  \n```\nvar tree = new JTree(root);\n```\n\n列表 12.8 包含了完整的代码。\n\n```java\npackage\
  \ tree;\n\nimport javax.swing.*;\nimport javax.swing.tree.*;\n\n/**\n * 此帧包含一个显示手动构建树模型的简单树。\n\
  \ */\npublic class SimpleTreeFrame extends JFrame\n{\n   private static final int\
  \ DEFAULT_WIDTH = 300;\n   private static final int DEFAULT_HEIGHT = 200;\n\n  \
  \ public SimpleTreeFrame()\n   {\n      setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\
  \n      // 设置树数据\n\n      var root = new DefaultMutableTreeNode(\"World\");\n  \
  \    var country = new DefaultMutableTreeNode(\"USA\");\n      root.add(country);\n\
  \      var state = new DefaultMutableTreeNode(\"California\");\n      country.add(state);\n\
  \      var city = new DefaultMutableTreeNode(\"San Jose\");\n      state.add(city);\n\
  \      city = new DefaultMutableTreeNode(\"Cupertino\");\n      state.add(city);\n\
  \      state = new DefaultMutableTreeNode(\"Michigan\");\n      country.add(state);\n\
  \      city = new DefaultMutableTreeNode(\"Ann Arbor\");\n      state.add(city);\n\
  \      country = new DefaultMutableTreeNode(\"Germany\");\n      root.add(country);\n\
  \      state = new DefaultMutableTreeNode(\"Schleswig-Holstein\");\n      country.add(state);\n\
  \      city = new DefaultMutableTreeNode(\"Kiel\");\n      state.add(city);\n\n\
  \      // 构造树并将其放入滚动面板\n\n      var tree = new JTree(root);\n      add(new JScrollPane(tree));\n\
  \   }\n}\n```\n\n当你运行程序时，树首先看起来如图 12.15 所示。只有根节点及其子节点是可见。点击圆形图标（*handles*，手柄）来打开子树。从手柄图标伸出的线条在子树折叠时指向右侧，在子树展开时指向下方（参见图\
  \ 12.16）。我们不知道 Metal 界面（look-and-feel）的设计者是怎么想的，但我们认为图标是一个门把手。你按下手柄即可打开子树。\n\n![Figure](img/fig06-19.jpg)Figure\
  \ 12.15: 初始树显示![Figure](img/fig06-20.jpg)Figure 12.16: 折叠和展开的子树\n\n\n\n\n\n当然，树的显示取决于所选的外观（look-and-feel）。我们刚刚描述了\
  \ Metal 外观。在 Windows 外观中，句柄具有更熟悉的样式——一个方框内的“`–`”或“++”（参见图 12.17）。\n\n![Figure](img/fig06-21.jpg)图\
  \ 12.17: 具有 Windows 外观的树\n\n你可以使用以下这段“魔法咒语”来关闭连接父节点和子节点的线条（参见图 12.18）：\n\n```\n\
  tree.putClientProperty(\"JTree.lineStyle\", \"None\");\n```\n\n![Figure](img/fig06-22.jpg)图\
  \ 12.18: 无连接线的树\n\n相反，为了确保显示线条，请使用\n\n```\ntree.putClientProperty(\"JTree.lineStyle\"\
  , \"Angled\");\n```\n\n另一种线条样式 `\"Horizontal\"` 在图 12.19 中所示。树以水平线分隔显示，但这些线条仅分隔根节点的子节点。我不太确定这有什么用。\n\
  \n![Figure](img/fig06-23.jpg)图 12.19: 具有水平线条样式的树\n\n默认情况下，没有用于折叠树根节点的句柄。如果你愿意，可以通过以下调用来添加一个：\n\
  \n```\ntree.setShowsRootHandles(true);\n```\n\n图 12.20 显示了结果。现在你可以将整个整棵树折叠到根节点中。\n\
  \n![Figure](img/fig06-24.jpg)图 12.20: 具有根句柄的树\n\n相反，你可以完全隐藏根节点。这将为你显示一个*森林*（forest）——一组树，每个节点都有自己的根。你仍然必须将森林中的所有树连接到一个公共根；然后使用指令隐藏根节点：\n\
  \n```\ntree.setRootVisible(false);\n```\n\n看图 12.21。那里似乎有两个根节点，标记为“USA”和“Germany”。连接这两个者的实际根节点被设置为隐藏。\n\
  \n![Figure](img/fig06-25.jpg)图 12.21: 森林\n\n让我们从根节点转向树的叶子节点。注意，叶子节点的图标与其他节点不同（参见图\
  \ 12.22）。\n\n![Figure](img/fig06-26.jpg)图 12.22: 叶子和文件夹图标\n\n当树显示时，每个节点都带有一个图标。实际上有三种图标：叶子图标、打开的非叶子节点图标和关闭的非叶子节点图标。为了简单起见，我们将后两种统称为文件夹图标。\n\
  \n节点渲染器需要知道每个节点应该使用哪种图标。默认情况下，决策过程如下：如果一个节点的 `isLeaf` 方法返回 `true`，则使用叶子图标；否则，使用文件夹图标。\n\
  \n`DefaultMutableTreeNode` 类的 `isLeaf` 方法在节点没有子节点时返回 `true`。因此，有子节点的节点获得文件夹图标，而没有子节点的节点获得叶子图标。\n\
  \n有时，这种行为并不恰当。假设我们在示例树中添加了一个名为“Montana”（蒙特拿州）的节点，但我们不知道应该添加哪些城市。我们不希望该州节点获得叶子图标，因为从概念上讲，只有城市才是叶子节点。\n\
  \n`JTree` 类并不知道哪些节点应该是叶子。它会询问树模型。如果一个没有子节点的节点自动不是概念上的叶子，你可以要求树模型使用不同的标准来判断是否为叶子——即查询“允许子节点”（allows\
  \ children）属性。\n\n对于那些不应该有子节点的节点，调用：\n\n```\nnode.setAllowsChildren(false);\n```\n\
  \n然后，告诉树模型查询“允许子节点”属性的值，以确定节点是否应该用叶子图标显示。使用 `DefaultTreeModel` 类的 `setAsksAllowsChildren`\
  \ 方法来设置此行为：\n\n```\nmodel.setAsksAllowsChildren(true);\n```\n\n使用此决策标准，允许子节点的节点获得文件夹图标，而不允许子节点的节点获得叶子图标。\n\
  \n或者，如果你从根节点开始构建树，请在构造函数中提供“询问允许子节点”属性的设置。\n\n```\nvar tree = new JTree(root, true);\
  \ // 不允许子节点的节点获得叶子图标\n```\n\n`javax.swing.JTree` 1.2\n\n* `JTree(TreeModel model)`：从树模型构建树。\n\
  * `JTree(TreeNode root)`\n* `JTree(TreeNode root, boolean asksAllowChildren)`：使用默认树模型构建树，该模型显示根节点及其子节点。\n\
  * `void setShowsRootHandles(boolean b)`：如果 `b` 为 `true`，根节点具有折叠或展开的句柄。\n* `void\
  \ setRootVisible(boolean b)`：如果 `b` 为 `true`，则显示根节点。否则，它被隐藏。\n\n`javax.swing.tree.TreeNode`\
  \ 1.2\n\n* `boolean isLeaf()`：如果节点是叶子，则返回 `true`。\n* `boolean allowsChildren()`：如果节点可以有子节点，则返回\
  \ `true`。\n\n`javax.swing.tree.MutableTreeNode` 1.2\n\n* `void setUserObject(Object\
  \ userObject)`：设置树使用的“用户对象”。\n\n`javax.swing.tree.TreeModel` 1.2\n\n* `boolean isLeaf(Object\
  \ node)`：如果 `node` 应作为叶子显示，则返回 `true`。\n\n`javax.swing.tree.DefaultTreeModel` 1.2\n\
  \n* `void setAsksAllowsChildren(boolean b)`：如果 `b` 为 `true`，作为叶子显示。否则，当 `allowsChildren`\
  \ 返回 `false` 时，它们是叶子。\n\n`javax.swing.tree.DefaultMutableTreeNode` 1.2\n\n* `DefaultMutableTreeNode(Object\
  \ userObject)`：使用给定的用户对象构造可变树节点。\n* `void add(MutableTreeNode child)`：将节点作为该节点的最后一个子节点添加。\n\
  * `void setAllowsChildren(boolean b)`：如果 `b` 为 `true`，可以向此节点添加节点。\n\n`javax.swing.JComponent`\
  \ 1.2\n\n* `void putClientProperty(Object key, Object value)`：向组件管理的表添加键值对。\n\n\
  ### 12.4.2 编辑树与路径\n\n在下一个示例中，你将看到如何编辑树。图 12.23 显示了用户界面。如果你点击“添加兄弟节点”或“添加子节点”按钮，程序会在树中添加新节点（标记为\
  \ New）。如果你点击“删除”按钮，程序将删除选中的节点。\n\n要实现这种行为，你需要找到当前选中的树节点。`JTree` 类识别节点的方式非常出乎意料。它不处理树节点，而是处理对象的路径，称为“树路径”（tree\
  \ paths）。树路径从根开始，由一系列子节点组成（参见图 12.24）。\n\n你可能奇怪为什么 `JTree` 类需要整个路径。难道不能只获取一个 `TreeNode`\
  \ 并不断调用 `getParent` 方法吗？事实上，`JTree` 类对 `TreeNode` 接口一无所知。该接口从未被 `TreeModel` 接口使用；它只被\
  \ `DefaultTreeModel` 实现使用。你可以拥有其他的树模型，其节点完全没有实现 `TreeNode` 接口。\n\n\n\n\n`TreePath`\
  \ 类管理着一组 `Object`（注意不是 `TreeNode`！）引用。许多 `JTree` 方法会返回 `TreePath` 对象。当你有一个树路径时，通常只需要知道末端节点，你可以通过\
  \ `getLastPathComponent` 方法获取它。例如，要找到树中当前选中的节点，请使用 `JTree` 类的 `getSelectionPath`\
  \ 方法。你将得到一个 `TreePath` 对象，并从中检索出实际节点。\n\n```\nTreePath selectionPath = tree.getSelectionPath();\n\
  var selectedNode = (DefaultMutableTreeNode) selectionPath.getLastPathComponent();\n\
  ```\n\n实际上，由于这种查询非常常见，有一个便利方法可以直接获取选中的节点：\n\n```\nvar selectedNode = (DefaultMutableTreeNode)\
  \ tree.getLastSelectedPathComponent();\n```\n\n该方法没有命名为 `getSelectedNode`，因为树并不知道自己包含节点——它的树模型只处理对象的路径。\n\
  \n树路径是 `JTree` 类描述节点的两种方式之一。相当多的 `JTree` 方法接收或返回一个整数索引——*行位置*。行位置仅仅是节点在树显示器中的行号（从\
  \ 0 开始）。只有可见节点才有行号，而且如果该节点之前的节点被展开、折叠或修改，该节点的行号就会改变。出于因此，你应该避免使用行位置。所有使用行位置的 `JTree`\
  \ 方法都有使用树路径的对应方法。\n\n一旦获取了选中节点，就可以对其进行编辑。但是，不要直接向树节点添加子节点：\n\n```\nselectedNode.add(newNode);\
  \ // 不要！\n```\n\n如果你更改了节点的结构，改变了模型但关联的视图不会收到通知。你可以自己发送通知，但如果你使用 `DefaultTreeModel`\
  \ 类的 `insertNodeInto` 方法，则模型类会处理这一点。例如，以下调用会将新节点作为所选节点的最后一个子节点，并通知树视图：\n\n```\n\
  model.insertNodeInto(newNode, selectedNode, selectedNode.getChildCount());\n```\n\
  \n类似的调用 `removeNodeFromParent` 会移除节点并通知视图：\n\n```\nmodel.removeNodeFromParent(selectedNode);\n\
  ```\n\n如果你在保持节点结构不变的情况下更改了用户对象，你应该调用以下方法：\n\n```\nmodel.nodeChanged(changedNode);\n\
  ```\n\n自动通知是使用 `DefaultTreeModel` 的一个主要优势。如果你提供了自己的树模型，则必须手动实现自动通知。（详情请参见 Kim Topley\
  \ 写的 *Core Swing*。）\n\n`DefaultTreeModel` 类有一个 `reload` 方法，可以重新加载整个模型。但是，不要仅仅在做一些更改后就调用\
  \ `reload` 来更新树。当树重新生成时，根节点之外的所有节点都会再次被折叠。如果用户在每次更改后都必须展开树，这将令他们非常困扰。\n\n当视图收到节点结构的变化时，它会更新显示，但不会自动展开节点显示新添加的子节点。特别是，如果示例程序中的用户向一个当前处于折叠的节点添加新子节点，新节点将静默地添加到折叠的子树中。这没有给用户提供任何命令已实际执行的反馈。在这种情况下，你应该特意展开所有父节点，以便新添加的节点变得可见。使用\
  \ `JTree` 类的 `makeVisible` 方法来实现此目的。`makeVisible` 方法期望一个通向应显示节点的树路径。\n\n因此，你需要构建一个从根节点到新插入节点的树路径。要获取树路径，首先调用\
  \ `DefaultTreeModel` 类的 `getPathToRoot` 方法。它返回一个包含从节点到根节点所有节点的 `TreeNode[]` 数组。将该数组传递给\
  \ `TreePath` 构造函数。\n\n例如，让新节点可见的方法：\n\n```\nTreeNode[] nodes = model.getPathToRoot(newNode);\n\
  var path = new TreePath(nodes);\ntree.makeVisible(path);\n```\n\n奇怪的是，`DefaultTreeModel`\
  \ 类似乎装出对 `TreePath` 类几乎完全无知，尽管它的工作是与 `JTree` 通信。`JTree` 类频繁使用树路径，而且从不使用节点数组。\n\n\
  现在，假设你的树位于滚动面板中。在树节点展开后，新节点可能仍然不可，因为超出了视口。为了解决这个问题，请调用\n\n```\ntree.scrollPathToVisible(path);\n\
  ```\n\n而不是调用 `makeVisible`。此调用会展开路径上的所有节点，并告诉周围的滚动面板将路径末端的节点滚动到视野（参见图 12.25）。\n\n\
  ![Figure](img/fig06-29.jpg)图 12.25：滚动面板滚动以显示新节点。\n\n默认情况下，树节点是不可编辑的。然而，如果你调用\n\n\
  ```\ntree.setEditable(true);\n```\n\n用户只需通过双击、编辑字符串并按 Enter 键即可对节点进行编辑。双击会调用*默认单元格编辑器*，该编辑器由\
  \ `DefaultCellEditor` 类实现（参见图 12.26）。可以使用在我们在讨论表格单元格编辑器时看到的相同过程来安装其他单元格编辑器。\n\n\
  ![Figure](img/fig06-30.jpg)图 12.26：默认单元格编辑器\n\nListing 12.9 显示了树编辑程序的完整源代码。运行程序，添加几个节点，并通过双击编辑它们。观察折叠的节点如何展开以显示添加的子节点，以及滚动面板如何让添加的节点保持在视口内。\n\
  \nListing 12.9 treeEdit/TreeEditFrame.java\n\n\n\n\n\n```java\npackage treeEdit;\n\
