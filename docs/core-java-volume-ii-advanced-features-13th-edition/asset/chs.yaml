  \n### 11.5.3 复选框与单选框项\n\n*复选框*和*单选框*菜单项会在名称旁边显示复选框或单选框（参见 11.17）。当用户选择菜单项时，项会在选中和未选中状态之间切换。\n\
  \n除了按钮装饰，像处理其他项一样处理这些菜单项。例如，这里是创建复选框项的方法：\n\n```\nvar readonlyItem = new JMenuItem(\"\
  Read-only\");\noptionsMenu.add(readonlyItem);\n```\n\n单选框项的工作类似于普通的单选按钮。你必须将它们添加到按钮组中。当组中的一个按钮被选中时，其他的会自动取消选择。\n\
  \n```\nvar group = new ButtonGroup();\nvar insertItem = new JMenuItem(\"Insert\"\
  );\ninsertItem.setSelected(true);\nvar overtypeItem = new JMenuItem(\"Overtype\"\
  );\ngroup.add(insertItem);\ngroup.add(overtypeItem);\noptionsMenu.add(insertItem);\n\
  optionsMenu.add(overtypeItem);\n```\n\n对于这些菜单项，你并不一定希望用户选择时收到通知。相反，你可以简单地使用 `isSelected`\
  \ 方法测试项的状态。（当然，这意味着你需要将菜单项的引用存储在字段中。）使用 `setSelected` 方法设置状态。\n\n`javax.swing.JCheckBoxMenuItem`\
  \ 1.2\n\n*   `JCheckBoxMenuItem(String label)`\n    使用给定标签构造复选框项。\n*   `JCheckBoxMenuItem(String\
  \ label, boolean state)`\n    使用给定标签和初始状态构造复选框项（`true` 为选中）。\n\n`javax.swing.JRadioButtonMenuItem`\
  \ 1.2\n\n*   `JRadioButtonMenuItem(String label)`\n    使用给定标签构造单选框项。\n*   `JRadioButtonMenuItem(String\
  \ label, boolean state)`\n    使用给定标签和初始状态构造单选框项（`true` 为选中）。\n\n`javax.swing.AbstractButton`\
  \ 1.2\n\n*   `boolean isSelected()`\n*   `void setSelected(boolean state)`\n   \
  \ 获取或设置此项的选择状态（`true` 为选中）。\n\n### 11.5.4 弹出菜单\n\n*弹出菜单*是不附着在菜单栏上而是悬浮在某处的菜单（参见 图\
  \ 11.18）。\n\n![Figure](img/menu3.jpg)图 11.18: 弹出菜单\n\n创建弹出菜单的方法与创建普通菜单一样，只是弹出菜单没有标题。\n\
  \n\n\n\n\n```\nvar popup = new JPopupMenu();\n```\n\n然后，像往一样添加你的菜单项：\n\n```\nvar\
  \ item = new JMenuItem(\"Cut\");\nitem.addActionListener(listener);\npopup.add(item);\n\
  ```\n\n与始终显示在框架顶部的普通菜单栏不同，你必须使用 `show` 方法显式地显示弹出菜单。使用父组件的坐标系，指定父组件和弹出菜单的位置。例如：\n\
  \n```\npopup.show(panel, x, y);\n```\n\n通常情况下，你希望在用户点击特定的鼠标按钮时弹出菜单——这就是所谓的 `pop-up\
  \ trigger`（弹出触发器）。在 Windows 和 ⽣（Linux）中，弹出触发器是非主鼠标按钮（通常是右键）。若要在用户使用弹出触发器点击组件时弹出菜单，只需调用该方法即可：\n\
  \n```\ncomponent.setComponentPopupMenu(popup);\n```\n\n在极少数情况下，你可能会将一个组件放在另一个带有弹出菜单的组件内部。子组件可以通过调用以下方法继承父组件的弹出菜单：\n\
  \n```\nchild.setInheritsPopupMenu(true);\n```\n\n### `javax.swing.JPopupMenu` 1.2\n\
  \n*   `void show(Component c, int x, int y)`\n    在组件 `c` 之上显示弹出菜单，其左上角位于 `(x, y)`（在\
  \ `c` 的坐标空间内）。\n\n*   `boolean isPopupTrigger(MouseEvent event)` 1.3\n    如果鼠标事件是弹出菜单触发器，则返回\
  \ `true`。\n\n### `java.awt.event.MouseEvent` 1.1\n\n*   `boolean isPopupTrigger()`\n\
  \    如果此鼠标事件是弹出菜单触发器，则返回 `true`。\n\n### `javax.swing.JComponent` 1.2\n\n*   `JPopupMenu\
  \ getComponentPopupMenu()` 5.0\n*   `void setComponentPopupMenu(JPopupMenu popup)`\
  \ 5.0\n    获取或设置此组件的弹出菜单。\n*   `boolean getInheritsPopupMenu()` 5.0\n*   `void setInheritsPopupMenu(boolean\
  \ b)` 5.0\n    获取或设置 `inheritsPopupMenu` 属性。如果属性已设置且此组件的弹出菜单为 `null`，则使用其父组件的弹出菜单。\n\
  \n### 11.5.5. 键盘助记符与加速器\n\n对于经验用户来说，通过 `keyboard mnemonics`（键盘助记符）选择菜单项是一种真正的便利。你可以通过在菜单项构造函数中指定助记字母来为菜单项创建键盘助记符：\n\
  \n```\nvar aboutItem = new JMenuItem(\"About\", 'A');\n```\n\n键盘助记符会自动显示在菜单中，且助记字母带有下划线（参见图\
  \ 11.19）。例如，在上一个示例定义的项中，标签将显示为“关于 About”，其中字母 ‘A’ 带有下划线。当菜单显示时，用户只需按下 `A` 键即可选中该菜单项。（如果助记字母不是菜单字符串的一部分，输入它仍然可以选中该项，但助记符不会显示在菜单中。自然地，这种不可见的助记符用处很存疑。）\n\
  \n![Figure](img/menu4.jpg)图 11.19: 键盘助记符\n\n有时，你并不想下划线匹配助记符的菜单项的字母。例如，如果你为“另存为”（Save\
  \ As）菜单项设置了助记符 “A”，那么下划线第二个 “A”（Save As）会更有意义。你可以通过调用 `setDisplayedMnemonicIndex`\
  \ 方法指定你想要带有下划线的字符。\n\n如果你有一个 `Action` 对象，可以将助记符作为 `Action.MNEMONIC_KEY` 键的值添加，如下：\n\
  \n```\naboutAction.putValue(Action.MNEMONIC_KEY, Integer.valueOf('A'));\n```\n\n\
  你只能在菜单项的构造函数中提供助记字母，而不能在菜单的构造函数中。要为菜单附加助记符，请调用 `setMnemonic` 方法：\n\n```\nvar helpMenu\
  \ = new JMenu(\"Help\");\nhelpMenu.setMnemonic('H');\n```\n\n要从菜单栏中选择顶级菜单，请按下 `Alt`\
  \ 键配合助记字母。例如，按下 `Alt+H` 可从菜单栏中选择“帮助”菜单。\n\n键盘助记符允许你从当前打开的菜单中选择子菜单或菜单项。相比之下，`accelerators`（加速器）是键盘快捷键，允许你无需打开菜单即可选择菜单项。例如，许多程序将\
  \ `Ctrl+O` 和 `Ctrl+S` 加速器附加到“文件”菜单中的“打开”和“保存”项。使用 `setAccelerator` 方法为菜单项附加加速键。`setAccelerator`\
  \ 方法接收一个 `Keystroke` 类型的对象。例如，以下调用将加速器 `Ctrl+O` 附加到 `openItem` 菜单项：\n\n```\nopenItem.setAccelerator(KeyStroke.getKeyStroke(\"\
  ctrl O\"));\n```\n\n输入加速键组合会自动选中菜单选项并触发动作事件，就好像用户手动选择了该菜单选项一样。\n\n你只能将加速器附加到菜单项，而不能附加到菜单。加速键实际上不会打开菜单。相反，它们会直接触发与菜单相关的动作事件。\n\
  \n从概念上讲，为菜单项添加加速器与向菜单添加加速器的技术类似。\n\n![Figure](img/menu5.jpg)图 11.20: 加速器\n\n###\
  \ `javax.swing.JMenuItem` 1.2\n\n*   `JMenuItem(String label, int mnemonic)`\n \
  \   使用指定的标签和助记符构造菜单项。\n*   `void setAccelerator(KeyStroke k)`\n    将击键 `k` 设置为菜单项的加速器。\n\
  \n### `javax.swing.AbstractButton` 1.2\n\n*   `void setMnemonic(int mnemonic)`\n\
  \    为按钮设置助记符。\n*   `void setDisplayedMnemonicIndex(int index)`\n    设置要下划线的字符索引。\n\
  \n### 11.5.6. 禁用项\n\n有时，特定的菜单项仅在某些上下文中才可用。例如，当文档以只读模式打开时，“保存”菜单项没有意义。当然，我们可以使用 `JMenu.remove`\
  \ 方法从菜单中移除该项，但用户会对不断变化的菜单内容感到意外。相反，禁用暂时不适当命令的菜单项更好。禁用的菜单项显示为灰色且无法选择（参见图 11.21）。\n\
  \n![Figure](img/menu6.jpg)图 11.21: 禁用菜单项\n\n要启用或禁用菜单项，请使用 `setEnabled` 方法：\n\n```\n\
  saveItem.setEnabled(false);\n```\n\n启用和禁用菜单项有两种策略。每当情况发生时，都可以对相关的菜单项或动作调用 `setEnabled`。例如，一旦文档被设置为只读模式，就可以定位“保存”和“另存为”动作并禁用它们。或者，你可以在显示菜单之前禁用项。为了实现这一点，你需要为“菜单选中”事件注册监听器。`javax.swing.event`\
  \ 包定义了 `MenuListener` 接口，包含三个方法：\n\n```\nvoid menuSelected(MenuEvent event)\nvoid\
  \ menuDeselected(MenuEvent event)\nvoid menuCanceled(MenuEvent event)\n```\n\n`menuSelected`\
  \ 方法在菜单显示之前被调用。因此，它可以用于启用或禁用菜单项。以下代码显示了当“只读”复选框菜单项被选中时，如何禁用“保存”和“另存为”动作：\n\n```\n\
  public void menuSelected(MenuEvent event)\n{\n   saveAction.setEnabled(!readonlyItem.isSelected());\n\
  \   saveAsAction.setEnabled(!readonlyItem.isSelected());\n}\n```\n\n\n\n在显示菜单之前禁用菜单项是一个聪明的主意，但它对于带有快捷键（accelerator\
  \ keys）的菜单项不起作用。因为当按下快捷键时菜单并不会打开，因此该动作不会被禁用，并且仍然会被快捷键触发。\n\n`javax.swing.JMenuItem`\
  \ 1.2\n\n*   `void setEnabled(boolean b)`\n    启用或禁用菜单项。\n\n*   `javax.swing.event.MenuListener`\
  \ 1.2\n\n*   `void menuSelected(MenuEvent e)`\n    在菜单被选中（但在打开之前）时调用。\n\n*   `void\
  \ menuDeselected(MenuEvent e)`\n    在菜单被取消选择（但在关闭之后）时调用。\n\n*   `void menuCanceled(MenuEvent\
  \ e)`\n    在菜单被取消（例如，用户点击菜单外部）时调用。\n\n列表 11.6 是一个生成一组菜单的示例程序。它展示了在本节中你看到的所有功能：嵌套菜单、禁用的菜单项、复选框和单选按钮菜单项、弹出菜单，以及键盘助符（mnemonics）和快捷键。\n\
  \n列表 11.6 `menu/MenuFrame.java`\n\n```java\npackage menu;\n\nimport java.awt.event.*;\n\
  import javax.swing.*;\n\n/**\n * 一个带有示例菜单栏的框架。\n */\npublic class MenuFrame extends\
  \ JFrame\n{\n   private static final int DEFAULT_WIDTH = 300;\n   private static\
  \ final int DEFAULT_HEIGHT = 200;\n   private Action saveAction;\n   private Action\
  \ saveAsAction;\n   private JCheckBoxMenuItem readonlyItem;\n\n   /**\n    * 一个将动作名称打印到\
  \ System.out 的示例动作。\n    */\n   class TestAction extends AbstractAction\n   {\n\
  \      public TestAction(String name)\n      {\n         super(name);\n      }\n\
  \n      public void actionPerformed(ActionEvent event)\n      {\n         System.out.println(getValue(Action.NAME)\
  \ + \" selected.\");\n      }\n   }\n\n   public MenuFrame()\n   {\n      setSize(DEFAULT_WIDTH,\
  \ DEFAULT_HEIGHT);\n\n      var fileMenu = new JMenu(\"File\");\n      fileMenu.add(new\
  \ TestAction(\"New\"));\n\n      // 展示快捷键\n\n      var openItem = fileMenu.add(new\
  \ TestAction(\"Open\"));\n      openItem.setAccelerator(KeyStroke.getKeyStroke(\"\
  ctrl O\"));\n\n      fileMenu.addSeparator();\n\n      saveAction = new TestAction(\"\
  Save\");\n      JMenuItem saveItem = fileMenu.add(saveAction);\n      saveItem.setAccelerator(KeyStroke.getKeyStroke(\"\
  ctrl S\"));\n\n      saveAsAction = new TestAction(\"Save As\");\n      fileMenu.add(saveAsAction);\n\
  \      fileMenu.addSeparator();\n\n      fileMenu.add(new AbstractAction(\"Exit\"\
  )\n         {\n            public void actionPerformed(ActionEvent event)\n    \
  \        {\n               System.exit(0);\n            }\n         });\n\n    \
  \  // 展示复选框和单选按钮菜单\n\n      readonlyItem = new JCheckBoxMenuItem(\"Read-only\");\n\
  \      readonlyItem.addActionListener(event -> {\n         boolean saveOk = !readonlyItem.isSelected();\n\
  \         saveAction.setEnabled(saveOk);\n         saveAsAction.setEnabled(saveOk);\n\
  \      });\n\n      var group = new ButtonGroup();\n\n      var insertItem = new\
  \ JRadioButtonMenuItem(\"Insert\");\n      insertItem.setSelected(true);\n     \
  \ var overtypeItem = new JRadioButtonMenuItem(\"Overtype\");\n\n      group.add(insertItem);\n\
  \      group.add(overtypeItem);\n\n      // 展示图标\n\n      var cutAction = new TestAction(\"\
  Cut\");\n      cutAction.putValue(Action.SMALL_ICON, new ImageIcon(\"cut.gif\"));\n\
  \      var copyAction = new TestAction(\"Copy\");\n      copyAction.putValue(Action.SMALL_ICON,\
  \ new ImageIcon(\"copy.gif\"));\n      var pasteAction = new TestAction(\"Paste\"\
  );\n      pasteAction.putValue(Action.SMALL_ICON, new ImageIcon(\"paste.gif\"));\n\
  \n      var editMenu = new JMenu(\"Edit\");\n      editMenu.add(cutAction);\n  \
  \    editMenu.add(copyAction);\n      editMenu.add(pasteAction);\n\n      // 展示嵌套菜单\n\
  \n      var optionMenu = new JMenu(\"Options\");\n\n      optionMenu.add(readonlyItem);\n\
  \      optionMenu.addSeparator();\n      optionMenu.add(insertItem);\n      optionMenu.add(overtypeItem);\n\
  \n      editMenu.addSeparator();\n      editMenu.add(optionMenu);\n\n      // 展示助符键\n\
