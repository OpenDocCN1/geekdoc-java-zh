  \ 8\n\n- `<U> Optional<U> flatMap(Function<? super T,Optional<U>> mapper)` 9\n\n\
  产生将 `mapper` 应用于此 `Optional` 值的的结果；如果此 `Optional` 为空，则返回一个空的 `Optional`。\n\n## 1.8\
  \ 收集结果\n\n当你完成流（stream）的操作后，通常希望查看结果。你可以调用 `iterator` 方法，它会返回一个传统的迭代器，你可以使用它来访问元素。\n\
  \n或者，你可以调用 `forEach` 方法对每个元素应用一个函数：\n\n```\nstream.forEach(System.out::println);\n\
  ```\n\n在并行流上，`forEach` 方法以任意顺序遍历元素。如果你希望按照流的顺序处理元素，请调用 `forEachOrdered`。当然，你可能会因此放弃部分或全部并行带来的优势。\n\
  \n但大多数情况下，你可能希望将结果收集到数据结构中。你已经见过 `toList` 方法，它会生成包含流元素的列表。\n\n调用 `toArray` 来获取流元素的数组。\n\
  \n由于在运行时无法创建泛型数组，表达式 `stream.toArray()` 返回一个 `Object[]` 数组。如果你需要正确类型的数组，请传入数组构造函数：\n\
  \n```\nString[] result = stream.toArray(String[]::new);\n   // stream.toArray()\
  \ 类型为 Object[]\n```\n\n将流元素收集到另一个目标，有一个方便的 `collect` 方法，它接收 `Collector` 接口的实例。`collector`\
  \ 是一个积累元素并产生结果的对象。`Collectors` 类为常用的收集器提供了许多工厂方法。在 Java 16 添加 `toList` 方法之前，你必须使用由\
  \ `Collectors.toList()` 产生的收集器：\n\n```\nList<String> result = stream.collect(Collectors.toList());\n\
  ```\n\n同样，这里是如何将流元素收集到集合（set）：\n\n```\nSet<String> result = stream.collect(Collectors.toSet());\n\
  ```\n\n这些调用会给你一个列表或集合，但你不能进行任何进一步的假设。该集合可能是不可变的、可序列化的或线程安全的。如果你想控制获取的是哪种集合，请改用以下调用：\n\
  \n```\nTreeSet<String> result = stream.collect(Collectors.toCollection(TreeSet::new));\n\
  ```\n\n假设你想通过拼接流中的所有字符串来收集它们。你可以调用：\n\n```\nString result = stream.collect(Collectors.joining());\n\
  ```\n\n如果你想在元素之间添加分隔符，请将其传递给 `joining` 方法：\n\n```\nString result = stream.collect(Collectors.joining(\"\
  , \"));\n```\n\n如果你的流包含字符串以外的对象，你需要先将它们转换为字符串，如下所示：\n\n```\nString result = stream.map(Object::toString).collect(Collectors.joining(\"\
  , \"));\n```\n\n如果你想将流的结果归约为总和、计数、平均值、最大值或最小值，请使用 `summarizing`（`Int`|`Long`|`Double`）方法之一。这些方法接收一个将流对象映射到数字的函数，并产生类型为\
  \ (`Int`|`Long`|`Double`）的 `SummaryStatistics` 结果，同时计算总和、计数、平均值、最大值最小值。\n\n```\n\
  IntSummaryStatistics summary = stream.collect(\n   Collectors.summarizingInt(String::length));\n\
  double averageWordLength = summary.getAverage();\ndouble maxWordLength = summary.getMax();\n\
  ```\n\nListing 1.4 中的示例程序展示了如何从流中收集元素。\n\nListing 1.4 collecting/CollectingResults.java\n\
  \n\n\n\n\n```java\npackage collecting;\n\nimport java.io.*;\nimport java.nio.file.*;\n\
  import java.util.*;\nimport java.util.stream.*;\n\n/**\n * @version 1.02 2019-08-28\n\
  \ * @author Cay Horstmann\n */\npublic class CollectingResults\n{\n   public static\
  \ Stream<String> noVowels() throws IOException\n   {\n      String contents = Files.readString(Path.of(\"\
  ../gutenberg/alice30.txt\"));\n      List<String> wordList = List.of(contents.split(\"\
  \\\\PL+\"));\n      Stream<String> words = wordList.stream();\n      return words.map(s\
  \ -> s.replaceAll(\"[aeiouAEIOU]\", \"\"));\n   }\n\n   public static <T> void show(String\
  \ label, Set<T> set)\n   {\n      System.out.print(label + \": \" + set.getClass().getName());\n\
  \      System.out.println(\"[\"\n         + set.stream().limit(10).map(Object::toString).collect(Collectors.joining(\"\
  , \")) \n         + \"]\");\n   }\n\n   public static void main(String[] args) throws\
  \ IOException\n   {\n      Iterator<Integer> iter = Stream.iterate(0, n -> n + 1).limit(10).iterator();\n\
  \      while (iter.hasNext())\n         System.out.println(iter.next());\n\n   \
  \   Object[] numbers = Stream.iterate(0, n -> n + 1).limit(10).toArray();\n    \
  \  System.out.println(\"Object array:\" + numbers); \n         // 注意：这是一个 Object[]\
  \ 数组\n\n      try\n      {\n         var number = (Integer) numbers[0]; // OK\n\
  \         System.out.println(\"number: \" + number);\n         System.out.println(\"\
  The following statement throws an exception:\");\n         var numbers2 = (Integer[])\
  \ numbers; // 抛出异常\n      }\n      catch (ClassCastException e)\n      {\n     \
  \    System.out.println(e);\n      }\n\n      Integer[] numbers3 = Stream.iterate(0,\
  \ n -> n + 1)\n         .limit(10)\n         .toArray(Integer[]::new);\n      System.out.println(\"\
  Integer array: \" + numbers3); \n         // 注意：这是一个 Integer[] 数组\n\n      Set<String>\
  \ noVowelSet = noVowels().collect(Collectors.toSet());\n      show(\"noVowelSet\"\
  , noVowelSet);\n\n      TreeSet<String> noVowelTreeSet = noVowels().collect(\n \
