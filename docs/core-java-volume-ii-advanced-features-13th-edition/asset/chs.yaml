  \ popup.add(cutAction); // 注意：这里有重复\n      popup.add(pasteAction);\n\n      var\
  \ panel = new JPanel();\n\n      panel.add(popup);\n      add(panel);\n   }\n}\n\
  ```\n\n### 11.5.7 工具栏 (Toolbars)\n\n工具栏是一种提供对常用命令快速访问的栏（参见图 11.22）。\n\n工具栏的特殊之处在于它可以移动。你可以将工具栏拖动到某个边界处（参见图\
  \ 11.23）。\n\n工具栏可以完全从框架中分离。分离后的工具栏包含在自己的框架中（参见图 11.24）。\n\n工具栏的编写非常简单。向工具栏中添加组件：\n\
  \n```java\nvar toolbar = new JBar();\ntoolbar.add(blueButton);\n```\n\n`JToolBar`\
  \ 类还有一个添加 `Action` 的方法。只需向工具栏填充 `Action` 对象即可：\n\n```java\ntoolbar.add(blueAction);\n\
  ```\n\n你可以使用分隔符来区分按钮组：\n\n```java\ntoolbar.addSeparator();\n```\n\n例如，图 11.22 中的工具栏在第三和第四个按钮之间有一个分隔符。\n\
  \n然后，将工具栏添加到框架：\n\n```java\nadd(toolbar, BorderLayout.NORTH);\n```\n\n你还可以为工具栏指定一个标题，当工具栏悬浮时显示：\n\
  \n```java\ntoolbar = new JToolBar(titleString);\n```\n\n默认情况下，工具栏初始是水平的。要让工具栏初始为垂直，请使用：\n\
  \n```java\ntoolbar = new JToolBar(SwingConstants.VERTICAL)\n```\n\n或\n\n```java\n\
  toolbar = new JToolBar(titleString, SwingConstants.VERTICAL)\n```\n\n按钮是工具栏内部常见的组件。但对于可以添加到工具栏的组件并没有限制。例如，你可以向工具栏添加组合框。\n\
  \n### 11.5.8 提示 (Tooltip)\n\n工具栏的一个缺点是，用户往往对工具栏中微小图标的含义感到困惑。为了解决这个问题，用户界面设计师发明了提示（tooltips）。当光标悬停在按钮上片刻时，提示会被激活。提示文本显示在颜色的矩形内。当用户移动鼠标时，提示就会消失。（参见图\
  \ 11.26）。\n\n![Figure](img/toolbar5.jpg)图 11.26: 提示\n\n在 Swing 中，你只需通过调用 `setToolTipText`\
  \ 方法即可为任何 `JComponent` 添加提示：\n\n\n\n\n\n```\nexitButton.setToolTipText(\"Exit\"\
  );\n```\n\n或者，如果你使用 `Action` 对象，则将工具提示与 `SHORT_DESCRIPTION` 键关联起来：\n\n```\nexitAction.putValue(Action.SHORT_DESCRIPTION,\
  \ \"Exit\");\n```\n\n`javax.swing.JToolBar` 1.2\n\n*   `JToolBar()`\n*   `JToolBar(String\
  \ titleString)`\n*   `JToolBar(int orientation)`\n*   `JToolBar(String titleString,\
  \ int orientation)`\n    根据给定的标题字符串和方向创建一个布局栏。`orientation` 是 `SwingConstants.HORIZONTAL`（默认值）或\
  \ `SwingConstants.VERTICAL` 之一。\n*   `JButton add(Action a)`\n    在布局栏内部创建一个根据给定\
  \ action 具有名称、图标、短描述和动作回调的新按钮，并将该按钮添加到布局栏的末尾。\n*   `void addSeparator()`\n    在布局栏末尾添加一个分隔符。\n\
  \n`javax.swing.JComponent` 1.2\n\n*   `void setToolTipText(String text)`\n    设置当鼠标悬停在组件上时应显示为工具提示的文本。\n\
  \n## 11.6. Grid Bag Layout\n\n到目前为止，我们示例应用程序的用户界面仅使用了边框布局（border layout）、流布局（flow\
  \ layout）和网格布局（grid layout）。对于更复杂的任务，这些是不够的。\n\n从 Java 1.0 开始，AWT 就包含了 `grid bag\
  \ layout`，它可以在行和列中布局组件。行和列的大小是灵活的，组件可以跨越多行多列。这种布局管理器非常灵活，但也非常复杂。仅仅是提到“grid bag layout”这些词，就让\
  \ Java 程序员感到恐惧。\n\n在尝试设计一种能让程序员摆脱 grid bag layout 统治的布局管理器时失败后，Swing 设计者提出了 `box\
  \ layout`。根据 `BoxLayout` 类的 JDK 文档：“嵌套多个具有不同水平和垂直（*sic*）组合的面板，可以产生与 `GridBagLayout`\
  \ 类似的效果，而不会具有其复杂性。”然而，由于每个框都是独立布局的，你无法使用箱布局同时在水平和垂直方向上排列相邻的组件。\n\nJava 1.4 出现了另一个设计替代\
  \ grid bag layout 的尝试——`spring layout`，你使用想象的弹簧来连接容器中的组件。当容器调整 own 同时，弹簧会拉伸或收缩，从而调整组件的位置。这听起来既乏味又混乱，事实也是。spring\
  \ layout 很快就淡出了舞台。\n\nNetBeans IDE 结合了布局工具（称为“Matisse”）和布局管理器。用户界面设计师使用该工具将组件拖入容器中，并指示哪些组件应该对齐。该工具将设计者的意图翻译成\
  \ `group layout manager` 的指令。这比手动编写布局管理代码要方便得多。\n\n在接下来的章节中，我将介绍 grid bag layout，因为它是常用的，而且仍然通过程序生成布局代码最简单的机制。我将向你展示一种策略，在常见情况下让\
  \ grid bag layout 变得相对不痛苦。\n\n### 11.6.1 Grid Bag 基础\n\ngrid bag layout 是所有布局管理器的母体。你可以将\
  \ grid bag layout 想为一个没有限制的网格布局。在 grid bag layout 中，行和列可以具有任意的大小。你可以合并相邻单元格为更大的组件留出空间。（许多文字处理器以及\
  \ HTML 都为表格提供了类似的功能：你可以从一个网格开始，然后根据需要合并相邻单元格。）组件不需要填充整个单元格区域，你可以指定它们在单元格内的对齐方式。\n\
  \n考虑图 11.27 中的字体选择器。它由以下组件组成：\n\n*   两个指定字体和大小的组合框\n*   这两个组合框的标签\n*   两个用于选择加粗和斜体的复选框\n\
  *   一个用于示例字符串的文本区域\n\n![Figure](img/gridbaglayouttest.jpg)图 11.27：字体选择器\n\n现在将容器划分为单元格网格，如图\
  \ 11.28 所示。（行和列的大小不需要相等。）每个复选框跨越两列，文本区域跨越四行。\n\n![Figure](img/09_30.jpg)图 11.28：设计中使用的对话框网格\n\
  \n要向 grid bag 管理器描述布局，使用以下步骤：\n\n1.  创建一个类型为 `GridBagLayout` 的对象。你不需要告诉它底层网格有多少行和多少列。相反，布局管理器将尝试从你之后提供的信息中猜测。\n\
  2.  将此 `GridBagLayout` 对象设置为组件的布局管理器。\n3.  对于每个组件，创建一个类型为 `GridBagConstraints` 的对象。设置\
  \ `GridBagConstraints` 对象的字段值以指定组件在 grid bag 内的布局方式。\n4.  最后，使用调用调用添加带有约束的每个组件：\n\
  \n```\nadd(component, constraints);\n```\n\n这里是所需的代码示例。（我们将在后面的章节中详细详细介绍各种约束——所以如果你不知道某些约束的作用，请不要担心。）\n\
  \n```\nvar layout = new GridBagLayout();\npanel.setLayout(layout);\nvar constraints\
  \ = new GridBagConstraints();\nconstraints.weightx = 100;\nconstraints.weighty =\
  \ 100;\nconstraints.gridx = 0;\nconstraints.gridy = 2;\nconstraints.gridwidth =\
  \ 2;\nconstraints.gridheight = 1;\npanel.add(component, constraints);\n```\n\n关键在于如何设置\
  \ `GridBagConstraints` 的状态。我们将在后面的章节中讨论。\n\n### 11.6.2 `gridx`, `gridy`, `gridwidth`\
  \ 和 `gridheight` 参数\n\n`gridx`, `gridy`, `gridwidth` 和 `gridheight` 参数定义了组件在网格中的位置。`gridx`\
  \ 和 `gridy` 值指定了要添加组件左上角的列行位置。`gridwidth` 和 `gridheight` 值决定了它占据的列数行数。\n\n网格坐标从\
  \ `0` 开始。特别是 `gridx = 0` 和 `gridy = 0` 表示左上角。我们示例中的文本区域 `gridx = 2`, `gridy = 0`，因为它从第\
  \ 0 行的第 2 列（即第三列）开始。它的 `gridwidth = 1`, `gridheight = 4`，因为它跨越了一列四行。\n\n### 11.6.3\
  \ 权重字段\n\n你总是需要为 grid bag layout 中的每个区域设置权重字段（`weightx` 和 `weighty`）。如果你将权重设置为 `0`，则该区域在该方向上永远不会超出初始大小进行缩小。在图\
  \ 11.27 的 grid bag layout 中，我们将标签的 `weightx` 字段设置为 `0`。这允许标签在调整窗口大小时保持宽度不变。另一方面，如果你将所有区域的权重设置为\
  \ `0`，容器将聚集在其分配区域的中心，而不是扩展填充它。\n\n从概念上说，权重参数的问题在于权重是行和列的属性，而不是单个单元格的。但你需要为单元格指定它们，因为\
  \ grid bag layout 没有暴露行和列。行和列权重是通过每行或每列单元权重的最大值计算出的。因此，如果你想让某行或某列保持固定大小，你需要将其中所有组件的权重都设置为零。\n\
  \n\n\n\n注意，权重（weights）实际上并不代表列的相对大小。它们告诉如果容器超过了其首选尺寸，应该将多少比例的“剩余”空间分配给每个区域。这并不直观。我建议你将所有权重设置为\
  \ `100`。然后运行程序并查看布局效果。调整对话框的大小，观察行和列是如何调整的。如果你发现某一行或某列不应该变大，请将其中所有组件的权重设置为 0。你可以尝试调整其他的权重值，但通常不值得费此。\n\
  \n### 11.6.4. `fill` 和 `anchor` 参数\n\n如果你不想让组件拉伸并填充整个区域，可以设置 `fill` 约束。该参数有四种可能：有效值为\
  \ `GridBagConstraints.NONE`、`GridBagConstraints.HORIZONTAL`、`GridBagConstraints.VERTICAL`\
  \ 和 `GridBagConstraints.BOTH`。\n\n如果组件没有填充整个区域，你可以通过设置 `anchor` 字段来指定你希望它位于区域的哪个位置。有效值为\
  \ `GridBagConstraints.CENTER`（默认值）、`GridBagConstraints.NORTH`、`GridBagConstraints.NORTHEAST`、`GridBagConstraints.EAST`\
  \ 等。\n\n### 11.6.5. 边距 (Padding)\n\n你可以通过设置 `GridBagConstraints` 的 `insets` 字段为组件周围留出空白。将\
  \ `Insets` 对象的 `left`、`top`、`right` 和 `bottom` 值设置为在你组件周围想要的空间量。这被称为外部边距。\n\n`ipadx`\
  \ 和 `ipady` 值设置内部边距。这些值会加上组件的最小宽度和高度。这确保了组件不会缩小到最小尺寸。\n\n### 11.6.6. 指定 `gridx`,\
  \ `gridy`, `gridwidth`, 和 `gridheight` 参数的替代方法\n\nAWT 文档建议不要将 `gridx` 和 `gridy`\
  \ 值设为绝对位置，而是将它们设置为常量 `GridBagConstraints.RELATIVE`。然后，按照标准顺序将组件添加到网格布局中：从第一行从左到右，然后移动到下一行，依此类推。\n\
  \n你仍然需要通过提供相应的 `gridheight` 和 `gridwidth` 字段来指定跨越的行和列数。然而，如果组件延伸到最后一行或最后一列，你不需要指定实际数字，而是使用常量\
  \ `GridBagConstraints.REMAINDER`。这告诉布局管理器该组件是该行的最后一个。\n\n这种方案似乎有效。但向布局管理器隐藏实际的放置信息并希望它能重新发现这些，听起来真的非常愚蠢。\n\
  \n### 11.6.7. Grid Bag 布局配方 (Recipe)\n\n在实践中，以下配方可以使 grid bag 布局变得相对容易处理：\n\n1.\
  \ 在纸上画出组件布局。\n2. 找到一个网格，使得小型组件各包含在一个单元格中，而较大的组件跨越多个单元格。\n3. 用 0, 1, 2, 3, . . .\
  \ 为网格的行和列标记。现在你可以读取出 `gridx`、`gridy`、`gridwidth` 和 `gridheight` 值了。\n4. 对于每个组件，问自己它是否需要水平或垂直方向填充其单元格。如果不需要，你希望它如何对齐？这决定了\
  \ `fill` 和 `anchor` 参数。\n5. 将所有权重设置为 `100`。然而，如果你希望某一行或某列始终保持其默认大小，请将该行或该列所有组件的\
  \ `weightx` 或 `weighty` 设置为 `0`。\n6. 编写代码。仔细双检查你的 `GridBagConstraints` 设置。一个错误的约束就会毁掉你的整个布局。\n\
  7. 编译、运行并享受。\n\n### 11.6.8. 一个用于驯服 Grid Bag 约束的辅助类\n\ngrid bag 布局中最机械的部分是编写设置约束的代码。大多数程序员会为此目的编写辅助函数或一个小小的辅助类。我在字体对话框示例的完整代码之后介绍了这样一个类。该类具有以下特征：\n\
  \n* 它的名字很短：`GBC` 而不是 `GridBagConstraints`。\n* 它继承自 `GridBagConstraints`，因此你可以使用较短的名称如常量\
  \ `GBC.EAST`。\n* 在添加组件时使用 `GBC` 对象，例如：\n\n```\nadd(component, new GBC(1, 2));\n\
  ```\n\n* 有两个构造函数来设置最常用的参数：`gridx` 和 `gridy`，或者 `gridx`、`gridy`、`gridwidth` 和 `gridheight`。\n\
  \n```\nadd(component, new GBC(1, 2, 1, 4));\n```\n\n* 对于成对出现的 `x`/`y` 字段有方便的 setter：\n\
  \n```\nadd(component, new GBC(1, 2).setWeight(100, 100));\n```\n\n* setter 方法返回\
  \ `this`，因此你可以进行链式调用：\n\n```\nadd(component, new GBC(1, 2).setAnchor(GBC.EAST).setWeight(100,\
  \ 100));\n```\n\n* `setInsets` 方法会为你构造 `Insets` 对象。要获得 1 像素的边距，只需调用：\n\n```\nadd(component,\
  \ new GBC(1, 2).setAnchor(GBC.EAST).setInsets(1));\n```\n\n[Listing 11.7] 显示了字体对话框示例的帧类。`GBC`\
  \ 辅助类位于 [Listing 11.8]。以下是将组件添加到 grid bag 的代码：\n\n```\nadd(faceLabel, new GBC(0,\
  \ 0).setAnchor(GBC.EAST));\nadd(face, new GBC(1, 0).setFill(GBC.HORIZONTAL).setWeight(100,\
  \ 0).setInsets(1));\nadd(sizeLabel, new GBC(0, 1).setAnchor(GBC.EAST));\nadd(size,\
  \ new GBC(1, 1).setFill(GBC.HORIZONTAL).setWeight(100, 0).setInsets(1));\nadd(bold,\
  \ new GBC(0, 2, 2, 1).setAnchor(GBC.CENTER).setWeight(100, 100));\nadd(italic, new\
  \ GBC(0, 3, 2, 1).setAnchor(GBC.CENTER).setWeight(100, 100));\nadd(sample, new GBC(2,\
  \ 0, 1, 4).setFill(GBC.BOTH).setWeight(100, 100));\n```\n\n一旦你理解了 grid bag 约束，这类代码就很容易阅读和调试。\n\
  \nListing 11.7 gridbag/FontFrame.java\n\n\n\n\n\n```java\npackage gridbag;\n\nimport\
  \ java.awt.Font;\nimport java.awt.GridBagLayout;\nimport java.awt.event.ActionListener;\n\
  \nimport javax.swing.BorderFactory;\nimport javax.swing.JCheckBox;\nimport javax.swing.JComboBox;\n\
  import javax.swing.JFrame;\nimport javax.swing.JLabel;\nimport javax.swing.JTextArea;\n\
  \n/**\n * 一个使用 grid bag 布局来排列字体选择组件的框架。\n */\npublic class FontFrame extends JFrame\n\
  {\n   private static final int TEXT_ROWS = 10;\n   private static final int TEXT_COLUMNS\
  \ = 20;\n\n   private JComboBox<String> face;\n   private JComboBox<Integer> size;\n\
  \   private JCheckBox bold;\n   private JCheckBox italic;\n   private JTextArea\
  \ sample;\n\n   public FontFrame()\n   {\n      var layout = new GridBagLayout();\n\
  \      setLayout(layout);\n\n      ActionListener listener = event -> updateSample();\n\
  \n      // 构建组件\n\n      var faceLabel = new JLabel(\"字体: \");\n\n      face = new\
  \ JComboBox<>(new String[] { \"Serif\", \"SansSerif\", \"Monospaced\",\n       \
  \  \"Dialog\", \"DialogInput\" });\n\n      face.addActionListener(listener);\n\n\
  \      var sizeLabel = new JLabel(\"大小: \");\n\n      size = new JComboBox<>(new\
  \ Integer[] { 8, 10, 12, 15, 18, 24, 36, 48 });\n\n      size.addActionListener(listener);\n\
  \n      bold = new JCheckBox(\"粗体\");\n      bold.addActionListener(listener);\n\
  \n      italic = new JCheckBox(\"斜体\");\n      italic.addActionListener(listener);\n\
  \n      sample = new JTextArea(TEXT_ROWS, TEXT_COLUMNS);\n      sample.setText(\"\
  The quick brown fox jumps over the lazy dog\");\n      sample.setEditable(false);\n\
  \      sample.setLineWrap(true);\n      sample.setBorder(BorderFactory.createEtchedBorder());\n\
  \n      // 使用 GBC 便利类将组件添加到网格中\n\n      add(faceLabel, new GBC(0, 0).setAnchor(GBC.EAST));\n\
  \      add(face, new GBC(1, 0).setFill(GBC.HORIZONTAL).setWeight(100, 0).setInsets(1));\n\
  \      add(sizeLabel, new GBC(0, 1).setAnchor(GBC.EAST));\n      add(size, new GBC(1,\
  \ 1).setFill(GBC.HORIZONTAL).setWeight(100, 0).setInsets(1));\n      add(bold, new\
  \ GBC(0, 2, 2, 1).setAnchor(GBC.CENTER).setWeight(100, 100));\n      add(italic,\
  \ new GBC(0, 3, 2, 1).setAnchor(GBC.CENTER).setWeight(100, 100));\n      add(sample,\
  \ new GBC(2, 0, 1, 4).setFill(GBC.BOTH).setWeight(100, 100));\n      pack();\n \
  \     updateSample();\n   }\n\n   public void updateSample()\n   {\n      var fontFace\
  \ = (String) face.getSelectedItem();\n      int fontStyle = (bold.isSelected() ?\
  \ Font.BOLD : 0)\n         + (italic.isSelected() ? Font.ITALIC : 0);\n      int\
  \ fontSize = size.getItemAt(size.getSelectedIndex());\n      var font = new Font(fontFace,\
  \ fontStyle, fontSize);\n      sample.setFont(font);\n      sample.repaint();\n\
  \   }\n}\n```\n\n列表 11.8 `gridbag/GBC.java`\n\n```java\npackage gridbag;\n\nimport\
  \ java.awt.*;\n\n/**\n * 此类简化了 GridBagConstraints 类的使用。\n * @version 1.01 2004-05-06\n\
  \ * @author Cay Horstmann\n */\npublic class GBC extends GridBagConstraints\n{\n\
  \   /**\n    * 构建一个给定 gridx 和 gridy 位置的 GBC，并将所有其他 grid\n    * bag 约束值设置为默认值。\n\
  \    * @param gridx gridx 位置\n    * @param gridy the gridy 位置\n    */\n   public\
  \ GBC(int gridx, int gridy)\n   {\n      this.gridx = gridx;\n      this.gridy =\
  \ gridy;\n   }\n\n   /**\n    * 构建一个具有给定 gridx, gridy, gridwidth, gridheight 的 GBC，并将所有\n\
  \    * 其他 grid bag 约束值设置为默认值。\n    * @param gridx gridx 位置\n    * @param gridy gridy\
  \ 位置\n    * @param gridwidth x 方向的单元格跨度\n    * @param gridheight y 方向的单元格跨度\n  \
  \  */\n   public GBC(int gridx, int gridy, int gridwidth, int gridheight)\n   {\n\
  \      this.gridx = gridx;\n      this.gridy = gridy;\n      this.gridwidth = gridwidth;\n\
  \      this.gridheight = gridheight;\n   }\n\n   /**\n    * 设置锚点。\n    * @param\
  \ anchor 锚点值\n    * @return 此对象以便进行进一步修改\n    */\n   public GBC setAnchor(int anchor)\n\
  \   {\n      this.anchor = anchor;\n      return this;\n   }\n\n   /**\n    * 设置填充方向。\n\
  \    * @param fill 填充方向\n    * @return 此对象以便进行进一步修改\n    */\n   public GBC setFill(int\
  \ fill)\n   {\n      this.fill = fill;\n      return this;\n   }\n\n   /**\n   \
  \ * 设置权重。\n    * @param weightx x 方向的单元格权重\n    * @param weighty y 方向的单元格权重\n  \
  \  * @return 此对象以便进行进一步修改\n    */\n   public GBC setWeight(double weightx, double\
  \ weighty)\n   {\n      this.weightx = weightx;\n      this.weighty = weighty;\n\
  \      return this;\n   }\n\n   /**\n    * 设置此单元格的内边距。\n    * @param distance 到所有方向的距离\n\
  \    * @return this\n    */\n   public GBC setInsets(int distance)\n   {\n     \
  \ this.insets = new Insets(distance, distance, distance);\n      return this;\n\
  \   }\n\n   /**\n    * 设置此单元格的内边距。\n    * @param top 向上的间距\n    * @param left 向左间距\n\
  \    * @param bottom 向下的间距\n    * @param right 向右间距\n    * @return 此对象以便进行进一步修改\n\
  \    */\n   public GBC setInsets(int top, int left, int bottom, int right)\n   {\n\
  \      this.insets = new Insets(top, left, bottom, right);\n      return this;\n\
  \   }\n\n   /**\n    * 设置内边距。\n    * @param ipadx x 方向的内部间距\n    * @param ipady\
  \ y 方向的内部间距\n    * @return this\n    */\n   public GBC setIpad(int ipadx, int ipady)\n\
  \   {\n      this.ipadx = ipadx;\n      this.ipady = ipady;\n      return this;\n\
  \   }\n}\n```\n\n`java.awt.GridBagConstraints` 1.0\n\n*   `gridx`, `gridy`:单元格的起始列和行。默认为\
  \ 0。\n*   `gridwidth`, `gridheight`:单元格跨越的列行。默认为 1。\n*   `weightx`, `weighty`:单元格增长的权重。默认为\
  \ 0。\n*   `anchor`: 组件在单元格内的对齐方式。你可以选择绝对位置：\n    *   `NORTHWEST`, `NORTH`, `NORTAST`\n\
  \    *   `WEST`, `CENTER`, `EAST`\n    *   `SOUTHWEST`, `SOUTH`, `SOUTAST`\n   \
  \ 或者与方向无关的：\n    *   `FIRST_LINE_START`, `LINE_START`, `FIRST_LINE_END`\n    * \
  \  `PAGE_START`, `CENTER`, `PAGE_END`\n    *   `LAST_LINE_START`, `LINE_END`, `LAST_LINE_END`\n\
  \    如果你的应用可能从右到左或从上到下的文本，请使用后者。默认为 `CENTER`。\n*   `fill`:组件在单元格内的填充行为：`NONE`、`BOTH`、`HORIZONTAL`\
  \ 或 `VERTICAL`。默认为 `NONE`。\n*   `ipadx`, `ipady`:组件周围的内部间距。默认为 0。\n*   `insets`:单元格边界的外部间距。默认没有。\n\
  \n11.7. 自定义布局管理器\n\n你可以设计自己的 `LayoutManager` 类来以特殊方式管理组件。作为一个有趣的例子，让我们把容器中的所有组件排列成一个圆（参见图\
  \ 11.29）。\n\n![Figure](img/circlelayouttest.jpg)图 11.29: 圆形布局\n\n你自定义的布局管理器必须实现\
  \ `LayoutManager` 接口。你需要重写以下五个方法：\n\n```java\nvoid addLayoutComponent(String s,\
  \ Component c)\nvoid removeLayoutComponent(Component c)\nDimension preferredLayoutSize(Container\
  \ parent)\nDimension minimumLayoutSize(Container parent)\nvoid layoutContainer(Container\
  \ parent)\n```\n\n\n\n\n前两个方法在组件被添加或移除时被调用。如果你不需要保留关于组件的任何额外信息，可以让它们什么都不做。接下来的两个方法计算组件的最小布局和首选布局所需的空间。这些通常是相同的数值。第五个方法执行实际工作，并对所有组件调用\
  \ `setBounds`。\n\nAWT 还有第二个接口，称为 `LayoutManager2`，它需要实现十个方法而不是五个。`LayoutManager2`\
  \ 接口的主要点在于允许你使用带约束的 `add` 方法。例如，`BorderLayout` 和 `GridBagLayout` 都实现了 `LayoutManager2`\
  \ 接口。\n\nListing 11.9 显示了 `CircleLayout` 管理器的代码，遗憾的是，它将组件沿着父容器内部的圆周进行布局。示例程序的框架类位于\
  \ Listing 11.10 中。\n\nListing 11.9 `circleLayout/CircleLayout.java`\n\n```\npackage\
  \ circleLayout;\n\nimport java.awt.*;\n\n/**\n * 一个沿圆周布布局组件的布局管理器。\n */\npublic\
  \ class CircleLayout implements LayoutManager\n{\n   private int minWidth = 0;\n\
  \   private int minHeight = 0;\n   private int preferredWidth = 0;\n   private int\
  \ preferredHeight = 0;\n   private boolean sizesSet = false;\n   private int maxComponentWidth\
  \ = 0;\n   private int maxComponentHeight = 0;\n\n   public void addLayoutComponent(String\
  \ name, Component comp)\n   {\n   }\n\n   public void removeLayoutComponent(Component\
  \ comp)\n   {\n   }\n\n   public void setSizes(Container parent)\n   {\n      if\
  \ (sizesSet) return;\n      int n = parent.getComponentCount();\n\n      preferredWidth\
  \ = 0;\n      preferredHeight = 0;\n      minWidth = 0;\n      minHeight = 0;\n\
  \      maxComponentWidth = 0;\n      maxComponentHeight = 0;\n\n      // 计算组件的最大宽度和高度\n\
  \      //并将首选尺寸设置为所有组件尺寸之和\n      for (int i = 0; i < n; i++)\n      {\n       \
  \  Component c = parent.getComponent(i);\n         if (c.isVisible())\n        \
  \ {\n            Dimension d = c.getPreferredSize();\n            maxComponentWidth\
  \ = Math.max(maxComponentWidth, d.width);\n            maxComponentHeight = Math.max(maxComponentHeight,\
  \ d.height);\n            preferredWidth += d.width;\n            preferredHeight\
  \ += d.height;\n         }\n      }\n      minWidth = preferredWidth / 2;\n    \
  \  minHeight = preferredHeight / 2;\n      sizesSet = true;\n   }\n\n   public Dimension\
  \ preferredLayoutSize(Container parent)\n   {\n      setSizes(parent);\n      Insets\
  \ insets = parent.getInsets();\n      int width = preferredWidth + insets.left +\
  \ insets.right;\n      int height = preferredHeight + insets.top + insets.bottom;\n\
  \      return new Dimension(width, height);\n   }\n\n   public Dimension minimumLayoutSize(Container\
  \ parent)\n   {\n      setSizes(parent);\n      Insets insets = parent.getInsets();\n\
  \      int width = minWidth + insets.left + insets.right;\n      int height = minHeight\
  \ + insets.top + insets.bottom;\n      return new Dimension(width, height);\n  \
  \ }\n\n   public void layoutContainer(Container parent)\n   {\n      setSizes(parent);\n\
  \n      // 计算圆的中心\n\n      Insets insets = parent.getInsets();\n      int containerWidth\
  \ = parent.getSize().width - insets.left - insets.right;\n      int containerHeight\
  \ = parent.getSize().height - insets.top - insets.bottom;\n\n      int xcenter =\
  \ insets.left + containerWidth / 2;\n      int ycenter = insets.top + containerHeight\
  \ / 2;\n\n      // 计算圆的半径\n\n      int xradius = (containerWidth - maxComponentWidth)\
  \ / 2;\n      int yradius = (containerHeight - maxComponentHeight) / 2;\n      int\
  \ radius = Math.min(xradius, yradius);\n\n      // 沿圆周布局组件\n\n      int n = parent.getComponentCount();\n\
  \      for (int i = 0; i < n; i++)\n      {\n         Component c = parent.getComponent(i);\n\
  \         if (c.isVisible())\n         {\n            double angle = 2 * Math.PI\
  \ * i / n;\n\n            // 组件中心点\n            int x = xcenter + (int) (Math.cos(angle)\
  \ * radius);\n            int y = ycenter + (int) (Math.sin(angle) * radius);\n\n\
  \            // 移动组件使其中心位于 (x, y)\n            // 且尺寸为首选尺寸\n            Dimension\
  \ d = c.getPreferredSize();\n            c.setBounds(x - d.width / 2, y - d.height\
  \ / 2, d.width, d.height);\n         }\n      }\n   }\n}\n```\n\nListing 11.10 `circleLayout/CircleLayoutFrame.java`\n\
  \n``` evenpackage circleLayout;\n\nimport javax.swing.*;\n\n/**\n * 显示沿圆周排列的按钮的框架。\n\
  \ */\npublic class CircleLayoutFrame extends JFrame\n{\n   public CircleLayoutFrame()\n\
  \   {\n      setLayout(new CircleLayout());\n      add(new JButton(\"0\"));\n  \
  \    add(new JButton(\"1\"));\n      add(new JButton(\"2\"));\n      add(new JButton(\"\
  3\"));\n      add(new JButton(\"4\"));\n      add(new JButton(\"5\"));\n      add(new\
  \ JButton(\"6\"));\n      add(new JButton(\"7\"));\n      add(new JButton(\"8\"\
  ));\n      add(new JButton(\"9\"));\n      pack();\n      setVisible(true);\n  \
  \ }\n}\n```\n\n`java.awt.LayoutManager` 1.0\n\n*   `addLayoutComponent(String name,\
  \ Component comp)` 将组件添加到布局中。\n*   `removeLayoutComponent(Component comp)` 从布局中移除组件。\n\
  *   `preferredLayoutSize(Container parent)` 返回容器的首选尺寸。\n*   `minimumLayoutSize(Container\
  \ parent)` 返回布局的最小尺寸。\n*   `layoutContainer(Container parent)` 对容器容器中的组件进行布局。\n\n\
  ## 11.8 对话框\n\n在 GUI 应用中，你通常希望有独立的对话框弹出，以向用户提供信息或从用户处获取信息。\n\n与大多数窗口系统一样，AWT 将对话框区分为*模态（modal）*和*非模态（modeless）*。模态对话框在用户处理它之前不允许用户与应用程序的其余窗口交互。当你需要用户信息才能继续时，请使用模态对话框。例如，当用户想要读取文件时，弹出模态对话框。用户必须指定文件名程序才能开始。\n\
  \n非模态对话框允许用户在对话框和应用程序中同时输入信息。非模态对话框的一个例子是工具栏。工具栏可以一直存在，用户可以与应用程序进行交互。\n\n让我们从简单的模态对话框开始本节。Swing\
  \ 有一个方便的 `JOptionPane` 类，可以在编写任何特殊代码的情况下的情况下简单对话框。接下来你将看到如何通过实现自己的对话窗口来编写更复杂的对话框。最后，你将看到如何将数据从应用程序传输到对话框。\n\
  \n我们将通过查看 Swing `JFileChooser` 来结束对对话框的讨论。\n\n### 11.8.1 面板\n\nSwing 提供了一系列现成的简单对话框，足以询问用户单个信息。`JOptionPane`\
  \ 有四个静态方法来显示这些简单对话框：\n\n*   `showMessageDialog`: 显示消息并等待用户点击 OK\n*   `showConfirmDialog`:\
  \ 显示消息并获取确认（如 OK/取消）\n*   `showOptionDialog`: 显示消息并获取用户选项（通常来自一组按钮）\n*   `showInputDialog`:\
  \ 显示消息并获取用户输入（通常来自输入字段或组合框）\n\nFigure 11.30 显示了一个典型的对话框。正如你所见，对话框包含以下组件：\n\n*  \
  \ 一个图标\n\n*   消息\n\n*   一个或多个选项按钮\n\n![Figure](img/option.jpg)图 11.30: 一个 `JOptionPane`\n\
  \n\n\n\n输入对话框包含一个额外的组件用于用户输入。这可以是一个用户可以在其中输入任意字符串的文本字段，也可以是一个用户可以从中选择一个项目的组合框。\n\
  \n这些对话框的确切布局以及标准消息类型的图标选择取决于可插的外观（look-and-feel）。\n\n左侧的图标取决于五种 `message types`（消息类型）之一：\n\
  \n```\nERROR_MESSAGE\nINFORMATION_MESSAGE\nWARNING_MESSAGE\nQUESTION_MESSAGE\nPLAIN_MESSAGE\n\
  ```\n\n`PLAIN_MESSAGE` 类型没有图标。每种对话框类型都有一个方法允许你提供自己的图标代替。\n\n对于每种对话框类型，你都可以指定一个消息。此消息可以是字符串、图标、用户界面组件或其他任何对象。以下是消息对象的显示方式：\n\
  \n| 类型 | 描述 |\n| :--- | :--- |\n| `String` | 绘制字符串 |\n| `Icon` | 显示图标 |\n| `Component`\
  \ | 显示组件 |\n| `Object[]` | 显示数组中的所有对象，并将它们堆叠在一起 |\n| 任何其他对象 | 应用 `toString` 并显示生成的字符串\
  \ |\n\n当然，提供消息字符串是最常见的情况。提供 `Component` 给了你最大的灵活性，因为你可以让 `paintComponent` 方法绘制你想要的任何内容。\n\
  \n底部的按钮取决于对话框类型和 `option type`（选项类型）。调用 `showMessageDialog` 和 `showInputDialog`\
  \ 时，你只会获得一组标准的按钮（分别为 OK 和 OK/Cancel）。当调用 `showConfirmDialog` 时，你可以在四种选项类型中选择：\n\n\
  ```\nDEFAULT_OPTION\nYES_NO_OPTION\nYES_NO_CANCEL_OPTION\nOK_CANCEL_OPTION\n```\n\
  \n使用 `showOptionDialog` 你可以指定一组任意选项。你提供一个对象数组作为选项。每个数组元素的渲染方式如下：\n\n| 类型 | 描述 |\n\
  | :--- | :--- |\n| `String` | 以字符串为标签创建一个按钮 |\n| `Icon` | 以图标为标签创建一个按钮 |\n| `Component`\
  \ | 显示组件 |\n| 任何其他对象 | 应用 `toString` 并以生成的字符串为标签创建一个按钮 |\n\n这些函数的返回值如下：\n\n| 方法\
  \ | 返回值 |\n| :--- | :--- |\n| `showMessageDialog` | 无 |\n| `showConfirmDialog` |\
  \ 表示所选选项的整数 |\n| `showOptionDialog` | 表示所选选项的整数 |\n| `showInputDialog` | 用户提供的或选择的字符串\
  \ |\n\n`showConfirmDialog` 和 `showOptionDialog` 返回整数以指示用户选择了哪个按钮。对于选项对话框，这仅仅是所选选项的索引，如果用户关闭了对话框而不是选择选项，则返回\
  \ `CLOSED_OPTION`。对于确认对话框，返回值可以是以下内容之一：\n\n```\nOK_OPTION\nCANCEL_OPTION\nYES_OPTION\n\
  NO_OPTION\nCLOSED_OPTION\n```\n\n这这一切听起来像是一组令人困惑的选择，但在实践中非常简单。遵循以下步骤操作：\n\n1. 选择对话框类型（消息、确认、选项或输入）。\n\
  2. 选择图标（错误、信息、警告、问题、无或自定义）。\n3. 选择消息（字符串、图标、自定义组件或它们的堆栈）。\n4. 对于确认对话框，选择选项类型（默认、是/否、是/否/取消或\
  \ OK/取消）。\n5. 对于选项对话框，选择选项（字符串、图标或自定义组件）和默认选项。\n6. 对于输入对话框，在文本字段和组合框之间选择一个。\n7.\
  \ 在 `JOptionPane` API 中找到要调用的相应方法。\n\n例如，假设你想在图 11.30 中显示对话框。对话框显示一条消息并请求用户确认或取消。因此，这是一个确认对话框。图标是一个问题图标。消息是一个字符串。选项类型是\
  \ `OK_CANCEL_OPTION`。以下是你将进行的调用：\n\n```java\nint selection = JOptionPane.showConfirmDialog(parent,\n\
  \   \"Message\", \"Title\",\n   JOptionPane.OK_CANCEL_OPTION,\n   JOptionPane.QUESTION_MESSAGE);\n\
  if (selection == JOptionPane.OK_OPTION) . . .\n```\n\n消息字符串可以包含换行符（`'\\n'`）。此类字符串将以多行形式显示。\n\
