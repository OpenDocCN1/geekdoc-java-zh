  \        for (int i = 0; i < options.size(); i++)\n            System.out.printf(\"\
  %2d\", i);\n      }\n   }\n\n   /**\n    * 从数据库获取连接。\n    * @return 数据库连接\n    */\n\
  \   public static Connection getConnection() throws SQLException\n   {\n      //\
