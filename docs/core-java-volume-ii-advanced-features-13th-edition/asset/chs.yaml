  \ jclass cl1, jclass cl2)`\n  如果第一个类的对象可以赋值给第二个类的对象，则返回 `JNI_TRUE`，否则返回 `JNI_FALSE`。此函数用于测试类是否相同、`cl1`\
  \ 是否为 `cl2` 的子类，或者 `cl2` 是否是 `cl1` 或其任一父类实现的接口。\n\n- `jclass GetSuperclass(JNIEnv\
  \ *env, jclass cl)`\n  返回类的父类。如果 `cl` 代表 `Object` 类或接口，则返回 `NULL`。\n\n## 13.11 外部函数：展望未来\n\
  \n当使用 JNI 时，你必须编写 C 代码来访问 Java 数据结构、调用所需的 C 函数并将结果转换回 Java。然后，你还必须将 C 代码链接到特定平台的库中。由代号为“Project\
  \ Panama”开发的访问“外部”函数和内存的 API 允许你用 Java 编写这些代码。\n\n在 Java 21 中，该 API 是一个预览功能（preview\
  \ feature），细节在最终发布之前可能会发生变化。Listing 13.24 中的程序是该预览 API 的一个简单演示。\n\n该程序仅调用了 `printf`\
  \ 函数。不需要额外的 C 代码。该函数是通过 Java `MethodHandle` 调用的，而句柄通常用于调用 Java 函数。\n\n要访问 C 函数，你首先创建一个\
  \ `Linker` 对象。给定 C 函数的地址和类型描述，`Linker` 可以为该函数生成 Java 方法句柄（method handle）。\n\n该 API\
  \ 提供了将 Java 对象转换为内存块的方法，你可以将这些块传递给 C 函数。在演示中，你需要提供一个带有 Java `String` 字符的 `char*`。\n\
  \n内存是在 `Arena` 中分配的，以便管理其释放。在这里，我们使用了一个受限（confined） arena。它是自动关闭的（autocloseable），`close`\
  \ 方法会释放所有分配的内存。\n\n如你所示，此 API 比 JNI 要简单且方便得多。这个演示仅是该 API 的冰山。有许多方法用于读取、写入和管理内存块。你还可以将\
  \ Java 函数作为回调传递给 C 函数。\n\n编译演示程序，请使用以下选项：\n\n```bash\njavac --enable-preview --source\
  \ 21 panama/PanamaDemo.java\n```\n\n外部函数和内存 API 本质上是不安全的，因为它提供了对未托管内存的访问。你使用运行时标志来允许模块使用该\
  \ API。通常，人们会将 Java API 和 C 库之间的桥接代码放在单独的模块中。但在演示中，原生访问发生在未命名模块中。运行该程序的命令如下：\n\n\
  ```bash\njava --enable-preview --enable-native-access=ALL-UNNAMED panama.PanamaDemo\n\
  ```\n\n作为一个更真实的例子，配套代码包含另一个演示程序，它调用了一个实现 Argon 2 密码哈希算法的外部库，该算法目前并非 JDK 的。\n\n目前，你仍然需要使用\
  \ JNI 作为与原生代码交互的稳定 API。随着外部函数和内存 API 的成熟，它将成为 JNI 的优替代方案。\n\nListing 13.24 `panama/PanamaDemo.java`\n\
  \n```java\npackage panama;\n\nimport java.lang.invoke.*;\nimport java.lang.foreign.*;\n\
  \n/*\n\njavac --enable-preview --source 21 panama/PanamaDemo.java \n\njava --enable-preview\
  \ --enable-native-access=ALL-UNNAMED panama.PanamaDemo\n\n*/\n\npublic class PanamaDemo\n\
  {\n   public static void main(String[] args) throws Throwable\n   {\n      Linker\
  \ linker = Linker.nativeLinker();\n      MethodHandle printf = linker.downcallHandle(\n\
  \         linker.defaultLookup().find(\"printf\").get(),\n         FunctionDescriptor.of(ValueLayout.JAVA_INT,\
  \ ValueLayout.ADDRESS));\n\n      try (Arena arena = Arena.ofConfined())\n     \
  \ {\n         MemorySegment str = arena.allocateUtf8String(\"Hello, World!\\n\"\
  );\n         int result = (int) printf.invoke(str);\n         System.out.printf(\"\
  Printed %d characters.%n\", result);\n      }\n   }\n}\n```\n\n你现在已经到达了《Core Java》第二卷的末尾，完成了一段接触了许多高级\
  \ API 的漫长旅程。我从每个 Java 程序员都需要了解的主题开始：流、XML、网络、数据库和国际化。我最后以安全、注解处理、高级图形和原生方法等技术性很强的章节结束。我希望你喜欢这次探索\
  \ Java 广阔 API 的之旅，并将你新学的知识应用到你的项目中。\n\n# 索引\n\n\n\n\n和\n"
