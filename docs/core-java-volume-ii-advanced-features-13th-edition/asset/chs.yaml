- "# Core Java 卷二：高级特性，第 13 版\n\n\n\n![](img/cover.jpg)\n\n![封面](img/cover.jpg)\n\n\
  ![.jpg](img/cover.jpg)\n\n# 关于本电子书\n\nePUB 是一种开放的行业标准电子书格式。然而，阅读设备和应用程序对 ePUB 及其许多功能的支持各相同。请使用您的设备或应用设置根据您的喜好自定义显示效果。您可以自定义的设置通常包括字体、字号、单栏或双栏布局、横屏或竖屏模式，以及可以点击或触摸放大的图片。有关您的阅读设备或应用上设置和功能的更多信息，请访问设备制造商的网站。\n\
  \n许多书籍包含编程代码或配置示例。为了优化这些元素的显示效果，请在单栏横屏模式下查看电子书，并将字体大小调整为最小设置。\n\n\n\n\n\n![.jpg](img/pub.jpg)\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 前言\n\n## 致读者\n\n你手中的书是《核心\
  \ Java》第十三版，已针对 Java 21 完全更新。第一卷涵盖了语言的核心特性；本卷涉及专业开发所需的高级主题。因此，与第一卷及之前的版本一样，我们仍然针对希望将\
  \ Java 技术应用于实际项目的程序员。\n\n随着 Java 类库的爆炸式增长，在一卷书中介绍专业程序员需要的所有功能是不可能的。因此，本书分为两卷。\n\n\
  第一卷集中于 Java 语言的基础概念：（此处省略列表）。\n\n本卷深入探讨了最重要的库。在过去的十二版中，用户界面编程被认为是基础性的，但现在必须承认它不再如此，并将其移动到第二卷。本卷对以下主题进行了详细讨论：（此处省略列表）。\n\
  \n正如任何书籍一样，错误和不准确之处是不可避免的。如果你在书中发现任何问题，我们非常希望收到反馈。当然，我们希望只听到一次。因此，我们在 [`https://horstmann.com/corejava](https://horstmann.com/corejava)`\
  \ 建立了一个网站，包含常见问题解答（FAQ）、错误修复和解决方案。在错误报告网页的策略位置（以鼓励你阅读之前的报告）有一个表单，你可以用它报告错误或问题，并为未来的版本提供改进建议。\n\
  \n## 本书简介\n\n书中的章节大部分是相互独立的。你可以深入研究你最感兴趣的主题，并按照任何顺序阅读章节。\n\n\n\n\n在 `Chapter 1`\
  \ 中，你将学习关于 Java 流库的所有知识。该库为数据处理带来了现代化的风格，你只需要指定你想要，而无需详细描述如何获取结果。这使得流库能够专注于最优的评估策略，这对于在多核心上并行执行计算特别有优势。\n\
  \n`Chapter 2` 的主题是输入/输出处理（I/O）。在 Java 中，所有的输入和输出都通过输入/输出流处理。这些流（不要与 `Chapter 1`\
  \ 中的流混淆）让你能够以统一的方式处理各种数据源之间的通信，例如文件、网络连接或内存块。我们详细涵盖了 `reader` 和 `writer` 类，这些类使得处理\
  \ Unicode 变得简单。我们将向你展示在字对象序列化机制时，底层到底发生了什么，这使得保存和加载对象变得简单方便。然后，我们将进入正则表达式以及文件和路径的操作。在本章中，你将发现最近\
  \ Java 版本中深受欢迎的增强。\n\n`Chapter 3` 涵盖 XML。我们将向你展示如何解析 XML 文件、如何生成 XML 以及如何使用 XSL\
  \ 转换。作为一个实用的例子，我们向你展示如何在 XML 中指定 Swing 表单的布局。我们还讨论了 XPath API，它让在 XML 草海中捞针变得容易得多。\n\
  \n`Chapter 4` 涵盖了网络 API。Java 让进行复杂的网络编程变得异常简单。我们将向你展示如何与服务器建立网络连接、如何实现你自己的服务器以及如何建立\
  \ HTTP 连接。本章涵盖了新的 HTTP 客户端。\n\n`Chapter 5` 涵盖了数据库编程。重点是 `JDBC`，即 Java 数据库连接 API，允许\
  \ Java 程序连接到关系型数据库。我们将向你展示如何使用 JDBC API 的核心子集编写实用的程序来处理现实中的数据库任务。（对 JDBC API 的完整介绍需要一本几乎和这本书一样大的书。）\n\
  \nJava 在处理日期和时间的库方面曾有过两次尝试。第三次尝试是 Java 8 中的引入亮点。在 `Chapter 6` 中，你将学习如何使用新的日期和时间库来处理日历和时区的复杂性。\n\
  \n`Chapter 7` 讨论了一个我们认为其重要性只会增加的特性：国际化。Java 编程语言是少数从之初就被设计为处理 Unicode 的语言之一，但 Java\
  \ 平台上的国际化支持要深入得多。因此，你可以让 Java 应用程序实现国际化，使其不仅跨越平台，还能跨越国界。例如，我们向你展示如何编写一个可以使用英语、德语或中文的退休计算器。\n\
  \n`Chapter 8` 讨论了脚本和编译器 API，这些 API 允许你的程序调用 JavaScript 或 Groovy 等脚本语言的代码，并编译 Java\
  \ 代码。\n\n`Chapter 9` 探讨了 Java 安全模型、用户身份验证以及 Java 安全库中的加密函数。你将学习一些重要特性，如消息和代码签名、授权与身份验证以及加密。我们以使用\
  \ `AES` 和 `RSA` 加密算法的示例作为结束。\n\n`Chapter 10` 提供了 GUI 编程的介绍。我将展示你如何创建窗口、如何在窗口上画画、如何用几何形状绘图、如何使用多种字体格式化文本以及如何显示图像。接下来，你将看到如何编写响应事件（如鼠标点击或按键按下）的代码。\n\
  \n`Chapter 11` 详细讨论了 Swing GUI 工具包。Swing 工具包允许你构建跨平台的图形用户界面。你将学习关于各种类型的按钮、文本组件、边框、滑动块、列表框、菜单和对话框的所有知识。\n\
  \n`Chapter 12` 包含了高级 Swing 资料，特别是重要但复杂的树和表格组件。我们还涵盖了 Java 2D API，你可以用它来创建逼真的绘画和特殊特效。当然，现在没有多少程序员需要编写\
  \ Swing 用户界面了，因此我们特别关注对在服务器上生成的图像有用的特性。\n\n`Chapter 13` 探讨了原生方法（native methods），它允许你调用为特定机器编写的方法，例如\
  \ Microsoft Windows API。显然，这个特性是有争议的：使用原生方法，Java 的跨平台特性就会消失。尽管如此，每个为特定平台编写 Java\
  \ 应用程序的严谨程序员都需要了解这些技术。当你与 Java 不支持的设备或服务交互时，有时需要转向目标平台操作系统的 API。我们通过向你展示如何从 Java\
  \ 程序中访问 Windows 注册表 API 来说明这一点。本章以对“Panama” API 的展望结束，它 将在未来的 Java 版本中取代当前的 API。\n\
  \n一如既往，所有章节都已针对最新版本的 Java 进行了完全修订。过时的材料已被删除，并详细涵盖了直到 Java 21 的新 API。\n\n## 约定\n\n\
