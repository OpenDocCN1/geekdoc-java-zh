  ```\n\n### 12.3.3. 编辑单元格\n\n要启用单元格编辑，表格模型必须通过定义 `isCellEditable` 方法指示哪些单元格是可编辑的。通常，你会希望某些列是可编辑。在示例程序中，我们允许对四列进行编辑。\n\
  \n```java\npublic boolean isCellEditable(int r, int c)\n{\n   return c == PLANET_COLUMN\
  \ || c == MOONS_COLUMN || c == GASEOUS_COLUMN \n      || c == COLOR_COLUMN;\n}\n\
  ```\n\n`AbstractTableModel` 定义的 `isCellEditable` 方法始终返回 `false`。`DefaultTableModel`\
  \ 重写了该方法始终返回 `true`。\n\n如果你运行本节末尾的示例程序，注意你可以点击 `Gaseous`（气体）列中的复选框并开启或关闭标记。如果你点击\
  \ `Moons`（卫星）列中的单元格，会出现一个组合框（参见图 12.9）。稍后你将看到如何安装此类组合框作为单元格编辑器。\n\n![Figure](img/fig06-13.jpg)图\
  \ 12.9: 单元格编辑器\n\n最后，点击第一列中的单元格。该单元格获得焦点。你可以开始输入，单元格内容会随之改变。\n\n你刚刚看到的是 `DefaultCellEditor`\
  \ 类的三种变体。`DefaultCellEditor` 可以使用 `JTextField`、`JCheckBox` 或 `JComboBox` 来构造。`JTable`\
  \ 类会自动为 `Boolean` 单元格安装复选框编辑器，并为所有未提供自定义渲染器的可编辑单元格安装文本字段编辑器。文本字段允许用户编辑通过对表格模型 `getValueAt`\
  \ 方法的返回值应用 `toString` 得到的字符串。\n\n当编辑完成时，通过调用你编辑器的 `getCellEditorValue` 方法来获取编辑后的值。该方法应该返回正确类型的值（即由模型的\
  \ `getColumnType` 方法返回的类型）。\n\n要获取组合框编辑器，需要手动设置单元格编辑器——`JTable` 组件并不知道特定类型可能适用于哪些值。对于\
  \ `Moons` 列，我们希望允许用户选择 0 到 20 之间的任何值。以下是初始化组合框的代码：\n\n```java\nvar moonCombo = new\
  \ JComboBox();\nfor (int i = 0; i <= 20; i++)\n   moonCombo.addItem(i);\n```\n\n\
  要构造 `DefaultCellEditor`，在构造函数中提供组合框：\n\n```java\nvar moonEditor = new DefaultCellEditor(moonCombo);\n\
  ```\n\n接下来，我们需要安装编辑器。与颜色单元格渲染器不同，此编辑器依赖于对象 `type`——我们并不一定想用于所有 `Integer` 类型的对象。相反，我们需要将其安装到特定的列：\n\
  \n```java\nmoonColumn.setCellEditor(moonEditor);\n```\n\n### 12.3.4. 自定义编辑器\n\n\
  再次运行示例程序并点击颜色。弹出一个颜色选择器，允许你为行星选择新颜色。选择一种颜色并点击 OK。单元格颜色将得到更新（参见图 12.10）。\n\n![Figure](img/fig06-14.jpg)图\
  \ 12.10: 使用颜色选择器编辑单元格颜色\n\n颜色单元格编辑器不是标准的表格单元格编辑器，而是自定义实现。要创建自定义单元格编辑器，需要实现 `TableCellEditor`\
  \ 接口。该接口有点麻烦，因此提供了 `AbstractCellEditor` 类来处理事件处理细节。\n\n`TableCellEditor` 接口的 `getTableCellEditorComponent`\
  \ 方法请求一个渲染单元格的组件。它与 `TableCellRenderer` 接口的 `getTableCellRendererComponent` 方法完全相同，只是没有\
  \ `focus` 参数。当正在编辑单元格时，假设它拥有焦点。在编辑期间，编辑器组件会临时替换渲染器。在我们的示例中，我们返回一个没有颜色的空白面板。这向用户指示单元格正在被编辑。\n\
  \n接下来，你希望当用户点击单元格时弹出你的编辑器。\n\n`JTable` 类会连同一个事件（如鼠标点击）调用你的编辑器，以确定该事件是否可以启动编辑过程。`AbstractCellEditor`\
  \ 类定义了接受所有事件的方法。\n\n```java\npublic boolean isCellEditable(EventObject anEvent)\n\
  {\n   return true;\n}\n```\n\n然而，如果你重写此方法并返回 `false`，表格将不会费力插入编辑器组件。\n\n一旦安装了编辑器组件，就会调用\
  \ `shouldSelectCell` 方法，推测带有相同的事件。你应该在该方法中启动编辑——例如，通过弹出一个外部编辑对话框。\n\n```java\npublic\
  \ boolean shouldSelectCell(EventObject anEvent)\n{\n   colorDialog.setVisible(true);\n\
  \   return true;\n}\n```\n\n如果用户取消了编辑，表格会调用 `cancelCellEditing` 方法。如果用户点击了另一个表格单元格，表格会调用\
  \ `stopCellEditing` 方法。在这两种情况下，你都应该隐藏对话框。当你的 `stopCellEditing` 方法被调用时，表格想要使用该值。\n\
  \n```java\npublic void cancelCellEditing()\n{\n   colorDialog.setVisible(false);\n\
  \   super.cancelCellEditing();\n}\n```\n\n最后，你需要一个方法产生用户提供的值：\n\n```java\npublic\
  \ Object getCellEditorValue()\n{\n   return colorChooser();\n}\n```\n\n总结来说，你的自定义编辑器应该：\n\
  \n1. 继承 `AbstractCellEditor` 类并实现 `TableCellEditor` 接口。\n2. 定义 `getTableCellEditorComponent`\
  \ 方法以提供组件。这可以是虚拟组件（如果你弹出对话框），也可以是就地编辑组件，如组合框或文本字段。\n3. 定义 `shouldSelectCell`、`stopCellEditing`\
  \ 和 `cancelCellEditing` 方法来处理编辑的开始、完成和取消。`stopCellEditing` 和 `cancelCellEditing`\
  \ 方法应该调用父类方法以确保通知监听。\n4. 定义 `getCellEditorValue` 方法返回编辑过程的结果。\n\n通过调用 `stopCellEditing`\
  \ 和 `cancelCellEditing` 方法指示用户完成编辑。构造颜色对话框时，我们安装了触发这些事件的回调。\n\n```java\ncolorDialog\
  \ = JColorChooser.createDialog(null, \"Planet Color\", false, colorChooser,\n  \
  \ EventHandler.create(ActionListener.class, this, \"stopCellEditing\"),\n   EventHandler.create(ActionListener.class,\
  \ this, \"cancelCellEditing\"));\n```\n\n完成了自定义编辑器的实现。\n\n现在你已经知道如何使单元格可编辑以及如何安装编辑器。还有一个剩余的问题——如何用用户编辑的值更新模型。编辑完成后，`JTable`\
  \ 类会调用表格模型的以下方法：\n\n```java\nvoid setValueAt(Object value, int r, int c)\n```\n\n\
  你需要重写该方法来存储新值。`value` 参数是单元格返回的对象。如果你实现了单元格编辑器，你就知道从 `getCellEditorValue` 方法返回的对象的类型。对于\
  \ `DefaultCellEditor` 情况，该值有三种可能：如果单元格编辑器是复选框，则为 `Boolean`；如果是文本字段，则为字符串；如果值来自组合框，则是用户选择的对象。\n\
  \n\n\n\n如果 `value` 对象没有适当的类型，则需要对其进行转换。这最发生在在文本框中编辑数字时。在我们的示例中，我们为组合框填充了 `Integer`\
  \ 对象，因此不需要任何转换。\n\n### 列表 12.4 tableCellRender/TableCellRenderFrame.java\n\n```java\n\
  package tableCellRender;\n\nimport java.awt.*;\nimport javax.swing.*;\nimport javax.swing.table.*;\n\
  \n/**\n * 此框架包含一个包含行星数据的表格。\n */\npublic class TableCellRenderFrame extends JFrame\n\
  {\n   private static final int DEFAULT_WIDTH = 600;\n   private static final int\
  \ DEFAULT_HEIGHT = 400;\n\n   public TableCellRenderFrame()\n   {\n      setSize(DEFAULT_WIDTH,\
  \ DEFAULT_HEIGHT);\n\n      var model = new PlanetTableModel();\n      var table\
  \ = new JTable(model);\n      table.setRowSelectionAllowed(false);\n\n      // 设置渲染器和编辑器\n\
  \n      table.setDefaultRenderer(Color.class, new ColorTableCellRenderer());\n \
  \     table.setDefaultEditor(Color.class, new ColorTableCellEditor());\n\n     \
  \ var moonCombo = new JComboBox<Integer>();\n      for (int i = 0; i <= 20; i++)\n\
  \         moonCombo.addItem(i);\n\n      TableColumnModel columnModel = table.getColumnModel();\n\
  \      TableColumn moonColumn = columnModel.getColumn(PlanetTableModel.MOONS_COLUMN);\n\
  \      moonColumn.setCellEditor(new DefaultCellEditor(moonCombo));\n      moonColumn.setHeaderRenderer(table.getDefaultRenderer(ImageIcon.class));\n\
  \      moonColumn.setHeaderValue(new ImageIcon(getClass().getResource(\"Moons.gif\"\
  )));\n\n      // 显示表格\n\n      table.setRowHeight(100);\n      add(new JScrollPane(table),\
  \ BorderLayout.CENTER);\n   }\n}\n```\n\n### 列表 12.5 tableCellRender/PlanetTableModel.java\n\
