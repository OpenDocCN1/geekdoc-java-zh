  \ 便利类），在 `AbstractAction` 对象的构造函数中指定菜单项标签，并重写 `actionPerformed` 方法以包含菜单动作处理器。例如：\n\
  \n```\nvar exitAction = new AbstractAction(\"Exit\") // 菜单项文本在这里\n   {\n      public\
  \ void actionPerformed(ActionEvent event)\n      {\n         // 动作代码写在这里\n     \
  \    System.exit(0);\n      }\n   };\n```\n\n然后你可以将该动作添加到菜单中：\n\n```\nJMenuItem\
  \ exitItem = fileMenu.add(exitAction);\n```\n\n此命令使用动作名称将菜单项添加到菜单中。动作对象本身成为它的监听器。这只是下面代码的一种方便快捷方式：\n\
  \n```\nvar exitItem = new JMenuItem(exitAction);\nfileMenu.add(exitItem);\n```\n\
