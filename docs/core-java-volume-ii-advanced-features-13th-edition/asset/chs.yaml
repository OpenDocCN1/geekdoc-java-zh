  \ 映射与其他登录模块进行通信。`options` 映射包含为该实例在登录配置中指定的键值对。\n*   `boolean login()`\n    执行认证过程并填充主体的主体（principal）。如果登录成功则返回\
  \ true。\n*   `boolean commit()`\n    在所有登录模块都成功后调用，适用于需要两阶段提交的登录场景。如果操作成功则返回 true。\n\
  *   `boolean abort()`\n\n\n\n\n\n如果另一个登录模块的失败导致登录过程终止，则调用此方法。如果操作成功，返回 `true`。\n\
  \n*   `boolean logout()`\n\n注销此主体。如果操作成功，返回 `true`。\n\n## 9.3. 数字签名\n\n如前所述，applet（小程序）是\
  \ Java 热潮的起点。在实践中，人们发现，尽管可以编写动画 applet（例如著名的“神经文本”），但在 JDK 1.0 安全模型下，applet 无法完成许多实用的工作。例如，由于\
  \ JDK 1.0 下的 applet 受到严格监控，即使在公司安全的内部网中执行 applet 的风险相对较小，它们也无法发挥太大作用。Sun 公司很快意识到，要让\
  \ applet 变得真正有用，用户需要根据 applet 的来源分配不同级别的安全权限。如果 applet 来自可信的供应商且未被篡改，那么该 applet\
  \ 的用户就可以决定是否赋予它更多权限。\n\n为了对 applet 给予更多信任，我们需要知道两点：\n\n*   applet 来自于哪里？\n*   代码在传输过程中是否被损坏？\n\
  \n在过去的 50 年里，数学家和计算机科学家开发了复杂的算法来确保数据完整性并创建电子签名。`java.security` 包包含了许多此类算法的实现。幸运的是，使用\
  \ `java.security` 包中的算法并不需要理解底层的数学原理。在接下来的章节中，我将向你展示消息摘要（message digests）如何检测数据文件的变化，以及数字签名如何证明签名者的身份。\n\
  \n### 9.3.1. 消息摘要\n\n消息摘要是数据块的数字指纹。例如，所谓的 SHA-1（安全哈希算法 #1）将任何数据块（无论长度多长）压缩为 160\
  \ 位（20 字节）的序列。就像真实的指纹一样，人们希望两个不同的消息具有相同的 SHA-1 指纹。当然，这并不可能的——只有 2¹⁶⁰ 种 SHA-1 指纹，因此某些消息一定具有相同的指纹。但\
  \ 2¹⁶⁰ 是一个巨大的数字，碰撞的概率可以忽略不计。忽略不计到什么程度呢？根据 James Walsh 在《真实概率：风险如何影响你的日常生活》（*True\
  \ Odds: How Risks Affect Your Everyday Life*，Merritt Publishing，1996）中的说法，你被雷劈死的概率大约是\
  \ 30,000 分之一。现在，想想另外九个人——例如你最不喜欢的九位经理或教授。你和他们所有人死于雷劈的概率，高于伪造消息与原始消息具有相同 SHA-1 指纹的概率。（当然，会有超过十个人（其中你可能一个都不认识）死于雷劈。然而，我们讨论的是你所选的这些人被消灭的极微小的概率。）\n\
  \n消息摘要有两个基本属性：\n\n*   如果数据的某位或几位发生变化，消息摘要也会发生变化。\n*   拥有给定消息的伪造者无法构造出与原始具有具有相同摘要的假消息。\n\
  \n第二个属性再次是一个概率问题。考虑这位万富翁父亲发的消息：\n\n> “在我去世后，我的财产应平均分给我的孩子们；然而，我的儿子乔将一无所有。”\n\n这条消息（带有一个最后的换行符）的\
  \ SHA-1 指纹为：\n\n```\n12 5F 09 03 E7 31 30 19 2E A6 E7 E4 90 43 84 B4 38 99 8F 67\n\
  ```\n\n不信任的父亲将消息留给了一位律师，将指纹留给了另一位。现在，假设乔贿赂了持有消息的律师。他想修改消息，让比尔一无所有。当然，这会让指纹变成一个完全不同的比特位模式：\n\
  \n```\n7D F6 AB 08 EB 40 EC CD AB 74 ED E9 86 F9 ED 99 D1 45 B1 57\n```\n\n乔能找到其他匹配该指纹的措辞吗？如果他从地球形成起就拥有一十亿台计算机，每秒秒计算百万条消息，他可能仍然还没有找到一个可以替换的消息。\n\
  \n已经设计了许多算法来计算此类消息摘要。其中包括 SHA-1（由美国国家标准与技术研究所开发的安全哈希算法）和由麻省理工的 Ronald Rivest 发明的\
  \ MD5 算法。这两种算法都以巧妙的方式打乱消息的比特位。关于这些算法的细节，请参考 William Stallings 写的《密码学与网络安全，第七版》（*Cryptography\
  \ and Network Security, Seventh Edition*，Pearson，2017）。然而，在两种算法中都发现了细微的规律性，NIST\
  \ 建议切换到更强大的替代方案。Java 支持 SHA-2 和 SHA-3 算法集。\n\n`MessageDigest` 类是用于创建封装指纹算法对象的工厂。它有一个名为\
  \ `getInstance` 的静态方法，返回一个扩展了 `MessageDigest` 类的对象。这意味着 `MessageDigest` 类承担了双重职责：\n\
  \n*   作为工厂类\n*   作为所有消息摘要算法的父类\n\n例如，这里是获取可以计算 SHA 指纹对象的方法：\n\n```\nMessageDigest\
  \ alg = MessageDigest.getInstance(\"SHA-1\");\n```\n\n在获取 `MessageDigest` 对象后，通过重复调用\
  \ `update` 方法将消息中的所有字节传递给它。例如，以下代码将文件中的所有字节传递给新创建的 `alg` 对象：\n\n```\nInputStream\
  \ in = . .\nint ch;\nwhile ((ch = in.read()) != -1)\n   alg.update((byte) ch);\n\
  ```\n\n或者，如果你有字节数组，可以一次性更新：\n\n```\nbyte[] bytes = . .\nalg.update(bytes);\n```\n\
  \n当你完成后，调用 `digest` 方法。该方法根据指纹算法填充输入，进行计算并返回字节数组形式的摘要。\n\n```\nbyte[] hash = alg.digest();\n\
  ```\n\n9.11 程序计算消息摘要。你可以在命令行指定文件和算法：\n\n```\njava hash.Digest input.txt SHA-1\n\
  ```\n\n如果你不提供命令行参数，程序会提示输入文件和算法名称。\n\n列表 9.11 hash/Digest.java\n\n```\npackage hash;\n\
  \nimport java.io.*;\nimport java.nio.file.*;\nimport java.security.*;\nimport java.util.*;\n\
  \n/**\n * 程序计算文件的消息摘要。\n * @version 1.21 2018-04-10\n * @author Cay Horstmann\n\
  \ */\npublic class Digest\n{\n   /** \n    * @param args args[0] 是文件名，args[1] 是可选的算法\n\
  \    * (SHA-1, SHA-256 或 MD5)\n    */\n   public static void main(String[] args)\
  \ throws IOException, GeneralSecurityException\n   {\n      var in = new Scanner(System.in);\n\
  \      String filename;\n      if (args.length >= 1)\n         filename = args[0];\n\
  \      else\n      {\n         System.out.print(\"File name: \");\n         filename\
  \ = in.nextLine();\n      }\n      String algname;\n      if (args.length >= 2)\n\
  \         algname = args[1];\n      else \n      {\n         System.out.println(\"\
  选择以下算法之一： \");\n         for (Provider p : Security.getProviders()) \n         \
  \   for (Provider.Service s : p.getServices()) \n               if (s.getType().equals(\"\
  MessageDigest\")) \n                  System.out.println(s.getAlgorithm());\n  \
  \       System.out.print(\"Algorithm: \");\n         algname = in.nextLine();\n\
  \      }\n      MessageDigest alg = MessageDigest.getInstance(algname);\n      byte[]\
  \ input = Files.readAllBytes(Path.of(filename));\n      byte[] hash = alg.digest(input);\n\
  \      for (byte h : hash)\n         System.out.printf(\"%02X \", h & 0xFF);\n \
  \     System.out.println();\n   }\n}\n```\n\n\n\n返回一个实现指定算法的 `MessageDigest` 对象。如果没有提供算法，则抛出\
  \ `NoSuchAlgorithmException`。\n\n*   `void update(byte input)`\n*   `void update(byte[]\
  \ input)`\n*   `void update(byte[] input, int offset, int len)`\n    使用指定的字节更新摘要。\n\
  *   `byte[] digest()`\n    完成哈希计算，返回计算出的摘要，并重置算法对象。\n*   `void reset()`\n    重置摘要。\n\
  \n### 9.3.2. 消息签名\n\n在上一节中，你已经学习了如何计算消息摘要——这是原始消息的“指纹”。如果消息被篡改，篡改后消息的指纹将与原始消息的指纹不匹配。如果消息和其指纹分开输送，接收者可以检查消息是否被篡改。然而，如果消息和指纹都被截获，那么修改消息并重新计算指纹是一件很容易的事。毕竟，消息摘要算法是公开的，而且它们不需要密钥。在这种情况下，伪造消息和重新计算的指纹的接收者永远不知道消息已经被篡改过。数字签名解决了这个问题。\n\
  \n为了帮助你理解数字签名的工作原理，让我们来看来自`公钥加密学`领域的几个概念。公钥加密学基于`公钥`和`私钥`的概念。其核心思想是向世界上每一个人公开你的公钥。然而，只有你本人持有私钥，保护好它并且不将其泄露给其他人至关重要。密钥之间通过数学关系进行匹配，尽管这些关系的确切性质对我们并不重要。（如果你感兴趣，可以在《应用密码学手册》中查找：[`cacr.uwaterloo.ca/hac/`](https://cacr.uwaterloo.ca/hac/)。）\n\
  \n这些密钥非常长且复杂。例如，这里有一对匹配的数字签名算法（DSA）公钥和私钥。\n\n公钥：\n\n```\np: fca682ce8e12caba26efccf7110e526db078b05edecbcd1eb4a208f3ae1617ae01f35b91a47e6df63413c5e12\n\
  ed0899bcd132acd50d99151bdc43ee737592e17\n\nq: 962eddcc369cba8ebb260ee6b6a126d9346e38c5\n\
  \ng: 678471b27a9cf44ee91a49c5147db1a9aaf244f05a434d6486931d2d14271b9e35030b71fd73da179069b32e2\n\
  935630e1c2062354d0da20a6c416e50be794ca4\n\ny: c0b6e67b4ac098eb1a32c5f8c4c1f0e7e6fb9d832532e27d0bdab9ca2d2a8123ce5a8018b8161a760480fadd0\n\
  40b927281ddb22cb9bc4df596d7de4d1b977d50\n```\n\n私钥：\n\n```\np: fca682ce8e12caba26efccf7110e526db078b05edecbcd1eb4a208f3ae1617ae01f35b91a47e6df63413c5e12\n\
  ed0899bcd132acd50d99151bdc43ee737592e17\n\nq: 962eddcc369cba8ebb260ee6b6a126d9346e38c5\n\
  \ng: 678471b27a9cf44ee91a49c5147db1a9aaf244f05a434d6486931d2d14271b9e35030b71fd73da179069b32e2\n\
  935630e1c2062354d0da20a6c416e50be794ca4\n\nx: 146c09f881656cc6c51f27ea6c3a91b85ed1d70a\n\
  ```\n\n人们认为，从一个密钥计算出另一个密钥在实践上是不可能的。也就是说，即使每个人都知道你的公钥，在你有生范围内，无论他们拥有多少计算资源，都无法计算出你的私钥。\n\
  \n这可能很难相信无法从公钥计算出私钥——但目前还没有人找到实现的方法。\n\n### 9.3.3. 验证签名\n\nJDK 自带了 `keytool` 程序，用于管理密钥库（keystores）——即证书和私公钥对的数据库。密钥库中的每个条目都有一个别名（alias）。以下是\
  \ Alice 如何创建一个名为 `alice.jks` 的密钥库并生成别名为 `alice` 的密钥对：\n\n```\nkeytool -genkeypair\
  \ -keyalg DSA -keystore alice.jks -alias alice\n```\n\n创建或打开密钥库时，会提示你输入密钥库密码。在本示例中，请使用\
  \ `secret`。生成密钥时，会提示你输入以下信息：\n\n```\nEnter keystore password:  secret\nReenter new\
  \ password:  secret\nWhat is your first and last name?\n  [Unknown]:  Alice Lee\n\
  What is the name of your organizational unit?\n  [Unknown]:  Engineering\nWhat is\
  \ the name of your organization?\n  [Unknown]:  ACME Software\nWhat is the name\
  \ of your City or Locality?\n  [Unknown]:  San Francisco\nWhat is the name of your\
  \ State or Province?\n  [Unknown]:  CA\nWhat is the two-letter country code for\
  \ this unit?\n  [Unknown]:  US\nIs <CN=Alice Lee, OU=Engineering, O=ACME Software,\
  \ L=San Francisco, ST=CA, C=US> correct?\n  [no]:  yes\n```\n\n`keytool` 使用 X.500\
  \ 格式的名称来识别密钥所有者和证书颁发者，其组件包括通用名称 (CN)、组织单位 (OU)、组织 (O)、位置 (L)、州 (ST) 和国家 (C)。\n\n\
  假设 Alice 想将她的公钥给 Bob。她需要导出出一个证书文件：\n\n```\nkeytool -exportcert -keystore alice.jks\
  \ -alias alice -file alice.cer\n```\n\n现在 Alice 可以将证书发送给 Bob。Bob 接收证书后，可以打印它：\n\n\
  ```\nkeytool -printcert -file alice.cer\n```\n\n输出结果如下：\n\n\n\n\n\n```\nOwner: CN=Alice\
  \ Lee, OU=Engineering, O=ACME Software, L=San Francisco, ST=CA, C=US\nIssuer: CN=Alice\
  \ Lee, OU=Engineering, O=ACME Software, L=San Francisco, ST=CA, C=US\nSerial number:\
  \ b2b46ccd99479da2\nValid from: Tue Jan 16 08:11:22 CET 2024 until: Mon Apr 15 09:11:22\
  \ CEST 2024\nCertificate fingerprints:\n  SHA1: 41:38:E6:F2:9D:FA:90:FE:CB:36:85:F1:E6:39:62:A1:5A:DD:16:BC\n\
  \  SHA256: 14:CC:AD:BC:83:D5:0C:F9:98:24:52:29:B3:AF:B2:B9:05:A7:C0:61:15:63:EA:FB:13:4F:73:37:D2:FD:8D:FB\n\
  Signature algorithm name: SHA256withDSA\nSubject Public Key Algorithm: 2048-bit\
  \ DSA key\nVersion: 3\n```\n\n如果 Bob 想要检查他获得的是正确的证书，他可以联系 Alice 并在电话中验证证书指纹。\n\n\
  某些证书颁发机构会在其网站上发布证书指纹。例如，要检查 `var jdk/lib/security/cacerts` 目录下的 DigiCert 证书，可以使用\
  \ `-list` ：\n\n```\nkeytool -list -v -keystore jdk/lib/security/cacerts\n```\n\n\
  该密钥库的密码为 `changeit`。该密钥库中的一个证书是：\n\n```\nOwner: CN=DigiCert Assured ID Root G3,\
  \ OU=www.digicert.com, O=DigiCert Inc, C=US\nIssuer: CN=DigiCert Assured ID Root\
  \ G3, OU=www.digicert.com, O=DigiCert Inc, C=US\nSerial number: ba15afa1ddfa0b54944afcd24a06cec\n\
  Valid from: Thu Aug 01 14:00:00 CEST 2013 until: Fri Jan 15 13:00:00 CET 2038\n\
  Certificate fingerprints:\n         SHA1: F5:17:A2:4F:9A:48:C6:C9:F8:A2:00:26:9F:DC:0F:48:2C:AB:30:89\n\
  \         SHA256: 7E:37:CB:8B:4C:47:09:0C:AB:36:55:1B:A6:F4:5D:B8:40:68:0F:BA:\n\
  \                 16:6A:95:2D:B1:00:71:7F:43:05:3F:C2\n```\n\n你可以通过访问网站 `https://www.digicert.com/kb/digicert-root-certificates.htm`\
  \ 来检查你的证书是否有效。\n\n一旦 Bob 信任该证书，他就可以将其导入自己的密钥库中。\n\n```\nkeytool -importcert -keystore\
  \ bob.jks -alias alice -file alice.cer\n```\n\n永远不要向密钥库导入你不完全信任的证书。一旦证书被密钥库，任何使用该密钥库的程序都会认为该证书可以用于验证签名。\n\
  \n现在 Alice 可以开始向 Bob 发送签名文档了。`jarsigner` 工具用于签名和验证 JAR 文件。Alice 只需将签名的文档放入 JAR 文件中。\n\
  \n```\njar cvf document.jar document.txt\n```\n\n然后她使用 `jarsigner` 工具向文件添加签名。她需要指定密钥库、JAR\
  \ 文件以及要使用的密钥别名。\n\n```\njarsigner -keystore alice.jks document.jar alice\n```\n\n\
  当 Bob 接收到文件时，他使用 `jarsigner` 程序的 `-verify` 选项\n\n```\njarsigner -verify -keystore\
  \ bob.jks document.jar\n```\n\nBob 不需要指定密钥别名。`jarsigner` 程序会在数字签名中找到密钥所有者的 X.500\
  \ 名称，并在密钥库中查找匹配的证书。\n\n如果 JAR 文件未损坏且签名匹配，`jarsigner` 程序将打印：\n\n```\njar verified.\n\
  ```\n\n随后会显示若干警告，对于这个简单的实验，你可以忽略这些警告。否则，程序将显示错误信息。\n\n### 9.3.4. 认证问题\n\n假设你收到来自朋友\
  \ Alice 的消息，该消息使用我刚刚向你的方法用她的私钥签名。你可能已经有了她的公钥，或者可以通过向她要副本或从她的网页轻松获取。那么，你可以验证该消息确实是由\
  \ Alice 编写且未被篡改的。现在，假设你收到来自陌生人的消息，对方声称代表某著名软件公司，敦促你运行随消息的程序。\n\n### 9.3.5. 证书签名\n\
  \n在 9.3.3 节中，你看到了 Alice 如何使用证书向 Bob 分发公钥。然而，Bob 需要通过与 Alice 验证指纹来确保证书是有效的。\n\n假设\
  \ Alice 想要向她的同事 Cindy 发送一条签名消息，但 Cindy 不想去验证大量的签名指纹。现在假设有一个 Cindy 信任的用于签名的实体。在这个例子中，Cindy\
  \ 信任 ACME Software 的信息资源部。\n\n\n\n\n该部门运行着 `certificate authority` (CA)。ACME 的每个人的密钥库中都有\
  \ `CA` 的公钥，该公钥由系统管理员安装，管理员已仔细检查了密钥指纹。`CA` 对 ACME 员工的密钥签名。当他们安装对方的密钥时，密钥库将隐含地信任他们，因为这些密钥是由信任的密钥签名的。\n\
  \n以下是模拟此过程的方法。创建一个密钥库 `acmesoft.jks`。生成一个密钥对并导出公钥：\n\n```\nkeytool -genkeypair -keystore\
  \ acmesoft.jks -keyalg DSA -alias acmeroot\nkeytool -exportcert -keystore acmesoft.jks\
  \ -alias acmeroot -file acmeroot.cer\n```\n\n公钥被导出到“自签名”证书中。然后，将其添加到每个员工的密钥库中：\n\
  \n```\nkeytool -importcert -keystore cindy.jks -alias acmeroot -file acmeroot.cer\n\
  ```\n\n为了让 Alice 能向 Cindy 以及 ACME Software 的其他人发送消息，她需要将自己的证书带到信息资源部门进行签名。遗憾的是，`keytool`\
  \ 程序中缺少这一功能。在书的配套代码中，我提供了一个 `CertificateSigner` 类来填补这一空白。ACME Software 的授权工作人员会验证\
  \ Alice 的身份并按照如下方式生成签名证书：\n\n```\njava CertificateSigner -keystore acmesoft.jks\
  \ -alias acmeroot \\\n   -infile alice.cer -outfile alice_signedby_acmeroot.cer\n\
  ```\n\n证书签名程序必须能够访问 ACME Software 的密钥库，且工作人员必须知道密钥库密码。显然，这是一项敏感操作。\n\nAlice 将文件\
  \ `alice_signedby_acmeroot.cer` 交给 Cindy 以及 ACME Software 的其他任何人。或者，ACME Software\
  \ 也可以将该文件存储在公司目录中。记住，此文件包含了 Alice 的公钥，以及 ACME Software 对该密钥确实属于 Alice 的一项断言。\n\n\
  现在，Cindy 将签名后的证书导入她的密钥库中：\n\n```\nkeytool -importcert -keystore cindy.jks -alias\
  \ alice -file alice_signedby_acmeroot.cer\n```\n\n密钥库验证了该密钥是由密钥库中已存在的信任根密钥签名的。Cindy\
  \ `并不` 被要求验证证书指纹。\n\n一旦 Cindy 添加了根证书以及经常向她发送文档的证书，在这些证书过期之前，她就不需要再次担心证书了。\n\n###\
  \ 9.3.6. 证书请求\n\n在上一节中，我们使用密钥库和 `CertificateSigner` 工具模拟了 CA。然而，大多数 CA 运行更复杂的软件来管理证书，并且它们使用的证书格式略有不同。本节展示了与这些软件包交互时所需的额外步骤。\n\
  \n我们将使用 OpenSSL 软件包作为示例。该软件预装在许多 Linux 系统和 Mac OS X 上，同时也提供了适用于 Windows 的 Cygwin\
  \ 版本。你可以在 [`www.openssl.org`](https://www.openssl.org) 下载该软件。\n\n要创建一个 CA，请运行 `CA`\
  \ 脚本。具体位置取决于你的操作系统。在 Ubuntu 上，运行：\n\n```\n/usr/lib/ssl/misc/CA.pl -newca\n```\n\n\
  该脚本会在当前目录下创建一个名为 `demoCA` 的子目录。该目录包含一个根密钥对以及用于证书和证书吊销列表的存储空间。\n\n你会想要将公钥导入所有员工的\
  \ Java 密钥库，但它是增强型邮件 (PEM) 格式，而不是密钥库容易接受的 DER 格式。将文件 `demoCA/cacert.pem` 拷贝到文件 `acmeroot.pem`\
  \ 并用文本编辑器打开该文件。删除该行之前的内容：\n\n```\n-----BEGIN CERTIFICATE-----\n```\n\n以及该行之后的内容：\n\
  \n```\n-----END CERTIFICATE-----\n```\n\n现在你可以按照通常方式将 `acmeroot.pem` 导入每个密钥库：\n\n\
  ```\nkeytool -importcert -keystore cindy.jks -alias acmeroot -file acmeroot.pem\n\
  ```\n\n`keytool` 不能执行这种编辑操作似乎非常不可思议。\n\n要对 Alice 的公钥进行签名，首先生成一个包含 PEM 格式证书的`证书请求`：\n\
  \n```\nkeytool -certreq -keystore alice.jks -alias alice -file alice.pem\n```\n\n\
  要签名证书，运行：\n\n```\nopenssl ca -in alice.pem -out alice_signedby_acmeroot.pem\n```\n\
  \n与之前一样，从 `alice_signedby_acmeroot.pem` 中剪出 `BEGIN CERTIFICATE`/`END CERTIFICATE`\
  \ 标记之外的所有内容。然后将其导入 Cindy 的密钥库：\n\n```\nkeytool -importcert -keystore cindy.jks -alias\
  \ alice -file alice_signedby_acmeroot.pem\n```\n\n要让证书颁发机构签名，请遵循类似的步骤。生成证书请求，将其发送给机构，并导入从他们那里收到的签名文件。\n\
  \n### 9.3.7. 代码签名\n\n认证技术的一个常见用途是对可执行程序进行签名。如果你下载了一个程序，你自然会担心它可能造成的破坏。例如，该程序可能被病毒感染。如果你知道代码的来源\
  \ `并且` 并且自离开源处以来没有被篡改，你的安全感会比没有这些信息要高得多。\n\n在这一节中，我将向你展示如何对 JAR 文件进行签名，以及如何配置 Java\
  \ 来验证签名。这种功能最初是为 applet 设计的。虽然这些现在已不再常用，但你可能仍需要支持它们。\n\n当 Java 最初发布时，applet 在加载后立即在“沙箱”中运行，权限有限。如果用户想要可以使用访问文件系统、建立网络连接等的\
  \ applet，他们必须显式同意。\n\n这里有一个具体的例子。假设你在浏览网页时，遇到一个提供运行未知供应商的 applet 的网站，前提是你授予权限。此类程序是由运行时信任的证书颁发机构签发的\
  \ `software developer` 证书。弹出对话框会识别软件开发者和证书颁发机构。现在你需要决定是否授权该程序。\n\n你有哪些事实可以影响你的决策？以下是已知事实：\n\
  \n*   Thawte 向软件开发者出售了证书。\n*   程序确实是用该证书签名的，并且在传输过程中没有被修改。\n*   该证书确实是由 Thawte 签名的——通过本地\
  \ `cacerts` 文件中的公钥进行了验证。\n\n当然，这些都不能告诉你代码运行起来是否安全。如果你只知道供应商的名字以及 Thawte 向他们出售了软件开发者证书的事，你能信任这个供应商吗？这种方法并没有太大意义。\n\
  \n对于内网部署，证书更具可行性。管理员可以在本地机器安装策略文件和证书，以便启动信任的代码而不需要用户交互。然而，随着安全管理器的弃用，这种方法已不再可行。\n\
  \n### 9.3.8. 密码哈希\n\n出于显而易见的安全考虑，不应明文存储密码。相反应该存储它们的哈希值。当用户登录时，对用户的密码输入也进行哈希处理。如果值匹配，则用户通过验证。\n\
  \n然而，你目前看到的哈希算法并不适用于密码哈希。为了防止暴力攻击，哈希机制应该使用多次迭代计算。此外，为了防止预计算密码表，每个密码都应该用随机“盐”值进行修改。\n\
  \nJava 提供了 `PBKDF2` 算法用于密码哈希。该算法有四个参数：\n\n*   持有密码的 `char` 数组\n\n\n\n\n\n*   随机盐字节数组\n\
  *   迭代次数\n*   输出的位数\n\n加盐的密码并不是一条消息，因此你不需要使用 `MessageDigest` 接口。相反，使用这样的 `SecretKeyFactory`：\n\
  \n```\nvar spec = new PBEKeySpec(password, salt, ITERATIONS, 8 * HASH_BYTES);\n\
  SecretKeyFactory skf = SecretKeyFactory.getInstance(\"PBKDF2WithHmacSHA256\");\n\
  byte[] hash = skf.generateSecret(spec).getEncoded();\n```\n\n缩写 `PBE` 代表“基于密码的加密”（password\
  \ based encryption），因为派生的字节也可以作为加密密钥。`PBKDF` 是“基于密码的密钥派生函数”（password based key derivation\
  \ function），它将短密码转换为更长的加密密钥。我们对加密并不感兴趣，只需存储生成的字节。对于密码验证，存储盐也很重要。由于随着处理器的增强，随着时间推移增加迭代次数是一个良好做法，你也应该存储该值。\n\
  \n在将哈希值作为字符串存储时，字节应编码为十六进制，或者更高效地编码为 base64：\n\n```\nBase64.Encoder encoder = Base64.getEncoder();\n\
  String hashedPassword = ITERATIONS + \"|\" + encoder.encodeToString(salt) + \"|\"\
  \ \n   + encoder.encodeToString(hash);\n```\n\n要验证用户输入的密码，请从存储的哈希中获取次数和盐，并重新计算哈希。\n\
  \n## 9.4. 加密\n\n到目前，我们已经讨论了 Java 安全 API 实现的一种重要加密技术——即通过数字签名进行身份验证。安全的另一个重要方面是加密。即使通过了身份验证，信息本身也是可见的。数字签名仅用于验证信息没有被更改。相反，当信息被加密时，它是不可见的。只有使用匹配的密钥才能解密。\n\
  \n对于代码签名，身份验证就足够——不需要隐藏代码。当应用程序传输机密（如信用卡号和其他个人数据）时，加密是必要的。\n\n在过去，专利和出口控制限制许多公司提供强加密。幸运的是，现在的出口控制已宽松得多，而且重要算法的专利已经过期。如今，Java\
  \ 作为标准库的一部分提供了优秀的加密支持。\n\n### 9.4.1. 对称密码\n\nJava 加密扩展类包含一个 `Cipher` 类，它是所有加密算法的父类。要获取加密器对象，调用\
  \ `getInstance` 方法：\n\n```\nCipher cipher = Cipher.getInstance(algorithmName);\n\
  ```\n\n或者\n\n```\nCipher cipher = Cipher.getInstance(algorithmName, providerName);\n\
  ```\n\nJDK 自带由名为 `\"SunJCE\"` 的提供者提供的密码。如果你不指定另一个提供者名称，它就是默认提供者。如果你需要 Oracle 不支持的特殊算法，你可能需要另一个提供者。\n\
  \n算法名称是一个字符串，例如 `\"AES\"` 或 `\"DES/CBC/PKCS5Padding\"`。\n\n数据加密标准 (DES) 是一种密钥长度为\
  \ 56 位的古老块密码。如今，`DES` 算法被认为是过时的，因为可以通过暴力破解来破解。一个更好的替代方案是它的继者——高级加密标准 (AES)。关于 AES\
  \ 算法的详细描述，请参见 [`nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.197.pdf`](https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.197.pdf)。我在本示例中使用了\
  \ `AES`。\n\n一旦你有了加密器对象，通过设置模式和密钥来初始化它：\n\n```\nint mode = . . .;\nKey key = . .\
  \ .;\ncipher.init(mode, key);\n```\n\n模式是以下之一：\n\n```\nCipher.ENCRYPT_MODE\nCipher.DECRYPT_MODE\n\
  Cipher.WRAP_MODE\nCipher.UNWRAP_MODE\n```\n\n封装和解封装模式用一个密钥加密另一个密钥——示例请参见下一节。\n\n\
  现在，你可以反复调用 `update` 方法来加密数据块：\n\n```\nint blockSize = cipher.getBlockSize();\nvar\
  \ inBytes = new byte[blockSize];\n. . . // 读取 inBytes\nint outputSize= cipher.getOutputSize(blockSize);\n\
  var outBytes = new byte[outputSize];\nint outLength = cipher.update(inBytes, 0,\
  \ outputSize, outBytes);\n. . . // 写入 outBytes\n```\n\n完成后，你必须调用一次 `doFinal` 方法。如果有最后的输入数据块（字节少于\
  \ `blockSize` 字节），调用：\n\n```\noutBytes = cipher.doFinal(inBytes, 0, inLength);\n\
  ```\n\n如果所有输入数据都已加密，则调用：\n\n```\noutBytes = cipher.doFinal();\n```\n\n调用 `doFinal`\
  \ 是为了对最后一个块进行填充。考虑 `DES` 加密器。它的块大小为八字节。假设输入数据的最后一个块少于八个字节。当然，我们可以用 `0` 填充剩余字节，以获得一个八字节的最后一个数据块并对其进行加密。但当解密数据块时，结果将在末尾附加几个\
  \ `0` 字节，因此将与原始输入文件略有不同。为了避免这个问题，我们需要一种填充方案。一种常用的填充方案是 RSA Security, Inc. 在《公钥密码标准》(PKCS)\
  \ #5 中描述的（[`datatracker.ietf.org/doc/html/rfc2898`](https://datatracker.ietf.org/doc/html/rfc2898)）。在该方案中，最后一个字节不与。\n\
  \n### 9.4.2. 密钥生成\n\n为了加密，你需要生成密钥。每个算法的格式都不同，你需要确保密钥生成是随机的。遵循以下步骤：\n\n1. 获取对应算法的\
  \ `KeyGenerator`。\n2. 使用随机源初始化生成器。如果密码的块长度是变量，请指定所需的块长度。\n3. 调用 `generateKey` 方法。\n\
  \n例如，这里是生成 `AES` 密钥的方法：\n\n```\nKeyGenerator keygen = KeyGenerator.getInstance(\"\
  AES\");\nvar random = new SecureRandom(); // 见下文\nkeygen.init(random);\nKey key\
  \ = keygen.generateKey();\n```\n\n或者，你可以从一组原始数据（可能派自密码或击键计时）构造 `SecretKeySpec`（实现\
  \ `SecretKey` 接口）：\n\n```\nbyte[] keyData = . . .; // AES 使用 16 字节\nvar key = new\
  \ SecretKeySpec(keyData, \"AES\");\n```\n\n在生成密钥时，确保你使用*真正的随机*数字。例如，`Random` 类中由当前日期和时间种子的随机数生成器并不随机。假设计算机时钟精确到\
  \ 1/10 秒。那么每天最多有 864,000 个种子。如果攻击者知道密钥发布的日期（通常可以从消息日期或证书过期日期推断），生成那天所有可能的种子是非常容易的事。\n\
  \n`SecureRandom` 类生成的随机数比 `Random` 类产生的安全得多。你仍然需要提供一个种子以使数字序列从随机位置开始。实现此点的方法是从硬件设备（如白噪声生成器）获取随机输入。另一个合理的随机输入源是让用户在键盘上漫无打字，每次击键为随机种子贡献一个或两个比特。当你将此类随机位收集到字节数组中时，将其传递给\
  \ `setSeed` 方法：\n\n\n\n\n\n```java\nvar random = new SecureRandom();\nvar b = new\
  \ byte[20];\n// fill with truly random bits\nrandom.setSeed(b);\n```\n\n如果你不为随机数生成器设置种子，它将通过启动线程、让其睡眠并测量它们唤醒时的精确时间，来计算自己的\
  \ 20 字节种子。\n\n该算法并`不是`被认为是安全的。在过去，依赖于计算机某些组件计时（例如硬盘访问时间）的算法已被证明证明不是完全随机的。\n\n本节末尾的示例程序使\
  \ AES 密器工作（参参见 列表 9.12）。列表 9.13 中的 `crypt` 工具类方法将在其他示例中重用。要使用该程序，你首先需要生成一个密钥。运行：\n\
  \n```\njava aes.AESTest -genkey secret.key\n```\n\n密钥被保存在 `secret.key` 文件中。\n\n\
  现在你可以使用以下命令进行加密：\n\n```\njava aes.AESTest -encrypt plaintextFile encryptedFile secret.key\n\
  ```\n\n使用以下命令进行解密：\n\n```\njava aes.AESTest -decrypt encryptedFile decryptedFile\
  \ secret.key\n```\n\n该程序非常直观。`-genkey` 选项产生一个新的密钥并将其序列化到指定文件中。`-encrypt` 和 `-decrypt`\
  \ 选项都调用同一个 `crypt` 方法，该方法又调用了密器的 `update` 和 `doFinal` 方法。注意，只要输入块是完整长度，就会调用 `update`\
  \ 方法，而 `doFinal` 方法要么带有部分输入块被调用（对其进行填充），要么在没有额外数据的情况下调用（以生成一个填充块）。\n\n#### 列表 9.12\
  \ aes/AESTest.java\n\n```java\npackage aes;\n\nimport java.io.*;\nimport java.security.*;\n\
  import javax.crypto.*;\n\n/**\n * 此程序测试 AES 密器。用法：<br>\n * java aes.AESTest -genkey\
  \ keyfile<br>\n * java aes.AESTest -encrypt encrypted key keyfile<br>\n * java aes.AESTest\
  \ -decrypt encrypted decrypted keyfile<br>\n * @author Cay Horstmann\n * @version\
  \ 1.02 2018-05-01\n */\npublic class AESTest\n{\n   public static void main(String[]\
  \ args) \n         throws IOException, GeneralSecurityException, ClassNotFoundException\n\
  \   {\n      if (args[0].equals(\"-genkey\"))\n      {\n         KeyGenerator keygen\
  \ = KeyGenerator.getInstance(\"AES\");\n         var random = new SecureRandom();\n\
  \         keygen.init(random);\n         SecretKey key = keygen.generateKey();\n\
  \         try (var out = new ObjectOutputStream(new FileOutputStream(args[1])))\n\
  \         {\n            out.writeObject(key);\n         }\n      }\n      else\n\
  \      {\n         int mode;\n         if (args[0].equals(\"-encrypt\")) mode =\
  \ Cipher.ENCRYPT_MODE;\n         else mode = Cipher.DECRYPT_MODE;\n\n         try\
  \ (var keyIn = new ObjectInputStream(new FileInputStream(args[3]));\n          \
  \     var in = new FileInputStream(args[1]);\n               var out = new FileOutputStream(args[2]))\n\
  \         {\n            var key = (Key) keyIn.readObject();\n            Cipher\
  \ cipher = Cipher.getInstance(\"AES\");\n            cipher.init(mode, key);\n \
  \           Util.crypt(in, out, cipher);\n         }\n      }\n   }\n}\n```\n\n\
  #### 列表 9.13 aes/Util.java\n\n```java\npackage aes;\n\nimport java.io.*;\nimport\
  \ java.security.*;\nimport javax.crypto.*;\n\npublic class Util\n{\n   /**\n   \
  \ * 使用密器转换输入流中的字节，并将转换后的字节\n    * 发送到输出流。\n    * @param in 输入流\n    * @param out\
  \ 输出流\n    * @param cipher 转换字节的密器\n    */\n   public static void crypt(InputStream\
  \ in, OutputStream out, Cipher cipher) \n         throws IOException, GeneralSecurityException\n\
  \   {\n      int blockSize = cipher.getBlockSize();\n      int outputSize = cipher.getOutputSize(blockSize);\n\
  \      var inBytes = new byte[blockSize];\n      var outBytes = new byte[outputSize];\n\
  \n      int inLength = 0;\n      boolean done = false;\n      while (!done)\n  \
  \    {\n         inLength = in.read(inBytes);\n         if (inLength == blockSize)\n\
  \         {\n            int outLength = cipher.update(inBytes, 0, blockSize, outBytes);\n\
  \            out.write(outBytes, 0, outLength);\n         }\n         else done\
  \ = true;\n      }\n      if (inLength > 0) outBytes = cipher.doFinal(inBytes, 0,\
  \ inLength);\n      else outBytes = cipher.doFinal();\n      out.write(outBytes);\n\
  \   }\n}\n```\n\n`javax.crypto.Cipher` 1.4\n\n*   `static Cipher getInstance(String\
  \ algorithmName)`\n*   `static Cipher getInstance(String algorithmName, String providerName)`\n\
  \    返回一个实现指定算法的 `Cipher` 对象。如果未提供算法，则抛出 `NoSuchAlgorithmException`。\n*   `int getBlockSize()`\n\
  \    返回密文块的大小（字节字节），如果不是则返回 `0`。\n*   `int getOutputSize(int inputSize)`\n    返回包含\
  \ `inputSize` 字节明文所需的密文大小（字节字节）。\n*   `void init(int mode, Key key)`\n    用指定的模式和密钥初始化密器。\n\
  *   `int update(byte[] input, int inputOffset, int len, byte[] output)`\n    处理输入并返回生成的密文字节数。\n\
  *   `byte[] doFinal(byte[] input, int inputOffset, int len)`\n    处理最后的输入并返回密文。\n\
  *   `byte[] doFinal()`\n    处理最后的输入并返回密文。\n\n`javax.crypto.KeyGenerator` 1.4\n\n\
  *   `static KeyGenerator getInstance(String algorithmName)`\n    返回一个实现指定算法的 `KeyGenerator`\
  \ 对象。如果未提供算法，则抛出 `NoSuchAlgorithmException`。\n*   `void init(SecureRandom random)`\n\
  \    使用随机数源初始化。\n*   `void init(int keysize, SecureRandom random)`\n    使用密钥大小和随机数源初始化。\n\
  *   `SecretKey generateKey()`\n    生成一个密钥。\n\n`javax.crypto.spec.SecretKeySpec`\
  \ 1.4\n\n*   `SecretKeySpec(byte[] key, String algorithmName)`\n    构造密钥规范。\n\n\
  ### 9.4.3 Cipher Streams\n\nJCE 库提供了一组方便的流类，可以自动加密或解密数据。例如，以下是将数据加密到文件的方法：\n\n```java\n\
  Cipher cipher = . . .;\ncipher.init(Cipher.ENCRYPT_MODE, key);\nvar out = new CipherOutputStream(new\
  \ FileOutputStream(outputFileName), cipher);\nvar bytes = new byte[BLOCKSIZE];\n\
  int inLength = getData(bytes); // 从数据源获取数据\nwhile (inLength != -1)\n{\n   out.write(bytes,\
  \ 0, inLength);\n   inLength = getData(bytes); // 从数据源获取更多数据\n}\nout.flush();\n\
  ```\n\n同样，你可以使用 `CipherInputStream` 从文件读取并解密数据：\n\n```java\nCipher cipher = . .\
  \ .;\ncipher.init(Cipher.DECRYPT_MODE, key);\nvar in = new CipherInputStream(new\
  \ FileInputStream(inputFileName), cipher);\nvar bytes = new byte[BLOCKSIZE];\nint\
  \ inLength = in.read(bytes);\nwhile (inLength != -1)\n{\n   putData(bytes, inLength);\
  \ // 将数据存入目的地\n   inLength = in.read(bytes);\n}\n```\n\n密器流类透明地处理了 `update` 和 `doFinal`\
  \ 的调用，这显然是一种便利。\n\n`javax.crypto.CipherInputStream` 1.4\n\n*   `CipherInputStream(InputStream\
  \ in, Cipher cipher)`\n    构造一个输入流，从 `in` 读取数据并使用给定的密器进行解密或加密。\n*   `int read()`\n\
  *   `int read(byte[] b, int off, int len)`\n    从输入流读取数据，数据会自动解密或加密。\n\n`javax.crypto.CipherOutputStream`\
  \ 1.4\n\n*   `CipherOutputStream(OutputStream out, Cipher cipher)`\n    构造一个输出流，向\
  \ `out` 写入数据并使用给定的密器进行加密或解密。\n*   `void write(int ch)`\n\n\n\n\n\n*   `void write(byte[]\
  \ b, int off, int len)`\n    将数据写入输出流，该数据会被自动加密或解密。\n\n*   `void flush()`\n    刷新密码密器缓冲区，并在必要时执行填充。\n\
  \n### 9.4.4. 公钥加密\n\n你在前一节中看到的 AES 算法是一种对称加密算法。加密和解密使用同一个密钥。对称加密的致命琉斯之踵是密钥分发。如果\
  \ Alice 向 Bob 发送一条加密消息，Bob 需要与 Alice 相同的密钥。如果 Alice 更改了密钥，她需要向 Bob 发送消息，并通过一个安全通道发送新密钥。但也许她没有与\
  \ Bob 通信的密钥通道——这正是她起初要给他的消息进行加密的原因。\n\n公钥加密解决了这个问题。在公钥加密中，Bob 拥有一由公钥和匹配的私钥组成的密钥对。Bob\
  \ 可以在任何地方发布公钥，但他必须严密保护私钥。Alice 只需使用公钥加密她给 Bob 的消息即可。\n\n实际上，并没有那么简单。所有已知的公钥算法都比\
  \ DES 或 AES 等对称密钥算法慢得多。使用公钥算法加密大量信息是不切实际的。然而，可以通过将公钥加密与快速的对称加密相结合来轻松解决这个问题，如下：\n\
  \n1. Alice 生成一个随机对称加密密钥。她使用该密钥加密她的明文。\n2. Alice 用 Bob 的公钥加密对称密钥。\n3. Alice 向 Bob\
  \ 发送加密后的对称密钥和加密后的明文。\n4. Bob 使用他的私钥解密对称密钥。\n5. Bob 使用解密后的对称密钥解密消息。\n\n除了 Bob 之外没人能解密对称密钥，因为只有\
  \ Bob 拥有解密的私钥。因此，昂贵的公钥加密仅用于少量的密钥数据。\n\n最常用的公钥算法是是由 Rivest、Shamir 和 Adleman 发明的 RSA\
  \ 算法。在 2000 年 10 月之前，该算法受分配给 RSA Security, Inc. 的专利保护。许可费用并不便宜——通常为 3% 的版税，且每年最低支付\
  \ 50,000 美元。现在该算法已进入公共领域。\n\n要使用 RSA 算法，你需要一对公钥/私钥对。像如下所示使用 `KeyPairGenerator`：\n\
  \n```\nKeyPairGenerator pairgen = KeyPairGenerator.getInstance(\"RSA\");\nvar random\
  \ = new SecureRandom();\npairgen.initialize(KEYSIZE, random);\nKeyPair keyPair =\
  \ pairgen.generateKeyPair();\nKey publicKey = keyPair.getPublic();\nKey privateKey\
  \ = keyPair.getPrivate();\n```\n\nListing 9.14 中的程序有三个选项。`-genkey` 选项生成密钥对。`-encrypt`\
  \ 选项生成 AES 密钥并用公钥将其封装。\n\n```\nKey key = . . .; // 一个 AES 密钥\nKey publicKey = .\
  \ . .; // 一个 RSA 公钥\nCipher cipher = Cipher.getInstance(\"RSA\");\ncipher.init(Cipher_WRAP_MODE,\
  \ publicKey);\nbyte[] wrappedKey = cipher.wrap(key);\n```\n\n然后它生成一个包含以下内容的文件\n\n\
  * 封装密钥的长度\n* 封装密钥的字节\n* 用 AES 密钥加密的明文\n\n`-decrypt` 选项解密此类文件。要尝试运行程序，首先生成 RSA 密钥：\n\
  \n```\njava rsa.RSATest -genkey public.key private.key\n```\n\n然后加密一个文件：\n\n```\n\
  java rsa.RSATest -encrypt plaintextFile encryptedFile public.key\n```\n\n最后，解密它并验证解密后的文件是否与明文匹配：\n\
  \n```\njava rsa.RSATest -decrypt encryptedFile decryptedFile private.key\n```\n\n\
  Listing 9.14 rsa/RSATest.java\n\n```\npackage rsa;\n\nimport java.io.*;\nimport\
  \ java.security.*;\nimport javax.crypto.*;\n\n/**\n * 此程序测试 RSA 加密。用法：<br>\n * java\
  \ rsa.RSATest -genkey public private<br>\n * java rsa.RSATest -encrypt plaintext\
  \ encrypted public<br>\n * java rsa.RSATest -decrypt encrypted decrypted private<br>\n\
  \ * @author Cay Horstmann\n * @version 1.02 2018-05-01\n */\npublic class RSATest\n\
  {\n   private static final int KEYSIZE = 512;\n\n   public static void main(String[]\
  \ args) \n         throws IOException, GeneralSecurityException, ClassNotFoundException\n\
  \   {\n      if (args[0].equals(\"-genkey\"))\n      {\n         KeyPairGenerator\
  \ pairgen = KeyPairGenerator.getInstance(\"RSA\");\n         var random = new SecureRandom();\n\
  \         pairgen.initialize(KEYSIZE, random);\n         KeyPair keyPair = pairgen.generateKeyPair();\n\
  \         try (var out = new ObjectOutputStream(new FileOutputStream(args[1])))\n\
  \         {\n            out.writeObject(keyPair.getPublic());\n         }\n   \
  \      try (var out = new ObjectOutputStream(new FileOutputStream(args[2])))\n \
  \        {\n            out.writeObject(keyPair.getPrivate());\n         }\n   \
  \   }\n      else if (args[0].equals(\"-encrypt\"))\n      {\n         KeyGenerator\
  \ keygen = KeyGenerator.getInstance(\"AES\");\n         var random = new SecureRandom();\n\
  \         keygen.init(random);\n         SecretKey key = keygen.generateKey();\n\
  \      }\n   }\n}\n```\n```\n\n在本章中，你简略了解了类加载器，并看到了 Java 库提供的用于身份验证和加密的服务。在此过程中，你可能为这种基于安全管理器和代码签名的经典\
  \ Java 安全架构已成为遥远的记忆而流下了泪水。\n\n在下一章中，我们将深入研究 Swing 和图形编程。\n\n# 第 10 章 图形用户界面编程\n\n\
  Java 出于大多数计算机用户通过图形用户界面（GUI）与桌面应用程序交互的时代。如今，基于浏览器和移动应用程序更为常见，但在某些情况下仍然需要桌面应用程序。此外，许多教师和学生喜欢通过\
  \ GUI 应用学习 Java。在本章和下一章中，我将讨论使用 Swing 工具包进行用户界面编程的基础。第 12 章涵盖了更高级的技术，这些技术对于在服务器上生成图像也。如果你对编写\
  \ GUI 和图形程序感兴趣，可以安全地跳过这些章节。\n\n## 10.1. Java 用户界面工具包的历史\n\n\n\n\n当 Java 1.0 发布时，它包含一个名为抽象窗口工具包（Abstract\
  \ Window Toolkit，AWT）的类库，用于基本的 GUI 编程。基础 AWT 库通过将元素的创建和行为委托给每个目标平台的原生 GUI 工具包（Windows、Linux、Macintosh\
  \ 等）来处理用户界面元素。例如，如果你使用原始的 AWT 在 Java 窗口上放置文本框，实际上是由底层的“代理（peer）”文本框来处理文本输入。理论上，生成的程序可以在这些平台中的任何一个上运行，并具有目标平台的“外观和感觉”。\n\
  \n这种基于代理的方法对于简单应用程序效果良好，但很快人们就发现，要编写一个依赖于原生用户界面元素的高质量可移植图形库是极其困难的。菜单、滚动条和文本字段等用户界面元素在不同平台上的行为可能存在细微差异。因此，很难通过这种方法为用户提供一致且可预测的体验。此外，某些图形环境（如\
  \ X11/Motif）的用户界面组件库没有 Windows 或 Macintosh 那么丰富。这进一步限制了基于“最小公约数”方法的可移植库。结果，使用 AWT\
  \ 构建的 GUI 应用程序看起来并没有原生 Windows 或 Macintosh 应用程序那样漂亮，也不具备这些平台用户所期待的功能。更令人沮丧的是，不同平台的\
  \ AWT 用户界面库中存在*不同*的 Bug。开发者抱怨说，他们必须在每个平台上测试自己的应用程序——这种做法被嘲讽地称为“写一次，到处处处调试（write\
  \ once, debug everywhere）”。\n\n1996 年，Netscape 创建了一个名为 IFC（网络基础类）的 GUI 库，它采用了一种完全不同的方法。用户界面元素（如按钮、菜单等）被*绘制*在空白窗口上。底层窗口系统唯一要求的功能是提供一种显示窗口并在上面进行绘制的方法。因此，Netscape\
  \ 的 IFC 组件无论程序运行在哪个平台，其外观和行为都是相同的。太阳射物系统公司（Sun Microsystems）与 Netscape 合作完善了这种方法，创建了一个代号为“Swing”的用户界面库。Swing\
  \ 作为 Java 1.1 的扩展提供，并成为 Java 1.2 标准库的一部分。\n\nSwing 现在是这种非代理基的 GUI 工具包的官方名称。\n\n\
  Swing 并不是 AWT 的完全替代品——它是构建在 AWT 架构之上的。Swing 只是为你提供了更强大的用户界面组件。每当你编写 Swing 程序时，你都会使用\
  \ AWT 的基础知识——特别是事件处理。从现在起，当我说“Swing”时是指那些“绘制”的用户界面类，当我说“AWT”时是指窗口工具包的底层机制，例如事件处理。\n\
  \nSwing 必须努力地绘制用户界面的每一个像素。当 Swing 首次发布时，用户抱怨它很慢。（如果你在树莓派等硬件上运行 Swing 程序，你仍然能感受到这个问题。）过了一段时间，桌面电脑变得快了，用户又抱怨\
  \ Swing 很丑——事实上，它已经落后于经过动画和华丽效果装饰的原生控件。更糟糕的是，Adobe Flash 被越来越多地被创建具有更炫艳效果的用户界面，这些界面完全不使用原生控件。\n\
  \n2007 年，太阳射物系统公司引入了完全不同的用户界面工具包 JavaFX，作为 Flash 的竞争对手。它运行在 Java VM 上，但有它自己的编程语言，称为\
  \ JavaFX Script。该语言针对编程动画和华丽效果进行了优化。程序员抱怨需要学习一种新语言，他们纷纷避之而去。2011 年，Oracle 发布了新版本\
  \ JavaFX 2.0，它拥有 Java API，不再需要单独的编程语言。从 Java 7 update 6 开始，JavaFX 包含在 JDK 和 JRE\
  \ 中。然而，从 Java 11 开始，这种捆方式停止了。\n\n由于这是一本关于 Java 核心语言和 API 的书，我将专注于使用 Swing 进行用户界面编程。\n\
  \n## 10.2 显示帧\n\n顶层窗口（即不包含在另一个窗口内的窗口）在 Java 中被称为*帧（frame）*。AWT 库有一个名为 `Frame` 的类用于这种顶层窗口。该类的\
  \ Swing 版本被称为 `JFrame`，并继承自 `Frame` 类。`JFrame` 是少数几个不是在画布上绘制的 Swing 组件之一。因此，装饰（按钮、标题栏、图标等）是由用户的窗口系统绘制的，而不是由\
  \ Swing 绘制。\n\n大多数 Swing 组件类以“J”开头：`JButton`、`JFrame` 等。也有像 `Button` 和 `Frame` 这样的类，但它们是\
  \ AWT 组件。如果你不小心漏掉了“J”，你的程序可能仍然编译和运行，但 Swing 和 AWT 组件的混合可能导致视觉和行为上的不一致。\n\n### 10.2.1\
  \ 创建帧\n\n在本节中，我们将回顾处理 Swing `JFrame` 的最常用方法。列表 10.1 列出了一个在屏幕上显示空帧的简单程序，如图 10.1 所示。\n\
  \n![Figure](img/simpleframetest.jpg)图 10.1: 最简单的可见帧列表 10.1 simpleFrame/SimpleFrameTest.java\n\
  \n```java\npackage simpleFrame;\n\nimport java.awt.*;\nimport javax.swing.*;\n\n\
  /**\n * @version 1.34 2018-04-10\n * @author Cay Horstmann\n */\npublic class SimpleFrameTest\n\
  {\n   public static void main(String[] args)\n   {\n      EventQueue.invokeLater(()\
  \ ->\n         {\n            var frame = new SimpleFrame();\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n         });\n   }\n}\n\nclass SimpleFrame\
  \ extends JFrame\n{\n   private static final int DEFAULT_WIDTH = 300;\n   private\
  \ static final int DEFAULT_HEIGHT = 200;\n\n   public SimpleFrame()\n   {\n    \
  \  setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n   }\n}\n```\n\n让我们逐行分析这个程序。\n\nSwing\
  \ 类存放在 `javax.swing` 包中。包名 `javax` 表示这是一个 Java 扩展包，而不是核心包。出于历史原因，Swing 被认为是一个扩展。然而，自\
  \ 1.2 以来，它在每个 Java 实现中都存在。\n\n默认情况下，帧的大小为 0×0 像素，这是相当没用的。我们定义了一个子类 `SimpleFrame`，其构造函数将大小设置为\
  \ 300×200 像素。这是 `SimpleFrame` 和 `JFrame` 之间唯一的区别。\n\n在 `SimpleFrameTest` 类的 `main`\
  \ 方法中，我们构造了一个 `SimpleFrame` 对象并使其可见。\n\n在每个 Swing 程序中我们需要处理两个技术问题。\n\n首先，所有的 Swing\
  \ 组件必须在*事件分发线程（event dispatch thread）*中配置，该线程是将鼠标点击和按键等事件传递给用户界面组件的控制线程。以下代码片段用于在事件分发线程中执行语句：\n\
  \n```\nEventQueue.invokeLater(() ->\n   {\n      statements\n   });\n```\n\n接下来，我们定义当用户关闭应用程序帧时发生什么。对于这个特定的程序，我们希望程序退出。为了选择这种行为，我们使用语句\n\
  \n\n\n\n```\nframe.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n```\n\n在其他具有多个帧的程序中，你不希望程序仅仅因为用户关闭了其中一个帧就退出。默认情况下，当用户关闭帧时，帧会被隐藏，但程序不会终止。（如果程序在*最后一个*帧变得不可见时就终止，那就更好了，但并不是\
  \ Swing 的工作方式。）\n\n仅仅构造一个帧并不会自动显示它。帧在生命周期开始时是不可见的。这为程序员提供了在第一次显示帧之前向帧中添加组件的机会。要显示帧，`main`\
  \ 方法会调用帧的 `setVisible` 方法。\n\n在调度完初始化语句后，`main` 方法就会退出。请注意，退出 `main` 并不终止程序——只是终止主线程。事件分发线程（event\
  \ dispatch thread）会保持程序运行，直到它终止，终止方式可以是关闭帧或调用 `System.exit` 方法。\n\n运行中的程序如图 10.1\
  \ 所示——它是一个非常无聊的顶层窗口。如如图所示，标题栏和周围的装饰（如缩放角）是由操作系统绘制的，而不是由 Swing 库。Swing 库绘制帧内部的所有内容。在程序程序中，它只是用默认背景色填充了帧。\n\
  \n### 10.2.2 帧的属性\n\n`JFrame` 类本身只有几个方法可以更改帧的外观。当然，通过继承的魔力，大多数处理帧的大小和位置的方法都来自 `JFrame`\
  \ 的各种父类。这里是一些是最重要的方法：\n\n*   用于设置帧位置的 `setLocation` 和 `setBounds` 方法。\n*   `setIconImage`\
  \ 方法，它告诉窗口系统在标题栏、任务切换器窗口等等处应该显示哪个图标。\n*   `setTitle` 方法，用于更改标题栏中的文本。\n*   `setResizable`\
  \ 方法，它接收一个 `boolean` 值，用于决定帧是否可以由用户缩放。\n\n图 10.2 展示了 `JFrame` 类的继承层次结构。\n\n![Figure](img/07_05.jpg)图\
  \ 10.2: AWT 和 Swing 中帧与组件类的继承层次结构\n\n正如 API 注释所示，`Component` 类（所有 GUI 对象的祖先）和 `Window`\
  \ 类（`Frame` 类的父类）是你需要查找调整帧大小和形状的方法的地方。例如，`Component` 类中的 `setLocation` 方法是重新定位组件的一种方法。如果你调用\n\
  \n```\nsetLocation(x, y)\n```\n\n左上角将位于在向右偏移 `x` 像素、向下偏移 `y` 像素的位置，其中 (0, 0) 是屏幕的左上角。同样，`Component`\
  \ 类中的 `setBounds` 方法允许你一步到位调整组件的大小并重新定位（特别是 `JFrame`），如下：\n\n```\nsetBounds(x, y,\
  \ width, height)\n```\n\n组件类的许多方法以 getter/setter 对的形式出现，例如 `Frame` 类的以下方法：\n\n```\n\
  public String getTitle()\npublic void setTitle(String title)\n```\n\n这样的 getter/setter\
  \ 对被称为*属性*（property）。一个属性有一个名称和一个类型。名称通过将 `get` 或 `set` 之后的第一个字母更改为小写来获得。例如，`Frame`\
  \ 类有一个名为 `title`、类型为 `String` 的属性。\n\n从概念上讲，`title` 是帧的一个属性。当我们设置该属性时，我们期望标题在用户的屏幕上发生变化。当我们获取该属性时，我们期望得到我们之前设置的值。\n\
  \n`get`/set` 惯例有一个例外：对于 `boolean` 类型的属性，getter 以 `is` 开头。例如，以下两个方法定义了 `resizable`\
  \ 属性：\n\n```\npublic boolean isResizable()\npublic void setResizable(boolean resizable)\n\
  ```\n\n要确定帧的合适大小，首先找到屏幕大小。调用 `Toolkit` 类的静态方法 `getDefaultToolkit` 来获取 `Toolkit`\
  \ 对象。（`Toolkit` 类是各种与原生窗口系统接口的方法的汇聚地）。然后调用 `getScreenSize` 方法，它将屏幕大小作为一个 `Dimension`\
  \ 对象返回。`Dimension` 对象同时在公共实例变量 `width` 和 `height` 中存储宽度和高度。然后你可以使用屏幕大小的合适比例来设置帧的大小。代码如下所示：\n\
  \n```\nToolkit kit = Toolkit.getDefaultToolkit();\nDimension screenSize = kit.getScreenSize();\n\
  int screenWidth = screenSize.width;\nint screenHeight = screenSize.height;\nsetSize(screenWidth\
  \ / 2, screenHeight / 2);\n```\n\n你也可以提供一个帧图标：\n\n```\nImage img = new ImageIcon(\"\
  icon.gif\").getImage();\nsetIconImage(img);\n```\n\n`java.awt.Component` 1.0\n\n\
  *   `boolean isVisible()`\n*   `void setVisible(boolean b)`\n    获取或设置 `visible`\
  \ 属性。组件初始是可见的，顶层组件（如 `JFrame`）除外。\n*   `void setSize(int width, int height)` 1.1\n\
  \    将组件调整为指定的宽度和高度。\n*   `void setLocation(int x, int y)` 1.1\n    将组件移动到新位置。`x`\
  \ 和 `y` 坐标在组件不是顶层时使用容器坐标，如果是顶层（例如 `JFrame`），则使用屏幕坐标。\n*   `void setBounds(int x,\
  \ int y, int width, int height)` 1.1\n    调整组件的大小和位置。\n*   `Dimension getSize()`\
  \ 1.1\n*   `void setSize(Dimension d)` 1.1\n    获取或设置组件的 `size` 属性。\n\n`java.awt.Frame`\
  \ 1.0\n\n*   `boolean isResizable()`\n*   `void setResizable(boolean b)`\n    获取或设置\
  \ `resizable` 属性。当属性设置时，用户可以缩放帧。\n*   `String getTitle()`\n*   `void setTitle(String\
  \ s)`\n    获取或设置 `title` 属性，该属性决定帧标题栏中的文本。\n*   `Image getIconImage()`\n*   `void\
  \ setIconImage(Image image)`\n    获取或设置 `iconImage` 属性。窗口系统可能作为帧装饰的一部分或其他位置显示图标。\n\
  \n`java.awt.Toolkit` 1.0\n\n*   `static Toolkit getDefaultToolkit()`\n    返回此平台的默认工具包。\n\
  *   `Dimension getScreenSize()`\n    获取屏幕的大小。\n\n`javax.swing.ImageIcon` 1.2\n\n\
  *   `ImageIcon(String filename)`\n    构造一个图像存储在文件中图标。\n*   `Image getImage()`\n\
  \    获取此图标的图像。\n\n### 10.3 在组件中显示信息\n\n在本节中，我将向你如何在帧内部显示信息（图 10.3)）。\n\n![Figure](img/nothelloworld.jpg)图\
  \ 10.3: 显示信息的帧\n\n你可以直接将消息字符串绘制到帧上，但这被认为不是良好的编程实践。在 Java 中，帧真正的设计是作为组件的容器，例如菜单栏和其他用户界面元素。你通常在添加到帧的另一个组件上绘制。\n\
  \n`JFrame` 的结构惊人的复杂。看图 10.4，它展示了 `JFrame` 的组成。如你所示，`JFrame` 中叠加了四个面板。根面板（root pane）、叠加面板（layered\
  \ pane）和玻璃面板（glass pane）并不感兴趣；它们用于组织菜单栏和内容面板并实现外观效果。Swing 程序员最关注的部分是*内容面板*（content\
  \ pane）。你添加到帧的任何组件都会自动放置在内容面板中：\n\n```\nComponent c = . . .;\nframe.add(c); // 添加到内容面板\n\
  ```\n\n\n\n\n\n在我们的案例中，我们想在框架上添加单个组件，以便在上面绘制消息。要在组件上绘图，你需要定义一个扩展 `JComponent` 的类，并重写该类中的\
  \ `paintComponent` 方法。\n\n`paintComponent` 方法有一个类型为 `Graphics` 的参数。`Graphics` 对象记录了一组用于绘制图像和文本的设置，例如你设置的字体或当前颜色。Java\
  \ 中所有的绘制操作必须通过 `Graphics` 对象进行。它拥有绘制图案、图像和文本的方法。\n\n以下是创建一个可以在上面绘图的组件的方法：\n\n```\n\
  class MyComponent extends JComponent\n{\n   public void paintComponent(Graphics\
  \ g)\n   {\n      //绘图代码\n   }\n}\n```\n\n每当窗口需要重绘时，无论原因是什么，事件处理器都会通知该组件。这会导致所有组件的\
  \ `paintComponent` 方法被执行。\n\n永远不要自己调用 `paintComponent` 方法。每当应用程序的部分需要重绘时，该方法就会被自动调用，你不应该干预这个自动过程。\n\
  \n什么样的操作会触发这种自动响应？例如，当用户增大窗口大小，或者最小化后再恢复窗口时，会发生绘制。如果用户弹出的另一个窗口覆盖了现有窗口，然后让覆盖的窗口消失，那么被覆盖的窗口现在就损坏了，需要重新绘制。（图形系统不会保存下方的像素。）而且，当然，当窗口第一次显示时，它需要处理指定了如何以及在何处绘制初始元素的代码。\n\
  \n如果你需要强制重绘屏幕，请调用 `repaint` 方法而不是 `paintComponent`。`repaint` 方法会导致所有组件都调用 `paintComponent`，并传入一个配置恰当的\
  \ `Graphics` 对象。\n\n正如你在上面的代码段中看到的，`paintComponent` 方法有一个类型为 `Graphics` 的参数。在 `Graphics`\
  \ 对象上进行的屏幕显示测量是以像素为单位的。(0, 0) 坐标表示你绘图组件表面的左上角。\n\n`Graphics` 类具有各种绘制方法，而显示文本被视为一种特殊的绘制。我们的\
  \ `paintComponent` 方法看起来如下：\n\n```\npublic class NotHelloWorldComponent extends\
  \ JComponent\n{\n   public static final int MESSAGE_X = 75;\n   public static final\
  \ int MESSAGE_Y = 100;\n\n   public void paintComponent(Graphics g)\n   {\n    \
  \  g.drawString(\"Not a Hello, World program\", MESSAGE_X, MESSAGE_Y);\n   }\n \
  \  . . .\n}\n```\n\n最后，组件应该告诉用户它希望有多大。重写 `getPreferredSize` 方法并返回一个带有首选宽度和高度的 `Dimension`\
  \ 类对象：\n\n```\npublic class NotHelloWorldComponent extends JComponent\n{\n   private\
  \ static final int DEFAULT_WIDTH = 300;\n   private static final int DEFAULT_HEIGHT\
  \ = 200;\n   . . .\n   public Dimension getPreferredSize()\n   { \n      return\
  \ new Dimension(DEFAULT_WIDTH, DEFAULT_HEIGHT); \n   }\n}\n```\n\n当你用一个或多个组件填充框架，并且仅仅想使用它们的首选尺寸时，调用\
  \ `pack` 方法而不是 `setSize` 方法：\n\n```\nclass NotHelloWorldFrame extends JFrame\n{\n\
  \   public NotHelloWorldFrame()\n   {\n      add(new NotHelloWorldComponent());\n\
  \      pack();\n   }\n}\n```\n\n列表 10.2 显示了完整的代码。\n\n列表 10.2 `notHelloWorld/NotHelloWorld.java`\n\
  \n```\npackage notHelloWorld;\n\nimport javax.swing.*;\nimport java.awt.*;\n\n/**\n\
  \ * @version 1.34 2018-04-10\n * @author Cay Horstmann\n */\npublic class NotHelloWorld\n\
  {\n   public static void main(String[] args)\n   {\n      EventQueue.invokeLater(()\
  \ ->\n         {\n            var frame = new NotHelloWorldFrame();\n          \
  \  frame.setTitle(\"NotHelloWorld\");\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n         });\n   }\n}\n\n/**\n * 一个包含消息面板的框架。\n\
  \ */\nclass NotHelloWorldFrame extends JFrame\n{\n   public NotHelloWorldFrame()\n\
  \   {\n      add(new NotHelloWorldComponent());\n      pack();\n   }\n}\n\n/**\n\
  \ * 一个显示消息的组件。\n */\nclass NotHelloWorldComponent extends JComponent\n{\n   public\
  \ static final int MESSAGE_X = 75;\n   public static final int MESSAGE_Y = 100;\n\
  \n   private static final int DEFAULT_WIDTH = 300;\n   private static final int\
  \ DEFAULT_HEIGHT = 200;\n\n   public void paintComponent(Graphics g)\n   {\n   \
  \   g.drawString(\"Not a Hello, World program\", MESSAGE_X, MESSAGE_Y);\n   }\n\n\
  \   public Dimension getPreferredSize() \n   {  \n      return new Dimension(DEFAULT_WIDTH,\
  \ DEFAULT_HEIGHT); \n   }\n}\n```\n\n`javax.swing.JFrame` 1.2\n\n* `Component add(Component\
  \ c)`\n    将给定的组件添加到此框架的内容面板中并返回该组件。\n\n`java.awt.Component` 1.0\n\n* `void repaint()`\n\
  \    导致组件“尽快”进行重绘。\n\n* `Dimension getPreferredSize()`\n    是返回此组件首选尺寸的方法。\n\n`javax.swing.JComponent`\
  \ 1.2\n\n* `void paintComponent(Graphics g)`\n    是描述你的组件如何如何绘制的方法。\n\n`java.awt.Window`\
  \ 1.0\n\n* `void pack()`\n    调整此窗口的大小。\n\n### 10.3.1 使用 2D 形状\n\n从 Java 1.0 开始，`Graphics`\
  \ 类具有绘制线、矩形、椭圆等的方法。但那些绘制操作非常有限。我们将改用 2D 库。要使用此库，你需要一个 `Graphics2D` 对象。该类是 `Graphics`\
  \ 类的子类。从 Java 1.2 以来，像 `paintComponent` 这样的方法会自动接收一个 `Graphics2D` 对象。只需使用类型转换，如下：\n\
  \n```\npublic void paintComponent(Graphics g)\n{\n   Graphics2D g2 = (Graphics2D)\
  \ g;\n   . . .\n}\n```\n\nJava 2D 库以面向对象的方式组织几何形状。特别是，有用于表示线、矩形和椭圆的类：\n\n```\nLine2D\n\
  Rectangle2D\nEllipse2D\n```\n\n这些类都实现了 `Shape` 接口。Java 2D 库支持更复杂的形状——弧、二次三次曲线以及通用路径——这些在本章中不讨论。\n\
  \n要绘制形状，你首先创建一个实现 `Shape` 的类的对象，然后调用 `Graphics2D` 类的 `draw` 方法。例如：\n\n```\nRectangle2D\
  \ rect = . . .;\ng2.draw(rect);\n```\n\nJava 2D 库使用浮点坐标而不是整数来表示像素。内部计算使用单精度 `float`\
  \ 量进行。单精度是足够的——毕竟，几何计算的最终目的是在屏幕或打印机上设置像素。只要舍误差保持在一个像素以内，视觉结果就不会受到影响。\n\n然而，操作 `float`\
  \ 值对程序员来说有时并不方便，因为 Java 在将 `double` 值转换为 `float` 值时坚持要求进行强制转换。例如，考虑以下语句：\n\n```\n\
  float f = 1.2; // 错误--可能丢失精度\n```\n\n该语句无法编译，因为常量 `1.2` 的类型是 `double`，编译器对丢失精度感到担心。解决办法是给浮点常量添加\
  \ `F` 后缀：\n\n```\nfloat f = 1.2F; // OK\n```\n\n现在考虑这个语句：\n\n```\nfloat f = r.getWidth();\
  \ // 错误\n```\n\n该语句同样无法编译，原因相同。`getWidth` 方法返回 `double`。这次，解决办法是提供强制转换：\n\n```\n\
  float f = (float) r.getWidth(); // OK\n```\n\n\n\n\n这些后缀和类型转换有点麻烦，因此该 2D 库的设计者决定为每个形状类提供两个版本：一个带有\
  \ `float` 坐标以供节省内存的程序员使用，另一个带有 `double` 坐标以供懒惰的程序员使用。（在书中，我们属于第二个阵营，尽可能都使用 `double`\
  \ 坐标。）\n\n库的设计者选择了一种奇特的机制来封装这些选择。考虑 `Rectangle2D` 类。它是一个抽象类，具有两个具体的子类，这两个子类也是静态嵌套类：\n\
  \n```\nRectangle2D.Float\nRectangle2D.Double\n```\n\n图 10.5 显示了继承关系图。\n\n![Figure](img/07_08.jpg)图\
  \ 10.5：2D 矩形类\n\n最好忽略这两个具体类是静态内部类的事实——这只是为了避免出现如 `FloatRectangle2D` 和 `DoubleRectangle2D`\
  \ 之类的名称技巧。\n\n当你构造一个 `Rectangle2D.Float` 对象时，你提供的坐标是 `float` 数字。对于 `Rectangle2D.Double`\
  \ 对象，你提供的坐标是 `double` 数字。\n\n```\nvar floatRect = new Rectangle2D.Float(10.0F, 25.0F,\
  \ 22.5F, 20.0F);\nvar doubleRect = new Rectangle2D.Double(10.0, 25.0, 22.5, 20.0);\n\
  ```\n\n构造参数表示矩形的左上角、宽度和高度。\n\n`Rectangle2D` 方法具有 `double` 参数类型和返回类型。例如，`getWidth`\
  \ 方法返回一个 `double` 值，即使宽度在 `Rectangle2D.Float` 对象中是以 `float` 存储的。\n\n直接使用 `Double`\
  \ 形状类可以完全避免处理 `float` 值。然而，如果你正在构造数千个形状对象，请考虑使用 `Float` 类来节省内存。\n\n我们刚才针对 `Rectangle2D`\
  \ 类讨论适用于其他形状类。此外，还有一个 `Point2D` 类，其子类为 `Point2D.Float` 和 `Point2D.Double`。以下是创建点对象的方法：\n\
  \n```\nvar p = new Point2D.Double(10, 20);\n```\n\n`Rectangle2D` 和 `Ellipse2D` 类都继承自共同父类\
  \ `RectangularShape`。诚然，椭圆不是矩形，但它们有一个边界矩形（参见 图 10.6）。\n\n![Figure](img/07_09.jpg)图\
  \ 10.6：椭形的边界矩形\n\n`RectangularShape` 类定义了超过 20 个这些形状通用的方法，其中包含 `getWidth`、`getHeight`、`getCenterX`\
  \ 和 `getCenterY` 等实用方法（但遗憾的是，在本书写作，还没有一个返回 `Point2D` 对象作为中心点的 `getCenter` 方法）。\n\
  \n最后，来自 Java 1.0 的几个遗留类被纳入了形状类层次结构中。`Rectangle` 和 `Point` 类存储整数坐标的矩形和点，它们继承了 `Rectangle2D`\
  \ 和 `Point2D` 类。\n\n图 10.7 显示了形状类之间的关系。然而，省略了 `Double` 和 `Float` 子类。遗留类用灰色填充标记。\n\
  \n![Figure](img/07_10.jpg)图 10.7：形状类之间的关系\n\n`Rectangle2D` 和 `Ellipse2D` 对象的构造非常简单。你需要指定：\n\
  \n*   左上角的 `x` 和 `y` 坐标\n*   宽度和高度\n\n对于椭圆，这些指的是边界矩形。例如，\n\n```\nvar e = new Ellipse2D.Double(150,\
  \ 200, 100, 50);\n```\n\n构造了一个由矩形边界的椭圆，该矩形的左上角位于 (150, 200)，宽度为 100，高度为 50。\n\n\
  构造椭圆时，你通常知道中心、宽度高度，但不知道边界矩形的顶点（这些顶点甚至不在椭圆上）。`setFrameFromCenter` 方法使用中心点，但它仍然需要四个顶点之一。因此，你通常会最终如下构造椭圆：\n\
  \n```\nvar ellipse =\n   new Ellipse2D.Double(centerX - width / 2, centerY - height\
  \ / 2, width, height);\n```\n\n构造直线时，你提供起点和终点，可以是 `Point2D` 对象也可以是数字对：\n\n```\n\
  var line = new Line2D.Double(start, end);\n```\n\n或者\n\n```\nvar line = new Line2D.Double(startX,\
  \ startY, endX, endY);\n```\n\n代码清单 10.3 中的程序绘制了一个矩形、包含在矩形内的椭圆、矩形的对角线，以及一个与矩形中心相同的圆。图\
  \ 10.7 显示了结果。\n\n[content]\n```java\nimport java.awt.*;\nimport java.awt.geom.*;\n\
  import javax.swing.*;\nimport java.util.EventQueue;\n\npublic class DrawTest {\n\
  \    private static final int DEFAULT_WIDTH = 400;\n    private static final int\
  \ DEFAULT_HEIGHT = 400;\n\n    public static void main(String[] args) {\n      \
  \  EventQueue.invokeLater(() -> {\n            Frame frame = new DrawFrame();\n\
  \            frame.setTitle(\"DrawTest\");\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.pack();\n            frame.setVisible(true);\n        });\n \
  \   }\n}\n\nclass DrawFrame extends JFrame {\n    public DrawFrame() {\n       \
  \ add(new DrawComponent());\n    }\n}\n\nclass DrawComponent extends JComponent\
  \ {\n    @Override\n    protected void paintComponent(Graphics g) {\n        Graphics2D\
  \ g2 = (Graphics2D) g;\n        double x = 100;\n        double y = 100;\n     \
  \   double width = 200;\n        double height = 150;\n\n        g2.draw(new Rectangle2D.Double(x,\
  \ y, width, height));\n\n        double centerX = 100;\n        double centerY =\
  \ 100;\n        double radius = 150;\n\n        Ellipse2D circle = new Ellipse2D.Double();\n\
  \        circle.setFrameFromCenter(centerX, centerY, radius, radius);\n        g2.draw(circle);\n\
  \n        Line2D line = new Line2D.Double(x, y, x + width, y + height);\n      \
  \  g2.draw(line);\n    }\n\n    @Override\n    public Dimension getPreferredSize()\
  \ {\n        return new Dimension(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n    }\n}\n```\n\
