  \n         try (ResultSet mrs = meta.getTables(null, null, null, new String[] {\
  \ \"TABLE\" }))\n         {\n            while (mrs.next())\n               tableNames.add(mrs.getString(3));\n\
  \         }\n         System.out.println(\"Choose a table\");\n         String selected\
  \ = Choices.choose(console, tableNames);\n         showTable(selected, conn);\n\
  \         executeCommands();         \n         crs.acceptChanges(conn);\n     \
  \ }\n      catch (SQLException e)\n      {\n         for (Throwable t : e)\n   \
  \         t.printStackTrace();\n      }      \n      catch (IOException e)\n   \
  \   {\n         e.printStackTrace();\n      }\n   }      \n\n   /**\n    * 为显示新表准备列列表，并显示第一行。\n\
  \    * @param tableName 要显示的表名\n    * @param conn 数据库连接\n    */\n   public void\
  \ showTable(String tableName, Connection conn) throws SQLException\n   {\n     \
  \ try (Statement stat = conn.createStatement();\n            ResultSet result =\
  \ stat.executeQuery(\"SELECT * FROM \" + tableName))\n      {\n         // 拷贝到缓存行集\n\
  \         RowSetFactory factory = RowSetProvider.newFactory();            \n   \
  \      crs = factory.createCachedRowSet();\n         crs.setTableName(tableName);\n\
  \         crs.populate(result);\n\n         ResultSetMetaData rsmd = result.getMetaData();\n\
  \         for (int i = 1; i <= rsmd.getColumnCount(); i++)\n         {\n       \
  \     columns.add(new Column(rsmd.getColumnLabel(i), \n                  rsmd.getColumnDisplaySize(i),\
  \ \n                  rsmd.getColumnClassName(i)));\n         }\n\n         showNextRow();\n\
  \      }\n   }\n\n   public void executeCommands() throws SQLException\n   {\n \
  \     while (true)\n      {\n         String selection \n            = Choices.choose(console,\
  \ \"Next\", \"Previous\", \"Edit\", \"Delete\", \"Quit\");\n      }\n   }\n   //\
  \ ... 其他方法省略\n}\n```\n\n\n\n返回目录中所有匹配 schema 和表名模式以及类型标准的表描述。（`schema` 描述了一组相关的表和访问权限。`catalog`\
  \ 描述了一组相关的 `schema`。这些概念对于构建大型数据库至关重要。）\n\n`catalog` 和 `schemaPattern` 参数可以为 `\"\
  \"` 以检索那些没有目录或 schema 的表，或者为 `null` 以无论目录或 schema 是如何都返回的表。\n\n`types` 数组包含要包含的表类型名称。常见的类型有\
  \ `TABLE`、`VIEW`、`SYSTEM TABLE`、`GLOBAL TEMPORARY`、`LOCAL TEMPORARY`、`ALIAS` 和 `SYNONYM`。如果\
  \ `types` 为 `null`，则返回所有类型的表。\n\n结果集有五列，所有类型均为 `String`。\n\n| 列 | 名称 | 解释 |\n| ---\
  \ | --- | --- |\n| `1` | `TABLE_CAT` | 表目录（可能为 `null`） |\n| `2` | `TABLE_SCHEM`\
  \ | 表 schema（可能为 `null`） |\n| `3` | `TABLE_NAME` | 表名 |\n| `4` | `TABLE_TYPE` |\
  \ 表类型 |\n| `5` | `REMARKS` | 表的注释 |\n\n*   `int getJDBCMajorVersion()` 1.4\n*  \
  \ `int getJDBCMinorVersion()` 1.4\n返回建立数据库连接的驱动程序的 JDBC 主或次版本号。例如，JDBC 4.3 驱动的主版本号为\
  \ 4，次版本号为 3。\n\n*   `int getMaxConnections()`\n返回允许此数据库的最大并发连接数。\n*   `int getMaxStatements()`\n\
  返回每个数据库连接允许同时打开语句的最大数量，如果无限制或未知，则返回 `0`。\n\njava.sql.ResultSet 1.1\n*   `ResultSetMetaData\
  \ getMetaData()`\n返回与当前 `ResultSet` 列相关的元数据。\n\njava.sql.PreparedStatement 1.1\n\
  *   `ResultSetMetaData getMetaData()` 1.2\n返回与执行此语句时返回的结果集相关的元数据。\n*   `ParameterMetaData\
  \ getMetaData()` 1.4\n返回描述此语句参数的元数据。\n\njava.sql.ResultSetMetaData 1.1\n*   `int\
  \ getColumnCount()`\n返回当前 `ResultSet` 对象中的列数。\n*   `String getColumnName(int column)`\n\
  *   `String getColumnLabel(int column)`\n*   `int getColumnDisplaySize(int column)`\n\
  返回给定从 1 开始索引的列的名称、建议标题和显示大小。\n\njava.sql.ParameterMetaData 1.4\n*   `int getParameterCount()`\n\
  返回准备语句的参数数量。\n*   `int getParameterType(int param)`\n*   `String getParameterTypeName(int\
  \ param)`\n*   `String getParameterClassName(int param)`\n返回给定从 1 开始索引的参数的类型，其形式为\
  \ `java.sql.Types` 中定义的常量、数据库特定的类型名称，或完全限定的 Java 类名。\n*   `int getParameterMode(int\
  \ param)`\n返回给定从 1 开始索引的参数的模式，其为静态常量 `parameterModeIn`、`parameterModeOut`、`parameterModeInOut`\
  \ 或 `parameterModeUnknown` 之一。\n*   `int isNullable(int param)`\n返回给定从 1 开始索引的参数的可空性模式，其为静态常量\
  \ `parameterNoNulls`、`parameterNullable` 或 `parameterNullableUnknown` 之一。\n*   `int\
  \ getPrecision(int param)`\n返回给定从 1 开始索引的参数的最大列大小。对于非数值数据类型，这是字符串或字符串表示的长度，或者是二进制数据的字节数。\n\
  *   `int getScale(int param)`\n返回给定从 1 开始索引的参数的小数点后的位数，对于非数值数据返回 0。\n\n## 5.9. 事务\n\
  \n你可以将一组语句组合成一个 `transaction`（事务）。当一切进展顺利时，事务可以被 `committed`（提交）——或者，如果其中一个语句发生错误，可以进行\
  \ `rolled back`（回滚），就像这些语句从未发布过一样。\n\n将语句分组为事务的主要原因是`数据库完整性`。例如，假设我们想从一个银行账户转账到另一个账户。那么，同时扣除一个账户并增加另一个账户是非常重要的。如果系统在扣除第一个账户之后增加另一个账户之前失败，则需要撤销扣款操作。\n\
  \n如果你将更新语句分组到一个事务中，该事务要么完全成功并可以 `committed`，要么在中间某个地方失败。在这种情况下，你可以执行 `rollback`（回滚），数据库会自动撤销自上次提交事务以来发生的所有更新的影响。\n\
  \n### 5.9.1. 使用 JDBC 编程事务\n\n默认情况下，数据库连接处于 `autocommit mode`（自动提交模式），每个 SQL 语句在执行后立即被提交到数据库。一旦语句被提交，你就无法对其进行回滚。关闭此默认设置以便使用事务：\n\
  \n```\nconn.setAutoCommit(false);\n```\n\n以普通方式创建语句对象：\n\n```\nStatement stat =\
  \ conn.createStatement();\n```\n\n任意多次调用 `executeUpdate`：\n\n```\nstat.executeUpdate(command1);\n\
  stat.executeUpdate(command2);\nstat.executeUpdate(command3);\n. . .\n```\n\n如果所有语句都已无错误执行，调用\
  \ `commit` 方法：\n\n```\nconn.commit();\n```\n\n然而，如果发生错误，调用\n\n```\nconn.rollback();\n\
  ```\n\n然后，自上次提交以来所有的语句都会自动撤销。\n\n### 5.9.2. 保存点\n\n对于某些数据库和驱动程序，你可以通过使用 `save points`（保存点）对回滚过程获得更细粒度的控制。创建保存点标记了一个以后可以返回的点，而无需放弃整个事务。例如，\n\
  \n```\nStatement stat = conn.createStatement(); // 开始事务; rollback() 在这里\nstat.executeUpdate(command1);\n\
  Savepoint svpt = conn.setSavepoint(); // 设置保存点; rollback(svpt) 在这里\nstat.executeUpdate(command2);\n\
  \nif (..) conn.rollback(svpt); // 撤销 command2 的影响\n. . .\nconn.commit();\n```\n\n\
  当你不再需要保存点时，应该释放它：\n\n```\nconn.releaseSavepoint(svpt);\n```\n\n批量更新\n\n假设程序需要执行大量的\
  \ `INSERT` 语句来填充表。你可以通过 `batch update`（批量更新）提高程序的性能。在批量更新中，一组语句被收集并作为批量提交。\n\n使用\
  \ `DatabaseMetaData` 接口的 `supportsBatchUpdates` 方法确定你的数据库是否支持此功能。\n\n批量语句可以是 `INSERT`、`UPDATE`\
  \ 或 `DELETE` 等操作，也可以是数据定义语句如 `CREATE TABLE` 或 `DROP TABLE`。如果你向批量中添加 `SELECT` 语句，将抛出异常。（从概念上说，`SELECT`\
  \ 语句在批量中没有意义，因为它返回结果集而不更新数据库。）\n\n要执行批量，首先以通常方式创建一个 `Statement` 对象：\n\n```\nStatement\
  \ stat = conn.createStatement();\n```\n\n现在，不再调用 `executeUpdate`，而是调用 `addBatch`\
  \ 方法：\n\n```\nString command = \"CREATE TABLE . . .\"\nstat.addBatch(command);\n\
  \nwhile (. .)\n{\n   command = \"INSERT INTO . . . VALUES (\" + . . + \")\";\n \
  \  stat.addBatch(command);\n}\n```\n\n最后，提交整个批量：\n\n```\nint[] counts = stat.executeBatch();\n\
  ```\n\n`executeBatch` 的调用返回所有提交语句的行数数组。\n\n为了批量模式下的正确错误处理，请将批量执行视为单个事务。如果批量在中间失败，你希望回滚到批量开始之前的状态。\n\
  \n首先，关闭自动提交模式，然后收集批量、执行它、提交它，最后恢复原始的自动提交模式。\n\n\n\n\n\n```java\nboolean autoCommit\
  \ = conn.getAutoCommit();\nconn.setAutoCommit(false);\nStatement stat = conn.getStatement();\n\
  . . .\n// keep calling stat.addBatch(. . .);\n. . .\nstat.executeBatch();\nconn.commit();\
  \ conn.setAutoCommit(autoCommit);\n```\n\n### `java.sql.Connection` 1.1\n\n* `boolean\
  \ getAutoCommit()`\n* `void setAutoCommit(boolean b)`\n  获取或设置此连接的自动提交模式 `b`。如果自动提交为\
  \ `true`，则所有语句在执行完成后立即提交。\n* `void commit()`\n  提交自上次提交以来已发布的所有语句。\n* `void rollback()`\n\
  \  撤销自上次提交以来已发布的所有语句的影响。\n* `Savepoint setSavepoint()` 1.4\n* `Savepoint setSavepoint(String\
  \ name)` 1.4\n  设置一个未命名或具命名的保存点。\n* `void rollback(Savepoint svpt)` 1.4\n  回滚到指定的保存点。\n\
  * `void releaseSavepoint(Savepoint svpt)` 1.4\n  释放指定的保存点。\n\n### `java.sql.Savepoint`\
  \ 1.4\n\n* `int getSavepointId()`\n  获取此未命名保存点的 ID，如果这是一个具命名的保存点，则抛出 `SQLException`。\n\
  * `String getSavepointName()`\n  获取此保存点的名称，如果这是一个未命名的保存点，则抛出 `SQLException`。\n\n\
  ### `java.sql.Statement` 1.1\n\n* `void addBatch(String command)` 1.2\n  将命令添加到此语句的当前命令批中。\n\
  * `int[] executeBatch()` 1.2\n* `long[] executeLargeBatch()` 8\n  执行当前批处理中的所有命令。返回数组中的每个值对应于批处理中的一个语句。如果是非负数，则表示行数。如果它是值\
  \ `SUCCESS_NO_INFO`，则语句执行成功但无行数。如果它是 `EXECUTE_FAILED`，则语句执行失败。\n\n### `java.sql.DatabaseMetaData`\
  \ 1.1\n\n* `boolean supportsBatchUpdates()` 1.2\n  如果驱动程序支持批量更新，则返回 `true`。\n\n\
  ### 5.9.4. 高级 SQL 类型\n\n表 5.8](#index_u3.xhtml_ch04table09) 列出了 JDBC 支持的 SQL 数据类型及其在\
  \ Java 编程语言中的对应类型。\n\n表 5.8：SQL 数据类型及其对应的 Java 类型\n\n| SQL 数据类型 | Java 数据类型 |\n\
  | --- | --- |\n| `INTEGER` 或 `INT` | `int` |\n| `SMALLINT` | `short` |\n| `NUMERIC(m,n)`,\
  \ `DECIMAL(m,n)` 或 `DEC(m,n)` | `java.math.BigDecimal` |\n| `FLOAT(n)` | `double`\
  \ |\n| `REAL` | `float` |\n| `DOUBLE` | `double` |\n| `CHARACTER(n)` 或 `CHAR(n)`\
  \ | `String` |\n| `VARCHAR(n)`, `LONG VARCHAR` | `String` |\n| `BOOLEAN` | `boolean`\
  \ |\n| `DATE` | `java.sql.Date` |\n| `TIME` | `java.sql.Time` |\n| `TIMESTAMP` |\
  \ `java.sql.Timestamp` |\n| `BLOB` | `java.sql.Blob` |\n| `CLOB` | `java.sql.Clob`\
  \ |\n| `ARRAY` | `java.sql.Array` |\n| `ROWID` | `java.sql.RowId` |\n| `NCHAR(n)`,\
  \ `NVARCHAR(n)`, `LONG NVARCHAR` | `String` |\n| `NCLOB` | `java.sql.NClob` |\n\
  | `SQLXML` | `java.sql.SQLXML` |\n\nSQL `ARRAY` 是一个值的序列。例如，在 `Student` 表中，你可以有一个名为\
  \ `Scores` 的列，其类型为 `ARRAY OF INTEGER`。`getArray` 方法返回一个类型为 `java.sql.Array` 接口的对象。该接口拥有用于获取数组值的方法。\n\
  \n当你从数据库获取 LOB 或数组时，只有在你请求单个值时，才会从数据库中抓取实际内容。这是一种实用的性能增强，因为数据可能非常庞大。\n\n某些数据库支持\
  \ `ROWID` 值，它描述行的位置，以便可以非常快速地检索。JDBC 4 引入了 `java.sql.RowId` 接口，以及在查询中提供行 ID 并从结果检索它的方法。\n\
  \n*国家字符字符串*（`NCHAR` 及其变体）使用本地字符编码存储字符串，并使用本地排序规则进行排序。JDBC 4 提供了在查询结果在 Java `String`\
  \ 对象与国家字符字符串之间转换的方法。\n\n某些数据库可以存储用户定义的结构化类型。JDBC 3 提供了一种自动将结构化 SQL 类型映射到 Java 对象的机制。\n\
  \n某些数据库为 XML 提供原生存储。JDBC 4 引入了 `SQLXML` 接口，可以在内部 XML 表示与 DOM `Source/Result` 接口以及二进制流之间进行调解。详情见\
  \ `SQLXML` 类的 API 文档。\n\n我们不再讨论这些高级 SQL 类型。你可以在 JDBC API 中找到更多信息。\n\n### 5.10. Web\
  \ 和企业级应用中的连接管理\n\n用户名和登录管理只是需要特别关注的问题之一。另一个问题涉及数据库连接的成本。我们的示例数据库程序使用了两种获取连接的策略。列表\
  \ 5.3](#index_u3.xhtml_ch04list03) 中的 `QueryDB` 程序在程序开始时建立了一个数据库连接并在程序结束时关闭。列表 5.4](#index_u3.xhtml_ch04list04)\
  \ 中的 `ViewDB` 程序在每次需要时打开一个新的连接。\n\n然而，这两种方法都不理想。数据库连接是有限的资源。如果用户离开应用程序一段时间，不应保持连接开启。相反，每次查询都获取并关闭连接的成本很高。解决方案是连接*池化*。这意味着连接不会被物理关闭，而是保留在队列中重用。连接池是一项重要的服务，JDBC\
  \ 规范为实现者提供了支持。但是 JDK 本身并没有提供任何实现，数据库供应商通常也不提供。相反，Web 容器和应用服务器的供应商提供了连接池实现。\n\n在这种环境中，不再涉及\
  \ `DriverManager`。JNDI（Java 目录接口）允许对用户名、密码、数据库名称和 JDBC URL 进行集中管理。通过目录，可以使用以下代码建立数据库连接：\n\
  \n```java\nvar jndiContext = new InitialContext();\nvar source = (DataSource) jndiContext.lookup(\"\
  java:comp/env/jdbc/corejava\");\nConnection conn = source.getConnection();\n```\n\
  \n当然，数据源需要在某处进行配置。如果你编写运行在 Servlet 容器（如 Apache Tomcat）或应用服务器（如 GlassFish）中的数据库程序，请将数据库配置（包括\
  \ JNDI 名称、JDBC URL、用户名和密码）放在配置文件中或在管理 GUI 中设置。在 Java EE 容器中，你甚至不需要编写 JNDI 查找。只需在\
  \ `DataSource` 字段上使用 `@Resource` 注解，数据源引用就会在应用程序运行时被设置：\n\n```java\n@Resource(name=\"\
  jdbc/corejava\")\nprivate DataSource source;\n```\n\n`DataSource` 接口定义在 `javax.sql`\
  \ 标准扩展包中，不仅支持简单的 JDBC 连接，还支持更高级的服务，例如执行多个数据库的分布式事务。\n\n\n\n\n\n使用连接池对程序员来说是完全透明的。通过获取数据源并调用\
  \ `getConnection` 从连接池源中获取连接。当你完成连接的使用后，调用 `close`。这不会关闭物理连接，而是告诉连接池你已经不再使用它。连接池通常还会对预编译语句（prepared\
  \ statements）进行池化。\n\n你现在已经学习了 JDBC 基础知识，并掌握了实现简单数据库所需的足够知识。然而，正如我们在章开头提到的，数据库是复杂的，许多高级主题超出了本入门章节的范围。要了解高级\
  \ JDBC 能力的概览，请参考 *JDBC API Tutorial and Reference* 或 JDBC 规范。\n\n在本章中，你学习了如何在 Java\
  \ 中操作关系型数据库。下一章将介绍日期和时间库。\n\n# 第 6 章 日期和时间 API\n\n时光如箭，我们可以很容易设置一个起点并以秒为单位向前向后计数。那么为什么处理时间这么困难呢？问题出在人类身上。如果我们能互相说：“在\
  \ 1523793600 见，不要迟到！”，那么一切都会变得简单。但我们希望时间与光照和季节相关。这时事情就变得复杂了。Java 1.0 有一个 `Date`\
  \ 类，从回来看，它是幼稚的，在 Java 1.1 引入 `Calendar` 类时，它的大部分方法都被废弃了。它的 API 并不完美，其实例是可变的，而且无法处理闰秒等问题。第三次是幸运的，Java\
  \ 8 中引入的 `java.time` API 修复了过去的缺陷，并在未来一段时间内服务我们。在本章中，你将学习为什么时间计算如此烦人，以及日期和时间 API\
  \ 如何解决这些问题。\n\n## 6.1 时间线\n\n从历史上看，基本的时间单位——秒——源于地球绕自轴的旋转。一整圈有 24 小时或 24 × 60 ×\
  \ 60 = 86400 秒，因此精确定义秒似乎只是天文学测量的问题。的是，地球会轻微晃动，需要更精确的定义。1967 年，根据 133 铯原子的内在属性推导出了与历史定义匹配的新精确秒定义。从那时起，原子钟网络维持着官方时间。\n\
  \n官方时间计时者经常会将绝对时间与地球旋转进行同步。起初，官方秒经过了轻微调整，但从 1972 年开始，偶尔会插入“闰秒”（理论上，偶尔可能删除一个秒，但这种情况还没有发生）。目前有关于再次更改该系统的讨论。显然，闰秒是一个麻烦事，许多计算机系统转而使用“平滑”处理，即在闰秒之前人为地减慢或加速时间，保持每天\
  \ 86,400 秒。这之所以有效是因为计算机的本地时间并不十分精确，而且计算机习惯了与外部时间服务同步。\n\nJava 日期和时间 API 规范要求 Java\
  \ 使用的时间尺度满足：\n\n- 每天有 86,400 秒\n- 每天正午与官方时间完全匹配\n- 在其他地方以精确定义的方式紧密匹配\n\n这使得 Java\
  \ 具有适应未来官方时间变化的灵活性。\n\n在 Java 中，`Instant` 代表时间线上的一个点。一个称为 *epoch*（纪元）的原点被任意设置在 1970\
  \ 年 1 月 1 日午夜，即通过伦敦格林维治皇家天文台的午子线上。这与 UNIX/POSIX 时间使用的约定相同。从该原点开始，时间以每天 86,400 秒为单位向前向后测量，精度到纳秒。`Instant`\
  \ 的值可以追溯到十亿年前（`Instant.MIN`）。这不足以表达宇宙的年龄（约 135 亿年），但对于所有实际目的来说足够了。毕竟，十亿年前地球被冰覆盖，居住着今天植物动物的微型祖先。最大值\
  \ `Instant.MAX` 是 1,000,000,000 年 12 月 31 日。\n\n静态方法调用 `Instant.now()` 提供当前的实例。你可以使用\
  \ `equals` 和 `compareTo` 方法比较两个 instant，因此可以将 instant 作为时间戳。\n\n要找出两个 instant 之间的差异，使用静态方法\
  \ `Duration.between`。例如，这里是测量算法运行时间的方法：\n\n```\nInstant start = Instant.now();\n\
  runAlgorithm();\nInstant end = Instant.now();\nDuration timeElapsed = Duration.between(start,\
  \ end);\nlong millis = timeElapsed.toMillis();\n```\n\n`Duration` 是两个 instant 之间的时间量。你可以通过调用\
  \ `toNanos`、`toMillis`、`toSeconds`、`toMinutes`、`toHours` 或 `toDays` 获取常规单位下的 `Duration`\
  \ 长度。\n\n在 Java 8 中，你必须调用 `getSeconds` 而不是 `toSeconds`。\n\n如果你需要纳秒精度，请注意溢出。`long`\
  \ 值可以存储几乎 300 年的纳秒。如果你的持续时间短于此，只需将其转换为纳秒。你可以使用更长的持续时间——`Duration` 对象在 `long` 中存储秒数，在额外的\
  \ `int` 中存储纳秒数。`Duration` API 有许多方法（显示在本节末尾），用于执行运算。\n\n例如，如果你想检查一个算法是否比另一个快十倍，可以计算：\n\
  \n```\nDuration timeElapsed2 = Duration.between(start2, end2);\nboolean overTenTimesFaster\n\
  \   = timeElapsed.multipliedBy(10).minus(timeElapsed2).isNegative();\n```\n\n这只是展示语法。由于算法不会运行百年，你可以简单地使用：\n\
  \n```\nboolean overTenTimesFaster = timeElapsed.toNanos() * 10 < timeElapsed2.toNanos();\n\
  ```\n\n`Instant` 和 `Duration` 类是不可变的，且所有方法（如 `multipliedBy` 或 `minus`）都返回一个新实例。\n\
  \n\n\n\n\n```java\npackage timeline;\n\n/**\n * @version 1.02 2023-08-27\n * @author\
  \ Cay Horstmann\n */\n\nimport java.time.*;\nimport java.util.*;\nimport java.util.random.*;\n\
  import java.util.stream.*;\n\npublic class Timeline\n{\n   private static RandomGenerator\
  \ generator = RandomGenerator.getDefault();\n\n   public static void main(String[]\
  \ args)\n   {\n      Instant start = Instant.now();\n      runAlgorithm();\n   \
  \   Instant end = Instant.now();\n      Duration timeElapsed = Duration.between(start,\
  \ end);\n      long millis = timeElapsed.toMillis();\n      System.out.printf(\"\
  %d milliseconds\\n\", millis);\n\n      Instant start2 = Instant.now();\n      runAlgorithm2();\n\
  \      Instant end2 = Instant.now();\n      Duration timeElapsed2 = Duration.between(start2,\
  \ end2);\n      System.out.printf(\"%d milliseconds\\n\", timeElapsed2.toMillis());\n\
  \      boolean overTenTimesFaster = timeElapsed.multipliedBy(10)\n         .minus(timeElapsed2).isNegative();\n\
  \      System.out.printf(\"The first algorithm is %smore than ten times faster\"\
  ,\n         overTenTimesFaster ? \"\" : \"not \");\n   }\n\n   public static void\
  \ runAlgorithm()\n   {\n      int size = 10;\n      ArrayList<Integer> list = generator.ints().map(i\
  \ -> i % 100).limit(size)\n         .boxed().collect(Collectors.toCollection(ArrayList::new));\n\
  \      Collections.sort(list);\n      System.out.println(list);\n   }\n\n   public\
  \ static void runAlgorithm2()\n   {\n      int size = 10;\n      List<Integer> list\
  \ = generator.ints().map(i -> i % 100).limit(size)\n         .boxed().collect(Collectors.toCollection(ArrayList::new));\n\
  \      while (!IntStream.range(1, list.size())\n            .allMatch(i -> list.get(i\
  \ - 1).compareTo(list.get(i)) <= 0))\n         Collections.shuffle(list);\n    \
  \  System.out.println(list);\n   }\n}\n```\n\n### java.time.Instant 8\n\n* `static\
  \ Instant now()`\n  从最佳可用系统时钟获取当前时点。\n* `Instant plus(TemporalAmount amountToAdd)`\n\
  * `Instant minus(TemporalAmount amountToSubtract)`\n  返回一个与此 `Instant` 相差给定数量的时点。`Duration`\
  \ 和 `Period` 类（参见 Section 6.2）实现了 `TemporalAmount` 接口。\n* `Instant` (`plus`|`minus`)(`Nanos`|`Millis`|`Seconds``(long\
  \ number)`\n  返回一个与此 `Instant` 相差给定数量纳秒、毫秒或秒的 `Instant`。\n\n### java.time.Duration\
  \ 8\n\n* `static Duration of`(`Nanos`|`Millis`|`Seconds`|`Minutes`|`Hours`|`Days``(long\
  \ number)`\n  返回给定数量时间单位的持续时间。\n* `static Duration between(Temporal startInclusive,\
  \ Temporal endExclusive)`\n  返回给定时间点之间的持续时间。`Temporal` 接口由 `Instant` 类以及 `LocalDate`/`LocalDateTime`/`LocalTime`（参见\
  \ Section 6.4）和 `ZonedDateTime`（参见 Section 6.5）实现。\n* `long toNanos()`\n* `long\
  \ toMillis()`\n* `long toSeconds()` 9\n* `long toMinutes()`\n* `long toHours()`\n\
  * `long toDays()`\n  获取此 `Duration` 中方法名对应的时间单位的数量。\n* `int to`(`Nanos`|`Millis`|`Seconds`|`Minutes`|`Hours`)`Part()`\
  \ 9\n* `long toDaysPart()` 9\n  返回给定时间单位在此 `Duration` 中的部分。例如，在 100 秒的持续时间内，分钟部分为\
  \ `1`，秒部分为 `40`。\n* `Duration plus(TemporalAmount amountToAdd)`\n* `Duration minus(TemporalAmount\
  \ amountToSubtract)`\n  返回一个与此 `Duration` 相差给定数量的持续时间。`Duration` 和 `Period` 类（参见\
  \ Section 6.2）实现了 `TemporalAmount` 接口。\n* `Duration multipliedBy(long multiplicand)`\n\
  * `Duration dividedBy(long divisor)`\n* `Duration negated()`\n  返回通过将此 `Duration`\
  \ 乘以或除以给定数量或 -1 得到的持续时间。\n* `boolean isZero()`\n* `boolean isNegative()`\n  如果此\
  \ `Duration` 为零或负，则返回 `true`。\n* `Duration` (`plus`|`minus`)(`Nanos`|`Millis`|`Seconds`|`Minutes`|`Hours`|`Days``(long\
  \ number)`\n  返回通过加或减给定数量时间单位得到的 `Duration`。\n\n## 6.2. Local Dates（本地日期）\n\n现在让我们从绝对时间转向人类时间。Java\
  \ API 中有两种类的人时间：`本地日期/时间`local date/time）和`时区时间`(zoned time）。本地日期/时间包含日期和/或一天的时间，但没有关联的时区信息。本地日期的示例是\
  \ 1903 年 6 月 14 日（Lambda 表达式发明者 Alonzo Church 的生日）。由于该日期既没有一天的时间也没有时区信息，因此它不对应于精确的时间点。相比之下，1969\
  \ 年 7 月 16 日 09:32:00 EDT（阿波罗 1 号的发射）是一个时区日期/时间，代表时间线上的一个精确时间点。\n\n在许多计算中不需要时区，在某些情况下，时区甚至会成为障碍。假设你安排每周上午\
  \ 10:00 开一次会议。如果你在上一次时区时间的基础上增加 7 天（即 7 × 24 × 60 × 60 秒），并且恰好跨越夏令时边界，那么会议将会早一小时或晚一小时！\n\
  \n出于这个原因，API 设计者建议除非你真的想表示绝对时间实例，否则不要使用时区时间。生日、节假日、日程时间等通常最好表示为本地日期或时间。\n\n`LocalDate`\
  \ 是一个带有年、月、日的日期。要构造 `LocalDate`，可以使用 `now` 或 `of` 静态方法：\n\n```java\nLocalDate today\
  \ = LocalDate.now(); // 今天\nLocalDate alonzoBirthday = LocalDate.of(1903, 6, 14);\
  \ // 1903 年 6 月 14 日\n```\n\n*程序员日*（Programmer's Day）是每年的第 256 天。你可以轻松计算它：\n\n```java\n\
  LocalDate programmersDay = LocalDate.of(2014, 1, 1).plusDays(255); // 9 月 13 日，但在闰年是\
  \ 9 月 12 日\n```\n\n\n\n\n周末实际上出现在周的末尾。这与 `java.util.Calendar` 不同，后者周日的值为 `1`，周六值为\
  \ `7`。\n\n实用的 `datesUntil` 方法会产生 `LocalDate` 对象的流：\n\n```\nLocalDate start = LocalDate.of(2000,\
  \ 1, 1);\nLocalDate endExclusive = LocalDate.now();\nStream<LocalDate> allDays =\
  \ start.datesUntil(endExclusive);\nStream<LocalDate> firstDaysInMonth = start.datesUntil(endExclusive,\
  \ Period.ofMonths(1));\n```\n\n除了 `LocalDate` 之外，还有 `MonthDay`、`YearMonth` 和 `Year`\
  \ 类用于描述部分日期。例如，12 月 25 日（不指定年份）可以表示为 `MonthDay`。\n\nListing 6.2 中的示例程序展示了如何使用 `LocalDate`\
  \ 类。\n\nListing 6.2 `localdates/LocalDates.java`\n\n```java\npackage localdates;\n\
  \n/**\n * @version 1.01 2021-09-06\n * @author Cay Horstmann\n */\nimport java.time.*;\n\
  import java.time.temporal.*;\nimport java.util.stream.*;\n\npublic class LocalDates\n\
  {\n   public static void main(String[] args)\n   {\n      LocalDate today = LocalDate.now();\
  \ // 今日日期\n      System.out.println(\"today: \" + today);\n\n      LocalDate alonzosBirthday\
  \ = LocalDate.of(1903, 6, 14);\n      alonzosBirthday = LocalDate.of(1903, Month.JUNE,\
  \ 14);\n      // 使用 Month 枚举\n      System.out.println(\"alonzosBirthday: \" + alonzosBirthday);\n\
  \n      LocalDate programmersDay = LocalDate.of(2018, 1, 1).plusDays(255);\n   \
  \   // 9 月 13 日，但在闰年将是 9 月 12 日\n      System.out.println(\"programmersDay: \" +\
  \ programmersDay);\n\n      LocalDate independenceDay = LocalDate.of(2018, Month.JULY,\
  \ 4);\n      LocalDate christmas = LocalDate.of(2018, Month.DECEMBER, 25);\n\n \
  \     System.out.println(\"Until christmas: \" + independenceDay.until(christmas));\n\
  \      System.out.println(\"Until christmas: \"\n         + independenceDay.until(christmas,\
  \ ChronoUnit.DAYS));\n\n      System.out.println(LocalDate.of(2016, 1, 31).plusMonths(1));\n\
  \      System.out.println(LocalDate.of(2016, 3, 31).minusMonths(1));\n\n      DayOfWeek\
  \ startOfLastMillennium = LocalDate.of(1900, 1, 1).getDayOfWeek();\n      System.out.println(\"\
  startOfLastMillennium: \" + startOfLastMillennium);\n      System.out.println(startOfLastMillennium.getValue());\n\
  \      System.out.println(DayOfWeek.SATURDAY.plus(3));\n\n      LocalDate start\
  \ = LocalDate.of(2000, 1, 1);\n      LocalDate endExclusive = LocalDate.now();\n\
  \      Stream<LocalDate> firstDaysInMonth = start.datesUntil(endExclusive, Period.ofMonths(1));\n\
  \      System.out.println(\"firstDaysInMonth: \" \n         + firstDaysInMonth.toList());\n\
  \   }\n}\n```\n\n`java.time.LocalDate` 8\n\n*   `static LocalDate now()`\n\n   \
  \ 获取当前的 `LocalDate`。\n\n*   `static LocalDate of(int year, int month, int dayOfMonth)`\n\
  \n*   `static LocalDate of(int year, Month month, int dayOfMonth)`\n\n    产生给定年份、月份（1\
  \ 到 12 之间的整数或 `Month` 枚举值）和日期（1 到 31 之间）的本地日期。\n\n*   `LocalDate` (`plus`|`minus`)(`Days`|`Weeks`|`Months`|`Years``(long\
  \ number)`\n\n    产生通过加或减指定时间单位得到的 `LocalDate`。\n\n*   `LocalDate plus(TemporalAmount\
  \ amountToAdd)`\n\n*   `LocalDate minus(TemporalAmount amountToSubtract)`\n\n  \
  \  返回一个与此 `LocalDate` 相隔给定时间的 `LocalDate`。`Duration` 和 `Period` 类实现了 `TemporalAmount`\
  \ 接口。\n\n*   `LocalDate withDayOfMonth(int dayOfMonth)`\n\n*   `LocalDate withDayOfYear(int\
