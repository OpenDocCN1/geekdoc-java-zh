  \        .POST(publisher)\n            .build();\n\n         HttpResponse<String>\
  \ response\n            = client.send(request, HttpResponse.BodyHandlers.ofString());\n\
  \         return response.body();\n      }\n   }\n}\n```\n\n\n\n\n返回一个由此构建器配置属性的\
  \ `HttpRequest`。\n\n*   `HttpRequest.Builder uri(URI uri)`\n    设置此请求的 URI。\n\n\
  *   `HttpRequest.Builder header(String name, String value)`\n    为此请求设置请求头。\n\n\
  *   `HttpRequest.Builder GET()`\n*   `HttpRequest.Builder DELETE()`\n*   `HttpRequest.Builder\
  \ POST(HttpRequest.BodyPublisher bodyPublisher)`\n*   `HttpRequest.Builder PUT(HttpRequest.BodyPublisher\
  \ bodyPublisher)`\n    设置此请求的请求方法和正文。\n\n`java.net.http.HttpResponse<T>` 11\n\n\
  *   `T body()`\n    返回响应的响应体。\n\n*   `int statusCode()`\n    返回此响应的状态码。\n\n*   `HttpHeaders\
  \ headers()`\n    返回响应标头。\n\n`java.net.http.HttpHeaders` 11\n\n*   `Map<String,List<String>>\
  \ map()`\n    返回这些头部的 `Map`。\n\n*   `Optional<String> firstValue(String name)`\n\
  \    在这些头部中返回给定名称的第一个值（如果存在）。\n\n## 4.5. 简单的 HTTP 服务器\n\n自 Java 6 起，JDK 在 `com.sun.net.httpserver`\
  \ 包中提供了一个简单的 Web 服务器。在 Java 18 中，JDK 增加了一个命令行工具，可以调用基于该包的静态文件服务器。当时，添加了一些便利类，并且\
  \ JEP 408 确认该包是“官方支持”的。该 Web 服务器用于测试、开发和调试。\n\n### 4.5.1. 命令行工具\n\n要启动简单的文件服务器，请使用命令：\n\
  \n```\njwebserver\n```\n\n它在端口 8000 上提供当前目录及其子目录下的所有文件。当提供文件时，会打印一条消息。你可以使用 `-d`\
  \ 和 `-p` 更改目录和端口：\n\n```\njwebserver -d /tmp -p 8189\n```\n\n你还可以使用 `-o` 命令行选项设置消息输出级别。可选\
  \ `info`（默认）、`verbose` 和 `none`。\n\n要杀死服务器，按下 Ctrl+C 或使用 `kill`/`pkill` 命令。\n\n\
  此服务器仅用于提供文件。它类似于 `python -m http.server` 命令。事实上，你也可以通过 `java -m jdk.httpserver`\
  \ 调用简单的 Java 文件服务器。\n\n### 4.5.2. HTTP 服务器 API\n\n你可以通过以下方式编程启动简单的文件服务器程序：\n\n```\n\
  import com.sun.net.httpserver.*;\n. . .\nHttpServer server = SimpleFileServer.createFileServer(new\
  \ InetSocketAddress(port),\n   Path.of(\"/tmp\"), OutputLevel.VERBOSE);\nserver.start();\n\
  ```\n\n现在你可以以各种方式对其进行自定义。或者，如果你不想提供文件，可以获取一个什么都不做的服务器：\n\n```\nHttpServer server\
  \ = HttpServer.create(new InetSocketAddress(port), 0);\n```\n\n第二个参数是服务器套接字的“backlog”（队列）——即队列连接请求的最大数量。如果为零，则使用默认值。\n\
  \n你可以设置处理请求的执行器：\n\n```\nserver.setExecutor(Executors.newVirtualThreadPerTaskExecutor());\n\
  ```\n\n为了让服务器执行任何有趣的操作，你需要创建 `contexts`（上下文）。\n\n上下文包含：\n*   一个 `path`，它必须是请求路径的前缀\n\
  *   一个计算响应的 `handler`（处理器）\n*   一个 `filters`（过滤器）列表，可以转换请求或响应（参见第 4.5.4 节）\n\n如果请求匹配多个上下文，则执行路径最长的那个。例如，这里我们为\
  \ `/static/` 和 `/` 路径安装两个处理器：\n\n```\nserver.createContext(\"/static/\", SimpleFileHandler.createFileHandler(staticRoot));\n\
  server.createContext(\"/\", HttpHandlers.of(301,\n   Headers.of(\"Location\", \"\
  https://horstmann.com/corejava\"), \"\"));\n```\n\n注意，你可以利用现有的处理器，例如简单文件服务器的处理器。\n\
  \n静态方法 `HttpHandlers.of` 生成一个返回固定响应的简单处理器。你传递状态码、响应标头和响应体。\n\n静态方法 `HttpHandlers.handleOrElse`\
  \ 使用 `Predicate<Request>` 在两个处理器之间进行选择：\n\n```\nHttpHandler handler = HttpHanders.handleOrElse(\n\
  \   request -> request.getRequestMethod().equals(\"GET\"),\n   SimpleFileHandler.createFileHandler(staticRoot).\n\
  \   HttpHandlers.of(500, Headers.of(), \"Bad request method\"))\n```\n\n对于更复杂的处理器，你需要提供\
  \ `HttpHandler` 子类的实例。详情请见下一节。\n\n### 4.5.3. 处理器 (Handlers)\n\n处理器在其方法中产生 HTTP 请求的响应：\n\
  \n```\npublic void handle(HttpExchange exchange)\n```\n\n`HttpExchange` 实例同时持有请求和响应数据。处理器必须按照特定顺序使用该对象：\n\
  \n1.  读取请求方法、URI 和标头：\n\n    ```\n    String method = exchange.getRequestMethod();\n\
  \    URI uri = exchange.getRequestURI();\n    Headers requestHeaders = exchange.getRequestHeaders();\n\
  \    String userAgent = requestHeaders.getFirst(\"user-agent\");\n    ```\n\n2.\
  \  读取 `POST`、`PUT` 和 `PATCH` 请求的请求正文：\n\n    ```\n    InputStream in = exchange.getRequestBody();\n\
  \    String body = new String(in.readAll());\n    ```\n\n3.  设置响应标头：\n\n    ```\n\
  \    Headers responseHeaders = exchange.getResponseHeaders();\n    responseHeaders.add(\"\
  Content-type\", \"text/plain\");\n    . . .\n    ```\n\n4.  设置状态码和响应体的长度：\n\n  \
  \  ```\n    exchange.sendHeaders(200, length);\n    ```\n\n5.  如果有响应体，则写入：\n\n \
  \   ```\n    OutputStream responseBody = exchange.getResponseBody();\n    responseBody.write(bytes);\n\
  \    responseBody.close();\n    ```\n\n### 4.5.4. 过滤器 (Filters)\n\n除了处理器外，上下文还可以有一个过滤器链。过滤器可以修改请求或响应，也可以执行额外工作如日志记录或验证。例如，简单的\
  \ Web 服务器使用过滤器来显示请求。\n\n要实现过滤器，请扩展抽象 `Filter` 类并实现两个方法。`description` 方法返回一个描述性字符串。通常，`doFilter`\
  \ 方法如下：\n\n```\npublic void doFilter(HttpExchange exchange, Filter.Chain chain)\n\
  {\n   请求处理\n   chain.doFilter(exchange);\n}\n```\n\n通过调用 `chain.doFilter(exchange)`，调用剩余的过滤器和处理器。\n\
  \n过滤器可以中止过滤和处理——例如，如果验证失败。此时它不应该调用 `chain.doFilter(exchange)`，而是在 `exchange` 对象中产生响应。\n\
  \n你可以这样添加过滤器：\n\n```\ncontext.getFilters().add(filter);\n```\n\n如你所见，HTTP 服务器 API\
  \ 有些粗糙且过时。在你自己的代码中，不要提供返回内部可变数据结构引用的方法，就像 `Context.getFilters` 方法所的那样。\n\n`Filter`\
  \ 类有三个用于过滤器的静态工厂方法：\n\n```\npublic Filter beforeHandler(String description, Consumer<HttpExchange>\
  \ operation)\npublic Filter afterHandler(String description, Consumer<HttpExchange>\
  \ operation)\npublic Filter adaptRequest(String description, UnaryOperator<Request>\
  \ requestOperator)\n```\n\n前两个将 `exchange` 对象（在请求之前或之后）传递给消费者，可以对其进行检查或修改。\n\n\n\
  \n\n第三种方法让向请求添加标头变得更加方便：\n\n```java\nFilter f = Filter.adaptRequest(\"Adding header\"\
  , request -> request.with(headerName,\n   List.of(headerValue)));\n```\n\n当然，与 `Tomcat`\
  \ 或 `Jetty` 等成熟的 Web 服务器相比，这个服务器相当相当基础。但它是 `JDK` 的一部分，对于原型设计和测试已经足够。\n\n列表 4.11\
  \ 中的程序显示了一个简单的服务器，它以纯文本响应回显所有请求数据。启动它并将浏览器指向 `http://localhost:8189`，即可查看你浏览器的请求头。该服务器也对于观察列表\
  \ 4.10 中程序的的表单提交和文件上传请求非常有帮助。\n\n列表 4.11 `httpServer/EchoServer.java`\n\n```java\n\
  package httpServer;\n\nimport java.io.IOException;\nimport java.io.OutputStream;\n\
  import java.net.InetSocketAddress;\nimport java.util.concurrent.Executors;\n\nimport\
  \ com.sun.net.httpserver.*;\n\n/**\n * 此程序实现了一个 HTTP 服务器，监听端口 8189 \n * 或作为参数给出的端口，并回显所有客户端输入。\n\
  \ * @version 1.0 2023-11-01\n * @author Cay Horstmann\n */\npublic class EchoServer\n\
  {\n   public static void main(String[] args) throws IOException\n   {\n      int\
  \ port = args.length >= 1 ? Integer.parseInt(args[0]) : 8189;\n      HttpServer\
  \ server = HttpServer.create(new InetSocketAddress(port), 0);\n      server.setExecutor(Executors.newVirtualThreadPerTaskExecutor());\n\
  \      server.createContext(\"/\", HttpHandlers.of(301, \n            Headers.of(\"\
  Location\", \"https://horstmann.com/corejava\"), \"\"));\n      server.createContext(\"\
  /echo\", (HttpExchange exchange) -> \n            {\n               var headers\
  \ = new StringBuilder();\n               exchange.getRequestHeaders().forEach((k,\
  \ vs) ->\n                  vs.forEach(v -> \n                     headers.append(\"\
  %s: %s\\n\".formatted(k, v))));\n\n               String requestBody = new String(exchange.getRequestBody().readAllBytes());\n\
  \               String response = \"%s %s\\n%s\\n%s\\n\".formatted(\n          \
  \           exchange.getRequestMethod(), exchange.getRequestURI(), \n          \
  \           headers,\n                     requestBody);\n               byte[]\
  \ responseBytes = response.getBytes();\n\n               exchange.sendResponseHeaders(200,\
  \ responseBytes.length);\n               OutputStream responseBody = exchange.getResponseBody();\n\
  \               responseBody.write(responseBytes);\n               responseBody.close();\n\
  \            }\n         );\n      server.start();\n   }\n}\n```\n\n## 4.6. 发送电子邮件\n\
  \n在过去，通过向邮件服务器的 25 端口（SMTP 端口）建立 socket 连接来编写发送电子邮件的程序很简单。简单邮件传输协议（SMTP）描述了电子邮件消息的格式。一旦你连接到服务器，发送一个邮件标头（SMTP\
  \ 格式，很容易生成），然后是邮件正文。\n\n以下是细节：\n\n1.  same 你的主机打开一个 socket。\n   ```java\n   var\
  \ s = new Socket(\"mail.yourserver.com\", 25); // 25 是 SMTP\n   var out = new PrintWriter(s.getOutputStream());\n\
  \   ```\n\n2. 向打印流发送以下信息：\n   ```\n   HELO sending host\n   MAIL FROM: sender e-mail\
  \ address\n   RCPT TO: recipient e-mail address\n   DATA\n   Subject: subject\n\
  \   (空行)\n   mail message (任意行)\n   .\n   QUIT\n   ```\n\nSMTP 规范 (RFC 821) 规定必须以\
  \ `\\r` 后接 `\\n` 结束。\n\n以前 SMTP 服务器通常愿意路由来自任何人的电子邮件。然而，在如今垃圾邮件泛滥的时代，大多数服务器内置了检查，仅接受来自它们信任的用户或\
  \ IP 地址范围的请求。身份验证通常通过安全 socket 连接进行。\n\n手动实现这些身份验证方案将非常麻烦。相反，我们将为你展示如何使用 Jakarta\
  \ Mail API 从 Java 程序发送电子邮件。\n\n要使用 Jakarta Mail，你需要设置一些取决于你邮件服务器的属性。例如，使用 GMail\
  \ 时，使用：\n\n```properties\nmail.transport.protocol=smtps\nmail.smtps.auth=true\n\
  mail.smtps.host=smtp.gmail.com\nmail.smtps.user=accountname@gmail.com\n```\n\n我们的示例程序从属性文件读取这些内容。\n\
  \n出于安全考虑，我们不将密码放入属性文件中，而是提示输入。\n\n对于大多数邮件提供商，你需要生成并使用特殊的应用程序密码，而不是使用你的普通邮件密码。\n\n\
  从属性文件中读取，然后如下获取邮件会话：\n\n```java\nSession mailSession = Session.getDefaultInstance(props);\n\
  ```\n\n创建一个带有所需的发件者、收件者、主题和消息文本的消息：\n\n```java\nvar message = new MimeMessage(mailSession);\n\
  message.setFrom(new InternetAddress(from));\nmessage.addRecipient(RecipientType.TO,\
  \ new InternetAddress(to));\nmessage.setSubject(subject);\nmessage.setText(builder.toString());\n\
  ```\n\n然后发送它：\n\n```java\nTransport tr = mailSession.getTransport();\ntr.connect(null,\
  \ password);\ntr.sendMessage(message, message.getAllRecipients());\ntr.close();\n\
  ```\n\n列表 4.12 中的程序从文本文件读取消息，格式如下：\n\n```\n发件者\n收件者\n主题\n消息文本（任意行）\n```\n\n要运行该程序，从\
  \ [`eclipse-ee4j.github.io/angus-mail`](https://eclipse-ee4j.github.io/angus-mail)\
  \ 下载 Angus Jakarta Mail 实现。你需要四个 JAR 文件：`angus-mail.jar`、`jakarta-mail-api.jar`、`angus-activation.jar`\
  \ 和 `jakarta-activation-api.jar`。将它们放在 `jakarta-mail` 目录下。然后编辑 `mail/mail.properties`\
  \ 文件并运行：\n\n```bash\njavac -classpath .:jakarta-mail/\\* mail/MailTest.java\njava\
  \ -classpath .:jakarta-mail/\\* mail.MailTest path/to/message.txt\n```\n\n在此时，Gmail\
  \ 不检查信息的真实性——你可以提供任何发件人。（下次当你收到来自 `president@whitehouse.gov` 邀请你参加前院正式晚会的电子邮件时，请记住这一点。）\n\
  \n如果你无法确定为什么邮件连接不起工作，调用：\n\n```java\nmailSession.setDebug(true);\n```\n\n并查看消息。此外，Jakarta\
  \ Mail API 在 [`eclipse-ee4j.github.io/angus-mail/FAQ`](https://eclipse-ee4j.github.io/angus-mail/FAQ)\
  \ 中的 FAQ 有一些实用的调试提示。\n\n\n\n\n```java\npackage mail;\n\nimport java.io.*;\nimport\
  \ java.nio.file.*;\nimport java.util.*;\nimport jakarta.mail.*;\nimport jakarta.mail.internet.*;\n\
  import jakarta.mail.internet.MimeMessage.RecipientType;\n\n/**\n * 此程序展示了如何使用 JavaMail\
  \ 发送邮件消息。\n * @author Cay Horstmann\n * @version 1.03 2023-08-16\n */\npublic class\
  \ MailTest\n{\n   public static void main(String[] args) throws MessagingException,\
  \ IOException\n   {\n      var props = new Properties();\n      try (Reader in =\
  \ Files.newBufferedReader(\n            Path.of(\"mail\", \"mail.properties\")))\n\
  \      {\n         props.load(in);\n      }\n      List<String> lines = Files.readAllLines(Path.of(args[0]));\n\
  \n      String from = lines.get(0);\n      String to = lines.get(1);\n      String\
  \ subject = lines.get(2);\n\n      var builder = new StringBuilder();\n      for\
  \ (int i = 3; i < lines.size(); i++)\n      {\n         builder.append(lines.get(i));\n\
  \         builder.append(\"\\n\");\n      }\n\n      Console console = System.console();\n\
  \      var password = new String(console.readPassword(\"Password: \"));\n\n    \
  \  Session mailSession = Session.getDefaultInstance(props);\n      // mailSession.setDebug(true);\n\
  \      var message = new MimeMessage(mailSession);\n      message.setFrom(new InternetAddress(from));\n\
  \      message.addRecipient(RecipientType.TO, new InternetAddress(to));\n      message.setSubject(subject);\n\
  \      message.setText(builder.toString());\n      Transport tr = mailSession.getTransport();\n\
  \      try\n      {\n         tr.connect(null, password);\n         tr.sendMessage(message,\
  \ message.getAllRecipients());\n      }\n      finally\n      {\n         tr.close();\n\
  \      }\n   }\n}\n```\n\n在本章中，你已经了解了如何在 Java 中编写网络客户端和服务器，以及如何从 Web 服务器获取信息。下一章将涵盖数据库连接。你将学习如何使用\
  \ `JDBC` API 在 Java 中操作关系型数据库。\n\n# 第 5 章 ▪ 数据库编程\n\n1996 年，Sun 发布了第一个版本的 `JDBC`\
  \ API。该 API 允许程序员连接到数据库，并使用结构化查询语言（`SQL`）进行查询或更新。（`SQL` 通常读作“sequel”，是关系型数据库访问的行业标准。）从那时起，`JDBC`\
  \ 已成为 Java 库中最常用的 API 之一。\n\n`JDBC` 已经更新了多次。在本书出版时，Java 9 包含的 `JDBC` 4.3 版本是最新的版本。\n\
  \n在本章中，我将解释 `JDBC` 背后的核心思想。我将向你介绍（或让你重温）`SQL` —— 这种语言是用于关系型数据库的行业标准结构化查询语言。本章提供了足够的细节和示例，让你能够开始在常见的编程场景中使用\
  \ `JDBC`。\n\n根据 Oracle 的说法，`JDBC` 是一个注册商标，并不是 Java Database Connectivity（Java 数据库连接）的缩写。它的命名是为了让人联想到\
  \ `ODBC`，这是由微软首创的一种标准数据库 API，后来被并入 `SQL` 标准。\n\n## 5.1. JDBC 的设计\n\n从一开始，Java 技术的开发人员就意识到\
  \ Java 在处理数据库方面的潜力。1995 年，他们开始着扩展标准的 Java 库以处理对数据库的 `SQL` 访问。他们最初希望做的是扩展 Java，使得程序仅使用“纯”Java\
  \ 就能与任何随机数据库通信。但他们很快意识到这是一项无法完成的任务：世界上数据库实在太多了，使用的协议也太多了。此外，尽管数据库厂商都支持 Java 提供一种用于数据库访问的标准网络协议，但只有当\
  \ Java 使用*他们*的网络协议时，他们才支持。\n\n所有数据库厂商和工具厂商都同意，如果 Java 能提供一个用于 `SQL` 访问的纯 Java API，并配合一个允许第三方驱动程序连接到特定数据库的驱动管理器，将会非常有用。数据库厂商可以提供自己的驱动程序来插入驱动管理器中。这样，就有一个简单的机制可以在驱动管理器中注册第三方驱动程序。\n\
  \n这种组织遵循了微软非常成功的 `ODBC` 模型，`ODBC` 为数据库访问提供了一个 C 语言语言接口。`JDBC` 和 `ODBC` 都基于同一个理念：根据\
  \ API 编写的程序与驱动管理器通信，再由驱动管理器与实际数据库通信。\n\n### 5.1.1. 驱动类型\n\nJDBC 规范将驱动程序分为以下类型：\n\
  \n*   `type 1 驱动`：将 `JDBC` 转换为 `ODBC` 并依赖于 `ODBC`。早期的 Java 版本包含这样一个驱动程序，即 `JDBC/ODBC\
  \ 桥接`。然而，该桥接虽然便于测试，但从未用于生产环境。\n*   `type 2 驱动`：部分使用 Java 和原生代码；它与数据库的客户端 API 通信。要使用此类驱动程序，你必须在客户端安装某些特定平台的代码。\n\
  *   `type 3 驱动`：是一个纯 Java 客户端库，使用与数据库无关的协议将数据库请求发送给服务器组件，然后将请求转换为特定数据库的协议。这简化了部署，因为特定平台的代码仅位于服务器上。\n\
  *   `type 4 驱动`：是一个纯 Java 库，直接将 JDBC 请求转换为特定数据库的协议。\n\n`JDBC` 规范可以在此处查看：[`jcp.org/aboutJava/communityprocess/mrel/221/index3.html`](https://jcp.org/aboutJava/communityprocess/mrel/221/index3.html)。\n\
  \n大多数数据库厂商都会为其数据库提供 `type 3` 或 `type 4` 驱动程序。此外，许多第三方公司专门生产具有更好标准性、更多平台支持、性能或在某些情况下比数据库厂商提供的驱动更可靠的驱动程序。\n\
  \n总结，`JDBC` 的最终目标是实现：\n\n*   程序员可以使用 Java 语言编写应用程序，使用标准的 `SQL` 语句（甚至是 `SQL` 的专用扩展）访问数据库，同时遵循\
  \ Java 规范。\n*   数据库厂商和数据库工具厂商可以提供底层驱动程序。这样他们就可以针对特定产品优化驱动。\n\n如果你对 Java 为什么不采用 `ODBC`\
  \ 模型感兴趣，根据 1996 年 JavaOne 大会的解释是：\n\n*   `ODBC` 很难学习。\n*   `ODBC` 具有带有复杂选项的少量命令。Java\
  \ 编程语言的风格是拥有简单直观的方法，但数量要多。\n*   `ODBC` 依赖于 `void*` 指针和其他 C 语言特性，这些特性在 Java 编程语言中并不自然。\n\
  *   基于 `ODBC` 的解决方案在本质上比纯 Java 解决方案更安全且更难部署。\n\n## 5.1.2. JDBC 的典型用途\n\n传统的客户端/服务器模型在客户端拥有丰富的\
  \ GUI，在服务器上拥有数据库（参见图 5.1](#u3.xhtml_ch04fig02）。在这种模型中，`JDBC` 驱动程序部署在客户端。\n\n![Figure](img/fig04-02.jpg)图\
  \ 5.1：传统的客户端/服务器应用程序\n\n\n\n\n然而，如今更常见的是三层模型，其中客户端应用程序不直接调用数据库。相反，它调用服务器上的中间件层，再由中间件层执行数据库查询。三层模型具有几个优势。它将*视觉呈现*（在客户端）与*业务逻辑*（在中间层）以及原始数据（在数据库中）分离来。因此，可以从多个客户端（例如\
  \ Java 桌面应用程序、网页浏览器或移动应用）访问相同的数据和相同的业务规则。\n\n客户端与中间层之间的通信通常通过 HTTP 进行。`JDBC` 管理中间层与后端数据库之间的通信。图\
  \ 5.2 显示了基本架构。\n\n![Figure](img/fig04-03.jpg)图 5.2: 三层应用程序\n\n## 5.2. 结构化查询语言\n\n\
  `JDBC` 让你使用 `SQL` 与数据库通信，`SQL` 基本上是所有关系型数据库服务器的命令语言。像 Microsoft Access 等桌面数据库具有查询和更新的\
  \ GUI，但 `JDBC` 侧重于基于服务器的数据库，如 Oracle、`PostgreSQL`、MySQL、`Microsoft SQL Server` 等。\n\
  \n`JDBC` 包可以被认为仅仅是向数据库通信 `SQL` 语句的 API。我们将在本节中简要介绍 `SQL`。如果你从未见过 `SQL`，你可能会觉得这些材料还不够。如果是如此，请转向该主题的许多学习资源之一；我推荐\
  \ Alan Beaulieu 写的 *Learning SQL*（O’Reilly, 2009）或位于 [`sql.learncodethehardway.org`](https://sql.learncodethehardway.org)\
  \ 的在线书籍 *Learn SQL The Hard Way*。\n\n你可以将数据库看作一组命名的表，其中包含行和列。每一列都有一个*列名*。每行包含一组相关数据。\n\
  \n作为本书的示例数据库，我们使用了一组描述经典计算机科学书籍的数据库表。\n\n### 表 5.1: `Authors` 表\n\n| Author_Id |\
  \ Name | Fname |\n| --- | --- | --- |\n| `ALEX` | `Alexander` | `Christopher` |\n\
  | `BROO` | `Brooks` | `Frederick P.` |\n| `. . .` | `. . .` | `. . .` |\n\n### 表\
  \ 5.2: `Books` 表\n\n| Title | ISBN | Publisher_Id | Price |\n| --- | --- | --- |\
  \ --- |\n| `A Guide to the SQL Standard` | `0-201-96426-0` | `0201` | `47.95` |\n\
  | `A Pattern Language: Towns, Buildings, Construction` | `0-19-501919-9` | `019`\
  \ | `65.00` |\n| `. . .` | `. . .` | `. . .` | `. . .` |\n\n### 表 5.3: `BooksAuthors`\
  \ 表\n\n| ISBN | Author_Id | Seq_No |\n| --- | --- | --- |\n| `0-201-96426-0` | `DATE`\
  \ | `1` |\n| `0-201-96426-0` | `DARW` | `2` |\n| `0-19-501919-9` | `ALEX` | `1`\
  \ |\n| `. . .` | `. . .` | `. . .` |\n\n### 表 5.4: `Publishers` 表\n\n| Publisher_Id\
  \ | Name | URL |\n| --- | --- | --- |\n| `0201` | `Addison-Wesley` | `www.aw-bc.com`\
  \ |\n| `0407` | `John Wiley & Sons` | `www.wiley.com` |\n| `. . .` | `. . .` | `.\
  \ . .` |\n\n图 5.3 显示了 `Books` 表的视图。图 5.4 显示了此表与 `Publishers` 表*连接*（joining）的结果。`Books`\
  \ 表和 `Publishers` 表分别包含了基本架构。\n\n![Figure](img/fig04-03.jpg)图 5.2: 三层应用程序\n\n![Figure](img/fig04-04.jpg)图\
  \ 5.3: 示例表\n\n![Figure](img/fig04-05.jpg)图 5.4: 两个表的连接\n\n\n\n\n```sql\nDELETE FROM\
  \ Books\nWHERE Title LIKE '%C++%'\n```\n\nSQL 内置了函数，用于计算平均值、查找列中的最大值和最小值等，我们在这里不讨论这些。\n\
  \n通常，要向表中插入值，你可以使用 `INSERT` 语句：\n\n```sql\nINSERT INTO Books\nVALUES ('A Guide to\
  \ the SQL Standard', '0-201-96426-0', '0201', 47.95)\n```\n\n对于表中插入的每一行，你都需要一个单独的\
  \ `INSERT` 语句。\n\n当然，在查询、修改和插入数据之前，你必须有一个存储数据的地方。使用 `CREATE TABLE` 语句来创建一个新表。为每一列指定名称和数据类型。例如，\n\
  \n```sql\nCREATE TABLE Books\n(\n   Title VARCHAR(60),\n   ISBN CHAR(13),\n   Publisher_Id\
  \ VARCHAR(6),\n   Price DECIMAL(10,2)\n)\n```\n\n表 5.5 显示了常用的 SQL 数据类型。\n\n表 5.5：常用\
  \ SQL 数据类型\n\n| 数据类型 | 说明 |\n| --- | --- |\n| `INTEGER` 或 `INT` | 通常是 32 位整数 |\n\
  | `SMALLINT` | 通常是 16 位整数 |\n| `NUMERIC(m,n)`, `DECIMAL(m,n)` 或 `DEC(m,n)` | 固定点小数，总共有\
  \ `m` 位有效数字，小数点后有 `n` 位有效数字 |\n| `FLOAT(n)` | 具有 `n` 位二进制精度的浮点数 |\n| `REAL` | 通常是\
  \ 32 位浮点数 |\n| `DOUBLE` | 通常是 64 位浮点数 |\n| `CHARACTER(n)` 或 `CHAR(n)` | 长度为 `n`\
  \ 的固定长度字符串 |\n| `VARCHAR(n)` | 最大长度为 `n` 的变长度字符串 |\n| `BOOLEAN` | 布尔值 |\n| `DATE`\
  \ | 日历日期，取决于实现 |\n| `TIME` | 一天中的时间，取决于实现 |\n| `TIMESTAMP` | 日期和时间，取决于实现 |\n| `BLOB`\
  \ | 二进制大对象 |\n| `CLOB` | 字符大对象 |\n\n在本书中，我们不讨论 `CREATE TABLE` 语句可以使用的额外子句，例如键和约束。\n\
  \n## 5.3 JDBC 配置\n\n当然，你需要一个提供可用 JDBC 驱动程序的数据库程序。有很多优秀的选择，例如 IBM DB2、Microsoft SQL\
  \ Server、MySQL、Oracle 和 PostgreSQL。\n\n你还必须为你的实验使用创建一个数据库。我们假设你将其命名为 `COREJAVA`。创建一个新数据库，或者让你的数据库管理员创建一个具有适当权限的数据库。你需要在数据库中创建、更新和删除表。\n\
  \n这是你第一次接触数据库，我建议你使用 Apache Derby 数据库，你可以在 [`db.apache.org/derby`](https://db.apache.org/derby)\
  \ 获取。\n\n或者，如果你熟悉 Docker，在 docker 镜像中运行 PostgreSQL 非常简单：\n\n```bash\ndocker pull\
  \ postgres\ndocker run -e POSTGRES_PASSWORD=secret -e POSTGRES_DB=COREJAVA -p 5432:5432\
  \ -d postgres\n```\n\n在编写第一个数据库程序之前，你需要收集若干项目。接下来的章节将涵盖这些项目。\n\n### 5.3.1 数据库 URL\n\
  \n连接数据库时，你必须使用各种特定的数据库参数，如主机名、端口号和数据库名称。\n\nJDBC 使用与普通 URL 类似的语法来描述数据源。以下是语法示例：\n\
  \n```\njdbc:derby://localhost:1527/COREJAVA;create=true\njdbc:postgresql:COREJAVA\n\
  ```\n\n这些 JDBC URL 指定了 Derby 数据库和一个名为 `COREJAVA` 的 PostgreSQL 数据库。\n\n通用语法为\n\n\
  ```\njdbc:subprotocol:other stuff\n```\n\n其中子协议（subprotocol）用于选择连接数据库的特定驱动程序。\n\n\
  `other stuff` 的格式取决于所使用的子协议。你需要查找供应商的文档来获取特定格式。\n\n### 5.3.2 驱动 JAR 文件\n\n你需要获取包含你数据库驱动程序的\
  \ JAR 文件。如果你使用 Derby，你需要 `derbyclient.jar` 文件。如果使用其他数据库，你需要找到相应的驱动程序。例如，PostgreSQL\
  \ 驱动可以在 [`jdbc.postgresql.org`](https://jdbc.postgresql.org) 获取。\n\n在运行访问数据库的程序时，将驱动\
  \ JAR 文件包含在类路径（class path）中。（编译时不需要 JAR 文件。）\n\n当你从命令行启动程序时，简单地使用命令\n\n```bash\n\
  java -classpath driverJarPath:. ProgramName\n```\n\n在 Windows 上，使用分号将当前目录（用字符 `.`\
  \ 表示）与驱动 JAR 路径隔开来。\n\n### 5.3.3 启动数据库\n\n在连接数据库之前，需要启动数据库服务器。这取决于数据库。\n\n对于 Derby\
  \ 数据库，请遵循以下步骤：\n\n1. 打开终端并切换到 `derbyclient.jar` 所在的目录。\n2. 运行命令以启动服务器，并检查数据库是否工作正常：\n\
  \n```bash\njava -jar derby.jar start\n```\n\n3. 创建一个 `ij.properties` 文件，其中包含以下内容：\n\
  \n```\ndriver=org.apache.derby.jdbcDriver\nurl=jdbc:derby://localhost:1527/COREJAVA\n\
  create=true\n```\n\n4. 执行 Derby 的交互式工具（称为 `ij`）：\n\n```bash\njava -jar derby.jar\
  \ ij -p ij.properties\n```\n\n现在你可以执行 SQL 命令，例如：\n\n```sql\nCREATE TABLE Greetings\
  \ (Message VARCHAR(20));\nINSERT INTO Greetings VALUES ('Hello, World!');\nSELECT\
  \ * FROM Greetings;\nDROP TABLE Greetings;\n```\n\n注意每个命令必须以分号结束。要退出，输入\n\n```sql\n\
  EXIT;\n```\n\n5. 使用完数据库后，使用命令停止服务器：\n\n```bash\njava -jar derby.jar shutdown\n```\n\
  \n如果你使用其他数据库，你需要查阅文档以了解如何启动和停止数据库，以及如何连接它并执行 SQL 命令。\n\n\n\n\n\n```java\njava -classpath\
  \ driverJarPath:. test.TestDB\n```\n\n调试 JDBC 相关问题的一种方法是启用 JDBC 跟踪。调用 `DriverManager.setLogWriter`\
  \ 方法可以将跟踪消息发送到 `PrintWriter`。跟踪输出包含 JDBC 活动的详细列表。大多数 JDBC 驱动程序实现都提供了额外的跟踪机制。例如，使用\
  \ Derby 时，可以在 JDBC URL 中添加 `traceFile` 选项：`jdbc:derby://localhost:1527/COREJAVA;create=true;traceFile=trace.out`。\n\
  \n从 JDBC 4 开始，驱动程序 JAR 包包含一个名为 `META-INF/services/java.sql.Driver` 的文件，其中包含了驱动程序类名。\n\
  \n在较旧版驱动 JAR 包的极少数情况下，你需要找到供应商使用的 JDBC 驱动程序类名。然后在命令行上设置 `jdbc.drivers` 属性：\n\n```java\n\
  java -Djdbc.drivers=driverClassName ProgramName\n```\n\n列表 5.1 `test/TestDB.java`\n\
  \n```java\npackage test;\n\nimport java.nio.file.*;\nimport java.sql.*;\nimport\
  \ java.io.*;\nimport java.util.*;\n\n/**\n * 此程序测试数据库和 JDBC 驱动程序是否配置正确。\n * @version\
  \ 1.05 2023-08-16\n * @author Cay Horstmann\n */\npublic class TestDB\n{\n   public\
  \ static void main(String[] args) throws IOException\n   {\n      try\n      {\n\
  \         runTest();\n      }\n      catch (SQLException e)\n      {\n         for\
  \ (Throwable t : e)\n            t.printStackTrace();\n      }\n   }\n\n   /**\n\
  \    * 通过创建表、添加值、显示表内容和移除表\n    * 来运行测试。\n    */\n   public static void runTest()\
  \ throws SQLException, IOException\n   {\n      try (Connection conn = getConnection();\n\
  \            Statement stat = conn.createStatement())\n      {\n         stat.executeUpdate(\"\
  CREATE TABLE Greetings (Message VARCHAR(20))\");\n         stat.executeUpdate(\"\
  INSERT INTO Greetings VALUES ('Hello, World!')\");\n\n         try (ResultSet result\
  \ = stat.executeQuery(\"SELECT * FROM Greetings\"))\n         {\n            if\
  \ (result.next())\n               System.out.println(result.getString(1));\n   \
  \      }\n         stat.executeUpdate(\"DROP TABLE Greetings\");\n      }\n   }\n\
  \n   /**\n    * 从文件 database.properties 中指定的属性中获取连接。\n    * @return 数据库连接\n    */\n\
  \   public static Connection getConnection() throws SQLException, IOException\n\
  \   {\n      var props = new Properties();\n      try (Reader in = Files.newBufferedReader(Path.of(\"\
  database.properties\")))\n      {\n         props.load(in);\n      }\n      String\
  \ drivers = props.getProperty(\"jdbc.drivers\");\n      if (drivers != null) System.setProperty(\"\
  jdbc.drivers\", drivers);\n      String url = props.getProperty(\"jdbc.url\");\n\
  \      String username = props.getProperty(\"jdbc.username\");\n      String password\
  \ = props.getProperty(\"jdbc.password\");\n\n      return DriverManager.getConnection(url,\
  \ username, password);\n   }\n}\n```\n\n`java.sql.DriverManager` 1.1\n\n- `static\
  \ Connection getConnection(String url, String user, String password)`\n    建立到给定数据库的连接并返回一个\
  \ `Connection` 对象。\n\n## 5.4 使用 JDBC Statement\n\n在接下来的章节中，你将看到如何使用 JDBC `Statement`\
  \ 执行 SQL 语句、获取结果并处理错误。然后，我们将向你展示一个填充数据库的简单程序。\n\n### 5.4.1 执行 SQL 语句\n\n要执行 SQL\
  \ 语句，首先需要创建一个 `Statement` 对象。要创建语句对象，请使用从 `DriverManager.getConnection` 调用获取的 `Connection`\
  \ 对象。\n\n```java\nStatement stat = conn.createStatement();\n```\n\n接下来，将你想执行的语句放入一个字符串中，例如：\n\
  \n```java\nString command = \"\"\"\nUPDATE Books\n   SET Price = Price - 5.00\n\
  \   WHERE Title NOT LIKE '%Introduction%'\n\"\"\";\n```\n\n然后，调用 `Statement` 接口的\
  \ `executeUpdate` 方法：\n\n```java\nstat.executeUpdate(command);\n```\n\n`executeUpdate`\
  \ 方法返回受 SQL 语句影响的行数，或者对于不返回行数的语句返回 0。例如，上一个示例中对 `executeUpdate` 的调用返回了价格降低 5.00\
  \ 美元的行数。\n\n`executeUpdate` 方法可以执行 `INSERT`、`UPDATE` 和 `DELETE` 等操作，以及如 `CREATE\
  \ TABLE` 和 `DROP TABLE` 等数据定义语句。然而，你需要使用 `executeQuery` 方法来执行 `SELECT` 查询。还有一个通用的\
  \ `execute` 语句可以执行任意的 SQL 语句。它通常仅用于用户交互式提供的查询。\n\n当你执行查询时，你对结果感兴趣。`executeQuery`\
  \ 方法返回一个 `ResultSet` 类型的对象，你可以用它逐行遍历结果。\n\n```java\nResultSet rs = stat.executeQuery(\"\
  SELECT * FROM Books\");\n```\n\n分析结果集的的基本循环看起来所示：\n\n```java\nwhile (rs.next())\n\
  {\n   // 查看结果集的一行\n}\n```\n\n`ResultSet` 接口的迭代协议与 `java.util.Iterator` 接口的协议有细微不同。在这里，迭代器被初始化到第一行*之前*的位置。你必须调用一次\
  \ `next` 方法才能将迭代器移动到第一行。此外，没有 `hasNext` 方法；请持续调用 `next` 直到它返回 `false` 为止。\n\n结果集中行的顺序完全是随机的。除非你特地使用\
  \ `ORDER BY` 子句对结果进行排序，否则你不应该赋予行顺序任何重要意义。\n\n在检查单行时，你可能想要知道字段的内容。大量的访问器方法为你提供了这些信息。\n\
  \n```java\nString isbn = rs.getString(1);\ndouble price = rs.getDouble(\"Price\"\
  );\n```\n\n有针对各种*类型*的访问器，如 `getString` 和 `getDouble`。每个访问器都有两种形式，一个接收数字参数，另一个接收字符串参数。当你提供数字参数时，你引用的是具有该数字的列。例如，`rs.getString(1)`\
  \ 返回当前行第一列的值。\n\n与数组索引不同，数据库列数从 1 开始。\n\n当你提供字符串参数时，你引用的是结果集中具有该名称列。例如，`rs.getDouble(\"\
  Price\")` 返回标签为 `Price` 的列的值。使用数字参数效率略高，但字符串参数会让代码更易读。\n\n当 `get` 方法的类型与列的类型不匹配时，每个方法都会进行合理的类型转换。例如，调用\
  \ `getString(\"Price\")` 将 `Price` 列的浮点值转换为字符串。\n\n`java.sql.Connection` 1.1\n\n\
  - `Statement createStatement()`\n    创建一个用于无参数执行 SQL 查询和更新的 `Statement` 对象。\n- `void\
  \ close()`\n    立即关闭当前连接及其创建的所有 JDBC 资源。\n\n`java.sql.Statement` 1.1\n\n- `ResultSet\
  \ executeQuery(String sqlQuery)`\n    执行字符串中的 SQL 语句并返回用于查看查询结果的 `ResultSet` 对象。\n\
  - `int executeUpdate(String sqlStatement)`\n- `long executeLargeUpdate(String sqlStatement)`\
  \ 8\n    执行字符串指定的 `INSERT`、`UPDATE` 或 `DELETE` 语句。也执行数据定义语言（DDL）语句如 `CREATE TABLE`。返回受影响的行数，对于没有更新计数的语句返回\
  \ 0。\n- `boolean execute(String sqlStatement)`\n    执行指定的 SQL 语句。产生多个结果集和更新计数。如果第一个结果是结果集，则返回\
  \ `true`；如果是更新计数，则返回 `false`。调用 `getResultSet` 或 `getUpdateCount` 获取第一个结果。处理多个结果的详情请参见第\
  \ 5.5.4 节。\n- `ResultSet getResultSet()`\n\n\n\n\n返回前一个查询语句的结果集，如果前一个语句没有结果集，则返回\
  \ `null`。每个执行的语句仅调用一次此方法。\n\n* `int getUpdateCount()`\n* `long getLargeUpdateCount()`\
  \ 8\n\n    返回前一个更新语句影响的行数，如果前一个语句是不带更新计数语句，则返回 `-1`。每个执行的语句仅调用一次此方法。\n\n* `void\
  \ close()`\n\n    关闭此语句对象及其关联的结果集。\n\n* `boolean isClosed()` 6\n\n    如果此语句已关闭，则返回\
  \ `true`。\n\n* `void closeOnCompletion()` 7\n\n    在该语句的所有结果集都关闭后，关闭该语句。\n\n`java.sql.ResultSet`\
  \ 1.1\n\n* `boolean next()`\n\n    使结果集中的当前行向前移动一行。在最后一行之后返回 `false`。请注意，你必须调用此方法才能移动到第一行。\n\
  \n* `Xxx` `getXxx(int columnNumber)`\n* `Xxx` `getXxx(String columnLabel)`\n\n \
  \   (`Xxx` 是一种如 `int`、`double`、`String`、`Date` 等类型）\n\n* `<T> T getObject(int columnIndex,\
  \ Class<T> type)` 7\n* `<T> T getObject(String columnLabel, Class<T> type)` 7\n\
  * `void updateObject(int columnIndex, Object x, SQLType targetSqlType)` 8\n* `void\
  \ updateObject(String columnLabel, Object x, SQLType targetSqlType)` 8\n\n    返回或更新给定列索引或标签的列值，并转换为指定的类型。列标签是\
  \ SQL `AS` 子句中指定的标签，或者在未使用 `AS` 时的列名。\n\n* `int findColumn(String columnName)`\n\
  \n    给出与列名关联的列索引。\n\n* `void close()`\n\n    立即关闭当前的结果集。\n\n* `boolean isClosed()`\
  \ 6\n\n    如果此语句已关闭，则返回 `true`。\n\n### 5.4.2. 管理连接、语句和结果集\n\n每个 `Connection` 对象都可以创建一个或多个\
  \ `Statement` 对象。你可以使用同一个 `Statement` 对象处理多个不相关的命令和查询。然而，一个语句最多有一个打开的结果集。如果你发布了多个需要并发分析结果的查询，你需要多个\
  \ `Statement` 对象。\n\n但请预先，每个连接的语句数量有限制。使用 `DatabaseMetaData` 接口的 `getMaxStatements`\
  \ 方法可以你的 JDBC 驱动支持的并发打开语句的数量。\n\n在实践中，你可能不需要担心多个并发的结果集。如果结果集是相关的，你应该能够发布一个组合查询并分析单个结果。让数据库组合查询比让\
  \ Java 程序遍历多个结果集要高效得多。\n\n在对 `Statement` 对象发布任何新查询或更新之前，请务必完成对任何结果集的处理。之前查询的结果集会自动关闭。\n\
  \n当你完成对 `ResultSet`、`Statement` 或 `Connection` 的使用时，立即调用 `close` 方法是一个好习惯。这些对象使用了大型数据结构，会消耗数据库服务器的有限资源。\n\
  \n`Statement` 对象的 `close` 方法会关闭任何关联的结果集。同样，`Connection` 类的 `close` 方法会关闭该连接的所有语句。\n\
  \n相反，你可以在 `Statement` 上调用 `closeOnCompletion` 方法，它会在其所有结果集都关闭后自动关闭。\n\n如果你的连接是短命的，不必担心关闭语句和结果集。为了确保连接对象不可能保持打开，请使用\
  \ `try`-with-resources 语句：\n\n```\ntry (Connection conn = . . .)\n{   \n   Statement\
  \ stat = conn.createStatement();\n   ResultSet result = stat.executeQuery(queryString);\n\
  \   process query result\n}\n```\n\n### 5.4.3. 分析 SQL 异常\n\n每个 `SQLException` 都有一个\
  \ `SQLException` 对象链，可以通过 `getNextException` 方法获取。这个异常链是除了每个异常都拥有的 `Throwable` 对象“原因”链之外的。（有关\
  \ Java 异常的详情，请参见 第一卷第 7 章）。需要两个嵌套循环才能完全列出所有这些异常。幸运的是，`SQLException` 类已经增强以实现 `Iterable<Throwable>`\
  \ 接口。`iterator()` 方法产生一个 `Iterator<Throwable>`，它可以遍历这两条链：它首先通过第一个 `SQLException`\
  \ 的成因链，然后移动到下一个 `SQLException`，依此类推。你可以简单地使用增强型 `for` 循环：\n\n```\nfor (Throwable\
  \ t : sqlException)\n{\n   对 t 执行某些操作\n}\n```\n\n你可以对 `SQLException` 调用 `getSQLState`\
  \ 和 `getErrorCode` 以进一步分析它。第一个方法产生一个由 X/Open 或 SQL:2003 标准化的字符串。（调用 `DatabaseMetaData`\
  \ 接口的 `getSQLStateType` 方法可以找出你的驱动使用的是哪个标准。）错误代码是厂商特定的。\n\nSQL 异常组织成继承树（所示于 图 5.5）。这允许你以一种独立厂商的方式捕捉特定的错误类型。\n\
  \n![Figure](img/fig04-06.jpg)\n\n\n\n\n出于这个原因，我们将在简单的程序中使用 `JDBC`，该程序读取一个包含 SQL\
  \ 指令的文件（每行一条指令）并执行这些指令。\n\n具体来说，程序从文本文件中读取数据，格式如下：\n\n```\nCREATE TABLE Publishers\
  \ (Publisher_Id VARCHAR(6), Name VARCHAR(30), URL VARCHAR(80));\nINSERT INTO Publishers\
  \ VALUES ('0201', 'Addison-Wesley', 'www.aw-bc.com');\nINSERT INTO Publishers VALUES\
  \ ('0471', 'John Wiley & Sons', 'www.wiley.com');\n. . .\n```\n\nListing 5.2 包含了读取包含\
  \ SQL 语句的文件并执行它们的程序代码。你不需要通读代码；只需使用该程序即可填充你的数据库，并运行本章剩余部分的示例。\n\n确保你的数据库服务器正在运行，并按照以下方式运行程序：\n\
  \n```\njava -classpath driverJarPath:. exec.ExecSQL Books.sql\njava -classpath driverJarPath:.\
  \ exec.ExecSQL Authors.sql\njava -classpath driverJarPath:. exec.ExecSQL Publishers.sql\n\
  java -classpath driverJarPath:. exec.ExecSQL BooksAuthors.sql\n```\n\n在运行程序之前，检查\
  \ `database.properties` 文件是否已为你的环境正确设置（参见第 5.3.4 节）。\n\n数据库可能还有一个直接读取 SQL 文件的工具。例如，使用\
  \ Derby，你可以运行：\n\n```\njava -jar derby/lib/derbyrun.jar ij -p ij.properties Books.sql\n\
  ```\n\n（`ij.properties` 文件在第 5.3.3 节中描述。）\n\n在 `ExecSQL` 命令的数据格式中，我们允许在每行末尾可选分号，因为大多数数据库工具都期望这种格式。\n\
  \n以下步骤简要描述了 `ExecSQL` 程序：\n\n1. 连接到数据库。`getConnection` 方法读取 `database.properties`\
  \ 文件中的属性并将 `jdbc.drivers` 属性添加到系统属性中。驱动管理器使用 `jdbc.drivers` 属性加载相应的数据库驱动程序。`getConnection`\
  \ 方法使用 `jdbc.url`、`jdbc.username` 和 `jdbc.password` 属性打开数据库连接。\n2. 打开带有 SQL 语句的文件。如果没有提供文件名，则提示用户在控制台上输入语句。\n\
  3. 使用通用的 `execute` 方法执行每条语句。如果它返回 `true`，则该语句有一个结果集。为书籍数据库提供的四个 SQL 文件都以 `SELECT\
  \ *` 语句结尾，这样你就可以看到数据已成功插入。\n4. 如果存在结果集，则打印结果。由于这是一个通用的结果集，我们需要使用元数据来确定结果有多少列。要需更多信息，请参见第\
  \ 5.8 节。\n5. 如果发生任何 SQL 异常，打印该异常以及其中可能包含的任何链异常。\n6. 关闭与数据库的连接。\n\nListing 5.2 显示程序的代码。\n\
  \nListing 5.2 `exec/ExecSQL.java`\n\n```\npackage exec;\n\nimport java.io.*;\nimport\
  \ java.nio.file.*;\nimport java.util.*;\nimport java.sql.*;\n\n/**\n * 执行文件中的所有\
  \ SQL 语句。调用此程序的方式 <br>\n * java -classpath driverPath:. ExecSQL commandFile\n *\
  \ \n * @version 1.35 2023-08-16\n * @author Cay Horstmann\n */\nclass ExecSQL\n\
  {\n   public static void main(String[] args) throws IOException\n   {\n      try\
  \ (Scanner in = args.length == 0 ? new Scanner(System.in)\n            : new Scanner(Path.of(args[0]));\n\
  \         Connection conn = getConnection();\n         Statement stat = conn.createStatement())\n\
  \      {\n         while (true)\n         {\n            if (args.length == 0) System.out.println(\"\
  Enter command or EXIT to exit:\");\n\n            if (!in.hasNextLine()) return;\n\
  \n            String line = in.nextLine().strip();\n            if (line.equalsIgnoreCase(\"\
  EXIT\")) return;\n            if (line.endsWith(\";\")) // remove trailing semicolon\n\
  \               line = line.substring(0, line.length() - 1);\n            try\n\
  \            {\n               boolean isResult = stat.execute(line);\n        \
  \       if (isResult)\n               {\n                  try (ResultSet rs = stat.getResultSet())\n\
  \                  {\n                     showResultSet(rs);\n                \
  \  }\n               }\n               else\n               {\n                \
  \  int updateCount = stat.getUpdateCount();\n                  System.out.println(updateCount\
  \ + \" rows updated\");\n               }                   \n            }\n  \
  \          catch (SQLException e)\n            {\n               for (Throwable\
  \ t : e)\n                  t.printStackTrace();\n            }\n         }  \n\
  \      }\n      catch (SQLException e)\n      {\n         for (Throwable t : e)\n\
  \            t.printStackTrace();\n      }\n   }\n\n   /**\n    * 从 database.properties\
  \ 文件指定的属性中获取连接\n    * @return the database connection\n    */\n   public static\
  \ Connection getConnection() throws SQLException, IOException\n   {\n      var props\
  \ = new Properties();\n      try (Reader in = Files.newBufferedReader(\n       \
  \     Path.of(\"database.properties\")))\n      {\n         props.load(in);\n  \
  \    }\n      String drivers = props.getProperty(\"jdbc.drivers\");\n      if (drivers\
  \ != null) System.setProperty(\"jdbc.drivers\", drivers);\n\n      String url =\
  \ props.getProperty(\"jdbc.url\");\n      String username = props.getProperty(\"\
  jdbc.username\");\n      String password = props.getProperty(\"jdbc.password\");\n\
  \n      return DriverManager.getConnection(url, username, password);\n   }\n\n \
  \  /**\n    * 打印结果集\n    * @param result the result set to be printed\n    */\n\
  \   public static void showResultSet(ResultSet result) throws SQLException\n   {\n\
  \      ResultSetMetaData metaData = result.getMetaData();\n      int columnCount\
  \ = metaData.getColumnCount();\n\n      for (int i = 1; i <= columnCount; i++)\n\
  \      {\n         if (i > 1) System.out.print(\", \");\n         System.out.print(metaData.getColumnLabel(i));\n\
  \      }\n      System.out.println();\n\n      while (result.next())\n      {\n\
  \         for (int i = 1; i <= columnCount; i++)\n         {\n            if (i\
  \ > 1) System.out.print(\", \");\n            System.out.print(result.getString(i));\n\
  \         }\n         System.out.println();\n      }\n   }\n}\n```\n\n## 5.5 查询执行\n\
  \n在本节中，我们将编写一个针对 `COREJAVA` 数据库执行查询的程序。为了使此程序运行，你必须按照前面的章节填充 `COREJAVA` 数据库。\n\n\
  在查询数据库时，你可以选择作者和出版社，或者将任一留为 `Any`。\n\n你还可以更改数据库的数据。选择一个出版社并输入金额。该出版社的所有价格将根据你输入的金额进行调整，程序会显示更改了多少行。更改价格后，你可能想运行查询来验证新价格。\n\
  \n### 5.5.1 预编译语句\n\n在程序中，我们使用了一个新功能：*预编译语句*。考虑针对特定出版社所有书籍的 SQL 查询：\n\n```sql\n\
  SELECT Books.Price, Books.Title\nFROM Books, Publishers\nWHERE Books.Publisher_Id\
  \ = Publishers.Publisher_Id\nAND Publishers.Name = 框中的名称\n```\n\n我们不需要在用户每次启动此类查询时都构建一个新的查询语句，而是可以带有一个变量来*准备*查询并多次使用它，每次为变量填充不同的字符串。这种技术可以提高性能。每当数据库执行查询时，它首先会计算一个高效执行的策略。通过准备查询并重用它，你可以确保规划步骤只执行一次。\n\
  \n预编译查询中的每个主机变量都用 `?` 标示。如果存在多个变量，在设置值时必须跟踪 `?` 的位置。\n\n\n\n\n```\nString publisherQuery\
  \ = \"\"\"\nSELECT Books.Price, Books.Title\nFROM Books, Publishers\nWHERE Books.Publisher_Id\
  \ = Publishers.Publisher_Id AND Publishers.Name = ?\n\"\"\";\nPreparedStatement\
  \ pstat = conn.prepareStatement(publisherQuery);\n```\n\n在执行预编译语句之前，你必须使用 `set`\
  \ 方法将主机变量绑定到实际值。与 `ResultSet` 接口的 `get` 方法类似，不同类型有不同的 `set` 方法。在这里，我们想要为出版商名称设置字符串：\n\
  \n```\npstat.setString(1, publisher);\n```\n\n第一个参数是我们要设置的主机变量的位置数字。位置 `1` 表示第一个\
  \ `?`。第二个参数是我们要赋值给主机变量的值。\n\n如果你复用一个已经执行过的预编译查询，所有的主机变量都将保持绑定状态，除非你通过 `set` 方法更改了它们，或者调用了\
  \ `clearParameters` 方法。这意味着你只需要对那些在连续查询之间变化的主机变量调用 `setXxx` 方法。\n\n一旦所有变量都绑定了值，你就可以执行该预编译语句了：\n\
  \n```\nResultSet rs = pstat.executeQuery();\n```\n\n通过拼接字符串来手动构建查询既繁琐又具有潜在危险。你必须担心像引号之类的特殊字符——而且如果你的查询涉及用户输入，你还必须防止注入攻击。因此，当你的查询涉及变量时，请始终使用预编译语句。\n\
  \n价格更新功能是通过 `UPDATE` 语句实现的。注意，我们调用的是 `executeUpdate` 而不是 `executeQuery`，因为 `UPDATE`\
  \ 语句不返回结果集。`executeUpdate` 的返回值是被影响行的计数。\n\n```\nint r = stat.executeUpdate();\n\
  System.out.println(r + \" rows updated\");\n```\n\n`PreparedStatement` 对象在关联的 `Connection`\
  \ 对象关闭后失效。然而，许多数据库会自动缓存预编译语句。如果同一个查询被准备两次，数据库将简单地复用查询策略。因此，不必担心调用 `prepareStatement`\
  \ 的开销。\n\n以下列表简要描述了示例程序的结构：\n\n*   作者和出版商数组通过运行两个查询来填充，这两个查询返回数据库中所有的作者和出版商名称。\n\
  *   涉及作者的查询是复杂的。一本书可以有多个作者，因此 `BooksAuthors` 表存储了作者与书籍之间的对应关系。例如，ISBN 为 `0-201-96426-0`\
  \ 的书籍有两个代码为 `DATE` 和 `DARW` 的作者。`BooksAuthors` 表具有以下行：\n    ```\n    0-201-96426-0,\
  \ DATE, 1\n    0-201-96426-0, DARW, 2\n    ```\n    以指示这一事实。第三列列出了作者的顺序。（我们不能直接使用表中的行位置，因为关系表中没有固定的行排序。）因此，查询必须连接\
  \ `Books`、`BooksAuthors` 和 `Authors` 表，将作者名称与用户选择的名称进行比较。\n    ```\n    SELECT Books.Price,\
  \ Books.Title FROM Books, BooksAuthors, Authors, Publishers\n    WHERE Authors.Author_Id\
  \ = BooksAuthors.Author_Id AND BooksAuthors.ISBN = Books.ISBN\n    AND Books.Publisher_Id\
  \ = Publishers.Publisher_Id AND Authors.Name = ? \n    AND Publishers.Name = ?\n\
  \    ```\n    一些 Java 程序员会避免这种复杂的 SQL 语句。一种出人意料但非常低效的变通方法是编写大量的 Java 代码来遍历多个结果集。但数据库执行查询代码的能力比\
  \ Java 程序要强得多——这是数据库的核心竞争力。一个经验法则是：如果可以用 SQL 完成，就不要在 Java 中完成。\n*   `changePrices`\
  \ 方法执行了一个 `UPDATE` 语句。注意，`UPDATE` 语句的 `WHERE` 子句需要出版商代码，而我们只知道出版商名称。这个问题通过嵌套子查询得到了解决：\n\
  \    ```\n    UPDATE Books\n    SET Price = Price + ?\n    WHERE Books.Publisher_Id\
  \ = (SELECT Publisher_Id FROM Publishers WHERE Name = ?)\n    ```\n\nListing 5.3\
  \ 是完整的程序代码。\n\nListing 5.3 query/QueryTest.java\n\n\n\n\n\n```java\npackage query;\n\
  \nimport java.io.*;\nimport java.nio.file.*;\nimport java.sql.*;\nimport java.util.*;\n\
  \n/**\n * 此程序演示了多个复杂的数据库查询。\n * @version 1.33 2023-08-16\n * @author Cay Horstmann\n\
  \ */\npublic class QueryTest\n{\n   private static final String allQuery = \"SELECT\
  \ Books.Price, Books.Title FROM Books\";\n\n   private static final String authorPublisherQuery\
  \ = \"\"\"\nSELECT Books.Price, Books.Title\nFROM Books, BooksAuthors, Authors,\
  \ Publishers\nWHERE Authors.Author_Id = BooksAuthors.Author_Id\n   AND BooksAuthors.ISBN\
  \ = Books.ISBN\n   AND Books.Publisher_Id = Publishers.Publisher_Id\n   AND Authors.Name\
  \ = ?\n   AND Publishers.Name = ?\n\"\"\";\n\n   private static final String authorQuery\
  \ = \"\"\"\nSELECT Books.Price, Books.Title FROM Books, BooksAuthors, Authors\n\
  WHERE Authors.Author_Id = BooksAuthors.Author_Id\" \n   AND BooksAuthors.ISBN =\
  \ Books.ISBN\"\n   AND Authors.Name = ?\n\"\"\";\n\n   private static final String\
  \ publisherQuery = \"\"\"\nSELECT Books.Price, Books.Title FROM Books, Publishers\n\
  WHERE Books.Publisher_Id = Publishers.Publisher_Id \n   AND Publishers.Name = ?\n\
  \"\"\";\n\n   private static final String priceUpdate = \"\"\"\nUPDATE Books SET\
  \ Price = Price + ? \"\nWHERE Books.Publisher_Id =\n   (SELECT Publisher_Id FROM\
  \ Publishers WHERE Name = ?)\n\"\"\";\n\n   private static Scanner in;\n   private\
  \ static ArrayList<String> authors = new ArrayList<>();\n   private static ArrayList<String>\
  \ publishers = new ArrayList<>();\n\n   public static void main(String[] args) throws\
  \ IOException\n   {\n      try (Connection conn = getConnection())\n      {\n  \
  \       in = new Scanner(System.in);\n         authors.add(\"Any\");\n         publishers.add(\"\
  Any\");\n         try (Statement stat = conn.createStatement())\n         {\n  \
  \          // 填充作者 列表\n            String query = \"SELECT Name FROM Authors\";\n\
  \            try (ResultSet rs = stat.executeQuery(query))\n            {\n    \
  \           while (rs.next())\n                  authors.add(rs.getString(1));\n\
  \            }\n\n            // 填充出版社 列表\n            query = \"SELECT Name FROM\
  \ Publishers\";\n            try (ResultSet rs = stat.executeQuery(query))\n   \
  \         {\n               while (rs.next())\n                  publishers.add(rs.getString(1));\n\
  \            }\n         }\n         boolean done = false;\n         while (!done)\n\
  \         {\n            System.out.print(\"Q)uery C)hange prices E)xit: \");\n\
  \            String input = in.next().toUpperCase();\n            if (input.equals(\"\
  Q\"))\n               executeQuery(conn);\n            else if (input.equals(\"\
  C\"))\n               changePrices(conn);\n            else \n               done\
  \ = true;\n         }\n      }\n      catch (SQLException e)\n      {\n        \
  \ for (Throwable t : e)\n            System.out.println(t.getMessage());\n     \
  \ }\n   }\n\n   /**\n    * 执行选定的查询。\n    * @param conn 数据库连接\n    */\n   private\
  \ static void executeQuery(Connection conn) throws SQLException\n   {\n      String\
  \ author = select(\"Authors:\", authors);\n      String publisher = select(\"Publishers:\"\
  , publishers);\n      PreparedStatement stat;\n      if (!author.equals(\"Any\"\
  ) && !publisher.equals(\"Any\"))\n      {\n         stat = conn.prepareStatement(authorPublisherQuery);\n\
  \         stat.setString(1, author);\n         stat.setString(2, publisher);\n \
  \     }\n      else if (!author.equals(\"Any\") && publisher.equals(\"Any\"))\n\
  \      {\n          stat = conn.prepareStatement(authorQuery);\n          stat.setString(1,\
  \ author);\n      }\n      else if (author.equals(\"Any\") && !publisher.equals(\"\
