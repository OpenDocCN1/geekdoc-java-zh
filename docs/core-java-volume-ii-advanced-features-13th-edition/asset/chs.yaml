  \ summarizingDouble(ToDoubleFunction<? super T> mapper)`\n\n    返回统计信息收集器，从它可以获取应用\
  \ `mapper`于元素的计数、总和、平均值、最大值最小值。\n\n`IntSummaryStatistics` 8\n\n`LongSummaryStatistics`\
  \ 8\n\n`DoubleSummaryStatistics` 8\n\n* `getCount()`\n\n    返回元素的计数。\n\n* `getSum()`\n\
  \n* `getAverage()`\n\n    返回元素的平均值，如果没有元素则返回零。\n\n* `getMax()`\n\n* `getMin()`\n\
  \n    返回最大值的最小值，如果没有元素则返回零。\n\n## 1.9 收集到 Map\n\n假设你有一个 `Stream<Person>` 并想要将元素收集到\
  \ map，以便以后通过 ID 查询。调用 `Collectors.toMap` 并传入产生键和值的函数。例如\n\n```java\npublic record\
  \ Person(int id, String name) {}\n. . .\nMap<Integer, String> idToName = people.collect(\n\
  \   Collectors.toMap(Person::id, Person::name));\n```\n\n在值应该是元素本身的常见情况下，在第二个函数处使用\
  \ `Function.identity()`。\n\n```java\nMap<Integer, Person> idToPerson = people.collect(\n\
  \   Collectors.toMap(Person::id, Function.identity()));\n```\n\n如果有多个元素具有相同的键，则存在冲突，收集器将抛出\
  \ `IllegalStateException`。你可以通过提供第三个函数来覆盖这种行为，该函数根据现有值和新值确定键的值。\n\n在这里，我们构造一个 map，对于\
  \ locale 中的每种语言作为键为在默认语言中的名称（如 `\"German\"`），作为值为其本地化名称（如 `\"Deutsch\"`）。\n\n```java\n\
  Map<String, String> languageNames = Locale.availableLocales().collect(\n   Collectors.toMap(\n\
  \      Locale::getDisplayLanguage,\n      loc -> loc.getDisplayLanguage(loc),\n\
  \      (existingValue, newValue) -> existingValue));\n```\n\n我们不在乎同一种语言出现两次（例如在德国和瑞士的德语），所以保留第一个条目。\n\
  \n现在假设我们要知道某个国家所有的语言。那么我们需要一个 `Map<String, Set<String>>`。例如，对于 `\"Switzerland\"\
  ` 的值是集合 `[French, German, Italian]`。起初，为每种语言存储一个单元素集合。每为某个国家发现新语言时，形成现有集合和新集合的并集。\n\
  \n\n\n\n\n```java\nMap<String, Set<String>> countryLanguageSets = Locale.availableLocales().collect(\n\
  \   Collectors.toMap(\n      Locale::getDisplayCountry,\n      l -> Collections.singleton(l.getDisplayLanguage()),\n\
  \      (a, b) ->\n         { // a 和 b 的并集\n            var union = new HashSet<String>(a);\
  \ \n            union.addAll(b);\n            return union;\n         }));\n```\n\
  \n在下一节中，你将看到获取此映射的简单方法。\n\n如果你想要一个 `TreeMap`，请将构造函数作为第四参数提供。你必须提供一个合并函数。这里是节开头部分的示例之一，现在产生一个\
  \ `TreeMap`：\n\n```java\nMap<Integer, Person> idToPerson = people.collect(\n   Collectors.toMap(\n\
  \      Person::id,\n      Function.identity(),\n      (existingValue, newValue)\
  \ -> { throw new IllegalStateException(); },\n      TreeMap::new));\n```\n\n对于每个\
  \ `toMap` 方法，都有一个相应的 `toConcurrentMap` 方法，它可以产生一个并发映射。在并行集合过程中会使用单个并发映射。当与并行流配合使用时，共享映射比合并映射更高效。注意，元素不再按照流的顺序收集，但通常通常没有区别。\n\
  \n列表 1.5 中的程序提供了将流结果收集到映射的示例。\n\n列表 1.5 collecting/CollectingIntoMaps.java\n\n```java\n\
  package collecting;\n\nimport java.io.*;\nimport java.util.*;\nimport java.util.function.*;\n\
  import java.util.stream.*;\n\n/**\n * @version 1.02 2023-10-19\n * @author Cay Horstmann\n\
  \ */\npublic class CollectingIntoMaps\n{\n\n   public record Person(int id, String\
  \ name) {}\n\n   public static Stream<Person> people()\n   {\n      return Stream.of(new\
  \ Person(1001, \"Peter\"), new Person(1002, \"Paul\"),\n         new Person(1003,\
  \ \"Mary\"));\n   }\n\n   public static void main(String[] args) throws IOException\n\
  \   {\n      Map<Integer, String> idToName = people().collect(\n         Collectors.toMap(Person::id,\
  \ Person::name));\n      System.out.println(\"idToName: \" + idToName);\n\n    \
  \  Map<Integer, Person> idToPerson = people().collect(\n         Collectors.toMap(Person::id,\
  \ Function.identity()));\n      System.out.println(\"idToPerson: \" + idToPerson.getClass().getName()\n\
  \         + idToPerson);\n\n      idToPerson = people().collect(\n         Collectors.toMap(Person::id,\
  \ Function.identity(), \n            (existingValue, newValue) -> { throw new IllegalStateException();\
  \ }, \n            TreeMap::new));\n      System.out.println(\"idToPerson: \" +\
  \ idToPerson.getClass().getName()\n         + idToPerson);\n\n      Map<String,\
  \ String> languageNames = Locale.availableLocales().collect(\n         Collectors.toMap(\n\
  \            Locale::getDisplayLanguage, \n            l -> l.getDisplayLanguage(l),\
  \ \n            (existingValue, newValue) -> existingValue));\n      System.out.println(\"\
  languageNames: \" + languageNames);\n\n      Map<String, Set<String>> countryLanguageSets\
  \ = Locale.availableLocales().collect(\n         Collectors.toMap(\n           \
  \ Locale::getDisplayCountry,\n            l -> Set.of(l.getDisplayLanguage()),\n\
  \            (a, b) ->\n            { // a 和 b 的并集\n               Set<String> union\
  \ = new HashSet<>(a);\n               union.addAll(b);\n               return union;\n\
  \            }));\n      System.out.println(\"countryLanguageSets: \" + countryLanguageSets);\n\
  \   }\n}\n```\n\n`java.util.stream.Collectors` 8\n\n- `static <T,K,U> Collector<T,?,Map<K,U>>\
  \ toMap(Function<? super T,? extends K> keyMapper, Function<? super T,? extends\
  \ U> valueMapper)`\n- `static <T,K,U> Collector<T,?,Map<K,U>> toMap(Function<? super\
  \ T,? extends K> keyMapper, Function<? super T,? extends U> valueMapper, BinaryOperator<U>\
  \ mergeFunction)`\n- `static <T,K,U,M extends Map<K,U>> Collector<T,?,M> toMap(Function<?\
  \ super T,? extends K> keyMapper, Function<? super T,? extends U> valueMapper, BinaryOperator<U>\
  \ mergeFunction, Supplier<M> mapSupplier)`\n- `static <T,K,U> Collector<T,?,Map<K,U>>\
  \ tomodifiableMap(Function<? super T,? extends K> keyMapper, Function<? super T,?\
  \ extends U> valueMapper)`\n- `static <T,K,U> Collector<T,?,Map<K,U>> tomodifiableMap(Function<?\
  \ super T,? extends K> keyMapper, Function<? super T,? extends U> valueMapper, BinaryOperator<U>\
  \ mergeFunction)`\n- `static <T,K,U> Collector<T,?,ConcurrentMap<K,U>> toConcurrentMap(Function<?\
  \ super T,? extends K> keyMapper, Function<? super T,? extends U> valueMapper)`\n\
  - `static <T,K,U> Collector<T,?,ConcurrentMap<K,U>> toConcurrentMap(Function<? super\
  \ T,? extends K> keyMapper, Function<? super T,? extends U> valueMapper, BinaryOperator<U>\
  \ mergeFunction)`\n\n## 1.10 分组与分区\n\n在前面的节中，你已经了如何按国家收集所有语言。但那个过程有点繁琐。你必须为每个映射生成一个集，然后指定如何合并现有值和新值。按相同值进行分组是非常常见的，让我们先形成这个映射：\n\
  \n```java\nMap<String, List<Locale>> countryLocales = Locale.availableLocales().collect(\n\
  \   Collectors.groupingBy(Locale::getCountry));\n```\n\n`Locale::getCountry` 是分类函数。你现在可以通过国家代码查找所有的\
  \ locale，例如\n\n```java\nList<Locale> swissLocales = countryLocales.get(\"CH\");\n\
  // 产生 de_CH, fr_CH, it_CH 以及可能更多\n```\n\n快速回顾一下 locale：每个 locale 有一个语言代码（例如 `en`\
  \ 表示英语）和一个国家代码（例如 `US` 表示美国）。`en_US` 描述美国的英语，`en_IE` 是爱尔兰的英语。某些国家有多个 locale。例如 `ga_IE`\
  \ 是爱尔兰的盖尔克语，如前面的示例所示，JDK 瑞士有三个 locale。\n\n当分类函数是一个谓词函数（即返回 `boolean` 值的函数）时，流元素被分为两个列表：函数返回\
  \ `true` 的元素和它们的补集。在这种情况下，使用 `partitioningBy` 替代 `groupingBy` 更高效。例如，在这里我们将所有 locale\
  \ 分为使用英语的 locale 和其他的：\n\n```java\nMap<Boolean, List<Locale>> englishAndOtherLocales\
  \ = Locale.availableLocales().collect(\n   Collectors.partitioningBy(l -> l.getLanguage().equals(\"\
  en\")));\nList<Locale> englishLocales = englishAndOtherLocales.get(true);\n```\n\
  \n如果你调用 `groupingByConcurrent` 方法，你会得到一个并发映射，当与并行流配合使用时，它是并发填充的。这与 `toConcurrentMap`\
  \ 方法完全相似。\n\n\n\n\n*   `static <T> Collector<T,?,Map<Boolean,List<T>>> partitioningBy(Predicate<?\
  \ super T> predicate)`\n\n产生一个收集器，该收集器产生的 Map Key 为 `true`/`false`，值为符合/不符合谓词元素的列表。\n\
  \n## 1.11. 下游收集器 (Downstream Collectors)\n\n`groupingBy` 方法产生一个值为列表的 Map。如果你想以某种方式处理这些列表，可以提供一个“下游收集器”（downstream\
  \ collector）。例如，如果你想要集合而不是列表，可以使用在前节中见过的 `Collectors.toSet` 收集器：\n\n```\nMap<String,\
  \ Set<Locale>> countryToLocaleSet = Locale.availableLocales().collect(\n   groupingBy(Locale::getCountry,\
  \ toSet()));\n```\n\n在本示例以及本节剩余的示例中，我假设静态导入了 `java.util.stream.Collectors.*`，以便使表达式更易读。\n\
  \n你也可以两次应用 `groupingBy`：\n\n```\nMap<String, Map<String, List<Locale>>> countryAndLanguageToLocale\
  \ =\n   Locale.availableLocales().collect(\n      groupingBy(Locale::getCountry,\n\
  \         groupingBy(Locale::getLanguage)));\n```\n\n然后 `countryAndLanguageToLocale.get(\"\
  IN\").get(\"hi\")` 是印度印语 locale 的列表。（有几种变体。）\n\n还提供了几个收集器用于将收集到的元素还原为数字：\n\n*  \
  \ `counting` 产生被收集元素的计数。例如，\n\n    ```\n    Map<String, Long> countryToLocaleCounts\
  \ = Locale.availableLocales().collect(\n       groupingBy(Locale::getCountry, counting()));\n\
  \    ```\n\n    统计每个国家有多少个 locale。\n\n*   `summing(`Int`|`Long`|`Double)` 和 `averaging(`Int`|`Long`|`Double)`\
  \ 将提供的函数应用于下游元素，并产生函数结果的总和或平均值。例如，\n\n    ```\n    public record City(String name,\
  \ String state, int population) {}\n    . . .\n    Map<String, Integer> stateToCityPopulation\
  \ = cities.collect(\n       groupingBy(City::state, averagingInt(City::population)));\n\
  \    ```\n\n    计算城市流中每个州的人口平均值。\n\n*   `maxBy` 和 `minBy` 接收比较器并产生下游元素的最大值和最小值。例如，\n\
  \n    ```\n    Map<String, Optional<City>> stateToLargestCity = cities.collect(\n\
  \       groupingBy(City::state,\n          maxBy(Comparator.comparing(City::population))));\n\
  \    ```\n\n    产生每个州最大的城市。\n\n`collectingAndThen` 收集器在收集器之后添加了一个最终处理步骤。例如，如果你想知道有多少个不同的结果，可以将它们收集到一个集合中，然后计算大小：\n\
  \n```\nMap<Character, Integer> stringCountsByStartingLetter = strings.collect(\n\
  \   groupingBy(s -> s.charAt(0),\n      collectingAndThen(toSet(), Set::size)));\n\
  ```\n\n`mapping` 收集器则恰相反。它对每个收集到的元素应用函数，并将结果传递给下游收集器。\n\n```\nMap<Character, Set<Integer>>\
  \ stringLengthsByStartingLetter = strings.collect(\n   groupingBy(s -> s.charAt(0),\n\
  \      mapping(String::length, toSet())));\n```\n\n在这里，我们根据第一个字母对字符串进行分组。在每个组内，我们产生长度并将它们收集到集合中。\n\
  \n`mapping` 方法也为前节中的问题提供了一个更好的解决方案——收集一个国家所有语言的集合。\n\n```\nMap<String, Set<String>>\
  \ countryToLanguages = Locale.availableLocales().collect(\n   groupingBy(Locale::getDisplayCountry,\n\
  \      mapping(Locale::getDisplayLanguage,\n         toSet())));\n```\n\n还有一个 `flatMapping`\
  \ 方法，用于返回流的函数。\n\n如果分组或映射函数的返回类型为 `int`、`long` 或 `double`，你可以将元素收集到汇总统计对象中，正如在第\
  \ 1.8 节中讨论的。例如，\n\n```\nMap<String, IntSummaryStatistics> stateToCityPopulationSummary\
  \ = cities.collect(\n   groupingBy(City::state,\n      summarizingInt(City::population)));\n\
  ```\n\n然后你可以从每个组的汇总统计对象获取函数值的总和、计数、平均值、最小值和最大值。\n\n`filtering` 收集器对每个组应用过滤器，例如：\n\
  \n```\nMap<String, Set<City>> largeCitiesByState\n   = cities.collect(\n      groupingBy(City::state,\n\
  \         filtering(c -> c.population() > 500000,\n            toSet())); // 没有大城市的州拥有空集合\n\
  ```\n\n最后，你可以使用 `teeing` 收集器分支到两个下游收集。每当你需要从流中计算多个一个结果时，这都非常有用。假设你想收集城市名称并计算它们的平均人口。你不能读取两次流，但\
  \ `teeing` 允许你执行两次计算。指定两个下游收集器和一个合并结果的函数。\n\n```\nrecord Pair<S, T>(S first, T second)\
  \ {}\nPair<List<String>, Double> result = cities.filter(c -> c.state().equals(\"\
  NV\"))\n   .collect(teeing(\n      mapping(City::name, toList()), // 第一个下游收集器\n\
  \      averagingDouble(City::population), // 第二个下游收集器\n      (list, avg) -> new\
  \ Pair(list,  avg))); // 合并函数\n```\n\n还有三个 `reducing` 方法版本用于应用通用归约，在下一节中描述。\n\n\
  组合收集器是强大的，但可能会导致非常复杂的表达式。最佳用法是结合 `groupingBy` 或 `partitioningBy` 来处理“下游” Map 值。否则，直接在流上应用如\
  \ `map`、`reduce`、`count`、`max` 或 `min` 方法。\n\n\n\n\n```java\npackage collecting;\n\
  \nimport static java.util.stream.Collectors.*;\n\nimport java.io.*;\nimport java.nio.file.*;\n\
  import java.util.*;\nimport java.util.stream.*;\n\n/**\n * @version 1.02 2023-10-19\n\
  \ * @author Cay Horstmann\n */\npublic class DownstreamCollectors\n{\n   public\
  \ record City(String name, String state, int population) {}\n\n   public static\
  \ Stream<City> readCities(String filename) throws IOException\n   {\n      return\
  \ Files.lines(Path.of(filename))\n         .map(l -> l.split(\", \"))\n        \
  \ .map(a -> new City(a[0], a[1], Integer.parseInt(a[2])));\n   }\n\n   public static\
  \ void main(String[] args) throws IOException\n   {\n      Map<String, Set<Locale>>\
  \ countryToLocaleSet \n         = Locale.availableLocales().collect(\n         \
  \   groupingBy(Locale::getCountry, toSet());\n      System.out.println(\"countryToLocaleSet:\
  \ \" + countryToLocaleSet);\n\n      Map<String, Map<String, List<Locale>>> countryAndLanguageToLocale\
  \ \n         = Locale.availableLocales().collect(\n            groupingBy(Locale::getCountry,\n\
  \               groupingBy(Locale::getLanguage)));\n      System.out.println(\"\
  Hindi locales in India: \"\n         + countryAndLanguageToLocale.get(\"IN\").get(\"\
  hi\"));\n\n      Map<String, Long> countryToLocaleCounts \n         = Locale.availableLocales().collect(\n\
  \            groupingBy(Locale::getCountry, counting()));\n      System.out.println(\"\
  countryToLocaleCounts: \" + countryToLocaleCounts);\n\n      Stream<City> cities\
  \ = readCities(\"cities.txt\");\n      Map<String, Integer> stateToCityPopulation\
  \ \n         = cities.collect(\n            groupingBy(City::state, summingInt(City::population)));\n\
  \      System.out.println(\"stateToCityPopulation: \" + stateToCityPopulation);\n\
  \n      cities = readCities(\"cities.txt\");\n      Map<String, Optional<String>>\
  \ stateToLongestCityName = cities\n         .collect(groupingBy(City::state,\n \
  \           mapping(City::name, maxBy(Comparator.comparing(String::length)))));\n\
  \      System.out.println(\"stateToLongestCityName: \" + stateToLongestCityName);\n\
  \n      Map<String, Set<String>> countryToLanguages \n         = Locale.availableLocales().collect(\n\
  \            groupingBy(Locale::getDisplayCountry, \n               mapping(Locale::getDisplayLanguage,\
  \ toSet())));\n      System.out.println(\"countryToLanguages: \" + countryToLanguages);\n\
  \n      cities = readCities(\"cities.txt\");\n      Map<String, IntSummaryStatistics>\
  \ stateToCityPopulationSummary = cities\n         .collect(groupingBy(City::state,\
  \ summarizingInt(City::population)));\n      System.out.println(stateToCityPopulationSummary.get(\"\
  NY\"));\n\n      cities = readCities(\"cities.txt\");\n      Map<String, String>\
  \ stateToCityNames = cities.collect(\n         groupingBy(City::state,\n       \
  \     reducing(\"\", City::name, (s, t) -> s.length() == 0 ? t : s + \", \" + t)));\n\
  \n      cities = readCities(\"cities.txt\");\n      stateToCityNames = cities.collect(groupingBy(City::state,\n\
  \         mapping(City::name, joining(\", \")))));\n      System.out.println(\"\
  stateToCityNames: \" + stateToCityNames);\n\n      cities = readCities(\"cities.txt\"\
  );\n      record Pair<S, T>(S first, T second) {}\n      Pair<List<String>, Double>\
  \ result = cities.filter(c -> c.state().equals(\"NV\"))\n         .collect(teeing(\n\
  \            mapping(City::name, toList()),\n            averagingDouble(City::population),\n\
  \            (names, avg) -> new Pair<>(names, avg)));\n      System.out.println(result);\n\
  \   }\n}\n```\n\n`java.util.stream.Collectors` 8\n\n- `public static <T,K,A,D> Collector<T,?,Map<K,D>>\
  \ groupingBy(Function<? super T,? extends K> classifier, Collector<? super T,A,D>\
  \ downstream)`\n    返回一个产生 `Map` 的收集器。键是通过将 `classifier` 应用于所有收集元素的结果。值是使用下游收集器\
  \ `downstream` 收集相同键的元素的结果。\n\n- `static <T> Collector<T,?,Long> counting()`\n \
  \   返回一个统计元素数量的收集器。\n\n- `static <T> Collector<T,?,Integer> summingInt(ToIntFunction<?\
  \ super T> mapper)`\n\n- `static <T> Collector<T,?,Long> summingLong(ToLongFunction<?\
  \ super T> mapper)`\n\n- `static <T> Collector<T,?,Double> summingDouble(ToDoubleFunction<?\
  \ super T> mapper)`\n    返回一个计算将 `mapper` 应用于收集元素的结果之和的收集器。\n\n- `static <T> Collector<T,?,Optional<T>>\
  \ maxBy(Comparator<? super T> comparator)`\n\n- `static <T> Collector<T,?,Optional<T>>\
  \ minBy(Comparator<? super T> comparator)`\n    返回一个根据 `comparator` 指定顺序计算收集元素最大值或最小值的收集器。\n\
  \n- `static <T,A,R> Collector<T,A,R> collectingAndThen(Collector<? super T,A ?>\
  \ downstream, Function<? super A,? extends R> finisher)`\n    返回一个首先使用 `downstream`\
  \ 进行收集，然后对结果应用 `finisher` 的收集器。\n\n- `static <T,U,A> Collector<T,A,R> mapping(Collector<?\
  \ super U,A ?> downstream, Function<? super T,? extends U> mapper)`\n    返回一个在收集元素之前对每个元素应用\
  \ `mapper` 的收集器。\n\n- `static <T,U,A> Collector<T,A,R> flatMapping(Function<? super\
  \ T,? extends Stream extends U> mapper, Collector<? super U,A ?> downstream)`\n\
  \    返回一个将 `mapper` 应用于每个元素并平坦化结果流的收集器。\n\n- `static <T,R> Collector<T,R> reducing(R\
  \ identity, BinaryOperator<? super T>, Function<? super R,? extends R> finisher)`\n\
  \    返回一个从 `identity` 值开始执行可变归约的收集器。\n\n- `static <T,A,R> Collector<T,A,R> reducing(A,\
  \ BiConsumer<? super T,A> accumulator, Function<? super A,? extends R> finisher)`\n\
  \    返回一个使用可变累加器和完成器执行归约的收集器。\n\n- `static <T,R> Collector<T,R> reducing(BinaryOperator<?\
  \ super T> op)`\n    返回一个使用二元运算符执行归约的收集器。\n\n- `static <T,A,R> Collector<T,A,R>\
  \ reducing(Predicate<? super T> predicate, A identity, BinaryOperator<A super T>\
  \ op)`\n    返回一个对匹配 `predicate` 的元素执行归约的收集器。\n\n\n\n\n首先，你提供一个“累加”函数 `(total, word)\
  \ -> total + word.length()`。该函数会被重复调用，形成累积总和。但当计算被并行化时，会产生多个此类计算，你需要合并它们的结果。为了这一目的，你提供了第二个函数。完整的调用方式为：\n\
  \n```\nint result = words.reduce(0, \n   (total, word) -> total + word.length(),\
  \ \n   (total1, total2) -> total1 + total2);\n```\n\n在实践中，你可能不会频繁使用 `reduce` 方法。通常情况下，将流映射到数字流并使用其其中一个方法来计算和、最大值或最小值会更简单。（我们在第\
  \ 1.13 节中讨论了数字流）。在这个特定的示例中，你可以调用 `words.mapToInt(String::length).sum()`，这既简单又高效，因为它不涉及装箱（boxing）。\n\
  \n有些时候 `reduce` 并不够通用。例如，假设你想将结果收集到一个 `BitSet` 中。如果集合是并行化的，你不能将元素直接放入单个 `BitSet`\
  \ 中，因为 `BitSet` 对象不是线程安全的。出于这个原因，你不能使用 `reduce`。每个段都需要从自己的空集合开始，而 `reduce` 只允许你提供一个标识值（identity\
  \ value）。相反，使用 `collect` 的三参数形式。你提供三个函数：\n\n1. 一个 `supplier`，用于构造目标对象的新实例。\n2. 一个\
  \ `accumulator`，用于将元素添加到目标。\n3. 一个 `combiner`，用于将两个目标对象合并为一个。\n\n以下是 `collect` 方法处理位集的工作原理：\n\
  \n```\nBitSet result = stream.collect(BitSet::new, BitSet::set, BitSet::or);\n```\n\
  \njava.util.Stream 8\n\n*   `Optional<T> reduce(BinaryOperator<T> accumulator)`\n\
  *   `T reduce(T identity, BinaryOperator<T> accumulator)`\n*   `<U> U reduce(U identity,\
  \ BiFunction<U,? super T,U> accumulator, BinaryOperator<U> combiner)`\n    使用给定的\
  \ `accumulator` 函数形成流元素的累积总和。如果提供了 `identity`，则它是第一个要累加的值。如果提供了 `combiner`，则可以用于合并单独累加的段的总和。\n\
  *   `<R> R collect(Supplier<R> supplier, BiConsumer<R,? super T> accumulator, BiConsumer<R,R>\
  \ combiner)`\n    将元素收集到类型为 `R` 的结果中。在每个段上，调用 `supplier` 来提供初始结果，调用 `accumulator`\
  \ 以可变方式将元素添加到其中，并调用 `combiner` 来合并两个结果。\n\n## 1.13 原始类型流\n\n到为止，我们一直在 `Stream<Integer>`\
  \ 中收集整数，尽管将每个整数封装成包装对象显然是低效的。其他原始类型也是如此——`double`、`float`、`long`、`short`、`char`、`byte`\
  \ 和 `boolean`。流库有专门的类型 `IntStream`、`LongStream` 和 `DoubleStream`，它们直接存储原始类型值，而不使用包装类。如果你想存储\
  \ `short`、`char`、`byte` 和 `boolean`，请使用 `IntStream`；对于 `float`，请使用 `DoubleStream`。\n\
  \n要创建一个 `IntStream`，调用 `IntStream.of` 和 `Arrays.stream` 方法：\n\n```\nIntStream stream\
  \ = IntStream.of(1, 1, 2, 3, 5);\nstream = Arrays.stream(values, from, to); // values\
  \ 是一个 int[] 数组\n```\n\n与对象流一样，你也可以使用静态方法 `generate` 和 `iterate`。此外，`IntStream` 和\
  \ `LongStream` 具有静态方法 `range` 和 `rangeClosed`，它们可以生成步长为一的整数范围：\n\n```\nIntStream\
  \ zeroToNinetyNine = IntStream.range(0, 100); // 排除上界\nIntStream zeroToHundred =\
  \ IntStream.rangeClosed(0, 100); // 包含上界\n```\n\n`CharSequence` 接口拥有 `codePoints`\
  \ 和 `chars` 方法，可以产生字符的 Unicode 码或 UTF-16 编码中代码单元的 `IntStream`。（细节参见第 2 节。）\n\n```\n\
  String greeting = \"Ciao \U0001F1EE\U0001F1F9\";\nIntStream codes = greeting.codePoints();\n\
  \   // 具有值 67, 105, 97, 111, 32, 127470, 127481 的流\n```\n\n`RandomGenerator` 接口拥有\
  \ `ints`、`longs` 和 `doubles` 方法，返回随机数的原始类型流。\n\n```\nIntStream randomIntegers =\
  \ RandomGenerator.getDefault().ints(); \n```\n\n当你有一个对象流时，可以使用 `mapToInt`、`mapToLong`\
  \ 或 `mapToDouble` 方法将其转换为原始类型流。例如，如果你有一个字符串流并想以整数形式处理它们的长度，你可以在 `IntStream` 中处理：\n\
  \n```\nStream<String> words = . . .;\nIntStream lengths = words.mapToInt(String::length);\n\
  ```\n\n将对象流转换为原始类型流，使用 `boxed` 方法：\n\n```\nStream<Integer> integers = IntStream.range(0,\
  \ 100).boxed();\n```\n\n通常情况下，`IntStream` 上的方法与对象流上的方法类似。以下是显著区别：\n\n*   `IntStream`\
  \ 返回原始数组。\n*   方法返回 `OptionalInt`、`OptionalLong` 或 `OptionalDouble` 而不是 `Optional`。\n\
  *   `summaryStatistics` 方法产生 `IntSummaryStatistics` 对象，它可以同时报告和、计数、平均值、最大值最小值。\n\
  \n1.7 节程序示例：\n\n```java\npackage streams;\n\nimport java.io.*;\nimport java.nio.file.*;\n\
