  \n\n\n\n\n通过将比较器的强度设置为 `Collator.PRIMARY`，你告诉它只关注初级差异（primary differences）。通过将强度设置为\
  \ `Collator.SECONDARY`，你指示比较器考虑次级差异。也就是说，当强度被设置为“secondary”（次级）或“tertiary”（三级）时，两个字符串更有可能被认为是不同的，如表\
  \ 7.8 所示。\n\n### 表 7.8：不同强度的排序（英语区域设置）\n\n| 初级 (Primary) | 次级 (Secondary) | 三级 (Tertiary)\
  \ |\n| --- | --- | --- |\n| Angstrom = Ångström | Angstrom ≠ Ångström | Angstrom\
  \ ≠ Ångström |\n| Able = able | Able = able | Able ≠ able |\n\n当强度设置为 `Collator.IDENTICAL`\
  \ 时，不允许任何差异。此设置主要用于与一种相当技术性的比较器设置——`decomposition mode`（分解模式）结合，我们将在接下来讨论它。\n\n\
  偶尔，一个字符或字符序列在 Unicode 中可以用多种方式描述。例如，“Å”可以是 Unicode 字符 `U+00C5`，也可以表示为普通的“A”（`U+0065`）后跟一个“°”（combining\
  \ ring above`; `U+030A`）。也许令人惊讶的是，字母序列“ffi”可以使用单个字符“Latin small ligature ffi”（其代码为\
  \ `U+FB03`）来描述。（人们可以争论说这是一个显示问题，不应该导致不同的 Unicode 字符，但规则不是我们定的。）\n\nUnicode 标准为字符串定义了四种\
  \ `normalization forms`（规范化形式：D、KD、C 和 KC）。详情请参见 [`www.unicode.org/unicode/reports/tr15/tr15-23.html`](https://www.unicode.org/unicode/reports/tr15/tr15-23.html)。在规范化形式\
  \ C 中，带重音的字符总是组合在一起的。例如，“A”和组合上环“°”的序列被组合成单个字符“Å”。在形式 D 中，带重音的字符总是被分解为基基字母和组合重音：“Å”被转换为“A”后跟“°”。KC\
  \ 和 KD 形式也会分解如连字或商标符号之类的字符。\n\n你可以选择希望比较器使用的规范化程度。值 `Collator.NO_DECOMPOSITION`\
  \ 完全不对字符串进行规范化。此选项更快，但可能不适用于以多种形式表示字符的文本。默认的 `Collator.CANONICAL_DECOMPOSITION`\
  \ 使用规范化形式 D。这对于包含重音但不包含连字的文本很有用。示例请参见表 7.9。\n\n### 表 7.9：分解模式之间的差异\n\n| 无分解 (No\
  \ Decomposition) | 规范分解 (Canonical Decomposition) | 完全分解 (Full Decomposition) |\n\
  | --- | --- | --- |\n| Å ≠ A° | Å = A° | Å = A° |\n| ™ ≠ TM | ™ ≠ TM | ™ = TM |\n\
  \n让比较器多次分解字符串是浪费的。如果一个字符串与其他字符串进行多次比较，可以将分解结果保存在 `collation` 键对象中。`getCollationKey`\
  \ 方法返回一个 `CollationKey` 对象，你可以将其用于进一步、更快速的比较。这是一个示例：\n\n```\nString a = . . .;\n\
  CollationKey aKey = coll.getCollationKey(a);\nif(aKey.compareTo(coll.getCollationKey(b))\
  \ == 0) // 快速比较\n   . . .\n```\n\n最后，即使你不进行排序，可能也想将字符串转换为它们的规范化形式——例如，将字符串存储在数据库中或与其他程序通信。`java.text.Normalizer`\
  \ 类执行规范化过程。这是一个示例：\n\n```\nString name = \"Ångström\";\nString normalized = Normalizer.normalize(name,\
  \ Normalizer.Form.NFD);\n// 使用规范化形式 D\n```\n\n规范化后的字符串包含十个字符。“Å”和“ö”被替换为序列“A°”和“o¨”。\n\
  \n然而，这通常不是存储和传输的最佳形式。规范化形式 C 首先应用分解，然后按照标准顺序将重音组合回来。根据 W3C 的标准，这是通过互联网传输数据的推荐模式。\n\
  \n代码列表 7.3 中的程序允许你实验排序顺序。书的配套代码还有一个 GUI 版本。在文本字段中输入单词并点击 Add 按钮将其添加到单词列表中。每当你添加另一个单词，或者更改区域设置、强度或分解模式时，单词列表都会重新排序。`=`\
  \ 符号表示被认为是相同的单词（参见图 7.3）。\n\n![Figure](img/fig05-03.jpg)图 7.3：`CollationTest` 程序\n\
  \n区域名称使用默认区域的比较器按排序顺序显示。如果你用美国英语区域设置运行此程序，请注意“Norwegian (Norway,Nynorsk)”在“Norwegian\
  \ (Norway)”之前，尽管逗号字符的 Unicode 值大于右括号的 Unicode 值。\n\nListing 7.3 collation/CollationTest2.java\n\
