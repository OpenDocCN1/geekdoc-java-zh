  \ path, BasicFileAttributes attrs)`\n  在访问文件或目录时调用；返回 `CONTINUE`、`SKIP_SUBTREE`、`SKIP_SIBLINGS`\
  \ 或 `TERMINATE`之一。默认实现什么都不做并继续。\n* `static FileVisitResult preVisitDirectory(T dir,\
