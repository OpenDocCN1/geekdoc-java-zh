  \ A. Smith、Steven Stelting（Oracle）、Christopher Taylor、Luke Taylor（Valtech）、George\
  \ Thiruvathukal、Kim Topley（StreamingEdge）、Janet Traub、Paul Tyma（顾问）、Christian Ullenboom、Peter\
  \ van der Linden、Joe Wang（Oracle）、Sven Woltmann、Burt Walsh、Dan Xu（Oracle）以及 John\
  \ Zavgren（Oracle）。\n\nCay Horstmann\n德国杜塞尔多夫\n2023 年 10 月\n\n# 第 1 章 ▪ 流\n\n与集合相比，流提供了一种数据视图，让你能够在更高概念面上指定计算。通过流，你指定的是你想做什么，而不是*如何做*。你将操作的调度留给实现部分。例如，假设你想计算某个属性的平均值。你指定数据源和该属性，然后流库就可以优化计算，例如使用多个线程来计算总和和计数并合并结果。\n\
  \n在本章中，你将学习如何使用 Java 流库，它允许你以“关注做什么，而非怎么做”的方式处理值序列。\n\n## 1.1. 从迭代到流操作\n\n当你处理集合时，通常会遍历它的元素并对每个元素执行某些操作。例如，假设我们想统计书中所有的长单词。首先，将它们放入一个列表：\n\
  \n```\nString contents =  Files.readString(Path.of(\"alice.txt\")); // 将文件读取为字符串\n\
  List<String> words = List.of(contents.split(\"\\\\PL+\"));\n   // 分割为单词；非字母字符是分隔符\n\
  ```\n\n现在我们准备好进行迭代了：\n\n```\nint count = 0;\nfor (String w : words)\n{\n   if (w.length()\
  \ > 12) count++;  \n}\n```\n\n使用流，相同的操作看起来如下：\n\n```\nlong count = words.stream()\n\
  \   .filter(w -> w.length() > 12)\n   .count();\n```\n\n现在，你不需要扫描循环来寻找过滤和计数的证据了。方法名会立即告诉你代码的意图。此外，循环以详尽细节规定了操作顺序，而流能够以它喜欢的任何方式调度操作，只要结果是正确的即可。\n\
  \n只需将 `stream` 更改为 `parallelStream`，流库即可并行执行过滤和计数。\n\n```\nlong count = words.parallelStream()\n\
  \   .filter(w -> w.length() > 12)\n   .count();\n```\n\n流遵循“关注做什么，而非怎么做”的原则。在我们的流示例中，我们描述了需要做什么：获取长单词并进行计数。我们没有指定这应该以什么顺序或在哪个线程中发生。相比之下，本节开头的循环精确指定了计算应该如何工作，从而放弃了任何优化的机会。\n\
  \n流在表面上与集合相似，允许你转换和检索数据。但它们存在显著差异：\n\n1. 流不存储其元素。元素可能存储在底层集合中，或根据需要生成。\n2. 流操作不会改变其源。例如，`filter`\
  \ 方法不会从流中删除元素，而是产生一个不包含这些元素的新流。\n3. 终端操作会强制执行其之前的惰性操作。之后，该流将无法再次使用。\n\n在 1.1 的示例中，流是通过\
  \ `stream` 或 `parallelStream` 方法创建的。`filter` 方法对其进行转换，而 `count` 是终端操作。在下一节中，你将看到如何创建流。\n\
  \n\n\n\n你已经看到，可以通过 `Collection` 接口的 `stream` 方法将任何集合转换为流（stream）。如果你有一个数组，请使用静态方法\
  \ `Stream.of`。\n\n```java\nStream<String> words = Stream.of(contents.split(\"\\\\\
  PL+\"));\n   // split 返回一个 String[] 数组\n```\n\n`of` 方法有一个变长参数，因此你可以从任意数量的参数构造流：\n\
  \n```java\nStream<String> song = Stream.of(\"gently\", \"down\", \"the\", \"stream\"\
  );\n```\n\n使用 `Arrays.stream(array, from, to)` 从数组的局部创建一个流。\n\n要创建一个不包含元素的流，请使用静态方法\
  \ `Stream.empty`：\n\n```java\nStream<String> silence = Stream.empty();\n   // 泛型类型\
  \ <String> 被推断；等同于 Stream.<String>empty()\n```\n\n`Stream` 接口有两个用于创建无限流的静态方法。`generate`\
  \ 方法接收一个无参数函数（从技术上讲，是一个 `Supplier<T>` 接口的对象）。每当需要流值时，就会调用该函数来产生一个值。你可以获取一个常值的流：\n\
  \n```java\nStream<String> echos = Stream.generate(() -> \"Echo\");\n```\n\n或者获取一个随机数的流：\n\
  \n```java\nStream<Double> randoms = Stream.generate(Math::random);\n```\n\n要产生如\
  \ `0 1 2 3 . . .` 的序列，请使用 `iterate` 方法。它接收一个“种子”值和一个函数（技术上讲，一个 `UnaryOperator<T>`），并重复将该函数应用于上一个结果。例如：\n\
  \n```java\nStream<BigInteger> integers\n   = Stream.iterate(BigInteger.ZERO, n ->\
  \ n.add(BigInteger.ONE));\n```\n\n序列中的第一个元素是种子 `BigInteger.ZERO`。第二个元素是 `f(seed)`，产生\
  \ `1`（作为大整数）。下一个元素是 `f(f(seed))`，产生 `2`，以此类推。\n\n若要产生一个有限流，请添加一个指定迭代何时结束的谓词：\n\n\
  ```java\nvar limit = new BigInteger(\"10000000\");\nStream<BigInteger> integers\n\
  \   = Stream.iterate(BigInteger.ZERO,\n      n -> n.compareTo(limit) < 0,\n    \
  \  n -> n.add(BigInteger.ONE));\n```\n\n一旦谓词拒绝了迭代生成的值，流就会结束。\n\n最后，`Stream.ofNullable`\
  \ 方法根据对象创建一个短流。如果对象为 `null`，则流的长度为 0；否则长度为 1，包含该对象。这在与 `flatMap` 结合使用时非常有用——参见第\
  \ 1.7.7 节。\n\nJava API 中的许多方法都会产生流。例如，`String` 类有一个 `lines` 方法，产生包含字符串中行的流：\n\n\
  ```java\nStream<String> greetings = \"Hello\\nGuten Tag\\nBonjour\".lines();\n```\n\
  \n`Pattern` 类有一个方法 `splitAsStream`，可以根据正则表达式分割 `CharSequence`。你可以使用以下语句将字符串拆分为单词：\n\
  \n```java\nStream<String> words = Pattern.compile(\"\\\\PL+\").splitAsStream(contents);\n\
  ```\n\n`Scanner.tokens` 方法产生扫描器的标记（tokens）流。另一种从字符串获取单词流的方法是：\n\n```java\nStream<String>\
  \ words = new Scanner(contents).tokens();\n```\n\n静态方法 `Files.lines` 返回文件中所有行的 `Stream`：\n\
  \n```java\ntry (Stream<String> lines = Files.lines(path))\n{ \n   Process lines\
  \ \n}\n```\n\n注意，需要使用 `try`-with-resources 语句块来关闭文件。\n\n在 Java API 中以流的形式提供数据变得越来越常见。例如，Java\
  \ 21 添加了一个静态方法 `availableLocales`，产生 `Locale` 对象的流。\n\n若要产生一个有限流，你始终可以将元素添加到列表中，然后将其转换为流。`Stream.Builder`\
  \ 接口用于此目的效率略高：\n\n```java\nStream<Integer> digits(int n)\n{\n   Stream.Builder<Integer>\
  \ builder = Stream.builder();\n   while (n != 0)\n   {\n      builder.add(n % 10);\n\
  \      n = n / 10;\n   }\n   return builder.build();\n}\n```\n\n要查看本节引入的流之一的内容，请使用\
  \ `toList` 方法，它会将流的元素收集到列表中。像 `count` 一样，`toList` 是一个终端操作。如果流是无限的，请先用 `limit` 方法对其截断：\n\
  \n```java\nSystem.out.println(Stream.generate(Math::random).limit(10).toList());\n\
  ```\n\n为了将 `Iterator` 或不是集合的通用 `Iterable` 转换为流，你需要使用 `spliterators` 的辅助方法。`spliterator`\
  \ 与 `iterator` 类似，但它可以被分割，使得每个生成的 `spliterator` 都能产生元素的一部分。这种分割用于并行处理元素——参见第 1.14\
  \ 节。\n\n如果你有一个 `Iterator` 并想要获取其结果的流，请使用：\n\n```java\nStreamSupport.stream(Spliterators.spliteratorUnknownSize(\n\
  \   iterator, Spliterator.ORDERED), false);\n```\n\n如果你有一个不是集合的 `Iterable`，可以通过调用以下方法转换为流：\n\
  \n```java\nStreamSupport.stream(iterable.spliterator(), false);\n```\n\n在执行流操作时，修改背后的集合是非常重要的。记住，流并不收集数据——数据始终在独立的集合中。如果你修改了该集合，流操作的结果将变得不可。JDK\
  \ 文档将这一要求称为 `noninterference`（非干扰）。\n\n准确来说，由于中间流操作是懒性的，因此在终端操作执行之前修改集合是可能的。例如，下面的代码虽然不推荐，但可以运行：\n\
  \n```java\nList<String> wordList = . . .;\nStream<String> words = wordList.stream();\n\
  wordList.add(\"END\");\nlong n = words.distinct().count();\n```\n\n但这段代码是错误的：\n\n\
  ```java\nStream<String> words = wordList.stream();\nwords.forEach(s -> {if (s.length()\
  \ < 12) wordList.remove(s);});\n   // ERROR--interference\n```\n\n列表 1.2 中的示例程序了创建流的各种方式。\n\
  \n列表 1.2 streams/CreatingStreams.java\n\n\n\n\n```java\npackage streams;\n\nimport\
  \ java.io.*;\nimport java.math.*;\nimport java.nio.file.*;\nimport java.util.*;\n\
  import java.util.regex.Pattern;\nimport java.util.stream.*;\n\n/**\n * @version\
  \ 1.03 2021-09-06\n * @author Cay Horstmann\n */\npublic class CreatingStreams\n\
  {\n   public static <T> void show(String title, Stream<T> stream)\n   {\n      final\
  \ int SIZE = 10;\n      List<T> firstElements = stream\n         .limit(SIZE + 1)\n\
  \         .toList();\n      System.out.print(title + \": \");\n      for (int i\
  \ = 0; i < firstElements.size(); i++)\n      {\n         if (i > 0) System.out.print(\"\
  , \");\n         if (i < SIZE) System.out.print(firstElements.get(i));\n       \
  \  else System.out.print(\"...\");\n      }\n      System.out.println();\n   }\n\
  \n   public static void main(String[] args) throws IOException\n   {\n      Path\
  \ path = Path.of(\"../gutenberg/alice30.txt\");\n      String contents = Files.readString(path);\
  \      \n      Stream<String> words = Stream.of(contents.split(\"\\\\PL+\"));\n\n\
  \      show(\"words\", words);\n      Stream<String> song = Stream.of(\"gently\"\
  , \"down\", \"the\", \"stream\");\n      show(\"song\", song);\n      Stream<String>\
  \ silence = Stream.empty();\n      show(\"silence\", silence);\n\n      Stream<String>\
  \ echos = Stream.generate(() -> \"Echo\");\n      show(\"echos\", echos);\n\n  \
  \    Stream<Double> randoms = Stream.generate(Math::random);\n      show(\"randoms\"\
  , randoms);\n\n      Stream<BigInteger> integers = Stream.iterate(BigInteger.ONE,\n\
  \         n -> n.add(BigInteger.ONE));\n      show(\"integers\", integers);\n\n\
  \      Stream<String> greetings = \"Hello\\nGuten Tag\\nBonjour\".lines();\n   \
  \   show(\"greetings\", greetings);\n\n      Stream<String> wordsAnotherWay = Pattern.compile(\"\
  \\\\PL+\").splitAsStream(contents);\n      show(\"wordsAnotherWay\", wordsAnotherWay);\n\
  \n      try (Stream<String> lines = Files.lines(path))\n      {\n         show(\"\
  lines\", lines);\n      }\n\n      Iterable<Path> iterable = FileSystems.getDefault().getRootDirectories();\n\
  \      Stream<Path> rootDirectories = StreamSupport.stream(iterable.spliterator(),\
  \ false);\n      show(\"rootDirectories\", rootDirectories);\n\n      Iterator<Path>\
  \ iterator = Path.of(\"/usr/share/dict/words\").iterator();\n      Stream<Path>\
  \ pathComponents = StreamSupport.stream(Spliterators.spliteratorUnknownSize(\n \
  \        iterator, Spliterator.ORDERED), false);  \n      show(\"pathComponents\"\
  , pathComponents);\n   }\n}\n```\n\n### `java.util.stream.Stream` 8\n\n- `static\
  \ <T> Stream<T> of(T... values)`\n  产生一个元素为给定给定值的流。\n\n- `static <T> Stream<T> empty()`\n\
  \  产生一个空元素的流。\n\n- `static <T> Stream<T> generate(Supplier<T> s)`\n  产生一个无限流，其元素通过重复调用函数\
  \ `s` 构建。\n\n- `static <T> Stream<T> iterate(T seed, UnaryOperator<T> f)`\n\n- `static\
  \ <T> Stream<T> iterate(T seed, Predicate<? super T> hasNext, UnaryOperator<T> f)`\n\
  \  产生一个流，其元素为：`seed`、对 `seed` 调用 `f`、对前一个元素调用 `f`，依此类推。第一种方法产生一个无限流。第二种方法的流在第一个不满足\
  \ `hasNext` 谓词的元素之前结束。\n\n- `static <T> Stream<T> ofNullable(T t)` 9\n  如果 `t` 为\
  \ `null` 则返回一个空流，否则返回一个包含 `t` 的流。\n\n### `java.util.Spliterators` 8\n\n- `static\
  \ <T> Spliterator<T> spliteratorUnknownSize(Iterator<? extends T> iterator, int\
  \ characteristics)`\n  将迭代器转换为未知大小的可拆分迭代器，具有给定的特征（一个包含 `Spliterator.ORDERED` 等常量的位模式）。\n\
  \n### `java.util.Arrays` 1.2\n\n- `static <T> Stream<T> stream(T[] array, int startInclusive,\
  \ int endExclusive)` 8\n  产生一个元素为数组中指定范围的流。\n\n### `java.lang.String`\n\n- `static\
  \ Stream<String> lines()` 11\n  产生一个元素为该字符串各行的流。\n\n### `java.util.regex.Pattern`\
  \ 1.4\n\n- `Stream<String> splitAsStream(CharSequence input)` 8\n  产生一个流，其元素为由此模式分隔的输入部分。\n\
  \n### `java.nio.file.Files` 7\n\n- `static Stream<String> lines(Path path)` 8\n\n\
  - `static Stream<String> lines(Path path, Charset cs)` 8\n  产生一个元素为指定文件行的流，使用 UTF-8\
  \ 字符集或给定的字符集。\n\n### `java.util.stream.StreamSupport` 8\n\n- `static <T> Stream<T>\
  \ stream(Spliterator<T> spliterator, boolean parallel)`\n  从给定的迭代器产生流。\n\n### `java.lang.Iterable`\n\
  \n- `Spliterator<T> spliterator()` 8\n  产生此的迭代器。\n\n### `java.util.Scanner` 5\n\n\
  - `public Stream<String> tokens()`\n  产生返回的字符串流。\n\n### `java.util.function.Supplier<T>`\
  \ 8\n\n- `T get()`\n  提供一个值。\n\n### `filter`, `map`, `flatMap` 方法\n\n当使用 `map` 时，函数应用于每个元素，产生一个新的流。通常你会使用方法引用。例如，你可以将所有单词转换为小写：\n\
  \n```java\nStream<String> lowercaseWords = words.stream().map(String::toLowerCase);\n\
  ```\n\n通常你也会使用 Lambda 表达式：\n\n```java\nStream<Character> firstCodeUnits = words.stream().map(s\
  \ -> s.charAt(0));\n```\n\n现在考虑返回值本身是流的情况。例如 `graphemeClusters(\"Ciao\U0001F1EE\U0001F1F9\
  \")` 是一个 `\"C\"`、`\"i\"`、`\"a\"`、`\"o\"`、` `\"\U0001F1EE\U0001F1F9\"` 的流（注意标志由四个\
  \ `char` 值组成，因此 `graphemeClusters` 需要进行一些处理。我们稍后查看实现）。\n\n现在让我们在字符串流上映射 `graphemeClusters`\
  \ 方法：\n\n```java\nList<String> words = List.of(\"your\", \"boat\");\nStream<Stream<String>>\
  \ result = words.stream().map(w -> graphemeClusters(w));\n```\n\n你将得到一个流流，类似于 `[...\
  \ [\"y\", \"o\", \"u\", \"r\"], [\"b\", \"o\", \"a\", \"t\"], ...]`。要将其展平成单一流 `[...\
  \ \"y\", \"o\", \"u\", \"r\", \"b\", \"o\", \"a\", \"t\", ... ]`，请使用 `flatMap` 方法代替\
  \ `map`：\n\n```java\nStream<String> flatResult = words.stream().flatMap(w -> graphemeClusters(w));\n\
  // 对每个单词调用 graphemeClusters 并展平结果\n```\n\n现在你已经看到了如何使用 `graphemeClusters` 方法，该如何编写它？一种方法是使用按字形簇边界分割的正则表达式：\n\
  \n```java\npublic static Stream<String> graphemeClusters(String s)\n{\n   return\
  \ new Scanner(s).useDelimiter(\"\\\\b{g}\").tokens();\n}\n```\n\n这里我们很幸运，可以很容易编写一个为每个流元素产生流的方法。有时并不如此容易。创建许多流也可能效率较低。`mapMulti`\
  \ 方法提供了一种替代方案。它不是产生结果流，而是生成结果并将其传递给收集器——一个实现 `Consumer`  de 接口的类。对于每个结果，调用收集器的 `accept`\
  \ 方法。\n\n\n\n\n让我们通过一个示例来操作。以下循环产生字符串 `s` 的字符聚簇：\n\n```\nBreakIterator iter = BreakIterator.getCharacterInstance();\n\
  . . .\niter.setText(s);\nint start = iter.first();\nint end = iter.next();\nwhile\
  \ (end != BreakIterator.DONE) {\n   String gc = s.substring(start, end);\n   start\
  \ = end;\n   end = iter.next();\n   // 对 gc 进行某些操作\n}\n```\n\n调用 `mapMulti` 时，你提供一个函数，该函数会在流元素和收集器（collector）时被调用。在你的函数中，将结果传递给收集器。\n\
  \n```\nStream<String> result = words.stream().mapMulti((s, collector) ->\n   {\n\
  \      iter.setText(s);\n      int start = iter.first();\n      int end = iter.next();\n\
  \      while (end != BreakIterator.DONE)\n      {\n         String gc = s.substring(start,\
  \ end);\n         start = end;\n         end = iter.next();\n         collector.accept(gc);\n\
  \      }\n   });\n```\n\njava.util.stream.Stream 8\n\n*   `Stream<T> filter(Predicate<?\
  \ super T> predicate)`\n    产生一个包含此流中符合谓词的元素的流。\n\n*   `<R> Stream<R> map(Function<?\
  \ super T,? extends R> mapper)`\n    产生一个包含将 `mapper` 应用于此流元素后的结果的流。\n\n*   `<R>\
  \ Stream<R> flatMap(Function<? super T,? extends Stream<? extends R>> mapper)`\n\
  \    产生一个通过连接将 `mapper` 应用于此流元素的结果而得到的流。（注意每个 `mapper` 结果都是一个流。）\n\n*   `<R> Stream<R>\
  \ mapMulti(BiConsumer<? super T,? super Consumer<R>> mapper)` 16\n    对于每个流元素，都会调用\
  \ `mapper`，并在调用期间传递给 `Consumer` 的所有元素都将添加到结果流中。\n\n## 1.4. 提取子流和合并流\n\n`stream.limit(n)`\
  \ 调用返回一个新的流，该流在 `n` 个元素之后结束（或者如果原始流较短，则在原始流结束时结束）。该方法对于将无限流截断到指定大小特别有用。例如，\n\n```\n\
  Stream<Double> randoms = Stream.generate(Math::random).limit(100);\n```\n产生一个包含\
  \ 100 个随机数的流。\n\n`stream.skip(n)` 调用执行的是完全相反的操作。它丢弃前 `n` 个元素。这在我们读书的示例中非常用，由于 `split`\
  \ 方法的工作方式，第一个元素是一个不需要的空字符串。我们可以通过调用 `skip` 让它消失：\n\n```\nStream<String> words =\
  \ Stream.of(contents.split(\"\\\\PL+\")).skip(1);\n```\n\n`stream.takeWhile(predicate)`\
  \ 调用在谓词为 `true` 时从流中获取所有元素，然后停止。\n\n例如，假设我们使用前一节的 `graphemeClusters` 方法将字符串拆分为字符，并且我们想要收集所有的首位数字。`takeWhile`\
  \ 方法可以做到这一点：\n\n```\nStream<String> initialDigits = graphemeClusters(str).takeWhile(\n\
  \   s -> \"0123456789\".contains(s));\n```\n\n`dropWhile` 方法执行相反的操作，即在条件为 `true`\
  \ 时丢弃元素，并产生一个从第一个条件为 `false` 的元素开始的所有元素的流。例如，\n\n```\nStream<String> withoutInitialWhiteSpace\
  \ = graphemeClusters(str).dropWhile(\n   s -> s.strip().length() == 0);\n```\n\n\
  你可以使用 `Stream` 类的静态方法 `concat` 合并两个流：\n\n```\nStream<String> combined = Stream.concat(\n\
  \   graphemeClusters(\"Hello\"), graphemeClusters(\"World\"));\n   // 产生流 [\"H\"\
  , \"e\", \"l\", \"l\", \"o\", \"W\", \"o\", \"r\", \"l\", \"d\"]\n```\n当然第一个流不应该是无限的——否则第二个流将永远没有机会。\n\
  \njava.util.stream.Stream 8\n\n*   `Stream<T> limit(long maxSize)`\n    产生一个包含此流中最多\
  \ `maxSize` 个初始元素的流。\n\n*   `Stream<T> skip(long n)`\n    产生一个流，其元素是此流除前 `n` 个元素以外的所有元素。\n\
  \n*   `Stream<T> takeWhile(Predicate<? super T> predicate)` 9\n    产生一个流，其元素是此流中符合谓词的初始元素。\n\
  \n*   `Stream<T> dropWhile(Predicate<? super T> predicate)` 9\n    产生一个流，其元素是此流除符合谓词的初始元素以外的元素。\n\
  \n*   `static <T> Stream<T> concat(Stream<? extends T> a, Stream<? extends T> b)`\n\
  \    产生一个流，其元素是 `a` 的元素后跟 `b` 的元素。\n\n## 1.5. 其他流转换\n\n`distinct` 方法返回一个流，该流按相同顺序产生来自原始流的元素，但抑制了重复项。重复项不需要是相邻的。\n\
  \n```\nStream<String> uniqueWords\n   = Stream.of(\"merrily\", \"merrily\", \"gently\"\
  ).distinct();\n```\n对流进行排序有几种变体。一种适用于 `Comparable`，另一种接受 `Comparator`。这里是获取流的最长字符串：\n\
  \n```\nOptional<String> longest\n   = words.stream().sorted(Comparator.comparing(String::length).reversed());\n\
  ```\n正如所有的转换一样，`sorted` 方法产生一个新的流。`Optional` 值要么封装了答案，要么表示没有（因为流恰好为空）。在旧时代，在这种情况下返回\
  \ `null` 是常见的。但当它在测试不完整的程序中发生时，会导致空指针异常。`Optional` 类型是指示缺失返回值的更好方法。我们将在下一节中详细讨论\
  \ `Optional` 类型。这里是获取流的最大值：`words.max(String::compareToIgnoreCase)`\n\n`peek` 方法在\
  \ `iterate` 被惰性处理时很有用。当元素被实际访问时，会打印消息。当你使用调试器调试流时，可以设置断点。在大多数 IDE 中，你也可以在 lambda\
  \ 表达式中设置断点。如果你只想知道流中某一点发生了什么，添加\n\n```\n.peek(x -> {\n      return;\n   })\n```\n\
  并在此处设置断点。\n\njava.util.stream.Stream 8\n\n*   `Stream<T> distinct()`\n    产生一个包含此流去重元素的流。\n\
  \n*   `Stream<T> sorted()`\n*   `Stream<T> sorted(Comparator<? super T> comparator)`\n\
  \    产生一个按排序顺序排列此流元素的流。第一种方法要求元素是 `Comparable`。\n\n*   `Stream<T> peek(Consumer<?\
  \ super T> action)`\n    产生一个与此流元素相同的流，并在消费每个元素时将其传递给 `action`。\n\n## 1.6. 归约\n\n\
  现在你已经学习了如何创建和转换流，我们终于到了最重要的点——从流数据中获取答案。本节涵盖的方法被称为*归约*（reductions）。归约是*终端操作*。它们将流归约为非流的值，该值可以在你的程序中使用。\n\
  \n你已经见过简单的归约：`count` 方法，它返回流的数量。\n\n其他简单的归约有 `max` 和 `min`，它们返回最大或最小值。有一个转折——这些方法返回一个\
  \ `Optional<T>` 值，该值要么封装了答案，要么表示没有（因为流流为空）。在旧时代，在这种情况下返回 `null` 是常见的。但当它在测试不完整的程序中发生时，会导致空指针异常。`Optional`\
  \ 类型是指示缺失返回值的更好方法。我们将在下一节中详细讨论 `Optional` 类型。这里是获取流的最大值：`words.max(String::compareToIgnoreCase)`\n\
  \n\n\n`findFirst` 返回非空集合中的第一个值。它与 `filter` 结合使用时通常非常有用。例如，在这里我们找到第一个以字母 `Q` 开头的单词，如果存在的话：\n\
  \n```\nOptional<String> startsWithQ\n   = words.filter(s -> s.startsWith(\"Q\")).findFirst();\n\
  ```\n\n如果你对任何匹配项都可以接受，而不仅仅是第一个，请使用 `findAny` 方法。在对流进行并行处理时，这种方法非常有效，因为流可以报告它找到的任何匹配项，而不再受限于第一个。\n\
  \n```\nOptional<String> startsWithQ\n   = words.parallel().filter(s -> s.startsWith(\"\
  Q\")).findAny();\n```\n\n如果你只想知道是否存在匹配项，请使用带有谓词参数的终端操作 `anyMatch`：\n\n```\nboolean\
  \ aWordStartsWithQ\n   = words.parallel().anyMatch(s -> s.startsWith(\"Q\"));\n\
  ```\n\n还有 `allMatch` 和 `noneMatch` 方法，如果所有元素或没有元素匹配某个谓词，则它们将返回 `true`。这些方法在并行运行时也能受益。\n\
  \n`java.util.stream.Stream` 8\n\n- `Optional<T> max(Comparator<? super T> comparator)`\n\
  - `Optional<T> min(Comparator<? super T> comparator)`\n  使用给定的比较器定义的排序，返回此流的最大或最小元素；如果此流为空，则返回一个空的\
  \ `Optional`。这些是终端操作。\n- `Optional<T> findFirst()`\n- `Optional<T> findAny()`\n\
  \  返回此流的第一个或任意元素；如果此流为空，则返回一个空的 `Optional`。这些是终端操作。\n- `boolean anyMatch(Predicate<?\
  \ super T> predicate)`\n- `boolean allMatch(Predicate<? super T> predicate)`\n-\
  \ `boolean noneMatch(Predicate<? super T> predicate)`\n  如果此流中的任何、所有或没有元素匹配给定的谓词，则返回\
  \ `true`。这些是终端操作。\n\n## 1.7. Optional 类型\n\n`Optional<T>` 对象是 `T` 类型对象或无对象的包装器。在一种情况下，我们说该值存在。`Optional<T>`\
  \ 类型旨在作为 `T` 类型引用的更安全的替代方案，该引用要么指向一个对象，要么是 `null`。但只有在你正确使用它时它才是安全的。接下来的三个章节将向你展示。\n\
  \n### 1.7.1. 获取 Optional 值\n\n有效使用 `Optional` 的关键是使用一个在值不存在时产生备选方案，或者在值存在时才消费值的方法。\n\
  \n在本节中，我们查看第一种策略。通常，当没有匹配项时，你想使用的默认值，可能是空字符串：\n\n```\nString result = optionalString.orElse(\"\
  \");\n   // 被封装的字符串，如果为空则为 \"\"\n```\n\n你也可以调用代码来计算默认值：\n\n```\nString result =\
  \ optionalString.orElseGet(() -> System.getProperty(\"myapp.default\"));\n   //\
  \ 只有在需要时才会调用该函数\n```\n\n或者如果没有值，你可以抛出一个异常：\n\n```\nString result = optionalString.orElseThrow(IllegalStateException::new);\n\
  \   // 提供一个产生异常对象的方法\n```\n\n`java.util.Optional` 8\n\n- `T orElse(T other)`\n \
  \ 返回此 `Optional` 的值，如果此 `Optional` 为空，则返回 `other`。\n- `T orElseGet(Supplier<? extends\
  \ T> other)`\n  返回此 `Optional` 的值，如果此 `Optional` 为空，则返回调用 `other` 的结果。\n- `<X extends\
  \ Throwable> T orElseThrow(Supplier<? extends X> exceptionSupplier)`\n  返回此 `Optional`\
  \ 的值，如果此 `Optional` 为空，则抛出调用 `exceptionSupplier` 的结果。\n\n### 1.7.2. 消费 Optional\
  \ 值\n\n在前面的节中，你已经了了值不存在时如何产生备选方案。处理可选值的另一种策略是仅在值存在时才消费该值。\n\n`ifPresent` 方法接受一个函数。如果\
  \ Optional 值存在，它将被传递给该函数。否则，什么都不会发生。\n\n```\noptionalValue.ifPresent(v -> Process\
  \ v);\n```\n\n例如，如果你想在值存在时将其添加到集合中，请调用\n\n```\noptionalValue.ifPresent(v -> results.add(v));\n\
  ```\n\n或者简单地使用：\n\n```\noptionalValue.ifPresent(results::add);\n```\n\n如果你想在 `Optional`\
  \ 有值时执行一个操作，在没有值时执行另一个操作，请使用 `ifPresentOrElse`：\n\n```\noptionalValue.ifPresentOrElse(\n\
  \   v -> System.out.println(\"Found \" + v),\n   () -> logger.warning(\"No match\"\
  ));\n```\n\n`java.util.Optional` 8\n\n- `void ifPresent(Consumer<? super T> action)`\n\
  \  如果此 `Optional` 不空，则将它的值传递给 `action`。\n- `void ifPresentOrElse(Consumer<? super\
  \ T> action, Runnable emptyAction)`\n  如果此 `Optional` 不空，则将它的值传递给 `action`，否则调用\
  \ `emptyAction`。\n\n### 1.7.3. Optional 值的管道化\n\n在前面的节中，你已经了如何从 `Optional` 对象获取值。另一个有用的策略是保持\
  \ `Optional` 完整。\n\n`Optional<String> transformed = optionalString.map(Path::of);`\n\
  \n如果 `optionalString` 为空，`transformed` 也是空的。同样，你可以使用 `flatMap`：\n\n```\nOptional<String>\
  \ result = optionalString.flatMap(s -> s.startsWith(\"Q\") ? Optional.of(s) : Optional.empty());\n\
  ```\n\n`filter` 方法可以用于只考虑符合属性的 `Optional` 值：\n\n```\nOptional<String> result = optionalString.filter(s\
  \ -> s.endsWith(\".txt\"));\n```\n\n你可以用 `or` 方法替换备选 `Optional`。备选方案是延迟计算的：\n\n\
  ```\nOptional<String> result = optionalString.or(() -> alternatives.stream().findFirst());\n\
  ```\n\n如果 `optionalString` 有值，则 `result` 被使用。\n\n`java.util.Optional` 8\n\n- `<U>\
  \ Optional<U> map(Function<? super T,? extends U)`\n  通过将给定的函数应用于此 `Optional` 的值来返回一个\
  \ `Optional`；否则返回空的 `Optional`。\n- `Optional<T> filter(Predicate<? super T> predicate)`\n\
  \  如果此 `Optional` 符合谓词，则返回此 `Optional`；否则返回空的 `Optional`。\n- `Optional<T> or(Supplier<?\
  \ extends T>)`\n  如果此 `Optional` 不空，则返回它，否则返回由提供者产生的 `Optional`。\n\n\n\n\n`Optional`\
  \ 类型的变量永远不应该为 `null`。\n- 不要使用 `Optional` 类型的字段。其代价是额外增加一个对象。在类内部，对于缺失的字段请使用 `null`。为了抑制人们使用\
  \ `Optional` 字段，该类被设置为不可序列化。\n- `Optional` 类型的方法参数是值得商榷的。在请求值存在的常见情况下，它们会使调用变得变得不便。相反，可以考虑该方法的两个重载版本，一个带参数，一个不带参数。（另一方面，返回一个\
  \ `Optional` 是好的。它是指示函数可能没有结果的正确方式。）\n- 不要将 `Optional` 对象放入集合（set）中，也不要将其作为映射的键（key）。请直接收集其中的值。\n\
  \n### `java.util.Optional` 8\n\n- `T get()`\n- `T orElseThrow()` 10\n  返回此 `Optional`\
  \ 的值，如果为空，则抛出 `NoSuchElementException`。\n- `boolean isEmpty()` 11\n- `boolean isPresent()`\n\
  \  如果此 `Optional` 为空或不为空，则返回 `true`。（注：此处原文描述似乎有误，此处按原意翻译）\n\n#### 1.7.5 创建 Optional\
  \ 值\n\n到为止，我们讨论了如何使用由他人创建的 `Optional` 对象。如果你想写一个创建 `Optional` 对象的方法，有几个静态方法可以此目的，包括\
  \ `Optional.of(result)` 和 `Optional.empty()`。例如，\n\n```\npublic static Optional<Double>\
  \ inverse(Double x) \n{\n   return x == 0 ? Optional.empty() : Optional.of(1 / x);\n\
  }\n```\n\n`ofNullable` 方法旨在作为从可能为 `null` 的值到可选值的桥梁。如果 `obj` 不是 `null`，则返回 `Optional.of(obj)`，否则返回\
  \ `Optional.empty()`。\n\n### `java.util.Optional` 8\n\n- `static <T> Optional<T>\
  \ of(T value)`\n- `static <T> Optional<T> ofNullable(T value)`\n  产生一个带有给定值的 `Optional`。如果\
  \ `value` 为 `null`，第一个方法将抛出 `NullPointerException`，而第二个方法产生一个空的 `Optional`。\n- `static\
  \ <T> Optional<T> empty()`\n  产生一个空的 `Optional`。\n\n#### 1.7.6 使用 `flatMap` 组合 Optional\
  \ 值函数\n\n假设你有一个方法 `f` 产生 `Optional<T>`，且目标类型 `T` 有一个产生 `Optional<U>` 的方法 `g`。如果它们是普通方法，你可以通过调用\
  \ `s.f().g()` 来组合它们。但这种组合不可通，因为 `s.f()` 的类型是 `Optional<T>` 而不是 `T`。相反，调用\n\n```\n\
  Optional<U> result = s.f().flatMap(T::g);\n```\n\n如果 `s.f()` 存在，则将 `g` 应用于它。否则，返回一个空的\
  \ `Optional<U>`。\n\n显然，如果你有更多产生 `Optional` 值的方法或 lambda 表达式，你可以重复该过程。你可以只需通过链式调用\
  \ `flatMap` 来构建一个步骤流水线，该流水线只有在所有部分都成功时才会成功。\n\n例如，考虑前一节中安全的 `inverse` 方法。假设我们还有一个安全的平方根方法：\n\
  \n```\npublic static Optional<Double> squareRoot(Double x) \n{\n   return x < 0\
  \ ? Optional.empty() : Optional.of(Math.sqrt(x));\n}\n```\n\n那么你可以这样计算 `inverse`\
  \ 的平方根：\n\n```\nOptional<Double> result = inverse(arg).flatMap(x -> squareRoot(x));\n\
  ```\n\n我们可以通过从一个 `Optional` 开始让这样的链看起来更规则：\n\n```\nOptional<Double> result\n   =\
  \ Optional.of(arg).flatMap(x -> inverse(x)).flatMap(x -> squareRoot(x));\n```\n\n\
  使用方法表达式时看起来更整洁：\n\n```\nOptional<Double> result\n   = Optional.of(arg).flatMap(MyMath::inverse).flatMap(MyMath::squareRoot);\n\
  ```\n\n如果 `inverse` 方法或 `squareRoot` 方法任一返回了 `Optional.empty()`，则结果为空。\n\n你已经已经在\
  \ `Stream` 接口中见过 `flatMap` 方法（参见第 1.3 节）。该方法将一个产生流的方法映射到流的所有元素，然后展平产生的流的流。`Optional.flatMap`\
  \ 方法以相同的方式工作。通过将产生可选值的方法映射到可选值，你得到了一个可选的可选，然后它被展平。\n\n### `java.util.Optional` 8\n\
  \n- `<U> Optional<U> flatMap(Function<? super T,? extends Optional<? extends U>>\
  \ mapper)`\n  如果此 `Optional` 中的值存在，则返回将 `mapper` 应用于该值的结果，否则返回一个空可选。\n\n#### 1.7.7\
  \ 将 Optional 转换为 Stream\n\n`stream` 方法将 `Optional<T>` 转换为具有零个或一个元素的 `Stream<T>`。当然，为什么不呢，但你为什么要这样做它呢？\n\
  \n这在返回 `Optional` 结果的方法中变得有用。假设你有一个用户 ID 的流以及有一个方法\n\n```\nOptional<User> lookup(String\
  \ id)\n```\n\n你如何获取用户流，并跳过那些无效的 ID？\n\n当然，你可以过滤掉无效 ID，然后对剩余部分应用 `get`：\n\n```\n\
  Stream<String> ids = . .;\nStream<User> users = ids.map(Users::lookup)\n   .filter(Optional::isPresent)\n\
  \   .map(Optional::get);\n```\n\n但这使用了我们警告过的 `isPresent` 和 `get` 方法。更优雅的方法是调用\n\n\
  ```\nStream<User> users = ids.map(Users::lookup)\n   .flatMap(Optional::stream);\n\
  ```\n\n每次调用 `stream` 都会返回一个包含零或一个元素的流。`flatMap` 方法将它们全部合并。这意味着不存在的用户被简单的丢除了。\n\n\
  在这一节中，我们考虑返回 `Optional` 值的理想情况。如今，许多方法在没有有效结果时返回 `null`。假设 `Users.classicLookup(id)`\
  \ 返回一个 `User` 对象或 `null`，而不是 `Optional<User>`。那么你当然过滤掉 `null` 值：\n\n```\nStream<User>\
  \ users = ids.map(Users::classicLookup)\n   .filter(Objects::nonNull);\n```\n\n\
  但如果你偏好 `flatMap` 方法，你可以使用\n\n```\nStream<User> users = ids.flatMap(\n   id -> Stream.ofNullable(Users.classicLookup(id)));\n\
  ```\n\n或者\n\n```\nStream<User> users = ids.map(Users::classicLookup)\n   .flatMap(Stream::ofNullable);\n\
  ```\n\n`Stream.ofNullable(obj)` 调用在 `obj` 为 `null` 时产生一个空流，否则产生一个仅包含 `obj` 的流。\n\
  \n示例列表 1.3 中的示例程序演示了 `Optional` API。\n\nListing 1.3 optional/OptionalTest.java\n\
  \n\n\n\n```java\npackage optional;\n\nimport java.io.*;\nimport java.nio.file.*;\n\
