  \ `TreePath[] getPaths()`\n\n    获取在此选择事件中*变化*的第一个或所有路径。如果你想知道当前选择而不是选择变化，请调用 `JTree.getSelectionPaths`。\n\
  \n### 12.4.6. 自定义树模型\n\n在最后一个示例中，我们实现了一个检查对象内容的程序，就像调试器所做的那样（参见图 12.30）。\n\n![Figure](img/fig06-34.jpg)图\
  \ 12.30: 对象检查树\n\n\n\n\n在继续之前，请编译并运行该示例程序。每个节点对应一个实例字段。如果该字段是一个对象，请展开它以查看其实例字段。程序将检查帧窗口的内容。如果你尝试查看几个实例字段，你应该能找到一些熟悉的类。你也会对\
  \ Swing 用户界面组件在底层的复杂性产生由衷敬意。\n\n该程序引人注目之处在于，树结构没有使用 `DefaultTreeModel`。如果你已经有了层次化组织的数据，你可能不想构建一个重复的树并担心保持两棵树的同步。这正是我们这种情况的情况——被检查的对象已经通过对象引用相互链接，因此没有必要复制这种链接结构。\n\
  \n`TreeModel` 接口只有几个方法。第一组方法允许 `JTree` 通过先获取根节点，然后获取子节点来查找树节点。`JTree` 类仅在用户实际展开节点时才调用这些方法。\n\
  \n```\nObject getRoot()\nint getChildCount(Object parent)\nObject getChild(Object\
  \ parent, int index)\n```\n\n这个示例展示了为什么 `TreeModel` 接口（就像 `JTree` 类本身）不需要显式的节点概念。根节点及其子节点可以是任何对象。`TreeModel`\
  \ 负责告诉 `JTree` 它们是如何连接的。\n\n`TreeModel` 接口的下一个方法是 `getChild` 反反：\n\n```\nint getIndexOfChild(Object\
  \ parent, Object child)\n```\n\n实际上，这个方法可以通过前三个方法来实现——请参见 Listing 12.12 中的代码。\n\n\
  树模型告诉 `JTree` 哪些节点应该作为叶节点显示：\n\n```\nboolean isLeaf(Object node)\n```\n\n如果你的代码更改了树模型，需要通知树以便它可以重绘。树将自己作为\
  \ `TreeModelListener` 添加到模型。因此，模型必须支持常用的监听器管理方法：\n\n```\nvoid addTreeModelListener(TreeModelListener\
  \ l)\nvoid removeTreeModelListener(TreeModelListener l)\n```\n\n你可以在 Listing 12.13\
  \ 中看到这些方法的实现。\n\n当模型修改树内容时，它会调用 `TreeModelListener` 接口的四个方法之一：\n\n```\nvoid treeNodesChanged(TreeModelEvent\
  \ e)\nvoid treeNodesInserted(TreeModelEvent e)\nvoid treeNodesRemoved(TreeModelEvent\
  \ e)\nvoid treeStructureChanged(TreeModelEvent e)\n```\n\n`TreeModelEvent` 对象描述了更改的位置。构建描述插入或删除事件的树模型是非常技术性的。只有当你的树可以添加和删除节点时，你才需要担心这些事件。在\
  \ Listing 12.12 中，我们展示了如何通过用新对象替换节点来触发事件。为了简化触发事件的代码，使用收集监听器的 `javax.swing.EventListenerList`\
  \ 便利类。Listing 12.13 的最后三个方法展示了如何使用该类。最后，如果用户编辑树节点，模型将被调用：\n\n```\nvoid valueForChanged(TreePath\
  \ path, Object newValue)\n```\n\n如果不允许编辑，此方法永远不会被调用。\n\n如果你不需要支持编辑，构建树模型很容易。实现这三个方法：\n\
  \n```\nObject getRoot()\nint getChildCount(Object parent)\nObject getChild(Object\
  \ parent, int index)\n```\n\n这些方法描述了树的结构。在 Listing 12.12 中提供其他五个方法的常规实现。你就可以显示你的树了。\n\
  \n现在转向程序的实现。我们的树将包含 `Variable` 类型的对象。如果我们使用了 `DefaultTreeModel`，节点将是 `DefaultMutableTreeNode`\
  \ 类型的对象。例如，假设我们检查变量：\n\n```\nEmployee joe;\n```\n\n该变量类型为 `Employee.class`，名为 `\"\
  joe\"`，值是对象引用 `joe` 的值。在 Listing 12.14 中，我们定义了一个描述变量的 `Variable` 类：\n\n```\nvar\
  \ v = new Variable(Employee.class, \"joe\", joe);\n```\n\n如果变量类型是基本类型，你必须为值使用对象包装类。\n\
  \n```\nnew Variable(double.class, \"salary\", Double.valueOf(salary));\n```\n\n\
  如果变量类型是类，变量拥有字段。使用反射枚举所有字段并将它们收集到 `ArrayList` 中。由于 `Class` 类的 `getFields` 方法不返回父类的字段，我们需要对所有父类调用\
  \ `getFields`。你可以在 `Variable` 构造函数中找到代码。我们的 `Variable` 类的 `getFields` 方法返回字段数组。最后`Variable`\
  \ 类的 `toString` 方法格式化标签。标签始终包含变量和名称。如果变量不是类，标签还包含值。\n\n如果类型是数组，我们不显示数组的元素。这并不难做到，“留给读者的练习”。\n\
  \n让我们进入模型。前两个方法是简单的：\n\n```\npublic Object getRoot()\n{\n   return root;\n}\n\n\
  public int getChildCount(Object parent)\n{\n   return ((Variable) parent).getFields().size();\n\
  }\n```\n\n`getChild` 方法返回一个描述指定字段的 `Variable` 对象。`Field` 类的 `getType` 和 `getName`\
  \ 方法产生字段类型和名称。通过反射，你可以读取 `f.get(parentValue)` 字段值。该方法可能会抛出 `IllegalAccessException`。然而，我们在\
  \ `Variable` 构造函数中让所有字段都可用，所以这种情况不会发生。\n\n这是 `getChild` 的完整代码：\n\n```\npublic Object\
  \ getChild(Object parent, int index)\n{\n   ArrayList fields = ((Variable) parent).getFields();\n\
  \   var f = (Field) fields.get(index);\n   Object parentValue = ((Variable) parent).getValue();\n\
  \   try\n   {\n      return new Variable(f.getType(), f.getName(), f.get(parentValue));\n\
  \   }\n   catch (IllegalAccessException e)\n   {\n      return null;\n   }\n}\n\
  ```\n\n这三个方法向 `JTree` 组件展示了树的结构。其余的方法是常规的——请参见 Listing 12.13 中的源代码。\n\n关于这个树模型有一个惊的事实：它实际上描述了一棵无限树。你可以通过追踪一个\
  \ `WeakReference` 对象来验证这一点。点击名为 `referent` 的变量。它会直接带你回到原始对象。你得到了一个相同的子树，并且你可以再次打开它的\
  \ `WeakReference` 对象，循环无限。当然，你不能存储无限的节点集；树模型在用户展开父节点时按需生成节点。Listing 12.12 显示了示例程序的帧类。\n\
  \n\n\n\n#  12.13 `treeModel/ObjectTreeModel.java`\n\n```java\npackage treeModel;\n\
  \nimport java.lang.reflect.*;\nimport java.util.*;\nimport javax.swing.event.*;\n\
  import javax.swing.tree.*;\n\n/**\n * 此树模型描述了 Java 对象的树结构。子节点是存储在\n * 变量中的对象。\n\
  \ */\npublic class ObjectTreeModel implements TreeModel\n{\n   private Variable\
  \ root;\n   private EventListenerList listenerList = new EventListenerList();\n\n\
  \   /**\n    * 构建一个空树。\n    */\n   public ObjectTreeModel()\n   {\n      root =\
  \ null;\n   }\n\n   /**\n    * 将根设置为指定的变量。\n    * @param v 被此树描述的变量\n    */\n  \
  \ public void setRoot(Variable v)\n   {\n      Variable oldRoot = v;\n      root\
  \ = v;\n      fireTreeStructureChanged(oldRoot);\n   }\n\n   public Object getRoot()\n\
  \   {\n      return root;\n   }\n\n   public int getChildCount(Object parent)\n\
  \   {\n      return ((Variable) parent).getFields().size();\n   }\n\n   public Object\
  \ getChild(Object parent, int index)\n   {\n      ArrayList<Field> fields = ((Variable)\
  \ parent).getFields();\n      var f = (Field) fields.get(index);\n      Object parentValue\
  \ = ((Variable) parent).getValue();\n      try\n      {\n         return new Variable(f.getType(),\
  \ f.getName(), f.get(parentValue));\n      }\n      catch (IllegalAccessException\
  \ e)\n      {\n         return null;\n      }\n   }\n\n   public int getIndexOfChild(Object\
  \ parent, Object child)\n   {\n      int n = getChildCount(parent);\n      for (int\
  \ i = 0; i < n; i++)\n         if (getChild(parent, i).equals(child)) return i;\n\
  \      return -1;\n   }\n\n   public boolean isLeaf(Object node)\n   {\n      return\
  \ getChildCount(node) == 0;\n   }\n\n   public void valueForPathChanged(TreePath\
  \ path, Object newValue)\n   {\n   }\n\n   public void addTreeModelListener(TreeModelListener\
  \ l)\n   {\n      listenerList.add(TreeModelListener.class, l);\n   }\n\n   public\
  \ void removeTreeModelListener(TreeModelListener l)\n   {\n      listenerList.remove(TreeModelListener.class,\
  \ l);\n   }\n\n   protected void fireTreeStructureChanged(Object oldRoot)\n   {\n\
  \      var event = new TreeModelEvent(this, new Object[] { oldRoot });\n      for\
  \ (TreeModelListener l : listenerList.getListeners(TreeModelListener.class))\n \
  \        l.treeStructureChanged(event);\n   }\n}\n```\n\n# 12.14 `treeModel/Variable.java`\n\
  \n```java\npackage treeModel;\n\nimport java.lang.reflect.*;\nimport java.util.*;\n\
  \n/**\n * 具有类型、名称和值的变量。\n */\npublic class Variable\n{\n   private Class<?> type;\n\
  \   private String name;\n   private Object value;\n   private ArrayList<Field>\
  \ fields;\n\n   /**\n    * 构建一个变量。\n    * @param aType 类型\n    * @param aName 名称\n\
  \    * @param aValue 值\n    */\n   public Variable(Class<?> aType, String aName,\
  \ Object aValue)\n   {\n      type = aType;\n      name = aName;\n      value =\
  \ aValue;\n      fields = new ArrayList<>();\n\n      // 如果有类类型则查找所有字段，但我们不扩展字符串\n\
  \      // 和空值\n\n      if (!type.isPrimitive() && !type.isArray() && !type.equals(String.class)\
  \ \n            && value != null)\n      {\n         // 获取该类及其所有父类的字段\n        \
  \ for (Class<?> c = value.getClass(); c != null; c = c.getSuperclass())\n      \
  \   {\n            Field[] fs = c.getDeclaredFields();\n            AccessibleObject.setAccessible(fs,\
  \ true);\n\n            // 获取所有静态字段\n            for (Field f : fs)\n          \
  \     if (!Modifier.isStatic(f.getModifiers())) fields.add(f);\n         }\n   \
  \   }\n   }\n\n   /**\n    * 获取此变量的值。\n    * @return 值\n    */\n   public Object\
  \ getValue()\n   {\n      return value;\n   }\n\n   /**\n    * 获取此变量的所有非静态字段。\n\
  \    * @return 描述字段的变量列表\n    */\n   public ArrayList<Field> getFields()\n   {\n\
  \      return fields;\n   }\n\n   public String toString()\n   {\n      String r\
  \ = type + \" \" + name;\n      if (type.isPrimitive()) r += \"=\" + value;\n  \
  \    else if (type.equals(String.class)) r += \"=\" + value;\n      else if (value\
  \ == null) r += \"=null\";\n      return r;\n   }\n}\n```\n\n# `javax.swing.tree.TreeModel`\
  \ 1.2\n\n* `Object getRoot()` 返回根节点。\n* `int getChildCount(Object parent)` 获取 `parent`\
  \ 节点的节点数量。\n* `Object getChild(Object parent, int index)` 获取 `parent` 节点在指定索引处的子节点。\n\
  * `int getIndexOfChild(Object parent, Object child)` 获取 `child` 在 `parent` 节点中的索引。\n\
  * `boolean isLeaf(Object node)` 如果 `node` 是叶子节点则返回 `true`。\n* `void addTreeModelListener(TreeModelListener\
  \ l)` 添加监听器。\n* `void removeTreeModelListener(TreeModelListener l)` 移除监听器。\n* `void\
  \ valueForPathChanged(TreePath path, Object newValue)` 在路径上的值变化时被调用。\n\n# 12.5 高级\
  \ AWT\n\n原始的 JDK 1.0 拥有非常简单的形状绘制机制。你只需选择颜色和画笔，然后调用 `Graphics` 类的方法，如 `drawRect`\
  \ 或 `fillOval`。Java 2D API 支持更多的选项。\n\n### 12.5.1 渲染流水线\n\n要绘制形状，请遵循以下步骤：\n\n1.\
  \ 获取 `Graphics2D` 类的对象。该类是 `Graphics` 类的子类。从 Java 1.2 开始，`paint` 和 `paintComponent`\
  \ 等方法会自动接收 `Graphics2D` 类的对象。只需进行转换，如下所示：\n\n```java\npublic void paintComponent(Graphics\
  \ g)\n{\n   var g2 = (Graphics2D) g;\n   . . .\n}\n```\n\n2. 使用 `setRenderingHints`\
  \ 方法设置*渲染提示*（rendering hints）——即速度与绘制质量之间的权衡。\n\n```java\nRenderingHints hints =\
  \ . . .;\ng2.setRenderingHints(hints);\n```\n\n3. 使用 `setStroke` 方法设置*描边*（stroke）。描边绘制形状的轮廓。你可以选择粗度并在实线和虚线之间切换。\n\
  \n```java\nStroke stroke = . . .;\ng2.setStroke(stroke);\n```\n\n4. 使用 `setPaint`\
  \ 方法设置*画料*（paint）。画料填充如描边或形状内部的区域。你可以创建纯色画料、色调变化的画料或平铺的填充模式。\n\n```java\nPaint paint\
  \ = . . .;\ng2.setPaint(paint);\n```\n\n5. 使用 `clip` 方法设置*裁剪区域*（clipping region）。\n\
  \n```java\nShape clip = . . .;\ng2.clip(clip);\n```\n\n\n\n6. 使用 `transform` 方法设置从用户空间到设备空间的\
  \ `transformation`（变换）。如果你觉得在自定义坐标系中定义形状比使用像素坐标更符合你的习惯，请使用变换。\n\n```\nAffineTransform\
  \ transform = . . .;\ng2.transform(transform);\n```\n\n7. 使用 `setComposite` 方法设置一个\
  \ `composition rule`（组合规则），描述如何将新像素与现有像素结合。\n\n```\nComposite composite = . . .;\n\
  g2.setComposite(composite);\n```\n\n8. 创建一个形状。Java 2D API 提供了许多形状对象和方法来组合形状。\n\n\
  ```\nShape shape = . . .;\n```\n\n9. 绘制或填充该形状。如果你绘制该形状，它的轮廓会被描边；如果你填充该形状，它的内部会被涂色。\n\
  \n```\ng2.draw(shape);\ng2.fill(shape);\n```\n\n当然，在许多实际情况下，你并不需要这些步骤。2D 图形上下文的设置有有合理的默认值；只有在你想要偏离默认设置时，才更改它们。\n\
  \n在接下来的章节中，你将看到如何描述形状、描边、画笔、变换和组合规则。\n\n各种 `set` 方法只是设置 2D 图形上下文的状态。它们不会导致任何绘制操作。同样，当你构造\
  \ `Shape` 对象时，不会发生绘制。只有当你调用 `draw` 或 `fill` 时，形状才会被渲染。那时，新的形状会在 `rendering pipeline`（渲染流水线）中计算（参见图\
  \ 12.31）。\n\n![Figure](img/fig07-01.jpg)图 12.31：渲染流水线\n\n在渲染流水线，执行以下步骤以渲染形状：\n\n\
  1. 对形状的路径进行描边。\n2. 对形状进行变换。\n3. 对形状进行裁剪。如果形状与裁剪区域没有交集，则处理停止。\n4. 填充裁剪后剩余的形状。\n5.\
  \ 将填充形状的像素与现有像素进行组合。（在图 12.31 中，圆是现有像素的一部分，而杯形叠加在它上面。）\n\n在下一节中，你将看到如何定义形状。然后，我们将转向\
  \ 2D 图形上下文设置。\n\n`java.awt.Graphics2D` 1.2\n\n* `void draw(Shape s)`\n  用当前画笔绘制给定形状的轮廓。\n\
  * `void fill(Shape s)`\n  用当前画笔填充给定形状的内部。\n\n### 12.5.2. `Shape` 类层次结构\n\n这里是 `Graphics`\
  \ 类中用于绘制形状的一些方法：\n\n```\ndrawLine\ndrawRectangle\ndrawRoundRect\ndraw3DRect\ndrawPolygon\n\
  drawPolyline\ndrawOval\ndrawArc\n```\n\n此外还有相应的 `fill` 方法。这些方法从 JDK 1.0 以来一直存在于\
  \ `Graphics` 类中。Java 2D API 使用了完全不同的面向对象的方法。它不是使用方法，而是类：\n\n```\nLine2D\nRectangle2D\n\
  RoundRectangle2D\nEllipse2D\nArc2D\nQuadCurve2D\nCubicCurve2D\nGeneralPath\n```\n\
  \n这些类都实现了 `Shape` 接口，我们将在接下来的章节中检查它。\n\n`Line2D`、`Rectangle2D`、`RoundRectangle2D`、`Ellipse2D`\
  \ 和 `Arc2D` 类对应于 `drawLine`、`drawRectangle`、`drawRoundRect`、`drawOval` 和 `drawArc`\
  \ 方法。（“3D 矩形”的概念已经寿终正寝——没有对应于 `draw3DRect` 方法。）Java 2D API 还提供了两个额外的类——二次曲线和三次曲线，我们将在本节中讨论。没有\
  \ `Polygon2D` 类；相反，`GeneralPath` 类描述了由直线、二次和三次曲线组成的路径。你可以使用 `GeneralPath` 来描述多边形；我们将在本节稍后展示如何操作。\n\
  \n要绘制形状，首先创建一个实现 `Shape` 接口类的对象，然后调用 `Graphics2D` 类的 `draw` 方法。\n\n这些类\n\n```\n\
  Rectangle2D\nRoundRectangle2D\nEllipse2D\nArc2D\n```\n\n都继承自一个共同父类 `RectangularShape`。诚然，椭圆和弧不是矩形，但它们有一个\
  \ `bounding rectangle`（边界矩形）（参见图 12.32）。\n\n![Figure](img/fig07-02.jpg)图 12.32：椭圆和弧的边界矩形\n\
  \n每个以“2D”结尾的类都有两个子类，用于指定 `float` 或 `double` 数量的坐标。在第一卷中，你已经遇到过 `Rectangle2D.Float`\
  \ 和 `Rectangle2D.Double`。\n\n其他类也使用了相同的方案，例如 `Arc2D.Float` 和 `Arc2D.Double`。\n\n\
  内部，所有图形类都使用 `float`，因为 `float` 数字占据的空间较小，但对于几何计算具有足够的精度。然而，Java 语言使得 `float` 稍微有点麻烦。由于某种原因，大多数方法使用\
  \ `double`。\n\n```java\nvar floatRect = new Rectangle2D.Float(5F, 10F, 7.5F, 15F);\n\
  var doubleRect = new Rectangle2D.Double(5, 10, 7.5, 15);\n```\n\n实际上，`Graphics2D`\
  \ 类的大多数方法使用 `double`，所以如果你有一个 `float`，你必须对它进行强制转换，或者使用特定的 `float` 方法（如果可用）。\n\n\n\
  \n\n如果弧是椭形的，那么弧角的计算完全并不直观。API 文档指出：“角度是相对于非正方形的边界矩形指定的，使得 45 度始终落在从椭圆中心到边界矩形右上角的连线线上。因此，如果边界矩形在某条轴上明显比另一条轴长，则弧段起点和终点的角度将沿着框架较长的那条轴发生更远的倾斜。”遗憾的是，文档没有说明如何计算这种“倾斜”。以下是详细步骤：\n\
  \n假设弧的中心是原点，点 `(x, y)` 位于弧上。你可以使用以下公式获取倾斜角：\n\n```\nskewedAngle = Math.toDegrees(Math.atan2(-y\
  \ * height, x * width));\n```\n\n结果是一个介于 `-180` 和 `180` 之间的值。通过这种方法计算倾斜的起始和结束角度。然后，计算这两个倾斜角度之间的差。如果起始角度或差值为负，则给起始角度加上\
  \ `360`。最后，将起始角度和差传递给弧的构造函数。\n\n如果你运行本节末尾的示例程序，可以直观地检查此计算为弧构造函数产生了正确的值（参见图 12.39）。\n\
  \nJava 2D API 支持 `quadratic`（二次）和 `cubic`（三次）曲线。在本章，我们不深入探讨这些曲线的数学原理。你可以通过运行列表 12.15\
  \ 中的程序来感受这些曲线的外观。二次曲线由两个*端点*和一个*控制点*指定（参见图 12.37）。三次曲线（图 12.38）有两个控制点。移动控制点会改变曲线的形状。\n\
  \n![Figure](img/fig07-07.jpg)图 12.37: 二次曲线![Figure](img/fig07-08.jpg)图 12.38: 三次曲线\n\
  \n要构造二次和三次曲线，需要提供端点控制点的坐标。例如：\n\n```\nvar q = new QuadCurve2D.Double(startX, startY,\
  \ controlX, controlY, endX, endY);\nvar c = new CubicCurve2D.Double(startX, startY,\
  \ control1X, control1Y,\n   control2X, control2Y, endX, endY);\n```\n\n二次曲线并不灵活，在实践中并不常用。然而，三次曲线（例如由\
  \ `CubicCurve2D` 类绘制的贝塞尔曲线）非常常见。通过组合许多三次曲线并使连接处的斜率匹配，你可以创建复杂的、平滑的形状。更多信息请参考 John\
  \ F. Hughes 等人编写的*Computer Graphics: Principles and Practice, Third Edition*。\n\n\
  你可以构建线段、二次曲线和三次曲线的任意序列，并将它们存储在 `GeneralPath` 对象中。使用 `moveTo` 方法指定路径的第一个坐标，例如：\n\n\
  ```\nvar path = new GeneralPath();\npath.moveTo(10, 20);\n```\n\n然后你可以通过调用 `lineTo`、`quadTo`\
  \ 或 `curveTo` 方法之一来扩展路径。这些方法分别通过直线、二次曲线或三次曲线扩展路径。调用 `lineTo` 时，提供端点。对于两个曲线方法，提供控制点，然后提供端点。例如：\n\
  \n```\npath.lineTo(20, 30);\npath.curveTo(control1X, control1Y, control2X, control2Y,\
  \ endX, endY);\n```\n\n调用 `closePath` 方法关闭路径。它会绘制一条返回路径起点的直线。\n\n要制作多边形，只需调用 `moveTo`\
  \ 移动到第一个顶点，然后重复调用 `lineTo` 访问其他顶点。最后，调用 `closePath` 关闭多边形。列表 12.15 中的程序更详细地展示了这一点。\n\
  \n通用路径并不非是连通的。你可以随时调用 `moveTo` 来启动一个新的路径段。\n\n最后，你可以使用 `append` 方法向通用路径添加任意的 `Shape`\
  \ 对象。形状的轮廓被添加到路径末尾。`append` 方法的第二个参数为 `true`，如果新形状应与路径的最后一点连接，否则为 `false`。例如，调用：\n\
  \n```\nRectangle2D r = . . .;\npath.append(r, false);\n```\n\n这会将矩形的轮廓添加到路径中，但不与现有路径连接。但是：\n\
  \n```\npath.append(r, true);\n```\n\n这会从路径的终点到矩形的起点添加一条直线，然后将矩形轮廓添加到路径中。\n\n###\
  \ 程序细节\n\n从组合框中选择一个形状生成器。程序包含以下形状的生成器：\n\n*   直线\n*   矩形、圆矩形和椭圆\n*   弧（除了弧本身，还会显示边界矩形以及起始结束角度）\n\
  *   多边形（使用 `GeneralPath`）\n*   二次和三次曲线\n\n使用鼠标调整控制点。当你移动它们时，形状会不断重绘。\n\n该程序有点复杂，因为它处理多种形状并支持拖动控制点。\n\
  \n抽象父类 `ShapeMaker` 封装了形状生成器类的共性。每个形状都有固定数量的控制点，用户可以移动这些点。`getPointCount` 方法返回该值。抽象方法\n\
  \n```\nShape makeShape(Point2D[] points)\n```\n\n根据控制点的当前位置计算实际形状。`toString` 方法返回类名，以便\
  \ `ShapeMaker` 对象可以简单地放入 `JComboBox` 中。\n\n为了启用控制点的拖动，`ShapePanel` 类处理了鼠标点击和鼠标移动事件。如果可以在矩形上方按下鼠标，随后的鼠标拖动将移动矩形。\n\
  \n大多数形状生成器类都是简单的——它们的 `makeShape` 方法只需构造并返回请求的形状。然而，`ArcMaker` 类需要计算倾斜的起始和结束角度。此外，为了证明计算确实是正确的，返回的形状是一个\
  \ `GeneralPath`，包含了弧本身、边界矩形以及从弧中心到角度控制点的直线（参见图 12.39）。\n\n![Figure](img/fig07-09.jpg)图\
  \ 12.39: `ShapeTest`程序 Listing 12.15 shape/ShapeTest.java\n\n\n\n\n\n```java\npackage\
  \ shape;\n\nimport java.awt.*;\nimport java.awt.event.*;\nimport java.awt.geom.*;\n\
  import java.util.*;\nimport java.util.random.*;\nimport javax.swing.*;\n\n/**\n\
  \ * 此程序演示了各种 2D 形状。\n * @version 1.05 2023-08-29\n * @author Cay Horstmann\n */\n\
  public class ShapeTest\n{\n   public static void main(String[] args)\n   {\n   \
  \   EventQueue.invokeLater(() ->\n         {\n            var frame = new ShapeTestFrame();\n\
  \            frame.setTitle(\"ShapeTest\");\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n         });\n   }\n}\n\n/**\n * 此框架包含一个用于选择形状的组合框和一个用于绘制形状的组件。\n\
  \ */\nclass ShapeTestFrame extends JFrame\n{\n   public ShapeTestFrame()\n   {\n\
  \      var comp = new ShapeComponent();\n      add(comp, BorderLayout.CENTER);\n\
  \      var comboBox = new JComboBox<ShapeMaker>();\n      comboBox.addItem(new LineMaker());\n\
  \      comboBox.addItem(new RectangleMaker());\n      comboBox.addItem(new RoundRectangleMaker());\n\
  \      comboBox.addItem(new EllipseMaker());\n      comboBox.addItem(new ArcMaker());\n\
  \      comboBox.addItem(new PolygonMaker());\n      comboBox.addItem(new QuadCurveMaker());\n\
  \      comboBox.addItem(new CubicCurveMaker());\n      comboBox.addActionListener(event\
  \ ->\n         {\n            ShapeMaker shapeMaker = comboBox.getItemAt(comboBox.getSelectedIndex());\n\
  \            comp.setShapeMaker(shapeMaker);\n         });\n      add(comboBox,\
