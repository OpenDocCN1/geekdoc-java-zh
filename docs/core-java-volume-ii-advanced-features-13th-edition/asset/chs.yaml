  \ API 允许你将虚拟机嵌入到 C 中。假设你处于一个 C++ 程序中并想要调用。以下是初始化虚拟机所需的最小代码：\n\n```c\nJavaVMOption\
  \ options[1];\nJavaVMArgs vm_args;\nJavaVM *jvm;\nJNIEnv *env;\n\noptions[0].optionString\
  \ = \"-Djava.path=.\";\n\nmemset(&vm_args, 0, sizeof(vm_args));\nvm_args.version\
  \ = JNI_VERSION_1_2;\nvm_args.nOptions = 1;\nvm_args.options = options;\n\nJNI_CreateJavaVM(&jvm,\
  \ (void**)env, &vm_args);\n```\n\n对 `JNI_CreateJavaVM` 的调用创建了虚拟机并填充了指向虚拟机的指针 `jvm`\
  \ 以及指向执行环境的指针 `env`。你可以为虚拟机提供任意数量的选项。只需增加 `options` 数组的大小和 `vm_args.nOptions` 的值即可。例如，\n\
  \n```c\noptions[0].optionString = \"-Djava.compiler=NONE\";\n```\n\n禁用即时编译器（JIT\
  \ 编译器）。\n\n当你遇到问题、程序崩溃、拒绝初始化虚拟机或无法加载类时，开启 JNI 调试模式。设置选项为\n\n```c\noptions[0].optionString\
  \ = \"-verbose:jni\";\n```\n\n你将看到大量信息，指示初始化虚拟机的进度。如果没有看到你的类被加载，请检查你的路径和类路径设置。\n\
  \n一旦设置好虚拟机，就可以像前面章节中那样调用 Java 方法。只需按照通常方式使用 `env` 指针即可。\n\n你仅需要 `jvm` 指针来调用 invocation\
  \ API 中的其他函数。目前只有四个这样的函数。最重要的一个是终止虚拟机的函数：\n\n```c\n(*jvm)->DestroyJavaVM(jvm);\n\
