  \ `true`。\n\n## 6.6 格式化与解析\n\n`DateTimeFormatter` 类提供了三种格式打印日期/时间：\n\n* 预定义的标准格式化\n\
  * 特定区域格式化\n* 使用自定义模式的格式化\n\n要使用标准格式化之一，只需调用其 `format` 方法：\n\n```\nString formatted\
  \ = DateTimeFormatter.ISO_OFFSET_TIME.format(apollo11launch);\n// 1969-07-16T09:32-04\n\
  ```\n\n表 6.1：预定义格式化\n\n| 格式化 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `BASIC_ISO_DATE`\
  \ | 无分隔符的年、月、日、时区偏移量 | `196907160400` |\n| `ISO_LOCAL_DATE`, `ISO_LOCAL_TIME`, `ISO_LOCAL_DATE_TIME`\
  \ | 有分隔符 `-` 和 `T` | `1969-07-16`, `09:32:00`, `1969-07-16T09:32:00` |\n| `ISO_OFFSET_DATE`,\
  \ `ISO_OFFSET_TIME`, `ISO_OFFSET_DATE_TIME` | 类似于 `ISO_LOCAL_XXX`，但带有时区偏移 | `1969-07-16-04:00`,\
  \ `09:32:00-04:00`, `1969-07-16T09:32:00-04:00` |\n| `ISO_ZONED_DATE_TIME` | 带有偏移量和时区\
  \ ID | `1969-07-16T09:32-04:00[America/New_York]` |\n| `ISO_INSTANT` | 在 UTC 中，用\
  \ `Z` 表示时区 ID | `1969-07-16T13:32:00Z` |\n| `ISO_DATE`, `ISO_TIME`, `ISO_DATE_TIME`\
  \ | 类似于 `ISO_OFFSET_XXX`，但时区信息可选的 | `1969-07-16-04:00`, `09:32:00-04:00`, `1969-07-16T09:32:00-04:00`\
  \ |\n| `ISO_ORDINAL_DATE` | `LocalDate` 的年份和年数 | `1969-197-04:00` |\n| `ISO_WEEK_DATE`\
  \ | `LocalDate` 的年、周和星期 | `1969-W29-3-04:00` |\n| `RFC_1123_DATE_TIME` | RFC 822\
  \ 规定的邮件时间戳标准，RFC 1123 将年份更新为四位数 | `Wed, 16 Jul 1969 09:32:00 -0400` |\n\n标准格式化主要用于机器可读的时间戳。向人类读者展示日期和时间，请使用特定区域的格式化。对于日期和时间有四种样式：`SHORT`、`MEDIUM`、`LONG`\
  \ 和 `FULL`。\n\n静态方法 `ofLocalizedDate`、`ofLocalizedTime` 和 `ofLocalizedDateTime`\
  \ 创建此类格式化。例如：\n\n```\nDateTimeFormatter formatter = DateTimeFormatter.ofLocalizedDateTime(FormatStyle.LONG);\n\
  String formatted = formatter.format(apollo11launch);\n// July 16, 1969 9:32:00 AM\
  \ EDT\n```\n\n这些方法使用默认区域。要更改不同的区域，只需使用 `withLocale` 方法。\n\n```\nformatted = formatter.withLocale(Locale.FRENCH).format(apollo11launch);\n\
  // 16 juillet 1969 09:32:00 EDT\n```\n\n`DayOfWeek` 和 `Month` 枚举拥有 `getDisplayName`\
  \ 方法，用于不同的区域和格式提供星期和月份名称。\n\n```java\nfor (DayOfWeek w : DayOfWeek.values())\n \
  \  System.out.print(w.getDisplayName(TextStyle.SHORT, Locale.ENGLISH) + \" \");\n\
  // 输出 Mon Tue Wed Thu Fri Sat Sun\n```\n\n有关区域的更多信息请见第 7 章。\n\n表 6.2：特定区域格式格式样式\n\
  \n| 样式 | 日期 | 时间 |\n| :--- | :--- | :--- |\n| `SHORT` | `7/16/69` | `9:32 AM` |\n\
  | `MEDIUM` | `Jul 16, 1969` | `9:32:00 AM` |\n| `LONG` | `July 16, 1969` | `9:32:00\
  \ AM EDT` |\n| `FULL` | `Wednesday, July 16, 1969` | `9:32:00 AM EDT` |\n\n`java.time.format.DateTimeFormatter`\
  \ 类旨在替代 `java.util.DateFormat`。如果为了后兼容需要后者的实例，请调用 `formatter.toFormat()`。\n\n\n\n\
  \n最后，你可以通过指定模式来自定义你自己的日期格式。例如：\n\n```\nformatter = DateTimeFormatter.ofPattern(\"\
  E yyyy-MM-dd HH:mm\");\n```\n\n会将日期格式化为 `Wed 1969-07-16 09:32` 形式。每个字母代表一个不同的时间字段，字母重复的次数根据规则选择特定的格式，这些规则非常晦奥，似乎是随着时间的推移自然形成的。表\
  \ 6.3 显示了最常用的模式元素。\n\n### 表 6.3：日期/时间格式中常用的格式化符号\n\n| `ChronoField` 或用途 | 示例 |\n\
