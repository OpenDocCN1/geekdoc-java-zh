  \    设置或获取标记，指示此格式化器是否仅解析整数值。\n* `void setGroupingUsed(boolean newValue)`\n* `boolean\
  \ isGroupingUsed()`\n    设置或获取标记，指示此格式化器是否产生并识别分组分隔符（如 `100,000`）。\n* `void setMinimumIntegerDigits(int\
  \ newValue)`\n* `int getMinimumIntegerDigits()`\n* `void setMaximumIntegerDigits(int\
  \ newValue)`\n* `int getMaximumIntegerDigits()`\n* `void setMinimumFractionDigits(int\
  \ newValue)`\n* `int getMinimumFractionDigits()`\n* `void setMaximumFractionDigits(int\
  \ newValue)`\n* `int getMaximumFractionDigits()`\n    设置或获取数字整数部分或小数部分允许的最大或最小位数。\n\
  \n### 7.2.2. `DecimalFormat` 类\n\n在大多数区域语言中，你在上一节看到的 `NumberFormat` 工厂方法返回 `DecimalFormat`\
  \ 类的实例。该类描述了世界各地各种格式化变体。你可以修改单个设置，也可以创建一个全新的格式化器。模式语法让这变得更加方便。\n\n\n\n\n该模式描述了所需的和可选的数字，以及正数和负数的的前缀和后缀。还有一些较为冷门的设置——请参见\
  \ Table 7.3。\n\n考虑此示例：\n\n```\nvar formatter = new DecimalFormat(\"0.00;(#)\");\n\
  ```\n\n分号分隔正数和可选的负数部分。从正数部分可以看出，整数部分至少有一个数字，小数部分至少有两个数字。这适用于所有数字，无论正负号。负数使用会计格式——前缀为\
  \ `(`，后缀为 `)`。\n\n前缀或后缀可以包含货币符号 `¤` (U+00A4)，用于表示货币符号应该所在的位置。\n\n如果你需要在前缀或后缀中插入特殊字符，请在其前面加一个单引号。例如，前缀\
  \ `'\\#` 是字面哈希符号，而 `'o''clock'` 有一个引号。\n\n### 表 7.3：`DecimalFormat` 属性\n\n| 属性名称\
  \ | 说明 | 模式 |\n| --- | --- | --- |\n| `groupingSize` | 组合的整数数字个数（通常为 3 或 4） | 上一个\
  \ `,` 与整数部分结束之间的数字个数，例如组合大小为 3 时使用 `#,###`。 |\n| `minimum`/`maximumFractionDigits`\
  \ | 小数部分数字的最小和最大个数 | 在小数部分中使用必需 (`0`) 和可选 (`#`) 的数字：`.00##`。 |\n| `minimumIntegerDigits`\
  \ | 整数部分的最小数字个数 | 在整数部分中使用必需 (`0`) 的数字：`000`。 |\n| `maximumIntegerDigits` | 整数的最大数字个数\
  \ | 使用指数计数法时，整数部分中 `#` 数字的个数，例如 `###,##0.00E0`。否则，无法在模式中设置。 |\n| — | 指数部分的最小数字个数\
  \ | 在 `E` 部分中使用 `0` 数字：`#.00E00`。 |\n| `multiplier` | 百分比、千分数的倍数 | 使用 `%` 表示 100，使用\
  \ `‰` (U+2030) 表示 1000。 |\n| `positivePrefix`/`Suffix`, `negativePrefix`/`Suffix`\
  \ | 正数或负数的前缀和后缀 | 用字面前缀或后缀包裹模式的正数或负数部分，例如 `+#0.00;(#)` 对正数使用 `+` 前缀且无后缀，并将负数置于括号中。\
  \ |\n| `decimalSeparatorAlwaysShown` | 如果小数部分为零则显示分隔符，则为 `true` | 无法在模式中设置。 |\n\n\
  数字、分隔符和其他杂数字部分的实际符号取自 `DecimalFormatSymbols` 对象，你也可以自定义它。Table 7.4 列出了它的属性。\n\n\
  ### 表 7.4：`DecimalFormatSymbol` 属性\n\n| 属性 | 类型 | 说明 |\n| --- | --- | --- |\n| `currencySymbol`\
  \ | `String` | 字符串，如 `\"$\"` 或 `\"EUR\"`，用于前缀或后缀包含 `¤` 货币符号的地方 |\n| `decimalSeparator`,\
  \ `monetaryDecimalSeparator` | `char` | 用于数字或货币值的小数分隔符 |\n| `exponentSeparator`\
  \ | `String` | 指数部分前的字符串，通常为 `\"E\"` |\n| `groupingSeparator`, `monetaryGroupingSeparator`\
  \ (since Java 15) | `char` | 用于数字或货币值的分组分隔符 |\n| `infinity`, `naN` | `String` |\
  \ 用于格式化 `Double.POSITIVE_INFINITY`、`Double.NEGATIVE_INFINITY` 和 `Double.NaN` 的字符串\
  \ |\n| `internationalCurrencySymbol` | String | ISO 4217 货币符号——参见 Section 7.2.3\
  \ |\n| `minusSign` | `char` | 无负数模式时使用的负号 |\n| `percent`, `perMill` | `char` | 用于百分比或千分数的字符\
  \ |\n| `zeroDigit` | `char` | 数字零的字符。其他数字是随后的九个 Unicode 字符。 |\n\n假设例如，你想以美国风格显示数字，使用\
  \ `,` 作为分组分隔符，`..` 作为小数点分隔符，无论本地设置如何。自定义 `DecimalFormatSymbols` 和格式化器：\n\n```\n\
  DecimalFormatSymbols symbols = new DecimalFormatSymbols(locale);\nsymbols.setGroupingSeparator(',');\n\
  symbols.setDecimalSeparator('.');\nDecimalFormat formatter = (DecimalFormat) NumberFormat.getNumberInstance(locale);\n\
  formatter.setDecimalFormatSymbols(symbols);\n```\n\n### 7.2.3. 货币\n\n要格式化货币值，你可以使用\
  \ `NumberFormat.getCurrencyInstance` 方法。然而，该方法并不灵活——它返回一个单一货币的格式化器。假设你为一位美国客户准备一张发票，其中某些金额是美元，另一些是欧元。你不能直接使用两个格式化器：\n\
  \n```\nNumberFormat dollarFormatter = NumberFormat.getCurrencyInstance(Locale.US);\n\
  NumberFormat euroFormatter = NumberFormat.getCurrencyInstance(Locale.GERMANY);\n\
  ```\n\n你的发票看起来会非常奇怪，某些值显示为 $100,000，而另一些显示为 100.000 €。（注意欧元值使用了逗号。）\n\n相反，使用 `Currency`\
  \ 来设置格式化器。以下是为你设置欧元的方法：\n\n```\nNumberFormat euroFormatter = NumberFormat.getCurrencyInstance(Locale.US);\n\
  euroFormatter.setCurrency(Currency.getInstance(\"EUR\"));\n```\n\n货币标识由 ISO 4217\
  \ 定义——参见 Section 7.2.3。Table 7.5 提供了部分列表。\n\n### 表 7.5：货币标识\n\n| 货币 | 标识 | 数字代码\
  \ |\n| --- | --- | --- |\n| 美元 | USD | 840 |\n| 欧元 | EUR | 978 |\n| 英镑 | GBP | 826\
  \ |\n| 日元 | JPY | 392 |\n| 元 | CNY | 156 |\n| 印度卢比 | INR | 356 |\n| 俄罗斯卢布 | RUB\
  \ | 643 |\n\n`java.util.Currency`\n\n*   `static Currency getInstance(String currencyCode)`\n\
  *   `static Currency getInstance(Locale locale)`\n    返回给定 ISO 4217 代码或本地的 `Currency`\
  \ 实例。\n*   `String toString()`\n*   `String getCurrencyCode()`\n*   `String getNumericCode()`\n\
  *   `String getNumericCodeAsString()`\n    获取此货币的 ISO 4217 字母或数字代码。\n*   `String\
  \ getSymbol()`\n*   `String getSymbol(Locale locale)`\n    获取默认本地或给定本地的此货币格式符号。例如，USD\
  \ 的符号取决于本地可能是 `\"$\"` 或 `\"US\"`。\n*   `int getDefaultFractionDigits()`\n    获取此货币的默认小数。\n\
  *   `static Set<Currency> getAvailableCurrencies()`\n    获取所有可用货币。\n\n## 7.3 日期和时间\n\
  \n当你格式化日期和时间时，需要考虑四个问题：\n\n*   月份和星期的名称应该用本地语言显示。\n*   年、月、日的顺序将取决于本地偏好。\n*   格列哥历可能不是表示日期的本地偏好。\n\
  *   必须考虑所在地的时区。\n\n`java.time` 包中的 `DateTimeFormatter` 类处理这些问题。选择 Table 7.6 所示的格式样式之一。然后获取格式化器：\n\
  \n```\nFormatStyle style = . . .; // 之一 FormatStyle.SHORT, FormatStyle.MEDIUM, .\
  \ . . \nDateTimeFormatter dateFormatter = DateTimeFormatter.ofLocalizedDate(style);\n\
  DateTimeFormatter timeFormatter = DateTimeFormatter.ofLocalizedTime(style);\nDateTimeFormatter\
  \ dateTimeFormatter = DateTimeFormatter.ofLocalizedDateTime(style);\n   // 或 DateTimeFormatter.ofLocalizedDateTime(dateStyle,\
  \ timeStyle)\n```\n\n这些格式化器使用当前本地设置。要使用不同的本地设置，请使用 `withLocale` 方法：\n\n\n\n\n\n\
  ```\nDateTimeFormatter dateFormatter =\n   DateTimeFormatter.ofLocalizedDate(style).withLocale(locale);\n\
  ```\n\n现在你可以格式化 `LocalDate`、`LocalDateTime`、`LocalTime` 或 `ZonedDateTime` 了：\n\n\
  ```\nZonedDateTime appointment = . . .;\nString formatted = formatter.format(appointment);\n\
  ```\n\n### 表 7.6：日期和时间格式样式\n\n| 样式 | 日期 | 时间 |\n| --- | --- | --- |\n| `SHORT` |\
  \ `7/16/69` | `9:32 AM` |\n| `MEDIUM` | `Jul 16, 1969` | `9:32:00 AM` |\n| `LONG`\
  \ | `July 16, 1969` | `en-US` 下为 `9:32:00 AM EDT`，`de-DE` 下为 `9:32:00 MSZ`（仅适用于\
  \ `ZonedDateTime`） |\n| `FULL` | `Wednesday, July 16, 1969` | `en-US` 下为 `9:32:00\
  \ AM EDT`，`de-DE` 下为 `9:32 Uhr MSZ`（仅适用于 `ZonedDateTime`） |\n\n这里我们使用了 `java.time`\
  \ 包中的 `DateTimeFormatter` 类。还有一个旧的 `java.text.DateFormatter` 类可以处理 `Date` 和 `Calendar`\
  \ 对象。\n\n你可以使用 `LocalDate`、`LocalDateTime`、`LocalTime` 或 `ZonedDateTime` 的静态 `parse`\
  \ 方法来解析字符串中的日期或时间：\n\n```\nLocalTime time = LocalTime.parse(\"9:32 AM\", formatter);\n\
  ```\n\n这些方法不适用于解析人类输入，至少在没有预处理的情况下不是。例如，美国的短时间格式器可以解析 `\"9:32 AM\"`，但不能解析 `\"9:32AM\"\
  ` 或 `\"9:32 am\"`。\n\n日期格式化器会解析不存在的日期（例如 11 月 31 日），将其调整为该月的最后一天。\n\n有时，你只需要显示星期和月份的名称，例如在日历应用程序中。调用\
  \ `DayOfWeek` 和 `Month` 举类的 `getDisplayName` 方法。\n\n```\nfor (Month m : Month.values())\n\
  \   System.out.println(m.getDisplayName(textStyle, locale));\n```\n\n[表 7.7] 显示了文本样式。`STANDALONE`\
  \ 版本用于格式化日期之外的显示。例如，在芬兰语中，一月在日期内部是“tammikuuta”，但单独显示时为“tammikuu”。\n\n### 表 7.7：`java.time.format.TextStyle`\
  \ 举类的值\n\n| 样式 | 示例 |\n| --- | --- |\n| `FULL` / `FULL_STANDALONE` | January |\n\
  | `SHORT` / `SHORT_STANDALONE` | Jan |\n| `NARROW` / `NARROW_STANDALONE` | J |\n\
  \n一周的第一天可以是星期六、星期日或星期一，取决于 locale。你可以这样获取：\n\n```\nDayOfWeek first = WeekFields.of(locale).getFirstDayOfWeek();\n\
  ```\n\n[代码列表 7.2] 显示了 `DateFormat` 类的用法。你可以选择一个 locale，查看世界不同地区日期和时间是如何格式化的。\n\n\
  [图 7.2] 显示了程序的 GUI 版本，该程序包含在书的配套代码中。你可能需要安装中文字体才能看到显示的汉字。\n\n![DateFormatTest](img/DateFormatTest.jpg)图\
