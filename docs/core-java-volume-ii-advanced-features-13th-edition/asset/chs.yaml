  \ 或 `PLAIN_MESSAGE` 之一。\n\n### 11.8.2 创建对话框\n\n在上一节中，你学习了如何使用 `JOptionPane` 类来显示一个简单的对话框。在本节中，你将看到如何手动创建一个这样的对话框。\n\
  \n图 11.31 显示了一个典型的模态对话框——一个当用户点击“关于（About）”按钮时显示的程序信息框。\n\n![Figure](img/dialogtest.jpg)图\
  \ 11.31: “关于”对话框\n\n要实现一个对话框，你需要扩展 `JDialog` 类。这本质上与为应用程序的主窗口扩展 `JFrame` 的过程是相同的。具体来说：\n\
  \n1. 在你的对话框的构造函数中，调用父类 `JDialog` 的构造函数。\n2. 添加对话框的用户界面组件。\n3. 添加事件处理程序。\n4. 设置对话框的尺寸。\n\
  \n当你调用父类构造函数时，你需要提供*所有者框架 (owner frame)*、对话框的标题以及*模态性 (modality)*。\n\n所有者框架控制对话框显示的位置。你可以提供\
  \ `null` 作为所有者；这样，对话框将由隐藏的框架所有。\n\n模态性指定了在对话框显示时，应用程序的哪些其他窗口会被阻塞。非模态对话框（modeless\
  \ dialog）不阻塞其他窗口。模态对话框（modal dialog）阻塞应用程序的所有其他窗口（对话框的子窗口除外）。对于用户始终可以的工具箱，你会使用非模态对话框。另一方面，如果你想强制用户在继续之前提供所需的信息，你会使用模态对话框。\n\
  \n以下是对话框的代码：\n\n```java\npublic AboutDialog extends JDialog\n{\n   public AboutDialog(JFrame\
  \ owner)\n   {\n      super(owner, \"About DialogTest\", true);\n      add(new JLabel(\n\
  \         \"<html><h1><i>Core Java</i></h1><hr>By Cay Horstmann</html>\"),\n   \
  \      BorderLayout.CENTER);\n```\n\n```java\n var panel = new JPanel();\n     \
  \ var ok = new JButton(\"OK\");\n\n      ok.addActionListener(event -> setVisible(false));\n\
  \      panel.add(ok);\n      add(panel, BorderLayout.SOUTH);\n      setSize(250,\
  \ 150);\n   }\n}\n```\n\n如所示，构造函数添加了用户界面元素——在本例中，是标签和按钮。它为按钮添加了处理程序并设置了对话框的尺寸。\n\
  \n要显示对话框，请创建一个新的对话框对象并使其可见：\n\n```java\nvar dialog = new AboutDialog(this);\ndialog.setVisible(true);\n\
  ```\n\n实际上，在下方的示例代码中，我们只创建一次对话框，当用户点击“关于”按钮时，我们可以复用它。\n\n```java\nif (dialog ==\
  \ null) // 第一次\n   dialog = new AboutDialog(this);\ndialog.setVisible(true);\n```\n\
  \n当用户点击 OK 按钮时，对话框应该关闭。这在 OK 按钮的事件处理程序中处理：\n\n```java\nok.addActionListener(event\
  \ -> setVisible(false));\n```\n\n当用户通过点击按钮关闭对话框时，对话框也会隐藏。就像 `JFrame` 一样，你可以通过 `setDefaultCloseOperation`\
  \ 方法来覆盖此行为。\n\n列表 11.11 是测试程序框架类的代码。列表 11.12 显示了对话框类。\n\nListing 11.11 dialog/DialogFrame.java\n\
  \n```java\npackage dialog;\n\nimport javax.swing.JFrame;\nimport javax.swing.JMenu;\n\
  import javax.swing.JMenuBar;\nimport javax.swing.JMenuItem;\n\n/**\n * 一个带有菜单的框架，其\
  \ File->About 操作会显示对话框。\n */\npublic class DialogFrame extends JFrame\n{\n   private\
  \ static final int DEFAULT_WIDTH = 300;\n   private static final int DEFAULT_HEIGHT\
  \ = 200;\n   private AboutDialog dialog;\n\n   public DialogFrame()\n   {\n    \
  \  setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\n      // 构建 File 菜单\n\n      var menuBar\
  \ = new JMenuBar();\n      setJMenuBar(menuBar);\n      var fileMenu = new JMenu(\"\
  File\");\n      menuBar.add(fileMenu);\n\n      // 添加 About 和 Exit 菜单项\n\n     \
  \ // About 项显示 About 对话框\n\n      var aboutItem = new JMenuItem(\"About\");\n  \
  \    aboutItem.addActionListener(event ->\n         {\n            if (dialog ==\
  \ null) // 第一次\n               dialog = new AboutDialog(DialogFrame.this);\n   \
  \         dialog.setVisible(true); // 弹出对话框\n         });\n      fileMenu.add(aboutItem);\n\
  \n      // Exit 项退出程序\n\n      var exitItem = new JMenuItem(\"Exit\");\n      exitItem.addActionListener(event\
  \ -> System.exit(0));\n      fileMenu.add(exitItem);\n   }\n}\n```\n\nListing 11.12\
  \ dialog/AboutDialog.java\n\n```java\npackage dialog;\n\nimport java.awt.BorderLayout;\n\
  \nimport javax.swing.JButton;\nimport javax.swing.JDialog;\nimport javax.swing.JFrame;\n\
  import javax.swing.JLabel;\nimport javax.swing.JPanel;\n\n/**\n * 一个示例模态对话框，用于显示消息并等待用户点击\n\
  \ * OK 按钮。\n */\npublic class AboutDialog extends JDialog\n{\n   public AboutDialog(JFrame\
  \ owner)\n   {\n      super(owner, \"About Dialog\", true);\n\n      // 将 HTML 标签居中\n\
  \n      add(\n         \"<html><h1><i>Core Java</i></h1><hr>By Cay Horstmann</html>\"\
  ),\n         BorderLayout.CENTER);\n\n      // OK 按钮关闭对话框\n\n      var ok = new\
  \ JButton(\"OK\");\n      ok.addActionListener(event -> setVisible(false));\n\n\
  \      // 将 OK 按钮添加到南部\n\n      var panel = new JPanel();\n      panel.add(ok);\n\
  \      add(panel, BorderLayout.SOUTH);\n\n      pack();\n   }\n}\n```\n\n\n\n\n\n\
  重要的问题是，对 `setVisible(true)` 的调用会阻塞，直到用户关闭了对话框。这使得实现模态对话框变得非常简单。\n\n你想知道用户是接受了还是取消了对话框。我们的示例代码在显示对话框之前将\
  \ `ok` 标志置为 `false`。只有 OK 按钮的事件处理器会将 `ok` 标志置为 `true`；这就是你如何从对话框获取用户输入的方法。\n\n从非模态对话框传输数据没有那么简单。当显示非模态对话框时，对\
  \ `setVisible(true)` 的调用不会阻塞，程序会在对话框显示时继续运行。如果用户在非模态对话框上选择了项目然后点击 OK，对话框需要向程序中的某个监听器发送事件。\n\
  \n示例程序包含了另一个有用的改进。当你构造 `JDialog` 对象时，你需要指定所有者帧（owner frame）。然而，你经常想要不同的所有者帧显示同一个对话框。更好的做法是在`准备好显示对话框时`选择所有者帧，而不是在构造\
  \ `PasswordChooser` 对象时。\n\n技巧是让 `PasswordChooser` 继承 `JPanel` 而不是 `JDialog`。在 `showDialog`\
  \ 方法中动态构建一个 `JDialog` 对象：\n\n```\npublic boolean showDialog(Frame owner, String\
  \ title)\n{\n   ok = false;\n\n   if (dialog == null || dialog.getOwner() != owner)\n\
  \   {\n      dialog = new JDialog(owner, true);\n      dialog.add(this);\n     \
  \ dialog.pack();\n   }\n\n   dialog.setTitle(title);\n   dialog.setVisible(true);\n\
  \   return ok;\n}\n```\n\n注意，`owner` 等于 `null` 是安全的。\n\n你可以做得更好。有时所有者帧并不可直接可用。从任何\
  \ `parent` 组件中计算它是很容易的，如下：\n\n```\nFrame owner;\nif (parent instanceof Frame)\n\
  \   owner = (Frame) parent;\nelse\n   owner = (Frame) SwingUtilities.getAncestorOfClass(Frame.class,\
  \ parent);\n```\n\n我们在示例程序使用了这种增强方法。`JOptionPane` 类也使用了这种机制。\n\n许多对话框有一个 `default\
  \ button`，如果用户按下触发键（在大多数外观外观实现中为 Enter 键），该按钮会被选中。默认按钮会被特别标记，通常带有粗线条轮廓。\n\n在对话框的\
  \ `root pane` 中设置默认按钮：\n\n```\ndialog.getRootPane().setDefaultButton(okButton);\n\
  ```\n\n如果你遵循了在面板中布局对话框的建议，那么你必须小心，要在将面板封装进对话框之后设置默认按钮。面板对话框本身没有根面板。\n\nListing 11.13\
  \ 是程序的帧类，说明了进入和流出对话框的数据流。Listing 11.14 显示了对话框类。\n\nListing 11.13 dataExchange/DataExchangeFrame.java\n\
  \n```\npackage dataExchange;\n\nimport java.awt.*;\nimport java.awt.event.*;\nimport\
  \ javax.swing.*;\n\n/**\n * 一个带有菜单的帧，其 File->Connect 动作会显示密码对话框。\n */\npublic class\
  \ DataExchangeFrame extends JFrame\n{\n   public static final int TEXT_ROWS = 20;\n\
  \   public static final int TEXT_COLUMNS = 40;\n   private PasswordChooser dialog\
  \ = null;\n   private JTextArea textArea;\n\n   public DataExchangeFrame()\n   {\n\
  \      // 构建 File 菜单\n\n      var mbar = new JMenuBar();\n      setJMenuBar(mbar);\n\
  \      var fileMenu = new JMenu(\"File\");\n      mbar.add(fileMenu);\n\n      //\
  \ 添加 Connect 和 Exit 菜单项\n\n      var connectItem = new JMenuItem(\"Connect\");\n\
  \      connectItem.addActionListener(new ConnectAction());\n      fileMenu.add(connectItem);\n\
  \n      // Exit 项 退出程序\n\n      var exitItem = new JMenuItem(\"Exit\");\n      exitItem.addActionListener(event\
  \ -> System.exit(0));\n      fileMenu.add(exitItem);\n\n      textArea = new JTextArea(TEXT_ROWS,\
  \ TEXT_COLUMNS);\n      add(new JScrollPane(textArea), BorderLayout.CENTER);\n \
  \     pack();\n   }\n\n   /**\n    * Connect 动作弹出密码对话框。\n    */\n   private class\
  \ ConnectAction implements ActionListener\n   {\n      public void actionPerformed(ActionEvent\
  \ event)\n      {\n         // 如果是第一次，构造对话框\n\n         if (dialog == null) dialog\
  \ = new PasswordChooser();\n\n         // 设置默认值\n         dialog.setUser(new User(\"\
  yourname\", null));\n\n         // 弹出对话框\n         if (dialog.showDialog(DataExchangeFrame.this,\
  \ \"Connect\"))\n         {\n            // 如果接受，获取用户输入\n            User u = dialog.getUser();\n\
  \            textArea.append(\"user name = \" + u.getName() + \", password = \"\n\
  \               + (new String(u.getPassword())) + \"\\n\");\n         }\n      }\n\
  \   }\n}\n```\n\nListing 11.14 dataExchange/PasswordChooser.java\n\n```\npackage\
  \ dataExchange;\n\nimport java.awt.BorderLayout;\nimport java.awt.Component;\nimport\
  \ java.awt.Frame;\nimport java.awt.GridLayout;\n\nimport javax.swing.JButton;\n\
  import javax.swing.JDialog;\nimport javax.swing.JLabel;\nimport javax.swing.JTextField;\n\
  import javax.swing.JPanel;\nimport javax.swing.SwingUtilities;\n\n/**\n * 在对话框内部显示的密码选择器。\n\
  \ */\npublic class PasswordChooser extends JPanel\n{\n   private JTextField username;\n\
  \   private JPasswordField password;\n   private JButton okButton;\n   private boolean\
  \ ok;\n   private JDialog dialog;\n\n   public PasswordChooser()\n   {\n      //\
  \ 构建带有用户名和密码字段的面板\n\n      var panel = new JPanel();\n      panel.setLayout(new\
  \ GridLayout(2, 2));\n      panel.add(new JLabel(\"User name:\"));\n      panel.add(username\
  \ = new JTextField(\"\"));\n      panel.add(new JLabel(\"Password:\"));\n      panel.add(password\
  \ = new JPasswordField(\"\"));\n\n      // 创建终止对话框的 Ok 和 Cancel 按钮\n\n      okButton\
  \ = new JButton(\"Ok\");\n      okButton.addActionListener(event ->\n         {\n\
  \            ok = true;\n            dialog.setVisible(false);\n         });\n\n\
  \      var cancelButton = new JButton(\"Cancel\");\n      cancelButton.addActionListener(event\
  \ -> dialog.setVisible(false));\n\n      // 将按钮添加到南部边框\n\n      var buttonPanel\
  \ = new JPanel();\n      buttonPanel.add(okButton);\n      buttonPanel.add(cancelButton);\n\
  \      add(panel, BorderLayout.CENTER);\n      add(buttonPanel, BorderLayout.SOUTH);\n\
  \   }\n\n   /**\n    * 设置对话框默认值。\n    * @param u 默认用户信息\n    */\n   public void\
  \ setUser(User u)\n   {\n      username.setText(u.getName());\n   }\n\n   /**\n\
  \    * 获取对话框输入。\n    * @return 一个状态代表对话框条目的 User 对象\n    */\n   public User getUser()\n\
  \   {\n      return new User(username.getText(), password.getPassword());\n   }\n\
  \n   /**\n    * 在对话框中显示选择面板。\n    * @param parent 所有者帧中的组件或 null\n    * @param title\
  \ 对话框窗口标题\n    */\n   public boolean showDialog(Component parent, String title)\n\
  \   {\n      ok = false;\n\n      // 定位所有者帧\n\n      Frame owner = (Frame) SwingUtilities.getAncestorOfClass(Frame.class,\
  \ parent);\n\n      // 如果是第一次，或者所有者发生了变化，创建新对话框\n\n      if (dialog == null || dialog.getOwner()\
  \ != owner)\n      {\n         dialog = new JDialog(owner, true);\n         dialog.add(this);\n\
  \         dialog.getRootPane().setDefaultButton(okButton);\n         dialog.pack();\n\
  \      }\n\n      // 设置标题并显示对话框\n\n      dialog.setTitle(title);\n      dialog.setVisible(true);\n\
  \      return ok;\n   }\n}\n```\n\n\n\n\n设置此根窗格的默认按钮。要取消默认按钮，请带一个 `null` 参数调用此方法。\n\
  \n`javax.swing.JButton` 1.2\n\n*   `boolean isDefaultButton()`\n\n如果此按钮是其根窗格的默认按钮，则返回\
  \ `true`。\n\n### 11.8.4 文件对话框 (File Dialogs)\n\n在应用程序中，你通常希望能够打开和保存文件。一个能够显示文件和目录并允许用户浏览文件系统的优秀对话框很难编写，而且你绝对不想重复造轮子。幸运的是，Swing\
  \ 提供了一个 `JFileChooser` 类，它允许你显示与大多数原生应用程序使用的类似的文件对话框。`JFileChooser` 对话框总是模态的。请注意，`JFileChooser`\
  \ 类并不是 `JDialog` 的子类。不要调用 `setVisible(true)`，而是调用 `showOpenDialog` 来显示打开文件的对话框，或调用\
  \ `showSaveDialog` 显示保存文件的对话框。用于接受文件的按钮将自动标记为“打开”（Open）或“保存”（Save）。你也可以通过 `showDialog`\
  \ 方法提供自己的按钮标签。图 11.33 显示了文件选择器对话框的示例。\n\n![Figure](img/filedialog.jpg)图 11.33：文件选择器对话框\n\
  \n以下是建立文件对话框并获取用户从框中选择内容的步骤：\n\n1. 创建一个 `JFileChooser` 对象。与 `JDialog` 类的构造函数不同，你不需要提供父组件。这允许你在多个框架之间复用文件选择器对话框。\n\
  \n   例如：\n\n   ```\n   var chooser = new JFileChooser();\n   ```\n\n   复用文件选择器对象是一个好主意，因为\
  \ `JFileChooser` 构造可能可能慢，特别是在 Windows 上用户有许多映射的网络驱动器时。\n\n2. 通过调用 `setCurrentDirectory`\
  \ 方法设置目录。\n\n   例如，使用当前工作目录\n\n   ```\n   chooser.setCurrentDirectory(new File(\"\
  .\"));\n   ```\n\n   你需要提供一个 `File` 对象。`File` 对象在第 2 章](../ch2/index_u18_split_000.xhtml)\
  \ 中有详细解释。你现在只需要知道构造函数 `File(String filename)` 会将文件名或目录名转换为 `File` 对象。\n\n3. 如果你有一个预期用户选择的默认文件名，请通过\
  \ `setSelectedFile` 方法提供它：\n\n   ```\n   chooser.setSelectedFile(new File(filename));\n\
  \   ```\n\n4. 为了让用户能够在对话框中选择多个文件，请调用 `setMultiSelectionEnabled` 方法。当然，这完全是可选的，而且并不十分常见。\n\
  \n   ```\n   chooser.setMultiSelectionEnabled(true);\n   ```\n\n5. 如果你想将对话框中显示的文件限制为特定类型（例如，所有扩展名为\
  \ `.gif` 的文件），你需要设置一个*文件过滤器*（file filter）。我们将在本节稍后部分讨论文件过滤器。\n\n6. 默认情况下，用户使用文件选择器只能选择文件。如果你想让用户选择目录，请使用\
  \ `setFileSelectionMode` 方法。使用 `JFileChooser.FILES_ONLY`（默认值）、`JFileChooser.DIRECTORIES_ONLY`\
  \ 或 `JFileChooser.FILES_AND_DIRECTORIES` 调用它。\n\n7. 通过调用 `showOpenDialog` 或 `showSaveDialog`\
  \ 方法显示对话框。在这些调用中，你必须提供父组件：\n\n   ```\n   int result = chooser.showOpenDialog(parent);\n\
  \   ```\n\n   或者\n\n   ```\n   int result = chooser.showSaveDialog(parent);\n  \
  \ ```\n\n   这些调用唯一的区别在于“确认按钮”（approve button）的标签——用户点击以完成文件选择的按钮。你也可以调用 `showDialog`\
  \ 方法并为确认按钮传递显式文本：\n\n   ```\n   int result = chooser.showDialog(parent, \"Select\"\
  );\n   ```\n\n   这些调用仅在用户确认、取消或关闭文件对话框时才会返回。返回值为 `JFileChooser.APPROVE_OPTION`、`JFileChooser.CANCEL_OPTION`\
  \ 或 `JFileChooser.ERROR_OPTION`。\n\n8. 使用 `getSelectedFile()` 或 `getSelectedFiles()`\
  \ 方法获取选定的文件或多个文件。这些方法返回单个 `File` 对象或 `File` 对象数组。如果你只需要文件对象的名称，请调用它的 `getPath` 方法。例如：\n\
  \n   ```\n   String filename = chooser.getSelectedFile().getPath();\n   ```\n\n\
  在大多数情况下，这些步骤都是简单的。使用文件对话框的主要困难在于指定用户应该从中选择的文件子集。例如，假设用户应该选择一个 GIF 图像文件。那么，文件选择器应该只显示扩展名为\
  \ `.gif` 的文件。它还应该给用户某种反馈，说明显示的文件属于特定类别，例如“GIF 图像”。但情况可能会更复杂。如果用户应该选择 JPEG 图像文件，扩展名可以是\
  \ `.jpg` 也可以是 `.jpeg`。文件选择器的设计者没有提供一种编码这些复杂性的方法，而是提供了一种更优雅的机制：为了限制显示的文件，提供一个扩展抽象类\
  \ `javax.swing.filechooser.FileFilter` 的对象。文件选择器将每个文件传递给文件过滤器，并只显示过滤器接受的文件。\n\n\
  在编写本文时，提供了两个此类子类：接受所有文件的默认过滤器，以及一个接受特定扩展名的过滤器。然而，编写临时过滤器是简单的。只需实现 `FileFilter` 父类的两个抽象方法：\n\
  \n```\npublic boolean accept(File f);\npublic String getDescription();\n```\n\n\
  第一个方法测试文件是否应该被接受。第二个方法返回在对话框中显示的文件类型描述。\n\n`java.io` 包中一个不相关的 `FileFilter` 接口有一个方法\
  \ `boolean accept(File f)`。它被 `File` 类的 `listFiles` 方法用于列出目录中的文件。我不知道 Swing 的设计者为什么没有扩展这个接口——也许\
  \ Java 类库在 1998 年变得如此复杂，以至于他们不再感知所有的类和接口。\n\n如果你导入 `java.io` 和 `javax.swing.filechooser`\
  \ 包，将需要解决这些同名类型的冲突。简单的解决方法是导入 `javax.swing.filechooser.FileFilter`，而不是 `javax.swing.filechooser.*`。\n\
  \n一旦有了文件过滤器对象，使用 `JFileChooser` 类的 `setFileFilter` 方法将其安装到文件选择器对象中：\n\n```\nchooser.setFileFilter(new\
  \ FileNameExtensionFilter(\"Image files\", \"gif\", \"jpg\"));```\n\n可以通过调用以下方法为文件选择器安装多个过滤器：\n\
  \n```\nchooser.addChoosableFileFilter(filter1);\nchooser.addChoosableFileFilter(filter2);\n\
  ...\n\n\n用户从对话框底部的组合框中选择过滤器。默认，“所有文件”过滤器始终出现在组合框中。这是一个好主意——以防程序的用户需要选择具有非标准扩展的文件。然而，如果你想抑制“所有文件”过滤器，请调用\n\
  \n```\nchooser.setAcceptFileFilterUsed(false);```\n\n如果你复用同一个文件选择器来加载和保存不同类型的文件，调用\n\
  \n```\nchooser.resetChoosableFilters();```\n\n在添加新过滤器之前清除任何旧过滤器。\n\n最后，你可以通过为文件选择器显示的每个文件提供特殊的图标和文件描述来自定义文件选择器。通过提供扩展\
  \ `javax.swing.filechooser` 包中 `FileView` 类的对象来实现。这绝对是一种高级技术。通常，你不需要提供文件视图——可插件式外观会为你提供一个。但如果你想为特殊文件类型显示不同的图标，你可以安装自己的文件视图。你需要扩展\
  \ `FileView` 类并实现五个方法：\n\n\n\n\n\n```\nIcon getIcon(File f)\nString getName(File\
  \ f)\nString getDescription(File f)\nString getTypeDescription(File f)\nBoolean\
  \ isTraversable(File f)\n```\n\n然后，使用 `setFileView` 方法将你的文件视图安装到文件选择器中。\n\n文件选择器会对它想要显示的每个文件或目录调用你的方法。如果你的方法在图标、名称或描述上返回了\
  \ `null`，则文件选择器将查找外观与感觉（look-and-feel）的默认文件视图。这是很好的，因为意味着你只需要处理那些你想要特殊处理的文件类型即可。\n\
  \n文件选择器会调用 `isTraversable` 方法来决定当用户点击目录时是否打开该目录。注意，此方法返回的是一个 `Boolean` 对象，而不是 `boolean`\
  \ 值！这看起来很怪异，但实际上非常方便——如果你不感兴趣偏离默认的文件视图，只需返回 `null` 即可。文件选择器随后会咨询默认文件视图。换句话说，该方法返回一个\
  \ `Boolean` 让你在三个选项之间进行选择：true（`Boolean.TRUE`）、false（`Boolean.FALSE`）或不关心（`null`）。\n\
  \n示例程序包含一个简单的文件视图类。每当文件匹配文件过滤器时，该类就会显示特定的图标。我们使用它来为所有图像文件显示调色板图标。\n\n```\nclass\
  \ FileIconView extends FileView\n{\n   private FileFilter filter;\n   private Icon\
  \ icon;\n\n   public FileIconView(FileFilter aFilter, Icon anIcon)\n   {\n     \
  \ filter = aFilter;\n      icon = anIcon;\n   }\n\n   public Icon getIcon(File f)\n\
  \   {\n      if (!f.isDirectory() && filter.accept(f))\n         return icon;\n\
  \      else return null;\n   }\n}\n```\n\n使用 `setFileView` 方法将此文件视图安装到你的文件选择器：\n\
  \n```\nchooser.setFileView(new FileIconView(filter,\n   new ImageIcon(\"palette.gif\"\
  )));\n```\n\n文件选择器将在所有通过 `filter` 的文件旁边显示调色板图标，并使用默认文件视图显示所有其他文件。自然地，我们使用了在文件选择器中设置同一个过滤器。\n\
  \n最后，你可以通过添加辅助组件来自定义文件对话框。例如，图 11.34 显示了文件列表旁的一个预览辅助组件。该辅助组件显示当前选中文件的缩略图。\n\n![Figure](img/filedialog2.jpg)图\
  \ 11.34：带有预览辅助组件的文件对话框\n\n辅助组件可以是任何 Swing 组件。在我们的案例，我们扩展了 `JLabel` 类并将其图标设置为图形图像的缩放副本：\n\
  \n```\nclass ImagePreviewer extends JLabel\n{\n   public ImagePreviewer(JFileChooser\
  \ chooser)\n   {\n      setPreferredSize(new Dimension(100, 100));\n      setBorder(BorderFactory.createEtchedBorder());\n\
  \   }\n\n   public void loadImage(File f)\n   {\n      var icon = new ImageIcon(f.getPath());\n\
  \      if(icon.getIconWidth() > getWidth())\n         icon = new ImageIcon(icon.getImage().getScaledInstance(\n\
  \            getWidth(), -1, Image.SCALE_DEFAULT));\n      setIcon(icon);\n    \
  \  repaint();\n   }\n}\n```\n\n这里只有一个挑战。我们希望在用户选择不同的文件时更新预览图像。文件选择器使用“JavaBeans”机制，当它的任一个属性发生变化时通知感兴趣的监听器。选中的文件是一个属性，你可以通过安装\
  \ `PropertyChangeListener` 来监控它。以下是捕获通知所需的代码：\n\n```\nchooser.addPropertyChangeListener(event\
  \ ->\n   {\n      if (event.getPropertyName() == JFileChooser.SELECTED_FILE_CHANGED_PROPERTY)\n\
  \      {\n         var newFile = (File) event.getNewValue();\n         // 更新辅助组件\n\
  \         . . .\n      }\n   });\n```\n\n`javax.swing.JFileChooser` 1.2\n\n*   `JFileChooser()`\n\
  \    创建一个文件选择器对话框，该框可用于多个帧。\n\n*   `void setCurrentDirectory(File dir)`\n    设置文件对话框的初始目录。\n\
  \n*   `void setSelectedFile(File file)`\n*   `void setSelectedFiles(File[] file)`\n\
  \    设置文件对话框的默认文件选择。\n\n*   `void setMultiSelectionEnabled(boolean b)`\n    设置或清除多选模式。\n\
  \n*   `void setFileSelectionMode(int mode)`\n    允许用户仅选择文件（默认）、仅选择目录或同时选择文件和目录。`mode`\
  \ 参数是 `JFileChooser.FILES_ONLY`、`JFileChooser.DIRECTORIES_ONLY` 和 `JFileChooser.FILES_AND_DIRECTORIES`\
  \ 之一。\n\n*   `int showOpenDialog(Component parent)`\n*   `int showSaveDialog(Component\
  \ parent)`\n*   `int showDialog(Component parent, String approveButtonText)`\n \
  \   显示一个对话框，其中确认按钮标记为“打开”、“保存”或字符串 `approveButtonText`。返回 `APPROVE_OPTION`、`CANCEL_OPTION`（如果用户选择了取消按钮或关闭了对话框）或\
  \ `ERROR_OPTION`（如果发生错误）。\n\n*   `File getSelectedFile()`\n*   `File[] getSelectedFiles()`\n\
  \    获取用户选择的文件或多个文件（或返回 `null`）。\n\n*   `void setFileFilter(FileFilter filter)`\n\
  \    设置对话框的文件过滤器。所有 `filter.accept` 返回 `true` 的将被显示。\n\n*   `void addChoosableFilter(FileFilter\
  \ filter)`\n    将过滤器添加到可选过滤器列表中。\n\n*   `void setAllFilterUsed(boolean b)`\n   \
  \ 在组合框中包含或抑制“所有文件”过滤器。\n\n*   `void resetChoosableFilters()`\n    清除可选过滤器列表。仅保留“所有文件”过滤器。\n\
  \n*   `void setFileView(FileView view)`\n    设置文件视图以提供有关文件选择器显示的信息。\n\n*   `void\
  \ setAccessory(JComponent component)`\n    设置辅助组件。\n\n`javax.swing.filechooser.FileFilter`\
  \ 1.2\n\n*   `boolean accept(File f)`\n    如果文件选择器应该显示此文件则返回 `true`。\n\n*   `String\
  \ getDescription()`\n    返回此过滤器的描述——例如“图像文件 (*.gif,jpeg)”\n\n`javax.swing.filechooser.FileNameExtensionFilter`\
  \ 6\n\n*   `FileNameExtensionFilter(String description, String... extensions)`\n\
  \    构造一个带有描述的文件过滤器，接受所有目录以及以点加扩展扩展字符串结尾的文件。\n\n`javax.swing.filechooser.FileView`\
  \ 1.2\n\n*   `String getName(File f)`\n    返回文件 `f` 的名称，或返回 `null`。通常此方法简单返回 `f.getName()`。\n\
  \n*   `String getDescription(File f)`\n    返回文件 `f` 的人类可读描述，或返回 `null`。例如，如果 `f`\
  \ 是 HTML 文档，此方法可能会返回其标题。\n\n*   `String getTypeDescription(File f)`\n    返回文件 `f`\
  \ 类型的人类可读描述，或 `null`。例如，如果 `f` 是 HTML 文档，此方法可能会返回字符串“超文本文档”。\n\n*   `Icon getIcon(File\
  \ f)`\n    返回文件 `f` 的图标，或返回 `null`。例如，如果 `f` 是 JPEG 文件，此方法可能会返回缩略图图标。\n\n*   `Boolean\
  \ isTraversable(File f)`\n    如果 `f` 是用户可以打开的目录则返回 `Boolean.TRUE`。如果目录在概念上是一个复合文档，此方法可能会返回\
  \ `Boolean.FALSE`。与所有 `FileView` 方法一样，此方法可以返回 `null` 以表示文件选择器应该咨询默认视图。\n\n\n\n\n\
  在本章中，我们将继续讨论第一卷中介绍的 Swing 用户界面工具包和 AWT 图形。我们将重点关注既适用于客户端用户界面，也适用于服务器端图形和图像生成的技巧。Swing\
  \ 拥有用于渲染表格和树的复杂组件。通过 2D 图形 API，你可以生成任意复杂度的矢量艺术。`ImageIO` API 允许你对位图图像进行操作。最后，你可以使用打印\
  \ API 来生成打印输出和 PostScript 文件。\n\n## 12.1. 表格\n\n`JTable` 组件显示一个由对象构成的二维网格。表格在用户界面中非常常见，Swing\
  \ 团队在表格控制上投入了大量精力。表格本质上是复杂的，但——可能比其他 Swing 类更成功——`JTable` 组件隐藏了大部分这种复杂性。你只需要编写几行代码就可以创建具有丰富行为的全功能表格。你也可以编写更多代码，为你的特定应用程序自定义显示和行为。\n\
  \n在接下来的章节中，我将解释如何创建简单的表格、用户如何与它们交互，以及如何进行一些最常见的调整。与其他复杂的 Swing 控件一样，我们无法完全详尽地涵盖所有方面。欲了解更多信息，请参阅\
  \ David M. Geary 写的 *Graphic Java™, Third Edition*（Prentice Hall, 1999）或 Kim Topley\
  \ 写的 *Core Swing*（Prentice Hall, 1999）。\n\n### 12.1.1. 简单表格\n\n`JTable` 不存储自己的数据，而是从一个*表格模型*（table\
  \ model）中获取数据。`JTable` 类有一个构造函数，可以将对象的二维数组封装到默认模型中。这就是我们在第一个示例中使用的策略；在本章的后半部分，我们将转向使用表格模型。\n\
  \n图 12.1 显示了一个典型的表格，描述了太阳系行星的属性。（如果一个行星主要由氢和氦组成，则它是 `gaseous` 气体的。你应该对“颜色”条目保留意见——添加这一列是因为它在随后的代码示例中很有用。）\n\
  \n![Figure](img/fig06-05.jpg)图 12.1: 简单表格\n\n如你从 Listing 12.1 中的代码所示，表格数据以 `Object`\
  \ 值的二维数组形式存储：\n\n```\nObject[][] cells =\n   {\n      { \"Mercury\", 2440.0, 0,\
  \ false, Color.YELLOW },\n      { \"Venus\", 6052.0, 0, false, Color.YELLOW },\n\
  \      . . .\n   }\n```\n\n在这里，我们利用了自动装箱（autoboxing）。第二、第三和第四列的条目会自动转换为 `Double`、`Integer`\
  \ 和 `Boolean` 类型的对象。\n\n表格简单地调用每个对象的 `toString` 方法来显示。这就是为什么颜色显示为 `java.awt.Color[r=.\
  \ . .,g=. . .,b=. . .]`。\n\n在一个独立的字符串数组中提供列名：\n\n```\nString[] columnNames = { \"\
  Planet\", \"Radius\", \"Moons\", \"Gaseous\", \"Color\" };\n```\n\n然后，根据单元格数组和列名数组构建表格：\n\
  \n```\nvar table = new JTable(cells, columnNames);\n```\n\n你可以用通常的方法添加滚动条——通过将表格封装在\
  \ `JScrollPane` 中：\n\n```\nvar pane = new JScrollPane(table);\n```\n\n当你滚动表格时，表格表头不会滚出视图。\n\
  \n接下来，点击其中一个列头并向左或向右拖动。观察整个列是如何脱离的（参见 图 12.2）。你可以将其掉在不同的位置。这仅重新排列了*视图中*的列。数据模型不受影响。\n\
  \n![Figure](img/fig06-06.jpg)图 12.2: 移动列\n\n要*调整*resize*列的大小，只需将光标置在两列之间，直到光标形状变为箭头。然后，将列边界拖到所需的位置（参见\
  \ 图 12.3）。\n\n![Figure](img/fig06-07.jpg)图 12.3: 调整列大小\n\n用户可以通过点击行中的任何位置来选择行。选中的行会被高亮；你稍后将看到如何获取选择事件。用户还可以通过点击单元格并输入内容来编辑表格条目。然而，在这个代码示例中，编辑不会更改底层数据。在你的程序中，你应该让单元格变为不可编辑状态，或者处理单元格编辑事件并更新你的模型。我们将在本节的后部分讨论这些主题。\n\
  \n最后，点击列头。行将自动排序。再次点击，排序顺序将反转。这种行为通过调用以下代码激活：\n\n```\ntable.setAutoCreateRowSorter(true);\n\
  ```\n\n你可以通过调用来打印表格：\n\n```\ntable.print();\n```\n\n如果你没有将表格封装在滚动面板中，则需要显式添加表头：\n\
  \n```\nadd(table.getTableHeader(), BorderLayout.NORTH);\n```\n\nListing 12.2\n\n\
  ```java\npackage table;\n\nimport java.awt.*;\nimport java.awt.print.*;\nimport\
  \ javax.swing.*;\n\n/**\n * 此程序演示了如何显示简单的表格。\n * @author Caymann\n * @version 1.05-01\n\
  \ */\npublic class TableTest\n{\n   private Object[][] cells = \n   {\n      { \"\
  Mercury\", 2440.0, 0, false, Color.YELLOW },\n      { \"Venus\", 6052.0, 0, false,\
  \ Color.YELLOW },\n      { \"Earth\", 6378.0, 1, false, Color.YELLOW },\n      {\
  \ \"Mars\", 3390.0, 2, false, Color.YELLOW },\n      { \"Jupiter\", 71492.0, 79,\
  \ true, Color.YELLOW },\n      { \"Saturn\", 58232.0, 82, true, Color.YELLOW },\n\
  \      { \"Uranus\", 25362.0, 27, true, Color.YELLOW },\n      { \"Neptune\", 24622.0,\
  \ 14, true, Color.YELLOW },\n      { \"Pluto\", 11387.0, 5, false, Color.YELLOW\
  \ } \n   };\n\n   private String[] columnNames = { \"Planet\", \"Radius\", \"Moons\"\
  , \"Gaseous\", \"Color\" };\n\n   public TableFrame()\n   {\n      var table = new\
  \ JTable(cells, columnNames);\n      table.setAutoCreateRowSorter(true);\n     \
  \ add(new JScrollPane(table), BorderLayout.CENTER);\n      var printButton = new\
  \ JButton(\"Print\");\n      printButton.addActionListener(event -> \n         {\n\
  \            try { table.print(); }\n            catch (SecurityException | PrinterException\
  \ e) { e.printStackTrace(); }\n         });\n      var buttonPanel = new JPanel();\n\
  \      buttonPanel.add(printButton);\n      add(buttonPanel, BorderLayout.SOUTH);\n\
  \      pack();\n   }\n}\n\nclass TableFrame extends JFrame\n{\n   public static\
  \ void main(String[] args)\n   {\n      EventQueue.invokeLater(() ->\n         {\n\
  \            var frame = new TableFrame();\n            frame.setTitle(\"TableTest\"\
  );\n            frame.setDefaultCloseOperation(EXIT_ON_CLOSE);\n            frame.setVisible(true);\n\
  \         });\n   }\n}\n```\n\n\n\n实现 `getValueAt` 方法有许多方法。例如，如果你想显示包含数据库查询结果的 `RowSet`\
  \ 内容，只需提供此方法即可：\n\n```\npublic Object getValueAt(int r, int c)\n{\n   try\n   {\n\
  \      rowSet.absolute(r + 1);\n      return rowSet.getObject(c + 1);\n   }\n  \
  \ catch (SQLException e)\n   {\n      e.printStackTrace();\n      return null;\n\
  \   }\n}\n```\n\n我们的示例程序更加简单。我们构建了一个表格，显示了一些计算出的值——即投资在不同利率场景下的增长情况（请参见图 12.4）。\n\
  \n![Figure](img/fig06-08.jpg)图 12.4: 投资的增长\n\n`getValueAt` 方法计算适当的值并对其进行格式化：\n\n\
  ```\npublic Object getValueAt(int r, int c)\n{\n   double rate = (c + minRate) /\
  \ 100.0;\n   int nperiods = r;\n   double futureBalance = INITIAL_BALANCE * Math.pow(1\
  \ + rate, nperiods);\n   return \"%.2f\".formatted(futureBalance);\n}\n```\n\n`getRowCount`\
  \ 和 `getColumnCount` 方法直接返回行数和列数：\n\n```\npublic int getRowCount() { return years;\
  \ }\npublic int getColumnCount() {  return maxRate - minRate + 1; }\n```\n\n如果你不提供列名，`AbstractTableModel`\
  \ 的 `getColumnName` 方法将把列命名为 A、B、C 等。若要更改默认列名，请重写 `getColumnName` 方法。在这个示例中，我们简单地用利率标记了每一列。\n\
  \n```java\npublic String getColumnName(int c) { return (c + minRate) + \"%\"; }\n\
  ```\n\n你可以在列表 12.2 中找到完整的源代码。\n\n列表 12.2 `tableModel/InvestmentTable.java`\n\n```java\n\
  package tableModel;\n\nimport java.awt.*;\n\nimport javax.swing.*;\nimport javax.swing.table.*;\n\
  \n/**\n * 此程序展示了如何从表格模型构建表格。\n * @version 1.05 2021-09-09\n * @author Cay Horstmann\n\
  \ */\npublic class InvestmentTable\n{\n   public static void main(String[] args)\n\
  \   {\n      EventQueue.invokeLater(() ->\n         {\n            var frame = new\
  \ InvestmentTableFrame();\n            frame.setTitle(\"InvestmentTable\");    \
  \           \n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n         });\n   }\n}\n\n/**\n * 此框架包含投资表格。\n\
  \ */\nclass InvestmentTableFrame extends JFrame\n{\n   public InvestmentTableFrame()\n\
  \   {\n      var model = new InvestmentTableModel(30, 5, 10);\n      var table =\
  \ new JTable(model);\n      add(new JScrollPane(table));\n      pack();\n   }\n\
  }\n\n/**\n * 此表格模型在每次被请求时计算单元格条目。表格内容 \n * 显示了在不同利率下投资若干年的增长情况。\n */\nclass InvestmentTableModel\
  \ extends AbstractTableModel\n{\n   private static double INITIAL_BALANCE = 100000.0;\n\
  \n   private int years;\n   private int minRate;\n   private int maxRate;\n\n  \
  \ /**\n    * 构建一个投资表格模型。\n    * @param y 年数\n    * @param r1 要列出的的最低利率\n    * @param\
  \ r2 要列出的的最高利率\n    */\n   public InvestmentTableModel(int y, int r1, int r2)\n\
  \   {\n      years = y;\n      minRate = r1;\n      maxRate = r2;\n   }\n\n   public\
  \ int getRowCount()\n   {\n      return years;\n   }\n\n   public int getColumnCount()\n\
  \   {\n      return maxRate - minRate + 1;\n   }\n\n   public Object getValueAt(int\
  \ r, int c)\n   {\n      double rate = (c + minRate) / 100.0;\n      int nperiods\
  \ = r;\n      double futureBalance = INITIAL_BALANCE * Math.pow(1 + rate, nperiods);\n\
  \      return \"%.2f\".formatted(futureBalance);\n   }\n\n   public String getColumnName(int\
  \ c)\n   {\n      return (c + minRate) + \"%\";\n   }\n}\n```\n\n`javax.swing.table.TableModel`\
  \ 1.2\n\n* `int getRowCount()`\n* `int getColumnCount()`\n    获取表格模型中的行数和列数。\n*\
  \ `Object getValueAt(int row, int column)`\n    获取指定行和列的值。\n* `void setValueAt(Object\
  \ newValue, int row, int column)`\n    在指定行和列设置新值。\n* `boolean isCellEditable(int\
  \ row, int column)`\n    如果指定行和列的单元格可编辑，则返回 `true`。\n* `String getColumnName(int\
  \ column)`\n    获取列标题。\n\n## 12.2 处理行和列\n\n实现 `getValueAt` 方法有许多方法。例如，如果你想显示包含数据库查询结果的\
  \ `RowSet` 内容，只需提供此方法即可：\n\n我们的示例程序更加简单。我们构建了一个表格，显示了一些计算出的值——即投资在不同利率场景下的增长情况（请参见图\
  \ 12.4）。\n\n![Figure](img/fig06-08.jpg)图 12.4: 投资的增长\n\n`getValueAt` 方法计算适当的值并对其进行格式化：\n\
  \n`getRowCount` 和 `getColumnCount` 方法直接返回行数和列数：\n\n如果你不提供列名，`AbstractTableModel`\
  \ 的 `getColumnName` 方法将把列命名为 A、B、C 等。若要更改默认列名，请重写 `getColumnName` 方法。在这个示例中，我们简单地用利率标记了每一列。\n\
  \n### 12.2.1 列类\n\n在后续的小节中，你将看到如何操作行和列。表格 12.1 展示了默认操作。\n\n表格 12.1：默认操作\n\n| 类型\
  \ | 行为 |\n| --- | --- |\n| `Boolean` | 复选框 |\n| `Icon` |  |\n| `Object` | 字符串 |\n\
  | `String` | 图像 |\n\n### 12.2.2 访问列\n\n`JTable` 类在 `TableColumn` 对象中存储列信息。`TableModel`\
  \ 对象管理列。图 12.6 展示了最主要的表格类之间的关系。列模型常见的用途仅仅是获取一个 `TableColumn` 对象：\n\n```\nint columnIndex\
  \ = . .;\nTableColumn column = table.getColumnModel().getColumn(columnIndex);\n\
  ```\n\n![Figure](img/fig06-10.jpg)图 12.6: 表格类之间的关系\n\n### 12.2.3 缩放\n\n`TableColumn`\
  \ 类允许控制列的缩放行为。你可以通过方法设置首选、最小和最大宽度。这些信息被表格组件用于布局列。第 12.3 节。\n\n### 12.2.4 处理行和列\n\
  \n实现 `getValueAt` 方法有许多方法。例如，如果你想显示包含数据库查询结果的 `RowSet` 内容，只需提供此方法即可：\n\n\n\n\n\n\
  | `AUTO_RESIZE_LAST_COLUMN` | 仅调整最后一列。 |\n| `AUTO_RESIZE_ALL_COLUMNS` | 调整表格中的所有列；这并不是一个好的选择，因为它阻止了用户将多个列调整为所需的大小。\
  \ |\n\n### 12.2.4 调整行高\n\n行高由 `JTable` 类直接管理。如果你的单元格比默认值高，你可能想要设置行高：\n\n```\ntable.setRowHeight(height);\n\
  ```\n\n默认情况下，表格中的所有行高度相同。你可以通过调用以下方法设置单独行的高度：\n\n```\ntable.setRowHeight(row, height);\n\
  ```\n\n实际的行高等于通过这些方法设置的高度高减去行边距。默认行边距为 1 像素，但你可以通过调用来更改它：\n\n```\ntable.setRowMargin(margin);\n\
  ```\n\n### 12.2.5 选择行、列和单元格\n\n根据选择模式的不同，用户可以选择表格中的行、列或单个单元格。默认启用了行选择。点击单元格内部会选中整行（参见图\
  \ 12.5）。调用\n\n```\n\ntable.setRowSelectionAllowed(false);\n```\n\n来禁用行选择。\n\n当启用行选择时，你可以控制是否允许用户选择单行、连续一组行或任意一组行。你需要获取\
  \ `selection model` 并使用它的 `setSelectionMode` 方法：\n\n```\ntable.getSelectionModel().setSelectionMode(mode);\n\
  ```\n\n在这里，`mode` 是三个值之一：\n\n```\nListSelectionModel.SINGLE_SELECTION\nListSelectionModel.SINGLE_INTERVAL_SELECTION\n\
  ListSelectionModel.MULTIPLE_INTERVAL_SELECTION\n```\n\n列选择默认是禁用的。你可以通过调用以下方法开启它：\n\
  \n```\ntable.setColumnSelectionAllowed(true);\n```\n\n同时启用行和列选择等同于启用单元格选择。此时用户将选择单元格区域（参见图\
  \ 12.7）。你也可以通过调用以下方法启用该设置：\n\n```\ntable.setCellSelectionEnabled(true);\n```\n\n\
  ![Figure](img/fig06-11.jpg)图 12.7: 选择一个单元格区域\n\n运行 Listing 12.3 中的程序以观察单元格选择的操作。在“Selection”菜单中启用行、列或单元格选择，并观察选择行为如何变化。\n\
  \n你可以通过调用 `getSelectedRows` 和 `getSelectedColumns` 方法确定哪些行和列被选中。两者都返回一个包含选中项目索引的\
  \ `int[]` 数组。注意索引值是表格视图的，而不是底层表格模型的。尝试选择行和列，然后将列拖到不同的位置并点击列头对行进行排序。使用“Print Selection”菜单项查看哪些行和列被报告为选中。\n\
  \n如果你需要将表格索引值转换为表格模型索引值，请使用 `JTable` 方法 `convertRowIndexToModel` 和 `convertColumnIndexToModel`。\n\
  \n### 12.2.6 排序排序\n\n正如我们在第一个表格示例中看到的，只需调用 `setAutoCreateRowSorter` 方法就可以轻松地为 `JTable`\
  \ 添加行排序。然而，为了对排序行为进行更细粒度的控制，可以向 `JTable` 安装一个 `TableRowSorter<M>` 对象并对其自定义。类型参数\
  \ `M` 表示表格模型；它需要是 `TableModel` 接口的子类型。\n\n```\nvar sorter = new TableRowSorter<TableModel>(model);\n\
  table.setRowSorter(sorter);\n```\n\n某些列不应该是可排序的，例如行星数据中的图像列。通过调用关闭排序：\n\n```\nsorter.setSortable(IMAGE_COLUMN,\
  \ false);\n```\n\n你可以为每一列安装自定义的比较器。在我们的示例中，我们将对 Color 列中的颜色进行排序，优先考虑蓝色绿色而非红色。当你点击\
  \ Color 列时，你会发现蓝色行星移动到了表格底部。这是通过以下调用实现的：\n\n```\nsorter.setComparator(COLOR_COLUMN,\
  \ new Comparator<Color>()\n   {\n      public int compare(Color c1, Color c2)\n\
  \      {\n         int d = c1.getBlue() - c2.getBlue();\n         if (d != 0) return\
  \ d;\n         d = c1.getGreen() - c2.getGreen();\n         if (d != 0) return d;\n\
  \         return c1.getRed() - c2.getRed();\n      }\n   });\n```\n\n如果你没有为列指定比较器，排序顺序确定如下：\n\
  \n1.  如果列类型为 `String`，则使用由 `Collator.getInstance()` 返回的默认比较器。它以适用于当前区域设置的方式对字符串。（有关区域设置和比较器的更多信息，请参见第\
  \ 7 章）。\n\n2.  如果列类实现了 `Comparable`，则使用它的 `compareTo` 方法。\n\n3.  如果为排序器设置了 `TableStringConverter`，则使用默认比较器对转换器的\
  \ `toString` 方法返回的字符串进行排序。如果你想使用这种方法，请按如下方式定义转换器：\n\n    ```\n    sorter.setStringConverter(new\
  \ TableStringConverter()\n       {\n          public String toString(TableModel\
  \ model, int row, int column)\n          {\n             Object value = model.getValueAt(row,\
  \ column);\n             // 将 value 转换为字符串并返回\n          }\n       });\n    ```\n\
  \n4.  否则，调用单元格值的 `toString` 方法并使用默认比较器对其进行排序。\n\n### 12.2.7 过滤行\n\n除了排序行，`TableRowSorter`\
  \ 还可以选择性地隐藏行——这一过程被称为*过滤*。要激活过滤，请设置 `RowFilter`。例如，要包含包含至少一个卫星的所有行，调用\n\n```\nsorter.setRowFilter(RowFilter.numberFilter(ComparisonType.NOT_EQUAL,\
  \ 0, MOONS_COLUMN));\n```\n\n在这里，我们使用预定义的数字过滤器。要构造数字过滤器，请提供：\n\n*   比较类型（`EQUAL`、`NOT_EQUAL`、`AFTER`\
  \ 或 `BEFORE` 之一）。\n\n*   `Number` 子类的对象（例如 `Integer` 或 `Double`）。只有与给定 `Number`\
  \ 对象类相同的对象会被考虑。\n\n*   零或多个列索引值。如果没有提供索引值，则搜索所有列。\n\n静态方法 `RowFilter.dateFilter`\
  \ 以相同的方式构造日期过滤器；你需要提供一个 `Date` 对象而不是 `Number` 对象。\n\n最后，静态方法 `RowFilter.regexFilter`\
  \ 构造一个查找匹配正则表达式的过滤器。例如，\n\n```\n\nsorter.setRowFilter(RowFilter.regexFilter(\".*[^s]$\"\
  , PLANET_COLUMN));\n```\n\n仅显示名称不以“s”结尾的行星。（有关正则表达式的更多信息，请参见第 2 章,\n   RowFilter.numberFilter(ComparisonType.NOT_EQUAL,\
  \ 0, MOONS_COLUMN))));\n```\n\n\n\n\n\n```\nvar filter = new RowFilter<TableModel,\
  \ Integer>()\n   {\n      public boolean include(Entry<? extends TableModel, ? extends\
  \ Integer> entry)\n      {\n         return entry.getIdentifier() % 2 == 0;\n  \
  \    }\n   };\n```\n\n如果你只想包含拥有偶数个卫星的行星，那么你应该改为测试：\n\n```\n((Integer) entry.getValue(MOONS_COLUMN))\
  \ % 2 == 0\n```\n\n在我们的示例程序中，我们允许用户隐藏任意行。我们将隐藏的行索引存储在一个 `set` 中。行过滤器会显示所有索引不在该集合中的行。\n\
  \n过滤机制的设计之初并不是为了让标准随时间变化的过滤器而设计的。在我们的示例程序中，每当隐藏行的集合发生变化时，我们都会调用：\n\n```\nsorter.setRowFilter(filter);\n\
  ```\n\n设置过滤器会使其立即生效。\n\n### 12.2.8. 隐藏和显示列\n\n正如你在前一节中看到的，你可以根据内容或行标识符对表格行进行过滤。隐藏表格列则使用一种完全不同的机制。\n\
  \n`JTable` 类的 `removeColumn` 方法会从表格视图中移除列。列数据并没有实际上从模型中删除——它们只是在视图中隐藏了。`removeColumn`\
  \ 方法有一个类型为 `TableColumn` 的参数。如果你有列索引（例如，通过调用 `getSelectedColumns` 获取），你需要向表格模型请求实际的\
  \ `TableColumn` 对象：\n\n```\nTableColumnModel columnModel = table.getColumnModel();\n\
  TableColumn column = columnModel.getColumn(i);\ntable.removeColumn(column);\n```\n\
  \n如果你还记得该列，稍后可以添加回来：\n\n```\ntable.addColumn(column);\n```\n\n此方法会将该列添加到末尾。如果你想让它出现在其他地方，请调用\
  \ `moveColumn` 方法。\n\n你也可以通过添加新的 `TableColumn` 对象来添加一个与表格模型中的列索引对应的新列：\n\n```\n\
  table.addColumn(new TableColumn(modelColumnIndex));\n```\n\n你可以拥有多个表格列，它们可以查看模型中的同一列。\n\
