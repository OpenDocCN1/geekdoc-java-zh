  \ 8\n  产生一个与此 `FileTime` 表示相同时间的 `Instant`。\n\n### 2.4.6. 访问目录项\n\n静态方法 `Files.list`\
  \ 返回一个读取目录条目的 `Stream<Path>`。该目录是按需性读取的，这使得高效地处理包含大量条目的目录成为可能。\n\n由于读取目录涉及需要关闭的系统资源，因此您应该使用\
  \ `try` 块：\n\n```\ntry (Stream<Path> entries = Files.list(pathToDirectory)) \n{\n\
  \   . . .\n}\n```\n\n`list` 方法不会进入子目录。要处理目录的所有后代，请改用 `Files.walk` 方法。\n\n```\ntry\
  \ (Stream<Path> entries = Files.walk(pathToRoot)) \n{\n   // 包含所有后代，按深度优先顺序访问\n\
  }\n```\n\n以下是对解压后的 `src.zip` 树的遍历示例：\n\n```java\njava/nio\njava/nio/DirectCharBufferU.java\n\
  java/nio/ByteBufferAsShortBufferRL.java\njava/nio/MappedByteBuffer.java\n. . .\n\
  java/nio/ByteBufferAsDoubleBufferB.java\njava/nio/charset\njava/nio/charset/CoderMalfunctionError.java\n\
  java/nio/charset/CharsetDecoder.java\njava/nio/charset/UnsupportedCharsetException.java\n\
  java/nio/charset/spi\njava/nio/charset/spi/CharsetProvider.java\njava/nio/charset/StandardCharsets.java\n\
  java/nio/charset/Charset.java\n. . .\njava/nio/charset/CoderResult.java\njava/nio/HeapFloatBufferR.java\n\
  . . .\n```\n\n如您所见，每当遍历遇到目录时，会在继续处理兄弟节点之前进入。\n\n您可以通过调用 `Files.walk(pathToRoot,\
  \ depth)` 来限制想要访问的树深度。两个 `walk` 方法都有类型为 `FileVisitOption...` 的变长参数，但您只能提供一个选项：`FOLLOW_LINKS`\
  \ 用于跟随符号链接。\n\n如果您过滤了 `walk` 返回的路径，且过滤标准涉及存储在目录中的文件属性（例如大小、创建时间或类型（文件、目录、符号链接）），请使用\
  \ `find` 方法而不是 `walk`。调用该方法时，传入一个接受路径和 `BasicFileAttributes` 对象的谓词函数。唯一的优势是效率。由于目录正在被读取，因此属性是可以直接获取的。\n\
  \n此代码片段使用 `Files.walk` 方法将一个目录拷贝到另一个目录：\n\n```\nFiles.walk(source).forEach(p ->\
  \ \n   {\n      try \n      {\n         Path q = target.resolve(source.relativize(p));\n\
  \         if (Files.isDirectory(p))\n            Files.createDirectory(q);\n   \
  \      else\n            Files.copy(p, q);\n      } \n      catch (IOException e)\
  \ \n      {\n         throw new UncheckedIOException(ex);\n      }\n   });\n```\n\
  \n遗憾的是，您无法轻松地使用 `Files.walk` 方法删除目录树，因为您需要在删除父目录之前删除子目录。下一节将向您展示如何解决这个问题。\n\n如果任何子目录不可读，`Files.walk`\
  \ 方法将抛出异常。如果您只想访问可读的目录，请使用下一节描述的 `walkFileTree` 方法。\n\n### 2.4.7. 使用目录流\n\n如您在上一节中看到的，`Files.walk`\
  \ 方法产生一个遍历目录后代的 `Stream<Path>`。有时，您需要对遍历过程进行更细粒度的控制。在这种情况下，请使用 `Files.newDirectoryStream`\
  \ 对象。它产生一个 `DirectoryStream`。请注意，这不是 `java.util.stream.Stream` 的子接口，而是一个专门为目录遍历设计的接口。它是\
  \ `Iterable` 的子接口，因此您可以在增强型 `for` 循环中使用目录流。以下是使用模式：\n\n```\ntry (DirectoryStream<Path>\
  \ entries = Files.newDirectoryStream(dir))\n{\n   for (Path entry : entries) \n\
  \      Process entries       \n}\n```\n\n`try`-with-resources 块确保了目录流被正确关闭。\n\n\
  目录项的访问没有特定的顺序。\n\n您可以使用 glob 模式过滤文件：\n\n```\ntry (DirectoryStream<Path> entries\
  \ = Files.newDirectoryStream(dir, \"*.java\"))\n```\n\n\n\n\n\n```\nFiles.walkFileTree(Path.of(\"\
  /\"), new SimpleFileVisitor<Path>()\n   {\n      public FileVisitResult preVisitDirectory(Path\
  \ path, BasicFileAttributes attrs) \n            throws IOException\n      {\n \
  \        System.out.println(path);\n         return FileVisitResult.CONTINUE;\n\
  \      }\n\n      public FileVisitResult postVisitDirectory(Path dir, IOException\
  \ e) \n      {\n         return FileVisitResult.CONTINUE;\n      }\n\n      public\
  \ FileVisitResult visitFileFailed(Path path, IOException e) throws IOException\n\
  \      {\n         if (e != null) throw e;\n         return FileVisitResult.SKIP_SUBTREE;\n\
  \      }\n   });\n```\n\n注意我们需要重写 `postVisitDirectory` 和 `visitFileFailed`。否则，一旦遇到一个无权限打开的目录或无权限访问的文件，访问就会失败。\n\
  \n同样注意，路径的属性是作为参数传递给 `preVisitDirectory` 和 `visitFile` 方法的。访问者已经必须过一次操作系统调用来获取属性，因为它需要区分文件和目录。这样，你就不需要再次调用了。\n\
  \n`FileVisitor` 接口的其他方法在你需要进入或离开目录时执行某些工作非常有用。例如，当你删除一个目录树时，你需要在删除所有文件后删除当前目录。这里是删除目录树的完整代码：\n\
  \n```java\n// 从根目录删除目录树\nFiles.walkFileTree(root, new SimpleFileVisitor<Path>()\n\
  \   {\n      public FileVisitResult visitFile(Path file, BasicFileAttributes attrs)\n\
  \            throws IOException\n      {\n         Files.delete(file);\n       \
  \  return FileVisitResult.CONTINUE;\n      }\n\n      public FileVisitResult postVisitDirectory(Path\
  \ dir, IOException e)\n            throws IOException\n      {\n         if (e !=\
  \ null) throw e;\n         Files.delete(dir);\n         return FileVisitResult.CONTINUE;\n\
  \      }\n   });\n```\n\n### `java.nio.file.Files` 7\n\n* `static DirectoryStream<Path>\
  \ newDirectoryStream(Path path)`\n* `static DirectoryStream<Path> newDirectoryStream(Path\
  \ path, String glob)`\n  获取给定目录下文件和目录的迭代器。第二个方法只接受与给定 glob 模式匹配的条目。\n* `static Path\
  \ walkFileTree(Path start, FileVisitor<? super Path> visitor)`\n  遍历给定路径的所有后代，并将访问者应用到所有后代。\n\
