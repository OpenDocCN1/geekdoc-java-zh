  \ `null`，在这种情况下，程序将使用 `System.out` 和 `System.err`。`run` 方法的第一个参数是一个输入流。由于编译器不接受控制台输入，你始终可以将其留为\
  \ `null`。（`run` 方法继承自泛型接口 `javax.tools.Tool`，该接口允许需要读取输入的工具使用。）\n\n`run` 方法的剩余参数是如果你在命令行中调用\
  \ `javac` 时会传递给它的参数。这些可以是选项，也可以是文件名。\n\n### 8.1.2. 启动编译任务\n\n你可以通过 `CompilationTask`\
  \ 对象对编译过程进行更细致的控制。如果你想从字符串提供源码、在内存中捕获类文件或处理错误和警告消息，这将非常有用。\n\n要获取 `CompilationTask`，请像前一节中一样从一个\
  \ `compiler` 对象开始。然后调用：\n\n```\nJavaCompiler.CompilationTask task = compiler.getTask(\n\
  \   errorWriter, // 如果为 null 则使用 System.err\n   fileManager, // 如果为 null 则使用标准文件管理器\n\
  \   diagnosticListener, // 如果为 null 则使用 System.err\n   options, // 如果没有选项则为 null\n\
  \   classes, // 用于注解处理；若无则为 null\n   sources);\n```\n\n最后三个参数是 `Iterable` 实例。例如，一组选项可以指定为：\n\
  \n```\nIterable<String> options = List.of(\"-d\", \"bin\");\n```\n\n`sources` 参数是\
  \ `JavaFileObject` 实例的 `Iterable`。如果你想编译磁盘上的文件，请获取 `StandardJavaFileManager` 并调用它的\
  \ `getJavaFileObjects` 方法：\n\n```\nStandardJavaFileManager stdFileManager\n   =\
  \ compiler.getStandardFileManager(null, null, null);\nIterable<JavaFileObject> sources\
  \ \n   = stdFileManager.getJavaFileObjectsFromStrings(List.of(\"File1.java\", \"\
  File2.java\"));\nJavaCompiler.CompilationTask task\n   = compiler.getTask(null,\
  \ null, null, options, null, sources);\n```\n\n`classes` 参数仅用于注解处理。在这种情况下，你还需要带上\
  \ `Processor` 对象的列表调用 `task.processors(annotationProcessors)`。请参阅 第 11 章第一卷 获取注解处理的示例。\n\
  \n`getTask` 方法返回任务对象，但尚未启动编译过程。`CompilationTask` 类扩展了 `Callable<Boolean>`。你可以将其提交给\
  \ `ExecutorService` 进行并发执行，你也可以直接进行同步调用：\n\n```\nBoolean result = task.call();\n\
  ```\n\n### 8.1.3. 捕获诊断信息\n\n要监听错误消息，请安装 `DiagnosticListener`。每当编译器报告警告或错误消息时，监听器就会接收一个\
  \ `Diagnostic` 对象。`DiagnosticCollector` 类实现了此接口。它简单地收集所有的诊断信息，以便你在编译完成后对它们进行迭代。\n\
  \n```\nvar collector = new DiagnosticCollector<JavaFileObject>();\ncompiler.getTask(null,\
  \ fileManager, collector, null, null, sources).call();\nfor (Diagnostic<? extends\
  \ JavaFileObject> d : collector.getDiagnostics()) \n{\n   System.out.println(d);\n\
  }\n```\n\n`Diagnostic` 对象包含了关于问题位置的信息（包括文件名、行号和列号）以及人类可读的描述。\n\n你也可以为标准文件管理器安装 `DiagnosticListener`，以防你想捕获关于缺失文件的消息：\n\
  \n```\nStandardJavaFileManager stdFileManager\n   = compiler.getStandardFileManager(diagnosticsListener,\
  \ null, null);\n```\n\n### 8.1.4. 从内存读取源文件\n\n如果你是动态生成源码，可以让它从内存中编译，而无需将文件保存到磁盘。使用此类来持有代码：\n\
  \n```java\npublic class StringSource extends SimpleJavaFileObject\n{\n   private\
  \ String code;\n\n   StringSource(String name, String code)\n   {\n      super(URI.create(\"\
  string:///\" + name.replace(\".\", \"/\") + \".java\"), Kind.SOURCE);\n      this.code\
  \ = code;\n    }\n\n   public CharSequence getCharContent(boolean ignoreEncodingErrors)\n\
  \   {\n      return code;\n   }\n}\n```\n\n然后为你的类生成代码，并给编译器提供一个 `StringSource` 对象的列表：\n\
  \n```\nList<StringSource> sources = List.of(\n   new StringSource(className1, class1CodeString),\n\
  \   new StringSource(className2, class2CodeString),\n   . . .);\ntask = compiler.getTask(null,\
  \ fileManager, diagnosticsListener, null, null, sources);\n```\n\n### 8.1.5. 将字节码写入内存\n\
  \n如果你是动态编译类，则无需将类文件保存到磁盘。你可以将它们保存到内存并立即加载它们。\n\n首先，这是一个用于持有字节的类：\n\n```java\npublic\
  \ class ByteArrayClass extends SimpleJavaFileObject\n{\n   private ByteArrayOutputStream\
  \ out;\n\n   ByteArrayClass(String name) \n   {\n      super(URI.create(\"bytes:///\"\
  \ + name.replace(\".\", \"/\") + \".class\"), Kind.CLASS);\n   }\n\n   public byte[]\
  \ getCode() \n   {\n      return out.toByteArray();\n   }\n\n   public OutputStream\
  \ openOutputStream() throws IOException \n   {\n      out = new ByteArrayOutputStream();\n\
  \      return out;\n   }        \n}\n```\n\n接下来，你需要配置文件管理器以使用这些类：\n\n```\nvar classes\
  \ = new ArrayList<ByteArrayClass>();\nStandardJavaFileManager stdFileManager\n \
  \  = compiler.getStandardFileManager(null, null, null);\nJavaFileManager fileManager\n\
  \   = new ForwardingJavaFileManager(stdFileManager)\n      {\n         public JavaFileObject\
  \ getFileOutput(Location location, String className, Kind kind)\n              \
  \ throws IOException\n               {\n                    if (kind == Kind.CLASS)\n\
  \                    {\n                       ByteArrayClass outfile = new ByteArrayClass(className);\n\
  \                       classes.add(outfile);\n                       return outfile;\n\
  \                    }\n                    else return super.getFileForOutput(location,\
  \ className, kind);\n               }\n      };\n```\n\n要加载类，你需要一个加载器（参见 第 9 章):\n\
  \n```java\npublic class ByteArrayClassLoader extends ClassLoader\n{\n   private\
  \ Iterable<ByteArrayClass> classes;\n\n   public ByteArrayClassLoader(Iterable<ByteArrayClass>\
  \ classes)\n   {\n      this.classes = classes;\n   }\n\n   public Class<?> findClass(String\
  \ name) throws ClassNotFoundException\n   {\n      for (ByteArrayClass cl : classes)\n\
  \      {\n         if (cl.getName().equals(\"/\" + name.replace(\".\", \"/\") +\
  \ \".class\"))\n            {\n               byte[] bytes = cl.getCode();\n   \
  \            return defineClass(name, bytes, 0, bytes.length);\n            }\n\
  \      }\n      throw new ClassNotFoundException(name);\n   }\n}\n```\n\n编译完成后，使用该加载器调用\
  \ `Class.forName` 方法：\n\n```\nByteArrayClassLoader loader = new ByteArrayClassLoader(classes);\n\
  Class<?> cl = Class.forName(className, true, loader);\n```\n\n### 8.1.6. 示例：动态 Java\
  \ 代码生成\n\n在用于动态页面的 Jakarta Server Pages (JSP) 技术中，你可以将 HTML 与 Java 代码段混合，例如：\n\n\
  ```html\n<p>当前日期和时间是 <b><%= LocalDateTime.now() %></b></p>\n```\n\nJSP 引擎会将 Java\
  \ 代码动态编译为 Servlet。在我们的示例应用程序中，我们使用一个简单的示例并为非常简单的工作表格式生成代码。作者在工作表中包含文本、Java 表达式（用反引号包裹）和\
  \ Java 语句（用三个反引号包裹）。工作表将被编译成 Java 类，该类将打印文本和表达式的值，并执行 Java 语句。这是一个示例工作表：\n\n```\n\
  你的名字是什么？\n```\n\n```java\nvar in = new Scanner(System.in);\n\nString name = in.nextLine();\n\
  ```\n\n```\n你多大了？\n```\n\n```java\nint age = in.nextInt();\n```\n\n```\n你好，name！明年你将是\
  \ age + 1 岁。\n```\n\n\n\n这是一个编程笔记本（[https://docs.jupyter.org/en/latest/#what-is-a-notebook]）的极精简文本版本。该工作表被转换为一个类，其\
  \ `main` 方法包含 `print` 语句，用于输出文本和表达式的值。这些语句是逐字（verbatim）包含的。可以想象对该程序进行增强，使其像真实的编程笔记本一样显示图像和表格。\n\
  \n代码清单 8.1 程序中的 `buildSource` 方法构建这些代码并将其放入 `StringSource` 对象中。该对象被传递给 Java 编译器。\n\
  \n如前节所述，我们使用 `ForwardingJavaFileManager`，它为每个编译的类构造一个 `ByteArrayClass` 对象。这些对象捕获了类编译时生成的类文件。编译完成后，我们使用前一节中的类加载器来加载该类并执行其\
  \ `main` 方法。\n\n此示例演示了如何使用内存源文件和类文件进行动态编译。\n\n### 代码清单 8.1 compiler/CompilerTest.java\n\
  \n```\npackage compiler;\n\nimport java.io.*;\nimport java.nio.file.*;\nimport java.util.*;\n\
  import java.util.List;\n\nimport javax.tools.*;\nimport javax.tools.JavaFileObject.*;\n\
  \n/**\n * @version 1.2 2023-08-16\n * @author Cay Horstmann\n */\npublic class CompilerTest\n\
  {\n   public static void main(final String[] args) \n         throws IOException,\
  \ ReflectiveOperationException\n   {\n      JavaCompiler compiler = ToolProvider.getSystemJavaCompiler();\n\
  \n      var classFileObjects = new ArrayList<ByteArrayClass>();\n\n      var diagnosticsListener\
  \ = new DiagnosticCollector<JavaFileObject>();\n\n      JavaFileManager fileManager\
  \ \n         = compiler.getStandardFileManager(diagnosticsListener, null, null);\n\
  \      fileManager = new ForwardingJavaFileManager<>(fileManager)\n         {\n\
  \            public JavaFileObject getJavaFileForOutput(Location location, \n  \
  \                String className, Kind kind, FileObject sibling) throws IOException\n\
  \            {\n               if (kind == Kind.CLASS) \n               {\n    \
  \              var fileObject = new ByteArrayClass(className);\n               \
  \   classFileObjects.add(fileObject);\n                  return fileObject;\n  \
  \             }\n               else return super.getJavaFileForOutput(location,\
  \ className, kind, sibling);\n            }\n         };\n\n      String mainClassName\
  \ = \"compiler.Main\";\n      String worksheetName = args.length > 0 ? args[0] :\
  \ \"compiler/worksheet\";\n\n      StandardJavaFileManager stdFileManager \n   \
  \      = compiler.getStandardFileManager(null, null, null);\n      var sources =\
  \ new ArrayList<JavaFileObject>();\n      for (JavaFileObject file : stdFileManager.getJavaFileObjectsFromStrings(\n\
  \            List.of(mainClassName.replace(\".\",  \"/\") + \".java\")))\n     \
  \    sources.add(file);\n\n      JavaFileObject source = buildSource(mainClassName,\
  \ Path.of(worksheetName));\n      JavaCompiler.CompilationTask task = compiler.getTask(null,\
  \ fileManager, \n         diagnosticsListener, null, null, List.of(source));\n \
  \     Boolean result = task.call();\n\n      for (Diagnostic<? extends JavaFileObject>\
  \ d : diagnosticsListener.getDiagnostics())\n         System.out.println(d.getKind()\
  \ + \": \" + d.getMessage(null));\n      fileManager.close();\n      if (!result)\n\
  \      {\n         System.out.println(\"Compilation failed.\");\n         System.exit(1);\n\
  \      }\n\n      var loader = new ByteArrayClassLoader(classFileObjects);\n   \
  \   Class<?> mainClass = loader.loadClass(mainClassName);\n      mainClass.getMethod(\"\
  main\", String[].class).invoke(null, new Object[] { args });\n   }\n\n   /**\n \
  \   * 构建实现工作表的类的源文件。\n    * @param className 要构建的类名\n    * @param worksheet 包含工作表指令的文件\n\
  \    * @return 包含在字符串构建器中的源文件对象\n    */\n   static JavaFileObject buildSource(String\
  \ className, Path worksheet) \n         throws IOException\n   {\n      var builder\
  \ = new StringBuilder();\n      int n = className.lastIndexOf(\".\");\n      if\
  \ (n >= 0)\n      {\n         String packageName = className.substring(0, n); \n\
  \         className = className.substring(n + 1);\n         builder.append(\"package\
  \ \").append(packageName).append(\"\\n\\n\");\n      }\n      builder.append(\"\
  import java.util.Scanner;\");      \n      builder.append(\"public class \").append(className).append(\"\
  \ {\\n\");\n      builder.append(\"public static void main(String[] args) {\\n\"\
  );\n      boolean verbatim = false;\n      for (String line : Files.readAllLines(worksheet))\n\
  \      {\n         if (line.equals(\"```\")) verbatim = !verbatim;\n         else\
  \ if (verbatim) builder.append(line).append(\"\\n\");\n         else\n         {\n\
  \            String[] fragments = line.split(\"`\");\n            for (int i = 0;\
  \ i < fragments.length; i++)\n            {\n               builder.append(\"System.out.print(\"\
  );\n               if (i % 2 == 0) \n                  builder.append(\"\\\"\")\n\
  \                     .append(fragments[i].replace(\"\\\\\", \"\\\\\\\\\").replace(\"\
  \\\"\", \"\\\\\\\"\"))\n                     .append(\"\\\"\");\n              \
  \ else\n                  builder.append(fragments[i]);\n               builder.append(\"\
  );\\n\");\n            }\n            builder.append(\"System.out.println()\\n;\"\
  );\n         }\n      }\n      builder.append(\"} }\\n\");\n\n      return new StringSource(className,\
  \ builder.toString());\n   }\n\n}\n```\n\n\n\n\n### `javax.tools.Tool` 6\n\n*  \
  \ `int run(InputStream in, OutputStream out, OutputStream err, String... arguments)`\n\
  \    使用给定的输入、输出、错误流以及指定的参数运行工具。成功返回 `0`，失败返回非零值。\n\n### `javax.tools.JavaCompiler`\
  \ 6\n\n*   `StandardJavaFileManager getStandardFileManager(DiagnosticListener<?\
  \ super JavaFileObject> diagnosticListener, Locale locale, Charset charset)`\n \
  \   获取此编译器的标准文件管理器。你可以为默认错误报告、区域设置和字符集提供 `null`。\n*   `JavaCompiler.CompilationTask\
  \ getTask(Writer out, JavaFileManager fileManager, DiagnosticListener<? super JavaFileObject>\
  \ diagnosticListener, Iterable<String> options, Iterable<String> classesForAnnotationProcessing,\
  \ Iterable<? extends JavaFileObject> sourceFiles)`\n    获取一个编译任务，调用该任务时将编译给定的源文件。详细信息请参见上一节的讨论。\n\
  \n### `javax.tools.StandardJavaFileManager` 6\n\n*   `Iterable<? extends JavaFileObject>\
  \ getJavaFileObjectsFromStrings(Iterable<String> fileNames)`\n*   `Iterable<? extends\
  \ JavaFileObject> getJavaFileObjectsFromPaths(Collection<? extends Path> paths)`\
  \ 13\n*   `Iterable<? extends JavaFileObject> getJavaFileObjectsFromFiles(Iterable<?\
  \ extends File> files)`\n    将一组文件名或文件转换为一组 `JavaFileObject` 实例。\n\n### `javax.tools.JavaCompiler.CompilationTask`\
  \ 6\n\n*   `Boolean call()`\n    执行编译任务。\n\n### `javax.tools.DiagnosticCollector<S>`\
  \ 6\n\n*   `DiagnosticCollector()`\n    构造一个空的收集器。\n*   `List<Diagnostic<? extends\
  \ S>> getDiagnostics()`\n    获取收集到的诊断信息。\n\n### `javax.tools.Diagnostic<S>` 6\n\n\
  *   `S getSource()`\n    获取与此诊断信息关联的源对象。\n*   `Diagnostic.Kind getKind()`\n    获取此诊断信息的类型——`ERROR`、`WARNING`、`MANDATORY_WARNING`、`NOTE`\
  \ 或 `OTHER` 之一。\n*   `String getMessage(Locale locale)`\n    获取描述此诊断信息中引发的问题的消息。传递\
  \ `null` 以使用默认区域设置。\n*   `long getLineNumber()`\n*   `long getColumnNumber()`\n\
  \    获取此诊断信息中引发的问题的位置。\n\n### `javax.tools.SimpleJavaFileObject` 6\n\n*   `CharSequence\
  \ getCharContent(boolean ignoreEncodingErrors)`\n    对于代表源文件的文件对象，重写此方法以产生源代码。\n\
  *   `OutputStream openOutputStream()`\n    对于代表类文件的文件对象，重写此方法以产生一个可以写入写入字节码的流。\n\
  \n### `javax.tools.ForwardingJavaFileManager<M extends JavaFileManager>` 6\n\n*\
  \   `protected ForwardingJavaFileManager(M fileManager)`\n    构造一个 `JavaFileManager`，将所有调用委托给给定的文件管理器。\n\
  *   `FileObject getJavaFileForOutput(JavaFileManager.Location location, String className,\
  \ JavaFileObject.Kind kind, FileObject sibling)`\n    如果你想用一个文件对象来替换写入类文件，请拦截此调用；`kind`\
  \ 是 `SOURCE`、`CLASS`、`HTML` 或 `OTHER` 之一。\n\n## 8.2. Java 平台的脚本语言\n\n脚本语言是一种通过在运行时解释程序文本来避免通常的编辑/编译/链接/运行循环的语言。脚本语言具有许多优势：\n\
  \n*   快速迭代，鼓励实验\n*   更改运行中程序的行为\n*   允许用户进行自定义\n\n另一方面，大多数脚本语言缺乏对编写复杂应用程序有的特性，例如强类型、封装和模块化。\n\
  \n因此，将脚本语言和传统语言的优势结合起来是非常吸引人的。脚本 API 让你能够在 Java 平台上实现这一点。它允许你从 Java 程序调用用 JavaScript、Groovy、Ruby\
  \ 甚至像 Scheme 和 Haskell 等奇门语言编写的脚本。例如，Renjin 项目 ([`www.renjin.org`](https://www.renjin.org))\
  \ 提供了 R 编程语言的 Java 实现（R 语言通常用于统计编程），并附带了脚本 API 的“引擎”。\n\n在寻找你喜欢的语言的兼容实现时，请搜索 JSR\
  \ 223 支持。（Java 规范请求 223 在集成到 Java 之前开发了脚本 API。）\n\nJMeter 性能分析工具 ([`jmeter.apache.org/`](https://jmeter.apache.org/))\
  \ 是一个示例程序，允许用户使用任何支持 Java 脚本的语言编写脚本。Maven 构建工具有一个插件 ([`maven.apache.org/plugins/maven-scripting-plugin/index.html`](https://maven.apache.org/plugins/maven-scripting-plugin/index.html))\
  \ 用于用任何具有 Java 脚本引擎的语言编写构建步骤。\n\n在接下来的章节中，我将展示如何为特定语言选择引擎、如何执行脚本，以及如何利用某些脚本引擎提供的高级特性。\n\
  \n### 8.2.1. 获取脚本引擎\n\n脚本引擎是一个执行特定语言脚本的库。当虚拟机启动时，它会发现这些脚本引擎。要列出这些引擎，构造一个 `ScriptEngineManager`\
  \ 并调用 `getEngineFactories` 方法。你可以询问每个引擎工厂以支持的引擎名称、MIME 类型和文件扩展名。表 8.1\n\n本章中的示例使用了\
  \ Rhino 脚本引擎，位于 [`https://github.com/mozilla/rhino](https://github.com/mozilla/rhino)，它实现了\
  \ JavaScript。\n\n表 8.1: 脚本引擎属性\n\n| 引擎 | 名称 | MIME 类型 | 扩展名 |\n| --- | --- | ---\
  \ | --- |\n| Rhino (JavaScript) | rhino, javascript | `application/javascript`,\
  \ `application/ecmascript`, `text/javascript`, `text/ecmascript` | `js` |\n| Groovy\
  \ | groovy | None | `groovy` |\n| Renjin | Renjin | `text/x-R` | `R`, `r` |\n\n\
  通常你知道你需要哪个引擎，可以通过名称、MIME 类型或扩展名请求它。例如：\n\n```\nvar manager = new ScriptEngineManager();\n\
  ScriptEngine engine = manager.getEngineByName(\"rhino\");\n```\n\n你需要在类路径上提供脚本引擎的\
  \ JAR 文件。\n\nOracle JDK 包含一个名为 Nashorn 的 JavaScript 引擎，但它在 Java 15 中被移除了。它可以作为独立项目\
  \ [`github.com/openjdk/nashorn`](https://github.com/openjdk/nashorn) 获取。\n\n###\
  \ `javax.script.ScriptEngineManager` 6\n\n*   `List<ScriptEngineFactory> getEngineFactories()`\n\
  \    获取所有发现的引擎工厂列表。\n*   `ScriptEngine getEngineByName(String name)`\n*   `ScriptEngine\
  \ getEngineByExtension(String extension)`\n*   `ScriptEngine getEngineByMimeType(String\
  \ mimeType)`\n    根据指定的名称、脚本文件扩展名或 MIME 类型获取脚本引擎。\n\n### `javax.script.ScriptEngineFactory`\
  \ 6\n\n*   `List<String> getNames()`\n*   `List<String> getExtensions()`\n*   `List<String>\
  \ getMimeTypes()`\n    获取此工厂的名称、脚本文件扩展名和 MIME 类型。\n\n### 8.2.2. 脚本评估与绑定\n\n一旦有了引擎，只需调用即可简单执行脚本：\n\
  \n```\nObject result = engine.eval(scriptString);\n```\n\n如果脚本存储在文件中，打开一个 `Reader`\
  \ 并调用\n\n```\nObject result = engine.eval(reader);\n```\n\n你可以在同一个引擎上调用多个脚本。如果一个脚本定义了变量、函数或类，大多数脚本引擎会保留这些定义供以后使用。例如，\n\
  \n```\nengine.eval(\"n = 1728\");\nObject result = engine.eval(\"n + 1\");\n```\n\
  \n将返回 `1729`。\n\n要确定是否可以在多个线程中并发执行脚本，请调用\n\n```\nObject param = factory.getParameter(\"\
  THREADING\");\n```\n\n\n\n\n\n返回值是以下内容之一：\n\n* `null`: 并发执行不。\n* `\"MULTITHREADED\"\
  `: 并发执行是安全的。一个线程的影响可能对另一个线程可见。\n* `\"THREAD-ISOLATED\"`: 在 `\"MULTITHREADED\"` 的基础上，每个线程都维护了不同的变量绑定。\n\
  * `\"STATELESS\"`: 在 `\"THREAD-ISOLATED\"` 的基础上，脚本不会更改变量绑定。\n\n你通常可能想向引擎添加变量绑定。一个绑定由一个名称和一个关联\
  \ Java 对象组成。例如，考虑以下语句：\n\n```\nengine.put(\"k\", 1728);\nObject result = engine.eval(\"\
  k + 1\");\n```\n\n脚本代码从“引擎作用域（engine scope）”的绑定中读取 `k` 的定义。这特别重要，因为大多数脚本语言都可以访问\
  \ Java 对象，且语法通常比 Java 语法更简单。例如：\n\n```\nengine.put(\"d\", LocalDate.now());\nObject\
  \ result = engine.eval(\"d.month\"); // 调用 getMonth\n```\n\n相反，你可以检索由脚本语句绑定的变量：\n\
  \n```\nengine.eval(\"n = 1728\");\nObject result = engine.get(\"n\");\n```\n\n除了引擎作用域外，还有一个全局作用域。你添加到\
  \ `ScriptEngineManager` 的任何绑定对所有引擎都是可见的\n\n与其向引擎或全局作用域添加绑定，你可以将它们收集在一个 `Bindings`\
  \ 类型的对象中，并将其传递给 `eval` 方法：\n\n```\nBindings scope = engine.createBindings();\nscope.put(\"\
  d\", LocalDate.now());\nengine.eval(scriptString, scope);\n```\n\n如果一组绑定不应该持续到未来的\
  \ `eval` 方法调用，那么这种方法非常有用。\n\n你可能希望拥有引擎和全局作用域之外的作用域。例如，Web 容器可能需要请求作用和会话作用域。然而，这时你需要自己了。你需要编写一个实现\
  \ `ScriptContext` 接口的类来管理作用域集合。每个作用域由一个整数标识，并且应该先搜索数字较小的作用域。（标准库提供了 `SimpleScriptContext`\
  \ 类，但它只持有全局和引擎作用域。）\n\n### javax.script.ScriptEngine\n\n* `Object eval(String script)`\n\
  * `Object eval(Reader reader)`\n* `Object eval(String script, Bindings bindings)`\n\
  \  根据给定的绑定执行由字符串或 reader 提供的脚本。\n* `Object get(String key)`\n* `void put(String\
  \ key, Object value)`\n  在引擎作用域中获取或放入绑定。\n* `Bindings createBindings()`\n  创建一个适用于此引擎的空\
  \ `Bindings` 对象。\n\n### javax.script.ScriptEngineManager\n\n* `Object get(String\
  \ key)`\n* `void put(String key, Object value)`\n  在全局作用域中获取或放入绑定。\n\n### javax.script.Bindings\n\
  \n* `Object get(String key)`\n* `void put(String key, Object value)`\n  向由此 `Bindings`\
  \ 对象表示的作用域中获取或存入绑定。\n\n### 8.2.3 重定向输入和输出\n\n你可以通过调用脚本作用文的 `setReader` 和 `setWriter`\
  \ 方法来重定向脚本的标准输入和输出。例如：\n\n```\nvar writer = new StringWriter();\nengine.getContext().setWriter(new\
  \ PrintWriter(writer, true));\n```\n\n使用 JavaScript 的 `print` 或 `println` 函数写入的任何输出都将发送到\
  \ `writer`。\n\n`setReader` 和 `setWriter` 方法只影响脚本引擎的标准输入和输出源。例如，如果你执行以下 JavaScript\
  \ 代码：\n\n```\nprintln(\"Hello\");\njava.lang.System.out.println(\"World\");\n```\n\
  \n只有第一个输出被重定向了。\n\nRhino 引擎没有标准输入源的概念。调用 `setReader` 没有效果。\n\n### javax.script.ScriptEngine\n\
  \n* `ScriptContext getContext()`\n  获取此引擎的默认脚本作用域。\n\n### javax.script.ScriptContext\n\
  \n* `Reader getReader()`\n* `void setReader(Reader reader)`\n* `Writer getWriter()`\n\
  * `void setWriter(Writer writer)`\n* `Writer getErrorWriter()`\n* `void setErrorWriter(Writer\
  \ writer)`\n  获取或设置输入的 reader 或正常/错误输出的 writer。\n\n### 8.2.4 调用脚本函数和方法\n\n在某些脚本引擎中，你可以直接在\
  \ Java 代码中调用脚本语言函数，而无需评估执行该调用的脚本片段。如果你允许用户使用他们选择的脚本语言实现服务，以便你能够从 Java 中调用它，这非常有用。\n\
  \n提供此功能的脚本引擎实现了 `Invocable` 接口。特别是，Rhino 引擎实现了 `Invocable`。\n\n要调用函数，调用 `invokeFunction`\
  \ 方法并传入函数名，随后是函数参数：\n\n```\n// 在 JavaScript 中定义 greet 函数\nengine.eval(\"function\
  \ greet(how, whom) { return how + ', ' + whom + '!' }\");\n// 使用参数 \"Hello\", \"\
  World\" 调用函数\nresult = ((Invocable) engine).invokeFunction(\"greet\", \"Hello\"\
  , \"World\");\n```\n\n如果脚本语言是面向对象的，请调用 `invokeMethod`：\n\n```\n// 在 JavaScript 中定义\
  \ Greeter 类\nengine.eval(\"\"\"function Greeter(how) { this.how = how }\n\nGreeter.prototype.welcome\
  \ = \n   function (whom) { return this.how + ', ' + whom + '!' }\n\"\"\");\n\n//\
  \ 构造实例\nObject yo = engine.eval(\"new Greeter('Hello')\");\nresult = ((Invocable)\
  \ engine).invokeMethod(yo, \"World\");\n```\n\nRhino 不支持现代类语法。关于如何用旧方法在 JavaScript\
  \ 中定义类，请参阅 Douglas Crockford (2008) 写的 *JavaScript—The Good Parts*。\n\n如果脚本引擎没有\
  \ `Invocable` 接口，你仍然可以以语言无关的方式调用方法。`ScriptEngineFactory` 接口的 `getMethodCallSyntax`\
  \ 方法产生一个可以传递给 `eval` 方法的字符串。然而，对于这种情况，所有方法参数必须绑定名称，而 `invokeMethod` 可以使用任意值。\n\n\
  你可以更进一步，要求脚本引擎实现 Java 接口。这样你就可以用 Java 方法调用语法调用脚本函数和方法。\n\n细节取决于脚本引擎，但通常你需要为接口的每个方法提供一个函数。例如，考虑以下\
  \ Java 接口：\n\n```java\npublic interface Greeter\n{\n   String welcome(String whom);\n\
  }\n```\n\n如果你在 Rhino 中定义一个同名的全局函数，你就可以通过此接口调用它：\n\n```\n// 在 JavaScript 中定义 welcome\
  \ 函数\nengine.eval(\"function welcome(whom) { return 'Hello, ' + whom + '!' }\");\n\
  // 获取 Java 对象并调用 Java 方法\nGreeter g = ((Invocable) engine).getInterface(Greeter.class);\n\
  result = g.welcome(\"World\");\n```\n\n在面向对象的脚本语言中，你可以通过匹配的 Java 接口访问脚本类。例如，以下是用\
  \ Java 语法调用 JavaScript `Greeter` 类实例的方法：\n\n```javaGreeter g = ((Invocable) engine).getInterface(yo,\
  \ Greeter.class);\nresult = g.welcome(\"World\");\n```\n\n\n\n\n\n总而言之，如果你想从 Java\
  \ 调用脚本代码而不必担心脚本语言的语法，那么 `Invocable` 接口非常有用。\n\n`javax.script.Invocable` 6\n\n* \
  \  `Object invokeFunction(String name, Object... args)`\n*   `Object invokeMethod(Object\
  \ thiz, String name, Object... args)`\n    使用给定的名称和给定的参数调用函数或方法。\n*   `<T> T getInterface(Class<T>\
  \ clasz)`\n    返回给定接口的实现，通过脚本引擎中的函数来实现该方法。\n*   `<T> T getInterface(Object thiz,\
  \ Class<T> clasz)`\n    返回给定接口的实现，通过给定对象的方法来实现该接口方法。\n\n### 8.2.5. 编译脚本\n\n某些脚本引擎可以将脚本代码编译为中间形式以便进行高效执行。这些引擎实现了\
  \ `Compilable` 接口。下面的示例展示了如何编译和评估脚本文件中包含的代码：\n\n```\nif (engine instanceof Compilable\
  \ compilableEngine) {\n   Reader reader = Files.newBufferedReader(path);\n   CompiledScript\
  \ script = compilableEngine.compile(reader);\n   script.eval();\n}\n```\n\n当然，只有当你需要反复执行脚本时，编译脚本才有意义。\n\
  \n`javax.script.Compilable` 6\n\n*   `CompiledScript compile(String script)`\n*\
  \   `CompiledScript compile(Reader reader)`\n    编译由字符串或读取器提供的脚本。\n\n`javax.script.CompiledScript`\
  \ 6\n\n*   `Object eval()`\n*   `Object eval(Bindings bindings)`\n    评估此脚本。\n\n\
  ### 8.2.6. 示例：脚本工作表 (Script Sheets)\n\n查看列表 8.2 中的程序，它以与第 8.1.6 节示例相同的格式执行表。但是，这次代码是用脚本语言编写的，并在程序运行时进行评估。\n\
  \n类路径中必须包含一个脚本引擎。按如下方式启动程序：\n\n```\njava -classpath .:engineDir/* ScriptTest engineName\
  \ sheetFile\n```\n\n例如，\n\n```\njava -classpath .:rhino/* script.ScriptTest rhino\
  \ script/sheet\n```\n\nListing 8.2 script/ScriptTest.java\n\n```java\npackage script;\n\
  \nimport java.io.*;\nimport java.nio.file.*;\nimport javax.script.*;\n\n/**\n *\
  \ @version 1.1 2023-08-17\n * @author Cay Horstmann\n * \nDownload Rhino and the\
  \ Rhino engine JAR from \nhttps://mvnrepository.com/artifact/org.mozilla/rhino\n\
  https://mvnrepository.com/artifact/org.mozilla/rhino-engine\nPlace in a directory\
  \ rhino\njavac script/ScriptTest.java\njava --classpath .:rhino/* script.ScriptTest\
  \ rhino script/sheet\n */\npublic class ScriptTest\n{\n   public static void main(String[]\
  \ args) throws ScriptException, IOException\n   {\n      var manager = new ScriptEngineManager();\n\
  \      String language;\n      if (args.length == 0) \n      {\n         System.out.println(\"\
  Available factories: \");\n         for (ScriptEngineFactory factory : manager.getEngineFactories())\n\
  \            System.out.println(factory.getEngineName());\n         return;\n  \
  \    }\n      else language = args[0];\n      ScriptEngine engine = manager.getEngineByName(language);\
  \               \n      if (engine == null)\n      {\n         System.err.println(\"\
  No engine for \" + language);\n         System.exit(1);\n      }\n      String sheetName\
  \ = args[1];\n      boolean verbatim = false;\n      var verbatimCode = new StringBuilder();\
  \ \n      for (String line : Files.readAllLines(Path.of(sheetName)))\n      {\n\
  \         if (line.equals(\"```\")) {\n            verbatim = !verbatim;\n     \
  \       if (!verbatim)\n            {\n               engine.eval(verbatimCode.toString());\n\
  \               verbatimCode.delete(0, verbatimCode.length());\n            }\n\
  \         }\n         else if (verbatim) verbatimCode.append(line).append(\"\\n\"\
  );\n         else\n         {\n            String[] fragments = line.split(\"`\"\
  );\n            for (int i = 0; i < fragments.length; i++)\n            {\n    \
  \           System.out.print(i % 2 == 0 ? fragments[i] : engine.eval(fragments[i]));\n\
  \            }\n            System.out.println();\n         }\n      }      \n \
  \  }\n}\n```\n\n# 第 9 章 ▪ 安全\n\n当 Java 技术首次问世时，人们兴奋的焦点并不是一种设计精良的编程语言，而是通过互联网安全地执行小程序\
  \ (applets) 的可能性。显然，只有当接收者能够确定代码不会对其机器造成破坏时，提供可执行的小程序运行才有实际意义。因此，安全一直是 Java 技术设计者和用户关注的重点。这意味着与其他语言和系统不同（在那些系统中，安全是事后考虑或作为对入侵的反应实现的），安全机制是\
  \ Java 技术不可或缺的一部分。\n\n安全架构由三部分组成：\n\n1.  语言和虚拟机设计特性（数组边界检查、不进行未检查的类型转换、无指针算术等）。\n\
  2.  `security manager` (安全管理器)，用于控制代码可以的操作（文件访问、网络访问等）。\n3.  代码签名，通过这种方式对代码进行验证。\n\
  \n第一部分取得了巨大的成功。C++ 程序经常受到缓冲区溢出等攻击，但 Java 提供了强大的保护。遗憾的是，另外两个部分并没有那么好。安全管理器非常复杂且存在巨大的攻击面。从\
  \ Java 17 开始它被弃用了。代码签名架构也随着小程序的消失而失效。\n\n在本书之前的版本中，安全管理器代码签名是本章的重点，但显然这些需求已经消失。我们将首先讨论在加载时检查类文件完整性的\
  \ `class loaders`。我将演示该机制如何检测篡改。然后，你将学习用于许多安全操作的认证框架和加密算法。\n\n## 9.1 类加载器\n\nJava\
  \ 编译器将源代码转换为虚拟机代码。这些虚拟机代码存储在扩展名为 `.class` 的类文件中。每个类文件包含一个类或接口的定义和实现代码。在接下来的节中，你将看到虚拟机是如何加载这些类文件的。\n\
  \n### 9.1.1. 类加载过程\n\n虚拟机只加载执行程序所需的类文件。例如，假设程序执行从 `MyProgram.class` 开始。虚拟机执行的步骤如下：\n\
  \n1.  虚拟机有一种加载类文件的机制——例如从磁盘读取文件或从网络请求；它使用这种机制加载 `MyProgram` 类文件的内容。\n2.  如果 `MyProgram`\
  \ 类具有其他类类型的字段或超类，它们的类文件也将被加载。（加载一个类所依赖的所有类的过程被称为*解析*该类。）\n3.  虚拟机随后执行 `main` 方法。\n\
  4.  如果 `main` 方法或 `main` 调用的方法需要额外的类，这些类将被加载。\n\n然而，类加载机制并不只使用单个类加载器。每个 Java 程序至少拥有三个类加载器：\n\
  \n*   启动类加载器 (bootstrap class loader)\n*   平台类加载器 (platform class loader)\n*   系统类加载器\
  \ (system class loader，有时称为应用类加载器)\n\n启动类加载器加载模块包含的平台类\n\n\n\n\n\n```\njava.base\
  \                   \njava.datatransfer           \njava.desktop               \
  \ \njava.instrument             \njava.logging                \njava.management\
  \             \njava.management.rmi         \njava.naming                 \njava.prefs\
  \                  \njava.rmi                    \njava.security.sasl\njava.xml\n\
  ```\n\n以及许多 JDK 内部模块。\n\n没有与启动器类加载器对应的 `ClassLoader` 对象。例如：\n\n```\nStringBuilder.class.getClassLoader()\n\
  ```\n\n返回 `null`。\n\n在 Java 9 之前，Java 平台类位于一个名为 `rt.jar` 的文件中。现如今，Java 平台是模块化的，每个平台模块都包含在一个\
  \ `JMOD` 文件中（参见第一卷第 9 章）。平台类加载器负责加载 Java 平台中所有未被启动器类加载器加载的类。\n\n系统类加载器从模块路径和类路径加载应用程序类。\n\
  \n在 Java 9 之前，“扩展类加载器”会从 `jre/lib/ext` 目录加载“标准扩展”，并且“认可标准覆盖”机制提供了一种用新版本覆盖某些平台类（包括\
  \ CORBA 和 XML 实现）的方法。这两种机制均已被移除。\n\n### 9.1.2. 类加载器层次结构\n\n类加载器之间存在父子关系。除了启动器之外，每个类加载器都有一个父类加载器。类加载器会给其父加载器加载任何给定类的机会，并且只有在父加载器失败时才会加载该类。例如，当要求系统类加载器加载一个平台类（例如\
  \ `java.lang.StringBuilder`）时，它首先询问平台类加载器。该加载器首先询问启动器类加载器。启动器类加载器找到并加载了该类，因此其他任何类加载器都不会再继续搜索。\n\
  \n某些程序具有插件架构，其中代码的某些部分封装为可选插件。如果插件被封装成 JAR 文件，你可以简单地使用 `URLClassLoader` 实例来加载插件类。\n\
  \n```\nvar url = new URL(\"file:///path/to/plugin.jar\");\nvar pluginLoader = new\
  \ URLClassLoader(new URL[] { url });\nClass<?> cl = pluginLoader.loadClass(\"mypackage.MyClass\"\
  );\n```\n\n由于 `URLClassLoader` 构造函数中没有指定父类，因此 `pluginLoader` 的父类是系统类加载器。图 9.1 显示了该层次结构。\n\
  \n![Figure](img/fig09-01.jpg)图 9.1: 类加载器层次结构\n\n在 Java 9 之前，系统类加载器是 `URLClassLoader`\
  \ 的实例。某些程序员使用强制类型转换来访问 `getURLs` 方法，或者通过反射调用受保护的 `addURLs` 方法将 JAR 文件添加到类路径中。这现在已不再可行。\n\
  \n在大多数情况下，你不需要担心类加载器层次结构。通常，类的加载是因为它们被其他类所需要，而这个过程对你来说是透明的。\n\n然而，偶尔你可能需要干预并指定一个类加载器。考虑这个例子：\n\
  \n* 你的应用程序代码包含一个辅助方法，该方法调用 `Class.forName(classNameString)`。\n* 该方法是从插件类中调用的。\n\
  * `classNameString` 指定了一个包含在插件 JAR 中的类。\n\n插件的作者希望加载该类。然而，辅助方法的类是由系统类加载器加载的，而 `Class.forName`\
  \ 使用的也是该加载器。插件 JAR 中的类是不可见的。这种现象被称为*类加载器反转*。\n\n为了解决这个问题，辅助方法需要使用正确的类加载器。它可以将类加载器作为参数引入。或者，它可以要求将正确的类加载器设置为当前线程的上下文类加载器。这种策略被许多框架（如\
  \ JAXP 和 JNDI）使用。\n\n每个线程都有一个类加载器的引用，称为上下文类加载器。主线程的上下文类加载器是系统类加载器。当创建一个新线程时，它的上下文类加载器被设置为创建该线程的上下文类加载器。因此，如果你什么都不做，所有线程的上下文类加载器都将被设置为系统类加载器。\n\
  \n然而，你可以通过调用以下代码设置任何类加载器：\n\n```\nThread t = Thread.currentThread();\nt.setContextClassLoader(loader);\n\
  ```\n\n辅助方法随后可以获取上下文类加载器：\n\n```\nThread t = Thread.currentThread();\nClassLoader\
  \ loader = t.getContextClassLoader();\nClass<?> cl = loader.loadClass(className);\n\
  ```\n\n如果你写了一个通过名称加载类的方法，那么为调用者提供在显式传递类加载器和使用上下文类加载器之间的选择是一个好主意。不要简单地使用方法所在类的类加载器。\n\
  \n### 9.1.3. 将类加载器作为命名空间\n\n每个 Java 程序员都知道包名被用于消除命名冲突。标准库中有两个名为 `Date` 的类，但它们真正的名称显然是\
  \ `java.util.Date` 和 `java.sql.Date`。简单名只是为了程序员的方便，并且包含适当的 `import` 语句。在运行的程序中，所有类名都包含它们的包名。\n\
  \n然而，可能会让你惊讶的是，你可以在同一个虚拟机中拥有具有相同类名和包名的不同类。一个类是由其全名和类加载器决定的。这种技术对于从多个源加载代码非常有用。例如，应用程序服务器为每个应用程序使用单独类加载器。这允许虚拟机区分来自不同应用程序的类，无论它们如何命名。图\
  \ 9.2 显示了一个示例。假设应用程序服务器加载了两个应用程序，每个程序都有一个名为 `Util` 的类。由于每个类都由单独的加载器加载，这些类是完全不同的且互不冲突。\n\
  \n![Figure](img/fig09-02.jpg)图 9.2: 两个类加载器加载相同的类。\n\n### 9.1.4. 编写自己的类加载器\n\n你可以为了特殊目的编写自己的类加载器。这允许你在将字节码传递给虚拟机之前执行自定义检查。例如，你的类加载器可能会拒绝加载未标记为“已付费”的类。\n\
  \n要编写自己的类加载器，只需扩展 `ClassLoader` 类并重写方法\n\n```\nfindClass(String className)\n```\n\
  \n`ClassLoader` 超类的 `loadClass` 方法处理委托给父类的逻辑，并在类尚未加载且父加载器无法加载该类时才调用 `findClass`。\n\
  \n你的方法实现必须执行以下操作：\n\n1. 从本地文件系统或其他源加载类的字节码。\n2. 调用 `ClassLoader` 超类的 `defineClass`\
  \ 方法将字节码呈现给虚拟机。\n\n在列表 9.1](#index_u7.xhtml_ch09list01)的程序中，我们实现了一个加载加密类文件的类加载器。程序询问用户要加载的第一个类的名称（即包含\
  \ `main` 的类）以及解密密钥。然后它使用特殊的类加载器加载指定的类并调用 `main` 方法。该类加载器会解密指定的类及其引用的所有非系统类。最后，程序调用加载类的\
  \ `main` 方法。\n\n为了简单起见，我们忽略了密码学领域 2000 年的进步，使用古老的凯撒密码来加密类文件。\n\n\n\n\n\n大卫·卡恩的奇书《破译者》（*Macmillan,\
  \ 1967, p. 84*）将苏提乌乌斯引用为凯撒密码的历史来源。凯撒将罗马字母表的 24 个字母移动了 3 位，这在当时困扰了他的对手。\n\n当本章首次撰写时，美国政府限制了强加密方法的出口。因此，我使用了凯撒方法作为示例，因为它显然是允许出口的。\n\
  \n我们版本的凯撒密码其密钥是一个 1 到 255 之间的数字。要解密，只需将该密钥加到每个字节并对 256 取模即可。列表 9.2 中的 `Caesar.java`\
  \ 程序执行了加密操作。\n\n为了不与常规类加载器混淆，我们对加密类文件使用不同的扩展名 `.caesar`。\n\n要解密，类加载器只需从每个字节中减去密钥。在本书配套的代码中，你会找到四个使用密钥值\
  \ 3 加密的类文件——这是传统的选择。要运行加密后的程序，你需要我们在 `ClassLoaderTest` 程序中定义的自定义类加载器。\n\n尝试使用类名\
  \ `Calculator` 和解密密钥 `3` 运行该程序。会弹出一个计算器。但如果你使用不同的密钥，类加载器将抛出异常。\n\n加密类文件有许多实际用途（当然当然，前提是你使用了某种比凯撒密码更强的方法）。没有解密密钥，这些类文件是毫无用的。它们既无法被标准的虚拟机执行，也无法被轻易反编译。\n\
  \n这意味着你可以使用自定义类加载器来验证该类的用户，或者在允许程序运行之前确保其已支付费用。当然，加密只是自定义类加载器的应用之一。你可以使用其他类型的类加载器来解决其他问题——例如，将类文件存储在数据库中。\n\
  \n#### 列表 9.1 classLoader/ClassLoaderTest.java\n\n```java\npackage classLoader;\n\
  \nimport java.io.*;\nimport java.lang.reflect.*;\nimport java.nio.file.*;\nimport\
  \ java.util.*;\n\n/**\n * 此程序演示了一个解密类文件的自定义类加载器。\n * @version 1.3 2023-11-12\n *\
  \ @author Cay Horstmann\n */\npublic class ClassLoaderTest\n{\n   public static\
  \ void main(String[] args) throws ReflectiveOperationException\n   {\n      Scanner\
  \ in = new Scanner(System.in);\n      System.out.print(\"Class name: \");\n    \
  \  String className = in.nextLine();\n      System.out.print(\"Decryption key: \"\
  );\n      int decryptionKey = in.nextInt();\n      var loader = new CryptoClassLoader(decryptionKey);\n\
  \      Class<?> c = loader.loadClass(className);\n      Method m = c.getMethod(\"\
  main\", String[].class);\n      m.invoke(null, (Object) new String[] {});\n   }\n\
  }\n\n/**\n * 此类加载器加载加密的类文件。\n */\nclass CryptoClassLoader extends ClassLoader\n\
  {\n   private int key;\n\n   /**\n    * 构建一个加密类加载器。\n    * @param k 解密密钥\n    */\n\
  \   public CryptoClassLoader(int k)\n   {\n      key = k;\n   }\n\n   protected\
  \ Class<?> findClass(String name) throws ClassNotFoundException\n   {\n      try\n\
  \      {\n         byte[] classBytes = loadClassBytes(name);\n         Class<?>\
  \ cl = defineClass(name, classBytes, 0, classBytes.length);\n         if (cl ==\
  \ null) throw new ClassNotFoundException(name);\n         return cl;\n      }\n\
  \      catch (IOException e)\n      {\n         throw new ClassNotFoundException(name);\n\
  \      }\n   }\n\n   /**\n    * 加载并解密类文件字节。\n    * @param name 类名\n    * @return\
  \ 包含类文件的字节数组\n    */\n   private byte[] loadClassBytes(String name) throws IOException\n\
  \   {\n      String cname = name.replace(\".\", \"/\") + \".caesar\";\n      byte[]\
  \ bytes = Files.readAllBytes(Path.of(cname));\n      for (int i = 0; i < bytes.length;\
  \ i++)\n         bytes[i] = (byte) (bytes[i] - key);\n      return bytes;\n   }\n\
  }\n```\n\n#### 列表 9.2 classLoader/Caesar.java\n\n```java\npackage classLoader;\n\
  \nimport java.io.*;\n\n/**\n * 使用凯撒密码加密文件。\n * @version 1.03 2023-11-12\n * @author\
  \ Cay Horstmann\n */\npublic class Caesar\n{\n   public static void main(String[]\
  \ args) throws Exception\n   {\n      if (args.length != 3)\n      {\n         System.out.println(\"\
  USAGE: java classLoader.Caesar in out key\");\n         return;\n      }\n\n   \
  \   try (var in = new FileInputStream(args[0]);\n            var out = new FileOutputStream(args[1]))\n\
  \      {\n         int key = Integer.parseInt(args[2]);\n         boolean done =\
  \ false;\n         while (!done)\n         {\n            int ch = in.read();\n\
  \            if (ch == -1) done = true;\n            else out.write((byte) (ch +\
  \ key));\n         }\n      }\n   }\n}\n```\n\n`java.lang.Class` 1.0\n\n* `getClassLoader()`\
  \ 获取加载此类的类加载器。\n\n`java.lang.ClassLoader` 1.0\n\n* `getParent()` 返回父类加载器，如果父类加载器是启动类加载器，则返回\
  \ `null`。\n\n* `static getSystemClassLoader()` 获取系统类加载器——即用于加载第一个应用程序类的类加载器。\n\n\
  * `protected Class findClass(String name)` 应该由类加载器重写，以便查找某个类的字节码，并通过调用 `defineClass`\
  \ 方法将它们呈现给虚拟机。在类名中，使用 `.` 作为包分隔符，并且不要使用 `.class` 后缀。\n\n* `Class defineClass(String\
  \ name, byte[] byteCodeData, int offset, int length)` 向虚拟机添加一个新类，其字节码在给定的数据范围内提供。\n\
  \n`java.net.URLClassLoader` 1.2\n\n* `URLClassLoader(URL[] urls)`\n* `URLClassLoader(URL[]\
  \ urls, ClassLoader parent)` 构建一个从给定 URL 加载类的类加载器。如果 URL 以 `/` 结尾，则假设它是一个目录，否则假设它是一个\
  \ JAR 文件。\n\n`java.lang.Thread` 1.0\n\n* `getContextClassLoader()` 获取此线程创建者指定的、执行此线程时最合理的类加载器。\n\
  \n* `void setContextClassLoader(ClassLoader loader)` 为此线程中的代码设置一个用于加载类的类加载器。如果线程启动时没有显式设置上下文类加载器，则使用父线程的上下文类加载器。\n\
  \n### 9.1.5 字节码验证\n\n当类加载器向虚拟机呈现新加载的 Java 平台类的字节码时，这些字节码首先由一个*验证器（verifier）*进行检查。验证器检查指令无法执行明显破坏的操作。除了平台类之外，所有类都经过了验证。\n\
  \n以下是验证器执行的一些检查：\n\n* 变量在 ways 之前已初始化。\n*   方法调用与对象引用的类型匹配。\n*   没有违反访问私有数据和方法的规则。\n\
  *   局部变量的访问落在运行时栈的范围内。\n* 运行时栈不会溢出。\n\n如果这些任何一项检查失败，该类将被认为已损坏且不会被加载。\n\n\n\n\n如果你熟悉哥德尔定理（Gödel’s\
  \ theorem），你可能会好奇验证器如何证明一个类文件没有类型不匹配、未初始化的变量和栈溢出。哥德尔定理指出，无法设计出一种算法来处理程序并判断该程序是否具有特定属性（例如是否存在栈溢出）。这难道是\
  \ Oracle 的公关部门与逻辑法则之间的冲突吗？不——事实上，验证器在哥德尔的意义上`不是`一个决策算法。如果验证器接受了一个程序，它确实是安全的。然而，验证器可能会拒绝虚拟机指令，尽管它们实际上是安全的。（当你被迫用占位值（dummy\
  \ value）来初始化变量时，你可能遇到过这个问题，因为验证器无法看到该变量将会被正确地初始化。）\n\n这种严格的验证是一项重要的安全考虑。意外错误（如未初始化的变量）如果没有被捕获，很容易造成破坏性影响。更重要的是，在开放的互联网世界中，你必须防止那些故意制造恶意影响的恶意程序员。例如，通过修改运行时堆栈上的值或通过向平台对象的私有实例字段写入数据，程序可以突破浏览器的安全系统。\n\
  \n然而，你可能会问，为什么需要一个特殊的验证器来检查所有这些特性呢？毕竟，编译器永远不会允许你生成一个使用了未初始化变量、或从另一个类访问私有实例字段的类文件。事实上，Java\
  \ 编程语言编译器生成的类文件总是通过验证的。但是，类文件中使用的字节码格式有详尽的文档，对于具有汇编编程经验和使用十六进制编辑器的人来说，手动生成一个包含 Java\
  \ 虚拟机有效但不安全指令的类文件很容易。验证器始终在防止恶意篡改的类文件——而不仅仅检查编译器生成的类文件。\n\n### 构建修改过的类文件\n\n这里有一个构造此类修改过的类文件的示例。我们从列表\
  \ 9.3 中的程序 `VerifierTest.java` 开始。这是一个简单的程序，调用一个方法并显示该方法的结果。`fun` 方法本身只是计算 `1 +\
  \ 2`。\n\n```\nstatic int fun()\n{\n   int m;\n   int n;\n   m = 1;\n   n = 2;\n\
  \   int r = m + n;\n   return r;\n}\n```\n\n作为一个实验，尝试编译该程序的以下修改：\n\n```\nstatic\
  \ int fun()\n{\n   int m = 1;\n   int n;\n   m = 1;\n   m = 2;\n   int r = m + n;\n\
  \   return r;\n}\n```\n\n在这里，`n` 没有被初始化，因此它可以是任何随机值。当然，编译器检测到了那个问题并拒绝编译该程序。要创建一个糟糕的类文件，我们需要多下点功夫。首先，运行\
  \ `javap` 程序来查看编译器是如何翻译 `fun` 方法的。命令\n\n```\njavap -c verifier.VerifierTest\n```\n\
  \n将以助记符形式显示类文件中的字节码。\n\n```\nMethod int fun()\n   0 iconst_1\n   1 istore_0\n  \
  \ 2 iconst_2\n   3 istore_1\n   4 iload_0\n   5 iload_1\n   6 iadd\n   7 istore_2\n\
  \   8 iload_2\n   9 ireturn\n```\n\n使用十六进制编辑器将指令 3 从 `istore_1` 修改为 `istore_0`。也就是说，局部变量\
  \ 0（即 `m`）被初始化了两次，而局部变量 1（即 `n`）完全没有初始化。我们需要知道这些指令的十六进制值；这些值可以从 Java 虚拟机规范（[`docs.oracle.com/javase/specs/jvms/se21/html/index.html`](https://docs.oracle.com/javase/specs/jvms/se21/html/index.html)）中获取。\n\
  \n```\n0 iconst_1 04\n1 istore_0 3B\n2 iconst_2 05\n3 istore_1 3C\n4 iload_0  1A\n\
  5 iload_1  1B\n6 iadd     60\n7 istore_2 3D\n8 iload_2  1C\n9 ireturn  AC\n```\n\
  \n你可以使用任何十六进制编辑器执行修改。在图 9.3 中，你看到类文件 `VerifierTest.class` 被载入 Gnome 十进制编辑器中，`fun`\
  \ 方法的字节码被高亮。\n\n![Figure](img/fig09-04.jpg)图 9.3：使用十六进制编辑器修改字节码\n\n将 `3C` 改为 `3B`\
  \ 并保存类文件。然后尝试运行 `VerifierTest` 程序。你得到了一个错误消息：\n\n```\nException in thread \"main\"\
  \ java.lang.VerifyError:\n   (class: VerifierTest, method:fun signature: ()I)\n\
  \   Accessing value from uninitialized register 1\n```\n\n这是很好的——虚拟机检测到了我们的修改。\n\
  \n现在使用 `-noverify`（或 `-Xverify:none`）选项运行程序：\n\n```\njava -noverify verifier.VerifierTest\n\
  ```\n\n`fun` 方法返回了一个看似随机的值。这实际上是 `2`。这是因为我们禁用了验证。\n\n\n\n\n登录策略由一组登录模块组成，每个模块被标记为\
  \ `required`（强制）、`sufficient`（足够）、`requisite`（必须）或 `optional`（可选）。这些关键字的含义由以下算法给出：\n\
  \n1. 顺序执行模块，直到一个 `sufficient` 模块成功、一个 `requisite` 模块失败或到达模块列表末尾。\n2. 如果所有 `required`\
  \ 和 `requisite` 模块都成功，或者它们都没有被执行，且至少有一个 `sufficient` 或 `optional` 模块成功，则身份验证通过。\n\
  \n登录会验证一个 `subject`（主体），该主体可以包含多个 `principal`（主体者）。`principal` 描述主体的某些属性，例如用户名、组\
  \ ID 或角色。`com.sun.security.auth.UnixPrincipal` 描述 UNIX 登录名，`UnixNumericGroupPrincipal`\
  \ 可以测试是否为 UNIX 组的成员。\n\nListing 9.4 中的程序显示了当前登录用户的主体者。以如下方式运行该程序：\n\n```\njava -Djava.security.auth.login.config=auth/jaas.config\
  \ auth.AuthTest\n```\n\nListing 9.5 显示了登录配置。\n\n在 Windows 上，将 `jaas.config` 中的 `UnixLoginModule`\
  \ 更改为 `NTLoginModule`。\n\n#### Listing 9.4 auth/AuthTest.java\n\n```\npackage auth;\n\
  \nimport java.security.*;\nimport javax.security.auth.*;\nimport javax.security.auth.login.*;\n\
  \n/**\n * 此程序获取有关用户 Unix 登录的信息。\n * @version 1.03 2021-11-29\n * @author Cay Horstmann\n\
  \ */\npublic class AuthTest\n{\n   public static void main(final String[] args)\n\
  \   {\n      try\n      {\n         var context = new LoginContext(\"Login1\");\n\
  \         context.login();\n         System.out.println(\"Authentication successful.\"\
  );\n         Subject subject = context.getSubject();\n         for (Principal p\
  \ : subject.getPrincipals())\n         {\n            System.out.println(p.getClass().getName()\
  \ + \": \" + p.getName());\n         }         \n         context.logout();\n  \
  \    }\n      catch (LoginException e)\n      {\n         System.out.println(\"\
  Authentication failed.\");\n         e.printStackTrace();\n      }\n   }\n}\n```\n\
  \n#### Listing 9.5 auth/jaas.config\n\n```\nLogin1 \n{       \n   com.sun.security.auth.module.UnixLoginModule\
  \ required;\n};\n```\n\n#### `javax.security.auth.login.LoginContext` 1.4\n\n* `LoginContext(String\
  \ name)`: 构建一个登录上下文。`name` 对应 JAAS 配置文件中的登录描述符。\n* `void login()`: 建立登录，如果登录失败则抛出\
  \ `LoginException`。调用 JAAS 配置中模块的 `login` 方法。\n* `void logout()`: 注销主体。调用 JAAS 配置中模块的\
  \ `logout` 方法。\n* `Subject getSubject()`: 返回已验证的主体。\n\n#### `javax.security.auth.Subject`\
  \ 1.4\n\n* `Set<Principal> getPrincipals()`: 获取此主体的主体者。\n\n#### `java.security.Principal`\
  \ 1.1\n\n* `String getName()`: 返回该主体者的标识名称。\n\n### 9.2.2 JAAS 登录模块\n\n在本节中，我们将查看一个\
  \ JAAS 示例，它将向你展示\n\n* 如何实现你自己的登录模块\n* 如何实现基于角色的授权\n\n如果你在数据库中存储登录信息，那么提供自己的登录模块将很有用。\n\
  \n登录模块的一个工作是填充正在被验证的主体的主体者集合。如果登录模块支持角色，它会添加描述角色的 `Principal` 对象。Java 库没有提供为此目的的类，因此我自己写了一个类（参见\
  \ Listing 9.6）。\n\n登录模块在文本文件中查找用户、密码和角色，该文件包含如下所示行：\n\n```\nharry|secret|admin\n\
  carl|guessme|HR\n```\n\n当然，在真实的登录模块中，你会将这些信息存储在数据库或目录中。并且你会对密码进行哈希处理——参见第 9.3.8\
  \ 节。\n\n你可以在 Listing 9.7 中找到 `SimpleLoginModule` 的代码。`checkLogin` 方法检查用户名和密码是否与密码文件中的记录匹配。如果是，我们向主体的主体者集合添加两个\
  \ `Principal` 对象：\n\n```\nSet<Principal> principals = subject.getPrincipals();\n\
  principals.add(new UserPrincipal(username));\nprincipals.add(new RolePrincipal(role));\n\
  ```\n\n`UserPrincipal` 类声明在 `com.sun.security.auth` 包中。\n\n`SimpleLoginModule` 的其余部分是简单的样板代码。`initialize`\
  \ 方法接收：\n\n* 正在被验证的 `Subject`\n* 用于检索登录信息的处理器（handler）\n* 可用于登录模块之间通信的 `sharedState`\
  \ 映射\n* 包含在登录配置中设置的键/值对的 `options` 映射\n\n例如，我们如下配置我们的模块：\n\n```\nSimpleLoginModule\
  \ required passwordFile=\"jaas/password.txt\" debug=true;\n```\n\n`options` 映射包含了登录配置中设置的\
  \ `passwordFile` 和 `debug`。\n\n`initialize` 方法从 `passwordFile` 和 `debug` 设置。\n\n\
  登录模块并不收集用户名和密码；那是处理器的工作。这种分离允许你使用登录模块而不必担心信息来自对话框、控制台还是配置文件。\n\n在构造 `LoginContext`\
  \ 时指定处理器，例如：\n\n```\nvar context = new LoginContext(\"Login1\",\n   new com.sun.security.auth.callback.TextCallbackHandler());\n\
  ```\n\n`TextCallbackHandler` 类从控制台提示用户名和密码。\n\n然而，你通常会有自己的用户名和密码界面。在这种情况下，回调机制是多此一举，但没有其他方式传输该信息。Listing\
  \ 9.8 中的示例 Listing 9.8 应用程序使用一个简单的处理器来存储并返回该信息。\n\n处理器有一个 `handle` 方法，处理 `Callback`\
  \ 数组。许多预定义类（如 `NameCallback` 和 `PasswordCallback`）实现了 `Callback` 接口。你也可以添加自己的类，例如\
  \ `RetinaScanCallback`。处理器代码有点难看，因为它需要分析回调的类型：\n\n```java\npublic void handle(Callback[]\
  \ callbacks)\n{\n   for (Callback callback : callbacks)\n   {\n      switch (callback)\n\
  \      {\n         case NameCallback c -> c.setName(username);\n         case PasswordCallback\
  \ c -> c.setPassword(password);\n         default -> {}\n      }\n   }\n}\n```\n\
  \n`SimpleLoginModule` 的 `login` 方法准备了验证所需的回调：\n\n```\nvar nameCallback = new NameCallback(\"\
  username: \");\nvar passwordCallback = new PasswordCallback(\"password: \", false);\n\
  callbackHandler.handle(new Callback[] { nameCallback, passwordCallback });\n```\n\
  \n取决于处理器，`handle` 方法可以询问用户或从某处检索信息。当 `handle` 方法返回时，`nameCallback` 和 `passwordCallback`\
  \ 对象已被设置。然后 `login` 方法获取用户名和密码并检查是否有效。\n\nListing 9.9 中的程序使用 `TextCallbackHandler`\
  \ 或自定义登录，命令行用户名并提示密码。登录成功后，将显示主体者。以如下方式运行程序：\n\n```\njava -Djava.security.auth.login.config=jaas/jaas.config\
  \ jaas.JAASTest\n```\n\n或\n\n```\njava -Djava.security.auth.login.config=jaas/jaas.config\
  \ jaas.JAASTest harry\n```\n\n可以支持更复杂的两阶段协议，如果登录配置中的所有模块都成功，则登录将被*提交*。有关更多信息，请参阅登录模块开发者指南：https://docs.oracle.com/javase/8/docs/technotes/guides/security/jaas/JAASLMDevGuide.html](https://docs.oracle.com/javase/8/docs/technotes/guides/security/jaas/JAASLMDevGuide.html)。\n\
  \n\n\n\n\n### Listing 9.6 `jaas/RolePrincipal.java`\n\n```java\npackage jaas;\n\n\
  import java.security.*;\n\n/**\n * 一个具有命名角色的主体（Principal）。\n */\npublic record RolePrincipal(String\
  \ name) implements Principal\n{\n   /**\n    * @return 角色名称。\n    */\n   public\
  \ String getName()\n   {\n      return name;\n   }\n}\n```\n\n### Listing 9.7 `jaas/SimpleLoginModule.java`\n\
  \n```java\npackage jaas;\n\nimport com.sun.security.auth.*;\nimport java.io.*;\n\
  import java.nio.file.*;\nimport java.security.*;\nimport java.util.*;\nimport javax.security.auth.*;\n\
  import javax.security.auth.callback.*;\nimport javax.security.auth.login.*;\nimport\
  \ javax.security.auth.spi.*;\n\n/**\n * 此登录模块通过从文本文件中读取用户名、密码和角色\n * 来验证用户身份。\n\
  \ */\npublic class SimpleLoginModule implements LoginModule\n{\n   private Subject\
  \ subject;\n   private CallbackHandler callbackHandler;\n   private boolean debug;\n\
  \   private String passwordFile;\n\n   public void initialize(Subject subject, CallbackHandler\
  \ callbackHandler,\n         Map<String, ?> sharedState, Map<String, ?> options)\n\
  \   {\n      this.subject = subject;\n      this.callbackHandler = callbackHandler;\n\
  \      debug = options.get(\"debug\").equals(\"true\");\n      passwordFile = \"\
  \" + options.get(\"passwordFile\");\n   }\n\n   public boolean login() throws LoginException\n\
  \   {\n      var nameCallback = new NameCallback(\"username: \");\n      var passwordCallback\
  \ = new PasswordCallback(\"password: \", false);\n      try\n      {\n         if\
  \ (debug) \n         {\n            System.Logger logger = System.getLogger(\"com.horstmann.corejava\"\
  ); \n            logger.log(System.Logger.Level.INFO, \"Invoking handler\");\n \
  \        }\n         if (callbackHandler == null) throw new LoginException(\"no\
  \ handler\");\n\n         callbackHandler.handle(new Callback[] { nameCallback,\
  \ passwordCallback });\n         return checkLogin(nameCallback.getName(), passwordCallback.getPassword());\n\
  \      }\n      catch (UnsupportedCallbackException | IOException e)\n      {\n\
  \         var e2 = new LoginException();\n         e2.initCause(e);\n         throw\
  \ e2;\n      }\n   }\n\n   /**\n    * 检查认证信息是否有效。如果有效，主体（subject）将获取\n    * 用户和角色的主体（principal）。\n\
  \    * @param username 用户名\n    * @param password 包含密码的字符数组\n    * @return 如果认证信息有效则返回\
  \ true\n    */\n   private boolean checkLogin(String username, char[] password)\
  \ \n         throws IOException\n   {\n      try (var in = new Scanner(Path.of(passwordFile)))\n\
  \      {\n         while (in.hasNextLine())\n         {\n            String[] inputs\
  \ = in.nextLine().split(\"\\\\|\");\n            if (inputs[0].equals(username)\
  \ \n                  && Arrays.equals(inputs[1].toCharArray(), password))\n   \
  \         {\n               String role = inputs[2];\n               Set<Principal>\
  \ principals = subject.getPrincipals();\n               principals.add(new UserPrincipal(username));\n\
  \               principals.add(new RolePrincipal(role));\n               return\
  \ true;\n            }\n         }\n         return false;\n      }\n   }\n\n  \
  \ public boolean logout()\n   {\n      return true;\n   }\n\n   public boolean abort()\n\
  \   {\n      return true;\n   }\n\n   public boolean commit()\n   {\n      return\
  \ true;\n   }\n}\n```\n\n### Listing 9.8 `jaas/SimpleCallbackHandler.java`\n\n```java\n\
