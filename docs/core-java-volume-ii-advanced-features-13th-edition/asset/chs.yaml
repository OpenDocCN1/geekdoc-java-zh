  \n*   GIF、JPEG 或 PNG 格式的图像\n\n*   文本、HTML、PostScript 或 PDF 格式的文档\n\n*   原始打印机代码\n\
  \n*   实现了 `Printable`、`Pageable` 或 `RenderableImage` 接口的对象\n\n\n\n\n\n数据本身可以存储在字节或字符源中，例如输入流、URL\
  \ 或数组。`document flavor`（文档格式）描述了数据源和数据类型的组合。`DocFlavor` 类为各种数据源定义了若干个内部类。每个内部类都定义了常量，用于指定特定的格式。例如，常量\n\
  \n```\nDocFlavor.INPUT_STREAM.GIF\n```\n\n描述了从输入流中读取的 GIF 图像。表 12.4 列出了这些组合。\n\n\
  ### 表 12.4：用于打印服务的文档格式\n\n| 数据源 | 数据类型 | MIME 类型 |\n| --- | --- | --- |\n| `INPUT_STREAM`\
  \ | `GIF` | `image/gif` |\n| `URL` | `JPEG` | `image/jpeg` |\n| `BYTE_ARRAY` | `PNG`\
  \ | `image/png` |\n| | `POSTSCRIPT` | `application/postscript` |\n| | `PDF` | `application/pdf`\
  \ |\n| | `TEXT_HTML_HOST` | `text/html` (使用主机编码) |\n| | `TEXT_HTML_US_ASCII` | `text/html;\
  \ charset=us-ascii` |\n| | `TEXT_HTML_UTF_8` | `text/html; charset=utf-8` |\n| |\
  \ `TEXT_HTML_UTF_16` | `text/html; charset=utf-16` |\n| | `TEXT_HTML_UTF_16LE` |\
  \ `text/html; charset=utf-16le` (小端序) |\n| | `TEXT_HTML_UTF_16BE` | `text/html;\
  \ charset=utf-16be` (大端序) |\n| | `TEXT_PLAIN_HOST` | `text/plain` (使用主机编码) |\n|\
  \ | `TEXT_PLAIN_US_ASCII` | `text/plain; charset=us-ascii` |\n| | `TEXT_PLAIN_UTF_8`\
  \ | `text/plain; charset=utf-8` |\n| | `TEXT_PLAIN_UTF_16` | `text/plain; charset=utf-16`\
  \ |\n| | `TEXT_PLAIN_UTF_16LE` | `text/plain; charset=utf-16le` (小端序) |\n| | `TEXT_PLAIN_UTF_16BE`\
  \ | `text/plain; charset=utf-16be` (大端序) |\n| | `PCL` | `application/vnd.hp-PCL`\
  \ (惠尔-惠 打印控制语言) |\n| | `AUTOSENSE` | `application/octet-stream` (原始打印数据) |\n| `READER`\
  \ | `TEXT_HTML` | `text/html; charset=utf-16` |\n| `STRING` | `TEXT_PLAIN` | `text/plain;\
  \ charset=utf-16` |\n| `CHAR_ARRAY` | | |\n| `SERVICE_FORMATTED` | `PRINTABLE` |\
  \ N/A |\n| | `PAGEABLE` | N/A |\n| | `RENDERABLE_IMAGE` | N/A |\n\n假设你想打印文件中的 GIF\
  \ 图像。首先，查找是否存在能够处理该任务的 `print service`（打印服务）。`PrintServiceLookup` 类的静态 `lookupPrintServices`\
  \ 方法返回一个可以处理给定文档格式的 `PrintService` 对象数组。\n\n```\nDocFlavor flavor = DocFlavor.INPUT_STREAM.GIF;\n\
  PrintService[] services = PrintServiceLookup.lookupPrintServices(flavor, null);\n\
  ```\n\n`lookupPrintServices` 方法的第二个参数为 `null`，表示我们不想通过指定打印机属性来限制搜索范围。我们将在下一节中介绍属性。\n\
  \n如果查找返回了一个包含多个元素的数组，请从列出的打印服务中选择一个。你可以调用 `PrintService` 类的 `getName` 方法获取打印机名称，并让用户进行选择。\n\
  \n接下来，从服务获取一个文档打印作业：\n\n```\nDocPrintJob job = services[i].createPrintJob();\n```\n\
  \n为了进行打印，你需要一个实现了 `Doc` 接口的对象。Java 库提供了一个 `SimpleDoc` 类来实现此目的。`SimpleDoc` 构造函数需要数据源对象、文档格式以及可选的属性集。例如，\n\
  \n```\nvar in = new FileInputStream(fileName);\nvar doc = new SimpleDoc(in, flavor,\
  \ null);\n```\n\n最后，你就可以准备打印了：\n\n```\njob.print(doc, null);\n```\n\n与之前一样，`null`\
  \ 参数可以替换为属性集。\n\n注意，此打印过程与前一节完全不同。它没有通过打印对话框进行用户交互。例如，你可以实现一种服务端打印机制，用户通过 Web 表单提交打印作业。\n\
  \n`javax.print.PrintServiceLookup` 1.4\n\n*   `PrintService[] lookupPrintServices(DocFlavor\
  \ flavor, AttributeSet attributes)`\n    查找可以处理给定文档格式和属性的打印服务。如果没有需要考虑的属性，`attributes`\
  \ 参数可以为 `null`。\n\n`javax.print.PrintService` 1.4\n\n*   `DocPrintJob createPrintJob()`\n\
  \    为打印一个对象创建一个打印作业。\n\n`javax.print.DocPrintJob` 1.4\n\n*   `void print(Doc doc,\
  \ AttributeSet attributes)`\n    使用给定的属性打印文档。\n\n`javax.print.SimpleDoc` 1.4\n\n\
  *   `SimpleDoc(Object data, DocFlavor flavor, AttributeSet attributes)`\n    构造一个\
  \ `SimpleDoc` 对象。\n\n### 12.7.4 流打印服务 (Stream Print Services)\n\n流服务将打印数据发送到打印机。流服务生成相同的打印数据，但将其发送到流，以便保存打印数据。即使在没有本地打印机的情况下可以使用该服务。枚举流服务比查找普通打印服务稍微麻烦。你需要要打印对象的\
  \ `DocFlavor` 以及流输出的 MIME 类型。然后获取一个 `StreamServiceFactory` 工厂数组。\n\n```\nDocFlavor\
  \ flavor = DocFlavor.SERVICE_FORMATTED.PRINTABLE;\nString mimeType = \"application/postscript\"\
  ;\nStreamServiceFactory[] factories = PrintServiceFactory.lookupStreamServiceFactories(flavor,\
  \ mimeType);\n```\n\n`StreamServiceFactory` 类没有区分不同工厂的方法，因此我们直接使用 `factories[0]`。我们带有输出流调用\
  \ `getPrintService` 方法来获取 `StreamPrintService` 对象。\n\n```\nvar out = new FileOutputStream(fileName);\n\
  StreamPrintService service = factories[0].getPrintService(out);\n```\n\n`StreamPrintService`\
  \ 类是 `PrintService` 的子类。要产生输出，按照前一节的步骤操作即可。\n\n`javax.print.StreamServiceFactory`\
  \ 1.4\n\n*   `StreamServiceFactory[] lookupStreamServiceFactories(DocFlavor flavor,\
  \ String mimeType)`\n    查找可以打印给定文档格式并产生给定 MIME 类型输出流的流打印服务工厂。\n*   `StreamPrintService\
  \ getPrintService(OutputStream out)`\n    获取将打印输出发送到给定输出流的打印服务。\n\n列表 12.29 程序演示了如何使用流打印服务打印\
  \ Java 2D 形状。你可以将示例绘制代码替换为生成任何 Java 2D 形状的代码，并将形状转换为 PostScript。然后你可以使用外部工具将结果转换为\
  \ PDF 或 EPS。（遗憾，Java 不支持直接打印到 PDF。）\n\n在此示例中，我们调用 `draw` 方法将 Java 2D 形状绘制到 `Graphics2D`\
  \ 对象上。如果你想绘制组件的表面（例如表格或树），请使用以下代码：\n\n```\nprivate static int IMAGE_WIDTH = component.getWidth();\n\
  private static int IMAGE_HEIGHT = component.getHeight();\npublic static void draw(Graphics2D\
  \ g2) { component.paint(g2); }\n```\n\n列表 12.29 `printService/PrintServiceTest.java`\n\
