  | `YEAR_OF_ERA` | `yy`: `69`, `yyyy`: `1969` |\n| `MONTH_OF_YEAR` | `M`: `7`, `MM`:\
  \ `07`, `MMM`: `Jul`, `MMMM`: `July`, `MMMMM`: `J` |\n| `DAY_OF_MONTH` | `d`: `6`,\
  \ `dd`: `06` |\n| `DAY_OF_WEEK` | `e`: `3`, `E`: `Wed`, `EEEE`: `Wednesday`, `EEEEE`:\
  \ `W` |\n| `HOUR_OF_DAY` | `H`: `9`, `HH`: `09` |\n| `CLOCK_HOUR_OF_AM_PM` | `h`:\
  \ `9`, `hh`: `09` |\n| `AMPM_OF_DAY` | `a`: `AM` |\n| 天时段（自 Java 16 起） | `B`: `in\
  \ the evening`, `at night`, `midnight` |\n| `MINUTE_OF_HOUR` | `mm`: `02` |\n| `SECOND_OF_MINUTE`\
  \ | `ss`: `00` |\n| `NANO_OF_SECOND` | `nnnnnn`: `000000` |\n| 时区 ID | `VV`: `America/New_York`\
  \ |\n| 时区名称 | `z`: `EDT`, `zzzz`: `Eastern Daylight Time`, `v`: `ET`, `vvvv`: `Eastern\
  \ Time` |\n| 区域偏移量 | `x`: `-04`, `xx`: `-0400`, `xxx`: `-04:00`, `XXX`: 相同，但零时使用\
  \ `Z` |\n\n注意这些字母的大小写：`M` 代表月份，`m` 代表分钟。你可能想要的是月的几 `d`，而不是年的几 `D`，以及是秒 `s` 而不是秒\
  \ `S`。最危险的是，`y` 表示普通年份，而 `Y` 是“周年份”，如果 1 月 1 日落在周五、周六或周日，两者会有细微的区别。\n\n`ofLocalizedPattern`\
  \ 方法产生一个格式化器，它以特定区域的方式组合模式部分，并带有相应的分隔符和部分顺序。例如：\n\n```\nDateTimeFormatter formatter\
  \ = DateTimeFormatter.ofLocalizedPattern(\"yMMMd\");\nformatter.withLocale(Locale.US).format(apollo11launch)\
  \ // Jul 16, 1969\nformatter.withLocale(Locale.GERMANY).format(apollo11launch) //\
  \ 16\\. Juli 1969\nformatter.withLocale(Locale.CHINA).format(apollo11launch) //\
  \ 1969 年 7 月 16 日\n```\n\n你只需要按从大到小的顺序指定各个部分的符号。不要包含任何分隔符。对于小时，使用 `j` 来本地化的 12 小时或\
  \ 24 小时格式：\n\n```\nformatter = DateTimeFormatter.ofLocalizedPattern(\"jm\");\nformatter.withLocale(Locale.US).format(LocalTime.of(23,\
  \ 59)) // 11:59 pm\nformatter.withLocale(Locale.GERMANY).format(LocalTime.of(23,\
  \ 59)) // 23:59\n```\n\n要从字符串解析日期/时间值，请使用其中一个静态 `parse` 方法。例如：\n\n```\nLocalDate\
  \ churchsBirthday = LocalDate.parse(\"1903-06-14\");\nZonedDateTime apollo11launch\
  \ =\n   ZonedDateTime.parse(\"1969-07-16 03:32:00-0400\",\n      DateTimeFormatter.ofPattern(\"\
  yyyy-MM-dd HH:mm:ssxx\"));\n```\n\n第一次调用使用了标准的 `ISO_LOCAL_DATE` 格式化器，第二个使用了自定义格式化器。\n\
  \n列表 6.4 中的程序显示了如何格式化和解析日期时间。\n\n### 列表 6.4 formatting/Formatting.java\n\n```\n\
