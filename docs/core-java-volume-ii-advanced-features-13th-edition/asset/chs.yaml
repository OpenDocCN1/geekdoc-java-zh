  \ static void main(String[] args)\n   {\n      new ViewDB2().run();\n   }\n\n  \
  \ public void run()\n   {\n      try (Connection conn = getConnection(readDatabaseProperties()))\n\
  \      {\n         console = new Scanner(System.in);\n         DatabaseMetaData\
