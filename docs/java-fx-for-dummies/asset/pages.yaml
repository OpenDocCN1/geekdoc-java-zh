  md: "# 258 Part III: Enhancing Your Scenic Design\n\nWhen you apply a style sheet\
    \ to a scene, any styles contained in that style sheet override any corresponding\
    \ styles in the application's default style sheet. Similarly, if you apply a style\
    \ sheet to a specific node, the styles in that style sheet override any corresponding\
    \ styles in the style sheet applied to the scene.\n\nYou can create as many style\
    \ sheets as you want, applying different style sheets to different parent nodes\
    \ within the scene. However, you'll find it easier to manage your styles and create\
    \ consistency if you stick to just one style sheet applied at the scene level.\n\
    \nA style sheet applied to a scene or parent node is actually a separate file\
    \ with the extension .css. The style sheet contains rules that provide the specifications\
    \ for the formatting you applied to your application.\n\nYou can read about the\
    \ details of creating a style sheet in the section \"Creating a Style Sheet\"\
    \ later in this chapter. For now, I introduce a very simple style sheet named\
    \ Simple.css that specifies the font to use and a background ground color. The\
    \ Simple.css style sheet consists of the following lines:\n\n```\n{\n  -fx-background-color:\
    \ lightgray;\n  -fx-font-family: \"serif\";\n  -fx-font-size: 12pt;\n}\n```\n\n\
    The first line specifies that the formatting between the curly braces follow applies\
    \ through the entire scene graph. Then, with the curly braces, three formatting\
    \ rules are used to specify that the background color should be lightgray, the\
    \ font should be serif, and the font size should be 12 points.\n\nThe easiest\
    \ way to add a style sheet to a scene is to get the scene's style sheet collection\
    \ (a scene can have more than one style sheet), you use the add method to add\
    \ the style sheet, like this:\n\n```\nscene.getStylesheets().add(\"Simple.css\"\
    \n```\n\nTo keep the code examples in this book, the rest of the examples in this\
    \ chapter use the simple technique shown in the preceding example. However, simply\
    \ specifying the stylesheet as the parameter to the add method will work only\
    \ if the style sheet resides in the same folder as the application's class file.\
    \ If the style sheet resides elsewhere, use the following code instead:"
