    Whew! That''s a mess. What it means is that the cell value factory must implement
    the Callback interface with the correct data types. The PropertyFactory class
    is designed specifically to work with the setCellValueFactory method, so it does
    indeed implement the Callback interface.


    The code necessary to create the other two columns is slightly different than
    using strings, each with integer and double values. Here''s the code to create
    the Year column:


    ```

    TableColumn<Movie, Integer> colYear =

    tableColumn("Year")

    colYear.setMinWidth(100)

