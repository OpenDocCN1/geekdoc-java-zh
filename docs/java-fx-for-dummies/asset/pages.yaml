- img_proc: true
  md: "# 310 Part IV: Making Your Programs Come Alive\n\nlanguages, such as C#, the\
    \ concept of properties is built in to the language. Alas, such is not the case\
    \ with Java. Java has no built-in features for implementing properties ... at\
    \ least, not until now.\n\nPrior to Java 8, Java developers usually followed the\
    \ pattern of using getters to retrieve and set property values. A getter is a\
    \ public method that retrieves the value of a property, and a setter is a public\
    \ method that sets the value of a property.\n\nFor example, suppose you're creating\
    \ a class that represents a customer, and each customer is identified by a unique\
    \ number. You might store the customer number internally as a private field named\
    \ customerNumber. Then, you'd provide a public method getCustomerNumber to return\
    \ the customer's number and another public method setCustomerNumber to set the\
    \ customer number. The resulting code would look like this:\n\n```\nclass Customer\
    \ {\n    private int customerNumber;\n    public int getCustomerNumber() {\n \
    \       return customerNumber;\n    }\n    public void setCustomerNumber(int value)\
    \ {\n        customerNumber = value;\n    }\n}\n```\n\nThis pattern of using getter\
    \ and setter methods has a name: the accessor pattern. (No, this has nothing to\
    \ do with property taxes.) Property taxes are determined by an assessor, not an\
    \ accessor.\n\nJavaFX introduces a new scheme for implementing properties, which\
    \ fully follows the accessor pattern. As a result, JavaFX classes that implement\
    \ properties must have a getter and a setter that returns and sets the value of\
    \ the properties (unless the property is read-only, in which case only a getter\
    \ is required).\n\nHowever, instead of using a simple field to represent the value\
    \ of the property, JavaFX uses special property classes to represent properties.\
    \ The classes encapsulate the value of a property in an object that provides the\
    \ new whiz-bang features that enable you to listen for changes in the property\
    \ value or bind properties together."
  merge: -1
  pgno: 319
- img_proc: true
  md: '# Chapter 15: Using Properties to Create Dynamic Scenes 311


    When JavaFX properties are used, the getter and setter methods return the value
    that''s encapsulated by the property object. In addition to the getter and setter
    methods, JavaFX properties introduce a third method which returns the actual property
    itself. This allows users of the property to directly access the property object,
    which in turn lets them access those whiz-bang features.


    Naming conventions are an essential aspect of using JavaFX properties. Every property
    has a name, which by convention begins with a lowercase letter. For example, a
    person''s first name might be called firstName. The getter and setter methods
    are created by capitalizing the property name and prefixing it with the word get
    or set. The method that returns the property object is the name of the property
    (capitalized) followed by the word Property.


    Thus, a class that implements a read/write property named firstName must expose
    three methods:


    ```

    getFirstName

    setFirstName

    firstNameProperty

    ```


    If the property is read-only, the setFirstName method would be omitted.


    # Java API Properties


    All JavaFX API classes that are presented in this book make extensive use of properties.
    In fact, just about every API get or set method is actually a property getter
    or setter, and has a corresponding method that returns the property itself.


    For example, consider the TextField class, which has methods getText and setText
    that get and set the text contained in the text field. These methods are actually
    getters and setters for a property named text, and the TextField class has a method
    named textProperty that provides direct access to the text property.'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# 312 Part IV: Making Your Programs Alive


    Likewise with the HBox class: It has properties named alignment, hgrow, padding,
    and spacing which correspond to the getAlignment, setAlignment, getGrow, setHgrow,
    getPadding, setPadding, getSpacing, and setSpacing methods.


    So far in this book, you''ve had no to access the properties directly, so you''ve
    relied on the getter and setter methods to manipulate the property values. Later
    in this chapter, when you discover how to bind property values, you will see that
    these properties can be very useful.


    In the next few sections, I will discuss how to create your JavaFX properties.
    Even if you never create JavaFX properties for your own classes, knowing how to
    do so will help you understand the benefits of working with the properties that
    are defined as part of the standard JavaFX API classes.


    # JavaFX Property Classes


    At the heart of JavaFX properties is a collection of classes that create property
    objects. There are a lot of them, as JavaFX provides four important classes for
    each of its basic data types, and property classes are provided for ten different
    data types. Do the math: That there are 40 property classes. The following paragraphs
    describe the four classes for String properties:


    +   - ReadOnlyProperty: An abstract class that represents a readonly property
    whose value can be read but not modified.

    - StringProperty: Another abstract class that represents a read-write property.
    This class extends ReadOnlyProperty.

    - SimpleStringProperty: This is the class you instantiate to create a read/write
    string property.

    - ReadOnlyWrapper: This is the class you instantiate to create a read-only string
    property. The use of this class is a bit confusing, so I won''t explain it quite
    yet. You will see how it works in the section "Creating a Read-Only Property"
    later in this chapter.


    For your reference, Table 15-1 lists all 40 of the classes used to create properties
    of the various types.'
