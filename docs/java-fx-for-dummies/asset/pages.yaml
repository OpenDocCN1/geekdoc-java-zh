  md: '# 394 Part V: The Part of Tens


    Here, the cylinder is moved 200 units to the left, 200 units down, and 200 units
    away from the camera. The resulting view looks more like a cylinder, as you can
    see in Figure 20-3.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_403_0.png)


    In Figure 20-3, it looks as if the cylinder has been rotated forward so that you
    can see a bit of the top surface. This isn''t the case, however. What has actually
    happened that you''re no longer looking at the cylinder edge-on. Instead, because
    the cylinder is below the camera, you''re looking down on it. Thus, you can see
    a bit of the top face. You''re also looking at it from the side, which explains
    why it appears just a dad tilted.


    # Step Five: Add a Box


    In this step, I add a second object to the 3D world: In this case, a box, represented
    by the Box class. Here''s the code:


    ```

    Box box = new Box(100, 100, 100);

    box.setMaterial(blueStuff);

    box.translateXZ(150);

    box.translateY(-100);

    box.translateZ(-100);

    root.getChild().).add(box);

    ```


    The Box constructor accepts three arguments representing the width, height, and
    depth of the box. In this example, all three are set to 100. Thus, the box will
    be drawn as a cube each side measuring 100 units.


    The box is given the same material as the cylinder; then it is translated on all
    three axes so that you can have a perspective view of the box. Figure 20-4 shows
    how the box appears when rendered. As you can see, the left and bottom faces of
    the box are visible because you translated the position of the box up and to the
    right so that the camera can gain some perspective.'
