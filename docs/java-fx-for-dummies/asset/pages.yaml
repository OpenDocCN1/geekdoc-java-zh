    2.


    In the remaining sections of this chapter, you figure out how to download, install,
    and configure the Java Development Kit and how to compile and test the Click Me
    program using popular Java development tools.


    # Downloading and Installing JavaFX


    Actually, the above heading is a bit of a trick. Prior to Java 8, JavaFX was a
    separate entity from Java. Thus, to use JavaFX, you had to download and install
    a separate JavaFX package. But beginning with Java 8, JavaFX is now an integral
    part of Java. So if you downloaded and installed Java 8, you already have JavaFX.


    In the following sections, I discuss how to download, install, and configure the
    Java 8 Development Kit (JDK 8) so that you can code and test JavaFX programs.
    If you already installed JDK 8, you can skip the rest of this section.


    # Downloading JDK 8


    To get to the download page, point your browser to http://java.oracle.com/technetwork/java
    and follow the appropriate links to download the JDK 8 for your operating system.


    When you get to the JDK download page, you find links to download the JDK or the
    JRE. Follow the JDK link; the JRE link gets you only the Java Runtime Environment,
    not the complete Java Development Kit.


    The JDK download comes in two versions:


    +   - The online version requires an active Internet connection to install the
    JDK.

    - The offline version lets you download the JDK installation file to your computer
    and install it later.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_25_0.png)


    I recommend that you use the offline version; it installs faster, and you can
    reinstall the JDK later if you need to without downloading it again.'
