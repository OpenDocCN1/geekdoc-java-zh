    Here are a few important points to know about the BorderPane class:


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_124_0.png)


    +   - If you don''t add a node to one of the regions, that region is not rendered.


    +   - The border layout regions are sized according to their contents.


    +   - Thus, if you add a VBox pane to the right region, the width of the VBox
    pane will determine the width of the right region.


    +   - If the user resizes the window to make it wider


    +   - Similarly, if the user drags the window to make it taller, the left, center,
    and right regions expand in height; the height of the top and bottom remains the
    same.


    +   - The nodes you add to the regions of a border pane will themselves almost
    be other layout panes.


