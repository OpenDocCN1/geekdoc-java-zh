  md: '# Chapter 6: Getting Input from the User 119


    The TextField class is defined in the javafx.scene.control package, so you should
    include the following imports statement in any program that uses a text field:


    ```

    import javafx.scene.control.*;

    ```


    The most common way to create a text field is to call the constructor without
    arguments, like this:


    ```

    TextField text1 = new TextField();

    ```


    You can set the initial value to be displayed like this:


    ```

    TextField text1 = new TextField("Initial value");

    ```


    Or, if you need to set the value later, you can call the setText method:


    ```

    text1.setText("Text value");

    ```


    To retrieve the value that the user has entered into a text field, call the getText
    method like this:


    ```

    String value = text1.getText();

    ```


    As with JavaFX control, managing the width of a text field can be a bit tricky.
    Ultimately, JavaFX will determine the width of the text field based on a number
    of factors, including the size of the window that contains the stage and scene
    and any size constraints placed on the pane or panes that contain the text field.
    You can set minimum and maximum limits for the text size by calling the setMinWidth
    and setMaxWidth methods, and you can indicate the preferred width by the setPrefWidth
    method, as in this example:


    ```

    TextField text1 = new TextField();

    text1.setMinWidth(150);

    text1.setMaxWidth(250);

    text1.setPrefWidth(200);

    ```


    Another way to set the preferred width is with the PrefColumnCount method, which
    sets the width in terms of average-sized characters. For example, the following
    line sizes the field large enough to display approximately 50 characters:


    ```

    text1.setPrefColumnCount(50);

    ```'
