  md: '# 94 Part I: Getting Started with JavaFX


    # # Introducing four JavaFX layout panes


    JavaFX provides many different layout panes for you to work with. I explain the
    following four in this chapter:


    +   - **HBox**: This layout pane arranges nodes horizontally, one next to the
    other. You use it to create controls arranged neatly in rows.

    - **VBox**: This layout pane arranges nodes vertically, one above the other. You
    use it to create controls arranged neatly in columns.

    - **FlowPane**: This layout pane arranges nodes next to each until it runs out
    of room; then, it wraps to continue layout nodes. You can configure a *FlowPane*
    to arrange nodes horizontally in rows or vertically in columns.

    - **BorderPane**: This layout pane divides the pane into five regions: Top, Left,
    Center, Right, and Bottom. When you add a node, you can specify which region you
    want to place the node in.


    To give you a general idea of the results that can be achieved with each of these
    four layout panes, Figure 5-1 shows four sample windows that each use one of the
    layout panes.


    Chapter 11 discusses additional types of layout panes.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_103_0.png)


    Figure 5-1: Four commonly used types of layout panes.'
