  md: "# Chapter 4: Setting the Stage and Scene Layout\n\nYou might be tempted to\
    \ create a single method that can serve as the event handler for both the Action\
    \ event of your Close button and the CloseRequest event, like this:\n\n```\nbtnClose.setText(\"\
    Close\");\nbtnClose.setOnAction( e -> btnClose_Click () );\nprimaryStage.setOnCloseRequest(\
    \ e -> btnClose_Click () );\n```\n\nHere, the intent is to handle the CloseRequest\
    \ event exactly as if the user had clicked the btnClose button.\n\nThat's a good\
    \ idea, but it doesn't work if the btnClose_Click event displays a confirmation\
    \ box and closes the stage only if the user confirms she wants to quit the program.\
    \ That's because when the event handler for the CloseRequest event ends, JavaFX\
    \ automatically closes the stage if the event handler doesn't explicitly close\
    \ the stage.\n\nTo prevent this happening, you can use the consume method of the\
    \ CloseRequest event. Consuming the event causes it to be stopped in its tracks\
    \ within the event handler, preventing JavaFX from automatically closing the stage\
    \ when the event handler ends.\n\nIn the Lambda expression passed to the setOnCloseRequest\
    \ method, the CloseRequest event object is represented by the argument e. Thus,\
    \ you can consume the CloseRequest event by calling e.consume().\n\nAn easy way\
    \ to provide a method that handles both the Action event for a Close button and\
    \ the CloseRequest event for a stage is to craft the Lambda expression for the\
    \ setOnCloseRequest method so that it consumes the event before calling the method\
    \ that will handle the event:\n\n```\nbtnClose.setText(\"Close\");\nbtnClose.setOnAction(\
    \ e -> btnClose_Click () );\nprimaryStage.setOnCloseRequest(\ne -> {\n  e.consume();\n\
    \  btnClose_Click ( );\n});\n```\n\nHere, the event handler for the CloseRequest\
    \ event first consumes the event and then calls btnClose_Click. The btnClose_Click\
    \ method, in turn, displays a confirmation box and closes the stage if the user\
    \ confirms that this is indeed what he wishes to do."
  merge: -1
  pgno: 98
