    # Creating an Editable Table


    Now you know how to create a read-only table, the next step is to add the ability
    to add and remove rows from the table or edit the cells within an existing row.
    The following sections show you how to do that.


    # Adding table rows


    To allow the user to add a row, you need to provide text boxes within which the
    user can enter data and an Add button the user can click to create a new row using
    the data entered by the user. In the OnAction event for the button, you simply
    create a new object using the data user entered into the text field and then add
    the object to the table''s items collection.'
