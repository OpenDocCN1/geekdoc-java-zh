  md: "# Examining the Stage Class\n\nA stage, which is represented by the Stage class,\
    \ is the topmost container in which a JavaFX user interface appears. In Windows,\
    \ on a Mac, or in Linux, a stage is usually a window. On other types of devices,\
    \ such as a smartphone or tablet, the stage may be the full screen or a tiled\
    \ region of the screen.\n\nWhen a JavaFX application is launched, a stage known\
    \ as the primary stage is automatically created. A reference to this stage is\
    \ passed to the application's start method via the primaryStage parameter:\n\n\
    ```\n@Override public void start (Stage primaryStage)\n  // primaryStage refers\
    \ to the\n  // application's primary stage.\n```\n\nYou can then use the primary\
    \ stage to create the application's user interface by adding a scene, which contains\
    \ one or more controls or other user-interface nodes.\n\nIn many cases, you will\
    \ need to access the primary stage outside of the scope of the start method. You\
    \ can easily make this possible by defining a class field and using it to reference\
    \ the primary stage. You see an example of how to do that later in this chapter,\
    \ the section \"Switching Scenes.\"\n\nThe primary stage initially takes on the\
    \ default characteristics of a normal windowed application, which depends on the\
    \ operating system within which the program will run. You can, if you choose,\
    \ change these defaults to suit the needs of your application. At the minimum,\
    \ you should always set the window title. You may also want to change details,\
    \ such as whether the stage is resizable and various aspects of the stage's appearance.\n\
    \nThe Stage class comes equipped with many methods that let you manipulate the\
    \ appearance and behavior of a stage. Table 4-1 lists the ones you're most likely\
    \ to use.\n\n![](img/0a30bdfcbc78f5a98df16eea42b42e83_77_0.png)"
