    Setting the Stage and Scene Layout


    **In This Chapter**


    +   - Looking at some useful methods of the Stage and Scene classes

    - Alternating scenes within a single stage

    - Displaying additional stages as message and confirmation boxes

    - Discovering the proper way to exit a JavaFX program


    > > O for a Muse of fire, that would ascend

    > The brightest heaven of Invention,

    > A kingdom for a stage, princes to act,

    > And monarchs to behold the swelling scene!


    So begins William Shakespeare''s play Henry V, and so also begins this chapter,
    in which I explore the various ways to manipulate the appearance of a JavaFX application
    by manipulating its stage and its swelling.


    Specifically, you read important details about the Stage class and the Scene class
    so that you can control such things as the window is resizable and if so, it has
    a maximum or a minimum size. You also read how to coerce your programs into displaying
    additional stages beyond the primary stage, such as an alert or confirmation dialog
    box. And finally, you read the proper way to end a JavaFX program by handling
    the events generated when the user closes the stage.'
