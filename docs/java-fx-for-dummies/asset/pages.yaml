  md: '# 12 Part I: Getting Started with JavaFX


    interface controls by placing all the formatting information in a separate file
    dubbed a style sheet. A style sheet is a simple text file that provides a set
    of rules for formatting the various elements of the user interface. You can use
    CSS to control literally hundreds of formatting properties. For example, you can
    easily change the text properties such as font, size, color, and weight, and you
    can add a background image, gradient fills, borders, and special effects such
    as shadows, blurs, and light sources.


    Figure 1-2 shows a variation of the form that was shown in Figure 1-1, this time
    with CSS. The simple CSS file for this form adds a background image, enhances
    the text formatting, and modifies the appearance of the buttons.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_21_0.png)


    > Figure 1-2 JavaFX lets you use CSS to specify formatting for user interface
    elements.


    Besides CSS, JavaFX offers many other capabilities. These are the most important:


    +   * **Visual effects:** You can add a wide variety of visual effects to your
    user interface elements, including shadows, reflections, blurs, lighting, and
    perspective effects.

    * **Animation:** You can specify animation effects that apply transitions gradually
    over time.

    * **Charts:** You can create bar charts, pie charts, charts, and many other chart
    types using the many classes of the `javafx.scene.chart` package.

    * **3-D objects:** You can draw three-dimensional objects such as cubes, cylinders,
    spheres, and more complex shapes.'
