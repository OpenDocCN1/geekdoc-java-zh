    # Adding Space with Margins


    Another way to add space around the nodes in a layout pane is to create margins
    around the individual nodes. This technique allows you to set a different margin
    size for each node in the layout pane, giving complete control over the spacing
    of each node.


    To create a margin, call the setMargin method for each node you want to add a
    margin to. You might think that each node can have its own margin, the setMargin
    method would belong to the Node class. Instead, the setMargin method is defined
    by the HBox class. The setMargin method accepts two parameters:


    +   - The you want to add the margin to

    - An Insets object that defines the margins you want to add


    Here''s an example that sets a margin of 10 pixels for all sides of a button named
    btn1:


    ```

    HBox hbox = new HBox();

    hbox.setMargin(btn1, new Insets(10));

    ```'
