    | Table 9-3 The TableView class |

    | --- | --- |

    | Constructor | Description |

    | TableView<S>() | Creates a new table view. The type S specifies the type of
    the objects contained in the items list. |

    | TableValue<S>(ObservableList list) | Creates a new table view using the specified
    list as its items list. |

    | Method | Description |

    | ObservableList getColumns() | Gets the list of columns that are displayed by
    the table. ObservableList getItems() | Gets the list of items that serve as the
    data source for the table. void setItems(ObservableList list) | Sets the list
    of items used as the data source to the table. TableSelectionModel getSelectionModel()
    | Gets the selection model, which allows you to work with rows selected by the
    user. |


    Here''s one way to accomplish these steps for the example you''ve been looking
    through this chapter:


    ```

    TableView<Movie> table = new TableView<Movie>();

    table.getColumns().add(colTitle, colYear, colPrice);

    table.setItems(loadData());

    ```


    The loadData method used here is the one that was shown right at the end of the
    section "Creating the Data for a Table." It returns an ObservableList that contains
    the Movie objects to be displayed.


    You could alternatively create the table and load its data in one statement by
    passing the loadData method to the TableView constructor, like this:


    ```

    TableView<Movie> table = new TableView<Movie>(loadData());

