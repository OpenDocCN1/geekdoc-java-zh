  md: '# 160 Part II: JavaFX Controls


    # # Working with Observable Lists


    As you saw in the previous section, the ChoiceBox class does not include methods
    that let you directly add or remove items from the list displayed by the choice
    box. Instead, it includes a method named getItems that returns an object of type
    ObservableList. The object returned by this method is an observable list; it represents
    the list displayed by the choice box.


    To work with the items displayed by a choice box, you must first access the observable
    list and then use methods of the ObservableList class to access the individual
    items in the list.


    Observable lists are used only by the ChoiceBox class, but also by other control
    classes that display list items, such as ComboBox and List, which you can read
    about later in this chapter. Both of those classes also have the getItems method
    that returns an ObservableList.


    Observable lists are also used by layout panes, as HBox and VBox, which you can
    read about in Chapter 5. The getChildren method that''s common to all layout classes
    returns an ObservableList.


    So in this book, I''ve discussed two methods of the ObservableList interface:
    add and add, which lets you add items to the observable list. Here''s an example
    of the add method from earlier in this chapter:


    ```

    cbox.getItems().add("Bashful");

    ```


    And here''s an example from Chapter 5, which uses the addAll method to add buttons
    to a layout pane:


    ```

    pane.getChildren().addAll(btnOK, btnCancel);

    ```


    The ObservableList interface has many other methods besides add and addAll. Table
    8-2 shows the methods you''re most likely to use.


    | Table 8-2 | Commonly Used ObservableList Methods |

    | --- | --- |

