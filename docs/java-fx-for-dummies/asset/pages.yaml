    # # Handling Events with Anonymous Inner Classes


    An anonymous class, usually just called an anonymous class, is a class that''s
    defined on the spot, right at the point where you need it. Because you code the
    body of the class where you need it, you don''t have to give it a name; that''s
    why you call it an anonymous class.


    Anonymous classes are often used for event handlers to avoid the need to create
    a separate class that explicitly implements the EventHandler interface.


    One advantage of using anonymous classes for event handlers is that you can easily
    create a separate event handler for each control that generates events. Then,
    in the handle method for those event handlers, you can dispose with the if statements
    that check the event source.


    Consider the event handler for the AddSubtract2 program shown earlier in Listing
    3-2: It must check the event source to determine whether to increment or decrement
    the iCounter variable. By using anonymous classes, you can create separate event
    handlers for the Add and Subtract buttons. Thus, neither event handler needs to
    check the event source because the event handler''s handle method will be called
    only when an event is raised on the button with which the handler is associated.


    Listing 3-3 shows the AddSubtract3 program, which uses anonymous inner classes
    in this way.'
