  md: '# Chapter 2: Looking Closer at JavaFX Programming


    # # Creating a Layout Pane


    By itself, a button is not very useful. You must actually display it on the screen
    for the user to be able to click it. And any realistic JavaFX program will have
    more than one control. The moment you add a second control to your user interface,
    you need a way to specify how the controls are positioned relative to one another.
    For example, if your application has two buttons, you want them to be stacked
    vertically, one above the other, or side by side?


    That''s where layout panes come in. A layout pane is a container class to which
    you can add one or more user-interface elements. The layout pane then determines
    exactly how to display those elements relative to each other.


    To use a layout, you first create an instance of the pane. Then, you add one or
    more controls to the pane. When you do so, you can specify the details of how
    the controls will be arranged when the pane is displayed. You add all the controls
    to the pane and arrange them just so, you add the pane to the scene.


    JavaFX provides a total of eight distinct types of layout panes, all defined by
    classes in the package javafx.scene.layout. The Click program uses a type of layout
    called a border pane, which arranges the contents of the pane into five regions:
    top, left, bottom, and center. The BorderPane class is ideal for layouts in you
    have elements such as a menu and toolbar at the top, a status bar at the bottom,
    optional task panes or toolbars on the left, and a main working area in the center
    of the scene.


    The lines that create the border pane in the Click program are


    ```

    BorderPane pane = new BorderPane();

    pane.setCenter(btn);

    ```


    Here, a variable type BorderPane is declared with the name pane, and the BorderPane
    constructor is called to create a new BorderPane object. Then, the setCenter method
    is used to display the button (btn) in the center region of the pane.


    Here are a few interesting details about layout panes:


    +   Layout panes automatically adjust the exact position of the elements based
    on the size of the elements they contain in the layout or on the size of the space
    in which the layout pane is displayed.


    +   I said earlier that controls are a type of node, and you would read about
    other types of nodes later in this book. Well, you just read about one: A layout
    pane is also a type of node.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_50_0.png)'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# 42 Part I: Getting Started with JavaFX


    +   Each region of a border pane can contain a node. Because a layout itself is
    a type of node, each region of a border pane can contain another layout pane.
    For example, suppose you want to display three controls in the center region of
    a border pane. To do that, you would create a second layout pane and add the three
    controls to it. Then, you''d set the second layout pane as the node to be displayed
    in the center region of the first layout pane.


    +   You may read about the BorderPane class and a few commonly used layout panes
    in Chapter 5. You can also read about the layout panes that aren''t commonly used
    in Chapter 13.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_51_0.png)


    # Making a Scene


    After you create a layout pane that contains the controls you want to display,
    the next step is to create a scene that will display the layout pane. You can
    do in a single line of code that declares a variable of Scene and calls the Scene
    constructor. Here''s how I did it in the Click Me program:


    ```

    Scene scene = new Scene(pane, 300, 250);

    ```


    The Scene constructor accepts three arguments:


    +   A node object represents the root node to be displayed by the scene Scene
    can have only one root node, so the root node is usually a layout pane, which
    in turn contains other controls to be displayed. The Click Me program, the root
    node is the border pane that contains the button.

    The width of the scene in pixels.

    The height of the scene in pixels.


    Note: If you omit the width and height, the scene will be sized automatically
    based on the size of the elements contained within the root node.


    You can find out about some additional capabilities of the Scene class in Chapter
    4.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_51_1.png)


    # Setting the Stage


    If the scene represents the nodes (controls and layout panes) that are displayed
    by the application, the stage represents the window in which the scene is displayed.
    When the JavaFX framework calls your application''s start'
  merge: -1
