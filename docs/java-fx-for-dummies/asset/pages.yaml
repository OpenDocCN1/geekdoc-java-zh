    The typical way to fill a grid pane with nodes is to call the add method for each
    node. However, if you prefer, you can add an entire column or row of nodes with
    a single call to either addColumn or addRow. For example, this example creates
    a label and a text field, then creates a grid pane and adds the label and the
    text field to the first row:


    ```

    Label lblName = new Label("Name");

    txtName = new TextField();

    GridPane grid = new GridPane();

    grid.addRow(0, lblName, txtName);

    ```


    If a node spans more than one column, you can call the columnspan method to specify
    the number of columns the node should span. For example:


    ```

    grid.setColumnSpan(txtName, 2);

    ```


    Here, the txtName node will span two columns. You use the setRowSpan method in
    a similar way if you need to configure a node to span multiple rows.


    To control the horizontal alignment of a node, use the setHalignment method in
    this example:


    ```

    grid.setHAlignment(lblName, HPos.RIGHT);

    ```


    Here, the lblName node is right-aligned within its column. The setValignment method
    works in a similar way.


    Other layout panes, the GridPane class has a host of methods for setting spacing
    and alignment details. You can use the setHgap and setGap methods to set the spacing
    between rows and columns so that your layouts don''t look cluttered. You can use
    the setPadding and setMargins methods to set padding and margins, which work just
    as they do with other layout panes. And you can set the minimum, maximum, and
    preferred width and height for the grid pane.


