  md: '# # Chapter 1


    # # Hello, JavaFX!


    In This Chapter


    +   - Getting a quick overview of what JavaFX is and what you can do with it

    - Looking at a basic JavaFX program

    - Downloading, installing, and configuring Java 8 so you can build your own JavaFX
    programs

    - Building a JavaFX program the hard way, using nothing but Notepad and a command
    prompt

    - Using TextPad to simplify JavaFX programming

    - Using an IDE, such as Eclipse or NetBeans, for JavaFX programming


    # Welcome to the wonderful world of JavaFX programming!


    This chapter offers a gentle introduction to JavaFX programming. In the next few
    pages, you find out what JavaFX is, where it came from, and where it''s going.
    You see an example of the classic Hello, World! program implemented in JavaFX.
    And you discover how to set up your computer to develop your own JavaFX programs
    using several popular development tools for JavaFX.


    Incidentally, I assume that you''re already familiar with Java programming. You
    don''t need to be a master programmer by any means, but you should have a solid
    understanding of the basics, such as creating programs that work with variables
    and statements (such as if and for) as well as creating your own classes and using
    the various classes that are part of the Java API (Application Interface). I don''t
    take the time to explain such basics in this book, so if you need an introduction
    to Java before you dive into the details of JavaFX, I suggest you get a copy of
    my masterpiece, Java All-in-One For Dummies (Wiley Publishing, Inc.).


    The intent of this chapter is to get you ready to start learning how to write
    JavaFX programs. As such, you see a brief example of a simple JavaFX program in
    this chapter, which might not make complete sense at this early'
