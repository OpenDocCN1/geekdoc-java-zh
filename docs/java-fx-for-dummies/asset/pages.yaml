    # # Translating, Scaling, and Rotating


    This section describes several methods of the Node class that are especially useful
    when working with shapes:


    +   * the translateX and translateY methods moves the (0, 0) point from the top-left
    corner to any arbitrary point.

    * the setScale andsetScale let you change the scale of a shape so that it appears
    smaller or larger.

    * the rotate method rotates the component''s coordinate system that shapes are
    drawn at an angle.


    **Note:** These methods can be used for any node in the scene graph, and any transformations
    you apply to one node are inherited by any children of that node. If you apply
    a transformation to the root node of a scene, the transformation effectively applies
    to the entire scene.


    For example, Figure 13-3 shows the ShapeMaker program that was presented in Listing
    13-I after its root node has rotated and translated. The only difference between
    the program that produces this output and the program in Listing 13-I is the addition
    of the following three lines:


    ```

    group1.setRotate(30);

    group1.setScale(110);

    group1.setTranslateY(110);

    ```


    The first line rotates the root node 30 degrees. Then, the next two lines translate
    the root node 110 pixels in both the x- and the y-axis.'
