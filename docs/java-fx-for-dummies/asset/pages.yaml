  md: '# Chapter 2: Looking Closer at JavaFX Programming


    method, it passes you an instance of the Stage that represents the application''s
    primary stage — that is, the stage that represents the application''s main window.
    This reference is passed via the primaryStage argument.


    Having created your scene, you''re now ready to finalize the primary stage that
    the scene can be displayed. To do that, you must do at least two things:


    +   - Call the setScene method of the primary stage to set the scene to be displayed.

    - Call the show method of the primary stage to display the scene.


    After you call the show method, your application''s window becomes visible to
    the user and the user can begin to interact with its controls.


    It''s also custom to set the title displayed in your application''s title bar.
    You do by calling the setTitle method of the primary stage. The last three lines
    of the start method for the Click Me perform these functions:


    ```

    primaryStage.setScene(scene);

    primaryStage.setTitle("The Click Me App");

    primaryStage.show();

    ```


    When the last line calls the show method, the Stage displays — in other windows,
    the that was shown in Figure 2-1 onscreen.


    You can read about additional capabilities of the Stage class in Chapter 4.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_52_0.png)


    # Examining the Click Counter Program


    Now I''ve explained the details of every line of the Click Me program, I look
    at a slightly enhanced version of the Click Me program the Click Counter program.
    In the Click Me program that was shown in Listing 1-1 (Chapter 1), the text displayed
    on the button changes when the user clicks the button. In the Click Counter program,
    an additional type of control called a label displays the number of times the
    user has clicked the button.


    Figure 2-2 shows the Click Counter program in operation. The window at the top
    of this figure shows how the Click Counter appears when you first start it. As
    you can see, the label at the top of the window displays the text You have not
    clicked the button. The second window shows what the program looks like after
    you click the button the first time. Here, the label You have clicked once. When
    the button is clicked a second time, the label changes again, as shown in the
    third window. Here, the label reads You have clicked 2 times. After that, the
    number displayed by the label updates each time you click the button to indicate
    how many times the button has been clicked.'
