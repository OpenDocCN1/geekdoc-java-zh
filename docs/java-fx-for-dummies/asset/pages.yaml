    # Using List Views


    A list view is a powerful JavaFX control that displays a list of objects within
    a

    box. Depending on how the list is configured, the user can select one item in

    t list or multiple items. In addition, you have amazing control over how the

    items in the list display. Figure 8-3 shows a sample scene with a list view.


