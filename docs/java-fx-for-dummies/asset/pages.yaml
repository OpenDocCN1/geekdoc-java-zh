  md: '# Chapter 3: Handling Events


    | Event Class | Package | Description |

    | --- | --- | --- |

    | MouseEvent | javafx.scene.input | Created when the user does something interesting
    with the mouse, as clicking one of the buttons, dragging the mouse, or simply
    moving the mouse cursor over another object. (MouseEvent is a subclass of InputEvent.)
    |

    | TouchEvent | javafx.scene.input | Created when a user initiates touch event
    on a device that allows touch input. |

    | WindowEvent | javafx.stage | Created when the status of the window (stage) changes.
    |


    There are four important terms you need to know:


    +   - **Event**: An object that the user does something worthy with a component,
    such as clicking it.

    - **Event source**: The object on which the event initially occurred.

    - **Event target**: The node that the event is directed at.

    - **Event handler**: The object that listens for events and handles them when
    they occur.


    This is usually the button or other control that the user clicked or otherwise
    manipulated. (In most cases, the event source and the event target are the same.)

    The event-listener object must implement the EventHandler interface, which defines
    a single method named handle (see Table 3-2). The EventHandler interface is defined
    in the package javafx.event.


    | Table 3-2 The EventHandler Interface |

    | Method | Description |

    | --- | --- |

    | void handle<T event> | Called when an event occurs |'
