    # Setting properties by, from, or to?


    The setFrom, setTo, and setBy methods that appear in several of the transition
    classes listed in Table 17-2 provide a delepite illumination.


    By default, both start and end of a transition are the node''s current values
    for the property being animated. The default starting and ending locations for
    the TranslateTransition are the node''s x and y positions.


    Here are several ways to specify a different starting value, ending value, or
    both:


    +   - The node''s current values stand as the starting values and specify a new
    ending value using the setTo methods.


    +   - The node''s current values stand as the starting values and specify a displacement
    to the ending value using a setBy


    +   - Use the setFrom location to change the starting location from the node''s
    current value. Then, omit both the setTo and setBy to let the node''s current
    value


    +   - Use the setFrom location to change the starting location from the node''s
    current value and use setTo to set the ending value.


    +   - Use the setFrom location to change the starting location from the node''s
    current value and use setBy to set a displacement value that will be added to
    the starting location to determine the ending location.'
