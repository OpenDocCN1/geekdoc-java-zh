    # Binding Properties


    JavaFX property binding allows you to synchronize the value of two properties
    so that whenever one of the properties changes, the value of the other property
    is updated automatically. Two types of binding are supported:


    +   **Unidirectional binding**: With unidirectional binding, the binding works
    in just one direction. For example, if you bind property A to property B, the
    value of property A changes when property B changes, but not the other way around.


    +   **Bidirectional binding**: With bidirectional binding, the two property values
    are synchronized so that if either property changes, the other property is automatically
    changed as well.'
