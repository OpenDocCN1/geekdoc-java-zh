    Several of the parameters used with these constructors merit a bit of explanation:


    +   - **Proportional**: This parameter determines the units of measured for the
    start and end points for a linear gradient or the center point and radius for
    a circle. If this parameter is false, the coordinates are expressed in pixels.
    If true, the coordinates range from 0.0 to 1.0 and are proportional to the size
    of the shape being filled. In most cases, it is easier to work with proportional
    coordinates, so this parameter should be set to true.

    - **CyclicalMethod**: The default is for a gradient to start with one color, transition
    to another color, and then end. However, you can create gradients that cycle through
    their colors repeatedly using a cycle method other than NO_CYCLE. If you specify
    REPEAT, the gradient repeats itself for each cycle. If you specify REFLECT, the
    gradient reverses the order of stops for each cycle.

    - **Stop offset**: The stops represent the colors used for the gradient transition.
    The offset for a stop determines where along the stop appears. A value of 0.0
    means that the stop appears at the start of a linear gradient or the center of
    a radial gradient. A value of 1.0 means that the stop appears at the end of the
    linear gradient or at the radius of a radial gradient.


    All gradients must have at least two stops, one at the start or center and the
    other at the end or radius. However, you can create more complex gradients by
    adding additional stops. In that case, the stop offset'
