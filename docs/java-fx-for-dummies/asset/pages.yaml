  md: '# Chapter 1: Hello, JavaFX!


    +   - **Touch interface**: JavaFX can handle touchscreen devices, such as smartphones
    and tablet computers with ease.

    - **Property bindings**: JavaFX lets you create properties, which are special
    data types that can be bound to user interface controls. For example, you can
    create a property that represents the price of an item being purchased and then
    bind a label to it. Then, whenever the price changes, the value displayed by the
    label is updated automatically.


    You discover all these features and more in later chapters of this book. But for
    now, it''s time to have a look at a simple JavaFX program so you get a feel for
    what JavaFX looks like.


    # Looking at a Simple JavaFX Program


    Figure 1-3 shows the user interface for a very simple JavaFX program that includes
    just a simple button. Initially, the text of the button says `Click me please!`.
    When clicked, the text of the button changes to `You clicked me!`. If you click
    the button again, the text changes back to `Click me please!`. Thereafter, each
    time you click the button, the text cycles between `Click me please!` and `You
    clicked me!`


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_22_0.png)


    **Figure 1-3:** The Click Me program.


    To give you an idea of what JavaFX programming looks like, Listing 1-1 shows the
    complete listing for this program. I won''t explain the details of how this program
    works — I examine this program in painstaking detail in Chapter 2. For now, I
    just want you to get the big picture to give you a feel for what JavaFX programming
    looks like.'
