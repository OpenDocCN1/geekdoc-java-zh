  md: "# Chapter 15: Using Properties to Create Dynamic Scenes\n\n# 4. Create a setter\
    \ for the property.\n\nThe setter method name should by public or protected, it\
    \ should be final, it should follow the naming convention (set followed by the\
    \ name of the property with an initial cap), and it should accept a parameter\
    \ value of the underlying property type. it should then call the private property's\
    \ set method to set the property to the passed value. For example:\n\n```\npublic\
    \ final void setName(String value)\n{\n    firstName.set(value);\n}\n```\n\n#\
    \ 5. Create the property accessor.\n\nThis method should return the property object\
    \ itself:\n\n```\npublic final StringProperty firstNameProperty()\n{\n    return\
    \ firstName;\n}\n```\n\nNote that the type is StringProperty, not SimpleStringProperty.\n\
    \n# 6. Repeat the entire procedure for every property in your class.\n\nHere's\
    \ a complete example that implements a read/write property name firstName in a\
    \ class named Customer:\n\n```\npublic class Customer\n{\n    StringProperty firstName\
    \ =\n        new SimpleStringProperty(this, \"firstName\", \"\");\n\n    public\
    \ final String getFirstName()\n{\n    return firstName.get();\n}\n\n    public\
    \ final void setName(String value)\n{\n    firstName.set(value);\n}\n\n    public\
    \ final StringProperty firstNameProperty()\n{\n    return firstName;\n}\n```"
