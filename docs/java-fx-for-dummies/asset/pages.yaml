  md: '# Part I: Getting Started with JavaFX


    The HBox class is defined in the javafx.scene.layout package, so you should include
    the following import statement in any program that uses HBox:


    ```

    import javafx.scene.layout.*;

    ```


    The easiest way to create an HBox is to first create the nodes that you want to
    place in the HBox and then call the HBox constructor and pass the nodes as arguments.
    For example:


    ```

    Button btn1 = new Button("Button One");

    Button btn2 = new Button("Button Two");

    Button btn3 = new Button("Button Three");

    HBox hbox = new HBox(btn1, btn2, btn3);

    ```


    If you prefer to create the HBox control in an initially empty pane and later
    add the controls, you can do this by:


    ```

    HBox hbox = new HBox();

    Hbox.getChildren().addAll(btn1, btn2, btn3);

    ```


    Here, the getChildren method is called, which returns a collection of the children
    added to the HBox pane. This collection is defined by the ObservableList, which
    includes a method addAll that you can use to add one or more nodes to the list.


    # Spacing Things Out


    By default, child nodes in a layout pane are arranged immediately next to one
    another, with no empty space between. If you want to provide space between the
    nodes in the pane, you can do so in four ways:


    +   * Adding spacing between elements within the pane

    * Adding padding around the inside edges of the pane

    * Adding margins to the individual nodes in the pane

    * Creating spacer nodes that can grow to fill available space


    In this section, I show you how to add spacing and padding to a pane. Then, the
    next three sections show you how to use the other two techniques.


    Note that although I illustrate the techniques in these sections using the HBox
    layout pane, the techniques apply to other types of panes as well.'
