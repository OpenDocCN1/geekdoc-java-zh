  md: '# 102 Part I: Getting Started with JavaFX


    For my purposes here, I use the simple default Region class to create a node that
    serves as a simpler spacer in a layout pane. I do not provide a specific size
    for the region. Instead, I configure it so that it will grow horizontally to fill
    any unused space within its container.


    To do that, use the static setGrow method of the HBox class, specifying one of
    the three constant values defined by an enumeration named Priority enumeration.
    Table 5-3 lists these constants and explains what each one does.


    # Table 5-3 The Priority enumeration


    | Constant | Description |

    | Priority.NEVER | Indicates that the width of the node should never be adjusted
    to fill the available space in the pane. It is the default. Thus, by default,
    nodes are not resized based on the size of the layout pane that contains them.
    |

    | Priority.ALWAYS | Indicates that the width of the node should always be adjusted
    if necessary to fill available space in the pane. If you set or more nodes to
    ALWAYS, the adjustment will be split equally among each of the nodes. |

    | Priority.SOMETIMES | Indicates that the node''s width may be adjusted if necessary
    to fill the pane. However, the adjustment will be made only if there are no other
    nodes that specify ALWAYS. |


    The Priority enumeration is defined in the javafx.scene.layout package; the same
    package that defines the layout managers that require it. You do not need to include
    an additional import statement to use the Priority enumeration.


