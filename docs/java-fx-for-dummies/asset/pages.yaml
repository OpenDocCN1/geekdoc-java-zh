  md: '# Part I: Getting Started with JavaFX


    # Shakespeare''s Best Stage Direction


    So far in this chapter, I''ve quoted William Shakespeare once and Snaglexpress
    once. Both quotes are appropriate for the topic of this chapter: The Shakespeare
    quotation from Henry V refers to stages and scenes, and the Snaglexpress quotation
    refers to the proper way to exit the stage. So, quoting Snaglexpress seems a little
    out of balance. I think it''s best to think of another Shakespeare to quote what
    I might have from my college English professors.


    sometimes they''re a bit ambiguous, such as Enter a messenger with two heads and
    a hand from Titus Andronicus.


    In my opinion, the most interesting of all Shakespeare''s stage directions is
    found in The Winter''s Tale, when Ant is thwarted from rescuing Perdita fleeing
    a shipwreck: Exit, pursued by a bear.


    When you exit the stage because you''re pursued by a bear, you dont to collect
    your things or accomplish any of the other tasks set out to do, such as saving
    the princess or saving the important changes the user made to a document. Just
    turn and run, which is pretty much what happens when the user clicks the window
    close unless you properly handle the CloseRequest event.


    Shakespeare''s plays are liberally sprinkled with stage directions. Most of them
    are very brief, as Enter Tybalt or Exit Romeo found in Romeo and Juliet. A few
    are a more detailed, as Enter several of both houses, join the fray, from Romeo
    and Juliet. And


    # Handling the CloseRequest Event


    Providing a Close button is an excellent way to allow your users to cleanly exit
    from your program. However, the user can bypass by simply closing the window —
    that is, by clicking the window close button, usually represented as an X in the
    upper-right corner of the window border. Unless you provide otherwise, this button
    unceremoniously terminates the application, bypassing all your code that confirms
    whether the user wants to save their work, closes any open resources, and otherwise
    provides for a graceful exit.


    Fortunately, you can avoid such unexpected exits. Whenever the user attempts to
    close the window within which a JavaFX stage is displayed, JavaFX generates a
    CloseRequest event, which is sent to the stage. You can provide an event handler
    for this event by calling the setOnCloseRequest method of the Stage class. Then,
    the event handler is called whenever the user tries to close the window.'
