  md: '# Part IV: Making Your Programs Come Alive


    # Using the ImageView class


    While the Image class holds an image in memory, the ImageView class displays an
    image on the screen. ImageView is a subclass of Node, which allows you to add
    an image view to the scene graph. The basic constructor accepts an Image object,
    like this:


    ```

    Image img = new Image("file:C:\\Pictures\\pic001.jpg");

    ImageView imageView = new ImageView(img);

    ```


    Then, you can add the image view to a layout pane and display it in your scene,
    just like any other node.


    By default, the image view will display the image at full size. More often than
    not, you will want to constrain the size by calling the setFitWidth and setFitHeight
    methods, and you want to call the setPreserveRatio method to ensure the aspect
    ratio of the original image is preserved when it is resized. For example:


    ```

    imageView.setFitWidth(200);

    imageView.setFitHeight(200);

    imageView.setPreserveRatio(true);

    ```


    Here, the size of the displayed image is 200x200. Figure 16-1 shows how this image
    appears when displayed in a scene.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_339_0.png)


    Figure 16-1: Displaying an image.'
