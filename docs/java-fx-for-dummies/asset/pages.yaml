    task of creating a TreeView control to show off the tree.


    # Creating a TreeView control


    You use the TreeView class to create a tree component that displays the nodes
    of a tree. Table 8-6 shows the key constructors and methods of this class.


    | Table 8-6 The TreeView Class |

    |---|---|n| Constructor | Description |

    | TreeView<T>() | Creates an empty tree (not very useful, if you ask me). |

    | TreeView<T>(TreeItem root) | Creates a tree that displays the tree that starts
    at the specified node. |

    | Method | Description |

    | TreeItem getRoot() | Gets the root node |

    | void setRoot(TreeItem root) | Sets the root node |

    | MultipleModel<T> getSelection() | Returns the selection model for the list view
    control. You can use the selection model to get an observable list of selected
    items by calling getSelectedItems method. You can also retrieve the most recently
    selected item by calling getSelectedItem. |

