    Notice the list view shown in Figure 8-3 shows only the first eight items in the
    list. As with a combo box, a scroll bar is automatically added to a list view
    if the total number of items in the collection cannot be displayed.


    By default, the list view control allows only a single selection to be made. To
    allow multiple selections, add this line:


    ```

    list.getSelectionModel().setSelectionMode(SelectionMode.MULTIPLE);

    ```


    To arrange the list view horizontally rather than vertically, add this line:


    ```

    list.setOrientation(Orientation.HORIZONTAL);

    ```


