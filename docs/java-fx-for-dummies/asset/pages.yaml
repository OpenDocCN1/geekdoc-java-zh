  md: '# 146 Part II: JavaFX Controls


    # # The Node Class


    The JavaFX Control hierarchy begins at the Node class, which represents an object
    that can be added to the JavaFX scene. Well, actually the topmost class in the
    Control hierarchy is the Object class, but that''s hardly worth mentioning because
    all class hierarchies begin with the Object class — Object is the mother of all
    Java classes.


    All objects are part of a scene belonging to a scene graph, which is a tree structure
    that contains all the nodes that make up a user interface. To be part of a scene
    graph, an object must inherit the Node class. Thus, the Node class is the base
    class for all classes that can be added to a JavaFX scene.


    Like any other tree structure, a scene graph begins with a single node — the root
    node — which can have one or more child nodes, each of which in turn have one
    or more child nodes. A node that has at least one child node is a branch node,
    a node that has no children is a leaf node. A scene can have only one root node,
    but it can have many branch and leaf nodes.


    The Node class is an abstract class, which means you cannot directly create an
    instance of it. In other words, the following code results in a compiler error:


    ```

    Node myWeb = new Node();

    ```


    However, you can use the Node class to hold nodes whose type you are uncertain
    of or don''t care about. For example:


    ```

    Node myWebNode = new Button();

    ```


    In this case, the myWeb variable is of type Node, but it''s used to hold a reference
    to a Button control.


    Many methods of classes up and down the Node hierarchy accept or return objects
    of type Node. For example, the getChildren method used with layout panes, as HBox
    and FlowPane, returns list of Node objects. And the add method used to add to
    a layout panes node list accepts a Node object as a parameter. In other words,
    any Node object can be added to a layout pane.


    Table 7-1 lists just a few of the methods you''re likely to use in most JavaFX
    programs. Note that this table drastically simplifies the complexity of the Node
    class. There are actually more than 300 methods defined by this class. More than
    one third of them are related to event handling: The Node class is'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Chapter 7: Introducing the JavaFX Hierarchy 147


    the class that''s responsible for most handling for all nodes, including events
    that handle mouse, keyboard, and touchscreen interaction with the node.


    | Method | Explanation |

    | --- | --- |

    | Parent getParent() | Returns this node''s Parent node. |

    | String getId() | Returns the ID of this node. |

    | void setId(String id) | Sets the ID of this node. The ID should be unique within
    the scene graph. |

    | Node lookup(String id) | Searches the node''s children for a node whose ID matches
    the parameter. |

    | String getStyle() | Returns the CSS string style for the node. |

    | Void setStyle(String style) | Sets the CSS string style for the node. |


    TheParent method returns a node''s parent node. This method returns an object
    of type Parent, which is a node that can have children (as you cover in the following
    section). Every node in a scene graph except the root must have a parent node,
    and parent node will always be of type Parent. If you call this method on the
    node, null will be returned.


    Notice that every node can have a unique string identifier, which makes it easy
    to distinguish nodes from one another in complicated scene graphs and can also
    be helpful when you use CSS to format your scenes. You can set the string by calling
    the setID method, which accepts a string argument like this:


    ```

    myNode.setId("LBL3");

    ```


    Here, the string LBL3 is associated with the node.


    You can later find this node by calling the lookup method. This method is a little
    quirky in which you must prefix the ID you''re looking for with a hash symbol
    (#). For example, here''s how you might search an entire scene graph for a control
    whose ID is LBL3:


    ```

    Node myNode = scene.getRoot().lookup("#LBL3");

    ```'
