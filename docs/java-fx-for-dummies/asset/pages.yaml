    \ the program without first saving changes to the current document, the program\
    \ typically asks the user whether he wants to quit without saving changes. A confirmation\
    \ box displays a text message, which is often simple as \"Are you sure?\" along\
    \ with two buttons, typically labeled Yes and No or Or and Cancel.\n\nCreating\
    \ a confirmation box is a little more complicated than creating a message box\
    \ because the confirmation box must let the main program know which button the\
