    is in javafx.scene.paint. Thus, you need to include the fol-lowing import statements
    to use these classes:


    ```

    import javafx.scene.shapes.*;nimport javafx.scene.paint.*;

    ```


    To create a stack pane, use the StackPane class, whose constructors and methods
    are shown in Table 11-1.


    | Table 11-1 | StackPane Constructors and Methods |

    | --- | --- |

    | StackPane() | Creates an empty stack pane. |

    | StackPane(Node...children) | Creates a stack with the speci-f child nodes. This
    constructor lets you create a stack and add child nodes to it at the same time.
    |

