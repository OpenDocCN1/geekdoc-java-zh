  md: '# 344 Part IV: Making Your Programs Come Alive


    | Table 17-1 (continued) |

    | Method | Explanation |

    |---|---||

    | setAutoReverse (boolean value) | If true, the animation reverses direction each
    time the cycle is repeated. |

    | setInterpolator (Interpolator value) | Determines the method used to calculate
    the intermediate values of the property controlled by the transition. The possible
    values are Interpolator.DISCRETE Interpolator.LINEAR Interpolator.EASE_IN Interpolator.EASE_OUT
    Interpolator.EASE_BOTH The default setting is EASY_BOTH. |


    Most of the methods in Table 17-1 are straightforward, the setInterpolator method
    merits a bit of explanation. The interpolator is the method used to calculate
    the intermediate values of the property controlled by the transition. For example,
    in a FadeTransition, the interpolator determines how the value of the node''s
    opacity is varied during the time that the animation is running; for a TranslateTransition,
    the interpolator determines how the x- and y-coordinates change during the animation.


    The default setting is Interpolator.EASE_BOTH, which means that the change begins
    slowly, then speeds up through the middle of the animation, then slows down just
    before the animation ends. For a TranslateTransition, this causes the movement
    of the node to start slowly, speed up, and then slow down toward the end.


    The EASE_IN interpolator speeds up at the beginning but ends abruptly, while the
    EASE_OUT interpolator starts abruptly but slows down at the end. The LINEAR interpolator
    varies the property controlled by the transition at a constant rate throughout
    the animation. And the DISCRETE interpolator doesn''t change the property value
    at all until the end of the animation has reached; then, it immediately changes
    to the ending value.


    Table 17-2 lists the most commonly used constructors and methods for each of the
    transition types.'
