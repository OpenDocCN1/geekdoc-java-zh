  md: '# An Overview of JavaFX Packages


    Before I look at the classes that make up the Node class hierarchy, I want to
    briefly discuss the various packages that make up JavaFX. JavaFX itself consists
    of a total of 665 classes that are spread over 36 distinct packages, which all
    begin with the root name javafx.


    So in this book, you''ve seen JavaFX classes from the following packages:


    +   javafx.application: The most important class in this package is Application,
    which provides the basic lifecycle functions of a JavaFX application.


    +   As I discuss in Chapter 2, all JavaFX programs extend the Application class
    and implement the start method, which is all required. The Application class also
    creates the application''s primary stage and passes it via the primaryStage parameter.
    This allows the program to display a scene in the application''s window.


    +   javafx.stage: The most important class in this package is Stage, which represents
    a window in which a user interface can be displayed. You read about the Stage
    class in Chapter 4. There are other classes in this class that may occasionally
    be useful, such as FileChooser and DirectoryChooser, which display dialog boxes
    that you select files and directories.


    +   javafx.scene: This package contains several important classes that deal with
    user-interface scenes that can be displayed in a scene. The two most important
    classes in this package are


    +   Scene, which creates a scene object.


    +   You can read about the Scene class for all objects contained in a scene, including
    controls and layout panes.


    +   Node, which is the base class for all objects contained in a scene, including
    controls. For more information about the Node class, see the section "The Node
    Class" later in this chapter.


    +   javafx.scene.control: This package contains most of JavaFX''s user-interface
    controls, including Button, Label, CheckBox, and RadioButton. Also included in
    this package is Control, the base class from which all user-interface controls
    are derived. For more information about the Control class, see the section "The
    Control Class" in'
