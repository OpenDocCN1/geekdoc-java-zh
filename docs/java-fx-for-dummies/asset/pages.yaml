    The following sections provide additional details about selectors and declarations.


    # Using type selectors


    The most commonly used variety of selectors is a type selector; it corresponds
    to a JavaFX node, such as Button or TextField. Type selectors begin with a period
    followed by the style class name, which is associated with all JavaFX node types.(Note:
    The terms style class and style type are used interchangeably.)


    For controls, the name of the class is similar to the name of the corresponding
    JavaFX class. To convert a JavaFX class to a CSS style class, use all lowercase
    letters and a hyphen between words if the JavaFX class name consists of two or
    more words. The following list includes the CSS style class name for most of the
    JavaFX classes that have been presented so far in this book.


    | JavaFX Class | CSS Style Class |

    |--- |--- |

    | Button | button |

    | CheckBox | check-box |

    | ChoiceBox | choice-box |

    | ComboBox | combo-box |

    | Label | label |

    | ListCell | list-cell |

    | ListView | list-view |

    | Menu | menu |

    | MenuBar | menu-bar |

    | MenuButton | menu-button |

    | MenuItem | menu-item |

    | Radio | radio-button |

    | Separator | separator |

    | TableView | table-view |

    | TextField | text-field |

    | ToggleButton | toggle-button |

    | Tooltip | tooltip |

    | TreeCell | tree-cell |

    | Tree | tree-view |'
