    ```


    To remove a specific item from the list, use the remove method:


    ```

    cbox.getItems().remove("Grumpy");

    ```


    This method succeeds whether or not the string "Grumpy" appears in the list.


    You can easily insert items from an existing Java collection, such as an array
    list, into a choice box by specifying the collection in the addAll method. For
    example, suppose you already have an array list named list that contains the items
    you want to display in the choice box. You can add the items like this:


    ```

    cbox.getItems().addAll(list);

    ```


    You might be wondering why an observable list is required for the items displayed
    by list-based JavaFX controls. Why not just use the collection classes? The reason
    is that for list-based controls to work efficiently, the controls themselves need
    to monitor any changes you might make to the list of items so that the control
    can automatically update the displayed items. The last method listed in Table
    8-2 (addListener) provides this capability by allowing you to add a listener that''s
    called whenever the contents of the list changes. You will rarely call this method
    directly. But the controls that use observable lists do call this method to create
    event listeners that automatically update the control whenever the contents of
    the list changes.


