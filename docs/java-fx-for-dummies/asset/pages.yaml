  md: "# Part I: Getting Started with JavaFX\n\n# # Putting it all together\n\nNow\
    \ that you know how to add a Close button to a scene and how to handle the CloseRequest\
    \ event, I look at a program that puts together these two elements to demonstrate\
    \ the correct way to exit a JavaFX program.\n\nThis section presents a variation\
    \ of the ClickCounter program that includes a Close button in addition to the\
    \ Click Me! button. When the user clicks the Click Me!, a message box displays\
    \ to indicate how many times the button has been clicked. But when the user attempts\
    \ to exit the program, by clicking the Close button or simply closing the window,\
    \ the ConfirmationBox class that was shown in Listing 4-4 is used to ask the user\
    \ whether she really wants to exit the program. The stage is closed only if the\
    \ user clicks the Yes button in the confirmation box.\n\nThe source code for this\
    \ program is shown in Listing 4-5.\n\n# ### Listing 4-5: The ClickCounter Exit\
    \ program\n\n```\nimport javafx.application.*;\nimport javafx.stage.*;\nimport\
