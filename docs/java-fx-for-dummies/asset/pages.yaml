  md: '# 32 Part I: Getting Started with JavaFX


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_41_0.png)


    Although this program is simple, it demonstrates most of the essential techniques
    you need to master to figure out how to write JavaFX programs:


    +   - It displays a user interface that includes a standard type of user interface
    control — in this case, a button.

    - It responds to the user''s input, generated when the user clicks the button.

    - It updates the display to confirm the user''s action.


    Many JavaFX programs are variations of this simple theme: Create a user interface,
    respond to the user''s input, and then update the display to reflect the user''s
    input. The user interface displayed by a more realistic JavaFX program will undoubtedly
    display more than just a single button. The processing performed in response to
    user input will likely include additional steps, such as looking up information
    in a database or performing calculations. The display will undoubtedly be updated
    in more complicated ways than simply changing the text displayed on a button.
    But variations on these basic elements are found in most real-world JavaFX programs.


    Listing 2-1 shows the actual JavaFX code for the Click Me program. In the remaining
    sections of this chapter, I explain every line of this program in detail.'
