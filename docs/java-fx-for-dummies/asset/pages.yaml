  md: '# Chapter 13: Drawing Shapes 273


    # Creating circles and ellipses


    To create a circle, you use the Circle class, specifying the x- and y-coordinates
    of the center of the circle and the radius. Here''s the code that creates the
    circle in Figure 13-1:


    ```

    Circle c1 = new Circle(100, 300, 75);

    c1.stroke(Color.BLACK);

    c1.setFill(null);

    c1.strokeWidth(3);

    ```


    An ellipse is similar to a circle, but has two radii: one in the x-axis, the other
    in the y-axis. You specify both radii in the constructor. Here''s the code that
    creates the first ellipse in Figure 13-1:


    ```

    Ellipse e1 = new Ellipse(300, 300, 75, 40);

    e1.stroke(Color.BLACK);

    e1.setFill(null);

    e1.strokeWidth(3);

    ```


    The second ellipse is similar, but the x- and y-radii are reversed:


    ```

    Ellipse e2 = new Ellipse(300, 300, 40, 75);

    ```


    # Creating arcs


    Another type of shape is an arc, which is a segment of an ellipse. To create an
    arc, you supply the parameters for the ellipse and then you supply the angle at
    which the arc begins: 0 is due east (3:00 on a clock face). Finally, you supply
    the length, which represents how much of the arc spans and is also expressed in
    degrees.


    The important thing to know is that the arc travels clockwise from the starting
    point. If you specify /90 as the starting point and 90 as the extent, the arc
    travels from 12:00 high to 9:00, as shown in the first shape in the third row
    in Figure 13-1.


    FX can create three types of arcs, which you can specify via the setType method:


    +   - ArcType.OPEN: Indicates that you want to draw the arc itself


    +   - ArcType.CHORD: Means that you want to draw the arc and connect the ends
    with a straight line to create a closed shape


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_282_0.png)'
