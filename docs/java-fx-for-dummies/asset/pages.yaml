  md: '# # Chapter 17


    # # Animating Your Scenes


    # In This Chapter


    +   - Looking at the various ways to create JavaFX animations

    - Using JavaFX transitions

    - Using the KeyFrame and Timeline classes

    - Creating bouncing balls


    You can go a long way toward improving the look and feel of your applications
    by applying special effects as described in Chapter 14, incorporating property
    bindings to manage your controls more responsive, and using sound and media to
    provide visual interest. In this chapter, I discuss how to make your applications
    one step further by incorporating simple animation effects. The effects you read
    about in this chapter come alive by enabling objects on the screen to move.


    Please don''t get your hopes set on winning an Oscar for Best Animation next year.
    No one will be fooled into thinking that you collaborated with Pixar for your
    application. Still, you can add some interesting whiz-bang to your applications
    using these techniques.


    # # Introducing JavaFX Animation


    The basic idea of JavaFX animations is to manipulate the value of one or more
    node properties at regular intervals. For example, suppose you have a circle that
    represents a ball and you want to move it from the left side of the screen to
    the right. Assuming the width of the screen is 600 pixels, you would animate the
    circle by varying its `posX` property from 0 to 600.


    Two factors will affect how fast the ball moves across the screen: the amount
    of time that elapses between each change to the `posX` property, and the increment
    you add to the `posX` property at each time interval. For example, if'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# 342 Part IV: Making Your Programs Come Alive


    you add 3 to the posX property at each interval, it will take 200 intervals to
    get 600 (3 x 200 = 600). If the intervals occur every 10 milliseconds (100 times
    per second), it will take 2,000 milliseconds — 2 full seconds — for the ball to
    traverse the screen from left to right.


    Without JavaFX animations, you could implement the moving ball by using the Java
    Timer object to move the ball at regular intervals. The Timer class can be difficult
    to set up and use. The JavaFX animation classes make animating your nodes much
    simpler notion.


    JavaFX provides two basic ways to create animations, which I refer to in this
    chapter using extremely technical terms — the hard and the easy way:


    +   * The hard way requires you to set up timer events manually, and write event
    listeners that are called when the timer events occur. In the event listeners,
    you manipulate the properties of the nodes to animate. For example, to move a
    ball across the screen, you''d set up a timer that ticks every 10 milliseconds.
    At each tick, you''d increase the x position of the ball by 3. You''d then set
    the timer to run a total of 200 times to move the ball. Setting up this animation
    requires two classes: Timeline and KeyFrame, and that you write an EventHandler
    listener to move the ball. The easy way takes advantage of shortcut classes provided
    by JavaFX to easily implement types of animations. For example, you can use the
    TranslateTransition class to easily move a circle from one side of the screen
    to the other over a specified period of time. You just set up a TranslateTransition
    specifying that you want to vary the ball''s x position from 0 to 600 over the
    course of 2 seconds. The TranslateTransition class will take care of the details.


    In the remainder of this chapter, you will discover both the easy way and the
    hard way. Start with the easy way.


    # Using Transition Classes


    JavaFX comes with eight predefined animation effects — dubbed transition classes
    — that you can use to easily create an animation on any node in your scene graph.
    (Most of the transitions will work with any node, but some will work only on shapes.)
    The eight transition types are'
