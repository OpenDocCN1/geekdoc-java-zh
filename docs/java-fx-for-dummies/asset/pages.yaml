  md: "# 316 Part IV: Making Your Programs Come Alive\n\n# Creating a Read-Only Property\n\
    \nAlthough a read-only property has less functionality than a read/write property,\
    \ it's actually more complicated to implement. Why? Because internally within\
    \ the class that contains the read-only property — you need to be able to read\
    \ or define the value of the property. Externally — that is, outside of the class\
    \ that defines the read-only property — you must ensure that users can not write\
    \ the property value.\n\nYou might think that omitting the setter method would\
    \ be enough to create a read-only property. But the problem is in addition to\
    \ getter and setter methods, JavaFX properties also expose a accessor method that\
    \ provides direct access to the property object itself.\n\nThe following is an\
    \ example of *how not* to create a read-only property:\n\n```\nStringProperty\
    \ firstName =\nnew SimpleStringProperty(this,\n    \"firstName\", \"\");\npublic\
    \ final String getFirstName()\n    return firstName.get();\n}\npublic final StringProperty\
    \ firstNameProperty()\n    return firstName;\n}\n```\n\n![](img/0a30bdfcbc78f5a98df16eea42b42e83_325_0.png)\n\
    \nThis code is the same as the code used to create a read/write property in the\
    \ preceding section, except that I omitted the `setFirstName` method. Unfortunately,\
    \ this property definition does not prevent users of the class that defines the\
    \ property from modifying the property. To do so, all the user would need to do\
    \ access to the property and then call the property's set method directly.\n\n\
    For example, suppose this property is part of a class named `Customer`, an instance\
    \ of which is referenced by the variable `cust`. The following code would set\
    \ the value of the read-only property:\n\n```\ncust.getFirstName().set(\"Bogus\
    \ Value\");\n```"
  merge: -1
