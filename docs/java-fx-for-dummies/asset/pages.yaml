  md: '# Introduction


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_14_0.png)


    Hold it — overly technical stuff is just around the corner. Obviously, because
    this is a programming book, almost every paragraph of the 400 or so pages could
    get this icon. So I reserve it for those paragraphs that go into depth, down into
    explaining how something works under the covers — probably deeper than you really
    need to know to use a feature, but often enlightening. You sometimes find this
    icon when I want to illustrate a point with an example that uses some Java feature
    that hasn''t been covered so far in the book, or that covered later. In those
    cases, the icon is just a reminder that you shouldn''t get bogged down in the
    details of the illustration, and instead focus on the larger point.


    # Beyond the Book


    All of extra content that you won''t find in this book is available at www. dummies.com
    Go online to find the following:


    +   * Online articles covering additional topics at

    ```www.dummies.com/extras/javafx```

    Here you find articles covering additional features of JavaFX that didn''t fit
    in the book.


    +   * The Cheat Sheet for this book is at

    ```www.dummies.com/cheatsheet/javafx```

    Here you''ll find a convenient summary of some of the most important JavaFX classes.


    +   * Code listings for this book at

    ```www.dummies.com/extras/javafx```

    All the code listings used in this book are available for download.


    +   * Updates to this book, if I have any, are also available at

    ```www.dummies.com/extras/javafx```


    # Where to Go From Here


    You can get there from here. With this book in hand, you''re ready to dive right
    into the cool and refreshing water of the JavaFX pool. Browse through the Table
    of Contents and decide where you want to start. Be bold! Be courageous! Adventurous!
    And above all, have fun!'
  merge: -1
