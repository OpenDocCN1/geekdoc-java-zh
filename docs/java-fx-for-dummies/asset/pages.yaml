    # What Is JavaFX?


    Simply put, JavaFX is a collection of Java packages that lets you add fancy graphical
    user interfaces to your Java applications. With JavaFX, you can create traditional
    window-style user interfaces that include familiar controls such as labels, buttons,
    text boxes, checkboxes, drop-down lists, and so on. You can also adorn these user
    interfaces with fancy effects such as light sources, perspective, and animation.
    Enhance the FX in JavaFX.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_19_1.png)


    Prior to JavaFX, the main way was to create graphical user interfaces in Java
    was through the Swing API. JavaFX is similar to Swing in many ways, so if you''ve
    ever used Swing to create a user interface for a Java program, you have a good
    head start at learning JavaFX.


    JavaFX has been around as an add-on package for a while, but beginning with Java
    8, JavaFX is now an official standard part of the Java platform. Thus, after you
    install the Java 8 Development Kit (JDK 8), you can begin developing your own
    JavaFX applications with your favorite development tools. In this chapter, you
    discover how to download and install JDK 8, and you figure out how to create a
    simple JavaFX program using three popular Java development tools: TextPad, Eclipse,
    and NetBeans.


    Because JavaFX is now a standard part of Java, you can run Java programs on any
    device that includes version 8 of the Java Runtime Environment (JRE). That includes
    computers, tablets, smartphones, and any other device that can support JDK.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_19_2.png)


    Oracle has announced that JavaFX will eventually replace Swing. Although Swing
    is still supported in Java 8 and will be supported for the foreseeable future,
    Oracle is creating new features on JavaFX. Eventually, Swing will become obsolete.


    www.allitebooks.com'
