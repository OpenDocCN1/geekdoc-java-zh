  md: '# Chapter 20


    # # Ten Steps to Building a 3D World


    In This Chapter


    +   - Creating a virtual 3D world

    - Populating your world with shapes

    - Translating and rotating 3D objects

    - Animating 3D objects

    - Adding a light source for more realistic


    JavaFX has built-in support for realistic 3D modeling. In fact, the JavaFX scene
    graph is three-dimensional in nature. Most JavaFX programs work in just two dimensions,
    specifying x- and y-coordinates. But all you have to do is step into the third
    dimension is specifying z-coordinates to place the nodes of your scene graph in
    three-dimensional space.


    JavaFX includes a rich set of classes that are dedicated to creating and visualizing
    3D objects in 3D worlds. You can create three-dimensional shapes, such as cubes
    and cylinders. You can move the virtual camera around within the 3D space to look
    at your 3D objects from different angles and different perspectives. And you can
    add lighting sources to carefully control the final appearance of your virtual
    worlds. In short, JavaFX is capable of producing astonishing 3D scenes.


    In this chapter, I discuss ten steps how to create a relatively simple 3D program
    that displays the three-dimensional world shown in Figure 20-1. As you can see,
    this 3D space includes four shapes: a sphere, a cube, a cylinder, and a pyramid.
    This program also demonstrates several other key aspects of 3D programming: a
    perspective camera, a Phong material, a light source, and 3D animation.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_398_0.png)


    Put on your Thinking Cap, as this chapter will get pretty technical at times,
    and many of the concepts presented in this chapter can be confusing, especially
    if this is your first experience with 3D programming.'
