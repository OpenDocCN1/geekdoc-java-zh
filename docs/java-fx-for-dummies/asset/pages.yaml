- img_proc: true
  md: '# Part V: The Part of Tens


    The TitledPane has a simple constructor that accepts a string that will be displayed
    in the title bar and a node that will be displayed as the content. The node can,
    of course, be a layout pane that contains child nodes. Thus, a titled pane can
    contain multiple nodes. Here''s an example that creates three radio buttons, adds
    them to a toggle group: and creates a titled pane class to display the group of
    buttons:


    ```

    RadioButton rbSmall = new RadioButton("Small");

    RadioButton rbMedium = new RadioButton("Medium");

    RadioButton rbLarge = new RadioButton("Large");


    ToggleGroup sizeGroup = new ToggleGroup();

    sizeGroup.getToggles().addAll(rbSmall, rbMedium, rbLarge);

    rbMedium.setSelected(true);

    ```


    ```

    VBox box = new VBox(10);

    box.setPadding(new Insets(10));

    box.getChildren().addAll(rbSmall, rbMedium, rbLarge);


    TitledPane tpane = new TitledPane("Size", box);

    ```


    If you want to make the titled pane non-collapsible, add the following line:


    ```

    tpane.setCollapsible(false);

    ```


    Then, the user can''t collapse the pane. In this case, the main purpose of the
    titled pane becomes visual. The border creates a visual grouping of the radio
    buttons, and the title bar lets the user know why radio buttons are grouped (they
    let the user choose a size option). Figure 19-1 shows two panes: one collapsible,
    the other non-collapsible.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_387_0.png)'
