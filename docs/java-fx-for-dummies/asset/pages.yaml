    In this section, I build a tree that shows spinoffs from three popular television
    shows of the past:


    +   * *The Andy Griffith Show*, which had two spinoffs: *Gomer Pyle, U.S.M.C.*,
    and *Mayberry R.F.D.*


    +   * *All in the Family*, which directly spawned spinoffs: *The Jefferson, Maude,
    Gloria,* and *Archie Bunker''s Place.*


    In addition, of these two spinoffs had spinoffs of their own involving the maids:
    the *Jefferson''* maid became the topic of a short-lived show *Checking In*, and
    Maude''s maid became the main character in *Good Times.*


    +   * *Happy Days*, which spun off *Mork and Mindy, Laver and Shirley,* and *Joanie
    Loves Chachi.*


    You can take many approaches to building trees, most of which involve recursive
    programming. I''m going to avoid recursive programming in this section to keep
    things simple, but my avoidance means that you have to hardcode some of the details
    of the tree into the program. Most real programs that work with trees need some
    type of recursive programming to build the tree.


    The first step in creating a tree is declaring a `TreeItem` variable for each
    node that isn''t a leaf node. For my TV series example, I start with the following-code:


    ```

    TreeItem andy, archie, happy,

    george, maude;

    ```


    These variables can be local variables within the `start` method because once
    you get the tree up, you won''t need these variables anymore. See why you don''t
    need variables for the leaf nodes in a moment.


    Next, I create the root node and set its expanded status to `true` so that it
    is expanded when the tree displays initially:


    ```

    TreeItem root = new TreeItem("Spin Offs*");

    root.setExpanded(true);

