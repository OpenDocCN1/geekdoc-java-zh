    # The Parent Class


    Although ten different classes directly inherit the Node class, the only one you
    need to be concerned with working with JavaFX controls is the Parent class. For
    an explanation of all of the subclasses of Node, see the sidebar "Ten Different
    K of Nodes" in this chapter.


    The Parent class has all the capabilities of the Node class, plus the ability
    to have child nodes. Its main job is to manage a collection of nodes, which is
    represented as a Standard list. You can access this list by calling the getChildren
    method.


    You''ve seen this method in action panes you use, such as HBox and VBox. For example,
    the following code creates an HBox pane and then adds two controls to it:


    ```

    Label lbAddress = new Label("Address:");

    TextField txtAddress = new TextField();

    HBox hbox = new HBox();

    hbox.getChildren().addAll(lbAddress, txtAddress);

    ```


    The getChildren method returns an object of type ObservableList, which extends
    the List interface. Between them, these two interfaces define a few methods that
    you can use to manipulate the child nodes. Table 7-2 lists a few of the most commonly
    used of these methods.


    Interestingly, the getParent method is defined in the Parent class with protected
    access. That means that although the getParent method is available to any class
    that inherits the Parent class, the getParent method is not accessible to the
    outside world. For the getParent method to become public, a class that inherits
    the Parent class must override the getParent method with public access.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_157_0.png)'
