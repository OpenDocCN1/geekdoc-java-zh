  md: "# 62 Part I: Getting Started with JavaFX\n\nThe EventHandler interface used\
    \ to handle JavaFX events that meet definition: It has one abstract method, handle.\
    \ Thus, EventHandler is a functional interface and can be used with Lambda expressions.\n\
    \nA Lambda expression is a concise way to create an anonymous class that implements\
    \ a functional interface. Instead of providing a formal method declaration that\
    \ includes the return type, method name, parameter types, and method body, you\
    \ simply define the parameter types and the method body. The Java compiler infers\
    \ the rest based on the context in which you use the Lambda expression.\n\nThe\
    \ parameters are separated by the method body by a new operator — the arrow operator\
    \ — which consists of a hyphen followed by a greater symbol. Here's an example\
    \ of a Lambda expression that implements the EventHandler interface:\n\n```\n\
    e -> {\n  iCounter++;\n  lbl.setText(Integer.toString(iCounter));\n}\n```\n\n\
    In this case the Lambda expression implements a functional interface whose single\
    \ method accepts a parameter, identified as e. When the method is called, the\
    \ iCounter variable is incremented and the label text is updated to display the\
    \ new counter value.\n\nHere's how you register this Lambda expression as the\
    \ event handler for a button:\n\n```\nbtnAD.setOnAction( e -> {\n  iCounter++;\n\
    \  lbl.setText(Integer.toString(iCounter));\n});\n```\n\nOne of the things about\
    \ Lambda expressions is that you don't need to know the name of the method being\
    \ called. This is possible because a functional interface used with a Lambda expression\
    \ can have only one abstract method. In the case of the EventHandler interface,\
    \ the method is named handler.\n\nYou also do not need to know the name of the\
    \ interface being implemented. This is possible because the interface is determined\
    \ by the context. The setOnAction method takes a single parameter of type EventHandler.\
    \ When you use a Lambda in a call to setOnAction, the Java compiler can deduce\
    \ that the Lambda will implement the EventHandler interface. And because the only\
    \ abstract method of EventHandler is the handle method, the compiler can deduce\
    \ that the method body you supply is an implementation of the handle method."
