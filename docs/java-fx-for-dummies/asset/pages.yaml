  md: '# Chapter 20: Ten Steps to Building a 3D World


    # # Getting used to JavaFX 3D coordinates


    In two-dimensional scenes, coordinates are measured in the x-axis (horizontal)
    and the y-axis (vertical). Two-dimensional points are represented by a pair of
    x- and y-coordinates. For the example, the point (100, 200) represents the point
    100 units to the right of zero and 200 units below zero on the x-axis.


    Also, near zero on the x-axis, 200 units below on the y-axis, and 300 units toward
    you from zero on the z-axis.


    When you work in three dimensions, a third axis—the z-axis—is added. It is perpendicular
    to the x- and y axes. Imagine a line extending from your eyes into the computer
    monitor and through the monitor to the wall behind. That''s the z-axis.


    A crucial difference between 2D and 3D coordinates is that in a 2D scene, the
    origin (point 0,0) is located at the top-left of the corner. In a 3D scene, the
    origin (point 0,0,0) is located at the middle of the space visualized by the 3D
    scene.


    Also, keep in mind that in the JavaFX 3D world, z-coordinates decrease as they
    move toward you and increase as they move away from you. X- and y-coordinates
    behave exactly as they do in 2D: X-coordinates increase as they move to the right,
    and y-coordinates increase as they move.


    Three-dimensional points are represented by three coordinates: x, y, and z. Thus,
    (100, 200, 300) represents a point 100 units to the


    This example begins by creating a scene in the same manner as you would create
    a scene for a 2D JavaFX application. Then, the example creates an instance of
    the PerspectiveCamera class and adjusts three properties of this class.


    A perspective camera is an essential element in any 3D scene. A perspective camera
    is used to render the three-dimensional world onto a flat surface. The graph is
    actually a point set by a set of x-, y-, z-coordinates, just like other object
    in the 3D scene. The default position for the camera is the origin point (0,0,0).
    So, the first thing you want to do after adding a camera is move it to a location
    from which it can get a good view of the objects you''re adding to the scene.
    In this example, I call the setTranslate method to move the camera away from 1,000
    units.


    Next, I set the near and far clipping distances. These values mark the range within
    which the camera will render objects. The near clipping distance is typically
    set to a very small value (in this case, 0.1) and the far clipping distance to
    a large value enough to contain the objects you want to appear in the scene.'
  merge: -1
  pgno: 400
- img_proc: true
  md: '# 392 Part V: The Part of Tens


    After setting the clipping distances, I adjusted the field of view of the camera.

    The field of view is given as an angle and is analogous to using a wide-angle
    or a telephoto lens in a real camera. The default value is 30, but for this application,
    I found that 35 gives a better look at the scene.


    Finally, I designated the camera as the scene''s active camera by calling the
    scene''s setCamera method.


    At this stage, you have created a three-dimensional world. However, that your
    world is a pretty lonely place, as it has no inhabitants. In the next step, you
    add a basic 3D shape to the world.


    # Step Two: Add a Cylinder


    In this step, you add a basic 3D object to your world. JavaFX provides three basic
    shapes you can add: cylinders, boxes, and spheres. Start by adding a cylinder:


    ```

    Cylinder cylinder = new Cylinder(100,50);

    root.getChildren().add(cylinder);

    ```


    The Cylinder class constructor accepts two arguments: the radius of the cylinder
    and its height. This example creates a cylinder roughly the shape of a hockey
    puck, four times as wide as it is tall; then, it adds the cylinder to the scene''s
    root node.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_401_0.png)


    At this point, the cylinder exists in the world, but is not visible. Based on
    what you know of 2D shapes, you might be tempted to make it by adding a fill color
    (setFill) or a stroke color (setStroke). But that''s not 3D objects work. In the
    next step, you discover how to apply a material to the surface of the cylinder
    so it will be visible in the scene.


    # Step Three: Create a Material


    Rendering the faces of a 3D object is much more complicated than rendering flat,
    two-dimensional objects. For a 2D object, you just apply a Paint object via the
    setFill method. The paint can be a simple color, a gradient color, or an image.'
  merge: -1
  pgno: 401
- img_proc: true
  md: '# Chapter 20: Ten Steps to Building a 3D World


    For 3D objects, you don''t apply paint. Instead, you apply a special object called
    a Phong material, represented by the PhongMaterial class. A Phong material (named
    after Bui Tuong Phong, a pioneering computer graphics expert in the 1970''s) provides
    the means by which the faces of a 3D object are realistically rendered.


    The following code creates a simple Phong material based on two shades of blue
    and applies the material to the cylinder:


    ```

    PhongMaterial blueStuff = new PhongMaterial();

    blueStuff.setDiffuseColor(Color.LIGHTBLUE);

    blueStuff.setSpecular(Color.BLUE);

    cylinder.setMaterial(blueStuff);

    ```


    After the Phong material has been applied to the cylinder, the cylinder will be
    visible within the scene, as shown in Figure 20-2.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_402_0.png)


    # Step Four: Translate the Cylinder


    You undoubtedly noticed the cylinder in Figure 20-2 doesn''t look very three dimensional.
    That''s because you''re looking at it edge-on: The camera is pointing straight
    at the intersection of the x- and y-axes, and the cylinder is centered on that
    spot.


    To gain some perspective on the cylinder, you can move it to a different location
    in 3D space by translating the x-, y-, and z-coordinates. For example:


    ```

    cylinder.setX(-200);

    cylinder.setTranslateY(200);

    cylinder.setPrototypeOfZ(200);

    ```'
