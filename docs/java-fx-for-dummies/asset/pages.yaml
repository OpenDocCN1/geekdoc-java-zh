  md: '# # Chapter 19


    # # Ten More JavaFX Controls


    In This Chapter


    +   - Using the TitledPane class to create a pane with a border and the title

    - Combining two or more titled panes in an Accordion

    - Choosing wisely with the DatePicker and ColorPicker controls

    - Creating buttons that look like hyperlinks

    - Indicating your progress with the ProgressIndicator and ProgressBar controls

    - Selecting from a range of values with a Slider control

    - Using a ScrollBar for other than its intended purpose

    - Entering secret stuff with a PasswordField control


    all, JavaFX has about 75 controls you can choose from to build your user interfaces.
    So far in this book, you''ve read about how to work with about 30 of them. In
    this chapter, you find out about ten more.


    So, without further ado, direct from my home office in sunny California, here
    are ten more JavaFX controls to put in your toolbox.


    # # TitledPane


    A Titled pane is a pane that contains a single content node and draws a title
    bar and a border around the content to distinguish the content from other content
    in the scene. In addition, title panes are collapsible, which means the user can
    collapse the titled pane so that the title bar is visible. However, you can make
    the titled pane non-collapsible if you wish.


    In spite of its name, TitledPane is a control, not a layout pane. In other words,
    it is a subclass of Control, not of Pane.'
