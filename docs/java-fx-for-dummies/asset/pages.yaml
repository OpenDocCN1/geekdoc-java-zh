- img_proc: true
  md: "# Chapter 15: Using Properties to Create Dynamic Scenes\n\nTo safely create\
    \ a read-only property, you must actually create two copies of the property: a\
    \ read-only version and a read/write version. The read-only version will be exposed\
    \ to the outside world. The read/write version will be used internally, within\
    \ the class that defines the property. Then, you must synchronize these two properties\
    \ so that whenever the value of the internal read/write property changes, the\
    \ value of the external read-only property is updated automatically.\n\nTo accomplish\
    \ this, JavaFX provides two additional classes for each property type: a read-only\
    \ property class and a read-only wrapper class. The read-only property class is\
    \ the one you share with the outside world via the property accessor. The read-only\
    \ wrapper class is the one you use to create the private field used to reference\
    \ the property within the program.\n\nHere's a complete example that implements\
    \ a read-only integer property named accountNumber in a class Customer:\n\n```\n\
    public class Customer {\n    ReadOnlyIntegerWrapper customerNumber =\n       \
    \ new ReadOnlyIntegerWrapper(this,\n            \"customerNumber\", 0);\n\n  \
    \  public final Integer getCustomerNumber() {\n        return customerNumber.get();\n\
    \    }\n\n    public final ReadOnlyProperty customerNumberProperty() {\n     \
    \   return customerNumber.getReadOnlyProperty();\n    }\n\n    // more class details\
    \ go here\n}\n```\n\nThe key to understanding how this works is realizing that\
    \ the read-only wrapper is an extension of the simple property class which adds\
    \ just one method: getReadOnlyProperty(), which returns a read-only copy of the\
    \ simple property. This read-only property is automatically synchronized with\
    \ the simple property, so that whenever a change is made to the underlying simple\
    \ property, the value of the read-only property will be changed as well."
