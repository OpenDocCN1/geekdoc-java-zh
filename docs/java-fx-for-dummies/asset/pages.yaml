    To Create a Media object, call the Media class constructor and specify the URI
    (Uniform Resource Identifier) to the media file. If you are accessing from the
    local file system, the best way to get a valid URI is to first create a File object
    using a standard file path for the file. Then, call toURI() on the File object
    to get the correct URI. Here''s an example that assumes the local file path is
    in the variable PATH:


    ```

    File f = new File(PATH);

    Media media = new Media(f.toURI()).toString();

    ```


    After you obtain a Media object, you can easily play it by using the MediaPlayer
    class:


    ```

    MediaPlayer mplayer = new MediaPlayer(media);

    mplayer.setAutoPlay(true);

    ```


