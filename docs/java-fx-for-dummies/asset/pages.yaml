  md: '# 86 Part I: Getting Started with JavaFX


    Heavens to Megatroyd!


    There''s a right way and a wrong way to exit the stage, even. And so far, none
    of the programs in this book have done it the right way. The only mechanism the
    programs you''ve seen so far have provided to quit the program is for the user
    to click the standard window close button, typically represented by an X in the
    upper-right corner of the window''s title bar. That is almost always the wrong
    way to exit a program.


    In most cases, the correct way to exit a program involves the following details:


    +   - Adding a button, menu command, or other way for the user to signal that
    she wishes to close the program.


    Many programs include a button labeled Exit or Close, and programs that use a
    menu usually have an Exit command.


    +   - Optionally displaying a confirmation box that verifies whether the user
    really wants to close the program. You can do that by using the ConfirmationBox
    class in the preceding section or by using a similar class.


    Depending on the program, you might want to display this dialog box only if the
    user has made changes to a document, database, or other file that have not been
    saved.


    +   - If the user really does want to close the program, the program should perform
    any necessary clean-up work, such as


    +   - Saving changes to documents, databases, or other files.

    - Properly closing databases and other resources.


    +   - After you''ve done any necessary clean-up work, you can close the application
    by calling the primary stage''s close method.


    +   - The verification and clean-up steps should be taken whether the user attempts
    to close the program by using a button or menu command in your user interface
    or by clicking the built-in window close button.


    In the following sections, you read about how to add a button to your application,
    how to prevent the window close button from unceremoniously terminating your application,
    and how to put these two elements together in a complete program.'
