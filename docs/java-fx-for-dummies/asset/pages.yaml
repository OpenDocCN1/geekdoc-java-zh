  md: '# Chapter 8: Choosing from a List


    **Note:** You do not use the add method to respond when the user selects an item
    in a choice box or other type of list control. Instead, you use an interesting
    construct called a *selection model* to respond to changes in the selected item,
    as described in the next section.


    # # Listening for Selection Changes


    It''s not uncommon to write your program to respond immediately when the user
    changes the selection of a choice box or other list control, without waiting for
    you to click a button to submit the data. For example, you might have a label
    whose value you want to update whenever the user changes the selection. You might
    even want to show or hide different controls on the selection.


    Unfortunately, the choice box and other list controls do not generate an action
    event when the user changes the selection. As a result, the `ComboBox` class doesn''t
    have a `setOnAction` method. Instead, you must use a complicated sequence of method
    calls to set up a different type of event listener, called a `change listener`.


    Here''s the sequence:


    +   1. Get the selection model by calling the `selectionModel` method on the choice
    box.


    The `selectionModel` method returns the control''s *selection model*, which is
    an object that manages how the user can select items from the list. The selection
    model is an object that implements one of several classes that extend the abstract
    `SelectionModel` class. For a choice box, the selection model is always of type
    `SingleSelectionMode`, which implements a selection model that allows the user
    to select one item at a time.


    +   2. Get the `selectedItem` property by calling the `selectedItemProperty` on
    the selection model.


    The `SelectionModel` class has a method named `selectedItemProperty` that accesses
    a property named `selectedItem`, which represents the item currently selected.
    (*A property* is a special type of JavaFX object that I discuss more about in
    Chapter 19. For now, just assume that a property is an object whose value can
    be monitored by a listener that''s called whenever the value of the property changes.)


    163'
