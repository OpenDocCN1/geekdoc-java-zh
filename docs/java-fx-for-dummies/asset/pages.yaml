    19-7 shows a scene that resembles an audio equalizer with eight slider controls,
    each showing tick marks allowing values from 0 to 100. The labels beneath the
    sliders are not part of the slider control; they are separate labels whose values
    are set by the OnAction event generated whenever the user moves one of the sliders.'
