    e.setUtY(100);


    e.setLLX(0);      // Lower left

    e.setLLY(300);


    e.setLRX(400);    // Lower right

    e.setLRY(300);


    DropShadow shadow = new DropShadow();

    shadow.setWidth(20);

    shadow.setHeight(20);

    ```'
