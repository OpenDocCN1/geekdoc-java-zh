  md: '# Chapter 16: Using Images and Media


    Displaying a single image in two or more image views is perfectly acceptable.

    For example:


    ```

    Image img = new Image("file:C:\Pictures\pic001.jpg");

    ImageView view1 = new ImageView(img);

    ImageView view2 = new ImageView(img);

    ```


    Because an image is a node, you can apply special effects to it, as I describe
    in Chapter 14. For example here is a snippet of code that loads an image, places
    it into two image views, and then applies a motion blur to the second view:


    ```

    Image img = new Image("file:C:\Pictures\pic001.jpg");

    ImageView view1 = new ImageView(img);

    view1.setFitWidth(300);

    view1.setFitHeight(300);

    view1.setPreserveRatio(true);

    ```


    ```

    ImageView view2 = new ImageView(img);

    view2.setFitWidth(300);

    view2.setFitHeight(300);

    view2.setPreserveRatio(true);

    ```


    ```

    MotionBlur blur = new MotionBlur();

    blur.setRadius(25);

    blur.setAngle(180);

    view2.setEffect(blur);

    ```


    Figure 16-2 shows how this image appears in the two image views, of which has
    a motion blur effect.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_340_0.png)


    Figure 16-2: Applying an effect to an image.'
