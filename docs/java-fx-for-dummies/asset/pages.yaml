  md: '# 50 Part I: Getting Started with JavaFX


    # Examining Events


    An event is an object that''s generated when the user does something noteworthy
    with one of your user-interface components. Then this event object is passed to
    a special method you create, called an event handler. The event handler can examine
    the event object, determine exactly what type of event occurred, and respond asynchronously.
    If the user clicks a button, the event handler might write any data entered by
    the user via text fields to a file. If the user passes the mouse cursor over a
    label, the event handler might change the text displayed by the Label. If the
    user selects an item from a combo box, the event handler might use the value that
    was selected to look up information in a database. The possibilities are endless!


    An event is represented by an instance of the class javafx.event or one of its
    many subclasses. Table 3-1 lists the most commonly used event classes.


    | Table 3-1 Commonly Used Event Classes |

    | Event Class | Package | Description |

    | :--- | :--- | :--- |

    | ActionEvent | javafx.event | Created when the user performs an action with a
    button or other component. Usually this means the user clicked the button, but
    the user can also invoke a button action by tabbing to the button and pressing
    the Enter key. This is the most commonly used event class, as it represents the
    most common types of user-interface events. |

    | KeyEvent | javafx.scene.input | Created when an event results from user input,
    such as a mouse or key click, occurs. |

    | KeyEvent | javafx.scene.input | Created when the user presses a key on the keyboard.
    This event can be used to watch for specific keystrokes entered by the user. (KeyEvent
    is a subclass of Input.) |'
