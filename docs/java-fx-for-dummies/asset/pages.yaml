  md: '# Chapter 5: Using Layout Panes to Arrange Your Scenes


    To set the spacing for an HBox pane, you can use the spacing parameter on the
    HBox constructor or by calling the setSpacing method. For example, this statement
    creates an HBox pane with a default spacing of 10 pixels:


    ```

    HBox hbox = new HBox(10);

    ```


    This example creates an HBox pane with 10-pixel spacing and adds three buttons:


    ```

    HBox hbox = new HBox(10, btn1, btn2, btn3);

    ```


    And this example creates an HBox pane using the default constructor, and then
    calls the setPadding method to set the spacing to 10 pixels:


    ```

    HBox hbox = new HBox();

    Hbox.setSpacing(10);

    ```


    Although spacing adds space between nodes in an HBox pane, it doesn''t provide
    any space between the nodes and the edges of the pane itself. For example, if
    you set the spacing to 10 pixels and add three buttons to the pane, the three
    buttons will be separated from one another by a gap of 10 pixels. However there
    won''t be any space at all between the left edge of the first button and the left
    edge of the pane itself. Nor will there be any space between the top of the buttons
    and the top of the pane. In other words, the three-buttons will be crowded tightly
    into the pane.


    To set the padding to a uniform 10 pixels, call the setPadding method like this:


    ```

    hbox.setPadding(new Insets(10));

    ```


    To set a different padding value for each edge, call it like this:


    ```

    hbox.setPadding(new Insets(20, 10, 20, 10));

    ```


    In this example, the top and bottom padding is set to 20 and the right and left
    padding is set to 10.'
