  md: "# Part III: Enhancing Your Scenic Design\n\n# Using Inline Styling\n\nIn addition\
    \ to using separate .css style sheets, JavaFX lets you apply style rules directly\
    \ to any node in a scene graph by calling the node'ssetStyle method, formatting\
    \ the rule as a string argument. For example, the following example sets the font\
    \ size for a button to 15 points:\n\n```\nButton btnOK = new Button(\"OK\");\n\
    btnOK.setStyle(\"fx-font-size: 15pt\");\n```\n\n![](img/0a30bdfcbc78f5a98df16eea42b42e83_269_0.png)\n\
    \nAs a general rule, I recommend using inline styles except for unusual situations.\
    \ Because your inline styles make it more difficult to change the formatting of\
    \ your application's user interface. Imagine if you were to apply all elements\
    \ inline styles. If you then decided to make even a simple change, you'd have\
    \ to search through the entire application code to find the inline styles that\
    \ need to be changed. Then, you'd have to recompile the program.\n\nIn contrast,\
    \ external style sheets make it easier to change the appearance of your GUI. All\
    \ you have to do is edit the .css file, and the formatting automatically reflects\
    \ your changes.\n\n# Creating a Style Sheet\n\nNow you know how to attach styles\
    \ to an application, scene, or individual node, it's time to turn your attention\
    \ to the task of actually creating styles. As I mentioned earlier, a style sheet\
    \ is a simple text file with the extension .css. You can create your style sheets\
    \ with any standard text editor, such as Eclipse or NetBeans, as well as simple\
    \ text editors, like TextPad or Notepad. Save the .css file in the same folder\
    \ as your application's java folder.\n\nA style sheet of one or more style rules\
    \ determines the formatting applied to various types of elements in a scene. Each\
    \ style rule consists of a selector, which determines which elements the style\
    \ rule applies to, followed by a declaration block, which is a list of style declarations\
    \ contained within a pair of braces. Each declaration consists of a property name\
    \ followed by a colon and a value. Each declaration is terminated by a semi-colon.\n\
    \nFor example:\n\n```\n.root {\n  -fx-background-color: lightgray;\n  -fx-font-family:\
    \ \"serif\";\n  -fx-font-size: 12pt;\n}\n```"
  merge: -1
  pgno: 269
