    # Using the Flow Layout


    The flow layout comes in two flavors: horizontal and vertical. A horizontal layout
    changes its child nodes in a row until the width of the pane reaches a certain
    size that you can specify. When that size is reached, the layout begins a new
    row of child nodes beneath the first row. This flow continues, starting a new
    row each time the size limit is reached, until all the child nodes have been placed.


    A vertical flow layout works the same except that child nodes are laid out in
    columns until the size limit is reached. When the size limit is reached, a new
    column immediately to the right of the first column is started.'
