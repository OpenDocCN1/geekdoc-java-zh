  md: '# # Chapter 14


    # # Adding Special Effects


    **In This Chapter**


    +   * Applying shadows to your shapes

    * Working with reflections

    * Making items blurry

    * Working with the Bloom and Glow classes

    * Adding perspective to flat drawings

    * Combining special effects


    Welcome to the Special Effects chapter! Here, you read about how to embellish
    the appearance of the nodes in your scene graph, glows, and so on. Special effects
    such as blurs, shadows, color displacements, and you can even add perspective
    to give your application a three-dimensional look without having to do actual
    3D programming.


    You probably won''t win an Oscar for any of the special effects described in this
    chapter, but at least you''ll have fun!


    # # Introducing Special Effects


    Special effects in JavaFX derive from the Effect class, an abstract class that
    has a wide variety of subclasses you can use to create a special effect. There
    are a total of 17 subclasses of the Effect class, but I don''t have room to cover
    all 17 of them here. Instead, this chapter focuses on those effects that let you
    make your shapes look more realistic by adding blurring, shadows, reflections,
    and glow.


    All the effects presented in this chapter work in a similar way. First, you create
    an instance of the effect''s class by calling its default constructor. Then, you
    optionally set the properties of the effect by calling one or more methods. (In
    many cases, the default property values are appropriate, so you can skip this
    step.) Finally, you apply the effect to a node by calling the node''s setEffect
    method.'
