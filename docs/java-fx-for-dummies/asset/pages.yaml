  md: '# Step Nine: Animate the Objects


    Whew! Your 3D virtual world now has four objects: a sphere that looks like the
    earth, a cubic box, a cylinder that looks like a hockey puck, and a pyramid.


    In this step, I add an animation to all four objects to get them spinning. Each
    object gets a simple RotateTransition animation. First, the box:


    ```

    RotateTransition rtl = new RotateTransition();

    rtl.setNode(box);

    rtl.setDuration(Duration.millis(3000));

    rtl.setAxis(Rotate.Z_AXIS);

    rtl.setAngle(360);

    rtl.setCycleCount(Animation.INFINITE);

    rtl.setInterpolator(Interpolator.LINEAR);

    rtl.play();

    ```


    After the play method, the box starts spinning, making one complete turn around
    its z-axis every three seconds.


    The other animations are similar; the only differences are the node to be rotated,
    the axis of rotation, and the speed. For the cylinder, the rotation is on the
    x-axis. The sphere rotates around the y-axis, creating the impression that the
    world is revolving. For the sphere, the speed is set to create one revolution
    every 10 seconds. And finally, the pyramid rotates over the y-axis.


    # Step Ten: Add a Light Source


    The last step into this foray into the world of 3D programming is to add a light
    source. The light source will change the whole look of the scene, as shown in
    Figure 20-8.


    To add the light source, I use the following code:


    ```

    PointLight light = new PointLight(Color.WHITE);

    light.translateX(-100);

    light.translateY(100);

    light.setTranslateZ(-1000);

    root.getChildren().add(light);

    ```'
