  md: '# Chapter 5: Using Layout Panes to Arrange Your Scenes


    The setMargin method is a static method of the HBox class, when you call it, you
    can reference the HBox class itself rather than an actual instance of an HBox.
    Thus, the following code will work equally as well:


    ```

    HBox.setMargin(btn1, new Insets(10));

    ```


    (It''s a subtle difference: in the first example, hbox refers to an instance of
    the HBox class; in the second example, Hbox refers to class itself.)


    Here''s an example that sets a different margin for each side of the pane:


    ```

    Hbox.setMargin(btn1, new Insets(10, 15, 20, 10));

    ```


    In this example, the top margin is 10 pixels, the right margin is 15 pixels, the
    bottom margin is 20 pixels, and the left margin is 10 pixels.


    Note that margins, spacing, and padding can work together. If you create a 5-pixel
    margin on all sides of two buttons, add those two buttons to a pane whose spacing
    is set to 10 pixels and whose padding is set to 10 pixels, the buttons will be
    separated from one another by a space of 20 pixels and from the inside edges of
    the pane by 15 pixels.


    # Adding Space by Growing Nodes


    A way to add space between nodes in an HBox is to create a node whose purpose
    is to add space between two HBox nodes. Then, you can configure the spacer node
    that will automatically grow to fill any extra space within the pane. By configuring
    only the spacer node and no other nodes in this, only the spacer node will grow.
    This has the effect of pushing the nodes on either side of the spacer apart from
    one another.


    For example, suppose you want to create an HBox layout that contains three buttons.
    Instead of spacing all three buttons within the pane, you want the first two buttons
    to appear on the left side of the pane and the third button to appear on the right
    side of the pane. The amount of space between the second and third buttons will
    depend entirely on the size of the pane. Thus, if the user drags the window to
    expand the stage, the amount of space between the second and third buttons should
    increase accordingly.


    The easiest way to create a spacer node is using the Region class. The Region
    class is the base class for both the Control class, from which controls as Button
    and Label derive. It is also the based class for the Pane class, from which all
    the layout panes described in this chapter and in Chapter 11 derive.'
