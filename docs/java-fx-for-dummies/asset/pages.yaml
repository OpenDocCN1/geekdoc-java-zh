    \ and to an HBox. Later in the program, the HBox is added to a GridPane layout\
    \ to display in the bottom-left corner of the screen.\n\n# Adding a Style Sheet\
    \ to a Scene\n\nIf you want to, you can create a style sheet to replace the Modena\
    \ or Caspian themes with your own, creating an entirely different look and feel\
    \ for your application. Then, you can apply your style sheet as the application's\
    \ default style sheet using Application.setUserAgentStylesheet, as I describe\
    \ in the preceding section.\n\nHowever, creating a completely new theme to application-wide\
    \ can be a difficult task, as your style sheet must provide style information\
    \ for every possible formattable node element. Instead, you may want to start\
    \ creating a smaller style sheet that provides formatting information for the\
    \ specific needs of your application. Then, you can apply the style sheet to a\
    \ specific scene or to an individual node within a scene."
