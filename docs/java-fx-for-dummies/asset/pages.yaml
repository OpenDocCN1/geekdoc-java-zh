  md: '# Chapter 4: Setting the Stage and Scene Layout


    +   - You can set the scene''s initial size when you you create it by specifying
    the Width and Height parameters.


    If you don''t set the size, the scene will determine its own size based on its
    content.


    +   - You can retrieve the size of the scene via the getHeight getWidth methods.


    There are no corresponding set methods that let you set the height or width.


    +   - In general, the size of the scene determines the size of the stage, provided
    that scene is not smaller than the minimum size specified for the stage or larger
    than the maximum size.


    +   - If you resize the stage, the size of the scene is resized accordingly.


    # Switching Scenes


    The primary stage of a JavaFX program (or any stage, for that matter) can have
    only one scene displayed within it at any given time. However, that doesn''t mean
    your program can create several scenes and swap them as needed. For example, suppose
    you are developing a word-processing program and want to let the user switch between
    an editing view and a page preview view. You could do that by creating distinct
    scenes, one for each view. Then, to switch between the views, you simply call
    the stage''s setScene method to switch the scene.


    In Chapter 2, you read about a ClickCounter program whose scene displays a label
    and updates the label to indicate how many times the user has clicked the button.
    Then, in Chapter 3, you saw several variations of AddSubtract program whose scene
    displays a label and two buttons: One button added to a counter when clicked,
    the other subtracted one from the counter.


    Listing 4-1 shows a program named SceneSwitcher that combines the scenes from
    the ClickCounter and AddSubtract programs into one single program. 4-1 shows this
    program in action:


    +   - When the SceneSwitcher program is first run, it displays the ClickCounter
    scene as shown on the left side of the figure.


    +   - When the user clicks the Switch Scene button, the scene switches to the
    AddSubtract scene, as shown in the right side of the figure.'
