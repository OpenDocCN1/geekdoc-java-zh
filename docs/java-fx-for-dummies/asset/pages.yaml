  md: '# Chapter 6: Getting Input from the User


    # Validating Numeric Data


    You need to take special care if you''re using a text field to get numeric data
    from the user. The getText method returns a string value. You can pass this value
    to one of the parse methods of the wrapper classes for the primitive types. To
    convert the value entered in a text box to an int, use the parseInt method.


    ```

    int count = Integer.parseInt(txtCount.getText());

    ```


    Here the result of the getText method is used as the parameter of the parseInt
