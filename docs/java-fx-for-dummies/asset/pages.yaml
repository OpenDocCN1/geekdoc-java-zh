  md: '# Using Check and Radio Menu Items


    A check menu item is a menu item that resembles a check box that the user can
    click to check or uncheck. Check menu''s ideal for menu items that allow users
    to select program options.


    A radio menu item is similar to a check menu except that it can be grouped with
    other radio menu items, like a radio button. With radio buttons, only one item
    in a group of radio menu items can be selected at a time. So when the user clicks
    a radio menu item, any other radio items in the same group are automatically unchecked.


    Figure 10-2 shows an Options menu that contains two check menu items and three
    radio items. A separator is used to separate the check items from the radio items.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_226_0.png)


    Figure 10-2: A menu with check menu items and radio menu items.


    To create a check menu item, use the CheckMenuItem class, whose constructors and
    methods are listed in Table 10-4. This class inherits the MenuItem class, so most
    of its methods are the same.'
