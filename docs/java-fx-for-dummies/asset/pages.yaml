  md: "# Part IV: Making Your Programs Come Alive\n\n# Using Property Events\n\nJavaFX\
    \ properties provide an addListener method that lets you add event handlers that\
    \ are called whenever the value of a property changes. You can create two types\
    \ of event handlers:\n\n+   - A change listener, which is called whenever the\
    \ value of the property has been recalculated. The listener is passed three arguments:\
    \ the property whose value changed, the previous value of the property, and the\
    \ new value.\n- An invalidation listener, which is called whenever the value of\
    \ the property becomes unknown. This event is raised when the value of the property\
    \ needs to be recalculated, but has not yet been recalculated. An invalidation\
    \ event listener is passed just one argument: the property itself.\n\nChange and\
    \ invalidation listeners are defined by functional interfaces ChangeListener and\
    \ InvalidationListener. Because these are functional interfaces, you can use Lambda\
    \ expressions to implement them. Here's how you use a Lambda expression to register\
    \ a change listener on the text property of a text field text1:\n\n```\ntext1.textProperty().addListener(\n\
    \    (observable, oldvalue, newValue) ->\n    // code goes here\n);\n```\n\nHere's\
    \ an example that registers an invalidation listener:\n\n```\ntext1.textProperty().addListener(\n\
    \    (observable) ->\n    // code goes here\n);\n```\n\nThe only way addListener\
    \ knows whether you are registering a change listener or an invalidation listener\
    \ is by looking at the arguments you specify for the Lambda expression. If you\
    \ provide three arguments, addListener registers a change listener. If you provide\
    \ just one argument, an invalidation listener is installed."
  merge: -1
