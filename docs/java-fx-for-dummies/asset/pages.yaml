    # # Step Six: Rotate the Box


    In this step, I rotate the box to create an even more interesting perspective
    view. There are two ways to rotate a 3D object. The simplest is to call the object''s
    `setRotate` method and supply a rotation angle:


    ```

    box.setRotate(25);

    ```


    By default, this will rotate the object on its z-axis. If this is difficult to
    visualize, imagine skewering the object with a long stick that is parallel to
    the z-axis. Then, spin the object on the skewer.


    If you want to rotate the object along a different axis, first call the `setRotationAxis`.
    For example, to spin the object on its x-axis, use this sequence:


    ```

    box.setRotationAxis(Rotate.X_AXIS)

    box.setRotate(25);

    ```


    Imagine running the skewer through the box with the skewer parallel to the x-axis
    and then spinning the box 25 degrees.


    The only problem with using the `setRotate` method to rotate a 3D object is that
    it works only on one axis at a time. For example, suppose you want to rotate the
    box 25 degrees on both the z- and the x-axis. The following code will not accomplish
    this:


    ```

    box.setRotationAxis(Rotate.X_AXIS)

    box.setRotate(25)

    box.setRotationAxis(Rotate.Z_AXIS)

    box.setRotate(25);

    ```'
