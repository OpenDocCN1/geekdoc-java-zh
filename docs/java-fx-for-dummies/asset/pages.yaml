  md: '# About the Author


    **Doug Lowe** has been writing computer programming books since the guys who invented
    Java were in grade school. He''s written books on COBOL, FORTRAN, Visual Basic,
    IBM mainframe computers, mid-range systems, PC''s, web programming, and probably
    a few he''s completely forgotten about. He''s the author of more than 30 For Dummies
    books, including Java All-In-One For Dummies, 4th Edition; Java For Dummies Quick
    Reference; Networking All-In-One For Dummies, 4th Edition; PowerPoint 2013 For
    Dummies, and Electronics All-In-One For Dummies. He lives in that sunny Formerly-All-American
    city Fresno, California, where his motto is, "Buster Posey Got Out, Why Can''t
    I!"'
