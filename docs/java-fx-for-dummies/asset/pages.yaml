  md: '# # Chapter 5


    # # Using Layout Panes to Arrange Your Scenes


    In This Chapter


    +   - Using four popular layout pane classes: HBox, VBox, FlowPane, and BorderPane

    - Adjusting the size of layout panes and the nodes they contain

    - Fiddling with various options for spacing the nodes in a layout pane


    > Controlling the layout of components in a scene is often one of the most difficult
    aspects of working with JavaFX. In fact, at times it can be downright exhausting.
    Often the components almost seem to have minds of their own. They get stubborn
    and refuse to hide. They line up on one another when you want them to be side
    by side. You make a slight change to a label or text field, and the scene seems
    to rearrange itself. At times, you want to put your fist through the monitor.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_102_0.png)


    I recommend against putting your fist through your monitor. You''ll make a mess,
    cut your hand, and have to spend money on a new monitor — and when you get your
    computer working again, the components still won''t leave you alone.


    The problem isn''t with the components; it''s the layout panes, which determine
    where each component appears in its frame or panel. Layout panes are special classes
    whose sole purpose is to control the arrangement of nodes that appear in a scene.
    JavaFX provides several distinct types of layout panes; each uses a different
    approach to controlling the arrangement of nodes. The trick to successfully lay
    out a scene is to use the layout panes in the correct combination to achieve the
    arrangement you want.


    # # Working with Layout Panes


    Understanding layout panes is the key to creating JavaFX frames that are attractive
    and usable.'
