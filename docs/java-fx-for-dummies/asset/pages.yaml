  md: '# Part III: Enhancing Your Scenic Design


    # Using Default Style Sheets


    JavaFX comes with two built-in themes: Modena and Caspian. Modena is a new theme
    that was introduced with JavaFX 8; Caspian is an older theme that was used with
    previous versions of JavaFX.


    Figure 12-1 shows a version of the Pizza Order application that I present in Chapter
    11; it includes a pair of radio buttons to allow the user to switch between the
    Modena and Caspian themes. The window on the left side of the figure shows the
    Modena theme; the Caspian theme is shown on the right.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_265_0.png)


    Figure 12-1: JavaFX application shown in the Modena and Caspian themes.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_265_1.png)


    To switch the theme of an application, use the setUserAgentStylesheet method of
    the Application class. The Application class defines two static fields that you
    can use to reference the built-in styles: STYLESHEET_MODENA and STYLESHEET_CASPIAN.
    Thus, to use Caspian as the style sheet, use this statement:


    ```

    Application.setUserAgentStylesheet(

    STYLESHEET_CASPIAN);

    ```'
