  md: '# 228 Part III: Enhancing Your Scenic Design


    +   AnchorPane: This layout lets you anchor nodes to the top, right, bottom, or
    center of the pane. As the pane res, the nodes are repositioned but remain tied
    to their anchor points. Note: A node can be anchored to more than one position.
    For example, you might anchor a node to the top and the right. Then, when you
    resize the pane, the node will remain near the top-right corner of the pane.


    +   GridPane: Arranges nodes in a grid of rows and columns. The grid does not
    have to be uniformly sized like a chess board. Instead, the width of each column
    and the height of each row can vary according to its content. In addition, content
    can span columns or rows. GridPane is an ideal layout type for forms that gather
    information from the user interface controls as text boxes, list boxes, and so
    on.


    +   TilePane: If you want a layout that resembles a chess board, in which each
    cell in a grid is the same size, TilePane is the layout pane you''re looking for.
    TilePane is ideal for organizing thumbnails of image files or other objects of
    the same size.


    +   ScrollPane: Technically, the ScrollPane class is not a layout pane at all;
    it inherits the Control class, not the Pane class. However, it''s primary use
    is to create layouts that are too large to display all at once and so require
    a scroll bar to allow the user to pan left and right up or down (both) to see
    all its contents.


    Keep in mind that layout panes are typically used in combinations to create the
    complete layout for your scene. For example, you might use a GridPane to organize
    user input controls and then place the GridPane in the center of a BorderPane
    to place it in the middle of the scene. Or, you might use VBox to display labels
    beneath image thumbnails and then add the VBox to a tile pane to display the labeled
    images in a tiled arrangement.


    # Using the StackPane Layout


    A stack pane layout is unusual in that it does not arrange its nodes by spreading
    them out so that you can see them all. Instead, it stacks its nodes on top of
    the other so that they overlap. The first node you add to a stack pane at the
    bottom of the stack; the last node is on the top.'
