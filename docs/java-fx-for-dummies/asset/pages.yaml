  md: '# Step Seven: Add a Sphere


    In this step, I add a sphere, represented by the Sphere class. The Sphere constructor
    accepts just a single parameter, which specifies the radius of the sphere. For
    example, these lines create a sphere whose radius is 100, and then translates
    it to move it off the center point of your virtual world:


    ```

    sphere = new Sphere(100)

    sphere.translateX(-180)

    sphere.translateY(-100)

    sphere.translateZ(100)

    root.getChildren().add(sphere);

    ```


    Rather than apply the same blue Phong to the sphere, I decided to do something
    more interesting: I apply a Phong material constructed from an image of a cylindrical
    projection of the earth using this code:


    ```

    Image earthImage = new Image("file:earth.jpg")

    PhongMaterial earthPhong = new PhongMaterial()

    earthPhong.setDiffuseMap(earthImage)

    sphere.setMaterial(earthPhong);

    ```


    Figure 20-6 shows the resulting sphere.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_406_0.png)


    You can wrap any image around a sphere (or any other 3D object, for that matter)
    using this technique. I obtained the image I used for this program from Wikipedia.
    Just search for Behrmann Projection and then download the file. (I used Windows
    Paint to paint the edges of the image a bit because the image available on Wikipedia
    has a small border around the edges.)'
