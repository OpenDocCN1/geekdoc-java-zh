  md: '# Chapter 2: Looking Closer at JavaFX Programming


    To set the text value displayed by the button, call the setText method, passing
    the text to be displayed as a string:


    ```

    btn.setText("Click me please!");

    ```


    Here are a few additional tidbits about buttons:


    +   The Button constructor allows you to pass the text to be displayed on the
    button as a parameter, and in this example:


    ```

    Btn = new Button("Click me please!");

    ```


    If you set the button''s text in this way, you don''t need to call the setTitle
    method.


    +   The Button class is one of many classes that are derived from a parent class
    known as javafx.scene.control.Control. Many other classes derive from this class,
    including Label, TextField, ComboBox, CheckBox, and RadioButton.


    +   The Control class is one of several different classes that are derived from
    higher-level parent class javafx.scene.Node. Node is the base class of all user-interface
    elements that can be displayed in a scene. A control is a specific type of node,
    but there are other types of nodes. In other words, all controls are nodes, but
    not all nodes controls. You can read more about other types of nodes later in
    this book.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_48_0.png)


    # Handling an Action Event


    When the user clicks a button, an event is triggered. Your program can respond
    to the event by providing an event handler, which is simply a bit of code that
    will be executed whenever the event occurs. The Click Mc works by setting up an
    event handler for the button; code for the event handler changes the text displayed
    on the button.


    In Chapter 3, there are several ways to handle events in JavaFX. For now, I look
    briefly at one of the simplest methods, which requires simply that you specify
    that a method be called whenever the event occurs and then provide the code to
    implement that method.


    To specify the method to be called when the user clicks a button, you call the
    setAction method of the button class. Here''s how it''s done in Listing 2-1:


    ```

    btn.setOnAction(e -> buttonClick());

    ```'
