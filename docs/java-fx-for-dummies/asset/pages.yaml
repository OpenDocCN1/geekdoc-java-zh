    All the layout classes are based on the Pane class, and both the Pane class in
    this package and the Control class in the javafx.scene.control class are based
    on the Region class. For more information about the Region class, see the section
    "The Region Class" in this chapter.

    javafx.geometry: This is a relatively small package that defines elementary classes
    and enumerations that are related to the geometry of JavaFX nodes. In Chapter
    5, you figure out how to use the Insets class to control spacing within a layout
    pane as well as the Pos to specify alignments.

    javafx.collections: This package defines the ObservableList class, which is used
    by the getChildren method of the Pane class. You also encounter several control
    classes in the next few chapters that require this package.


    Because these seven packages contain most of the JavaFX classes you will use in
    applications that work most with controls (as opposed to classes that work with
    other user-interface objects such as graphs, shapes, or animations), I recommend
    you import all the classes in these seven packages for your programs:


    ```

