    # Using the GridPane Layout


    The grid pane layout manager lets you arrange GUI elements in a grid of rows and
    columns. Unlike a tile pane, the rows and columns of a grid pane do not have to
    be the same size. Instead, the grid pane layout automatically adjusts the width
    of each column and the height of each row based on the components you add to the
    panel.


    There are some important features of the grid pane layout manager:


    +   You can specify which cell you want component to go in, and you can control
    each component''s position in the panel.


    +   You can create components that span multiple rows or columns, such as a button
    two columns wide or a list box four rows high.


    +   You can tell GridPane to stretch a component to fill the entire space allotted
    to it if the component isn''t already big enough to fill the entire area. You
    can specify if that stretching be done horizontally, vertically, or both.


    +   If a component doesn''t fill its allotted area, you can tell the grid pane
    layout manager how you want the component to be positioned within the area — for
    example, left- or right-aligned.


    The following sections describe the ins and outs of working with grid pane layouts.'
