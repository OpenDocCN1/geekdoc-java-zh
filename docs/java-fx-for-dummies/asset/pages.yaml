  md: '# Chapter 10


    # Making Menus


    In This Chapter


    +   - Creating basic and dynamic menus

    - Working with separators and action listeners

    - Constructing menus with check boxes and radio buttons

    - Creating submenus and custom menu items


    In this chapter, you find out how to adorn your programs with menus. You work
    with menus in applications, so you''re probably already familiar with what menus
    are and how they work. I don''t review those basics in this chapter. Instead,
    I jump right into the details of how to create a menu and add it to a scene.


    # Introducing Classes for Creating Menus


    The following paragraphs describe the classes you use most often when create menus:


    +   - Menu: This class is the top-level container for menus that appear in the
    menu bar at the top of a scene.

    - Each menu in the menu bar is represented by a Menu object. The menu bar, as
    shown in Figure 10-1, has two Menu objects: one for the Game menu and the other
    for the Options menu. A Menu object contains a collection of MenuItem objects
    that display when the user clicks the menu.

    - MenuItem: Menu items are represented by the MenuItem class or one of its subclasses.
    The Game menu shown in Figure 10-1 has four MenuItem objects: New Game, Pause
    Game, Quit Game, and Exit. It also includes one SeparatorMenuItem object; SeparatorMenuItem
    is a subclass of the MenuItem class.'
