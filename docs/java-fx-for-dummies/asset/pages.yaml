    # Handling Events


    Now that you know the basic classes and interfaces that are used for event handling,
    you''re ready to figure out how to wire them to create a program that responds
    to events.


    In this section, I discuss how to implement the event handler by coding the program''s
    Application so that in addition to extending the Application class, it also implements
    the EventHandler interface. In subsequent sections of this chapter, I discuss
    alternative techniques to implement event handlers that are more concise and,
    in many cases, easier to work with.


    Note that the programs that were shown in Chapters 1 and 2 use the concise Lambda
    expression, and most of the programs featured throughout the rest of this book
    also use Lambda expressions. It''s important that you know the other techniques
    so you have a complete understanding of how event handling actually works.


    Here are three steps you must take to handle a JavaFX event:


    +   1. Create an event source.


    An event source is simply a control, such as a button, that can generate events.
    Usually, you declare the variable that refers to the event source as a private
    class, outside the start method or any other class methods:


    ```

    private Button btn;

    ```


    Then, in the start method, you can create the button like this:


    ```

    btn = new Button();

    btn.setText("Click me please!");

    ```


    +   2. Create an event handler.


    To create an event handler, you must create an object that implements the EventHandler
    interface and provides an implementation of the handle method.


    Here are four ways to create an event handler:


    +   * Add implements EventHandler to the program''s Application class and provide
    an implementation of the handle method.


    You figure out how to use this technique in the section

    "Implementing the EventHandler Interface.



    +   * Create an inner class that implements EventHandler within the Application
    class.'
