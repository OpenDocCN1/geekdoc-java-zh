    | void setMaxWidth(double width) | Sets the maximum width for the field |

    | void setMinWidth(double width) | Sets the minimum width for the field |

    | void setPrefColumnCount(int cols) | Sets the preferred size of the text field
    in columns (that is, the number of average-width text characters) |

    | void setPrefWidth(double width) | Sets the preferred width for the field |

    | void setPromptText(String prompt) | Sets the field''s prompt value. The prompt
