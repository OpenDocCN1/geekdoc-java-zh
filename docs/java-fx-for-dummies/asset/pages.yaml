  md: '# # Chapter 6


    # # Getting Input from the User


    **In This Chapter**


    +   - Working with text fields and areas

    - Validating numeric data and creating check boxes

    - Setting radio buttons

    - Using some of these components in a complete program


    In the first five chapters of this book, I discuss how to create JavaFX programs
    using only two basic JavaFX input controls: labels and buttons. If all you want
    to write programs that display text when the user clicks a button, you can put
    the button down now. But if you want to write programs that actually do something
    worthwhile, you need to use other JavaFX input controls.


    In this chapter, you find out how to use some of the most common JavaFX controls.
    First, you read about the label and controls that get information from the user.
    You find out more details about the text field control, which gets a line of text,
    and the text area control, which gets multiple lines. Then I move on to two input
    controls that get either/or information from the user: radio buttons and check
    boxes.


    Along the way, you discover an important aspect of any JavaFX program that collects
    input data from the user: data validation. Data validation routines are essential
    to ensure that the user doesn''t enter bogus data. For example, you can use data
    validation to ensure that the user enters data into required fields or that the
    data the user enters into a numeric field is indeed a valid number.'
