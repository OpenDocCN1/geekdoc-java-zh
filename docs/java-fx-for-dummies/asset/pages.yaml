    # The Control Class


    The ultimate purpose of this chapter is to give you an overview of the features
    that are common to all JavaFX controls by virtue of the fact that all controls
    inherit the Control class. Now that you''ve finally made it to a discussion of
    the Control class itself, brace yourself for a little disappointment: The Control
    class itself is not all that interesting. As Table 7-4 reveals, there are really
    three methods of interest. It turns out that most of the features that are common
    to all controls are actually provided by the Region, Parent, and Node controls.


    | Table 7-4 Methods of the Control Class |

    | Method | Explanation |

    | void setTooltip(Tooltip value) | Sets a tooltip for the control. |

    | void setContextMenu(Contextmenu value) | Sets a context menu for the control.
    For more information, see Chapter 10. |

    | void setSkin(Skin value) | Sets a skin for the control. For more information,
    see Chapter 12. |


    The Control adds three main features to the Region class: the ability to add tooltips,
    context menus, and CSS skins. You can read about context menus in Chapter 10,
    and see how CSS skins works in Chapter 12. So for now, I just look at tooltips.


    A tooltip is a pop-up balloon that provides an explanation of a function. Creating
    a tooltip couldn''t be easier: You call the Tooltip constructor, passing the text
    of the tooltip as an argument, and then assign the tooltip to a control by calling
    the control''s setTooltip method. Here''s an example:


    ```

    btnSave.setTooltip(new Tooltip("Saves the file"));

    ```'
