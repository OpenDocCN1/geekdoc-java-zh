  md: "# Part II: JavaFX Controls\n\n# Creating Menus That Change\n\nIn many applications,\
    \ menu items change as you work with the program. Some items may be disabled in\
    \ certain situations, and the text of a menu item may change depending on the\
    \ context in which the command could be used.\n\nFor example, you may want the\
    \ Pause Game menu item in the Game menu to change to Resume Game when the user\
    \ pauses the game. If the user resumes the game, this menu item reverts to Pause\
    \ Game. You could do that in several ways. It is easiest to just look at the text\
    \ in the menu item. If the text is _Pause Game, change it to _Resume Game; change\
    \ it to _Pause Game. Here's a snippet of code that does the job:\n\n```\nif (menuPauseGame.getText().equals(\"\
    _Pause Game\")) {\n    menuPauseGame.setText(\"_Resume Game\");\n}\nelse {\n \
    \   menuPauseGame.setText(\"_Pause Game\");\n}\n```\n\nIn a real program, of course,\
    \ this code also pauses and resumes the game.\n\nEnabling or disabling menu items\
    \ depending on what's happening in the program is also common. Suppose that you\
    \ don't want to allow users to quit the game while the game is paused. In that\
    \ case, disable the Quit Game menu item when the user chooses Pause Game and enable\
    \ it if the user chooses Resume Game, like this:\n\n```\nif (menuPauseGame.getText().equals(\"\
    _Pause Game\")) {\n    menuPauseGame.setText(\"_Resume Game\");\n    menuQuitGame.setDisable(true);\n\
    }\nelse {\n    menuPauseGame.setText(\"_Pause Game\");\n    menuQuitGame.setDisable(false);\n\
    }\n```"
