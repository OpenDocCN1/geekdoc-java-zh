    After you create a Movie object, you must add it to an ObservableList that can
    be used as the items list for a TableView. The easiest way is to first create
    the TableView and use its getItems methods to access the observable list:


    ```

    TableView<Movie> table = new TableView<Movie>();

    table.getItems().add(m);

    ```


    Note that TableView is a generic class, so specify the data type when you create
    it.


    In a real-life project, the data displayed by a table will almost certainly come
    from a file or a database. Thus, you need to write Java code to read the data
    from the file or database, create an object for each record, and add that record
    to the list. You probably need to isolate this code into a separate method with
    a name such as loadData. Then, you can pass the observable list as a parameter.


    Reading from a file or database is beyond the scope of this book, but if you want
    to figure out how to do it, I you pick up a copy of my book, Java All-One For
    Dummies, 4th Edition (John Wiley & Sons). That book contains sample programs that
    read and write this data to various types of files and databases.


