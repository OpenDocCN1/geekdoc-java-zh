  md: '# Chapter 13: Drawing Shapes


    # # Fancy Fills


    If you''ve followed along so far, you''ve already seen that you can fill a shape
    with a solid color by calling the shape''s setFill method and specifying a Color,
    as in this example:


    ```

    Rectangle r1 = new Rectangle(0, 0, 100, 100);

    r1.setFill(Color.RED);

    ```


    Here the rectangle is filled with the color red.


    You''ve also already seen that you can create a transparent object by setting
    the fill color to null. The ShapeMaker program shown in Listing 13-1 used null
    fills so that the gridlines would show the shapes.


    There''s more to filling than solid colors, however. In the following sections,
    you will find out how to create fills that are partially transparent and fills
    that graduate from one color to another.


    # # Drawing transparently


    JavaFX lets you create transparent rectangles by setting an opacity value for
    the color. An opacity value of 1.0 indicates that the color is completely opaque,
    whereas a value of 0.0 means the color is completely transparent. To create a
    transparent color, you set the opacity value between 0.0 and 1.0.


    There are several ways to do that, but the easiest is to use one of the static
    methods of the Color class to create a color from its constituent parts. For your
    purposes here, use the rgb method, which accepts four parameters: three integers
    representing the red, green, and blue components of the color (values can be 0
    to 255), and a double that represents the opacity.


    For example, to create a 50% transparent black, you''d use the rgb method, like
    this:


    ```

    Color.rgb(0, 0, 0, 0.5);

    ```


    To create a 20% transparent red, use this:


    ```

    Color.rgb(255, 0, 0, 0.2);

    ```


    Figure 13-2 shows a scene with three rectangles, two of which have transparency
    applied. The following snippet shows the code used to create three rectangles:'
  merge: -1
