  md: 'The following paragraphs give a brief explanation of the key elements of the
    Click Me program:


    +   - As with any other Java program, JavaFX programs begin with a slew of import
    statements that reference the various packages that will be used by the program.


    For this example, five packages are imported. Most JavaFX programs will require
    these five packages as well as additional packages that provide more advanced
    features.


    +   - All JavaFX programs extend a core class named Application, which provides
    the basic functionality of the program. When you extend the Application class,
    you must override a start method; JavaFX calls this method when the application
    starts.


    +   - Like any program, a JavaFX program must have a main method. In a Java program,
    the main method simply calls the launch method of the Application class, which
    in turn launches the application and calls the start method.


    The interface elements of a JavaFX program are arranged in a hierarchy. At the
    highest level is a stage, which represents a window. Within the stage is a scene,
    which contains user interface controls. The controls themselves (such as buttons,
    labels, drop-down lists, and so on) are usually contained in one or more layout
    panes that govern the positional layout of the controls.


    If you study the code in the start method, you will see that these elements are
    built from the bottom up:


    +   - A button is created.


    +   - The button is added to a layout pane (specifically, a StackPane, which is
    one of several types of layout panes available).


    +   - The layout pane is added to a scene and the scene is added to the stage.


    +   - The stage''s show method is called to display the application''s GUI (Graphical
    User Interface).


    The handleClick is called whenever the user clicks the button. This method examines
    the current text displayed by the button and changes the text accordingly. Thus,
    each time the user clicks the button, the button''s text changes from Click please!
    to You clicked me! or vice-versa.'
