  md: '# Part V: The Part of Tens


    # Step Eight: Add a Mesh Object


    The three objects you''ve added to your virtual world so far have been created
    using the three built-in 3D shape classes that come with JavaFX: Cylinder, Box,
    and Sphere. For more complex objects, you must use the TriangleMesh class to create
    the object based on a connected series of triangles.


    In this step, I create one of the simplest of all mesh objects: the four-sided
    pyramid pictured in Figure 20-7. Visually, a four-sided pyramid has five faces:
    the four triangular sides and the square base. But in a JavaFX mesh, squares are
    not allowed, only triangles. So the pyramid actually consists of six faces: the
    four triangular sides and two adjacent angles that make up the face.


    This section presents probably the most conceptually difficult information in
    this entire book. If you haven''t studied meshes in a Computer Graphics class,
    be prepared to read through the paragraphs several times before it starts to make
    sense. If it still doesn''t make sense, grab a latte, pull out a sheet of graph
    paper, and start doodling. Drawing the pyramid with your own hand will help your
    understanding. I recommend you use a pencil.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_407_0.png)


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_407_1.png)


    To get the pyramid started, call the TriangleMesh constructor like this:


    ```

    TriangleMesh pyramidMesh = new TriangleMesh();

    ```


    To complete the pyramid, you need to populate three collections that define the
    geometry of the mesh. These collections hold the points, the faces, and the texture
    coordinates that define the shape.'
