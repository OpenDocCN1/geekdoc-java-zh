    # Creating Submenus


    A submenu is a menu within a menu. Submenus are possible because the Menu class
    is itself a subclass of the MenuItem class, which means that any item in a menu
    can be another menu. When the user clicks a submenu, the submenu opens to reveal
    its menu items. Submenus can be created within submenus, as many levels deep as
    you wish. But few menus are nested more than two or three levels deep.


    The following example creates a version of the Options menu that isolates the
    three choices into a separate submenu named Difficulty:


    ```

    // Create the check menu items

    CheckMenuItemSound = =

    new MenuItem("*Sound");

    CheckMenuItemMusic = =

    new MenuItem("*Music");


    // Create the radio menu items

    RadioMenuItemEasy = =

    new RadioMenuItem("*Easy");

    RadioMenuItemMedium = =

    new RadioMenuItem("*Medium");

    RadioMenuItemHard = =

    new RadioMenuItem("*Hard");

    ToggleGroup groupDifficulty = new ToggleGroup();

    menuEasy.setToggleGroup(groupDifficulty);

    menuMedium.setToggleGroup(groupDifficulty);

    menuHard.setToggleGroup(groupDifficulty);


    // Create the Difficulty submenu

    menuDifficulty = new Menu("*Difficulty");

    menuDifficulty.getItems().add(menuEasy);

    menuDifficulty.getItems().add(menuMedium);

    menuDifficulty.getItems().add(menuHard);


    // Create the Options menu

    menuOptions = new Menu("*Options");

    menuOptions.getItems().add(menuSound);

    menuOptions.getItems().add(menuMusic);

    menuOptions.getItems().add(menuDifficulty);

    ```'
