  md: '# Chapter 3


    # Handling Events


    In This Chapter


    +   - Understanding important event concepts

    - Working with event-handling classes and interfaces

    - Extending the EventHandler interface

    - Using inner and anonymous classes for event handling

    - Using Lambda expressions for event handling


    In Chapter 2, I discuss two programs that display simple scenes that include a
    button and respond when the user clicks the button. These programs respond to
    the event triggered when the user clicks the button by providing an event handler
    that is executed when the event occurs.


    In this chapter, you read more details about how event handling works in JavaFX,
    I discuss how events are generated and how they''re dispatched by JavaFX so that
    your programs can respond to them. You discover the many varieties of events that
    can be processed by a JavaFX program. And you find several programming techniques
    for handling JavaFX events.


    Finally, in this chapter you''re introduced to the idea of property bindings,
    which let you write code that responds to changes in the value of certain types
    of class fields, dubbed property fields. In JavaFX, property bindings are sometimes
    used in situations that wouldve called for an event handler in Swing.


    Although event handling is used mostly to respond to button clicks, it can also
    be used to respond to other types of user interactions. You can use event handling,
    for example, to write code that is executed when the user makes a selection from
    a combo box, moves the mouse over a label, or presses a key on the keyboard. The
    event-handling techniques in this chapter work for those events as well.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_58_0.png)'
