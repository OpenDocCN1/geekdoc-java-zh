  md: '# Using Text Fields


    A text field is a box into which the user can type a single text. You create text
    fields by using the TextField class. Table 6-1 shows some of the more interesting
    and useful constructors and methods of this class.


    | Constructor | Description |

    |---|---|n| TextField() | Creates a new text field |

