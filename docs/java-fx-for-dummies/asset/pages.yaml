  md: '# 248 Part III: Enhancing Your Scenic Design


    To use column constraints to set a fixed width for each column in a grid pane,
    first create a constraint for each column. Then, add the constraints to the grid
    pane''s collection. Here''s an example:


    ```

    ColumnConstraints col1 = new ColumnConstraints(200);

    ColumnConstraints col2 = new ColumnConstraints(200);

    ColumnConstraints col3 = new ColumnConstraints(200);

    GridPane grid = new GridPane();

    grid.getColumnConstraints().addAll(col1, col2, col3);

    ```


    One of the most useful features of column constraints is their ability to distribute
    the width of a grid pane''s columns as a percentage of the overall width of the
    grid pane. For example, suppose the grid pane will consist of three columns and
    you want all of them to be the same width regardless of this: The following code
    accomplishes this:


    ```

    ColumnConstraints col1 = new ColumnConstraints();

    col1.setPercentWidth(33);

    ColumnConstraints col2 = new ColumnConstraints();

    col2.setPercentWidth(33);

    ColumnConstraints col3 = new ColumnConstraints();

    col3.setPercentWidth(33);

    GridPane grid = new GridPane();

    grid.getColumnConstraints().addAll(col1, col2, col3);

    ```


    In this example, each column will fill 33 percent of the grid.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_257_0.png)


    Several of the attributes that can be set with column or row constraints mirror
    attributes you can set for individual nodes via the GridPane class. For example,
    you can set the horizontal alignment of an individual node by calling the setAlignment
    method on the grid pane. Or, you can set the horizontal alignment of an entire
    column by creating a column constraint, setting its horizontal alignment, and
    then applying the column constraint to a column in the grid pane.


