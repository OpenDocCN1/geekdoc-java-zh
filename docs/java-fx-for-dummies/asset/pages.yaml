    Then, the user can''t change the size of the window. (By default, the stage is
    resizable. Thus, you don''t need to call the setResizable method unless you want
    to make the stage non-resizable.)


    +   If the stage is resizable, you can set the minimum and maximum size for the
    window. For example:


    ```

    primaryStage.setResizable(true);

    primaryStage.setMinWidth(200);

    primaryStage.setMinHeight(200);

    primaryStage.setMaxWidth(600);

    primaryStage.setMaxHeight(600);

    ```


    In this example, the user can resize the window, but the smallest allowable size
    is 200-200 pixels and the largest allowable size is 600-600 pixels.


    +   If you want to display the stage in a maximized window, call setMaxized:


    ```

    primaryStage.setMaximized(true);

    ```


    A maximized window still has the usual decorations (a title bar, window borders,
    and Minimize, Restore, and Close buttons). If you want the stage to completely
    take over the screen with no such decorations, use the fullscreen method instead:


    ```

    primaryStage.setFullScreen(true);

    ```


    When you enter fullscreen mode, JavaFX displays a message advising the user on
    how to exit fullscreen mode.


    +   If, for some reason, you want to start your program minimized to an icon,
    use the setIconified method:


    ```

    primaryStage.setIconified(true);

    ```


    +   For more information about the close method, see the section "Exit, Stage"
    later in this chapter.


    The initModality and init methods are interesting because they can be called only
    before you call the show method. The initModality allows you to create a modal
    dialog box—that is, window that must be closed before the user can continue using
    other functions within the program. And the init method you create windows that
    do not have the usual decorations such as a title bar or Minimize, Restore, and
    Close buttons. You typically use these methods when you need to create additional
    stages for your application beyond the primary stage. You can read more about
    how that works later in this chapter, in the section "Creating a Dialog Box."


