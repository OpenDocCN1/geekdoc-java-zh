    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_178_0.png)


    List views and combo boxes have several important differences:


    +   - A list view doesn''t have a text field that lets the user edit the selected
    item. Instead, the user must select items directly from the list view.

    - The list view doesn''t drop down. Instead, the list items display in a box size
    you can specify.

    - The items in a list view can be arranged vertically (the default) or horizontally.
    Figure 8-4 shows a horizontal list box.

    - List views allow users to select more than one item. By default, a list view
    lets select just one item, but you can easily configure it to allow for multiple
    selections.


    To select multiple items in a list, hold down the Ctrl key and click the items
    you want to select. To select a range of items, click the first item, hold down
    the Shift key, and click the last item.


