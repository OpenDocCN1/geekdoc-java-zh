  md: '# Chapter 9: Working with Tables


    It''s as simple as that. After the cell factory is set up, the cell will turn
    into a text field whenever the user clicks it. The user can then edit the data
    in the text field. When the user presses Enter or Tab or clicks outside the field,
    the text field is replaced once again with a simple text object.


    The only problem remaining is that although the cell factory allows the user edit
    the contents of a cell via the text field, the cell factory does not automatically
    update the table''s items collection to reflect any changes the user might make
    when editing the cell. To do that, you must set up an action listener that responds
    when the user finishes editing the cell. Then, in that listener, you can update
    the items collection.


    Here is how you use a Lambda expression to set up a listener for the onEditCommit
    event:


    ```

    colTitle.setOnEditCommit(

    e -> colTitle_OnEditCommit(e));

    ```


    In this example, the method colTitle_OnEditCommit will be called whenever the
    user finishes editing the contents of a cell in the Table column.


    Writing the event handler for the OnEditCommit event is a little tricky. The OnEditCommit
    event generates an object of type CellEditEvent, which contains important information
    you need to access in the event handler. Table 9-4 lists the methods of this class.


    | Method | Description |

    | --- | --- |

    | T getCellValue() | Gets the new value entered by the user. |

    | T getOldValue() | Gets the previous value of the cell. |

    | S getRowValue() | Gets the data object for the row edited by the user. |

    | TableColumn<S, T> TableColumn(T) | Gets the table column on which this event
    occurred. |

    | TableView<S> TableView(ObservableList list) | Creates a new table view using
    the specified list as its items list. |'
