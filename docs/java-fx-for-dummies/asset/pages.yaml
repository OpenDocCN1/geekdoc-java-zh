    # # Using Lambda Expressions to Handle Events


    Java 8 introduces a new feature that in some ways is similar to anonymous classes,
    but with more concise syntax. Specifically, a Lambda expression lets you create
    an anonymous class that implements a specific type of interface — a functional
    interface — which has one and only one abstract method.'
