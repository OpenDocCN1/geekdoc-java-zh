  md: '# Perusing the Possibilities of JavaFX


    One of the basic strengths of JavaFX is its ability to let you easily create complicated
    graphical user interfaces with all the classic user interface gizmos every-knows
    and loves. Thus, JavaFX provides a full range of controls — dozens of them in
    fact, including the classics such as buttons, labels, text boxes, checkboxes,
    drop-down lists, and well as more exotic controls such as tabbed panes and accordion
    panes. Figure 1-1 shows a typical JavaFX interface that uses several of these
    control types to create a form for data entry.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_20_0.png)


    **Figure 1-1:** A typical JavaFX program.


    Truly, the data-entry form shown in Figure 1-1 isn''t very remarkable. In fact,
    you can easily create data-entry forms like this using Swing with the same amount
    of effort. The real advantages of using JavaFX over Swing don''t become apparent
    until you start using some of the more advanced JavaFX features.


    For starters, consider the general appearance of the data-entry form in Figure
    1-1. The appearance of the buttons, labels, text fields, radio buttons, and check
    boxes are a bit dated. The visual differences between the dialog box in Figure
    1-1 and once you''ve created in Visual Basic on a Windows 95 computer 20 years
    ago are minor.


    Where JavaFX begins to shine is in its ability to easily allow you to improve
    the appearance of your user interface by using Cascading Style Sheets (CSS). CSS
    makes it easy to customize many aspects of the appearance of your user'
  merge: -1
