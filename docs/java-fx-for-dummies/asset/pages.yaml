  md: '# Part II: JavaFX Controls


    # Ten Different Kinds of Nodes


    In all, ten different classes directly inherit the Node class, creating ten distinct
    inheritance branches Node. The only one of these I discuss in the chapters that
    make up part of the book is the Parent class because all JavaFX controls and layouts
    are derived from the Parent class. However, to give you general idea of what other
    types of objects can be added to a scene graph, the following paragraphs provide
    a brief summary of each of the subclasses of Node.


    +   - LightBase: An abstract class that serves as the base class for lighting
    sources that illuminate a scene rendered by a camera.

    - Like a camera, a light source is node so that you can position it at a specific
    location within a scene to create realistic effects.

    - Media: Represents a media viewer that can play media, such as sound or video.

    - Parent: A node that can contain child nodes. All controls and layouts inherit
    the Parent class.

    - Shape: A two-dimensional shape such as a rectangle or circle.

    - Text also inherits the Shape class, providing an easy way to display text within
    a scene.

    - Shape3D: A three-dimensional shape such as a box, cylinder, or sphere.

    - Subscene: Marks a branch of a scene that can be rendered with its own camera.

    - SwingNode: Allows you to incorporate Swing objects into a JavaFX scene graph.


    +   - Camera: An object that''s used to graphically render a three-dimensional
    screen on a flat display.


    A camera is a node in scene graphs that represent 3D layout, the camera can be
    positioned at a specific location within that layout, rendering the flat image
    of the 3D layout from a specific perspective.


    +   - Canvas: A node that you can draw on using commands, much like an artist
    can draw on a canvas to create a painting.


    A canvas is a two-dimensional object that has a height and a width.


    +   - ImageView: Represents an image viewer, used to display a two-dimensional
    image.


    # The Region Class


    Next in the Node class hierarchy is the Region class. Region is the last common
    ancestor class shared by both the Control and the Pane class. Thus, the Region
    class is the last class from which controls and layout panes share common features.'
