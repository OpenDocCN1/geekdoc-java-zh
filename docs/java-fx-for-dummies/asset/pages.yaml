  md: "# Chapter 4: Setting the Stage and Scene Layout\n\n# # Creating a Close button\n\
    \nTo add a button or other user-interface element that allows the user to close\
    \ the button, all you have to do is provide an action event handler that calls\
    \ the stage's close method.\n\nFor example, suppose you create a Close button\
    \ using the following code:\n\n```\nButton btnClose = new Button();\nbtnClose.setText(\"\
    Close\");\nbtnClose.setOnAction( e -> primaryStage.close());\n```\n\nIn this case,\
    \ the action event handler simply calls primaryStage.close() to close the application.\n\
    \nIf you want to more simply call the close method in the action event handler,\
    \ you might want to isolate the event handler in a separate method, as in this\
    \ example:\n\n```\nbtnClose.setOnAction( e -> btnClose_Clicked());\n```\n\nBecause\
    \ the btnClose_Clicked method will need to access the primary stage to close it,\
    \ you need to define a class field of type Stage and use it to reference the primary\
    \ stage. Then, your btnClose_Clicked method can easily perform additional tasks.\
    \ For example:\n\n```\nprivate void btnClose_Clicked() {\n    boolean realQuit\
    \ = false;\n    realQuit = ConfirmationBox.show(\n        \"Are you sure you want\
    \ to quit?\",\n        \"Confirmation\",\n        \"Yes\", \"No\\n    );\n   \
    \ if (realQuit) {\n        // Perform cleanup tasks here\n        // such as saving\
    \ files or freeing resources\n        stage.close();\n    }\n}\n```\n\nIn this\
    \ example, a confirmation box is displayed to make sure the user really wants\
    \ to exit the program."
