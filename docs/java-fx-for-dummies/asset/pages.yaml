    \nThis event handler calls the consume method to discard the event. This is important\
    \ when dealing with gestures. If you don't consume the event, the event will be\
    \ passed up the chain and may be processed by other objects.\n\nOne other detail\
    \ you should know is that gesture events have a characteristic known as inertia,\
    \ which gestures continue to be raised as the user completes a scroll gesture,\
    \ the SCROLL_FINISHED event occurs, but several SCROLL events are generated after\
    \ the SCROLL_FINISHED event. This creates a more realistic experience for the\
    \ user, but can complicate your programming.\n\nYou can call the gesture's isInertia\
    \ method to determine whether an event was created as a result of inertia. Then\
    \ if you want to suppress the effect of inertia, you can ignore the event if isInertia\
    \ returns true. For example:\n\n```\nRectangle r = new Rectangle(150, 150, 200,\
    \ 200);\nr.setFill(Color.DARKGRAY);\nr.setOnRotate(e ->\n{\n    if (!isInertia())\n\
    {\n        r.setRotate(r.getRotate() + e.getAngle());\n        e.consume();\n\
    \    }\n});\n```\n\nHere, the rectangle is rotated only if the event is not generated\
    \ as a result of inertia."
