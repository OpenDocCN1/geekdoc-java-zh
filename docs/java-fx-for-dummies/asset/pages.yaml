  md: "# Chapter 2: Looking Closer at JavaFX Programming\n\nHere, the Click Me application\
    \ is defined by a class named ClickMe, which extends the Application class.\n\n\
    Because the entire javafx.application package is imported in line 1 of the Click\
    \ Me program, the Application class does not have to be fully qualified. If you\
    \ omit the import statement for the javafx.application package, the ClickMe class\
    \ declaration would have to like this:\n\n```\npublic class ClickMe\n    extends\
    \ javafx.application.Application\n```\n\nThe Application class is responsible\
    \ for managing what is called the lifecycle of a JavaFX application. The lifecycle\
    \ consists of the following steps:\n\n+   1. Create an instance of\n\n+   2. Call\
    \ the init method.\n\nThe default implementation of the init method does nothing,\
    \ but you can override the init method to provide any processing you want to be\
    \ performed before the application's user interface displays.\n\n+   3. Call the\
    \ start method.\n\nThe start method is an abstract method, which means that there\
    \ is no default implementation provided as part of the Application class. Therefore,\
    \ you must provide your own version of the start method. The start method is responsible\
    \ for building and displaying the user interface. (For more information, see the\
    \ section \"Overriding the start Method\" later in this chapter).\n\n+   4. Wait\
    \ for the application to end, which typically happens when the user signals the\
    \ end of the program by closing the main application window or choosing the program's\
    \ exit command\n\\During this time, the application isn't really idle. Instead,\
    \ it's busy performing-actions in response to user events, such as clicking a\
    \ button or choosing an item from a drop-down list.\n\n+   5. Call the stop method.\n\
    \nLike the init method, the default implementation of the stop method doesn't\
    \ do anything, but you can override it to perform any processing necessary as\
    \ the program terminates, such as closing database resources or saving files."
