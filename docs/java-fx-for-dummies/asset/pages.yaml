    Notice in both cases that the T type specifies the wrapper Integer and Double
    classes rather than the native int and double types.


    # Using the TableView class


    After you create the table columns, the next step is to create a table and add
    the columns to the table. To do that, use the TableView class, which discuss in
    Table 9-3.


    Creating a table view control requires several steps, which do not necessarily
    have to be in this order:


    +   - Call the TableView constructor to create the table view control.

    - Add the table columns to the table view.

    - The easiest way to do that is to call the getColumns method, which returns the
    list of columns as an observable list. Then, use the addAll method to add the
    columns.

    - Add data to the items list.


    I discuss several ways to do that in the earlier section "Creating the Data for
    a Table."'
