    # # Combining Effects


    By now, you''ll agree that JavaFX special effects can have a major impact on the
    appearance of your scenes. But wait, there''s more! JavaFX lets you improve the
    appearance of your scenes even more by allowing you to combine special effects,
    essentially layering one effect atop


    To combine effects, you use the setInput method, which is available for all the
    effects I cover in this chapter. Simply put, you create an instance of an effect
    class, create an instance of a second effect class, and chain the first to the
    second by calling the first effect''s setInput method and specifying the second
    effect as the input.


    For example, suppose you want to combine a reflection with a shadow and then apply
    the combined effect to a rectangle.


    ```

    Rectangle rect = new Rectangle(100,100);

    DropShadow shadow = new DropShadow();

    Reflection reflect = new Reflection(reflect);

    rect.setEffect(shadow);

    rect.setEffect(reflect);

    ```


