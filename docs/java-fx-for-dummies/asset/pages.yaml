    And here''s the code for the Price column:


    ```

    TableColumn<Movie, Double> colPrice =

    tableColumn("Price")

    colPrice.setMinWidth(100)

    colPrice.setCellValueFactory(

    PropertyValueFactory<Movie, Double>("Price"));

