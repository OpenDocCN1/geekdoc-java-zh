    ```

    Rectangle r1 = new Rectangle(0,75,350,40);

    r1.stroke(Color.BLACK);

    r1.fill(Color.rgb(200,200,200,1.0));

    r1.strokeWidth(3);


    Rectangle r2 = new Rectangle(50,5,100,200);

    r2.stroke(Color.BLACK);

    r2.fill(Color.rgb(200, 200, 200, 0.5));

    r2.strokeWidth(3);


    Rectangle r3 = new Rectangle(200,5,100,200);

    r3.stroke(Color.BLACK);

    r3.fill(Color.rgb(200,200,200, 0.5));

    r3.strokeWidth(3);

    ```


    As you can see, all three of these rectangles specify a shade of gray using the
    values 200, 200, and 200 for the red, green, and blue color components. The first
    rectangle specifies 1.0 for the opacity; the other two specify 0.5 for the opacity.
    As a result, you can see the first rectangle behind the other two rectangles.


    ![](img/0a30bdfcbc78f5a98df16eea42b42e83_287_0.png)


    # Using a gradient fill


    Instead of a solid color, you can specify a gradient fill, which blends colors
    evenly across the shape. JavaFX provides two classes for working with gradients:
    LinearGradient and RadialGradient.


    A linear gradient is created from two color points. Imagine a line drawn between
    these two points. The gradient fills the color of the gradient smoothly from the
    color that''s set at the first point to the color set at the second point. Then
    it extends the colors on this line at 90-degree angles to the line to fill an
    entire area.'
