  md: '# Figure 12-2. Producer/Consumer system


    The system might end up in a pickle when the producer is faster than the consumer.
    So the extra data that cannot be processed must be dealt with. There is more than
    one way of doing that.


    +   - The extra data is discarded (this is done in network hardware).

    - The producer is blocked so the consumer has time to catch up.


    +   - The data is buffered, but buffers are limited and if we have a fast producer
    and a slow consumer there is a danger of the buffer overflowing.


    +   - By applying back pressure, which involves giving the consumer the power
    to regulate the producer and control how much data is produced. Back pressure
    can be viewed as a message being sent from the consumer to the producer to let
    it know it has to slow its data production rate. With this in mind, we can complete
    the design in Figure 12-2, which'
  merge: -1
  pgno: 1058
- img_proc: true
  md: 'results in Figure 12-3.


    ![](img/3ecf5d275c4cb034e7ac69a9ec8c5278_1059_0.png)


    **Figure 12-3.** Reactive Producer/Consumer system


    If producer, processors, and consumer are not synchronized, solving the problem
    of too much data by blocking until each one is ready to process it is not an option,
    as it would transform the system into a synchronous one. Discarding it is not
    an option either, and buffering is, well, unpredictable, so all we’re left with
    for a reactive system is applying **non-blocking back-pressure.**


