  md: 'releases resources properly? The finalize() method should be called only once
    by the JVM, but this cannot be guaranteed. Another downside is that finalize()
    calls, are not automatically chained, so an implementation of a finalize() method,
    must always explicitly call the finalize() method of the superclass. And another
    one for you: once finalize() called, there is no way to stop the method from executing
    or undo its effect, so you are basically left with a reference to an object that
    no longer has access to its resources. As you probably figured out by now, there
    is a lot of freedom given to the developer when it comes to implementing this
    method, and this means there is a lot of room for errors to happen.


    This is why the finalization mechanism in Java is flawed and was deprecated in
    JDK 9 to discourage its use. Improper finalize() implementations could lead to:
    memory leaks (memory contents are not discarded), deadlocks (resource is blocked
    by two processes) and hangs(process is in a waiting state it cannot go out of).
