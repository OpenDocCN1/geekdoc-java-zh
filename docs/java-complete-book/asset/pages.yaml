  md: 'Xmx followed by the amount of memory, (e.g., -Xmx8G allows the JVM to use a
    maximum of 8 GB of memory).


    +   * runtime.totalMemory() returns the total amount of memory of the JVM. The
    value returned by this method varies from machine to machine too and is implementationdependent,
    unless explicitly set by using the JVM option -Xms followed by the amount of memory
    (e.g., -Xms1G tells the JVM that is the initial size of its heap memory should
    be 1 GB of memory).


    +   * runtime.freeMemory() returns an approximation of the amount of free memory
    for the Java virtual machine.


