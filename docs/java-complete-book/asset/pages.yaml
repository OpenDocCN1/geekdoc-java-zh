    utilities years ago, and JVM languages like Scala, Clojure, and Groovy adopted
    it some time ago. But, better late than never is still acceptable.


    JShell is a Read-Eval-Print Loop (REPL), which evaluates declarations, statements,
    expressions as they are entered, and then it immediately shows the results. It
    is practical to try new ideas and techniques quickly without the need to have
    a complete development environment or an entire context for the code to be executed
    in.'
