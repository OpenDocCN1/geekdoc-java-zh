  md: 'The three classes are:


    +   * java.lang.ref.SoftReference<T>: objects referred by these type of references
    are cleared at the discretion of the garbage collector in response to memory demand.
    Soft references are most often used to implement memory-sensitive caches.


    +   * java.lang.ref.WeakReference<T>: objects referred by these type of references
    do not prevent their referents from being finalizable, finalized, and then reclaimed.
    Weak references are most often used to implement canonicalizing mappings. Canonicalizing
    mapping refers to containers where weak references can be kept in and and be accessed
    by other objects, but their link to the container, does not prevent them from
    being collected.


    +   * java.lang.ref.PhantomReference<T>: objects referred by this type of references
    are enqueued after the collector determines that their referents may otherwise
    be reclaimed. Phantom references are most often'
