  md: '# Compatibility Kit


    When building applications that use reactive streams a lot of things can go wrong.
    To make sure that you are building a proper reactive application, you can use
    the Reactive Streams Compatibility Kit project (also known as TCK) to write tests.
    This library contains classes that can test reactive implementations against the
    reactive streams specifications. TCK is intended to verify the interfaces contained
    in Java 9 (under java.util.concurrent.Flow.*) and for some reason the team that
    created TestNG as a testing library. The project sources are available on GitHub
    at https://github.com/reactive-streams/reactive-streams-jvm/tree/tckflow, which
    contains four classes that have to be implemented to provide their Flow.Publisher,
    Flow.Subscriber, Flow.Processor implementations for the test harness to validate.
    The four classes are'
  merge: -1
  pgno: 1086
- img_proc: true
  md: '+   • FlowPublisherVerification tests Publisher implementations.

    • FlowSubscriberWhiteboxVerification is used for whitebox testing Subscriber implementations
    and Subscription instances.

    • FlowSubscriberBlackboxVerification is used for blackbox testing Subscriber implementations
    and Subscription instances.

    • IdentityFlowProcessorVerification tests Processor implementations.


    To make the purpose of each test clear, the library test methods names follow
    this pattern: TYPE_spec####_DESC where TYPE is one of required, optional, stochastic,
    or untested, which refers to the importance of the rule being tested, the number
    signs in spec#### represent the rule number with the first one being 1 for Publisher
    instances and the DESC is a short explanation of the test purpose.


