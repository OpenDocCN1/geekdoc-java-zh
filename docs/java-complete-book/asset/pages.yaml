  md: '# Figure 13-3. Minor GC runs in the young generation space


    Minor GC collections happen until the old generation space is filled, which is
    when a major garbage collection(major GC run) is triggered. That deletes unreferenced
    objects, compacts the memory, and moves objects around so that the empty memory
    left is one big compact space. The minor garbage collection event is a stop the
    world event, this process basically takes over the run of the application and
    pauses its execution so it can free the memory. As the young generation space
    is small in size (as you see in the next section), the application pause is usually
    negligible. If no memory can be reclaimed from the young generation area after
    a minor GC run takes place, a major GC run is triggered.


    The permanent generation area is reserved for the JVM metadata such as classes
    and methods. This area is cleaned too from time to time to remove classes that
    are no longer used in the application. The cleanup of this'
  merge: -1
  pgno: 1116
- img_proc: true
  md: 'area is triggered when there is no more available memory left in the heap.


    The garbage collection process described to this paragraph is specific to generational
    garbage collectors, such as the G1GC; but before JDK 8, garbage collection was
    done using an older garbage collector that uses an algorithm **Concurrent Mark
    Sweep**. This type of garbage collector runs in parallel with the application
    marking used and unused zones of memory. Then it would delete unreferenced objects
    and would compact the memory into a contiguous zone by moving objects around.
    This process is inefficient and time consuming. Because as more and more objects
    were created, the garbage collection takes more and more time to be performed.
    But as most objects are short-lived, this is really a problem. So the CMS garbage
    collector was OK for a while.


    The G1GC has a similar approach, but after the mark phase is finished, G1 focuses
    on regions that are mostly empty to recover as much unused memory as possible.
    That is'
  merge: -1
  pgno: 1117
- img_proc: true
  md: 'why this garbage collector is also called garbage-first. G1 also uses a pause
    prediction model to decide how many memory regions can be processed based on the
    pause time set for the application. Objects from the processed region are copied
    to a single region of the heap, thus realizing a memory compaction at the same
    time. Also G1GC does not have a fixed size for the eden survivor spaces, it decides
    their size after every minor GC run.


    # How Many Garbage Collectors Are There?


    The Oracle HotSpot JVM provides the following types of garbage collectors:


    +   - serial collector: All garbage collection events are conducted serially in
    one thread. Memory compaction happens after each garbage collection.


    +   - parallel collector: Multiple threads are used for minor garbage collection.
    A single thread is used for a major garbage collection and Old Generation compaction.'
