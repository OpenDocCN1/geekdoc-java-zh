  md: '# Figure 1-4. What makes Java portable


    Java is what we call a high-level programming language that allows a developer
    to write programs that are independent of a particular type of computer. High-level
    languages are easier to read, write, and maintain. But their code must be translated
    by a compiler or interpreted into machine language (unreadable by humans binary
    because it is made up of numbers) to be executed, because that is the only language
    that computers understand.


    In Figure 1-4, notice that on top of the operating systems, a JVM is needed to
    execute a Java program. JVM stands for Java virtual machine, which is an abstract
    computing machine that enables a computer to run a Java program. It is a platform-independent
    execution environment that converts Java code into machine language and executes
    it.


    So, what is the difference between Java and other high-level languages? Well,
    other high-'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'level languages compile source code directly into machine code that is designed
    to run on a specific microprocessor architecture or operating system, such as
    Windows or UNIX. What JVM does, it is that mimics Java processor making it possible
    for a Java program to be interpreted as a sequence of actions or operating system
    calls on any processor regardless of the operating system.


    And because the Java compiler was mentioned, we have to get back to Java 1.1,
