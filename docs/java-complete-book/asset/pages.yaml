    # jconsole


    jconsole is JDK utility that can be used to inspect various JVM statistics. To
    use it, you have to start it from the command line and connect to a Java application
    that is already running. This application is quite useful, as it can connect to
    applications running on different machines also, as long as they are running in
    debug mode on a server and expose a port to connect to. To start a Java application
    in debug mode and expose a port'
  merge: -1
  pgno: 698
- img_proc: true
  md: 'for an external application, you have to start the application with the following
    VM parameters.


    - agentlib:jdwp=transport=dt_socket,server=y,s


    The port can be any port really as long as it is bigger than 1024, because those
    are restricted by the operating system. The transport=dt_socket instructs the
    JVM that the debugger connections is made through a socket, the address=1044 parameter
    informs it that the port number is 1044. The suspend=y instructs the JVM to suspend
    execution until a debugger is connected to it. To avoid that suspend=n should
    be used.


    For our simple example and considering we use jconsole to debug a Java application
    on the same machine, we do not need all that. We need to start jconsole from the
    command line and look in the Local Processes: section and identify the Java process
    we are interested in debugging. Figure 9-8 shows the first JConsole dialog window.'
