  md: 'generations.


    When an application is running, objects created by it are stored in the young
    generation area. When an object is created starts its life in a subdivision of
    this generation called the Eden space. When the Eden space is filled, this triggers
    a minor garbage collection(minor GC run) that cleans up this area of unrefereenced
    objects, and moves referenced objects to the first survivor space (S0). The next
    time the Eden space is filled, another minor GC run is triggered, which again
    deletes unreferenced objects, and referenced objects are moved to the next survivor
    space (S1). The objects in S0 have been there for a minor GC run, so their age
    is incremented and they are moved to S1, so S0 and the Eden can be cleaned up.
    At the next minor GC run, the operation is repeated again, but this time referenced
    objects are saved into the empty S0 and the older objects form S1, have their
    age incremented and moved here as well, so the S1 and Eden can be cleaned up.
    After the objects in survivor space reach a certain age,'
