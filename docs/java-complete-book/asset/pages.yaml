    # An Introduction to\Java and Its History


    Java is currently one of the most influential programming languages. It all started
    in 1990, when an American company that was leading the revolution in the computer
    industry decided to gather its best engineers together to design and develop a
    product that would allow them to become an important player in the new emerging
    Internet world. Among those engineers was James Gosling, a Canadian computer scientist
    who is recognized as the “father” of the Java programming language. It would take
    five years of design, programming, and one rename (from Oak to Java because of
    trademark issues), but finally in 1996, Java 1.0 was released for Linux, Solaris,
    Mac, and Windows.'
