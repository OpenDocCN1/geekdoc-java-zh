    # Summary


    After reading this chapter and running the provided code samples, it should be
    clear why the Stream API is so awesome. I like three things best: more compact
    and simple code can be written to solve problems without losing readability (ifs
    and loops can be avoided), parallel processing of data is possible without the
    boilerplate code required before Java 8 and the fact that code can be written
    in Functional Programming style. Also, the Stream API is a more declarative way
    of programming as most stream methods take arguments of type Consumer<T>, Predicate<T>,
    or Function<T>, which declare what should be done for each stream element,'
