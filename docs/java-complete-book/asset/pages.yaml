  md: 'The methods interfaces expose make up an API (application programming interface)
    when developing applications, the aim is to design applications and their components
    to have a stable API. This rule is described in the open closed principle, which
    is one of the five SOLID programming principles. This principle states that you
    should be able to extend a class without modifying it. Thus, modifying the interface
    a class implements, extends the class behavior, but only if the class is modified
    to provide a concrete implementation for the new methods. So, implementing interfaces,
