- img_proc: true
  md: 'Introduced in Java 9, the Java Shell tool (JShell) is an interactive tool for
    learning the Java programming language and prototyping Java code. This means that
    you can write Java code and execute it in the console, without the need to save
    it to a file, which is later compiled into bytecode and then interpreted by the
