  md: 'to bind XML schemas and Java representations, making it easy for Java developers
    to incorporate XML data and processing functions in Java applications. The operation
    to serialize an object to XML is named marshalling. The operation to deserialize
    an object form XML is called unmarshalling. For a class to be serializable to
    XML, it has to be decorated with JAXB-specific annotations.


    +   - @XmlElement(name = "...") is a top-level annotation that is placed at class
