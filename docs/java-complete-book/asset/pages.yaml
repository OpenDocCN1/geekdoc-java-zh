    to fit all objects created by the application the JVM has to allocate more memory,
    rebuilding the heap basically. So if this happens a few times during the application
    run, the overall time consumption is affected. The maximum size for the heap is
    very important, allocating too little might cause an application crash, allocating
    too much might hinder other programs from running. Deciding these values is usually
    done through repeated experiments and starting with JDK 11, the new Epsilon garbage
    collector comes in handy for this purpose.


