    **Gradle 5.x ** ** The sources attached to this book can be compiled and executed
    using the Gradle wrapper, which is a batch script on Windows and a shell script
    for other operating systems. When you start a Gradle build via the wrapper, Gradle
    automatically downloads and runs the build; thus you do not really need to install
    Gradle. Instructions on how to do this can be found by reading the public documentation
    at [www.gradle.org/docs/current/userguide/gradle](https://www.gradle.org/docs/current/userguide/gradle)


    A good practice is to keep code and build tools separate, and for the project
    attached to this book is the recommended way to go. If you decide to use Gradle
