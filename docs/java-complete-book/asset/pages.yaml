- img_proc: true
  md: 'When heap memory allocated to the JVM is depleted, the error has the following
    message: Exception in thread "main"

    java.lang.OutOfMemoryError: Java space

    But there is another message that you might see.

    Exception in thread "main"

    java.lang.OutOfMemoryError: GC Overhead Limit Exceeded


    This message is still related to the heap size. The error is thrown with this
    message when the data for the program barely fits the size of the heap, so the
    heap is almost full, which allows the GC to run, but because it cannot redeem
    any memory, the GC keeps running, and it is hindering the normal execution of
    the application. This message is added to the error when the GC spends 98% of
    execution time and the application spends the other 2%.


    These two are the most common error messages you see when GC cannot do its job
    properly for whatever reason. A complete list can be found at https://docs.oracle.com.'
