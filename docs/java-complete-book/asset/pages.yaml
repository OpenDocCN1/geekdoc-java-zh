    # Using Scanner


    The System.in variable is of type java.io.InputStream, which is a JDK special
    type extended by all classes representing an input stream of bytes. This means
    that System.in can be wrapped in any java.io.Reader extension so bytes can be
    read as readable data. But, the one that is really important is a class named
    Scanner from package java.util. An instance of this type can be created by calling
    its constructor and providing System.in as an argument. The Scanner class provides
    a lot of next..() methods that can be used to read almost any type from the console.
    In Figure 10-1, you can see the next..() methods list.'
