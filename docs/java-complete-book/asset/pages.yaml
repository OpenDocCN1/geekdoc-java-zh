    # CHAPTER 9


    # Debugging, Testing,

    and Documenting


    Development work does not only require you to write design the solution for a
    problem and write the code for it. To make sure your solution solves the problem,
    you have to test it. Testing involves making sure every component making up your
    solution behaves as expected in expected and unexpected situations.


    The most practical way to test code is to inspect values of intermediary variables
    by **logging** them; print them in the console only in specific situations.

    When a solution is complex, **debugging**'
  merge: -1
  pgno: 621
- img_proc: true
  md: 'provides the opportunity to pause the execution and inspect state of the variables.
    Debugging sometimes involves breakpoints and requires an IDE. Breakpoints are
    points where the application pauses its execution, and the inspection of variables
    can be performed.


    After making sure your solution fits the requirements, you have to document it,
    especially if the problem that is being solved is one that requires complex code
    to solve it. Or if your solution might be a prerequisite for other applications,
    it is your responsibility to explain other developers how to use it. This chapter
    covers a few ways to do all these, because these are key talents for a developer.


