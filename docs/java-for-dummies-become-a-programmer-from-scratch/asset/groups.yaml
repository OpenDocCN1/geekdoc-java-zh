    # 本书是关于什么的？


    这本书的编写是为了给想要学习编程语言并提高效率的人提供答案。你可以在没有任何任何编程基础的情况下从零开始。读完这本书后，你将具备成为一名合格程序员的技能，或者至少知道如何阅读和编写代码。之后，你将拥有学习更深层次内容所需的知识。在开始之前，你应该具备通用的计算机技能。在此之后，你将知道即使在看代码也不至于感到头晕脑胀。


    # 为什么要读这本书？


    你可以去网上寻找视频和教程来学习；然而，在顺序且在一个地方学习知识时，这存在一个明显的缺点。


    大多数 YouTube 或教程网站要么是浅尝带过一个主题，要么是以乌龟爬般的速度在特定主题上花费一个小时来磨洋洋工。在线内容通常很短，不会深入探讨任何特定话题。它们是不完整的，或者还处于进行中。你经常会发现自己要等几周才能等到另一个视频或教程。


    大多数 Java 教程都是散乱的、无序的且缺乏贯性的。要找到一个好的起点很难，要找到一个连续的列表让你对 Java 编程语言有清晰的理解更加困难。所以你知道，你会发现学习的过程是很有趣的。如果不是，你也会发现学习的过程很有趣的。


