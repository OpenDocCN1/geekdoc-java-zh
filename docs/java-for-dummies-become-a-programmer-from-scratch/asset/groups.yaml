    ![](img/81147dcafcee2d431dfe108a34b4c094_211_0.png)


    The answer is the primary twist in object-oriented programming:


    The compiler cannot make a function call in the traditional sense. The function
    call generated by a non-OOP compiler calls what is called early binding, a term
    you may not have heard before because you''ve never thought about any other way.
    It means the compiler generates a call to a specific function name, and the runtime
    system resolves this call to the absolute address of the code to be executed.
    In OOP, the program cannot determine the address of the code until run time, by
    some other scheme is necessary when a message is sent to a generic object.


    To solve the problem, object-oriented languages use the concept of late binding.
    When you send a message to an object, the code being called isn''t determined
    until run time. The compiler does ensure that the method exists and performs type
    checking on the arguments and return value, but it doesn''t know the exact code
    to execute.


    To perform late binding, Java uses a special bit of code in lieu of the absolute
    call. This code calculates the address of the method body, using information stored
    in the object (this process is covered in great detail in the Polymorphism chapter).
    Thus, each object can behave differently according to the contents of that special
    bit of code. When you send a message to an object, the object actually figure
    out what to do with that message.


    In some languages you must explicitly state that you want a method to have the
    flexibility of late binding properties (C++ uses the virtual keyword to do this).
