    \ like the following.\n\n```\npublic class Example\n{    public bool SomeBool;\n\
    }\n```\n\n# Equality Operators:\n\nEquality operators create boolean conditions.\
    \ There are many ways to set a boolean variable. For instance, comparisons between\
    \ values are a useful means to set variables. The most basic method to determine\
    \ equality is using the following operator: ==. There's a difference between use\
