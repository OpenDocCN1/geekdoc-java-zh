    - **O(2^n)：** 指数级增长！每增加一个新元素，算法花费的时间翻倍。1 个项目需要 1 秒，10 个项目需要 1024 秒，100 个项目需要 1267650600222940149673205376
    秒。


    # 大 O 表示法

    大 O 表示法是我们用来描述算法运行所需多久的语言。它是我们比较解决问题的不同方法之效率的标准。


    假设你有一个包含 10 个对象的列表，你想对它们进行排序。你拥有一堆算法可以实现这一目标，但并非所有算法都是平同的。有些算法比其他的快，但更重要的是，算法的速度取决于它处理的项数。大
    O 是衡量算法可扩展性的一种方法。大 O 指的是算法的复杂度。


    大 O 使用类似于 `O(n)` 的形式表示。这里的 `O` 仅仅表示我们在讨论大 O，你可以忽略它（至少在面试目的上如此）。`n` 是与之相关的复杂度；对于编程面试题，这几乎总是指集合的大小。复杂度会根据数据存储的大小而增加或减少。


    以下是大 O 复杂度按其相对于数据集的可扩展性排序的列表。


    - **O(1)/常数复杂度：** 恒定。这意味着无论数据集有多大，算法总是需要恒定的时间。1 个项目需要 1 秒，10 个项目需要 1 秒，100 个项目需要
    1 秒。它总是花费相同的时间。


    - **O(log n)/对数复杂度：** 不如常数复杂度好，但仍然非常好。时间随数据集的大小而增加，但是比例增加的。这意味着算法在较小数据集上的每个项目花费的时间。1
    个项目需要 1 秒，10 个项目需要 2 秒，100 个项目需要 3 秒。如果你的数据集有 10 个项目，每个项目会产生 0.2 秒的延迟。每个项目仅额外花费
    0.03 秒。这使得 `log n` 算法具有非常好的可扩展性。


    - **O(n)/线性复杂度：** 数据集越大，花费的时间成比例增加。1 个项目需要 1 秒，10 个项目需要 10 秒，100 个项目需要 100 秒。


    - **O(n log n)：** 前面两者的良好结合。通常排序有两个部分，第一个循环是 `O(n)`，第二个是 `O(log n)`，结合形成 `O(n
    log n)`。1 个项目需要 2 秒，10 个项目需要 12 秒，100 个项目需要 103 秒。


    - **O(n^2)/二次复杂度：** 事情开始变得异常慢了。1 个项目需要 1 秒，10 个项目需要 100 秒，100 个项目需要 10000 秒。


    - **O(2^n)：** 指数级增长！每增加一个新元素，算法花费的时间翻倍。1 个项目需要 1 秒，10 个项目需要 1024 秒，100 个项目需要 1267650600222940149673205376
    秒。


    # 示例：


    希望你到目前为止跟得上我，但让我们深入研究一些排序和搜索的示例算法。重要的是能够解释一个算法属于什么复杂度。面试官喜欢让候选人设计算法，然后询问它的复杂度是多少。


    ## 1. O(1)


    无论大小如何，它将始终以恒定的速度返回。`Queue` 的 javadoc 说明“检索方法（`peek`、`element` 和 `size`）是常数时间”。这其中的原因很清楚。对于
    `peek`，我们总是返回我们始终拥有引用的第一个元素；它后面跟着多少个元素并不重要。列表的大小在元素添加/删除时会更新，而无论列表有多大，引用这个数字只需要一次操作。


    ## 2. O(log n)


    经典的例子是二分查找（Binary search）。你是一个超级极客，所以你显然已经对你的电影收藏按字母顺序进行了排序。为了找到你的《回到未来》光盘，你首先来到列表的中间。你发现中间的电影是《霍克家族聚》，然后你前往开头和这部电影之间的电影。你发现那是《人类之子》。再次重复这个过程，你就找到了《回到未来》。


    虽然增加更多元素会增加搜索所需的时间，但并不是成比例增加的。因此，它是 `O(log n)`。


    ## 3. O(n)


    正如我在关于集合的帖子中所述，`LinkedList` 在检索方面并不太好（相对而言）。它的大 O 复杂度实际上是 `O(n)`，因为在坏情况下，为了找到元素
    `T`（它是列表中的最后一个元素），必须遍历整个包含 `n` 个元素的列表来找到 `T`。元素数量增加，访问时间也成比例增加。


    ## 4. O(n log n)


    `O(n log n)` 的最佳例子是合并排序（merge sort）。这是一种分治算法。假设你有一个整数列表。我们将它划分。通常排序有两个部分，第一个循环是
    `O(n)`，第二个是 `O(log n)`，结合形成 `O(n log n)`。1 个项目需要 2 秒，10 个项目需要 12 秒，100 个项目需要 103
    秒。


    `O(n^2)/二次复杂度：** 事情变得非常慢了。1 个项目需要 1 秒，10 个项目需要 100 秒，100 个项目需要 10000 秒。

