    `for` `for` 关键字用于创建 `for` 循环，它指定了变量初始化、布尔表达式和递增。首先执行变量初始化，然后评估布尔表达式。如果表达式评估的结果为
    `true`，则再次执行与循环相关的语句块；此过程一直持续，直到表达式的结果为 `false` 为止。


    从 J2SE 5.0 开始，`for` 关键字还可以用于创建所谓的“增强型 for 循环”，它指定一个数组或 `Iterable` 对象；循环的每次迭代都会使用数组或
    `Iterable` 中不同的元素来执行相关的语句块。


    `if` `if` 关键字用于创建 `if` 语句，该语句测试一个布尔表达式；如果表达式的结果为 `true`，则执行与 `if` 语句相关的语句块。该关键字也可用于创建
    `else` 语句；参见 `else`。


    `implements` 包含在类声明中，用于指定当前类实现的一个或多个接口。类继承接口中声明的类型和抽象方法。


    `import` 用于源文件的开头，用于指定稍后引用的类或整个 Java 包，而无需在引用时包含它们的包名。从 J2SE 5.0 开始，`import` 语句可以导入类的静态成员。


    `instanceof` 这是一个二元运算符，它接受一个对象引用作为第一个操作数，接受一个类或接口作为第二个操作数，并产生一个布尔结果。当且仅当对象的运行时类型与类或接口兼容时，`instanceof`
    运算符评估为 `true`。


    `int` `int` 关键字用于声明一个可以存储 32 位带符号补码整数的变量。该关键字也用于声明一个方法返回原始类型 `int` 的值。


    `interface` 用于声明一种特殊的类，该类只包含抽象方法或默认方法、常量（`static final`）字段和静态接口。它之后可以被使用 `implements`
    关键字声明接口的类所实现。


    `long` `long` 关键字用于声明一个可以存储 64 位带符号补码整数的变量。该关键字也用于声明一个方法返回原始类型 `long` 的值。


    `native` 用于方法声明，指定该方法没有在同一个 Java 源文件中实现，而是在另一种语言中实现。


    `new` 用于创建类或数组对象的实例。虽然为了此目的使用该关键字并非完全必要（如 Scala 所示），但它起两个作用：它允许方法和类名存在不同的命名空间；它在静态和局部上定义了确实创建了一个新对象，以及该对象的运行时类型（这被认为为代码引入了依赖关系）。


    **package** 一组类型。包通过 `package` 关键字声明。


    **private** `private` 关键字用于方法、字段或内部类的声明；私有（private）成员只能由其所属类的成员访问。


    **protected** `protected` 关键字用于方法、字段或内部类的声明；受保护（protected）成员只能由同类成员、该类的子类或同一包中的类访问。


    **public** `public` 关键字用于类、方法或字段的声明；公共（public）类、方法和字段可以被任何类的成员访问。


    `return` 用于结束方法的执行。后面可以跟随方法定义所需的值，该值将返回给调用者。


    `short` `short` 关键字用于声明一个可以存储 16 位带符号补码整数的字段。该关键字也用于声明一个方法返回原始类型 `short` 的值。


    `static` 用于将字段、方法或内部类声明为类字段。无论该类存在多少个实例，类都维护一份类字段的副本。`static` 也用于将方法定义为类方法。类方法绑定到类而不是特定的实例，并且只能操作类字段。（被声明为另一个类或接口的静态成员的类和接口实际上是顶层类，而不是内部类。）


    `strictfp`（在 J2SE 1.2 中添加）一种 Java 关键字，用于限制浮点数计算的精度和舍入，以确保可移植性。


    `super` 用于访问当前类所继承的类的成员。它允许子类访问其父类被重写的方法和隐藏的成员。`super` 关键字还用于将从构造函数的调用转发到父类中的构造函数。还用于指定泛型中类型参数的下界。


    `switch` `switch` 关键字与 `case` 和 `default` 配合创建 `switch` 语句，该语句评估一个变量，将其值与特定的 `case`
    匹配，并执行与该 `case` 语句块。如果没有 `case` 匹配该值，则执行由 `default` 标记的可选块（如果有）。


    `synchronized` 用于方法或代码块的声明，在当前线程执行代码时获取对象的互斥锁。对于静态方法，锁定的对象是该类的 `Class`。保证同一时间对同一对象进行操作的最多线程执行该代码。当执行退出
    `synchronized` 代码块时，会自动释放互斥锁。字段、类和接口不能声明为 `synchronized`。


    `this` 用于表示其所属类的实例。`this` 可用于访问类成员，并作为当前实例的引用。`this` 关键字还用于将同一类中一个构造函数的调用转发到另一个构造函数。


    `throw` 抛出声明的异常实例。这导致执行继续由 `catch` 声明的第一个异常处理器来处理赋值兼容的异常类型。如果在当前方法中没有找到此类处理器，则方法返回并在调用方法中重复该过程。如果在栈上的任何方法调用中都没有找到异常处理器，则异常传递给线程的未处理异常处理器。


    `throws` 用于方法声明，指定哪些异常未在方法内部处理而是传递给上层。方法中所有不是 `RuntimeException` 实例的未处理异常必须使用
    `throws` 关键字声明。


    `transient` 声明实例字段不是对象序列化部分。当对象被序列化时，只有非 `transient` 实例字段的值包含在默认表示中。当对象被反序列化时，`transient`
    字段仅初始化为默认值。如果没有使用默认形式（例如当类层次中声明了 `serialPersistentField` 时），所有的 `transient` 关键字都会被忽略。


    `try` 定义了一个异常处理语句块。如果在 `try` 块内部抛出异常，可选的 `catch` 块可以处理声明的异常。还可以声明一个 `finally`
    块，无论是否抛出异常，退出 `try` 块和 `catch` 子句时执行。`try` 块必须至少有一个 `catch` 子句或一个 `finally` 块。


    `void` `void` 关键字用于声明方法不返回任何值。


    **volatile** 用于字段声明，指定该变量由并发运行的线程异步修改。因此，方法、类和接口不能声明为 `volatile`，局部变量或参数也不行。


    **while** 关键字用于创建 `while` 循环，它测试一个布尔表达式，如果表达式的结果为 `true`，则执行与循环相关的语句块；此过程一直持续，直到表达式的结果为
    `false` 为止。该关键字也可用于创建 `do-while` 循环；字面量值的保留字：**true** 一个布尔字面量值。


    **null** 一个引用字面量值。


    **false** 一个布尔字面量值。


    '
