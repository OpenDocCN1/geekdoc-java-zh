    `transient` Declares that an instance field is not part of the default serialized
    of an object. When an object is serialized, only the values of its non-transient
    instance fields are included in the default serial representation. When an object
    is deserialized, transient fields are initialized only to their default value.
    If the default form is not used, e.g. when a `serialPersistentField` is declared
    in the class hierarchy, all transient keywords are ignored.


    `try` Defines a block of statements that have exception handling. If an exception
    is thrown inside the try block, an optional catch block can handle declared exception
    types. Also, an optional finally block can be declared that will be executed when
    execution exits the try block and catch clauses, regardless of whether an exception
    is thrown or not. A try block must have at least one catch clause or a finally
    block.


    `void` The `void` keyword is used to declare that a method does not return any
    value.'
  - '[PAGE 112]


    **volatile** Used in field declarations to specify that the variable is modified
    asynchronously by concurrently running threads. Methods, classes and interfaces
    thus cannot be declared *volatile*, nor can local variables or parameters.


    **while** The keyword is used to create a while loop, which tests a boolean expression
    and executes the block of statements associated with the loop if the expression
    evaluates to true; this continues until the expression evaluates to false. This
    keyword can also be used to create a do-while loop; **Reserved words for literal
    values**: **true** A boolean literal value.


    **null** A reference literal value.


    **false** A boolean literal value.'
- md: "\n## Return Keyword\n\nWe need to love the return keyword. This keyword turns\
    \ a function into data. There are a couple of conditions that need to be met before\
    \ this will work. So far, we've been using the keyword void to declare the return\
    \ type of a function. This looks like the following code fragment.\n\n```\nvoid\
    \ MyFunction()\n{\n  //code here...\n}\n```\n\nIn this case, using return will\
    \ be pretty simple.\n\n```\nvoid MyFunction()\n{\n  //code here ... return;\n\
    }\n```\n\nThis function returns void. This statement has a deeper meaning. Returning\
    \ a value makes a lot more sense when a real value, something other than a void,\
    \ is actually returned. Let's take a look at a function that has more meaning.\
    \ The keyword void at the beginning of the function declaration means that this\
    \ function does not have a return type. If we change the declaration, we need\
    \ to ensure that there is a returned value that matches the declaration. This\
    \ can be as simple as the following code fragment.\n\n```\nint MyFunction()\n\
    {\n  //code here...\n  return 1;\n  //1 is an int\n}\n```\n\nThis function returns\
    \ int 1. Declaring a function with a return value requires that the return type\
    \ and the declaration match. When the function is used, it should be treated like\
    \ a data type that matches the function's return type.\n\n## Are Errors Bad?\n\
    \nDon’t be afraid to make mistakes. The code you write cannot break IDE or your\
    \ computer. At least nothing you’ll learn from this book will enable you to do\
    \ so. As a matter of fact, it is often good to produce errors. The errors tell\
    \ us what we can and cannot do. Programmers often ask themselves, “Will the compiler\
    \ let me do this?” which may produce an error. If not, then the programmer will\
    \ continue his thought with “huh, I guess it will, so that means I can ...”\n\n\
    Creating and fixing errors tells us what the compiler expects from us. It is a\
    \ sort of a conversation between the programmer and the computer.\n\nFor example,\
    \ the programmer asking questions in the form of a code statement and the computer\
    \ replying with an error to the programmer who asks for things the computer can’t\
    \ do.\n\n## Compile Time and Run Time Errors\n\nAt compile time, when the code\
    \ does not comply with the Java syntactic and semantics rules as described in\
    \ Java Language Specification (JLS), compile-time errors will occurs. The goal\
    \ of the compiler is to ensure the code is compliant with these rules. Any rule-violation\
    \ detected at this stage are reported as compilation errors.\n\nThe best way to\
    \ get to know those rules is to go through all the sections in the JLS containing\
    \ the key words \"compile-time error\". In general, these rules include syntax\
    \ checking: declarations, expressions, lexical parsing, file-naming conventions\
    \ etc; exception handling: for checked exceptions; accessibility, type-compatibility,\
    \ name resolution: checking to see all named classes, method calls etc. are reachable\
    \ through at least one of the declared path; entities - variables,\n\nThe following\
    \ are some common compile time errors:\n\n- a class tries to extend more than\
    \ one class\n- Overloading or overriding is not implemented correctly\n- attempt\
    \ to refer to a variable that is not in the scope of the current block\n- an inner\
    \ class has the same name as one of its enclosing classes\n- a class contains\
    \ one or more abstract methods and the class itself is not declared \"abstract\"\
    \n- a class tries to reference a private member of another class\n- trying to\
    \ create an instance of an abstract class\n- trying to change the value of an\
    \ already initialized constant (final member)\n- declare two (class or instance)\
    \ members with the same name\n\nWhen the code compiles without any error, there\
    \ is still chance that the code will fail at run time.\n\nThe errors only occurs\
    \ at run time are call run time errors. Run time errors are those that passed\
    \ compiler's checking, but fails when the code gets executed. There are a lot\
    \ of causes that may result in runtime errors, such as incompatible type-casting,\
    \ referencing an invalid index in an array, using a null-object, resource problems\
    \ like unavailable file-handles, out of memory situations, thread deadlocks, infinite\
    \ loops(not detected!), etc.\n\nThe following are some common runtime errors:\n\
    \n- trying to invoke a method on an uninitialized variable (NullPointerException)\n\
    - ran out memory (memory leaks...) (OutOfMemoryError)\n- trying to open a file\
    \ that doesn't exist (FileNotFoundException)\n- trying to pass arguments to a\
    \ method which are not within the accepted bounds (IllegalArgumentException)\n\
    - trying to invoke the start() method on a dead thread (IllegalThreadStateException)\n\
    \n# CHAPTER 6 | FUNCTIONS AND OPERATORS\n\n## What Are Functions?\n\nFunctions,\
    \ sometimes called methods, contain statements which can process data. The statements\
    \ can or cannot process data. Methods can be accessed by other statements. This\
    \ action is referred to as calling a function or making a function call.\n\nFunctions\
    \ may look different in different programming languages, but the way they work\
    \ is mostly the same. The usual pattern is taking in data and using logic to manipulate\
    \ that data. Functions may also be referred to by other names, for example, methods.\
    \ The major differences come from the different ways the languages use syntax.\
    \ Syntax is basically the use of spaces or tabs, operators, or keywords.\n\nIn\
    \ the end, all you're doing is telling the compiler how to convert your instructions\
    \ into computer-interpreted commands. Variables and functions make the bulk of\
    \ programming. Any bit of data you want to remember is stored in a variable. Variables\
    \ are manipulated by your functions. In general, when you group variables and\
    \ functions\n\n```\npublic void PrintNum()\n{\n    System.out.println(anotherNum);\n\
    }\n```\n\nWhen writing function, it's good practice to fill in the entirety of\
    \ before continuing on. This puts the compiler at ease. The integrated development\
    \ environment, in this case MonoDevelop, is constantly reading and interpreting\
    \ what you're writing. When it comes across a statement that has no conclusive\
    \ form, like a variable, function, or class definition, its interpretation of\
    \ the you're writing will raise a warning or an error. MonoDevelop might seem\
    \ a bit fussy, but it's doing its best to help.\n\n## Writing a Function:\n\n\
    A function consists of a declaration and a body. Some programmers like to call\
    \ these methods, but semantics aside, a function is basically container for a\
    \ collection of statements.\n\nLet’s continue with the example:\n\n```\nvoid MyFunction\
    \ ()\n{\n}\n```\n\nHere is a basic function called MyFunction. We can add in additional\
    \ keywords to modify the function’s visibility. One common modifier we’ll be seeing\
    \ public.\n\n```\npublic void MyFunction ()\n{\n}\n```\n\nThe public keyword needs\
    \ to appear before the return type of the function. In this case, it’s void, which\
    \ means that the function doesn’t return anything. but functions can act as a\
    \ value in a few different ways. For reference, a function that returns an int\
    \ would look like this. A return statement of some kind must always be present\
    \ in a function that has a return type.\n\n```\npublic int MyFunction ()\n{\n\
    \    return 1;\n}\n```\n\nThe public modifier isn't always necessary, unless you\
    \ need to make this function available to other classes. If this point doesn't\
    \ make sense, it will will soon. The last part of the function that is always\
    \ required is the parameter list. It's valid to leave it empty, but to get a feeling\
    \ for what an arg, or argument in the parameter list, looks like, move on to the\
    \ next example.\n\n```\npublic void MyFunction (int i)\n{\n}\n```\n\nFor the moment,\
    \ we'll hold off on using the parameter list, but it's important to know what\
    \ you're looking later on so it doesn't come as a surprise. Parameter lists are\
    \ used to pass information from outside of the function to the inside of the function.\
    \ This is how classes are able to send information from one to another.\n\nFunction\
    \ declaration is similar to class declaration. Functions are the meat of where\
    \ logic is done to handle variables.\n"
  mdcn: "\n\n## Return 关键字\n\n我们需要爱 `return` 关键字。这个关键字将函数转换为数据。在它起作用之前，需要满足一些条件。到目前为止，我们一直使用\
    \ `void` 关键字来声明函数的返回类型。它看起来像下面的代码片段。\n\n```\nvoid MyFunction()\n{\n  //code here...\n\
    }\n```\n\n在这种情况下，使用 `return` 会非常简单。\n\n```\nvoid MyFunction()\n{\n  //code here\
    \ ... return;\n}\n```\n\n这个函数返回 `void`。这句语句具有更深层次的含义。当实际返回一个真实值（某些 `void` 以外的东西）时，返回值更有意义。让我们来看一个更有意义的函数。函数声明开头的\
    \ `void` 关键字意味着该函数没有返回类型。如果我们更改了声明，我们需要确保有一个与声明匹配的返回值。这可以像下面的代码片段一样简单。\n\n```\n\
    int MyFunction()\n{\n  //code here...\n  return 1;\n  //1 是一个 int\n}\n```\n\n\
    这个函数返回 `int` 1。声明一个带有返回值的函数要求返回类型与声明匹配。当使用该函数时，它应该被视为与函数返回类型匹配的数据类型。\n\n## 错误是坏的吗？\n\
    \n不要害怕犯错。你编写不会破坏 IDE 或你的电脑。至少从这本书中学到的任何东西都无法让你做到这一点。事实上，产生错误通常是好事。错误告诉我们我们可以做什么，不能做什么。程序员经常问问自己：“编译器会允许我这样做吗？”，这可能会产生一个错误。如果没有，程序员就会继续他的思考：“呵，我想是可以的，所以这意味着我可以……”\n\
    \n创建和修复错误告诉我们编译器对我们的期望。这某种程度上是程序员与计算机之间的一种对话。\n\n例如，程序员以代码语句的形式提问，而计算机对于程序员提出的它无法完成的任务，则以错误向程序员进行回复。\n\
    \n## 编译时错误和运行时错误\n\n在编译时，当代码不符合《Java 语言规范》(JLS) 中描述的 Java 语法和语义规则时，就会发生编译时错误。编译的目标是确保代码符合这些规则。在此阶段检测到的任何违反规则的行为都会被报告为编译错误。\n\
    \n了解这些规则的最佳方法是阅读 JLS 中所有包含“编译时错误”（compile-time error）关键字的章节。通常，这些规则包括语法检查：声明、表达式、词法解析、文件命名规范等；异常处理：针对受检异常；可访问性、类型兼容性、名称解析：检查所有具名类、方法调用等是否可以通过至少一个声明的路径触及；实体\
    \ - 变量，\n\n以下是一些常见的编译时错误：\n\n- 类尝试继承多个一个类\n- 重载或重写未正确实现\n- 尝试引用不在当前块范围内的变量\n-\
    \ 内部类与它的任意一个外部类同名\n- 类包含一个或多个抽象方法，且该类本身未声明为“abstract”（抽象）\n- 类尝试引用另一个类的私有成员\n\
    - 尝试创建抽象类的实例\n- 尝试更改已初始化的常量（final 成员）的值\n- 声明两个同名的（类成员或实例成员）\n\n当代码在没有任何错误的情况下编译时，代码仍可能在运行时失败。\n\
    \n只在运行时发生的错误被称为运行时错误。运行时错误是那些通过了编译器检查但在代码执行时失败的错误。有很多原因可能导致运行时错误，例如不兼容的类型转换、引用数组中的无效索引、使用空对象、资源问题（如不可用的文件句柄）、内存溢出、线程死锁、无限循环（未检测到！）等。\n\
    \n以下是一些常见的运行时错误：\n\n- 尝试对未初始变量调用方法（NullPointerException）\n- 内存不足（内存泄漏……）（OutOfMemoryError）\n\
    - 尝试打开不存在的文件（FileNotFoundException）\n- 尝试向方法传递不在接受范围内的参数（IllegalArgumentException）\n\
    - 尝试对已死的线程调用 start() 方法（IllegalThreadStateException）\n\n# 第 6 章 | 函数与操作符\n\n##\
    \ 什么是函数？\n\n函数（有时被称为方法）包含可以处理数据的语句。这些语句可以处理数据，也可以不处理。方法可以被其他语句访问。这种行为被称为调用函数或进行函数调用。\n\
    \n函数在不同的编程语言中看起来可能不同，但它们的工作方式大部分是相同的。通常的模式接收数据并使用逻辑来处理这些数据。函数也可以被称为其他名称，例如方法。主要区别在于语言使用语法的方式不同。语法基本上是空格或制表符、操作符或关键字的使用。\n\
    \n根结底，你所做的只是告诉编译器如何将你的指令转换为计算机解释的命令。变量和函数构成了编程的大部分。你想要记忆的任何数据都存储在变量中。变量由你的函数处理。通常，当你将变量和函数分组时\n\
    \n```\npublic void PrintNum()\n{\n    System.out.println(anotherNum);\n}\n```\n\
    \n在编写函数时，在继续之前填写完整内容是一个良好的习惯。这会让编译器感到轻松。在这种情况下，集成开发环境（例如 MonoDevelop）会不断读取并解释你正在编写的内容。当它遇到没有结论性形式的语句时，例如变量、函数或类定义，它对你编写内容的解释将引发警告或错误。MonoDevelop\
    \ 看起来有点挑剔，但它正在尽力提供帮助。\n\n## 编写函数：\n\n函数由声明和体组成。有些程序员喜欢称这些为方法，但抛开语义不谈，函数基本上是语句集合的容器。\n\
    \n继续之前的示例：\n\n```\nvoid MyFunction ()\n{\n}\n```\n\n这是一个名为 MyFunction 的基本函数。我们可以添加额外的关键字来修改函数的可见性。我们将看到的一个常见修饰符是\
    \ `public`。\n\n```\npublic void MyFunction ()\n{\n}\n```\n\n`public` 关键字需要出现在函数的返回类型之前。在这种情况下，它是\
    \ `void`，这意味着函数不返回任何内容。但函数可以通过几种不同的方式作为值存在。作为参考，一个返回 `int` 的函数看起来如下。在具有返回类型的函数中，必须存在某种形式的返回语句。\n\
    \n```\npublic int MyFunction ()\n{\n    return 1;\n}\n```\n\n`public` 修饰符并不是总是必要的，除非你需要让此函数对其他类可用。如果这一点还不理解，你很快就会理解的。函数的最后一个始终要求的部分是参数列表。留空是有效的，但为了让你对参数（arg，即参数列表中的参数）的样子有一个感觉，请看下一个示例。\n\
    \n```\npublic void MyFunction (int i)\n{\n}\n```\n\n目前，我们将推迟使用参数列表，但了解你之后将看到的内容是很重要的，这样它就不会让你意外。参数列表用于将信息从函数外部传递到函数内部。这就是类能够在类与类之间传递信息的方式。\n\
    \n函数声明与类声明相似。函数是处理逻辑的核心所在。\n\n"
