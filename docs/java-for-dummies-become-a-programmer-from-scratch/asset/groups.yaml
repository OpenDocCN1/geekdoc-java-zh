    # URLConnections Class Methods:


    The openConnection() method returns a java.net.URLConnection, abstract class whose
    subclasses represent the various types of URL connections.


    For example:


    If you connect to a URL whose protocol is HTTP, the openConnection() method returns
    an HttpURLConnection object.


    If you connect to a URL that represents a JAR file, the openConnection() method
    returns a JarURLConnection object, etc.


    The URLConnection class has many methods for setting or determining information
    about the connection, including the following:


    | Sr.No. | Method & Description |

    | 1 | Object getContent() Retrieves the contents of this URL connection. |

    | 2 | Object getContent(Class[] classes) Retrieves the contents of this URL connection.
    |

    | 3 | String getContentEncoding() Returns value of the content-encoding header
    field. |

    | 4 | int getContentLength() Returns the value of the content-length header field.
    |

    | 5 | String getContentType() Returns the value of the content-type header field.
    |

    | 6 | int getLastModified() Returns the value of the last-modified header field.
    |

    | 7 | long getExpiration() Returns the value of the expired header field. |'
