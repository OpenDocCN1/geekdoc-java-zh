    # CHAPTER 11 | DATA STRUCTURE


    Even though computers can literally perform millions of mathematical computations
    per second, when a problem gets large and complicated, performance can nonetheless
    be an important consideration. One of the most crucial aspects to how quickly
    a problem can be solved is how the data is stored in memory.


    To illustrate this point, consider going to the local library to find a book about
    a specific subject matter. Most likely, you will be able to use some kind of electronic
    reference or, in the worst case, a card catalog, to determine the title and author
    of the book you want. Since the books are typically shelved by category, and within
    each category sorted by author''s name, it is a fairly straightforward and painless
    process to then physically select your book from the shelves.


    Now, suppose instead you came to the library in search of a particular book, but
    instead of organized shelves, were greeted with large garbage bags lining both
    sides of the room, each arbitrarily filled with books that may or may not have
    anything to do with one another. It would take hours, or even days, to find the
    book you needed, a comparative eternity. This is how software runs when data is
    not stored in an efficient format appropriate to the application.


    ## Simple Data Structure:


    The simplest data structures are primitive variables. They hold a single value,
    and beyond that, are of limited use. When many related values need to be stored,
    an array is used. It is assumed that the reader of this article has a solid understanding
    of variables and arrays.


    A somewhat more difficult concept, though equally primitive, are pointers. Pointers,
    instead of holding an actual value, simply hold a memory address that, in theory,
    contains some useful piece of data. Most seasoned C++ coders have a solid understanding
    of how to use pointers, and many of the caveats, while fledgling programmers may
    find themselves a bit spoiled by more modern "managed" languages, which, for better
    or worse, handle pointers implicitly.


    Either way, it should suffice to know that pointers "point" somewhere in memory,
    and do not actually store data themselves.


    A less abstract way to think about pointers is in how the human mind remembers
    (or cannot remember) certain things. Many times, a good engineer may not necessarily
    know a particular formula/constant/equation, but when asked, they could tell you
    exactly which reference to check.


    ## Arrays:


    Arrays are a very simple data structure, and may be thought of as a list of a
    fixed length. Arrays are nice because of their simplicity, and are well suited
    for situations where the number of data items is known (or can be programmatically
    determined). Suppose you need a piece of code to calculate the average of several
    numbers.


    An array is a perfect data structure to hold the individual values, since they
    have no specific order, and the required computations do not require any special
    handling other than to iterate through all of the values. The other big strength
    of arrays is that they can be accessed randomly, by index. For instance, if you
    have an array containing a list of names of students seated in a classroom, where
    each seat is numbered 1 through n, then studentName[i] is a trivial way to read
    or store the name of the student in seat i.


    An array might also be thought of as a pre-bound pad of paper. It has a fixed
    number of pages, each page holds information, and is in a predefined location
    that never changes.


    ## Sorting Techniques:


    Sorting refers to arranging data in a particular format. Sorting algorithm specifies
    the way to arrange data in a particular order. Most common orders are in numerical
    or lexicographical order.


    The importance of sorting lies in the fact that data searching can be optimized
    to a very high level, if data is stored in a sorted manner. Sorting is also used
    to represent data in more readable formats. Following are some of the examples
    of sorting in real-life scenarios –


    - Telephone Directory – The telephone directory stores the telephone numbers of
    people sorted by their names, so that the names can be searched easily.

    - Dictionary – The dictionary stores words in an alphabetical order so that searching
    of any word becomes easy.


    ## In-place Sorting and Not-in-place Sorting:


    Sorting algorithms may require some extra space for comparison and temporary storage
    of few data elements. These algorithms do not require any extra space and sorting
    is said to happen in-place, or for example, within the array itself. This is called
    **in-place sorting**. Bubble sort is an example of in-place sorting.


    However, in some sorting algorithms, the program requires space which is more
    than or equal to the elements being sorted. Sorting which uses equal or more space
    is called **not-in-place sorting**. Merge-sort is an example of not-in-place sorting.


    ## Stable and Not Stable Sorting:


    If a sorting algorithm, after sorting the contents, does not change the sequence
    of similar content in which they appear, it is called stable sorting.


    ![](img/81147dcafcee2d431dfe108a34b4c094_255_0.png)


    If a sorting algorithm, after sorting the contents, changes the sequence of similar
    content in which they appear, it is called unstable sorting.


    ![](img/81147dcafcee2d431dfe108a34b4c094_256_0.png)


    Stability of an algorithm matters when we wish to maintain the sequence of original
    elements, like in a tuple for example.


    ## Adaptive and Non-Adaptive Sorting Algorithm:


    A sorting algorithm is said to be adaptive, if it takes advantage of already ''sorted''
    elements in the list that is to be sorted. That is, while sorting if the source
    list has some element already sorted, adaptive algorithms will take this into
    account and will not try to re-order them.


    A non-adaptive algorithm is one which does not take into account the elements
    which are already sorted. They try to force every single element to be re-ordered
    to confirm their sortedness.


    ## Sorting and Searching


    ### Binary Search


    Binary search is one of the fundamental algorithms in computer science. In order
    to explore it, we''ll first build up a theoretical backbone, then use that to
    implement the algorithm properly and avoid those nasty off-by-one errors everyone''s
    been talking about.


    Finding a value in a sorted sequence


    In its simplest form, binary search is used to quickly find a value in a sorted
    sequence (consider a sequence an ordinary array for now). We''ll call the sought
    subsequence of the starting sequence where the target value is surely located.
    Binary search maintains a contiguous space. The search space is initially the
    entire sequence. At each step, the algorithm compares the median value in the
    search space to the target value. Based on the comparison and because the sequence
    is sorted, it can then eliminate half of the search space. By doing this repeatedly,
    it will eventually be left with a search space consisting of a single element,
    the target value.


    For example, consider the following sequence of integers sorted in ascending order
    and say we are looking for the number 55:


    - 0 5 13 19 22 41 55 72 81 98


    We are interested in the location of the target value in the sequence so we will
    represent the search space as indices into the sequence. Initially, the search
    space contains indices 1 through 11. Since the search space is really an interval,
    it suffices to store just two numbers, the low and high indices. As described
    above, we now choose the median value, which is the value at index 6 (the midpoint
    between 1 and 11): this value is 41 and it is smaller than the target value. From
    this we conclude not only that the element at index 6 is not the target value,
    but also that no element at these indices 1 and 5 can be the target value, because
    all elements at these indices are smaller than 41, which is smaller than the target
    value. This brings the search space down to indices 7 through 11:


    - 55 68 72 81 98


    Proceeding in a similar fashion, we chop off the second half of the search space
    and are left with:


    - 55 68


    Depending on how we choose the median of an even number of elements we will either
    find 55 in the next step or chop off 68 to get a search space of only one element.

