    # 逻辑：


    1848年，乔治·布尔（George Boole）为我们带来了布尔逻辑。从差分机到第一台通用编程计算机的出现经历了近一个世纪的时间。多亏了乔治，今天的计算机使用二进制（1和0）进行计数，我们的软件则以真或假进行思考。1887年，多尔·尤金·费尔特（Dor
    Eugene Felt）制造了一台带有按钮的计算机器；多亏了他，我们的电脑有了键盘。19世纪90年代，一种制表机使用带有穿孔的纸（代表1和0）来记录美国的人口普查数据。在当时，它节省了200万美元和6年的工作量。20世纪初，在尼古拉·特斯拉（Nicola
    Tesla）和亚历山大·格拉姆·贝尔（Alexander Graham Bell）之间，晶体管的发明使得现代计算机近在咫尺。1936年，康拉德·齐泽（Konrad
    Zuse）制造了Z1计算机，这是另一台类似于巴贝（Babbage）的机械计算机，但这次它使用了像制表机那样的穿孔带。他后来在1941年制造了Z3计算机。


    # 计算机科学：


    20世纪40年代，英国计算机科学家艾伦·图灵（Alan Turing）设计并制造了一种名为“炸弹”（Bombe）的加密信息解码器，它利用电磁开关在第二次世界大战期间帮助盟军。在20世纪30年代到50年代之间，图灵告诉计算机科学家，理论上计算机可以解决任何可计算的问题，并将这一概念称为图灵完备性（Turing
    completeness）。所有这些组件开始引导我们走向现代计算机。20世纪40年代中期，约翰·冯·依曼（John Von Neumann）通过他的理论证明了可以使用简单的组件构建计算机。这样，控制硬件的软件就可以添加复杂的行为。多亏了特斯拉和贝尔，Z3完全由电子元件组成。它在计算时首次使用了逻辑，使其成为第一台图灵完备的计算机。1954年，德州仪器的戈登·蒂尔（Gordon
    Teal）推出了硅基晶体管，这是构建今天用于每台计算机的固态电子设备的关键组件。


    # 软件：


    Z3是使用Plankalkül编程的，这是齐泽在完成机器制造后不久发明的第一种高级编程语言。1952年，格蕾丝·霍珀（Grace Hopper）创建了第一个编译器，这是一种可以将人类可读的词汇翻译成机器操作的软件。程序员第一次不需要知道硬件中晶体管是如何工作的，就可以编写供计算机运行的软件。这为计算机编程向了一个全新的群体开放。在20世纪50年代到70年代之间，计算机和计算机语言在复杂性和能力方面不断增长。1958年，约翰·麦卡锡（John
    McCarthy）在马萨诸塞理工学院（MIT）发明了LISP。面向对象的编程在1967年的Simula 67中出现。命令式编程和过程化编程则在1970年的Pascal语言中出现。


    # 现代计算机语言：由贝尔在20世纪20年代创立的贝尔实验室（Bell Labs）于1967年雇用了丹尼斯·里奇（Dennis Ritchie）。1974年，里奇发布了C编程语言，该语言已成为最流行的计算机编程语言。1983年，C++作为“带类的C”出现。詹姆斯·高斯林（James
    Gosling）、迈克·谢里登（Mike Sheridan）和帕特里克·诺顿（Patrick Naughton）在1991年6月启动了Java项目。Java最初是为了交互式电视设计的，但对于当时的数字电缆电视行业来说太先进了。该语言最初名为Oak，源自高斯林办公室外的一棵橡树。该项目曾名为Greenland，最终更名为Java（一种咖啡）。高斯林设计Java时采用了C/C++风格的语法，系统和应用程序程序员会感到很熟悉。


    太阳微系统（Sun Microsystems）于1995年发布了第一个公共实现版本Java 1.0。它承诺“一次编写，随运行”（WORA），在流行的平台上提供免费的运行时环境。它相当安全并具有可配置的安全性，允许进行网络和文件访问限制。主要的网页浏览器很快就加入了在网页内运行Java小程序的能力，Java迅速流行起来。Java
    1.0编译器由亚瑟·范·霍夫（Arthur van Hoff）用Java重写，以严格遵守Java 1.0语言规范。随着Java 2的出现（最初于1998-1999年以J2SE
    1.2的形式发布），新版本为不同类型的平台构建了多个配置。J2EE包含了通常运行在服务器环境中的企业应用程序的技术和API，而J2ME则具有针对移动应用程序优化的API。桌面版本被更名为J2SE。2006年，出于营销考虑，太阳微系统将新的Java版本分别更名为Java
    EE、Java ME和Java SE。


    1997年，太阳微系统接触了ISO/IEC JTC 1标准机构，随后是Ecma International以使Java正式化，但很快就退出了该过程。Java仍然是一个事实标准，通过Java社区进程（Java
    Community Process）进行控制。曾几何时，尽管其处于专有软件状态，太阳将其大部分Java实现免费提供。太阳通过销售Java企业系统等特殊产品的许可证从Java中产生收入。


    2006年11月13日，太阳微系统根据GNU通用公共许可证（GPL）的条款，将其大部分Java虚拟机（JVM）作为免费开源软件（FOSS）发布。2007年5月8日，太阳完成了这一过程，将其所有JVM的核心代码根据免费软件/开源分发条款开放，太阳不拥有版权的小部分代码除外。


    # 计算机语言的未来：


    国际商业公司（IBM）是一家成立于20世纪20年代的美国公司，目前正在利用近一个世纪发现的粒子物理学工程新技术。现代自旋电子学源于20世纪20年代后期德国物理学的工作。如果没有粒子物理学和像弗德里希·赫尔曼·洪德（Friedrich
    Hermann Hund）这样的物理学家，我们无法理解量子隧道效应，固态磁盘或通用总线（USB）优盘也将不存在。在希格斯玻子被发现和确认之后，你可能会问“为什么要费劲？”这个问题可能在百年后才能得到良好的答案，但它是值得的。Java不是最后一种计算机语言；最近又引入了许多其他，最著名的是谷歌推出的Go。


    微软为了不甘落后也引入了F#。近年来有许多相对新的编程语言变得流行。尽管这些语言不同，但核心概念都是相同的。一旦理解了基本思想，就很容易将此处获得的知识应用到新语言中并继续学习。今天，量子计算机开始出现。处理今天的晶体管时，我们发送和接收值。量子计算机不通过1和0工作；而是存储0到1之间的值。为了处理这一点，新的编程语言正在开发中。


    # 第2章 | 入门


    # 什么是编程？


    一切都是关于编写代码。编程是一个组织数据并使用逻辑来处理这些数据的过程。数据是计算机可以存储的一切；从数字到视频游戏中的僵尸角色。你通过将文本写入源代码文件来实现这一点。


    img/81147dcafcee2d431dfe108a34b4c094_19_0.png)类用于在内存中创建对象，并可以复制以拥有自己的生命。类用于构建对象。类中的每个数据部分都成为对象的一部分。类中不同的数据块被称为类成员。类成员也可以是逻辑块，称为函数或方法。


    例如，在一个僵尸群的游戏中，每个僵尸都是从僵尸类复制或实例化的。每个僵尸在每个属性或数据元素上都有独特的值。这意味着生命值和位置对于每个僵尸对象来说都是唯一的。


    '
