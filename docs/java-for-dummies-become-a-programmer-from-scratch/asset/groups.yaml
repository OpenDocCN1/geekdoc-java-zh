  mdcn: "\n大脑。\n\n为了变得有用，子僵尸还可以添加新对象，并修改它从父类继承的属性。结果是，现在子僵尸可能拥有父类没有的触手。对象之间通过事件和消息相互通信。\n\
    \n向僵尸射击可以创建一个事件，在程序员的术语中，这“引发”（raises）了一个事件。子弹命中事件告诉僵尸类在被子弹击中时采取必要的步骤。\n\n事件命令类对其数据执行操作，这正是函数发挥用场的地方。\n\
    \n函数也称为方法（methods），是作用于数据的逻辑部分。它们允许你的类创建额外的事件并与更多对象通信。\n\n当玩家按下扳机并移动摇杆时，可以引发更多的事件并发送更多的消息。事件和消息允许玩家与你的世界进行交互；逻辑事件和对象共同构建了你的游戏。\n\
    \n## 什么是数据？\n\n从广义上来说，数据类似于名词。和名词一样，数据可以是人、地、物。程序员将这些名词称为对象（objects），这些对象作为变量（variables）存储在内存中。“变量”一词暗示了某种可能会改变的东西，但情况并非总是如此。最好将变量想成计算机内存中用于存放信息的空间。当你玩像\
    \ MadLibs 这样的游戏时，你可能会要求某人的名字、一个对象、一个副词和一个地点。你的结果可能是“加斯吃了一件夹克，并专注地在洗衣店玩耍。”在这种情况下，名字、对象、副词和地点就是变量类型。而数据就是你用来赋值变量的单词。\n\
    \n程序员使用**类型**（type）一词来表示将存储什么种类型的数据。计算机并不精通英语，通常不知道英语类型中名词（noun）和形容词（adjective）之间的区别，但它们知道字母与各种数字之间的区别。Java\
    \ 或任何其他语言中都有许多预定义类型。\n\n如果你加上创建新类型数据的能力，那么我们能够存储的数据种类实际上是无限制的。\n\nC# 的内置类型有时被称为\
    \ POD，或普通旧数据（plain old data）。该术语来自最初的 C++ 标准，其起源可以追溯到 1979 年。POD 类型从原始实现以来没有发生根本变化。\n\
    \n到为止，我们已经使用了几次“类型”这个词。程序员定义“类型”一词来描述要存储的数据的多样性。\n\n## 什么是编译器？\n\n通常，“编译”（compiling）是每个与编程相关的人即使是远程也会经常听到的术语。编译器是一个软件程序，它将开发者用高级编程语言编写的高级源代码转换为机器语言的低级对象代码（二进制代码），这种代码是可以被处理器理解的。将高级编程转换为机器语言的过程被称为编译。\n\
    \n处理器执行对象代码，这些代码指示了在处理器的算术逻辑单元中何时需要二进制高低电平信号。\n\n让我们举一个例子来理解上述定义的含义。\n\n如果你询问任何与编程相关的人他/她写的第一个程序是什么，那么显而易见的答案是“Hello\
    \ World”。所以我们也从这里开始。\n\n```c\n#include<stdio.h>\nvoid main()\n{\n    printf(\"\
    Hello, world!\");\n}\n```\n\n这个最基本的程序在计算机屏幕上打印或显示“Hello,World!”字。但存在一个问题。它并不简单。在幕后发生着很多复杂的事情。让我们窥探内部。残酷的事实是我们的计算机无法理解源文件（helloworld.c）包含的命令/指令，因为\
    \ C 是一种高级语言，这意味着它包含了各种字符、符号和单词，代表了复杂的基于数字的指令，例如 printf、main、头文件等。计算机可以执行的指令只有用机器语言编写的指令，完全由数字组成，即\
    \ 0 和 1 的二进制语言。在我们的计算机运行我们的 C 程序之前，编译器应该将我们的 helloworld.c 转换为对象文件；然后一个名为链接器（linker）的程序应该将对象文件转换为可执行文件。\n\
    \n下面的图说明了这个过程。\n\n![](img/81147dcafcee2d431dfe108a34b4c094_23_0.png)\n\n将机器语言转换为高级自然语言的编译器称为反汇编（decompiler）。产生用于系统中运行的对象代码的编译器称为交叉编译器（cross-compilers）。最后，将一种编程语言转换为另一种语言的编译器称为语言翻译器（language\
    \ translator）。\n\n编译器执行四个主要步骤：\n\n-   **扫描（Scanning）：** 扫描器从源代码中一次读取一个字符，并跟踪该字符出现在哪一行。\n\
    -   **词法分析（Lexical Analysis）：** 编译器将源代码中出现的字符序列转换为一系列字符字符串（称为标记 tokens），这些标记由一个名为词法分析器的程序通过特定规则关联。词法分析器使用符号表（symbol\
    \ table）来存储源代码中与生成的标记对应的单词。\n-   **句法分析（Syntactic Analysis）：** 在这一步中，进行句法分析，涉及预处理以确定词法分析期间创建的标记是否按照其用法处于正确顺序。一组可以产生预期结果的关键字正确顺序被称为语法（syntax）。编译器必须检查源代码以确保句法准确性。\n\
    -   **语义分析（Semantic Analysis）：** 这一步由几个中间步骤组成。首先检查标记的结构，以及它们相对于给定语言语法的顺序。标记结构的含义由解析器和分析器解释，最终生成中间代码。\n\
    \n一个将机器语言转换为高级自然语言的编译器称为反汇编。产生旨在在系统上运行的对象代码的编译器称为交叉编译器。最后，将一种编程语言转换为另一种语言的编译器称为语言翻译器。\n\
    \n（此处重复内容...）\n"
