    \ syntax of a while loop is :\n\n```\nwhile(Boolean_expression) {\n  // Statements\n\
    }\n```\n\nHere, **statement(s)** may be a single statement or a block of statements.\
    \ The **condition** may be any expression, and true is any non zero value.\n\n\
    When executing, if the *boolean_expression* result is true, then the actions inside\
    \ the loop will be executed. This will continue as long as the expression result\
    \ is true.\n\nWhen the condition becomes false, program control passes to the\
    \ line immediately following the loop.\n\n# Flow Diagram:\n\n![](img/81147dcafcee2d431dfe108a34b4c094_150_0.png)\n\
    \nHere, the *boolean_expression* result is true, then the actions inside the loop\
    \ will be executed. This will continue as long as the expression result is true.\n\
