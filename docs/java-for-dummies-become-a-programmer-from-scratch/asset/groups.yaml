    > — Paul Graham, Hackers & Painters: Big Ideas from the Computer Age


    “At forty, I was too old to work as a programmer myself anymore; writing code
    is a young person’s job.”


    > — Michaelrichton, Prey


    “Some of the best programming is done on paper, really. Putting it into the computer
    is just a minor detail.”


    > — Max Kanat-Alexander, Code Simplicity: The Fundamentals of Software


    “Programmers are not to be measured by their ingenuity and their logic but by
    the completeness of their case analysis.”


