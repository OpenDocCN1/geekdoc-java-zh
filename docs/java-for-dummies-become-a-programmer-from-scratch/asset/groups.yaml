- md: "\nAn object provides services: While you’re trying to develop or understand\
    \ a program design, one of the best ways to think about objects is as “service\
    \ providers.” Your program itself will provide services to the user, and it will\
    \ accomplish this by using the services offered by other objects. Your goal is\
    \ to produce (or even better, locate in existing code libraries) a set of objects\
    \ that provide the ideal services to solve your problem.\n\nA way to start doing\
    \ this is to ask, “If I magically pull them out of a hat, what objects would solve\
    \ my problem right away?” For example, suppose you are creating a bookkeeping\
    \ program. You might imagine some objects that contain pre-defined bookkeeping\
    \ input screens, another set of objects that perform bookkeeping calculations,\
    \ and an object that handles printing of checks and invoices on all different\
    \ kinds of printers. Maybe some of these objects already exist, and for the ones\
    \ that don’t, what would they look like? What services would those objects provide,\
    \ and what objects would you need to fulfill their obligations? If you keep doing\
    \ this, you will eventually reach a point where you can say either, “That object\
    \ seems enough to sit down and write” or “I’m sure that object must exist already.”\
    \ This is a reasonable way to decompose a problem into a set of objects.\n\nThinking\
    \ of an object as a service provider has an additional benefit: It helps to improve\
    \ the cohesiveness of the object. High cohesion is a fundamental quality of software\
    \ design: It means that the various aspects of a software component (such as an\
    \ object, although this could also apply to a method or a library of objects)\
    \ “fit together.” One problem people have when designing objects is cramming too\
    \ much functionality into one object. For example, in your check printing module,\
    \ you might decide you need an object that knows all about formatting and printing.\
    \ You’ll probably discover that this is too much for one object, and what you\
    \ need is three or more objects. One object might be a catalog of all the possible\
    \ check layouts, which can be queried for information about how to print a check.\
    \ One object or set of objects can be a generic printing interface that knows\
    \ all about different kinds of printers (but nothing about bookkeeping—this is\
    \ a candidate for buying rather than writing). And a third object could use the\
    \ services of the other two to accomplish the task. Thus, each object has a cohesive\
    \ set of services it offers. In a good-oriented design, each object does one thing,\
    \ but doesn’t try to do too much.\n\nThis not only allows the discovery of objects\
    \ that might be purchased (the printer interface object), but it also produces\
    \ new objects that might be reused somewhere else (the catalog of check layouts).\n\
    \nTreating objects as service providers is a great simplifying tool. This is useful\
    \ not only during the design process, but also when someone else is trying to\
    \ understand your code or reuse an object. If they can see the value of the object\
    \ based on what service it provides, it makes it much easier to fit it into the\
    \ design.\n\n**The hidden implementation:** It is helpful to break up the playing\
    \ field into class creators (those who create new data types) and client programmers\
    \ (the class consumers who use the data types in their applications). The goal\
    \ of the client programmer is to collect a toolbox full of classes to use for\
    \ rapid application development. The goal of the class creator is to build a class\
    \ that exposes only what's necessary to the client programmer and keeps everything\
    \ else hidden. Why? Because it's hidden, the client programmer can't access it,\
    \ which means that the class creator can change the hidden portion without worrying\
    \ about the impact on anyone else. The hidden portion usually represents the insides\
    \ of an object that could be corrupted by a careless or uninformed client programmer,\
    \ so hiding the implementation reduces program bugs.\n\nIn any relationship it's\
    \ important to have boundaries that are respected by all parties involved. When\
    \ you create a library, you establish a relationship with the client programmer,\
    \ who is also a programmer, but one who is putting together an application by\
    \ using your library, possibly to build a bigger library. If all the members of\
    \ a class are available to everyone, the client programmer can do anything with\
    \ that class and there's no way to enforce rules. Even though you really prefer\
    \ that the client programmer not directly manipulate some of the members of your\
    \ class, without access control there's no way to prevent it. Everything's naked\
    \ to the world.\n\nSo the first reason for access control is to keep client programmers'\
    \ hands off portions they don't touch—parts that are necessary for the internal\
    \ operation of the data type but users need to solve their particular problems.\
    \ This is actually a service to client programmers because they can easily see\
    \ what's important to them and what they can ignore.\n\nThe second reason for\
    \ access control is to allow the library designer to change the internal workings\
    \ of the class without worrying about how it will affect the client programmer.\
    \ For example, you might implement a particular class in a simple fashion to ease\
    \ development, and then later discover that you need to rewrite it in order to\
    \ make it run faster. If the interface and implementation are clearly separated\
    \ and protected, you can accomplish this easily.\n\nJava uses three explicit keywords\
    \ to set the boundaries in a class: public, private, and protected. These access\
    \ specifiers determine who can use the definitions that follow. public means the\
    \ following element is available to everyone. The private keyword, on the other\
    \ hand, means that no one can access that element except you, the creator of the\
    \ type, inside methods of that type. private is a brick wall between you and the\
    \ client programmer. Someone who tries to access a private member will get a compile-time\
    \ error. The protected keyword acts like private, with the exception that an inheriting\
    \ class has access to protected members, but not private members. Inheritance\
    \ will be introduced shortly.\n\nJava also has a “default” access, which comes\
    \ into play if you don't use one of the aforementioned specifiers. This is usually\
    \ called package access because classes can access the members of other classes\
    \ in the same package (library component), but outside of the package those same\
    \ members appear to be private.\n\n## Encapsulation:\n\nEncapsulation in Java\
    \ is a mechanism of wrapping the data (variables) and code acting on the data\
    \ (methods) together as a single unit. In encapsulation, the variables of a class\
    \ will be hidden from other classes, and can be accessed only through the methods\
    \ of their current class. Therefore, it is also known as data hiding.\n\nTo achieve\
    \ encapsulation in Java:\n\n- Declare the variables of a class as private.\n-\
    \ Provide public setter and getter methods to modify and view the variables values.\n\
    \n## Example:\n\nFollowing is an example that demonstrates how to achieve Encapsulation\
    \ in Java:\n\n```java\npublic class EncapTest {\n    private String name; \n \
    \   private String idNum; \n    private int age;\n    public int getAge() {\n\
    \        return age; \n    }\n    public String getName() {\n        return name;\
    \ \n    }\n\n    public String getIdNum() {\n        return idNum; \n    }\n\n\
    \    public void setAge( int newAge) {\n        age = newAge; \n    }\n\n    public\
    \ void setName(String newName) {\n      name = newName; \n    }\n\n    public\
    \ void setIdNum(String newId) {\n      idNum = newId;\n    }\n}\n```\n\nThe public\
    \ setXXX() and getXXX() methods are the access points of the instance variables\
    \ of the EncapTest class. Normally, these methods are referred to as getters and\
    \ setters. Therefore, any class that wants to access the variables should access\
    \ them through these getters and setters.\n\nThe variables of the EncapTest class\
    \ can be accessed using the following program:\n\n```java\npublic class RunEncap\
    \ {\n  public static void main(String args[]) {\n    EncapTest encap = new EncapTest();\
    \ \n    encap.setName(\"James\");\n    encap.setAge(20); \n    encap.setIdNum(\"\
    12345ms\");\n    System.out.print(\"Name : \" + encap.getName() + \" Age : \"\
    \ + encap.getAge());\n  }\n}\n```\n\nThis will produce the following result:\n\
    \n## Output:\n\n| Name: James Age : 20 |\n| :--- |\n"
  mdcn: "\n\n对象提供服务：当你试图开发或理解程序设计时，思考对象的最佳方式之一是将它们视为“服务提供者”。你的程序本身将为用户提供服务，它将通过使用其他对象提供的服务来实现这一点。你的目标是产生（甚至更好是，在现有代码库中找到）一组能够为解决你的问题提供理想服务的对象。\n\
    \n开始这项工作的方法是问自己：“如果我魔术般从帽子里变出它们，哪些对象可以立即解决我的问题？”例如，假设你正在创建一个记账程序。你可能会想象一些包含预定义记账输入界面的对象，另一组执行记账计算的对象，以及一个处理在所有不同类型打印机上打印支票和发票的对象。也许这些对象中某些已经存在，而对于那些不存在的对象，它们看起来会什么样？这些对象会提供什么服务，你需要哪些对象来履行它们的职责？如果你坚持这样做，最终将达到一个点，你可以说：“那个对象看起来已经足够坐下来写代码了”或者“我确定那个对象一定已经存在了”。这是一个将问题分解为一组对象的合理方法。\n\
    \n将对象看作服务提供者还有一个额外的好：它有助于提高对象的内聚性。高内聚性是软件设计的基本质量：它意味着软件组件的不同方面（例如对象，尽管这也可以适用于方法或对象库）“恰好契合”。人们在设计对象时面临的一个问题是将过多的功能挤入一个对象中。例如，在你的支票打印模块中，你可能决定需要一个了解所有格式化和打印的对象。你可能会发现这对于一个对象来说太重了，而你需要的是三个或更多对象。其中一个对象可以是所有可能的支票布局的目录，可以对其进行查询关于如何打印支票的信息。另一个对象或一组对象可以是一个通用的打印接口，它了解所有类型打印机的所有信息（但对记账一无所知——这是购买而非编写的候选）。第三个对象可以使用另外两个的服务来完成任务。因此，每个对象都有一组其提供的内聚性服务。在良好的面向对象的设计中，每个对象只做一件事，但不会试图做太多。\n\
    \n这不仅允许发现可能购买的对象（打印机接口对象），还产生了可能在其他地方被重用的新对象（支票布局目录）。\n\n将对象视为服务提供者是一个伟大的简化工具。这不仅在设计过程中有用，当其他人试图理解你的代码或重用对象时也有用。如果他们能根据对象提供的服务看到该对象的价值，那么将其整合到设计中就会变得容易得多。\n\
    \n**隐藏的实现：** 将场地划分为类创建者（创建新数据类型的人）和客户端程序员（在应用程序中使用这些数据类型的类消费者）是有帮助的。客户端程序员的目标是收集一个装满类的工具箱，用于快速应用程序开发。类创建者的目标是构建一个只向客户端程序员暴露必要内容的类，并隐藏其他一切。为什么？因为它是隐藏的，客户端程序员无法访问它，这意味着类创建者可以更改隐藏部分而不必担心对其他人的影响。隐藏部分通常代表对象的内部，内部可能会被粗心或不了解的客户端程序员损坏，因此隐藏实现可以减少程序错误。\n\
    \n在任何关系中，拥有被所有参与方尊重的边界都是重要的。当你创建一个库时，你与客户端程序员建立了关系，对方也是一个程序员，但一个通过使用你的库来组合应用程序的程序员，可能是为了构建更大的库。如果类的所有成员对所有人可见，客户端程序员就可以对该类做任何事情，而且没有办法强制规则。尽管你真的倾向于让客户端不要直接操作你类的某些成员，但如果没有访问控制，就没有办法阻止它。一切对世界都是裸露的。\n\
    \n所以访问控制的第一个原因是让客户端程序员不要碰他们不接触的部分——这些部分对于数据类型的内部运行是必要的，但用户需要它们解决自己的特定问题。这实际上是对客户端程序员的服务，因为他们可以很容易地看到什么对他们是重要的，什么是可以忽略的。\n\
    \n访问控制的第二个原因是允许库设计人员更改类的内部机制，而不必担心这将如何影响客户端程序员。例如，你可能会以简单的方式实现一个特定的类以简化开发，然后发现你需要重写它以便使其运行得更快。如果接口和实现清晰地分离并保护，你就可以轻松地完成。\n\
    \nJava 使用三个显式关键字来设置类中的边界：`public`、`private` 和 `protected`。这些访问修饰符决定了谁可以使用后面的定义。`public`\
    \ 意味着后续元素对所有人可用。相反，`private` 关键字意味着除了你（类型的创建者在该类型的方法内部，没人可以访问该元素。`private` 是你和客户端程序员之间的一堵墙。试图访问\
    \ `private` 成员的人将得到编译错误。`protected` 关键字的作用类似于 `private`，例外是继承类可以访问 `protected`\
    \ 成员，但不能访问 `private` 成员。继承很快就会引入。\n\nJava 还有“默认”访问，如果你不使用上述修饰符之一，它就会生效。这通常被称为包级访问，因为类可以访问同一包（库组件）中其他类的成员，但在包之外，这些相同的成员看起来是\
    \ `private` 的。\n\n## 封装：\n\nJava 中的封装是将数据（变量）和作用于数据的代码（方法）封装成单个单元的机制。在封装中，类的变量将对其他类隐藏，并且只能通过当前类的方法访问。因此，它被称为数据隐藏。\n\
    \n在 Java 中实现封装：\n\n- 将类的变量声明为 `private`。\n- 提供公共的 setter 和 getter 方法来修改和查看变量的值。\n\
    \n## 示例：\n\n以下是一个如何在 Java 中实现封装的示例：\n\n```java\npublic class EncapTest {\n   \
    \ private String name; \n    private String idNum; \n    private int age;\n  \
    \  public int getAge() {\n        return age; \n    }\n    public String getName()\
    \ {\n        return name; \n    }\n\n    public String getIdNum() {\n        return\
    \ idNum; \n    }\n\n    public void setAge( int newAge) {\n        age = newAge;\
    \ \n    }\n\n    public void setName(String newName) {\n      name = newName;\
    \ \n    }\n\n    public void setIdNum(String newId) {\n      idNum = newId;\n\
    \    }\n}\n```\n\n公共的 `setXXX()` 和 `getXXX()` 方法是 EncapTest 类实例变量的访问点。通常，这些方法被称为\
    \ getter 和 setter。因此，任何想要访问变量的类都应该通过这些 getter 和 setter 来访问。\n\n可以使用以下程序访问 EncapTest\
    \ 类的变量：\n\n```java\npublic class RunEncap {\n  public static void main(String\
    \ args[]) {\n    EncapTest encap = new EncapTest(); \n    encap.setName(\"James\"\
    );\n    encap.setAge(20); \n    encap.setIdNum(\"12345ms\");\n    System.out.print(\"\
    Name : \" + encap.getName() + \" Age : \" + encap.getAge());\n  }\n}\n```\n\n\
    这将产生以下结果：\n\n## 输出:\n\n| Name : James Age : 20 |\n| :--- |\n\n"
