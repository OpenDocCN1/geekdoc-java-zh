  - '[PAGE 219]


    # Catching an exception:


    To see how an exception is caught, you must first understand the concept of a
    guarded region. This is a section of code that might produce exceptions and is
    followed by the code to handle those exceptions.


    # The try block:


    If you''re inside a method and you throw an exception (or another method that
    you call within this method method throws an exception), that method will exit
    in the process of throwing. If you don''t want a throw to exit the method, you
    can set up a special block within that "try" to capture the exception. This is
    called the try block because you "try" your various method calls there. The try
    block is an ordinary scope preceded by the keyword try: try {


    ```

    // Code that might generate exceptions }

    ```


    If you were checking for errors carefully in a programming language that didn''t
    support exception handling, you''d have to surround every method call with setup
    and error-testing code, even if you call the same method several times. With exception
    handling, you put everything in a try block and capture all the exceptions in
    one place. This means your code is much easier to write and read because the goal
    of the code is not confused with the error checking.'
  - '[PAGE 220]


    # Exception handlers:


    Of course, the thrown exception must end up somewhere. This "place" is the exception
    handler, and there''s one for every exception type you want to catch. Exception
    handlers immediately follow the try block and are denoted by the keyword catch:
    try {


    ```

    // Code that might generate exceptions

    } catch(Type1 id1){

    // Handle exceptions of Type1

    } catch(Type2 id2) {

    // Handle exceptions of Type2

    } catch(Type3 id3) {

    // Handle exceptions of Type3

    }

    ```


    Each catch clause (exception handler) is like a little method that takes one and
    only argument of a particular type.


    The identifier (id1, id2, and so on) can be used inside the handler, just like
    a method argument. Sometimes you never use the identifier because the type of
    the exception gives you enough information to deal with the exception, but the
    identifier must still be there.


    The handlers must appear directly after the try block. If an exception is thrown,
    the exception-handling mechanism goes hunting for the first handler with an argument
    that matches the type of the exception. It then enters that catch clause, and
    the exception is considered handled. The search for handlers stops once the catch
    clause is finished. Only the matching catch clause executes; it''s not like a
    switch statement in which you need a break after each case to prevent the remaining
    ones from executing. Note that within the try block, a number of different method
    calls might generate the same exception, but you need only one handler.


    # Termination vs. resumption:


    There are two basic models in exception-handling theory. Java support termination,3
    in which you assume that the error is so critical that there''s no way'
  - '[PAGE 221]


    to get back to where the exception occurred. Whoever threw the exception decided
    that there was no way to salvage the situation, and they don’t want to come back.


    The alternative is called resumption. It means that the exception handler is expected
    to do something to rectify the situation, and then the faulting method is retried,
    \,\ success the second time. If you want resumption, it means you still hope to
    continue execution after the exception is handled.


    If you want resumption-like behavior in Java, don''t throw an exception when you
    encounter an error. Instead, call a method that fixes the problem. Alternatively,
    place your try block inside while a loop that keeps reentering the try block until
    the result is satisfactory.


    Historically, programmers using operating systems that supported resumptive exception
    handling eventually ended up using termination-like code and skipping resumption.
    Although resumption sounds attractive at first, it isn’t quite so useful in practice.
    The dominant reason is probably the coupling that results: A resumptive handler
    would need to be aware of where the exception is thrown, and contain non-generic
    code specific to the throwing location. This makes the code difficult to write
    and maintain, especially for large systems where the exception can be generated
    from many points.'
