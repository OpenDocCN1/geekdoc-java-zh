    # The Java Main Class:


    If only a single Java class in your Java program contains a main() method, then
    the class containing the main() method is often referred to as the *main class*.


    You can have as many classes as you want in your project with a main() method
    in. But, the Java Virtual Machine can only be instructed to run one of them at
    a time. You can still call the other main() methods from inside the main() method
    the Java Virtual Machine executes (you haven''t seen how yet) and you can also
    start up multiple virtual machines which each execute a single main() method.'
  - '[PAGE 58]


    Access Control All good writers including those who write software know that a
    piece of work isn’t good until it’s been rewritten, often many times. If you leave
    a piece of code in a drawer for a while and come back to it, you may see a much
    better way to do it. This is one of the prime motivations for refactoring, which
    rewrites working code in order to make it more readable, understandable, and thus
    maintainable.


    There is a tension, in this desire to change and improve your code. There are
    often consumers (client programmers) who rely on some aspect of your code staying
    the same. So you want to change it; they want it to stay the same. Thus a primary
    consideration in object oriented design is to “separate the things that change
    from the things that stay the same.”


    This is particularly important for libraries. Consumers of that library must rely
    on the part they use, and know that they won’t need to rewrite code if a new version
    of the library comes out. On the flip side, the library creator must have the
    freedom to make modifications and improvements with the certainty that the client
    code won’t be affected by these changes.


    This can be achieved through convention. For example, the library programmer must
    agree not to remove existing methods when modifying a class in the library, since
    that would break the client programmer’s code. The reverse situation is thornier,
    however. In the case of a field, how can the library creator know which fields
    have been'
  - '[PAGE 59]


    accessed by client programmers? This is also true with methods that are only part
    of the implementation of a class, and not meant to be used directly by the client
    programmer. What if the library creator wants to rip out an old implementation
    and put in a new one? Changing any of those members might break a client programmer''s
    code. Thus the library creator is in a strait jacket and can''t change anything.


    To solve this problem, Java provides access specifiers to allow the library creator
    to say what is available to the client programmer and what is not. The levels
    of access control from “most access” to “least access” are **public, protected,
    package access** (which has no keyword), and **private**. From the previous paragraph
    you might think that, as a library designer, you''ll want to keep everything as
    “private” as possible, and expose only the methods that you want the client programmer
    to use. This is exactly right, even though it''s counterintuitive for people who
    program in other languages (especially C) and who are used to accessing everything
    without restriction.'
  - '[PAGE 60]


    # Package in java:


    Packages are used in Java in order to prevent naming conflicts, to control access,
    to make searching/locating and usage of classes, interfaces, enumerations and
    annotations easier, etc.


    A Package can be defined as a grouping of related types (classes, interfaces,
    enumerations and annotations) providing access protection and namespace management.


    Some of the existing packages in Java are –


    +   • java.lang – bundles the fundamental classes


    +   • java.io – classes for input , output functions are bundled in this package


    Programmers can define their own packages to bundle group of classes/interfaces,
    etc. It is a good practice to group related classes implemented by you so that
    a programmer can easily determine that the classes, interfaces, enumerations,
    and annotations are related.


    Since the package creates a new namespace there won''t be any name conflicts with
    names in other packages. Using packages, it is easier to provide access control
    and it is also easier to locate the related classes.'
  - '[PAGE 61]


    # Creating a Package:


    While creating a package, you should choose a name for the package and include
    a package statement along with that name at the top of every source file that
    contains the classes, interfaces, enumerations, and annotation types that you
    want to include in the package.


    The package statement should be the first line in the source file. There can be
    only one package statement in each source file, and it applies to all types in
    the file.


    If a package statement is not used then the class, interfaces, enumerations, and
    annotation types will be placed in the current default package.'
- md: "\n# Example:\n\nLet us look at an example that creates a package called animals.\
    \ It is a good practice to use names of packages with lower case letters to avoid\
    \ any conflicts with the names of classes and interfaces.\n\nFollowing package\
    \ example contains interface named *animals* –\n\n```java\n/* File name : Animal.java\
    \ */\npackage animals; interface Animal {\n    public void eat(); public void\
    \ travel(); }\n\n```\n\nNow, let us implement the above interface in the same\
    \ package *animals* –\n\n```java\npackage animals; /* File name : MammalInt.java\
    \ */\npublic class MammalInt implements Animal {\n```\n\n```java\npublic void\
    \ eat() {\n    System.out.println(\"Mammal eats\"); }\n    public void travel()\
    \ {\n    System.out.println(\"Mammal travels\");\n    public int noOfLegs() {\n\
    \        return 0; }\n}\n    public static void main(String args[]) {\n    MammalInt\
    \ m = new MammalInt(); m.eat(); m.travel(); }\n}\n```\n\nNow compile the java\
    \ files as shown below –\n\n```\n$ javac -d . Animal.java $ javac -d . MammalInt.java\n\
    ```\n\nYou can execute the class file within the package and get the result as\
    \ shown below.\n\nMammal eats\nMammal travels\n\n# The import Keyword:\n\nIf a\
    \ class wants to use another class in the same package, the package name need\
    \ not be used. Classes in the same package find each other without any special\
    \ syntax.\n\n# Example:\n\nHere, a class named Boss is added to the payroll package\
    \ that already contains Employee. The Boss can then refer to the Employee class\
    \ without using the payroll prefix, as demonstrated by the following Boss class.\n\
    \n```java\npackage payroll; public class Boss {\n    public void payEmployee(Employee\
    \ e) {\n    e.mailCheck();\n}}\n```\n\nWhat happens if the Employee class is not\
    \ in the payroll package? The Boss class must then use one of the following techniques\
    \ for referring to a class in a different package.\n\n- The fully qualified name\
    \ of the class can be used. For example – payroll.Employee\n\n- The package can\
    \ be imported using the import keyword and the wild card (*). For example –\n\n\
    ```java\nimport payroll.*;\n```\n\n- The class itself can be imported using the\
    \ import keyword. For example –\n\n```java\nimport payroll.Employee;\n```\n\n\
    **Note** – A class file can contain any number of import statements. The import\
    \ statements must appear after the package statement and before the class declaration.\n\
    \n# Access Modifiers As the name suggests access modifiers in Java help to restrict\
    \ the scope of a class, constructor, variable, and method or data member. There\
    \ are four types of access modifiers available in java:\n\n1. Default – No keyword\
    \ required\n2. Private\n3. Protected\n4. Public\n\n- Visible to the package, the\
    \ default. No modifiers are needed.\n- Visible to the class only (private).\n\
    - Visible to the world (public).\n- Visible to the package and all subclasses\
    \ (protected).\n\n# Default Access Modifier - No Keyword:\n\nDefault access modifier\
    \ means we do not explicitly declare an access modifier for a class, field, method,\
    \ etc.\n\nA variable or method declared without any access control modifier is\
    \ available to any other class in the same package. The fields in an interface\
    \ are implicitly any public static final and the methods in an interface are by\
    \ default public.\n\n# Example:\n\nVariables and methods can be declared without\
    \ any modifiers, as in the following examples –\n\n```java\nString version = \"\
    1.5.1\";\nboolean processOrder() {\n  return true; }\n```\n\n# Private Access\
    \ Modifier – Private:\n\nMethods, variables, and constructors that are declared\
    \ private can only be accessed within the declared class itself.\n\nPrivate access\
    \ modifier is the most restrictive access level. Class and interfaces cannot be\
    \ private.\n\nVariables that are declared private can be accessed outside the\
    \ class, if public getter methods are present in the class.\n\nUsing the private\
    \ modifier is the main way that an object encapsulates itself and hides data from\
    \ the outside world.\n\nExample:\n\nThe following class uses private access control\
    \ :\n\n```java\npublic class Logger {\n    private String format; public String\
    \ getFormat() {\n        return this.format;\n    }\n    public void setFormat(String\
    \ format) {\n        this.format = format;\n    }\n}\n```\n\nHere, the format\
    \ variable of the Logger class is private, so there's no way for other classes\
    \ to retrieve or set its value directly.\n\nSo, to make this variable available\
    \ to the outside world, we defined two public methods: getFormat(), which returns\
    \ the value of format, and setFormat(String), which sets its value.\n\n# Public\
    \ Access Modifier – Public:\n\nA class, method, constructor, interface, etc. declared\
    \ public can be accessed from any other class. Therefore, fields, methods, blocks\
    \ declared inside a public class can be accessed from any class belonging to the\
    \ Java Universe.\n\nHowever, if the public class we are trying to access is in\
    \ a different package, then the public class still needs to be imported. Because\
    \ of class inheritance, all public methods and variables of a class are inherited\
    \ by its subclasses.\n\nExample:\n\nThe following function uses public access\
    \ control –\n\n```java\npublic static void main(String[] arguments) {\n  // ...\n\
    }\n```\n\nThe main() method of an application has to be public. Otherwise, it\
    \ could not be called by a Java interpreter (such as java) to run the class.\n\
    \n# Protected Access Modifier – Protected:\n\nVariables, methods, and constructors,\
    \ which are declared protected can be accessed only by subclasses.\n\nThe protected\
    \ access modifier cannot be applied to interfaces. Methods, fields can, however,\
    \ be declared protected.\n\nExample:\n\nThe following parent class uses protected\
    \ access:\n\n```java\nclass AudioPlayer {\n    protected boolean openSpeaker(Speaker\
    \ sp) {}\n}\nclass StreamingAudioPlayer {\n    boolean openSpeaker(Speaker sp)\
    \ {}\n}\n```\n\nHere, if we define openSpeaker() as private, then it would not\
    \ be accessible from any class other than AudioPlayer. If we define it as public,\
    \ then it would become accessible to all the world. But our intention is to expose\
    \ this to subclass, that's why we used protected.\n\n# Access Control and Inheritance\n\
    \nThe following rules for inherited methods are enforced:\n\n- Methods declared\
    \ public in a superclass also must be public in subclasses.\n- Methods declared\
    \ protected in a superclass must either be protected or public in subclasses.\n\
    - Methods declared private are not inherited at all, so there is no rule for them.\n\
    \n# CHAPTER 5: VARIABLES, DATA TYPES & KEYWORDS\n\n# Variables\n\nVariables are\
    \ used to store information to be referenced and manipulated in a computer program.\
    \ They also provide a way of labeling data with a descriptive name, so our programs\
    \ can be understood more clearly by the reader and ourselves. It is helpful to\
    \ think of variables as containers that hold information. Their sole purpose is\
    \ to label and store data. This data can then be used throughout your program.\n\
    \nA variable's name is called an identifier. For the most part an identifier is\
    \ a unique word that a programmer, or in this case you, picks to name a variable.\n\
    \n# Identifiers:\n\nIdentifiers, which are considered symbols or tokens, are words\
    \ that you invent which you then assign a meaning. Identifiers can be as simple\
    \ as the letter i or complex as @OhHAICmHasIdentifier01. identifier is the word\
    \ that's used to name any function, variable, or type of data you create. When\
    \ the keyword class is used it's followed by another word called an identifier.\
    \ In other words, when you name some data Charles you access that data by the\
    \ name Charles.\n\n```java\nclass MyNewClassWriting\n{}\n```\n"
