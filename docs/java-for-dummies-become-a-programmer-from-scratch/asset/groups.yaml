    私有访问修饰符是最限制性的访问级别。类和接口不能是私有的。\n\n如果类中存在 `public` getter 方法，则声明为 `private` 的变量可以在类外访问。\n\
    \n使用 `private` 修饰符是对象封装自身并向外部隐藏数据的手段。\n\n示例：\n\n以下类使用了私有访问控制：\n\n```java\npublic\
    \ class Logger {\n    private String format; public String getFormat() {\n   \
