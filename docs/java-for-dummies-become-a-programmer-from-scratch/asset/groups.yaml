    ## 强类型：


    这与你在键盘上打字快慢没有关系！

    Java 能够识别数字在书写方式上的差异。像 1 这样的整数与 1.0 是不同的，尽管我们可以认为它们具有相同的值。这些差异中的某些可以通过添加一个字母来区分。

    因此，1.0 和 1.0f 实际上也是不同的数字。Java 是一种强类型编程语言。当一种编程语言使用强类型时，你被要求保持不同类型分开。


    这意味着 `1 + 1.0f` 可能会产生问题。因为这两个数字实际上是不同类型的数字，在允许操作发生之前，我们必须将其中一个转换为另一个以匹配它。要从一种类型转换为另一种类型，我们必须告诉
    Java 我们打算使用所谓的“强制转换运算符（cast operator）”来完成从 1 到 1.0 的转换。除了改变内存的使用方式外，类型还限制了在程序员团队工作时可能出现的任何问题。


    ## 理解浮点数


    多年来，浮点数一直是计算机关注的焦点。获得浮点精度是许多早期计算机科学家的目标。由于小数点后可以跟随无限种可能的数字，因此使用二进制计算是不可能完全表示任何分数的。


    一个常见的例子是 $\pi$，我们称其为 pi。假设 3.14 之后有无限数量的数字。即使在今天，计算机也被用来计算小数点后的数以百亿位数字。


    计算机预留了浮点数的某些比特位来表示小数点在数字中的位置，但即使这样也是受限的。第一位通常是符号位，设置数字的负范围或正范围。随其后的 8 位是该数字的指数，称为尾数（mantissa）。`float`
    值可以将小数点向任一方向移动 38 位，但它受限于其能够存储的值。


    在没有特殊考虑的情况下，计算机无法处理任意大的数字。要将 `float` 强制转换为 `int`，你需要更加显式化。


    这就是为什么 Java 要求你使用强制转换，你需要在 `int Z = (int)Zmove;` 中添加 `(int)`。


    `(int)` 是一个强制转换运算符；或者说 `(type)` 充当从右侧类型到左侧所需类型的转换器。


    ## 关键字


    关键字是特殊的单词或符号，用于告诉编译器执行特定的任务。例如，行首的关键字 `class` 告诉编译器你正在创建一个类。类声明是告诉编译器你即将创建一个新类的代码行。单词出现的顺序很重要。英语需要句子和语法来向读者正确传达我们的思想。


    在代码中，无论是 Java 还是其他，编程都需要语句和语法来向计算机正确传递指令。


    ```

    class className

    {

    // code goes here

    }

    ```


    每个类都需要一个名字；在上面的示例中，我们将类命名为 `className`，尽管我们可以很容易地将其命名为 `Charles`。当命名新类时，该名称就变成一个新的标识符。这对于每个变量名也是如此，尽管作用域限制了变量标识符的存在时长和位置。


    我们学习了变量和作用域。


    你不能将关键字用于 Java 预期用途之外任何地方。虽然有例外，但通常，关键字为你提供了特定的命令。


    在 Java 编程语言中，关键字是 53 个保留字之一，它们在语言中具有预定义的含义；由于由于，程序员不能使用关键字作为变量、方法、类或任何其他标识符的。由于它们在语言中的特殊功能，大多数
    Java 集成开发环境都使用语法高亮，用不同的颜色显示关键字，以便于识别。


    关键字列表：


    -   **abstract** `Abstract` 用于在 java 中实现抽象。没有方法定义的方法必须声明为 `abstract`。

    -   **assert (added in JavaSE 1.4)** 断言描述断言始终为真；如果断言失败，通常会导致中止执行。

    -   **boolean** 布尔值用于定义“真”或“假”。

    -   **break** 用于结束执行。

    -   **byte** `byte` 关键字用于声明可以持有 8 位符号补码整数。

    -   **case** `switch` 语句中的标签，执行匹配的语句。

    -   **catch** 与 `try` 块结合使用，指定当抛出特定异常时要执行的操作。

    -   **char** 定义可以持有任何字符的变量。

    -   **class** 定义实例字段、方法和内部类。

    -   **continue** 用于从循环结束恢复执行。

    -   **default** `default` 关键字可选地用于 `switch` 语句，在没有匹配项时执行的语句块；从 Java 8 开始，`default`
    关键字还用于指定接口中的默认实现。

    -   **do** `do` 关键字与 `while` 结合使用创建 `do-while` 循环，先执行语句块然后测试布尔表达式。

    -   **double** `double` 关键字用于声明可以持有 64 位双精度 IEEE 754 浮点数。

    -   **else** `else` 关键字与 `if` 结合使用创建 `if-else` 语句。

    -   **enum (added in JavaSE 5.0)** 用于声明枚举类型的 关键字。

    -   **extends** 用于声明以指定父类；用于接口声明以指定一个或多个父接口。

    -   **final** 定义不可更改或不可派生的实体。具体来说：`final` 类不能被子类，`final` 方法不能被重写，`final` 变量在执行命令的左侧表达式中最多出现一次。

    -   **finally** 用于定义之前由 `try` 关键字定义的块的语句块。


    '
