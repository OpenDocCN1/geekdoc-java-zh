  - '[PAGE 336]


    “I think the most important skill to learn is meta-learning,” says Kasra.

    That’s what separates engineers and programmers to me. There’s something to be
    said about spending 12 weeks at a course learning one framework really well, but
    I really respect (and like to hire) devs that are able to learn whatever they
    need, on the spot, to do a task.


    So, what’s the best way to learn new skills?


    Reading about what you want to do is a start. Steve Klabnik, who’s a Rust core
    team member and ranked #37 on the all-time Rails contributors list, seeks any
    established research on the topic and also tries to figure out how people who
    are good at the thing he wants to do achieve their results.


    The most important thing is to just do it.


    +   1. Try to do the thing, probably do it poorly.

    2. Figure out where I’m going wrong, and what I need to improve 3.

    Work on what I’ve identified.

    4. Repeat.


    CTO of Bellhops, Adam Haney, says his favorite trick to learning new languages
    is to reimplement a previous project using the paradigms of new language. For
    example, he would take something he wrote as object oriented code in C++ and then
    reimplement it in a functional language.


    I feel like this practice has prepared me to evaluate new technologies because
    I understand the underlying Computer Science principles even if I don’t know the
    intricate details of the language or framework.


    If you struggle with memorization, Andrei recommends building a memory palace.
    The general idea is that you use your brain’s powerful visual memory, and map
    that to more technical data, like numbers. He also strongly believe in techniques
    like The Seinfeld Calendar, which is based on Jerry Seinfeld’s idea'
  - '[PAGE 337]


    that you don’t need to work hard every day — you only need to progress a little
    bit every day. “So with his calendar, you just check off whether you worked on
    the project today or not,” Andrei says. “There are some nice apps that will help
    you with this.


    On Android, I use HabitBull. As your streak gets longer, you feel more motivated
    to keep it running


    # 7. LEARN HOW TO WORK WITH OTHERS


    Another way you can learn new things is to work on projects with other people.


    The legend of the lone coder is a myth,” Adam says. “Almost substantial projects
    require teamwork.” This means you’ll need to learn the skills of breaking a problem
    down into multiple parts, build good interfaces between parts of the codebase,
    and collaborate on architecture.


    Everyone makes mistakes – that’s just how programming is. Beginners should strive
    to hang around great engineers and receive feedback. “Don’t be sensitive about
    your mistakes,” Jonathan stresses. “That’s how you improve. Admit your mistakes
    and learn from them.”


    Getting your code reviewed will also force you into thinking about why you did
    something and understand code better. “My favorite engineers to work with are
    the ones who don’t let you off the hook about the code you write,” says Ross.
    “I remember when I was first challenged, and it freaked the shit out of me. But
    that night I went home and studied till I knew I could at least attempt a confident
    explanation of how to pass this around closures.”


    So, where do you find mentors or peers who can pair up with you and help you out?'
- md: "\nAccording to Jack, local meetups often have sessions where free coaching\
    \ is offered to anyone who would like it. Other free resources include Twitter\
    \ groups, Slack groups, and IRC channels.\n\n## 8. DON’T JUST CODE – BUILD SOLUTIONS\n\
    \n> \"A lot of programming isn't about code; it's about understanding other disciplines\
    \ or standards.\"\n\nYou can’t solve someone’s problem with code if you don’t\
    \ understand their problem. Working on projects exposed to me to the way that\
    \ small businesses, marketers, brokers and other professionals approach the world.\
    \ When you understand how they currently solve problems, you can work with them\
    \ to come up with new and better solutions.\n\n—Adam Haney, CTO of Bellhops\n\n\
    One thing Ross wishes he had done earlier in his career was to better appreciate\
    \ the discipline and history of Software Engineering itself. \n\nThese days it’s\
    \ easy to dive into the vocation and only focus on the “coding.” Especially browser\
    \ coders or web app coders in a booming market working with huge dynamic programming\
    \ languages (Ruby, JavaScript) and vastly quirky “computer” languages and formats\
    \ (HTML, CSS), we might be tempted to spend all our time racing to master the\
    \ myriad tools, frameworks and APIs so we can crush interviews or level up at\
    \ the job. Building a product on a team is always a social exercise, and a particular\
    \ one that with a unique set of challenges that are mostly non-technical. Like,\
    \ turns out the hardest thing in software engineering is deciding what to build,\
    \ not how; though maybe this is less true in as the JavaScript mycelium rhizomes\
    \ dramatically.\n\nRoss said it took him a while to understand that most of software\
    \ engineering happens in your head first. “Coding will likely become the easy\
    \ part soon. But a dope engineer can draw a solution with boxes, circles, and\
    \ lines—and I know that's a learned skill because I've been doing it more and\
    \ I'm getting better at it.” The realization that coding was much more “chin in\
    \ hand and white boarding” was actually resonant for him, he wrote a blog post\
    \ about it.\n\n“Remember this is about human beings and our lives, not just about\
    \ the technology that you’re coding with,” says Derick. Learn how humans think,\
    \ interact and deal with each other. Then represent what you’ve learned in your\
    \ software architecture and design.\n\n## 9. DON’T RE-INVENT THE WHEEL\n\nFinally,\
    \ no matter how good you get, your code will never be 100% original, as many problems\
    \ have been solved in your language of choice already. “Absolutely ain’t no shame\
    \ in keeping the wheel as is,” Ross assures. “However, when it’s time to commit,\
    \ the better damn sure you can defend that code to your team with Dwayne Johnson-like\
    \ charm and confidence.\n\n> Don’t re-invent the wheel just because you don’t\
    \ understand abstraction,” Mike reminds us.\n\nHowever, this isn’t to say there\
    \ is absolutely no value to re-inventing the wheel. Matthew Zeiler, CEO of Clarifai,\
