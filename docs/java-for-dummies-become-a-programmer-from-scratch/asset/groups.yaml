    \ (DOCUMENTATION)：包含了提高程序可读性的注释。注释是一种非执行性语句，有助于阅读和理解程序，特别是当你的程序变得越来越复杂时。它仅仅是仅对程序员存在的信息，会被编译器忽略。一个良好的程序应该包含描述程序目的、作者姓名、程序创建日期和时间的注释。该部分是可选的，且注释可能出现在程序的任何地方。\n\
    \nJava 编程语言支持三种类型的注释。\n\n**单行注释（或行尾注释）：** 它以双斜杠符号 (/) 开始，并在当前行结束处终止。编译器会忽略 `//`\
    \ 到行尾的所有内容。\n\n例如：\n\n```\n// 计算两个数字之和\n```\n\n多行注释：Java 程序员可以使用类似 C/C++ 风格的注释，该注释以定分隔符\
    \ `/*` 开始，以 `*/` 结束。分隔符之间的所有文本都会被编译器忽略。这种风格的注释可以用于行的一部分、整行，或者更常见地用于定义多行注释。\n\n\
    例如：\n\n```java\n/*计算两个数字之和 */\n```\n\n注释不能嵌套。换句话说，你不能注释一行已经包含传统注释的行。例如，`/* x =\
    \ y /* * initial value */ + z; /*/` 是错误的。\n\n**文档注释（Documentation comments）：**\
    \ 这种注释风格是 Java 中的新特性。此类注释以分隔符 `/**` 开始，以 `*/` 结束。编译器也忽略这类注释，就像它忽略使用 `/*` 和 `*/`\
    \ 的注释一样。这种注释的主要目的是自动生成程序文档。`javdoc` 工具读取这些注释并使用它们来准备 HTML 格式的程序文档。\n\n例如：\n\n\
    ```java\n/**此处包含的文本将成为程序文档的一部分 */\n```\n\n## 2. 包语句 (PACKAGE STATEMENT)：Java 允许你将类分组到一个名为“包”（package）的集合中。包语句包含一条提供包声明的语句。它必须作为源文件的第一条语句，出现在任何类或接口声明之前。该语句是可选的。例如：假设你在源文件的第一条语句中写了以下包声明。\n\
    \n```java\npackage employee;\n```\n\n该语句声明此源文件中定义的所有类和接口都是 `employee` 包的一部分。源文件中只能出现一个包声明。\n\
    \n## 导入语句 (IMPORT STATEMENT)：Java 包含了许多存储在包中的预定义类。为了在你的程序中引用这些标准预定义类，你需要使用全限定名（即\
    \ `包名.类名`）。但这是一个非常繁琐的任务，因为需要重复输入包名以及类名。因此，更好的替代方案是使用导入语句。\n\n导入语句用于引用在其他包中定义的类。导入语句写在包语句之后、任何类定义之前。你可以导入特定的类，也可以导入该包中的所有类。例如：如果你想使用导入语句导入\
    \ `java.util` 包中的 `Date` 类，请写下 `import java.util.Date;`。\n\n该语句允许程序员在代码中使用简单的类名\
    \ `Date`，而不是全限定类名 `java.util.Date`。\n\n与包语句不同，你可以在程序中指定多个导入语句。\n例如：\n\n```java\n\
    import java.util.Date; /* 仅导入 java.util 包中的 Date 类 */\nimport java.applet.*; //\
    \ 导入 java.applet 包中的所有类 \n```\n\n### 接口部分 (INTERFACE SECTION)：在接口部分，我们指定接口。接口与类相似，但只包含常量和方法声明。接口不能实例化。它们只能被类实现（implemented）或被其他接口扩展（extended）。这是一个可选部分，当我们希望程序中实现多继承特性时使用。\n\
    \n```java\ninterface stack\n{\n    void push(int item); // 将项目插入栈中\n    int pop();\
    \ // 从栈中删除一个项目\n}\n```\n\n### 类部分 (CLASS SECTION)：类部分描述了程序中用户定义类的信息。类是字段（数据变量）和在字段上操作的方法的集合。Java\
    \ 中的每个程序至少包含一个类，即包含 `main` 方法的类。`main()` 方法是程序实际开始执行的地方，并按照指定的顺序执行语句。\n\n`main`\
    \ 方法可以创建对象、求值表达式、调用其他方法等。当到达 `main` 的结束时，程序终止，控制交回操作系统。\n\n类部分是强制性的。\n\n在讨论了 Java\
    \ 程序的结构之后，我们现在讨论一个在屏幕上显示字符串 \"Hello Java\" 的程序。\n\n```java\n// 一个在屏幕上显示信息的程序\n\
    class HelloWorld\n{\n    public static void main(String args[])\n    {\n     \
    \   System.out.println(\"Hello Java\");\n    }\n}\n```\n\n## main 方法 (The main\
    \ Method)\n\nJava 程序是按照特定顺序执行的指令序列。由于指令是按顺序执行的，因此程序有起点也有终点。\n\n为了执行你的 Java 程序，你需要向虚拟机指示从哪里开始执行。在\
    \ Java 中，所有指令（代码）必须位于类内部。类是组合相关数据和指令的方法。因此，类可以可以包含变量和方法。变量可以包含数据，而方法则组合一组操作。\n\
    \n以下是之前在类声明中 main 方法定义的形式：\n\n```java\npackage myjavaconde;\n\npublic class MyClass\
    \ {\n\n    public static void main(String[] args) {\n\n    }\n}\n```\n"
