  mdcn: "\n\n## extends 关键字:\n\n`extends` 是用于继承类属性的关键字。以下是 `extends` 关键字的语法。\n\n##\
    \ 语法\n\n```java\nclass Super {\n    ...\n    ...\n}\nclass Sub extends Super {\n\
    \    ...\n    ...\n}\n```\n\n## 示例:\n\n```java\nclass Calculation {\n    int z;\
    \ public void addition(int x, int y) {\n    z = x + y; System.out.println(\"The\
    \ sum of the given numbers:\"+z);\n    }\n    public void Subtraction(int x, int\
    \ y) {\n    z = x - y; System.out.println(\"The difference between the given numbers:\"\
    +z);\n    }\n}\n\npublic class My_Calculation extends Calculation {\n    public\
    \ void multiplication(int x, int y) {\n    z = x * y; System.out.println(\"The\
    \ product of the given numbers:\"+z);\n    }\n    public static void main(String\
    \ args[]) {\n        int a = 20, b = 10; My_Calculation demo = new My_Calculation();\n\
    \        demo.addition(a, b); demo.Subtraction(a, b); demo.multiplication(a, b);\n\
    \    }\n}\n```\n\n编译并执行上述代码，如下所示。\n\n`javac My_Calculation.java; java My_Calculation`\n\
    \n执行程序后，将产生以下结果：\n\n## 输出:\n\nThe sum of the given numbers:30\nThe difference\
    \ between the given numbers:10\nThe product of the given numbers:200\n\n在给程序中，当创建\
    \ My_Calculation 类的对象时，内部会被父类内容的副本。这就是为什么使用子类对象可以访问父类的成员。\n\n## super 关键字:\n\n\
    **super** 关键字与 **this** 关键字相似。以下是 `super` 关键字的用法场景：\n\n- 它用于**区分父类的成员**和子类的成员，当它们具有相同的名称时。\n\
    - 它用于从子类中**调用父类类**的构造函数。\n\n## 区分成员:\n\n如果一个类继承另一个类的属性，并且如果父类的成员名称与子类相同，那么为了区分这些变量，我们像下面所示使用\
    \ `super` 关键字。\n\n```java\nsuper.variable\nsuper.method();\n```\n\n## 示例:\n\n\
    ```java\nclass Super_class {\n    int num = 20;\n    // 父类的 display 方法\n    public\
    \ void display() {\n        System.out.println(\"This is the display method of\
    \ superclass\"); \n    }\n}\n```\n\n```java\npublic class Sub_class extends Super_class\
    \ {\n    int num = 10;\n    // 子类的 display 方法\n    public void display() {\n \
    \       System.out.println(\"This is the display method of subclass\"); \n   \
    \ }\n\n    public void my_method() {\n        // 实例化子类 Sub_class\n        Sub_class\
    \ sub = new Sub_class();\n        // 调用子类的 display() 方法 sub.display();\n     \
    \   // 调用父类的 display() 方法 super.display();\n        // 打印子类变量 num 的值 System.out.println(\"\
    value of the named num in sub class:\"+ sub.num);\n        // 打印父类变量 num 的值 System.out.println(\"\
    value of the named num in super class:\"+ super.num); \n    }\n\n    public static\
    \ void main(String args[]) {\n        Sub_class obj = new Sub_class(); obj.my_method();\
    \ \n    }\n}\n```\n\n使用以下语法编译并执行上述代码。\n\n`javac Super_Demo.java; java Super_Demo`\n\
    \n执行程序后，你将得到以下结果：\n\n## 输出\n\n| | |\n| :--- | :--- |\n| This is the display method\
    \ of subclass | This is the display method of superclass |\n| value of the variable\
    \ named num in sub class:10 | value of the super class:20 |\n\n## 继承类型:\n\n所示所示多种类型的继承。\n\
    \n| 继承类型 | 代码结构 |\n| :--- | :--- |\n| 单级继承 | public class A { |\n| | 类 A | ......\
    \ |\n| | public class B extends A { |\n| | } |\n| | 类 B | |\n| 多级继承 | public class\
    \ A {..................} |\n| | 类 A | public class B extends A {..................}\
    \ |\n| | 类 B | public class C extends B {..................} |\n| | 类 C | |\n\
    | 层次继承 | public class A {..................} |\n| | 类 A | public class B extends\
    \ A {..................} |\n| | 类 B | public class C extends A {..................}\
    \ |\n| | 类 C | |\n| 多重继承 | public class A {..................} |\n| | 类 A | public\
    \ class B {..................} |\n| | 类 B | public class C extends A, B {..................}\
    \ |\n| | 类 C | } // Java 不支持多重继承 |\n\n需要记住的一个重要事实是，Java 不支持多重继承。这意味着一个类不能扩展多个类。因此，以下内容是非法的——\n\
    \n## 示例:\n\n```java\npublic class Sub extends Animal, Mammal{}\n```\n\n然而，一个类可以实现一个或多个接口，这帮助\
    \ Java 解决了多重继承的不可能性问题。\n\n"
