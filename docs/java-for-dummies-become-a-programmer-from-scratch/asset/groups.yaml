    must extend beyond the content of this book. You may also have some preconceived
    notions about what a programming is.


    I can''t change that, but you should be willing to change your thoughts on the
    topic if you make discoveries contrary to your knowledge. Keep an open mind.


    Computer artists often believe that programming is a technical subject that is
    incompatible with art. I find the contrary to be true. Programming is an art,
    much as literature and design is an art. Programming just has a lot of obscure
    rules that need to be understood for anything to work.'
  - '[PAGE 9]


    # Do I Need to Know Math?


    With complex rules in mind, does programming require the knowledge of complex
    mathematics? Actually, unless you program mathematical software, only a bit of
    geometry is nice to have. Most of the examples here use only a tiny bit of math
    to accomplish their purposes.


    Mathematics and programming do overlap quite a lot in their methodology. Math
    taught in schools provides a single solution. Programming results tend to behave
    a bit like a math proof, but only the proof isn''t just another bit of math. Rather,
    the proof of your code means that your zombies chase after humans.


    A considerable amount of math required has been done for you by the computer.
    It is just up to you to know what math to use, and then plug in the right variables.'
  - '[PAGE 10]


    # Programming as a Form of Expression There is a deeper connection between words
    and meaning in programming. This connection is more mechanical, but flexible at
    the same time. In relation to a programming language, programmers like to call
    this “expressiveness.” When you write words in literature, you infer most if not
    all of the meaning. When programming inference isn''t implied, you’re free to
    define your own meanings for words and invent words freely.


    One common merging of art and code appears within a video game. Anytime characters
    can react to each other and react to user interaction, which conveys a greater
    experience. An artist, an animator, or an environment designer should have some
    ability to convey a richer experience to the audience. A character artist can
    show a monster to his or her audience; but to really experience the creature,
    the monster should glare, grunt, and attack in reaction to the audience.'
  - '[PAGE 11]


    # A Brief History of Computer Programming:

    How Programming Came to Be Mechanical Computers:


    The first programmable computer is arguably the Babbage machine built by Charles
    Babbage in the 1820s. Being made of tens of thousands of moving parts and weighing
    several tons, it was a gigantic mechanical calculator that could display a 31-digit
    number. It was called the Difference Engine, and in 1824 Babbage won a gold medal
    from the British Astronomical Society for correcting a set of tables used to chart
    the movement of planets through the sky. In 1833, a countess Augusta Ada King
    of Lovelace, commonly known as Ada Lovelace, met Babbage at a party where she
    was introduced to the Difference Engine. Several years later, it became evident
    that she understood the machine better than Charles himself. Despite being housewife
    to the Earl of Lovelace, she wrote several documents on the operation of the Difference
    Engine as well as its upgraded version, the Analytical Engine. She is often considered
    to be the first computer programmer for her work with the Difference Engine and
    its documentation.'
- md: '

    # Logic:


    In 1848, George Boole gave us Boolean logic. It would take nearly a century between
    the Difference Engine and the first general programmable computer to make its
    appearance. Thanks to George, today our computers count in binary (1s and 0s),
    and our software thinks in terms of true or false. In 1887, Dor Eugene Felt built
    a computing machine with buttons; thanks to him, our computers have keyboards.
    In the 1890s, a tabulating machine used paper with holes punched in it representing
    1s and 0s to record the US census. Back then it saved US$2 million and 6 years
    of work. In the 1900s, between Nicola Tesla and Alexander Graham Bell, modern
    computers were imminent with the invention of the transistor. In 1936, Konrad
    Zuse made the Z1 computer, another mechanical computer like that of Babbage, but
    this time it used a tape with holes punched in it like the tabulating machine.
    He’d later move on to make the Z3 in 1941.


    # Computer Science:


    In the 1940s, Alan Turing, a British computer scientist, designed and built an
    encrypted message decoder called the Bombe that used electromechanical switches
    for helping the Allied forces during World War II. Between the 1930s and the 1950s,
    Turing informed the computer scientists that computers can, in theory, solve anything
    calculable, calling this concept Turing completeness. All of these components
    began to lead toward our modern computer. In the mid-1940s, John Von Neumann demonstrated
    with the help of his theory that the computer can be built using simple components.
    This way the software that controls the hardware can add the complex behavior.
    Thanks to Tesla and Bell, the Z3 was made completely of electronic parts. It included
    the first use of logic while doing calculations, making it the first Turing-complete
    computer. In 1954, Gordon Teal at Texas Instruments introduced the silicon-based
    transistor, a key component for building solid-state electronics that are used
    today in every computer.


    # Software:


    The Z3 was programmed using Plankalkül, the first high-level programming language,
    invented by Zuse shortly after he finished building the machine. In 1952, Grace
    Hopper created the first compiler, software that could translate human-readable
    words into machine operations. For the first time, the programmer didn’t need
    to know how the transistors operated in the hardware to build software for the
    computer to run. This opened computer programming to a whole new audience. Between
    the 1950s and the 1970s, computers and computer languages were growing in terms
    of complexity and capability. In 1958, John McCarthy invented LISP at the Massachusetts
    Institute of Technology (MIT). Object oriented programming appeared in Simula
    67 in 1967. Imperative and procedural programming made its appearance in Pascal
    in 1970.


    # Modern Computer Language: Bell Labs, started by Bell in the 1920s, hired Dennis
    Ritchie in 1967. In 1974, Ritchie published the C programming language that has
    become the most popular computer programming language. In 1983, C++ made its appearance
    as "C with Classes." James Gosling, Mike Sheridan, and Patrick Naughton initiated
    the Java project in June 1991. Java was originally designed for interactive television,
    but it was too advanced for the digital cable television industry at the time.
    The language was initially called Oak an oak tree that stood outside Gosling''s
    office. The project went by the name Greenland which was finally renamed, from
    Java coffee. Gosling designed Java with a C/C++-style syntax that system and application
    programmers would find familiar.


    Sun Microsystems released the first public implementation as Java 1.0 in 1995.
    It promised "Write Once, Run Anywhere" (WORA), providing no-cost run-times on
    popular platforms. Fairly secure and featuring configurable security, it allowed
    network- and file-access restrictions. Major web browsers soon incorporated the
    ability to run Java applets within web pages, and Java quickly became popular.
    The Java 1.0 compiler was re-written in Java by Arthur van Hoff to comply strictly
    with the Java 1.0 language specification. With the advent of Java 2 (released
    initially as J2SE 1.2 in December 1998 – 1999), new versions had multiple configurations
    built for different types of platforms. J2EE included technologies and APIs for
    enterprise applications typically run in server environments, while J2ME featured
    APIs optimized for mobile applications. The desktop version was renamed J2SE.
    In 2006, for marketing purposes, Sun renamed new J2 versions as Java EE, Java
    ME, and Java SE, respectively.


    In 1997, Sun Microsystems approached the ISO/IEC JTC 1 standards body and later
    the Ecma International to formalize Java, but it soon withdrew from the process.
    Java remains a facto standard, controlled through the Java Community Process.
    At one time, Sun made most of its Java implementations available without charge,
    despite their proprietary software status. Sun generated revenue from Java through
    the selling of licenses for specialized products such as the Java Enterprise System.


    On November 13, 2006, Sun released much of its Java virtual machine (JVM) as free
    and open-source software, (FOSS), under the terms of the GNU General Public License
    (GPL). On May 8, 2007, Sun finished the process, making all of its JVM''s core
    code available under free software/open-source distribution terms, aside from
    a small portion of code to which Sun did not hold the copyright.


    # The Future of Computer Languages:


    The International Business Machines Corporation (IBM), a US company founded in
    the 1920s, is currently engineering new technology using particle physics discovered
    nearly a century ago. Modern spintronics derived from the work of German physicists
    in the late 1920s. Without particle physics and physicists such as Friedrich Hermann
    Hund, we wouldn’t understand quantum tunneling, and the solid-state disk or universal
    serial bus (USB) thumb drive wouldn’t exist. After the discovery and confirmation
    of the Higgs boson, you might ask “Why bother?” This question might not get a
    good answer for another hundred years, but it’ll be worth it. Java is not the
    last computer language; many others have been introduced recently, most notably
    an entry by Google called Go.


    Microsoft, not to be outdone, has also introduced F#. There are many relatively
    new programming languages that have been made popular in recent years. Though
    the languages are different, the principal concepts are all the same. Once the
    basic ideas are understood, it is easy to apply the knowledge obtained here to
    new languages and continue to learn. Today quantum computers begin to make their
    appearance. Dealing with today’s transistors, we send and receive values. Quantum
    computers don’t work with 1s and 0s; rather they store values between 0 and 1.
    To deal with this, new programming languages are currently being developed.


    # CHAPTER 2 | GETTING STARTED


    # What Is Programming?


    It''s all about writing code. Programming is a process in which we organize data
    and use logic to do something with those data. The data are everything a computer
    can store; they can range from numbers to zombie characters in a video game. You
    do this by writing text into files called source code. Source code written into
    these files replaces punch cards used by the computing machines half a century
    ago. When data are combined with logic and then written into a single file, they''re
    called a class. Classes are also data, and as such can be managed with more logic.


    img/81147dcafcee2d431dfe108a34b4c094_19_0.png)


    Classes are used to create objects in the computer''s memory and can be duplicated
    to have a life of their own. Classes are used to build objects. Each piece of
    data within the class becomes a part of that object. Different chunks of data
    inside of a class are called class members. Class members can also be chunks of
    logic called functions or methods.


    For Example, in a game with a horde of zombies, each zombie is duplicated or instantiated
    from a zombie class. Each zombie has unique values for each attribute or data
    element in the class. This means hit points, and locations are unique for each
    duplicate zombie object. Objects created from a class are called instances. Similar
    to families, objects can inherit properties from one another. The child sometimes
    called a subclass inherits attributes from its parent. For instance, the child
    created from a zombie may inherit the parent''s hunger for

