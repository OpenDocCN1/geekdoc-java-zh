    \ at the end of the current line. The compiler ignores everything // to the end\
    \ of the line.\n\nFor example:\n\n```\n// Calculate sum of two numbers\n```\n\n\
    Multiline Comment: Java programmer can use C/C++ comment style that begins with\
    \ delimiter /* and ends with */. All the text written between the delimiter is\
    \ ignored by the compiler. This style of comments can be used on part of a line,\
    \ a whole line or more commonly to define multi-line comment.\n\nFor example:\n\
    \n```java\n/*calculate sum of two numbers */\n```\n\nComments cannot be nested.\
    \ In other words, you cannot comment a line that already includes traditional\
