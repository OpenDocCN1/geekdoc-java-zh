  - "[PAGE 153]\n\n# For Loop:\n\nTo gain a bit more control over the execution of\
    \ a loop, we have another option.\nThe for loop requires three different statements\
    \ to operate. The first statement is called an initialization, the second is a\
    \ condition, and the third is an operation.\n\nSyntax:\n\n```\nfor(initialization;\
    \ Boolean_expression; update) {\n  // Statements\n}\n```\n\nHere is the flow of\
    \ control in a for loop –\n\n+   - The initialization step is executed first\n\
    \n+   - Next, the Boolean expression is evaluated. If it is true, the body of\
    \ the loop is executed. If it is false, the body of the loop will not be executed\
    \ and control jumps to the next statement past the for loop."
  - '[PAGE 154]


    +   • After the body of the for loop gets executed, the control jumps back up
    to the update statement. This statement allows you to update any loop control
    variables. This statement can be left blank with a semicolon at the end.


    +   • The Boolean expression is now evaluated again. If it is true, the loop executes
    and the process repeats (body of loop, then update step, then Boolean expression).
    After the Boolean expression is false, the for loop terminates.'
