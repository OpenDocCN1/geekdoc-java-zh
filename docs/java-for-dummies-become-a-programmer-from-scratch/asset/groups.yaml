    # Basic exceptions:


    An exceptional condition is a problem that prevents the continuation of the current
    method or scope. It’s important to distinguish an exceptional condition from a
    normal problem, in which you have enough information in the current context to
    somehow cope with the difficulty. With an exceptional condition, you cannot continue
    processing because you don’t have the information necessary to deal with the problem
    in the current context. All you can do jump out of the current context and relegate
    to a higher context. This is what happens when you throw an exception.


    Division is a simple example. If you’re to divide by zero, it’s worth checking
    for that condition. But what does it mean that the denominator is zero? Maybe
    you know, in the context of the problem you’re trying to solve in that particular
    method, how to deal with a zero denominator. But if it’s an unexpected value,
    you can’t deal with it and must throw an exception rather than continuing along
    execution path.


    When you throw an exception, several things happen. First, the exception object
    is created in the same way that any Java object is created: on the heap, with
    new. Then the current path of execution (the one you couldn’t continue) is stopped
    and the reference for the exception object is ejected from the current context.
    At this point the exception-handling mechanism takes over and begins to look for
    an appropriate place to continue executing the program. This appropriate place
    is the exception handler, whose job is to recover from the problem so the program
    can either another tack or just continue.


    As a simple example of throwing an exception, consider an object reference called
    t. It’s possible that you might be passed a reference that hasn’t been initialized,
    so you might want to check before calling a method using object reference. You
    can send information about the error into a larger context by creating an object
    representing your information and “throwing” it out of your current context. This
    is called throwing an exception. Here’s what it looks like: if(t== null)


    ```

    throw new NullPointerException();

    ```'
  - '[PAGE 217]


    This throws the exception, which allows you in the current context to abdicate
    responsibility for thinking about the issue further. It’s just magically handled
    somewhere else. Precisely where where will be shown shortly.


    Exceptions allow you to think of everything that you do as a transaction, and
    the exceptions guard those transactions: "...the fundamental premise of transactions
    is that we needed exception handling in distributed computations. Transactions
    are the computer equivalent of contract law. If anything goes wrong, we''ll just
    blow away the whole computation."You can also think about exceptions as a built-in
    undo system, because (with some care) you have various recovery points in your
    program. If a part of the program fails, the exception will "undo" back to a known
    stable point in the program.


    One of the most important aspects of exceptions is that if something happens,
    they don’t allow a program to continue along its ordinary path. This has been
    a real problem in languages like C and C++; especially C, which had no way to
    force a program to stop going down a path if a problem occurred, so it was possible
    to ignore problems for a long time and get into a completely inappropriate state.
    Exceptions allow you (if nothing else) force the program to stop and tell you
    what went wrong, or (ideally) force the program to deal with the problem and return
    to a stable state.


    # Exception arguments:


    As with any object in Java, you always create exceptions on the heap using new,
    which allocates storage and calls a constructor. There are two constructors in
    all standard exceptions: The first is the default constructor, and the second
    takes a string argument so that you can place pertinent information in the exception:
    throw new NullPointerException("=null"); This string can be extracted using various
    methods, as you’ll see.


    The keyword produces a number of interesting results. After creating an exception
    object with new, you give the resulting reference to throw. The object is, in
    effect, "returned" from the method, even though object type isn’t normally what
    the method is designed to return. A simplistic way to think about exception handling
    is as different kind of return mechanism, although you get into trouble if you
    take that analogy too far. You can also exit from ordinary scopes by throwing
    an exception. In either case, an exception object is returned, and the method
    or scope exits.'
