    ## Strong Typing:


    This has nothing to do with how hard you type on the keyboard!

    Java sees a difference between numbers in how they are written. A whole number
    like 1 is different from 1.0, even though we can think of them as having the same
    value. Some of these differences can be added by adding a letter.

    Therefore, 1.0 and 1.0f are actually different numbers as well. Java is a strongly
    typed programming language. When a programming language uses strong types you''re
    expected to keep the different types separated.


    This means that a 1 + 1.0f can create a problem. Because the two numbers are actually
    different types of numbers we have to convert one of them to match the other before
    the operation is allowed to take place. To convert from one type to another we
    have to tell Java that we intend to make that conversion from a 1 to a 1.0 by
    using what''s called a cast operator. Aside from changing how memory is used,
    types also limit any problems which might come about when working in a team of
    programmers.


    ## Understanding Floating Points


    Floating point numbers have been a focus of computers for many years. Gaining
    floating point accuracy was the goal of many early computer scientists. Because
    there are an infinite possibilities of how many numbers can follow a decimal point,
    it''s impossible to truly represent any fraction completely using binary computing.


    A common example is $\pi$, which we call pi. It''s assumed that there are an endless
    number of digits following 3.14. Even today computers are set loose to calculate
    the hundreds of billions of digits beyond the decimal point.


    Computers set aside some of the bits of a floating point number aside to represent
    where the decimal appears in the number, but even this is limited. The first bit
    is usually the sign bit, setting the negative or positive range of the number.
    The following 8 bits is the exponent for the number called a mantissa. A float
    value can move the decimal 38 digits in either direction, but it''s limited to
    the values it''s able to store.


    Without special considerations, computers are not able to handle arbitrarily large
    numbers. To cast a float into an int, you need to be more explicit.


    That''s why Java requires you to use the cast and you need to add the (int) in
    int Z = (int)Zmove;


    The (int) is a cast operator; or rather (type) acts as a converter from the type
    on the right to the type needed on the left.


    ## Keywords


    Keywords are special words, or symbols, that tell the compiler to do specific
    things. For instance, the keyword class at the beginning of a line tells the compiler
    you are creating a class. A class declaration is the line of code that tells the
    compiler you''re about to create a new class. The order in which words appear
    is important. English requires sentences and grammar to properly convey our thoughts
    to the reader.


    In code, Java or otherwise, programming requires statements and syntax to properly
    convey instructions to the computer.


    ```

    class className

    {

    // code goes here

    }

    ```


    Every class needs a name; in the above example we named our class className, although
    we could have easily named the class Charles. When a new class is named the name
    becomes a new identifier. This also holds true for every variable''s name, though
    scope limits how long and where the variable''s identifier exists.


    We have learned about variables and scope.


    You can''t use keywords for anything other than what Java expects them to be used
    for. There are exceptions, but in general, keywords provide you with specific
    commands.


    In the Java programming language, a keyword is one of 53 reserved words that have
    a predefined meaning in the language; because of this, programmers cannot use
    keywords as names for variables, methods, classes, or as any other identifier.
    Due to their special functions in the language, most integrated development environments
    for Java use syntax highlighting to display keywords in a different color for
    easy identification.


    List of Keywords:


    - **abstract** Abstract is used to implement the abstraction in java. A method
    which doesn''t have method definition must be declared as abstract and the class
    containing it must be declared in the sub classes. You can''t use abstract keyword
    with variables and constructors.

    - **assert (added in J2SE 1.4)** Assert describes a predicate (a true-false statement)
    placed in a java-program to indicate that the developer thinks that the predicate
    is always true at that place. If an assertion evaluates to false at run-time,
    an assertion failure results, which typically causes execution to abort. Optionally
    enable by ClassLoader method.

    - **boolean** Defines a boolean variable for the values "true" or "false" only.

    - **break** Used to end the execution in the current loop body.

    - **byte** The byte keyword is used to declare a field that can hold an 8-bit
    signed two''s complement integer. This keyword is also used to declare that a
    method returns a value of the primitive type byte.

    - **case** A statement in the switch block can be labeled with one or more case
    or default labels. The switch statement evaluates its expression, then executes
    all statements that follow the matching case label;

    - **catch** Used in conjunction with a try block and an optional finally block.
    The statements in the catch block specify what to do if a specific type of exception
    is thrown by the try block.

    - **char** Defines a character variable capable of holding any character of the
    java source file''s character set.

    - **class** A that defines the implementation of a particular kind of object.
    A class definition defines instance and class fields, methods, and inner classes
    as well as specifying the interfaces the class implements and the immediate superclass
    of the class. If the superclass is not explicitly specified, the superclass is
    implicitly Object.

    - **continue** Used to resume program execution at the end of the loop body. If
    followed by a label, continue resumes execution at the end of the labeled loop.

    - **default** The default keyword can optionally be used in a switch statement
    to label a block of statements to be executed if no case matches the value; Alternatively,
    the default keyword can also be used to declare default values in an annotation.
    From Java 8 onwards, the default keyword is also used to specify that a method
    in an interface provides the default implementation.

    - **do** The do keyword is used in conjunction with while to create a do-while
    loop, which executes a block of statements associated with the loop and then tests
    a boolean expression associated with the while. If the expression evaluates to
    true, the block is executed again; this continues until the expression evaluates
    to false.

    - **double** The double keyword is used to declare a variable that can hold 64-bit
    double precision IEEE 754 floating-point number. This keyword is also used to
    declare that a method returns a value of the primitive type.

    - **else** The else keyword is used in conjunction with if to create an if-else
    statement, which tests a boolean expression; if the expression evaluates to true,
    the block of statements associated with the if are evaluated; if it evaluates
    to false, the block of statements associated with the else are evaluated.

    - **enum (added in J2SE 5.0)** A Java keyword used to declare an enumerated type.
    Enumerations extend the base class Enum.

    - **extends** Used in a declaration to specify the superclass; used in an interface
    declaration to specify one or more superinterfaces. Class X extends class Y to
    add functionality, either by adding fields or methods to class Y, or by overriding
    methods of class Y. An interface Z extends one or more interfaces by adding methods.
    Class X is said to be a subclass of class Y; Interface Z is said to be a subinterface
    of the interfaces it extends.

    - **final** Define an entity that cannot be changed nor derived from later. More
    specifically: a final class cannot be subclassed, a final method cannot be overridden,
    and a final variable can occur at most once as a left-hand expression on an executed
    command. All methods in a final class are implicitly final.

    - **finally** Used to define a block of statements for a block defined previously
    by the try keyword. The finally block is executed after execution exits the try
    block and any associated catch clauses regardless of whether an exception was
    thrown or caught, or execution left method

    '
