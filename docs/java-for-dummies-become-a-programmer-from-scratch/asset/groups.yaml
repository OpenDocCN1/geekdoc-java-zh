    ## Benefits of Encapsulation:


    - The fields of a class can be made read-only or write-only.

    - A class can have total control over what is stored in its fields.

    - The users of a class do not know how the class stores its data. A class can
    change the data type of a field and users of the class do not need to change any
    of their code.


    ## Reusing the implementation:


    Once a class has been created and tested, it should (ideally) represent a useful
    unit of code. It turns out that this reusability is not nearly as easy to achieve
    as many would hope; it takes experience and insight to produce a reusable object
    design. But once you have such a design, it needs to be reused. Code reuse is
    one of the greatest advantages object-oriented programming languages provide.


    The simplest way to reuse a class is to use an object of that class directly,
    but you can also place an object of that class inside a new class. We call this
    “creating a member object.” Your new class can be made up of any number and type
    of other objects, in any combination that you need to achieve the functionality
    desired in your new class. Because you are composing a new class from existing
    classes, this concept is called composition (if the composition happens dynamically,
    it’s usually called aggregation). Composition is often referred to as a “has-a”
    relationship, as in “A car has an engine.”


    ![](img/81147dcafcee2d431dfe108a34b4c094_198_0.png)


    (This UML diagram indicates composition with the filled diamond, which states
    there is one car. I will typically use a simpler form: just a line, without the
    diamond, to indicate an association.5) Composition comes with a great deal of
    flexibility. The member objects of your new class are typically private, making
    them inaccessible to the client programmers who are using the class. This allows
    you to change those members without disturbing existing client code. You can also
    change the member objects at run time, to dynamically change the behavior of your
    program. Inheritance, which is described next, does not have this flexibility
    since the compiler must place compile-time restrictions on classes created with
    inheritance.)


    Because inheritance is so important in object-oriented programming, it is often
    heavily emphasized, and the new programmer can get the idea that inheritance should
    be used everywhere. This can result in awkward and overly complicated designs.
    Instead, you should first look to composition when creating new classes, since
    it is simpler and more flexible. If you take this approach, your designs will
    be cleaner. Once you''ve had some experience, it will be reasonably obvious when
    you need inheritance.


    **Inheritance:** By itself, the idea of an object is a convenient tool. It allows
    you to package data and functionality together by concept, so you can represent
    an appropriate problem-space idea rather than being forced to use the idioms of
    the underlying machine. These concepts are expressed as fundamental units in the
    programming language by using the class keyword.


    It seems a pity, however, to go all the trouble to create a class and then be
    forced to create a new one that might have similar functionality. It''s nicer
    if we can take the existing class, clone it, and then make additions and modifications
    to the clone. This is effectively what you get with inheritance, with the exception
    that if the original class (called the base class or superclass or parent class)
    is changed, the modified “clone” (called the derived class or inherited class
    or subclass or child class) also reflects these changes.


    ![](img/81147dcafcee2d431dfe108a34b4c094_200_0.png)


    (The Arrow in this UML diagram points from the derived class to the base class.
    As you will see, there is commonly more than one derived class.) A type does more
    than describe the constraints on a set of objects; it also has a relationship
    with other types. Two types can have characteristics and behaviors in common,
    but one type may contain more characteristics than another and may also handle
    more messages (or handle them differently). Inheritance expresses this similarity
    between types by using the concept of base types and derived types. A base type
    contains all of the characteristics and behaviors that are shared among the types
    derived from it. You create a base type to represent the core of your ideas about
    some objects in your system. From the base type, you derive other types to express
    the different ways that this core can be realized.)


    For example, a trash-recycling machine sorts pieces of trash. The base type is
    “trash”, and each piece of trash has a weight, a value, and so on, and can be
    shredded, melted, or decomposed. From this, more specific types of trash are derived
    that may have additional characteristics (a bottle has a color) or behaviors (an
    aluminum can may be crushed, a steel can be magnetic). In addition, some behaviors
    may be different (the value of paper depends on its type and condition). Using
    inheritance, you can build a type hierarchy that expresses the problem you’re
    trying to solve in terms of its types.


    A second example is the classic “shape” example, perhaps used in a computer-aided
    design system or game simulation. The base type is “shape,” and each shape has
    a size, a color, a position, and so on. Each shape can be drawn, erased, moved,
    colored, etc. From this, specific types of shapes are derived (inherited)—circle,
    square, triangle, and so on—each of which may have additional characteristics
    and behaviors. Certain shapes may be flipped, for example. Some behaviors may
