- md: "\n## 2) Static variables\n\nStatic variables are class variables declared with\
    \ static keyword. Static variables are initialized only once. Static variables\
    \ are also used in declaring constant along with final keyword.\n\n```java\nclass\
    \ Student\n{\n  String name;\n  int age;\n  static int instituteCode=1101;\n}\n\
    ```\n\nHere instituteCode is a static variable. Each object of Student class will\
    \ share instituteCode property.\n\n## Additional points on static variable:\n\n\
    - static variable are also known as class variable.\n- static means to remain\
    \ constant.\n- In Java, it means that it will be constant for all the instances\
    \ created for that class.\n- static variable need not be called from object.\n\
    - It is called by classname.static variable name\n\nNote: A static variable can\
    \ never be defined inside a method i.e. it can never be a local variable.\n\n\
    ## Example:\n\nSuppose you make 2 objects of class Student and you change the\
    \ value of static variable from one object. Now when you print it from other object,\
    \ it will display the changed value. This is because it was declared static i.e.\
    \ it is constant for every object created.\n\n```java\nclass Student{\n    int\
    \ a;\n    static int id = 35;\n\n    void change(){\n        System.out.println(id);\n\
    \    }\n}\npublic class StudyTonight {\n    public static void main(String[] args)\
    \ {\n        Student o1 = new Student();\n        Student o2 = new Student();\n\
    \n        o1.change();\n        Student.id = 1;\n        o2.change();\n    }\n\
    }\n```\n\n## Output:\n\n35\n1\n\n## 3) Local variables\n\nLocal variables are\
    \ declared in method, constructor or block. Local variables are initialized when\
    \ method, constructor or block start and will be destroyed once its end. Local\
    \ variable reside in stack. Access modifiers are not used for local variable.\n\
    \n```java\nfloat getDiscount(int price)\n{\nfloat discount;\ndiscount=price*(20/100);\n\
    return discount;\n}\n```\n\nHere discount is a local variable.\n\n## Additional\
    \ points on Local variable:\n\n- Local variables are declared in methods, constructors,\
    \ or blocks.\n- Local variables are created when the method, constructor or block\
    \ is entered and the variable will be destroyed once it exits the method, constructor\
    \ or block.\n- Access modifiers cannot be used for local variables.\n- Local variables\
    \ are visible only within the declared method, constructor or block.\n- Local\
    \ variables are implemented at stack level.\n- There is no default value for local\
    \ variables, so local variables should be declared and an initial value assigned\
    \ before use.\n\n## Example:\n\n```java\npublic class Test {\n    public void\
    \ age() {\n        int age = 0;\n        age = age + 7;\n        System.out.println(\"\
    age is: \" + age);\n    }\n    public static void main(String[] args[]) {\n  \
    \      Test test = new Test();\n        test.age();\n    }\n}\n```\n\nHere, age\
    \ is a local variable defined inside age() method and its scope is limited to\
    \ this method. This will produce the following result:\n\nOutput\nage is: 7\n\n\
    ## Data Types\n\nData types represent the different values to be stored in the\
    \ variable. In Java, there are two types:\n\n- Primitive data types\n- Non-primitive\
    \ data types\n\nimg/8147dcafcee2d431dfe108a34c094_0.png\n\n| Data Type | Default\
    \ Value | Size |\n| :--- | :--- | :--- |\n| boolean | false | 1 bit |\n| char\
    \ | '\\u0000' | 2 byte |\n| byte | 0 | 1 byte |\n| short | 0 | 2 byte |\n| int\
    \ | 0 | 4 byte |\n| long | 0L | 8 byte |\n| float | 0.0f | 4 byte |\n| double\
    \ | 0.0d | 8 byte |\n\n## Why char uses 2 bytes in java?\n\nIt is because java\
    \ uses Unicode system than the lowest range of ASCII system. To get detail explanation\
    \ about visit next page.\n\n## Types\n\nWhen we assign a variable value such as\
    \ int i = 1; we are making an interesting assumption. Computers use a wide variety\
    \ of different types of data for storing numbers. So far we've seen the word int\
    \ being thrown around though we know what int is.\n\nAs humans can easily conceptualize\
    \ numbers as units of measure, converting between the word one and zero isn't\
    \ so easy for a computer. The keyword int is short for integer. Integers are whole\
    \ number values. This is a fundamental part of Java. Other built-in types include\
    \ float, double, string, and object. Less commonly used built-in types are char,\
    \ short, and byte. Altogether, there are eight different built-in types.\n\nAll\
    \ of these, except object and string, are value types. Every type of data you're\
    \ able to build must be based on all of these built-in types. The system which\
    \ creates all of these floats, doubles, and bools is rooted in the origin of computing.\
    \ Remember the punch tapes and pieces of paper with holes in them? Those were\
    \ records of ones and zeros which were fed into computers for storing in the form\
    \ of mechanical switches, either on or off. The patterns represented numbers or\
    \ logic.\n\nToday, we still use the same system of 1s and zeros, or binary, only\
    \ we don't need to punch holes in paper to tell the computer what to do. The methods\
    \ of creating and storing the instructions have become many times more complex,\
    \ but nonetheless the principle of the one and zero are the same. These are called\
    \ bits; one possible origin for that name is the little bits of paper that were\
    \ left over from punching all of the holes in the paper cards.\n\n## Value and\
    \ Reference Types:\n\nThe int, float, double, and bool are commonly used value\
    \ types. The basics of this usage pattern relate to the system that stores and\
    \ organizes the computer's memory. When you talk about computer storage you use\
    \ the word megabyte or gigabyte. Value types are stored with a very specific purpose\
    \ in mind: to keep track of a numeric value.\n\n## NOTE:\n\nThe word mega refers\
    \ to how many millions of bytes a component in your computer can store. Have you\
    \ ever thought about what a byte actually is? A byte is what is called an 8-bit\
    \ unsigned integer, or a system of using 8 bits to form a number. What this means\
    \ is that it's a whole number like 0, 7, or 255. The word unsigned indicates that\
    \ the number cannot be negative, like -5. A one or zero in computer terms is called\
    \ a bit. We won't go into detail on how computers use bits to count, and it's\
    \ a rather fun thing to learn on your own.\n\nHowever, it's important to know\
    \ that a byte has a limited range, from 0 to 255. I'll just leave you with the\
    \ idea that you could count up to 1023 on your 10 fingers if you used binary rather\
    \ than decimal. Your fingers can be used to represent a 10-bit unsigned integer.\
    \ The computer's calculation capabilities used to be far more limited than they\
    \ are today. An 8-bit game console made in the 1980s had a limited number of colors,\
    \ 256 to be exact. This limitation was based on the number of bits the processor\
    \ could handle. Shortly after, floating point coprocessors were introduced, which\
    \ had a much larger numeric range allowed, closer to 32 bits.\n\nThe string and\
    \ object types differ a bit in how they are stored. These types are a composite\
    \ of any number of smaller elements. These are referred as reference types or\
    \ sometimes called nullable types because Java doesn't look to a single element\
    \ in memory to get data from it.\n"
  mdcn: "\n\n## 2) 静态变量\n\n静态变量是使用 `static` 关键字声明的类变量。静态变量只初始化一次。静态变量还与 `final` 关键字一起用于声明常量。\n\
    \n```java\nclass Student\n{\n  String name;\n  int age;\n  static int instituteCode=1101;\n\
    }\n```\n\n `instituteCode` 是一个静态变量。`Student` 类的每个对象将共享 `instituteCode` 属性。\n\n\
    ## 关于静态变量的补充：\n\n- 静态变量也被称为类变量。\n- `static` 表示保持不变。\n- 在 Java 中，这意味着它对于该类创建的所有实例来说都是恒不变的。\n\
    - 静态变量不需要通过对象调用。\n- 通过 `类名.静态变量名` 调用。\n\n注意：静态变量永远不能定义在方法内部，即它永远可以是局部变量。\n\n##\
    \ 示例：\n\n假设你为 `Student` 类创建了 2 个对象，并从一个对象更改了静态变量的值。现在当你从另一个对象打印它时，它将显示更改后的值。这是因为它是被声明为\
    \ `static` 的，也就是说它对于创建的每个对象都是恒不变的。\n\n```java\nclass Student{\n    int a;\n  \
    \  static int id = 35;\n\n    void change(){\n        System.out.println(id);\n\
    \    }\n}\npublic class StudyTonight {\n    public static void main(String[] args)\
    \ {\n        Student o1 = new Student();\n        Student o2 = new Student();\n\
    \n        o1.change();\n        Student.id = 1;\n        o2.change();\n    }\n\
    }\n```\n\n## 输出：\n\n35\n1\n\n## 3) 局部变量\n\n局部变量声明在方法、构造函数或块中。局部变量在方法、构造函数或块开始时初始化，并在结束结束后销毁。局部变量位于栈（stack）中。局部变量不使用访问修符。\n\
    \n```java\nfloat getDiscount(int price)\n{\nfloat discount;\ndiscount=price*(20/100);\n\
    return discount;\n}\n```\n\n这里 `discount` 是局部变量。\n\n## 关于局部变量的补充：\n\n- 局部变量在方法、构造函数或块中声明。\n\
    - 局部变量在进入方法、构造函数或块时创建，变量在退出方法、构造函数或块后将被销毁。\n- 局部变量不能使用访问修符。\n- 局部变量仅在声明的方法、构造函数或块内可见。\n\
    - 局部变量在栈级别实现。\n- 局部变量没有默认值，因此在使用之前应该对局部变量进行声明并分配初始值。\n\n## 示例：\n\n```java\npublic\
    \ class Test {\n    public void age() {\n        int age = 0;\n        age = age\
    \ + 7;\n        System.out.println(\"age is: \" + age);\n    }\n    public static\
    \ void main(String[] args[]) {\n        Test test = new Test();\n        test.age();\n\
    \    }\n}\n```\n\n在这里，`age` 是定义在 `age()` 方法内部的局部变量，其作用范围局限于该方法。这将产生以下结果：\n\n输出\n\
    age is: 7\n\n## 数据类型\n\n数据类型表示存储在变量中的不同值。在 Java 中，有两种类型：\n\n- 原始数据类型（Primitive\
    \ data types）\n- 非原始数据类型（Non-primitive data types）\n\nimg/8147dcafcee2d431dfe108a34c094_0.png\n\
    \n| 数据类型 | 默认值 | 大小 |\n| :--- | :--- | :--- |\n| boolean | false | 1 bit |\n|\
    \ char | '\\u0000' | 2 byte |\n| byte | 0 | 1 byte |\n| short | 0 | 2 byte |\n\
    | int | 0 | 4 byte |\n| long | 0L | 8 byte |\n| float | 0.0f | 4 byte |\n| double\
    \ | 0.0d | 8 byte |\n\n## 为什么 char 在 Java 中使用 2 个字节？\n\n这是因为 Java 使用的是 Unicode\
    \ 系统而不是 ASCII 系统的最低范围。要了解详细解释请访问下一页。\n\n## 类型\n\n当我们给变量赋值时（例如 `int i = 1;`），我们正在进行一种有趣的假设。计算机使用各种不同类型的数据来存储数字。到目前为止，我们一直在看到\
    \ `int` 这个词，尽管我们知道 `int` 是什么。\n\n由于人类可以很容易将数字概念化为测量单位，因此对于计算机来说，单词“一”和“零”之间的转换并不容易。`int`\
    \ 关键字是 `integer`（整数）的缩写。整数是整数值。这是 Java 的基础部分。其他内置类型包括 `float`、`double`、`string`\
    \ 和 `object`。不常用的内置类型有 `char`、`short` 和 `byte`。总共有八种不同的内置类型。\n\n除了 `object` 和\
    \ `string` 之外，所有这些都是值类型。你能够构建的任何类型都必须基于这些内置类型。创建所有这些 `float`、`double` 和 `bool`\
    \ 的系统植根于计算的起源。还记得打孔带和带孔的纸片吗？那些是 1 和 0 的记录，被输入到计算机中以机械开关（开或关）的形式存储。这些模式代表了数字或逻辑。\n\
    \n今天，我们仍然使用相同的 1 和 0 系统（即二进制），只是我们不需要在纸上打孔来告诉计算机要做什么。创建和存储指令的方法已经变得了许多倍，但 1 和\
    \ 0 的原理是相同的。这些被称为位（bits）；该名称的一个可能来源是打孔时留下的小纸片。\n\n## 值类型和引用类型：\n\n`int`、`float`、`double`\
    \ 和 `bool` 是常用的值类型。这种用法与存储和组织计算机内存的系统有关。\n\n## 注意：\n\n`mega` 词指的是计算机组件可以存储的百万字节。你考虑过字节（byte）到底是什么吗？字节被称为\
    \ 8 位无符号整数，或者说是使用 8 位组成一个数字的系统。这意味着它不能是负数，例如 -5。计算机术语中的一个或零被称为位（bit）。我们不会详细介绍计算机如何使用位来计数，这是一个非常有趣的点，你可以自己学习。\n\
