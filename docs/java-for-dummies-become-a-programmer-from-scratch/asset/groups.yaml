    # 编写 Java：Java 是一种基于英语的编程语言；与任何类 C 编程语言一样，它可以被拆分为标记（tokens），即计算机可以理解的最小意义的文本片段。标记由单个字符或一系列字符组成。例如，在下面这个简单的语句中，有五个标记。


    ![](img/81147dcafcee2d431dfe108a34b4c094_36_0.png)


    标记可以分为关键字、标识符、字面量、运算符、分隔符和空白符。上面的语句包含了五个标记，并通过空格提供了间距。关键字 `int` 后面紧跟着标识符 `i`。接着是一个运算符
    `=`，它将运算符左侧的标识符赋值为右侧字面量 `0` 的值。最后一个标记 `;` 是一个分隔符，用于结束该语句。我们尚未涵盖的空白符和注释不被视为标记，尽管它们可以充当分隔符。使用适当的格式或风格是非常重要的。

    让我们来看一下代码示例：


    ```

    int i = 0;

    int j = 1;

    ```


    上面的代码是两个语句，`;` 分隔符防止计算机将代码误读为单个语句。然而，编写代码涉及人类的操作，因此代码需要让人类或任何其他可能阅读你代码的生命形式能够易读。恰当的代码意味着遵循特定的格式风格。我们将在本章晚些时候详细讨论恰当的代码风格。每组字符（或文本）都会由计算机中的词法分析器（有时称为
    lexer）转换成一个符号。这个过程被称为标记化（tokenization），或者用计算机科学家的的话来说，分析器将你的代码标记为符号。一旦完成标记，符号就会被解析（parsed）；这个过程将标记组织成计算机遵循的指令。这种独特的词汇将程序员描绘了一群奇怪的外星生物，拥有完全自己的语言；但我向你，与大多数程序员聊天时，并不经常谈论分析器。这看起来似乎是一项巨大的工作，而且我们跳到了更复杂的计算机科学话题，但这一切都发生在后台，你不需要看到这些的发生。


    理解编译器的作用以及它的工作原理是非常重要的，这样你就能以计算机可以理解的方式编写代码。这就是为什么一个简单的拼写错误会导致词法分析器停止构建代码。我们很快就会学习编写用于分析、标记和解析的代码。


    计算机无法解释或猜测你正在尝试做什么。


    因此，如果你误写了 `int i = 0:` 而不是 `int i = 0;`，最后一个标记无法被词法分析器转换为正确的符号，因此该语句将完全无法被解析。代码在编译之前就会导致错误。


    # 分隔符标记


    最常见的分隔符是 `;` 分号。这个标点符号用于结束一条代码语句。其他分隔符成对出现。大括号成对使用，用于分隔代码语句组。左大括号是 `{`，其尖端指向组的外部；它与关闭大括号的
    `}` 配对。圆括号以 `(` 开始以 `)` 结束，而方括号以 `[` 开始以 `]` 结束。不同的起始和结束括号、方括号和圆括号有特定的用途，并用于帮助识别它们的用途。还有角括号
    `<` 和 `>`；这些用于包围数据类型。不要忘记单引号 `''` 和双引号 `"` 也是成对使用的，用于包裹所谓的字符串（strings）。


    注意：

    在许多文字处理器中，通常使用起始引号和结束引号（“ 和 ”）。词法分析器不识别这些“智能引号”，因此编程文本编辑器使用直引号（"）来代替。一旦你意识到编程中使用的字母、数字和所有其他字符都被解析为美国标准信息交换代码（ASCII）或
    Unicode 转换格式（UTF-8）、16 或 32，这些微妙的变化就不再微妙了。


    ASCII 和 UTF 都是计算机用于读取文本时使用的字符数据库的名称。计算机不使用眼睛阅读。相反，它们使用数字数据库来查找使用的每个字符。因此，如果我们使用
    UTF-16，`“` 看起来更像 `0x201C`，而 `"` 看起来像 `0x0022`。代码中的大括号用于分隔语句。圆括号通常用于接收数据。方括号 `[]`
    经常用于标识数组。我们稍后会讨论数组，但在解释它们之前，你可以先想象成类似于电子表格或网格纸。


    ```

    int[] arrayNumbers = {1, (int) 3.0, 9000};

    ```


    上面的语句将三个数字赋值给数组。大括号包含一对用逗号分隔的语句。大括号中的第二个语句是将带有点（`.`）的数字转换为不带点的数字。这需要一些解释，但习惯看到这种东西是有好处的。我们很快就会什么是数组，以及点运算符。


    通常，在学习编程时，你会看到很多奇怪的标记，它们看起来可能没有任何意义。这取决于你是否观察遇到的每一个标记并尝试理解它的作用。


    如果没有任何语句是有意义的，那没关系。在这一点上，我们并不要求你现在就知道这一切意味着什么，但你很快就会了。


    # 运算符标记：


    运算符类似于关键字，但只使用少数非单词字符。冒号分号 `:` 是一个运算符；与关键字不同，运算符会根据它们出现的位置或使用方式来改变其功能。这种行为转变被称为运算符重载（operator
    overloading），这是一个复杂的课题，我们稍后会涉及到。同样重要的是，要知道当你需要时可以可以创建自己的运算符。Java 中的逗号有不同的含义。它们用于分隔不同的值，例如：


    ```

    for (int i = 0, j = 1; i++, j++)

    ```


    # 其他运算符标记：


    泛而言运算符是处理变量之间特定操作的特殊字符。运算符和变量出现的表示或顺序通常通过以下数学语法：`a + b = c` 来教授。然而，在编程中，倾向于使用
    `c = a + b;`；这种变化是因为 Java 中的 `=` 运算符工作方式与其数学课上通常教授的功能不同。` 运算符的左侧是赋值侧，右侧是操作侧。这重点放在被赋值的值上而不是如何赋值。结果比如何求解更重要。在编程中，上面的示例应该读作“给
    c 赋值 a b”。


    字面量：字面量有许多不同的形式；类似于像 `+`、`-` 或 `=` 的运算符是出现在它们之间的标记。数字被视为字面量，或者是以字面量方式使用的标记。数字可以称为数字字面量。当内容被放入引号中，例如
    `"I''m a literal"`，你正在写一个字符串字面量。字面量遍布几乎所有的编程语言，并构成 Java 数据类型的基础。现在我们只处理几种不同的字面量，但我们很快就会了解到更多。


    传递性与非传递性操作：在数学课上，有时会教某些操作在值中，而另一些不在。例如，`2 + 3 + 4` 和 `4 + 3 + 2` 得到相同的值。每个数字出现在运算符之间并不重要，所以
    `+` 运算符被认为是具有传递性的。这一概念在 Java 中同样适用。当我们开始混合运算符时，结果会发生变化。


    ```

    int a = 1 + 2 - 4 + 7; //a = 6

    int b = 7 + 4 - 2 + 1; //b = 10

    ```


    这段代码片段显示了使用相同运算符但数字位置不同的两个不同结果。我们稍后在游戏中使用它们时，将看到如何克服这些问题。运算符顺序是需要注意的，在我们构建计算时，测试每一步是非常重要的，以确保结果是我们我们预期的值。为了确保操作按照你预期的方式进行，你可以使用括号来包含操作数。


