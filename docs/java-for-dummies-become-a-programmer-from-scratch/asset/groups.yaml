    — 阿兰·J·珀利斯（Alan J. Perlis）


    “计算机程序员是宇宙的创造者，他自己就是宇宙的法律制定者。任何剧作家、导演或皇帝，无论权力多大，从未行使过如此绝对的权威来布置舞台或战场，并指挥如此忠实尽责的演员或军队。”


    — 约瑟夫·魏森鲍（Joseph Weizenbaum）


    “如果两者都是冻结的，那么在水上行走和根据规范开发软件都是很容易。”


    — 爱德华·贝拉德（Edward Berard）


    “Perl – 唯一一种在 RSA 加密前后看起来完全一样的语言。”


    — 基斯·博斯蒂（Keith Bostic）


    “你所能学习的最灾难的事情就是你的第一门编程语言。”


    — 阿兰·凯（Alan Kay）


    “计算机就像小提琴。你可以想象一个新手先尝试留声机，再尝试小提琴。他说，后者听起来很糟糕。这就是我们从人文主义者和大多数计算机科学家那里听到的论点。他们说，计算机程序对于特定用途很好，但它们并不灵活。小提琴或打字机也是如此，直到你学会如何使用它们。”


    — 马文·明斯基（Marvin Minsky） “一个程序最重要的属性是它是否实现了用户的意图。”


    — C.A.R. 霍尔（C.A.R. Hoare）


    “面向对象编程提供了一种编写‘面条代码’的可持续方法。它让你像堆积补丁一样堆积程序。”


    > — 保罗·格拉姆（Paul Graham），《黑客与画家：计算机时代的重大思想》


    “四十岁时，我已经太老不能再当一名程序员了；写代码是一项年轻人的工作。”


    — 迈克尔·里希特（Michaelricht），《猎物》


    “说真的，最好的编程实际上是在纸上完成的。把它放入计算机只是一个小细节。”


    — 马克斯·卡纳特-亚历山大（Max Kanat-Alexander），《代码简单性：软件基础》


    “衡量程序员的标准不应是他们的才华和逻辑，而应是他们用例分析的完整性。”


    — 阿兰·J·珀利斯（Alan J. Perlis）


    “只有当我们训练自己去思考程序，而不将它们仅仅视为可执行的代码片段时，进步才是可能的。”


    — 埃德格·W·迪杰斯特拉（Edsger W. Dijkstra）


    “不要因为你‘知道’它能正常工作，就忽略掉涉及该漏洞的例程或代码段。证明它。在这个语境下、用这些数据、用这些边界条件来证明它。”


    — 安德鲁·亨特（Andrew Hunt），《程序员程序员之路：从学徒到大师》


    “记住，代码实际上是我们最终表达需求的语言。我们可能会创建更接近需求的语言。我们可能会创建帮助我们解析并将这些需求组装成正式结构的工具。但我们永远无法消除必要的精确性——所以代码永远存在。”


    — 罗伯特·C·马丁（Robert C. Martin）


    “软件测试是一项像狩猎一样的运动，它是找虫。”


    > — 阿米特·卡兰特（Amit Kalant）


    > “事实证明，编程是困难的。基本规则通常简单清晰。但建立在这些规则之上的程序往往变得复杂到足以引入它们自己的规则和复杂性。在某种程度上，你正在构建自己的迷宫，而你可能会迷失其中。”

    — 马里恩·哈弗贝克（Marijn Haverbeke）


