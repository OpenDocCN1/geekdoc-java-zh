    \ the meat of where logic is done to handle variables.\n\n## Function Scope\n\n\
    Variables often live ephemeral lives. Some variables exist only over a few lines\
    \ of code. Variables may come into existence only when a function starts and then\
    \ disappear when the function is done. Variables in the class exist as long as\
    \ the class exists. The life of the variable depends on where it's created.\n\n\
    ### Example\n\n```csharp\npublic class Class {\n    int first;\n    void first()\
    \ {\n        int second;\n    }\n    void second() {\n        int first;\n   \
    \ }\n}\n```\n\nIf we look at the above figure we can visualize how scope is divided.\
    \ The outer box represents who can see `first`. Within the `first()` function\
    \ we have `second` that only exists there. The same is repeated for `second`;\
    \ likewise, `second()` can see `first` but not `second`.\n\n## Parameter Lists\n\
    \nWhen a function is called, its identifier followed by its parameter list is\
    \ added to code. Parameters are like little slots on the front of a house. Each\
    \ slot is for integers, floats, and arrays. Each slot on the door is a type followed\
    \ by an identifier. If we look at a basic example, we'll see how this works.\n\
    \n```csharp\npublic class Example {\n    int a = 0;\n\n    void setA(int i) {\n\
    \        a = i;\n    }\n}\n```\n\n`setA(int i)` takes one parameter of type `int`.\
    \ This is a simple example; there are other types of parameters which we'll go\
    \ into next. The value parameter declares the type and whose scope is limited\
    \ to the contents of the function. When you run the above program and give `3`\
    \ to the function `setA(3)`, you'll see `a = 3`. We can do this any number of\
    \ times, and each time we're allowed to change what we set `a` to. Of course,\
    \ it's easier to use `a = 3` in the class, but then we wouldn't learn anything.\n\
    \n## Side Effects\n\nWhen a function directly sets a variable in the class it\
    \ lives in, programmers like to call this a side effect. Side effects are usually\
    \ things that programmers try to avoid, but its not always practical. Writing\
    \ functions with side effects tends to prevent the function from being useful\
    \ in other classes. We'll find ways that allow us to avoid using side effects,\
    \ but in some cases, its necessary.\n\n```java\nclass MySideEffect {\n    int\
    \ a = 0;\n    void setA() {\n        a = 5;\n    }\n}\n```\n\nThe above `setA()`\
    \ function sets `a` to 5. The `setA()` function does have a clear purpose, but\
    \ there's nothing in the function that indicates where the variable it's setting\
    \ lives. If the variable lived in another class which `MySideEffect` inherited\
    \ from, then you wouldn't even see the variable in this class. Once the complexity\
    \ in a class grows, where and when a variable gets changed or read becomes more\
    \ obscure. If a function remains self-contained, testing and fixing that function\
    \ becomes far easier.\n\nReading what a function does should not involve jumping\
    \ around to find what variable it’s making changes to. This brings us back to\
    \ the topic of scope. Limiting the scope or reach of a function helps limit the\
    \ number of places where things can go wrong.\n\n```java\nclass MySideEffect {\n\
    \    int a = 0;\n\n    void SetA () {\n        a = 5;\n    }\n\n    void SetAgain\
    \ () {\n        a = 10;\n    }\n}\n```\n\nThe more functions that have a side\
    \ effect, the more strange behaviors might occur. If the `Main()` function is\
    \ expecting one value but gets something else entirely, you can start to get unexpected\
    \ behaviors. Worse yet, if `SetAgain()` is called from another class and you were\
    \ expecting `a` to be 5, you’re going to run into more strange behaviors.\n\n\
    ### Multiple Arguments\n\nThere aren't any limits to the number of parameters\
    \ that a function can accept. Some languages limit you to no more than 16 arguments,\
    \ which seems acceptable. If your logic requires more than 16 parameters, it's\
    \ probably going to be easier to separate your function into different parts.\
    \ However, if we're going to do something simple, we might want to use more than\
    \ one parameter anyway.\n\n```java\nint a = 0;\n\nvoid SetA(int i, int j) {\n\
    \    a = i * j;\n}\n```\n\nWe can add a second parameter to `SetA`. A comma token\
    \ tells the function to accept another variable in the parameter list. For this\
    \ example, we're using ints to multiply against one another and assign a value\
    \ to `a`. There isn't anything limiting the types we're allowed to use in the\
    \ parameter list.\n\n```java\nint a = 0;\nfloat b = 0;\n\nvoid SetA(int i, float\
    \ j) {\n    a = i;\n    b = j;\n}\n```\n\nThe function with multiple parameters\
    \ can do more. Value parameters are helpful ways to get data into a function to\
    \ accomplish some sort of simple task.\n"
