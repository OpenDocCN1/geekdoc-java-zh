    # Error Handling With Exception


    The ideal time to catch an error is at compile time, before you even try to run
    the program. However, not all errors can be detected at compile time. The rest
    of the problems must be handled at run time through some formality that allows
    the originator of the error to pass appropriate information to a recipient who
    will know how to handle the difficulty properly.


    Improved error recovery is one of the most powerful ways that you can increase
    the robustness of your code. Error recovery is a fundamental concern for every
    program you write, but it''s especially important in Java, where one of the primary
    goals is to create program components for others to use. To create a robust system,
    each component must be robust. By providing a consistent error-reporting model
    using exceptions, Java allows components to reliably communicate problems to client
    code.


    The goals for exception handling in Java are to simplify the creation of large,
    reliable programs using less code than currently possible, and to do with more
    confidence that your application doesn''t have an unhandled error. Exceptions
    are not terribly difficult to learn, and are one of those features that provide
    immediate and significant benefits to your project.


    Because exception handling is the only official way that Java reports errors,
    and it is enforced by the Java compiler, there are so many examples that can be
    written in this book without learning about exception handling. This chapter introduces
    you to the code that you need to write to properly handle exceptions, and shows
    how you can generate your own exceptions if one of your methods gets into trouble.


    # Concepts:


    C and other earlier languages had multiple error-handling schemes, and these were
    generally established by convention and not as part of the programming language.
    Typically, you returned a special value or set a flag, and the recipient was supposed
    to look at the value or the flag and determine that something was amiss. However,
    as the years passed, it was discovered that programmers who use a library tend
    to think of themselves as invincible—as in "Yes, errors might happen to others,
    but not in my code." So, not too'
  - '[PAGE 215]


    surprisingly, they wouldn''t check for the error conditions (and sometimes the
    error conditions were too silly to check for). If you were thorough enough to
    check for an error every time you called a method, your code could turn into an
    unreadable nightmare. Because programmers could still coax systems out of these
    languages, they were resistant to admitting the truth: this approach to handling
    errors was a major limitation to creating large, robust, maintainable programs.


    The solution is to take the casual nature of error handling and enforce formality.
    This actually has a long history, because implementations of exception handling
    go back to operating systems in the 1960s, and even to BASIC''s "on error goto.\
    But C++ exception handling was based on Ada, and Java''s is based primarily on
    C++ (although it looks more like Pascal).


    The word "exception" is meant in the sense of "I take exception to that.\ At the
    point where the problem occurs, you might not know what to do with it, but you
    know that you can''t continue to merrily; you must stop, and somebody, somewhere,
    must figure out what to do. But you don''t have enough information in the current
    context to fix the problem. So you hand the problem out to a higher context where
    someone is qualified to make the proper decision.


    The other rather significant benefit of exceptions is that they tend to reduce
    the complexity of error-handling code. Without exceptions, you must check for
    a particular error and deal with it at multiple places in your program. With exceptions,
    you no longer need to check for errors at the point of the method call, since
    the exception will guarantee that someone catches it. You only need to handle
    the problem in one place, in the so-called exception handler. This saves you code,
    and it separates the code that describes what you want to do during normal execution
    from the code that is executed when things go awry. In general, reading, writing,
    and debugging code becomes much clearer with exceptions than when using the old
    way of error handling.'
