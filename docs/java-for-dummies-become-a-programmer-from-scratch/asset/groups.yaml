    ## 封装的优势：


    - 类的字段可以被设置为只读或只写。

    - 类对存储在其字段中的内容具有完全的控制权。

    - 类的用户不知道该类是如何存储数据的。类可以更改字段的数据类型，而类的用户不需要更改他们的任何代码。


    ## 重用实现：


    一旦一个类被创建并经过了测试，它（理想情况下）应该代表一个有用的代码单元。事实证明，这种重用性并不像许多人希望的那样容易实现；需要经验和洞察力才能产生可重用的对象设计。但一旦你拥有了这样的设计，它就需要被重用。代码重用是面向对象编程语言提供的最大优势之一。


    重用类最简单的方法是直接使用该类的对象，你也可以将该类的对象放在一个新类中。我们称称为“创建成员对象”。你的新类可以由任何数量和类型的其它对象组成，并以任何你为了实现新类中所需功能的组合组合。由于你是从现有的类组合出一个新类，这个概念被称为组合（composition），如果组合是动态发生的，通常被称为聚合（aggregation）。组合通常被称为“拥有”（has-a）关系，例如“汽车有一有一个引擎”。


    ![](img/81147dcafcee2d431dfe108a34b4c094_198_0.png)


    （此 UML 图表用实心菱形表示组合，表示有一辆汽车。我通常会使用更简单的形式：只需一条线，没有菱形，来表示关联。association.5）组合具有极大的灵活性。你新类的成员对象通常是私有的，使得使用该类的客户端程序员无法访问它们。这允许你在不打扰现有客户端代码的情况下更改这些成员。你还可以在运行时更改成员对象，以动态地更改程序的行为。接下去将描述的继承并不具有这种灵活性，因为编译器必须对通过继承创建的类施加编译时的限制。）


    由于继承在面向对象编程中如此重要，它经常被过度强调，新程序员可能会产生继承应该无处不在的印象。这可能导致笨拙且过度复杂的设计。相反，在创建新类时，你应该首先考虑组合，因为它更简单、更灵活。如果你采用这种方法，你的设计将更加简洁。一旦你有了一些经验，什么时候需要继承就会变得显而易见。


    **继承：** 就本身而言，对象的概念是一个方便的工具。它允许你按概念将数据和功能封装在一起，这样你可以表示一个适当的问题空间想法，而不是被迫使用底层机器的惯用法。这些概念通过使用
    `class` 关键字作为编程语言中的基本单元来表示。


    然而，费尽心机创建一个类，然后又被迫创建一个可能具有相似功能的新类，这似乎很遗憾。如果我们能获取现有的类，克隆它，然后对克隆进行添加和修改，那就完美了。这实际上是你通过继承所得到的，例外是如果原始类（称为基类、父类或母类）发生了更改，修改过的“克隆”（称为派生类、继承类、子类或子类）也会反映这些变化。


    ![](img/81147dcafcee2d431dfe108a34b4c094_200_0.png)


    （此 UML 图中的箭头从派生类指向基类。正如你所看到的，通常会有多个派生类。）一个类型不仅仅是描述一组对象的约束；它还与其他类型存在关系。两个类型可以共同的特征和行为，但一个类型可能包含比另一个类型更多的特征，并且可能处理更多的消息（或以不同的方式处理）。继承通过使用基类型和派生类型的概念来表达类型之间的这种相似性。基类型包含了所有派自它的类型所共有的特征和行为。你创建一个基类型来表示你对系统中某些对象想法的核心。从基类型开始，你派导出其他类型，以表示该核心可以实现的不同方式。


    例如，一台垃圾回收机对垃圾碎片进行分类。基类型是“垃圾”，每件垃圾都有重量、价值等，并且可以被粉碎、熔化或分解。从这里，派生出更具体的垃圾类型，它们可能具有额外的特征（瓶子有颜色）或行为（铝罐可以被压扁，钢制罐具有磁性）。此外，某些行为可能不同（纸张的价值取决于它的类型和状况）。使用继承，你可以构建一个类型层次结构，用它的类型来表示你正试图解决的问题。


    第二个例子是经典的“形状”示例，可能用于计算机辅助设计系统或游戏模拟。基类型是“形状”，每个形状都有尺寸、颜色、位置等。每个形状都可以被绘制、擦除、移动、上色等。从这里，派生出（继承）特定的形状类型——圆形、正方形、三角形等——每个形状都可能有额外的特征和行为。例如，某些形状可以被翻转。某些行为可能不同，例如当你想要计算形状的面积时。类型层次结构体现了形状之间的相似点和差异。


    | Shape |

    | --- |

    | draw() |

    | erase() |

    | move() |

    | getColor() |

    | setColor() |

    | Circle | Square | Triangle |


    将解决方案与问题相同的术语，这种继承是非常用的，因为你不需要中间模型就可以从问题的描述过渡到解决方案的描述。事实上，人们在面向对象设计中遇到的困难之一就是于它太简单了。


