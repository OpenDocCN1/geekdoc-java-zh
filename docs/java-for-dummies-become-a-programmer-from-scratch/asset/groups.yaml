  mdcn: "\n或者你也可以进行每次计算。稍后我们将通过再次查看运算符来深入探讨更多细节，但这必须等到我们对 Java 更多基础有更好的理解之后。\n\n#\
    \ 第 4 章 | Java 编程基础\n\n## Java 程序的结构\n\nJava 程序由不同的部分组成。其中某些是强制性的，而另一些是可选的。根据程序员的需求，可以从程序中排除可选部分。\n\
    \n### 文档部分 (Documentation Section)\n\n它包含了说明程序目的的注释。它提高了程序的可读性。\n\n### 包声明语句 (Package\
