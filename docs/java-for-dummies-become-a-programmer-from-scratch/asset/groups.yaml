- md: "\nthese languages, by default, methods are not dynamically bound. In Java,\
    \ dynamic binding is the default behavior and you don't need to remember to add\
    \ any extra keywords in order to get polymorphism.\n\n# CHAPTER 9 | EXCEPTION\
    \ HANDLING\n\n## Error Handling With Exception\n\nThe ideal time to catch an error\
    \ is at compile time, before you even try to run the program. However, not all\
    \ errors can be detected at compile time. The rest of the problems must be handled\
    \ at run time through some formality that allows the originator of the error to\
    \ pass appropriate information to a recipient who will know how to handle the\
    \ difficulty properly.\n\nImproved error recovery is one of the most powerful\
    \ ways that you can increase the robustness of your code. Error recovery is a\
    \ fundamental concern for every program you write, but it's especially important\
    \ in Java, where one of the primary goals is to create program components for\
    \ others to use. To create a robust system, each component must be robust. By\
    \ providing a consistent error-reporting model using exceptions, Java allows components\
    \ to reliably communicate problems to client code.\n\nThe goals for exception\
    \ handling in Java are to simplify the creation of large, reliable programs using\
    \ less code than currently possible, and to do with more confidence that your\
    \ application doesn't have an unhandled error. Exceptions are not terribly difficult\
    \ to learn, and are one of those features that provide immediate and significant\
    \ benefits to your project.\n\nBecause exception handling is the only official\
    \ way that Java reports errors, and it is enforced by the Java compiler, there\
    \ are so many examples that can be written in this book without learning about\
    \ exception handling. This chapter introduces you to the code that you need to\
    \ write to properly handle exceptions, and shows how you can generate your own\
    \ exceptions if one of your methods gets into trouble.\n\n## Concepts:\n\nC and\
    \ other earlier languages had multiple error-handling schemes, and these were\
    \ generally established by convention and not as part of the programming language.\
    \ Typically, you returned a special value or set a flag, and the recipient was\
    \ supposed to look at the value or the flag and determine that something was amiss.\
    \ However, as the years passed, it was discovered that programmers who use a library\
    \ tend to think of themselves as invincible—as in \"Yes, errors might happen to\
    \ others, but not in my code.\" So, not too surprisingly, they wouldn't check\
    \ for the error conditions (and sometimes the error conditions were too silly\
    \ to check for). If you were thorough enough to check for an error every time\
    \ you called a method, your code could turn into an unreadable nightmare. Because\
    \ programmers could still coax systems out of these languages, they were resistant\
    \ to admitting the truth: this approach to handling errors was a major limitation\
    \ to creating large, robust, maintainable programs.\n\nThe solution is to take\
    \ the casual nature of error handling and enforce formality. This actually has\
    \ a long history, because implementations of exception handling go back to operating\
    \ systems in the 1960s, and even to BASIC's \"on error goto.\" But C++ exception\
    \ handling was based on Ada, and Java's is based primarily on C++ (although it\
    \ looks more like Pascal).\n\nThe word \"exception\" is meant in the sense of\
    \ \"I take exception to that.\" At the point where the problem occurs, you might\
    \ not know what to do with it, but you know that you can't continue to merrily;\
    \ you must stop, and somebody, somewhere, must figure out what to do. But you\
    \ don't have enough information in the current context to fix the problem. So\
    \ you hand the problem out to a higher context where someone is qualified to make\
    \ the proper decision.\n\nThe other rather significant benefit of exceptions is\
    \ that they tend to reduce the complexity of error-handling code. Without exceptions,\
    \ you must check for a particular error and deal with it at multiple places in\
    \ your program. With exceptions, you no longer need to check for errors at the\
    \ point of the method call, since the exception will guarantee that someone catches\
    \ it. You only need to handle the problem in one place, in the so-called exception\
    \ handler. This saves you code, and it separates the code that describes what\
    \ you want to do during normal execution from the code that is executed when things\
    \ go awry. In general, reading, writing, and debugging code becomes much clearer\
    \ with exceptions than when using the old way of error handling.\n\n## Basic exceptions:\n\
    \nAn exceptional condition is a problem that prevents the continuation of the\
    \ current method or scope. It’s important to distinguish an exceptional condition\
    \ from a normal problem, in which you have enough information in the current context\
    \ to somehow cope with the difficulty. With an exceptional condition, you cannot\
    \ continue processing because you don't have the information necessary to deal\
    \ with the problem in the current context. All you can do jump out of the current\
    \ context and relegate to a higher context. This is what happens when you throw\
    \ an exception.\n\nDivision is a simple example. If you’re to divide by zero,\
    \ it’s worth checking for that condition. But what does it mean that the denominator\
    \ is zero? Maybe you know, in the context of the problem you’re trying to solve\
    \ in that particular method, how to deal with a zero denominator. But if it’s\
    \ an unexpected value, you can’t deal with it and must throw an exception rather\
    \ than continuing along execution path.\n\nWhen you throw an exception, several\
    \ things happen. First, the exception object is created in the same way that any\
    \ Java object is created: on the heap, with new. Then the current path of execution\
    \ (the one you couldn’t continue) is stopped and the reference for the exception\
    \ object is ejected from the current context. At this point the exception-handling\
    \ mechanism takes over and begins to look for an appropriate place to continue\
    \ executing the program. This appropriate place is the exception handler, whose\
    \ job is to recover from the problem so the program can either another tack or\
    \ just continue.\n\nAs a simple example of throwing an exception, consider an\
    \ object reference it’s possible that hasn’t been initialized, so you might want\
    \ to check before calling a method. Here’s what it looks like:\n\n```java\nif\
    \ (t == null)\n    throw new NullPointerException();\n```\n\nThis throws the exception,\
    \ which allows you in the current context to abdicate responsibility for thinking\
    \ about the issue. It’s just magically handled elsewhere where will be shown shortly.\n\
    \nExceptions allow you to think of everything that you do as a transaction, and\
    \ the exceptions guard those transactions: \"...the fundamental premise of transactions\
    \ is that we needed exception handling in distributed computations. Transactions\
    \ are computer equivalent of contract law. If anything goes wrong, we'll blow\
    \ away the whole computation.\" You can also think about exceptions as built-in\
    \ undo system, because (with some care) you have various recovery points in your\
    \ program. If a part of the program fails, the exception will \"undo\" back to\
    \ a stable point.\n\n## Exception arguments:\n\nAs with any object in Java, you\
    \ always create exceptions on the heap using new, which allocates storage and\
    \ calls a constructor. There are two constructors in all standard exceptions:\
    \ The first is the default constructor, and the second takes a string argument\
    \ so that you can place pertinent information in the exception: throw new NullPointerException(\"\
    =null\"); This string can be extracted using various methods, as you’ll see.\n"
  mdcn: "\n在这些语言中，默认情况下方法不是动态绑定的。在 Java 中，动态绑定是默认行为，你不需要记住添加任何额外的关键字来实现多态。\n\n# 第\
    \ 9 章 | 异常处理\n\n## 使用异常进行错误处理\n\n捕捉错误的最佳时机是编译时，在你尝试运行程序之前。然而，并非所有错误都可以在编译时检测到。其余的问题必须在运行时通过某种形式进行处理，这种形式允许错误源头将适当的信息传递给接收者，接收者将知道如何处理这些困难。\n\
    \n改进错误恢复是提高代码健壮性最强大的方法之一。错误恢复是你编写的每个程序都关注的基础问题，但在 Java 中它尤为重要，因为 Java 的主要目标之一是为他人创建程序组件。要创建一个健壮的系统，每个组件必须是健壮的。通过使用异常提供一致的错误报告模型，Java\
    \ 允许组件可靠地向客户端代码通信问题。\n\nJava 异常处理的目标是使用比目前更少的代码创建大型、更可靠的程序，并更有信地确保你的应用程序没有未处理的错误。异常的学习并不困难，它们是那些能为你的项目带来即时且显著收益的特性之一。\n\
    \n因为异常处理是 Java 错误的唯一官方方式，并且由 Java 编译器的强制执行，因此书中有很多可以在不学习异常处理的情况下编写的示例。本章将向你介绍需要编写的用于正确处理异常的代码，并展示当你的某个方法遇到问题时，你可以如何生成自己的异常。\n\
    \n## 概念：\n\nC 和其他早期的语言有多种错误处理方案，这些通常是根据惯例建立的而不是编程语言的一部分。通常，你会返回一个特殊值或设置一个标志位，接收者应该查看该值或标志位并判断是否发生了异常。然而，随着时间的推移，人们发现使用库的程序员倾向于认为自己是无所不能的——就像“是的，错误可能会发生在别人身上，但不会发生在我我的代码中”。所以，并不意外，他们不会检查错误条件（而且有时错误条件太愚蠢了，不需要检查）。如果你足够彻底，在每次调用方法时都检查错误，你的代码可能会变成一个不可读的噩梦。由于程序员仍然可以从这些语言中诱导系统运行，他们他们于承认事实：这种处理错误的方法是创建大型、健壮、可维护程序的主要局限。\n\
    \n解决方案是将错误处理的随意性质改为强制正式化。这实际上有很长的历史，因为异常处理的实现可以追溯到 20 世纪 60 年代的操作系统，甚至到了 BASIC\
    \ 的“on error goto”。但 C++ 的异常处理基于 Ada，而 Java 的主要基于 C++（尽管它看起来更像 Pascal）。\n\n“exception”（异常）一词的意思是“我对此此表示异议”。在问题发生点，你可能不知道该如何处理它，但你知道你不能继续愉快地运行了；你必须停止，并且某处的某人必须弄清楚该怎么办。但在当前的上下文中没有足够的信息来修复问题。因此，你将问题交给更高层的上下文，那里有人有权做出正确的决定。\n\
    \n异常的另一个相当显著的优点是它们倾向于降低错误处理代码的复杂性。如果没有异常，你必须在程序的多个地方检查并处理特定的错误。有了异常，你不再需要在方法调用点检查错误，因为异常将保证有人捕获它。你只需要在一个地方（即所谓的异常处理程序中）处理该问题即可。这为你节省了代码，并将描述正常执行期间你想做的事的代码与在发生故障时执行的代码分离开来。总的来说，使用异常，阅读、编写和调试代码比使用旧的错误处理方式要清晰得多。\n\
    \n## 基础异常：\n\n异常状态是一个阻止当前方法或作用域继续运行的问题。将异常状态与正常区分开来很重要，在正常情况下，你在当前环境中足够的信息以某种方式应对困难。在异常状态下，你无法继续处理，因为你没有在当前上下文处理问题所需的信息。你所能做的就是跳出当前上下文并委托给更高层的上下文。这就是当你抛出异常时发生的情况。\n\
    \n除法是一个简单的例子。如果你要除以零，检查该条件是值得的。但分母为零意味着什么？也许在那个特定方法尝试解决的问题背景下，你知道如何处理零分母。但如果它是一个意外之外的值，你就无法处理它，必须抛出异常而不是继续沿执行路径。\n\
    \n当你抛出异常时，会发生几件事。首先，异常对象以创建任何 Java 对象相同的方式创建：在堆上，使用 `new` 创建。然后，当前的执行路径（你无法继续执行的路径）停止，异常对象的引用从当前上下文抛出。此时，异常处理机制接管并开始寻找继续执行程序的适当位置。这个适当的位置就是异常处理程序，它的工作是从问题中恢复，以便程序可以采取另一种策略或直接继续运行。\n\
    \n作为一个抛出异常的简单示例，考虑一个可能未初始的对象引用，所以你可能想在调用方法之前进行检查。它看起来如下：\n\n```java\nif (t ==\
    \ null)\n    throw new NullPointerException();\n```\n\n这抛出了异常，允许你在当前上下文中放弃对该问题的思考。它将在很快展示的某处被神奇地处理。\n\
    \n异常允许你将你所做的一切视为一个事务，而异常保护了这些事务：“……事务的基本前提是我们在分布式计算中异常处理。事务是计算机中的合同法。如果发生任何错误，我们将撤销整个计算。”你也可以把异常视为内置的撤销系统，因为（只要小心）你在程序中有各种恢复点。如果程序的某部分失败，异常将“撤销”回到稳定点。\n\
    \n"
