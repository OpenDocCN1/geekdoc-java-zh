    根据 Jack 的说法，当地聚会通常会有一些环节，为任何需要的人提供免费指导。其他免费资源还包括 Twitter 群组、Slack 群组和 IRC 频道。


    ## 8. 不要仅仅编写代码——构建解决方案


    > “很多编程并不关于代码，而是关乎理解其他学科或标准。”


    如果你不理解某人的问题，你就无法用代码来解决它。我接触过的项目让我看到了小企业、营销人员、经纪人和其他专业人士看待世界的方式。当你理解了他们目前如何解决问题时，你就可以与他们合作，提出更新、更好的解决方案。


    —Adam Haney，Bellhops CTO


    Ross 希望自己在职业生涯早期能更早地做的一件事，就是更好地欣赏软件工程本身的学科规范和历史。


    如今，人们很容易投身这项职业并只关注“编码”。特别是在蓬勃的市场中，浏览器编码员或 Web 应用编码员使用着巨大的动态编程语言（Ruby, JavaScript）以及极其奇特的“计算机”语言和格式（HTML,
    CSS），我们可能会倾向于花费所有时间去竞赛掌握无数工具、框架和 API，以便在面试中脱颖而出或在工作中晋升。在团队中构建产品始终是一场社交活动，而且是一项具有独特挑战的活动，这些挑战大多是非技术的。例如，事实证明软件工程中最困难的事情是决定构建什么，而不是构建；尽管随着
    JavaScript 菌丝体结构的剧烈扩张，这可能没那么真实了。


    Ross 说，他花了一段时间才理解，大多数软件工程首先发生在你的脑海中。“编码很快就会变成容易的部分。但一个高水平的工程师可以用方框、圆圈和线条画出解决方案——我知道这是一项需要学习的技能，因为我做得越来越多，而且变得越来越擅长。”这种意识到编码更多是“托腮沉思和白板演示”的感受对他实际上产生了共鸣，他为此写了一篇博客文章。


    “记住，这关乎人类和我们的生活，而不仅仅是你正在编写代码的技术，”Derick 说道。学习人类如何思考、互动和相处。然后将你学到的知识体现在你的软件架构和设计中。


    ## 9. 不要重复轮子


    最后，无论你变得多优秀，你的代码永远不会是 100% 原创的，因为许多问题在你所选择的语言中已经得到了解决。“Ross 保证道，“保持轮子原样没有任何羞耻的。然而，当需要提交时，你最好能确定你能像小石·约翰逊那样的魅力和自信向你的团队辩护那段代码。”


    > “不要因为你不理解抽象就重新发明轮子，”Mike 提醒我们。


    然而，这并不是意味着发明轮子没有任何价值。Clarifai 的首席执行官 Matthew Zeiler 鼓励人们如果他们感兴趣，就去构建已经有解决方案的东西。从零开始构建工具将帮助你了解更多软件工程、系统可扩展性等。


    ## 结论


    在学习如何开发应用或项目时，挫败感随处可见，但希望以上提示让你在成为开发者的道路上更有信心。


    ## #1. 关于职业


    - 编写可以被他人阅读、理解和操作的代码。这允许你交接并承担新的挑战。

    - 如果你囤积知识，你将是唯一的守护者——或者在具有工程/业务头脑的组织中，这就是一个风险。

    - 停止为代码或幸过的黑客马拉松自豪，这在永久性的团队中毫无意义。执行和协作将为你提供更大的服务。


    ## #2. 关于解决方案和编码


    - 如果你无法向非程序员解释它，你可能把它过度复杂或过度优化了。

    - 如果你画不出架构图，你可能也把它过度复杂了。

    - 不要通过写“紧凑代码”来炫风风。


    ## #3. 关于个人提高


    - 不要成为 Java 或 C/C++（或其他）的粉丝。在长期的职业生涯中，你将学习 10 多种语言。将它们视为工具，而不是跟风潮流。

    - 永远会有更优秀的程序员，而且他们很难识别。向所有人学习。

    - 你的价值不是由代码的质量定义的。不要那样评价自己。


    ## #4. 关于哲学


    - 编程是让非程序员能够比他们独立能做的更多事的艺术。

    - 计算机科学是世界上几乎每个研究领域或行业的催化剂。计算机科学使人类做得更多、解决更多、变得更好。

    - 计算机科学 != 编程。如果你的大学只教你如何编程，去要钱吧。


    ## 程序员、优秀程序员和伟大程序员之间的区别。


    - **程序员 (Programmer)**：在有足够详细的问题描述的情况下，任何可以编写运行程序来解决问题的人。

    - **优秀程序员 (Good programmer)**：一个与他人协作创建适合客户使用的、可维护的、优雅程序的程序员，按时交付且缺陷率低，且几乎没有或没有人际冲突。

    - **伟大程序员 (Great programmer)**：一个优秀的程序员，他们能直觉地理解算法和架构，可以在很少监督的情况下构建自洽的大型系统，可以发明新算法，可以在不破坏运行系统的情况下对其进行重构，能够就技术和非技术问题与非技术人员进行有效且有说服力的沟通，理解如何控制自己的自尊，并将技能传教给他人。


    成为伟大程序员的路径是从成为程序员开始，然后培养成为优秀程序员所需的技能，并练习这些技能直到精通，然后培养成为伟大程序员所需的技能，并练习它们直到精通。


    这所需的时间取决于你的技能、性格和训练。它取决于取决于职业生涯中获得的经验和机会，以及你如何应对它们。


    ## 程序崩溃的 4 个原因！


    你的程序崩溃可能有 4 个原因：


    - 你的程序可能依赖某些随机元素：用户输入、随机数、时间等。

    - 如果你的程序使用了未初始化的变量，它可能会访问它不应该访问的数据（访问数组索引之外也是如此）。

    - 你的程序可能使用了一个经常崩溃的外部库。

    - 栈溢出！


    ## 编程格言！


    > “语言是廉价的。展示代码。” Linus Torvalds


    > “程序必须为人类阅读而编写，而不仅仅是为了机器执行。” Harold Abelson，《计算机程序的构造与解释》


    > “今天的编程是软件工程师努力构建更大、更好的防呆程序，与宇宙试图产生更大、更好的呆子之间的竞赛。到目前为止，宇宙赢了。” Rick Cook，《魔法编译》


    > “始终编写代码，就好像最后维护你代码的人是一个知道你住址的暴力狂”—John Woods


    > “那些认为自己讨厌电脑的人其实，他们真正讨厌的是糟糕的程序员。” Larry Niven 最好的程序是为了让机器运行得更快，让人类能够清晰地理解。理想的程序员像是一位散文家，利用传统的审美和文学形式以及数学概念来传达算法的工作原理，并说服读者结果是正确的。”
    Donald Ervin Knuth，《计算机科学论文集》


    > “我不是伟大的程序员；我只是一个习惯良好的优秀程序员。” Kent Beck


    '
