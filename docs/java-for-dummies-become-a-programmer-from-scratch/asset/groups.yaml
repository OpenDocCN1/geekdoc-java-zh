    \n## 另一种方案被称为恢复（resumption）。这意味着预期异常处理器执行某些事情来纠正局面，然后重试出错的方法，并在第二次尝试成功。如果你想要恢复，意味着你仍然希望在异常被处理后继续执行。\n\
    \n如果你想在 Java 中获得类似恢复的行为，在遇到错误时不要抛出异常。相反，请调用一个修复问题的方法。或者，将你的 try 块放置在一个 `while`\
    \ 循环中，该循环会不断重新进入 try 块，直到结果满意为止。\n\n从历史上看，使用支持恢复性异常处理的操作系统的程序员最终倾向于使用类似终止的代码并跳过恢复。虽然恢复初听起来很有吸引力，但在实践中并没有那么有用。主要原因可能是由此导致的耦合：一个恢复性处理器需要知道异常是在哪里抛出的，并包含特定于抛出位置的非通用代码。这使得代码难以编写和维护，特别是对于异常可能从许多点生成的巨型系统。\n\
    \n## 捕获任何异常：\n\n可以创建一个捕获任何类型异常的处理器。你通过捕获基类异常类型 `Exception` 来实现（尽管还有其他类型的基异常，但\
    \ `Exception` 是与几乎所有编程活动相关的基类）：`catch(Exception e) {`\n\n```java\nSystem.out.println(\"\
    Caught an exception\");\n}\n```\n\n这会捕获任何异常，如果你使用它，你会想要将其放在处理器列表的末尾，以避免抢占可能随其后的任何异常处理器。\n\
    \n由于 `Exception` 类是对程序员重要的所有异常类的基类，你无法获得关于异常的很多特定信息，但你可以调用源自其基类型 `Throwable` 的方法：\n\
    `String getMessage()`\n\n```java\nString getLocalizedMessage()\n```\n\n获取详细消息，或针对此特定本地化调整的消息。\n\
    \n```java\nString toString()\n```\n\n返回 `Throwable` 的简短描述，如果有详细消息则包含在内。\n\n```java\n\
    void printStackTrace()\nvoid printStackTrace(PrintStream)\nvoid printStackTrace(java.io.PrintWriter)\n\
    ```\n\n打印 Throwable 及其调用栈轨迹。调用栈显示了到达抛出异常点的方法调用序列。第一个版本打印到标准错误\n\n## Throwable\
    \ fillInStackTrace()\n\n在此 Throwable 对象中记录有关栈帧的信息。当应用程序重新抛出错误或异常时很有用（稍后详述）。\n\n\
    此外，你还会从 `Throwable` 的类型 `Object`（所有基类型）获得一些其他方法。可能很有用的是 `getClass()`，它返回一个表示该对象的\
    \ Class 对象。你可以反过来查询此 Class 对象的名称，使用 `getName()` 包含包信息，而 `getSimpleNameName()`\
    \ 只产生类名。\n\n这里有一个使用基本异常方法的示例：`public class ExceptionMethods {\n\n```java\npublic\
    \ static void main(String[] args) {\n    try {\n        throw new Exception(\"\
    My Exception\");\n    } catch(Exception e) {\n        System.out.println(\"Caught\
    \ Exception:\");\n        System.out.println(\"getMessage():\" + e.getMessage());\n\
    \        System.out.println(\"getLocalizedMessage():\" + e.getLocalizedMessage());\n\
    \        System.out.println(\"toString():\" + e);\n        System.out.println(\"\
    printStackTrace:\");\n        e.printStackTrace(System.out);\n    }\n}\n```\n\n\
    # 输出：\n\n```\nCaught Exception:\ngetMessage() : My Exception\ngetLocalizedMessage()\
    \ : My Exception\ntoString() : java.lang.Exception : My Exception\nprintStackTrace():\n\
    java.lang.Exception: My Exception\nat ExceptionMethods.main(ExceptionMethods.java:8)\n\
    ```\n\n你可以看到这些方法提供了递增的信息——每个方法实际上都是前一个方法的超集。\n\n## 第10 章 | 算法与大 O 表示法\n\n它总是能导出一个解决方案，并尝试成为我们能想到的最高效的解决方案。\n"
