    \    }\n    }\n}\n```\n\n# 输出：\n\n```\n$ java URLConnDemo\n......a complete HTML\
    \ content of home of amrood.com...\n```\n\n# 学习复制与粘贴\n\n“平庸的艺术家模仿，伟大的艺术家窃取。”这里有代码示例供你复制并粘贴到你的项目中。本书的内容以及所有可下载的内容并无二致。这意味着你必须理解代码在做什么，才能将其解释并以适应你的需求。每一位程序员都是习惯性地这样做。\n\
    \n# 复制/粘贴\n\n学习如何做到这一点非常重要，因为在许多情况下，你实际上需要这样做，这不仅是为了学习，也是为了完成任何陌生的任务。编程是一个持续的学习过程。它是一种命令计算机的语言。\n\
    \n每当你学习一门新语言时，会有大量的单词需要你查阅。而且每每个程序员都会创造新词汇，你面对的是一种你永远需要字典的语言。\n\n当显示某些代码时，会被要求将这些代码复制到你的项目中。当你的手指在键盘上准备好时，你会养成打字的习惯。\n\
    \n程序员通常打字很快是有原因的。这也是为什么程序员对自己偏好的键盘非常挑剔的原因。在大多数情况下，书中的项目将处于某种状态，你可以阅读已经就绪的文本。\n\
    \n大多数项目处于更完整的状态，你可以运行它们并看到预期的结果。作为一名程序员，我已经习惯了在互联网上搜索示例代码。\n\n一旦我发现了某些看起来很有用的东西，我就会复制它并粘贴到一个简单的测试用例中。在我弄懂了代码在做什么之后，我会将其重写为更适合我特定情况的形式。即使代码涉及一些有趣的技巧，我也会从那段代码中学习。\n\
    \n随着我学习新技巧，我作为一名程序员也因此成长。学习新技巧的唯一方法是找到解决新问题的必要性，而这些问题是我还没有想出解决方案的。寻找问题的解决方案是成为程序员的根本部分。\n\
    \n# 自学程序员通常欠缺的 5 项技能\n\n# 1. 算法\n\n这是经典的计算机科学。在没有算法知识的情况下编程，就像只用一把锯子做木工：你可以完成工作，但会花费更多的时间。\n\
    \n你可以将算法看作是一种“纪律”。当你学习编写它们时，你正在用纪律来解决问题；使用结构、模式和逻辑步骤。\n\n当你不知道如何节律你的思想时，你就不知道如何编写算法。\n\
    \n除非你学习过它们，否则你不仅无法编写算法，你也不知道别人写了多少算法。\n\n我花了四天时间尝试如何进行排列。当我解出来时，我感到非常自豪。直到我发现\
    \ B.R. Heaps 在 1963 年就想出来了。\n\n# 2. 设计模式 \n\n这源于教育和/或经验。结构化代码的方法不此一种，而且每种方法都有正确和错误的时间点。你要么需要在在此过程中犯错并学习何时使用每种模式，要么就从已经犯过同样错误的人（比如老师）身上学习。\n\
    \n# 3. 编程范式 \n\n面向对象编程并不是“唯一途径”。函数式编程也不是。响应式编程亦是。它只是“方法之一”。\n\n编程有不同的方式，每种都有其目的。不仅如此，某些语言天生更适合某一种范式或另一种。\n\
    \n> “如果你手里只有一把锤子，一切看起来都像钉子。”\n\n以自学编程为例，你会发现自己正在敲击钉子、螺丝、订书钉和按图钉。\n\n我记得有一个自学的\
    \ .NET 程序员曾经告诉过我：“好吧，除非是面向对象的，否则那不是编程。这就是为什么我不认为 JavaScript 是一门编程语言。”这是一个非常、非常有缺陷的思维方式。\n\
    \n# 4. 数据结构 \n\n承认，你的语言可以让你对不同的数据结构有一个基本概念。但再次，那只是一个基本概念。\n\n自学程序员倾向于只坚持在他们喜爱的语言中可行的数据结构。仅仅因为它不是基本类型，甚至不是你语言中的常用结构，并不意味着它不存在。当然，这也可能意味着它不应该存在。\n\
    \n> *如果一切都能放入一个数组里，世界就变得很小。*\n\n# 5. 测试 \n\n也许只是我个人的想法，但在代码推送到环境之前，有很多测试方法。学习如何单元测试。\n\
    \n重要的是，学习测试驱动开发。\n\n测试代码与编写可测试代码之间是有区别的。\n\n# 我遇到的自学程序员经常缺乏以下领域的知识：\n\n- *正式术语。*\
    \ 你必须熟记数据结构和其他事物的正确名称，以便就软件开发项目进行有效的交流。\n- *测试。* 大多数自学者缺乏知识，或者通常不理解测试过程的重要性。\n\
    - *范式（以及相应的语言）。* “如果你手里只有一把锤子，一切看起来都像钉子。”我遇到过很多这类人。他们通常不理解为什么问题并不相同。\n- *机器相关的数学问题。*\
    \ 他们缺乏数值技能，并且不理解为什么浮点数运算会失效。\n\n# 成为伟大程序员的 9 种方法\n\n# 1. 实践\n\n除了遵循教程，你还应该开发自己的项目。\n\
    \n> “成为一名优秀的程序员需要很、很长的时间和许多痛苦的夜晚。在编写好代码之前，你必须编写数十万行代码”\n\n—— Mike Arpaia，一位前 Etsy\
    \ 开发者，现在为 Facebook 构建信息安全软件。\n\nMike 强调，初学者应该放弃可以快速成为优秀开发者的假设。\n\n但是……如果你还没有离开教程阶段呢？如果你仍在撞墙，并怀疑自己可能不适合编程呢？在得出结论之前，请记住每个人都有不同的学习风格。\n\
    \n"
