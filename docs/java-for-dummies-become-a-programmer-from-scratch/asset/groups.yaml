- md: "\nAfter the method's parameter list comes first a left curly bracket ( { ),\
    \ then some empty space, and then a right curly bracket ( } ). Inside the curly\
    \ brackets you locate the Java instructions that are to be executed when the main\
    \ method is executed. This is also referred to as the *method body*. In the example\
    \ above there are no instructions to be executed. The method is empty.\n\nLet\
    \ us insert a single instruction into the main method body. Here is an example\
    \ of how that could look:\n\n```java\npackage myjavacode;\n\npublic class MyClass\
    \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
    Hello World, Java Program\");\n    }\n}\n```\n\nNow the main method contains this\
    \ single Java instruction: System.out.println(\"Hello World, Java Program\");\
    \ This instruction will print out the text Hello World, Java Program to the *console*.\
    \ If you run your Java program from the command line, then you will see the output\
    \ in the command line console (the textual interface to computer). If you run\
    \ your Java program from inside an IDE, the IDE normally catches all output to\
    \ the console and makes it visible to you somewhere inside the IDE.\n\n## Running\
    \ The main() Method:\n\nWhen you start a Java program you usually do so via the\
    \ command line (console). You call the java command that comes with the JRE, and\
    \ tells it what Java class to execute, and what arguments to pass to the main()\
    \ method. The Java application is then executed inside the JVM (or by the JVM\
    \ some would claim. Here is a diagram illustrating this:\n\n![](img/81147dcafcee2d431dfe108a34b4c094_54_0.png)\n\
    \nA command line executing the java command, which in turn executes a Java main\
    \ program.\n\nHere is an example command line:\n\n```\njava -cp classes myjavacode.MyClass\n\
    ```\n\nThe first part of this command is the java command. This command starts\
    \ up the JVM. In some cases you may have to specify the full path to where the\
    \ java command is located on your computer (typically inside the bin subdirectory\
    \ of the Java install dir).\n\nThe second and third arguments (-cp classes ) tells\
    \ the JVM in what directory the compiled Java classes are located (cp means class\
    \ path). In this case the compiled Java classes are located in a directory named\
    \ classes.\n\nThe fourth argument is the name of the Java class JVM is to execute.\
    \ Notice how the class name also contains the name of the package the class is\
    \ located in (the \"fully qualified class name\").\n\n## Passing Arguments to\
    \ the main() Method:\n\nYou can pass arguments from the command line to the main()\
    \ method. This command line shows how: java -cp classes myjavcode.MyClass Hello\
    \ World. When the JVM executes the main() method of the myjavcode.MyClass , the\
    \ String array passed as parameter to the main() method will contain two Strings:\
    \ \"Hello\" and \"World\".\n\nThe main() method can access the arguments from\
    \ the command line like this:\n\n```java\npackage myjavcode;\n\npublic class MyClass\
    \ {\n\n    public static void main(String[] args) {\n        System.out.println(args[0]);\
    \ \n        System.out.println(args[1]); \n    }\n}\n```\n\nNotice the references\
    \ to element 0 and element 1 in the args array (args[0] and args[1]). args[0]\
    \ will contain the String (text) Hello and args[1] will contain the String World.\n\
    \nVariables and arrays will be explained in more detail in later texts. Don't\
    \ worry if you don't fully understand them at this point.\n\n## The Java Main\
    \ Class:\n\nIf only a single Java class in your Java program contains a main()\
    \ method, then the class containing the main() method is often referred to as\
    \ the *main class*.\n\nYou can have as many classes as you want in your project\
    \ with a main() method in. But, the Java Virtual Machine can only be instructed\
    \ to run one of them at a time. You can still call the other main() methods from\
    \ inside the main() method the Java Virtual Machine executes (you haven't seen\
    \ how yet) and you can also start up multiple virtual machines which each execute\
    \ a single main() method.\n\n## Access Control\n\nAll good writers including those\
    \ who write software know that a piece of work isn’t good until it’s been rewritten,\
    \ often many times. If you leave a piece of code in a drawer for a while and come\
    \ back to it, you may see it.\n\nThere is a tension between the desire to change\
    \ and the need for things to stay the same. To solve this problem, Java provides\
    \ access specifiers to allow the library creator to say what is available to the\
    \ programmer and what is not. The levels of access from “most access” to “least\
    \ access” are **public**, **protected**, **package access** (which has no keyword),\
    \ and **private**. From the previous paragraph you might think that, as a library\
    \ designer, you'll want to keep everything as “private” as possible, and expose\
    \ only the methods you want the client to use. This is exactly right, even though\
    \ it's counterintuitive for people who program in other languages (like C) who\
    \ are used to accessing everything without restriction.\n"
  mdcn: "\n\n在方法的参数列表之后，首先是一个左大括号（ { ），然后是一些空格，最后是一个右大括号（ } ）。在大括号内部，你定义了执行 main 方法时要执行的\
    \ Java 指令。这被称为*方法体*（method body）。在上面的示例中，没有要执行的指令。该方法是空的。\n\n让我们在 main 方法体中插入一条指令。以下是可能后的示例：\n\
    \n```java\npackage myjavacode;\n\npublic class MyClass {\n    public static void\
    \ main(String[] args) {\n        System.out.println(\"Hello World, Java Program\"\
    );\n    }\n}\n```\n\n现在，main 方法包含了这条唯一的 Java 指令：`System.out.println(\"Hello World,\
    \ Java Program\");`。这条指令会将文本 Hello World, Java Program 打印到*控制台*（console）。如果你从命令行运行\
    \ Java 程序，你将在命令行控制台（计算机的文本界面）中看到输出。如果你在 IDE 内部运行 Java 程序，IDE 通常会捕获所有到控制台的输出，并使其在\
    \ IDE 内部某处可见。\n\n## 运行 main() 方法：\n\n当你启动 Java 程序时，通常是通过命令行（控制台）进行的。你调用随 JRE 附的\
    \ java 命令，告诉它要执行哪个 Java 类以及传递给 main() 方法的参数。Java 应用程序然后在 JVM 内部执行（或者有人声称是由 JVM\
    \ 执行的）。这里有一张说明这一点的图：\n\n![](img/81147dcafcee2d431dfe108a34b4c094_54_0.png)\n\n\
    执行 java 命令的命令行，该命令转而执行 Java main 程序。\n\n以下是一个命令行示例：\n\n```\njava -cp classes myjavacode.MyClass\n\
    ```\n\n该命令的第一部分是 `java` 命令。该命令启动了 JVM。在某些情况下，你可能需要指定 java 命令在计算机上所在的完整路径（通常在 Java\
    \ 安装目录下的 bin 子目录）。\n\n第二个和第三个参数（`-cp classes`）告诉 JVM 编译后的 Java 类位于哪个目录（cp 表示类路径，class\
    \ path）。在这种情况下，编译后的 Java 类位于名为 `classes` 的目录中。\n\n第四个参数是 JVM 要执行的 Java 类名。注意类名也包含了该类所在的包名（“完全限定类名”）。\n\
    \n## 向 main() 方法传递参数：\n\n你可以从命令行向 main() 方法传递参数。这行命令行展示了这一点：`java -cp classes\
    \ myjavcode.MyClass Hello World`。当 JVM 执行 `myjavcode.MyClass` 的 main() 方法时，作为参数传递给\
    \ main() 方法的 String 数组将包含两个字符串：\"Hello\" 和 \"World\"。\n\nmain() 方法可以如下访问来自命令行的参数：\n\
    \n```java\npackage myjavcode;\n\npublic class MyClass {\n\n    public static void\
    \ main(String[] args) {\n        System.out.println(args[0]); \n        System.out.println(args[1]);\
    \ \n    }\n}\n```\n\n注意 `args` 数组中对元素 0 和元素 1 的引用（`args[0]` 和 `args[1]`）。`args[0]`\
    \ 将包含字符串（文本）Hello，而 `args[1]` 将包含字符串 World。\n\n变量和数组将在后的文中进行更详细的解释。如果你在此时还没有完全理解它们，不要担心。\n\
    \n## Java 主类：\n\n如果你的 Java 程序中只有一个 Java 类包含 main() 方法，那么包含 main() 方法的类通常被称为*主类*（main\
    \ class）。\n\n你可以在项目中拥有任意数量带有 main() 方法的类。但是，Java 虚拟机每次只能被指令运行其中一个。你仍然可以在 Java\
    \ 虚拟机执行的 main() 方法内部调用其他的 main() 方法（你现在还没有看到如何操作），你也可以启动多个虚拟机，每个虚拟机执行单独的 main()\
    \ 方法。\n\n## 访问控制\n\n所有优秀的写作者（包括编写软件的人）都知道，一件作品在被重写（通常是多次重写）之前是不完善的。如果你把一段代码放在抽屉里一段时间，然后回来查看，你可能会重新发现它。\n\
    \n改变的愿望与保持不变的需求之间存在张力。为了解决这个问题，Java 提供了访问修饰符，允许库创建者说明哪些是程序员可用的，哪些是不可用的。从“权限最大”到“权限最小”的访问级别分别是\
    \ **public**（公共）、**protected**（受保护）、**package access**（包访问，无关键字）和 **private**（私有）。从上一段你可能会认为，作为库的设计师，你希望尽可能地保持一切为“私有”，并只暴露你想让客户端使用的方法。事实恰恰是这样，尽管对于习惯了无限制访问一切的其他语言（如\
    \ C 语言）程序员来说，这是违反直觉的。\n\n"
