    \n# Quicksort\n\nSort algorithms order the elements of an array according to a\
    \ predefined order. Quicksort is a divide and conquer algorithm. In a divide and\
    \ conquer sorting algorithm the original data is separated into two parts \"divide\"\
    \ which are individually sorted and \"conquered\" and then combined Algorithm:\n\
    \nIf the array contains only one element or zero elements than the array is sorted.\n\
    \nIf the array contains more than one element than:\n\n- Select an element from\
    \ the array. This is called the \"pivot element\". For example select the element\
    \ in the middle of the array.\n\n- All elements which are smaller then the pivot\
    \ element are placed in one array and all elements which are larger are placed\
    \ in another array.\n\n- Sort both arrays by recursively applying Quicksort to\
    \ them.\n\n- Combine the arrays.\n\nQuicksort can be implemented to sort \"in-place\"\
    . This means that the sorting takes place in the array and that no additional\
    \ array needs to be created.\n\n# Program: Java program for implementation of\
    \ QuickSort\n\n```java\nclass QuickSort\n{\n    /* This function takes last element\
    \ as pivot, places the pivot element at its\n    correct position in sorted array,\
    \ and places all smaller (smaller than pivot) to left\n    of pivot and all greater\
    \ elements to right of pivot */\n\n    int partition(int arr[], int low, int high)\
    \ {\n        int pivot = arr[high];\n        for (int i = (low-1); // index of\
    \ smaller element\n        for (int j=low; j<=high-1; j++) {\n            // If\
    \ current element is smaller than or equal to pivot\n            if (arr[j] <=\
    \ pivot) {\n                i++;\n                // swap arr[i] and arr[j]\n\
    \                int temp = arr[i];\n                arr[i] = arr[j];\n      \
    \          arr[j] = temp;\n            }\n        }\n        // swap arr[i+1]\
    \ and arr[high] (or pivot)\n        int temp = arr[i+1];\n        arr[i+1] = arr[high];\n\
    \        arr[high] = temp;\n\n        return i+1;\n    }\n\n    /* The main function\
    \ that implements QuickSort() arr[] --> Array to be sorted, low --> Starting index,\n\
    \    high--> Ending index */\n    void sort(int arr[], int low, int high)\n  \
    \  {\n      if (low < high)\n      {\n        /* pi is partitioning index, arr[pi]\
    \ is now at right place */\n        int pi = partition(arr, low, high);\n    \
    \    // Recursively sort elements before partition and after partition\n     \
    \   sort(arr, low, pi-1);\n        sort(arr, pi+1, high);\n      }\n    }\n\n\
    \    /* A Utility function to print array of size n */\n    static void printArray(int\
    \ arr[])\n    {\n      int n = arr.length;\n      for (int i=0; i<n; ++i)\n  \
    \      System.out.print(arr[i]+\" \");\n      System.out.println();\n    }\n\n\
    \    public static void main(String args[])\n    {\n      int arr[] = {10, 7,\
    \ 8, 9, 1, 5};\n      int n = arr.length;\n      QuickSort ob = new QuickSort();\n\
    \      ob.sort(arr, 0, n-1);\n      System.out.println(\"sorted array\");\n  \
    \    printArray(arr);\n    }\n}\n```\n\n# Output:\n\nSorted array:\n1 5 7 8 9\
    \ 10\n\n# Selection sort\n\nSelection sort is a simple sorting algorithm. This\
    \ sorting algorithm is an-place comparison-based algorithm in which the list is\
    \ divided into two parts, the sorted part at the left end and the unsorted part\
    \ at the right end. Initially, the sorted part is empty and the unsorted part\
    \ is the entire list.\n\nThe smallest element is selected from the unsorted array\
    \ and swapped with the leftmost element, and that element becomes a part of the\
    \ sorted array. This process continues moving unsorted array boundary by one element\
    \ to the right.\n\nThis algorithm is not suitable for large data sets as its average\
    \ and worst case complexities are of O(n²), where n is the number of items.\n\n\
    # Algorithm:\n\n- **Step 1** – Set MIN to location 0\n- **Step 2** – Search the\
    \ minimum element in the list\n- **Step 3** – Swap with value at location MIN\n\
    - **Step 4** – Increment MIN to point to next element\n- **Step 5** – Repeat until\
    \ list is sorted\n\n# Program: Selection Sort in Java\n\n```java\npublic class\
    \ SelectionSortExample {\n    public static void selectionSort(int[] arr) {\n\
    \        for (int i = 0; i < arr.length - 1; i++) {\n            int index = i;\
    \ \n            for (int j = i + 1; j < arr.length; j++) {\n                if\
    \ (arr[j] < arr[index]){\n                    index = j; // searching for lowest\
    \ index \n                }\n            }\n            int smallerNumber = arr[index];\
    \ \n            arr[index] = arr[i];\n            arr[i] = smallerNumber;\n  \
    \      }\n    }\n\n    public static void main(String a[]) {\n        int[] arr1\
    \ = {9,14,3,2,43,11,58,22}; \n        System.out.println(\"Before Selection Sort\"\
    );\n        for (int i:arr1) {\n            System.out.print(i+\", \"); \n   \
    \     }\n        System.out.println();\n        \n        selectionSort(arr1);\n\
    \        \n        System.out.println(\"After Selection Sort\");\n        for(int\
    \ i:arr1){\n            System.out.print(i+\", \"); \n        }\n        System.out.println();\n\
    \    }\n}\n```\n\n# Output:\n\nBefore Selection Sort\n9, 14, 3, 2, 43, 11, 58,\
    \ 22, \n\nAfter Selection Sort\n2, 3, 9, 11, 14, 22, 43, 58, \n\n# Linked List\n\
    \nA linked list is a sequence of nodes, which are connected via links. Each node\
