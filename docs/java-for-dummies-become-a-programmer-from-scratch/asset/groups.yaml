    \ of thought.\n\n# 4. DATA STRUCTURES\n\nGranted, your language can give you a\
    \ basic idea of what the different data structures are. But again, that’s a basic\
    \ idea.\n\nSelf-taught programmers can have a tendency to only stick to data structures\
    \ that work within their favorite language. Just because it’s not a primitive,\
    \ or even a common structure in your language, that doesn’t mean it can’t exist.\
    \ Of course, that also means that maybe it shouldn’t exist, either.\n\n> *The\
    \ world is very small if it all can fit inside of an array.*\n\n# 5. TESTING\n\
    \nMaybe it's just me, but there's a lot of ways to test your code before pushing\
    \ it to an environment. Learn how to do unit testing.\n\nMore importantly, learn\
    \ test-driven development.\n\nThere's a difference between testing your code,\
    \ and writing testable code.\n\n# SELF-TAUGHT PROGRAMMERS I HAVE INTERVIEWED OFTEN\
    \ LACKED KNOWLEDGE IN THESE AREAS:\n\n- *FORMAL VOCABULARY.* You have to know\
    \ the correct names of data structures and other things by heart to be able to\
    \ have an effective conversation related to a project in software development.\n\
    - *TESTING.* Most of the autodidacts lack knowledge or generally do not understand\
    \ the importance of the testing process.\n- *PARADIGMS (and corresponding language).*\
    \ “If you only have a hammer, everything looks like a nail.” I’ve had many of\
    \ these-types. They often do not understand why every problem can be solved the\
    \ same.\n- *MACHINE RELATED MATHEMATICAL PROBLEMS.* They lack numerical skills\
    \ and do not understand why floating points arithmetic can fail you.\n\n# 9 WAYS\
    \ TO BECOME GREAT PROGRAMMER\n\n# 1. PRACTICE\n\nAsides from following tutorials,\
    \ you should work on your own projects.\n\n> \"Becoming a good programmer takes\
    \ a long, long time and a lot of tedious evenings. Before you can write good code,\
