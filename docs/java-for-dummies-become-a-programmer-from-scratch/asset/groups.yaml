    \ Puppy(String name) {\n        // This constructor has one parameter, name.\n\
    \    }\n}\n```\n\nJava also supports Singleton Classes where you would be able\
    \ to create only one instance of a class.\n\n# Introduction to Objects\n\nObject\
    \ oriented programming (OOP) was invented to associate data and logic into nicely\
    \ packaged bundles of code. When you write a class in Java you're creating blueprints\
    \ and instructions for a new object. Any number of objects can then be constructed\
    \ based on your blueprints. Programmers use the term instantiate when talking\
    \ about creating an object from the class blueprint. Each instantiated object\
    \ is an instance of the class from which it was constructed. The class is not\
    \ one of the instances created by it. The newly created object contains all of\
    \ the functions and data written into the class.\n\nAll programming languages\
    \ provide abstractions. It can be argued that the complexity of the problems you're\
    \ able to solve is directly related to the kind and quality of abstraction. By\
    \ “kind” I mean, “What is it that you are abstracting?” Assembly language is a\
    \ small abstraction of the underlying machine. Many so-called “imperative” languages\
    \ that followed (such as FORTRAN, BASIC, and C) were abstractions of assembly\
    \ language. These languages are big improvements over assembly, but their primary\
    \ abstraction requires you to think in terms of the structure of the computer\
    \ rather than the structure of the problem you are trying to solve.\n\nThe programmer\
    \ must establish the association between the machine model (in the “solution space,”\
    \ which is the place where you're implementing that solution, such as a computer)\
    \ and the model of the problem that is actually being solved (in the “problem\
    \ space,” which is the place where the problem exists, such as a business). The\
    \ effort required to perform this mapping, and the fact that it is intrinsic to\
    \ the programming language, produces programs that are difficult to write and\
    \ expensive to maintain, and as a side effect created the entire “programming\
    \ methods” industry.\n\nThe alternative to modeling the machine is the model you're\
    \ trying to solve. Early languages such as LISP and APL choose particular views\
    \ of the world (“All problems are ultimately lists” or “All problems are algorithmic,”\
    \ respectively). Prolog casts all problems into chains of decisions. Languages\
    \ have been created for constraint-based programming and for programming exclusively\
    \ by manipulating graphical symbols. (The latter proved to be too restrictive.)\
    \ Each of these approaches may be a good solution to the particular class of problem\
    \ they're designed to solve, but when you step outside of that domain they become\
    \ awkward.\n\nThe object-oriented approach goes a step further by providing tools\
    \ for the programmer to represent elements in the problem space. This representation\
    \ is general enough that the programmer is not constrained to any particular type\
    \ of problem. We refer to the elements in the problem space and their representations\
    \ in the solution space as “objects.\" (You will also need other objects that\
    \ don't have problem-space analogs.) The idea is that the program is allowed to\
    \ adapt itself to the lingo of the problem by adding new types of objects, so\
    \ when you read the code describing the solution, you're reading words that also\
    \ express the problem, rather than in terms of the computer where the solution\
    \ will run. Thus, OOP allows you to describe the problem in terms of the problem.\
    \ There's still a connection back to the computer: Each object looks quite a bit\
    \ like a little computer—it has a state, and it has operations that you can ask\
    \ it to perform. However, this doesn't seem like such a bad analogy to objects\
    \ in the real world—they all have characteristics and behaviors.\n\nTo simply\
    \ put, OOP is the process of building objects, instancing them, and then using\
    \ them. Using objects involves reading logic on the data, using logic data, and\
    \ then carrying out tasks based on the logic.\n\n# Creating an Object:\n\nAs mentioned\
    \ previously, a class provides the blueprints for objects. So basically, an object\
    \ is created from a class. In Java, the new keyword is used to create new objects.\n\
    \nThere are three steps when creating an object from a class:\n\n- **Declaration:**\
    \ A variable declaration with a variable name with an object type.\n- **Instantiation:**\
    \ The 'new' keyword is used to create the object.\n- **Initialization:** The 'new'\
    \ keyword is followed by a call to a constructor. This call initializes the new\
    \ object.\n\nFollowing is an example of creating an object:\n\n```java\npublic\
    \ class Puppy {\n    public Puppy(String name) {\n        // This constructor\
    \ has one parameter, name.\n        System.out.println(\"Passed Name is :\" +\
    \ name ); \n    }\n    public static void main(String[] args) {\n        // Following\
    \ statement would create an object\n        Puppy myPuppy = new Puppy(\"tommy\"\
    ); \n    }\n}\n```\n\nOutput:\nPassed Name is :tommy\n\n# Accessing Instance Variables\
    \ and Methods:\n\nInstance variables and methods are accessed via created objects.\
    \ To access an instance variable, following is the fully qualified path: /* First\
    \ create an object */\n\n```java\nObjectReference objectReference = new Constructor();\n\
    /* Now call a variable as follows */\nobjectReference.variableName;\n```\n\n```java\n\
    /* Now you can call a class method as follows */\nobjectReference.MethodName();\n\
    ```\n\n# Example:\n\nThis example explains how to access instance variables and\
    \ methods of a class.\n\n```java\npublic class Puppy {\n    int puppyAge;\n  \
    \  public Puppy(String name) {\n        // This constructor has one parameter,\
    \ name.\n        System.out.println(\"Name chosen is: \" + name );\n    }\n  \
    \  public void setAge(int age) {\n        puppyAge = age;\n    }\n    public int\
    \ getAge() {\n        System.out.println(\"Puppy's age is: \" + puppyAge ); \n\
    \        return puppyAge;\n    }\n}\n```\n\n```java\npublic static void main(String\
    \ []args) {\n    /* Object creation */\n    Puppy myPuppy = new Puppy(\"tommy\"\
    );\n    /* Call class method to set puppy's age */\n    myPuppy.setAge( 2 );\n\
    \n    /* Call another method to get puppy's age */\n    myPuppy.getAge();\n\n\
    \    /* You can access instance variable as follows as well */\n    System.out.println(\"\
    Variable Value :\" + myPuppy.puppyAge); \n}\n```\n\nIf we compile and run the\
    \ above program, then it will produce the following result: **Output:**\n\nName\
    \ chosen is :tommy\nPuppy's age is :2\nVariable Value :2\n\nCharacteristics of\
    \ object-oriented programming: These characteristics represent a pure approach\
    \ to object-oriented programming:\n\n**1. Everything is an object.** Think of\
    \ an object as a fancy variable; it stores data, but you can \"make requests\"\
    \ to that object, asking it to perform operations on itself. In theory, you can\
    \ take any conceptual component in the problem you're trying to solve (dogs, buildings,\
    \ services, etc.) and represent it as an object in your program.\n\n**2. A program\
    \ is a bunch of objects telling each other what to do by sending messages.** To\
    \ make a request of an object, you \"send a message\" to that object. More concretely,\
    \ you can think of a message as a request to call a method that belongs to a particular\
    \ object.\n\n**3. Each object has its own memory made up of other objects.** Another\
    \ way, you create a new kind of object by making a package containing existing\
    \ objects. Thus, you can build complexity into a program while hiding behind the\
    \ simplicity of objects.\n\n**4. Every object has a type.** Using the parlance,\
    \ each object is an instance of a class, in which \"class\" is synonymous with\
    \ \"type.\" The most important distinguishing characteristic of a class is “What\
    \ messages can you send to it?\n\n**5. All objects of a particular type can receive\
    \ the same messages.** This is actually a loaded statement, as you will see later.\
    \ Because an object of type “circle” is also an object of type “shape,” a circle\
    \ is guaranteed to accept shape messages. This means you can write code that talks\
    \ to shapes and automatically handle anything that fits the description of a shape.\
    \ This substitutability is one of the powerful concepts in OOP.\n\nEven more succinct\
    \ description of an object is:\n\nAn object has state, behavior and identity.\n"
  mdcn: "\n\n```java\npublic class Puppy {\n    public Puppy() {\n    }\n\n    public\
    \ Puppy(String name) {\n        // This constructor has one parameter, name.\n\
    \    }\n}\n```\n\nJava 还支持单例类（Singleton Classes），你只能为类创建一个实例。\n\n# 对象介绍\n\n面向对象编程（OOP）的发明是为了将数据和逻辑关联成封装良好的代码包。当你在\
    \ Java 中编写一个类时，你正在为新对象创建蓝图和指令。然后可以根据你的蓝图构建任意数量的实例。程序员在谈论从类蓝图创建对象时会使用“实例化”（instantiate）一词。每个实例化的对象都是其构建基础的类的实例。类本身并不是由它创建的实例之一。新创建的对象包含了写入类中的所有函数和数据。\n\
    \n所有的编程语言都提供抽象。可以认为，你能够解决问题的复杂性与抽象的类型和质量直接相关。我所说的“类型”是指“你正在抽象的是什么？”汇编语言是对底层机器的一种抽象。随后的许多所谓的“命令式”语言（如\
    \ FORTRAN、BASIC 和 C）都是汇编语言的抽象。这些语言是对汇编的巨大改进，但它们的主要抽象要求你按照计算机的结构而非你试图解决的问题的结构来思考。\n\
    \n程序员必须在机器模型（位于“解决方案空间”，即你实现该解决方案的地方，如计算机）与实际正在解决的问题模型（位于“问题空间”，即问题存在的地方，如业务）之间建立关联。执行这种映射所需的努力，以及这种映射是编程语言固有属性的事实，导致了编写困难且维护昂贵的程序，并作为副作用催生了整个“编程方法”行业。\n\
    \n对机器建模的替代方案是你试图解决的模型。早期语言（如 LISP 和 APL）选择了特定的世界观（分别为“所有问题归结底都是列表”或“所有问题都是算法的”）。Prolog\
    \ 将所有问题转化为决策链。还创建了专门用于基于约束编程的语言以及专门通过操作图形符号进行编程的语言。（后者被证明过于局限。）这些方法方法对于它们设计用于解决的特定类问题可能都是很好的解决方案，但当你跳出该领域时，它们就会变得笨拙。\n\
    \n面向对象的方法更进了一步，为程序员提供了表示问题空间中元素的工具。这种表示足够通用，以至于程序员不受限于任何特定类型的问题。我们将问题空间中的元素及其在解决方案空间中的表示称为“对象”。（你可能还需要其他没有问题空间对应物的对象。）这种想法是，允许程序通过添加新类型的对象来使自己适应问题的术语，因此当你读取描述解决方案的代码时，你读的是同样表达了问题的词汇，而不是根据运行解决方案的计算机术语来描述。因此，OOP\
    \ 允许你用问题本身来描述问题。这与计算机仍然有联系：每个对象看起来都很像一个小计算机——它有状态，还有你可以要求它执行的操作。然而，这对于现实世界中的对象似乎并不是一个糟糕的类比——它们都具有特征和行为。\n\
    \n简单来说，OOP 是构建对象、实例化它们然后使用它们的过程。使用对象涉及对数据读取逻辑、使用逻辑数据，然后根据逻辑执行任务。\n\n# 创建对象：\n\n\
    如前所述，类为对象提供了蓝图。所以基本上，对象是从类创建的。在 Java 中，使用 `new` 关键字来创建新对象。\n\n从类创建对象有三个步骤：\n\n\
    -   **声明：** 一个带有变量名和对象类型的变量声明。\n-   **实例化：** 使用 `new` 关键字创建对象。\n-   **初始化：** `new`\
    \ 关键字后紧跟对构造函数的调用。该调用初始化了新对象。\n\n以下是创建一个对象的示例：\n\n```java\npublic class Puppy {\n\
    \    public Puppy(String name) {\n        // This constructor has one parameter,\
    \ name.\n        System.out.println(\"Passed Name is :\" + name ); \n    }\n \
    \   public static void main(String[] args) {\n        // Following statement would\
    \ create an object\n        Puppy myPuppy = new Puppy(\"tommy\"); \n    }\n}\n\
    ```\n\n输出：\nPassed Name is :tommy\n\n# 访问实例变量和方法：\n\n实例变量和方法通过创建的对象来访问。要访问实例变量，全限定路径如下：/*\
    \ 先创建一个对象 */\n\n```java\nObjectReference objectReference = new Constructor();\n\
    /* 现在按照如下方式调用变量 */\nobjectReference.variableName;\n```\n\n```java\n/* 现在你可以如下所示调用类方法\
    \ */\nobjectReference.MethodName();\n```\n\n# 示例：\n\n此示例解释了如何访问类的实例变量和方法。\n\n\
    ```java\npublic class Puppy {\n    int puppyAge;\n    public Puppy(String name)\
    \ {\n        // This constructor has one parameter, name.\n        System.out.println(\"\
    Name chosen is: \" + name );\n    }\n    public void setAge(int age) {\n     \
    \   puppyAge = age;\n    }\n    public int getAge() {\n        System.out.println(\"\
    Puppy's age is: \" + puppyAge ); \n        return puppyAge;\n    }\n}\n```\n\n\
    ```java\npublic static void main(String []args) {\n    /* Object creation */\n\
    \    Puppy myPuppy = new Puppy(\"tommy\");\n    /* 调用类方法设置狗的年龄 */\n    myPuppy.setAge(\
    \ 2 );\n\n    /* 调用另一个方法获取狗的年龄 */\n    myPuppy.getAge();\n\n    /* 你也可以这样访问实例变量\
    \ */\n    System.out.println(\"Variable Value :\" + myPuppy.puppyAge); \n}\n```\n\
    \n如果我们编译并运行上述程序，它将产生以下结果：**输出：**\n\nName chosen is :tommy\nPuppy's age is :2\n\
    Variable Value :2\n\n面向对象编程的特征：这些特征代表了面向对象编程的纯粹方法：\n\n**1. 一切皆对象。** 将一个对象看作一个高级变量；它存储数据，但你可以向该对象“提出请求”，要求它对自身执行操作。在理论上，你可以取你试图解决的问题中的任何概念性组件（狗、建筑、服务等），并将其表示为程序中的一个对象。\n\
    \n**2. 程序是一组对象通过发送消息来互相告诉对方该做什么。** 要对一个对象提出请求，你向该对象“发送一条消息”。更具体地说，你可以将消息看作是对特定对象的方法的调用。\n\
    \n**3. 每个对象都有由其他对象构成的内存。** 另一种方式是，你通过创建一个包含现有对象的包来创建一个新类型的对象。因此，你可以在隐藏对象简单性的同时，在程序中构建复杂性。\n\
    \n**4. 每个对象都有一个类型。** 用术语来说，每个对象都是类的实例，其中“类”与“类型”是同义的。类最重要的区别特征是“你可以向它发送什么消息？”\n\
    \n**5. 同一类型的所有对象都可以接收相同的消息。** 这实际上是一个带有深意的陈述，正如你稍后看到的。因为类型为“圆”的对象也是“形状”类型的对象，所以圆保证接受形状消息。这意味着你可以编写处理形状的代码，并自动处理任何符合形状描述的物体。这种可替代性是\
    \ OOP 中强大的概念之一。\n\n对对象更简洁的描述是：\n\n对象具有状态、行为和身份。\n\n"
