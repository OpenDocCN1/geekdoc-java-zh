    \ PC 上准备好所需的软件，即在我们的电脑上安装这些软件，用于用于编写计算机程序、编译并执行它们。例如，如果你需要浏览互联网，那么你需要在你的机器上进行以下设置：\n\
    \n- 一个可以连接互联网的有效连接\n- 一个 Web 浏览器，如 Internet Explorer、Chrome、Safari 等\n\n同样，为了开始使用任何编程语言进行编程，你还需要以下设置：\n\
    \n- 一个用于创建计算机程序的文本编辑器。\n- 一个用于将程序编译成二进制格式的编译器。\n- 一个用于直接执行程序的解释器。\n\n我们建议你使用 IDE（集成开发环境），这是一个非常方便且出色的软件，它将文本编辑器、调试器和编译器合于一体，虽然软件包臃肿但通常非常实用。\n\
    \n除非你致力于在文本编辑器和命令行窗口中工作（而且这样做确实有充分的理由），否则你可能在寻找关于如何选择良好的 IDE 的建议、各种类型 IDE 的优缺点、运行特定\
    \ IDE 的相对成本（财务或系统资源）、该 IDE 可能能够良好处理的其他语言、它运行的操作系统，以及更多其他内容。\n\n以下是程序员最常用的两种 IDE\
    \ 列表。\n\n### Eclipse\n\n- **语言：** C, C++, Python, Perl, PHP, Java, Ruby 等\n- **价格：**\
    \ 免费\n\nEclipse 是一个免费且开源的编辑器，许多开发框架都基于它构建。它是该领域的老大哥之一，被许多专业开发者强烈推荐。Eclipse 起是一个\
    \ Java 开发环境，通过轻量级插件系统得到了极大扩展。\n\n### NetBeans\n\n- **语言：** Java, JavaScript, PHP,\
    \ Python, Ruby, C, C++ 等\n- **价格：** 免费\n\nNetBeans 与 Eclipse 并肩，是该类别中最受推荐的 IDE。它是免费开源的，支持大量语言并不断推出新插件，而且对于初学者来说，安装和使用也非常简单。\n\
    \n## 编译与执行\n\n一个简单的 Java 项目包含一个目录，所有的 Java 源文件都存储在其中。Java 文件通常不直接存储在源目录下，而是存储在与其包结构对应的子目录中。包仅仅是将相互相关的源文件分组的一种方式。\n\
    \n当你编译源目录中的所有源代码时，编译器会为每个 .java 文件生成一个 .class 文件。换句话说，.class 文件包含了 .java 文件的编译版本，即该\
    \ .java 文件的字节码。\n\nJava 虚拟机（JVM）可以执行的是 .class 文件，而不是从 .class 文件中生成的 .java 文件。这通常通过指示编译器将\
    \ .class 文件写入单独的目录来实现。该目录通常被称为 classes，但再次强调，这不是强制要求的，它取决于你使用的构建工具或 IDE 等。\n\n\
    ## 编译 Java 源码：\n\n你可以直接从 IDE 编译 Java 源码（如果你使用 IDE 的话）。或者，你可以使用 Java SDK 自带的 Java\
    \ 编译器。从命令行使用 Java 编译器编译你的 Java 源码，请执行以下操作：\n\n- 打开命令行\n- 切换目录到你的项目根目录（而不是源目录）\n\
    - 确保项目根目录包含一个源目录和一个类目录\n- 输入下面的命令（在 Windows 上 - 其他操作系统也类似）：\n\n```\n\"c:\\Program\
    \ Files\\Java\\jdk1.8.0_25\\bin\\javac\" src/myfirstapp/*.java -d classes\n```\n\
    \n此命令执行了 javac 命令（Java 编译器），它编译了 src/myfirstapp 目录下的 Java 源码。`*.java` 编译器应该编译给定目录中的所有文件。\n\
    \nmyfirstapp 目录是根源目录 src 下的一个包。如果你在根源目录下有多个包，你将必须多次运行 Java 编译器。Java IDE 会自动为你处理这一点。Ant、Maven\
    \ 或 Gradle 等构建工具也是如此。\n\n## 运行编译后的 Java 代码：一旦编译器完成工作，classes 目录将包含编译后的 .class\
    \ 文件。源目录中的包结构（目录结构）将在类 目录下被保留。你可以运行这些任何包含 `main()` 方法的 .class 文件。你可以在 Java IDE\
    \ 内部运行 .class，也可以从命令行运行。从命令行运行看起来像这样：'c:\\Program Files\\Java\\jdk1.8.0_25\\bin\\\
    java' -cp classes myfirstapp.MyFlaskApp。其中 `-cp classes` 告诉 Java 虚拟机你所有的类都位于名为\
    \ classes 的目录下。这也被称为“类路径”（Class Path，缩写为 cp）。\n\n要运行的类名是上述命令中的最后一个参数 —— `myfirstapp.MyFlaskApp`\
    \ 部分。\n\nJVM 需要知道全限定类名（所有包名加类名）来确定相应的 .class 文件所在。\n\n当你运行该类时，你的命令行看起来如下所示（包括\
    \ Java 程序的输出）：\n\n```\nD:\\data\\projects\\myfirstapp>\"c:\\Program Files\\Java\\\
    jdk1.8.0_25\\bin\\java\" \n-cp classes myfirstapp.MyFlaskApp\nHello World!\n```\n\
    D:\\data\\projects\\myfirstapp>\n```\n（注意，第一条命令不应该有换行符。我这样做只是为了方便阅读。）\n\n就这些！现在你知道如何编译和执行你的程序了！如之前提到的，使用\
    \ IDE 可能会更容易，但你可能在任何地方都没有它。\n\n## 第三章 | 基础术语\n\n本节将涵盖许多基础术语以及编写代码背后的一些基本概念。当我们通过前几章后，我们将引入更多与读写直接相关的概念。在在此之前，我们需要涵盖一些适用于许多不同语言（而不只是\
    \ Java）的术语和概念。将单词转换为可执行代码的方法和系统需要相当严格的规则。写英语或在线聊天时，我们倾向于忽略格式和标点符号。简洁性允许更快的通信，但这仅仅是因为我们人类学会了许多新词，并可以利用上下文更好地解释在线或短信中英语形式的缩写和首略。计算机并没有那么聪明，能如此轻易地解释我们的单词。\n\
    \n## 标记 (Tokens)\n\n在书面英语中，语言的最小元素是字母和数字。单独来说，大多数字母和数字缺乏特定的意义。字母之后更大的元素是单词。每个单词都有更多的意义，但复杂的思想很难用一个单词传达。为了交流一个思想，我们使用句子。句子中的每个单词都有特定的用途，如下图所示。为了传达一个概念，我们使用一组句子组成一个段落。为了表达情感，我们使用许多段落组织成章节。为了讲述故事，我们使用书籍，即章节的集合。\n\
    \n![](img/81147dcafcee2d431dfe108a34b4c094_35_0.png)\n\n编程具有类似的组织机制。最小的有意义元素是标记（token），随后是语句、代码块、函数，然后是类和命名空间，最后是程序，在我们的案例中是游戏。我们将从最小的元素开始，逐步到编写我们自己的类。然而，在开始编写任何复杂代码之前，了解最微小的元素对于理解所有部分是如何结合的是非常重要的。\n\
    \n"
