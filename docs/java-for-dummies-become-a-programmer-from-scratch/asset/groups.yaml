    \n编程很大程度上涉及到对风格的正确使用，以及大量的空白字符来实现这种风格。到目前为止，我们只是在学习词汇，但如果没有这些词汇，我们就无法对编程进行适当的交流。这也包括与其他程序员朋友交流，如果你不能用他们的语言交流，他们将很难理解你。\n\
    \n# 逻辑与运算符\n\n逻辑允许你根据变量的变化控制函数中哪些部分被评估。使用逻辑，你将能够更改代码中运行的语句。简单来说，你写的任何内容必须涵盖你计划涵盖每种情况。逻辑通过几个简单的系统进行控制，主要是\
    \ `if` 关键字及其变体。\n\n# 布尔值：\n\nJava 中的布尔值（简称 `bool`）要么为真（true），要么为假（false）。最好将其想象为处于开启或关闭位置的开关。要将变量声明为\
    \ `bool`，你可以使用如下内容。\n\n```\npublic class Example\n{    public bool SomeBool;\n\
    }\n```\n\n# 等于运算符：\n\n相等运算符创建布尔条件。设置布尔变量有很多方法。例如，值之间的比较是设置变量的有用方法。确定相等的最基本方法是使用以下运算符：`==`。单等号和双等号符号的使用是有区别的。`=`\
    \ 用于赋值，而 `==` 用于比较值。\n\n当你需要比较两个值时，可以使用以下概念。如果你可能需要和程序员交流，你需要记住这些运算符被称为相等运算符。\n\
    \n语法初看起来看起来可能有点困惑，但有办法解决。\n\n```\nvoid Func ()\n{\n    SomeBool = (1 == 1);\n\
    }\n```\n\n还有其他运算符需要注意。我们将在本章的后半部分介绍其他逻辑运算符。在这种情况下，我们是在询问两个数值是否相同。\n\n为了让这更清晰，我们可以将代码拆分成更多行。现在我们正在看\
    \ `a` 和 `b`。显然，它们看起来并不相同；毕竟它们是不同的字母。然而，它们包含相同的整数值，而这才是这里正在比较的内容。\n\n```\nvoid\
    \ Func ()\n{\n  int a = 1;\n  int b = 1;\n  SomeBool = (a == b);\n}\n```\n\n评估有左侧和右侧。单等号运算符（`=`）分隔了不同的侧。`=`\
    \ 的左侧被计算，并查看右侧的值以获取赋值。因为 `1 == 1`，也就是说 1 等于 1，该语句的最终结果是 `SomeBool` 为 `true`。\n\
    \n# 关系运算符：\n\n布尔值也可以通过比较值来设置。用于比较两个不同值的运算符被称为关系运算符。我们使用 `==`（相等符号）来检查值是否相同；我们也可以使用\
    \ `!=`（不等于）来检查两个变量是否不同。\n这与前一节中的 `!` 作用类似。程序员更经常检查一个值是否大于或小于另一个值。他们通过使用 `>`（大于）和\
    \ `<`（小于）来这样做。我们还可以使用 `>=`（大于或等于）和 `<=`（小于或等于）。让我们看看这种用法的一些示例。\n\n```\npublic\
    \ class Test {\n    public static void main(String args[]) {\n        int a =\
    \ 10; int b = 20; System.out.println(\"a == b\");\n        System.out.println(\"\
    a != b\");\n        System.out.println(\"a > b\");\n        System.out.println(\"\
    a < b\");\n        System.out.println(\"a >= b\");\n        System.out.println(\"\
    a <= b\");\n    }\n}\n```\n\n输出：\n\n```\na == b = false\na != b = true\na > b\
    \ = false\na < b = true\na >= b = true\na <= b = true\n```\n\n# 第 7 章 | 控制执行、循环与数组\n\
    \n# 控制执行\n\n控制语句允许你根据特殊条件运行或跳过代码块。Java 代码通常从上到下执行。然而，控制语句通过采用决策、循环和分支来打破流程。\n\n\
    Java 使用 C 语言所有的执行语句。在 Java 中，关键字包括 `if-else`、`while`、`do-while`、`for`、`return`、`break`\
    \ 以及一个名为 `switch` 的选择语句。\n\nJava 不支持 goto（尽管它是某些问题的快捷方法，但受到了更多限制）。\n\n# 真与假：\n\
    \n![](img/81147dcafcee2d431dfe108a34b494.png)\n\n所有条件语句都使用条件表达式真假来确定执行路径。条件表达式的一个示例是\
    \ `a == b`。这使用相等运算符检查 `a` 的值是否等于 `b`。它返回真或假。在前节中看到的任何关系运算符都可以产生条件语句。\n\n注意 Java\
    \ 不允许将数字作为布尔值，尽管这在 C 和 C++ 中是允许的（非零为真，零为假）。如果你想在布尔测试中使用非布尔值（例如 `if(a)`），你必须首先通过条件表达式将其转换为布尔值，例如\
    \ `if(a != 0)`。\n\n# if-else 语句：\n\n![](img/81147dcafcee2d431dfe108a34b494.png)\n\
    \n`if-else` 语句是控制流程的最基本方法。`else` 是可选的，因此你可以以两种形式使用 `if`：\n\n```\n```\nif(布尔表达式)\
    \ {\n\n```\n//语句\n```\n```\n\n或者\n\n```\n```\nif(布尔表达式) {\n//语句\n} else {\n//语句\n\
    }\n```\n```\n\n如果布尔表达式为真，则语句内部的代码块将被执行。如果不是，则语句结束处（右大括号之后）的第一组代码将被执行。\n\n布尔表达式必须产生布尔结果。语句要么是以分号终止的简单语句，要么是用花括号封装的一组简单语句（复合语句）。\n\
    \n每当使用“语句”一词时，总是意味着语句可以是简单的或复合的。\n"
