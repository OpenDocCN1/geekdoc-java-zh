    \n```java\nint a = 0;\nfloat b = 0;\n\nvoid SetA(int i, float j) {\n    a = i;\n\
    \    b = j;\n}\n```\n\n具有多个参数的函数可以做更多事情。值参数是将数据输入函数以完成某些简单任务的有用方法。\n\n"
