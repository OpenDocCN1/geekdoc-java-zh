    \n（此处省略重复的翻译部分）\n\n实例变量是声明在类内部但在任何方法、构造函数或块之外的变量。实例变量也是对象的变量，通常称为字段或属性。每个对象都有每个变量的副本，因此如果一个对象更改了变量的值，也不会影响实例变量。实例变量持有必须被多个方法、构造函数或块引用的值，或者对象状态在整个类中必须存在的关键部分。\n\
    \n```\nclass Student {\n    String name;\n    int age;\n}\n```\n\n这里 name 和 age\
