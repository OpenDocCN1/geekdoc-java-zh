  mdcn: "\n在上面的示例中，我们可以清楚地看到 `int j` 被设置了两次。不明显的是它为什么被声明了两次。所有的行都从相同的位置开始，看起来很拥挤。编程工具提供了许多文本布局选项，因此使用空白字符来分隔不同的代码块。\n\
