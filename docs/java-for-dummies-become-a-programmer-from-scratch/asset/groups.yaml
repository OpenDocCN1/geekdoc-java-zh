    \n合并排序可以用于排序集合。合并排序是一种分治算法。\n\n算法：\n第1步 – 将列表分成两部分。\n第2步 – 递归地排序这两部分。\n第3步 – 将较小的列表合并为有序顺序。\n\
    \n## 程序：合并排序 Java 程序\n\n```java\nclass MergeSort\n{\n    // 合并两个子数组\n    // 第一个子数组是\
    \ arr[l..m]\n    // 第二个子数组是 arr[m+1..r]\n    void merge(int arr[], int l, int\
    \ m, int r)\n    {\n        // 找到要合并的子数组的大小\n        int n1 = m - l + 1;\n   \
    \     int n2 = r - m;\n\n        /* 创建临时数组 */\n        int L[] = new int[n1];\n\
