    > "The most fundamental thing is that you actually go and code. I''ve heard it
    recommended that by the time you finish college, you should have written 100,000
    lines at minimum."


    — Andrei Thorp from Evernote.


    How do I get start, you may ask.


    > "I always tell people to find something they''re doing more than once a week
    and to try to automate it. Ignore anyone else has solved the problem before


    — Kasra Rahjerdi, Mobile Lead at Stack Overflow.


    > "Like any other skill, it takes practice – deliberate practice, stepping outside
    of your comfort zone and learning the nuance and subtleties – that set apart from
    good."


    — Derick Bailey, the creator of WatchMeCode.net.


    Derick is a top 0.42% StackOverflow user, and has also contributed to open source
    frameworks such as MarionetteJS and BackboneJS.


    It''s OK to fail. Coding is all about failing and fixing things, and about'
  - '[PAGE 330]


    learning how to do things better. If you don''t build things and work on areas
    you know you are weak on, you''ll never get better.


    If you ever need to receive advice on how to improve and what you''re not doing
    so well on, feel free to ask an experienced developer to help your get straightened
    up by either reviewing your code or walking through concepts you are having trouble
    understanding.


    # 2. BE PETEINT


    No-brainer here, but it''s easy to get frustrated by your lack of progress and
    forget that you''re not alone.


    > "Becoming a good programmer takes a long, long time and a lot of tedious evenings.
    Before you can write good code, you have to write hundreds of thousands of lines"


    > Mike Arpaia, a former Etsy dev who now builds information security software
    for Facebook.


    Mike stresses that beginners should give up on the assumption that one can become
    an excellent developer quickly.


    But... what if you''re not past the tutorial stages yet? What if you''re still
    banging your head against the wall and wondering perhaps you''re just not cut
    out for programming? Before you leap to conclusions,


    know that everyone has a different learning style. Author of the Ruby on Rails
    Tutorial, Michael Hartl, points out that beginners should try lots of different
    resources (books, videos, etc.) to see what ‘clicks''.'
- md: '

    In fact, Craig Coffman, the CTO of Reserve, has personally learned through a lot
    of trial-and-error and by picking projects that were personal and interesting.
    However, since all the interesting challenges are big ones, he suggests beginners
    to start with biting off reasonably-sized pieces.


    That way, when you lose interest or get stuck, you still have a feeling of progress
    and accomplishment.


    ## 3. STAY INTERESTED


    If you''re bored by the project you''re working on, you should probably reconsider
    any lofty goals of learning to code. Or, maybe you''re just working on the wrong
    project or learning through the wrong resource. Always keep yourself motivated
    by working on personal projects that excites you.


    Coraline Ada Ehmke, founder of LGBTTech and contributor to high-profile open source
    projects as Rails and RSpec, started coding at a young age of interest. However,
    her first class in college as a Computer Science major made her doubt passion.


    I remember our semester-long project was to write software for an ATM. I was so
    bored and not challenged, I decided that it''s what life as an engineer was like,
    I didn''t want any part of it, so I dropped out soon after.


    However, she continued to work on projects she found interesting. By 1993 she
    was online and building web sites, and has been developing web apps ever since.


    ## 4. LOVE THE ERROR


    As a beginner you''ll likely be mired in bugs. If you feel intimidated by all
    the red, you''re not alone. Ross Chapman, a UX Engineer who coded for Zendesk
    and now working at ScienceExchange, admits to being a scared developer when he
    first started out.


    I didn''t have the patience because I wasn''t ready to love the challenge of fixing
    things. But that''s pretty much where all my really bad habits come from.


    With that said, Ross urges beginners to embrace errors as crucial learning moments.
    Since you''re debugging for life, you should get used to errors and learn to recognize
    the error messages.


    > "Able to quickly parse and understand error messages will save you a lot of
    time and get you a long way. The fact you''ve tried will be very much appreciated
    by the person you''re asking for."


    > — Jack Franklin, author of “Beginning jQuery"


    Jack also recommends beginners to make an attempt at fixing problems on their
    own at first. When hitting a wall when debugging, Lee Byron, co-contributor to
    React, personally attempts to understand what''s going on by making ample usage
    of the debugger tools.


    Once I understand exactly what is happening – step by step, then I can compare
    to what I expected to happen and isolate the surprising parts and where my assumptions
    were wrong or how some code led to the surprising situation.


    Errors aren’t limited to bugs, however. Sometimes, you make bad decisions such
    as using the wrong data structure. According to Mike, getting burned those bad
    decisions will eventually help you learn when it’s reasonable to use certain design
    patterns.


    ## 5. UNDERSTAND HOW THINGS WORK


    > "No matter what level you''re at I''ll say this: never ever write a line of
    code without knowing why it works, to the metal. Like, be obsessively curious.
    Be the Indiana Jones of source. Curiosity is one constant among engineers. I don''t
    think you could make it in this biz without looking into the monitor with wonder.
    Both childlike, and ruthlessly academic"


    — Ross Chapman


    Suffice to say, interest is not enough. You have to strive to understand how things
    work if you''re aiming to become a professional developer of some decency.


    > "You can start out understanding the tools you use by sifting through StackOverflow
    questions. I''ve learned a thing or two from them. [The top AngularJS questions]
    really interesting to read through as Angular is such a big framework"


    — Todd Motto, an AngularJS conference speaker and Developer Expert at Google


    Rohan Singh, a senior infrastructure engineer at Spotify, stresses the importance
    of working towards understanding the layer one level of the stack beneath what
    you''re working on right now. "Everything we do as software engineers involves
    working at some level of abstraction,” Rohan says. In other words, if you use
    some sort of database, you can take away the internals of the database and expect
    it to “just work".


    Furthermore, to really understand how things work, you should be able to explain
    why certain technical choices are better than others, and be able to troubleshoot
    problems when things don''t work the way they do. Rohan achieves this in practice
    by trying, a little bit at a time, to learn about and understand the fundamentals
    of whatever platform or system he uses — whether that’s Python or Go or the Linux
    operating system. According to him, this eventually helps you generate a mental
    model of how things work under the covers, and broadens your base of understanding.


    Ultimately, you’ll grow as engineer, and as a bonus you’d be able to debug more
    efficiently by learning how to do more “lean back” debugging as opposed to “lean
    in” debugging. In other words, you’d lean back and think hard about how things
    work under the covers to figure out what the problem might be. “This can be a
    lot faster and involve a lot flailing than ‘lean in’ debugging with an interactive
    debugger or other tools,” Rohan says.


    In fact, Andrei Thorp from Evernote thinks everyone should learn basic C early
    on. Because it’s minimal and doesn’t do for you, it forces you to understand how
    computers really work on a lower level. For example, C makes you manage the memory
    you use yourself – which means that later, when you use something like Python,
    you actually understand what Python is doing for you. Then, when you see some
    strange bug, you have the context to understand.


    ## 6. KEEP LEARNING NEW THINGS


    Nothing will kill your career more than not learning new things, says Jonathan,
    who works at Amazon Web Services. The legend of the lone coder is a myth,” Adam
    says. “Almost substantial projects require teamwork.”


    The most important thing is to just do:

    - Try to do it poorly.

    - Figure out where I’m going.

    - Work on what I’ve identified.

    - Repeat.

    '
  mdcn: '


    事实上，Reserve 的 CTO Craig Coffman 是通过大量的尝试与错误以及选择那些个人化且有趣的项目来亲自学习的。然而，由于所有有趣的挑战都是大巨头，他建议初学者从切口大小合理的任务开始手。


    这样，当你失去兴趣或遇到瓶颈时，你仍然能获得进步感和成就感。


    ## 3. 保持兴趣


    如果你对正在从事的项目感到无聊，那么你可能应该重新考虑学习编程的任何宏伟目标了。或者，你可能只是在做错误的项目，或者正在通过错误的资源进行学习。始终通过专注于让你兴奋的个人项目来让自己保持动力。


    Coraline Ada Ehmke 是 LGBTTech 的创始人，也是 Rails 和 RSpec 等知名开源项目的贡献者，她在很小的时候就开始学习编程了。然而，她在大学作为计算机科学专业上的的第一门课就让她对热情产生了怀疑。


    “我记得我们一个学期的项目是为 ATM 机编写软件。我当时感到非常无聊且毫无挑战性，我决定工程师的生活就是这样，我不想参与其中的任何部分，所以不久后就退学了。”


    然而，她继续从事她认为有趣的项目。到 1993 年，她已经上线并开始构建网站，从那以后一直在开发 Web 应用。


    ## 4. 爱上错误


    作为初学者，你可能会深陷于 Bug 中。如果你被满红色的（错误信息）感到畏缩，你并不孤单。Ross Chapman 曾在 Zendesk 写过代码，现在工作于
    ScienceExchange，这位 UX 工程师承认自己在刚开始时是一个胆小的开发者。


    “我那时没有耐心，因为我还没准备好去热爱修复问题的挑战。但这正是我所有坏习惯的源头。”


    话虽如此，Ross 敦促初学者将错误视为至关重要的学习时刻。既然你的一生都在调试，你就应该习惯错误并学会识别错误信息。


    > “能够快速解析和理解错误信息将节省大量时间并让你走得远。你请求的人会非常感激你的尝试。”


    > — 《Beginning jQuery》作者 Jack Franklin


    Jack 还建议初学者首先尝试自己解决问题。当调试遇到瓶颈时，React 的共同贡献者 Lee Byron 会通过大量使用调试工具来亲自尝试理解发生了什么。


    “一旦我准确地理解了发生了什么——一步一步来——我就可以与我预期的结果进行比较，隔离出令人惊讶的部分，以及我的假设哪里是错误的，或者某些代码是如何导致这种意外的。”


    然而，错误不仅限于 Bug。有时，你会做出错误的决策，例如使用错误的数据结构。根据 Mike 的说法，在这些错误决策上吃亏最终会帮助你学会何时使用某些设计模式是合理的。


    ## 5. 理解工作原理


    > “无论你处于什么水平，我都会说：永远不要在不知道代码为何有效的情况下写任何代码，要深入到底层。比如，保持痴迷的好奇心。成为源代码世界的印第纳·琼。好奇心是工程师唯一的永恒。我认为，如果不带着好奇心盯着显示器，你在这个行业无法立足。既孩子化，又严谨学术化。”


    — Ross Chapman


    可以说，光有兴趣是不够的。如果你目标是成为一个像像样的专业开发者，你就必须努力理解事物是如何工作的。


    > “你可以通过筛选 StackOverflow 的问题来开始理解你使用的工具。我从那里学到了一些东西。[顶部的 AngularJS 问题]读起来真的趣，因为
    Angular 是一个如此巨大的框架”


    — Todd Motto，AngularJS 大会演讲者，Google 开发者专家


    Spotify 的高级基础设施工程师 Rohan Singh 强调了理解你目前工作堆栈下方一个层级的重要性。“我们软件工程师所做的一切都涉及到在某种抽象层面上工作，”Rohan
    说。换句话说，如果你使用某种数据库，你可以忽略数据库的内部原理，并期望它“能够正常工作”。


    此外，为了真正理解事物的工作原理，你应该能够解释为什么某些技术选择比其他更好，并在事物运行不符合预期时能够排除故障。Rohan 在实践中实现了这一点，通过尝试一点一点地学习和理解他使用的任何平台或系统的基础——无论是
    Python、Go 还是 Linux 操作系统。据他说，这最终有助于你建立一个关于底层运行机制的心模型，并拓宽你的知识基础。


    最终，你将作为工程师成长，而且而且，通过学习如何进行更多的“后倾式”调试而不是“前倾式”调试，你能够更高效地调试。换句话说，你会向后倾并深思考底层的工作原理，以找出问题可能在哪里。“这可能比使用交互式调试器或其他工具进行‘前倾式’调试要快得多，且涉及更少的尝试，”Rohan
    说。


    事实上，来自 Evernote 的 Andrei Thorp 认为每个人应该尽早学习基础 C 语言。因为它是极简的且不会替你做，它迫使你从更底层理解计算机到底是如何工作的。例如，C
    让你自己管理使用的内存——这意味着以后当你使用 Python 等工具时，你实际上理解 Python 在为你做什么。然后当你看到某些奇怪的 Bug 时，你拥有理解它的背景知识。


    ## 6. 持续学习新事物


    在 Amazon Web Services 工作的 Jonathan 表示，没有什么比不学习新事物更能扼杀你的职业生涯了。“孤单编码者的传奇是一个神话，”Adam
    说，“几乎所有实质性的项目都需要团队合作。”


    最重要的是先去做：

    - 尝试很糟糕地做。

    - 弄清楚我要去哪里。

    - 处理我确定的内容。

    - 重复。


    '
