    \ what other languages the IDE might handle well, the operating system(s) it runs\
    \ on and ever so much more.\n\nHere is the list of two most common IDE used by\
    \ Programmers.\n\n### Eclipse\n\n- **Languages:** C, C++, Python, Perl, PHP, Java,\
    \ Ruby and more\n- **Price:** FREE\n\nEclipse is the free and open-source editor\
    \ upon which many development frameworks are based. It's one of the grandaddies\
    \ in its field and comes highly recommended by many a professional developer.\
    \ Eclipse began as a Java development environment and has greatly expanded through\
    \ a system of lightweight plugins.\n\n### NetBeans\n\n- **Languages:** Java, JavaScript,\
    \ PHP, Python, Ruby, C, C++ and more\n- **Price:** FREE\n\nNetBeans is neck-and-neck\
    \ with Eclipse as the most-recommended IDE in this category. It's free and open-source,\
    \ supports tons of languages with more plugins coming all the time, and is incredibly\
    \ simple to install and use, even for a beginner.\n\n## Compilation and Execution\n\
    \nA simple Java project contains a single directory inside which all the Java\
    \ source files are stored. The Java files are usually not stored directly inside\
    \ the source directory, but in subdirectories matching their package structure.\
    \ Packages are just a way to group together source files which belong together.\n\
    \nWhen you compile all the source code in the source, the compiler produces one\
    \ .class file for each .java file. The .class contains the compiled version of\
    \ the .java file. The byte code for the .java file in other words.\n\nIt is the\
    \ .class files that the Java Virtual Machine can execute. Not the .java files\
    \ from the .class files. This is normally done by instructing the compiler to\
    \ write the .class files into a separate directory. This directory is often called\
    \ classes, but again, it is not a requirement, and it depends on what build tool\
    \ or IDE etc. you are using.\n\n## Compiling the Java Source:\n\nYou can compile\
    \ your Java source directly from your IDE (if you use an IDE). Or, you can use\
    \ the Java compiler that comes with the Java SDK. To compile your Java source\
    \ code from the command line with the Java compiler, do this:\n\n- Open a command\
    \ prompt\n- Change directory to your project's root directory (not the source\
    \ directory)\n- Make sure the project root directory contains a source directory\
    \ and a class directory\n- Type in the command below (on Windows - other OSes\
    \ will look similar though):\n\n```\n\"c:\\Program Files\\Java\\jdk1.8.0_25\\\
    bin\\javac\" src/myfirstapp/*.java -d classes\n```\n\nThis command executes the\
    \ javac command (the Java compiler) which compiles the Java sources in the directory\
    \ src/myfirstapp. The *.java means the compiler should compile all files in the\
    \ given directory.\n\nThe myfirstapp directory is a package under the root source\
    \ directory src. If you have multiple packages under the root source directory\
    \ you will have to run the Java compiler multiple times. A Java IDE handles this\
    \ for you automatically. So does build tools like Ant, Maven or Gradle.\n\n##\
    \ Running the Compiled Java Code: Once the compiler has done its job, the classes\
    \ directory will contain the compiled .class files. The package structure (directory\
    \ structure) from the source directory will be preserved under the class directory.\
    \ You can run any of these .class files which have a main() method in it. You\
    \ can run the .class from inside your Java IDE, or from the command line. From\
    \ the command line it looks like this: 'c:\\Program Files\\Java\\jdk1.8.0_25\\\
    bin\\java' -cp classes myfirstapp.MyFlaskApp -cp classes flag the Java Virtual\
    \ Machine that all your classes are located under the directory called classes.\
    \ This is also called the \"Class Path\" (hence the abbreviation cp).\n\nThe name\
    \ of the class to run is the last argument in the above command – the myfirstapp.MyFlaskApp\
    \ part.\n\nThe JVM needs to know the fully qualified class name (all packages\
    \ plus class name) to determine where the corresponding .class file is located.\n\
    \nWhen you run the class your command line will look similar to this (including\
    \ the output from the Java app):\n\n```\nD:\\data\\projects\\myfirstapp>\"c:\\\
    Program Files\\Java\\jdk1.8.0_25\\bin\\java\" \n-cp classes myfirstapp.MyFlaskApp\n\
    Hello World!\n```\nD:\\data\\projects\\myfirstapp>\n\n(Note, the first command\
    \ should not have a line break. I have put that only to make it easier.)\n\nThat\
    \ is it! Now you know how to compile and execute your apps! As mentioned earlier,\
    \ it can be easier using an IDE, but you may not have one everywhere.\n\n## CHAPTER\
    \ 3 | BASIC TERMS\n\nThis section will cover many basic terms and some of the\
    \ basic ideas behind writing code. Once we get through the first few chapters\
    \ we'll be introduced to some more which are directly related to reading and writing.\
    \ Before we get to that we'll need to cover some of the terms and concepts that\
    \ hold true for many different languages, not just Java. The methods and systems\
    \ that allow converting words into executable code require fairly strict rules.\
    \ When writing English or chatting online we tend to ignore formatting and punctuation.\
    \ The brevity allows for faster communication, though only because we as humans\
    \ have learned many new words and can use context to better interpret the contractions\
    \ and acronyms in the written form of English used online or text messages. Computers\
    \ aren't so smart as to be able to interpret our words so easily.\n\n## Tokens\n\
    \nIn written English the smallest elements of the language are letters and numbers.\
    \ Individually, most letters and numbers lack specific meaning. The next larger\
    \ element after the letter is the word. Each word has more meaning, but complex\
    \ thoughts are difficult to convey in a single word. To communicate a thought,\
    \ we use sentences. The words in a sentence each have a specific use, as seen\
    \ in the diagram below. To convey a concept we use a collection of sentences grouped\
    \ into a paragraph. And to convey emotion we use a collection of many paragraphs\
    \ organized into chapters. To tell a story we use a book, a collection of chapters.\n\
    \n![](img/81147dcafcee2d431dfe108a34b4c094_35_0.png)\n\nProgramming has similar\
    \ organizational mechanisms. The smallest meaningful element is a token, followed\
    \ by statements, code blocks, functions, followed by classes and namespaces and\
    \ eventually a program, or in our case a game. We will begin with the smallest\
    \ element and work our way up to writing our own classes. However, it's important\
    \ to know the very smallest element to understand how all the parts fit together\
    \ before we start writing any complex code.\n"
  mdcn: "\n\n## 为什么不使用真正的机器语言而不是 Java 字节码？\n\nJava 字节码比典型的高级编程语言要简单得多。对于一种新型计算机，编写一个\
