    \nLogic allows you to control what part of a function is evaluated based on changes\
    \ to variables. Using logic, you'll be able to change which statements in your\
    \ code will run. Simply put, everything you write must cover each situation you\
    \ plan to cover. Logic is controlled through a few simple systems, primarily the\
    \ if keyword and variations of.\n\n# Booleans:\n\nIn Java booleans, or bools for\
    \ short, are either true or false. It's easiest to think of these as switches\
