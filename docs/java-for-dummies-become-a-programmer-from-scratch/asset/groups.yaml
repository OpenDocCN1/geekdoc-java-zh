    \n# 第 5 章：变量、数据类型与关键字\n\n# 变量\n\n变量用于存储在程序中引用和处理的信息。它们还提供了一种通过描述性名称标记数据的方式，以便我们和阅读者能更好地理解程序。将变量理解为数据的容器是有帮助的。它们的唯一目的是标记和存储数据。这些数据随后可以在程序中使用。\n\
