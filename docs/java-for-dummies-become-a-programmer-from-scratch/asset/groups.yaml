    # 第1章 | 数据结构


    尽管计算机可以每秒执行数百万次数学计算，当问题变得巨大且复杂时，性能仍然是一个重要的考虑因素。解决问题速度的关键方面之一是数据在内存中的存储方式。为了说明这一点，考虑去图书馆查找一本书。在大多数情况下，你会使用某种电子索引，在最坏的情况下使用卡片目录来确定标题和作者。由于书籍通常按类别分架，并且每个类别按作者姓名排序，从架子上选择书籍是一个非常简单的过程。


    现在，假设你在寻找一本书，但面对的不是组织良好的书架，而是到处堆满了书籍的房间，找到那本书可能需要几个小时甚至几天。当数据没有以高效的格式存储时，这就是软件运行的状态。


    ## 简单数据结构：


    最简单的数据结构是变量。它们存储单个值，除此之外，用处有限。当需要存储许多相关值时，就会使用数组。假设读者对变量和数组有良好的理解。


    一个稍微困难一点的概念（尽管同样基础）是指针。指针并不持有实际值，而仅仅持有内存地址，该地址上包含某些有用数据。大多数丰富的 C++ 程序员对如何使用指针有深入理解，而初级程序员可能会被更现代的“托管”语言所影响，这些语言隐式地处理指针。无论如何，只需知道指针指向内存中的某处且本身并不存储数据即可。


    思考指针的一种不抽象的方法是人类大脑如何记忆（或忘记）某些事情。很多时候，优秀的工程师可能并不确定特定的公式/常量，但被问到时，他们可以准确告诉你检查哪里。


    ## 数组：


    数组是一种非常简单的数据结构，可以被视为固定长度的列表。数组之所以很好是因为它们的简单性，并且适用于数据项已知（或可以通过程序确定）的情况。假设你需要一段代码来计算几个数的平均值。


    数组是存储单个值的完美数据结构，因为它们没有特定的顺序，所需的计算除了遍历所有值之外不需要任何特殊处理。数组的另一个大优势是可以通过索引进行随机访问。例如，如果你有一个包含教室里学生名字的数组，每个座位的编号从
    1 到 n，那么 `studentName[i]` 就是读取或存储第 i 座学生名字的一种简易方法。


    数组也可以被视为一叠预装好的纸。它有固定数量的页码，每页都持有信息，并且位于从不改变的定义位置。


    ## 排序技术：


    排序是指以特定的格式排列数据。排序算法规定了以特定顺序排列数据的方法。最常见的顺序是数值顺序或字典序。


    排序的重要性在于，如果数据以排序的方式存储，数据搜索可以优化到非常高的水平。排序也用于以更可读的格式表示数据。以下是现实场景中排序的一些示例：


    - 电话簿 – 电话簿按姓名存储人们的电话号码，以便于搜索姓名。

    - 字典 – 字典按字母顺序存储单词，以便搜索任何单词都变得容易。


    ## 原地排序与非原地排序：


    排序算法可能需要一些额外的空间来比较和临时存储少数数据元素。这些算法不需要任何额外空间，排序被认为是原地发生的，例如在数组内部进行。这被称为**原地排序**。泡沫排序是原地排序的一个示例。


    然而，在某些排序算法中，程序所需的空间大于或等于正在排序的元素数量。使用相等或更多空间的排序被称为**非原地排序**。归并排序是非原地排序的一个示例。


    ## 稳定排序与不稳定排序：


    如果一个排序算法在排序后，没有改变相同元素的相对顺序（即在排序内容后），它是稳定的。


    如果一个排序算法在排序后，改变了相同元素的相对顺序，它就是不稳定的。算法的稳定性在我们希望保持相同元素顺序时非常重要。


    ## 自适应排序与非自适应排序：


    如果一个排序算法在排序时利用了数据已经排序的特性，那么它被称为自适应的。如果一个算法在排序时考虑了这一点，它就是自适应的。


    非自适应算法则不考虑数据是否已经是有序的。无论如何，只需知道指针指向内存中的某处且本身并不存储数据就足够。


    ## 排序与搜索


    ### 二分查找


    二分查找是计算机科学中的基础算法之一。为了探索它，我们首先要建立基础，以便正确实现它并避免那些错误。


    在有序序列中查找值


    在最简单的形式下，二分查找用于在有序序列中快速查找值（考虑一个序列）。搜索空间最初是整个序列。每一步，算法将搜索空间的中位值与目标值进行比较。根据比较结果并由于序列是排序的，它随后可以消除搜索空间的一半。通过重复这样做，它最终将得到由单个元素组成的搜索空间，即目标值。


    例如，考虑以下升序整数序列，并假设我们正在寻找数字 55：


    - 0 5 13 19 22 41 55 72 81 98


    我们对目标值在序列中的位置感兴趣，因此我们将搜索空间表示为序列索引。初始的搜索空间包含索引 1 到 11。由于搜索空间实际上是一个区间，只需存储两个数字，低索引和高索引。如所述，我们现在选择中位值，即索引
    1 和 11 中间点的值：这个值是 41，它小于目标值。由此我们得出不仅索引 6 的元素不是目标值，而且索引 1 到 5 的元素也不可能是目标值，因为这些索引处的所有元素都小于
    41，而 41 小于目标值。这把搜索空间缩小到了索引 7 到 11：


    - 55 68 72 81 98


    以此类推，去掉搜索空间的后半部分，剩下：


    - 55 68


    取决于我们如何选择偶数个数元素的中位值，我们将在下一步找到 55，或者删掉 68 得到一个仅包含一个元素的搜索空间。


