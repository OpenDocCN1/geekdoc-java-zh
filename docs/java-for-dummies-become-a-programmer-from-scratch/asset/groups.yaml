    - 仅对类可见（private）。\n- 对所有人可见（public）。\n- 对包和所有子类可见（protected）。\n\n# 默认访问修饰符 - 无关键字：\n\
    \n默认访问修饰符意味着我们没有为类、字段、方法等显式声明访问修饰符。\n\n在没有任何访问控制修饰符的情况下声明的变量或方法对同一个包中的任何其他类可用。接口中的字段隐含为\
