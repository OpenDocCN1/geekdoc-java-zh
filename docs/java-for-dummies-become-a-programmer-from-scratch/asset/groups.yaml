    \n## 函数作用域 (Function Scope)\n\n变量的寿命通常很短暂。某些变量只存在于几行代码中。变量可能在函数开始时产生，并在函数结束时消失。类中的变量只要类存在就会一直存在。变量的寿命取决于它创建的位置。\n\
    \n### 示例\n\n```csharp\npublic class Class {\n    int first;\n    void first()\
    \ {\n        int second;\n    }\n    void second() {\n        int first;\n   \
    \ }\n}\n```\n\n如果我们看上面的图，可以可视化看到作用域是如何划分的。外层框代表谁可以看到 `first`。在 `first()` 函数内部，我们有\
    \ `second`，它只在那里存在。`second` 也是如此；同样，`second()` 可以看到 `first` 但看不到 `second`。\n\n\
    ## 参数列表 (Parameter Lists)\n\n当函数被调用时，其标识符后接参数列表会被添加到代码中。参数就像房子前面的小插槽。每个槽位用于整数、浮点数和数组。门上的每个槽位都是一个类型后跟一个标识符。如果我们看一个基础示例，就能看到它是如何工作的。\n\
    \n```csharp\npublic class Example {\n    int a = 0;\n\n    void setA(int i) {\n\
    \        a = i;\n    }\n}\n```\n\n`setA(int i)` 接收一个 `int` 类型的参数。这是一个简单的示例；还有其他类型的参数，我们将在接下来详细介绍。值参数声明了类型，其作用域局限于函数的内容。当你运行上面的程序并给函数\
    \ `setA(3)` 传入 `3` 时，你会看到 `a = 3`。我们可以这样做很多次，而且每次都允许更改对 `a` 的赋值。当然，在类中直接使用 `a\
    \ = 3` 更容易，但那样我们就学不到任何东西了。\n\n## 副作用 (Side Effects)\n\n当函数直接设置其所属类中的变量时，程序员喜欢称其为“副作用”。副作用通常是程序员试图避免的，但并不总是切的。编写带有副作用的函数往往会防止该函数在其他类中变得有用。我们将找到允许我们避免使用副作用的方法，但在某些情况下，它是必要的。\n\
    \n```java\nclass MySideEffect {\n    int a = 0;\n    void setA() {\n        a\
    \ = 5;\n    }\n}\n```\n\n上面的 `setA()` 函数将 `a` 设置为 5。`setA()` 函数确实有一个明确的目的，但函数内部没有任何地方可以指示它所设置的变量位于何处。如果变量位于\
    \ `MySideEffect` 继承的另一个类中，那么你甚至在这个类中看不到该变量。一旦类的复杂性增加，变量在何以及何时被更改或读取就会变得模糊。如果一个函数保持自给自足，测试和修复该函数将变得简单得多。\n\
    \n阅读一个函数的功能不应该跳来跳去去寻找它正在修改哪个变量。这让我们回到了作用域的话题。限制函数的作用域或范围有助于限制可能出错的地方的数量。\n\n```java\n\
    class MySideEffect {\n    int a = 0;\n\n    void SetA () {\n        a = 5;\n \
    \   }\n\n    void SetAgain () {\n        a = 10;\n    }\n}\n```\n\n具有副作用的函数越多，就可能出现越奇怪的行为。如果\
    \ `Main()` 函数期望一个值但得到了完全不同的东西，你就会开始遇到意想不到的行为。更糟糕的是，如果从另一个类调用 `SetAgain()` 而你又期望\
    \ `a` 是 5，你将会遇到更多奇怪的行为。\n\n### 多个参数 (Multiple Arguments)\n\n函数接受的参数数量没有限制。某些语言限制你最多使用\
