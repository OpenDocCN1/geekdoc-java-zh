    \ different ways to program, and they each have a purpose. Not only that, some\
    \ languages are naturally better-suited for one paradigm or another.\n\n> “If\
    \ all you have a hammer, everything looks like a nail.”\n\nTake into self-taught\
    \ programming and you'll find yourself hammering nails, screws, staples, and thumb\
    \ tacks.\n\nI remember a self-taught .NET programmer actually telling me once,\
    \ “well, it’s not programming unless it’s object-oriented. And that’s why I don’t\
