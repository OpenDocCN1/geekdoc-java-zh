    \ arr[l..r] 的主函数\n    void sort(int arr[], int l, int r)\n    {\n        if (l\
    \ < r)\n        {\n            // 找到中间点\n            int m = (l+r)/2;\n\n    \
    \        // 排序第一、二部分\n            sort(arr, l, m);\n            sort(arr, m+1,\
    \ r);\n\n            // 合并排序后的两部分\n            merge(arr, l, m, r);\n        }\n\
