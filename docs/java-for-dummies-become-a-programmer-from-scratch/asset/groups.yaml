    Characteristics of object-oriented programming: These characteristics represent
    a pure approach to object-oriented programming: **1 Everything is an object.**
    Think of an object as a fancy variable; it stores data, but you can "make requests"
    to that object, asking it to perform operations on itself. In theory, you can
    take any conceptual component in the problem you''re trying to solve (dogs, buildings,
    services, etc.) and represent it as an object in your program.


    **2. A program is a bunch of objects telling each other what to do by sending
    messages.** To make a request of an object, you "send a message" to that object.
    More concretely, you can think of a message as a request to call a method that
    belongs to a particular object.


    **3. Each object has its own memory made up of other objects.** But another way,
    you create a new kind of object by making a package containing existing objects.
    Thus, you can build complexity into a program while hiding behind the simplicity
    of objects.


    **4. Every object has a type.** Using the parlance, each object is an instance
    of a class, in which "class" is synonymous with "type." The most important distinguishing
    characteristic of a class is “What messages can you send to it?


    **5. All objects of a particular type can receive the same messages.** This is
    actually a loaded statement, as you will see later. Because an object of type
    “circle” is also an object of type “shape,” a circle is guaranteed to accept shape
    messages. This means you can write code that talks to shapes and automatically
    handle anything that fits the description of a shape. This substitutability is
    one of the powerful concepts in OOP.


    Even more succinct description of an object is:


    An object has state, behavior and identity.


    This means that an object can have internal data (which gives it state), methods
    (to produce behavior), and each object can be uniquely distinguished from every
    other object—to put this in a concrete sense, each object has a unique address
    in memory.'
- md: "\nAn object has an interface: So, although what we really do in object-oriented\
    \ programming is create new data types, virtually all object-oriented programming\
    \ languages use the “class” keyword. When you see the word “type” think “class”\
    \ and vice versa.\n\nSince a class describes a set of objects that have identical\
    \ characteristics (data elements) and behaviors (functionality), a class is really\
    \ a data type because a floating point number, for example also has a set of characteristics\
    \ and behaviors. The difference is that a programmer defines a class to fit a\
    \ problem rather than being forced to use an existing data type that was designed\
    \ to represent a unit of storage in a machine. You extend the programming language\
    \ by adding new data types specific to your needs. The programming system welcomes\
    \ the new classes and gives them all the care and type checking that it gives\
    \ to built-in types.\n\nThe object-oriented approach is not limited to building\
    \ simulations. Whether or not you agree that any program is a simulation of the\
    \ system you're designing, and the use of OOP techniques can easily reduce a large\
    \ set of problems to a simple solution.\n\nOnce a class is established, you can\
    \ make as many objects of that class as you like, and then manipulate those objects\
    \ as if they are the elements that exist in the problem you are trying to solve.\
    \ Indeed, one of the challenges of object-oriented programming is to create a\
    \ one-to-one mapping between the elements in the problem space and objects in\
    \ the solution space.\n\nBut how do you get an object to do useful work for you?\
    \ There needs to be a way to make a request of the object so that it will do something,\
    \ such as complete a transaction, draw something on the screen, or turn on a switch.\
    \ And each object can satisfy only certain requests. The requests you can make\
    \ of an object are defined by its interface, and the type is what determines the\
    \ interface. A simple example might be a representation of a light bulb:\n\n|\
    \ Type Name | Light |\n| --- | --- |\n| Interface | on(), off(), brighten(), dim()\
    \ |\n\n```\nLight lt = new Light();\nlt.on();\n```\n\nThe interface determines\
    \ the requests that you can make for a particular object.\nHowever, there must\
    \ be some code somewhere to satisfy that request. This, along with the hidden\
    \ data, comprises the implementation. From a procedural programming standpoint,\
    \ it's not complicated.\nA type has a method associated with each possible request,\
    \ and when you make a particular request to an object, that method is called.\
    \ This process is usually summarized by saying that \"send a message\" (make a\
    \ request) to an object, and the object figures out what to do with that message\
    \ (it executes code).\n\nHere, the name of the type/class is Light, the name of\
    \ this particular Light object is lt, and the requests that you can make of a\
    \ Light object are to turn it on, turn it off, make it brighter, or make it dimmer.\
    \ You create a Light object by defining a \"reference\" (lt) for that object and\
    \ calling new to request a new object of type. To send a message to the object,\
    \ you state the name of the object and connect it to the message request with\
    \ a period (dot). From the standpoint of the user of a predefined class, that's\
    \ pretty much all there is to programming with objects.\n\nThe preceding diagram\
    \ follows the format of the Unified Modeling Language (UML). Each class is represented\
    \ by a box, with the name in the top portion of the box, any data members that\
    \ you care describe in the middle portion of the box, and the methods (the functions\
    \ that belong to this object, which receive any messages you send to that) in\
    \ the bottom portion of the box. Often, only the name of the class and the public\
    \ methods are shown in UML design diagrams, so the middle portion is not shown,\
    \ as in this case. If you're interested only in the class name, then the bottom\
    \ portion doesn't to be shown, either.\n\n# Interfaces\n\nAn interface is a reference\
    \ type in Java. It is similar to class. It is a collection of abstract methods.\
    \ A class implements an interface, thereby inheriting the abstract methods of\
    \ the interface.\n\nAlong with abstract methods, an interface may also contain\
    \ constants, default methods, static methods, and nested types. Method bodies\
    \ exist only for default methods and static methods.\n\nWriting an interface is\
    \ similar to writing a class. But a class describes the attributes and behaviors\
    \ of an object. And an interface contains behaviors that a class implements.\n\
    \nUnless the class that implements the interface is abstract, all the methods\
    \ of the interface need to be defined in the class.\n\nAn interface is similar\
    \ to a class in the following ways:\n\n- An interface can contain any number of\
    \ methods.\n- An interface is written in a file with a .java extension, with the\
    \ name of the interface matching the name of the file.\n- The byte code of an\
    \ interface appears in a .class file.\n- Interfaces appear in packages, and their\
    \ corresponding bytecode must be in a directory structure that matches the package\
    \ name.\n\nHowever, an interface is different from a class in several ways, including:\n\
    \n- You cannot instantiate an interface.\n- An interface does not contain any\
    \ constructors.\n- All of the methods in an interface are abstract.\n- An interface\
    \ cannot contain instance fields. The only fields that can appear in an interface\
    \ must be declared both static and final.\n- An interface is not extended by a\
    \ class; it is implemented by a class.\n- An interface can extend multiple interfaces.\n\
    \n# Declaring Interfaces:\n\nThe interface keyword is used to declare an interface.\
    \ Here is a simple example to declare an interface –\n\n# Example\n\nFollowing\
    \ is an example of an interface:\n\n```\n/* File name : NameOfInterface.java */\n\
    import java.lang.*; // Any number of import statements\npublic interface NameOfInterface\
    \ {\n    // Any number of final, static fields // Any number of abstract method\
    \ declarations\n}\n```\n\nInterfaces have the following properties:\n\n- An interface\
    \ is implicitly abstract. You do not need to use the abstract keyword while declaring\
    \ an interface.\n- Each method in an interface is also implicitly abstract, so\
    \ the abstract keyword is not needed.\n- Methods in an interface are implicitly\
    \ public.\n\nExample:\n\n```\n/* File name : Animal.java */\ninterface Animal\
    \ {\n    public void eat(); public void travel(); }\n```\n\n# Implementing Interfaces:\n\
    \nWhen a class implements an interface, you can think of the class as signing\
    \ a contract, agreeing to perform the specific behaviors of the interface. If\
    \ a class does not perform all the behaviors of the interface, the class must\
    \ declare itself as abstract.\n\nA class uses the implements keyword to implement\
    \ an interface. The implements interface keyword appears in the class declaration\
    \ following the extends portion of the declaration.\n\n# Example:\n\n```\n/* File\
    \ name : MammalInt.java */\npublic class MammalInt implements Animal {\n    public\
    \ void eat() {\n        System.out.println(\"Mammal eats\");\n    }\n\n    public\
    \ void travel() {\n        System.out.println(\"Mammal travels\");\n    }\n\n\
    \    public int noOfLegs() {\n        return 0;\n    }\n\n    public static void\
    \ main(String args[]) {\n        MammalInt m = new MammalInt(); m.eat(); m.travel();\n\
    \    }\n}\n```\n\nThis will produce the following result:\n\n# Output:\n\n| Mammal\
    \ eats |\n| Mammal travels |\n\nWhen overriding methods defined in interfaces,\
    \ there are several rules to be followed:\n\n- Checked exceptions should not be\
    \ declared on implementation methods other than the ones declared by the interface\
    \ method or subclasses of those declared by the interface method.\n- The signature\
    \ of the interface method and the same return type or subtype should be maintained\
    \ when overriding the methods.\n- An implementation class itself can be abstract\
    \ and if so, interface methods need not be implemented.\n\nWhen implementing interfaces,\
    \ there are several rules:\n\n- A class can implement more than one interface\
    \ at a time.\n- A class can extend only one class, but implement many interfaces.\n\
    - An interface can extend another interface, in a similar way as as a class can\
    \ extend another class.\n"
  mdcn: "\n\n对象具有接口：因此，尽管我们在面向对象编程中实际执行的是创建新的数据类型，但几乎所有的面向对象编程语言都使用“class”（类）关键字。当你看到“type”（类型）这个词时，可以想成“class”，反之亦然。\n\
    \n由于类描述了一组具有相同特征（数据元素）和行为（功能性）的对象，因此类实际上是一个数据类型，因为例如，一个浮点数也拥有一系列特征和行为。区别在于，程序员定义一个类是为了适应某个问题，而不是被迫使用一个为表示机器中存储单元而设计的现有数据类型。你通过添加特定于你需求的新数据类型来扩展编程语言。编程系统欢迎新类，并赋予它们与对待内置类型相同的关照和类型检查。\n\
    \n面向对象的方法不仅限于构建仿真系统。无论你是否同意任何程序都是你正在设计的系统的模拟，使用 OOP 技术都可以轻松地将一组复杂的问题简化为单一的解决方案。\n\
    \n一旦建立了一个类，你就可以随心所欲创建许多该类的对象，然后操纵这些对象，就像它们是你正试图解决的问题中存在的元素一样。事实上，面向对象编程的挑战之一就是在问题空间中的元素与解决方案空间中的对象之间建立一对一的映射。\n\
    \n但如何让对象为你完成有用的工作呢？需要一种方式向对象发出请求，以便它执行某些操作，例如完成交易、在屏幕上画图或打开开关。每个对象只能满足某些特定的请求。你对对象提出的请求由其接口定义，而类型则决定了接口。一个简单的例子可能是灯泡的表示：\n\
    \n| 类型名称 | Light |\n| --- | --- |\n| 接口 | on(), off(), brighten(), dim() |\n\n\
    ```\nLight lt = new Light();\nlt.on();\n```\n\n接口决定了你可以对特定对象提出的请求。\n然而，在某处必须有一些代码来满足该请求。这与隐藏的数据共同成了实现。从过程化编程的角度来看，这并不复杂。\n\
    一个类型与每个可能的请求关联有一个方法，当你向对象发出特定请求时，就会调用该方法。这个过程通常总结为向对象“发送消息”（发出请求），然后由对象确定如何处理该消息（即它执行代码）。\n\
    \n在这里，类型/类的名称是 Light，这个特定 Light 对象的名称是 lt，你对 Light 对象可以提出的请求是开启它、关闭它、让它变亮或让它变暗。你通过为该对象定义“引用”（lt）并调用\
    \ `new` 请求一个类型的新对象来创建一个 Light 对象。要向对象发送消息，只需写出对象的名称并用点号将其与消息请求连接。从预定义类用户的角度来看，这就是对象编程的全部内容了。\n\
    \n前面的图遵循统一建模语言（UML）的格式。每个类由一个框表示，名称位于框的顶部，你关心的任何数据成员位于框中间，方法（属于该对象的函数，接收你发送给它的任何消息）位于框的底部。通常，UML\
    \ 设计图中只显示类名和公共方法，因此在本例中，中间部分不显示。如果你只对类名感兴趣，那么底部也不需要显示。\n\n# Interfaces 接口\n\n\
    接口是 Java 中的一种引用类型。它与类相似。它是抽象方法的集合。类实现接口，从而继承接口的抽象方法。\n\n除了抽象方法外，接口还可以包含常量、默认方法、静态方法和嵌套类型。方法体仅存在于默认方法和静态方法。\n\
    \n编写接口与编写类相似。但类描述了对象的属性和行为，而接口包含了类实现的行为。\n\n除非实现接口的类是抽象类，否则接口的所有方法都需要在类中定义。\n\n\
    接口在以下方面与类相似：\n\n- 接口可以包含任意数量的方法。\n- 接口写在扩展名为 `.java` 的文件中，接口名称与文件名匹配。\n- 接口的字节码出现在\
    \ `.class` 文件中。\n- 接口出现在包中，其对应的字节码必须存在于与包名匹配的目录结构中。\n\n然而，接口在几个方面与类不同，包括：\n\n\
    - 你不能实例化接口。\n- 接口不包含任何构造函数。\n- 接口中的所有方法都是抽象的。\n- 接口不能包含实例字段。接口中出现的字段必须同时声明为 `static`\
    \ 和 `final`。\n- 接口不被类扩展，而是由类实现。\n- 接口可以扩展多个接口。\n\n# Declaring Interfaces 声明接口：\n\
    \n`interface` 关键字用于声明接口。这是一个声明接口的简单示例——\n\n# Example 示例\n\n以下是一个接口的示例：\n\n```\n\
    /* File name : NameOfInterface.java */\nimport java.lang.*; // 任意数量的 import 语句\n\
    public interface NameOfInterface {\n    // 任意数量的 final, static 字段 // 任意数量的抽象方法声明\n\
    }\n```\n\n接口具有以下属性：\n\n- 接口隐式是抽象的。声明接口时不需要使用 `abstract` 关键字。\n- 接口中的每个方法也隐式是抽象的，因此不需要\
    \ `abstract` 关键字。\n- 接口方法隐式为 `public`。\n\n示例：\n\n```\n/* File name : Animal.java\
    \ */\ninterface Animal {\n    public void eat(); public void travel(); }\n```\n\
    \n# Implementing Interfaces 实现接口：\n\n当类实现接口时，你可以将该类视为签署了合同，同意执行接口的行为。如果类没有执行接口的所有行为，则该类必须声明为抽象类。\n\
    \n类使用 `implements` 关键字来实现接口。`implements` 关键字出现在类声明中 `extends` 部分之后。\n\n# Example\
    \ 示例：\n\n```\n/* File name : MammalInt.java */\npublic class MammalInt implements\
    \ Animal {\n    public void eat() {\n        System.out.println(\"Mammal eats\"\
    );\n    }\n\n    public void travel() {\n        System.out.println(\"Mammal travels\"\
    );\n    }\n\n    public int noOfLegs() {\n        return 0;\n    }\n\n    public\
    \ static void main(String args[]) {\n        MammalInt m = new MammalInt(); m.eat();\
    \ m.travel();\n    }\n}\n```\n\n这将产生以下结果：\n\n# Output 输出：\n\n| Mammal eats |\n\
    | Mammal travels |\n\n在重写接口定义的方法时，必须遵循以下规则：\n\n- 实现方法中声明的检查异常不能是接口方法所声明的异常或其子类之外的任何异常。\n\
    - 重写方法时，应保持接口方法的签名和相同的返回类型或子类型。\n- 实现类本身可以是抽象的，如果是这样，不需要实现接口方法。\n\n实现接口时，有以下规则：\n\
    \n- 一个类可以同时实现多个接口。\n- 一个类只能扩展一个类，但可以实现多个接口。\n- 接口可以扩展另一个接口，类似于类扩展另一个类的方式。\n\n"
