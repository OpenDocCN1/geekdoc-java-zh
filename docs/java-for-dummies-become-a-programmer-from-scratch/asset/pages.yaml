  md: '# How to figure out Big O in an interview?


    This is not an exhaustive list of Big O. Much as you can O O(n²), you can also
    have O(n³) (imagine throwing an extra loop into your bubble sort for no apparent
    reason). What the list on this page should allow you to do is have a stab in the
    dark at figuring out what the big O of an algorithm is. If someone is asking you
    this during an interview they probably want to see how you try and figure it out.
    Break down the loops and processing.


    +   - Does it have to go through the entire list? There will be an n in somewhere.

    - Does the algorithms processing time increase at a slower rate than the size
    of the data set? Then there''s probably a log n in there.

    - Are there nested loops? You''re probably looking at n² or n³.

    - Is access time constant irrelevant of the size of the dataset?? O(1)'
