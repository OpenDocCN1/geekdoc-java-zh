  md: '# **Complexity:**


    Since each comparison binary search uses halves the search space, we can assert
    and easily prove that binary search will never use more than (in big-oh notation)
    $O(\log N)$ comparisons to find the target value.


    The logarithm is an awfully slowly growing function. In case you''re not aware
    of just how efficient binary search is, consider looking up a name in a phone
    book containing a million names. Binary search lets you systematically find any
    given name using at most 21 comparisons. If you could manage a list containing
    all the people in the world sorted by name, you could find any person in less
    than 35 steps.'
