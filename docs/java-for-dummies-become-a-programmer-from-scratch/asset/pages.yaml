  md: 'Characteristics of object-oriented programming: These characteristics represent
    a pure approach to object-oriented programming: **1 Everything is an object.**
    Think of an object as a fancy variable; it stores data, but you can "make requests"
    to that object, asking it to perform operations on itself. In theory, you can
    take any conceptual component in the problem you''re trying to solve (dogs, buildings,
    services, etc.) and represent it as an object in your program.


    **2. A program is a bunch of objects telling each other what to do by sending
    messages.** To make a request of an object, you "send a message" to that object.
    More concretely, you can think of a message as a request to call a method that
    belongs to a particular object.


    **3. Each object has its own memory made up of other objects.** But another way,
    you create a new kind of object by making a package containing existing objects.
    Thus, you can build complexity into a program while hiding behind the simplicity
    of objects.


    **4. Every object has a type.** Using the parlance, each object is an instance
    of a class, in which "class" is synonymous with "type." The most important distinguishing
    characteristic of a class is “What messages can you send to it?


    **5. All objects of a particular type can receive the same messages.** This is
    actually a loaded statement, as you will see later. Because an object of type
    “circle” is also an object of type “shape,” a circle is guaranteed to accept shape
    messages. This means you can write code that talks to shapes and automatically
    handle anything that fits the description of a shape. This substitutability is
    one of the powerful concepts in OOP.


    Even more succinct description of an object is:


    An object has state, behavior and identity.


    This means that an object can have internal data (which gives it state), methods
    (to produce behavior), and each object can be uniquely distinguished from every
    other object—to put this in a concrete sense, each object has a unique address
    in memory.'
