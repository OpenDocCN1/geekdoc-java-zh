  md: "# Public Access Modifier – Public:\n\nA class, method, constructor, interface,\
    \ etc. declared public can be accessed from any other class. Therefore, fields,\
    \ methods, blocks declared inside a public class can be accessed from any class\
    \ belonging to the Java Universe.\n\nHowever, if the public class we are trying\
    \ to access is in a different package, then the public class still needs to be\
    \ imported. Because of class inheritance, all public methods and variables of\
    \ a class are inherited by its subclasses.\n\nExample:\n\nThe following function\
    \ uses public access control –\n\n```\npublic static void main(String[] arguments)\
    \ {\n  // ...\n}\n```\n\nThe main() method of an application has to be public.\
    \ Otherwise, it could not be called by a Java interpreter (such as java) to run\
    \ the class."
