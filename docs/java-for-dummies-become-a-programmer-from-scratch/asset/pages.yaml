  md: '# Simple Data Structure:


    The simplest data structures are primitive variables. They hold a single value,
    and beyond that, are of limited use. When many related values need to be stored,
    an array is used. It is assumed that the reader of this article has a solid understanding
    of variables and arrays.


    A somewhat more difficult concept, though equally primitive, are pointers. Pointers,
    instead of holding an actual value, simply hold a memory address that, in theory,
    contains some useful piece of data. Most seasoned C++ coders have a solid understanding
    of how to use pointers, and many of the caveats, while fledgling programmers may
    find themselves a bit spoiled by more modern "managed" languages, which, for better
    or worse, handle pointers implicitly.


    Either way, it should suffice to know that pointers "point" somewhere in memory,
    and do not actually store data themselves.


    A less abstract way to think about pointers is in how the human mind remembers
    (or cannot remember) certain things. Many times, a good engineer may not necessarily
    know a particular formula/constant/equation, but when asked, they could tell you
    exactly which reference to check.'
