  md: "# Function Scope:\n\nVariables often live an ephemeral life. Some variables\
    \ exist only over a few lines of code. Variables may come into existence only\
    \ for the moment a function starts and then disappear when the function is done.\
    \ Variables in the class scope exist for as long as the class exists. The life\
    \ of the variable depends on where it's created.\n\n# Example:\n\n```\npublic\
    \ class Classscopm{\nint ClassInt;\nvoid first()\n{\n    int firsttint;\n}\nvoid\
    \ second()\n{\n    int secondint;\n}\n}\n```\n\nIf we look at the above figure\
    \ we can visualize how scope is divided. The outer box represents who can see\
    \ ClassInt. Within the first () function we have a firsttint that only exists\
    \ within the first () function.\n\nThe same is repeated for the secondint, found\
    \ only in the second () function. This means that first () can use both ClassInt\
    \ and firsttint but not secondint. Likewise, second () can see ClassInt and secondint\
    \ but not firsttint."
