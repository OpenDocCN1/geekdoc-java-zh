    The java.net package provides support for the two common network protocols –


    +   1. **TCP** stands for Transmission Control Protocol, for reliable communication
    between two applications. TCP is typically used over the Internet Protocol, which
    is referred to as TCP/IP.


    +   2. **UDP** stands for User Datagram Protocol, a connection-less protocol that
    allows for packets of data to be transmitted between applications.


