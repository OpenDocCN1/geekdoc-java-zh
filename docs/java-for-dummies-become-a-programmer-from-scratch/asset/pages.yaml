  md: '**Inheritance:** By itself, the idea of an object is a convenient tool. It
    allows you to package data and functionality together by concept, so you can represent
    an appropriate problem-space idea rather than being forced to use the idioms of
    the underlying machine. These concepts are expressed as fundamental units in the
    programming language by using the class keyword.


    It seems a pity, however, to go all the trouble to create a class and then be
    forced to create a new one that might have similar functionality. It''s nicer
    if we can take the existing class, clone it, and then make additions and modifications
    to the clone. This is effectively what you get with inheritance, with the exception
    that if the original class (called the base class or superclass or parent class)
    is changed, the modified “clone” (called the derived class or inherited class
    or subclass or child class) also reflects these changes.


    ![](img/81147dcafcee2d431dfe108a34b4c094_200_0.png)


    (The Arrow in this UML diagram points from the derived class to the base class.
    As you will see, there is commonly more than one derived class.) A type does more
    than describe the constraints on a set of objects; it also has a relationship
    with other types. Two types can have characteristics and behaviors in common,
    but one type may contain more characteristics than another and may also handle
    more messages (or handle them differently). Inheritance expresses this similarity
    between types by using the concept of base types and derived types. A base type
    contains all of the characteristics and behaviors that are shared among the types
    derived from it. You create a base type to represent the core of your ideas about
    some objects in your system. From the base type, you derive other types to express
    the different ways that this core can be realized.'
  merge: -1
  pgno: 200
- img_proc: true
  md: 'For example, a trash-recycling machine sorts pieces of trash. The base type
    is “trash”, and each piece of trash has a weight, a value, and so on, and can
    be shredded, melted, or decomposed. From this, more specific types of trash are
    derived that may have additional characteristics (a bottle has a color) or behaviors
    (an aluminum can may be crushed, a steel can be magnetic). In addition, some behaviors
    may be different (the value of paper depends on its type and condition). Using
    inheritance, you can build a type hierarchy that expresses the problem you’re
    trying to solve in terms of its types.


    A second example is the classic “shape” example, perhaps used in a computer-aided
    design system or game simulation. The base type is “shape,” and each shape has
    a size, a color, a position, and so on. Each shape can be drawn, erased, moved,
    colored, etc. From this, specific types of shapes are derived (inherited)—circle,
    square, triangle, and so on—each of which may have additional characteristics
    and behaviors. Certain shapes may be flipped, for example. Some behaviors may
    be different, such as when you want to calculate the area of a shape. The type
    hierarchy embodies both the similarities and differences between the shapes.


    | Shape |

    | --- |

    | draw() |

    | erase() |

    | move() |

    | getColor() |

    | setColor() |

    | Circle | Square | Triangle |


    Casting the solution in the same terms as the problem is very useful because you
    don’t need a lot of intermediate models to get from a description of the problem
    to a description of the solution. With objects, the type hierarchy is the primary
    model, so you go directly from the description of the system in the real world
    to the description of the system in code. Indeed, one of the difficulties people
    have'
  merge: -1
