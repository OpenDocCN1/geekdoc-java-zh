  md: 'Interchangeable objects with polymorphism: When dealing with type hierarchies,
    you often want to treat an object not the specific type that it is, but instead
    as its base type. This allows you to write code that doesn''t depend on specific
    types. In the shape example, methods manipulate generic shapes, unconcerned about
    whether they''re circles, squares, triangles, or some shape that hasn''t even
    been defined yet. All shapes can be drawn, erased, and moved, so these methods
    simply send a message to a shape object; they don''t worry about how the object
    copies with the message.


    Such code is unaffected by the addition of new types, and adding new types is
    the most common way to extend an object-oriented program to handle new situations.
    For example, you can derive a subtype of shape called pentagon without modifying
    the methods that deal only with generic shapes. This ability to easily extend
    a design by deriving new subtypes is one of the essential ways to encapsulate
    change. This greatly improves designs while reducing the cost of software maintenance.


    There''s a problem, however, with attempting to derive-type objects as their generic
    base types (circles as shapes, bicycles as vehicles, cormor as birds, etc.). If
    a method is going to tell a generic shape to draw itself, or a generic vehicle
    to steer, or the compiler cannot know at compile time precisely what piece of
    code will be executed. That''s the whole point—when the message is sent, the programmer
    doesn''t know what piece of code will be executed; the draw method can be applied
    equally to a circle, a square, or a triangle, and the object will execute the
    proper code depending on its specific type.


    If you don''t have to know what piece of code will be executed, then when you
