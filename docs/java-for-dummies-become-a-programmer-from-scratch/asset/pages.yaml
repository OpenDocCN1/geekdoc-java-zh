- img_proc: true
  md: 'brains.


    To be useful, the child zombie can also add new objects and change the objects
    it inherited from its parent class. As a result, now the child zombie might have
    tentacles that the parent didn''t have. Objects talk to each other through events
    and messages.


    Shooting at zombies can create an event, or in programmer terms, it “raises” an
    event. The bullet impact event tells the zombie class to then take necessary steps
    when hit by a bullet.


    Events command the class to take actions on its data, which is where functions
    come in.


    Functions, also known as methods, are sections of logic that act on data. They
    allow your class to create additional events and talk to yet more objects.


    As the player presses the trigger and moves the joystick around, yet more events
    can be raised and messages can be sent. Events and messages allow the player to
    interact with your world; logic events and objects together build your game.'
