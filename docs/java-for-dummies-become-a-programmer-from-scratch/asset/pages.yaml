  md: '# Loop Control Statements:


    Loop control statements change execution from its normal sequence. When execution
    leaves a scope, all automatic objects that were created in that scope are destroyed.


    Java supports the following control statements.


    +   - Break Statement

    - Continue Statement


    The break statement in Java programming language has the following two usages
    –


    +   - When the break statement is encountered inside a loop, the loop is immediately
    terminated and the program control resumes at the next statement following the
    loop.


    +   - It can be used to terminate a case in the switch statement (covered in the
    next chapter).'
