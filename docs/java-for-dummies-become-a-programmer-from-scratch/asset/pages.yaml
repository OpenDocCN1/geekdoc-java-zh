  md: "# Private Access Modifier – Private:\n\nMethods, variables, and constructors\
    \ that are declared private can only be accessed within the declared class itself.\n\
    \nPrivate access modifier is the most restrictive access level. Class and interfaces\
    \ cannot be private.\n\nVariables that are declared private can be accessed outside\
    \ the class, if public getter methods are present in the class.\n\nUsing the private\
    \ modifier is the main way that an object encapsulates itself and hides data from\
    \ the outside world.\n\nExample:\n\nThe following class uses private access control\
    \ :\n\n```\npublic class Logger {\n    private String format; public String getFormat()\
    \ {\n        return this.format;\n    }\n    public void setFormat(String format)\
    \ {\n        this.format = format;\n    }\n}\n```\n\nHere, the format variable\
    \ of the Logger class is private, so there's no way for other classes to retrieve\
    \ or set its value directly.\n\nSo, to make this variable available to the outside\
    \ world, we defined two public methods: getFormat(), which returns the value of\
    \ format, and setFormat(String), which sets its value."
  merge: -1
