  md: '# Examples:


    Hopefully you''re with me so far, but let''s dive into some example algorithms
    for sorting and searching. The important thing is to be able to explain what complexity
    an algorithm is. Interviewers love to get candidates to design algorithms and
    then ask what the complexity of it is.


    # 1. O(1)


    Irrelevant of the size, it will always return at constant speed. The javadoc for
    Queue states that it is “constant time for the retrieval methods (peek, element,
    and size)". It''s pretty clear why this is the case. For peek, we are always returning
    the first element we always have a reference to; it doesn''t matter how many elements
    follow it. The size of the list is updated upon element addition/removal, and
    referencing this number is just one operation to access no matter the size of
    the list is.


    # 2. O(log n)


    The classic example is a Binary search. You''re a massive geek so you''ve obviously
    alphabetised your movie collection. To find your copy of “Back To The Future”,
    you first go to the middle of the list. You discover the middle film is “Meet
    The Fockers”, so you then head to the movie in between the start and this film.
    You discover this is “Children of Men”. You repeat this again and you''ve found
    back to the future.


    Although adding more elements will increase the amount of time it takes to search,
    it doesn''t do proportionally. Therefore it is O(log n).


    # 3. O(n)


    As discussed in my post on collections, LinkedLists are not so good (relatively
    speaking) when it comes to retrieval. It actually has a Big O of O(n) as in the
    worst case, to find an element T is the last element in the list, it is necessary
    to navigate the entire list of n elements to find T. The number of elements increases
    so the access time in proportion.


    # 4. O(n log n)


    The best example of O(n log n) is a merge sort. This is a divide and conquer'
