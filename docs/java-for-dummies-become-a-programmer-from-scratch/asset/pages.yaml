- img_proc: true
  md: 'Object-Oriented Programming is not The Way. Neither is Functional Programming.
    Nor Reactive Programming. It is A Way.


    There are different ways to program, and they each have a purpose. Not only that,
    some languages are naturally better-suited for one paradigm or another.


    > “If all you have a hammer, everything looks like a nail.”


    Take into self-taught programming and you''ll find yourself hammering nails, screws,
    staples, and thumb tacks.


    I remember a self-taught .NET programmer actually telling me once, “well, it’s
    not programming unless it’s object-oriented. And that’s why I don’t consider JavaScript
    a programming language.” That’s a very, very flawed train of thought.


    # 4. DATA STRUCTURES


    Granted, your language can give you a basic idea of what the different data structures
    are. But again, that’s a basic idea.


    Self -taught programmers can have a tendency to only stick to data structures
    that work within their Favorite language. Just because it’s not a primitive, or
    even a common structure in your language, that doesn’t mean it can’t exist. Of
    course, that also means that maybe it shouldn’t exist, either.


    > *The world is very small if it all can fit inside of an array.*'
