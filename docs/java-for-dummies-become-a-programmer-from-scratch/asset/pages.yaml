  md: "# What is a Compiler?\n\nGenerally compiling is a term which is often heard\
    \ by everyone who is associated with programming, even remotely. A compiler is\
    \ a software program that transforms high-level source code that is written by\
    \ a developer in a high-level programming language into a low level object code\
    \ (binary code) in machine language, which can be understood by the processor.\
    \ The process of converting high-level programming into machine language is known\
    \ as compilation.\n\nThe processor executes object code, which indicates when\
    \ binary high and low signals are required in the arithmetic logic unit of the\
    \ processor.\n\nLet us take an example to understand what does the above definition\
    \ means.\n\nIf you ask any person who is associated with programming, what the\
    \ first program he/she wrote was, then the obvious answer would be “Hello World”.\
    \ So let us also start with the same.\n\n```\n#include<stdio.h>\nVoid main()\n\
    {\n    printf(\"Hello, world!\");\n}\n```\n\nThis most basic program prints or\
    \ displays the words \"Hello,World!\" on the computer screen. But there is a problem.\
    \ It is not simple. Behind the curtains there is lot of complex things going.\
    \ Let us peep inside things. The hard truth is that our computer cannot understand\
    \ the commands/instructions contained in a source file (helloworld.c), because\
    \ C is a high-level language which means, it contains various characters, symbols,\
    \ and words that represent complex, numbers-based instructions for eg. printf,\
    \ main, header files etc. The only instructions a computer can execute are those\
    \ written in machine language, consisting entirely of numbers that is the binary\
    \ language in terms of 0 and 1. Before our computer can run our C program, the\
    \ compiler should convert our helloworld.c into an object file; then a program\
    \ called a linker should convert the"
  merge: -1
  pgno: 22
- img_proc: true
  md: 'object file into an executable file.


    The drawing below illustrates the process.


    ![](img/81147dcafcee2d431dfe108a34b4c094_23_0.png)


    A compiler that converts machine language into high-level natural language is
    called a decompiler. Compilers that produce the object code meant to run on a
    system are called cross-compilers. Finally, a compiler that converts one programming
    language into another is called a language translator.


    A compiler executes four major steps:


    **Scanning:** The scanner reads one character at a time the time from the source
    code and keeps track of which character is present in which line.


    **Lexical Analysis:** The compiler converts the sequence of characters that appear
    in the source code into a series of strings of characters (known as tokens), which
    are associated by a specific rule by a program called a lexical analyzer. A symbol
    table is used by the lexical analyzer to store the words in the source code that
    correspond to the token generated.


    **Syntactic Analysis:** In this step, syntax analysis is performed, which involves
    preprocessing to determine whether the tokens created during lexical analysis
    are in proper order as per their usage. The correct order of a set of keywords,
    which can yield a desired result, is called syntax. The compiler has to check
    the source code to ensure syntactic accuracy.


    **Semantic Analysis:** This step is comprised of several intermediate steps. First,
    the structure of tokens is checked, along with their order with respect to the
    grammar in a given language. The meaning of the token structure is interpreted
    by the parser and analyzer to finally generate an intermediate code, called object'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'code. The object code includes instructions that represent the processor action
    for a corresponding token when encountered in the program. Finally, the entire
    code is parsed and interpreted to check if any optimizations are possible. Once
    optimizations can be performed, the appropriate modified tokens are inserted in
    the object code to generate the final object code, which is saved inside a file.


    So A compiler is a program that reads in as input a program (in some high-level
    programming language) and outputs machine language code (for some machine architecture).
    The machine language code can subsequently be executed any number of times using
    different input data each time. As a second example, the Java compiler javac transforms
    a .java source file into a .class file that is written in Java bytecode, which
    is the machine language for an imaginary machine known as the Java Virtual Machine.'
  merge: -1
  pgno: 24
