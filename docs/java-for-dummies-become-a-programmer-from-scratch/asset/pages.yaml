  md: '# Big O Notation Big O notation is the language we use for articulating how
    long an algorithm takes to run. It''s how we compare the efficiency of different
    approaches to a problem.


    Imagine you have a list of 10 objects, and you want to sort them in order. There’s
    a whole bunch of algorithms you can use to make that happen, but not all are built
    equal. Some are quicker than others but more importantly the speed of an algorithm
    can vary depending on how many items it’s dealing with. Big O is a way of measuring
    how an algorithm scales. Big O references how complex an algorithm is.


    Big O is represented using something like O(n). The O simply denoted we’re talking
    about Big O and you can ignore it (at least for the purpose of the interview).
    n is the complexity in relation to; for programming interview questions this is
    almost always the size of a collection. The complexity will increase or decrease
    in accordance with the size of the data store.


    Below is a list of the Big complexities in order of how well they scale relative
    to the dataset.


    **O(1)/Constant Complexity:** Constant. This means irrelevant of the size of the
    data set the algorithm will always take a constant time. 1 item takes 1 second,
    10 items takes 1 second, 100 items takes 1 second. It always takes the same amount
    of time.


    **O(log n)/Logarithmic Complexity:** Not good as constant, but still pretty good.
    The time increases with the size of the data set, but proportionately so. This
    means the algorithm takes longer per item on smaller datasets relative to larger
    ones. 1 item takes 1 second, 10 items takes 2 seconds, 100 items takes 3 seconds.
    If your dataset has 10 items, each item causes 0.2 seconds latency. It only takes
    0.03 seconds extra per item. Makes log n algorithms very scalable.


    **O(n)/Linear Complexity:** The larger the data set, the time taken proportionally.
    1 item takes 1 second, 10 items takes 10 seconds, 100 items takes 100 seconds.


    **O(n log n):** A nice combination of the previous two. Normally there’s 2 parts
    to'
