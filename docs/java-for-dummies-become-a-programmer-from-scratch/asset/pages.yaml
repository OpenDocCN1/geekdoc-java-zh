  md: "Side Effects: When a function directly sets a variable in the class other function\
    \ lives in, programmers like to call this a side effect. Side effects are usually\
    \ things that programmers try to avoid, but it's not always practical. Writing\
    \ functions with side effects tend to prevent the function from being useful in\
    \ other classes. We'll find other systems that allow us to avoid using side effects,\
    \ but in some cases, it's necessary.\n\n```\nClass MySideEffect {\n    int a =\
    \ 0;\n    void setA() {\n        a = 5;\n    }\n}\n```\n\nThe above setA() function\
    \ sets int a to 5. The SetA() function does have a clear purpose, setting A, but\
    \ there's nothing in the function that indicates where the variable it's setting\
    \ lives. If the variable lived in another class which MySideEffect inherited from,\
    \ then you wouldn't even see the variable in this class. Once the complexity in\
    \ a class grows, where and when a variable gets changed or read becomes more obscure.\
    \ If a function remains self-contained, testing and fixing that function becomes\
    \ far easier."
