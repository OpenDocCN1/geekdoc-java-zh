  md: '# Basic exceptions:


    An exceptional condition is a problem that prevents the continuation of the current
    method or scope. It’s important to distinguish an exceptional condition from a
    normal problem, in which you have enough information in the current context to
    somehow cope with the difficulty. With an exceptional condition, you cannot continue
    processing because you don’t have the information necessary to deal with the problem
    in the current context. All you can do jump out of the current context and relegate
    to a higher context. This is what happens when you throw an exception.


    Division is a simple example. If you’re to divide by zero, it’s worth checking
    for that condition. But what does it mean that the denominator is zero? Maybe
    you know, in the context of the problem you’re trying to solve in that particular
    method, how to deal with a zero denominator. But if it’s an unexpected value,
    you can’t deal with it and must throw an exception rather than continuing along
    execution path.


    When you throw an exception, several things happen. First, the exception object
    is created in the same way that any Java object is created: on the heap, with
    new. Then the current path of execution (the one you couldn’t continue) is stopped
    and the reference for the exception object is ejected from the current context.
    At this point the exception-handling mechanism takes over and begins to look for
    an appropriate place to continue executing the program. This appropriate place
    is the exception handler, whose job is to recover from the problem so the program
    can either another tack or just continue.


    As a simple example of throwing an exception, consider an object reference called
    t. It’s possible that you might be passed a reference that hasn’t been initialized,
    so you might want to check before calling a method using object reference. You
    can send information about the error into a larger context by creating an object
    representing your information and “throwing” it out of your current context. This
    is called throwing an exception. Here’s what it looks like: if(t== null)


    ```

    throw new NullPointerException();

    ```'
