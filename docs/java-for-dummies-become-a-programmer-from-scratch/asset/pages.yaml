  md: '# 4 REASONS WHY YOUR PROGRAM CRASHES!


    There may be 4 reasons why your program may crash:


    +   - Your program may depend on some element of randomness: user input, randomly
    generated number, time, etc.

    - If Your program is using an uninitialized variable, it could be accessing data
    it isn''t supposed to (same with accessing something outside of an arrays indices)

    - Your program may be using an external library that crashes all the time.

    - Stack overflows!'
