  md: 'Even though computers can literally perform millions of mathematical computations
    per second, when a problem gets large and complicated, performance can nonetheless
    be an important consideration. One of the most crucial aspects to how quickly
    a problem can be solved is how the data is stored in memory.


    To illustrate this point, consider going to the local library to find a book about
    a specific subject matter. Most likely, you will be able to use some kind of electronic
    reference or, or in the worst case, a card catalog, to determine the title and
    author of the book you want. Since the books are typically shelved by category,
    and within each category sorted by author''s name, it is a fairly straightforward
    and painless process to then physically select your book from the shelves.


    Now, suppose instead you came to the library in search of a particular book, but
    instead of organized shelves, were greeted with large garbage bags lining both
    sides of the room, each arbitrarily filled with books that may or may not have
    anything to do with one another. It would take hours, or even days, to find the
    book you needed, a comparative eternity. This is how software runs when data is
    not stored in an efficient format appropriate to the application.'
