  md: 'domain they become awkward.


    The object-oriented approach goes a step further by providing tools for the programmer
    to represent elements in the problem space. This representation is general enough
    that the programmer is not constrained to any particular type of problem. We refer
    to the elements in the problem space and their representations in the solution
    space as “objects." (You will also need other objects that don''t have problem-space
    analogs.) The idea is that the program is allowed to adapt itself to the lingo
    of the problem by adding new types of objects, so when you read the code describing
    the solution, you''re reading words that also express the problem, rather than
    in terms of the computer where the solution will run. Thus, OOP allows you to
    describe the problem in terms of the problem. There''s still a connection back
    to the computer: Each object looks quite a bit like a little computer—it has a
    state, and it has operations that you can ask it to perform. However, this doesn''t
    seem like such a bad analogy to objects in the real world—they all have characteristics
    and behaviors.


    To simply put, OOP is the process of building objects, instancing them, and then
    using them. Using objects involves reading logic on the data, using logic data,
    and then carrying out tasks based on the logic.'
