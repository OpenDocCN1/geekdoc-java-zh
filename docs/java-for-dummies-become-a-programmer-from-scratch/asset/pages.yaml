  md: '# Compiling the Java Source:


    You can compile your Java source directly from your IDE (if you use an IDE). Or,
    you can use the Java compiler that comes with the Java SDK. To compile your Java
    source code from the command line with the Java compiler, do this:


    +   - Open a command prompt

    - Change directory to your project''s root directory (not the source directory)

    - Make sure the project root directory contains a source directory and a class
    directory

    - Type in the command below (on Windows - other OS''es will look similar though):


    ```

    "c:\Program Files\Java\jdk1.8.0_25\bin\javac" src/myfirstapp/*..java -d classes

    ```


    This command executes the javac command (the Java compiler) which compiles the
    Java sources in the directory src/myfirstapp. The *.java means the compiler should
    compile all files in the given directory.


    The myfirstapp directory is a package under the root source directory src. If
    you have multiple packages under the root source directory you will have to run
    the Java compiler multiple times. A Java IDE handles this for you automatically.
    So does build tools like Ant, Maven or Gradle.'
