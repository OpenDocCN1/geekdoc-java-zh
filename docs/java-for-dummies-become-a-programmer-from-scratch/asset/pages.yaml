  md: '# 5 SKILLS SELF-TAUGHT PROGRAMMERS COMMONLY LACK


    # 1. ALGORITHMS


    This is classic computer science right here. Programming without knowledge of
    algorithms is like carpentry with just one kind of saw: you can get the job done,
    but it''s going to take a lot longer.


    You can look at an algorithm as “discipline”. When you learn to write them, what
    you''re doing is solving a problem with discipline; using structure, patterns,
    and logical steps.


    When you don''t know how to discipline your mind, you don''t know how to write
    algorithms.


    Not only can you not write algorithms unless you''ve studied them, you don''t
    know how many algorithms others have written, too.


    I spent four days trying to figure out how to do a permutation. I was so proud
    of myself when I figured it out. Right up until I discovered that B.R. Heaps figured
    it out in 1963.


    # 2. DESIGN PATTERNS


    This comes with education and/or experience. There’s more than one way to structure
    your code, and there''s a right time and a wrong time for each. You either need
    to make mistakes along the way and learn when to use each pattern, or learn from
    someone else who''s already made the mistake (a teacher).


    # 3. PROGRAMMING PARADIGMS'
  merge: -1
