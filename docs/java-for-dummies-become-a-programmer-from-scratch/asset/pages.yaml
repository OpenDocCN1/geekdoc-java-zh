- img_proc: true
  md: 'with object-oriented design is it''s too simple to get from the beginning to
    the end. A mind trained to look for complex solutions can initially be stumped
    by this simplicity.


    When you inherit from an existing type, you create a new type. This new type contains
    not only all the members of the existing type (although the private ones are hidden
    away and inaccessible), but more importantly it duplicates the interface of the
    base class. That is, all the messages you can send to objects of the base class
    you also send to objects of the derived class. Since we know the type of a class
    by the messages we can send to it, this means that the derived class is the same
    type as the base class. In the previous example, "A circle is a shape." This type
    equivalence via inheritance is one of the fundamental gateways in understanding
    the meaning of object-oriented programming.


    Since both the base class and derived class have the same fundamental interface,
    there must be some implementation to go along with that interface. That is, there
    must be some code to execute when an object receives a particular message. If
    you simply inherit a class and don''t do anything else, the methods from the base-class
    interface come right along into the derived class. That means objects of the derived
    class have not only the same type, they also have the same behavior, which isn''t
    particularly interesting.


    You have two ways to differentiate your new derived class from the original base
    class. The first is quite straightforward: You simply add brand new methods to
    the derived class. These new methods are not part of the base-class interface.
    This means that the base class simply didn''t do as much as you wanted it to,
    so you added more methods. This simple and primitive use for inheritance is, at
    times, the perfect solution to your problem. However, you should look closely
    for the possibility that your base class might also need these additional methods.
    This process of discovery and iteration of your design happens regularly in object-oriented
    programming.


    Inherance can be defined as the process where one class acquires the properties
    (methods and fields) of another. With the use of inheritance the information is
    made manageable in a hierarchical order.


    The class which inherits the properties of other is known as subclass (derived
    class, child class) and the class whose properties are inherited is known as superclass
    (base class, parent class).'
