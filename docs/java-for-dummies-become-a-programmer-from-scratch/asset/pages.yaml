  md: "Parameter Lists: When a function is called, its identifier followed by its\
    \ parameter list is added to code. Parameters are like little mail slots on the\
    \ front door of a house. There might be a slot for integers, floats, and arrays.\
    \ Each slot on the door, or argument in the parameter list, is a type followed\
    \ by an identifier.\n\nIf we look at a basic example, we’ll see how all this works.\n\
    \n```\npublic class Example {\n    int a = 0;\n\n    void setA(int i) {\n    \
    \    a = i;\n    }\n}\n```\n\nsetA(int i) takes in one parameter of type int.\
    \ This is a simple example of a value parameter; there are other types of parameters\
    \ which we’ll go into next. The value parameter declares the type and an identifier\
    \ whose scope is limited to the contents of the function it’s declared with. When\
    \ you run the above program and give value 3 to the parameter of the function\
    \ setA(3) you’ll see a 0 followed by a 3. We can do this any number of times,\
    \ and each time we’re allowed to change what value we set A to. Of course, it’s\
    \ easier to use a = 3 in the class, but then we wouldn’t be learning anything."
