  md: 'Access Control All good writers including those who write software know that
    a piece of work isn’t good until it’s been rewritten, often many times. If you
    leave a piece of code in a drawer for a while and come back to it, you may see
    a much better way to do it. This is one of the prime motivations for refactoring,
    which rewrites working code in order to make it more readable, understandable,
    and thus maintainable.


    There is a tension, in this desire to change and improve your code. There are
    often consumers (client programmers) who rely on some aspect of your code staying
    the same. So you want to change it; they want it to stay the same. Thus a primary
