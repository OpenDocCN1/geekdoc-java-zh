  md: '# Introduction to Objects


    Object oriented programming (OOP) was invented to associate data and logic into
    nicely packaged bundles of code. When you write a class in Java you''re creating
    blueprints and instructions for a new object. Any number of objects can then be
    constructed based on your blueprints. Programmers use the term instantiate when
    talking about creating an object from the class blueprint. Each instantiated object
    is an instance of the class from which it was constructed. The class is not one
    of the instances created by it. The newly created object contains all of the functions
    and data written into the class.


    All programming languages provide abstractions. It can be argued that the complexity
    of the problems you''re able to solve is directly related to the kind and quality
    of abstraction. By “kind” I mean, “What is it that you are abstracting?” Assembly
    language is a small abstraction of the underlying machine. Many so-called “imperative”
    languages that followed (such as FORTRAN, BASIC, and C) were abstractions of assembly
    language. These languages are big improvements over assembly, but their primary
    abstraction requires you to think in terms of the structure of the computer rather
    than the structure of the problem you are trying to solve.


    The programmer must establish the association between the machine model (in the
    “solution space,” which is the place where you''re implementing that solution,
    such as a computer) and the model of the problem that is actually being solved
    (in the “problem space,” which is the place where the problem exists, such as
    a business). The effort required to perform this mapping, and the fact that it
    is intrinsic to the programming language, produces programs that are difficult
    to write and expensive to maintain, and as a side effect created the entire “programming
    methods” industry.


    The alternative to modeling the machine is the model you''re trying to solve.
    Early languages such as LISP and APL choose particular views of the world (“All
    problems are ultimately lists” or “All problems are algorithmic,” respectively).
    Prolog casts all problems into chains of decisions. Languages have been created
    for constraint-based programming and for programming exclusively by manipulating
    graphical symbols. (The latter proved to be too restrictive.) Each of these approaches
    may be a good solution to the particular class of problem they''re designed to
    solve, but when you step outside of that'
