    The errors only occurs at run time are call run time errors. Run time errors are
    those that passed compiler''s checking, but fails when the code gets executed.
    There are a lot of causes that may result in runtime errors, such as incompatible
    type-casting, referencing an invalid index in an array, using a null-object, resource
    problems like unavailable file-handles, out of memory situations, thread deadlocks,
    infinite loops(not detected!), etc.


    The following are some common runtime errors:


