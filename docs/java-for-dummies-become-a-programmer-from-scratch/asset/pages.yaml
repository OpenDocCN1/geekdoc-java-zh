  md: '# Socket Class Methods:


    The java.net.Socket class represents the socket that both the client and the server
    use to communicate with each other. The client obtains a Socket object by instantiating
    one, whereas the server obtains a Socket object from the return value of the accept()
    method.

    The Socket class has five constructors that a client uses to connect to a server


    | Sr.No. | Method & Description |

    | 1 | public Socket(String host, int port) throws UnknownHostException, IOException.

    This method attempts to connect to the specified port. If this constructor does
    not throw an exception, the connection is successful and the client is connected
    to the server. |

    | 2 | public Socket(InetAddress host, int port) throws IOException

    This method is identical to the previous constructor, except that the host is
    denoted by an InetAddress object. |

    | 3 | public Socket(String host, int port, InetAddress localAddress, int localPort)
    throws IOException.

    Connects to the specified host and port, creating a socket on the local host at
    the specified address and port. |

    | 4 | public Socket(InetAddress host, int port, InetAddress localAddress, int
    localPort) throws IOException.

    This method is identical to the previous constructor, except that the host is
    denoted by an InetAddress instead of a String. |

    | 5 | public Socket()

    Creates an unconnected socket. Use the connect() method to connect this socket
    to a server. |


    When the Socket constructor returns, it does not simply instantiate a Socket object
