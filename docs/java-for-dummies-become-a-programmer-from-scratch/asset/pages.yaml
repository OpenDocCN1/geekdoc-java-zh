  md: '# Controlling Execution


    The control flow statements in Java allow you to run or skip blocks of code when
    special conditions are met.


    The statements inside your source files are generally executed from top to bottom,
    in the order that they appear. Control flow statements, however, break up the
    flow of execution by employing decision making, looping, and branching, enabling
    your program to conditionally execute particular blocks of code.


    Java uses all of C''s execution control statements, so if you''ve programmed with
    C or C++, then most of what you see will be familiar. Most procedural programming
    languages have some kind of control statements, and there is often overlap among
    languages.


    In Java, the keywords include if-else, while, do-while, for, return, break, and
    a selection statement called switch.


    Java does not, however, support the much-maligned goto (which can still be the
    most expedient way to solve certain types of problems). You can still do a goto-like
    jump, but it is much more constrained than a typical goto.'
