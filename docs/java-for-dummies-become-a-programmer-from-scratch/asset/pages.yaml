    The interface determines the requests that you can make for a particular object.

    However, there must be some code somewhere to satisfy that request. This, along
    with the hidden data, comprises the implementation. From a procedural programming
    standpoint, it''s not complicated.

    A type has a method associated with each possible request, and when you make a
    particular request to an object, that method is called. This process is usually
    summarized by saying that "send a message" (make a request) to an object, and
    the object figures out what to do with that message (it executes code).


    Here, the name of the type/class is Light, the name of this particular Light object
    is lt, and the requests that you can make of a Light object are to turn it on,
    turn it off, make it brighter, or make it dimmer. You create a Light object by
    defining a "reference" (lt) for that object and calling new to request a new object
    of type. To send a message to the object, you state the name of the object and
    connect it to the message request with a period (dot). From the standpoint of
    the user of a predefined class, that''s pretty much all there is to programming
    with objects.


