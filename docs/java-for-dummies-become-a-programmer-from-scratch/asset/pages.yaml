  md: '# What is Data?


    Data, in a general sense is sort of like a noun. Like nouns, data can be be a
    person, place, or thing. Programmers refer to these nouns as objects, and these
    objects are stored in memory as variables. The word variable infers something
    that might change, but this isn''t always the case. It''s better to think of a
    variable as a space in your computer''s memory to put information. When you play
    games like MadLibs you might ask for someone''s name, an object, an adverb, and
    a place. Your result could turn out like “Garth ate a jacket, and studiously played
    at the laundry-mat.” In this case the name, object, adverb, and place are variable
    types. The data is the word you use to assign the variable with.


    Programmers use the word **type** to denote what kind of data is going to be stored.
    Computers aren''t fluent in English and don''t usually know the difference between
    the English types noun and adjective, but they do know the difference between
    letters and a whole variety of numbers. There are many predefined types in java
    or any other language.


    If you add that to the ability to create new types of data, the kinds of data
    we can store is practically unlimited.


    The C# built-in types are sometimes called POD, or plain old data. The term POD
    came from the original C++ standard which finds its origin dating back to 1979.
    POD types have not fundamentally changed from their original implementation.


    So far we''ve used the word type several times. Programmers define the word type
    to describe the variety of data to be stored.'
  merge: -1
