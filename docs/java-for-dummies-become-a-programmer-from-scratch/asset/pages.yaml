  md: '# Compile Time and Run Time Errors


    At compile time, when the code does not comply with the Java syntactic and semantics
    rules as described in Java Language Specification (JLS), compile-time errors will
    occurs. The goal of the compiler is to ensure the code is compliant with these
    rules. Any rule-violation detected at this stage are reported as compilation errors.


    The best way to get to know those rules is to go through all the sections in the
    JLS containing the key words "compile-time error".nIn general, these rules include
    syntax checking: declarations, expressions, lexical parsing, file-naming conventions
    etc; exception handling: for checked exceptions;


    accessibility, type-compatibility, name resolution: checking to see all named
    classes, method calls etc. are reachable through at least one of the declared
    path; entities - variables,


    The following are some common compile time errors:


    +   * a class tries to extend more than one class

    * Overloading or overriding is not implemented correctly

    * attempt to refer to a variable that is not in the scope of the current block

    * an inner class has the same name as one of its enclosing classes

    * a class contains one or more abstract methods and the class itself is not declared
    "abstract"

    * a class tries to reference a private member of another class

    * trying to create an instance of an abstract class'
