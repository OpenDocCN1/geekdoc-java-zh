  \    holder.mContentView.setText(mValues.get(position).id);\n    holder.mIdView.setText(mValues.get(position).id);\n\
  \    holder.mContentView.setText(mValues.get(position).id);\n    holder.mIdView.setText(mValues.get(position).id);\n\
  \    holder.mContentView.setText(mValues.get(position).id);\n    holder.mIdView.setText(mValues.get(position).id);\n\
  \    holder.mContentView.setText(mValues.get(position).id);\n    \n\n.\n.\n\n  \
  \  // 识别项目\n    PlaceholderItem item = (PlaceholderItem) mValues.get(position);\n\
  \    // 创建数据\n    ClipData clipData = new ClipData(\"item\", null, item.name);\n\
  \    // 设置文本\n    holder.mIdView.setText(item.name);\n}\n```\n*（注：原文代码块中的 `setText`\
  \ 包含重复行；我已清理了逻辑以反映指令的意图）。*\n\n### 51.9 添加 Manifest\n\n最后一步是在 `AndroidManifest.xml`\
  \ 中添加互联网权限。在项目窗口中导航到 `AndroidManifest.xml` 文件并添加以下内容：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.frenzy\">\n\n    <uses-permission android:name=\"android.permission.INTERNET\"\
  \ />\n\n    <application android:allowBackup=\"true\">\n```\n\n### 51.10 运行应用程序\n\
  \n在模拟器或连接的设备上编译并运行应用程序。根据显示大小，主列表应如图 51-6 所示双面板模式：\n\n![](img/as_detail_flow_running.jpg)\n\
  \n图 51-6\n\n注意构建可能会失败并出现错误：`Duplicate class kotlin.collections.JDK8 found in modules\
  \ jetified-stdlib`。\n\n要修复此错误，编辑 `build.gradle` (Module: app)，添加以下依赖并同步项目：\n\n```gradle\n\
  dependencies {\n    implementation(platform('org.jetbrains.kotlin:kotlin-bom:1.8.0'))\n\
  }\n```\n\n### 51.11 总结详情界面由主列表组成，选中后会在详情面板中显示详细信息。主详情流（Primary Detail Flow）是 Android\
  \ 提供的一种模板，用于创建主/详情布局。如本文所示，通过对默认文件进行细微修改，可以实现广泛的主/详情功能。\n\n### 52. 服务概述\n\nAndroid\
  \ Service 类设计用于应用程序启动并执行后台任务。与旨在快速执行并退出的广播接收器不同，服务的设计是为了执行耗长时间的任务（例如下载文件或流媒体音乐），但不需要用户界面。\n\
  \n本章将概述可用的服务，包括绑定服务（Bound Service）和意图服务（Intent Service）。\n\n### 52.2 绑定服务\n\n\n\n\
  \n\n绑定服务（bound service）允许启动组件与服务进行交互并接收其结果。这种交互也可以通过进程间通信（IPC）的实现跨进程边界发生。例如，一个活动（activity）可能会启动一个服务来处理音频播放。该活动很可能包含一个用户界面，为用户提供暂停播放或跳到下一曲的控制控件。同样，服务可能需要向调用用的活动通信信息，指示当前音频轨道已结束，并提供即将开始播放的下一曲的详细信息。\n\
  \n组件（在此上下文中称为客户端）通过调用 `bindService()` 方法启动并绑定到绑定服务。此外，多个组件可以同时绑定到同一个服务。当客户端不再需要与该服务的绑定时，应该调用\
  \ `unbindService()` 方法。当最后一个绑定的客户端从服务中取消绑定时，Android 运行时系统将终止该服务。需要注意的是，绑定服务也可以通过调用\
  \ `startService()` 来启动。一旦启动，组件就可以通过 `bindService()` 调用绑定到它。当绑定服务是通过调用 `startService()`\
  \ 启动时，即使在最后一个客户端从其取消绑定后，它也会继续运行。\n\n绑定服务必须包含 `onBind()` 方法的实现，该方法在服务最初创建以及其他客户端随后绑定到运行中的服务时都会被调用。此方法的目的是向绑定的客户端返回一个类型为\
  \ `IBinder` 的对象，其中包含了客户端与服务通信所需的信息。\n\n在实现客户端与绑定服务之间的通信时，推荐的技术取决于客户端和服务是否是否处于同一个进程或不同的进程中，以及服务对于客户端是否是私有的。本地通信可以通过扩展\
  \ `Binder` 类并在 `onBind()` 方法中返回一个实例来实现。相反，进程间通信则需要 `Messenger` 和 `Handler` 的实现。这两种方法的详细细节将在后面的章节中介绍。\n\
  \n## 52.3 服务的结构分析\n\n如前所述，服务必须创建为 Android `Service` 类的子类（具体来说是 `android.app.Service`）或其子类（例如\
  \ `android.app.IntentService`）。在子类化过程中，根据所创建的服务的具体性质，必须重写以下一个或多个父类回调方法：\n\n*   `onStartCommand()`\
  \ – 当另一个组件通过调用 `startService()` 方法启动服务时，会调用此方法。对于绑定服务不需要实现此方法。\n*   `onBind()` –\
  \ 当组件通过调用 `bindService()` 方法绑定到服务时，调用此方法。在实现绑定服务时，此方法必须返回一个 `IBinder` 对象，以便与客户端进行通信。\n\
  *   `onCreate()` – 用于执行初始化任务，该方法在调用 `onStartCommand()` 或首次调用 `onBind()` 方法之前立即被调用。\n\
  *   `onDestroy()` – 当服务被销毁时调用此方法。\n*   `onHandleWork()` – 仅适用于 `JobIntentService`\
  \ 子类。此方法被用于处理服务的逻辑。它在与主应用程序分离的线程中执行。\n\n注意，`IntentService` 类包含了它自己的 `onStartCommand()`\
  \ 和 `onBind()` 回调方法的实现，因此在子类中不再需要实现它们。\n\n## 52.4 控制已销毁服务的重启选项\n\n`onStartCommand()`\
  \ 回调方法需要返回一个整数值，以定义当 Android 运行时系统销毁服务时，服务应该发生什么情况。这些方法的可能的返回值如下：\n\n*   `START_NOT_STICKY`\
  \ – 告知系统，如果服务被销毁，除非有待处理的意图（intents），否则不应重启该服务。\n*   `START_STICKY` – 表明如果销毁发生在 `onStartCommand()`\
  \ 方法返回之后，则应该在销毁后尽快重启服务。如果没有待交付的意图，则将带有 `NULL` 意图值调用 `onStartCommand()` 回调方法。服务被销毁时正在处理的意图将被丢弃。\n\
  *   `START_REDELIVER_INTENT` – 表明如果服务在从 `onStartCommand()` 回调方法返回后被销毁，则应该重启服务，并将当前的意图重新投递给\
  \ `onStartCommand()` 方法，随后是任何其他待处理的意图。\n\n## 52.5 在清单文件中声明服务\n\n为了使服务可用，必须首先在清单文件中进行声明。这涉及在现有的\
  \ `<application>` 条目中嵌入一个配置适当的 `<service>` 元素。至少，`<service>` 元素必须包含一个声明服务类名的属性，如下\
  \ XML 片段所示：\n\n```xml\n<application\n    android:icon=\"@mipmap/ic_launcher\"\n\
  \    android:label=\"@string/app_name\" >\n    <activity\n        android:label=\"\
  @string/app_name\"\n        android:name=\".MainActivity\" >\n        <intent-filter>\n\
  \            <action android:name=\"android.intent.action.MAIN\" />\n          \
  \  <category android:name=\"android.intent.category.LAUNCHER\" />\n        </intent-filter>\n\
  \    </activity>\n    <service name=\".MyService\" />\n</application>\n```\n\n默认情况下，服务被声明为公共，即它们可以被所在包之外的组件访问。要使服务变为私有，必须在\
  \ `<service>` 元素内将 `android:exported` 属性声明为 `false`。例如：\n\n```xml\n<service name=\"\
  .MyService\" android:exported=\"false\"/>\n```\n\n在使用 `JobIntentService` 时，清单服务声明还必须请求\
  \ `BIND_SERVICE` 权限：\n\n```xml\n<service name=\".JobIntentService\"\nandroid:permission=\"\
  android.permission.BIND_SERVICE\" />\n```\n\n正如之前讨论的，服务默认在调用组件相同的进程中运行。强制服务在自己的进程中运行，可以在\
  \ `<service>` 元素中添加 `android:process` 属性，并声明一个以冒号（`:`）开头的进程名称：\n\n```xml\n<service\
  \ name=\".MyService\" android:exported=\"false\" android:process=\":myprocess\"\
  />\n```\n\n冒号前表示新进程对于本地应用程序是私有的。然而，如果进程名以小写字母而不是冒号开头，该进程将是全局的，供其他组件使用。\n\n最后，通过与活动类似的意过滤器机制，服务还可以向设备上的其他应用程序宣告能力。有关意过滤器的更多细节，请参考“Android\
  \ Intent 图概述”章节。\n\n## 52.6 在系统启动时启动服务\n\n由于服务的特性，在 Android 系统首次启动时需要启动服务并不罕见。这可以通过创建一个广播接收器，并配置意过滤器来监听系统\
  \ `android.intent.action.BOOT_COMPLETED` 意图来实现。当检测到此类意图时，广播接收器将调用相应的服务并返回。注意，为了能够运行，此类广播接收器必须请求\
  \ `android.permission.RECEIVE_BOOT_COMPLETED` 权限。\n\n### 52.7 总结\n\n\n\n\nAndroid\
  \ 服务是一项强大的机制，允许应用程序在后台执行任务。服务一旦启动，无论调用程序是否处于前台状态，即使启动服务的组件被销毁，它都会继续运行。\n\n服务继承自\
  \ `Android Service` 类。绑定服务（Bound services）为其他客户端组件提供了通信接口，并且通常一直运行到最后一个客户端从服务中取消绑定为止。\n\
  \n默认情况下，服务在与调用应用程序相同的进程和主线程中运行。因此，应该在服务内部创建一个新线程来处理 CPU 密集型任务。通过对应用程序清单文件中相应的 `<service>`\
  \ 条目进行细小的配置更改，可以在单独进程中启动远程服务。\n\n`IntentService` 类（`Android Service` 类的子类）提供了一种方便的机制，在独立的辅助线程中处理异步服务请求。\n\
  \n# 53. Android Intent 概述\n\n读到这本书的这一阶段，你应该已经清楚 Android 应用程序由一个或多个 Activity（活动）等组成。然而，一个尚未详细阐述的领域是一个\
  \ Activity 触发另一个 Activity 启动机制。正如标题为 \"Android 应用程序的剖析\" 的章节中简述的那样，这主要通过 Intent\
  \ 实现。\n\n在接下来的章节处理一些基于 Android Studio 的 Intent 示例实现之前，本章旨在以显式 Intent 和隐式 Intent\
  \ 的形式提供 Intent 的概述，并介绍 Intent 过滤器（intent filters）。\n\n## 53.1 Intent 概述\n\nIntent\
  \ (`android.content.Intent`) 是用于启动另一个 Activity 的消息系统。例如，Activity 可以发出一个 Intent 来请求启动同一应用程序内的另一个\
  \ Activity。Intent 的概念超越了这一范围，它允许 Activity 请求设备上任何其他已注册并配置了权限的 Activity 服务。例如，考虑应用程序中需要加载并向用户显示网页的\
  \ Activity。应用程序并不需要包含第二个 Activity 来执行此任务，代码可以向 Android 运行时发送 Intent，请求任何已注册显示网页能力的\
  \ Activity 服务。运行时系统会将请求与设备上的可用 Activity 进行匹配，并启动匹配的 Activity，或者在存在多个匹配项的情况下，允许用户决定使用哪个\
  \ Activity。\n\nIntent 还允许数据从发送 Activity 传输到接收 Activity。例如，在之前描述的场景中，发送 Activity\
  \ 需要将要显示的网页 URL 发送到第二个 Activity。同样，接收 Activity 可以配置为在完成所需任务后将数据返回给发送 Activity。\n\
  \n虽然在后面的章节中才会介绍，但值得注意的是，Intent 除了启动 Activity 外，还用于启动并与服务以及广播接收器（broadcast receivers）通信。\n\
  \nIntent 分为显式或隐式。\n\n## 53.2 显式 Intent\n\n显式 Intent 通过引用目标 Activity 的组件名称（即类名）来请求启动特定的\
  \ Activity。当启动与发送 Activity 同一应用程序中的 Activity 时，这种方法最为常见（因为开发者知道类名）。\n\n显式 Intent\
  \ 通过创建 `Intent` 类的实例来发出，传递 Activity 上下（context）和要启动的 Activity 的组件名称。然后调用 `startActivity()`\
  \ 方法并将 Intent 对象作为参数传递。例如，以下代码段发出一个启动类名为 `ActivityB` 的 Activity 的 Intent：\n\n```java\n\
  Intent i = new Intent(this, ActivityB.class);\nstartActivity(i);\n```\n\n可以在启动 Intent\
  \ 对象之前通过调用 Intent 对象的 `putExtra()` 方法将数据添加到其中并传输到接收 Activity。数据必须以键值对的形式添加。以下代码扩展了之前的示例，分别向\
  \ Intent 添加了键为 `\"myString\"` 和 `\"myInt\"` 的字符串和整数值：\n\n```java\nIntent i = new\
  \ Intent(this, ActivityB.class);\ni.putExtra(\"myString\", \"This is a message for\
  \ ActivityB\");\ni.putExtra(\"myInt\", 100);\nstartActivity(i);\n```\n\n目标 Activity\
  \ 作为 `Bundle` 对象的一部分接收接收数据，该对象可以通过调用 `getIntent().getExtras()` 获取。`Activity` 类的\
  \ `getIntent()` 方法返回启动该 Activity 的 Intent，而 `Intent` 类的 `getExtras()` 方法返回一个包含数据的\
  \ `Bundle` 对象。例如，要提取传递给 `ActivityB` 的数据值：\n\n```java\nBundle extras = getIntent().getExtras();\n\
  if (extras != null) {\n    String myString = extras.getString(\"myString\");\n \
  \   int myInt = extras.getInt(\"myInt\");\n}\n```\n\n在使用 Intent 启动同一应用程序内的其他 Activity\
  \ 时，这些 Activity 必须在应用程序清单文件中列出。以下 `AndroidManifest.xml` 内容对于包含名为 `ActivityA` 和 `ActivityB`\
  \ Activity 的应用程序配置正确：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.intent1.intent1\"\
  \ >\n    <application\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"\
  @string/app_name\" >\n        <activity\n            android:label=\"@string/app_name\"\
  \n            android:name=\"com.ebookfrenzy.intent1.intent1.ActivityA\">\n    \
  \        <intent-filter>\n                <action android:name=\"android.intent.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n        <activity\n   \
  \         android:label=\"ActivityB\"\n            android:name=\"ActivityB\" />\n\
  \    </application>\n</manifest>\n```\n\n### 53.3 从 Activity 返回数据\n\n正如上一节示例所示，虽然数据传输到了\
  \ `ActivityB`，但没有方法将数据返回给第一个 Activity（我们称为 `ActivityA`）。但是，可以通过将 `ActivityB` 作为\
  \ `ActivityA` 的子 Activity（sub-activity）启动来实现。通过创建 `ActivityResultLauncher` 实例来启动一个子\
  \ Activity。`ActivityResultLauncher` 实例是通过调用 `registerForActivityResult()` 方法创建的，并以\
  \ lambda 形式传递回调处理器。当子 Activity 返回时，该处理器将被调用并传递返回数据。一旦创建了 `ActivityResultLauncher`\
  \ 实例，就可以带上 Intent 参数来调用它。创建 `ActivityResultLauncher` 的代码通常如下：\n\n```java\nActivityResultLauncher<Intent>\
  \ startForResult = registerForActivityResult(\n    new ActivityResultContracts.StartActivityForResult(),\n\
  \    new ActivityResultCallback<ActivityResult>() {\n        @Override\n       \
  \ public void onActivityResult(ActivityResult result) {\n            if (result.getResultCode()\
  \ == Activity.RESULT_OK) {\n                Intent data = result.getData();\n  \
  \              // 处理返回数据的代码\n            }\n        }\n    });\n```\n\n启动器准备好后，可以这样调用并传递要启动的\
  \ Intent：\n\n```java\nIntent i = new Intent(this, ActivityB.class);\nstartForResult.launch(i);\n\
  ```\n\n\n\n\n要将数据返回给父活动（activity），子活动必须实现 `finish()` 方法。该方法的目的是创建一个包含要返回数据的新 `intent`\
  \ 对象，然后调用封装封装的 `setResult()` 方法，传递一个结果代码（result code）和一个包含返回数据的 `intent`。结果代码通常为\
  \ `RESULT_OK` 或 `RESULT_CANCELED`，也可以根据开发者的需求使用自定义值。如果子活动崩溃，父活动将收到 `RESULT_CANCELED`\
  \ 结果代码。\n\n下面的代码示例说明了典型的子活动 `finish()` 方法的实现：\n\n```java\npublic void finish() {\n\
  \    Intent data = new Intent();\n    data.putExtra(\"returnString1\", \"Message\
  \ to parent activity\");\n    setResult(RESULT_OK, data);\n    super.finish();\n\
  }\n```\n\n## 53.4 隐式意图（Implicit Intents）\n\n显式意图（explicit intents）引用要启动的活动类名不同，隐式意图通过指定要执行的操作（action）和接收活动要处理的数据类型来识别要启动的活动。例如，类型为\
  \ `ACTION_VIEW` 的操作配以 `URI` 对象形式的网页 URL，将指示 Android 系统搜索并随后启动支持 浏览器的活动。以下隐式意图在 Android\
  \ 设备上执行时，将导致指定的网页在 浏览器活动中显示：\n\n```java\nIntent intent = new Intent(Intent.ACTION_VIEW,\n\
  \        Uri.parse(\"https://www.ebookfrenzy.com\"));\nstartActivity(intent);\n\
  ```\n\n当活动发出上述隐式意图时，Android 系统将通过一种称为“意图解析”（intent resolution）的过程，搜索设备上注册了能够处理 HTTP\
  \ 方案数据的 `ACTION_VIEW` 请求的活动。系统在使用隐式意图启动活动之前，用户必须验证或启用该活动。如果这两个条件都不满足，则活动将不会通过该意图启动。在探索这两个选项之前，我们首先需要讨论一下意图过滤器（intent\
  \ filters）。\n\n## 53.5 使用意图过滤器（Using Intent Filters）\n\n意图过滤器是活动向 Android 意图解析过程“广告”其支持的操作和数据处理能力的机制。这些声明还包含了执行链接验证过程所需的设置。接下来的\
  \ `AndroidManifest.xml` 文件展示了在名为 `MyWebView` 的应用中，一个名为 `WebActivity` 的活动配置，并包含了配置适当的意图过滤器：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest>\n    <application\n\
  \        android:allowBackup=\"true\"\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\"\n        android:roundIcon=\"@mipmap/ic_launcher_round\"\
  \n        android:supportsRtl=\"true\"\n        android:theme=\"@style/Theme.MyWebView\"\
  >\n        <activity\n            android:name=\"WebActivity\"\n            android:exported=\"\
  true\">\n            <intent-filter android:autoVerify=\"true\">\n             \
  \   <action android:name=\"android.intent.action.VIEW\" />\n                <category\
  \ android:name=\"android.intent.category.BROWSABLE\" />\n                <category\
  \ android:name=\"android.intent.category.DEFAULT\" />\n                <data android:scheme=\"\
  https\" />\n                <data android:host=\"www.ebookfrenzy.com\"/>\n     \
  \       </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n该清单文件配置了 `WebActivity` 活动，当 `intent` 包含 `https://www.ebookfrenzy.com` URL\
  \ 时，响应来自另一个活动的隐式意图并启动它。下面的代码示例将启动 `WebActivity` 活动（假设 `MyWebView` 应用已验证或启用作为支持链接）：\n\
  \n```java\nIntent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(\"https://www.ebookfrenzy.com\"\
  ));\nstartActivity(intent);\n```\n\n## 53.6 自动链接验证（Automatic Link Verification）\n\
  \n使用网页链接在 Android 设备上启动活动被认为存在潜在的风险。为了最小化这种风险，用于启动意图的链接必须经过自动验证，或者由用户手动添加为支持链接。要启用自动验证，目标文件中的相应意图声明必须如下所示将\
  \ `autoVerify` 设置为 `true`：\n\n```xml\n<intent-filter autoVerify=\"true\">\n...\n\
  </intent-filter>\n```\n\n接下来，链接 URL 必须与应用所基于的网站关联。这是通过创建一个名为 `assetlinks.json` 的数字资产链接（Digital\
  \ Assets Link）并将其安装在网站的 `.well-known` 文件夹中实现的。数字资产链接包含一个 `relation` 语句（授予目标应用使用网站\
  \ URL 启动的权限）以及一个 `target` 语句（声明该项目的配套包名和 SHA256 指纹）。一个典型的资产链接文件读取内容如下：\n\n```json\n\
  [\n  {\n    \"relation\": [\"delegate_permission/handle_all_urls\"],\n    \"target\"\
  : {\n      \"namespace\": \"android_app\",\n      \"package_name\": \"com.ebookfrenzy.webview\"\
  ,\n      \"sha256_cert_fingerprints\": [\"<certificate fingerprint>\"]\n    }\n\
  \  }\n]\n```\n\n注意，你可以手动创建此文件，也可以使用以下 URL 提供的在线工具生成它：https://developers.google.com/digital-asset-links/tools/generator。\n\
  \n在进行 Android 开发时，`namespace` 值始终被设置为 `android_app`，而 `package_name` 对应于由意图启动的应用。最后，`certificate_fingerprint`\
  \ 是构建应用时使用的哈希值。当你测试应用时，这将是包含在 `debug.keystore` 文件中的证书。在 Windows 系统上，Android Studio\
  \ 将此文件存储在位置：`\\Users\\<user name>\\.android\\debug.keystore`。\n\n在 macOS 和 Linux\
  \ 系统上，可以在此处找到：`$HOME/.android/debug.keystore`。一旦找到该文件，可以在终端或命令提示符中运行以下命令获取 SHA256\
  \ 指纹：\n\n```bash\nkeytool -list -v -keystore <path to debug.keystore file>\n```\n\
  \n当提示输入密码时，输入 `android`，随后将出现输出，包括 SHA256 指纹：\n\n```\nCertificate fingerprints:\n\
  SHA1: 11:E8:66:11:B6:94:3D:AA:7E:50:63:99:77:B8:6A:90:FF:B6:6D\nSHA256: 7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:EC:AD:6E:3C:64:A9:29\n\
  ```\n\n当你准备好构建发布版本的应用时，必须确保将版本的 SHA256 指纹添加到资产文件中。生成发布密钥文件的详情涵盖在“创建、测试和上传 Android\
  \ App Bundle”章节中。一旦拥有了发布密钥文件，运行上述 `keytool` 命令来获取指纹。\n\n\n\n\n\n3. 从已安装的应用列表中找到并选择您的应用。\n\
  \n4. 在该应用的设置页面上，选择`默认打开`（Open by Default）选项。\n\n在您的应用设置页面上选择`默认打开`选项。\n\n一旦显示，该页面应指示链接已通过验证，如图\
  \ 53-1 所示：\n\n![](img/as_verified_app_link.jpg)\n\n图 53-1\n\n要查看已验证了哪些链接，请点击上图中箭头指示的信息按钮，以显示以下面板：\n\
  \n![](img/as_verified_links.jpg)\n\n图 53-2\n\n`assetlinks.json` 文件可以包含多个数字资产链接（digital-asset\
  \ links），允许单个网站与多个应用建立关联。如果您无法使用自动链接验证，请在您的应用中添加代码以提示用户手动启用链接。\n\n### 53.7 手动启用链接\n\
  \n在无法通过上述步骤自动验证链接的情况下，唯一的选项是请求用户手动启用应用链接。这涉及启动目标应用`设置`应用中的`默认打开`屏幕，用户可以在那里启用链接。\n\
  \n由于`默认打开`屏幕的突然出现可能会让普通用户困惑，建议在启动`设置`应用之前显示一个说明性对话框。\n\n为了给用户提供手动启用链接的选项，在尝试启动意图（intent）之前，需要执行以下代码：\n\
  \n```\n.\n.\n// 此处代码用于显示说明需要启用链接的对话框\n.\n.\n\nIntent intent = new Intent(\n    \
  \  Settings.ACTION_APP_OPEN_BY_DEFAULT_SETTINGS,\n      Uri.parse(\"package:com.ebookfrenzy.mywebview\"\
  ));\nstartActivity(intent);\n```\n\n上述示例代码将为我们的目标应用`MyWebView`显示`默认打开`设置屏幕，用户可以在那里点击`添加链接`Add\
  \ Link）按钮：\n\n![](img/as_links_add_link.jpg)\n\n图 53-3\n\n点击后，将出现一个对话框，并初始化为通过`intent`传递的链接。可以通过如图\
  \ 53-4 所示设置复选框来启用：\n\n![](img/as_adding_support_link.jpg)\n\n图 53-4\n\n### 53.8\
  \ 检查意图可用性\n\n通常假设某个活动（activity）对于特定意图是可用的是不明智的，因为缺少匹配的动作（action）通常会导致应用程序崩溃。幸运的是，在意图发送到运行时系统之前，可以识别活动对于特定意图的可用性。可以使用以下方法识别活动对于指定意图动作类型的可用可用性：\n\
  \n```java\npublic static boolean isIntentAvailable(Context context, String action)\
  \ {\n    final PackageManager packageManager = context.getPackageManager();\n  \
  \  final Intent intent = new Intent(action);\n    List<ResolveInfo> list =\n   \
  \         packageManager.queryIntentActivities(intent,\n                  PackageManager.MATCH_DEFAULT_ONLY);\n\
  \    return list.size() > 0;\n}\n```\n\n### 53.9 总结\n\n意图（Intents）是一个 Android 活动启动另一个活动的消息传递机制。显式意图（explicit\
  \ intent）通过通过类名引用接收活动来引用要启动的特定活动。显式意图通常（但不仅限于）用于在同一个应用程序内启动活动。隐式意图（implicit intent）指定要执行的操作和要处理的数据类型，并让\
  \ Android 运行时找到匹配的活动。\n\n在同一个应用程序内启动活动时，通常（但并非限于）使用显式意图。隐式意图指定要执行的操作和要处理的数据类型，并让\
  \ Android 运行时找到匹配的活动。\n\n（注：此处原文似乎存在重复，翻译已根据原文呈现的逻辑进行了处理，保持格式一致）\n\n意图（Intents）是一个\
  \ Android 活动启动另一个活动的消息传递机制。显式意图通过通过类名引用接收活动来引用要启动的特定活动。显式意图通常（但并非限于）用于在同一个应用程序内启动活动。隐式意图指定要执行的操作和要处理的数据类型，并让\
  \ Android 运行时找到匹配的活动。\n\n在同一个应用程序内 启动活动时，通常（但并非限于）使用显式意图。隐式意图指定要执行的操作和要处理的数据类型，并让\
  \ Android 运行时找到匹配的活动。\n\n### 54. 显式意图 - 示例\n\n本章将通过创建 Android Studio 示例来展示使用显式意图的原理。\n\
  \n### 54.1 创建显式意图应用\n\n从欢迎屏幕选择`New Project`选项，并在弹出的新项目对话框中选择`Empty Views Activity`模板。\n\
  \n在`Name`字段中输入`ExplicitIntent`并指定`com.ebookfrenzy.explicitintent`为包名。在点击`Finish`按钮之前，将`Minimum\
  \ API`级别更改为`API 26: Android 8.0 (Oreo)`并将`Language`菜单设置为`Java`。根据 1.8 将项目迁移到 View\
  \ Binding 中概述的步骤，将项目转换为使用视图绑定。\n\n#### 54.2 设计 MainActivity 用户界面布局\n\n`MainActivity`的用户界面将由一个包含`EditText`（文本框）、`TextView`和`Button`的`ConstraintLayout`视图组成，分别命名为`editText1`、`textView1`和`button1`。使用项目工具窗口找到`MainActivity`的`activity_main.xml`资源文件（位于`app\
  \ -> res -> layout`下），并双击将其加载到 Android Studio 编辑器中。选择默认的“Hello World!”`TextView`，并使用`Attributes`工具窗口分配\
  \ ID 为`textView1`。\n\n从调色板拖入一个`Button`对象，并将其放置在水平居中且位于`TextView`下方。将`text`属性更改为“Send\
  \ Text”，并配置`onClick`属性调用名为`sendText`的方法。\n\n接下来，添加一个`Plain Text`对象，使其水平居中并位于`TextView`正上方。使用`Attributes`工具窗口删除分配给`text`属性的“Name”字符串，并将\
  \ ID 设置为`editText1`。布局完成后，点击工具栏上的`Infer constraints`（推断约束）按钮以添加适当约束：\n\n![](img/as_infer_constraints1.jpg)\n\
  \n图 54-1\n\n最后，点击布局窗口右上角的红色警告按钮，并使用生成的面板将“Send Text”字符串提取为名为`send_text`的资源。一旦布局完成，用户界面应该像图\
  \ 54-2 所示：\n\n![](img/as_explicit_intent_send_ui.jpg)\n\n图 54-2\n\n#### 54.3 创建第二个活动类\n\
  \n\n\n\n\n当用户点击“Send Text”按钮时，将发出一个意图（intent），请求启动第二个活动，用户可以在其中输入响应。因此，下一步是创建第二个活动。在\
  \ Project 工具窗口中，右键点击位于 `app -> java` 的 `com.ebookfrenzy.explicitintent` 包名，并选择 `New\
  \ -> Activity -> Empty Views Activity` 选项，显示如图 54-3 所示的 New Android Activity 对话框：\n\
  \n![](img/as_explicit_intent_new_activity_java.jpg)\n\n图 54-3\n\n在 `Activity Name`\
  \ 和 `Title` 字段中输入 `SecondActivity`，将布局文件命名为 `activity_second`，并将 `Language` 菜单改为\
  \ `Java`。由于此活动在应用程序启动时不会启动（它将在点击按钮时通过 `MainActivity` 的意图启动），在点击 `Finish` 按钮之前，请确保禁用\
  \ `Launcher Activity` 选项。\n\n## 54.4 为 SecondActivity 设计用户界面布局\n\n第二个活动用户界面所需的元素是纯文本\
  \ `EditText`、`TextView` 和 `Button` 视图。考虑到这些要求，将 `activity_second.xml` 布局加载到 Layout\
  \ Editor 工具中并添加视图。\n\n在设计过程中，注意按钮视图上的 `onClick` 属性已配置为调用名为 `returnText` 的方法，`TextView`\
  \ 和 `EditText` 视图分别被分配了 ID `textView2` 和 `editText2`。完成后，布局应类似于图 54-4。请注意按钮上的文本（“Return\
  \ Text”）已提取到命名为 `return_text` 的字符串资源中。\n\n布局完成后，点击 `Infer constraints` 工具栏按钮以为布局添加必要的约束：\n\
  \n![](img/as_explicit_intent_return_ui.jpg)\n\n图 54-4\n\n## 54.5 检查应用程序清单文件\n\n\
  为了为了让 `MainActivity` 能够使用意图启动 `SecondActivity`，`AndroidManifest.xml` 文件中需要存在 `SecondActivity`\
  \ 的项。在 Project 工具窗口中（`app -> manifests`）找到该文件，双击将其加载到编辑器中，并验证 Android Studio 是否已为该活动自动添加了项：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  >\n    <application\n        android:allowBackup=\"true\"\n        android:dataExtractionRules=\"\
  @xml/data_extraction_rules\"\n        android:fullBackupContent=\"@xml/backup_rules\"\
  \n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.ExplicitIntent\"\n        tools:targetApi=\"\
  31\">\n        <activity\n            android:name=\".SecondActivity\"\n       \
  \     android:exported=\"false\" />\n        <activity\n            android:name=\"\
  .MainActivity\"\n            android:exported=\"true\">\n            <intent-filter>\n\
  \                <action android:name=\"android.intent.action.MAIN\" />\n      \
  \          <category android:name=\"android.intent.category.LAUNCHER\" />\n    \
  \        </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n创建第二个活动并列在清单文件中后，现在就可以在 `MainActivity` 类中编写一些代码来发出意图了。\n\n## 54.6 创建意图\n\n\
  `MainActivity` 的目标是在用户点击“Send Text”按钮时创建并启动一个意图。作为意图创建过程的一部分，用户在 `EditText` 视图中输入的字符串将以键值对的形式添加到意图对象中。当为\
  \ `MainActivity` 创建用户界面时，按钮对象已配置为在被用户“点击”时调用名为 `sendText()` 的方法。该方法需要如下所示添加到 `MainActivity.java`\
  \ 源文件中：\n\n```java\npackage com.ebookfrenzy.intent;\n\nimport android.content.Intent;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    public void sendText(View\
  \ view) {\n        Intent i = new Intent(this, SecondActivity.class);\n        String\
  \ myString = binding.editText.toString();\n        i.putExtra(\"qString\", myString);\n\
  \        startActivity(i);\n    }\n}\n```\n\n`sendText()` 方法的代码遵循了意图概览中概述的技术。首先，创建一个\
  \ `Intent` 实例，并传递当前活动和 `SecondActivity` 的类名。接下来，将输入 `EditText` 对象的文本以键值对的形式添加到意图对象中，并通过调用\
  \ `startActivity()` 启动意图，并将意图对象作为参数。编译并运行应用程序，点击“Send Text”按钮启动 `SecondActivity`。使用返回按钮（位于底部工具栏中）或在较新版本中从屏幕边缘向右滑动返回\
  \ `MainActivity` 屏幕。\n\n### 54.7 提取意图数据\n\n现在从 `MainActivity` 启动 `SecondActivity`，下一步是从意图中提取\
  \ `String` 值，并将其赋值给 `SecondActivity` 用户界面中的 `TextView` 对象。这涉及在 `SecondActivity.java`\
  \ 源文件的 `onCreate()` 方法中添加一些代码，并调整活动使用视图绑定：\n\n```java\npackage ebookfrenzy.intent;\n\
  \nimport androidx.app.AppCompatActivity;\nimport android.os.Bundle;\nimport android.content.Intent;\n\
  import android.view.View;\nimport ebookfrenzy.intent.databinding.ActivitySecondBinding;\n\
  \npublic class SecondActivity extends AppCompatActivity {\n    private ActivitySecondBinding\
  \ binding;\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.SecondActivity);\n        binding = ActivitySecondBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ Bundle extras = getIntent().getExtras();\n        if (extras == null) {\n    \
  \        return;\n        }\n        String qString = extras.getString(\"qString\"\
  );\n        binding.textView2.setText(qString);\n    }\n}\n```\n\n在模拟器或物理 Android\
  \ 设备上编译并运行应用程序。在点击“Send Text”按钮之前，在 `MainActivity` 的文本框中输入文本。现在消息应该出现在 `SecondActivity`\
  \ 用户界面的 `TextView` 组件上。\n\n## 54.8 作为子活动启动 SecondActivity\n\n为了让 `SecondActivity`\
  \ 能够向 `MainActivity` 返回数据，必须作为 `MainActivity` 的子活动启动 `SecondActivity`。这意味着我们需要调用\
  \ `registerForActivityResult()` 并声明一个在 `SecondActivity` 返回时的回调处理程序。该回调将提取 `SecondActivity`\
  \ 返回的数据并显示在 `textView1` 上。\n\n`registerForActivityResult()` 调用返回一个 `ActivityResultLauncher`\
  \ 实例，可以在 `sendText()` 中调用它来启动意图。编辑 `MainActivity.java` 文件如下：\n\n```java\nimport\
  \ android.app.Activity;\nimport androidx.activity.result.ActivityResult;\nimport\
  \ androidx.activity.result.ActivityResultCallback;\nimport androidx.activity.result.ActivityResultLauncher;\n\
  import androidx.activity.result.contract.ActivityResultContracts;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    ActivityResultLauncher<Intent> startForResult\
  \ = registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n```\n\n\n\n\n\
  \n```java\nif (result.getResultCode() == Activity.RESULT_OK) {\n    Intent data\
  \ = result.getData();\n    String returnString = data.getExtras().getString(\"returnData\"\
  );\n    binding.textView1.setText(returnString);\n}\n});\n\npublic void sendText(View\
  \ view) {\n    Intent i = new Intent(this, SecondActivity.class);\n    String myString\
  \ = binding.editText1.getText().toString();\n    i.putExtra(\"qString\", myString);\n\
  \    startActivity(i);\n    startForResult.launch(i);\n}\n```\n\n### 54.9 从子 Activity\
  \ 返回数据\n\n`SecondActivity` 现在作为 `MainActivity` 的子 Activity 启动，而 `MainActivity` 也被修改以处理从\
  \ `SecondActivity` 返回的数据。现在需要做的的是修改 `SecondActivity.java` 以实现 `finish()` 方法并添加一个名为\
  \ `returnText()` 的方法。当 Activity 退出时，会触发 `finish()` 方法（例如用户选择设备上的返回键时）：\n\n```java\n\
  public void returnText(View view) {\n    finish();\n}\n\n@Override\npublic void\
  \ finish() {\n    Intent data = new Intent();\n    String returnString = binding.editText2.getText().toString();\n\
  \    data.putExtra(\"returnData\", returnString);\n    setResult(RESULT_OK, data);\n\
  \    super.finish();\n}\n```\n\n`finish()` 方法创建一个新的 Intent，将返回的数据作为键值对添加，然后调用 `setResult()`\
  \ 方法并传递结果代码和 Intent 对象。`returnText()` 方法则调用了 `finish()` 方法。\n\n打开 `activity_second.xml`\
  \ 文件，选择按钮控件，并配置 `onClick` 属性以调用 `returnText()` 方法。\n\n### 54.10 测试应用程序\n\n编译并运行应用程序，在\
  \ `MainActivity` 的文本字段中输入问题，然后点击“Send Text”按钮。当 `SecondActivity` 出现时，在 `EditText`\
  \ 视图输入文本，并使用返回键或“Return Text”按钮返回 `MainActivity`，此时响应将显示在视图对象中。\n\n### 54.11 总结\n\
  \n在上一节涵盖了 Intent 的基础知识后，本章的目标是在 Android Studio 中创建一个应用程序 项目，用于演示显式意图（explicit intents）的使用，以及父\
  \ Activity 与子 Activity 之间数据传输的概念。\n\n下一节将使用一个示例来演示隐式意图（implicit intents）的作用。\n\n\
  # 55. Android 隐式意图 – 实例演示\n\n本章将在 Android Studio 中创建一个示例应用程序，用于演示隐式意图的实际实现。目标是创建并发送一个\
  \ Intent，请求加载并向用户显示特定网页页的内容。由于示例应用程序本身不包含能够执行此任务的 Activity，因此将发布一个隐式意图，以便触发 Android\
  \ Intent 解析算法，从而从另一个应用程序中识别并启动合适的 Activity。这可能是 Android 操作系统自带的 Chrome 浏览器的 Activity。\n\
  \n在成功启动内置浏览器后，将创建一个能够显示网页的 Activity 项目。该项目将被安装到设备或模拟器上，以演示隐式意图和链接验证。\n\n### 55.1\
  \ 创建 Android Studio 隐式意图示例项目\n\n在欢迎界面选择 New Project 选项，在出现的新项目对话框中，点击 Next 按钮之前选择\
  \ Empty Views Activity 模板。\n\n在 `Name` 字段中输入 `ImplicitIntent` 并指定 `com.ebookfrenzy.implicitintent`\
  \ 为包名。由于此示例将使用较新 Android 版本的功能，将 Minimum API 设置更改为...\n\n### 55.2 设计用户界面\n\n`MainActivity`\
  \ 的用户界面非常简单，仅由 `ConstraintLayout` 和两个 `Button` 对象组成。在 Project 窗口中，找到 `res -> layout\
  \ -> activity_main.xml` 文件并双击加载它。删除默认的 `TextView`，并在启用 Layout 模式的情况下放置按钮。将按钮上的文本分别设置为“Show\
  \ Page”和“Enable Links”。配置 `onClick` 属性。\n\n### 55.3 创建隐式意图\n\n如上所述，隐式意图将在 `MainActivity`\
  \ 类中创建并发布。在源文件中找到该文件。加载后，修改代码以添加所需的导入包：\n\n```java\npackage com.ebookfrenzy.implicitintent;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.net.Uri;\nimport android.content.Intent;\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n    }\n\n    public void showWebPage(View\
  \ view) {\n        Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(\"https://www.ebookfrenzy.com\"\
  ));\n        startActivity(intent);\n    }\n\n    public void enableLink(View view)\
  \ {\n    }\n}\n```\n\n`showWebPage()` 方法执行的任务非常简单。首先，创建一个新的 Intent 对象。然而，代码并没有指定\
  \ Intent 的类名，而是使用 `ACTION_VIEW` 选项指示意图的性质（向用户显示某些内容）。Intent 对象还包含一个包含显示的 URL 的 `URI`。这告诉\
  \ Android Intent 解析系统该 Activity 正请求显示网页。然后通过调用 `startActivity()` 方法发布 Intent。\n\n\
  在模拟器或物理设备上编译并运行应用程序，运行后点击 Show Page 按钮。点击后，应该出现浏览器视图并加载指定的网页。隐式意图现在已成功执行。\n\n###\
  \ 55.4 添加第二个匹配的 Activity\n\n本章的剩余部分将演示设备上安装了多个匹配隐式意图要求的 Activity 时的效果。为了实现这一点，将创建并安装第二个应用程序。首先在\
  \ Android Studio 中创建一个新项目，应用程序名称设置为 `MyWebView`，使用与本章之前创建 `ImplicitIntent` 项目时相同的\
  \ SDK 配置选项，并再次选择 Empty Views Activity。\n\n如果你有一个用于托管 Digital Asset Links 文件的网站并想尝试自动验证，在指定包名时使用你的网站\
  \ URL。例如，如果你的网站托管在 www.mycompany.com，则包名需要设置为如下：\n\n`com.mycompany.mywebview`\n\n\
  如果你没有网站或不计划使用自动验证，使用以下包名：\n\n`com.ebookfrenzy.mywebview`\n\n点击 Finish 创建项目，然后将项目转换为使用\
  \ view bindings。\n\n### 55.5 在 UI 中添加 Web View\n\n\n\n\n新 `MyWebView` 项目中包含的唯一 Activity\
  \ 用户界面将由一个 Android `WebView` 组件实例组成。在项目（Project）工具窗口中，找到 `activity_main.xml` 文件，该文件包含该\
  \ Activity 的界面描述，双击它将其加载到布局编辑器（Layout Editor）工具中。\n\n在设计（Design）模式下的布局编辑器中，选择默认的\
  \ `TextView` 组件，并使用键盘删除键将其从布局中移除。\n\n从调面板（Palette）的部件部分将 `WebView` 对象拖放到现有的 `ConstraintLayout`\
  \ 上，如图 55-2 所示：\n\n![](img/as_3.5_implicit_intent_webview_ui.jpg)\n\n图 55-2\n\n\
  在继续之前，将 `WebView` 实例的 ID 更改为 `webView1`并使用推断约束（Infer constraints）按钮添加任何缺失的约束。\n\n\
  ### 55.6 获取 Intent URL\n\n当创建隐式意图（implicit intent）对象来显示浏览器窗口时，网页 URL 将封装在意图对象中的\
  \ `Uri` 对象内。`MainActivity` 类中 `onCreate()` 方法的任务是从意图对象中提取此 `Uri`，将其转换为 URL 字符串并将其赋值给\
  \ `WebView` 对象。为了实现此功能，请修改 `MainActivity.java` 文件使其读取如下：\n\n```java\npackage com.ebookfrenzy.mywebview;\n\
  \n.\n\n.\n\nimport java.net.URL;\n\nimport android.net.Uri;\n\nimport android.content.Intent;\n\
  \nimport android.webkit.WebView;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n.\n\n.\n        handleIntent();\n    }\n\
  \n    private void handleIntent() {\n        Intent intent = getIntent();\n    \
  \    Uri data = intent.getData();\n        URL url = null;\n        try {\n    \
  \        url = new URL(data.getScheme(),\n                          data.getHost(),\n\
  \                          data.getPath());\n        } catch (Exception e) {\n \
  \           e.printStackTrace();\n        }\n        binding.webView1.loadUrl(url.toString());\n\
  \    }\n}\n```\n\n添加到 `onCreate()` 方法中的新代码执行了以下任务：\n- 获取导致此 Activity 启动的 intent\
  \ 引用\n- 从 intent 对象中提取 `Uri` 数据\n- 将 `Uri` 数据转换为 `URL` 对象\n- 将 `URL` 加载到视图中，在此过程中将\
  \ `URL` 转换为 `String`\n\n`MyWebView` 项目的代码部分现在已完成。剩下的工作是修改 manifest 文件。\n\n### 55.7\
  \ 修改 MyWebView 项目 Manifest 文件\n\n在测试之前，必须对 `MyWebView` 的 manifest 文件进行多项更改。首先，该\
  \ Activity 将需要访问互联网的权限（因为将需要加载网页）。这通过在 manifest 文件中添加适当的权限行来实现：\n\n```xml\n<uses-permission\
  \ android:name=\"android.permission.INTERNET\" />\n```\n\n此外，对 `MyWebView` 项目的 `AndroidManifest.xml`\
  \ 文件中意图过滤器（intent filter）部分内容的审查将揭发现以下设置：\n\n```xml\n<intent-filter>\n    <action\
  \ android:name=\"android.intent.action.MAIN\" />\n    <category android:name=\"\
  android.intent.category.LAUNCHER\" />\n</intent-filter>\n```\n\n在上述 XML 中，`android.intent.action.MAIN`\
  \ 条目表示在没有数据输入的情况下启动时，此 Activity 是应用程序的入口点——而 `android.intent.category.LAUNCHER`\
  \ 指令表示该 Activity 应列在设备的应用程序启动器屏幕上。\n\n由于该 Activity 不需要作为应用程序的入口启动，在没有数据输入（在此情况下为\
  \ URL）的情况下无法运行，且不需要出现在启动器中，因此此 Activity 的 manifest 文件不需要 `MAIN` 或 `LAUNCHER` 指令。\n\
  \n然而，需要修改 `MainActivity` Activity 的意图过滤器，以指示它能够处理针对 HTTP 数据方案的 `ACTION_VIEW` 意图动作。\n\
  \nAndroid 还要求处理不包含 `MAIN` 和 `LAUNCHER` 条目的隐式意图的 Activity 在意图过滤器中包含所谓的可浏览（browsable）和默认（default）类别。因此，修改后的意图过滤器应如下，其中\
  \ `<website url>` 被替换为您的地址或 `www.ebookfzy.com`，取决于您创建 `MyWebView` 项目时使用的包名：\n\n\
  ```xml\n<intent-filter autoVerify=\"true\">\n    <action android:name=\"android.intent.action.VIEW\"\
  \ />\n    <category android:name=\"android.intent.category.BROWSABLE\" />\n    <category\
  \ android:name=\"android.intent.category.DEFAULT\" />\n    <data android:scheme=\"\
  https\" />\n    <data android:host=\"<website url\"/>\n</intent-filter>\n```\n\n\
  汇总这些要求后得到了以下完整的 `AndroidManifest.xml` 文件：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookrenzy.mywebview\">\n    <uses-permission android:name=\"\
  android.permission.INTERNET\" />\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.MyWebView\">\n        <activity\n \
  \           android:name=\".MainActivity\"\n            android:exported=\"true\"\
  >\n            <intent-filter autoVerify=\"true\">\n                <action android:name=\"\
  android.intent.action.VIEW\" />\n                <category android:name=\"android.intent.category.BROWSABLE\"\
  \ />\n                <category android:name=\"android.intent.category.DEFAULT\"\
  \ />\n                <data android:scheme=\"https\" />\n                <data android:host=\"\
  <website url\"/>\n            </intent-filter>\n        </activity>\n    </application>\n\
  </manifest>\n```\n\n通过双击项目窗口中的文件名将 `AndroidManifest.xml` 文件加载到 manifest 编辑器。加载后，按照上述更改修改\
  \ XML，记得输入正确的网站 URL。\n\n修改 manifest 文件后，新 Activity 已准备好安装。\n\n### 55.8 在设备上安装 MyWebView\
  \ 包\n\n在 `MyWebView` 主 Activity 作为隐式意图接收者之前，必须将其安装到设备上。这通过正常方式运行应用程序来实现。由于 manifest\
  \ 文件不包含 `android.intent.action.MAIN` 和 `android.intent.category.LAUNCHER` 设置，必须指示\
  \ Android Studio 只安装不启动。要配置此行为，请选择工具栏上的 app -> Edit configurations… 菜单，如图 55-3 所示：\n\
  \n![](img/as_edit_configurations.jpg)\n\n图 55-3\n\n在 Run/Debug Configurations 对话框中，将位于\
  \ Launch Options 部分的 Launch 选项更改为 `Nothing`，然后点击 Apply 后点击 OK：\n\n![](img/as_launch_options.jpg)\n\
  \n图 55-4\n\n配置好此设置后，正常运行程序。注意应用已安装但尚未启动。\n\n### 55.9 测试应用程序\n\n在安装 `MyWebView` 应用后，重新运行\
  \ `ImplicitIntent` 并点击 Show Web Page 按钮。注意网页仍然加载到 Chrome 浏览器中，而不是 `MyWebView` 应用的主\
  \ Activity。这是因为 `MyWebView` Activity 尚未验证或启用打开启动意图中包含的链接。必须在 `enableLink()` 方法中添加一些代码来手动启用链接。\n\
  \n### 55.10 手动启用链接\n\n\n\n\n\n在 `enableLink()` 方法中，我们需要创建并启动一个意图以显示 MyWebView 应用的“默认打开”设置界面。将\
  \ `MainActivity.java` 文件加载到代码编辑器并修改 `enableLink()` 方法，使其内容如下，确保将 `<reverse domain>`\
  \ 替换为 `com.ebookfrenzy` 或你自己的反向域名（具体取决于你在创建 MyWebView 项目时选择的包名）：\n\n```java\nimport\
  \ android.provider.Settings;\n\npublic void enableLink(View view) {\n    Intent\
  \ intent = new Intent(\n            Settings.ACTION_APP_OPEN_BY_DEFAULT_SETTINGS,\n\
  \            Uri.parse(\"package:<reverse domain>.mywebview\"));\n    startActivity(intent);\n\
  }\n```\n\n重新运行 ImplicitIntent 应用并点击 `Enable Link` 按钮，显示 MyWebView 应用的“默认打开”设置界面：\n\
  \n![](img/as_implicit_intent_open_by_default.jpg)\n图 55-5\n\n点击 `Add Link` 按钮（上方标记为\
  \ A），启用你 URL 旁边的选框，并点击 `Add` 按钮：\n\n![](img/as_implicit_intent_add_link.jpg)\n图\
  \ 55-6\n\n在点击返回箭头（在上方 图 55-5 中标记为 B）返回 ImplicitIntent 应用之前，先确认该链接现在已列为受支持状态。点击 `Open\
  \ Web Page` 现在应该将页面加载到 MyWebView 应用中，而不是 Chrome 浏览器：\n\n![](img/as_mywebview_running.jpg)\n\
  图 55-7\n\n### 55.11 自动链接验证\n\n如果你选择使用自己的网站 URL 作为 MyWebView 的包名，现在可以执行使用自动链接验证的额外步骤。首先，从你测试的设备或模拟器上卸载\
  \ MyWebView 应用。在网站上放置 Digital Asset Links 文件后，我们将重新安装应用以触发验证过程。\n\n按照标题为 Android\
  \ Intent 概览的章节概述概述步骤，找到你的 `debug.keystore` 文件，并使用 `keytool` 工具如下获取你的 SHA-256 证书指纹：\n\
  \n```bash\nkeytool -list -v -keystore <path to debug.keystore file here>\n```\n\n\
  接下来，在网页浏览器中打开以下页面：\n\nhttps://developers.google.com/digital-asset-links/tools/generator\n\
  \n页面加载后，在 Hosting site domain 字段中输入你的网站 URL，使用 `com.<domain here>.mywebview` 作为\
  \ App 包名，并将你的 SHA-256 指纹输入到 App package fingerprint (`SHA256`) 字段：\n\n![](img/as_implicit_intent_link_generator.jpg)\n\
  图 55-8\n\n点击 `Generate` 语句按钮显示生成的语句，并将其放置在名为 `assetlinks.json` 的文件中，位于 Web 服务器上名为\
  \ `.well-known` 的文件夹中。返回生成器页面并点击 `Test statement` 按钮，以验证文件是否有效且位置正确。\n\n假设测试成功，我们准备好尝试应用链接了，在你的设备或模拟器上重新安装\
  \ MyWebView 应用，并使用 `Settings` 应用导航到 MyWebView 的“默认打开”页面。该页面应该指示链接已通过验证：\n\n![](img/as_implicit_intent_verified.jpg)\n\
  图 55-9\n\n再次运行 ImplicitIntent 应用，点击 `Open Web Page` 按钮，并验证页面内容出现在 MyWebView 应用中而非\
  \ Chrome 浏览器。\n\n### 55.12 总结\n\n隐式意图（Implicit intents）提供了一种机制，一个活动可以通过指定操作类型以及可选的执行该操作的数据，来请求另一个活动的服务。然而，要成为隐式意图的目标候选，活动必须配置为从传入的意图对象中提取适当的数据，并包含在配置正确的清单文件中，包括适当的权限和意图过滤器（intent\
  \ filters）。包含目标活动的应用必须通过 Digital Asset Links 文件进行验证，或由用户手动启用。\n\n在本章中，创建了一个示例来演示隐式意图的发布、能够处理此类意图的示例活动的创建，以及链接验证过程。\n\
  \n### 56. Android 广播意图和广播接收器\n\n除了提供启动应用活动的机制外，意图还用于向系统上的其他组件广播系统级消息。这涉及广播意图（Broadcast\
  \ Intents）和广播接收器（Broadcast Receivers）的实现，两者都是本章的主题。\n\n#### 56.1 广播意图概览\n\n广播意图是\
  \ `Intent` 对象，通过调用 `Activity` 类的 `sendBroadcast()`、`sendStickyBroadcast()` 或 `sendOrderedBroadcast()`\
  \ 方法进行广播（后者用于需要从广播获取结果的情况）。除了在应用组件之间提供消息和事件系统外，广播意图还被 Android 系统用于通知感兴趣的应用有关关键系统事件（例如外部电源连接或耳机的插入或拔出）。\n\
  \n当创建广播意图时，它必须包含一个操作字符串（action string）、可选数据以及一个类别字符串（category string）。与标准意图一样，数据使用意图对象的\
  \ `putExtra()` 方法结合键值对被添加到广播意图中。可选的类别字符串可以通过调用 `addCategory()` 方法分配给广播意图。\n\n用于标识广播事件的操作字符串必须是唯一的，且通常使用包名。例如，以下代码段创建并发送了一个广播意图，其中包含一个\
  \ action 动作和数据：\n\n```java\nIntent intent = new Intent();\nintent.setAction(\"com.example.Broadcast\"\
  );\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n```\n\n上述代码在 3.0\
  \ 之前的 Android 设备上可以成功启动相应的广播接收器。然而，在较新版本的 Android 上，广播接收器将接收不到意图。这是因为 Android 3.0\
  \ 引入了启动控制安全措施，防止停止状态的应用被启动。如果应用程序刚刚安装且尚未启动过或被用户手动停止，则被认为处于停止状态。然而，为了解决这个问题，可以在发送意图之前添加一个标记，指示该意图是要启动已停止应用的组件。该标记是\
  \ `FLAG_INCLUDE_STOPPED_PACKAGES`，如下所示代码段的适配方式使用：\n\n```java\nIntent intent = new\
  \ Intent();\nintent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\nintent.setAction(\"\
  com.example.Broadcast\");\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n\
  ```\n\n#### 56.2 广播接收器概览\n\n应用通过注册广播接收器来监听特定的广播意图。广播接收器通过扩展 Android `BroadcastReceiver`\
  \ 类并重写 `onReceive()` 方法来实现。广播接收器可以在代码或清单文件中注册。注册实现的一部分包括创建意图过滤器（intent filters），以指示接收器需要监听的特定广播意图。这是通过引用广播意图的操作字符串来实现的。\n\
  \n需要注意的是，广播接收器不需要持续运行。当检测到匹配的意图时，Android 运行时系统会在调用 `onReceive()` 方法之前自动启动广播接收器。\n\
  \n以下代码出一个广播接收器子类：\n\n```java\npackage com.example.broadcastdetector;\n```\n\n\n\n\
  \n\n```java\nimport android.content.BroadcastReceiver;\n\nimport android.content.Context;\n\
  import android.content.Intent;\n\npublic class MyReceiver extends BroadcastReceiver\
  \ {\n    public MyReceiver() {\n\n    }\n\n    @Override\n    public void onReceive(Context\
  \ context, Intent intent) {\n        // Implement code here to be performed when\n\
  \        // broadcast is detected\n    }\n}\n```\n\n在清单文件中注册广播接收器时，必须为该接收器添加一个 `<receiver>`\
  \ 条目。\n\n下面的清单文件示例注册了上述广播接收器：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.example.broadcastdetector.broadcastdetector\"\n    android:versionCode=\"\
  1\"\n    android:versionName=\"1.0\" >\n    <uses-sdk android:minSdkVersion=\"17\"\
  \ />\n    <application\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"\
  @string/app_name\" >\n        <receiver android:name=\"MyReceiver\" >\n        </receiver>\n\
  \    </application>\n</manifest>\n```\n\n在 Android 8.0 之前的版本上运行时，与接收器相关的关联过滤器（intent\
  \ filters）可以放在清单文件中的接收器元素中，如下所示：\n\n```xml\n<receiver android:name=\"MyReceiver\"\
  \ >\n    <intent-filter>\n        <action android:name=\"com.example.Broadcast\"\
  \ >\n        </action>\n    </intent-filter>\n</receiver>\n```\n\n在 Android 8.0\
  \ 或更高版本上，必须在代码中使用 `Activity` 类的 `registerReceiver()` 方法，结合适当配置的 `IntentFilter` 对象来注册接收器：\n\
  \n```java\nIntentFilter filter = new IntentFilter(\"com.example.Broadcast\");\n\
  MyReceiver receiver = new MyReceiver();\nregisterReceiver(receiver, filter);\n```\n\
  \n当在代码中注册的广播接收器不再需要时，可以通过调用活动类的 `unregisterReceiver()` 方法来注销它，并将接收器对象的引用作为参数传递。例如，以下代码将注销上述广播接收器：\n\
  \n```java\nunregisterReceiver(receiver);\n```\n\n必须记住，某些系统广播意图只有在代码中注册而非清单文件中注册时才能被广播接收器检测。请检查\
  \ Android `Intent` 类文档，在线查看系统广播意图及相应要求的详细概述：\n\n`https://developer.android.com/reference/android/content/Intent`\n\
  \n## 56.3 从广播获取结果\n\n当使用 `sendBroadcast()` 方法发送广播意图时，发起活动（activity）无法从任何接收该广播的广播接收器处获取结果。如果需要返回结果，则必须使用\
  \ `sendOrderedBroadcast()` 方法。当使用此方法发送广播意图时，它将按顺序传递给每个已注册感兴趣的广播接收器。\n\n`sendOrderedBroadcast()`\
  \ 方法接受多个参数，包括指向另一个广播接收器的引用（称为结果接收器，result receiver），当所有其他广播接收器都处理完意图后将通知它，同时以及一组数据引用，这些接收器可以将结果数据存放在其中。当所有广播接收器都获得了处理广播的机会后，结果接收器的\
  \ `onReceive()` 方法将被调用并传递结果数据。\n\n## 56.4 粘性广播意图（Sticky Broadcast Intents）\n\n默认情况下，广播意图一旦发送并被感兴趣的广播接收器处理后就会消失。然而，可以将广播意图定义为“粘性”。粘性意图及其包含的数据在完成执行后仍保留在系统中。可以通过调用\
  \ `registerReceiver()` 方法（使用通常参数：广播接收器引用和意图过滤器对象引用）的返回值来获取粘性广播意图中存储的数据。许多 Android\
  \ 系统广播都是粘性的，一个典型的例子是与电池电量状态相关的广播。\n\n可以通过调用 `removeStickyBroadcast()` 方法随时移除粘性广播，并将要移除的广播意图引用作为参数传递。\n\
  \n## 56.5 广播意图示例\n\n本章的剩余部分将通过手实现一个基于 Android Studio 的广播意图运行示例。在第一个实例中，将创建一个简单的应用程序来发送自定义广播意图。随后，将创建一个相应的广播接收器，以便在检测到广播时在\
  \ Android 设备的屏幕上显示消息。最后，将修改广播接收器以检测系统关于外部电源已从设备断开的通知。\n\n## 56.6 创建示例应用程序\n\n从欢迎界面选择“New\
  \ Project”（新建项目）选项，在新项目对话框中选择“Empty Views Activity”（空视图活动）。在 Name（名称）字段输入 `SendBroadcast`，并指定\
  \ `com.ebookrenzy.sendbroadcast` 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level（最低 API\
  \ 级别）更改为 `26: Android 8.0 (Oreo)`，并将语言设置为 Java。\n\n一旦创建了新项目，找到并加载位于 `res -> layout`\
  \ 的 `activity_main.xml` 布局文件，并在布局器的 Design（设计）模式下，将 `TextView` 对象替换为 `Button` 视图并设置文本属性使其显示为“Send\
  \ Broadcast”。设置文本值后，按照通常步骤将字符串提取到名为 `send_broadcast` 的资源。\n\n在布局中仍选中按钮的情况下，在 Attributes（属性）面板中找到\
  \ `onClick` 属性，并配置其调用名为 `broadcastIntent` 的方法。\n\n## 56.7 创建并发送广播意图\n\n在创建了 SendBroadcast\
  \ 应用程序框架后，现在是实现发送广播意图代码了。这涉及实现之前作为 Button 视图 `onClick` 目标的 `broadcastIntent()` 方法。找到并双击\
  \ `MainActivity.java` 文件，修改它以添加创建和发送广播意图的代码。修改后，该类的源代码应如下：\n\n```java\npackage com.ebookrenzy.sendbroadcast;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.content.Intent;\nimport android.view.View;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    public void broadcastIntent(View view) {\n  \
  \      Intent intent = new Intent();\n        intent.setAction(\"com.ebookrenzy.sendbroadcast\"\
  );\n        intent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\n        sendBroadcast(intent);\n\
  \    }\n}\n```\n\n注意，在此实例中，意图的操作字符串为 `com.ebookrenzy.sendbroadcast`。在本章后续章节创建广播接收器类时，过滤器过滤器必须匹配此操作字符串。\n\
  \n发送广播意图应用程序的创建结束。剩下的就是构建匹配的广播接收器。\n\n## 56.8 创建广播接收器\n\n要创建广播接收器，需要创建一个子类 `BroadcastReceiver`。在\
  \ Project 工具窗口中导航到 `app -> java` 并右键点击包名。从弹出的菜单中选择 New -> Other -> Broadcast Receiver，将类命名为\
  \ `MyReceiver`，并勾选 `Exported`（导出）和 `Enabled`（启用）选项。这些设置允许 Android 系统在需要时启动接收器，并确保该类能够接收来自其他应用程序的消息。配置好类后，点击\
  \ Finish。\n\n\n\n\n一旦创建，Android Studio 将自动将新的 `MyReceiver.java` 类文件加载到编辑器中，其内容如下：\n\
  \n```java\npackage com.ebookfrenzy.sendbroadcast;\n\nimport android.content.BroadcastReceiver;\n\
  \nimport android.content.Context;\nimport android.content.Intent;\n\npublic class\
  \ MyReceiver extends BroadcastReceiver {\n    @Override\n    public void onReceive(Context\
  \ context, Intent intent) {\n        // TODO: 此方法在 BroadcastReceiver 接收到\n     \
  \   // Intent 广播时被调用。\n        throw new UnsupportedOperationException(\"Not yet\
  \ implemented\");\n    }\n}\n```\n\n如所示，Android Studio 为新类生成了一个模板并为 `onReceive()`\
  \ 方法生成了一个存根。现在需要对类进行一些更改以实现所需的行为。因此，在 `MyReceiver.java` 文件中，修改代码使其内容如下：\n\n```java\n\
  package com.ebookfrenzy.sendbroadcast;\n\nimport android.content.BroadcastReceiver;\n\
  import android.content.Context;\nimport android.content.Intent;\nimport android.widget.Toast;\n\
  \npublic class MyReceiver extends BroadcastReceiver {\n    @Override\n    public\
  \ void onReceive(Context context, Intent intent) {\n        // TODO: 此方法在 BroadcastReceiver\
  \ 接收到\n        // Intent 广播时被调用。\n        throw new UnsupportedOperationException(\"\
  Not yet implemented\");\n        Toast.makeText(context, \"Broadcast Intent Detected.\"\
  , Toast.LENGTH_LONG).show();\n    }\n}\n```\n\n广播接收器的代码现在已经完成。\n\n## 56.9 注册广播接收器\n\
  \n项目需要公开广播接收器的存在，并且必须包含一个意图过滤器（intent filter），以指定该接收器感兴趣的广播意图。当在上一节创建 `BroadcastReceiver`\
  \ 类时，Android Studio 自动在清单文件中添加了 `<receiver>` 元素。因此，剩下的工作是在 `MainActivity.java` 文件中添加代码以创建一个意图过滤器并注册接收器：\n\
  \n```java\npackage com.ebookfrenzy.sendbroadcast;\n\n...\nimport android.content.BroadcastReceiver;\n\
  import android.content.IntentFilter;\n...\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    BroadcastReceiver receiver;\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        configureReceiver();\n    }\n    private void configureReceiver() {\n \
  \       IntentFilter filter = new IntentFilter();\n        filter.addAction(\"com.ebookfrenzy.sendbroadcast\"\
  );\n        receiver = new MyReceiver();\n        registerReceiver(receiver, filter);\n\
  \    }\n}\n```\n\n当广播接收器不再需要时将其取消注销也是非常重要的：\n\n```java\n@Override\nprotected void\
  \ onDestroy() {\n    super.onDestroy();\n    unregisterReceiver(receiver);\n}\n\
  ```\n\n## 56.10 测试广播示例\n\n要测试广播发送器和接收器，请设备或 AVD 上运行 `SendBroadcast` 应用并等待其出现。运行后，点击按钮，此时“Broadcast\
  \ Intent Detected.”的 toast 消息将弹出几秒钟然后消失。\n\n## 56.11 监听系统广播\n\n此示例的最后阶段是修改广播接收器的意图过滤器，以监听当外部电源从设备断开时系统广播的系统意图。该操作是\
  \ `android.intent.action.ACTION_POWER_CONNECTED`。修改 `MainActivity.java` 文件中的 `configureReceiver()`\
  \ 方法以添加此过滤器：\n\n```java\nprivate void configureReceiver() {\n    IntentFilter filter\
  \ = new IntentFilter();\n    filter.addAction(\"com.ebookfrenzy.sendbroadcast\"\
  );\n    filter.addAction(\"android.intent.action.ACTION_POWER_CONNECTED\");\n  \
  \  receiver = new MyReceiver();\n    registerReceiver(receiver, filter);\n}\n```\n\
  \n由于 `MyReceiver.java` 文件中的 `onReceive()` 方法现在将监听两种广播意图，因此最好修改代码将当前意图的动作字符串也显示在\
  \ toast 消息中。此字符串可以通过调用作为参数传递给 `onReceive()` 方法的 `intent`对象的 `getAction()` 方法获得：\n\
  \n```java\npublic void onReceive(Context context, Intent intent) {\n    String message\
  \ = \"Broadcast intent detected \" + intent.getAction();\n    Toast.makeText(context,\
  \ message, Toast.LENGTH_LONG).show();\n}\n```\n\n通过重新安装修改后的 `SendBroadcast` 包来测试接收器。现在点击\
  \ `SendBroadcast` 应用程序按钮会导致包含自定义动作字符串的新消息：`Broadcast intent detected com.ebookfrenzy.sendbroadcast`。\n\
  \n接下来，移除当前为 Android 设备供电的 USB 连接器，此时接收器应在 toast 消息中报告以下内容（消息在竖屏的设备上可能会被截断）。如果应用在模拟器上运行，请显示扩展控制，选择\
  \ `Battery` 选项并将充电器连接设置为 None：\n\n`Broadcast intent detected android.intent.action.ACTION_POWER_CONNECTED`\n\
  \n为了避免每次设备断开电源时都出现此消息，请启动 `Settings` 应用并选择 `Apps` 选项。从列表中选择 `SendBroadcast` 应用并点击\
  \ `Uninstall` 按钮。\n\n## 56.12 总结\n\n广播意图是一种机制，通过它可以发布意图供 Android 系统上的多个组件消费。广播通过注册\
  \ `Broadcast Receiver` 来检测到，而接收器反过来被配置为监听匹配特定动作字符串的意图。\n\n\n\n\n实现客户端组件与绑定服务之间交互有两种推荐的机制。假设绑定服务是本地的，且与客户端组件属于同一个应用程序（换句话说，它运行在同一个进程中，并且对其他应用程序中的组件不可用）。在这种情况下，推荐的方法是创建一个\
  \ `Binder` 类的子类并扩展它以为服务提供接口。随后通过 `onBind()` 方法返回该 `Binder` 对象的实例，并由客户端组件使用该实例直接访问服务中持有的方法和数据。\n\
  \n当绑定服务不是应用程序本地的（换句话说，它运行在与客户端组件不同的进程中）时，最佳交互方式是使用 `Messenger/Handler` 实现。\n\n在本章的剩余部分，将创建一个示例，以演示创建、启动以及与本地私有绑定服务交互涉及的步骤。\n\
  \n## 57.3 本地绑定服务示例\n\n在本章剩余部分创建的示例应用程序将由一个 activity 和一个绑定服务组成。绑定服务的目的是从系统获取当前时间并将该信息返回给\
  \ activity，在 activity 中将其显示给用户。该绑定服务将与 activity 属于同一个应用程序，是本地且私有的。\n\n从欢迎界面选择 `New\
  \ Project`（新建项目）选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在\
  \ `Name` 字段输入 `LocalBound` 并指定 `com.ebookfrenzy.localbound` 为包名。在点击 `Finish` 按钮之前，将\
  \ `Minimum API level`（最低 API 级别）设置改为 `API 26: Android 8.0 (Oreo)`，并将 `Language`（语言）菜单设置为\
  \ `Java`。使用 11.8 迁移项目到 View Binding 部分中的步骤将项目迁移到 view binding。\n\n项目创建完成后，下一步是添加一个新类作为绑定服务。\n\
  \n## 57.4 向项目添加绑定服务\n\n要向项目添加新类，请在 Project 工具窗口中，右键点击包名（位于 `app -> java -> com.ebookfrenzy.localbound`\
  \ 下），选择 `New -> Service -> Service` 菜单选项。指定 `BoundService` 为类名，并在点击 `Finish` 创建类之前，确保勾选了\
  \ `Exported`（导出）和 `Enabled`（启用）选项。Android Studio 将将 `BoundService.java` 文件加载到编辑器中，其内容如下：\n\
  \n```java\npackage com.ebookfrenzy.localbound;\n\nimport android.app.Service;\n\n\
  import android.content.Intent;\n\nimport android.os.IBinder;\n\npublic class BoundService\
  \ extends Service {\n\n    public BoundService() {\n\n    }\n\n    @Override\n \
  \   public IBinder onBind(Intent intent) {\n        // TODO: 向服务返回通信通道。\n      \
  \  throw new UnsupportedOperationException(\"Not yet implemented\");\n    }\n}\n\
  ```\n\n## 57.5 实现 Binder\n\n如前所述，本地绑定服务可以通过向客户端传递配置适当的 `Binder` 对象来与绑定客户端进行通信。这是通过在绑定服务类内部创建一个\
  \ `Binder` 子类，并通过添加一个或多个客户端可以调用的新方法来扩展的。这通常涉及实现一个返回绑定服务实例引用的方法。有了该实例的引用，客户端就可以直接访问绑定服务的数据并调用方法。\n\
  \n对于此示例，需要对上一节创建的模板类 `BoundService` 进行一些更改。首先，需要声明一个 `Binder` 子类。该类将包含一个名为 `getService()`\
  \ 的方法，该方法将返回当前服务对象实例的引用（由 `this` 关键字表示）。考虑到这些要求，编辑 `BoundService.java` 文件并修改如下：\n\
  \n```java\npackage com.ebookfrenzy.localbound;\n\nimport android.app.Service;\n\n\
  import android.content.Intent;\n\nimport android.os.IBinder;\n\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n\n    private final IBinder myBinder\
  \ = new MyLocalBinder();\n\n    public BoundService() {\n\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n        // TODO: 向服务返回通信通道。\n     \
  \   throw new UnsupportedOperationException(\"Not yet implemented\");\n    }\n\n\
  \    public class MyLocalBinder extends Binder {\n        BoundService getService()\
  \ {\n            return BoundService.this;\n        }\n    }\n}\n```\n\n对类进行更改后，值得花一点时间回顾一下这里执行的步骤。首先，声明了一个新的\
  \ `Binder` 子类（命名为 `MyLocalBinder`）。该类包含一个方法，用于返回 `BoundService` 类当前实例的引用。创建 `MyLocalBinder`\
  \ 类的新实例并将其赋值给 `myBinder` `IBinder` 引用（由于 `Binder` 是 `IBinder` 的子类，因此此类赋值不存在类型不匹配）。\n\
  \n接下来，需要修改 `onBind()` 方法以返回 `myBinder` 对象的引用，并实现一个新的公共方法，以便在任何绑定到服务的客户端调用它时返回当前时间：\n\
  \n```java\npackage com.frenzy.localbound;\nimport java.text.SimpleDateFormat;\n\
  import java.util.Date;\nimport java.util.Locale;\nimport android.app.Service;\n\
  import android.content.Intent;\nimport android.os.IBinder;\nimport android.os.Binder;\n\
  public class BoundService extends Service {\n    private final IBinder myBinder\
  \ = new MyLocalBinder();\n    public BoundService() {\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n        return myBinder;\n    }\n\n\
  \    public String getCurrentTime() {\n        SimpleDateFormat dateformat =\n \
  \           new SimpleDateFormat(\"HH:mm:ss MM/dd/yyyy\",\n            Locale.US);\n\
  \        return dateformat.format(new Date());\n    }\n\n    public class MyLocalBinder\
  \ extends Binder {\n        BoundService getService() {\n            return BoundService.this;\n\
  \        }\n    }\n}\n```\n\n在此处，绑定服务已完成，并准备好添加到项目清单文件中。在 Project 工具窗口中找到并双击 `LocalBound`\
  \ 项目的 `AndroidManifest.xml` 文件，一旦加载到 Manifest 编辑器，请验证 Android Studio 是否已为服务添加了如下\
  \ `<service>` 条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.localbound\"\
  >\n    <application\n        android:allowBackup=\"true\"\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\n        android:theme=\"\
  @style/AppTheme\" >\n        <service\n            android:name=\".BoundService\"\
  \n            android:enabled=\"true\"\n            android:exported=\"true\" >\n\
  \        </service>\n        <activity\n            android:name=\".MainActivity\"\
  \ >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n## 57.6 将客户端绑定到服务\n\n此阶段是在 activity 中编写代码以绑定服务并调用 `getCurrentTime()` 方法。\n\
  \n如前所述，为了成功绑定到服务并接收服务 `onBind()` 方法返回的 `IBinder` 对象，有必要创建一个 `ServiceConnection`\
  \ 子类并实现 `onServiceConnected()` 和 `onServiceDisconnected()` 回调方法。编辑 `MainActivity.java`\
  \ 文件并修改如下：\n\n```java\npackage com.ebookfrenzy.localbound;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  ```\n\n\n\n\n\n```java\nimport android.os.Bundle;\nimport android.os.IBinder;\n\
  import android.content.Context;\nimport android.content.Intent;\nimport android.content.ComponentName;\n\
  import android.content.ServiceConnection;\nimport com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    BoundService myService;\n\
  \    boolean isBound = false;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    final private ServiceConnection myConnection = new ServiceConnection()\n\
  \    {\n        @Override\n        public void onServiceConnected(ComponentName\
  \ className,\n                                         IBinder service) {\n    \
  \        MyLocalBinder binder = (MyLocalBinder) service;\n            myService\
  \ = binder.getService();\n            isBound = true;\n        }\n        @Override\n\
  \        public void onServiceDisconnected(ComponentName name) {\n            isBound\
  \ = false;\n        }\n    };\n}\n```\n\n当客户端成功绑定到服务时，将调用 `onServiceConnected()`\
  \ 方法。该方法将服务的 `onBind()` 方法返回的 `IBinder` 对象作为参数传递。该参数被强制转换为 `MyLocalBinder` 类型的对象。然后，调用绑定器对象的\
  \ `getService()` 方法来获取服务实例的引用，随后将其赋值给 `myService`。一个布尔标志位表示连接已成功建立。\n\n当连接结束时，会调用\
  \ `onServiceDisconnected()` 方法，并将布尔标志设置为 `false`。\n\n建立连接后，下一步是修改活动以绑定到该服务。这涉及到创建一个\
  \ `intent` 并调用 `bindService()` 方法，这些操作可以在传入的 `onCreate()` 方法中执行：\n\n```java\n@Override\n\
  public void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n    Intent intent = new Intent(this,\
  \ BoundService.class);\n    bindService(intent, myConnection, Context.BIND_AUTO_CREATE);\n\
  }\n```\n\n### 57.7 完成示例\n\n剩下的工作是添加一种机制来调用 `getCurrentTime()` 方法并将结果显示给用户。按照现在的惯例，Android\
  \ Studio 已经为该活动创建了一个 `activity_main.xml` 文件，其中仅包含一个 `TextView`。将此文件加载到布局编辑器工具中，并使用设计模式选择\
  \ `TextView` 组件并将 ID 更改为 `myTextView`。在 `TextView` 下添加一个 `Button` 视图，并将按钮上的文本改为“Show\
  \ Time”，将文本提取到名为 `show_time` 的字符串资源中。完成这些更改后，布局应该类似于图 57-1 所示。如果缺少任何约束，点击布局编辑器工具栏中的“推断约束”（Infer\
  \ Constraints）按钮。\n\n![](img/as_local_bound_ui.jpg)\n\n图 57-1\n\n通过选择 `Button` 并配置\
  \ `onClick` 属性调用名为 `showTime` 的方法来完成用户界面设计。\n\n最后，编辑 `MainActivity.java` 文件代码以实现\
  \ `showTime()` 方法。该方法调用服务的 `getCurrentTime()` 方法（得益于 `onServiceConnected()` 方法，现在可以通过\
  \ `myService` 引用从活动内部访问），并将生成的字符串赋值给 `TextView`：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  \n.\n\nimport android.widget.TextView;\nimport com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    BoundService myService;\n\
  \    boolean isBound = false;\n\n    public void showTime(View view)\n    {\n  \
  \      String currentTime = myService.getCurrentTime();\n        TextView myTextView\
  \ = findViewById(R.id.myTextView);\n        myTextView.setText(currentTime);\n \
  \   }\n}\n```\n\n### 57.8 测试应用程序\n\n代码完成后，运行应用程序，点击按钮并注意文本显示了当前时间。\n\n### 57.9 总结\n\
  \n当绑定服务是本地且私有的时，应用程序内的组件可以通过向客户端返回 IBinder 对象来相互交互。客户端实现 `ServiceConnection` 子类，该子类包含在服务连接和断开连接时调用的回调方法。总而言之，`onBind()`\
  \ 方法向客户端返回一个 `Binder` 实例。\n\n### 58. Android 远程绑定服务 – 示例\n\n在关于 Android 服务的最后一个章节中，将开发一个示例应用程序来演示\
  \ IPC（进程间通信）的使用。\n\n#### 58.1 客户端与远程服务的通信\n\n如上一章所述，客户端与本地服务之间的交互可以通过向客户端返回 IBinder\
  \ 对象来实现。然而，对于远程服务，这种方法是不可通的，因为远程服务运行在不同的进程中，因此无法直接访问。\n\n对于远程服务，必须创建一个 messenger\
  \ 和 handler 配置，以允许消息跨进程边界传递。具体来说，服务会创建一个 `Handler` 实例，当从客户端接收到消息时将调用它。本章创建的示例将由一个运行在单独进程中的活动和一个绑定服务组成。Messenger/Handler\
  \ 机制将向服务发送字符串，该字符串将显示在 Logcat 输出。\n\n#### 58.2 创建示例应用程序\n\n从欢迎界面选择“New Project”（新建项目），在出现的新项目对话框中，选择“Empty\
  \ Views Activity”模板，然后点击“Next”按钮。\n\n在 Name 字段中输入 `RemoteBound` 并指定 `com.ebookfrenzy.remotebound`\
  \ 为包名。在点击“Finish”按钮之前，将 Minimum API 级别设置为 API 26: Android 8.0 (Oreo)，并将 Language\
  \ 菜单设置为 Java。\n\n### 58.3 设计用户界面\n\n在 Project 工具窗口中找到 `activity_main.xml` 文件并双击它将其加载到布局编辑器工具中。在布局编辑器设计模式下，右键点击默认的\
  \ `TextView` 实例，选择“Convert view...”（转换视图）菜单选项，从生成的对话框中选择 `Button` 视图并点击 Apply。将按钮的\
  \ text 属性改为“Send Message”，并将字符串提取到名为 `send_message` 的新资源中。\n\n最后，配置 `onClick` 属性以调用名为\
  \ `sendMessage` 的方法。\n\n#### 58.4 实现远程绑定服务\n\n\n\n\n要实现此示例中的远程绑定服务（remote bound\
  \ service），请在 Project 工具窗口中右键点击包名（位于 `app` -> `java` 下），并选择 `New` -> `Service` ->\
  \ `Service` 菜单项向项目添加新类。将 `RemoteService` 指定为类名，并在点击 `Finish` 创建类之前，确保同时勾选了 `Exported`（导出）和\
  \ `Enabled`（启用）选项。\n\n下一步是为新服务实现处理类（handler class）。这通过扩展 `Handler` 类并实现 `handleMessage()`\
  \ 方法来实现。当从客户端接收到消息时，该方法会被调用。它将接收一个 `Message` 对象作为参数，其中包含客户端需要传递给服务的任何数据。在本例中，这将是一个包含要显示给用户的字符串的\
  \ `Bundle` 对象。实现此功能后，`RemoteService.java` 文件修改后的类应如下：\n\n```java\npackage com.ebookfzy.remotebound;\n\
  \nimport android.app.Service;\nimport android.content.Intent;\nimport android.os.IBinder;\n\
  import android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Looper;\n\
  import android.os.Message;\nimport android.os.Messenger;\nimport android.util.Log;\n\
  \npublic class RemoteService extends Service {\n    public RemoteService() {\n \
  \   }\n\n    static class IncomingHandler extends Handler {\n        String TAG\
  \ = \"RemoteService\";\n        public IncomingHandler() {\n            super(Looper.getMainLooper());\n\
  \        }\n        @Override\n        public void handleMessage(Message msg) {\n\
  \            Bundle data = msg.getData();\n            String dataString = data.getString(\"\
  MyString\");\n            Log.i(TAG, \"Message = \" + dataString);\n        }\n\
  \    }\n\n    @Override\n    public IBinder onBind(Intent intent) {\n        //\
  \ TODO: Return the communication channel to the service.\n        throw new UnsupportedOperationException(\"\
  Not yet implemented\");\n    }\n}\n```\n\n实现处理类后，服务代码剩下的唯一任务是修改 `onBind()` 方法，使其返回一个包含\
  \ `Messenger` 对象的 `IBinder` 对象，而该 `Messenger` 对象又包含对处理器的引用：\n\n```java\nfinal Messenger\
  \ myMessenger = Messenger(new IncomingHandler());\n\n@Override\npublic IBinder onBind(Intent\
  \ intent) {\n    return myMessenger.getBinder();\n}\n```\n\n上述代码段的第一行创建了我们处理类的新实例，并将其传递给新\
  \ `Messenger` 对象的构造函数。在 `onBind()` 方法中，调用了 messenger 对象的 `getBinder()` 方法来返回该 messenger\
  \ 的 `IBinder` 对象。\n\n### 58.5 在 Manifest 文件中配置远程服务\n\n为了准确描述客户端与远程服务之间的通信，有必要配置该服务在应用程序的其他部分独立运行。这通过在清单文件中该服务的\
  \ `<service>` 标签内添加 `android:process` 属性来实现。要启动远程服务，还需要为该服务提供一个意图过滤器（intent filter）。要实现此更改，请修改\
  \ `AndroidManifest.xml` 文件以添加所需的条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.remotebound\" >\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:supportsRtl=\"true\"\n        android:theme=\"@style/AppTheme\"\
  \ >\n        <service\n            android:name=\".RemoteService\"\n           \
  \ android:enabled=\"true\"\n            android:exported=\"true\"\n            android:process=\"\
  :my_process\" >\n        </service>\n        <activity\n            android:name=\"\
  .MainActivity\" >\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n### 58.6 启动并绑定远程服务\n\n与绑定服务一样，客户端组件需要实现 `ServiceConnection` 类的实例，并包含 `onServiceConnected()`\
  \ 和 `onServiceDisconnected()` 方法。此外，对于本地服务，`onServiceConnected()` 方法将接收由远程服务 `onBind()`\
  \ 方法返回的 `IBinder` 对象，并将将其用于向服务器发送消息。在本例中，客户端是 `MainActivity`，其代码位于 `MainActivity.java`\
  \ 中。加载此文件并修改它，添加 `ServiceConnection` 类以及用于存储接收到的 `Messenger` 对象引用的变量，并带有一个 `Boolean`\
  \ 标志位来指示连接是否已建立：\n\n```java\npackage com.ebookfrenzy.remotebound;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.os.IBinder;\nimport android.os.Message;\n\
  import android.os.Messenger;\nimport android.os.RemoteException;\nimport android.content.ComponentName;\n\
  import android.content.Context;\nimport android.content.ServiceConnection;\nimport\
  \ android.view.View;\n\npublic class MainActivity extends AppCompatActivity {\n\
  \    Messenger myService = null;\n    boolean isBound;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n    }\n\n    final ServiceConnection\
  \ myConnection = new ServiceConnection() {\n        public void onServiceConnected(ComponentName\
  \ className, IBinder service) {\n            myService = new Messenger(service);\n\
  \            isBound = true;\n        }\n        public void onServiceDisconnected(ComponentName\
  \ className) {\n            myService = null;\n            isBound = false;\n  \
  \      }\n    };\n}\n```\n\n接下来，必须添加代码来绑定远程服务。这涉及创建一个与清单文件中声明的服务意图过滤器匹配的 `intent`，然后调用\
  \ `bindService()` 方法，提供意图和 `ServiceConnection` 实例。对于此示例，该代码将实现在 Activity 的 `onCreate()`\
  \ 方法中：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    // ... 其他代码\n    Intent intent\
  \ = new Intent(getApplicationContext(), RemoteService.class);\n    bindService(intent,\
  \ myConnection, Context.BIND_CREATE);\n}\n```\n\n### 58.7 向远程服务发送消息\n\n在测试应用程序之前，最后剩下的工作是在\
  \ `MainActivity` 类中实现 `sendMessage()` 方法，该方法被配置为在用户点击界面上的按钮时调用。此方法需要检查服务是否连接，创建一个包含要由服务器显示的字符串的\
  \ `bundle` 对象，将其添加到 `Message` 对象中，并发送给服务器：\n\n```java\npublic void sendMessage(View\
  \ view) {\n    if (!isBound) return;\n    Message msg = Message.obtain();\n    Bundle\
  \ bundle = new Bundle();\n    bundle.putString(\"MyString\", \"Message Received\"\
  );\n    msg.setData(bundle);\n    try {\n        myService.send(msg);\n    } catch\
  \ (RemoteException e) {\n        e.printStackTrace();\n    }\n}\n```\n\n\n\n\n\n\
  当 Logcat 工具窗口仍然可见时，点击用户界面上的按钮，此时日志消息将显示如下：\n\nMessage = Message Received\n\n# 58.\
  \ 总结\n\n为了实现客户端与远程绑定服务之间的交互，App 必须实现一个处理器/消息通信框架。该技术背后的基本概念在本章中涵盖，并实现了一个示例应用程序，该程序旨在演示客户端与绑定服务之间的通信，它们分别运行在独立的进程中。\n\
  \n# 59. Java 线程、处理器和执行器的基本概述\n\n线程是任何多任务操作系统的基石，可以被认为是运行在主进程中的微型进程，其目的是让应用程序内部至少出现并行执行路径的现象。在本章中，我们将探讨在\
  \ Android 应用开发中使用线程的重要性，并演示如何创建和管理它们。\n\n## 59.1 应用程序主线程\n\n当 Android 首次启动时，运行时系统会创建一个线程，所有应用程序组件默认都在该线程中运行。该线程通常被称为主线程。主线程的主要作用是处理用户界面的事件处理以及与用户界面中视图的交互。应用程序内启动的任何额外组件默认也会运行在主线程上。\n\
  \n应用程序中任何使用主线程执行耗时任务的组件都会导致整个应用程序看起来像锁定了一样，直到任务完成。这通常会导致操作系统向用户显示“应用程序未响应”的警告。显然，这远不是任何应用程序的理想行为。这可以通过简单地将要执行的任务在单独线程中启动来避免，让主线程能够不受干扰地继续处理其他任务。\n\
  \n## 59.2 线程处理器（Handlers）\n\n显然，Android 开发的关键规则之一是：永远不要在应用程序的主线程上执行耗时操作。第二个同样重要的规则是：在任何情况下，独立线程中的代码都绝**不应该**直接更新用户界面的任何部分。\n\
  \n对用户界面的任何更改必须始终在主线程内执行。这是因为 Android UI 工具包不是线程安全的。在多个线程中尝试处理非线程安全代码通常会导致间歇性问题和不可预测的应用程序行为。\n\
  \n如果线程中执行的代码需要与用户界面交互，它必须通过与主 UI 线程同步来实现。这通过在主线程中创建一个 handler 实现，由它 接收来自另一个线程的消息并相应地更新用户界面。\n\
  \n## 59.3 线程示例\n\n本章的剩余部分将通过一些简单的示例来为线程提供基础介绍。第一步将强调在主线程之外的独立线程中执行耗时任务的重要性。\n\n\
  启动 Android Studio，从欢迎屏幕选择 `New Project` 选项，在出现的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity`\
  \ 模板。\n\n在 `Name` 字段中输入 `ThreadExample`，并指定 `com.ebookfrenzy.threadexample` 为包名。在点击\
  \ `Finish` 按钮之前，将 Minimum API level 设置为 `API 26: Android 8.0 (Oreo)`，并将 Language\
  \ 菜单更改为 `Java`。按照节 11.8 将项目迁移到 View Binding 中的步骤，将项目转换为使用 view binding。\n\n## 59.4\
  \ 构建 App\n\n将项目的 `activity_main.xml` 文件加载到 Layout Editor 工具中。选择默认的 `TextView` 组件，并在\
  \ Properties 工具窗口中将视图的 ID 更改为 `myTextView`。\n\n在用户界面上添加一个 `Button` 视图，位于现有 `TextView`\
  \ 对象正下方，如图图 59-1 所示。添加按钮后，点击工具栏上的 `Infer Constraints` 按钮以添加缺失的约束。\n\n将文本更改为“Press\
  \ Me”，并将字符串提取到名为 `press_me` 的资源。在布局中仍选中按钮视图时，找到 `onClick` 属性并输入 `buttonClick` 作为方法名。\n\
  \n![](img/as_thread_example_ui_one_button.jpg)\n\n图 59-1\n\n接下来，将 `MainActivity.java`\
  \ 文件加载到编辑面板，并为 `buttonClick()` 方法添加代码，该方法将在用户点击 `Button` 视图时调用。由于这里的目标是演示在主线程上执行长时间任务的问题，代码将简单的暂停\
  \ 20 秒，然后在 `TextView` 对象上显示不同的文本：\n\n```javapublic void buttonClick(View view) {\n\
  \    long endTime = System.currentTimeMillis() + 20 * 1000;\n    while (System.currentTimeMillis()\
  \ < endTime) {\n        synchronized (this) {\n            try {\n             \
  \   wait(endTime - System.currentTimeMillis());\n            } catch (Exception\
  \ e) {\n            }\n        }\n    }\n    binding.myTextView.setText(\"Button\
  \ Pressed\");\n}\n```\n\n代码更改完成后，在物理设备或模拟器上运行应用程序。一旦应用程序运行，点击按钮，此时应用程序将看起来像冻结了一样。例如，无法第二次点击按钮，在某些情况下，操作系统将报告应用程序未响应，如图图\
  \ 59-2 所示。\n\n![](img/as_4.2_threadexample_not_responding.jpg)\n\n图 59-2\n\n显然，在\
  \ `buttonClick()` 方法中任何需要时间完成的任务都需要在独立线程执行。\n\n## 59.5 创建新线程\n\n要创建一个新线程，在该线程中执行的代码需要放在\
  \ `Runnable` 实例的 `run()` 方法中。然后需要创建一个 `Thread` 对象，并将 `Runnable` 实例传递给构造函数。最后，需要调用线程对象的\
  \ `start()` 方法来启动线程。因此，要在 `buttonClick()` 方法中执行任务，需要如下更改：\n\n```java\nvoid buttonClick(View\
  \ view) {\n    Runnable runnable = new Runnable() {\n        public void run() {\n\
  \            long endTime = System.currentTimeMillis() + 20 * 1000;\n          \
  \  while (System.currentTimeMillis() < endTime) {\n                synchronized\
  \ (this) {\n                    try {\n                        wait(endTime - System.currentTimeMillis());\n\
  \                    } catch (Exception e) {\n                    }\n          \
  \      }\n            }\n            binding.myTextView.setText(\"Button Pressed\"\
  );\n        }\n    };\n    Thread myThread = new Thread(runnable);\n    myThread.start();\n\
  }\n```\n\n事实上，如果需要，可以使用 lambda 表达式来简化 `runnable` 的声明。这种更改将导致如下结果：\n\n```java\nRunnable\
  \ runnable = () -> {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n\
  \    while (System.currentTimeMillis() < endTime) {\n        synchronized (this)\
  \ {\n            try {\n                wait(endTime - System.currentTimeMillis());\n\
  \            } catch (Exception e) {\n            }\n        }\n    }\n    binding.myTextView.setText(\"\
  Button Pressed\");\n};\n```\n\n\n\n\n当现在运行应用程序时，点击按钮会导致延迟操作在新线程中执行，从而让主线程能够继续处理用户界面，包括响应额外的按钮点击。事实上，每次点击按钮时，都会创建一个新线程，允许任务并发执行多次。\n\
  \n仔细检查 `buttonClick()` 方法更新后的代码，可以发现更新 `TextView` 的代码已被移除。正如之前提到的，在主线程的线程内部更新用户界面元素违反了\
  \ Android 开发的一项核心规则。因此，为了更新用户界面，必须为该线程实现一个 `Handler`。\n\n## 59.6 实现线程处理器 (Thread\
  \ Handler)\n\n线程处理器（Thread handlers）在应用程序的主线程中实现，主要用于响应来自应用程序进程内其他线程发送的消息，并对用户界面进行更新。\n\
  \n处理器继承自 `Handler` 类，可以通过指定线程需要时执行的 `Runnable` 来使用，也可以通过重写 `Handler` 子类中的 `handleMessage()`\
  \ 回调方法来使用，当线程向处理器 get 送消息时，该方法会被调用。\n\n为了本示例的目的，将实现一个处理器，以便从之前创建的线程内部更新用户界面。在 Android\
  \ Studio 编辑器中加载 `MainActivity.java` 文件，并修改代码为活动中添加一个 `Handler` 实例：\n\n```java\n\
  import android.os.Handler;\nimport android.os.Message;\nimport android.os.Looper;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n    Handler handler =\
  \ new Handler(Looper.getMainLooper()) {\n        @Override \n        public void\
  \ handleMessage(Message msg) {\n            binding.myTextView.setText(\"Message\
  \ Received\");\n        }\n    };\n}\n```\n\n上述代码更改声明了一个处理器并在处理器内部实现了 `handleMessage()`\
  \ 回调，当线程向处理器发送消息时，该回调将被调用。在此实例中，代码只是在用户界面的 `TextView` 对象上显示字符串。\n\n现在剩下的只是修改 `buttonClick()`\
  \ 方法中创建的线程，在延迟完成后向处理器发送消息：\n\n```java\npublic void buttonClick(View view) {\n  \
  \  Runnable runnable = () -> {\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n        while (System.currentTimeMillis() < endTime) {\n       \
  \     synchronized (this) {\n                try {\n                    wait(endTime\
  \ - System.currentTimeMillis());\n                } catch (Exception e) {\n    \
  \            }\n            }\n        }\n        handler.sendEmptyMessage(0);\n\
  \    };\n    Thread myThread = new Thread(runnable);\n    myThread.start();\n}\n\
  ```\n\n注意，唯一的更改是调用了处理器的 `sendEmptyMessage()` 方法。由于处理器目前没有对收到的任何消息内容进行任何操作，因此它发送了一个空消息对象。\n\
  \n编译并运行应用程序，执行后，点击按钮。在 20 秒延迟后，新文本将出现在用户界面的 `TextView` 对象中。\n\n## 59.7 向处理器传递消息\n\
  \n虽然上一个示例触发了对 `handleMessage()` 处理器回调的调用，但它没有利用消息对象向处理器发送数据。在教程的这一阶段，示例将进行进一步修改，以便在线程和处理器之间传递数据。首先，`buttonClick()`\
  \ 方法中更新的线程将从系统获取字符串格式的日期和时间，并将该信息存储在 `Bundle` 对象中。然后调用处理器对象的 `obtainMessage()` 方法从消息池中获取一个消息对象。最后，在通过调用处理器的\
  \ `sendMessage()` 方法发送之前，将 bundle 添加到消息对象中：\n\n```java\npublic void buttonClick(View\
  \ view) {\n    Runnable runnable = () -> {\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n        while (System.currentTimeMillis() < endTime) {\n       \
  \     synchronized (this) {\n                try {\n                    wait(endTime\
  \ - System.currentTimeMillis());\n                } catch (Exception e) {\n    \
  \            }\n            }\n        }\n        Message msg = handler.obtainMessage();\n\
  \        Bundle bundle = new Bundle();\n        bundle.putString(\"myKey\", \"Completed\"\
  );\n        msg.setData(bundle);\n        handler.sendMessage(msg);\n    };\n  \
  \  Thread myThread = new Thread(runnable);\n    myThread.start();\n}\n```\n\n接下来，更新处理器的\
  \ `handleMessage()` 方法，从消息中的 bundle 中提取日期和时间字符串并显示在 `TextView` 对象上：\n\n```java\n\
  Handler handler = new Handler(Looper.getMainLooper()) {\n    @Override\n    public\
  \ void handleMessage(Message msg) {\n        Bundle bundle = msg.getData();\n  \
  \      String string = bundle.getString(\"myKey\");\n        binding.myTextView.setText(string);\n\
  \    }\n};\n```\n\n最后，编译并运行应用程序，测试点击按钮现在是否会在线程完成后在 `TextView` 对象上显示“Thread Complete”消息。\n\
  \n## 59.8 Java Executor 并发 (Java Executor Concurrency)\n\n在本章中，目前我们只查看了直接创建和管理 Java\
  \ 线程。虽然对于简单的多线程任务是可以接受的，但在处理涉及大量线程的复杂情况时，这证明是不足够的。例如，启动和停止线程存在系统开销。因此，创建和销毁大量线程的应用程序面临性能下降的风险。基础线程\
  \ API 也没有提供调度或重复执行或从任务返回结果的选项。\n\n通过使用 Java 并发框架的 `Executor` 类（`java.util.concurrent`\
  \ 包的一部分），可以克服直接处理线程的缺点。该框架允许创建活动线程池并管理如何将任务分配给这些线程。这允许重用现有线程而无需不断创建新线程。该框架提供了额外的功能，包括在任务完成后返回结果（称为\
  \ `Callable` 任务）、检查线程状态以及在超时后或重复时间间隔调度任务。\n\n## 59.9 使用 Runnable 任务\n\n探索此框架的第一步是修改\
  \ `buttonClick()` 方法，使用并发框架 `Executor` 在单独线程中运行任务：\n\n```java\nimport java.util.concurrent.ExecutorService;\n\
  import java.util.concurrent.Executors;\n\npublic void buttonClick(View view) {\n\
  \    ExecutorService executor = Executors.newSingleThreadExecutor();\n    executor.submit(new\
  \ Runnable() {\n        public void run() {\n            long endTime = System.currentTimeMillis()\
  \ + 10 * 1000;\n            while (System.currentTimeMillis() < endTime) {\n   \
  \             synchronized (this) {\n                    try {\n               \
  \         wait(endTime - System.currentTimeMillis());\n                    } catch\
  \ (Exception e) {\n                    }\n                }\n            }\n   \
  \     }\n    });\n    executor.shutdown();\n}\n```\n\n\n\n当上述代码执行时，超时将像以前一样在单独的线程上执行。然而，对方法的更改需要一些解释。首先，从系统的\
  \ `Executors` 实例获取一个 `ExecutorService` 实例的引用：\n\n```java\nExecutorService executor\
  \ = Executors.newSingleThreadExecutor();\n```\n\n在这种情况下，请求了一个只包含一个线程的池。也可以如下所示请求具有指定线程数量的池：\n\
  \n```java\nExecutorService executor = Executors.newFixedThreadPool(10);\n```\n\n\
  接下来，通过调用执行服务实例的 `submit()` 方法在线程上启动一个 `Runnable` 任务：\n\n```java\nexecutor.submit(new\
  \ Runnable(){\n    public void run(){\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n.\n.\n}\n```\n\n注意，上述声明可以通过将其转换为 lambda 表达式来简化：\n\n```java\nexecutor.submit(()\
  \ -> {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n.\n.\n```\n\n\
  从现在开始，任务将一直运行直到完成。然而，一旦完成，执行服务将继续运行。如果你不再需要该服务，应该将其关闭。\n\n## 59.10 关闭执行 Service\
  \ 服务\n\n`ExecutorService` 提供了几种用于启动关闭的技术。要通知服务在当前运行的任务完成后自动关闭，应该如下所示调用 `shutdown()`\
  \ 方法：\n\n```java\nexecutor.shutdown();\n```\n\n另一方面，调用 `shutdownNow()` 方法将停止服务上所有正在运行的任务，并取消对待处理任务的执行：\n\
  \n```java\nexecutor.shutdownNow();\n```\n\n## 59.11 使用 Callable 任务和 Future 进行工作\n\
  \n如前所述，`ExecutorService` 支持所谓的“Callable”任务，这些任务能够在任务完成后返回结果。在单独线程上运行的任务通常预计需要一些时间才能完成（否则它们最初可能就不需要在一个单独的线程上运行了）。这引出了结果如何返回到启动任务的线程代码中的问题。这是通过\
  \ `Future` 值类型实现的，它代表在未来某个时刻将提供的值。\n\n当执行一个可调用任务时，它会返回一个 `Future` 实例，应用程序随后可以使用该实例在任务完成时获取结果。要查看此操作，首先开始编辑\
  \ `activity_main.xml` 文件，添加一个标记为“Status”的额外按钮，并将 `onClick` 属性配置为调用名为 `statusClick`\
  \ 的方法：\n\n![](img/as_thread_example_ui.jpg)\n\n图 59-3\n\n接下来，修改 `buttonClick()`\
  \ 方法以执行一个 `Callable` 任务，该任务配置为通过 `Future` 变量返回 `String` 值：\n\n```java\n.\n.\nimport\
  \ java.util.concurrent.Callable;\nimport java.util.concurrent.Future;\n.\n.\npublic\
  \ class MainActivity extends AppCompatActivity {\n    Future<String> future;\n.\n\
  .\n    public void buttonClick(View view) {\n        ExecutorService executor =\
  \ Executors.newSingleThreadExecutor();\n        future = executor.submit(new Callable<String>()\
  \ {\n            public String call() {\n                long endTime = System.currentTimeMillis()\
  \ + 10 * 1000;\n                while (System.currentTimeMillis() < endTime) {\n\
  \                    synchronized (this) {\n                        try {\n    \
  \                        wait(endTime - System.currentTimeMillis());\n         \
  \               } catch (Exception e) {\n                        }\n           \
  \         }\n                }\n                return(\"Task Completed\");\n  \
  \          }\n        });\n    }\n```\n\n从现在开始，任务将一直运行直到完成。然而，一旦完成，执行服务将继续运行。如果你不再需要该服务，应该将其关闭。\n\
  \n## 59.12 处理 Future 结果\n\n除了导入 `Future` 和声明 `Future` 变量外，对启动任务的方式进行了一些更改：`executor.submit(()\
  \ -> { long endTime = System.currentTimeMillis() + 20 * 1000; . . })`。\n\n\n\n`scheduleAtFixedRate()`\
  \ 方法无论之前调度的任务是否完成，都会启动任务的下一次实例。要指定在任务执行结束和下一次执行开始之间保持固定时间间隔，请使用 `scheduleWithFixedDelay()`\
  \ 方法。在下面的示例中，第一个任务在延迟 0 秒后进行调度，随后的每次执行都将在上一个任务完成后 10 秒后进行：\n\n```\nexecutor.scheduleWithFixedDelay(task,\
  \ 0, 10, TimeUnit.SECONDS);\n```\n\n# 59.14 总结\n\n本章的目标是提供 Android 应用中线程的概述。当应用程序在进程中首次启动时，运行时系统会创建一个主线程（main\
  \ thread），所有随后启动的应用程序组件默认在该线程运行。主线程的主要作用是处理用户界面，因此在该线程中执行任何耗时任务都会导致应用程序出现卡死的假象。因此，将可能需要时间完成的任务在单独的线程中启动是至关重要的。\n\
  \n由于 Android 用户界面工具包不是线程安全的，不应在主线程之外的任何线程中更改用户界面。可以通过在主线程中创建一个 handler 来实现用户界面更改，并从其他非主线程向其发送消息。\n\
  \n线程可以直接创建，也可以使用 Java Concurrent 框架的执行器服务（executor services）。对于更复杂的线程需求，该框架提供了线程池的自动管理、任务结果返回以及执行调度。\n\
  \n# 60. 在 Android 中进行运行时权限请求\n\n在前面的章节创建的许多示例项目中，已对 `AndroidManifest.xml` 文件进行了修改，以请求应用执行特定任务的权限。例如，在某些情况下请求了互联网访问权限以允许应用下载和显示网页。在在此为止的每个情况下，只需在清单文件中添加请求，应用即可从用户处获得执行指定任务的权限。\n\
  \n然而，对于某些权限，当应用在 Android 6.0 或更高版本上运行时，还需要额外的步骤才能正常工作。这些所谓的“危险”权限中的第一个将在下一章遇到。然而，在到达这一点之前，本章将概述在运行最新版本的\
  \ Android 上时请求此类权限涉及的步骤。\n\n## 60.1 理解普通权限和危险权限\n\nAndroid 通过要求用户授予应用执行某些任务的权限来强制安全性。在\
  \ Android 6 引入之前，在应用安装到设备时总是会寻求权限。例如，图 60-1 显示了通过 Google Play 安装应用时寻求各种权限的典型屏幕。\n\
  \n![](img/Image24251.jpg)\n\n图 60-1\n\n对于许多类型的权限，这种场景仍然适用于 Android 6.0 或更高版本上的应用。这些权限被称为普通权限（normal\
  \ permissions），仍然要求在安装时由用户接受。第二类权限被称为危险权限（dangerous permissions），必须与普通权限一样在清单文件中声明，但必须在应用程序首次启动时向用户请求。当进行此类请求时，它将以对话框的形式出现，如图\
  \ 60-2 所示：\n\n![](img/Image24341.jpg)\n\n图 60-2\n\n属于危险类别的权限完整列表包含表 60-1 中：\n\n\
  | 权限组 | 权限 |\n| :--- | :--- |\n| 日历 | READ_CALENDAR,WRITE_CALENDAR |\n| 相机 | CAMERA\
  \ |\n| 联系人 | READ_CONTACTS,WRITE_CONTACTS,GET_ACCOUNTS |\n| 位置 | ACCESS_FINE_LOCATION,ACCESS_COARSE_LOCATION\
  \ |\n| 麦克风 | RECORD_AUDIO |\n| 通知 | POST_NOTIFICATIONS |\n| 电话 | READ_PHONE_STATE,CALL_PHONE,READ_CALL_LOG,WRITE_CALL_LOG,ADD_VOICEMAIL,USE_SIP,PROCESS_OUTGOING_CALLS\
  \ |\n| 传感器 | BODY_SENSORS |\n| 短 | SEND_SMS,RECEIVE_SMS,READ_SMS,RECEIVE_WAP_PUSH,RECEIVE_MMS\
  \ |\n| 存储 | MANAGE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE\
  \ |\n\n表 60-1\n\n`MANAGE_EXTERNAL_STORAGE` 权限允许访问设备外部存储上的所有文件，包括属于其他应用的文件。因此，只有当\
  \ Google 在审核过程中确认了需要此级别的访问权限后，您的应用才会启用该权限。在将应用提交到 Google Play 商店之前测试您的应用，可以执行以下\
  \ `adb` 命令来临时为测试设备上的应用启用访问：\n\n```\nadb shell appops set --uid <package name> MANAGE_EXTERNAL_STORAGE\
  \ allow\n```\n\n可以通过以下方式关闭此模式：\n\n```\nadb shell appops set --uid <package name>\
  \ MANAGE_EXTERNAL_STORAGE default\n```\n\n## 60.2 创建权限示例项目\n\n从欢迎界面选择“New Project”选项，在生成的新项目对话框中，点击“Next”按钮之前选择“Empty\
  \ Views Activity”模板。\n\n在 `Name` 字段中输入 `PermissionDemo`，并指定 `com.ebookfrenzy.permissiondemo`\
  \ 为包名。在点击“Finish”按钮之前，将“Minimum API level”设置更改为 `API 26`：Android 8.0 (Oreo)，并将语言设置为\
  \ `Java`。\n\n## 60.3 检查权限\n\nAndroid 支持库包含多个用于寻求和管理危险权限的方法。这些调用可以在任何版本上安全地执行，但只有在\
  \ 6.0 上执行时才有意义。在应用尝试使用需要危险权限的功能之前，无论之前是否授予，代码都必须检查是否授予。这可以通过调用 `ContextCompat` 类的\
  \ `checkSelfPermission()` 方法来实现，传入当前活动的引用和请求的权限。\n\n在示例项目的 `MainActivity.java` 文件中，修改代码以检查是否已授予录音权限：\n\
  \n```java\npackage com.ebookfrenzy.permissiondemo;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import androidx.core.content.ContextCompat;\nimport androidx.annotation.NonNull;\n\
  import android.os.Bundle;\nimport android.Manifest;\nimport android.content.pm.PackageManager;\n\
  import android.util.Log;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private static final String TAG = \"PermissionDemo\";\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_permission_demo);\n        setupPermissions();\n\
  \    }\n\n    private void setupPermissions() {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \                Manifest.permission.RECORD_AUDIO);\n        if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission to record denied\");\n        }\n    }\n\
  }\n```\n\n编辑 `AndroidManifest.xml` 文件（位于项目工具窗口 app -> manifests 下），并按如下添加一行以请求录音权限：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.permissiondemoactivity\"\
  \ >\n```\n\n\n\n\n\n```xml\n<uses-permission android:name=\"android.permission.RECORD_AUDIO\"\
  \ />\n\n<application\n    android:allowBackup=\"true\"\n    android:icon=\"@mipmap/ic_launcher\"\
  \n    android:label=\"@sxtring/app_name\"\n    android:supportsRtl=\"true\"\n  \
  \  android:theme=\"@style/AppTheme\" >\n    <activity android:name=\".MainActivity\"\
  \ >\n        <intent-filter>\n            <action android:name=\"android.intent.action.MAIN\"\
  \ />\n            <category android:name=\"android.intent.category.LAUNCHER\" />\n\
  \        </intent-filter>\n    </activity>\n</application>\n</manifest>\n```\n\n\
  在设备或模拟器上运行应用，并打开 `Logcat` 工具窗口。请注意，尽管权限已添加到 manifest 文件中，仍然出现了“权限被拒绝”的消息。这是因为 Android\
  \ 要求除了向 manifest 文件添加请求之外，应用还必须在运行时请求危险权限。\n\n## 60.4 在运行时请求权限\n\n权限请求是通过调用 `ActivityCompat`\
  \ 类的 `requestPermissions()` 方法发出的。当调用此方法时，权限请求是异步处理的，并在任务完成后会调用名为 `onRequestPermissionsResult()`\
  \ 的方法。\n\n`requestPermissions()` 方法的参数是当前活动的引用、所请求权限的标识符以及请求代码。请求代码可以是任意整数值，并将用于标识是哪个请求触发了对\
  \ `onRequestPermissionsResult()` 方法的调用。修改 `MainActivity.java` 文件以声明请求代码，并在权限检查失败时请求录音权限：\n\
  \n```java\nimport androidx.core.app.ActivityCompat;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final String TAG = \"PermissionDemo\"\
  ;\n    private static final int RECORD_REQUEST_CODE = 101;\n\n    @Override\n  \
  \  private void setupPermissions() {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \            Manifest.permission.RECORD_AUDIO);\n        if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission to record denied\");\n            makeRequest();\n\
  \        }\n    }\n\n    protected void makeRequest() {\n        ActivityCompat.requestPermissions(this,\n\
  \            new String[]{Manifest.permission.RECORD_AUDIO},\n            RECORD_REQUEST_CODE);\n\
  \    }\n}\n```\n\n接下来，实现 `onRequestPermissionsResult()` 方法，其内容如下所示：\n\n```java\n\
  @Override\npublic void onRequestPermissionsResult(int requestCode,\n    @NonNull\
  \ String[] permissions, @NonNull int[] grantResults) {\n    super.onRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n    if (requestCode == RECORD_REQUEST_CODE) {\n \
  \       if (grantResults.length == 0\n            || grantResults[0] != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission has been denied by user\");\n        }\
  \ else {\n            Log.i(TAG, \"Permission has been granted by user\");\n   \
  \     }\n    }\n}\n```\n\n在模拟器或设备上编译并运行应用，注意会出现一个如图 60-3 所示的请求录音权限的对话框：\n\n![](img/android_permission_request.jpg)\n\
  \n图 60-3\n\n使用应用进行点击并检查 Logcat 面板是否出现了“Permission has been granted by user”的消息。一旦用户授予了请求的权限，`checkSelfPermission()`\
  \ 方法在后续的调用中将返回 `PERMISSION_GRANTED`，直到用户卸载并重新安装应用，或者在设置中更改了应用的权限。\n\n## 60.5 为权限请求提供理由\n\
  \n如图 60-3 所示，用户可以拒绝请求的权限。在这种情况下，除非用户在点击“拒绝”按钮之前选择了“不再询问”选项，否则应用在每次用户启动时都会继续请求权限。用户的反复拒绝可能表明用户可能不理解为什么应用需要该权限。因此，如果在此提出请求时解释原因，用户可能会更容易授予权限。遗憾的是，无法更改请求对话框的内容来包含此类解释。\n\
  \n最好的做法是将解释包含在一个单独对话框中，该对话框可以在请求对话框呈现给用户之前显示。这引发了何时显示此解释的问题。Android 文档建议只有在用户之前拒绝过该权限时才显示解释对话框，并提供了一个方法来识别此类情况。\n\
  \n调用 `ActivityCompat` 类的 `shouldRequestPermissionRationale()` 方法，如果用户之前拒绝过对特定权限的请求，将返回\
  \ `true` 结果；如果之前没有请求，则返回 `false`。在结果为 `true` 的情况下，应用应该显示一个包含需要权限理由的对话框，一旦用户阅读并关闭了该对话框，就应该重复权限请求。\n\
  \n为了向示例应用中添加此功能，修改 `onCreate()` 方法，其内容如下：\n\n```java\nimport android.app.AlertDialog;\n\
  \nprivate void setupPermissions() {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \        Manifest.permission.RECORD_AUDIO);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        Log.i(TAG, \"Permission to record denied\");\n        if (ActivityCompat.shouldRequestPermissionRationale(this,\n\
  \            Manifest.permission.RECORD_AUDIO)) {\n            AlertDialog.Builder\
  \ builder = new AlertDialog.Builder(this);\n            builder.setMessage(\"Permission\
  \ to access the microphone is required for this app to record audio.\")\n      \
  \          .setTitle(\"Permission required\");\n            builder.setPositiveButton(\"\
  OK\",\n                (dialog, id) -> makeRequest());\n            AlertDialog\
  \ dialog = builder.create();\n            dialog.show();\n        } else {\n   \
  \         makeRequest();\n        }\n    }\n}\n```\n\n该方法仍然检查权限是否已授予，但现在还会识别是否需要显示理由。如果用户之前拒绝过请求，则显示一个包含解释和\
  \ OK 按钮的对话框，当点击按钮时配置的监听器将调用 `makeRequest()` 方法。如果之前没有请求过，代码将直接跳转到寻求权限。\n\n## 60.6\
  \ 测试权限应用\n\n在正在测试的设备或模拟器会话上，启动设置应用，选择应用选项，滚动并选择 PermissionDemo 应用。在应用设置界面上，点击卸载按钮移除应用。\n\
  \n重新运行应用，并在权限请求对话框出现时点击“不允许”按钮。停止并重新启动应用，验证理由对话框是否出现。点击 OK 按钮，并在权限请求对话框出现时点击“在使用应用时允许”按钮。\n\
  \n返回设置应用，选择应用选项，再次从列表中选择 PermissionDemo 应用。一旦列出了应用设置，验证权限部分是否列出了麦克风权限：\n\n![](img/as_permission_microphone.jpg)\n\
  \n图 60-4\n\n### 60.7 总结\n\n\n\n\n\n在 Android 6.0 引入之前，应用程序请求访问某些功能的权限的唯一步骤是在应用程序的清单文件（manifest）中添加适当的行。用户在安装应用程序时，系统会提示其批准该权限。大多数权限仍然如此，但一组被认为是“危险”的权限除外。被认为危险的权限通常可能允许应用程序违反用户的隐私，例如允许访问麦克风、联系人列表或外部存储。\n\
  \n正如本章概述，基于 Android 6 或更高版本的应用程序现在在应用启动时必须向用户请求危险权限的批准，并在清单文件中包含该权限请求。\n\n# 61.\
  \ Android 通知教程\n\n通知提供了一种应用程序在未运行或当前处于后台时向用户传达消息的方式。例如，消息应用可能会通知用户有来自联系人的新消息到达。通知可以分为本地通知和远程通知。本地通知由运行在设备上的应用程序本身触发。另一方面，远程通知由远程服务器启动，并递送到设备上展示给用户看。\n\
  \n通知显示在从屏幕状态栏向下划出的通知栏中，每个通知都可以包含一些操作，例如一个用于打开发送通知的应用程序的按钮。Android 还支持直接回复（Direct\
  \ Reply）通知，该功能允许用户在通知面板内输入并提交对通知的回复。\n\n本章概述了在 Android 应用程序中实现本地通知的方法。下一章“Android\
  \ 直接回复通知教程”将涵盖直接回复通知的实现。\n\n### 61.1 通知概述\n\n当在 Android 设备上启动通知时，它会以图标的形式出现在状态栏中。例如，图\
  \ 61-1 显示了一个包含多个通知图标的状态栏：\n\n![](img/Image24252.jpg)\n\n图 61-1\n\n要查看通知，用户只需从状态栏开始向下划动的动作以拉下通知栏，如图\
  \ 61-2 所示：\n\n![](img/as_4.1_android_11_notifications.jpg)\n\n图 61-2\n\n在运行 Android\
  \ 8 或更高版本的设备上，长按应用程序启动器图标将显示与该应用程序相关的任何待处理通知，如图 61-3](#Notifications.xhtml__idTextAnchor1204)所示：\n\
  \n![](img/Image2442.jpg)\n\n图 61-3\n\nAndroid 8 及更高版本还支持通知点，当有等待用户查看的通知时会出现在应用程序启动器图标上。\n\
  \n典型的通知会显示一条消息，并在点击时启动负责发布通知的应用程序。通知还可能包含操作按钮，点击后会执行对应应用程序的特定任务。例如，图 61-4 显示了一个包含两个操作按钮的通知，允许用户删除或保存收到的消息：\n\
  \n![](img/Image2450.jpg)\n\n图 61-4\n\n用户还可以在通知中输入内联文本回复并将其发送给应用程序，如下方的图 61-5 所示的图所示。这允许用户在不将相应的应用程序启动到前台的情况下，对通知做出响应：\n\
  \n![](img/Image2458.jpg)\n\n图 61-5\n\n本章的剩余部分将介绍创建和发布包含操作的简单通知。直接回复支持的主题将在下一章“Android\
  \ 直接回复通知教程”中介绍。\n\n## 61.2 创建 NotifyDemo 项目\n\n从欢迎界面选择“New Project”（新建项目）选项，在生成的新项目对话框中，选择“Empty\
  \ Views Activity”模板，然后点击“Next”（下一步）按钮。\n\n在`Name`字段中输入 `NotifyDemo`，并指定 `com.ebookfrenzy.notifydemo`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将`Minimum API level`设置为`API 33`：Android 13 (Tiramisu)，并将`Language`菜单设置为`Java`。\n\
  \n### 61.3 设计用户界面\n\n主活动（main activity）将包含一个按钮，其目的是创建并发出意（intent）。在布局编辑器工具中定位并加载\
  \ `activity_main.xml`文件，并删除默认的 `TextView` 组件。\n\n在启用`Autoconnect`（自动连接）的情况下，从面板中拖放\
  \ `Button` 对象到布局画布的中心，如图 61-6](#Notifications.xhtml__idTextAnchor1210)所示。\n\n在布局中选中`Button`组件，使用`Attributes`（属性）面板配置`onClick`属性以调用名为\
  \ `sendNotification` 的方法。\n\n![](img/as_notification_ui.jpg)\n\n图 61-6\n\n选中`Button`组件，在`Attributes`工具窗口中将`text`属性更改为“Notify”，并将属性值提取到字符串资源。\n\
  \n### 61.4 创建第二个 Activity\n\n在此示例中，应用程序将包含第二个活动，该活动将由用户从通知内部启动。右键点击位于`app -> java`\
  \ 下的`com.ebookfrenzy.notifydemo`包名，选择`New -> Activity -> Empty Views Activity`菜单选项显示新\
  \ Android 活动对话框，向项目添加此新活动。\n\n在`Activity Name`字段中输入 `ResultActivity`，并将布局文件命名为 `activity_result`。由于此活动不会在应用程序启动时启动（它将通过通知内部的意启动），因此在点击“Finish”按钮之前，确保禁用了`Launcher\
  \ Activity`（启动活动）选项是重要的。\n\n打开第二个活动的布局（`app -> res -> layout -> activity_result.xml`），拖放一个\
  \ `TextView`组件，使其位于布局中心。编辑`TextView`的文本使其显示为“Result Activity”，并将属性值提取到字符串资源。\n\n\
  ## 61.5 创建通知通道\n\n在应用程序发送通知之前，它必须创建一个通知通道。通知通道由一个`ID`（用于在应用程序内唯一标识通道）、一个通道名称和一个通道描述（只有后两个会被用户看到）组成。通道通过配置`NotificationChannel`实例并将该对象传递给`NotificationManager`类的`createNotificationChannel()`方法来创建。对于此示例，应用程序将包含一个名为“NotifyDemo\
  \ News”的单一通知通道。编辑`MainActivity.java`文件并实现在应用程序启动时创建通道的代码：\n\n```java\nimport android.app.NotificationManager;\n\
  import android.app.NotificationChannel;\nimport android.content.Context;\nimport\
  \ android.graphics.Color;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    NotificationManager notificationManager;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n        notificationManager =\n\
  \            (NotificationManager)\n            getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \        createNotificationChannel(\n            \"com.ebookfrenzy.notifydemo.news\"\
  ,\n            \"NotifyDemo News\",\n            \"Example News Channel\");\n  \
  \  }\n\n    protected createNotificationChannel(String id, String name,\n      \
  \      String description) {\n        int importance = NotificationManager.IMPORTANCE_LOW;\n\
  \        NotificationChannel channel =\n            new NotificationChannel(id,\
  \ name, importance);\n        channel.setDescription(description);\n    }\n}\n```\n\
  \n\n\n\n\n```java\nchannel.enableLights(true);\nchannel.setLightColor(Color.RED);\n\
  channel.enableVibration(true);\nchannel.setVibrationPattern(\n    new long[]{100,\
  \ 200, 300, 400, 500, 400, 300, 200, 400});\nnotificationManager.createNotificationChannel(channel);\n\
  ```\n\n该代码声明并初始化了一个 `NotificationManager` 实例，然后创建了一个低重要性级别（其他选项为高、max、min 和 none）的新通道，并配置了名称和描述属性。在通道中还添加了一系列可选设置，用以自定义用户如何接收通知到达的提醒。这些设置适用于发送到此通道的所有通知。最后，通过将通知通道对象传递给\
  \ `notification manager` 实例的 `createNotificationChannel()` 方法来创建通道。\n\n### 6.1.6\
  \ 请求通知权限\n\n在测试应用程序之前，必须在应用程序的清单文件（manifest）请求适当权限。具体而言，应用程序需要向用户发送通知的权限。在 `Project`\
  \ 工具窗口中，找到并双击 `AndroidManifest.xml` 文件，将其加载到编辑器中并修改 XML 以添加权限：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.audioapp\" >\n    <uses-permission android:name=\"\
  android.permission.POST_NOTIFICATIONS\" />\n</manifest>\n```\n\n上述步骤将足以确保在运行 Android\
  \ 6.0 之前的版本的设备上安装应用时，用户会启用通知权限。通知访问在 Android 中被归类为危险权限，因为它赋予了应用损害用户隐私的可能。为了让示例应用在\
  \ Android 6 或更高版本的设备上运行，必须添加代码在应用运行时请求权限。\n\n编辑 `MainActivity.java` 文件，并开始添加一些额外的导入指令和一个常量，作为所请求权限的请求标识码：\n\
  \n```java\nimport androidx.core.app.ActivityCompat;\nimport androidx.core.content.ContextCompat;\n\
  import androidx.annotation.NonNull;\nimport android.widget.Toast;\nimport android.Manifest;\n\
  import android.content.pm.PackageManager;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private static final int NOTICATION_REQUEST_CODE = 101;\n}\n```\n\n接下来，需要在类中添加一个方法，其目的是将要请求的权限和相应的请求标识码作为参数。继续留在\
  \ `MainActivity.java` 类文件中，如下实现此方法：\n\n```java\nprotected void requestPermission(String\
  \ permissionType, int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \            permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        ActivityCompat.requestPermissions(this,\n                new String[]{permissionType},\
  \ requestCode);\n    }\n}\n```\n\n使用此书中“在 Android 中进行运行时权限请求”章节概述的步骤，上述方法在发出请求之前验证指定的权限是否已被授予，并将标识码作为参数传递。\n\
  \n当请求被处理后，活动（activity）上将调用 `onRequestPermissionsResult()` 方法，传递标识码和请求结果。因此，下一步是在\
  \ `MainActivity.java` 文件中如下实现此方法：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode,\n        @NonNull String[] permissions, @NonNull int[] grantResults)\
  \ {\n    super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    if (requestCode == NOTIFICATION_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0\n                || grantResults[0] !=\n                PackageManager.PERMISSION_GRANTED)\
  \ {\n            Toast.makeText(this, \"Notification required\", Toast.LENGTH_LONG).show();\n\
  \        }\n    }\n}\n```\n\n上述代码检查请求标识符以识别哪个权限已返回，然后检查相应的权限是否已授予。如果权限被拒绝，将向用户显示消息，指示应用将无法运行且记录已禁用。\n\
  \n在测试应用之前，剩下的工作是在应用启动时调用新添加的 `requestPermission()` 方法。留在 `MainActivity.java` 文件中，如下修改\
  \ `onCreate()` 方法：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  \    requestPermission(Manifest.permission.POST_NOTIFICATIONS, NOTIFICATION_REQUEST_CODE);\n\
  }\n```\n\n代码完成后，在运行 Android 13 或更高版本的设备或模拟器上编译并运行应用。当图 6-7 所示的对话框出现时，点击 Allow 按钮启用通知：(image/as_notifications.jpg)\n\
  \n启动应用后，将其放入后台并打开 `Settings` 应用。在 `Settings` 应用中，选择 `Apps` ，选择 `NotifyDemo` 项目，在后续屏幕上点击\
  \ `Notifications`。通知屏幕应该列出 `NotifyDemo News` 为用户激活状态：(image/as_app_enabled.jpg)\n\
  \n在继续之前，确保已为该应用启用了通知点（notification dots）。虽然本示例不是要求，但值得注意的是，可以通过调用通知管理器的 `deleteNotification()`\
  \ 方法从应用内部删除通道，并传递要删除通道的 ID：\n\n```java\nString channelID = \"com.ebookfrenzy.notify.news\"\
  ;\nnotificationManager.deleteNotificationChannel(channelID);\n```\n\n### 6.1.7 创建并发布通知\n\
  \n通知使用 `Notification.Builder` 类创建，并且包含图标、标题和内容。打开 `MainActivity.java` 文件如下实现 `sendNotification()`\
  \ 方法构建基础通知：\n\n```java\nimport android.app.Notification;\nimport android.view.View;\n\
  \npublic void sendNotification(View view) {\n    String channelID = \"com.ebookfrenzy.notify.news\"\
  ;\n    Notification notification =\n        new Notification.Builder(MainActivity.this,\n\
  \                channelID)\n            .setContentTitle(\"Example Notification\"\
  )\n            .setContentText(\"This is an example notification.\")\n         \
  \   .setSmallIcon(android.R.drawable.ic_dialog_info)\n            .setChannelId(channelID)\n\
  \            .build();\n}\n```\n\n一旦构建了通知，就需要使用 `NotificationManager` 实例的 `notify()`\
  \ 方法发布。访问 `NotificationManager` 并发布通知的代码如下添加到 `sendNotification()` 方法中：\n\n```java\n\
  protected void sendNotification(View view) {\n    int notificationID = 101;\n  \
  \  String channelID = \"com.ebookfrenzy.notify.news\";\n    Notification notification\
  \ =\n        new Notification.Builder(MainActivity.this,\n                channelID)\n\
  \            .setContentTitle(\"New Message\")\n            .setContentText(\"You've\
  \ received new messages.\")\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setChannelId(channelID)\n            .build();\n\n    notificationManager.notify(notificationID,\
  \ notification);\n}\n```\n\n注意，当发布通知时，它会被分配一个通知 ID。该 ID 可以任意整数，并在之后用于更新通知。\n\n\n\
  \n\n\n编译并运行应用，点击主界面上的按钮。当状态栏中出现通知图标时，从状态栏向下触摸并拖动以查看完整通知：\n\n![](img/as_notification.jpg)\n\
  图 61-9\n\n长按通知以查看更多信息：\n\n![](img/as_notification_details.jpg)\n图 61-10\n\n接下来，将应用置于后台，导航到显示所有应用启动器图标的主屏幕，注意\
  \ `NotifyDemo` 启动器图标上出现了一个通知点，如图 61-11 所示：\n\n![](img/as_notification_dot.jpg)\n\
  \n图 61-11\n\n如果没有出现该点，请检查`设置（Settings）`应用中对 `NotifyDemo` 的通知选项，以确认已启用“通知点（notification\
  \ dots）”，正如本章前面概述的那样。如果点仍未出现，请长按设备主屏幕的空白区域，从弹出的菜单中选择“主设置（Home Settings）”选项，并启用“通知点（Notification\
  \ dots）”选项。\n\n长按启动器图标将显示一个包含通知的弹出窗口：\n\n![](img/as_app_dot_detail.jpg)\n图 61-12\n\
  \n如果一个应用有多个待处理通知，长按菜单弹出窗将包含通知计数（如上图高所示）。此数字可以在构建通知时通过调用 `setNumber()` 方法在应用内部进行配置：\n\
  \n```java\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n        .setContentTitle(\"Example Notification\")\n        .setContentText(\"\
  This is an example notification.\")\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setChannelId(CHANNEL_ID)\n        .setNumber(10)\n        .build();\n\
  ```\n\n按照目前的实现方式，无论从何处访问，点击通知都没有效果。下一步是配置通知，以便在点击时启动一个活动（activity）。\n\n## 61.8 从通知启动活动\n\
  \n通知应该允许用户执行某些操作，例如启动相应的应用或响应通知采取其他操作。一个常见的需求是在用户点击通知时，启动属于该应用的活动。\n\n这种方法需要启动一个活动并配置一个\
  \ `Intent` 来启动该活动。假设应用包含一个名为 `ResultActivity` 的活动，则 intent 的创建方式如下：\n\n```java\n\
  Intent resultIntent = new Intent(this, ResultActivity.class);\n```\n\n然后需要将此 `intent`\
  \ 封装在 `PendingIntent` 实例中。`PendingIntent` 对象的设计允许将 `intent` 传递给其他应用程序，实质上授予这些应用程序在未来某个时刻执行该\
  \ intent 的权限。在这种情况下，`PendingIntent` 对象用于为通知系统提供一种方法，在用户点击通知面板时启动 `ResultActivity`\
  \ 活动：\n\n```java\nPendingIntent pendingIntent =\n    PendingIntent.getActivity(\n\
  \        this,\n        0,\n        resultIntent,\n        PendingIntent.FLAG_IMMUTABLE\n\
  \    );\n```\n\n剩下的工作是在构建通知过程中使用 `setContentIntent()` 方法分配 `PendingIntent` 对象。\n\
  \n将这些更改整合后得到修改后的 `sendNotification()` 方法，其内容如下：\n\n```java\n.\n.\nimport android.app.PendingIntent;\n\
  import android.content.Intent;\nimport android.graphics.drawable.Icon;\n.\n.\nprotected\
  \ void sendNotification(View view) {\n    int notificationId = 101;\n    Intent\
  \ resultIntent = new Intent(this, ResultActivity.class);\n    PendingIntent pendingIntent\
  \ =\n            PendingIntent.getActivity(\n                this,\n           \
  \     0,\n                resultIntent,\n                PendingIntent.FLAG_IMMUTABLE\n\
  \            );\n    String CHANNEL_ID = \"com.ebookfrenzy.notifydemo.news\";\n\
  \    Notification notification = new Notification.Builder(MainActivity.this, CHANNEL_ID)\n\
  \            .setContentTitle(\"Example Notification\")\n            .setContentText(\"\
  This is an example notification.\")\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setChannelId(CHANNEL_ID)\n            .setContentIntent(pendingIntent)\n\
  \            .build();\n    notificationManager.notify(notificationId, notification);\n\
  }\n```\n\n编译并重新运行应用，点击按钮并显示通知抽屉。然而，这次点击通知将导致 `ResultActivity` 启动。\n\n## 61.9 为通知添加操作\n\
  \n为通知添加交互性的另一种方法是创建操作（actions）。它们显示为通知消息下方的按钮，并程序设计为在用户点击时触发特定的 `intent`。如果将以下代码添加到\
  \ `sendNotification()` 方法中，将添加一个标记为“打开（Open）”的操作，它可以启动引用的 intent：\n\n```java\nfinal\
  \ Icon icon = Icon.createWithResource(MainActivity.this, android.R.drawable.ic_dialog_info);\n\
  Notification.Action action =\n    new Notification.Action.Builder(icon, \"Open\"\
  , pendingIntent)\n    .build();\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n        .setContentTitle(\"Example Notification\")\n        .setContentText(\"\
  This is an example notification.\")\n        .setSmallIcon(R.drawable.ic_info_24dp)\n\
  \        .setChannelId(channelID)\n        .setContentIntent(pendingIntent)\n  \
  \      .setActions(action)\n        .build();\nnotificationManager.notify(notificationId,\
  \ notification);\n```\n\n将上述代码添加到方法并运行应用。发布通知，并注意通知内的 Open 操作（取决于 Android 版本，可能需要下拉通知面板才能显示）：\n\
  \n![](img/as_notification.jpg)\n图 61-13\n\n点击该操作将触发相应的 intent 并启动 `ResultActivity`。\n\
  \n## 61.10 折叠通知\n\n如果一个应用经常发布通知，可能会导致这些通知迅速堆满状态栏和通知抽屉，为用户提供欠佳的体验。这对于每当有新闻新闻或新消息到达就发送通知的消息或消息应用尤为如此。例如，考虑图\
  \ 61-14 中的通知：\n\n![](img/as_3.2_unbundled_notifications.jpg)\n图 61-14\n\n现在想象如果有十条甚至二十条新消息。为了避免这个问题，Android\
  \ 允许将通知分组。\n\n要折叠通知，每个通知必须通过 `setGroup()` 方法指定属于同一个组，并且必须发布并配置一个额外的通知。例如，以下代码创建并发布了上方图\
  \ 61-14 所示的三个通知，但将它们折叠到了同一个组中。代码还发布了一个作为摘要的通知：\n\n```java\nfinal String GROUP_KEY_NOTIFY\
  \ = \"group_key_notify\";\nNotification.Builder builderSummary =\n    new Notification.Builder(this,\
  \ channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n       \
  \ .setContentTitle(\"A Bundle Example\")\n        .setContentText(\"You have 3 new\
  \ messages\")\n        .setGroup(GROUP_KEY_NOTIFY)\n        .setGroupSummary(true);\n\
  Notification.Builder builder1 =\n    new Notification.Builder(this, channelID)\n\
  \        .setSmallIcon(android.R.drawable.ic_dialog_info)\n        .setContentTitle(\"\
  New Message\")\n        .setContentText(\"You have a new message from Kassidy\"\
  )\n        .setGroup(GROUP_KEY_NOTIFY);\n```\n\n\n\n\n```java\nNotification.Builder\
  \ builder2 =\n        new Notification.Builder(this, channelID)\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setContentTitle(\"New Message\")\n            .setContentText(\"You\
  \ have a new message from Caitlyn\")\n            .setGroup(GROUP_KEY_NOTIFY);\n\
  Notification.Builder builder3 =\n        new Notification.Builder(this, channelID)\n\
  \            .setSmallIcon(android.R.drawable.ic_dialog_info)\n            .setContentTitle(\"\
  New Message\")\n            .setContentText(\"You have a new message from Jason\"\
  )\n            .setGroup(GROUP_KEY_NOTIFY);\n\nint notificationId0 = 100;\nint notificationId1\
  \ = 101;\nint notificationId2 = 102;\nint notificationId3 = 103;\n\nnotificationManager.notify(notificationId1,\
  \ builder1.build());\nnotificationManager.notify(notificationId2, builder2.build());\n\
  notificationManager.notify(notificationId3, builder3.build());\nnotificationManager.notify(notificationId0,\
  \ builderSummary.build());\n```\n\n当代码执行时，状态栏中只会显示一个通知图标，尽管应用已发布了四个通知。在通知栏中，会显示一个摘要通知，列出每个组绑通知中的信息：\n\
  \n![](img/Image2528.jpg)\n图 61-15\n\n进一步向下滑动通知条目可以展开面板，显示每个组绑通知的详细信息：\n\n![](img/Image2536.jpg)\n\
  图 61-16\n\n### 61.11 总结\n\n通知为应用提供了一种在应用未运行或处于后台时向用户传递消息的方式。通知显示在状态栏和通知栏中。本地通知由运行的应用在设备上触发，而远程通知由远程服务器启动并递送到设备。本地通知使用\
  \ `NotificationCompat.Builder` 类创建，并使用 `NotificationManager` 服务发布。\n\n如本章所示，可以通过使用动作、意\
  \ 和 `PendingIntent` 类来配置通知，为用户提供选项（例如启动活动或保存消息）。通知分组（Notification bundling）提供了一种对通知进行分组的机制，为发布更多通知的应用提供了改进的体验。\n\
  \n## 62. Android 直接回复通知教程\n\n直接回复是 Android 的一项功能，允许用户在通知中输入文本并将其发送到与该通知关联的应用。这使用户可以在不启动应用内活动的情况下直接回复通知中的消息。本章将基于上一章所得的知识，创建一个使用此通知功能的示例应用。\n\
  \n### 62.1 创建 DirectReply 项目\n\n从欢迎界面选择 New Project（新项目）选项，在弹出的新项目对话框中，点击 Next（下一步）按钮之前选择\
  \ Empty Views Activity 模板。\n\n在 Name（名称）字段中输入 `DirectReply`，并指定 `com.ebookfrenzy.directreply`\
  \ 为包名。在点击 Finish（完成）按钮之前，将最低 API 级别设置为 `API 33: Android 13`，并将语言菜单更改为 `Java`。按照节\
  \ 11.8 将项目迁移到视图绑定 中概述的步骤修改项目以支持视图绑定。\n\n### 62.2 设计用户界面\n\n在布局工具中加载 `activity_main.xml`\
  \ 布局文件。在启用自动连接（Autoconnect）的情况下，在现有的“Hello World!”标签下方添加一个 `Button` 对象，如图 62-1 所示。在布局中选中\
  \ `Button` 组件，使用 Attributes（属性）工具窗口将 `onClick` 属性设置为调用名为 `sendNotification` 的方法。必要时使用\
  \ Infer Constraints（推断约束）按钮为布局添加任何缺失的约束。继续之前，选择“Hello World!” `TextView`，将 `id`\
  \ 属性更改为 `textView`，并将按钮上的文字修改为“Notify”：\n\n![](img/as_direct_reply_ui.jpg)\n图 62-1\n\
  \n### 62.3 请求通知权限\n\n在 Project（项目）工具窗口中找到并双击 `AndroidManifest.xml` 文件加载到编辑器，修改 XML\
  \ 添加权限元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.audio\"\
  >\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n\
  ```\n\n编辑 `MainActivity.java` 文件，首先添加一些导入指令和一个常量作为所请求权限的请求代码：\n\n```java\nimport\
  \ androidx.annotation.NonNull;\nimport androidx.core.app.ActivityCompat;\nimport\
  \ androidx.core.content.ContextCompat;\nimport android.widget.Toast;\nimport android.Manifest;\n\
  import android.content.pm.PackageManager;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private static final int NOTIFICATION_REQUEST_CODE = 01;\n```\n\n接下来，需要向类中添加一个方法，其目的是将要请求的权限和相应的请求标识作为参数。在\
  \ `MainActivity.java` 类中，按如下实现该方法：\n\n```java\nprotected void requestPermission(String\
  \ permissionType, int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\
  \ permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED) {\n\
  \        ActivityCompat.requestPermissions(this, new String[]{permissionType}, requestCode);\n\
  \    }\n}\n```\n\n当请求处理后，`onRequestPermissionsResult()` 方法将在活动上调用，传递标识码和请求结果。因此，下一步是在\
  \ `MainActivity.java` 文件中实现此方法：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {\n \
  \   super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    if (requestCode == NOTIFICATION_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED) {\n            Toast.makeText(this,\
  \ \"Notification required\", Toast.LENGTH_LONG).show();\n        }\n    }\n}\n```\n\
  \n在测试应用之前，剩下的是在应用启动时调用新添加的 `requestPermission()` 方法。在 `MainActivity.java` 文件中，按如下修改\
  \ `onCreate()` 方法：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    View view = binding.getRoot();\n    setContentView(view);\n    requestPermission(Manifest.permission.POST_NOTIFICATIONS,\
  \ NOTIFICATION_REQUEST_CODE);\n}\n```\n\n### 62.4 创建通知通道\n\n与上一章的示例一样，在发送通知之前必须创建一个通道。编辑\
  \ `MainActivity.java` 文件并添加代码创建新通道：\n\n```java\nimport android.app.NotificationChannel;\n\
  import android.app.NotificationManager;\nimport android.content.Context;\nimport\
  \ android.graphics.Color;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private NotificationManager notificationManager;\n    private final String\
  \ channelID = \"com.ebookfrenzy.directreply.news\";\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        notificationManager = (NotificationManager)\
  \ getSystemService(Context.NOTIFICATION_SERVICE);\n        createNotificationChannel(channelID,\
  \ \"DirectReply News\", \"Example News Channel\");\n    }\n}\n```\n\n\n\n\n```java\n\
  protected void createNotificationChannel(String id, String name, String description)\
  \ {\n    int importance = NotificationManager.IMPORTANCE_HIGH;\n    NotificationChannel\
  \ channel = new NotificationChannel(id, name, importance);\n    channel.setDescription(description);\n\
  \    channel.enableLights(true);\n    channel.setLightColor(Color.RED);\n    channel.enableVibration(true);\n\
  \    channel.setVibrationPattern(new long[]{100, 200, 300, 400, 500, 400, 300, 200,\
  \ 400});\n    notificationManager.createNotificationChannel(channel);\n}\n```\n\n\
  ### 62.5 构建 RemoteInput 对象\n\n在通知中实现内联直接回复的关键元素是 `RemoteInput` 类。之前的章节介绍了 `PendingIntent`\
  \ 类，并解释了它如何允许一个应用程序创建一个意图（intent），然后授予其他应用程序或服务从原始应用外部启动该意图的能力。在名为“Android 通知教程”的章节中，创建了一个待定意图（pending\
  \ intent），允许从通知内部启动原始应用的 activity。`RemoteInput` 类允许将用户输入请求随意图一起包含在 `PendingIntent`\
  \ 对象中。当 `PendingIntent` 对象中的意图触发时（例如启动一个 activity），该 activity 也会接收用户提供的任何输入。\n\n\
  在通知中实现直接回复的第一步是创建 `RemoteInput` 对象。这是通过使用 `RemoteInput.Builder()` 方法实现的。要构建 `RemoteInput`\
  \ 对象，需要一个关键字符串，它将用于从生成的意图中提取输入。该对象还需要一个标签字符串，该字符串将显示在通知的文本输入框中。编辑 `MainActivity.java`\
  \ 文件并添加 `sendNotification()` 方法。注意还添加了一些导入指令和变量，这些变量将在章节后续的进展中使用：\n\n```java\npackage\
  \ com.ebookfrenzy.directreply;\n\nimport android.app.PendingIntent;\nimport android.app.RemoteInput;\n\
  import android.content.Intent;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private static final int notificationId = 101;\n    private static final\
  \ String KEY_TEXT_REPLY = \"key_text_reply\";\n    private NotificationManager notificationManager;\n\
  \    private static final String channelID = \"com.ebookfrenzy.directreply.news\"\
  ;\n\n    public void sendNotification(View view) {\n        String replyLabel =\
  \ \"Enter your reply here\";\n        RemoteInput remoteInput = new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \                .setLabel(replyLabel)\n                .build();\n    }\n}\n```\n\
  \n现在 `RemoteInput` 对象已经创建并用键和标签字符串进行了初始化，它需要被放置在通知操作对象内部。然而，在执行该步骤之前，需要创建 `PendingIntent`\
  \ 实例。\n\n### 62.6 创建 PendingIntent\n\n创建 `PendingIntent` 的步骤与“Android 通知教程”章节中概述的步骤相同，只是意图将被配置为启动\
  \ `MainActivity`。在 `MainActivity.java` 文件中，添加以下代码来创建 `PendingIntent`：\n\n```java\n\
  public void sendNotification(View view) {\n    String replyLabel = \"Enter your\
  \ reply here\";\n    RemoteInput remoteInput = new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \            .setLabel(replyLabel)\n            .build();\n    Intent resultIntent\
  \ = new Intent(this, MainActivity.class);\n    PendingIntent resultPendingIntent\
  \ = PendingIntent.getActivity(this, 0, resultIntent, PendingIntent.FLAG_MUTABLE);\n\
  }\n```\n\n## 62.7 创建回复操作\n\n内联回复将通过通知中的操作按钮进行访问。该操作需要被创建，并与图标、显示在按钮上的标签、`PendingIntent`\
  \ 对象以及 `RemoteInput` 对象进行配置。修改 `sendNotification()` 方法以添加创建此操作的代码：\n\n```java\n\
  import android.graphics.drawable.Icon;\nimport android.app.Notification;\n\npublic\
  \ void sendNotification(View view) {\n    String replyLabel = \"Enter your reply\"\
  ;\n    RemoteInput remoteInput = new RemoteInput.Builder(KEY_TEXT_REPLY)\n     \
  \       .setLabel(replyLabel)\n            .build();\n    Intent resultIntent =\
  \ new Intent(this, MainActivity.class);\n    PendingIntent resultPendingIntent =\
  \ PendingIntent.getActivity(this, 0, resultIntent, PendingIntent.FLAG_MUTABLE);\n\
  \    final Icon icon = Icon.createWithResource(MainActivity.this, android.R.drawable.ic_dialog_info);\n\
  \    Notification.Action replyAction = new Notification.Action.Builder(icon, \"\
  Reply\", resultPendingIntent)\n            .addRemoteInput(remoteInput)\n      \
  \      .build();\n}\n```\n\n在教程的这一阶段，我们已经构建了并准备好使用 `RemoteInput`、`PendingIntent`\
  \ 和 `Notification Action` 对象。下一阶段是构建通知并发布它：\n\n```java\npublic void sendNotification(View\
  \ view) {\n    String replyLabel = \"Enter your here\";\n    RemoteInput remoteInput\
  \ = new RemoteInput.Builder(KEY_TEXT_REPLY)\n            .setLabel(replyLabel)\n\
  \            .build();\n    Intent resultIntent = new Intent(this, MainActivity.class);\n\
  \    PendingIntent resultPendingIntent = PendingIntent.getActivity(this, 0, resultIntent,\
  \ PendingIntent.FLAG_MUTABLE);\n    final Icon icon = Icon.createWithResource(MainActivity.this,\
  \ android.R.drawable.ic_dialog_info);\n    Notification.Action replyAction = new\
  \ Notification.Action.Builder(icon, \"Reply\", resultPendingIntent)\n          \
  \  .addRemoteInput(remoteInput)\n            .build();\n    Notification newMessageNotification\
  \ = new Notification.Builder(this, channelID)\n            .setColor(ContextCompat.getColor(this,\
  \ android.R.color.holo_blue_dark))\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setContentTitle(\"My Notification\")\n            .setContentText(\"\
  This is a test message\")\n            .addAction(replyAction).build();\n    NotificationManager\
  \ notificationManager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \    notificationManager.notify(notificationId, newMessageNotification);\n}\n```\n\
  \n修改完成后，编译并运行应用，允许通知，并测试点击按钮是否成功发布通知。当查看通知栏时，通知应该如图 62-2 所示：\n\n![](img/as_direct_reply.jpg)\n\
  \n图 62-2\n\n点击回复操作按钮，使文本输入框出现，显示创建 `RemoteInput` 对象时嵌入的回复标签。\n\n![](img/as_direct_reply_enter.jpg)\n\
  \n图 62-3\n\n输入一些文本并点击输入框末部的发送箭头按钮。\n\n## 62.8 接收直接回复输入\n\n\n\n\n既然通知已成功向用户请求输入，应用需要对该输入进行处理。本教程的目标是让用户在通知输入的文本显示在\
  \ Activity 用户界面的 `TextView` 控件上。\n\n当用户输入文本并点击发送按钮时，`MainActivity` 将通过 `PendingIntent`\
  \ 对象中的 `intent` 启动。此 `intent` 中包含了用户通过通知输入的文本。在 Activity 的 `onCreate()` 方法中，调用 `getIntent()`\
  \ 方法将返回启动该 Activity 的 `intent` 副本。将其传递给 `RemoteInput.getResultsFromIntent()` 方法，反过来，它会返回一个包含回复文本的\
  \ `Bundle` 对象，该对象可以被提取并赋值给 `TextView` 控件。这导致了 `MainActivity.java` 文件中的 `onCreate()`\
  \ 方法被修改，其内容如下：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n...\n    createNotificationChannel(channelID, \"DirectReply News\",\n     \
  \                          Example News Channel\");\n    handleIntent();\n}\n\n\
  private void handleIntent() {\n    Intent intent = this.getIntent();\n    Bundle\
  \ remoteInput = RemoteInput.getResultsFromIntent(intent);\n    if (remoteInput !=\
  \ null) {\n        String inputString = remoteInput.getCharSequence(\n         \
  \       KEY_TEXT_REPLY).toString();\n        binding.textView.setText(inputString);\n\
  \    }\n}\n```\n\n完成这些代码更改后，再次构建并运行应用。点击按钮发出通知，并在通知面板内输入并发送一些文本。注意，`MainActivity`\
  \ 中的 `TextView` 控件已更新以显示输入的内联文本。\n\n### 62.9 更新通知\n\n在通知中发送回复后，你可能注意到进度指示器在通知面板中持续旋转，如图\
  \ 62-4 所示：\n\n![](img/as_direct_reply_progress.jpg)\n\n图 62-4\n\n通知显示此指示器是因为它正在等待\
  \ Activity 的响应，以确认收到发送的文本。执行此项任务的推荐方法是用新消息更新通知，表明已接收并处理了回复。由于原始通知在发布时已分配 ID，因此可以再次使用它来执行更新。向\
  \ `handleIntent()` 方法添加以下代码以执行此项任务：\n\n```java\nprivate void handleIntent() {\n\
  \    Intent intent = this.getIntent();\n    Bundle remoteInput = RemoteInput.getResultsFromIntent(intent);\n\
  \    if (remoteInput != null) {\n        String inputString = remoteInput.getCharSequence(\n\
  \                KEY_TEXT_REPLY).toString();\n        binding.myTextView.setText(inputString);\n\
  \        Notification repliedNotification =\n                new Notification.Builder(this,\
  \ channelID)\n                        .setSmallIcon(\n                         \
  \            android.R.drawable.ic_dialog_info)\n                        .setContentText(\"\
  Reply received\")\n                        .build();\n        notificationManager.notify(notificationId,\n\
  \                repliedNotification);\n    }\n}\n```\n\n最后测试一次应用，验证在发送内联回复文本后进度指示器消失，并且出现了一个新的通知。\n\
  \n```\n![](img/as_direct_reply_progress.jpg)\nFigure 62-4\n```\n\n### 62.10 总结\n\
  \n通知显示此指示器是因为它正在等待 Activity 的响应，以确认收到发送的文本。执行此项任务的推荐方法是用新消息更新通知，表明已接收并处理了回复。由于原始通知在发布时已分配\
  \ ID，因此可以再次使用它来执行更新。\n\n## 63. 折叠屏设备与多窗口\n\n虽然在编写时，市场上还没有可以进行应用测试的折叠屏设备，但 Android\
  \ SDK 包含了折叠屏模拟器。要创建一个折叠屏模拟器，选择 Android `Tools -> AVD Manager` 菜单选项，点击 `Create Virtual\
  \ Device` 按钮，并在硬件选择屏幕上，从下方图 63-3 所示的折叠屏选项之一：\n\n```\n![](img/as_foldable_avd.jpg)\n\
  Figure 63-3\n```\n\n在选择折叠屏后，继续完成创建过程，选择 Android 10 API 29 或更高版本作为系统镜像。\n\n一旦模拟器启动运行，工具栏将出现一个额外的按钮，允许模拟器在折叠和展开配置之间进行切换：\n\
  \n```\n![](img/as_3.5_foldable_emulator_fold_button.jpg)\n```\n\n### 63.1 折叠屏与多窗口\n\
  \n多窗口支持最初在 Android 7 中引入，允许显示多一个 Activity。Android 中的多窗口支持提供了三种不同形式。分屏模式在大多数手机和平板设备上可用，提供了一个分屏环境，两个\
  \ Activity 并排显示或一个在上在上。它提供了一个可移动的分割线，用户拖动它时会调整分配给每个相邻 Activity 的屏幕百分比：\n\n```\n\
  ![](img/Image2422.jpg)\nFigure 63-1\n```\n\n自由窗口（Freeform mode）在较大的屏幕上提供了一个窗口环境，目前由设备决定是否启用。自由窗口与分屏模式的区别在于，它允许每个\
  \ Activity 在独立的、可调整大小的窗口中出现，并且不受同时显示两个 Activity。例如，图 63-2 显示了一个处于自由窗口模式的设备，显示了计算器和另一个应用：\n\
  \n```\n![](img/Image24362.jpg)\nFigure 63-2\n```\n\n画中画（Picture-in-picture）支持正如其名，允许在用户执行其他任务时在较小的窗口中继续播放视频，该主题将从`Android\
  \ 画中画模式` 章开始介绍。\n\n### 63.3 进入多窗口模式\n\n可以通过显示最近任务界面（Overview screen）、长按列出的应用中工具栏中的应用图标，并选择“分屏”菜单选项进入分屏模式，如图\
  \ 63-5 所示：\n\n```\n![](img/as_3.5_split_screen_button.jpg)\nFigure 63-5\n```\n\n\
  \n\n\n\n一旦进入分屏模式，`Overview` 按钮将变为显示两个矩形（如图 63-6 中标记的 A），当前活动将占据屏幕部分 (B)，`Overview`\
  \ 屏幕将出现在屏幕的相邻部分，允许选择第二个活动进行显示 (C)：\n\n![](img/as_3.5_split_screen_select_second_app.jpg)\n\
  \n图 63-6\n\n一旦选择了第二个应用，屏幕将如上文 图 63-1 所示被平分。\n\n要退出分屏模式，只需将分隔两个活动的分割线拖动到最远边缘，使只有一个活动占据整个屏幕，或者长按\
  \ `Overview` 按钮直到它恢复为单个正方形。\n\n## 63.4 启用并使用自由窗口支持\n\n虽然并不是所有设备都受到官方支持，但在大屏设备和模拟器上可以启用自由窗口多窗口模式。要启用此模式，请在模拟器运行或设备连接时，运行以下\
  \ `adb` 命令：\n\n```\nadb shell settings put global enable_freeform_support 1\n```\n\
  \n做出此更改后，可能需要重启设备设置才会生效。\n\n一旦启用，在 `Overview` 屏幕中长按应用图标时，会出现一个额外的选项，如图 63-7 所示：\n\
  \n![](img/as_3.5_freeform_button.jpg)\n\n图 63-7\n\n### 63.5 检查自由窗口支持\n\n如本章前面的概述所述，Google\
  \ 将是否启用自由窗口多窗口模式的选择权交给了各个 Android 设备制造商。由于自由窗口仅在较大的设备上使用才有意义，因此无法保证在每个可能运行应用的设备上都提供自由窗口。幸运的是，如果设备不支持自由窗口模式，系统将忽略所有特定的自由窗口的方法和属性，因此使用这些功能不会导致应用在非自由窗口设备上崩溃。然而，可能会出现某些情况，检测设备是否支持自由窗口多窗口模式是有用的。幸运的是，可以通过检查包管理器中的自由窗口管理功能来实现。下面的代码示例检查了自由窗口多窗口支持，并根据测试结果返回\
  \ `Boolean` 值：\n\n```java\npublic Boolean checkFreeform() {\n    return getPackageManager().hasSystemFeature(\n\
  \            PackageManager.FEATURE_FREEFORM_WINDOW_MANAGEMENT);\n}\n```\n\n###\
  \ 63.6 在应用中启用多窗口支持\n\n`android:resizableActivity` 清清单文件设置控制应用是否支持多窗口行为。此设置可以在应用程序级或单个活动级进行。例如，下面的代码片段配置了名为\
  \ `MainActivity` 的活动以同时支持分屏和自由窗口多窗口模式：\n\n```xml\n<activity\n    android:name=\"\
  .MainActivity\"\n    android:resizeableActivity=\"true\"\n    android:label=\"@string/app_name\"\
  \n    android:theme=\"@style/AppTheme.NoActionBar\">\n    <intent-filter>\n    \
  \    <action android:name=\"android.intent.action.MAIN\" />\n        <category android:name=\"\
  android.intent.category.LAUNCHER\" />\n    </intent-filter>\n</activity>\n```\n\n\
  将该属性设置为 `false` 将防止活动出现在分屏或自由窗口模式下，且相应的按钮将出现在应用的 `Overview` 菜单中。在分屏配置中选择一个禁用多窗口支持的活动作为第二个活动，将显示一条消息，指示该应用可能不支持多窗口模式。\n\
  \n### 63.7 指定多窗口属性\n\n`<layout>` 元素提供了许多属性，用于指定活动在多窗口模式下启动时的尺寸和位置。当在自由窗口模式下启动时，活动的初始高度、宽度和位置可以使用以下属性指定：\n\
  \n* `android:defaultWidth` – 指定活动的默认宽度。\n* `android:defaultHeight` – 指定活动的默认高度。\n\
  * `android:gravity` – 指定活动的初始位置（start、end、left、right、top 等）。\n\n注意，上述属性仅当活动在自由窗口模式下显示时对活动生效。下面的示例配置了活动在屏幕起始边缘顶部以特定的高度和宽度出现：\n\
  \n```xml\n<activity android:name=\".MainActivity \">\n    <layout android:defaultHeight=\"\
  350dp\"\n             android:defaultWidth=\"450dp\"\n             android:gravity=\"\
  start|end\" />\n</activity>\n```\n\n可以使用以下 `<layout>` 属性来指定活动在分屏视图或自由窗口模式下可以缩减到的最小宽度和高度：\n\
  \n* `android:minimalHeight` – 指定活动在分屏视图或自由窗口模式下可以缩减的最小高度。\n* `android:minimalWidth`\
  \ – 指定活动在自由窗口模式下可以缩减的最小宽度。\n\n当用户将分屏分割线滑动超过最小边界，系统将停止调整活动大小并仅对用户界面进行裁剪。下面的清单片段实现了最小宽度和高度：\n\
  \n```xml\n<activity android:name=\".MainActivity \">\n    <layout android:minimalHeight=\"\
  400dp\"\n    android:minimalWidth=\"290dp\" />\n</activity>\n```\n\n## 63.8 在活动中检测多窗口模式\n\
  \n可能会出现情况，活动需要检测自己是否正以多窗口模式显示给用户。可以通过调用 `Activity` 类的 `isInWindowMode()` 方法获取状态。它根据是否全屏返回\
  \ `true` 或 `false` 值：\n\n```java\nif (isInWindowMode()) {\n    // 处于多窗口模式\n} else\
  \ {\n    // 不处于多窗口模式\n}\n```\n\n### 63.9 接收多窗口通知\n\n如果活动重写了 `onWindowModeChanged()`\
  \ 回调方法，则将接收进入或退出多窗口模式的通知。传递给方法的第一个参数在进入多窗口模式时为 `true`，在退出时为 `false`。新的配置设置包含在第二个参数\
  \ `Configuration` 对象中：\n\n```java\n@Override\npublic void onWindowModeChanged(boolean\
  \ isInWindowMode, Configuration newConfig) {\n    super.onWindowModeChanged(isInWindowMode,\
  \ newConfig);\n    if (isInWindowMode) {\n        // 进入多窗口模式\n    } else {\n   \
  \     // 退出多窗口模式\n    }\n}\n```\n\n如处理 Android 活动状态变化章节所述，Android 10 及更高版本允许多个活动处于恢复状态。用户最近交互的活动被称为顶层恢复活动。为了跟踪活动获取和丢失顶层恢复状态，可以在活动中实现\
  \ `onTopResumedActivityChanged()` 回调方法，例如：\n\n```java\n@Override\npublic void onTopResumedActivityChanged(boolean\
  \ isTopResumedActivity) {\n    super.onTopResumedActivityChanged(isTopResumedActivity);\n\
  \    if (isTopResumedActivity) {\n        // 活动现在是顶层恢复活动\n    } else {\n       \
  \ // 活动不再是顶层恢复活动\n    }\n}\n```\n\n在某些运行 Android 9 的设备上，通过在应用清清单文件中启用以下属性，可能也可以在应用中利用多恢复：\n\
  \n```xml\n<meta-data\n```\n\n\n\n\n\n```xml\nandroid:name=\"android.allow_multiple_resumed_activities\"\
  \ android:value=\"true\" />\n```\n\n## 63.10 在多窗口模式下启动 Activity\n\n在本书的 Android\
  \ 式 Intent – 示例章节中，创建了一个示例应用，其中一个 activity 使用 `intent` 启动第二个 activity。默认情况下，通过 `intent`\
  \ 启动的 activity 被认为与源 activity 位于同一个任务栈中。然而，通过向 `intent` 传递适当标志（flags），可以将 activity\
  \ 启动到新的任务栈中。\n\n当多窗口模式下的 activity 在同一个任务栈内启动另一个 activity 时，新 activity 将替换分屏或自由窗口窗口中的源\
  \ activity（用户通过回退键可以回到原始 activity）。\n\n然而，当在分屏模式下启动到新的任务栈中时，第二个 activity 将出现在与原始\
  \ activity 相邻的窗口中，允许同时查看两个 activity。在自由窗口模式下，启动的 activity 将出现在与原始 activity 独立的窗口中。\n\
  \n要将 activity 启动到新的任务栈中，必须在启动 `intent` 之前设置以下标志：\n\n* `Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT`\n\
  * `Intent.FLAG_ACTIVITY_MULTIPLE_TASK`\n* `Intent.FLAG_ACTIVITY_NEW_TASK`\n\n例如，以下代码配置并启动了一个设计在独立窗口中显示的第二个\
  \ activity：\n\n```java\nIntent i = new Intent(this, SecondActivity.class);\n\ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT|\n\
  \           Intent.FLAG_ACTIVITY_MULTIPLE_TASK|\n           Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  \nstartActivity(i);\n```\n\n## 63.11 配置自由窗口 Activity 的大小和位置\n\n默认情况下，在自由窗口模式下启动到不同任务栈的\
  \ activity 将置于屏幕中心，大小由系统决定。可以通过通过 `ActivityOptions` 类向 `intent` 传递启动边界（launch bounds）设置来控制此窗口的位置和尺寸。此过程的第一步是创建一个\
  \ `Rect` 对象，并配置其代表 activity 窗口的矩形的左 (X)、顶 (Y)、右 (X) 和底 (Y) 坐标。例如，以下代码创建一个 `Rect`\
  \ 对象，其左上角位于坐标 (0, 0)，右下角位于 (100, 100)：\n\n```java\nRect rect = new Rect(100, 800,\
  \ 900, 700);\n```\n\n下一步是创建 `ActivityOptions` 类的基本实例，并通过 `setLaunchBounds()` 方法使用\
  \ `Rect` 设置对其初始化：\n\n```java\nActivityOptions options = ActivityOptions.makeBasic();\n\
  \nActivityOptions bounds = options.setLaunchBounds(rect);\n```\n\n最后，将 `ActivityOptions`\
  \ 实例转换为 `Bundle` 对象，并与 `Intent` 对象一起传递给 `startActivity()` 方法：\n\n```java\nstartActivity(i,\
  \ bounds.toBundle());\n```\n\n结合这些步骤，得到如下代码序列：\n\n```java\nIntent i = new Intent(this,\
  \ SecondActivity.class);\n\ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT|\n \
  \          Intent.FLAG_ACTIVITY_MULTIPLE_TASK|\n           Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  \nRect rect = new Rect(100, 800, 900, 700);\n\nActivityOptions options = ActivityOptions.makeBasic();\n\
  \nActivityOptions bounds = options.setLaunchBounds(rect);\n\nstartActivity(i, bounds.toBundle());\n\
  ```\n\n当源 activity 处于自由窗口模式时，通过 `intent` 启动第二个 activity，新 activity 窗口将按照 `Rect`\
  \ 对象定义的位置和尺寸出现。\n\n### 63.12 总结\n\nAndroid 7 引入了多窗口支持，该系统允许屏幕上同时同时显示多个 activity。此功能现在成了为折叠设备提供支持的基础。多窗口支持提供的三种模式是分屏、自由窗口和画中画。在分屏模式下，屏幕被水平或垂直分为两个窗格，每个窗格显示一个\
  \ activity。自由窗口模式仅支持某些 Android 设备，允许每个 activity 出现在独立的、可移动且可调整大小的窗口中。如本所示，Android\
  \ SDK 中提供了许多方法和属性设置，用于检测、响应和控制应用内部的多窗口行为。\n\n## 64. Android SQLite 数据库概述\n\n不需要存储至少某些持久化数据的移动应用寥寥无几。使用数据库是大多数应用程序的一个要素，范围从几乎完全由数据驱动的应用到需要存储少量数据（如当前的游戏得分）的应用。\n\
  \n当考虑到典型 Android 应用的瞬态生命周期时，持久化数据存储的重要性变得更加明显。由于 Android 运行时系统始终存在终止应用组件以释放资源的风险，制定一个避免数据丢失的全面数据存储策略是设计和实现任何应用开发策略的关键因素。\n\
  \n本章将涵盖与 Android 操作系统绑定的 SQLite 数据库管理系统，并概述有助于 Android 应用中持久化 SQLite 数据库存储的 Android\
  \ SDK 类。在深入探讨 Android 环境下 SQLite 的细节之前，将对数据库和 SQL 进行简要概述。\n\n### 64.1 理解数据库表\n\n\
  数据库表（Database Tables）提供了数据库中最基础基础的数据结构。每个数据库可以包含多个表，每个表设计用于持有特定类型的信息。例如，数据库可能包含一个客户表，其中包含每个客户的姓名、地址和电话号码。同一个数据库可能还包含一个产品表，用于存储带有关联产品代码的产品描述。\n\
  \n数据库中的每个表都分配有一个名称，该名称在该数据库中必须是唯一的。表名一旦分配给某个数据库中的表，除非在另一个数据库中，否则不能用于另一个表。\n\n###\
  \ 64.2 引入数据库模式\n\n数据库模式（Database Schemas）定义了存储在数据库表中的数据的特征。例如，客户数据库表的表模式可能定义客户名为长度不超过\
  \ 20 个字符的字符串，客户电话号码为具有特定格式的数值数据字段。\n\n模式还用于定义整个数据库的结构。\n\n### 64.3 列和数据类型\n\n在此阶段，将数据库表看作类似于电子表格是有帮助的。每一列（Column）代表对应表中的一个数据字段。例如，表的名称、地址和电话数据字段都是列。\n\
  \n每一列反过来被定义为包含特定类型的数据。因此，设计用于存储数字的列将被定义为包含数值数据。\n\n### 64.4 数据库行\n\n每个保存到表的新记录都存储在行（Row）中。每行反过来由与保存记录相关的列组成。\n\
  \n再次考虑本章早期描述的电子表格类比。客户表中的每个条目等同于电子表格中的行，每一列都包含每个客户的数据。当向表中添加新客户时，会创建一个新行，并将该客户的数据存储在新行的相应列中。\n\
  \n行有时也被记录（records）或条目（entries），这些术语通常可以互换。\n\n### 64.5 引入主键\n\n\n\n\n每个数据库表都应该包含一或多列，这些列可用于唯一标识表中的每一行。这在数据库术语中被称为\
  \ `Primary Key`（主键）。例如，一个表可以使用银行账户号码列作为主键。或者，客户表可以使用客户的社会安全号作为主键。\n\n主键允许数据库管理系统唯一地识别表中的特定行。如果没有\
  \ `primary key`，将无法检索或删除表中的特定行，因为无法确定是否选择了正确的行。例如，假设存在一个表，将客户的姓氏定义为主键。想象一下，如果数据库中记录了多个姓为“Smith”的客户，会产生什么问题。如果没有某种保证的唯一性方法来识别某条特定行，就无法确保在任何时候访问的正确的数据。\n\
  \n主键可以由表中的单列或多列组成。要符合单列主键的条件，任何两行数据都不能包含匹配的主键值。当使用多列来构造主键时，单个列的值不需要是唯一的，但所有列的值组合起来必须是唯一的。\n\
  \n### 64.6 什么是 SQLite？\n\nSQLite 是一种嵌入式关系型数据库管理系统（RDBMS）。大多数关系型数据库（`Oracle`、`SQL\
  \ Server` 和 `MySQL` 为主要示例）都是独立的服务器进程，独立运行并与需要数据库访问的应用程序协作。`SQLite` 被称为嵌入式，是因为它以库的形式提供并链接到应用程序中的。因此，后台没有运行独立的数据库服务器。所有的数据库操作都是通过调用\
  \ `SQLite` 库中的函数在应用程序内部处理的。\n\n`SQLite` 的开发者已将该技术投入了公共领域，结果是它现在成为了一种广泛部署的数据库解决方案。\n\
  \n`SQLite` 使用 `C` 语言编写，因此 Android SDK 为底层数据库接口提供了基于 Java 的“封装器”。这由类组成，可以在应用程序的 `Java`\
  \ 或 `Kotlin` 代码中创建并管理基于 `SQLite` 的数据库。\n\n关于 `SQLite` 的更多信息，请参阅 [`www.sqlite.org`](https://www.sqlite.org)。\n\
  \n### 64.7 结构化查询语言 (SQL)\n\n`SQLite` 数据库使用一种名为 `Structured Query Language`（结构化查询语言）的高级语言访问数据。这通常缩写为\
  \ `SQL`，读音为 sequel。`SQL` 是大多数关系型数据库管理系统使用的标准语言。`SQLite` 大多符合 `SQL-92` 标准。\n\n`SQL`\
  \ 是一种简单且易于使用的语言，专门设计用于启用数据库数据的读取和写。由于 `SQL` 包含一组较小的关键字，因此可以快速学习。此外，大多数 `DBMS` 实现之间的\
  \ `SQL` 语法大体相同，因此在学习了一个系统的 `SQL` 后，你的技能可能会转移到其他数据库管理系统。\n\n虽然本章节将使用一些基础的 `SQL` 语句，但对\
  \ `SQL` 的详细概述超出了本书的范围。然而，许多其他资源提供的 `SQL` 概述比我们希望在这里单章节中能提供的要好得多。\n\n### 64.8 在 Android\
  \ 虚拟设备 (AVD) 上尝试 SQLite\n\n对于对数据库和 `SQLite` 不熟悉的读者来说，直接开始创建一个使用 `SQLite` 的 Android\
  \ 应用程序可能令人生畏畏。幸运的是，Android 预装了 `SQLite`，包括一个交互式环境，可以在连接到运行中的 Android `AVD` 模拟器实例的\
  \ `adb shell` 会话中发布 `SQL` 命令。这是学习 `SQLite` 和 `SQL` 的实用方法，也是识别模拟器中运行的应用程序所创建的数据库问题的工具。\n\
  \n要启动交互式 `SQLite` 会话，首先运行 `AVD` 会话。这可以通过在 Android Studio 中启动 Android 虚拟设备管理器（`Tools\
  \ -> AVD Manager`）、选择一个之前配置过的 `AVD` 并点击启动按钮来实现。\n\n一旦 `AVD` 运行，打开 `Terminal` 或 `Command-Prompt`\
  \ 窗口并使用 `adb` 命令行工具如下所示连接到模拟器（注意 `-e` 标志指示工具查找要连接的模拟器，而不是物理设备）：\n\n```bash\nadb\
  \ -e shell\n```\n\n连接后，shell 环境将提供一个可以在其中输入命令的命令提示符。首先使用 `su` 命令获取超级用户权限：\n\n```\n\
  Generic_x86:/ su\nroot@android:/ #\n```\n\n如果消息显示不允许超级用户权限，则 `AVD` 实例可能包含了 Google\
  \ Play 支持。要解决这个问题，请创建一个新的 `AVD`，并在“Choose a device definition”屏幕上选择一个在“Play Store”列没有标记的设备。\n\
  \n`SQLite` 数据库中的数据存储在运行应用程序的 Android 设备的文件系统的数据库文件中。默认情况下，这些数据库文件的文件系统路径如下：\n\n\
  `/data/data/<package name>/databases/<database filename>.db`\n\n例如，如果包名为 `com.example.MyDBApp`\
  \ 的应用程序创建一个名为 `mydatabase.db` 的数据库，则设备上的文件路径将如下：\n\n`/data/data/com.example.MyDBApp/databases/mydatabase.db`\n\
  \n因此，为了进行练习，请在 `adb shell` 中切换到 `/data/data` 并创建一个适用于某些 `SQLite` 实验的子目录层级：\n\n```bash\n\
  cd /data/data\nmkdir com.example.dbexample\ncd com.example.dbexample\nmkdir databases\n\
  cd databases\n```\n\n为数据库文件创建合适的位置后，启动交互式 `SQLite` 工具：\n\n```\nroot@android:/data/data/databases\
  \ # sqlite3 ./mydatabase.db\nsqlite3 ./mydatabase.db\n```\n\n`SQLite version 3.8.10.2\
  \ 2015-05-20 18:17`\n\n输入 `.help` 获取用法提示。\n\n`sqlite>`\n\n\n\n\n\n在模拟器环境中运行 Android\
  \ 应用程序时，任何数据库文件都将按照之前讨论的路径约定在模拟器的文件系统中创建。这样做的好处是，你可以通过 `adb` 连接，导航到数据库文件所在，将其加载到\
  \ `sqlite3` 交互工具中，并对数据执行操作，以识别应用程序代码中可能出现的问题。\n\n同样需要注意的是，虽然可以通过 `adb shell` 连接到物理\
  \ Android 设备，但默认情况下 shell 并不具备足够的权限来创建和管理 `SQLite` 数据库。因此，数据库问题的调试最好使用 AVD（安卓虚拟设备）会话进行。\n\
  \n### 64.9 Android Room 持久化库\n\n如前所述，`SQLite` 是用 C 语言编写的，而 Android 应用主要使用 `Java`\
  \ 或 `Kotlin` 开发。过去为了弥补这种“语言鸿沟”，Android SDK 包含了一组类，它们在 `SQLite` 数据库管理系统之上提供了一个层。尽管这些类在\
  \ SDK 中可用，但使用这些类仍然需要编写大量的代码，并且没有利用新的架构指南和诸如 `LiveData` 以及生命周期管理等特性。Android Jetpack\
  \ 架构组件包含了 `Room` 持久化库来解决这些缺缺点。该库在 `SQLite` 数据库系统之上提供了一个层级接口，使得能够以最少的代码在 Android\
  \ 设备上本地存储数据，同时符合现代应用架构的建议。\n\n接下来的几章将提供使用 `Room` 持久化库进行 `SQLite` 数据库管理的概述和教程。\n\n\
  ### 64.10 总结\n\n`SQLite` 是一种轻量级的嵌入式关系型数据库管理系统，包含在 Android 框架中，为 Android 应用实现组织的持久化数据存储提供了机制。与\
  \ `Room` 持久化库结合时，Android 提供了一种从 Android 应用内部实现数据存储的现代方法。\n\n本章在 Android 应用开发的背景下，概述了通用数据库并特别概述了\
  \ `SQLite`。接下来的章节将提供 `Room` 持久化库的概述，之后我们将通过创建一个示例应用程序。\n\n# 65. Android Room 持久化库\n\
  \n`Room` 持久化库包含在 Android 架构组件中，旨在以符合 Android 架构指南的方式更容易地为 Android 应用添加数据库存储支持。在上一章涵盖了\
  \ `SQLite` 数据库的基础知识后，本章将探索基于 `Room` 的数据库管理背后的基本概念、在 Android 应用中实现 `Room` 支持的关键元素，以及这些元素在架构和编码方面是如何实现的。在涵盖这些主题后，接下来的两章通过示例\
  \ `Room` 数据库项目将这些理论付诸实践。\n\n### 65.1 回顾现代应用架构\n\n标题为使用 Jetpack 构建现代 Android 应用架构的章节介绍了现代架构的概念，并强调了分离应用内不同责任区域的重要性。图\
  \ 65-1 中所示的图表概述了典型 Android 应用的推荐架构：\n\n![](img/room_diagram_1.jpg)\n\n图 65-1\n\n\
  在本书之前的章节中已经详细介绍了该架构的前三个层，现在是时候在 `Room` 持久化库的背景下探索仓库和数据库架构层了。\n\n## 65.2 Room 数据库持久化的关键元素\n\
  \n在章节稍后进行更详细讨论之前，首先值得总结使用 `Room` 持久化库操作 `SQLite` 数据库时涉及的关键元素：\n\n### 65.2.1 仓库 (Repository)\n\
  \n如前所述，仓库模块包含了直接处理应用所用所有数据源所需的所有。这避免了 UI 控制器和 `ViewModel` 包含直接访问数据库或网络服务的代码的需求。\n\
  \n#### 65.2.2 Room 数据库\n\n`room database` 对象提供了底层 `SQLite` 数据库的接口。它还为仓库提供了访问数据访问对象\
  \ (`DAO`) 的权限。一个应用应该只有一个 `room database` 实例，该实例可以用于访问多个数据库表。\n\n#### 65.2.3 数据访问对象\
  \ (DAO)\n\n`DAO` 包含了仓库在 `SQLite` 数据库中插入、检索和删除数据所需的 `SQL` 语句。这些 `SQL` 语句被映射到方法，然后从仓库内部调用这些方法来执行相应的查询。\n\
  \n#### 65.2.4 实体 (Entities)\n\n实体是定义数据库中表模式的类，它定义了表名、列名和数据类型，并标识哪一列是主键。除了声明表结构外，实体类还包含提供这些数据字段访问的\
  \ getter 和 setter 方法。`DAO` 响应 `SQL` 查询返回给仓库的数据将以实例的形式存在。\n\n#### 65.2.5 SQLite 数据库\n\
  \n`SQLite database` 负责存储和提供数据访问。应用代码（包括仓库）不应直接访问它。所有的数据库操作都是通过 `room database`、`DAOs`\
  \ 和 `entities` 的组合完成的。图 65-2 中的架构图说明了这些元素如何交互以为 Android 应用提供基于 `Room` 的存储：\n\n![](img/room_diagram.jpg)\n\
  \n图 65-2\n\n上述架构中的编号连接可以总结如下：\n\n1. 仓库与 `Room Database` 交互以获取数据库实例，反之用于获取 `DAO`\
  \ 实例的引用。\n2. 仓库创建 `entity` 实例并配置数据，然后将其传递给 `DAO` 用于搜索和插入操作。\n3. 仓库调用 `DAO` 的方法并传递\
  \ `entities` 以插入数据库，并在响应查询时接收 `entity` 实例。\n4. 当 `DAO` 有结果要返回给仓库时，它将它们封装成 `entity`\
  \ 对象。\n5. `DAO` 与 `Room Database` 交互以启动数据库操作并处理结果。\n6. `Room Database` 处理与底层 `SQLite\
  \ database` 的所有交互，提交查询并接收结果。\n\n在涵盖了使用 `Room` 库进行数据库访问的关键要素概述后，是时候详细探索 `entities`、`DAOs`、`room\
  \ databases` 和 `repositories` 了。\n\n### 65.3 理解实体\n\n每个数据库表都有与其关联的实体类。该类定义了表的模式，并以间插了一些特殊\
  \ `Room` 注解的标准 Java 类的形式存在。声明要在数据库表中存储数据的示例 Java 类如下：\n\n```java\npublic class Customer\
  \ {\n    private int id;\n    private String name;\n    private string address;\n\
  \n    public Customer(String name, String address) {\n        this.id = id;\n  \
  \      this.name = name;\n        this.address = address;\n    }\n\n    public int\
  \ getId() {\n        return this.id;\n    }\n}\n```\n\n\n\n\n\n```java\npublic String\
  \ getName() {\n    return this.name;\n}\n\npublic int getAddress() {\n    return\
  \ this.address;\n}\n\npublic void setId(int id) {\n    this.id = id;\n}\n\npublic\
  \ void setName(String name) {\n    this.name = name;\n}\n\npublic void setAddress(int\
  \ quantity) {\n    this.address = address;\n}\n}\n```\n\n按照目前的实现，上述代码声明了一个基础 Java\
  \ 类，其中包含几个表示数据库表字段的变量以及一组 getter 和 setter 方法。然而，该类尚不是一个实体（entity）。要将此类转换为实体并使其能够在\
  \ SQL 语句中访问，需要按照所示添加 Room 注解：\n\n```java\n@Entity(tableName = \"customers\")\n\n\
  public class Customer {\n    @PrimaryKey(autoGenerate = true)\n    @NonNull\n  \
  \  @ColumnInfo(name = \"customerId\")\n    private int id;\n\n    @ColumnInfo(name\
  \ = \"customerName\")\n    private String name;\n\n    private String address;\n\
  \n    public Customer(String name, String address) {\n        this.id = id;\n  \
  \      this.name = name;\n        this.address = address;\n    }\n\n    public int\
  \ getId() {\n        return this.id;\n    }\n\n    public String getName() {\n \
  \       return this.name;\n    }\n\n    public String getAddress() {\n        return\
  \ this.address;\n    }\n\n    public void setId(@NonNull int id) {\n        this.id\
  \ = id;\n    }\n\n    public void setName(String name) {\n        this.name = name;\n\
  \    }\n\n    public void setAddress(int quantity) {\n        this.address = address;\n\
  \    }\n}\n```\n\n上述注解首先声明该类表示一个实体，并分配了名为“customers”的表名。这是在 DAO SQL 语句中引用该表时使用的：\n\
  \n```java\n@Entity(tableName = \"customers\")\n```\n\n每个数据库表都需要一列来作为主键。在这种情况下，customer\
  \ id 被声明为主键。同时还添加了注解来分配一个在 SQL 查询中引用的列名，并指明该字段不能存储空值。最后，id 值被配置为自动生成。这意味着系统会自动为新记录生成\
  \ id，以避免键冲突：\n\n```java\n@PrimaryKey(autoGenerate = true)\n@NonNull\n@ColumnInfo(name\
  \ = \"customerId\")\nprivate int id;\n```\n\ncustomer name 字段也分配了一个列名。但请注意，address\
  \ 字段没有分配列名。这意味着 address 数据仍存储在数据库中，但不需要在 SQL 语句中引用。如果实体中的某个字段不需要存储在数据库中，请使用 `@Ignore`\
  \ 注解：\n\n```java\n@Ignore\nprivate String myString;\n```\n\n最后，对 id 变量的 setter 方法进行了修改，以防止分配空值：\n\
  \n```java\npublic void setId(@NonNull int id) {\n    this.id = id;\n}\n```\n\n注解也可以包含在实体类中，以使用称为外键（foreign\
  \ keys）的关系型数据库数据库概念与其他实体建立关系。外键允许一个表引用另一个表的主键。例如，可以在名为 `Purchase` 的实体与现有的 `Customer`\
  \ 实体之间建立如下关系：\n\n```java\n@Entity(foreignKeys = {@ForeignKey(entity = Customer.class,\n\
  \        parentColumns = \"customerId\",\n        childColumns = \"buyerId\",\n\
  \        onDelete = ForeignKey.CASCADE,\n        onUpdate = ForeignKey.CASCADE)})\n\
  public class Purchase {\n    @PrimaryKey(autoGenerate = true)\n    private int id;\n\
  \n    @ColumnInfo(name = \"buyerId\")\n    private int buyerId;\n}\n```\n\n### 65.4\
  \ 数据访问对象\n\n数据访问对象（DAO）允许访问存储在 SQLite 中的数据。第一步是创建一个接口并使用 `@Dao` 注解对其声明：\n\n```java\n\
  @Dao\npublic interface CustomerDao {\n```\n\n接下来向方法添加条目。例如，下面的声明允许通过名为 `getAllCustomers()`\
  \ 方法检索整个 customers 表：\n\n```java\n@Query(\"SELECT * FROM customers\")\nLiveData<List<Customer>>\
  \ getAllCustomers();\n```\n\n`getAllCustomers()` 方法返回一个 `List` 对象，包含从数据库检索的每条记录对应的\
  \ `Customer` 实体。DAO 还使用了 `LiveData`，以便存储库可以观察数据库的变化。\n\n也可以向方法传递参数。注意，名称带有带有冒号（`:`）：\n\
  \n```java\n@Query(\"SELECT * FROM customers WHERE name = :customerName\")\nList<Customer>\
  \ findCustomer(String customerName);\n```\n\n在此示例中，可以使用 `@Insert` 注解按所示声明基本的插入操作：\n\
  \n```java\n@Insert\nvoid addCustomer(Customer customer);\n```\n\n这被称为便利注解（convenience\
  \ annotation），因为 Room 持久库可以推导出传递给 `addCustomer()` 的 `Customer` 实体将插入数据库，而不需要 SQL\
  \ 语句。也可以在一个事务中插入多条数据库记录，如下：\n\n```java\n@Insert\npublic void insertCustomers(Customer...\
  \ customers);\n```\n\n下面的 DAO 删除了所有匹配客户姓名的记录：\n\n```java\n@Query(\"DELETE FROM customers\
  \ WHERE name = :name\")\nvoid deleteCustomer(String name);\n```\n\n除了使用 `@Query`\
  \ 注解执行删除外，也可以使用 `@Delete` 便利注解。在以下示例中，传递给 `deleteCustomers()` 的所有 `Customer` 记录将从数据库中删除：\n\
  \n```java\n@Delete\npublic void deleteCustomers(Customer... customers);\n```\n\n\
  `@Update` 便利注解在更新记录时提供类似的行为：\n\n```java\n@Update\npublic void updateCustomers(Customer...\
  \ customers);\n```\n\n此类数据库操作的 DAO 方法也可以声明为返回一个 `int` 值，表示受事务影响的行数，例如：\n\n```java\n\
  @Delete\npublic int deleteCustomers(Customer... customers);\n```\n\n### 65.5 Room\
  \ Database\n\nRoom 类通过扩展 `RoomDatabase` 类创建，作为嵌入 Android 操作系统的实际数据库之上的层。该类负责创建并返回新的\
  \ 数据库实例，并提供对关联 DAO 实例的访问。\n\nRoom 持久库提供了创建数据库实例的构建器。每个 Android 应用应该只有一个数据库实例，因此最好在类中实现防御性代码以防止创建多个实例。\n\
  \n用于示例客户表的 Room 实现如下代码列表所示：\n\n```java\nimport android.content.Context;\nimport\
  \ android.arch.persistence.room.Database;\nimport android.arch.persistence.room.Room;\n\
  import android.arch.persistence.room.RoomDatabase;\n\n@Database(entities = {Customer.class},\
  \ version = 1)\npublic class CustomerRoomDatabase extends RoomDatabase {\n    private\
  \ static volatile CustomerRoomDatabase INSTANCE;\n\n    public static CustomerRoomDatabase\
  \ getInstance(Context context) {\n        if (INSTANCE == null) {\n            synchronized\
  \ (CustomerRoomDatabase.class) {\n                if (INSTANCE == null) {\n    \
  \                INSTANCE = Room.databaseBuilder(\n                            context.getApplicationContext(),\n\
  \                            CustomerRoomDatabase.class, \"customer_database\")\n\
  \                            .build();\n                }\n            }\n     \
  \   }\n        return INSTANCE;\n    }\n\n    public abstract CustomerDao customerDao();\n\
  }\n```\n\n\n\n\n\n```java\n    private static CustomerRoomDatabase INSTANCE;\n\n\
  \    static CustomerRoomDatabase getDatabase(final Context context) {\n        if\
  \ (INSTANCE == null) {\n            synchronized (CustomerRoomDatabase.class) {\n\
  \                if (INSTANCE == null) {\n                    INSTANCE = Room.databaseBuilder(\n\
  \                            context.getApplicationContext(),\n                \
  \            CustomerRoomDatabase.class, \"customer_database\")\n              \
  \              .build();\n                }\n            }\n        }\n        return\
  \ INSTANCE;\n    }\n}\n```\n\n上述示例中需要注意的重要区域是：类声明上方声明数据库要操作实实体注解、检查类实例是否已经创建的代码，以及为实例分配的名称\
  \ `customer_database`。\n\n# 65.6 仓库 (Repository)\n\n仓库负责获取 `Room Database` 实例，使用该实例访问关联的\
  \ `DAOs`，然后调用 `DAO` 方法执行数据库操作。一个旨在与 `Room Database` 工作的典型仓库构造函数可能如下：\n\n```java\n\
  public class CustomerRepository {\n\n    private CustomerDao customerDao;\n\n  \
  \  private CustomerRoomDatabase db;\n\n    public CustomerRepository(Application\
  \ application) {\n        db = CustomerRoomDatabase.getDatabase(application);\n\
  \        customerDao = db.customerDao();\n    }\n\n}\n```\n\n一旦仓库可以访问 `DAO`，它就可以调用数据访问方法。例如，下面的代码调用了\
  \ `getAllCustomers()` `DAO` 方法：\n\n```java\nprivate LiveData<List<Customer>> allCustomers;\n\
  \nallCustomers = customerDao.getAllCustomers();\n```\n\n在调用 `DAO` 方法时，需要注意的是，除非该方法返回\
  \ `LiveData` 实例（该实例会自动在单独的线程上运行查询），否则无法在应用的主线程上执行操作。尝试这样做会导致应用崩溃并输出以下诊断信息：\n\n`Cannot\
  \ access database on the main thread since it may potentially lock the UI for a\
  \ long period of time`\n\n由于某些数据库事务可能需要更长时间才能完成，在单独线程上运行操作可以避免应用出现假死状态。正如标题为 “Android\
  \ Room 数据库和仓库教程” 的章节将演示的，这个问题可以通过使用 Java 线程轻松解决（如需更多信息或提醒如何使用线程，请参阅标题为 “Java 线程、Handlers\
  \ 和执行器基础概述” 的章节）。\n\n### 65.7 内存数据库\n\n本章概述的示例使用了作为 Android 设备持久化存储上数据库文件的 `SQLite`\
  \ 数据库。这确保了即使在应用进程终止后数据仍然存在。\n\nRoom 数据库持久化库还支持内存数据库。这些数据库完全位于内存中，并在应用终止时丢失。与内存数据库工作所需的唯一更改是调用\
  \ `Room Database` 类的 `Room.inMemoryDatabaseBuilder()` 方法，而不是 `Room.databaseBuilder()`。下面的代码显示了方法调用之间的区别（注意内存数据库不需要数据库名称）：\n\
  \n```java\n// 创建基于文件的存储数据库\nINSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n\
  \                                     CustomerRoomDatabase.class, \"customer_database\"\
  )\n                                     .build();\n\n// 创建内存数据库\nINSTANCE = Room.inMemoryDatabaseBuilder(context.getApplicationContext(),\n\
  \                                     CustomerRoomDatabase.class)\n            \
  \                         .build();\n```\n\n### 65.8 数据库检查器 (Database Inspector)\n\
  \nAndroid Studio 包含一个 Database Inspector 工具，它允许对与其关联的数据库进行查看、搜索和修改，如图 65-3 所示。\n\
  \n### 65.9 总结\n\nRoom 持久化库与 Android 组件捆绑，并作为 SQLite 之上的抽象层。该库的设计旨在使其符合 Android 指南的同时，使数据库操作变得更加简单。本章介绍了这些元素。在涵盖了\
  \ SQLite 基础和 Room 架构之后，下一步是创建一个将这些理论付诸实践的示例。\n\n# 66. TableLayout 和 TableRow 教程\n\
  \n当开始编写本书下一章（“Android Room 数据库和仓库教程”）的工作时，最初打算包含设计用户界面的步骤。然而，显而易见，实现用户界面的最佳方法是使用\
  \ `TableLayout` 和 `TableRow`，这个主题值得作为一个独立的章节。因此，本章将专门关注用户界面。\n\n### 66.1 TableLayout\
  \ 和 TableRow 布局视图\n\n`TableLayout` 容器视图允许用户界面元素以由行和列组成的表格格式组织在屏幕上。`TableLayout`\
  \ 中的每一行由一个 `TableRow` 实例占据，而 `TableRow` 又被分为单元格，每个单元格包含一个子视图。\n\n表格中的列数由列数最多的行决定，默认情况下，每列的宽度由该列中最宽的单元格定义。列可以配置为可收缩或可伸伸（或两者兼有），以便它们相对于父级\
  \ `TableLayout` 改变大小。此外，单个单元格可以配置为跨越多个列。\n\n考虑图 66-1 所示的用户界面布局 (#TableLayout.xhtml__idTextAnchor1298)：\n\
  \n从布局的视觉外观来看，很难识别出用于设计界面的 `TableLayout` 结构。然而，图 66-2 所示的层级树图 (#TableLayout.xhtml__idTextAnchor1299）让结构变得更容易理解。\n\
  \n### 66.2 创建 Room 数据库项目\n\n\n\n\n\n从欢迎界面选择 `New Project` 菜单选项，在弹出的新项目对话框中，在点击 `Next`\
  \ 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `RoomDemo` 并指定 `com.ebookfrenzy.roomdemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。\n\n按照第 11.8 Migrating a Project to View Binding 节概述的步骤将项目迁移到视图绑定。\n\
  \n### 66.3 转换为 LinearLayout\n\n在 Project 工具窗口（`app -> res -> layout`）中找到 `activity_main.xml`\
  \ 文件，并双击将其加载到 `Layout Editor` 工具中。默认情况下，Android Studio 使用 `ConstraintLayout` 作为用户界面根布局元素。这需要将其转换为垂直方向的\
  \ `LinearLayout`。\n\n在设计模式下的 `Layout Editor` 工具中，在 `Component Tree` 面板中找到 `ConstraintLayout`\
  \ 组件，右键点击它以显示图 66-3 所示的菜单，并选择 `Convert view...` ：\n\n![](img/as_convert_view_menu.jpg)\n\
  \n**图 66-3**\n\n在弹出的对话框（图 66-4）中，在点击 `Apply` 按钮之前，选择转换为 `LinearLayout` 的选项：\n\n\
  ![](img/as_convert_view_dialog.jpg)\n\n**图 66-4**\n\n默认情况下，布局编辑器会将 `ConstraintLayout`\
  \ 转换为水平的 `LinearLayout`，因此在 `Component Tree` 窗口中选择布局组件，参考 `Attributes` 工具窗口，并将 `orientation`\
  \ 属性更改为 `vertical`：\n\n![](img/as_linear_orientation.jpg)\n\n**图 66-5**\n\n转换完成后，选择并删除布局中的默认\
  \ `TextView` 小部件。\n\n## 66.4 向用户界面添加 TableLayout\n\n留在 `activity_main.xml` 文件中，并参考\
