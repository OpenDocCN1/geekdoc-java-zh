  \n### 83.15 故障排除\n\n如果你在购买时遇到问题，请确保设备已通过 USB 线或 WiFi 连接到 Android Studio，并在 Logcat\
  \ 面板中选择它。在 Logcat 搜索栏中输入 `InAppPurchaseTag` 并检查诊断输出，必要时在代码中添加额外的 `Log` 调用。关于失败的额外信息，一个实用的技巧是从\
  \ `BillingResult` 实例访问调试消息，例如：\n\n```java\n.\n.\n} else if (billingResult.getResponseCode()\
  \ == BillingClient.BillingResponseCode.USER_CANCELED) {\n    Log.i(TAG, \"onPurchasesUpdated:\
  \ Purchase Canceled\");\n} else {\n    Log.i(TAG, billingResult.getDebugMessage());\n\
  }\n```\n\n注意，只要由于你不更改模块级 `build.gradle.kts` 文件中的应用程序版本号，你现在应该就可以直接在设备或模拟器上运行修改过的应用程序，而无需重新安装。\n\
  \n### 83.16 总结\n\n在本章中，我们创建了一个演示应用内购买的项目。我们解释了如何初始化计单客户端、查询产品以及消耗它们。我们还涵盖了如何使用 Play\
  \ Console 进行测试。\n\n# 84 使用 Material Design 主题\n\nAndroid 应用程序的外观旨在符合 Material Design。Google\
  \ 开发 Material Design 是为了在不同应用程序之间提供设计一致性，同时允许应用程序开发者在颜色、字体和形状选择方面包含他们自己的品牌（这一概念被称为“主题化”）。本章将概述主题化在\
  \ Android 项目中是如何运作的。\n\n## 84.1 Material Design 2 vs. Material Design 3\n\n在开始之前，重要的是，Google\
  \ 正在从 Material Design 2 过渡到 Material Design 3，并且 Android Studio Giraffe 项目默认使用 Material\
  \ Design 3。Material Design 3 是 Material You 的基础，这是 Android 12 中引入的一项功能，允许应用程序自动调整主题元素以匹配偏好。例如，Material\
  \ Design 3 提供的动态颜色支持允许应用程序中使用的颜色进行适应以匹配用户的选择。\n\n## 84.2 理解 Material Design 主题\n\
  \n我们知道 Android 应用程序的用户界面是通过组装布局、文本字段和按钮等组件创建的。除非我们专门在 XML 资源文件中通过代码覆盖颜色属性，否则这些组件将使用默认颜色。项目的主题定义了这些默认颜色。主题由一组颜色槽（定义在\
  \ `themes.xml` 文件中）组成，并分配了颜色值（定义在 `colors.xml` 文件中）。每个 UI 组件内部编写为使用主题颜色槽作为特定属性的默认颜色（例如\
  \ `Text` 组件的前景和背景颜色）。因此，我们可以通过更改分配给特定颜色槽的颜色来更改整个应用程序的主题。当应用程序运行时，在渲染用户界面时将使用新的默认颜色。\n\
  \n### 84.3 Material Design 3 主题\n\n在探索 Material Design 3 之前，我们必须考虑它在 Android Studio\
  \ 项目中是如何使用的。应用程序项目使用的主题被声明为 `AndroidManifest.xml` 文件中 `application` 元素的属性，例如：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\">\n    <application\n    \
  \    android:supportsRtl=\"true\"\n        android:theme=\"@style/Theme.MyDemoApp\"\
  \n        tools:targetApi=\"31\">\n        <activity\n.\n.\n</application>\n</manifest>\n\
  ```\n\n\n\n\n\n如前所述，所有与项目主题相关的文件都包含在 `res -> values` 文件夹下的 `colors.xml` 和 `themes.xml`\
  \ 文件中，如图 84-1 所示：\n\n![](img/as_theme_files.jpg)\n\n图 84-1\n\n主题本身在位于 `themes` 文件夹下的两个\
  \ `themes.xml` 文件中声明。这些资源文件声明了不同的调色板，其中包含 Material 主题颜色槽，供设备在亮色或深色（夜间）模式下使用。请注意，每个文件中的\
  \ `style name` 属性必须与 `AndroidManifest.xml` 文件中引用的匹配，例如：\n\n```xml\n<resources xmlns:tools=\"\
  http://schemas.android.com/tools\">\n    <!-- 应用主题。 -->\n    <style name=\"Base.Theme.MyDemoApp\"\
  \ parent=\"Theme.Material3.DayNight.NoActionBar\">\n        <!-- 在此处自定义您的亮色主题。 -->\n\
  \        <!-- <item name=\"colorPrimary\">@color/my_light_primary</item> -->\n \
  \   </style>\n    <style name=\"Theme.MyDemoApp\" parent=\"Base.Theme.MyDemoApp\"\
  \ />\n</resources>\n```\n\n这些颜色槽（也称为颜色属性）用于 Material 组件在屏幕上渲染时设置颜色。例如，`colorPrimary`\
  \ 颜色槽被用作 `Material Button` 组件的背景颜色。\n\nMD3 中的颜色槽被分为 Primary（主）、Secondary（次）、Tertiary（三级）、Error（错误）、Background（背景）和\
  \ Surface（表面）。这些槽进一步分为成对，由一个基础颜色和一个“在其上的”基础颜色组成。这通常对应于 Material 组件的背景色和前景色。\n\n\
  不同组件所使用的特定组会有所不同。例如，`Material Button` 组件将使用 `colorPrimary` 基础颜色作为背景色，并使用 `colorOnPrimary`\
  \ 作为其内容（即显示的文本或图标）。另一方面，`FloatingActionButton` 组件使用 `colorPrimaryContainer` 作为背景色，并使用\
  \ `colorOnPrimaryContainer` 作为前景色。通常可以通过更改主题文件中的颜色设置并查看布局编辑器中的渲染结果，来快速识别特定组件类型的正确组。\n\
  \n假设我们需要将 `colorPrimary` 改为红色。我们通过在 `colors.xml` 文件中为红色添加新条目，然后将其分配给 `themes.xml`\
  \ 文件中的 `colorPrimary` 槽来实现这一目标。因此，MD3 主题夜间模式下的 `colorPrimary` 槽读取如下：\n\n```xml\n\
  <resources xmlns:tools=\"http://schemas.android.com/tools\">\n    <!-- 应用主题。 -->\n\
  \    <style name=\"Base.Theme.MyDemoApp\" parent=\"Theme.Material3.DayNight.NoActionBar\"\
  >\n        <item name=\"colorPrimary\">@color/my_bright_primary</item>\n    </style>\n\
  \    <style name=\"Theme.MyDemoApp\" parent=\"Base.Theme.MyDemoApp\" />\n</resources>\n\
  ```\n\n该颜色随后在 `colors.xml` 文件中声明：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<resources>\n    <color name=\"my_bright_primary\">#FC0505</color>\n</resources>\n\
  ```\n\n### 84.4 构建自定义主题\n\n正如我们所见，实现主题的代码工作相对简单。然而，困难的部分通常是选择互补色来组成主题。幸运的是，Google\
  \ 开发了一个工具，可以轻松为您的应用设计自定义颜色主题。该工具被称为 Material Theme Builder，可以在此处访问：\n\n[`m3.material.io/theme-builder#/`](https://m3.material.io/theme-builder#/dynamic)\n\
  \n在自定义屏幕（图 84-2）上，通过点击颜色圆显示颜色选择对话框，为主色键值 (A) 进行颜色选择。一旦选择了颜色，预览 (B) 将发生变化，以反映所有 MD3\
  \ 颜色槽的推荐颜色，以及示例应用界面和组件。此外，您可以通过点击相应的颜色圆显示颜色选择对话框，来覆盖为 Secondary、Tertiary 和 Neutral\
  \ 槽生成的颜色。\n\n标记为 B 的区域显示了示例应用界面、亮/深色配色方案图以及更新以预览您的颜色选择的组件。由于面板比典型的浏览器窗口长，您必须向下滚动以查看所有信息。\n\
  \n要将主题整合到您的设计中，点击导出按钮 (C) 并选择 Android View (XML) 选项。下载后，可以使用 `colors.xml` 和 `themes.xml`\
  \ 文件替换项目中的现有文件。注意，导出的两个 `themes.xml` 文件中的主题名称必须更改以匹配您的项目。\n\n![](img/theme_builder_custom.jpg)\n\
  \n图 84-2\n\n### 84.5 总结\n\nMaterial Design 提供了定义 Android 应用外观的指南和组件。通过设计指定显示应用时使用的颜色、字体和形状的主题，可以应用应用个人品牌。Google\
  \ 最近引入了 Material Design 3，它取代了 Material Design 2 并支持 Material You 的新功能，包括动态颜色。Google\
  \ 还提供了 Material Theme Builder 来设计您自己的主题，这减轻了选择互补色的任务。一旦使用此工具设计了主题，就可以导出相应的文件并在 Android\
  \ Studio 项目中使用。\n\n## 85. Material Design 3 主题化与动态颜色\n\n本章将向您展示如何使用 Material Theme\
  \ Builder 创建新的 Material Design 3 主题并将其集成到 Android Studio 中。教程还将演示如何为应用添加并测试动态颜色。\n\
  \n### 85.1 创建 ThemeDemo 项目\n\n在欢迎屏幕上选择 New Project，并在新项目对话框中选择 Empty Views Activity\
  \ 模板，然后点击 Next 按钮。在 Name 字段中输入 ThemeDemo，并指定 com.ebookzy.themedemo 为包名。在点击 Finish\
  \ 按钮之前，将 Minimum API level 改为 API 26: Android 8.0 (O)，并将 Language 设置为 Java。\n\n\
  ### 85.2 设计用户界面\n\n界面将由一个简单的布局组成，包含一些组件，以便看到之后执行的主题化效果。有关 MD3 组件的信息，请参考以下网页：\n\n\
  [`material.io/blog/migrating-3`](https://material.io/blog/migrating-3)\n\n布局将在 activity_main.xml\
  \ 文件中设计，该文件当前包含单个 Text view。在布局编辑器中打开此文件，删除 Text view，关闭自动连接模式（图 85-1 中的 A），并点击按钮清除布局的所有约束\
  \ (B)。\n\n![](img/as_theme_demo_layout_buttons.jpg)\n\n图 85-1\n\n从 Palette 的 Buttons\
  \ 部分将 Chip、CheckBox、Switch 和 Button 拖到布局画布上。接下来，将 FloatingActionButton 拖到画布上并放置在\
  \ Button 组件下方。当提示为 FloatingActionButton 选择一个图标时，从资源工具窗口选择 ic_lock_power_off 图标，如图\
  \ 85-2 所示：\n\n![](img/as_theme_demo_layout_pick_icon.jpg)\n\n图 85-2\n\n将 Chip 组件的\
  \ text 属性更改为“This is my chip”，并将 chipIcon 属性设置为 android:drawable/ic_btn_speak_now，使布局类似于图\
  \ 85-3 左侧所示的内容：\n\n![](img/as_theme_demo_ui.jpg)\n\n图 85-3\n\n为了设置约束，选择所有组件，右键点击\
  \ Chip 视图，并在生成的菜单中选择 Chains -> Create Vertical Chain。重复此步骤，这次选择 Center -> Horizontally\
  \ in Parent 选项。\n\n\n\n\n在设备或模拟器上编译并运行应用，并验证用户界面与上方图 85-3 中所示的内容一致。下一步是创建一个自定义主题并将其应用到项目中。\n\
  \n### 85.4 构建新主题\n\n首先，打开浏览器窗口并导航到以下 URL 以访问构建工具：\n\n[`m3.material.io/theme-builder#/custom`](https://m3.material.io/theme-builder#/custom)\n\
  \n加载构建器后，选择一张壁纸，然后点击屏幕顶部的 `Custom` 按钮，接着点击 `Core Colors` 部分中的 `Primary` 颜色圆形以显示颜色选择器。从颜色选择器中，选择任意颜色作为主题的基础：\n\
  \n![](img/theme_builder_color_dialog.jpg)\n\n图 85-4\n\n在 `Your Theme` 面板中检查颜色方案，并使用\
  \ `Core colors` 设置进行必要的颜色调整，直到你对颜色槽满意。主题准备好后，点击右上角的 `Export` 按钮并选择 `Android Views\
  \ (XML)` 选项。在提示时，将文件保存到计算机文件系统的合适位置。该主题将保存为名为 `material-theme.zip` 的压缩文件。\n\n使用适用于你操作系统的工具解压主题文件，它应该包含在名为\
  \ `material-theme` 的文件夹中的以下文件夹和文件：\n\n* `values/colors.xml` - 颜色定义。\n* `values/themes.xml`\
  \ - 亮色模式主题。\n* `values-night/themes.xml` - 暗色模式主题。\n\n现在主题文件已经生成，需要将其集成到 Android\
  \ Studio 项目中。\n\n### 85.5 将主题添加到项目\n\n在将新主题添加到项目之前，我们首先需要移除旧的主题文件。如果 `Project` 工具窗口处于\
  \ `Project Files` 模式，操作会更简单。要切换模式，使用如下所示 `Project` 工具窗口顶部的菜单，并选择 `Project Files`\
  \ 选项：\n\n![](img/as_project_files.jpg)\n\n图 85-5\n\n在选中 `Project Files` 模式的情况下，导航到\
  \ `app` -> `src` -> `main` -> `res` -> `values` 文件夹，选择并删除 `colors.xml` 和 `themes.xml`\
  \ 文件。同样，删除位于 `values-night` 文件夹中的 `themes.xml` 文件。\n\n打开你操作系统的文件导航工具，找到新 material\
  \ 主题 `values` 文件夹中的 `colors.xml` 和 `themes.xml` 文件，并将它们复制粘贴到 `Project` 工具窗口中的 `values`\
  \ 文件夹。重复此步骤复制 `values-night` 文件夹中的 `themes.xml` 文件，这次将其粘贴到 `values-night` 文件夹。\n\
  \n将 `Project` 工具窗口切换回 `Android` 模式，此时值资源文件部分应与图 85-6 匹配：\n\n![](img/as_theme_new_theme_files.jpg)\n\
  \n图 85-6\n\n接下来，修改亮色 `themes.xml` 文件以匹配当前项目：\n\n```xml\n<resources>\n    <style\
  \ name=\"Base.Theme.ThemeDemo\" parent=\"Theme.Material3.Light.NoActionBar\">\n\
  \        <item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n    \
  \    <item name=\"colorOnPrimary\">@color/md_theme_light_onPrimary</item>\n    </style>\n\
  \    <style name=\"Theme.ThemeDemo\" parent=\"Base.Theme.ThemeDemo\" />\n</resources>\n\
  ```\n\n重复这些步骤对 `themes.xml (night)` 文件进行相同的修改。\n\n返回 `activity_main.xml` 文件或重新运行应用，以确认用户界面已使用自定义主题颜色渲染。\n\
  \n# 85.6 启用动态颜色支持\n\n应用需要在运行 Android 12 或更高版本的设备或模拟器上运行，并具有正确的壁纸设置，以测试动态颜色。在设备或模拟器上，启动\
  \ `Settings` 应用并从选项列表中选择 `Wallpaper & style`。在壁纸设置屏幕上，点击更改壁纸的选项（如在图 85-7 中标记为 A），并选择一张颜色与你主题颜色显著不同的壁纸图像。一旦选择完成，将壁纸分配到主屏幕。\n\
  \n返回 `Wallpaper & styles` 屏幕，在从颜色方案按钮中选择选项 (C) 之前，确保已选择 `Wallpaper colors` 选项 (B)。每点击一个选项，壁纸示例都将更改以反映选择：\n\
  \n![](img/compose_theme_wallpaper_and_styles.jpg)\n\n图 85-7\n\n要启用动态颜色，我们需要调用 `DynamicColors`\
  \ 类的 `applyToActivitiesIfAvailable()` 方法。为了为整个应用启用动态颜色支持，这需要在自定义 `Application` 实例的\
  \ `onCreate()` 方法内部调用。首先，在项目的 `app` -> `java` -> `com.ebookfrenzy.themedemo` 下添加一个名为\
  \ `ThemeDemoApplication.java` 的新 Java 类文件，并对其进行修改如下：\n\n```java\npackage com.ebookfrenzy.themedemo;\n\
  \nimport android.app.Application;\n\nimport com.google.android.material.color.DynamicColors;\n\
  \npublic class ThemeDemoApplication extends Application {\n    @Override\n    public\
  \ void onCreate() {\n        super.onCreate();\n        DynamicColors.applyToActivitiesIfAvailable(this);\n\
  \    }\n}\n```\n\n创建自定义的 `Application` 类后，我们必须配置项目使用它而不是默认的 `Application`。要此操作，编辑\
  \ `AndroidManifest.xml` 文件并添加引用新类的 `android:name` ：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.themedemo\">\n    <application\n        android:name=\"\
  .ThemeDemoApplication\"\n        android:allowBackup=\"true\">\n        ...\n  \
  \  </application>\n</manifest>\n```\n\n构建并运行应用，并注意布局使用了壁纸颜色。将 ThemeDemo 应用置后，返回\
  \ `Wallpaper & styles` 设置并选择一张不同的壁纸。将 ThemeDemo 应用带回前台。此时，它已动态地适应了新的壁纸。\n\n# 85.7\
  \ 预览动态颜色\n\n动态颜色行为也可以在 Android Studio 布局编辑器中预览。要尝试这一点，打开 `activity_main.xml` 文件，点击主题菜单并选择\
  \ `More Themes` 选项，如图 85-8 所示：\n\n![](img/as_layout_editor_themes_menu.jpg)\n\n\
  图 85-8\n\n接下来，在主题选择对话框中使用搜索字段列出动态主题：\n\n![](img/as_layout_editor_select_theme.jpg)\n\
  \n图 85-9\n\n在点击 `OK` 按钮之前，选择 `Material3.DynamicColors.DayNight` 主。返回布局编辑器后，选择 `System\
  \ UI Mode` 菜单并选择一个壁纸选项，如图 85-10 所示：\n\n![](img/as_layout_editor_dynamic_themes.jpg)\n\
  \n图 85-10\n\n一旦选择了壁纸，布局组件的颜色将随之改变。\n\n### 85.8 总结\n\n在本章中，我们使用了 Material Theme Builder\
  \ 设计了一个新主题，并解释了将生成的主题文件到 Android Studio 项目中的步骤。最后，章节介绍了如何实现和使用 Material You 动态颜色功能。\n\
  \n# 86. Android Studio 中 Gradle 概述\n\n到目前为止，一直认为 Android Studio 会采取编译和运行所创建的项目所需的步骤。Android\
  \ Studio 一直通过使用名为 Gradle 的系统在后台实现这一点。\n\n现在是查看 Gradle 如何被用于编译和打包应用程序的各个元素，并开始探索在构建项目需要更高级需求时如何配置该系统的时候。\n\
  \n## 86.1 An Overview of Gradle\n\n\n\nGradle 是一个自动化构建工具包，它允许通过一组构建配置文件来配置和管理项目的构建方式。这包括定义项目将如何构建、成功构建项目需要满足哪些依赖项，以及构建过程的最终结果（或多个结果）应该是什么。\n\
  \nGradle 的优势在于它为开发者提供的灵活性。Gradle 系统是一个自包含包含的、基于命令行的环境，可以通过插件集成到其他环境中。在 Android Studio\
  \ 的情况下，Gradle 集成是通过命名相应的 Android Studio 插件提供的。\n\n尽管 Android Studio 插件允许在 Android\
  \ Studio 内部启动和管理 Gradle 任务，但仍然可以使用 Gradle 命令行包装器（wrapper）来构建基于 Android Studio 的项目，包括在未安装\
  \ Android Studio 的系统上。\n\n构建项目的配置规则声明在基于 Groovy 编程语言的 Gradle 构建文件和脚本中。\n\n### 86.2\
  \ Gradle 与 Android Studio\n\nGradle 为构建 Android 应用程序项目带来了许多强大的功能。一些关键特性如下：\n\n###\
  \ 86.2.1 合理的默认值\n\nGradle 实现了一种被称为“约定优于配置”（convention over configuration）的概念。这意味着\
  \ Gradle 拥有一套预定义的合理默认配置设置，除非构建文件中的设置覆盖了它们，否则将使用这些设置。这意味着可以使用开发者所需的最少配置进行构建。只有当默认配置不能满足你的构建需求时，才需要对构建文件进行更改。\n\
  \n### 86.2.2 依赖\n\nGradle 功能的另一个关键领域是依赖项。例如，考虑 Android Studio 项目中的一个模块，它触发了一个意图来加载项目中的另一个模块。第一个模块实际上对第二个模块有依赖，因为如果从运行时无法找到并启动第二个模块，应用程序将无法构建。这种依赖关系可以在第一个模块的\
  \ Gradle 构建文件中声明，以便将第二个模块包含在应用程序构建中，或者在找不到或无法构建第二个模块时标记错误。依赖项的其他示例是项目编译和运行所依赖的库和\
  \ JAR 文件。\n\nGradle 依赖项可以分为本地或远程。本地依赖项引用执行构建的计算机系统本地文件系统的项。远程依赖项引用远程服务器（通常称为仓库）上的项。\n\
  \nAndroid Studio 项目的远程依赖项使用另一个名为 Maven 的项目管理工具进行处理。如果在 Gradle 构建文件中使用 Maven 语法声明了远程依赖项，则该依赖项将从指定的仓库自动下载并包含在构建过程中。例如，下面的依赖声明将导致从\
  \ Google 仓库向项目添加 AppCompat 库：\n\n```\nimplementation(\"androidx.appcompat:appcompat:1.6.1\"\
  )\n```\n\n### 86.2.3 构建变体\n\n除了依赖之外，Gradle 还为 Android Studio 项目提供构建变体支持。这允许从单个项目构建应用程序的多个变。Android\
  \ 运行许多不同的设备，涵盖各种处理器类型和屏幕尺寸。为了尽可能针对广泛设备类型和尺寸，通常需要构建应用程序的多个变体（例如，一个带有手机界面，另一个用于平板电脑屏幕）。通过使用\
  \ Gradle，这现在 Android Studio 中是可以实现的。\n\n### 86.2.4 Manifest 条目\n\n每个 Android Studio\
  \ 项目都关联有一个 `AndroidManifest.xml` 文件，其中包含应用程序的配置详情。在 Gradle 构建文件中可以指定多个清单条目，这些条目在项目构建时会自动生成到清单文件中。此功能补充了构建变体功能，允许应用程序版本号、应用\
  \ ID 和 SDK 版本信息等元素为每个构建变体进行不同的配置。\n\n### 86.2.5 APK 签名\n\n创建、测试和上传 Android App Bundle\
  \ 章节涵盖了使用 Android Studio 环境创建签名的发布 APK 文件。也可以将通过 Android Studio 用户界面输入的签名信息包含在 Gradle\
  \ 构建文件中，以便从命令行生成带签名的 APK 文件。\n\n### 86.2.6 ProGuard 支持\n\nProGuard 是 Android Studio\
  \ 自带的一个工具，它可以优化、压缩和混淆 Java 字节码，使其更高效且更难被反向工程（即他人通过分析编译后的 Java 字节码来识别应用程序逻辑的方法）。Gradle\
  \ 构建文件允许你控制在构建你的应用程序时是否运行 ProGuard。\n\n## 86.3 属性与设置 Gradle 构建文件\n\ngradle 构建配置由配置、属性属性和设置文件组成。例如，`gradle.properties`\
  \ 文件主要包含与 Java 虚拟机 (JVM) 使用的命令行标志相关的特殊设置，以及项目是否使用 AndroidX 库和 Kotlin 编码风格支持。作为典型用户，你可能不需要更改此文件中的任何设置。\n\
  \n另一方面，`settings.gradle.kts` 文件定义了当构建系统需要下载和安装构建项目所需的任何额外库和插件时，应搜索哪些在线仓库，以及项目名称。一个典型的\
  \ `settings.gradle.kts` 文件内容如下：\n\n```kotlin\npluginManagement {\n    repositories\
  \ {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n  \
  \  }\n}\n\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n\
  \    repositories {\n        google()\n        mavenCentral()\n    }\n}\n\nrootProject.name\
  \ = \"ThemeDemo\"\n\ninclude(\":app\")\n```\n\n与 `gradle.properties` 一样，可能不需要对此文件进行更改。\n\
  \n## 86.4 顶层 Gradle 文件\n\n一个完整的 Android Studio 项目包含构建所需的所有，由模块、库、清单文件和 Gradle 构建文件组成。\n\
  \n每个项目包含一个顶层 Gradle 构建文件。该文件列为 `build.gradle.kts`（项目 `<project name>`），可以在项目窗口中找到，如图\
  \ 86-1 (#Gradle_Overview.xhtml__idTextAnchor1667) 所示：\n\n![](img/as_gradle_file.jpg)\n\
  \n图 86-1\n\n默认情况下，文件的内容如下：\n\n```kotlin\n// 顶部构建文件，可以在此处添加适用于所有子项目/模块的配置选项。\nplugins\
  \ {\n    id(\"com.android.application\") version \"8.1.0-rc01\" apply false\n}\n\
  ```\n\n目前，该文件仅声明使用 jcenter 仓库获取远程库，并且构建依赖于 Android 插件。在大多数情况下，不需要对此文件进行任何更改。\n\n\
  ## 86.5 模块级 Gradle 构建文件\n\nAndroid Studio 应用程序项目由一个或多个模块组成。考虑一个名为 GradleDemo 的假设应用程序项目，它分别包含\
  \ Module1 和 Module2。在这种情况下，每个模块都需要自己的 Gradle 构建文件。从项目结构来看，这些文件的位置如下：\n\n• `Module1/build.gradle.kts`\n\
  • `Module2/build.gradle.kts`\n\n默认情况下，Module1 的 `build.gradle.kts` 文件类似于下面的列表：\n\
  \n```kotlin\nplugins {\n    id(\"com.android.application\")\n}\n\nandroid {\n  \
  \  namespace = \"com.example.gradlesample\"\n    compileSdk = 33\n}\n```\n\n\n\n\
  ```gradle\ndefaultConfig {\n        applicationId = \"com.example.gradlesample\"\
  \n        minSdk = 26\n        targetSdk = 33\n        versionCode = 1\n       \
  \ versionName = \"1.0\"\n        testInstrumentationRunner = \"androidx.test.runner.AndroidJUnitRunner\"\
  \n    }\n    buildTypes {\n        release {\n            isMinifyEnabled = false\n\
  \            proguardFiles(\n                getDefaultProguardFile(\"proguard-android-optimize.txt\"\
  ),\n                \"proguard-rules.pro\"\n            )\n        }\n    }\n  \
  \  compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_1_8\n   \
  \     targetCompatibility = JavaVersion.VERSION_1_8\n    }\n}\n\ndependencies {\n\
  \    implementation(\"androidx.appcompat:appcompat:1.6.1\")\n    implementation(\"\
  com.google.android.material:material:1.9.0\")\n    implementation(\"androidx.constraintlayout:constraintlayout:2.1.4\"\
  )\n    testImplementation(\"junit:junit:4.13.2\")\n    androidTestImplementation(\"\
  androidx.test.ext:junit:1.1.5\")\n    androidTestImplementation(\"androidx.test.espresso:espresso-core:3.5.1\"\
  )\n}\n```\n\n从文件内容可以看出，构建文件首先声明了使用 Gradle Android 插件：\n\n```gradle\nplugins {\n\
  \    id(\"com.android.application\")\n}\n```\n\n文件的 `android` 节声明了项目的命名空间（namespace），然后说明了构建\
  \ `Module1` 时要使用的 SDK 版本。\n\n```gradle\nandroid {\n    namespace = \"com.example.gradlesample\"\
  \n    compileSdk = 33\n}\n```\n\n`defaultConfig` 节中声明的项目定义了在构建过程中生成到模块 `AndroidManifest.xml`\
  \ 文件中的元素。这些设置可以在构建文件中进行修改，它们源于最初创建模块时在 Android Studio 中输入的设置值：\n\n```gradle\ndefaultConfig\
  \ {\n    applicationId = \"com.example.gradlesample\"\n    minSdk = 26\n    targetSdk\
  \ = 33\n    versionCode = 1\n    versionName = \"1.0\"\n    testInstrumentationRunner\
  \ = \"androidx.test.runner.AndroidJUnitRunner\"\n}\n```\n\n`buildTypes` 节包含了关于在构建应用程序的发布版本时，是否以及如何对\
  \ APK 文件上运行 ProGuard 的指令：\n\n```gradle\nbuildTypes {\n    release {\n        isMinifyEnabled\
  \ = false\n        proguardFiles(\n            getDefaultProguardFile(\"proguard-android-optimize.txt\"\
  ),\n            \"proguard-rules.pro\"\n        )\n    }\n}\n```\n\n按照目前的配置，构建 `Module1`\
  \ 时不会运行 ProGuard。要启用 ProGuard，必须将 `minify` 项从 `false` 改为 `true`。`proguard-rules.pro`\
  \ 文件可以在项目的模块目录中找到。对该文件的更改将覆盖位于 Android SDK 安装目录 `sdk/tools/proguard` 下的 `proguard-android.txt`\
  \ 文件中的默认设置。\n\n由于此文件中没有声明调试 `buildType`，将使用默认设置（不带 ProGuard 构建，使用调试密钥签名，并启用调试符号）。\n\
  \n模块构建文件中还可以包含一个标题为 `productFlavors` 的额外节，以便能够创建多个构建变体。\n\n接下来，包含了一些指令，用于指定构建项目时使用的\
  \ Java 编译器版本：\n\n```gradle\ncompileOptions {\n    sourceCompatibility = JavaVersion.VERSION_1_8\n\
  \    targetCompatibility = JavaVersion.VERSION_1_8\n}\n```\n\n最后，`dependencies`\
  \ 节列出了模块依赖的任何本地和远程依赖。上述示例中的依赖行指定了需要从 Android 仓库包含的 Android 库：\n\n```gradle\ndependencies\
  \ {\n    implementation(\"androidx.appcompat:appcompat:1.6.1\")\n    implementation(\"\
  com.google.android.material:material:1.9.0\")\n}\n```\n\n注意，依赖声明包含了版本号，用以指示应该包含哪个版本的库。\n\
  \n## 8.6 在构建文件中配置签名设置\n\n本书的“创建、测试和上传 Android Bundle”章节涵盖了使用 Android Studio 用户界面设置密钥和生成签名发布版\
  \ APK 的涉及步骤。这些设置也可以在 `build.gradle.kts` 文件的 `signingConfigs` 节中声明。例如：\n\n```gradle\n\
  defaultConfig {\n    // ...\n}\nsigningConfigs {\n    release {\n        storeFile(\"\
  keystore.release\")\n        storePassword \"your keystore password here\"\n   \
  \     keyAlias \"your key alias here\"\n        keyPassword \"your key password\
  \ here\"\n    }\n}\nbuildTypes {\n    // ...\n}\n```\n\n上述示例将密钥密码信息直接嵌入到构建文件中。这种方法的另一种替代方案是从系统环境变量中提取这些值：\n\
  \n```gradle\nsigningConfigs {\n    release {\n        storeFile(\"keystore.release\"\
  )\n        storePassword System.getenv(\"KEYSTOREPASSWD\")\n        keyAlias \"\
  your key alias here\"\n        keyPassword System.getenv(\"KEYWD\")\n    }\n}\n\
  ```\n\n另一种方法是配置构建文件，让 Gradle 在构建过程中提示输入密码：\n\n```gradle\nsigningConfigs {\n    release\
  \ {\n        storeFile(\"keystore.release\")\n        storePassword System.console().readLine(\"\
  \\nEnter Keystore password: \")\n        keyAlias \"your key alias here\"\n    \
  \    keyPassword System.console().readLine(\"\\nEnter Key password: \")\n    }\n\
  }\n```\n\n## 8.7 从命令行运行 Gradle 任务\n\n每个 Android Studio 项目都包含一个用于从命令行运行 Gradle 任务的包装器（wrapper）。该包装器位于项目的根目录下。在\
  \ Linux 或 macOS 上，可能需要启用执行权限。要启用执行权限，请打开终端窗口，切换到需要该包装器的项目目录，并执行以下命令：\n\n```bash\n\
  chmod +x gradlew\n```\n\n一旦文件具有执行权限，则需要将其路径添加到 `$PATH` 环境变量中，或者在运行名称前加上 `./` 来运行。例如：\n\
  \n```bash\n./gradlew tasks\n```\n\nGradle 通过不同的任务来查看项目构建。可以通过在项目内部运行以下命令获取当前项目可用的任务列表（在\
  \ macOS 或 Linux 上运行时请加上前缀 `./`）：\n\n```bash\ngradlew tasks\n```\n\n要构建适用于设备或模拟器的调试版本，请使用\
  \ `assembleDebug` 选项：\n\n```bash\ngradlew assembleDebug\n```\n\n或者，构建应用程序的发布版本：\n\
  \n```bash\ngradlew assembleRelease\n```\n\n8.8 总结\n\n大部分情况下，Android Studio 在无需开发者干预的情况下后台完成应用程序构建。此构建过程使用\
  \ Gradle 系统，这是一种自动化构建工具，允许通过一组构建配置文件来配置和管理项目的构建。虽然 Gradle 的默认行为适用于许多基础项目构建需求，但对于更复杂的项目，配置构建过程的需求是不可避免的。本章提供了\
  \ Android Studio 项目背景下 Gradle 构建系统和配置文件的概述。\n\n### 索引\n\n#### 符号\n- `<application>`\n\
