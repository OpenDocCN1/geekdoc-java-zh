  \ 66-1 所示。\n\n### 66.9 总结\n\n\n\n\nAndroid `TableLayout` 容器视图提供了一种以行和列配置排列视图组件的方法。虽然\
  \ `TableLayout` 视图提供了整体容器，但每一行及其其中包含的单元格都是通过 `TableRow` 视图的实例实现的。在本章中，我们将在 Android\
  \ Studio 中使用 `TableLayout` 和 `TableRow` 容器设计了一个用户界面。下一章将为该用户界面添加后台功能，使用仓库（repository）和\
  \ Room 持久化库来实现 SQLite 数据库功能。\n\n# 67. Android Room 数据库和仓库教程\n\n本章将结合“Android Room\
  \ 持久化库”中学习的知识与上一章创建的初始项目，提供一个详细的教程，演示如何使用 Room 持久化库实现基于 SQLite 的数据库存储。遵循 Android\
  \ 架构指南，该项目将使用视图模型（view model）和仓库。教程将使用“Android Room 持久化库”中涵盖的所有元素，包括实体（entities）、数据访问对象（DAO）、Room\
  \ 数据库以及异步数据库查询。\n\n### 67.1 关于 RoomDemo 项目\n\n上一章创建的用户界面布局是创建一个简单的库存应用的第一步，用于存储产品名称和数量。完成后，该应用将提供添加、删除和搜索数据库条目的功能，同时显示当前数据库中存储的所有产品的可滚动列表。当数据库条目添加或删除时，此产品列表将自动更新。\n\
  \n### 67.2 修改构建配置\n\n启动 Android Studio 并打开上一章开始的 `RoomDemo` 项目。在向项目添加任何新类之前，第一步是在构建配置中添加一些额外的库，包括\
  \ Room 持久化库。找到并编辑项目级 `build.gradle.kts` 文件（`app -> Gradle Scripts -> build.gradle.kts\
  \ (Project :RoomDemo)`）如下：\n\n接下来，对模块级 `build.gradle.kts` 文件（`app -> Gradle Scripts\
  \ -> build.gradle.kts (Module :app)`）进行以下更改：\n\n```kotlin\ndependencies {\n    .\n\
  \    .\n    implementation(\"androidx.recyclerview:recyclerview:1.3.0\")\n    implementation(\"\
  androidx.room:room-runtime:2.5.2\")\n    annotationProcessor(\"androidx.room:room-compiler:2.5.2\"\
  )\n    .\n    .\n}\n```\n\n### 67.3 构建实体\n\n该项目将从创建定义数据库表模式的实体开始。该实体将包含一个产品 ID 整数、一个存储产品名称的字符串列以及另一个存储数量的整数值。\n\
  \n该实体将包含一个产品 ID 整数、一个存储产品名称的字符串列以及另一个存储数量的整数值。`productid` 列将作为主键并自动生成。表 67-1 总结了实体的结构：\n\
  \n| 列 | 数据类型 |\n| :--- | :--- |\n| productid | Integer / 主键 / 自动递增 |\n| productname\
  \ | String |\n| productquantity | Integer |\n\n表 67-1\n\n在项目工具窗口中右键点击 `app -> java\
  \ -> com.ebookfrenzy.roomdemo` 项，并选择 `New -> Java Class` 菜单选项为实体添加类文件。在新类对话框中，将类命名为\
  \ `Product`，选择列表中的 `Class` 项，并按键盘回车键生成文件。\n\n当 `Product.java` 文件在编辑器中打开时，对其进行修改使其读取如下：\n\
  \n```java\npackage com.ebookfrenzy.roomdemo;\n\npublic class Product {\n    private\
  \ int id;\n    private String name;\n    private int quantity;\n\n    public Product(String\
  \ name, int quantity) {\n        this.name = name;\n        this.quantity = quantity;\n\
  \    }\n\n    public int getId() {\n        return this.id;\n    }\n\n    public\
  \ String getName() {\n        return this.name;\n    }\n\n    public int getQuantity()\
  \ {\n        return this.quantity;\n    }\n\n    public void setId(int id) {\n \
  \       this.id = id;\n    }\n\n    public void setName(String name) {\n       \
  \ this.name = name;\n    }\n\n    public void setQuantity(int quantity) {\n    \
  \    this.quantity = quantity;\n    }\n}\n```\n\n该类现在有了数据库表列的变量以及对应的 getter 和 setter\
  \ 方法。当然，该类在被注解之前并不会成为实体。在编辑器中打开类文件的情况下，添加注解和相应的导入：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\
  \nimport androidx.room.ColumnInfo;\nimport androidx.room.Entity;\nimport androidx.room.PrimaryKey;\n\
  \n@Entity(tableName = \"products\")\npublic class Product {\n    @PrimaryKey(autoGenerate\
  \ = true)\n    @ColumnInfo(name = \"productId\")\n    private int id;\n\n    @ColumnInfo(name\
  \ = \"productName\")\n    private String name;\n\n    private int quantity;\n}\n\
  ```\n\n这些注解声明此实体为名为 `products` 的表，并为 `id` 和 `name` 变量分配了列名。`id` 列也被配置为主键并自动生成。\n\
  \n### 67.4 创建数据对象\n\n点击 `app -> java -> com.ebookfrenzy.roomdemo` 项并选择 `New -> Java\
  \ Class` 菜单选项。在新类对话框中，在 Name 字段中输入 `ProductDao` 并从列表中选择 `Interface`，如图 67-1 所示：\n\
  \n![](img/as_room_demo_java_interface.jpg)\n\n图 67-1\n\n按回车键生成新接口，并在编辑器中加载 `ProductDao.java`\
  \ 文件后进行以下更改：\n\n```java\npackage com.ebookrenzy.roomdemo;\n\nimport androidx.lifecycle.LiveData;\n\
  import androidx.room.Dao;\nimport androidx.room.Insert;\nimport androidx.room.Query;\n\
  import java.util.List;\n\n@Dao\npublic interface ProductDao {\n    @Insert\n   \
  \ void insertProduct(Product product);\n\n    @Query(\"SELECT * FROM products WHERE\
  \ productName = :name\")\n    List<Product> findProduct(String name);\n\n    @Query(\"\
  DELETE FROM products WHERE productName = :name\")\n    void deleteProduct(String\
  \ name);\n\n    @Query(\"SELECT * FROM products\")\n    LiveData<List<Product>>\
  \ getAllProducts();\n}\n```\n\nDAO 实现了从 products 数据库中插入、查找和删除记录的方法。插入方法接收一个包含要存储数据的\
  \ `Product` 实体。`getAllProducts()` 方法返回一个包含数据库中所有记录的 `LiveData` 对象。此方法将用于保持用户界面中的\
  \ `RecyclerView` 产品列表与数据库同步。\n\n### 67.5 添加 Room 数据库\n\n在向项目添加仓库之前的最后一个任务是实现 Room\
  \ 数据库实例。向项目添加名为 `ProductRoomDatabase` 的新类，这次选择 `Class` 选项。\n\n文件生成后，按照“Android Room\
  \ 持久化库”章节中概述的步骤对其进行修改：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\nimport android.content.Context;\n\
  import androidx.room.Database;\nimport androidx.room.Room;\nimport androidx.room.RoomDatabase;\n\
  \n@Database(entities = {Product.class}, version = 1)\npublic abstract class ProductRoomDatabase\
  \ extends RoomDatabase {\n    public abstract ProductDao productDao();\n    private\
  \ static ProductRoomDatabase INSTANCE;\n\n    static ProductRoomDatabase getDatabase(final\
  \ Context context) {\n        if (INSTANCE == null) {\n```\n\n\n\n\n```java\nsynchronized\
  \ (ProductRoomDatabase.class) {\n    INSTANCE =\n        Room.databaseBuilder(context.getApplicationContext(),\n\
  \            ProductRoomDatabase.class,\n            \"product_database\").build();\n\
  }\nreturn INSTANCE;\n```\n\n### 67.6 添加仓库 (Repository)\n\n向项目中添加一个名为 `ProductRepository`\
  \ 的新类，并选择 `Class` 选项。\n\n仓库类将负责代表 `ViewModel` 与 `Room` 数据库进行交互。它必须提供使用 `DAO` 来插入、删除和查询产品记录的方法。除了\
  \ `getAllProducts()` DAO 方法（它返回一个 `LiveData` 对象）外，这些数据库操作必须在主线程之外的线程中执行。\n\n在 `ProductRepository.java`\
  \ 文件中，添加一个处理器的代码，将搜索结果返回给仓库线程：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\n\
  import android.os.Handler;\nimport android.os.Looper;\nimport android.os.Message;\n\
  import java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  import androidx.lifecycle.MutableLiveData;\nimport java.util.List;\n\npublic class\
  \ ProductRepository {\n    private final MutableLiveData<List<Product>> searchResults\
  \ =\n            new MutableLiveData<>();\n\n    private List<Product> results;\n\
  \n    Handler handler = new Handler(Looper.getMainLooper()) {\n        @Override\
  \ public void handleMessage(Message msg) {\n            searchResults.setValue(results);\n\
  \        }\n    };\n}\n```\n\n上述代码声明了一个名为 `searchResults` 的 `MutableLiveData` 变量，每当异步搜索任务完成，搜索结果就会存储其中（在随后的教程中，`ViewModel`\
  \ 中的观察者将监控此活动数据对象）。\n\n仓库类现在必须提供一些 `ViewModel` 可以调的方法来启动这些操作。然而，仓库需要通过 `ProductRoomDatabase`\
  \ 实例获取 `DAO` 引用。为 `ProductRepository` 类添加一个构造方法来执行这些任务：\n\n```java\nimport android.app.Application;\n\
  \npublic class ProductRepository {\n    private final MutableLiveData<List<Product>>\
  \ searchResults = new MutableLiveData<>();\n    private List<Product> results;\n\
  \    private final ProductDao productDao;\n\n    public ProductRepository(Application\
  \ application) {\n        ProductRoomDatabase db;\n        db = ProductRoomDatabase.getDatabase(application);\n\
  \        productDao = db.productDao();\n    }\n}\n```\n\n存储了 `DAO` 引用后，可以如下所示将方法添加到\
  \ `ProductRepository` 类文件中：\n\n```java\npublic void insertProduct(Product newproduct)\
  \ {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n    executor.submit(()\
  \ -> productDao.insertProduct(newproduct));\n    executor.shutdown();\n}\n\npublic\
  \ void deleteProduct(String name) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(() -> productDao.deleteProduct(name));\n    executor.shutdown();\n\
  }\n\npublic void findProduct(String name) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(() -> {\n        results = productDao.findProduct(name);\n\
  \        handler.sendEmpty(0);\n    });\n    executor.shutdown();\n}\n```\n\n在插入和删除的情况下，会创建并使用适当线程来执行数据库操作。在\
  \ `findProduct()` 的情况下，会向 `handler` 发送消息，表示有新结果可用。\n\n完成仓库还剩最后一项任务。用户界面中的 `RecyclerView`\
  \ 必须与数据库中存储的当前产品列表同步。`ProductDao` 类包含一个名为 `getAllProducts()` 的方法，该方法使用 SQL 查询选择所有数据库记录并将它们封装在\
  \ `LiveData` 对象中返回。仓库需要在初始化时调用此方法，并将结果存储在 `LiveData` 对象中，该对象可以被 `ViewModel` 观察，进而被\
  \ UI 控制器观察。一旦设置好，每当数据库发生变化时，UI 控制器将收到通知，`RecyclerView` 就可以更新最新的产品列表。在 `ProductRepository.java`\
  \ 文件中，添加一个 `LiveData` 变量并在构造方法中调用 `getAllProducts()` 方法：\n\n```java\nimport androidx.lifecycle.LiveData;\n\
  \npublic class ProductRepository {\n    private final MutableLiveData<List<Product>>\
  \ searchResults = new MutableLiveData<>();\n    private List<Product> results;\n\
  \    private final LiveData<List<Product>> allProducts;\n    private final ProductDao\
  \ productDao;\n\n    public ProductRepository(Application application) {\n     \
  \   ProductRoomDatabase db;\n        db = ProductRoomDatabase.getDatabase(application);\n\
  \        productDao = db.productDao();\n        allProducts = productDao.getAllProducts();\n\
  \    }\n}\n```\n\n为了完成仓库，添加 `ViewModel` 可以调的方法以获取 `allProducts` 和 `searchResults`\
  \ 活动数据对象的引用：\n\n```java\npublic LiveData<List<Product>> getAllProducts() {\n   \
  \ return allProducts;\n}\n\npublic MutableLiveData<List<Product>> getSearchResults()\
  \ {\n    return searchResults;\n}\n```\n\n### 67.7 添加 ViewModel\n\n`ViewModel` 负责创建仓库实例，并提供方法以及\
  \ `LiveData` 对象，UI 控制器可以利用这些对象使用户界面与底层数据库保持同步。正如在 `ProductRepository.java` 中实现的，仓库构造函数需要访问应用上下文以获取\
  \ `Room` 数据库实例。为了让 `ViewModel` 能够访问应用上下文以便将其传递给仓库，`ViewModel` 需要继承 `AndroidViewModel`。\n\
  \n首先，在 Project 工具窗口中找到 `com.ebookfrenzy.viewdemo` 条目，右键点击它并选择 `New -> Java Class`\
  \ 菜单选项。接下来，将新类命名为 `MainViewModel` 并按键盘回车键。最后，编辑新类文件，将类改为扩展 `AndroidViewModel` 并实现默认构造函数：\n\
  \n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\nimport android.app.Application;\n\
  import androidx.lifecycle.AndroidViewModel;\nimport androidx.lifecycle.LiveData;\n\
  import androidx.lifecycle.MutableLiveData;\nimport com.ebookfrenzy.roomdemo.Product;\n\
  import com.ebookfrenzy.roomdemo.ProductRepository;\nimport java.util.List;\n\npublic\
  \ class MainViewModel extends AndroidViewModel {\n    final private ProductRepository\
  \ repository;\n    final private LiveData<List<Product>> allProducts;\n    final\
  \ private MutableLiveData<List<Product>> searchResults;\n\n    public MainViewModel\
  \ (Application application) {\n        super(application);\n        repository =\
  \ new ProductRepository(application);\n        allProducts = repository.getAllProducts();\n\
  \        searchResults = repository.getSearchResults();\n    }\n}\n```\n\n构造函数创建了一个仓库实例，然后使用它获取结果和活动数据对象的引用，以便\
  \ UI 控制器可以观察它们。现在 `ViewModel` 中仅剩下实现那些由 UI 控制器内部响应按钮点击以及设置 `LiveData` 对象观察者时调的方法：\n\
  \n```java\nMutableLiveData<List<Product>> getSearchResults() {\n    return searchResults;\n\
  }\n\nLiveData<List<Product>> getAllProducts() {\n    return allProducts;\n}\n\n\
  public void insertProduct(Product product) {\n    repository.insertProduct(product);\n\
  }\n\npublic void findProduct(String name) {\n    repository.findProduct(name);\n\
  }\n\npublic void deleteProduct(String name) {\n    repository.deleteProduct(name);\n\
  }\n```\n\n### 67.8 创建产品项布局\n\n\n\n\n数据库中的每个产品名称将出现在主用户界面的 `RecyclerView` 列表中。这需要一个布局资源文件，其中列表中的每行都包含一个\
  \ `TextView`。在 Project 工具窗口中右键点击 `app` -> `res` -> `layout` 项，并选择 `New` -> `Layout\
  \ Resource File` 菜单来添加此文件。将文件命名为 `product_list_item`，并在点击 `OK` 创建文件并加载到布局编辑器之前，将根元素更改为垂直的\
  \ `LinearLayout`。在 Design（设计）模式下的布局编辑器中，从调色板中拖入一个 `TextView` 对象到布局上，它将默认显示在布局的顶部：\n\
  \n![](img/as_3.5_roomdemo_item_layout.jpg)\n\n图 67-2\n\n在布局中选中 `TextView` 后，使用 Attributes（属性）工具窗口将视图的\
  \ ID 设置为 `product_row`，并将 `layout_height` 设置为 `30dp`。在 Component Tree（组件树）窗口中选择\
  \ `LinearLayout` 项，并将 `layout_height` 属性设置为 `wrap_content`。\n\n### 67.9 添加 RecyclerView\
  \ 适配器\n\n正如“使用 RecyclerView 和 CardView 控件”章节中详细概述的那样，`RecyclerView` 实例需要一个适配器类来提供要显示的数据。在\
  \ Project 工具窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.roomdemo` 项，并选择 `New` ->\
  \ `Java Class` 菜单来添加此类类。在对话框中，将类命名为 `ProductListAdapter` 并在列表中选择 `Class`，然后按键盘 Return\
  \ 键。在编辑器中加载生成的 `ProductListAdapter.java` 类后，按照所示实现该类：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\
  \nimport android.view.LayoutInflater;\nimport android.view.View;\nimport android.view.ViewGroup;\n\
  import android.widget.TextView;\nimport com.ebookfrenzy.roomdemo.R;\nimport androidx.annotation.NonNull;\n\
  import androidx.recyclerview.widget.RecyclerView;\nimport com.ebookfrenzy.roomdemo.Product;\n\
  import java.util.List;\n\npublic class ProductListAdapter\n        extends RecyclerView.Adapter<ProductListAdapter.ViewHolder>\
  \ {\n\n    private final int productItemLayout;\n    private List<Product> productList;\n\
  \n    public ProductListAdapter(int layoutId) {\n        productItemLayout = layoutId;\n\
  \    }\n\n    public void setProductList(List<Product> products) {\n        productList\
  \ = products;\n        notifyDataSetChanged();\n    }\n\n    @Override\n    public\
  \ int getItemCount() {\n        return productList == null ? 0 : productList.size();\n\
  \    }\n\n    @NonNull\n    @Override\n    public ViewHolder onCreateViewHolder(ViewGroup\
  \ parent, int viewType) {\n        View view = LayoutInflater.from(\n          \
  \      parent.getContext()).inflate(productItemLayout, parent, false);\n       \
  \ return new ViewHolder(view);\n    }\n\n    @Override\n    public void onBindViewHolder(final\
  \ ViewHolder holder, final int listPosition) {\n        TextView item = holder.item;\n\
  \        item.setText(productList.get(listPosition).getName());\n    }\n\n    static\
  \ class ViewHolder extends RecyclerView.ViewHolder {\n        TextView item;\n \
  \       ViewHolder(View iteview) {\n            super(iteview);\n            item\
  \ = iteview.findViewById(R.id.product_row);\n        }\n    }\n}\n```\n\n### 67.10\
  \ 准备主 Activity\n\n最后一个需要修改的组件是 `MainActivity` 类，它需要对 `Button` 视图配置监听器并对 `ViewModel`\
  \ 类中的 live data 对象配置观察者。在添加这些代码之前，必须进行一些准备工作以添加一些导入和变量。编辑 `MainActivity.java` 文件并修改如下：\n\
  \n```java\nimport androidx.lifecycle.ViewModelProvider;\n\npublic class MainActivity\
