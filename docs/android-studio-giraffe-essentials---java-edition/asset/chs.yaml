  ))\n.\n.\n}\n```\n\n### 76.10 总结\n\nAndroid 打印框架包含了 WebView 类的扩展，允许从 Android 应用程序内部打印\
  \ HTML 内容。这些内容可以是应用程序在运行时动态创建的 HTML，也可以是加载到 `WebView` 实例中的预现有网页。对于动态创建的 HTML，使用\
  \ `WebViewClient` 实例很重要，以确保在 HTML 完全加载到 `WebView` 之前开始打印。\n\n## 77. Android 自定义文档打印指南\n\
  \n\n\n\n正如我们在前面的章节中所看到的，如果内容以图像或 HTML 标记的形式存在，Android 打印框架使得在应用程序中构建打印支持变得相对容易。更高级的打印需求可以通过打印框架的自定义文档打印功能来满足。\n\
  \n# 77.1 Android 自定义文档打印概述\n\n简单来说，自定义文档打印使用画布（canvases）来表示要打印的文档页面。应用程序将要打印的内容以形状、颜色、文本和图像的形式绘制在这些画布上。画布由\
  \ `Canvas` 类的实例表示，提供了丰富的绘制选项访问。一旦完成所有页面的绘制，就会打印该文档。\n\n虽然这听起来足够简单，但为了实现这一目标仍需要执行一些步骤，可以总结如下：\n\
  \n*   实现一个继承自 `PrintDocumentAdapter` 类的自定义打印适配器。\n*   获取打印管理器服务（Print Manager Service）的引用。\n\
  *   创建一个 `PdfDocument` 类的实例以存储文档页面。\n*   以 `PdfDocument.Page` 实例的形式将页面添加到 `PdfDocument`\
  \ 中。\n*   获取与文档页面相关的 `Canvas` 对象的引用。\n*   在画布上绘制内容。\n*   将 PDF 文档写入打印框架提供的目标输出流。\n\
  *   通知打印框架文档已准备好进行打印。\n\n本章将提供这些步骤的概述，随后将提供一个详细的教程，旨在演示如何在 Android 应用程序中实现自定义文档打印。\n\
  \n## 77.1.1 自定义打印适配器\n\n打印适配器的作用是为打印框架提供要打印的内容，并确保其根据用户选择的偏好进行正确的格式化（考虑纸张大小和页面方向等因素）。\n\
  \n这大部分工作由 Android 打印框架提供的打印适配器完成，这些适配器是专为打印 HTML 和图像等这些特定打印任务而设计的。例如，在打印网页时，每当调用\
  \ `WebView` 类实例的 `createPrintDocumentAdapter()` 方法时，系统会为我们创建一个打印适配器。\n\n然而，在自定义文档打印的情况下，应用程序开发者负责设计打印适配器并实现绘制和格式化内容的代码以为打印做准备。\n\
  \n自定义打印适配器通过子类 `PrintDocumentAdapter` 类并重写该类中的一组回调方法来创建，这些方法会在打印过程的各个阶段由打印框架调用。这些回调方法可以总结如下：\n\
  \n*   `onStart()` – 该方法在打印过程开始时调用，提供的目的是为了让应用程序代码执行创建打印作业所需的任何必要任务。在 `PrintDocumentAdapter`\
  \ 子类中实现此方法是可选的。\n*   `onLayout()` – 此回调方法在调用 `onStart()` 方法后调用，并在用户每次更改打印设置（如更改方向、纸张大小或颜色设置）时再次调用。此方法应该调整内容和布局以适应这些更改。一旦更改完成后，方法必须返回要打印的页数。在\
  \ `PrintDocumentAdapter` 子类中实现 `onLayout()` 方法是强制的。\n*   `onWrite()` – 该方法在每次调用\
  \ `onLayout()` 后调用，负责在要打印页面的画布上渲染内容。除了其他参数外，此方法还会接收一个文件描述符，渲染完成后必须将生成的 PDF 文档写入其中。随后调用\
  \ `onWriteFinished()` 回调方法并传递一个包含打印页面范围信息的参数。在 `PrintDocumentAdapter` 子类中实现 `onWrite()`\
  \ 方法是强制的。\n*   `onFinish()` – 可选方法。如果实现，它将在打印过程完成后由打印框架调用一次，从而为应用程序提供执行任何可能的清理操作的机会。\n\
  \n### 77.2 准备自定义文档打印项目\n\n从欢迎界面选择“New Project”（新建项目）选项，在弹出的新项目对话框中，点击 Next（下一步）按钮之前选择“Empty\
  \ Views Activity”模板。\n\n在 Name 字段中输入 `CustomPrint` 并指定 `com.ebookfrenzy.customprint`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ Language 菜单设置为 Java。\n\n将 `activity_main.xml` 布局文件加载到 Layout Editor（布局编辑器）工具中，并在\
  \ Design（设计）模式下选择并删除“Hello World!” `TextView` 对象。从调板的 Common（常用）部分拖入一个 `Button`\
  \ 视图并将其放置在布局视图的中心。选中 `Button` 视图后，将 text 属性更改为“Print Document”并将字符串提取到新的资源中。完成后，用户界面的布局应与图\
  \ 77-1 所示所示。\n\n当在应用程序中选中按钮时，需要调用一个方法来启动文档打印过程。留在 Attributes（属性）工具窗口，将 `onClick`\
  \ 属性设置为调用名为 `printDocument` 的方法。\n\n![](img/as_custom_print_ui.jpg)\n\n图 77-1\n\n\
  # 77.3 创建自定义打印适配器\n\n在 Android 应用程序内部打印自定义文档的大部分工作涉及自定义打印适配器的实现。此示例将需要一个实现了 `onLayout()`\
  \ 和 `onWrite()` 回调方法的打印适配器。在 `MainActivity.java` 文件中，为此新类添加模板，使其内容如下：\n\n```java\n\
  package com.ebookfrenzy.customprint;\n\n.\n\n.\n\nimport android.os.CancellationSignal;\n\
  \nimport android.os.ParcelFileDescriptor;\n\nimport android.print.PageRange;\n\n\
  import android.print.PrintAttributes;\n\nimport android.print.PrintDocumentAdapter;\n\
  \nimport android.content;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    static class MyDocumentAdapter extends PrintDocumentAdapter {\n       \
  \ Context context;\n        MyDocumentAdapter(Context context) {\n            this.context\
  \ = context;\n        }\n\n        @Override\n        public void onLayout(PrintAttributes\
  \ oldAttributes,\n            PrintAttributes newAttributes,\n            CancellationSignal\
  \ cancellationSignal,\n            LayoutResultCallback callback,\n            Bundle\
  \ metadata) {\n        }\n\n        @Override\n        public void onWrite(PageRange[]\
  \ pageRanges,\n            final ParcelFileDescriptor destination,\n           \
  \ final CancellationSignal cancellationSignal,\n            final WriteResultCallback\
  \ callback) {\n        }\n```\n\n目前该新类包含一个在创建新类实例时被调用的构造方法。该构造方法接收调用 de 的 context\
  \ 作为参数，然后将其存储以便在后两个回调方法中引用。\n\n在建立类框架后，下一步是实现两个回调方法，从 `onLayout()` 开始。\n\n## 77.4\
  \ 实现 onLayout() 回调方法\n\n留在 `MainActivity.java` 文件中，首先添加 `onLayout()` 方法代码所需的某些导入指令：\n\
  \n```java\npackage com.ebookfrenzy.customprint;\n\nimport android.print.PrintDocumentInfo;\n\
  \nimport android.print.pdf.PrintedPdfDocument;\n\nimport android.graphics.pdf.PdfDocument;\n\
  ```\n\n\n\n\n```java\npublic class MainActivity extends AppCompatActivity {\n\n\
  // .\n// .\n}\n```\n\n接下来，修改 `MyPrintDocumentAdapter` 类以声明在 `onLayout()` 方法中使用的变量：\n\
  \n```java\npublic static class MyPrintDocumentAdapter extends PrintDocumentAdapter\n\
  \n{\n    Context context;\n    int pageHeight;\n    int pageWidth;\n    PdfDocument\
  \ myPdfDocument;\n    int totalpages = 4;\n\n// .\n}\n```\n\n注意，在本示例中，将打印一个四页的文档。在更复杂的情况下，应用程序很可能需要根据内容的数量和布局，结合用户选择的纸张尺寸和方向，动态计算需要打印的页数。\n\
  \n声明变量后，按照下面的代码列表实现 `onLayout()` 方法：\n\n```java\n@Override\npublic void onLayout(PrintAttributes\
  \ oldAttributes,\n                    PrintAttributes newAttributes,\n         \
  \           CancellationSignal cancellationSignal,\n                    LayoutResultCallback\
  \ callback,\n                    Bundle metadata) {\n    myPdfDocument = new PrintedPdfDocument(context,\
  \ newAttributes);\n    pageHeight =\n            Objects.requireNonNull(\n     \
  \           newAttributes.getMediaSize()).getHeightMils()/1000 * 72;\n    pageWidth\
  \ =\n            newAttributes.getMediaSize().getWidthMils()/1000 * 72;\n    if\
  \ (cancellationSignal.isCanceled() ) {\n        callback.onLayoutCancelled();\n\
  \        return;\n    }\n    if (totalpages > 0) {\n        PrintDocumentInfo.Builder\
  \ builder = new PrintDocumentInfo\n            .Builder(\"print_output.pdf\").setContentType(\n\
  \                    PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n            .setPageCount(totalpages);\n\
  \        PrintDocumentInfo info = builder.build();\n        callback.onLayoutFinished(info,\
  \ true);\n    } else {\n        callback.onLayoutFailed(\"Page count is zero.\"\
  );\n    }\n}\n```\n\n该方法执行了许多任务，每项任务都需要详细的解释。\n\n首先，创建一个 `PdfDocument` 类实例来创建一个新的\
  \ PDF 文档。当打印框架调用 `onLayout()` 方法时，传入的参数之一是一个 `PrintAttributes` 类型的对象，其中包含了用户为打印输出选择的纸张尺寸、分辨率和颜色设置的详细信息。在创建\
  \ PDF 文档时会使用这些设置，并结合构造方法之前为我们存储的活动上下文：\n\n```java\nmyPdfDocument = new PrintedPdfDocument(context,\
  \ newAttributes);\n```\n\n该方法随后使用 `PrintAttributes` 对象提取文档页的高度和宽度值。这些维度存储在对象中，以英寸的千分之一表示。由于本示例后续使用这些值的方法是以\
  \ 1/72 英寸为单位运行的，因此在存储这些数字之前进行了转换：\n\n```java\npageHeight = newAttributes.getMediaSize().getHeightMils()/1000\
  \ * 72;\npageWidth = newAttributes.getMediaSize().getWidthMils()/1000 * 72;\n```\n\
  \n虽然此示例没有使用用户的颜色选择，但可以通过调用 `PrintAttributes` 对象的 `getColorMode()` 方法获取此属性，它将返回 `COLOR_MODE_COLOR`\
  \ 或 `COLOR_MODE_MONROME` 值。\n\n当调用 `onLayout()` 方法时，会传入一个 `LayoutResultCallback`\
  \ 对象。该对象为方法通过一组方法向打印框架返回状态的方法。例如，如果用户取消了进程，`onLayout()` 方法将被调用。进程已取消的事实通过 `CancellationSignal`\
  \ 参数中的设置来指示。如果检测到取消，`onLayout()` 方法必须调用 `LayoutResultCallback` 的 `onLayoutCancelled()`\
  \ 方法，通知打印框架已收到取消且布局任务已取消：\n\n```java\nif (cancellationSignal.isCanceled() ) {\n\
  \    callback.onLayoutCancelled();\n    return;\n}\n```\n\n当布局工作完成后，该方法要求调用 `LayoutResultCallback`\
  \ 的 `onLayoutFinished()` 方法，并传递两个参数。第一个参数是一个 `PrintDocumentInfo` 对象，包含有关要打印文档的信息。这些信息由\
  \ PDF 文档的名称、内容类型（在本例中是文档而非图像）以及页数组成。第二个参数是一个 `Boolean` 值，表示自上一次调用 `onLayout()` 方法以来，布局是否发生了变化：\n\
  \n```java\nif (totalPages > 0) {\n    PrintDocumentInfo.Builder builder = new PrintDocumentInfo\n\
  \        .Builder(\"print_output.pdf\")\n        .setContentType(\n            PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n\
  \        .setPageCount(totalpages);\n    PrintDocumentInfo info = builder.build();\n\
  \    callback.onLayoutFinished(info, true);\n} else {\n    callback.onLayoutFailed(\"\
  Page count is zero.\");\n}\n```\n\n如果页数为零，代码将通过调用 `LayoutResultCallback` 对象的 `onLayoutFailed()`\
  \ 方法向打印框架报告此失败。调用 `onLayoutFinished()` 方法通知打印框架布局工作完成，触发对 `onWrite()` 方法的调用。\n\n\
  ## 77.5 实现 `onWrite()` 回调方法\n\n`onWrite()` 回调方法负责渲染文档的页面，然后通知打印框架文档已准备好打印。完成后，`onWrite()`\
  \ 方法的内容如下：\n\n```java\npackage com.ebookzyzy.print;\n\nimport java.io.FileOutputStream;\n\
  import java.io.IOException;\n// .\nimport android.graphics.pdf.PdfDocument.PageInfo;\n\
  // .\n\n@Override\npublic void onWrite(final PageRange[] pageRanges,\n         \
  \           final FileDescriptor destination,\n                    final CancellationSignal\
  \ cancellationSignal,\n                    final WriteResultCallback callback) {\n\
  \    for (int i = 0; i < totalpages; i++) {\n        if (pageInRange(pageRanges,\
  \ i))\n        {\n            PageInfo newPage = new PageInfo.Builder(pageWidth,\n\
  \                pageHeight, i).create();\n            PdfDocument.Page page =\n\
  \                myPdfDocument.startPage(newPage);\n            if (cancellationSignal.isCanceled())\
  \ {\n                callback.onLayoutCancelled();\n                myPdfDocument.close();\n\
  \                myPdfDocument = null;\n                return;\n            }\n\
  \            drawPage(page, i);\n            myPdfDocument.finishPage(page);\n \
  \       }\n    }\n\n    try {\n        myPdfDocument.writeTo(new FileOutputStream(\n\
  \            destination.getFileDescriptor()));\n    } catch (IOException e) {\n\
  \        callback.onWriteFailed(e.toString());\n        return;\n    } finally {\n\
  \        myPdfDocument.close();\n        myPdfDocument = null;\n    }\n\n    callback.onWriteFinished(pageRanges);\n\
  }\n```\n\n\n\n\n在将页面写入到 PDF 文档时，`onWrite()` 方法必须采取措施，确保只打印用户指定的页面。为了实现这一点，`Printing`\
  \ 框架会将一个 `PageRange` 对象的数组作为参数传递，该数组指示要打印的页面范围。在上面的 `onWrite()` 实现中，会为每个页面调用 `pageInRange()`\
  \ 方法，以验证该页面是否在指定的范围内。`pageInRange()` 方法的代码将在本章稍后部分实现。\n\n```java\nfor (int i = 0;\
  \ i < totalpages; i++) {\n    if (pageInRange(pageRanges, i)) {\n    }\n}\n```\n\
  \n对于位于指定范围内的每个页面，都会创建一个新的 `PdfDocument.Page` 对象。在创建新页面时，之前由 `onLayout()` 方法存储的高度和宽度值将作为参数传递，以便使页面大小与用户选择的打印选项匹配：\n\
  \n```java\nPageInfo newPage = new PageInfo.Builder(pageWidth, pageHeight, i).create();\n\
  PdfDocument.Page page = myPdfDocument.startPage(newPage);\n```\n\n与 `onLayout()`\
  \ 方法一样，`onWrite()` 方法也需要响应取消请求。在这种情况下，代码会在关闭并取消引用 `myPdfDocument` 变量之前，通知 `Printing`\
  \ 框架取消已执行：\n\n```java\nif (cancellationSignal.isCanceled()) {\n    callback.onWriteCancelled();\n\
  \    myPdfDocument.close();\n    myPdfDocument = null;\n    return;\n}\n```\n\n\
  只要打印过程没有被取消，方法在调用 `myPdfDocument` 对象的 `finishedPage()` 方法之前，会调用一个方法在当前页面上绘制内容：\n\
  \n```java\ndrawPage(page, i);\nmyPdfDocument.finishPage(page);\n```\n\n`drawPage()`\
  \ 方法负责将内容绘制到页面上，并在 `onWrite()` 方法完成后实现。\n\n当所需的页面数量已添加到 PDF 文档后，文档将使用文件描述符写入目标流，文件描述符作为参数传递给\
  \ `onWrite()` 方法。如果由于任何原因写入操作失败，方法将通过调用 `WriteResultCallback` 对象的 `onWriteFailed()`\
  \ 方法（该对象也作为参数传递给 `onWrite()` 方法）来通知框架。\n\n```java\ntry {\n    myPdfDocument.writeTo(new\
  \ FileOutputStream(\n            destination.getFileDescriptor()));\n} catch (IOException\
  \ e) {\n    callback.onWriteFailed(e.toString());\n    return;\n} finally {\n  \
  \  myPdfDocument.close();\n    myPdfDocument = null;\n}\n```\n\n最后，将调用 `WriteResultsCallback`\
  \ 对象的 `onWriteFinish()` 方法，通知 `Printing` 框架文档已准备好打印。\n\n### 77.6 检查页面是否在范围内\n\n\
  如前所述，当调用 `onWrite()` 方法时，会传递一个 `PageRange` 对象的数组，指示文档中要打印的页面范围。`PageRange` 类设计用于存储页面范围的起始页和结束页，反之，可以通过该类的\
  \ `getStart()` 和 `getEnd()` 方法进行访问。\n\n在上一节实现 `onWrite()` 方法时，调用了一个名为 `pageInRange()`\
  \ 的方法，该方法接收一个 `PageRange` 对象的数组和一个页码作为参数。`pageInRange()` 方法的作用是识别指定的页码是否在指定的范围内，可以如下所示在\
  \ `MainActivity.java` 类的 `MyPrintDocumentAdapter` 类中实现：\n\n```java\npublic class\
  \ MyPrintDocumentAdapter extends PrintDocumentAdapter {\n    //\n    private boolean\
  \ pageInRange(PageRange[] pageRanges, int page) {\n        for (PageRange pageRange\
  \ : pageRanges) {\n            if ((page >= pageRange.getStart()) &&\n         \
  \       (page <= pageRange.getEnd()))\n                return true;\n        }\n\
  \        return false;\n    }\n    //\n}\n```\n\n### 77.7 在页面上绘制内容\n\n现在我们到了编写某些代码在页面上绘制内容以使其准备好打印的步骤。所绘制的内容完全取决于并限于使用\
  \ `Canvas` 类所能实现的内容。在本示例中，将在画布上绘制一些文本和图形。`onWrite()` 方法被设计为调用名为 `drawPage()` 的方法，该方法接收一个代表当前页面的\
  \ `PdfDocument.Page` 对象和一个代表页码的整数作为参数。在 `MainActivity.java` 中，此方法现在的实现如下：\n\n```java\n\
  package com.frenzy.print;\n\nimport android.graphics.Canvas;\nimport android.graphics.Color;\n\
  import android.graphics.Paint;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    static class MyPrintDocumentAdapter extends PrintDocumentAdapter {\n  \
  \      private void drawPage(PdfDocument.Page page, int pagenumber) {\n        \
  \    Canvas canvas = page.getCanvas();\n            pagenumber++; // 让页码从 1 开始\n\
  \            int titleBaseLine = 72;\n            int leftMargin = 5;\n        \
  \    Paint paint = new Paint();\n            paint.setColor(Color.BLACK);\n    \
  \        paint.setTextSize(40);\n            canvas.drawText(\n                \"\
  Test Document Page \" + pagenumber,\n                leftMargin,\n             \
  \   titleBaseLine,\n                paint);\n            paint.setTextSize(14);\n\
  \            canvas.drawText(\"This is some test content to verify that custom printing\
  \ works\", leftMargin, titleBaseLine + 35, paint);\n            if (pagenumber %\
  \ 2 == 0)\n                paint.setColor(Color.RED);\n            else\n      \
  \          paint.setColor(Color.GREEN);\n            PageInfo pageInfo = page.getInfo();\n\
  \            canvas.drawCircle(\n                pageInfo.getPageWidth()/2,\n  \
  \              pageInfo.getPageHeight()/2,\n                150,\n             \
  \   paint);\n        }\n    }\n}\n```\n\n代码中的页码从 0 开始。由于文档通常从 1 开始，该方法首先递增存储的页码。然后获取与页面关联的\
  \ `Canvas` 对象引用，并声明一些边距和基线值：\n\n```java\nCanvas canvas = page.getCanvas();\npagenumber++;\n\
  int titleBaseLine = 72;\nint leftMargin = 5;\n```\n\n接下来，代码创建用于绘制的 `Paint` 和 `Color`\
  \ 对象，设置字体大小并绘制页面标题，包括当前页码：\n\n```java\nPaint paint = new Paint();\npaint.setColor(Color.BLACK);\n\
  paint.setTextSize(40);\ncanvas.drawText(\"Test Document Page \" + pagenumber,\n\
  \    leftMargin,\n    titleBaseLine,\n    paint);\n```\n\n随后缩小字体大小，并在标题下方绘制正文内容：\n\
  \n```java\npaint.setTextSize(14);\ncanvas.drawText(\"This is some test content to\
  \ verify that custom printing works\", leftMargin, titleBaseLine + 35, paint);\n\
  ```\n\n该方法的最后一个任务是绘制一个圆（偶数页为红色，奇数页为绿色）。在确定页面是奇数偶数后，方法获取页面的高度和宽度，然后利用这些信息将圆放置在页面中心：\n\
  \n```java\nif (pagenumber % 2 == 0)\n    paint.setColor(Color.RED);\nelse\n    paint.setColor(Color.GREEN);\n\
  PageInfo pageInfo = page.getInfo();\ncanvas.drawCircle(pageInfo.getPageWidth()/2,\n\
  \    pageInfo.getPageHeight()/2,\n    150, paint);\n```\n\n\n\n在画布绘制完成后，该方法会将控制权交回给\
  \ `onWrite()` 方法。\n\n随着 `drawPage()` 方法完成，`MyPrintDocumentAdapter` 类完成后。\n\n###\
  \ 77.8 启动打印作业\n\n当用户点击“打印文档”（Print Document）按钮时，将调用 `printDocument()` onClick 事件处理方法。现在在开始测试之前，剩下的工作是将此方法添加到\
  \ `MainActivity.java` 文件中，特别注意确保将其放置在 `MyPrintDocumentAdapter` 类之外：\n\n```java\n\
  package com.ebookfrenzy.customprint;\n\n.\n.\n\nimport android.print.PrintManager;\n\
  \nimport android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    public void printDocument(View view)\n    {\n        PrintManager printManager\
  \ = (PrintManager) this\n                    .getSystemService(Context.PRINT_SERVICE);\n\
  \        String jobName = this.getString(R.string.app_name) +\n                \
  \            \" Document\";\n        printManager.print(jobName, new\n         \
  \                   MyPrintDocumentAdapter(this),\n                            null);\n\
  \    }\n}\n.\n.\n```\n\n该方法在创建一个新的 `String` 对象作为打印任务名称之前，获取了设备上运行的 Print Manager\
  \ 服务的引用。最后，调用 Print Manager 的 `print()` 方法启动打印作业，传递作业名称和我们自定义打印文档适配器类的实例。\n\n###\
  \ 77.9 测试应用程序\n\n在 Android 设备或模拟器上编译并运行应用程序。当应用程序加载后，点击“打印文档”按钮以启动打印作业，并为输出选择合适的目标（“保存为\
  \ PDF”选项有助于避免浪费纸张和打印机墨水）。\n\n检查打印输出，它应该包含 4 页内容，包括文本和图形。例如，图 77-3 显示了作为 PDF 文件查看并准备好保存到设备上的文档四页内容。\n\
  \n尝试其他的打印配置选项，例如在打印面板中更改纸张大小、方向和页面设置。打印输出应反映每项设置的变化，表明自定义打印文档适配器功能正常。\n\n![](img/as_4.1_custom_print_running.jpg)\n\
  \n图 77-3\n\n### 77.10 总结\n\n虽然自定义文档打印的实现比 Android 打印框架的 HTML 和图像打印选项复杂，但它为在 Android\
  \ 应用程序中打印复杂内容提供了巨大的灵活性。实现自定义文档打印的大部分工作涉及创建一个自定义打印 适配器类，该类不仅在文档页面上绘制内容，还能在用户更改打印设置（如页面大小和打印页面范围）时做出正确响应。\n\
  \n## 78 Android App 链接（App Links）简介\n\n随着技术的演进，网页内容与移动内容之间的传统区别开始模糊。这一点特别真实的一个领域是渐进式\
  \ Web 应用（progressive web apps）的日益普及，这些 Web 应用的外观和行为非常类似于传统的移动应用。\n\n另一个趋势是通过 Web\
  \ 搜索和 URL 链接使移动应用中的内容变得可发现。在 Android 应用开发背景下，`App Links` 功能旨在让用户能够更容易地发现和访问存储在 Android\
  \ 应用中的内容，即使使用户没有安装该应用。\n\n## 78.1 Android App 链接概述\n\nApp 链接（app link）是一个标准的 HTTP\
  \ URL，是从外部源（如网站或应用）直接链接到应用中特定位置的简单方法。App 链接（也称为深度链接 deep links）主要用于鼓励用户与应用互动，并允许用户共享应用内容。\n\
  \nApp 链接的实现是一个多步骤过程，涉及向项目清单（manifest）添加意图过滤器（intent filters）、在关联的应用 Activity 中实现链接处理代码以及使用数字资产链接文件（digital\
  \ asset links files）将应用与 Web 端内容关联。\n\n这些步骤可以通过手动修改项目来完成，也可以使用 Android Studio App\
  \ Links 助手（Assistant）自动完成。\n\n本章的剩余部分将从对项目进行的更改来概述 App 链接的实现。下一章 (“Android Studio\
  \ App Links 教程”) 将演示如何使用 `App Links Assistant` 实现相同的结果。\n\n## 78.2 App 链接意图过滤器\n\
  \nApp 链接 URL 需要映射到应用项目中的特定 Activity。这是通过向项目的 `AndroidManifest.xml` 文件添加意图过滤器实现的，这些过滤器旨在响应\
  \ `android.intent.action.VIEW` 操作来启动 Activity。意图过滤器声明在要启动的 Activity 内部，并且包含概述 App\
  \ 链接 URL 的方案（scheme）、主机（host）和路径（path）的数据。例如，下面的清单片段声明了一个意图过滤器，当检测到匹配 `http://www.example.com/welcome`\
  \ 的 App 链接时，启动名为 `MyActivity` 的 Activity：\n\n```xml\n<activity android:name=\"com.ebookfrenzy.myapp.MyActivity\"\
  >\n    <intent-filter android:autoVerify=\"true\">\n        <action android:name=\"\
  android.intent.action.VIEW\" />\n        <category android:name=\"android.intent.category.DEFAULT\"\
  \ />\n        <category android:name=\"android.intent.category.BROWSABLE\" />\n\
  \        <data android:scheme=\"http\"\n              android:host=\"www.example.com\"\
  \n              android:pathPrefix=\"/welcome\" />\n    </intent-filter>\n</activity>\n\
  ```\n\n处理歧义意图过滤器的顺序可以使用意图过滤器的 `order` 属性指定，如下所示：\n\n```xml\n<application>\n    <activity\
  \ android:name=\"com.ebookfrenzy.myapp.MyActivity\">\n        <intent-filter android:autoVerify=\"\
  true\" android:order=\"1\">\n            .\n        </intent-filter>\n    </activity>\n\
  </application>\n```\n\n意图过滤器会使 App 链接启动 Activity，但仍需要在目标 Activity 中添加代码来处理意图。\n\n\
  ## 78.3 处理 App 链接意图\n\n在大多数情况下，启动的 Activity 需要访问 App 链接 URL 并根据 URL 的结构采取特定行动。继续上面的示例，当通过路径为\
  \ `/welcome/newuser` 的 URL 启动时，显示的内容与路径设置为 `/welcome/existinguser` 时不同。\n\n当链接启动\
  \ Activity 时，会传递一个包含启动 Activity 操作数据的 `intent` 对象，其中包含 App 链接 URL 的 `Uri` 对象。在 Activity\
  \ 的初始化阶段，可以添加代码按如下方式提取这些数据：\n\n```java\nIntent appLinkIntent = getIntent();\nString\
  \ appLinkAction = appLinkIntent.getAction();\nUri appLinkData = appLinkIntent.getData();\n\
  ```\n\n获取 App 链接的 `Uri` 后，可以使用 URL 路径的各个组件来决定 Activity 中执行的操作。在下面的代码示例中，URL 的最后一个部分被用于识别为新用户还是现有用户显示内容：\n\
  \n```java\nString userType = appLinkData.getLastPathSegment();\nif (userType.equals(\"\
  newuser\")) {\n    // 显示新用户内容\n} else {\n    // 显示现有用户内容\n}\n```\n\n## 78.4 将应用与网站关联\n\
  \n在 App 链接生效之前，必须将 App 链接 URL 与 App 链接所基于的网站关联。这是通过创建一个名为 `assetlinks.json` 的数字资产链接文件并将其安装在网站的\
  \ `.well-known` 文件夹中实现的。注意，数字资产链接仅适用于基于 HTTPS 的网站。\n\n\n\n\n\n数字资产链接文件（Digital asset\
  \ links file）包含一个关系声明（relation statement），允许目标应用使用网站的链接 URL 启动；以及一个目标声明（target statement），用于声明伴侣应用的包名和对应该项目的\
  \ `SHA-256` 证书指纹。一个典型的资产链接文件可能如下：\n\n```json\n[{\n    \"relation\": [\"delegate_permission/common.handle_all_urls\"\
  ],\n    \"target\" : { \"namespace\": \"android_app\",\n      \"package_name\":\
  \ \"<app package name here>\",\n      \"sha256_cert_fingerprints\": [\"<app certificate\
  \ here>\"] }\n}]\n```\n\n`assetlinks.json` 文件可以包含多个数字资产链接，允许单个网站与多个伴侣应用关联。\n\n###\
  \ 78.5 总结\n\nAndroid App Links（Android 应用链接）允许通过来自外部网站和其他应用的 URL 链接启动应用活动（activities）。App\
  \ Links 通过项目清单文件中的 `intent filters`（意图过滤器）以及启动的活动中的意图处理代码来实现。通过使用数字资产链接文件，还可以将应用链接中使用的域名与相应的网站关联。一旦建立这种关联，当使用应用链接时，Android\
  \ 就不再需要要求用户选择目标应用。\n\n## 79. Android Studio App Links 教程\n\n本章旨在对 Android 应用链接和\
  \ Android Studio App Links 助手（App Link Assistant）进行实际演示。本章将为现有的 Android 应用添加应用链接支持，允许通过应用链接\
  \ URL 启动活动。除了启动活动外，显示的内容还将在 URL 的路径中指定。\n\n### 79.1 关于示例应用\n\n本章使用的项目命名为 `AppLinking`，是一个基础应用，旨在允许用户查找有关伦敦地标的信息。该应用使用通过标准\
  \ Android 内容提供者（content provider）类访问的 `SQLite` 数据库。该应用有一个现有的数据库，其中包含了伦敦热门旅游景点的记录。除了现有的数据库条目外，应用还允许用户添加和删除地标描述。\n\
  \n目前，该应用允许搜索现有记录，并添加和删除新记录。\n\n该项目由两个名为 `AppLinkingActivity` 和 `LandmarkActivity`\
  \ 的活动组成。`AppLinkingActivity` 是应用启动时启动的主活动。该活动允许用户输入搜索标准并向数据库添加记录。当搜索找到匹配的记录时，`LandmarkActivity`\
  \ 将启动并显示相关地标的信息。\n\n本章将增强该应用以支持应用链接，以便可以使用 URL 在应用内显示特定的地标记录。\n\n### 79.2 数据库结构\n\
  \n示例应用的数据包含名为 `landmarks.db` 的文件中，位于项目层级结构的 `app` -> `assets` -> `databases` 文件夹中。数据库包含一个名为\
  \ `locations` 的表，其结构概述如下：\n\n| 列 | 类型 | 描述 |\n| :--- | :--- | :--- |\n| _id` | String\
  \ | 主索引，此列包含唯一标识数据库中地标的字符串值。 |\n| title | String | 地标的名称（例如，伦敦桥）。 |\n| description\
  \ | String | 地标的描述。 |\n| personal | Boolean | 表示记录是私人的还是公共的。对于用户添加的所有记录，此值设置为 true。数据库提供的现有记录设置为\
  \ false。 |\n\n表 79-1\n\n### 79.3 加载并运行项目\n\n该项目包含位于以下 URL 的示例源码下载压缩包的 `AppLinking`\
  \ 文件夹中：\n\n`https://www.ebookfrenzy.com/retail/giraffejava/index.php`\n\n找到文件夹后，在\
  \ Android Studio 中打开它并在设备或模拟器上运行应用。一旦应用启动，将出现下图 79-1 所示的屏幕：\n\n![](img/as_applinking_ui_home.jpg)\n\
  \n图 79-1\n\n如果出现 `kotlin.collections.jdk8.CollectionsJDK8Kt` 错误，请对 `build.gradle.kts`\
  \ (Module: app) 文件进行以下更改，同步项目并重试：\n\n```kotlin\ndependencies {\n    ...\n    implementation(platform(\"\
  org.jetbrains.kotlin:kotlin-bom:1.8.0\"))\n    ...\n}\n```\n\n按照目前的实现方式，地标是通过位置\
  \ ID 查找的。默认数据库配置当前包含两个由 ID `londonbridge` 和 `toweroflondon` 引用的记录。通过在 ID 字段中输入 `londonbridge`\
  \ 并点击 Find 按钮来测试搜索功能。当找到匹配的记录时，会启动第二个活动（`LandmarkActivity`）并传递有关该记录的信息进行显示。这些信息以添加到\
  \ `Intent` 对象的额外数据（extra data）的形式存在。`LandmarkActivity` 使用这些信息从数据库中提取记录，并使用图 79-2\
  \ 所示的屏幕显示给用户。\n\n![](img/as_applinking_ui_london_bridge.jpg)\n\n图 79-2\n\n### 79.4\
  \ 添加 URL 映射\n\n现在应用已经加载到 Android Studio 并通过测试，我们可以添加应用链接支持。目标是让 `LandmarkActivity`\
  \ 屏幕响应应用链接点击并启动并显示信息。这是通过将 URL 映射到 `LandmarkActivity` 实现的。在本示例中，URL 的格式将：\n\n`http://<website\
  \ domain>/landmarks/<landmarkId>`\n\n完成所有步骤后，相应的 URL 应该导致应用显示有关伦敦塔的信息：\n\n`http://yourdomain.com/toweroflondon`\n\
  \n要向项目添加 URL 映射，首先通过 `Tools` -> `App Links` 菜单打开 App Links 助手。打开后，助手将如图 79-3 所示：\n\
  \n![](img/as_applinks_assistant.jpg)\n\n图 79-3\n\n点击 `Open URL Mapping` 按钮将 URL\
  \ 映射到活动。在映射屏幕内，点击图 79-4 中高亮的 `+` 按钮添加新 URL：\n\n![](img/as_applinks_assistant_mappings.jpg)\n\
  \n图 79-4\n\n在 `Add URL Mapping` 对话框的 `Host` 字段中，输入你网站的 URL。如果你没有用于此教程的网站，可以使用 `http://www.example.com`\
  \ 继续学习本章，但无法测试需要数字链接文件的功能。\n\n`Path` 字段（见图 79-5 中的 B）是声明 URL 路径的地方。路径必须以 `/` 开头，因此在此字段中输入\
  \ `/landmarks`。\n\n`Path` 菜单（B）提供了以下三种路径匹配选项：\n\n- `path` – URL 必须精确匹配 URL 的路径部分才能启动活动。例如，如果路径设置为\
  \ `/landmarks`，则 `http://www.example.com/landmarks` 被视为匹配。然而，`http://www.example.com/landmarks/londonbridge`\
  \ 将不被视为匹配。\n- `pathPrefix` – 指定的路径仅被视为前缀。在 `/landmarks` 组件之后可以包含额外的路径组件（例如，`http://www.example.com/landmarks/londonbridge`\
  \ 将被视为匹配）。\n- `pathPattern` – 允许使用基本正则表达式和通配符的模式匹配形式指定路径，例如 `landmarks/*/[l-L]ondon/*`\n\
  \n由于在本示例中，路径是地标 ID 组件的前缀，请选择 `pathPrefix` 菜单选项。\n\n最后，使用 `Activity` 菜单（C）选择 `LandmarkActivity`\
  \ 作为响应应用链接启动的活动：\n\n![](img/as_applinks_url_mapping.jpg)\n\n图 79-5\n\n\n\n\n\n完成对话框中的设置后，点击\
  \ `OK` 按钮以提交更改。通过在映射屏幕的 `Check URL Mapping` 字段中输入以下 URL，检查 `URL` 格式是否正确以及是否分配给相应的活动（其中\
  \ `<your domain>` 设置为上方 `Host` 字段中指定的域名）：\n\n`http://<your domain>/landmarks/toweroflondon`\n\
  \n如果映射配置正确，`LandmarkActivity` 将列为已映射的活动：\n\n![](img/as_app_links_check_url.jpg)\n\
  \n图 79-6\n\n最新版本的 Android 要求对 HTTP 和 HTTPS 协议都声明 App Links，即使只使用了其中一种。因此，在继续下一步之前，请重复上述步骤，将\
  \ `URL` 的 HTTPS 版本添加到列表中。\n\n下一步也将在 App Links 助手（App Links Assistant）的 URL 映射屏幕中进行，因此请保持该屏幕处于选中状态。\n\
  \n### 79.5 添加 Intent Filter\n\n如上一章所述，需要一个意过滤器（intent filter）来响应应用链接点击并启动目标活动。事实上，当添加\
  \ URL 映射时，意过滤器已自动添加到项目清单文件（manifest）中。在 App Links 助手的 URL 映射列表中选中该 URL 映射，向下滚动屏幕直到意过滤器预览（Preview）部分进入视野。预览内容应包含修改后的\
  \ `AndroidManifest.xml` 文件，其中包含了新添加的意过滤器：\n\n![](img/as_app_links_intent_filter.jpg)\n\
  \n图 79-7\n\n尽管 App Links 助手已为我们添加了意过滤器，但它可能没有包含处理应用链接时所需的 `autoVerify` 设置。打开 `manifests\
  \ -> AndroidManifest.xml` 文件，并如下所示将此设置添加到两个意过滤器中：\n\n```xml\n<intent-filter android:autoVerify=\"\
  true\">\n.\n.\n    <data\n        android:scheme=\"http\"\n        android:host=\"\
  www.ebookfrenzy.com\"\n        android:pathPrefix=\"/landmarks\" />\n</intent-filter>\n\
  \n<intent-filter android:autoVerify=\"true\">\n.\n.\n    <data\n        android:scheme=\"\
  https\"\n        android:host=\"www.ebookfrenzy.com\"\n        android:pathPrefix=\"\
  /landmarks\" />\n</intent-filter>\n```\n\n### 79.6 添加 Intent 处理代码\n\n到目前为止的操作确保了在响应格式正确的应用链接\
  \ URL 时会启动正确的活动。下一步是在 `LandmarkActivity` 类中处理该 intent，以便从数据库中提取正确的记录并显示给用户。在修改 `LandmarkActivity.java`\
  \ 文件中的任何代码之前，值得审查现有代码的某些区域。在代码编辑器中打开 `LandmarkActivity.java` 文件，并找到 `onCreate()`\
  \ 和 `handleIntent()` 方法，它们目前的内容应该如下：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityLandmarkBinding.inflate(getLayoutInflater());\n    View view = binding.getRoot();\n\
  \    setContentView(view);\n    handleIntent(getIntent());\n}\n\nprivate void handleIntent(Intent\
  \ intent) {\n    String landmarkId =\n        intent.getStringExtra(AppLinkingActivity.LANDMARK_ID);\n\
  \    displayLandmark(landmarkId);\n}\n```\n\n在当前形式下，代码期望在 `Intent` 捆包的额外数据（extra\
  \ data）中找到地标 ID。由于活动现在可以通过应用链接启动，必须更改此代码以处理两种情况。首先删除 `onCreate()` 方法中的 `handleIntent()`\
  \ 调用：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityLandmarkBinding.inflate(getLayoutInflater());\n\
  \    View view = binding.getRoot();\n    setContentView(view);\n    handleIntent(getIntent());\n\
  }\n```\n\n要添加初始的应用链接 intent 处理代码，返回 App Links 助手面板，并点击步骤 2 下列出的 `Select Activity`\
  \ 按钮。在活动选择对话框中，点击 `Insert Code` 按钮之前，选择 `LandmarkActivity` 条目：\n\n![](img/as_app_links_select_activity.jpg)\n\
  \n图 79-8\n\n返回 `LandmarkActivity.java` 文件，注意以下代码已插入到 `onCreate()` 方法中（注意，如果 Android\
  \ Studio 无法完成请求，您可以手动添加此代码）：\n\n```java\n// ATTENTION: 这是自动生成的，用于处理应用链接。\nIntent\
  \ appLinkIntent = getIntent();\nString appLinkAction = appLinkIntent.getAction();\n\
  Uri appLinkData = appLinkIntent.getData();\n```\n\n此代码访问 `Intent` 对象并提取 `Action`\
  \ 字符串和 `Uri`。如果活动启动是由应用链接引起的，action 字符串将设置为 `android.intent.action.VIEW`，这与添加到清单文件的意过滤器中声明的\
  \ action 匹配。反之，如果代码选择活动来识别活动是如何启动的，代码逻辑如下：\n\n```java\nimport android.net.Uri;\n\
  \n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityLandmarkBinding.inflate(getLayoutInflater());\n    View view\
  \ = binding.getRoot();\n    setContentView(view);\n\n    // ATTENTION: 这是自动生成的，用于处理应用链接。\n\
  \    Intent appLinkIntent = getIntent();\n    String appLinkAction = appLinkIntent.getAction();\n\
  \    Uri appLinkData = appLinkIntent.getData();\n\n    if (appLinkAction != null)\
  \ {\n        if (appLinkAction.equals(\"android.intent.action.VIEW\")) {\n     \
  \       String landmarkId = appLinkData.getPathSegment();\n            if (landmarkId\
  \ != null) {\n                displayLandmark(landmarkId);\n            }\n    \
  \    }\n    } else {\n        handleIntent(appLinkIntent);\n    }\n}\n```\n\n剩下的工作是添加代码以识别\
  \ URL 的最后部分，并在查询数据库时作为地标 ID。\n\n### 79.7 测试应用\n\n在设备或模拟器上运行应用，确保仍然可以搜索示例地标。我们现在成功为应用添加了应用链接支持。如果您为应用链接指定了自己的网站\
  \ URL，现在可以更进一步创建并安装 Digital Asset Links 文件。\n\n### 79.8 创建 Digital Asset Links 文件\n\
  \n如“Android Intent 概述”章节所述，为了完全支持应用链接，我们需要在应用链接引用的网站上安装 Digital Asset Links 文件。首先按照“Android\
  \ Intent 概述”章节中列出的步骤找到 `debug.keystore` 文件并识别您的 `SHA256` 指纹。\n\n接下来，在浏览器中打开以下页面：\n\
  \n[`developers.google.com/digital-asset-links/tools/generator`](https://developers.google.com/digital-asset-links/tools/generator)\n\
  \n\n\n\n点击 `Generate` 语句按钮以显示生成的语句，并将其放在 Web 服务器上名为 `.well-known` 的文件夹中的，命名为 `assetlinks.json`。返回生成器页面，并点击\
  \ `Test` 语句按钮以验证文件是否位于正确位置。如果测试成功，将出现类似下面的输出：\n\n![](img/asset_file_link_test.jpg)\n\
  \n图 79-10\n\n假设测试成功，我们现在可以尝试使用应用链接（app link）。\n\n## 79.9 测试应用链接\n\n返回 App Links\
  \ 助手面板并点击 `Test App Links` 按钮，测试意图处理是否正常工作。当提示输入测试 URL 时，在点击 `Run Test` 按钮之前，输入使用应用链接映射中引用的域名的\
  \ londonbridge 地标 ID 对应的 URL：\n\n![](img/as_app_links_test_on_device.jpg)\n\n图 79-11\n\
  \n点击按钮后，`Landmark` 活动应在设备或模拟器上启动，并显示关于伦敦桥的信息。\n\n## 79.10 总结\n\n本章演示了在 Android 应用项目中实现\
  \ App Link 支持的步骤，包括在 Android Studio 中使用 App Link 助手、App Link URL 映射、意图过滤器（intent\
  \ filters）、使用数字资产链接文件项处理网站关联，以及 App Link 测试。\n\n## 80. Android 生物识别教程\n\n触摸传感器现在已内置于许多\
  \ Android 设备中，用于识别用户并提供设备和应用功能的访问，例如使用指纹识别的应用内支付选项。指纹识别只是多种认证方法之一，还包括密码、PIN 以及最近的面部识别。\n\
  \n尽管目前市场上只有少数 Android 设备提供面部识别，但这在未来可能会变得更加。。此，Google 已开始从以指纹为核心的添加应用认证的方法转向一种更具通用的方法，称为生物识别。\n\
  \n本章提供了生物识别的概述，并提供了一个详细的、循序渐进的教程，演示了在 Android 应用项目中实现生物识别的实用方法。\n\n### 80.1 生物识别概述\n\
  \n关键的生物识别组件是 `BiometricPrompt` 类。该类执行了许多以前在早期 Android 版本中必须通过编写代码完成的工作，包括显示标准对话框以引导用户完成认证过程、执行认证并将结果报告给应用。该类还处理了多次失败的认证尝试，并在用户再次尝试之前强制执行超时。\n\
  \n`BiometricPrompt` 类包含一个伴随类 `Builder`，可以使用它可以配置和创建 `BiometricPrompt` 实例，包括定义要在生物识别对话框中显示的文本，以及对对话框中取消按钮（也称为负向按钮）进行自定义。\n\
  \n`BiometricPrompt` 实例还分配了一组认证回调，这些回调将被调用，以为应用提供认证操作的结果。还使用了 `CancellationSignal`\
  \ 实例，允许应用在认证进行期间取消认证。\n\n在涵盖了这些基础知识后，本章的剩余部分将在示例项目中实现基于指纹的生物识别。\n\n### 80.2 创建生物识别项目\n\
  \n从欢迎界面选择 `New Project` 选项，在生成的新项目对话框中，点击 `Next` 按钮之前，选择 `Empty Views Activity`\
  \ 模板。\n\n在 `Name` 字段中输入 `BiometricDemo` 并指定 `com.ebookfrenzy.biometricdemo` 为包名。在点击\
  \ `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 29: Android (Q)`，并将 `Language` 菜单更改\
  \ `Java`。\n\n### 80.3 配置设备指纹认证\n\n指纹认证仅适用于包含触摸传感器的设备，并且已采取适当的配置步骤来保护设备并录入至少一个指纹。有关配置模拟器会话以测试指纹认证的步骤，请参阅章节\
  \ Using and Configuring the Android Studio AVD Emulator。\n\n通过打开 `Settings` 应用并选择\
  \ `Security` 选项在物理设备上配置指纹认证。在 `Security` 设置屏幕内，选择 `Fingerprint` 选项。点击信息屏幕上的 `Next`\
  \ 按钮进入 `Fingerprint` 设置屏幕。在启用指纹安全之前，必须配置备份的屏幕解锁方法（例如 `PIN`）。如果锁屏未受保护，请按照步骤配置 `PIN`、`pattern`\
  \ 或 `password` 安全。\n\n锁定屏幕保护后，继续进入指纹检测屏幕并在提示时触摸传感器（图 80-1），如果需要，重复此过程添加额外的指纹。\n\n\
  ![](img/Image24253.jpg)\n\n图 80-1\n\n### 80.4 在 Manifest 文件中添加生物识别权限\n\n生物识别要求应用在项目清单文件中请求\
  \ `USE_BIOMETRIC` 权限。在 Android Studio 项目工具窗口中，定位并编辑 `app` -> `manifests` -> `AndroidManifest.xml`\
  \ 文件，按如下方式添加权限请求：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.biometricdemo\"\
  >\n    <uses-permission\n        android:name=\"android.permission.USE_BIOMETRIC\"\
  \ />\n```\n\n### 80.5 设计用户界面\n\n为了保持示例尽可能简单，用户界面中的视觉元素元素是一个 `Button` 。定位并选择 `activity_main.xml`\
  \ 布局资源文件将其加载到布局编辑器。\n\n删除 `TextView` 对象，从调板的 `Common` 类别拖入一个 `Button` 对象并将其放置在画布中心。使用\
  \ `Attributes` 工具窗口，将按钮的 `text` 属性更改为“Authenticate”，并将字符串提取到资源。最后，配置 `onClick` 属性以调用名为\
  \ `authenticateUser` 方法。\n\n完成上述步骤后，布局应与 图 80-2 所示：\n\n![](img/as_biometric_demo_ui.jpg)\n\
  \n图 80-2\n\n### 80.6 添加 Toast 便利方法\n\n在示例代码的各个点，应用将设计为通过 `Toast` 消息向用户显示信息。为了避免重复相同的\
  \ `Toast` 代码，将在主活动中添加一个名为 `notifyUser()` 的便利方法。该方法将接受单个 `String` 值并将其作为 `Toast`\
  \ 消息显示给用户。现在编辑 `MainActivity.java` 文件并添加该方法：\n\n```java\nimport android.widget.Toast;\n\
  \nprivate void notifyUser(String message) {\n    Toast.makeText(this, message, Toast.LENGTH_LONG).show();\n\
  }\n```\n\n### 80.7 检查安全设置\n\n在本章早些之前，已经在要在测试应用的设备或模拟器上配置了锁屏并注册了指纹。然而，在应用中包含防御性代码以确保在尝试寻求指纹认证之前已满足这些要求是重要的。这些步骤将在\
  \ `MainActivity.java` 文件中的 `onCreate` 方法中执行，使用 `Keyguard` 和 `PackageManager` 管理服务。注意，还添加了代码以验证应用已配置了\
  \ `USE_BIOMETRIC` 权限。\n\n\n\n\n```java\npackage com.ebookfrenzy.biometricdemo;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.app.ActivityCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\nimport android.content.pm.PackageManager;\n\
  import android.app.KeyguardManager;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_biometric_demo);\n\
  \        checkBiometricSupport();\n    }\n\n    private void checkBiometricSupport()\
  \ {\n        KeyguardManager keyguardManager =\n                (KeyguardManager)\
  \ getSystemService(KEYGUARD_SERVICE);\n        if (!keyguardManager.isKeyguardSecure())\
  \ {\n            notifyUser(\"Lock screen security not enabled in Settings\");\n\
  \        }\n        if (ActivityCompat.checkSelfPermission(this,\n             \
  \   Manifest.permission.USE_BIOMETRIC) !=\n                PackageManager.PERMISSION_GRANTED)\
  \ {\n            notifyUser(\"Fingerprint authentication permission not enabled\"\
  );\n        }\n    }\n}\n```\n\n上述代码首先通过使用 `Keyguard manager` 来验证是否配置了备用屏幕解锁方法（换句话说，`PIN`\
  \ 或其他验证方法可以作为指纹识别的替代方案来解锁屏幕）。如果锁屏未加密，代码将向用户报告问题并从方法返回。\n\n然后，该方法会在使用包管理器验证设备是否支持指纹识别之前，检查用户是否已为应用启用了生物识别权限。\n\
  \n### 80.8 配置身份验证回调\n\n在配置生物识别提示对话框时，需要分配一组身份验证回调方法，这些方法可以通知应用身份验证过程的成功或失败。这些方法需要封装在\
  \ `BiometricPrompt.AuthenticationCallback` 类实例中。继续留在 `MainActivity.java` 文件中，添加一个方法来创建并返回一个实现了相应方法的类实例：\n\
  \n```java\nimport android.hardware.biometrics.BiometricPrompt;\n\nprivate BiometricPrompt.AuthenticationCallback\
  \ getAuthenticationCallback() {\n    return new BiometricPrompt.AuthenticationCallback()\
  \ {\n        @Override\n        public void onAuthenticationError(int errorCode,\n\
  \                CharSequence errString) {\n            notifyUser(\"Authentication\
  \ error: \" + errString);\n            super.onAuthenticationError(errorCode, errString);\n\
  \        }\n        @Override\n        public void onAuthenticationHelp(int helpCode,\n\
  \                CharSequence helpString) {\n            super.onAuthenticationHelp(helpCode,\
  \ helpString);\n        }\n        @Override\n        public void onAuthenticationFailed()\
  \ {\n            super.onAuthenticationFailed();\n        }\n        @Override\n\
  \        public void onAuthenticationSucceeded(\n                BiometricPrompt.AuthenticationResult\
  \ result) {\n            notifyUser(\"Authentication Succeeded\");\n           \
  \ super.onAuthenticationSucceeded(result);\n        }\n    };\n}\n```\n\n### 80.9\
  \ 添加 CancellationSignal\n\n一旦启动，生物识别认证过程将独立于应用运行。为了给应用提供取消操作的方法，创建 `CancellationSignal`\
  \ 类的实例并将其传递给生物识别认证过程。该 `CancellationSignal` 实例可以在需要时取消进程。取消信号实例可以配置一个监听器，该器将在取消完成时调用。在活动类中添加一个新方法来配置并返回一个\
  \ `CancellationSignal` 对象，如下：\n\n```java\nimport android.os.CancellationSignal;\n\
  \nprivate CancellationSignal cancellationSignal;\n\nprivate CancellationSignal getCancellationSignal()\
  \ {\n    cancellationSignal = new CancellationSignal();\n    cancellationSignal.setOnCancelListener(()\
  \ ->\n        notifyUser(\"Cancelled via signal\"));\n    return cancellationSignal;\n\
  }\n```\n\n### 80.10 启动生物识别提示\n\n剩下的工作是在 `authenticateUser()` 方法中添加代码，以创建并配置 `BiometricPrompt`\
  \ 实例并启动身份验证。如下所示添加 `authenticateUser()` 方法：\n\n```java\nimport android.view.View;\n\
  \npublic void authenticateUser(View view) {\n    BiometricPrompt biometricPrompt\
  \ = new BiometricPrompt.Builder(this)\n            .setTitle(\"Biometric Demo\"\
  )\n            .setSubtitle(\"Authentication is required to continue\")\n      \
  \      .setDescription(\n                \"This app uses biometric authentication\
  \ to protect your data.\")\n            .setNegativeButton(\"Cancel\", this.getMainExecutor(),\n\
  \                (dialogInterface, i) ->\n                    notifyUser(\"Authentication\
  \ cancelled\"))\n            .build();\n    biometricPrompt.authenticate(getCancellationSignal(),\
  \ getMainExecutor(),\n            getAuthenticationCallback());\n}\n```\n\n`BiometricPrompt.Builder`\
  \ 类创建一个新的 `BiometricPrompt` 实例，并配置标题、副标题和描述文本，以显示在提示对话框中。负按钮被配置为显示文本“Cancel”（取消），并配置了一个监听器，在点击此按钮时显示消息。最后，调用\
  \ `BiometricPrompt` 实例的 `authenticate()` 方法，并传递 `AuthenticationCallback` 和 `CancellationSignal`\
  \ 实例。生物识别提示还需要知道在哪个线程上执行身份验证。这是通过传递一个配置了所需线程的 `Executor` 对象来定义的。在这种情况下，使用 `getMainExecutor()`\
  \ 方法传递一个主 `Executor` 对象。\n\n### 80.11 测试项目\n\n项目现在已完成，在物理 Android 设备或模拟器会话上运行应用，并点击\
  \ Authenticate 按钮显示如图 80-3](#Biometric_Auth.xhtml__idAnchor1560）所示的 `BiometricPrompt`\
  \ 对话框。\n\n运行后，触碰指纹传感器或使用模拟器中的扩展控制面板来如“使用和配置 Android Studio AVD 模拟器”](#AVD_Configuration.xhtml__idAnchor115）章节所述的方法模拟指纹触摸。假设检测到已注册的指纹，提示对话框将返回主活动，此时将出现来自成功身份验证方法的\
  \ toast 消息。\n\n再次点击 Authenticate 按钮，使用未注册的指纹尝试身份验证。此时，生物识别提示对话框将指示指纹未被识别。\n\n通过点击生物识别提示对话框之外的区域来验证错误处理回调是否有效。提示对话框将消失，并出现带有以下信息的\
  \ toast：\n\nAuthentication error: Fingerprint operation cancelled by user.\n\n检查使用\
  \ Cancel 按钮取消提示对话框是否会触发“Authentication Canceled” toast 消息。最后，使用未注册的指纹多次尝试身份验证，并注意在尝试多次后，提示对话框会指示失败次数过多，并且在此之前无法进行后续尝试。\n\
  \n### 80.12 总结\n\n\n\n\n\n本章概述了如何将生物识别身份验证集成到 Android 应用项目中的。这涉及到使用 `BiometricPrompt`\
  \ 类，一旦配置了适当的提示文本和回调函数，它会自动处理身份验证的大部分过程。\n\n# 81. 创建、测试和上传 Android App Bundle\n\n\
  一旦完成 Android 应用程序的开发并在广泛的 Android 设备上通过了测试，下一步就是准备将应用程序提交到 Google Play。然而，在提交之前，必须对应用程序进行发布包打包，并使用私密钥对其进行签名。本章将介绍获取私密钥、为项目准备\
  \ Android App Bundle 以及将其上传到 Google Play 的整个流程。\n\n## 81.1 发布准备流程\n\n到本书目前为止，我们一直在以适用于测试和调试的模式构建应用程序项目。另一方面，构建一个通过\
  \ Google Play 向客户发布的应用程序包则需要额外的步骤。首要要求是以发布模式（release mode）而不是调试模式（debug mode）编译应用程序。其次，应用程序必须使用私密钥签名，该密钥能够唯一标识你作为应用程序的开发者。最后，应用程序必须打包成\
  \ Android App Bundle。\n\n虽然这些任务可以在 Android Studio 环境之外执行，但正如本章后续部分所述，使用 Android\
  \ Studio 的构建机制执行这些程序会更加方便。不过，首先重要的是进一步了解 Android App Bundle。\n\n## 81.2 Android\
  \ App Bundles\n\n当用户从 Google Play 安装应用时，应用是以 `APK` 文件的形式下载的。该文件包含了在用户设备上安装和运行应用所需的所有内容。在\
  \ Android Studio 3.2 之前，开发者会使用 Android Studio 生成一个或多个 `APK` 文件并将其上传到 Google Play。支持多种设备类型、屏幕尺寸和语言需要为每个目标设备和语言创建并上传多个自定义的\
  \ `APK` 文件，或者生成一个包含所有不同配置资源和平台二进制文件的大型通用 `APK`。\n\n创建多个 `APK` 文件涉及大量工作，且每次更新应用时都必须重复，这为应用发布过程带来了巨大的时间开销。\n\
  \n通用 `APK` 选项虽然减轻了开发者的负担，但导致了一个完全意之外的问题。通过分析应用安装指标，Google 发现安装 `APK` 文件越大（导致下载时间变长和存储占用增加），应用获得的转化率就越低。转化率的计算方式为：在\
  \ Google Play 上查看应用后完成安装的用户占百分比。Google 估计，`APK` 文件的大小每增加 6MB，应用的转化率就会下降 1%。\n\n\
  Android App Bundles 解决了这些问题，它允许开发者在 Android Studio 内部创建一个包，并让 Google Play 为每个单独支持的配置自动生成自定义的\
  \ `APK` 文件（这一概念称为动态交付 Dynamic Delivery）。\n\nAndroid App Bundle 是一个 `ZIP` 文件，包含了为应用项目内支持的所有设备和语言构建\
  \ `APK` 文件所需的所有文件。例如，项目可能包含针对不同屏幕尺寸的资源和图像。当用户安装应用时，Google Play 会接收有关设备的信息，包括显示器、处理器架构和语言。利用这些信息，相应的预生成\
  \ `APK` 文件将传输到用户的设备上。\n\n动态交付的另一个优势是可以将应用拆分为多个模块（称为动态功能模块），每个模块包含应用内特定功能区域的代码和资源。每个动态功能模块包含在一个与基础模块独立的\
  \ `APK` 文件中，并且仅在用户需要该功能时才会下载到设备。动态交付和应用包还允许创建即时动态功能模块，这些可以在无需安装整个应用的情况下在设备上立即运行。\n\
  \n尽管仍然可以从 Android Studio 生成 `APK` 文件，但应用包现在是上传应用到 Google Play 的推荐方式。\n\n## 81.3\
  \ 注册 Google Play 开发者控制帐户\n\n应用提交过程的第一步是创建 Google Play 开发者控制帐户。为此，请访问 `https://play.google.com/apps/publish/signup/`\
  \ 并按照说明完成注册过程。注意，注册需要支付一次性 25 美元的费用。一旦应用程序上市，Google 将保留与应用相关的所有收入的 30%。创建账户后，可以通过\
  \ `https://play.google.com/console` 访问开发者控制台。\n\n下一步是收集应用信息。为了将您的应用程序推向市场，需要以下信息：\n\
  \n- **标题 (Title)** – 应用程序的标题。\n- **短描述 (Short Description)** - 最多 80 个字的应用描述。\n\
  - **完整描述 (Full Description)** – 最多 4000 个字的应用描述。\n- **截图 (Screenshots)** – 最多 8\
  \ 张应用运行的截图（至少需要两张）。Google 建议提交在 7 英寸或 10 英寸平板电脑上运行的应用截图。\n- **语言 (Language)** –\
  \ 应用的语言（默认为美式英语）。\n- **推广文本 (Promotional Text)** – 当您的应用出现在 Google Play 环境内的特殊推广功能时将使用的文本。\n\
  - **应用类型 (Application Type)** – 您的应用被视为游戏还是应用程序。\n- **类别 (Category)** – 最能描述您的应用程序的类别（例如：金融、健康健身、教育、运动等）。\n\
  - **地区 (Locations)** – 您希望您的应用程序可以购买的地理位置。\n- **联系详情 (Contact Details)** – 用户可以通过哪些方式与您联系以获取应用支持。选项包括网页、电子邮件和电话。\n\
  - **定价与发布 (Pricing & Distribution)** – 关于应用程序价格以及营销和销售地理位置的信息。\n\n收集上述信息后，点击 Google\
  \ Play Console 中的“创建应用”按钮开始创建过程。\n\n## 81.4 在控制台中配置应用\n\n当首次点击“创建应用”按钮时，将出现应用详情和声明屏幕，如下图\
  \ 81-1 所示：\n\n```\n![](img/as_4.1_play_create_app.jpg)\n```\n图 81-1\n\n一旦配置了应用条，点击“创建应用”按钮（在上方图中高亮显示）以添加应用并显示仪表板屏幕。在仪表板中，找到“初始设置”（Initial\
  \ setup）部分并展开配置应用商店列表的步骤列表：\n\n```\n![](img/as_4.1_play_app_initial_steps.jpg)\n\
  ```\n图 81-2\n\n逐一处理列表链接并为应用提供所需的信息，确保每一步都保存更改。\n\n## 81.5 启用 Google Play 应用签名\n\n\
  \n\n\n直到最近，Google Play 的上传是通过 Android Studio 内部的发布应用签名密钥进行签名的，然后上传到 Google Play\
  \ 控制台。虽然这种选项仍然，但推荐的上传文件方式是使用名为“Google Play 应用签名”（Google Play App Signing）的过程。对于新创建的应用，这涉及加入\
  \ Google Play 应用签名并生成一个上传密钥以在 Android Studio 中对应用包文件（app bundle）进行签名。当上传由 Android\
  \ Studio 生成的应用包文件时，Google Play 控制台会移除上传密钥，并使用安全存储在 Google Play 服务器中的应用签名密钥对文件进行签名。对于现有应用，需要一些额外的步骤来启用\
  \ Google Play 签名，这将在本章末尾介绍。\n\n在 Google Play 控制台中，从“所有应用”（All Apps）屏幕（通过左侧导航面板顶部的选项访问）选择新添加的应用项，展开“设置”（Setup）部分（在图\
  \ 81-3 中标记为 A），并选择“应用签名”（App Signing）选项（B）。\n\n![](img/as_4.1_play_enable_app_signing.jpg)\n\
  \n图 81-3\n\n点击“创建发布”（Create release）按钮（C）加入 Google Play 应用签名。控制台现在已准备好为您的应用创建第一个测试发布。然而，在在此之前，下一步是在\
  \ Android Studio 内部生成上传密钥。这是生成签名应用包过程的一部分执行的。请保持当前 Google Play 控制台页面在浏览器中加载，因为我们将在本章稍后回到这里。\n\
  \n## 81.6 创建密钥库文件\n\n要创建密钥库文件，选择 Android Studio 的 `Build`（构建）-> `Generate Signed\
  \ Bundle / APK…`（生成签名应用包/ APK…）菜单选项，显示“生成签名应用包或 APK 向导”对话框，如图 81-4 所示：\n\n![](img/as_generate_app_bundle.jpg)\n\
  \n图 81-4\n\n在点击“下一步”（Next）按钮之前，确认已选择“Android App Bundle”（Android 应用包）选项。\n\n如果您有现有的发布密钥库文件，点击下一屏幕上的`Choose\
  \ existing…`（选择现有…）按钮，并导航到选择该文件。如果您尚未创建密钥库文件，点击`Create new…`（创建新…）按钮显示“新密钥库”（New\
  \ Key Store）对话框（图 81-5）。点击`Key store path`（密钥库路径）字段右侧的按钮，导航到文件系统中合适的位置，为密钥库文件输入名称（例如\
  \ `release.keystore.jks`）并点击`OK`按钮。\n\n`New Key Store`对话框分为两个部分。顶部部分与密钥库文件有关。在此部分，在`Password`（密码）和`Confirm`（确认）字段中输入一个强密码来保护密钥库文件。对话框的下部分与将存储在密钥库文件中的上传密钥有关。\n\
  \n![](img/as_generate_new_key_store.jpg)\n\n图 81-5\n\n在`New Key Store`对话框的`Key`（密钥）部分中，输入以下详细信息：\n\
  \n- 引用密钥的别名（alias）。可以是任何字符序列，但系统仅使用前八个。\n- 用于保护密钥的足够强度的密码。\n- 密钥有效的年数（Google 建议时长超过\
  \ 25 年）。\n- 此外，必须为剩余字段中的至少一个提供信息（例如，您的姓和名或组织名称）。\n\n输入信息后，点击`OK`按钮创建程序包。\n\n## 81.7\
  \ 创建 Android 应用包\n\n下一步是指示 Android Studio 在发布模式下构建应用包文件，并使用新创建的私钥对其进行签名。此时，`Generate\
  \ Signed Bundle or APK`对话框应仍显示，且`keystore path`、密码和`key alias`字段已填充了信息：\n\n![](img/as_generate_app_bundle_keystore_ready.jpg)\n\
  \n图 81-6\n\n确保启用`Export Encrypted Key`（导出加密密钥）选项，并在假设其他设置正确的情况下，点击`Next`（下一步）按钮进入应用包生成屏幕（图\
  \ 81-7）。在此屏幕中，检查`Destination Folder:`（目标文件夹:）设置，以验证生成应用包文件的位置是可以接受的。如果偏好其他位置，点击文本字段右侧的按钮并导航到所需的文件系统位置。\n\
  \n![](img/as_generate_app_bundle_generate.jpg)\n\n图 81-7\n\n点击`Finish`（完成）按钮并等待`Gradle`系统构建应用包。构建完成后，将出现一个对话框，提供在资源管理器窗口中打开包含应用包文件的文件夹或将文件加载到`APK\
  \ Analyzer`中进行选项：\n\n![](img/as_generate_app_bundle_ready.jpg)\n\n图 81-8\n\n此时，应用已准备好提交到\
  \ Google Play。点击`locate`（定位）链接打开文件系统浏览器窗口。该文件应命名为`bundle.aab`并位于项目文件夹的`app/release`子目录中，除非指定了其他位置。\n\
  \n作为此过程的一部分生成的私钥应在以后签名和发布未来应用时使用，因此，它应该被保存在安全的地方，并进行安全的安全的备份。\n\n## 81.8 生成测试 APK\
  \ 文件\n\n此阶段的一个可选步骤是从应用包生成 APK 文件，并在设备或模拟器上安装并运行。Google 提供了一个名为 `bundletool`的命令行工具，专门为此目的设计，可以从以下\
  \ URL 下载：\n\n[`github.com/google/bundletool/releases`](https://github.com/google/bundletool/releases)\n\
  \n在编写时，`bundletool` 以 `.jar` 文件形式提供，可以如下执行（注意版本号可能已更改）：\n\n```\njava -jar bundletool-all.0.jar\n\
  ```\n\n运行上述命令将列出所有可用选项。从应用包生成 APK，可以使用`build-apks`选项。文件还需要签名以生成可以安装到设备上的 APK。为了实现这一点，包含`--ks`选项指定在本章之前创建的密钥库路径，以及指定生成密钥时别名的--ks-key-alias。最后，必须使用`--output`标志指定生成\
  \ APK 文件的路径（称为 APK Set）。该文件不能已存在，并且需要`.apks`扩展名。将这些要求汇合在一起得到命令：\n\n```\njava -jar\
  \ bundletool-all.0.jar build-apks --bundle=/tmp/MyApps/app/release/bundle.aab --output=/tmp/MyApks.apks\
  \ --ks=/MyKeys/release.keystore.jks --ks-key-alias=MyReleaseKey\n```\n\n执行此命令时，将弹出提示请求密钥库密码，然后生成\
  \ APK 文件到指定的 APK Set 中。APK Set 是一个包含从应用包生成的所有 APK 文件的 ZIP 文件。\n\n要在连接的设备或模拟器上安装相应的\
  \ APK 文件，使用类似下面的命令：\n\n```\njava -jar bundletool-all.0.jar install-apks --apks=/tmp/MyApks.apks\n\
  ```\n\n此命令将指示工具识别适用于连接设备的合适 APK 文件并安装它们，以便启动和测试应用。\n\n\n\n\n接下来，此规格文件用于从 APK Set\
  \ 中提取匹配的 APK 文件：\n\n```bash\njava -jar bundletool-all-0.9.0.jar extract-apks --apks=/tmp/MyApks.apks\
  \ --output-dir=/tmp/nexus5_apks --device-spec=/tmp/device.json\n```\n\n执行时，通过 `--output-dir`\
  \ 标志指定的目录将包含适用于指定设备配置的 APK 文件。\n\n将 Android 应用推向市场的下一步是将其提交到 Google Play 开发者控制台，以便进行测试。\n\
  \n## 81.9 将 App Bundle 上传到 Google Play 开发者控制台\n\n返回 Google Play 控制台，在点击“创建新版本”按钮（B）之前，在导航面板的“测试”部分选择“内部测试”选项（在图\
  \ 81-9 中标记为 A）：\n\n![](img/as_4.1_play_create_new_release.jpg)\n\n图 81-9\n\n在随之显示的屏幕上，点击“继续”按钮（下方标记为\
  \ A）以确认使用 Google Play 应用签名，然后将 Android Studio 生成的 bundle 文件拖放到上传投放点（B）：\n\n\n\n\
  ![](img/as_4.1_play_upload_bundle.jpg)\n\n图 81-10\n\n上传完成后，向下滚动屏幕并输入发布名称和可选的发布说明。发布名称可以是任何帮助你识别该版本的信息，且它对用户不可见。\n\
  \n应用 bundle 文件上传后，Google Play 将生成所有必要的 APK 文件以准备测试。一旦生成了 APK 文件，滚动到屏幕底部并点击“保存”按钮。保存设置后，点击“审核发布”按钮。\n\
  \n## 81.10 探索 App Bundle\n\n在审核屏幕上，点击已上传 bundle 右侧的箭头，如图 81-11 所示：\n\n![](img/as_4.1_play_app_bundle_review.jpg)\n\
  \n图 81-11\n\n在随之显示的面板中，点击“探索 bundle”链接以加载应用 bundle 资源生成器。这提供了与应用 bundle 支持的 API\
  \ 级别、屏幕布局和平台相关的摘要信息：\n\n![](img/as_4.1_play_app_bundle_explorer.jpg)\n\n图 81-12\n\
  \n点击“转到设备目录”链接将显示 APK 文件支持的设备：\n\n![](img/as_4.1_play_device_catalog.jpg)\n\n图 81-13\n\
  \n目前，应用已准备好进行测试，但只有在控制台中设置了某些测试人员后才能进行发布。\n\n## 81.11 管理测试人员\n\n如果应用仍处于内部、Alpha\
  \ 或 Beta 测试阶段，可以通过在 Google Play 控制台中选择该应用、点击导航面板中的“内部测试”并选择“测试人员”选项卡来指定授权的测试人员列表，如图\
  \ 81-14 所示：\n\n![](img/as_4.1_play_testers.jpg)\n\n图 81-14\n\n要添加测试人员，点击“创建电子邮件列表”按钮，为列表命名，并手动指定或通过上传\
  \ CSV 文件指定测试用户的电子邮件地址。\n\n现在可以从屏幕上复制“在网页加入” URL 并提供给测试用户，以便他们接受测试邀请并下载应用。\n\n##\
  \ 81.12 发布应用进行测试\n\n现在已经创建了内部版本并添加了测试人员列表，应用已准备好发布进行测试。留在“内部测试”屏幕中，在点击最近创建的版本的“编辑”按钮之前，选择“发布”选项卡：\n\
  \n![](img/as_4.1_play_ready_for_rollout.jpg)\n\n图 81-15\n\n在审核屏幕上，滚动到底部并点击“开始内部测试发布”按钮。在发布处理期间简短延迟后，应用将可以供指定用户下载和测试。\n\
  \n## 81.13 上传新的 App Bundle 版本\n\n为你的应用程序上传的应用 bundle 文件版本号始终为 1。如果尝试上传另一个具有相同版本号的\
  \ bundle 文件，控制台将带有以下错误拒绝该文件：\n\n您需要为 APK 使用不同的版本号，因为您已经有一个版本号为 1 的版本了。\n\n要解决这个问题，需要增加嵌入\
  \ bundle 文件中的版本号。这在项目的模块级 `build.gradle.kts` 文件中进行，如图 81-16 高亮所示：\n\n![](img/as_generate_module_gradle_file.jpg)\n\
  \n图 81-16\n\n该文件通常如下：\n\n```kotlin\nplugins {\n    id(\"com.android.application\"\
  )\n}\nandroid {\n    namespace = \"com.ebookfrenzy.biometricdemo\"\n    compileSdk\
  \ = 33\n    defaultConfig {\n        applicationId = \"com.ebookfrenzy.biometricdemo\"\
  \n        minSdk = 29\n        targetSdk = 33\n        versionCode = 1\n       \
  \ versionName = \"1.0\"\n    }\n}\n```\n\n要更改版本号，更改 `versionCode` 边的数字。要更改显示给用户的版本号，更改\
  \ `versionName` 字符串。例如：\n\n```kotlin\nversionCode = 2\nversionName = \"2.0\"\n```\n\
  \n更改更改后，重新构建并再次上传。\n\n## 81.14 分析 App Bundle\n\nAndroid Studio 提供了分析应用 bundle 内容的能力。要分析\
  \ bundle 文件，选择 `Build -> Analyze APK…` 菜单选项并导航到选择要分析的文件。加载后，将显示有关包的原始大小和下载大小的信息，以及文件结构列表，如图\
  \ 81-17 所示：\n\n![](img/as_analyze_apk.jpg)\n\n图 81-17\n\n选择 `classes.dex` 文件将在面板中显示文件的类结构。在此面板中，可以探索到每个类的方法级细节：\n\
  \n![](img/as_analyze_apk_dex.jpg)\n\n图 81-18\n\n同样，选择文件列表中的资源或图像文件将在面板中显示文件内容。通过点击“与之前的\
  \ APK 比较”并选择第二个 bundle 文件，可以查看两个文件之间的大小差异。\n\n### 81.15 总结\n\n当应用项目完成或准备好测试后，可以将其提交到\
  \ Google Play 控制台并在生产、内部、Alpha 或 Beta 测试。在发布应用之前，需要在控制台中创建应用条目，包括应用信息和用于商店的屏幕截图。Android\
  \ App Bundle 文件在 Android Studio 中生成并使用上传密钥签名。在上传文件后，Google Play 将移除上传密钥并替换为安全存储的应用签名密钥，应用已准备好发布。\n\
  \n可以随时将 bundle 文件加载到 Android Studio APK 分析工具中查看内容。\n\n## 82 Android 内购付费概述\n\n在\
  \ Android 和 iOS 移动应用的早期，最常见的盈利方法是收取下载和安装应用时的预付费。很快介绍了另一种收入机会：在应用中嵌入广告。最常见且利润丰厚的选项是让用户在安装应用后为应用内购买的项目付费。</\n\
  \n\n\nGoogle 支持通过 Google Play 内结算 API 和 Play Console 集成应用内购买。本章将概述应用内结算，并列出如何将应用内结算集成到你的\
  \ Android 项目中。在探索这些主题后，下一章将引导你创建一个包含应用内购买功能的示例应用。\n\n---\n\n## 82.1 为应用内购买准备项目\n\
  \n在应用中构建应用内购买需要 Google Play 开发者控制台账号，其细节在之前的“创建、测试和上传 Android App Bundle”章节中介绍过。你还必须注册一个\
  \ Google 商家账户。可以通过在 Play Console 中导航到 `Setup`（设置） -> `Payments profile`（付款资料）来找到这些设置。请注意，商家注册并非所有国家都可用。有关详情，请参考以下页面：\n\
  \n[`support.google.com/googleplay/android-developer/answer/9306917`](https://support.google.com/googleplay/android-developer/answer/9306917)\n\
  \n随后，必须将应用上传到控制台并启用应用内购买。然而，除非已将 Google Play 结算库添加到模块级 `build.gradle.kts` 文件，否则控制台将不会为应用激活内结算支持：\n\
  \n```kotlin\ndependencies {\n    implementation (\"com.android.billingclient:billing:<latest\
  \ version>\")\n}\n```\n\n一旦修改了构建文件并将应用 bundle 上传到控制台，下一步是为用户购买添加应用内产品或订阅。\n\n##\
  \ 82.2 创建应用内产品和订阅\n\n产品和订阅是使用 Play Console 导航面板中 `Monetize`（变现）部分列出的选项进行创建和管理的，如下方的图\
  \ 82-1](#In-App_Overview.xhtml__idTextAnchor1598）所示：\n\n![](img/play_console_monetization.jpg)\n\
  \n图 82-1\n\n每个产品或订阅都需要一个 ID、标题、描述和价格信息。购买分为消耗性（用户每次需要时都必须购买，例如游戏中的虚拟货币）、非消耗性（用户只需购买一次，例如内容访问）和订阅制。消耗性和非消耗性产品统称为受管理产品。\n\
  \n订阅适用于销售需要定期续订的项目，例如新闻内容的访问或应用的高级功能。在创建订阅时，基础计划指定了价格、续订周期（每月、每年等）以及订阅是否自动续订。用户还可以获得折扣优惠和预购订阅的选项。\n\
  \n## 82.3 结算客户端初始化\n\n你的应用与 Google Play 结算库之间的通信由 `BillingClient` 实例处理。此外，`BillingClient`\
  \ 包含一组可以调用的方法，用于执行同步和异步结算相关的活动。当结算客户端初始化时，需要为它提供一个 `PurchasesUpdatedListener` 回调处理器的引用。客户端将调用此处理器来通知你的应用任何购买活动的结果。为了避免重复通知，建议每个应用只保留\
  \ `BillingClient` 实例。\n\n可以使用 `newBuilder()` 方法创建 `BillingClient` 实例，传入当前的 activity\
  \ 或 fragment 上。然后通过 `setListener()` 方法将购买更新处理器分配给客户端：\n\n```java\nprivate final\
  \ PurchasesUpdatedListener purchasesUpdatedListener =\n    new PurchasesUpdatedListener()\
  \ {\n        @Override\n        public void onPurchasesUpdated(BillingResult billingResult,\n\
  \                List<Purchase> purchases) {\n            if (billingResult.getResponseCode()\
  \ ==\n                    BillingClient.BillingResponseCode.OK\n               \
  \     && purchases != null) {\n                // 购买成功\n                for (Purchase\
  \ purchase : purchases) {\n                    // 处理购买条目\n                }\n  \
  \          } else if (billingResult.getResponseCode() ==\n                    BillingClient.BillingResponseCode.USER_CANCELED)\
  \ {\n                // 用户取消\n            } else {\n                // 处理错误\n  \
  \          }\n        }\n    };\nBillingClient billingClient = BillingClient.newBuilder(context)\n\
  \    .setListener(purchasesUpdatedListener)\n    .enablePurchases()\n    .build();\n\
  ```\n\n## 82.4 连接到 Google Play 结算库\n\n在成功创建结算客户端后，下一步是初始化与 Google Play 结算库的连接。必须调用结算客户端的\
  \ `startConnection()` 方法来建立此连接。由于连接是异步执行的，必须实现 `BillingStateListener` 以接收指示连接是否成功的回调。还应该添加代码来重写\
  \ `onServiceDisconnected()` 方法。当与结算库的连接丢失时会调用此方法，用于报告问题并重试连接。\n\n一旦设置和连接完成，`BillingClient`\
  \ 实例将调用 `onBillingFinished()` 方法，该方法可以检查客户端是否就绪：\n\n```java\nbillingClient.startConnection(new\
  \ BillingStateListener() {\n    @Override\n    public void onBillingFinished(@NonNull\
  \ BillingResult billingResult) {\n        if (billingResult.getResponseCode() ==\n\
  \                BillingClient.BillingResponseCode.OK) {\n            // 连接成功\n\
  \        } else {\n            // 连接失败\n        }\n    }\n    @Override\n    public\
  \ void onServiceDisconnected() {\n        // 连接丢失\n    }\n});\n```\n\n## 82.5 查询可用产品\n\
  \n一旦结算环境初始化并准备就绪，下一步是请求可购买的产品或订阅的详情。这通过调用 `BillingClient` 的 `queryProductDetailsAsync()`\
  \ 方法并传入配置适当的 `ProductDetailsParams` 实例来实现，该实例包含产品 ID 和类型（订阅使用 `SUBS`，受管理产品使用 `INAPP`）：\n\
  \n```java\nQueryProductDetailsParams queryProductDetailsParams =\n    QueryProductDetailsParams.newBuilder()\n\
  \        .setProductList(\n            ImmutableList.of(\n                QueryProductDetailsParams.Product.newBuilder()\n\
  \                    .setProductId(\"one_button_click\")\n                    .setProductType(BillingClient.ProductType.INAPP)\n\
  \                    .build()))\n        .build();\nbillingClient.queryProductDetailsAsync(queryProductDetailsParams,\n\
  \    new ProductDetailsResponseListener() {\n        public void onProductDetailsResponse(\n\
  \                @NonNull BillingResult billingResult,\n                @NonNull\
  \ List<ProductDetails> productDetailsList) {\n            if (!productDetailsList.isEmpty())\
  \ {\n                // 处理匹配的产品列表\n            } else {\n                // 未找到匹配的产品\n\
  \            }\n        }\n    }\n);\n```\n\n`queryProductDetailsAsync()` 方法传递一个\
  \ `ProductDetailsResponseListener` 处理器，该处理器反会被调用并传入一个包含匹配产品信息的 `ProductDetails`\
  \ 对象列表。例如，我们可以调用这些对象的方法来获取产品名称、标题、描述、价格和优惠详情。\n\n## 82.6 开始购买流程\n\n\n\n\n一旦用户查询了某个产品或订阅并选择购买，购买流程就可以启动。我们通过调用\
  \ `BillingClient` 的 `launchBillingFlow()` 方法来实现这一点，并将当前活动以及一个配置了已购项目 `ProductDetail`\
  \ 对象的 `BillingFlowParams` 作为参数传递。\n\n```java\nBillingFlowParams billingFlowParams\
  \ =\n    BillingFlowParams.newBuilder()\n        .setProductDetailsParamsList(\n\
  \            ImmutableList.of(\n                BillingFlowParams.ProductDetailsParams.newBuilder()\n\
  \                    .setProductDetails(productDetails)\n                    .build()\n\
  \            )\n        )\n        .build();\nbillingClient.launchBillingFlow(this,\
  \ billingFlowParams);\n```\n\n购买操作的成功与否将通过本节之前概述的 `PurchasesUpdatedListener` 回调处理程序进行报告。\n\
  \n### 82.7 完成购买\n\n当购买成功时，`PurchasesUpdatedListener` 处理器将接收一个包含每个项目 `Purchase` 对象的列表。你可以按照如下方式调用\
  \ `Purchase` 实例的 `getPurchaseState()` 方法来验证该项目是否已购买：\n\n```java\nif (purchase.getPurchaseState()\
  \ == Purchase.PurchaseState.PURCHASED) {\n    // 购买完成。\n} else if (purchase.getPurchaseState()\
  \ == Purchase.PurchaseState.PENDING) {\n    // 支付仍在处理中\n}\n```\n\n注意，只有在初始化期间调用了\
  \ `enablePendingPurchases()` 方法，你的应用才支持待付款购买。待付款购买将一直保持该状态，直到用户完成支付流程。\n\n非消耗购买完成后，必须对其进行确认（acknowledge），以防止向用户退款。这需要该项目的购买令牌，该令牌通过调用\
  \ `Purchase` 对象的 `getPurchaseToken()` 方法获取。此令牌用于创建 `AcknowledgePurchaseParams` 实例和\
  \ `AcknowledgePurchaseResponseListener` 处理程序。可以通过调用 `BillingClient` 的 `acknowledgePurchase()`\
  \ 方法来确认托管产品购买和订阅：\n\n```java\nAcknowledgePurchaseParams acknowledgePurchaseParams\
  \ =\n    AcknowledgePurchaseParams.newBuilder()\n        .setPurchaseToken(purchase.getPurchaseToken())\n\
  \        .build();\nAcknowledgePurchaseResponseListener acknowledgePurchaseResponseListener\
  \ =\n    new AcknowledgePurchaseResponseListener() {\n        @Override\n      \
  \  public void onAcknowledgePurchaseResponse(\n            @NonNull BillingResult\
  \ billingResult) {\n            billingClient.acknowledgePurchase(\n           \
  \     acknowledgePurchaseParams,\n                acknowledgePurchaseResponseListener);\n\
  \        }\n    };\n```\n\n对于消耗性购买，你需要在项目被消耗后通知 Google Play，以便用户可以再次购买。这需要一个包含购买令牌的配置\
  \ `ConsumeParams` 实例、一个 `ConsumeResponseListener` 以及对计费客户端 `consumeAsync()` 方法的调用：\n\
  \n```java\nConsumeParams consumeParams =\n    ConsumeParams.newBuilder()\n     \
  \   .setPurchaseToken(purchase.getPurchaseToken())\n        .build();\nConsumeResponseListener\
  \ listener = new ConsumeResponseListener() {\n    @Override\n    public void onConsumeResponse(BillingResult\
  \ billingResult,\n            @NonNull String purchaseToken) {\n        if (billingResult.getResponseCode()\
  \ == BillingClient.BillingResponseCode.OK) {\n            // 购买已消耗\n        }\n\
  \    }\n};\nbillingClient.consumeAsync(consumeParams, listener);\n```\n\n## 82.8\
  \ 查询之前的购买\n\n在处理内计费时，检查用户是否已购买某个产品或订阅是一项常见需求。通过调用 `BillingClient` 实例的 `queryPurchasesAsync()`\
  \ 方法并实现 `PurchasesListener`，可以生成用户之前购买的所有特定类型的购买列表。例如，以下代码获取了所有尚未被消耗的购买项目列表：\n\n\
  ```java\nQueryPurchasesParams queryPurchasesParams =\n    QueryPurchasesParams.newBuilder()\n\
  \        .setProductType(BillingClient.ProductType.INAPP)\n        .build();\nbillingClient.queryPurchasesAsync(queryPurchasesParams,\n\
  \    new PurchasesListener() {\n        @Override\n        public void onQueryPurchasesResponse(@NonNull\
  \ BillingResult billingResult,\n                @NonNull List<Purchase> list) {\n\
  \            // 处理购买列表\n        }\n    });\n```\n\n要获取活跃订阅列表，请将 `ProductType` 值从\
  \ `INAPP` 更改为 `SUBS`。或者，要获取每个产品最近的购买列表，请调用 `BillingClient` 的 `queryPurchaseHistoryAsync()`\
  \ 方法：\n\n```java\nQueryPurchaseHistoryParams queryPurchaseHistoryParams =\n    QueryPurchaseHistoryParams.newBuilder()\n\
  \        .setProductType(BillingClient.ProductType.INAPP)\n        .build();\nbillingClient.queryPurchaseHistoryAsync(queryPurchaseHistoryParams,\n\
  \    new PurchaseHistoryResponseListener() {\n        @Override\n        public\
  \ void onPurchaseHistoryResponse(@NonNull BillingResult billingResult,\n       \
  \         @NonNull List<PurchaseHistoryRecord> list) {\n            // 处理购买历史\n\
  \        }\n    });\n```\n\n### 82.9 总结\n\n内应用购买通过向用户出售虚拟产品和订阅，提供了从 Android 应用内部产生收入的方式。本章探讨了托管产品和订阅，并解释了消耗性产品和非消耗性产品之间的区别。使用\
  \ Google Play 内应用购买库可以为应用添加内应用购买支持。这涉及创建并初始化计费客户端，并在其上调用方法来执行诸如购买、列出可用产品和消耗现有购买等任务。下一章将包含一个演示如何在\
  \ Android Studio 项目中添加内应用购买的教程。\n\n## 83. Android 内应用购买教程\n\n\n\n\n\n在 `Name` 字段中输入\
  \ `InAppPurchase`，并指定一个在 Google Play 生态系统中唯一标识您的应用的包名（例如 `com.<your company>.InAppPurchase`）。在点击\
  \ `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26`：Android 8.0 (Oreo)，并将 `Language`\
  \ 菜单更改为 `Java`。项目创建完成后，使用 11.8 将项目迁移到 View Binding 节中概述的步骤将项目转换为使用 view binding。\n\
  \n## 83.3 向项目添加库\n\n在编写代码之前，必须向项目构建配置添加某些库，包括标准的 Android 计费客户端库。在项目的稍后阶段，我们还需使用\
  \ `ImmutableList` 类，它是 Google Guava Core Java 库的一部分。现在通过修改 `Gradle Scripts -> build.gradle.kts\
  \ (Module: app)` 文件进行以下更改来添加这些库：\n\n```kotlin\ndependencies {\n    implementation\
  \ (\"com.android.billingclient:billing:6.0.1\")\n    implementation (\"com.google.guava:guava:24.1-jre\"\
  )\n    implementation (\"com.google.guava:guava:27.0.1-android\")\n}\n```\n\n点击编辑器面板顶部的\
  \ `Sync Now` 链接以提交这些更改。\n\n### 83.4 设计用户界面\n\n用户界面将由现有的 `TextView` 和两个 `Buttons`\
  \ 组成。在编辑器中加载 `activity_main.xml` 文件后，将两个 `Button` 视图拖放到布局中，使其中一个在 `TextView` 上方，另一个在下方。选择\
  \ `TextView` 并将 `id` 属性更改为 `statusText`。\n\n点击工具栏上的 `Clear all Constraints` 按钮，并按住\
  \ Shift 键选择三个视图。右键点击最顶部的 `Button` 视图，选择 `Center -> Horizontally in Parent` 菜单选项。再次重复此步骤，选择\
  \ `Chains -> Create Vertical Chain`。更改顶部按钮的 `text` 属性使其显示为“Consume Purchase”，并将\
  \ `id` 更改为 `consumeButton`。同时，配置 `onClick` 属性以调用名为 `consumePurchase` 的方法。\n\n选择最底部的按钮并重复上述步骤，将\
  \ `text` 设置为“Buy Product”，将 `id` 设置为 `buyButton`，并将 `onClick` 回调设置为 `makePurchase`。完成后，布局应与图\
  \ 83-1 所示所示：\n\n![](img/as_inapppurchase_ui.jpg)\n\n图 83-1\n\n## 83.5 将应用添加到 Google\
  \ Play 商店\n\n使用标题为创建、测试和上传 Android App Bundle 的章节中概述的步骤，登录 `Play Console`，创建一个新应用，并设置一个新的内部测试轨道，包括指定测试人员的电子邮件地址。返回\
  \ Android Studio 并为项目生成签名的发布 app bundle。一旦生成了 bundle 文件，将其上传到内部测试轨道并发布进行测试。\n\n\
  现在应用已进入 Google Play 商店，我们准备好为项目创建一个应用内产品了。\n\n## 83.6 创建应用内产品\n\n在 `Play Console`\
  \ 中选中应用，向下滚动左侧面板中的选项列表，直到出现 `Monetize` 部分。在该部分中，选择 `Products` 下的 `In-app products`\
  \ ，如图 83-2 所示：\n\n![](img/play_console_monetization1.jpg)\n\n图 83-2\n\n在 `In-app\
  \ products` 页面上，点击 `Create product` 按钮：\n\n![](img/play_console_create_product.jpg)\n\
  \n图 83-3\n\n在新产品屏幕上，保存新产品之前输入以下信息：\n\n* **Product ID**: `one_button_click`\n* **Name**:\
  \ A Button Click\n* **Description**: 这是一个测试应用内产品，允许按钮被点击一次。\n* **Default price**:\
  \ 设置为您偏好货币的最低可用价格。\n\n## 83.7 启用许可测试人员\n\n在测试应用内计费时，在不花费任何资金的情况下进行测试购买是非常有用的。这可以通过为内部轨道的测试人员启用许可测试来实现。许可测试人员在购买时可以使用测试付款卡，这样他们就不会被收费。\n\
  \n在 `Play Console` 中，返回主屏幕并选择 `Setup -> License testing` 选项：\n\n![](img/play_console_license_testing.jpg)\n\
  \n图 83-4\n\n在许可测试屏幕内，添加为内部测试轨道添加的测试人员，将 `License response` 设置更改为 `RESPOND_NORMALLY`\
  \ 并保存更改：\n\n![](img/play_console_license_testing_screen.jpg)\n\n图 83-5\n\n现在应用和应用内产品已在\
  \ `Play Console` 中设置，我们可以向项目添加代码了。\n\n## 83.8 初始化计费客户端\n\n编辑 `MainActivity.java`\
  \ 文件并进行以下更改以开始实现应用内购买功能：\n\n```java\nimport androidx.annotation.NonNull;\nimport\
  \ android.util.Log;\nimport com.android.billingclient.api.*;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n    private\
  \ BillingClient billingClient;\n    private ProductDetails productDetails;\n   \
  \ private Purchase purchase;\n    static final String TAG = \"InAppPurchase\";\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ billingSetup();\n    }\n\n    private void billingSetup() {\n        billingClient\
  \ = BillingClient.newBuilder(this)\n            .setListener(purchasesUpdated)\n\
  \            .enablePendingPurchases()\n            .build();\n        billingClient.startConnection(new\
  \ BillingClientStateListener() {\n            @Override\n            public void\
  \ onSetupFinished(@NonNull BillingResult billingResult) {\n                if (billingResult.getResponseCode()\
  \ == BillingClient.BillingResponseCode.OK) {\n                    Log.i(TAG, \"\
  OnBillingSetup connected\");\n                    queryProduct();\n            \
  \    } else {\n                    Log.i(TAG, \"OnBillingSetup failed\");\n    \
  \            }\n            }\n            @Override\n            public void onBillingServiceDisconnected()\
  \ {\n                Log.i(TAG, \"OnBillingSetup connection lost\");\n         \
  \   }\n        });\n    }\n}\n```\n\n应用启动时，`onCreate()` 方法将调用 `billingSetup()`，这将创建一个计费客户端实例并尝试连接到\
  \ Google Play 计费库。`onSetupFinished()` 监听器将在连接尝试完成时被调用，并输出连接成功失败的消息。最后，我们还实现了 `onBillingServiceDisconnected()`\
  \ 回调。如果连接成功，将调用 `queryProduct()`。必须添加此方法以及分配给计费客户端的 `purchasesUpdatedListener`。\n\
  \n### 83.9 查询产品\n\n为了确保产品可以购买，我们需要创建一个 `QueryProductDetailsParams` 实例，配置为在 `Play\
  \ Console` 中指定的 `product ID`，并传递给计费客户端的 `queryProductDetailsAsync()` 方法。这将要求我们也添加\
  \ `onProductDetailsResponse()` 回调方法，其中我们将检查产品是否存在、提取产品名称并显示在状态 `TextView` 上。现在我们已经获取了产品详情，也可以安全地启用购买按钮。在\
  \ `MainActivity.` 文件中，添加 `queryProduct()` 方法，内容如下：\n\n```java\nimport com.google.common.collect.ImmutableList;\n\
  import java.util.List;\n\nprivate void queryProduct() {\n    QueryProductDetailsParams\
  \ queryProductDetailsParams =\n        QueryProductDetailsParams.newBuilder()\n\
  \        .setProductList(\n```\n\n\n\n\n\n```java\nImmutableList.of(\n    QueryProductDetailsParams.Product.newBuilder()\n\
  \        .setProductId(\"one_button_click\")\n        .setProductType(\n       \
  \     BillingClient.ProductType.INAPP)\n        .build()))\n.build();\n\nbillingClient.queryProductDetailsAsync(\n\
  \    queryProductDetailsParams,\n    new ProductDetailsResponseListener() {\n  \
  \      public void onProductDetailsResponse(\n            @NonNull BillingResult\
  \ billingResult,\n            @NonNull List<ProductDetails> productDetailsList)\
  \ {\n            if (!productDetailsList.isEmpty()) {\n                productDetails\
  \ = productDetailsList.get(0);\n                runOnUiThread(() -> {\n        \
  \            binding.buyButton.setEnabled(true);\n                    binding.statusText.setText(productDetails.getName());\n\
  \                });\n            } else {\n                Log.i(TAG, \"onProductDetailsResponse:\
  \ No products\");\n            }\n        }\n    }\n);\n```\n\n这里使用的大部分代码在上一节中应该很熟悉。监听器检查至少有一个产品符合标准。然后，从第一个匹配的并中提取\
  \ `ProductDetails` 对象，将其存储在 `productDetails` 变量中，并在 `TextView` 上显示产品名称。需要注意的是，当我们在\
  \ `status TextView` 上显示产品名称时，是通过调用 `runOnUiThread()` 实现的。这是必要的，因为监听器不是在主线程上运行，因此无法安全地更改用户界面。`runOnUiThread()`\
  \ 方法提供了一种使用协程在主线程上执行代码的快速方便的方法。\n\n### 3.0 启动购买流程\n\n当用户点击购买按钮时，将调用 `makePurchase()`\
  \ 来启动购买过程。我们现在可以如下添加此方法：\n\n```java\npublic void makePurchase(View view) {\n   \
  \ BillingFlowParams billingFlowParams =\n        BillingFlowParams.newBuilder()\n\
  \        .setProductDetailsList(\n            ImmutableList.of(\n              \
  \  BillingFlowParams.ProductDetailsParams.newBuilder()\n                    .setProductDetails(productDetails)\n\
  \                    .build()\n            )\n        )\n        .build();\n   \
  \ billingClient.launchBillingFlow(this, billingFlowParams);\n}\n```\n\n### 3.1 处理购买更新\n\
  \n购买过程的结果将通过初始化阶段分配给结算客户端的 `PurchaseUpdatedListener` 报告给应用。现在按如下方式添加此处理器：\n\n```java\n\
  private final PurchasesUpdatedListener purchasesUpdatedListener = new PurchasesUpdatedListener()\
  \ {\n    @Override\n    public void onPurchasesUpdated(BillingResult billingResult,\n\
  \            List<Purchase> purchases) {\n        if (billingResult.getResponseCode()\
  \ ==\n            BillingClient.BillingResponseCode.OK\n            && purchases\
  \ != null) {\n            for (Purchase purchase : purchases) {\n              \
  \  completePurchase(purchase);\n            }\n        } else if (billingResult.getResponseCode()\
  \ ==\n            BillingClient.BillingResponseCode.USER_CANCELED) {\n         \
  \   Log.i(TAG, \"onPurchasesUpdated: Purchase Canceled\");\n        } else {\n \
  \           Log.i(TAG, \"onPurchasesUpdated: Error\");\n        }\n    }\n};\n```\n\
  \n如果用户取消购买或发生其他错误，处理器将输出日志消息。然而，成功的购买会导致调用 `completePurchase()` 方法，并向该方法传递当前的 `Purchase`\
  \ 对象。按如下所示添加此方法：\n\n```java\nprivate void completePurchase(Purchase item) {\n  \
  \  purchase = item;\n    if (purchase.getPurchaseState() == Purchase.State.PURCHASED)\n\
  \        runOnUiThread(() -> {\n            binding.consumeButton.setEnabled(true);\n\
  \            binding.statusText.setText(\"Purchase Complete\");\n        });\n}\n\
  ```\n\n此方法在验证产品已购买且付款未待处理之前会存储购买信息。启用“消耗”按钮，并通知用户购买成功。同时禁用购买按钮，以防止用户在消耗购买之前重复购买。\n\
  \n### 3.2 消耗产品\n\n现在用户可以点击“消耗”按钮，下一步是确保产品已消耗，以便在下次点击之前执行。这需要我们编写 `consumePurchase()`\
  \ 方法：\n\n```java\npublic void consumePurchase(View view) {\n    ConsumeParams consumeParams\
  \ =\n        ConsumeParams.newBuilder()\n        .setPurchaseToken(purchase.getPurchaseToken())\n\
  \        .build();\n    ConsumeResponseListener listener = new ConsumeResponseListener()\
  \ {\n        @Override\n        public void onConsumeResponse(BillingResult billingResult,\n\
  \            @NonNull String purchaseToken) {\n                if (billingResult.getResponseCode()\
  \ ==\n                    BillingClient.BillingResponseCode.OK) {\n            \
  \        runOnUiThread(() -> {\n                        binding.consumeButton.setEnabled(false);\n\
  \                        binding.statusText.setText(\"Purchase consumed\");\n  \
  \                  });\n                }\n            }\n    };\n    billingClient.consumeAsync(consumeParams,\
  \ listener);\n}\n```\n\n此方法创建一个 `ConsumeParams` 实例，并使用购买令牌对其进行配置（该令牌来自之前存储在 `completePurchase()`\
  \ 方法中的 `Purchase` 对象）。如果产品被成功消耗，将在主线程中执行代码以禁用消耗按钮、启用购买按钮并更新状态文本。\n\n### 3.3 恢复之前的购买\n\
  \n到目前为止的代码可以在单个会话内购买并消耗产品。如果我们在消耗之前退出应用，购买将在应用重启时丢失。我们可以通过配置 `QueryPurchasesParams`\
  \ 实例来搜索未消耗的应用内产品，并将其与监听器引用传递给结算客户端的 `queryPurchasesAsync()` 方法来解决此问题。按如下所示在 `MainActivity.java`\
  \ 文件中添加新函数和监听器：\n\n```java\nprivate void reloadPurchase() {\n    QueryPurchasesParams\
  \ queryPurchasesParams = QueryPurchasesParams.newBuilder()\n        .setProductType(BillingClient.ProductType.INAPP)\n\
  \        .build();\n    billingClient.queryPurchasesAsync(\n        queryPurchasesParams,\n\
  \        purchasesListener\n    );\n}\n\nprivate final PurchasesResponseListener\
  \ purchasesListener = new PurchasesResponseListener() {\n    @Override\n    public\
  \ void onQueryPurchasesResponse(@NonNull BillingResult billingResult,\n        \
  \    @NonNull List<Purchase> list) {\n        if (!list.isEmpty()) {\n         \
  \   purchase = list.get(0);\n            binding.consumeButton.setEnabled(true);\n\
  \        } else {\n            binding.consumeButton.setEnabled(false);\n      \
  \  }\n    }\n};\n```\n\n\n\n\n\n如果传递给监听器的购买列表不为空，则列表中的第一个购买将被赋值给 `purchase` 变量，并启用“消耗”按钮（在更完整的实现中，应该添加代码通过比较产品\
  \ ID 来检查这是否是正确的产品，并处理多个购买的返回）。如果没有找到购买项目，则消耗按钮将保持禁用，直到再次进行购买。剩下的工作工作是在计单设置过程中如下所示调用我们新的\
  \ `reloadPurchase()` 方法：\n\n```java\nprivate void billingSetup() {\n    .\n    .\n\
  \    if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.OK)\
  \ {\n        Log.i(TAG, \"OnBillingSetupFinish connected\");\n        queryProduct();\n\
  \        reloadPurchase();\n    } else {\n        Log.i(TAG, \"OnBillingSetupFinish\
  \ failed\");\n    }\n    .\n    .\n}\n```\n\n### 83.14 测试应用程序\n\n在测试应用程序之前，我们需要将此最新版本上传到\
