  \ updates` 使表格不再是只读的，双击表格行的 `quantity` 单元格，并在按下键盘 `Enter` 键之前更改该值。返回运行的应用并搜索该产品，以确认在检查器中对\
  \ `quantity` 进行的更改已保存到数据库表中。\n\n最后，点击表查询按钮（如下方图 67-4 中的箭头所示）以显示新的查询标签页 (A)，确保选中了\
  \ `product_database` (B)，并在查询文本字段 (C) 中输入 SQL 语句并点击 `Run` 按钮 (D)：\n\n![](img/as_database_query.jpg)\n\
  \n图 67-4\n\n行列表应会更新以反映 SQL 查询 (E) 的结果。\n\n### 67.16 总结\n\n本章演示了如何使用 `Room` 持久化库在\
  \ `SQLite` 数据库中存储数据。完成的项目使用了仓库（repository）将 `ViewModel` 与所有数据库操作分离。它演示了实体、`DAO`\
  \ 和 `room` 数据库实例的创建，包括在执行某些数据库操作时对异步任务的使用。\n\n# 68. 使用 Android 存储访问框架访问云存储\n\n近年来，远程存储服务（又称为“云存储”）被广泛用于存储用户文件和数据。驱动这一增长有两个关键因素。因素之一是，大多数移动设备现在都提供持续、高速的互联网连接，从而使得数据传输既快速又廉价。第二个因素是，与传统的计算机系统（如台式机和笔记本电脑）相比，这些移动设备在内部存储资源方面受到限制。例如，今天高规格的\
  \ Android 平板通常配备 128Gb 的存储容量。与带有 750Gb 硬盘的中端笔记本电脑系统相比，无缝远程存储文件已成为许多移动应用程序的关键需求。\n\
  \n为了承认这一事实，Google 引入了 `Storage Access Framework`（存储访问框架）作为 Android 4.4 `SDK` 的。本章将提供存储访问框架的高级概述，为下一章更详细的教程做准备，该章节标题为“Android\
  \ 存储访问框架示例。\n\n### 68.1 存储访问框架\n\n从用户的角度来看，`Storage Access Framework` 提供了一个直观的用户界面，允许用户从\
  \ Android 应用程序内部浏览、选择、删除和创建由存储服务（也称为文档提供者）托管的文件。通过使用此浏览界面（也称为选择器），用户可以浏览他们所选文档提供者托管的文件（如文档、音频、图像和视频）。例如，图\
  \ 68-1 显示了选择器界面显示了由文档提供者服务托管的文件集合：\n\n![](img/as3.0_storage_picker.jpg)\n\n图 68-1\n\
  \n文档提供者的范围从基于云的服务到与客户端应用程序在同一设备上运行的本地文档提供者。编写此时，兼容 `Storage Access Framework` 的最著名文档提供者是\
  \ `Box` 以及意料之中的 `Google Drive`。极可能其他云存储提供者和应用程序开发者很快就会提供符合 `Storage Access Framework`\
  \ 的服务。\n\n除了云文档提供者外，选择器还提供了对设备内部存储的访问，为应用程序提供了存储选项。\n\n通过一组 `Intents`，Android 开发者只需几行代码即可将这些存储功能整合到应用程序中。从开发者的角度来看，`Storage\
  \ Access Framework` 特别具有吸引力的方面是，用户选择的底层文档提供者对应用程序是完全透明的。一旦在应用程序中使用框架实现了存储功能，它就可以无需修改代码与所有文档提供者协作。\n\
  \n### 68.2 使用存储访问框架\n\nAndroid 包含一组 `Intents`，旨在将 `Storage Access Framework` 的功能集成到\
  \ Android 应用程序中。这些 intent 向显示 `Storage Access Framework` 选择器界面，并通过启动 Activity 的方法的\
  \ `onActivityResult()` 方法将交互结果返回应用程序。当 `onActivityResult()` 方法被调用时，它将传递选取文件的 `Uri`\
  \ 以及操作是否成功的值。\n\n`Storage Access Framework` intent 总结如下：\n\n- `ACTION_OPEN_DOCUMENT`\
  \ – 为用户提供访问选择器界面的权限，以便从设备上的文档提供者中选择文件。选取的文件以 `Uri` 对象的形式传回应用程序。\n- `ACTION_CREATE_DOCUMENT`\
  \ – 允许用户选择文档提供者、该提供者存储上的位置以及新文件的文件名。一旦选择，文件将由 `Storage Access Framework` 创建并将该文件的\
  \ `Uri` 返回给应用程序进行进一步处理。\n\n### 68.3 过滤选择器文件列表\n\n当启动 intent 时，选择器界面内列出的文件可以使用多种选项进行过滤。例如，考虑以下代码用于配置\
  \ `ACTION_OPEN_DOCUMENT` intent：\n\n\n\n\n\n```java\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  ```\n\n启动后，上述 `intent` 将导致显示选择器用户界面，允许用户浏览并选择由任何可用文档提供程序托管的文件。一旦用户选择了某个文件，该文件将以\
  \ `Uri` 对象的格式向应用程序提供该文件的引用。随后，应用程序可以使用 `openFileDescriptor(Uri, String)` 方法打开文件。然而，存在某些风险，并非所有由文档提供程序列出的文件都能通过这种方式打开。可以通过使用\
  \ `CATEGORY_OPENABLE` 选项修改 `intent` 来在选择器中排除此类文件。例如：\n\n```java\nIntent intent =\
  \ new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  ```\n\n当现在显示 `intent` 时，无法使用 `openFileDescriptor()` 方法打开的文件将被列出，但用户无法选择它们。\n\n另一种实用的过滤方法是允许通过文件类型来限制可供选择的文件。这涉及到指定应用程序能够处理的文件类型。。例如，一个图像编辑应用程序可能只想为用户提供从文档提供程序中选择图像文件的选项。这是通过配置\
  \ `intent` 对象并指定用户可以选择的文件的 MIME 类型来实现的。以下代码指定了只有图像文件适合在选择器中选择：\n\n```java\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \nintent.setType(\"image/*\");\n```\n\n这可以进一步精炼以将选择限制为 JPEG 图像：\n\n```java\nintent.setType(\"\
  image/jpeg\");\n```\n\n或者，音频播放器应用可能只能处理音频文件：\n\n```java\nintent.setType(\"audio/*\"\
  );\n```\n\n音频应用可能会被进一步限制为仅支持播放基于 MP4 的音频文件：\n\n```java\nintent.setType(\"audio/mp4\"\
  );\n```\n\n在处理存储访问框架（Storage Access Framework）时，可以使用广泛的 MIME 类型设置，其中更常见的可以在网上列出的列表中：\n\
  \nhttps://en.wikipedia.org/wiki/Internet_media_type#List_of_common_media_types\n\
  \n## 68.4 处理 Intent 结果\n\n由于我们启动了将返回结果的 intent，因此需要使用 `registerForActivityResult()`\
  \ 方法（在 Android 显式 Intent – 实例示例 章节中介绍）来创建一个启动器并声明一个 lambda 回调处理返回的数据，例如：\n\n```java\n\
  ActivityResultLauncher<Intent> startOpenForResult = registerForActivityResult(\n\
  \    new ActivityResultContracts.StartActivityForResult(),\n    new ActivityResultCallback<ActivityResult>()\
  \ {\n        @Override\n        public void onActivityResult(ActivityResult result)\
  \ {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n         \
  \       Intent data = result.getData();\n                // 在此处从 Uri 读取文件内容\n  \
  \          }\n        }\n    });\n```\n\n一旦声明，就可以如下所示配置并启动 `intent`：\n\n```java\n\
  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \nintent.setType(\"text/plain\");\n\nstartOpenForResult.launch(intent);\n```\n\n\
  ## 68.5 读取文件内容\n\n读取文档提供程序托管的文件内容所需的具体步骤在很大程度上取决于文件的类型。例如，从文本文件中读取行的步骤与读取其他文件的步骤不同。一旦文档提供程序托管了文件，就可以通过\
  \ `Uri` 对象的打开描述符来读取文件内容。通过 `Uri` 对象的 `openFileDescriptor` 方法：\n\n```java\nParcelFileDescriptor\
  \ fd = getContentResolver().openFileDescriptor(uri, \"r\");\nInputStream is = new\
  \ FileInputStream(fd.getDescriptor());\nBufferedReader reader = new BufferedReader(new\
  \ InputStreamReader(is));\n\nString line;\nwhile ((line = reader.readLine()) !=\
  \ null) {\n    // 处理行\n}\nreader.close();\nfd.close();\n```\n\n\n\n\n\n思考近年来对“存储”的认知是如何变化的是非常有趣的。“存储”一词曾是大容量内置硬盘的同义词，但现在它同样可能指代远程托管在云端并通过互联网连接访问的存储空间。随着内置存储容量受限的“始终连接”移动设备的广泛采用，这种情况变得愈发普遍。\n\
  \nAndroid 存储访问框架（Storage Access Framework）为用户和应用程序开发人员提供了一种简单的机制，可以无缝访问存储在云端的文件。通过使用一组\
  \ intents 以及用于选择文档提供程序和文件的内置用户界面，现在只需极少的代码即可将全面的云存储集成到 Android 应用程序中。\n\n# 69 Android\
  \ 存储访问框架示例\n\n如前所述，存储访问框架极大地简化了将云存储访问集成到 Android 应用程序中的过程。通过一个选择器用户界面和一组新的 intents，现在可以相对轻松在\
  \ Android 应用程序中构建对存储在 Google Drive 和 Box 等文档提供程序上的文件访问。在上一章介绍了 Android 存储访问框架的基础知识后，本章将演示创建一个示例应用程序，该程序使用存储访问框架来存储和管理文件。\n\
  \n## 69.1 关于存储访问框架示例\n\n本章创建的 Android 应用程序将作为一个原始的文本编辑器，旨在将文本文件远程创建并存储到云存储服务中。在实践中，该示例适用于任何兼容存储访问框架的云文档存储提供程序，但为了本示例，假设使用\
  \ Google Drive。\n\n从功能上来说，应用程序将向用户提供一个多行文本视图，可以在其中输入和编辑文本，并提供一组允许创建、打开和保存存储的文本文件的按钮。\n\
  \n## 69.2 创建存储访问框架示例\n\n从欢迎屏幕选择 New Project ，在出现的新项目对话框中，点击 Next 按钮之前选择 Empty Activity\
  \ 模板。\n\n在 Name 字段中输入 `StorageDemo` 并指定包名为 `com.ebookfrenzy.storagedemo`。在点击 Finish\
  \ ，将 Minimum API level 设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单设置为 `Java`。按照 View\
  \ Binding 章节中的常规步骤为项目添加 view binding 支持。\n\n### 69.3 设计用户界面\n\n用户界面需要由三个 `Button`\
  \ 视图和一个 `EditText` 视图组成。在 Project 工具窗口中，导航到位于 `app -> res -> layout` 的 `activity_main.xml`\
  \ 布局文件，并双击将其加载到 Layout Editor 工具中。在 Design 模式下，选择并删除 Hello World! `TextView` 对象。\n\
  \n将 `Button` 控件拖到并位于布局的左上角，在释放控件之前让左侧和上方的虚线边距指南出现。放置第二个 `Button`，使中心和顶部的边距指南出现。第三个\
  \ `Button` 控件应放置在顶部和右侧的边距指南出现的位置。\n\n将三个按钮的文本属性分别更改为“New”、“Open”和“Save”。接下来，放置一个\
  \ Plain Text 控件，使其水平居中并位于中心 `Button` 之下，以便用户界面布局与[图 69-1]所示匹配。使用 Layout Editor 工具栏中的\
  \ Infer Constraints 按钮添加任何缺失的约束。\n\n选择布局中的 Plain Text 控件，删除当前的 text 属性设置（使字段初始为空），并将\
  \ ID 设置为 `fileText`。接下来，将字符串属性提取到资源值中，分别命名为 `string`、`open_string` 和 `save_string`。\n\
  \n![](img/as_storagedemo_ui.jpg)\n\n图 69-1\n\n使用 Attributes 工具窗口，配置 `Button` 控件上的\
  \ `onClick` 属性以分别调用命名为 `newFile`、`openFile` 和 `saveFile` 的方法。\n\n## 69.4 添加 Activity\
  \ 启动器\n\n遵循[Android Explicit Intents – A Worked Example]章节中概述的步骤，我们需要从开始注册 activity\
  \ 启动器以处理文件内容的创建、打开和保存。在 `MainActivity.java` 文件中，如下所示为三个操作分别添加一个启动器：\n\n```java\n\
  import androidx.activity.result.ActivityResult;\nimport androidx.activity.result.ActivityResultCallback;\n\
  import androidx.activity.result.ActivityResultLauncher;\nimport androidx.activity.result.contract.ActivityResultContracts;\n\
  import android.app.Activity;\nimport android.content.Intent;\nimport android.net.Uri;\n\
  import java.io.IOException;\n\nActivityResultLauncher<Intent> startOpenForResult\
  \ =\n    registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n           \
  \     if (result.getResultCode() == Activity.RESULT_OK) {\n                    Intent\
  \ data = result.getData();\n                    if (data != null) {\n          \
  \              Uri currentUri = data.getData();\n                        try {\n\
  \                            String content = readFileContent(currentUri);\n   \
  \                         binding.fileText.setText(content);\n                 \
  \       } catch (IOException e) {\n                            // Handle here\n\
  \                        }\n                    }\n                }\n         \
  \   }\n        }\n    );\n\nActivityResultLauncher<Intent> startSaveForResult =\n\
  \    registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        result -> {\n            if (result.getResultCode() == Activity.RESULT_OK)\
  \ {\n                Intent data = result.getData();\n                if (data !=\
  \ null) {\n                    Uri currentUri = data.getData();\n              \
  \      try {\n                        writeFileContent(currentUri);\n          \
  \          } catch (IOException e) {\n                        // Handle here\n \
  \                   }\n                }\n            }\n        }\n    );\n\nActivityResultLauncher<Intent>\
  \ startCreateForResult =\n    registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n           \
  \     if (result.getResultCode() == Activity.RESULT_OK) {\n                    Intent\
  \ data = result.getData();\n                    if (data != null) {\n          \
  \              binding.fileText.setText(\"\");\n                    }\n        \
  \        }\n            }\n        }\n    );\n```\n\n## 69.5 创建新的存储文件\n\n当 New 按钮被选中时，应用程序需要触发一个配置为创建纯文本\
  \ MIME 类型 文件的 `ACTION_CREATE_DOCUMENT` intent。在设计用户界面时，New 按钮被配置为调用命名为 `newFile()`\
  \ 的方法。正需要在该方法内启动相应的 intent。\n\n继续留在 `MainActivity.java` 文件中，如下实现该方法：\n\n\n\n\n\n\
  ```java\npackage com.ebookfrenzy.storagedemo;\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n\n.\n\n.\n\n    public void newFile(View view)\n    {\n \
  \       Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);\n        intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \        intent.setType(\"text/plain\");\n        intent.putExtra(Intent.EXTRA_TITLE,\
  \ \"newfile.txt\");\n        startCreateForResult.launch(intent);\n    }\n\n.\n\n\
  }\n```\n\n这段代码创建了一个新的 `ACTION_CREATE_INTENT` Intent 对象。随后对该 intent 进行了配置，使其仅返回可以使用文件描述符打开的文件（通过\
  \ `Intent.CATEGORY_OPENABLE` 类别设置）。\n\n接下来，代码指定了要打开的文件应具有纯文本 MIME 类型，并提供了一个占位符文件名（用户可以在选择器界面中更改该文件名）。\n\
  \n当执行此方法且 intent 完成了分配的任务时，将调用 `startCreateForResult()` 的 lambda 表达式，并传递新创建文档的 `Uri`。\n\
  \n## 69.6 保存到存储文件\n\n现在应用程序能够创建新的基于存储的文件了，下一步是添加将用户输入的任何文本保存到文件的功能。用户界面被配置为当用户选择保存（Save）按钮时调用\
  \ `saveFile()` 方法。该方法将负责启动一个类型为 `ACTION_OPEN_DOCUMENT` 的新 intent，这将导致选择器用户界面出现，以便用户可以选择存储文本的文件。由于我们只处理纯文本文件，因此需要对\
  \ intent 进行配置，将用户的选择选项限制为匹配 `text/plain` MIME 类型的现有文件。在确定了 `saveFile()` 方法要执行的操作后，现在可以将其所示添加到\
  \ `MainActivity.java` 类文件中：\n\n```java\npublic void saveFile(View view)\n{\n   \
  \ Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n    intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \    intent.setType(\"text/plain\");\n    startSaveForResult.launch(intent);\n}\n\
  ```\n\n分配给 `startSaveForResult()` 的 lambda 表达式调用了一个名为 `writeFileContent()` 的方法，并传递了要写入文本的文件\
  \ `Uri`。在 `MainActivity.java` 文件中，现在实现该方法，使其读取逻辑如下：\n\n```java\npackage com.ebookfrenzy.storagedemo;\n\
  \nimport java.io.FileOutputStream;\nimport android.os.ParcelFileDescriptor;\n\n\
  public class MainActivity extends AppCompatActivity {\n\n.\n\n.\n\n    private void\
  \ writeFileContent(Uri uri) throws IOException\n    {\n        try{\n          \
  \  ParcelFileDescriptor pfd =\n                    this.getContentResolver().\n\
  \                    openFileDescriptor(uri, \"w\");\n            FileOutputStream\
  \ fileOutputStream =\n                    new FileOutputStream(\n              \
  \              pfd.getFileDescriptor());\n            String textContent =\n   \
  \                 binding.fileText.getText().toString();\n            fileOutputStream.write(textContent.getBytes());\n\
  \            fileOutputStream.close();\n            pfd.close();\n        } catch\
  \ (IOException e) {\n            e.printStackTrace();\n        }\n    }\n\n.\n}\n\
  ```\n\n该方法首先从用户选择文件的 `Uri` 获取并打开文件描述符。由于代码需要写入文件，因此以写入模式（`w`）打开描述符。随后使用该文件描述符作为创建输出流的基础，以便应用程序能够写入文件。用户输入的文本从编辑对象中提取，并在文件描述符和流关闭之前写入输出流中。代码还添加了处理在文件写入过程中可能遇到的任何异常。\n\
  \n## 69.7 打开并读取存储文件\n\n在编写了创建和保存文本文件的代码后，最后一个任务是添加从存储打开并读取文件的功能。这将涉及编写 `openFile()`\
  \ 点击处理方法并实现它，以便启动 `ACTION_OPEN_DOCUMENT` intent：\n\n```java\npublic void openFile(View\
  \ view)\n{\n    Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n    intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \    intent.setType(\"text/plain\");\n    startOpenForResult.launch(intent);\n}\n\
  ```\n\n下一个任务是实现由 `startOpenForResult()` lambda 表达式调用的 `readFileContent()` 方法：\n\n\
  ```java\npackage com.ebookfrenzy.storagedemo;\n\n.\n\nimport java.io.BufferedReader;\n\
  import java.io.InputStream;\nimport java.io.InputStreamReader;\n\n.\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n\n.\n\n.\n\n    private String readFileContent(Uri\
  \ uri) throws IOException {\n        InputStream inputStream =\n               \
  \ getContentResolver().openInputStream(uri);\n        BufferedReader reader =\n\
  \                new BufferedReader(new InputStreamReader(\n                   \
  \ inputStream));\n        StringBuilder stringBuilder = new StringBuilder();\n \
  \       String currentline;\n        while ((currentline = reader.readLine()) !=\
  \ null) {\n            stringBuilder.append(currentline).append(\"\\n\");\n    \
  \    }\n        inputStream.close();\n        return stringBuilder.toString();\n\
  \    }\n\n.\n\n}\n```\n\n该方法首先提取所选文本文件的文件描述符并将其打开读取。随后打开与 `Uri` 关联的输入流，并将其作为 `BufferedReader`\
  \ 实例的输入源。文件中的每一行都会被读取并存储在 `StringBuilder` 对象中。一旦读取完所有行，输入流和文件描述符都将被关闭，文件内容以 `String`\
  \ 返回。\n\n## 69.8 测试存储应用程序\n\n编码阶段完成后，应用程序已准备好测试。编译并运行应用程序，然后选择新建（New）按钮。存储 Access\
  \ Framework 随后将显示如图 69-2 所示的下载界面。\n\n点击上方指定的菜单按钮，选择 My Drive 下的 Drive 选项，并导航到 Google\
  \ Drive 存储中合适的位置以保存文件。在选择器界面底部的文本框中，将文件名从 `newfile.txt` 更改为合适的名称（保留 .txt 扩展名），然后选择保存（Save）选项。\n\
  \n一旦创建了新文件，应用程序应返回主活动，通知栏可能会出现一条显示“1 个文件已上传”的通知。此时，应该可以在浏览器窗口中登录您的 Google Drive\
  \ 账号，并在请求的位置找到新创建的文件。\n\n\n\n\n需要注意的是，如果 Android 设备缺乏活跃的互联网连接，存储访问框架（Storage Access\
  \ Framework）将把存储文件缓存在本地中。然而，一旦重新建立连接，任何缓存数据都将与远程存储服务同步。因此，作为应用程序的最终测试，请在浏览器窗口登录您的\
  \ Google Drive 账户，导航到保存的文件并点击查看内容，如果一切顺利，内容应包含应用程序保存的文本。\n\n### 69.9 总结\n\n本章介绍了如何创建一个\
  \ Android Studio 应用程序示例，该程序是一个非常基础的文本编辑器，旨在使用 Android 存储访问框架通过云存储创建、保存和打开文件。\n\n\
  # 70. 使用 VideoView 和 MediaController 类在 Android 上进行视频播放\n\n智能手机和平板的主要用途之一是提供在线内容的访问。视频是一种广泛使用的内容形式，特别是在平板设备上。\n\
  \nAndroid SDK 包含了两个类，使得在开发应用程序时在 Android 设备上实现视频播放极其简单。本章将概述这两个类 `VideoView` 和 `MediaController`，并创建一个视频播放应用程序。\n\
  \n## 70.1 介绍 Android VideoView 类\n\n在 Android 应用程序中显示视频最简单的方法是使用 `VideoView` 类。该视觉组件在被添加到\
  \ Activity 布局时，提供了一个可以在其中播放视频的表面。Android 目前支持以下视频格式：\n\n* H.263\n* H.264 AVC\n*\
  \ H.265 HEVC\n* MPEG-4 SP\n* VP8\n* VP9\n\n`VideoView` 类有一许多可以调用的方法来管理视频播放。一些最常用的方法如下：\n\
  \n* `setVideoPath(String path)` – 指定要播放的视频媒体路径（字符串格式）。这可以是远程视频文件的 URL，也可以是设备本地的视频文件。\n\
  * `setVideoUri(Uri uri)` – 执行与 `setVideoPath()` 方法相同的任务，但接受 `Uri` 对象作为参数而不是字符串。\n\
  * `start()` – 开始视频播放。\n* `stopPlayback()` – 停止视频播放。\n* `pause()` – 暂停视频播放。\n* `isPlaying()`\
  \ – 返回一个布尔值，指示视频是否正在播放。\n* `setOnPreparedListener(MediaPlayer.OnPreparedListener)`\
  \ –允许在视频准备好播放时调用回调方法。\n* `setOnErrorListener(MediaPlayer.OnErrorListener)` –允许在视频播放期间发生错误时调用回调方法。\n\
  * `setOnCompletionListener(MediaPlayer.OnCompletionListener)` –允许在视频结束时调用回调方法。\n\
  * `getDuration()` – 返回视频的持续时间。除非从 `OnPreparedListener()` 回调方法内部调用，否则通常会返回 -1。\n\
  * `getCurrentPosition()` – 返回指示当前播放位置的整数值。\n* `setMediaController(MediaController)`\
  \ – 指定一个 `MediaController` 实例，允许向用户显示播放控件。\n\n## 70.2 介绍 Android MediaController\
  \ 类\n\n如果使用 `VideoView` 类播放视频，用户将无法对播放进行任何控制，视频将一直运行到结束。此问题可以通过将 `MediaController`\
  \ 类的实例挂载到 `VideoView` 实例上来解决。`MediaController` 将会提供一组控件，允许用户管理播放（例如暂停以及在视频时间轴上向后回退或向前快进）。\n\
  \n控件的位置通过将控制器实例锚定到用户界面布局中的特定视图来指定。一旦连接并锚定，控件将在播放开始时短暂出现，随后用户可以通过点击实例所锚定的视图在任何时间点恢复控件。\n\
  \n该类的一些关键方法如下：\n\n* `setAnchorView(View view)` – 指定控制器将锚定的视图。这指定了控件在屏幕上的位置。\n* `show()`\
  \ – 显示控件。\n* `show(int timeout)` – 控件显示指定的持续时间（以毫秒计）。\n* `hide()` – 向用户隐藏控制器。\n\
  * `isShowing()` – 返回一个布尔值，指示控件当前对用户可见。\n\n## 70.3 创建视频播放示例\n\n本章的剩余部分将创建一个示例应用程序，其使用\
  \ `VideoView` 和 `MediaController` 类播放 MPEG-4 视频文件。\n\n从欢迎界面选择 New Project（新建项目）选项，在出现的新项目对话框中，点击\
  \ Next（下一步）按钮之前选择 Empty Views Activity（空视图 Activity）模板。\n\n在 Name（名称）字段中输入 `VideoPlayer`，并指定\
  \ `com.ebookfrenzy.videoplayer` 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置为 `API\
  \ 33: Android 13 (Tiramisu)`，并将语言菜单更改为 `Java`。参考章节 [11.8 将项目迁移到 View 绑定] 中的步骤为项目启用视图\
  \ 绑定。\n\n## 70.4 设计 VideoPlayer 布局\n\n主 Activity 的用户界面将仅由 `VideoView` 类的实例组成。使用\
  \ Project 工具窗口找到 `app -> res -> layout -> activity_main.xml` 文件，双击它，将 Layout Editor\
  \ 工具切换到 Design（设计）模式，并删除默认的 `TextView` 小部件。\n\n从 Palette（调板）面板的 Widgets（控件）类别，将\
  \ `VideoView` 实例拖放到布局中以填充可用的画布区域，如图 70-1 所示。使用 Attributes（属性）面板，将 `layout_width`\
  \ 和 `layout_height` 分别更改为 `match_constraint` 和 `wrap_content`。此外，移除连接 VideoView\
  \ 到 ConstraintLayout 底部的约束。最后，将组件的 ID 改为 `videoView`。\n\n## 70.5 下载视频文件\n\n`VideoPlayer`\
  \ 应用程序播放的视频是一个 MPEG-4 格式的短动画。使用浏览器导航到以下 URL 播放视频：`https://www.ebookfrenzy.com/android_book/demo.mp4`\n\
  \n留在浏览器窗口中，右键点击视频播放，选择保存或下载视频到本地，并选择合适的文件系统位置，命名为 `demo.mp4`。\n\n在 Android Studio\
  \ 中，在 Project 工具窗口找到 `res` 文件夹，右键点击它，选择 New -> Directory 选项，并在名称字段中输入 `raw` 然后按回车键。使用操作系统的文件导航器找到上述\
  \ `demo.mp4` 文件并复制。返回 Android Studio，右键点击新创建的 `raw` 目录并选择 Paste（粘贴）。一旦添加完成后，`raw`\
  \ 文件夹应符合图 70-2。\n\n## 70.6 配置 VideoView\n\n下一步是为 `VideoView` 配置视频路径并开始播放。将在主 Activity\
  \ 初始化时执行，因此将 `MainActivity.java` 文件加载到编辑器中并按照下方列出的列表进行修改：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.net.Uri;\n...\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n    }\n}\n```\n\n\n\n\n```java\n        setContentView(view);\n\
  \n        configureVideoView();\n\n    }\n\n    private void configureVideoView()\
  \ {\n        binding.videoView1.setVideoURI(Uri.parse(\"android.resource://\"\n\
  \                + getPackageName() + \"/\" + R.raw.demo));\n        binding.videoView1.start();\n\
  \n    }\n}\n```此代码获取了布局中 `VideoView` 实例的引用，为其分配了一个指向 raw 资源目录中电影文件的 `URI` 对象，然后开始播放视频。\n\
  \n通过在模拟器或物理 Android 设备上运行该应用程序来测试它。应用程序启动后，在视频开始播放之前，缓冲视频内容可能会有短暂的延迟（见图 70-3）。\n\
  \n![](img/as_video_player_running.jpg)\n\n图 70-3\n\n这展示了将视频播放集成到 Android 应用程序是多么简单。此示例中的一切都是通过一个\
  \ `VideoView` 实例和三行代码实现的。\n\n## 70.7 为 Video View 添加 MediaController\n\n按照 `VideoPlayer`\
  \ 应用程序目前的状态，用户无法控制播放。如之前所述，这可以通过 `MediaController` 类来实现。要为 `VideoView` 添加控制器，请再次修改\
  \ `configureVideoView()` 方法：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\n\
  .\n\n.\n\nimport android.widget.MediaController;\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n\n    private ActivityMainBinding binding;\n\n    private\
  \ MediaController mediaController;\n.\n.\n\n    private void configureVideoView()\
  \ {\n        binding.videoView1.setVideoURI(Uri.parse(\"android.resource://\"\n\
  \                + getPackageName() + \"/\" + R.raw.demo));\n        mediaController\
  \ = new MediaController(this);\n        mediaController.setAnchorView(binding.videoView1);\n\
  \        binding.videoView1.setMediaController(mediaController);\n        binding.videoView.start();\n\
  \    }\n}\n```\n\n当应用了这些更改并启动应用程序时，点击 `VideoView` 画布将导致媒体控件显示在视频播放上层。这些控件应该包含一个\
  \ `Seekbar` 以及快进、后退和播放/暂停按钮。当控件从视图中消失后，可以通过再次点击 `VideoView` 画布随时恢复。只需多加三行代码，我们的视频播放器应用程序就有了媒体控件，如图\
  \ 70-4 所示所示：\n\n![](img/as_3.6_video_player_media_controls.jpg)\n\n图 70-4\n\n##\
  \ 70.8 设置 onPreparedListener\n\n作为处理视频媒体的最后一个示例，该活动将进一步扩展，以演示配置监听器的机制。在这种情况下，将实现一个监听器，用于将视频时长作为消息输出到\
  \ Android Studio 的 `Logcat` 面板。该监听器还将配置视频播放为持续循环：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\
  \n.\n\n.\n\nimport android.util.Log;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    private ActivityMainBinding binding;\n\n    private MediaController mediaController;\n\
  \n    String TAG = \"VideoPlayer\";\n\n    private void configureVideoView() {\n\
  \        binding.videoView1.setVideoURI(Uri.parse(\"android.resource://\"\n    \
  \            + getPackageName() + \"/\" + R.raw.demo));\n        MediaController\
  \ mediaController = new\n                    MediaController(this);\n        mediaController.setAnchorView(binding.videoView1);\n\
  \        binding.videoView1.setMediaController(mediaController);\n        binding.videoView1.setOnPreparedListener(mp\
  \ -> {\n            mp.setLooping(true);\n            Log.i(TAG, \"Duration: \"\
  \ + mp.getDuration());\n        });\n\n        binding.videoView1.start();\n   \
  \ }\n}\n```\n\n## 70.9 总结\n\nAndroid 是内容分发的优秀平台，特别是视频形式的内容。如本章所述，Android 提供了两个类，即\
  \ `VideoView` 和 `MediaController`，它们使播放变得快速简单。\n\n---\n\n## 71 画中画 (Picture-in-Picture)\n\
  \n虽然涵盖了 Android 中的多任务处理，但提到了画中画（PiP）模式却未进行详细介绍。本章将提供画中画的概述。\n\n### 71.1 画中画功能\n\n\
  正如本章稍后部分解释的，活动被放入 PiP 模式。例如，图 71-1 显示了 PiP 模式：\n\n![](img/Image273.jpg)\n\n图 71-1\n\
  \n图 71-2 显示了用户点击后的 PiP 模式：\n\n![](img/Image2463.jpg)\n\n图 71-2\n\n### 71.2 启用画中画\n\
  \n本章的剩余部分将概述如何启用 PiP 模式。它目前仅支持运行 API 26：Android 8.0 (Oreo) 或更高版本的设备。实现 PiP 模式的第一步是在项目的清单文件中启用它。PiP\
  \ 模式是按活动配置的，只需在每个需要 PiP 支持的活动元素中添加以下行：\n\n```xml\n<activity android:name=\".MyActivity\"\
  \n    android:supportsPictureInPicture=\"true\"\n    android:configChanges=\"screenSize|smallestScreenSize|screenLayout|orientation\"\
  >\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
  \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n \
  \   </intent-filter>\n</activity>\n```\n\n`android:supportsPictureInPicture` 开启了该活动的\
  \ PiP 功能，而 `android:configChanges` 属性通知 Android 该活动可以处理布局配置更改。如果没有此设置，每当活动进入或退出\
  \ PiP 模式时，活动都会重新启动，导致视频在切换期间从头开始播放。\n\n### 71.3 配置画中画参数\n\nPiP 行为通过使用 `PictureInPictureParams`\
  \ 类来定义，可以通过 `Builder` 类如下创建实例：\n\n```java\nPictureInPictureParams params = new PictureInPictureParams.Builder().build();\n\
  ```\n\n\n\n\n上述代码创建了一个带有已定义特殊参数的默认 `PictureInPictureParams` 实例。也可以使用以下可选方法调用来定制这些参数：\n\
  \n*   `setActions()` – 用于定义当活动处于 PiP 模式时可以在 PiP 窗口内执行的操作。本章稍后将更详细介绍这些操作。\n*   `setAspectRatio()`\
  \ – 声明 PiP 窗口显示的优选纵宽比。该方法接收一个包含高与宽之比例的 `Rational` 对象作为参数。\n*   `setSourceRectHint()`\
  \ – 接收一个 `Rect` 对象作为参数，定义在 PiP 窗口中显示的 Activity 屏幕区域。\n\n例如，下面的代码在 `PictureInPictureParams`\
  \ 对象中配置了纵宽比和操作参数。在宽高比方面，它是使用 `VideoView` 实例的宽度和高度维度定义的：\n\n```java\nRational rational\
  \ = new Rational(videoView.getWidth(),\n                               videoView.getHeight());\n\
  PictureInPictureParams params =\n    new PictureInPictureParams.Builder()\n    \
  \          .setAspectRatio(rational)\n              .setActions(actions)\n     \
  \         .build();\n```\n\n一旦定义，可以随时使用 `setPictureInPictureParams()` 方法如下所示设置 PiP\
  \ 参数：\n\n```java\nsetPictureInPictureParams(params);\n```\n\n在进入 PiP 模式时也可以指定参数。\n\
  \n## 71.4 进入画中画模式\n\n通过调用 `enterPictureInPictureMode()` 方法并传递 `PictureInPictureParams`\
  \ 对象，可以将 Activity 置画中画模式：\n\n```java\nenterPictureInPictureMode(params);\n```\n\n\
  如果不需要参数，请按照上一节所述，创建一个默认的 `PictureInPictureParams` 对象。如果之前已使用 `setPictureInPictureParams()`\
  \ 方法设置了参数，则这些参数将与调用 `enterPictureInPictureMode()` 方法时指定的参数合并。。\n\n## 71.5 检测画中画模式的变化\n\
  \n当 Activity 进入 PiP 模式时，隐藏不必要的视图是非常重要的，以确保 PiP 窗口内只可见视频播放。当 Activity 重新进入全屏模式时，必须恢复已隐藏的用户界面组件。可以通过重写\
  \ `onPictureInPictureModeChanged()` 方法来执行这些以及其他特定于应用的任务。当此方法添加到 Activity 后，每当 Activity\
  \ 在 PiP 和全屏模式之间切换时都会被调用一次，并传递一个指示 Activity 当前是否处于 PiP 模式的 `Boolean` 值：\n\n```java\n\
  @Override\npublic void onPictureInPictureModeChanged(\n                    boolean\
  \ isInPictureInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \    if (isInPictureInPictureMode) {\n        // Activity 进入画中画模式\n    } else {\n\
  \        // Activity 进入全屏模式\n    }\n}\n```\n\n## 71.6 添加画中画操作\n\n画中画操作会在用户点击 PiP\
  \ 窗口时以图标的形式显示在窗口内。实现画中画 操作是一个多步骤过程，首先要实现一种让 PiP 窗口通知 Activity 已选择操作的方法。这通过在 Activity\
  \ 中设置广播接收器（broadcast receiver），然后在 PiP 操作中创建一个 `pending intent` 来，该意图随后被配置为广播广播接收器正在监听的意图。当意图触发广播接收器时，意图中存储的数据可以用于识别所执行的操作，并在\
  \ Activity 中采取必要的行动。\n\nPiP 操作使用 `RemoteAction` 实例声明，并用图标、标题、描述和 `PendingIntent`\
  \ 对象初始化。一旦创建了一个或多个操作，它们就会被添加到 `ArrayList` 中，并在构建 `PictureInPictureParams` 对象时传递给\
  \ `setActions()` 方法。\n\n下面的代码片段演示了 `Intent`、`PendingIntent` 和 `RemoteAction` 对象的创建，以及一个\
  \ `PictureInPictureParams` 实例，然后将其应用于 Activity 的 PiP 设置：\n\n```java\nfinal ArrayList<RemoteAction>\
  \ actions = new ArrayList<>();\nIntent actionIntent = new Intent(\"MY_PIP_ACTION\"\
  );\nfinal PendingIntent pendingIntent =\n    PendingIntent.getBroadcast(MyActivity.this,\
  \ REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n\nfinal icon = Icon.createResource(MyActivity.this,\
  \ R.drawable.action_icon);\nRemoteAction remoteAction = new RemoteAction(icon,\n\
  \    \"My Title\",\n    \"My Description\",\n    pendingIntent);\n\nactions.add(remoteAction);\n\
  PictureInPictureParams params =\n    new PictureInPictureParams.Builder()\n    \
  \          .setActions(actions)\n              .build();\n\nsetPictureInPictureParams(params);\n\
  ```\n\n### 71.7 总结\n\n画中画模式是 Android 8.0 引入的一项多任务功能，允许用户在执行其他任务时视频在小窗口中继续播放。在使用\
  \ PiP 模式之前，必须先在清单（manifest）文件中启用需要它的 Activity。PiP 模式的行为使用 `PictureInPictureParams`\
  \ 实例进行配置，并通过在 Activity 内部调用 `enterPictureInPictureMode()` 启动。在 PiP 模式下，应只可见视频播放，这要求任何用户界面元素都隐藏，直到选择全屏模式。画中画操作在用户点击\
  \ PiP 窗口时以图标的形式叠加在窗口上。PiP 窗口使用广播接收器和等待意图来通知 Activity。\n\n## 72. Android 画中画教程\n\n\
  接上章节，本章将对现有的 VideoPlayer 项目进行增强，以添加画中画支持，包括检测 PiP 模式变化以及添加关于当前运行视频的操作。\n\n### 72.1\
  \ 在清单文件中添加画中画支持\n\n为 Android 应用添加画中画支持的第一步是在项目清单文件中启用它。打开 `AndroidManifest.xml`\
  \ 文件并修改 `activity` 元素以启用画中画支持：\n\n```xml\n<activity android:name=\".MainActivity\"\
  \n    android:supportsPictureInPicture=\"true\"\n    android:configChanges=\"screenSize|smallestScreenSize|screenLayout|orientation\"\
  \n    android:exported=\"true\">\n    <intent-filter>\n        <action android:name=\"\
  android.intent.action.MAIN\" />\n        <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n    </intent-filter>\n</activity>\n```\n\n### 72.2 添加画中画按钮\n\n目前的设计中，VideoPlayer\
  \ Activity 的布局仅包含 `VideoView` 实例。现在要在布局中添加按钮以切换到 PiP 模式。加载 `activity_main.xml` 文件到布局编辑器，从调色板拖出一个\
  \ `Button` 对象到布局中，使其位置如图 72-1 所示。\n\n\n\n\n\n现在必须将 `enterPipMode` onClick 回调方法添加到\
  \ `MainActivity.java` 类文件中。找到该文件，在代码编辑器中打开它并添加如下方法：\n\n```java\nimport android.app.PictureInPictureParams;\n\
  import android.util.Rational;\n\npublic void enterPipMode(View view) {\n    Rational\
  \ rational = new Rational(binding.videoView1.getWidth(),\n            binding.videoView1.getHeight());\n\
  \    PictureInPictureParams params =\n            new PictureInPictureParams.Builder()\n\
  \                    .setAspectRatio(rational)\n                    .build();\n\
  \    binding.pipButton.setVisibility(View.INVISIBLE);\n    binding.videoView1.setMediaController(null);\n\
  \    enterPictureInPictureMode(params);\n}\n```\n\n该方法首先获取 `Button` 视图的引用，然后创建一个包含\
  \ `VideoView` 宽度和高度的 `Rational` 对象。接着使用 `PictureInPictureParams.Builder` 创建一组画中画参数，并将\
  \ `Rational` 对象作为视频播放的宽高比例传递。由于按钮在视频处于画中画（PiP）模式时不需要显示，因此将其将其设置为不可。。视频播放控件也被隐藏，这样视频视图在画中画模式下将不会被遮挡。\n\
  \n在运行 Android 版本 8 或更高版本的设备或模拟器上编译并运行应用，在点击画中画按钮之前等待视频播放开始。视频播放将最小化并显示在画中画窗口中，所示：\n\
  \n![](img/as_video_pip_window.jpg)\n\n图 72-2\n\n点击画中画窗口，然后点击窗口中心出现的全屏模式标记处。尽管 Activity\
  \ 回到了全屏模式，但按钮和媒体播放控件仍然保持隐藏。\n\n显然，必须向项目中添加一些代码，以检测 Activity 内部发生画中画模式变化的情况。\n\n\
  ## 72.4 检测画中画模式的变化\n\n如上一章所述，画中画模式的变化是通过重写受影响 Activity 内部的 `onPictureInPictureModeChanged()`\
  \ 方法来检测的。在这种情况下，必须编写该方法来检测 Activity 是正在进入还是退出画中画模式，并采取适当的操作重新激活画中画按钮和播放控件。继续留在 `MainActivity.java`\
  \ 文件中，现在添加此方法：\n\n```java\n@Override\npublic void onPictureInPictureModeChanged(boolean\
  \ isInPictureInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \    if (isInPictureInPictureMode) {\n    } else {\n        binding.pipButton.setVisibility(View.VISIBLE);\n\
  \        binding.videoView1.setMediaController(mediaController);\n    }\n}\n```\n\
  \n当调用该方法时，会传入一个 `Boolean` 值，指示 Activity 现在是否处于画中画模式。上述方法中的代码检查此值以决定是否显示画中画按钮以及重新激活播放控件。\n\
  \n### 72.5 添加广播接收器（Broadcast Receiver）\n\n项目的最后一步是为画中画添加一个操作。该操作的目的是显示包含当前播放视频名称的\
  \ `Toast` 消息。需要在画中画窗口和 Activity 之间进行通信。实现这一目标的最简单方法之一是在 Activity 内部实现 `broadcast\
  \ receiver`，并使用 `pending intent` 从画中画窗口向 Activity 广播消息。每次 Activity 进入画中画模式时，都必须执行这些步骤，因此必须在\
  \ `onPictureInPictureModeChanged()` 方法中添加代码。现在找到该方法，并开始添加一些代码来创建意过滤器并初始化 `broadcast\
  \ receiver`：\n\n```java\nimport android.content.BroadcastReceiver;\nimport android.content.Context;\n\
  import android.content.Intent;\nimport android.content.IntentFilter;\nimport android.widget.Toast;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private BroadcastReceiver\
  \ receiver;\n\n    @Override\n    public void onPictureInPictureModeChanged(boolean\
  \ isInPictureInPictureMode) {\n        super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \        if (isInPictureInPictureMode) {\n            IntentFilter filter = new\
  \ IntentFilter();\n            filter.addAction(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n            receiver = new BroadcastReceiver() {\n                @Override\n\
  \                public void onReceive(Context context, Intent intent) {\n     \
  \               Toast.makeText(context, \"Favorite Movie\", Toast.LENGTH_LONG).show();\n\
  \                }\n            };\n            registerReceiver(receiver, filter,\
  \ Context.RECEIVER_EXPORTED);\n        } else {\n            binding.pipButton.setVisibility(View.VISIBLE);\n\
  \            binding.videoView1.setMediaController(mediaController);\n         \
  \   if (receiver != null) {\n                unregisterReceiver(receiver);\n   \
  \         }\n        }\n    }\n}\n```\n\n## 72.6 添加画中画操作\n\n实现广播接收器后，下一步是创建一个 `RemoteAction`\
  \ 对象，并配置一个图像来表示画中画窗口中的操作。对于此示例，将使用名为 `ic_info_24dp.xml` 的图像文件。该文件可以在从以下 URL 下载的源码\
  \ `project_icons` 文件夹中找到：https://www.ebookfrenzy.com/retail/giraffejava/index.php\n\
  \n找到此图标文件，将其复制并粘贴到项目工具窗口 `app -> res -> drawables` 文件夹中：\n\n![](img/as_video_pip_icon_added.jpg)\n\
  \n图 72-3\n\n下一步是创建一个发送给广播接收器的 `Intent`。然后，该意图需要封装在 `PendingIntent` 对象中，以便在用户点击画中画窗口中的按钮时触发该意图。编辑\
  \ `MainActivity.java` 文件，添加创建 `Intent` 和 `PendingIntent` 对象的方法：\n\n```java\nimport\
  \ android.app.PendingIntent;\nimport static android.app.PendingIntent.FLAG_IMMUTABLE;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private static final\
  \ int REQUEST_CODE = 101;\n\n    private void createPipAction() {\n        Intent\
  \ actionIntent = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\");\n     \
  \   final PendingIntent pendingIntent = PendingIntent.getBroadcast(MainActivity.this,\n\
  \                REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n    }\n}\n```\n\n\
  现在有了 `Intent` 对象及其包含的 `PendingIntent` 实例，需要创建一个 `RemoteAction` 对象，包含显示在画中画窗口中的图标和\
  \ `PendingIntent` 对象。继续留在 `createPipAction()` 方法中，添加如下代码：\n\n```java\nimport android.app.RemoteAction;\n\
  import android.graphics.drawable.Icon;\nimport java.util.ArrayList;\n\nprivate void\
  \ createPipAction() {\n    ArrayList<RemoteAction> actions = new ArrayList<>();\n\
  \    Intent actionIntent = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n    final PendingIntent pendingIntent = PendingIntent.getBroadcast(MainActivity.this,\n\
  \            REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n    final Icon icon =\
  \ Icon.createWithResource(MainActivity.this,\n            R.drawable.ic_info_24dp);\n\
  \    RemoteAction remoteAction = new RemoteAction(icon, \"Info\",\n            \"\
  Video Info\", pendingIntent);\n    actions.add(remoteAction);\n}\n```\n\n现在需要创建一个包含该操作的\
  \ `PictureInPictureParams` 对象，并应用这些参数，以便该操作在画中画窗口中显示：\n\n```java\nprivate void createPipAction()\
  \ {\n    ArrayList<RemoteAction> actions = new ArrayList<>();\n    Intent actionIntent\
  \ = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\");\n}\n```\n\n\n\n\n\n\
  ```java\nfinal PendingIntent pendingIntent =\n    PendingIntent.getBroadcast(MainActivity.this,\n\
  \            REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\nfinal Icon icon =\n \
  \       Icon.createWithResource(MainActivity.this,\n            R.drawable.ic_info_24dp);\n\
  RemoteAction remoteAction = new RemoteAction(icon, \"Info\",\n        \"Video Info\"\
  , pendingIntent);\nactions.add(remoteAction);\nPictureInPictureParams params =\n\
  \        new PictureInPictureParams.Builder()\n            .setActions(actions)\n\
  \            .build();\nsetPictureInPictureParams(params);\n}\n```\n\n在测试操作前的最后一个任务是在\
  \ Activity 进入 PiP 模式时调用 `createPipAction()` 方法：\n\n```java\n@Override\npublic void\
  \ onPictureInPictureModeChanged(boolean isInPictureInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  .\n.\n    registerReceiver(receiver, filter);\n    createPipAction();\n} else {\n\
  \    binding.pipButton.setVisibility(View.VISIBLE);\n    binding.videoView1.setMediaController(mediaController);\n\
  .\n}\n```\n\n## 72.7 测试画中画操作\n\n重新运行应用并将 Activity 置于 PiP 模式。点击 PiP 窗口以显示新的操作按钮，如图\
  \ 72-4 所示：\n\n![](img/as_video_pip_with_actions.jpg)\n\n图 72-4\n\n点击操作按钮并等待 `Toast`\
  \ 消息出现，该消息将显示视频名称：\n\n![](img/as_video_pip_toast.jpg)\n\n图 72-5\n\n### 72.8 总结\n\
  \n本章演示了如何在 Android Studio 应用程序项目中添加画中画支持，包括启用和进入 PiP 模式以及实现 PiP 操作。这包含了使用广播接收器和等待意图（pending\
  \ intents）来实现 PiP 窗口与 Activity 之间的通信。\n\n# 73. 使用 MediaPlayer 和 MediaRecorder 进行\
  \ Android 音频录制和播放\n\n本章将概述 `MediaRecorder` 类，并解释如何使用该类录制音频或视频。还将涵盖使用 `MediaPlayer`\
  \ 类播放音频的内容。在介绍基础知识后，将创建一个示例应用程序来演示这些技术。除了处理音频和视频外，本章还将涉及将文件保存到 SD 卡。\n\n### 73.1\
  \ 播放音频\n\n在音频播放方面，大多数 Android 实现支持 AAC LC/LTP、HE-AACv1 (AAC+)、HE-AACv2 (enhanced\
  \ AAC+)、AMR-NB、AMR-WB、MP3、MIDI、Ogg Vorbis 和 PCM/WAVE 格式。\n\n可以使用 `MediaPlayer` 或\
  \ `AudioTrack` 类执行音频播放。`AudioTrack` 是更高级的选项，它使用流媒体缓冲区并对音频提供更强的控制。相比之下，`MediaPlayer`\
  \ 类为实现音频播放提供了更简单的编程接口，能够满足大多数音频需求。\n\n`MediaPlayer` 类有一系列关联的方法，应用程序可以通过这些方法来执行特定任务。该类一些关键方法的子集如下：\n\
  \n* `create()` – 调用以创建类的新实例，并传递要播放音频的 `Uri`。\n* `setDataSource()` – 设置音频播放的源。\n\
  * `prepare()` – 指令播放器准备开始播放。\n* `start()` – 开始播放。\n* `pause()` – 暂停播放。可以通过调用 `resume()`\
  \ 方法恢复播放。\n* `stop()` – 停止播放。\n* `setVolume()` – 接受两个浮点参数，指定左右声道的播放音量。\n* `resume()`\
  \ – 恢复之前暂停的播放会话。\n* `reset()` – 重置媒体播放器实例的状态。本质上是将实例置回未初始化状态。至少，重置后的播放器需要重新设置数据源并调用\
  \ `prepare()` 方法。\n* `release()` – 在播放器实例不再需要时调用。此方法确保播放器持有的任何资源都会被释放。\n\n在典型的实现中，应用程序将实例化\
  \ `MediaPlayer` 类的实例，设置要播放的音频源，然后调用 `prepare()` 接着调用 `start()`。例如：\n\n```java\n\
  MediaPlayer mediaPlayer = new MediaPlayer();\nmediaPlayer.setDataSource(\"https://www.yourcompany.com/myaudio.mp3\"\
  );\nmediaPlayer.prepare();\nmediaPlayer.start();\n```\n\n## 73.2 使用 MediaRecorder\
  \ 类录制音频和视频\n\n与音频播放一样，录制可以使用几种不同的技术完成。其中一种方案是使用 `MediaRecorder` 类，与 `MediaPlayer`\
  \ 类一样，它提供了几个用于录制音频的方法：\n\n* `setAudioSource()` – 指定要录制的音频源（通常对于设备麦克风，这将是 `MediaRecorder.AudioSource.MIC`）。\n\
  * `setVideoSource()` – 指定要录制的视频源（例如 `MediaRecorder.VideoSource.CAMERA`）。\n* `setOutputFormat()`\
  \ – 指定录制的音频或视频存储的格式（例如 `MediaRecorder.OutputFormat.AAC_ADTS`）。\n* `setAudioEncoder()`\
  \ – 指定录制音频的音频编码器（例如 `MediaRecorder.AudioEncoder.AAC`）。\n* `setOutputFile()` – 配置存储录制音频或视频的文件路径。\n\
  * `prepare()` – 准备 `MediaRecorder` 实例开始录制。\n* `start()` – 开始录制过程。\n* `stop()` –\
  \ 停止录制过程。录制器停止后，需要重新配置并准备后再次启动。\n* `reset()` – 重置录制器。实例需要重新配置并准备后再次启动。\n* `release()`\
  \ – 在录制器实例不再需要时调用。此方法确保释放实例持有的所有资源。\n\n使用该类的典型实现将设置源、输出、编码和输出文件。然后调用 `prepare()`\
  \ 和 `start()` 方法。录制结束时调用 `stop()` 方法，随后调用 `reset()` 方法。当应用程序不再需要录制器时，建议调用 `release()`\
  \ 方法：\n\n```java\nMediaRecorder mediaRecorder = new MediaRecorder();\nmediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  mediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.AAC_ADTS);\nmediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);\n\
  mediaRecorder.setOutputFile(audioFilePath);\nmediaRecorder.prepare();\nmediaRecorder.start();\n\
  // ... 停止逻辑 ...\nmediaRecorder.release();\n```\n\n为了录制音频，应用程序的清单文件必须包含 `android.permission.RECORD_AUDIO`\
  \ 权限：\n\n```xml\n<uses-permission android:name=\"android.permission.RECORD_AUDIO\"\
  \ />\n```\n\n如“在 Android 中请求运行时权限”章节中所述，访问麦克风属于危险权限。因此，为了支持 Android 6，在应用程序启动时也必须请求麦克风访问，其步骤将在本章稍后介绍。\n\
  \n## 73.3 关于示例项目\n\n本章的剩余部分将创建一个示例应用程序，演示如何使用 `MediaPlayer` 和 `MediaRecorder` 类在\
  \ Android 设备上实现音频录制和播放。\n\n在开发使用特定硬件功能的应用程序时（以麦克风为例），在尝试通过应用程序代码访问它之前检查该功能的可用性是重要的。因此，本章创建的应用程序还将包含检测设备是否存在麦克风的代码。\n\
  \n\n\n\n\n完成后，此应用程序将提供一个直观的界面，允许用户录制和播放音频。录制的音频将存储在设备上的一个音频文件中。尽管如此，本教程还将简要探讨使用\
  \ SD 卡存储的机制。\n\n### 73.4 创建 AudioApp 项目\n\n从欢迎界面选择 `New Project` 选项，在出现的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `AudioApp`，并指定 `com.ebookfrenzy.audioapp`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 31`（Android 12.0），并将 `Language`\
  \ 菜单设置为 `Java`。按照章节 11.8 Migrating a Project to View Binding 中概述的步骤为项目添加视图 绑定支持。\n\
  \n### 73.5 设计用户界面\n\n创建新项目后，从 Project 工具窗口中选择 `activity_main.xml` 文件，并在 Design 模式下的\
  \ Layout 编辑器中，选择“Hello World!” `TextView` 并将其从布局中删除。\n\n将三个 `Button` 视图拖放到布局中。按钮的定位对于本示例来说并不重要，但图\
  \ 73-1 显示了使用垂直链的建议布局。\n\n配置按钮以显示读取 Play（播放）、Record（录制）和 Stop（停止）的字符串资源，并分别为它们赋予视图\
  \ ID `playButton`、`recordButton` 和 `stopButton`。\n\n选择 `Play` 按钮，并在 `Attributes`\
  \ 面板中配置 `onClick` 属性，以便用户时调用名为 `playAudio` 的方法。重复这些步骤配置剩余按钮分别调用名为 `recordAudio`\
  \ 和 `stopAudio` 的方法。\n\n![](img/as_audio_app_ui.jpg)\n\n图 73-1\n\n### 73.6 检查麦克风可用性\n\
  \n在没有麦克风的设备上尝试录制音频会导致 Android 系统抛出异常。因此，在进行此类尝试之前检查麦克风的存在至关重要。有几种方法可以实现这一点，包括检查设备的物理存在。一种更简单且更有可能在不同\
  \ Android 设备上运行的方法是询问 Android 系统是否安装了针对特定功能的包。这涉及创建一个 `PackageManager` 类的实例，然后调用对象的\
  \ `hasSystemFeature()` 方法。`PackageManager.FEATURE_MICROPHONE` 是此例中感兴趣的功能。\n\n对于此示例，我们将创建一个名为\
  \ `hasMicrophone()` 的方法，可以调用该方法来检查麦克风的存在。在 Project 工具窗口中，找到并双击 `MainActivity.java`\
  \ 文件并修改它以添加此方法：\n\n```java\npackage com.ebookfrenzy.audioapp;\n\n.\n.\nimport android.content.pm.PackageManager;\n\
  \n.\n.\n\npublic class MainActivity extends AppCompatActivity {\n.\n.\n    protected\
  \ boolean hasMicrophone() {\n        PackageManager pmanager = this.getPackageManager();\n\
  \        return pmanager.hasSystemFeature(\n                PackageManager.FEATURE_MICROPHONE);\n\
  \    }\n}\n```\n\n## 73.7 初始化 Activity\n\n下一步是修改 activity 以执行几项初始化任务。在保留 `MainActivity.java`\
  \ 文件中，如下所示修改代码：\n\n```java\npackage com.ebookfrenzy.audioapp;\n\nimport java.io.File;\n\
  import java.io.IOException;\nimport androidx.annotation.NonNull;\nimport android.media.MediaRecorder;\n\
  import android.os.Environment;\nimport android.media.MediaPlayer; \n.\n.\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private static MediaRecorder mediaRecorder;\n    private static\
  \ MediaPlayer mediaPlayer;\n    private static String audioFilePath;\n    private\
  \ boolean isRecording = false;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        binding\
  \ = ActivityMainBinding.inflate(getLayoutInflater());\n        View view = binding.getRoot();\n\
  \        setContentView(view);\n        audioSetup();\n    }\n\n    private void\
  \ audioSetup() {\n        if (!hasMicrophone()) {\n            binding.stopButton.setEnabled(false);\n\
  \            binding.playButton.setEnabled(false);\n            binding.recordButton.setEnabled(false);\n\
  \        } else {\n            binding.playButton.setEnabled(false);\n         \
  \   binding.stopButton.setEnabled(false);\n        }\n        File audioFile = new\
  \ File(this.getFilesDir(), \"audio.mp3\");\n        audioFilePath = audioFile.getAbsolutePath();\n\
  \    }\n.\n```\n\n新增的代码调用 `hasMicrophone()` 方法来确定设备是否包含麦克风。如果不包含，则所有按钮都被禁用；否则，仅禁用\
  \ Stop 和 Play 按钮。下一行代码需要稍微解释：`File audioFile = new File(this.getFilesDir(), \"audio.mp3\"\
  ); audioFilePath = audioFile.getAbsolutePath();` 这段代码在应用的内部存储器中创建一个名为 `audio.mp3`\
  \ 的新文件以存储音频。\n\n## 73.8 实现 recordAudio() 方法\n\n当用户触摸 Record 按钮时，将调用 `recordAudio()`\
  \ 方法。此方法需要开启关闭相应的按钮，并配置 `MediaRecorder` 实例，提供音频源、输出格式以及要存储音频的位置信息。最后，需要调用 `MediaRecorder`\
  \ 对象的 `prepare()` 和 `start()` 方法。这些要求共同构成了 `MainActivity.java` 文件中的以下方法：\n\n```java\n\
  public void recordAudio (View view) {\n    isRecording = true;\n    binding.stopButton.setEnabled(true);\n\
  \    binding.playButton.setEnabled(false);\n    binding.recordButton.setEnabled(false);\n\
  \    try {\n        mediaRecorder = new MediaRecorder(this);\n        mediaRecorder.setAudioSource(MediaRecorder.MIC);\n\
  \        mediaRecorder.setOutputFormat(MediaRecorder.THREE_GPP);\n        mediaRecorder.setOutputFile(audioFilePath);\n\
  \        mediaRecorder.setAudioEncoder(MediaRecorder.AMR_NB);\n        mediaRecorder.prepare();\n\
  \    } catch (Exception e) {\n        e.printStackTrace();\n    }\n    mediaRecorder.start();\n\
  }\n```\n\n## 73.9 实现 stopAudio() 方法\n\n`stopAudio()` 方法在启用 Play 按钮的同时关闭 Stop，并重置\
  \ `MediaRecorder` 实例。实现此目的的代码如下所示，并应添加到 `MainActivity.java` 文件中：\n\n```java\npublic\
  \ void stopAudio (View view) {\n    binding.stopButton.setEnabled(false);\n    binding.playButton.setEnabled(true);\n\
  \    if (isRecording) {\n        binding.recordButton.setEnabled(false);\n     \
  \   mediaRecorder.stop();\n        mediaRecorder.release();\n        mediaRecorder\
  \ = null;\n        isRecording = false;\n    } else {\n        mediaPlayer.release();\n\
  \        mediaPlayer = null;\n        binding.recordButton.setEnabled(true);\n \
  \   }\n}\n```\n\n## 73.10 实现 playAudio() 方法\n\n`playAudio()` 方法将创建一个新的 `MediaPlayer`\
  \ 实例，将 SD 卡上的音频文件作为数据源，然后准备并开始播放：\n\n```java\npublic void playAudio (View view)\
  \ throws IOException {\n    binding.playButton.setEnabled(false);\n    binding.recordButton.setEnabled(false);\n\
  \    binding.stopButton.setEnabled(true);\n    mediaPlayer = new MediaPlayer();\n\
  \    mediaPlayer.setDataSource(audioFilePath);\n    mediaPlayer.prepare();\n   \
  \ mediaPlayer.start();\n}\n```\n\n## 73.11 配置并请求权限\n\n\n\n\n\n在测试应用程序之前，必须在应用程序的清单文件中请求适当权限。具体而言，该应用程序将需要访问麦克风的权限。在\
  \ Project 工具窗口中，找到并双击 `AndroidManifest.xml` 文件，将其加载到编辑器中并修改 XML 以添加权限标签：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\">\n    <uses-permission android:name=\"\
  android.permission.RECORD_AUDIO\" />\n    <application\n.\n.\n```\n\n上述步骤将足以确保用户在运行\
  \ Android 6.0 之前版本的设备上安装该应用时，用户会启用麦克风访问权限。在 Android 中，麦克风访问被归类为“危险权限”，因为它允许应用程序损害用户的隐私。为了让示例程序在\
  \ Android 6 或更高版本的设备上运行，需要添加代码在应用运行时请求权限。\n\n编辑 `MainActivity.java` 文件，首先添加一些额外的导入指令和一个常量，用作所请求权限的请求标识码：\n\
  \n```java\n.\n.\nimport androidx.core.app.ActivityCompat;\nimport androidx.core.content.ContextCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\n.\n.\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final int RECORD_REQUEST_CODE\
  \ = 101;\n.\n.\n```\n\n接下来，需要在类中添加一个方法，其目的是将要请求的权限和相应的请求标识码作为参数。在 `MainActivity.java`\
  \ 类文件中，按照如下方式实现该方法：\n\n```java\nprotected void requestPermission(String permissionType,\
  \ int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \            permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        ActivityCompat.requestPermissions(this,\n                new String[]{permissionType},\
  \ requestCode\n        );\n    }\n}\n```\n\n使用本书在 Android 中发起运行时权限请求章节概述的步骤，上述方法在发出请求之前验证指定的权限是否已经授予，并将标识码作为参数传递。\n\
  \n当请求处理完成后，活动上将调用 `onRequestPermissionsResult()` 方法，并传递标识码和请求结果。因此，下一步是在 `MainActivity.java`\
  \ 文件中按如下方式实现此方法：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode,\n        @NonNull String[] permissions, @NonNull int[] grantResults)\
  \ {\n    super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    if (requestCode == RECORD_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0\n                || grantResults[0] !=\n                PackageManager.PERMISSION_GRANTED)\
  \ {\n            binding.recordButton.setEnabled(false);\n            Toast.makeText(this,\n\
  \                    \"Record permission required\",\n                    Toast.LENGTH_LONG).show();\n\
  \        }\n    }\n}\n```\n\n上述代码检查请求标识码以识别是哪一个权限请求返回的结果，然后再检查相应的权限是否已授予。如果权限被拒绝，将向用户显示消息，指示应用程序将无法运行且录音按钮将被禁用。\n\
  \n在测试应用之前，最后剩下的工作是在应用程序启动时调用新添加的用于麦克风访问的 `requestPermission()` 方法。在 `MainActivity.java`\
  \ 文件中，按如下方式修改 `audioSetup()` 方法：\n\n```java\nprivate void audioSetup(){\n    binding.recordButton\
  \ = findViewById(R.id.recordButton);\n    binding.playButton = findViewById(R.id.playButton);\n\
  \    binding.stopButton = findViewById(R.id.stopButton);\n    if (!hasMicrophone())\
  \ {\n        binding.recordButton.setEnabled(false);\n        binding.playButton.setEnabled(false);\n\
  \        binding.stopButton.setEnabled(false);\n    } else {\n        binding.recordButton.setEnabled(true);\n\
  \        binding.playButton.setEnabled(false);\n        binding.stopButton.setEnabled(false);\n\
  \    }\n}\n```\n\n### 73.12 测试应用程序\n在带有麦克风的 Android 设备上编译并运行应用程序，允许访问麦克风，并点击 Record\
  \ 按钮。录音后，触摸 Stop，然后点击 Play。录制的音频应通过通过设备扬声器播放。\n\n### 73.13 总结\nAndroid SDK 提供了几种实现录制和播放的机制。本章介绍了了其中两种：`MediaPlayer`\
  \ 和 `MediaRecorder`。在涵盖了使用这些工具的理论后，本章通过创建一个设计用于录制后回放的示例进行了演示。在 Android 中处理音频时，本章还查看了确保运行应用程序的设备具有麦克风的步骤。\n\
  \n### 74. 在 Android Studio 中使用 Google Maps API\n当 Google 在许多年前推出地图服务时，很难说他们是否曾预见到过会有一个可以集成到应用程序中的版本。当\
  \ 2005 年推出最终成为 Google Maps 的第一个 Web 版本时，iPhone 尚未引发智能手机革命，而 Google 在此六个月后才收购了那家开发\
  \ Android 操作系统的公司。无论 Google 对 Google Maps 的未来抱有怎样的愿景，考虑到现在 Google Maps 的所有功能都可以通过\
  \ Android 应用程序直接访问，这是非常了不起的。\n\n本章旨在提供 Google Maps 系统和 Google Maps Android API 的概述。本章将提供组成\
  \ API 的不同元素的概述，详细说明配置开发环境以使用 Google Maps 的步骤，然后通过一些代码示例演示 Google Maps 集成的基础知识。\n\
  \n### 74.1 Google Maps API 的元素\nGoogle Maps Android API 由一组核心类组成，为 Android 应用程序提供地图功能。地图的关键元素如下：\n\
  \n- `GoogleMap`: Google Maps Android API 的主类。该类负责下载和显示地图瓦片，以及显示和响应地图控件。`GoogleMap`\
  \ 对象不是由应用程序直接创建，而是在创建 `MapView` 或 `MapFragment` 实例时创建的。可以通过调用 `MapView`、`MapFragment`\
  \ 或 `SupportMapFragment` 实例的 `getMap()` 方法获取 `GoogleMap` 对象的引用。\n- `MapView`: `View`\
  \ 类的子类，该类提供了画布，`GoogleMap` 对象在其上绘制地图，允许在活动的用户界面布局中放置地图。\n- `SupportMapFragment`:\
  \ `Fragment` 类的子类，该类允许在 Android 布局的 Fragment 中放置地图。\n\n\n\n\n\n- **Marker（标记）**\
  \ – `Marker` 类的目的是允许在地图上标记位置。通过获取与地图关联的 `GoogleMap` 对象的引用，然后调用该对象实例的 `addMarker()`\
  \ 方法即可将标记添加到地图。标记的位置通过 `Longitude`（经度）和 `Latitude`（纬度）定义。标记可以通过多种方式进行配置，包括指定标题、文本和图标。标记还可以是“可拖拽的”，允许用户将标记移动到地图上的不同位置。\n\
  - **Shapes（形状）** – 使用 `Polyline`（折线）、`Polygon`（多边形）和 `Circle`（圆形）类可以在地图上绘制线条和形状。\n\
  - **UiSettings（UI 设置）** – `UiSettings` 类自定义地图上显示的控件。例如，使用 `UiSettings`，应用程序控制地图上是否显示缩放、当前位置和指南针控件。该类还可以配置地图识别哪些触摸手势。\n\
  - **My Location Layer（我的位置层）** – 启用后，我的位置层会在地图上显示一个按钮，用户选择该按钮会将地图中心置到用户当前的地理位置。如果用户处于静止状态，蓝色标记将代表地图上的该位置。如果用户正在移动，则用一个指示用户移动方向的箭头来表示该位置。\n\
  \n熟悉 Google Maps Android API 的最佳方法是运行一个示例。本章的剩余部分将创建一个基于 Google Maps 的应用程序，同时突出\
  \ API 的关键领域。\n\n### 74.2 创建 Google Maps 项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，并在生成的新项目对话框中点击\
  \ `Next`（下一步）按钮之前选择 `No Activity`（无活动）模板。\n\n在 `Name`（名称）字段中输入 `MapDemo`，并指定 `com.ebookfrenzy.mapdemo`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置改为 `API 26`：Android\
  \ 8.0 (Oreo)，并将 `Language`（语言）菜单设置为 `Java`。\n\n接下来，在项目窗口中右键点击 `app` -> `java` ->\
  \ `com.ebookfrenzy.mapdemo` 条目，选择 `New`（新建） -> `Google` -> `Google Maps Views Activity`\
  \ 菜单选项。最后，在点击 `Finish` 按钮之前，勾选并启用 `Launcher Activity`（启动活动）复选框：\n\n![](img/as_map_activity.jpg)\n\
  图 74-1\n\n## 74.3 创建 Google Cloud 结算账户\n\n在使用 Google Map APIs 之前，你必须创建一个 Google\
  \ Cloud 结算账户（如果你已经有一个，可以跳到下一节）。要执行此操作，请打开浏览器并使用以下链接导航到 Google Cloud 控制台：\n\n`https://console.cloud.google.com/`\n\
  \n接下来，点击控制台页面左上角的菜单按钮，并如[图 74-2]所示选择 `Billing`（结算）条目：\n\n![](img/google_cloud_billing.jpg)\n\
  图 74-2\n\n在 `Billing`（结算）页面，选择添加新结算账户的选项，然后按照步骤开始免费试用。你必须提供信用卡来开账户，但在免费试用结束且未经你同意的情况下，Google\
  \ 不会收取费用。\n\n### 74.4 创建新的 Google Cloud 项目\n\n下一步是创建一个与 `MapDemo` 应用程序关联的 Google\
  \ Cloud 项目。要执行此操作，请使用以下 URL 返回 Google Cloud 控制台仪表板：\n\n`https://console.cloud.google.com/home/dashboard`\n\
  \n在仪表板中，点击位于顶部栏的 `Select a project`（选择项目）按钮：\n\n![](img/google_cloud_select_project.jpg)\n\
  图 74-3\n\n当项目选择对话框出现时，点击 `New Project`（新建项目）按钮（如[图 74-4]高所示）：\n\n![](img/google_cloud_new_project_button.jpg)\n\
  图 74-4\n\n当新项目屏幕出现时，为项目提供一个名称。控制台将在项目名称字段下方显示项目的默认 `id`。如果你不喜欢默认的 `id`，可以点击 `Edit`（编辑）按钮来更改它：\n\
  \n![](img/google_cloud_new_project_dialog.jpg)\n图 74-5\n\n点击 `Create`（创建）按钮，稍等片刻，你将返回仪表板，你的新项目将列在其中。\n\
  \n### 74.5 启用 Google Maps SDK\n\n现在我们已经创建了新的 Google Cloud 项目，下一步是允许该项目使用 Google\
  \ Maps SDK。要启用 Google Maps 支持，请在 Google Cloud 控制台中选择你的项目，点击左上角的菜单按钮，并选择 `Google\
  \ Maps Platform` 条目。然后，从生成的菜单中，如[图 74-6]所示选择 `APIs` 选项：\n\n![](img/google_cloud_maps_apis_menu.jpg)\n\
  图 74-6\n\n在 `APIs` 屏幕上，点击 `Maps SDK for Android`选项，并在生成的屏幕上点击 `Enable`（启用）按钮：\n\n\
  ![](img/google_cloud_enable_maps.jpg)\n图 74-7\n\n重复上述步骤以启用 `Geocoding API`（地理编码\
  \ API）凭据，本章稍后部分将需要它来允许我们的应用程序显示用户的当前位置。\n\n一旦启用了项目的所需的凭据，点击后退箭头返回产品详情页，为下一步做准备。\n\
  \n## 74.6 生成 Google Maps API 密钥\n\n在应用程序可以使用 Google Maps Android SDK 之前，必须配置 API\
  \ 密钥以与 Maps Google Cloud 项目关联。要生成 API 密钥，选择 `Credentials`（凭据）选项（如[图 74-8]所示），然后点击\
  \ `Create Credentials`（创建凭据）按钮（B）：\n\n![](img/google_cloud_credentials.jpg)\n图 74-8\n\
  \n凭据创建后，将出现显示 API 密钥的对话框：\n\n![](img/console_api_key_created.jpg)\n图 74-9\n\n##\
  \ 74.7 为 Android Studio 添加 API 密钥\n\n现在我们已经生成了允许应用程序使用 Google Maps SDK 的 API 密钥，必须将其添加到项目中。返回\
  \ Android Studio，编辑 `AndroidManifest.xml` 文件并定位 API 密钥项，内容如下：\n\n```xml\n<meta-data\n\
  \    android:name=\"com.google.android.geo.API_KEY\"\n    android:value=\"YOUR_API_KEY\"\
  \ />\n```\n\n删除文本 `YOUR_API_KEY` 并将其替换。\n\n接下来，编辑 `Gradle Scripts` -> `local.properties`\
  \ 文件，并添加如下行（用项目的 API 密钥替换 `YOUR_API_KEY`）：\n\n```\nMAPS_API_KEY=YOUR_API_KEY\n```\n\
  \n### 74.8 测试应用程序\n\n运行应用程序以验证 API 密钥配置正确。如果配置正确，应用程序将运行并在屏幕上显示地图。\n\n如果未显示地图，请检查以下区域：\n\
  \n- 如果应用程序运行在模拟器上，请确保模拟器运行包含 Google APIs 的 Android 版本。可以通过选择 `Tools` -> `Android`\
  \ -> `AVD Manager` 菜单选项更改 AVD 配置的操作系统，点击 Actions 列中的铅笔图标，然后点击当前 Android 版本旁 `Change…`\
  \ 按钮。在系统映像对话框中选择包含 Google APIs 的目标。\n- 检查 `Logcat` 输出是否有任何与 Google Maps API 身份验证有关的内容。这通常意味着\
  \ API 密钥输入错误。确保 `AndroidManifest.xml` 和 `local.properties` 文件中的 API 密钥与 Google Cloud\
  \ 控制台中生成的密钥匹配。\n\n## 74.9 理解地理编码和反向地理编码\n\n在不讨论地图和地理位置之前，必须先涵盖地理编码主题。地理编码是将基于文本的地理位置（例如街道地址）转换为以经度和纬度表示的地理坐标。\n\
  \n\n\n\n地理编码可以使用 Android 的 `Geocoder` 类来实现。例如，可以向 `Geocoder` 类的实例传递一个表示位置的字符串，例如城市名称、街道地址或机场代码。`Geocoder`\
  \ 将尝试查找该位置的匹配项，并返回一个可能与该位置字符串匹配的 `Address` 对象列表，这些对象按匹配程度排序，最接近的匹配项位于列表的第 0 位。随后可以从\
  \ `Address` 对象中提取各种信息，包括潜在匹配项的经纬度。\n\n例如，以下代码请求位于华盛顿特区的美国国家航天博物馆的位置信息：\n\n```java\n\
  import java.io.IOException;\nimport java.util.List;\nimport android.location.Address;\n\
  import android.location.Geocoder;\n\n// ... dots ...\n\ndouble latitude;\ndouble\
  \ longitude;\nList<Address> geocodeMatches = null;\n\ntry {\n    geocodeMatches\
  \ =\n        new Geocoder(this).getFromLocationName(\n            \"600 Independence\
  \ Ave SW, Washington, DC 20560\", 1);\n} catch (IOException e) {\n    // TODO Auto-generated\
  \ catch block\n    e.printStackTrace();\n}\n\nif (!geocodeMatches.isEmpty()) {\n\
  \    latitude = geocodeMatches.get(0).getLatitude();\n    longitude = geocodeMatches.get(0).getLongitude();\n\
  }\n```\n\n注意，值 `1` 作为第二个参数传递给 `getFromLocationName()` 方法。这告诉 `Geocoder` 在数组中只返回一个结果。鉴于所提供的地址具有特定性，应该只有一个潜在的匹配项。然而，对于较模糊的位置名称，可能需要请求更多的潜在匹配项并允许用户选择正确的那个。\n\
  \n上面的代码是正向地理编码的示例，即其坐标是基于文本位置描述计算的。反向地理编码正如顾名思义，涉及将地理坐标翻译为人类可读的地址字符串。例如，考虑以下代码：\n\
  \n```java\nimport java.io.IOException;\nimport java.util.List;\nimport android.location.Address;\n\
  import android.location.Geocoder;\n\n// ... dots ...\n\nList<Address> geocodeMatches\
  \ = null;\nString Address1;\nString Address2;\nString State;\nString Zipcode;\n\
  String Country;\n\ntry {\n    geocodeMatches =\n        new Geocoder(this).getFromLocation(38.8874245,\
  \ -77.0200729, 1);\n} catch (IOException e) {\n    // TODO Auto-generated catch\
  \ block\n    e.printStackTrace();\n}\n\nif (!geocodeMatches.isEmpty()) {\n    Address1\
  \ = geocodeMatches.get(0).getAddressLine(0);\n    Address2 = geocodeMatches.get(0).getAddressLine(1);\n\
  \    State = geocodeMatches.get(0).getAdminArea();\n    Zipcode = geocodeMatches.get(0).getPostalCode();\n\
  \    Country = geocodeMatches.get(0).getCountryName();\n}\n```\n\n`Geocoder` 对象通过\
  \ `getFromLocation()` 方法使用经纬度值进行初始化。再次，仅请求了单个匹配结果。然后从生成的 `Address` 对象中提取基于文本的地址信息。\n\
  \n地理编码并不是在 Android 设备上执行的，而是在需要翻译时设备连接的服务器上执行，并在翻译完成后返回结果。只有当设备具有活跃的互联网连接时，才能进行地理编码。\n\
  \n## 74.10 向应用程序添加地图\n\n向应用程序添加地图的最简单方法是在 activity 的用户界面布局 XML 文件中指定它。下面的布局文件显示了添加到\
  \ Android Studio 创建的 `activity_maps.xml` 文件中的 `SupportMapFragment` 实例：\n\n```xml\n\
  <fragment xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    android:id=\"@+id/map\"\n    tools:context=\"\
  .MapsActivity\"\n    android:name=\"com.google.android.gms.maps.SupportMapFragment\"\
  />\n```\n\n## 74.11 请求当前位置权限\n\n正如“在 Android 中进行运行时权限请求”章节概述的那样，某些权限被认为是危险的，对于 Android\
  \ 6.0 或更高版本需要特殊处理。一组权限允许应用程序识别当前位置。编辑位于 app -> manifests 下下的 `AndroidManifest.xml`\
  \ 文件并添加以下行：\n\n```xml\n<uses-permission android:name=\"android.permission.FINE_LOCATION\"\
  \ />\n<uses-permission android:name=\"android.permission.COARSE_LOCATION\" />\n\
  ```\n\n这些设置将确保应用可以在旧版本上提供位置。然而，为了支持 Android 6.0，我们需要向 `MapsActivity.java` 添加一些代码以在运行时请求此权限。首先添加一些导入和常量：\n\
  \n```java\npackage com.example.map;\n\nimport androidx.annotation.NonNull;\nimport\
  \ androidx.core.content.ContextCompat;\nimport androidx.core.app.ActivityCompat;\n\
  import android.Manifest;\nimport android.widget.Toast;\nimport android.content.pm.PackageManager;\n\
  \npublic class MapsActivity extends FragmentActivity implements OnMapReadyCallback\
  \ {\n    static final int LOCATION_REQUEST_CODE = 1;\n    private GoogleMap mMap;\n\
  ```\n\n接下来，必须在类中添加一个方法来向用户请求权限。在 `MapsActivity.java` 文件中实现：\n\n```java\nprotected\
  \ void requestPermission(String permissionType) {\n    ActivityCompat.requestPermissions(this,\
  \ new String[]{permissionType}, LOCATION_REQUEST_CODE);\n}\n```\n\n当用户响应权限请求后，活动将调用\
  \ `onRequestPermissionsResult()`。在 `MapsActivity.java` 文件中，实现该方法使其内容如下：\n\n```java\n\
  @Override\npublic void onRequestPermissionsResult(int requestCode, @NonNull String[]\
  \ permissions, @NonNull int[] grantResults) {\n    super.onRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n    if (requestCode == LOCATION_REQUEST_CODE) {\n\
  \        if (grantResults.length == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Toast.makeText(this, \"无法显示位置 - 需要权限\", Toast.LENGTH_LONG).show();\n\
  \        } else {\n            SupportMapFragment mapFragment = (SupportMapFragment)\
  \ getSupportFragmentManager()\n                .findFragmentById(R.id.map);\n  \
  \          mapFragment.getMapAsync(this);\n        }\n    }\n}\n```\n\n如果用户没有授予权限，应用将显示一条无法显示位置的消息。相反，如果授予了权限，地图将刷新，以便显示位置标记。\n\
  \n## 74.12 显示用户的当前位置\n\n一旦授予了适当权限，可以通过获取与显示的地图关联的 `GoogleMap` 对象引用并调用该实例的 `setMyLocationEnabled()`\
  \ 方法（传递 `true` 值），从而在地图上显示用户的当前位置。\n\n\n\n\n当地图准备好显示时，会调用 activity 的 `onMapReady()`\
  \ 方法。当地图在上述 `onRequestPermissionsResult()` 方法中进行刷新时，该方法也会被调用。默认情况下，Android Studio\
  \ 已经实现了此方法，并添加了一些代码，将地图对准到澳大利亚，并在悉尼市上方放置了一个标记点。找到并编辑 `MapsActivity.java` 文件中的 `onMapReady()`\
  \ 方法，移除此模板代码，并添加代码在启用显示用户当前位置之前检查是否已授予位置权限。如果未授予权限，将通过调用之前添加的 `requestPermission()`\
  \ 方法向用户请求权限：\n\n```java\n@Override\npublic void onMapReady(GoogleMap googleMap)\
  \ {\n    mMap = googleMap;\n    // 在悉尼添加一个标记并移动相机\n    LatLng sydney = new LatLng(-34,\
  \ 151);\n    mMap.addMarker(new MarkerOptions().position(sydney).title(\"Marker\
  \ in Sydney\"));\n    mMap.moveCamera(CameraUpdateFactory.newLatLng(sydney));\n\
  \    if (mMap != null) {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \                Manifest.permission.ACCESS_FINE_LOCATION);\n        if (permission\
  \ == PackageManager.PERMISSION_GRANTED) {\n            mMap.setMyLocationEnabled(true);\n\
  \        } else {\n            requestPermission(\n                    Manifest.permission.ACCESS_FINE_LOCATION,\n\
  \                    LOCATION_REQUEST_CODE);\n        }\n    }\n}\n```\n\n现在运行应用，将显示图\
  \ 74-10 所示的对话框，请求位置权限。如果授予了权限，地图上将出现一个蓝点，指示设备的位置。\n\n![](img/as_map_permission.jpg)\n\
  \n图 74-10\n\n### 74.13 更改地图类型\n\n通过调用相应 `GoogleMap` 对象的 `setMapType()` 方法传递以下值之一，可以动态修改显示的地图类型：\n\
  \n- `GoogleMap.MAP_TYPE_NONE` – 一个空网格，不显示地图瓦片。\n- `GoogleMap.MAP_TYPE_NORMAL` –\
  \ 由经典道路地图组成的标准视图。\n- `GoogleMap.MAP_TYPE_SATELLITE` – 显示地图区域的卫星图像。\n- `GoogleMap.MAP_TYPE_HYBRID`\
  \ – 显示叠加了道路地图的卫星图像。\n- `GoogleMap.MAP_TYPE_TERRAIN` – 显示地形信息，如等高线和颜色。例如，对 `onMapReady()`\
  \ 方法进行以下代码更改可以将地图切换到卫星模式：\n\n```java\nif (mMap != null) {\n    int permission =\
  \ ContextCompat.checkSelfPermission(\n            this, Manifest.permission.ACCESS_FINE_LOCATION);\n\
  \    if (permission == PackageManager.PERMISSION_GRANTED) {\n        mMap.setMyLocationEnabled(true);\n\
  \    } else {\n        requestPermission(Manifest.permission.ACCESS_FINE_LOCATION,\n\
  \                LOCATION_REQUEST_CODE);\n    }\n    mMap.setMapType(GoogleMap.MAP_TYPE_SATELLITE);\n\
  }\n```\n\n或者，也可以在嵌入地图的 XML 布局文件中指定地图类型，使用 `map:mapType` 属性结合 `none`、`normal`、`hybrid`、`satellite`\
  \ 或 `terrain` 值。例如：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<fragment\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n          xmlns:map=\"\
  http://schemas.android.com/apk/res-auto\"\n          android:id=\"@+id/map\"\n \
  \         android:layout_width=\"match_parent\"\n          android:layout_height=\"\
  match_parent\"\n          android:name=\"com.google.android.gms.maps.SupportMapFragment\"\
  \n          map:mapType=\"terrain\"/>\n```\n\n### 74.14 向用户显示地图控件\n\nGoogle Maps\
  \ API 提供了几个可以显示的控件：缩放按钮、指南针和“我的位置”。可以使用与 `GoogleMap` 关联的 `UiSettings` 对象启用或禁用这些控件。\n\
  \n```java\nUiSettings uiSettings = mMap.getUiSettings();\nuiSettings.setZoomControlsEnabled(true);\n\
  uiSettings.setCompassEnabled(true);\nuiSettings.setMyLocationEnabled(true);\n```\n\
  \n或者，可以在 XML 布局文件使用相应的 `map:` 属性配置这些控件：\n\n```xml\n<fragment\n    android:id=\"\
  @+id/map\"\n    ...\n    map:zoomControlsEnabled=\"true\"\n    map:compassEnabled=\"\
  true\"\n    map:MyLocationEnabled=\"true\"/>\n```\n\n### 74.15 处理地图手势\n\nGoogle\
  \ Maps API 可以响应各种用户交互。\n\n### 74.15.1 缩放手势\n\n使用 `UiSettings` 实例的 `setZoomControlsEnabled()`\
  \ 方法启用或禁用与放大和缩放相关的手势：\n\n```java\nUiSettings uiSettings = mMap.getUiSettings();\n\
  uiSettings.setZoomControlsEnabled(true);\n```\n\n启用后，当用户在屏幕上进行捏合手势时会发生缩放。同样，双击会放大，而双指轻触会缩小。\n\
  \n### 74.15.2 滚动/平移手势\n\n滚动或平移手势允许用户通过单指移动地图来查看地图。可以通过以下方式启用：\n\n```java\nUiSettings\
  \ uiSettings = mMap.getUiSettings();\nuiSettings.setScrollGestEnabled(true);\n```\n\
  \n### 74.15.3 地图倾斜手势\n\n倾斜手势允许用户通过在屏幕上放置两个手指并上下移动来倾斜地图的投影角度。通过以下方式启用：\n\n```java\n\
  UiSettings uiSettings = mMap.getUiSettings();\nuiSettings.setTiltGesturesEnabled(true);\n\
  ```\n\n### 74.15.4 地图旋转手势\n\n通过在屏幕上放置两个手指并进行圆周旋转，用户可以旋转地图的方向。通过以下方式启用：\n\n```java\n\
  UiSettings uiSettings = mMap.getUiSettings();\nuiSettings.setRotateGesturesEnabled(true);\n\
  ```\n\n\n\n\n标记（Markers）用于向用户通知地图上的位置，其形式可以是标准图标或自定义图标。标记还可以包含一个标题（title）和可选文本（称为片段，snippet），并可以配置为允许用户拖动到地图上的不同位置。当用户点击标记时，将出现一个窗口（info\
  \ window），显示有关该标记位置的额外信息。\n\n标记由 `Marker` 类的实例表示，并通过调用相应 `GoogleMap` 对象的 `addMarker()`\
  \ 方法添加到地图上。一个 `MarkerOptions` 类的实例，其中包含了标记所需的各种选项（如标题和片段文本），将作为参数传递给该方法。标记的位置通过指定纬度和经度值定义，这些值也包含在\
  \ `MarkerOptions` 实例中。例如，以下代码在地图上的特定位置添加了一个标记，包括标题、片段和位置：\n\n```java\nimport com.google.android.gms.maps.model.Marker;\n\
  import com.google.android.gms.maps.model.LatLng;\nimport com.google.android.gms.maps.model.MarkerOptions;\n\
  \nLatLng position = new LatLng(38.8874245, -77.0200729);\nMarker museum = mMap.addMarker(new\
  \ MarkerOptions()\n                .position(position)\n                .title(\"\
  Museum\")\n                .snippet(\"National Air and Space Museum\"));\n```\n\n\
  执行上述代码将将标记指定的的位置，点击该位置时将显示一个包含标题和片段的信息窗口，如图图 74-11 所示：\n\n![](img/Image24512.jpg)\n\
  \n图 74-11\n\n### 74.17 控制地图相机\n\n由于 Android 设备的屏幕是平面的，而地球是球体，Google Maps Android\
  \ API 使用墨卡托投影在平面上表示地球。地图的默认视图呈现给用户，就像通过一个悬挂在地图上方并直接指向地图的相机一样。Google Maps Android\
  \ API 允许在应用程序内部更改摄像机的目标（target）、缩放（zoom）、方位（bearing）和倾斜（tilt）：\n\n- **Target（目标）**\
  \ – 地图在设备显示中的中心位置，通过经度和指定。\n- **Zoom（缩放）** – 以级别指定的相机缩放级别。缩放级别每增加 1.0，显示的地图宽度就会翻倍。\n\
  - **Tilt（倾斜）** – 摄像机的视角角度，指定为跨越可视地图区域正上方的弧上的位置，从弧顶开始以度测量（弧顶是弧的底点，相机在此处直接指向地图）。\n\
  - **Bearing（方位）** – 地图的方向，以从北向顺时针方向测量。\n\n相机的更改通过创建一个具有适当设置的 `CameraUpdate` 类实例来实现。`CameraUpdate`\
  \ 实例是通过调用 `CameraUpdateFactory` 类的方法创建的。一旦创建了 `CameraUpdate` 实例，就会通过调用 `GoogleMap`\
  \ 实例的 `moveCamera()` 方法应用到地图。为了在相机变化时获得平滑的动画效果，可以调用 `animateCamera()` 方法代替 `moveCamera()`。\n\
  \n`CameraUpdateFactory` 方法摘要如下：\n\n- `CameraUpdateFactory.zoomIn()` – 提供一个放大一级的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomOut()` - 提供一个缩小一级的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.zoomTo(float)` - 生成一个将缩放级别更改为指定值的 `CameraUpdate` 实例。\n\
  - `CameraUpdateFactory.zoomBy(float)` – 提供一个按指定量增加或减少缩放级的 `CameraUpdate` 实例。\n-\
  \ `CameraUpdateFactory.zoomBy(float, Point)` - 创建一个按指定值增加或减少缩放级的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.newLatLng(LatLng)` - 创建一个更改相机目标经纬度的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.newLatLngZoom(LatLng, float)` - 生成一个更改相机经纬度和缩放的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.newCameraPosition(CameraPosition)` - 返回一个将相机移动到指定位置的\
  \ `CameraUpdate` 实例。可以使用 `CameraPosition.Builder()` 获取 `CameraPosition` 实例。\n\n\
  例如，以下代码使用动画将相机放大一级：\n\n```java\nmMap.animateCamera(CameraUpdateFactory.zoomIn());\n\
  ```\n\n相反，以下代码在不使用动画的情况下将相机移动到新位置并将缩放级别调整为 10：\n\n```java\nprivate static final\
  \ LatLng position =\n    new LatLng(38.8874245, -77.0200729);\nmMap.moveCamera(CameraUpdateFactory.newLatLngZoom(position,\
  \ 10));\n```\n\n最后，下一个代码示例使用 `CameraPosition.Builder()` 创建了一个具有目标、缩放、方位和倾斜更改的 `CameraPosition`\
  \ 对象。然后使用动画将此更改应用于相机：\n\n```java\nimport com.google.android.gms.maps.model.CameraPosition;\n\
  \nCameraPosition cameraPosition = new CameraPosition.Builder().build();\nmMap.animateCamera(CameraUpdateFactory.newCameraPosition(cameraPosition));\n\
  ```\n\n### 74.18 总结\n本章概述了构成 Google Maps API 的关键类和方法，并概述了如何准备开发环境和应用程序以使用它。\n\n\
  ## 75. 使用 Android 打印\nAndroid 框架用于打印。后续章节将详细讨论添加打印支持选项，本章将重点介绍目前提供的各种选项。\n\n###\
  \ 75.1 Android 打印架构\nAndroid 框架提供了打印功能。从基本上来说，该框架由一个打印管理器（Print Manager）和若干打印服务插件（print\
  \ service plugins）组成。\n\n打印管理器负责处理应用程序的打印请求，并与设备上安装的打印服务插件交互，确保打印请求得到实现。\n\n###\
  \ 75.2 打印服务插件\n打印服务插件的目的是允许应用程序打印到局域无线网络或蓝牙可见的兼容打印机。\n\n可以通过加载 Google Play 应用并搜索“Print\
  \ Service Plugin”来验证 Android 设备上是否存在打印服务插件。\n\n默认情况下，许多 Android 设备已安装了打印服务插件，以便使用\
  \ Google Cloud 和 Google Drive 服务进行打印。其他打印类型的打印服务插件（如果尚未安装）也可以从 Google Play 商店获取。图\
  \ 75-1 示例显示了 Google Play 中的 HP 打印服务插件。\n\n\n\n\n\n![](img/as_4.1_hp_printer_plugin.jpg)\n\
  图 75-1\n\n### 75.3 Google Cloud Print\n\nGoogle Cloud Print 是 Google 提供的一项服务，允许您从任何具有互联网连接的地方通过网页将内容打印到打印机上。Google\
  \ Cloud Print 支持云就绪（Cloud Ready）和经典（Classic）打印机的多种设备和型号。云就绪打印机内置了通过网页打印的技术。提供云就绪打印机的制造商包括\
  \ Brother、Canon、Dell、Epson、HP、Kodak 和 Samsung。要确认您的打印机是否既云就绪并支持 Google Cloud Print，请查看下方\
  \ URL 中的打印机列表：\n\n[打印机列表](https://www.google.com/cloudprint/learn/printers.html)\n\
  \n对于经典的非云就绪打印机，Google Cloud Print 通过在连接经典打印机的计算机系统（直接连接或通过家庭或办公室网络连接）上安装软件来实现云打印。\n\
  \n要设置 Google Cloud Print，请访问以下网页并使用与登录 Android 设备时相同的 Google 账户 ID 登录：\n\n[Google\
  \ Cloud Print 帮助](https://www.google.com/cloudprint/learn/index.html)\n\n一旦打印机添加到您的\
  \ Google Cloud Print 账户，当在 Android 内部打印时，它们将作为打印目标选项列出。\n\n### 75.4 打印到 Google Drive\n\
  \n除了支持实体打印机外，还可以将打印输出保存到您的 Google Drive 账户。从设备打印时，在打印面板中选择 `Save to Google Drive`\
  \ 选项。要打印的内容将被转换为 PDF 文件，并保存到设备上当前活动 Google 账户 ID 关联的 Google Drive 云存储中。\n\n## 75.5\
  \ 保存为 PDF\n\nAndroid 提供的最后一个打印选项允许将打印内容作为 PDF 文件本地保存到 Android 设备上。一旦选择此选项，系统将要求指定\
  \ PDF 文件名以及文档保存到设备上的位置。\n\n在测试 way Android 应用程序的打印功能时，`Save as PDF` 和 Google Drive\
  \ 选项在节省纸张方面可能具有极高的价值。\n\n### 75.6 从 Android 设备打印\n\nGoogle 建议能够打印内容的应用程序将打印选项放置在溢出菜单（Overflow\
  \ menu）中。许多与 Android 捆绑的应用程序现在已包含“打印……”菜单选项。例如，图 75-2 显示了通过选择 Chrome 浏览器应用程序溢出菜单中的“共享……”选项来访问打印选项：\n\
  \n![](img/as_3.5_chrome_print_option.jpg)\n图 75-2\n\n一旦在应用程序内选择了打印选项，将标准的 Android\
  \ 打印屏幕，显示打印内容的预览，如图 75-3 所示：\n\n![](img/as_3.5_chrome_print_panel.jpg)\n图 75-3\n\
  \n点击屏幕顶部的面板将显示所有的打印选项：\n\n![](img/as_3.5_save_as_pdf.jpg)\n图 75-4\n\nAndroid 打印面板提供了标准的打印选项，例如纸张大小、颜色、方向和副本数量。通过点击当前打印机或\
  \ PDF 输出选择，可以访问其他打印目标选项。\n\n## 75.7 在 Android 应用中构建打印支持的选项\n\n打印框架（Printing framework）为在\
  \ Android 应用中整合打印支持提供了多种选项。这些选项可以分类如下：\n\n### 75.7.1 图片打印\n\n顾如名，此选项允许将图像打印整合到 Android\
  \ 应用中。在应用程序中添加此功能时，第一步是为 `PrintHelper` 类创建一个新实例：\n\n```\nPrintHelper imagePrinter\
  \ = new PrintHelper(context);\n```\n\n接下来，可以通过调用 `PrintHelper` 实例的 `setScaleMode()`\
  \ 方法指定打印图像的缩放模式。选项如下：\n\n- `SCALE_MODE_FIT` – 图像将缩放以适应纸张大小，而不进行裁剪或更改宽高比例。这通常会导致在一个维度上出现空白。\n\
  - `SCALE_MODE_FILL` – 图像将缩放以填充纸张大小，并在必要时裁剪，以避免打印输出中出现空白。\n\n如果不设置缩放模式，系统将默认使用 `SCALE_MODE_FILL`。例如，以下代码将之前声明的\
  \ `PrintHelper` 实例缩放设置为自适应模式：\n\n```\nimagePrinter.setScaleMode(PrintHelper.SCALE_MODE_FIT);\n\
  ```\n\n同样，也可以配置颜色模式以指示打印输出是彩色还是黑白。这通过向 `PrintHelper` 实例的 `setColorMode()` 方法传递以下选项之一来实现：\n\
  \n- `COLOR_MODE_COLOR` – 表示图像将以彩色打印。\n- `COLOR_MODE_MONOCHROME` – 表示图像将以黑白打印。\n\n\
  打印框架将默认彩色打印，除非按如下方式指定单色选项：\n\n```\nimagePrinter.setColorMode(PrintHelper.COLOR_MODE_MONOCHROME);\n\
  ```\n\n完成打印操作所需的仅是待打印的图像，并调用 `PrintHelper` 实例的 `printBitmap()` 方法，该方法需要传递一个代表打印任务名称的字符串以及图像的引用（以\
  \ `Bitmap` 对象或 `Uri` 引用的形式）：\n\n```\nBitmap bitmap = BitmapFactory.decodeResource(getResources(),\
  \ R.drawable.image);\nimagePrinter.printBitmap(\"Test Job\", bitmap);\n```\n\n一旦启动打印任务，框架将显示打印对话并处理与用户的交互。\n\
  \n### 75.7.2 创建并打印 HTML\n\nAndroid 打印框架还提供了一种在应用程序内打印 HTML 内容的简单方法。这些内容可以是托管在网站上的页面\
  \ URL，也可以是在应用程序内部动态创建。为了启用打印，`WebView` 类已经过扩展，以最少的需求支持打印。在动态创建 HTML 时（而不是加载现有页面），该过程涉及以下代码：\n\
  \n```java\npublic void printContent() {\n    WebView webView = new WebView(this);\n\
  \    webView.setWebViewClient(new WebViewClient() {\n        @Override\n       \
  \ public boolean shouldOverrideLoading(WebView view, String url) {\n           \
  \ return false;\n        }\n        @Override\n        public void onPageFinished(WebView\
  \ view, String url) {\n            createWebPrintJob(view);\n            myWebView\
  \ = null;\n        }\n    });\n    String htmlDocument = \"<html><body><h1>Android\
  \ Print Test</h1><p>\" + \"This is some sample content.</p></body></html>\";\n \
  \   webView.loadDataWithBaseURL(null, htmlDocument, \"text/HTML\", \"UTF-8\", null);\n\
  \    myWebView = webView;\n}\n```\n\n\n\n\n\n此方法的代码首先声明了一个名为 `myWebView` 的变量，其中将存储方法中创建的\
  \ `WebView` 实例的引用。在 `printContent()` 方法中，创建了一个 `WebView` 类实例，并为其分配了一个 `WebViewClient`\
  \ 实例。\n\n分配给 web view 对象的 `WebViewClient` 被配置为指示 HTML 内容的加载由 `WebView` 实例处理（通过从\
  \ `shouldOverrideUrlLoading()` 方法返回 `false`）。更重要的是，声明并实现了一个 `onPageFinished()` 处理器方法，以调用\
  \ `createWebPrintJob()` 方法。当所有 HTML 内容加载到 web view 中时，`onPageFinished()` 回调方法将被自动调用。这确保了在内容准备绪之前不会启动打印任务，从而确保所有内容都能被打印。\n\
  \n接下来，创建一个包含某些 HTML 的字符串作为内容。然后将其加载到 web view 中。一旦 HTML 加载完成，`onPageFinished()`\
  \ 方法就会触发。最后，该方法存储了对 web view 对象的引用。如果没有这一关键步骤，Java 运行时系统极有可能会认为应用程序不再需要该 web view\
  \ 对象，并将其丢弃以释放内存（Java 术语中称为垃圾回收），导致打印任务在完成前终止。\n\n在本示例中，剩下的工作是如下实现 `createWebPrintJob()`\
  \ 方法：\n\n```java\nprivate void createWebPrintJob(WebView webView) {\n    PrintManager\
  \ printManager = (PrintManager) this\n            .getSystemService(Context.PRINT_SERVICE);\n\
  \    PrintDocumentAdapter printAdapter =\n                    webView.createPrintDocumentAdapter(\"\
  MyDocument\");\n    String jobName = getString(R.string.app_name) + \" Document\"\
  ;\n    PrintJob printJob = printManager.print(jobName, printAdapter,\n         \
  \               new PrintAttributes.Builder().build());\n}\n```\n\n此方法获取 `PrintManager`\
  \ 服务的引用，并指示 web view 实例创建一个打印适配器。创建一个新字符串来存储打印任务的名称（在这种情况下，基于应用程序名称和“Document”单词）。\n\
  \n最后，通过调用打印管理器的 `print()` 方法启动打印任务，传递任务名称、打印适配器和一组默认打印属性。如果需要，可以自定义打印属性以指定分辨率（每英寸点数）、边距和颜色选项。\n\
  \n### 75.7.3 打印网页\n\n打印网页涉及的步骤与上述概述相似，不同之处传递给 web view 的要打印网页的 URL，而不是动态创建的 HTML，例如：\n\
  \n```java\nmyWebView.loadUrl(\"https://developer.android.com/google/index.html\"\
  );\n```\n\n同样重要的是，`WebViewClient` 配置只有在网页加载后需要立即自动打印时才是必要的。如果打印是由用户在页面加载后选择菜单选项启动的，则只需要在应用程序代码中包含上述\
  \ `createWebPrintJob()` 方法中的代码。下一章 Android HTML 和 Web 内容打印示例 将演示此类场景。\n\n### 75.7.4\
  \ 打印自定义文档\n\n虽然打印框架（Printing framework）引入的 HTML 和 Web 打印功能为从 Android 应用程序内部打印内容提供了简便路径，但显然，对于更高级的打印需求，这些选项将显得过于简单。打印框架还为更复杂的打印任务提供了自定义文档打印支持。这允许将文本和图形形式的内容绘制到画布上进行打印。\n\
  \n与较较实现的 HTML 和图像打印不同，自定义文档打印是一个更复杂、多阶段的过程，将在本书的 Android 自定义文档打印指南 章中概述。这些步骤可以总结如下：\n\
  \n* 连接到 Android 打印管理器\n* 创建继承自 `PrintDocumentAdapter` 类的自定义打印适配器\n* 创建 `PdfDocument`\
  \ 实例来表示文档页面\n* 获取 `PdfDocument` 实例页面的引用，每个页面都关联有一个 `Canvas` 实例\n* 在页面画布上绘制内容\n*\
  \ 通知打印框架文档已准备好打印\n\n上述步骤中概述的自定义打印适配器必须实现几个方法，Android 系统将在打印期间调用这些方法执行特定任务。其中最重要的是\
  \ `onLayout()` 方法，它负责根据用户更改纸张大小或页面方向等设置来重新安排文档布局；以及 `onWrite()` 方法，它负责渲染待打印的页面。名为\
  \ Android 自定义文档打印指南 的章节将详细介绍这一主题。\n\n### 75.8 总结\n\nAndroid SDK 可以从运行中的应用程序内部打印内容。打印输出可以定向到配置适当的打印机、本地\
  \ PDF 文件或通过 Google Drive 到云端。从 Android 开发人员的角度来看，通过利用框架，这些功能可以在应用程序中使用。到目前为止，最容易实现的打印选项是涉及图像和\
  \ HTML 形式的内容。然而，也可以实现更高级的打印。\n\n## HTML 和 Web 内容示例\n\n如上一章所述，使用 Android 框架进行打印，Android\
  \ 框架可以同时打印网页和动态创建的 HTML。虽然这些打印方法之间有许多相似之处，但也存在一些需要考虑的微妙区别。本章将通过创建两个应用程序来阐明这些打印选项。\n\
  \n### 76.1 创建 HTML 打印应用程序\n\n从欢迎界面选择 New Project，在弹出的新项目对话中，点击 Next 按钮之前选择 Empty\
  \ Views 模板。在 Name 字段输入 HTMLPrint，并指定包名为 `com.ebookzy.htmlprint`。在点击 Finish 按钮之前，将最低\
  \ API 级别更改为 API 26: Android 8.0 (Oreo)，设置为 Java。\n\n### 76.2 打印动态 HTML 内容\n\n教程的第一阶段是向项目添加代码以创建\
  \ HTML 内容并将其作为打印任务发送到打印框架。首先找到 `MainActivity.java` 文件（位于 Project 工具下的 `app -> java\
  \ -> com.ebookrenzy.htmlprint`）并将其加载到编辑面板。一旦加载，修改代码使其如下列表所示：\n\n```java\npackage\
  \ com.ebookrenzy.htmlprint;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\n\
  import android.webkit.WebResourceRequest;\nimport android.print.PrintAttributes;\n\
  import android.print.PrintDocumentAdapter;\nimport android.print.PrintManager;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private WebView myWebView;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_htmlprint);\n\
  \        printWebView();\n    }\n\n    private void printWebView() {\n        WebView\
  \ webView = new WebView(this);\n        webView.setWebViewClient(new WebViewClient()\
  \ {\n```\n\n\n\n\n\n```java\npublic boolean shouldOverrideUrlLoading(WebView view,\
  \ WebResourceRequest request) {\n    return false;\n}\n\n@Override\npublic void\
  \ onPageFinished(WebView view, String url) {\n    createWebPrintJob(view);\n   \
  \ myWebView = null;\n}\n});\nString htmlDocument = \"<<html><body><h1>Android Print\
  \ Test</h1><p>\"\n    + \"This is some sample content.</p></body></html>\";\nwebView.loadDataWithBaseURL(null,\
  \ htmlDocument, \"text/HTML\", \"UTF-8\", null);\nmyWebView = webView;\n}\n}\n```\n\
  \n代码更改从声明一个名为 `myWebView` 的变量开始，该变量将存储用于打印操作的 `WebView` 实例引用。在 `printWebView()`\
  \ 方法中，创建了一个 `WebView` 类实例并为其分配了一个 `WebViewClient` 实例。\n\n分配给 web view 对象的 `WebViewClient`\
  \ 经过配置，指示 HTML 内容的加载由 `WebView` 实例处理（通过从 `shouldOverrideUrlLoading()` 方法返回 `false`）。更重要的是，声明并实现了一个\
  \ `onPageFinished()` 处理方法用以调用 `createWebPrintJob()` 方法。当所有 HTML 内容都加载到 web view\
  \ 时，`onPageFinished()` 方法将被自动调用。如上一章所述，在打印动态创建的 HTML 内容时，这一步是必要的，以确保只有在内容完全加载到 `WebView`\
  \ 后才启动打印任务。\n\n接下来，创建一个包含某些 HTML 的 `String` 对象作为内容，并将其加载到 web view 中。一旦 HTML 加载，`onPageFinished()`\
  \ 回调方法就会触发。最后，该方法将 web view 对象的引用存储在之前定义的 `myWebView` 变量中。如果没有这一至关的一步，Java 运行时系统可能会认为应用程序不再需要该\
  \ web view 对象并将其丢弃以释放内存，导致打印任务在完成之前就终止。\n\n此示例中剩下的工作是实现 `createWebPrintJob()` 方法，该方法目前配置为由\
  \ `onPageFinished()` 回调方法调用。因此，在 `MainActivity.java` 文件中，实现该方法使其读取内容如下：\n\n```java\n\
  private void createWebPrintJob(WebView webView) {\n    PrintManager printManager\
  \ = (PrintManager) this\n            .getSystemService(Context.PRINT_SERVICE);\n\
  \    PrintDocumentAdapter printAdapter =\n            webView.createPrintDocumentAdapter(\"\
  MyDocument\");\n    String jobName = getString(R.string.app_name) + \" Print Test\"\
  ;\n    printManager.print(jobName, printAdapter,\n            new PrintAttributes.Builder().build());\n\
  }\n```\n\n此方法获取 `PrintManager` 服务的引用，并指示 web view 实例创建一个打印适配器。创建一个新字符串来存储打印任务的名称（在本例中，基于应用程序名称和“Print\
  \ Test”字样）。最后，通过调用打印管理器的 `print()` 方法启动打印任务，传递任务名称、适配器和一组默认属性。在运行 Android 5.0 或更高版本的设备或模拟器上编译并运行应用程序。一旦启动，将出现标准的\
  \ Android 打印页面，如图 76-1 所示。（image/as_html_print.jpg）\n\n图 76-1\n\n如果你有物理打印机，请打印到打印机、保存到\
  \ Google Drive，或者选择保存为 PDF 文件。一旦打印任务启动，请在目标上检查生成的输出。请注意，使用“保存为 PDF”选项时，系统会请求 PDF\
  \ 文件的名称和位置。`Downloads` 文件夹是一个很好的选择，可以通过选择设备上其他图标中的 Downloads 图标（在 Android 8 上重命名为\
  \ Files）查看其内容。\n\n### 76.3 创建网页打印示例\n\n本章创建的第二个示例将为用户提供一个溢出菜单（Overflow menu），用于打印当前在\
  \ `WebView` 实例中显示的网页。从欢迎界面选择 `New Project`get，在生成的项目对话框中，点击 `Next` 按钮之前选择 `Basic\
  \ Views Activity` 模板。在 `Name` 字段中输入 `WebPrint` 并指定 `com.ebookrenzy.webprint` 为包名。在点击\
  \ `Finish` 按钮之前，将最低 API 级别设置设置为 API 26: Android 8.0 (Oreo)，并将语言设置为 Java。\n\n###\
  \ 76.4 移除悬浮操作按钮\n\n选择 `Basic Views Activity` 模板提供了上下文菜单和一个悬浮操作按钮。由于不需要悬浮操作按钮，可以在继续之前将其移除。将\
  \ `activity_main.xml` 布局加载到布局编辑器中，选择悬浮操作按钮并按删除键从布局中移除该对象。编辑 `MainActivity.java`\
  \ 文件，从 `onCreate` 方法中移除悬浮操作按钮代码如下：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    binding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \                .setAction(\"Action\", null).show();\n        }\n    });\n}\n```\n\
  \n### 76.5 移除导航功能\n\n如“Android Studio 布局工具指南”所述，“Basic Views Activity` 模板包含多个用于在\
  \ fragment 之间导航的 fragment 和按钮。这些功能对于本教程是不必要的，如果不移除会导致问题。在继续教程之前，按照以下方式修改项目：\n\n\
  1. 在 Project 窗口中，导航并双击 `app -> res -> navigation -> nav_graph.xml` 将其加载到导航编辑器。\n\
  2. 在编辑器中，选择图表中的 `SecondFragment` 项并按删除键将其从图表中移除。\n3. 定位并删除 `SecondFragment.java`\
  \ (`app -> java -> <package name> -> SecondFragment`) 和 `fragment_second.xml` (`app\
  \ -> res -> layout -> fragment_second.xml`) 文件。\n4. 定位 `FirstFragment.java` 文件，双击将其加载到编辑器，并从\
  \ `onViewCreated()` 方法中移除代码使其读取如下：\n\n```java\npublic void onViewCreated(@NonNull\
  \ View view, Bundle savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n\
  \    binding.buttonFirst.setOnClickListener(new View.OnClickListener() {\n     \
  \   @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \                .navigate(R.id.action_FirstFragment_to_SecondFragment);\n     \
  \   }\n    });\n}\n```\n\n5. 编辑 `MainActivity.java` 文件并移除以下导航代码：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    NavController navController =\n\
  \        Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  \    appBarConfiguration = new AppBarConfiguration.Builder(\n        navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController,\n       \
  \ appBarConfiguration);\n}\n```\n\n\n\n\n\n```java\npublic boolean onSupportNavigateUp()\
  \ {\n    NavController navController = Navigation.findNavController(this,\n    \
  \        R.id.nav_host_fragment_content_main);\n    return NavigationUI.navigateUp(navController,\
  \ appBarConfiguration)\n            || super.onSupportNavigateUp();\n}\n```\n\n\
