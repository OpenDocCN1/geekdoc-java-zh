  \ #图 31-9] 所示：\n\n![](img/as_4.1_fragments_added.jpg)\n\n图 31-9\n\n在继续下一步之前，在布局中选择\
  \ `TextFragment` 实例，并在属性（Attributes）工具窗口内将片段的 ID 更改为 `text_fragment`。\n\n### 31.7\
  \ 让工具栏片段与 Activity\n\n当用户触摸工具栏片段中的按钮时，片段类需要从 `EditText` 视图提取文本以及 `SeekBar` 的当前值，并将它们发送给文本片段。如\
  \ [“Android 片段简介”#Fragments.xhtml__idTextAnchor697) 所述，片段之间不应直接相互通信，而应该使用嵌入它们的 activity\
  \ 作为中间媒介。\n\n此过程的第一步是确保工具栏片段对被点击的按钮有响应。我们还需要实现一些代码来跟踪 `SeekBar` 视图的值。对于此示例，我们将在\
  \ `ToolbarFragment` 类中实现这些监听器。选择 `ToolbarFragment.java` 文件并对其进行修改，使其读取内容如下列表所示：\n\
  \n```java\npackage com.ebookfrenzy.fragmentexample;\n\n.\n.\n\nimport androidx.annotation.NonNull;\n\
  \nimport androidx.annotation.Nullable;\nimport android.content.Context;\nimport\
  \ android.widget.SeekBar;\n\npublic class ToolbarFragment extends Fragment implements\
  \ SeekBar.OnSeekBarChangeListener {\n\n    private static int seekvalue = 10;\n\n\
  .\n.\n\n    @Override\n    public void onViewCreated(@NonNull View view, @Nullable\
  \ Bundle savedInstanceState) {\n        super.onViewCreated(view, savedInstanceState);\n\
  \        binding.seekBar1.setOnSeekBarChangeListener(this);\n        binding.button1.setOnClickListener(new\
  \ View.OnClickListener() {\n            public void onClick(View v) {\n        \
  \        buttonClicked(v);\n            }\n        });\n    }\n\n    public void\
  \ buttonClicked (View view) {\n    }\n\n    @Override\n    public void onProgressChanged(SeekBar\
  \ seekBar, int progress, boolean fromUser) {\n        seekvalue = progress;\n  \
  \  }\n\n    @Override\n    public void onStartTrackingTouch(SeekBar arg0) {\n  \
  \  }\n\n    @Override\n    public void onStopTrackingTouch(SeekBar arg0) {\n   \
  \ }\n}\n```\n\n在继续之前，我们需要花些时间解释上述代码更改。首先，该类被声明实现了 `OnSeekBarChangeListener` 接口。这是因为用户界面包含一个\
  \ `SeekBar` 实例，当用户滑动滑条更改字体大同时，片段需要接收通知。实现 `OnSeekBarChangeListener` 接口要求实现 `onProgressChanged()`、`onStartTrackingTouch()`\
  \ 和 `onStopTrackingTouch()` 方法。这些方法已经实现，但只需要 `onProgressChanged()` 方法来执行任务，在这种情况下，是将新值存储在名为\
  \ `seekvalue` 的变量中，该变量在类的开头已声明。还声明了一个变量用于存储对 `EditText` 对象的引用。\n\n添加了 `onViewCreated()`\
  \ 方法以在按钮上设置 `OnClickListener`，它被配置在检测到点击事件时调用名为 `buttonClicked()` 的方法。该方法也已实现，尽管它目前没有执行任何操作。\n\
  \n此过程的下一阶段是设置监听器，允许片段在按钮被点击时调用 activity。这遵循了上一章中概述的机制：\n\n```java\npublic class\
  \ ToolbarFragment extends Fragment implements SeekBar.OnSeekBarChangeListener {\n\
  \    private static int seekvalue = 10;\n    private FragmentBinding binding;\n\
  \    private ToolbarListener activityCallback;\n\n    public interface ToolbarListener\
  \ {\n        public void onButtonClick(int position, String text);\n    }\n\n  \
  \  @Override\n    public void onAttach(Context context) {\n        super.onAttach(context);\n\
  \        try {\n            activityCallback = (ToolbarListener) context;\n    \
  \    } catch (ClassCastException e) {\n            throw new ClassCastException(context.toString()\
  \ + \" must implement ToolbarListener\");\n        }\n    }\n.\n.\n    public void\
  \ buttonClicked (View view) {\n        activityCallback.onButtonClick(seekvalue,\
  \ binding.editText1.getText().toString());\n    }\n.\n.\n}\n```\n\n上述实现将导致在用户点击按钮时调用属于\
  \ activity 类的名为 `onButtonClick()` 的方法。因此，剩下的只需声明 activity 类实现了新创建的 `ToolbarListener`\
  \ 接口并实现 `onButtonClick()` 方法。\n\n由于在早期的 Android 版本中使用 Android Support Library 来支持片段，因此\
  \ activity 也需要更改为自自 `FragmentActivity` 而不是 `AppCompat`。将这些需求结合起来产生了如下 `MainActivity.java`\
  \ 文件：\n\n```java\npackage com.ebookfrenzy.fragmentexample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import androidx.fragment.app.FragmentActivity;\nimport android.os.Bundle;\n\npublic\
  \ class MainActivity extends FragmentActivity implements ToolbarFragment.ToolbarListener\
  \ {\n.\n.\n    public void onButtonClick(int fontsize, String text) {\n    }\n}\n\
  ```\n\n按照目前的代码更改，工具栏片段将检测用户点击按钮并调用 activity 方法，传递 `EditText` 字段的内容和 `SeekBar` 视图的当前设置。现在\
  \ activity 的工作是与文本片段通信，并传递这些值，以便片段相应地更新 `TextView` 对象。\n\n### 31.8 让 Activity 与文本片段通信\n\
  \n如 [“Android 片段简介”#Fragments.xhtml__idTextAnchor697) 所述，activity 可以获取片段类实例的引用并调用公共方法来与片段通信。因此，在\
  \ `TextFragment` 类中，我们现在实现一个名为 `changeTextProperties()` 的公共方法，它接收一个字体大小整数和一个新文本的字符串作为参数。该方法将使用这些值来修改\
  \ `TextView` 对象。在 Android Studio 编辑面板中，找到并修改 `TextFragment.java` 文件以添加此新方法：\n\n\
  ```java\npackage com.ebookfrenzy.fragmentexample;\n\n.\n.\n\npublic class TextFragment\
  \ extends Fragment {\n.\n.\n    public void changeTextProperties(int fontsize, String\
  \ text) {\n        binding.textView2.setTextSize(fontsize);\n        binding.textView2.setText(text);\n\
  \    }\n}\n```\n\n\n\n\n当 `TextFragment` 碎片放置在 activity 的布局中时，它被分配了一个为 `text_fragment`\
  \ 的 ID。通过这个 ID，activity 现在可以获取碎片实例的引用，并在该对象上调用 `changeTextProperties()` 方法。编辑 `MainActivity.java`\
  \ 文件并按如下所示修改 `onButtonClick()` 方法：\n\n```java\npublic void onButtonClick(int fontsize,\
  \ String text) {\n    TextFragment textFragment =\n    (TextFragment)\n      getSupportFragmentManager().findFragmentById(R.id.text_fragment);\n\
  \    textFragment.changeTextProperties(fontsize, text);\n}\n```\n\n### 31.9 测试应用程序\n\
  \n该项目的编码工作已经完成，最后一个剩下的任务是运行应用程序。当应用程序启动时，主 activity 将启动，并创建并显示两个碎片。当用户触摸工具栏碎片中的按钮时，工具栏碎片会调用\
  \ activity 的 `onButtonClick()` 方法，并将来自 `EditText` 视图的文本和 `SeekBar` 的当前值传递。。，activity\
  \ 将调用第二个碎片的 `changeTextProperties()` 方法，该方法将修改 `TextView` 以反映新的文本和字体大小：\n\n![](img/as_fragment_example_running.jpg)\n\
  \n图 31-10\n\n### 31.10 总结\n\n本章的目标是创建一个示例项目，演示在 Android 应用程序中使用碎片的步骤。涵盖的主题包括使用 Android\
  \ Support Library 以与引入碎片之前的 Android 版本保持兼容，包括在 activity 布局中的碎片，以及实现碎片间的通信。\n\n###\
  \ 32. 带有 Jetpack 的现代 Android 应用程序架构\n\n多年来，Google 并没有推荐构建 Android 应用程序的特定方法，而是提供工具和开发包，让开发者决定什么方法对特定项目或个人编程风格最有效。这种情况在\
  \ 2017 年随着 Android Architecture Components 的引入而发生了变化，这些组件随后在 2018 年发布时成为了 Android\
  \ Jetpack 的一部分。\n\n本章提供了 Jetpack 概念、Android 应用架构建议以及一些关键架构组件的概述。在涵盖基础知识后，这些主题将在后续章节中进行详细介绍，并通过实际示例进行演示。\n\
  \n#### 32.1 什么是 Android Jetpack？\n\nAndroid Jetpack 由 `Android Studio`、Android Architecture\
  \ Components、Android Support Library 以及一组关于 Android App 应该如何结构的指南组成。Android Architecture\
  \ Components 的设计是为了在开发 Android 应用时能够更快、更方便地执行常用任务，同时符合架构指南的核心原则。\n\n虽然本书将涵盖所有的 Android\
  \ Architecture Components，但本章将重点关注关键架构指南以及 `ViewModel`、`LiveData` 和 `Lifecycle`\
  \ 组件，同时引入 `Data Binding` 和 `Repositories`（仓库）。\n\n在继续之前，重要的是理解 Jetpack 应用开发方法是可选的。虽然这种方法强调了多年来流行的其他技术的某些缺点，但\
  \ Google 并没有完全谴责那些应用程序的开发方法。Google 的立场是，虽然开发应用没有绝对的对错，但存在一种推荐的方法。\n\n### 32.2 “旧”架构\n\
  \n在题为 “在 Android Studio 中创建示例 Android 应用” 的章节中，创建了一个由单个 activity 组成的 Android 项目，该\
  \ activity 包含了显示和管理用户界面的所有代码，以及应用程序的后端逻辑。在 Jetpack 引入之前，最常见的架构遵循这种范式，即应用程序由多个 activity（每个应用内的每个屏幕对应一个）组成，每个\
  \ activity 类在某种程度上都混合了用户界面和后端代码。\n\n这种方法导致了一系列与应用生命周期相关的问题（例如，用户每次旋转设备时 activity\
  \ 都会被销毁并重建，导致任何未保存到持久化存储中的应用数据丢失），以及诸如导航效率低下等问题（用户访问的每个应用屏幕都需要启动一个新的 activity）。\n\
  \n### 32.3 现代 Android 架构\n\n在最基础的层，Google 现在提倡单 activity 应用，其中不同的屏幕作为内容加载到同一个 activity\
  \ 内部。\n\n现代架构指南还建议将应用程序中不同的职责区域划分到完全独立的模块中（这一概念被称为“关注分离”）。这种方法的关键之一是 `ViewModel`\
  \ 组件。\n\n#### 32.4 ViewModel 组件\n\n`ViewModel` 的作用是将应用程序与用户界面相关的数据模型和逻辑，与负责显示、管理用户界面以及与操作系统交互的代码隔离开。当这样设计时，应用程序将由一个或多个\
  \ UI 控制器（如 activity）以及负责处理这些控制器所需数据的 `ViewModel` 实例组成。\n\n`ViewModel` 只知道数据模型和相应的逻辑。它不了解用户界面，也不尝试直接访问或响应与用户界面内视图相关的事件。当\
  \ UI 控制器需要数据进行显示时，它请求 `ViewModel` 提供数据。同样，当用户在用户界面内的视图中输入数据时，UI 控制器将其传递给 `ViewModel`\
  \ 处理。\n\n这种职责的分离解决了与 UI 控制器生命周期相关的问题。无论 UI 控制器在应用的生命周期内重建多频繁，`ViewModel` 实例都会保留在内存中，从而保持数据一致性。例如，activity\
  \ 使用的 `ViewModel` 将一直留在内存中，直到 activity 结束（在单 activity 应用中，这意味着直到应用程序退出）。\n\n![](img/jetpack_diagram_1.jpg)\n\
  \n图 32-1\n\n#### 32.5 LiveData 组件\n\n考虑一个显示实时数据的应用程序，例如金融股票的当前价格。该程序可以使用股票价格 Web\
  \ 服务持续更新 `ViewModel` 中的数据模型以获取最新信息。这种实时数据只有在及时显示给用户时才有用。UI 控制器只有两种方式可以确保在用户界面显示最新数据。一种方案是控制器持续检查\
  \ `ViewModel` 以确定数据自上次显示以来是否发生了变化。然而，这种方法的缺点是效率可能可以提高。为了维持数据馈的实时性，UI 控制器必须在循环中运行，不断检查数据是否变化。\n\
  \n更好的解决方案是让 UI 控制器在 `ViewModel` 内特定数据项发生变化时接收通知。这是通过使用 `LiveData` 组件实现的。`LiveData`\
  \ 是一个允许值变得可观察的数据持有者。简单来说，可观察对象可以在数据发生变化时通知其他对象，从而解决了确保用户界面始终与 `ViewModel` 中的数据保持一致的问题。\n\
  \n\n\n这意味着，例如，一个对 `ViewModel` 值的 UI 控制器可以设置一个观察者，当该值发生变化时，观察者将收到通知。在我们假设的应用程序中，例如，股票将被封装在\
  \ `ViewModel` 中的 `LiveData` 对象中，UI 控制器为该值分配一个观察者，声明一个在值变化时调用的方法。当由数据变化触发时，该方法将从\
  \ `ViewModel` 读取更新后的值并使用它来更新用户界面。\n\n![](img/Jetpack_diagram_2.jpg)\n\n图 32-2\n\n\
  `LiveData` 实例也可以被声明为可变的（mutable），这允许观察实体更新 `LiveData` 对象中持有的底层值。例如，用户可能会在用户界面输入一个值，该值需要覆盖存储在\
  \ `ViewModel` 中的值。\n\n使用 `LiveData` 的另一个关键优势是它可以感知观察者的生命周期状态。例如，如果一个 `activity`\
  \ 包含 `LiveData` 观察者，相应的 `LiveData` 对象将知道 `activity` 生命周期状态何时发生变化并做出相应响应。如果 `activity`\
  \ 处于暂停状态（可能是应用被放入后台），`LiveData` 对象将停止向观察者发送事件。假设 `activity` 刚刚启动或在暂停后恢复。在这种情况下，`LiveData`\
  \ 对象将向观察者发送一个 `LiveData` 事件，以便 `activity` 拥有最新的值。同样，`LiveData` 实例将知道 `activity`\
  \ 何时被销毁并移除观察者以释放资源。\n\n到为止，我们只讨论了 UI 控制器使用观察者的情况。在实践中，观察者可以用于任何符合 Jetpack 生命周期管理方法的对象内部。\n\
  \n### 32.6 ViewModel 状态保存\n\nAndroid 允许用户将运行中的应用放入后台，并在设备上执行其他任务（包括运行其他应用）后返回到该应用。当设备资源不足时，操作系统将通过终止后台应用进程来解决此问题，从最久使用的应用开始。然而，当用户返回到已终止的后台应用时，它应该呈现与被放入后台时相同的状态，无论它之前是否被终止。在与\
  \ `ViewModel` 关联的数据方面，可以使用 `ViewModel Saved State` 模块来实现。该模块允许将值存储在应用的保存状态中，并在发生系统发起的进程终止时进行恢复。这个主题将在后的\
  \ “An Android ViewModel Saved State Tutorial” 章节中介绍。\n\n### 32.7 LiveData 与数据绑定\n\
  \nAndroid Jetpack 包含了数据绑定库（Data Binding Library），它允许 `ViewModel` 中的数据直接映射到 XML 用户界面布局文件中的特定视图。在之前创建的\
  \ `AndroidSample` 项目中，必须编写代码来获取 `EditText` 和 `TextView` 视图的引用，并设置和获取文本属性以反映数据变化。数据绑定允许存储在\
  \ `ViewModel` 中的 `LiveData` 值可以直接在 XML 布局文件中引用，避免了编写代码来保持布局视图更新的需求。\n\n![](img/Jetpack_diagram_3.jpg)\n\
  \n图 32-3\n\n数据绑定将更详细地介绍，从 “An Overview of Android Jetpack Data Binding” 章节开始。\n\n\
  ### 32.8 Android 生命周期\n\n从 Android 组件创建到其被销毁的时间持续称为生命周期。在生命周期期间，组件将在不同的生命周期状态之间切换，这通常在操作系统的控制下并响应用户操作。例如，一个\
  \ `activity` 将从初始化状态开始，过渡到创建状态。一旦 `activity` 运行，它将切换到启动状态，从那里开始它将循环经过各种状态，包括创建、启动、恢复和销毁。\n\
  \n许多 Android 框架类和组件允许其他对象访问它们的当前状态。也可以使用生命周期观察者（Lifecycle observers），以便对象在另一个对象的生命周期状态发生变化时能够接收到通知。`ViewModel`\
  \ 组件在后台使用这种技术来识别观察者何时重启或被销毁。此功能不仅限于 Android 框架和架构组件。它也可以构建在任何使用架构组件包含的一系列生命周期组件的类中。\n\
  \n能够检测并响应其他对象生命周期状态变化的对象被称为感知感知（lifecycle-aware）。相比之下，提供其生命周期状态访问的对象被称为生命周期所有者（lifecycle\
  \ owners）。标题为 \"Working with Android Lifecycle-Aware Components\" 的章节将更详细地介绍生命周期。\n\
  \n### 32.9 Repository 仓库模块\n\n如果 `ViewModel` 从一个或多个外部源（如数据库或网络服务）获取数据，那么将处理这些数据源的代码与\
  \ `ViewModel` 类分离是非常重要的。否则，这会违反关注点分离（separation of concerns）的指南。为了避免将此功能与 `ViewModel`\
  \ 混合，Google 的架构指南建议将此代码放在独立的 `Repository` 仓库模块中。\n\n仓库不是 Android 架构组件，而是由应用开发者创建的\
  \ `Java` 类，负责与各种数据源建立接口。该类为 `ViewModel` 提供接口，允许将数据存储在模型中。\n\n![](img/Jetpack_diagram_4.jpg)\n\
  \n图 32-4\n\n### 32.10 总结\n\n直到最近，Google 倾向于不推荐构建 Android 应用的特定方法。随着 Android Jetpack\
  \ 的推出，情况现在发生了变化，Jetpack 由工具、组件、库和架构指南组成。Google 现在建议将应用项目分为不同的模块，每个模块负责特定的功能区域，即所谓的“关注点分离”。\n\
  \n特别是，指南建议将应用的视图数据模型与处理用户界面的代码分离。此外，负责从网络服务或数据库等数据源收集的代码应该构建在独立的模块模块，而不是与视图模型绑定。\n\
  \nAndroid Jetpack 包含了 Android 架构组件，旨在更轻松地开发符合推荐指南的应用。本章介绍了 `ViewModel`、`LiveData`\
  \ 和 `Lifecycle` 组件。这些将从下一章开始更详细地介绍。本章未提到的其他架构组件将在书后部分介绍。\n\n### 33. 一个 Android ViewModel\
  \ 教程\n\n上一章介绍了 Android Jetpack 的基本概念，并概述了现代 Android 应用架构的基础。Jetpack 定义了一系列建议，描述\
  \ Android 应用项目应该如何构建，同时提供了一系列库和组件，使其更容易符合这些指南，从而用更代码和更少的错误开发可靠的应用。\n\n为了帮助强化和澄清上一章提供的信息，本章将引导你创建一个使用\
  \ `ViewModel` 组件的示例应用项目。下一章将通过包含 `LiveData` 和数据绑定进一步增强此示例。\n\n### 33.1 关于项目\n\n\n\
  \n\n\n在“在 Android Studio 中创建 Android 应用”章节中，创建了一个名为 `AndroidSample` 的项目，该应用的所有代码都封装在\
  \ `Activity` 类中。在接下来的章节中，我们创建了一个 `AVD` 模拟器并用于运行该应用。在应用运行时，我们亲身体会了以这种方式开发应用时出现的问题：当设备旋转时，显示在\
  \ `TextView` 控件上的数据会丢失。本章将使用 `ViewModel` 组件并遵循 Google 应用开发指南以避免 Activity 的复杂性，从而实现一个相同的货币转换器应用。\n\
  \n### 33.2 创建 ViewModel 项目\n\n在创建 `AndroidSample` 项目时，选择了 `Empty Views Activity`\
  \ 模板作为项目的基础。然而，此项目将使用 `Basic Views` 模板。从欢迎界面选择 `New Project` 选项，在弹出的项目对话框中选择 `Basic\
  \ Views Activity` 模板。在 `Name` 字段中输入 `ViewModel`，并指定 `com.ebookfrenzy.viewmodel`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API` 设置为 `26: Android 8.0 (Oreo)`，并将 `Language`\
  \ 设置为 `Java`。\n\n### 33.3 删除不需要的项目内容\n\n正如“Android Studio 布局编辑器指南”所述，`Basic Views\
  \ Activity` 模板包含了项目并不需要的特性。在将 `ViewModel` 添加到项目之前，我们首先需要按照步骤移除导航功能、第二个 fragment\
  \ 和浮动操作按钮：\n\n1. 在 Project 工具窗口中双击 `activity_main.xml` 布局文件，选择浮动操作按钮，并按 delete 键从布局中移除该对象。\n\
  2. 编辑 `MainActivity.java` 文件，从 `onCreate` 方法中删除浮动操作按钮代码，如下所示：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    binding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            Snackbar.make(view, \"Replace with your action\", Snackbar.LENGTH_LONG)\n\
  \                .setView(R.id.fab)\n                .setAction(\"Action\", null).show();\n\
  \        }\n    });\n}\n```\n3. 在 Project 工具窗口中，导航并双击 `res -> navigation -> nav_graph.xml`\
  \ 文件将其加载到导航编辑器中。\n4. 在编辑器中，选择图面板中的 `SecondFragment` 条目并按 delete 键将其移除。\n5. 找到并删除\
  \ `SecondFragment.java` 和 `fragment_second.xml` 文件。\n6. 最后一个任务是从 `FirstFragment`\
  \ 类中移除一些代码，以便 `Button` 视图在点击时不再导航到已不存在的第二个 fragment。编辑 `FirstFragment.java` 文件并移除\
  \ `onViewCreated()` 方法中的代码，使其内容如下：\n\n```java\npublic void onViewCreated(@NonNull\
  \ View view, Bundle savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n\
  \    binding.buttonFirst.setOnClickListener(new View.OnClickListener() {\n     \
  \   @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \                .navigate(R.id.action_FirstFragment_to_SecondFragment);\n     \
  \   }\n    });\n}\n```\n\n### 33.4 设计 Fragment 布局\n\n下一步是设计 fragment 的布局。首先，在 Project\
  \ 工具窗口中找到 `fragment_first.xml` 文件并双击它将其加载到布局编辑器中。布局加载后，选择并删除现有的 `Button`、`TextView`\
  \ 和 `ConstraintLayout` 控件。接下来，在 Component Tree 面板中右键点击 `NestedScrollView` 实例，选择\
  \ `Convert NestedScrollView to ConstraintLayout` 选项，如图 33-1 所示：\n\n![](img/as_convert_to_constaintlayout.jpg)\n\
  图 33-1\n\n选择转换后的 `ConstraintLayout` 控件，使用 Attributes 工具窗口将 `id` 改为 `constraintLayout`。添加一个新的\
  \ `TextView`，将其放置在布局中心，并将 `id` 改为 `resultText`。接下来，从调色板拖入一个 `Number (Decimal)` 视图并放置在现有\
  \ `TextView` 上方。在布局选中该视图，参考 Attributes 工具窗口并将 `id` 改为 `dollarText`。\n\n将一个 `Button`\
  \ 控件拖到布局中，放置在 `TextView` 下方，并将文本属性更改为“Convert”。在按钮仍被选中的情况下，将 `id` 属性更改为 `convertButton`。此时，布局应该类似于图\
  \ 33-2 所示（注意这三个视图已使用垂直链进行了约束）：\n\n![](img/as_view_model_demo_ui.jpg)\n图 33-2\n\n\
  最后，点击布局编辑器右上角的警告图标，并将硬编码的字符串转换为资源。\n\n### 33.5 实现 View Model\n\n完成用户界面布局后，需要在 view\
  \ model 中创建应用的数据模型。首先，在 Project 工具窗口中找到 `com.ebookfrenzy.viewmodeldemo` 条目，右键点击它并选择\
  \ `New -> Java Class` 选项。将新类命名为 `MainViewModel` 并按回车键。编辑新类文件，使其内容如下：\n\n```java\n\
  package com.ebookfrenzy.viewmodeldemo.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate = 0.74F;\n    private String dollarText = \"\";\n    private Float result\
  \ = 0F;\n\n    public void setAmount(String value) {\n        this.dollarText =\
  \ value;\n        result = Float.parseFloat(dollarText) * rate;\n    }\n\n    public\
  \ Float getResult() {\n        return result;\n    }\n}\n```\n\n该类声明了变量来存储当前的美元值和转换后的金额，并提供了访问这些值的\
  \ getter 和 setter 方法。调用时，`setAmount()` 方法接收当前金额作为参数并将其存储在本地变量 `dollarText`。相反，`getResult()`\
  \ 方法返回赋值给 `result` 变量的值。\n\n### 33.6 将 Fragment 与 ViewModel 关联\n\nfragment 需要某种方式获取\
  \ `ViewModel` 的引用以访问模型并观察数据变化。Fragment 或 Activity 使用 `ViewModelProvider` 实例维护它们所依赖的\
  \ `ViewModels`。\n\n在 Fragment 中使用 `ViewModelProvider` 类创建 `ViewModelProvider` 实例。调用时，类初始化器接收当前\
  \ `Fragment` 或 `Activity` 的引用并返回如下 `ViewModelProvider` 实例：\n\n```java\nViewModelProvider\
  \ viewModelProvider = new ViewModelProvider(this);\n```\n\n一旦创建了 `ViewModelProvider`\
  \ 实例，可以使用索引值请求特定的 `ViewModel` 类。提供者将会创建该 `ViewModel` 类的新实例或返回现有实例，例如：\n\n```java\n\
  ViewModel viewModel = viewModelProvider.get(MainViewModel.class);\n```\n\n编辑 `FirstFragment.java`\
  \ 文件并重写 `onCreate()` 方法以设置 `ViewModelProvider`：\n\n```java\nimport androidx.lifecycle.ViewModelProvider;\n\
  import androidx.annotation.Nullable;\n\npublic class FirstFragment extends Fragment\
  \ {\n    private MainViewModel viewModel;\n\n    @Override\n    public void onCreate(@Nullable\
  \ Bundle savedInstanceState) {\n```\n\n\n\n\n\n```java\nsuper.onCreate(savedInstanceState);\n\
  viewModel = new ViewModelProvider(this).get(MainViewModel.class);\n}\n```\n\n现在可以访问模型视图（model\
  \ view），可以在 Fragment 中添加代码以开始处理数据模型。\n\n### 33.7 修改 Fragment\n\n需要更新 fragment 类以响应按钮点击并与存储在\
  \ `ViewModel` 中的数据值进行交互。该类还需要对用户界面布局中三个视图的引用，以便响应按钮点击、提取当前的美元值并显示转换后的货币金额。\n\n在题为在\
  \ Android Studio 中创建一个 Android 示例应用的章节中，使用了 `Button` 控件的 `onClick` 属性来指定当用户点击按钮时调用的方法。遗憾的是，此属性只能调用\
  \ `Activity` 上的方法，而不能用于调用 `Fragment` 中的方法。为了克服这一局限性，我们必须在 `Fragment` 类中添加一些代码，为按钮设置\
  \ `onClick` 监听器。如下所示，可以在 `FirstFragment.java` 文件的 `onViewCreated()` 生命周期方法中实现这一目标：\n\
  \n```java\npublic class MainFragment extends Fragment {\n    private MainViewModel\
  \ viewModel;\n\n    @Override\n    public void onViewCreated(@NonNull View view,\
  \ @Nullable Bundle savedInstanceState) {\n        super.onViewCreated(view, savedInstanceState);\n\
  \        binding.convertButton.setOnClickListener(v -> {\n\n        });\n    }\n\
  }\n```\n\n添加监听器后，每当用户点击按钮时，位于 `onClick()` 方法中的任何代码都会被调用。\n\n## 33.8 访问 ViewModel\
  \ 数据\n\n点击按钮时，`onClick()` 方法需要从 `EditText` 视图读取当前值，确认字段不为空，然后调用 `ViewModel` 实例的\
  \ `setAmount()` 方法。随后，该方法需要调用 `ViewModel` 的 `getResult()` 方法并将转换后的值显示在 `TextView`\
  \ 控件上。\n\n由于项目中尚未使用 `LiveData`，因此每次创建 `Fragment` 时，都有必要从 `ViewModel` 获取最新的结果值。\n\
  \n继续在 `FirstFragment.java` 文件中，按照如下方式在 `onViewCreated()` 方法中实现这些要求：\n\n```java\n\
  import java.util.Locale;\n\n@Override\npublic void onViewCreated(@NonNull View view,\
  \ @Nullable Bundle savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n\
  \    binding.resultText.setText(String.format(Locale.ENGLISH,\"%.2f\",\n       \
  \     viewModel.getResult()));\n    binding.convertButton.setOnClickListener(v ->\
  \ {\n        if (!binding.dollarText.getText().toString().equals(\"\")) {\n    \
  \        viewModel.setAmount(String.format(Locale.ENGLISH,\"%s\",\n            \
  \        binding.dollarText.getText()));\n            binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n                    viewModel.getResult()));\n        } else {\n      \
  \      binding.resultText.setText(\"No Value\");\n        }\n    });\n}\n```\n\n\
  ### 33.9 测试项目\n\n完成此开发阶段后，在模拟器或物理设备上构建并运行应用，输入美元值并点击 `Convert` 按钮。转换后的金额应出现在 `TextView`\
  \ 上，这表明 UI 控制器和 `ViewModel` 的重构按预期工作。\n\n当运行原始的 `AndroidSample` 应用时，旋转设备会导致 `resultText`\
  \ `TextView` 控件上显示的值丢失。现在使用 `ViewModelDemo` 应用重复此测试，并注意旋转后当前的欧元值仍被保留。这是因为当 `Fragment`\
  \ 被销毁和重建时，`ViewModel` 留留在内存中，并且在 `onViewCreated()` 方法中添加了代码以用结果数据值更新 `TextView`。\n\
  \n### 33.10 总结\n\n在本章中，我们回顾了 `Fragment` 和 `ViewModel`。我们演示了如何使用 `ViewModel` 处理跨配置更改的数据。\n\
  \n## 34.1 LiveData - 回顾\n\n`LiveData` 在[“现代 Android 架构”（#Modern_Architecture_Jetpack)章节引入。它是一个观察的数据持有者类，允许\
  \ UI 响应变化。\n\n## 34.2 为 ViewModel 添加 LiveData\n\n启动 Android Studio，打开上一章节创建的 `ViewModelDemo`\
  \ 项目，并打开 `MainViewModel.java`，其目前内容如下：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo;\n\
  \nimport androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final Float rate = 0.74;\n    private String dollarText\
  \ = \"\";\n    private Float result = 0F;\n\n    public void setAmount(String value)\
  \ {\n        this.dollarText = value;\n        result = Float.parseFloat(dollarText)*rate;\n\
  \    }\n\n    public Float getResult() {\n        return result;\n    }\n}\n```\n\
  \n本章的此阶段旨在 `result` 变量封装在 `LiveData` 实例中（该对象需要是可变的，以便在用户每次请求货币转换时更改值）。从修改类开始，使其变为如下所示，注意在使用\
  \ `LiveData` 时需要导入额外的包：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo;\n\nimport\
  \ androidx.lifecycle.MutableLiveData;\nimport androidx.lifecycle.ViewModel;\n\n\
  public class MainViewModel extends ViewModel {\n    private static final Float rate\
  \ = 0.74;\n    private String dollarText = \"\";\n    private Float result = 0F;\n\
  \    final private MutableLiveData<Float> result = new MutableLiveData<>();\n\n\
  \    public void setAmount(String value) {\n        this.dollarText = value;\n \
  \       result = Float.parseFloat(dollarText)*rate;\n    }\n\n    public Float getResult()\
  \ {\n        return result;\n    }\n}\n```\n\n\n\n\n既然 `result` 变量现在包含在一个可变的 `LiveData`\
  \ 实例中，那么 `setAmount()` 和 `getResult()` 方法都必须进行修改。在 `setAmount()` 方法中，不能再使用赋值运算符\
  \ (`=`) 为 `result` 变量赋值了。相反，必须调用 `LiveData.setValue()` 方法，并将新值作为参数传递。按照目前的实现，`getResult()`\
  \ 方法声明为返回 `Float` 值，必须更改为返回 `MutableLiveData` 对象。完成这些剩余更改后将得到如下类文件：\n\n```java\n\
  package com.ebookfrenzy.viewmodeldemo;\n\nimport androidx.lifecycle.MutableLiveData;\n\
  \nimport androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n\n    private static final Float rate = 0.74F;\n\n    private String dollarText\
  \ = \"\";\n\n    final private MutableLiveData<Float> result = new MutableLiveData<>();\n\
  \n    public void setAmount(String value) {\n        this.dollarText = value;\n\
  \        result = Float.parseFloat(dollarText)*rate;\n        result.setValue(Float.parseFloat(dollarText)*rate);\n\
  \    }\n\n    public Float getResult()\n    public MutableLiveData<Float> getResult()\
  \ {\n        return result;\n    }\n}\n```\n\n### 34.3 实现观察者\n\n现在转换结果已包含在 `LiveData`\
  \ 实例中，下一步是在 UI 控制器中配置观察者，在例例中它是 `FirstFragment` 类。找到 `FirstFragment.java` 类（`app\
  \ -> java -> <package name> -> FirstFragment`），双击它将其加载到编辑器，并修改 `onViewCreated()`\
  \ 方法以创建一个名为 `resultObserver` 的新 `Observer` 实例：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo;\n\
  \nimport androidx.lifecycle.Observer;\n\n.\n.\n\n@Override\npublic void onViewCreated(@NonNull\
  \ View view, @Nullable Bundle savedInstanceState) {\n    super.onViewCreated(view,\
  \ savedInstanceState);\n    binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n            viewModel.getResult()));\n    final Observer<Float> resultObserver\
  \ = new Observer<Float>() {\n        @Override\n        public void onChanged(@Nullable\
  \ final Float result) {\n            binding.resultText.setText(String.format(Locale.ENGLISH,\n\
  \                    \"%.2f\", result));\n        }\n    };\n.\n.\n}\n```\n\n`resultObserver`\
  \ 实例声明了 `onChanged()` 方法，当该方法被调用时，会传入当前的 `result` 值，将其转换为字符串并显示在 `resultText` `TextView`\
  \ 对象上。下一步是将观察者添加到 `result` `LiveData` 对象中，该引用可以通过调用 `ViewModel` 对象的 `getResult()`\
  \ 方法获取。由于现在更新 `result` `TextView` 的责任已由 `onChanged()` 回调方法承担，现在执行此任务的现有代码行可以删除了：\n\
  \n```java\n@Override\npublic void onViewCreated(@NonNull View view, @Nullable Bundle\
  \ savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n  \
  \  binding.resultText.setText(String.format(Locale.ENGLISH,\"%.2f\",\n         \
  \   viewModel.getResult()));\n    final Observer<Float> resultObserver = new Observer<Float>()\
  \ {\n        @Override\n        public void onChanged(@Nullable final Float result)\
  \ {\n            binding.resultText.setText(String.format(Locale.ENGLISH,\n    \
  \                \"%.2f\", result));\n        }\n    };\n    viewModel.getResult().observe(getViewLifecycleOwner(),\
  \ resultObserver);\n    binding.convertButton.setOnClickListener(v -> {\n      \
  \  if (!binding.resultText.getText().toString().equals(\"\")) {\n            viewModel.setAmount(String.format(Locale.ENGLISH,\"\
  %.2f\",\n                    viewModel.getResult()));\n        } else {\n      \
  \      binding.resultText.setText(\"No Value\");\n        }\n    });\n}\n```\n\n\
  ### 34.4 总结\n\n本章演示了使用 `LiveData` 来确保显示内容始终与 `ViewModel` 匹配。这个相对简单的过程是将数据值封装在 `LiveData`\
  \ 中，并在 UI 控制器中设置观察者。每当 `LiveData` 值变化时，观察者就会收到通知。在项目中添加 `LiveData` 支持在某种程度上简化了设计。使用\
  \ Data Binding Library 还可以实现更多且更重要的改进，细节将在下一节中介绍。\n\n### 35. Android Jetpack Data\
  \ Binding 概述\n\n在名为 `使用 Jetpack 构建现代 Android 应用架构 的章节中，我们引入了 Android Data Binding\
  \ 的概念。我们解释了如何使用它将用户界面布局中的视图直接连接到其他对象中的方法和数据，而无需编写代码。本章将提供有关数据绑定的更多细节，重点介绍数据绑定在 Android\
  \ Studio 项目中是如何实现的。下一节的教程（Android Jetpack Data Binding 教程）将提供数据绑定运行的实际示例。\n\n###\
  \ 35.1 数据绑定的概述\n\nAndroid Jetpack Data Binding Library 提供了数据绑定支持，主要提供了一种简单的方法，将用户界面布局中的视图与应用代码存储的数据（通常位于\
  \ `ViewModel` 实例中）连接起来。数据绑定还提供了一种方便的方法，将用户界面控件（如 `Button` 控件）映射到其他对象（如 UI 控制器和 `ViewModel`\
  \ 实例）中的事件和监听方法。\n\n当数据绑定与 `LiveData` 组件结合使用时会变得特别强大。例如，考虑使用数据绑定将 `EditText` 视图绑定到\
  \ `ViewModel` 中的 `LiveData` 变量。通过这种方式连接后，`ViewModel` 中数据值的任何变化将自动显示在 `EditText`\
  \ 视图中，而使用双向绑定时，输入到 `EditText` 中的任何数据都将自动用于更新 `LiveData` 值。最令人印象深刻的是，除了初始设置绑定所需的代码外，无需额外代码即可实现这一点。\n\
  \n### 35.2 数据绑定的关键组件\n\n\n\n\n\nAndroid Studio 项目默认并没有配置数据绑定（data binding）支持。在应用开始使用数据绑定之前，必须结合几个元素。这些元素涉及项目构建配置、布局\
  \ XML 文件、数据绑定类以及数据绑定表达式语言的使用。虽然初看起来看起来可能很复杂，但拆分开来，这些都是非常简单的步骤，一旦完成，在节省编码工作量方面将证明是物所值得的。本章的剩余部分将详细介绍每个元素。在涵盖这些基础知识后，下一章将通过详细的教程来演示这些步骤。\n\
  \n### 35.2.1 项目构建配置\n\n在项目可以使用数据绑定之前，必须配置其使用 Android Data Binding 库，并启用对数据绑定类和绑定语法的支持。幸运的是，这可以通过在模块级\
  \ `build.gradle.kts` 文件中添加几行代码来实现（该文件列在项目工具窗口的 `Gradle Scripts` 下，名为 `build.gradle.kts\
  \ (Module: app)`）。以下列出了一个启用了数据绑定的部分构建文件：\n\n```kotlin\nandroid {\n    buildFeatures\
  \ {\n        dataBinding = true\n    }\n}\n```\n\n### 35.2.2 数据绑定布局文件\n\n正如我们在之前的章节中所看到的，应用的用户界面通常包含在\
  \ XML 布局文件中。在这些布局文件中的视图利用数据绑定之前，必须将布局文件转换为数据绑定布局文件。\n\n正如书早些部分所述，XML 布局文件定义了布局中组件的层次结构，从顶层或根视图开始。无论如何，这个根视图都是布局容器的形式，例如\
  \ `ConstraintLayout`、`FrameLayout` 或 `LinearLayout` 实例，就像 `ViewModelDemo` 项目中的 `fragment_main.xml`\
  \ 文件那样：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/main\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  match_parent\"\n    tools:context=\".ui.main.MainFragment\">\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n要使用数据绑定，布局层次结构必须有一个布局组件作为根视图，该根视图反过来成为当前根视图的父级。\n\n在上述示例的情况下，这需要对现有布局文件进行以下更改：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <androidx.constraintlayout.widget.ConstraintLayout\n        xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n        xmlns:tools=\"http://schemas.android.com/tools\"\n        android:id=\"\
  @+id/main\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </layout>\n```\n\n### 35.2.3 布局文件数据元素\n\n数据绑定布局文件需要某种方式来声明项目中的类，布局中的视图将绑定到这些类（例如\
  \ `ViewModel` 或 UI 控制器）。声明这些类后，布局文件需要一个变量名称以便在绑定表达式中引用这些实例。\n\n这是通过使用 `data` 元素实现的，示例所示：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <data>\n        <variable\n            name=\"myViewModel\"\n           \
  \ type=\"com.ebookfrenzy.myapp.ui.main\" />\n    </data>\n    <androidx.constraintlayout.widget.ConstraintLayout\n\
  \        xmlns:android=\"http://schemas.android.com/apk/res/android\"\n        android:id=\"\
  @+id/main\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  </layout>\n```\n（注：提供的文本在此部分包含了一些碎片化的 XML 逻辑；已进行清理以在保持结构完整性的同时保留原意。）\n\n#### 35.2.4\
  \ 绑定类\n\n对于布局文件中 `data` 元素中引用的每个类，Android Studio 将自动生成对应的绑定类。此 `DataBinding` 的子类将根据布局文件名并使用\
  \ `Binding` 后缀进行命名。因此，名为 `fragment_main.xml` 的布局文件的绑定类将是 `FragmentMainBinding`。绑定类包含布局中指定的绑定，并将它们映射到变量。\n\
  \n尽管生成了绑定类，但必须编写代码来根据数据绑定布局文件创建该类的实例。幸运的是，这可以通过 `DataBindingUtil` 类来实现。\n\nActivity\
  \ 或 Fragment 的初始化代码通常会设置内容视图或“填充”用户界面布局文件。这意味着代码打开布局文件、解析 XML 内存中配置所有视图对象。在现有 Activity\
  \ 类的情况下，实现此目的的代码位于 `onCreate()` 方法中，内容如下：\n\n```java\nsetContentView(R.layout.activity_main);\n\
  ```\n\n在 Fragment 的情况下，这发生在 `onCreateView()` 方法中：\n\n```java\nreturn inflater.inflate(R.layout.fragment_main,\
  \ container, false);\n```\n\n在 Activity 类中创建绑定类实例只需要将初始化代码修改如下：\n\n```java\nActivityMainBinding\
  \ binding;\nbinding = DataBindingUtil.setContentView(this, R.layout.activity_main,\
  \ false);\n```\n\n在 Fragment 的情况下，代码将如下：\n\n```java\nFragmentMainBinding binding;\n\
  binding = DataBindingUtil.inflate(inflater, R.layout.fragment_main, container, false);\n\
  binding.setLifecycleOwner(this);\nView view = binding.getRoot();\nreturn view;\n\
  ```\n\n### 35.2.5 数据绑定变量配置\n\n如上述，数据绑定布局文件包含 `data` 元素，该元素包含由变量名和目标类类型组成的 `variable`\
  \ 元素。例如：\n\n```xml\n<data>\n    <variable\n        name=\"viewModel\"\n        type=\"\
  com.ebookfrenzy.viewmodeldemo.ui.main.MainViewModel\" />\n    <variable\n      \
  \  name=\"uiController\"\n        type=\"com.ebookfrenzy.viewmodeldemo_databinding.ui.main.MainFragment\"\
  \ />\n</data>\n```\n\n\n\n\n\n在上面的示例中，第一个变量知道它将绑定到类型为 `MainViewModel` 的 `ViewModel`\
  \ 类实例，但尚未连接到实际的 `MainViewModel` 对象实例。这需要一个额外的步骤，即将在 app 内部使用的 `MainViewModel` 实例赋值给布局文件中声明的变量。这是通过调用数据绑定实例的\
  \ `setVariable()` 方法实现的，该实例的引用在上一节中已获取：\n\n```java\nMainViewModel mViewModel = new\
  \ ViewModelProvider(this).get(MainViewModel.class);\n\nbinding.setVariable(viewModel,\
  \ mViewModel);\n```\n\n上述数据元素中的第二个变量引用了一个名为 `MainFragment` 的形式的 UI 控制器类。在这种情况下，UI\
  \ 控制器（无论是 `Activity` 还是 `Fragment`）中的代码需要按照如下方式将自己赋值给该变量：\n\n```java\nbinding.setVariable(uiController,\
  \ this);\n```\n\n### 35.2.6 绑定表达式（单向）\n\n绑定表达式定义了特定视图如何与绑定的对象交互。例如，`Button` 上的绑定表达式可以声明在响应点击时调用对象上的哪种方法。或者，绑定表达式可以定义显示在\
  \ `TextView` 中的 `ViewModel` 中存储的数据值，以及如何进行展示和格式化。\n\n绑定表达式使用声明性语言，允许通过逻辑以及对其他类和方法的访问来决定如何使用绑定数据。例如，表达式可以包含数学表达式、方法调用、字符串拼接、数组元素的访问以及比较操作。此外，所有标准的\
  \ Java 语言库都会默认导入，因此许多在 Java 中可以实现的功能也可以在绑定表达式中执行。正如已经讨论过的，数据元素还可以用于导入自定义类以为表达式添加更多功能。\n\
  \n绑定表达式以 `@` 符号开头，随后是用花括号 (`{}`) 包围的表达式。\n\n例如，考虑一个包含名为 `result` 变量的 `ViewModel`\
  \ 实例。假设该类已分配给数据绑定布局文件中的名为 `viewModel` 的变量，并需要绑定到 `TextView` 对象，以便该视图始终显示最新的结果值。如果此值被存储为\
  \ `String` 对象，则在布局文件中的声明如下：\n\n```xml\n<TextView\n    android:id=\"@+id/resultText\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:text=\"@{viewModel.result}\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n在上面的 XML 中，`text`\
  \ 属性被设置为存储在 `viewModel` 对象 `result` `LiveData` 属性中的值。\n\n然而，考虑如果 `result` 在模型中被存储为\
  \ `Float` 值而不是 `String`。如果是这样，上面的表达式会导致编译错误。显然，在 `TextView` 显示它之前，必须将 `Float` 值转换为字符串。为了解决此类问题，绑定表达式可以包含必要的步骤，使用标准\
  \ Java 语言类来完成转换：\n\n```xml\nandroid:text=\"@{String.valueOf(viewModel.result)}\"\
  \n```\n\n在进行此更改后运行应用时，需要注意的是 Android Studio 控制台中可能会出现以下警告：\n\n`warning: myViewModel.result.getValue()\
  \ is a boxed field but needs to be un-boxed to execute String.valueOf(viewModel.result.getValue()).`\n\
  \nJava 中的值可以采取原始值的形式（例如 `boolean` 类型，称为拆箱），或者封装在 Java 对象中（例如 `Boolean` 类型）并通过对对象的引用进行访问（即装箱）。拆箱过程涉及从对象中解出原始值。\n\
  \n为了避免此消息，请如下所示将违规的操作封装在 `safeUnbox()` 调用中：\n\n```xml\nandroid:text=\"@{String.valueOf(safeUnbox(myViewModel.result))}\"\
  \n```\n\n也可以使用字符串拼接。例如，为了在结果字符串值之后包含“dollars”一词，将使用以下表达式：\n\n```xml\nandroid:text='@{String.valueOf(safeUnbox(myViewModel.result))\
  \ + \" dollars\"}'\n```\n\n注意，由于附加的结果字符串被封装在双引号中，因此该表达式现在用单引号进行封装，以避免语法错误。\n\n表达式语法还允许声明三元语句。在下面的表达式中，视图将根据结果值是否大于\
  \ 10 显示不同的文本：\n\n```xml\n@{myViewModel.result > 10 ? \"Out of range\" : \"In range\"\
  }\n```\n\n表达式还可以被构造以访问数据数组中的特定元素：\n\n```xml\n@{myViewModel.resultsArray[3]}\n```\n\
  \n### 35.2.7 绑定表达式（双向）\n\n到目前为止的表达式类型被称为单向绑定。换句话说，随着相应值的变化，布局会不断更新，但从布局内部对值的更改不会更新存储的值。\n\
  \n另一方面，双向绑定允许数据模型响应布局的变化而进行更新。例如，`EditText` 视图可以配置为双向绑定，这样当用户输入不同的值时，该值将用于更新对应的数据模型值。在声明双向表达式时，语法与单向表达式类似，但它以\
  \ `@=` 开头。例如：\n\n```xml\nandroid:text=\"@={viewModel.result}\n```\n\n### 35.2.8\
  \ 事件与绑定\n\n绑定表达式还可以响应视图事件触发方法调用。例如，`Button` 视图可以配置为在点击时调用方法。在“在 Android Studio 中创建示例应用”章节中，例如\
  \ `onClick` 属性被配置为调用类中的方法。在 XML 文件中，表示如下：\n\n```xml\nandroid:onClick=\"convertCurrency\"\
  \n```\n\n`convertCurrency()` 方法按照如下方式声明：\n\n```java\npublic void convertCurrency(View\
  \ view) {\n}\n```\n\n注意，这种类型的方法调用总是会传递事件发生视图的引用。可以使用数据绑定通过表达式来实现相同的效果（假设布局已绑定到名为\
  \ `uiController` 的类）：\n\n```xml\nandroid:onClick=\"@uiController::convertCurrency}\"\
  \n```\n\n另一种选项并且允许向方法传递参数，被称为监听绑定。下面的表达式使用这种方法在 `viewModel` 实例上调用无参数的方法：\n\n```xml\n\
  android:onClick='@{() -> myViewModel.methodOne()}'\n```\n\n下面的表达式调用了一个需要三个参数的方法：\n\
  \n```xml\nandroid:onClick='@{() -> myViewModel.methodTwo(viewModel.result, 10, \"\
  A String\")}'\n```\n\n绑定表达式提供了丰富且灵活的语言，将用户界面视图绑定到其他对象的数据和方法。本章仅讨论了最常用的用例。要了解更多绑定表达式，请查看在线\
  \ Android 文档：\n\nhttps://developer.android.com/topic/libraries/data-binding/expressions\n\
  \n### 35.3 总结\n\nAndroid 数据绑定提供了用户界面布局与应用架构中其他对象的数据和方法之间创建连接的方法。在完成初始配置步骤后，数据绑定涉及在布局文件的视图元素中使用绑定表达式。这些绑定表达式可以是单向的或双向的，还可以用于绑定在响应点击等事件时调的方法。\n\
  \n\n\n\n\n到本书为止，我们已经涵盖了现代 Android 应用架构的基本概念，并详细查看了 `ViewModel` 和 `LiveData` 组件。数据绑定（Data\
  \ Binding）的概念在上一章也已经介绍过，现在将在本中使用它来进一步修改 `ViewModelDemo` 应用。\n\n### 36.1 移除冗余代码\n\
  \n如果你仍然需要，请复制 `ViewModelDemo` 项目文件夹并将其保存为 `ViewModelDemo_LiveData` 以供后续章节。复制完成后，打开原始的\
  \ `ViewModelDemo` 项目，准备实现数据绑定。\n\n在 `ViewModelDemo` 应用中实现数据绑定之前，将通过删除项目中在在本章结束时不再需要的所有代码来演示数据绑定的威力。\n\
  \n启动 Android Studio，打开 `ViewModelDemo` 项目，编辑 `FirstFragment.java` 文件，并按如下修改代码：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo;\n\n.\n.\n\nimport android.arch.lifecycle.Observer;\n\
  \n.\n.\n\npublic class MainFragment extends Fragment {\n    private MainViewModel\
  \ viewModel;\n.\n.\n    @Override\n    public void onViewCreated(@NonNull View view,\n\
  \                             @Nullable Bundle savedInstanceState) {\n        super.onViewCreated(view,\
  \ savedInstanceState);\n        final Observer<Float> resultObserver = new Observer<Float>()\
  \ {\n            @Override\n            public void onChanged(@Nullable final Float\
  \ result) {\n                binding.resultText.setText(String.format(Locale.ENGLISH,\n\
  \                            \"%.2f\", result));\n            }\n        };\n  \
  \      viewModel.getResult().observe(getViewLifecycleOwner(), resultObserver);\n\
  \        binding.convertButton.setOnClickListener(v -> {\n            if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n                viewModel.setAmount(String.format(Locale.ENGLISH,\"%s\"\
  ,\n                        binding.dollarText.getText()));\n            } else {\n\
  \                binding.resultText.setText(\"No Value\");\n            }\n    \
  \    });\n    }\n.\n.\n```\n\n接下来，编辑 `MainViewModel.java` 文件并继续按如下删除代码（同时注意 `dollarText`\
  \ 变量转换为 `LiveData` 的变化）：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo;\n\n\
  import android.arch.lifecycle.MutableLiveData;\nimport android.arch.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate = 0.74F;\n    final public MutableLiveData<String> dollarValue = new MutableLiveData<>();\n\
  \    private String dollarText = \"\";\n    final private public MutableLiveData<Float>\
  \ result = new MutableLiveData<>();\n    public void setAmount(String value) {\n\
  \        this.dollarText = value;\n        result.setValue(Float.valueOf(dollarText)*rate);\n\
  \    }\n\n    public MutableLiveData<Float> getResult()\n    {\n        return result;\n\
  \    }\n}\n```\n\n虽然在实现数据绑定时会增加一些代码，但数据绑定显著减少了需要编写的代码量。\n\n### 36.2 启用数据绑定\n\n使用数据绑定的第一是在\
  \ Android 项目中启用它。这涉及向 `Gradle Scripts -> build.gradle.kts (app)` 文件添加一个新属性。\n\n\
  在 `build.gradle.kts` 文件中，添加以下元素以在项目内启用数据绑定：\n\n```kotlin\nplugins {\n    id(\"com.android.application\"\
  )\n}\nandroid {\n.\n.\n    buildFeatures {\n        viewBinding = true\n       \
  \ dataBinding = true\n    }\n.\n}\n```\n\n一旦添加了该项，编辑器顶部会出现一个条栏，其中包含 `Sync Now`（立即同步）链接。点击它用新的构建配置重新同步项目。\n\
  \n### 36.3 添加布局元素\n\n正如“Android 数据绑定概述”所述，布局层次结构必须有一个 `layout` 组件作为根节点才能使用数据绑定。这需要对\
  \ `fragment_first.xml` 布局（`app -> res -> layout -> fragment_first.xml`）进行以下更改。在布局编辑器中打开此文件，切换到\
  \ `Code` 模式并进行这些更改：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout\
  \ xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <androidx.constraintlayout.widget.ConstraintLayout\n\
  \        xmlns:android=\"http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n        xmlns:tools=\"http://schemas.android.com/tools\"\
  \n        android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        tools:context=\".FirstFragment\"\
  >\n.\n.\n    </androidx.constraintlayout.widget.ConstraintLayout>\n</layout>\n```\n\
  \n完成这些更改后，切换回 `Design` 模式并注意新的根视图虽然在布局画布上不可见，但现在列在组件树中，如图 36-1 所示：\n\n![](img/as_live_data_component_tree.jpg)\n\
  图 36-1\n\n构建并运行应用以验证添加布局元素没有更改用户界面。在构建项目时，你可能会遇到部分内容的错误：\n\n`Duplicate class kotlin.collections.jdk8.Collections8\
  \ found in modules`\n\n此错误是由 Android Studio 构建工具链引起的，可以通过对 `build.gradle.kts (Module:\
  \ app)` 文件进行以下更改来解决：\n\n```kotlin\ndependencies {\n.\n.\n    implementation(platform(\"\
  org.jetbrains.kotlin:kotlin-bom:1.8.0\"))\n}\n```\n\n## 36.4 在布局文件中添加数据元素\n\n将布局文件转换为数据绑定布局文件的下一步是添加\
  \ `data` 元素。在本示例中，布局将绑定 `MainViewModel`，因此编辑 `fragment_first.xml` 文件添加如下 `data`\
  \ 元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <data>\n\
  \        <variable\n            name=\"myViewModel\"\n            type=\"com.ebookfrenzy.viewmodeldemo.MainViewModel\"\
  \ />\n    </data>\n    <androidx.constraintlayout.widget.ConstraintLayout\n    \
  \    android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\n```\n\
  *(注：提供的文本在此处截断，翻译已根据现有内容完成)*\n\nandroid:layout_height=\"match_parent\" tools:context=\"\
  .FirstFragment\n\n构建并重新运行应用以确保更改生效。\n\n## 36.5 使用绑定类工作\n\n下一步是修改 `FirstFragment.java`\
  \ 代码以填充数据绑定。这通过重写 `onCreateView()` 方法实现最好：\n\n```java\n.\n.\nimport androidx.databinding.DataBindingUtil;\n\
  import com.ebookfrenzy.viewmodeldemo.R;\n.\n.\n\npublic class MainFragment extends\
  \ Fragment {\n.\n.\n    @Override\n    public View onCreateView(@NonNull LayoutInflater\
  \ inflater, @Nullable ViewGroup container,\n                             @Nullable\
  \ Bundle savedInstanceState) {\n        binding = FragmentMainBinding.inflate(inflater,\
  \ container, false);\n        binding = DataBindingUtil.inflate(\n            inflater,\
  \ R.layout.fragment_first, container, false);\n        binding.setLifecycleOwner(this);\n\
  \        return binding.getRoot();\n    }\n.\n.\n}\n```\n\n\n\n\n```java\ninflater,\
  \ R.layout.fragment_first, container, false);\n```\n\n绑定对象在内存中的存在时间应与 fragment 的存在时间一致。为了确保在\
  \ fragment 移除时销毁实例，将当前 fragment 声明为绑定对象的生命周期所有者（lifecycle owner）。\n\n```java\nbinding.lifecycleOwner\
  \ = this;\n\nreturn binding.getRoot\n```\n\n### 36.6 将 ViewModel 实例赋值给数据绑定变量\n\n\
  此时，数据绑定已经知道它将绑定到类型为 `MainViewModel` 的类实例，但尚未连接到实际的 `MainViewModel` 对象。这需要一个额外的步骤：将\
  \ App 中使用的 `MainViewModel` 实例赋值给布局文件中声明的 `viewModel` 变量。将所示所示代码添加到 `FirstFragment.java`\
  \ 文件的 `onViewCreated()` 方法中：\n\n```java\nimport static com.ebookfrenzy.viewmodeldemo.BR.myViewModel;\n\
  \n@Override\npublic void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    binding.setVariable(myViewModel,\
  \ viewModel);\n}\n```\n\n如果 Android Studio 显示 `myViewModel` 为 `undefined`（未定义），请使用\
  \ `Build -> Make Project` 选项重新构建项目以强制生成类。完成这些更改后，下一步是在数据绑定布局文件的视图元素中插入一些绑定表达式。\n\
  \n### 36.7 添加绑定表达式\n\n第一个绑定表达式将 `resultText` TextView 绑定到模型视图中的结果值。编辑 `fragment_first.xml`\
  \ 文件，找到 `resultText` 元素，并修改 `text` 属性，使元素内容如下：\n\n```xml\n<TextView\n    android:id=\"\
  @+id/resultText\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:text=\"TextView\"\n    android:text='@{safeUnbox(myViewModel.result)\
  \ == 0.0 ? \"Enter value\" : String.valueOf(safeUnbox(myViewModel.result)) + \"\
  \ euros\"}'\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n该表达式首先检查结果值当前是否为零，如果是，则显示一条指示用户输入值的消息。然而，如果结果不为零，则将该值转换为字符串，并与“euros”一词拼接，然后显示给用户。\n\
  \n结果值只需要单向绑定，因为布局永远不需要更新存储在 `ViewModel` 中的值。相比之下，`dollarValue` EditText 视图需要使用双向绑定，以便根据用户输入的最新值更新数据模型，并在发生（如由于设备旋转触发的）生命周期事件时，允许当前值在视图中重新显示。现在，`dollarText`\
  \ 元素应声明如下：\n\n```xml\n<EditText\n    android:id=\"@+id/dollarText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginTop=\"\
  96dp\"\n    android:ems=\"10\"\n    android:importantForAutofill=\"no\"\n    android:inputType=\"\
  numberDecimal\"\n    android:text=\"@={myViewModel.dollarValue}\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintHorizontal_bias=\"0.502\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n现在添加了这些初始绑定表达式后，必须编写一个方法在用户点击\
  \ `Button` 小部件时执行转换。\n\n### 36.8 添加转换方法\n\n当点击 `Convert` 按钮时，它将调用 `ViewModel` 上的方法来执行转换计算，并将欧元值存入\
  \ `result` `LiveData` 变量。现在在 `MainViewModel.java` 文件中添加此方法：\n\n```java\npublic class\
  \ MainViewModel extends ViewModel {\n    private static final Float usd_to_eu_rate\
  \ = 0.74F;\n    final public MutableLiveData<String> dollarValue = new MutableLiveData<>();\n\
  \    final public MutableLiveData<Float> result = new MutableLiveData<>();\n\n \
  \   public void convertValue() {\n        if ((dollarValue.getValue() != null) &&\n\
  \            !dollarValue.getValue().equals(\"\")) {\n            result.setValue(Float.parseFloat(dollarValue.getValue()));\n\
  \        } else {\n            result.setValue(0F);\n        }\n    }\n}\n```\n\n\
  注意，在没有有效值的情况下，`result` `LiveData` 被赋予零值。这确保了 `resultText` TextView 显示“Enter value”消息。\n\
  \n### 36.9 添加监听器绑定\n\n在测试项目之前的最后一步是为 `Button` 添加监听器表达式以调用 `convertValue()`。在代码模式下再次编辑\
  \ `fragment_first.xml` 文件，找到 `convertButton` 元素，并如下添加 `onClick`：\n\n```xml\n<Button\n\
  \    android:id=\"@+id/convertButton\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:onClick=\"@{() -> myViewModel.convertValue()}\"\
  \n    android:text=\"@string/convert_text\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toBottomOf=\"\
  @+id/resultText\" />\n```\n\n### 36.10 测试应用\n\n编译并运行应用，测试在金额字段中输入值并点击 `Convert`\
  \ 按钮是否会在 `TextView` 中显示正确的结果（带有“euros”后缀），以及在金额字段为空时尝试转换是否会出现“Enter value”提示。此外，验证在设备旋转时信息是否仍然保留。\n\
  \n### 36.11 总结\n\n本章的主要目标是完成配置项目数据数据的步骤，并演示单向、双向和监听表达式的使用。本章还提供了一个实用示例，展示了如何结合 `LiveData`\
  \ 使用数据绑定来连接用户界面视图与应用的后端数据及逻辑。\n\n### 37. 一个 ViewModel 保存状态教程\n\n应用状态的保存和恢复是指在应用置于后台后，为用户提供连续性。用户期望能够从一个应用切换到另一个应用，并在返回原始应用时，发现它仍处于切换前的完全状态。\n\
  \n正如理解 Android 应用和 Activity 生命周期章节所述，当用户将应用放入后台时，如果资源紧张，该应用就有被操作系统终止的可能性。当用户尝试返回已终止的应用时，Android\
  \ 会在新进程中重新启动该应用。由于这一切对用户来说是不可见的，因此应用有责任将其恢复到最初放入后台时的相同状态，而不是以“初始启动”状态呈现。对于基于 `ViewModel`\
  \ 的应用，这种许多行为都可以使用 ViewModel Saved State 模块来实现。\n\n### 37.1 理解 ViewModel 状态保存\n\n\
  \n\n\n正如前几节所述，`ViewModel` 为应用开发带来了许多优势，包括在配置发生变化（如设备旋转）时恢复 UI 状态。要查看此效果，请运行 `ViewModelDemo`\
  \ 应用（或者如果你还需要创建项目，请在 Android Studio 中加载随书示例代码下载的 `ViewModelDemo_LiveData` 项目）。\n\
  \n运行后，输入一个美元金额并将其转换为欧元。在显示美元和欧元数值的情况下，旋转设备或模拟器，并注意当应用响应方向变化后，这两个数值仍然可见。\n\n遗遗憾的是，这种行为并不适用于后台应用进程的终止。在应用仍运行的情况下，点击设备主页键将\
  \ `ViewModelDemo` 应用置于后台，然后通过打开终端工具窗口并运行以下命令来终止它（其中 `<package name>` 是你创建项目时使用的名称，例如\
  \ `com.ebookfrenzy.viewmodeldemo`）：\n\n```\nadb shell am kill <package name>\n```\n\
  \n如果未找到 `adb` 命令，请参阅章节“设置 Android Studio 开发环境” 以获取设置 Android Studio 环境的步骤。\n\n应用被终止后，返回设备或模拟器并在启动器中选择该应用（不要从\
  \ Android Studio 内部重新运行应用）。一旦应用出现，它看起来就像刚刚启动一样，最后输入的美元和欧元数值已经丢失。然而，从用户的角度来看，该应用是从后台恢复的，本应该仍包含原始数据。在这种情况下，应用未能提供用户对\
  \ Android 应用所预期的连续性。\n\n## 37.2 实现 ViewModel 状态保存\n\n基础的 ViewModel 状态保存通过引入 `ViewModel\
  \ Saved State` 库得以实现。该库库扩展了 `ViewModel` 类，以支持在后台进程终止及随后的重新启动期间维持状态。\n\n保存状态的关键是\
  \ `SavedStateHandle` 类，它用于保存和恢复 view model 实例的状态。`SavedStateHandle` 对象包含一个键值映射，允许通过引用相应的键来保存和恢复数据值。\n\
  \n为了支持状态保存，需要声明不同类型的 `ViewModel` 子类，在这种情况下，它包含一个可以接收 `SavedStateHandle` 实例的构造函数。一旦声明，就可以在创建时通过包含\
  \ `SavedStateViewModelFactory` 对象来创建此类类型的 `ViewModel` 实例。考虑以下来自标准 `ViewModel` 声明的代码片段：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  import androidx.lifecycle.MutableLiveData;\n\npublic class MainViewModel extends\
  \ ViewModel {\n.\n.\n}\n```\n\n创建此类类实例的代码可能类似于以下：\n\n```java\nprivate MainViewModel\
  \ mViewModel;\n\nmViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  ```\n\n另一方面，设计用于支持保存状态的 `ViewModel` 子类需要如下声明：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport android.util.Log;\nimport androidx.lifecycle.ViewModel;\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.SavedStateHandle;\n\npublic class MainViewModel extends\
  \ ViewModel {\n    private SavedStateHandle savedStateHandle;\n\n    public MainViewModel(SavedStateHandle)\
  \ {\n        this.savedStateHandle = savedStateHandle;\n    }\n.\n.\n}\n```\n\n\
  当创建上述 `ViewModel` 实例时，必须向 `ViewModelProvider` 传递一个 `SavedStateViewModelFactory`\
  \ 实例：\n\n```java\nSavedStateViewModelFactory factory = \n\nViewModelProvider(this).get;\n\
  ```\n\n## 37.3 保存和恢复状态\n\n可以通过通过 `SavedStateHandle` 实例的 `set()` 方法，从 `ViewModel`\
  \ 内部保存对象或值，并提供引用该值的键：\n\n```java\nprivate final String NAME_KEY = \"Customer\";\n\
  \nset(NAME_KEY);\n```\n\n当与 `LiveData` 配合使用时，引用键后可以使用 `SavedStateHandle` 实例的 `getLiveData()`\
  \ 方法恢复之前保存的值：\n\n```java\ngetLiveData(NAME_);\n```\n\n其他常用的 `SavedStateHandle` 方法包括：\n\
  - `contains(String key)`：返回布尔值，表示保存的状态是否包含该值。\n- `remove(String key)`：从保存状态中移除该值和键。\n\
  - `keys()`：返回保存状态中所有键的集合。\n\n## 37.4 为 ViewModel 项目添加保存状态支持\n\n在涵盖 `ViewModel Saved\
  \ State` 基础之后，可以扩展 `ViewModelDemo` 应用以包含此支持。首先将 `ViewModelDemo` 项目加载到 Android Studio，打开\
  \ `build.gradle.kts` (Module `:app`) 文件并添加保存状态依赖（一如既往，检查是否有可用版本）：\n\n```kotlin\n\
  dependencies {\nimplementation(\"androidx.savedstate:savedstate:1.2\")\nimplementation(\"\
  androidx.lifecycle:lifecycle-viewmodel:2.6\")\n}\n```\n\n接下来，修改 `MainViewModel.java`\
  \ 文件，使构造函数接收并存储 `SavedStateHandle` 实例。此外，导入 `SavedStateHandle`，声明键常量并修改 `result`\
  \ 变量，以便现在从构造函数中的保存状态中获取值：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.ViewModel;\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.SavedStateHandle;\n\npublic class MainViewModel extends\
  \ ViewModel {\n    private static final String RESULT_KEY = \"Euro\";\n    private\
  \ static final Float rate = 0.74F;\n    private String dollarText = \"\";\n    final\
  \ private SavedStateHandle savedStateHandle;\n    final private MutableLiveData<Float>\
  \ result = new MutableLiveData<>();\n\n    public MainViewModel(SavedStateHandle\
  \ savedStateHandle) {\n        this.savedStateHandle = savedStateHandle;\n     \
  \   result = savedStateHandle.getLiveData(RESULT_KEY);\n    }\n}\n```\n\n在 `MainViewModel.java`\
  \ 文件中，修改 `setAmount()` 方法，以便在每次计算新的欧元金额时保存结果值：\n\n```java\npublic void setAmount(String\
  \ value) {\n    this.dollarText = value;\n    result.setValue(Float.valueOf(dollarText)\
  \ * rate);\n    Float convertedValue = Float.parseFloat(dollarText) * rate;\n  \
  \  result.setValue(convertedValue);\n    savedStateHandle.set(RESULT_KEY, convertedValue);\n\
  }\n```\n\n完成 `ViewModel` 的更改后，打开 `FirstFragment.java` 文件进行以下更改，以便在创建 `ViewModel`\
  \ 的过程中包含 `SavedState` 工厂实例：\n\n```java\nimport androidx.lifecycle.SavedStateViewModelFactory;\n\
  \n@Override\npublic void onCreate(@Nullable Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    SavedStateViewModelFactory factory = \n        new SavedStateViewModelFactory(getActivity().getApplication(),this);\n\
  \    mViewModel = new ViewModelProvider(this, factory).get(MainViewModel.class);\n\
  \    // TODO: 使用 ViewModel\n}\n```\n\n\n\n\n\n当屏幕 UI 填充了美元和欧元数值时，将应用置于后台，使用 `adb`\
  \ 工具终止它，然后从设备或模拟器屏幕上重新启动它。重启后，之前的货币金额仍仍显示在 `TextView` 和 `EditText` 组件中，这表明状态已成功保存并恢复。\n\
  \n### 37.5 总结\n\n一个设计良好的应用在从后台恢复到前台时，应该始终向用户呈现相同的状态，无论操作系统在此期间是否终止了包含该应用的进程。在处理\
  \ `ViewModels` 时，可以通过利用 `ViewModel Saved State` 模块来实现这一点。这涉及修改 `ViewModel` 构造函数以接受一个\
  \ `SavedStateHandle` 实例，该实例反过来可以通过一系列方法调用来保存和恢复数据值。在创建 `ViewModel` 实例时，必须传递一个 `SavedStateViewModelFactory`\
  \ 实例。一旦实现了这些步骤，应用将在后台被终止期间自动保存和恢复状态。\n\n## 38. 与 Android 生命周期周期感知组件一起工作\n\n早前的章节\
  \ “理解 Android 应用和 Activity 生命周期周期” 描述了如何使用生命周期方法来跟踪 UI 控制器（如 activity 或 fragment）内部生命周期状态的变化。这些方法的主要问题之一是它们将处理生命周期变化的负担交给了\
  \ UI 控制器。从表面上看，这似乎是逻辑上的方法，因为 UI 控制器终究是正在经历状态更改的对象。然而，事实是，受状态变化影响的代码通常位于应用中的其他类中。这导致\
  \ UI 控制器中出现了复杂的代码，需要响应生命周期状态的变化来管理和操作其他对象。在遵循 Android 架构指南时，最好能避免这种情况。\n\n一种更清晰、更符合逻辑的方法是，让应用中的对象能够观察其他对象的生命周期状态，并负责根据变化采取任何必要的操作。例如，负责跟踪用户位置的类可以观察\
  \ UI 控制器的生命周期状态，并在控制器进入暂停状态时挂起位置更新。当控制器进入恢复状态时，重新开始跟踪。这是通过与 Android 架构组件捆绑的 `Lifecycle`\
  \ 包所提供的类和接口实现的。\n\n本章将介绍使能够将生命周期感知构建到 Android 应用中的术语和关键组件。\n\n### 38.1 生命周期感知\n\n\
  如果一个对象能够检测并响应应用内其他对象生命周期状态的变化，则称该对象为生命周期感知的。某些 Android 组件（以 `LiveData` 为例）已经是生命周期感知的。通过在类中实现\
  \ `LifecycleObserver` 接口，也可以配置任何类为生命周期感知。\n\n### 38.2 生命周期所有者 (Lifecycle Owners)\n\
  \n生命周期感知组件只能观察生命周期所有者的状态。生命周期所有者实现 `LifecycleOwner` 接口，并分配一个伴的 `Lifecycle` 对象，负责存储组件的当前状态并向生命周期观察者提供状态信息。大多数标准的\
  \ Android Framework 组件（如 activity 和 fragment 类）都是生命周期所有者。自定义类也可以使用 `LifecycleRegistry`\
  \ 类并实现 `LifecycleObserver` 接口配置为生命周期所有者。例如：\n\n```java\npublic class SampleOwner\
  \ implements LifecycleOwner {\n\n    private LifecycleRegistry lifecycleRegistry;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        lifecycleRegistry = new LifecycleRegistry(this);\n\
  \    }\n\n    @NonNull\n    @Override\n    public Lifecycle getLifecycle() {\n \
  \       return lifecycleRegistry;\n    }\n}\n```\n\n除非生命周期所有者另一个生命周期感知组件的子类，否则该类需要通过调用\
  \ `LifecycleRegistry` 类的方法来触发生命周期状态的变化。可以使用 `markState()` 方法来触发传递新状态状态值的生命周期状态变化：\n\
  \n```java\npublic void resuming() {\n    lifecycleRegistry.markState(Lifecycle.State.RESUMED);\n\
  }\n```\n\n上述调用将导致调用相应的事件处理器。或者，可以调用 `LifecycleRegistry.handleLifecycleEvent()` 方法并传递要触发的生命周期事件（这将导致生命周期状态的改变）。例如：\n\
  \n```java\nlifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n```\n\
  \n### 38.3 生命周期观察者 (Lifecycle Observers)\n\n为了观察生命周期所有者的状态，生命周期感知组件必须实现 `DefaultLifecycleObserver`\
  \ 接口，并覆盖它需要观察的任何生命周期变化事件的方法。\n\n```java\npublic class SampleObserver implements\
  \ DefaultLifecycleObserver {\n\n    // 生命周期事件方法重写在这里\n}\n```\n\n然后创建此观察者类的实例并将其添加到\
  \ `Lifecycle` 对象维护的观察者列表中。\n\n```java\ngetLifecycle().addObserver(new SampleObserver());\n\
  ```\n\n如果观察者不再需要跟踪生命周期状态，可以随时从 `Lifecycle` 对象中移除。\n\n图 38-1 展示了提供生命周期感知的关键元素之间的关系：\n\
  \n![](img/lifecycle_component_diagram.jpg)\n\n图 38-1\n\n### 38.4 生命周期状态和事件\n\n当生命周期所有者的状态发生时，分配的\
  \ `Lifecycle` 对象将用新状态更新。在任何时刻，生命周期所有者将处于以下五个状态之一：\n\n- `Lifecycle.State.INITIALIZED`\n\
  - `Lifecycle.State.CREATED`\n- `Lifecycle.State.STARTED`\n- `Lifecycle.State.RESUMED`\n\
  - `Lifecycle.State.DESTROYED`\n\n`Lifecycle` 对象将在组件转换到不同状态时，在添加到列表的观察者上触发事件。在生命周期观察者中可以重写以下事件方法：\n\
  \n- `onCreate()`\n- `onResume()`\n- `onPause()`\n- `onStop()`\n- `onStart()`\n-\
  \ `onDestroy()`\n\n例如，以下代码重写了 `DefaultLifecycleObserver.onResume()` 方法：\n\n```java\n\
  @Override\npublic void onResume(@NonNull LifecycleOwner owner) {\n    // 响应恢复状态事件执行任务\n\
  }\n```\n\n图 38-2 中的流程图说明了生命周期所有者的状态变化序列，以及每次状态转换之间将在观察者上触发的生命周期事件：\n\n![](img/android_lifecycle_states_diagram.jpg)\n\
  \n图 38-2\n\n### 38.5 总结\n\n本章介绍了生命周期感知的基础知识以及包含在 Android Jetpack 中的 Android Lifecycle\
  \ 包。该包包含了用于创建生命周期所有者、观察者和生命周期感知组件的多个类和接口。生命周期所有者分配了一个 `Lifecycle` 对象，该对象维护所有者的状态记录和观察者列表。当所有者的状态更改时，将通过生命周期事件通知观察者以响应变化。\n\
  \n下一章将创建一个 Android Studio 项目，演示如何与创建生命周期感知组件一起工作，包括创建生命周期观察者和所有者，以及处理生命周期状态变化和事件。\n\
  \n\n\n\n\n上一章提供了生命周期感知的概述，并概述了在 Android 项目中实现这一特点的关键类和接口。本章将在此知识库的基础上，通过构建一个 Android\
  \ Studio 项目来突出生命周期感知的实际应用。\n\n## 39.1 创建示例生命周期项目\n\n从欢迎界面选择`New Project`（新建项目）快速启动选项，在生成的新项目对话框中，点击`Next`（下一步）按钮之前选择`Empty\
  \ Views Activity`模板。\n\n在`Name`（名称）字段中输入`LifecycleDemo`，指定`com.ebookfrenzy.lifecycledemo`为包名。在点击`Finish`（完成）按钮之前，将`Minimum\
  \ API level`（最低 API 级别）设置为`API 26: Android 8.0 (Oreo)`，并将`Language`（语言）菜单设置为`Java`。\n\
  \n## 39.2 创建生命周期观察者\n\n如之前讨论过的，活动（Activities）和片段（Fragments）已经实现了`LifecycleOwner`接口，并已准备好被其他对象观察。为了在实践中查看这一点，教程的下一步是向项目中添加一个新类，该类将能够观察`MainActivity`实例。\n\
  \n要添加新类，在项目工具窗口中右键点击`app` -> `java` -> `com.ebookfrenzy.lifecycledemo`，并在生成的菜单中选择`New`（新建）\
  \ -> `Java Class...`。在`New Class`对话框中，将类命名为`DemoObserver`并按下键盘上的`Return`键以创建`DemoObserver.java`文件。该新文件将自动在编辑器中打开，其内容如下：\n\
  \n```java\npackage com.ebookfrenzy.lifecycledemo;\n\npublic class DemoObserver {\n\
  \n}\n```\n\n在编辑器编辑器中，修改类文件以声明它将实现`DefaultLifecycleObserver`接口：\n\n```java\npackage\
  \ com.ebookfrenzy.lifecycledemo;\n\nimport androidx.lifecycle.DefaultLifecycleObserver;\n\
  \npublic class DemoObserver implements DefaultLifecycleObserver {\n\n}\n```\n\n\
  下一步是重写`DefaultLifecycleObserver`类的生命周期方法。对于此示例，所有事件都将被处理，每个事件都会向`Logcat`面板输出一条显示事件类型的消息。按照以下列表所示更新观察者类：\n\
  \n```java\npackage com.ebookfrenzy.lifecycledemo;\n\nimport android.util.Log;\n\
  import androidx.annotation.NonNull;\nimport androidx.lifecycle.LifecycleOwner;\n\
  \n.\n\n.\n\npublic class DemoObserver implements DefaultLifecycleObserver {\n\n\
  \    private String LOG_TAG = \"DemoObserver\";\n\n    @Override\n    public void\
  \ onCreate(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onCreate\"\
  );\n    }\n\n    @Override\n    public void onResume(@NonNull LifecycleOwner owner)\
  \ {\n        Log.i(LOG_TAG, \"onResume\");\n    }\n\n    @Override\n    public void\
  \ onPause(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onPause\");\n\
  \    }\n\n    @Override\n    public void onStart(@NonNull LifecycleOwner owner)\
  \ {\n        Log.i(LOG_TAG, \"onStart\");\n    }\n\n    @Override\n    public void\
  \ onStop(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onStop\");\n\
  \    }\n\n    @Override\n    public void onDestroy(@NonNull LifecycleOwner owner)\
  \ {\n        Log.i(LOG_TAG, \"onDestroy\");\n    }\n}\n```\n\n完成`DemoObserver`类后，下一步是将其作为观察者添加到`MainActivity`类中。\n\
  \n### 39.3 添加观察者\n\n观察者通过调用所有者的`Lifecycle`对象的`addObserver()`方法来添加，该对象的引用是通过调用`getLifecycle()`方法获取的。编辑`MainActivity.java`类文件并编辑`onCreate()`方法以添加观察者：\n\
  \n```java\n.\n\n.\n\nimport com.ebookfrenzy.lifecycledemo.DemoObserver;\n\n.\n\n\
  .\n\n@Override\npublic void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    getLifecycle().addObserver(new\
  \ DemoObserver());\n}\n```\n\n创建观察者类并将其 le 到生命周期所有者的`Lifecycle`对象后，应用已准备好进行测试。\n\
  \n### 39.4 测试观察者\n\n由于`DemoObserver`类向`Logcat`控制台输出诊断信息，如果配置了过滤器仅显示`DemoObserver`消息，将更容易看到输出。使用之前在[“通过示例理解\
  \ Android 活动状态变化”]中概述的步骤，显示`Logcat`面板并在过滤器字段中输入以下键：\n\n`package:mine tag:DemoObserver`\n\
  \n在应用成功启动后，`Logcat`输出应指示以下生命周期状态变化和事件：\n\n`onCreate`\n`onStart`\n`onResume`\n\n\
  在应用仍运行时，执行旋转以触发活动的销毁和重建，生成以下内容：\n\n`onPause`\n`onStop`\n`onDestroy`\n\n## 39.5 创建生命周期所有者\n\
  \n本章的最后一个任务是创建一个自定义生命周期所有者。在项目工具窗口中右键点击`app` -> `java` -> `com.ebookfrenzy.lifecycledemo`并选择`New`\
  \ -> `Java Class...`添加新类。在按下键盘键之前将类命名为`DemoObserver`。在编辑器中加载`DemoObserver.java`文件后，对其如下修改：\n\
  \n```java\npackage com.ebookfrenzy.lifecycledemo;\n\nimport androidx.lifecycle.DefaultLifecycleObserver;\n\
  \npublic class DemoObserver implements DefaultLifecycleObserver {\n}\n```\n\n该类需要一个初始化为自身的`LifecycleRegistry`实例和一个`getLifecycle()`方法。声明一个变量存储`LifecycleRegistry`、一个初始化`LifecycleRegistry`的构造函数并添加`getLifecycle()`方法：\n\
  \n```java\npublic class DemoObserver implements LifecycleOwner {\n    private LifecycleRegistry\
  \ lifecycleRegistry;\n\n    public DemoObserver() {\n        lifecycleRegistry =\
  \ new LifecycleRegistry(this);\n    }\n\n    @NonNull\n    @Override\n    public\
  \ Lifecycle getLifecycle() {\n        return lifecycleRegistry;\n    }\n}\n```\n\
  \n接下来，类必须通知注册表状态变化。可以通过使用`LifecycleRegistry`的`markState()`方法标记状态或使用`handleLifecycleEvent()`方法触发事件。自定义类中什么是状态变化取决于类的用途。对于此示例，我们将添加一些在调用时触发生命周期事件的方法：\n\
  \n```java\n.\n\n.\n\nprivate final LifecycleRegistry lifecycleRegistry;\n\n.\n\n\
  .\n\npublic void startOwner() {\n    lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n\
  }\n\npublic void stopOwner() {\n    lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_STOP);\n\
  }\n\n@NonNull\n@Override\npublic Lifecycle getLifecycle() {\n    return lifecycleRegistry;\n\
  }\n```\n\n`DemoOwner`类中的最后一个更改是将`DemoObserver`类作为观察者添加。此调用将通过向类添加以下构造函数来实现：\n\n\
  ```java\npublic DemoOwner() {\n    lifecycleRegistry = new LifecycleRegistry(this);\n\
  \    getLifecycle().addObserver(new DemoObserver());\n}\n```\n\n将`MainActivity.java`文件加载到代码编辑器，定位到`onCreate()`方法，并添加代码创建`DemoOwner`类的实例并调用`startOwner()`和`stopOwner()`方法。请注意，添加观察者的调用已被移除。虽然单个观察者可以使用多个所有者，在本例中移除它是为了避免`Logcat`工具窗口中出现重复且混淆的输出：\n\
  \n```java\n.\n\n.\n\nimport com.ebookfrenzy.lifecycledemo.DemoOwner;\n\n.\n\n.\n\
  ```\n\n\n\n\n\n```java\nprivate DemoOwner demoOwner;\n\n@Override\npublic void onViewCreated(@NonNull\
  \ View view, @Nullable Bundle savedInstanceState) {\n    super.onViewCreated(view,\
  \ savedInstanceState);\n    demoOwner = new DemoOwner();\n    demoOwner.startOwner();\n\
  \    demoOwner.stopOwner();\n    getLifecycle().addObserver(new DemoObserver());\n\
  }\n```\n\n### 39.6 测试自定义生命周期所有者\n\n最后一次构建并运行应用，参考 Logcat 工具窗口，并确认观察者是否按照以下顺序检测到创建、启动和停止生命周期事件：\n\
  \n- `onCreate`\n- `onStart`\n- `onStop`\n\n注意，尽管没有在 `DemoOwner` 类中添加代码来手动执行这些操作，但“创建”（created）状态的变化仍然被触发了。这些变化是在所有者实例首次被创建以及处理\
  \ `ON_STOP` 事件时自动触发的。\n\n### 39.7 总结\n\n本章提供了在 Android 应用中实现生命周期感知的实用演示，包括创建生命周期观察者以及设计并实现一个基础生命周期所有者类。\n\
  \n# 40. 导航架构组件概览\n\n如今很少有 Android 应用仅包含单个屏幕。事实上，大多数应用包含多个屏幕，用户通过屏幕手势、按钮点击和菜单选择在这些屏幕间进行导航。在\
  \ Android Jetpack 引入之前，在应用内实现导航很大程度上是一个手动编码的过程，没有简单的方法来查看和组织可能复杂的导航路径。然而，随着 Android\
  \ 导航架构组件的引入，结合 Android Studio 对导航图的支持，这种情况得到了显著改善。\n\n### 40.1 理解导航\n\n每个应用都有一个主屏幕，该主屏幕在应用启动且任何启动屏出现后显示（启动屏是应用加载时临时显示的应用品牌屏幕）。用户通常从这个主屏幕执行任务，从而导致其他其他屏幕。这些屏幕通常以应用内其他活动（Activity）和碎片（Fragment）的形式存在。例如，消息应用可能有一个列出当前消息的主屏幕，用户可以从那里导航到另一个屏幕来访问联系人列表或设置屏幕。联系人列表屏幕可能会允许用户导航到其他屏幕，在其中可以添加新用户或更新现有的联系人。从图形上看，应用的导航图可以如图\
  \ 40-1 所示表示：\n\n![](img/jetpack_navigation_graph_diagram.jpg)\n\n图 40-1\n\n构成应用的每个屏幕（包括主屏幕）被称为“目的地”（destination），它通常是一个碎片或活动。Android\
  \ 导航架构使用导航栈（navigation stack）来跟踪用户在应用内目的地之间的路径。当应用首次启动时，主屏幕是第一个被放入栈中的目的地，并成为当前目的地。当用户导航到另一个目的地时，该屏幕将成为当前目的地并推入栈中主目的地之上。当用户导航到其他屏幕时，它们也会被推入栈中。例如，图\
  \ 40-2 显示了假设的消息应用在用户启动应用并导航到“添加联系人”屏幕后导航栈的当前状态：\n\n![](img/jetpack_navigation_stack_diagram.jpg)\n\
  \n图 40-2\n\n当用户使用系统返回键在屏幕间返回导航时，每个目的地都会从栈中弹出，直到主屏幕再次成为栈上唯一的目的地。在图 40-3 中，用户从“添加联系人”屏幕返回，将其从栈中弹出，并使联系人列表屏幕成为当前目的地：\n\
  \n![](img/jetpack_navigation_stack_pop_diagram.jpg)\n\n图 40-3\n\n在目的地之间导航和管理导航栈的所有工作都由导航控制器处理，由\
  \ `NavController` 类表示。\n\n使用导航架构组件为 Android 项目添加导航是一个简单的过程，涉及导航宿主（navigation host）、导航图（navigation\
  \ graph）、导航动作（navigation actions）以及少量的代码编写，以获取导航控制器实例的引用并与其交互。\n\n## 40.2 声明导航宿主\n\
  \n导航宿主机嵌入活动用户界面布局中的特殊碎片（`NavHostFragment`），作为用户将导航的目的地的占位符。例如，图 40-4 显示了一个典型的活动屏幕，并突出了由导航宿主碎片表示的区域：\n\
  \n![](img/jetpack_navigation_navhost.jpg)\n\n图 40-4\n\n`NavHostFragment` 可以通过 Android\
  \ Studio 布局编辑器从调色板的容器（Containers）部分拖放实例，或者通过以下方式手动编辑 XML：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<FrameLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/container\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\" >\n\n    <androidx.fragment.app.FragmentContainerView\n        android:id=\"\
  @+id/demo_host_fragment\"\n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        app:defaultNavHost=\"true\"\n        app:navGraph=\"@navigation/navigation_graph\"\
  \ />\n\n</FrameLayout>\n```\n\n上述导航宿主元素中注意的点是 `name` 属性对 `NavHostFragment` 的引用、将\
  \ `defaultNavHost` 设置为 `true` 以及将包含导航图的文件分配给 `navGraph` 属性。\n\n当活动启动时，此导航宿主碎片将被导航图中指定的首页目的地替换。当用户在应用屏幕间导航时，宿主碎片将被对应目的地的相应碎片替换。\n\
  \n## 40.3 导航图\n\n导航图是一个 XML 文件，包含了应用应用导航中的目的地。除了这些目的地之外，文件还包含导航动作，定义了目的地之间的导航以及从一个目的地传递数据到另一个目的地的可选参数。Android\
  \ Studio 包含导航图编辑器，可以使用可视化方式或手动编辑 XML 来设计图并实现动作。\n\n图 40-5 显示了设计模式下的 Android Studio\
  \ 导航图编辑器：\n\n![](img/as_4.1_navigation_graph_editor.jpg)\n\n图 40-5\n\n\n\n\n目的地列表\
  \ (A) 列出了图表中的所有目的地。从列表中选择一个目的地将定位并选中图表中对应的目的地（这对于在大图表中定位特定目的地特别有用）。导航图面板 (B) 包含一个每个目的地的对话框，每个对话框代表用户界面的布局。在这个示例中，此图表包含两个名为\
  \ `mainFragment` 和 `secondFragment` 的目的地。目的地之间的箭头 (C) 表示导航动作连接。通过将鼠标指针悬停在起始点的边缘上直到出现圆圈，然后从圆圈点击并拖动到目的地即可添加动作。属性面板\
  \ (D) 允许查看和修改当前所选目的地或动作连接的属性。在上方图中，显示了动作的属性。通过点击标记为 E 的按钮并从菜单中选择选项可以添加新目的地。可以选择添加现有的\
  \ fragment 或活动（activity）作为目的地，也可以创建新的空白 fragment 目的地。组件树面板 (F) 提供了导航图的层级概述。\n\n\
  通过将编辑器切换到代码（Code）模式，可以查看并修改导航图的底层 XML。以下 XML 列表表示了上方 图 40-5 中所示目的地和动作连接的导航图：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\
  \n    app:startDestination=\"@id/mainFragment\">\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\
  \n        android:label=\"fragment_main\"\n        tools:layout=\"@layout/fragment_main\"\
  \ >\n        <action\n            android:id=\"@+id/mainToSecond\"\n           \
  \ app:destination=\"@id/secondFragment\" />\n    </fragment>\n    <fragment\n  \
  \      android:id=\"@+id/secondFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n        android:label=\"fragment_second\"\n        tools:layout=\"@layout/fragment_second\"\
  \ >\n    </fragment>\n</navigation>\n```\n\n导航图也可以拆分为多个文件，以提高组织结构并促进复用。当采用这种结构时，嵌套图会被嵌入到根图中。要创建嵌套图，按住\
  \ Shift 并点击要嵌套的目的地，右键点击第一个目的地并选择 `Move to Nested Graph -> New Graph`（移动到嵌套图 -> 新图）菜单选项。嵌套图将作为图中的一个新节点出现。双击嵌套图节点可以将图文件加载到编辑器中以访问嵌套图。\n\
  \n## 40.4 访问导航控制器 (Navigation Controller)\n\n从一个目的地导航到另一个目的地通常是为了响应应用内的某个事件，例如按钮点击或菜单选择。在触发导航动作之前，代码必须先获取导航控制器实例的引用。这需要调用\
  \ `Navigation` 或 `NavHostFragment` 类的 `findNavController()` 方法。例如，下面的代码可以访问 activity\
  \ 的导航控制器。注意，为了使代码生效，activity 必须包含一个导航宿片段（navigation host fragment）：\n\n```\nNavController\
  \ controller =\n    Navigation.findNavController(activity, R.id.demo_nav_host_fragment);\n\
  ```\n\n在这种情况下，方法调用传递了 activity 的引用以及嵌入在 activity 布局中的 `NavHostFragment` 的 ID。\n\n\
  或者，可以通过将该视图（view）传递给方法来识别与任何视图关联的控制器：\n\n```\nNavController controller = Navigation.findNavController(binding.button);\n\
  ```\n\n最后一种选项是通过调用 `NavHostFragment` 类的 `findNavController()` 方法并传递 fragment 的引用来查找\
  \ fragment 的导航控制器：\n\n```\nNavController controller = NavHostFragment.findNavController(fragment);\n\
  ```\n\n## 40.5 触发导航动作\n\n一旦找到导航控制器，可以通过调用控制器的 `navigate()` 方法并传递要执行动作的资源 ID 来触发导航动作。例如：\n\
  \n```\ncontroller.navigate(R.id.goToContactsList);\n```\n\n当选中动作连接时，动作的 ID 在导航图编辑器的属性面板中定义。\n\
  \n### 40.6 传递参数\n\n在导航动作期间，可以使用导航图文件中声明的参数将数据从一个目的地传递到另一个目的地。一个参数由名称、类型和可选的默认值组成，可以在\
  \ XML 中手动添加，也可以在选择目的地时使用属性面板添加。例如，在 图 40-6 中，声明了一个名为 `contactsCount` 的整数参数，默认值为\
  \ 0：\n\n![](img/argument_example.jpg)\n图 40-6 一旦添加，参数将放置在接收目的地的 XML 元素中，例如：\n\n\
  ```xml\n<fragment\n    android:id=\"@+id/secondFragment\"\n    android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n    android:label=\"fragment_second\"\n    tools:layout=\"@layout/fragment_second\"\
  \ >\n    <argument\n        android:name=\"contactsCount\"\n        android:defaultValue=\"\
  0\"\n        app:type=\"integer\" />\n</fragment>\n```\n\n导航组件提供了两种在目的地之间传递参数的技术。一种方法是将数据放入\
  \ `Bundle` 对象中，并在动作期间将其传递给目的地，然后在那里对其进行解包并提取参数。这种特定方法的主要缺点是它不是“类型安全的”（type safe）。换句话说，如果接收目的地对参数的处理类型与声明类型不符（例如将字符串视为整数），此错误将不会被编译器捕获，并可能在运行时引发问题。\n\
  \n另一种更好的方法（本书中使用的方法）是 safeargs。safeargs 是 Android Studio Gradle 构建系统的一个插件，它会自动生成特殊类，允许以类型安全的方式传递参数。safeargs\
  \ 参数传递将在下一章（41.1）中进行描述和演示。\n\n### 40.7 总结\n\n在 Android 应用用户界面背景下，导航是指用户在不同屏幕之间移动的能力。曾经实现非常耗时且难以组织，现在\
  \ Android Studio 和导航组件使得在 Android 应用项目中实现和管理导航变得简单。\n\n应用中的不同屏幕被称为目的地，通常由 fragment\
  \ 或活动表示。所有应用都有一个主目的地，包括应用首次加载时显示的屏幕。此布局的内容区域被一个导航宿片段取代，当用户在应用导航时，它会被切换为其他的目的地片段。导航路径由导航图定义，该图由目的地以及连接它们的动作（以及在目的地之间传递的任何参数）组成。\n\
  \n\n\n\n上一章描述了 Android Jetpack Navigation 组件以及它如何与 Android Studio 的导航图表功能集成，从而为实现\
  \ Android 应用屏幕之间的快速导航提供了一种简单的方法。在本章中，将创建一个新的 Android Studio 项目，该项目将使用这些导航功能来实现一个包含多个屏幕的示例应用。除了演示如何使用\
  \ Android Studio 导航图表编辑器外，示例项目还将实现使用类型安全参数在源屏幕和目标屏幕之间传递数据。\n\n### 41.1 创建 NavigationDemo\
  \ 项目\n\n从欢迎界面中选择 `New Project` 选项，在弹出的新项目对话框中，在点击 `Next` 按钮之前选择 `Empty Views Activity`\
  \ 模板。\n\n在 `Name` 字段中输入 `NavigationDemo`，并指定 `com.ebookfrenzy.navigationdemo` 为包名。在点击\
  \ `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将 `Language`\
  \ 菜单更改为 `Java`。\n\n## 41.2 向构建配置中添加导航\n\n默认情况下，新的 `Empty Views Activity` 项目不会在构建配置文件中包含\
  \ Navigation 组件库。因此，在执行任何其他任务之前，第一步是修改应用级的 `build.gradle.kts` 文件。在 Project 工具窗口中找到该文件（`Gradle\
  \ Scripts -> build.gradle.kts (Module :app)`），双击将其加载到代码编辑器中，并修改 `dependencies` 部分以添加导航库。此外，借此机会启用此模块的\
  \ view binding：\n\n```kotlin\nandroid {\n    buildFeatures {\n        viewBinding\
  \ = true\n    }\n}\n\ndependencies {\n    implementation (\"androidx.navigation:navigation-fragment:2.6.0\"\
  )\n    implementation (\"androidx.navigation:navigation-ui:2.6.0\")\n    implementation(platform(\"\
  org.jetbrains.kotlin:kotlin-bom:1.8.0\"))\n}\n```\n\n注意，自本书出版以来，可能发布了这些库的新版本。在文件中添加导航依赖项后，点击\
  \ `Sync Now` 链接以重新同步项目的构建配置。\n\n### 41.3 创建导航图资源文件\n\n在构建配置中添加了导航库后，现在可以向项目中添加导航图资源文件了。正如“导航架构组件概述”所示，这是一个\
  \ XML 文件，包含用户可以导航的片段（fragments）和活动，以及用于执行跳转的动作以及在目标之间传递的任何数据。\n\n在 Project 工具窗口中，找到\
  \ `res` 文件夹（`app -> res`），右键点击它，并选择 `New -> Android Resource File` 菜单选项：\n\n![](img/as_new_resource_file_menu.jpg)\n\
  图 41-1\n\n选择菜单项后，将出现 `New Resource File` 对话框。在此对话框中，将文件命名为 `navigation_graph`，并将\
  \ `Resource type` 菜单更改为 `Navigation`（如图 41-2\n图 41-2\n\n向项目添加导航图资源文件后，它将主面板中，准备添加新目标。将编辑器切换到\
  \ `Code` 模式，并在添加任何目标之前检查图表的 XML：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\n \
  \   xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    android:id=\"@+id/navigation_graph\"\
  >\n</navigation>\n```\n\n在编辑器中切换回 `Design` 模式，注意 `Destinations` 面板的 `Host` 部分指示项目中未检测到任何导航主机片段（navigation\
  \ host fragments）：\n\n![](img/as_navigation_hosts_no_fragments.jpg)\n图 41-3\n\n\
  在向导航图添加任何目标之前，下一步是向项目添加一个导航主机片段。\n\n## 41.4 声明导航主机\n\n对于此项目，导航主机片段将包含在主活动的用户界面布局中。首先，在\
  \ Project 工具窗口中找到主活动布局文件（`app -> res -> layout -> activity_main.xml`），将其加载到布局编辑器中，并删除默认的\
  \ `TextView` 组件。\n\n在布局器的 `Design` 模式下，从 `Palette` 的 `Containers` 部分拖出一个 `NavHostFragment`\
  \ 元素，并将其放置到活动布局的容器区域，如图 41-4 中的箭头所示：\n\n![](img/as_navigation_add_navhostfragment.jpg)\n\
  图 41-4\n\n从弹出的 `Navigation Graphs` 对话框中选择上一节创建的 `navigation_graph.xml` 文件，并点击 `OK`\
  \ 按钮。\n\n在布局中选中新添加的 `NavHostFragment` 实例后，使用 `Attributes` 工具窗口将元素的 ID 更改为 `demo_nav_host_fragment`，然后点击\
  \ `Infer` 按钮。\n\n将布局编辑器切换到 `Code` 模式并检查 XML 文件。注意编辑器已正确配置了 `navigation graph` 属性以引用\
  \ `navigation_graph.xml` 文件，并且 `defaultNavHost` 属性已设置为 `true`：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n\n    <androidx.fragment.app.FragmentView\n\
  \        android:id=\"@+id/demo_nav_host_fragment\"\n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\
  \n        android:layout_width=\"409dp\"\n        android:layout_height=\"729dp\"\
  \n        app:defaultNavHost=\"true\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\"\n        app:navGraph=\"\
  @navigation/navigation_graph\" />\n\n</androidx.constraintlayout.ConstraintLayout>\n\
  ```\n\n返回 `navigation_graph.xml` 文件，确认已检测到 `HostFragment` 实例（可能需要关闭并重新打开文件）：\n\n\
  ![](img/as_navigation_hosts_fragment.jpg)\n图 41-5\n\n## 41.5 添加导航目标\n\n在导航图中，现在是时候添加第一个目标了。如图\
  \ 41-6 所示，点击 `new destination` 按钮以选择或创建目标：\n\n![](img/as_navigation_add_navfragment_menu.jpg)\n\
  图 41-6\n\n接下来，从菜单中选择 `Create new destination` 选项。在弹出的对话框中，选择 `Fragment (Blank)`\
  \ 模板，在点击 `Finish` 按钮之前将新片段命名为 `FirstFragment`，布局命名为 `fragment_first`。在项目重新构建的片刻延迟后，新片段将作为目标出现在图中，如图\
  \ 41-7 所示：\n\n（此处缺少图片图 41-7）\n\n目标节点上方的主图标表示它是起始目标。这意味着当创建 `NavHostFragment` 活动时，该目标将是第一个显示的。要将起始目标更改为另一个，请在图中选中节点并点击工具栏上的主按钮。\n\
  \n通过将编辑器切换到 `Code` 模式来检查导航图的 XML 内容：\n\n（此处对应 XML 代码块）\n\n\n\n\n\n```xml\n<navigation\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/navigation_graph\"\n    app:startDestination=\"@id/firstFragment\"\
  >\n    <fragment\n        android:id=\"@+id/firstFragment\"\n        android:name=\"\
  com.ebookfrenzy.navigationdemo.FirstFragment\"\n        android:label=\"fragment_first\"\
  \n        tools:layout=\"@layout/fragment_first\">\n        <action\n          \
  \  android:id=\"@+id/mainToSecond\"\n            app:destination=\"@id/secondFragment\"\
  \ />\n    </fragment>\n    <fragment\n        android:id=\"@+id/secondFragment\"\
  \n        android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\n     \
  \   android:label=\"fragment_second\"\n        tools:layout=\"@layout/fragment_second\"\
  \ />\n</navigation>\n```\n\n在执行任何导航之前，导航图至少还需要另一个目标。重复上述步骤，添加一个名为 `SecondFragment`\
  \ 的片段，其布局文件命名为 `fragment_second`。新片段将作为导航图中的另一个目标出现，如图图 41-8 所示：\n\n![](img/as_navigation_two_fragments.jpg)\n\
  图 41-8\n\n## 41.6 设计目标片段布局\n\n在添加用于在目标之间进行导航的动作（actions）之前，现在是为图中的两个目标片段添加一些用户界面组件的好时机。首先，双击\
  \ `firstFragment` 目标，使 `fragment_first.xml` 文件加载到布局编辑器中，然后选择并删除默认的 `TextView` 实例。在组件树（Component\
  \ Tree）面板中，右键点击 `FrameLayout` 条目，并选择 `Convert from FrameLayout to ConstraintLayout`\
  \ 菜单选项，在生成的转换对话框中接受默认设置：\n\n![](img/as_navigation_convert_to_constraint_layout.jpg)\n\
  图 41-9\n\n使用属性（Attributes）工具窗口，将 `ConstraintLayout` 的 ID 更改为 `constraintLayout`，然后将\
  \ `Button` 和 `Plain Text EditText` 控件拖到布局中，使其看起来像下方图 41-10 所示：\n\n![](img/as_navigation_first_fragment_ui.jpg)\n\
  图 41-10\n\n一旦视图位置正确正确，点击工具栏上的 `Infer constraints`（推断约束）按钮，以向布局添加任何缺失的约束。选择 `EditText`\
  \ 视图，并使用属性工具窗口删除默认的“Name”文本，并将控件的 ID 更改为 `userText`。接下来，将按钮的文本属性更改为“Navigate”，并将其提取到字符串资源。\n\
  \n返回 `navigation_graph.xml` 文件，双击 `secondFragment` 目标以将 `fragment_second.xml` 文件加载到布局编辑器。选择并删除默认的\
  \ `TextView` 实例，重复上述步骤将 `FrameLayout` 转换为 `ConstraintLayout`，并将 id 更改为 `constraintLayout2`。接下来，拖入一个新的\
  \ `TextView` 控件将其置在布局中心，并点击 `Infer constraints` 按钮添加任何缺失的约束。选中新的 `TextView`，使用属性面板将\
  \ ID 更改为 `argText`。\n\n## 41.7 为导航图添加动作\n\n现在两个目标已添加到图中，并且设计了相应的用户界面布局，项目需要一种方法让用户能够从第一个片段导航到第二个片段。这将通过向图中添加一个动作来实现，之后可以在应用代码中引用该动作。\n\
  \n要建立以第一个片段为源点、第二个片段为目标的动作连接，打开导航图，并将鼠标指针悬停在 `firstFragment` 目标右边缘的垂直中心，此时会出现一个高亮的圆，如图图\
  \ 41-11 所示：\n\n![](img/as_navigation_first_fragment_selected.jpg)\n图 41-11\n\n点击圆圈内部并将生成的线条拖动到\
  \ `secondFragment` 目标：\n\n![](img/as_navigation_add_connection.jpg)\n图 41-12\n\n\
  释放线条以在源点和目标之间建立动作连接，此时线条将变为箭头，如图图 41-13 所示：\n\n![](img/as_navigation_connected.jpg)\n\
  图 41-13\n\n可以随时选中动作连接并按下键盘上的 Delete 键将其删除。选中箭头后，检查属性工具窗口中的可用属性，并将 ID 更改为 `mainToSecond`。这是代码中引用该动作的\
  \ ID。将编辑器切换到代码模式，注意该动作现在已包含在 XML 中。\n\n### 41.8 实现 OnFragmentListener\n\n在添加代码以触发动作之前，`MainActivity`\
  \ 类必须实现 `OnFragmentListener`。该接口是在片段类在导航图中创建时在类内部生成的。为了符合该接口，活动需要一个名为 `onFragmentInteraction()`\
  \ 的方法，以实现片段与活动之间的通信。编辑 `MainActivity.java` 文件并进行修改如下：\n\n```java\nimport android.net.Uri;\n\
  \npublic class MainActivity extends AppCompatActivity implements SecondFragment.OnFragmentListener\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    @Override\n    public void onFragmentInteraction(Uri uri) {\n    }\n\
  }\n```\n\n如果 Android Studio 报告 `OnFragmentListener` 未定义（某些版本的 Android Studio 会自动添加，某些则不会），请编辑\
  \ `SecondFragment.java` 文件并添加以下内容：\n\n```java\nimport android.net.Uri;\n\npublic\
  \ interface OnFragmentListener {\n    // TODO: Update argument type and name\n \
  \   void onFragmentInteraction(Uri uri);\n}\n```\n\n## 41.9 为目标片段添加视图支持\n\n由于我们需要访问布局中的某些视图，必须修改当前代码以启用视图绑定。首先编辑\
  \ `FirstFragment.java` 文件并进行以下更改：\n\n```java\nimport com.ebookfrenzy.navigationdemo.databinding.FragmentFirstBinding;\n\
  \npublic class FirstFragment extends Fragment {\n    private FragmentFirstBinding\
  \ binding;\n\n    @Nullable\n    @Override\n    public View onCreateView(@NonNull\
  \ LayoutInflater inflater, @Nullable ViewGroup container, @Nullable Bundle savedInstanceState)\
  \ {\n        return inflater.inflate(R.layout.fragment_first, container, false);\n\
  \        binding = FragmentFirstBinding.inflate(inflater, container, false);\n \
  \       return binding.getRoot();\n    }\n\n    @Override\n    public void onDestroyView()\
  \ {\n        super.onDestroyView();\n        binding = null;\n    }\n}\n```\n\n\
  对 `SecondFragment.java` 文件重复上述步骤，引用 `FragmentSecondBinding`。\n\n### 41.10 触发动作\n\
  \n现在动作已添加到导航图中，下一步是在第一个片段中添加一些代码，以便在点击 `Button` 控件时触发动作。找到 `FirstFragment.java`\
  \ 文件，将其加载到代码编辑器，并重写 `onViewCreated()` 方法以获取按钮实例的引用，并配置 `onClickListener` 实例以便在用户点击按钮时进行调用。\n\
  \n\n\n\n\n```java\nimport androidx.annotation.NonNull;\nimport androidx.annotation.Nullable;\n\
  import android.widget.Button;\nimport androidx.navigation.Navigation;\n\npublic\
  \ class FirstFragment extends Fragment {\n\n    @Override\n    public void onViewCreated(@NonNull\
  \ View view,\n                            @Nullable Bundle savedInstanceState) {\n\
  \        super.onViewCreated(view, savedInstanceState);\n        binding.button.setOnClickListener(new\
  \ View.OnClickListener() {\n            @Override\n            public void onClick(View\
  \ view) {\n                Navigation.findNavController(view).navigate(\n      \
  \                  R.id.mainToSecond);\n            }\n        });\n    }\n}\n```\n\
  \n上述代码获取了导航控制器（navigation controller）的引用，并在该实例上调用了 `navigate()` 方法，将导航动作的资源 ID 作为参数传递。\n\
  \n编译并运行应用，验证点击第一个 fragment 中的按钮是否会跳转到第二个 fragment。\n\n作为这种设置监听器的替代方法，`Navigation`\
  \ 类还包含一个名为 `createNavigateOnClickListener()` 的方法，它提供了一种更高效的方法来设置监听器并导航到目的地。因此，可以使用以下单行代码来启动跳转并实现相同的结果：\n\
  \n```java\nbinding.button.setOnClickListener(Navigation.createNavigateOnClickListener(\n\
  \                R.id.mainToSecond, null));\n```\n\n# 41.11 使用 Safeargs 传递数据\n\n\
  下一个目标是将第一个 fragment 中 `EditText` 视图输入的文本传递到第二个 fragment，并在那里显示在 `TextView` 控件上。如上一章所述，Android\
  \ Navigation 组件支持两种传递数据的方法。本章将使用类型安全的参数传递。\n\n使用 `safeargs` 的第一步是在 Gradle 构建配置中添加\
  \ `safeargs` 插件。使用 Project 工具窗口，找到并编辑项目层级的 `build.gradle.kts` 文件（`Gradle Scripts\
  \ -> `build.gradle.kts (Project: NavigationDemo)`），按如下所示添加插件依赖（再次提醒，现在可能有更此的版本）：\n\
  \n```kotlin\n// 顶级构建文件，您可以在其中添加所有子项目/模块通用的配置选项\nbuildscript {\n    dependencies\
  \ {\n        classpath(\"androidx.navigation:navigation-safe-args-gradle-plugin:2.6.0\"\
  )\n    }\n}\n\nplugins {\n// ...\n}\n```\n\n接下来，编辑模块级别的 `build.gradle.kts` 文件（`Gradle\
  \ Scripts -> build.gradle.kts (Module :app)`），按如下所示应用插件并重新同步项目：\n\n```kotlin\nplugins\
  \ {\n    id(\"com.android.application\")\n    id (\"androidx.navigation.safeargs\"\
  )\n}\n\nandroid {\n// ...\n}\n```\n\n下一步是定义目的地（在本例中为第二个 fragment）将接收的任何参数。编辑导航图，选择\
  \ `secondFragment` 目的地，并在 Attributes 工具窗口中找到 `Arguments` 部分。点击 `+` 按钮（如图 41-14 中高亮所示）为目的地添加新参数：\n\
  \n![](img/as_navigation_add_arguments.jpg)\n\n图 41-14\n\n点击 `+` 按钮后，会弹出一个对话框，需要在其中输入参数名称、类型和默认值。将参数命名为\
  \ `message`，将类型设置为 `String`，在默认值字段输入 `No Message`，并点击 `Add` 按钮：\n\n![](img/as_navigation_add_argument_dialog.jpg)\n\
  \n图 41-15\n\n新配置的参数将出现在 `navigation_graph.xml` 文件的 `secondFragment` 中，如下：\n\n```xml\n\
  <fragment\n    android:id=\"@+id/secondFragment\"\n    android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n    android:label=\"fragment_second\"\n    tools:layout=\"@layout/fragment_second\"\
  >\n    <argument\n        android:name=\"message\"\n        app:argType=\"string\"\
  \n        android:defaultValue=\"No Message\" />\n</fragment>\n```\n\n下一步是从 `FirstFragment.java`\
  \ 中的 `EditText` 提取文本并传递给目的地。`safeargs` 插件将生成以下类：\n\n- `FirstFragmentDirections`:此类代表从源点的导航动作。\n\
  - `MainToSecond`:此类代表用于导航到目的地的动作。\n- `SecondFragmentArgs`:此类用于访问目的地的参数。\n\n要实现这一点，请修改\
  \ `FirstFragment.java` 中的 `onViewCreated` 方法。一旦构建项目，`safeargs` 插件将生成必要的类。如果 `FirstFragmentDirections`\
  \ 未定义，请使用 `Build -> Make Project` 重新构建项目。使用以下代码：\n\n```java\nbinding.button.setOnClickListener(view1\
  \ -> {\n    FirstFragmentDirections.MainToSecond action = FirstFragmentDirections.mainToSecond();\n\
  \    action.setMessage(binding.userText.getText().toString());\n    Navigation.findNavController(view1).navigate(action);\n\
  });\n```\n\n剩下的只需修改 `SecondFragment.java` 类文件，以便在跳转后接收参数并将其显示在 `TextView` 控件上。对于此示例，将使用\
  \ `onStart()` 周期方法添加实现这些任务的代码。\n\n```java\n@Override\npublic void onStart() {\n\
  \    super.onStart();\n    SecondFragmentArgs args = SecondFragmentArgs.fromBundle(getArguments());\n\
  \    String message = args.getMessage();\n    binding.argText.setText(message);\n\
  }\n```\n\n编译并运行应用，并在点击 `Button` 控件之前输入文本。当第二个 fragment 目的地出现时，`TextView` 应显示在第一个\
  \ fragment 中输入的文本，这表明数据已成功在导航目的地之间传递。\n\n### 41.12 总结\n\n\n\n\n\n本章提供了一个使用 Navigation\
  \ 架构组件和 Android Studio 导航图编辑器实现 Android 应用导航的实际示例。涵盖的主题包括创建包含现有和新目标片段的导航图、在 Activity\
  \ 布局中嵌入导航宿片段（navigation host fragment）、编写触发导航事件的代码，以及使用 `safeargs` 插件在目的地之间传递参数。\n\
  \n# 42. MotionLayout 简介\n\n`MotionLayout` 类为用户界面布局中的视图添加动画效果提供了一种简单的方法。本章将首先提供 `MotionLayout`\
  \ 的概述，并介绍 `MotionScenes`（运动场景）、`Transitions`（过渡）和 `Keyframes`（关键帧）的概念。在介绍这些基础之后，接下来的两章（名为\
  \ “Android MotionLayout 教程” 和 “MotionLayout KeyCycle 教程”）将通过创建示例项目提供 `MotionLayout`\
  \ 动画的更多细节和示例。\n\n## 42.1 MotionLayout 概述\n\n`MotionLayout` 是一种布局容器，其主要目的是对布局内视图从一个状态到另一个状态的过渡进行动画处理。例如，`MotionLayout`\
  \ 可以在指定时间内动画 `ImageView` 实例从屏幕左上角移动到右下角的运动。除了视图的位置外，其他属性的变化也可以进行动画处理，例如颜色、大小或旋转角度。这些状态变化也可以进行插值（使得视图在整个动画过程中移动、旋转并改变大小）。\n\
  \n使用 `MotionLayout` 的视图运动可以在两点之间以直线形式执行，也可以实现为遵循由起始点和终点之间不同位置的中间点组成的路径。`MotionLayout`\
  \ 还支持使用触摸和滑动来启动和控制动画。\n\n`MotionLayout` 动画完全在 XML 中声明，通常不需要编写代码。这些 XML 声明可以在 Android\
  \ Studio 代码编辑器中手动实现、使用 `MotionLayout` 编辑器进行视觉化实现，或者结合这两种方法。\n\n### 42.2 MotionLayout\n\
  \n在实现动画时，用户界面中通常使用的 `ConstraintLayout` 容器必须先转换为 `MotionLayout` 实例（此任务可以通过布局编辑器中右键点击\
  \ `ConstraintLayout` 并选择 `Convert to MotionLayout` 菜单选项来实现）。`MotionLayout` 至少需要\
  \ 2.0.0 版本的 `ConstraintLayout` 库。\n\n不例外的是，由于它是 `ConstraintLayout` 的子类，`MotionLayout`\
  \ 支持 `ConstraintLayout` 的所有布局功能。因此，对于不需要动画的视图，使用 `MotionLayout` 时可以同样设计用户界面布局。\n\
  \n对于需要动画的视图，会声明两个 `ConstraintSets`，用于定义视图在动画开始和结束时的外观和位置。`transition` 声明定义了关键帧，用于在这些起结束状态之间对目标视图应用额外效果，以及用于启动和控制动画的点击和滑动处理器。\n\
  \n起始和结束的 `ConstraintSets` 以及 `transitions` 声明在 `MotionScene` XML 文件中。\n\n## 42.3\
  \ MotionScene\n\n正如我们在前面的章节中看到的，XML 布局文件包含了配置呈现给用户的静态视图的外观和布局行为所需的必要信息，在使用 `MotionLayout`\
  \ 时也是如此。对于非静态视图（换句话说，即要进行动画的视图），这些视图仍然在布局文件中声明，但与这些视图相关的起始、结束和过渡声明存储在一个名为 `MotionScene`\
  \ 的独立 XML 文件中（之所以这样命名是因为所有声明都定义在 `MotionScene` 元素内）。该文件被导入布局 XML 文件中，包含了起始和结束的 `ConstraintSets`\
  \ 以及 `Transition` 声明（一个文件可以包含多个 `ConstraintSet` 对和 `Transition` 声明，允许将不同的动画针对用户界面布局中的特定视图）。\n\
  \n下面的列表显示了一个 `MotionScene` 文件的模板：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<MotionScene\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\">\n    <Transition\n\
  \        motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintSetStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrameSet>\n        </KeyFrameSet>\n\
  \    </Transition>\n    <ConstraintSet android:id=\"@+id/start\">\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n    </ConstraintSet>\n</MotionScene>\n\
  ```\n\n在上面的 XML 中，声明了名为 `start` 和 `end` 的 `ConstraintSets`（尽管可以使用任何名称），此时它们尚未包含任何约束元素。`Transition`\
  \ 元素定义了这些 `ConstraintSets` 代表动画的起点和终点，并包含一个空的 `KeyFrameSet` 元素，准备填充额外的动画关键帧条目。`Transition`\
  \ 元素还包含一个毫秒级持续时间属性，用于控制动画的运行时间。\n\n`ConstraintSets` 并不意味着视图的运动。可以使起始和结束集声明屏幕上的相同位置，然后使用过渡来动画其他属性的变化，例如缩放和旋转角度。\n\
  \n## 42.4 配置 ConstraintSets\n\n`MotionScene` 文件中的 `ConstraintSets` 允许将全套 `ConstraintLayout`\
  \ 设置应用于视图，关于定位、尺寸调整以及与其他视图的关系。此外，可以在 `ConstraintSet` 中包含以下属性：\n\n•alpha\n•visibility\n\
  •elevation\n•rotation\n•rotationX\n•rotationY\n•translationX\n•translationY\n•translationZ\n\
  •scaleX\n•scaleY\n\n例如，要在动画期间旋转视图 180°，可以在起始和结束约束中声明以下内容：\n\n```xml\n<ConstraintSet\
  \ android:id=\"@+id/start\">\n    <Constraint\n        motion:layout_constraintStart_toOf=\"\
  parent\"\n        android:rotation=\"0\">\n    </Constraint>\n</ConstraintSet>\n\
  \n<ConstraintSet android:id=\"@+id/end\">\n    <Constraint\n        motion:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        android:rotation=\"180\">\n    </Constraint>\n</ConstraintSet>\n\
  ```\n\n上面的更改告诉 `MotionLayout` 视图从 0° 开始，然后在动画过程中旋转整个 180°，最后倒置停止。\n\n### 42.5 自定义属性\n\
  \n除了上述列出的标准属性外，还可以指定一系列自定义属性（使用 `CustomAttribute` 声明）。事实上，视图类型上的几乎任何属性都可以指定为自定义属性以包含在动画中。要标识属性名称，请从目标视图类的文档查找\
  \ getter/setter 名称，删除 get/set 前缀，并将剩余的第一个字母转换为小写。例如，要在代码中更改 `Button` 视图的背景颜色，我们可能会如下调用\
  \ `setBackgroundColor()` 设置方法：\n\n```\nmyButton.setBackgroundColor(Color.RED)\n\
  ```\n\n在约束集或关键帧中设置此属性时，属性名称将为 `backgroundColor`。除了属性名称外，还必须使用以下选项中的适当类型声明值：\n\n\
  •motion:customBoolean - 布尔属性值。\n\n\n\n\n\n- `motion:customColorValue` - 颜色属性值。\n\
  - `motion:customDimension` - 维度属性值。\n- `motion:customFloatValue` - 浮点数属性值。\n- `motion:customIntegerValue`\
  \ - 整数属性值。\n- `motion:customStringValue` - 字符串属性值。\n\n例如，颜色设置需要使用 `motion:customColorValue`\
  \ 类型进行赋值：\n\n```xml\n<CustomAttribute\n    motion:attributeName=\"backgroundColor\"\
  \n    motion:customColorValue=\"#43CC76\" />\n```\n\n例如，以下 `MotionScene` 文件的节选声明了视图的起始和结束约束，并将将背景颜色从绿色更改为红色：\n\
  \n```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteX=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintTop_toTopOf=\"\
  parent\"\n        motion:layout_constraintStart_toStartOf=\"parent\" >\n       \
  \ <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\n     \
  \       motion:customColorValue=\"#33CC33\" />\n    </Constraint>\n</ConstraintSet>\n\
  <ConstraintSet android:id=\"@+id/end\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteY=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintEnd_toEndOf=\"\
  parent\"\n        motion:layout_constraintBottom_toBottomOf=\"parent\" >\n     \
  \   <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\n   \
  \         motion:customColorValue=\"#F80A1F\" />\n    </Constraint>\n</ConstraintSet>\n\
  ```\n\n## 42. 触发动画\n\n如果没有某些事件告诉 `MotionLayout` 开始动画，`MotionScene` 文件中的所有设置都将不会影响布局（视图将根据起始\
  \ `ConstraintSet` 中的设置进行定位外）。\n\n动画可以配置为响应屏幕点击（`OnClick`）或滑动（`OnSwipe`）手势来启动。`OnClick`\
  \ 处理器会导致动画开始并运行直到完成，而 `OnSwipe` 则将同步动画沿时间轴来回移动，以匹配触摸动作。`OnSwipe` 处理器还会响应屏幕上的“飞掷”（flinging）动作。`OnSwipe`\
  \ 处理器还提供了选项，用于配置动画如何响应不同方向的拖动，以及滑动锚定的目标视图的哪侧。这允许例如通过向左滑动动作让视图向相应方向移动，同时防止向上运动导致视图向侧移动（当然，除非这是所需的行为）。\n\
  \n`OnSwipe` 和 `OnClick` 声明包含在 `MotionScene` 文件的 `Transition` 元素中。在这两种情况下，必须指定视图\
  \ ID。例如，要实现一个响应锚定在名为 `button` 的视图底部的向下滑动动作的 `OnSwipe` 处理器，可以将以下 XML 放在 `Transition`\
  \ 元素中：\n\n```xml\n<Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n    </KeyFrameSet>\n\
  \    <OnSwipe\n        motion:touchAnchorId=\"@+id/button\"\n        motion:dragDirection=\"\
  dragDown\"\n        motion:touchAnchorSide=\"bottom\" />\n</Transition>\n```\n\n\
  或者，为同一个按钮添加一个 `OnClick` 处理器：\n\n```xml\n<OnClick motion:targetId=\"@id/button\"\
  \ clickAction=\"toggle\" />\n```\n\n在上面的示例中，动作已被设置为 `toggle`。此模式和其他可用选项可以总结如下：\n\
  - `toggle`: 动画化到相反状态。例如，如果视图当前处于过渡点，它将过渡到结束点，反之亦然。\n- `jumpToStart`: 立即切换到起始状态，没有动画。\n\
  - `jumpToEnd`: 立即切换到结束状态，没有动画。\n- `transitionToStart`: 带有动画地过渡到起始状态。\n- `transitionToEnd`:\
  \ 带有动画地过渡到结束状态。\n\n## 42.7 弧形运动\n\n默认情况下，视图位置的移动将在起始点和结束点之间直线运行。要将运动更改为弧形路径，请在起始约束中使用如下所示的\
  \ `pathMotionArc` 属性，并配置 `startHorizontal` 或 `startVertical` 来定义弧形是凹的还是凸的：\n\n```xml\n\
  <ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteX=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintTop_toTopOf=\"\
  parent\"\n        motion:layout_constraintStart_toStartOf=\"parent\"\n        motion:pathMotionArc=\"\
  startVertical\" >\n</Constraint>\n</ConstraintSet>\n```\n\n图 42-1 展示了 `startVertical`\
  \ 和 `startHorizontal` 弧与默认直线的对比：\n(image/motionlayout_arcMotion_three.jpg)\n\n##\
  \ 42.8 关键帧 (Keyframes)\n\n为止列出的所有 `ConstraintSet` 属性仅适用于动画的起始和结束点。句话句话，如果旋转属性在结束点设置为\
  \ 180°，那么旋转将在动画开始时开始并在到达结束点时完成。因此，无法配置旋转在动画进行到 50% 处达到完全 180°，然后在结束时旋转回原始方向。幸运的是，使用关键帧可以实现这种效果。\n\
  \n关键帧用于定义动画过程中的中间点，状态在此处发生。例如，可以声明关键帧，使视图的背景颜色在动画进行到 50% 处过渡到蓝色，在 75% 处变为绿色，并在动画结束时恢复原始颜色。关键帧实现在\
  \ `MotionScene` 文件的 `Transition` 元素中，嵌入在 `KeyFrameSet` 元素内。\n\n`MotionLayout` 支持多种类型的关键帧，总结如下：\n\
  \n### 42.8.1 属性关键帧\n\n属性关键帧（使用 `KeyAttribute` 定义）允许在时间轴的中间更改视图属性。`KeyAttribute`\
  \ 支持上述 `ConstraintSets` 列出的属性，并结合指定更改在动画时间轴何时生效的能力。例如，以下关键帧声明将逐渐导致按钮视图在水平（`scaleX`）和垂直（`scaleY`）尺寸上翻倍，在时间\
  \ 50% 处达到最大尺寸。在时间轴剩余的时间内，视图将缩小到原始尺寸：\n\n```xml\n<Transition\n    motion:constraintSetEnd=\"\
  @+id/end\"\n    motion:constraintSetStart=\"@id/start\"\n    motion:duration=\"\
  1000\">\n    <KeyFrameSet>\n        <KeyAttribute\n            motion:motionTarget=\"\
  @+id/button\"\n            motion:framePosition=\"50\"\n            android:scaleX=\"\
  2.0\" />\n        <KeyAttribute\n            motion:motionTarget=\"@+id/button\"\
  \n            motion:framePosition=\"50\"\n            android:scaleY=\"2.0\" />\n\
  \    </KeyFrameSet>\n</Transition>\n```\n\n\n\n\n\n- `parentRelative` - `x` 和 `y`\
  \ 坐标相对于其所在的父容器，坐标以百分比形式表示（表现为 0.0 到 1.0 之间的值）：\n\n![](img/motionlayout_parentRelative.jpg)\n\
  图 42-2\n\n- `deltaRelative` - `x` 和 `y` 坐标不再相对于父容器，而是相对于起始和结束位置。例如，起始点为 (0, 0)，结束点为\
  \ (1, 1)。请注意 `x` 和 `y` 坐标可以是负值：\n\n![](img/motionlayout_deltaRelative.jpg)\n图 42-3\n\
  \n- `pathRelative` - `x` 和 `y` 坐标相对于路径，其中起点和终点之间的直线作为图表的 `X`-轴。同样，坐标以百分比形式表示（0.0\
  \ 到 1.0）。这与 `deltaRelative` 坐标空间相似，但考虑了路径的角度。同样，坐标可能是负值：\n\n![](img/motionlayout_pathRelative.jpg)\n\
  图 42-4\n\n例如，以下 `ConstraintSets` 定义了设备屏幕两侧的起点和终点。默认情况下，使用这些点的视图过渡将跨越屏幕直线移动，如图图 42-5\
  \ 所示：\n\n![](img/motionlayout_straight_path.jpg)\n图 42-5\n\n然而，如果要求视图遵循类似于下方图 42-6\
  \ 所示的路径：\n\n![](img/motionlayout_wave_path.jpg)\n图 42-6\n\n为了实现这一点，可以在过渡内如下声明关键帧位置点：\n\
  \n```xml\n<KeyPosition\n    motion:motionTarget=\"@+id/button\"\n    motion:framePosition=\"\
  25\"\n    motion:keyPositionType=\"pathRelative\"\n    motion:percentY=\"0.3\"\n\
  \    motion:percentX=\"0.25\"/>\n\n<KeyPosition\n    motion:motionTarget=\"@+id/button\"\
  \n    motion:framePosition=\"75\"\n    motion:keyPositionType=\"pathRelative\"\n\
  \    motion:percentY=\"-0.3\"\n    motion:percentX=\"0.75\"/>\n```\n\n上述元素使用 `pathRelative`\
  \ 坐标系统在路径 25% 和 75% 处创建了关键帧位置点。第一个位置位于坐标 (0.25, 0.3)，第二个位置位于 (0.75, -0.3)。这些位置关键帧可以像下方的图\
  \ 42-7 所示进行可视化：\n\n![](img/motionlayout_curve_path.jpg)\n图 42-7\n\n### 42.9 时间线性度\n\
  \n在没有额外设置的情况下，上述动画将以恒定速度执行。若要改变动画速度（例如，使其加速后减速），可以在 `ConstraintSet` 或 `Keyframe`\
  \ 中使用过渡缓冲属性 (`transitionEasing`)。\n\n对于复杂的缓动需求，可以通过在三次贝塞尔曲线上绘制点来定义定义线性度，例如：\n\n\
  ```xml\nmotion:layout_constraintBottom_toBottomOf=\"parent\"\nmotion:transitionEasing=\"\
  cubic(0.2, 0.7, 0.3, 1)\"\nandroid:rotation=\"360\"\n```\n\n如果你不熟悉贝塞尔曲线，可以考虑使用以下\
  \ URL 中的曲线生成器：[`cubic-bezier.com/`](https://cubic-bezier.com/)\n\n但对于大多数需求，可以使用内置的标准、加速和减速值来指定缓动：\n\
  \n```xml\nmotion:layout_constraintBottom_toBottomOf=\"parent\"\nmotion:transitionEasing=\"\
  decelerate\"\nandroid:rotation=\"360\"\n```\n\n### 42.10 KeyTrigger\n\n触发关键帧 (`KeyTrigger`)\
  \ 允许在动画到达动画时间轴内的指定帧位置时调用视图上的方法。这还考虑了动画的方向。例如，可以根据动画是向前运行还是反向运行调用不同的方法。考虑一个在动画移动超过时间轴的\
  \ 20% 时变为可见的按钮。`KeyTrigger` 将在 `Transition` 元素的 `KeyFrameSet` 中如下实现，并使用 `onPositiveCross`\
  \ 属性：\n\n```xml\n<KeyFrameSet>\n    <KeyTrigger\n        motion:framePosition=\"\
  20\"\n        motion:onPositiveCross=\"show\"\n        motion:motionTarget=\"@id/button\"\
  />\n</KeyFrameSet>\n```\n\n同样，如果相同的按钮在动画反向并掉到 10% 以下时隐藏，可以使用 `onNegativeCross` 属性添加第二个触发器：\n\
  \n```xml\n<KeyTrigger\n    motion:framePosition=\"10\"\n    motion:onNegativeCross=\"\
  show\"\n    motion:motionTarget=\"@id/button2\"/>\n```\n\n如果动画使用切换动作（toggle），请使用\
  \ `onCross` 属性：\n\n```xml\n<KeyTrigger\n    motion:framePosition=\"10\"\n    motion:onCross=\"\
  show\"\n    motion:motionTarget=\"@id/button2\"/>\n```\n\n### 42.11 Cycle 和 时间关键帧\n\
  \n虽然位置关键帧可以用于向动画添加中间变化，但如果需要大量的重复操作，这会很快变得繁琐。对于需要重复执行的状态更改，`MotionLayout` 包含了 `Cycle`\
  \ 和 `Time` 关键帧。ALayout Cycle Tutorial 章节将详细介绍此主题。\n\n### 42.2 从代码启动动画\n\n到目前，我们只学习了如何使用\
  \ `OnSwipe` 和 `OnClick` 处理器控制动画。也可以通过调用 `MotionLayout` 实例的方法从代码中启动动画。下面的代码为名为 `motionLayout`\
  \ 的布局运行持续时间为 2000ms 的过渡：\n\n```java\nmotionLayout.setTransitionDuration(2000);\n\
  motionLayout.transitionToEnd();\n```\n\n在没有额外设置的情况下，用于动画的起始和结束状态将是 `MotionScene`\
  \ 文件中定义的。若要使用特定的起始和结束约束集，可以在调用 `MotionLayout` 的 `setTransition` 方法时引用它们：\n\n```java\n\
  motionLayout.setTransition(R.id.myStart, R.id.myEnd);\nmotionLayout.transitionToEnd();\n\
  ```\n\n要在动画运行时监控其状态，请如下所示为 `MotionLayout` 实例添加过渡监听器：\n\n```java\nmotionLayout.setTransitionListener(transitionListener);\n\
  MotionLayout.TransitionListener transitionListener = new MotionLayout.TransitionListener()\
  \ {\n    @Override\n    public void onTransitionStarted(MotionLayout motionLayout,\
  \ int startId, int endId) {\n        // 过渡开始时调用\n    }\n    @Override\n    public\
  \ void onTransitionChange(MotionLayout motionLayout, int startId, int endId, float\
  \ progress) {\n        // 每次属性变化时调用。跟踪进度值以找到当前位置\n    }\n    @Override\n    public\
  \ void onTransitionCompleted(MotionLayout motionLayout, int currentId) {\n     \
  \   // 过渡完成时调用\n    }\n    @Override\n    public void onTransitionTrigger(MotionLayout\
  \ motionLayout, int triggerId, boolean positive, float progress) {\n        // 交叉触发关键帧阈值时调用\n\
  \    }\n};\n```\n\n#### 总结\n\n`MotionLayout` 是 `ConstraintLayout` 的子类，专门设计用于用户界面布局中的视图添加动画效果。`MotionLayout`\
  \ 通过动画由起始和结束约束集定义的状态之间的过渡来工作。可以使用关键帧在起始和结束点之间添加额外的动画效果。\n\n动画可以通过 `OnClick` 或 `OnSwipe`\
  \ 处理器触发，也可以通过调用 `MotionLayout` 实例的方法进行编程触发。\n\n### 43. Android MotionLayout 编辑器教程\n\
  \n\n\n\n\n既然已经介绍了 `MotionLayout` 的基础知识，本章将提供一个在示例项目中尝试 `MotionLayout`的机会。除了继续探索\
  \ `MotionLayout` 的主要功能外，本章还将介绍 `MotionLayout` 编辑器，并探索如何使用它可视化地构建和修改 `MotionLayout`\
  \ 动画。\n\n在本章创建的项目将使用起始结束 `ConstraintSets`（约束集）、手势处理器以及 `Attribute`（属性）和 `Position`（位置）关键帧。\n\
  \n## 43.1 创建 MotionLayoutDemo 项目\n\n在欢迎界面点击 `New Project` 按钮，在弹出的新项目对话框中选择 `Empty\
  \ Views Activity` 模板，然后点击 `Next` 按钮。\n\n在 `Name` 字段输入 `MotionLayoutDemo`，并指定 `com.ebookfrenzy.motionlayoutdemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。\n\n## 43.2 ConstraintLayout 转换为 MotionLayout\n\nAndroid\
  \ Studio 已在 `activity_main.xml` 布局文件中将一个 `ConstraintLayout` 容器作为父视图。下一步是将该容器转换为\
  \ `MotionLayout` 实例。在 `Component Tree`（组件树）中，右键点击 `ConstraintLayout` 条目并选择 `Convert\
  \ to MotionLayout` 菜单选项：\n\n![](img/as_convert_to_motionlayout.jpg)\n\n图 43-1\n\n\
  选择后，点击确认对话框中的 `Convert` 按钮。一旦转换完成，`MotionLayout` 编辑器将出现在 Android Studio 主窗口中，如图\
  \ 43-2 所示：\n\n![](img/as_motionlayout_editor.jpg)\n\n图 43-2\n\n作为转换过程的一部分，Android\
  \ Studio 将创建一个 `res -> xml` 的新文件夹，并在其中放置名为 `activity_main_scene.xml` 的 `MotionLayout`\
  \ 场景文件：\n\n![](img/as_motionlayout_scene_file.jpg)\n\n图 43-3\n\n该文件包含一个顶层 `MotionScene`\
  \ 元素，其中包含 `ConstraintSet` 和 `Transition` 条目，这些条目将定义主布局中的动画。默认情况下，该文件将包含起始和结束约束集的空元素以及一个初始过渡：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<MotionScene\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\"\
  >\n    <Transition\n        motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintSetStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrameSet>\n        </KeyFrameSet>\n\
  \    </Transition>\n    <ConstraintSet android:id=\"@+id/start\">\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n    </ConstraintSet>\n</MotionScene>\n\
  ```\n\n在 `MotionLayout` 编辑器中进行的任何更改都将存储在此文件中。同样，也可以直接编辑此文件，以便在 `MotionLayout` 编辑器之外实现和修改动画设置。\n\
  \n在本教程中，动画将主要通过 `MotionLayout` 编辑器界面来实现。然而，我们将在每个阶段回顾这些更改是如何在底层 `MotionScene` 文件中的。随着章节的进行，你会发现\
  \ `MotionScene` 的 XML 语法简单且易于学习。\n\n本教程的第一阶段将演示如何使用 `MotionLayout` 为 `Button` 对象制作动画，包括运动（包括遵循路径）、旋转和尺寸缩放。\n\
  \n## 43.3 配置起始和结束约束\n\n当 `activity_main.xml` 文件加载到 `MotionLayout` 编辑器后，请确保选中了 Motion\
  \ Layout 框（在下方图 43-5 中标记为 E），然后在从调色板中拖放并放置一个 `Button` 视图到布局画布的左上角之前，先删除默认的 `TextView`，如图\
  \ 43-4 所示所示：\n\n![](img/as_motionlayout_button.jpg)\n\n图 43-4\n\n选中按钮后，使用 `Attributes`\
  \ 工具窗口将 `id` 改为 `myButton`。\n\n如上一章所述，`MotionLayout` 动画主要是指定视图如何在两个状态之间进行转换的情况。因此，实现动画的第一步是指定定义这些状态的约束。\n\
  \n对于此示例，起点将是布局视图的顶部中央。要配置这些约束，请在编辑器窗口中选择起始约束集条目（在图 43-5 中标记为 A）：\n\n![](img/as_motionlayout_editor_labelled.jpg)\n\
  \n图 43-5\n\n当选中起始框时，所有的约束和布局更改将对起始点约束集进行。要返回整个布局的标准约束和属性，请点击 Motion Layout 框 (E)。\n\
  \n接下来，在 `ConstraintSet` 列表中选择 `myButton` 条目 (B)。请注意 `Source` 列显示按钮是根据布局文件中的约束进行定位的。相反，我们希望按钮根据约束进行定位。在仍选中\
  \ `myButton` 条目的情况下，点击 `Edit` (C) 并从菜单中选择 `Constraint`，随后按钮条目将指示该视图位于起始集上：\n\n![](img/as_motionlayout_start.jpg)\n\
  \n图 43-6\n\n起始约束必须将按钮位于布局顶部，偏移 `8dp` 且水平居中。选中 `myButton` 后，使用 `Attributes` 工具窗口设置顶部和右侧约束：\n\
  \n![](img/as_motionlayout_start_settings.jpg)\n\n图 43-7\n\n选择结束约束集（在图 43-5 中标记为\
  \ D），并重复步骤创建一个新约束，这次将按钮放置在布局底部偏移 `8dp`：\n\n![](img/as_motionlayout_end_settings.jpg)\n\
  \n图 43-8\n\n配置好起始和结束约束后，打开 `activity_main_scene.xml` 文件并注意约束已经添加：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<MotionScene\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\">\n    <ConstraintSet\
  \ android:id=\"@+id/start\">\n        <Constraint\n            android:id=\"@+id/myButton\"\
  \n            android:layout_width=\"wrap_content\"\n            android:layout_height=\"\
  wrap_content\"\n            motion:layout_constraintTopTopOf=\"parent\"\n      \
  \      android:layout_marginTop=\"8dp\"\n            motion:layout_constraintStart_toStartOf=\"\
  parent\"\n            motion:layout_constraintEnd_toEndOf=\"parent\" />\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n        <Constraint\n            android:id=\"\
  @+id/myButton\"\n            android:layout_width=\"wrap_content\"\n           \
  \ android:layout_height=\"wrap_content\"\n            motion:layout_constraintStart_toStartOf=\"\
  parent\"\n            motion:layout_constraintEnd_toEndOf=\"parent\"\n         \
  \   motion:layout_constraintBottom_toBottomOf=\"parent\"\n            android:layout_marginBottom=\"\
  8dp\" />\n    </ConstraintSet>\n</MotionScene>\n```\n\n同样注意 `Transition` 元素已经预配置为在\
  \ 1000 毫秒内动画起始和结束点之间的过渡。尽管我们还没有添加触发过渡的动作，但仍然可以在 `MotionLayout` 编辑器内部预览动画。\n\n##\
  \ 43.4 预览 MotionLayout 动画\n\n要在不构建和运行应用程序的情况下预览动画，选择 `MotionLayout` 编辑器中在下方图 43-9\
  \ 中标记为 A 的过渡箭头。这将显示动画时间轴面板（标记为 B）：\n\n![](img/as_motionlayout_test_animation.jpg)\n\
  \n图 43-9\n\n\n\n\n\n要测试动画，点击滑块 (C) 并沿着时间轴拖动它。随着滑块移动，布局画布上的按钮将沿着虚线路径 (D) 移动。使用工具栏按钮\
  \ (E) 执行完整动画，以便以不同的速度持续重复动画（向前、向后或来回切换）。\n\n## 43.5 添加 OnClick 点击手势\n\n虽然已经创建了一个简单的\
  \ `MotionLayout` 动画过渡，但我们仍然需要一种在运行的 App 内部启动动画的方法。这可以通过分配点击或滑动处理程序来实现。在本示例中，我们将配置动画在用户点击按钮时启动。在\
  \ `MotionLayout` 编辑器中，如果动画在循环设置下运行，请先暂停时间轴动画。接下来，选择过渡箭头（如上方图 43-9 中标记的 A），在属性（Attributes）工具窗口中找到\
  \ `OnClick` 属性区域，并点击下方图 43-10 中箭头所示的 `+` 按钮：\n\n![](img/as_motionlayout_add_onclick.jpg)\n\
  \n图 43-10\n\n`OnClick` 面板将出现第一个属性的空行。对于属性名称，输入 `targetId`；对于值字段，输入按钮的 id (`@id/myButton`)。在下一个空行中，在属性名称字段中输入\
  \ `app:clickAction`。在值字段中，点击向下箭头显示有效选项菜单：\n\n![](img/as_motionlayout_onclick_toggle.jpg)\n\
  \n图 43-11\n\n在本示例中，选择切换（toggle）动作。这将导致视图在被点击时动画到相反的位置。一旦输入了这些设置，它们应该与图 43-12 中所示的内容匹配：\n\
  \n![](img/as_4.0_motionlayout_onclick_added.jpg)\n\n图 43-12\n\n再次打开 `activity_main_scene.xml`\
  \ 文件并检查在 `Transition` 条目中定义的 `OnClick` 属性：\n\n```xml\n<Transition\n    motion:constraintSetEnd=\"\
  @+id/end\"\n    motion:constraintSetStart=\"@id/start\"\n    motion:duration=\"\
  1000\">\n    <KeyFrameSet>\n    </KeyFrameSet>\n    <OnClick motion:targetId=\"\
  @id/myButton\"\n             motion:clickAction=\"toggle\" />\n</Transition>\n```\n\
  \n在设备或模拟器上编译并运行 App，确认点击按钮会导致它在 `MotionScene` 文件中定义的起始点和结束点之间来回切换。\n\n## 43.6 在过渡中添加属性关键帧\n\
  \n到为止，示例项目仅演示了按钮视图从屏幕上一个位置到另一个位置的运动。属性关键帧（`KeyAttribute`）提供了一种方法，用于指定过渡时间轴中的点，使其他属性更改在这些点生效。例如，可以定义一个\
  \ `KeyAttribute`，使得视图移动到时间轴的 30% 时，其尺寸必须已经增加了 50%。在本示例中，我们将添加一个位于动画中点的旋转效果。\n\n\
  首先，在 MotionLayout 编辑器中打开 `activity_main.xml` 文件，选择过渡连接箭头以显示时间轴，然后点击图 43-13 中高显的按钮：\n\
  \n![](img/as_motionlayout_add_keyframe.jpg)\n\n图 43-13\n\n从菜单中，选择 `KeyAttribute`\
  \ 选项：\n\n![](img/as_motionlayout_add_key_attribute.jpg)\n\n图 43-14\n\n选中后，将出现图 43-15\
  \ 所示的对话框。在对话框中，确保选择了 ID 选项并引用了 `myButton`。在位置字段中，输入 `50`（以百分比指定，`0` 是起点，`100` 是终点）。最后，在点击\
  \ `Add` 按钮之前，从属性下拉菜单中选择旋转（rotation entry）：\n\n![](img/as_motionlayout_create_key_attribute.jpg)\n\
  \n图 43-15\n\n添加 `KeyAttribute` 后，时间轴内会出现一个该属性的行。点击该行将其高亮，然后点击行最左侧边缘的展开箭头以展开属性过渡图。注意，时间轴上出现了一个小的菱形标记（如下方图\
  \ 43-16 所示），表示关键帧的位置。图表表示效果的线性。在这种情况下，按钮将稳稳地旋转到指定的度数，并在关键帧位置达到最大旋转。当到达终点时，按钮将旋转回\
  \ `0` 度：\n\n![](img/as_motionlayout_attribute_timeline.jpg)\n\n图 43-16\n\n要更改 `KeyAttribute`\
  \ 的属性，请在时间轴上选中并参考属性工具窗口。在 `KeyAttribute` 面板中，将旋转更改为 `360`：\n\n![](img/as_motionlayout_key_attribute.jpg)\n\
  \n图 43-17\n\n通过来回拖动滑块检查该属性是否生效。参考 `activity_main_scene.xml` 文件，它应该显示如下：\n\n```xml\n\
  <Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n        <KeyAttribute\
  \ motion:targetId=\"@id/myButton\"\n            motion:position=\"50\"\n       \
  \     motion:rotation=\"360\" />\n    </KeyFrameSet>\n    <OnClick motion:targetId=\"\
  @id/myButton\"\n             motion:clickAction=\"toggle\" />\n</Transition>\n```\n\
  \n通过移动滑块或编译 App 来测试动画。\n\n## 43.7 添加 CustomAttribute 到\n\n`KeyAttribute` 属性限于调整大小和旋转等内置效果。通过声明\
  \ `CustomAttributes` 也可以实现额外的更改。与存储在 `Transition` 中的 `KeyAttributes` 不同，`CustomAttributes`\
  \ 位于起始和结束约束集中。因此，这些属性只能在起点和终点声明（也就是说，你不能在时间轴中间指定属性帧）。\n\n在本示例中，我们将配置按钮从红色变为绿色。首先，选择图\
  \ 43-18 中标记为 A 的框，然后是 `myButton` 约束集 (B)：\n\n![](img/as_motionlayout_attr.jpg)\n\
  \n图 43-18\n\n参考属性工具窗口，点击下方所示 `CustomAttributes` 区域中的 `+` 按钮：\n\n![](img/as_motionlayout_add_attribute.jpg)\n\
  \n图 43-19\n\n在弹出对话框（图 43-20）中，将属性类型更改为 `Color`，并在名称字段输入 `backgroundColor`。最后，将值设置为\
  \ `#F8A1F`：\n\n![](img/as_motionlayout_custom_attribute_dialog.jpg)\n\n图 43-20\n\
  \n点击 OK 更改，然后选择上方图 43-18 中标记为 C 的结束约束集，重复步骤添加自定义属性，这次指定 `#33CC33` 为颜色的 RGB 值。\n\n\
  使用时间轴滑块或运行 App，确保按钮在动画期间颜色变化。`CustomAttributes` 的添加将反映在 `activity_main_scene.xml`\
  \ 文件中：\n\n```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint android:id=\"\
  @+id/myButton\">\n        <CustomAttribute\n            motion:attributeName=\"\
  backgroundColor\"\n            motion:customColorValue=\"#F8A1F\" />\n    </Constraint>\n\
  </ConstraintSet>\n\n<ConstraintSet android:id=\"@+id/end\">\n    <Constraint android:id=\"\
  @+id/myButton\">\n        <CustomAttribute\n            motion:attributeName=\"\
  backgroundColor\"\n            motion:customColorValue=\"#33CC33\" />\n    </Constraint>\n\
  </ConstraintSet>\n```\n\n\n\n\n\n## 43.8 添加位置关键帧\n\n本教程的最后一个任务是在动画路径上添加两个位置关键帧（`KeyPosition`），以为动画引入一些横向移动。在\
  \ MotionLayout 编辑器中，过渡时间轴可见的情况下，点击如上方图 43-13 所示的高亮按钮来创建关键帧，并从菜单中选择 `KeyPosition`\
  \ 选项，如下方的图 43-21 所示：\n\n![](img/as_motionlayout_keyposition_menu.jpg)\n\n图 43-21\n\
  \n在弹出的对话框中，按照图 43-22 所示所示设置属性：\n\n![](img/as_motionlayout_create_keyposition.jpg)\n\
  \n图 43-22\n\n点击 Add（添加）按钮提交更改，然后重复上述步骤，添加配置如下的第二个位置关键帧：\n\n* 位置（Position）：`75`\n\
  * 类型（Type）：`parentRelative`\n* X 轴百分比（PercentX）：`0.85`\n* Y 轴百分比（PercentY）：`0.75`\n\
  \n完成这些更改后，`activity_main_scene.xml` 文件中的过渡元素将添加了以下关键帧项：\n\n```xml\n<KeyFrameSet>\n\
  \    <KeyPosition\n        motion:motionTarget=\"@+id/myButton\"\n        motion:framePosition=\"\
  25\"\n        motion:keyPositionType=\"parentRelative\"\n        motion:percentX=\"\
  0.15\"\n        motion:percentY=\"0.25\" />\n    <KeyPosition\n        motion:motionTarget=\"\
  @+id/myButton\"\n        motion:framePosition=\"75\"\n        motion:keyPositionType=\"\
  parentRelative\"\n        motion:percentX=\"0.85\"\n        motion:percentY=\"0.75\"\
  \ />\n</KeyFrameSet>\n```\n\n最后测试一次应用程序，验证按钮现在是否按照所示路径移动，同时仍保持旋转并改变颜色：\n\n![](img/as_motionlayout_path_1.jpg)\n\
  \n图 43-23\n\n位置关键帧由预览画布中表示运动路径的虚线上的菱形标记表示，如图 43-24 所示（如果标记不可见，请确保在预览中选中了 `Button`\
  \ 视图）：\n\n![](img/as_motionlayout_path_2.jpg)\n\n图 43-24\n\n要从视觉上调整关键帧的位置，点击标记并将其拖到新位置。随着标记的移动，Motion\
  \ Layout 编辑器将显示一个网格以及当前的 `x` 和 `y` 坐标：\n\n![](img/as_motionlayout_path_3.jpg)\n\n\
  图 43-25\n\n## 43.9 总结\n\n本章介绍了 Android Studio 内置的 MotionLayout 编辑器，并探索了如何使用它在无需手动编写\
  \ XML 声明的情况下，为 Android 应用程序的用户界面添加动画。本章中涵盖的示例包括将 `ConstraintLayout` 容器转换为 `MotionLayout`、在\
  \ `MotionScene` 文件中创建起始和结束约束集及过渡，以及添加 `OnClick` 处理器。此外还涵盖了动画预览器、自定义属性和位置关键帧。\n\n\
  ## 44. MotionLayout 循环教程\n\n之前的章节介绍并演示了如何使用 `MotionLayout` 容器结合 Android Studio MotionLayout\
  \ 编辑器的功能，将动画集成到 Android 应用程序的用户界面中的概念。标题为 MotionLayout 简介的章节简要提到了循环（`KeyCycle`）和时间循环（`KeyTimeCycle`）关键帧，并解释了如何使用它们来实现涉及大量重复状态变化的动画。\n\
  \n本章将更详细地介绍循环关键帧，然后演示如何在使用 Android Studio 和循环编辑器器的项目中创建它们。\n\n### 44.1 循环关键帧概述\n\
  \n位置关键帧可以为动画时间轴添加中间状态变化。虽然这对于较少的状态变化效果良好，但要实现大量变化将非常繁琐。例如，为了让按钮在点击时抖动 50 次以表示发生错误，将涉及手动创建\
  \ 100 个位置关键帧来执行小的顺时针和逆时针旋转。同样，在视图跨越屏幕移动时实现跳动效果同样耗时。\n\n对于需要重复执行状态更改的情况，MotionLayout\
  \ 包含了 `Cycle` 和时间循环关键帧。两者都执行相同的任务，区别在于 `KeyCycle` 帧是基于动画路径内的帧位置，而 `KeyCycles` 是基于每秒循环次数（`Hz`）的时间。\n\
  \n使用这些 `KeyCycle` 帧，动画时间轴本质上被分为子部分（称为循环），每个子部分包含一个或多个波形，定义了如何修改视图的属性。创建 `KeyCycle`\
  \ 循环需要以下信息：\n\n* `target`：将进行更改的视图 ID。\n* `frame position`（帧位置）：循环开始的时间轴位置。\n* `wave\
  \ period`（波周期）：循环中包含的波的数量。\n* `attribute`：被波形修改的视图属性。\n* `wave offset`（波偏移）：按指定量偏移循环。\n\
  * `wave shape`（波形）：波的形状（`sin`、`cos`、`sawtooth`、`triangle`）。\n\n考虑以下循环关键帧集：\n\n```xml\n\
  <KeyFrameSet>\n    <KeyCycle\n        motion:framePosition=\"0\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"50dp\" />\n \
  \   <KeyCycle\n        motion:framePosition=\"25\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"50dp\" />\n \
  \   <KeyCycle\n        motion:framePosition=\"50\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"50dp\" />\n \
  \   <KeyCycle\n        motion:framePosition=\"75\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"50dp\" />\n \
  \   <KeyCycle\n        motion:framePosition=\"100\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"50dp\" />\n</KeyFrameSet>\n\
  ```\n\n上述关键帧集将时间轴分为四个相等的循环。每个循环都被配置为包含一个 `sin` 波形，用于调整按钮的 `translationY` 属性。执行时，此动画将导致按钮在指定范围内多次振荡。此关键帧集可以如图\
  \ 44-1 所示进行可视化，其中五个点表示关键帧位置：\n\n![](img/as_4.0_keycycle_simple_sin.jpg)\n\n图 44-1\n\
  \n按照目前的实现，每个循环包含一个波。假设我们在最后一个循环中需要四个波，而不是这些均匀分布的波。可以通过如下增加最后一个 `KeyCycle` 元素的 `wavePeriod`\
  \ 属性轻松实现：\n\n```xml\n    <KeyCycle\n        motion:framePosition=\"75\"\n      \
  \  motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"4\"\n      \
  \  motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n        android:translationY=\"\
  50dp\"/>\n```\n\n进行此更改后，关键帧集可以如下波形形式渲染：\n\n![](img/as_4.0_keycycle_sin_waveperiod.jpg)\n\
  \n图 44-2\n\n\n\n\n\n到目前为止，本章的示例一直使用的是正弦波。在 `MotionLayout` 中使用循环关键帧时，还有其他波形可用。例如，图\
  \ 44-3 展示了将所有循环关键帧的 `waveShape` 属性更改为锯齿波的效果：\n\n![](img/as_4.0_keycycle_sawtooth.jpg)\n\
  图 44-3\n\n除了正弦波和锯齿波，`MotionLayout` 还支持三角形波、方形波、弹跳波和反向锯齿波波形。\n\n在上面的示例中，每个循环都在沿 Y\
  \ 轴的相同范围内移动按钮。然而，假设我们需要第二个循环沿 Y 轴正方向移动按钮的距离更远一些。这涉及按照如下方式调整第二个循环的 `waveOffset` 属性：\n\
  \n```xml\n<KeyCycle\n      motion:framePosition=\"25\"\n      motion:target=\"@+id/button\"\
  \n      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"100dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"50dp\"/>\n```\n\n通过此更改，我们得到了一个类似于 图 44-4 的时间线：\n\
  \n![](img/as_4.0_keycycle_sin_waveoffset.jpg)\n图 44-4\n\n现在，在第二个循环期间，按钮的移动范围将在 Y\
  \ 轴上的大约 0 到 150dp 之间。如果我们仍然需要范围的低端与其他波形匹配，我们当然可以为 `translationY` 值增加 100dp：\n\n\
  ```xml\n<KeyCycle\n      motion:framePosition=\"25\"\n      motion:target=\"@+id/button\"\
  \n      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"100dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"150dp\"/>\n```\n\n此更改现在为我们提供了以下波形：\n\n![](img/as_4.0_keycycle_sin_waveoffset_flat.jpg)\n\
  图 44-5\n\n## 44.2 使用循环编辑器\n\n尽管不是特别复杂，但通过直接编辑 `MotionScene` 文件中的 XML `KeyCycle`\
  \ 条目来获取所需的精确循环配置可能需要一些时间。为了改进，Google 的 Android 工程师开发了 `Cycle Editor`（循环编辑器）。这个独立的基于\
  \ Java 的工具尚未成为 Android Studio 的。`Cycle Editor` 允许你可视化地设计和测试循环关键帧集。\n\n`Cycle Editor`\
  \ 工具是一个 Java 归档（.jar）文件，需要在你的开发系统中安装 Java 运行环境。\n\n一旦安装了 Java，可以从以下 URL 下载 `CycleEditor.jar`\
  \ 文件：\n\n[`github.com/googlesamples/android-ConstraintLayoutExamples/releases/download/1.0/CycleEditor.jar`](https://github.com/googlesamples/android-ConstraintLayoutExamples/releases/download/1.0/CycleEditor.jar)\n\
  \n下载后，打开命令提示符或终端窗口，切换到 jar 文件所在的目录，并运行以下命令：\n\n```bash\njava -jar CycleEditor.jar\n\
  ```\n\n一旦工具加载，将出现 图 44-6 所示的屏幕：\n\n![](img/as_4.0_keycycle_editor_main.jpg)\n图 44-6\n\
  \n上图中标记为 A 的面板显示关键帧集的 XML，可以直接进行编辑，也可以使用 B 面板中的控件进行编辑。面板 C 显示循环以波形形式的渲染。遗憾的是，它在进行更改时不会实时重绘。相反，必须通过选择\
  \ `File -> parse xml` 菜单选项来刷新。标记为 D 的面板将在点击 B 面板中的播放按钮时显示循环动画的实时渲染。`Examples` 菜单提供了一系列示例关键帧集，这些集合既可以用于学习目的，也可以作为你自己动画的基础。\n\
  \n本章的剩余部分将创建一个示例项目，实现一个基于 `KeyCycle` 的动画效果，以演示 `Cycle Keyframe` 和 `Cycle Editor`\
  \ 的用法。\n\n## 44.3 创建 KeyCycleDemo 项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，在生成的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `KeyCycleDemo`，并指定\
  \ `com.ebookfrenzy.keycycledemo` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为\
  \ `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单设置为 `Java`。\n\n在 `Design` 模式下使用布局编辑器并打开\
  \ `activity_main.xml` 文件，右键点击 `ConstraintLayout` 条目并选择 `Convert to MotionLayout`\
  \ 菜单选项：\n\n![](img/as_4.0_keycycle_sawtooth.jpg)\n图 7\n\n## 44.4 配置开始和结束约束\n\n本教程旨在制作按钮从一侧移动到另一侧的动画，包括导致视图沿\
  \ Y 轴上下移动的 `KeyCycle` 效果。第一步是配置开始和结束。\n\n将 `activity_main.xml` 文件加载到 `MotionLayout`\
  \ 编辑器中，选择 `TextView`。\n\n![](img/as_4.0_keycycle_sawtooth.jpg)\n图 8\n\n要配置起始点，在\
  \ 图 44-9 中选择 `start` 约束：\n\n![](img/as_4.0_keycycle_sawtooth.jpg)\n图 9\n\n接下来，在\
  \ `ConstraintSet` 中选择 `KeyCycle` 条目。在按钮被选中的情况下，点击 `Create` 按钮 (C)。\n\n```xml\n<KeyCycle\n\
  \      motion:framePosition=\"0\"\n      motion:target=\"@+id/button\"\n      motion:wavePeriod=\"\
  1\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"sin\"/>\n```\n\n\
  选择 图 44-9 中的 `end` 约束（标记为 D），重复步骤创建新的约束：\n\n![](img/as_4.0_keycycle_sawtooth.jpg)\n\
  图 10\n\n### 44.5 创建循环\n\n下一步是使用 `Cycle Editor` 为动画生成关键帧。当 `Cycle Editor` 运行时，参考\
  \ 图 44-12 中的控制面板：\n\n![](img/as_4.0_keycycle_sawtooth.jpg)\n图 12\n\n使用标记为 A 的菜单，将要修改的属性从\
  \ `rotation` 更改为 `translationY`。\n\n接下来，使用 `KeyCycle` 控制 (B) 选择 `0`，以便在面板其他地方进行的更改。如\
  \ 图 44-13 所示，将 `Period` 滑块移动到 `1`，并将 `translationY` 滑块移动到 `60`（移动滑块时查看 XML 面中的 `translationY`\
  \ 值）：\n\n![](img/as_4.0_keycycle_0.jpg)\n图 13\n\n选择 `File -> Parse XML` 菜单选项查看图中的更改。使用\
  \ 表 44-1 列出的值，配置关键帧 1 到 4 设置（注意你已经配置了 `KeyCycle 0` 列的设置）：\n\n| | KeyCycle 0 | KeyCycle\
  \ 1 | KeyCycle 2 | KeyCycle 3 | KeyCycle 4 |\n| --- | --- | --- | --- | --- | ---\
  \ |\n| Position | 0 | 25 | 50 | 75 | 100 |\n| Period | 1 | 2 | 3 | 2 | 1 |\n| translationY\
  \ | 60 | 60 | 150 | 60 | 60 |\n\n表 44-1\n\n完成这些更改后，关键帧集的 XML 应该如下：\n\n```xml\n<KeyFrameSet>\n\
  \    <KeyCycle\n      motion:framePosition=\"0\"\n      motion:motionTarget=\"@+id/button\"\
  \n      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"/>\n</KeyFrameSet>\n```\n\n\n\n\n\n```xml\nandroid:translationY=\"60dp\"/>\n\
  \n<KeyCycle\n    motion:framePosition=\"25\"\n    motion:motionTarget=\"@+id/button\"\
  \n    motion:wavePeriod=\"2\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"\
  sin\"\n    android:translationY=\"60dp\"/>\n\n<KeyCycle\n    motion:framePosition=\"\
  50\"\n    motion:motionTarget=\"@+id/button\"\n    motion:wavePeriod=\"3\"\n   \
  \ motion:waveOffset=\"0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"\
  150dp\"/>\n\n<KeyCycle\n    motion:framePosition=\"75\"\n    motion:motionTarget=\"\
  @+id/button\"\n    motion:wavePeriod=\"2\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"\
  sin\"\n    android:translationY=\"60dp\"/>\n\n<KeyCycle\n    motion:framePosition=\"\
  100\"\n    motion:motionTarget=\"@+id/button\"\n    motion:wavePeriod=\"1\"\n  \
  \  motion:waveOffset=\"0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"\
  60dp\"/>\n</KeyFrameSet>\n```\n\n要查看带有新循环的图形，请选择 `File -> Parse XML` 菜单选项以刷新波形，该波形现在应该如图\
  \ 44-14 所示：\n\n![](img/as_4.0_keycycle_editor_cyclekeys_complete.jpg)\n\n图 44-14\n\
  \n### 44.6 预览动画\n\n现在可以从循环编辑器（Cycle Editor）工具内部预览基于循环的动画。点击播放按钮（在图 44-15 中标记为 A）启动动画。要将循环与水平移动相结合，将第二个菜单\
  \ (B) 从 Stationary（静止）更改为 West（西）到 East（东）。此外，请花一些时间尝试时间和线性度设置（C 和 D）。\n\n![](img/as_4.0_keycycle_play_buttons.jpg)\n\
  \n图 44-15\n\n### 44.7 将 KeyFrameSet 添加到 MotionScene\n\n在循环编辑器中，从 XML 面板中选中并复制 `KeyCycle`\
  \ 元素，并将它们粘贴到 Android Studio 中 `res -> xml -> activity_main_scene.xml` 文件的 Transition\
  \ 部分，以便将它们放置在现有的 `KeyFrameSet` 标记之间。还要注意增加的持续时间设置以及用于启动动画的 `OnClick` 句器的添加：\n\n\
  ```xml\n<Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"7000\">\n    <KeyFrameSet>\n        <KeyCycle\n\
  \            motion:framePosition=\"0\"\n            motion:motionTarget=\"@+id/button\"\
  \n            motion:wavePeriod=\"1\"\n            motion:waveOffset=\"0dp\"\n \
  \           motion:waveShape=\"sin\"\n            android:translationY=\"60dp\"\
  />\n        <KeyCycle\n            motion:framePosition=\"25\"\n.\n.\n    </KeyFrameSet>\n\
  \    <OnClick motion:targetId=\"@id/button\"\n              motion:clickAction=\"\
  toggle\" />\n.\n.\n```\n\n在继续之前，检查每个目标属性是否已正确声明。在编写时，循环编辑器仍在使用过时的 `motion:target`\
  \ 标签。例如：\n\n```xml\nmotion:target=\"@+id/button\"\n```\n\n这需要对五个 `KeyCycle` 条目中的每一个进行更改为：\n\
  \n```xml\nmotion:motionTarget=\"@+id/button\"\n```\n\n一旦完成这些更改，在设备或模拟器上编译并运行应用，然后点击按钮开始并查看动画。\n\
  \n注意，`KeyCycle` 的波形形成也可以在 Android Studio MotionLayout 编辑器中查看，如下方的图 44-16 所示：\n\n\
  ![](img/as_keycycle_demo_transition.jpg)\n\n图 44-16\n\n`KeyCycle` 组不限于一个动画。例如，向\
  \ `activity_main_scene.xml` 文件的 Transition 部分添加以下 `KeyFrameSet`，以便在按钮移动时添加一些效果：\n\
  \n```xml\n<KeyFrameSet>\n    <KeyCycle\n        motion:framePosition=\"0\"\n   \
  \     motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"1\"\n   \
  \     motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n        android:translationY=\"\
  60dp\"/>\n    <KeyCycle\n        motion:framePosition=\"25\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"2\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"60dp\"/>\n  \
  \  <KeyCycle\n        motion:framePosition=\"50\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"3\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"150dp\"/>\n \
  \   <KeyCycle\n        motion:framePosition=\"75\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"2\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"60dp\"/>\n  \
  \  <KeyCycle\n        motion:framePosition=\"100\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"60dp\"/>\n</KeyFrameSet>\n\
  ```\n\n### 44.8 总结\n\n基于循环的动画现在可以用于预览涉及大量状态变化的动画。如本章所示，使用循环编辑器可以极大简化这一过程。\n\n###\
  \ 45. 使用悬浮操作按钮和 Snackbar\n\n本章的目标之一是提供材料设计（Material Design）的概述。材料设计是 Android 5.0\
  \ 引入的，是一套规范 Android 用户界面以及运行在其上的应用外观和行为的指南。\n\n在实现材料设计概念时，Google 还引入了 Android 支持库（Support\
  \ Library）。该库包含了多个组件，允许在 Android 应用中构建材料设计的关键功能。这些组件中的悬浮操作按钮（Floating Action Button）和\
  \ Snackbar 将在本章中进行讨论。\n\n#### 45.1 材料设计\n\n\n\n\n实现采用 Material 设计原则的 Android 应用所需的许多构建模块都包含在\
  \ Android Design Support Library 中。该库包含系列用户界面组件，这些组件可以包含在 Android 应用中，以实现 Material\
  \ 设计的大外观、感觉和行为。该库中的两个组件——浮操作按钮（FAB）和 Snackbar 将在本章中介绍，其他组件将在后续章节介绍。\n\n## 45.3 浮操作按钮\
  \ (FAB)\n\n浮操作按钮看起来悬浮在应用用户界面的表面之上。它通常促进用户界面屏幕中最常见的操作。浮操作按钮可以放置在屏幕上，允许用户向联系列表添加条目或从应用内发送电子邮件。例如，图\
  \ 45-1 显示了标准 Android 联系人应用中用于添加新联系人的浮操作按钮：\n\n![](img/as_contacts_app.jpg)\n\n图\
  \ 45-1\n\n使用浮操作按钮时应遵循若干规则以符合 Material 设计指南。浮操作按钮必须是圆形的，尺寸可以是 56 x 56dp（默认）或 40 x\
  \ 40dp（微型）。按钮在手机上距离屏幕边缘至少 16dp，在桌面级和平板设备上至少 24dp。无论尺寸如何，按钮必须包含一个 24x24dp 尺寸的内部图标，建议每个用户界面屏幕只有一个浮操作按钮。\n\
  \n浮操作按钮可以带有动画效果，或者设计为在触摸时变形为其他项目。例如，浮操作按钮在点击时可以旋转，或变形为另一个元素，例如工具栏或列出相关操作的面板。\n\n\
  ### 45.4 Snackbar\n\nSnackbar 组件提供了一种以屏幕底部面板向用户展示信息的方法，如图 45-2 所示。Snackbar 实例包含简短的文本消息和一个可选的操作按钮，该按钮在用户点击时将执行任务。一旦显示，Snackbar\
  \ 将将自动超时消失，也可以由用户通过滑动操作手动移除。在 Snackbar 显示期间，应用将继续运行并正常响应用户交互。\n\n![](img/as_snackbar_example.jpg)\n\
  \n图 45-2\n\n在本章的剩余部分中，将创建一个示例应用程序，该程序使用浮操作按钮和 Snackbar 的基本功能向项目列表添加条目。\n\n## 45.5\
  \ 创建示例项目\n\n从欢迎界面选择“新项目”（New Project）选项，在生成的新项目对话框中，点击“下一步”（Next）按钮之前选择“Basic Views\
  \ Activity”模板。\n\n在 `Name` 字段中输入 `FabExample` 并指定 `com.ebookfrenzy.fabexample` 为包名。在点击“完成”（Finish）按钮之前，将最低\
  \ API 级别（Minimum API level）设置设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单更改为 `Java`。\n\
  \n## 45.6 检查项目\n\n由于选择了 Basic Views Activity 模板，该活动包含四个布局文件。`activity_main.xml`\
  \ 文件由一个 `CoordinatorLayout` 布局组成，其中包含应用栏、Material 工具栏和浮操作按钮条目。\n\n`content_main.xml`\
  \ 文件代表活动内容区域的布局，包含一个 `NavHostFragment` 实例。该文件通过以下 `include` 指令嵌入到 `activity_main.xml`\
  \ 文件中：\n\n```xml\n<include layout=\"@layout/content_main\" />\n```\n\n`activity_main.xml`\
  \ 文件中的浮操作按钮元素如下：\n\n```xml\n<com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \    android:id=\"@+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout_marginEnd=\"\
  @dimen/fab_margin\"\n    android:layout_marginBottom=\"16dp\"\n    app:srcCompat=\"\
  @android:drawable/ic_dialog_email\" />\n```\n\n这声明按钮将出现在屏幕的右下角，边距由 `values/dimens.xml`\
  \ 文件中的 `fab_margin` 标识表示（在本例中，它设置为 16dp）。XML 进一步声明按钮的内部图标将采用标准内置 drawable 电子邮件图标的形式。\n\
  \n空白模板还配置了浮操作按钮，当用户点击它时显示 Snackbar 实例。实现此功能的代码可以在 `MainActivity.java` 文件的 `onCreate()`\
  \ 方法中找到，如下：\n\n```java\nbinding.fab.setOnClickListener(new View.OnClickListener()\
  \ {\n    @Override\n    public void onClick(View view) {\n        Snackbar.make(view,\
  \ \"Replace with your own action\", Snackbar.LENGTH_LONG)\n                .setAction(\"\
  Action\", null).show();\n    }\n});\n```\n\n代码通过视图绑定（view binding）访问浮操作按钮，并添加了一个\
  \ `onClickListener` 处理程序，在点击按钮时调用。此方法显示一个配置了消息但没有操作的 Snackbar 实例。当项目编译并运行时，浮操作按钮将出现在屏幕底部，如图\
  \ 45-3 所示：\n\n![](img/as_default_fab.jpg)\n\n图 45-3\n\n点击浮操作按钮将触发 `onClickListener`\
  \ 处理程序，导致 Snackbar 出屏幕底部：\n\n![](img/as_default_snackbar.jpg)\n\n图 45-4\n\n## 45.7\
  \ 移除导航功能\n\n如《布局编辑器指南》概述所示，Basic Views Activity 模板包含多个片段（fragments）和按钮，用于在片段之间导航。这些功能对于本教程来说是不必要的，并且稍后引起问题。在继续教程之前，请按照以下方式修改项目：\n\
  \n1. 在 Project（项目）工具窗口中，导航到并双击 `app -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n\
  2. 在编辑器的 Component Tree（组件树）面板中选择 `SecondFragment` 条目，并按键盘删除键将其从图中移除。\n3. 找到并删除\
  \ `SecondFragment.java` (`app -> java -> <package name> -> SecondFragment`）和 `fragment_second.xml`\
  \ (`app -> res -> layout -> fragment_second.xml`) 文件。\n4. 找到 `FirstFragment.java`\
  \ 文件，双击将其加载到编辑器，并移除 `onViewCreated()` 方法中的代码，使其如下：\n\n```java\nbinding.buttonFirst.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        NavHostFragment.findNavController(FirstFragment.this)\n            .navigate(R.id.action_FirstFragment_to_SecondFragment);\n\
  \    }\n});\n```\n\n## 45.8 更改浮操作按钮\n\n由于此示例的目标是配置浮操作按钮向列表添加条目，因此目前按钮上显示的电子邮件图标需要更改为指示所执行操作的图标。用于按钮的图标是\
  \ `ic_add_entry.png`，可以在从以下 URL 下载的示例代码的 `project_icons` 文件夹中找到：\n\n[`www.ebookfrenzy.com/retail/giraffejava/index.php`](https://www.ebookfrenzy.com/retail/giraffejava/index.php)\n\
  \n在操作系统的文件管理器中找到此图像并复制文件。在 Project 工具窗口的 `app -> res -> drawable` 条目上右键点击，从菜单中选择“粘贴”，将文件添加到文件夹：\n\
  \n![](img/as_fib_icon_added.jpg)\n\n图 45-5\n\n接下来，编辑 `activity_main.xml` 文件并将图标图像源从\
  \ `@android:drawable/ic_dialog_email` 更改为 `@drawable/ic_add_entry`如下：\n\n\n\n\n\n\
  ```xml\n<com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \    android:id=\"@+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout_margin=\"\
  @dimen/fab_margin\"\n    android:layout_marginBottom=\"16dp\"\n    app:srcCompat=\"\
  @drawable/ic_add_entry\" />\n```\n\n在布局预览中，按钮内部的图标已变为一个加号。\n\n我们还可以通过向 `OnClickListener`\
  \ 中添加代码，让悬浮动作按钮在点击时执行几乎任何操作。例如，对 `MainActivity.java` 文件进行以下更改，可以在每次点击按钮时调用名为 `displayMessage()`\
  \ 的方法来显示 toast 消息：\n\n```java\nimport android.widget.Toast;\n\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        displayMessage(\"Fab clicked\");\n        Snackbar.make(view, \"Replace\
  \ with your own action\", Snackbar.LENGTH_LONG)\n                  .setAction(\"\
  Action\", null).show();\n    }\n});\n\npublic void displayMessage(String message)\
  \ {\n    Toast.makeText(this,message,Toast.LENGTH_SHORT).show();\n}\n```\n\n###\
  \ 45.9 为 Snackbar 添加动作\n\n也可以向 `Snackbar` 添加一个动作，该动作在用户点击时会执行某项任务。编辑 `MainActivity.java`\
  \ 文件并修改 `Snackbar` 的创建代码，添加一个标题为“My Action”的动作，并配置一个名为 `actionOnClickListener` 的\
  \ `OnClickListener`，后者反过来会显示一条 toast 消息：\n\n```java\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \                 .setAction(\"My Action\", actionOnClickListener).show();\n   \
  \ }\n});\n```\n\n在 `MainActivity.java` 文件中，添加监听器处理器：\n\n```java\nView.OnClickListener\
  \ actionOnClickListener = new View.OnClickListener() {\n    @Override\n    public\
  \ void onClick(View view) {\n        displayMessage(\"Action clicked\");\n     \
  \   Snackbar.make(view, \"Action Complete\", Snackbar.LENGTH_LONG)\n           \
  \       .setAction(\"Action\", null).show();\n    }\n};\n```\n\n运行应用并点击悬浮动作按钮，此时\
  \ toast 消息和 `Snackbar` 都应该出现。在 `Snackbar` 可见期间，点击 `Snackbar` 中的 My Action 按钮，并验证\
  \ `Snackbar` 上的文本已变为“Action Complete”：\n\n![](img/fab_action_clicked.jpg)\n\n图 45-6\n\
  \n### 45.10 总结\n\n在完成使用这些功能的示例项目之前，本章提供了对物化设计（Material Design）、悬浮动作按钮和 `Snackbar`\
  \ 的概述。\n\n悬浮动作按钮和 `Snackbar` 是 Android 物化设计用户界面实现方法的一部分。悬浮动作按钮提供了一种在 Android 应用特定屏幕内推广最常见操作的方法。`Snackbar`\
  \ 则提供了一种应用程序向用户展示信息并允许用户对信息进行操作的方法。\n\n# 46. 使用 TabLayout 组件创建标签页界面\n\n上一章概述了 Android\
  \ 中物化设计的概念。它引入了设计支持库提供的两个组件，形式为悬浮动作按钮和 `Snackbar`。本章将演示如何使用设计库的另一个组件 `TabLayout`，它可以与\
  \ `ViewPager` 类结合使用，在 Android Activity 中创建一个基于标签页的界面。\n\n### 46.1 ViewPager2 简介\n\
  \n虽然 `ViewPager2` 不属于设计支持库，但在与 `TabLayout` 组件配合实现标签页用户界面时，它是一个非常有用的辅助类。`ViewPager2`\
  \ 的主要作用是允许用户翻阅不同的信息页，通常每个布局片段（fragment）代表每一页。与 `ViewPager2` 关联的片段由 `FragmentStateAdapter`\
  \ 类的实例管理。\n\n至少，分配给 `ViewPager2` 的分页适配器必须实现两个方法。第一个命名为 `getItemCount()`，必须返回要显示给用户的页面片段总数。第二个方法\
  \ `createFragment()` 接收一个页码，并必须返回准备呈现给用户的相应片段对象。\n\n### 46.2 TabLayout 组件概述\n\n\
  如前所述，`TabLayout` 是物化设计引入的组件之一，并包含在设计支持库中。`TabLayout` 的目的是向用户展示一行标签，用户可以选择这些标签来向其显示不同的页面。标签可以是固定的，也可以是滚动的，用户可以向左或向右滑动以查看比当前显示器容量更多的标签。标签上显示的信息可以是文本、图像，或者文本与图像的组合。例如，图\
  \ 46-1 显示了一个包含四个显示图像标签的应用的标签栏：\n\n![](img/Image2425.jpg)\n\n图 46-1\n\n另一方面，图 46-2\
  \ 显示了一个由四个显示文本的标签组成的 `TabLayout` 配置，且为滚动配置：\n\n![](img/Image2434.jpg)\n\n图 46-2\n\
  \n本章的剩余部分将通过创建一个示例项目，演示 `TabLayout` 组件结合 `ViewPager2` 以及四个片段的使用。\n\n### 46.3 创建\
  \ TabLayoutDemo 项目\n\n从欢迎界面选择 New Project（新建项目）选项，并在生成的对话框中选择 Basic Activity 模板。在\
  \ Name 字段中输入 `TabLayoutDemo` 并指定 `com.ebookfrenzy.tablayoutdemo` 为包名。在点击 Finish\
  \ 按钮之前，将 Minimum API 设置为 26: Android 8.0 (Oreo)并将 Language 设置为 Java。\n\n项目创建后，进入布局编辑器加载\
  \ `content_main.xml` 文件，选择 `NavHostFragment` 对象并将其删除。由于我们将不会使用 Basic Activity 的功能，编辑\
  \ `MainActivity.java` 文件并修改 `onCreate()` 方法以移除导航代码：\n\n```java\n@Override\nprotected\
  \ void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    NavController navController = Navigation.findNavController(this,\
  \ R.id.nav_host_fragment_content_main);\n    appBarConfiguration = new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController);\n    binding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \                      .setAction(\"Action\", null).show();\n        }\n    });\n\
  }\n```\n\n最后，删除 `onSupportNavigateUp()` 方法：\n\n```java\n@Override\npublic boolean\
  \ onSupportNavigateUp() {\n    NavController navController = Navigation.findNavController(this,\
  \ R.id.nav_host_fragment_content_main);\n    return NavigationUI.navigateUp(navController,\
  \ appBarConfiguration) || super.onSupportNavigateUp();\n}\n```\n\n### 46.4 创建第一个片段\n\
  \n`TabLayout` 上的每个标签在选中时都会显示不同的片段。通过右键点击 Project 工具窗口中的 `app -> java -> com.ebookfrenzy.tablayoutdemo`\
  \ 项并选择 New -> Fragment -> Fragment (Blank) 选项来创建这些片段中的第一个。在生成的对话框中，在 Fragment Name\
  \ 字段中输入 `Tab1Fragment`并在 Fragment Layout Name 字段中输入 `fragment_tab1`。点击 Finish 按钮创建新片段：\n\
  \n![](img/as_tab_layout_fragment_java.jpg)\n\n图 46-3\n\n\n\n\n\n编辑 `Tab1Fragment.java`\
  \ 文件，如果 Android Studio 没有自动添加，请按照如下所示添加 `OnFragmentInteractionListener` 接口声明：\n\n\
  ```java\nimport android.net.Uri;\n\npublic interface OnFragmentInteractionListener\
  \ {\n    // TODO: Update argument type and name\n    void onFragmentInteraction(Uri\
  \ uri);\n}\n```\n\n将新建的 `fragment_tab1.xml` 文件（位于 `app` -> `res` -> `layout` 下）加载到\
  \ Layout 编辑器中，在组件树面板中右键点击 `FrameLayout` 项，并选择 `Convert FrameLayout to ConstraintLayout`\
  \ 选项。在弹出的对话框中，点击 `OK` 之前确认已选中所有转换选项。将布局的 `ID` 更改为 `constraintLayout`。\n\n一旦布局转换为\
  \ `ConstraintLayout`，删除布局中的 `TextView`。从 `Palette`（调色板）中找到 `TextView` 组件，将其拖动到布局的中心。编辑对象的文本属性使其显示为“Tab\
  \ 1 Fragment”，将字符串提取为名为 `tab_1_fragment` 的资源，然后点击工具栏上的 `Infer Constraints`（推断约束）按钮。此时，布局应与图\
  \ 46-4 一致：\n\n![](img/as_3.5_tab_layout_fragment_ui.jpg)\n图 46-4\n\n### 46.5 复制\
  \ Fragment\n\n到为止，项目包含了四个所需的 Fragment 中的一个。与其使用之前的步骤创建剩余的三个 Fragment，不如复制第一个 Fragment\
  \ 会快得多。每个 Fragment 都由一个布局 XML 文件和一个 Java 类文件组成，每个文件都需要复制。\n\n在 Project 工具窗口中右键点击\
  \ `fragment_tab1.xml` 文件，并在弹出的菜单中选择 `Copy`（复制）选项。再次右键点击布局项，这次选择 `Paste`（粘贴）选项。在弹出的对话框中点击\
  \ `OK` 按钮之前，将新布局文件命名为 `fragment_tab2.xml`。编辑新的 `fragment_tab2.xml` 文件，并将 `Text View`\
  \ 上的文本更改为“Tab 2 Fragment”，按照常规步骤将字符串提取为名为 `tab_2_fragment` 的资源。\n\n要复制 `Tab1Fragment`\
  \ 类文件，右键点击 `app` -> `java` -> `com.ebookfrenzy.tablayoutdemo` 下出的类并选择 `Copy`。右键点击\
  \ `com.ebookfrenzy.tablayoutdemo` 项并选择 `Paste`。在 `Copy Class` 对话框中，在 `New name:`\
  \ 字段输入 `Tab2Fragment` 并点击 `OK`。\n\n编辑新的 `Tab2Fragment.java` 文件并修改 `onCreateView()`\
  \ 方法以加载 `fragment_tab2` 布局文件：\n\n```java\n@Override\npublic View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container,\n                         Bundle savedInstanceState)\
  \ {\n    // Inflate the layout for this fragment\n    return inflater.inflate(R.layout.fragment_tab2,\
  \ container, false);\n}\n```\n\n执行上述复制步骤两次，为剩余两个 Fragment 创建布局和类文件。完成这些步骤后，项目结构应与图\
  \ 46-5 一致：\n\n![](img/as_tab_layout_project_files_java.jpg)\n图 46-5\n\n## 46.6 添加\
  \ TabLayout 和 ViewPager2\n\n随着 Fragment 创建过程的完成，下一步是向主活动布局文件添加 `TabLayout` 和 `ViewPager2`。编辑\
  \ `activity_main.xml` 文件，并按照下方 XML 列表所示添加这些元素。注意，`TabLayout` 组件嵌入在 `AppBarLayout`\
  \ 元素中，而 `ViewPager2` 放置在 `AppBarLayout` 之后：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.coordinatorlayout.widget.CoordinatorLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\">\n    <com.google.android.material.appbar.AppBarLayout\n       \
  \ android:layout_width=\"match_parent\"\n        android:layout_height=\"wrap_content\"\
  \n        android:theme=\"@style/Theme.TabLayoutDemo.AppBarOverlay\">\n        <androidx.appcompat.widget.Toolbar\n\
  \            android:id=\"@+id/toolbar\"\n            android:layout_width=\"match_parent\"\
  \n            android:layout_height=\"?attr/actionBarSize\"\n            android:background=\"\
  ?attr/colorPrimary\"\n            app:popupTheme=\"@style/Theme.TabLayoutDemo.PopupOverlay\"\
  \ />\n        <com.google.android.material.tabs.TabLayout\n            android:id=\"\
  @+id/tabLayout\"\n            android:layout_width=\"match_parent\"\n          \
  \  android:layout_height=\"wrap_content\"\n            app:tabMode=\"fixed\"\n \
  \           app:tabGravity=\"fill\"/>\n    </com.google.android.material.appbar.AppBarLayout>\n\
  \    <androidx.viewpager2.widget.ViewPager2\n        android:id=\"@+id/view_pager\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        app:layout_behavior=\"@string/app_scrolling_view_behavior\"\
  \ />\n    <include layout=\"@layout/content_main\" />\n    <com.google.android.material.floatingbutton.FloatingActionButton\n\
  \        android:id=\"@+id/fab\"\n        android:layout_width=\"wrap_content\"\n\
  \        android:layout_height=\"wrap_content\"\n        android:layout_gravity=\"\
  bottom|end\"\n        android:layout_margin=\"16dp\"\n        android:layout_layout=\"\
  end\"\n        app:src=\"@android:drawable/ic_email\" />\n</androidx.coordinatorlayout.widget.CoordinatorLayout>\n\
  ```\n\n## 46.7 创建 Pager Adapter\n\n此示例将使用 `ViewPager2` 方法来处理分配给 `TabLayout` 的 Fragment，需要创建一个子自\
  \ `FragmentStateAdapter` 的类来管理选择项时显示的 Fragment。\n\n通过右键点击 `com.ebookfrenzy.tablayoutdemo`\
  \ 项并选择 `New` -> `Java Class` 为项目添加类。在新类对话框中，在 `Name:` 字段输入 `TabPagerAdapter`，选择列表中的\
  \ `Class` 项并按 `Return` 键。\n\n编辑 `TabPagerAdapter.java` 文件使其内容如下：\n\n```java\npackage\
  \ com.ebookfrenzy.tablayoutdemo;\n\nimport androidx.annotation.NonNull;\nimport\
  \ androidx.fragment.app.*;\nimport androidx.viewpager2.adapter.FragmentStateAdapter;\n\
  \npublic class TabPagerAdapter extends FragmentStateAdapter {\n    int tabCount;\n\
  \n    public TabPagerAdapter(@NonNull FragmentActivity fragmentActivity, int numberOfTabs)\
  \ {\n        super(fragmentActivity);\n        this.tabCount = numberOfTabs;\n \
  \   }\n\n    @NonNull\n    @Override\n    public Fragment createFragment(int position)\
  \ {\n        switch (position) {\n            case 0:\n                return new\
  \ Tab1Fragment();\n            case 1:\n                return new Tab2Fragment();\n\
  \            case 2:\n                return new Tab3Fragment();\n            case\
  \ 3:\n                return new Tab4Fragment();\n            default:\n       \
  \         return null;\n        }\n    }\n\n    @Override\n    public int getItemCount()\
  \ {\n        return tabCount;\n    }\n}\n```\n\n## 46.8 执行初始化任务\n\n剩余的任务涉及初始化 `TabLayout`、`ViewPager2`\
  \ 和 `TabPagerAdapter` 实例，并让主活动类实现四个标签 Fragment 的交互监听器。\n\n\n\n\n```java\nimport\
  \ android.net.Uri;\n\nimport com.google.android.material.tabs.TabLayoutMediator;\n\
  \npublic class MainActivity extends AppCompatActivity implements\n    Tab1Fragment.OnFragmentInteractionListener,\n\
  \    Tab2Fragment.OnFragmentInteractionListener,\n    Tab3Fragment.OnFragmentInteractionListener,\n\
  \    Tab4Fragment.OnFragmentInteractionListener {\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        configureTabLayout();\n  \
  \  }\n\n    protected void configureTabLayout() {\n        for (int i = 0; i < 4;\
  \ i++) {\n            binding.tabLayout.addTab(binding.tabLayout.newTab());\n  \
  \      }\n        final TabPagerAdapter adapter = new TabPagerAdapter\n        \
  \        (this, binding.tabLayout.getTabCount());\n        binding.viewPager.setAdapter(adapter);\n\
  \        new TabLayoutMediator(binding.tabLayout, binding.viewPager,\n         \
  \       (tab, position) -> tab.setText(\"Tab \" + (position + 1) + \" Item\")).attach();\n\
  \    }\n\n    @Override\n    public void onFragmentInteraction(Uri uri) {\n    }\n\
  }\n```\n\n代码首先创建了四个标签，并将它们如下所示添加到 `TabLayout` 实例中：\n\n```java\nfor (int i = 0; i\
  \ < 4; i++) {\n    binding.tabLayout.addTab(binding.tabLayout.newTab());\n}\n```\n\
  \n接下来，创建 `TabPagerAdapter` 类的实例。注意，创建 `TabPagerAdapter` 实例的代码传递了分配给 `TabLayout`\
  \ 组件的标签数量。然后将 `TabPagerAdapter` 实例赋值为 `ViewPager2` 实例的适配器：\n\n```java\nfinal TabPagerAdapter\
  \ adapter = new TabPagerAdapter\n        (this, binding.tabLayout.getTabCount());\n\
  binding.viewPager.setAdapter(adapter);\n```\n\n最后，使用 `TabLayoutMediator` 类的实例将 `TabLayout`\
  \ 与 `ViewPager2` 对象连接：\n\n```java\nnew TabLayoutMediator(binding.tabLayout, binding.viewPager,\n\
  \        (tab, position) -> tab.setText(\"Tab \" + (position + 1) + \" Item\")).attach();\n\
  ```\n\n该类确保 `TabLayout` 标签与当前选中的片段（fragment）保持同步。这一过程涉及确保每个标签上显示正确的文本。在这种情况下，文本被配置为读取“Tab\
  \ <n> Item”，其中 `<n>` 被替换为当前选中标签的数字编号。\n\n## 46.9 测试应用程序\n\n在设备或模拟器上编译并运行应用，并确保选择某个标签会导致相应的片段出现在屏幕的内容区域中：\n\
  \n![](img/as_tab_layout_running.jpg)\n图 46-6\n\n在构建项目时，你可能会遇到部分包含内容的错误：\n\n`Duplicate\
  \ class kotlin.collections.jdk8.CollectionsJDK8Kt found in modules kotlin-stdlib`\n\
  \n此错误是由 Android Studio 构建工具链中的一个 bug 引起的，可以通过对 `build.gradle.kts` (Module: app)\
  \ 文件进行以下更改来解决：\n\n```kotlin\ndependencies {\n    implementation(platform(\"org.jetbrains.kotlin:kotlin-bom:1.8.0\"\
  ))\n}\n```\n\n## 46.10 自定义 TabLayout\n\n此示例项目中的 `TabLayout` 是使用固定模式（fixed mode）配置的。这种模式适用于数量有限且标题较短的标签。使用固定模式时，标签数量过多或标题较长可能会迅速变成问题，正如图\
  \ 46-7 所示：\n\n![](img/as_4.1_tab_layout_truncated.jpg)\n图 46-7\n\n为了让标签适应可用的显示宽度，`TabLayout`\
  \ 使用了多行文本。尽管如此，第二行仍被截断，导致无法看到完整标题。解决此问题的方案是将 `TabLayout` 切换到可滚动模式（scrollable mode）。在这种模式下，标题将以全长度单行格式显示，允许用户通过滑动水平滚动查看可用项目，正如图\
  \ 46-8 所示：\n\n![](img/as_4.1_tab_layout_scrollable.jpg)\n图 46-8\n\n要将 `TabLayout`\
  \ 切换到可滚动模式，请将 `activity_main.xml` 资源文件中的 `app:tabMode` 属性从 `fixed` 更改为 `scrollable`：\n\
  \n```xml\n<android.support.design.widget.TabLayout\n    android:id=\"@+id/tabLayout\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    app:tabMode=\"scrollable\"\n    app:tabGravity=\"fill\"/>\n```\n\n例如，当 `app:tabGravity`\
  \ 设置为 `fill` 时，项目将分布在整个宽度，如图 46-9 所示：\n\n![](img/as_4.1_tab_layout_fill.jpg)\n图\
  \ 46-9\n\n将属性值更改为 `center` 将导致项目相对于标签栏中心进行定位：\n\n![](img/as_4.1_tab_layout_center.jpg)\n\
  图 46-10\n\n### 46.11 总结\n\n`TabLayout` 是材料设计（material design）引入的组件之一。`TabLayout`\
  \ 组件的目的是展示一系列标签项，在被选中时显示内容。标签项可以显示文本、图像或三者的组合。与 `ViewPager2` 类和片段结合时，可以轻松地创建标签布局。\n\
  \n## 47. 使用 RecyclerView 和 CardView\n\n`RecyclerView` 和 `CardView` 共同工作，提供以单个卡片形式呈现信息的滚动列表。在通过示例项目的设计和实现之前，本章将介绍这两个类的细节。\n\
  \n### 47.1 RecyclerView 概述\n\n与使用悬动按钮和 Snackbar 章节中概述的 `ListView` 类类似，`RecyclerView`\
  \ 的目的是以滚动列表的形式向用户呈现信息。然而，`RecyclerView` 比 `ListView` 具有许多优势。特别是 `RecyclerView` 在管理组成列表的视图方面高效得多，当列表项离开屏幕时复用现有视图而不是创建新视图（因此得名“回收器”）。这提高了性能并减少了列表使用的资源。\n\
  \n与 `ListView` 不同，`RecyclerView` 还提供了三种内置布局管理器供选择，以控制向用户呈现列表项的方式：\n\n- `LinearLayoutManager`：列表项以水平或垂直列表的形式呈现。\n\
  ![](img/Image2427.jpg)\n图 47-1\n\n- `GridLayoutManager`：列表项以网格形式呈现。这种管理器适用于列表项大小一。\n\
  ![](img/Image2436.jpg)\n图 47-2\n\n- `StaggeredGridLayoutManager`：列表项以交错网格形式呈现。这种管理器适用于列表项大小不一。\n\
  ![](img/Image2443.jpg)\n图 47-3\n\n对于这三种内置管理器都无法提供所需布局的情况，可以通过子类化 `RecyclerView.LayoutManager`\
  \ 类来实现自定义布局管理器。\n\n在 `RecyclerView` 中显示的每个列表项都是作为 `ViewHolder` 类的实例创建的。`ViewHolder`\
  \ 实例包含了 `RecyclerView` 显示列表项所需的所有内容，包括要显示的信息和用于显示项的视图布局。\n\n\n\n与 `ListView` 类似，`RecyclerView`\
  \ 依赖于适配器（adapter）作为 `RecyclerView` 实例与要显示给用户的数据之间的中介。适配器被创建为 `RecyclerView.Adapter`\
  \ 类的子类，并且至少实现以下方法，这些方法会被分配给适配器的 `RecyclerView` 对象在不同时间点进行调用：\n\n- `getItemCount()`\
  \ – 此方法必须返回列表中要显示的项数。\n- `onCreateViewHolder()` – 此方法创建并返回一个 `ViewHolder` 对象，该对象使用用于显示数据的视图进行初始化。此视图通常通过加载（inflating）XML\
  \ 布局文件创建。\n- `onBindViewHolder()` – 此方法接收由 `onCreateViewHolder()` 方法创建的 `ViewHolder`\
  \ 对象，以及一个指示即将显示的列表项的整数值。`ViewHolder` 对象中包含了 `onCreateViewHolder()` 方法分配的布局。`onBindViewHolder()`\
  \ 方法负责将与指定项目对应的文本和图形填充到布局中的视图中，并将对象返回给 `RecyclerView`，由其展示给用户。\n\n在布局中添加 `RecyclerView`\
  \ 只需要在其要出现的 Activity 的 XML 内容布局文件中添加适当的元素即可。例如：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n   \
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view_behavior\"\n    tools:context=\"\
  .MainActivity\"\n    tools:showIn=\"@layout/activity_card_demo\">\n    <androidx.recyclerview.widget.RecyclerView\n\
  \        android:id=\"@+id/recycler_view\"\n        android:layout_width=\"0dp\"\
  \n        android:layout_height=\"0dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\"\n        tools:listItem=\"\
  @layout/card_layout\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n在上面的示例中，`RecyclerView` 已与 `AppBar` 和 `Toolbar` 一起嵌入到主 Activity 布局文件的 `CoordinatorLayout`\
  \ 中。这提供了一些额外功能，例如配置 `Toolbar` 和 `AppBar`，当用户在 `RecyclerView` 中向上滚动时它们滑出屏幕（该主题在“使用\
  \ AppBar 和 Collapsing Toolbar 布局”章节中会有更详细的介绍）。\n\n### 47.2 CardView 概述\n\n`CardView`\
  \ 类是一种用户界面视图，允许使用卡片隐喻来分组显示信息。卡片通常使用 `RecyclerView` 实例以列表形式呈现，并可以配置为带有阴影效果和圆角。例如，[图\
  \ 47-4] 显示了三个配置好的 `CardView` 实例，用于显示一个由 `ImageView` 和两个 `TextView` 组成的布局：\n\n![](img/Image24511.jpg)\n\
  \n图 47-4\n\n与 `CardView` 实例一起呈现的用户界面布局定义在 XML 布局资源文件中，并在运行时加载到 `CardView` 中。`CardView`\
  \ 布局可以使用任何复杂性的布局，使用如 `RelativeLayout` 和 `LinearLayout` 等标准布局管理器。以下 XML 布局文件表示由 `RelativeLayout`\
  \ 和单个 `ImageView` 组成的卡片视图布局。该卡片被配置为提升以创建阴影效果并带有圆角显示：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n    xmlns:card_view=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    android:id=\"@+id/card_view\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"wrap_content\"\n    android:layout_margin=\"5dp\"\n\
  \    card_view:cardRadius=\"12dp\"\n    card_view:cardElevation=\"3dp\"\n    card_view:contentPadding=\"\
  4dp\">\n    <RelativeLayout\n        android:layout_width=\"match_parent\"\n   \
  \     android:layout_height=\"wrap_content\"\n        android:padding=\"16dp\">\n\
  \        <ImageView\n            android:id=\"@+id/item_image\"\n            android:layout_width=\"\
  100dp\"\n            android:layout_height=\"100dp\"\n            android:layout_alignParentLeft=\"\
  true\"\n            android:layout_alignParentTop=\"true\"\n            android:layout_marginRight=\"\
  16dp\" />\n    </RelativeLayout>\n</androidx.cardview.widget.CardView>\n```\n\n\
  当与 `RecyclerView` 结合创建可滚动卡片列表时，视图的 `onCreateViewHolder()` 方法会加载卡片的布局文件，将其分配给 `ViewHolder`\
  \ 实例并返回给 `RecyclerView` 实例。\n\n### 47.3 总结\n\n本章介绍了 Android `RecyclerView` 和 `CardView`\
  \ 组件。`RecyclerView` 提供了一种资源高效的方式来显示可滚动视图列表。`CardView` 适用于以卡片形式呈现数据组（如名称和地址）。正如在下一节教程中所概述的，两者结合使用非常有用。\n\
  \n## 48. RecyclerView 和 CardView 教程\n\n本章将创建一个示例项目，使用 `CardView` 和 `RecyclerView`\
  \ 组件创建一个可滚动卡片列表。完成后的程序将显示包含图像和文本的卡片列表。除了显示卡片列表外，项目还将实现选择卡片时显示消息。\n\n### 48.1 创建\
  \ CardDemo 项目\n\n从欢迎屏幕上选择 New Project，在出现的新项目对话框中，点击 Next 按钮之前选择 `Basic Views Activity`\
  \ 模板。在 Name 字段中输入 `CardDemo`，并指定 `com.ebookrenzy.carddemo` 为包名。在点击 Finish 按钮之前，将\
  \ Minimum API 设置更改为 `API 26: Android 8.0 (Oreo)`，并将 Language（语言）菜单为 `Java`。\n\n\
  ### 48.2 修改 Basic Views Activity 项目\n\n由于选择了 `Basic Views Activity`，布局包含一个项目并不所需的悬浮按钮。将\
  \ `activity_main.xml` 布局文件加载到布局编辑器，选择悬浮按钮并按下键盘删除键将其从布局中移除。编辑 `MainActivity.java`\
  \ 文件，从 `onCreate` 方法中移除悬浮按钮和导航控制器代码，如下：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    NavController navController =\n\
  \        Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  \    appBarConfiguration =\n        new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController,\n       \
  \ appBarConfiguration);\n    binding.fab.setOnClickListener(new View.OnClickListener()\
  \ {\n        @Override\n        public void onClick(View view) {\n            Snackbar.make(view,\
  \ \"Replace with your own action\", Snackbar.LENGTH_LONG)\n                .setAction(\"\
  Action\", null).show();\n        }\n    });\n}\n```\n\n\n\n\n同时移除 `onSupportNavigateUp()`\
  \ 方法，然后打开 `content_main.xml` 文件并从布局中删除 `nav_host_fragment_content_main` 对象，只保留 `ConstraintLayout`\
  \ 父布局。\n\n# 48.3 设计 CardView 布局\n\n卡片中包含的视图布局将在单独的 XML 布局文件中定义。在 Project 工具窗口中，右键点击\
  \ `app` -> `res` -> `layout` 项，并选择 `New` -> `Layout Resource File` 菜单。在 New Resource\
  \ 对框中，在 `File name:` 字段中输入 `card_layout`，并在根元素字段输入 `androidx.cardview.widget.CardView`，然后点击\
  \ `OK` 按钮。\n\n将 `card_layout.xml` 文件加载到 Layout Editor 工具中，切换到 `Code` 模式，并修改布局如下所示：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/card_view\"\n\
  \    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#80B3EF\"\n  \
  \  app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    app:contentPadding=\"\
  4dp\">\n    <androidx.constraintlayout.widget.ConstraintLayout\n        android:id=\"\
  @+id/relativeLayout\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:padding=\"16dp\">\n        <ImageView\n        \
  \    android:id=\"@+id/itemImage\"\n            android:layout_width=\"100dp\"\n\
  \            android:layout_height=\"100dp\"\n            app:layout_constraintLeft_toLeftOf=\"\
  parent\"\n            app:layout_constraintStart_toStartOf=\"parent\"\n        \
  \    app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n       \
  \     android:id=\"@+id/itemTitle\"\n            android:layout_width=\"236dp\"\n\
  \            android:layout_height=\"39dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:textSize=\"30sp\"\n            app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n            app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\
  \n            app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n\
  \            android:id=\"@+id/itemDetail\"\n            android:layout_width=\"\
  236dp\"\n            android:layout_height=\"16dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:layout_marginTop=\"8dp\"\n            app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n            app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\
  \n            app:layout_constraintTop_toBottomOf=\"@+id/itemTitle\" />\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </androidx.cardview.widget.CardView>\n```\n\n### 48.4 添加 RecyclerView\n\n选择 `content_main.xml`\
  \ 布局文件，从调色板的 `Containers` 部分拖入一个 `RecyclerView` 对象到布局中，使其位于屏幕中心，它将自动调整大小以填充整个屏幕。使用\
  \ Infer constraints 按钮添加任何缺失的布局约束。使用 Attributes 窗口，将 `RecyclerView` 实例 ID 更改为 `recyclerView`，并将\
  \ `layout_width` 和 `layout_height` 属性更改为 `match_constraint`。\n\n## 48.5 添加图像文件\n\
  \n除了两个 `TextView` 外，卡片布局还包含一个 `ImageView`，Recycler 适配器已配置为显示图像。在测试项目之前，必须添加这些图像。项目使用的图像命名为\
  \ `android_image_<n>.jpg`，可以在以下 URL 提供的示例代码项目中找到：https://www.ebookrenzy.com/retail/java/index.php\n\
  \n在操作系统的文件导航器中找到这些图像并复制这八张图片。在 Project 窗口中右键点击 `app` -> `res` -> `drawable` 项并选择\
  \ Paste（粘贴）将文件添加到文件夹中。\n\n## 48.6 创建 RecyclerView 适配器\n\n如上一章所述，`RecyclerView` 需要一个适配器来处理列表项的创建。在\
  \ Project 窗口中右键点击 `app` -> `java` -> `com.ebookrenzy.carddemo` 项，选择 `New` -> `Java\
  \ Class` 选项。在新类对话框中，在 `Name` 字段输入 `RecyclerAdapter` 并在列表中选择 `Class`，然后按 `Return`\
  \ 键创建新的 Java 类。\n\n编辑新的 `RecyclerAdapter.java` 文件以添加一些导入指令并声明该类继承 `RecyclerView.Adapter`。与其创建一个单独的类来提供要显示的数据，不如向适配器中添加一些数组来作为应用的数据：\n\
  \n```java\npackage com.ebookrenzy.carddemo;\n\nimport android.view.LayoutInflater;\n\
  import android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.ImageView;\n\
  import android.widget.TextView;\nimport androidx.annotation.NonNull;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  \npublic class RecyclerAdapter extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder>\
  \ {\n    private String[] titles = {\"Chapter One\", \"Chapter Two\", \"Chapter\
  \ Three\", \"Chapter Four\", \"Chapter Five\", \"Chapter Six\", \"Chapter Seven\"\
  , \"Chapter Eight\"};\n    private String[] details = {\"Item one details\", \"\
  Item two details\", \"Item three details\", \"Item four details\", \"Item five details\"\
  , \"Item six details\", \"Item seven details\", \"Item eight details\"};\n    private\
  \ int[] images = { R.drawable.android_image_1, R.drawable.android_image_2, R.drawable.android_image_3,\
  \ R.drawable.android_image_4, R.drawable.android_image_5, R.drawable.android_image_6,\
  \ R.drawable.android_image_7, R.drawable.android_image_8 };\n}\n```\n\n在 `RecyclerAdapter`\
  \ 类中，我们现在需要自己的 `ViewHolder` 类实现来引用 `card_layout.xml` 中的元素。在 `RecyclerAdapter.java`\
  \ 文件中，按如下方式实现该类：\n\n```java\npublic class RecyclerAdapter extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder>\
  \ {\n    static class ViewHolder extends RecyclerView.ViewHolder {\n        ImageView\
  \ itemImage;\n        TextView itemTitle;\n        TextView itemDetail;\n\n    \
  \    ViewHolder(View itemView) {\n            super(itemView);\n            itemImage\
  \ = itemView.findViewById(R.id.itemImage);\n            itemTitle = itemView.findViewById(R.id.itemTitle);\n\
  \            itemDetail = itemView.findViewById(R.id.itemDetail);\n        }\n \
  \   }\n}\n```\n\n`ViewHolder` 类包含一个 `ImageView` 和两个 `TextView` 变量，以及一个初始化这些变量以引用\
  \ `card_layout.xml` 文件中三个视图项的构造方法。\n\n添加到 `RecyclerAdapter.java` 的下一个项是 `onCreateViewHolder()`\
  \ 方法的实现：\n\n```java\n@NonNull\n@Override\npublic ViewHolder onCreateViewHolder(ViewGroup\
  \ viewGroup, int i) {\n    View v = LayoutInflater.from(viewGroup.getContext())\n\
  \            .inflate(R.layout.card_layout, viewGroup, false);\n    return new ViewHolder(v);\n\
  }\n```\n\n该方法将被 `RecyclerView` 调用以获取 `ViewHolder` 对象。它会填充视图层次 `card_layout.xml`\
  \ 文件并创建一个初始化了视图层次的 `ViewHolder` 类实例，然后将其返回给 `RecyclerView`。\n\n\n\n\n\n`onBindViewHolder()`\
  \ 方法的目的是向 `ViewHolder` 对象中的视图层级结构中填充要显示的数据。该方法接收一个 `ViewHolder` 对象和一个表示要显示的的列表项的整数值。现在应该添加此方法，并使用项目编号作为数据数组的索引。随后，这些数据将使用在\
  \ `ViewHolder` 类构造方法中创建的引用显示在布局视图上：\n\n```java\n@Override\npublic void onBindViewHolder(ViewHolder\
  \ viewHolder, int i) {\n    viewHolder.itemTitle.setText(titles[i]);\n    viewHolder.itemDetail.setText(details[i]);\n\
  \    viewHolder.itemImage.setImageResource(images[i]);\n}\n```\n\n适配器类的最后一个要求是实现\
  \ `getItemCount()` 方法，在当前情况下，它返回 `titles` 数组中的项目数量：\n\n```java\n@Override\npublic\
  \ int getItemCount() {\n    return titles.length;\n}\n```\n\n## 48.7 初始化 RecyclerView\
  \ 组件\n\n此时，项目已经包含一个 `RecyclerView` 实例、一个用于 `CardView` 实例的 XML 布局文件以及一个 `RecyclerView`\
  \ 适配器。在测试目前进展之前的最后一步是使用 `layout manager` 初始化 `RecyclerView`，创建适配器实例并将该实例分配给 `RecyclerView`\
  \ 对象。为了本示例的目的，`RecyclerView` 将配置为使用 `LinearLayoutManager` 布局选项。\n\n这里有一点小复杂之处，因为我们需要能够使用视图绑定（view\
  \ binding）从 `MainActivity` 类内部访问 `recyclerView` 组件。问题是 `recyclerView` 包含在 `content_main.xml`\
  \ 布局文件中，而该文件又被包含在 `activity_main.xml` 文件中。为了能够访问 `content_main.xml` 文件，我们需要在包含它时为其分配一个\
  \ id。要做到这一点，请编辑 `activity_main.xml` 文件并修改 `include` 元素，如下所示：\n\n```xml\n<include\n\
  \    android:id=\"@+id/contentMain\"\n    layout=\"@layout/content_main\" />\n```\n\
  \n在给包含的文件分配了 id 后，可以使用以下绑定访问 `recyclerView` 组件：\n\n`binding.contentMain.recyclerView`\n\
  \n现在编辑 `MainActivity.java` 文件并修改 `onCreate()` 方法以实现初始化代码：\n\n```java\npackage com.ebookfrenzy.carddemo;\n\
  \nimport androidx.recyclerview.widget.LinearLayoutManager;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private RecyclerView\
  \ recyclerView;\n    private RecyclerView.LayoutManager layoutManager;\n    private\
  \ RecyclerView.Adapter adapter;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        setSupportActionBar(toolbar);\n        layoutManager\
  \ = new LinearLayoutManager(this);\n        binding.contentMain.recyclerView.setLayoutManager(layoutManager);\n\
  \        adapter = new RecyclerAdapter();\n        binding.contentMain.recyclerView.setAdapter(adapter);\n\
  \    }\n}\n```\n\n## 48.8 测试应用程序\n\n在物理设备或模拟器会话上编译并运行应用，并滚动列表中不同的卡片项：\n\n![](img/as_card_demo_running.jpg)\n\
  \n图 48-2\n\n在构建项目时，你可能会遇到部分内容如下错误：\n\n`Duplicate class kotlin.collections.jdk8.CollectionsJDK8Kt\
  \ found in modules kotlin-stdlib`\n\n此错误是由 Android Studio 构建工具链中的一个 引起的，可以通过对 `build.gradle.kts`\
  \ (Module: app) 文件进行以下更改来解决：\n\n```kotlin\ndependencies {\n    implementation(platform(\"\
  org.jetbrains.kotlin:kotlin-bom:1.8.0\"))\n}\n```\n\n## 48.9 响应卡片选择\n\n本项目的最后一个阶段是使列表中的卡片变为可选择的，这样点击卡片就会触发应用内的事件。对于此示例，卡片将被配置为在用户点击时在显示器上显示一条消息。为了响应点击，需要修改\
  \ `ViewHolder` 类以在每个项目视图上分配一个 `OnClickListener`。编辑 `RecyclerAdapter.java` 文件并修改\
  \ `ViewHolder` 类声明，如下所示：\n\n```java\nimport com.google.android.material.snackbar.Snackbar;\n\
  \nclass ViewHolder extends RecyclerView.ViewHolder{\n    ImageView itemImage;\n\
  \    TextView itemTitle;\n    TextView itemDetail;\n    ViewHolder(View itemView)\
  \ {\n        super(itemView);\n        itemImage = itemView.findViewById(R.id.item_image);\n\
  \        itemTitle = itemView.findViewById(R.id.item_title);\n        itemDetail\
  \ = itemView.findViewById(R.id.item_detail);\n        itemView.setOnClickListener(new\
  \ View.OnClickListener() {\n            @Override public void onClick(View v) {\n\
  \            }\n        });\n    }\n}\n```\n\n在 `onClick` 处理器的体内部，现在可以添加代码来显示一条指示卡片已被点击的消息。由于由于点击而执行的操作可能取决于点击了哪张卡片，因此识别所选的卡片也很重要。此信息可以通过调用\
  \ `RecyclerView.ViewHolder` 类的 `getAdapterPosition()` 方法获取。继续留在 `RecyclerAdapter.java`\
  \ 文件中，为 `onClick` 处理器添加代码，如下所示：\n\n```java\n@override\npublic void onClick(View\
  \ v) {\n    int position = getAdapterPosition();\n    Snackbar.make(v, \"Click detected\
  \ on item \" + (position + 1), Snackbar.LENGTH_LONG).show();\n}\n```\n\n最后一个任务是启用点击卡片时的材质设计波纹效果。这涉及在\
  \ `card_layout.xml` 文件中添加某些属性：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<androidx.cardview.widget.CardView\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:card_view=\"http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    android:id=\"@+id/card_view\"\
  \n    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#80B3EF\"\n \
  \   app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    app:contentPadding=\"\
  4dp\"\n    android:foreground=\"?selectableItemBackground\"\n    android:clickable=\"\
  true\" >\n```\n\n再次运行应用，验证点击列表中的卡片是否会触发标准的波纹效果并显示报告项目编号 Snackbar。\n\n### 48.10 总结\n\
  \n本章介绍了了结合 `CardView` 和 `RecyclerView` 组件以显示滚动卡片列表的步骤。示例还涵盖了对点击的检测，包括识别所选项目以及在点击的\
  \ `CardView` 实例上启用波纹反馈。\n\n## 49. 布局编辑器示例数据教程\n\n上一节创建的 CardDemo 项目提供了一个很好的例子，说明了在完成应用测试之前，很难从布局编辑器准确评估用户界面将呈现什么样。当用户界面中显示的内容只有在用户安装并运行应用后才能生成或获取时，这是一个常见问题。随着\
  \ Android Studio 布局编辑器支持示例数据，这种功能得到了显著扩展，本章将使用它来改进布局编辑器体验。\n\n### 49.1 向项目添加示例数据\n\
  \n\n\n\n\n在用户界面布局的设计阶段，`RecyclerView` 实例（图 49-1）与上一章末尾测试的运行程序几乎没有相似之处：\n\n![](img/as_3.6_recyclerview_no_sample_data.jpg)\n\
  \n图 49-1\n\n在书中之前的“使用 Jetpack 构建现代 Android 应用架构\n\n图 49-2\n\n将模板更改为 `Email Client`\
  \ 选项并将项目计数更改为 `12`，注意 `RecyclerView` 发生了变化，显示来自模板的数据：\n\n![](img/as_3.6_recyclerview_sample_data_email.jpg)\n\
  \n图 49-3\n\n这些模板对于在无需任何额外工作的情况下显示样本数据非常有用，通常足以完成布局设计。然而，对于本示例，将使用样本数据来显示 `RecyclerView`\
  \ 中的卡片，就像它们在运行程序中出现一样。在 `content_main.xml` 文件仍加载在布局编辑器的情况下，切换到代码（Code）模式并找到 `RecyclerView`\
  \ 元素，其内容如下：\n\n```xml\n<androidx.recyclerview.widget.RecyclerView\n    android:id=\"\
  @+id/recyclerView\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    tools:itemCount=\"12\"\n    tools:listitem=\"@layout/recycler_view_item\"\
  \ />\n```\n\n注意当前配置的两个特殊 `tools` 属性，它们用于在列表中显示 12 个项目，每个项目使用位于 `recycler_view_item.xml`\
  \ 文件中的布局。布局编辑器提供了一系列可以在布局文件中配置的 `tools` 选项。虽然涵盖所有设置超出了本书的范围，但在以下 URL 可以找到每个设置的完整描述：\n\
  \nhttps://developer.android.com/studio/write/tool-attributes#toolssample_resources\n\
  \n上述引用的 `recycler_view_item.xml` 文件是在选择样本数据模板时由布局编辑器自动生成的，可以在项目窗口中找到。\n\n切换回设计（Design）模式，在选中\
  \ `RecyclerView` 的情况下，使用设计时视图属性面板将模板切回默认设置。`recycler_view_item.xml` 文件将从项目中删除，同时\
  \ `content_main.xml` XML 文件中的两个 `tools` 属性行也随之删除（如果 Android Studio 未能删除这些行，则可以在代码视图中手动删除）。\n\
  \n要切换到使用卡片布局显示样本数据，添加一个 `listitem` 属性以引用 `card_layout.xml` 文件。在布局中选中 `RecyclerView`\
  \ 后，在属性（Attributes）工具窗口中搜索 `listitem` 属性，并在字段中输入 `@layout/card_layout`，如图 49-4 所示：\n\
  \n![](img/as_sample_data_list_item.jpg)\n\n图 49-4\n\n注意现在每个列表项都显示了卡片布局，但没有任何图像且使用的是样本文本数据：\n\
  \n![](img/as_sample_list_items.jpg)\n\n图 49-5\n\n下一步是在卡片布局的视图中显示一些图像和不同的文本。这既可以是布局编辑器提供的模板样本数据形式，也可以专门为此项目添加的自定义样本数据。将\
  \ `card_layout.xml` 文件加载到布局编辑器，选择 `ImageView` 并如本章前面所述显示设计时视图属性面板。从 `srcCompat`\
  \ 菜单中选择内置的背景/风景图集，如下所示图 49-6：\n\n![](img/as_sample_data_images.jpg)\n\n图 49-6\n\n\
  接下来，右键点击 `itemTitle` `TextView` 对象，选择 `Set Sample Data` 菜单，并在设计属性面板中选择 `cities`\
  \ 文本选项。对 `itemDetail` 视图重复此步骤，这次选择 `full_names` 选项，如图 49-7 所示：\n\n![](img/as_sample_data_names.jpg)\n\
  \n图 49-7\n\n在设计模式下打开 `content_main.xml` 文件，注意 `RecyclerView` 现在使用内置图像和样本文本数据：\n\n\
  ![](img/as_sample_data_stage1.jpg)\n\n图 49-8\n\n## 49.2 使用自定义样本数据\n\n本章的最后一步是演示如何在布局编辑器中使用自定义样本数据和图像。这需要创建一个样本数据目录并添加一些文本和图像文件。在项目窗口中，右键点击\
  \ app 入口并选择 `New -> Sample Data Directory` 菜单，此时项目窗口中会出现一个名为 `sampledata` 的新目录。如果新文件夹不可见，将项目窗口从\
  \ Android 模式切换到 Project 模式，并在 `CardDemo -> app` 下找到文件夹，如图 49-9 所示：\n\n![](img/as_sample_data_folder.jpg)\n\
  \n图 49-9\n\n右键点击 `sampledata` 目录，创建一个名为 `images` 的目录，并按照上一章出的步骤将 Android 图像复制粘贴到新文件夹中。在\
  \ `card_layout.xml` 文件中，再次显示 `ImageView` 的设计时视图属性面板，这次点击 `Browse` 链接并在对话框中选择新添加的\
  \ Android 图像（如果 images 文件夹未出现，请重新项目）：\n\n![](img/as_sample_data_manager.jpg)\n\n\
  图 49-10\n\n再次键点击 `sampledata` 目录，选择 `New -> File` 选项，文件命名为 `chapters` 并输入以下内容：\n\
  \n```\nChapter One\nChapter Two\nChapter Three\nChapter Four\nChapter Five\nChapter\
  \ Six\nChapter Seven\nChapter Eight\n```\n\n接下来，创建一个名为 `items` 的第二个文本文件，内容如下：\n\n\
  ```\nItem one details\nItem two details\nItem three details\nItem four details\n\
  Item five details\nItem six details\nItem seven details\nItem eight details\n```\n\
  \n创建样本数据文本文件后，剩下的就是在 `card_layout.xml` 文件的视图元素中如下引用它们：\n\n```xml\n<TextView\n  \
  \  android:id=\"@+id/itemTitle\"\n    android:layout_width=\"236dp\"\n    android:layout_height=\"\
  39dp\"\n    android:layout_marginStart=\"16dp\"\n    android:textSize=\"30sp\"\n\
  \    app:layout_constraintLeft_toRightOf=\"@+id/itemImage\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/itemImage\"\n    app:layout_constraintTop_toTopOf=\"parent\"\n    tools:text=\"\
  @sample/chapters\" />\n\n<TextView\n    android:id=\"@+id/itemDetail\"\n    android:layout_width=\"\
  236dp\"\n    android:layout_height=\"16dp\"\n    android:layout_marginStart=\"16dp\"\
  \n    android:layout_marginTop=\"8dp\"\n    app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n    app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\n  \
  \  app:layout_constraintTop_toBottomOf=\"@+id/itemTitle\"\n    tools:text=\"@sample/items\"\
  \ />\n```\n\n重新构建程序并返回 `content_main.xml` 文件中的布局设计，此时自定义样本数据和图像应该显示在 `RecyclerView`\
  \ 列表中：\n\n![](img/as_sample_data_completed.jpg)\n\n图 49-11\n\n\n\n\n与其使用两个独立的文本文件并对图像集的引用，另一种选择是在\
  \ JSON 文件中声明样本数据。例如：\n\n```json\n{\n  \"mydata\": [\n    {\n      \"chapter\" :\
  \ \"Chapter One\",\n      \"details\": \"Item one details\",\n      \"image\": \"\
  @sample/images\"\n    },\n    {\n      \"chapter\" : \"Chapter Two\",\n      \"\
  details\": \"Item two details\",\n      \"image\": \"@sample/images\"\n    }\n \
  \ ]\n}\n```\n\n假设上述内容位于名为 `chapterdata.json` 的文件中，那么在视图 XML 元素中引用样本数据的方式如下：\n\n\
  ```xml\n<ImageView\n    tools:src=\"@sample/chapterdata.json/mydata/image\" />\n\
  <TextView\n    tools:text=\"@sample/chapterdata.json/mydata/chapter\" />\n<TextView\n\
  \    tools:text=\"@sample/chapterdata.json/mydata/details\" /> />\n\n### 49.3 总结\n\
  本章演示了如何在布局编辑器中使用样本数据，以提供用户界面在运行时外观的更真实表示。本教程涵盖的步骤包括使用现有的样本数据模板以及集成自定义样本数据。\n\n###\
  \ 50. 使用 AppBar 和折叠工具栏布局\n在本章中，我们将探索如何自定义 Activity 布局中的应用栏（app bar），并使其对其他屏幕视图中的滚动事件做出响应。通过结合使用\
  \ `CoordinatorLayout` 与 `AppBarLayout` 和 `CollapsingToolbarLayout` 容器，可以配置应用栏以显示图像并在视图中进行淡入淡出动画。例如，可以配置列表的向上滚动动作，使应用栏从视图中退回，并在执行向下滚动动作时重新出现。\n\
  \n本章将从组成 app bar 的元素概述开始，逐步介绍各种 app bar 配置的示例。\n\n### 50.1 AppBar 的结构\napp bar 是应用程序运行时显示在屏幕顶部的区域，可以配置为包含各种项目，包括状态栏（status\
  \ bar）、工具栏（toolbar）、标签栏（tab bar）和可伸空间区域。例如，图 50-1 显示了一个包含状态栏、工具栏和标签栏的 app bar：\n\
  \n![](img/Image24271.jpg)\n图 50-1\n\n空白背景颜色可以填充可伸空间区域，或者如图 50-2 所示，显示在 `ImageView`\
  \ 对象上的图像：\n\n![](img/Image24361.jpg)\n图 50-2\n\n正如本章剩余部分将演示的那样，如果 Activity 用户界面布局的主内容区域包含滚动内容，则\
  \ app bar 的元素可以根据屏幕上内容的滚动进行展开和收缩。\n\n### 50.2 示例项目\n对于此示例，将对早期章节创建的 `CardDemo` 项目进行修改，该项目标题为\
  \ Android RecyclerView 和 CardView 教程。首先启动 Android Studio 并加载此项目。\n\n项目加载后，运行应用程序，并注意当向上滚动列表时，工具栏保持可见，如图\
  \ 50-3 所示：\n\n![](img/as_app_bar_1.jpg)\n图 50-3\n\n第一步是更改配置，使工具栏在向上滚动动作期间收缩，并在向下滚动时展开。\n\
  \n#### 50.3 协调 RecyclerView 和 Toolbar\n将 `activity_main.xml` 文件加载到布局编辑器工具中，切换到代码模式并查看\
  \ XML 布局设计，其层级结构由图 50-4 中的图表示：\n\n![](img/as3.0_appbar_coordinatorlayout_tree.jpg)\n\
  图 50-4\n\n层级结构的顶层是 `CoordinatorLayout`，正如其名，它协调其包含的各种子视图元素之间的交互。例如，在使用浮动操作按钮和 Snackbar\
  \ 所示，`CoordinatorLayout` 会自动将浮动操作按钮向上滑动以容纳 `Snackbar` 的出现，然后在该栏消失后将按钮移回下方。\n\n`CoordinatorLayout`\
  \ 同样可以根据视图层级结构中某些视图的滚动动作，导致 app bar 的元素滑入或滑出视图。图 50-4 所示的布局层级结构中的一个元素是 `ConstraintLayout`。为了实现这种协调行为，有必要在发生滚动的元素以及与滚动协调的元素上设置属性。\n\
  \n在滚动元素（在本例中为 `RecyclerView`）上，必须将 `android:layout_behavior` 属性设置为 `appbar_scrolling_behavior`。在\
  \ `content_main.xml` 文件中，找到顶层的 `ConstraintLayout` 并注意该属性已设置：\n\n```xml\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/scbar_behavior\">\n```\n\n接下来，在布局编辑器中打开 `activity_main.xml`\
  \ 文件，切换到代码模式并找到 `AppBarLayout` 元素。注意 `AppBarLayout` 的唯一子元素是 `Toolbar`。要让工具栏响应 `RecyclerView`\
  \ 中发生的滚动事件，必须在该元素上设置 `app:layout_scrollFlags` 属性。该属性的值取决于交互的性质，并且由以下一个或多个选项组成：\n\
  \n- `scroll`：指示视图将滚动到屏幕外。如果不设置此项，视图在滚动期间将固定在屏幕顶部。\n- `enterAlways`：与 `scroll` 选项配合使用时，向上滚动会导致视图退回。在此模式下，任何向下滚动动作都会导致视图重新出现。\n\
  - `enterAlwaysCollapsed`：设置在视图上时，在向下滚动到达列表之前，视图不会展开。如果设置了 `minHeight` 属性，视图在初始滚动期间出现，直到达到最小高度。之后它将保持在该高度，直到到达列表顶部。注意，此选项仅在同时使用\
  \ `enterAlways` 和 `scroll` 选项时才有效。例如：`app:layout_scrollFlags=\"scroll|enterAlways|enterAlwaysCollapsed\"\
  ` `android:minHeight=\"20dp\"`。\n- `exitUntilCollapsed`：设置后，视图在向上滚动期间将收缩，直到达到 `minHeight`\
  \ 阈值。此时它将保持在该高度，直到滚动方向改变。\n\n对于此示例，将在 `Toolbar` 上按如下方式设置 `scroll` 和 `enterAlways`\
  \ 选项：\n\n```xml\n<com.google.android.material.appbar.MaterialToolbar\n    android:id=\"\
  @+id/toolbar\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  ?attr/actionBarSize\"\n    app:layout_scrollFlags=\"scroll|enterAlways\" />\n```\n\
  \n设置适当的属性后，重新运行应用程序并在 `RecyclerView` 列表中执行向上滚动动作。这应该导致工具栏收缩出视图（图 50-5）。\n\n![](img/as_card_demo_appbar_scroll.jpg)\n\
  图 50-5\n\n#### 50.4 介绍折叠工具栏布局\n\n\n\n\n`CollapsingToolbarLayout` 容器通过针对协调滚动动作对应用栏（app\
  \ bar）及其子元素的折叠提供更多的选项和控制范围，增强了标准工具栏的功能。`CollapsingToolbarLayout` 类旨在作为 `AppBarLayout`\
  \ 的子元素添加。它提供了许多功能，例如随着工具栏的折叠和展开自动调整工具栏标题的字体大小。`parallax`（视差）模式允许应用栏中的指定内容在折叠时淡出视图，而\
  \ `pin`（固定）模式则允许应用栏的元素在收缩期间保持固定位置。\n\n提供了 `scrim`（遮罩）选项，用于指定工具栏在折叠过程中过渡的颜色。\n\n\
  为了查看这些功能的效果，将修改 `activity_main.xml` 文件中的应用栏，使其使用 `CollapsingToolbarLayout` 类，并添加一个\
  \ `ImageView` 以更好地演示 `parallax` 模式的效果。使用 `CollapsingToolbarLayout` 的新视图层级如图图 50-6\
  \ 所示：\n\n![](img/as3.0_appbar_collapsing_tree.jpg)\n\n图 50-6\n\n将 `activity_main.xml`\
  \ 文件加载到 Layout Editor 工具的 Code 模式并修改布局使其内容如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.coordinatorlayout.widget.CoordinatorLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    android:fitsSystemWindows=\"\
  true\"\n    tools:context=\".MainActivity\">\n    <com.google.android.material.appbar.AppBarLayout\n\
  \        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:fitsSystemWindows=\"true\">\n        <com.google.android.material.appbar.CollapsingToolbarLayout\n\
  \            android:id=\"@+id/collapsing_toolbar\"\n            android:layout_width=\"\
  match_parent\"\n            android:layout_height=\"match_parent\"\n           \
  \ app:layout_scrollFlags=\"scroll|enterAlways\"\n            android:fitsSystemWindows=\"\
  true\"\n            app:expandedTitleMarginBottom=\"30dp\"\n            app:expandedTitleMarginStart=\"\
  15dp\"\n            app:expandedTitleMarginEnd=\"64dp\">\n            <ImageView\n\
  \                android:id=\"@+id/backdrop\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"200dp\"\n              \
  \  android:scaleType=\"centerCrop\"\n                android:fitsSystemWindows=\"\
  true\"\n                app:layout_collapseMode=\"parallax\"\n                android:src=\"\
  @drawable/appbar_image\" />\n            <com.google.android.material.appbar.MaterialToolbar\n\
  \                android:id=\"@+id/toolbar\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"?attr/actionBarSize\"\n\
  \                app:layout_scrollFlags=\"scroll|enterAlways\"\n               \
  \ app:layout_collapseMode=\"pin\" />\n        </com.google.android.material.appbar.CollapsingToolbarLayout>\n\
  \    </com.google.android.material.appbar.AppBarLayout>\n    <include\n        android:id=\"\
  @+id/contentMain\"\n        layout=\"@layout/content_main\" />\n</androidx.coordinatorlayout.widget.CoordinatorLayout>\n\
  ```\n\n使用你操作系统的文件系统，在代码示例的项目文件夹中找到 `appbar_image.jpg` 文件并复制它。在 Project 窗口中右键点击 `res`\
  \ -> `drawable` 条目，从弹出的菜单中选择 Paste（粘贴）。\n\n运行时，应用栏的显示应该如图图 50-7 所示：\n\n![](img/as_appbar_2.jpg)\n\
  \n图 50-7\n\n向上滚动列表将导致应用栏折叠。在收缩过程中，图像将淡出到 `scrim` 属性定义的颜色，同时标题文本的字体大小将按相应的速率减小，直到只看到工具栏：\n\
  \nimage/as_appbar_3.jpg)\n\n图 50-8\n\n在滚动动作的初始阶段，工具栏保持可见（如果继续向上滚动动作，工具栏也将移出视图），这是因为\
  \ `activity_main.xml` 文件中的工具栏元素被配置为使用 `pin` 模式：`app:layout_collapseMode=\"pin\"\
  `。\n\n如果将折叠模式设置为 `parallax`，工具栏将随图像一起收回。继续向上滚动动作将导致工具栏也折叠，只留下状态栏可见：\n\nimage/as_appbar_4.jpg)\n\
  \n图 50-9\n\n由于 `CollapsingToolbarLayout` 元素的 `scrollFlags` 属性包含 `enterAlways` 选项，向下滚动动作将导致应用栏再次展开。\n\
  \n要固定工具栏使其在向上滚动动作期间不再移出视图，请将 `activity_main.xml` 文件中 `CollapsingToolbarLayout` 元素的\
  \ `layout_scrollFlags` 属性中的 `enterAlways` 替换为 `exitUntilCollapsed`，修改如下所示：\n\n```xml\n\
  <com.google.android.material.appbar.CollapsingToolbarLayout\n    android:id=\"@+id/collapsing_toolbar\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_scrollFlags=\"scroll|exitUntilCollapsed\"\n    android:fitsSystemWindows=\"\
  true\"\n    app:expandedTitleMarginBottom=\"30dp\"\n    app:expandedTitleMarginStart=\"\
  15dp\"\n    app:expandedTitleMarginEnd=\"64dp\">\n```\n\n### 50.5 修改标题和遮罩颜色\n\n\
  作为最后一个任务，编辑 `MainActivity.java` 文件并在 `onCreate()` 方法中添加一些代码来更改折叠实例的标题并设置不同的遮罩颜色（注意遮罩颜色也可以在布局文件中设置）：\n\
  \n```java\npackage com.ebookfrenzy.carddemo;\n\nimport com.google.android.material.appbar.CollapsingToolbarLayout;\n\
  import android.graphics.Color;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        binding\
  \ = ActivityMainBinding.inflate(getLayoutInflater());\n        setContentView(binding.getRoot());\n\
  \        setSupportActionBar(binding.toolbar);\n        binding.collapsingToolbar.setTitle(\"\
  My Toolbar Title\");\n        binding.collapsingToolbar.setContentScrimColor(Color.GREEN);\n\
  \        layoutManager = new LinearLayoutManager(this);\n        binding.contentMain.recyclerView.setLayoutManager(layoutManager);\n\
  \        adapter = new RecyclerAdapter();\n        binding.contentMain.recyclerView.setAdapter(adapter);\n\
  \    }\n```\n\n最后运行一次应用程序，注意新标题出现在应用栏中，并且滚动会导致工具栏在退回时过渡到绿色。\n\n50.6 总结\n\n大多数 Android\
  \ 应用顶部的应用栏可以由多个元素组成，包括工具栏、标签布局和图像。当嵌入在 `CoordinatorLayout` 父容器时，提供了多种选项来控制应用栏响应活动主要内容滚动事件的行为。为了对这种行为进行更大的控制，`CollapsingToolbarLayout`\
  \ 管理器提供了一系列额外的控制级别，用于控制应用栏内容相对于滚动的展开和收缩。\n\n# 51 Android Studio Primary-Detail Flow\
  \ 教程\n\n本章将介绍 Primary/Detail 用户界面设计概念，然后详细探讨包含在 Android Studio 一带的 Primary/Detail\
  \ Flow 模板的组成元素。随后，我们将创建一个示例应用程序，演示修改模板以满足应用程序特定需求的步骤。\n\n## 51.1 The Primary/Detail\
  \ Flow\n\n\n\n主/详情流（Primary/detail flow）是一种界面设计概念，其中向用户显示一组项目列表（称为主列表）。当用户从列表中选择一个项目时，与该项目相关的额外将在详情面板（detail\
  \ pane）中呈现给用户。例如，一个电子邮件应用程序可能包含一个收件邮件主列表，其中包含发件人地址和邮件主题。从主列表中选择某封邮件后，邮件正文将显示在详情面板中。\n\
  \n在横屏模式的平板尺寸 Android 设备屏幕上，主列表显示在屏幕左侧边缘的狭窄垂直面板中。屏幕的其余部分则留给详情面板，这种布局被称为双窗格模式（two-pane\
  \ mode）。例如，图 51-1 展示了主/详情双窗格布局，其中列出了主项目，并在详情面板中显示了第一个项目的内容：\n\n![](img/as_detail_flow_tablet.jpg)\n\
  \n图 51-1\n\n在较小的手机尺寸 Android 设备上，主列表占据整个屏幕，而详情面板则显示在从主列表进行选择后出现的独立屏幕上。在这种模式下，详情屏幕包含一个返回主列表的操作栏条目。例如，图\
  \ 51-2 演示了在 4 英寸手机屏幕上同一项目列表的主屏幕和详情屏幕：\n\n![](img/as_detail_flow_phone.jpg)\n\n图\
  \ 51-2\n\n## 51.2 创建主/详情流 Activity\n\n在本章的下一节中，将详细介绍组成主/详情流模板的不同元素。实现此点的最佳方法是使用\
  \ `Primary/Detail Views Flow` 模板创建一个项目，并在处理信息时使用它。该项目随后将作为章节末尾教程的基础。\n\n从欢迎界面选择\
  \ `New Project`（新建项目）选项，在弹出的新项目对话框中，点击 `Next`（下一步）按钮之前，选择 `No Activity` 模板。\n\n\
  在 `Name` 字段中输入 `PrimaryDetailFlow` 并指定 `com.ebookfrenzy.primarydetailflow` 为包名。在点击\
  \ `Finish`（完成）按钮之前，将最小 API 级别（Minimum API level）设置改为 `API 26`：Android 8.0 (Oreo)，并将语言（Language）菜单改为\
  \ `Java`。\n\n## 51.3 添加主/详情流 Activity\n\n在 `Project` 工具窗口中，右键点击 `app` -> `java`\
  \ -> `com.ebookfrenzy.primarydetailflow` 项，并选择 `New` -> `Activity` -> `Primary/Detail\
  \ Views Flow` 菜单选项。在新的 Activity 对话框（图 51-3）中，点击 `Finish` 按钮之前，确保启用 `Launcher Activity`（启动\
  \ Activity）复选框：\n\n![](img/as_primary_detail_new.jpg)\n\n图 51-3\n\n## 51.4 修改主/详情流模板\n\
  \n虽然主/详情流模板的结构初看起来可能很困惑，但将会所示，对于许多主/详情实现需求，模板提供的大部分功能可以保持不变。\n\n在本章的剩余部分中，将修改 `PrimaryDetailFlow`\
  \ 项目，使主列表显示网站列表，并将详情面板更改为包含一个 `WebView` 对象而不是当前的 `TextView`。当用户选择某个网站时，相应的网页随后将在详情面板中加载并显示。\n\
  \n### 51.5 更改内容模型\n\n当前示例的内容由 `PlaceholderContent` 类文件定义。因此，首先选择 `PlaceholderContent.java`\
  \ 文件（位于 `Project` 工具窗口的 `app` -> `java` -> `com.ebookfrenzy.primarydetailflow` ->\
  \ `placeholder` 文件夹下）并查看代码。文件底部定义了一个名为 `PlaceholderItem` 的类声明，该类目前能够存储三个 `String`\
  \ 对象（代表内容和详情字符串）以及一个 `ID`。另一方面，更新后的项目需要每个项目对象包含一个 `ID` 字符串、一个网站名称字符串以及一个对应网站的 URL\
  \ 字符串。为了添加这些功能，修改 `PlaceholderItem` 类，使其读取内容如下：\n\n```java\npublic static class\
  \ PlaceholderItem {\n\n    public String id;\n\n    public String website_name;\n\
  \n    public String website_url;\n\n    public PlaceholderItem(String id, String\
  \ website_name,\n            String website_url)\n    {\n        this.id = id;\n\
  \        this.website_name = website_name;\n        this.website_url = website_url;\n\
  \    }\n\n    @Override\n    public String toString() {\n        return website_name;\n\
  \    }\n}\n```\n\n注意，封装类 `PlaceholderContent` 目前包含一个 `for` 循环，通过调用 `PlaceholderItem()`\
  \ 和 `makeDetails()` 添加了 25 个项目。大部分内容将不再需要，并应如下所示从类中删除：\n\n```java\npublic static\
  \ final Map<String, PlaceholderItem> ITEM_MAP = new HashMap<>(); // 逻辑占位\n// 实际代码逻辑位于\
  \ com.ebookfrenzy.primarydetailflow.placeholder\n```\n\n等待，根据提供的文本碎片代码块，以下是文中描述的重构逻辑：\n\
  \n```java\npublic static final Map<String, PlaceholderItem> ITEM_MAP = new HashMap<>();\n\
  private static int COUNT = 25;\n\nstatic {\n    // 添加示例项目。\n    for (int i = 1;\
  \ i <= COUNT; i++) {\n        addItem(new PlaceholderItem(String.valueOf(i), \"\
  Item \" + i, \"http://example.com\"));\n    }\n}\n\nprivate static void addItem(PlaceholderItem\
  \ item) {\n    ITEM_MAP.put(item.id, item);\n}\n\npublic static PlaceholderItem\
  \ createPlaceholderItem(int position) {\n    return PlaceholderItem(String.valueOf(position),\
  \ \"Item \" + position, \"http://example.com\");\n}\n\nprivate static String makeDetails(int\
  \ position) {\n    StringBuilder builder = new StringBuilder();\n    builder.append(\"\
  Details about Item: \").append(position);\n    for (int i = 0; i < position; i++)\
  \ {\n        builder.append(\"\\nMore details here.\");\n    }\n    return builder.toString();\n\
  }\n``` 注意：提供的文本代码较为混乱，已根据文中描述重建了逻辑。\n\n代码现在利用修改后的 `PlaceholderItem` 类来存储每个项目的 ID、名称和\
  \ URL。\n\n## 51.6 修改详情面板\n\n详情面板布局（用户从主列表选择项目时显示的屏幕）包含在 `activity_item_detail.xml`文件中，该文件包含一个用于显示实际详情内容的\
  \ `FrameContainerView` 实例。如果应用程序以单面板模式显示，框架容器将显示 `fragment_item_detail.xml` 文件中的布局，而多窗格模式将显示\
  \ `fragment_item_detail.xml (sw600dp)` 布局。\n\nAndroid Studio 为 `fragment_item_detail.xml`\
  \ 提供的模板布局包含一个带有应用栏、工具栏、浮动按钮和 `TextView` 的 `CoordinatorLayout`。对于此示例，我们只需要 `WebView`，因此打开此文件并删除布局中除\
  \ `item_detail_container` 以外的所有视图。最简单的方法如下所示，在 `Component Tree`（组件树）中选择所有不需要的视图，然后按删除键：\n\
  \n![](img/as_detail_pane_components.jpg)\n\n图 51-4\n\n从 `Palette` 的 `Widgets` 部分拖入\
  \ `WebView` 对象并将其放置在布局画布中心，然后将 `id` 改为 `website_detail`。\n\n\n\n\n接下来，编辑 `fragment_item_detail.xml`\
  \ (`sw600dp`) 文件，在将 `WebView` 拖放到布局之前，删除默认的 `TextView` 实例，并再次将 `id` 更改为 `website_detail`。这两个文件的布局现在都应该类似于图\
  \ 51-5：\n\n![](img/as_3.5_master_detail_webview.jpg)\n\n图 51-5\n\n### 51.7 修改 ItemDetailFragment\
  \ 类\n\n此时，用户界面的详情面板已经过修改，但相应的 Java 类仍然设计为处理 `TextView` 对象而不是 `WebView` 对象。通过在项目（Project）工具窗口中双击\
  \ `ItemDetailFragment.java` 文件来加载该类的源代码。\n\n若要加载与当前选中项目对应的网页 URL，只需要更改几行代码。完成此更改后，代码应如下所示：\n\
  \n```java\n.\n.\n\nimport android.webkit.WebResourceRequest;\n\nimport android.webkit.WebView;\n\
  import android.webkit.WebViewClient;\n.\n.\n\npublic class ItemDetailFragment extends\
  \ Fragment {\n.\n.\n    @Override\n    public View onCreateView(LayoutInflater inflater,\
  \ ViewGroup container,\n                             Bundle savedInstanceState)\
  \ {\n        binding = FragmentItemDetailBinding.inflate(inflater, container, false);\n\
  \        View rootView = binding.getRoot();\n        mToolbarLayout = rootView.findViewById(R.id.toolbar_layout);\n\
  \        mTextView = binding.ItemDetail;\n        updateContent();\n        rootView.setOnDragListener(dragListener);\n\
  \        return rootView;\n    }\n.\n.\n\n    private void updateContent() {\n \
  \       if (mItem != null) {\n            binding.websiteDetail.setWebViewClient(new\
  \ WebViewClient(){\n                @Override\n                public boolean shouldOverrideUrlLoading(\n\
  \                        WebView view, WebResourceRequest request) {\n         \
  \           return super.shouldOverrideUrlLoading(\n                           \
  \         view, request);\n                }\n            });\n            binding.websiteDetail.loadUrl(mItem.website_url);\n\
  \        }\n    }\n.\n.\n}\n```\n\n在上述代码中，通过了更改，删除了对工具栏布局和项目详情文本元素的引用，这些元素之前已从 `fragment_item_detail.xml`\
  \ 文件中删除。\n\n接下来，修改 `updateContent()` 以访问 `website_detail` 视图（它以前是 `TextView`，现在是\
  \ `WebView`），并从选中的项目中提取网站的 URL。创建 `WebViewClient` 类的实例并分配 `shouldOverrideUrlLoading()`\
  \ 回调方法。实现该方法是为了强制系统使用 `WebView` 实例加载页面，而不是 `Chrome` 浏览器。\n\n### 51.8 修改 ItemListFragment\
  \ 类\n\n还需要对 `ItemListFragment.java` 文件进行细小的更改，以确保网站名称出现在主列表中。编辑此文件，找到 `onBindViewHolder()`\
